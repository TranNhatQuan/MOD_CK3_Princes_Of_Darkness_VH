l_english:
  available_because_of_dread_tt:0 "Tùy chọn này khả dụng nhờ [dread|E] của ngươi"
  intrigue_lifestyle_perk_indication:2 "Ngươi có thể nhận được một [perk|E] của [intrigue_lifestyle|E]"
  intrigue_scheming_focus_point_clear_gain:0 "Sự am hiểu của ngươi về [intrigue_lifestyle|E] tăng lên"

# Play Robin Hood, by Linnéa Thimrén
  intrigue_scheming.1001.t:0 "Lời Than Thở của [county.GetNameNoTierNoTooltip]"
  intrigue_scheming.1001.desc:0 ""Chúng ta cần những tài nguyên đó cho quân đội! Nếu một ngôi làng nhỏ ở [county.GetNameNoTier] phải chết đói—"\n\nCuộc tranh cãi gay gắt giữa các cận thần của ta theo ta ra khỏi căn phòng, và [councillor.GetTitledFirstName], đại diện của [county.GetNameNoTierNoTooltip], chào ta bằng đôi mắt mệt mỏi khi ta tiến lại gần."
  intrigue_scheming.1001.a:0 "Đây. Sắc lệnh này sẽ buộc chúng để ngươi yên."
  intrigue_scheming.1001.b:0 "Một ngôi làng thì đáng gì trong đại cục?"

# Invent code for messages, by Linnéa Thimrén
  intrigue_scheming.1011.t:0 "Nhu Cầu Về Bí Mật"
  intrigue_scheming.1011.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!"\nTa quay lại và thấy [council_member.GetTitledFirstName] đang chạy về phía mình, thở hổn hển. "Lại thêm một sứ giả được phát hiện đã chết, thưa [ROOT.Char.Custom('FormOfAddressForLiege')]. Cả túi lẫn thư đều bị lấy mất."\n\nLần thứ ba trong năm nay; một sự phiền toái đang dần trở thành mối lo. Nếu thư từ giữa ta và các mật thám của ta đang bị kẻ thù đọc thì sao?"
  intrigue_scheming.1011.a:0 "Hãy gọi một nhà mật mã học, bắt tay vào việc ngay!"
  intrigue_scheming.1011.a.flavor:0 "Ta sẽ cùng nhà mật mã học phát triển một hệ thống mật mã."
  intrigue_scheming.1011.b:0 "Từ nay ta cần cảnh giác hơn."

  intrigue_scheming.1012.desc:0 "Một đêm dài biến thành bình minh sớm, nhưng cả ta lẫn nhà mật mã học [cryptographer.GetTitledFirstName] đều chưa được nghỉ ngơi.\n\n"
  intrigue_scheming.1012.desc_archimedes:0 ""Công việc khổ sai này hẳn đã sớm kết thúc nếu chúng ta có Archimedes nghiên cứu về mật mã. Hết trang này đến trang khác về mã và sự mã hóa...""
  intrigue_scheming.1012.desc_al_kindi:0 ""Công việc khổ sai này hẳn đã sớm kết thúc nếu chúng ta có các công trình mật mã của Al-Kindi. Hết trang này đến trang khác về mã và sự mã hóa...""
  intrigue_scheming.1012.desc_ending:0 "\nNhững lời lẩm bẩm của [cryptographer.GetTitledFirstNamePossessive] vang đến tai ta qua làn sương buồn ngủ."
  intrigue_scheming.1012.a:0 "Chúng ta còn nhiều điều phải bàn, ngươi và ta..."
  intrigue_scheming.1012.a.duel_success:0 "[cryptographer.GetTitledFirstNameNoTooltip] và ta đã thành công phát triển một loại mật mã mới"
  intrigue_scheming.1012.a.duel_failure:0 "[cryptographer.GetTitledFirstNameNoTooltip] không thể dạy ta nghệ thuật của [cryptographer.GetHerHis]"
  intrigue_scheming.1012.b:0 "Hãy đánh thức ta nếu ngươi tìm ra điều gì."

  intrigue_scheming.1013.desc_alive:0 "Cuối cùng chúng ta cũng có kết quả! Sau vô số cuộc thảo luận dài và những đêm còn dài hơn, ta và [cryptographer.GetTitledFirstName] cuối cùng đã đi đến kết luận.\n\n"
  intrigue_scheming.1013.desc_dead:0 "Dù đã mất nhà mật mã học, cuối cùng ta cũng có được thứ gì đó!\n\n"
  intrigue_scheming.1013.desc_transposition:0 "Một hệ thống khá cơ bản, hoán đổi vị trí các chữ cái trong một từ, sẽ phục vụ chúng ta tốt nhất. Điều quan trọng nhất là người nhận hiểu được thông điệp mà không phải chờ đợi quá lâu."
  intrigue_scheming.1013.desc_substitution:0 "Một hệ thống thay thế chữ cái bằng con số sẽ phục vụ mục đích của chúng ta tốt nhất; kẻ thù sẽ nghĩ đó chỉ là thứ vô nghĩa!"
  intrigue_scheming.1013.desc_cipher:0 "Một loại mật mã khiến kẻ thù tin rằng mọi thông điệp bị chặn đều được viết bằng ngoại ngữ sẽ phục vụ chúng ta tốt nhất!"
  intrigue_scheming.1013.a:0 "Không ai có thể phá được thứ này!"
  intrigue_scheming.1013.a.tt:2 "Ngươi nhận được #T [THIS.Var('intrigue_exp_gain_value').GetValue]#! điểm [intrigue_rigueint|E]"
  intrigue_scheming.1013.b.tt:2 "Ngươi nhận được #T [THIS.Var('intrigue_exp_gain_value').GetValue]#! điểm [intrigue_9_14_20_18_9_7_21_5|E]"
  intrigue_scheming.1013.c.tt:2 "Ngươi nhận được #T [THIS.Var('intrigue_exp_gain_value').GetValue]#! điểm [intrigue_lqwuljxh|E]"

  intrigue_scheming.1014.desc_alive:0 "Đáng tiếc thay, dù đã cố gắng hết sức, ta vẫn không thể hiểu được nghệ thuật mật mã huyền bí của [cryptographer.GetTitledFirstNamePossessive]. \n\n[cryptographer.GetWomanMan] đảm bảo với ta rằng hệ thống mật mã [cryptographer.GetSheHe] phát triển là an toàn tuyệt đối, nhưng ta vẫn không thể xua đi cảm giác rằng đây là cơ hội bị bỏ lỡ để rèn luyện kỹ năng của mình."
  intrigue_scheming.1014.desc_dead:0 "Với cái chết của [cryptographer.GetTitledFirstName], nỗ lực tạo ra một mật mã bí mật để trao đổi thông tin nhạy cảm của ta buộc phải tạm dừng. \n\nTa chỉ có thể hy vọng rằng một cơ hội khác để cải thiện khả năng phòng thủ chống gián điệp của [ROOT.Char.Custom('GetCourt')] sẽ sớm xuất hiện."
  intrigue_scheming.1014.a:0 "Thật đáng tiếc..."

# Hired spies construct a report of your castle's weaknesses, by Linnéa Thimrén
  intrigue_scheming.1201.t:0 "Mọi Ngóc Ngách"
  intrigue_scheming.1201.desc:0 "Một đêm tối có thể khiến những bóng đổ trong hành lang của [ROOT.Char.Custom('FortifiedBuilding')] như sống dậy. Nguy cơ từ những kẻ xâm nhập trái phép dường như tăng lên với mỗi góc không được canh gác mà ta phát hiện.\n\nNếu chỉ một mình ta đã thấy nhiều sơ hở như vậy, hãy tưởng tượng những kẻ khác với cùng góc nhìn có thể làm được gì!"
  intrigue_scheming.1201.a:0 "Ta sẽ thuê một nhóm đặc vụ... #EMP kín đáo#!."
  intrigue_scheming.1201.b:0 "Chỉ góc nhìn của ta thôi cũng đủ!"

  intrigue_scheming.1202.desc:0 ""Đây là điều ngài nên làm..."\n[hired_spy.GetTitledFirstName], một #EMP chuyên gia#! trong nghệ thuật kín đáo, đã đi khắp [ROOT.Char.Custom('FortifiedBuilding')], khiến cả người hầu lẫn cận thần giật mình khi xuất hiện từ những góc tối nhất.\n\nTụm quanh những ghi chép của [hired_spy.GetHerHis], một kế hoạch chi tiết nhằm tăng cường an ninh dần hình thành."
  intrigue_scheming.1202.a:0 "Ta đã cảm thấy an toàn hơn rồi!"
  intrigue_scheming.1202.b:0 "Ta có thể có việc cho người tài như ngươi."
  intrigue_scheming.1202.b.tt:1 "[hired_spy.GetTitledFirstName] ở lại triều đình của ngươi"
  intrigue_scheming.1202.c:0 "Tất nhiên kiến thức này không thể để lan truyền rộng rãi."

# Meet a merchant from a far away land, by Linnéa Thimrén
  intrigue_scheming.1401.t:0 "Những Mẩu Tin Từ Phương Xa"
  intrigue_scheming.1401.desc_opening:0 "Khi ghé thăm khu chợ địa phương, một thương nhân từ phương xa thu hút sự chú ý của ta.\n\n"Lại gần đây, [ROOT.Char.Custom('FormOfAddressForLiege')]! Hãy chiêm ngưỡng những báu vật chưa từng thấy trên vùng đất này!"
  intrigue_scheming.1401.desc1:0 "Để mang được những món này ra ngoài ta phải luôn cảnh giác sau lưng. Chưa bao giờ dám ngủ mà nhắm cả hai mắt.""
  intrigue_scheming.1401.desc2:0 "Ta đã lẻn qua đám lính canh giữ những món đồ này. Ta hiểu con người lắm đấy.""
  intrigue_scheming.1401.desc3:0 "Ta phải hòa mình vào dân chúng để mang được những món này ra ngoài, quả là một trải nghiệm đầy gian nan.""
  intrigue_scheming.1401.desc_ending:0 "\n\nThương nhân này có lẽ còn mang lại cho ta nhiều hơn là những món đồ kỳ lạ từ phương xa."
  intrigue_scheming.1401.a:0 ""Hẳn là thú vị lắm khi ngươi đi nhiều như vậy!""
  intrigue_scheming.1401.a.tt:1 "#F Ngươi thuyết phục thương nhân chia sẻ hiểu biết của [dummy_gender.GetHerHis] với ngươi.#!"
  intrigue_scheming.1401.a.success:1 "Ngươi thuyết phục được thương nhân"
  intrigue_scheming.1401.a.failure:1 "Ngươi không thuyết phục được thương nhân"
  intrigue_scheming.1401.b:0 "[dummy_gender.GetSheHe|U] #EMP sẽ#! nói cho ta biết những gì [dummy_gender.GetSheHe] biết!"
  intrigue_scheming.1401.b.penalty:1 "Dân chúng phẫn nộ trước hành vi của ngươi"
  intrigue_scheming.1401.c:0 ""Số tiền này sẽ đủ cho cả món đồ lẫn thông tin.""

# Potential to turn a secret into a hook — or other things, by Petter Vilberg
  intrigue_scheming.1601.t:0 "Những Điều Ta Biết"
  intrigue_scheming.1601.desc:0 "Ta sẽ nói dối nếu bảo rằng ta không thấy thích thú chút nào khi nhìn [blackmailed_vassal.GetTitledFirstName] bối rối khi ta cho [blackmailed_vassal.GetHerHim] biết ta biết những gì.\n\nKéo ta ra một góc riêng, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('blackmailed_vassal'))] của ta muốn biết [blackmailed_vassal.GetSheHe] có thể làm gì để giải quyết chuyện này."
  intrigue_scheming.1601.a:0 "Một ít vàng có thể giải quyết nhiều chuyện."
  intrigue_scheming.1601.b:0 "Ta có người muốn gây ấn tượng..."
  intrigue_scheming.1601.c:0 "Không có gì phải làm cả. Ta chỉ muốn ngươi lo lắng."
 
# Gain Intrigue Mentor, by Linnéa Thimrén
  intrigue_scheming.2001.t:0 "Người Thầy"
  intrigue_scheming.2001.desc:0 ""Ta đã nhận thấy sự quan tâm của ngài đối với nghệ thuật của... sự mưu mô, thưa lãnh chúa. Ta có thể giúp ngài học hỏi nhiều hơn nữa."\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('future_mentor') )] [future_mentor.GetTitledFirstName] mỉm cười [future_mentor.Custom('quirk_pos_adverb')] khi tham gia cùng Ta tại [SelectLocalization( IsLandlessAdventurer(ROOT.Char),ROOT.Char.Custom('GetRandomCampBuilding'),'khu vườn của Ta')]. [future_mentor.GetSheHe|U] nổi tiếng về kỹ năng này, và Ta #EMP thực sự#! muốn đào sâu kiến thức về mưu lược."
  intrigue_scheming.2001.a:0 ""Hãy dẫn đường.""
  intrigue_scheming.2001.b:0 "Thật ngây thơ nếu tin tưởng người có kỹ năng như [future_mentor.GetHerHis]."

# Sneaky person seeks you out (might be an agent), by Linnéa Thimrén
  intrigue_scheming.2101.t:0 "Một Triển Vọng Đáng Chú Ý"
  intrigue_scheming.2101.desc:0 ""Ta được biết rằng ngài có thể đang cần người có... tài năng như ta, [ROOT.Char.Custom('FormOfAddressForLiege')]." Người quen mới của ta, [sneaky_person.GetTitledFirstName], tiến lại gần với nụ cười.\n\n"Nếu dịch vụ của ta có thể hữu ích, xin đừng ngần ngại yêu cầu.""
  intrigue_scheming.2101.a:0 "Có lẽ ta sẽ cần đến ngươi."
  intrigue_scheming.2101.b:0 "Ngươi không phải là [sneaky_person.GetWomanMan] phù hợp cho công việc này."

  intrigue_scheming.2102.t:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sneaky_person') )|U] Trung Thành"
  intrigue_scheming.2102.desc:0 "Ta đứng trong bóng tối của [ROOT.Char.Custom('GetCourtyard')], nhìn [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sneaky_person') )] mới của mình, [sneaky_person.GetTitledFirstName], biến mất vào màn đêm.\n\nLại thêm một buổi tối, lại một cuộc gặp gỡ bí ẩn, và sự nghi ngờ của ta đối với [sneaky_person.GetWomanMan] ngày càng lớn."
  intrigue_scheming.2102.a:0 "[sneaky_person.GetFirstNameNoTooltip], ngươi đang làm gì vậy?!"
  intrigue_scheming.2102.a.tt:1 "[sneaky_person.GetSheHe|U] không nhận ra cuộc điều tra của ngươi"
  intrigue_scheming.2102.b.tt:1 "[sneaky_person.GetSheHe|U] nhận ra ngươi đang điều tra [sneaky_person.GetHerHim]"
  intrigue_scheming.2102.b:0 "Có lẽ chẳng có gì."

  intrigue_scheming.2103.desc_not_noticed:0 ""[sneaky_person.GetSheHe|U] đang làm việc cho [sneaky_person_scheme_owner.GetTitledFirstName]?!"\n\nTrong [sneaky_person.GetTitledFirstNamePossessive] [ROOT.Char.Custom('GetChamberPlural')] ta tìm thấy một bức thư không để lại chỗ cho sự hiểu lầm. [sneaky_person.GetSheHe|U] đã âm mưu chống lại ta, đóng vai [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sneaky_person') )] trung thành chỉ để che mắt."
  intrigue_scheming.2103.desc_noticed:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], ngài cần gì ở ta?"\n\nDù đã cố gắng hết sức, ta dường như không tìm thấy điều gì đáng ngờ ở [sneaky_person.GetTitledFirstName], ngoài những thói quen đi lại ban đêm kỳ lạ của [sneaky_person.GetHerHis]."
  intrigue_scheming.2103.a:0 "Tống [sneaky_person.GetHerHim] vào ngục!"
  intrigue_scheming.2103.b:0 "Đuổi [sneaky_person.GetHerHim] đi."
  intrigue_scheming.2103.c:0 "Có lẽ ai cũng có... #EMP nhu cầu#! riêng của mình."

# Servants and Masters, by Petter Vilberg
  intrigue_scheming.3001.t:0 "Kẻ Hầu Và Chủ"
  intrigue_scheming.3001.desc:0 "[hooked_courtier.GetTitledFirstName], [new_target.GetTitledFirstNamePossessive] [new_target.Custom2('RelationToMe', SCOPE.sC('hooked_courtier'))], hiện đang nằm gọn trong tay ta. Tuy nhiên, với chiến lược thích hợp, ta có thể nâng lợi thế của mình lên cao hơn nữa.\n\nCó lẽ [hooked_courtier.GetFirstName] có thể được dùng để mở rộng ảnh hưởng của ta đối với [new_target.GetTitleTierName]?"
  intrigue_scheming.3001.a:0 "Ta sẽ cử [hooked_courtier.GetFirstNameNoTooltip] làm gián điệp riêng!"
  intrigue_scheming.3001.a.tt:1 "Nếu [new_target.GetFirstNameNoTooltip] có bất kỳ Bí Mật nào:\n   Hé lộ một trong các Bí Mật của [new_target.GetHerHis] cho ngươi"
  intrigue_scheming.3001.b:0 "Đây là cách để ngươi chắc chắn phát hiện ra bí mật của [new_target.GetFirstNamePossessiveNoTooltip]..."
  intrigue_scheming.3001.b.tt:1 "Nếu [new_target.GetFirstNameNoTooltip] có bất kỳ Bí Mật nào:\n   Hé lộ một trong các Bí Mật của [new_target.GetHerHis] cho ngươi\nNếu không:"
  intrigue_scheming.3001.b.success:0 "Bí mật bị ngụy tạo"
  intrigue_scheming.3001.b.success_tt:0 "[hooked_courtier.GetFirstNameNoTooltip] \"tìm thấy\" \"bằng chứng\" về một trong những Bí Mật của [new_target.GetFirstNamePossessiveNoTooltip]"
  intrigue_scheming.3001.b.failure:0 "Lời vu khống bị phát hiện"
  intrigue_scheming.3001.c:0 "Ngươi chính là chìa khóa cho một cái bẫy tuyệt đẹp, [hooked_courtier.GetFirstNameNoTooltip]!"
  intrigue_scheming.3001.c.success:0 "Vụ Giết Người Dàn Dựng"
  intrigue_scheming.3001.c.failure_secret:0 "Cái Bẫy Thất Bại"
  intrigue_scheming.3001.c.failure:0 "Cái Bẫy Bị Phát Hiện"
  intrigue_scheming.3001.c.failure.tt:1 "[new_target.GetFirstNameNoTooltip] biết được sự dính líu của ngươi trong vụ giết người"
  intrigue_scheming.3001.d:0 "Hãy cho thấy Ta có thể tiếp cận [new_target.GetHerHim] dễ dàng như thế nào."
  intrigue_scheming.3001.d.success:0 "Danh Tiếng Đi Trước Ta"
  intrigue_scheming.3001.d.failure:0 "Lời Đe Dọa Rỗng Tuếch"
  intrigue_scheming.3001.z:0 "Lan truyền vài tin đồn về sự đáng sợ của ta."

  intrigue_scheming.3003.desc:0 "[hooked_courtier.GetTitledFirstName] đã hoàn thành tốt công việc! Ta đã biết bí mật của [new_target.GetTitledFirstNamePossessive], và khoản nợ của [hooked_courtier.GetFirstNamePossessive] đối với Ta đã được xóa sạch."
  intrigue_scheming.3003.a:0 "Không tệ như ngươi tưởng, phải không?"
  intrigue_scheming.3003.b:0 "Và giờ đến lúc tống tiền..."
 
  intrigue_scheming.3004.desc:0 "[hooked_courtier.GetTitledFirstName] đã thất bại trong việc tìm kiếm bất kỳ thông tin buộc tội nào về [new_target.GetTitledFirstName]. Mặc dù vậy, kẻ ngốc đó vẫn khăng khăng rằng những nỗ lực của hắn đã giúp xóa sạch khoản nợ đối với Ta!"
  intrigue_scheming.3004.a:0 "Chẳng lẽ ta không đáng sợ như ta tưởng?"

  intrigue_scheming.3013.desc:0 "[hooked_courtier.GetTitledFirstName] không tìm thấy bất kỳ thông tin buộc tội nào về [new_target.GetTitledFirstName], nên thật may là ta đã chuẩn bị sẵn.\n\nĐột nhiên [new_target.GetFirstName] bị vây quanh bởi những tin đồn xấu xa, và ta tình cờ nắm giữ mọi bằng chứng cho chúng."
  intrigue_scheming.3013.a:0 "[ROOT.Char.GetFaith.TricksterGodName] giúp những kẻ biết tự giúp mình."

  intrigue_scheming.3014.desc:0 "[hooked_courtier.GetTitledFirstName] không tìm thấy bất kỳ thông tin buộc tội nào về [new_target.GetTitledFirstName]. Đáng tiếc thay, những tin đồn ta gieo rắc cẩn thận dường như không lan rộng, và chẳng ai tin vào các cáo buộc ta chuẩn bị dành cho [new_target.GetTitleTierName].\n\nTệ hơn nữa, các tin đồn giả đã bị lần ra là do ta đứng sau!"
  intrigue_scheming.3014.a:0 "Giữa bằng hữu thì vài lời nói dối vô hại có gì to tát?"

  intrigue_scheming.3021.desc:0 "Tiếng hét vang khắp [new_target.Custom('ResidenceBuilding')]. Những người hầu hốt hoảng chạy tới, để lại [new_target.GetTitledFirstName] bối rối nhìn thi thể đẫm máu của [hooked_courtier.GetTitledFirstName] nằm trong [new_target.GetHerHis] [new_target.Custom('GetChamberPlural')], con dao của [new_target.GetHerHis] nằm ngay bên cạnh.\n\n\"Ta đang ở ngoài vườn một mình, các ngươi phải tin ta!\" [new_target.GetSheHe] khẳng định với đám đông [new_target.Custom('GetCourtierPlural')] tụ tập. Ai mà tin nổi một lời bào chữa yếu ớt như vậy?"
  intrigue_scheming.3021.a:0 "Ta thích để lại những món quà cho người khác!"

  intrigue_scheming.3022.desc:0 "Nỗ lực đổ tội cho [new_target.GetTitledFirstName] của Ta đã kết thúc trong thảm họa! [hooked_courtier.GetFirstName] vẫn còn thở khi đám người hầu tìm thấy hắn đang chảy máu trong [new_target.Custom('GetChamberPlural')] của [new_target.GetTitleTierName].\n\nKhi [new_target.GetFirstName] đến, [hooked_courtier.GetFirstName] chỉ còn thều thào một hơi cuối cùng: "[ROOT.Char.GetTitledFirstName]...""
  intrigue_scheming.3022.a:0 "Nếu ta chưa giết [hooked_courtier.GetHerHim] thì giờ ta cũng sẽ làm!"

  intrigue_scheming.3023.desc:0 "Mọi thứ lẽ ra phải hoàn hảo... [hooked_courtier.GetTitledFirstName] lẽ ra phải được tìm thấy trong [new_target.Custom('GetChamberPlural')] của [new_target.GetTitleTierName], với cổ họng bị cắt bởi con dao của chính [new_target.GetTitleTierName], vào thời điểm hắn không có bằng chứng ngoại phạm.\n\nTuy nhiên, nửa tá người hầu có thể xác nhận [new_target.GetTitledFirstName] đã đi cưỡi ngựa vào ngày hôm đó, khiến hắn không thể là kẻ sát nhân."
  intrigue_scheming.3023.a:0 "Thật phí phạm một nạn nhân tốt!"

  intrigue_scheming.3031.desc:0 "Danh tiếng của ta — kẻ luôn đạt được điều mình muốn bằng mọi cách — mang lại lợi ích lớn. Khi nhiều chư hầu và người hầu run sợ trước ta, việc khiến kẻ khác cũng làm theo chẳng khó khăn gì.\n\nChỉ cần [hooked_courtier.GetTitledFirstName] tìm gặp [new_target.GetTitledFirstName] một mình vào buổi tối và trao lá thư mang con dấu của ta. [new_target.GetTitleTierName] giờ đã hiểu ta có thể chạm tới [new_target.GetHerHim] dễ dàng thế nào."
  intrigue_scheming.3031.a:0 "Gần như đáng tiếc. Ta vốn thích tự mình thuyết phục người khác..."

  intrigue_scheming.3032.desc:0 "[hooked_courtier.GetTitledFirstName] tìm gặp [new_target.GetTitledFirstName] một mình vào ban đêm và trao lá thư mang con dấu của ta, để cho thấy tầm với của ta lớn đến đâu. Nhưng hiệu quả lại không như mong muốn. Thay vào đó, [new_target.GetTitleTierName] lại thích thú kể cho mọi người nghe về \"những lời đe dọa suông\" của ta!"
  intrigue_scheming.3032.a:0 "Có lẽ ta sẽ cho ngươi thấy chúng suông đến mức nào..."


# The Weight of Influence, by Petter Vilberg
  intrigue_scheming.3041.t:0 "Sức Nặng Của Ảnh Hưởng"
  intrigue_scheming.3041.desc:0 "Trong khi Ta thích cách [vassal_target.GetTitledFirstName] sẵn lòng tuân lệnh Ta, thì [liege_target.Custom2('RelationToMe', SCOPE.sC('liege_target'))] của hắn, [liege_target.GetTitledFirstName], vẫn nằm ngoài tầm tay Ta. [vassal_target.GetFirstName] chính là [vassal_target.GetWomanMan] có thể giúp Ta thay đổi điều đó."
  intrigue_scheming.3041.a:0 "Chủ quân phải chịu trách nhiệm cho hành động của chư hầu..."
  intrigue_scheming.3041.a.success:0 "Nỗi Sợ Hậu Quả"
  intrigue_scheming.3041.a.failure:0 "Không Hề Ấn Tượng"
  intrigue_scheming.3041.b:0 "[vassal_target.GetFirstNameNoTooltip] sẽ giúp khiến [liege_target.GetHerHim] sợ ta!"
  intrigue_scheming.3041.b.torture_desc:0 "[vassal_target.GetFirstNameNoTooltip] có thể sẽ không còn nguyên vẹn sau việc này"
  intrigue_scheming.3041.b.success:0 "Bàn Tay Quyết Đoán Luôn Hiệu Quả!"
  intrigue_scheming.3041.b.failure:0 "[liege_target.GetFirstNameNoTooltip] không hề bị đe dọa"
  intrigue_scheming.3041.c:0 "Ta không cần ai giúp để đạt mục tiêu."

  intrigue_scheming.3042.desc:0 "[liege_target.GetTitledFirstName] nhìn đầy kinh ngạc, như thể sự phản bội của [vassal_target.GetTitledFirstNamePossessive] là một bất ngờ #EMP hoàn toàn#!. \"Ngươi sẵn sàng ủng hộ mọi yêu cầu của tên... tên [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('liege_target'))] này sao?!\"\n\n[vassal_target.GetFirstName] làm theo kế hoạch, nghiêm nghị gật đầu. Ta mỉm cười với con tốt mới sắp thuộc về mình. \"Đừng tưởng rằng [vassal_target.GetSheHe] chỉ có một mình.\""
  intrigue_scheming.3042.a:0 "Giờ thì, điều ta muốn ngươi làm là..."

  intrigue_scheming.3043.desc:0 ""Đừng tin rằng ta có thể bị ép buộc dễ dàng như vậy!" [liege_target.GetTitledFirstName] tuyên bố. [vassal_target.GetTitledFirstName] dường như thu mình lại, không còn sự tự tin khi đối mặt với Ta.\n\n[liege_target.GetTitleTierName] đã đập tan hy vọng của Ta. "Kẻ hạ cấp của ta biết vị trí của chúng." [vassal_target.GetFirstName] xác nhận điều đó bằng sự im lặng nhục nhã."
  intrigue_scheming.3043.a:0 "Có vẻ ta đã đi quá tay..."

  intrigue_scheming.3051.desc:0 "Ta đã dụ [liege_target.GetTitledFirstName] tới ngục tối của [vassal_target.GetTitledFirstNamePossessive], theo lời mời của [vassal_target.GetTitleTierName]. Ta đứng chờ ở đó, sẵn sàng tra tấn chủ nhà để phô bày quyền lực của mình. Nhưng [liege_target.GetFirstName] lại không phản ứng như ta mong đợi.\n\n\"Có vẻ như ngươi chưa từng làm việc này bao giờ!\"\nTa kinh ngạc nhìn khi [liege_target.GetSheHe] nắm quyền và khiến [vassal_target.GetFirstName] chịu đựng cho đến tận bình minh. Nhưng không hơn."
  intrigue_scheming.3051.a:0 "Thật là cảnh tượng kinh hoàng!"
  intrigue_scheming.3051.b:0 "Ta đã học được rất nhiều!"

  intrigue_scheming.3052.desc:0 "Ta đã dụ [liege_target.GetTitledFirstName] vào ngục tối của [vassal_target.GetTitledFirstNamePossessive], theo lời mời của [vassal_target.GetTitleTierName]. Ở đó, Ta đã tiết lộ rằng chủ nhà của chúng là một tù nhân ngay trong chính ngôi nhà của hắn.\n\nCó lẽ Ta đã hơi quá tay khi giữ mạng sống của [vassal_target.GetTitleTierName] trong tay mình, nhưng điều đó đã gửi đi một thông điệp tinh tế về việc Ta mong đợi sự phục tùng tuyệt đối."
  intrigue_scheming.3052.a:0 "Ngay cả giữa tiếng gào thét của [vassal_target.GetFirstNamePossessiveNoTooltip], [liege_target.GetFirstNameNoTooltip] cũng hiểu ý."

  intrigue_scheming.3053.desc:0 "Ta đã dụ [liege_target.GetTitledFirstName] vào ngục tối của [vassal_target.GetTitledFirstNamePossessive].\n\n[liege_target.GetFirstName] không hề sợ hãi trước màn tra tấn của Ta. "Loài hạ đẳng như ngươi sẽ không bao giờ làm ta sợ hãi, [ROOT.Char.GetTitledFirstName]!""
  intrigue_scheming.3053.a:0 "Ngay cả lời van xin của [vassal_target.GetFirstNamePossessiveNoTooltip] cũng không làm ta khá hơn sau chuyện đó."

# Fabricate Bastardy, by Petter Vilberg
  intrigue_scheming.3061.t:0 "Huyết Thống Mơ Hồ"
  intrigue_scheming.3061.desc:0 "Trong nhiều ngày Ta đã bị ám ảnh bởi dòng dõi của [target.GetDynasty.GetBaseName], và bây giờ Ta đã chắc chắn. Không đời nào [target.GetTitledFirstName] có thể chứng minh quan hệ cha con của [target.GetHerHis] [target.Custom2('RelationToMe', SCOPE.sC('heir'))], [heir.GetTitledFirstName]!\n\nNơi nào thiếu bằng chứng, bằng chứng có thể được tạo ra... Đã đến lúc Ta viết nên một sự thật mới cho nguồn gốc của [heir.GetFirstNamePossessive]!"
  intrigue_scheming.3061.a:0 "[new_father.GetTitledFirstNameNoTooltip] sẽ là một người cha tuyệt vời."
  intrigue_scheming.3061.b:0 "[mother.GetTitledFirstNameNoTooltip] qua lại với một tên hầu?! Thật ô nhục!"
  intrigue_scheming.3061.c:0 "Và ta sẽ đóng vai chính!"
  intrigue_scheming.3061.d:0 "Có lẽ toàn bộ lịch sử gia tộc này còn hữu dụng cho việc khác."
  intrigue_scheming.3061.success:0 "Bằng Chứng Mới"
  intrigue_scheming.3061.c.success_tt:0 "Ta sẽ có thể tiết lộ [heir.GetTitledFirstNameNoTooltip] là con hoang của ta"
  intrigue_scheming.3061.failure:0 "Xúc Phạm Huyết Thống"
  intrigue_scheming.3061.a.success_tt:0 "Ta sẽ có thể tiết lộ [heir.GetTitledFirstNameNoTooltip] là con hoang của [new_father.GetTitledFirstNameNoTooltip]"
  intrigue_scheming.3061.b.success_tt:0 "Ta sẽ có thể tiết lộ [heir.GetTitledFirstNameNoTooltip] là con hoang của [commoner_target.GetTitledFirstNameNoTooltip]"

  intrigue_scheming.3062.opening:0 "Những lời đồn đã bắt đầu lan truyền, đúng như ta mong đợi. Tất nhiên chẳng ai có thể nói chắc điều gì — và đó chính là mục đích!"
  intrigue_scheming.3062.ending:0 "Các tay sai của ta báo rằng ngay cả [target.GetTitledFirstName] cũng nhìn [heir.GetTitledFirstName] với sự nghi ngờ trong ánh mắt của [target.GetHerHis], và nhìn [new_father.GetTitledFirstName] với sự bất tín."
  intrigue_scheming.3062.a:0 "Ta sẽ công bố \"bằng chứng\" của mình!"
  intrigue_scheming.3062.b:0 "Thời điểm vẫn chưa thích hợp."
  intrigue_scheming.3062.b.tt:1 "#F Tạm thời giữ kín \"bí mật\" này#!"

  intrigue_scheming.3063.opening:0 "\"Ha, những tin đồn này thật lố bịch! Chỉ là [ROOT.Char.GetTitledFirstName] đang lan truyền những lời dối trá bẩn thỉu.\"\n\nCác tay sai của ta báo rằng [new_father.GetTitledFirstName] đã phủ nhận mọi cáo buộc rằng [heir.GetTitledFirstName] có thể là [target.GetHerHis] [heir.Custom('GetDaughterSon')]."
  intrigue_scheming.3063.ending:0 "\n\n[target.GetTitledFirstName] dường như cũng không tin rằng tin đồn của ta có chút sự thật nào, và đã tố cáo ta là một kẻ nói dối đáng xấu hổ, không tôn trọng trật tự chính đáng của thế gian."
  intrigue_scheming.3063.a:0 "Ta phản đối! Ta chẳng thấy xấu hổ chút nào!"

  intrigue_scheming.3064.ending:0 "Các tay sai của ta báo rằng ngay cả [target.GetTitledFirstName] cũng bắt đầu nghi ngờ, và nhìn [mother.GetTitledFirstName], [heir.GetTitledFirstName] cùng [commoner_target.GetTitledFirstName] với ánh mắt bất tín."

  intrigue_scheming.3065.opening:0 "\"Như thể ta sẽ để một kẻ thường dân như [commoner_target.GetTitledFirstName] chạm vào mình vậy.\"\n\nCác tay sai của ta báo rằng [mother.GetTitledFirstName] đã không chậm trễ một giây nào trong việc phủ nhận những tin đồn ta cố gieo rắc về [mother.GetHerHim]."

  intrigue_scheming.3066.desc:0 "Ngày tháng, những chuyến đi, khả năng có các cuộc gặp bí mật... tất cả đều ở đó, và với những tin đồn ta đã gieo rắc, ngay cả [target.GetTitledFirstName] cũng bắt đầu nghi ngờ về việc ai mới là cha của [heir.GetTitledFirstName].\n\nChỉ còn là vấn đề thời gian trước khi ai đó đi đến kết luận rằng ta là ứng cử viên hợp lý..."
  intrigue_scheming.3066.a:0 "Lại đây nào, [heir.GetFirstNameNoTooltip]!"
  intrigue_scheming.3066.b:0 "Mọi thứ rồi sẽ đến đúng lúc."

  intrigue_scheming.3067.opening:0 "Sau bao lời đồn ta đã rải về [mother.GetHerHim], ta không ngờ lại phải đối mặt trực tiếp với [mother.GetTitledFirstName].\n\n"Sao ngươi dám buông những lời bỉ ổi như vậy về ta và [heir.Custom('GetDaughterSon')] của ta?!" Lời của [mother.GetHerHis|U] còn chưa đau bằng cái tát bất ngờ giáng thẳng vào mặt ta. "Đó sẽ là lần duy nhất trong đời ngươi được chạm đến ta!""
  intrigue_scheming.3067.a:0 "Có vẻ ta đã đánh giá sai đối thủ của mình..."

# Interrogation, by Sean Hughes
  intrigue_scheming.4021.t:0 "Thẩm Vấn"
  intrigue_scheming.4021.desc:0 "Dựa trên những gì ta đã thu thập được, ta nghi ngờ mạnh mẽ rằng [prisoner.GetTitledFirstName] biết một bí mật mà ta chưa hay. Mà hiện giờ [prisoner.GetHerHim] đang nằm trong tay ta, đây là cơ hội hoàn hảo để dùng bất cứ biện pháp nào cần thiết nhằm moi ra sự thật..."
  intrigue_scheming.4021.a:0 "Đề nghị thả tự do cho [prisoner.GetHerHim] để đổi lấy thông tin."
  intrigue_scheming.4021.a.success:0 "[prisoner.GetTitledFirstName] chấp nhận đề nghị của ta"
  intrigue_scheming.4021.a.failure:0 "[prisoner.GetTitledFirstName] từ chối đề nghị của ta"
  intrigue_scheming.4021.b:0 "Trò đấu trí thường khiến người ta lộ ra nhiều điều..."
  intrigue_scheming.4021.b.success:0 "Ta lừa được [prisoner.GetTitledFirstName] tiết lộ điều [prisoner.GetSheHe] biết"
  intrigue_scheming.4021.b.failure:0 "[prisoner.GetTitledFirstName] chống lại được mưu mẹo tâm lý của ta"
  intrigue_scheming.4021.c:0 "Đe dọa tra tấn [prisoner.GetHerHim] nếu [prisoner.GetSheHe] không thú nhận!"
  intrigue_scheming.4021.c.success:0 "Những lời đe dọa khiến [prisoner.GetTitledFirstName] hoảng sợ và thú nhận"
  intrigue_scheming.4021.c.failure:0 "Những lời đe dọa dường như không khiến [prisoner.GetTitledFirstName] nao núng"
  intrigue_scheming.4021.success:0 "Ta phát hiện ra một [secret|E] mà [prisoner.GetTitledFirstName] biết"
  intrigue_scheming.4021.failure:0 "Ta không thu được điều gì quan trọng"

# Passing Suspicion, by Sean Hughes
  intrigue_scheming.4040.t:0 "Gieo Rắc Nghi Kỵ"
  intrigue_scheming.4040.desc:0 "Ai cũng biết rằng [ROOT.Char.Custom('GetCourtierPlural')] luôn bày mưu tính kế, nhưng Ta có thể biến điều này thành lợi thế cho mình.\n\nNếu Ta giữ cho đám [ROOT.Char.Custom('GetCourtierPlural')] nghi ngờ lẫn nhau và xao nhãng vì đấu đá nội bộ, chúng sẽ không còn thời gian hay nguồn lực để âm mưu chống lại Ta!"
  intrigue_scheming.4040.a:0 "Ta sẽ bắt đầu tung tin đồn ngay!"
  intrigue_scheming.4040.a.success:0 "Những lời đồn khiến [ROOT.Char.Custom('GetCourtierPlural')] của ta mất lòng tin lẫn nhau"
  intrigue_scheming.4040.a.success.tt:0 "[courtier_1.GetFirstName], [courtier_2.GetFirstName] và [courtier_3.GetFirstName] mất #N [EmptyScope.ScriptValue('medium_positive_opinion')|N0]#! [opinion|E] đối với nhau."
  intrigue_scheming.4040.a.success.desc:0 "Những lời đồn ta lan truyền trong [ROOT.Char.Custom('GetCourt')] đã gieo rắc nghi kỵ giữa vài [ROOT.Char.Custom('GetCourtierPlural')] của ta"
  intrigue_scheming.4040.a.failure:0 "Những lời đồn bị coi là chuyện vớ vẩn vô nghĩa"
  intrigue_scheming.4040.a.failure.tt:1 "Những lời đồn ngươi lan trong [ROOT.Char.Custom('GetCourt')] bị xem là nhảm nhí"
  intrigue_scheming.4040.b:0 "Chỉ cần ta cài vài gián điệp giữa họ là đủ."
  intrigue_scheming.4040.c.dread:0 "[ROOT.Char.Custom('GetCourtierPlural')] của ta vốn đã biết không nên mưu hại ta!"
  intrigue_scheming.4040.c.dread.tt:1 "Lựa chọn này khả dụng nhờ [dread|E] của ngươi rất cao."

# Information Brokering, by Sean Hughes
  intrigue_scheming.4050.t:0 "Buôn Bán Tin Tức"
  intrigue_scheming.4050.desc.start:0 "Ta tin rằng [buyer.GetTitledFirstName] sẽ rất quan tâm đến thông tin ta vừa nắm được, cho thấy rằng"
  intrigue_scheming.4050.desc.lover:1 "[buyer.GetHerHis] [buyer.Custom2('RelationToMeShort', SCOPE.sC('owner'))], [owner.GetTitledFirstName], đang tư thông với [target.GetTitledFirstName]..."
  intrigue_scheming.4050.desc.incest:2 "[buyer.GetHerHis] [buyer.Custom2('RelationToMeShort', SCOPE.sC('owner'))], [owner.GetTitledFirstName], và [owner.GetFirstNamePossessiveNoTooltip], [owner.Custom2('RelationToMeShort', SCOPE.sC('target'))], [target.GetTitledFirstName] đã có quan hệ xác thịt với nhau..."
  intrigue_scheming.4050.desc.pregnancy:1 "[buyer.GetHerHis] [buyer.Custom2('RelationToMeShort', SCOPE.sC('owner'))], [owner.GetTitledFirstName], đang mang thai con của [target.GetTitledFirstName]..."
  intrigue_scheming.4050.desc.bastard:3 "[buyer.GetHerHis] [buyer.Custom2('RelationToMeShort', SCOPE.sC('target'))], [target.GetTitledFirstName], thực ra là con của [target.GetRealFather.GetTitledFirstName]..."
  intrigue_scheming.4050.desc.murderattempt:0 "[owner.GetTitledFirstName] đứng sau một âm mưu ám sát bất thành nhằm vào [target.GetTitledFirstName]..."
  intrigue_scheming.4050.desc.murderattemptself:0 "[owner.GetTitledFirstName] đứng sau một âm mưu ám sát bất thành nhằm vào [target.GetHerHim]..."
  intrigue_scheming.4050.desc.murder:0 "[owner.GetTitledFirstName] chính là kẻ đã sát hại [buyer.GetHerHis] [buyer.Custom2('RelationToMeShort', SCOPE.sC('target'))] [target.GetTitledFirstName]..."
  intrigue_scheming.4050.desc.end:0 "\n\nBiết đâu [buyer.GetSheHe] sẽ sẵn sàng trả giá hậu hĩnh để đổi lấy thông tin này?"
  intrigue_scheming.4050.a:0 "Ta sẽ bán thông tin này cho [buyer.GetHerHim] để lấy vàng."
  intrigue_scheming.4050.b:0 "Bí mật đổi bí mật — công bằng."
  intrigue_scheming.4050.b.tt:1 "[buyer.GetTitledFirstName] sẽ tiết lộ cho ngươi một bí mật mà [buyer.GetSheHe] biết"
  intrigue_scheming.4050.c:0 "Ta sẽ nói cho hắn biết chỉ để đổi lấy một ân huệ."
  intrigue_scheming.4050.c.rival:0 "Coi như món quà hòa giải giữa chúng ta."
  intrigue_scheming.4050.c.opinion:0 "Thiện ý của [buyer.GetHerHis|U] là đủ."
  intrigue_scheming.4050.d:0 "Tri thức là quyền lực — ta không cho đi dễ dàng."
  intrigue_scheming.4050.success:0 "[buyer.GetTitledFirstName] chấp nhận đề nghị của ngươi"
  intrigue_scheming.4050.failure:0 "[buyer.GetTitledFirstName] từ chối đề nghị của ngươi"

  intrigue_scheming.4051.desc.start:0 "[seller.GetTitledFirstName] tìm đến ta, nói rằng [seller.GetSheHe] đã phát hiện"
  intrigue_scheming.4051.desc.lover:0 "một người trong gia đình thân cận của ta đang ngoại tình."
  intrigue_scheming.4051.desc.bastard:0 "dòng dõi của ta có thể bị nghi ngờ nếu ta không hành động."
  intrigue_scheming.4051.desc.murderattempt:0 "ai là kẻ đứng sau âm mưu ám sát bất thành nhằm vào [target.GetTitledFirstName]."
  intrigue_scheming.4051.desc.murderattemptself:0 "ai là kẻ đứng sau âm mưu ám sát bất thành nhằm vào ta."
  intrigue_scheming.4051.desc.murder:0 "ai là kẻ đã sát hại [buyer.Custom2('RelationToMeShort', SCOPE.sC('target'))] của ta, [target.GetTitledFirstName]."
  intrigue_scheming.4051.desc.incest:0 "sự tồn tại của mối loạn luân trong chính gia đình ta!"
  intrigue_scheming.4051.desc.middle:0 "\n\n[seller.GetSheHe|U] đề nghị cung cấp toàn bộ những gì [seller.GetSheHe] biết, bao gồm tên tuổi và bằng chứng,"
  intrigue_scheming.4051.desc.gold:0 "đổi lấy một khoản vàng."
  intrigue_scheming.4051.desc.secret:0 "đổi lấy chi tiết của một bí mật khác mà ta biết."
  intrigue_scheming.4051.desc.favor:0 "đổi lấy một ân huệ trong tương lai."
  intrigue_scheming.4051.desc.rival:0 "như một cử chỉ hòa giải giữa chúng ta."
  intrigue_scheming.4051.desc.opinion:0 "như một hành động thiện chí."
  intrigue_scheming.4051.a:0 "Ta phải biết sự thật!"
  intrigue_scheming.4051.a.tt:1 "Ngươi biết được chi tiết của bí mật này"
  intrigue_scheming.4051.a.opinion:0 "Thật hào phóng!"
  intrigue_scheming.4051.b:0 "Có những bí mật tốt hơn hết nên để yên..."

  intrigue_scheming.4052.desc:0 "Sức hấp dẫn của bí mật ta nắm giữ quá lớn để bỏ qua, và [buyer.GetTitledFirstName] đã chấp nhận đề nghị của ta. Nếu tiếp tục dò la khắp nơi, có lẽ ta còn có thể dàn xếp thêm nhiều thương vụ như thế..."
  intrigue_scheming.4052.a:0 "Cơ hội thật rộng mở!"

  intrigue_scheming.4053.desc:0 "Liệu [buyer.GetTitledFirstName] có tin Ta hay không khi Ta nói mình có thông tin về gia đình hắn? Dù thế nào, hắn đã từ chối các điều khoản của Ta và khiến Ta ra về tay trắng."
  intrigue_scheming.4053.a:0 "Ta sẽ phải tìm cách khác để dùng thông tin này..."

  intrigue_scheming.4054.desc.start:0 "Sau khi xem xét những tài liệu từ [seller.GetTitledFirstName], ta nhận ra rằng"
  intrigue_scheming.4054.desc.lover:1 "[owner.GetTitledFirstName], [buyer.Custom2('RelationToMeShort', SCOPE.sC('owner'))] của ta, đang tư thông với [target.GetTitledFirstName]!"
  intrigue_scheming.4054.desc.incest:1 "[owner.GetTitledFirstName], [buyer.Custom2('RelationToMeShort', SCOPE.sC('owner'))] của ta, và [target.GetTitledFirstName], [buyer.Custom2('RelationToMeShort', SCOPE.sC('target'))] của ta, đã có quan hệ xác thịt với nhau!"
  intrigue_scheming.4054.desc.pregnancy:1 "[owner.GetTitledFirstName], [buyer.Custom2('RelationToMeShort', SCOPE.sC('owner'))] của ta, đang mang thai con của [target.GetTitledFirstName]!"
  intrigue_scheming.4054.desc.bastard:2 "[target.GetTitledFirstName], [buyer.Custom2('RelationToMeShort', SCOPE.sC('target'))] của ta, thực ra là con của [target.GetRealFather.GetTitledFirstName]!"
  intrigue_scheming.4054.desc.murderattempt:0 "[owner.GetTitledFirstName] đứng sau âm mưu ám sát bất thành nhằm vào [target.GetTitledFirstName]!"
  intrigue_scheming.4054.desc.murderattemptself:0 "[owner.GetTitledFirstName] đứng sau âm mưu ám sát bất thành nhằm vào ta!"
  intrigue_scheming.4054.desc.murder:1 "[owner.GetTitledFirstName] chính là kẻ sát hại [target.GetTitledFirstName], [buyer.Custom2('RelationToMeShort', SCOPE.sC('target'))] của ta!"
  intrigue_scheming.4054.a:0 "Ít ra giờ ta đã biết."
  intrigue_scheming.4054.a.incest:0 "Thật trái tự nhiên! Một sự xúc phạm tới [ROOT.Char.GetFaith.HighGodName]!"
  intrigue_scheming.4054.a.incest.deviant:0 "Ồ, thật kích thích!"
  intrigue_scheming.4054.a.incest.accepted:0 "Có gì sai với chuyện đó sao?"
  intrigue_scheming.4054.a.murder:0 "Tên khốn xảo quyệt!"
  intrigue_scheming.4054.a.bastard:0 "Ta đã bị phản bội!"

# Special Chain — Convince Courtier to Share Spy-Secrets 
  intrigue_scheming_special.1001.t:0 "Đóng Kịch"
  intrigue_scheming_special.1001.desc:0 "Một lời thì thầm vô tình nghe được cùng ánh nhìn sắc lạnh là những mảnh ghép cuối cùng khiến bức tranh trở nên rõ ràng. [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('courtier_spy'))] của ta, [courtier_spy.GetTitledFirstName], tinh thông nghệ thuật mưu kế hơn nhiều so với những gì [courtier_spy.GetSheHe] vẫn để mọi người tin.\n\nBiết rằng trong triều có một [courtier_spy.GetWomanMan] như vậy khiến ta khá lo lắng. Tuy nhiên, ta có thể học được rất nhiều nếu khiến [courtier_spy.GetHerHim] tin tưởng ta."
  intrigue_scheming_special.1001.a:0 "Ta sẽ khiến [courtier_spy.GetHerHim] tin rằng chúng ta cùng một loại người!"
  intrigue_scheming_special.1001.b:0 "Rủi ro quá lớn, #EMP ta#! không thể tin #EMP [courtier_spy.GetHerHim]#!."
  intrigue_scheming_special.1001.c:0 "[courtier_spy.GetSheHe|U] phải biến mất!"

  intrigue_scheming_special.1002.desc:0 "Phải mất nhiều ngày, nhưng cuối cùng ta cũng #EMP tình cờ#! bắt gặp [courtier_spy.GetTitledFirstName] khi [courtier_spy.GetSheHe] đang ở một mình. "[courtier_spy.GetLadyLord|U] [courtier_spy.GetTitledFirstNameNoTooltip], ta vốn định—"\n"Nếu ngươi bước vào phòng và thấy phối ngẫu của mình đang quát mắng một cậu hầu trẻ vì làm rơi chiếc đĩa, ngươi sẽ làm gì?"\n\nPhải chăng [courtier_spy.GetSheHe] đang thử ta? Có lẽ đây là cơ hội để ta khiến [courtier_spy.GetHerHim] tin rằng chúng ta có nhiều điểm chung."
  intrigue_scheming_special.1002.a:0 "Dĩ nhiên cậu hầu sẽ bị trừng phạt."
  intrigue_scheming_special.1002.b:0 "Ai cũng mắc sai lầm, ta sẽ tha thứ cho cậu hầu."
  intrigue_scheming_special.1002.c:0 "Cả hai phải nói cho ta biết chuyện gì đã xảy ra."
  intrigue_scheming_special.1002.d:0 "Ta chắc rằng họ có thể xử lý tốt hơn nếu không có ta."
  intrigue_scheming_special.1002.e:0 "Ta sẽ khuyến khích đối thoại, chuyện trò giải quyết được hầu hết vấn đề."
  intrigue_scheming_special.1002.f:0 "Cãi vã ư? Ta sẽ rời đi nhanh nhất có thể."
  intrigue_scheming_special.1002.g:0 "Ta sẽ tham gia la hét cùng họ!"
  intrigue_scheming_special.1002.h:0 "Ta sẽ yêu cầu cả hai trình bày quan điểm của mình."

  intrigue_scheming_special.1003.desc_good:0 ""Hm." [courtier_spy.GetSheHe|U] dừng lại suy nghĩ một lúc trước khi tiếp tục.\n\n"
  intrigue_scheming_special.1003.desc_bad:0 ""Hm." [courtier_spy.GetSheHe|U] tạm dừng, nhăn mặt như vừa nếm phải thứ gì đó chua chát, trước khi tiếp tục.\n\n"
  intrigue_scheming_special.1003.desc:0 ""Giữa lúc đang hành quân ra trận, khi ngươi vừa dựng trại, một sĩ quan tiến đến hỏi nên xử lý thế nào với một gián điệp vừa bị bắt.""
  intrigue_scheming_special.1003.a:0 "Lấy tên gián điệp làm gương!"
  intrigue_scheming_special.1003.b:0 "Trước hết ta sẽ đảm bảo gián điệp được đối xử tử tế."
  intrigue_scheming_special.1003.c:0 "Gián điệp ư? Không quan trọng. Chúng ta tiếp tục hành quân!"
  intrigue_scheming_special.1003.d:0 "Ta tin viên sĩ quan biết phải làm gì."
  intrigue_scheming_special.1003.e:0 "Ta sẽ nói chuyện với gián điệp, xem hắn nói gì."
  intrigue_scheming_special.1003.f:0 "Ta sẽ giao cho viên sĩ quan xử lý rồi để ta yên."
  intrigue_scheming_special.1003.g:0 "Gián điệp sao?! Chúng ta sẽ không bao giờ— chuyện đó không thể xảy ra!"
  intrigue_scheming_special.1003.h:0 "Rõ ràng gián điệp còn nhiều điều phải khai, sớm hay muộn. "

  intrigue_scheming_special.1004.desc_good:0 "[courtier_spy.GetSheHe|U] gật đầu với [courtier_spy.GetHerselfHimself] trước khi đưa ra tình huống tiếp theo.\n\n"
  intrigue_scheming_special.1004.desc_bad:0 "Lông mày [courtier_spy.GetHerHis|U] hạ thấp xuống, ánh mắt [courtier_spy.GetHerHis] trở nên lạnh lẽo.\n\n"
  intrigue_scheming_special.1004.desc:0 ""Ngươi đưa ra một quyết định — ví dụ tăng toàn bộ thuế trong một hạt — và rồi nghe tin rằng một chư hầu của ngươi công khai chất vấn quyết định ấy. Ngươi phản ứng thế nào?""
  intrigue_scheming_special.1004.a:0 "Trừng phạt là lựa chọn duy nhất."
  intrigue_scheming_special.1004.b:0 "Mỗi người đều có quan điểm riêng, điều đó không làm ta bận tâm."
  intrigue_scheming_special.1004.c:0 "Không ai được phép chất vấn ta như vậy! Ta sẽ đối mặt với chư hầu đó."
  intrigue_scheming_special.1004.d:0 "Nếu chư hầu của ta nghĩ đó là quyết định tồi, có lẽ đúng là vậy."
  intrigue_scheming_special.1004.e:0 "Toàn bộ triều đình sẽ nghe về mọi sai lầm của chư hầu đó."
  intrigue_scheming_special.1004.f:0 "Ta sẽ cố phớt lờ sự xúc phạm ấy, không cần làm lớn chuyện."
  intrigue_scheming_special.1004.g:0 "Ừ, ta sẽ đối mặt với hắn. Thật ồn ào."
  intrigue_scheming_special.1004.h:0 "Bất đồng ý kiến nên được giải quyết bằng thảo luận."

  intrigue_scheming_special.1099.desc_won:0 "Khuôn mặt [courtier_spy.GetHerHis|U] bừng sáng với một nụ cười ấm áp bất ngờ. "Ngươi dường như là một [ROOT.Char.GetWomanMan] có phán đoán sáng suốt."\n\n[courtier_spy.GetSheHe|U] [courtier_spy.Custom('quirk_pos_present')], trước khi bước dọc hành lang với những bước chân lặng lẽ. "Xin mời, đi cùng ta. Chúng ta còn nhiều điều cần bàn.""
  intrigue_scheming_special.1099.desc_lost:0 "[courtier_spy.GetSheHe|U] cau mày và lùi lại một bước. "Ta sẽ cảm kích nếu ngươi không tiếp cận ta về chuyện này thêm lần nào nữa."\n\nTrước khi ta kịp đáp lời, [courtier_spy.GetSheHe] đã bắt đầu bước dọc hành lang, mỗi bước chân khiến [courtier_spy.GetHerHim] chìm sâu hơn vào bóng tối."
  intrigue_scheming_special.1099.a:0 "Tốt hơn ta nên tiếp tục màn kịch này, ít nhất là lúc này."
  intrigue_scheming_special.1099.b:0 "[courtier_spy.GetSheHe|U] quả thật là một bí ẩn."
 
# Special Chain — Root out secrets at your court, by Linnéa Thimrén
  intrigue_scheming_special.1301.t:0 "Bị Bóng Tối Truy Đuổi"
  intrigue_scheming_special.1301.desc:0 "Tiếng bước chân vang vọng trong những hành lang tối, giấy tờ trong thư phòng của ta bị xê dịch, một cái bóng thoáng qua nơi khóe mắt..."
  intrigue_scheming_special.1301.desc_mentor_or_other:0 "\n\n"Ngươi nghĩ có kẻ đang theo dõi mình sao?" [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('mentor_or_other'))] của ta, [mentor_or_other.GetTitledFirstName], dường như suy nghĩ một lúc rồi gật đầu với [mentor_or_other.GetHerselfHimself]. "Ta #EMP cũng#! đã nhận thấy vài điều khả nghi trong [ROOT.Char.Custom('FortifiedBuilding')] gần đây.""
  intrigue_scheming_special.1301.a:0 "Ta phải tìm ra sự thật!"
  intrigue_scheming_special.1301.b:0 "Ta sẽ đảm bảo rằng mình sẽ không bao giờ phải lo lắng về an toàn nữa."

  intrigue_scheming_special.1302.desc:0 "Ẩn mình trong một hành lang vắng vẻ, nơi dẫn đến phần lớn các phòng riêng cũng như khu vườn của [ROOT.Char.Custom('FortifiedBuilding')], ta chờ đợi và quan sát.\n\n#EMP Có phải ta quá ngu ngốc khi đến đây? Có lẽ nếu ta#!- Tiếng bước chân. Di chuyển lặng lẽ dọc hành lang; một bóng người bước ra từ màn đêm.\n\n[sneaky_courtier.GetTitledFirstName] đang làm gì ở đây?"
  intrigue_scheming_special.1302.a:0 "Ta sẽ đối chất với [sneaky_courtier.GetHerHim] ngay lập tức!"
  intrigue_scheming_special.1302.a.tt:1 "Nếu [sneaky_courtier.GetFirstName] tham gia vào một Âm mưu, ngươi sẽ vạch trần nó\nNếu không, nỗ lực truy tìm gián điệp của ngươi thất bại"
  intrigue_scheming_special.1302.b:0 "Ta phải chắc chắn. Ta sẽ tiếp tục theo dõi [sneaky_courtier.GetHerHim]."
  intrigue_scheming_special.1302.b.tt1:1 "[sneaky_courtier.GetSheHe|U] không nhận ra ngươi"
  intrigue_scheming_special.1302.b.tt2:1 "[sneaky_courtier.GetSheHe|U] nghe thấy ngươi đang theo dõi [sneaky_courtier.GetHerHim]"
  intrigue_scheming_special.1302.c:0 "Ta sẽ không lộ diện, chắc chắn không phải [sneaky_courtier.GetHerHim]."
  intrigue_scheming_special.1302.c.tt:1 "Ngươi sẽ tiếp tục tìm kiếm gián điệp."

  intrigue_scheming_special.1303.desc_exposed:0 "Việc phải theo dõi [sneaky_courtier.GetTitledFirstName] để tìm hiểu xem [sneaky_courtier.GetSheHe] đang làm gì giờ đây không còn cần thiết nữa, [sneaky_courtier.GetSheHe] là một gián điệp đã bị lộ!\n\nHy vọng rằng nếu chuyện này xảy ra lần nữa ta sẽ nhận ra dấu hiệu sớm hơn... Bài học này thật sự phải trả giá mới có được!"
  intrigue_scheming_special.1303.desc_sneak_win:0 "Ta theo dõi [sneaky_courtier.GetTitledFirstName] mà không gây ra một tiếng động. [sneaky_courtier.GetSheHe|U] vội vã đi qua hết hành lang này đến hành lang khác, và sau vài phút [sneaky_courtier.GetSheHe] bước ngang qua phòng riêng của ta rồi đi ra khu vườn của [ROOT.Char.Custom('FortifiedBuilding')]."
  intrigue_scheming_special.1303.desc_sneak_win_spy:0 "Ta theo dõi [sneaky_courtier.GetHerHim] mà không gây ra tiếng động nào, và khi chúng ta tiến gần đến phòng riêng của ta, ta có thể cảm thấy nhịp tim mình dồn dập.\n\nChẳng bao lâu sau, tiếng lách cách của ổ khóa phòng riêng của ta vang vọng khắp hành lang."
  intrigue_scheming_special.1303.desc_sneak_fail:0 "Ta theo dõi [sneaky_courtier.GetTitledFirstName], không bị phát hiện, và khi chúng ta đến gần phòng riêng của ta cùng khu vườn của [ROOT.Char.Custom('FortifiedBuilding')], nhịp tim ta bắt đầu dồn dập. [sneaky_courtier.GetSheHe] đang làm gì ở đây? Mải suy nghĩ, ta vô tình va vào chiếc bình trang trí ở hành lang, khiến nó rơi xuống sàn vỡ tan.\n\nTiếng động vang lên gần như che lấp tiếng bước chân vội vã của [sneaky_courtier.GetHerHis] khi [sneaky_courtier.GetSheHe] biến mất dần xuống hành lang, và chẳng mấy chốc đã hòa vào màn đêm."
  intrigue_scheming_special.1303.a:0 "Đối chất với [sneaky_courtier.GetHerHim]!"
  intrigue_scheming_special.1303.b:0 "Ta sẽ phải để mắt đến chuyện này."
  intrigue_scheming_special.1303.c:0 "Chà, tối nay #EMP quả thật#! là một đêm đẹp."
  intrigue_scheming_special.1303.c.tt:1 "Ngươi đã gác lại những nghi ngờ của mình, và đây là một bài học quý giá.\n"
  intrigue_scheming_special.1303.d:0 "Dù sao thì ta cũng đã nhận ra dấu hiệu từ sớm!"

  intrigue_scheming_special.1304.desc_found:0 "Ta biết mà! Ta chỉ vừa kịp lùi vào vòng ôm tối tăm của bóng tối khi [sneaky_courtier.GetTitledFirstName] bước xuống hành lang, tiến thẳng về phía phòng riêng của ta.\n\nTiếng lách cách của ổ khóa khi bị cạy mở nhanh chóng bị theo sau bởi tiếng kêu của [sneaky_courtier.GetHerHis] khi ta đặt tay lên vai [sneaky_courtier.GetHerHis]."
  intrigue_scheming_special.1304.desc_not_found:0 "Khi màn đêm dần trôi qua, hành lang vẫn yên tĩnh. Không một tiếng thì thầm nào vang lên, và cũng không có bóng tối đáng ngờ nào xuất hiện.\n\nCó lẽ ta nên đi theo [sneaky_courtier.GetTitledFirstName] ngay từ đầu?"
  intrigue_scheming_special.1304.a:0 ""Ta nghĩ ngươi nên đi cùng ta.""
  intrigue_scheming_special.1304.b:0 "Hay có lẽ ngay từ đầu đã chẳng có mối đe dọa nào?"

  intrigue_scheming_special.1350.desc:0 "Giờ đây khi [sneaky_courtier.GetTitledFirstName] đã qua đời, ta sẽ không bao giờ biết liệu [sneaky_courtier.GetSheHe] có từng làm việc chống lại ta hay không... Tuy nhiên cuộc điều tra này đã dạy ta rất nhiều, và lần sau ta sẽ không còn phải băn khoăn nữa!"
  intrigue_scheming_special.1350.a:0 "Cái chết của [sneaky_courtier.GetHerHis] là phúc lành, hay chỉ là sự trùng hợp?"

  intrigue_scheming_special.1398.desc:0 ""Tại sao ngươi lại buộc tội ta những chuyện như vậy?!" [sneaky_courtier.GetTitledFirstName] chất vấn ta, giọng đầy [sneaky_courtier.Custom('GeneralTemperament')]. "Ta chỉ ra vườn hít thở chút không khí thôi."\n\nGiờ đây khi đối diện với sự tổn thương trong ánh mắt [sneaky_courtier.GetHerHis], ta không hiểu sao mình từng nghĩ [sneaky_courtier.GetHerHim] là một gián điệp."
  intrigue_scheming_special.1398.a:0 "Ta hy vọng [sneaky_courtier.GetSheHe] có thể tha thứ cho ta."

  intrigue_scheming_special.1399.desc:0 "Ta đặt tay lên vai [sneaky_courtier.GetHerHis], và [sneaky_courtier.GetTitledFirstName] quay lại nhanh như chớp. Bị bắt quả tang giữa nhiệm vụ của [sneaky_courtier.GetHerHis], [sneaky_courtier.GetSheHe] thậm chí không cố gắng tự bào chữa cho [sneaky_courtier.GetHerselfHimself].\n\nToàn bộ sự việc này đã dạy ta một bài học quý giá về lòng tin và sự cảnh giác, và giờ đây ta sắc bén hơn bao giờ hết!"

# An Anonymous Informant by Chad Uhl
  realm_has_more_than_2_siegeable_holdings_trigger_desc:0 "Hai hoặc nhiều lãnh địa của kẻ địch có thể bị bao vây"
  realm_has_more_than_2_siegeable_holdings_trigger_desc_not:0 "Ít hơn 2 lãnh địa của kẻ địch có thể bị bao vây"

  intrigue_scheming.1801.t:0 "Kẻ Báo Tin Nặc Danh"
  intrigue_scheming.1801.desc:0 "và đưa cho ta một bức thư nặc danh mà [spymaster.GetSheHe] vừa nhận được. Có vẻ như chúng ta đang có một cơ hội hiếm có để thu thập thông tin về chiến lược phòng thủ của [enemy.GetTitledFirstNamePossessive].\n\nBức thư viết:\n\n\"Nếu ngài muốn biết về hệ thống phòng thủ của [enemy.GetFirstNamePossessiveNoTooltip], hãy để [spymaster.GetCouncilTitle] của ngài, [spymaster.GetFirstNameNoTooltip], gặp ta tại [meeting_place.GetName] trong vòng hai tuần. Hãy mang theo thật nhiều vàng.\""
  intrigue_scheming.1801.a:0 "Ta thật ngu ngốc nếu không điều tra chuyện này."
  intrigue_scheming.1801.b:0 "Chỉ là một trò tống tiền rỗng tuếch."
  intrigue_scheming.1801_landed: "Vị [spymaster.GetCouncilTitle] của ta, [spymaster.GetFirstName], vội vã bước vào phòng"
  intrigue_scheming.1801_laamp: "Vị [GetCourtPositionType('second_camp_officer').GetNameNoTooltip] của ta, [spymaster.GetFirstName], vội vã bước vào lều"

  intrigue_scheming.1802.intro_desc:0 "[spymaster.GetFirstName] đã trở về sau cuộc gặp với kẻ cung cấp thông tin ẩn danh. Với vẻ mặt nghiêm trọng, hắn trải ra một xấp giấy da ghi chép những chiến thuật phòng thủ của kẻ thù Ta."
  intrigue_scheming.1802.g_high_skill_desc:0 "$intrigue_scheming.1802.intro_desc$\n\nTheo như ta có thể nhận thấy, những sơ đồ kế hoạch phòng thủ của [enemy.GetFirstNamePossessive] có vẻ hoàn toàn xác thực."
  intrigue_scheming.1802.g_medium_skill_desc:0 "$intrigue_scheming.1802.intro_desc$\n\nNhững sơ đồ vẽ trên giấy da có vẻ hợp lý, nhưng có vài điểm không phù hợp với hiểu biết hiện tại của chúng ta về chiến lược quen thuộc của [enemy.GetFirstNamePossessive]."
  intrigue_scheming.1802.decent_skill_desc:0 "$intrigue_scheming.1802.intro_desc$\n\nTài liệu này có vẻ là thật, nhưng có điều gì đó không ổn... dù ta không thể chỉ ra chính xác."
  intrigue_scheming.1802.fallback_desc:0 "$intrigue_scheming.1802.intro_desc$\n\nGần như không thể xác định liệu những kế hoạch này là thật hay không."
  intrigue_scheming.1802.a:0 "Hành động dựa trên thông tin này."
  intrigue_scheming.1802.b:0 "Bỏ qua thông tin này."

  intrigue_scheming.1803.f_high_skill_desc:0 "$intrigue_scheming.1802.intro_desc$\n\nKhi xem xét tài liệu, ta phát hiện quá nhiều sai sót hiển nhiên để có thể tin rằng đây là kế hoạch thật. Ta đã bị lừa!"
  intrigue_scheming.1803.f_medium_skill_desc:0 "$intrigue_scheming.1802.intro_desc$\n\nMột số chi tiết trong kế hoạch có vẻ hợp lý, nhưng nhiều điểm lại không phù hợp với chiến lược phòng thủ quen thuộc của [enemy.GetFirstNamePossessive]."

  intrigue_scheming.1803.a:0 "Hành động dựa trên thông tin này."
  intrigue_scheming.1803.b:0 "Bỏ qua thông tin này."

  intrigue_scheming.1804.genuine_info_desc:0 "Tin tức vừa được gửi về từ quân đội của ta đang bao vây [barony.GetName] trong cuộc chiến chống lại [enemy.GetTitledFirstName]. Họ báo rằng thông tin chúng ta nhận được từ kẻ báo tin nặc danh là thật!\n\nNhờ hiểu rõ chiến thuật phòng thủ của [enemy.GetFirstNamePossessiveNoTooltip], quân ta đã chiếm được [enemy.Custom('FortifiedBuilding')] trong thời gian kỷ lục. Chiến thắng gần như đã nằm trong tay!"
  intrigue_scheming.1804.fake_info_desc:0 "Tin tức vừa được gửi về từ quân đội của ta đang bao vây [barony.GetName] trong cuộc chiến chống lại [enemy.GetTitledFirstName]. Họ báo rằng thông tin chúng ta nhận được từ kẻ báo tin nặc danh là giả!\n\nDù vậy, quân ta vẫn chiếm được [enemy.Custom('FortifiedBuilding')], nhưng con đường phía trước sẽ đầy thử thách."
  intrigue_scheming.1804.rejected_fake_info_desc:0 "Tin tức vừa được gửi về từ quân đội của ta đang bao vây [barony.GetName] trong cuộc chiến chống lại [enemy.GetTitledFirstName]. Họ báo rằng thông tin chúng ta nhận được từ kẻ báo tin nặc danh là giả!\n\nTạ ơn [ROOT.Char.GetFaith.HighGodName] ta đã không hành động theo những tài liệu giả mạo đó!"
  intrigue_scheming.1804.a:0 "Một vụ mua bán đáng giá, nếu ta được phép nói vậy."
  intrigue_scheming.1804.b:0 "Chúng ta phải kiên trì!"
  intrigue_scheming.1804.c:0 "Ta đã đưa ra quyết định đúng."
  intrigue_scheming.1804.custom_tt:0 "Ngươi và mọi chỉ huy"
