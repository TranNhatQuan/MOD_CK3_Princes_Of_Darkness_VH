l_english:

 #Lessons of the heart
 intrigue_events_bjorn.5100.t: "Bài Học của Con Tim"
 intrigue_events_bjorn.5100.desc: "Khi quan sát [the_lover.GetFirstName] yêu dấu, Ta nhận ra mình có thể học hỏi rất nhiều từ một con người tuyệt vời như thế. Tâm trí của [the_lover.GetHerHis|U] giống như một kho báu cần được khai phá; và Ta cũng có vài điều để dạy cho [the_lover.GetFirstName].\n\nChưa kể đây là cách tuyệt vời để chúng ta dành thời gian cho nhau!"
 intrigue_events_bjorn.5100.a: "Người thương có quá nhiều điều để chỉ dạy cho ta."
 intrigue_events_bjorn.5100.b: "[the_lover.GetSheHe|U] sẽ là một học trò đáng yêu."
 intrigue_events_bjorn.5100.c: "Với ta, chỉ cần được ở bên nhau là đủ."
 
 #shared interests
 intrigue_events_bjorn.5101.t: "Đồng Điệu Đam Mê"
 intrigue_events_bjorn.5101.desc: "[the_lover.GetFirstName] luôn khiến ta say đắm! Ta muốn được tận hưởng những gì mang lại niềm vui cho [the_lover.GetHerHim].\n\nÔi, những ngày hạnh phúc khi được bên nhau:\n\nĐôi tay cùng làm việc, tâm trí cùng hướng về những đam mê chung.\n\nTrái tim chúng ta hòa cùng một nhịp." 
 intrigue_events_bjorn.5101.a: "Hãy cho ta thấy điều gì đã thắp lên ngọn lửa đam mê trong nàng, người yêu dấu."
 intrigue_events_bjorn.5101.b: "Đến đây, hãy cùng ta chia sẻ niềm vui này."
 intrigue_events_bjorn.5101.c: "Hay là chúng ta cùng nhau học một điều gì đó mới mẻ nhỉ?"
  
 #Dark depths of the soul
 intrigue_events_bjorn.5102.t: "Yêu Cả Bóng Tối"
 intrigue_events_bjorn.5102.desc: "Khi chúng ta ngày càng gần gũi hơn, giờ đây ta đang đứng trước một ngưỡng cửa. Có lẽ đã đến lúc sẻ chia mọi thứ với nhau, một cách chân thật nhất, để chúng ta có thể thấu hiểu toàn bộ về đối phương. Sẻ chia cả những điều mà thường thì… chẳng ai nói ra.\n\nMột khi đã bước qua ngưỡng cửa này thì không còn đường lui nữa, nhưng liệu [the_lover.GetFirstName] có chấp nhận tất cả những gì thuộc về con người ta không?"
 intrigue_events_bjorn.5102.a: "Ta có những điều này muốn cho nàng thấy." 
 intrigue_events_bjorn.5102.b: "Hãy kể cho ta nghe những gì nàng chưa từng chia sẻ với ai." 
 intrigue_events_bjorn.5102.c: "Hãy cùng khám phá những khao khát thầm kín nhất của chúng ta."
 intrigue_events_bjorn.5102.d: "Không! Có những chuyện vĩnh viễn không nên đưa ra ánh sáng."
