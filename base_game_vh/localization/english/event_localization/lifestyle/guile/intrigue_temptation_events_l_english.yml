l_english:

 #Pillow Talk, by Sean Hughes
  intrigue_temptation.2201.t:0 "Chuyện Thì Thầm Trên Gối"
  intrigue_temptation.2201.desc:0 "Sau lần ân ái gần nhất, [my_lover.GetFirstName] và ta nằm cạnh nhau, trò chuyện vu vơ.\n\n\"Và ngươi sẽ không bao giờ tin được—\" [my_lover.GetSheHe] chợt dừng lại rồi đỏ mặt. \"Ta xin lỗi, tình yêu của ta; hẳn chuyện này khiến ngươi chán lắm...\""
  intrigue_temptation.2201.a:0 "Không hề. Xin hãy kể thêm đi..."
  intrigue_temptation.2201.a.success:0 "[my_lover.GetFirstName] chia sẻ những lời đồn từ triều đình của [court_owner.GetTitledFirstNamePossessive]"
  intrigue_temptation.2201.a.success.tt:0 "Ta biết được [secret|E] của một nhân vật ngẫu nhiên"
  intrigue_temptation.2201.a.failure:0 "[my_lover.GetFirstName] từ chối nói thêm"
  intrigue_temptation.2201.b:0 "Được nghe giọng nói của ngươi chưa bao giờ là điều nhàm chán, người yêu."
  intrigue_temptation.2201.d.sadistic:0 "Ngươi đang giấu điều gì đó... Nói cho ta biết, #EMP ngay bây giờ#!!"

 #Matchmaking, by Mathilda Bjarnehed
  intrigue_temptation_special.1001.t:0 "Chuyện Tình Và Dục Vọng"
  intrigue_temptation_special.1001.desc:0 "Những ánh mắt mơ màng và tiếng thở dài đầy mong nhớ chỉ có thể có một nghĩa – [wants_love.Custom2('MyCharacterIntroduction', ROOT.Char)] đang khát khao tình yêu!\n\nCó lẽ ta nên thử tài mai mối của mình và xoa dịu nỗi lòng của [wants_love.GetHerHis]? [wants_love.GetSheHe|U] hẳn sẽ vô cùng biết ơn!"
  intrigue_temptation_special.1001.a:0 "[wants_love.GetFirstNameNoTooltip] sẽ không còn cô đơn lâu nữa!"
  intrigue_temptation_special.1001.a.tt:0 "[wants_love.GetTitledFirstName] có thể trở thành tình nhân của người mà ta lựa chọn"
  intrigue_temptation_special.1001.b:0 "Ta phải tập trung vào hôn nhân của chính mình."
  intrigue_temptation_special.1001.c:0 "Ta phải tập trung vào chuyện tình cảm của chính mình."

  intrigue_temptation_special.1002.t:0 "Khẩu Vị Tình Ái"
  intrigue_temptation_special.1002.desc:0 "Để tìm được ý trung nhân hoàn hảo cho [wants_love.GetTitledFirstNamePossessive], Ta cần biết nhiều hơn về sở thích của [wants_love.GetHerHis]. Bằng cách kín đáo quan sát các tương tác của [wants_love.GetHerHis] tại triều đình, Ta có thể thoáng thấy những khao khát thầm kín nhất của [wants_love.GetHerHis]...\n\nTrước khi bắt đầu, Ta nên có sẵn một giả thuyết. Ta nghĩ [wants_love.GetFirstNameNoTooltip] sẽ muốn tìm kiếm điều gì ở một người bạn đời?"
  intrigue_temptation_special.1002.a:0 "Một tâm hồn đồng điệu, tính cách tương hợp với [wants_love.GetHerHis]."
  intrigue_temptation_special.1002.a.tt:0 "#F Hầu hết mọi người, đặc biệt là những người giàu lòng trắc ẩn và tử tế, thường thích bạn đời có tính cách giống mình.\n\nNếu ta đoán sai, ta có thể cho rằng [wants_love.GetFirstName] thích vẻ đẹp hoặc quyền lực.#!"
  intrigue_temptation_special.1002.b:0 "Sức hấp dẫn, dù là ngoại hình hay khí chất."
  intrigue_temptation_special.1002.b.tt:0 "#F Những người ham muốn, kiêu ngạo hoặc hấp dẫn thường thích bạn đời có ngoại hình đẹp, thân thiện, táo bạo hoặc thích tán tỉnh.\n\nNếu ta đoán sai, ta có thể cho rằng [wants_love.GetFirstName] thích tính cách tương hợp hoặc quyền lực.#!"
  intrigue_temptation_special.1002.c:0 "Quyền lực và ảnh hưởng."
  intrigue_temptation_special.1002.c.tt:0 "#F Những người khao khát giàu sang và thành công thường thích bạn đời quyền thế.\n\nNếu ta đoán sai, ta có thể cho rằng [wants_love.GetFirstName] thích tính cách tương hợp hoặc vẻ đẹp.#!"
  intrigue_temptation_special.1002.d:0 "Ta thà tìm hiểu xem [wants_love.GetSheHe] thích đàn ông hay phụ nữ."
  intrigue_temptation_special.1002.d.tt:1 "#F Phần lớn mọi người thích bạn đời khác giới, nhưng cũng không hiếm người thích cùng giới hoặc cả hai.#!"

  intrigue_temptation_special.1003.t:0 "Sắp Đặt Mối Duyên"
  intrigue_temptation_special.1003.start.desc:0 "Ta đã quan sát [wants_love.GetTitledFirstName] một thời gian và giờ kết luận của ta đã rõ ràng."
  intrigue_temptation_special.1003.personality_success.desc:0 "Đúng như Ta nghi ngờ, [wants_love.GetSheHe] thực sự ưu tiên những người có tính cách tương đồng với chính mình."
  intrigue_temptation_special.1003.personality_failure.desc:0 "Ta đã sai. [wants_love.GetSheHe|U] dường như không quá quan tâm đến tính cách. Có lẽ [wants_love.GetSheHe|U] thích quyền lực hoặc vẻ đẹp hơn."
  intrigue_temptation_special.1003.sex_appeal_success.desc:0 "[wants_love.GetSheHe|U] bị thu hút, như thiêu thân lao vào lửa, bởi những người có sức quyến rũ và vẻ đẹp nổi bật."
  intrigue_temptation_special.1003.sex_appeal_failure.desc:0 "Ta đã nhầm – [wants_love.GetSheHe|U] dường như không phân biệt giữa người đẹp và người bình thường. Có lẽ [wants_love.GetSheHe|U] coi trọng tính cách... hoặc quyền lực hơn."
  intrigue_temptation_special.1003.power_success.desc:0 "Đúng như ta đoán, [wants_love.GetSheHe] thích bầu bạn với những lãnh chúa và quý bà quyền lực nhất trong triều."
  intrigue_temptation_special.1003.power_failure.desc:0 "Ta đã sai. [wants_love.GetSheHe|U] giao thiệp với người ở cả địa vị cao lẫn thấp. Có lẽ điều khiến [wants_love.GetHerHim] hứng thú không phải quyền lực – mà là tính cách tương hợp hoặc vẻ ngoài quyến rũ?"
  intrigue_temptation_special.1003.end.desc:0 "\n\nGiờ khi ta đã hiểu hơn đôi chút về mong muốn của [wants_love.GetFirstNamePossessiveNoTooltip], ta đã lập danh sách những ứng viên tiềm năng. Ai sẽ phù hợp nhất với [ROOT.GetCharacter.Custom2('RelationToMe' , wants_love )] của ta?"
  intrigue_temptation_special.1003.a:0 "[target_list_member_a.Custom('ComplimentAdjective')] [target_list_member_a.GetTitledFirstNameNoTooltip]."
  intrigue_temptation_special.1003.a.tt:0 "Ta thử ghép [wants_love.GetFirstName] với [target_list_member_a.GetTitledFirstName]"
  intrigue_temptation_special.1003.b:0 "[target_list_member_b.GetTitledFirstNameNoTooltip], một [target_list_member_b.Custom('ComplimentAdjective')] [target_list_member_b.GetWomanMan]."
  intrigue_temptation_special.1003.b.tt:0 "Ta thử ghép [wants_love.GetFirstName] với [target_list_member_b.GetTitledFirstName]"
  intrigue_temptation_special.1003.c:0 "[ROOT.GetCharacter.Custom2('RelationToMe' , target_list_member_c )] [target_list_member_c.Custom('ComplimentAdjective')] của ta, [target_list_member_c.GetTitledFirstNameNoTooltip]."
  intrigue_temptation_special.1003.c.tt:0 "Ta thử ghép [wants_love.GetFirstName] với [target_list_member_c.GetTitledFirstName]"
  intrigue_temptation_special.1003.tt:0 "Một cặp đôi tốt nên là người phù hợp với sở thích của [wants_love.GetFirstNamePossessive]"

  intrigue_temptation_special.1004.t:0 "Tạo Bầu Không Khí"
  intrigue_temptation_special.1004.start.desc:0 "Để có ấn tượng ban đầu về chất lượng của cặp đôi mà ta sắp đặt, ta đã tổ chức một bữa tối nhỏ với cả [wants_love.GetTitledFirstName] và [chosen_match.GetTitledFirstName] trong danh sách khách mời."
  intrigue_temptation_special.1004.great.desc:0 "Phần lớn bữa tối, họ dành thời gian trò chuyện, và khi không nói chuyện thì lại lén trao cho nhau những ánh nhìn tò mò."
  intrigue_temptation_special.1004.good.desc:0 "Ta không thấy dấu hiệu rõ ràng nào, nhưng họ dường như rất hòa hợp."
  intrigue_temptation_special.1004.bad.desc:0 "Đáng tiếc, sự ăn ý mà ta mong đợi hoàn toàn không xuất hiện. Hy vọng đó chỉ là do họ căng thẳng."
  intrigue_temptation_special.1004.end.desc:0 "\n\nTa phải tranh thủ khi cơ hội còn nóng, cho [wants_love.GetFirstNameNoTooltip] và [chosen_match.GetFirstNameNoTooltip] thêm một dịp gặp gỡ. Lần này, ta sẽ sắp xếp điều gì đó thú vị hơn, một cơ hội để họ cùng chia sẻ sở thích chung!"
  intrigue_temptation_special.1004.a:0 "Một buổi khiêu vũ vui vẻ."
  intrigue_temptation_special.1004.b:0 "Một cuộc săn đầy kịch tính."
  intrigue_temptation_special.1004.c:0 "Một chuyến đi kiểm tra cơ sở hạ tầng địa phương."
  intrigue_temptation_special.1004.d:0 "Một bữa tối riêng để chia sẻ vài chuyện \"tin đồn.\""
  intrigue_temptation_special.1004.e:0 "Một đêm thơ ca."
  intrigue_temptation_special.1004.tt:0 "Ta nên chọn một hoạt động mà cả [wants_love.GetFirstName] và [chosen_match.GetFirstName] đều quen thuộc và có thể tận hưởng dựa trên kỹ năng của họ"

  intrigue_temptation_special.1005.t:0 "Thử Thách Tình Cảm"
  intrigue_temptation_special.1005.great_diplomacy.desc:1 "Ta vốn không thích khoe khoang, nhưng phải nói rằng — buổi khiêu vũ này sẽ còn được nhắc đến trong nhiều năm tới! Thực vậy, ta tin rằng đêm qua sẽ trở thành ký ức đáng nhớ đối với cả [wants_love.GetFirstNamePossessive] lẫn [chosen_match.GetFirstNamePossessive]. Họ gần như nhảy cùng nhau mọi điệu và không thể rời mắt khỏi nhau!"
  intrigue_temptation_special.1005.great_martial.desc:0 "Ta không thường nói điều này, nhưng đôi khi ta đúng là thiên tài! Cả [wants_love.GetFirstName] và [chosen_match.GetFirstName] đều vô cùng thích thú trong buổi săn. Họ phối hợp với nhau như thể đã quen biết cả đời và là cặp đôi thành công nhất trong ngày."
  intrigue_temptation_special.1005.great_stewardship.desc:0 "[wants_love.GetFirstName] và [chosen_match.GetFirstName] cưỡi ngựa song song thật là cảnh tượng dễ chịu! Họ trò chuyện hàng giờ về cầu cống, cối xay và hệ thống tưới tiêu trước khi tụt lại phía sau đoàn. Không ai biết cuộc trò chuyện của họ sau đó đã đi đến những miền nào, nhưng [wants_love.GetFirstName] trông như bị mê hoặc."
  intrigue_temptation_special.1005.great_intrigue.desc:0 "[wants_love.GetFirstName] và [chosen_match.GetFirstName] hòa nhập hoàn hảo với những lão hồ ly! Chẳng bao lâu, họ đã chiếm lĩnh cuộc trò chuyện, tung ra ý tưởng qua lại với tốc độ đáng kinh ngạc. Hiếm khi ta thấy hai bộ óc đồng điệu đến vậy!"
  intrigue_temptation_special.1005.great_learning.desc:0 "Hiếm khi ta thấy một [wants_love.GetWomanMan] say mê như [wants_love.GetFirstName] khi [wants_love.GetSheHe] lắng nghe [chosen_match.GetFirstName] đọc bài thơ của [wants_love.GetHerHis]! [wants_love.GetSheHe|U] gần như rơi nước mắt ở khổ thơ cuối.\n\nSau màn trình diễn, họ trò chuyện hàng giờ — rất lâu sau khi tất cả khách khác đã rời đi."
  intrigue_temptation_special.1005.good_diplomacy.desc:0 "Buổi khiêu vũ dường như đã nâng cao tinh thần của cả [wants_love.GetFirstName] lẫn [chosen_match.GetFirstName]. Nhờ sự thúc đẩy kín đáo của ta, họ dành khá nhiều thời gian bên nhau, và nhìn vẻ mặt của họ ta chắc rằng họ đã rất thích."
  intrigue_temptation_special.1005.good_martial.desc:0 "Đúng như Ta nghi ngờ, cả [wants_love.GetFirstName] và [chosen_match.GetFirstName] đều là những thợ săn thiện nghệ, thoải mái trên lưng ngựa cũng như khi đi bộ. Họ trông có vẻ rất tận hưởng khoảng thời gian bên nhau, và Ta đã nghe lỏm được [chosen_match.GetFirstNameNoTooltip] dành cho [wants_love.GetFirstNameNoTooltip] một lời khen rất tinh tế về kỹ nghệ bắn cung của [wants_love.GetHerHis]."
  intrigue_temptation_special.1005.good_stewardship.desc:0 "Dù chuyến đi kiểm tra cơ sở hạ tầng có lẽ không phải khung cảnh lãng mạn nhất, ta chắc rằng cả [wants_love.GetFirstName] và [chosen_match.GetFirstName] đều thấy nó thú vị. Họ nói chuyện rất lâu về cối xay và hệ thống tưới tiêu, và dường như khá hài lòng với sự đồng hành của nhau."
  intrigue_temptation_special.1005.good_intrigue.desc:0 "[wants_love.GetFirstName] và [chosen_match.GetFirstName] là những vị khách được chào đón trong buổi tụ họp riêng của ta, mang đến vài chuyện đồn hấp dẫn. Họ đã phát hiện cùng một bí mật đáng xấu hổ của một lãnh chúa nào đó và bàn luận chi tiết với niềm thích thú không che giấu."
  intrigue_temptation_special.1005.good_learning.desc:0 "[wants_love.GetFirstName] và [chosen_match.GetFirstName] ngồi say mê khi vị khách danh dự của ta đọc bài thơ của nàng. Hẳn nó đã chạm đến cảm xúc sâu sắc của họ, vì sau đó họ cùng thảo luận về nó gần một giờ."
  intrigue_temptation_special.1005.bad_diplomacy.desc:0 "Thật đáng xấu hổ, hóa ra một buổi khiêu vũ lại là ý tưởng tồi."
  intrigue_temptation_special.1005.bad_martial.desc:0 "E rằng ta đã nhầm khi nghĩ một cuộc săn sẽ là hoạt động phù hợp."
  intrigue_temptation_special.1005.bad_stewardship.desc:0 "Nghĩ lại thì chuyến đi kiểm tra cơ sở hạ tầng địa phương quả là ý tưởng tồi."
  intrigue_temptation_special.1005.bad_intrigue.desc:0 "Ta tưởng một bữa tối riêng với những câu chuyện hấp dẫn sẽ kéo [wants_love.GetFirstName] và [chosen_match.GetFirstName] lại gần nhau, nhưng toàn bộ sự việc lại trở nên vô cùng gượng gạo."
  intrigue_temptation_special.1005.bad_learning.desc:0 "Hóa ra thơ ca không phải dành cho tất cả mọi người."
  intrigue_temptation_special.1005.wants_love_struggled.desc:0 "Thật đau lòng khi chứng kiến [wants_love.GetFirstName] chật vật. [wants_love.GetSheHe|U] giữ khoảng cách suốt cả buổi gặp gỡ đáng buồn đó, thậm chí không một lần liếc nhìn về phía [chosen_match.GetFirstNamePossessive]."
  intrigue_temptation_special.1005.chosen_match_struggled.desc:0 "Thật đau lòng khi chứng kiến [chosen_match.GetFirstName] chật vật. [chosen_match.GetSheHe|U] giữ khoảng cách suốt cả buổi gặp gỡ đáng buồn đó, thậm chí không một lần liếc nhìn về phía [wants_love.GetFirstNamePossessive]."
  intrigue_temptation_special.1005.great_status.desc:0 "\n\nTa hy vọng nỗ lực nhỏ này sẽ cải thiện tâm trạng của [wants_love.GetFirstNamePossessiveNoTooltip], nhưng không ngờ kết quả lại đến nhanh đến vậy! Trừ khi ta là người đánh giá sai lầm khủng khiếp, chắc chắn giữa hai người họ đang có điều gì đó."
  intrigue_temptation_special.1005.good_status_despite_bad_activity.desc:0 "\n\nMay mắn thay, có vẻ sự kiện gượng gạo đó không giết chết cảm xúc đang nảy nở giữa họ. Dù còn quá sớm để khẳng định, ta nghĩ mình có thể đã thành công."
  intrigue_temptation_special.1005.good_status.desc:0 "\n\nTa đã quan sát họ vài ngày nay, và ta khá chắc chắn. Có điều gì đó ở đó mà trước đây chưa từng có."
  intrigue_temptation_special.1005.bad_status.desc:0 "\n\nĐã đến lúc chấp nhận thất bại – [wants_love.GetFirstNameNoTooltip] và [chosen_match.GetFirstNameNoTooltip] sẽ không bao giờ thành đôi."
  intrigue_temptation_special.1005.a:0 "Đúng là một cặp đôi tuyệt vời!"
  intrigue_temptation_special.1005.b:0 "Quả thật ta rất giỏi nhìn người."
  intrigue_temptation_special.1005.c:0 "Tình yêu là bí ẩn lớn nhất."

  intrigue_temptation_special.1006.t:0 "Một Sai Lầm Tự Cao"
  intrigue_temptation_special.1006.desc:0 "Để đánh giá chất lượng của cặp đôi mà ta sắp đặt, ta đã tổ chức một bữa tối nhỏ với cả [wants_love.GetTitledFirstName] và [chosen_match.GetTitledFirstName] trong danh sách khách mời.\n\nTa cố khuyến khích họ bắt chuyện với nhau, nhưng [not_interested.GetFirstNameNoTooltip] lại tỏ ra lạnh nhạt và thờ ơ với đối tượng được sắp đặt. Thay vào đó, [not_interested.GetSheHe] cứ liên tục liếc nhìn một [interesting_ladylord.GetLadyLord] tuấn tú ở phía cuối bàn. Có lẽ...?"
  intrigue_temptation_special.1006.a:0 "Từ nay ta phải quan sát con người cẩn thận hơn."

  intrigue_temptation_special.1007.t:0 "Một Cảnh Tượng Đáng Giá"
  intrigue_temptation_special.1007.desc:0 "Trong nhiều tuần trăng, ta đã dõi theo [wants_love.GetTitledFirstName] và [chosen_match.GetTitledFirstName], tìm kiếm dấu hiệu cho thấy kế hoạch của ta thành công. Đêm nay, sự tò mò của ta cuối cùng cũng được thỏa mãn.\n\nTrên một chiếc ghế đá ẩn trong góc rậm rạp và tối nhất của khu vườn, ta bắt gặp đôi chim tình đang ở đó. Với nụ cười hài lòng trên môi, ta lặng lẽ rút lui theo lối mòn phủ đầy cỏ dại. Họ mải mê trong nụ hôn đến mức không hề nhận ra sự hiện diện của ta."
  intrigue_temptation_special.1007.a:0 "Ta chúc họ mọi điều tốt đẹp."
 
 #Guest, by Alexander Oltner
  intrigue_temptation.3000.t:0 "Lời Tạm Biệt Ngọt Ngào"
  intrigue_temptation.3000.desc:1 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]... à không... ý tôi là... thật vinh hạnh khi được làm khách của ngài tại [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]..." [guest_lover.GetFirstName] lắp bắp khi [guest_lover.GetSheHe] chuẩn bị rời đi.\n\n"Tôi đã được gặp chính #emphasis ngài#!. Chỉ điều đó thôi cũng khiến chuyến ở lại của tôi trở nên đáng giá. Nhưng... xin ngài... liệu ngài có thể cùng tôi trải qua một đêm nồng nhiệt trước khi tôi rời đi không?"\n\n[guest_lover.GetFirstName] đã rơi vào sự thao túng tinh tế của ta! Giờ ta nên tận dụng cơ hội này như thế nào?"
  intrigue_temptation.3000.a:0 "Phải rồi, tình yêu của ta, ta sẽ làm #emphasis bất cứ điều gì#! vì ngươi!"
  intrigue_temptation.3000.b:1 "Vậy thì, người yêu dấu, tin đồn về chư hầu của ta thì sao?"
  intrigue_temptation.3000.c:1 "Hỡi người ngọt ngào, ngươi có thể nói chuyện với [guest_lovers_friend.GetFirstNameNoTooltip] giúp ta không?"
  intrigue_temptation.3000.d:0 "À... ta không thể... giờ thì ngươi hãy lên đường thôi!"
  intrigue_temptation.3000.c.tt:0 "Ta lợi dụng [guest_lover.GetFirstName] để tiếp cận người bạn của [guest_lover.GetHerHis], [guest_lovers_friend.GetFullName]"
  intrigue_temptation.3000.b.tt:0 "Ta cố khiến [guest_lover.GetHerHim] tiết lộ bí mật của chư hầu ta"
  intrigue_temptation.3000.b.success:0 "[guest_lover.GetFirstName] đã tiết lộ một bí mật cho ta!"
  intrigue_temptation.3000.b.failure:0 "[guest_lover.GetFirstName] không tiết lộ gì trong lúc chúng ta ân ái..."
  yearly.3000.b.success.desc:0 "Ta đã khéo léo dụ dỗ được [guest_lover.GetHerHim]"
  yearly.3000.b.success.tt:0 "Ta biết được một [secret|E] của chư hầu"
  yearly.3000.b.failure.desc:0 "Ta không thể dụ dỗ được [guest_lover.GetHerHim]"

 #Wing(wo)man, by Mathilda Bjarnehed
  intrigue_temptation.3010.t:0 "Một Đóa Hoa Giữa Hoang Dã"
  intrigue_temptation.3010.start.desc:0 "Đêm thứ ba liên tiếp, Ta đang ngồi cùng một chiếc bàn tại cùng một quán trọ. Từ đây có tầm nhìn tuyệt vời ra quầy bar — và cả người phục vụ [bar_servant.Custom('bar_servant')] quyến rũ đằng sau đó.\n\nSự mơ mộng của Ta bị ngắt quãng khi [wingman.Custom2('MyCharacterIntroduction', ROOT.Char)] đập mạnh vại bia của [wingman.GetHerHis] xuống bàn. "Ta đã thấy ngươi nhìn chằm chằm vào [bar_servant.GetFirstName] cả đêm rồi," [wingman.GetSheHe] thì thầm với một nụ cười tinh quái. "Ta không trách ngươi đâu, [bar_servant.GetSheHe] là một""
  intrigue_temptation.3010.end.desc:1 "[bar_servant.Custom('RomanticComplimentAdjective')] [bar_servant.GetWomanMan]. Ngươi muốn ta giới thiệu không?""
  intrigue_temptation.3010.a:0 "Ngươi quen [bar_servant.GetHerHim]? Thế thì tuyệt quá!"
  intrigue_temptation.3010.b:0 "Ta muốn tự mình làm việc này."
  intrigue_temptation.3010.c:0 "Ta chỉ đến đây để uống rượu thôi..."
  intrigue_temptation.3010.success.tt:0 "Ta sẽ có thể quyết định bước tiếp theo"
  intrigue_temptation.3010.a.success:0 "Nhờ chút giúp đỡ, ta khiến [bar_servant.GetFirstNameNoTooltip] hoàn toàn say mê mình"
  intrigue_temptation.3010.a.failure:0 "[bar_servant.GetFirstNameNoTooltip] không đáp lại sự tán tỉnh của ta"
  intrigue_temptation.3010.b.success:0 "Ta khiến [bar_servant.GetFirstNameNoTooltip] hoàn toàn say mê mình"

  intrigue_temptation.3011.help.desc:0 "Ta đã thấy [bar_servant.GetFirstName] từ chối vô số lời tán tỉnh. Nhưng nhờ sự giới thiệu của [wingman.GetTitledFirstNamePossessive] và thái độ thoải mái của họ, [bar_servant.GetSheHe] sớm mở lòng.\n\nCuộc trò chuyện diễn ra trôi chảy — ta không ngờ mình lại có nhiều điểm chung với một [bar_servant.Custom('bar_servant')] đến vậy! Ta chỉ nhận ra [wingman.GetFirstNameNoTooltip] đã rời đi khi [bar_servant.GetFirstNameNoTooltip] đặt tay [bar_servant.GetHerHis] lên tay ta và hỏi liệu ta có muốn thuê phòng cho đêm nay không. Một căn phòng cho hai người, judging by the look in [bar_servant.GetHerHis] eyes."
  intrigue_temptation.3011.alone.desc:0 "Ta đã thấy [bar_servant.GetFirstName] từ chối vô số lời tán tỉnh. Một [ROOT.Char.GetWomanMan] tầm thường hẳn đã bị dọa nản, nhưng ta thì vui vẻ tận dụng cơ hội để học từ sai lầm của họ. Ta đã sẵn sàng.\n\nCuộc trò chuyện diễn ra trôi chảy — ta không ngờ mình lại có nhiều điểm chung với một [bar_servant.Custom('bar_servant')] đến vậy! Khi ta đứng dậy chuẩn bị rời đi, [bar_servant.GetFirstNameNoTooltip] đặt tay [bar_servant.GetHerHis] lên tay ta và hỏi liệu ta có muốn thuê phòng cho đêm nay không. Một căn phòng cho hai người, judging by the look in [bar_servant.GetHerHis] eyes."
  intrigue_temptation.3011.a:0 "Chỉ đêm nay thôi sao? Sao không phải #EMP mỗi#! đêm?"
  intrigue_temptation.3011.b:0 "Dẫn đường đi, [bar_servant.Custom('LoverPetName')]."
  intrigue_temptation.3011.c:0 "Ta rất vinh hạnh, nhưng ta chỉ muốn trò chuyện thôi."

 # Medieval tinder, by Mathilda Bjarnehed
  intrigue_temptation.3020.t:0 "Ngọn Lửa Mới"
  intrigue_temptation.3020.start.desc:0 "Qua nhiều năm, ta đã nhận được khá nhiều bức chân dung từ nhiều"
  intrigue_temptation.3020.nobles.desc:0 "quý tộc,"
  intrigue_temptation.3020.noblemen.desc:0 "quý ông,"
  intrigue_temptation.3020.noblewomen.desc:0 "quý bà,"
  intrigue_temptation.3020.end.desc:0 "cả trong nước lẫn ngoại quốc. Cho đến giờ, chúng hầu hết chỉ nằm phủ bụi trên gác mái.\n\nCó lẽ ta nên mang chúng ra và chọn mục tiêu lãng mạn tiếp theo của mình?"
  intrigue_temptation.3020.a:0 "Ta có thể tưởng tượng mình ở bên một người mới..."
  intrigue_temptation.3020.b:0 "Chúng quá kiểu cách so với khẩu vị của ta."
  intrigue_temptation.3020.a.tt:0 "Ta mang những bức chân dung ra"

  intrigue_temptation.3021.beauty.desc:0 "Nhiều người nói với Ta rằng [potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)] là một mỹ nhân/mỹ nam tuyệt sắc! Ta tự hỏi liệu bức chân dung của [potential_date.GetHerHis] có lột tả hết vẻ đẹp của [potential_date.GetHerHim] không?"
  intrigue_temptation.3021.generic1.desc:0 "Còn [potential_date.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] thì sao? [potential_date.GetSheHe|U] nổi tiếng khắp nơi là một [potential_date.Custom('ComplimentAdjective')] [potential_date.GetWomanMan]. Tuy vậy, ta cũng nghe nói [potential_date.GetSheHe] đôi khi khá [potential_date.Custom2('InsultAdjective', ROOT.Char)]..."
  intrigue_temptation.3021.generic2.desc:0 "À, [potential_date.Custom('ComplimentAdjective')] [potential_date.GetFullName]! Không biết chúng ta có hợp đôi không nhỉ?"
  intrigue_temptation.3021.ugly.desc:0 "Đây chắc hẳn là [potential_date.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. Bức chân dung của [potential_date.GetHerHis|U] chắc chắn được vẽ rất khéo, nhưng Ta nghe nói nó có thể không giống người thật cho lắm..."
  intrigue_temptation.3021.generic3.desc:0 "Bức chân dung này không ai khác chính là [potential_date.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. [potential_date.GetSheHe|U] được nói là rất [potential_date.Custom('ComplimentAdjective')], nhưng ta cũng nghe vài tin đồn về bản tính [potential_date.Custom2('InsultAdjective', ROOT.Char)] của [potential_date.GetHerHis]..."
  intrigue_temptation.3021.generic4.desc:0 "À, [potential_date.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. Liệu [potential_date.GetSheHe] có phải là người đó?"
  intrigue_temptation.3021.arrogant.desc:0 "[potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã gửi cho ta một gói chứa #EMP [ROOT.Char.Custom('ThreeToTwelve')]#! bức chân dung. Chúng trông... giống hệt nhau?"
  intrigue_temptation.3021.impatient.desc:0 "[potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã gửi cho ta rất nhiều chân dung trong nhiều năm qua. Bức mới nhất còn kèm theo một mảnh giấy ghi chú khá thiếu kiên nhẫn."
  intrigue_temptation.3021.tall.desc:0 "Đây là chân dung của [potential_date.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. Người đưa thư đã đặc biệt nhấn mạnh việc [potential_date.GetTitledFirstNameNoTooltip] cao đến mức nào. Nhiều lần."
  intrigue_temptation.3021.adventurous.desc:0 "Đằng sau bức chân dung của [potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)] có kèm một lá thư. Trong đó [potential_date.GetSheHe] tự mô tả [potential_date.GetHerselfHimself] là \"một tâm hồn tự do luôn khao khát phiêu lưu.\""
  intrigue_temptation.3021.fish.desc:0 "[potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã gửi cho ta một bức chân dung của [potential_date.GetHerselfHimself] bên bờ hồ, tay cầm một con cá lớn."
  intrigue_temptation.3021.dog.desc:0 "Trong bức chân dung của [potential_date.GetHerHis], [potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)] đang tạo dáng cùng một chú chó nhỏ đáng yêu."
  intrigue_temptation.3021.do_not_believe.desc:0 "[potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã đính kèm một dòng chú thích khá châm biếm vào bức chân dung của [potential_date.GetHerHis]. "Tôi không thực sự tin vào việc gặp người phối ngẫu tương lai theo cách này, nhưng cứ thử cũng chẳng sao.""
  intrigue_temptation.3021.lewd.desc:0 "[ROOT.Char.GetFaith.FertilityGodName|U], ta quên mất thứ này vẫn còn ở đây! Bức chân dung mà [potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)] gửi gần như không để lại chút gì cho trí tưởng tượng. Thực ra là chẳng có gì cả."
  intrigue_temptation.3021.must_be_tall.desc:0 "[potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã đính kèm một lá thư rất dài và thân thiện vào bức chân dung của [potential_date.GetHerHis]. Ở phần cuối, [potential_date.GetSheHe] thúc giục Ta hồi âm sớm, "nhưng chỉ khi ngài cao trên sáu bộ.""
  intrigue_temptation.3021.a:0 "Yêu thích! Đặt nó vào chồng trên."
  intrigue_temptation.3021.a.tt:0 "Chọn [potential_date.GetShortUIName] làm người ta thích nhất hiện tại, người ta sẽ chú ý đặc biệt"
  intrigue_temptation.3021.a.favorite_exists.tt:0 "Người ta thích nhất hiện tại của ta là [favorite.GetShortUIName]"
  intrigue_temptation.3021.b:0 "Cũng được! Đặt vào chồng bên phải."
  intrigue_temptation.3021.b.tt:0 "Giữ [potential_date.GetShortUIName] lại để cân nhắc"
  intrigue_temptation.3021.b.2_dates.tt:0 "Ta đã chọn [date_1.GetShortUIName] và [date_2.GetShortUIName] và có thể chọn thêm #V 1#! người"
  intrigue_temptation.3021.b.1_date.tt:0 "Ta đã chọn [date_1.GetShortUIName] và có thể chọn thêm #V 2#! người"
  intrigue_temptation.3021.c:0 "Không, cảm ơn! Đặt vào chồng bên trái."
  intrigue_temptation.3021.c.tt:0 "Loại bỏ bức chân dung của [potential_date.GetShortUINamePossessive]"
  every_approved_date:0 "Tất cả những người có chân dung ta giữ lại"
  intrigue_temptation.3021.d:0 "Thật vô vọng! Một ý tưởng tệ hại."
  intrigue_temptation.3021.d.tt:0 "Cất các bức chân dung trở lại kho"

  intrigue_temptation.3022.desc:0 "Thật mệt mỏi, nhưng cũng kỳ lạ thay lại khiến ta thấy hứng thú! Giờ khi đã chọn xong, ta có thể lấy bút lông ra và viết vài vần thơ đẹp."
  intrigue_temptation.3022.a:0 "Ta chỉ quan tâm đến [favorite.Custom('RomanticComplimentAdjective')] [favorite.GetFirstNameNoTooltip]."
  intrigue_temptation.3022.b:0 "Tất cả họ đều xứng đáng với thơ của ta!"
  intrigue_temptation.3022.b.success:0 "Tất cả đều vô cùng vui mừng"
  intrigue_temptation.3022.b.failure:0 "Kế hoạch của ta phản tác dụng"
  intrigue_temptation.3022.c:0 "Ta sẽ không phí thời gian cho bất kỳ ai trong số họ."

  intrigue_temptation.3023.t:0 "Gửi đến [ROOT.Char.Custom('RomanticComplimentAdjective')] [ROOT.Char.GetTitledFirstNameNoTooltip],"
  intrigue_temptation.3023.desc:0 "[letter_writer.Custom2('love_letter', ROOT.Char)]"
  intrigue_temptation.3023.a:0 "Thật đáng khen! Ta phải hồi âm!"
  intrigue_temptation.3023.b:0 "Chỉnh sửa đôi chút, ta có thể đưa cái này cho [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]."
  intrigue_temptation.3023.c:0 "Ta thấy buồn nôn..."

 
  intrigue_temptation.3024.desc:0 "[answering_date.Custom2('love_letter', ROOT.Char)]"
  intrigue_temptation.3024.a:0 "Tuyệt vời!"

  intrigue_temptation.3025.t:0 "Gửi đến kẻ hai mặt, [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('favorite'))] [ROOT.Char.GetTitledFirstNameNoTooltip],"
  intrigue_temptation.3025.desc:0 "Hai tuần trước, ta nhận được một lá thư từ ngươi. Tên trên phong bì là của ta, nhưng những vần thơ bên trong lại dành cho [lower_left_portrait.GetTitledFirstName]. Ta đã viết thư cho [lower_left_portrait.GetHerHim], và [lower_left_portrait.GetSheHe] nói rằng [lower_left_portrait.GetSheHe] cũng nhận được một bài thơ — chính bài đó — nhưng lại được gửi cho một [lower_right_portrait.GetWomanMan] khác!\n\nĐây là mưu kế đê hèn và bỉ ổi nhất mà ta từng nghe đến. Đừng bao giờ viết thư cho chúng ta nữa!"
  intrigue_temptation.3025.a:0 "Ồ. Chuyện này... thật ngượng ngùng."


