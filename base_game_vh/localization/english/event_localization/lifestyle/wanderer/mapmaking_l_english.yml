l_english:
  mapmaking.0001.t: "Lộ Trình và Bản Đồ"
  mapmaking.0001.desc: "Đã đến lúc ghi chép lại những gì Ta học được trong các chuyến du hành của mình, để người khác có thể học hỏi từ kinh nghiệm của Ta. Một lộ trình chi tiết kèm theo bản đồ và biểu đồ sẽ cho phép Ta truyền lại những hiểu biết khó nhọc mới có được cho người khác.\n\nQuyết định đầu tiên Ta phải đưa ra là chọn chuyến hành trình nào để làm cơ sở cho dự án này."
  mapmaking.0001.a: "Lãnh địa của [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]"
  mapmaking.0001.a.tt: "Dự án này sẽ dựa trên chuyến thăm của Ngài đến [visited_own_county.GetName] và các lãnh địa khác trong lãnh địa của Ngài\nKết quả sẽ tạo ra một cổ vật mạnh hơn nếu Ngài đã ghé thăm nhiều lãnh địa trong [domain|E] của mình"
  mapmaking.0001.b: "Những vùng đất của [visited_own_vassal_title.GetNameNoTooltip]"
  mapmaking.0001.b.tt: "Dự án này sẽ dựa trên chuyến thăm của Ngài đến [visited_own_vassal.GetName] và các thủ phủ chư hầu khác\nKết quả sẽ tạo ra một cổ vật mạnh hơn nếu Ngài đã ghé thăm nhiều [capital|E] barony của các [powerful_vassals|E]"
  mapmaking.0001.c: "Tuyến đường đến [poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
  mapmaking.0001.c.tt: "Dự án này sẽ dựa trên chuyến thăm của Ngài đến [poi_map_target.GetName] và [point_of_interest|E] của nó\nKết quả sẽ tạo ra một cổ vật mạnh hơn nếu Ngài có nhiều kinh nghiệm Trait [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]"
  mapmaking.0001.d: "Bản đồ của [foreign_kingdom_map_target.GetNameNoTooltip]"
  mapmaking.0001.d.tt: "Dự án này sẽ dựa trên chuyến thăm của Ngài đến [foreign_capital_map_target.GetName], thủ đô của [foreign_capital_map_target.GetTitle.GetHolder.GetPrimaryTitle.GetName]\nKết quả sẽ tạo ra một cổ vật mạnh hơn nếu Ngài có nhiều kinh nghiệm Trait [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]"
  mapmaking.0001.z: "[visited_own_liege.GetNameNoTooltip]"
  mapmaking.0010.t: "Vẽ Bản Đồ Lãnh Địa"
  mapmaking.0010.desc: "Bất kỳ lãnh chúa giỏi nào cũng hiểu rõ lãnh địa của [ROOT.Char.GetHerHis]. [ROOT.Char.GetSheHe|U] sẽ biết phải nhờ ai để hoàn thành công việc, nơi nào còn đất bỏ hoang, điều gì cần được duy trì, và những thử thách nào phải vượt qua.\n\nKhi Ta ngồi xuống để vẽ bản đồ mô tả vùng đất của mình, Ta phải suy nghĩ xem thông tin nào là quan trọng nhất đối với người đọc tấm bản đồ này. Ta đã học được gì từ các chuyến đi của mình?"
  mapmaking.0010.a: "Nên tập trung vào các tài nguyên chưa được khai thác"
  mapmaking.0010.a.tt: "Điều này sẽ tạo ra một lộ trình với lợi ích liên quan đến kinh tế [domain|E]\nTùy chọn này có lợi hơn nếu nhân vật có [stewardship|E] cao"
  mapmaking.0010.b: "Phòng thủ lãnh địa là điều thiết yếu"
  mapmaking.0010.b.tt: "Điều này sẽ tạo ra một lộ trình với lợi ích liên quan đến phòng thủ [domain|E] của Ngài\nTùy chọn này có lợi hơn nếu nhân vật có [martial|E] cao"
  mapmaking.0020.t: "Những Vùng Đất của [visited_own_vassal_title.GetNameNoTooltip]"
  mapmaking.0020.desc: "Bằng cách ghé thăm vùng đất của các chư hầu, Ta đã học được cách họ đối xử với thần dân của mình, họ thiếu gì và họ có dư những gì. Ta thậm chí có thể biết khá rõ nơi cất giấu bí mật và của cải của họ.\n\nTuy nhiên tất cả những điều đó không thể dễ dàng thể hiện trong một tấm bản đồ duy nhất, vì vậy Ta sẽ cần quyết định loại bản đồ mà mình muốn vẽ."
  mapmaking.0020.a: "Ta sẽ chỉ ra cách kiểm soát họ"
  mapmaking.0020.a.tt: "Điều này sẽ tạo ra một lộ trình với lợi ích liên quan đến [dread|E].\nTùy chọn này có lợi hơn nếu có nhiều kinh nghiệm Seasoned Experience trong Trait [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]"
  mapmaking.0020.b: "Tấm bản đồ này sẽ giúp ta hỗ trợ họ"
  mapmaking.0020.b.tt: "Điều này sẽ tạo ra một lộ trình với lợi ích liên quan đến quan hệ tốt với [vassals|E] và [courtiers|E].\nTùy chọn này có lợi hơn nếu nhân vật có [diplomacy|E] cao"
  mapmaking.0020.c: "Bản đồ của ta sẽ vạch trần bí mật của họ"
  mapmaking.0020.c.tt: "Điều này sẽ tạo ra một lộ trình với lợi ích liên quan đến [schemes|E].\nTùy chọn này có lợi hơn nếu nhân vật có [intrigue|E] cao"
  mapmaking.0030.t: "Vùng Đất Chưa Được Khám Phá"
  mapmaking.0030.desc: "[poi_map_target.Custom('GetSpecialBuildingPrefix')|U][poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] có lẽ là một trong những nơi để lại ấn tượng sâu sắc nhất với Ta trong các chuyến du hành. Hành trình đến [poi_map_target.GetHolding.GetNameNoTooltip] cũng đáng nhớ gần như vậy, và có lẽ đã diễn ra nhanh hơn nhiều nếu Ta chuẩn bị tốt hơn.\n\nTuy nhiên Ta chỉ có thể truyền tải một lượng thông tin nhất định, và khi ngồi xuống để mô tả những gì đã xảy ra, Ta phải quyết định trọng tâm của mình sẽ là gì."
  mapmaking.0030.a: "Không gì quan trọng hơn một hành trình nhanh chóng và an toàn."
  mapmaking.0030.a.tt: "Tập trung vào hành trình đến [poi_map_target.GetHolding.GetNameNoTooltip] sẽ tạo ra một lộ trình giúp tăng [travel|E] Safety và Speed.\nTùy chọn này có lợi hơn nếu có nhiều Seasoned Experience trong Trait [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]"
  mapmaking.0030.b: "Ta sẽ vẽ bản đồ của chính [poi_map_target.GetHolding.GetNameNoTooltip]."
  mapmaking.0030.b.tt: "Tập trung vào [poi_map_target.Custom('GetSpecialBuildingPrefix')][poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] sẽ tạo ra một lộ trình với lợi ích liên quan đến loại [point_of_interest|E].\nTùy chọn này có lợi hơn nếu có nhiều Traveler Experience trong Trait [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]"
  mapmaking.0040.t: "[foreign_kingdom_map_target.GetNameNoTooltip]"
  mapmaking.0040.desc: "Chuyến hành trình của Ta đến [foreign_kingdom_map_target.GetNameNoTier] đã dạy Ta nhiều điều, không chỉ về thần dân [foreign_kingdom_map_target.GetAdjectiveNoTooltip] mà còn về cách vùng đất của họ khác với vùng đất của chúng ta. Người dân [foreign_kingdom_map_target.GetAdjectiveNoTooltip] có phong tục riêng, và kiếm sống theo những cách khác với chúng ta. Theo nhiều cách, bản thân vùng đất ấy cũng xa lạ với Ta.\n\nKhi bắt đầu mô tả những gì mình đã học được, Ta phải quyết định trọng tâm của mình sẽ là gì và Ta muốn những người du hành khác biết đến điều gì."
  mapmaking.0040.a: "Triều đình tại [background_terrain_scope.GetTitle.GetNameNoTierNoTooltip] thật sự khó quên"
  mapmaking.0040.a.tt: "Tập trung vào triều đình sẽ tạo ra một lộ trình với lợi ích liên quan đến [prestige|E].\nTùy chọn này có lợi hơn nếu có nhiều Traveler Experience trong Trait [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]"
  mapmaking.0040.b: "Ta sẽ tập trung vào con người và phong tục của họ"
  mapmaking.0040.b.tt: "Tập trung vào con người sẽ tạo ra một lộ trình với lợi ích liên quan đến [diplomacy|E].\nTùy chọn này có lợi hơn nếu có nhiều Seasoned Experience trong Trait [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]"
  mapmaking.0040.c: "Mọi người phải biết về những [foreign_kingdom_map_target.GetAdjectiveNoTooltip] [SCOPE.Custom('mythical_map_creatures')]!"
  mapmaking.0040.c.tt: "Tập trung vào sinh vật thần thoại sẽ tạo ra một lộ trình với lợi ích liên quan đến [dynasty_prestige|E]."
  mapmaking.0004.t: "Những [background_terrain_scope.Custom('GetTerrainLandPlural')|U] của [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip]"
  mapmaking.0004.heat.t: "Cái Nóng Thiêu Đốt của [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip]"
  mapmaking.0004.snow.t: "[background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetAdjectiveNoTooltip] [background_terrain_scope.Custom('GetBadWeatherDesc')|U]"
  mapmaking.0004.fighting.t: "Những Nguy Hiểm của [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip]"
  mapmaking.0004.monsoon.t: "Những Cơn Mưa của [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip]"
  mapmaking.0004.desc.intro: "Bất kỳ lộ trình nào cũng phải cảnh báo người đọc về những nguy hiểm phía trước.\n\n"
  mapmaking.0004.fighting.desc: "Việc đi qua khu vực này đã dạy Ta phải luôn cảnh giác trước các cuộc phục kích và tấn công. Luật của kẻ mạnh là luật lệ tại [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip], dù gặp bọn cướp, lãnh chúa địa phương hay quân đội ngoại bang, Ta luôn phải sẵn sàng tự vệ.\n\n"
  mapmaking.0004.snow.desc: "Ta sẽ không bao giờ quên những mùa đông của [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip], với những trận bão tuyết bất ngờ, nhiệt độ giảm mạnh và một biển tuyết trắng dường như vô tận mà chúng Ta phải lội qua.\n\n"
  mapmaking.0004.heat.desc: "Ký ức mạnh mẽ nhất của Ta về [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip] là những tia nắng mặt trời khắc nghiệt. Khi băng qua [background_terrain_scope.Custom('GetTerrainLandPlural')] chúng Ta luôn phải tìm kiếm bóng râm và nước ngọt.\n\n"
  mapmaking.0004.monsoon.desc: "Những cơn mưa lớn của [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip] sẽ luôn là ký ức khó quên đối với Ta. Trong mùa gió mùa, ngay cả con đường an toàn nhất cũng biến thành một vũng bùn lầy lội.\n\n"
  mapmaking.0004.terrain_steppes.desc: "Thảo nguyên rộng lớn theo nhiều cách chính là đặc điểm nổi bật nhất của khu vực này. Hoang dã, chưa được thuần hóa và khó canh tác, vùng đất này cung cấp rất ít nguồn tiếp tế hay nước ngọt..."
  mapmaking.0004.terrain_deep_forests.desc: "Những khu rừng sâu sẽ định hình bất kỳ hành trình nào qua vùng đất này. Những tuyến đường nên đi, cách kiếm thức ăn và săn bắn là những ký ức không thể thiếu Ta có từ [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip]..."
  mapmaking.0004.terrain_wetlands.desc: "Vùng đầm lầy là đặc điểm khó quên của khu vực này và cách tốt nhất để tìm đường qua sương mù cùng địa hình nguy hiểm là điều lập tức hiện lên trong tâm trí Ta..."
  mapmaking.0004.terrain_undulating.desc: "Du hành trong khu vực này đồng nghĩa với việc chuẩn bị cho một hành trình gian nan, khi độ cao thay đổi liên tục ở mỗi khúc quanh. Tuy vậy, Ta vẫn nhớ mãi những khung cảnh hùng vĩ khi đứng trên đỉnh..."
  mapmaking.0004.terrain_open_farmland.desc: "Việc tích trữ lương thực ở đây chưa bao giờ là vấn đề đối với chúng Ta, khu vực này không phải là địa hình nguy hiểm. Những cánh đồng được canh tác tốt trải dài theo mọi hướng từ [background_terrain_scope.GetTitle.GetNameNoTierNoTooltip]..."
  mapmaking.0004.terrain_open.desc: "Một vùng đất rộng lớn trống trải khiến Ta không bao giờ có thể che giấu sự xuất hiện của mình tại đây, thay vào đó chúng Ta phải sẵn sàng đối mặt trực tiếp với bất kỳ kẻ thù nào..."
  mapmaking.0004.terrain_desert.desc: "Sa mạc đặt ra những yêu cầu khắc nghiệt đối với Ta khi du hành qua khu vực này — trong không gian rộng lớn trống trải không có nơi nào để trốn khỏi mặt trời hay kẻ thù."
  mapmaking.0004.terrain_jungle.desc: "Rừng rậm là nơi sinh sống của nhiều loài động thực vật, cả có lợi lẫn chết người. Biết phân biệt chúng và biết cách dựng trại đúng cách là những kinh nghiệm không thể thiếu..."
  mapmaking.0004.desc.generic_fallback: "Hiếm khi Ta thấy một vùng đất tầm thường đến vậy, cả trước lẫn sau chuyến đi này. Sự nhạt nhòa của vùng đất chỉ tương xứng với con người bình thường của nó."
  mapmaking.0004.a: "Tập trung vào việc di chuyển qua [background_terrain_scope.Custom('GetTerrainLandPlural')]"
  mapmaking.0004.a.tt: "Tùy chọn này sẽ tạo ra một cổ vật với lợi ích liên quan đến địa hình [background_terrain_scope.GetTerrain.GetName] [terrain|E]"
  mapmaking.0004.b: "Ta sẽ mô tả cách chuẩn bị phục kích"
  mapmaking.0004.b.tt: "Tùy chọn này sẽ tạo ra một cổ vật với lợi ích liên quan đến [travel|E] Safety và khả năng tự vệ"
  mapmaking.0004.c: "Tập trung vào cách đối phó với giá lạnh"
  mapmaking.0004.c.tt: "Tùy chọn này sẽ tạo ra một cổ vật với lợi ích liên quan đến mùa đông"
  mapmaking.0004.d: "Đối phó với cái nóng là điều thiết yếu"
  mapmaking.0004.d.tt: "Tùy chọn này sẽ tạo ra một cổ vật với lợi ích liên quan đến [travel|E] Safety trong địa hình nóng [terrain|E]"
  mapmaking.0004.e: "Gió mùa mới là điều quan trọng hơn"
  mapmaking.0004.e.tt: "Tùy chọn này sẽ tạo ra một cổ vật với lợi ích liên quan đến [travel|E] Safety trong địa hình ẩm ướt [terrain|E]"
  mapmaking.1000.t: "Hành Trình Đến [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTooltip]"
  mapmaking.1000.internal.t: "Du Hành Qua [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTooltip]"
  mapmaking.1000.mythical.t: "Hành Trình Đến Vùng Đất của [SCOPE.Custom('mythical_map_creatures')|U]"
  mapmaking.1000.desc: "Khi Ta hoàn thành trang cuối cùng của bản thảo, Ta cảm thấy vô cùng thỏa mãn.\n\nViệc ghi chép lại những gì Ta đã học được trong các chuyến du hành theo nhiều cách là một trải nghiệm đầy hoài niệm, cho phép Ta sống lại những khoảnh khắc quan trọng trong quá khứ đồng thời tạo ra thứ gì đó có thể giúp ích cho những người du hành trong tương lai.\n\nTa hy vọng lộ trình kết quả cùng với tấm bản đồ chi tiết về tuyến đường của Ta qua [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTooltip] có thể vượt qua thử thách của thời gian."
  mapmaking.1000.a: "Chuyến hành trình này giờ đã kết thúc"
  map_artifact_name: "Hành Trình Đến [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTooltip]"
  map_artifact_name_domain: "Lãnh Địa của [author.GetTitledFirstNameNoTooltip]"
  map_artifact_name_vassal_dread: "Về Việc Khuất Phục Các Chư Hầu [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetAdjectiveNoTooltip]"
  map_artifact_name_vassal_opinion: "Du Hành Qua Vương Quốc [background_terrain_scope.GetTitle.GetHolder.GetLiege.GetPrimaryTitle.GetAdjectiveNoTooltip]"
  map_artifact_name_vassal_intrigue: "Lộ Trình Bí Mật của Vương Quốc [background_terrain_scope.GetTitle.GetHolder.GetLiege.GetPrimaryTitle.GetAdjectiveNoTooltip]"
  map_artifact_name_poi: "Hành Trình Đến [poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
  map_artifact_name_mythical: "Vùng Đất của [SCOPE.Custom('mythical_map_creatures_capitalized')|U]"

  map_artifact_beginning_western: "Cuốn sách nhỏ bìa da này là một lộ trình có kèm bản đồ gấp bên trong. Cùng nhau, bản đồ và cuốn sách minh họa hành trình của [author.GetFullName]"
  map_artifact_beginning_far_eastern: "Bản thảo lá cọ này là một lộ trình của chuyến hành trình do [author.GetFullName] thực hiện"
  map_artifact_beginning_internal: "[newly_created_artifact.GetDesc] bên trong lãnh thổ của [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTier]. Nó đi kèm một tấm bản đồ chi tiết cũng do chính tay [author.GetHerHis] vẽ.\nĐây là câu chuyện về một chuyến hành trình qua "
  map_artifact_beginning_external: "[newly_created_artifact.GetDesc] đến vùng đất của [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTier]. Nó đi kèm một tấm bản đồ chi tiết cũng do chính tay [author.GetHerHis] vẽ.\nĐây là câu chuyện về một chuyến hành trình qua "
  map_artifact_danger_type_heat: "[newly_created_artifact.GetDesc]cái nóng thiêu đốt, luôn phải đối mặt với tình trạng thiếu nước,"
  map_artifact_danger_type_monsoons: "[newly_created_artifact.GetDesc]những cơn gió mùa dữ dội,"
  map_artifact_danger_type_snowstorms: "[newly_created_artifact.GetDesc]cái lạnh khắc nghiệt, bão tuyết,"
  map_artifact_danger_type_fighting: "[newly_created_artifact.GetDesc]những vùng đất vô luật pháp, nơi xung đột gần như không thể tránh khỏi,"
  map_artifact_danger_type_undulating: "[newly_created_artifact.GetDesc]những ngọn đồi nhấp nhô, các con đèo núi nguy hiểm,"
  map_artifact_danger_type_wetlands: "[newly_created_artifact.GetDesc]những vùng đầm lầy nguy hiểm, đầy rẫy bệnh tật,"
  map_artifact_danger_type_open: "[newly_created_artifact.GetDesc]những đồng bằng rộng lớn trống trải, nơi không có nơi trú ẩn,"
  map_artifact_danger_type_desert: "[newly_created_artifact.GetDesc]những sa mạc khắc nghiệt, không có nước hay nơi trú ẩn,"
  map_artifact_danger_type_jungle: "[newly_created_artifact.GetDesc]những khu rừng rậm rạp, đầy rẫy động vật nguy hiểm,"
  map_artifact_danger_type_forests: "[newly_created_artifact.GetDesc]những khu rừng sâu, đầy những nguy hiểm ẩn giấu,"
  map_artifact_danger_type_steppes: "[newly_created_artifact.GetDesc]những thảo nguyên rộng mở, xa rời vùng đất định cư,"
  map_artifact_danger_type_farmlands: "[newly_created_artifact.GetDesc]những vùng đất nông nghiệp trù phú, đủ để nuôi sống bất kỳ đoàn tùy tùng nào,"
  map_artifact_danger_type_end: "[newly_created_artifact.GetDesc] và ý kiến của [author.GetFirstNamePossessiveNoTooltip] về cách tốt nhất để đối phó với những điều đó.\n\n"
  map_artifact_domain_purpose_growth: "[newly_created_artifact.GetDesc]Chuyến hành trình được mô tả được thực hiện để kiểm tra lãnh địa của tác giả và lộ trình ghi lại những gì [author.GetTitledFirstName] đã học được về lãnh địa của [author.GetHerHis] cũng như cách khai thác tài nguyên và của cải từ vùng đất của [author.GetHerHis] một cách hiệu quả nhất."
  map_artifact_domain_purpose_defensive: "[newly_created_artifact.GetDesc]Chuyến hành trình được mô tả được thực hiện để kiểm tra lãnh địa của tác giả. Cả lộ trình và bản đồ đều mô tả cách [author.GetTitledFirstName] sẽ bảo vệ vùng đất của [author.GetHerHis] trước các đội quân thù địch. Bản đồ cho thấy nơi nên xây dựng phòng thủ, cách hỗ trợ tốt nhất cho quân đội của [author.GetHerHis], và những gì kẻ tấn công có thể làm."
  map_artifact_vassal_purpose_dread: "[newly_created_artifact.GetDesc]Lộ trình mô tả một chuyến hành trình được thực hiện để kiểm tra vùng đất của các chư hầu của tác giả.\nCác điểm mạnh được nhận thấy đều được đánh dấu trên bản đồ, cùng với hướng dẫn về cách tốt nhất để phá vỡ mọi sự kháng cự. Ngoài ra còn có ghi chú về tính cách của chính các chư hầu và cách tốt nhất để đe dọa họ phải khuất phục."
  map_artifact_vassal_purpose_opinion: "[newly_created_artifact.GetDesc]Văn bản mô tả một chuyến hành trình nhằm kiểm tra vùng đất của các chư hầu của tác giả — kèm theo ghi chú về những tài sản có giá trị và tính cách của từng chư hầu. Nó bao gồm nhiều gợi ý về cách hỗ trợ và lấy lòng những lãnh chúa này để giữ được sự ủng hộ của họ."
  map_artifact_vassal_purpose_intrigue: "[newly_created_artifact.GetDesc]Văn bản mô tả một chuyến hành trình nhằm kiểm tra các chư hầu của tác giả, với rất nhiều ghi chú về lối vào lâu đài, các lối đi bí mật, và nơi các chư hầu khác nhau của [author.GetTitledFirstName] cất giữ những tài sản quý giá nhất của họ."
  map_artifact_poi_travel: "[newly_created_artifact.GetDesc]Mục tiêu của chuyến hành trình dường như là chuyến thăm đến [poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]. Bản đồ mô tả chi tiết tuyến đường đã đi cũng như cách tốt nhất để tránh những sai lầm mà [author.GetTitledFirstName] cảm thấy [author.GetSheHe] đã mắc phải trên đường."
  map_artifact_poi_purpose: "[newly_created_artifact.GetDesc]Mục tiêu của chuyến hành trình dường như là chuyến thăm đến [poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]. Có một bản đồ đặc biệt chỉ bao gồm [poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] và khu vực xung quanh, và lộ trình mô tả những gì Ngài có thể mong đợi tìm thấy tại đó."
  map_artifact_foreign_purpose_court: "[newly_created_artifact.GetDesc]Chuyến hành trình được mô tả kết thúc bằng chuyến thăm đến triều đình [foreign_kingdom_map_target.GetAdjectiveNoTooltip] tại [background_terrain_scope.GetTitle.GetNameNoTierNoTooltip] và tác giả dành khá nhiều thời gian nói về đời sống của tầng lớp thượng lưu trong vương quốc."
  map_artifact_foreign_purpose_people: "[newly_created_artifact.GetDesc]Mục đích của chuyến hành trình được mô tả là chuyến thăm đến triều đình [foreign_kingdom_map_target.GetAdjectiveNoTooltip] nhưng lộ trình hầu như không nhắc đến thủ đô. Thay vào đó, nó mô tả rất chi tiết về người dân vùng đất này, cùng với phong thái và phong tục kỳ lạ của họ."
  map_artifact_foreign_purpose_mythical: "[newly_created_artifact.GetDesc]Chuyến hành trình được mô tả kết thúc bằng chuyến thăm đến triều đình [foreign_kingdom_map_target.GetAdjectiveNoTooltip] nhưng trọng tâm chính lại là mô tả rất sống động về một vùng đất bị ám ảnh bởi [SCOPE.Custom('mythical_map_creatures')] và cách một lữ khách nên chuẩn bị tốt nhất để đối phó với chúng."
