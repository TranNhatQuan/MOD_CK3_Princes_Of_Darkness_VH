l_english:
  journey_events.10.t: "Bạn Đồng Hành Ngoài Trời"
  journey_events.10.desc: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], Ta nhận thấy ngài đang rất cần một người bạn đồng hành khi đi đường." Ta nghe [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('provider_character'))] của mình, [provider_character.GetFirstName], nói khi [provider_character.GetSheHe] bước vào phòng làm việc của Ta. [provider_character.GetSheHe|U] nhìn Ta với vẻ đầy ẩn ý, "Hôm nay có một đoàn thương nhân đi ngang qua [ROOT.Char.GetCapitalLocation.GetName], và Ta thấy họ có rất nhiều động vật để bán."\n\nKhi Ta hỏi thêm chi tiết, [provider_character.GetSheHe] nhắc đến những con chó, ngựa và chim ưng với đủ kích cỡ mà [provider_character.GetSheHe] đã thấy. Nghĩ lại, Ta tự nhủ rằng có lẽ một người bạn đồng hành cho những chuyến đi của mình chính là điều Ta cần."
  journey_events.10.a: "Một chiến mã đúng nghĩa, như thế mới hoàn hảo."
  journey_events.10.b: "Chó mới thật sự là bạn đồng hành."
  journey_events.10.c: "Một con chim ưng săn mồi là thứ Ta cần."
  journey_events.10.d: "Ta không hứng thú với thú cưng."

  journey_events.11.t: "Bạn Đồng Hành Ngoài Trời: Ngựa"
  journey_events.11.desc: "Sau một hai ngày, cuối cùng Ta cũng được trao cho một con ngựa to lớn và mạnh mẽ. Ngay khi được giao cho Ta, Ta cảm nhận con thú đầy ý chí này đang cố vùng vẫy chống lại.\n\nTrong chốc lát, Ta lo rằng mình sẽ bị hất văng khỏi lưng nó, nhưng cuối cùng Ta vẫn giữ được thăng bằng, dù chỉ vừa đủ. Con thú sau đó nhìn Ta với thứ mà Ta chỉ có thể mô tả là một tia tôn trọng."
  journey_events.11.a: "Ta nghĩ rồi chúng ta sẽ trở thành bạn tốt."

  journey_events.12.t: "Bạn Đồng Hành Ngoài Trời: Chó"
  journey_events.12.desc: "Sau một hai ngày, cuối cùng Ta được mang đến một chiếc hộp nhỏ. Nó khẽ rung lên khi Ta lại gần, và sau một chút do dự, Ta mở nó ra để gặp người bạn đồng hành nhỏ mới của mình.\n\nNgay khi nắp hộp được mở, chú chó con nhảy ra và bắt đầu chạy vòng quanh phòng đầy năng lượng. Sau khoảng một phút, nó dừng lại, nằm phịch xuống một bên và bắt đầu ngủ gật."
  journey_events.12.a: "Nó hơi nhỏ nhỉ?"

  journey_events.20.t: "Trên Bầu Trời Cao"
  journey_events.20.desc: "Trời đã khá muộn trong ngày khi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('informer_character'))] của Ta là [informer_character.GetFirstName] tiến đến với ánh nhìn lấp lánh trong mắt [informer_character.GetHerHis].\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], Ta đã nghe một tin đồn có thể khiến ngài hứng thú."\n\n[informer_character.GetSheHe|U] sau đó kể rằng [informer_character.GetSheHe] đã nghe được một câu chuyện về những hiện tượng thiên văn xuất hiện trên bầu trời phía trên [destination_province.GetName] một cách thường xuyên gần đây. Dù chi tiết về hiện tượng này vẫn còn khá mơ hồ, người ta nói rằng đó là trải nghiệm chỉ có một lần trong đời."
  journey_events.20.a: "Nghe thật thú vị..."

  wayfarer_astronomical_phenomenon: "Hiện Tượng Thiên Văn"
  wayfarer_astronomical_phenomenon_desc: "#emp Trong một [activity|E] [GetActivityType('activity_roaming').GetName], bạn sẽ trải nghiệm một sự kiện độc đáo tại [barony|E] này#!\n\nCác câu chuyện nói rằng vùng đất này thường xuyên xuất hiện những hiện tượng thiên văn kỳ diệu."

  journey_events.30.t: "Một Hai Câu Chuyện"
  journey_events.30.desc: "Ta bắt gặp [character_1.GetFirstName] và [character_2.GetFirstName] đang hào hứng trò chuyện với nhau. "Thật sao? Ở [traveller_province.GetName] à?" Khi họ nhận ra Ta, [character_1.GetFirstNameNoTooltip] quay sang hỏi, "Ngài đã từng đến đó trong một chuyến đi của mình rồi phải không, [ROOT.Char.GetFirstName]?"\n\n"Thấy không, [character_2.GetFirstNameNoTooltip] nói rằng [character_2.GetSheHe] đã thấy [traveller_province.Custom('journey_events_30_custom_loc')] ở [traveller_province.GetNameNoTooltip]. Ngài đã từng thấy thứ gì như vậy chưa?""
  journey_events.30.a: "[traveller_province.Custom('journey_events_30_short_custom_loc')] ở [traveller_province.GetNameNoTooltip] à? Ồ, để ta kể cho các ngươi nghe!"
  journey_events.30.a.tt: "Bạn nghĩ mình #emp có thể#! đã từng đến [traveller_province.Custom('journey_events_30_short_custom_loc')] ở [traveller_province.GetNameNoTooltip], nhưng như thế thì chẳng thành câu chuyện hay. Có lẽ nên thêm thắt một chút..."
  journey_events.30.a.win: "Ta thuyết phục họ rằng mình biết rõ về nơi đó"
  journey_events.30.a.loss: "Họ phát hiện Ta đang 'thêm thắt'"
  journey_events.30.b: "Ta nghĩ là có?"
  journey_events.30.c: "Không, hãy kể ta nghe đi, [character_2.GetFirstNameNoTooltip]."

  journey_events_30_custom_loc_fallback: "một vòm đá tự nhiên tuyệt đẹp"
  journey_events_30_custom_loc_oasis: "một ốc đảo xanh tươi đáng nhớ"
  journey_events_30_custom_loc_desert: "một cự thạch cổ đại cao vút"
  journey_events_30_custom_loc_mountains: "những khung cảnh ngoạn mục từ sườn núi"
  journey_events_30_custom_loc_forest: "khu rừng rộng lớn"

  journey_events_30_short_custom_loc_fallback: "vòm đá"
  journey_events_30_short_custom_loc_oasis: "ốc đảo"
  journey_events_30_short_custom_loc_desert: "cự thạch"
  journey_events_30_short_custom_loc_mountains: "khung cảnh"
  journey_events_30_short_custom_loc_forest: "khu rừng lớn"

  journey_events.40.t: "Một Thi Sĩ Địa Phương"
  journey_events.40.desc: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]," [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('suggester_character'))] của Ta, [suggester_character.GetFirstName], lên tiếng khi [suggester_character.GetSheHe] bước vào phòng. "Mọi người trong triều đều biết ngài thích chia sẻ những câu chuyện và chiến tích trong các chuyến du hành của mình, và Ta đảm bảo rằng ai cũng rất thích nghe."\n\n[suggester_character.GetSheHe|U] tiếp tục, "Ta nghe nói gần đây có một thi sĩ địa phương trở nên khá nổi tiếng. Một kiểu người hát rong mà bọn nông dân rất thích. Nếu có đủ động lực, có lẽ anh ta có thể bắt đầu kể những câu chuyện của ngài khắp lãnh địa?""
  journey_events.40.a: "Ngươi nói đúng, ai cũng xứng đáng được nghe những câu chuyện của ta..."
  journey_events.40.a.tt: "Một số [counties|E] trong [realm|E] của bạn sẽ nhận được [GetModifier( 'journey_local_bard_modifier' ).GetNameWithTooltip] trong #high 3 năm#!"
  journey_events.40.b: "Ta có thể nghĩ ra cách tiêu tiền tốt hơn, [suggester_character.GetFirstNameNoTooltip]."

  journey_local_bard_modifier: "Thi Sĩ Địa Phương"
  journey_local_bard_modifier_desc: "Một thi sĩ đang kể lại những câu chuyện du hành của vị lãnh chúa, mang lại niềm vui lớn cho dân địa phương."

  journey_events.50.t: "Một Đêm ở [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]"
  journey_events.50.desc: "Từ lâu Ta đã tự hỏi thần dân của mình giao tiếp với nhau ra sao khi không có ánh mắt của giới quý tộc. Sau khi suy nghĩ kỹ, Ta đã tìm được thời điểm thích hợp để lẻn ra ngoài, cùng với vài mảnh vải rách rưới có thể dùng làm cải trang.\n\nNhưng khi thời khắc đến gần, Ta bắt đầu do dự. Việc này có phù hợp với thân phận của [ROOT.Char.GetTitleAsNameNoTooltip] hay không?"
  journey_events.50.a: "Bây giờ rút lui thì đã quá muộn."
  journey_events.50.a.win: "Ta lẻn ra ngoài"
  journey_events_50_event_chain_begins_tt: "Ta đi đến [rootscope.GetCapitalLocation.GetName]"
  journey_events.50.a.loss: "Ta bị bắt gặp khi đang mặc đồ rách rưới"
  journey_events.50.b: "Không, ta không thể bị bắt gặp trong bộ dạng này!"
  journey_events.50.b.tt: "Ta bị làm sao vậy? Dĩ nhiên ta sẽ không ngồi cùng nông dân và nông nô!"

  journey_events.51.desc: "Ta tìm thấy một tòa nhà vừa nhếch nhác vừa đông khách khi đi qua các con phố. Ngay khi bước vào, Ta được đưa cho một ly rượu, và đám đông đẩy Ta đến một chỗ ngồi ở góc phòng. Không ai thèm nhìn Ta lần thứ hai trong suốt quá trình đó.\n\nTa ngồi một mình, quan sát những người khác trong quán. Một nhóm ồn ào tụ tập quanh một chiếc bàn lớn, nơi vài nông dân đang vui vẻ với một trò chơi xúc xắc."
  journey_events.51.a: "Được thôi, ta sẽ cho họ thấy quý tộc chơi trò này thế nào."
  journey_events.51.a.tt: "Đã đến lúc lấy đi chút sinh kế ít ỏi của họ. Gần giống như đánh thuế vậy!"
  journey_events.51.a.big_win: "Ta thắng gần như mọi ván"
  journey_events.51.a.win: "Ta thắng vài ván lẻ tẻ"
  journey_events.51.a.loss: "Ta thua nhiều hơn thắng"
  journey_events.51.b: "Đã đến lúc uống hết ly rượu và về nhà."
  journey_events.51.b.tt: "Ta đã thấy đủ nông dân cho cả đời."

  journey_events.52.desc: "Ban đầu không khí khá vui vẻ, nhưng càng uống nhiều và đêm càng muộn, mọi người quanh bàn càng trở nên bực bội và tức giận. Một người trong số họ, [local_gambler.GetFirstNameNoTooltip], đứng bật dậy và lớn tiếng tuyên bố, "Lũ quý tộc chết tiệt! Chúng chẳng hiểu gì về cuộc sống của những người #bold bình thường#! như chúng ta! Đặc biệt là tên công tử vô dụng [ROOT.Char.GetTitledFirstName]!"\n\nTa cảm thấy mình như co rúm lại trên ghế khi cả bàn đồng loạt tán thành. [local_gambler.GetFirstNameNoTooltip] nhận ra điều đó, khi [local_gambler.GetSheHe] quay sang Ta và hỏi, "Còn anh nghĩ sao?""
  journey_events.52.a: "Ta nghĩ đã đến lúc gọi thêm một vòng nữa!"
  journey_events.52.a.tt: "Cứ để rượu chảy cho đến khi họ ngừng phàn nàn!"
  journey_events.52.b: "Thật ra thì... ta #bold chính là#! [ROOT.Char.GetTitledFirstNameNoTooltip]."
  journey_events.52.b.tt: "Ta sẽ chứng minh họ sai về mình!"
  journey_events.52.c: "Nghe nói [threat_1.GetTitledFirstNameNoTooltip] đang tự tay lấy hết thuế của chúng ta cho [threat_1.GetHerselfHimself]..."
  journey_events.52.c.chancellor: "Ta nghe khá nhiều chuyện về [threat_1.GetCouncilTitle] tham nhũng [threat_1.GetFirstNameNoTooltip]..."
  journey_events.52.c.steward: "Có lẽ [threat_1.GetCouncilTitle] [threat_1.GetFirstNameNoTooltip] đang thu thêm thuế để tư lợi cho chính mình [threat_1.GetHerselfHimself]..."
  journey_events.52.c.marshal: "Ta thấy [threat_1.GetCouncilTitle] [threat_1.GetFirstNameNoTooltip] đánh chết một người ngay trên đường..."
  journey_events.52.c.spymaster: "Ta nghe nhiều chuyện rất mờ ám về [threat_1.GetCouncilTitle] [threat_1.GetFirstNameNoTooltip]..."
  journey_events.52.c.chaplain: "Tin đồn đang lan truyền về những hành vi tội lỗi của [threat_1.GetCouncilTitle] [threat_1.GetFirstNameNoTooltip]..."
  journey_events.52.c.fallback: "Ta nghe nói người thực sự có lỗi là [threat_1.GetCouncilTitle] [threat_1.GetFirstNameNoTooltip]."
  journey_events.52.c.tt: "Đây là cơ hội để đổ lỗi cho người khác, như tên ngốc [threat_1.GetFirstNameNoTooltip] đó."

  journey_drink_and_circus_modifier: "Rượu và Trò Vui"
  journey_drink_and_circus_modifier_desc: "Hạt này chứng kiến lượng rượu được phát cho các quán rượu địa phương tăng lên bởi lãnh chúa của họ, có người còn nói là chính tay ngài làm."

  journey_blame_game_modifier: "Quý Tộc Không Được Lòng Dân"
  journey_blame_game_modifier_desc: "Nhân vật này cực kỳ không được lòng dân địa phương, và vô số tin đồn về họ đang lan truyền."

  journey_blame_game_province_modifier: "Lãnh Chúa Được Lòng Dân"
  journey_blame_game_province_modifier_desc: "Lãnh chúa của hạt này ngày càng được yêu mến sau khi các câu chuyện về việc họ đấu tranh vì dân chúng lan truyền khắp thị trấn."

  journey_pauper_king_modifier: "Vị Vua Nghèo"
  journey_pauper_king_modifier_desc: "Được cho là đặc biệt được nông dân và nông nô yêu mến nhờ nhiều câu chuyện về sự thân thiện và gần gũi của họ với tầng lớp thấp hơn."

  journey_events.53.desc: "Ta gọi hết vòng rượu này đến vòng rượu khác cho đến khi tất cả đều gục xuống hoặc về nhà. Cuối cùng, chỉ còn [local_gambler.GetFirstNameNoTooltip] và Ta ngồi lại bên bàn. [local_gambler.GetSheHe|U] gần như không thể ngồi thẳng nữa nhưng vẫn nhìn Ta bằng ánh mắt lác lác.\n\n"Biết không, ngươi cũng không tệ lắm đối với một quý tộc." [local_gambler.GetSheHe|U] lẩm bẩm trước khi đầu [local_gambler.GetHerHis] gục xuống bàn, và [local_gambler.GetSheHe] cũng ngất luôn."
  journey_events.53.a: "Hừm, không biết từ lúc nào [local_gambler.GetSheHe] nhận ra nhỉ."
  journey_events.53.a.tt: "Đã đến lúc về nhà trước khi có ai quá lo lắng vì Ta biến mất."

  journey_events.54.desc: "Ban đầu bầu không khí khá căng thẳng. Nhưng sau khi Ta kể những câu chuyện về chuyến du hành của mình và gọi vài vòng rượu, Ta cảm nhận mọi người dần thư giãn. Một lúc sau, quán rượu trở nên vui vẻ, và mọi người bắt đầu hỏi đủ loại câu hỏi.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], nếu ngài không phiền khi Ta nói..." [local_gambler.GetFirstNameNoTooltip] bắt đầu cẩn thận, "Chúng Ta có một đội dân binh địa phương ở [ROOT.Char.GetCapitalLocation.GetNameNoTooltip], và chúng Ta rất sẵn lòng phục vụ ngài trực tiếp hơn."\n\nDù Ta cố gắng từ chối, họ vẫn khăng khăng với lời đề nghị. Khi chủ quán cuối cùng đóng cửa, tất cả dường như đều rất vui vẻ khi lần lượt rời khỏi quán."
  journey_events.54.a: "Đúng là một buổi tối hiệu quả!"
  local_militia_name_default: "Dân Binh Địa Phương"

  journey_events.55.desc: "Ta cố gắng xoa dịu bầu không khí căng thẳng trong phòng thì đột nhiên cảm thấy cú đấm đầu tiên — và rồi là hàng loạt cú đấm khác.\n\nSau một trận đòn với vô số cú đấm và cú đá, Ta bị ném ra con hẻm phía sau. Ta gần như không còn cảm nhận được khuôn mặt mình nữa, và cũng không thể đứng dậy.\n\nSau nhiều giờ đau đớn, vài lính canh đi ngang qua, và một người trong số họ bằng cách nào đó nhận ra mặt Ta. Họ giúp Ta đứng dậy và đưa Ta trở về nhà."
  journey_events.55.a: "Toàn bộ ý tưởng này là một sai lầm..."

  journey_events.56.desc: "Ban đầu, Ta chỉ định nghĩ ra vài lời châm chọc nhẹ nhàng về tính cách của [threat_1.GetFirstName], nhưng sau một lúc, Ta cảm thấy mình bắt đầu nhập tâm vào câu chuyện. Không còn là lớp vỏ giả tạo để đổ lỗi nữa, mà đơn giản là Ta thực sự ghét [threat_1.GetWomanMan] đó.\n\nKhi Ta tiếp tục thêu dệt những câu chuyện về sự bóc lột của [threat_1.GetHerHis], Ta còn thêm vào việc [ROOT.Char.GetTitledFirstName], tức là Ta, phải khó khăn thế nào khi đối phó với sự tham nhũng của [threat_1.GetHerHis].\n\nĐến cuối buổi tối, mọi người rời đi với cái nhìn hoàn toàn khác về cả [threat_1.GetFirstName] lẫn Ta."
  journey_events.56.a: "Đó là điều [threat_1.GetSheHe] đáng nhận."
  journey_events.56.a.tt: "Một buổi tối hiệu quả, giờ là lúc trở về nhà trước khi có ai quá lo lắng vì Ta vắng mặt."

  journey_events.57.desc: "Dù Ta cố gắng hết sức để đổ lỗi cho [threat_1.GetCouncilTitle] của mình, [threat_1.GetFirstName], Ta liên tục bị người này người kia ngắt lời. Họ cứ xen vào bằng những lời nhận xét về tính cách của Ta hoặc vài tin đồn về Ta.\n\nTrước khi Ta kịp nhận ra, buổi tối đã kết thúc, và tất cả rời đi với cái nhìn về Ta còn tệ hơn lúc ban đầu. Chuyện quái gì đã xảy ra vậy?"
  journey_events.57.a: "Ai mà ngờ ta lại không được lòng dân đến vậy?"
  journey_events.57.a.tt: "Ừm... Không hiệu quả như ta hy vọng, nhưng dù sao cũng là một buổi tối đáng nhớ..."

  journey_events.60.t: "Khai Sáng"
  journey_events.60.desc_intro: "Gần đây, Ta cảm thấy trong lòng đầy bất an. Những [journey_province.Custom('TerrainTypeProvincePrefix')] [journey_county.Custom('TerrainTypeCountyScopePlural')] ở [journey_county.GetNameNoTierNoTooltip] thật tuyệt đẹp, nhưng chúng vẫn không thể lấp đầy cảm giác trống rỗng vô tận.\n\nTrong khi đang thực hiện công việc thường ngày, "
  journey_events.60.desc_courtly: "Ta bước vào triều đình của [journey_county.GetHolder.GetNamePossessive], và nhìn [journey_county.GetHolder.GetHerHim] chủ trì. Các lãnh chúa và quý bà của [journey_county.GetHolder.GetPrimaryTitle.GetNameNoTierNoTooltip] tụ tập quanh [journey_county.GetHolder.GetHerHim] một cách trang nghiêm khi những người thỉnh cầu bắt đầu xuất hiện. Tất cả đều trình diện trước [journey_county.GetHolder.GetTitleTierName] với sự tôn kính, dù là để xin vàng hoặc sự hỗ trợ của [journey_county.GetHolder.GetHerHis]. Dù yêu cầu có tầm thường hay nhàm chán đến đâu, [journey_county.GetHolder.GetSheHe] vẫn lắng nghe chăm chú và đưa ra phán quyết công bằng."
  journey_events.60.desc_bellicose: "Ta tình cờ bắt gặp một doanh trại và quan sát một nhóm hiệp sĩ đang luyện tập. Họ đấu tập với nhau, và từng chuyển động vừa toát lên sự tàn bạo, vừa mang nét uyển chuyển khi họ di chuyển gần như hoàn toàn đồng bộ. Chỉ huy của họ nhìn họ với niềm tự hào rõ rệt, và sự tôn trọng lẫn nhau giữa họ có thể cảm nhận được."
  journey_events.60.desc_stoic: "Ta chứng kiến lũ trẻ chơi đùa trên đường phố, ngoại trừ một đứa dường như là mục tiêu của trò đùa. Nó bị xô đẩy, quần áo bị rách, nhưng vẫn giữ vẻ bình tĩnh và điềm đạm. Nó chỉ đứng dậy, phủi bụi và tiếp tục đi, khiến những đứa khác bối rối rồi nhanh chóng mất hứng với nó."
  journey_events.60.desc_bureaucratic: "những học trò địa phương chạy khắp thị trấn, mang theo cuộn giấy và sách vở. Một tờ giấy rơi khỏi tay một người mà cậu ta không hề để ý. Trước khi Ta kịp trả lại, Ta nhận thấy một bản thiết kế phức tạp trên [ROOT.Char.Custom('GetWritingMaterial')] thu hút ánh nhìn của mình. Dường như đó là kế hoạch cho một công trình mới ở [journey_county.GetNameNoTierNoTooltip], với những đặc điểm tiên tiến mà Ta chỉ mong đợi từ trí tuệ của một bậc kiến trúc sư bậc thầy. Không ai trong số các học sinh trông quá 18 tuổi, nhưng họ đã làm chủ một nghề mà người khác phải mất cả đời."
  journey_events.60.desc_spiritual: "Ta bắt gặp một nhóm nông dân và tu sĩ tụ tập thành vòng tròn. Những bài thánh ca nhẹ nhàng của họ vang lên trong không khí, dù Ta không rõ họ đang ca ngợi [ROOT.Char.GetFaith.HighGodName] hay vị thần nào khác. Nhìn kỹ hơn, Ta nhận ra một số nông dân có địa vị cao hơn, thậm chí có người mặc trang phục quý tộc. Tuy vậy, tất cả dường như đều đang ở trong trạng thái bình yên, khi sự tôn kính thần linh gắn kết họ lại với nhau."
  journey_events.60.desc_egalitarian: "Ta quyết định ghé nhanh vào một quán rượu địa phương, và bước thẳng vào một cuộc thảo luận. Từ giọng nói đến trang phục, những vị khách có rất ít điểm giống nhau. Thế nhưng cuộc trò chuyện lại khá lịch sự và sôi nổi, và dường như không có sự phán xét nào, như thể tất cả đều được sinh ra từ cùng một nơi. Mọi người được đối xử như một lữ khách ở [journey_county.GetNameNoTierNoTooltip], thay vì là một [journey_culture.GetNameNoTooltip] khác hay [ROOT.Char.GetCulture.GetNameNoTooltip]."
  journey_events.60.desc_communal: "một tiếng hét kinh hoàng vang lên, và mọi người vội chạy đến nơi phát ra. Ta đi theo và thấy một người phụ nữ ôm chặt đứa bé trước một ngôi nhà đang cháy. Những người khác lập tức xách nước, thậm chí cả quý tộc cũng xắn tay vào giúp. Ngọn lửa nhanh chóng được dập tắt, nhưng ngôi nhà của người mẹ đã mất. Dân làng tụ tập quanh cô và đứa trẻ, chia sẻ những gì ít ỏi họ có để giúp họ xây dựng lại."
  journey_events.60.opt: "Có lẽ ta có thể học được điều gì đó từ những [journey_culture.GetCollectiveNounNoTooltip] này."
  journey_events.60.opt_b: "Ta đã chứng kiến quá nhiều trong chuyến du hành của mình."

  journey_bellicose_modifier: "Tôn Trọng Võ Đạo"
  journey_bellicose_modifier_desc: "Nhân vật này đã chứng kiến các hiệp sĩ luyện tập và cảm thấy vô cùng khâm phục."

  journey_stoic_modifier: "Ý Chí Bất Khuất"
  journey_stoic_modifier_desc: "Nhân vật này thực hành nghệ thuật khắc kỷ."

  journey_bureaucratic_modifier: "Kiến Trúc Sư Tương Lai"
  journey_bureaucratic_modifier_desc: "Nhân vật này đã chứng kiến việc lập kế hoạch tiên tiến cho một dự án xây dựng địa phương."

  journey_spiritual_modifier: "Tôn Kính Thần Linh"
  journey_spiritual_modifier_desc: "Nhân vật này trân trọng sự hiện diện của một quyền năng tối cao."

  journey_egalitarian_modifier: "Người Ủng Hộ Phổ Quát"
  journey_egalitarian_modifier_desc: "Nhân vật này đã thấy được lợi ích của một xã hội đa dạng.\n[courtier|E] Chi phí Tuyển Mộ: #P -10%#!"

  journey_communal_modifier: "Người Bảo Trợ Cộng Đồng"
  journey_communal_modifier_desc: "Nhân vật này tập hợp cộng đồng của mình khi cần thiết.\n[GetActivityType('activity_camp_party').GetName] [activity|E] Chi phí: #P -20%#!\n[GetActivityType('activity_feast').GetName] [activity|E] Chi phí: #P -20%#!"

  journey_courtly_modifier: "Người Sành Triều Đình"
  journey_courtly_modifier_desc: "Nhân vật này trân trọng một triều đình được vận hành tốt."
