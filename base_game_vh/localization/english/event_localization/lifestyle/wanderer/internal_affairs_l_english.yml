l_english:
  internal_affairs.10.t: "Một Cuộc Nổi Loạn Sắp Tới"
  internal_affairs.10.desc: ""Và đó là tình hình hiện tại ở [barony_title.GetName], [ROOT.Char.Custom('FormOfAddressForLiege')]." [provider_character.GetFirstName] thông báo với Ta. Dường như gần đây đã xảy ra những cuộc bạo loạn nhỏ trên đường phố, do một vụ phẫn nộ về "
  internal_affairs.10.desc.control: "tội phạm cướp bóc hoành hành, đe dọa đến sự an toàn của người dân."
  internal_affairs.10.desc.opinion.other: "sự căm ghét chúa tể [county_holder.GetTitledFirstName] của họ."
  internal_affairs.10.desc.opinion.me: "quyền cai trị của Ta ở khu vực này."
  internal.affairs.10.desc.outro: "\n\nNgười duy nhất có thể ngăn chặn tình hình khỏi việc bùng phát thành bạo lực là [barony_holder.GetTitledFirstName], một người dường như rất được lòng dân chúng địa phương. Ngoài việc giữ cho dân chúng trong tầm kiểm soát, [barony_holder.GetSheHe] cũng đã gửi một bản kiến nghị nhỏ xin được tổ chức lễ hội trong vùng, nhằm xoa dịu tình hình thêm nữa."
  internal_affairs.10.a: "Vậy hãy để [barony_holder.GetTitledFirstNameNoTooltip] chịu trách nhiệm..."
  internal_affairs.10.b: "... [county_holder.GetFirstNameNoTooltip] cũng sẽ được đền bù cho việc này!"
  internal_affairs.10.c: "[barony_holder.GetSheHe|U] có thể tổ chức lễ hội của [barony_holder.GetHerHis]."
  internal_affairs.10.d: "Chẳng phải đó là công việc của [county_holder.GetFirstNamePossessiveNoTooltip] sao?"

  internal_affairs_local_uprising_appeasement_modifier: "Người Dân Được Xoa Dịu"
  internal_affairs_local_uprising_appeasement_modifier_desc: "Người dân trong hạt đã được xoa dịu sau khi thay đổi người cai trị khu vực."

  internal_affairs_local_uprising_festival_modifier: "Lễ Hội Nông Thôn"
  internal_affairs_local_uprising_festival_modifier_desc: "Một lễ hội nông thôn nhỏ được tổ chức hàng năm để xoa dịu người dân."

  internal_affairs.20.t: "[county_holder.GetLadyLord] Không Phù Hợp"
  internal_affairs.20.desc: "Trong tuần này, lần thứ ba Ta nhận được sứ giả thông báo về tình trạng tồi tệ của [county_title.GetNameNoTier]."
  internal_affairs.20.desc.both: "Tội phạm hoành hành, người dân chết trên đường phố, và bầu không khí chung của nỗi sợ hãi và bất mãn."
  internal_affairs.20.desc.control: "Tội phạm lan tràn, đường xá không an toàn, người dân sợ ra ngoài sau khi mặt trời lặn."
  internal_affairs.20.desc.opinion: "Sự bất mãn sâu sắc với cách quản lý hạt, và các cuộc biểu tình thường xuyên trên đường phố."
  internal_affairs.20.desc.outro: "\n\nTa đã gửi sứ giả cho [county_holder.GetTitledFirstName], nhưng dường như vấn đề vẫn chưa có hồi kết. Đây có phải là hành động của người xứng đáng trở thành #emp chư hầu#! của Ta không?"
  internal_affairs.20.dread: "Nếu muốn vắt kiệt họ, hãy làm cho đúng. Kẻ nghiệp dư."
  internal_affairs.20.a: "Không thể chấp nhận được."
  internal_affairs.20.a.tt: "Ngài có thể hợp pháp [revoke|E] một [title_i] [title|E] từ [county_holder.GetTitledFirstName]"
  internal_affairs.20.b: "Ta sẽ bỏ qua lần này."

  opinion_unfitting_ruler_opinion: "Người Cai Trị Không Phù Hợp"
  MODIFIER_DEFINITION_UNFITTING_RULER_DESC: "\nModifier này tăng theo mức độ [dread|E] của [holder|E]"

  inspection_unfitting_ruler_modifier: "Hạt Bị Vắt Kiệt"
  inspection_unfitting_ruler_modifier_desc: "Hạt này đang bị vắt kiệt, với thuế má và người dân chảy ra mỗi ngày."

  inspection_unfitting_ruler_desc: "\t#weak Tăng theo mỗi #bold Dread#! mà [holder|E] có#!"

  internal_affairs.30.t: "Nhắm Mắt Làm Ngơ"
  internal_affairs.30.desc: ""Ngài thấy đấy, [ROOT.Char.Custom('FormOfAddressForLiege')], một số kỳ vọng địa phương đặt ra cho chúng ta thật #emp khắt khe#! với kinh doanh..." Ta được [merchant_character.GetFirstName], đại diện của [SCOPE.Custom('LocalGuildsLoc')] tại [guild_province.GetName], tiếp cận. [merchant_character.GetSheHe|U] đã nói dài về những rắc rối mà hội của [merchant_character.GetHerHis] phải trải qua.\n\n"Ta nghĩ, có thể, chúng ta nên giải quyết mọi thứ giữa hai bên." [merchant_character.GetSheHe|U] đặt một túi nhỏ lên bàn trước mặt Ta, và nhìn Ta với ánh mắt hiểu ý."
  internal_affairs.30.a: "Ồ, Ta có thể làm hơn việc chỉ nhắm mắt làm ngơ..."
  internal_affairs.30.b: "Chỉ lần này thôi."
  internal_affairs.30.c: "Biến khỏi đây trước khi Ta cho người giết, đồ hút máu!"

  internal_affairs.40.t: "Những Mối Liên Kết Lỏng Lẻo"
  internal_affairs.40.follower_intro: "Đóng vai trò sứ giả, [secret_giver.GetFirstName] chuyển tiếp tin tức xung quanh khu vực, giữ Ta cập nhật trong khi Ta bận việc khác. Dù phần lớn những gì [secret_giver.GetSheHe] đề cập không có gì bất thường, giọng điệu [secret_giver.GetHerHis] vẫn có vẻ lo lắng mỗi khi nhắc đến [secret_haver.GetNamePossessive].\n\nCuối cùng, "
  internal_affairs.40.courtier_intro: "Trong lúc đi dạo quanh trại, Ta nghe thấy một giọng nói lạ, đang trò chuyện với một trong những đồng hành gần đó. Ta dừng lại và nghe. Cuộc trao đổi ban đầu có vẻ tẻ nhạt, nhưng rồi [secret_haver.GetName] được nhắc tới.\n\n"
  internal_affairs.40.desc: "[secret_giver.GetFirstName] đi sâu vào những chủ đề nhạy cảm liên quan đến [secret_haver.GetFirstNameNoTooltip], tiết lộ những việc có thể làm xấu đi danh tiếng của [secret_haver.GetHerHis]..."
  internal_affairs.40.a: "Có lẽ ngươi sẽ có ích cho ta, [secret_giver.GetFirstName]."
  internal_affairs.40.blackmail: "Ta chắc chắn có thể biến chuyện này thành lợi thế cho mình."
  internal_affairs.40.expose: "Mọi người nên biết [secret_haver.GetFirstName] đang làm gì!"
  internal_affairs.40.move_zealous: "[GetPlayer.GetFaith.HighGodName] gọi ta rời khỏi đây..."
  internal_affairs.40.move: "Có lẽ đã đến lúc rời khỏi [GetPlayer.GetDomicile.GetLocation.GetName]..."
 
  internal_affairs.50.t: "Cuộc Biểu Tình của [target_faith.GetAdherentNameNoTooltip]"
  internal_affairs.50.desc: "Người dân [tensions_county.GetNameNoTier] dường như không đặt niềm tin hay tình cảm vào [tensions_county.GetHolder.GetName]. Không cần suy đoán nguyên nhân, vì các tượng [target_faith.GetAdherentNameNoTooltip] bị phá hoại, và gia tăng xung đột giữa [target_faith.GetAdherentNamePluralNoTooltip] và [opposing_faith.GetAdherentNamePluralNoTooltip]."
  internal_affairs.50.desc.holder_faith:0 "Mặc dù [tensions_county.GetHolder.GetNameNoTooltip] có thể đồng nhất với những người [target_faith.GetAdherentNamePluralNoTooltip] [tensions_county.GetHolder.GetHerHim] tự thân, nhưng chính đức tin [tensions_county.GetHolder.GetHerHis] không thể dập tắt sự hiện diện của một [target_liege.GetTitleTierName] theo đức tin [opposing_faith.GetAdherentNameNoTooltip]."
  internal_affairs.50.desc.root_faith: "\n\nTa tự hỏi có nên quan tâm đến tình hình của các [GetPlayer.GetFaith.GetAdherentNamePluralNoTooltip] khác, ít nhất để đảm bảo việc thờ phụng [GetPlayer.GetFaith.HighGodName] không bị cản trở."
  internal_affairs.50.desc.neutral_faith: "\n\nDù Ta không thực hành [opposing_faith.GetNameNoTooltip] hay [target_faith.GetNameNoTooltip], cũng đáng để xem có thể làm gì."
  internal_affairs.50.desc_end: "Tốt nhất là Ta có thể làm việc để ổn định các căng thẳng này, kẻo chúng đe dọa an toàn của Ta."
  internal_affairs.50.tolerance: "Hãy để [target_faith.GetAdherentNamePluralNoTooltip] giữ niềm tin của họ."
  internal_affairs.50.conversion: "[tensions_county.GetNameNoTierNoTooltip] nên hoàn toàn theo [opposing_faith.GetAdherentNameNoTooltip]!"
  internal_affairs.50.neutral_cynic: "Tại sao người ta để tôn giáo chi phối cuộc sống của họ?"
  internal_affairs.50.neutral: "Mặt khác, chuyện này không liên quan đến Ta..."
  internal_affairs.tolerance_desc: "Ngài cố gắng giúp dân chúng khẳng định quyền thực hành [target_faith.GetNameNoTooltip]."
  internal_affairs.conversion_desc: "Ngài cố gắng chuyển đổi dân chúng [tensions_county.GetNameNoTierNoTooltip] sang [opposing_faith.GetNameNoTooltip]."
  local_zealots_appeased_tt: "Người [target_faith.GetAdherentNamePluralNoTooltip] địa phương đã được xoa dịu"
  religious_tension_continues_tt: "Bất ổn [target_faith.GetAdherentNameNoTooltip] vẫn tiếp tục"
  religious_county_converted_tt: "[tensions_county.GetNameNoTierNoTooltip] đã theo [opposing_faith.GetNameNoTooltip]"

  internal_affairs.60.t: "Kho Báu Của Bọn Cướp"
  internal_affairs.60.desc: "Khi đi qua các lối đi của [bandit_location.GetNameNoTier], Ta nhận thấy một bóng người đang di chuyển trong góc mắt. Quay góc, Ta thấy một nhóm đàn ông dữ dằn chất đầy chiến lợi phẩm vào xe, di chuyển nhanh như thể [GetPlayer.GetFaith.DevilName] [GetPlayer.GetFaith.DevilHerselfHimself] đuổi theo.\n\nHầu hết nhóm rời đi lấy thêm đồ, và [bandit_character.GetFirstName] ở lại giữ chốt. Ta nhận thấy một túi trên xe có niêm phong của [bandit_holder.GetName], nhưng Ta cần nội dung bên trong..."
  internal_affairs.60.force: "Liệu [bandit_character.GetName] sẽ làm gì?"
  internal_affairs.60.force_tt: "Ta đối mặt với kẻ cướp đơn lẻ và cố lấy phần thưởng của [bandit_character.GetHerHis] cho riêng Ta"
  internal_affairs.60.force_tt_succ: "Ta lấy thành công chiến lợi phẩm của bọn cướp"
  internal_affairs.60.force_tt_fail: "[bandit_character.GetNameNoTooltip] đánh bật Ta ra"
  internal_affairs.60.snitch: "[bandit_holder.GetFirstName] sẽ muốn nghe về chuyện này."
  internal_affairs.60.snitch_tt: "Ta báo cho [bandit_holder.GetNameNoTooltip] về hoạt động của bọn cướp, và [bandit_holder.GetSheHe] thưởng cho Ta một phần chiến lợi phẩm."
  internal_affairs.60.sus: "Có lẽ [bandit_character.GetNameNoTooltip] có thể rủ Ta tham gia một số việc của [bandit_character.GetHerHis]..."
  internal_affairs.60.sus_tt: "Tạo #V 3#! [criminal_task_contracts|E] trên bản đồ"
  internal_affairs.60.neutral: "Đây không phải việc của Ta."

  MODIFIER_DEFINITION_LOCAL_CORRUPTION_DESC: "\nModifier này tăng khi [county_control|E] của [county|E] càng thấp"
  internal_affairs_local_corruption_desc: "\t#weak Tăng với mỗi điểm #bold County Control#! dưới 100#!"

  internal_affairs_local_corruption_modifier: "Tham Nhũng Được Hợp Thức Hóa"
  internal_affairs_local_corruption_modifier_desc: "Một hội thương nhân địa phương đã giành được quyền lực gần như không giới hạn trong hoạt động kinh doanh địa phương, dần dần làm suy yếu bộ máy hành chính và hệ thống thứ bậc của hạt."

  internal_affairs_camp_momentum_modifier: "Động Lực Trại"
  internal_affairs_camp_momentum_modifier_desc: "Nhà phiêu lưu này đã được kêu gọi lên đường, và có thể sẽ dựng trại ở nơi khác."

  internal_affairs_county_religious_tensions_modifier: "Căng Thẳng Tôn Giáo Gia Tăng"
  internal_affairs_county_religious_tensions_modifier_desc: "Hạt này đang trải qua căng thẳng tôn giáo, bị làm trầm trọng thêm bởi sự can thiệp của một thế lực có ảnh hưởng.\n[convert_county|E] Tiến Trình Hàng Tháng: #N -0.2#!"

  RELIGIOUS_TENSIONS_DESC: "[GetModifier( 'internal_affairs_county_religious_tensions_modifier' ).GetNameWithTooltip]"
  RELIGIOUS_TOLERANCE_DESC: "[GetModifier( 'internal_affairs_county_religious_tolerance_modifier' ).GetNameWithTooltip]"
 
  internal_affairs_county_religious_tolerance_modifier: "Khoan Dung Tôn Giáo"
  internal_affairs_county_religious_tolerance_modifier_desc: "Tiếng nói của thiểu số tôn giáo trong hạt này đã được lắng nghe, và quyền thực hành đức tin của họ được tôn trọng — ít nhất là trong thời điểm hiện tại.\n[convert_county|E] Tiến Trình Hàng Tháng: #N -0.1#!"
 
  internal_affairs_character_religious_tolerance_modifier: "$internal_affairs_county_religious_tolerance_modifier$"
  internal_affairs_character_religious_tolerance_modifier_desc: "Nhân vật này đã cho người khác thấy giá trị của việc tôn trọng niềm tin của người khác — có lẽ họ cũng nên làm như vậy."

