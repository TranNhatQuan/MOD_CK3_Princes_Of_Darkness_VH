l_english:
  destination_events.10.t: "Người Du Hành Kinh Nghiệm"
  destination_events.10.desc: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]," [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('provider_character'))] của ta, [provider_character.GetFirstName], bắt đầu khi [provider_character.GetSheHe] bước vào phòng làm việc của ta. "Gần đây ta có tiếp xúc với một trưởng đoàn lữ hành mà có thể hữu ích cho chuyến đi của ngươi. [travel_leader_character.GetSheHe|U] đã đi khắp nơi, và có kinh nghiệm mà chúng ta đang tìm kiếm."\n\nChúng ta đã gặp khó khăn trong việc tìm ai đó chịu trách nhiệm cho các chuyến đi của ta, có lẽ đây là cơ hội tốt?"
  destination_events.10.a: "Vậy hãy thuê người du hành này."
  destination_events.10.a.tt: "[travel_leader_character.GetUINamePossessive|U] [aptitude|E] là [travel_leader_character.GetCourtPositionAptitude( GetCourtPositionType( 'travel_leader_court_position' ) )]"
  destination_events.10.b: "[travel_leader_character.GetSheHe|U] không làm ta hứng thú."

  destination_events.20.t: "Chuẩn Bị Cho Chuyến Đi"
  destination_events.20.desc: ""Gì cơ? Thêm vật dụng, ngươi nói sao?" Ta đáp khi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('provider_character'))], [provider_character.GetFirstName], mang đến một phát hiện gần đây trong kho của ta.\n\n"Thật vậy, không rõ tại sao chúng lại không xuất hiện trong sổ sách của ta. Nhưng đây là một phép lành nhỏ. Ngươi định làm gì với chúng?"\n\nNhững vật dụng thừa này có thể hữu ích cho chuyến đi tiếp theo của ta."
  destination_events.20.a: "Với những thứ này, chúng ta có thể có một hành trình chậm rãi và tỉ mỉ."
  destination_events.20.b: "Hãy xem chúng ta có thể đổi lấy vài con ngựa không."
  destination_events.20.c: "Bán các vật dụng thừa."

  destination_excursion_safety_modifier: "Chuẩn Bị Cho Chuyến Đi: An Toàn"
  destination_excursion_safety_modifier_desc: "#emp Sẽ biến mất sau khi đến [destination|E]#!\nVật dụng đã được để dành cho chuyến đi tiếp theo, đảm bảo chuyến đi an toàn."

  destination_excursion_speed_modifier: "Chuẩn Bị Cho Chuyến Đi: Tốc Độ"
  destination_excursion_speed_modifier_desc: "#emp Sẽ biến mất sau khi đến [destination|E]#!\nNgựa thừa đã được chuẩn bị cho chuyến đi tiếp theo, đảm bảo hành trình nhanh chóng và hiệu quả."

  destination_events.30.t: "Hành Trình Đến [journey_province.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
  destination_events.30.desc: "Gần đây ta tình cờ tìm thấy một lịch trình du lịch nhỏ mô tả chuyến đi của một thương nhân địa phương đến thành phố [journey_province.GetName]. Nó kể chi tiết về việc [ROOT.Char.GetSheHe] đã tham quan [journey_province.GetHolding.GetSpecialBuildingType.GetName], và tất cả các điểm tham quan địa phương trong thành phố.\n\nCó lẽ đây sẽ là nơi ta nên đến vào lần hành trình tiếp theo..."
  destination_events.30.a: "Nghe có vẻ là một nơi đáng nhớ!"
  destination_events.30.a.tt: "Ngươi có thể nhận thêm [wanderer_lifestyle|E] Kinh Nghiệm nếu ghé thăm [journey_province.GetName] trong một [GetActivityType('activity_journey').GetName]"

  destination_events.30.toast.title: "Hành Trình Đến [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip]"

  destination_events.40.t: "Ngôn Ngữ [poi_province.GetCulture.GetLanguage.GetNameNoTooltip]"
  destination_events.40.desc:0 "Vì một lý do nào đó, ta lại hồi tưởng về chuyến đi đến [poi_province.GetName], và đặc biệt là ngôn ngữ [poi_province.GetCulture.GetLanguage.GetName] mà ta nghe rất nhiều khi ở đó. Có một điều gì đó #emp [poi_province.Custom('DestinationInspiredLanguageDescriptor')]#! về nó mà ta không thể quên.\n\nSự tình cờ khiến một học giả người [teacher_character.GetCulture.GetName] tên là [teacher_character.GetFirstName] đến thăm triều đình của ta. Ta có thể yêu cầu sự phục vụ [teacher_character.GetHerHis] của hắn, và có lẽ [teacher_character.GetSheHe] có thể dạy ta [poi_province.GetCulture.GetLanguage.GetNameNoTooltip]."
  destination_events.40.a: "Điều này sẽ làm chuyến đi tiếp theo thú vị hơn nhiều!"
  destination_events.40.b: "Học thêm một ngôn ngữ nghe có vẻ nhiều việc quá…"

  destination_inspired_by_language: "Được Truy Cảm Hứng Bởi Ngôn Ngữ"
  destination_inspired_by_language_desc: "Nhân vật này được truyền cảm hứng học một ngôn ngữ mới sau chuyến đi đến vùng đất xa lạ."

