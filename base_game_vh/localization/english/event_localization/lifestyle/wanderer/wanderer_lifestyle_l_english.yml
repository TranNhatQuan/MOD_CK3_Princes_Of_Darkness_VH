l_english:
  wanderer_lifestyle_events.10.t: "Giấc Mơ Về Một Chuyến Hành Trình"
  wanderer_lifestyle_events.10.desc: "Căn phòng này, những bức tường này, cái ghế chết tiệt này... Ta #bold quá#! chán ngấy tất cả rồi.\n\nTa #emp cần#! phải rời khỏi đây. Ta cần đi đâu đó khác. Bất cứ nơi nào khác.\n\nMỗi ngày Ta bị mắc kẹt trong căn phòng khủng khiếp này, Ta cảm thấy như một phần nhỏ của cuộc đời mình lại bị lấy mất."
  wanderer_lifestyle_events.10.a: "Ta cần nghỉ ngơi khỏi tất cả chuyện này..."
  wanderer_lifestyle_events.10.a.tt: "[traveling|E] sẽ loại bỏ [modifier|E] này, và mang lại [stress_loss|E] cùng [lifestyle_experience|E]"

  wanderer_restlessness_modifier: "Sự Bồn Chồn"
  wanderer_restlessness_modifier_desc: "#emp [modifier|E] này sẽ biến mất vào lần tiếp theo Ngài [travel|E] đến bất cứ đâu#!\nMỗi ngày tẻ nhạt trôi qua đều dành để mơ về việc ở một nơi khác."

  wanderer_restlessness_removal_title: "Sự Thư Thái"

  wanderer_lifestyle_events.20.t: "Thời Gian Của Ta Ở [reminiscing_location.GetNameNoTooltip]"
  wanderer_lifestyle_events.20.desc: "Khi Ta lục lọi đồ đạc của mình để tìm thứ gì đó, Ta bắt gặp một bức tượng nhỏ cũ của [SCOPE.Custom('mythical_map_creatures')], thứ mà Ta đã nhặt được trong chuyến thăm [reminiscing_location.GetName]. Khi nhìn vào nó, Ta nhớ lại "
  wanderer_lifestyle_events.20.desc.special_building: "[reminiscing_location.GetHolding.GetSpecialBuildingType.GetName], một nơi mà Ta đã lâu không nghĩ đến."
  wanderer_lifestyle_events.20.desc.coastal: "bến cảng lớn và khung cảnh tuyệt đẹp nhìn ra đại dương."
  wanderer_lifestyle_events.20.desc.river: "dòng sông chảy qua thành phố và nhiều cây cầu bắc ngang qua nó."
  wanderer_lifestyle_events.20.desc.castle: "lâu đài hùng vĩ sừng sững nhìn xuống thành phố."
  wanderer_lifestyle_events.20.desc.city: "thành phố rộng lớn tráng lệ với nhiều khu vực và vô số góc nhỏ."
  wanderer_lifestyle_events.20.desc.people: "những con người thân thiện sống ở đó."
  wanderer_lifestyle_events.20.desc.outro_child: "\n\nKhi Ta đang hồi tưởng, [listening_child.GetFirstName] đột nhiên xông vào. "Đó là cái gì vậy?" [listening_child.GetSheHe|U] hỏi, tò mò nhìn vào bức tượng nhỏ."
  wanderer_lifestyle_events.20.desc.outro: "\n\nKhi hồi tưởng, Ta cảm thấy một làn sóng hoài niệm. Có lẽ... Có lẽ sẽ không tệ nếu Ta lại lên đường đến thăm [reminiscing_location.GetNameNoTooltip] một lần nữa."
  wanderer_lifestyle_events.20.a: "Để ta kể cho con nghe về [SCOPE.Custom('mythical_map_creatures')] của [reminiscing_location.GetNameNoTooltip]!"
  wanderer_lifestyle_events.20.b: "Một ngày nào đó, ta sẽ lại thấy [reminiscing_location.GetNameNoTooltip]..."
  wanderer_lifestyle_events.20.b.child: "Thứ này đến từ [reminiscing_location.GetNameNoTooltip], có lẽ một ngày nào đó ta có thể đưa con đến đó."

  wanderer_lifestyle_events.20.a.win: "[listening_child.GetSheHe|U] bị cuốn hút bởi câu chuyện"
  wanderer_lifestyle_events.20.a.lose: "[listening_child.GetSheHe|U] không hoàn toàn tin câu chuyện, nhưng vẫn thích nghe"

  wanderer_lifestyle_events.20.b.tt: "Ngài có thể nhận thêm [wanderer_lifestyle|E] Experience hoặc [stress_loss|E] nếu Ngài [travel|E] qua [reminiscing_location.GetName]"

  wanderer_lifestyle_events.25.t: "Một Lần Ghé Thăm Khác"
  wanderer_lifestyle_events.25.desc: "Ta đi dọc những con đường giống hệt như lần trước khi Ta ở [province_location.GetName]. Ta thấy những quầy hàng cũ, ngửi thấy những mùi quen thuộc và nghe những âm thanh quen thuộc.\n\nCó một sự an tâm khi biết rằng vài thứ vẫn không thay đổi."
  wanderer_lifestyle_events.25.a: "Đây... chính là điều Ta đã hy vọng."

  wanderer_lifestyle_events.30.t: "Giấc Mơ Về Những Vùng Đất Xa Xôi"
  wanderer_lifestyle_events.30.desc: "Khi xem lại sách của mình, Ta tìm thấy một cuốn nhật ký du hành của một thương nhân đi qua [ROOT.Char.Custom('DistantLandsRegionLoc')].\n\n"#emp Khi chúng Ta đi qua [ROOT.Char.Custom('DistantLandsTerrainTypeLoc')], Ta đột nhiên nhìn thấy một [ROOT.Char.Custom('DistantLandsGroupTypeLoc')] [ROOT.Char.Custom('DistantLandsPluralTypeLoc')] [ROOT.Char.Custom('DistantLandsActivityTypeLoc')].#!"
  wanderer_lifestyle_events.30.desc.singular: "#emp Nó có [ROOT.Char.Custom('DistantLandsDescriptionTypeLoc')]. Ta chỉ quan sát nó trong một phút, nó khác hẳn bất cứ thứ gì Ta từng thấy trước đây. Mãi đến sau này Ta mới biết tên của nó.#!"
  wanderer_lifestyle_events.30.desc.plural: "#emp Chúng có [ROOT.Char.Custom('DistantLandsDescriptionTypeLoc')]. Ta chỉ quan sát chúng trong một phút, chúng khác hẳn bất cứ thứ gì Ta từng thấy trước đây. Mãi đến sau này Ta mới biết tên của chúng.#!"
  wanderer_lifestyle_events.30.a.singular: "Một ngày nào đó, Ta sẽ nhìn thấy nó bằng chính mắt mình."
  wanderer_lifestyle_events.30.a.plural: "Một ngày nào đó, Ta sẽ tận mắt chứng kiến chúng."

  wanderer_lifestyle_events.30.a.europe: "Ngài có thể nhận thêm [wanderer_lifestyle|E] Experience hoặc [stress_loss|E] nếu Ngài [travel|E] qua [GetGeographicalRegion('world_europe').GetName]"
  wanderer_lifestyle_events.30.a.africa: "Ngài có thể nhận thêm [wanderer_lifestyle|E] Experience hoặc [stress_loss|E] nếu Ngài [travel|E] qua [GetGeographicalRegion('world_africa').GetName]"
  wanderer_lifestyle_events.30.a.asia: "Ngài có thể nhận thêm [wanderer_lifestyle|E] Experience hoặc [stress_loss|E] nếu Ngài [travel|E] qua [GetGeographicalRegion('world_middle_east').GetName]"
  wanderer_lifestyle_events.30.a.india: "Ngài có thể nhận thêm [wanderer_lifestyle|E] Experience hoặc [stress_loss|E] nếu Ngài [travel|E] qua [GetGeographicalRegion('world_india').GetName]"
  wanderer_lifestyle_events.30.a.tibet: "Ngài có thể nhận thêm [wanderer_lifestyle|E] Experience hoặc [stress_loss|E] nếu Ngài [travel|E] qua [GetGeographicalRegion('world_tibet').GetName]"
  wanderer_lifestyle_events.30.a.steppe: "Ngài có thể nhận thêm [wanderer_lifestyle|E] Experience hoặc [stress_loss|E] nếu Ngài [travel|E] qua [GetGeographicalRegion('world_steppe').GetName]"

  wanderer_lifestyle_events.35.t: "Giấc Mơ Trở Thành Hiện Thực"
  wanderer_lifestyle_events.35.desc.singular: "Khi chúng Ta đi qua [province_location.Custom('HoldingNoHoldingTerrainRoaming')], Ta đột nhiên thấy một con vật đang [ROOT.Char.Custom('DistantLandsActivityTypeLoc')]. Lúc đầu Ta tự hỏi đó là loài vật gì, nhưng rồi Ta nhớ đến một mô tả cũ mà Ta đã đọc từ lâu — chắc chắn đó là [ROOT.Char.Custom('DistantLandsPluralTypeLoc')]!\n\n[ROOT.Char.Custom('DistantLandsDescriptionTypeLoc')|U], nó gần như giống hệt những gì cuốn nhật ký du hành đã mô tả, "
  wanderer_lifestyle_events.35.desc.singular.adorable: "nhưng lại đáng yêu hơn rất nhiều so với những gì Ta tưởng tượng. Có điều gì đó ở nó khiến Ta vô cùng thích thú."
  wanderer_lifestyle_events.35.desc.singular.neutral: "nhưng lại hơi khác so với những gì Ta mong đợi. Tuy vậy không phải theo cách tệ."
  wanderer_lifestyle_events.35.desc.singular.taken_aback: "nhưng Ta cũng hơi bất ngờ trước hình dáng của nó... Dẫu vậy, Ta vẫn vô cùng phấn khích vì cuối cùng đã tìm thấy nó!"
  wanderer_lifestyle_events.35.desc.plural: "Khi chúng Ta đi qua [province_location.Custom('HoldingNoHoldingTerrainRoaming')], Ta đột nhiên thấy những con vật đang [ROOT.Char.Custom('DistantLandsActivityTypeLoc')]. Lúc đầu Ta tự hỏi đó là loài vật gì, nhưng rồi Ta nhớ đến một mô tả cũ mà Ta đã đọc từ lâu — chắc chắn đó là [ROOT.Char.Custom('DistantLandsPluralTypeLoc')]!\n\n[ROOT.Char.Custom('DistantLandsDescriptionTypeLoc')|U], chúng gần như giống hệt những gì cuốn nhật ký du hành đã mô tả, "
  wanderer_lifestyle_events.35.desc.plural.adorable: "nhưng chúng đáng yêu hơn rất nhiều so với những gì Ta tưởng tượng. Có điều gì đó ở chúng khiến Ta vô cùng thích thú."
  wanderer_lifestyle_events.35.desc.plural.neutral: "$wanderer_lifestyle_events.35.desc.singular.neutral$"
  wanderer_lifestyle_events.35.desc.plural.taken_aback: "nhưng Ta cũng hơi bất ngờ trước hình dáng của chúng... Dẫu vậy, Ta vẫn vô cùng phấn khích vì cuối cùng đã tìm thấy chúng!"
  wanderer_lifestyle_events.35.a: "NÓ LÀ CỦA TA!"
  wanderer_lifestyle_events.35.a.win: "Ngài đã bắt được một [ROOT.Char.Custom('DistantLandsLoc')]"
  wanderer_lifestyle_events.35.a.lose: "Ngài khiến bản thân trở nên thật ngốc nghếch"
  wanderer_lifestyle_events.35.b.singular: "Chỉ cần nhìn thấy nó thôi cũng đủ rồi."
  wanderer_lifestyle_events.35.b.plural: "Chỉ cần nhìn thấy chúng thôi cũng đủ rồi."

  wanderer_lifestyle_events.40.t: "Sai Lầm Ở Chợ"
  wanderer_lifestyle_events.40.desc: "Chuyến hành trình của Ta [ROOT.Char.GetLocationDesc|l] vẫn ổn, nhưng, thời kỳ khó khăn đang đến khi kho thực phẩm của chúng Ta gần như cạn kiệt! Mùi của [ROOT.Char.Custom('GetExpensiveMeal')] vừa được nấu thơm lừng khiến Ta bị hấp dẫn, và theo mùi đó, Ta đến một quầy hàng kỳ lạ. Một loạt [ROOT.Char.Custom('GetLocalStreetFoodPlural')] và những miếng [ROOT.Char.Custom('GetRegionalFish')] được trưng bày, với các bữa ăn được phục vụ cùng... [ROOT.Char.Custom('FavoriteTreat')] ngọt?\n\nBỏ qua điều đó, giá cả thực sự hợp lý! Người bán lẩm bẩm điều gì đó Ta không hiểu, và ra dấu để Ta đưa [provisions_merchant.GetHerHim] nhiều tiền hơn người dân địa phương, và mặc dù Ta vẫn tiết kiệm được chút tiền, Ta nên thách thức. Nhưng Ta hầu như không biết bất kỳ [provisions_merchant.GetCulture.GetLanguage.GetNameNoTooltip] nào..."
  wanderer_lifestyle_events.40.fold: "Có lẽ cứ đưa cho [provisions_merchant.GetHerHim] những gì [provisions_merchant.GetSheHe] yêu cầu, cho xong chuyện."
  wanderer_lifestyle_events.40.barter: "Ta có kế hoạch của riêng mình, dù Ta không nói được thứ tiếng lạ."
  wanderer_lifestyle_events.40.language: "Có lẽ [provisions_merchant.GetCulture.GetLanguage.GetNameNoTooltip] không hoàn toàn xa lạ với Ta..."
  wanderer_lifestyle_events.40.meh: "Thật ra, ở nhà chúng Ta cũng có đồ ăn."
  wanderer_lifestyle_events.40.language_tt: "Ngài cố gắng giao tiếp với [provisions_merchant.GetName] bằng ngôn ngữ mẹ đẻ của [provisions_merchant.GetHerHis]"
  wanderer_lifestyle_events.40.language_tt.success: "Ngài thực sự tiếp cận được [provisions_merchant.GetHerHim], và do đó nhận được giá #EMP địa phương#!"
  wanderer_lifestyle_events.40.language_learned: "Cuộc khảo sát ngôn ngữ của Ngài đã mang lại kết quả"
  wanderer_lifestyle_events.40.language_nothing: "Ngài không học được ngôn ngữ, nhưng vẫn được giá địa phương"
  wanderer_lifestyle_events.40.language_tt.fail: "Tình huống trở nên rối rắm hơn, và Ngài vẫn phải trả nhiều hơn một chút"
  wanderer_lifestyle_events.40.barter_tt: "Ngài cố gắng #EMP thuyết phục#! [provisions_merchant.GetName] giảm giá cho Ngài"
  wanderer_lifestyle_events.40.barter_tt.success: "[provisions_merchant.GetSheHe|U] ấn tượng với nỗ lực của Ngài, và đưa cho Ngài mức giá thấp hơn"
  wanderer_exotic_animal_modifier: "Động Vật Ngoại Lạ"
  wanderer_exotic_animal_modifier_desc: "Không gì gây ấn tượng bằng một loài động vật ngoại lai mà chưa ai từng thấy!"
  wanderer_lifestyle_events.40.success_title: "Ngài đã mặc cả thành công với [provisions_merchant.GetHerHim]"
  wanderer_lifestyle_events.40.fail_title: "[provisions_merchant.GetFirstNameNoTooltip] không ấn tượng"

