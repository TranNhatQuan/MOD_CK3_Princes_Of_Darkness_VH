l_english:
 #Random Trait Acquisition Events
 #Choose whether to become aggressive_attacker, unyielding_defender or flexible_leader
  learn_commander_trait.0002.t:0 "Sự Cân Bằng Tuyệt Vời"
  learn_commander_trait.0002.desc:0 "Trong cơn chiến đấu, quyết đoán thường là thứ phân biệt chiến thắng và thất bại.\n\nKhi thời điểm đến, Ta biết cách mình sẽ hành động."
  learn_commander_trait.0002.a:0 "Ta sẽ ra đòn, không bao giờ nhượng bộ!"
  learn_commander_trait.0002.b:0 "Ta giữ vững lập trường."
  learn_commander_trait.0002.c:0 "Ta luôn cảnh giác, hành động theo tình hình thực tế."
 
 #Choose whether to become a Logistician, a Military Engineer, or forder
  learn_commander_trait.0003.t:0 "Trong Lãnh Thổ Kẻ Thù"
  learn_commander_trait.0003.desc:0 "Chiến tranh được quyết định bởi các trận đánh, nhưng các trận đánh được quyết định bởi sự chuẩn bị.\n\nBị bắt gặp mà không có kế hoạch hay phương hướng là cách nhanh nhất để thất bại."
  learn_commander_trait.0003.a:0 "Quân đội Ta phải luôn được tiếp tế đầy đủ."
  learn_commander_trait.0003.b:0 "Không lâu đài nào có thể cản bước lâu được."
  learn_commander_trait.0003.c:0 "Qua sông, Ta tấn công với sự chắc chắn như thủy triều dâng cao."

 #Choose whether to become a Reaver or Reckless
  learn_commander_trait.0004.t:0 "Sóng Chiến Trường"
  learn_commander_trait.0004.desc:0 "Ta đã thấy nó xảy ra, khoảng lặng nhỏ giữa trận chiến. Khoảnh khắc ngắn khi không bên nào lao vào ẩu, và giao tranh tạm dừng, như sóng nước chia quanh hòn đá."
  learn_commander_trait.0004.b:0 "Ta sẽ luôn dồn ép tấn công!"
  learn_commander_trait.0004.c:0 "Thời gian để trang bị lại vũ khí còn sót lại trong cơ thể kẻ địch!"

 #Become a Sea Raider
  learn_commander_trait.0005.t:0 "Như Cơn Bão"
  learn_commander_trait.0005.desc:0 "Sự ào ạt của hàng trăm bước chân tràn vào nước nông, một đòn tấn công nhanh và tàn nhẫn, và các tòa nhà để lại phía sau đang cháy rực."
  learn_commander_trait.0005.a:0 "Cơn thịnh nộ của Ta sẽ không bị ngăn cản!"

 #Become a Holy Warrior
  learn_commander_trait.0006.t:0 "Lưỡi Gươm của [ROOT.Char.GetFaith.WarGodName]"
  learn_commander_trait.0006.desc:1 "Ta đã chứng kiến [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] chiến đấu. Ta biết họ tàn nhẫn đến mức nào khi hạ sát tín đồ.\n\nNhân danh [ROOT.Char.GetFaith.WarGodName], Ta sẽ đứng lên chống lại họ với lòng dũng cảm mà [ROOT.Char.GetFaith.WarGodSheHe] ban cho Ta!"
  learn_commander_trait.0006.a:0 "Ta sẽ không nghỉ cho đến khi hủy diệt kẻ thù của [ROOT.Char.GetFaith.PantheonTerm]!"

 #Become a Desert Warrior
  learn_commander_trait.0007.t:0 "Dưới Nắng Chói"
  learn_commander_trait.0007.desc:0 "Kẻ thù không thấy được phước lành từ sự khắc nghiệt của cát và cơn khát nước.\n\nHọ không hiểu quân Ta chịu nóng ra sao, kiên nhẫn chờ đợi trận đánh trong khi kẻ thù cào cổ họng khô hạn."
  learn_commander_trait.0007.a:0 "Sa mạc là đồng minh của Ta."

 #Become a Jungle Stalker
  learn_commander_trait.0008.t:0 "Nguy Hiểm Như Bụi Rậm"
  learn_commander_trait.0008.desc:0 "Trong rừng không có trận chiến dễ dàng, và Ta biết cách tận dụng. Quân Ta ép kẻ thù đi vào lối mòn rậm rạp, Ta bẫy họ trong bùn và bụi rậm, gai nhọn có thể gây sát thương ngang vũ khí.\n\nKhi đêm xuống, xác chết biến mất giữa lá rụng."
  learn_commander_trait.0008.a:0 "Rừng không phải nơi khoan dung."

 #Become a Winter Soldier
  learn_commander_trait.0009.t:0 "Lạnh Như Đêm"
  learn_commander_trait.0009.desc:0 "Cái lạnh tàn nhẫn đã cướp đi nhiều mạng sống. Nhưng không phải của Ta, cũng không phải của binh sĩ Ta.\n\nChúng Ta biết nơi kiếm thức ăn dưới tuyết, như sói truy đuổi kẻ thù, và cắn như giá lạnh giữa mùa đông khắc nghiệt..."
  learn_commander_trait.0009.a:0 "Chúng Ta tấn công như mưa đá."

#Training offer
  learn_commander_trait.11.opening:1 ""Ta nghe nói ngài muốn đào sâu hiểu biết về chiến tranh?" [teacher.GetTitledFirstName] [teacher.Custom('quirk_pos_present')] khi [teacher.GetSheHe] đến gần Ta. "Ta có thể giúp ngài nhìn nhận chiến trường theo cách mới.""

#Generic:
 #Offer:
  learn_commander_trait.11.desc:1 "\n\n[teacher.GetFirstName] nổi tiếng với việc làm chủ [teacher.GetHerHis] kỹ năng [ROOT.Char.Custom('CommanderTraitSkillDescription')]. Nếu có ai đó có thể giúp ta hiểu được, thì đó chính là [teacher.GetHerHim]."
  learn_commander_trait.11.a:0 "Ta muốn học."
  learn_commander_trait.11.b:0 "Ta sẽ để các tướng của mình lo."
  learn_commander_trait.11.martial_tt:1 "[teacher.GetFirstName] sẽ cố gắng dạy ngài [teacher.GetHerHis] kỹ năng [THIS.Char.Custom('CommanderTraitBeingTaught')]\n$EFFECT_LIST_BULLET$[martial_skill|E] cao sẽ hữu ích trong quá trình này"
  learn_commander_trait.11.b.tt:0 "#F Có lẽ để lúc khác.#!"
 #Final Test:
  learn_commander_trait.12.desc:0 "[teacher.GetTitledFirstName] đã chỉ cho Ta mọi ngóc ngách của [ROOT.Char.Custom('CommanderTraitSkillDescription')]. Bài kiểm tra cuối là trận chiến mô phỏng với [teacher.GetHerHim], để thể hiện những gì Ta đã học."
  learn_commander_trait.12.a:0 "Chuẩn bị hàng ngũ!"
  learn_commander_trait.12.b:0 "Không, Ta chưa hoàn toàn hiểu những gì [teacher.GetFirstNameNoTooltip] đang cố dạy Ta."
  learn_commander_trait.giving_up_tt:0 "#F Ta không cần học điều này#!"
  learn_commander_trait_final_test_success:0 "Chiến Thắng!"
  learn_commander_trait_final_test_success_tt:0 "#F Ta chứng minh rằng Ta đã học xong#!"
  learn_commander_trait_final_test_failure:0 "Thất Bại!"
  learn_commander_trait_final_test_failure_tt:0 "#F Ta vẫn chưa học đủ#!"
 #Success:
  learn_commander_trait.13.desc:0 "[teacher.GetTitledFirstName] cưỡi ngựa đến chỗ Ta. "Ấn tượng!" [teacher.GetSheHe] hô to. Các lực lượng 'kẻ thù' kinh ngạc trước hiệu quả của các binh sĩ khác của Ta.\n\nChẳng còn nghi ngờ gì rằng Ta đã hiểu thế nào là [ROOT.Char.Custom('CommanderTraitBeingTaught')]."
  learn_commander_trait.13.a:0 "Ta đã học được rất nhiều."
 #Failure:
  learn_commander_trait.14.desc:0 ""Có lẽ còn vài điều Ngài cần học thêm..." [teacher.GetTitledFirstName] đưa tay giúp Ta đứng dậy khỏi bùn.\n\nQuân của Ta thể hiện không tốt. Ta phải thừa nhận rằng [teacher.GetSheHe] có thể đúng."
  learn_commander_trait.14.a:0 "Cho Ta xem lại cách ngài làm."
  learn_commander_trait.14.a.tt:1 ""Ta sẽ thử lại lần nữa...""
  learn_commander_trait.14.b:0 "Quá khó rồi!"
  learn_commander_trait.14.b.tt:1 ""Ta bỏ cuộc! Ít nhất là lúc này.""

#Logistics
  learn_commander_trait.01.t:0 "Nguồn Tri Thức Hậu Cần"
 #Offer:
  learn_commander_trait.1101.desc:0 "\n\n[teacher.GetFirstName] nổi tiếng với khả năng làm chủ hậu cần. Nếu có ai có thể giúp Ta hiểu, đó là [teacher.GetHerHim]."
 #Final test
  learn_commander_trait.1201.desc:0 "[teacher.GetTitledFirstName] đã chỉ cho Ta mọi ngóc ngách về việc đảm bảo tiếp tế đến quân lính trên chiến trường. Bài kiểm tra cuối là trận chiến mô phỏng, trong đó Ta phải bảo vệ đoàn tiếp tế khỏi cuộc tấn công của [teacher.GetHerHis]."
 #Success
  learn_commander_trait.1301.desc:0 "[teacher.GetTitledFirstName] cưỡi ngựa đến chỗ Ta. "Ấn tượng!" [teacher.GetSheHe] hô to. "Quân của Ta thậm chí không thể lại gần đoàn tiếp tế.""
 #Failure
  learn_commander_trait.1401.desc:0 "Mọi việc dường như diễn ra suôn sẻ, cho đến khi Ta nhận ra rằng kỵ binh chỉ là một chiêu đánh lừa!\n\n[teacher.GetTitledFirstName] đang cầm một quả táo từ xe tiếp tế của Ta khi Ta cưỡi ngựa đến. "Ta nghĩ Ta thấy chỗ Ngài sai," [teacher.GetSheHe] nói, [teacher.Custom('quirk_pos_pp')]."

#Military Engineer
  learn_commander_trait.02.t:0 "Năng Lực Xây Dựng"
 #Offer:
  learn_commander_trait.1102.desc:0 "\n\n[teacher.GetFirstName] nổi tiếng với khả năng làm chủ kỹ thuật quân sự. Nếu có ai có thể giúp Ta hiểu, đó là [teacher.GetHerHim]."
 #Final test
  learn_commander_trait.1202.desc:0 "[teacher.GetTitledFirstName] đã chỉ cho Ta mọi ngóc ngách về công trình công thành. Khi đứng trên pháo đài mô hình, bài kiểm tra cuối là Ta phải mô tả cách chiếm pháo đài hiệu quả nhất."
 #Success
  learn_commander_trait.1302.desc:0 ""Ồ, Ta chưa nghĩ đến điều đó," [teacher.GetTitledFirstName] [teacher.Custom('quirk_pos_present')]. [teacher.GetSheHe|U] không tìm thấy một sai sót nào trong kế hoạch của Ta!"
 #Failure
  learn_commander_trait.1402.desc:0 ""Ngài quên mất tháp kia sao?" [teacher.GetTitledFirstName] chỉ từ tường thành vào khu vực trước tường mà Ta đang mô tả. Bây giờ Ta nhận ra sai lầm chí tử trong kế hoạch của mình."

#aggressive_attacker
  learn_commander_trait.03.t:0 "Nhận Thức Hủy Diệt"

#unyielding_defender
  learn_commander_trait.04.t:0 "Khiên Tri Thức"

#forder
  learn_commander_trait.05.t:0 "Giếng Sâu Nhận Thức"

#flexible_leader
  learn_commander_trait.06.t:0 "Đáp Ứng Mọi Tình Huống"

#Desert Warrior
  learn_commander_trait.07.t:0 "Trí Tuệ Sa Mạc"

#Jungle Stalker
  learn_commander_trait.08.t:0 "Bụi Rậm Tri Thức"

#Winter Soldier
  learn_commander_trait.09.t:0 "Bài Học Lạnh Lùng"

#Reaver
  learn_commander_trait.10.t:0 "Nghệ Thuật Cướp Bóc"

#Reckless
  learn_commander_trait.12.t:0 "Cắn và Xé"

#Holy Warrior
  learn_commander_trait.13.t:0 "Chiến Đấu Với Nhiệt Huyết"

#Sea Raider
  learn_commander_trait.14.t:0 "Hiểu Biết Về Cuộc Đột Kích"

#Fallbacks in case your teacher is no longer with you
  learn_commander_trait.91.t:0 "Một Mình"
  learn_commander_trait.1291.desc:0 "Mặc dù [teacher.GetTitledFirstName] không còn theo dõi Ta, Ta vẫn có thể chứng minh rằng mình đã thành thạo [ROOT.Char.Custom('CommanderTraitSkillDescription')]. Một bài kiểm tra cuối cùng, trận chiến mô phỏng để thử kỹ năng."
  learn_commander_trait.1291.a:0 "Đã đến lúc."
  learn_commander_trait.1291.b:0 "Không có [teacher.GetFirstNameNoTooltip], Ta chỉ có thể tự nói rằng mình đã làm tốt."

  learn_commander_trait.1391.desc:0 "Ta sẽ làm thầy tự hào, [teacher.GetFirstName]!\n\nTrận chiến mô phỏng của Ta thành công rực rỡ, và Ta đã chứng minh được sự thành thạo."
  learn_commander_trait.1391.a:0 "Giờ thì đưa điều này ra chiến trường thật!"

  learn_commander_trait.1491.desc:0 "Có lẽ tốt hơn là [teacher.GetTitledFirstName] không ở đây để chứng kiến...\n\nMọi thứ trong trận chiến mô phỏng của Ta đều sai lầm, và không chiến thuật nào hiệu quả!"
  learn_commander_trait.1491.a:0 "Có vẻ Ta vẫn còn vài điều cần học..."
