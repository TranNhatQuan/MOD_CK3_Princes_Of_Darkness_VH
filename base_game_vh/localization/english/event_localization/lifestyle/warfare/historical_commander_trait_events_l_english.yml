l_english:
 #Generic Lines
  historical_commander_trait.reject.tt:1 "#F Ngài sẽ tìm nguồn cảm hứng ở nơi khác #!"

 #Hannibal
  historical_commander_trait.0001.t:0 ""Kẻ Thù Của La Mã""
  historical_commander_trait.0001.desc:1 "Khi nghiên cứu chiến thuật của các vị tướng cổ đại, Ta [ROOT.Char.Custom('surprised_reaction')] khi biết về những chiến công của Hannibal Barca trong Chiến tranh Punic lần thứ hai:\n\n#F Được biết đến với tên gọi 'Kẻ Thù Của La Mã', chiến công lớn nhất của Hannibal là Trận Cannae, nơi quân đội khoảng 50.000 người của ông đã bao vây và đánh bại quân La Mã đông gấp rưỡi với 86.000 quân. Bị bao vây và không thể rút lui, chỉ còn 3.000 quân La Mã sống sót sau cuộc thảm sát.#!"
  historical_commander_trait.0001.a:0 "Như Hannibal, Ta sẽ tiêu diệt kẻ thù!"
  historical_commander_trait.0001.b:0 "Hannibal là bậc thầy thực sự của chiến thuật Fabian."
  historical_commander_trait.0001.c:0 "Sự đa năng là sức mạnh lớn nhất của Hannibal."
  historical_commander_trait.0001.d:0 "Bah! Hắn là kẻ ngốc, chiến đấu trong một cuộc chiến vô vọng."
  historical_commander_trait.0001.d.good:0 "Tàn bạo không phải là đức tính đáng ngưỡng mộ, ngay cả trong chiến tranh."
 #Caesar
  historical_commander_trait.0002.t:0 "Chiến Thắng Của Caesar"
  historical_commander_trait.0002.desc:0 "Khi nghiên cứu chiến thuật của các vị tướng cổ đại, Ta thấy thú vị khi biết về những chiến công của Julius Caesar trong cuộc chinh phục vùng Gaul.\n\n#F Trong cuộc bao vây Alesia, Caesar nhận thấy tấn công trực diện vào thành phố kiên cố sẽ quá tốn kém. Thay vào đó, ông ra lệnh xây dựng pháo đài bao quanh toàn bộ thành phố, nhốt quân địch bên trong để đói, đồng thời ngăn không cho tiếp viện giải vây.#!"
  historical_commander_trait.0002.a:0 "Một chút sáng tạo sẽ giúp nhiều trong một cuộc bao vây."
  historical_commander_trait.0002.b:0 "Hãy khiến kẻ thù phải đến với Ngài! Ta thích điều đó!"
  historical_commander_trait.0002.c:0 "Caesar đã mạo hiểm với kế hoạch đó, nhưng nó đã thành công!"
  historical_commander_trait.0002.d:0 "Ngày nay chiến tranh không còn được tiến hành như vậy..."
 #Alexander
  historical_commander_trait.0003.t:0 "Alexander Không Thể Ngăn Cản"
  historical_commander_trait.0003.desc:0 "Khi nghiên cứu chiến thuật của các vị tướng cổ đại, Ta [ROOT.Char.Custom('surprised_reaction')] khi biết về những chiến công của Alexander Đại đế trong cuộc chinh phục vùng Mesopotamia.\n\n#F Trong cuộc Bao vây Tyre, Alexander tấn công pháo đài trên đảo bằng cách phá hủy một thị trấn gần đó và sử dụng đống đổ nát để xây dựng con đường từ đất liền đến tường thành thành phố. Điều này cho phép các máy công thành tấn công trực tiếp pháo đài địch, nhưng chính hải quân của ông mới tạo ra lỗ hổng quyết định.#!"
  historical_commander_trait.0003.a:0 "Không lượng nước nào có thể ngăn quân Ta!"
  historical_commander_trait.0003.b:0 "Con đường công thành đó thật là kỳ công sáng tạo."
  historical_commander_trait.0003.c:0 "Biến nguồn lực của kẻ thù chống lại chúng? Tuyệt vời!"
  historical_commander_trait.0003.d:0 "Tại sao phải tốn thời gian nghiên cứu chiến thuật thất bại?"

 #Constantine
  historical_commander_trait.0004.t:0 "Tầm Nhìn Chi-Rho"
  historical_commander_trait.0004.desc:0 "Khi nghiên cứu chiến thuật của các vị tướng cổ đại, Ta được truyền cảm hứng khi biết về chiến thắng của Constantine tại Trận Cầu Milvian.\n\n#F Đêm trước trận chiến, Constantine mơ thấy chiến thắng sẽ đến nếu ông vẽ Chi-Rho, biểu tượng của Chúa Kitô, lên khiên của binh sĩ. Ông làm đúng như vậy, và ngày hôm sau, ông đánh bại quân của kẻ chiếm đoạt Maxentius, kẻ rơi xuống sông Tiber và chết đuối.#!"
  historical_commander_trait.0004.a:0 "Kẻ ác không thể địch lại quân đội của Chúa!"
  historical_commander_trait.0004.b:0 "Như Constantine, không con sông nào có thể trì hoãn chiến thắng của Ta!"
  historical_commander_trait.0004.c:0 "Nói theo logic, chiến thuật linh hoạt đã chiến thắng trận đó."
  historical_commander_trait.0004.d:0 "Mẹo nâng cao tinh thần không đủ để thắng chiến tranh!"

 #Khalid ibn al-Walid
  historical_commander_trait.0005.t:0 "Thanh Gươm của Allah"
  historical_commander_trait.0005.desc:0 "Khi nghiên cứu chiến thuật của các vị tướng lịch sử, Ta suy ngẫm khi biết về trận chiến đầu tiên của Khalid ibn al-Walid sau khi chuyển sang đạo Hồi.\n\n#F Bị quân Byzantine đông gấp hơn 3 lần trong Trận Mu'tah, Khalid đã động viên quân lính dao động để giữ vững trận tuyến. Lập trường kiên cường này cho phép ông tổ chức rút lui về Medina, cứu binh sĩ khỏi cái chết chắc chắn. Sau đó Khalid và quân đội chinh phục toàn bộ Ả Rập nhân danh Allah!#!"
  historical_commander_trait.0005.a:0 "Những ai chiến đấu nhân danh Allah sẽ chiến thắng!"
  historical_commander_trait.0005.b:0 "Lòng tận tụy giữ chúng ta mạnh khi bị áp đảo về số lượng."
  historical_commander_trait.0005.c:0 "Biết #EMP khi#! chiến đấu quan trọng như biết #EMP cách nào#!."
  historical_commander_trait.0005.d:0 "Tại sao phải ăn mừng một thất bại đáng xấu hổ?"

 #Bilge Khagan
  historical_commander_trait.0006.t: "Vị Vua Khôn Ngoan"
  historical_commander_trait.0006.desc: "Khi nghiên cứu chiến thuật của các vị tướng cổ đại, Ta được truyền cảm hứng khi biết về những chiến công của Bilge Khagan, chinh phục bốn phương thế giới.\n\nCàn quét Baximi và Gazhou, ông hạ nhục quân của Hoàng đế Xuanzong nhà Đường, mặc dù quân số lên đến hàng trăm nghìn. Ông thực sự thấy rằng sức mạnh của chúng ta nằm ở tốc độ và cơ động!\n\nBilge và quân đội sau đó nghiền nát Khitan và Xi nhân danh Tengri!"
  historical_commander_trait.0006.a: "Với phước lành của trời, chúng ta kiên cường!"
  historical_commander_trait.0006.b: "$historical_commander_trait.0005.c$"
  historical_commander_trait.0006.c: "Chiến thuật linh hoạt là cần thiết cho một đội quân cơ động!"
  historical_commander_trait.0006.d: "Chúng ta tốt hơn là chỉ dùng mánh lới!"

 #Alexander
  historical_commander_trait.0007.t:0 "Tôn Tử"
  historical_commander_trait.0007.desc:0 "Khi nghiên cứu bảy kinh điển quân sự, Ta [ROOT.Char.Custom('surprised_reaction')] khi biết về Trận Boju, nơi Tôn Tử chứng minh giá trị lý thuyết của mình về chiến tranh.\n\n#F Trong thời Xuân Thu, Tôn Tử được cho là đã dẫn quân nhà Ngô đến chiến thắng, đánh bại quân Chu đông hơn nhờ vận dụng các học thuyết quân sự nổi tiếng của mình.#!"
  historical_commander_trait.0007.a:0 "Ranh giới giữa hỗn loạn và trật tự nằm ở sự phối hợp"
  historical_commander_trait.0007.b:0 "Ta phải tìm cách khuất phục kẻ thù mà không chiến đấu"
  historical_commander_trait.0007.c:0 "Khi di chuyển, hãy rơi xuống như sấm sét!"
  historical_commander_trait.0007.d:0 "Chiến thắng lớn nhất là chiến thắng không cần chiến đấu"
