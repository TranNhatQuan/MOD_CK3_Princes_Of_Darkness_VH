l_english:
  warhorse.0001.t:0 "Chiến Mã"
  warhorse.0001.desc:0 "Ngắm nhìn [ROOT.Char.Custom('HorseStoryMareStallion')] giờ tuân mệnh ta từng cử chỉ, ta trầm tư nên đặt tên [ROOT.Char.Custom('HorseStoryHerHim')] ra sao..."
  warhorse.0001.a:0 "Một danh xưng lấy cảm hứng từ lịch sử!"
  warhorse.0001.b: "Thần thoại đầy những danh hiệu ngựa đáng kinh ngạc!"
  warhorse.0001.c:0 "Chỉ là một con ngựa, nên đặt tên giản đơn cho xứng."

  warhorse.0002.desc: "Tìm cảm hứng nơi những chiến mã lừng danh từng thuộc về các bậc vĩ nhân và anh hùng cổ xưa, ta suy nghĩ danh xưng cho [ROOT.Char.Custom('HorseStoryMareStallion')]."
  warhorse.0002.a:1 "Tencendur — như ngựa của Vua Charlemagne!"
  warhorse.0002.b:0 "Bucephalus — như ngựa của Alexander Đại Đế!"
  warhorse.0002.c:0 "Seianian — số phận của Gnaeus Seius hẳn bị phóng đại!"
  warhorse.0002.d:0 "Zuljanah — ngựa của Husayn ibn Ali!"
  warhorse.0002.e:0 "Red Hare — sau chiến mã của tướng Lữ Bố!"
  warhorse.0002.f:0 "Veillantif — như ngựa của Roland!"
  warhorse.0002.g:0 "Incitatus — kẻ yêu thích của Hoàng đế Caligula!"
  warhorse.0002.go_back:0 "Hm, nên chọn một chủ đề khác cho tên này..."

  warhorse.0003.desc:1 "Thế giới thần thoại giàu huy hoàng, và danh xưng cho ngựa cũng vậy."
  warhorse.0003.llamrei:0 "Llamrei — theo ngựa của Vua Arthur!"
  warhorse.0003.sleipnir:0 "Sleipnir — như chiến mã đưa Odin!"
  warhorse.0003.uchchaihshravas:0 "Uchchaihshravas — chiến mã của Thần Mặt Trời!"
  warhorse.0003.dadhi_kra:0 "Dadhi-krā — mặt trời buổi sáng!"
  warhorse.0003.devadatta:0 "Devadatta — như ngựa của Kalki!"
  warhorse.0003.keshi:0 "Keshi — theo ngựa quỷ!"
  warhorse.0003.kanthaka:0 "Kanthaka — chiến mã trung thành của Đức Phật Gautama!"
  warhorse.0003.burko:0 "Burko — như ngựa thần trong truyền thuyết!"
  warhorse.0003.aranjagaan:0 "Aranjagaan — ngựa của đại tướng Jangar!"
  warhorse.0003.haizum:0 "Haizum — ngựa của tổng thiên thần Gabriel!"
  warhorse.0003.buraq:0 "Burāq — sinh vật đưa các tiên tri!"
  warhorse.0003.balius:0 "Balius — một trong những chiến mã của Achilles!"
  warhorse.0003.xanthos:0 "Xanthos — tên chiến mã khác của Achilles sẽ hợp hơn!"
  warhorse.0003.boreas:0 "Boreas — thần gió Bắc của Hy Lạp cổ!"
  warhorse.0003.khiimori: "Khiimori, Ngựa Gió, biểu tượng của linh hồn!"
  warhorse.0003.rlung_rta: "Rlung Rta, kẻ đưa lời cầu nguyện và may mắn!"
  warhorse.0003.jonon_khar: "Jonon Khar, ngựa bay hú lên như đàn hồ đầu ngựa."
  warhorse.0003.tulpar: "Tulpar — thần mã có cánh, tốc độ vô song."
  warhorse.0003.aranzhale: "Aranzhale, một chiến mã khác của Jangar."
  warhorse.0003.oyomaa: "Oyomaa, theo con mã đen tuyệt đẹp của Mengen Shigshirge."
  warhorse.0003.rakhsh: "Rakhsh, từ #EMP Shahnameh#!, hình sư tử sức voi."

  warhorse.0004.desc:0 "Ngựa nên được đặt tên theo chính bản chất loài vật."
  warhorse.0004.a:0 "Chiến Mã."
  warhorse.0004.b:0 "Viện Chủ."
  warhorse.0004.c:0 "Nhảy Nhót."
  warhorse.0004.d:0 "Huy Hoàng."
  warhorse.0004.courser: "Kỵ Mã."

  warhorse.1001.t:1 "[ROOT.Char.Custom('WarhorseStoryName')|U]: [ROOT.Char.Custom('HorseStoryMareStallion')|U] đáng tin cậy"
  warhorse.1001.desc:0 "Một huấn luyện viên lừng danh đã đến sau khi nghe tiếng tăm [ROOT.Char.Custom('HorseStoryMareStallion')] hùng mạnh [ROOT.Char.Custom('WarhorseStoryName')], và đề nghị dịch vụ [ROOT.Char.Custom('RandomHerHis')].\n\n"Tất cả ta chỉ xin đổi lại là một chút thù lao.""
  warhorse.1001.a:0 "[ROOT.Char.Custom('HorseStorySheHe')|U] cần khỏe mạnh hơn."
  warhorse.1001.b:0 "Di chuyển nhanh hơn là điều [ROOT.Char.Custom('HorseStorySheHe')] cần học."
  warhorse.1001.c:0 "[ROOT.Char.Custom('HorseStorySheHe')|U] cần phải cải thiện sức bền [ROOT.Char.Custom('HorseStoryHerHis')]."
  warhorse.1001.d:0 "Nếu có một điều [ROOT.Char.Custom('HorseStorySheHe')] còn thiếu thì đó chính là sự dữ dằn!"
  warhorse.1001.e:0 "Ta không quan tâm."
  warhorse.1001.e.tt:1 "#F "[THIS.Char.Custom('WarhorseStoryName')] không cần huấn luyện viên nào khác ngoài ta!"#!"
  warhorse.1001.f:0 "Đó là lý do ta trả lương $master_of_horse_court_position$!"
  warhorse.1001.f.tt:1 "$master_of_horse_court_position$ của ngươi bắt đầu huấn luyện [THIS.Char.Custom('WarhorseStoryName')]"
  warhorse.1001.f.failure:0 "Ngươi đánh giá quá cao $master_of_horse_court_position$"
  warhorse.1001.f.failure.tt:0 "[m_horse.GetTitledFirstNameNoTooltip] thất bại trong huấn luyện [ROOT.Char.Custom('WarhorseStoryName')]."

  warhorse.1002.desc:0 "[ROOT.Char.Custom('WarhorseStoryName')] tiếp thu huấn luyện [ROOT.Char.Custom('HorseStoryHerHis')] tốt, và kết quả có thể thấy ngay lập tức!"
  warhorse.1002.a:0 "Đúng là tiền bỏ ra xứng đáng!"

  warhorse.1101.t:1 "[ROOT.Char.Custom('WarhorseStoryName')|U]: Ngày Nắng"
  warhorse.1101.desc:0 "Khi ta đi về phía các cột buộc ngựa, ta được chào đón bằng những tiếng hí hạnh phúc của [ROOT.Char.Custom('WarhorseStoryName')]. [ROOT.Char.Custom('HorseStorySheHe')|U] dường như rất háo hức muốn duỗi thẳng chân [ROOT.Char.Custom('HorseStoryHerHis')] trong thời tiết tuyệt đẹp, và ta không thể làm gì khác ngoài việc đồng ý."
  warhorse.1101.a:0 "Ta phải tận dụng từng phút luyện tập!"
  warhorse.1101.b:0 "Ngày quá đẹp để không được trân trọng!"

  warhorse.1201.t:1 "[ROOT.Char.Custom('WarhorseStoryName')|U]: [ROOT.Char.Custom('HorseStoryMareStallion')|U] ốm yếu"
  warhorse.1201.desc:0 "Khi [ROOT.Char.Custom('WarhorseStoryName')] lệt bệt tiến về phía ta, lê những cái chân [ROOT.Char.Custom('HorseStoryHerHis')] và cúi cái đầu [ROOT.Char.Custom('HorseStoryHerHis)], không còn nghi ngờ gì nữa — [ROOT.Char.Custom('HorseStoryMareStallion')] đang bị ốm.\n\nNgười trông coi đảm bảo với ta rằng có thể tìm ra phương thuốc cho căn bệnh của [ROOT.Char.Custom('HorseStoryHerHim')], nhưng cái giá phải trả không hề rẻ."
  warhorse.1201.a:0 "Không gì quá đắt cho [ROOT.Char.Custom('WarhorseStoryName')] ta yêu quý!"
  warhorse.1201.b:0 "Việc gì đến là ý muốn [ROOT.Char.GetFaith.HighGodName]."
  warhorse.1201.b_good:1 "[ROOT.Char.Custom('WarhorseStoryName')] qua cơn nguy"
  warhorse.1201.b.tt:1 "[THIS.Char.Custom('HorseStorySheHe')|U] có vẻ ít tin ngươi hơn"
  warhorse.1201.b_bad:1 "[ROOT.Char.Custom('WarhorseStoryName')] qua đời vì bệnh"

  warhorse.1301.t:1 "[ROOT.Char.Custom('WarhorseStoryName')|U]: Người Yêu Ngựa"
  warhorse.1301.desc:1 "[horse_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] nhìn [ROOT.Char.Custom('WarhorseStoryName')] từ trên xuống dưới, gật đầu tán thưởng.\n\n"Đây là một [ROOT.Char.Custom('HorseStoryMareStallion')] vô cùng tốt mà ngài có ở đây, [ROOT.Char.GetTitleTierName] của ta! Nếu ngài cho phép ta đưa [ROOT.Char.Custom('HorseStoryHerHim')] đi một vòng, ta sẽ rất biết ơn.""
  warhorse.1301.a:0 "Hãy tận hưởng!"
  warhorse.1301.a.tt:0 "[THIS.Char.Custom('WarhorseStoryName')] là một con chiến mã hung dữ, và [horse_vassal.GetFirstNameNoTooltip] không nổi tiếng về sự dũng mãnh [horse_vassal.GetHerHis] — liệu [horse_vassal.GetSheHe] có ổn không?"
  warhorse.1301.b:0 "Không ai cưỡi [ROOT.Char.Custom('WarhorseStoryName')] ngoài ta!"

  warhorse.1401.t:1 "[ROOT.Char.Custom('WarhorseStoryName')|U]: Ác Mộng Mã"
  warhorse.1401.desc:0 "Khi bóng tối bao trùm, ta thấy mình gần như một mình, sự tĩnh lặng của màn đêm chỉ bị phá vỡ bởi tiếng giậm móng của [ROOT.Char.Custom('HorseStoryMareStallion')] [ROOT.Char.Custom('WarhorseStoryName')]. Có điều gì đó kỳ lạ trong đôi mắt [ROOT.Char.Custom('HorseStoryHerHis')], điều gì đó... #EMP đe dọa#!.\n\nÁnh nhìn [ROOT.Char.Custom('HorseStoryHerHis')|U] dõi theo ta khi ta quay lưng rời đi, và cái lạnh chạy dọc sống lưng ta kéo dài mãi đến đêm."
  warhorse.1401.a:0 "Thật nực cười – [ROOT.Char.Custom('HorseStorySheHe')] chỉ là một con ngựa thôi mà."
  warhorse.1401.a.tt:1 "#F Sao ngươi vẫn cảm nhận ánh mắt [THIS.Char.Custom('HorseStoryHerHis')] trên mình?#!"
  warhorse.1401.b:0 "[ROOT.Char.Custom('HorseStorySheHe')|U] chắc chắn bị nguyền rủa rồi, tống khứ [ROOT.Char.Custom('HorseStoryHerHim')] đi!"

  warhorse.1402.desc:0 "Chân bầm tím vì móng ngựa, tay chảy máu vì những cái cắn, cơ thể bầm dập vì bị quăng quật... [ROOT.Char.Custom('WarhorseStoryName')] hí vang vui vẻ khi [ROOT.Char.Custom('HorseStorySheHe')] suýt ném ta vào mũi thương của một người lính, và ta không biết mình còn chịu đựng được bao lâu nữa."
  warhorse.1402.a:0 "Ta sẽ không thua một con ngựa!"
  warhorse.1402.b:0 "Câu chuyện [ROOT.Char.Custom('WarhorseStoryName')] kết thúc tại đây."
 
  warhorse.1499.desc:0 "Chuyện xảy ra khi ta vừa trở về sau chuyến cưỡi ngắn — nỗi kinh hoàng từ ánh mắt ác ý của [ROOT.Char.Custom('HorseStoryMareStallion')] [ROOT.Char.Custom('WarhorseStoryName')] hiện lên lần đầu. [ROOT.Char.Custom('HorseStorySheHe')|U] ném ta ngay bên đá nhọn, và ta rơi sấp đầu. Trong cơn đau mù quáng chỉ còn nghe tiếng hí vang rồi mọi thứ vụt mất..."
  warhorse.1499.a:0 "[ROOT.Char.Custom('WarhorseStoryName')]... sao ngươi lại thế?"

  warhorse.8001.t:1 "[ROOT.Char.Custom('WarhorseStoryName')|U]: Hết Một Kiếp"
  warhorse.8001.desc:0 "Con chiến mã đáng tin cậy [ROOT.Char.Custom('HorseStoryMareStallion')] [ROOT.Char.Custom('WarhorseStoryName')] của ta đang già đi. Sải bước [ROOT.Char.Custom('HorseStoryHerHis')|U] không còn nhanh nhẹn như trước, và ngọn lửa trong đôi mắt [ROOT.Char.Custom('HorseStoryHerHis')] đang phai nhạt.\n\nNếu ta muốn giữ cho dòng dõi [ROOT.Char.Custom('HorseStoryHerHis')] được tiếp tục, ta nên tìm một người bạn đời tốt cho [ROOT.Char.Custom('HorseStoryHerHim')]."
  warhorse.8001.a:0 "Ta sẽ tìm [ROOT.Char.Custom('HorseStoryOppositeMareStallion')] mạnh mẽ."
  warhorse.8001.b:0 "Tìm [ROOT.Char.Custom('HorseStoryOppositeMareStallion')] nhanh nhẹn."
  warhorse.8001.c:0 "Khía cạnh quan trọng nhất ở một [ROOT.Char.Custom('HorseStoryOppositeMareStallion')] chính là sức bền."
  warhorse.8001.d:0 "Săn tìm [ROOT.Char.Custom('HorseStoryOppositeMareStallion')] dữ dằn nhất!"
  warhorse.8001.e:0 "Ta sẽ để [ROOT.Char.Custom('HorseStoryHerHim')] trải qua những ngày cuối đời [ROOT.Char.Custom('HorseStoryHerHis')] trong yên bình."

  warhorse.8002.t:1 "[ROOT.Char.Custom('WarhorseStoryName')|U]: Vòng Tròn Sinh Mệnh"
  warhorse.8002.desc:0 "Chiến mã yêu quý [ROOT.Char.Custom('HorseStoryMareStallion')] [ROOT.Char.Custom('WarhorseStoryName')] đã qua đời, nhưng [ROOT.Char.Custom('HorseStorySheHe')] để lại một con ngựa con khỏe mạnh! Ta đã thấy tính cách của [ROOT.Char.Custom('HorseStoryHerHis')] nơi nó — bạn ta vẫn còn theo cách riêng."
  warhorse.8002.a:0 "Hãy yên nghỉ [ROOT.Char.Custom('WarhorseStoryName')]."

  warhorse.8003.desc:0 "Khi bước ra ngoài không khí trong lành, ta nhận tin buồn rằng [ROOT.Char.Custom('HorseStoryMareStallion')] [ROOT.Char.Custom('WarhorseStoryName')] đã qua đời đêm qua, để lại trong lòng ta một khoảng trống."
  warhorse.8003.a:0 "Ôi [ROOT.Char.Custom('WarhorseStoryName')], ta sẽ nhớ ngươi!"
