l_english:
 #Well-known commander, by Sean Hughes
  martial_strategy.1051.t:0 "Tin Đồn Chung"
  martial_strategy.1051.desc:0 "Chủ đề bàn tán phổ biến nhất trong [ROOT.Char.Custom('GetCourt')] luôn thay đổi, nhưng gần đây, mọi người thường nhắc đến kỹ năng nổi bật của ta với tư cách là một tướng quân — và bí quyết thành công của ta là gì.\n\nTa có thể lợi dụng sự tò mò tự nhiên này để nâng cao thanh danh, nhưng trước hết phải quyết định sẽ gán thành công của ta cho điều gì..."
  martial_strategy.1051.a:0 "Ta có tài năng bẩm sinh khiến ta vượt trội hơn người khác."
  martial_strategy.1051.a.humble:0 "Biết giới hạn của bản thân giúp ta khắc phục nó."
  martial_strategy.1051.b.brave:0 "Lòng dũng cảm của ta truyền cảm hứng để binh lính đứng lên chiến đấu."
  martial_strategy.1051.b.stalwart:0 "Quyết tâm của ta mạnh mẽ đến mức không bao giờ dao động!"
  martial_strategy.1051.c.wrathful:0 "Không ai chịu nổi cơn thịnh nộ áp đảo của ta!"
  martial_strategy.1051.c.feareater:0 "Chỉ sự hiện diện của ta đã gieo sợ hãi vào kẻ thù!"
  martial_strategy.1051.d.zealous:0 "Sự tận hiến của ta với [ROOT.GetCharacter.GetFaith.HighGodName] đem lại chiến thắng."
  martial_strategy.1051.d.sadistic:0 "Ta luôn tấn công kẻ thù vào chỗ nhạy cảm nhất."
  martial_strategy.1051.d.zealoussadistic:0 "Ta không khoan nhượng trong thánh chiến chống lại kẻ ác!"
  martial_strategy.1051.e.patient:0 "Ta luôn cảnh giác, chờ thời cơ tấn công."
  martial_strategy.1051.f.ambitious:0 "Ta sẽ làm #EMP bất cứ điều gì#! để giành chiến thắng!"

 
 #Translate old texts (Learning skill challenge), Mathilda Bjarnehed
  martial_strategy.2000.t:0 "Bài Học Từ Quá Khứ"
  martial_strategy.2000.start.desc:0 "Dẫu ta chắc chắn sẽ còn nhiều chiến trường phải chứng kiến trước khi gặp Đấng Tạo Hóa, thư viện của ta chứa đựng những câu chuyện chiến tranh qua trăm kiếp người.\n\nGần đây, ta sưu tầm được một cuốn sách về cuộc"
  martial_strategy.2000.hastings.desc:1 "trận Hastings, "
  martial_strategy.2000.tours.desc:1 "trận Tours, "
  martial_strategy.2000.palaceofthemartyrs.desc:1 "trận Cung Điện Các Vị Tử Đạo, "
  martial_strategy.2000.catalaunianplains.desc:1 "trận Đồng Bằng Catalaunian, "
  martial_strategy.2000.constantinople.desc:1 "cuộc bao vây Constantinople, "
  martial_strategy.2000.vapati.desc:1 "trận Vapati, "
  martial_strategy.2000.end.desc:1 "cũng như một cuộn giấy cổ mèm mỏi được viết bằng một ngôn ngữ xa xưa. Ai mà biết được những bí mật đã bị lãng quên mà nó cất giữ…"
  martial_strategy.2000.a:0 "Đọc cuốn sách mới."
  martial_strategy.2000.b:0 "Cố gắng dịch cuộn giấy cổ."
  martial_strategy.2000.b.success:0 "Ta khám phá ra một mảnh kiến thức cổ xưa"
  martial_strategy.2000.b.success.tt:1 "Ngài nhận được #P 1#! [martial|E], #P 1#! [learning|E] và một thưởng [commander|E] trong #V 20 năm#!"
  martial_strategy.2000.b.failure:0 "Ta không thể giải mã cuộn giấy"
  martial_strategy.2000.b.failure.tt:1 "Ngài phải nhận [stress|E] hoặc từ bỏ"

  martial_strategy.2001.start.desc:0 "Dẫu có sự giúp đỡ của một từ điển phủ bụi, cuộn giấy vẫn miễn cưỡng tiết lộ bí mật, nhưng ta vẫn tiếp tục. Khi đêm về, câu chuyện phi thường nhất dần hiện ra trước mắt ta...\n\n"
  martial_strategy.2001.gaixia.desc:1 "#F Cuộn giấy mô tả trận Gaixia. Hán Tân, tướng của người Hán, phá tan tinh thần quân địch bằng cách bắt binh lính của mình hát những bài ca từ vương quốc Chu của đối phương. Tướng Tương Vũ của Chu thoát được cùng một lực lượng trung thành nhỏ, nhưng cuối cùng, họ bị truy đuổi và đánh bại.#!"
  martial_strategy.2001.red_cliffs.desc:0 "#F Trong trận Xích Bích, quân sỹ Tào Tháo xích các chiến thuyền từ mũi đến đuôi để chống say sóng. Một chỉ huy của liên quân Tôn-Lưu, Hoàng Cái, thấy cơ hội và gửi một bức thư giả đầu hàng. Sau đó, ông chuẩn bị một phi đội thuyền, chất đầy củi và dầu, để gió đưa chúng về phía Tào Tháo. Khi những thuyền không người tiếp cận hạm đội địch, chúng bị đốt cháy, gây ra cái chết thiêu cháy của vô số quân lính.#!"
  martial_strategy.2001.thermopylae.desc:0 "#F Bằng cách chặn hẹp đường ven biển tại Thermopylae, quân Hy Lạp đông đảo ít hơn giữ chân quân Ba Tư trong bảy ngày. Vào ngày cuối cùng, khi Vua Leonidas bị bao vây, ông giải tán phần lớn quân và bảo vệ rút lui trong một trận cuối cùng huy hoàng. Sự anh dũng của quân sĩ là minh chứng cho sức mạnh của một quân đội yêu nước bảo vệ quê hương.#!"
  martial_strategy.2001.teutoburg_forest.desc:0 "#F Arminius, con trai một thủ lĩnh bộ tộc German, được nuôi dưỡng tại Rome nhưng âm mưu liên minh các bộ tộc để đánh bại người La Mã. Arminius trở thành sĩ quan của tướng La Mã Varus và khuyên ông đi đường vòng qua Rừng Teutoburg. Ở đó, Arminius triển khai hàng loạt phục kích. Nhờ được giáo dục La Mã, Arminius biết chính xác cách chống lại chiến thuật kẻ thù và dẫn dân tộc mình đến chiến thắng quyết định.#!"
  martial_strategy.2001.a:0 "Nghiên cứu trận đánh."
  martial_strategy.2001.b:0 "Tập trung vào quá trình dịch."

  martial_strategy.2002.desc:0 "Đêm buông xuống và ngọn nến duy nhất soi sáng bản thảo trước mặt ta càng lúc càng nhỏ. Khi nó chớp một lần cuối và để ta trong bóng tối, bí mật cuộn giấy vẫn chưa được khám phá."
  martial_strategy.2002.a:0 "Tiếp tục."
  martial_strategy.2002.b:0 "Từ bỏ."


 #Developing cunning/manipulative tactics (Intrigue skill challenge), Sean Hughes
  martial_strategy.2020.t:0 "Tất Cả Có Phải Công Bằng?"
  martial_strategy.2020.opening:0 "Nhiều luận văn đã được viết về đạo đức trong chiến tranh, nhưng mạng sống của tác giả không bị đặt vào rủi ro khi họ cầm bút.\n\n"
  martial_strategy.2020.desc:0 "Nếu ta muốn tối đa hóa cơ hội chiến thắng trên chiến trường, có lẽ ta nên cân nhắc áp dụng một số chiến lược... không chính thống."
  martial_strategy.2020.desc.ambitious:0 "Để đảm bảo chiến thắng, ta cần nắm mọi lợi thế có thể trên chiến trường, ngay cả khi điều đó có nghĩa là sử dụng những chiến thuật có thể bị coi là không công bằng."
  martial_strategy.2020.desc.martial:0 "Ta biết từ kinh nghiệm rằng cách tốt nhất để đánh bại kẻ thù là chỉ chiến đấu theo điều kiện của ta! Câu hỏi là, điều kiện nào sẽ có lợi nhất?"
  martial_strategy.2020.desc.deceitful:0 "Ta đã đọc những bài thơ so sánh chiến trường với một con người đang thở. Điều này khiến ta tự hỏi... liệu ta có thể thao túng chiến trường giống như cách ta thao túng con người không?"
  martial_strategy.2020.a:0 "Ta sẽ lừa kẻ thù bộc lộ quá mức!"
  martial_strategy.2020.a.success:0 "Mưu kế của ta thành công mỹ mãn"
  martial_strategy.2020.a.failure:0 "Mưu kế thất bại, khiến ta bẽ mặt"
  martial_strategy.2020.b:0 "Chiến thuật đánh rồi rút sẽ làm suy yếu quân địch!"
  martial_strategy.2020.d:0 "Ta sẽ không hạ mình dùng chiến thuật bẩn thỉu!"
  martial_strategy.2020.d.brave:0 "Chỉ kẻ hèn mới dùng những chiến thuật như thế!"
  martial_strategy.2020.d.flavor:0 "Từ chối sử dụng những chiến thuật này"
 
  martial_strategy.2021.t:0 "Mưu Kế Thành Công"
  martial_strategy.2020.desc.opening:0 "Ta tập hợp tùy tùng cho một trò chơi chiến thuật, háo hức thử ý tưởng giả vờ tháo chạy để dụ kẻ địch bộc lộ quá mức."
  martial_strategy.2021.desc:0 "\n\nKhi chia thành các đội, ta cẩn thận chỉ cho mọi người cách nhường một chút đất để lừa đối phương di chuyển ra khỏi vị trí, mà không để họ phá vỡ tuyến phòng thủ của ta.\n\nChiến thuật mới của ta hoạt động hoàn hảo, cho phép ta bao vây đội địch và buộc họ đầu hàng!"
  martial_strategy.2021.a:0 "Ta chờ ngày áp dụng mưu kế này trên chiến trường thật!"

  martial_strategy.2022.t:0 "Giấc Mơ Tan Vỡ"
  martial_strategy.2022.desc:0 "\n\nĐáng tiếc, khi đội ta thử chiến thuật mới, chúng ta không giữ được vị trí. Ta phải chịu thất bại nhanh chóng và nhục nhã khi đối phương phá vỡ hàng tuyến của ta và làm tan rã đội hình.\n\nMọi người tham gia trò chơi giờ cho rằng ta là kẻ ngốc, và không muốn dính líu gì thêm tới 'ý tưởng' của ta."
  martial_strategy.2022.b:0 "Có lẽ ta nên giữ theo chiến thuật thông thường..."


 #Logistics and securing provisions (Stewardship skill challenge), Sean Hughes
  martial_strategy.2030.t:0 "Đảm Bảo Tiếp Vận"
  martial_strategy.2030.desc.fallback:0 "Một phần của việc chỉ huy quân đội là đảm bảo binh lính có đầy đủ lương thực, nước uống và trang bị trại cho các chiến dịch dài ngày."
  martial_strategy.2030.desc.diligent:0 "Ta tự hào vì luôn kiểm kê mọi thứ, bao gồm việc đảm bảo binh lính được cung cấp đầy đủ."
  martial_strategy.2030.desc.ambitious:0 "Dù binh lính ta mạnh mẽ đến đâu, nếu họ hết lương thực trong chiến dịch, họ sẽ phục vụ ta chẳng khác gì những con sóc được huấn luyện."
  martial_strategy.2030.desc.end:0 "\n\nVì thế, ta nên lập một kế hoạch để đảm bảo binh lính luôn có đủ tiếp vận trên chiến trường."
  martial_strategy.2030.a:0 "Sắp xếp một mạng lưới thương nhân hỗ trợ ta."
  martial_strategy.2030.a.success.tt:1 "Ngươi thiết lập được một mạng lưới tiếp vận đáng tin cậy"
  martial_strategy.2030.a.failure.tt:1 "Những thương nhân ngươi tìm được không đáng tin cậy"
  martial_strategy.2030.b:0 "Dự trữ tiếp vận trong thành trì của ta."
  martial_strategy.2030.c:0 "Binh lính ta có thể tự kiếm tiếp vận."

  martial_strategy.2031.t:0 "Một Mạng Lưới Đáng Tin"
  martial_strategy.2031.desc:0 "Sau khi xem xét hàng loạt sổ sách tài chính, ta chọn ra một nhóm thương nhân rải rác khắp vùng quê mà ta biết sẽ đáng tin cậy.\n\nTa đề nghị giữ họ theo hợp đồng để cung cấp bất kỳ tiếp vận nào quân đội cần ngay lập tức. Điều này đảm bảo các chỉ huy luôn biết nên tìm ai khi cần tiếp vận."
  martial_strategy.2031.a:0 "Điều này sẽ cung cấp tiếp vận ổn định cho quân ta trên chiến trường."
  martial_strategy.2031.b:0 "Giờ thì ta lấy một ít cho bản thân..."

  martial_strategy.2032.t:0 "Tiếp Vận Mất Tích"
  martial_strategy.2032.desc:0 "Ta liên lạc với nhiều thương nhân để xem ai có thể cung cấp tốt nhất những thứ quân đội cần.\n\nMột thương nhân có giá rất tốt, nên ta sắp xếp lấy phần lớn tiếp vận từ hắn... nhưng khi đến lấy hàng, hắn và lô hàng đã biến mất không dấu vết!"
  martial_strategy.2032.a:0 "Khi tìm ra kẻ lừa đảo đó, ta sẽ lấy mạng hắn!"
  martial_strategy.2032.a.forgiving:0 "Lẽ ra ta nên nghiên cứu kỹ hơn trước khi đặt hàng."


 # Decide between two vassal's proposed strategies for a war, Sean Hughes
  martial_strategy.3010.t:0 "Bế Tắc Chiến Lược"
  martial_strategy.3010.desc.start:0 "Ta ngồi quanh bàn chiến lược với [impatient_commander.GetTitledFirstName] và [patient_commander.GetTitledFirstName], bàn về chiến lược cho cuộc chiến hiện tại.\n\n[impatient_commander.GetFirstNameNoTooltip]"
  martial_strategy.3010.desc.middle:0 "trong khi [patient_commander.GetFirstNameNoTooltip]"
  martial_strategy.3010.desc.end:0 "\n\nQuyết định cuối cùng thuộc về ta."
  martial_strategy.3010.desc.wrathful:0 "đập nắm đấm [impatient_commander.GetHerHis] xuống bàn và tuyên bố lớn tiếng rằng chúng ta nên tấn công trực tiếp kẻ thù và đè bẹp chúng bằng sức mạnh tuyệt đối của quân đội chúng ta,"
  martial_strategy.3010.desc.greedy:0 "háo hức chỉ ra tất cả mục tiêu quan trọng để lập tức gửi đội cướp bóc,"
  martial_strategy.3010.desc.patient:0 "ngồi lại kiên nhẫn khuyên ta nên chiếm các vị trí quan trọng và chờ đối phương tới,"
  martial_strategy.3010.desc.craven:0 "lẩm bẩm lo lắng rằng nên tránh các trận đánh không cần thiết và tiến hành chiến tranh hao mòn."
  martial_strategy.3010.desc.flexible:0 "giải thích rằng ta cần quan sát đối phương và ứng phó tương ứng."
  martial_strategy.3010.a:0 "[impatient_commander.GetTitledFirstNameNoTooltip] có ý tưởng đúng đấy!"
  martial_strategy.3010.b:0 "Ta sẽ dùng kế hoạch của [patient_commander.GetTitledFirstNamePossessiveNoTooltip]."
  martial_strategy.3010.c:0 "Các chỉ huy của ta có thể hành động theo ý họ."
  martial_strategy.3010.o_martial:0 "Ta biết cách áp dụng cả hai chiến lược!"

  martial_strategy.3010.desc.response.start:0 "Ta tham dự một cuộc họp chiến lược với [my_liege.GetTitledFirstName] và [other_commander.GetTitledFirstName], bàn về kế hoạch cho cuộc chiến hiện tại."

  martial_strategy.3011.t:0 "Chiến Lược Được Chấp Nhận"
  martial_strategy.3011.desc:0 "\n\n[my_liege.GetTitledFirstName] rất tiếp thu ý tưởng của ta, ưu tiên chúng hơn những kế hoạch của [other_commander.GetFirstName]. Giờ ta sẽ áp dụng chúng vào chính sách chiến lược cho cuộc chiến hiện tại!"
  martial_strategy.3011.a.disapprove:0 "Ai ngờ [my_liege.GetFirstNameNoTooltip] lại biết lý trí?"
  martial_strategy.3011.a:0 "Ta biết [my_liege.GetTitledFirstNameNoTooltip] sẽ thích ý tưởng của ta!"

  martial_strategy.3012.t:0 "Chiến Lược Bị Loại"
  martial_strategy.3012.desc:0 "\n\nĐáng tiếc [my_liege.GetTitledFirstName] không tiếp thu ý tưởng của ta, mà ưu tiên kế hoạch của [other_commander.GetFirstName]. Giờ họ sẽ áp dụng kế hoạch đó cho chính sách chiến lược!"
  martial_strategy.3012.a.disapprove:0 "Sự ngu ngốc của [my_liege.GetFirstNameNoTooltip] không làm ta ngạc nhiên."
  martial_strategy.3012.a:0 "Thời gian sẽ chứng minh lựa chọn của [my_liege.GetFirstNamePossessiveNoTooltip] có đúng không."

  martial_strategy.3013.t:0 "Chiến Lược Được Cho Phép"
  martial_strategy.3013.desc:0 "[my_liege.GetTitledFirstName] quyết định không can thiệp, cho phép cả [other_commander.GetFirstName] và ta hành động theo ý mình."
  martial_strategy.3013.a:0 "Ta mừng vì có quyền tự do hành động theo ý mình."

  martial_strategy.3014.t:0 "Chiến Lược Hợp Nhất"
  martial_strategy.3014.desc:0 "\n\n[my_liege.GetTitledFirstName] đã kết hợp ý tưởng của ta với [other_commander.GetFirstNamePossessive], tạo thành một chiến lược thống nhất mang lại lợi thế lớn trên chiến trường!"
  martial_strategy.3014.a.disapprove:0 "Dù [my_liege.GetFirstNamePossessiveNoTooltip] có thất bại, [my_liege.GetSheHe] vẫn là một vị tướng tài."
  martial_strategy.3014.a:0 "Ta ấn tượng với kế hoạch của [my_liege.GetTitledFirstNamePossessiveNoTooltip]."


 #Storm Your Own Castle, by Linnéa Thimrén
  martial_strategy_special.1301.t:0 "Dưới Vây"
  martial_strategy_special.1301.desc:1 "\"Kẻ thù thực sự của mọi binh sĩ là sự tự mãn,\" [siege_proposer.Custom2('MyCharacterIntroduction', ROOT.Char)] nói trước khi [siege_proposer.Custom('quirk_pos_pp')]. Chúng ta đứng cạnh nhau trên tường [ROOT.Char.Custom('FortifiedBuilding')], nhìn xuống các binh sĩ đang luyện tập bên dưới.\n\n\"Chúng ta có thể đổi cổng [ROOT.Char.Custom('FortifiedBuilding')] bằng những tấm gỗ, làm cùn mũi tên trong ống của quân lính,\" [siege_proposer.GetSheHe] tiếp tục. \"Dẫn quân tập trận tấn công giả lên [ROOT.Char.Custom('FortifiedBuilding')], xem họ thi triển ra sao!\""
  martial_strategy_special.1301.a:0 "Thời gian của ta nên dành cho việc củng cố phòng thủ."
  martial_strategy_special.1301.b:0 "Ý hay. Ngươi nên chỉ huy những người phòng thủ!"
  martial_strategy_special.1301.b.tt:0 "#F Trò chơi bắt đầu!#!"

  martial_strategy_special.1302.t:1 "$martial_strategy_special.1301.t$: Đợt Xông Chiến Đầu"
  martial_strategy_special.13.a.tt:0 "#F Một phương án rủi ro hơn nhưng phần thưởng cao hơn.#!"
  martial_strategy_special.13.b.tt:0 "#F Phương án an toàn và chiến thuật hơn.#!"
  martial_strategy_special.1302.desc:0 "Cánh cổng đóng chặt và tường cao vút lên trời. Những bóng cung thủ lóe qua tường thành, và cảm giác hứng khởi thực sự lan tỏa khắp không gian.\n\nTrước khi trận đánh bắt đầu, ta quay lại và ra lệnh cho binh sĩ. Lệnh của ta vang rõ khắp chiến trường."

  martial_strategy_special.1302.c:0 "Khai thác điểm yếu của cổng!"
  martial_strategy_special.1302.d:0 "Đi qua cống ngầm!"
  martial_strategy_special.1302.a:0 "Xông thẳng cổng chính!"
  martial_strategy_special.1302.a.tt1:0 "Chúng ta tiến vào gần như không gặp kháng cự"
  martial_strategy_special.1302.a.tt2:1 "Chúng ta chịu tổn thất nặng, nhưng phá được cổng"
  martial_strategy_special.1302.b:0 "Mang thang lên!"
  martial_strategy_special.1302.b.tt1:0 "Chúng ta leo lên tường thành khá dễ dàng"
  martial_strategy_special.1302.b.tt2:1 "Chúng ta chỉ vừa tới thành, chịu tổn thất nặng"

  martial_strategy_special.storm_castle.very_well:0 "Cuộc tấn công tiến triển #P rất tốt#!"
  martial_strategy_special.storm_castle.poorly:0 "Cuộc tấn công tiến triển #N tệ#!"
  martial_strategy_special.storm_castle.normal:0 "Cuộc tấn công tiến triển #Z ổn#!"
  martial_strategy_special.storm_castle.well:0 "Cuộc tấn công tiến triển #P tốt#!"

  martial_strategy_special.1303.t:0 "$martial_strategy_special.1301.t$: Từng Bước Một"
  martial_strategy_special.1303.desc:0 "Cầu thang vang lên khi một vũ khí cùn bật ra trụ giữa. Lần thứ hai chỉ trong vài phút, ta chửi thầm vì cầu thang xoắn quá chặt, ngăn ta vung vũ khí vào kẻ phòng thủ.\n\nTiếng thở dồn dập của binh sĩ xung quanh chói tai, và mỗi lần tấn công bị đẩy lùi, họ càng mệt mỏi và chán nản. Ta phải chỉ huy tình hình!"
  martial_strategy_special.1303.c:0 "Tất cả binh sĩ thuận tay trái lên trước!"
  martial_strategy_special.1303.d:0 "Cẩn thận! Đừng để chúng dụ mình!"
  martial_strategy_special.1303.a:0 "Không được ngừng, ta sẽ áp đảo chúng!"
  martial_strategy_special.1303.e:0 "Theo ta! #EMP Xông lên#!!"
  martial_strategy_special.1303.a.tt1:0 "Chúng ta chiếm cầu thang hiệu quả tàn bạo"
  martial_strategy_special.1303.a.tt2:0 "Cầu thang hầu như chỉ vừa đoạt được với bước đi chập chững và cánh tay mỏi"
  martial_strategy_special.1303.b:0 "Lần lượt từng người! Cảnh giác!"
  martial_strategy_special.1303.b.tt1:0 "Mất thời gian, nhưng cuối cùng ta chiếm được cầu thang"
  martial_strategy_special.1303.b.tt2:0 "Chúng ta chịu nhiều tổn thất trước khi phá vỡ phòng tuyến"
  martial_strategy_special.1303.f:0 "Ra sau ta! Ta sẽ bảo vệ ngươi!"
  martial_strategy_1303.winning:0 "Chúng ta đang thắng, nhưng không được phép sai sót!"
  martial_strategy_1303.losing:0 "Đây là cơ hội cuối cùng để xoay chuyển trận đánh!"

  martial_strategy_special.1304.t:0 "$martial_strategy_special.1301.t$: Dũng Cảm Trên Tường Thành"
  martial_strategy_special.1304.desc:0 "Bước lên bậc cuối cùng trên những bức tường bao quanh [ROOT.Char.Custom('FortifiedBuilding')], ta quan sát toàn cảnh.\n\nNhiều binh sĩ có thể đã ngã trước cung thủ trên tường, nhưng điều đó không làm chúng ta nản chí. Từng người một, chúng ta áp đảo những kẻ phòng thủ và đứng vững trên xác kẻ địch.\n\nTa hít một hơi sâu, rồi lại chuẩn bị tiến lên tiếp."
  martial_strategy_special.1304.a:0 "Tất cả theo ta!"
  martial_strategy_special.1304.c:0 "Đánh mạnh vào chúng! Hôm nay chúng không phải bạn của các ngươi!"
  martial_strategy_special.1304.d:0 "Giơ khiên lên! Bảo vệ phía sau!"
  martial_strategy_special.1304.f:0 "Đánh thật mạnh! Đừng tha thứ!"

  martial_strategy_special.1304.a.tt1:0 "Chúng ta nhanh chóng quét sạch lực lượng của [siege_proposer.GetTitledFirstNamePossessiveNoTooltip]"
  martial_strategy_special.1304.a.tt2:0 "Chúng ta bị tấn công từ phía sau không được bảo vệ"
  martial_strategy_special.1304.b:0 "Cung thủ, chiếm vị trí!"
  martial_strategy_special.1304.b.tt1:0 "Chúng ta không thể ngăn cản"
  martial_strategy_special.1304.b.tt2:0 "Không có cung thủ, cuộc tấn công dễ dàng bị đẩy lùi"

  martial_strategy_special.1399.t:0 "$martial_strategy_special.1301.t$: Xông Vào [ROOT.Char.Custom('FortifiedBuilding')|U]"
  martial_strategy_special.1399.desc_win:0 "[ROOT.Char.Custom('FortifiedBuilding')] đã thuộc về chúng ta!"
  martial_strategy_special.1399.desc_loose:0 "Trận chiến thất bại, và những kẻ phòng thủ đã thắng trận."
  martial_strategy_special.1399.desc:0 "Giữa những binh sĩ ăn mừng, ta tìm thấy [siege_proposer.GetTitledFirstName], người chúc mừng ta vì một đợt xông chiến dẫn dắt xuất sắc."
  martial_strategy_special.1399.desc_win2:0 "\n\n\"Nhìn chúng kìa, [ROOT.Char.Custom('FormOfAddressForLiege')]. Sự thay đổi nhịp độ thật có lợi cho họ. Ngay cả ngài cũng dường như tràn đầy sinh lực, dù [ROOT.Char.Custom('FortifiedBuilding')] vừa bị kẻ địch chiếm mất!\""
  martial_strategy_special.1399.desc_loose2:0 "\n\n\"Dù ngài không chiếm được [ROOT.Char.Custom('FortifiedBuilding')], [ROOT.Char.Custom('FormOfAddressForLiege')], cả quân lính lẫn ngài đều dường như được tiếp thêm sinh lực nhờ sự thay đổi nhịp độ!\"\n\nTa chỉ còn biết đồng ý. Hơn nữa, thật an lòng khi biết [ROOT.Char.Custom('FortifiedBuilding')] của ta sẽ không dễ dàng bị tràn ngập!"
  martial_strategy_special.1399.a:0 "Kẻ thù của chúng ta sẽ không bao giờ có cơ hội!"
  martial_strategy_special.1399.b:0 "Là lực lượng phòng thủ, chúng ta thật đáng gờm!"


 #March gone awry, by Petter Vilberg
  martial_strategy_special.1401.t:0 "Trên Đường Hành Quân"
  martial_strategy_special.1401.opening:1 "Vào cuối bài tập thực địa, điều này có vẻ là một ý tưởng tuyệt vời...\n\nĐể thực hành việc tập hợp lại một đạo quân đang rối loạn, ta chia quân và ra lệnh cho từng sĩ quan tự mình tiến về [capital.GetNameNoTier].\n\nDĩ nhiên, đến ngày thứ ba chờ đợi, nhưng chỉ có nửa quân ta tập hợp xong, ta bắt đầu thấy những điểm yếu trong kế hoạch."
  martial_strategy_special.1401.commander:0 "[commander.GetTitledFirstName]"
  martial_strategy_special.1401.officer_fallback:0 "Một trong các sĩ quan của ta"
  martial_strategy_special.1401.end:1 "đề nghị ta dẫn theo một đoàn $knight_culture_player_plural_no_tooltip_lowercase$ đi tìm những đơn vị mất tích, trong khi phần còn lại của quân đội trở về nhà."
  martial_strategy_special.1401.a:0 "Cuộc tìm kiếm này sẽ rất thú vị!"
  martial_strategy_special.1401.a.tt:3 "Cuộc tìm kiếm của ngài có thể kéo dài một thời gian..."
  martial_strategy_special.1401.b:0 "Ý hay. Ngài là người chỉ huy."
  martial_strategy_special.1401.give_up_tt:0 "#F Những binh sĩ khác có thể học được vài điều khi tự trở về nhà.#!"
  martial_strategy.1401.almost_done:0 "Hầu hết binh sĩ của ta hiện đã trở lại, ta lên đường với niềm tin rằng chỉ còn vài toán quân cuối cùng là khó tìm nhất.\n\n"
  martial_strategy.1401.close_to_done:0 "Phần lớn binh sĩ đã quay về, ta bắt đầu lên đường tìm kiếm những trung đoàn còn lại.\n\n"
  martial_strategy.1401.a_lot_returned:0 "Rất nhiều binh lính đã trở lại, ta khá lạc quan về việc sẽ sớm tìm thấy số còn lại.\n\n"
  martial_strategy.1401.some_returned:0 "Một số binh lính đã trở về, trong khi ta đang chuẩn bị lên đường tìm kiếm những người còn lại.\n\n"
  martial_strategy.1401.first_find:0 "Ta không mất quá nhiều thời gian để tìm thấy trung đoàn đầu tiên mà mình đang tìm kiếm.\n\n"
  martial_strategy_special.1401.continue_search_tooltip:0 "Cuộc tìm kiếm của ngài tiếp tục"
  martial_strategy_special.1401.delay_tt:0 "Cuộc tìm kiếm của ngài sẽ bị trì hoãn"
  martial_strategy_special.1401.give_up:0 "Ngài bỏ cuộc tìm kiếm và trở về nhà"

  martial_strategy_special.1402.t:0 "Trên Đường Hành Quân"
  martial_strategy_special.1402.desc:2 "Ta nghe thấy một tiếng ồn ào khủng khiếp phát ra từ quán rượu bên đường. Một trong số $knight_culture_player_plural_no_tooltip_lowercase$ đá tung cửa, lộ ra căn phòng đầy những binh sĩ lạc lõng của ta.\n\nSự xuất hiện của ta khiến họ im bặt và cúi đầu vào chén uống, chẳng ai nói một lời. Chủ quán hẹp mắt nhìn [ROOT.Char.Custom('RandomHerHis')]. \"Vậy là #EMP ngài#! chịu trách nhiệm cho đám hỗn độn này sao?\""
  martial_strategy_special.1402.a:0 "Ta có đủ tiền để bồi thường thiệt hại."
  martial_strategy_special.1402.a.tt:2 "#F Xử lý binh sĩ hỗn loạn dễ hơn chủ quán dữ tợn, và ngài phải tiếp tục tìm kiếm.#!"
  martial_strategy_special.1402.b:0 "Những người này có ý hay. Rót cho ta một chén!"
  martial_strategy_special.1402.b.tt:1 "#F Uống cùng thường dân! Cuộc sống thật thú vị! Ít nhất là cho đến khi ngài phải tiếp tục tìm kiếm.#!"
  martial_strategy_special.1402.c:0 "Ta mệt mỏi với việc đối phó binh sĩ vô kỷ luật."
  martial_strategy_special.1402.d:1 "Lấy một chén cho đường đi và lên đường thôi!"
  martial_strategy_special.1402.d.tt:2 "#F Ngài chắc chắn có thể thuyết phục binh sĩ tham gia tìm kiếm.#!"

  martial_strategy_special.1403.t:0 "Trên Đường Hành Quân"
  martial_strategy_special.1403.desc:1 "Tiếp cận [ROOT.Char.Custom('IndefiniteBodyOfWater')], ta thấy một trại đóng dọc bờ. Khi vào trại, ta gặp trung sĩ chỉ huy.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Kho nước của chúng ta bị rò rỉ trong lúc di chuyển, và các thú tải không thể hành quân về nhà nếu không có nhiều nước hơn hiện tại.\" Người lính nhìn ta lo lắng. \"Nếu [ROOT.Char.GetLadyLord] và [ROOT.Char.GetHerHis] [ROOT.Char.Custom('MountedWarriorTermPlural')] giúp mang bình nước thì...\""
  martial_strategy_special.1403.a:0 "Nếu đây là cách duy nhất..."
  martial_strategy_special.1403.a.tt:0 "#F Nỗi nhục khi phải mang nước cho lừa!#!"
  martial_strategy_special.1403.b:0 "Các binh sĩ sẽ hành quân, và ngay bây giờ!"
  martial_strategy_special.1403.b.tt:1 "#F \"Những kẻ thường dân này nghĩ nước quan trọng hơn mệnh lệnh của ta sao?\"#!"
  martial_strategy_special.1403.c:0 "Chỉ cần đưa họ về nhà, trung sĩ. Ta không còn quan tâm nữa."
  martial_strategy_special.1403.d:0 "Ta nghĩ ta có thể tìm ra giải pháp cho việc này."
  martial_strategy_special.1403.d.tt:0 "#F Giờ, nếu một con lừa cần tám gallon nước mỗi ngày...#!"

  martial_strategy_special.1404.t:0 "Trên Đường Hành Quân"
  martial_strategy_special.1404.desc:1 "Khi đội tiên phong của ta mang tin tức về trại nhỏ đó, ta không mong đợi tìm thấy những người lính vẫn đang thực hành đội hình chiến đấu của họ.\n\nCó vẻ như [knight.Custom2('MyCharacterIntroduction', ROOT.Char)] đã tự ý [knight.GetHerselfHimself] tiếp tục các bài tập thực địa trong khi chờ đợi tin tức từ quân đội chính. Quân lính [knight.GetHerHis|U] xếp hàng gọn gàng khi ta cưỡi ngựa đến gặp [knight.GetHerHim]."
  martial_strategy_special.1404.a:0 "Đó không phải là mệnh lệnh ta đã đưa!"
  martial_strategy_special.1404.a.tt:0 "#EMP Binh sĩ của ta#! cần tuân theo #EMP mệnh lệnh của ta#!"
  martial_strategy_special.1404.b:0 "Tư thế cẩu thả gì đây? Đây không phải cách cầm kiếm!"
  martial_strategy_special.1404.b.tt:0 "Không lạ gì họ bị lạc — đội quân này cần kỷ luật!"
  martial_strategy_special.1404.c:0 "Đưa binh sĩ về nhà, [knight.GetFirstNameNoTooltip]. Ta mệt mỏi vì phải tìm kiếm."
  martial_strategy_special.1404.d:0 "[soldier_friend.GetTitledFirstNameNoTooltip] có thể chỉ huy những binh sĩ này."
  martial_strategy_special.1404.d.tt:0 "[soldier_friend.GetSheHe|U] sẽ đưa họ về an toàn đến lâu đài."

  martial_strategy_special.1405.t:0 "Trên Đường Hành Quân"
  martial_strategy_special.1405.desc:1 "Khi đi qua một ngôi làng nhỏ, ta nhận thấy rằng, dù mặc áo vải đơn giản, tất cả lính canh đều mang vũ khí mang dấu hiệu của ta!\n\nChào đón ta trên con đường lầy lội là [zealot.GetTitledFirstName], kẻ tự xưng là \"người bảo vệ thần thánh\" của thị trấn. Binh sĩ của ta bỏ áo giáp để giúp kẻ thuyết giáo phục vụ [zealot.GetFaith.HighGodName]!"
  martial_strategy_special.1405.a:1 "Ta đã cai trị theo quyền thiêng liêng rồi!"
  martial_strategy_special.1405.a.tt:1 "#F \"Những binh sĩ này nên nhớ rằng #EMP ta#! được chọn bởi [zealot.GetFaith.HighGodName] theo một kế hoạch thiêng liêng.\"#!"
  martial_strategy_special.1405.b:0 "Ngươi có một ngày để rời khỏi nơi này, kẻ cuồng tín."
  martial_strategy_special.1405.b.tt:2 "#F \"Dường như trừng phạt [zealot.GetWomanMan] nguy hiểm, nhưng đày [zealot.GetHerHim] đi sẽ giải quyết vấn đề tạm thời.\"#!"
  martial_strategy_special.1405.c:0 "Họ sẽ sớm chán việc làm lính thánh."
  martial_strategy_special.1405.d:1 "Tham gia cùng ta, kẻ thuyết giáo, và chúng ta sẽ thực hiện ý muốn [ROOT.Char.GetFaith.HighGodNamePossessive] cùng nhau!"
  martial_strategy_special.1405.d.tt:2 "#F \"Rốt cuộc, chẳng phải chúng ta đều là những tôi tớ của [ROOT.Char.GetFaith.HighGodNameAlternate] theo cách này hay cách khác sao?\"#!"

  martial_strategy_special.1498.t:0 "Trên Đường Hành Quân"
  martial_strategy_special.1498.desc:0 "Những binh sĩ cuối cùng đã trở về [capital.GetNameNoTier], và trật tự được khôi phục.\n\nDù đây không phải màn trình diễn quân sự xuất sắc, ta đã có được một góc nhìn mới về đạo quân và từng binh sĩ trong đó."
  martial_strategy_special.1498.a:0 "Dù sao, đây vẫn là một bài tập giá trị!"

  martial_strategy_special.1499.t:0 "Trên Đường Hành Quân"
  martial_strategy_special.1499.desc:0 "Mất một thời gian, nhưng từ từ những binh sĩ mất tích trở về qua cổng [capital.GetNameNoTier].\n\nTa có thể không tham gia nhiều vào việc này, nhưng họ dường như học được nhiều điều từ trải nghiệm."
  martial_strategy_special.1499.a:0 "Bài tập này không diễn ra theo kế hoạch."
  martial_strategy_special.1499.a.tt:1 "#F Trong [ROOT.Char.Custom('FortifiedBuilding')] của ngài thoải mái hơn nhiều so với ngoài đồng rừng.#!"
 
