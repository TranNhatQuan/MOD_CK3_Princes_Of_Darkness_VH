l_english:
 #A practice duel gone terribly wrong, Peter Vilberg 	
  martial_chivalry.0001.t:0 "Thử Thách Không Xứng"
  martial_chivalry.0001.opening:0 "Ban đầu ta tưởng một kẻ lính đơn sơ thật ngu dại khi bước lên trường luyện tập."
  martial_chivalry.0001.hard_fight:0 "Nhưng trận đấu lại khó khăn hơn dự liệu, và dần dần ta nhận ra [duel_opponent.GetSheHe] không thể ngăn những đòn điên cuồng và tàn bạo của [duel_opponent.GetHerHis] làm ta tổn thương!"
  martial_chivalry.0001.easy_fight:0 "\n\nDù lúc đầu [duel_opponent.GetTitledFirstName] không có vẻ đe dọa, sớm thôi ta nhận ra [duel_opponent.GetSheHe] không thể ngăn những đòn tàn bạo của [duel_opponent.GetHerHis]!"
  martial_chivalry.0001.conclusion:0 "Vũ khí của [duel_opponent.GetHerHim] bỗng trở thành vấn đề sống còn.\n\nTa cố không lộ vẻ nhẹ nhõm khi thanh kiếm [duel_opponent.GetHerHis] cuối cùng rơi xuống đất."
  martial_chivalry.0001.a:0 "Ta cần thêm những người như ngươi!"
  martial_chivalry.0001.a.tt:1 "Hy vọng [duel_opponent.GetTitledFirstName] sẽ phục vụ ngươi tốt."
  martial_chivalry.0001.b:0 "Người nông dân này — và quân lính ta — sẽ nhận một bài học về danh dự."
  martial_chivalry.0001.b.tt:1 "Quân lính ngươi cũng sẽ học được điều đúng sai trong chiến đấu tay đôi."
  martial_chivalry.0001.c:0 "Ta hạ gục [duel_opponent.GetHerHim] ngay tại nơi [duel_opponent.GetSheHe] đứng."
  martial_chivalry.0001.c.tt:0 "Chém trảm chỉ một nhát khiến lính thường và quý tộc đều ấn tượng."


 #Horse Riding Accident, by Petter Vilberg
  martial_chivalry.0002.t:0 "Cú Sốc Bất Ngờ"
  martial_chivalry.0002.desc:0 "Ta đã cưỡi, nhắm và tấn công nhiều lần đến nỗi tưởng chẳng gì làm xao nhãng nhịp điệu. Khi phi nước đại lần nữa trên sân tập, một sự hỗn loạn mà ta chưa thấy rõ khiến ngựa nhảy dựng.\n\nTrong khoảnh khắc, quán tính giữ ta chặt lưng ngựa khi nó rung lắc. Rồi, như thời gian chậm lại, ta cảm thấy mình sắp bị văng ra."
  martial_chivalry.0002.a:0 "Bình tĩnh nào, [ROOT.Char.Custom('RandomGirlBoy')]! Bình tĩnh!"
  martial_chivalry.0002.a_success:0 "Ngươi vẫn giữ vững mình trên yên"
  martial_chivalry.0002.a_failure:0 "Ngươi bị quăng xuống"
  martial_chivalry.0002.increase_horse_mastery:1 "Kỹ năng cưỡi ngựa của ta tăng, đồng thời thành thạo hơn trong [martial_lifestyle|E]."
  martial_chivalry.0002.b:0 "Ta lao về đất chắc — an toàn hơn là hối hận!"

  martial_chivalry.0003.t:0 "Trong Tầm Kiểm Soát"
  martial_chivalry.0003.desc:0 "Ta cảm thấy bị quăng trái phải, nhưng không gì làm ta buông cương hay yên.\n\nLệnh của ta dần trấn an ngựa, nó sớm lại giậm chân phấn khích trên đất cứng, vững như thường."
  martial_chivalry.0003.a:0 "Thật là một con thú mạnh mẽ."
  martial_chivalry.0003.b:0 "Ta sẽ trực tiếp huấn luyện con này."
  martial_chivalry.0003.a.tt:1 "Ít nhất, sự cố này dạy ngươi nhiều hơn về điều khiển ngựa."

  martial_chivalry.0004.t:0 "Màn Trình Diễn Không Hoành Tráng"
  martial_chivalry.0004.desc:1 "Ta bị quăng xuống đất cứng, cơn đau chạy qua từng xương trong cơ thể.\n\nCậu bé trông coi chuồng ngựa chạy tới nhưng vừa trễ."
  martial_chivalry.0004.a:0 "Đồ thú dữ!"

  martial_chivalry.0005.t:0 "Một Ngày Xui Cho Cưỡi Ngựa"
  martial_chivalry.0005.desc:1 "Cậu bé chuồng ngựa định giúp ta đứng dậy, nhưng ta hét ngăn lại.\n\nVa chạm xuống đất khiến toàn thân đau nhói, vết thương cũ đau hơn khi mới bị!"
  martial_chivalry.0005.a:0 "Ta lẽ ra không nên rời giường hôm nay."

  martial_chivalry.0006.t:0 "Chuyện Gì Xảy Ra?"
  martial_chivalry.0006.desc:1 "Ta không nhớ làm sao rơi xuống đất, chỉ biết toàn thân đau nhức. Những gương mặt lạ tụ tập quanh nhìn xuống.\n\nMọi thứ tối mịt."
  martial_chivalry.0006.a:0 "Làm sao ta lại nằm trên giường? Ngựa ta đâu rồi?"

  martial_chivalry.0007.t:0 "Một Vương Quốc Đổi Ngựa"
  martial_chivalry.0007.desc:0 "Ta tưởng cưỡi ngựa sẽ tốt hơn, chút vận động sẽ giúp ta hồi phục. Khi rơi qua không trung, cơn đau tạm lắng trong khoảnh khắc nhẹ bẫng. Đó là cảm giác tốt nhất nhiều tuần qua.\n\nKhi đập xuống đất, ta không còn lo cơn đau hay bất kỳ chuyện trần thế nào."
  martial_chivalry.0007.a:0 "Phía trước có gì chờ ta?"

 #Train with your signature weapon, by Linnéa Thimrén
  martial_chivalry.0010.t:0 "Con Đường của [ROOT.Char.Custom('signature_weapon')|U]"
  martial_chivalry.0010.desc:0 "Những va chạm kim loại không ngừng, áo giáp cọ xát, mồ hôi xót… Là điệu nhảy vừa quen vừa mệt nhoài. Ta [ROOT.Char.Custom('SignatureWeaponAction')] [ROOT.Char.Custom('signature_weapon')], tấn công, né, phòng thủ, rồi lặp lại.\n\nCó lẽ ta nên thử luyện tập kỹ năng với một vũ khí khác."
  martial_chivalry.0010.a:0 "Ta và [ROOT.Char.Custom('signature_weapon')] trung thành sẽ không rời nhau."
  martial_chivalry.0010.b:0 "Chấm dứt sự đơn điệu, đưa ta vũ khí khác!"
  martial_chivalry.0010.b.tt1:1 "Ngươi cho họ thấy cách làm"
  martial_chivalry.0010.b.tt2:1 "Ngươi vấp ngã và tự làm mình thương"


 #Find an old castle, by Linnéa Thimrén 
  martial_chivalry.1011.t:0 "Nghỉ Ngơi Cho Kẻ Mệt"
  martial_chivalry.1011.desc:0 "Đẫm mồ hôi, mệt mỏi và đói; một ngày dài tập luyện với quân lính sắp kết thúc.\n\nKhi tìm nơi dựng trại, chúng ta phát hiện lâu đài cũ bỏ hoang xa xa. [ROOT.Char.Custom('quirk_pos_personal_pp')|U], ta nói, "Chính là nơi chúng ta sẽ trại tối nay."\n\nMặt trời lặn, từng bước tiến về tàn tích càng thấy u ám. Không lâu sau, quân lính thì thầm về ma quái."
  martial_chivalry.1011.a:0 "Hãy vào bên trong, ta chắc có kho báu!"
  martial_chivalry.1011.a.tt:0 "Ai biết ngươi sẽ tìm thấy gì trong đó?"
  martial_chivalry.1011.b:0 "Hãy dựng lều bên ngoài, đã đến giờ nghỉ ngơi."

  martial_chivalry.1012.t:0 "Tìm Kiếm Bí Ẩn"
  martial_chivalry.1012.desc:0 "Bóng tối, ẩm ướt và hoang vắng tràn ngập trong lâu đài, dấu tích sự sống không còn.\n\nNhìn lên cầu thang mục nát, ta thấy tấm thảm và tranh xưa. Nhìn xuống cầu thang xoắn ốc, chỉ thấy bóng tối kéo sâu dưới nền lâu đài."
  martial_chivalry.1012.a:0 "Ta tìm trên lầu!"
  martial_chivalry.1012.a.success:1 "Ta tìm thấy kho báu lớn"
  martial_chivalry.1012.a.failure:1 "Chỉ thấy vài món đồ vặt"
  martial_chivalry.1012.b:0 "Dưới bóng tối kia có gì ẩn giấu?"
  martial_chivalry.1012.b.tt1:1 "#F "Ta thề cái bóng vừa di chuyển! Là… máu sao? Tiếng gì vừa vang?!"#!"
  martial_chivalry.1012.b.success:1 "Ngươi đối mặt nỗi sợ"
  martial_chivalry.1012.b.failure:1 "Nơi này làm ngươi sợ"

  martial_chivalry.1021.t:0 "Hỗn Loạn Trận Chiến"
  martial_chivalry.1021.desc:1 "Kiếm chém vào áo giáp, khuỷu tay đập mũ, quân sĩ né đòn vụng của ta… Trận đấu giả diễn ra xung quanh, nhưng ta chật vật tìm tập trung.\n\nTa muốn hạ cảnh giác khi chiến sự tạm lắng, nhưng biết ngay đợt tấn công thứ hai sắp đến."
  martial_chivalry.1021.a:0 "Ta tạm lùi một chút."
  martial_chivalry.1021.b:0 "Đón đợt tấn công ngay!"
  martial_chivalry.1021.b.success:0 "Đợt tấn công của ta khiến mọi người kinh ngạc"
  martial_chivalry.1021.b.failure:0 "Ngươi vấp ngã và tự làm thương"


 #Practice duel (Prowess skill challenge), Petter Vilberg
  martial_chivalry.2010.t:0 "Thử Thách"
  martial_chivalry.2010.start.desc:1 "Ta đang đấu tập với một trong quân lính, mồ hôi lấm trên trán, khi cảm giác lạ rằng có người theo dõi. Nhìn quanh, ta thấy [challenger.Custom2('MyCharacterIntroduction', ROOT.Char)],"
  martial_chivalry.2010.like.desc:0 "người vẫy tay với ta. Ta đi tới chào [challenger.GetHerHim].\n\nChúng ta trò chuyện về luyện tập vũ khí, trao đổi mẹo và lời khuyên. Khi ta sắp ra ngoài vòng mới, gương mặt [challenger.GetTitledFirstNamePossessive] sáng lên và [challenger.GetSheHe] đề nghị cùng luyện tập."
  martial_chivalry.2010.dislike.desc:0 "nhìn ta chằm chằm trong khi thản nhiên vung [challenger.GetHerHis] [challenger.Custom('signature_weapon')] qua lại.\n\n"[ROOT.Char.GetTitleTierName] của ta!" [challenger.GetFirstNamePossessive] nói lớn khắp sân trong. "Ngài không muốn thử kỹ năng của mình với ta thay thế sao?""
  martial_chivalry.2010.a:0 "Thử thách chấp nhận!"
  martial_chivalry.2010.a.success.tt:1 "Ngươi thắng đấu tập"
  martial_chivalry.2010.b:0 "Ta e không…"
  martial_chivalry.2010.a.failure1.tt:0 "[challenger.GetShortUINameNoTooltip] chiếm lợi thế trong đấu tập"
  martial_chivalry.2010.a.failure2.tt:1 "Ngươi thua đấu tập"

  martial_chivalry.2011.t:0 "Chiếm Thế Thượng Phong"
  martial_chivalry.2011.start.desc:0 "Âm thanh va chạm [ROOT.Char.Custom('signature_weapon')] với [challenger.Custom('signature_weapon')] vang lên giữa sân. Mọi ánh mắt đổ dồn, ai cũng muốn thấy [ROOT.Char.GetTitleTierName] đánh bại [ROOT.Char.GetHerHis] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('challenger'))].\n\n"
  martial_chivalry.2011.end.desc:0 "Đám đông vỗ tay khi ta lao tới, sự ngưỡng mộ làm ta tự tin. Thay vì rút lui, ta thử kỹ thuật mới luyện. Cử chỉ hòa vào [ROOT.Char.Custom('signature_weapon')] như một thể. [challenger.GetTitledFirstName] không có cách phòng thủ."
  martial_chivalry.2011.a:0 "Kết thúc ở đây! Chơi hay."
  martial_chivalry.2011.b:0 "Ta sẽ cho [challenger.GetHerHim] biết không dám thách thức lần nữa!"

  martial_chivalry.2012.t:2 "[challenger.Custom('SignatureWeaponArticle')|U] [challenger.Custom('signature_weapon')|U] chĩa vào Cổ Ta"
  martial_chivalry.2012.end.desc:1 "Ta hẳn mệt từ luyện tập trước, nên di chuyển chậm, không theo kịp đối thủ. Khi ta lao tới, [challenger.GetSheHe] đã tránh, đòn ta phản công muộn. Không lâu sau, ta thấy mình ngã xuống trước [challenger.GetHerHim]."
  martial_chivalry.2012.a:0 "Ta đầu hàng! Chơi hay."
  martial_chivalry.2012.b:0 "Chỉ kẻ hèn mới chịu thua!"
  martial_chivalry.2012.b.failure.tt:1 "#F Ngươi thua đấu tập.#!"
 
  martial_chivalry.2013.t:0 "Nhục Nhã Đẫm Máu"
  martial_chivalry.2013.end.desc:0 "Nhờ mưu mẹo bẩn, [challenger.GetFirstName] chiếm lợi thế sớm. Không còn thời gian phản đối, cũng không muốn kêu ca. Nhưng ta không thể bỏ qua, cơn giận làm mất thăng bằng. Ta lao liều và bị đối thủ đánh ngã."
  martial_chivalry.2013.a:0 "Kẻ [challenger.Custom2('InsultNoun', ROOT.Char)] xảo trá!"
 
  martial_chivalry.2014.t:0 "Trái Ngược Mọi Khó Khăn"
  martial_chivalry.2014.desc:0 "Xét qua tiếng thốt của đám đông, họ khó tin khi ta lăn tránh [challenger.GetFirstNamePossessive] [challenger.Custom('signature_weapon')] và tước vũ khí [challenger.GetHerHim] chỉ trong một nhát. Ta biết đó là nước đi nguy hiểm, nhưng đôi khi phải mạo hiểm lớn để chiến thắng vinh quang."
  martial_chivalry.2014.a:0 "Chiến thắng của ta sẽ không dễ quên!"

  martial_chivalry.2015.t:0 "Sự Chế Nhạo Trước Công Chúng"
  martial_chivalry.2015.desc:0 "Ta thực hiện một đòn tấn công tuyệt vọng cuối cùng, nhưng [challenger.GetFirstName] quá nhanh. [challenger.GetSheHe|U] đỡ đòn theo bản năng, nhưng vì đòn tấn công của ta quá bất ngờ, [challenger.GetSheHe] không kiểm soát hoàn toàn được vũ khí [challenger.GetHerHis]. Nỗi đau tê liệt chạy dọc cánh tay ta."
  martial_chivalry.2015.a:0 "Sao ta lại làm vậy?!"

 #Vassal struggling to train new recruits, Sean Hughes
  martial_chivalry.3000.t:0 "Tân Binh Vô Kỷ Luật"
  martial_chivalry.3000.desc:0 "Hôm nay ta đang quan sát [bad_commander.GetTitledFirstName] khi [bad_commander.GetSheHe] huấn luyện một số tân binh [bad_commander.GetHerHis], nhưng dưới sự chỉ huy [bad_commander.GetHerHis] họ giống một đám đông vô tổ chức hơn là một đội quân.\n\nTa nhìn khi [bad_commander.GetSheHe] vật lộn để giành quyền kiểm soát tình hình, rõ ràng bị đẩy đến giới hạn [bad_commander.GetHerHis]."
  martial_chivalry.3000.desc.callous:0 "Sự vụng về này là nỗi nhục cho [ROOT.Char.GetPrimaryTitle.GetName] và không thể dung thứ!"
  martial_chivalry.3000.desc.compassionate:0 "Từng ở trong tình huống đó, ta hiểu khó khăn khi làm việc với lính chưa được huấn luyện."
  martial_chivalry.3000.desc.fallback:1 "Huấn luyện lính chưa bao giờ dễ, nhưng [bad_commander.GetSheHe] thực sự cần làm tốt hơn thế này."
  martial_chivalry.3000.a:0 "Quở trách [bad_commander.GetHerHim] vì thất bại của [bad_commander.GetHerHis]."
  martial_chivalry.3000.b:0 "Dạy [bad_commander.GetHerHim] những gì ta biết về chỉ huy."
  martial_chivalry.3000.b.attempt:0 "[bad_commander.GetTitledFirstNameNoTooltip] sẽ quyết định dựa trên tính cách [bad_commander.GetHerHis]"
  martial_chivalry.3000.b.tt.s:1 "[bad_commander.GetTitledFirstNameNoTooltip] tiếp nhận lời khuyên của ngươi"
  martial_chivalry.3000.b.tt.f:0 "[bad_commander.GetTitledFirstNameNoTooltip] từ chối nghe lời"
  martial_chivalry.3000.c:0 "An ủi [bad_commander.GetHerHim] sau khi buổi huấn luyện kết thúc."

  martial_chivalry.3000.response.desc:0 "[my_liege.GetTitledFirstName] ghé xem ta hôm nay khi ta huấn luyện tân binh.\n\nThật xấu hổ, quân lính vô kỷ luật của ta trở thành một đám hỗn loạn khi cố hoàn thành bài tập!"
  martial_chivalry.3001.t:0 "Nhục Nhã!"
  martial_chivalry.3001.desc:0 "Tệ hơn, [my_liege.GetFirstName] còn đổ lỗi trực tiếp cho ta về thất bại này."
  martial_chivalry.3001.a:0 "Trừng phạt bọn tân binh khiến ta nhục nhã!"
  martial_chivalry.3001.b:0 "Ta phải làm tốt hơn, vì sự yên ổn của vương quốc."
  martial_chivalry.3001.c:0 "Ta đã thất bại trước [my_liege.GetTitledFirstNameNoTooltip]."

  martial_chivalry.3002.t:0 "Can Thiệp"
  martial_chivalry.3002.desc:0 "Giờ [my_liege.GetFirstName] đang giảng giải cho ta cách huấn luyện tân binh!"
  martial_chivalry.3002.a:0 "Tiếp nhận lời khuyên của [my_liege.GetFirstNamePossessiveNoTooltip] một cách lịch thiệp."
  martial_chivalry.3002.b:0 "Nguyền rủa bọn hỗn loạn đã làm ta nhục nhã!"

  martial_chivalry.3003.t:0 "Lời Khuyên Được Chấp Nhận"
  martial_chivalry.3003.desc.1:0 "Ta kéo [bad_commander.GetTitledFirstName] sang một bên khi tân binh của [bad_commander.GetHerHis] cố tiếp tục huấn luyện. 'Điều quan trọng khi huấn luyện lính mới là rèn kỷ luật!' ta bảo [bad_commander.GetHerHim]. 'Thiếu điều đó, ngươi sẽ không thể trông cậy họ tuân lệnh…'"
  martial_chivalry.3003.desc.2:0 "\n\nSau khi xong, [bad_commander.GetFirstName] cảm ơn ta trước khi quay trở lại sân, nơi [bad_commander.GetSheHe] nhanh chóng kiểm soát tình hình."
  martial_chivalry.3003.a:0 "Điều này sẽ biến [bad_commander.GetFirstNameNoTooltip] thành một chỉ huy tốt hơn."

  martial_chivalry.3004.t:0 "Lời Khuyên Bị Từ Chối!"
  martial_chivalry.3004.desc:0 "Khi ta vỗ vai [bad_commander.GetTitledFirstName] [bad_commander.GetHerHis], [bad_commander.GetSheHe] giơ tay [bad_commander.GetHerHis] lên và hét "Đây #EMP không phải#! lỗi của ta [ROOT.Char.GetFirstNameNoTooltip]! Những tên nông dân ngu ngốc này không phân biệt được tay phải hay tay trái của chúng! Làm sao ai có thể mong đợi biến đám ô hợp này thành một đội quân!?""
  martial_chivalry.3004.b:0 "[bad_commander.GetTitledFirstNameNoTooltip] sẽ hối hận vì thái độ hỗn xược này!"
  martial_chivalry.3004.a:0 "Ta thất vọng về [bad_commander.GetTitledFirstNameNoTooltip]."

  martial_chivalry.3005.t:0 "An Ủi"
  martial_chivalry.3005.desc:0 "May thay, [my_liege.GetFirstName] đến an ủi ta sau buổi tập và khuyến khích nỗ lực."
  martial_chivalry.3005.a:0 "[my_liege.GetSheHe|U] có quyền la rầy, nhưng đã không làm vậy."

  martial_chivalry.4000.t:0 "Cuộc Phi Giữa Đêm"
  martial_chivalry.4000.desc:0 "Giọng của một người hầu lôi ta ra khỏi giấc mơ.\n\n"Trộm! Cướp!" [ROOT.Char.GetSheHe] hét lên. "[ROOT.Char.GetTitleAsNameNoTooltip] của ta, có những chiến binh trẻ đang dẫn bầy đàn của ngài vào bóng tối, lùa chúng thẳng về vùng đất của [raiders.GetTitledFirstName]!"\n\nBị đánh thức, các $knight_culture_player_plural_no_tooltip_lowercase$ của ta lăn khỏi giường và lao lên yên ngựa. Ta đến gần con ngựa của mình, [ROOT.Char.Custom('signature_weapon')] trên tay.\n\n Đã muộn và còn một chặng đường dài phải đi."
  martial_chivalry.4000.sleepy:0 "\n\nTa nhớ đến giường êm ấm…"
  martial_chivalry.4000.angry:0 "Nhưng phải ngăn bọn trộm!"
  martial_chivalry.4000.a:0 "Bao vây, bọn trộm sẽ hoảng loạn."
  martial_chivalry_special.4000.a.tt:0 "Ngươi dẫn kỵ sĩ vượt mặt và bao vây bọn trộm."
  martial_chivalry_special.4000.a.tt_success:0 "Phản công của ngươi hoàn hảo"
  martial_chivalry_special.4000.a.tt_failure:0 "Bọn trộm chống cự ngươi"
  martial_chivalry_special.4000.a.tt_failure_2:0 "Ngươi hoặc một trong $knight_culture_player_plural_no_tooltip$ bị thương"
  martial_chivalry.4000.b:0 "Ta sẽ chém chết thủ lĩnh kiêu ngạo!"
  martial_chivalry_special.4000.b.tt:0 "Không ai cưỡi hay chiến đấu hơn [ROOT.Char.GetTitledFirstNameNoTooltip]!"
  martial_chivalry_special.4000.b.tt_success:0 "Ngươi đổ máu cho gia súc của mình"
  martial_chivalry_special.4000.b.tt_failure:0 "Tên trộm nhại ngươi"
  martial_chivalry_special.4000.b.tt_critical_failure:0 "Ngươi bị quăng khỏi yên… và bị dẫm"
  martial_chivalry_special.4000.b.tt_critical_failure_2:0 "Ngươi bị thương nặng"
  martial_chivalry.4000.c:0 "Ngựa và ta một lòng: 'Không phải tối nay.'"
  martial_chivalry_special.4000.c.tt:0 "Ngươi sẽ bắt được #EMP vài#! tên trộm, chắc chắn. Sau khi nghỉ ngơi đủ đêm."

 #Mounted Warrior Practice, by Petter Vilberg
  martial_chivalry_special.1201.t:0 "Huấn Luyện [ROOT.Char.Custom('MountedWarriorAdjective')|U]"
  martial_chivalry_special.1201.desc:0 "Tiếng va chạm của giáp và kiếm vang rền bên tai khi [ROOT.Char.Custom('MountedWarriorTermPlural')] của ta luyện tập võ nghệ. Ta quan sát kỹ, cố gắng nắm bắt điểm mạnh và điểm yếu riêng của từng người.\n\nHọ gần như không có thời gian nghỉ, bởi ngay khi chuông báo kết thúc trận giả lập, cửa chuồng ngựa mở ra. Đã đến lúc đưa ngựa ra sân."
  martial_chivalry_special.1201.a:0 "Hôm nay chúng ta sẽ ra đồng cưỡi ngựa!"
  martial_chivalry_special.1201.a.tt:2 "Luyện đội hình với [ROOT.Char.Custom('MountedWarriorTermPlural')] có thể giúp nâng cao kỹ năng trong [martial_lifestyle|E]."
  martial_chivalry_special.1201.b:0 "Mang áo giáp ra cho ta. Ta đã lâu không cưỡi ngựa trên vòng đua!"
  martial_chivalry_special.1201.b.tt:1 "\nLuyện tập đến khi mặt trời lặn không cải thiện chiến thuật, nhưng sẽ khiến ngươi #EMP mạnh mẽ#!."

  martial_chivalry_special.1202.t:1 "Huấn Luyện [ROOT.Char.Custom('MountedWarriorAdjective')|U]: Tầm Nhìn Trên Đồi"
  martial_chivalry_special.1202.desc:0 "[soldier.GetTitledFirstName] liếc nhìn cánh đồng bùn dưới chân đồi. 'Chúng có thể làm hình dáng quân địch,' [soldier.GetSheHe] nói.\n\nTa chỉ dẫn [ROOT.Char.Custom('MountedWarriorTermPlural')] khi kiểm tra đội hình, chuẩn bị chiến thuật sắp tới."
  martial_chivalry_special.1202.a:0 "Ta sẽ cắt chéo và dẫn [ROOT.Char.Custom('MountedWarriorTermPlural')] vào 'sườn quân địch'."
  martial_chivalry_special.1202.b:0 "#EMP Tấn Công!#!"
  martial_chivalry_special.1202.b_success:0 "Cuộc tấn công được thực hiện thành công"
  martial_chivalry_special.1202.b_failure:0 "Cuộc tấn công trở thành thảm họa"

  martial_chivalry_special.1203.t:1 "Huấn Luyện [ROOT.Char.Custom('MountedWarriorAdjective')|U]: Đòn Chính Xác"
  martial_chivalry_special.1203.desc:0 "Cơn bão móng ngựa xung quanh, tiếng hò reo của chiến binh cưỡi ngựa, đà tiến không ngừng. Dẫn đầu, ta cảm giác như đứng đầu một lực lượng thiên nhiên. Tuy nhiên, đây là lực lượng ta điều khiển, tuân theo mọi mệnh lệnh, như là phần mở rộng của chính bản thân.\n\nXung kích vào sườn quân địch tưởng tượng, [ROOT.Char.Custom('MountedWarriorTermPlural')] tuân thủ kế hoạch, ta biết rằng đây là cách ta mang đến sự tàn phá hoàn toàn cho kẻ thù."
  martial_chivalry_special.1203.a:0 "Đây sẽ là cảm giác thắng lợi dồn dập."

  martial_chivalry_special.1204.t:1 "Huấn Luyện [ROOT.Char.Custom('MountedWarriorAdjective')|U]: Cơn Thịnh Nộ Của Thú Dã"
  martial_chivalry_special.1204.desc:0 "Ta [ROOT.Char.Custom('SignatureWeaponAction')] [ROOT.Char.Custom('signature_weapon')], dẫn kỵ sĩ lao xuống đồi. Giữa sự hỗn loạn của giáp lấp lánh, vũ khí giơ cao và tiếng hò reo, vẫn có một kế hoạch. Khi đâm vào đội quân tưởng tượng dưới chân đồi, mỗi chiến binh tìm vị trí, chuẩn bị đòn, rút lui, xoay cương, nhảy trở lại chiến trường.\n\nChúng ta sẽ ập qua kẻ thù như một lực lượng thiên nhiên, và chúng sẽ tan vỡ như cây trước cơn bão."
  martial_chivalry_special.1204.a:0 "Chúng ta sẽ chém ngã mọi kẻ trên đường đi!"


 #Train a warhorse, by Linnéa Thimrén
  martial_chivalry_special.1601.t:0 "Huấn Luyện Ngựa Chiến"
  martial_chivalry_special.1601.desc:1 "Khi ta kiểm tra chuồng ngựa, ánh mắt ta bị thu hút bởi một [dummy_gender.Custom('HorseMareStallion')] được giữ cách xa những con khác. [dummy_gender.GetSheHe|U] hất đầu [dummy_gender.GetHerHis] và giậm móng [dummy_gender.GetHerHis], phô diễn phần sau mạnh mẽ và cái cổ cong đẹp [dummy_gender.GetHerHis]. Sinh vật này có dáng vẻ đẹp nhất và tính khí tệ nhất.\n\nTa chưa từng thấy con chiến mã nào như thế trước đây, nhưng người trông coi chuồng ngựa khẳng định rằng [dummy_gender.GetSheHe] không thể huấn luyện được."
  martial_chivalry_special.1601.a:0 "Ta không lùi bước trước thử thách!"
  martial_chivalry_special.1601.b:0 "Một chiến mã tuyệt hảo sẽ có giá cao."
  martial_chivalry_special.1601.c:1 "Quản ngựa của ta sẽ học được nhiều từ việc thuần hóa [dummy_gender.GetHerHim]."
  martial_chivalry_special.1601.a.tt:1 "Ngựa có thể trở thành chiến mã của chính ngươi"
  martial_chivalry_special.1601.d:0 "[m_horse.GetTitledFirstNameNoTooltip] chẳng phải là chuyên gia về ngựa sao?"
  martial_chivalry_special.1601.d.tt:0 "$master_of_horse_court_position$ sẽ cố thuần hóa. Nếu thành công, ngựa sẽ là chiến mã của ngươi."

  martial_chivalry_special.1603.desc:1 "Con ngựa ghim tai [dummy_gender.GetHerHis] lại khi ta đến gần, sự coi thường của nó dành cho ta rõ ràng như pha lê. Cuộc gặp gỡ đầu tiên này rất quan trọng để giành được sự tin tưởng và tôn trọng [dummy_gender.GetHerHis], và ta cần quyết định cách thức thực hiện."
  martial_chivalry_special.1603.a:0 "Cần tay vững để thuần hóa!"
  martial_chivalry_special.1603.a.tt:0 "Hiệu quả với kỹ năng [prowess|E] cao hoặc tính cách táo bạo"
  martial_chivalry_special.1603.b:0 "Di chuyển nhẹ nhàng, [dummy_gender.GetSheHe] sẽ tin ta."
  martial_chivalry_special.1603.b.tt:0 "Hiệu quả với kỹ năng [diplomacy|E] cao hoặc tính cách nhân từ"
  martial_chivalry_special.1603.c:0 "Ai cũng có giá cả — đưa táo ra!"
  martial_chivalry_special.1603.c.tt:0 "Hiệu quả với kỹ năng [intrigue|E] cao hoặc tính cách hào phóng"

  martial_chivalry_special.1604.desc_success:0 "Thật là một cảm giác mạnh mẽ; con ngựa dũng mãnh tuân theo mọi ý muốn của ta. Bây giờ ta đã giành được sự tin tưởng [dummy_gender.GetHerHis], [dummy_gender.GetSheHe] có vẻ gần như quý mến ta."
  martial_chivalry_special.1604.desc_failure:0 "Dù ta có cố gắng thế nào con ngựa cũng từ chối lắng nghe. Những nỗ lực của ta khiến cả [dummy_gender.GetHerHim] và ta đổ mồ hôi và tức giận, và khi ta rời chuồng ngựa vào đêm muộn, ta biết rằng mình sẽ không quay lại sớm."
  martial_chivalry_special.1604.a:1 "Ta sẽ giữ [dummy_gender.GetHerHim] làm chiến mã cá nhân!"
  martial_chivalry_special.1604.a_2:0 "Quá đáng giá! Ta sẽ làm lại."
  martial_chivalry_special.1604.b:0 "Ít ra ta học được điều #EMP không#! nên làm..."
  martial_chivalry_special.1604.c:0 "Chư vị Chúa sẽ vui lòng."
  martial_chivalry_special.1604.t:0 "Ngựa Đã Thuần"
  martial_chivalry_special.1604.succcess:0 "$master_of_horse_court_position$ đã thuần hóa chiến mã khó tính!"
  martial_chivalry_special.1604.t.2:0 "Ngựa Chưa Thuần"
  martial_chivalry_special.1604.failure:0 "$master_of_horse_court_position$ thất bại trong việc thuần hóa ngựa."
 
  martial_chivalry.5000.t:0 "Tin Đồn Vô Căn Cứ"
  martial_chivalry.5000.intro:0 "Chẳng lâu sau khi mặt trời lặn, [spymaster.Custom2('MyCharacterIntroduction', ROOT.Char)] tiếp cận ta trên đường đến phòng ngủ.\n\n'[ROOT.Char.Custom('FormOfAddressForLiege')|U], danh tiếng dũng cảm của ngươi nổi tiếng và được thần dân ngưỡng mộ, nhưng vẻ bề ngoài lịch thiệp dễ gây đố kỵ. Ngay cả giờ đây, họ thì thầm rằng ngươi có những ý định khác, thậm chí tầm thường hơn.'"
  martial_chivalry.5000.desc.lustful:0 "\n\nDù ta không bao giờ thừa nhận, sự thật là nghi ngờ của họ cũng không hoàn toàn sai..."
  martial_chivalry.5000.desc.honest_chaste:0 "\n\nLàm sao ai tin ta sẽ làm hành vi nhục nhã như vậy?"
  martial_chivalry.5000.desc.fallback:0 "\n\nTa nhướn mày — nếu đó là tất cả, hắn sẽ không có vẻ băn khoăn."
  martial_chivalry.5000.desc.outro:0 "\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], có lời đồn rằng ngài... #EMP dính líu#! tới phối ngẫu của [my_liege.GetShortUINamePossessive].\""
  martial_chivalry.5000.a:0 "Ta sẽ ngay lập tức phủ nhận!"
  martial_chivalry.5000.a.success:0 "Ngươi thuyết phục [my_liege.GetFirstNameNoTooltip] về ý định chân chính"
  martial_chivalry.5000.a.failure:0 "[my_liege.GetFirstNameNoTooltip] vẫn nghi ngờ ngươi"
  martial_chivalry.5000.b:0 "Nói ra chỉ làm mọi người chú ý hơn."
  martial_chivalry.5000.c:0 "Ta phải đến nói chuyện trực tiếp với [my_liege.GetTitledFirstNameNoTooltip]."
  martial_chivalry.5000.d:0 "Nếu họ thấy cách [spouse.GetSheHe] nhìn ta..."
  martial_chivalry.5000.d.tt:0 "Hành động dũng cảm nhất là theo đuổi tình yêu cấm."
  martial_chivalry.5000.d.tt.warning:0 "@warning_icon! #X Kết thúc mọi [schemes|E] đang diễn ra.#!"
 
  martial_chivalry.6000.t:0 "Vào [church_province.GetTerrain.GetNameNoTooltip]"
  martial_chivalry.6000.desc:0 "Rừng luôn là nơi huấn luyện quý giá. Ai cũng biết kỵ sĩ dũng cảm luôn tìm kiếm phiêu lưu: bạo chúa độc ác, thử thách bí mật, kẻ vô tội cần cứu.\n\nTa chưa khám phá vùng này của [church_province.GetTerrain.GetNameNoTooltip|l]; có lẽ vì vậy mà những tàn tích bất ngờ như thử thách lòng dũng cảm.\n\nNhà thờ bỏ hoang nhiều thập kỷ. Mạng nhện thay kính cửa sổ. Thân cây gãy thay ghế. Một số chim bay khi ta đến gần cánh cửa mục nát."
  martial_chivalry.6000.a:0 "Ít điều gì cám dỗ bằng một [ROOT.Char.GetFaith.HouseOfWorship] chưa khám phá!"
  martial_chivalry.6000.a.tt:0 "Ngươi có thể tìm thấy điều gì bên trong."
  martial_chivalry.6000.b:0 "[bishop.Custom2('MyCharacterIntroduction', ROOT.Char)|U] sẽ thích nghe về phát hiện quan trọng này."
  martial_chivalry.6000.c:0 "Chúng ta có thể biến nơi này thành kho chứa mới."
  ignored_church_modifier:0 "Kho Nhà Thờ Bỏ Hoang"
 
  martial_chivalry.6001.t:0 "Vào [church_province.GetTerrain.GetNameNoTooltip]: Quái Vật!"
  martial_chivalry.6001.desc:0 "Bàn thờ gần như không nhận ra dưới lớp thiên nhiên. Rễ cây và rêu tràn trên đá, không tha. Tiếng xào xạc lá cạnh đó khiến lòng ta yên bình, đánh lừa.\n\nÀ! Hóa ra đó là tiếng gầm của [ROOT.Char.Custom('GetAnimalType')], mắt đói nhìn ta."
  martial_chivalry.6001.a:0 "Đây là kết cục của ngươi, quái vật!"
  martial_chivalry.6001.a_success:0 "Ngươi đánh bại quái vật"
  martial_chivalry.6001.a_success_toast:0 "Chiến thắng xứng đáng!"
  martial_chivalry.6001.a_failure:0 "Ngươi bị thương"
  martial_chivalry.6001.a_failure_toast:0 "Quái vật phản công!"
  martial_chivalry.6001.b:0 "Ta sẽ lén thoát ra…"
  martial_chivalry.6001.b_success:0 "Ngươi thoát khỏi tấn công"
  martial_chivalry.6001.b_success_toast:0 "Ngươi thoát thành công"
  martial_chivalry.6001.b_failure:0 "Con thú bắt được ngươi"
  martial_chivalry.6001.b_failure_toast:0 "Quái vật nhận ra ngươi"
 
  martial_chivalry.6002.t:0 "Vào [church_province.GetTerrain.GetNameNoTooltip]: Kho Báu!"
  martial_chivalry.6002.desc:0 "Một cây mọc ngay sau bàn thờ. Tán cây thay mái nhà đổ. Bên cạnh là rương gỗ vừa được sử dụng, không bụi, không mốc.\n\nBên trong, một kho báu nhỏ."
  martial_chivalry.6002.a:0 "Ta sẽ trân trọng món quà thiêng liêng này."
  church_artifact_book:0 "Sách Ngưỡng Mộ Lịch Thiệp"
  church_artifact_book_desc:0 "Một quyển sách được trang trí công phu, hướng dẫn cách trở thành kỵ sĩ lịch thiệp. Tìm thấy tại [church_county.GetNameNoTooltip]."
  church_artifact_sword:0 "Kiếm Sùng Kính Thánh"
  church_artifact_sword_desc:0 "Thanh kiếm trang trí công phu. Có lời cầu nguyện khắc trên lưỡi. Tìm thấy tại [church_county.GetNameNoTooltip]."
  church_artifact_dagger:0 "Dao Lời Cầu Nguyện Mạnh"
  church_artifact_dagger_desc:0 "Con dao trang trí công phu. Có bùa treo ở chuôi. Tìm thấy tại [church_county.GetNameNoTooltip]."
  martial_chivalry.6002.book:0 "Nghe như một bài học hoàn hảo cho kỵ sĩ!"
  martial_chivalry.6002.book_tt:0 "Ngươi nghiên cứu sách và đặt lại nơi thiêng liêng."
  martial_chivalry.6002.b:0 "[bishop.Custom2('MyCharacterIntroduction', ROOT.Char)|U] sẽ đánh giá cao món quà này."
  martial_chivalry.6002.c:0 "Tôn thờ giả tạo này chỉ đáng cho lửa!"
 
  martial_chivalry.6003.t:0 "Vào [church_province.GetTerrain.GetNameNoTooltip]: Ai đó…?"
  martial_chivalry.6003.desc_intro:0 "Bóng dáng xuất hiện đột ngột, gần như đáng ngờ. Khuôn mặt [dummy_attracted_gender.GetHerHis|U] phản chiếu ánh hoàng hôn, trông lạnh lùng.\n\n"
  martial_chivalry.6003.desc_ugly:0 ""Ồ... ngươi... ta đã mong đợi một hiệp sĩ #EMP hào hoa#!..."\n\n[dummy_attracted_gender.GetSheHe|U] che mũi [dummy_attracted_gender.GetHerHis] bằng một chiếc khăn tay trắng.\n\n"Nhưng ta đoán ngươi sẽ làm được. Ngươi có thể đưa ta về lâu đài không?""
  martial_chivalry.6003.desc_pretty:0 ""À, hiệp sĩ dũng cảm, cuối cùng chàng cũng đến giải cứu ta sao? Chàng có thể tử tế đưa ta về lâu đài không?"\n\nGiọng [dummy_attracted_gender.GetHerHis|U] thật êm dịu, cử chỉ [dummy_attracted_gender.GetHerHis] thật nhẹ nhõm."
