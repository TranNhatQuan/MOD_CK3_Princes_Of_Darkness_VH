l_english:
 #You visit some baronies or go partying, by Ewan Cowhig Croft
  martial_authority.5000.t:0 "Chuyến Thăm Vùng Hẻo Lánh"
  martial_authority.5000.authoritative_religion.desc:1 "Ta xoa thái dương đau nhức khi một viên chức đọc cho Ta thông điệp thứ mười lăm từ [baron_1_lands.GetNameNoTier] trong năm nay. Nhiều lãnh địa quan trọng đã thấy quyền kiểm soát của Ta suy yếu trong vài tháng gần đây...\n\nMột chuyến thăm nhỏ đến những vùng đất hẻo lánh này, như bổn phận của Ta, có thể củng cố quyền lực của Ta. Mặt khác, [party_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] đã mời Ta dự một bữa tiệc riêng..."
  martial_authority.5000.relaxed_religion.desc:0 "Ta xoa thái dương đau nhức khi một viên chức đọc cho Ta thông điệp thứ mười lăm từ [baron_1_lands.GetNameNoTier] trong năm nay. Một vài lãnh địa quan trọng đã thấy quyền lực của Ta suy giảm, nhưng một chuyến thăm nhỏ đến những vùng đất xa xôi này có thể củng cố quyền kiểm soát của Ta.\n\nMặt khác, [party_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] đã mời Ta dự một bữa tiệc riêng..."
  martial_authority.5000.a:0 "Một [ROOT.Char.GetTitleAsNameNoTooltip] tốt luôn thỉnh thoảng ghé thăm những kẻ dưới quyền [ROOT.Char.GetHerHis]."
  martial_authority.5000.b:0 "Ta #EMP bắt buộc#! phải đi dự bữa tiệc đó!"
  martial_authority.5000.a.characters_baron_final_list:0 "[baron_1.GetShortUIName|U], [baron_2.GetShortUIName], và [baron_3.GetShortUIName]"
  martial_authority.5000.a.land_baron_final_list:0 "[baron_1_lands.GetNameNoTier], [baron_2_lands.GetNameNoTier], và [baron_3_lands.GetNameNoTier]"
  authority_central_control_modifier:0 "Giám sát Phong Kiến Toàn Diện"

 #Your young heir terrorizes your vassals
  martial_authority.8000.t:0 "Giải Đấu Cơn Thịnh Nộ"
  martial_authority.8000.desc:0 "Tên [marshal.GetCouncilTitle] của ta đang tổ chức một giải đấu mà ta cảm tưởng như là lần thứ trăm trong năm, và ta phải gồng mình để giữ tỉnh táo. Tâm trí ta chợt bừng tỉnh khi cảm thấy có ai đó kéo tay áo.\n\n[fighting_child.Custom('GetDaughterSon')] nhỏ [fighting_child.GetName] của ta, bất chấp mọi nghịch lý của tự nhiên, đang loạng choạng mang một cây thương lớn gấp bốn lần cơ thể [fighting_child.GetHerHis], và tìm được một chiếc mũ trụ không vừa vặn cứ liên tục trượt xuống che mất đôi mắt [fighting_child.GetHerHis].\n\n"[ROOT.Char.GetMotherFather|U], con có thể tham gia đấu một hiệp không?""
  martial_authority.8000.a:0 "Ta cho phép, nhưng ra lệnh không ai được làm hại [fighting_child.GetHerHim]."
  martial_authority.8000.tt:0 "[fighting_child.GetName] tiến bước trong giải đấu"
  martial_authority.8000.a.tt:0 "[fighting_child.GetSheHe|U] có thể tự mình chứng minh bản thân [fighting_child.GetHerselfHimself]"
  martial_authority.8000.tt.failure:0 "[fighting_child.GetName] thất bại trong việc chứng tỏ bản thân [fighting_child.GetHerselfHimself]"
  martial_authority.8000.b:0 ""Tất nhiên rồi, con ơi! Không chiến binh nào được kìm chế cơn thịnh nộ của [fighting_child.GetHerHis]!""
  martial_authority.8000.c:0 ""Hãy ngoan và đi chơi với ngựa đi.""
  martial_authority.8000.d:0 ""Đây không phải nơi dành cho một [fighting_child.Custom('GirlBoy')] trẻ tuổi.""
  martial_authority_child_trait_gain:0 "[fighting_child.GetName] nhận được một đặc điểm"
  martial_authority_brave:0 "$trait_brave$"
  martial_authority_arrogant:0 "$trait_arrogant$"
  martial_authority_wrathful:0 "$trait_wrathful$"
  martial_authority_one_eyed_child_title:0 "$trait_one_eyed$!"
  martial_authority_one_eyed_child:0 "[fighting_child.GetNameNoTooltip] mất một mắt trong giải đấu."
  martial_authority_disfigured_child_title:0 "$trait_disfigured$!"
  martial_authority_disfigured_child:0 "[fighting_child.GetNameNoTooltip] bị biến dạng sau chấn thương trong giải đấu."
  martial_authority_unremarkable_child_title:0 "Con Ngài bình thường!"
  martial_authority.8000_injury: "[fighting_child.GetName] bị thương"
  martial_authority_unremarkable_child:0 "[fighting_child.GetNameNoTooltip] chứng tỏ bản thân [fighting_child.GetHerselfHimself] hoàn toàn nhạt nhòa trong giải đấu."
  martial_authority.8100.desc:0 "Những chiến binh trong cuộc hỗn chiến nhảy múa một cách lúng túng xung quanh [fighting_child.GetName], rõ ràng là sợ làm tổn thương [fighting_child.GetHerHim]. Tuy nhiên, [fighting_child.GetSheHe] đáp trả bằng những đòn đánh bẩn, phớt lờ mọi quy định của giải đấu.\n\nTa quan sát khi [fighting_child.GetSheHe] đâm thẳng cán thương dài mười bốn feet xuyên qua phía sau hộp sọ [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] [murdered_knight.GetNamePossessive] của ta. Các chiến binh tiếp tục chỉ tung những đòn đánh lấy lệ vào [fighting_child.GetHerHim], trong khi [fighting_child.GetSheHe] đâm xuyên qua não của một đối thủ khác.\n\n"Dừng việc này lại đi, [ROOT.Char.GetLadyLord|U] của ta!" [marshal.GetTitledFirstName] van xin."
  martial_authority.8100.a:0 "Có vẻ chúng ta đã có người chiến thắng!"
  martial_authority.8100.c:0 "Lạy [ROOT.GetCharacter.GetFaith.HighGodName], [fighting_child.GetNameNoTooltip]! Xin lỗi về [fighting_child.GetHerHim]."

 #Innovating with weaponry
  martial_authority.4000.t:0 "Dụng Cụ Gỉ Sét"
  martial_authority.4000.desc:0 "Nhìn qua bụi mờ trong kho vũ khí, mắt Ta dừng lại trên nhiều loại vũ khí khác nhau. Một đôi giáp ống da sờn, một thanh kiếm vừa mài, một cái giáo cán cũ, và một... #EMP dụng cụ nông cụ gỉ sét?#!\n\nTa nhặt công cụ nông nghiệp lên; có lẽ nó vô tình bị lẫn với vũ khí? Ta cầm thử, kiểm tra lưỡi cong như liềm, rồi thử vung vào áo giáp gần đó.\n\nLưỡi xuyên qua áo giáp, làm rơi vài vòng sắt ra sàn.\n\n#EMP Thú vị.#!"
  martial_authority.4000.a:0 "Không biết có thể tận dụng làm vũ khí không nhỉ?"
  martial_authority.4000.b:0 "Thôi đủ rồi."
  martial_authority.4000.a.tt:0 "Ngài tìm cách biến dụng cụ này thành vũ khí."
  martial_authority.4000.b.tt:0 "Ngài tìm cách khác để rèn kỹ năng chiến đấu."

  martial_authority.4001.t:0 "Dụng Cụ Gỉ Sét: Lựa Chọn, Lựa Chọn..."
  martial_authority.4001.desc:0 "Mang lưỡi nhỏ ra ngoài nắng, Ta kiểm tra kỹ hơn. Lưỡi nhọn ở một đầu và nối vào cán ở đầu kia, giữa là một thanh sắt hơi gỉ — nhưng vẫn sắc.\n\nChỗ cong ở đầu lưỡi tạo hình dáng hiểm. Có thể dùng để cắt bụi rậm, hay tìm khe hở trong giáp?\n\nRõ ràng có thể tận dụng làm vũ khí chiến tranh, nhưng câu hỏi là nó sẽ biến hình như thế nào..."
  martial_authority.4001.a:0 "Nếu thẳng lưỡi, có thể thành dao găm hữu dụng..."
  martial_authority.4001.a.tt:0 "Ngài cố gắng chế tạo công cụ thành dao ngắn."
  martial_authority.4001.b:0 "Có thể gắn vào đầu giáo?"
  martial_authority.4001.b.tt:0 "Ngài trở vào trong, tìm một sợi dây..."
  martial_authority.4001.c:0 "Tại sao không để nguyên?"
  martial_authority.4001.c.tt:0 "Có lẽ nó vẫn hiệu quả mà không cần thay đổi?"
  martial_authority.4001.b.failure:0 "Ngài làm hỏng dụng cụ!"
  martial_authority_4001.dagger.tt:0 "Ngài chế tạo một con dao thô từ dụng cụ."
  martial_authority_4001.halberd.tt:0 "Ngài đã chế tác một cây trường rìu thô sơ từ dụng cụ này."
  martial_authority_4001.billhook.tt:0 "Ngài mài sắc lưỡi liềm."
  martial_authority_4001.fail.tt:0 "Ngài không thể chế tạo được bất cứ thứ gì hữu dụng từ công cụ này."

  martial_authority.4002.t:0 "Dụng Cụ Gỉ Sét: Lưỡi Chế Tạo Tạm Thời"
  martial_authority.4002.desc:0 "Với tư cách [ROOT.Char.GetLadyLord|U], Ta không rành việc chỉnh sửa vũ khí. Dù hăng say, Ta nhanh chóng nhận ra cần hướng dẫn chuyên gia.\n\nTa gọi thợ rèn [blacksmith.GetFirstName] — có vẻ hơi mệt mỏi — và sau một ngày mài giũa, công việc hoàn tất.\n\nLưỡi cong đã thẳng lại, điểm nhọn được rút gọn, rãnh vát chạy dọc lưỡi. Nó không đẹp: nhưng là vũ khí."
  martial_authority.4002.a:0 "Hoàn hảo!"
  martial_authority.4002.b:0 "Còn tốt hơn cả của Ta!"
  martial_authority_4002.make.tt:0 "Ngài nhận được [improvised_dagger.GetName]"

  martial_authority.4003.t:0 "Dụng Cụ Gỉ Sét: Thương Chế Tạo Tạm Thời"
  martial_authority.4003.desc:0 "Kẹp cây giáo vào giữa chân và bàn, Ta buộc dụng cụ nông nghiệp vào đầu giáo bằng dây thô. Ban đầu lưỡi rung lắc, nhưng ngày hôm sau dùng da luộc từ thợ thuộc [blacksmith.GetFirstName] hoàn thiện.\n\nVũ khí trông thô, nhưng cây giáo dài giúp tấn công từ xa, còn lưỡi cong có thể kéo kẻ địch khỏi ngựa hoặc chọc vào kẽ giáp.\n\nVũ khí thô sơ nhưng cảm giác sẽ #EMP khá#! hiệu quả..."
  martial_authority.4003.a:0 "Xem bộ giáp của ngươi chống được không!"
  martial_authority.4003.b:0 "Còn tốt hơn cả của Ta!"
  martial_authority_4003.make.tt:0 "Ngài nhận được [improvised_halberd.GetName]"

  martial_authority.4004.t:0 "Dụng Cụ Gỉ Sét: Hoàn Hảo Như Nó Đang Là"
  martial_authority.4004.desc:0 "Dụng cụ này — thứ mà thợ rèn [blacksmith.GetFirstName] của lãnh địa giải thích với ta là 'billhook' (liềm cán dài), khi ta hào hứng giám sát [blacksmith.GetHerHim] mài sắc nó — chắc chắn trông rất ra dáng một vũ khí chiến tranh.\n\nLưỡi kiếm nhô ra khỏi chuôi với một cạnh sắc bén, chạy lên và xuyên qua cái đầu móc nặng nề. Mũi kiếm vừa được mài sắc lóe lên dưới ánh mặt trời buổi trưa khi ta đưa nó vào đường may của một bộ giáp da luộc đã cũ trước khi giật mạnh về phía mình, cắt đứt các vòng đai chỉ trong một cú vung."
  martial_authority.4004.a:0 "Nông dân khiêm tốn của chúng ta còn ẩn giấu bao điều bí mật?"
  martial_authority.4004.b:0 "Ta thích chúng; phân phát trong toàn vương quốc!"
  martial_authority_4004.make.tt:0 "Ngài nhận được [improvised_billhook.GetName]"
