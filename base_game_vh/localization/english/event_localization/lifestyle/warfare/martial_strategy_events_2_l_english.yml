l_english:
 #You deal with a bumper harvest, reinvesting it in your gut or your defences, by Ewan Cowhig Croft
  martial_strategy.4000.t:0 "Tích Trữ Lương Thực"
  martial_strategy.4000.desc:0 "Với một tiếng ợ thật to, ta đẩy nốt phần thức ăn còn lại ra xa, rồi ngả người ra ghế. Dạo gần đây, bếp của ta đã chất đầy hạt vàng và thú săn mới, khiến tất cả triều thần ta trông đầy đặn và sung sức.\n\nTa cau mày. Dù mùa màng bội thu thật tuyệt, nó không thể kéo dài mãi. Ta phải quyết định xử lý số thực phẩm dư thừa này ra sao."
  martial_strategy.4000.a:0 "Muối hoặc hun khói, miễn là ta cất trữ được."
  martial_strategy.4000.b:0 "Ta và khách sẽ dùng bữa thật sang trọng!"
  martial_strategy.4000.c:0 "Ngay cả đầy tớ cũng sẽ ăn như vị [ROOT.Char.GetTitleAsNameNoTooltip] của họ!"
  martial_strategy.4000.d:0 "Vâng, họ #EMP đúng là#! trông thật mũm mĩm..."
  strategy_stocked_larders_modifier:0 "Kho Lương Thực Dồi Dào"
  strategy_emptied_larders_modifier:0 "Kho Lương Thực Gần Trống"
  strategy_fed_peasants_larders_modifier:0 "Bánh Cho Dân"
  strategy_human_meat_larders_modifier:0 "Kho Thịt Thông Thường"
  strategy_entirely_unrelated_disappearances_modifier:0 "Những Mất Tích Hoàn Toàn Không Liên Quan"
 #You rebuild the walls of a lesser domain county, or let them crumble.
  martial_strategy.4010.t:0 "Tường Thành [crumbling_holding.GetNameNoTierNoTooltip]"
  martial_strategy.4010.desc:0 "Đoàn đại biểu từ [crumbling_holding.GetNameNoTierNoTooltip] từ từ rời khỏi phòng riêng của ta, sau buổi họp dài cuối cùng cũng kết thúc. Họ cầu xin tiền để sửa chữa bức tường đang đổ nát của lãnh địa, viện dẫn nghĩa vụ của ta như chúa tể để giúp họ với những gì họ chưa tự huy động được. Ta gõ ngón tay trên bàn, suy nghĩ xem có nên giúp họ với phần kinh phí còn lại hay không. Phòng thủ tốt thật sự rất tốn kém.\n\nDĩ nhiên, nếu tường sắp sụp đổ, ta luôn có thể chuyển ngân sách đó cho mục đích cá nhân..."
  martial_strategy.4010.a:0 "Ta có bổn phận chăm lo cho thần dân."
  martial_strategy.4010.b:0 "Ta sẽ trực tiếp giám sát việc xây dựng lại."
  martial_strategy.4010.c:0 "#EMP Ta#! quyết định #EMP tiền của ta#! được sử dụng ra sao, và [crumbling_holding.GetNameNoTierNoTooltip] không phải ưu tiên!"
  martial_strategy.4010.b.tt_crit_success:1 "Ngươi đã nâng cấp tường của [crumbling_holding.GetNameNoTierNoTooltip] một cách tuyệt vời"
  martial_strategy.4010.b.tt_success:1 "Ngươi đã xây lại tường của [crumbling_holding.GetNameNoTierNoTooltip] thành công"
  martial_strategy.4010.b.tt_botch:1 "Ngươi hoàn toàn phá hỏng việc xây dựng"
  strategy_paid_for_walls_modifier:0 "Tường Xây Lại Chuẩn Chuyên Gia"
  strategy_let_walls_crumble_modifier:0 "Tường Sụp Đổ"
  strategy_botched_supervised_walls_modifier:0 "Tường Xây Lại Thảm Họa"
  strategy_successfully_supervised_walls_modifier:0 "Tường Xây Lại Tinh Xảo"
  martial_strategy.4010.d:0 "$royal_architect_court_position$ của ta sẽ giám sát việc xây dựng lại."
  martial_strategy.4010.d.tt_crit_success:0 "$royal_architect_court_position$ của ngươi nâng cấp tường [crumbling_holding.GetNameNoTierNoTooltip] một cách tuyệt vời"
  martial_strategy.4010.d.tt_success:0 "$royal_architect_court_position$ của ngươi xây lại tường [crumbling_holding.GetNameNoTierNoTooltip] thành công"
  martial_strategy.4010.d.tt_botch:0 "$royal_architect_court_position$ của ngươi hoàn toàn phá hỏng việc xây dựng"

# Tactics?
# By Isabella Welch

  martial_strategy.7000.t:0 "Chiến Thuật?"
  martial_strategy.7000.desc_opening:0 "Trong lúc ta đang tập luyện"
  martial_strategy.7000.desc_elephantry:0 "voi chiến"
  martial_strategy.7000.desc_cavalry:0 "kỵ binh hạng nặng"
  martial_strategy.7000.desc_middle:0 " [worried_knight.GetTitledFirstName] tiến đến khi ta ngồi trên chiến mã. [worried_knight.GetSheHe|U] né ánh mắt ta và nhìn xuống đất. Sau nhiều do dự, [worried_knight.GetSheHe] lên tiếng:\n\n'Vị [ROOT.Char.GetLadyLord|U] của ta, tất cả những gì chúng ta luôn làm với"
  martial_strategy.7000.desc_war_elephant:0 "voi chiến"
  martial_strategy.7000.desc_armored_horse:0 "ngựa bọc giáp"
  martial_strategy.7000.desc_cont:0 "là lao thẳng vào kẻ thù theo một đường thẳng. Chẳng phải đã đến lúc thử một phương pháp khác sao?'"
  martial_strategy.7000.a:0 "Ha! Hay lắm, [worried_knight.GetTitledFirstNameNoTooltip]!"
  martial_strategy.7000.b:0 "Ngốc! Đó là cách [ROOT.Char.GetCulture.GetNameNoTooltip] lao thẳng vào kẻ thù!"
  martial_strategy.7000.c:0 "Ngốc! Ngươi từng thử điều khiển voi chiến chưa?"
  martial_strategy.7000.d:0 "Ngốc! Không có chiến thuật nào tốt hơn thế."
  martial_strategy.7000.e:0 "Có lẽ ngươi đúng phần nào..."
  martial_strategy.7000.f:0 "Nếu ta dẫm lên ngươi, ngươi sẽ thấy nó hiệu quả thế nào."
