l_english:
 # Mercenaries are being assholes at an inn, by Linnéa Thimrén
  martial_authority.1031.t:0 "Lòng Nhân Từ Cho Lính Đánh Thuê"
  martial_authority.1031.desc:0 "Tiếng ồn ào trong quán trọ, một ly [ROOT.Char.Custom('RegionalAlcoholicDrink')] thơm ngon, một buổi tối yên bình sau một ngày tập luyện dài… Ly rượu trong tay Ta bị một lính đánh thuê, đang choáng sau cú đánh, đẩy rơi, và mọi hy vọng nghỉ ngơi tan biến xuống sàn cùng rượu.\n\n"Xin hãy, [ROOT.Char.Custom('FormOfAddressForLiege')]." Chủ quán van nài, "[scoped_mercenary.GetFirstNamePossessive] bọn côn đồ này uống sạch Ta mà không trả tiền nhiều ngày rồi! Và chúng đánh nhau khiến nhân viên và khách sợ hãi!""
  martial_authority.1031.a:0 "Ta sẽ trả tiền đồ uống cho các ngươi nếu các ngươi rời đi ngay lập tức."
  martial_authority.1031.b:0 "Binh sĩ, đuổi bọn chúng ra ngoài!"
  martial_authority.1031.c:0 "Chúng say quá, không đủ khả năng đe dọa, mọi việc sẽ kết thúc nhanh thôi."

 # Fight between my soldiers (Diplomacy skill challenge), Sean Hughes
  martial_authority.2040.t:0 "Tranh Cãi Trong Doanh Trại"
  martial_authority.2040.desc:2 "Sau khi quân Ta dựng trại, Ta nghe thấy ồn ào từ nơi ở của $knight_culture_player_plural_possessive_no_tooltip_lowercase$.\n\nĐi kiểm tra, Ta thấy [first.GetTitledFirstName] và [second.GetTitledFirstName] đang tranh cãi dữ dội, trong khi vài người xúi giục."
  martial_authority.2040.a:0 "Thuyết phục đám đông về sự đoàn kết."
  martial_authority.2040.a.success:0 "Lời Ta đã kéo mọi người ra khỏi cuộc ẩu đả"
  martial_authority.2040.a.failure:0 "Lời Ta không ảnh hưởng đến cuộc tranh cãi"
  martial_authority.2040.a.failure.tt:0 "Cuộc chiến leo thang khi khán giả tham gia!"
  martial_authority.2040.b:0 "Cho họ bị đánh đòn vì hành vi xấu!"
  martial_authority.2040.c:1 "Thôi kệ, Ta về lều nhét tai mình..."
  martial_authority.2040.c.drunkard:0 "Thôi kệ, Ta về lều uống một ly..."
  martial_authority.2040.c.hashishiyah:0 "Thôi kệ, Ta đi hút cần sa."

  martial_authority.2041.t:0 "Giải Quyết"
  martial_authority.2041.desc:0 "Ta đứng dậy và đọc một bài diễn văn về việc chúng ta đều đang chiến đấu vì [ROOT.Char.GetPrimaryTitle.GetName] và cách chúng ta phải đoàn kết chống lại kẻ thù, vì nếu không, có rất nhiều kẻ ngoài cuộc sẽ lợi dụng những cuộc tranh cãi nội bộ của chúng ta để chiếm lấy đất đai và áp đặt luật lệ của chúng lên chúng ta.\n\nTrông có vẻ bối rối, [first.GetTitledFirstName] và [second.GetTitledFirstName] xin lỗi và chuẩn bị ổn định chỗ nghỉ cho đêm nay."
  martial_authority.2041.a:0 "Chúng ta mạnh hơn khi đoàn kết."

  martial_authority.2042.t:0 "Đánh Lộn"
  martial_authority.2042.desc:0 "Lời Ta van xin bỏ qua khác biệt bị phớt lờ khi cuộc tranh cãi biến thành ẩu đả toàn diện.\n\nĐồ ăn, đồ uống bay khắp nơi khi mọi người ném bất cứ thứ gì gần tay."
  martial_authority.2042.a:0 "Tham gia luôn đi!"
  martial_authority.2042.a.success:0 "Ta là người chiến thắng duy nhất trong trận ẩu đả"
  martial_authority.2042.a.failure:0 "Ta bị thương trong trận ẩu đả"
  martial_authority.2042.b:0 "Thật hỗn loạn..."

  martial_authority.2050.t:0 "Một Trợ Thủ"
  martial_authority.2050.desc.opening:0 "Dù Ta là [ROOT.Char.GetTitleAsNameNoTooltip], Ta không thể ở khắp nơi trong [ROOT.Char.Custom('GetRealmOrDomicile')|l]. Luôn có người 'quên' tuân lệnh khi Ta không chú ý.\n\nĐây là lúc [right_hand_person.Custom2('MyCharacterIntroduction', ROOT.Char)] có thể giúp, người trung thành thực thi các sắc lệnh của Ta"
  martial_authority.2050.desc.vassal:0 "trong lãnh địa của [right_hand_person.GetHerHis]."
  martial_authority.2050.desc.knight:0 "khi đi thăm các vùng quê."
  martial_authority.2050.desc.courtier:0 "trong [ROOT.Char.Custom('GetCourt')|l]."
  martial_authority.2050.desc.ending:0 "[right_hand_person.GetSheHe|U] có thể đóng vai trò là cánh tay phải [right_hand_person.GetWomanMan] của ta và đảm nhận vai trò chủ động hơn trong việc quản lý [ROOT.Char.Custom('GetRealmOrDomicile')|l] của ta không?"
  martial_authority.2050.a:0 "Đúng, [right_hand_person.GetSheHe] sẽ phục vụ Ta tốt!"
  martial_authority.2050.a.tt:1 "Ngài sẽ dành nhiều thời gian hơn với [right_hand_person.GetShortUIName]"
  martial_authority.2050.b:1 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('marshal'))] [marshal.GetFirstNameNoTooltip] của ta có thể xử lý những vấn đề đó."
  martial_authority.2050.c:0 "Ta có thể tự xử mọi việc nếu làm chăm chỉ hơn!"
  martial_authority.2050.toast.title:0 "[right_hand_person.GetShortUIName] hiện đang phục vụ với tư cách là cánh tay phải [right_hand_person.GetWomanMan] của ngươi"

  martial_authority.2051.t:0 "Một Trợ Thủ"
  martial_authority.2051.desc:0 "Trong quá trình giúp ta quản lý [ROOT.Char.Custom('GetRealmOrDomicile')] với tư cách là cánh tay phải [right_hand_person.GetWomanMan], [right_hand_person.GetTitledFirstName] và ta đã phát hiện ra rằng chúng ta có rất nhiều điểm chung!\n\nChúng ta đã xây dựng được một mối quan hệ bền chặt trong thời gian làm việc cùng nhau, và ta thấy mình tự hỏi tương lai sẽ dành cho chúng ta điều gì..."
  martial_authority.2051.a:0 "Chúng ta sẽ trở thành Bạn Tốt!"
  martial_authority.2051.b:0 "Có phải đây là tia lửa cho điều gì đó hơn?"
  martial_authority.2051.c:0 "Chúng ta phải giữ mối quan hệ chuyên nghiệp."

  martial_authority.2052.message:0 "Ta đã bỏ tù cánh tay phải [right_hand_person.GetWomanMan] của ta"
  martial_authority.2053.toast:0 "Cánh tay phải [right_hand_person.GetWomanMan] của ta đã bị [imprisoner.Custom2('MyCharacterIntroduction', ROOT.Char)] bỏ tù, và không thể phục vụ ta trừ khi được giải thoát."
  martial_authority.2054.toast:1 "Cánh tay phải [right_hand_person.GetWomanMan] của ta quay lại phục vụ"
  martial_authority.2054.toast.no_return:1 "Cánh tay phải [right_hand_person.GetWomanMan] của ta không quay lại phục vụ"
  martial_authority.2055.message:0 "Cánh tay phải [right_hand_person.GetWomanMan] của ta đã rời bỏ dịch vụ"
  martial_authority.2055.message.incapable:0 "Cánh tay phải [right_hand_person.GetWomanMan] của ta đã trở nên tàn phế"
  martial_authority.2056.message:1 "Cánh tay phải [ROOT.Char.GetWomanMan|U] của ta đã chết"
  martial_authority.2056.message.death:0 "Ta đã giết cánh tay phải [right_hand_person.GetWomanMan] của mình"

 # Soldier and Officer Fighting, by Mathilda Bjarnehed
  martial_authority_special.1100.t:0 "Ẩn Danh"
  martial_authority_special.1100.start.desc:0 "Tối nay, Ta gỡ bỏ mọi biểu tượng cấp bậc để đi giữa lính mình một cách vô danh. Buổi tối yên tĩnh, nên khi tranh cãi nổ ra, lời nói vang đến tai Ta rõ ràng.\n\n"
  martial_authority_special.1100.heavy_infantry.desc:0 "Một binh lính bộ binh"
  martial_authority_special.1100.cavalry.desc:0 "Một kỵ sĩ"
  martial_authority_special.1100.archer.desc:0 "Một cung thủ"
  martial_authority_special.1100.skirmisher.desc:0 "Một lính quấy"
  martial_authority_special.1100.pikemen.desc:0 "Một lính giáo"
  martial_authority_special.1100.end.desc:0 "đang cố gắng thuyết phục chỉ huy [soldier_friend.GetHerHis], [officer.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], về những ưu điểm của một chiến thuật thay thế. [officer.GetFirstNameNoTooltip] sẽ không nghe bất cứ điều gì về nó — khi ta đến gần, người chỉ huy [officer.GetWomanMan] tức giận giơ nắm đấm [officer.GetHerHis] lên..."
  martial_authority_special.1100.a:0 "Bước vào bảo vệ binh lính."
  martial_authority_special.1100.a.success.tt:1 "Ngài đánh bại sĩ quan trong tay không"
  martial_authority_special.1100.a.failure.tt:0 "Sĩ quan đánh bại Ngài trong tay không"
  martial_authority_special.1100.b:0 "Hòa giải giữa [officer.GetFirstNameNoTooltip] và binh lính."
  martial_authority_special.1100.b.success.tt:1 "Ngài thuyết phục được [officer.GetShortUINameNoTooltip]"
  martial_authority_special.1100.b.failure.tt:1 "[officer.GetShortUINameNoTooltip] quát mắng Ngài"
  martial_authority_special.1100.c:0 "Làm gương cho họ."
  martial_authority_special.1100.d:0 "Lén đi và nhận công lao ý tưởng của binh lính."

  martial_authority_special.1101.desc:0 "Huấn luyện của Ta phát huy hiệu quả. Vài khoảnh khắc sau, Ta khóa chặt [officer.GetTitledFirstName] trong cánh tay. "Hãy coi đây là bài học," Ta nói to, để mọi người nghe. "Người [ROOT.Char.GetTitleTierName] không ưa kẻ bảo thủ. Dù cấp bậc nào."

  martial_authority_special.1101.end.desc:0 "\n\nNgười lính bừng sáng sự biết ơn. "Cảm ơn, [ROOT.Char.Custom('FormOfAddressForLiege')]. Ngài sẽ không bao giờ biết được một người đầy tớ trung thành hơn [soldier_friend.GetFullNameNoTooltip].""
  martial_authority_special.1101.a:0 "Áp dụng chiến lược của [soldier_friend.GetFirstNamePossessiveNoTooltip]."
  martial_authority_special.1101.b:0 "Thảo luận chiến lược để học thêm về chiến tranh."
 
  martial_authority_special.1102.desc:0 "Biết hậu quả khi làm hại chỉ huy, binh lính không tự bảo vệ [soldier_friend.GetHerselfHimself] khỏi đòn đánh. Khi máu chảy, Ta lao vào giữa.\n\nLẽ ra Ta không nên ẩu đả với chiến binh kỳ cựu. Cuối cùng, Ta phải tiết lộ danh tính để [officer.GetTitledFirstName] tha Ta. Ta lẻn về lều trước khi tin tức lan ra..."
  martial_authority_special.1102.a:0 "Ít ra Ta cũng học được vài mẹo."

  martial_authority_special.1103.desc:0 "Cánh tay [officer.GetTitledFirstNamePossessive] dừng giữa đòn khi Ta nói to. Cường độ cảm xúc dường như chạm tới trái tim — nét mặt [officer.GetHerHis] mềm lại, xấu hổ. [officer.GetSheHe|U] lắp bắp xin lỗi và chạy đi."

 # Deal with Deserters, by Linnéa Thimrén
  martial_authority_special.1501.t: "Kẻ Đào Ngũ"
  martial_authority_special.1501.desc: "Ta tuần tra [ravaged_place.GetName], đánh giá thiệt hại gần đây. [deserting_soldier.GetTitledFirstName] chặn Ta:\n\n"Ta nhớ đúng chỗ này."
  martial_authority_special.1501.desc_battle: "Nó bị tàn phá trong một trận chiến gần đây!"
  martial_authority_special.1501.desc_raid: "Nó bị cướp bóc và tàn phá!"
  martial_authority_special.1501.desc_outro: "Ta chứng kiến cảnh kinh hoàng, tiếng la hét, máu… lửa." [deserting_soldier.GetHerHis|U] tái mặt, "T-Ta không thể ở đây nữa. Ta sẽ không!"
  martial_authority_special.1501.a: ""Ta cũng vậy, nhưng chúng ta phải chịu đựng.""
  martial_authority_special.1501.a_tt: "Ngài kể [deserting_soldier.GetFirstNameNoTooltip] về trải nghiệm tương tự và cảm giác của Ngài"
  martial_authority_special.1501.a.success: "[deserting_soldier.GetFirstName] bình tĩnh lại"
  martial_authority_special.1501.a.failure: "Ảo tưởng của [deserting_soldier.GetFirstNamePossessive] lan ra"
  martial_authority_special.1501.b: "Chuyện này sẽ không xảy ra lần nữa."
  martial_authority_special.1501.c: ""Hãy tỉnh lại!""

  martial_authority_special.3000.t:0 "Minh Chứng Lãnh Đạo"
  martial_authority_special.3000.desc:0 "[martial_authority_friend.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] gần đây hay theo dõi các cuộc họp hội đồng của Ta. Biết [martial_authority_friend.GetHerHis] quan tâm đến lãnh đạo, Ta cảm thấy [martial_authority_friend.GetWomanMan] đang chờ xem Ta ấn tượng [martial_authority_friend.GetHerHim].\n\nTa có thể nói chuyện với [martial_authority_friend.GetHerHim]. Hoặc để [martial_authority_friend.GetHerHim] nhìn Ta tương tác với [ROOT.Char.Custom('WomenMenPeople_GenderPreference')] — ít nhất cũng #EMP giả vờ#! nhớ mặt mọi binh lính."
  martial_authority_special.3000.a:0 "Thảo luận về phương pháp giao tiếp."
  martial_authority_special.3000.b:0 "Chúng ta nên đi chào tân binh!"
  respected_figurehead:0 "Nhân Vật Có Uy Tín"
