l_english: 
  ep3_laamp_flavor_oltner.3001.t: "Trái Tim Người Theo"
  ep3_laamp_flavor_oltner.3001.desc: "\"[ROOT.Char.GetTitledFirstNameNoTooltip], [entourage_to_marry_2.Custom2('RelationToMeShort', SCOPE.sC('root_char'))] của ta, ta đã gặp một [marriage_material.Custom('RandomPositiveShallowAdjective')] [marriage_material.GetWomanMan] nhất ở đây tại [ROOT.Char.GetCurrentLocation.GetName]...\" [entourage_to_marry_2.GetFirstNameNicknamed], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('entourage_to_marry_2'))] của ta, vấp ngã khi [entourage_to_marry_2.GetSheHe] định hướng tới ta.\n\n\"Gia đình của [marriage_material.GetHerHis|U] sẽ không để chúng ta kết hôn nếu ta không trả một khoản hồi môn lớn!\" [entourage_to_marry_2.GetSheHe|U] ấp úng buồn bã. \"Làm ơn, hãy giúp ta.\""
  ep3_laamp_flavor_oltner.0001.a: "...nhân danh [ROOT.Char.GetFaith.HighGodName], [entourage_to_marry_2.GetWomanMan], ngươi giàu có — tự trả đi!"
  ep3_laamp_flavor_oltner.0001.b: "Tất nhiên Ta sẽ giúp!"
  ep3_laamp_flavor_oltner.0001.c: "Xem thử [marriage_material.GetSheHe] có sẵn sàng bỏ trốn cùng ngươi không..."
  ep3_laamp_flavor_oltner.0001.c.success: "[marriage_material.GetFirstName] gia nhập cùng ngươi"
  ep3_laamp_flavor_oltner.0001.c.failure: "[marriage_material.GetFirstName] không ấn tượng"
  ep3_laamp_flavor_oltner.0001.d: "Không phải vấn đề của Ta."
