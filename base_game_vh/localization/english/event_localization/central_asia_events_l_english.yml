l_english:
  central_asia.0001.t:0 "Thế Giới Trước Mắt Ta"
  central_asia.0001.desc:0 "Các thủ lĩnh bộ tộc đều biết vì sao họ được triệu tập. Chúng ta trải qua một đêm dài tách biệt trong lều cung điện, và họ triệu các pháp sư lẫn tướng lĩnh đến phát biểu trước mặt mình. Không có tranh luận nào cả. Ta bước ra khỏi lều khi những tia nắng đầu tiên của bình minh vượt qua đường chân trời, và toàn bộ đội quân đã tụ tập đều đã thức dậy, chờ đợi.\n\nHọ chào đón ta, biết rằng ta không chỉ đơn thuần là người cai trị của họ. Ta là người cai trị của cả vũ trụ — Thành Cát Tư Hãn."
  central_asia.0001.a:0 "Đây là nơi cuộc chinh phục của ta thực sự bắt đầu."
  central_asia.0001.mongol_invasion_cb:0 "Ta có thể sử dụng [mongol_invasion_casus_belli|E]"

  central_asia.0002.t:0 "Thành Cát Tư Hãn"
  central_asia.0002.desc:0 "Ta được lãnh chúa triệu tập đến Đại hội Kurultai, một buổi hội họp của mọi thủ lĩnh gia tộc và chư hầu trong vương quốc. Tất cả chúng ta đều biết lý do, và không hề có chút nghi ngờ nào trong các cuộc thảo luận thâu đêm suốt sáng được tổ chức trong túp lều bạt đầy khói. [genghis_khan.GetFullNameNoTooltip] là [genghis_khan.GetLadyLord] của vũ trụ — Thành Cát Tư Hãn (Genghis Khan).\n\nKhông có lễ đăng quang nào diễn ra, vì ai có thể phán xét [genghis_khan.GetHerHim]? Thay vào đó, [genghis_khan.GetSheHe] đã đưa ra tuyên ngôn trước các đạo quân [genghis_khan.GetHerHis] đang tập hợp.\n\n\"Hôm nay chúng ta lên đường và chinh phục tất cả những gì nằm dưới bầu trời rộng lớn!\""
  central_asia.0002.a:0 "Thế giới sẽ run sợ trước chúng ta!"

  central_asia.0003.desc:0 "Những sứ giả mang đến cho chúng ta tin tức về một kẻ cai trị mới trên thảo nguyên, kẻ tự xưng là \"Thành Cát Tư Hãn\", tự phong mình là người cai trị của vũ trụ. Một đoàn kỵ binh và chiến binh thống nhất đang tràn ra để khuất phục những ai từ chối quỳ gối.\n\nDĩ nhiên, những tuyên bố này thật lố bịch, nhưng tin tức cũng đã đến với chúng ta về sự sụp đổ của những thành phố vĩ đại trước một kẻ chinh phục tàn bạo..."
  central_asia.0003.a.distant:0 "Chuyện này rồi cũng sẽ sớm qua thôi."
  central_asia.0003.a.neighbor:0 "Chúng ta phải chuẩn bị. Khó khăn đang ở phía trước."

  central_asia.0011.t:0 "Cái Nôi Của Thảo Nguyên"
  central_asia.0011.desc:0 "Di sản của quá khứ không chỉ là một biểu tượng mạnh mẽ, mà còn là một sức mạnh dẫn dắt theo đúng nghĩa của nó. Như họ đã từng, những dân tộc rải rác trên mảnh đất này sẽ được thống nhất và dẫn dắt dưới ngọn cờ của Bactria. Ngọn cờ của ta.\n\nVới vó ngựa dồn dập và bước chân hành quân, tất cả những ai đi lại giữa Đông và Tây sẽ biết rằng chúng ta cai trị bầu trời rộng mở."
  central_asia.0011.a:0 "Chúng ta mang sức mạnh của nhiều dân tộc!"

  central_asia.0012.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('bactrian_emperor'))] của ta, [bactrian_emperor.GetTitledFirstName], đã tuyên bố chủ quyền đối với những vùng đất cổ xưa của Bactria, và dự định cai trị chúng như một thể thống nhất, giống như các vị vua thời cổ đại.\n\nĐối với những người lữ hành giữa Đông và Tây, vùng đất này có thể trông khắc nghiệt, nhưng chúng ta biết rằng nó thực sự tràn đầy sự sống."
  central_asia.0012.a:0 "Chúng ta mang sức mạnh của nhiều dân tộc!"

  central_asia.0013.desc:0 "[bactrian_emperor.GetFullName] đã tuyên bố chủ quyền đối với toàn bộ những vùng đất của Bactria cổ đại, và tự xưng [bactrian_emperor.GetHerselfHimself] là người cai trị hợp pháp duy nhất của nó. Tuy nhiên, kẻ ngốc dường như đã bỏ qua một chi tiết nhỏ. Một vài vùng đất mà [bactrian_emperor.GetSheHe] tuyên bố chủ quyền lại là của ta!"
  central_asia.0013.a:0 "[bactrian_emperor.GetSheHe|U] có thể lấy chúng từ đôi tay lạnh giá, đã chết của ta!"
