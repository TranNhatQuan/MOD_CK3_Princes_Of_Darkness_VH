l_english:

  birth.father_is_former_consort_toast:0 "Sinh Con"
  birth.father_is_former_consort_toast_tt:0 "[mother.GetTitledFirstName] đã sinh ra [child.Custom('GetDaughterSon')] của chúng ta"
  birth.father_is_former_consort_toast_tt_twins:0 "[mother.GetTitledFirstName] đã sinh đôi"
 
  msg_grandchild_born_toast_title: "Cháu Ra Đời"
  msg_grandchild_born_toast_desc_twins: "[mother.GetTitledFirstName] đã sinh đôi cháu của Ngài"
  msg_grandchild_born_toast_desc: "[mother.GetTitledFirstName] đã sinh ra cháu [child.Custom('GetDaughterSon')] của Ngài"
 
  msg_royal_child_born_toast_title: "Hậu Duệ Hoàng Gia"
  msg_royal_child_born_toast_desc_twins: "[non_royal_parent.GetTitledFirstName] đã sinh đôi hậu duệ của [ceremonial_house|E] ([child.GetHouse.GetBaseName])"
  msg_royal_child_born_toast_desc: "[non_royal_parent.GetTitledFirstName] đã sinh một [child.Custom('GetDaughterSon')] thuộc [ceremonial_house|E] ([child.GetHouse.GetBaseName])"
  msg_royal_child_born_toast_desc_twins_father: "[non_royal_parent.GetTitledFirstName] đã làm cha của cặp song sinh thuộc [ceremonial_house|E] ([child.GetHouse.GetBaseName])"
  msg_royal_child_born_toast_desc_father: "[non_royal_parent.GetTitledFirstName] đã làm cha của một [child.Custom('GetDaughterSon')] thuộc [ceremonial_house|E] ([child.GetHouse.GetBaseName])"

  birth.0002.t:0 "Tất Cả Những Đứa Con Của Ta"
  birth.0002.desc:0 "Với mỗi lần sinh nở, sự thân thiện dành cho ta lại tăng lên; khi ta bế đứa trẻ sơ sinh trong tay, ta được chào đón bằng nhiều sự ấm áp và tử tế hơn bao giờ hết. Có lẽ ta thật sự có một tập hợp con cái khá ấn tượng..."
  birth.0002.a:0 "Lòng tốt sinh ra từ sự chào đời!"

  birth.1001.t:0 "[child.Custom('GetDaughterSon')|U] Của Ta"
  birth.1001.heir.t:0 "[child.Custom('GetDaughterSon')|U] Và Người Thừa Kế Của Ta"
  birth.1001.daughters.t:0 "Những Người Con Gái Của Ta"
  birth.1001.sons.t:0 "Những Người Con Trai Của Ta"
  birth.1001.children.t:0 "Những Đứa Trẻ Của Ta"
  birth.1001.first_birth_good.desc:0 "Khi cơn co thắt đầu tiên bắt đầu, một sự bình tĩnh lớn lao bao trùm lấy ta. Không còn chỗ cho những lo lắng trước đó — ta sắp thực hiện một trong những phép màu vĩ đại nhất của cuộc đời. Sau một cuộc vật lộn dài nhưng huy hoàng, ta đã sinh ra"
  birth.1001.first_birth_scary.desc:0 "Ta đã nói chuyện với vô số bà mẹ và bà đỡ, ghi nhớ lời khuyên của họ. Thế nhưng khi đến lúc của mình, ta nhận ra rằng không có sự chuẩn bị nào là đủ.\n\nCơn đau bao trùm tất cả và ta lo sợ cho mạng sống của mình. Nhưng ta đã vượt qua, và giờ đây ta có"
  birth.1001.many_births.desc:0 "Với mỗi lần sinh nở, mọi thứ lại dễ dàng hơn một chút — nhưng ta vẫn luôn kinh ngạc trước cường độ của trải nghiệm và sức mạnh của chính mình. Một lần nữa, ta đã mang sự sống mới đến thế giới này, dưới hình hài của"
  birth.1001.not_first_birth.desc:0 "Sự nhẹ nhõm của ta thật lớn, và niềm vui còn lớn hơn nữa! Ta đã sinh ra"
  birth.1001.sondaughter.desc:0 "một [child.Custom('GetDaughterSon')] bé nhỏ hoàn hảo!\n\n"
  birth.1001.daughters.desc:0 "hai bé gái hoàn hảo!\n\n"
  birth.1001.sons.desc:0 "hai bé trai hoàn hảo!\n\n"
  birth.1001.children.desc:0 "hai đứa trẻ hoàn hảo!\n\n"
  birth.1001.same_gender_heir.desc:0 "Một ngày nào đó, con sẽ tiếp nối di sản của ta. Cái tên nào sẽ phù hợp với một [ROOT.Char.GetTitleAsNameNoTooltip]?"
  birth.1001.other_gender_heir.desc:0 "Một ngày nào đó, con sẽ tiếp nối di sản của ta. Cái tên nào sẽ phù hợp với một [child.GetLadyLord] hùng mạnh như vậy?"
  birth.1001.end_fallback.desc:0 "Con sẽ trở thành ai, hỡi con của ta, và ta nên gọi con là gì?"
  birth.1001.twins_heir.desc:0 "Những đứa con yêu dấu của ta. Một trong hai con sẽ lớn lên để tiếp nối di sản của ta, và người kia sẽ luôn ở trong cái bóng của [ROOT.Char.GetPlayerHeir.GetHerHis]. Ta hy vọng các con sẽ luôn yêu thương nhau, dù chuyện gì xảy ra."
  birth.1001.twins.desc:0 "Các con sẽ trở thành ai, những đứa con yêu, và ta nên gọi các con là gì?"
  birth.1001.taltos.desc:0 "Điềm báo khi sinh [child.Custom('GetBirthOmen')] mà [child.Custom('GetDaughterSon')] của ta mang theo rõ ràng đánh dấu [child.GetHerHim] là một [child.Custom('GetTaltosTerm')], được [child.GetFaith.PantheonTerm] chọn để phục vụ một sứ mệnh đặc biệt. Dù ta chưa biết sứ mệnh đó là gì, ta vẫn phải ban cho con mình một cái tên phù hợp."
  birth.1001.taltos_unfaithful.desc:0 "[child.Custom('GetDaughterSon')] của ta mang theo [child.Custom('GetBirthOmen')], điều mà các [child.GetFaith.GetAdjective] [child.Custom('DefaultPriestTitlePlural')] cho rằng đánh dấu [child.GetHerHim] cho một điều gì đó đặc biệt. Ta không hiểu rõ, nhưng ta vẫn phải quyết định một cái tên cho [child.Custom('GetDaughterSon')] của mình..."

  birth.1001.desc:0 "Ta đã sinh ra một [child.Custom('GetDaughterSon')] xinh đẹp!"
  birth.1001.desc.twin:0 "Ta đã sinh ra những [child.Custom('TwinDaughtersSonsChildren')] xinh đẹp!"
  birth.1001.desc.twin_dead_father:0 "Ta đã sinh ra những [child.Custom('TwinDaughtersSonsChildren')] xinh đẹp! [father.GetFirstName] hẳn đã rất yêu chúng..."
  birth.1001.desc_dead_father:0 "Ta đã sinh ra một [child.Custom('GetDaughterSon')] xinh đẹp! [father.GetFirstName] hẳn đã rất yêu nó..."
  birth.1001.a:0 "Mong con lớn lên mạnh mẽ và khôn ngoan, [child.Custom('GetDaughterSon')] của ta."
  birth.1001.b:0 "Mong các con lớn lên mạnh mẽ và khôn ngoan, [child.Custom('TwinDaughtersSonsChildren')]."

  birth.1002.opening:0 "Ta đã sinh ra một [child.Custom('GetDaughterSon')] nhỏ bé xinh đẹp. [child.GetSheHe|U] đến với thế giới này mà không hề hay biết về bí mật ta phải giữ."
  birth.1002.opening.twin:0 "Ta đã sinh ra hai [child.Custom('TwinDaughtersSonsChildren')] xinh đẹp. Chúng đến với thế giới này mà không hề hay biết về bí mật ta phải giữ."
  birth.1002.true_father:0 "Ta lo sợ điều gì sẽ xảy ra nếu ai đó phát hiện ra rằng [real_father.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] mới là cha thật sự."
  birth.1002.unmarried:0 "rằng cha của [child.GetHerHis] thực ra là [real_father.GetFullName]."
  birth.1002.unmarried.twin:0 "rằng cha của chúng thực ra là [real_father.GetFullName]."
  birth.1002.girl_name.desc:0 "\n\nÔi đứa trẻ bé nhỏ, ta nên đặt tên con là gì?"
  birth.1002.boy_name.desc:0 "\n\nMột phần trong ta muốn đặt tên con trai theo [real_father.GetFirstNameNoTooltip], nhưng ta sợ điều đó không khôn ngoan..."
  birth.1002.twin_name.desc:0 "\n\nÔi, các con của ta, ta nên đặt tên các con là gì?"
  birth.1002.a:0 "Ngoan nào, [child.Custom('GetDaughterSon')] của ta."
  birth.1002.b:0 "Hãy yên lặng nào, [child.Custom('TwinDaughtersSonsChildren')] của ta."
  birth.1002.a.tt:0 "Thế giới bên ngoài sẽ không biết gì về thân thế thật sự của [child.GetFirstNamePossessiveNoTooltip]"
  birth.1002.b.tt:0 "Thế giới bên ngoài sẽ không biết gì về thân thế thật sự của chúng."
  birth.1002.c:0 "Không biết giờ này [real_father.GetFirstNameNoTooltip] đang ở đâu..."

  birth.1003.loves_mother.desc:1 "Ôi, [mother.GetFirstName], nàng thật dũng cảm! Thật mạnh mẽ! Không lời nào có thể diễn tả tình yêu của ta dành cho nàng, và giờ đây chúng ta có"
  birth.1003.likes_mother.desc:0 "Với nụ cười mệt mỏi nhưng hạnh phúc, [mother.GetFirstName] trao cho ta"
  birth.1003.dislikes_mother.desc:1 "Ngợi ca [ROOT.Char.GetFaith.FertilityGodName], [mother.GetFirstNameNoTooltip] đã sinh ra"
  birth.1003.sondaughter.desc:0 "[child.Custom('GetDaughterSon')] bé nhỏ hoàn hảo!\n\n"
  birth.1003.daughters.desc:0 "những bé gái hoàn hảo!\n\n"
  birth.1003.sons.desc:0 "những bé trai hoàn hảo!\n\n"
  birth.1003.children.desc:0 "những đứa trẻ hoàn hảo!\n\n"
  birth.1003.a:0 "Mong con lớn lên mạnh mẽ và khôn ngoan, [child.Custom('GetDaughterSon')] của ta."
  birth.1003.b:0 "Mong con lớn lên mạnh mẽ và khôn ngoan!"

  birth.1005.t:0 "Không Cha"
  birth.1005.desc.twin:0 "Những đứa con xinh đẹp của ta đang nghỉ ngơi, không hề hay biết về cuộc đời đầy thử thách mà chúng đã được sinh ra. Thế giới không biết cha của chúng là ai, và có lẽ chính chúng cũng sẽ không bao giờ biết."
  birth.1005.desc:0 "[child.Custom('GetDaughterSon')] xinh đẹp của ta đang nghỉ ngơi, không hề hay biết về cuộc đời đầy thử thách mà [child.GetSheHe] vừa sinh ra phải đối mặt. Thế giới không biết cha của [child.GetHerHis] là ai, và bản thân [child.GetSheHe] có thể sẽ không bao giờ biết."
  birth.1005.a:0 "Đó là gánh nặng chúng ta phải mang."

  birth.1006.t:0 "Con Ngoài Giá Thú"
  birth.1006.opening:0 "Giờ đây ta không còn chút nghi ngờ nào nữa. [mother.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã sinh ra"
  birth.1006.desc.twin:0 "một cặp song sinh, và cả hai chúng ta đều biết ta là cha của chúng."
  birth.1006.desc:0 "một [child.Custom('GetDaughterSon')], và cả hai chúng ta đều biết ta là cha của [child.GetHerHis]."
  birth.1006.not_known:0 "\n\nMay mắn thay, [spouse_of_mother.Custom2('HerHisCharacterIntroduction', SCOPE.sC('mother'))] tin rằng đó là con của [spouse_of_mother.GetHerHis]."
  birth.1006.unmarried:0 "\n\nMay mắn thay, [mother.GetFirstNameNoTooltip] đã giữ im lặng về ta, và không ai khác biết sự thật, ít nhất là cho đến bây giờ..."
  birth.1006.a:0 "Ta phải cực kỳ cẩn thận với chuyện này."
  birth.1006.a.tt:1 "Ngài giữ Bí Mật này cho riêng mình"
  birth.1006.a.message_desc:0 "Cha Thật Đã Biết"
  birth.1006.a.mother_message:0 "[real_father.GetTitledFirstName] đã biết rằng [real_father.GetSheHe] mới là cha thật sự"
  birth.1006.b:0 "Cả thế giới sẽ biết về đứa con của ta!"
  birth.1006.bastard_explanation:0 "Ngài biết về sự ra đời của [child.GetFirstName], người mẹ là [mother.GetShortUIName] nhận được Bí Mật [secret.GetName]"

  birth.1010.t:0 "Đứa Con Mang Dòng Máu Của Ta"
  birth.1010.t_twins:0 "Những Đứa Con Mang Dòng Máu Của Ta"
  birth.1010.desc.twin:0 "[mother.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã sinh ra hai [child.Custom('TwinDaughtersSonsChildren')]!\n\nVì những đứa trẻ này là một phần của triều đại [ROOT.Char.GetDynasty.GetName], chúng nên được ban cho những cái tên xứng đáng."
  birth.1010.desc:0 "[mother.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã sinh ra một [child.Custom('GetDaughterSon')]!\n\nVì đứa trẻ này là một trái ngọt từ cây gia tộc [ROOT.Char.GetDynasty.GetName], [child.GetSheHe] nên được ban cho một cái tên xứng đáng với dòng dõi của [child.GetHerHis]."

  birth.1100.title:0 "[child.Custom('GetTaltosTerm')] Chào Đời"
  birth.1100.message:0 "Các [child.Custom('DefaultPriestTitlePlural')] đã xác định [child.Custom2('MyCharacterIntroduction', ROOT.Char)] là một [child.Custom('GetTaltosTerm')].\n\nĐược [child.GetFaith.PantheonTerm] lựa chọn cho một mục đích bí ẩn, tương lai của đứa trẻ này sẽ ra sao?"

  known_bastard_birth_event_tooltip:0 "[child.GetFirstNameNoTooltip] sẽ là một [bastard|E] của Gia Tộc [child.GetHouse.GetBaseName]"
  legitimized_known_bastard_birth_event_tooltip:0 "[child.GetFirstNameNoTooltip] sẽ là một [legitimized_bastard|E] của Gia Tộc [child.GetHouse.GetBaseName]"

  birth.2001.t:0 "Phước Lành Của Sự Không Biết"
  birth.2001.desc.mother.standard:0 "[child.Custom('GetDaughterSon')] mới sinh của ta ngủ thật ngọt ngào, không hề hay biết về lời nguyền sẽ đeo bám [child.GetHerHim] suốt phần đời còn lại. Làm một đứa con hoang không phải là điều dễ dàng trên thế giới này, làm mẹ của một đứa trẻ như vậy cũng vậy.\n\nNgay cả khi đứa trẻ đang ngủ say, ta vẫn không thể chợp mắt vì sự lựa chọn mà ta phải đưa ra."
  birth.2001.desc.mother.twins:0 "Những đứa con mới sinh của ta ngủ thật ngọt ngào, may mắn không hay biết về lời nguyền sẽ theo chúng suốt phần đời còn lại. Là con ngoài giá thú chưa bao giờ là điều dễ dàng trên thế giới này, cũng như làm mẹ của những đứa trẻ như vậy.\n\nNgay cả khi các con ta đang ngủ say, ta vẫn thao thức bởi lựa chọn mà mình phải đưa ra."
  birth.2001.desc.father.standard:0 "Ngoài hôn nhân, [mother.GetTitledFirstName] đã sinh ra [child.Custom('GetDaughterSon')] của chúng ta. Dù lẽ ra ta phải vui mừng, trái tim ta lại nặng trĩu bởi nghi ngờ và sợ hãi.\n\nVà nó sẽ vẫn như vậy cho đến khi ta đưa ra quyết định của mình."
  birth.2001.desc.father.twins:0 "Ngoài hôn nhân, [mother.GetTitledFirstName] đã sinh ra những đứa con của chúng ta. Dù lẽ ra ta phải vui mừng, trái tim ta lại nặng trĩu bởi nghi ngờ và sợ hãi.\n\nVà nó sẽ vẫn như vậy cho đến khi ta đưa ra quyết định của mình."
  birth.2001.a.standard:0 "Ta sẽ hợp pháp hóa [child.GetHerHim] như con ruột của mình!"
  birth.2001.a.twins:0 "Ta sẽ hợp pháp hóa chúng như con ruột của mình!"
  birth.2001.b.standard:0 "Ta không thể làm ô danh gia đình mình bằng cách hợp pháp hóa con ngoài giá thú..."
  birth.2001.b.no_legitimization_in_faith:0 "Định mệnh sống kiếp con ngoài giá thú..."
  bastard_remains_bastard_tt:0 "[child.GetShortUIName|U] vẫn là một [bastard|E] chưa được hợp pháp hóa"

  birth.2002.t:0 "Phúc Lành Nhân Đôi"
  birth.2002.start:0 "Quả thật hôm nay là một ngày đáng để ăn mừng!"
  birth.2002.desc.standard:0 "Không chỉ ta được ban phúc với một [child.Custom('GetDaughterSon')] mới sinh – mà [child.GetHerHis] [legitimizer.GetMotherFather], [legitimizer.GetTitledFirstName], còn quyết định hợp pháp hóa [child.GetHerHim]!"
  birth.2002.desc.twins:0 "Không chỉ ta được ban phúc với cặp song sinh mới sinh — mà [legitimizer.GetMotherFather] của chúng, [legitimizer.GetTitledFirstName], còn quyết định hợp pháp hóa chúng!"
  birth.2002.end:0 "\n\nNhững tháng qua tràn đầy nghi ngờ và sợ hãi, nhưng hôm nay trái tim ta nhẹ nhõm như lông vũ."
  birth.2002.a:0 "Tương lai vẫn còn hy vọng."

  birth.2003.t:0 "Khởi Đầu Gian Nan"
  birth.2003.desc.standard_start:0 "Ta ước mình có thể ăn mừng sự ra đời của [child.Custom('GetDaughterSon')] của chúng ta, nhưng [legitimizer.GetTitledFirstName] đã nói rõ rằng đứa trẻ sẽ không được xem là thành viên thực sự của gia tộc [legitimizer.GetHerHis]."
  birth.2003.desc.twin_start:0 "Ta ước mình có thể ăn mừng sự ra đời của các con chúng ta, nhưng [legitimizer.GetTitledFirstName] đã nói rõ rằng những đứa trẻ này sẽ không được xem là thành viên thực sự của gia tộc [legitimizer.GetHerHis]."
  birth.2003.desc.landed_end:0 "\n\nDấu ấn con ngoài giá thú không bao giờ hoàn toàn phai nhạt, dù sự thừa nhận của một [legitimizer.GetTitleTierName] chắc hẳn sẽ giúp ích..."
  birth.2003.desc.unlanded_end:0 "\n\nDấu ấn con ngoài giá thú không bao giờ hoàn toàn phai nhạt, dù sự thừa nhận của một [legitimizer.GetLadyLord] chắc hẳn sẽ giúp ích..."
  birth.2003.a:0 "Ta ước mọi chuyện khác đi, bé [child.GetFirstNameNoTooltip]!"


  birth.2004.t:0 "Lòng Khoan Dung Của Một [secondary_legitimizer.GetMotherFather|U]"
  birth.2004.desc.standard:0 "Hóa ra, [child.Custom('GetDaughterSon')] mới sinh của ta sau tất cả lại có thể có một tương lai tốt đẹp đang chờ đón [child.GetHerHim]. [secondary_legitimizer.GetMotherFather] của [child.GetHerHis], [secondary_legitimizer.GetTitledFirstName], đã chào đón [child.GetHerHim] vào gia tộc [secondary_legitimizer.GetDynastyName]."
  birth.2004.desc.twins:0 "Hóa ra những đứa con mới sinh của ta vẫn có thể có một tương lai tươi sáng. [secondary_legitimizer.GetMotherFather] của chúng, [secondary_legitimizer.GetTitledFirstName], đã chào đón chúng vào gia tộc [secondary_legitimizer.GetDynastyName]."
  birth.2004.a.standard:0 "Hãy làm họ tự hào, [child.Custom('GetDaughterSon')] của ta."
  birth.2004.a.twins:0 "Hãy làm họ tự hào, các con của ta."

  birth.2011.t:0 "[child.Custom('GetDaughterSon')] Của Ta"
  birth.2011.desc:0 "Dù được thụ thai ngoài hôn nhân, [child.Custom('GetDaughterSon')] mới sinh của ta vẫn an toàn đến với thế giới này.\n\n[child.GetSheHe|U] được sinh ra trong gia tộc [legitimizer.GetHouse.GetBaseName], và đó cũng là cách [child.GetSheHe] sẽ được nuôi dạy."


  birth.2102.t:0 "Giọt Máu Của [real_father.GetTitledFirstNamePossessiveNoTooltip|U]"
  birth.2102.desc:0 "[mother.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))] của ta, đã sinh ra một đứa trẻ do người đàn ông khác gieo giống. Giờ đây [mother.GetSheHe] đang cho [child.Custom('GetDaughterSon')] của [real_father.GetTitledFirstNamePossessive] bú sữa. Họ gọi [child.GetHerHim] là [child.GetFirstName]."
  birth.2102.desc.twin:1 "[mother.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))] của ta, đã sinh ra [child.Custom('TwinDaughtersSonsChildren')] của [real_father.GetTitledFirstNamePossessive]. Họ gọi chúng là [child.GetFirstName] và [child_2.GetFirstName]."
  birth.2102.a:0 "Ta phải làm gì với chuyện này?"

  birth.2104.t:0 "Đứa Trẻ Kỳ Lạ"
  birth.2104.desc:0 "[real_father.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))] của ta, đã khiến [mother.GetTitledFirstName] mang thai. Giờ đây [mother.GetFirstName] đang nuôi dưỡng giọt máu của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))] của ta."
  birth.2104.desc.twin:0 "[real_father.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))] của ta, đã khiến [mother.GetTitledFirstName] mang thai. Giờ đây [mother.GetFirstName] đang nuôi dưỡng những giọt máu của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))] của ta."
  birth.2104.a:0 "Ta phải làm gì với chuyện này?"

  every_child_adult_non_bastard:0 "Tất cả con trưởng thành không phải con ngoài giá thú của ta"

  birth.3001.t:0 "Được Tử Thần Ôm Ấp"
  birth.3001.desc_other_child:0 ""Chỉ cần rặn thêm một lần nữa, [ROOT.Char.Custom('FormOfAddressForLiege')]! Đứa bé sắp ra rồi!" Một tiếng thét thoát khỏi môi ta khi ta dồn sức lần cuối. Cơn đau ở khắp nơi, quá nhiều, quá dữ dội — rồi đột nhiên, tất cả kết thúc. Ta... ta đã làm được.\n\n"[dummy_gender.GetSheHe] ổn chứ?" Ta gần như không nhận ra giọng nói của chính mình. "[dummy_gender.GetSheHe]... Là [dummy_gender.Custom('GirlBoy')] sao?"\n\nBà đỡ không trả lời, thậm chí không nhìn ta. Không, ánh mắt bà chỉ dõi theo đứa trẻ bất động trong tay."
  birth.3001.a:1 "Không phải... Sao [dummy_gender.GetSheHe] không thở?! #EMP Làm gì đi!#!"
  birth.3001.a.tt:1 "@death_icon! [dummy_gender.Custom('DaughterSon')] của Ngài đã chết khi sinh"

  birth.3002.desc:0 "Khi [ROOT.Char.Custom('GetDoor')] của [ROOT.Char.Custom('GetChamber')] sinh nở mở ra, ta không được chào đón bởi những bà đỡ mỉm cười hay tiếng khóc của đứa trẻ, mà là tiếng gào đau đớn của [mother.GetTitledFirstNamePossessive].\n\n"Thần rất tiếc, [ROOT.Char.Custom('FormOfAddressForLiege')]." Bà đỡ không dám nhìn vào mắt ta. Trong tay bà là một gói nhỏ được bọc kín. "[dummy_gender.Custom('DaughterSon')] của ngài... [dummy_gender.GetSheHe|U] giờ đã ở [ROOT.Char.GetFaith.PositiveAfterLife].""
  birth.3002.a:0 "[dummy_gender.Custom('DaughterSon')] của ta? Ở... ở [ROOT.Char.GetFaith.PositiveAfterLife] sao?"

  birth.3011.desc_twin:0 "Cặp song sinh thật hoàn hảo. Những gương mặt bé nhỏ, mùi hương của chúng... Ta muốn ở lại khoảnh khắc này mãi mãi, nhưng bà đỡ chỉ cho ta bế chúng vài nhịp thở. Ta cố phản đối khi bà bế chúng đi, nhưng tay ta yếu ớt và ta không thể thốt nên lời.\n\n"Xin đừng lo, [ROOT.Char.GetTitleAsNameNoTooltip]. [child.Custom('TwinDaughtersSonsChildren')] của ngài khỏe mạnh và an toàn. Giờ đây người mà chúng Ta phải lo chính là ngài."\n\n"
  birth.3011.desc:0 "[child.Custom('DaughterSon')] của ta thật hoàn hảo. Khuôn mặt bé nhỏ của [child.GetHerHis|U], mùi hương của [child.GetSheHe]... Ta muốn ở lại khoảnh khắc này mãi mãi, nhưng bà đỡ chỉ cho ta bế [child.GetHerHim] vài nhịp thở. Ta cố phản đối khi bà bế [child.GetHerHim] đi, nhưng tay ta yếu ớt và ta không thể thốt nên lời.\n\n"Xin đừng lo, [ROOT.Char.GetTitleAsNameNoTooltip]. [child.Custom('DaughterSon')] của ngài khỏe mạnh và an toàn. Giờ đây người mà chúng Ta phải lo chính là ngài."\n\n"
  birth.3011.adventurer: "Khi ta ngã người trở lại giường, thế giới dần tối lại..."
  birth.3011.landed: "Khi các thị nữ của ta hối hả chạy qua chạy lại, thế giới dần tối lại..."
  birth.3011.twin.a:1 "Xin hãy... Tên của chúng..."
  birth.3011.a:0 "Xin hãy... Tên của [child.GetHerHis|U]..."

  birth.3012.start.desc:0 "Khi bà đỡ cuối cùng bước ra khỏi [ROOT.Char.Custom('GetChamber')] sinh nở với một bọc nhỏ đang khóc khe khẽ trong tay, sự nhẹ nhõm tràn qua ta.\n\nRồi ta nhìn thấy nét mặt của bà.\n\n"Thần rất tiếc, [ROOT.Char.Custom('FormOfAddressForLiege')]. [mother.GetLadyLord|U] [mother.GetFirstNameNoTooltip]..." Bà không nói tiếp được, nhưng giọng nói đã nói lên tất cả.\n\nMột sinh mạng đã tắt, nhưng"
  birth.3012.desc_twin:0 "hai sinh mạng mới vừa bắt đầu. Ta phải mạnh mẽ vì [child.Custom('TwinDaughtersSonsChildren')] của ta."
  birth.3012.desc:0 "một sinh mạng mới vừa bắt đầu. Ta phải mạnh mẽ vì [child.Custom('DaughterSon')] của ta."
  birth.3012.a:0 "Khởi đầu thật bi thương..."

  birth.3021.desc:0 "Hơi thở nặng nhọc của ta là âm thanh duy nhất phá vỡ sự im lặng trong [ROOT.Char.Custom('GetChamber')] sinh nở. Ta tìm kiếm trong [ROOT.Char.Custom('GetRoom')] những nụ cười khích lệ, bất cứ điều gì giúp ta vượt qua cơn đau. Nhưng tất cả những gì ta thấy chỉ là nỗi sợ của chính mình phản chiếu lại.\n\nKhi đứa trẻ cuối cùng cũng ra đời, tiếng khóc mong đợi từ lâu lại không xuất hiện. "Tại sao [dummy_gender.GetSheHe] không khóc?" Những lời đó nặng trĩu trên môi ta. Mọi thứ đều nặng nề.\n\nTa buộc môi mình thốt lại lần nữa."
  birth.3021.a:0 "Tại sao... [dummy_gender.GetSheHe]..."


  birth.3022.desc:0 "Khi ta chờ bên ngoài [ROOT.Char.Custom('GetChamber')] nơi sinh nở, mỗi phút trôi qua dài như cả một đời. Tiếng la hét của [mother.GetFirstNamePossessive] đã im bặt, nhưng cũng không có tiếng khóc của đứa trẻ nào thay thế. Có điều gì đó không ổn; ta có thể cảm nhận được điều đó trong tận xương tủy.\n\nCánh [ROOT.Char.Custom('GetDoor')] mở ra. Vẻ mặt đau đớn của bà đỡ xác nhận mọi nỗi sợ của ta.\n\n\"Ta vô cùng xin lỗi, [ROOT.Char.Custom('FormOfAddressForLiege')]. [mother.GetLadyLord|U] [mother.GetFirstNameNoTooltip]... [dummy_gender.Custom('DaughterSon')] của ngài... Cả hai giờ đã ở trong [ROOT.Char.GetFaith.PositiveAfterLife].\""
  birth.3022.a:1 "Tại sao?! [ROOT.Char.GetFaith.FertilityGodName|U], ta đã làm gì để phải chịu điều này?"
  birth.3022.a.buddhism:0 "Chúng ta đã làm gì để phải chịu điều này?!"

  birth.3031.t:0 "Được Ôm Ấp Trong Bệnh Tật"
  birth.3031.start.desc:0 "Mọi đứa trẻ sơ sinh đều khóc, nhưng với bé [child.GetFirstName] thì dường như nước mắt không bao giờ dứt. Ta tuyệt vọng mong bà đỡ có thể trấn an mình, nhưng hàng lông mày nhíu chặt của bà khiến mọi thứ càng tệ hơn.\n\n"
  birth.3031.princessprince.desc:0 "\"Vị [child.GetLadyLord] nhỏ"
  birth.3031.daughterson.desc:0 "\"[child.Custom('DaughterSon')] của ngài"
  birth.3031.end.desc:0 "không tăng cân như [child.GetSheHe] đáng lẽ phải vậy. Chúng Ta sẽ chăm sóc [child.GetHerHim] thật tốt, [ROOT.Char.Custom('FormOfAddressForLiege')], nhưng cuối cùng thì sinh mạng của [child.GetHerHis] vẫn nằm trong tay [ROOT.Char.GetFaith.FateGodNamePossessive].\""
  birth.3031.a:0 "Nín nào, [child.GetFirstNameNoTooltip]! Xin con đừng khóc nữa!"

  birth.3034.t:0 "Lớn Lên Mạnh Mẽ"
  birth.3034.desc:0 "Hầu hết những đứa trẻ khác đều khỏe hơn ta. Khi chơi đùa, ta phải ngồi nghỉ rất nhiều. Nhưng hôm nay, khi chúng ta chạy đua tới chuồng ngựa, ta đã thắng!"
  birth.3034.a:0 "[ROOT.Char.Custom('child_favorite_toy')] của ta đâu rồi? Chúng ta chơi đi!"

  birth.3035.desc:0 "Sự yếu ớt đã đeo bám [child.Custom('GetDaughterSon')] của ta từ khi [child.GetHerHis] chào đời cuối cùng cũng buông tha [child.GetHerHim]! Một làn sóng nhẹ nhõm tràn qua khi ta thấy [child.GetFirstName] chạy nhảy cùng tất cả những đứa trẻ khác."
  birth.3035.a:0 "Mong con lớn lên thật mạnh mẽ, [child.GetFirstNameNoTooltip]."

  birth.3041.t:0 "Kiệt Sức"
  birth.3041.start.desc:0 "Đã vài tuần kể từ khi ta sinh ra"
  birth.3041.desc_twins:0 "[child.Custom('TwinDaughtersSonsChildren')] của mình,"
  birth.3041.one_child.desc:0 "bé [child.GetFirstNameNoTooltip],"
  birth.3041.end:0 "thế nhưng ta vẫn phải nằm liệt giường. Khi ngày tháng trôi qua mà chẳng khá hơn bao nhiêu, niềm vui của ta dần bị nuốt chửng bởi sự mệt mỏi khủng khiếp."
  birth.3041.a:0 "Chẳng phải sức lực của ta đáng lẽ phải quay lại rồi sao?"

  birth.9002.t:0 "Cái Tên Có Ý Nghĩa Gì?"
  birth.9002.start.desc:0 "Ôm đứa bé trong vòng tay [suggester.GetHerHis],"
  birth.9002.worrying.desc:0 "[suggester.GetTitledFirstName] nhìn ta với ánh mắt đầy lo âu."
  birth.9002.tears.desc:0 "[suggester.GetTitledFirstName] lau những giọt nước mắt trên má và hướng về phía ta mà không rời mắt khỏi [child.Custom('GetDaughterSon')] của chúng ta."
  birth.9002.pride.desc:0 "[suggester.GetTitledFirstName] nhìn lên ta, đầu ngẩng cao và đôi mắt rực sáng niềm tự hào."
  birth.9002.conviction.desc:0 "[suggester.GetTitledFirstName] nhìn lên ta, đôi mắt ngời sáng niềm tin mãnh liệt."
  birth.9002.surprisingly_calm.desc:0 "[suggester.GetTitledFirstName] nhìn lên ta, khuôn mặt bình thản đến ngạc nhiên."
  birth.9002.calm.desc:0 "[suggester.GetTitledFirstName] nhìn lên ta, khuôn mặt toát lên vẻ thanh thản."
  birth.9002.devotion.desc:0 "Ánh mắt của [suggester.GetTitledFirstNamePossessive] gặp ánh mắt ta. Đôi mắt [suggester.GetHerHis|U] tràn đầy sự tận tụy yêu thương."
  newline.desc:0 "\n\n"
  birth.9002.love.desc:0 "\"Tình yêu của ta,"
  birth.9002.dear_spouse.desc:0 "\"[ROOT.Char.GetWifeHusband|U] thân yêu,"
  birth.9002.spouse.desc:0 "\"[ROOT.Char.GetWifeHusband|U],"
  birth.9002.suggester_relative.desc:0 "chúng ta có thể đặt tên [child.GetHerHim] là [namesake.GetFirstNameNoTooltip], theo tên người [namesake.Custom('ComplimentAdjective')] [suggester.Custom2('RelationToMeShort', SCOPE.sC('namesake'))] của ta được không?\""
  birth.9002.namer_relative.desc:0 "có lẽ chúng ta nên đặt tên [child.GetHerHim] là [namesake.GetFirstNameNoTooltip]? Theo tên người [namesake.Custom('ComplimentAdjective')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('namesake'))] của ngài?\""
  birth.9002.suggesters_name.desc:0 "ta nghĩ chúng ta nên đặt tên [child.GetHerHim] là [suggester.GetFirstNameNoTooltip], theo tên ta. Ngài thấy sao?\""
  birth.9002.namers_name.desc:0 "hãy đặt tên [child.GetHerHim] là [ROOT.Char.GetFirstNameNoTooltip], theo tên ngài.\""
  birth.9002.nice_name.desc:0 "ta đã suy nghĩ rồi. Ta muốn chúng ta đặt tên [child.GetHerHim] là [namesake.GetFirstNameNoTooltip]. Ta luôn yêu thích cái tên đó.\""
  birth.9002.religious_god.desc:0 "chúng ta nên đặt tên [child.GetHerHim] là [SCOPE.GetFlagName('name_suggestion')], để tôn vinh vị thần vĩ đại!\""
  birth.9002.religious_godess.desc:0 "chúng ta nên đặt tên [child.GetHerHim] là [SCOPE.GetFlagName('name_suggestion')], để tôn vinh nữ thần vĩ đại!\""
  birth.9002.religious_apostle.desc:0 "chúng ta nên đặt tên [child.GetHerHim] là [SCOPE.GetFlagName('name_suggestion')], để tôn vinh vị tông đồ mộ đạo.\""
  birth.9002.religious_holy_virgin.desc:0 "chúng ta nên đặt tên [child.GetHerHim] là [SCOPE.GetFlagName('name_suggestion')], để tôn vinh vị trinh nữ thánh.\""
  birth.9002.religious_fallback.desc:0 "chúng ta nên đặt tên [child.GetHerHim] theo vinh quang của [SCOPE.GetFlagName('name_suggestion')]!\""
  birth.9002.lunatic.desc:0 "ta có một ý tưởng tuyệt vời! Chúng ta nên đặt tên [child.GetHerHim] là [SCOPE.GetFlagName('name_suggestion')]! Trông [child.GetSheHe] chẳng giống một [SCOPE.GetFlagName('name_suggestion')] bé nhỏ sao?\""
  birth.9002.creator.desc:0 "hãy đặt tên đứa bé của chúng ta là [SCOPE.GetFlagName('name_suggestion')], để tôn vinh Đấng Sáng Tạo!\""
  birth.9002.possessed.desc:0 "ta đã cảm nhận được sự hiện diện của [child.GetHerHis|U]. [child.GetSheHe|U] yêu cầu chúng ta đặt tên [child.Custom('DaughterSon')] của mình là [SCOPE.GetFlagName('name_suggestion')].\""

  birth.9002.a1:0 "Ý tưởng thật tuyệt. Vậy là [namesake.GetFirstNameNoTooltip]."
  birth.9002.a2:0 "Ý tưởng thật tuyệt. Vậy là [SCOPE.GetFlagName('name_suggestion')]."
  birth.9002.a.tt.1:0 "Chúng ta đặt tên con là [namesake.GetFirstNameNoTooltip]"
  birth.9002.a.tt.2:0 "Chúng ta đặt tên con là [SCOPE.GetFlagName('name_suggestion')]"
  birth.9002.a.rename: "[SCOPE.GetFlagName('name_suggestion')]"
  birth.9002.b1:0 "Thực ra, ta có ý khác..."
  birth.9002.b2:0 "Cái gì?! Đó là một ý tưởng tệ hại!"
  birth.9002.b.tt:1 "Ngài sẽ đặt cho [child.GetHerHim] một cái tên phù hợp hơn"

  birth.9003.desc:0 "Ta nhẹ nhàng bế đứa bé khỏi vòng tay [suggester.GetTitledFirstNamePossessive] và nhìn vào đôi mắt nhỏ hoàn hảo của [child.GetHerHis]. Con sẽ trở thành người như thế nào?"
  birth.9003.a:0 "Tốt hơn nhiều."

  birth.9004.t:0 "Một Cái Tên Có Ý Nghĩa Gì?"
  birth.9004.desc.me:0 "[ROOT.Char.GetFirstNameNoTooltip].\n\nMột cái tên thật tẻ nhạt, đôi khi ta nghĩ vậy, khi tự hỏi các sử gia tương lai sẽ ghi nó như thế nào.\n\nNhưng ta là một [ROOT.Char.GetTitleAsNameNoTooltip], và nếu ta muốn được gọi khác đi, chẳng phải chỉ cần để cả thế giới biết sao?"
  birth.9004.desc:0 "[child.GetFirstNameNoTooltip].\n\nBan đầu ta rất thích cái tên này, nhưng giờ nó nghe thật lạ tai. Khi lớn lên, liệu [child.GetSheHe] sẽ nghĩ gì về tên của [child.GetHerHis]?\n\nCó lẽ ta nên đổi nó thành một cái tên tốt hơn?"
  birth.9004.a:0 "À, một cái tên #EMP tốt#! hơn nhiều!"
  birth.9004.b:0 "Nghĩ lại thì, ta thấy [ROOT.Char.GetFirstNameNoTooltip] vẫn ổn..."
  birth.9004.b.other:0 "Thực ra [child.GetFirstNameNoTooltip] cũng khá ổn..."
  birth.9004.b.tt:0 "Ngài giữ nguyên tên cũ"
  birth.9004.b.tt.other:0 "[child.GetFirstNameNoTooltip] giữ tên cũ của [child.GetHerHis]"
