l_english:
  marriage_interaction.0001.desc.start:0 "Gửi [ROOT.Char.GetFullName],\n\nSau khi cân nhắc kỹ lưỡng, Ta đã quyết định phá bỏ "
  marriage_interaction.0001.desc.liegetoliege:0 "hôn ước giữa [actor.Custom2('RelationToMe', SCOPE.sC('rejecting_betrothed'))] của Ta, [rejecting_betrothed.GetTitledFirstName], và [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rejected_betrothed'))] của ngươi, [rejected_betrothed.GetTitledFirstName]."
  marriage_interaction.0001.desc.betrothedtobetrothed:0 "hôn ước của chúng ta."
  marriage_interaction.0001.desc.betrothedtoliege:0 "hôn ước của Ta với [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rejected_betrothed'))] của ngươi, [rejected_betrothed.GetTitledFirstName]."
  marriage_interaction.0001.desc.liegetobetrothed:0 "hôn ước của ngươi với [actor.Custom2('RelationToMe', SCOPE.sC('rejecting_betrothed'))] của Ta, [rejecting_betrothed.GetTitledFirstName]."
  marriage_interaction.0001.desc.end:0 "Ta xin lỗi vì những phiền toái mà quyết định của Ta có thể gây ra và thật lòng hy vọng điều này sẽ không làm ảnh hưởng tới quan hệ giữa gia đình chúng ta."
  marriage_interaction.0001.a:0 "Một sự sỉ nhục khủng khiếp..."

  marriage_interaction.0002.desc:0 "Gửi [actor.Custom2('RelationToMe', SCOPE.sC('rejecting_betrothed'))] [rejecting_betrothed.GetFullName],\n\nTa đã đi đến kết luận rằng hôn lễ sắp tới của ngươi với [rejected_betrothed.GetTitledFirstName] không có lợi cho bản thân ngươi cũng như cho gia đình chúng ta. Do đó, Ta quyết định phá hôn ước." #<TO_REMOVE>
  marriage_interaction.0002.a:0 "Thật tiếc." #<TO_REMOVE>

#Timeout notification when you are in charge of the betrothal of someone else
  marriage_interaction.0004.t:0 "Hôn Ước Bỏ Lại Phai Nhạt"
  marriage_interaction.0004.desc:0 "Các thỏa thuận đã được thực hiện và mọi thứ đều sẵn sàng, cho đến khi đến lúc kết thúc hôn lễ. Khi cả hai bên dường như hài lòng giả vờ như chưa bao giờ có thỏa thuận này, có vẻ như [betrothed_1.GetTitledFirstName] và [betrothed_2.GetTitledFirstName] sẽ không bao giờ kết hôn."
  marriage_interaction.0004.a:0 "Điều này là tốt nhất."

#Timeout notification for a betrothed when someone else is in charge of marrying them
  marriage_interaction.0005.t:0 "Hôn Ước Bỏ Lại Phai Nhạt"
  marriage_interaction.0005.desc:0 "Dù đã có thương lượng và lên kế hoạch cẩn thận, có vẻ Ta sẽ không bao giờ kết hôn với hôn phu của mình, [other_betrothed.GetTitledFirstName]. Dù đã đến lúc thực hiện hôn lễ đã hứa, nhưng không bên nào thực hiện bước kết thúc thỏa thuận."
  marriage_interaction.0005.a:0 "Ai biết Ta sẽ kết hôn với ai bây giờ."

#Timeout notification for someone in charge of their own betrothal
  marriage_interaction.0006.t:0 "Hôn Ước Bỏ Lại Phai Nhạt"
  marriage_interaction.0006.desc:0 "Dù đã có thương lượng và lên kế hoạch cẩn thận, có vẻ Ta sẽ không bao giờ kết hôn với hôn phu của mình, [other_betrothed.GetTitledFirstName]. Dù đã đến lúc thực hiện hôn lễ đã hứa, nhưng không bên nào thực hiện bước kết thúc thỏa thuận."
  marriage_interaction.0006.a:0 "Cuối cùng Ta sẽ kết hôn với ai đây?"

  marriage_interaction.0008.t:0 "Hôn Ước Bị Phá Vỡ Vì Đạo"
  marriage_interaction.0008.desc:0 "[betrothed_clergy.GetTitledFirstName] đã cống hiến cuộc đời của [betrothed_clergy.GetHerHis] cho [betrothed_clergy.GetFaith.HighGodName] – bất chấp những thương lượng và kế hoạch cẩn thận, dường như [betrothed_clergy.GetSheHe] sẽ không bao giờ kết hôn với [betrothed_2.GetTitledFirstName]. "
  marriage_interaction.0008.a:0 "Thật tiếc."

  marriage_interaction.0009.desc_clergy:0 "Giờ đây khi Ta đã dâng cả đời mình cho [betrothed_clergy.GetFaith.HighGodName], Ta bị cấm kết hôn và phải bỏ lại hôn phu [betrothed_2.GetTitledFirstName]. Ta hy vọng [betrothed_2.GetSheHe] sẽ tha thứ cho Ta."
  marriage_interaction.0009.desc:0 "[betrothed_clergy.GetTitledFirstName] đã cống hiến cuộc đời của [betrothed_clergy.GetHerHis] cho [betrothed_clergy.GetFaith.HighGodName] – bất chấp những thương lượng và kế hoạch cẩn thận, dường như ta sẽ không bao giờ kết hôn với vị hôn phu/hôn thê của mình."
  marriage_interaction.0009.a:0 "Thật tiếc."
