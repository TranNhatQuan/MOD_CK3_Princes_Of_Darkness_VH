  diarchies.0000.diarch_lax_with_mandate.t:1 "[liege.GetDiarchTitle|U] né tránh nhiệm vụ [mandate|E]"

  diarchies.0000.diarch_mandate_fail.tt.obtain_gold.liege:0 "[diarch.GetSheHe|U] đã cố gắng kiếm [gold|E] cho Ngài"
  diarchies.0000.diarch_mandate_fail.tt.obtain_gold.split:0 "[diarch.GetSheHe|U] đã cố gắng kiếm [gold|E] cho cả hai"
  diarchies.0000.diarch_mandate_fail.tt.obtain_gold.self:0 "[diarch.GetSheHe|U] đã cố gắng kiếm [gold|E] cho [diarch.GetHerselfHimself]"
  diarchies.0000.diarch_mandate_fail.tt.acquire_character.liege:0 "[diarch.GetSheHe|U] đã cố gắng kiếm cho Ngài một [courtier|E]"
  diarchies.0000.diarch_mandate_fail.tt.acquire_character.self:0 "[diarch.GetSheHe|U] đã cố gắng giành lòng trung thành của một [character|E] cho [diarch.GetHerselfHimself]"
  diarchies.0000.diarch_mandate_fail.tt.acquire_troops.liege: "[diarch.GetSheHe|U] đã cố gắng chiêu mộ binh lính cho Ngài"
  diarchies.0000.diarch_mandate_fail.tt.acquire_troops.split:0 "[diarch.GetSheHe|U] đã cố gắng chiêu mộ binh lính cho cả hai"
  diarchies.0000.diarch_mandate_fail.tt.affect_contract.liege:0 "[diarch.GetSheHe|U] đã cố gắng tác động có lợi đến [vassal_contract|E] của một [vassal|E] cho Ngài"
  diarchies.0000.diarch_mandate_fail.tt.harass_peasants.liege:0 "[diarch.GetSheHe|U] đã cố gắng lấy tài nguyên từ nông dân"
  diarchies.0000.diarch_mandate_fail.tt.boost_authority.liege:0 "[diarch.GetSheHe|U] đã cố gắng củng cố quyền uy của Ngài"
  diarchies.0000.diarch_mandate_fail.tt.affect_faction.liege:0 "[diarch.GetSheHe|U] đã cố gắng làm tan rã một [faction|E]"
  diarchies.0000.diarch_mandate_fail.tt.network.self:0 "[diarch.GetSheHe|U] đã cố gắng lấy lòng các [vassals|E] của Ngài cho [diarch.GetHerselfHimself]"
  diarchies.0000.diarch_mandate_fail.tt.train_self.self:0 "[diarch.GetSheHe|U] tập trung vào việc tự rèn luyện bản thân thay vì huấn luyện quân đội của ngài"

  diarchy.0021.t:1 "Được Gọi Trở Thành [liege.GetDiarchTitle|U]"
  diarchy.0021.desc.appointment_nature.child:0 "Vì [liege.Custom2('MyCharacterIntroduction', ROOT.Char)] chỉ mới là một đứa trẻ, nên rõ ràng [liege.GetSheHe] không thể cai trị hiệu quả [liege.GetPrimaryTitle.GetName]. [liege.GetSheHe|U] cần một bàn tay vững vàng dẫn dắt [liege.GetHerHim], ít nhất cho đến khi [liege.GetHerHis] trưởng thành."
  diarchy.0021.desc.appointment_nature.incapable:0 "Vì [liege.Custom2('MyCharacterIntroduction', ROOT.Char)] đã trở thành một mớ hỗn độn run rẩy, bệnh tật #EMP đáng thương#!, [liege.GetPrimaryTitle.GetName] đang đứng bên bờ vực hỗn loạn hoàn toàn. Nhất là khi, với tình trạng của [liege.GetHerHis], ai biết chúng ta sẽ thiếu vắng quyền lực bao lâu?"
  diarchy.0021.desc.appointment_nature.imprisoned:0 "Vì [liege.Custom2('MyCharacterIntroduction', ROOT.Char)] bị [liege.GetImprisonedBy.GetTitledFirstName] giam cầm, [liege.GetPrimaryTitle.GetName] trở nên vô định và trôi dạt. Liên lạc từ lãnh chúa của chúng ta chỉ diễn ra khi cai ngục của [liege.GetHerHis] cho phép, và những lá thư nào #EMP thực sự#! đến từ [liege.GetTitleAsNameNoTooltip] luôn là chủ đề tranh cãi."
  diarchy.0021.desc.appointment_nature.travelling:0 "Vì [liege.Custom2('MyCharacterIntroduction', ROOT.Char)] hiện đang bận rộn ở những vùng đất xa xôi, [liege.GetPrimaryTitle.GetName] bị bỏ lại trong trạng thái bất định lặng lẽ. Không có [liege.GetTitleAsNameNoTooltip] tại vị nghĩa là không có quyền lực ràng buộc, và #EMP điều đó#! khiến các chư hầu lo lắng."
  diarchy.0021.desc.appointment_nature.war:0 "Vì [liege.Custom2('MyCharacterIntroduction', ROOT.Char)] đang ra chiến trường, căng thẳng lan rộng giữa những người ở lại phía sau. Liên lạc từ [liege.GetTitleAsNamePossessiveNoTooltip] thất thường, và các tranh chấp chồng chất mỗi ngày."
  diarchy.0021.desc.appointment_nature.fallback:0 "Với tất cả những người thuộc [liege.GetPrimaryTitle.GetName], thật rõ ràng là [liege.Custom2('MyCharacterIntroduction', ROOT.Char)] không thể gánh vác gánh nặng cai trị một mình mà không gây ra những tổn hại không thể cứu vãn cho đất nước chúng ta."
  diarchy.0021.desc.diarchy_type.regency_temporary:0 "\n\nDù nhiệm vụ này có thể không kéo dài lâu, vẫn cần có người trông coi vương quốc, phân xử tranh chấp và giữ ấm ngai vàng cho [liege.GetTitledFirstNameNoTooltip] với tư cách"
  diarchy.0021.desc.diarchy_type.regency_entrenched:0 "\n\nVì tình trạng này có thể kéo dài một thời gian, vương quốc cần biết phải tìm đến ai khi [liege.GetTitledFirstNameNoTooltip] không thể đích thân thực thi công lý. Chúng ta cần một người phục vụ lâu dài với tư cách"
  diarchy.0021.desc.diarchy_type.fallback:0 "\n\nCó vẻ rõ ràng là chúng ta không thể tiếp tục như thế này. Vì [liege.GetTitledFirstNameNoTooltip] không thể cai trị một mình, nên ai đó phải phục vụ với tư cách là [liege.GetHerHis]"
  diarchy.0021.desc.outro:0 "[liege.GetDiarchTitle|U].\n\nDĩ nhiên, người đó chính là ta."
  diarchy.0021.reminder.diarch_powers:0 "Ngài có quyền sử dụng [diarch_powers|E], có thể dùng chống lại [liege|E] và các [vassals|E] khác"
  diarchy.0021.reminder.scales_of_power:0 "[scales_of_power|E] đã được kích hoạt và có thể được xoay chuyển để mở khóa thêm [diarch_powers|E]"
  diarchy.0021.a:0 "Ta sẽ bắt đầu tri-#EMP vì#! cai trị ngay lập tức!"
  diarchy.0021.a.sedate:0 "Ta đã có rất nhiều ý tưởng cho vương quốc!"
  diarchy.0021.b:0 "À, sự công nhận."
  diarchy.0021.c:0 "E rằng ta có quá nhiều nghĩa vụ cấp bách..."

 ##################################################
 # #Modifiers
  mandate_induced_fines_to_liege_modifier:0 "Tiền Phạt Hình Sự Quá Mức"
  mandate_induced_fines_to_liege_modifier_desc:0 "Hạt này đang oằn mình dưới gánh nặng những khoản tiền phạt hình sự hà khắc, được áp đặt để làm giàu cho toàn cõi."
  mandate_induced_fines_split_modifier:0 "Chia Chác Tiền Phạt Hình Sự Quá Mức"
  mandate_induced_fines_split_modifier_desc:0 "Hạt này đang oằn mình dưới gánh nặng những khoản tiền phạt hình sự hà khắc, phần lớn chảy thẳng vào túi lãnh chúa địa phương."
  mandate_fines_being_ignored_modifier:0 "Bỏ Qua Tiền Phạt Hình Sự"
  mandate_fines_being_ignored_modifier_desc:0 "Hạt này đang phớt lờ yêu cầu tăng tiền phạt tội phạm, và vẫn tức giận vì thậm chí bị yêu cầu."

  mandate_hated_recruiter_modifier:0 "Kẻ Tuyển Quân Bị Ghét"
  mandate_hated_recruiter_modifier_desc:0 "Nhân vật này nổi tiếng #EMP tàn nhẫn#! khi đánh giá ai đủ điều kiện nhập ngũ."
  mandate_failed_to_drum_up_rural_recruits_modifier:0 "Kẻ Tuyển Quân Thất Bại"
  mandate_failed_to_drum_up_rural_recruits_modifier_desc:0 "Nhân vật này có tiếng xấu vì cố gắng nhưng thất bại trong việc huy động nhiều lính hơn mức được coi là công bằng."
  mandate_squeezing_recruiting_sources_modifier:0 "Tuyển Quân Bằng Bạo Lực"
  mandate_squeezing_recruiting_sources_modifier_desc:0 "Nếu đến tuổi chiến đấu, họ sẽ phải phục vụ. Nếu không, họ sẽ phải trả giá."
  mandate_extra_recruiting_sources_modifier:0 "Tuyển Quân Ngoài Pháp Luật"
  mandate_extra_recruiting_sources_modifier_desc:0 "Dù chỉ cần đưa ra một số quân nhất định cho chiến tranh, hạt này biết rằng tốt hơn nên cung cấp thêm vài người nữa. Nếu không..."

  mandate_sellswords_bolster_ranks_modifier:0 "Lính Đánh Thuê Tăng Cường Quân Số"
  mandate_sellswords_bolster_ranks_modifier_desc:0 "Mỗi khi một binh sĩ trong gia đình nhân vật này chết hoặc nghỉ hưu, luôn có vô số lính đánh thuê sẵn sàng thay thế."
  mandate_sellswords_bolster_recruitment_modifier:0 "Lính Đánh Thuê Hỗ Trợ Tuyển Mộ"
  mandate_sellswords_bolster_recruitment_modifier_desc:0 "Những kẻ làm thuê tìm kiếm nguồn thu #EMP lâu dài#! luôn háo hức gia nhập gia đình nhân vật này."

  mandate_hired_thugs_modifier:0 "Thuê Côn Đồ"
  mandate_hired_thugs_modifier_desc:0 "Những điều tồi tệ dường như xảy ra với những kẻ chống đối nhân vật này."
  mandate_emptied_gaols_modifier:0 "Dọn Trống Nhà Lao"
  mandate_emptied_gaols_modifier_desc:0 "Kẻ cướp và thảo khấu đổ về hạt này, biết rằng tội ác của họ sẽ được tha thứ nếu phục vụ quân đội."

  mandate_baronial_troops_trained_modifier:0 "Quân Nam Tước Được Rèn Luyện"
  mandate_baronial_troops_trained_modifier_desc:0 "Nhiều binh sĩ của nhân vật này phù hợp ra chiến trường hơn dự kiến."
  mandate_baronial_troops_half_trained_modifier:0 "Quân Nam Tước Rèn Luyện Một Nửa"
  mandate_baronial_troops_half_trained_modifier_desc:0 "$mandate_baronial_troops_trained_modifier_desc$"
  mandate_focused_on_own_training_modifier:0 "Tập Trung Rèn Luyện"
  mandate_focused_on_own_training_modifier_desc:0 "Thường xuyên luyện tập những điều cơ bản giúp nhân vật này luôn sẵn sàng chiến đấu."
  mandate_strained_self_training_modifier:0 "Chấn Thương Khi Tự Huấn Luyện"
  mandate_strained_self_training_modifier_desc:0 "Nhân vật này bị thương khi luyện tập với lính và vẫn chưa hồi phục hoàn toàn."

  shift_privileges_monopolies_sold_modifier:0 "Bán Độc Quyền"
  shift_privileges_monopolies_sold_modifier_desc:0 "Một kẻ đáng ngờ nào đó đã bán quyền độc quyền buôn bán hoặc sản xuất một số hàng hóa #EMP mà không#! có sự cho phép của lãnh chúa địa phương!"
  shift_privileges_scutage_exemptions_modifier:0 "Miễn Thuế Scutage"
  shift_privileges_scutage_exemptions_modifier_desc:0 "Những văn bản mang ấn cấp cao hơn lãnh chúa địa phương cho thấy nhiều nông dân được miễn nghĩa vụ quân sự."
  shift_privileges_conflicting_deeds_modifier:0 "Khế Ước Chồng Chéo"
  shift_privileges_conflicting_deeds_modifier_desc:0 "Một tên vô lại đã bán những khoản cấp đất nhỏ cho các quý tộc địa phương, chồng lấn hoặc vượt quyền lãnh chúa địa phương."

 ##################################################
 # #Mandates - Fill Coffers
  diarchy.1201.t:0 "Tấm Lòng Mở, Túi Tiền Mở"
  diarchy.1201.desc:1 "\"Thuế tồn đọng? Ý ngươi là #EMP thuế tồn đọng#! gì cơ?\" [exploitable_vassal.GetTitledFirstName] khịt mũi. \"Ta nộp phí cho Vương quyền đúng hạn đến từng đồng lẻ, như mọi người khác, và không hề thích bị tống tiền thêm.\"\n\n[exploitable_vassal.GetSheHe|U] tỏ ra... chống đối việc nộp thêm một khoản cống nạp hơn ta hy vọng, nhưng nhiệm vụ của ta với tư cách [liege.GetDiarchTitle] buộc ta phải theo đuổi những việc như thế để phục vụ lãnh chúa của mình."
  diarchy.1201.a:0 "Nhân danh quyền uy của [liege.GetTitledFirstNameNoTooltip], ngươi #EMP sẽ#! phải trả."
  diarchy.1201.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
  diarchy.1201.b:0 "Ngươi nói vậy, nhưng sổ sách này cho thấy doanh thu chỉ một phần..."
  diarchy.1201.b.tt.success:0 "[exploitable_vassal.GetFirstNameNoTooltip] miễn cưỡng nộp tiền"
  diarchy.1201.b.tt.failure:0 "[exploitable_vassal.GetTitleAsNameNoTooltip] vẫn kiên quyết"
  diarchy.1201.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
  diarchy.1201.c:0 "[liege.GetTitleAsNameNoTooltip] và ta không hỏi. Chúng ta ra lệnh."
  diarchy.1201.c.tt.success:0 "$diarchy.1201.b.tt.success$"
  diarchy.1201.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
  diarchy.1201.c.tt.failure:0 "$diarchy.1201.b.tt.failure$"
  diarchy.1201.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
  diarchy.1201.d:0 "Ta không thể làm vậy — dĩ nhiên thuế của ngươi hoàn toàn ổn, xin hãy bỏ qua ta."
  diarchy.1201.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
  diarchy.1201.e:0 "Ngươi nói đúng. Hãy xem như những khoản nợ này đã bị xóa."
  diarchy.1201.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

  diarchy.1211.t:0 "Điều Khoản & Điều Kiện"
  diarchy.1211.desc:1 "\"... và vài nhân chứng cho lời thề trung thành của ngài xác nhận rằng ngài đã hứa sẽ #EMP vượt#! nghĩa vụ của mình, chứ không chỉ đơn thuần đáp ứng chúng\", ta kết thúc. [exploitable_vassal.GetTitledFirstName] nhìn lại ta từ bên kia bàn hội đồng, há hốc mồm.\n\n\"Ngài đang nói rằng lời chứng của vài quý tộc nhỏ vô danh lại đủ để khiến ta phải nợ lãnh chúa của chúng ta #EMP nhiều hơn nữa#! sao?\" [exploitable_vassal.GetSheHe] lắp bắp, vẫn choáng váng trước sự táo bạo trong tuyên bố của ta.\n\nĐó là một đề nghị đầy rủi ro, nhưng nhiệm vụ của ta với tư cách [liege.GetDiarchTitle] buộc ta phải thúc đẩy vị thế của [liege.GetTitledFirstName]."
  diarchy.1211.a:0 "Đúng vậy, và nếu ngài không thích những nhân chứng này, ta còn những người khác."
  diarchy.1211.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
  diarchy.1211.b:0 "Những nhân chứng này rất quan trọng — những lời thề này là thiêng liêng."
  diarchy.1211.b.tt.success:0 "Ngài tranh luận khiến [exploitable_vassal.GetFirstNameNoTooltip] phải khuất phục"
  diarchy.1211.b.tt.failure:0 "Lập luận của Ngài sụp đổ dưới sự soi xét"
  diarchy.1211.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
  diarchy.1211.c:0 "Hoặc là tuyên thệ trung thành lại và đóng một khoản cống nạp nhỏ cho #EMP ngân khố#!."
  diarchy.1211.c.tt.success:0 "[exploitable_vassal.GetFirstNameNoTooltip] chịu trả tiền"
  diarchy.1211.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
  diarchy.1211.c.tt.failure:0 "[exploitable_vassal.GetTitleAsNameNoTooltip] từ chối bị tống tiền"
  diarchy.1211.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
  diarchy.1211.d:0 "Thật khắc nghiệt nếu buộc ngài chịu trách nhiệm vì vài câu chữ sai..."
  diarchy.1211.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
  diarchy.1211.e:0 "Có lẽ... có lẽ tất cả chuyện này hơi mơ hồ..."
  diarchy.1211.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

  diarchy.1221.t:0 "Ngôi Nhà Mới Của Ngài"
  diarchy.1221.desc:0 "Theo ủy nhiệm từ [liege.GetTitledFirstName], nhiệm vụ chính của ta với tư cách nhiếp chính là lấp đầy ngân khố của [liege.GetHerHis]. Một cách dễ dàng để làm điều này là giúp mở rộng vùng ngoại vi của [recipient_county.GetNameNoTier], chuyển nông nô và tiểu nông từ [actor_county.GetName] của ta sang vùng đất của [liege.GetFirstNamePossessiveNoTooltip].\n\nNhưng nông dân lại từ chối di chuyển. Mỗi gia đình bị ép dời đi giống như nhổ một chiếc răng, như thể họ #EMP phản đối#! việc bị tầng lớp trên điều chuyển."
  diarchy.1221.a:0 "Họ sẽ đi khi ta bảo họ đi."
  diarchy.1221.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
  diarchy.1221.b:0 "Có lẽ nếu ta đưa ra vài bảo đảm thích hợp?"
  diarchy.1221.b.tt.success:0 "Vàng thành công nơi thép thất bại"
  diarchy.1221.b.tt.failure:0 "Dân địa phương đoàn kết chống lại"
  diarchy.1221.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
  diarchy.1221.c:0 "Những gia đình giàu có hơn #EMP có thể#! phục vụ theo cách khác..."
  diarchy.1221.c.tt.success:0 "Một khoản thuế gọn gàng và sự đoàn kết địa phương bị phá vỡ"
  diarchy.1221.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
  diarchy.1221.c.tt.failure:0 "Danh tiếng gian dối của Ngài lan rộng"
  diarchy.1221.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
  diarchy.1221.d:0 "Bao nhiêu công sức chỉ để tặng tiền cho #EMP [liege.GetFirstNameNoTooltip]#!?"
  diarchy.1221.d.tt:0 "Thay vào đó Ngài nghỉ buổi chiều"
  diarchy.1221.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
  diarchy.1221.e:0 "Hừ, nếu họ yêu mảnh đất của mình đến vậy thì cứ để họ ở lại!"
  diarchy.1221.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

  diarchy.1231.t:0 "Một Xu Cũng Tính"
  diarchy.1231.desc:0 "Ủy nhiệm mà [liege.GetTitledFirstName] giao cho ta yêu cầu tìm nguồn thu cho ngai vàng, và một nguồn thu hiện đang bị khai thác quá ít chính là các tòa án. Các thẩm phán và quý tộc nhỏ phạt tội phạm vặt mỗi ngày nhưng lại giữ phần lớn số tiền.\n\n[exploitable_county.GetNameNoTier] đặc biệt đầy rẫy loại người này, và tăng tiền phạt cho các vi phạm của dân địa phương sẽ rất có lợi nhuận, dù cũng rất không được lòng dân."
  diarchy.1231.a:0 "Ai quan tâm họ nghĩ gì? Tội phạm thì vẫn là tội phạm."
  diarchy.1231.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
  diarchy.1231.b:0 "Ta nghĩ ta có thể tìm ra mức phạt cân bằng."
  diarchy.1231.b.tt.success:0 "Dân chúng không phàn nàn hơn trước"
  diarchy.1231.b.tt.failure:0 "Dân địa phương từ chối tuân theo"
  diarchy.1231.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
  diarchy.1231.c:0 "Tất cả công việc này chắc chắn cần chút thù lao..."
  diarchy.1231.c.tt.success:0 "$diarchy.1231.b.tt.success$"
  diarchy.1231.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
  diarchy.1231.c.tt.failure:0 "$diarchy.1231.b.tt.failure$"
  diarchy.1231.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
  diarchy.1231.d:0 "Chúng ta nên #EMP giảm#! tiền phạt, không phải tăng!"
  diarchy.1231.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
  diarchy.1231.e:0 "Việc này dường như vượt quá trách nhiệm của ta."
  diarchy.1231.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

  diarchy.1241.t:0 "Một Chủ Đề Thu Thuế"
  diarchy.1241.desc:1 "Một trong những nhiệm vụ của ta với tư cách [liege.GetDiarchTitle] là hoàn thành ủy nhiệm do [liege.GetTitledFirstName] giao, và hiện tại điều đó đòi hỏi tiền mặt.\n\nTa đã vắt óc tìm nguồn thu mới cho Vương quyền, và cứ quay lại một giải pháp rõ ràng nhưng hơi khác thường: [diarch.Custom('GetFaithTaxExemptInstitution')].\n\nTheo truyền thống được miễn hầu hết các loại thuế, nhưng một khoản thu đặc biệt đánh vào [diarch.Custom('GetFaithTaxExemptInstitution')] có thể mang lại lợi nhuận lớn. Chỉ là... không mấy sùng đạo."
  diarchy.1241.a:0 "[diarch.Custom('GetFaithTaxExemptInstitution')|U]? Họ đã hưởng lợi quá lâu rồi!"
  diarchy.1241.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
  diarchy.1241.b:0 "Một khoản thu đặc biệt cho chi phí cần thiết chắc không sao chứ?"
  diarchy.1241.b.tt.success:0 "Dù phàn nàn, họ vẫn nộp cống"
  diarchy.1241.b.tt.failure:0 "Tên Ngài bị nguyền rủa và túi tiền vẫn rỗng"
  diarchy.1241.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
  diarchy.1241.c:0 "Dĩ nhiên, phải bồi thường cho những ai bị thiệt hại bởi loại thuế này..."
  diarchy.1241.c.tt.success:0 "$diarchy.1241.b.tt.success$"
  diarchy.1241.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
  diarchy.1241.c.tt.failure:0 "$diarchy.1241.b.tt.failure$"
  diarchy.1241.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
  diarchy.1241.d:0 "Gây tranh cãi lớn chỉ để làm đầy ngân khố của [liege.GetFirstNamePossessiveNoTooltip]? Không đời nào."
  diarchy.1241.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
  diarchy.1241.e:0 "Ta không thể làm việc này. Ta #EMP sẽ không#! làm."
  diarchy.1241.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

 ##################################################
 # #Mandates - Promote Authority
  diarchy.1701.t:0 "Quyền Cai Trị"
  diarchy.1701.desc:1 "Là [liege.GetDiarchTitle] của [liege.GetTitledFirstNamePossessive], ta có nghĩa vụ phải tuân theo chỉ thị của [liege.GetHerHis] nhằm thúc đẩy quyền lực trung ương tại [liege.GetPrimaryTitle.GetNameNoTier].\n\nHôm nay, điều đó đã dẫn ta đến một phòng hội đồng căng thẳng, bị kẹt giữa [councillor_1.GetTitledFirstName] - [councillor_1.Custom('CouncilPosition')] và [councillor_2.GetTitledFirstName] - [councillor_2.Custom('CouncilPosition')] khi họ đang quát tháo nhau vì những việc cá nhân vụn vặt.\n\nTa đã hy vọng sẽ đạt được thỏa thuận để thông qua một vài đặc quyền mới cho [liege.GetTitleAsNameNoTooltip], nhưng ta chẳng tiến triển được gì cho đến khi cuộc tranh cãi này chấm dứt."
  diarchy.1701.a:0 "Ta nghĩ hai người đang hiểu sai nhau — để ta..."
  diarchy.1701.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
  diarchy.1701.b:0 "Thưa các ngài, chúng ta đang đi lạc đề..."
  diarchy.1701.b.tt.success:0 "Ngài kiểm soát lại cuộc trò chuyện"
  diarchy.1701.b.tt.failure:0 "Các cố vấn phớt lờ Ngài"
  diarchy.1701.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
  diarchy.1701.c:0 "[councillor_1.GetFirstNameNoTooltip] #EMP đúng#!, và Vương quyền ủng hộ [councillor_1.GetHerHim]."
  diarchy.1701.c.tt.success:0 "[councillor_1.GetFirstNameNoTooltip] đắc ý đón nhận sự ủng hộ"
  diarchy.1701.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
  diarchy.1701.c.tt.failure:0 "Ngài rõ ràng không hiểu cuộc tranh luận"
  diarchy.1701.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
  diarchy.1701.d:0 "#EMP Nhân danh [diarch.GetFaith.HighGodName], hai người#! #BER im miệng lại đi?!#!"
  diarchy.1701.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
  diarchy.1701.d.custom.both_councillors:0 "Cả hai cố vấn:"
  diarchy.1701.e:0 "Không biết họ có nhận ra nếu ta ngủ một giấc không..."
  diarchy.1701.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

  diarchy.1711.t:0 "Ngày Hết Hạn"
  diarchy.1711.desc:1 "\"Thành thật mà nói, ta tưởng chuyện này đã được giải quyết. Thỏa thuận của ta với [liege.GetTitledFirstName] đáng ra đã được cố định từ lần đàm phán nghĩa vụ trước\", [exploitable_vassal.GetTitledFirstName] lẩm bẩm. \"Ta không hiểu sao ngài có thể nói rằng ta đã làm vô hiệu lời thề của mình đến mức này? Lẽ ra lời nói phải ràng buộc mãi mãi chứ?\"\n\n[exploitable_vassal.GetSheHe|U] không hoàn toàn sai. Ta đang nắm bắt khoảng không với chuyện này, nhưng ta là [liege.GetDiarchTitle] và ủy nhiệm của ta rõ ràng như một ngày hè đẹp trời. Nếu lời thề của [exploitable_vassal.GetFirstNamePossessiveNoTooltip] bị vô hiệu một phần, thì [liege.GetTitleAsNameNoTooltip] sẽ có chỗ điều chỉnh chúng, và ta sẽ hoàn thành nhiệm vụ."
  diarchy.1711.a:0 "Chẳng phải ta nổi tiếng với trí tuệ công bằng và pháp lý sao?"
  diarchy.1711.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
  diarchy.1711.b:0 "Được rồi, hãy xem lại các lập luận lần nữa..."
  diarchy.1711.b.tt.success:0 "Lý thuyết pháp lý của Ngài không thể bác bỏ"
  diarchy.1711.b.tt.failure:0 "Lỗ hổng trong lập luận của Ngài quá rõ ràng"
  diarchy.1711.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
  diarchy.1711.c:0 "Vương quyền #EMP có thể#! chấp nhận bồi thường thay thế."
  diarchy.1711.c.tt.success:0 "[exploitable_vassal.GetFirstNameNoTooltip] trả tiền cho Ngài"
  diarchy.1711.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
  diarchy.1711.c.tt.failure:0 "Cả vương quốc nghe về sự gian dối của Ngài"
  diarchy.1711.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
  diarchy.1711.d:0 "Ngài có thể chậm hiểu đến mức nào nữa? Chuyện này đơn giản!"
  diarchy.1711.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
  diarchy.1711.e:0 "À thôi bỏ đi. Chuyện này không đáng."
  diarchy.1711.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

  diarchy.1721.t:0 "Giải Quyết Bất Bình"
  diarchy.1721.desc:1 "\"Ta thật sự không hiểu vì sao ngài lại muốn can dự, [diarch.GetFirstName]\", [exploitable_vassal.GetTitledFirstName] thở dài, \"dù sao thì bất bình của chúng ta cũng đâu nhằm vào ngài.\"\n\nKhông phải bí mật gì khi [exploitable_vassal.GetTitleAsNameNoTooltip] nuôi tham vọng trái với ý chí của [liege.GetTitledFirstName]. Những tham vọng có thể kéo cả vương quốc vào nội chiến thảm khốc nếu không bị ngăn chặn.\n\nVới tư cách [liege.GetDiarchTitle] của lãnh chúa, nhiệm vụ của ta là cố gắng xoa dịu căng thẳng giữa hai người, nhưng cho đến giờ [exploitable_vassal.GetSheHe] dường như miễn nhiễm trước mọi nỗ lực của ta."
  diarchy.1721.a:0 "Chẳng phải cả hai chúng ta đều đã thề với [liege.GetTitledFirstNameNoTooltip] sao?"
  diarchy.1721.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
  diarchy.1721.b:0 "Ngài nói đúng. Lâu đài của ta chắc chắn sẽ không phải nơi bị vây hãm đầu tiên."
  diarchy.1721.b.tt.success:0 "[exploitable_vassal.GetTitleAsNameNoTooltip] hiểu ý Ngài"
  diarchy.1721.b.tt.failure:0 "[exploitable_vassal.GetFirstNameNoTooltip] không hề bận tâm đến lời đe dọa"
  diarchy.1721.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
  diarchy.1721.c:0 "Ta có thể được thuyết phục để làm ngơ trước... hoạt động của ngài..."
  diarchy.1721.c.tt.success:0 "Ngài đổi lấy một lời hứa ràng buộc và một cống lễ nhỏ"
  diarchy.1721.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
  diarchy.1721.c.tt.failure:0 "Có lẽ họ #EMP thật sự#! có bất bình với Ngài"
  diarchy.1721.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
  diarchy.1721.d:0 "Suy cho cùng, chuyện này không phải vấn đề của #EMP ta#!."
  diarchy.1721.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
  diarchy.1721.e:0 "Can dự ư? Chỉ tò mò thôi! Đây chỉ là một cuộc thăm hỏi xã giao."
  diarchy.1721.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

  diarchy.1731.t:0 "Thanh Toán Sổ Sách"
  diarchy.1731.desc:1 "Đám đông tụ tập trước mặt ta, một nhóm hỗn tạp gồm những đại diện giận dữ từ [county_1.GetNameNoTier], [county_2.GetNameNoTier], và [county_3.GetNameNoTier], những thị trấn và làng mạc khác nhau nhưng united trong việc lên án [liege.GetTitledFirstName]. Là [liege.GetHerHis] [liege.GetDiarchTitle] kém may mắn, trách nhiệm của ta là cố gắng xoa dịu họ, đúng theo nhiệm vụ của mình.\n\nKhông có lãnh đạo trung tâm rõ ràng, đám đông la ó vào ta, hét lên những mối lo ngại và các sự việc được kể lại chi tiết quá mức "
  diarchy_1731.tt.affected_counties_removed:0 "[county_1.GetNameNoTier], [county_2.GetNameNoTier], & [county_3.GetNameNoTier] rời khỏi [faction.GetName|V]"
  diarchy.1731.a:0 "Làm ơn, hãy giữ phép lịch sự! Ta sẽ lắng nghe từng vấn đề của các ngươi."
  diarchy.1731.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
  diarchy.1731.b:0 "Các thần dân cao quý, chẳng lẽ chúng ta không thể tìm được lợi ích chung sao?"
  diarchy.1731.b.tt.success:0 "Ngươi làm dịu bớt cơn giận của họ"
  diarchy.1731.b.tt.failure:0 "Đám đông ném rau quả thối vào ngươi"
  diarchy.1731.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
  diarchy.1731.c:0 "Những vấn đề này thật nghiêm trọng! #EMP Ta#! sẽ không bao giờ cho phép điều này."
  diarchy.1731.c.tt.success:0 "Người dân tin rằng ngươi sẽ sửa chữa những bất công của họ"
  diarchy.1731.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
  diarchy.1731.c.tt.failure:0 "Chuyện này không phải về #EMP ngươi#!"
  diarchy.1731.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
  diarchy.1731.d:0 "Nhân danh cơn thịnh nộ tất yếu của [diarch.GetFaith.HighGodName], lũ ngu cận huyết các ngươi có thể #EMP im ngay#! không?!"
  diarchy.1731.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
  diarchy.1731.e:0 "Ừ, ừ. Tất cả chuyện này rồi cũng sẽ được giải quyết. Một lúc nào đó."
  diarchy.1731.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

  diarchy.1741.t:0 "Hãy Nhìn Theo Cách Này"
  diarchy.1741.desc:1 "\"Chúng tôi không phản đối mong muốn của [liege.GetTitledFirstNamePossessive]\", [councillor_1.GetTitledFirstName] lầm bầm, miệng nở nụ cười khinh bỉ, \"chỉ là không muốn làm nô lệ cho chúng. Điều đó không khó hiểu đến thế đâu\".\n\nTa đã dành phần lớn buổi chiều cố gắng cải thiện mối quan hệ giữa lãnh chúa và các hội đồng viên của [liege.GetHerHis], nhưng vô ích, phần lớn là nhờ vào sự bướng bỉnh của [councillor_1.GetWomanMan] ngu ngốc này.\n\nTa thở dài trong lòng. Ta là [liege.GetDiarchTitle], và nhiệm vụ của ta đòi hỏi phải thực hiện những bổn phận này."
  diarchy.1741.a:0 "Ta nghĩ ngươi đang bỏ qua việc [liege.GetTitleAsNameNoTooltip] đã làm bao nhiêu cho ngươi..."
  diarchy.1741.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
  diarchy.1741.custom.several_councillors:0 "Mọi cận thần có mặt\t"
  diarchy.1741.b:0 "Và các ngươi cũng không nên như vậy, nhưng phục vụ tốt hơn sẽ khuyến khích sự ban thưởng..."
  diarchy.1741.b.tt.success:0 "Ngươi khiến đồng liêu của mình hiểu ra"
  diarchy.1741.b.tt.failure:0 "Hội đồng vẫn đầy gai góc"
  diarchy.1741.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
  diarchy.1741.c:0 "Vương quyền không #EMP chỉ#! nằm ở [liege.GetTitleAsNameNoTooltip]."
  diarchy.1741.c.tt.success:0 "Hội đồng hiểu quan điểm của ngươi"
  diarchy.1741.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
  diarchy.1741.c.tt.failure:0 "Rõ ràng ngươi chỉ đang làm màu"
  diarchy.1741.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
  diarchy.1741.d:0 "Không khó sao? Chính xác là ngươi đang ám chỉ #EMP điều gì#! vậy, đồ [councillor_1.Custom2('InsultNoun', ROOT.Char)]?"
  diarchy.1741.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
  diarchy.1741.e:0 "Chúng ta sẽ không bao giờ đạt được tiếng nói chung."
  diarchy.1741.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

 ##################################################
 # #Mandates - Swell Armies
  diarchy.2201.t:0 "Gọi Thanh Niên Ra Trận"
  diarchy.2201.desc:1 "Người dân địa phương của [exploitable_county.GetNameNoTier] phải cung cấp một số lượng binh lính nhất định cho [liege.GetTitledFirstName], và họ vẫn làm như vậy mỗi khi được yêu cầu.\n\nTuy nhiên điều đó không có nghĩa là toàn bộ những người trong độ tuổi chiến đấu ở khu vực đều được huy động, và các cuộc điều tra gần đây của ta với tư cách [liege.GetDiarchTitle] cho thấy nghĩa vụ của họ gần như #EMP nhẹ đến đáng kinh ngạc#!. Số lượng chúng ta có thể tuyển quân gần như vượt xa những đội quân nhỏ bé thực sự được huy động.\n\nDân địa phương phản đối, nhưng nhiệm vụ của ta vẫn thúc đẩy ta tiếp tục."
  diarchy.2201.a:0 "Chỉ cần cầm được giáo thì cũng có thể chết vì giáo!"
  diarchy.2201.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
  diarchy.2201.b:0 "Hãy cho lũ nông dân biết đây là cơ hội để chúng kiếm được #EMP chiến lợi phẩm#!."
  diarchy.2201.b.tt.success:0 "Ngươi kích thích trí tưởng tượng của nông dân"
  diarchy.2201.b.tt.failure:0 "Dân địa phương bỗng dưng què chân hàng loạt"
  diarchy.2201.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
  diarchy.2201.c:0 "Ta chắc rằng những kẻ giàu có hơn sẽ trả tiền để được bỏ qua..."
  diarchy.2201.c.tt.success:0 "Thêm một chút thuế, thêm vài lính nghĩa vụ"
  diarchy.2201.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
  diarchy.2201.c.tt.failure:0 "Những lời oán trách cay đắng theo sau"
  diarchy.2201.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
  diarchy.2201.d:0 "Những người này đã hoàn thành nghĩa vụ của họ. Thế là đủ."
  diarchy.2201.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
  diarchy.2201.e:0 "Ta sẽ không làm việc bẩn thỉu này cho [liege.GetTitleAsNamePossessiveNoTooltip]."
  diarchy.2201.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

  diarchy.2211.t:0 "Một Tài Năng Hiếm Có"
  diarchy.2211.desc:1 "Một chiến binh có tài năng hiếm thấy đang đi ngang qua [hedge_knight_location.GetNameNoTier], người mà thanh kiếm của họ chắc chắn sẽ rất được coi trọng trong quân đội của [liege.GetTitledFirstNamePossessive].\n\nNhiệm vụ của ta với tư cách [liege.GetDiarchTitle] yêu cầu ta phải chú ý tìm kiếm những cá nhân như vậy, và ta đã gửi vô số lời mời đến [hedge_knight.GetFirstName], cố gắng chiêu mộ [hedge_knight.GetHerHim] cho lãnh chúa của mình.\n\nChỉ có điều chiến binh lang bạt ấy dường như không quá hào hứng với ý nghĩ thề dâng thanh kiếm của [hedge_knight.GetHerHis] cho mục tiêu của chúng ta, lần lượt từ chối mọi sứ giả."
  diarchy.2211.a:0 "Một $knight_culture_player_no_tooltip_lowercase$ tầm thường rồi #EMP cũng sẽ#! đồng ý phục vụ. Sớm hay muộn thôi."
  diarchy.2211.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
  diarchy.2211.b:0 "Có lẽ ta nên tự mình thuyết phục [hedge_knight.GetFirstNameNoTooltip]?"
  diarchy.2211.b.tt.success:0 "Lời nói của ngươi khiến [hedge_knight.GetHerHim] lay chuyển"
  diarchy.2211.b.tt.failure:0 "Lời khẩn cầu của ngươi rơi vào tai điếc"
  diarchy.2211.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
  diarchy.2211.c:0 "Có lẽ vấn đề là ở [liege.Custom('MistressMaster')] tiềm năng..."
  diarchy.2211.c.tt.success:0 "Ngươi dụ dỗ [hedge_knight.GetFirstNameNoTooltip] vào phục vụ mình"
  diarchy.2211.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
  diarchy.2211.c.tt.failure:0 "[hedge_knight.GetSheHe|U] chẳng muốn dính dáng gì tới ngươi"
  diarchy.2211.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
  diarchy.2211.d:0 "Toàn bộ chuyện này khiến ta lo lắng!"
  diarchy.2211.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
  diarchy.2211.e:0 "Cứ để [hedge_knight.GetHerHim] đi, [hedge_knight.GetSheHe] rõ ràng không hứng thú."
  diarchy.2211.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

  diarchy.2221.t:0 "Tiền Thưởng Quân Sự"
  diarchy.2221.desc:1 "Những khu định cư lớn của [liege.GetPrimaryTitle.GetNameNoTier] có vô số nơi để tuyển mộ lính đánh thuê. Quảng trường chợ nơi ta đang đứng, ném một túi tiền cho đám đông trước mặt, chỉ là một trong số đó.\n\nThông thường, những nhóm chiến binh tạm bợ này sẽ bị sáp nhập vào các đoàn lính đánh thuê lớn hơn hoặc được thuê để tăng cường quân riêng của các lãnh chúa nhỏ khi chiến tranh xảy ra, một cách sắp xếp khá kém hiệu quả.\n\nNhiệm vụ của ta với tư cách [liege.GetDiarchTitle] yêu cầu ta phải tăng cường quân đội của [liege.GetTitledFirstName], và vì vậy ta thấy mình đang cố gắng tuyển mộ họ trực tiếp hơn."
  diarchy.2221.a:0 "Chỗ tiền này chẳng đáng gì so với chiến lợi phẩm các ngươi sẽ kiếm được!"
  diarchy.2221.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
  diarchy.2221.b:0 "Chỗ bạc này chỉ là nếm thử kho bạc của [liege.GetTitledFirstNamePossessiveNoTooltip]!"
  diarchy.2221.b.tt.success:0 "Tiền được chi tiêu xứng đáng"
  diarchy.2221.b.tt.failure:0 "Một khoản đầu tư tồi"
  diarchy.2221.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
  diarchy.2221.c:0 "Phục vụ ta hay phục vụ [liege.GetTitleAsNameNoTooltip], đằng nào các ngươi cũng sẽ được #EMP trả công#!."
  diarchy.2221.c.tt.success:0 "Một lứa binh sĩ tốt"
  diarchy.2221.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
  diarchy.2221.c.tt.failure:0 "Chỉ có lác đác vài người nhập ngũ"
  diarchy.2221.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
  diarchy.2221.d:0 "Quay lưng và rời đi trước ánh mắt của họ."
  diarchy.2221.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
  diarchy.2221.e:0 "Dĩ nhiên, ta chắc các ngươi có thể tự chọn chủ thuê cho mình..."
  diarchy.2221.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

  diarchy.2231.t:0 "Một Cách Dùng Tốt Hơn Cho Ngươi"
  diarchy.2231.desc:1 "Nhà tù và tòa án của [exploitable_county.GetNameNoTier] gần đây đang xử lý số lượng tội phạm cao một cách đáng tiếc. Trong hoàn cảnh bình thường, công lý sẽ nhanh chóng định đoạt số phận của những Bạn ta, rồi chúng sẽ bị thả ra vùng hoang dã hoặc xuống mồ.\n\nMay mắn cho chúng, nhiều kẻ trong số đó có kinh nghiệm đáng kể với kiếm hoặc cung, và nhiệm vụ của ta với tư cách [liege.GetDiarchTitle] yêu cầu ta phải tìm kiếm binh lính mới. Giải pháp khó chịu là cho chúng phục vụ trong quân đội của [liege.GetTitledFirstNamePossessive] dường như quá rõ ràng, và dù điều này mang lại nhiều tên cướp cứng cỏi và thợ săn mắt tinh, ý tưởng ấy khiến dân chúng nổi giận."
  diarchy.2231.a:0 "Cứ tiếp tục; những lời phàn nàn này rồi sẽ qua."
  diarchy.2231.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
  diarchy.2231.b:1 "Có lẽ ta chỉ cần chọn những kẻ giỏi nhất?"
  diarchy.2231.b.tt.success:0 "Một sự cân bằng được thiết lập"
  diarchy.2231.b.tt.failure:0 "Hầu hết tội phạm bỏ trốn ngay khi có thể"
  diarchy.2231.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
  diarchy.2231.c:0 "Có lẽ chúng hữu ích hơn khi không ghi sổ..."
  diarchy.2231.c.tt.success:0 "Một nhóm bạo lực được hình thành"
  diarchy.2231.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
  diarchy.2231.c.tt.failure:0 "$diarchy.2231.b.tt.failure$"
  diarchy.2231.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
  diarchy.2231.d:0 "Ta #EMP không thể#!. Đây sẽ là sự bóp méo của công lý!"
  diarchy.2231.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
  diarchy.2231.e:0 "Chuyện này quá gây tranh cãi."
  diarchy.2231.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

  diarchy.2241.t:0 "Sàng Lọc Lúa Mì Khỏi Rơm Rạ"
  diarchy.2241.desc:1 "Nhiệm vụ mà [liege.GetTitledFirstName] giao cho ta yêu cầu rằng, với tư cách [liege.GetHerHis] [liege.GetDiarchTitle], ta phải thường xuyên tìm nguồn binh lính mới cho [liege.GetHerHim].\n\nVậy thì còn nơi nào tốt hơn để bắt đầu ngoài đám lính nghĩa vụ được tổ chức lỏng lẻo của [exploitable_vassal.GetTitledFirstName]? Ta và các tùy tùng đã tập hợp dân địa phương để đánh giá, nhưng vẫn đang chật vật để đưa đủ người đạt đến tiêu chuẩn mà thậm chí #EMP đáng#! để gọi họ nhập ngũ trong tương lai."
  diarchy.2241.a:0 "Theo ta, binh sĩ! Nhìn đây!"
  diarchy.2241.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
  diarchy.2241.b:0 "Nào lũ ngốc kia, ta sẽ rèn các ngươi thành hình!"
  diarchy.2241.b.tt.success:0 "Ngươi khiến họ nhanh như dòng sông chảy xiết"
  diarchy.2241.b.tt.failure:0 "Và họ hóa ra chỉ là một bọn vô dụng đáng thương"
  diarchy.2241.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
  diarchy.2241.c:0 "Tiện thể ta cũng nên tự luyện tập..."
  diarchy.2241.c.tt.success:0 "Một chút huấn luyện thêm mang lại kết quả lớn"
  diarchy.2241.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
  diarchy.2241.c.tt.failure:0 "Mất tập trung, ngươi làm bong gân thứ gì đó quan trọng"
  diarchy.2241.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
  diarchy.2241.d:0 "Rời đi mà không nói lời nào."
  diarchy.2241.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
  diarchy.2241.e:0 "Đây là sự lãng phí thời gian #EMP hoàn toàn#! của ta."
  diarchy.2241.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

 ##################################################
 # #Overthrow Diarch Scheme Events
  diarchy.0511.t:0 "$overthrow_regent$: Thất Bại"
  diarchy.0511.desc.intro:0 "Chết tiệt cái thân da dày của [target.GetHerHis], [target.GetTitledFirstName] đã thoát khỏi đám côn đồ của ta, "
  diarchy.0511.desc.discovered:0 "và tệ hơn nữa, một trong những tên đó bị bắt và đã #EMP khai sạch#! khi bị thẩm vấn. Cả [target.GetFirstNameNoTooltip] lẫn [liege.GetTitledFirstName] đều biết chính xác ta đã cố làm gì!"
  diarchy.0511.desc.undiscovered:0 "nhưng ít nhất bọn lính đánh thuê đã kịp chết trước khi bị bắt.\n\nKhông có dấu vết nào dẫn ngược về ta, ít nhất là không trực tiếp, vì vậy [target.GetFirstNameNoTooltip] hay [liege.GetTitledFirstName] cũng chẳng có gì để buộc tội ta."
  diarchy.0511.desc.outro:0 "\n\nTạm thời, [target.GetDiarchTitle] của vương quốc vẫn không thay đổi."
  diarchy.0511.a:0 "Bah, chuyện này thật vô nghĩa."
  diarchy.0511.b:0 "Lần nữa. Lần sau ta sẽ tóm được [liege.GetHerHim]."
 
  diarchy.0521.t:0 "Gửi đến vị cao quý [liege.GetTitledFirstName],"
  diarchy.0521.desc.discovered:0 "Tên vô lại [owner.GetTitledFirstName] đã cố bắt cóc Ta, và tịch thu các công cụ chức vụ của Ta cùng với Ta!\n\nRõ ràng [owner.GetSheHe] định ép Ta rời chức, rồi tự biến [owner.GetHerselfHimself] thành [liege.GetDiarchTitle] của ngài. Tội ác ghê tởm này không thể không bị trừng phạt."
  diarchy.0521.desc.undiscovered:0 "Ta viết thư để thông báo rằng đã có một nỗ lực tước đoạt tự do của Ta — một nhóm côn đồ đã cố bắt cóc Ta cùng các biểu tượng chức vụ.\n\nAi đã trả tiền cho chúng thì chưa rõ, nhưng âm mưu thì quá hiển nhiên. Kiểm soát được thân thể Ta và biểu tượng của Ta với tư cách [liege.GetDiarchTitle] có thể cho phép kẻ đứng sau chiếm đoạt vị trí chính đáng của Ta."
  diarchy.0521.a:0 "Ta thật kinh hãi!"
  diarchy.0521.b:0 "Đáng lo ngại..."

  diarchy.0531.t:0 "$overthrow_regent$: Âm Mưu Thất Bại"
  diarchy.0531.desc.intro:0 "Ta trượt quanh hành lang, tiếng chiến đấu vẫn vang trong tai. Lũ lính đánh thuê khốn kiếp ấy dường như xuất hiện từ chính các bức tường! Không có vũ khí trong tay, chỉ nhờ sự can thiệp kịp thời của lính gác mà ta mới thoát được.\n\n"
  diarchy.0531.desc.discovered:0 "Sau khi thẩm vấn, một tên côn đồ bị bắt đã tiết lộ kẻ thuê chúng: không ai khác ngoài [target.Custom2('MyCharacterIntroduction', owner)]!"
  diarchy.0531.desc.undiscovered:0 "Chỉ một hai phút sau, tất cả chúng đều chết, và bí mật về kẻ thuê chúng cũng chết theo."
  diarchy.0531.desc.outro:0 "\n\nRõ ràng việc trở thành [target.GetDiarchTitle] đã khiến ta trở thành mục tiêu. Ta đáng lẽ phải biết..."
  diarchy.0531.a.paranoid:0 "Vậy #EMP đúng là#! có âm mưu! Ta biết mà!"
  diarchy.0531.a.trusting:0 "Làm sao... làm sao có ai có thể làm chuyện này?"
  diarchy.0531.a.scheme_discovered:0 "[owner.GetFirstNameNoTooltip], đồ khốn!"
  diarchy.0531.a.scheme_secret:0 "Sẽ còn một lần nữa. Ta chắc chắn."
 
  diarchy.0551.t:0 "$overthrow_regent$: Thành Công"
  diarchy.0551.desc:0 "Một kế hoạch đơn giản và hiệu quả. Một nhóm lính đánh thuê do ta thuê đã bắt giữ cựu-[owner.GetDiarchTitle] trong văn phòng của [target.GetHerHis], tống khứ [target.GetWomanMan] này ra khỏi tòa nhà với còng tay và một chiếc bao tải cũ trùm lên đầu.\n\nVới rất ít máu đổ, và sử dụng những con dấu lấy trực tiếp từ bàn làm việc của [target.GetTitledFirstNamePossessive], ta đã chuẩn bị một bản thú tội cho hàng loạt tội danh để hợp thức hóa việc chuyển giao quyền lực. Đủ để khiến mọi thứ trở nên chính thống, ngay cả khi nó có thể gây cho ta vài rắc rối với [liege.GetTitledFirstName] trong tương lai.\n\nTất nhiên, ta chắc chắn sẽ gửi bản thảo cho [target.GetFirstNameNoTooltip]. Một thứ gì đó để nghiền ngẫm trong lúc [target.GetHerHis] bị giam cầm."
  diarchy.0551.a:0 "Trơn tru như lụa."
 
  diarchy.0561.t:0 "Gửi đến vị cao quý [liege.GetTitledFirstName]"
  diarchy.0561.desc:0 "Ta vui mừng thông báo rằng [target.GetTitledFirstName] đã từ bỏ vị trí [liege.GetDiarchTitle] của [target.GetHerHis] cho Ta sau một cuộc trao đổi ngắn gọn nhưng khá sôi nổi.\n\nVì trách nhiệm đã đè nặng lên [target.GetHerHim], nên [target.GetSheHe] sẽ ở lại cùng Ta trong suốt nhiệm kỳ của Ta với tư cách [liege.GetDiarchTitle]. Vì sức khỏe của [target.GetHerHis]."
  diarchy.0561.a:0 "Hiện tại thì cứ vậy đã..."

  diarchy.0571.t:0 "$overthrow_regent$: Bị Giam"
  diarchy.0571.desc.intro:0 "#EMP Đầu ta#!. Ta... ta đang ở đâu? [owner.GetTitledFirstName]?\n\n"Thật vui khi thấy ngươi vẫn còn sống, [target.GetFirstName]", [owner.GetSheHe] cười nhếch mép, ném một xấp giấy xuống chân ta, "để ngươi đọc đấy. Đây là danh sách những tội ác mà ngươi đã thú nhận khi còn là [owner.GetDiarchTitle] trước khi trao chức vụ cho ta. Nghĩ rằng ngươi sẽ muốn một bản."\n\n"
  diarchy.0571.desc.outro.blind:0 "Ta không cần nhìn thấy những lời dối trá nguệch ngoạc đó để biết quy mô bịa đặt của [owner.GetHerHis], hay hiểu rằng chúng đã được lan truyền khắp [liege.GetPrimaryTitle.GetBaseNameNoTier]."
  diarchy.0571.desc.outro.sighted:0 "Ta hoảng loạn lật qua từng trang chữ viết nguệch ngoạc, hết trang này đến trang khác đầy những bịa đặt trắng trợn và diễn giải ác ý. Ta muốn phủ nhận, phủ nhận tất cả, nhưng ta biết giờ đây nó đã lan khắp [liege.GetPrimaryTitle.GetBaseNameNoTier]."
  diarchy.0571.a:0 "[liege.GetTitledFirstNameNoTooltip] sẽ nghe về chuyện này! [liege.GetSheHe|U] sẽ biết!"

 ##################################################
 # #Interactions
  diarchy.8001.t: "[recipient.Custom2('AppropriateGreeting', actor )]"
  diarchy.8001.desc: "Yêu cầu của ngươi về việc dẫn đầu một cuộc viễn chinh nhân danh cả hai chúng ta có lý, vì vậy ta ban cho ngươi sự chấp thuận. Ngươi có thể sử dụng tài nguyên của các tổng đốc của chúng ta khi cần.\n\nCầu cho kẻ thù run sợ và tan vỡ trước hàng ngũ của ngươi."
  diarchy.8001.a: "Vì [actor.Custom('GetBestEmpireWithAdjective')]!"
  getbestempirewithadjective.rome: "La Mã Huy Hoàng"
  getbestempirewithadjective.mongolia: "Mông Cổ Vô Tận"
  getbestempirewithadjective.outremer: "Outremer Phước Lành"
  getbestempirewithadjective.slavia: "Slavia Bao La"
  getbestempirewithadjective.great_armenia: "Đại Armenia"
  getbestempirewithadjective.india: "Ấn Độ Vô Biên"
  getbestempirewithadjective.the_empire: "Đế Chế Hùng Mạnh"

  diarchy.8002.t: "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
  diarchy.8002.desc: "Ta thà tự kề dao vào cổ mình còn hơn đồng ý để #EMP ngươi#! điều khiển một đạo quân như vậy ngoài tầm giám sát của ta.\n\nYêu cầu của ngươi bị từ chối — và chuyện này coi như #EMP kết thúc#!."
  diarchy.8002.a: "Đồ ngu thiển cận!"

  diarchy.8003.t: "[actor.Custom2('AppropriateGreeting', recipient )]"
  diarchy.8003.desc: "Dù chúng ta dĩ nhiên cùng cai trị, nhưng ngươi chắc hẳn nhớ rằng ngươi #EMP nợ#! ta. Ta sẽ dùng ân huệ đó ngay bây giờ, và đổi lại ngươi sẽ toàn tâm ủng hộ cuộc viễn chinh sắp tới của ta nhằm chiếm lãnh thổ từ vùng đất của ngoại bang."
  diarchy.8003.a: "Tên ngạo mạn khốn kiếp!"

  diarchy.8004.t.vetoed: "Cuộc Viễn Chinh Đế Chế Bị Hủy"
  diarchy.8004.t.planned: "Cuộc Viễn Chinh Đế Chế Được Lên Kế Hoạch"
  diarchy.8004.desc.vetoed: "Những lời thì thầm từ hoàng cung trong nhiều tháng qua cho thấy Đồng-[recipient.GetTitleAsNameNoTooltip] [actor.GetFirstName] đã thúc đẩy việc phát động một cuộc phiêu lưu hùng mạnh từ quân đội của [recipient.GetPrimaryTitle.GetDefinitiveName], nhằm chiếm đoạt các tước hiệu từ vùng biên cương.\n\nĐột nhiên và dứt khoát, những tin đồn này hiện đã chấm dứt.\n\nCó vẻ như [recipient.GetTitleAsNameNoTooltip] cấp cao [recipient.GetFirstName] không tin tưởng vào động cơ của đồng nghiệp cấp dưới của [recipient.GetHerHis]."
  diarchy.8004.desc.planned: "Không còn là bí mật rằng triều đình đế quốc đang xôn xao với những lời bàn về một cuộc viễn chinh quân sự lớn, đưa quân đội đế quốc tấn công một quốc gia biên giới bất hạnh để giành vinh quang và lãnh thổ.\n\nNhững lời bàn như vậy không hiếm, nhưng thường vô nghĩa — chỉ là lần này thì không. Đồng-[recipient.GetTitleAsNameNoTooltip] [actor.GetFirstName] dường như đang chỉ đạo một nỗ lực nghiêm túc, với sự cho phép của [recipient.GetTitleAsNameNoTooltip] cấp cao [recipient.GetFirstNamePossessive], nhằm mở rộng biên giới.\n\n"
  diarchy.8004.desc.planned.forced: "Theo lời đồn đại, [actor.GetFirstNameNoTooltip] đã có thể ép buộc đồng nghiệp cấp cao của [actor.GetHerHis] thực hiện việc này."
  diarchy.8004.desc.planned.allowed: "Việc [recipient.GetTitleAsNameNoTooltip] cấp cao sẵn sàng giao quân của [recipient.GetHerHis] cho [actor.GetFirstNameNoTooltip] chắc chắn là dấu hiệu của sự tin tưởng lớn giữa hai người."
  diarchy.8004.a.vetoed: "Ít nhất chúng ta đã tránh được chiến tranh..."
  diarchy.8004.a.allowed: "Những vùng đất mới để tranh giành..."

  diarchy.8005.t: "[attacker.Custom2('AppropriateGreeting', ROOT.Char )]"
  diarchy.8005.desc.boilerplate: "Với tư cách [attacker.GetLiege.GetTitleAsNameNoTooltip] của ngươi, ta đang huy động một cuộc viễn chinh chống lại lũ chó hèn nhát của [defender.GetPrimaryTitle.GetDefinitiveName]."
  diarchy.8005.desc: "$diarchy.8005.desc.boilerplate$\n\nLãnh địa của ngươi giáp với vùng đất mà chúng ta muốn chiếm, điều đó nghĩa là ngươi có nghĩa vụ hỗ trợ. Ta yêu cầu ngươi lập tức gửi binh lính ra tiền tuyến!"
  diarchy.8005.a: "Một lần nữa xông lên chiến tuyến!"
  diarchy.8005.b: "Ta sẽ không dính líu vào sự ngu xuẩn của #EMP Đồng#!-[attacker.GetLiege.GetTitleAsNamePossessiveNoTooltip]."

  diarchy.8006.t: "[attacker.Custom2('AppropriateGreeting', ROOT.Char )]"
  diarchy.8006.desc: "$diarchy.8005.desc.boilerplate$ Dù lãnh địa của ngươi không giáp mặt trận, ngươi #EMP vẫn là#! một trong những quản trị quân sự nổi bật của chúng ta.\n\nQuân của ngươi được chào đón tham chiến, nếu ngươi muốn phần vinh quang của riêng mình."
  diarchy.8006.a: "$diarchy.8005.a$"
  diarchy.8006.b: "$diarchy.8005.b$"
 
  diarchy.8011.t: "Một Cuộc Viễn Chinh Huy Hoàng!"
  diarchy.8011.desc.all_titles_legally_yours: "Chiến tranh đã kết thúc và bụi khói đã lắng xuống, ta nhìn những vùng đất đã chiếm được cho đế quốc... và nhận ra rằng mỗi vùng đất ấy #EMP trùng hợp thay#! đã rõ ràng nằm trong quyền tài phán của ta.\n\nCó lẽ sẽ không có thêm vinh quang nào từ những mánh khóe lén lút như vậy, nhưng cũng không thể có lời phàn nàn nghiêm túc nào.\n\nRốt cuộc, mọi thứ đều hoàn toàn hợp pháp."
  diarchy.8011.desc.fallback: "Chiến tranh đã kết thúc, đất đai của [defender.GetTitledFirstNamePossessive] bị tàn phá, và biên cương lại được đẩy lùi thêm một lần nữa.\n\nGiờ đây điều còn lại chỉ là quyết định phải xử lý các lãnh thổ bị chinh phục ra sao.\n\nTheo lẽ phải, chúng #EMP nên#! được trao cho [attacker.GetLiege.GetTitledFirstName], bề trên của ta, để phân phát — một việc #EMP chắc chắn#! sẽ gia tăng ảnh hưởng của ta tại [attacker.GetLiege.GetCapitalLocation.GetTitle.GetBaseNameNoTier] — nhưng ta chẳng phải là Đồng-[attacker.GetLiege.GetTitleAsNameNoTooltip] sao? Chẳng phải ta cũng có thể tự giữ và phân phát chúng, hoặc bổ nhiệm những người bản địa biết ơn cơ hội mà ta ban cho họ?"
  diarchy.8011.a: "Ta đã chinh phục những lãnh thổ này, và ta sẽ giữ chúng."
  diarchy.8011.tt.all_lands_remain_in_your_custody: "Ngài giữ tất cả [vassals|E] và [titles|E] đã chiếm được, nhưng không nhận [influence_i][influence|E]"
  diarchy.8011.b: "Chúng ta chiến đấu vì đế quốc, và chiến lợi phẩm thuộc về nó!"
  diarchy.8011.tt.distribution.lands_given_to_emperor: "Các lãnh thổ bị chinh phục được chuyển cho [attacker.GetLiege.GetTitledFirstName]"
  diarchy.8011.c: "Có lẽ ta có thể giữ lại #EMP một#! chiến lợi phẩm..."
  diarchy.8011.tt.distribution.reserve_prize: "Các lãnh thổ bị chinh phục được chuyển cho [attacker.GetLiege.GetTitledFirstName] — ngoại trừ [prize_county.GetBaseNameNoTier] và mọi thứ trong [duchy|E] của nó"
  diarchy.8011.d: "Các tổng đốc tạm quyền sẽ quản lý vùng đất mới của chúng ta."
  diarchy.8011.tt.distribution.interim_governors: "Các lãnh thổ bị chinh phục được trao cho những [characters|E] bản địa phù hợp"
  diarchy.8011.tt.distribution.interim_governors.hook_and_opinion: "Ngài nhận một [hook|E] ân huệ từ mỗi tổng đốc mới"
  diarchy.8011.e: "Thật là một sự trùng hợp thuận tiện."
  diarchy.8011.e.tt.keep_everything_but_legally: "Ngài giữ toàn bộ vùng đất đã giành được — và không ai có thể nói điều đó là không công bằng"
  diarchy_8011.turn_over_titles.tt.titles_to_transfer_all: "[attacker.GetShortUIName|U] nhận[_s(attacker)] [influence_i][attacker.MakeScope.ScriptValue('request_imperial_expedition_influence_from_counties_full_value')|P0] [influence|E] cho các [counties|E] được chuyển giao"
  diarchy_8011.turn_over_titles.tt.vassals_to_transfer_all: "[attacker.GetShortUIName|U] nhận[_s(attacker)] [influence_i][attacker.MakeScope.ScriptValue('request_imperial_expedition_influence_from_vassals_full_value')|P0] [influence|E] cho các [vassals|E] được chuyển giao"
  diarchy_8011.turn_over_titles.tt.titles_to_transfer_prize: "[attacker.GetShortUIName|U] nhận[_s(attacker)] [influence_i][attacker.MakeScope.ScriptValue('request_imperial_expedition_influence_from_vassals_prize_value')|P0] [influence|E] cho các [counties|E] được chuyển giao"
  diarchy_8011.turn_over_titles.tt.vassals_to_transfer_prize: "[attacker.GetShortUIName|U] nhận[_s(attacker)] [influence_i][attacker.MakeScope.ScriptValue('request_imperial_expedition_influence_from_counties_prize_value')|P0] [influence|E] cho các [vassals|E] được chuyển giao"
  diarchy_8011.turn_over_titles.tt.interim_governors.county: "[attacker.GetShortUIName|U] nhận[_s(attacker)] [influence_i][attacker.MakeScope.ScriptValue('request_imperial_expedition_influence_from_counties_reduced_value')|P0] [influence|E] cho các [counties|E] được chuyển giao"
  diarchy_8011.turn_over_titles.tt.interim_governors.vassal: "[attacker.GetShortUIName|U] nhận[_s(attacker)] [influence_i][attacker.MakeScope.ScriptValue('request_imperial_expedition_influence_from_vassals_reduced_value')|P0] [influence|E] cho các [vassals|E] được chuyển giao"

  diarchy.8012.t: "[attacker.Custom2('AppropriateGreeting', ROOT.Char )]"
  diarchy.8012.desc.keeping_all: "Ngài hẳn sẽ hài lòng khi biết rằng cuộc chiến của ta diễn ra rất thuận lợi — thực ra là #EMP cực kỳ#! thuận lợi.\n\nTuy nhiên, các lãnh thổ bị chinh phục vẫn cần một bàn tay vững vàng dẫn dắt trong một thời gian nữa, vì vậy ta sẽ ở lại để đảm bảo việc cai trị của chúng."
  diarchy.8012.desc.turning_over_all: "Vinh quang tô điểm cho [attacker.Custom('GetBestEmpireWithAdjective')] hôm nay, và đặc biệt là cho chúng ta! Cuộc viễn chinh của chúng ta đã thành công rực rỡ, và những vùng đất ta đã khuất phục giờ đây nằm trong tay ngài.\n\nChúc cho quan hệ hợp tác tốt đẹp!"
  diarchy.8012.desc.turning_over_most: "Hôm nay chúng ta đã nếm trải chiến thắng ngọt ngào nhất! Khi chiến tranh đã thắng lợi, ta đã cử các quan quản trị dưới quyền ngài đến hầu hết các lãnh thổ bị chinh phục.\n\nMong ngài đừng trách ta giữ lại phần thưởng nhỏ bé là [prize_county.GetBaseNameNoTier] cùng những vùng đất phụ cận của nó. Một sự bù đắp nhỏ cho máu và vàng ta đã bỏ ra."
 # Death to the Corpse Emperor, etc.
  diarchy.8012.desc.interim_governors: "Sự hỗn loạn của chiến tranh đã nhường chỗ cho chiến thắng đế quốc ngọt ngào, và ta vui mừng tuyên bố rằng cuộc viễn chinh của chúng ta đã thành công!\n\nVì lợi ích của sự nhanh chóng, ta đã giao các lãnh thổ bị chinh phục cho một số tổng đốc địa phương. Họ chắc chắn sẽ phục vụ Chúng Ta trung thành cho đến khi Chúng Ta thấy phù hợp để thay thế họ — cùng nhau."
  diarchy.8012.desc.legal_shenanigans: "Ta vui mừng báo cáo rằng cuộc chiến của chúng ta đã thành công! Những lãnh thổ được giải phóng — mà cả hai ta đều đồng ý rằng vốn dĩ thuộc về các vùng đất dưới quyền tước vị của ta — chắc chắn sẽ phát triển thịnh vượng dưới sự quản trị của ta.\n\nDĩ nhiên, nếu có điều gì khác, ngài biết rằng ta sẽ giao lại cho ngài, nhưng tiếc thay..."
  diarchy.8012.tt.keeping_all: "[attacker.GetFirstName] giữ lại mọi thứ #WEAK (tạm thời)#!, nhưng không nhận [influence|E]"
  diarchy.8012.tt.turning_over_all: "[attacker.GetFirstName] giao toàn bộ [titles|E] và [vassals|E] đã chinh phục cho Ngài"
  diarchy.8012.tt.turning_over_most: "[attacker.GetFirstName] giao phần lớn [titles|E] và [vassals|E] đã chinh phục cho Ngài, nhưng giữ lại một [duchy|E] cho [attacker.GetHerselfHimself]"
  diarchy.8012.tt.interim_governors: "[attacker.GetFirstName] đã bổ nhiệm các tổng đốc địa phương #WEAK (tạm thời)#! để kiểm soát các lãnh thổ bị chinh phục"
  diarchy.8012.tt.legal_shenanigans: "[attacker.GetFirstName] giữ lại mọi thứ — tất cả [titles|E] và [vassals|E] dù sao cũng thuộc quyền tài phán của [attacker.GetHerHis|E]"
  diarchy.8012.desc.a.keeping_all: "#EMP Tên vô ơn xấc xược đó!#!"
  diarchy.8012.desc.a.turning_over_all: "À, cai trị ở mức tốt nhất."
  diarchy.8012.desc.a.turning_over_most: "Chấp nhận được."
  diarchy.8012.desc.a.interim_governors: "Hmm, ta đoán cũng có lý."
  diarchy.8012.desc.a.legal_shenanigans: "Khá khôn ngoan đấy, [attacker.GetFirstNameNoTooltip]. Rất khôn ngoan."

  diarchy.8022.t: "Tàn Phế Chính Trị: Bị Phế Truất"
  diarchy.8022.t.dead: "Hành Quyết Chính Trị"
  diarchy.8022.desc.intro: "Chỉ có hai cách để thật sự loại bỏ ai đó khỏi ngai vàng đế quốc một khi họ đã ngồi lên đó: cái chết hoặc sự tàn phế.\n\n"
  diarchy.8022.desc.dead: "Thật không may cho Đồng-[actor.GetTitleAsNameNoTooltip] [recipient.GetFirstName], [actor.GetTitleAsNameNoTooltip] Cấp Cao [actor.GetFirstName] đã chọn con đường #EMP chắc chắn hơn#! trong hai cách."
  diarchy.8022.desc.maimed: "May mắn cho Đồng-[actor.GetTitleAsNameNoTooltip] [recipient.GetFirstName], [actor.GetTitleAsNameNoTooltip] Cấp Cao [actor.GetFirstName] đã chọn phương án nhân từ hơn."
  diarchy.8022.desc.outro: "\n\nTin đồn lan truyền về việc cuộc cãi vã nào trong vô số lần tranh chấp của họ đã khiến [actor.GetFirstNameNoTooltip] đi đến biện pháp cực đoan như vậy, nhưng cuối cùng điều đó cũng chẳng còn quan trọng nữa. Việc đã rồi.\n\nCó lẽ đây luôn là kết cục dễ xảy ra nhất — suy cho cùng, một vương miện không hợp với hai cái đầu."
  diarchy.8022.tt.explanation: "[recipient.GetFirstName] không còn được coi là [co_emperor|E]"
  diarchy.8022.a: "Một tội ác tày trời!"
  diarchy.8022.b: "Đây là kết cục tốt nhất có thể."
  diarchy.8022.c: "Chuyện vẫn luôn như vậy ở [actor.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]."

  diarchy.8023.t: "Tàn Phế Chính Trị: Soán Ngôi!"
  diarchy.8023.t.dead: "$diarchy.8022.t.dead$"
  diarchy.8023.desc.intro: "Trong một hành động tàn bạo dứt khoát, [actor.GetFirstName] — trước đây là Đồng-[actor.GetTitleAsNameNoTooltip] của [recipient.GetHerHis|U] Hoàng đế [recipient.GetFirstName] — đã"
  diarchy.8023.desc.dead: "hành quyết [actor.GetHerHis] cấp cao [actor.GetTitleAsNameNoTooltip] một cách khủng khiếp."
  diarchy.8023.desc.maimed: "làm biến dạng cơ thể [actor.GetHerHis] cấp cao [actor.GetTitleAsNameNoTooltip]."
  diarchy.8023.desc.outro: "\n\nÝ nghĩa biểu tượng của hành động này rõ ràng như truyền thống và luật pháp của chúng ta: [actor.GetPrimaryTitle.GetDefinitiveName] giờ chỉ cúi đầu trước một [actor.GetWomanMan]."
  diarchy.8023.desc.outro.alive: "\n\n[recipient.GetFirstNameNoTooltip] sẽ phải hài lòng với việc giữ lại mạng sống của mình, chứ chẳng còn gì khác."
  diarchy.8023.tt.explanation: "[actor.GetFirstName] đã [deposed|E] [recipient.GetFirstName], giờ cai trị tối cao với tư cách [actor.GetTitleAsName|U] duy nhất"
  diarchy.8023.a: "Gia tộc [actor.GetHouse.GetBaseNameNoTooltip] cuối cùng cũng chiếm vị trí xứng đáng!"
  diarchy.8023.b: "Đây là hành vi soán ngôi!"
  diarchy.8023.c: "$diarchy.8022.c$"

  diarchy.8031.t: "[recipient.Custom2('AppropriateGreetingPositive', actor )]"
  diarchy.8031.desc: "Yêu cầu của ngài vừa hợp lý vừa sáng suốt: ta sẽ chỉ thị cho các tổng đốc của [target.GetDefinitiveName] rằng từ nay trở đi, họ phải ưu tiên nghe theo ngài.\n\nMong rằng ngài sẽ mang đến cho họ cùng chất lượng cai trị mà ta luôn cố gắng đem lại cho phần còn lại của đế quốc."
  diarchy.8031.a: "À, đế quốc của ta trong lòng đế quốc."

  diarchy.8032.t: "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
  diarchy.8032.desc: "Ngài đã là người quyền lực thứ hai trong toàn bộ [recipient.GetPrimaryTitle.GetDefinitiveName] mà vẫn muốn #EMP nhiều hơn#! sao?\n\nKhông, chúng ta đã đủ chia rẽ với hai người cai trị tối cao rồi. Có lẽ thậm chí như vậy cũng đã quá nhiều."
  diarchy.8032.a: "Đây đáng lẽ phải là một mối quan hệ hợp tác!"

  diarchy.8033.t: "[actor.Custom2('AppropriateGreeting', recipient )]"
  diarchy.8033.desc.intro: "Người đồng nhiệm [recipient.GetTitleAsNameNoTooltip], ta cảm thấy áy náy vì đã khiến ngài phải gánh quá nhiều trách nhiệm trong mối quan hệ hợp tác của chúng ta. Từ nay trở đi, ta sẽ trực tiếp kiểm soát [target.GetName], quản lý các tổng đốc của nó và dẫn dắt dân chúng của nó, để giảm bớt gánh nặng trên đôi vai cao quý của ngài.\n\n"
  diarchy.8033.desc.hook: "Hãy coi như món nợ của ngài với ta đã được trả."
  diarchy.8033.desc.insufficient_influence: "Dĩ nhiên, ta trân trọng ý kiến của ngài về việc này và mọi việc khác, nhưng e rằng ta đã sắp xếp xong mọi thứ rồi."
  diarchy.8033.tt.influence: "Ngài không có đủ [influence_i][influence|E] để chống lại [co_emperor|E] của mình"
  diarchy.8033.a: "Thật vô lý!"

  diarchy.8041.t: "Quân vương của Ngài [actor.GetFirstName] nay ban bố một tuyên cáo công khai,"
  diarchy.8041.desc: "Với trái tim nặng trĩu, ta phải thừa nhận rằng [actor.Custom('GetBestEmpireWithAdjective')] đang bị một tai họa thực sự vây hãm: cống rãnh tắc nghẽn, biên giới rạn nứt, và con cái chúng ta sinh ra ngu độn.\n\nNhững vấn đề này, từng điều một, đều là lỗi cuối cùng của kẻ được cho là #EMP Đồng#!-[actor.GetTitleAsNameNoTooltip] của ta, [recipient.GetFirstName], một kẻ ngu ngốc và vô lại đã kích động cơn thịnh nộ của [actor.GetFaith.FateGodName] chống lại chúng ta."
  diarchy.8041.a: "Tên [actor.Custom2('InsultNoun', ROOT.Char)] kiêu ngạo!"
  diarchy.8041.b: "Hai người này thật sự nên cãi nhau công khai như vậy sao?"
 
  diarchy.8042.t: "$diarchy.8041.t$"
  diarchy.8042.desc: "Hãy để mọi người biết rằng hàng ngàn tai họa đang giáng xuống vương quốc — từ ngoại bang đến vô đạo rồi thuế khóa cao — đều #EMP hoàn toàn#! là do vị #EMP Thượng#! [recipient.GetTopLiege.GetTitleAsNameNoTooltip] được cho là của ta gây ra.\n\nSự quản lý vô năng của [recipient.GetHerHis|U] cản trở mọi hành động của ta, và khiến cuộc sống của các ngươi tồi tệ hơn qua từng ngày."
  diarchy.8042.a: "Tên vô ơn đáng nguyền rủa!"
  diarchy.8042.b: "$diarchy.8041.b$"

 ##################################################
 # #Decisions
  betrayed_by_proxy:0 "Bị Phản Bội Qua Trung Gian"
  diarch_attempt_to_overthrow_liege.event.t:0 "Một Cuộc Đảo Chính Được Mong Đợi Từ Lâu:"
  diarch_attempt_to_overthrow_liege.desc.coup_start_boilerplate:0 "\n\n\"[liege.GetFirstName]!\" [usurper.GetFirstNameNoTooltip] hét lên, \"Ta tuyên bố ngươi là kẻ tiếm vị, không xứng đáng với ngai vàng của mình! Hãy giao nó lại cho người cai trị thật sự của vương quốc. #EMP Ta.#!\"\n\nVài hiệp sĩ cấp thấp cố gắng chặn bước tiến của [usurper.GetHerHis], nhưng nhanh chóng bị moi ruột gục xuống."

 #	Diplomacy: You attempt to bloodlessly coup your liege.
  diarchy.9001.t:0 "$diarch_attempt_to_overthrow_liege.event.t$ Lưỡi Bạc"
  diarchy.9001.desc.intro:0 "[usurper.Custom2('MyCharacterIntroduction', ROOT.Char)|U] xông vào phòng ngai của ta. Sau lưng [usurper.GetHerHis] là cả đám những kẻ có tiếng nói trong triều đình, mỗi người đều cầm vũ khí với vẻ bình thản của những kẻ biết rằng chỉ riêng sự đe dọa cũng đã đủ.. $diarch_attempt_to_overthrow_liege.desc.coup_start_boilerplate$"
  diarchy.9001.desc.proxy.none:0 "$diarchy.9011.desc.proxy.none$"
  diarchy.9001.desc.proxy.betrayed:0 "$diarchy.9011.desc.proxy.betrayed$"
  diarchy.9001.desc.proxy.loyal:0 "$diarchy.9011.desc.proxy.loyal$"
  diarchy.9001.desc.outro:0 "\n\nĐây rồi. Khoảnh khắc khi sự phản nghịch tràn bờ."
  diarchy.9001.a:0 "Ngươi nghĩ các chư hầu trung thành của ta sẽ bỏ ta vì #EMP ngươi sao?#!"
  diarchy.9001.a.tt.success:0 "Lời hùng biện của Ngài phá vỡ liên minh của [usurper.GetFirstNamePossessiveNoTooltip]"
  diarchy.9001.a.tt.failure:0 "Mọi chuyện đã rồi"
  diarchy.9001.b.young:0 "Chỉ vào [proxy.GetFirstNameNoTooltip] để nhờ giúp."
  diarchy.9001.b.fallback:0 "[proxy.GetFirstNameNoTooltip], xử lý tên khốn này."
  diarchy.9001.b.tt.success:0 "Lời hùng biện của [proxy.GetFirstNamePossessiveNoTooltip] phá vỡ liên minh của [usurper.GetFirstNamePossessiveNoTooltip]"
  diarchy.9001.b.tt.failure:0 "Mọi chuyện đã rồi"
  diarchy.9001.c:0 "Ta... ta không thể làm gì..."
  diarchy.9001.d:0 "#DIE2 Lính gác.#! #DIE1 Lính gác.#! #BER LÍNH GÁC!#!"
  diarchy.9001.d.tt.win:0 "Binh lính trung thành đến và áp đảo bọn âm mưu"
  diarchy.9001.d.tt.loss:0 "Những người bảo vệ cuối cùng của Ngài dễ dàng bị giết"

 #	Diplomacy: Usurper won, liege-side.
  diarchy.9002.t:0 "$diarchy.9001.t$"
  diarchy.9002.desc.intro:0 "Ta tiêu rồi. Hoàn toàn, hoàn toàn tiêu rồi.\n\n"
  diarchy.9002.desc.proxy.proxy_fought:0 "[proxy.GetTitledFirstName] đã cố gắng hết sức, nhưng lập luận của [usurper.GetFirstNamePossessive] rất trôi chảy và được chuẩn bị kỹ lưỡng. Những kẻ phản bội vẫn trung thành với người trả tiền, và triều đình của ta lùi lại cho phép [usurper.GetHerHim] tiến vào mà không gặp trở ngại."
  diarchy.9002.desc.proxy.self_fought:0 "Mọi nỗ lực của ta đều vô ích. [usurper.GetFirstName|U] đã chuẩn bị cho việc này quá lâu, và với mỗi lượt lời qua lại, ta lại thấy thêm vài gương mặt quen thuộc bước sang phía [usurper.GetHerHis]. Không còn cách nào. Ta đã mất ngai vàng."
  diarchy.9002.desc.surrendered:0 "Ta biết trận chiến này sẽ diễn ra thế nào. Nếu ta đấu bằng lời, ta chứng minh mình không xứng đáng cai trị. Nếu ta đấu bằng thép, ta sẽ bị bắt hoặc tệ hơn. Nước đi duy nhất để thắng là không chơi — #EMP vào lúc này#!.\n\nĐừng nhầm lẫn, \"[usurper.GetTitleAsName]\" [usurper.GetFirstName], ta sẽ quay lại tìm ngươi."
  diarchy.9002.desc.scuffled:0 "Ta kêu cứu, nhưng vài binh sĩ hiếm hoi đến nơi đều nhanh chóng bị bọn âm mưu của [usurper.GetFirstNamePossessive] giết chết. Sau một lúc, dòng người định cứu ta cạn dần, và mọi người đều thấy ta cô độc tuyệt vọng đến mức nào."
  diarchy.9002.desc.outro:0 "\n\nKẻ tiếm vị ra hiệu, và với sự miễn cưỡng rõ ràng, đội cận vệ từng là của ta tiến đến áp giải ta ra ngoài. Gió đang thổi theo hướng nào, thật đáng buồn, quá rõ ràng."
  diarchy.9002.a:0 "Ta còn tự do, nhưng chẳng còn gì khác."
  diarchy.9002.b:0 "Số phận của ta. Tan vỡ."

 #	Diplomacy: Usurper won, usurper-side.
  diarchy.9003.t:0 "$diarchy.9001.t$"
  diarchy.9003.desc.intro:0 "Kết thúc rồi. Giờ ta cai trị hoàn toàn, và một mình.\n\n"
  diarchy.9003.desc.proxy.proxy_fought:0 "Khi chúng ta bước vào đại sảnh, khi đó-[usurper.GetTitleAsNameNoTooltip] [liege.GetFirstName] đã sai tay sai của [liege.GetHerHis], [proxy.Custom2('MyCharacterIntroduction', ROOT.Char)], đến phá vỡ quyết tâm của đồng bọn ta. Chúng ta đấu khẩu sắc bén như dao găm, nhưng cuối cùng ai cũng thấy rằng triều đình đứng về phía ta."
  diarchy.9003.desc.proxy.self_fought:0 "Khi đó, [usurper.GetTitleAsNameNoTooltip] [liege.GetFirstName] đã đích thân gặp chúng ta khi ta và các cận thần bước vào phòng ngai vàng. Ta phải công nhận [liege.GetHerHim] vì nỗ lực cuối cùng này nhằm giành lại lòng trung thành của các cận thần đang dao động, nhưng những lời kêu gọi của [liege.GetHerHis] chỉ rơi vào tai kẻ điếc và những cử chỉ của hắn chỉ nhận lại những ánh mắt mù lòa.\n\nChẳng bao lâu, tất cả đều thấy ai #EMP thực sự#! là [usurper.Custom('MistressMaster')] trong căn phòng đó."
  diarchy.9003.desc.surrendered:0 "Cuối cùng, mọi chuyện có phần phản cao trào. Khi ta và đồng bọn bước vào phòng, ai cũng biết chúng ta đến vì điều gì và để làm gì. Không có sự kháng cự nào, đặc biệt là từ khi đó-[usurper.GetTitleAsNameNoTooltip] [liege.GetFirstName], và ta thậm chí còn chẳng cần dùng hết bài diễn thuyết đã chuẩn bị."
  diarchy.9003.desc.scuffled:0 "Ngay khi chúng ta bước vào phòng ngai vàng, [usurper.GetTitleAsNameNoTooltip] [liege.GetFirstName] đã bắt đầu kêu gào về sự bất xứng của [liege.GetHerHis] cho tất cả mọi người cùng nghe, gào thét cầu xin ai đó, bất kỳ ai, hãy cứu [liege.GetHerHim]. Chúng ta thậm chí chưa rút vũ khí ra, mặc dù điều đó không ngăn cản chúng ta nhanh chóng giải quyết vài tên lính canh lao vào. Đơn giản là không còn ai đứng về phía [liege.GetFirstNameNoTooltip] nữa."
  diarchy.9003.desc.outro:0 "\n\nĐội cận vệ rút lui và các quý tộc quỳ xuống. Ngay lúc này, tin tức đang lan ra khắp [usurper.GetPrimaryTitle.GetTierAsName], lòng trung thành lan ra như gợn sóng trên mặt hồ."
  diarchy.9003.a:0 "Và tất cả mà không một giọt máu trên #EMP ngai vàng của ta#!!"
  diarchy.9003.a.some_blood:0 "Thế mà ta còn cố tránh đổ máu."

 #	Diplomacy: Liege won, liege-side.
  diarchy.9004.t:0 "$diarchy.9001.t$"
  diarchy.9004.desc.proxy.proxy_fought:0 "Ngay khi [proxy.GetTitledFirstName] bắt đầu nói, bọn phản nghịch lập tức bắt đầu tan rã.\n\nĐược gắn kết với nhau nhiều hơn bởi lòng tham quyền lực hơn là lòng trung thành thật sự, chẳng mất lâu để sự nghiệp của [usurper.GetTitledFirstNamePossessive] sụp đổ ngay trước mắt [usurper.GetHerHis]."
  diarchy.9004.desc.proxy.self_fought:0 "Lời nói của ta nhanh chóng đánh trúng mục tiêu, mỗi lời công kích được cân nhắc kỹ lưỡng phá vỡ sợi dây tham lam và tham vọng vốn là thứ duy nhất gắn kết liên minh của [usurper.GetTitledFirstNamePossessive].\n\nKhông còn đoàn kết, sự nghiệp của họ tiêu tan, và những kẻ phản bội cùng lính đánh thuê bắt đầu rời khỏi [usurper.GetFirstNameNoTooltip] hàng loạt."
  diarchy.9004.desc.scuffled:0 "Tiếng kêu của ta khiến mọi hiệp sĩ cấp thấp và binh sĩ tham vọng trong tầm nghe ập vào đại sảnh, nhiều chiến binh hơn nhiều so với nhóm của [usurper.GetTitledFirstNamePossessive] có thể đối phó.\n\nMột cuộc giao tranh ngắn nhưng dữ dội nổ ra, với bọn âm mưu bị giết hoặc bắt và kẻ cầm đầu bị tước vũ khí."
  diarchy.9004.desc.outro:0 "\n\nTa mỉm cười khinh bỉ khi lính gác bắt giữ [usurper.GetHerHim], ra hiệu cho tên khốn bị lôi đi."
  diarchy.9004.a:0 "Một tên phản bội nhỏ bé đáng khinh."

 #	Diplomacy: Liege won, usurper-side.
  diarchy.9005.t:0 "$diarchy.9001.t$"
  diarchy.9005.desc.intro:0 "Ta đã thất bại. Thất bại hoàn toàn.\n\nMọi thứ ban đầu diễn ra rất suôn sẻ — "
  diarchy.9005.desc.proxy.proxy_fought:0 "[liege.GetTitledFirstName] điên cuồng kêu cứu [proxy.GetTitledFirstName], các cận thần của ta tập hợp phía sau, mục đích của chúng ta đã rõ ràng và những bước chân của chúng ta thật vững chãi.\n\nThế rồi gã tể tướng chết tiệt đó mở miệng, và mọi thứ bắt đầu sụp đổ. Từng người một, các quý tộc đã theo ta đều rút lui, cho đến khi chỉ còn lại một mình ta, và quyền lực mà ta dày công xây dựng đang tan vỡ ngay trước mắt.\n\nLính canh bắt giữ ta ngay sau đó."
  diarchy.9005.desc.proxy.self_fought:0 "ta và các cận thần tự tin vào chiến thắng rõ ràng của mình. Điều đó chỉ kéo dài cho đến khi [liege.GetFirstNameNoTooltip] mở miệng, bắt đầu công kích chúng ta, phơi bày những điểm yếu trong kế hoạch của ta, những lỗ hổng tinh vi trong quyền lực của ta.\n\nTa nghĩ mình đang nắm quyền kiểm soát hoàn toàn. Ta đã không nhận ra mình sai lầm đến thế nào cho đến khi lính canh tóm lấy ta."
  diarchy.9005.desc.scuffled:0 "[liege.GetTitledFirstName] rõ ràng hoảng loạn khi ta và đồng bọn bước vào phòng ngai, mục tiêu rõ ràng, và bắt đầu la hét cầu cứu.\n\nTa... ta đã đánh giá thấp mức độ trung thành của vài lính đánh thuê và lính gác thuê đối với kẻ trả tiền cho họ. Họ lao vào chúng ta. Những lời lẽ hay ho của ta chẳng có ý nghĩa gì trước cú nện của chùy lính đánh thuê, và giờ ta bị giam giữ chặt chẽ."
  diarchy.9005.desc.outro:0 "\n\nTrớ trêu thay, hy vọng duy nhất của ta là lòng khoan dung từ vị lãnh chúa mà ta đã cố soán ngôi. Cầu mong [usurper.GetFaith.FateGodName] thương xót."
  diarchy.9005.a:0 "Tất cả kế hoạch cẩn thận của ta!"

 #	Intrigue: You attempt to coup your liege with just a little bloodshed, threatened and actual.
  diarchy.9011.t:0 "$diarch_attempt_to_overthrow_liege.event.t$ Dao Sắc"
  diarchy.9011.desc.intro:0 "[usurper.Custom2('MyCharacterIntroduction', ROOT.Char)|U] xông vào phòng ngai của ta. Sau lưng [usurper.GetHerHis] là một đám quý tộc triều đình cấp thấp, lính đánh thuê và kẻ móc túi, dao găm rút sẵn và khát máu. $diarch_attempt_to_overthrow_liege.desc.coup_start_boilerplate$"
  diarchy.9011.desc.proxy.none:0 "Ta nhìn quanh, tìm kiếm sự ủng hộ từ các cố vấn của mình. Không có ai, hoặc không ai sẵn sàng và đủ tư cách để lên tiếng giúp ta."
  diarchy.9011.desc.proxy.betrayed:0 "Ta nhìn quanh tìm sự ủng hộ từ các cố vấn. [proxy.GetTitledFirstName] nhìn lại ta với ánh mắt lạnh lùng, rồi bước ra đứng phía sau [usurper.GetFirstNameNoTooltip]. Thêm một sự phản bội."
  diarchy.9011.desc.proxy.loyal:0 "Ta liếc nhìn [proxy.GetTitledFirstName] để tìm kiếm sự ủng hộ, chỉ để thấy [proxy.GetHerHim] đã sẵn sàng lên tiếng thay cho ta."
  diarchy.9011.desc.outro:0 "$diarchy.9001.desc.outro$"
  diarchy.9011.a:0 "Ngươi thật sự nghĩ đã dồn ta vào bẫy, con rắn nhỏ?"
  diarchy.9011.a.tt.success:0 "Ngài phá vỡ sự đoàn kết của liên minh, khiến nó sụp đổ"
  diarchy.9011.a.tt.failure:0 "Bỏ qua lời khiêu khích của Ngài, Ngài bị bắt"
  diarchy.9011.b.young:0 "$diarchy.9001.b.young$"
  diarchy.9011.b.fallback:0 "$diarchy.9001.b.fallback$"
  diarchy.9011.b.tt.success:0 "[proxy.GetFirstNamePossessive] phá vỡ sự đoàn kết của liên minh, khiến nó sụp đổ"
  diarchy.9011.b.tt.failure:0 "Bỏ qua lời kêu gọi của [proxy.GetFirstNamePossessive], Ngài bị bắt"
  diarchy.9011.c:0 "$diarchy.9001.c$"
  diarchy.9011.d:0 "$diarchy.9001.d$"
  diarchy.9011.d.tt.win:0 "$diarchy.9001.d.tt.win$"
  diarchy.9011.d.tt.loss:0 "$diarchy.9001.d.tt.loss$"

#	Intrigue: Usurper won, liege-side.
  diarchy.9012.t:0 "$diarchy.9011.t$"
  diarchy.9012.desc.intro:0 "$diarchy.9002.desc.intro$"
  diarchy.9012.desc.proxy.proxy_fought:0 "[proxy.GetTitledFirstName] bước lên thay ta, và [proxy.GetSheHe] cùng [usurper.GetFirstName] đấu khẩu qua lại, nhưng vô ích. Tên khốn [usurper.GetWomanMan] đã chuẩn bị mọi góc độ, mọi hối lộ đã tung ra, mọi ân huệ đã được gọi đến. Cuối cùng, [proxy.GetFirstNameNoTooltip] lao vào [usurper.GetFirstNameNoTooltip], nhưng bị đồng bọn của [usurper.GetHerHis] quật ngã xuống sàn."
  diarchy.9012.desc.proxy.self_fought:0 "[usurper.GetFirstName] và ta đấu khẩu vài phút, nhưng ta không phải đối thủ của [usurper.GetHerHim]. Tên khốn [usurper.GetWomanMan] đã chuẩn bị mọi góc độ, mọi hối lộ đã tung ra, mọi ân huệ đã được gọi đến.\n\nTay ta đặt lên chuôi vũ khí để tự vệ, nhưng một lưỡi dao vòng ra từ phía sau cổ ta. Một tên lính phản bội chết tiệt."
  diarchy.9012.desc.surrendered:0 "[usurper.GetFirstName] có vẻ gần như thất vọng trước sự thiếu kháng cự của ta, nhưng ta biết chiến đấu với [usurper.GetHerHim] là vô ích. [usurper.GetSheHe] sẽ không ở đây, hành động táo bạo như vậy chống lại ta, nếu [usurper.GetSheHe] chưa nắm mọi lưỡi dao trong tòa nhà này về phía [usurper.GetHerHis] và chĩa vào bất kỳ ai khác."
  diarchy.9012.desc.scuffled:0 "Lính canh ta gọi đã đến, nhưng ngay khi bước vào phòng, đợt đầu tiên đã bị đợt thứ hai hạ gục, bị đâm sau lưng hoặc rạch cổ tại chỗ. [usurper.GetFirstName] không thể xóa được nụ cười nhếch mép hiện lên [usurper.Custom('MaskFace_BehindAcross')] [usurper.GetHerHis] [usurper.Custom('MaskFace')]."
  diarchy.9012.desc.outro:0 "\n\nTa hét lên khi bọn phản nghịch tiến tới, dao găm sẵn sàng, còng sắt lủng lẳng trên tay [usurper.GetFirstNamePossessiveNoTooltip].\n\nKhông ai nghe. Không ai quan tâm. Bị khóa trong xiềng xích, ta bị lôi đi."
  diarchy.9012.a:0 "Ngươi không thể làm vậy! Ta là [usurper.GetTitleAsNameNoTooltip]! #EMP Là [usurper.GetTitleAsNameNoTooltip]!#!"
  diarchy.9012.b:0 "$diarchy.9002.b$"

#	Intrigue: Usurper won, usurper-side.
  diarchy.9013.t:0 "$diarchy.9011.t$"
  diarchy.9013.desc.intro:0 "$diarchy.9003.desc.intro$"
  diarchy.9013.desc.proxy.proxy_fought:0 "[liege.GetFirstName] đã cử tay sai của [liege.GetHerHis], [proxy.GetTitledFirstName], để thuyết phục bọn âm mưu của ta rời bỏ ta. Chúng ta đấu khẩu vài phút trước khi [proxy.GetWomanMan] bực tức lao vào ta, chỉ để bị một lính đánh thuê của ta ghì xuống.\n\nVị lãnh chúa khi đó của chúng ta quá sốc để kháng cự nghiêm túc khi chúng ta khóa còng."
  diarchy.9013.desc.proxy.self_fought:0 "[liege.GetFirstName] đã cố gắng thách thức ta, cố gắng làm suy yếu sự ủng hộ của các cận thần trong khoảnh khắc quan trọng, nhưng ta đã dễ dàng đẩy lùi những nỗ lực hèn mọn của [liege.GetHerHis]. Suy cho cùng, một [usurper.GetWomanMan] không bao giờ nên làm nửa vời trong một cuộc đảo chính.\n\nKhi [liege.GetFirstNameNoTooltip] cố rút vũ khí ra, chắc chắn là muốn chặt đầu ta, một trong những kẻ phản bội của ta đã khống chế hắn từ phía sau. Việc còng tay hắn dễ như trò trẻ con."
  diarchy.9013.desc.surrendered:0 "Ta gần như thất vọng khi [liege.GetFirstName] không kháng cự gì trước chúng ta, ngoài một tiếng hét giận dữ nhỏ khi chúng ta khóa còng [liege.GetHerHim].\n\nChắc chắn là lựa chọn #EMP khôn ngoan#!, nhưng từ bao giờ [liege.GetSheHe] lại chọn #EMP điều đó#!?"
  diarchy.9013.desc.scuffled:0 "[liege.GetFirstName] gọi cứu viện, nhưng dĩ nhiên ta đã tính đến điều này. Những kẻ ngu ngốc đáp lời đều bị bọn phản bội của ta chém hạ gần như ngay lập tức.\n\nKhông ai khác thậm chí còn cố giúp khi chúng ta tiến về phía vị lãnh chúa cũ."
  diarchy.9013.desc.outro:0 "\n\nVới phe đối lập đã chết hoặc bị giam, và vị [usurper.GetTitleAsNameNoTooltip] trước đây của ta bị khóa chặt sau song sắt, tương lai trông thật sáng sủa."
  diarchy.9013.a:0 "Ngai vàng mới và một con tin mới — ta đã thấy an tâm rồi."

#	Intrigue: Liege won, liege-side.
  diarchy.9014.t:0 "$diarchy.9011.t$"
  diarchy.9014.desc.proxy.proxy_fought:0 "Vài lời được đặt đúng chỗ từ [proxy.GetFirstName] và $diarchy.9014.desc.proxy.self_fought$"
  diarchy.9014.desc.proxy.self_fought:0 "Bè phái đầy tự tin của [usurper.GetTitledFirstNamePossessive] tan rã chỉ trong chốc lát.\n\nNhư bất kỳ ổ rắn độc nào, chúng muốn cắn xé lẫn nhau gần như nhiều như muốn cắn ta, và chỉ cần một chút khích bác là vài kẻ đã bỏ đi hoặc bắt đầu đánh lẫn nhau.\n\nNụ cười của [usurper.GetFirstNamePossessiveNoTooltip] khựng lại khi [usurper.GetSheHe] nhận ra rằng cuộc đảo chính đã tan vỡ rồi.."
  diarchy.9014.desc.scuffled:0 "Trước tiếng kêu của ta, lính gác kéo đến đông đến mức ngay cả #EMP ta#! cũng phải kinh ngạc, tràn về phía [usurper.GetTitledFirstName] và đám âm mưu của [usurper.GetHerHis].\n\nChẳng mất lâu để bọn phản bội nhận ra chúng hoàn toàn bị áp đảo và lép vế, và bắt đầu vứt vũ khí xuống từng người một. [usurper.GetTitledFirstNameNoTooltip] là kẻ cuối cùng làm vậy."
  diarchy.9014.desc.outro:0 "\n\nKhi lính canh của ta di chuyển để bắt giữ [usurper.GetHerHim], [usurper.GetSheHe] để mặc cho họ tóm lấy. Với âm mưu [usurper.GetHerHis] đã bị tan rã, bất cứ hành động nào khác cũng chỉ là tự sát."
  diarchy.9014.a:0 "Ta sẽ quyết định phải làm gì với #EMP ngươi#! sau."

#	Intrigue: Liege won, usurper-side.
  diarchy.9015.t:0 "$diarchy.9011.t$"
  diarchy.9015.desc.intro:0 "$diarchy.9005.desc.intro$"
  diarchy.9015.desc.proxy.proxy_fought:0 "chúng ta mạnh mẽ, đoàn kết, sẵn sàng nhận phần thưởng xứng đáng từ kế hoạch của mình. Cho đến khi tên [proxy.GetTitledFirstName] chết tiệt đó bước lên biện hộ cho vị lãnh chúa ngu ngốc của [proxy.GetHerHis]. Ta... ta không chuẩn bị cho những lập luận [proxy.GetSheHe] đưa ra, cho những lỗ hổng bị chọc thủng trong kế hoạch cẩn thận của ta. Chúng rời bỏ ta. Tất cả đều rời bỏ ta."
  diarchy.9015.desc.proxy.self_fought:0 "chúng ta xông vào như một phe hùng mạnh, dao găm trong tay và sẵn sàng cho hồi kết. Ta không nên để [liege.GetFirstName] nói, ta lẽ ra không bao giờ nên để [liege.GetHerHim] chết tiệt mở miệng! Mỗi câu nói là một lập luận xé toạc những lời biện minh ta đã cẩn thận dựng lên, mỗi điểm là một lưỡi dao đâm vào trái tim sự đoàn kết của chúng ta. Từng người một, đồng bọn của ta rời đi."
  diarchy.9015.desc.scuffled:0 "chúng ta xông vào phòng ngai, sẵn sàng làm điều cần làm. Cho đến khi tiếng hét của [liege.GetTitledFirstName] kéo đến cả đàn những kẻ bảo vệ tiềm năng, nhiều hơn ta từng tưởng tượng sẽ đứng về phía tên ngốc đó. Bọn phản bội của ta thậm chí còn chẳng cố chiến đấu, vứt vũ khí ngay khi thấy chúng ta bị áp đảo đến mức nào."
  diarchy.9015.desc.outro:0 "\n\nKhi âm mưu tan rã quanh ta, ta không hề kháng cự khi lính gác tiến đến khóa còng. Ta còn may vì chưa bị xử tử ngay tại đây."
  diarchy.9015.a:0 "Tất cả #EMP công sức#! đó. Phí hoài."

 #	Prowess: You try to slaughter your way to power.
  diarchy.9021.t:0 "$diarch_attempt_to_overthrow_liege.event.t$ Kiếm Sáng Lóa"
  diarchy.9021.desc.intro:0 "[usurper.Custom2('MyCharacterIntroduction', ROOT.Char)|U] xông vào phòng ngai của ta, theo sau là một nhóm lính đánh thuê, lính hợp đồng và kẻ phản bội. Vũ khí tuốt trần, sẵn sàng chém giết bao nhiêu người cũng được, mục đích đẫm máu của chúng ánh lên trong mắt. $diarch_attempt_to_overthrow_liege.desc.coup_start_boilerplate$"
  diarchy.9021.desc.proxy.none:0 "$diarchy.9011.desc.proxy.none$"
  diarchy.9021.desc.proxy.betrayed:0 "$diarchy.9011.desc.proxy.betrayed$"
  diarchy.9021.desc.proxy.loyal:0 "Ta liếc nhìn [proxy.GetTitledFirstName] để tìm kiếm sự ủng hộ, chỉ để thấy [proxy.GetHerHim] đã sẵn sàng chiến đấu vì ta."
  diarchy.9021.a:0 "Đồ khốn! Ta sẽ tự tay chém ngươi!"
  diarchy.9021.a.tt.commence_duel.self:0 "Ngài sẽ [single_combat_duel|E] với [usurper.GetShortUIName] ngay lập tức"
  diarchy.9021.a.tt.success:0 "Ngài xử tử kẻ tấn công mình"
  diarchy.9021.a.tt.failure:0 "[usurper.GetSheHe|U] giết Ngài ngay trên sàn phòng ngai"
  diarchy.9021.b.young:0 "$diarchy.9001.b.young$"
  diarchy.9021.b.fallback:0 "$diarchy.9001.b.fallback$"
  diarchy.9021.b.tt.commence_duel.proxy:0 "[proxy.GetShortUIName] và [usurper.GetShortUIName] sẽ [single_combat_duel|E] ngay lập tức"
  diarchy.9021.c:0 "$diarchy.9001.c$"
  diarchy.9021.d:0 "$diarchy.9001.d$"
  diarchy.9021.d.tt.win:0 "$diarchy.9001.d.tt.win$"
  diarchy.9021.d.tt.loss:0 "$diarchy.9001.d.tt.loss$"

 #	Prowess: Usurper won, liege-side.
  diarchy.9022.t:0 "$diarchy.9021.t$"
  diarchy.9022.desc.intro:0 "$diarchy.9002.desc.intro$"
  diarchy.9022.desc.proxy.proxy_fought:0 "[proxy.GetTitledFirstName] đã chiến đấu hết mình, nhưng [usurper.GetFirstName] vẫn tàn sát [proxy.GetHerHim] như thường lệ. Ta... ta khó có thể tin rằng một [proxy.GetWomanMan] như vậy lại hy sinh mạng sống của [proxy.GetHerHis] vì ta... vì #EMP không gì cả#!."
  diarchy.9022.desc.scuffled:0 "Lính gác của ta tràn vào phòng, nhưng [usurper.GetFirstName] đã chọn đồng bọn của [usurper.GetHerHis] rất kỹ, và lính đánh thuê cùng lính hợp đồng của chúng giết từng người bảo vệ của ta gần như ngay khi họ đến. Họ... họ sẽ không kịp. Họ #EMP không thể#!."
  diarchy.9022.desc.proxy.surrendered:0 "Bất chấp lời phản đối của ta, vài lính gác và lính đánh thuê vẫn cố chống lại lực lượng của [usurper.GetFirstNamePossessive], nhưng họ bị chém hạ từng người. Bị thu hút bởi tiếng ồn, nhiều lính cận vệ gia đình của ta chạy vào phòng ngai, chỉ để chần chừ khi thấy chuyện gì đang diễn ra."
  diarchy.9022.desc.outro:0 "\n\nKhông còn thời gian cho các lựa chọn khác, kẻ tiếm quyền tiến về phía ta, [usurper.Custom('signature_weapon')] vẫn đẫm máu. Đây là dấu chấm hết."
  diarchy.9022.desc.outro.surrendered:0 "\n\nHy vọng cuối cùng của ta tắt lịm khi người lính thề trung thành đầu tiên của ta quỳ xuống trước [usurper.GetTitleAsName] mới.\n\nTất cả đã kết thúc."
  diarchy.9022.a:0 "Ngươi sẽ xuống thẳng [liege.GetFaith.random_NegativeAfterLife] vì việc này, [usurper.GetFirstNameNoTooltip]."
  diarchy.9022.b:0 "$diarchy.9002.b$"

 #	Prowess: Usurper won, usurper-side.
  diarchy.9023.t:0 "$diarchy.9021.t$"
  diarchy.9023.desc.intro:0 "$diarchy.9003.desc.intro$"
  diarchy.9023.desc.proxy.proxy_fought:0 "Xác của [proxy.GetTitledFirstNamePossessive] đổ sang một bên. Bạo lực phải được đáp trả bằng bạo lực, và [liege.GetFirstName] đã chọn con đường của [liege.GetHerHis].\n\nTrong khi [usurper.GetTitleAsNameNoTooltip] vẫn còn choáng váng trước cái chết của người đấu sĩ của [liege.GetHerHis], ta bước tới và [usurper.Custom('SignatureWeaponWoundVerb5')] [usurper.Custom('signature_weapon')] của ta vào cổ họng [liege.GetHerHis].\n\nCái chết không phải nhanh nhất, nhưng cũng không chậm. Ta và triều đình nhìn [liege.GetHerHim] chết mà không nói lời nào, rồi ta ném [liege.GetHerHim] khỏi ngai."
  diarchy.9023.desc.proxy.self_fought:0 "Với quyền lực của ta được củng cố và cựu-[usurper.GetTitleAsNameNoTooltip] [liege.GetFirstNameNoTooltip] đã chết dưới tay ta, chẳng còn ai ngăn ta ngồi lên ngai xứng đáng của mình, ngoại trừ vài tiếng ho khan khó xử từ triều đình tụ họp."
  diarchy.9023.desc.surrendered:0 "Ngạc nhiên thay, [liege.GetFirstName] đã đầu hàng. Ta cứ nghĩ sẽ phải giết [liege.GetHerHim], nhưng có vẻ như [liege.GetSheHe] coi trọng vương miện hơn mạng sống của [liege.GetHerHis].\n\nPhần lớn các cận thần của ta cười khẩy khi kẻ cựu-[usurper.GetTitleAsNameNoTooltip] bị lôi đi qua mặt họ, bị ném ra khỏi phòng ngai vàng để nhường chỗ cho #EMP ta#!.\n\nChà, dù bất ngờ nhưng việc tự nguyện thoái vị cũng hiệu quả đối với ta. Nó... chính thống hơn."
  diarchy.9023.desc.scuffled:0 "Đúng như dự đoán, [liege.GetFirstName] gọi lính gác ngay khi chúng ta xông vào phòng ngai. Thật không may cho những kẻ xấu số đang trực, ta là một [usurper.GetWomanMan] luôn lên kế hoạch trước, và đồng bọn của ta dễ dàng lao tới giết những người mới đến.\n\nTrong khi binh lính của ta thắng cuộc giao tranh, ta tiến về phía [liege.GetFirstNameNoTooltip] vẫn đang la hét và [usurper.Custom('SignatureWeaponWoundVerb5')] [usurper.Custom('signature_weapon')] của ta vào cổ họng [liege.GetHerHis].\n\nCái chết nhanh chóng kết thúc phần còn lại của trận chiến, được báo hiệu bằng âm thanh ta ném cựu lãnh chúa của mình khỏi ngai."
  diarchy.9023.desc.outro:0 "\n\nXác của [liege.GetFirstNamePossessiveNoTooltip] đang nguội dần trên sàn phòng ngai có lẽ là cách khởi đầu triều đại của ta không mấy đẹp mắt, nhưng đó là điều cần thiết. Và cuối cùng, ít đổ máu hơn nhiều so với một cuộc nội chiến.\n\nTa hy vọng vương quốc sẽ nhìn nhận như vậy."
  diarchy.9023.a:0 "Một vài cái chết ở đây sẽ cứu sống nhiều người trên khắp [usurper.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]."
  diarchy.9023.a.liege_survives:0 "Bắt đầu triều đại của ta bằng lòng khoan dung."

 #	Prowess: Liege won, liege-side.
  diarchy.9024.t:0 "$diarchy.9021.t$"
  diarchy.9024.desc.proxy.proxy_fought:0 "Đáng tiếc ta đứng hơi xa [usurper.GetTitledFirstName] để nghe lời nguyền rủa cuối cùng của [usurper.GetHerHis], nhưng ta vẫn có niềm vui được nhìn [usurper.GetHerHim] chết.\n\n[proxy.GetTitledFirstName] đã chiến đấu rất tốt vì ta, giết tên phản bội ngay dưới chân ngai của ta với sự dễ dàng gần như khinh miệt. Hành động đó tiếp thêm quyết tâm cho lính gác của ta và làm tan rã nhóm âm mưu, và tiếp theo là vài phút đổ máu tuyệt vọng khi bọn phản loạn bị chém hạ."
  diarchy.9024.desc.proxy.self_fought:0 "Xác của [usurper.GetTitledFirstNamePossessive] nằm tan nát trước mặt ta, bị chính tay ta giết.\n\nTrong cơn hoảng loạn mù quáng, nhóm âm mưu tan rã và cố chạy trốn, nhưng lính gác của ta được tiếp thêm sức mạnh từ chiến thắng của ta và lao vào giữa chúng. Sau đó là vài phút đổ máu tuyệt vọng, bọn phản loạn bị chém hạ từng người."
  diarchy.9024.desc.scuffled:1 "May mắn thay, tiếng kêu cứu kịp thời của ta đã mang đến cả một #EMP đám đông#! binh lính trung thành và lính thuê từ các phòng gần đó. Dù nhóm phản bội của [usurper.GetTitledFirstNamePossessive] chiến đấu khá tốt, chúng nhanh chóng bị áp đảo.\n\nTa nhìn [usurper.GetFirstNameNoTooltip] chết, một trong những kẻ cuối cùng, nỗi hoảng loạn trong [usurper.GetHerHis] [usurper.Custom('EyeEyes')] khi thép lóe lên quanh [usurper.GetHerHim]. Rồi vào [usurper.GetHerHim]. Rồi xuyên qua [usurper.GetHerHim].\n\nĐó là cái giá của phản bội."
  diarchy.9024.desc.outro:0 "\n\nTa đoán tin tức sẽ nhanh chóng lan ra khắp phần còn lại của [liege.GetPrimaryTitle.GetTierAsName], và hy vọng điều này sẽ là bài học cho những kẻ tiếm vị trong tương lai."
  diarchy.9024.a:0 "Bị hạ như con chó ghẻ mà [usurper.GetSheHe] vốn là."

 #	Prowess: Liege won, usurper-side.
  diarchy.9025.t:0 "$diarchy.9021.t$"
  diarchy.9025.desc:0 "Gần như ngay khi chúng ta phá cửa phòng ngai, tiếng hét hoảng loạn của [liege.GetTitledFirstName] kéo theo một dòng thác hiệp sĩ vũ trang tràn vào phòng, sẵn sàng chết vì [liege.Custom('MistressMaster')] của họ.\n\nTa và đồng bọn cố chém giết xuyên qua đống xác sắp thành xác chết ấy hết sức có thể, nhưng quá đông. Chúng ta phải rút lui, phải quay lại — nhân danh [usurper.GetFaith.FateGodName], chúng còn ở phía sau chúng ta. Không... không có lối thoát.\n\nKhông, không, #EMP không!#! Bao nhiêu kế hoạch, bao nhiêu công sức, tất cả đều vô ích!"
  diarchy.9025.a:0 "Không phải kết thúc thế nà-#BER AAARGGH!#!"

