 # #Vizierate Events
  vizierate.1001.t: "[propositioner.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
  vizierate.1001.desc.intro: "Ngài hẳn phải đồng ý rằng [vizier.GetFirstName] đang chứng tỏ là một tể tướng tồi tệ — một nỗi ô nhục tham nhũng cho chức vị này, nhưng ta đã bỏ ra rất nhiều thời gian và tiền bạc để chuẩn bị một kế hoạch nhằm"
  vizierate.1001.desc.diplomacy: "lôi kéo những người ủng hộ chủ chốt và điệp viên giỏi nhất của [vizier.GetHerHis] về phía ta."
  vizierate.1001.desc.stewardship: "luồn lách vào các lợi ích kinh doanh của [vizier.GetHerHis] và hối lộ lính gác của [vizier.GetHerHis]."
  vizierate.1001.desc.intrigue: "vô hiệu hóa những lính gác giỏi nhất của [vizier.GetHerHis] và bắt giữ [vizier.GetHerHim] để tra tấn."
  vizierate.1001.desc.outro: "Hãy phong ta làm tể tướng thay thế, và để ta biến tài sản của #EMP [vizier.GetHerHis]#! thành vàng cho #EMP ngài#!."
  vizierate_1001_duel_for_vizierate_effect.tt.success: "[propositioner.GetFirstNamePossessiveNoTooltip] kế hoạch thành công"
  vizierate_1001_duel_for_vizierate_effect.tt.failure: "[propositioner.GetFirstNameNoTooltip] rơi vào thảm họa chính trị"
  vizierate_1001_duel_for_vizierate_effect.tt.ex_vizier_remains_at_court: "[vizier.GetFirstName] vẫn ở lại [court|E] của Ngài"
  vizierate.1001.a: "Kế hoạch này có thể hiệu quả..."
  vizierate.1001.b: "Tài chính này trông khá phức tạp..."
  vizierate.1001.c: "Nguy hiểm, rất nguy hiểm..."
  vizierate.1001.d: "Thật tiện khi gửi một lá thư mà ta có thể chia sẻ với [vizier.GetFirstNameNoTooltip]!"
  vizierate.1001.d.tt.filtered_out: "[propositioner.GetTitledFirstName] sẽ #EMP ít khả năng hơn đáng kể#! để thừa kế bất kỳ [diarchy|E] nào với Ngài"
  vizierate.1001.e: "Những trò chính trị nhỏ nhặt của các ngươi không đáng để ta bận tâm."

