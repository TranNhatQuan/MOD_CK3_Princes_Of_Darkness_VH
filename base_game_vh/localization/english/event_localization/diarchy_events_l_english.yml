 # #Notifications
  diarchies.0000.diarch_fulfills_mandate.t:1 "[liege.GetDiarchTitle|U] thúc đẩy [mandate|E]"
  diarchies.0000.diarch_fails_at_mandate.t:1 "[liege.GetDiarchTitle|U] thất bại khi thực hiện [mandate|E]"
  diarchies.0000.diarch_skims_mandate.t:1 "[liege.GetDiarchTitle|U] biển thủ từ [mandate|E]"
  diarchies.0000.diarch_fails_to_skim_mandate.t:1 "[liege.GetDiarchTitle|U] không thể biển thủ từ [mandate|E]"
