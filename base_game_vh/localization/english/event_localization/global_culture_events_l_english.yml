l_english:
  global_culture.custom.change_culture:1 "Tất cả các quận và nhân vật [old_culture.GetName] trong lãnh địa của Ngài trở thành [new_culture.GetName]"
  global_culture.custom.merge_culture:1 "Tất cả các quận và nhân vật [old_culture_1.GetName] và [old_culture_2.GetName] trong lãnh địa của Ngài trở thành [new_culture.GetName]"
  global_culture.custom.keep_culture:1 "Các quận và nhân vật [old_culture.GetName] trong lãnh địa của Ngài giữ nguyên văn hóa của họ."
  global_culture.custom.trigger:0 "Ngài không kiểm soát ít nhất 80% tất cả các quận [CHARACTER.GetCulture.GetName]"

 # Visigoth Split
  global_culture.0002.t:0 "Số Phận của Người Visigoth"
  global_culture.0002.desc:0 "Từ rất lâu trước đây, tổ tiên của chúng ta đã di cư đến bán đảo Iberia và xây dựng những khu định cư đầu tiên. Từ đó đến nay chúng ta đã sống ở đây qua nhiều thế hệ, vùng đất này định hình chúng ta cũng nhiều như chúng ta đã định hình nó.\n\nĐã đến lúc tự hỏi: chúng ta vẫn là người Visigoth sao? Hay chúng ta đã trở thành một điều gì đó hoàn toàn mới?"
  global_culture.0002.a:0 "Thời đại đang thay đổi, và chúng ta cũng phải thay đổi theo."
  global_culture.0002.b:0 "Chúng ta sẽ không từ bỏ truyền thống của tổ tiên!"

  global_culture.0005.t:0 "$global_culture.0002.t$"
  global_culture.0005.desc:0 "Khi người Visigoth lần đầu di cư vào bán đảo Iberia, họ là những kẻ xa lạ trên một vùng đất mới lạ.\n\nĐiều này dần thay đổi qua nhiều thế hệ, khi vùng đất định hình họ cũng nhiều như họ định hình chính vùng đất. Theo thời gian, các cộng đồng Visigoth khác nhau bắt đầu trở nên khác biệt và tách biệt khỏi nhau.\n\nDù có chung nguồn gốc, những cộng đồng mới này — [castilian.GetName], [catalan.GetName], [occitan.GetName], và [andalusian.GetName] — giờ đây không còn xem nhau là thân tộc nữa."
  global_culture.0005.a:0 "Chỉ thời gian mới cho thấy điều này sẽ ảnh hưởng đến khu vực ra sao."

 # Norse Split
  global_culture.0012.t:0 "Số Phận của Người Bắc Âu"
  global_culture.0012.desc:0 "Sống trên những vùng đất khắc nghiệt của Scandinavia, dân tộc chúng ta có lịch sử bảo đảm sự thịnh vượng và sinh tồn bằng việc buôn bán, cướp bóc và chiến đấu như những thanh kiếm đánh thuê.\n\nTheo thời gian điều này mang lại của cải lớn, khiến người của chúng ta ngày càng cắm rễ và định cư lâu dài nhiều hơn.\n\nGiờ đây những khu định cư đó bắt đầu tách biệt về văn hóa, khi truyền thống và thậm chí ngôn ngữ của họ thay đổi để phù hợp với lối sống mới."
  global_culture.0012.a:0 "Chúng ta trước hết phải đảm bảo sự thịnh vượng của chính mình."
  global_culture.0012.b:0 "Không thể chấp nhận! Người Bắc Âu #EMP sẽ#! vẫn đoàn kết."

  global_culture.0015.t:0 "$global_culture.0012.t$"
  global_culture.0015.desc:0 "Thương nhân, cướp biển và lính đánh thuê... người Bắc Âu từ lâu đã rời Scandinavia đi khắp châu Âu và thậm chí xa hơn nữa, để lại dấu ấn ở mọi nơi họ đến.\n\nGiờ đây có vẻ như thời đại đó đang dần kết thúc, khi khác biệt văn hóa và sự cạnh tranh giữa các thị tộc đã dẫn đến sự xuất hiện của những bản sắc [danish.GetName], [swedish.GetName], và [norwegian.GetName] riêng biệt."
  global_culture.0015.desc_norse:0 "Thương nhân, cướp biển và lính đánh thuê... tổ tiên Bắc Âu của chúng ta từ lâu đã rời Scandinavia đi khắp châu Âu và thậm chí xa hơn nữa, để lại dấu ấn ở mọi nơi họ đến.\n\nGiờ đây có vẻ như thời đại đó đang dần kết thúc, khi quê hương của chúng ta bị chia rẽ bởi khác biệt văn hóa và sự cạnh tranh giữa các thị tộc thành các bản sắc [danish.GetName], [swedish.GetName], và [norwegian.GetName]."
  global_culture.0015.a:0 "Điều này có ý nghĩa gì cho tương lai của châu Âu?"
  global_culture.0015.b:0 "Điều này có ý nghĩa gì cho tương lai của dân tộc chúng ta?"

 # Scottish Split
  global_culture.0032.t:0 "Sự Trỗi Dậy của Người Scots"
  global_culture.0032.desc:1 "Dù chúng ta có chung nguồn gốc với những người Anglo-Saxon khác, các thị tộc sống ở vùng đất thấp phía bắc Britannia đã bắt đầu tách biệt về văn hóa và ngôn ngữ khi thích nghi với cuộc sống trên địa hình khắc nghiệt.\n\nNhiều người trong chúng ta giờ đây khao khát một bản sắc văn hóa riêng mà chúng ta có thể gọi là của mình. Một điều gì đó mà chúng ta có thể tự hào..."
  global_culture.0032.a:0 "Chúng ta là người Scots, bây giờ và mãi mãi!"
  global_culture.0032.b:0 "Chúng ta không nên quay lưng lại với đồng bào của mình."

  global_culture.0035.t:0 "$global_culture.0032.t$"
  global_culture.0035.desc:1 "Dù có chung nguồn gốc với những người Anglo-Saxon khác, các thị tộc sống ở vùng đất thấp phía bắc Britannia đã thích nghi với cuộc sống trên địa hình khắc nghiệt.\n\nTách biệt về văn hóa và ngôn ngữ khỏi những đồng bào cũ, những người [scottish.GetName] này đã nhiệt tình chấp nhận bản sắc văn hóa mới của mình."
  global_culture.0035.a:0 "Liệu họ có thể phát triển thịnh vượng một mình?"


 # Norman Merge
  global_culture.3002.t:0 "Sự Trỗi Dậy của Người Norman"
  global_culture.3002.desc:1 "Những vùng đất ở miền bắc nước Pháp đã mang lại cho dân tộc chúng ta vùng đất màu mỡ và trù phú để định cư và mở rộng.\n\nBằng cách tiếp nhận một số truyền thống của người bản địa, chúng ta sẽ có thể thích nghi tốt hơn với khu vực này."
  global_culture.3002.a:0 "Vì những người Ngài mới và khởi đầu mới!"

  global_culture.3003.t:0 "$global_culture.3002.t$"
  global_culture.3003.desc:0 "Chúng ta đã ở rất xa những vùng đất mà tổ tiên Bắc Âu từng gọi là quê hương, nhưng chính những vùng đất phía bắc nước Pháp này mới là nơi chúng ta xem là quê hương. Với tư cách là lãnh đạo của dân tộc mình, trách nhiệm của ta là đảm bảo sự thịnh vượng trong tương lai, và nếu chúng ta muốn phát triển, chúng ta phải thích nghi với môi trường mới. Chúng ta phải học hỏi từ những người có tổ tiên đã khai thác vùng đất màu mỡ này.\n\nTheo sắc lệnh này, chúng ta sẽ thay đổi cách sống để mang lại lợi ích cho đồng bào. Chúng ta sẽ mở ra một con đường mới với tư cách là dân tộc của riêng mình."
  global_culture.3003.a:0 "Từ ngày hôm nay, chúng ta gọi mình là người Norman!"

  global_culture.3005.t:0 "$global_culture.3002.t$"
  global_culture.3005.desc:0 "Một nhóm người định cư Bắc Âu đến từ Scandinavia đã định cư trên bờ biển phía bắc nước Pháp và lập nên quê hương mới tại đó.\n\nLãnh đạo của họ, [norman_founder.GetTitledFirstName], đã tuyên bố rằng dân tộc của [norman_founder.GetHerHis] sẽ tiếp nhận một số phong tục và truyền thống địa phương để đảm bảo họ có thể phát triển thịnh vượng trên vùng đất mới này."
  global_culture.3005.a:0 "Điều này sẽ có ý nghĩa gì cho khu vực?"

  global_culture.3011.t:0 "Sự Lan Rộng của Văn Hóa [sicilian.GetNameNoTooltip]"
  global_culture.3011.desc:0 "Sự pha trộn đa dạng của các dân tộc ở Nam Ý và Sicilia đã tạo nên một nền văn hóa độc đáo, chịu ảnh hưởng từ vô số nguồn khác nhau.\n\nGiờ đây rõ ràng rằng người dân ở [county_to_change.GetName] không còn xem mình là [old_culture.GetName] nữa, mà là người bản địa [sicilian.GetCollectiveNoun]!"
  global_culture.3011.a:0 "Một sự phát triển thú vị..."

  global_culture.3012.a:0 "Tuyệt vời!"

  global_culture.4011.t: "Sự Lan Truyền Văn Hóa [goryeo.GetNameNoTooltip]"
  global_culture.4011.desc: "Nhân dân ba vương quốc nay đã chia sẻ một bản sắc rộng lớn hơn sau khi thống nhất, dẫn tới một nền văn hóa độc đáo phản ánh vô số ảnh hưởng.\n\nGiờ đây rõ ràng rằng người dân [county_to_change.GetName] không còn nhìn mình là [old_culture.GetName] nữa, mà là người bản xứ [goryeo.GetCollectiveNoun]!"
