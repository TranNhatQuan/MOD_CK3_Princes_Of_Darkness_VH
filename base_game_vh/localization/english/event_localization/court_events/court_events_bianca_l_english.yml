l_english:
 # Sus about a budding friend(?)ship
 court.3000.t:0 "Sự Nghi Ngờ Với Tình Bằng Hữu"
 court.3000.desc.opening:0 "Nỗi bất an thắt chặt dạ dày ta khi cơn ghen xấu xí trỗi dậy. Ta thở dài và trừng mắt nhìn nguyên nhân khiến ta khổ sở.\n\n"
 court.3000.desc.opening.trustful:0 "Một nhói ghen sắc lạnh dấy lên trong lồng ngực khi ta nhìn về phía tiếng cười. Cảm giác này không xa lạ với ta, nhưng việc ta cảm thấy như vậy lại không giống ta chút nào.\n\n"
 court.3000.desc:0 "Ta biết mình nên cảm thấy biết ơn khi vị khách của chúng ta, [foreign_guest.GetTitledFirstName], dường như rất hòa hợp với [family_member.GetName], nhưng cách hai người họ tương tác với nhau khiến ta lo lắng.\n\nNụ cười của họ giống như những gì bạn tri kỷ suốt đời — hoặc những tình nhân tận tụy — chia sẻ với nhau. Họ không hề che giấu việc hành xử như thể chỉ có hai người trong căn phòng, thản nhiên gạt ta ra khỏi câu chuyện của họ. Rốt cuộc mối quan hệ của họ là gì, và ta có nên làm gì đó không?"
 court.3000.a:0 "Ta #EMP phải#! chấm dứt bất cứ thứ gì đang nảy sinh giữa họ."
 court.3000.a.tt.success:0 "Mối quan hệ giữa [foreign_guest.GetFirstNamePossessiveNoTooltip] và [family_member.GetFirstNamePossessiveNoTooltip] vẫn giữ nguyên"
 court.3000.a.tt.failure:0 "[foreign_guest.GetFirstNameNoTooltip] và [family_member.GetFirstNameNoTooltip] phớt lờ ý muốn của ta và tiếp tục nuôi dưỡng mối quan hệ của họ"
 court.3000.b:0 "Ta nên khuyến khích mối liên kết của họ để chuyến thăm diễn ra tốt đẹp."
 court.3000.b.tt.success:0 "Mối quan hệ giữa [foreign_guest.GetFirstNamePossessiveNoTooltip] và [family_member.GetFirstNamePossessiveNoTooltip] trở nên sâu sắc hơn và họ trân trọng sự ủng hộ của ta"
 court.3000.b.tt.failure:0 "[foreign_guest.GetFirstNameNoTooltip] và [family_member.GetFirstNameNoTooltip] không thích việc ta xen vào"
 court.3000.c:0 "Dù mối quan hệ của họ là gì, ta cũng sẽ không xen vào."
 court.3000.c.tt.success:0 "Mối quan hệ giữa [foreign_guest.GetFirstNamePossessiveNoTooltip] và [family_member.GetFirstNamePossessiveNoTooltip] trở nên sâu sắc hơn"
 court.3000.c.tt.neutral:0 "[foreign_guest.GetFirstNameNoTooltip] và [family_member.GetFirstNameNoTooltip] trở nên thân thiết hơn"
 court.3000.d:0 "[foreign_guest.GetFirstNameNoTooltip] không còn được chào đón trong triều đình của ta!"
 court.3000.neutral_outcome:0 "Sự hứng thú dành cho nhau dần lắng xuống và trở lại như trước."
 court.3000.friendly_outcome:0 "Hai người có thể trở thành bạn bè, hoặc thậm chí là tình nhân..."
 court.3000.better_friends_outcome:0 "Hai người có thể trở thành tri kỷ, thậm chí còn hơn thế nữa..."

 # A courtier shows you their written work after being inspired by other writers
 court.3010.t:0 "Tác Phẩm Được Truyền Cảm Hứng"
 court.3010.desc.opening:1 "\"[ROOT.Char.Custom2('RelationToMeAddress', inspired_writer)|U]!\" [inspired_writer.GetTitledFirstName] tiến đến gần ta, ôm chặt một bản thảo. \"Thần đã viết một tác phẩm hư cấu sau khi đọc những tác phẩm văn học đang thịnh hành trong triều đình của ngài. Xin hãy nhận vinh dự trở thành người đầu tiên đọc những dòng chữ của thần!\" Ta nhận lấy bản thảo và lướt qua vài dòng.\n\n"
 court.3010.desc.low_learning:0 "Mỗi lần miêu tả nhân vật chính đều nhắc đến đôi 'con ngươi xanh biếc to lớn tuyệt đẹp' của hắn, và [inspired_writer.GetFirstNameNoTooltip] nhấn mạnh điều đó ngay cả trong những tình huống hoàn toàn không thích hợp."
 court.3010.desc.shy_or_chaste:0 "Ánh mắt ta dừng lại ở cảnh buổi tối. Hai người yêu nhau khẽ móc ngón út vào nhau vì quá ngượng ngùng để nắm tay. Họ thì thầm những lời ngọt ngào khi bước đi dưới biển sao vô tận."
 court.3010.desc.lustful:0 "Mỗi câu miêu tả phụ nữ đều cực kỳ chi tiết và luôn có những từ như rung rinh hay lắc lư. Nhưng không chỉ phụ nữ — đàn ông cũng vậy. Tuy nhiên, họ được miêu tả với cơ bắp cuồn cuộn và chiếc cằm sắc nét."
 court.3010.desc.adventurer_or_pilgrim:0 "Trọng tâm là những phong cảnh rộng lớn hùng vĩ và cách chúng thay đổi khi khoảng cách với quê nhà tăng lên. Cũng có vài đoạn nói về nỗi khao khát phiêu lưu và nỗi nhớ nhà, rõ ràng là trải nghiệm của chính người viết."
 court.3010.desc.sadistic:0 "Sự bạo lực được miêu tả vượt quá mức chịu đựng của hầu hết mọi người đối với máu me và sự ghê rợn. Nó vẽ nên cảnh tượng đỏ lòm máu, với các hiệp sĩ lội trong máu đến tận đầu gối."
 court.3010.desc.generic_fallback:1 "Bối cảnh quen thuộc, tên nhân vật chính cũng vậy. Khoan đã. Đây có phải là nỗ lực của [inspired_writer.GetFirstNamePossessiveNoTooltip] nhằm viết tiếp hoặc viết lại tác phẩm của người khác?"
 court.3010.desc.ending:0 "\n\nTa khẽ hắng giọng và ngẩng đầu khỏi bản thảo, bắt gặp ánh mắt mong chờ của [inspired_writer.GetFirstNamePossessiveNoTooltip]."
 court.3010.a:0 "Trời đất! Đây... đây thật tuyệt vời! Ngươi phải viết thêm nữa!"
 court.3010.a.tt:0 "Được khích lệ bởi lời khen của ngươi, [inspired_writer.GetFirstNameNoTooltip] sẽ nhờ ngươi đọc thêm các tác phẩm khác trong tương lai."
 court.3010.b:0 "Ta lo cho sức khỏe tinh thần của ngươi nếu đây là thứ do tâm trí ngươi tạo ra."
 court.3010.c:0 "Ngươi chắc chắn có tiềm năng, nhưng vẫn có vài điểm cần cải thiện."
 court.3010.c.neutral:0 "[inspired_writer.GetFirstNameNoTooltip] miễn cưỡng chấp nhận lời nhận xét của ngươi và có thể tiếp tục viết trong tương lai"
 court.3010.c.stress:0 "Điều [inspired_writer.GetSheHe] muốn — hoặc cần — là sự khích lệ chứ không phải phê bình"
 court.3010.c.depression:0 "Lời nói của ngươi đâm sâu vào tâm hồn họ"

 court.3011.desc.opening:0 "Ta nghe thấy tiếng bước chân của ai đó đang tiếp cận ta từ phía sau và quay lại nhìn thấy [inspired_writer.GetTitledFirstName] trông vô cùng phấn khích. \"[ROOT.Char.Custom2('RelationToMeAddress', inspired_writer)|U]!\" [inspired_writer.GetSheHe|U] háo hức gọi ta khi [inspired_writer.GetSheHe] rút ngắn khoảng cách giữa chúng ta và cúi đầu [inspired_writer.GetHerHis] của ngài một cách lấy lệ. \"Xong rồi! Bản thảo đầu tiên của tôi!\"\n\nBản thảo được nhét vào tay ta trước khi ta kịp nói gì. Một cái nhìn thoáng qua cho thấy"
 court.3011.desc.low_learning:1 "những miêu tả về 'đôi con ngươi xanh biếc to lớn tuyệt đẹp' của nhân vật chính trong những tình huống không thích hợp."
 court.3011.desc.shy_or_chaste:1 "những cảnh lãng mạn dịu dàng nhưng không thực tế giữa hai người yêu nhau."
 court.3011.desc.lustful:2 "những bộ phận cơ thể rung rinh, lắc lư và phồng lên quấn lấy nhau giữa chăn gối."
 court.3011.desc.adventurer_or_pilgrim:1 "những phong cảnh hùng vĩ rộng lớn cùng các đoạn viết về nỗi khát khao phiêu lưu."
 court.3011.desc.sadistic:1 "bạo lực, máu me và những chi tiết ghê rợn."
 court.3011.desc.generic_fallback:1 "những bản viết lại và phần tiếp nối của các câu chuyện nổi tiếng hơn."
 court.3011.desc.ending:0 "\n\nRõ ràng là [inspired_writer.GetFirstNameNoTooltip] đã tìm thấy nguồn cảm hứng [inspired_writer.GetHerHis] của ngài."
 court.3011.a:0 "Thật tuyệt! Ngươi phải tiếp tục viết thêm!"
 court.3011.b.gregarious:0 "\"Ta muốn thấy ngươi thử viết về chủ đề khác!\""
 court.3011.b.blunt:0 "\"Ngươi sẽ dậm chân tại chỗ nếu chỉ viết cùng một thứ.\""
 court.3011.c:0 "Ta không muốn đọc bản thảo của ngươi nữa."
 court.3011.c.tt.stop:0 "[inspired_writer.GetFirstNameNoTooltip] ngừng đưa ngươi xem tác phẩm của họ trong khi thử những điều mới."
 court.3011.c.tt.gain_inspiration:0 "[inspired_writer.GetFirstNameNoTooltip] được truyền cảm hứng để viết một kiệt tác!"
 court.3011.c.tt.hurt:0 "[inspired_writer.GetFirstNameNoTooltip] cảm thấy tổn thương vì sự thiếu ủng hộ của ngươi."

 #Latrine disaster events
 court.3020.t:0 "Mùi Hôi Khó Chịu"
 court.3020.desc.opening:1 "\"[ROOT.Char.Custom2('RelationToMeAddress', latrine_chancellor)|U]. Xin cho thần nói vài lời.\"\n\n[latrine_chancellor.GetCouncilTitle] của ta, [latrine_chancellor.GetTitledFirstName], tiến đến gần trong lúc triều chính tạm lắng. [latrine_chancellor.GetSheHe|U] ra hiệu về phía một góc phòng ít người hơn, và ta đi theo [latrine_chancellor.GetHerHim].\n\n\"Thần lo ngại về tình trạng của "
 court.3020.desc.castle:0 "Lâu đài [capital.GetNameNoTooltip]."
 court.3020.desc.city:0 "Tòa thị chính [capital.GetNameNoTooltip]."
 court.3020.desc.temple:0 "ngôi đền thờ tại [capital.GetNameNoTooltip]."
 court.3020.desc.ending:0 "Khi chúng thần họp trong một căn phòng, tất cả đều nhận thấy một... mùi kinh khủng! Chắc chắn nó bốc lên từ nhà xí ở tầng dưới. Thần khẩn cầu ngài hãy cân nhắc chi tiền sửa chữa những phần bị bỏ bê của tòa nhà.\""
 court.3020.a:0 "Ta sẽ đảm bảo vấn đề này được sửa chữa sớm nhất có thể."
 court.3020.b:0 "[latrine_steward.GetCouncilTitle] của ta có thể xử lý việc này."
 court.3020.b.success:0 "[latrine_steward.GetFirstName] mặc cả tốt và giúp ngươi tiết kiệm tiền"
 court.3020.b.failure:0 "[latrine_steward.GetFirstName] lại tiêu tốn nhiều tiền của ngươi hơn cần thiết"
 court.3020.c:1 "Hẳn $royal_architect_court_position$ của ta có thể sửa chuyện này mà không cần tốn tiền..."
 court.3020.c.success:0 "[royal_architect.GetFirstName] tìm ra giải pháp không tốn tiền"
 court.3020.c.failure:0 "[royal_architect.GetFirstName] không nghĩ ra cách nào mà không cần tiền"
 court.3020.d:0 "Chỉ cần bịt cái lỗ trên sàn lại!"

 court.3021.t:0 "Coi Chừng Bên Dưới!"
 court.3021.desc:0 "Ta được mời đến để phân xử cuộc cãi vã giữa [courtier1.GetTitledFirstName] và [courtier2.GetTitledFirstName]. Các cận thần của ta hẳn #EMP quá#! rảnh rỗi hôm nay, vì rất nhiều người kéo đến xem.\n\nTrong khi hai người họ cãi nhau về [courtier1.Custom('subject_of_interest')], một tiếng rầm kinh thiên cắt ngang tất cả. Mọi người trong phòng ngoài ta đều loạng choạng khi sàn gỗ rõ ràng bị oằn xuống! Hẳn [ROOT.Char.GetFaith.HighGodName] đang bảo hộ ta, vì ta ngồi trong một hốc tường không bị ảnh hưởng.\n\nNhững người gần cửa nhất vội chạy ra ngoài, còn những người khác chỉ biết hét lên khi sàn nhà sụp xuống. Ánh mắt ta chuyển qua lại giữa hai người đứng gần ta nhất."
 court.3021.a:0 "Theo bản năng, ta vươn tay về phía [courtier1.GetFirstNameNoTooltip]."
 court.3021.b:0 "Ta kéo [courtier2.GetFirstNameNoTooltip] đang hoảng loạn vào hốc tường vững chắc."
 court.3021.c:0 "Ta lùi lại trong kinh hoàng khi nhìn mọi người rơi xuống đống nhà xí bên dưới."
 court.3021.latrine_disaster:0 "Thảm Họa Nhà Xí [capital.GetNameNoTooltip]"
 
 #Lady-in-waiting 
 court.3030.t:0 "Khó Tính Với Trang Phục"
 court.3030.desc.intro:0 "Luôn hết sức tận tụy, $lady_in_waiting_court_position$ của ta, [fussy_liw.GetFirstName], theo sát bên ta để bảo đảm ta vừa cư xử vừa xuất hiện một cách đúng mực nơi triều đình.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Xin hãy đứng yên một lát để ta chỉnh lại y phục cho ngài!\"\n\n"
 court.3030.desc.lovers:1 "Theo bản năng ta nghiêng người theo cái chạm của [fussy_liw.GetHerHis], rồi chợt dừng lại khi nhận ra chúng ta đang ở nơi công cộng. Dù việc [fussy_liw.GetFirstNameNoTooltip] thân thiết nhất của ta quá tỉ mỉ với trang phục của ta không phải chuyện hiếm,"
 court.3030.desc.generic:1 "[fussy_liw.GetFirstNameNoTooltip] dường như chẳng hề bận tâm rằng chúng ta đang ở nơi công cộng khi [fussy_liw.GetSheHe] chỉnh lại y phục cho ta,"
 court.3030.desc.ending:0 "ta không khỏi cảm thấy như thể [fussy_liw.GetSheHe] đang đối xử với ta như một đứa trẻ nghịch ngợm!\n\nKhi ta còn đang trầm ngâm suy nghĩ, ta nhận ra những người xung quanh đang thì thầm với nhau và ta cảm thấy mình phải lên tiếng!"
 court.3030.a:0 "Làm ầm lên: \"Ngươi #EMP dám#! chạm tay vào #EMP ta#! sao!?\""
 court.3030.b:0 "\"Ngươi đáng lẽ phải chỉnh sửa mấy thứ này sớm hơn và nhanh hơn!\""
 court.3030.c:0 "Không nói gì vì [fussy_liw.GetSheHe] chỉ đang làm bổn phận của [fussy_liw.GetHerHis]."
 court.3030.d:0 "\"Không cần chỉnh sửa gì cả.\""
 
 court.3031.t:0 "Xoa Dịu Mọi Chuyện"
 court.3031.desc:0 "Khi ta đang dành một khoảnh khắc tĩnh lặng tại triều đình, lặng lẽ quan sát mọi người, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('liw'))] [liw.GetFirstName] của ta tiếp cận.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], xin cho tôi một chút thời gian của ngài?\"\n\n[liw.GetSheHe|U] [liw.Custom('quirk_pos_present')] trong khi chờ đợi sự cho phép của ta. Ta gật đầu với [liw.GetHerHim] để tiếp tục.\n\n\"Trong công việc của mình, tôi có ấn tượng tốt về những gì mọi người nghĩ và điều gì khiến họ hành động. Với kiến thức này, tôi có thể cố gắng làm dịu mọi thứ với một nhóm mà ngài quan tâm, ngài thấy sao?\""
 court.3031.a:0 "Cải thiện vị thế của ta với các chư hầu thuộc thiểu số."
 court.3031.b:0 "Nói giúp ta vài lời tốt đẹp với các Nam tước."
 court.3031.c:0 "Ta muốn thiết lập mối quan hệ tốt hơn với [reference_county.GetProvince.GetCounty.GetCulture.GetCollectiveNounNoTooltip]."
 every_culture_county_3031:0 "Every [realm|E] [county|E] of [reference_county.GetCulture.GetName] [culture|E]"
 court.3031.d:0 "Ta không quan tâm người khác nghĩ gì."

 #Homesickness
 court.3040.t:0 "[homesick_parent.GetMotherFather|U] Nhớ Nhà"
 court.3040.desc:0 "Khi ta đang đi một vòng giao thiệp nơi triều đình, ta lại nghe một tiếng thở dài nặng nề từ [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('homesick_parent'))] của ta. Dù cố ý hay không, vẻ u sầu của [homesick_parent.GetTitledFirstNamePossessive] đã không qua mắt được ai.\n\n\"Ồ, chào con,\" [homesick_parent.GetSheHe] nói sau khi giật mình lúc đầu. Ta không chắc [homesick_parent.GetTitledFirstNameNoTooltip] đang làm quá hay nói thật. \"Con đừng bận tâm đến ta. Ta chỉ là nhớ nhà thôi...\"\n\nTa còn chưa kịp đáp lời thì [homesick_parent.GetSheHe] lại thở dài não nề thêm lần nữa. Rời đi mà không nói gì chắc chắn chẳng thay đổi được gì, nên ta quyết định lên tiếng."
 court.3040.a:0 "Ngài chỉ đang nhớ những tiện nghi của người [homesick_parent.GetCulture.GetNameNoTooltip] thôi!"
 court.3040.a.tt: "Tăng ngẫu nhiên một [court_amenity|E] lên một cấp"
 court.3040.a.tt_2: "Cấp Tiện Nghi Triều Đình Tăng"
 court.3040.b:1 "Ngài nên bận rộn làm việc thay vì ủ rũ như vậy."
 court.3040.c:0 "Một chút hài hước kiểu [homesick_parent.GetCulture.GetNameNoTooltip] sẽ giúp ích!"
 court.3040.c.tt: "Một $court_jester_court_position$ cùng văn hóa với [homesick_parent.GetHerHis] chắc chắn sẽ khiến [homesick_parent.GetHerHim] bật cười."
 court.3040.d:0 "Cảm xúc của ngài là chuyện của ngài. Đừng mang nó tới triều đình của ta."

 #Chief Eunuch
 court.3050.t:0 "Thư Phỉ Báng"
 court.3050.desc:0 "\"Ta có một đề xuất tuyệt vời cho [ROOT.Char.GetLadyLord] của ta,\" $chief_eunuch_court_position$ của ta, [chief_eunuch.GetFirstName], nói với vẻ đầy mưu tính.\n\n\"Một kẻ chỉ trích ngài, [target.GetTitledFirstName], hiện đang có mặt ở đây hôm nay. Nếu ngài muốn, ta có thể tạo một bức thư incriminating trên người [target.GetHerHis] để chúng ta có thể công khai chế nhạo [target.GetHerHim]\".\n\n[chief_eunuch.GetFirstNameNoTooltip] nở một nụ cười [chief_eunuch.Custom('quirk_neg_adjective')] trong khi cố nén tiếng cười. \"Vậy ngài muốn ta viết gì vào bức thư?\""
 court.3050.a:0 "Nhắc cho kẻ ngu đó rằng ta biết bí mật của [target.GetHerHis] chắc sẽ khiến [target.GetHerHim] toát mồ hôi."
 court.3050.b:0 "Giả mạo một lá thư từ chối chế nhạo [target.GetTitledFirstNameNoTooltip] vì sự kém hấp dẫn của [target.GetHerHis]."
 court.3050.c:0 "Gài bằng chứng rằng [target.GetFirstNameNoTooltip] đã bôi nhọ người khác."
 court.3050.d:0 "Lần này đừng khuấy động chuyện lên."

 #Cat
 court.3060.t:0 "Thợ Săn Mèo"
 court.3060.desc:0 "\"Ta nghĩ ta đã tìm ra lý do vì sao có những ngày ít chuột hơn hẳn!\" [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('cat_finder'))] của ta, [cat_finder.GetTitledFirstName], vui vẻ nói khi [cat_finder.GetSheHe] bước sang một bên để lộ ra một người hầu đang giữ một con mèo #EMP rất#! khó chịu.\n\nNó vùng vẫy cố thoát khỏi cánh tay đầy vết cào của người hầu, kêu meo meo khá đáng yêu.\n\n\"Ta dám nói đây là một tay săn chuột thành công! Thật vậy, khi chúng ta tìm thấy nó, nó đang vật lộn với một con chuột béo ú! Ngài nghĩ sao, chúng ta có nên nhận nuôi con mèo này không?\""
 court.3060.a:0 "Ta rất muốn có một bạn mèo!"
 court.3060.b:0 "Sao ngươi không nhận nuôi nó, vì chính ngươi là người tìm thấy?"
 court.3060.c:0 "Ngươi không thể huấn luyện một con chó săn chuột sao?"
 court.3060.d:0 "Lần này thì không cần mèo."
 
 #Royal Court
 court.3070.t:0 "[ROOT.Char.GetTitleTierName] Vô Danh"
 court.3070.desc.opening:0 "\"Ồ, rồi ngươi sẽ không tin chuyện xảy ra tiếp theo đâu!\" Vị khách của ta, [court_enjoyer.GetTitledFirstName], cứ nói mãi về bản thân [court_enjoyer.GetHerselfHimself] và mọi chuyện xảy ra với [court_enjoyer.GetHerHim]. Ngoài việc lải nhải không ngừng của [court_enjoyer.GetHerHis], ta còn cảm thấy khó chịu khi một kẻ xa lạ lại nói chuyện với ta quá thân mật.\n\nTa cố tìm cớ rời khỏi vị khách bằng cách nói với [court_enjoyer.GetHerHim] rằng ta còn việc khác phải làm và người khác phải gặp, nhưng [court_enjoyer.GetSheHe] ngắt lời ta, hỏi ta làm nghề gì hay ta có ở đây để "
 court.3070.desc.opening_food:0 "thưởng thức đồ ăn ngon như mọi vị khách khác."
 court.3070.desc.opening_lodging:0 "tận hưởng những chiếc giường xa hoa như mọi vị khách khác."
 court.3070.desc.opening_fashion:0 "ăn mặc như [ROOT.Char.GetTitleAsNameNoTooltip] trong một ngày như mọi vị khách khác."
 court.3070.desc.opening_servants:0 "được đối xử như [ROOT.Char.GetTitleAsNameNoTooltip] trong một ngày như mọi vị khách khác."
 court.3070.desc.middle:1 "\n\nSững sờ, ta cuối cùng cũng đáp: \"Ta chính là #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#!...!\"\n\nMáu rút khỏi khuôn mặt [court_enjoyer.GetHerHis] và [court_enjoyer.GetSheHe] bắt đầu lắp bắp.\n\n\"Xin ngài thứ lỗi, [ROOT.Char.Custom('FormOfAddressForLiege')]! Ta-ta thề ta không ở đây chỉ để bám vào sự giàu có của ngài và "
 court.3070.desc.closing_food:0 "ăn uống như [ROOT.Char.GetTitleAsNameNoTooltip]!\""
 court.3070.desc.closing_lodging:0 "ở trong nơi nghỉ sang trọng nhất vương quốc!\""
 court.3070.desc.closing_fashion:0 "vây quanh mình với những người ăn mặc thời thượng nhất vương quốc!\""
 court.3070.desc.closing_servants:0 "để có người hầu phục vụ mọi nhu cầu của ta trong một thời gian ngắn!\""
 court.3070.desc.closing:0 "Ta thề! Chỉ là... danh tiếng triều đình của ngài được nhắc đến nhiều hơn cả dung mạo của ngài, [ROOT.Char.Custom('FormOfAddressForLiege')]!\""
 court.3070.a:0 "Có lẽ họ sẽ nhớ đến ta nếu ta lấy ngươi làm gương!"
 court.3070.b:0 "Hãy truyền đi rằng ta là một chủ nhà hiếu khách."
 court.3070.c:0 "Ta sẽ đặt ra một bài kiểm tra bắt buộc cho khách muốn ở lại đây..."
 court.3070.d:0 "Ta... thực ra cũng không ngại việc mọi người không biết ta là ai."

