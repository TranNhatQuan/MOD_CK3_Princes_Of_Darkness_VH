l_english:
### Events
## Court Event 7030
# Foreign Merchants wish to establish a merchant quarter
  court.7030.title:0 "Thương Nhân Ngoại Quốc"
  court.7030.desc:0 "Khi ta quan sát triều đình của mình, ta nhận thấy [ROOT.Char.GetCouncillorPosition( 'councillor_steward' ).GetPositionName] của ta, [steward.GetTitledFirstName], đang trò chuyện sôi nổi với một vị khách ngoại quốc của ta, [foreign_merchant.GetName]. Tò mò, ta tiến lại gần hai người.\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip], ta đại diện cho lợi ích của một nhóm thương nhân là những đồng bào [foreign_merchant.GetCulture.GetName] của ta, những người nhìn thấy tiềm năng to lớn trong việc thiết lập một cộng đồng thương nhân [foreign_merchant.GetCulture.GetCollectiveNounNoTooltip] tại đây ở [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier],\" [foreign_merchant.GetNameNoTooltip] cung kính nói.\n\n\"[ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('steward'))|U], chúng ta không được ưu ái #EMP ngoại nhân#! hơn chính dân chúng của mình!\" [steward.GetFirstNameNoTooltip] phản đối."
  court.7030.a:0 "Chúng ta sẽ thiết lập một cộng đồng thương nhân [foreign_merchant.GetCulture.GetCollectiveNounNoTooltip]."
  court.7030.b:0 "Một thỏa thuận có thể đạt được ở đây."
  court.7030.c:0 "Chúng ta sẽ mở rộng khu buôn bán cho tất cả!"
  court.7030.d:0 "[foreign_merchant.GetCulture.GetCollectiveNounNoTooltip] sẽ không được bóc lột thị trường của chúng ta!"
  court.7030.d.tt:0 "Trục xuất [foreign_merchant.GetFirstNameNoTooltip] khỏi lãnh địa của chúng ta, và hợp pháp tịch thu số vàng mà [foreign_merchant.GetSheHe] đã moi được từ các thương nhân của chúng ta!"
### Court Event 7040
  court.7040.title:0 "Trụ Cột Của Cộng Đồng"
  court.7040.desc:1 "Ta nhận thấy [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] của ta đang đi đi lại lại trong phòng với vẻ lo lắng.\n\n\"[chaplain.GetName], có chuyện gì vậy?\" ta hỏi.\n\n\"Đó là [ascetic.GetName], thưa ngài. [ascetic.GetSheHe|U] đã bắt đầu leo lên một cây cột trong sân cung điện vào mỗi buổi sáng, và ở đó suốt cả ngày trong sự trầm tư tĩnh lặng. [ascetic.GetSheHe|U] từ chối thức ăn và nước uống, và nói rất ít khi bị chất vấn. Những thực hành khổ hạnh như thế này không phải là chưa từng thấy, nhưng điều đó đang khiến một số người trong triều đình khó chịu và họ yêu cầu thần phải làm gì đó.\""
  court.7040.a:0 "Cứ mặc kệ [ascetic.GetHerHim], rồi [ascetic.GetSheHe] cũng sẽ chấm dứt thôi."
  court.7040.b:0 "Gửi [ascetic.GetHerHim] đến [head_of_faith.GetTitledFirstNameNoTooltip], xem [head_of_faith.GetSheHe] nghĩ gì về chuyện này."
  court.7040.c:0 "Lòng mộ đạo của [ascetic.GetNamePossessiveNoTooltip] thật truyền cảm hứng, ta sẽ noi theo tấm gương của [ascetic.GetHerHis]!"
  court.7040.d:0 "Nếu [ascetic.GetSheHe] muốn sống cô lập, thì [ascetic.GetSheHe] có thể làm điều đó ở nơi khác!"
### Court Event 7050 - Friend gifts you a cultural artifact from their time
  court.7050.title:0 "Món Quà Từ Một Người Bạn"
  court.7050.desc:0 "Khi công việc của triều đình tiếp tục, ta rất vui mừng khi nhìn thấy khuôn mặt của người bạn [friend.GetName] giữa hàng tá những kẻ âm mưu và nịnh thần. Ta chào [friend.GetFirstNameNoTooltip] một cách nồng nhiệt, và trò chuyện tự do với [friend.GetHerHim] như ta có thể làm với rất ít người khác. Giữa cuộc trò chuyện, [friend.GetSheHe] lấy ra một chiếc túi nhỏ từ trong trang phục [friend.GetHerHis] của ngài, và đặt nó vào tay ta. \n\n\"Một món quà cho ngài, người bạn của tôi, một chút gì đó để ngài nhớ về những khoảng thời gian tốt đẹp. Nó đặc biệt với tôi, và với người dân của tôi [friend.GetCulture.GetCollectiveNoun]. Hy vọng ngài sẽ chấp nhận nó.\""
  court.7050.a:0 ""Dĩ nhiên rồi bạn của ta, ta sẽ luôn giữ nó bên mình!"
  court.7050.a.tt:0 "Điều này có thể dẫn đến những hậu quả ngoài ý muốn..."
  court.7050.b:0 ""Ngươi thật quá tốt bụng, ta nhận món quà của ngươi!""
  court.7050.c:0 "Ta là người [ROOT.Char.GetCulture.GetNameNoTooltip], không phải [friend.GetCulture.GetNameNoTooltip]! Ta từ chối món quà của ngươi."
  court.7051.title:0 "Biểu Tượng Dị Giáo?"
  court.7051.desc:0 "Kể từ khi ta nhận được [court_7050_artifact.GetName] như một món quà từ [friend.GetName], ta luôn giữ nó bên mình. Ta cho rằng nó chắc hẳn đã bị chú ý tại triều đình, vì bây giờ ta đã bị [court_chaplain.GetCouncilTitle] [court_chaplain.GetName] tiếp cận, người bày tỏ sự lo lắng [court_chaplain.GetHerHis] của ngài rằng ta đang bị dẫn dắt khỏi đức tin chân chính!\n\n\"Tôi nhận thấy ngài đã bắt đầu thể hiện sự yêu thích của mình đối với các biểu tượng và đồ vật dị giáo, những thứ liên quan đến đức tin [court_chaplain.Custom('GetDerogatoryNonbeliever')] khác. Người ta thường nói rằng [court_chaplain.GetFaith.DevilName] đến với chúng ta dưới hình dạng một người bạn, chỉ để dẫn dắt chúng ta đi lạc lối.\""
  court.7051.a:0 "Ta đã bị [ROOT.Char.GetFaith.DevilName] lừa dối!"
  court.7051.a.tt:0 "Đứng về phía các tín đồ [court_chaplain.GetFaith.GetAdherentNamePlural] thay vì người bạn của ngươi."
  court.7051.b:0 "Biểu tượng? Thánh tích? Ngươi đang nói cái quái gì vậy?"
  court.7051.b.tt:0 "Giả vờ không biết về bảo vật."
  court.7051.c:0 "Ngươi không thể phân biệt giữa văn hóa và đức tin sao?"
  court.7051.c.success:0 "Ngươi thuyết phục được [court_chaplain.GetNameNoTooltip]"
  court.7051.c.failure:0 "Ngươi không thể thuyết phục được [court_chaplain.GetNameNoTooltip]"
  court.7051.d:0 "Cút đi, ta tin rằng [friend.GetNameNoTooltip] sẽ không dẫn ta lầm đường!"
### Court Event 7070 - Architect wishes to give your palace a makeover
  court.7070.title:0 "Tiềm Năng Cung Điện"
  court.7070.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], ta đã bàn về tình trạng hiện tại của cung điện của ngài ở [palace_county.GetName] với các cận thần của ngài từng lưu trú tại đó. Với tư cách là $royal_architect_court_position$ của ngài, ta sẽ thất trách nếu không báo rằng cung điện của ngài ở [palace_county.GetName] đang rất cần được tu sửa!\" [architect.GetName] nói.\n\n\"Ta tự hỏi [ROOT.Char.Custom2('RelationToMeAddress',architect)], liệu chúng ta có thể nhân cơ hội này để cải tổ toàn bộ trang trí và phong cách của cung điện, có lẽ rời xa kiến trúc cổ điển [ROOT.Char.GetCulture.GetName]. Tất cả những gì ta cần là kinh phí và chút thời gian để phác thảo vài ý tưởng,\" [architect.GetFirstNameNoTooltip] hỏi."
  court.7070.a:0 "Đề xuất tuyệt vời, ngươi có thể bắt đầu vẽ kế hoạch."
  court.7070.a.tt:0 "[architect.GetFirstNameNoTooltip] sẽ lấy cảm hứng từ các [cultures|E] khác khi lập kế hoạch tu sửa cung điện, đưa ra những lựa chọn có thể tăng [cultural_acceptance|E] đối với các [cultures|E] khác."
  court.7070.b:0 "Sự xa hoa như vậy là không cần thiết, chỉ cần sửa chữa đơn giản."
  court.7070.c:0 "Cung điện vẫn ổn như hiện tại!"
  court.7071.title:0 "Kiến Trúc Mô Phỏng"
  court.7071.desc:0 "Đúng như đã hứa, [architect.GetName] quay lại với ta cùng ba bản kế hoạch chi tiết cho việc cải tạo cung điện ở [palace_county.GetName].\n\n\"Ta đã lấy cảm hứng từ phong cách [culture_option_1.GetProvince.GetCounty.GetCulture.GetName] cho thiết kế đầu tiên, phong cách [culture_option_2.GetProvince.GetCounty.GetCulture.GetName] cho thiết kế thứ hai, và với bản kế hoạch cuối cùng ta giữ [ROOT.Char.GetCulture.GetName] làm ảnh hưởng chính, [ROOT.Char.Custom2('RelationToMeAddress',architect)].\"\n\nNhìn qua thì cả ba thiết kế đều rất tốn kém và bao gồm cả các phần xây mới lẫn cải tạo cấu trúc hiện có - rõ ràng đây sẽ không phải là công việc nhanh chóng hay rẻ tiền."
  court.7071.a:0 "Chọn thiết kế [culture_option_1.GetProvince.GetCounty.GetCulture.GetNameNoTooltip]."
  court.7071.continue:0 "Dự án tiếp tục..."
  court.7071.b:0 "Hãy dùng thiết kế [culture_option_2.GetProvince.GetCounty.GetCulture.GetNameNoTooltip]."
  court.7071.c:0 "Cung điện này sẽ là tượng đài cho sự ưu việt của [ROOT.Char.GetCulture.GetNameNoTooltip]!"
  court.7071.d:0 "Quá mức rồi, hủy dự án."
  court.7072.title:0 "Cải Tạo Cung Điện Hoàn Tất!"
  court.7072.desc.other_culture:0 "Sau nhiều tháng làm việc, ta được báo rằng công trình xây dựng tại cung điện ở [palace_county.GetName] đã hoàn tất, và ta đã đến [palace_county.GetNameNoTooltip] cùng $royal_architect_court_position$ của ta [architect.GetName] để đích thân kiểm tra kết quả.\n\nKhi ta nhìn ngắm cung điện mới, rồi bước vào bên trong, [architect.GetFirstNameNoTooltip] vẫn đứng bên cạnh ta, háo hức chờ đợi lời khen và sự bảo trợ. Sau khi xem xét cung điện với phong cách xa lạ và trang trí ngoại quốc, ta tuyên bố nó là..."
  court.7072.desc.own_culture:0 "Sau nhiều tháng làm việc, ta được báo rằng công trình xây dựng tại cung điện ở [palace_county.GetName] đã hoàn tất, và ta đã đến [palace_county.GetNameNoTooltip] cùng $royal_architect_court_position$ của ta [architect.GetName] để đích thân kiểm tra kết quả. Khi ta nhìn ngắm cung điện mới rồi bước vào bên trong, [architect.GetFirstNameNoTooltip] vẫn đứng bên cạnh ta, háo hức chờ đợi lời khen và sự bảo trợ. Sau khi xem xét cung điện với phong cách quen thuộc và trang trí đáng tin cậy, ta tuyên bố nó là..."
  court.7072.a:0 ""Tráng lệ, thật sự tráng lệ!""
  court.7072.b:0 ""Một sự báng bổ, ta ghét thứ này!""
  court.7072.c:0 ""Chấp nhận được, nhưng liệu có đáng với chi phí không?""
## Exotic Pet 
  court.7100.title:0 "Dã Thú Bị Bắt"
  court.7100.desc:0 "Đủ loại chuyện kỳ lạ từng xảy ra trong triều đình của ta, nhưng việc $master_of_hunt_court_position$ [huntmaster.GetFirstName] dắt một #EMP [SCOPE.Custom('GetExoticPet')] #!vào phòng ngai vàng bằng xích thì thật sự là điều ta chưa từng nghĩ tới.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ta dâng lên ngài con thú tuyệt vời này làm quà, chiến lợi phẩm từ cuộc săn gần nhất của ta! #EMP Tất cả #!các quân chủ ngày nay đều có thú lạ để tô điểm cho triều đình và thể hiện uy nghi của mình!\"\n\nRõ ràng [huntmaster.GetFirstNameNoTooltip] muốn ta giữ thứ này!"
  court.7100.a:0 "Ta thì làm gì với một con [SCOPE.Custom('GetExoticPet')]?"
  court.7100.a.tt:0 "Ra lệnh cho [huntmaster.GetFirstName] xử lý con vật ngay lập tức!"
  court.7100.b:0 "Con thú này sẽ là thú cưng yêu quý của ta!"
  court.7100.c:0 "T-tại sao #EMP ngươi #!không giữ nó?"
## Court Musician Racket
  court.7200.title:0 "Ồn Ào Và Tự Hào"
  court.7200.intro.desc:0 "Ta luôn tự hào về sự xa hoa của triều đình mình, nhưng suốt nhiều đêm nay sự xa hoa đó lại mang hình thức của một cực hình âm nhạc tinh xảo."
  court.7200.drum.desc:0 "\n\nGần đây, $court_musician_court_position$ của ta [loud_musician.GetFirstName] đã có được một nhạc cụ mới, một loại trống nào đó, và liên tục đập vào nó ầm ĩ cả ngày lẫn đêm."
  court.7200.trombone.desc:0 "\n\nGần đây, $court_musician_court_position$ của ta [loud_musician.GetFirstName] đã có được một nhạc cụ mới, một loại kèn đồng nào đó, và liên tục thổi nó inh ỏi cả ngày lẫn đêm."
  court.7200.pipes.desc:0 "\n\nGần đây, $court_musician_court_position$ của ta [loud_musician.GetFirstName] đã có được một nhạc cụ mới, một loại ống sáo nào đó, và liên tục thổi những âm thanh chói tai suốt ngày đêm."
  court.7200.guitar.desc:0 "\n\nGần đây, $court_musician_court_position$ của ta [loud_musician.GetFirstName] đã có được một nhạc cụ mới, một cây citola ta tin là vậy, và liên tục gảy nó ầm ĩ cả ngày lẫn đêm."
  court.7200.outro.desc:0 "\n\nKhi đối chất với [loud_musician.GetFirstNameNoTooltip], [loud_musician.GetSheHe] tuyên bố, \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ta chỉ đang luyện tập nghệ thuật của mình, để trở thành $court_musician_court_position$ xứng đáng với ngài!\""
  court.7200.a:0 "Chỉ cần giữ âm nhạc nhỏ lại vào ban đêm được không?"
  court.7200.b:0 "Mang cái #EMP nghệ thuật #!của ngươi mà cút đi!"
  court.7200.c:0 "Nếu âm nhạc của ngươi hay hơn, chúng ta đã không phàn nàn!" 
# Food Taster Displeased
  court.7300.t:0 "Nước sốt thịt cừu đâu rồi?"
  court.7300.desc:1 "Những âm mưu ám sát ta là điều có thể lường trước, vì vậy những người ta dựa vào để bảo vệ mình phải luôn trung thành và có thiện chí với ta. Tuy nhiên hôm nay, $food_taster_court_position$ được chỉ định của ta là [taster.GetFirstName] trông vô cùng ghê tởm và hơi tái xanh khi ta hỏi thăm [taster.GetHerHim].\n\n "[ROOT.Char.Custom('FormOfAddressForLiege')|U], thần thật sự không thể chịu đựng thêm nữa. Thức ăn mà triều đình của ngài phục vụ thật sự #EMP kinh khủng!#! Thần không thể tin rằng ngài ăn thứ cháo loãng này #EMP hết đêm này đến đêm khác..."#!\n\n"...Thứ này thậm chí còn chẳng xứng đặt lên bàn của một nông dân!""
  court.7300.a:0 "#EMP Bàn của nông dân? #!Chúng ta phải sửa chuyện này ngay!"
  court.7300.b:0 "Thức ăn vẫn ổn mà, ngươi đang nói gì vậy?"
  court.7300.c:0 "Được thôi, ta sẽ tìm người khác nhận tiền để ăn thử thức ăn của ta!"
## Troublesome Guests
  court.7400.title:0 "Ở Lại Quá Lâu?"
  court.7400.desc:1 "Triều đình của ta đã trở nên nổi tiếng vì mức độ hiếu khách xa hoa, và những vị khách ở đây thường tỏ ra... hữu ích.\n\nTuy nhiên đôi khi, chúng ta lại có những vị khách #EMP thừa thãi #! mà mục đích của họ không rõ ràng và sự hiện diện của họ chỉ làm tiêu tốn ngân khố của ta.\n\nMột kẻ ăn bám như vậy là [guest.GetFirstName], người đã ở đây một thời gian với tư cách khách của [guest_liege.GetTitledFirstName] và dường như ăn đủ cho mười hai người.\n\nKẻ [guest.GetWomanMan] này đang ăn sạch tài sản của ta, và chắc chắn #EMP phải#! làm gì đó."
  court.7400.a:0 "Cứ để [guest.GetHerHim] ở lại."
  court.7400.a.tt:0 "Biết đâu một lúc nào đó họ sẽ có ích, đúng không?"
  court.7400.b:1 "Ta biết công việc hoàn hảo cho [guest.GetHerHim]..."
  court.7400.b.tt:1 "Thuê [guest.GetHerHim] làm một công việc tầm thường trong triều."
  court.7400.c:1 "Đồ ký sinh, quay về nơi ngươi đến đi!"
## Child starts to go hunting
  court.7600.t:0 "Trái Tim Hoang Dã"
  court.7600.desc:1 "[child.Custom('GetDaughterSon')] [child.GetName] của ta bước vào phòng ngai vàng với bùn và máu bết đầy trên khuôn mặt [child.GetHerHis] của con. Ta đứng dậy kinh ngạc, định khiển trách [child.GetHerHim] vì sự không đúng mực [child.GetHerHis] của con, khi $master_of_hunt_court_position$ [huntmaster.GetFirstName] bước vào, cũng lấm lem bùn đất và vết máu, cười ngoác đến tận mang tai.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], [child.GetTitledFirstNameNoTooltip] ở đây đã hạ gục một con [child.Custom('GetAnimalType')] hùng mạnh trong cuộc đi săn của chúng ta, có lẽ là con tốt nhất tôi thấy trong năm nay.\"\n\nTa cho rằng các lớp học săn bắn [child.GetFirstNamePossessiveNoTooltip] của con đang diễn ra tốt đẹp, nhưng ta không thể không tự hỏi liệu có cách nào hiệu quả hơn để đầu tư thời gian [child.GetHerHis] của con..."
  court.7600.a:1 "Những chuyến đi này sẽ được thay bằng các buổi học hữu ích hơn."
  court.7600.b:1 "Hmmm, có lẽ chúng ta nên thử thách [child.Custom('GetDaughterSon')] của ta thêm..."
  court.7600.b.tt:1 "Ra lệnh cho [huntmaster.GetNameNoTooltip] đẩy [child.GetNameNoTooltip] đến giới hạn của [child.GetHerHis] trong một cuộc săn khác."
  court.7600.b.death:1 "[child.GetNameNoTooltip] chết trong lúc đi săn"
  court.7600.b.wounding:1 "[child.GetNameNoTooltip] bị thương trong lúc đi săn"
  court.7600.b.victory:1 "Cuộc săn thành công của [child.GetNameNoTooltip]"
  court.7600.c:1 "Ta không thể tự hào hơn nữa!"
  7600_taking_child_to_hunt: "Đưa Trẻ Đi Săn"
  7600_taking_child_to_hunt.tt: "Đưa trẻ em đi săn an toàn là trách nhiệm đòi hỏi nhiều kinh nghiệm. [aptitude|E] của $master_of_hunt_court_position$ của bạn tăng lên."
## Child wants a destrier
  court.7610.title:0 "Một Yêu Cầu Từ Chuồng Ngựa"
  court.7610.desc:1 "[child.Custom('GetDaughterSon')] của ta là [child.GetName] đang lớn lên, và một ngày nào đó sẽ phải đảm nhận vai trò cao hơn trong xã hội. Có vẻ như [child.GetSheHe] đã quyết định rằng ngày đó chính là hôm nay.\n\n "[ROOT.Char.GetMotherFather|U], con có thể có một con destrier không?"\n\n#EMP Một chiến mã?#! Cho một #EMP đứa trẻ?!#! Khi ta suy nghĩ về yêu cầu này, ta thấy $master_of_horse_court_position$ [horsemaster.GetName] đang liếc nhìn ta từ phía bên kia phòng ngai vàng.\n\nÍt nhất giờ ta cũng biết gần đây [child.Custom('GetDaughterSon')] của ta đã nói chuyện với ai...."
  court.7610.a:0 "Một lựa chọn táo bạo!"
  court.7610.b:1 "Hay là thứ gì đó... nhỏ hơn?"
  court.7610.c:1 "Đừng ngớ ngẩn."
## Negotiation over a falcon
  court.7620.title:0 "Những Chú Chim Lông Vàng"
  court.7620.desc:1 "Ở phía bên phòng ngai vàng, ta nghe thấy $master_of_hunt_court_position$ [huntmaster.GetName] đang thương lượng gay gắt với [falconer.GetName] về việc mua bán một con chim ưng peregrine tuyệt đẹp, một loài chim rất danh giá để sở hữu.\n\n[huntmaster.GetFirstNameNoTooltip] dường như đang mắc kẹt trong việc mặc cả giá, trong khi người nuôi chim ưng không chịu nhượng bộ, và qua sự bực bội trong giọng nói của cả hai, rõ ràng họ đã tranh cãi #EMP khá lâu#!.\n\nCó lẽ họ sẽ đánh giá cao sự can thiệp của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]... gần như nhiều như ta sẽ đánh giá cao một con chim mới."
  court.7620.a:0 "[falconer.GetFirstNameNoTooltip], ngươi đang đòi quá nhiều!"
  court.7620.a.success:0 "Bạn thương lượng thành công với [falconer.GetShortUINameNoTooltip]"
  court.7620.a.failure:0 "Bạn thất bại trong việc thương lượng với [falconer.GetShortUINameNoTooltip]"
  court.7620.b:1 "Nào, ta sẽ đưa ra cho ngươi một đề nghị tốt hơn."
  court.7620.c:0 "Chỉ cần đừng làm ồn trong phòng ngai vàng của ta là được."
## Argument over a hawking kill
  court.7630.title:0 "Chim Săn Mồi"
  court.7630.desc:0 "Việc săn bắn dường như làm lộ ra những điều tồi tệ nhất trong vòng cận thần của ta. $master_of_horse_court_position$ của ta là [horsemaster.GetName] và $master_of_hunt_court_position$ của ta là [huntmaster.GetName] vừa trở về từ chuyến săn chung, và giờ họ đang cãi vã dữ dội ngay giữa phòng ngai vàng của ta.\n\n"My bird drew it out, it must have made the kill!" yells [horsemaster.GetFirstNameNoTooltip].\n\n "My bird had the corpse, there is no question that the glory is mine!" shouts [huntmaster.GetFirstNameNoTooltip].\n\nHọ dường như đang nổi giận vì con chim ưng nào đã thực sự hạ con mồi."
  court.7630.a:0 "Chiến thắng thuộc về [horsemaster.GetFirstNameNoTooltip]."
  court.7630.b:0 "Đây là thành công của [huntmaster.GetFirstNamePossessiveNoTooltip]."
  court.7630.c:0 "Tại sao hai người không cùng chia sẻ chiến thắng này?"
  court.7630.c.tt:0 "Cố thuyết phục [horsemaster.GetShortUIName] và [huntmaster.GetShortUIName] rằng cả hai đều là người chiến thắng:"
  court.7630.c.success:0 "Bạn thành công tìm ra giải pháp dung hòa"
  court.7630.c.failure:0 "Bạn chỉ khiến mọi chuyện tệ hơn"
## Courtier Abused their Bird
  court.7640.title:0 "Ngược Đãi Chim Săn"
  court.7640.desc:1 "\"Bắt [avian_abuser.GetHerHim] lại!\" $master_of_hunt_court_position$ [huntmaster.GetFirstName] quát lớn, chỉ tay về phía [avian_abuser.GetName]. Đội cận vệ cá nhân của ta ngập ngừng tiến về phía trước, không chắc liệu có nên tuân theo các lệnh của [huntmaster.GetFirstNameNoTooltip] hay không. Ta giơ tay ngăn họ lại, và hỏi [huntmaster.GetFirstNameNoTooltip] điều gì đã khiến [huntmaster.GetHerHim] gây ra sự náo động như vậy.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], con #EMP quái vật#! này đã cố tình làm hại con chim ưng [avian_abuser.GetHerHis] của ngài trong cuộc săn vừa qua! [avian_abuser.GetSheHe|U] phải bị trừng phạt nghiêm khắc, danh dự #EMP đòi hỏi#! điều đó.\""
  court.7640.a:0 "Chỉ là một con chim thôi, thả [avian_abuser.GetHerHim] đi."
  court.7640.b:0 "Tống giam tên #EMP vô lại#! này!"
  court.7640.c:0 "Phạt tiền tên #EMP khốn kiếp#! này!"
  court.7640.d:0 "Đánh roi tên #EMP chó má#! này!"
## Spymaster has a reverse carrier pigeon
  court.7700.t:0 "Đôi Cánh Bí Mật"
  court.7700.desc:1 "Hôm nay, trên vai của [spymaster.Custom2('MyCharacterIntroduction', ROOT.Char)] đậu một con quạ trông khá kỳ lạ. Lợi dụng sự ồn ào của phòng ngai vàng để che chắn cuộc trò chuyện khỏi những tai mắt tò mò, [spymaster.GetFirstNameNoTooltip] kể cho ta nghe về những khả năng đáng kinh ngạc của con chim.\n\n"She is an accomplished thief, my liege. She steals not gold or jewels, but notes, keys, and letters — all the little things that bear uncomfortable truths that their owners wish to conceal.""
  court.7700.a:0 "Trộm cắp! Lính gác, bắt tên vô lại này!"
  court.7700.b:0 "Ngươi có thể tìm thêm thông tin về [scheme.GetTargetCharacter.GetTitledFirstNameNoTooltip] không?"
  court.7700.b.tt:0 "Sử dụng nó để hỗ trợ [scheme.GetName] đang diễn ra của bạn"
  court.7700.c:1 "Thật là một mưu mẹo thú vị..."
  court.7700.d:0 "Những trò xảo trá như vậy không hợp với ta."
