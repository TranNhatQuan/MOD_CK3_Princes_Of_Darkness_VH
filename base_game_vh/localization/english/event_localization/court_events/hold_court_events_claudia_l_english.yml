l_english:

 #Empty Granaries
 hold_court.6000.t:0 "Kho Lương Trống Rỗng"
 hold_court.6000.desc_intro:0 "Trước mặt ta là [6000_poor.Custom2('MyCharacterIntroduction', ROOT.Char)], đầu [6000_poor.GetHerHis] cúi thấp.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], [6000_province.GetNameNoTooltip] đã bị tàn phá nặng nề bởi"
 hold_court.6000.desc_occupation:0 "sự chiếm đóng của quân thù."
 hold_court.6000.desc_raiding:0 "những cuộc cướp bóc và tàn phá."
 hold_court.6000.desc_epidemics:1 "dịch bệnh."
 hold_court.6000.desc_winter:1 "mùa đông khắc nghiệt."
 hold_court.6000.desc_middle:0 "Người dân đang chết đói, ruộng đồng chưa hồi phục, và gia súc của chúng ta không còn đủ để sống sót!"
 hold_court.6000.desc_count:0 "[6000_count.Custom2('MyCharacterIntroduction', 6000_poor)|U] hoặc không có tiền, hoặc không có ý định giúp chúng ta."
 hold_court.6000.desc_ending:0 "Chúng thần cầu xin ngài can thiệp và cứu lấy những thần dân trung thành của ngài bằng lòng quảng đại của ngài!"\n\n[6000_poor.GetSheHe|U] cúi đầu thật sâu rồi im lặng."
 hold_court.6000.a:0 "Một ít vàng sẽ giúp giảm bớt khổ đau của các ngươi."
 hold_court.6000.b:0 "Ta sẽ miễn giảm thuế để các ngươi có thể phục hồi."
 hold_court.6000.c:0 "Ta biết đúng người cho việc này."
 hold_court.6000.c.tt:0 "Ngươi cử [inspector.GetTitledFirstName] làm thanh tra chính thức giám sát việc phục hồi của lãnh địa"
 hold_court.6000.d:0 "Ta tin các ngươi có thể tự xoay xở."
 #From Beyond the Border
 hold_court.6030.t:0 "Từ Bên Kia Biên Giới"
 hold_court.6030.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], ta đến từ cộng đồng tôn giáo tại [6030_church.GetName], thuộc vùng [6030_border.GetName].\n\n"Tại đó, những [6030_monk.GetWomenMen] thông thái và sùng đạo đã thu thập và gìn giữ tri thức truyền thống của văn hóa [6030_monk.GetCulture.GetName] suốt nhiều thế kỷ. Như một dấu hiệu thiện chí, ta xin dâng ngài tuyển tập quý giá những văn bản [6030_monk.GetCulture.GetNameNoTooltip] đã được dịch sang ngôn ngữ của ngài.\n\n"Chúng ta hy vọng ngài sẽ chấp nhận và có được một góc nhìn mới về dân tộc của chúng ta.""
 hold_court.6030.a:0 "Ta trân trọng chấp nhận."
 hold_court.6030.b:0 "Xin hãy ở lại và dạy ta thêm!"
 hold_court.6030.b.tt.2:0 "Tất cả các nhà cai trị thuộc văn hóa [6030_monk.GetCulture.GetName]"
 hold_court.6030.c:0 "Ta không quan tâm, biến khỏi tầm mắt ta."
 hold_court.6030.d:0 "Nền văn hóa thấp kém của các ngươi không đáng để ghi nhớ!"
 hold_court.6030.d.tt:0 "Tất cả chư hầu của ngươi thuộc văn hóa [6030_monk.GetCulture.GetName]"
 #A Lost Treasure
 hold_court.6040.t:0 "Một Bảo Vật Thất Lạc"
 hold_court.6040.desc:1 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], ta đại diện cho cộng đồng tôn giáo của [6040_church.GetName].\n\n"Khi lục tìm kho lưu trữ khiêm tốn của chúng ta, chúng ta đã phát hiện ra một cuốn sách kỳ lạ. Bìa phủ bụi, gáy sách mong manh, và các trang giấy đã ngả vàng theo thời gian, nhưng nó chứa những hình vẽ vô cùng khác thường, và chữ viết thì ngay cả chúng ta — những [6040_monk.GetFaith.PriestNeuterPlural] — cũng không nhận ra.\n\n"Chúng ta tin chắc rằng nó là độc nhất trên thế giới, một kho tàng tri thức thất lạc từ lâu, một bảo vật thực sự! Vì vậy chúng ta xin dâng nó cho ngài. Có lẽ đó là bản gốc di chúc của [6040_monk.GetFaith.HighGodName], hoặc là hồi ký từ buổi khai sinh của thế giới!""
 hold_court.6040.a:0 "Cảm ơn, ta sẽ thêm nó vào bộ sưu tập của mình."
 hold_court.6040.b:0 "#EMP Thật hấp dẫn!#! Gọi nhà cổ vật học của ta!"
 hold_court.6040.b.tt:0 "Nhà cổ vật học của ngươi hoàn toàn bối rối"
 hold_court_6040_b_fake:1 "Cuốn sách là đồ giả làm cẩu thả — vô giá trị và vô dụng"
 hold_court_6040_b_generic:0 "Cuốn sách quả thật cổ, nhưng chỉ là một [6040_monk.Custom('GetOldBook')]."
 hold_court_6040_b_clueless:0 "Ngay cả nhà cổ vật học của ngươi cũng không thể làm sáng tỏ nguồn gốc và mục đích của cuốn sách"
 hold_court_6040_b_artifact:0 "Cuốn sách là một bản sao cổ xưa và quý giá của một kiệt tác!"
 hold_court.6040.c:0 "Đưa ta xem ngay #EMP bây giờ#!!"
 hold_court.6040.c.tt:1 "Đó là đồ giả làm cẩu thả!"
 hold_court.6040.c.tt.2:0 "Cuốn sách vẫn là một bí ẩn đối với ngươi"
 hold_court.6040.c.tt.3:0 "Đó là bản thảo khá đẹp, nhưng không có gì đặc biệt"
 hold_court.6040.c.tt.4:0 "Đó là một văn bản hiếm và có giá trị"
 hold_court_6040_c_clueless:0 "Chữ viết và nội dung của cuốn sách vượt quá khả năng hiểu biết của ngươi"
 hold_court.6040.d:0 "Ắt hẳn đây là tác phẩm của [ROOT.Char.GetFaith.DevilName]! ĐỐT NÓ!"
 hold_court.6040.e:0 "Ai quan tâm đến sách chứ?"
 #A Holy Tomb
 hold_court.6050.t:0 "Một Ngôi Mộ Thánh"
 hold_court.6050.desc:1 "Người nông dân trước mặt ta dường như sắp nổ tung vì phấn khích.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Phép màu! Sự thiêng liêng! Chúng ta đã được #EMP BAN PHÚC#!!"\n\nNhững lời nói đầy nhiệt huyết của [6050_pop.GetHerHis|U] khá rối rắm, nhưng cuối cùng ta cũng hiểu: [6050_pop.GetSheHe] muốn ta bảo trợ cho việc tôn sùng một vị thánh địa phương vừa qua đời tại [6050_tomb.GetNameNoTooltip]. [6050_holy.GetFirstName] khi còn sống nổi tiếng với các phép màu như [6050_holy.Custom('GetMiracle1')] và [6050_holy.Custom('GetMiracle2')]. Ngôi mộ của [6050_holy.GetHerHis|U] đang thu hút những tín đồ sùng kính từ khắp lãnh địa."
 hold_court.6050.desc_hof:0 "\n\nVới tư cách [head_of_faith|E], ta có đặc quyền quyết định nên lên án hay cổ vũ sự tôn sùng này."
 hold_court.6050.a: "Thánh [6050_holy.GetHerHis|U] sẽ nhận được sự tôn kính mà [6050_holy.GetSheHe] xứng đáng có được."
 hold_court.6050.b:0 "Ta đã biết rồi. Vị thánh đã hiện ra với ta trong giấc mơ."
 hold_court.6050.c:0 "Ta sẽ tiêu diệt ngay sự báng bổ vô nghĩa này!"
 hold_court.6050.d:0 "Ta không quan tâm đến mê tín của nông dân."
 tougher_to_convert: "Cộng Đồng Tôn Giáo Vững Mạnh"
 tougher_to_convert_desc: "Bản sắc tôn giáo của lãnh địa này gần đây đã được củng cố, khiến họ khó bị cải đạo hơn.\n\n#N -25%#! Tốc Độ Cải Đạo"
 easier_to_convert: "Cộng Đồng Tôn Giáo Suy Yếu"
 easier_to_convert_desc: "Bản sắc tôn giáo của lãnh địa này gần đây đã suy yếu, khiến họ dễ tiếp nhận đức tin mới hơn.\n\n#P +25%#! Tốc Độ Cải Đạo"
 easier_to_culture_convert: "Cộng Đồng Tôn Giáo Suy Yếu"
 easier_to_culture_convert_desc: "Bản sắc tôn giáo của lãnh địa này gần đây đã suy yếu, khiến họ dễ tiếp nhận đức tin mới hơn.\n\n#P +25%#! Tốc Độ Chuyển Đổi Văn Hóa"
 #A Convenient offer
 hold_court.6060.t:0 "Một Lời Đề Nghị Thuận Tiện"
 hold_court.6060.desc:0 "[6060_rich.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đứng trước mặt ta, gương mặt đầy hy vọng.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U],"
 hold_court.6060.desc_merchant:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], cho phép ta tự giới thiệu: ta là [6060_rich.GetTitledFirstName], một thương nhân giàu có đến từ kinh thành.\n\n"
 hold_court.6060.desc_ending:1 ""Ta không khỏi nhận thấy rằng trong thời gian gần đây, tài chính của vương quốc dường như không được khả quan cho lắm. Dĩ nhiên ngài đã quản lý chúng rất tận tâm, nhưng — có lẽ — ngài sẽ thấy hữu ích nếu có thêm một ít vàng.\n\n"Ta sẵn sàng mua lại một khu định cư nhỏ của ngài để đổi lấy một khoản vàng hậu hĩnh. Ngài thấy thế nào?""
 hold_court.6060.a:0 "Được thôi. Ngươi có thể lấy [6060_offer.GetNameNoTooltip]."
 hold_court.6060.b:1 "Hãy nhận mảnh đất đó và xây dựng một thành phố trên đó."
 hold_court.6060.b.tt.success:0 "[6060_rich.GetFirstNameNoTooltip] đồng ý trả thêm vàng"
 hold_court.6060.b.tt.failure: "[6060_rich.GetFirstNameNoTooltip] giữ vững lời đề nghị cuối cùng [6060_rich.GetHerHis] của ngài và ngài trông giống như một kẻ tham lam ngu ngốc"
 hold_court.6060.c:0 "Ta không cần vàng của ngươi."
 character_title_cannot_be_revoked_tt: "Ngươi sẽ không thể tước bỏ tước vị này trong 25 năm."
 protected_from_revocation.tt: "Các tước vị của nhân vật này được bảo vệ khỏi việc bị tước bỏ"
 #Budding Ally
 hold_court.6070.t:0 "Đồng Minh Mới Nhen Nhóm"
 hold_court.6070.desc:1 "\" Thưa [ROOT.Char.GetLadyLord] của tôi, tên tôi là [6070_embassy.GetTitledFirstName] và tôi là đại sứ của đồng minh của ngài, [6070_sender.GetTitledFirstName]. Tôi mang đến cho ngài những lời chào thân thiện và một đề nghị [6070_sender.GetHerHis] của ngài.\n\n\"Lãnh chúa của tôi coi trọng tình bạn của ngài trên hết, vì vậy, như một dấu hiệu của thiện chí, [6070_sender.GetSheHe] gửi đến ngài đứa trẻ này — [6070_sender.GetHerHis] [6070_child.Custom('GetDaughterSon')] [6070_child.GetFirstName] — để giáo dục tùy ý ngài.\n\n\"[6070_sender.GetLadyLord] của tôi hy vọng rằng cử chỉ này sẽ củng cố liên minh của các ngài và tin tưởng rằng [6070_child.GetFirstNameNoTooltip] sẽ nằm trong những bàn tay tuyệt vời.\""
 hold_court.6070.a:0 "Ta vui lòng chấp nhận lời đề nghị của ngươi."
 hold_court.6070.b:0 "Dĩ nhiên! [6070_friend.GetFirstNameNoTooltip], đưa [6070_child.GetHerHim] đi tham quan đi!"
 hold_court.6070.c:1 "Ta chấp nhận — nhưng đổi lại ta muốn một hôn ước."
 hold_court.6070.d:0 "Ta xin lỗi nhưng hiện giờ ta không thể nhận trách nhiệm này."
 hold_court.6070.e:1 "Đứa trẻ đó nổi tiếng là tai họa — các ngươi đừng hòng đẩy [6070_child.GetHerHim] cho ta!"
 #Settling the [people]
 hold_court.6080.t:0 "Định Cư Người [6080_culture.GetNameNoTooltip|U]"
 hold_court.6080.desc:1 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], ta đại diện cho người dân [6080_culture.GetNameNoTooltip] tại [6080_county.GetNameNoTooltip]," [6080_count.Custom2('MyCharacterIntroduction', ROOT.Char)] nói.\n\n"Chúng ta là những thần dân trung thành, nhưng vùng đất của chúng ta nghèo nàn, kém phát triển và dân cư thưa thớt. Xin hãy cho phép chúng ta tái định cư nơi ấy và quản lý nó theo truyền thống của mình!\n\n"Dưới sự bảo hộ nhân từ của ngài, vùng đất đó vẫn có thể phồn thịnh, và ngài sẽ có thêm một chư hầu trung thành!""
 hold_court.6080.a:0 "Được thôi. Người của ngươi có thể đến định cư tại [6080_county.GetNameNoTooltip] cho ta."
 hold_court.6080.a.tt:0 "Ngươi sẽ không thể tước bỏ tước vị này cho đến khi [6080_count.GetFirstNamePossessiveNoTooltip] qua đời"
 hold_court.6080.b:0 "Ta biết điều gì là tốt nhất cho [6080_county.GetNameNoTooltip]."
 hold_court.6080.c:1 "Người của ngươi sẽ luôn có nơi an toàn tại [6080_province.GetNameNoTooltip]."
 #Heretics at Large
 hold_court.6090.t:0 "Dị Giáo Hoành Hành"
 hold_court.6090.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], ta rất tiếc phải báo rằng tình hình tôn giáo trong lãnh địa của ta đã vượt khỏi tầm kiểm soát...\n\n"Ta đã cố gắng khiến thần dân của mình nhìn thấy ánh sáng của đức tin chân chính, nhưng quá nhiều người vẫn cố chấp bám lấy niềm tin sai lầm! Ta cầu xin ngài dùng quyền lực của mình để giúp ta!""
 hold_court.6090.desc.almoner:0 "\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] — nếu ta được phép," [high_almoner.Custom2('MyCharacterIntroduction', ROOT.Char)] chen vào, "Có lẽ họ sẽ bị thuyết phục nếu chúng ta ban phát bố thí hào phóng cho những tín đồ #EMP chân chính#!?""
 hold_court.6090.desc.executioner:0 "\n\n"Ta cược rằng họ chỉ cần #EMP một bàn tay sắt#!!" [executioner.Custom2('MyCharacterIntroduction', ROOT.Char)] nói với nụ cười u ám."
 hold_court.6090.a:0 "[court_chaplain.GetFirstNameNoTooltip], xem ngươi có thể làm gì."
 hold_court.6090.b:0 "[high_almoner.GetFirstNameNoTooltip], hãy tổ chức phát chẩn tại địa phương."
 hold_court.6090.c:0 "Chung sống hòa bình luôn là giải pháp tốt nhất."
 title_granted_to_local_leader_tt: "[6090_main_county.GetName] sẽ được trao cho một người bản địa theo đức tin [6090_main_county.GetCountyData.GetFaith.GetName]. Ngươi sẽ có một [hook|E] với họ."
 hold_court.6090.d:0 "[executioner.GetFirstNameNoTooltip], hãy lấy vài kẻ ngoại đạo làm gương."
 hold_court.6090.e:0 "Đó là vấn đề của ngươi, không phải của ta."
 #A Land at War
 hold_court.6100.t:0 "Một Vùng Đất Trong Chiến Tranh"
 hold_court.6100.desc:0 "Trước mặt ta là [6100_vassal_1.Custom2('MyCharacterIntroduction', ROOT.Char)] và [6100_vassal_2.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]," [6100_vassal_1.GetFirstNameNoTooltip] bắt đầu, "cuộc chiến giữa ta và [6100_vassal_2.GetTitledFirstNameNoTooltip] kéo dài chỉ vì sự ngoan cố của [6100_vassal_2.GetHerHis], nên chúng ta đến cầu xin ngài phân xử."\n\n"Thế là #EMP lỗi của ta# sao!?" [6100_vassal_2.GetFirstNameNoTooltip] chen vào "Đồ khốn không biết xấu hổ! Thưa [ROOT.Char.GetLadyLord], xin hãy nói cho [6100_vassal_1.GetHerHim] biết!""
 hold_court.6100.desc.jester:0 "\n\n[jester.Custom2('MyCharacterIntroduction', ROOT.Char)|U] phấn khích: "Ôi, ta #EMP rất thích#! những cuộc cãi vã vặt vãnh! Chúng rất hợp với... NHỮNG VẦN THƠ HÀI HƯỚC!""
 hold_court.6100.a:0 "Ai cũng thấy rằng [6100_vassal_1.GetFirstNameNoTooltip] đúng."
 hold_court.6100.b:0 "Lập trường của [6100_vassal_2.GetFirstNamePossessiveNoTooltip] là chính đáng."
 hold_court.6100.c:0 "Hãy chấm dứt giao tranh ngay lập tức, nếu không..."
 hold_court.6100.d:0 "Ta đã chán ngấy trò vô nghĩa của các ngươi. Tống cả hai vào ngục!"
 hold_court.6100.e:0 "Hãy giải quyết chuyện này như những chiến binh danh dự."
 hold_court.6100.e.tt:0 "Hai kẻ tranh chấp sẽ giải quyết chiến tranh bằng một trận đấu tay đôi"
 hold_court.6100.f:0 "Ha, ý hay! Hai ngươi thử đấu khẩu bằng thơ đi!"
 hold_court.6100.f.1:0 "Ngươi là tên vô lại sinh nơi bụi rậm\nchắc phải sống trong hang\nTa ghét ngươi vô cùng\nngươi nên chui vào chuồng...?""
 hold_court.6100.f.1.t:0 "Ngươi cười phá lên trước những câu vần vè yếu ớt của [6100_vassal_1.GetShortUINamePossessive|U]"
 hold_court.6100.f.2:0 ""Đồ thô lỗ ngu dốt\nkhông dọa nổi cả bé gái\nTa sẽ khiến ngươi bỏ chạy\nngươi đâu có khôn ngoan...?""
 hold_court.6100.f.2.t:0 "Ngươi cười nghiêng ngả trước những câu thơ tệ hại của [6100_vassal_2.GetShortUINamePossessive|U]"
 hold_court.6100.g:0 "Các ngươi đang làm phiền ta với mấy chuyện cãi vã vặt vãnh. Lui đi."
 hold_court.6100.g.tt:0 "Cuộc chiến vẫn tiếp diễn"
 hold_court.6101.t:0 "[sc_victor.GetTitledFirstName|U] thắng trận đấu tay đôi"
 hold_court.6101.tt:0 "[sc_victor.GetTitledFirstName|U] được tuyên bố là người chiến thắng trong cuộc chiến"
 #A Ravished Land
 hold_court.6110.t:0 "Một Vùng Đất Bị Tàn Phá"
 hold_court.6110.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], ta chỉ là một nông dân thấp kém, nhưng ta cầu xin sự giúp đỡ của ngài! Vùng đất của dân ta đã bị tàn phá bởi cuộc chiến lâu dài và đẫm máu giữa hai chư hầu của ngài là [6110_vassal_1.GetTitledFirstName] và [6110_vassal_2.GetTitledFirstName]!\n\n"Ruộng đồng cháy rụi, gia súc bị giết, và nông dân thì chết! Xin ngài hãy chấm dứt cảnh đổ máu này!""
 hold_court.6110.desc.almoner:0 "\n\n"Cầu mong lòng từ bi của [almoner.GetFaith.HighGodName] và sự rộng lượng của những con dân của [almoner.GetFaith.HighGodNamePossessive] sẽ xoa dịu nỗi khổ của ngươi" [almoner.Custom2('MyCharacterIntroduction', ROOT.Char)] nhẹ nhàng nói."
 hold_court.6110.a:1 "Chiến tranh đã kết thúc, [6110_vassal_1.GetTitledFirstNameNoTooltip] là người chiến thắng."
 hold_court.6110.b:1 "Cả hai bên phải bị ngăn lại ngay lập tức!"
 hold_court.6110.c:1 "Cuộc chiến này thật vô nghĩa, [6110_vassal_2.GetTitledFirstNameNoTooltip] là người chiến thắng."
 hold_court.6110.e:0 "Một nông dân không nên xen vào chuyện của giới quý tộc."
 6110_custom_every_realm_1:0 "Tất cả các lãnh địa trong vương quốc của [6110_vassal_1.GetShortUINamePossessive]"
 6110_custom_every_realm_2:0 "Tất cả các lãnh địa trong vương quốc của [6110_vassal_2.GetShortUINamePossessive]"
 #The Day of Truth
 hold_court.6120.t:0 "Ngày Của Sự Thật"
 hold_court.6120.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] lên tiếng. "Ta có một ý tưởng để cải thiện việc thu thuế."\n\n"Ngài có thể cử người khảo sát để hỏi thần dân về mọi tài sản: tên, chủ sở hữu, diện tích và giá trị của nó, cùng số người và gia súc sinh sống ở đó!""
 hold_court.6120.desc.seneschal:0 "\n\n"Xin hãy cho phép ta giám sát việc này, [ROOT.Char.Custom('FormOfAddressForLiege')]." [seneschal.Custom2('YourCharacterIntroduction', ROOT.Char)|U] lên tiếng."
 hold_court.6120.desc.swans:0 "\n\n"Và ta cũng sẽ lập danh sách toàn bộ thiên nga trong lãnh địa của ngài! Con ta thích nhất là [keeper_swans.Custom('GetSwanName')]! Ngài có biết bụng nó mềm và mịn thế nào không? Hôm qua chúng ta còn đi dạo và..." Ta quyết định bỏ ngoài tai [keeper_swans.Custom2('MyCharacterIntroduction', ROOT.Char)] khi [keeper_swans.GetSheHe] tiếp tục lảm nhảm về con chim chết tiệt đó."
 hold_court.6120.desc.jester:0 "\n\n"Nhưng con số thì #EMP chán ngắt!#!" [jester.Custom2('MyCharacterIntroduction', ROOT.Char)] phàn nàn "Hay chúng ta nhảy múa đi!""
 hold_court.6120.a:0 "Được thôi, hãy tiến hành khảo sát."
 hold_court.6120.a.tt:0 "Cuộc khảo sát bắt đầu. Sẽ mất vài tháng để hoàn thành"
 hold_court.6120.b:0 "[seneschal.GetFirstNameNoTooltip], ngươi hãy lo việc này."
 hold_court.6120.c:0 "Nếu ta muốn tăng thuế, ta chỉ cần yêu cầu #EMP nhiều#! thuế hơn..."
 6120_every_vassal:0 "Mỗi chư hầu của ngươi"
 hold_court.6120.d:0 "Việc này không đáng."
 hold_court.6120.e:0 "Đúng vậy, hãy nhảy múa để xua đi những con số đáng ghét!"
 swan_name_illfated:0 "Bất Hạnh"
 swan_name_rose:0 "Hoa Hồng"
 swan_name_honky:0 "Honky Honk"
 swan_name_honker:0 "Honker"
 swan_name_hugo:0 "Hugo"
 swan_name_leda:0 "Leda"
 swan_name_anklebiter:0 "Cắn Cổ Chân"
 swan_name_angrynipper:0 "Kẻ Cắn Giận Dữ"
 swan_name_odette:0 "Odette"
 hold_court.6121.t:0 "Ngày Của Sự Thật: Khảo Sát Hoàn Thành"
 hold_court.6121.desc:1 ""Mọi việc đã xong, [ROOT.Char.Custom('FormOfAddressForLiege')]" [6121_responsible.Custom2('MyCharacterIntroduction', ROOT.Char)] nói khi [6121_responsible.GetSheHe] cúi đầu trước ta.\n\n"Vài tháng trước, ngài đã ra lệnh khảo sát toàn bộ lãnh địa; giờ đây việc đó đã hoàn tất, và mọi thông tin về quyền sở hữu và giá trị đất đai đều được ghi chép trong cuốn sách này. Chừng nào bản mô tả này còn đúng với thực tế, việc thu thuế trong toàn vương quốc của ngài sẽ hiệu quả hơn!""
 hold_court.6121.a:0 "Làm rất tốt, [6121_responsible.GetFirstNameNoTooltip]!"
 #The Cadastre
 hold_court.6130.t:0 "Sổ Địa Chính"
 hold_court.6130.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]," [6130_proposer.Custom2('MyCharacterIntroduction', ROOT.Char)] lên tiếng "ta đề nghị tiến hành một cuộc khảo sát địa chính cho tất cả các lãnh địa của ngài.\n\n"Việc hiểu rõ và lập bản đồ đất đai chắc chắn sẽ làm tăng sự phồn thịnh của chúng!""
 hold_court.6130.a:0 "Được thôi, [6130_proposer.GetFirstNameNoTooltip]. Hãy tiến hành."
 hold_court.6130.a.tt:1 "[6130_proposer.GetFirstNameNoTooltip] bắt đầu thực hiện khảo sát địa chính. Sẽ mất vài tháng để hoàn thành, và khi hoàn tất sẽ mang lại những lợi ích sau:"
 hold_court.6130.d:0 "Bản đồ bị thổi phồng quá mức."
 hold_court.6131.t:0 "Sổ Địa Chính: Hoàn Thành!"
 hold_court.6131.desc:0 "[6131_proposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] cúi đầu trước ta rồi mỉm cười hài lòng: "[ROOT.Char.Custom('FormOfAddressForLiege')|U], hẳn ngài còn nhớ rằng vài tháng trước ngài đã chi một khoản vàng lớn để lập sổ địa chính cho các lãnh địa của mình.\n\n"Ta đã đích thân giám sát việc này và giờ có thể tự hào nói rằng công việc đã hoàn tất!""
 hold_court.6131.desc_tutor:0 "Ta cũng vui mừng khi nghe báo cáo chi tiết về những gì [6130_tutored.GetTitledFirstNamePossessive] đã học được dưới sự chỉ dẫn của [6130_helper.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 hold_court.6131.desc_hunt:0 "\n\nTa cũng vui mừng khi nghe báo cáo chi tiết về sự trợ giúp to lớn từ [6130_helper.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 hold_court.6131.desc_dead:0 "\n\nĐáng tiếc, [6130_helper.GetTitledFirstName] đã không sống đủ lâu để chứng kiến việc hoàn thành sổ địa chính mà [6130_helper.GetSheHe] từng thề sẽ giúp thực hiện."
 hold_court.6131.a:0 "Số vàng được chi thật xứng đáng!"
 all_realm_county: "Mọi [county|E] trong [realm|E]"
 #A Cumbersome Gift
 hold_court.6140.t:0 "Một Món Quà Phiền Phức"
 hold_court.6140.desc:2 "Cả phòng ngai vàng im bặt khi [6140_gifter.Custom2('MyCharacterIntroduction', ROOT.Char)] bước vào đầy đắc thắng, theo sau là hai người hầu đang chật vật kéo theo #EMP một con [ROOT.Char.Custom('GetAnimalType')] bị xích#!.\n\nMỉm cười đầy tự hào, [6140_gifter.GetFirstNameNoTooltip] nói: "[ROOT.Char.Custom('FormOfAddressForLiege')|U], ta xin dâng ngài một món quà xứng đáng với vị quân vương hùng mạnh nhất thế gian! Con thú hùng vĩ này được săn tại vùng [6140_province.GetTerrain.GetNameNoTooltip] của [6140_province.GetCounty.GetName], và nay ta dâng nó lên ngài như biểu tượng cho lòng trung thành của ta và quyền lực vô song của ngài!""
 6140_bear:0 "gấu"
 6140_tiger:0 "hổ"
 6140_lion:0 "sư tử"
 hold_court.6140.a:0 "Cảm ơn, ta đang cần một tấm thảm mới."
 hold_court.6140.a.tt:0 "Con vật bị giết để lấy da."
 hold_court.6140.artifact_tt:0 "Ngươi nhận được một [court_artifact|E] Da Thú"
 hold_court.6140.artifact_toast:0 "Nhận được Da Thú"
 hold_court.6140.b:0 "Đúng vậy: một con thú hùng mạnh cho một vị quân vương hùng mạnh!"
 hold_court.6140.c:0 "Tên hề của ta sẽ học cách cưỡi nó! Phải không, [jester.GetFirstNameNoTooltip]?"
 hold_court.6140.c.success:0 "Có thể làm được!"
 hold_court.6140.c.success.tt:2 "[jester.GetFirstNameNoTooltip] học cách cưỡi con [ROOT.Char.Custom('GetAnimalType')]"
 hold_court.6140.c.soft_failure: "[jester.GetFirstNameNoTooltip] ngã đập mông [jester.GetHerHis] của hắn"
 hold_court.6140.c.soft_failure.tt:0 "Mọi người cười nhạo thất bại của [jester.GetFirstNamePossessiveNoTooltip]"
 hold_court.6140.c.middle_failure:0 "[jester.GetFirstNameNoTooltip] bị thương"
 hold_court.6140.c.middle_failure.tt:0 "[jester.GetFirstNameNoTooltip] thất bại"
 hold_court.6140.c.hard_failure:0 "[jester.GetFirstNameNoTooltip] chết!"
 hold_court.6140.c.hard_failure.tt:0 "[jester.GetFirstNameNoTooltip] thất bại thảm hại..."
 hold_court.6140.d:0 "Ta chắc rằng #EMP tù nhân#! của ta trong ngục sẽ #EMP rất thích#! nó..."
 hold_court.6140.e:0 "Trông vừa nguy hiểm vừa hôi hám! Mang nó đi."
 6140_every_courtier_or_guest:0 "Mọi cận thần hoặc khách trong triều của ngươi"
 6140_every_prisoner:0 "Mọi tù nhân trong ngục của ngươi"
 #The End Is Nigh!
 hold_court.6150.t:0 "Ngày Tận Thế Đã Cận Kề!"
 hold_court.6150.desc:0 "Ngay khi đến lượt phát biểu của [6150_preacher.GetHerHis], người [6150_preacher.GetWomanMan] đầy kích động đứng trước mặt ta gào lên: "#EMP NGÀY TẬN THẾ ĐÃ CẬN KỀ!#!\n\n"Các dấu hiệu đã quá rõ ràng và ở khắp mọi nơi:"
 hold_court.6150.desc_county:0 "người dân [6150_county.GetName] hiểu điều đó quá rõ —"
 hold_court.6150.desc_unsafety:0 "loạn lạc, cướp bóc, trộm cắp, bạo lực, và công lý giữa loài người đang biến mất!"
 hold_court.6150.desc_nature:0 "mùa màng thất bát, châu chấu tràn ngập ruộng đồng, giá lạnh kéo dài vô tận, lũ lụt, và Dịch Bệnh đang hoành hành giữa chúng ta!"
 hold_court.6150.desc_looting:0 "trước hết là bọn man di ngoài cổng thành, cướp bóc mùa màng, giết hại dân chúng, thiêu rụi thành trì, gieo rắc bệnh tật và đói khát!"
 hold_court.6150.desc_infidels:0 "những kẻ ngoại đạo ở khắp nơi, phá hoại chúng ta từ ngoài biên giới lẫn ngay trong lãnh thổ!"
 hold_court.6150.desc_lost_hgw:0 "còn gì rõ ràng hơn khi đạo quân của [ROOT.GetCharacter.GetFaith.HighGodName] bị ngoại đạo đánh bại?"
 hold_court.6150.desc_visions:0 "sấm sét giữa trời quang, chim di cư trái mùa, những tiếng tụng niệm trong đêm, những con rắn biết nói!"
 hold_court.6150.desc_monk:0 "mọi ngày tháng và phép tính đều đã khớp!"
 hold_court.6150.desc_fallback:0 "bạo lực, tham nhũng, sa đọa — tín đồ đã quên mất [ROOT.GetCharacter.GetFaith.HighGodName]!"
 hold_court.6150.desc_christianism:0 "\n\n"Ngày Phán Xét đã giáng xuống!"
 hold_court.6150.desc_buddhism:0 "\n\n"Thời đại của Di Lặc đã tới!"
 hold_court.6150.desc_islam:0 "\n\n"Ngày Phán Xét Cuối Cùng đang đến!"
 hold_court.6150.desc_judaism:0 "\n\n"Cuộc chiến của Gog và Magog đã tới!"
 hold_court.6150.desc_germanic:0 "\n\n"Ragnarök đã đến!"
 hold_court.6150.desc_hinduism:0 "\n\n"Kalki đang giáng thế!"
 hold_court.6150.desc_zoroastrianism:0 "\n\n"Frashokereti đã bắt đầu!"
 hold_court.6150.desc_religion_fallback:0 "\n\n"Thế giới như chúng ta biết sắp đi đến hồi kết!"
 hold_court.6150.desc_solution:0 "\n\n"Chỉ có một con đường để chúng ta được cứu rỗi:"
 hold_court.6150.desc_celibacy:0 "sống thanh khiết và trinh bạch! Hãy từ bỏ cám dỗ của xác thịt!"
 hold_court.6150.desc_burn:0 "thiêu sống #EMP tất cả#! bọn ngoại đạo!"
 hold_court.6150.desc_alcohol:0 "từ bỏ mọi thói sa đọa, bắt đầu từ rượu chè và ăn uống quá độ!"
 hold_court.6150.desc_reclusive:0 "từ bỏ thế gian và những cám dỗ của nó!"
 hold_court.6150.desc_flagellant:0 "hành xác thân mình, đổ máu để chuộc lấy sự cứu rỗi!"
 hold_court.6150.desc_eating:0 "thanh tẩy tâm hồn bằng cách thanh tẩy thân thể! Không thể đạt cứu rỗi với cái bụng no căng!"
 hold_court.6150.desc_end:0 "\n\n"Hãy sám hối ngay bây giờ!! Vì ngày đó đã cận kề!!""
 hold_court.6150.a:0 "Sự cứu rỗi phải đạt được bằng mọi giá!"
 hold_court.6150.a.tt:0 "Ngươi đã quen thuộc với những nghi thức sám hối này."
 hold_court.6150.a.wrath:1 "Ngươi ra lệnh thanh tẩy [6150_heretics_p.GetName] khỏi mọi kẻ tội lỗi"
 hold_court.6150.b:0 "Hiền giả [6150_preacher.GetFirstNameNoTooltip], hãy ở lại và chỉ cho ta con đường!"
 hold_court.6150.c:0 "Nhảm nhí! Thiêu sống tên dị giáo điên loạn này!"
 hold_court.6150.d:0 "Lôi tên ngu xuẩn này ra khỏi tầm mắt ta."
 #Empty Coffers
 hold_court.6160.t:0 "Kho Bạc Cạn Kiệt"
 hold_court.6160.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [6160_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] mở lời, vẻ mặt đầy áy náy "thời gian vừa qua lãnh địa của thần gặp vô vàn khó khăn, chi phí phát sinh khắp nơi, và kho bạc của thần nay đã trống rỗng...\n\n"Thần rất đau lòng khi phải làm vậy, nhưng đành cầu xin sự hào phóng của ngài để giúp thần trả những món nợ này."
 hold_court.6160.desc_friend:0 "\n\n"Vì tình nghĩa giữa chúng ta, xin hãy giúp thần!"
 hold_court.6160.desc_hook:0 "\n\n"Nếu ngài giúp, thần sẽ coi như món ân Tình bạn nợ thần đã được xóa bỏ."
 hold_court.6160.desc_fallback:0 "\n\n"Thần sẽ không bao giờ quên sự rộng lượng của ngài trong lúc khó khăn này!""
 hold_court.6160.a:0 "Được thôi — nhưng ngươi sẽ mắc nợ ta!"
 hold_court.6160.b:0 "Được thôi — giờ ta không còn nợ ngươi gì nữa."
 hold_court.6160.c:0 "Đó là điều ít nhất ta có thể làm cho ngươi!"
 hold_court.6160.d:0 "Như Đại Từ Thiện của ta dạy, bố thí là con đường của kẻ sùng đạo."
 hold_court.6160.e:0 "Nợ nần nghĩa là quản lý kém. [seneschal.GetFirstNameNoTooltip], hãy giúp [6160_vassal.GetHerHim]!"
 hold_court.6160.f:0 "Xin lỗi, ta không dư tiền."
 #Ignoble Imprisonment
 hold_court.6170.t:0 "Sự Giam Cầm Nhục Nhã"
 hold_court.6170.desc:0 "[6170_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đứng trước mặt ta, một biểu cảm lo lắng trên khuôn mặt [6170_vassal.GetHerHis] của ngài. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], tôi đến thay mặt [6170_relative.Custom2('MyCharacterIntroduction', 6170_vassal)].\n\n\"[6170_relative.GetSheHe|U] đã bị bỏ tù một cách hèn hạ bởi [6170_rival.Custom2('YourCharacterIntroduction', 6170_vassal)] vì những lý do tầm thường và vô lý. Trái tim tôi rỉ máu vì những điều kiện khốn khổ mà [6170_vassal.Custom2('RelationToMe', SCOPE.sC('6170_relative'))] tội nghiệp của tôi phải chịu đựng...\n\n\"Xin hãy ban lòng thương xót cho [6170_relative.GetHerHim] và ra lệnh trả tự do cho [6170_relative.GetHerHim]!\""
 hold_court.6170.a:0 "Hãy trả tự do cho [6170_relative.GetFirstNameNoTooltip]!"
 hold_court.6170.b:0 "[6170_rival.GetFirstNameNoTooltip] hẳn phải có lý do chính đáng khi giam giữ [6170_relative.GetHerHim]."
 hold_court.6170.c:0 "Ta chỉ có thể ban cho [6170_relative.GetHerHim] chút khoan dung nhỏ."
 hold_court.6170.d:0 "Chém đầu là xong chuyện!"
 hold_court.6170.e:0 "Ta chẳng quan tâm đến mấy cuộc cãi vã của các ngươi."
 #A Shadow in the Night
 hold_court.6190.t:0 "Bóng Đen Trong Đêm"
 hold_court.6190.desc:1 "[6190_local.GetWomanMan] tiếp cận ngai vàng của ta rõ ràng là một thường dân. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [6190_local.GetSheHe] bắt đầu bài phát biểu [6190_local.GetHerHis] của mình, \"tôi đại diện cho cộng đồng địa phương [capital.GetNameNoTooltip].\"\n\n\"Trong vài tháng qua, các nghĩa trang của chúng tôi đã bị ám ảnh bởi sự biến mất của các thi thể! Tất cả đều bị đào lên và không để lại dấu vết. Ban đầu, chúng tôi sợ các loài động vật hoang dã, hoặc những thế lực mơ hồ đang làm việc, nhưng sau đó, chính $court_physician_court_position$ [physician.GetTitledFirstName] của ngài đã bị bắt quả tang đang vận chuyển những người chết đi để làm thí nghiệm [physician.GetHerHis] của ngài!\n\n\"Xin hãy ngăn chặn sự báng bổ này!\""
 hold_court.6190.a:0 "Nghiên cứu cơ thể con người là điều cần thiết, dù đáng buồn."
 hold_court.6190.b:0 "Sao ngươi không mời ta, [physician.GetFirstNameNoTooltip]?!"
 hold_court.6190.c:0 "Thi thể tươi — #EMP còn sống#! — sẽ là đối tượng thí nghiệm tốt hơn..."
 hold_court.6190.d:0 "#EMP LÍNH ĐÂU!#! Bắt tên trộm mộ!"
 hold_court.6190.e:0 "[physician.GetFirstNameNoTooltip], dừng ngay chuyện này."
 #A Land of Foreigners
 hold_court.6210.t:1 "Vùng Đất Của Kẻ Ngoại Bang"
 hold_court.6210.desc:1 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], thần e rằng mình đã hết chịu nổi rồi!" [6210_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] nói với vẻ bực bội.\n\n"Những người dân mà thần phải cai trị thật khó hiểu, với phong tục kỳ quặc và khẩu vị #EMP kinh khủng#!! Mọi nỗ lực của thần đến giờ đều vô ích — dường như không thể biến họ thành những nông nô tốt được.\n\n"Thần e rằng chỉ có sự can thiệp mạnh mẽ từ bề trên mới có thể giải quyết.""
 hold_court.6210.a:1 "[steward.GetFirstNameNoTooltip], hãy chỉ cho họ cách của chúng ta."
 hold_court.6210.b:0 "Hãy cho họ thấy sự vĩ đại của chúng ta, rồi họ sẽ đổi ý!"
 hold_court.6210.b.tt:0 "Ngươi phái $royal_architect_court_position$ của mình đi phát triển hạ tầng các quận."
 hold_court.6210.c:0 "Chúng ta tôn trọng truyền thống của mọi thần dân."
 hold_court.6210.d:0 "Miễn là họ nộp thuế, ta không quan tâm."
 #A Massive Problem
 hold_court.6230.t:0 "Một Vấn Đề #EMP Khổng Lồ#!"
 hold_court.6230.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], xin ngài dành chút chú ý cho tôi, nếu có thể...\" [6230_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] lên tiếng. \"[6230_province.GetName] đã phải chịu đựng một vấn đề #EMP phiền toái#! trong những tuần qua...\n\n\"Ngài thấy đấy, một đàn voi #EMP hoàn toàn mất kiểm soát#! đã nổi điên khắp hạt này, để lại một dấu vết của sự tàn phá và, đôi khi, cái chết! Tiếng kêu đáng sợ của chúng vang vọng trong tai chúng tôi ngày đêm — ngay cả bây giờ tôi vẫn còn nghe thấy nó!\" [6230_vassal.GetSheHe] tiếp tục thực hiện những âm thanh #EMP kêu giống voi#! không phù hợp. \"Xin hãy giúp đỡ, thưa [ROOT.Char.Custom('FormOfAddressForLiege')]!\""
 hold_court.6230.a:0 "Lấy ít vàng và xây dựng lại."
 hold_court.6230.b:0 "Ta sẽ phái người đến chặn lũ thú đó."
 hold_court.6230.b.success:0 "Thợ săn của ngươi bắt được đàn voi hoang"
 hold_court.6230.b.success.tt:0 "Thuần Hóa Voi"
 hold_court.6230.b.failure:0 "Đàn voi tiếp tục tàn phá"
 hold_court.6230.b.failure.tt:0 "Voi Hoành Hành"
 hold_court.6230.c:0 "Voi với ngựa cũng như nhau... [m_horse.GetFirstNameNoTooltip], xử lý đi!"
 hold_court.6230.c.success:0 "$master_of_horse_court_position$ của ngươi bắt được đàn voi"
 hold_court.6230.d:0 "$hinduism_good_god_ganesh$ sẽ dẫn đường cho chúng."
 hold_court.6230.e:0 "Ta không có thời gian cho chuyện nhảm nhí này."
 hold_court.6230.f:0 "Giết hết lũ thú ghê tởm đó."
