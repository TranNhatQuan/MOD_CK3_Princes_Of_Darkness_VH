l_english:

 #The Peak of Elegance
 court_events.3000.t: "Đỉnh Cao Thanh Nhã"
 court_events.3000.desc: "[chancellor.Custom2('MyCharacterIntroduction',ROOT.Char)|U] và [steward.Custom2('MyCharacterIntroduction',ROOT.Char)] hôm nay dường như tâm trạng rất tốt.\n\n\"Lại đây, thưa ngài!\" [chancellor.GetFirstNameNoTooltip] reo lên. \"Chúng ta vừa bàn tới một chuyện chắc hẳn ngài sẽ quan tâm. Những khoản đầu tư của ngài nhằm quảng bá và duy trì thời trang [ROOT.Char.GetCulture.GetNameNoTooltip] như đỉnh cao của sự thanh nhã đang bắt đầu sinh hoa kết quả!\"\n\n\"Các quân chủ ngoại bang đều ngưỡng mộ và ghen tị với ngài, nhưng [steward.GetFirstNameNoTooltip] và ta vẫn chưa thể thống nhất cách tốt nhất để tận dụng danh tiếng ấy.\""
 court_events.3000.a: "Ai cũng phải biết ta là đỉnh cao của thời trang."
 court_events.3000.b: "Thời trang [ROOT.Char.GetCulture.GetNameNoTooltip] nên là tấm gương cho tất cả."
 court_events.3000.c: "Ai cũng nên mua mũ của chúng ta!"
 #The Same Old Soup
 court_events.3010.t: "Nồi Súp Cũ Kỹ"
 court_events.3010.desc: "\"Xin ngài nghe lời thần, [ROOT.Char.Custom2('RelationToMeAddress', SCOPE.sC('courtier'))],\" [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] tiến đến với ánh mắt khẩn cầu.\n\n\"Ngài phải làm gì đó với đồ ăn trong triều đình! Chúng ta ăn uống như nông dân, sứ giả ngoại quốc nhăn mặt trước bàn tiệc của ta, còn các quân chủ và nghệ sĩ lân bang thì lấy những món ăn truyền thống của chúng ta làm ví dụ cho khẩu vị tồi tệ và tập tục man rợ!\""
 court_events.3010.a: "Được rồi, ta sẽ thuê vài đầu bếp ngoại quốc."
 court_events.3010.b: "Nhưng nó vừa lành mạnh vừa mộ đạo!"
 court_events.3010.c: "Đó là vì an toàn của ta."
 cheaper_food_for_15_years: "$court_food_quality_decent$ rẻ hơn #P 20%#! trong 15 năm"
 court_events.3010.c.tt: "Khi súp của ngươi ngày nào cũng giống hệt nhau về mùi vị lẫn hình thức, sẽ khó hơn nhiều để lén bỏ độc mà không ai nhận ra!"
 # What's in a Bed?
 court_events.3020.t: "Một Cái Giường Có Gì?"
 court_events.3020.desc: "[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] hôm nay trông đặc biệt khốn khổ.\n\n\"Chúng ta sống như súc vật trong triều đình này! Không, còn tệ hơn — như #EMP nông dân!#! Phòng ốc chật chội, cả gia đình chen chúc trên cùng một chiếc giường, bô tiểu vứt khắp nơi; chúng ta lăn lộn trong chính sự bẩn thỉu và mùi hôi của mình...\""
 court_events.3020.desc_physician: "\n\n[physician.Custom2('MyCharacterIntroduction', ROOT.Char)|U] chen vào: \"Khí độc còn góp phần gây ra dịch bệnh nữa!\""
 court_events.3020.desc_architect: "\n\n\"Ắt phải có cách nào đó\" [architect.Custom2('MyCharacterIntroduction', ROOT.Char)] góp lời."
 court_events.3020.a: "Chúng ta xứng đáng với điều tốt hơn."
 court_events.3020.b: "Việc này cần chuyên gia: [expert.GetFirstNameNoTooltip]!"
 court_events.3020.c: "[architect.GetFirstNameNoTooltip] và [physician.GetFirstNameNoTooltip], giải quyết việc này!"
 court_events.3020.d: "Ta chắc cũng không tệ đến vậy."
 cheaper_lodgings_for_15_years: "$court_lodging_standards_middling$ rẻ hơn #P 15%#! trong 15 năm"
 cheaper_lodgings_for_15_years_1: "$court_lodging_standards_middling$ rẻ hơn #P 25%#! trong 15 năm"
 #It Came to Me in a Dream
 court_events.3030.t: "Ý Tưởng Đến Trong Giấc Mơ"
 court_events.3030.desc: "\"Hào hiệp thay [ROOT.Char.GetTitleAsNameNoTooltip]! Xin cho phép thần bày tỏ lòng biết ơn sâu sắc và mang đến tin mừng!\" [inspiration_owner.GetTitledFirstName] reo lên khi vội vã chạy tới.\n\n\"Thần thực sự rất thích nơi ở mà ngài đã ban cho. Nó rộng rãi đến mức thần có thể đi lại suy nghĩ, làm việc thong thả mà không bị quấy rầy; khung cảnh khu vườn thì đẹp đến nghẹt thở; còn chiếc giường — ôi chiếc giường ấy! — êm ái đến mức thần cảm thấy như đang ngủ trên mây! Thực vậy, một cảm hứng thiêng liêng để khiến [inspiration_owner.Custom('GetInspirationTypeObject')] của ngài còn tuyệt vời hơn vừa đến với thần trong lúc ngủ. Thần phải quay lại làm việc ngay!\""
 court_events.3030.a: "Thế còn một chiếc giường còn tốt hơn nữa thì sao?"
 court_events.3030.b: "Ta rất vui khi nghe điều đó!"
 #Empty Court
 court_events.3040.t: "Triều Đình Trống Vắng"
 court_events.3040.desc: "Khi cơn thèm ăn bất chợt ập đến mà ta không tìm thấy lấy một người hầu nào để sai vặt, ta nhận ra chuyện này dường như xảy ra quá thường xuyên. Trong triều đình của ta chẳng bao giờ có đủ người hầu để làm việc!\n\nDòng suy nghĩ của ta bị cắt ngang khi [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] xuất hiện. \"Thưa [ROOT.Char.GetTitleAsNameNoTooltip], ngài nghĩ gì về cuộc chiến đang tàn phá nước láng giềng của chúng ta, [war_realm.GetName]? Vô số người tị nạn từ [occupied_prov.GetName] đang lũ lượt tràn qua biên giới của ta!\"\n\nLiệu đây có phải là giải pháp ta đang tìm kiếm?"
 court_events.3040.a: "Cổng thành của chúng ta sẽ mở ra cho họ!"
 court_events.3040.b: "Được thôi, họ có thể làm việc cho chúng ta."
 court_events.3040.c: "Chúng ta không cần họ."
 cheaper_servants_for_15_years: "$court_servants_some$ rẻ hơn #P 20%#! trong 15 năm"
 #At the Table of the X
 court_events.3050.t: "Bên Bàn Tiệc Của [ROOT.Char.GetTitleAsNameNoTooltip]"
 court_events.3050.desc: "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" — [chancellor.Custom2('MyCharacterIntroduction', ROOT.Char)] bắt đầu — \"thần nhận thấy những bữa ăn xa hoa trên bàn tiệc của ngài đã trở nên vô cùng nổi tiếng!\"\n\n\"Những món ngon kỳ lạ, những hương vị mê hoặc... Các chư hầu của ngài #EMP khát khao#! được mời tham dự yến tiệc!\"\n\nĐiều này khiến ta nảy ra một ý..."
 court_events.3050.a: "Hãy để họ khao khát bàn tiệc của [ROOT.Char.GetTitleAsNameNoTooltip]!"
 court_events.3050.b: "Hãy mời họ đến bàn tiệc của [ROOT.Char.GetTitleAsNameNoTooltip]!"
 court_events.3050.a.tt: "Ngươi nhận #P $food_improves_opinion$#!: Tăng hiệu quả của [domestic_affairs|E] trong #P 15#! năm"
 court_events.3050.b.tt: "Ngươi nhận #P $food_improves_feasts$#!: #P +15#! khả năng chấp nhận khách mời và #P -15%#! chi phí vàng cho hoạt động Yến Tiệc trong #P 15#! năm"
 food_improves_feasts: "Ẩm Thực Lừng Danh"
 food_improves_opinion: "$food_improves_feasts$"
 food_improves_feasts_desc: "$food_improves_feasts$: $VALUE|=+0$"
 chancellor_domestic_affairs_opinion_food_bonus_desc: "\n$TAB$$food_improves_opinion$: #P +[SCOPE.ScriptValue('chancellor_domestic_affairs_opinion_food_bonus')|2]#!"
 chancellor_domestic_affairs_tyranny_food_bonus_desc: "\n$TAB$$food_improves_opinion$: #P +[SCOPE.ScriptValue('chancellor_domestic_affairs_tyranny_food_bonus')|P0]%#!"
 # A Faceless Sea
 court_events.3060.t: "Biển Người Vô Danh"
 court_events.3060.desc: "Dù ta quay về hướng nào, ta cũng thấy người mặc màu sắc của ta: chạy vội vã, buôn chuyện, đánh bóng áo giáp cũ, mang thức ăn, chuyển thư...\n\nHiện giờ có bao nhiêu người nhỉ? Họ đến rồi đi như thủy triều, và ta không thể nhớ nổi những gương mặt quen! Ta có thể tin ai?\n\nKhi ta còn đang suy nghĩ, [spymaster.Custom2('MyCharacterIntroduction', ROOT.Char)] tiến lại gần. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], thần thấy ngài đang quan sát bọn người hầu. Đông thật! Trong biển người vô danh thế này, chẳng ai nhớ nổi ai là ai. Thật dễ dàng để cài gián điệp vào bất cứ đâu... Dĩ nhiên, kẻ thù của ngài cũng có thể lợi dụng điều đó, nhưng hãy nghĩ tới mọi khả năng...\""
 court_events.3060.a: "Quá nhiều khả năng..."
 court_events.3060.a.tt: "... để một con dao đâm sau lưng ta nữa!"
 court_events.3060.b: "Hãy bắt họ làm việc thay vì vậy!"
 # Rags and not Riches?
 court_events.3070.t: "Giẻ Rách Chứ Không Phải Xa Hoa?"
 court_events.3070.desc: "Trong những chuyến đi [guest.GetHerHis] của mình, [guest.GetTitledFirstName] đã ghé thăm triều đình của ta. Cho đến nay, [guest.GetSheHe] không hề bị ấn tượng.\n\n\"Ồ, ta hiểu rồi, đây là thứ mà ngài coi là \"thời trang\" ở nơi này... Tha lỗi cho ta, [ROOT.Char.Custom('FormOfAddressForLiege')], nhưng ta hầu như không thể phân biệt ngài với đám tôi tớ của mình, vì trang phục của ngài thật khiêm tốn! Có lẽ ta có thể chia sẻ một vài lời khuyên, nếu ngài cho phép?\""
 court_events.3070.a: "Để xem ngươi có gì."
 court_events.3070.b: "Ta đã chọn sự khiêm nhường. Ngươi cũng nên thử."
 court_events.3070.c: "#EMP Ngươi dám sao?!#!"
 cheaper_fashion_for_15_years: "$court_fashion_decent$ rẻ hơn #P 20%#! trong 15 năm"
 free_fashion_for_15_years: "$court_fashion_acceptable$ #P miễn phí#! trong 15 năm"
 # Silvertongue
 court_events.3080.t: "Lưỡi Bạc"
 court_events.3080.desc: "[poet.GetWomanMan] gia nhập triều đình ta hôm nay mang phong thái lập dị và nụ cười đầy sức hút cùng sự tự tin.\n\n\"Vinh hiển thay [ROOT.Char.GetTitleAsNameNoTooltip], cho phép ta tự giới thiệu: ta là [poet.GetFirstNameNicknamed], một thi nhân tài hoa bậc nhất! Danh tiếng của ta lan khắp lục địa nhưng, trong dịp đặc biệt này, ta quyết định chấm dứt những ngày phiêu bạt và dâng lên ngài — vị [ROOT.Char.GetLadyLord] #EMP nhân từ#! và #EMP vĩ đại#! nhất — những dịch vụ vô giá của ta.\""
 court_events.3080.a: "Ngươi sẽ viết diễn văn cho ta."
 court_events.3080.b: "Chuyên môn của ngươi có thể giúp kế hoạch của ta..."
 court_events.3080.c: "Viết lời ngọt như mật cho các nhân tình của ta!"
 court_events.3080.d: "Hiện giờ ta không cần tài năng của ngươi."
 # I Want a Pony!
 court_events.3090.t: "Ta Muốn Một Con Ngựa!"
 court_events.3090.desc: "\"[ROOT.Char.GetMotherFather|U], người sẽ dạy con cưỡi ngựa chứ? Con muốn trở thành chiến binh vĩ đại nhất từng tồn tại!\"\n\nGiọng nói đầy hào hứng của [child.GetFirstNamePossessive] tìm đến ta trong một khoảnh khắc hiếm hoi yên tĩnh giữa vô vàn công vụ. Tham vọng của [child.GetHerHis|U] có lẽ hơi sớm, nhưng dù sao [child.GetSheHe] vẫn chỉ là một đứa trẻ... chơi theo một chút thì có sao đâu?"
 court_events.3090.a: "Được thôi, đi nào!"
 court_events.3090.b: "Học trước — ngựa sau!"
 court_events.3090.b.tt: "Nếu bây giờ con chăm chỉ học hành, ta hứa khi con lớn hơn sẽ tặng con chiến mã tốt nhất!"
 court_events.3090.b.tt_effect: "[child.GetShortUIName|U] sẽ nhận được một Chiến mã vào sinh nhật lần thứ 16 [child.GetHerHis] của mình."
 court_events.3090.c: "Ta không có thời gian cho việc này, [child.Custom('GetDaughterSon')]."
 court_events.3091.desc_no_parent: "\"Cảm giác như mới hôm qua ta còn chặn người lại, [parent.GetMotherFather], tuyên bố mong muốn trở thành một chiến binh vĩ đại — ta chỉ cần học cưỡi ngựa trước thôi.\"\n\n\"Thật ra... ta chỉ muốn được ở bên người nhiều hơn. Nhưng người, một cách sáng suốt, lại nghĩ cho tương lai của ta. Từ ngày đó ta đã chăm chỉ học hành như người dặn. Sinh nhật mười sáu tuổi của ta đã đến, nhưng người thì không còn nữa.\n\nTa đã có cho mình một chiến mã — đúng như lời người hứa ngày ấy — để tưởng nhớ người.\""
 court_events.3091.desc: "Sinh nhật lần thứ mười sáu của ta không chỉ đánh dấu bước chuyển mình sang tuổi trưởng thành, mà còn là sự thực hiện lời hứa từ lâu mà [parent.GetMotherFather] đã dành cho ta.\n\nTrong nhiều năm, ta đã giữ phần giao kèo của mình, học tập chăm chỉ. Liệu [parent.GetMotherFather] có nhớ phần của [parent.GetHerHis] không?\n\nTa vẫn đang lạc trong dòng suy nghĩ khi [parent.Custom('GetMamaPapa')|U] xuất hiện từ khu vườn, dẫn đầu một chiến mã oai vệ bằng dây cương. [parent.GetSheHe|U] đã nhớ!"
 court_events.3091.a: "Con sẽ khiến người tự hào!"
 court_events.3092.desc: "\"Cảm giác như mới hôm qua con phục kích ta, [child.GetFirstName], chỉ là một [child.Custom('GirlBoy')] nhỏ bé tự hào tuyên bố ý định [child.GetHerHis] của mình là trở thành một chiến binh vĩ đại!\"\n\nMỉm cười, ta dẫn đầu một chiến mã oai vệ bằng dây cương. \"Vào ngày đó, ta đã hứa với con con ngựa tốt nhất từng xuất hiện tại [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] của chúng ta, nếu con giữ vững việc học hành của mình. Con có nhớ không?\"\n\nNụ cười rạng rỡ trên khuôn mặt đứa trẻ của ta khi [child.GetSheHe] lần đầu ngồi trên lưng ngựa chính là tất cả sự công nhận mà ta cần."
 court_events.3092.a: "Không có gì đâu, [child.Custom('GetDaughterSon')]!"
 # A Language for the X's Court
 court_events.3100.t: "Ngôn Ngữ Cho Triều Đình Của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip|U]"
 court_events.3100.desc: "\"[ROOT.Char.GetTitleAsNameNoTooltip] đáng sợ của thần, quyền lực và vinh quang của ngài không ai có thể nghi ngờ, nhưng triều đình của ngài cảm thấy mình không được lắng nghe vì ngài đơn giản là không nói cùng ngôn ngữ với họ,\" [chancellor.Custom2('MyCharacterIntroduction', ROOT.Char)] bắt đầu một cách lo lắng.\n\n\"Có lẽ, học [ROOT.Char.GetCourtLanguage.GetName] sẽ khiến ngài gần gũi hơn với thần dân? Nếu ngài cho phép, thần xin dâng chút trợ giúp khiêm tốn.\""
 court_events.3100.a: "Có lẽ ta nên bắt đầu học."
 court_events.3100.b: "[linguist.GetFirstNameNoTooltip], dạy ta!"
 court_events.3100.c: "Ta không có thời gian cho thứ vớ vẩn này."
 court_events.3100.a.tt: "Ta bắt đầu một [GetScheme('learn_language').GetTypeName] [scheme|E] nhắm vào [chancellor.GetShortUIName] với [GetModifier('pressured_to_learn_court_language_modifier').GetNameWithTooltip]"
 # The Best Builder
 court_events.3110.t: "Nhà Xây Dựng Giỏi Nhất"
 court_events.3110.desc: "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] tiếp cận ta, sự lo lắng hiện rõ trên khuôn mặt [steward.GetHerHis] của ngài. \"Tôi mang đến tin tức đáng lo ngại.\"\n\n\"[vassal.GetTitledFirstName|U] của [vassal.GetPrimaryTitle.GetBaseNameNoTier] đã xây dựng thủ phủ [vassal.GetHerHis] của ngài theo những cách ấn tượng đến mức những người dân thường đã bắt đầu so sánh nó với [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitly], và thậm chí dám cho rằng cái sau không bằng!\"\n\n\"Ta e rằng một sự phô trương sức mạnh là cách duy nhất để giữ thể diện ở đây.\""
 court_events.3110.a: "Ta sẽ xây dựng vượt mặt [vassal.GetHerHim]!"
 court_events.3110.architect: "[GetCourtPositionType('royal_architect_court_position').GetName()] của ngươi bắt tay vào việc"
 court_events.3110.b: "Phạt nặng [vassal.GetHerHim]."
 court_events.3110.b.tt: "Ta chắc [vassal.GetSheHe] hẳn từng phạm luật gì đó!"
 court_events.3110.c: "Tốt cho [vassal.GetHerHim], ta nghĩ vậy."
 MODIFIER_DEFINITION_VALUE_ARCHITECT_SCALE: " \t#weak Tăng theo mỗi [aptitude_level|E] của [GetCourtPositionType('royal_architect_court_position').GetName()] của ngươi#!"
 court_events.3110.a.success: "Chương trình xây dựng của ngươi khởi đầu thành công"
 court_events.3110.a.failure: "Chương trình xây dựng của ngươi thất bại"
 court_events.3110.a.success.tt: "Chương Trình Xây Dựng Bắt Đầu"
 court_events.3110.a.failure.tt: "Chương Trình Xây Dựng Thất Bại"
 court_events.3110.b.success: "Ngươi tìm được lý do hoàn hảo"
 court_events.3110.b.success.tt: "[vassal.GetShortUINameNoTooltip] phải nộp phạt"
 court_events.3110.b.failure: "Địa vị của [vassal.GetTitleAsNamePossessiveNoTooltip] không thể chê trách"
 court_events.3110.b.failure.tt: "[vassal.GetShortUINameNoTooltip] không có lỗi"
 court_events.3115.desc: "[relative.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiếp cận ta, sự lo lắng hiện rõ trên khuôn mặt [relative.GetHerHis] của ngài. \"Tôi mang đến tin tức đáng lo ngại.\"\n\n\"Gia tộc [vassal.GetHouse.GetBaseName], dưới sự hướng dẫn của [vassal.GetTitledFirstName], đã mở rộng bất động sản gia đình của họ để phản ánh quyền lực và sự giàu có vượt xa mọi mong đợi của chúng ta, đến mức bất động sản của chúng ta trở nên nhạt nhòa khi so sánh!\"\n\nChúng ta cần phải làm điều gì đó, và sớm thôi, nếu muốn giữ thể diện!\""
 # I Could Do Better!
 court_events.3120.t: "Ta Có Thể Làm Tốt Hơn!"
 court_events.3120.desc: "[inspired.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã nhìn chằm chằm vào [artifact.GetName] của ta một cách khó chịu từ nãy đến giờ. Vẻ mặt đau đớn của [inspired.GetHerHis|U] chẳng báo hiệu điều gì tốt.\n\n\"Gì vậy, [inspired.GetFirstNameNoTooltip]?! Nói đi!\" cuối cùng ta bật ra.\n\n\"Xin lỗi, [ROOT.Char.Custom('FormOfAddressForLiege')], thần không định làm phiền ngài. Chỉ là món [artifact.GetType] này thật... #EMP nghiệp dư?#! Thô ráp, chưa tinh luyện, trông #EMP rẻ tiền!#! Một [ROOT.Char.GetTitleAsNameNoTooltip] ở địa vị như ngài xứng đáng với thứ tốt hơn! #EMP Chính thần#! có thể làm ra thứ tốt hơn...\""
 court_events.3120.a: "Vậy hãy làm cho nó tốt hơn ngay đi, [inspired.GetFirstNameNoTooltip]. Ta tin ngươi."
 court_events.3120.b: "Hãy tập trung vào tác phẩm của ngươi!"
 court_events.3120.c: "Hãy cho ta thấy ngươi vẫn làm tốt hơn được!"
 court_events.3120.d: "Đừng bận tâm."
 artifact_improved_tt: "Bảo Vật Được Cải Thiện"
 court_events.3120.a.tt: "[artifact.GetName] sẽ nhận #V 2#! #P hiệu ứng ngẫu nhiên#!"

