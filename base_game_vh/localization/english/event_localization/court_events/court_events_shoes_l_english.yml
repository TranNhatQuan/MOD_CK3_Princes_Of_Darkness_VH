l_english:
 court.placeholder_court_grandeur_loss:0 "Ngươi mất #V 10#! Uy Danh Triều Đình"

 # Growing Debauchery
 court.1000.t:0 "Sự Trụy Lạc Gia Tăng"
 court.1000.desc.opening:0 "An toàn tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] với mọi nhu cầu [child.GetHerHis] của con đều được chu cấp, [child.Custom2('MyCharacterIntroduction', ROOT.Char)] hầu như không có khuynh hướng làm gì ngoài việc"
 court.1000.desc.drunkard:0 "dành những ngày [child.GetHerHis] của con tại quán rượu, chìm đắm trong nguồn cung [child.Custom('RegionalAlcoholicDrink')] vô tận."
 court.1000.desc.hashishiyah:0 "dành những ngày [child.GetHerHis] của con ẩn dật trong một góc và phê pha với nguồn cung bánh hashish vô tận."
 court.1000.desc.rakish:0 "dành những ngày [child.GetHerHis] của con tại nhà thổ, \"giải trí\" cho một dòng khách vô tận."
 court.1000.desc.ending:0 "\n\nCác sứ giả ngoại quốc đã bắt đầu chú ý đến hành vi của [child.GetHerHis], và ta không khỏi tự hỏi những lời đồn đại nào đang được thì thầm về [child.GetHerHim] tại các triều đình xa xôi..."
 court.1000.a:0 "Hành vi này không thể chấp nhận... [child.GetSheHe] phải bị trừng phạt. Thậm chí là bị làm nhục."
 court.1000.a.tt:0 "Lấy [child.GetFirstName] làm gương có thể ngăn các cận thần khác hành xử tương tự"
 court.1000.b:0 "[child.GetSheHe|U] chỉ cần một chút trách nhiệm, một điều gì đó quan trọng để trông coi!"
 court.1000.b.success:0 "Nhiệm vụ mới của [child.GetFirstNamePossessiveNoTooltip] khiến [child.GetHerHim] bận rộn"
 court.1000.b.failure:0 "[child.GetFirstNameNoTooltip] tiếp tục nuông chiều những thói hư tật xấu [child.GetHerHis] của con sau giờ làm việc"
 court.1000.c:0 "Ha! [child.GetSheHe] quả thật biết tận hưởng những thú vui tinh tế của cuộc sống!"
 court.1000.c.tt:0 "Dung túng [child.GetFirstName] có thể khiến các cận thần khác hành xử tương tự"

 court.1001.title:0 "[courtier.GetFirstName] Sa Vào Trụy Lạc"

 # Daydrinking
 court.1010.t:0 "Uống Rượu Từ Ban Ngày"
 court.1010.desc:0 "Những trò say xỉn của [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] trước đây đã là đề tài bàn tán, nhưng gần đây [courtier.GetSheHe] dường như đã đưa chúng lên một mức độ hoàn toàn mới.\n\nSay khướt từ giữa buổi sáng, ngất xỉu trong sân [courtier.Custom('ResidenceBuilding')], lảo đảo tới quán rượu vào buổi chiều, rồi tỉnh dậy trong chuồng ngựa với cơn đau đầu như búa bổ vào ngày hôm sau... Hành vi sa đọa của [courtier.GetFirstNamePossessiveNoTooltip] là nỗi xấu hổ cho tất cả những ai cư ngụ tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 court.1010.a:0 "[courtier.GetSheHe|U] không thích hợp cho bất cứ việc gì — và sẽ mãi như vậy."
 court.1010.b:0 "[courtier.GetFirstNameNoTooltip] sẽ tỉnh rượu trong ngục tối!"
 court.1010.c:0 "Một lời răn dạy nghiêm khắc sẽ khiến [courtier.GetHerHim] tỉnh ngộ."
 court.1010.c.success:0 "[courtier.GetFirstNameNoTooltip] từ bỏ rượu chè... ít nhất là không còn quá độ"
 court.1010.c.failure:0 "[courtier.GetFirstNameNoTooltip] không thay đổi hành vi của [courtier.GetHerHis]"
 court.1010.d:0 "Nếu [courtier.GetFirstNameNoTooltip] muốn làm trò hề, vậy [courtier.GetSheHe] sẽ trở thành trò hề!"
 court.1010.e:0 "Cứ để người khác chế giễu [courtier.GetHerHim]... [ROOT.Char.GetFaith.NegativeAfterLife], ta sẽ cười cùng họ!"

 # Long Arm of the Law
 court.1020.opening:0 "[foreign_ruler.Custom2('AppropriateGreeting', ROOT.Char)]"
 court.1020.desc:0 "Ta được biết rằng một kẻ đào tẩu ngoài vòng pháp luật, [fugitive.GetTitledFirstName], đang trú tại triều đình của ngươi. Hãy giao hắn cho ta để chịu phán quyết của công lý, "
 court.1020.desc.forgive_this:0 "và ta sẽ bỏ qua sự xúc phạm này."
 court.1020.desc.forgive_all:0 "và ta sẽ bỏ qua sự xúc phạm này, cũng như những lần trước."
 court.1020.desc.gold:0 "và ta sẽ đền bù cho ngươi vì sự phiền toái này."
 court.1020.desc.opinion:0 "và ta sẽ ghi nhớ sự hợp tác của ngươi trong nhiều năm tới."
 court.1020.a:0 "Việc đó sẽ được thực hiện."
 court.1020.b:0 "[fugitive.GetFirstNameNoTooltip] là khách của ta — và dưới sự bảo hộ của ta."
 court.1020.c:0 "[fugitive.GetFirstNameNoTooltip]? Không có ai tên [fugitive.GetFirstNameNoTooltip] ở lại đây..."

 # Poor Manners
 court.1030.t:0 "Thiếu Lễ Nghi"
 court.1030.desc:0 "#EMP ~Ợ~#!\n\nKhi tiếng ợ lớn vang vọng khắp sảnh ăn, mọi cuộc trò chuyện đột ngột dừng lại. [chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vỗ vào bụng [chaplain.GetHerHis] của ngài và cười toe toét. \"À, cha tôi luôn nói rằng tốt hơn là để nó thoát ra ngoài hơn là giữ lại trong người!\"\n\nNhiều triều thần trao đổi những cái nhìn hoài nghi, trước khi [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] nhìn thẳng vào ta và thốt lên: \"[ROOT.Char.GetTitleAsNameNoTooltip] của tôi, điều đó hoàn toàn không phù hợp! Chắc chắn ngài phải đồng ý chứ?\""
 court.1030.a:0 "[chaplain.GetFirstNameNoTooltip] là một [chaplain.GetWomanMan] phụng sự [chaplain.GetFaith.HighGodName]. Hãy đối xử với [chaplain.GetHerHim] đúng như vậy."
 court.1030.b:0 "Dù là [chaplain.Custom('GetActualBishopTitle')] đi nữa, [chaplain.GetFirstNameNoTooltip] #EMP sẽ#! học lễ nghi đúng mực..."
 court.1030.b.flavor:0 "...nếu không thì [chaplain.GetSheHe] sẽ ăn cùng lũ heo trong chuồng!"
 court.1030.b.custom:0 "Mọi cận thần khác"
 court.1030.c:0 "Ôi nào, chẳng lẽ chúng ta chưa từng phải thả ra một lần sao?"
