 court_maintenance.0012.t:0 "Biểu Tượng Danh Vọng"
 court_maintenance.0012.desc:0 "Khi danh tiếng vương triều của ta ngày càng lan rộng, biểu tượng vinh quang của [ROOT.Char.GetDynasty.GetName] cũng trở nên quen thuộc. \n\n"
 court_maintenance.0012.desc_illustrious:0 "Huy hiệu gia tộc ta nay đã được biết đến khắp thế giới, được các quan chưởng ấn ghi chép, trẻ em học thuộc và khiến thương nhân ở những vùng đất mà [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] chưa từng đặt chân tới cũng phải trầm trồ."
 court_maintenance.0012.desc_masterwork:0 "Biểu tượng gia tộc ta nay đã trở thành điều ai cũng biết, được xếp vào hàng những hoàng tộc vĩ đại của vùng và tầng lớp quý tộc cao nhất của [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]."
 court_maintenance.0012.desc_famed:0 "Huy hiệu gia tộc ta nay đã được nhận ra trong giới quý tộc khu vực, được xem là một trong những dòng dõi nổi bật của [ROOT.Char.GetCulture.GetNameNoTooltip]."
 court_maintenance.0012.a:0 "Đúng như lẽ phải."
 court_maintenance.0013.t:0 "Bảo Vật Vương Triều"
 court_maintenance.0013.desc:0 "Trách nhiệm của ta là bảo vệ danh dự của gia tộc [ROOT.Char.GetDynasty.GetName], và mang theo lá cờ của nó."
 court_maintenance.0013.desc_creator:0 "Chỉ riêng cờ hiệu cá nhân của [banner_scope.MakeScope.Var('banner_commissioner').Char.GetNamePossessiveRegnal] cũng đủ đánh dấu sự vĩ đại của dòng dõi [banner_scope.MakeScope.Var('banner_commissioner').Char.GetHerHis]."
 court_maintenance.0013.desc_fallback:0 "Chỉ riêng cờ hiệu cá nhân của ta sẽ được truyền qua nhiều thế hệ, ghi dấu vinh quang của mọi hậu duệ."
 court_maintenance.0013.a:0 "Chỉ có thể có một."
