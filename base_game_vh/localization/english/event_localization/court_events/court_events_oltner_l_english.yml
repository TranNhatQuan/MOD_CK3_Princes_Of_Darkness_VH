l_english:
 court.9000.t:0 "Lời Tỏ Bày Của Một Hiệp Sĩ"
 court.9000.desc:0 "Khi ta bước về phía ngai vàng, ta nghe thấy $knight_culture_player_no_tooltip_lowercase$ của ta, [flirty_knight.GetFirstName], đang tuyên bố điều gì đó với [flirty_spouse.GetWifeHusband] của ta, [flirty_spouse.GetFirstName].\n\n"[flirty_knight.Custom('GeneratePoem_Intro_Rhyming')]\n[flirty_knight.Custom('GeneratePoem_Outro_Rhyming')]"\n\n[flirty_knight.GetSheHe] đang ngâm thơ tình ư? Với #EMP chính#! [flirty_spouse.GetWifeHusband] của ta!?"
 court.9000.a:0 "[flirty_knight.GetFirstNameNoTooltip], đồ [flirty_knight.Custom2('InsultNounSexual', ROOT.Char)]! Tống ngươi vào ngục ngay!"
 court.9000.b:0 "[flirty_spouse.GetFirstNameNoTooltip]! Tránh xa [flirty_knight.GetHerHim] ra, đồ [flirty_spouse.Custom2('InsultNounSexual', ROOT.Char)]!"
 court.9000.c:0 "À, tình yêu cung đình! Hãy để những vần thơ tuyệt vời ấy vang vọng khắp đại sảnh!"
 court_9000_a_tt:0 "Nếu có điều gì đang xảy ra giữa [flirty_spouse.GetFirstName] và [flirty_knight.GetFirstName], nó sẽ kết thúc tại đây\n"
 court_9000_b_tt:0 "Nếu có điều gì đang xảy ra giữa [flirty_spouse.GetFirstName] và [flirty_knight.GetFirstName], nhiều khả năng nó sẽ chấm dứt\n"
 court_9000_c_tt:0 "Nếu có điều gì đang xảy ra giữa [flirty_spouse.GetFirstName] và [flirty_knight.GetFirstName], ta cho phép nó tiếp tục\n"
 
 court.9001.t:0 "Một Món Quà Cung Đình"
 court.9001.desc:0 "Ta phát hiện [flirty_spouse.GetWifeHusband] [flirty_spouse.GetFirstName] và [ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('flirty_knight'))] [flirty_knight.GetFirstName] của ta đang chia sẻ khoảnh khắc trông như rất nồng cháy — với [flirty_knight.GetFirstNameNoTooltip] đang quỳ gối trước [flirty_spouse.GetHerHim].\n\n\"[flirty_spouse.Custom('RomanticComplimentNoun')] của tôi! Xin hãy chấp nhận món quà khiêm tốn này.\" [flirty_knight.GetFirstNameNoTooltip] nói, trao món quà [flirty_spouse.Custom('SeductionGiftTypeIndefiniteSimple')].\n\n\"Ồ!\" [flirty_spouse.GetFirstNameNoTooltip] lắp bắp. \"Tôi thích nó! Nó thật tuyệt vời.\"\n\nChính xác thì chuyện gì đang xảy ra ở đây vậy?"
 court.9001.a:0 "[flirty_spouse.GetFirstNameNoTooltip] là #EMP của ta.#! Rút kiếm ra!"
 court.9001.b:0 "Đưa đây! [flirty_knight.GetFirstNameNoTooltip] — ta trục xuất ngươi khỏi vương quốc!"
 court.9001.c:0 "Tình yêu cung đình thật thuần khiết, thật ngây thơ!"
 court.9001.a.tt:0 "#V Đấu tay đôi#! với [flirty_knight.GetFirstName] để buộc [flirty_knight.GetHerHim] tránh xa [flirty_spouse.GetWifeHusband] của ngươi!\n#weak Cuộc đấu này KHÔNG phải đến chết.#!\nNếu ngươi thắng, trái tim của [flirty_spouse.GetFirstNamePossessive] sẽ chỉ thuộc về ngươi. Nếu ngươi thua... ai biết điều gì sẽ xảy ra?\n\n[prowess|E] của ngươi: [prowess_i]#V [root_for_loc.GetProwess]#!\n[prowess|E] của [flirty_knight.GetFirstNamePossessive]: [prowess_i]#V [flirty_knight.GetProwess]#!"
 how_could_you_opinion:0 "Sao Ngươi Dám"
 court.9002.trigger_failure:0 "Cuộc đấu tay đôi của ta với [flirty_knight.GetFirstNameNoTooltip] đã bị vô hiệu"
 court.9004.t:0 "$court.9001.t$: Chiến Thắng"
 court.9004.desc:0 "\"Tôi đặt vũ khí xuống trước mặt ngài — linh hồn ngài thật [ROOT.Char.Custom('ComplimentAdjective')], và xứng đáng với trái tim [flirty_spouse.GetFirstNamePossessive] hơn!\" [flirty_knight.GetFirstName] nói, đầy thất bại.\n\"Từ nay về sau tôi sẽ phục vụ ngài mà không cần thắc mắc, [ROOT.Char.GetTitleTierName].\"\n\n[flirty_spouse.GetWifeHusband] [flirty_spouse.GetFirstNameNoTooltip] của ta quay sang ta, một ngọn lửa mới trong đôi mắt [flirty_spouse.GetHerHis] của ngài.\n\n\"[ROOT.Char.GetWifeHusband|U], ngài đã liều mạng vì tình cảm của tôi! Ồ, trái tim ngài thật cao quý — từ nay về sau tôi chỉ là của ngài thôi!\""
 court.9004.a:0 "[flirty_spouse.GetFirstNameNoTooltip] chỉ thuộc về ta."
 court.9005.t:0 "$court.9001.t$: Thất Bại"
 court.9005.desc:0 ""Ngươi chưa bao giờ xứng đáng với tình yêu của [flirty_spouse.GetFirstNamePossessive]!" [flirty_knight.GetFirstName] thốt lên.\n\n"Ôi, người hùng [flirty_knight.Custom('ComplimentAdjective')] của ta, ta ước chúng ta có thể rời khỏi nơi ảm đạm này! Nhưng dù sao đi nữa, tình yêu của chúng ta vẫn có quyền nở rộ." [flirty_spouse.GetFirstNameNoTooltip] nói, thở dài tha thiết.\n\n[flirty_knight.GetFirstNameNoTooltip] nhìn chằm chằm vào ta với gương mặt lạnh như đá."
 court.9005.a:0 "[ROOT.Char.Custom('CulturalCurse')|U]!"
 court_9005_tt:0 "[flirty_spouse.GetFirstName] và [flirty_knight.GetFirstName] rời khỏi triều đình của ngươi để consummate tình yêu của họ ở nơi khác"
 
 court.9100.t:0 "Yến Tiệc Khoái Lạc"
 court.9100.desc:0 "\"À, tuyệt vời! [food_lover_1.Custom('GetExpensiveMeal')|U], món yêu thích của tôi!\" [food_lover_1.GetFirstName] gầm lên một cách vui vẻ, nhồi nhét [food_lover_1.GetHerselfHimself] khi người hầu tuyệt vọng giữ thăng bằng khay phục vụ.\n\n\"Ồ, món [food_lover_2.Custom('GetExpensiveDessert')] yêu dấu của tôi, ngài thực sự rất ngon lành!\" [food_lover_2.GetFirstName] nói với giọng hát líu lo.\n\n\"Bây giờ, đây mới là điều mà cuộc sống hướng tới! Người hầu, thêm [food_lover_1.Custom('GetExpensiveDrink')], ngay!\" [food_lover_3.GetFirstName] yêu cầu.\n\nCó vẻ như các triều thần của ta đang tận hưởng bản thân!"
 court.9100.a:0 "Làm việc nhiều hơn, bớt nhét đầy bụng lại!"
 court.9100.b:0 "Các ngươi xứng đáng với những thứ tốt nhất!"
 court.9100.c:0 "Để dành cho ta ít rượu nữa, [food_lover_3.GetFirstNameNoTooltip] — uống cùng bạn bè mới là tuyệt nhất!"
 court.9100.d:0 "Ta nên để họ tận hưởng."
 
 court.9200.t:0 "Bằng Hữu Trong Yến Tiệc"
 court.9200.desc:0 ""[ROOT.Char.GetTitleTierName] của chúng ta thật hào phóng, [food_lover_2.GetFirstNameNoTooltip]! Hãy nếm thử món #EMP tuyệt hảo#! [food_lover_1.Custom('GetExpensiveMeal')] này!" [food_lover_1.GetFirstName] cảm thán.\n\n"Đúng vậy! [ROOT.Char.GetLadyLord|U] [ROOT.Char.GetFirstNameNoTooltip] thật [food_lover_1.Custom('ComplimentAdjective')] — cũng giống như món [food_lover_2.Custom('FavoriteTreat')] này!" [food_lover_2.GetFirstName] hào hứng đáp.\n\nCó vẻ như những bữa tiệc xa hoa của ta đã khiến một tình bạn mới nảy nở!"
 court.9200.a:0 "Ta có thể tham gia cùng các ngươi dùng [food_lover_1.Custom('GetExpensiveMeal')] không?"
 court.9200.b:0 "Người hầu, các ngươi không thấy họ đang đói sao? Mang thêm [food_lover_2.Custom('GetExpensiveDessert')]!"
 court.9200.c:0 "Làm phiền người khác khi họ đang ăn thật thất lễ!"
 
 court.9300.t:0 "Ăn Uống Quá Đà"
 court.9300.desc:0 "\"Th... thưa [ROOT.Char.GetTitleTierName]. [ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('overindulger_target'))] [overindulger_target.GetFirstName], [overindulger_target.GetSheHe] vừa... #EMP [overindulger_target.GetSheHe] cứ ăn mãi món [overindulger_target.Custom('GetExpensiveDessert')] đó!#!\" [ROOT.Char.Custom2('RelationToMeShort',worried_courtier)] [worried_courtier.GetFirstName] của ta lắp bắp.\n\nNgay tại thời điểm này, ta phát hiện [overindulger_target.GetFirstNameNoTooltip] đang bước ra khỏi phòng để thức ăn, mang theo một đống [overindulger_target.Custom('GetExpensiveDessert')] trong cả hai cánh tay [overindulger_target.GetHerHis] của ngài.\n\n\"Có chuyện gì không ổn sao, thưa lãnh chúa của tôi?\" [overindulger_target.GetFirstNameNoTooltip] nói, [overindulger_target.Custom('quirk_neg_pp')]."
 court.9300.a:0 "#EMP Ngươi ăn hết [overindulger_target.Custom('GetExpensiveDessert')] của hoàng gia sao!?"
 court.9300.b:0 "Nhân danh [ROOT.Char.GetFaith.HighGodName], [overindulger_target.GetWomanMan]! Kiềm chế bản thân lại!"
 court.9300.c:0 "Ồ, tốt hơn hết ngươi #EMP nên#! trả tiền cho số đó."
 court.9300.d:0 "Từ giờ ngươi bị cấm vào kho thực phẩm..."
 court.9300.b.success:0 "Ngươi thuyết phục [overindulger_target.GetFirstNameNoTooltip] ngừng ăn [overindulger_target.Custom('GetExpensiveDessert')] và bồi thường"
 court.9300.b.failure:0 "[overindulger_target.GetFirstNameNoTooltip] không hề bị thuyết phục và từ chối bồi thường"
 
 court.9400.t:0 "Trò Đùa Bánh Pie"
 court.9400.desc:0 "Bây giờ đây là gì thế này? Một chiếc bánh #EMP khổng lồ#!, ngay giữa phòng ngai vàng của ta!?\n\n\"Ngài có muốn dùng chút bánh không, thưa [pie_presenting_courtier.Custom2('RelationToMeShort' , SCOPE.sC('you_target'))] của tôi?\" [pie_presenting_courtier.GetFirstName] cười khúc khích.\n\"Nó có một bất ngờ đấy! Đây là một con dao, xin hãy — cứ tự nhiên cắt một miếng!\"\n\nTa miễn cưỡng cầm lấy con dao và cẩn thận cắt vào lớp vỏ. Đột nhiên, Tòa án Jester [court_jester.GetFirstName] của ta bùng nổ, cười lớn và vẫy đôi tay [court_jester.GetHerHis] của ngài!"
 court.9400.a:0 "Biết không? Ta đang đói. #EMP Chui lại vào bánh đi.#!"
 court.9400.b:0 "À, [court_jester.GetFirstNameNoTooltip], thật sáng tạo! Đây, một phần thưởng nhỏ."
 court.9400.c:0 "#EMP Sát thủ! Lính gác!#!"
 court.9400.d:0 "Ha ha! Đây mới đúng là giải trí!"
 absolutely_horrified_opinion:0 "Kinh Hoàng Tột Độ"
 best_meal_of_my_life_modifier:0 "Bữa Ăn Ngon Nhất Đời"
 best_meal_of_my_life_modifier_desc:0 "Nhân vật này vừa ăn thứ gì đó tuyệt hảo ngoài sức tưởng tượng!"
 suspicious_against_pies_modifier:0 "Cảnh Giác Với Bánh Pie"
 suspicious_against_pies_modifier_desc:0 "Nhân vật này cực kỳ nghi ngờ và cảnh giác với bất cứ thứ gì trông giống bánh pie. Điều này cũng áp dụng cho các loại thức ăn khác... và thật ra là mọi thứ."
 
 court.9500.t:0 "Một Chút Ngôn Ngữ"
 court.9500.desc:1 "\"Chào ngài, [ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitleTierName] của tôi.\" [teacher_target.GetFirstName] nói, [teacher_target.Custom('quirk_pos_pp')].\n\n\"Tôi rất quan tâm đến việc giáo dục [child_to_learn_language.Custom('GetDaughterSon')] của ngài, [child_to_learn_language.GetFirstName]. Ngài thấy đấy, tôi nói được tiếng [culture_language_to_learn.GetLanguage.GetNameNoTooltip] — một ngôn ngữ mà tôi tin rằng sẽ rất hữu ích cho [child_to_learn_language.GetHerHim] để học.\" [teacher_target.GetSheHe] giải thích với giọng điệu chân thành.\n\n\"Tôi chỉ cần tiền cho bút lông, mực, giấy da... và tất nhiên là một chút tiền thù lao cá nhân.\""
 court.9500.a:0 "Nghe rất hữu ích. Ta sẽ trả #EMP bất cứ giá nào#! để việc này thành hiện thực."
 court.9500.b:0 "[child_to_learn_language.GetFirstNameNoTooltip], hãy cố gắng hết sức!"
 court.9500.c:1 "Hừ! Cần gì nói thứ tiếng nào ngoài [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]!?"
 court.9500.b.success:1 "[child_to_learn_language.GetFirstNameNoTooltip] học thành công [culture_language_to_learn.GetLanguage.GetNameNoTooltip]"
 court.9500.b.failure:0 "[child_to_learn_language.GetFirstNameNoTooltip] bị căng thẳng"
 
 court_maintenance.0010.t:0 "Ngai Vàng Trống Vắng"
 court_maintenance.0010.desc:1 "Cận thần của ta, [messenger.GetName], khăng khăng đòi gặp ta, dù ta đã nói rõ rằng ta muốn được ở một mình:\n\n\"Hỡi [ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitleTierName] của thần! Đã khá lâu rồi kể từ lần cuối ngài xuất hiện tại triều đình.\nChúng thần vẫn cố giữ thể diện khi ngài vắng mặt, nhưng một triều đình [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] không thể vận hành nếu thiếu sự hiện diện của [ROOT.Char.GetTitleTierName].\"\n\nSự vắng mặt quá lâu của ta khỏi triều đình hoàng gia đã khiến nó trở nên vô chủ và mất phương hướng."
 court_maintenance.0010.desc.seeking_gainful_employment:0 "Các cận thần của ta ngày càng so sánh hoàn cảnh của họ với những triều đình danh giá như triều đình [great_cgv_court.GetPrimaryTitle.GetAdjectiveNoTooltip]."
 court_maintenance.0010.desc.general_ending:0 "Các cận thần của ta ngày càng so sánh hoàn cảnh của họ với các triều đình ngoại quốc."
 court_maintenance.0010.a:0 "Đã đến lúc ta phải ghé thăm triều đình hoàng gia."
 court_maintenance.0010.a.tooltip:0 "Ngươi sẽ bước vào Hoàng Gia Triều Đình."
 court_maintenance.0010.b:0 "Ta sẽ đến triều đình khi ta thấy thích hợp."
 court_maintenance.0010.b.tooltip:0 "Một số cận thần có thể rời triều đình của ngươi để đến triều đình tại [great_cgv_court.GetPrimaryTitle.GetName]."
 court_maintenance.0010.b.brave:0 "Ta khao khát phiêu lưu, không phải nghi lễ nhàn rỗi!"
 court_maintenance.0010.b.depressed:0 "Ta thật sự không thấy điều này có ý nghĩa gì..."
 court_maintenance.0010.b.paranoid:0 "Ta không thể xuất hiện nơi công khai. Ta phải luôn an toàn!"
 court_maintenance.0010.c:0 "Một yến tiệc sẽ cho họ chút việc để làm!"
 court_maintenance.0010.c.tooltip:0 "Ngươi tổ chức một yến tiệc tại [SCOPE.GetRootScope.GetCharacter.GetCapitalLocation.GetTitle.GetNameNoTier]"
 court_maintenance.0011.t:0 "Triều Đình [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 court_maintenance.0011.t.regent: "Triều Đình Của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
 court_maintenance.0011.desc:1 "\"Với tư cách [ROOT.Char.GetTitleTierName], ngươi có những nghĩa vụ và trách nhiệm mới. Ngươi sẽ phải thường xuyên thiết triều, giải quyết tranh chấp trong lãnh địa và để các cận thần tham gia vào sinh hoạt thường ngày của ngươi.\"\n\n[messenger.GetName] nhìn ta với vẻ nghiêm nghị, gần như đang giảng giải. Có lẽ trong ánh mắt của [messenger.GetHerHis] còn thoáng chút [ROOT.GetCharacter.Custom2('GetPrideEnvy' , SCOPE.sC('messenger'))]?\n\n[messenger.GetSheHe|U] bắt đầu mở ra một lá cờ tuyệt đẹp mang biểu tượng của Gia tộc [ROOT.Char.GetHouse.GetName]. \"Một trong những cách thế gian đánh giá triều đại của ngươi là cách ngươi trang hoàng và chăm sóc triều đình hoàng gia. Ta đã cho làm lá cờ này như một món quà đánh dấu sự khởi đầu triều đại của ngươi.\""
 court_maintenance.0011.desc.regent: "\"Với tư cách là [ROOT.Char.GetTitleTierName], ngài có những nghĩa vụ và trách nhiệm mới. Ngài sẽ phải thường xuyên tổ chức triều đình, giải quyết các tranh chấp trong lãnh địa, và nghe lời khuyên của các triều thần khác của [ceremonial_liege.GetTitleAsNamePossessiveNoTooltip] trong các thói quen hàng ngày tại triều đình [ceremonial_liege.GetHerHis] của ngài.\""
 court_maintenance.0011.desc.ach: "\"Món quà này sẽ đánh dấu sự khởi đầu triều đại của ngươi.\"[messenger.GetName] mở ra một lá cờ tuyệt đẹp mang biểu tượng của Gia tộc [ROOT.Char.GetHouse.GetName].\n\n\"Ngươi mang danh [ROOT.Char.GetTitleTierName|l], nhưng vương quốc vẫn nên tụ họp cho một nghi lễ đăng quang trọng đại! Tại đó, ngươi có thể củng cố quyền lực của mình và thề nguyện trước [ROOT.Char.GetFaith.HighGodName] với tư cách người bảo hộ và bảo vệ của [ROOT.Char.GetPrimaryTitle.GetNameNoTier].\""
 court_maintenance.0011.coronation: "Lập tức bắt đầu chuẩn bị."
 court_maintenance.0011.coronation.tooltip: "Ngươi sẽ bắt đầu chuẩn bị cho [coronation|E] của mình."
 court_maintenance.0011.crown_needed.tooltip: "Một số [activity_options|E] của [coronation|E] yêu cầu một [artifact|E] #V Vương Miện#!"
 court_maintenance.0011.regalia_needed.tooltip: "Một số [activity_options|E] của [coronation|E] yêu cầu [artifact|E] #V Vương Phục#!"
 court_maintenance.0011.artificier_crown.tooltip: "$court_maintenance.0011.crown_needed.tooltip$ [GetCourtPositionType('court_artificer_court_position').GetName()] của ngài sẽ bắt đầu làm một cái ngay lập tức"
