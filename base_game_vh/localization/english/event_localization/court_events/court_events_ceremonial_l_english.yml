l_english: 
 ceremonial_petition_prefix: "Thỉnh Nguyện Nghi Lễ:"
 court_ceremonial.1000.t: "$ceremonial_petition_prefix$ Chuẩn Thuận Nhiếp Chính"
 court_ceremonial.1000.opening: "[petition_vassal.GetTitledFirstName] bước lên phía trước, cúi mình thật sâu trước triều đình đang tề tựu, khi bản thỉnh nguyện viết tay của [petition_vassal.GetHerHis] được các cận thần của ta chuyển đến.\n\n[petition_vassal.GetSheHe|U] cất lời rõ ràng và điềm tĩnh, \"Tôn quý [petition_liege.GetTitleAsName], hôm nay ta đến đây để khiêm nhường thỉnh cầu ngài can thiệp vào một việc hệ trọng.\"\n\n"
 court_ceremonial.1000.desc: "\"Là người đứng đầu một gia tộc luôn tự hào được phụng sự [petition_vassal.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTooltip] một cách khiêm nhường và trung thành, gia tộc [petition_vassal.GetDynasty.GetName] đáng tự hào, ta xin ngài chuẩn thuận để ta giữ chức Nhiếp Chính của vương quốc.\""
 court_ceremonial.1000.a: "Ta rộng lượng chấp thuận lời thỉnh cầu chân thành của ngươi."
 court_ceremonial.1000.b: "Có lẽ nếu ngươi ủng hộ [ROOT.Char.GetConfederation.GetName] thì sao?"
 court_ceremonial.1000.c: "Ân huệ của hoàng gia không thể bị lãng quên."
 court_ceremonial.1000.d: "Hẳn là ngươi có những lễ vật hào phóng để dâng lên đổi lại."
 court_ceremonial.1000.e: "Chuyện này không thể được."
 court_ceremonial.1000.f: "Được, đổi lại sự phục vụ của [knight.GetFirstNamePossessiveNoTooltip]."
 court_ceremonial.1000.g: "[monk.GetFirstNameNoTooltip] sẽ là một [GetTrait('devoted').GetName( monk )] rất thích hợp."
 court_ceremonial.1000.h: "Hãy giải quyết những thỏa thuận cũ của chúng ta."
 court_ceremonial.1100.t: "$ceremonial_petition_prefix$ Chuẩn Thuận Chức Tổng Đốc"
 court_ceremonial.1100.desc: "\"Là người đứng đầu một gia tộc luôn tự hào được phụng sự [petition_vassal.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTooltip] một cách khiêm nhường và trung thành, gia tộc [petition_vassal.GetDynasty.GetName] đáng tự hào, ta xin ngài ban chuẩn thuận hoàng gia để được đảm nhiệm chức Tổng đốc.\""
 court_ceremonial.1200.t: "$ceremonial_petition_prefix$ Hôn Nhân Hoàng Gia"
 court_ceremonial.1200.desc: "\"Là người đứng đầu một trong những gia tộc danh giá bậc nhất vương quốc, gia tộc [petition_vassal.GetDynasty.GetName] đáng tự hào, ta xin ngài chính thức chuẩn thuận một cuộc hôn nhân với gia tộc lừng lẫy và thiêng liêng của ngài.\""
 court_ceremonial.1300.t: "$ceremonial_petition_prefix$ Danh Vọng Gia Tộc [petition_vassal.GetHouse.GetBaseNameNoTooltip]"
 court_ceremonial.1300.desc: "\"Là người đứng đầu một trong những gia tộc danh giá bậc nhất vương quốc, gia tộc [petition_vassal.GetDynasty.GetName] đáng tự hào, ta xin ngài chính thức công nhận huyết thống và gia phả cao quý của gia tộc ta trong hàng ngũ quý tộc [petition_vassal.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip].\""
 
