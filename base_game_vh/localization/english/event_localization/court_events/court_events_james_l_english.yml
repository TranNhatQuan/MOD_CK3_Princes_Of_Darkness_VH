l_english:
 court.0101.t:0 "Kẻ Hạ Đẳng Tại Triều"
 court.0101.desc.opening:1 "Một tù nhân tên là [lowborn_criminal.GetName] đã bị giải tới trước mặt [executioner.GetName] vì"
 court.0101.desc.murderer:0 "một vụ giết người không thể nói nên lời!\n\n"
 court.0101.desc.deviant:0 "những hành vi thú tính và tà dâm ô uế!\n\n"
 court.0101.desc.witch:0 "những hành vi tà ác và tội lỗi chống lại [lowborn_criminal.GetFaith.HighGodName]!\n\n"
 court.0101.desc.lazy:0 "không tuân lệnh của chủ nhân [lowborn_criminal.GetHerHis]. Là học việc của người thợ xây trong làng, [lowborn_criminal.GetName] bị tố cáo đã cãi lại chủ nhân [lowborn_criminal.GetHerHis], không nghe lệnh, thậm chí còn thách thức tay nghề của chủ nhân [lowborn_criminal.GetHerHis]."
 court.0101.desc.thief:0 "vô số vụ trộm khắp lãnh địa.\n\n Kẻ cặn bã này đã vắt kiệt [ROOT.Char.GetPrimaryTitle.GetName] vĩ đại này với tất cả những hành vi chiếm đoạt tài sản vương triều [lowborn_criminal.GetHerHis] của ngài như bánh mì, rau củ, và thậm chí cả quần áo!"
 court.0101.desc.sumptuary:0 "vi phạm luật xa hoa của [ROOT.Char.GetTitleAsNameNoTooltip].\n\n [lowborn_criminal.GetSheHe] đã mặc đủ loại vải vóc lòe loẹt khó coi cùng những bộ y phục chắp vá lạc điệu. Đây không chỉ là tội với [ROOT.Char.GetTitleAsNameNoTooltip], mà còn là tội với sự đoan chính thông thường."
 court.0101.desc.cannibal:0 "[lowborn_criminal.GetName] và gia đình [lowborn_criminal.GetHerHis] đã sống trong một hang động gần [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], dụ dỗ lữ khách bằng lời hứa về thức ăn và chỗ trú. Gia đình [lowborn_criminal.GetHerHis|U] được cho là đã ăn thịt hơn một nghìn lữ khách theo cách này, và cư dân của [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] đòi hỏi công lý."
 court.0101.desc.sadistic:0 "Tên tội phạm đã rạch cổ người thợ xay rồi lục soát nhà ông ta. Chưa dừng ở đó, [lowborn_criminal.GetSheHe] còn ép vợ người thợ xay nấu trứng cho [lowborn_criminal.GetHerHim], rồi [lowborn_criminal.GetSheHe] ăn chúng ngay trên thi thể người thợ xay đã chết, đồng thời ép người vợ phải cùng tham dự với [lowborn_criminal.GetHerHim]."
 court.0101.desc.priest:0 "Một [lowborn_criminal.GetFaith.PriestNeuter], [lowborn_criminal.GetName] đã sát hại một thành viên trong chính giáo đoàn của [lowborn_criminal.GetHerHis]. Kẻ khốn nạn này đã cố xin sự ân xá cho tội ác của [lowborn_criminal.GetHerHis] từ giới chức [lowborn_criminal.GetFaith.GetAdjective], nhưng lính canh đã bắt gặp [lowborn_criminal.GetHerHim] khi đang quay lại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] và lập tức bắt giữ tên [lowborn_criminal.GetFaith.PriestNeuter] tà ác này."
 court.0101.desc.stableboy:1 "[lowborn_criminal.GetName] bị bắt quả tang đang thực hiện hành vi dâm ô với [lowborn_criminal.Custom('servant_for_romance')]. Đây không chỉ là hành vi ngoại tình, mà còn là sự sỉ nhục đối với danh dự của Gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip]!"
 court.0101.desc.kinky:0 "[lowborn_criminal.GetName] bị phát hiện bị xích vào một cọc gỗ, từ đầu đến chân phủ đầy cháo loãng, cùng một dụng cụ khó coi gắn vào phần hạ thể của [lowborn_criminal.GetHerHis]. Những vết thương trên thân thể [lowborn_criminal.GetHerHis] cho thấy chúng gây ra vì khoái lạc, và tù nhân dường như hoàn toàn không biết xấu hổ về những dục vọng dị thường của [lowborn_criminal.GetHerHis]."
 court.0101.desc.animals:1 "Tù nhân bị bắt quả tang đang thực hiện những hành vi ô uế với một con gia súc của [lowborn_criminal.GetHerHis], một con ngựa, và một tổ ong. Hành vi lệch lạc như vậy đi ngược lại ý chí của [lowborn_criminal.GetFaith.HighGodName] và là tội không chỉ với tự nhiên mà còn với đạo lý và lẽ thường!"
 court.0101.desc.baby_soup:0 "[lowborn_criminal.GetName] đã bị dân làng tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] tố cáo vì hành vi không thể nói nên lời: luộc sống chính những đứa con sơ sinh của [lowborn_criminal.GetHerHis] cùng với vài loại thảo mộc và rau củ. Hành vi thú tính này nhằm kéo dài sinh mạng của [lowborn_criminal.GetHerHis] một cách trái tự nhiên!"
 court.0101.desc.suspicious_healer:1 "Với tư cách một thầy chữa bệnh, [lowborn_criminal.GetName] bị cáo buộc dùng ma thuật ô uế để mang cái chết đến cho người bệnh và người già tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. Tội ác của [lowborn_criminal.GetName] nhiều không đếm xuể, khiến [lowborn_criminal.GetHerHim] bị đặt cho biệt danh “Thiên Thần của [lowborn_criminal.GetFaith.DeathDeityName]”."
 court.0101.desc.devil_worshiper:0 "Từng được cho là một [lowborn_criminal.GetWomanMan] mộ đạo, [lowborn_criminal.GetName] giữ một điện thờ riêng trong nhà mình, nhưng khi kiểm tra thì phát hiện [lowborn_criminal.GetSheHe] không thờ [lowborn_criminal.GetFaith.HighGodName], mà là [lowborn_criminal.GetFaith.WitchGodName], và còn dâng những tế phẩm tà ác cho [lowborn_criminal.GetFaith.WitchGodHerHim]!"
 court.0101.desc.outro:1 "\n\n[executioner.GetName] khẳng định rằng [lowborn_criminal.GetSheHe] cũng kinh tởm kẻ tội đồ này chẳng kém gì bất kỳ ai, và hỏi ngài nên xử trí tên khốn khổ này ra sao."
 court.0101.a.cannibal:0 "Chặt cả gia đình chúng ra cho lũ chó săn."
 court.0101.a.sadistic:0 "Cho lên bánh xe tra tấn vài vòng ắt sẽ khiến chúng thẳng thắn lại."
 court.0101.a.priest.sky:0 "Hãy để lũ kền kền ăn xác [lowborn_criminal.GetHerHis]... khi còn sống."
 court.0101.a.priest:0 "Hãy đảm bảo [lowborn_criminal.GetSheHe] có một lễ chôn cất đàng hoàng... khi còn sống."
 court.0101.a.stableboy:0 "Cắt bỏ hạ thể của [lowborn_criminal.GetHerHis] rồi đem cho ngựa ăn."
 court.0101.a.kinky:0 "Cho đánh roi công khai [lowborn_criminal.GetHerHim] cho tới chết."
 court.0101.a.animals:0 "Thiêu sống [lowborn_criminal.GetHerHim] cùng gia súc của [lowborn_criminal.GetHerHis]."
 court.0101.a.baby_soup:0 "Quăng [lowborn_criminal.GetHerHim] vào một vạc hắc ín đang sôi."
 court.0101.a.suspicious_healer:0 "Cho [lowborn_criminal.GetHerHim] tự nếm thử ít “thuốc” của chính [lowborn_criminal.GetHerselfHimself]."
 court.0101.a.devil_worshiper:0 "Có lẽ lửa cháy sẽ giúp [lowborn_criminal.GetHerHim] cảm thấy gần gũi với [lowborn_criminal.GetFaith.WitchGodMistressMaster] của [lowborn_criminal.GetHerHis]."
 court.0101.a:0 "Tra tấn cho đến chết là câu trả lời duy nhất."
 court.0101.b:0 "Muốn làm gì thì làm."
 court.0101.c.deviant:1 "[lowborn_criminal.GetSheHe|U] nghe có vẻ như [lowborn_criminal.GetSheHe] biết cách tận hưởng!"
 court.0101.c.beastiality:1 "... #EMP và#! cả ngựa nữa? [lowborn_criminal.GetSheHe|U] đúng là thiên tài sáng tạo!"
 court.0101.c:0 "[lowborn_criminal.GetNameNoTooltip] biết cách vui vẻ đấy!"
 court.0101.d:0 "Nhốt hắn lại, ta sẽ quyết định sau..."

 court.0102.t:0 "Vết Nhơ Xã Hội Của Đao Phủ"
 court.0102.desc:0 "Ta thấy [executioner.Custom2('MyCharacterIntroduction', ROOT.Char)] ngồi đó với vẻ u sầu trên gương mặt [executioner.GetHerHis], và khi ta hỏi điều gì đang làm tâm trí đen tối của [executioner.GetHerHis] phiền muộn, [executioner.GetSheHe] thở dài.\n\n “Ngài thấy đấy, m'[ROOT.Char.GetLadyLord], mỗi đêm ta phải đi rất xa ra ngoài [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] mới có chỗ ngủ. Đao phủ không được phép ở trong ranh giới thành thị. Không phải là ta không thích tra tấn hay gì, chỉ là... thật cô độc khi những âm thanh duy nhất ta nghe được chỉ là tiếng la hét của kẻ bị nguyền rủa.”"
 court.0102.a:0 "Đêm nay hãy ngủ trong lâu đài đi, bằng hữu."
 court.0102.b:0 "Đó là cuộc đời khắc nghiệt, nhưng phải có kẻ sống như vậy."
 court.0102.c:0 "Ha! Ngươi cũng đáng thương chẳng hơn lũ chuột trong cống của ta!"
 court.0103.t:0 "Một Cơ Hội Từ Nấm Mồ"
 court.0103.desc.opening:1 "[executioner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] gần đây thường lọt vào mắt ta, khi [executioner.GetSheHe] ngày càng mặc những y phục đắt tiền và nghênh ngang đi lại như một con công.\n\nKhi ta tra hỏi, [executioner.GetSheHe] nhe hàm răng vàng khè cười và nói rằng [executioner.GetSheHe] đã lấy những thứ có giá trị từ bọn bị kết án."
 court.0103.desc.hair_and_teeth:0 "Việc làm ăn của [executioner.GetHerHis|U] gồm bán những lọn tóc của tù nhân cho thợ làm búp bê, bán răng cho những kẻ thiếu răng, và thậm chí bán cả nhãn cầu cho những kẻ hành nghề phù thủy."
 court.0103.desc.jewelry:0 "[executioner.GetSheHe|U] thú nhận đã lấy trộm quần áo và trang sức từ bọn bị kết án rồi đem bán, kiếm được khoản lời kha khá từ chút tài sản ít ỏi mà những kẻ trong ngục còn lại. [executioner.GetSheHe|U] thậm chí còn lấy đồ từ xác của những kẻ vừa chết!"
 court.0103.desc.meat:0 "[executioner.GetSheHe|U] đã mổ xẻ những kẻ vừa chết và đem bán từng phần thịt của họ ngoài chợ như một loại thịt lạ! [executioner.GetSheHe|U] nói rằng điều này còn tốt hơn việc tổ chức tang lễ đúng nghi thức vì bọn bị nguyền rủa không xứng đáng với nguyện vọng cuối cùng như vậy."
 court.0103.desc.saint_bones:0 "[executioner.GetSheHe|U] đã lấy bỏ nội tạng khỏi xương của những tù nhân hạ tiện rồi bán chúng như thánh tích giả, lừa gạt khách ngoại quốc và giáo sĩ mua chúng như thể đó là xương của các Thánh!"
 court.0103.desc.outro:0 "\n\nRõ ràng, [executioner.GetSheHe] đã kiếm được khoản tiền không nhỏ từ việc làm ăn này, chẳng hề bận tâm người khác nghĩ gì về nghề nghiệp thú tính của [executioner.GetHerHis]."
 court.0103.a:0 "Cho ta chia phần, ta hứa sẽ cho ngươi thêm tù nhân!"
 court.0103.b:0 "Thứ buôn bán ghê tởm này phải chấm dứt ngay!"
 court.0103.c:0 "Ta sẽ giả vờ như chưa từng nghe chuyện này."

 court.0104.t:0 "Một Sự Ám Ảnh Bệnh Hoạn"
 court.0104.desc:0 "“Ô! Ô! Rồi sau đó ngươi làm gì?” Ta nghe giọng vui tươi của đứa học trò thân yêu của ta, [morbid_child.GetName], vang khắp đại sảnh của [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. Ta kinh ngạc khi thấy [morbid_child.GetHerHim] ngước nhìn [executioner.Custom2('MyCharacterIntroduction', ROOT.Char)] với một sự ngưỡng mộ hồn nhiên mà ta chưa từng thấy ở [morbid_child.Custom('GirlBoy')]. “Ta châm lửa lên và con chuột bắt đầu đào thẳng vào ngực hắn để trốn! Tuyệt hảo, hắn kêu như chim sơn ca vậy!” Tên đao phủ cất tiếng rít chế nhạo, khiến [morbid_child.Custom('PetName')] của ta, [morbid_child.GetName], cười thích thú."
 court.0104.a:0 "Thật buồn cười! Rồi sau đó thế nào?"
 court.0104.b:0 "Sự mê đắm u ám này phải chấm dứt!"
 court.0104.c:0 "Ta sẽ giả vờ như chưa nghe thấy gì."

 court.0106.t:0 "Sân Khấu Đen Tối Cho Những Hành Vi Đen Tối"
 court.0106.desc:0 "Chạng vạng tại triều đình, tên đao phủ đã rũ rượi bước ra từ nơi ở buồn tẻ [executioner.GetHerHis] của ngài và xuất hiện dưới ánh đèn của những lò sưởi triều đình, máu tươi nhuộm đỏ trang phục rách rưới [executioner.GetHerHis] của ngài và một cặp kìm bẩn thỉu đang nhỏ giọt trong tay. \"M'[ROOT.Char.GetLadyLord], dạo gần đây, ta đã suy nghĩ. Ta có thể đi xa đến đâu khi khiến họ thét lên?\""
 court.0106.a:0 "Miễn là lấy được lời thú tội."
 court.0106.b:0 "Hãy nhẹ tay với những linh hồn khốn khổ ấy."
 court.0106.c:0 "Ngươi làm gì trong nơi ghê tởm đó là việc của ngươi."

 court.0107.t:1 "[unruly_child.GetNameNoTooltip] Trong Tuyệt Vọng"
 court.0107.desc:1 "Từ ngai vàng, ta nghe thấy tiếng kêu xé lòng của [unruly_child.Custom2('MyCharacterIntroduction', ROOT.Char)] và âm thanh của một cuộc đấu tranh. Ngay lập tức bật dậy và lao xuống hành lang, ta trượt đến dừng lại khi thấy [tutor.Custom2('MyCharacterIntroduction', ROOT.Char)] đang kiềm chế đứa trẻ đáng thương [unruly_child.Custom('GetLassLad')] bằng một tay và vụng về ôm chặt cuốn sách bằng tay kia.\n\nTa hầu như không có thời gian để hét lên yêu cầu giải thích khi cả hai bắt đầu tuôn ra phiên bản sự kiện của họ.\n\n\"[unruly_child.GetTitledFirstNameNoTooltip] từ chối cho phép tôi đọc cho [unruly_child.GetHerHim] nghe kiệt tác của tôi về nghệ thuật [tutor.Custom('GetTutorEducation')]!\" người gia sư khóc lóc.\n\n\"Tôi đã nghe cuốn sách buồn tẻ này hàng ngàn lần rồi!\" [unruly_child.GetNameNoTooltip] phản đối. \"Nó quá #EMP nhàm chán!#!\""
 court.0107.a:1 "[unruly_child.GetNameNoTooltip], hãy tin rằng [tutor.GetNameNoTooltip] biết điều gì là tốt nhất."
 court.0107.a.tt.1: "Có cơ hội việc giáo dục của [unruly_child.GetShortUINamePossessiveNoTooltip] sẽ cải thiện"
 court.0107.a.tt.2: "[tutor.GetShortUINameNoTooltip] sẽ làm việc chăm chỉ hơn với tư cách [GetCourtPositionType('court_tutor_court_position').GetName()]"
 court.0107.b:1 "Quyển sách này nghe thật hấp dẫn; có lẽ ta có thể mua nó từ ngươi?"
 court_position_liege_support: "Sự Ủng Hộ Của Lãnh Chúa"
 court.0107.b.tt:0 "Ngươi nhận được một Thánh Vật Sách"
 court.0107.c:1 "Có lẽ [unruly_child.Custom('GetLassLad')] nên học thứ gì khác..."
 buy_book_artifact:0 "Ngươi nhận được một [court_artifact|E] Sách"

 court.0108.t:0 "Một Cận Thần Phi Thường"
 court.0108.desc:1 "Tự nhận là người lưu vong từ một vùng đất xa xôi, [foreign_prince.Custom('GetPrincessPrince')] [foreign_prince.GetName] đã xuất hiện tại triều đình cùng với vô số động vật ngoại lai và đã thực hiện những công việc từ thiện đáng kinh ngạc trên khắp các đường phố [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip].\n\nNgười ngoại quốc giàu có hào phóng này đã tuyên bố ý định [foreign_prince.GetHerHis] của ngài là kết hôn với [available_child.Custom2('MyCharacterIntroduction', ROOT.Char)]!\n\nTrong khi triều đình đang xôn xao với sự nhiệt tình dành cho [foreign_prince.Custom('GetPrincessPrince')] ngoại lai này, không phải ai cũng bị thuyết phục. [sceptical_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tuyên bố chưa bao giờ nghe nói về vùng đất xa xôi mà người ngoại quốc tuyên bố đến từ đó và không thể tìm thấy nó trên bất kỳ bản đồ nào.\n\n[sceptical_courtier.GetSheHe|U], cùng với một vài người khác có cùng tư tưởng, đã tố cáo [foreign_prince.Custom('GetPrincessPrince')] [foreign_prince.GetName] là kẻ lừa đảo và khẳng định rằng chúng ta phải trừng phạt [foreign_prince.GetHerHim] vì đã cố gắng đánh lừa [available_child.GetName] kết hôn với một #EMP kẻ hèn mọn#!."
 court.0108.a:1 "Đừng phá hỏng niềm vui, [sceptical_courtier.GetNameNoTooltip]. Họ sẽ thành hôn vào sáng mai!"
 court.0108.b:1 "[sceptical_courtier.GetNameNoTooltip] nói đúng! Tống [foreign_prince.GetHerHim] vào ngục!"
 court.0108.c:1 "Cảm ơn chuyến viếng thăm, [foreign_prince.Custom('GetPrincessPrince')] [foreign_prince.GetFirstNameNoTooltip], nhưng ngươi nên rời đi."

 court.0109.t:0 "Một Bậc Thông Thạo Giải Phẫu"
 court.0109.desc:1 "Khi ta đi dạo quanh triều đình, ta nghe thấy [executioner.Custom2('MyCharacterIntroduction', ROOT.Char)] trò chuyện với [learned_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] về bản chất của chữa bệnh và y thuật. [executioner.GetSheHe|U] dường như hiểu rõ đáng kinh ngạc về cấu tạo cơ thể con người.\n\n"Ngươi không thể dành cả ngày mổ xẻ con người mà không học được đôi điều về cách vận hành của tạo vật do chính [executioner.GetFaith.HighGodNamePossessive] tạo nên." [executioner.GetSheHe|U] nói sau khi mô tả cách dùng đỉa để hút độc khỏi vết thương nhiễm trùng.\n\nCó vẻ như [executioner.GetNameNoTooltip] đã dùng hiểu biết giải phẫu của [executioner.GetHerHis] để giúp dân địa phương tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] và cả những kẻ hạ tiện trong ngục của ta."
 court.0109.a:0 "Ngươi phí phạm khi làm đao phủ! Hãy làm ngự y cho ta!"
 court.0109.b:0 "Đừng lãng phí thời gian chữa trị cho lũ hạ tiện đó!"
 court.0109.c:0 "Thật thú vị, có lẽ ngươi có thể dạy ta vài phương pháp của mình."
 court.0109.d:0 "Làm tốt lắm! Hãy tiếp tục phục vụ người bệnh và kẻ khốn khó của [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."

 court.0110.t:0 "Một Bài Răn Về Dục Vọng"
 court.0110.desc.intro:0 "Ta đang sải bước quanh triều đình, hài lòng sau một đêm nữa tràn đầy dục vọng và đam mê thì bỗng bị [parent.Custom2('MyCharacterIntroduction', ROOT.Char)] và [chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)] chặn lại! Cả hai nhìn ta với ánh mắt pha trộn giữa ghê tởm, dò xét, và lo lắng.\n"Chuyện này là thế nào?" ta gằn giọng hỏi.\n\n"
 court.0110.desc.deviant:1 ""Ôi [ROOT.Char.Custom('GetDaughterSon')] của ta, ta vô cùng lo lắng cho linh hồn của con. Mỗi đêm con dấn thân vào những hành vi thú tính khiến cả [ROOT.Char.GetFaith.FertilityGodName] cũng phải quay mặt đi vì ghê tởm.""
 court.0110.desc.pox:0 ""Ngươi giữ tình nhân còn nhiều hơn chó hoang giữ bọ chét. Ta e rằng bệnh hoa liễu sẽ không phải thứ duy nhất vấy bẩn thân thể ngươi khi cơn dục của ngươi được thỏa mãn.""
 court.0110.desc.notspecial:0 ""Thân thể ngươi là một ngôi đền, vậy mà ngươi lại đối xử với nó như một nhà chứa! Liệu có bao giờ đủ tình nhân để lấp đầy cái hố nơi linh hồn ngươi đáng lẽ phải tồn tại không?""
 court.0110.desc.outro:0 "[parent.GetMotherFather] của ta quở trách ta không chút khoan dung.\n\n"Mỗi đêm ngươi mải mê tận hưởng những khoái lạc trần thế này, ngươi lại tiến thêm một bước gần hơn tới [ROOT.Char.GetFaith.NegativeAfterLife]!" [chaplain.GetNameNoTooltip] nói thêm. "Chúng ta đối mặt với ngươi hôm nay là để cứu rỗi linh hồn ngươi, đứa trẻ đáng thương. Ngươi phải thề sống độc thân; chỉ có điều đó, và không gì kém hơn, mới có thể cứu linh hồn ngươi khỏi cõi tra tấn vĩnh hằng.""
 court.0110.a:0 "Thật hỗn xược! Tống chúng vào ngục!"
 court.0110.b:0 "Các ngươi nói đúng, ta lo sợ cho linh hồn bất tử của mình."
 court.0110.c:0 "Ta sẽ không bị giam cầm trong xiềng xích dục vọng!"

 court.0111.t:0 "Thánh Vật Của Sự Báo Thù"
 court.0111.desc:1 "Khi ta dạo quanh triều đình, ta bắt gặp một cuộc tranh cãi gay gắt giữa [executioner.Custom2('MyCharacterIntroduction', ROOT.Char)] và [antiquarian.Custom2('MyCharacterIntroduction', ROOT.Char)] về việc liệu chiếc sọ của [rival.Custom2('MyCharacterIntroduction', ROOT.Char)] có thể trở thành một bảo vật xứng đáng cho triều đình của ta hay không.\n\n"À, m'[ROOT.Char.GetLadyLord], ta định sẽ dâng ngài chiếc sọ của [rival.GetTitledFirstNameNoTooltip] làm quà, nếu [rival.GetSheHe] gặp phải cái chết bất ngờ." [executioner.GetName] chà hai bàn tay dính máu của [executioner.GetHerHis] vào nhau với vẻ hớn hở như trẻ con. "Hoặc có lẽ ghép răng của [rival.GetHerHis] lại thành một chiếc vòng cổ thật phong cách!"\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] hẳn không định để ta phải ngụy trang một vật ghê rợn như thế thành thánh vật xứng đáng với triều đình chứ!" [antiquarian.GetTitledFirstNameNoTooltip] phản đối. "Có lẽ sinh vật này nên ở lại trong ngục tối nơi [executioner.GetSheHe] thuộc về, và để chuyện thánh vật cùng cổ vật cho những kẻ am hiểu xử lý.""
 court.0111.a:0 "Chiếc sọ của [rival.GetHerHis|U] sẽ là thứ thú vị để phô bày trong yến tiệc!"
 court.0111.b:0 "Ý tưởng ghê tởm tột cùng."
 get_skull_artifact:0 "Ngươi nhận được một [court_artifact|E] Sọ"

 court.0112.t:0 "Xác Chết Trong Tủ Áo"
 court.0112.desc:1 "Ta bước sâu vào tủ y phục lộng lẫy của mình, tò mò xem những tấm vải tuyệt mỹ nào còn nằm ở phía sau. Ta phát hiện một chiếc túi vải tartan nặng hơn hẳn những túi khác, và khi rạch nó ra, ta ngã ngửa ra sau khi mùi hôi thối nồng nặc của một xác chết mục rữa xộc thẳng vào mũi.\n\nThi thể của một kẻ lạ mặt, đã phân hủy một phần, khô xác, và nằm trong vũng dịch của chính [corpse.GetHerHis], chậm rãi lộ ra trước mắt ta.\n\nTa thét lên như một đứa trẻ, và như thể được tiếng kêu của ta triệu tới, [guilty_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] xuất hiện nơi khung cửa, vẻ tội lỗi và ghê sợ hiện rõ trên gương mặt [guilty_courtier.GetHerHis].\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] xin ngài phải tin thần khi thần nói rằng thần chỉ tự vệ! [corpse.GetSheHe|U] đã đột nhập vào phòng của ngài và nếu thần không ra tay, [corpse.GetName] đã giết thần hoặc chỉ có [guilty_courtier.GetFaith.HighGodName] mới biết chuyện gì nữa sẽ xảy ra!"\n\n[guilty_courtier.GetNameNoTooltip] rõ ràng đau khổ đến mức [guilty_courtier.GetSheHe] lập tức thú nhận với ta mà không cần ta chất vấn. "Thần cầu xin ngài, hãy làm như không thấy chuyện này và thần sẽ may cho ngài một bộ y phục khiến ngay cả [ROOT.Char.GetTitleAsNameNoTooltip] giàu có nhất cũng phải tái mặt!""
 court.0112.a:0 "Xanh như cái xác này sao? Một thỏa thuận tốt."
 court.0112.a.tt:0 "Ngươi nhận được một Thánh Vật Regalia"
 court.0112.b:0 "Chẳng bao lâu nữa toàn bộ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] sẽ biết ngươi đã làm gì!"
 court.0112.c:0 "Chúng ta hãy coi như chưa từng có chuyện này."
 get_regalia_artifact:0 "Ngươi nhận được một [artifact|E] Regalia"
