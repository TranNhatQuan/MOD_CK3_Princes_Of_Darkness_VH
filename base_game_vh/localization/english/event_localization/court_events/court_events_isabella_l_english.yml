l_english:

 ##### A diplomat bleeds to death in your throne room by Isabella Welch
 
 court.4001.t:0 "Một Vết Thương Ngoài Da"
 court.4001.desc:0 "Một vũng máu đang đông lại dưới chân [bleeding_diplomat.GetName], một nhà ngoại giao được gửi đến bởi đồng minh của ta, [bleeding_diplomat_liege.GetName]. Nhìn vào lượng máu khổng lồ đã thấm vào tấm thảm tinh xảo của ta, ta chỉ có thể đoán rằng [bleeding_diplomat.GetSheHe] đã chảy máu tại chỗ này suốt nhiều giờ, nếu không muốn nói là lâu hơn.\n\n"Xin thứ lỗi cho sự bừa bộn này. Tôi đã bị ném qua cửa sổ bởi một tên lùn cố cướp tôi tại một quán trọ trên đường tới [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. Tuy nhiên, vì tên vô lại đó đã đỡ cú ngã của tôi, chuyến thăm ngoại giao vẫn có thể tiếp tục — vẫn còn #EMP days#! cho đến khi việc mất máu của tôi trở nên chí mạng!""
 court.4001.a:0 "Lính đâu, ép [bleeding_diplomat.GetWomanMan] này đi gặp ngự y."
 court.4001.b:0 "Lịch của ta chỉ còn chỗ vào tuần sau — ngươi có thể cầm cự được không?"
 court.4001.c:0 "Chúng ta có thể nói chuyện ngay bây giờ, nhưng lãnh chúa của ngươi phải trả tiền cho tấm thảm của ta."
 court.4001.carpet:0 "Ngươi phải làm sạch tấm thảm của mình"
 court.4001.new_carpet:0 "[bleeding_diplomat.GetSheHe|U] sẽ còn chảy máu nhiều hơn — ngươi sẽ phải mua một tấm thảm mới."
 court.4001.toast:0 "[bleeding_diplomat.GetName] chết"
 court.4001.toast_desc:0 "[bleeding_diplomat.GetName] đã chảy máu đến chết trên tấm thảm xa hoa của ngươi."
 court.4001.cure_toast:0 "Ngự y chữa khỏi nhà ngoại giao"

##### All-male-choirs by Isabella Welch

 court.4100.t:0 "Các Tiểu Đồng của [GetPlayer.Custom( 'KnightCulturePluralNoTooltip' )]"
 court.4100.desc:0 "Nhạc công cung đình của ta tiến đến gần, gần như nhảy chân sáo theo một nhịp điệu chỉ mình [court_musician.GetSheHe] nghe thấy.\n\n"Xin một chút chú ý của ngài, [ROOT.Char.Custom('FormOfAddressForLiege')]. Ta đã chuẩn bị một dàn hợp xướng toàn nam không gì sánh bằng! Theo phương pháp mới của ta, họ không chỉ hát, mà còn mặc quần bó, đeo những bao hạ bộ trang trí cầu kỳ trên phần hạ thể lấp lánh của mình, và nhảy múa theo nhịp một cách đồng bộ! Tất cả trong khi ca ngợi [ROOT.GetCharacter.GetFaith.HighGodName], dĩ nhiên. Ta chắc chắn rằng nếu ngài tài trợ cho một buổi biểu diễn lớn, điều đó sẽ khiến các quý bà trong triều vô cùng hài lòng.""
 court.4100.a:0 "Ta buồn nôn quá! Tống tên lệch lạc này vào ngục!"
 court.4100.b:0 "Ta chắc mấy chiếc quần bó đó quá sức chịu đựng của các quý bà."
 court.4100.c:0 "Ngươi có tiền của ta, ta nóng lòng chờ đợi buổi biểu diễn!"

##### My Spire is Bigger than Yours! by Isabella Welch #####

 court.4250.t:0 "Tháp của Ta Cao Hơn Tháp của Ngươi!"
 court.4250.desc:1 ""Lũ cận thần rên rỉ của [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]," [tower_challenger_rival.GetTitledFirstName] xông thẳng lên phía trước phòng ngai vàng của ta.\n\n"Trong khi [ROOT.Char.GetTitledFirstNameNoTooltip] lăn lộn dưới đất như con lợn trong bùn, ta đã dựng nên tòa tháp cao nhất mà vùng đất khốn khổ này từng thấy tại [tower_challenger_rival.GetCapitalLocation.GetTitle.GetNameNoTier]. Từ [tower_challenger_rival.Custom('FortifiedBuilding')] của ta, giờ đây ta gần như có thể với tay hái các hành tinh trên trời. Còn các vì sao của ngươi ở đâu, [ROOT.Char.GetTitledFirstNameNoTooltip]?"\n\n[concerned_steward.GetCouncilTitle|l] của ta, [concerned_steward.GetTitledFirstName], đặt một bàn tay thận trọng lên vai ta. "[ROOT.Char.Custom('FormOfAddressForLiege')|U], tòa tháp của [tower_challenger_rival.GetTitledFirstNamePossessiveNoTooltip] cao bốn trăm foot chỉ làm từ đất sét và hồ dán, hoàn toàn không vững chắc. Hãy phớt lờ lời khiêu khích của [tower_challenger_rival.GetHerHis] và chờ nó sụp đổ!"" 
 court.4250.a:0 "Cút đi và nhét cây kim trời của ngươi vào cái mông cao quý của ngươi!"
 court.4250.b:0 "Chúng ta sẽ kéo dài tháp của mình cao hơn tháp của ngươi đúng một foot!"
 court.4250.c:0 "Ta yêu cầu xây một tòa tháp cao hơn #EMP one hundred feet #! nữa!"
 court.4250.b.tt:0 "Ngươi sẽ gắn một cột cờ rất dài lên [THIS.GetCharacter.Custom('FortifiedBuilding')] của mình"
 court.4250.c.success.tt:0 "Ngươi xây dựng một tòa tháp khổng lồ"
 court.4250.c.failure.tt:0 "Tòa tháp của ngươi sụp đổ trong quá trình xây dựng"
 court.4250.c.failure_toast_title:0 "Tòa tháp [ROOT.Char.Custom('FortifiedBuilding')] của ngươi sụp đổ!"
 court.4250.c.accident.tt:0 "Một tai nạn khủng khiếp xảy ra"
 court.4250.c.accident.tt.flavour:0 "Ai mà biết điều gì có thể xảy ra..."

### Spires part 2

 court.4251.desc:0 "Khi nghe tin rằng tòa tháp vươn cao của ta cuối cùng đã hoàn thành, ta mời toàn bộ triều đình ra ngoài để chiêm ngưỡng. Tòa tháp xé toạc bầu trời, nhưng cũng lắc lư trong gió."
 court.4251.desc_child_accident:0 "\n\nTừ giữa đám đông cận thần đang há hốc mồm, đứa con của ta [crushed_child.GetName] bắt đầu bò về phía chân của công trình vĩ đại với sự tò mò, mắt mở to nhìn lên.\n\n[crushed_child.GetNameNoTooltip] thậm chí không kịp hét lên khi đỉnh tháp gãy rời, rơi xuống và biến [crushed_child.GetHerHim] thành một vũng thịt nát."
 court.4251.desc_rival_accident:0 "\n\nTa mời [tower_challenger_rival.GetTitledFirstNameNoTooltip] cùng leo lên với ta. [tower_challenger_rival.GetSheHe|U] nghẹt thở trước quang cảnh — hoặc có lẽ vì cầu thang. Khi chúng ta lên tới đỉnh và ta vẫy tay với các cận thần phía dưới, [tower_challenger_rival.GetSheHe] dựa vào lan can, và nó lập tức gãy ra, khiến [tower_challenger_rival.GetHerHim] rơi thẳng xuống thiên đường."
 court.4251.desc_success:0 "\n\nCác cận thần đang há hốc của ta đáp lại tòa tháp bằng một tràng vỗ tay ầm ĩ, nhưng vì lý do nào đó tất cả đều tránh đứng dưới bóng của nó.\n\n[tower_challenger_rival.GetTitledFirstNameNoTooltip] thì thầm với ta "Đồ chó, ta thề ta sẽ quay lại với một tòa tháp cao #EMP twice #! như thế này.""
 court.4251.a:0 "Ôi [crushed_child.GetNameNoTooltip], con ngọt ngào như bánh kếp!"
 court.4251.b:0 "Cuối cùng ngươi cũng bay được rồi, [tower_challenger_rival.GetTitledFirstNameNoTooltip]."
 court.4251.c:0 "Giờ ai mới là kẻ lăn lộn trong bùn, [tower_challenger_rival.GetTitledFirstNameNoTooltip]?"

### Crusades Preaching Tours by Isabella Welch

 court.4300.t:0 "Quantum Praedecessores"
 court.4300.preaching_tour_bernard_of_clairvaux_intro:0 "Bernard of Clairvaux đang dừng chân tại đây trong chuyến hành trình giảng đạo khắp lục địa của [right_portrait_character.GetHerHis] nhằm thổi bùng ngọn lửa cho cuộc thánh chiến đang diễn ra. [bishop.GetCouncilTitle] của ta cho biết [right_portrait_character.GetSheHe] giữ vai trò trung tâm trong việc soạn thảo giáo lý cho Dòng Hiệp Sĩ Thánh đầu tiên — Hiệp Sĩ Đền Thánh.\n\n"
 court.4300.preaching_tour_bernard_of_clairvaux_theology:0 ""Ta vô cùng vui mừng khi được ở cạnh một người khác nổi tiếng vì sự am hiểu thần học của [ROOT.Char.GetHerHis]. Ta đang viết một luận thuyết mới về các dòng hiệp sĩ quân sự của chúng ta: 'In Praise of the New Knighthood'. Nếu ngài xem qua nó, ta sẽ gửi lời tới [ghw_sponsor.GetTitledFirstName] rằng [ghw_sponsor.GetSheHe] nên ban hành một sắc chỉ ủng hộ dòng hiệp sĩ của chính ngài.""
 court.4300.preaching_tour_bernard_of_clairvaux_flea_excommunication:0 ""Ta cảm tạ lòng hiếu khách của ngài. Để đáp lại lòng tốt đó, ta nhận thấy vài cận thần của ngài đang gãi những vết cắn chi chít. Ta từng rút phép thông công một đàn ruồi hàng nghìn con khiến chúng chết ngay lập tức. Có vẻ như ngài đang có vài con bọ chét thối tha cần bị giáo hội trừng phạt!""
 court.4300.preaching_tour_bernard_of_clairvaux_standard:0 ""Ta có một yêu cầu nghiêm trọng. Trong khi [ROOT.GetCharacter.GetFaith.HighGodName] ban phước cho trí tuệ của ta, [ROOT.GetCharacter.GetFaith.HighGodNameSheHe] lại không ban phước cho ruột của ta. Với tình trạng hiện tại của ta, ta không thể giảng đạo nếu không có một hố xí được đào ngay bên dưới. Có ai sẵn sàng theo chuyến hành trình của ta với vai trò người đào hố vì Chúa không?""
 court.4300.preaching_tour_default:0 "Một linh mục đã chặn lối vào phòng ngai vàng của ngươi, phát những huy hiệu đỏ hình thánh giá cho những ai đi vào để gắn lên quần áo của họ.\n\n"Tạ ơn [ROOT.GetCharacter.GetFaith.HighGodName]! Ta đang trong chuyến giảng đạo qua các vương quốc của những đồng minh đã thề tham gia cuộc thánh chiến, giảng bài nhằm tăng cường tuyển mộ và quyên góp.""
 court.4300.a:0 ""Ngài có cây bút và thanh kiếm của ta!""
 court.4300.b:0 ""Hãy rút phép thông công lũ côn trùng phản loạn này!""
 court.4300.c:0 ""Ta chắc chắn [possible_latrine_digger.GetTitledFirstNameNoTooltip] đang rất muốn giúp!""
 court.4300.d:0 ""Kho bạc của ta rộng mở như bầu trời!""
 court.4300.e:0 ""Ngài sẽ có một đội cận vệ riêng của ta hộ tống trong nhiệm vụ.""
 court.4300.e.tt:0 "[bernard_guard_1.GetTitledFirstName] và [bernard_guard_2.GetTitledFirstName] sẽ hộ tống [right_portrait_character.GetTitledFirstName] khắp lãnh địa của ngươi."
 court.4300.f:0 "Không xứng để nói chuyện với một [right_portrait_character.GetWomanMan] như vậy, ta im lặng quỳ gối."
 court.4300.g:0 "Huy hiệu thánh giá của [right_portrait_character.GetHerHis|U] trông khá rẻ tiền, phải không?"
 court.4300.a.tt:0 "Chi phí [piety|E] và [gold|E] để thành lập một Dòng Hiệp Sĩ Thánh giảm mạnh"

## Our Caravans are being attacked by Christian Nobles by Isabella Welch
 court.4350.t:0 "Nghệ Tây Trong Lửa"
 court.4350.desc:0 "[concerned_marshal.GetCouncilTitle] của ta vừa nói chuyện xong với hai thương nhân cháy sém lết vào phòng ngai vàng của ta. "Một chuỗi đoàn lữ hành thương mại của chúng ta chở nghệ tây từ [caravan_attacker_liege.GetCapitalLocation.GetTitle.GetNameNoTier] đến [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] đã bị tấn công. Những kẻ đó không phải cướp, mà là một nhóm quý tộc Cơ Đốc có đất đai cưỡi ngựa mặc giáp tấm hoàn chỉnh."\n\n[concerned_marshal.GetSheHe|U] thở dài. "Những kẻ ngu ngốc hoài niệm việc tàn sát dân ta đang cố khiêu khích chúng ta gây chiến ngay dưới mũi lãnh chúa của chúng. Nếu chúng ta trả đũa, chúng ta có nguy cơ làm tổn hại các thỏa thuận với [caravan_attacker_liege.GetName] về việc nhập khẩu hàng xa xỉ mà các cận thần của ta rất yêu thích.""
 court.4350.a:0 "Khó mà bỏ qua sự ngu xuẩn này, nhưng thương mại vẫn là trên hết."
 court.4350.b:0 "Hãy tiến hành vài cuộc cướp bóc của riêng chúng ta!"
 court.4350.c:0 "Chúng ta sẽ xem lũ trẻ con đó khóc thế nào khi ta ngừng buôn đường!"
 court.4350.c.tt:0 "#F Ngươi chấm dứt giao thương với [caravan_attacker_liege.GetNameNoTooltip]#!"

## Our Nobles are attacking Islamic Caravans by Isabella Welch

 court.4355.t:0 "Ai Dám Chiến Đấu Với Saracen?"
 court.4355.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]," [reporting_marshal.GetCouncilTitle] của ta gọi, "Ta nghe thấy [caravan_attacker.GetTitledFirstName] khoe khoang rằng [caravan_attacker.GetSheHe] cùng một đám quý tộc đã đi ra như lũ cướp thường dân và cướp phá các đoàn lữ hành chở đường từ [attacked_liege.GetCapitalLocation.GetTitle.GetNameNoTier]. Lũ chó này khát khao thánh chiến và đang cố khiêu khích [attacked_liege.GetTitledFirstName]. Tuy nhiên, ta cho rằng chúng ta cần thương mại hơn bất kỳ trận chiến nào—"\n\n"Chúng ta không cần thức ăn, chỉ cần uống máu của kẻ ngoại đạo!" [caravan_attacker.GetTitledFirstNameNoTooltip] gầm lên từ bên kia phòng ngai vàng."
 court.4355.a:0 "Làm tốt lắm! Cướp bóc kẻ vô đạo là hành động thiêng liêng!"
 court.4355.a.tt:0 "Ngươi sắp xếp thêm các cuộc cướp thương mại"
 court.4355.b:0 "Lính đâu! Đánh [caravan_attacker.GetHerHim] bằng bát đường cho tới khi [caravan_attacker.GetSheHe] hối cải."
 court.4355.c:0 "Ta cảm thấy [caravan_attacker.GetSheHe] sẽ tiếp tục cướp bóc bất kể lệnh của ta."
 court.4355.c.tt:0 "#F [caravan_attacker.GetSheHe|U] sẽ#!"

# Monks/Holy men chasing the decapitated head of their target of worship by Isabella Welch
# better title please
 court.4400.t:0 "Đuổi Theo Cái Đầu"
 court.4400.desc:0 "Một đàn [head_chasing_monk.GetWomenMen] khoác áo choàng xông vào phòng ngai vàng của ta, cuống cuồng tìm kiếm trên sàn và lật tung mọi thứ từ ghế đến váy áo trong cơn hoảng loạn.\n\n"[ROOT.Char.GetTitledFirstNameNoTooltip]!" một người kêu lên, "chúng ta là tín đồ của [the_headless.GetTitledFirstNameNoTooltip] Kẻ Vô Đầu, một [the_headless.GetWomanMan] thánh thiện vĩ đại đã bị chặt đầu như một phần của lời tiên tri mà [ROOT.GetCharacter.GetFaith.HighGodName] ban cho [the_headless.GetHerHim] khi sinh ra. Như thường xảy ra với các nhân vật thánh, cái đầu của [the_headless.GetHerHis] bắt đầu lăn đi. Chúng ta đã đuổi theo nó khắp vùng đất và #EMP chắc chắn#! rằng nó đã lăn lên gò đất vào [ROOT.GetCharacter.Custom('FortifiedBuilding')] của ngài!""
 court.4400.a:0 "Ngươi được phép tìm kiếm trong [ROOT.GetCharacter.Custom('FortifiedBuilding')]."
 court.4400.b:0 "Hãy để ta tham gia cuộc tìm kiếm của các ngươi!"
 court.4400.c:0 "Ta sẽ không cho phép một giáo phái lục lọi triều đình của ta!"
 court.4400.b.discovery:0 "Ngươi tìm thấy một cổ vật bị lãng quên từ lâu trong [THIS.GetCharacter.Custom('FortifiedBuilding')] của mình"
 court.4400.b.failure:0 "Đám cuồng tín gây ra một mớ hỗn độn"
 court.4400.b.severed_head:0 "Cái đầu bị chặt đã được tìm thấy!"
 court.4400.c.backdown:0 "Giáo phái bị đe dọa"
 court.4400.c.refusal:0 "Giáo phái sẽ quay lại"

#Rummaging through the castle
  court.4401.desc:0 "Tầng hầm của [ROOT.GetCharacter.Custom('FortifiedBuilding')] của ta chứa nhiều món linh tinh vô dụng hơn ta muốn thừa nhận."
  court.4401.desc_arbitrary:0 "Ta khoe với [head_chasing_monk.GetName] về kế hoạch an ninh thiên tài của ta — nếu ngoài ta ra không ai hiểu các đống đồ được sắp xếp thế nào, thì sẽ không kẻ nào cướp được của ta!"
  court.4401.desc_default:0 "Mỗi lần [head_chasing_monk.GetName] mở một cánh cửa mới, ta lại nghĩ [head_chasing_monk.GetHerHim] sẽ bị đè bẹp dưới một đống đồ kỳ quái. Ta thậm chí đã quên mất cả [ROOT.Char.Custom('RandomPrivateObject')] của mình ở dưới này!"
  court.4401.desc_object:0 "\n\nSau một hồi lục lọi khá vui vẻ, chúng ta không tìm thấy cái đầu, nhưng [head_chasing_monk.GetName] dường như bị mê hoặc bởi mọi thứ. Nhìn cách [head_chasing_monk.GetSheHe] cẩn thận xem xét một [ROOT.Char.Custom('RandomWeirdObject')] bị bỏ lại, có lẽ [head_chasing_monk.GetSheHe] sẽ trở thành một nhà sưu tầm cổ vật khá giá trị."
  court.4401.desc_head:0 "\n\nCó lẽ bị dẫn đường bởi mùi hôi thối, [head_chasing_monk.GetSheHe] lôi ra một cái đầu người từ giữa đống rác như con lợn đào nấm truffle.\n\nTuy nhiên, việc tầng hầm nằm gần ngục tối khiến ta nghi đó chỉ là một linh hồn tội nghiệp bị lãng quên từ phòng tra tấn của ta."
  court.4401.a:0 "À, đúng rồi! Ahem. Đó là [the_headless.GetTitledFirstNameNoTooltip]! Tạ ơn [ROOT.GetCharacter.GetFaith.HighGodName]... và đại loại vậy."
  court.4401.b:0 "Nhìn vết cắt gọn gàng kia xem! Rõ ràng là tác phẩm của ta."
  court.4401.c:0 ""Ngươi có muốn kiếm sống bằng việc bới rác của ta không?""
  court.4401.d:0 "Chỗ này hơi nhếch nhác — ta nên ra lệnh dọn dẹp."

## Being threatened by the cultist

  court.4402.desc:0 "Một đêm ta chợt tỉnh giấc và nhận ra có kẻ đang cưỡi lên người mình. Đây không phải giấc mơ khoái lạc — tên tu sĩ điên đã đột nhập vào phòng ngai vàng của ta đang kề dao mổ vào cổ ta!\n\n"Nếu ngài cấm chúng ta tìm cái đầu ấy, thì chúng ta sẽ lấy đầu của ngài vậy. Tròn trịa và bóng bẩy thế kia, ta cá nó sẽ lăn rất đẹp!""
  court.4402.a:0 "Sao chúng ta không đi tìm nó ngay bây giờ?"
  court.4402.a.tt:0 "Ngươi đưa [head_chasing_monk.GetHerHim] xuống tầng hầm"
  court.4402.b:0 "Chúng ta chưa từng thấy cái đầu nào! Để ta yên!"
  court.4402.b.success:0 "Ngươi vật ngã tên tu sĩ và tống [head_chasing_monk.GetHerHim] vào ngục"
  court.4202.b.success.tt:0 "Ngươi tống [head_chasing_monk.GetName] vào ngục"
  court.4402.b.failure:0 "Ngươi bị thương hoặc bị giết"
  court.4402.c:0 "Ta cá ngươi không thể chặt đầu ta bằng cái thứ bé tí đó!"
  court.4402.c2.tt:0 "Ngươi bị chặt đầu một phần"
  court.4402.c3.tt:0 "Ngươi bị chặt đầu hoàn toàn"


## A series of questionable artifacts are up for sale by Isabella Welch
  court.4500.t:0 "Xương ngón tay của một [ROOT.Char.GetTitleAsNameNoTooltip]"
  court.4500.desc:0 "Một người bán rong khoác áo choàng gắn đầy đồ trang sức và vật linh tinh lạch cạch tiến đến trước mặt ta.\n\n"
  court.4500.bleeder:0 ""Ta chế tạo cổ vật để lừa những kẻ giàu ngu ngốc mất vàng. Ta nghe nói ngài có dư máu trong người. Chắc hẳn sẽ có kẻ hâm mộ rất vui lòng mua một chiếc trâm cài có viên cầu thủy tinh chứa một giọt máu của ngài."\n\n[artifact_peddler.GetSheHe|U] nhìn chằm chằm vào mạch máu trên cổ ta. "Ta sẽ trả hậu hĩnh, và vài kẻ ngốc sẽ cảm thấy mình chạm được chút uy nghi vương giả.""
  court.4500.psalter:0 ""Ta có một quyển Thánh Thi tuyệt mỹ — bản thảo minh họa với bìa ngà voi chạm khắc và đính hạt ngọc lam. Nó kể những câu chuyện tình giữa [ROOT.GetCharacter.GetWomanMan] và [cheating_character.GetWomanMan]. Những chạm khắc này chắc chắn sẽ khiến [cheating_character.GetTitledFirstNameNoTooltip] cảm động, khiến [cheating_character.GetSheHe] không bao giờ nghĩ đến việc nằm với kẻ khác nữa!""
  court.4500.chastity_belt:0 ""Cả vương quốc đều biết ngươi bị những ham muốn điên cuồng dày vò mạnh như kỵ binh phóng từ máy bắn đá. Ta có một cổ vật có thể làm nhẹ gánh cho ngươi."\n\n[artifact_peddler.GetSheHe|U] lôi ra một chiếc đai trinh tiết gắn đầy gai sắt gỉ.""
  court.4500.holy_needle:0 ""Ta mang theo một vũ khí quý giá chỉ xứng đáng nằm trong tay ngài. Thánh Thương Antioch, chính là Ngọn Giáo Định Mệnh! Với nó, ngài sẽ hủy diệt bọn dị giáo trên chiến trường!"\n\n[artifact_peddler.GetSheHe|U] lấy ra một mảnh kim loại nhỏ xíu trông chẳng khác gì kim khâu.""
  court.4500.finger_bones:0 ""Ngài trông giống một nhà sưu tầm lão luyện." [artifact_peddler.GetSheHe|U] mở một chiếc rương cũ kỹ đầy ắp xương từ mọi chi thể.\n\n"Ta có vài chiếc xương ngón tay thánh hiếm nhất, thậm chí có chiếc còn bọc vàng. Chúng bán lẻ từng chiếc, nhưng ta sẽ giảm giá đặc biệt nếu ngài mua đủ mười chiếc.""
  court.4500.dead_chicken:0 "\"Tôi có ở đây một món đồ trang sức tuyệt vời! Hãy mang nó theo, và bất kỳ kẻ thù nào trên chiến trường sẽ ngay lập tức nghĩ rằng ngài đã chết rồi! Chỉ cần một hơi, và sự an toàn của ngài được đảm bảo!\"\n\nTừ sâu trong chiếc áo choàng [artifact_peddler.GetHerHis] của ngài, [artifact_peddler.GetSheHe] lôi ra toàn bộ xác của một con gà chết."
  court.4500.worm:0 ""Thưa [ROOT.GetCharacter.GetLadyLord], ta có một cổ vật của ảo thuật vĩ đại, giúp ngài khiến mọi người tin rằng ngài sở hữu quyền năng ma thuật.\n\n[artifact_peddler.GetSheHe|U] vung lên một con sâu vải sặc sỡ buộc vào sợi chỉ rất mảnh. "Thoạt nhìn nó bất động, nhưng chỉ cần điều khiển sợi chỉ, ta có thể tạo ảo giác rằng con sâu sống dậy! Hãy nghĩ xem điều này sẽ khiến các [dummy_gender.Custom('LadiesLords')] trong triều kinh ngạc thế nào!""
  court.4500.a:0 "Máu trong người ta còn chẳng đủ — cút đi!"
  court.4500.b:0 "Lúc này ta sẵn sàng thử bất cứ thứ gì."
  court.4500.c:0 "$court.4500.b$"
  court.4500.d:0 "Chuyện này chỉ khiến dục vọng của ta cháy theo cách khác..."
  court.4500.e:0 "Tiếng gọi của Định Mệnh đang vang lên!"
  court.4500.f:0 "Mang những lời dối trá của ngươi đi nơi khác!"
  court.4500.g:0 "Cũng có cái thú khi dùng thánh tích của Chúa để vá tất..."
  court.4500.h:0 "À #EMP ra là vậy #! nên nông dân bây giờ hay thiếu một ngón tay."
  court.4500.i:0 "Ta muốn cả cẳng tay!"
  court.4500.j:0 "Được rồi, cứ thế đi."
  court.4500.k:0 "Ta vốn đã rất giỏi giả chết."
  court.4500.l:0 "Ta sẽ không làm kẻ giật dây!"
  court.4500.m:0 "Ta khá thích những thứ ngọ nguậy!"
  court.4500.n:0 "$court.4500.j$"


## Your cupbearer is drinking all your wine! By Isabella Welch
  court.4600.t:0 "[ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')|U] Hảo Hạng Nhất Mà Nhân Loại Có Được"
  court.4600.desc:1 "Ta bắt gặp người rót rượu của ta [cupbearer.GetTitledFirstName] cùng [cupbearer_friend.GetTitledFirstName] đang lảo đảo đôi chút và rót rượu từ một trong những chai hiếm nhất của ta cho [cupbearer_friend.GetTitledFirstNameNoTooltip].\n\n"Thật đáng tiếc khi [ROOT.GetCharacter.GetTitledFirstName] có столько [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')] mà [ROOT.GetCharacter.GetSheHe] tích trữ như một con rồng."
  court.4600.desc_lover:0 "Ngươi thật là một [cupbearer.Custom('LoverPetName')] ngon lành, ngươi xứng đáng được nếm những thứ tuyệt vời như chính bản thân ngươi."
  court.4600.desc_friend:0 "Bất cứ bằng hữu nào của ta cũng xứng đáng được uống như một [ROOT.Char.GetTitleAsNameNoTooltip]!"" 
  court.4600.desc_ending:1 "\n\nChúng thậm chí còn không chớp mắt khi thấy ta.\n\n "À, thưa [ROOT.GetCharacter.GetLadyLord]! Chúng ta đang thử trước tất cả rượu của ngài để xem có độc hay không. Sau khi để bụng mình gánh chịu từng giọt, cơn đau đầu ngày mai của ta chỉ là vết thương chiến trận nhận được khi chiến đấu vì danh dự của ngài!""
  court.4600.a:0 "Hầm rượu của ta quá lâu không mở — mỗi người trong triều một chai!"
  court.4600.b:0 "Kho dự trữ quý giá của ta! Ngươi là một kẻ hầu #EMP vô dụng #!."
  court.4600.b.tt:0 "Yến tiệc tiếp theo của ngươi sẽ rẻ hơn nếu ngươi ngăn kho rượu bị uống cạn."
  court.4600.c:0 ""Kho rượu bị đóng vì ta giữ [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')] có độc trong đó!""
  court.4600.c.tt:0 "Hai kẻ này phải học bài học vì sự vô lễ của chúng, nhưng thiên hạ sẽ dè chừng chất độc của ngươi."
  court.4600.c.t:0 "Người Rót Rượu Bị Trúng Độc!"
  court.4600.d:0 "Nhanh mang chai còn lại — thuốc giải nằm trong đó."
  court.4600.d.tt:0 "Cố gắng chữa cho hai kẻ ngu một cách kín đáo và giữ bí mật về chất độc của ngươi."
  court.4600.d.cure.t:0 "Thuốc giải được lén bỏ vào rượu"
  court.4600.d.cure.tt:0 "Chất độc của ngươi vẫn là bí mật"
  court.4600.e:0 "Có lẽ ta sẽ khóa kín cái hầm rượu hôi hám đó một thời gian."

## A special procedure to cure your ailments is suggested... by Isabella Welch
  court.4700.t:0 "Khoan Sọ Giải Thoát Linh Hồn"
  court.4700.desc_native_trepanning:0 "Một kẻ mặc y phục thầy thuốc xuất hiện với một hộp dụng cụ, nhưng dạ dày ta quặn lại khi thấy trong đó có cả búa và cuốc nhỏ.\n\n"Thưa [ROOT.GetCharacter.GetLadyLord], ta là một bậc thầy khoan sọ.""
  court.4700.desc_foreign_medicine:0 "Một kẻ mặc đồ đen từ vùng đất xa lạ đến với chiếc hộp đầy những chiếc búa kỳ lạ trông giống dụng cụ của thợ điêu khắc.\n\n"Ở quê hương ta có một nghi lễ gọi là khoan sọ, và dường như ngài đang cần đến nó.""
  court.4700.desc_possessed:0 "Trong lúc ngài bị chiếm hữu, các linh hồn đang bơi quanh tâm trí ngài, nhưng chúng thật ra không muốn ở lại. $court.4700.desc_passage$ $court.4700.growth$""
  court.4700.desc_witch:0 "Là một kẻ hành pháp thuật, sức mạnh của chính ngài đã rất lớn, nhưng vẫn còn một rào cản giữ chúng lại. Ma pháp của ngài có thể chinh phục cả thế giới nếu các linh hồn của không khí có thể bước vào hộp sọ ngài.""
  court.4700.desc_melancholic:0 "Hãy tưởng tượng nếu mọi nỗi khổ của ngài có thể đơn giản bước ra khỏi cơ thể và tan vào không khí. Những dằn vặt ấy không phải của ngài, mà là các linh hồn sống mà ta có thể giải thoát. $court.4700.growth$""
  court.4700.desc_heavy_mind:0 "Tâm trí ngài nặng nề, nhưng chỉ vì nó đang bị đè nặng. Đầu ngài đầy ắp linh hồn đang gặm nhấm trí tuệ ngài, từng suy nghĩ một. $court.4700.growth$ $court.4700.desc_passage$""
  court.4700.desc_blind:0 "Thị lực của ngài chưa mất, nó chỉ bị che mờ. Có những linh hồn đang bơi trong dịch mắt ngài. Ta có thể lặn vào đó và kéo chúng ra.""
  court.4700.desc_lunatic:0 "Những quyết định của ngài bị chi phối bởi cả một đám linh hồn bất đắc dĩ — một hội nghị điên loạn. $court.4700.growth$ Ta có thể lôi chúng ra, với vài chiếc đinh nhọn.""
  court.4700.desc_headache:0 "Nghe nói ngài chịu đựng những cơn đau đầu khủng khiếp. Khi cuộc đời ngài đầy áp lực, ngày càng nhiều linh hồn tụ lại và ăn tiệc trên nỗi lo trong sọ ngài. $court.4700.desc_passage$""
  court.4700.desc_trepanning_vices:0 "Những thói xấu tội lỗi mà ngài bị buộc tội không phải của ngài, ngài chỉ đang bị vài linh hồn thoáng qua nắm giữ. $court.4700.desc_passage$""
  court.4700.growth:0 "Chúng thậm chí có thể ẩn trong một khối u trong não ngài."
  court.4700.desc_passage:0 "Ta có thể tạo một lối đi để giải thoát chúng."
  court.4700.a:0 "Thật lố bịch! Căn bệnh của ta không phải thứ mê tín!"
  court.4700.b:0 "Ta không chịu nổi nữa, mang đục tới!"
  court.4700.b.tt:0 "Cuộc phẫu thuật sẽ được tiến hành..."
  court.4700.c:0 "Ta không phải tội nhân — chính dân ta mới có đầu óc lạc hậu!"
  court.4700.d:0 "Ta xin từ chối, nhưng có lẽ ngự y của ta có thể học hỏi từ ngươi."
  court.4700.success:0 "Ngươi sống sót sau cuộc khoan sọ mà không hề hấn"
  court.4700.no_success:0 "Việc khoan sọ không có tác dụng"
  court.4700.removal:0 "Việc khoan sọ loại bỏ căn bệnh của ngươi"
  court.4700.headache:0 "Mọi lo lắng của ngươi biến mất"
  court.4700.witch_power:0 "Khoan sọ gia tăng sức mạnh phù thủy của ngươi"
  court.4700.mental_faculties:0 "Khoan sọ làm tổn hại trí tuệ của ngươi"
  court.4700.physical_faculties:0 "Khoan sọ làm tổn hại cơ thể của ngươi"

## The Trepanning!

  court.4701.physician_study:0 "Ta được đưa vào phòng làm việc của ngự y [court_physician.GetTitledFirstName], người mà [trepanner.GetTitledFirstName] cho rằng có thể hỗ trợ trong việc này. Khi [trepanner.GetSheHe] trói ta vào ghế, [court_physician.GetTitledFirstNameNoTooltip] đứng phía sau quan sát."
  court.4701.no_physician:0 "Ta bị đưa vào một căn phòng phía sau trong [ROOT.Char.Custom('FortifiedBuilding')]. [trepanner.GetTitledFirstNameNoTooltip] bảo rằng nếu triều đình nghe thấy tiếng kêu của ta thì họ sẽ hoảng loạn, nên ta bị trói chặt vào ghế.\n\n"
  court.4701.physician_excited:0 ""Ồ, ta rất thích một ca khoan sọ!"\n\n"
  court.4701.physician_excited_2:0 ""Thật thú vị! Một phương pháp mới!"\n\n"
  court.4701.physician_concerned:0 ""Cẩn thận với [ROOT.GetCharacter.GetHerHim]!"\n\n"
  court.4701.physician_concerned_2:0 ""Ta sẽ hỗ trợ nếu trò man rợ này thất bại."\n\n"
  court.4701.mental_health_cannot_be_trepanned_away:0 "$court.4701.trepanning_vices_operation$ \n\nDù ta mong một phương thuốc có thể xua tan nỗi đau, ít ra ta cũng biết tâm trí này vẫn là của ta, không phải của quỷ dữ."
  court.4701.trepanning_success:0 "Cú búa khiến mũi nhọn đào sâu vào hộp sọ ta. Ngay lập tức cánh cổng cơ thể ta mở ra. Ta run rẩy, rung động, co giật, và cảm thấy những ngọn lửa dằn vặt được nhấc khỏi mình. Giữa cơn mưa tia đau đớn, ta bước vào một thế giới mới yên bình kỳ lạ."
  court.4701.trepanning_witch_power:0 "Ta không hề sợ khi cái đục bắt đầu lún vào sọ ta. Trong lúc thuốc mỡ được xoa lên não ta và cảm giác mù lòa lan ra, ta nghe thấy tiếng cười của [ROOT.Char.GetFaith.WitchGodName|U], và [ROOT.Char.GetFaith.WitchGodSheHe] đang chế giễu nghi thức ngớ ngẩn này.\n\n$court.4701.trepanning_no_result$"
  court.4701.trepanning_vices_operation:0 "Cú búa giáng vào sọ ta, nhưng bám chặt vào ghế $court.4701.trepanning_no_result$"
  court.4701.trepanning_headache_operation:0 "$court.4701.trepanning_no_result$ Cơn đau đầu của ta biến mất."
  court.4701.trepanning_mental_injury:0 "[trepanner.GetTitledFirstNameNoTooltip] nhẹ nhàng gõ lên sọ ta bằng búa như thể [trepanner.GetSheHe] đang gõ vỡ một quả trứng luộc lòng đào."
  court.4701.trepanning_incapable_injury:0 "Một luồng sáng tràn qua ta. Ta thấy ký ức của những ngày tháng năm xưa hiện ra cùng lúc. Ta đang ở đâu? Sao đầu ta đau thế? Tên ta là gì? Ta thích nhân bánh nào nhất?"
  court.4701.trepanning_possessed_injury:0 "Dù được hứa rằng ta sẽ giải thoát linh hồn khỏi đầu mình, ta lại thấy một linh hồn lần đầu tiên. Một bóng dáng có cánh đẹp đẽ đang nhảy múa từ bóng tối này sang bóng tối khác trong phòng và mỉm cười với ta."
  court.4701.trepanning_deviant_injury:0 "Khi cái lỗ bắt đầu được khoét, ta bỗng thích thú với âm thanh nhão nhoét trong cơ thể mình. Sau một hồi đầu óc quay cuồng, ta bỗng có những luồng thiên tài bùng nổ! Ta phải sống về đêm và chỉ ăn vỏ bánh mì! Sao ta chưa từng làm tình khi giả làm ngựa?"
  court.4701.trepanning_learning_penalty:0 "Khi lưỡi dao xoáy vòng vòng, ta nhận ra mình thậm chí khó mà hét lên #EMP dừng lại! #!Khi mọi chuyển động cuối cùng cũng dừng, tâm trí yếu ớt của ta như phải lội qua bùn mới tạo được một câu nói."
  court.4701.trepanning_physical_injury:0 "Ban đầu những mũi nhọn chạm vào sọ khiến cơn đau chạy khắp người ta như thể cột sống bị cưa đôi. Khi cuộc đào bới sâu hơn,"
  court.4701.trepanning_no_result:0 "ta cố giữ bình tĩnh. Khi mũi nhọn cuối cùng được rút ra, ta chẳng cảm thấy khác gì ngoài luồng gió nhẹ thổi vào bộ não lộ ra."
  court.4701.trepanning_coordination_penalty:0 "Ta bắt đầu không cảm thấy gì nữa. Khi mũi nhọn được rút ra, ta thậm chí không cảm nhận được. Khi cố đứng dậy, cơ thể ta hầu như không nghe theo."
  court.4701.trepanning_blind_injury:0 "thị lực ta đột nhiên biến thành biển sương mù. Chỉ một khoảnh khắc sau, ta tiếc cả lớp sương ấy khi bước vào vùng hoàng hôn vĩnh cửu."
  court.4701.a:0 "He he! Xin chào!"
  court.4701.b:0 "Khốn kiếp! Ngươi đã làm gì vậy?!"
  court.4701.c:0 "Cái đầu đau nhức của ta!"
  court.4701.d:0 "Con quỷ ngoan nào đây? Đúng rồi, là ngươi!"
  court.4701.e:0 "Ta nên ném hết đồ lót của mình qua cửa sổ!"
  court.4701.f:0 "Tuyệt vời! Ngươi có muốn làm ngự y của ta không?"
  court.4701.g:0 "Bằng chứng rằng những 'tật xấu' của ta không phải do quỷ dữ"
  court.4701.h:0 "Ta nợ ngươi một ân tình... sau khi ngươi tìm cho ta cái nút bịt cái lỗ này..."
  court.4701.i:0 "Những suy nghĩ bệnh hoạn của ta là kẻ thù mà chỉ mình ta đối mặt."


 court.4750.t:0 "Ta Cần Một Anh Hùng"
 court.4750.desc:0 "Một vị khách mới gần đây đã đến triều đình của ta, một thi sĩ miệng lưỡi trơn tru có chút danh tiếng tại địa phương.\n\n\"Thưa [ROOT.GetCharacter.GetLadyLord] của tôi, như những người kể chuyện xưa từng ngồi bên chân các lãnh chúa chiến tranh cổ đại, thì tôi, [poet.GetFirstName], cũng hy vọng tìm được công việc dưới sự bảo hộ của ngài. Xin hãy cho phép tôi chứng minh giá trị của mình! Có lẽ tôi có thể dâng tặng tác phẩm tiếp theo của mình cho ngài!\"\n\n\"Những trường ca vĩ đại là sở trường của tôi, hỡi [ROOT.Char.GetTitleAsName] vĩ đại: ngài muốn tôi ca tụng vị anh hùng nào?\""
 court.4750.a:0 "Hãy bịa ra một câu chuyện từ thời Giáo hoàng Joan!"
 court.4750.b:0 "Quý bà Godiva! Một bản ballad về chuyến cưỡi ngựa của bà!"
 court.4750.c:0 "Sinbad là một nhân vật thật táo bạo!"
 court.4750.d:0 "Caligula... ít được đánh giá cao, nhưng là một nhân vật thú vị."
 court.4750.e:0 "Những câu chuyện Nasreddin luôn khiến ta mỉm cười."
 court.4750.f:0 "Hãy kể ta nghe về Valmiki, vị thi nhân tiên tri!"
 court.4750.g:0 "Sao lại không phải chính ta chứ!"
 court.4750.h:0 "Ta không có thời gian cũng chẳng có vàng để lãng phí."

 court.4751.intro:0 "Theo yêu cầu của ta, vị thi sĩ mới, [poet.GetFirstName], mang đến cho ta một tác phẩm lấy cảm hứng từ"
 court.4751.topic.pope_joan:0 "Giáo hoàng Joan,"
 court.4751.topic.lady_godiva:0 "Quý bà Godiva,"
 court.4751.topic.sinbad:0 "Sinbad,"
 court.4751.topic.caligula:0 "Caligula,"
 court.4751.topic.nasreddin:0 "Nasreddin,"
 court.4751.topic.valmiki:0 "Valmiki,"
 court.4751.topic.ruler_hero:0 "cuộc đời anh hùng của ta,"
 court.4751.topic.unexpected:0 "nhưng nó không như ta mong đợi."
 court.4751.ruler_character:0 "\n\nLật nhanh qua những bản thảo được minh họa, ta thấy mình xuất hiện bên cạnh vị anh hùng như một nhân vật trong truyện!\n\n"
 court.4701.pope_joan_desc:0 "\n\nKhi liếc qua các bức minh họa, ta nhận ra hình ảnh Joan được vẽ với gương mặt của chính ta!\n\n[poet.GetTitledFirstNameNoTooltip|U] nghiêng người về phía ta. \"Sự quyến rũ của ngài vượt xa vị Giáo hoàng của chúng ta. Cũng như người tình của Joan đã thuyết phục nàng cải trang thành đàn ông để đi học tại Athens, ta dâng ngài văn bản này với ước mong rằng người mà ta #EMP lẽ ra phải#! tôn kính lại chính là ngài.\""
 court.4701.ruler_hero_desc:0 "\n\nBài thơ nói về những chiến công huy hoàng của ta, có phần thật, có phần hư cấu, nhưng tất cả đều vô cùng ấn tượng."
 court.4751.topic.lady_godiva_desc:0 "Trong bài thơ này ta cưỡi ngựa cùng Lady Godiva. Đẹp đẽ như bà — nhưng cũng trần truồng như vậy!"
 court.4751.topic.sinbad_desc:0 "Ta là một nhân vật bí ẩn mà Sinbad gặp đi gặp lại trong các chuyến phiêu lưu. Ta là sinh vật nở ra từ quả trứng Roc khổng lồ. Ta là Lão già của Biển bám trên vai Sinbad suốt nhiều năm. Ta là tù nhân của gã khổng lồ ăn thịt người."
 court.4751.topic.caligula_desc:0 "Ta là một nhân vật trong tác phẩm: cố vấn mệt mỏi của Caligula, đầy trí tuệ nhưng, than ôi, hiếm khi được lắng nghe."
 court.4751.topic.nasreddin_desc:0 "Các câu chuyện cho thấy Nasreddin cưỡi lừa theo sau ta khi ta thực hiện nhiệm vụ triều đình, buông những lời châm chọc về mọi hành động của ta."
 court.4751.topic.valmiki_desc:0 "\n\nGiống như truyền thuyết, một thợ săn bắn hạ một con chim xinh đẹp và ta không thể không thốt ra một cặp câu thơ.\n\nCũng như thi nhân tiên tri đã vô tình sáng tác bài thơ đầu tiên, ta cũng vậy, sáng tác những câu thơ ngẫu hứng mỗi khi bị bất ngờ."
 court.4751.a:0 "Bằng cách nào đó, sự ngưỡng mộ bất kính của ngươi khiến nó càng hấp dẫn..."
 court.4751.b:0 "Có lẽ ta nên nhắm tới ngôi Giáo hoàng..."
 court.4751.c:0 "Ta đáng lẽ phải tức giận, nhưng điều này chắc chắn sẽ mang lại cho ta nhiều người ngưỡng mộ..."
 court.4751.c.tt:0 "Những ai bị thu hút bởi bạn chắc chắn sẽ nhận ra..."
 court.4751.d:0 "Điều này đang gieo vào đầu ta vài ý nghĩ không trong sạch."
 court.4751.e:0 "Luôn có điều gì đó để học từ sau những trò đùa của hắn."
 court.4751.f:0 "Thật thú vị, chắc chắn triều đình sẽ thích."
 court.4751.g:0 "Đúng như vậy mới phải!"
 court.4751.h:0 "Trông như mồi tốt cho ngọn lửa tiếp theo của ta."

#By Isabella Welch
 court.4800.t:0 "Dang Rộng Đôi Cánh"
 court.4800.desc:0 "\"Tạo ra tiếng ồn thêm một lần nữa, tên hề, và ngươi sẽ rơi xuống đấy!\" Khi ta tình cờ bắt gặp Vệ sĩ của mình, [defenestrating_bodyguard.GetTitledFirstName], ta nhận thấy [defenestrating_bodyguard.GetSheHe] đang đi cùng với phần sau của [defenestrated_character.GetTitledFirstName], kẻ mà [defenestrating_bodyguard.GetSheHe] đang treo lơ lửng ngoài cửa sổ.\n\n[defenestrating_bodyguard.GetTitledFirstNameNoTooltip] nghiến răng [defenestrating_bodyguard.GetHerHis] của ngài. \"[defenestrated_character.GetSheHe|U] đã chế giễu khuôn mặt nghiêm nghị mà tôi luôn giữ khi đang làm nhiệm vụ. [defenestrated_character.GetSheHe|U] cứ liên tục tạo ra tiếng kêu của ngỗng để cố gắng khiến tôi mất bình tĩnh. Tôi cho rằng đây là một mối đe dọa đối với sự an ninh của ngài.\"\n\nBất chấp nguy hiểm, giữa những nỗ lực vô vọng để vùng vẫy thoát ra, [defenestrated_character.GetTitledFirstNameNoTooltip] bật cười khúc khích. \"#EMP Quác!#!\""
 court.4800.a:0 "Hãy xem ngỗng có bay được không!"
 court.4800.maimed_toast:0 "[defenestrated_character.GetTitledFirstName] gãy cánh"
 court.4800.death_toast:0 "[defenestrated_character.GetTitledFirstName] bỏ mạng khi bay"
 court.4800.b:0 "Đừng phản ứng quá! Cho [defenestrated_character.GetHerHim] một trận đòn nhẹ."
 court.4800.c:0 "[defenestrated_character.GetTitledFirstNameNoTooltip] nói đúng — một vệ binh giỏi không bao giờ bị khiêu khích."

#By Isabella Welch
 court.4801.t:0 "Sắp Nổ Tung"
 court.4801.desc:0 "Trước khi nhìn thấy đứa trẻ nhỏ [poopy_child.GetTitledFirstName] đang chơi trong phòng ngai vàng của ta, ta đã ngửi thấy một mùi không thể nhầm lẫn.\n\n\"Ôi, [ROOT.GetCharacter.Custom('GetMamaPapa')]! Thật vui khi được gặp người!\" Khi [poopy_child.GetSheHe] chạy tới ôm chân ta, ta cảm nhận chiếc tã đầy của [poopy_child.GetHerHis] ép vào bắp chân.\n\nKhi nó bắt đầu thấm xuống mắt cá chân ta, ta tự hỏi: Chẳng lẽ chúng ta thiếu người hầu đến mức ta phải tự mình làm việc nhục nhã là thay tã sao?"
 court.4801.a:0 "\"Lại đây nào, ta sẽ làm sạch cho con.\""
 court.4801.b:0 "Ta thà thua một cuộc chiến còn hơn chạm vào thứ bẩn thỉu này."

#By Isabella Welch
 court.4802.t:0 "Giáo Dục Trong Khổ Sở"
 court.4802.desc:0 "Ta thấy Gia sư triều đình của mình, [court_tutor.GetTitledFirstName] với một đàn học trò [court_tutor.GetHerHis] của ngài đang vây quanh [court_tutor.GetHerHim].\n\n\"Thưa thầy, hình bình hành là gì ạ?\"\n\n\"Thưa thầy, làm tình... có nghĩa là gì ạ?\"\n\n\"Thưa thầy, con nên thổi sáo to hơn, hay #EMP to hơn nhiều#! ạ?\"\n\n[court_tutor.GetTitledFirstNameNoTooltip] ngước nhìn ta với đôi mắt trũng sâu. \"[ROOT.GetCharacter.GetLadyLord] của tôi, tôi không thể chịu đựng thêm được nữa. Xin hãy giải thoát tôi khỏi vị trí này.\""
 court.4802.a:0 "Ôi, chẳng phải chúng đáng yêu sao?"
 court.4802.b:1 "Ta sẽ mua cho ngươi một cái kèn trumpet, [child_2.GetTitledFirstNameNoTooltip]. Nó sẽ #EMP còn to hơn nữa#!!"
 court.4802.c:0 "Ta hiểu, chúng ta sẽ tìm một gia sư mới."

#By Isabella Welch
 court.4803.t:0 "Cây Bút Ma Quái"
 court.4803.desc:0 "Nhà thơ của ta, như [court_poet.GetSheHe] vẫn luôn làm ngay khi ta ở trong tầm mắt, bắt đầu ngâm thơ với ta. \"Ôi, [ROOT.GetCharacter.Custom('PetName')] quý giá! Thật là một nỗi khó khăn, khi sống cuộc đời như một kẻ bị các nàng thơ bỏ rơi.\"\n\n\"Ngài chỉ huy các đội quân, nhưng ngài không thể chỉ huy ngôn từ. Nhân loại đã bao giờ chứng kiến một bi kịch tinh tế hơn chưa?\"\n\n\"Hãy cho phép tôi hỗ trợ ngài. Tôi có thể viết một số bài phát biểu cho ngài. Hãy cho tôi biết chủ đề, và tôi sẽ áp dụng một lối diễn đạt đẹp đẽ.\""
 court.4803.a:0 "Lời nói của ta có thể dùng thêm chút... hoa mỹ."
 court.4803.b:0 "Đôi khi ta cảm thấy mình giống thi sĩ hơn là [ROOT.GetCharacter.GetTitleAsName], ta không cần giúp."
 court.4803.c:0 "Ta muốn ngươi viết một bài thơ gửi người ta yêu."
 court.4803.c.tt:0 "Bạn sẽ gửi bài thơ cho [lover.GetTitledFirstName]"
 court.4803.c.intrigue.tt:1 "Kỹ năng [intrigue|E] cao của [lover.GetFirstNamePossessiveNoTooltip] có thể khiến [lover.GetSheHe] nhận ra nó do người khác viết."
 court.4803.c.realize.tt:0 "[lover.GetFirstNameNoTooltip] nhận ra tác giả thật"
 court.4803.c.fooled.tt:0 "[lover.GetFirstNameNoTooltip] cảm động trước bài thơ 'của bạn'"
 court.4803.d:0 "Lời nói của ta có thể không đẹp, nhưng xuất phát từ trái tim."

#By Isabella Welch
 court.4804.t:0 "Bạn Giường Khó Chịu"
 court.4804.desc:0 "Ta nhận thấy hai triều thần chia sẻ phòng trọ đang cãi vã, cả hai đều có quầng thâm nặng nề dưới mắt.\n\n\"[ROOT.GetCharacter.GetLadyLord] của tôi, tôi không thể ở chung giường với [roomate_2.GetTitledFirstName] thêm một đêm nào nữa. [roomate_2.GetSheHe|U] là một con lợn tham lam, cách [roomate_2.GetSheHe] chiếm lấy chiếc chăn.\"\n\n\"Và chẳng có đêm nào trong tuần này mà [roomate_1.GetTitledFirstName] không [ROOT.Char.Custom('RandomBadRoomate')].\" [roomate_2.GetSheHe|U] rùng mình. \"Tôi cầu xin ngài: Hãy ban cho chúng tôi nơi ở tốt hơn. Tôi không mơ ước gì hơn là một chiếc giường lạnh lẽo, trống trải.\""
 court.4804.a:0 "Ta sẽ nhờ người hầu tìm bạn phòng mới cho các ngươi."
 court.4804.b:0 "Chỗ ở này #EMP không#! xứng với triều đình của [ROOT.GetCharacter.GetTitleAsNamePossessiveNoTooltip]."
 court.4804.c:0 "Chúng ta không đủ chỗ để ai cũng có phòng riêng."

#By Isabella Welch
 court.4805.t:0 "Ăn Bớt Vật Liệu"
 court.4805.desc:0 "Kiến trúc sư của ta, [royal_architect.GetTitledFirstName], đang vác một cái bao khổng lồ và cười tươi. Ta nhăn mặt khi nó cào xước sàn phòng ngai vàng.\n\n\"Thưa [ROOT.GetCharacter.GetLadyLord], tôi đã làm điều gì đó #EMP rất#! nghịch ngợm, nhưng tôi nghĩ ngài sẽ thích.\"\n\nTa tưởng sẽ thấy thứ khiếm nhã khi [royal_architect.GetSheHe] mở bao, nhưng bên trong chỉ là một khối đá hình chữ nhật lớn. \"Đây là viên đá góc từ [rival.GetTitledFirstNamePossessive] [rival.Custom('FortifiedBuilding')]. Giờ mọi biểu tượng khi [rival.GetHerHim] đặt nó đã biến mất!\""
 court.4805.a:0 "Hãy dùng nó xây chuồng heo!"
 court.4805.b:0 "Ta muốn trưng bày nó thật tự hào!"
 court.4805.c:0 "Ta đã hối hận vì mối thù với [rival.GetHerHim]. Hãy trả lại."
 court.4805.d:0 "Sao ngươi mang thứ rác rưởi này tới? Vứt đi!"

#By Isabella Welch

 court.4806.t:0 "[ROOT.Char.GetTitleAsNameNoTooltip]ophile"
 court.4806.intro:0 "Một khuôn mặt mới đang đi lang thang quanh phòng ngai vàng, thỉnh thoảng khúc khích và nhảy cẫng lên tại chỗ khi [adoring_fan.GetSheHe] nhìn vào một tác phẩm nghệ thuật đại diện cho lối sống [ROOT.Char.GetCulture.GetNameNoTooltip]."
 court.4806.hre_desc:0 "\n\n\"Trái tim tôi! [ROOT.GetCharacter.GetPrimaryTitle.GetNameNoTierNoTooltip] là tuyệt vời nhất! Dù tôi sống ở [adoring_fan_liege.GetCapitalLocation.GetTitle.GetNameNoTier], tôi thật sự tin rằng trong tim mình tôi sinh ra đã là người [ROOT.Char.GetCulture.GetName]! Tôi có thể kể tên mọi Prince-Bishop. Tôi thậm chí còn xăm khuôn mặt của [ROOT.GetCharacter.GetTitledFirstNamePossessiveNoTooltip] trên bắp chân mình.\"\n\n[adoring_fan.GetSheHe|U] thò tay vào túi và lấy ra thứ trông giống như một bản sao bằng đồng rẻ tiền của Reichskrone. \"Tôi đội cái này hầu hết các ngày, và nói với mọi người khi đi ngang qua rằng 'Tôi hy vọng nhận được lá phiếu của ngài, thưa Tuyển hầu!'\""
 court.4806.byzantine_desc:1 "Khi vị khách đầy phấn khích tiến lại gần, lính canh phải ngăn [adoring_fan.GetHerHim] không đến quá sát.\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip]! Dù tôi đến từ [adoring_fan_liege.GetCapitalLocation.GetTitle.GetNameNoTier], tôi yêu mến người [ROOT.Char.GetCulture.GetCollectiveNoun] hơn cả trái tim mình có thể chịu đựng.\"\n\n\"Tôi đã dành cả đời cố gắng sống như một trong các ngài, đắm mình trong việc học [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip].\"\n\n\"Tôi chỉ mặc đồ lót màu tím. Tôi chắc chắn rằng nếu Đế chế sụp đổ, tôi sẽ cảm nhận nỗi đau đó còn sâu sắc hơn cả cái chết của mẹ mình — cả thế giới sẽ không bao giờ nghe hết những tiếng than khóc của tôi!\""
 court.4806.general_desc:1 "Có điều gì đó kỳ lạ ở vị khách này, và khi [adoring_fan.GetSheHe] bước tới, rõ ràng [adoring_fan.GetSheHe] đang mang theo một bản sao của [ROOT.Char.Custom('signature_weapon')] yêu thích của ta.\n\n\"Tôi không thể không quỳ gối trước ngài — tôi đã dành cả đời ở [adoring_fan_liege.GetCapitalLocation.GetTitle.GetNameNoTier] để ngưỡng mộ văn hóa của người [ROOT.Char.GetCulture.GetCollectiveNoun]. Tôi chỉ nói bằng [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip], ăn món [ROOT.Char.GetCulture.GetNameNoTooltip] [ROOT.GetCharacter.Custom('GetExpensiveMeal')], và đã học kiếm thuật theo phong cách [ROOT.Char.GetCulture.GetName].\"\n\n\"Gia đình tôi đã cấm tôi quay về nhà, nói rằng nếu tôi không thể làm gì ngoài việc ám ảnh về [ROOT.GetCharacter.GetPrimaryTitle.GetNameNoTooltip], thì tôi nên sống ở đó luôn.\""
 court.4806.a:0 "Điều này thật nịnh nọt, dù có hơi xâm phạm."
 court.4806.b:0 "Đưa ta thứ rẻ tiền đó! Không ai ngoài ta được đội vương miện."
 court.4806.c:0 "Một người nhiệt thành như vậy nên gia nhập triều đình!"
 court.4806.c.byz:0 "Vì lòng yêu nước của ngươi, ta cho phép ngươi mặc màu tím."
 court.4806.d:0 "Chỉ [ROOT.Char.GetTitleAsNameNoTooltip] mới được mặc màu tím! Tống giam kẻ này!"
 court.4806.e:0 "Ngươi dám sao chép [ROOT.Char.Custom('signature_weapon')] của ta! Lột nó khỏi người [adoring_fan.GetHerHim]!"

