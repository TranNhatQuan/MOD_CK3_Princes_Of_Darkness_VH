l_english:
 court_position_management_event.0001.t: "Bỏ Trống: [court_position_type.GetNameNoTooltip()]"
 court_position_management_event.0001.desc: "Chức vụ triều đình [court_position_type.GetName()] của ta đã bị bỏ trống sau khi [employee.GetFullName] rời đi."
 court_position_management_event.0001.desc.dead: "[employee.GetSheHe|U] [employee.GetDeathReason]."
 court_position_management_event.0001.desc.one_candidate: "\n\nCác cận thần của ta chỉ tìm được một ứng viên có thể đảm nhiệm chức vụ này, đó là [candidate_1.GetFullName]."
 court_position_management_event.0001.desc.two_candidates: "\n\nCác cận thần của ta đã đề xuất một vài ứng viên trong lãnh địa có thể đảm nhiệm chức vụ này, cụ thể là [candidate_1.GetFullName] và [candidate_2.GetFullName]."
 court_position_management_event.0001.desc.no_candidates: "\n\nCác cận thần của ta không tìm được ai trong lãnh địa có thể thay thế [employee.GetHerHim]."
 court_position_management_event.0001.a: "[candidate_1.GetFirstNameNoTooltip] là người thích hợp cho chức vụ!"
 court_position_management_event.0001.a.aptitude: "[aptitude|E] của [candidate_1.GetUINamePossessive] là [candidate_1.GetCourtPositionAptitude( court_position_type )]"
 court_position_management_event.0001.b: "[candidate_2.GetFirstNameNoTooltip] sẽ đảm nhiệm."
 court_position_management_event.0001.b.aptitude: "[aptitude|E] của [candidate_2.GetUINamePossessive] là [candidate_2.GetCourtPositionAptitude( court_position_type )]"
 court_position_management_event.0001.c: "Có lẽ chúng ta có thể tìm ứng viên thích hợp ở nơi khác..."
 court_position_management_event.0001.c.tt: "Mở [decision|E] [GetDecision('recruit_court_position_decision').GetName]"
 court_position_management_event.0001.d: "Ta sẽ tự mình giải quyết việc này..."
 court_position_management_event.0001.d.tt: "Mở giao diện để bổ nhiệm một [court_position_type.GetName] mới"
 court_position_management_event.0001.e: "Tạm thời cứ để trống."

 court_position_management_event.0002.t: "Bỏ Trống: [court_position_type.GetNameNoTooltip()]"
 court_position_management_event.0002.desc: "[employee.GetFullName] không còn là [court_position_type.GetName()] của ta nữa."
 court_position_management_event.0002.desc.dead: "$court_position_management_event.0001.desc.dead$"
 court_position_management_event.0002.desc.one_candidate: "\n\nTa chỉ biết một ứng viên trong trại của mình có thể đảm nhiệm vai trò này, đó là [candidate_1.GetFullName]."
 court_position_management_event.0002.desc.two_candidates: "\n\nMọi người đã đề xuất một vài ứng viên trong trại của ta có thể đảm nhiệm vai trò này, cụ thể là [candidate_1.GetFullName] và [candidate_2.GetFullName]."
 court_position_management_event.0002.desc.no_candidates: "\n\nTa không tìm được ai trong trại của mình có thể thay thế [employee.GetHerHim]."
 court_position_management_event.0002.a: "$court_position_management_event.0001.a$"
 court_position_management_event.0002.a.aptitude: "$court_position_management_event.0001.a.aptitude$"
 court_position_management_event.0002.b: "$court_position_management_event.0001.b$"
 court_position_management_event.0002.b.aptitude: "$court_position_management_event.0001.b.aptitude$"
 court_position_management_event.0002.c: "$court_position_management_event.0001.c$"
 court_position_management_event.0002.c.tt: "Mở [decision|E] [GetDecision('recruit_court_position_decision').GetName]"
 court_position_management_event.0002.d: "$court_position_management_event.0001.d$"
 court_position_management_event.0002.d.tt: "$court_position_management_event.0001.d.tt$"
 court_position_management_event.0002.e: "$court_position_management_event.0001.e$"
