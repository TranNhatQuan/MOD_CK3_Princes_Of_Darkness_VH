l_english:

  court_events.1000.t: "Vĩ Đại Nhất Trong Tất Cả"
  court_events.1000.desc: ""Ôi vĩ đại thay [ROOT.Char.GetTitleAsNameNoTooltip]! Cùng nhau, chúng tôi đã chu du khắp thế gian đã biết," [guest.GetName], người đầu tiên trong cặp lữ khách lừng danh, nịnh nọt nói, "Đã chiêm ngưỡng những cung điện khoái lạc chan hòa ánh nắng! Những hang băng! Đã uống sữa của Palestine và thưởng mật sương."\n\n"Chúng tôi đã ghé qua doanh trại của các khả hãn, cung điện của các vị sultan, những đại sảnh cổ xưa... nhưng không một triều đình nào trên thế gian sánh được với triều đình của ngài: không nơi nào ngang bằng về vẻ uy nghi và xa hoa!"\n\n[guest.GetHerHis|U] người bạn đồng hành [guest_2.GetName] thực hiện những nghi lễ cúi lạy kỳ lạ của xứ lạ, khẩn cầu:\n\n"Những tiện nghi nơi đây — chúng vượt xa cả sự xa xỉ của [second_court.GetPrimaryTitle.GetAdjective]... minh quân [ROOT.Char.GetTitleAsNameNoTooltip], xin hãy cho chúng tôi được thêm những cái nhìn sớm về [guest_2.GetFaith.PositiveAfterLife]!""
  court_events.1000.a: "Chỉ có lòng từ thiện mới bù đắp được tiếng tăm xa xỉ..."
  court_events.1000.a.flavor: "Và cũng làm giàu cho thần dân của ta!"
  court_events.1000.b: ""Hãy ở lại đây, trong triều đình vĩ đại nhất.""
  court_events.1000.b.flavor: "Và dẫn dắt quần thần của ta ca ngợi ta là quân chủ vĩ đại nhất!"
  court_events.1000.c: ""Hãy kể cho mọi người nghe về những kỳ quan các ngươi đã thấy ở đây.""
  traveling_friends_court_position_aptitude: "Hai lữ khách này tăng [aptitude|E] khi cả hai đều giữ [court_positions|E]"
  visiting_gives_opinion: "Mọi [ruler|E] tiếp đón [guest.GetFirstName] hoặc [guest_2.GetFirstName] nhận #P 20#! [opinion|E] đối với #high ngài#! #EMP (Danh tiếng)#!"

  court_events.1010.t: "Từ Một Tổ Kiến Khác"
  court_events.1010.desc: "Một cận thần [grander_ruler.GetPrimaryTitle.GetAdjectiveNoTooltip] lén bước vào. [defector.GetSheHe|U] cúi đầu trước ta, ánh mắt lo lắng liếc về phía lính canh.\n\n\"Ta đến từ một nơi huy hoàng,\" kẻ nịnh nọt này, [defector.GetName], nói, \"triều đình của [grander_ruler.GetName].\"\n\n\"Nếu ta rời bỏ sự phục vụ của [grander_ruler.GetHerHis], nhiều chức lại sẽ đi theo cùng ta. Chỉ là những con côn trùng nhỏ bé, nhưng chính nhờ lao động tận tụy của chúng ta mà triều đình trở nên uy nghi! Và chúng ta không muốn tiếp tục bị trói buộc với tên [grander_ruler.Custom2('InsultAdjective', SCOPE.sC('defector'))] [grander_ruler.GetTitleAsNameNoTooltip] đó...\"\n\n\"Chúng ta xin dâng sự phục vụ của mình cho #EMP ngài#!, hỡi [ROOT.Char.GetTitleAsName].\""
  court_events.1010.a: ""Với sự xảo quyệt của ngươi... hãy chứng minh sự hữu dụng của mình.""
  court_events.1010.a.flavor: "Nhà khảo cổ của ta kể về những báu vật vĩ đại của [grander_ruler.GetTitleAsNamePossessiveNoTooltip]... và có một món, đặc biệt, mà đôi tay trộm cắp có thể khiến nó trở thành của ta."
  court_events.1010.a.success: "Những kẻ đào ngũ đánh cắp bảo vật của quân chủ cũ"
  court_events.1010.a.failure: "Những kẻ phản bội bị bắt và xử tử"
  court_events.1010.b: "Những kẻ đào ngũ này hiểu rõ các phép tắc tinh tế."
  court_events.1010.c: "Những giáo sĩ có kỹ năng sẽ điều hành triều đình này tốt hơn."
  court_events.1010.c.flavor: "Nếu cần thêm những bàn tay hữu dụng để điều hành triều đình, [court_chaplain.GetCouncilTitle] của ta có thể tìm và giám sát một số người không vướng tội lỗi..."
  court_events.1010.d: "#EMP \"Cút về ổ đi, lũ gián phản trắc!\"#!"

  court_events.1011.opening: "Chủ nhân cũ của ta,"
  court_events.1011.desc: "Ta, [defector.GetName], cùng nhiều kẻ hầu bị áp bức của ngài đã bỏ trốn khỏi sự phục vụ của ngài. Không có chuyên môn của chúng ta, triều đình của ngài chẳng bao lâu sẽ trở thành đống đổ nát đúng như ngài đáng phải chịu.\n\nNgài luôn giống một [grander_ruler.Custom2('InsultNoun', SCOPE.sC('defector'))] hơn là một quân chủ xứng đáng. Và vì vậy kẻ thay thế ngài, [root_scope.GetName], sẽ tận hưởng những tiện nghi và vinh quang mà trước kia ngài từng có."
  court_events.1011.a: "#EMP Kẻ phản bội!#!"
