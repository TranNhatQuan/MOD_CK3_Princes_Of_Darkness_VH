l_english:
 # # Trampled Underfoot
 court.8001.t:0 "Bị Giẫm Nát Dưới Chân"
 court.8001.desc.intro:1 ""Ta đã bảo ngươi bao nhiêu lần phải tránh #EMP xa#! những luống #EMP [ROOT.Char.GetCapitalLocation.Custom('get_region_flower_type_plural')] mới trồng#! rồi hả?!"\n\n[child_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] xuất hiện, người dính đầy cánh hoa và bùn đất, phía sau là người làm vườn của ta, [gardener.GetTitledFirstName], đang đuổi theo.\n\n[child_1.GetFirstNameNoTooltip] khóc,"
 court.8001.desc.diplomacy:0 ""Chúng đuổi theo con! Con chưa bao giờ thua trò #EMP bắt#! cả!""
 court.8001.desc.martial:0 ""Con chỉ đang trốn bọn lính thôi... chúng con phải phục kích thì mới thắng trận!"" 
 court.8001.desc.stewardship:0 ""Không phải lỗi của con! [gardener.GetSheHe|U] đặt chúng ngay trên lâu đài nhỏ của bọn con!"" 
 court.8001.desc.intrigue:0 ""Chúng con đang chơi trốn tìm, chẳng ai tìm thấy con đâu nếu không phải vì #EMP [gardener.GetHerHim]#! cả!"" 
 court.8001.desc.learning:0 ""Con chỉ đang nhìn thôi! Lần này chúng có màu khác mà!"" 
 court.8001.desc.fallback:0 ""Con không làm gì cả! Con chỉ đang chơi thôi!"" 
 court.8001.desc.closing: "\n\n[gardener.GetFirstNameNoTooltip] lườm giận dữ, "Cái [child_1.Custom('GirlBoy')] đáng ghét đó đã giẫm nát #EMP toàn bộ#! công sức của thần, [ROOT.Char.Custom('FormOfAddressForLiege')]! Phải mất #EMP hàng tuần#! mới sửa lại được..."" 
 court.8001.a.diplomacy:0 "Đôi khi bị bắt cũng có lợi đấy, [child_1.Custom('GirlBoy')] của ta."
 court.8001.a.martial:0 "À, nhưng con phải biết chọn trận mà đánh chứ, [child_1.Custom('GirlBoy')] của ta!"
 court.8001.a.stewardship:0 "Ta biết chỗ tốt hơn để xây thành trì hùng mạnh của con, [child_1.Custom('GirlBoy')] của ta."
 court.8001.a.intrigue:0 "Mấu chốt là đừng để bị bắt, [child_1.Custom('GirlBoy')] của ta."
 court.8001.a.learning:0 "Con cũng có thể học từ xa mà, [child_1.Custom('GirlBoy')] của ta."
 court.8001.a.lesson_tt:0 "[child_1.GetFirstNameNoTooltip] hiểu được ý của ngươi"
 court.8001.b.gardener:0 "Không! #EMP Đừng#! giẫm lên luống hoa..."
 court.8001.b.poet:0 "Vẻ đẹp mong manh, mãi bị lũ vụng về giẫm nát..."
 court.8001.c:0 "[child_1.GetFirstNameNoTooltip] sẽ giúp trồng lại chúng. Tất cả."
 court.8001.c.gardener_tt:0 "[child_1.GetFirstNameNoTooltip] có bàn tay xanh"
 court.8001.d:0 "Ngươi dám #EMP đối xử#! với [child_1.GetFirstNameNoTooltip] như thế sao?!"
 court.8001.e:0 "Trẻ con muốn chơi ở đâu thì chơi, [gardener.GetFirstNameNoTooltip]."
 court.8001.a.success: "Ngươi truyền đạt được chút khôn ngoan"
 court.8001.a.failure: "Ngươi chẳng giúp ích gì"
# # Underequipped
 court.8010.t:0 "Trang Bị Thiếu Thốn"
 court.8010.desc.intro:0 "Ta đang tận hưởng một khoảnh khắc hiếm hoi yên tĩnh giữa các buổi nghị sự thì [underequipped.GetTitledFirstName] kéo ta sang một bên. \n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]..." [underequipped.GetSheHe] bắt đầu cẩn trọng,"
 court.8010.desc.champion:0 ""Với tư cách là dũng sĩ của ngài, ta tự hào đại diện cho ngài," 
 court.8010.desc.bodyguard:0 ""Với tư cách là cận vệ của ngài, ta vinh dự được bảo vệ ngài," 
 court.8010.desc.knight: "Với tư cách là [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] của ngài, chiến đấu vì ngài là nghĩa vụ thiêng liêng của ta,"
 court.8010.desc.bold:0 "nhưng điều này thật nực cười!" \n\n[underequipped.GetSheHe|U] nửa rút lưỡi kiếm [underequipped.GetHerHis] của ngài ra khỏi vỏ, thu hút sự chú ý vào nhiều vết khía và vết rỗ của nó. \"Không ai có thể mong đợi tôi làm công việc của mình với cái thanh sắt vụng về này!\""
 court.8010.desc.meek:0 "nhưng..." \n\n[underequipped.GetSheHe|U] trông có vẻ nghi ngờ trong một khoảnh khắc, sau đó thực hiện một cử chỉ yếu ớt nhưng đầy bực bội với vỏ kiếm [underequipped.GetHerHis] của ngài: \"Làm sao tôi có thể làm công việc của mình với thứ cũ kỹ này?\""
 court.8010.desc.body:0 "\n\n"Chắc hẳn chất lượng là điều quan trọng nhất khi nói đến"
 court.8010.desc.champion_end:0 "việc hành động thay mặt [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]!"" 
 court.8010.desc.bodyguard_end:0 "việc bảo vệ sinh mạng của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]!"" 
 court.8010.a:0 "Những [underequipped.GetWomenMen] giỏi nhất của ta cần vũ khí chất lượng!"
 court.8010.a.tt:0 "Một vũ khí tốt theo lựa chọn của [underequipped.GetTitledFirstNamePossessiveNoTooltip] sẽ được rèn cho [underequipped.GetHerHim]"
 court.8010.a.equipped_tt:0 "Một vũ khí tinh xảo được rèn cho [underequipped.GetTitledFirstName]"
 court.8010.c:0 "Có lẽ ta có thể nhường một vũ khí của riêng ta..."
 court.8010.c.equipped_tt:0 "[underequipped.GetTitledFirstNameNoTooltip] được tặng một vũ khí"
 court.8010.d:0 "Đến kho vũ khí đi — như mọi người khác."
 court.8010.d.tt:0 "[underequipped.GetTitledFirstNameNoTooltip] sẽ lấy một thanh kiếm kém chất lượng từ kho vũ khí"
 court.8010.d.equipped_tt:0 "[underequipped.GetTitledFirstName] nhận một thanh kiếm từ kho"
 court.8010.e:0 "Cút khỏi tầm mắt ta, đồ [underequipped.Custom2('InsultNoun', ROOT.Char)] hỗn xược!"
 # # Sartorial Sting
 court.8020.t:0 "Lời Châm Chọc Về Trang Phục"
 court.8020.desc:0 "Giữa một ngày bận rộn nơi triều đình, ta nghe thấy giọng bực tức đặc trưng của [couture_spouse.GetWifeHusband] ta — [couture_spouse.GetTitledFirstNamePossessive]; dường như [couture_guest.GetTitledFirstName] đã chọc giận [couture_spouse.GetHerHis]. \n\nTiến lại gần, ta thấy vị khách kia cười khẩy chế nhạo: "Những cái gọi là #EMP thời trang#! này thật đáng xấu hổ; ở bất kỳ triều đình #EMP [couture_guest.GetCulture.GetNameNoTooltip]#! tử tế nào thì chúng chỉ hợp cho bọn hầu và trẻ con mà thôi."\n\n[couture_spouse.GetWifeHusband] của ta đỏ mặt và kêu lên: "Ta đã #EMP chịu đủ#! ngươi rồi — ta chẳng quan tâm ngươi là khách của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]!" — khiến [couture_guest.GetFirstNamePossessiveNoTooltip] vô cùng ngạc nhiên. \n\nKéo ta sang một bên, [couture_spouse.GetFirstNameNoTooltip] than vãn cay đắng: "Cái [couture_guest.Custom2('InsultNoun', SCOPE.sC('couture_spouse'))] vô ơn đó lúc nào cũng chế giễu chúng ta; hôm qua bọn hầu của ta còn nghe thấy [couture_guest.GetHerHim] gọi xu hướng của chúng ta là #EMP lỗi thời!#!""
 court.8020.a:0 "Thôi nào, người yêu, [couture_guest.GetSheHe] chỉ đang trêu chọc chúng ta thôi."
 court.8020.b:0 "Ta cho rằng đây cũng là nơi tốt để đầu tư..."
 court.8020.d:0 "Lỗi thời ư? #EMP LỖI THỜI?!#!"

 poor_host_modifier:0 "Chủ Nhà Kém Cỏi"
 poor_host_modifier_desc:0 "Nhân vật này đã phá vỡ những quy tắc bất thành văn của lòng hiếu khách."
 hunting_pooches_modifier:0 "Chó Săn Thượng Hạng"
 hunting_pooches_modifier_desc:0 "Triều đình của nhân vật này sở hữu những con chó săn đặc biệt ấn tượng."
 # # Pawful of Pooches
 court.8030.t:0 "Một Đàn Cún Con"
 court.8030.desc.intro:0 "Khi [huntmaster.GetTitledFirstName], người quản săn của ta, bước vào phòng, một đám cận thần đang xuýt xoa liền vây quanh [huntmaster.GetHerHim]. \n\nKhi [huntmaster.GetSheHe] cuối cùng cũng chen qua được, nguyên nhân của sự náo động lập tức rõ ràng: trong vòng tay [huntmaster.GetHerHis] là một tấm chăn đầy những chú cún con đang ngọ nguậy, trông giống một giống [ROOT.Char.Custom('get_region_dog_type')] — mà lại còn rất ấn tượng! \n\n$master_of_hunt_court_position$ của ta mỉm cười rạng rỡ, "[ROOT.Char.Custom('FormOfAddressForLiege')|U], thần nhất định phải cho ngài xem lứa chó này; một khi chúng lớn lên và được huấn luyện, thần dám chắc chúng sẽ khiến mọi đoàn săn của [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] phải ghen tị!" \n\n"
 court.8030.desc.one:0 "Ta không khỏi nhận thấy [child_1.Custom('ComplimentAdjective')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child_1'))] của ta, [child_1.GetFirstNameNoTooltip], đang cố rướn người để nhìn rõ những chú chó bé xíu."
 court.8030.desc.two:0 "Khóe mắt ta bắt gặp hai đứa con của mình, [child_1.GetFirstName] và [child_2.GetFirstName], rõ ràng bị mê hoặc bởi đám cún con, đặc biệt là con to nhất trong đàn."
 court.8030.desc.body:0 "\n\nNhấc con to nhất lên, [huntmaster.GetTitledFirstNameNoTooltip] trầm ngâm, "Có lẽ đây sẽ là con chó vĩ đại nhất của cả thế hệ này!"" 
 court.8030.a:0 "Ta nóng lòng chờ ngày chúng ra mắt!"
 court.8030.b:0 "Con to nhất sẽ thuộc về [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child_1'))] của ta, [child_1.GetFirstNameNoTooltip]!"
 court.8030.c:0 "Chỉ có [child_2.GetFirstNameNoTooltip] mới xứng với một chú chó tốt thế này."
 court.8030.d:0 "À, ta đã chờ đợi một chú chó tuyệt vời như thế này!"
# # Aristocratic Pretensions
 court.8040.t:0 "Tham Vọng Quý Tộc"
 court.8040.desc.intro:0 "Ba trong số các triều thần của ta đang công khai thảo luận về 'số lượng lớn' tước hiệu của ta trong tầm nghe cố ý, lớn tiếng than vãn về việc [ROOT.Char.GetTitleAsNameNoTooltip] phải vất vả thế nào để quản lý quá nhiều bất động sản như vậy [ROOT.Char.GetHerselfHimself]... \n\nHọ thân thiết như những kẻ trộm:"
 court.8040.desc.position_holder:1 "[position_holder.GetName] trung thành — một người phục vụ triều đình;"
 court.8040.desc.knight:1 "[knight.GetName] dũng cảm — [ROOT.Char.Custom('MountedWarriorTerm')|U] lẫy lừng của ta;"
 court.8040.desc.relative:1 "[relative.GetName] — người thân [relative.GetWomanMan] đầy quyền lợi của ta;"
 court.8040.desc.ambitious:1 "[ambitious.GetName] tham vọng — luôn tìm cơ hội;"
 court.8040.desc.arrogant:1 "[arrogant.GetName] kiêu căng — ngẩng cao đầu;"
 court.8040.desc.lowborn:1 "[lowborn.GetName] tay trắng lập thân — luôn chớp lấy mọi cơ hội;"
 court.8040.desc.gentry:1 "[gentry.GetName] ngạo mạn — kẻ đặc quyền của nhà [gentry.GetHouse.GetName];"
 court.8040.desc.generic_1:1 "[ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('generic_1'))] [generic_1.GetName] — chỉ vui vì được tham gia;"
 court.8040.desc.generic_2:1 "[ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('generic_2'))] [generic_2.GetName] — theo cách lính gác gọi [generic_2.GetHerHim];"
 court.8040.desc.generic_3:1 "[ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('generic_3'))] [generic_3.GetName] — một kẻ tay sai nhạt nhòa;"
 court.8040.desc.body:0 "và hoàn toàn thiếu vắng: một chút khiêm nhường. \n\nGiữa tiếng ồn ào tán gẫu của cận thần, ta rõ ràng nghe thấy những từ: '[worst_title.GetTierAsNameNoTooltip]' và '[worst_title.GetNameNoTier]' — với giọng điệu nịnh nọt mà ta chắc chắn là của [button.GetFirstNamePossessiveNoTooltip]. \n\nBộ ba trơ tráo quay sang nhìn ta, và ta bắt gặp chúng bằng một cái nhìn sắc lạnh."
 court.8040.a:0 "Phải rồi, phải rồi, [courtier_1.GetTitledFirstNameNoTooltip]... [worst_title.GetNameNoTierNoTooltip] là của ngươi."
 court.8040.b:0 "Trò chơi nhỏ này kết thúc tại đây: tước [worst_title.GetTierAsNameNoTooltip] sẽ thuộc về [courtier_2.GetFirstNamePossessiveNoTooltip]!"
 court.8040.c:0 "Ngươi kia! [courtier_3.GetTitledFirstNameNoTooltip]? Tước vị là của ngươi!"
 court.8040.d:0 "Ta biết các ngươi đang tính toán gì! Đã đến lúc chứng minh giá trị của mình!"
 court.8040.d.flavor_tt:0 ""Dành cho kẻ mạnh nhất""
 court.8040.d.courtier_1_tt:0 "[courtier_1.GetFirstNameNoTooltip] khao khát nó hơn"
 court.8040.d.courtier_2_tt:0 "[courtier_2.GetFirstNameNoTooltip] là [courtier_2.GetWomanMan] cuối cùng còn trụ lại"
 court.8040.d.courtier_3_tt:0 "[courtier_3.GetFirstNameNoTooltip] giành phần thắng"
 court.8040.grant_tt:0 "[new_noble.GetTitledFirstNameNoTooltip] nhận được [worst_title.GetNameNoTierNoTooltip]"
 court.8040.e:0 "Từng người một, hãy nói cho ta vì sao ngươi xứng đáng có tước vị."
 court.8040.e.courtier_1_tt:0 "[courtier_1.GetFirstNameNoTooltip] thuyết phục nhất"
 court.8040.e.courtier_2_tt:0 "[courtier_2.GetFirstNameNoTooltip] gây ấn tượng bằng tài hùng biện của [courtier_2.GetHerHis]"
 court.8040.e.courtier_3_tt:0 "[courtier_3.GetFirstNameNoTooltip] nói năng rất khéo"
 joining_faction_block_tt: "[new_noble.GetFirstNameNoTooltip] thề sẽ không tham gia phe phái nào trong 20 năm"
 court.8040.f:0 "Các ngươi đang nhìn cái gì?"
 # # A Little Bird
 court.8050.t:0 "Chim Nhỏ Báo Tin"
 court.8050.desc:0 "Ban đầu ta nghĩ chúng chỉ đơn thuần là những đặc điểm cá nhân, nhưng rõ ràng một trong số nhiều người hầu tại triều đình đã lén lút ra hiệu cho ta.\n\nTa tiếp cận [servant.GetHerHim] cùng với đội cận vệ của mình vào một khoảnh khắc yên tĩnh, và [servant.GetSheHe] thì thầm một cách đầy âm mưu: \"[ROOT.Char.GetTitleAsNameNoTooltip] vĩ đại, tên tôi là [servant.GetFirstName]. Chúng tôi nghe được rất nhiều điều khi phục vụ khách của ngài; họ hầu như không nhận thấy sự hiện diện của chúng tôi...\" \n\nTa nhìn [servant.GetHerHim] một cách nghi ngờ, tự hỏi liệu ta có thực sự muốn nghe những gì [servant.GetSheHe] nói tiếp theo hay không. [servant.GetSheHe|U] đáp lại ánh nhìn, rõ ràng không chắc liệu [servant.GetSheHe] có đang phạm sai lầm hay không. \n\nCuối cùng, [servant.GetSheHe] nuốt nước bọt, \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], [vassal.GetTitledFirstName], [servant.Custom2('DescriptorNegative', SCOPE.sC('vassal'))] của ngài [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('vassal'))], [vassal_secret.Custom('SecretDescriptionThirdPerson')] phía sau những cánh cửa đóng kín của [ROOT.Char.Custom('FortifiedBuilding')] ngài — tôi thề điều đó với [servant.GetFaith.HighGodName] là nhân chứng!\""
 court.8050.a:0 "Cảm ơn vì sự phục vụ của ngươi."
 court.8050.a.tt:0 "[servant.GetFirstNameNoTooltip] sẽ gia nhập [court|E] của ngươi"
 court.8050.b:0 "Ngươi còn nghe được gì nữa?"
 court.8050.b.tt:0 "Ngươi sẽ biết một bí mật của người khác trong triều"
 court.8050.b.tt_secret:1 "Bí mật của [vassal_2.GetTitledFirstNamePossessive]"
 court.8050.c:0 "Cầm lấy cái này — từ nay chỉ báo cáo với ta."
 court.8050.c.tt:0 "[spymaster|E] của ngươi sẽ dễ phá hoại âm mưu hơn khi modifier này tồn tại"
 court.8050.d:0 "Bắt giam kẻ rình rập này!"
 court.8050.d.tt_imprison:0 "[servant.GetFirstNameNoTooltip] bị tống vào ngục tối"
 # Modifiers
 servant_informants_modifier:0 "Mạng Lưới Người Hầu Báo Tin"
 servant_informants_modifier_desc:0 "Tin đồn trong triều đình của nhân vật này được báo cáo bởi mạng lưới người hầu do thám."
 # # Scornful Sycophants
 court.8060.t:0 "Những Kẻ Nịnh Hót Khinh Miệt"
 court.8060.desc.intro:0 "Ta dừng lại một lát ở ngưỡng hành lang, ngắm ánh nắng, thì nghe thấy tiếng cười nhạo phát ra ngay góc tường. \n\n"Ta #EMP biết mà!#!" Ta nghe [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('snooty_1'))] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('snooty_1'))] của ta, [snooty_1.GetFirstName], cười khúc khích,"
 court.8060.desc.fashion:0 "\"Đi dạo xung quanh, tôi thề là đôi khi cảm giác như tôi đang ở triều đình của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] ông nội/bà nội [snooty_1.GetMotherFather] vĩ đại; các xu hướng thật mệt mỏi và cũ kỹ!\" \n\n"
 court.8060.desc.servants_1:0 ""Chờ #EMP cả ngày#! mới có một người hầu, rồi bỗng hai người tới cùng lúc — mà lại chẳng mang thứ ta cần!" \n\n"
 court.8060.desc.food_1:0 ""Ngươi có #EMP thấy#! bữa tiệc tối qua không? Ta thà gặm cái đĩa gỗ của mình còn hơn ăn cái thứ cám lợn đó!" \n\n"
 court.8060.desc.body:0 "Một giọng cười khúc khích khác chen vào: "Ôi trời, ta cứ tưởng chỉ mình ta nhận ra điều đó! Chưa kể đến"
 court.8060.desc.lodgings:1 "kích #EMP thước#! phòng của chúng ta! Hầu như chẳng đủ chỗ cho cái giường của người hầu!"" 
 court.8060.desc.food_2:0 "đồ ăn ở đây thật tệ — mà khẩu phần lại #EMP nhỏ#! đến thế!"
 court.8060.desc.servants_2:0 "đám người hầu — ta bỏ cuộc rồi: hoặc chúng chẳng hiểu ta nói gì, hoặc chẳng bao giờ quay lại!"
 court.8060.desc.outro:0 "\n\nCó phải [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('snooty_2'))] của ta, [snooty_2.GetTitledFirstName], đang cố nén cười không? Thật là hỗn xược..."
 court.8060.a.fashion:0 "Ta sẽ đặt ra một chuẩn phục trang mới chỉ cho ngươi, [snooty_1.GetFirstNameNoTooltip]."
 court.8060.a.servants:0 "Có lẽ ngươi có thể giới thiệu vài người hầu lành nghề chăng, [snooty_1.GetFirstNameNoTooltip]?"
 court.8060.a.food:0 "[snooty_1.GetFirstNameNoTooltip], ngày mai ta có chuẩn bị một bữa ăn đặc biệt."
 court.8060.b.food:0 "Một đầu bếp mới sẽ bắt đầu làm việc sớm thôi, [snooty_2.GetFirstNameNoTooltip]."
 court.8060.b.lodgings:0 "Tối nay ta sẽ chuyển sang phòng rộng hơn, [snooty_2.GetFirstNameNoTooltip]."
 court.8060.b.servants:0 "Ta cho rằng chúng ta có thể cần thêm vài đôi tay giúp việc."
 court.8060.c:1 "Tránh đường cho ta, lũ ký sinh vô ơn..."
 court.8060.d:0 "Nếu không thích thì đi tìm kẻ khác mà bám!"
 court.8060.e:0 "Những ham muốn trần tục chỉ khiến chúng ta xa rời [ROOT.Char.GetFaith.PositiveAfterLife]."
 court.8060.e.pious_tt:0 "Mọi chư hầu hoặc cận thần không Cynical thuộc một đức tin Khổ Hạnh"
 court.8060.f:0 "Hôm nay trời đẹp nhỉ?"
 court.8060.f.flavor:0 "Bề ngoài phải được giữ gìn"
 # # Feeling Useful
 court.8070.t:0 "Muốn Trở Nên Hữu Ích"
 court.8070.desc:0 "[parent.GetMotherFather] [ROOT.Char.Custom2('DescriptorPositive', SCOPE.sC('parent'))] của ta mỗi ngày đều lẩn quẩn quanh triều đình vô định, rõ ràng [parent.GetHerHis] khao khát một mục đích mà ta quá bận rộn để đáp ứng. \n\nHôm nay cuối cùng [parent.GetSheHe] cũng chặn ta lại: "Ồ, con đây rồi [ROOT.Char.GetFirstNameNoTooltip], với ta con vẫn chỉ là đứa [ROOT.Char.Custom('GirlBoy')] bé nhỏ thôi! Hãy để ta gánh bớt gánh nặng khỏi vai con — ta vẫn còn nhiều điều có thể dạy con lắm." \n\nTùy tùng của ta cố tìm thứ gì đó khác để nhìn, nhưng điều đó chỉ khiến ta càng thêm bối rối. \n\n"[ROOT.Char.Custom('GetDaughterSon')|U], có chuyện gì vậy? Con không còn quan tâm đến [parent.Custom('GetMaPa')] già của con nữa sao? Sau tất cả những gì ta đã làm cho con?""
 court.8070.a:0 "Ta sẽ tìm việc gì đó cho ngài làm, [parent.Custom('GetMamaPapa')]."
 court.8070.a.tt:0 "[parent.GetFirstNameNoTooltip] sẽ mong đợi một [court_position|E] trong vài tháng tới"
 court.8070.b:0 "Ngài đã nghĩ đến việc hiến dâng đời mình cho [ROOT.Char.GetFaith.HighGodName] chưa?"
 court.8070.c:0 "Cứ nhận bất kỳ công việc nào đi..."
 court.8070.d:0 "Ta đang #EMP rất#! bận, [parent.GetMotherFather]."
 court.8071.satisfied:0 "[parent.GetMotherFather|U] dần hài lòng với vai trò của [parent.GetHerHis]"
 court.8071.disappoint:0 "[parent.GetMotherFather|U] mệt mỏi vì chờ đợi"
 # Modifiers
 promised_court_position_modifier:0 "Chức Vụ Được Hứa"
 promised_court_position_modifier_desc:0 "Nhân vật này đã được hứa hẹn một vị trí trong triều trong tương lai gần, và kể điều đó cho bất cứ ai chịu nghe."
 # # Maternal Reproach
 court.8080.t:0 "Lời Quở Trách Của [parent.Custom('GetMaternalPaternal')|U]"
 court.8080.desc.intro:0 "[parent.GetMotherFather] của ta, [parent.GetTitledFirstName] đã trở nên cáu kỉnh hơn qua từng ngày. \n\nKhi ta ngồi trên ngai vàng, suy ngẫm về những nguyên nhân có thể, [parent.GetWomanMan] [parent.GetHerselfHimself] xông về phía ta, giống như cách [parent.GetSheHe] từng làm khi ta cư xử không đúng mực hồi còn nhỏ.\n\n\"[ROOT.Char.GetFirstNameNoTooltip], [ROOT.Char.Custom('GetDaughterSon')] của ta! Ngươi phải làm gì đó về"
 court.8080.desc.fashion:0 "những bộ giẻ rách thảm hại mà con gọi là quần áo này!"
 court.8080.desc.servants:0 "đám người hầu bất tài và quá tải của con!"
 court.8080.desc.lodgings:0 "chỗ ở tồi tàn mà con dành cho khách!"
 court.8080.desc.food:0 "những món khủng khiếp trên bàn tiệc của con!"
 court.8080.desc.outro:0 "Ngươi không quan tâm người khác nghĩ gì về mình sao?!\"\n\n\"Đây không phải là cách để một [ROOT.Char.GetTitleAsNameNoTooltip] thể hiện bản thân [ROOT.Char.GetHerselfHimself]; nếu cứ thế này ngươi sẽ trở thành trò cười của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] — không — của tất cả [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]!\""
 court.8080.a:0 "Vâng [parent.Custom('GetMamaPapa')], ta sẽ sửa..."
 court.8080.b:0 "À, vậy ngài nghĩ mình giỏi hơn các cận thần của ta sao?"
 court.8080.b.tt:0 "Mọi [courtier|E]"
 court.8080.c.nun:0 "Có lẽ ngài thích mặc áo tu của một [ROOT.Char.GetFaith.DevoteeFemale]?"
 court.8080.c.monk:0 "Có lẽ ngài thích khoác áo tu của một [ROOT.Char.GetFaith.DevoteeMale]?"
 court.8080.c.fallback:0 "Ngài đã nghĩ đến việc hiến mình cho [ROOT.Char.GetFaith.HighGodName] chưa?"
 court.8080.d.fashion:0 "Ta nghĩ #EMP ngài#! nên may cho chúng ta vài bộ mới."
 court.8080.d.servants:0 "Vậy sao ngài không giúp đám người hầu một tay?"
 court.8080.d.lodgings:0 "Có lẽ ngài có thể nhường phòng mình cho người khác?"
 court.8080.d.food:0 "Được thôi, vậy ngài hãy tìm nơi khác mà ăn..."
 court.8080.e:0 "Ngài không thể nói với ta như thế nữa!"
 # Modifiers
 court_8080_degraded_modifier:0 "Bị Làm Nhục"
 court_8080_degraded_modifier_desc:0 "Nhân vật này đã bị con cái và lãnh chúa của mình làm nhục công khai vì phàn nàn."
 # # Building Blocks
 court.8090.t:0 "Những Viên Gạch Nền"
 court.8090.desc.intro:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))] của ta, [architect.GetTitledFirstName], quả thực rất nghiêm túc với trách nhiệm $royal_architect_court_position$ của mình."
 court.8090.desc.intro_alt: "Một kiến trúc sư nổi tiếng từ [my_county.GetNameNoTier], [architect.GetTitledFirstName], đang ghé thăm triều đình."
 court.8090.desc.intro_end: "[architect.GetHerHis|U] đang tranh luận sôi nổi với [steward.GetHeldCourtAndCouncilPositionsString] của ta, [steward.GetTitledFirstName], khiến cả căn phòng phải chú ý. \n\n"Đúng thế, chính xác!" [architect.GetFirstNameNoTooltip] kêu lên, "Tàn tích ở đó có rất nhiều đá đã cắt gọt có thể dễ dàng chuyển đến"
 court.8090.desc.religious:0 "[ROOT.Char.GetFaith.HouseOfWorship] tại [temple_barony.GetNameNoTier]!"" 
 court.8090.desc.castle:0 "[ROOT.Char.Custom('FortifiedBuilding')] của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] tại [my_barony.GetNameNoTier]!"" 
 court.8090.desc.outro:0 "\n\n[steward.GetFirstNameNoTooltip] xoa cằm [steward.GetHerHis] một cách nghi ngờ, \"Tuy nhiên, nghe có vẻ như rất nhiều công việc, và những người dân địa phương sử dụng những vật liệu đó sẽ không thích đâu.\" \n\n[architect.GetFirstNameNoTooltip] đảo mắt [architect.GetHerHis] với sự phản đối hợp lý này,"
 court.8090.desc.chaplain:0 "nhưng bị [chaplain.GetHeldCourtAndCouncilPositionsString] của ta cắt lời: "Ngôi [ROOT.Char.GetFaith.HouseOfWorship] gần [temple_barony.GetNameNoTier] đang rất cần mở rộng;" [chaplain.GetTitledFirstName] reo lên. "Đống đá đó nên được chuyển đến đó!"" 
 court.8090.desc.fallback:0 "cười khẩy, "Chúng ta có thể sử dụng chúng tốt hơn đám dân thường nhiều, ngươi biết mà!"" 
 court.8090.a:0 "[my_barony.GetNameNoTierNoTooltip] #EMP có thể#! cần được tu sửa..."
 court.8090.b:0 "Chúng sẽ được đưa đến ngôi nhà của [ROOT.Char.GetFaith.HighGodNamePossessive] tại [temple_barony.GetNameNoTierNoTooltip]."
 court.8090.c:0 "Một kiến trúc sư danh tiếng như ngươi có thể làm tốt hơn, [architect.GetFirstNameNoTooltip]!"
 court.8090.c.tt: "Tùy chọn này có vì [architect.GetFirstNameNoTooltip] là $royal_architect_court_position$ của ngươi"
 court.8090.d:0 "Cứ để đống đá cũ kỹ đó cho dân thường."
 # Modifiers
 court_8090_commoners_modifier:0 "Tàn Tích Cho Dân Thường"
 court_8090_commoners_modifier_desc:0 "Dân thường trong quận này được hưởng lợi từ việc lấy vật liệu xây dựng từ những tàn tích cũ."
 # # Questionable Concoction
 court.8100.t:0 "Thứ Thuốc Đáng Ngờ"
 court.8100.desc:0 "Khi đi giữa các buổi tiếp kiến, ta nghe thấy $court_physician_court_position$ [ROOT.Char.Custom2('DescriptorPositive', SCOPE.sC('physician'))] của mình, [physician.GetTitledFirstName], đang bàn về ý tưởng mới nhất của [physician.GetHerHis]. \n\n"...người ta nói đây là thứ thuốc mạnh nhất tồn tại, chỉ đến từ những vùng xa xôi nhất thế giới — ít nhất là theo lời các thương nhân và giả kim mà ta đã nói chuyện." \n\n[physician.GetSheHe|U] rút ra một lọ chất lỏng vàng nhạt, xoay nhẹ dưới mũi các cận thần của ta. \n\n"Người ta nói nó ban cho sức sống và tuổi thọ dài lâu, thường được dùng trước khi ra trận, nhưng chỉ những người mạnh nhất mới chịu nổi sức mạnh của nó.""
 court.8100.a:0 "Thuốc mạnh nhất, ngươi nói sao? Đưa đây."
 court.8100.b:0 "Thật vậy sao? Hãy để $food_taster_court_position$ của ta thử trước."
 court.8100.b.tt_forgiving:1 "[food_taster.GetTitledFirstName] không phải $trait_forgiving$:"
 court.8100.c:0 "Chỉ [ROOT.Char.GetFaith.HighGodName] mới có thể ban cho chúng ta sức mạnh."
 court.8100.d:0 "Thứ nước rác đó không đáng cho thú uống, chứ đừng nói con người!"
 court.8100.tt.handle_potion:0 "Ngươi chịu được thứ thuốc mạnh nhất"
 court.8100.tt.need_weaker:0 "Lẽ ra nên tìm thứ thuốc yếu hơn"
 court.8100.tt.too_strong:0 "Thứ thuốc quá mạnh đối với ngươi"
 # Modifiers
 strong_potion_modifier:0 "Thuốc Mạnh"
 strong_potion_modifier_desc:0 "Nhân vật này đã chịu được những loại thuốc mạnh nhất."
 feeling_unwell_modifier:0 "Cảm Thấy Không Khỏe"
 feeling_unwell_modifier_desc:0 "Nhân vật này lẽ ra nên tìm loại thuốc nhẹ hơn."
# # Upon the Block
 court.8110.t:0 "Lên Đoạn Đầu Đài"
 court.8110.desc.intro:0 "Tên $executioner_court_position$ [my_executioner.Custom('quirk_neg_adjective')] của ta, [my_executioner.GetTitledFirstName], lững thững khắp cung điện [my_executioner.Custom('quirk_neg_pp')], với tất cả sự tinh tế của một đứa trẻ đang dỗi.\n\nCuối cùng ta không thể chịu nổi những màn đáng thương này trong triều nữa và quát: \"Rốt cuộc #EMP là#! chuyện gì?!\"\n\n[my_executioner.GetSheHe|U] giật mình, nhưng nhanh chóng đáp: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], xin thứ lỗi, chỉ là đã nhiều tuần rồi thần chưa có một vụ hành hình ra hồn...\" \n\n\"Nào, cái tên đó—\""
 court.8110.desc.leader_1:0 "kẻ kích động loạn dân đáng ghét, [prisoner_1.GetTitledFirstName],"
 court.8110.desc.heretic:0 "tên dị giáo trơ tráo, [prisoner_1.GetTitledFirstName],"
 court.8110.desc.heathen:0 "kẻ ngoại đạo bẩn thỉu, [prisoner_1.GetTitledFirstName],"
 court.8110.desc.infidel:0 "tên vô đạo khốn kiếp, [prisoner_1.GetTitledFirstName],"
 court.8110.desc.noble:0 "tên ác nhân đáng khinh, [prisoner_1.GetTitledFirstName],"
 court.8110.desc.fallback:0 "kẻ phạm tội đáng ghét [prisoner_1.Custom('GetCrime')], [prisoner_1.GetTitledFirstName],"
 court.8110.desc.body:0 "đang chỉ #EMP mục rữa#! trong ngục, chờ ngài tuyên bố ngày hành hình."
 court.8110.desc.religious:0 "Đối với [ROOT.Char.GetFaith.DeathDeityName], việc linh hồn bất kính đó tới [ROOT.Char.GetFaith.NegativeAfterLife] lúc nào cũng chẳng khác biệt gì..."
 court.8110.desc.leader_2:0 "Chừng nào [prisoner_1.GetSheHe] còn sống, [prisoner_1.GetSheHe] vẫn có thể trở thành biểu tượng cho những kẻ phản loạn khác..."
 court.8110.desc.criminal:0 "Hãy cho phép tôi chấm dứt nỗi đau khổ [prisoner_1.GetHerHis] của tên [prisoner_1.Custom('GetCrimeDesc')] đó đi...\""
 court.8110.a:0 "Được thôi, đã đến lúc của [prisoner_1.GetTitledFirstNamePossessiveNoTooltip]."
 court.8110.b:0 "Không, tiếp theo sẽ là lượt của [prisoner_2.GetTitledFirstNamePossessiveNoTooltip]."
 court.8110.c:0 "Đúng vậy, và #EMP ngươi#! cũng là một kẻ [my_executioner.Custom('GetCrime')]!"
 court.8110.c.flavor:0 "$executioner_court_position$ của ta nên biết vị trí của mình"
 court.8110.d:0 "Ngươi tận hưởng chuyện này quá mức rồi, [my_executioner.GetFirstNameNoTooltip]."
 court.8110.e:0 "Không cần vội."
 # # Novel Perspectives
 court.8120.t:0 "Những Góc Nhìn Mới"
 court.8120.desc.intro:0 "Ta ngồi lặng lẽ, lắng nghe [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('accuser') )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('accuser'))] của ta, [accuser.GetTitledFirstName], đang bị khóa chặt trong một cuộc tranh luận thần học gay gắt với [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('refuter'))] của ta, [refuter.GetTitledFirstName]. \n\nNgười sau cầu khẩn [refuter.Custom('quirk_pos_adverb')],"
 court.8120.desc.same_religion:0 "\"...nhưng [refuter.GetFaith.GetNameNoTooltip] #EMP mới#! gần với lời dạy chân chính của [refuter.GetFaith.HighGodName]; đó là sự kết tinh thuần khiết nhất của mặc khải [refuter.GetFaith.GetReligion.GetAdjectiveNoTooltip].\"\n\n[accuser.GetTitledFirstNameNoTooltip] khịt mũi, [accuser.Custom('quirk_neg_pp')]. \"Hãy đọc [accuser.GetFaith.ReligiousText] và ngươi sẽ thấy rằng\""
 court.8120.desc.other_religion:0 "\"...nhưng những giáo lý [accuser.GetFaith.GetReligion.GetAdjectiveNoTooltip] lạc hậu không thể được so sánh một cách nghiêm túc với những giáo lý của [refuter.GetFaith.GetReligion.GetNameNoTooltip] chúng ta; chân lý của [accuser.GetFaith.HighGodNamePossessive] chỉ là một sự bóp méo chân lý của [refuter.GetFaith.HighGodNamePossessive].\"\n\n[accuser.GetTitledFirstNameNoTooltip] chế giễu, [accuser.Custom('quirk_neg_pp')]. \"Hãy suy nghĩ sâu sắc về điều đó và ngươi sẽ thấy rằng\""
 court.8120.desc.marriage:0 "mối ràng buộc thiêng liêng của hôn nhân chỉ nên chia sẻ với một người duy nhất; đó là cách chúng ta tiến gần hơn tới [accuser.GetFaith.PositiveAfterLife]."
 court.8120.desc.divorce:0 "ly hôn là dành cho những kẻ không sẵn lòng tận hiến trọn vẹn cho người bạn đời của mình, theo đuổi sự thanh khiết và [accuser.GetFaith.PositiveAfterLife]. \n\n"
 court.8120.desc.adultery:0 "[accuser.GetFaith.CreatorName] không tạo ra chúng ta để gian dâm ngoài hôn nhân và chạy theo dục vọng; đó chính là #EMP lý do#! chúng ta có những ràng buộc này!"
 court.8120.desc.witchcraft:0 "những nghi lễ ô uế của phù thủy đi ngược lại con đường hướng tới [accuser.GetFaith.PositiveAfterLife]."
 court.8120.desc.equality:0 "[accuser.GetFaith.CreatorName] tạo ra nam và nữ cùng nhau, không ai phục tùng ai, ngay từ thuở ban đầu."
 court.8120.desc.cosanguity:0 "[accuser.GetFaith.CreatorName] không hề muốn các thành viên cùng huyết thống kết hôn hay sinh sản với nhau; đó là một cám dỗ trái với tự nhiên!"
 court.8120.desc.outro:0 "\n\n\"Đó là lý do ta không nói chuyện với những kẻ lạc lối...\" [refuter.GetTitledFirstNameNoTooltip] thở dài thất vọng. \"Nếu ngươi không chịu nghe chân lý, ta chỉ hy vọng ngươi somehow tránh được [accuser.GetFaith.NegativeAfterLife].\""
 court.8120.a.accuser:0 "[accuser.GetSheHe|U] nói cũng có lý đấy, [refuter.GetFirstNameNoTooltip]."
 court.8120.a.refuter:0 "[refuter.GetSheHe|U] nói cũng có lý đấy, [accuser.GetFirstNameNoTooltip]."
 court.8120.c:0 "Bằng hữu à, có nhiều cách để tôn vinh đấng tạo hóa."
 court.8120.d:0 "Hãy nhìn đây, đây mới là chân lý của [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]!"
 court.8120.d.tt:0 "Mọi [vassal|E], [courtier|E] và [guest|E] cuồng tín theo [THIS.Char.GetFaith.GetAdjectiveNoTooltip]"
 court.8120.e:0 "Ta không muốn nghe những lời như thế nữa, [accuser.GetFirstNameNoTooltip]."
 court.8120.f:0 "Tranh luận về thần linh không phải việc của chúng ta."
 my_holy_book:0 "[ROOT.Char.GetTitledFirstNamePossessiveNoTooltip] [ROOT.Char.GetFaith.ReligiousText|U]"
 my_holy_book_description:0 "Bản sưu tập giáo lý [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] được đóng thành sách riêng của [ROOT.Char.GetTitledFirstNameNoTooltip] xứ [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierPossessiveNoTooltip], bìa khắc biểu tượng [ROOT.Char.GetFaith.ReligiousSymbol] bằng vàng."
 # # Contrived Conflict
 court.8130.t:0 "Xung Đột Bày Đặt"
 court.8130.desc.intro:0 "Khi ta đang ngồi trên ngai, suy nghĩ vẩn vơ, một cơn náo loạn bỗng bùng lên. \n\n$champion_court_position$ của ta, [champion.GetFirstName], gầm lên: \"Ta biết rõ ngươi ám chỉ điều gì, đồ [vassal.Custom2('InsultNoun', SCOPE.sC('champion'))]! Ngươi dám #EMP cả gan#! xúc phạm [ROOT.Char.GetTitleAsNameNoTooltip] của chúng ta sao?!\" ngay trước mặt [vassal.GetTitledFirstName] đang bối rối. [mediator.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vội xen vào tách họ ra, nhưng bầu không khí đã hoàn toàn hỏng bét. \n\n"
 court.8130.desc.bold:0 "\"Sự khuấy động như vậy thật thấp kém so với triều đình này, ta sẽ không bị khuất phục bởi những trò chơi của ngươi.\" [vassal.GetTitledFirstNameNoTooltip] đáp trả [vassal.Custom('quirk_pos_adverb')]. $court.8130.desc.body$ [vassal.GetTitleAsNameNoTooltip] [vassal.Custom('quirk_pos_present')] và trả lời, \"Rất tốt, ta sẽ vui lòng đặt tên [champion.Custom2('InsultAdjective', SCOPE.sC('vassal'))] thô lỗ này vào vị trí [champion.GetHerHis] của hắn.\""
 court.8130.desc.craven:0 "\"N-nhưng ta đâu có nói c-chuyện đó!\" [vassal.GetTitledFirstNameNoTooltip] lắp bắp đầy kinh ngạc. $court.8130.desc.body$ [vassal.GetTitleAsNameNoTooltip] [vassal.Custom('quirk_pos_present')] rồi lắp bắp, \"C-cái gì?! Thôi nào, chắc không cần phải làm vậy đâu?!\""
 court.8130.desc.body:0 "\"Ta nghe rõ bằng chính tai mình!\" [champion.GetFirstNameNoTooltip] gầm lại, \"Ta yêu cầu được rửa nhục vì sự xúc phạm này đối với [ROOT.Char.GetLadyLord]!\""
 court.8130.desc.outro:0 "\n\nMọi ánh mắt đều hướng về ta chờ phán quyết, trong khi [mediator.GetFirstNameNoTooltip] cố giữ hai người tách ra."
 court.8130.a:0 "[champion.GetFirstNameNoTooltip] sẽ bảo vệ danh dự của ta."
 court.8130.a.tt_champion:0 "[champion.GetTitledFirstNameNoTooltip] thắng trận đấu tay đôi"
 court.8130.a.tt_vassal:0 "[vassal.GetTitledFirstNameNoTooltip] thắng trận đấu tay đôi"
 court.8130.a.tt:0 "[champion.GetTitledFirstName] và [vassal.GetTitledFirstName] sẽ [single_combat_duel|E]"
 court.8130.b:0 "Chỉ là hiểu lầm; [vassal.GetFirstNameNoTooltip] là một chư hầu trung thành."
 court.8130.b.tt_me:0 "Ta thắng trận đấu tay đôi"
 court.8130.c:0 "Ta cần những thuộc hạ biết suy nghĩ hơn."
 court.8130.d:0 "[vassal.GetSheHe|U] nói #EMP cái gì cơ?!#! Mang [ROOT.Char.Custom('signature_weapon')] của ta tới!"
 court.8130.d.tt:0 "[vassal.GetTitledFirstName] và ta sẽ [single_combat_duel|E]"
 court.8130.e:0 "Bình tĩnh lại, sẽ không có trận đấu nào cả."
 # # Royal Lapse
 court.8140.t:0 "Khoảnh Khắc Lơ Đãng Của Bậc Quân Vương"
 court.8140.desc:0 "Những nghi lễ triều đình vẫn tiếp diễn ngày này qua ngày khác, từ bình minh tới hoàng hôn. [vassal_2.GetTitledFirstName] ngẫu hứng ca tụng sự vĩ đại của ta, tuôn ra những lời nịnh bợ rỗng tuếch. Gần đó [vassal_1.GetTitledFirstName] cũng nhập cuộc, cố làm trò trước đám đông, cười ngu ngốc và mong chờ dấu hiệu ưu ái từ ta cho những trò hề của [vassal_1.GetHerHis]. Một giọt mồ hôi đơn độc chậm rãi lăn dài trên trán ta... \n\n[vassal_2.GetFirstNameNoTooltip] nhận ra sự lơ đãng của ta và hỏi: \"Ngài vẫn ổn chứ, [ROOT.Char.Custom('FormOfAddressForLiege')]?\" với chút quan tâm gần như chân thành.\n\n\"Ta cần nghỉ một chút.\""
 court.8140.a:0 "Xin lỗi, ngươi đang nói tới đâu rồi?"
 court.8140.a.flavor_tt:0 "Tập trung lại đi, ngươi là [ROOT.Char.GetTitleAsNameNoTooltip]!"
 court.8140.b:0 "Thứ lỗi, ta còn việc khác phải xử lý."
 court.8140.b.flavor_tt:0 "Ta cần [ROOT.Char.Custom('GetStressDesire')]. NGAY."
 court.8140.c.1: "[vassal_1.GetTitledFirstNameNoTooltip], hãy dẫn chúng ta cầu nguyện."
 court.8140.c.2: "[vassal_1.GetTitledFirstNameNoTooltip], hãy tổ chức một bữa tiệc!"
 court.8140.c.3: "[vassal_1.GetTitledFirstNameNoTooltip], chuẩn bị lên đường thôi."
 court.8140.c.flavor_tt:0 "Điều đó chắc sẽ giúp tâm trí ta nhẹ nhõm!"
 court.8140.d.1: "[vassal_2.GetTitledFirstNameNoTooltip], hãy tổ chức một cuộc săn!"
 court.8140.d.2: "[vassal_2.GetTitledFirstNameNoTooltip], mang cho ta một con ngựa mới."
 court.8140.d.3: "[vassal_2.GetTitledFirstNameNoTooltip], khoa học của ngươi khuyên điều gì?"
 court.8140.d.flavor_tt: "Nghe thật thú vị!"
 court_event_discount_desc: "Sự Kiện Triều Đình"
 court.8140.c.tt: "Ngươi có thể tổ chức một [GetActivityType('activity_feast').GetName] trong 5 năm tới với giá giảm một nửa."
 court.8140.d.tt: "Ngươi có thể tổ chức một [GetActivityType('activity_hunt').GetName] trong 5 năm tới với giá giảm một nửa."
 healthy_strolls_modifier: "Tản Bộ Lành Mạnh"
 healthy_strolls_modifier_desc: "Nhân vật này đã học được giá trị của việc đi bộ và hít thở không khí trong lành mỗi ngày."
 enjoy_the_travel_modifier: "Tận Hưởng Hành Trình"
 enjoy_the_travel_modifier_desc: "Nhân vật này thích rong ruổi trên đường và luôn tận hưởng chuyến đi."
 court.8140.c.tt.2: "Ngươi có thể tổ chức một [GetActivityType('activity_pilgrimage').GetName] trong 10 năm tới với giảm giá 25%."
# # Prandial Excess
 court.8150.t:0 "Yến Tiệc Quá Đà"
 court.8150.desc.intro:0 "Dường như mỗi ngày trong triều đều rộn ràng bàn tán về bữa tiệc tiếp theo, và nhiều người gần đây đã trở nên béo tốt hơn hẳn..."
 court.8150.desc.taster:0 "\n\n[food_taster.GetTitledFirstName], $food_taster_court_position$ của ta, ngày càng uể oải sau mỗi buổi nếm thử, mồ hôi đổ nhiều hơn mỗi khi một món ăn ngoại lai được đưa tới miệng [food_taster.GetHerHis]. \n\n"
 court.8150.desc.body:0 "Hoạt động ẩm thực được thúc đẩy bởi sự tranh đua liên tục của [vassal_1.GetTitledFirstName], [vassal_2.GetTitledFirstName], và [vassal_3.GetTitledFirstNamePossessive] nhằm yêu cầu những bữa ăn đáng nhớ nhất từ những đầu bếp quá tải của ta. \n\nHôm nay, chính [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('demander'))] của ta, [demander.GetFirstNameNoTooltip], là người đang nhỏ dãi: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], tối nay tôi sẽ để nhà bếp chuẩn bị loại nước sốt đậm đà nhất mà con người từng biết, phục vụ cùng với món gà mười loại,\" vừa nói vừa liếm môi [demander.GetHerHis] một cách thèm khát. \n\n"
 court.8150.desc.almoner_chaplain:0 "$high_almoner_court_position$ của ta, [high_almoner.GetTitledFirstName], cùng [chaplain.GetCouncilTitleFirstName] tặc lưỡi, lắc đầu với vẻ khinh miệt không giấu giếm."
 court.8150.desc.chaplain:0 "[chaplain.GetCouncilTitleFirstName] thở dài đầy vẻ không tán thành, \"Những khoái lạc phù du này không là gì so với ân huệ [chaplain.GetFaith.HighGodNamePossessive]...\""
 court.8150.desc.almoner:0 "[high_almoner.GetTitledFirstName], người giữ chức $high_almoner_court_position$ của ta, nhăn mũi [high_almoner.GetHerHis] của ngài, lầm bầm về những người nghèo đang đói khát..."
 court.8150.a:0 "Ta không chờ nổi nữa!"
 court.8150.b:0 "Triều đình #EMP của ta#! chỉ xứng với thứ tốt nhất."
 court.8150.c:0 "Sự xa hoa này đã đi quá xa!"
 court.8150.d:0 "Ngươi vẫn chưa thấy đủ sao?"
 court.8150.a.tt: "Được tôi luyện qua nghìn món ăn, ý chí của [food_taster.GetTitledFirstNamePossessiveNoTooltip] đã được thử thách và [food_taster.GetSheHe] trở nên mạnh mẽ hơn: [aptitude|E] tăng."
 food_taster_mettle_tested_desc: "Ý Chí Được Thử Thách"
 court.8150.b.tt: "Khi triều đình ngừng ăn uống quá độ, [high_almoner.GetTitledFirstNameNoTooltip] gần như có nguồn thực phẩm vô tận để bố thí cho người nghèo: [aptitude|E] tăng."
 plenty_to_donate_almoner_desc: "Dư Dả Để Bố Thí"
 # # Foremost Knight
 court.8160.t:0 "[ROOT.Char.Custom('MountedWarriorTerm')|U] Xuất Sắc Nhất"
 court.8160.desc.intro:0 "Sự ganh đua lành mạnh giữa những chiến binh gan dạ là điều dễ hiểu, nhưng mâu thuẫn ngày càng tăng giữa [knight_1.GetFirstName] và [knight_2.GetFirstName] đang làm bầu không khí tại triều đình trở nên nặng nề. \n\n[knight_1.GetTitledFirstNameNoTooltip] được nhiều người xem là người có kỹ nghệ vượt trội, nhưng [knight_2.GetTitledFirstNameNoTooltip] rõ ràng không chấp nhận lời khẳng định đó. \n\nNgay giữa buổi thiết triều, người sau xông thẳng vào đại sảnh của ta, tay nắm chặt chuôi kiếm của [knight_2.GetHerHis], hét lớn \"[knight_1.GetFirstNameNoTooltip]! Chỉ một trong chúng ta có thể tự xưng là [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] [ROOT.Char.Custom('MountedWarriorTerm')] thiện chiến nhất, ra ngoài kia gặp ta và ta sẽ giải quyết chuyện này!\"\n\n[knight_1.GetTitledFirstNameNoTooltip] đáp lại [knight_2.Custom('quirk_neg_adverb')], \"Ta đã chém ngươi thành từng mảnh ngay tại chỗ nếu không vì sự hiện diện của [ROOT.Char.GetTitleAsNameNoTooltip] của ta, đồ [knight_2.Custom('quirk_neg_adjective')] [knight_2.Custom2('InsultNoun', SCOPE.sC('knight_1'))]! Hãy xin lỗi, và ta có thể tha mạng cho ngươi!\" \n\nTa phải hành động nhanh nếu muốn ngăn sự leo thang này..."
 court.8160.a:0 "Cả hai ngươi sẽ trực tiếp phục vụ ta."
 court.8160.a.tt: "[knight_1.GetFirstNameNoTooltip] và sự kình địch với [knight_2.GetFirstNamePossessiveNoTooltip] khiến họ, miễn là còn cùng phục vụ, sẽ dốc hết khả năng trong vị trí của mình: [aptitude|E] tăng."
 competing_knight_position_desc: "Kỵ Sĩ Kình Địch"
 court.8160.a.tt_knight_1:0 "[knight_1.GetTitledFirstNameNoTooltip] thắng trận đấu tay đôi"
 court.8160.a.tt_knight_2:0 "[knight_2.GetTitledFirstNameNoTooltip] thắng trận đấu tay đôi"
 court.8160.b:0 "Tịch thu kiếm của họ! Cho họ dùng kiếm tập."
 court.8160.c:0 "Ta sẽ dạy cho cả hai ngươi một bài học!"
 court.8160.c.tt:0 "Ngươi sẽ đấu tay đôi với [knight|E] có [prowess|E] cao hơn ([knight_1.GetTitledFirstName])"
 court.8160.c.tt_win:0 "Ngươi chiến thắng"
 court.8160.c.tt_lose:0 "Ngươi thất bại"
 court.8160.d:0 "Hãy chứng minh điều đó trên chiến trường, không phải trong triều!"
 court.8163.t:0 "Ngươi thắng trận đấu"
 court_humiliation_modifier:0 "Sỉ Nhục Trước Triều"
 court_humiliation_modifier_desc:0 "Nhân vật này đã bị hạ nhục trước toàn thể triều đình."
 court.8162.tt: "Sau khi chứng minh sự vượt trội [sc_victor.GetHerHis] của mình trong một cuộc đấu tay đôi công bằng, [sc_victor.GetFirstNameNoTooltip] được công nhận là [ROOT.Char.Custom('MountedWarriorTerm')] giỏi hơn và là người đủ tiêu chuẩn nhất để trở thành $bodyguard_court_position$ hoặc $champion_court_position$ của ngài: [aptitude|E] Đã tăng."
 best_knight_position_desc: "Kỵ Sĩ Xuất Sắc Nhất"
 fostering_competitiveness_modifier: "Khuyến Khích Tinh Thần Cạnh Tranh"
 fostering_competitiveness_modifier_desc: "Nhân vật này khuyến khích sự cạnh tranh giữa quân lính của mình trên chiến trường."
 # # Pariah of Court
 court.8170.t:0 "Kẻ Bị Ruồng Bỏ Tại Triều"
 court.8170.desc.intro_scary:0 "Lũ trẻ trong triều bỏ chạy khi '[criminal.GetFirstName] kẻ [criminal.Custom('GetCrime')|U]' tiến đến, và ngay cả những [ROOT.Char.GetFaith.BishopNeuterPlural] nhiệt thành nhất cũng không khỏi rụt lại trước sự hiện diện của [criminal.GetHerHis]."
 court.8170.desc.intro_sordid:0 "'[criminal.GetFirstName] kẻ [criminal.Custom('GetCrime')|U]' là một nhân vật bị khinh miệt tại triều, sống trong sự xa lánh và trở thành trò cười cho vô số lời đùa cợt bẩn thỉu."
 court.8170.desc.intro_religious:0 "Ta bị phán xét khắc nghiệt vì lòng hiếu khách của mình đối với '[criminal.GetFirstName] kẻ [criminal.Custom('GetCrime')|U]', người bị hầu hết mọi người tránh xa vì đức tin tà ác của họ."
 court.8170.desc.intro_fallback:0 "Triều đình của ta không thể tìm ra lời biện minh nào cho việc ta tiếp đãi '[criminal.GetFirstName] kẻ [criminal.Custom('GetCrime')|U]', kẻ bị xem là một sự ô nhục trong nơi vốn đầy danh giá này."
 court.8170.desc.body:0 "\n\nViệc ta không lên án, và vẫn tiếp tục để kẻ này ở gần, một [criminal.Custom('GetCrimeDesc')], bị xem như sự dung túng công khai, làm hoen ố danh tiếng triều đình ta trong mắt các [ROOT.Char.GetFaith.AltPriestTermPlural] và tín đồ...\n\nHọ đã ép ta phải hành động, và giờ ta phải quyết định liệu tội lỗi của [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('criminal'))] có lớn hơn tình cảm của ta dành cho [criminal.GetHerHim] hay không — chắc chắn phải có điều gì đó được thực hiện,"
 court.8170.desc.family:0 "dù cho [criminal.GetSheHe] là một người của gia tộc [criminal.GetDynasty.GetNameNoTooltip]..."
 court.8170.desc.guest:0 "dù sao thì [criminal.GetSheHe] cũng chỉ là một lữ khách."
 court.8170.desc.fallback:0 "chẳng lẽ các cận thần lại khó thay thế đến vậy?"
 court.8170.a.family:0 "Không — gia tộc là trên hết."
 court.8170.a.other:0 "Phán xét không phải việc của ta."
 court.8170.b:0 "Ngươi phải sám hối, [criminal.GetFirstNameNoTooltip]!"
 court.8170.c1: "[criminal.GetSheHe|U] kẻ không thấy công lý sẽ không còn thấy gì nữa!"
 court.8170.c2: "Dòng máu bị nguyền rủa của [criminal.GetFirstNamePossessiveNoTooltip] sẽ chấm dứt cùng hắn."
 court.8170.c3: "Chỉ cái chết mới có thể rửa sạch tội lỗi của [criminal.GetHerHis]."
 court.8170.d:0 "Ta không thể tiếp đãi ngươi nữa, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('criminal'))]..."
 harbors_criminals_modifier:0 "Kẻ Che Chở Hạng Người Mờ Ám"
 harbors_criminals_modifier_desc:0 "Nhân vật này không làm gì để đưa tội phạm trong triều của mình ra trước công lý. Dù sao thì họ cũng có ích."
 fast_hard_justice_modifier: "Công Lý Nhanh Và Nghiêm"
 fast_hard_justice_modifier_desc: "Nhân vật này đã nổi tiếng vì xử lý tội phạm một cách hiệu quả."
 # # Secrets and Lies
 court.8180.t:0 "Bí Mật Và Dối Trá"
 court.8180.desc.intro:0 "Có những ngày trôi qua mà ta thậm chí không nghĩ tới, nhưng mỗi khi bắt gặp ánh mắt của [criminal.GetTitledFirstNamePossessive] tại triều, ta chỉ nghĩ đến tội lỗi của [criminal.GetHerHis]. \n\nTa tự hỏi có bao nhiêu người trong triều biết chuyện — có lẽ không ai? Hoặc có lẽ tất cả... Sự thật rồi cũng sẽ lộ ra, và danh tiếng của ta chắc chắn không được lợi gì khi những tai tiếng như vậy tồn tại giữa các cận thần của mình... \n\n[criminal.GetSheHe|U] phải bị xử lý, nếu không ta sẽ phải trả lời trước [ROOT.Char.GetFaith.HighGodName], chưa nói đến triều đình."
 court.8180.a:0 "Đủ rồi. Cả thế gian phải biết."
 court.8180.b:0 "Chỉ kẻ ngốc mới không tận dụng kiến thức này."
 court.8180.c:0 "[criminal.GetSheHe|U] đáng phải vào ngục."
 court.8180.d:0 "Đã đến lúc [criminal.GetHerHim] phải rời đi."
 court.8180.e:0 "Chưa cần phải hành động..."
 liege_scrutiny_modifier: "Bị Lãnh Chúa Giám Sát"
 liege_scrutiny_modifier_desc: "Lãnh chúa của nhân vật này đang theo dõi họ rất chặt chẽ — cùng những hoạt động bí mật của họ."
 court_without_secrets_modifier: "Triều Đình Không Bí Mật"
 court_without_secrets_modifier_desc: "Nhân vật này nổi tiếng vì săn lùng bí mật và trừng phạt tội ác không khoan nhượng."
