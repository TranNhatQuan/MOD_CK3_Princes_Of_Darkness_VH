l_english:
 # Court Position Boons
 employer_booner_invalidated_tt: "#weak Modifier sẽ bị gỡ bỏ nếu [position_holder.GetShortUIName|V] mất [court_position|E] này hoặc không còn ở cùng [court|E] với [THIS.Char.GetShortUIName|V]#!"
 employer_boon_target_invalidated_title: "Cận thần mất Ân Huệ"
 employer_booner_invalidated_title: "Mất Ân Huệ Chức Vụ Triều Đình"
 # Physician
 court.8190.t: "Lương Y [position_holder.GetFirstNameNoTooltip]"
 court.8190.desc: "[position_holder.Custom('ComplimentAdjective')] [GetCourtPositionType('court_physician_court_position').GetName()] của ta, [position_holder.GetTitledFirstName], là một vị thầy thuốc thực thụ, luôn sẵn sàng với một số phương thuốc hoặc thuốc đắp thích hợp ngay tại những dấu hiệu đầu tiên của một chứng bệnh nhẹ nhất của một triều thần.\n\nNhững tài năng [position_holder.GetHerHis|U] của ngài dường như bị lãng phí, khi [position_holder.GetSheHe] phải căng mình ra để điều trị cho những cư dân đầy yêu cầu của toàn bộ triều đình [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]."
 court.8190.a: "Ta cần ngươi chăm sóc kỹ hơn cho ta."
 court.8190.b: "Ngươi sẽ chăm lo cho người thừa kế của ta, [heir.GetFirstNameNoTooltip]."
 court.8190.c: "Hãy tập trung chữa trị cho [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] của ta, [child.GetFirstNameNoTooltip]."
 court.8190.d: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('spouse'))] của ta, [spouse.GetFirstNameNoTooltip], cần đến tài năng của ngươi."
 court.8190.e: "Trước mắt hãy chăm sóc [relation.GetFirstNameNoTooltip]."
 court.8190.f: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('family'))] của ta, [family.GetFirstNameNoTooltip], là bệnh nhân ưu tiên của ngươi."
 court.8190.g: "Hãy xem xét những phiền toái của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house'))] ta, nhà [house.GetFirstNamePossessiveNoTooltip]."
 employer_booner_court_physician_modifier: "Chăm Sóc Sát Sao"
 employer_booner_court_physician_modifier_desc: "Nhân vật này luôn được một $court_physician_court_position$ tài giỏi dốc sức chăm sóc."
 # Tutor
 court.8191.t: "Dạy Dỗ Đặc Biệt"
 court.8191.desc: "[position_holder.Custom('ComplimentAdjective')] [GetCourtPositionType('court_tutor_court_position').GetName()] của ta, [position_holder.GetTitledFirstName], là một giáo viên tài năng, khéo léo giữ cho lũ trẻ ngỗ nghịch vào khuôn khổ khi [position_holder.GetSheHe] điều hành việc học tập của chúng.\n\nSự chú ý [position_holder.GetHerHis|U] của ngài được dàn trải cho những đứa trẻ của triều đình [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip], nhưng vẫn còn chỗ cho một trong số chúng nhận được sự kèm cặp sát sao hơn dưới sự giám sát đáng tin cậy [position_holder.GetHerHis] của ngài."
 court.8191.a: "#EMP Ta#! muốn học thêm!"
 court.8191.b: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('heir'))] của ta, [heir.GetFirstNameNoTooltip], sẽ kế thừa và phải trở nên minh triết."
 court.8191.c: "Ta nghĩ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('struggling'))] của ta, [struggling.GetFirstNameNoTooltip], cần được giúp đỡ."
 court.8191.d: "Sao không tập trung vào [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] của ta, [hostage.GetFirstNameNoTooltip]?"
 court.8191.e: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('interesting'))] của ta, [interesting.GetFirstNameNoTooltip], có thể cần tài năng của ngươi."
 court.8191.f: "Hãy chú tâm đến việc học của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('oldest'))] ta, [oldest.GetFirstNamePossessiveNoTooltip]."
 court.8191.g: "Đã đến lúc [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('youngest'))] của ta, [youngest.GetFirstNameNoTooltip], mài giũa cây bút lông [youngest.GetHerHis] của con."
 court.8191.h: "Hãy tập trung vào [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('extra'))] của ta, [extra.GetFirstNameNoTooltip]."
 court.8191.i: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bonus'))] của ta, [bonus.GetFirstNameNoTooltip], sẽ hưởng lợi nhiều nhất."
 employer_booner_court_tutor_modifier: "Dạy Dỗ Đặc Biệt"
 employer_booner_court_tutor_modifier_desc: "Nhân vật này luôn là trọng tâm chú ý của một Gia Sư Triều Đình tài giỏi.\nCải thiện kết quả [education|E] của [child_possessive|E]"
 # Seneschal
 court.8192.t: "Quản Lý Chặt Chẽ"
 court.8192.desc: "Kể từ khi [position_holder.GetHerHis] được bổ nhiệm làm [GetCourtPositionType('seneschal_court_position').GetName()] của ta, [position_holder.GetTitledFirstName] đã luôn là một sự hiện diện đầy-[position_holder.Custom('ComplimentAdjective')], đảm bảo sự vận hành trơn tru của triều đình và gia đình ta.\n\nKhi ta suy ngẫm về sự bổ nhiệm tốt đẹp này, ta nghe thấy giọng nói [position_holder.GetHerHis] của ngài phía sau ta: \"[position_holder.Custom2('RelationToMeShort', ROOT.Char)|U], ta đã thấy có nhiều khoản tiết kiệm cần được thực hiện trong [ROOT.Char.Custom('ResidenceBuilding')|l] này, mặc dù ta tự hỏi ngài nghĩ khoản tiết kiệm nào là cần thiết nhất?\"\n\n[position_holder.GetSheHe|U] giơ cuốn sổ cái [position_holder.GetHerHis] của ngài lên, cùng một cặp lông mày đầy thắc mắc."
 court.8192.a: "Ta nghĩ có thể bớt chi ở đồ đạc."
 court.8192.b: "Hãy tận dụng đám người hầu cho tốt."
 court.8192.c: "Sao phải thỏa hiệp?"
 court.8192.c.success: "Ngươi giúp [position_holder.GetFirstNameNoTooltip]"
 court.8192.c.failure: "[position_holder.GetFirstNameNoTooltip] quá bận rộn"
 employer_booner_seneschal_1_modifier: "Tiết Kiệm Nơi Ở"
 employer_booner_seneschal_1_modifier_desc: "Các chư hầu của nhân vật này được một Quản Gia tài giỏi giám sát."
 employer_booner_seneschal_2_modifier: "Quản Lý Nghiêm"
 employer_booner_seneschal_2_modifier_desc: "Triều đình của nhân vật này nằm dưới sự quản lý của một Quản Gia tài giỏi.\nChi phí duy trì [court_amenity|E] nơi ở: #P -25%#!"
 employer_booner_seneschal_3_modifier: "Tiết Kiệm Của Quản Lý"
 employer_booner_seneschal_3_modifier_desc: "Triều đình và người hầu của nhân vật này nằm dưới sự quản lý của một Quản Gia tài giỏi.\nChi phí duy trì [court_amenity|E] nơi ở: #P -25%#!"
 # Wet Nurse
 court.8193.t: "Chăm Sóc Chu Đáo"
 court.8193.desc: "Vú nuôi [GetCourtPositionType('wet_nurse_court_position').GetName()] [position_holder.Custom('ComplimentAdjective')] của ta, [position_holder.GetTitledFirstName], rất tự nhiên với trẻ nhỏ, chăm sóc lũ nhóc như thể đó là con ruột của [position_holder.GetHerHis].\n\nTa hơi bất ngờ khi [position_holder.GetSheHe] hỏi ta giữa lúc đang quở trách một đứa trẻ: \"Trong triều [ROOT.Char.Custom('GetCourt')] này có đứa trẻ nào ngài muốn ta đặc biệt chú ý không, thưa [ROOT.Char.GetTitleAsNameNoTooltip]?\""
 court.8193.a: "#EMP Ta#! nên có toàn bộ thời gian [position_holder.GetHerHis] của ngài!"
 court.8193.b: "Người thừa kế trẻ của ta, [heir.GetFirstNameNoTooltip], là ưu tiên."
 court.8193.c: "Hãy chăm sóc đứa trẻ sơ sinh của ta, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('baby'))] [baby.GetFirstNameNoTooltip]."
 court.8193.d: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] của ta, [hostage.GetFirstNameNoTooltip], phải được chăm sóc tốt."
 court.8193.e: "Hãy chú ý tới [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('interesting'))] của ta, [interesting.GetFirstNameNoTooltip]."
 court.8193.f: "Đứa bé [sickest.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sickest'))] của ta, là ưu tiên của ngươi."
 court.8193.g: "Hãy dành thêm thời gian cho [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('second_sickest'))] của ta, [second_sickest.GetFirstNameNoTooltip]."
 court.8193.h: "Hãy đặc biệt chú ý tới [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('extra'))] của ta, [extra.GetFirstNameNoTooltip]."
 court.8193.i: "Ta muốn [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bonus'))] của ta, [bonus.GetFirstNameNoTooltip], lớn lên khỏe mạnh."
 employer_booner_wet_nurse_modifier: "Đứa Trẻ Được Cưng Chiều"
 employer_booner_wet_nurse_modifier_desc: "Nhân vật này luôn nhận được sự chăm sóc đặc biệt của một Vú Nuôi tài giỏi."
 # High Almoner
 court.8194.t: "Những Đối Tượng Cứu Tế"
 court.8194.desc: "[position_holder.Custom('ComplimentAdjective')] [GetCourtPositionType('high_almoner_court_position').GetName()] của ta, [position_holder.GetTitledFirstName], xử lý các trách nhiệm [position_holder.GetHerHis] của ngài với sự cẩn trọng lớn, và tổ chức từ thiện [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] đạt được danh tiếng rộng rãi hơn.\n\nDo đó, ta khá ngạc nhiên khi [position_holder.GetSheHe] hỏi ta, với một túi tiền kêu lanh lảnh trong lòng bàn tay [position_holder.GetHerHis] của ngài: \"Thời gian của tôi được chia giữa những người thực sự cần giúp đỡ và các lãnh chúa, quý bà mộ đạo của [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] — Tôi cần sự hướng dẫn của ngài, [ROOT.Char.Custom('FormOfAddressForLiege')]...\""
 court.8194.a: "Hãy ban ân sủng của [ROOT.Char.GetFaith.WealthGodNamePossessive] cho người nghèo."
 court.8194.b: "Đảm bảo số tiền bố thí này đến đúng nơi..."
 court.8194.c: "Ta thấy một cách có lợi cho tất cả."
 court.8194.c.success: "Ngươi giúp [position_holder.GetFirstNameNoTooltip]"
 court.8194.c.failure: "[position_holder.GetFirstNameNoTooltip] quá bận rộn"
 employer_booner_high_almoner_1_modifier: "Cứu Trợ Có Định Hướng"
 employer_booner_high_almoner_1_modifier_desc: "Những thần dân khốn khó của nhân vật này là trọng tâm của một Đại Thí Quan tận tụy."
 employer_booner_high_almoner_2_modifier: "Từ Thiện Phô Trương"
 employer_booner_high_almoner_2_modifier_desc: "Lương tâm của các chư hầu sùng đạo của nhân vật này là trọng tâm của một Đại Thí Quan tận tụy."
 employer_booner_high_almoner_3_modifier: "Cứu Trợ Phô Trương"
 employer_booner_high_almoner_3_modifier_desc: "Những thần dân khốn khó và lương tâm của các chư hầu sùng đạo của nhân vật này là trọng tâm của một Đại Thí Quan tận tụy."
 # Bodyguard
 court.8195.t: "Tự Rèn Luyện"
 court.8195.desc: "[GetCourtPositionType('bodyguard_court_position').GetName()] [position_holder.Custom('ComplimentAdjective')] của ta, [position_holder.GetTitledFirstName], là một chiến binh truyền cảm hứng trên sân tập, và là sự hiện diện khiến người ta yên tâm trong khắp [ROOT.Char.Custom('ResidenceBuilding')|l].\n\nMột ngày nọ [position_holder.GetSheHe] tiến đến chỗ ta, cầm kiếm tập trong tay, dẫn theo [portrait.GetFirstName], rồi hỏi: \"Ta đã nhận được vài lời thỉnh cầu xin huấn luyện, và ta sẽ nhận nếu được ngài cho phép, [ROOT.Char.Custom('FormOfAddressForLiege')]. Có ai ngài muốn ta dạy dỗ không?\""
 court.8195.a: "Ngươi sẽ đấu tập với #EMP ta#!!"
 court.8195.b: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('heir'))] của ta, người thừa kế [heir.GetFirstNameNoTooltip], phải trở nên mạnh mẽ."
 court.8195.c: "Ta nghĩ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('struggling'))] của ta, [struggling.GetFirstNameNoTooltip], cần sự chỉ dẫn của ngươi."
 court.8195.d: "Hãy tập trung huấn luyện [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] của ta, [hostage.GetFirstNamePossessiveNoTooltip]."
 court.8195.e: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('interesting'))] của ta, [interesting.GetFirstNameNoTooltip], có thể cần sự chú ý của ngươi."
 court.8195.f: "Hãy huấn luyện [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('oldest'))] của ta, [oldest.GetFirstNameNoTooltip]."
 court.8195.g: "Đã đến lúc [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('youngest'))] của ta, [oldest.GetFirstNameNoTooltip], học cách chiến đấu."
 court.8195.h: "Hãy để mắt tới [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('extra'))] của ta, [extra.GetFirstNameNoTooltip]."
 court.8195.i: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bonus'))] của ta, [bonus.GetFirstNameNoTooltip], sẽ hưởng lợi nhiều nhất."
 employer_booner_bodyguard_modifier: "Đấu Tập"
 employer_booner_bodyguard_modifier_desc: "Nhân vật này đang được một Cận Vệ tài giỏi trực tiếp huấn luyện."
 # Master of Horse
 court.8196.t: "Trên Yên Ngựa"
 court.8196.desc: "Tài năng của [GetCourtPositionType('master_of_horse_court_position').GetName()] [position_holder.Custom('ComplimentAdjective')] của ta, [position_holder.GetTitledFirstName], được mọi người công nhận là vô cùng quý giá.\n\nViệc huấn luyện và kỷ luật của bầy ngựa đã tiến bộ vượt bậc, và [position_holder.GetSheHe] có khả năng bẩm sinh trong việc kiểm soát cả những con ngựa lẫn các chỉ huy của chúng.\n\nHôm nay [position_holder.GetSheHe] đến gặp ta trong đại sảnh ngai vàng và hỏi thẳng: \"Thưa [ROOT.Char.GetTitleAsNameNoTooltip], ta nên lập quy định chuồng trại chặt chẽ hơn, hay tập trung vào việc huấn luyện?\""
 court.8196.a: "Hãy tiết kiệm tối đa chi phí cho bầy ngựa."
 court.8196.b: "Một chiếc yên trống thì vô dụng."
 court.8196.c: "Ngươi không thể làm cả hai sao?"
 court.8196.c.success: "Ngươi giúp [position_holder.GetFirstNameNoTooltip]"
 court.8196.c.failure: "[position_holder.GetFirstNameNoTooltip] quá bận rộn"
 employer_booner_master_of_horse_1_modifier: "Chuồng Trại Tiết Kiệm"
 employer_booner_master_of_horse_1_modifier_desc: "Chuồng ngựa của nhân vật này luôn nằm dưới sự giám sát của một Tổng Quản Chuồng Ngựa tài giỏi."
 employer_booner_master_of_horse_2_modifier: "Thăng Tiến Chỉ Huy"
 employer_booner_master_of_horse_2_modifier_desc: "Các sĩ quan kỵ binh của nhân vật này luôn được một Tổng Quản Chuồng Ngựa tài giỏi đào tạo.\nNhiệm vụ Huấn Luyện Chỉ Huy [councillor_task|E] hiệu quả hơn"
 employer_booner_master_of_horse_3_modifier: "Quản Lý Toàn Diện"
 employer_booner_master_of_horse_3_modifier_desc: "Chuồng ngựa và các sĩ quan kỵ binh của nhân vật này luôn nằm dưới sự giám sát của một Tổng Quản Chuồng Ngựa tài giỏi.\nNhiệm vụ Huấn Luyện Chỉ Huy [councillor_task|E] hiệu quả hơn"
 task_train_commanders_master_of_horse_2_bonus_desc: "\n$TAB$$employer_booner_master_of_horse_2_modifier$: #P +[SCOPE.ScriptValue('marshal_train_commanders_monthly_chance_value_base')|P]%#!"
 task_train_commanders_master_of_horse_3_bonus_desc: "\n$TAB$$employer_booner_master_of_horse_3_modifier$: #P +[SCOPE.ScriptValue('marshal_train_commanders_monthly_chance_value_base')|P]%#!"
 # Caravan Master
 court.8197.t: "[position_holder.Custom('QueenKing')] của Con Đường"
 court.8197.desc: "[position_holder.Custom('ComplimentAdjective')] [GetCourtPositionType('travel_leader_court_position').GetName()] của ta, [position_holder.GetTitledFirstName], là một nhà tổ chức bậc thầy: kể từ khi thuê [position_holder.GetHerHim], ngay cả những chuyến đi ngắn nhất cũng trở nên dễ dàng và nhanh chóng!\n\n[position_holder.GetSheHe|U] bận rộn [position_holder.GetHerselfHimself] cả ngày lẫn đêm, bổ sung nguồn cung cấp và cập nhật các hành trình [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]. Trong một khoảnh khắc, ta ngạc nhiên khi [position_holder.GetSheHe] nghiêm túc hỏi ta: \"[ROOT.Char.GetTitleAsNameNoTooltip] của tôi, điều gì giá trị hơn: thời gian của ngài hay sức khỏe của ngài?\""
 court.8197.a: "Ta chỉ muốn đến nơi an toàn!"
 court.8197.b: "Ta không được chần chừ — ta còn quá nhiều việc."
 court.8197.c: "Sự an toàn và thời gian của ta đều quan trọng như nhau!"
 court.8197.c.success: "Ngươi giúp [position_holder.GetFirstNameNoTooltip]"
 court.8197.c.failure: "[position_holder.GetFirstNameNoTooltip] quá bận rộn"
 employer_booner_travel_leader_1_modifier: "Hành Trình An Toàn"
 employer_booner_travel_leader_1_modifier_desc: "Nhân vật này luôn là trọng tâm nỗ lực của một Trưởng Đoàn Lữ Hành tài giỏi."
 employer_booner_travel_leader_2_modifier: "Tiết Kiệm Thời Gian"
 employer_booner_travel_leader_2_modifier_desc: "Nhân vật này luôn là trọng tâm nỗ lực của một Trưởng Đoàn Lữ Hành tài giỏi."
 employer_booner_travel_leader_3_modifier: "An Toàn Và Nhanh Chóng"
 employer_booner_travel_leader_3_modifier_desc: "Nhân vật này luôn là trọng tâm nỗ lực của một Trưởng Đoàn Lữ Hành tài giỏi."
 # Antiquarian
 court.8198.t: "Người Giám Bảo Tận Tâm"
 court.8198.desc: "[GetCourtPositionType('antiquarian_court_position').GetName()] [position_holder.Custom('ComplimentAdjective')] của ta, [position_holder.GetTitledFirstName], trông coi kho báu của ta rất chu đáo: các bảo vật luôn được lau chùi sạch sẽ, và [position_holder.GetSheHe] luôn sẵn sàng kể vài giai thoại cho bất kỳ vị khách tò mò — hoặc không mấy tò mò — nào.\n\nVới trách nhiệm quản lý toàn bộ kho báu của triều đình [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip], thời gian của [position_holder.GetHerHis] dĩ nhiên bị kéo căng, và sau khi ta khen ngợi công việc của [position_holder.GetHerHis], [position_holder.GetSheHe] hỏi liệu: \"...có bảo vật nào ngài muốn ta đặc biệt chú ý không, thưa [ROOT.Char.Custom('FormOfAddressForLiege')]?\""
 court.8198.a: "Ngươi có thể xem qua [weak_1.Custom('ArtifactType')] này không?"
 court.8198.b: "Có #EMP một#! [weak_2.Custom('ArtifactType')] kém chất lượng."
 court.8198.c: "Hãy xem giúp ta [weak_3.Custom('ArtifactType')] này."
 court.8198.d: "[broken_1.Custom('ArtifactType')] này cần được sửa chữa."
 court.8198.e: "[broken_2.Custom('ArtifactType')] của ta đang hư hỏng."
 court.8198.f: "Hãy chăm sóc [broken_3.Custom('ArtifactType')] này."
 court.8198.g: "Còn [weak_4.Custom('ArtifactType')] của ta thì sao?"
 court.8198.h: "Sửa chữa [broken_4.Custom('ArtifactType')] này nhé?"
 court.8198.i: "Không, cứ tiếp tục làm tốt như vậy!"
 employer_booner_antiquarian_modifier: "Người Giám Bảo Tận Tâm"
 employer_booner_antiquarian_modifier_desc: "Kho bảo vật của nhân vật này luôn nằm trong sự chăm sóc của một Cổ Vật Gia tài giỏi."
 court_8198_artifact_prowess_tooltip: "[THIS.Artifact.GetName] nhận [prowess|E]: #P +2#!"
 court_8198_artifact_court_grandeur_baseline_add_tooltip: "[THIS.Artifact.GetName] nhận thưởng [court_grandeur|E]: #P +2#!"
 court_8198_artifact_monthly_prestige_add_tooltip: "[THIS.Artifact.GetName] nhận [prestige|E] mỗi tháng: #P +0.02#!"
 court_8198_artifact_monthly_dynasty_prestige_tooltip: "[THIS.Artifact.GetName] nhận [dynasty_prestige|E] mỗi tháng: #P +0.01#!"
 court_8198_artifact_dynasty_opinion_tooltip: "[THIS.Artifact.GetName] nhận [dynasty|E] [opinion|E]: #P +3#!"

 # Hunt Master
 court.8199.t: "Bậc Thầy Săn Bắn"
 court.8199.desc: "[position_holder.Custom('ComplimentAdjective')] [GetCourtPositionType('master_of_hunt_court_position').GetName()] của ta, [position_holder.GetTitledFirstName], đã thể hiện rất tuyệt vời [position_holder.GetHerselfHimself], và tất cả đều đồng ý rằng thú săn [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] chưa bao giờ dồi dào đến thế.\n\nTa rất vui khi thấy [position_holder.GetHerHim] ló đầu [position_holder.GetHerHis] vào phòng ngai vàng của ta, vừa từ vùng hoang dã trở về với một câu hỏi khẩn cấp: \"[ROOT.Char.GetTitleAsNameNoTooltip] của tôi, một vài chư hầu của ngài đã nhờ tôi giúp đỡ với thú săn của họ, nhưng tôi cũng có kế hoạch cải thiện các khu săn bắn của ngài. Tôi nên làm gì đây?\""
 court.8199.a: "Hãy giữ cho thần dân của ta hài lòng."
 court.8199.b: "Cải thiện khu săn bắn, ngươi nói sao?"
 court.8199.c: "Sao không làm cả hai?"
 court.8199.c.success: "Ngươi giúp [position_holder.GetFirstNameNoTooltip]"
 court.8199.c.failure: "[position_holder.GetFirstNameNoTooltip] quá bận rộn"
 employer_booner_master_of_hunt_1_modifier: "Cố Vấn Săn Bắn"
 employer_booner_master_of_hunt_1_modifier_desc: "Bãi săn của các chư hầu nhân vật này luôn nằm trong sự chú tâm của một Tổng Quản Săn Bắn tài giỏi."
 employer_booner_master_of_hunt_2_modifier: "Quản Lý Thú Săn Mới"
 employer_booner_master_of_hunt_2_modifier_desc: "Bãi săn của nhân vật này luôn nằm trong sự chú tâm của một Tổng Quản Săn Bắn tài giỏi.\n[prestige_i|E][prestige|E] từ hoạt động [GetActivityType( 'activity_hunt' ).GetName] [activity|E]: #P +20%#!"
 employer_booner_master_of_hunt_3_modifier: "Cố Vấn Săn Bắn Toàn Diện"
 employer_booner_master_of_hunt_3_modifier_desc: "Bãi săn của nhân vật này và của các chư hầu đều nằm trong sự chú tâm của một Tổng Quản Săn Bắn tài giỏi.\n[prestige_i|E][prestige|E] từ hoạt động [GetActivityType( 'activity_hunt' ).GetName] [activity|E]: #P +20%#!"
 # Royal Architect
 court.8200.t: "Nền Móng Vững Chắc"
 court.8200.desc: "Kỹ năng của [GetCourtPositionType('royal_architect_court_position').GetName()] [position_holder.Custom('ComplimentAdjective')] của ta, [position_holder.GetTitledFirstNamePossessive], được triều đình hết lời ca ngợi — ngay cả những công việc sửa chữa đơn giản nhất cũng được xử lý với sự cẩn trọng và chính xác hiếm thấy trong [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] — hay bất cứ nơi nào khác.\n\n[position_holder.GetSheHe|U] đã trầm tư suốt tuần qua, và cuối cùng chia sẻ băn khoăn của [position_holder.GetHerHis]: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], trong công việc của ta, ta nhận ra vài cách có thể tối ưu hóa các công trình xây dựng của ngài, nhưng có lẽ nỗ lực của ta sẽ hữu ích hơn nếu giúp mở rộng các ngôi làng?\""
 court.8200.a: "Ngươi là #EMP kiến trúc sư#! của ta."
 court.8200.b: "Hãy lo cho nhu cầu của dân chúng."
 court.8200.c: "Một [position_holder.GetWomanMan] tài năng có thể làm cả hai."
 court.8200.c.success: "Ngươi giúp [position_holder.GetFirstNameNoTooltip]"
 court.8200.c.failure: "[position_holder.GetFirstNameNoTooltip] quá bận rộn"
 employer_booner_royal_architect_1_modifier: "Thi Công Hiệu Quả"
 employer_booner_royal_architect_1_modifier_desc: "Các công trình xây dựng của nhân vật này luôn là trọng tâm của một Kiến Trúc Sư Hoàng Gia tài giỏi."
 employer_booner_royal_architect_2_modifier: "Giám Sát Dân Sự"
 employer_booner_royal_architect_2_modifier_desc: "Các ngôi làng của nhân vật này luôn là trọng tâm của một Kiến Trúc Sư Hoàng Gia tài giỏi.\nTiến độ nhiệm vụ Tăng Phát Triển Quận [councillor_task|E]: #P +10%#!"
 employer_booner_royal_architect_3_modifier: "Giám Sát Hiệu Quả"
 employer_booner_royal_architect_3_modifier_desc: "Các công trình và làng mạc của nhân vật này luôn là trọng tâm của một Kiến Trúc Sư Hoàng Gia tài giỏi.\nTiến độ nhiệm vụ Tăng Phát Triển Quận [councillor_task|E]: #P +10%#!"
 # Cupbearer
 court.8201.t: "Bậc Thầy Chén Rượu"
 court.8201.desc: "[position_holder.Custom('ComplimentAdjective')] [GetCourtPositionType('cupbearer_court_position').GetName()] của ta, [position_holder.GetTitledFirstName], là một [position_holder.GetWomanMan] đáng tin cậy, đảm nhận các trách nhiệm [position_holder.GetHerHis] của ngài với sự bình tĩnh đáng kể.\n\nKhông chỉ [position_holder.GetSheHe] đảm bảo chiếc cốc của ta luôn đầy, mà còn cả của những vị khách và triều thần của ta nữa, và luôn kèm theo một nụ cười.\n\nSự nhiệt tình và khéo léo như vậy thật hiếm có, [position_holder.GetSheHe] sẽ rất hữu ích..."
 court.8201.a: "Hãy đối đãi khách của ta cho chu đáo, [position_holder.GetFirstNameNoTooltip]."
 court.8201.b: "Hãy giữ đám người hầu làm việc nghiêm chỉnh."
 court.8201.c: "Ta đòi hỏi tiêu chuẩn phục vụ cao nhất."
 court.8201.c.success: "Ngươi giúp [position_holder.GetFirstNameNoTooltip]"
 court.8201.c.failure: "[position_holder.GetFirstNameNoTooltip] quá bận rộn"
 employer_booner_cupbearer_1_modifier: "Chén Rượu Tràn Đầy"
 employer_booner_cupbearer_1_modifier_desc: "Các chư hầu của nhân vật này được một Quan Dâng Rượu tài giỏi chăm sóc chu đáo."
 employer_booner_cupbearer_2_modifier: "Chú Ý Đặc Biệt"
 employer_booner_cupbearer_2_modifier_desc: "Những người hầu của nhân vật này được một Quan Dâng Rượu tài giỏi giám sát chặt chẽ.\nChi phí duy trì Người Hầu [court_amenity|E]: #P -25%#!"
 employer_booner_cupbearer_3_modifier: "Chăm Sóc Chu Đáo"
 employer_booner_cupbearer_3_modifier_desc: "Các chư hầu và người hầu của nhân vật này đều được một Quan Dâng Rượu tài giỏi chăm sóc.\nChi phí duy trì Người Hầu [court_amenity|E]: #P -25%#!"
 # Lady-in-Waiting
 court.8203.t: "Tai Mắt Khắp Nơi"
 court.8203.desc: "[GetCourtPositionType('lady_in_waiting_court_position').GetName()] [position_holder.Custom('ComplimentAdjective')] của ta, [position_holder.GetTitledFirstName], đã thích nghi với vai trò của [position_holder.GetHerHis] một cách đáng khâm phục, dường như có thể đoán trước mọi ý muốn của ta.\n\nHơn nữa, [position_holder.GetSheHe] không để bất cứ điều gì trong triều đình lọt khỏi sự chú ý của [position_holder.GetHerHis], từ những lời đồn tầm thường nhất đến những tin tức nghiêm trọng nhất.\n\n[position_holder.GetSheHe|U] có thể là một tài sản lớn, nếu những tài năng ấy được định hướng đúng..."
 court.8203.a: "[position_holder.GetFirstNameNoTooltip], ta cần sự giúp đỡ của ngươi..."
 court.8203.b: "Ngay cả lời thì thầm nhỏ nhất cũng không được bỏ lỡ."
 court.8203.c: "Bí mật và sự duyên dáng — hãy biến chúng thành vũ khí của ngươi."
 court.8203.c.success: "Ngươi giúp [position_holder.GetFirstNameNoTooltip]"
 court.8203.c.failure: "[position_holder.GetFirstNameNoTooltip] quá bận rộn"
 employer_booner_lady_in_waiting_1_modifier: "Hỗ Trợ Tinh Thần"
 employer_booner_lady_in_waiting_1_modifier_desc: "Chiến lược giao tiếp xã hội của nhân vật này được một Nữ Quan Hầu Cận tài giỏi cố vấn."
 employer_booner_lady_in_waiting_2_modifier: "Kẻ Nghe Lén Triều Đình"
 employer_booner_lady_in_waiting_2_modifier_desc: "Việc thu thập tin đồn của nhân vật này được một Nữ Quan Hầu Cận tài giỏi hỗ trợ.\nTiến độ nhiệm vụ Tìm Bí Mật [councillor_task|E] trong lãnh địa: #P +10#!"
 employer_booner_lady_in_waiting_3_modifier: "Hỗ Trợ Triều Đình"
 employer_booner_lady_in_waiting_3_modifier_desc: "Chiến lược xã giao và việc thu thập tin đồn của nhân vật này được một Nữ Quan Hầu Cận tài giỏi hỗ trợ.\nTiến độ nhiệm vụ Tìm Bí Mật [councillor_task|E] trong lãnh địa: #P +10#!"
 # Food Taster
 court.8204.t: "Thước Đo Của Triều Đình"
 court.8204.desc: "Nhìn vào nụ cười và cái bụng ngày càng lớn của [position_holder.GetHerHis], có vẻ như [GetCourtPositionType('food_taster_court_position').GetName()] [position_holder.Custom('ComplimentAdjective')] của ta, [position_holder.GetTitledFirstName], sinh ra để dự những bữa tiệc của một [ROOT.Char.GetTitleAsNameNoTooltip].\n\n[position_holder.GetSheHe|U] ngày càng dành nhiều thời gian trong nhà bếp, nếm thử các món ăn và đưa ra nhận xét cho đầu bếp.\n\nTa nên tận dụng sự nhiệt tình hiếm có của [position_holder.GetHerHis] đối với một vai trò vốn chẳng mấy vinh quang..."
 court.8204.a: "Đừng để điều gì lọt khỏi mắt ngươi, [position_holder.GetFirstNameNoTooltip]."
 court.8204.b: "Nhà bếp thuộc quyền chỉ huy của ngươi!"
 court.8204.c: "Ta muốn ngươi để mắt tới cả thức ăn #EMP lẫn#! người hầu."
 court.8204.c.success: "Ngươi giúp [position_holder.GetFirstNameNoTooltip]"
 court.8204.c.failure: "[position_holder.GetFirstNameNoTooltip] quá bận rộn"
 employer_booner_food_taster_1_modifier: "Sàng Lọc Người Hầu"
 employer_booner_food_taster_1_modifier_desc: "Những người hầu của nhân vật này được một Quan Thử Thức Ăn tài giỏi giám sát chặt chẽ."
 employer_booner_food_taster_2_modifier: "Thực Đơn Được Kiểm Duyệt"
 employer_booner_food_taster_2_modifier_desc: "Nhà bếp của nhân vật này được một Quan Thử Thức Ăn tài giỏi giám sát.\nChi phí duy trì Thực Phẩm [court_amenity|E]: #P -25%#!"
 employer_booner_food_taster_3_modifier: "Thực Đơn Được Giám Sát"
 employer_booner_food_taster_3_modifier_desc: "Những người hầu và nhà bếp của nhân vật này được một Quan Thử Thức Ăn tài giỏi giám sát.\nChi phí duy trì Thực Phẩm [court_amenity|E]: #P -25%#!"
 # Poor Holder
 court.8301.t: "Không Đạt Kỳ Vọng"
 court.8301.intro: "Chủ đề về năng lực — hay sự thiếu hụt năng lực — của [position_holder.GetHeldCourtPositionsString] vụng về của ta, [position_holder.GetFirstNamePossessive], đã trở thành trò cười ngày càng lan rộng. Nghĩ lại, tài năng của [position_holder.GetHerHis] quả thật còn nhiều điều đáng bàn...\n\n"
 court.8301.detractor: "Đứng đầu trong số những người gièm pha [position_holder.GetHerHis] của ngài là [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('detractor'))] của ta, [detractor.GetTitledFirstName], kẻ không hề cố gắng che giấu sự khinh miệt [detractor.GetHerHis] của mình.\n\n"
 court.8301.desc: "\"Thưa bệ hạ,\" [position_holder.GetFirstName] lắp bắp giữa tiếng cười khúc khích của triều đình, sau khi sự hiểu biết rối rắm của [position_holder.GetHerHis] về [position_holder.Custom('GetCourtPositionSubject')] lại một lần nữa bị chế giễu, \"ta #EMP thật sự#! giỏi công việc của mình... p-phải không?\""
 court.8301.a: "Hãy nói về tiền lương của ngươi, [position_holder.GetFirstNameNoTooltip]..."
 court.8301.b: "Ta nghĩ đã đến lúc ngươi nên rút lui."
 court.8301.c: "#weak *thở dài*#! #EMP Phải...#! Ừ, đúng! Ngươi làm rất tốt!"
