 # Holder Improves
 court.8311.t: "Làm Quen Công Việc"
 court.8311.desc: "Mặc dù ban đầu có sự nắm bắt khá nghi vấn về ngay cả những cơ chế cơ bản nhất của [position_holder.Custom('GetCourtPositionSubject')], [position_holder.GetHeldCourtPositionsString] của ta, [position_holder.GetTitledFirstName], cuối cùng dường như cũng đang trưởng thành trong vai trò [position_holder.GetHerHis] của mình.\n\nNhiều người trong triều đình đã ghi nhận những khả năng đang phát triển, mặc dù vẫn còn phần nào hạn chế, [position_holder.GetHerHis] của ngài. Ít nhất có vẻ như [position_holder.GetSheHe] đang thực sự cố gắng để kiếm sống [position_holder.GetHerHis] của mình."
 court.8311.a: "Thật đáng mừng khi thấy điều đó, [position_holder.GetFirstNameNoTooltip]!"
 bonus_aptitude_role_tt: "[position_holder.Custom('GetTargetCourtPosition')] [aptitude|E]: #P +[SCOPE.ScriptValue('cp_bonus_aptitude_value')]#!"
 cp_bonus_aptitude: "Làm Quen Công Việc"
 # Salary Review
 court.8321.t: "Cách Thưởng Củ Cà Rốt"
 court.8321.desc: "[position_holder.GetHeldCourtPositionsString] của ta, [position_holder.GetTitledFirstName], đã phần nào ổn định trong vai trò [position_holder.GetHerHis] của mình, mặc dù không phải là không có vài khó khăn ban đầu.\n\n[position_holder.GetSheHe|U] không hề che giấu sự thật rằng [position_holder.GetSheHe] nghĩ mình nên được khen thưởng tốt hơn nếu [position_holder.GetSheHe] thực sự muốn cống hiến hết mình [position_holder.GetHerselfHimself] cho công việc [position_holder.GetHerHis] của mình.\n\n\"Thôi nào, [ROOT.Char.Custom('FormOfAddressForLiege')], tôi đang phục vụ [ROOT.Char.GetTitleAsNameNoTooltip] của [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]! Lẽ ra tôi không nên nhận nhiều hơn là những mẩu vụn thừa trên bàn nếu tôi phải dành cả ngày đắm chìm trong [position_holder.Custom('GetCourtPositionSubject')] thay mặt ngài?\""
 court.8321.a: "Được thôi, nhưng ngươi phải chứng tỏ xứng đáng."
 court.8321.b: "Hay là một khoản thưởng nhỏ thì sao?"
 court.8321.b.success: "[position_holder.GetSheHe|U] chấp nhận lời đề nghị"
 court.8321.b.failure: "[position_holder.GetSheHe|U] cảm thấy bị xúc phạm"
 court.8321.c: "Hiện giờ không có tiền dư..."
