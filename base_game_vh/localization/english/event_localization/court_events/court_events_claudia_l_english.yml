l_english:

 # Secret History
 court_6000_all_courtiers_and_guests:0 "Tất cả [courtiers|E] và [guests|E] của ngươi"
 court.6000.t:0 "Lịch Sử Bí Mật"
 court.6000.desc_opening:1 "Khi ta bước vào phòng, ta hoàn toàn bối rối trước tiếng kêu hoảng hốt của [courtier.GetFirstName], kẻ trước đó đang chăm chú đọc một bản thảo mang tựa đề 'Lịch Sử Bí Mật của [ROOT.Char.GetPrimaryTitle.GetNameNoTier]'."
 court.6000.desc_liege:0 "\n\n\"[SCOPE.sC('courtier').Custom2('RelationToMe', ROOT.GetCharacter)] của ta!\""
 court.6000.desc_family:0 "\n\n\"[SCOPE.sC('courtier').Custom2('RelationToMe', ROOT.GetCharacter)]!\""
 court.6000.desc_ending:0 "\"Không có gì đáng ngờ cả! Hoàn toàn không!\" [courtier.GetSheHe] hét lên, trong khi cố — nhưng thất bại — giấu vật đáng ngờ kia vào trong áo choàng của [courtier.GetHerHis]. \n\nKhi ta giằng được cuốn sách khỏi tay [courtier.GetHerHis], ta kinh ngạc phát hiện từng trang từng trang ghi chép chi tiết về những hành vi đen tối được cho là đã xảy ra tại triều đình của người tiền nhiệm ta với sự cho phép của [predecessor.GetHerHis]!"
 court.6000.a:1 "#EMP THẬT QUÁ ĐÁNG!#! Ai dám viết ra những lời dối trá trắng trợn như vậy?"
 court.6000.a.tt:0 "Ngươi cử Mật Thám của mình đi điều tra"
 court.6000.b:0 "Ồ, chuyện ngồi lê đôi mách thật hấp dẫn!"
 court.6000.b.tt:0 "Ngươi có thể khám phá quá khứ #EMP đầy tai tiếng#! của ai đó"
 court.6000.c:1 "Mọi người đều xứng đáng biết sự thật về [predecessor.GetTitledFirstNameNoTooltip]!"
 court.6000.c.tt:0 "[predecessor.GetSheHe|U] là một bạo chúa ghê tởm, không xứng đáng với triều đại của ta! Hãy để ta nói cho các ngươi biết #EMP chính xác#! ta nghĩ gì về con chó hèn nhát đê tiện đó..."
 court.6000.d:0 "Thật nhàm chán. Ta chẳng quan tâm."
 court.6000.e.tt:0 "Ngươi tự mình bắt đầu điều tra"
 court.6000.f:0 "Tất cả đều là sự thật. Nhưng chúng ta phải tha thứ và quên đi."
 court.6002.desc:0 "Ta đang vùi đầu vào đống thư từ ngoại giao thì [spymaster.GetTitledFirstName] xông vào phòng, kéo theo một [author.GetTitledFirstName] trông đầy sợ hãi phía sau. \n\n \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ta đã tìm ra [author.GetHerHim]! Kẻ vô lại đã viết cuốn sách dối trá đáng hổ thẹn về người tiền nhiệm của ngài, [predecessor.GetTitledFirstName]!\""
 court.6002.b.desc_opening:0 "Trong nhiều tháng qua, ta đã dành mọi khoảnh khắc rảnh rỗi để truy tìm con rắn lẩn trốn đã lưu hành cuốn sách về những sai lầm của người tiền nhiệm ta."
 court.6002.b.desc_ending:2 "Sau biết bao đêm mất ngủ, cuối cùng ta đã tìm ra thủ phạm: chính là kẻ hèn nhát [author.GetTitledFirstName]! \n\nKhi [author.GetSheHe] đứng trước mặt ta run rẩy chờ phán quyết, ta cẩn thận suy nghĩ xem nên nói gì tiếp theo."
 court.6002.a:0 "Ngươi nên xấu hổ vì những lời dối trá đê tiện của mình!"
 court.6002.a.tt:0 "[author.GetSheHe|U] tốt hơn nên rút lại những tuyên bố của [author.GetHerHis] và ăn năn, nếu không..."
 COURT_OF_NO_SECRETS_VALUE: "Đàn Áp Kẻ Đối Lập"
 court.6002.a.tt2: "Tăng hiệu quả nhiệm vụ $task_find_secrets$ của Mật Thám trong 15 năm."
 court.6002.b:0 "Lính canh, bắt tên phản bội này lại!"
 court.6002.c:0 "Ngươi đã đi quá xa rồi đấy, [author.GetFirstNameNoTooltip]..."
 court.6002.d:0 "Ta tin rằng cuốn nhật ký nhỏ của ngươi không có ý xấu, phải không?"
 court.6003.desc:1 "Đã nhiều tháng trôi qua, nhưng Mật Thám của ta, [spymaster.GetTitledFirstName], vẫn chưa báo cáo tiến triển đáng kể nào trong nhiệm vụ đặc biệt của [spymaster.GetHerHis]: tìm ra tác giả đáng nguyền rủa của bản thảo đáng xấu hổ kể lại những tội ác bí mật của người tiền nhiệm ta! \n\nKhông có gì lạ khi, lúc ta triệu kiến [spymaster.GetHerHim], [spymaster.GetFirstNameNoTooltip] trông đầy lo lắng và tội lỗi. \"Thưa [ROOT.GetLadyLord]! Ta đã tìm kiếm khắp nơi, nhưng tác giả đã biến mất! Có lẽ hắn đã rời triều đình, hoặc có ai đó đang bảo vệ hắn, hoặc—\" \n\nTa ra hiệu tay cắt ngang lời lải nhải của [spymaster.GetHerHis]."
 court.6003.b.desc_ending:0 "\n\nĐáng tiếc thay, mọi nỗ lực của ta đều vô ích, vì thủ phạm dường như đã biến mất và dấu vết đã nguội lạnh. Có lẽ ta sẽ không bao giờ biết được sự thật."
 court.6003.a:0 "Thôi được. Chuyện này cũng không quan trọng."
 court.6003.b:0 "Thật đáng thất vọng."
 court.6003.c:2 "Lũ #EMP ký sinh vô dụng#! các ngươi đang che giấu tác giả, phải không?"
 court.6003.c.tt:0 "Ngươi trút giận lên các cận thần"
 court.6003.d:0 "Ngươi đã cố hết sức rồi, [spymaster.GetTitledFirstNameNoTooltip]..."
 court.6003.e:0 "Vì ngươi không tìm ra tác giả, ngươi sẽ chịu tội thay hắn!"
 #Prophet in the Halls
 court.6010.t:0 "Nhà Tiên Tri Trong Đại Sảnh"
 court.6010.desc:1 "\"#EMP HÃY ĂN NĂN NGAY HÔM NAY!#! HÃY HỌC LẤY CHÂN LÝ ĐÍCH THỰC! HÃY BƯỚC RA ÁNH SÁNG!\" \n\nKể từ khi [preacher.GetTitledFirstName] gia nhập triều đình ta, những nỗ lực dai dẳng của [preacher.GetHerHis] nhằm cải đạo mọi người sang giáo phái ngoại lai của [preacher.GetHerHis] đã trở thành tiếng ồn nền cho cuộc sống hằng ngày của ta.\n\nNgày cũng như đêm, [preacher.GetSheHe] lảng vảng trong sân, tuần tra các hành lang, và ẩn mình nơi góc tối để chờ những người đi ngang qua không hay biết, sẵn sàng #EMP thuyết phục#! họ bằng những tiếng rít đầy ép buộc của [preacher.GetHerHis]. \n\nCác cận thần của ta đã kiệt sức, và sau khi [preacher.GetFirstNameNoTooltip] phục kích ta trên đường đến bô vệ sinh, ta cũng bắt đầu đồng tình với sự bất mãn của họ."
 court.6010.a:0 "Chúng ta có thể chịu đựng chuyện này. [preacher.GetFirstNameNoTooltip] vô hại."
 court.6010.b:1 "Đá tên ngu đó ra khỏi triều đình của ta!"
 court.6010.c:1 "[preacher.GetSheHe|U] cứ giảng đạo cho lũ chuột nghe, ta cũng chẳng quan tâm..."
 court.6010.c.tt:0 "Lãnh chúa của [preacher.GetHerHim|U], [preacher_liege.GeTitledFirstName], sẽ không hài lòng."
 court.6010.c.tt2: "Nhiệm vụ [councillor_task|E] $task_conversion$ của [chaplain.GetCouncilTitlePossessive|U] của ngươi #P hiệu quả hơn#! trên các quận theo đức tin [preacher.GetFaith.GetName] trong 20 năm"
 court.6010.c.tt3: "Nhiệm vụ [councillor_task|E] $task_conversion$ của [chaplain.GetCouncilTitlePossessive|U] của ngươi #N kém hiệu quả hơn#! trên các quận theo đức tin [preacher.GetFaith.GetName] trong 20 năm"
 court.6010.a_every_county: "Mọi [county|E] theo đức tin [preacher.GetFaith.GetName] trong [realm|E] của ngươi ([preacher_faith_counties_size])"
 court_6010_harsh_conversions: "Cải Đạo Khắc Nghiệt"
 court_6010_tolerant_conversions: "Cách Tiếp Cận Khoan Dung"
 court.6010.d:0 "ĐỦ RỒI với sự #EMP BÁNG BỔ#! này!"
 court_6010_all_courtiers_and_guests_faith:0 "Tất cả [courtiers|E] và [guests|E] cùng tôn giáo [preacher.GetFaith.GetAdjectiveNoTooltip] với ngươi"
 court.6011.desc_opening:0 "[preacher_liege.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 court.6011.desc_prisoner:0 "Ta nhận thấy rằng ngài gần đây đã bỏ tù một thần dân của ta vì lý do không có gì hơn là thuyết giáo về đức tin [preacher.GetHerHis] của ngài - #EMP đức tin của chính ta#! - tại triều đình của ngài. \n\nTa tin rằng đây chỉ là một sự hiểu lầm và ngài sẽ sửa chữa tình hình ngay lập tức, kẻo ta có ấn tượng sai lầm về ý định của ngài."
 court.6011.desc_executed:0 "Ta vô cùng phẫn nộ khi biết rằng gần đây ngươi đã xử tử một thuộc hạ của ta — vị khách tại triều đình của ngươi — với tội danh dị giáo nguy hiểm. \n\nTa muốn tin rằng đó chỉ là hiểu lầm và ngươi không #EMP thật sự#! muốn xúc phạm ta và thách thức đức tin của ta."
 court.6011.a:0 "Ta không có ý xúc phạm ngươi. Hãy nhận khoản bồi thường này."
 court.6011.b:0 "Những kẻ truyền giáo trá hình của ngươi không được chào đón tại triều đình của ta."
 #Possession at Court
 court.6020.t:0 "Bị Quỷ Ám Tại Triều Đình"
 court.6020.desc_opening:1 "Tình trạng của [possessed_char.GetTitledFirstNamePossessive] vừa bí ẩn vừa đáng sợ."
 court.6020.desc_chaplain:0 "\n\nTheo lời [court_chaplain.GetCouncilTitle|U] [court_chaplain.GetTitledFirstName],"
 court.6020.desc_no_chaplain:0 "\n\nNgười ta thường cho rằng"
 court.6020.desc_middle:1 "một thực thể hắc ám đang cư ngụ trong cơ thể [possessed_char.GetHerHis] và đôi khi bộc lộ sức mạnh không thể kiểm soát; tuy nhiên, tần suất và cường độ của những cơn này ngày càng khiến các cận thần trung thành của ta hoảng sợ. [court_chaplain.GetSheHe|U] lo rằng thế lực tà ác sẽ chiếm quyền kiểm soát và gieo rắc hỗn loạn cùng cái chết giữa chúng ta."
 court.6020.desc_physician:0 "\n\n[court_physician.GetTitledFirstName] trấn an ta rằng"
 court.6020.desc_no_physician:0 "\n\n"
 court.6020.desc_ending:0 "[possessed_char.GetFirstNameNoTooltip] chưa bao giờ thực sự nguy hiểm #EMP per se#!, nhưng các cận thần của ta khăng khăng rằng phải làm gì đó."
 court.6020.a:1 "[court_chaplain.GetTitledFirstNameNoTooltip], hãy trừ tà con quỷ này!"
 court.6020.a.success:0 "Nghi lễ trừ tà của [court_chaplain.GetFirstNamePossessive] thành công"
 court.6020.a.success.tt:0 "Với những buổi trừ tà thường xuyên để kiềm chế tà ác, tình trạng của [possessed_char.GetTitledFirstNamePossessive] dường như cải thiện, và các cận thần của ngươi hài lòng"
 court.6020.a.failure:0 "Nghi lễ trừ tà của [court_chaplain.GetFirstNamePossessive] thất bại"
 court.6020.a.failure.tt:0 "Tình trạng của [possessed_char.GetTitledFirstNamePossessive] không thay đổi"
 court.6020.b:0 "Đừng sợ! Đây là dấu hiệu được thần linh ưu ái!"
 court.6020.c:0 "Sức mạnh của thánh vật này sẽ cứu [possessed_char.GetHerHim]."
 court.6020.c.tt:0 "Người ta nói việc đặt [6020_relic.GetNameNoTooltip] của ngươi lên người có thể chữa mọi bệnh"
 court.6020.d:1 "[court_physician.GetTitledFirstNameNoTooltip], ngươi có biết loại thảo dược nào có thể giúp [possessed_char.GetHerHim] không?"
 court.6020.d.tt:0 "Kinh nghiệm y thuật của [court_physician.GetFirstNamePossessive] cải thiện tình trạng của [possessed_char.GetTitledFirstNamePossessive]"
 court.6020.d.tt.2:0 "[court_physician.GetFirstNameNoTooltip] thử một số phương thuốc thảo dược"
 court.6020.e:0 "Chỉ là bệnh về não mà thôi. [court_physician.GetFirstNameNoTooltip]?"
 court.6020.f:0 "Cứ để [possessed_char.GetHerHim] như vậy."
 court.6020.b.tt: "Việc có #EMP khải tượng tiên tri#! được xem là trợ giúp lớn cho $court_poet_court_position$, $court_musician_court_position$, hoặc $cave_hermit_court_position$"
 court_6020_all_courtiers_and_guests_christian:1 "Tất cả [courtiers|E] và [guests|E] cùng tôn giáo với ngươi"
 court_6020_all_courtiers_or_guests_polith:1 "Tất cả [courtiers|E] và [guests|E] khác (không hoài nghi)"
 #The Ballad of the Garlic King
 court.6030.t:0 "Khúc Ca về [ROOT.Char.Custom('GetQueenKing')] Tỏi"
 court.6030.desc:1 "\"#EMP Có một câu chuyện ở thị trấn nhỏ của chúng ta,\nvề một [ROOT.Char.Custom('GetQueenKing')] với chiếc Vương miện Tỏi,\nđể chiến đấu với [ROOT.Char.GetSheHe] [ROOT.Char.Custom('GetUnbelieverNamePlural')] cưỡi trên lưng lừa,\nnhưng thành công duy nhất [ROOT.Char.GetHerHis] của ngài là chống lại một con khỉ nhỏ...#!\"\n\nBản ballad bị nguyền rủa này đã trở nên rất phổ biến giữa các ca sĩ rong và thường dân - #EMP quá phổ biến#! đối với sở thích của ta kể từ khi ta phát hiện ra một lượng điểm tương đồng đáng lo ngại giữa bản thân ta và nhân vật chính... Nhưng việc nghe thấy nó, bị hát không chút xấu hổ ngay trước mặt ta bởi [6030_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)], thì đã đi quá xa!"
 court.6030.a:0 "Nhưng đúng là #EMP rất#! buồn cười!"
 court.6030.b:0 "Thật #EMP quá#! xấu hổ..."
 court.6030.c:0 "#EMP NGƯƠI THẤY BUỒN CƯỜI SAO?!#!"
 court.6030.d:0 "Chuyện này #EMP không thể chấp nhận#!."
 court.6030.d.tt:0 "Ngươi cấm biểu diễn khúc ca này, đe dọa bỏ tù kẻ vi phạm"
 court.6030.e:0 "Ta. Không. Chịu. Nổi. Nữa!"
 court.6030.e.tt:0 "Ngươi đấm người tiếp theo chọc giận ngươi bằng cách hát khúc ca ngu ngốc đó — nhiều lần"
 court.6030.f:0 "Rồi họ cũng sẽ ngừng thôi...?"
 #Scrounger Life
 court.6040.t:0 "Đời Ký Sinh"
 court.6040.desc:0 "[scrounger.GetTitledFirstName|U] đã trở thành một phần thường trực của triều đình ta — và là một phần #EMP tốn kém#!. Thực ra còn là một phần #EMP phình to#! nữa.\n\n[scrounger.GetSheHe|U] có mặt trong mọi yến tiệc, ngấu nghiến mọi thứ trong tầm mắt trong khi phàn nàn rằng kho lương của [scrounger.GetHerHis] ở nhà trống rỗng thế nào. \"Ngài phục vụ những thức uống ngon nhất, [ROOT.Char.Custom('FormOfAddressForLiege')]!\" [scrounger.GetSheHe] nói sau khi nốc cạn thêm một cốc [ROOT.Char.Custom('GetExpensiveDrink')] hảo hạng của ta. \"Ngài thật #EMP [SCOPE.Custom('PersonalityGetSharedTraitDescriptionFromFlag')]#!, thật #EMP [ROOT.Char.Custom('ComplimentAdjective')]#!, là [ROOT.Char.GetLadyLord] #EMP ĐẸP NHẤT#!!\" [scrounger.GetSheHe] tuyên bố, tay [scrounger.GetHerHis] chìa ra xin thêm một khoản vay mà [scrounger.GetSheHe] sẽ chẳng bao giờ trả.\n\n[scrounger.GetSheHe|U] là một kẻ phiền phức tốn tiền, nhưng những trò lố bịch cường điệu của [scrounger.GetHerHis] cũng khá giải trí."
 court.6040.a:0 "Nếu ngươi đã luôn ở đây, thì cũng nên làm cho mình hữu ích!"
 court.6040.b:0 "Xét cho cùng, ta thấy [scrounger.GetHerHim] khá buồn cười!"
 court.6040.c:1 "Tống cổ con đỉa này khỏi tầm mắt ta."
 court.6041.desc:0 "Vài tháng đã trôi qua kể từ khi ta quyết định để [scrounger.GetTitledFirstName] tiếp tục cuộc sống ký sinh [scrounger.GetHerHis] của ngài tại triều đình của ta.\n\nTa không mong đợi gì hơn ngoài những câu chuyện về sự nghèo đói và những lời khen ngợi nịnh hót quá mức [scrounger.GetHerHis] của ngài, nhưng gần đây, ta nhận thấy những câu chuyện [scrounger.GetHerHis] của ngài ngày càng hài hước hơn, những vần thơ [scrounger.GetHerHis] của ngài sắc sảo hơn, và những lời khen ngợi [scrounger.GetHerHis] của ngài làm ta hài lòng hơn.\n\nCả các triều thần và khách nước ngoài của ta đều rất thích thú với những lời lẽ được tạo tác một cách khéo léo [scrounger.GetHerHis] của ngài. Có lẽ [scrounger.GetFirstNameNoTooltip] đã tìm thấy một nghề nghiệp hữu ích?"
 court.6041.a:0 "Ta biết ngươi cũng có ích mà!"
 court.6041.b:0 "... nhưng ta cược là ngươi còn làm tốt hơn nữa!"
 court.6041.b.failure:0 "Dù [scrounger.GetHerHis] cố gắng hết sức, [scrounger.GetFirstNameNoTooltip] dường như đã đạt đến giới hạn khả năng của [scrounger.GetHerHis]"
 court.6041.b.success:0 "[scrounger.GetFirstNameNoTooltip] nhận được cảm hứng cho một tác phẩm lớn"
 court.6041.b.failure.tt:0 "[scrounger.GetFirstNameNoTooltip] không thể tiến bộ thêm"
 court.6041.b.success.tt:0 "[scrounger.GetFirstNameNoTooltip] trở nên đầy cảm hứng!"
 court.6041.c:0 "Ta đã phí đủ thời gian cho ngươi rồi."
 #Saucy Readings
 court.6050.t:0 "Những Trang Sách Táo Bạo"
 court.6050.desc_opening:0 "Gần đây ta không thể không để ý đến những nhóm thiếu nữ khúc khích và các chiến binh vốn nghiêm nghị tụ tập trong những góc tối để say mê nghe đọc một cuốn sách. \n\nHôm nay cuối cùng ta đã dồn [courtier.GetTitledFirstName] vào góc với cuốn sách trong tay [courtier.GetHerHis]."
 court.6050.desc_byz:0 "Dù bìa ngoài trông như một cuốn sách cầu nguyện ngoan đạo, bên trong lại là một tiểu thuyết phóng túng được viết từ nhiều thế kỷ trước bởi tổ tiên ngoại giáo của chúng ta! Có thiếu nữ xinh đẹp, cướp biển, cám dỗ và từng trang đầy dục vọng không thánh thiện..."
 court.6050.desc_islam:0 "Lướt nhanh qua văn bản, ta thấy cướp biển, những thiếu nữ ăn mặc hở hang, những vị vua xa hoa, những nữ hoàng dâm đãng và xảo quyệt, thậm chí cả một tên chuột đường phố giàu lên cưới được công chúa nhờ sự giúp đỡ của thần djinn..."
 court.6050.desc_sonetti:0 "Từng trang từng trang là thơ ca, hình thức tao nhã nhưng bản chất đầy dục tính. Vẻ đẹp thiên thần của đủ loại phụ nữ được tôn vinh bằng những lời dịu dàng, chỉ vừa đủ che giấu khát vọng rất trần tục của thi sĩ..."
 court.6050.desc_chaucer:0 "Tất cả đều là chuyện của những người hành hương trên đường; nhưng chúng không nói về sự cứu rỗi linh hồn, mà về những vụ giết người đẫm máu và những người vợ ngoại tình..."
 court.6050.desc_generic:0 "Rõ ràng đây là một văn bản phóng túng, đầy ắp những cám dỗ xác thịt, quyến rũ trần gian và những bầu ngực mềm mại..."
 court.6050.desc_ending:0 "\n\nTa im lặng suy nghĩ về phản ứng có thể có của [court_chaplain.GetCouncilTitle] [court_chaplain.GetTitledFirstName], trong khi [courtier.GetFirstNameNoTooltip] nhìn ta đầy lo lắng."
 court.6050.a:0 "Ôi đôi mắt tội nghiệp của ta!"
 court.6050.b:0 "Hãy thanh tẩy chúng bằng lửa!"
 court.6050.b.tt:1 "Ngươi cho thiêu hủy mọi bản sao của văn bản tai tiếng và cấm nó trong triều đình"
 court.6050.b.tt.2: "Những đứa trẻ được giáo dục tại triều đình ngươi sẽ dễ phát triển tính cách [GetTrait('pensive').GetName( GetNullCharacter )], [GetTrait('chaste').GetName( GetNullCharacter )], hoặc [GetTrait('zealous').GetName( GetNullCharacter )]"
 court.6050.c:0 "Văn hóa có nhiều hình thức. Cứ để họ đọc."
 court.6050.c.tt: "Những đứa trẻ được giáo dục tại triều đình ngươi sẽ dễ phát triển tính cách [GetTrait('curious').GetName( GetNullCharacter )], [GetTrait('lustful').GetName( GetNullCharacter )], hoặc [GetTrait('cynical').GetName( GetNullCharacter )]"
 court.6050.c.unlock_text:0 "Tùy chọn này khả dụng nhờ kỹ năng [learning|E] cao của ngươi"
 court.6050.d:0 "Ồ, hấp dẫn thật!"
 court.6050.e:1 "Sao chúng ta chỉ dừng ở đọc sách thôi, [courtier.GetFirstNameNoTooltip]?"
 court.6050.e.tt:0 "Ngươi lấy cảm hứng từ những trang đọc"
 court.6050.f:0 "Hãy làm nó biến mất và ta sẽ coi như chưa từng thấy."
 court_6050_courtiers_or_guests:0 "Tất cả [courtiers|E] và [guests|E] không tiết hạnh của ngươi"
 #The Joys of Wine
 court.6060.t:0 "Niềm Vui Của Rượu"
 court.6060.desc_opening:1 "Đột nhiên, [court_chaplain.GetCouncilTitle] [court_chaplain.GetTitledFirstName] và [court_physician.Custom2('MyCharacterIntroduction', ROOT.Char)] xông vào phòng ngai vàng, cãi vã.\n\n\"Rượu xúc phạm [ROOT.Char.GetFaith.HighGodName]! Nó #EMP phải#! bị tránh xa!\" [court_chaplain.GetFirstNameNoTooltip] gào lên.\n\n\"Một chút rượu tốt cho cơ thể!\" [court_physician.GetFirstNameNoTooltip] đáp lại."
 court.6060.desc_drunkard_courtier:1 "\n\nTừ một góc phòng, [courtier_drunkard.GetTitledFirstName] chen vào: \"Lượng rượu tốt cho ngươi chỉ có #EMP TẤT CẢ#! thôi!!\""
 court.6060.desc_ending:0 "\n\nQuan điểm của ta về rượu là gì?"
 court.6060.a:0 "Rượu mở cửa cho [ROOT.Char.GetFaith.DevilName]!"
 court.6060.b:0 "Một ít rượu giúp cân bằng thể dịch."
 court.6060.c:0 "[courtier_drunkard.GetFirstNameNoTooltip|U], nâng cốc cùng ta!"
 court.6060.c.tt: "[courtier_drunkard.GetFirstNameNoTooltip|U] mở kho rượu bí mật của [courtier_drunkard.GetHerHis]!"
 court.6060.c.tt.2: "Nhờ đóng góp của [courtier_drunkard.GetFirstNamePossessiveNoTooltip] cho nguồn rượu, Tiện Nghi Ẩm Thực của triều đình rẻ hơn 50% trong 10 năm."
 court.6060.d:0 "Câu trả lời nằm dưới đáy chiếc cốc này!"
 # The Value of Letters
  court.6070.t:0 "Giá Trị Của Chữ Nghĩa"
  court.6070.desc:0 "Ta có thể cảm nhận những ánh nhìn phán xét của toàn bộ quần thần đang đổ dồn vào mình khi ta chậm rãi, cẩn thận ký tên lên một sắc lệnh mới bằng cây bút run rẩy và bàn tay thiếu chắc chắn. \n\nDĩ nhiên, gọi đó là #EMP ký tên#! thì hơi quá. Ta chỉ đơn thuần lần theo những chữ cái được khắc sẵn trên một tấm bảng gỗ - và còn làm điều đó một cách chật vật. Hôm nay, ngay cả [tutor_6070.Custom2('MyCharacterIntroduction', ROOT.Char)] cũng đang nhìn ta với ánh mắt mà ta đoán là pha trộn giữa thương hại và ghê tởm. \n\nTrước khi ta kịp quở trách [tutor_6070.GetHerHim] vì sự vô lễ đó, [tutor_6070.GetSheHe] đã xen vào với giọng đầy hy vọng: [ROOT.Char.Custom('FormOfAddressForLiege')|U], có lẽ đã đến lúc ngài học đọc và viết một cách đàng hoàng rồi chăng?""
  court.6070.a:0 "Dạy ta #EMP ngay bây giờ#!!"
  court.6070.a.success:0 "Ta đã học được cách đọc và viết thành công"
  court.6070.a.failure:0 "Việc học đọc và viết đối với ta là vô vọng"
  court.6070.a.tt.1:0 "Sẽ không ai còn chế giễu ta nữa"
  court.6070.a.tt.2:0 "Ta sẽ phải tìm một giải pháp khác"
  court.6070.b:0 "Vung vẩy bút mực là việc của kẻ thất bại và yếu đuối!"
  court.6070.c:0 "Ta sẽ tiếp tục giả vờ như không nhận ra họ."
  court.6070.d:0 "Ta #EMP biết#! viết rồi, đa tạ!"
  court.6070.d.tt:0 "Nếu ta nói với đủ tự tin, có lẽ họ sẽ tin..."
  court.6070.d.tt.success:0 "Họ tin vào lời nói dối trắng trợn của ta!"
  court.6070.d.tt.failure:0 "Họ nhìn thấu ta ngay lập tức"
  every_courtier_or_guest_6070_learning:0 "Tất cả [courtiers|E] và [guests|E] biết chữ của ngài"
  court.6071.desc:0 "#EMP B...ạ...n t...h...â...n m...ế...n,#!\n\n"Ừ, trông ổn đấy!"\n\nTa đã dành vô số giờ luyện tập bảng chữ cái dưới ánh nhìn nghiêm khắc của [tutor_6070.Custom2('MyCharacterIntroduction', ROOT.Char)], và có vẻ như nỗ lực của ta đã được đền đáp! Thư từ ngoại giao, báo cáo của các cố vấn, và lời thề của chư hầu giờ đây không còn là bí mật đối với ta nữa! \n\nĐưa ta cây bút - ta muốn ký thêm nhiều thứ nữa!"
  court.6071.a:0 "Ta quả thật quá thông minh."
  court.6071.b:0 "[tutor_6070.GetFirstNameNoTooltip] xứng đáng được ban thưởng."
  court.6071.b.tt: "[tutor_6070.GetFirstNamePossessiveNoTooltip] Khả năng trong vai trò $court_tutor_court_position$ tăng lên."
  court_language_teacher_desc: "Đã dạy quân chủ viết chữ"
  court.6072.desc:0 "#EMP T...h...â...n g...ử...i b...ạ...n,#!\n\n\"Nhìn kìa! Tôi đang làm rất tốt, đúng không?\"\n\n[tutor_6070.Custom2('MyCharacterIntroduction', ROOT.Char)|U] thở dài, lắc đầu [tutor_6070.GetHerHis] với vẻ mặt buồn bã. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], có lẽ ngài muốn sử dụng con dấu lạ mắt, sáng bóng này thay vì ký tên?\"\n\nRõ ràng, [tutor_6070.GetSheHe] không hài lòng với sự tiến bộ #EMP kinh ngạc#! mà ta đang đạt được trong nỗ lực học đọc và viết."
  court.6072.a:0 "Chữ nghĩa vốn vô dụng! Giờ trả lại [ROOT.Char.Custom('child_object_of_interest_random')] của ta!"
  court.6072.a.tt:0 "Không ai ấn tượng"
  court.6072.b:0 "Được thôi, ta sẽ long trọng đóng dấu lên những gì #EMP ta đọc#!."
  court.6072.b.tt:0 "Trông có vẻ ấn tượng thật, nhưng điều đó không che giấu được việc ngài không hề đọc những gì mình ký"
  court.6072.c:0 "Tất cả là lỗi của ngươi, [tutor_6070.GetFirstNameNoTooltip]!"
 #The Munificence of X
  court.6080.t:0 "Sự Hào Phóng Của [6080_visitor.GetFirstNameNoTooltip]"
  court.6080.desc:0 "Trong vài ngày qua, [6080_visitor.GetTitledFirstName] đã ghé thăm triều đình của ta trong khi [6080_visitor.GetHerHis] đang trên đường đi giải quyết công việc, có thể là đến một thánh địa hoặc thứ gì đó."
  court.6080.desc_middle: "\n\nKể từ khi [6080_visitor.GetHerHis] đến, [6080_visitor.GetSheHe] đã làm lu mờ ta bằng sự hào phóng [6080_visitor.GetHerHis] của ngài đối với chính các triều thần của ta, những người đã hớn hở nhận lấy số vàng [6080_visitor.GetHerHis] của ngài mà chẳng có chút lòng tự trọng nào! Ta không thể không chế giễu khi thấy [6080_visitor.GetHerHim] bị bao quanh bởi những triều thần ngưỡng mộ lần thứ n. #EMP Triều thần của ta#!.\n\n\"Một túi tiền cho ngươi, [beneficiary_1.GetFirstName] tốt bụng!\""
  court.6080.desc_liege: "Trong vài ngày qua, [6080_visitor.GetTitledFirstName], quân chủ của ta, đã ghé thăm triều đình của ta nhân dịp [6080_visitor.GetHerHis] [GetActivityType('activity_tour').GetName]."
  court.6080.desc_2:0 "Và vài đồng xu cho ngươi nữa, [beneficiary_2.GetFirstName] tốt bụng!"
  court.6080.desc_3:0 "Còn cho ngươi, [beneficiary_child.GetFirstName] đáng yêu, những chiếc bánh mật ngọt!"
  court.6080.desc_end:0 "Hãy nhớ, của cải sinh ra là để chia sẻ!""
  court.6080.a:0 "Ta có thể còn #EMP hào phóng#! hơn nữa!"
  court.6080.b:0 "Ta cũng nên tận dụng sự hào phóng ngốc nghếch của [6080_visitor.GetHerHis]!"
  court.6080.b.success:0 "Ta thuyết phục được [6080_visitor.GetFirstNameNoTooltip] chi tiền cho ta"
  court.6080.b.success.tt:0 "[6080_visitor.GetFirstNameNoTooltip] đã bị thuyết phục!"
  court.6080.b.failure:0 "[6080_visitor.GetFirstNameNoTooltip] hoàn toàn không ấn tượng với nỗ lực của ta"
  court.6080.b.failure.tt:0 "[6080_visitor.GetFirstNameNoTooltip] không bị thuyết phục"
  court.6080.c:0 "Ta tin rằng [6080_visitor.GetFirstNameNoTooltip] đã ở lại quá lâu [6080_visitor.GetHerHis] so với sự chào đón..."
  court.6080.d:0 "Thà để [6080_visitor.GetHerHim] tiêu tiền còn hơn ta."
 #The Art of Rhetoric
  court.6090.t:0 "Nghệ Thuật Hùng Biện"
  court.6090.desc:0 ""#EMP NHƯNG CON CHÁN CHẾT ĐI ĐƯỢC!#!" Ta lập tức nhận ra giọng than vãn của [6090_child_a.Custom2('MyCharacterIntroduction', ROOT.Char)] ngay cả trước khi tên nhóc ranh đó lọt vào tầm mắt.\n\nKhung cảnh trước mắt ta sau đó quả thật khá đáng thương:"
  court.6090.desc.cp: "[6090_poet.Custom2('MyCharacterIntroduction', ROOT.Char)] dường như sắp bật khóc"
  court.6090.desc.teacher: "[6090_poet.GetFirstName], một giáo viên nổi tiếng tại địa phương đang ghé thăm triều đình của chúng ta, dường như đã đến giới hạn [6090_poet.GetHerHis] của ngài"
  court.6090.desc.middle: "trong khi [6090_child_a.GetFirstNameNoTooltip] và [6090_child_b.GetFirstName] nhìn [6090_poet.GetHerHim] với ánh mắt chán chường nhất mà ta từng thấy trên gương mặt trẻ con của chúng."
  court.6090.desc_other:0 "[6090_child_c.GetFirstName] đã lang thang ra bên cửa sổ, rõ ràng hứng thú với #EMP bất cứ thứ gì#! đang diễn ra bên ngoài hơn."
  court.6090.desc_end:0 "\n\nKhi ánh mắt [6090_poet.GetHerHis] chạm vào ta, [6090_poet.GetFirstNameNoTooltip] cầu khẩn: "[ROOT.Char.Custom('FormOfAddressForLiege')|U], #EMP xin ngài#!, ta chỉ đang cố giải thích cho các con của ngài về nghệ thuật hùng biện tinh tế, như thân phận quý tộc của chúng đòi hỏi...""
  court.6090.a:0 "Chú ý nào, bọn trẻ! Sau này các con sẽ cần đến nó."
  court.6090.b:0 "Để ta giải thích cho chúng theo cách dễ hiểu hơn."
  court.6090.b.success:0 "Bọn trẻ tỏ ra ấn tượng"
  court.6090.b.failure:0 "Ta còn nhàm chán hơn cả [6090_poet.GetFirstNameNoTooltip]"
  court.6090.b.failure.tt:0 "Bọn trẻ chẳng học được gì"
  court.6090.c:0 "Ngươi thật quá nhàm chán, [6090_poet.GetFirstNameNoTooltip]!"
  court.6090.c.tt: "#EMP Chiến tranh#! mới là con đường xứng đáng cho giới quý tộc trẻ! Lại đây luyện tập với ta!"
