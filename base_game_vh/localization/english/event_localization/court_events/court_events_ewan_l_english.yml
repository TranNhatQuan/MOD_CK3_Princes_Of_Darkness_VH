 ##################################################
 # #Misc

 ##################################################
 # PATRONAGE
  court.2001.t:0 "Nịnh Hót Cạnh Tranh"
  court.2001.desc:0 "Cả [crony_a.GetFirstName] lẫn [crony_b.GetFirstName] đều không nhận ra khi ta lén tiến lại gần cuộc trò chuyện ồn ào của họ ngoài hành lang.\n\n\"Sự khúm núm #EMP về thể xác#! mới là chìa khóa! Mỗi vết bầm trên đầu gối do quỳ lạy đều là đồng tiền mới trong túi ta! Cứ phủ phục thì không bao giờ sai cả.\"\n\n\"Vớ vẩn, cứ xếp chồng các tính từ trước tước hiệu của [ROOT.Char.GetHerHis] là ngươi sẽ giàu đến chết. Nếu trước khi nói đến '[ROOT.Char.GetTitleAsNameNoTooltip]' mà phổi ngươi vẫn còn hơi, thì tức là ngươi làm sai rồi.\"\n\nTa ho khan một tiếng, khiến hai kẻ nịnh hót lập tức im bặt vì xấu hổ."
  court.2001.a:0 "Thành thật mà nói, cả hai ngươi đều có thể cố gắng hơn nữa."
  court.2001.a.sadistic:0 "Kẻ nào cúi thấp nhất sẽ nhận được đồng tiền #EMP sáng bóng#! này. Làm đi."
  court.2001.a.sadistic.crony_a_wins:0 "[crony_a.GetFirstNameNoTooltip] cúi thấp hơn"
  court.2001.a.sadistic.crony_b_wins:0 "[crony_b.GetFirstNameNoTooltip] cúi thấp hơn"
  court.2001.b:0 "Ta nhìn thấu trò thao túng của các ngươi rồi, lũ tay sai!"
  court.2001.c:0 "Ta nghĩ các ngươi đã bỏ lỡ cách hiển nhiên nhất để chiếm được lòng ta..."
  court.2001.d:0 "Chuyện này quá thấp kém đối với ta."

 ##################################################
 # MAJESTY
  court.2201.t:0 "Một Phần Của Chiếc Bánh"
  court.2201.desc:0 "\"-thuộc về con! Chia [ROOT.Char.GetPrimaryTitle.GetNameNoTier] ra cho nhiều người thừa kế khác nhau thật vô lý!\" [eldest_heir.GetFirstName] kêu lên khi [eldest_heir.GetSheHe] và [younger_heir.Custom2('HerHisCharacterIntroduction', eldest_heir)] cãi vã ầm ĩ ở đầu bên kia căn phòng. \"Chúng ta đang đẩy vương quốc vào giết chóc và nội chiến. [ROOT.Char.GetMotherFather|U] nên để toàn bộ lãnh địa của [ROOT.Char.GetHerHis] cho #EMP con#!!\"\n\n\"Giết chóc? Nội chiến? Vậy chính xác #EMP ngươi#! định làm gì khi ngươi trở thành [ROOT.Char.GetTitleAsNameNoTooltip]?\" [younger_heir.GetFirstNameNoTooltip] khịt mũi. \"Ngươi sẽ là một con quái vật cai trị nếu trước khi vương miện còn chưa #EMP chạm#! vào cái đầu xấu xí của ngươi mà ngươi đã nghĩ về gia đình mình như thế.\"\n\nĐầu ta nhức nhối. Chúng đã cãi nhau. Suốt. Cả. Buổi. Sáng."
  court.2201.a:0 "Muốn được #EMP nhiều hơn#! à, [eldest_heir.GetFirstNameNoTooltip]? Vậy thì #EMP không có gì#!!"
  court.2201.b:0 "Đáng tiếc phải nói rằng, luật chơi vốn là vậy, [younger_heir.GetFirstNameNoTooltip]..."
  court.2201.c:0 "Chúng là gia đình, chắc sẽ tự hòa thuận #EMP ổn thôi#! mà không cần ta, đúng không?"
  court.2201.d:0 "Các con, các con có muốn biết ý nghĩa thật sự của gia đình không?"

 ##################################################
 # FOREIGN GUESTS
  court.2401.t:0 "Vẻ Hào Nhoáng Hàng Cũ"
  court.2401.desc:1 "\"Y phục đẹp nhất trong vùng, thưa [ROOT.Char.GetTitleAsNameNoTooltip], chủ yếu vì chúng #EMP không#! phải từ vùng này\", [seller.GetFirstName] cười khúc khích khi ta đi ngang qua gian phòng mở của [seller.GetHerHis]. Giọng nói của [seller.GetHerHis|U] tràn đầy vẻ quyến rũ và láu lỉnh.\n\n\"Gần như mới, tốt chẳng kém đồ mới, lại vừa được mang về từ nơi dẫn đầu xu hướng ở triều đình của [grander_ruler.GetTitledFirstNamePossessive]! Đây chính là thứ #EMP mọi người#! trong [grander_ruler.GetPrimaryTitle.GetName] sẽ mặc vào mùa tới.\""
  court.2401.a:0 "Ồ, trông chúng #EMP thật#! hấp dẫn..."
  court.2401.b:0 "Triều đình của ta không cần thứ vớ vẩn ngoại lai!"
  court.2401.c:0 "Ai quan tâm người ta mặc gì chứ?"

  court.2411.t:0 "Những Hành Lang Mê Cung"
  court.2411.desc:1 "Buổi đi dạo đưa ta qua một cánh cung điện không còn sử dụng, tham quan những khu nhà rộng rãi (dù đầy bụi bặm) mà các nhân viên quá tải của ta hiếm khi ghé thăm, khi ta nghe thấy tiếng nức nở trầm đục phát ra từ lối đi bên cạnh.\n\nĐiều tra, ta tìm thấy [lost_guest.Custom2('MyCharacterIntroduction', ROOT.Char)], gục ngã trong tuyệt vọng. [lost_guest.GetSheHe|U] chồm dậy ngay khi [lost_guest.GetSheHe] nhìn thấy ta, túm lấy vai ta, và bắt đầu lảm nhảm như một kẻ điên [lost_guest.GetWomanMan].\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip] của tôi, tôi đã bị lạc trong những lối đi này suốt #EMP ba ngày#!! Tôi không thể tìm thấy lối ra, chỉ toàn những hành lang nối tiếp vô tận và những căn phòng ẩm mốc mà chẳng có lấy một người hầu nào trong tầm mắt!\""
  court.2411.a:1 "Nhân danh [ROOT.Char.GetFaith.HighGodName], để ta chỉ đường ra cho ngươi!"
  court.2411.b:0 "Làm sao mà... Làm sao ngươi có thể #EMP ngu ngốc#! đến vậy?"
  court.2411.c:1 "*Huýt sáo* Thật là một tổ ong hành lang mà ta đang sở hữu..."

