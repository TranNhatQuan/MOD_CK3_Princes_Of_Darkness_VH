l_english:

 court.5001.t:0 "Những Ngày Cô Đơn"
 court.5001.desc:0 "[friend.Custom2('MyCharacterIntroduction', ROOT.Char)|U] chán đến chết; ta có thể thấy điều đó trên gương mặt [friend.GetHerHis] và trong cách [friend.GetSheHe] luôn tìm cách thu hút sự chú ý của ta vào mọi lúc.\n\nTa biết nghĩa vụ của mình chiếm quá nhiều thời gian và đôi khi khiến [friend.GetHerHim] cảm thấy cô đơn..."
 court.5001.a:0 "Ta sẽ dành nhiều thời gian hơn cho [friend.GetHerHim]."
 court.5001.b:0 ""Ngươi biết mình cần gì không? Một [friend.Custom('WifeHusbandOpp')].""
 court.5001.c_dog:0 ""Ngươi... Ngươi có thể nuôi [ROOT.Char.Custom('DogStoryName')].""
 court.5001.c_cat:0 ""Ngươi... Ngươi có thể nuôi [ROOT.Char.Custom('CatStoryName')].""
 court.5001.d:0 "[friend.GetSheHe|U] cần một công việc để bận rộn."

 court.5010.t:0 "Bóng Ma Ám Ảnh"
 court.5010.desc:0 "Ngày càng nhiều người hầu mắt mở to tìm đến ta, khẳng định rằng họ đã thấy [family_member.Custom2('MyCharacterIntroduction', ROOT.Char)] đi lại trong các hành lang.\n\n"[family_member.GetSheHe|U] không thể yên nghỉ, [ROOT.Char.Custom('FormOfAddressForLiege')]. Vì thế [family_member.GetSheHe] lang thang tại nơi [family_member.GetHerHis] đã chết!""
 court.5010.a:0 "Dừng ngay trò vô nghĩa này, [family_member.GetSheHe] đã chết rồi!"
 court.5010.b:0 "Thật vinh dự khi [family_member.GetSheHe] ghé thăm chúng ta, đừng quấy rầy [family_member.GetHerHim]."
 court.5010.c:0 "Ta sẽ cho người điều tra chuyện này."

 court.5020.t:0 "Chuyện Trên Gối"
 court.5020.desc:0 "[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] lao tới chỗ ta trong trạng thái kích động, quầng thâm sâu dưới mắt [courtier.GetHerHis].\n\n"Con mèo chết tiệt của ngài không chịu để yên phòng của ta; dường như #EMP gối#! của ta là nơi ngủ ngon nhất trong cả cái [ROOT.Char.Custom('ResidenceBuilding')] khốn kiếp này. Sinh vật đó cần phải bị kiểm soát!" [courtier.GetFirstNameNoTooltip] dừng lại trước khi cố trấn tĩnh [courtier.GetHerselfHimself], "Nếu điều đó làm hài lòng [ROOT.Char.GetLadyLord] của thần.""
 court.5020.a:0 "Rõ ràng giờ đây đó là chiếc gối của [ROOT.Char.Custom('CatStoryNamePossessive')]."
 court.5020.b:0 "Ta sẽ đảm bảo [ROOT.Char.Custom('CatStorySheHe')] tránh xa."

 court.5021.desc:0 "Ta nhìn thấy [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] ở phía bên kia căn phòng; dạo gần đây [courtier.GetSheHe] có tâm trạng rất tốt, và quầng thâm dưới mắt [courtier.GetHerHis] cũng biến mất.\n\nĐiều khiến ta lo lắng là con mèo yêu quý của ta, [ROOT.Char.Custom('CatStoryName')], dường như cũng biến mất cùng lúc..."
 court.5021.desc_mittens:0 "\n\n[courtier.GetFirstNameNoTooltip] thấy ta đang nhìn và vẫy tay, đôi găng tay mới bằng lông [ROOT.Char.Custom('CatFurColor')] hiện rõ."
 court.5021.a:0 "[ROOT.Char.Custom('CatStorySheHe')] có thể đang ở đâu?"
 court.5021.a_mittens:0 "Đôi găng tay thật đẹp– Ôi không, #EMP [ROOT.Char.Custom('CatStoryName')]#!!"
 court.5021.b:0 "[courtier.GetFirstNameNoTooltip] cũng sẽ biến mất tương tự."
 court.5021.c:0 ""Số phận của ngươi sẽ giống [ROOT.Char.Custom('CatStoryNamePossessive')].""

 court.5025.t:0 "Lời Đề Nghị Mua"
 court.5025.desc:0 ""Bộ lông [ROOT.Char.Custom('CatFurColor')] óng ánh đó và đôi mắt [ROOT.Char.Custom('CatEyeColor')] ấy... Ta chưa từng thấy con mèo nào đẹp như vậy!"\n\n[buyer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vuốt ve [ROOT.Char.Custom('CatStoryName')] đầy suy tính trước khi quay lại nhìn ta. "[ROOT.Var('price_for_pet').GetValue|0] vàng chắc là đủ, phải không?""
 court.5025.a:0 "[ROOT.Char.Custom('CatStorySheHe')|U] là của ngươi!"
 court.5025.b:0 "Ngươi dám sao, ta sẽ không bao giờ bán [ROOT.Char.Custom('CatStoryName')]!"

 court.5026.desc:1 ""Bộ lông [ROOT.Char.Custom('DogFurColor')] óng ánh như vậy, lại còn được huấn luyện tốt! Ta chưa từng thấy con chó nào tuyệt vời đến thế!"\n\n[buyer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vuốt ve [ROOT.Char.Custom('DogStoryName')] một cách suy nghĩ trước khi quay lại nhìn ta. "[ROOT.Var('price_for_pet').GetValue|0] vàng chắc là đủ, phải không?""
 court.5026.a:0 "[ROOT.Char.Custom('DogStorySheHe')|U] là của ngươi!"
 court.5026.b:0 "Ngươi dám sao, ta sẽ không bao giờ bán [ROOT.Char.Custom('DogStoryName')]!"

 court.5030.t:0 "Giờ Chơi"
 court.5030.desc_opening:0 "Bên kia căn phòng ta thấy [child.Custom2('MyCharacterIntroduction', ROOT.Char)] đang chơi với món đồ chơi yêu thích của [child.GetHerHis], một [child.Custom('child_favorite_toy')]."
 court.5030.desc_young:0 "Người lớn quanh ta lúc nào cũng không vui và muốn ta giúp họ, nhưng ta nghĩ mình thà giúp đánh bại con rồng đáng sợ mà [child.GetSheHe] đang chiến đấu!"
 court.5030.desc:0 "Ta đã nghe người ta than phiền suốt cả ngày và chán đến #EMP chết#! nên không thể không để tâm trí mình trôi theo trò chơi mà [child.GetSheHe] đang chơi..."
 court.5030.desc_ending:0 "\n\n[child.GetFirstNameNoTooltip] thấy ta đang nhìn và vẫy tay gọi ta tham gia cùng [child.GetHerHim]."
 court.5030.a:0 "Mang cho ta [ROOT.Char.Custom('child_favorite_toy')] của ta!"
 court.5030.b_young:0 "Không, ta phải nghiêm túc."
 court.5030.b:0 "Không, ta phải học."

 court.5040.t:0 "Chuỗi Trò Chơi Khăm"
 court.5040.desc:0 "Một lần nữa ta phải nghe mọi người phàn nàn – [prank_alternative_1.Custom2('MyCharacterIntroduction', ROOT.Char)] muốn được chú ý, [prank_alternative_2.Custom2('MyCharacterIntroduction', ROOT.Char)] nói rằng triều đình của ta đã trở nên nhàm chán, và [prank_alternative_3.Custom2('MyCharacterIntroduction', ROOT.Char)] cho rằng gần đây có quá nhiều bữa ăn chứa bàng quang động vật, trong mọi thứ.\n\n...Khoan đã, ta có một ý tưởng."
 court.5040.a:0 "Ta phải kiềm chế và cư xử như một [ROOT.Char.GetLadyLord] đúng mực."
 court.5040.b:0 "Một chiếc bàng quang phồng trên ghế của [prank_alternative_1.GetFirstNamePossessiveNoTooltip] – thế mới là chú ý!"
 court.5040.c:0 "[prank_alternative_2.GetFirstNameNoTooltip] đánh rắm chắc chắn sẽ không còn nhàm chán."
 court.5040.d:0 "[prank_alternative_3.GetFirstNameNoTooltip] sẽ tìm thấy một chiếc bàng quang trên ghế của [prank_alternative_3.GetHerHis] thay vì trên đĩa!"

 court.5041.desc_option_1:0 "Khi [prank_target.GetTitledFirstName] đang mất tập trung trong bữa tối ta cẩn thận rắc những mảnh dây đàn lia nhỏ lên đĩa của [prank_target.GetHerHis].\n\nTa gần như không nhịn được cười khi [prank_target.GetSheHe] quay lại và thấy chiếc đĩa trước mặt [prank_target.GetHerHim] đầy giòi bò lúc nhúc, nhưng ta phải tránh bị nghi ngờ nếu muốn tiếp tục chiến dịch này!"
 court.5041.desc_option_2:0 "Ta phơi khô máu bê và nghiền thành bột, rồi rắc lên miếng thịt của [prank_target.GetTitledFirstNamePossessive] khi [prank_target.GetSheHe] không để ý. Ngay lập tức bột hóa thành máu và ta phải cố hết sức để không cười khi gương mặt [prank_target.GetFirstNamePossessiveNoTooltip] biến dạng vì kinh hoàng khi miếng thịt bắt đầu rỉ máu trước mặt [prank_target.GetHerHim]!"
 court.5041.desc_option_3:0 "Trong bí mật ta sai người hầu tìm cho ta rắn – càng nhiều càng tốt. Sau đó, khi [prank_target.GetTitledFirstName] đi vắng, ta thả chúng vào phòng của [prank_target.GetHerHis]. Những tiếng hét vang vọng khắp hành lang khi [prank_target.GetHerHis] trở về khiến ta cười đến phát điên!"
 court.5041.desc_option_4:0 "Ta nghiền nhang thành bột cực mịn rồi giấu trong tay. Sau đó, khi chúng ta ngồi đối diện nhau với một ngọn nến giữa bàn, ta vung tay về phía mặt [prank_target.GetTitledFirstNamePossessive]. Khi bột bay qua ngọn lửa nó bùng cháy rực rỡ!\n\n[prank_target.GetSheHe|U] hét lên tưởng rằng mặt [prank_target.GetHerHis] đang cháy, nhưng ta biết đó chỉ là trò lừa và cười khoái chí."
 court.5041.desc_option_5:0 "Ta cẩn thận mở hé cửa phòng của [prank_target.GetTitledFirstNamePossessive] và, đứng trên một chiếc ghế, từ từ đặt một bô đầy lên trên khung cửa. Sau đó: gõ cửa thật nhanh và chạy biến quanh góc hành lang.\n\n“Ai đ–” #EMP Tõm!#!"
 court.5041.desc_opening:0 "#EMP Brrt!#!\n\nÂm thanh vang khắp hành lang khi [prank_target.Custom2('MyCharacterIntroduction', ROOT.Char)] ngồi xuống, và gương mặt [prank_target.GetHerHis] càng đỏ hơn khi sự im lặng kéo dài. Ta cố nén cười, nhưng nếu muốn tiếp tục chơi khăm [prank_target.GetHerHim] ta phải tránh bị nghi ngờ!"
 court.5041.a:0 "Ta sẽ dừng lại, và ta sẽ an ủi [prank_target.GetHerHim]."
 court.5041.option_1:0 "Bữa ăn tiếp theo của [prank_target.GetHerHis|U] sẽ đầy "giòi"!"
 court.5041.option_2:0 "Miếng thịt tiếp theo [prank_target.GetSheHe] ăn sẽ trông như đang chảy máu!"
 court.5041.option_3:0 "Ta sẽ thả rắn vào phòng của [prank_target.GetHerHis]!"
 court.5041.option_4:0 "Ta sẽ dọa [prank_target.GetHerHim] bằng bột dễ cháy!"
 court.5041.option_5:0 "Một bất ngờ sẽ chờ [prank_target.GetHerHim] trên khung cửa phòng của [prank_target.GetHerHis]!"

 court.5042.desc_chastiser:0 "\n\n[chastiser.Custom2('MyCharacterIntroduction', ROOT.Char)|U] thì không thấy điều đó buồn cười chút nào.\n\n"Ta biết chính ngài là người bày ra những trò chơi khăm quỷ quái này trong triều."
 court.5042.desc_chastiser_snake:0 "Tội nghiệp [prank_target.GetTitledFirstName] giật mình trước mọi cái bóng, và những con rắn đã làm gì với mặt [prank_target.GetHerHis]... Thật là ô nhục, thưa bệ hạ.""
 court.5042.desc_chastiser_no_snake:0 "Tội nghiệp [prank_target.GetTitledFirstName] giật mình trước mọi cái bóng! Thật là ô nhục... thưa bệ hạ.""
 court.5042.desc_no_chastiser:0 "Các cận thần của ta không thấy điều đó buồn cười chút nào, và họ nói rõ rằng họ sẽ lên án bất kỳ trò chơi khăm nào nữa. Và rằng họ sẽ luôn cảnh giác."
 court.5042.a:0 "Chỉ là trò đùa thôi!"

 court.5050.t:0 "Một Cận Thần Bị Xúc Phạm"
 court.5050.desc:2 ""Vì sao ngài lại ban chức vị tại triều cho cái [courtier_given_title.Custom2('InsultNoun', SCOPE.sC('courtier'))] [courtier_given_title.GetTitledFirstName] đó mà không phải ta?"\n\n[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vô cùng phẫn nộ. Rõ ràng [courtier.GetSheHe] đã chắc chắn rằng vinh dự đó sẽ thuộc về [courtier.GetHerHim], chứ không phải ai khác."
 court.5050.a:0 "Thôi nào, đừng quá đáng!"
 court.5050.b:1 "Ngươi nói đúng, ngươi xứng đáng có một vị trí."
 court.5050.c:0 "Nếu ngươi thích đùa như vậy ta nên bắt đầu trả tiền cho ngươi!"

 court.5055.t:0 "Tài Năng Sắc Màu"
 court.5055.desc:0 "Ta bắt gặp [painter.Custom2('MyCharacterIntroduction', ROOT.Char)] ngồi bệt dưới sàn, xung quanh là sơn đổ và những mảnh toan vương vãi, đây đã là lần thứ ba trong tháng này.\n\nCác cận thần thì thầm rằng [painter.GetHerHim] là một thiên tài hội họa đang dần hình thành, nhưng đám gia nhân lại than phiền vì phải kỳ cọ sàn nhà để tẩy sạch sơn sau mỗi lần #EMP cảm hứng#! của [painter.GetHerHis]."
 court.5055.a:0 "Ngươi cần tập trung vào những việc học #EMP hữu ích#! hơn, [painter.GetFirstNameNoTooltip]."
 court.5055.b:0 "Thiên tài của [painter.GetHerHis|U] sẽ được nuôi dưỡng!"
 court.5055.b_tt:0 "[painter.GetFirstNameNoTooltip] tiếp tục theo đuổi nghệ thuật của [painter.GetHerHis]."

 court.5056.desc_opening:1 "Tài năng cầm cọ của [painter.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ngày càng trưởng thành theo năm tháng; cùng với đó là sự hứng thú và năng lực của [painter.GetHerHis] trong những lĩnh vực khác.\n\n"
 court.5056.desc_family:1 ""Cảm ơn vì đã tin tưởng ta, [painter.Custom2('RelationToMeShort', ROOT.Char )]."
 court.5056.desc:0 ""Cảm ơn vì đã tin tưởng ta và tài năng của ta, [ROOT.Char.Custom('FormOfAddressForLiege')]."
 court.5056.desc_ending:1 "Ta có một dự án mới muốn bắt đầu, có lẽ ngài sẽ muốn trở thành người bảo trợ của ta thêm một lần nữa?""
 court.5056.a:1 "Dĩ nhiên!"
 court.5056.b:0 "Ngươi giờ đã đủ lớn để tự bước đi trên con đường của mình."

 court.5057.desc:0 "Theo năm tháng trôi qua, một sự thật đau lòng trở nên quá rõ ràng: [painter.Custom2('MyCharacterIntroduction', ROOT.Char)] không hề có tài năng lẫn quyết tâm để vẽ nên kiệt tác mà [painter.GetSheHe] từng hứa với ta.\n\n"Ta chỉ là một đứa trẻ muốn được chú ý. Không ngờ ngài lại thật sự tin vào những lời nhảm nhí của ta!""
 court.5057.a:0 "À, sự dại dột của tuổi thơ..."
 court.5057.b:0 "Không ai được phép biến ta thành trò cười!"

 court.5060.t:0 "$knight_culture_player_no_tooltip$ Hào Hiệp"
 court.5060.desc:0 "[knight.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã lập công xuất sắc trong những trận chiến gần đây và triều đình của ta đang xôn xao bàn tán; thật là một $knight_culture_player_no_tooltip_lowercase$ tài ba, một tấm gương mẫu mực, một #EMP [knight.GetWomanMan]#! đáng khâm phục!\n\nKhi lời ca tụng dồn dập đổ xuống [knight.GetHerHim], rõ ràng mọi người đều mong đợi ta chính thức ban thưởng cho [knight.GetHerHim] bằng một cách nào đó."
 court.5060.a:0 "Ừm... Ta sẽ nói tốt về [knight.GetHerHim]."
 court.5060.b:0 "[knight.GetSheHe|U] sẽ trở thành [knight.GetLadyLord] mới của [title_to_grant.GetNameNoTooltip]!"
 court.5060.c:0 "Một dòng dõi $knight_culture_player_no_tooltip_lowercase$ thật đáng ca ngợi!"
 court.5060.d.champion:0 "[knight.GetSheHe|U] sẽ phục vụ ta với tư cách $champion_court_position$!"
 court.5060.d.bodyguard:0 "[knight.GetSheHe|U] sẽ phục vụ ta với tư cách $bodyguard_court_position$!"
 court.5060.d.akolouthos: "[knight.GetSheHe|U] sẽ phục vụ ta với tư cách $akolouthos_court_position$!"

 court.5070.t:0 "Gia Sư Tận Tâm"
 court.5070.desc:0 "[court_tutor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đến gặp ta với những lo ngại về tình trạng tài liệu giáo dục của chúng ta.\n\n"Chúng ta vẫn xoay xở được, nhưng hãy tưởng tượng xem con trẻ của chúng ta có thể đạt tới những tầm cao nào nếu có tài liệu tốt hơn... Những bảng sáp mới, giấy da, có lẽ cả mực viết nữa!""
 court.5070.a:0 "Nhưng ngươi đã làm rất tốt rồi mà!"
 court.5070.b:0 "Dĩ nhiên ngươi sẽ có ngân quỹ!"
 court.5070.b.tt:0 "Điều này cải thiện việc giáo dục của tất cả học trò do ngươi giám hộ"

 court.5075.t:0 "Hai Con Ngựa Palfrey"
 court.5075.desc_opening:0 "[neighbor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã ban tặng ta một món quà vô cùng hào phóng: một cặp ngựa palfrey thuần chủng, một con cái và một con đực!\n\n"
 court.5075.desc_horse_master:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]," [master_of_the_horse.Custom2('MyCharacterIntroduction', ROOT.Char)] gọi ta lại gần con [dummy_gender.Custom('HorseMareStallion')]."
 court.5075.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]," người quản chuồng ngựa của ta gọi ta lại gần con [dummy_gender.Custom('HorseMareStallion')]."
 court.5075.desc_ending:0 ""Hãy nhìn những khối cơ này... Và cả phần hông sau kia! Con này sẽ rất hữu dụng trong chiến trận.""
 court.5075.a:0 "Chúng sẽ phục vụ các lãnh chúa và quý bà trong triều."
 court.5075.b:0 "Và cả hai chắc chắn sẽ bán được giá tốt!"
 court.5075.c:0 "Ta sẽ tự mình huấn luyện con [dummy_gender.Custom('HorseMareStallion')]."
 court.5075.c.success:0 "Ngươi huấn luyện con ngựa thành công"
 court.5075.c.failure:0 "Con ngựa hất ngươi ngã"
