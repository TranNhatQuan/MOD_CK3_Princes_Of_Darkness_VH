  travel_danger_events.6020.t:0 "$travel_danger_prefix$ Nguy Hiểm Biển Sâu"
  travel_danger_events.6020.desc:0 "Những đám mây đen tụ lại, và Ta cảm nhận sự sợ hãi phía sau những lời trấn an của thuyền trưởng. Một cơn giông dữ sắp ập đến, mưa táp mạnh trên boong khi [ROOT.Char.Custom('RegionalShipType')] lắc lư như đồ chơi.\n\nMột tiếng nứt lớn, to hơn sấm, như cả thế giới bị xé đôi bởi một gã khổng lồ khủng khiếp, vang vào tai chúng Ta khi con tàu uốn mình dưới chân.\n\n"
  travel_danger_events.6020.hugger:0 "[hugger.GetTitledFirstName] và Ta ôm chặt lấy nhau trong kinh hoàng, mắt mở to khi một làn sóng khổng lồ lao về phía con tàu!"
  travel_danger_events.6020.prayer:0 "Ta dõi theo [prayer.GetTitledFirstName], đang quỳ gối với hai tay dang rộng hướng lên bầu trời rạch tràn tia chớp, than khóc rằng: "[prayer.GetFaith.HighGodName]! [prayer.GetFaith.WaterGodName]! Xin hãy cứu độ chúng con!" đúng lúc một đợt sóng dữ khổng lồ cuộn trào qua boong tàu!"
  travel_danger_events.6020.diver:0 "[diver.GetTitledFirstName] ôm chặt lấy thái dương của [diver.GetHerHis], gào thét: "Nỗi kinh hoàng của [diver.GetFaith.DevilNamePossessive] đã đến để bắt lấy chúng ta! Không đường cứu vãn!" trước khi lao [diver.GetHerselfHimself] vào ngọn sóng khổng lồ đang cuộn trào qua con tàu!"
  travel_danger_events.6020.director:0 "Ta nhìn, kinh ngạc, khi [director.GetTitledFirstName] đứng thẳng, hô lệnh mà không ai nghe thấy, bất chấp làn sóng khổng lồ sắp nhấn chìm [director.GetHerHim]!"
  travel_danger_events.6020.fallback:0 "Ta chui sát vào một góc, nhìn kinh hãi khi các thủy thủ bị ném xuống vực sâu đen ngòm, và một làn sóng khổng lồ tràn qua tàu."
  travel_danger_events.6020.a:0 "ArghghghGHHghghh!"

  travel_danger_events.6030.t:0 "$travel_danger_prefix$ Thực Phẩm Hỏng"
  travel_danger_events.6030.leader:0 "[travel_leader.GetFirstName] chịu trách nhiệm về thực phẩm của chúng Ta, và xấu hổ tiết lộ rằng đồ dự trữ giờ gần như vô dụng, vì được bảo quản kém..."
  travel_danger_events.6030.fallback:0 "Ta khó tin, nhưng thực phẩm dự trữ cho chuyến đi gần như vô dụng, vì được bảo quản kém..."
  travel_danger_events.6030.desc:1 "\n\nNhững mảng mốc phủ trên bánh mì và nông sản, và chúng Ta nhanh chóng dùng hết thực phẩm khô còn lại. Cả đoàn bắt đầu đói khi chiều tối buông xuống."
  travel_danger_events.6030.a:0 "Chỉ là một chút mốc thôi!"
  travel_danger_events.6030.b:0 "Thiên nhiên sẽ cung cấp cho chúng ta!"
  travel_danger_events.6030.b.success:0 "Ngài tìm được thức ăn"
  travel_danger_events.6030.b.failure:0 "Ngài không tìm được gì"
  travel_danger_events.6030.b.critical:0 "Ngài ăn nhầm cây độc"
  travel_danger_events.6030.b.death:0 "Ngài ăn phải cây nguy hiểm nhất"
  travel_danger_events.6030.c:1 "Người dân quanh đây chắc chắn đã #EMP làm gì đó#!."
  travel_danger_events.6030.d:0 "Chúng Ta sẽ phải thay thế tất cả."

  travel_danger_events.6040.t:0 "$travel_danger_prefix$ Thời Tiết Xấu"
  travel_danger_events.6040.wet:0 "Chuyến đi qua [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] nguyền rủa này thật khó khăn, làm mòn thần kinh và sức lực khi chúng Ta lê bước qua độ ẩm khó chịu, đập côn trùng và cố gắng giữ khô."
  travel_danger_events.6040.war:0 "[ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] bị chiến tranh tàn phá, rải rác nạn nhân và trại của các lính. Điều kiện khắc nghiệt, và các cuộc gặp với binh lính thường xuyên."
  travel_danger_events.6040.desc:0 "\n\nTa bắt đầu cảm thấy yếu, tụt lại phía sau đoàn khi bình thường Ta dẫn tốc độ... Có điều gì đó không ổn..."
  travel_danger_events.6040.a:0 "Ta phải quay lại."
  travel_danger_events.6040.b:0 "Cảm ơn [ROOT.Char.GetFaith.HealthGodName] vì $court_physician_court_position$ của Ta đang ở đây."
  travel_danger_events.6040.c:0 "Chúng Ta phải tiến lên..."
  travel_stealing_food_modifier:0 "Thực Phẩm Bị Lấy Trộm"
  travel_stealing_food_modifier_desc:0 "Các quý tộc đi qua hạt này đã lấy sản vật của dân chúng làm của riêng."
