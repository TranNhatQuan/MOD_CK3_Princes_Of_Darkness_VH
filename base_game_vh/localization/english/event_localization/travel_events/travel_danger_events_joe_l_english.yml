l_english:
#Travel Danger Events
#Land: Beast of the wild
  travel_danger_events.6000.t:0 "$travel_danger_prefix$ Quái Vật Khủng Khiếp!"
  travel_danger_events.6000.desc:0 "Chúng Ta đi trên con đường [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] với tốc độ vừa phải, tận hưởng không khí yên bình. Lướt mắt nhìn quanh, Ta chắc chắn thoáng thấy [ROOT.Char.Custom('GetAnimalFeature')] của…! Một tiếng [ROOT.Char.Custom('GetAnimalSound')] vang lên khẳng định điều đó, một [ROOT.Char.Custom('GetAnimalType')]!"
  travel_danger_events.6000.desc.again:0 "Ta bước chậm trên con đường [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')], thận trọng sau lần gặp gỡ quái thú gần đây. Tim Ta hụt một nhịp khi nghe tiếng [ROOT.Char.Custom('GetAnimalSound')] trong [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] — [ROOT.Char.GetFaith.FateGodName] thật trêu ngươi! Một [ROOT.Char.Custom('GetAnimalType')]!"
  travel_danger_events.6000.desc.seriously:0 "Bị ám ảnh bởi vận rủi vừa qua, chúng Ta đi qua các con đường [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] với sự thận trọng tối đa. Vừa khi Ta bắt đầu thả lỏng, một tiếng [ROOT.Char.Custom('GetAnimalSound')] vang lên từ [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]! Một con [ROOT.Char.Custom('GetAnimalType')] chết tiệt!"
  travel_danger_events.6000.body:0 "\n\nCon quái vật [ROOT.Char.Custom('GetAnimalColor')] [ROOT.Char.Custom('GetAnimalChargePresent')] xuống đường, những [ROOT.Char.Custom('GetAnimalTrackPlural')] khổng lồ của nó quét lên [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')]. Bao quanh bởi những cây [ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')], nó chắn hoàn toàn lối đi của chúng Ta tới [destination.GetBaronyNameExplicitlyNoTooltip]."
  travel_danger_events.6000.victim:0 "\n\n[beast_victim.GetFirstName] thì thầm, \"Nhìn kìa những #EMP [ROOT.Char.Custom('GetAnimalDanger')]#!…\""
  travel_danger_events.6000.a:0 "Tránh ra, để Ta xử lý!"
  travel_danger_events.6000.a_again:0 "Ta sẽ gửi ngươi đi gặp cái khác!"
  travel_danger_events.6000.a_seriously:0 "Để Ta #EMP QUA#!!"
  travel_danger_events.6000.a.wounded.t:0 "Đã cứu nhưng bị thương"
  travel_danger_events.6000.a.wounded.desc:0 "Thủy thủ cứu [overboard_character.GetShortUIName] nhưng [overboard_character.GetSheHe] bị thương khi rơi"
  travel_danger_events.6000.b:0 "Giết nó đi, [beast_victim.GetFirstNameNoTooltip]! Ngay bây giờ!"
  travel_danger_events.6000.b_again:0 "Tới lượt ngươi, [beast_victim.GetFirstNameNoTooltip]!"
  travel_danger_events.6000.b_seriously:0 "Con này là #EMP của ngươi#!, [beast_victim.GetFirstNameNoTooltip]!"
  travel_danger_events.6000.b_travel_leader:0 "[travel_leader.GetFirstNameNoTooltip], làm gì đó đi!"
  travel_danger_events.6000.c:0 "#EMP CHẠY#!! CHẠY CHO MẠNG #EMP CỦA MÌNH#!!"
  travel_danger_events.6000.success: "Con [ROOT.Char.Custom('GetAnimalType')] chết dưới tay [beast_victim.GetShortUINamePossessiveNoTooltipNoFormat]"
  travel_danger_events.6000.wound: "Con [ROOT.Char.Custom('GetAnimalType')] làm [beast_victim.GetShortUINameNoTooltipNoFormat] bị thương"
  travel_danger_events.6000.failure: "Con [ROOT.Char.Custom('GetAnimalType')] giết [beast_victim.GetShortUINameNoTooltipNoFormat]"
  travel_danger_events.6000.success_root: "Con [ROOT.Char.Custom('GetAnimalType')] chết dưới tay [root_scope.GetShortUINamePossessiveNoTooltipNoFormat]"
  travel_danger_events.6000.wound_root: "Con [ROOT.Char.Custom('GetAnimalType')] làm [root_scope.GetShortUINameNoTooltipNoFormat] bị thương"
  travel_danger_events.6000.failure_root: "Con [ROOT.Char.Custom('GetAnimalType')] giết [root_scope.GetShortUINameNoTooltipNoFormat]"

  travel_danger_events.6010.t:0 "$travel_danger_prefix$ Khói Ở Phía Trước"
  travel_danger_events.6010.raid:0 "Khi chúng Ta đến gần [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip], những cột khói và nhóm nông dân đi qua cho thấy nơi đây đang bị cướp phá. Kẻ mạnh có thể lấy bất cứ thứ gì chúng thích...\n\n"
  travel_danger_events.6010.siege:0 "Một trại vây hãm chiếm vùng ngoại vi [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip], màu sắc [siege_owner.GetPrimaryTitle.GetAdjectiveNoTooltip] bay phấp phới, báo hiệu cho một [siege_war.Custom('WarCasusBelliShort')].\n\n"
  travel_danger_events.6010.victim:0 "Ta đau lòng khi thấy đất đai của mình bị tàn phá như vậy, nhưng đây không phải là trận chiến Ta có thể thắng."
  travel_danger_events.6010.owner:0 "Lực lượng của Ta sẽ nhanh chóng xử lý [siege_victim.GetTitledFirstNamePossessive] cái thứ gọi là [siege_victim.Custom('FortifiedBuilding')] này."
  travel_danger_events.6010.war_owner:0 "Hy vọng những kẻ tấn công sẽ thắng và kéo [siege_victim.GetTitledFirstName] ra, vùng vẫy và la hét."
  travel_danger_events.6010.war_victim:0 "Giá mà Ta có thể làm gì đó giúp [siege_victim.GetTitledFirstName], và loại bỏ tên [siege_owner.GetTitledFirstName] chết tiệt kia."
  travel_danger_events.6010.ally_owner:0 "Ta tin đồng minh của Ta sẽ được minh oan và chỉnh đốn [siege_victim.GetTitledFirstName] cho đúng."
  travel_danger_events.6010.ally_victim:0 "Ta chỉ có thể đứng nhìn khi đồng minh của Ta, [siege_victim.GetTitledFirstNamePossessive], lãnh thổ bị phá hủy từng chút một."
  travel_danger_events.6010.relation_owner:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('siege_owner'))] của Ta, [siege_owner.GetTitledFirstName], rõ ràng muốn hạ gục [siege_victim.GetTitledFirstName], bất chấp mọi giá."
  travel_danger_events.6010.relation_victim:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('siege_victim'))] của Ta, [siege_victim.GetTitledFirstName], rõ ràng đang gặp khó khăn trong việc bảo vệ nơi này khỏi lực lượng [siege_owner.GetTitledFirstNamePossessive]."
  travel_danger_events.6010.sieger_liege:0 "Chư hầu của Ta, [siege_owner.GetTitledFirstName], rõ ràng muốn hạ gục [siege_victim.GetTitledFirstName], bất chấp mọi giá."
  travel_danger_events.6010.peace:0 "Cuộc xung đột nhỏ giữa [siege_owner.GetTitledFirstName] và [siege_victim.GetTitledFirstName] chắc chắn là một phiền toái."
  travel_danger_events.6010.raid_end:0 "Giữa những túp lều cháy, những bóng người nhặt nhạnh đống đổ nát, so sánh chiến lợi phẩm và kể lại những câu chuyện dũng cảm.\n\nMột nhóm cướp có vẻ cộc cằn, rách rưới đang tiến lên con đường — trông họ không sáng dạ hay công bằng lắm..."
  travel_danger_events.6010.siege_end:0 "Giữa những [siege_owner.Custom('RegionalArtilleryPlural')], những người lính xa xôi sưởi ấm bên những đống lửa tạm.\n\n$travel_danger_events.6010.closing$"
  travel_danger_events.6010.closing:0 "Một nhóm lính cộc cằn, rách rưới đang tiến lên con đường — trông họ không sáng dạ hay công bằng lắm..."
  travel_danger_events.6010.a:0 "Hãy hòa vào đám nông dân..."
  travel_danger_events.6010.a.success:0 "Ngài đi qua mà không ai chú ý"
  travel_danger_events.6010.a.failure:0 "Họ nhận ra bộ đồ của Ngài"
  travel_danger_events.6010.capture_toast:0 "Người Du Hành Bị Bắt"
  travel_danger_events.6010.b:0 "Ta là [ROOT.Char.GetTitledFirstNameNoTooltip]! Họ sẽ để chúng ta đi qua."
  travel_danger_events.6010.b.friend:0 "Dẫn ta tới [siege_commander.GetTitledFirstNameNoTooltip], chúng ta là Bạn Tốt."
  travel_danger_events.6010.b.flavor:0 "#EMP Ngươi có#! chút #EMP khái niệm nào về việc ta là ai không?!#!"
  travel_danger_events.6010.b.success:0 "Vị thế của Ngài khiến họ bối rối"
  travel_danger_events.6010.b.failure:0 "Họ không nao núng"
  travel_danger_events.6010.c:0 "Một màn phô trương sức mạnh sẽ làm họ sợ."
  travel_danger_events.6010.c.success:0 "Ngài được để yên"
  travel_danger_events.6010.c.failure:0 "Họ thách thức Ngài"
  travel_danger_events.6010.c.wound:0 "Một thành viên đoàn tùy tùng bị thương"
  travel_danger_events.6010.d:0 "Họ chỉ cần được mua chuộc."

  travel_danger_events.6011.t:0 "$travel_danger_prefix$ Trận Chiến Phía Trước"
  travel_danger_events.6011.intro:0 "Không cần đến cảnh báo của dân làng sợ hãi, rõ ràng một trận chiến đang diễn ra phía trước; tàn dư chiến tranh, nạn nhân và trại tạm bợ có thể thấy khắp nơi.\n\n"
  travel_danger_events.6011.battle_both:0 "Quân đội mang màu cờ của kẻ thù Ta, [battle_owner_1.GetTitledFirstName] và [battle_owner_2.GetTitledFirstName], $travel_danger_events.6011.clash$"
  travel_danger_events.6011.war_battle_1:0 "Quân đội mang màu cờ của kẻ thù Ta, [battle_owner_1.GetTitledFirstName], và [battle_owner_2.GetTitledFirstName] $travel_danger_events.6011.clash$"
  travel_danger_events.6011.war_battle_2:0 "Quân đội mang màu cờ của kẻ thù Ta, [battle_owner_2.GetTitledFirstName], và [battle_owner_1.GetTitledFirstName] $travel_danger_events.6011.clash$"
  travel_danger_events.6011.ally_battle_1:0 "Quân đội mang màu cờ của đồng minh Ta, [battle_owner_1.GetTitledFirstName], và [battle_owner_2.GetTitledFirstName] $travel_danger_events.6011.clash$"
  travel_danger_events.6011.ally_battle_2:0 "Quân đội mang màu cờ của đồng minh Ta, [battle_owner_2.GetTitledFirstName], và [battle_owner_1.GetTitledFirstName] $travel_danger_events.6011.clash$"
  travel_danger_events.6011.relation_battle_1:0 "Quân đội mang màu cờ của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('battle_owner_1'))] Ta, [battle_owner_1.GetTitledFirstName], và [battle_owner_2.GetTitledFirstName] $travel_danger_events.6011.clash$"
  travel_danger_events.6011.relation_battle_2:0 "Quân đội mang màu cờ của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('battle_owner_2'))] Ta, [battle_owner_1.GetTitledFirstName], và [battle_owner_2.GetTitledFirstName] $travel_danger_events.6011.clash$"
  travel_danger_events.6011.peace:0 "Quân đội mang màu [battle_owner_1.GetPrimaryTitle.GetAdjectiveNoTooltip] và [battle_owner_2.GetPrimaryTitle.GetAdjectiveNoTooltip] $travel_danger_events.6011.clash$"
  travel_danger_events.6011.clash:0 "giao chiến tại [ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')] xa xôi,"
  travel_danger_events.6011.war:0 "giải quyết [battle_war.Custom('WarCasusBelliShort')] của họ."
  travel_danger_events.6011.raid_both:0 "đánh nhau vì chiến lợi phẩm còn sót lại."
  travel_danger_events.6011.raid:0 "một phe cướp bóc, một phe tích trữ."
  travel_danger_events.6011.hostile:0 "giải quyết một tranh chấp nhỏ."
  travel_danger_events.6011.end:0 "\n\nMột nhóm lẻ loi — có thể là đào ngũ hoặc lính đánh thuê — đang lặng lẽ rút đi, và hướng thẳng về phía chúng Ta."
  travel_danger_events.6011.b:0 "Họ sẽ không gây trở ngại cho một [ROOT.Char.GetTitleAsNameNoTooltip]!"
  travel_danger_events.6011.d:0 "Tiền là ngôn ngữ duy nhất của họ."
 
  travel_danger_events.6012.t:0 "$travel_danger_prefix$ Đoàn Quân Đi Qua"
  travel_danger_events.6012.intro:0 "Đường sá tấp nập với các xe và lực lượng tiếp viện của một đạo quân đi qua. Ở xa, những lá cờ [army_owner.GetPrimaryTitle.GetAdjectiveNoTooltip] sặc sỡ lấp lánh dưới nắng, tiến chậm qua [ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')].\n\n"
  travel_danger_events.6012.war:0 "Cảnh tượng đội quân kẻ thù của Ta, [army_owner.GetTitledFirstNamePossessive], làm Ta rùng mình,"
  travel_danger_events.6012.ally:0 "Cảnh tượng đội quân đồng minh của Ta, [army_owner.GetTitledFirstNamePossessive], thật đáng mừng,"
  travel_danger_events.6012.relation:0 "Cảnh tượng đội quân của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('army_owner'))] Ta, [army_owner.GetTitledFirstNamePossessive], khiến Ta phải dừng lại,"
  travel_danger_events.6012.peace:0 "Cảnh tượng đoàn quân này khiến đoàn thận trọng,"
  travel_danger_events.6012.clash:0 "giao chiến tại [ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')] xa xôi,"
  travel_danger_events.6012.raid:0 "trên đường cướp phá một làng xui xẻo."
  travel_danger_events.6012.other:0 "trên đường hướng tới một mục tiêu xa xôi."
  travel_danger_events.6012.end:0 "\n\nMột nhóm lính rách rưới đi ngược chiều. Họ trông giống kẻ đào ngũ."

  travel_danger_events.6013.t:0 "$travel_danger_prefix$ Vùng Đất Tranh Chấp"
  travel_danger_events.6013.intro:0 "Những vết tích chiến tranh có thể thấy khắp nơi khi chúng Ta đi qua [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], nơi những lá cờ đã được thay nhanh bằng màu cờ [occupy_owner.GetPrimaryTitle.GetAdjectiveNoTooltip].\n\n"
  travel_danger_events.6013.war_owner:0 "Kẻ thù Ta, [occupy_owner.GetTitledFirstName], rõ ràng đã giành được lợi thế trước [occupy_victim.GetTitledFirstName],"
  travel_danger_events.6013.war_victim:0 "Kẻ thù Ta, [occupy_victim.GetTitledFirstName], rõ ràng đã gặp thất bại trước [occupy_owner.GetTitledFirstName],"
  travel_danger_events.6013.ally_owner:0 "Đồng minh Ta, [occupy_owner.GetTitledFirstName], rõ ràng đã giành được lợi thế trước [occupy_victim.GetTitledFirstName],"
  travel_danger_events.6013.ally_victim:0 "Đồng minh Ta, [occupy_victim.GetTitledFirstName], rõ ràng đã gặp thất bại trước [occupy_owner.GetTitledFirstName],"
  travel_danger_events.6013.relation_owner:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('occupy_owner'))] Ta, [occupy_owner.GetTitledFirstName], rõ ràng đã giành được lợi thế trước [occupy_victim.GetTitledFirstName],"
  travel_danger_events.6013.relation_victim:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('occupy_victim'))] Ta, [occupy_victim.GetTitledFirstName], rõ ràng đã gặp thất bại trước [occupy_owner.GetTitledFirstName],"
  travel_danger_events.6013.peace:0 "Chúng Ta may mắn không chứng kiến trực tiếp trận xung đột,"
  travel_danger_events.6013.war:0 "dù [occupy_war.Custom('WarCasusBelliShort')] vẫn đang diễn ra ở nơi khác."
  travel_danger_events.6013.hostile:0 "dù, ai biết kết cục ra sao."
  travel_danger_events.6013.end:0 "\n\nKhi chúng Ta tiếp tục tới [destination.GetNameNoTooltip], một nhóm cựu binh đáng gờm tiến tới từ hướng ngược lại."
 
  regional_artillery_bombard:0 "súng bắn"
  regional_artillery_bombard_plural:0 "súng bắn"
  regional_artillery_trebuchet:0 "cẩu đá"
  regional_artillery_trebuchet_plural:0 "cẩu đá"
