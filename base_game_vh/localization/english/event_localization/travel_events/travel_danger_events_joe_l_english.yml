  regional_artillery_mangonel_plural:0 "mangonels"
  regional_artillery_onager:0 "onager"
  regional_artillery_onager_plural:0 "onagers"

  regional_ship_knarr:0 "knarr"
  regional_ship_knarr_plural:0 "knarrs"
  regional_ship_longship:0 "thuyền dài"
  regional_ship_longship_plural:0 "thuyền dài"
  regional_ship_galley:0 "thuyền galley"
  regional_ship_galley_plural:0 "thuyền galley"
