l_english:
 
  travel_events.1200.t:0 "Người Dân Thân Thiện"
  travel_events.1200.desc:1 "Khi chúng Ta dừng trại bên ngoài một ngôi làng nhỏ ở [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], dân làng tới xem đoàn lữ hành của chúng Ta.\n\nBan đầu Ta nghĩ họ muốn trao đổi với chúng Ta, nhưng sớm nhận ra họ tới để tặng quà và tìm hiểu mọi thứ về văn hóa của chúng Ta!\n\nMột người dân địa phương đặc biệt, [local_peasant.GetNameNoTooltip], có vô số câu hỏi về nơi chúng Ta đến."
  travel_events.1200.a:0 "Ta nên nói chuyện với họ và học hỏi thêm."
  travel_events.1200.b:0 "Chúng Ta sẽ tận dụng mọi lợi ích có thể."

  tradition_travel_discount_desc:0 "Ngài đã trải nghiệm Truyền thống Văn hóa này trong khi đi du lịch."

  travel_events.1200.a.tt:1 "Giảm chi phí thiết lập truyền thống [GetCultureTradition('tradition_xenophilic').GetName] đi [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"

  travel_events.1201.t:0 "Tinh Thần Hiệp Sĩ"
  travel_events.1201.desc:0 "Trong lúc du hành qua vùng [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], chúng ta tình cờ chạm trán vài vị [GetPlayer.Custom('KnightCulturePlural')] thuộc nền văn hóa [ROOT.Char.GetCurrentLocation.GetCulture.GetName]. Họ vô cùng tôn kính và rõ ràng là những người cực kỳ say mê thi ca, khi họ khăng khăng muốn ngâm thơ vào mọi cơ hội có được.\n\nQuy tắc ứng xử mà họ tuân theo có nhiều điểm ưu tú và ta không thể không ngưỡng mộ điều đó. Một trong số các vị [GetPlayer.Custom('KnightCulturePlural')], [local_knight.GetNameNoTooltip], để lại ấn tượng đặc biệt sâu sắc. "
  travel_events.1201.a:0 "Ta muốn mang truyền thống này về nhà."
  travel_events.1201.b:0 "Ta nên cố gắng trở nên hiệp sĩ hơn."

  travel_events.1201.a.tt:1 "Giảm chi phí thiết lập truyền thống [GetCultureTradition('tradition_chivalry').GetName] đi [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"

  travel_events.1202.t:0 "Những Người Lao Động Chăm Chỉ"
  travel_events.1202.desc:2 "Khi đi qua [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], Ta không khỏi nhận thấy mọi người đều làm việc với sự chăm chỉ âm thầm mà Ta hiếm khi thấy ở quê nhà.\n\nTa dừng lại hỏi một người lao động và [random_peasant.GetSheHe] chia sẻ vài lời khôn ngoan:\n\n“Ngài thấy đấy, mẹo là cứ dồn hết sức lực vào, và đừng dừng lại cho tới khi công việc tốt.”"
  travel_events.1202.a:0 "Ta nên nói chuyện với họ và học hỏi thêm."
  travel_events.1202.b:0 "Có lẽ Ta có thể áp dụng một số nguyên tắc này ở nhà."

  travel_events.1202.a.tt:1 "Giảm chi phí thiết lập truyền thống [GetCultureTradition('tradition_hard_working').GetName] đi [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"

  travel_events.1203.t:0 "Mối Quan Hệ Bền Chặt"
  travel_events.1203.desc:0 "Khi đi qua các làng của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], Ta dành thời gian trò chuyện với dân làng. Một điều nổi bật là lòng trung thành mãnh liệt của họ đối với lãnh chúa.\n\nMột người dân nói với niềm đam mê đến mức Ta tưởng họ đang mô tả người yêu thay vì lãnh chúa."
  travel_events.1203.a:0 "Ta nên nói chuyện với họ và học hỏi thêm."
  travel_events.1203.b:0 "Ta sẽ khiến thần dân của mình cũng trung thành như vậy."

  travel_events.1203.a.tt:1 "Giảm chi phí thiết lập truyền thống [GetCultureTradition('tradition_loyal_soldiers').GetName] dành cho Quân Trung Thành đi [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"

  travel_events.1204.t:0 "Tranh Luận Dân Sự"
  travel_events.1204.desc:0 "Khi đi qua [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], Ta chứng kiến vài người tranh cãi về chủ sở hữu của một con gia súc. Dù chủ đề khá nghiêm trọng, cả hai bên vẫn bình tĩnh và không dùng bạo lực.\n\nHãy tưởng tượng chúng ta có thể làm được gì nếu duy trì mức độ bình tĩnh và lý trí này ở nhà."
  travel_events.1204.a:0 "Ta nên nói chuyện với họ và học hỏi thêm."
  travel_events.1204.b:0 "Ta sẽ thử áp dụng chủ nghĩa hòa bình này."

  travel_events.1204.a.tt:1 "Giảm chi phí thiết lập truyền thống [GetCultureTradition('tradition_pacifism').GetName] đi [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"

  travel_events.1205.t:0 "Cuộc Sống Đơn Giản"
  travel_events.1205.desc:0 "Khi đi qua [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], Ta nhận thấy trang phục, nhà cửa và ngay cả nét mặt của người [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] rất đơn giản.\n\nKhi hỏi về sự nghèo khó ở đây, Ta được biết tất cả là lựa chọn của họ, tập trung vào thực tế hơn là hình thức."
  travel_events.1205.a:0 "Chúng Ta có thể học hỏi điều này ở nhà."
  travel_events.1205.b:0 "Ta nên thử sống đơn giản."
  travel_events.1205.a.tt:1 "Giảm chi phí thiết lập truyền thống [GetCultureTradition('tradition_spartan').GetName] đi [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"

  travel_events.1206.t:0 "Niềm Vui Săn Bắn"
  travel_events.1206.desc:0 "Khi đi qua [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], Ta gặp một nhóm thợ săn. Họ cho phép Ta theo săn trong một thời gian, chỉ ra kỹ thuật và dấu vết riêng của vùng này."
  travel_events.1206.a:0 "Tại sao dân Ta không thể như thế này?"
  travel_events.1206.b:0 "Có lẽ họ có thể huấn luyện Ta?"
  travel_events.1206.c:0 "Ta là thợ săn!"
  travel_events.1206.a.tt:1 "Giảm chi phí thiết lập truyền thống [GetCultureTradition('tradition_hunters').GetName] đi [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"

  travel_events.1207.t:0 "Thức Ăn Của Đất"
  travel_events.1207.desc:0 "Khi đi qua [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], một trưởng lão làng mời chúng Ta dùng bữa. Khi ăn, Ta nhận ra không một miếng nào làm từ thịt. Trưởng lão vui vẻ giải thích cách làm, nguyên liệu và lý do họ ít khi ăn thịt."
  travel_events.1207.a:0 "Ta muốn học vài công thức!"
  travel_events.1207.b:0 "Có thể ăn thêm suất nữa không?"
  travel_events.1207.a.tt:1 "Giảm chi phí thiết lập truyền thống [GetCultureTradition('tradition_vegetarianism').GetName] đi [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"

  travel_events.1208.t:0 "Đi Biển"
  travel_events.1208.desc:0 "Khi đi qua [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], chúng Ta cập cảng để trò chuyện với một chiếc thuyền đầy dân địa phương. Dự kiến là dừng nhanh nhưng thành một buổi thảo luận lâu về nút thắt, dòng nước địa phương và cách đi biển chung.\n\n“Ngài thấy đó, hải âu là vua của các loài chim, và giết nó là tội lớn nhất.”"
  travel_events.1208.a:0 "Chúng Ta nên trò chuyện và học hỏi thêm."
  travel_events.1208.b:0 "Nghe đủ rồi, giờ áp dụng kiến thức thôi."
  travel_events.1208.a.tt:1 "Giảm chi phí thiết lập truyền thống [GetCultureTradition('tradition_seafaring').GetName] đi [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"

  travel_events.1209.t:0 "Câu Chuyện Nằm Trong Kể Chuyện"
  travel_events.1209.desc:0 "Các người kể chuyện [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] ở [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] nổi tiếng và khi gặp họ, họ không làm Ta thất vọng!\n\nChúng Ta ngồi quanh lửa nhiều giờ nghe kể chuyện, thật vui khi nghe họ nói."
  travel_events.1209.a:0 "Ta nên khuyến khích kể chuyện nhiều hơn ở nhà."
  travel_events.1209.b:0 "Nếu thích chuyện, Ngài sẽ yêu thích câu chuyện này."
  travel_events.1209.a.tt:1 "Giảm chi phí thiết lập truyền thống [GetCultureTradition('tradition_storytellers').GetName] đi [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"

  travel_events.1210.t:0 "Âm Nhạc [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip|U]"
  travel_events.1210.desc:0 "Khi đi qua [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], Ta nghe một giai điệu nhẹ nhàng tràn khắp cảnh vật.\n\nRẽ khỏi đường một chút, Ta đến một nhóm nhạc sĩ chơi hết lòng với âm nhạc địa phương [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip]. Dừng lại nghe, lòng Ta tràn đầy vui sướng."
  travel_events.1210.a:0 "Chúng ta nên mang truyền thống này về nhà."
  travel_events.1210.b:0 "Ta muốn học chơi nhạc!"
  travel_events.1210.a.tt:1 "Giảm chi phí thiết lập truyền thống [GetCultureTradition('tradition_music_theory').GetName] đi [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"

  travel_events.1211.t:0 "Người Thơ"
  travel_events.1211.desc:0 "“[ROOT.Char.Custom('FormOfAddressForLiege')|U], [ROOT.Char.Custom('FormOfAddressForLiege')], xin dành một chút thời gian nghe bài thơ mới của Ta!”\n\nĐây không phải người [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] đầu tiên muốn giới thiệu thơ ca và chắc chắn cũng không phải cuối cùng. Có lẽ mọi người đều đam mê thơ, mỗi kẻ mơ mộng đều mang một bài thơ trong lòng."
  travel_events.1211.a:0 "Chúng ta nên trò chuyện với họ và học hỏi thêm."
  travel_events.1211.b:0 "Ta muốn thử sức."
  travel_events.1211.c:0 "Ngài gọi đó là thơ sao?"
  travel_events.1211.a.tt:1 "Giảm chi phí thiết lập truyền thống [GetCultureTradition('tradition_poetry').GetName] đi [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"

  travel_events.1212.t:0 "Bạn Thân Của Thợ Câu"
  travel_events.1212.desc:0 "Không một ngày nào ở [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] mà Ta không gặp một ngư dân có thông tin mới, từ mồi, chỗ câu đến cách chế biến cá.\n\nTa còn được thử câu, các ngư dân chỉ cho mẹo và khi Ta bắt được cá, họ vỗ tay khen."
  travel_events.1212.a:0 "Chúng ta nên nói chuyện và học hỏi thêm."
  travel_events.1212.b:1 "Nếu áp dụng kỹ thuật câu này cho đi biển thì sao!"
  travel_events.1212.a.tt:1 "Giảm chi phí thiết lập truyền thống [GetCultureTradition('tradition_fishermen').GetName] đi [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"

  travel_events.1213.t:0 "Lữ Khách Huyền Bí"
  travel_events.1213.desc:0 "Các nhà huyền bí ở [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] có mặt khắp nơi: giảng đạo và chia sẻ kiến thức.\n\nMột ngày, Ta trò chuyện sâu về ý nghĩa cuộc sống với một trong số họ khi chờ tảng đá được dời khỏi đường."
  travel_events.1213.a:0 "Ta quan tâm hơn về người dân của Ngài."
  travel_events.1213.b:0 "Ngài có thể chia sẻ trí tuệ gì với Ta?"
  travel_events.1213.a.tt:1 "Giảm chi phí thiết lập truyền thống [GetCultureTradition('tradition_mendicant_mystics').GetName] đi [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"

  travel_events.1214.t:0 "Chiến Binh Được Tôn Trọng"
  travel_events.1214.desc:0 "Khi đi du lịch, Ta nhận ra người [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] ở [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] đánh giá chiến binh trên hết.\n\nTranh chấp được giải quyết bằng bạo lực, những ai dám liều mạng cho vương quốc được coi là dũng cảm nhất. Ta dành cả buổi chiều thảo luận với họ về văn hóa chiến tranh tinh tế của họ."
  travel_events.1214.a:0 "Chúng ta nên trò chuyện và học hỏi thêm."
  travel_events.1214.b:0 "Ngài có thể chỉ cho Ta vài chiêu không?"
  travel_events.1214.a.tt:1 "Giảm chi phí thiết lập truyền thống [GetCultureTradition('tradition_warrior_culture').GetName] đi [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"

  travel_events.1215.t:0 "[GetPlayer.Custom('KnightCultureNoTooltip')] Đáng Kính"
  travel_events.1215.desc:0 "Chúng Ta dừng lại nghỉ đêm ở một quán rượu, và khi Ta ngồi yên một góc tận hưởng âm nhạc [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip], cửa bất ngờ mở và một bóng người to xuất hiện.\n\nMột [GetPlayer.Custom('KnightCultureNoTooltipLowercase')] bước vào tự tin và bầu không khí thay đổi ngay lập tức. Người dân cúi đầu kính cẩn, một số ngất ngây và chủ quán lập tức rót miễn phí những ly rượu của [GetPlayer.Custom('KnightCultureNoTooltipLowercase')] nổi tiếng.\n\nLiệu trở thành một [GetPlayer.Custom('KnightCultureNoTooltipLowercase')] có thực sự đặc biệt đến vậy sao?"
  travel_events.1215.a:0 "Ta nên tìm hiểu lý do tại sao họ được coi trọng như vậy."
  travel_events.1215.b:0 "Ta cũng có thể như vậy nếu chịu rèn luyện!"
  travel_events.1215.a.tt:1 "Giảm chi phí thiết lập truyền thống [GetCultureTradition('tradition_martial_admiration').GetName] đi [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"

  travel_events.1216.t:0 "Những Nhà Tư Tưởng Du Hành"
  travel_events.1216.desc:0 "Một điều Ta nhận thấy khi đi qua [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] là cứ mỗi người [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] đi du lịch đều tự nhận là triết gia.\n\nBan đầu Ta nghi ngờ điều này, nhưng sau khi bị đánh bại trong cuộc đối thoại thứ ba liên tiếp, Ta bắt đầu nghĩ có lẽ có lý trong lời họ nói.\n\nNhà triết gia mới nhất, [local_philosopher.GetNameNoTooltip], gần như cười nhạo những nỗ lực lập luận logic của Ta."
  travel_events.1216.a:0 "Ta nên tìm hiểu thêm về cách văn hóa của họ vận hành."
  travel_events.1216.b:0 "Còn bản thân Ta có thể học được gì?"
  travel_events.1216.a.tt:1 "Giảm chi phí thiết lập truyền thống [GetCultureTradition('tradition_philosopher_culture').GetName] đi [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [prestige|E]"

  healthy_vegetarian_meal_modifier:0 "Bữa Ăn Chay Lành Mạnh"
  healthy_vegetarian_meal_modifier_desc:0 "Nhân vật này đã ăn một bữa chay lành mạnh trong khi du lịch"

  living_simply_modifier:0 "Sống Đơn Giản"
  living_simply_modifier_desc:0 "Nhân vật này đang sống đơn giản."

  villager_gifts_modifier:0 "Quà Tặng Từ Dân Làng"
  villager_gifts_modifier_desc:0 "Nhân vật này nhận được nhiều món quà từ dân làng."

  loyal_attitudes_modifier:0 "Thái Độ Trung Thành"
  loyal_attitudes_modifier_desc:0 "Nhân vật này truyền cảm hứng về lòng trung thành cho bản thân và người khác."

  pacifist_mindset_modifier:0 "Tư Duy Hòa Bình"
  pacifist_mindset_modifier_desc:0 "Nhân vật này đang cố gắng áp dụng tư duy hòa bình hơn."

  told_good_story_modifier:0 "Kể Chuyện Hay"
  told_good_story_modifier_desc:0 "Nhân vật này gần đây đã kể một câu chuyện hay."

  musically_inspired_modifier:0 "Được Truyền Cảm Hứng Âm Nhạc"
  musically_inspired_modifier_desc:0 "Nhân vật này được truyền cảm hứng bởi âm nhạc và thường luyện tập cho các tù nhân của mình."

  fishing_logistics_modifier:1 "Kỹ Năng Câu Cá"
  fishing_logistics_modifier_desc:1 "Nhân vật này đang áp dụng kiến thức câu cá vào hậu cần hải quân."

  mystic_wisdom_modifier:0 "Trí Tuệ Huyền Bí"
  mystic_wisdom_modifier_desc:0 "Nhân vật này gần đây nhận được trí tuệ từ một nhà huyền bí."

  trained_in_warrior_culture_modifier:0 "Được Huấn Luyện Văn Hóa Chiến Binh"
  trained_in_warrior_culture_modifier_desc:0 "Nhân vật này gần đây đã được huấn luyện về văn hóa chiến binh."

  training_hard_modifier:0 "Rèn Luyện Khắc Nghiệt"
  training_hard_modifier_desc:0 "Nhân vật này hiện đang rèn luyện chăm chỉ."

  philosophical_musings_modifier:0 "Suy Ngẫm Triết Lý"
  philosophical_musings_modifier_desc:0 "Nhân vật này gần đây đã có nhiều suy ngẫm triết lý."

  personal_chivalry_modifier:0 "Hiệp Sĩ Cá Nhân"
  personal_chivalry_modifier_desc:0 "Nhân vật này gần đây tập trung vào hiệp sĩ cá nhân của bản thân."

