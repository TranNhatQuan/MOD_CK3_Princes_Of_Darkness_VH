l_english:
 
  travel_danger_events.2000.t:1 "$travel_danger_prefix$ Đôi Mắt Rừng Rậm"
  travel_danger_events.2000.desc:0 "Có gì đó đã quan sát Ta kể từ khi chúng Ta đặt chân vào những khu rừng rậm của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]. Ta nhìn thấy ánh mắt lóe lên, nghe tiếng lá xào xạc.\n\nNó đang theo dõi Ta, rình rập Ta, #EMP săn Ta#!.\n\nNhững người Ta cử đi tìm nó không trở lại. Sinh vật gì đang núp trong những chiều sâu màu ngọc lục bảo của rừng rậm?"
  travel_danger_events.2000.a:0 "Chặt và đốt, #EMP tìm ra nó#!."
  travel_danger_events.2000.b:0 "Ta ghét điều này. Hãy đưa Ta ra khỏi đây."
  travel_danger_events.2000.c:0 "Điều duy nhất phải sợ trong rừng này là chính Ta!"

  travel_danger_events.2001.t:1 "$travel_danger_prefix$ Cơn Lũ"
  travel_danger_events.2001.desc:0 "Cơn mưa vẫn chưa hề dứt trong suốt thời gian chúng ta du hành qua [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]. Ta đã lo lắng dõi mắt theo dòng sông khi làn nước đục ngầu của nó ngày một dâng cao hơn, giống như một cái mụn nhọt đầy mủ mưng lên. \n\n[ROOT.Char.Custom2('RelationToMe', flood_victim)] của ta, [flood_victim.GetFirstNameNoTooltip], lại đang phàn nàn một lần nữa: "Chúng ta đã phải lội qua cái hố phân thối tha, sũng nước, sụt lún chết tiệt này suốt nhiều ngày qua rồi. Khi nào thì..."\n\nTrước khi [flood_victim.GetSheHe] kịp dứt câu nói của [flood_victim.GetHerHis], bờ đê cuối cùng đã vỡ tung. Một dòng nước lũ đục ngầu, dày đặc lao thẳng về phía nhu yếu phẩm của chúng ta, và [flood_victim.GetFirstNameNoTooltip]!"
  travel_danger_events.2001.a:0 "Cứu lương thực!"
  travel_danger_events.2001.b:0 "Cứu [flood_victim.GetFirstNameNoTooltip]!!"

  burned_my_jungle_opinion:0 "Đốt Rừng Của Ta"

  travel_lost_supplies:0 "Mất Lương Thực"
  travel_lost_supplies_desc:0 "Nhân vật này đang chịu tác động từ việc mất lương thực trong chuyến đi."

