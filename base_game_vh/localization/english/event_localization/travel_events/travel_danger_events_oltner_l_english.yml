l_english:
  travel_danger_events.9000.t:1 "$travel_danger_prefix$ Tai Họa Vo Ve"
  travel_danger_events.9000.desc:0 "Vùng [location.Custom('GetTerrainTypePlural')] của [location.GetName] đang #EMP lúc nhúc#! những loài côn trùng hút máu nhỏ bé, đen tối. Dù chúng ta có làm gì, hay đi đến đâu, chúng vẫn chực chờ ở đó — bòn rút máu của chúng ta giống như một đám mây hành hình do chính [ROOT.Char.GetFaith.DevilName] [ROOT.Char.GetFaith.DevilHerselfHimself] phái đến!\n\nKhông chỉ những thớt ngựa trở nên hoảng loạn và khó tính, mà đoàn tùy tùng của ta cũng vậy... đặc biệt là [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('mosquito_victim'))] của ta, [mosquito_victim.GetFirstName], kẻ đang điên cuồng vung vẩy đôi cánh tay nhuốm đầy máu của [mosquito_victim.GetHerHis]."
  travel_danger_events.9000.deviant:0 "#EMP Tuyệt vời!#! Mọi người, cởi đồ ra!"
  travel_danger_events.9000.herbalist:0 "Ta nghĩ loại thảo dược này có thể giúp chúng ta..."
  travel_danger_events.9000.a:0 "Cứ tiến lên, chúng chỉ là #EMP côn trùng!#!"
  travel_danger_events.9000.b:0 "[mosquito_victim.GetFirstNameNoTooltip]! Cởi đồ ra, đi trước đoàn."
  drained_by_mosquitoes_modifier:0 "Kiệt sức vì muỗi"
  drained_by_mosquitoes_modifier_desc:0 "Nhân vật này đã bị tấn công bởi một đàn côn trùng hút máu, làm hao hụt một lượng đáng kể sinh lực."
 
  travel_danger_events.9010.t:1 "$travel_danger_prefix$ Trục Bị Kẹt"
  travel_danger_events.9010.desc:0 ""[location.Custom('GetRandomRegionalDanger')|U]!" Ta nghe [irritated_character.GetFirstName] hét lên trong hoảng loạn. Ngay sau đó là tiếng gãy vang — như gỗ bị bẻ, hoặc như sự kiên nhẫn của Ta cuối cùng cũng vỡ vụn.\n\nTa bước ra [location.Custom('GetProvinceGroundDesc')] và nhìn thấy mảnh vụn của bánh xe xe ngựa... #EMP bánh xe của Ta#!\n\n"Xin lỗi, [irritated_character.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))] của Ta. Lúc Ta canh gác, Ta đã ngủ quên..."
  travel_danger_events.9010.strong:0 "#EMP *Thở dài trong khi nhấc xe ngựa lên khỏi mặt đất*#!"
  travel_danger_events.9010.a:0 "[root_scope.Custom('CulturalCurse')|U]... chúng ta sẽ trễ mất."
  travel_danger_events.9010.b:0 "Xáo trộn hàng hóa, từ giờ Ta sẽ đi thô bạo hơn..."
 
  travel_danger_events.9020.t:1 "$travel_danger_prefix$ Suy Nhược Bất Ngờ"
  travel_danger_events.9020.desc.first:0 ""Chúng ta... chúng ta đã #EMP hoàn toàn#! hết [ROOT.Char.Custom('GetExpensiveDessert')]!" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('emaciated_character'))] [emaciated_character.GetFirstName] lí nhí lo lắng. "Và [ROOT.Char.Custom('GetExpensiveMeal')], và [ROOT.Char.Custom('GetExpensiveMealAlt')], và [ROOT.Char.Custom('GetLocalStreetFoodPlural')], và thậm chí #EMP [ROOT.Char.Custom('get_region_root_vegetable_plural')]!#!"\n\n"
  travel_danger_events.9020.desc.war:0 ""Những lính cướp đã lấy hết mọi thứ chúng ta có trong đêm! Chúng ta không còn lại #EMP một mẩu bánh nào!#!" [emaciated_character.GetSheHe|U] khóc. "Chúng ta sắp chết đói!""
  travel_danger_events.9020.desc.other:0 ""Chúng ta nên chuẩn bị nhiều thức ăn hơn — không còn #EMP một mẩu nào#! và chẳng có gì để ăn cả!" [emaciated_character.GetSheHe|U] khóc. "Chúng ta sắp chết đói!""
  travel_danger_events.9020.desc.last:0 "\n\nCó lẽ Ta không nên ăn ba phần [ROOT.Char.Custom('GetExpensiveMeal')] với sốt [ROOT.Char.Custom('GetFoodDetail')] hôm qua?"
  travel_danger_events.9020.desc.last.alt:0 "\n\nNhưng.. Ta đã ăn như một con chuột, sao lại bất công thế này?"
  travel_danger_events.9020.a:0 "Ước gì chúng ta có thể ăn cả những lời nói..."
  travel_danger_events.9020.b:0 "Những gì ít ỏi còn lại sẽ dành cho #EMP Ta!#!"
  travel_danger_events.9020.hunter:0 "Chắc chắn sẽ có con mồi đâu đó!"
  travel_danger_events.9020.cannibal:0 "Ôi [emaciated_character.GetFirstNameNoTooltip], Ngài có sẵn sàng hy sinh mạng sống cho [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] không?"
  emaciated_modifier:0 "Suy Nhược"
  emaciated_modifier_desc:0 "Nhân vật này đã đi một quãng đường dài mà không có thức ăn."
  cannibalicus_maximus:0 "Ngài và tất cả các thành viên trong đoàn sẽ nhận được [secret|E] Cannibal, nếu chưa phải là người ăn thịt người"
 
  travel_danger_events.9030.t: "$travel_danger_prefix$ Sa lầy trong bùn"
  travel_danger_events.9030.desc: "Cơn mưa hôm nay tuy không xối xả nhưng lại dai dẳng khôn nguôi — con lộ phía trước đã hóa thành một vũng bùn lầy đặc quánh. Xe ngựa đang lún dần, và màn sương mù dày đặc khiến tầm nhìn trở nên mịt mờ.\n\nE là chúng ta chẳng thể nhúc nhích được đâu trong chốc lát."
  travel_danger_events.9030.caravan_master: "[GetCourtPositionType('travel_leader_court_position').GetNameNoTooltip()] của ta dư sức xử lý dăm ba chỗ bùn lầy này."
  travel_danger_events.9030.a: "Thật đáng nguyền rủa cái thời tiết này."
  EVENT_WINDOW_OPTION_AVAILABLE_CARAVAN_MASTER: "Lựa chọn này khả thi nhờ có [GetCourtPositionType('travel_leader_court_position').GetName()] của ngài"
 
  travel_danger_events.9040.t: "$travel_danger_prefix$ Cuồng phong hắc ám"
  travel_danger_events.9040.desc: "Ta chẳng thể nhìn thấy gì cả — mưa trút xuống quá dữ dội. Toàn quân đã ướt đẫm tận xương tủy, và mỗi hồi sấm sét lại khiến lũ ngựa hoảng loạn lồng lên.\n\nBỗng nhiên, ta nhận ra một điều kinh khủng...\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim'))] của ta, [victim.GetFirstName], đâu rồi?"
  travel_danger_events.9040.caravan_master: "[travel_leader.GetFirstNameNoTooltip], mau tìm cho ra [victim.GetHerHim]!"
  travel_danger_events.9040.a: "Nguyện [ROOT.Char.GetFaith.HighGodName] rủ lòng thương xót [victim.GetFirstNameNoTooltip]."
  low_aptitude_caravan_master_reason_tooltip: "[aptitude|E] của [travel_leader.GetFirstNamePossessive|U] với vai trò [GetCourtPositionType('travel_leader_court_position').GetName()] chỉ ở mức [travel_leader.GetCourtPositionAptitude( GetCourtPositionType( 'travel_leader_court_position' ) )]"
 
  travel_danger_events.9050.t: "$travel_danger_prefix$ Tâm trí lạc lối"
  travel_danger_events.9050.desc: "Cuộc hành trình cùng với [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim'))] của ta, [victim.GetFirstName], đã trở thành một thử thách — phần [GetTrait('withering_mind').GetName( GetNullCharacter )] của [victim.GetHerHis] ngày càng mai một theo từng ngày.\n\nTa liên tục phải nhắc nhở [victim.GetHerHim]: #EMP "Chúng ta đang hướng tới [ROOT.Char.GetTravelPlan.GetData.GetFinalDestination.GetProvince.GetName]! Để tham gia [ROOT.Char.GetTravelPlan.GetData.GetActivity.GetShortName], ngài nhớ chứ?"#! Nhưng lão chẳng bao giờ ghi nhớ nổi.\n\nVà giờ đây, lão già lẩn thẩn ấy đã đi lạc đâu mất, chẳng thể tìm thấy ở bất cứ nơi nào..."
  travel_danger_events.9050.caravan_master: "Quản Lý Đoàn Lữ Hành của ta, [travel_leader.GetFirstNameNoTooltip], chắc chắn có thể tìm thấy [victim.GetHerHim]."
  travel_danger_events.9050.a: "[victim.GetFirstNameNoTooltip] đã lạc mất rồi, chúng ta phải đi tiếp thôi."
  travel_danger_events.9050.b: "Dừng lại! Phải tìm cho bằng được [victim.GetFirstNameNoTooltip]."
  death_lost: "đi lạc và không bao giờ được nhìn thấy nữa"
  9050_lost: "[victim.GetFirstName] đã thất lạc vĩnh viễn"
  9050_found: "[victim.GetFirstName] dù hoảng loạn nhưng đã được tìm thấy"
 
  travel_danger_events.9060.t: "$travel_danger_prefix$ Hành khách yếu ớt"
  travel_danger_events.9060.desc: ""Ối giời ôi, đau quá! Xin hãy dừng xe ngựa lại — ta van xin ngươi!" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim'))] của ta, [victim.GetFirstName], kêu gào với phu xe. "Chứng [elder_trait.GetName(GetNullCharacter)] của ta không thể chịu đựng nổi những cú xóc, đất đá và sự rung lắc này nữa rồi!"\n\nNhững con đường gồ ghề của [location.GetName] đang bào mòn thân thể mảnh mai của [victim.GetHerHis].\n\nCó lẽ chúng ta nên giảm tốc độ lại, một chút thôi."
  travel_danger_events.9060.sadistic: "#EMP ...chúng ta cần phải đi nhanh hơn nữa.#!"
  travel_danger_events.9060.a: "Không dừng lại gì hết."
  travel_danger_events.9060.b: "Chúng ta phải để tâm đến sự thoải mái của [victim.GetFirstNamePossessiveNoTooltip]."
  traveling_slowly_modifier: "Hành trình chậm chạp khổ ải"
  traveling_slowly_modifier_desc: "Đoàn tùy tùng này đang di chuyển vô cùng chậm chạp, biến họ thành mục tiêu béo bở cho lũ lục lâm thảo khấu."
  9060_wounded: "[victim.GetFirstName] đã bị thương"
