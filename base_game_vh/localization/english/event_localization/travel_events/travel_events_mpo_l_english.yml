l_english:
  travel_events_mpo.0001.t: "$travel_event_prefix$ Bầy Chim Vàng"
  travel_events_mpo.0001.desc: "Không khí quanh chúng ta không còn yên tĩnh nữa. Ngước nhìn lên, ta nhận thấy vài con chim lớn đang lượn vòng phía trên, tiếng kêu của chúng vang vọng khắp thảo nguyên. [eagle_noticer.GetName] chỉ ra rằng đó là đại bàng vàng, một cảnh tượng hiếm thấy ở vùng này.\n\n[eagle_noticer.GetSheHe|U] say sưa nói về khả năng săn mồi của chúng, và rằng nhiều người nuôi chúng như một người Ngài đồng hành suốt đời. [eagle_noticer.GetSheHe|U] thậm chí còn gợi ý rằng chúng ta nên thử bắt một con, vì nó có thể rất hữu ích cho chúng ta trong tương lai."
  travel_events_mpo.0001.a: "Chỉ cần đôi tay nhanh nhẹn là đủ."
  travel_events_mpo.0001.a_tt: "Ngài dựng một cái bẫy và chờ đúng thời điểm để bắt một con đại bàng"
  travel_events_mpo.0001.b: "Chúng ta có thể dành ra một ít vật tư cho bẫy và mồi..."
  travel_events_mpo.0001.b_tt: "Ngài dựng một cái bẫy và dùng tài nguyên của mình để tăng hiệu quả của nó"
  travel_events_mpo.0001.c_noticer: "Sao ngươi không tự làm đi, [huntsmaster.GetFirstNameNoTooltip]?"
  travel_events_mpo.0001.c_huntsmaster: "Ta tin tưởng [huntsmaster.GetFirstNameNoTooltip] với nhiệm vụ này."
  travel_events_mpo.0001.c: "Một thợ săn có thể lo chuyện này."
  travel_events_mpo.0001.c_tt: "[huntsmaster.GetName] dựng một cái bẫy và [huntsmaster.GetSheHe] sẽ chờ thay cho Ngài"
  travel_events_mpo.0001.c_not: "Ngài không thuê [GetCourtPositionType('master_of_hunt_court_position').GetName()], hoặc họ không thuộc [entourage|E] của Ngài"
  travel_events_mpo.0001.d: "Ta sẽ bắt một con, giống như [eagle_childhood_teacher.GetName] đã dạy ta."
  travel_events_mpo.0001.e: "Cũng hay đấy, nhưng ta không cần một con chim."
  travel_events_mpo.0001_win: "Ngài đã bắt được một con đại bàng vàng"
  travel_events_mpo.0001_lose: "Những con đại bàng quá cảnh giác với nỗ lực của Ngài"

  travel_events_mpo.0010.t: "$travel_event_prefix$ Trên Lưng Lạc Đà Trắng"
  travel_events_mpo.0010.desc: "Ở phía chân trời, một đốm trắng nổi bật trên nền thảo nguyên. Khi ta tiến lại gần hơn, ta nhận ra hình dáng của một con lạc đà trắng, bộ lông của nó sáng lấp lánh dưới ánh mặt trời. Hàng chục con cừu đổ xuống từ phía sau, bám theo sát con lạc đà. Một [camel_rider.GetWomanMan] bất ngờ leo lên nó, và người cưỡi chào ta bằng một nụ cười ấm áp.\n\n\"Bình an ở cùng ngài.\" [camel_rider.GetSheHe] nói. \"Như ngài thấy đấy, Allah đã ban phước dồi dào cho Ta, nên Ta có thể ban tặng món quà này cho người khác. Ngài có muốn thứ gì không?\""
  travel_events_mpo.0010.a: "Ta có thể dùng một ít trong đàn cừu của ngươi."
  travel_events_mpo.0010.a_flavor: "Ngài mua cừu từ [camel_rider.GetName]"
  travel_events_mpo.0010.b: "Đức tin của ngươi đã là một món quà rồi."
  travel_events_mpo.0010.b_islamic: "Phước lành ở cùng ngươi, bằng hữu."
  travel_events_mpo.0010.b_flavor: "Allah có thể ban cho ta điều gì?"
  travel_events_mpo.0010.c: "Những gì ta cần, ta sẽ lấy bằng vũ lực."
  travel_events_mpo.0010.c_tt: "Bạn cố gắng đánh cắp hàng hóa của [camel_rider.GetNamePossessive]"
  travel_events_mpo.0010_win: "Ngài đánh bại [camel_rider.GetHerHim]"
  travel_events_mpo.0010_lose: "[camel_rider.GetSheHe|U] đánh bại Ngài"

  mpo_islam_conversion_modifier: "Tìm Hiểu Hồi Giáo"
  mpo_islam_conversion_modifier_desc: "Nhân vật này đã tiếp xúc với giáo lý của Hồi giáo và đang cân nhắc việc cải đạo.\n\nChi phí cải sang một [faith|E] [GetReligionByKey('islam_religion').GetAdjective]: #p -25%#!"
  faith_conversion_cost_mpo_islam_event: "[GetModifier('mpo_islam_conversion_modifier').GetNameWithTooltip]"
