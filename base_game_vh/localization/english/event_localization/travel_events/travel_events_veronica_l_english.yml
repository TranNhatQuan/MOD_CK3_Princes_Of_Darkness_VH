l_english:

#Grotesque Events
  travel_events.3000.t:0 "Những Sinh Vật Kỳ Dị"
  travel_events.3000.desc:1 "Ta hiếm khi thấy [traveller_monk.Custom2('MyCharacterIntroduction', ROOT.Char)] phấn khích như vậy trước đây. Đôi mắt của [traveller_monk.GetHerHis|U] dường như đang nuốt trọn một cuốn sách được trang trí cầu kỳ — đôi khi ta còn kịp liếc thấy những tấm bản đồ bên trong.\n\nMột buổi sáng, [traveller_monk.GetSheHe] cuối cùng cũng đến gặp ta để nói về những phát hiện của [traveller_monk.GetHerHis]:\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], có tin đồn rằng vùng đất [ROOT.Char.GetCurrentLocation.GetName] là quê hương của những con người phi thường! Người ta nói rằng [ROOT.Char.Custom('GetGrotesquePlural')] lang thang trong các thành phố này.\""
  travel_events.3000.a:0 "Ta phải thấy những sinh vật này. #EMP Ngay bây giờ!#!"
  travel_events.3000.a.tt:1 "Ngài sẽ tiếp tục tìm kiếm những sinh vật này"
  travel_events.3000.b:0 "Làm ơn, [traveller_monk.GetFirstNameNoTooltip], hãy kể thêm cho ta về chúng."
  travel_events.3000.c:0 "Thì sao chứ? Ở nhà chúng ta cũng có đủ lũ dị nhân rồi."
  travel_events.3000.d:0 "Ta phải thấy chúng và báo cáo lại những phát hiện của mình."
  travel_events.3000_interest_modifier:0 "Quan Tâm Đến Những Sinh Vật Kỳ Dị"
  grotesque_rush_modifier:0 "Cơn Sốt Sinh Vật Kỳ Dị"
  grotesque_scholar_modifier:0 "Nghiên Cứu Sinh Vật Kỳ Dị"
  satiated_curiosity:0 "Sự Tò Mò Đã Được Thỏa Mãn"
  get_grotesque_cynocephalus:0 "cynocephalus, một người đầu chó,"
  get_grotesque_blemee:0 "blemee, một người không đầu với khuôn mặt nằm trên ngực,"
  get_grotesque_sciapod:0 "sciapod, một sinh vật giống người lùn với một bàn chân lớn,"
  get_grotesque_cynocephaly:0 "cynocephaly, những người đầu chó,"
  get_grotesque_blemmyae:0 "blemmya, những người không đầu có khuôn mặt trên ngực,"
  get_grotesque_sciapodes:0 "sciapodes, những sinh vật giống người lùn với một bàn chân lớn,"
 
  travel_events.3001.t:0 "Một Nỗi Thất Vọng Kỳ Dị"
  travel_events.3001.desc_intro:0 "Mỗi khi chúng ta đến một khu định cư mới, ta lại dành chút thời gian quan sát xung quanh, cố tìm những sinh vật kỳ dị mà ta đã thấy trong bản đồ của [traveller_monk.GetTitledFirstNamePossessiveNoTooltip]. "
  travel_events.3001.desc_cynical:0 "Một cơ hội để chứng minh [traveller_monk.GetHerHim] sai."
  travel_events.3001.desc.fallback:0 "Sự tò mò đơn giản là quá lớn."
  travel_events.3001.desc.outro:2 "\n\nKhi chúng ta đến [grotesque_place.GetNameNoTooltip], [traveller_monk.GetSheHe] đến gặp ta, nắm chặt cuốn sách của [traveller_monk.GetHerHis].\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]... chúng ta đã theo mọi chỉ dẫn, nhưng những sinh vật đó không hề tồn tại ở đây. Ta bắt đầu nghĩ rằng có lẽ chúng chỉ là sản phẩm của trí tưởng tượng.\""
  travel_events.3001.a:0 "Ồ... được thôi..."
  travel_events.3001.b:0 "Ngươi #EMP đã hứa#! với ta rằng sẽ có quái vật."
  travel_events.3001.b_sadistic:0 "Ta sẽ dạy ngươi không được nói dối chủ nhân của mình."
  travel_events.3001.c:0 "Ha! Ta đã biết mà!"
  travel_events.3001.d:0 "Chúng #EMP phải#! ở đâu đó."
  travel_events.3001.e:0 "Người ở quê nhà làm sao biết rằng chúng #EMP không#! ở đây?"
  cryptid_obssessed:0 "Ám Ảnh Sinh Vật Kỳ Dị"
  travel_events.3001.e.success:0 "Ngài thuyết phục được mọi người về những gì Ngài đã thấy"
  travel_events.3001.e.failure:0 "Không ai tin những cuộc phiêu lưu kỳ dị của Ngài"
  cryptid_obssessed_rush:0 "Cơn Thúc Đẩy Ám Ảnh Sinh Vật Kỳ Dị"
 
 #Pet Travel Events
  travel_events.3010.t:0 "Trên Đường Về Nhà"
  travel_events.3010.intro:0 "Sau một ngày dài di chuyển, đường chân trời bắt đầu nhuốm những sắc màu ấm áp. Ta dừng lại một chút, nhắm mắt, hít thở.\n\n"
  travel_events.3010.desc:0 "\"Cẩn thận!\" [pet_rescuer.Custom2('MyCharacterIntroduction', ROOT.Char)] hét lên, chỉ về phía vùng [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] bên ngoài con đường chúng ta đang đi.\n\nMột con vật trông như loài gặm nhấm nhỏ đang chạy vào vùng hoang dã,"
  travel_events.3010.alone:0 "Đợi đã! [ROOT.Char.Custom( 'DogStoryName' )] đâu rồi? Ta chưa thấy [ROOT.Char.Custom( 'DogStoryHerHim' )] từ... Ta thốt lên khi thấy chuyển động trong vùng [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] bên ngoài con đường!\n\nMột con vật trông như loài gặm nhấm nhỏ đang chạy vào vùng hoang dã"
  travel_events.3010.exotic:0 "và thứ gì đó #EMP quen thuộc một cách nguy hiểm#! đuổi theo ngay sau."
  travel_events.3010.cat:0 "và đuổi theo nó là một bóng dáng [ROOT.Char.Custom('CatFurColor')] mà ta dễ dàng nhận ra."
  travel_events.3010.dog:0 "và đuổi theo nó là một bóng dáng [ROOT.Char.Custom('DogFurColor')] mà ta dễ dàng nhận ra."
  travel_events.3010.a_dog:0 "Không! [ROOT.Char.Custom( 'DogStoryName' )]! [pet_rescuer.GetTitledFirstNameNoTooltip], đuổi theo [ROOT.Char.Custom('DogStoryHerHim')]!"
  travel_events.3010.a_cat:0 "Không, [ROOT.Char.Custom( 'CatStoryName' )]! [pet_rescuer.GetTitledFirstNameNoTooltip], đuổi theo [ROOT.Char.Custom('CatStoryHerHim')]!"
  travel_events.3010.a_exotic:0 "[pet_rescuer.GetTitledFirstNameNoTooltip], bắt thú cưng của ta trước khi có ai bị thương!"
  travel_events.3010.a.success:0 "[pet_rescuer.GetTitledFirstNameNoTooltip] tìm thấy thú cưng của Ngài"
  travel_events.3010.a.failure:0 "[pet_rescuer.GetTitledFirstNameNoTooltip] bị lạc khi cố tìm thú cưng của Ngài"
  travel_events.3010.a.failure_toast:0 "[pet_rescuer.GetTitledFirstNameNoTooltip] bị lạc khi cố tìm thú cưng của Ngài"
  travel_events.3010.b.tt1:0 "Thú cưng của Ngài sẽ không bao giờ được nhìn thấy nữa"
  travel_events.3010.b.tt2:0 "Thú cưng của Ngài sẽ tự tìm đường quay về"
  travel_events.3010.b.tt3:0 "Ngài tìm thấy thú cưng của mình, và cả thứ khác nữa"
  travel_events.3010.b_dog:0 "[ROOT.Char.Custom( 'DogStoryName' )] thông minh hơn tất cả chúng ta, [ROOT.Char.Custom('DogStorySheHe')]'ll tìm được đường về."
  travel_events.3010.b_cat:0 "[ROOT.Char.Custom( 'CatStoryName' )] thông minh hơn tất cả chúng ta, [ROOT.Char.Custom('CatStorySheHe')]'ll tìm được đường về."
  travel_events.3010.b_exotic:0 "#EMP Hừ!#! Nếu có gì đáng lo thì chính là người dân vùng này."
  ill_find_you:0 "Ta sẽ đích thân tìm ngươi, Bạn Thân của ta"
  travel_events.3010.c_dog:0 "$ill_find_you$ [ROOT.Char.Custom( 'DogStoryName' )]!"
  travel_events.3010.c_cat:0 "$ill_find_you$ [ROOT.Char.Custom( 'CatStoryName' )]!"
  travel_events.3010.c_exotic:0 "Dù nguy hiểm, nó vẫn là đứa bé bị lạc của ta! Ta sẽ tìm ngươi!"
  travel_events.3010.c.success:0 "Ngài tìm thấy thú cưng của mình"
  travel_events.3010.c.failure:0 "Ngài bị lạc khi cố tìm thú cưng"
  travel_events.3010.c.failure_toast:0 "Ngài bị lạc khi cố tìm thú cưng"
  after_him:0 "Nhanh lên! #EMP Tất cả#! đuổi theo"
  travel_events.3010.e_dog:0 "$after_him$ [ROOT.Char.Custom('DogStoryHerHim')]!"
  travel_events.3010.e_cat:0 "$after_him$ [ROOT.Char.Custom('CatStoryHerHim')]!"
  travel_events.3010.e_exotic:0 "$after_him$ hắn!"
  travel_events.3010.d:0 "Có những linh hồn không sinh ra để bị giam cầm. Hãy đi đi, Bạn ta."
  pet_rescue_modifier:0 "Trì Hoãn Tìm Thú Cưng"
  travel_events.3010.b.tt:0 "Có lẽ nó sẽ tự quay lại..."
 
  travel_events.3011.t:0 "Ra Là Ngươi Ở Đây!"
  travel_events.3011.intro:0 "Không mất nhiều công để lần theo tiếng gầm gừ và cành cây gãy đến nguồn gốc của chúng. "
  travel_events.3011.exotic:0 "Thợ săn thân yêu của ta đang ngồi trên lớp lá rụng, liếm móng vuốt dính máu của nạn nhân.\n\nCon sóc gần như không thể nhận ra, nằm ngay cạnh nó."
  travel_events.3011.dog:0 "[ROOT.Char.Custom( 'DogStoryName' )] ngồi trên một đống lá rụng, liếm sạch những chiếc chân màu [ROOT.Char.Custom( 'DogFurColor' )] của [ROOT.Char.Custom( 'DogStoryHerHis' )] khỏi vết máu của nạn nhân của [ROOT.Char.Custom( 'DogStoryHerHis' )].\n\nCon sóc gần như không thể nhận ra, nằm ngay bên cạnh [ROOT.Char.Custom( 'DogStoryHerHim' )]."
  travel_events.3011.cat:0 "[ROOT.Char.Custom( 'CatStoryName' )] ngồi trên một đống lá rụng, liếm sạch những chiếc chân màu [ROOT.Char.Custom( 'CatFurColor' )] của [ROOT.Char.Custom( 'CatStoryHerHis' )] khỏi vết máu của nạn nhân của [ROOT.Char.Custom( 'CatStoryHerHis' )].\n\nCon sóc gần như không thể nhận ra, nằm ngay bên cạnh [ROOT.Char.Custom( 'CatStoryHerHim' )]."
  travel_events.3011.a:0 "Ha! Ta biết ngươi sẽ thành công mà! Làm tốt lắm!"
  travel_events.3011.b:0 "Ta sẽ không bao giờ rời mắt khỏi ngươi nữa."
  adventurous_pet_modifier:0 "Thú Cưng Phiêu Lưu"
 
  travel_events.3012.t:0 "Trên Đường Về Nhà: Ngươi Ở Đây...?"
  travel_events.3012.exotic:0 "\n\nNó ngẩng mắt nhìn ta. Nhưng dường như nó không thể nhận ra ta."
  travel_events.3012.dog:0 "\n\n[ROOT.Char.Custom('DogStorySheHe')|U] ngẩng đôi mắt [ROOT.Char.Custom('DogEyeColor')] của [ROOT.Char.Custom( 'DogStoryHerHis' )] nhìn ta. Nhưng [ROOT.Char.Custom( 'DogStorySheHe' )] dường như không thể nhận ra ta."
  travel_events.3012.cat:0 "\n\n[ROOT.Char.Custom( 'CatStorySheHe' ) |U] ngẩng đôi mắt [ROOT.Char.Custom('CatEyeColor')] của [ROOT.Char.Custom( 'CatStoryHerHis' )] nhìn ta. Nhưng [ROOT.Char.Custom( 'CatStorySheHe' )] dường như không thể nhận ra ta."
  travel_events.3012.a:0 "Ta thấy ngươi đã tìm được một mái nhà tốt hơn. Ngươi được tự do."
  travel_events.3012.c:0 "Ta không mong gì ít hơn từ ngươi, Bạn ta."
  feral_pet_modifier:0 "Thú Cưng Hoang Dã"
  feral_pet_love_modifier:0 "Thú Cưng Hoang Dã Đáng Yêu"
 
 #Encounters in Distant Court Events
  travel_events.3020.t:0 "Một Sự Chào Đón Nồng Nhiệt"
  travel_events.3020.desc:0 "Âm nhạc vang lên chào đón khi chúng ta đến nơi, và những tên hề đang tung hứng nguy hiểm ngay gần đống lửa. Lũ trẻ lập tức im bặt khi nhìn thấy chúng ta và rụt rè chỉ tay về phía chúng ta từ sau lưng cha mẹ chúng. [foreign_ruler.GetTitledFirstName] mỉm cười từ trên bục cao.\n\n"Người bạn đáng kính của ta!," [foreign_ruler.GetSheHe] tiến về phía ta, hai tay dang rộng trong một cử chỉ chào đón. "Chúng ta đã chờ đợi ngài kể từ khoảnh khắc biết tin ngài sẽ đến. Xin vui lòng, ta cầu xin ngài, hãy ở lại với chúng ta bao lâu tùy thích, và cứ lên tiếng nếu ngài cần bất cứ điều gì.""
  travel_events.3020.a:0 "Chúng Ta có thể cần chút giúp đỡ cho hành trình đến [next_province.GetNameNoTooltip]."
  travel_events.3020.a_home:0 "Chúng Ta có thể cần chút giúp đỡ cho hành trình trở về nhà."
  travel_events.3020.b:0 "Chúng Ta hơi thiếu tiếp tế, giờ ngài nói mới nhớ..."
  travel_events.3020.b.success:0 "Ngài thuyết phục [foreign_ruler.GetTitledFirstNameNoTooltip] cho Ngài thêm tiếp tế"
  travel_events.3020.b.failure:0 "[foreign_ruler.GetTitledFirstNameNoTooltip] bị xúc phạm bởi yêu cầu của Ngài"
  travel_events.3020.c:0 "Thêm vài lính canh luôn là điều tốt."
  travel_events.3020.c.success:0 "Ngài thuyết phục [foreign_ruler.GetTitledFirstNameNoTooltip] cho Ngài thêm lính canh"
  travel_events.3020.d:0 "Ta rất muốn tận hưởng sự hiếu khách của ngài thêm một thời gian."
  travel_events.3020.d.tt:1 "Ngài sẽ tận hưởng sự hiếu khách của [foreign_ruler.GetTitledFirstNameNoTooltip] thêm hai tuần"
  travel_events.3020.e:0 "Chúng ta có thể bàn chuyện này kỹ hơn... trong phòng riêng của ngài."
  travel_events.3020.e.success:0 "[foreign_ruler.GetFirstNameNoTooltip] chấp nhận lời tán tỉnh của Ngài"
  travel_events.3020.e.failure:0 "[foreign_ruler.GetFirstNameNoTooltip] từ chối lời tán tỉnh của Ngài"
  travel_events.3020.f:0 "Ngươi không thể lừa ta bằng sự hiếu khách giả tạo! Ta đi đây!"
  more_supplies_modifier:0 "Hỗ Trợ Tiếp Tế"
  more_men_modifier:0 "Hỗ Trợ Quân Sự"
 
  travel_events.3021.t:0 "Về Vấn Đề Tôn Giáo"
  travel_events.3021.intro:0 ""À, ngài đây rồi!" [foreign_ruler.GetTitledFirstName] ra hiệu bảo ta tiến lại gần [foreign_ruler.GetHerHim] ngay khi ta bước vào phòng thiết triều.\n\n"Chúng ta đang chờ ngài đấy! [foreign_theologian.GetTitledFirstName] là cận thần đức hạnh nhất của ta và ta sẽ thực sự thích thú khi được nghe cả hai người cùng thảo luận về những vấn đề cao siêu hơn. "
  travel_events.3021.different_faiths:0 "Hãy nói ta nghe, vì sao người ta nên xem [ROOT.Char.GetFaith.GetName] là chân lý hơn [foreign_theologian.GetFaith.GetName]?\""
  travel_events.3021.same_faith:0 "Hãy cùng bàn về bản chất của [ROOT.Char.GetFaith.HighGodName].\""
  travel_events.3021.a:0 "Ta sẵn lòng chấp nhận thử thách này."
  travel_events.3021.a.success:0 "Ngài thuyết phục [foreign_theologian.GetTitledFirstNameNoTooltip] trong một cuộc tranh luận"
  travel_events.3021.a.failure:0 "[foreign_theologian.GetTitledFirstNameNoTooltip] đưa ra lập luận mạnh mẽ hơn"
  travel_events.3021.b:0 "Ta sẽ để [your_theologian.GetTitledFirstNameNoTooltip] tài giỏi thay ta nhận thử thách."
  travel_events.3021.b.success:0 "[your_theologian.GetTitledFirstNameNoTooltip] thuyết phục [foreign_theologian.GetTitledFirstNameNoTooltip] trong cuộc tranh luận"
  travel_events.3021.c:0 "Ta không có thời gian cho sự vô nghĩa này."
  travel_events.3021.d:0 "Vàng luôn thắng trong mọi cuộc tranh luận..."
  travel_events.3021.d.tt:0 "Ngài hối lộ [foreign_theologian.GetTitledFirstNameNoTooltip] để cho Ngài thắng."
  nick_the_discussant:0 "Người Tranh Luận"
  dismissed_religious_debate:0 "Rời Triều Sớm"
 
  travel_events.3022.t:0 "Một Lễ Ăn Mừng"
  travel_events.3022.desc:1 "Những vòng hoa rực rỡ tô điểm cho phòng thiết triều; dưới ánh nến lung linh dịu nhẹ của đại sảnh, các vị khách cất tiếng hát vang đầy sống động.\n\n"À, ngài đây rồi!" [foreign_ruler.GetTitledFirstName] vỗ tay của [foreign_ruler.GetHerHis], khiến những người hát xướng và nhạc công lập tức im lặng một cách bổn phận.\n\n"Chúng ta đang chuẩn bị bắt đầu một vũ điệu để vinh danh ngài, [ROOT.Char.GetTitledFirstNameNoTooltip]. Mọi người, hãy nắm tay nhau! Xếp thành một vòng tròn nào!""
  travel_events.3022.a:0 "Ta sẵn lòng tham gia!"
  travel_events.3022.b:1 "#EMP Aha!#! Ta đã chờ khoảnh khắc như thế này!"
  travel_events.3022.b.success:0 "Ngài gây ấn tượng với triều đình của [foreign_ruler.GetTitledFirstNameNoTooltip] bằng điệu nhảy của mình"
  travel_events.3022.b.failure:0 "Ngài làm trò cười trước triều đình của [foreign_ruler.GetTitledFirstNameNoTooltip]"
  travel_events.3022.c:1 "Ta muốn nghe vài cuộc trò chuyện hơn..."
  non_dancer_secret.desc:0 "Ngài biết được một [secret|E]"
  travel_events.3022.d:1 "Một [ROOT.Char.GetTitleAsNameNoTooltip] không nhảy: [ROOT.Char.GetSheHe] quan sát."

  vigorous_dancer_modifier:0 "Vũ Công Nhiệt Huyết"
  vigorous_dancer_modifier.desc:0 "Sự điêu luyện trong những điệu nhảy sôi động nhất khiến nhân vật này thường xuyên luyện tập và gây ấn tượng mỗi khi có cơ hội."
 
 #Infatuated Knight event
  travel_events.3030.t:0 "Một Món Quà Ngoại Quốc"
  travel_events.3030.desc:0 "Đây không phải lần đầu ta bắt gặp [fleeing_knight.Custom2('MyCharacterIntroduction', ROOT.Char)] nghịch mấy bông hoa [fleeing_knight.GetSheHe] hái dọc đường. Đôi khi ta còn nghe [fleeing_knight.GetHerHim] thở dài, nhìn về lãnh địa của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip].\n\n\"Thưa [ROOT.Char.Custom('GetCourtOwner')],\" [fleeing_knight.GetSheHe] nói. \"Không còn bí mật gì nữa, trái tim Ta đã tìm được mái nhà mới nơi đất khách. Than ôi, tâm hồn Ta đau đáu vì [foreign_lady_scope.GetTitledFirstName], khát khao của Ta không có hồi kết, đôi mắt của [foreign_lady_scope.GetHerHis], mái tóc của [foreign_lady_scope.GetHerHis]... Ta chỉ mong một cái chào, một lời nói cũng đủ khiến Ta chết vì hạnh phúc. Xin người, hãy cho Ta ở lại với [foreign_lady_scope.GetHerHim].\""
  travel_events.3030.a:0 "Ta là ai mà dám can thiệp chuyện của trái tim?"
  travel_events.3030.b:0 "Ngươi sẽ về nhà #EMP cùng ta#!."
  travel_events.3030.c:0 "Chúng ta không có thời gian cho những si mê trẻ con này."
  travel_events.3030.c.success:0 "Ngài thuyết phục [fleeing_knight.GetHerHim] ở lại"
  travel_events.3030.c.failure:0 "Lời nói của Ngài không hiệu quả"
  travel_events.3030.d:0 "Chúng ta có đủ chỗ trong [ROOT.Char.Custom('GetCourt')] của mình để chào đón cả hai người."
  travel_events.3030.e:0 "Đôi mắt của [foreign_lady_scope.GetHerHis|U] quả thật rất đẹp, và mái tóc của [foreign_lady_scope.GetHerHis] trông thật mềm mại..."
  travel_events.3030.f:0 "Ta #EMP ghét#! tình yêu. Chém đầu chúng!"
 
 #Curious Bishop event
  travel_events.3040.t:0 "Những Sở Thích Nguy Hiểm"
  travel_events.3040.desc:1 "Mỗi sáng kể từ khi chúng ta đến [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], [bishop.Custom2('MyCharacterIntroduction', ROOT.Char)] đều rời khỏi kiệu của [bishop.GetHerHis] và lặng lẽ lướt đi khuất khỏi tầm mắt của ta. Lần này ta quyết định đi theo con đường của [bishop.GetHerHis] và tìm thấy [bishop.GetHerHim] đang trò chuyện sôi nổi với [foreign_bishop.Custom('GetActualBishopTitle')] địa phương là [foreign_bishop.GetFirstName].\n\nBuổi lễ bắt đầu và ánh nến chiếu sáng [foreign_bishop.GetFirstNameNoTooltip] trong khi những bóng đen nhảy múa trên các bức tường như những chiếc lá mùa thu. "[bishop.GetFirstNameNoTooltip]," ta gọi ông ấy sau buổi lễ. "Ông đang làm gì vậy?"\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], thần vừa chợt nhận ra rằng có thể có nhiều hơn một sự thật.""
  travel_events.3040.a:0 "Nghi lễ đó quả thật rất ấn tượng..."
  travel_events.3040.b:0 "Thật vô nghĩa! #EMP Vô nghĩa!#!"
  travel_events.3040.c:0 "Chúng ta có thể tranh luận một cách bình tĩnh."
  travel_events.3040.c.success:0 "Ngài thuyết phục [bishop.GetFirstNameNoTooltip] rằng chỉ có một chân lý"
  travel_events.3040.c.failure:0 "[bishop.GetFirstNameNoTooltip] tức giận vì sự hẹp hòi của Ngài"
  travel_events.3040.d:0 "Không có chỗ cho bình tĩnh ở đây! Rút kiếm!"
  travel_events.3040.d.success:0 "Sức mạnh của Ngài khiến [bishop.GetShortUIName] phải chấp nhận"
  travel_events.3040.d.failure:0 "[bishop.GetShortUIName] tức giận vì sự bạo lực của Ngài"
  broadened_horizons_modifier:0 "Mở Rộng Tầm Nhìn"
  firm_convictions_modifier:0 "Niềm Tin Vững Chắc"
 
 #The Hermit events
  travel_events.3060.t:0 "Ẩn Sĩ"
  travel_events.3060.desc.intro: "Một hang đá hiện ra từ lớp cây cối như một mái vòm đá trong thánh đường. Ở lối vào có một chiếc bàn gỗ nhỏ và một cái ghế; ai đó đã để lại một chiếc đèn lồng đang cháy trên đó."
  travel_events.3060.desc.travel_leader: "\n\n\"Cẩn thận, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [travel_leader.GetTitledFirstName] giơ tay [travel_leader.GetHerHis] chắn trước ngực Ta. \"Có cướp trong vùng này.\"\n\n\"Ngươi buộc tội thật nhanh,\" một bóng người mờ ảo đứng ở lối vào hang. \"Ta chỉ là một ẩn sĩ, còn ngươi... lại mang danh hiệu [ROOT.Char.GetTitleAsNameNoTooltip].\""
  travel_events.3060.desc.on_your_own: " Có lẽ là một kẻ bị ruồng bỏ, hoặc cũng có thể là nơi ẩn náu của bọn cướp?\n\n\"Đừng sợ, thưa [ROOT.Char.GetTitleAsNameNoTooltip],\" một bóng người mờ ảo đứng ở lối vào hang. \"Ta chỉ là một ẩn sĩ, tìm kiếm trí tuệ trong khu rừng cổ này.\""
  travel_events.3060.a:0 "Một ẩn sĩ sẽ là sự bổ sung tuyệt vời cho đoàn tùy tùng của ta."
  travel_events.3060.b:0 "Thật may mắn! Xin hãy nói cho ta về tương lai của mình."
  travel_events.3060.c:0 "Chúng ta chỉ... chỉ nên đi thôi."
  impending_doom_modifier:0 "Điềm Gở Sắp Đến"
  impending_doom_modifier_desc:0 "Nhân vật này cảm thấy một điềm gở đang đến gần sau khi phớt lờ một ẩn sĩ"
  ignored_hermit:0 "Phớt Lờ Ẩn Sĩ"
  hermit_tells_your_future_tt:0 "Ngài sẽ nhận được một lời tiên tri..."
 
  travel_events.3061.t:0 "Ẩn Sĩ: Lời Tiên Tri"
  travel_events.3061.intro:0 "Ẩn sĩ suy nghĩ một lúc trước khi trả lời. [hermit_scope.GetSheHe|U] đứng dậy và chờ Ta đi theo. Có vài loại thảo mộc rải rác xung quanh và thứ trông như một chiếc giường thô sơ. Khi chúng Ta rời xa đoàn tùy tùng của Ta, [hermit_scope.GetSheHe|U] quay sang Ta và, với giọng nói trầm lạ thường, nói:\n\n"
  travel_events.3061.desc_good:0 "\"Người tìm kiếm rồi sẽ tìm thấy.\""
  travel_events.3061.desc_normal:0 "\"Ngọn lửa sẽ cất tiếng và bạc sẽ chảy từ móng của đàn gia súc rống gọi.\""
  travel_events.3061.desc_bad:0 "\"Nước sẽ trôi qua, nhưng ngươi thì không.\""
  travel_events.3061.a:0 "Thật sâu sắc."
  travel_events.3061.a.tt:0 "Ngài sẽ ghi nhớ điều này"
 
  travel_events.3062.t:0 "Ẩn Sĩ Của Ta Đâu?"
  travel_events.3062.desc:0 "[hermit_owner.GetTitledFirstName] tiếp đón chúng Ta nồng nhiệt khi chúng Ta đến lãnh địa của [hermit_owner.GetHerHis]. Tuy nhiên, lính gác của [hermit_owner.GetHerHis] lại khúc khích và thì thầm khi thấy chúng Ta, chỉ vào đoàn tùy tùng.\n\n\"Ôi [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetFirstNameNoTooltip] thân mến của ta! Thật vinh dự khi được chào đón ngài tại…\" [hermit_owner.GetFirstNameNoTooltip] dừng giữa câu, gương mặt [hermit_owner.GetHerHis] đỏ bừng. \"Ngươi đang làm gì với #EMP ẩn sĩ#! của ta?\""
  travel_events.3062.a:0 "Ta không có ý định đánh cắp cận thần của ngươi."
  travel_events.3062.b:0 "Giờ thì [hermit_scope.GetSheHe] là $cave_hermit_court_position$ #EMP của ta#!."
  travel_events.3062.b.tt:0 "[hermit_scope.GetShortUIName] sẽ rẻ hơn khi thuê làm $cave_hermit_court_position$ trong #bold 5 năm#! tới"
  travel_events.3062.c:1 "Sao chúng ta không để [hermit_scope.GetHerHim] tự quyết định phục vụ ai?"
  travel_events.3062.c.success:0 "Ngài thuyết phục [hermit_scope.GetShortUINameNoTooltip] ở lại với mình"
  travel_events.3062.c.failure:0 "[hermit_scope.GetShortUINameNoTooltip] sẽ ở lại triều đình của [hermit_owner.GetShortUINameNoTooltip]"
  found_hermit_mod:0 "Lương Ẩn Sĩ Được Tìm Thấy"
 
 #Bandit event
  travel_events.3070.t:1 "$travel_danger_prefix$ Thổ Phỉ Trên Cầu"
  travel_events.3070.desc:0 "Tiếng rì rào nhẹ của con sông mà chúng Ta theo dõi bấy lâu giờ trở nên rõ hơn. Một vài người trong đoàn nói về việc dừng chân một chút, lấy nước mới, nghỉ ngơi đôi chân.\n\nCó một cây cầu đá khi con đường rẽ. Vài người đàn ông tựa lưng vào lan can; một kẻ huých người kia và chỉ về phía nhóm chúng Ta. Một [bandit_scope.GetWomanMan] thứ ba bước lên từ bờ sông, một kẻ khác ngẩng lên nhìn chúng Ta sau khi nhổ nước bọt xuống dòng nước.\n\n\"Ngươi biết không,\" [bandit_scope.GetSheHe] nói, \"cây cầu này thực ra là cầu thu phí.\""
  travel_events.3070.a:0 "Ta hiểu."
  travel_events.3070.b:0 "Gan dạ đấy khi dám nói vậy. [knight_scope.GetTitledFirstNameNoTooltip], cho [bandit_scope.GetHerHim] thấy đi."
  travel_events.3070.b.success:0 "[knight_scope.GetShortUINameNoTooltip] đánh bại bọn cướp"
  travel_events.3070.b.failure:0 "Bọn cướp tấn công [knight_scope.GetShortUINameNoTooltip]"
  travel_events.3070.c:0 "Ngươi nghĩ mình đang nói chuyện với ai? Ta là #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#! đấy!!"
  travel_events.3070.c.success:0 "Ngài khiến bọn cướp sợ hãi"
  travel_events.3070.c.failure:0 "Bọn cướp không tin Ngài"
 
 #Knight Errant events
  travel_events.3080.t:0 "Một Hiệp Sĩ Lang Thang [knight_errant.Custom('KnightCultureNoTooltip')]"
  travel_events.3080.desc_intro:1 "Người ta biết rằng dân chúng ở [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] dường như dành sự sùng kính đặc biệt cho các [knight_errant.Custom('KnightCulturePluralNoTooltipLowercase')] và những huyền thoại của họ.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" vị [knight_errant.Custom('KnightCultureNoTooltipLowercase')] nói, cúi đầu [knight_errant.GetHerHis]. \"Thật may mắn khi ngài và ta gặp nhau tại ngã rẽ này, bởi ta đang tìm kiếm một suối nước kỳ diệu mà người ta nói rằng có thể chữa khỏi mọi bệnh tật. Nếu ngài giúp ta trong cuộc hành trình này, ta sẽ dâng lòng trung thành với ngài.\""
  travel_events.3080.desc_anagnorisis:1 "\n\n[same_culture_companion.GetTitledFirstName] nhanh chóng chen vào: \"Chờ đã, [ROOT.Char.Custom('FormOfAddressForLiege')]! Ta biết vị [knight_errant.Custom('KnightCultureNoTooltipLowercase')] này, đó là [knight_errant.GetFirstName]!\""
  travel_events.3080.a:0 "Ta sẽ không bao giờ bỏ mặc một [knight_errant.Custom('KnightCultureNoTooltipLowercase')]. Dẫn đường đi!"
  travel_events.3080.a.tt:0 "Ngài theo vị [knight_errant.Custom('KnightCultureNoTooltipLowercase')]"
  travel_events.3080.b:0 "Hãy gia nhập ta và quên hết những chuyện viển vông đó."
  travel_events.3080.b.success:0 "Ngài thuyết phục được vị [knight_errant.Custom('KnightCultureNoTooltipLowercase')]"
  travel_events.3080.b.failure:0 "Vị [knight_errant.Custom('KnightCultureNoTooltipLowercase')] rời đi, không bị thuyết phục"
  travel_events.3080.c:0 "\"Bộ giáp của ngươi thật đẹp... cho ta xin ít tiền được không?\""
  travel_events.3080.d:0 "\"[same_culture_companion.GetFirstNameNoTooltip], hãy khiến [knight_errant.GetHerHim] hiểu lý lẽ và gia nhập triều đình của ta.\""
 
  travel_events.3081.t:0 "Hiệp Sĩ Lang Thang [knight_errant.Custom('KnightCultureNoTooltip')]: Nhiệm Vụ"
  travel_events.3081.desc:0 "Vị [knight_errant.Custom('KnightCultureNoTooltipLowercase')] dẫn chúng Ta đến một khoảng đất trống nhỏ nơi một suối nước tự nhiên lấp lánh. Ánh sáng phản chiếu trên mặt nước với vẻ lung linh an lành khiến nó sáng đến mức như một mặt trời thứ hai.\n\n\"Cẩn thận, một con thú! Kẻ canh giữ!\" vị [knight_errant.Custom('KnightCultureNoTooltipLowercase')] chỉ vào một con [ROOT.Char.Custom('GetAnimalType')], đứng giữa chúng Ta và suối nước."
  travel_events.3081.a:0 "\"Đừng sợ! Ta sẽ chiến đấu với nó\""
  travel_events.3081.a.success:0 "Ngài giết con thú"
  travel_events.3081.a.failure:0 "Con thú làm Ngài bị thương"
  travel_events.3081.b:1 "\"Ta sẽ đánh lạc hướng nó, ngươi lấy nước đi!\""
  travel_events.3081.b.success:0 "Sự đánh lạc hướng của Ngài thành công"
  travel_events.3081.c:0 "\"Giờ thì, #EMP ngươi#! sẽ là mồi nhử hoàn hảo.\""
  travel_events.3081.d:0 "Thật là một cuộc phiêu lưu! Truyền cảm hứng quá!"
  knight_errant_training_modifier:0 "Huấn Luyện Hiệp Sĩ Lang Thang"
  knight_errant_faith_modifier:0 "Truyền Thuyết Nước Chữa Lành"
  sacred_water_modifier:0 "Nước Thiêng Chữa Lành"
  sacred_water_modifier_desc:0 "Nước kỳ diệu này được cho là có thể chữa khỏi mọi bệnh tật."
 
 #Church Visiting Event
  travel_events.3090.t:0 "Những Cánh Cửa Khép Kín"
  travel_events.3090.desc_intro:0 "Ah, ta còn nhớ những câu chuyện về [church_visit_location.GetNameNoTooltip] và [church_visit_holder.Custom('GetFaithTemple')] của nó, cao vút như một pháo đài hùng vĩ của [ROOT.Char.GetFaith.HighGodName]. Những khối đá có thể xây nên cả một thiên đường. Sự tĩnh lặng — và lời cầu nguyện.\n\nMột khung cảnh hoang vắng với sắc nâu của ngôi làng trải ra trước mắt chúng Ta; những con đường bùn lầy, lớp lát đá đã mòn theo năm tháng. Nhưng [church_visit_holder.Custom('GetFaithTemple')] vẫn ở đó. Đúng như lời hứa."
  travel_events.3090.desc_zealous:0 "\n\nMàu sắc rực rỡ của nó khiến ta quên đi mọi gam màu xám buồn tẻ. Một mong muốn mãnh liệt được vào thăm nơi này trỗi dậy trong ta."
  travel_events.3090.desc_cynical:0 "\n\nÍt nhất thì xét về mặt thẩm mỹ, nó cũng khá đẹp."
  travel_events.3090.desc_outro:1 "\n\n\"Ờ... [ROOT.Char.Custom('FormOfAddressForLiege')],\" một linh mục đặt một bó củi xuống gần bức tường, \"xin lỗi ngài, nhưng [church_visit_holder.Custom('GetFaithTemple')] đang đóng cửa để chuẩn bị cho [activity.GetNameNoTooltip].\""
  travel_events.3090.a:0 "Ta đã đến tận đây để xem nó #EMP và ta sẽ#!."
  travel_events.3090.a.success:0 "Ngài thuyết phục được linh mục địa phương mở [church_visit_holder.Custom('GetFaithTemple')]"
  travel_events.3090.a.failure:0 "Ngài thất bại trong việc thuyết phục"
  travel_events.3090.b:0 "Chúng ta có thể đợi đến khi không còn ai ở quanh..."
  travel_events.3090.b.success:0 "Ngài lẻn vào [church_visit_holder.Custom('GetFaithTemple')] thành công"
  travel_events.3090.b.success_desc:0 "Ngài phát hiện vài tài liệu mà lẽ ra mình không nên thấy..."
  travel_events.3090.b.failure:0 "Ngài bị bắt khi cố lẻn vào [church_visit_holder.Custom('GetFaithTemple')]"
  travel_events.3090.c:0 "Người đâu, phá cửa nếu cần."
  travel_events.3090.d:0 "Thật không may. Chúng ta tiếp tục hành trình thôi."
  ignored_church:0 "Phớt Lờ Đền Thờ"
 
  building_temple_church:0 "nhà thờ"
  building_temple_mosque:0 "thánh đường Hồi giáo"
  building_temple_temple:0 "đền thờ"
  building_temple_monastery: "tu viện"
 
 #Weak Steppe Horses Events
  travel_events.3100.t:0 "$travel_danger_prefix$ Ngựa Kiệt Sức"
  travel_events.3100.desc_intro:1 "Chúng Ta biết rằng việc băng qua thảo nguyên của [horses_steppe_location.GetName] sẽ không hề dễ dàng. Chúng Ta hành quân đến tận đêm mà không nghỉ, đến điểm dừng chân tiếp theo muộn đến mức thậm chí còn không ăn tối. Ngựa của chúng Ta hí vang, từ chối rời khỏi mặt nước mỗi khi tìm thấy một con suối."
  travel_events.3100.desc_steppe:0 "Dù chúng đã quen với thảo nguyên quê nhà, chúng vẫn chỉ là động vật và cần được nghỉ ngơi."
  travel_events.3100.desc_outro:1 "\n\nMột thương nhân địa phương đến gặp chúng Ta ngay sau khi nghe những lời phàn nàn, chỉ về phía chuồng gỗ phía sau [local_merchant.GetHerHim], nơi đầy những con ngựa địa phương.\n\n\"Ta có những con chiến mã tốt nhất mà ngươi từng thấy. Mạnh mẽ và bền bỉ.\""
  travel_events.3100.a:0 "Thật may mắn! Hãy đưa cho ta những con ngựa giống tốt nhất!"
  travel_events.3100.b:0 "Chúng sẽ phải chịu đựng thôi. Không chi thêm nữa."
  travel_events.3100.b.success:0 "Ngựa của Ngài sống sót qua chuyến đi"
  travel_events.3100.b.failure:0 "Ngựa của Ngài phải dừng lại liên tục"
  travel_events.3100.c:0 "Có lẽ chúng ta có thể lấy chúng #EMP miễn phí#!..."
  travel_events.3100.c.success:0 "Ngài đánh cắp được những con ngựa"
  travel_events.3100.c.failure:0 "Thương nhân buộc Ngài phải trả tiền vì vụ trộm"
  travel_events.3100.d:0 "Hah! #EMP Những#! con ngựa này còn chịu đựng tệ hơn thế!"
  bought_horses_modifier:0 "Ngựa Tốt Hơn"
  pushed_horses_good_modifier:0 "Thúc Ngựa Thành Công"
  pushed_horses_bad_modifier:0 "Thúc Ngựa Quá Mức"
 
  tour_travel.3110.t:0 "Một Điểm Dừng Trên Đường"
  tour_travel.3110.desc:0 "Đi qua những con đường bùn lầy của [ghino_di_tacco_location.GetName], hiếm khi thấy bóng người. Những căn nhà trống rỗng, hoang phế. Một đứa trẻ chơi với con chó trong im lặng, rồi trốn đi khi thấy đoàn tùy tùng của chúng Ta. Một linh mục địa phương chỉ về phía nhà của [ghino_di_tacco_scope.GetLadyLord], và chúng Ta đi theo.\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip] đáng kính của Ta!\" [ghino_di_tacco_scope.GetTitledFirstName] chào đón chúng Ta trong hành lang đầy bụi.\n\n\"Thật vinh dự lớn khi ngài ghé thăm lãnh địa khiêm tốn của chúng Ta. Nếu ngài muốn, xin hãy ở lại qua đêm và dùng bữa tối với chúng Ta!\""
  tour_travel.3110.a:0 "\"Ta rất sẵn lòng nhận lời mời của ngươi.\""
  tour_travel.3110.a.tt:0 "Ngài chấp nhận lời mời dự yến tiệc"
  tour_travel.3110.b:0 "\"Nơi này... không đạt tiêu chuẩn của ta. Chúng ta phải tiếp tục hành trình.\""
  tour_travel.3110.c:0 "\"Không gì khiến ta vui hơn! Ta thậm chí còn mang theo cả $court_jester_court_position$ của mình.\""
 
  tour_travel.3111.t:0 "Một Điểm Dừng Trên Đường: Yến Tiệc"
  tour_travel.3111.desc_intro:0 "Những ngọn đèn dầu tỏa ra ánh sáng yếu ớt đến mức gần như không thể nhận ra. Một người hầu già mang thức ăn ra: cá. Không gia vị.\n\n[ghino_di_tacco_scope.GetTitledFirstNameNoTooltip] có vẻ hơi quá căng thẳng, nói về những khó khăn khi cai trị một vùng đất nghèo như vậy, về việc thu thuế bất khả thi. \"Vị linh mục trước đây của chúng Ta đã rời đi chỉ sau vài tháng,\" [ghino_di_tacco_scope.GetSheHe] lẩm bẩm, cất đi bình rượu pha loãng.\n\n"
  tour_travel.3111.desc_breaking_down:0 "[ghino_di_tacco_scope.GetSheHe|U] lập tức bật khóc nức nở ngay sau đó, vùi khuôn mặt của [ghino_di_tacco_scope.GetHerHis] vào đôi bàn tay của [ghino_di_tacco_scope.GetHerHis]. "Ta... phải thành thật với ngài. Ý định của ta khi mời ngài đến đây là để trộm đồ của ngài, thưa [ROOT.Char.GetLadyLord] kính mến. Ta hy vọng ngài có thể tha thứ cho ta.""
  tour_travel.3111.desc_committed:0 "[ghino_di_tacco_scope.GetSheHe|U] nhanh chóng xin phép cáo lui để đi vệ sinh, vô tình va phải ta trên đường đi."
  tour_travel.3111.a:1 "\"Đây, hãy nhận lấy và đừng bao giờ trộm nữa.\""
  tour_travel.3111.b:0 "\"Hãy coi như chuyện này chưa từng xảy ra.\""
  tour_travel.3111.c:0 "\"Giờ thì #EMP ngươi#! sẽ phải trả giá.\""
  tour_travel.3111.d:0 "\"Lính gác của ta sẽ nói chuyện với ngươi.\""
  tour_travel.3111.e:0 "\"Khoan... ngươi đang làm gì vậy?\""
  tour_travel.3111.e.success:0 "Ngài nhận ra [ghino_di_tacco_scope.GetFirstNameNoTooltip] đang cố móc túi Ngài"
  tour_travel.3111.e.failure:0 "Ngài không nhận ra rằng [ghino_di_tacco_scope.GetFirstNameNoTooltip] đã trộm của Ngài"
  generous_donations_modifier:0 "Quyên Góp Hào Phóng"
 
 #Forest Fire Events
  travel_events.3120.t:0 "$travel_danger_prefix$ Cháy Trong [wooded_location.GetTerrain.GetNameNoTooltip]"
  travel_events.3120.desc:0 "Một chuyến tản bộ dễ chịu qua [wooded_location.GetNameNoTooltip] [wooded_location.GetTerrain.GetNameNoTooltip|l] khiến Ta thật sự trân trọng cảnh quan xung quanh: màu xanh sáng rực, đậm đà như chiếc váy của một quý bà được dệt từ loại vải thượng hạng — những tia nắng mặt trời xuyên qua tán lá như dòng mật lỏng.\n\nMột mùi hương nồng nàn. Có lẽ là lửa trại. Ta quay lại nhìn đoàn tùy tùng và thấy gương mặt tái mét của trưởng đoàn lữ hành [travel_leader.GetFirstNameNoTooltip]. \"#EMP CHÁY!#!\" [travel_leader.GetSheHe] hét lên, chỉ về phía những ngọn lửa không xa nơi [endangered_character.GetNameNoTooltip] đang mắc kẹt."
  travel_events.3120.a:0 "\"[travel_leader.GetFirstNameNoTooltip], cứu [endangered_character.GetHerHim]!\""
  travel_events.3120.a.big_success:1 "[endangered_character.GetFirstNameNoTooltip] được cứu"
  travel_events.3120.a.success:1 "[endangered_character.GetFirstNameNoTooltip] được cứu với rất nhiều khó khăn"
  travel_events.3120.a.failure:1 "[endangered_character.GetFirstNameNoTooltip] không được cứu"
  travel_events.3120.b:0 "Chúng ta không thể làm gì..."
  travel_events.3120.c:0 "Ta sẽ tự mình cứu [endangered_character.GetFirstNameNoTooltip]!"
  travel_events.3120.d:0 "\"[prowess_entourage_member.GetFirstNameNoTooltip], ngươi đi đi!\""
  travel_events.3120.d.big_success:0 "[prowess_entourage_member.GetFirstNameNoTooltip] cứu [endangered_character.GetFirstNameNoTooltip] an toàn"
  travel_events.3120.d.success:0 "[prowess_entourage_member.GetFirstNameNoTooltip] xoay xở cứu được [endangered_character.GetFirstNameNoTooltip] với rất nhiều khó khăn"
  travel_events.3120.d.failure:0 "[prowess_entourage_member.GetFirstNameNoTooltip] không thể cứu [endangered_character.GetFirstNameNoTooltip]"
 
 #Rival Assassin Events
  travel_events.3130.t:0 "$travel_danger_prefix$ Sát Thủ Quyến Rũ"
  travel_events.3130.desc:3 "Du hành qua vùng đất của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival_scope'))] [rival_scope.GetTitledFirstName] khiến đoàn tùy tùng của Ta luôn căng thẳng, thậm chí hoảng loạn. Chỉ một tiếng động lạ, chúng Ta đã rút vũ khí — và kìa, một bóng dáng bí ẩn xuất hiện giữa những cỗ xe!\n\n\"Chào buổi tối!\" kẻ xâm nhập mỉm cười, nghịch con dao trong tay. \"Nếu #EMP chỉ#! chúng ta gặp nhau trong hoàn cảnh dễ chịu hơn...\" [sexy_assassin.GetSheHe] bĩu môi. \"Dù sao! [rival_scope.GetTitledFirstNameNoTooltip] đã nhờ ta #EMP chào đón#! ngươi.\""
  travel_events.3130.a:1 "\"Đồ ngu! Ta sẽ khiến ngươi phải trả giá!\""
  travel_events.3130.a.success:1 "Lính gác của Ngài xử tử sát thủ"
  travel_events.3130.a.failure:0 "Sát thủ làm Ngài bị thương rồi trốn thoát"
  travel_events.3130.b:1 "\"Lính đâu! Bắt [sexy_assassin.GetHerHim]!\""
  travel_events.3130.b.success:0 "Ngài đánh bại sát thủ và gửi hắn trở lại cùng một bức thư"
  travel_events.3130.c:1 "\"Hoặc ngươi có thể gia nhập #EMP tay sai#! của ta...\""
  travel_events.3130.d:1 "\"Hoàn cảnh dễ chịu hơn, ngươi nói sao...?\""
  travel_events.3130.e:0 "\"Đi đi. Ta không muốn gặp lại ngươi.\""
  executed_assassin_modifier:0 "Ngăn Chặn Ám Sát"
  sent_assassin_back_modifier:0 "Phát Hiện Tay Sai"
 
 #Army Tries to Capture Entourage Member Events
  travel_events.3140.t:0 "$travel_danger_prefix$ Một Cuộc Băng Qua Tồi Tệ"
  travel_events.3140.desc:1 "Mùa màng bị đốt cháy, cánh đồng hoang tàn. Tàn tích của chiến tranh. Bước chân chúng Ta nhanh hơn khi thấy những xác chết đầu tiên.\n\nCon đường duy nhất có thể đi qua một trại quân. Ta nhìn phía sau: không còn đường nào khác. Ta gật đầu với lính gác và họ đáp lại, siết chặt chuôi kiếm.\n\nMột chỉ huy quân đội đứng ở lối vào trại: \"Đồng minh của kẻ thù, hả?\" [hostile_commander.GetSheHe] hỏi, gãi mũi [hostile_commander.GetHerHis], \"có muốn để lại một tù nhân không?\" [hostile_commander.GetSheHe|U] rõ ràng đang chỉ vào [entourage_member.GetTitledFirstName]."
  travel_events.3140.a:0 "Nhìn cờ hiệu của chúng ta đi, chúng ta không phải kẻ thù."
  travel_events.3140.a.success:0 "Ngài thuyết phục được chỉ huy"
  travel_events.3140.a.failure:0 "Chỉ huy từ chối lắng nghe"
  travel_events.3140.b:0 "Ngươi phải bắt được ta trước nếu muốn lấy [entourage_member.GetHerHim]!"
  travel_events.3140.b.success:0 "Ngài thắng trận"
  travel_events.3140.b.failure:0 "Chỉ huy thắng trận"
  travel_events.3140.c:0 "Có lẽ chúng ta có thể đạt được một thỏa thuận?"
 
 #Rival/Nemesis in Entourage Events
  travel_events.3150.t:1 "Những Lời Thì Thầm Kỳ Lạ"
  travel_events.3150.desc:1 "Ta nhận thấy rằng [rival_scope.GetTitledFirstName] né tránh ta nhiều hơn bình thường. [rival_scope.GetSheHe|U] luôn ngồi ở phía đối diện của bàn ăn bất cứ khi nào chúng ta được mời tham gia một bữa tiệc, và liên tục từ chối ở cùng ta khi hạ trại.\n\nChúng ta có thể không có mối quan hệ tốt đẹp nhất, nhưng thái độ đó đang bắt đầu làm ta mệt mỏi, đặc biệt là khi ta nghe lỏm được [rival_scope.GetHerHim] đang bôi nhọ ta: "[ROOT.Char.GetFirstNameNoTooltip] là một tên [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rival_scope'))] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival_scope'))], ta sẽ là một [ROOT.Char.GetTitleAsNameNoTooltip] tốt hơn nhiều so với [ROOT.Char.GetHerHim].""
  travel_events.3150.a:0 "Ngươi muốn biết hậu quả sao? Ta sẽ cho ngươi thấy!"
  travel_events.3150.a.success:0 "Ngài đánh bại [rival_scope.GetFirstNameNoTooltip] và khiến [rival_scope.GetHerHim] rời đi"
  travel_events.3150.a.failure:0 "[rival_scope.GetFirstNameNoTooltip] thắng trận rồi rời đi"
  travel_events.3150.b:1 "Trưởng đoàn lữ hành [travel_leader.GetFirstNameNoTooltip], xử lý chuyện này."
  travel_events.3150.b.success:0 "[travel_leader.GetFirstNameNoTooltip] thắng trận và khiến [rival_scope.GetFirstNameNoTooltip] rời đi"
  travel_events.3150.b.tt:0 "[travel_leader.GetFirstName] nhẹ nhàng quở trách [rival_scope.GetFirstName]"
  travel_events.3150.c:0 "Ngươi sẽ kết thúc đời mình trong ngục tối."
  travel_events.3150.d:0 "Biến khỏi tầm mắt ta. #EMP Ngay.#!"
  travel_events.3150.e:0 "Ta nghe thấy tiếng gió thôi sao?"
  travel_humiliation_modifier:0 "Sỉ Nhục Binh Biến"
 
 #Crows Events
  travel_events.3160.t:0 "$travel_danger_prefix$ Một Đàn Quạ"
  travel_events.3160.desc_battle:0 "Mặt đất thấm đẫm máu. Bước chân chúng Ta chậm lại, như thể đang đi qua đầm lầy. Xác chết vẫn nằm rải rác, chờ được thu dọn. Hầu hết chắc chắn đã mất những vật quý giá nhất của mình, nhưng vài người vẫn khăng khăng lục soát.\n\nKhi chúng Ta tiến lại gần các thi thể, chúng Ta nhận ra rằng mình không phải những kẻ duy nhất làm vậy và một đàn quạ kêu inh ỏi vào chúng Ta, rồi lao xuống tấn công Ta."
  travel_events.3160.desc_fallback:1 "Khu rừng kéo dài mãi. Con đường cũng vậy. Và Ta cũng thế. Chúng Ta vượt qua những cây đầu tiên và như bước vào một thế giới khác; những sinh vật, màn đêm. Chúng Ta len qua lớp cây cối và vui vẻ trò chuyện về chuyến đi, chúng Ta thấy chim, và thấy cả trái cây.\n\nGió lay động lá cây và chúng Ta tiếp tục bước đi. Có nhiều tổ chim hơn trên những cành cây này.\n\nMột đàn quạ kêu inh ỏi rồi lao xuống phía #EMP Ta#!."
  travel_events.3160.desc_outro:0 "Ta che mặt bằng cánh tay và hét lên khi cảm nhận được những chiếc mỏ của chúng, cố gắng đâm vào da thịt."
  travel_events.3160.a:0 "[travel_leader.GetFirstNameNoTooltip]! Giúp ta!"
  travel_events.3160.b:0 "Lấy bánh mì này! Để ta yên!"
  travel_events.3160.c:0 "Ta sẽ cho các ngươi biết tay!"
  travel_events.3160.c.success:0 "Ngài xua đuổi được đàn quạ"
  travel_events.3160.c.failure:0 "Đàn quạ làm Ngài bị thương"
 
