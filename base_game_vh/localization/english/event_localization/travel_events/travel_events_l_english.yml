l_english:
#Travel Flavor Events

# Travel event prefix
  travel_event_prefix:0 "Du hành:"

# Travel Death Events 
  travel_events.0010.t:0 "Chặng Đường Cuối"
  travel_events.0010.intro:0 "Ta ngồi tại bàn, chuẩn bị ăn, nhưng cơn đói đã biến mất. Có điều gì đó không ổn và Ta biết điều đó là thật khi thấy [ROOT.Char.Custom2('RelationToMe',messenger)], [messenger.GetFirstNameNoTooltip], tiến tới với vẻ mặt buồn rầu.\n\n'Ngài [ROOT.Char.GetTitleAsNameNoTooltip], một sứ giả đã đến trong đêm mang tin buồn,' [messenger.GetSheHe] nói nhẹ nhàng.\n\n'Ta e rằng... Ta e rằng [ROOT.Char.Custom2('RelationToMe',predecessor)], [predecessor.GetTitledFirstNameNoTooltip], [predecessor.GetDeathReason].'"
  travel_events.0010.to_activity:0 "[predecessor.GetSheHe|U] đang ở [predecessor_location.GetName] trên đường đến [travel_destination.GetNameNoTooltip]"
  travel_events.0010.at_destination:0 "[predecessor.GetSheHe|U] đang ở [predecessor_location.GetName]"
  travel_events.0010.from_activity:0 "[predecessor.GetSheHe|U] đang trở về nhà tại tỉnh [predecessor_location.GetName] sau khi thăm [travel_destination.GetNameNoTooltip]"
  travel_events.0010.desc:0 "$travel_events.0011.desc$"
  travel_events.0010.a:0 "[predecessor.GetSheHe|U] không đáng phải chết xa nhà..."

  travel_events.0011.desc_opening:0 "[messenger.Custom2('AppropriateGreeting', ROOT.Char)]"
  travel_events.0011.intro:0 "Ta rất tiếc phải viết những tin nặng nề này, nhưng chúng Ta vừa nhận được tin rằng [ROOT.Char.Custom2('RelationToMe',predecessor)], [predecessor.GetTitledFirstNameNoTooltip], [predecessor.GetDeathReason].\n\n"
  travel_events.0011.desc:0 "khi [predecessor.GetSheHe] qua đời. Thành kính chia buồn, [ROOT.Char.Custom('FormOfAddressForLiege')]."

#Travel lifestyle trait adoption
  travel_events.0050.t:0 "Tiếng Gọi Con Đường"
  travel_events.0050.landed: "Kể từ khi rời nhà [ROOT.Char.Custom('GetPeriodOfTimeWord')] trước"
  travel_events.0050.adventurer: "Kể từ khi khởi hành từ [ROOT.Char.GetTravelPlan.GetData.GetDepartureLocation.GetName] [ROOT.Char.Custom('GetPeriodOfTimeWord')] trước"
  travel_events.0050.desc:1 "Ta đã trải qua những thăng trầm ― tận hưởng gió thổi qua mái tóc và than vãn vì những viên đá trong giày.\n\nCó quá nhiều nơi, quá nhiều điều Ta vẫn chưa thấy. Ngoài kia, trên con đường mở, Ta cảm thấy tự do khỏi sự ràng buộc của [ROOT.Char.Custom('GetCourt')], dù chỉ trong chốc lát.\n\nCon đường đầy những người hành hương và kẻ lãng du, có lẽ trong #EMP họ#! Ta sẽ tìm thấy sự bình yên trong tâm hồn.\n\n"
  travel_events.0050.a:0 "Ngoài kia, Ta thật sự tự do."

#Peasant with no shoes
  travel_events.1000.t:0 "Đôi Chân Trần"
  travel_events.1000.desc:0 "Khi đoàn diễu hành đi qua [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], Ta bắt gặp một nông dân đi bộ bên đường mà không có giày. Đôi chân [shoeless_peasant.GetHerHis|U] đầy máu và sưng: [shoeless_peasant.GetSheHe|U] rõ ràng đã đi bộ rất lâu.\n\nKhi Ta đi ngang [shoeless_peasant.GetHerHim], Ta nhìn kỹ khuôn mặt [shoeless_peasant.GetHerHis], đôi mắt buồn bã, nét nhăn đau đớn. Có lẽ Ta có thể giúp gì đó?"
  travel_events.1000.a:0 "Cho [shoeless_peasant.GetHerHim] một đôi giày!"
  travel_events.1000.b:0 "Có lẽ [shoeless_peasant.GetSheHe] muốn đi cùng chúng ta?"
  travel_events.1000.c:0 "Chuyện này không phải việc của Ta, phải không?"
  travel_events.1001.title:0 "Quý Tộc Trá Hình!"
  travel_events.1001.desc:0 "Với đôi giày giờ đây đã che phủ đôi bàn chân chai sạn của [shoeless_peasant.GetHerHis], tên tá điền trao cho ta một nụ cười đầy ẩn ý và bước đi sóng đôi với tốc độ của ta.\n\n"Ngài là một vị [ROOT.Char.GetTitleAsNameNoTooltip|U] nhân từ và tốt bụng, và sự tử tế đó sẽ được đền đáp xứng đáng! Ta là [shoeless_peasant.GetName] thuộc gia tộc [shoeless_peasant.GetDynastyName] và ta luôn trọng thưởng cho những kẻ có tấm lòng nhân hậu.""
  travel_events.1001.desc.outro.poet:0 "\n\nHóa ra [shoeless_peasant.GetWomanMan] này không phải nông dân, mà là một nhà thơ nổi tiếng!"
  travel_events.1001.desc.outro:0 "\n\nHóa ra [shoeless_peasant.GetWomanMan] này không phải nông dân, mà là một quý tộc giàu có!"
  travel_events.1001.a:0 "Ta nhận lời một cách biết ơn."
  travel_events.1001.c:0 "Hãy tiến lên như những người Ngài!"
  travel_events.1002.title:0 "$travel_events.1001.title$"
  travel_events.1002.desc:0 "Khi chúng ta cưỡi ngựa băng qua, tên tá điền bất ngờ túm lấy y phục của ta bằng đôi bàn tay bẩn thỉu của [shoeless_peasant.GetHerHis], và nhìn xoáy sâu vào đôi mắt ta.\n\n"Đây không phải là hành vi xứng tầm với một vị [ROOT.Char.GetTitleAsNameNoTooltip|U], phải không? Nếu ngài biết ta là ai, ngài đã không để ta tiếp tục chịu cảnh này!"\n\n[shoeless_peasant.GetSheHe|U] tự lộ diện [shoeless_peasant.GetHerselfHimself] là một quý tộc thuộc gia tộc [shoeless_peasant.GetDynastyName] và dường như giờ đây đang nhìn ta với sự khinh miệt tột cùng."
  travel_events.1002.a:0 "Làm sao Ta biết được?"
  friend_showed_charity:0 "[CHARACTER.GetShortUIName|U] đã tỏ ra hào phóng với [TARGET_CHARACTER.GetShortUIName]"
  friend_showed_charity_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] đã tỏ ra hào phóng với [CHARACTER.GetShortUIName]"
  rival_ungenerous:0 "[CHARACTER.GetShortUIName|U] đã từ chối cứu trợ [TARGET_CHARACTER.GetShortUIName] trong lúc [TARGET_CHARACTER.GetHerHis] hoạn nạn"
  rival_ungenerous_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] đã từ chối cứu trợ [CHARACTER.GetShortUIName] trong lúc [CHARACTER.GetHerHis] hoạn nạn"

#Bandit attack
  travel_events.1003.t:0 "$travel_danger_prefix$ Thu Phí Đường"
  travel_events.1003.desc:1 "Chúng Ta đi trên đường lâu quá và mặt trời bắt đầu lặn. Từ những hình dạng xung quanh dần hiện ra những kẻ vũ trang giận dữ.\n\n'Con đường này có phí, trả tiền ngay,' kẻ to con và xấu xí nhất trong nhóm nói.\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('travel_leader'))] [travel_leader.GetFirstName] bước tới với vũ khí giơ cao, nhìn Ta để tìm hướng dẫn."

  travel_events.1003.a:0 "À, tất nhiên rồi, phí đường."
  travel_events.1003.b:0 "Hay là các ngươi muốn lấy máu thay tiền?"
  travel_events.1003.c:0 "Thu phí chỉ dành cho nông dân, còn ta là [ROOT.Char.GetTitleAsNameNoTooltip]."
  travel_events.1003.a.success:0 "Bị hăm dọa, họ để ngươi đi qua."
  travel_events.1003.a.failure:0 "Ngươi vẫn phải chiến đấu để qua."

  travel_events.1005.t:1 "$travel_danger_prefix$ Thu Phí [ROOT.Char.GetFaith.WaterGodNamePossessive]"
  travel_events.1005.desc:0 "Những cơn gió mạnh và sóng dồn liên tục làm con tàu nghiêng suốt nhiều giờ và khi Ta đứng trên boong bám chặt cột buồm, Ta thấy hòm chứa [overboard_artifact.GetName] của Ta đã tuột ra!\n\nTa quá xa để cứu nó, nhưng [travel_leader.GetFirstName] ở gần. Tuy nhiên [travel_leader.GetSheHe] có nguy cơ rơi xuống biển."
  travel_events.1005.a:0 "Cứu lấy nó!"
  travel_events.1005.b:0 "Không đáng liều mạng."

  travel_events.4000.t:0 "Những Chuyến Đi Sắp Tới"
  travel_events.4000.desc.intro:0 "Đi qua [ROOT.Char.GetCurrentLocation.GetName], Ta bắt gặp một chiếc lều kỳ lạ mở rộng với cư dân còn kỳ lạ hơn bên trong.\n\n'Vào đi, oh ngài [ROOT.Char.GetTitleAsNameNoTooltip|U].'"
  travel_events.4000.desc.mid.long_to_go:0 "Ta thấy ngài còn nhiều dặm đường phía trước,"
  travel_events.4000.desc.mid.travelled_far:0 "Ta thấy ngài đã đi từ rất xa,"
  travel_events.4000.desc.outro:0 "và Ta có thể đọc vận may chuyến đi của ngài, với một mức giá khiêm tốn.'\n\nNgười [mystic_scope.GetWomanMan] kỳ lạ đã thu hút sự chú ý của đoàn, nhưng Ta có sẵn lòng trả tiền cho 'đọc vận'?"
  travel_events.4000.a:0 "Hãy kể cho Ta về tương lai, người khôn ngoan."
  travel_events.4000.b:0 "Hãy trải nghiệm tương lai #EMP với#! Ta."
  travel_events.4000.c:0 "Ta không quan tâm."
  travel_events.4000.d:0 "Đóng lều và đốt người phù thủy này đi!"
  travel.good_reading:0 "Chuyến Đi Của Ngài Tốt Lành"
  travel.bad_reading:0 "Chuyến Đi Của Ngài Xui Xẻo"

  travel_events.4001.t:0 "Kẻ Cuồng Tín"
  travel_events.4001.desc:1 "Đoàn tùy tùng của Ta đi qua [ROOT.Char.GetCurrentLocation.GetName] không gặp vấn đề gì, cho đến khi Ta nghe thấy tiếng ồn từ phía lính hộ vệ. Cuối cùng, một kẻ lạ mặt chen vào và đứng bên cạnh Ta, tươi cười như được ban phước bởi [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself].\n\n'Nhân danh [loyal_fan_scope.GetFaith.random_GoodGodNames]! Nhân danh [loyal_fan_scope.GetFaith.random_GoodGodNames]! Nhân danh [loyal_fan_scope.GetFaith.random_GoodGodNames]! Chính là [ROOT.Char.GetTitleAsNameNoTooltip|U] của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]! Ta chỉ mong được phục vụ ngài vô điều kiện suốt đời!' \n\nCác lính hộ vệ Ta chuẩn bị ném [loyal_fan_scope.GetHerHim] trở lại bùn, nhưng [loyal_fan_scope.GetSheHe] chắc chắn sẽ là một người hầu trung thành."
  travel_events.4001.a:0 "Gia nhập cùng ta."
  travel_events.4001.b:0 "Đây, một ít tiền cho lòng trung thành của ngươi."
  travel_events.4001.c:0 "Trở về cống rãnh nơi ngươi đến."

  travel_events.4002.t:0 "[local_beauty_scope.GetCulture.GetNameNoTooltip] [local_beauty_scope.GetWomenMen|U]"
  travel_events.4002.desc:0 "Ta đã đi khắp thế gian và chiêm ngưỡng nhiều kỳ quan trong các chuyến du hành của mình, nhưng chưa bao giờ ta được chứng kiến những giai nhân tuyệt sắc như những người ta thấy ở [ROOT.Char.GetCurrentLocation.GetName]. Quả thực, giới [local_beauty_scope.GetWomenMen] thuộc nền văn hóa [local_beauty_scope.GetCulture.GetName] vượt trội hơn hẳn phần còn lại của thế giới.\n\nMột dung nhan đặc biệt cuốn hút đã lọt vào mắt xanh của ta gần đây, một [local_beauty_scope.GetWomanMan] mang tên [local_beauty_scope.GetName].\n\nMột [local_beauty_scope.Custom('LoverPetName')] nhỏ nhắn xinh đẹp, [local_beauty_scope.GetSheHe] quá đỗi vừa mắt ta để phải phí hoài những ngày tháng của [local_beauty_scope.GetHerHis] làm lụng khổ dịch ở [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]."
  travel_events.4002.a:0 "Người tình mới của Ta."
  travel_events.4002.b:0 "[local_beauty_scope.GetSheHe|U] phải luôn ở bên Ta."
  travel_events.4002.c:0 "Chúng ta phải kết hôn ngay!"
  travel_events.4002.d:0 "Đáng tiếc, Ta không thể trao tình yêu quá dễ dàng."

  travel_events.4003.t:0 "Quái Vật Trên Đường Chân Trời"
  travel_events.4003.desc.intro:0 "Biển dày đặc sương mù, đá và sóng hiện ra rồi biến mất trong nháy mắt. Một bóng dáng khổng lồ xuất hiện trên đường chân trời, và mọi thứ yên tĩnh cho đến khi quái vật lộ diện khỏi sương."
  travel_events.4003.desc.viking:1 "Đầu rồng áp sát con tàu, với một đoàn thủy thủ Bắc Âu dữ tợn gào thét trên lưng!"
  travel_events.4003.desc.berber_pirate:1 "Một con tàu lớn đầy chiến lợi phẩm xuất hiện trên đường chân trời, với thủy thủ Barbary vung kiếm, sẵn sàng tấn công!"
  travel_events.4003.desc.regular_pirate:1 "Một con tàu đầy bọn cướp rách rưới tiến đến, nụ cười không răng của chúng háo hức chạm vào của cải của chúng ta."
  travel_events.4003.a:0 "Chúng ta sẽ đánh bật chúng!"
  travel_events.4003.b:0 "Để chúng lấy những gì chúng muốn."
  travel_events.4003.c:0 "Cố gắng đánh lạc hướng chúng trong sương!"
  travel_events.4003.d:0 "Ngôn từ khéo léo của Ta sẽ biến chúng thành đồng minh!"
  travel_events.4003.offer_accepted:0 " [viking_scope.GetFirstName] chấp nhận đề nghị của Ngài"
  travel_events.4003.offer_refused:0 " [viking_scope.GetFirstName] từ chối đề nghị của Ngài"

  travel_events.4004.t:0 "Cá Trên Biển"
  travel_events.4004.desc:0 "Nghe nói rằng ngư dân [fishermen_county_scope.GetCountyData.GetCulture.GetName] nổi tiếng toàn thế giới về khả năng khai thác đại dương đầy ắp những chiến lợi phẩm ngon nhất. Hôm nay, bên bờ [fishermen_county_scope.GetNameNoTierNoTooltip], Ta may mắn gặp một đội tàu đánh cá của [fishermen_county_scope.GetCountyData.GetCulture.GetNameNoTooltip]!\n\nĐoàn của chúng Ta đi gần một tàu lạc, và ngay lập tức Ta ngửi thấy mùi hăng đặc trưng của thuyền trưởng.\n\n'Thật vinh dự, ngài [ROOT.Char.GetLadyLord]. Ngài có muốn xem những chiến lợi phẩm tốt nhất hôm nay không?'"
  travel_events.4004.a:0 "Tối nay chúng ta sẽ ăn ngon!"
  travel_events.4004.b:0 "Đưa cá hoặc mạng sống, thủy thủ!"
  travel_events.4004.c:0 "Hôm nay không."

  travel_events.4005.t:0 "Đồ Vật Hiếm"
  travel_events.4005.desc:0 "Biển xung quanh đầy những thương nhân [merchant_character_scope.GetCulture.GetName] bận rộn với công việc, mang theo hàng hóa hiếm và quý từ cảng này sang cảng khác.\n\nMột con tàu thương nhân mang theo vật phẩm khiến Ta lập tức chú ý. Ngay khi nhìn thấy [merchant_artifact_scope.GetName], Ta biết không thể tìm được thứ gì giống ở [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] và nó nhất định phải thuộc về Ta."
  travel_events.4005.a:0 "Nó sẽ là của Ta!"
  travel_events.4005.b:0 "Ta sẽ lấy trộm nó!"
  travel_events.4005.c:0 "Đáng tiếc, Ta không thể chi tiêu bừa bãi như vậy."

  travel_events.4006.t:0 "Kẻ Trộm Có Cánh"
  travel_events.4006.desc:0 "Ta đang thư giãn trên biển xanh bỗng nghe tiếng hét! Ta chạy xuống khoang và kinh hãi khi thấy một [ROOT.Char.Custom('GetRandomMigratoryBird')] bên cạnh đống lộn xộn của lương thực, lông bay tơi tả do bụng nó phình to.\n\nTrong cơn giận, Ta suýt giết con chim đáng ghét ngay tại chỗ, nhưng bị [superstituous_caravan_member.Custom2('MyCharacterIntroduction', ROOT.Char)] ngăn lại.\n\n'Chờ đã! Ngươi [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('superstitious_caravan_member'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('superstitious_caravan_member'))]! Ngươi không biết rằng giết chim trên biển là điều xui xẻo sao?'"
  travel_events.4006.a:0 "Ta sẽ tha mạng."
  travel_events.4006.b:0 "Không gì cản Ta giết con chim đáng ghét này!"

  travel_events.4007.t:1 "$travel_danger_prefix$ Thời Tiết Bão Bùng"
  travel_events.4007.desc:0 "[ROOT.Char.GetFaith.WaterGodName] rõ ràng không ưa chuyến đi, khi những cơn sóng cao như lâu đài ập xuống con tàu nhỏ của chúng Ta! Tàu rung lắc, mọi người bám lấy bất cứ thứ gì để khỏi rơi xuống biển khi tàu sắp lật.\n\nTa tất nhiên được giấu cùng các quý tộc khác ở phần an toàn nhất của tàu, nhưng khi trời sấm chớp và biển nổi giận, Ta sợ rằng chỉ dựa vào niềm tin Ta sẽ không sống sót."
  travel_events.4007.a:0 "Ta tin tưởng thuyền trưởng."
  travel_events.4007.b:0 "Nhân danh [ROOT.Char.GetFaith.WaterGodName], Ta sẽ lái tàu!"
  travel_events.4007.c:0 "Bám theo một số tàu địa phương qua bão."

  travel_events.4008.t:1 "Con Tàu Bị Bỏ Rơi"
  travel_events.4008.desc:0 "Hôm nay biển lặng và êm, như tảng đá, gió mạnh thổi từ phía sau. Có vẻ sẽ là một ngày dễ dàng cho những tay chèo, nhưng Ta nhìn thấy xác tàu nghiền nát đâm vào đá nhọn phía trước.\n\nDường như không còn sống sót ai, và đá rất khó điều hướng, nhưng Ta cảm thấy bị thôi thúc đi điều tra xác tàu bí ẩn này."
  travel_events.4008.a:0 "Đi điều tra."
  travel_events.4008.b:0 "Chỉ toàn cái chết phía trước."

  travel_events.4009.t:1 "Con Tàu Bị Bỏ Rơi: Vật Phẩm"
  travel_events.4009.desc:0 "Như dự đoán, xác tàu không có sự sống, chỉ có vài con chim gõ vào xác nửa ăn của những người đi trước.\n\nQuan sát kỹ, Ta thấy vật gì đó lóe sáng trong mỏ chim. Với tiếng kêu cao vút, nó thả vật phẩm xuống xác tàu và bay đi, để Ta thu nhặt vật này."
  travel_events.4009.a:0 "Một vật tuyệt vời!"

  travel_events.4010.t:1 "Con Tàu Bị Bỏ Rơi: Của Cải"
  travel_events.4010.desc:0 "Như mọi người đoán, không còn ai sống sót, nhưng quần áo và đồ vật trên xác chỉ ra rằng đây từng là tàu chở hàng giàu có!\n\nTrong đống xác tàu, Ta thấy hàng hóa kỳ lạ và trang phục xa hoa vẫn còn nguyên, chỉ hơi ướt. Chắc chắn những món này sẽ bán được giá khi chúng Ta cập bờ."
  travel_events.4010.a:0 "Một phát hiện tốt!"

  travel_events.4011.t:1 "Con Tàu Bị Bỏ Rơi: Người Sống Sót"
  travel_events.4011.desc:0 "Thật bất ngờ, Ta nghe thấy tiếng gọi tàu khi tiến gần xác tàu. [castaway_scope.GetWomanMan] trôi trên mảnh cửa, dường như là quý tộc giàu có.\n\n'Hail! Ta tưởng mình sẽ không gặp ai nữa trước khi biển lấy mạng Ta như đã lấy mạng Ngài đồng hành.'\n\n[castaway_scope.GetSheHe|U] giới thiệu [castaway_scope.GetHerselfHimself] là [castaway_scope.GetName], tự nhận là quý tộc từ [nearby_coast_scope.GetName] và đề nghị trả tiền cho việc đưa đến bờ an toàn và đồng hành."
  travel_events.4011.a:0 "Chúng Ta sẽ giúp ngươi vào bờ."
  travel_events.4011.b:0 "Gia nhập cùng chúng Ta trong chuyến đi!"
  travel_events.4011.c:0 "Xin lỗi, Ta không nghe thấy ngươi..."

  travel_events.4012.t:0 "[feral_child_scope.GetFirstNameNoTooltip], [feral_child_scope.Custom('GetAnimalType')|U] [feral_child_scope.Custom('GirlBoy')|U]"
  travel_events.4012.desc:1 "Khi đi qua vùng hoang dã của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], Ta có cảm giác bị theo dõi. Ẩn mình kém cỏi, Ta thấy một [feral_child_scope.Custom('GirlBoy')] yếu ớt, bẩn thỉu, quan sát đoàn.\n\nMột thành viên caravan nói rằng người địa phương cho rằng vùng này bị [feral_child_scope.GetFirstNameNoTooltip] ám, người này được nuôi lớn xa xã hội loài người bởi một [feral_child_scope.Custom('GetAnimalType')].\n\nHóa ra, sinh vật tội nghiệp này rất thích thú với chúng Ta và đã bắt đầu nói một ít [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip], dù chưa thành thạo."
  travel_events.4012.a:0 "Ta sẽ huấn luyện [feral_child_scope.Custom('GirlBoy')]!"
  travel_events.4012.b:0 "Chỉ cần bỏ qua [feral_child_scope.GetHerHim]."
  travel_events.4012.c:0 "Đuổi [feral_child_scope.GetHerHim] về với [feral_child_scope.GetHerHis] Ngài [feral_child_scope.Custom('GetAnimalType')]!"

  travel_events.4013.t:0 "[feral_child_scope.GetFirstNameNoTooltip], Một Bước Tiến"
  travel_events.4013.desc:0 "Dù chẳng ai từng dám mơ đến điều đó, nhưng dường như đã có một bước tiến vượt bậc trong sự phát triển của [feral_child_scope.GetFirstNamePossessive]!\n\nTừng là một đứa trẻ đơn thuần được nuôi dưỡng bởi không gì ngoài dã thú, đứa [feral_child_scope.Custom('GirlBoy')] cuối cùng cũng cho thấy sự tiến bộ. [feral_child_scope.GetFirstNameNoTooltip] đã có thể nói chuyện bằng những câu hoàn chỉnh và vui đùa cùng những đứa trẻ khác cùng trang lứa với [feral_child_scope.GetHerHis] như thể [feral_child_scope.GetSheHe] luôn là một phần trong số chúng.\n\nHôm nay, sau những buổi học như thường lệ, [feral_child_scope.GetSheHe] thậm chí còn cầu xin ta làm [ROOT.Char.GetMotherFather] của [feral_child_scope.GetHerHis]."
  travel_events.4013.a:0 "[feral_child_scope.GetSheHe|U] là [feral_child_scope.Custom('GetDaughterSon')] của Ta, dù máu mủ hay không."
  travel_events.4013.b:0 "Thật là một thành công!"

  travel_events.4014.t:0 "[feral_child_scope.GetFirstNameNoTooltip], Khao Khát Vùng Hoang"
  travel_events.4014.desc:0 "[feral_child_scope.GetFirstName] thực sự là một thử thách lớn trong việc dạy dỗ, điều đó là chắc chắn. [feral_child_scope.GetSheHe|U] hiếm khi có thể ghép nối nổi một câu hoàn chỉnh, và vẫn rình rập xung quanh như một con thú hoang. Cuộc sống trong nhà dường như gây ra cho [feral_child_scope.GetHerHim] vô vàn áp lực, và khi [feral_child_scope.GetSheHe] quyết định cất lời, [feral_child_scope.GetSheHe] hầu như chỉ nói về việc quay trở lại chốn hoang dã.\n\nTa đứng nhìn khi [feral_child_scope.GetSheHe] đứng một cách không thoải mái trên hai chân và ra hiệu muốn rời đi, và bằng cách nào đó ta biết rằng lần này, [feral_child_scope.GetSheHe] sẽ ra đi mãi mãi."
  travel_events.4014.a:0 "Chờ đã! Cho Ta thêm cơ hội nữa!"
  travel_events.4014.b:0 "Ta sẽ không bao giờ quên ngươi, [feral_child_scope.GetFirstNameNoTooltip]."

  travel_events.4015.t:0 "Rào Cản Ngôn Ngữ"
  travel_events.4015.desc:0 "Dường như đoàn lữ hành của chúng ta đã bị lạc đường đôi chút ở những vùng đất ngoại bang này.\n\n[travel_leader_scope.GetName] đã dẫn chúng ta đi loanh quanh vùng [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] suốt nhiều giờ đồng hồ, và mặc dù [travel_leader_scope.GetSheHe] cuối cùng đã gạt bỏ lòng kiêu hãnh của [travel_leader_scope.GetHerHis] để hỏi thăm đường đi, nhưng [travel_leader_scope.GetSheHe] có vẻ không phải là một người thông thạo ngôn ngữ [ROOT.Char.GetCurrentLocation.GetCulture.GetLanguage.GetNameNoTooltip]."
  travel_events.4015.a:0 "Để Ta thử."
  travel_events.4015.b:0 "May mắn thay, Ta thông thạo [ROOT.Char.GetCurrentLocation.GetCulture.GetLanguage.GetNameNoTooltip]!"

  travel_events.4016.t:1 "$travel_danger_prefix$ Nóng Quá"
  travel_events.4016.desc.intro:0 "Ta đã đi xa nhà, và những cơn gió lạnh đã ở sau lưng. Dù ban đầu sự thay đổi khí hậu thật dễ chịu và tốt cho làn da,"
  travel_events.4016.desc.mid.dry_heat:0 "làn da Ta bắt đầu đỏ rực và nước đi qua cơ thể như cát qua rây."
  travel_events.4016.desc.mid.humid_heat:0 "không khí ẩm khiến Ta cảm giác như thở qua vải ướt."
  travel_events.4016.desc.outro:0 "\n\nNước mát làm Ta sảng khoái, giảm bớt kiệt sức do nóng, nhưng vẫn chưa đủ."
  travel_events.4016.a:0 "Mặt trời, hãy làm hết sức ngươi!"
  travel.got_heatstroke:0 "Ngài bị quá nóng"
  travel.found_a_place_to_cool:0 "Ngài tìm thấy dòng sông mát"
  travel_events.4016.b:0 "Ta cần nước!"
  every_entourage_tt:0 "Mỗi thành viên đoàn"
  travel.stole_water:0 "Ngài đã uống trộm một ngụm nước mát"
  travel.caught_stealing_water:0 "Ngài bị bắt!"

  travel_events.4017.t:0 "Kiếm thuê"
  travel_events.4017.desc.intro:0 "Ta đã nghe về những chiến tích quân sự của các lính đánh thuê huyền thoại [ROOT.Char.GetCurrentLocation.GetCulture.GetName], và khi đi qua [ROOT.Char.GetCurrentLocation.GetName], thật may mắn khi gặp một chỉ huy lính đánh thuê vô cùng tài ba!\n\n"
  travel_events.4017.desc.mid.nomad:0 "[warrior_scope.GetName] tự xưng tụng [warrior_scope.GetHerselfHimself] là chiến binh đáng sợ nhất trên khắp vùng thảo nguyên"
  travel_events.4017.desc.mid.swordsman:0 "[warrior_scope.GetName] tuyên bố rằng [warrior_scope.GetSheHe] là [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] kiếm thủ [warrior_scope.GetWomanMan] xuất sắc nhất trên thế giới"
  travel_events.4017.desc.outro:0 "và sẽ vinh dự phục vụ, nếu giá cả hợp lý."
  travel_events.4017.a:0 "Và giá cả hợp lý [warrior_scope.GetSheHe] sẽ có!"
  travel_events.4017.b:0 "Ta chắc chắn chúng ta có thể thương lượng."
  travel.haggle_succesful:0 "Ngài thương lượng thành công!"
  travel.haggle_failed:0 "[warrior_scope.GetName] bị xúc phạm"
  travel_events.4017.c:0 "Có lẽ chúng ta sẽ dùng mối quan hệ này cho một thỏa thuận sau..."
  travel_events.4017.d:0 "Ta nghĩ không cần thiết."

  travel_events.4018.t:0 "Một kẻ ăn xin [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip]"
  travel_events.4018.desc.intro:1 "Chúng ta nghe rằng [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetHolder.GetPrimaryTitle.GetNameNoTierNoTooltip] là vùng đất đầy những thầy tu đi khất thực, sống thường chỉ dựa vào đức tin.\n\nMột kẻ ăn xin như vậy đã tiếp cận đoàn của chúng ta,"
  travel_events.4018.desc.mid.mystic:0 "giảng dạy triết lý huyền bí của [mystic_scope.GetHerHis] cho bất cứ ai chịu lắng nghe."
  travel_events.4018.desc.mid.preacher:0 "nói về cách hiểu của [mystic_scope.GetHerHis] về ý muốn của [mystic_scope.GetFaith.HighGodNamePossessive] và cách sống một đời sống đạo hạnh."
  travel_events.4018.desc.outro:0 "\n\nSinh vật nghèo khó này dường như không muốn rời khỏi đoàn, nhưng có lẽ ta có thể khiến [mystic_scope.GetHerHim] rời đi..."
  travel_events.4018.a:0 "Ta là bậc thầy tranh luận."
  travel.debate_won:0 "Ngài thắng trong cuộc tranh luận!"
  travel.debate_lost:0 "Ngài thua trong cuộc tranh luận."
  travel_events.4018.b:0 "[mystic_scope.GetSheHe|U] cũng có vài điểm hay..."
  travel_events.4018.c:0 "Ta chắc chắn rằng cuối cùng bọn họ cũng sẽ rời đi thôi."
  travel_events.4018.d:0 "Một kẻ dị giáo tốt là nên bị thiêu!"

  travel_events.4019.t:0 "Món ngon hạ hèn"
  travel_events.4019.desc:0 "Trên đường đi qua [ROOT.Char.GetCurrentLocation.GetName], ta vô tình bước vào một khu chợ ẩm thực địa phương! Khắp nơi, nông dân và quý tộc từ nhiều nền văn hóa tụ tập quanh các quầy đồ ăn lạ, không khí nồng nặc hương thơm mà ta chưa từng tưởng tượng.\n\nMũi ta bị thu hút bởi một quầy đồ ăn hạ hèn, chỉ ước mơ được thưởng thức. Ta bị kéo ra khỏi cơn mê bởi cái túm áo của [pompous_courtier.GetName].\n\n"Đừng lãng phí vị giác với thứ đồ này, [ROOT.Char.Custom('FormOfAddressForLiege')]. [ROOT.Char.Custom('GetLocalStreetFoodPlural')|U] là dành cho nông dân, chúng ta có thực phẩm tinh túy hơn ở nhà.""
  travel_events.4019.a:0 "Ta là [ROOT.Char.GetTitleAsNameNoTooltip] và ta muốn [ROOT.Char.Custom('GetLocalStreetFood')] của mình!"
  travel.good_food:0 "Đồ ăn thật tuyệt vời"
  travel.bad_food:0 "Đồ ăn thật kinh khủng"
  travel.food_poisoning:0 "Ngài bị ngộ độc thực phẩm"
  travel_events.4019.b:0 "Không thể tin được ta suýt ăn thứ rác này!"
  travel_events.4019.c:0 "Có lẽ ta có thể xin công thức!"

  travel_events.4020.t:1 "$travel_danger_prefix$ [ROOT.Char.GetFirstNameNoTooltip], Kẻ Ngoại Nhập"
  travel_events.4020.desc:0 "Người dân [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetName] nổi tiếng là tín đồ sùng đạo [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdjective] và không ưa kẻ không tin. Dù vậy, [ROOT.Char.GetCurrentLocation.GetName] nằm trên lộ trình, nên ta phải đi qua.\n\nNgay lập tức, ánh mắt báo thù của dân làng nhắm vào chúng ta như [ROOT.Char.Custom('GetAnimalType')] rình mồi. Chưa kịp phản ứng, [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PriestNeuter] dẫn một đám cuồng tín tấn công, la hét về "tín ngưỡng dị giáo" của chúng ta và yêu cầu chuộc lỗi khi đi qua "vùng đất thánh"."
  travel_events.4020.a:0 "Ngươi ngu ngốc [strong_believer_scope.GetWomanMan], chính #EMP ngươi#! mới là dị giáo!"
  travel_events.4020.b:0 "Dễ hơn nếu chúng ta cứ trả tiền."
  travel_events.4020.c:0 "Đốt sạch lũ điên này."

  travel_events.4021.t:0 "Bàn thờ của [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]"
  travel_events.4021.desc.intro:1 "Ta được cảnh báo rằng [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdherentNamePlural] thực hành hiến tế người, nhưng chưa bao giờ tưởng tượng sẽ chứng kiến một nghi lễ như vậy. Trên một bàn đá, ta thấy [sacrificed_person_scope.GetWomanMan] bị cởi trần, buộc chặt bằng dây thừng.\n\n"
  travel_events.4021.desc.mid.sadist:0 "Thật may mắn khi được chứng kiến sự tàn bạo thiêng liêng này tận mắt. [sacrificed_person_scope.GetSheHe|U] quằn quại đầy thích thú, ta tiếc rằng không thể tự cắm dao vào tim [sacrificed_person_scope.GetHerHis] và dâng [sacrificed_person_scope.GetHerHim] cho [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]!\n\n"
  travel_events.4021.desc.mid:1 "Ta chỉ đơn giản là không thể tin nổi vào những gì mình đang chứng kiến. [sacrificed_person_scope.GetSheHe|U] co giật dữ dội theo từng hơi thở dồn dập, đôi mắt rớm máu của [sacrificed_person_scope.GetHerHis] đang van nài ta can thiệp.\n\n"
  travel_events.4021.desc.outro.cannibal:0 "Ta chỉ hy vọng được thưởng thức thịt [sacrificed_person_scope.GetHerHis] sau khi mọi chuyện kết thúc."
  travel_events.4021.desc.outro.sadist:0 "Ta nhìn hân hoan, mắt dán vào con dao khi nó dâng [sacrificed_person_scope.GetHerHim] vào hư vô."
  travel_events.4021.desc.outro:0 "Ta nhìn bất lực, mong dừng dao và trì hoãn hành trình của [sacrificed_person_scope.GetHerHis] vào hư vô."
  travel_events.4021.a:0 "Ta chỉ có thể quay đi."
  travel_events.4021.a.sadist:0 "Ta sẽ không bỏ lỡ khoảnh khắc nào!"
  travel_events.4021.b:0 "Có lẽ ta có thể mua tự do cho kẻ tội đồ này!"
  travel_events.4021.c:0 "Dừng lại! Hãy lấy [rival_to_sacrifice.GetNameNoTooltip] thay!"

  travel_events.4022.t:0 "Cây Thánh"
  travel_events.4022.desc:1 "Nghe nói ở [ROOT.Char.GetCurrentLocation.GetName], thiên nhiên được tôn kính như sự mở rộng của ý muốn [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PantheonTerm].\n\nChúng ta thấy người dân trang trí một cây cổ thụ với vật liệu và trang sức quý, như thể đang tỏ lòng tôn kính. Nhiều người trong đoàn chỉ đứng quan sát, nhưng ta cảm thấy cần phải làm điều gì đó hơn..."
  travel_events.4022.a:0 "Thật hấp dẫn."
  travel_events.4022.a.not_so_different:0 "Chúng ta không khác nhau là mấy."
  travel_events.4022.a.ignore_heretics:0 "Ta sẽ không dính líu vào chuyện dị giáo."
  travel_events.4022.b:0 "Hãy đốt cây đi!"
  travel.burn_the_tree:0 "Cây đã bị thiêu"
  travel.beaten_by_peasants:0 "Ngài bị dân tín đồ đánh bật lại"
  travel_events.4022.c:0 "Ta nên tham gia lễ hội!"
  cultural_acceptance_participated_in_festival:0 "Đã tham gia lễ hội"

  travel_events.4023.t:2 "Những [prester_john_scope.GetFaith.GetReligion.GetAdherentNamePluralNoTooltip|U] Lạc Lối"
  travel_events.4023.desc.intro:0 "Có những truyền thuyết về một [prester_john_scope.GetPrimaryTitle.GetTierAsNameNoTooltip] [ROOT.Char.GetFaith.GetReligion.GetAdjective] xa xôi được bao quanh bởi những kẻ dị giáo và vô thần. Một ngày nào đó, vị [prester_john_scope.GetTitleAsNameNoTooltip] huyền thoại của [prester_john_scope.GetPrimaryTitle.GetTierAsNameNoTooltip] này sẽ chiêu binh mãi mã để chống lại những kẻ tà ác và trừng phạt chúng bằng cơn thịnh nộ thiêng liêng!\n\n"
  travel_events.4023.desc.mid.john:0 "Truyền thuyết gọi ông là 'Prester John', và"
  travel_events.4023.desc.mid.joan:0 "Truyền thuyết gọi ông là 'Prester John', nhưng có lẽ họ muốn nói 'Prester Joan'! Dù sao đi nữa,"
  travel_events.4023.desc.mid:0 "Nhân vật huyền thoại này vẫn chưa có tên, nhưng"
  travel_events.4023.desc.outro:0 "khi ta dành nhiều thời gian ở [prester_john_scope.GetPrimaryTitle.GetNameNoTierNoTooltip], ta càng tin chắc rằng [prester_john_scope.GetName] chính là [prester_john_scope.GetTitleAsNameNoTooltip] huyền thoại này!"
  travel_events.4023.a:0 "Ta phải gặp [prester_john_scope.GetHerHim] ngay lập tức!"
  travel_events.4023.b:0 "[prester_john_scope.GetSheHe|U] cần phải được nhắc nhở về nghĩa vụ của [prester_john_scope.GetHerHis] trong việc tiễu trừ dị giáo!"
  travel_events.4023.c:0 "[prester_john_scope.GetFaith.GetNameNoTooltip] chỉ là sự biến chất của [ROOT.Char.GetFaith.GetNameNoTooltip]!"
  travel_events.4023.d:0 "Thật hấp dẫn. Chuyển sang chuyện khác."

  travel_events.4024.t:0 "Một [ROOT.Char.GetFaith.GetReligion.GetAdherentNameNoTooltip|U] Ngoại Quốc"
  travel_events.4024.desc.intro:0 "Ta nhận được một bức thư bằng ngôn ngữ lạ từ người tự xưng là [foreign_visitor.GetTitleAsNameNoTooltip] xa xôi, quê hương của '[foreign_visitor.GetFaith.GetAdherentNamePluralNoTooltip]', một nhóm [ROOT.Char.GetFaith.GetReligion.GetAdherentNameNoTooltip] ở phương xa."
  travel_events.4024.desc.mid:0 "\n\n[foreign_visitor.GetSheHe|U] khẳng định ta là nhân vật huyền thoại đối với những [foreign_visitor.GetFaith.GetAdherentNamePluralNoTooltip] này, một [ROOT.Char.GetFaith.GetReligion.GetAdjective] [ROOT.Char.GetTitleAsNameNoTooltip|U] thực thụ bị bao vây bởi [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')]."
  travel_events.4024.a:0 "[foreign_visitor.GetSheHe|U] cũng sẽ trở thành huyền thoại đối với chúng ta!"
  travel_events.4024.b:0 "[foreign_visitor.GetFaith.GetNameNoTooltip]? Nghe như dị giáo!"
  travel_events.4024.c:0 "Có lẽ [chaplain_scope.GetNameNoTooltip] có thể dạy họ về [ROOT.Char.GetFaith.GetName]!"
  travel.gift_from_john:0 "Một món quà từ [prester_john_scope.GetName]"
  travel_events.4024.d:0 "Thật dễ chịu..."
  travel.turned_away_from_john:0 "Ngài bị từ chối"

  travel_events.4025.t:0 "Nhận Kiếm Thánh"
  travel_events.4025.desc.mid:1 "[foreign_visitor.GetSheHe|U] nói rằng ta là nhân vật huyền thoại định cầm kiếm chống lại kẻ không tin nhân danh [ROOT.Char.GetFaith.HighGodNamePossessive] và đưa lũ tội đồ đến [ROOT.Char.GetFaith.NegativeAfterLife] nơi chúng thuộc về.\n\nTa có nhiều láng giềng  theo đủ loại đức tin, liệu [ROOT.Char.GetFaith.HighGodName] thật sự muốn ta gây bạo lực nhân danh [ROOT.Char.GetFaith.HighGodHerHis|U] chăng?"
  travel_events.4025.a:1 "Tất nhiên [ROOT.Char.GetFaith.HighGodNameSheHe|U] sẽ muốn!"
  travel_events.4025.b:0 "Có nhiều con đường đến [ROOT.Char.GetFaith.PositiveAfterLife]"
  travel.visitor_rejected_me:0 "[prester_john_scope.GetName] từ chối chiến đấu chống dị giáo"
  travel_events.4025.different_religion_neighbors_and_vassals:0 "Mọi [vassal|E] và [ruler|E] láng giềng  theo [religion|E] khác"

  travel_events.4026.t:0 "Những Người Ngài Từ Xa"
  travel_events.4026.desc:0 "[prester_john_scope.GetName] đã hồi âm bức thư của ta và bày tỏ lòng ngưỡng mộ sâu sắc của [prester_john_scope.GetHerHis] dành cho ta cùng đức tin [ROOT.Char.GetFaith.GetAdjective].\n\n[prester_john_scope.GetSheHe|U] nói thêm rằng nếu [ROOT.Char.GetFaith.HighGodName] an bài, chúng ta có thể sẽ tái ngộ, còn hiện tại, đôi bên nên giữ mối thâm giao ngưỡng mộ nhau từ phương xa."
  travel_events.4026.a:0 "Nghe thật tuyệt vời!"
  travel.became_friends_with_visitor:0 "[foreign_visitor.GetName] đã trở thành  Bạn của bạn!"
  travel.visitor_rejected_friendship:0 "[foreign_visitor.GetName] từ chối làm Ngài"
  travel_events.4026.b:0 "Tình bạn từ xa không thực sự phù hợp với ta."

  travel_events.4027.t:0 "Thăm Dị Giáo"
  travel_events.4027.desc:0 "Một đoàn lữ hành gồm các tín đồ [foreign_visitor.GetFaith.GetAdherentNamePlural] đang băng qua vùng [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] và hôm nay, một [foreign_visitor.GetTitleAsNameNoTooltip|U] là tín đồ [foreign_visitor.GetFaith.GetAdherentNameNoTooltip] lỗi lạc trong hàng ngũ của họ đã cáo buộc ta phạm tội dị giáo!\n\n[foreign_visitor.GetSheHe|U] tuyên bố rằng ta không chỉ đang bóp méo ý nguyện của [ROOT.Char.GetFaith.HighGodNamePossessive], mà toàn bộ đức tin [ROOT.Char.GetFaith.GetAdjective] chẳng qua chỉ là một sự bắt chước kệch cỡm đầy xấu xí của đức tin [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]!"
  travel_events.4027.a:0 "Kẻ giáo điều kiêu ngạo đó! Chúng ta sẽ xem ai nhạo báng ai!"

  travel_events.4028.t:0 "Một Tảng Đá Rune"
  travel_events.4028.desc:1 "Vùng nông thôn [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] nổi tiếng với những tảng đá rune: những cột đá cao khắc ghi sự kiện huyền thoại và lịch sử.\n\nTrong chuyến đi, chúng ta gặp một tảng đá rune cực kỳ hoành tráng, trang trí với các hoa văn phức tạp và chắc chắn là một truyền thuyết bằng ngôn ngữ mà ta không hiểu.\n\nCó lẽ với thời gian và kiên nhẫn, ta có thể giải mã ý nghĩa..."
  travel_events.4028.a:0 "Ta sẽ thử!"
  travel.read_runestone:0 "Ngài đã đọc Tảng đá Rune!"
  travel.failed_to_read_runestone:0 "Ngài thất bại khi đọc Tảng đá Rune"
  travel_events.4028.b:0 "Biểu tượng ô uế này nên bị phá bỏ!"
  travel_events.4028.c:0 "Ta không có thời gian cho việc này."

  travel_events.4029.t:0 "Bù Nhìn Ma Quái của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
  travel_events.4029.desc.intro:0 "Rảo bước qua vùng nông thôn [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] không hề mang lại cảm giác yên bình thư thái như ta từng tưởng tượng. Bầu trời đen kịt những mây mù và những cánh đồng canh tác im ắng tới mức đáng sợ.\n\nCho đến khi chúng ta nghe thấy những tiếng rên rỉ đau đớn đến xé lòng vang lên từ tận sâu trong những cánh đồng. Khi chúng ta tiến lại gần hơn, chúng ta phát hiện ra một [brainless_character.GetWomanMan] bị treo trên một cây cột như thể [brainless_character.GetSheHe] là một bù nhìn đuổi chim.\n\n"
  travel_events.4029.desc.mid.christian:0 "[brainless_character.GetSheHe|U] chính là hình ảnh của sự chịu đựng kiểu Kitô, treo trên thập giá sân nhà [brainless_character.GetHerHis]."
  travel_events.4029.desc.mid:0 "Nhìn đôi môi khô khốc và làn da nhợt nhạt của [brainless_character.GetHerHis], rõ ràng là [brainless_character.GetSheHe] đã bị trói ở đây từ rất lâu rồi."
  travel_events.4029.desc.outro:0 "Một số người trong đoàn van xin ta cắt [brainless_character.GetHerHim] xuống, nhưng thật sự có phải chuyện của ta?"
  travel_events.4029.a:0 "Hãy thương xót sinh vật này!"
  travel_events.4029.b:0 "[brainless_character.GetSheHe|U] rõ ràng là tội phạm."
  travel_events.4029.c:0 "Bỏ mặc [brainless_character.GetHerHim]."

  travel_events.4030.t:0 "$travel_events.4029.t$"
  travel_events.4030.desc.intro:1 "Tên [brainless_character.GetWomanMan] phủ phục đầy đáng thương dưới chân ta, làm vấy máu lên nền đất bằng đôi bàn tay của [brainless_character.GetHerHis]. Chẳng mấy chốc, các thành viên trong đoàn tùy tùng của ta đã đỡ [brainless_character.GetHerHim] đứng dậy trên đôi chân run rẩy của [brainless_character.GetHerHis], khẩn thiết muốn nghe xem làm thế nào mà [brainless_character.GetSheHe] lại rơi vào nông nỗi này.\n\n"
  travel_events.4030.desc.mid.lowborn:1 ""Ồ, mẹ ơi, là con đây. Bà nói con chậm chạp và vô dụng, nên sẽ làm bù nhìn tốt hơn làm công nông, nên bà trói con lại. Con nghĩ sẽ ổn thôi, nhưng đó là cực hình.""
  travel_events.4030.desc.mid.noble:1 ""Ồ, con chỉ đến thu thuế. Nông dân nói vàng chôn ở đây, và trước khi biết, họ kéo con và treo như bù nhìn!""
  travel_events.4030.desc.outro:0 "\n\nTrí tuệ rõ ràng không phải điểm mạnh của [brainless_character.GetHerHis], nhưng [brainless_character.GetSheHe] vẫn đưa ta một ít tiền công cho sự giúp đỡ."
  travel_events.4030.a:0 "[brainless_character.GetSheHe|U] rõ ràng đang gặp nguy hiểm, đi cùng ta!"
  travel_events.4030.b:0 "Thưởng tốt cho việc tốt."
  travel_events.4030.c:0 "Ta không cần phần thưởng."

  travel_events.4031.t:0 "Kỵ Sĩ Kim Loại [heartless_knight_scope.GetWomanMan|U]"
  travel_events.4031.desc.intro:1 "Thật vậy, đi dạo qua [ROOT.Char.GetCurrentLocation.GetName] là món quà của [ROOT.Char.GetFaith.CreatorName]. Sự yên bình nơi này bị phá vỡ đột ngột bởi tiếng grừ giận dữ và kêu leng keng của giáp trụ!\n\n"Nghe này! Giải thoát ta khỏi chiếc tù kim loại này! Ngựa tớ bực mình vì cách ta cư xử, còn gọi ta là 'vô tâm' và bỏ mặc tớ!"\n\n"
  travel_events.4031.desc.mid.callous:0 "Ta cố nín cười, nhưng hình ảnh kẻ ngốc này lê lết khắp nông thôn thật quá hài hước."
  travel_events.4031.desc.mid:0 "Bất kể tên [heartless_knight_scope.GetWomanMan] kỳ dị này đã phạm phải tội tình gì, thì điều đó cũng không thể đủ để ngụy biện cho việc bị giam hãm vĩnh viễn trong bộ giáp của [heartless_knight_scope.GetHerHis]."
  travel_events.4031.desc.outro:0 "Ta có thể nhờ ai đó giúp [heartless_knight_scope.GetHerHim], nhưng thật sự có đáng không?"
  travel_events.4031.a:0 "Hãy tháo giáp, có giá cả."
  travel_events.4031.b:0 "Ban ban cho [heartless_knight_scope.GetHerHim] những cận vệ trung thành, để đổi lấy lòng trung thành của [heartless_knight_scope.GetHerHis]."
  travel_events.4031.c:0 "Ta để [heartless_knight_scope.GetHerHim] với số phận của [heartless_knight_scope.GetHerHis]."

  travel_events.4032.t:2 "Cuộc Vật Lộn Với [ROOT.Char.Custom('GetAnimalType')|U]"
  travel_events.4032.desc:2 "Cuộc hành trình của chúng ta bị gián đoạn một cách dữ dội bởi âm thanh xé thịt và hàm răng nghiến chặt, cùng tiếng kêu cứu tuyệt vọng của một [cowardly_knight_scope.GetWomanMan] sắp đối mặt với kết cục của [cowardly_knight_scope.GetHerHis]! Âm thanh này kinh hoàng đến mức chắc chắn nó phải đến từ sâu thẳm của [ROOT.Char.GetFaith.NegativeAfterLife]!\n\nKhi cố gắng truy tìm nguồn gốc, chúng ta phát hiện ra một $knight_culture_player_no_tooltip_lowercase$ tuyệt vọng đang vật lộn với một [ROOT.Char.Custom('GetAnimalType')] hung dữ! Lưỡi kiếm của [cowardly_knight_scope.GetHerHis|U] bị kẹt giữa hàm răng của con quái thú, nhưng lực nắm của [cowardly_knight_scope.GetHerHis] đã bắt đầu yếu đi."
  travel_events.4032.a:1 "Người [cowardly_knight_scope.GetWomanMan] này xứng đáng được giúp!"
  travel.beat_back_lion:1 "Ngài đã đánh lui [ROOT.Char.Custom('GetAnimalType')]"
  travel.mauled_by_animal:1 "Ngài bị [ROOT.Char.Custom('GetAnimalType')] tấn công"
  travel_events.4032.b:1 "Giúp [cowardly_knight_scope.GetHerHim], [entourage_helper.GetFirstNameNoTooltip]!"
  travel_events.4032.c:0 "Ta không liều mạng vì chuyện này."
 
  travel_events.4033.t:0 "[witch_scope.Custom('MagicUserTerm')|U] của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
  travel_events.4033.desc.intro:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip] là vùng đất có những phong tục kỳ lạ và khó hiểu đối với ta. Những thực hành của đức tin [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdjective] thật khác thường và không thể tưởng tượng được so với [ROOT.Char.GetFaith.GetName], và không đâu điều đó rõ ràng hơn thái độ của họ đối với việc thực hành phép thuật.\n\nNgay giữa thị trấn, có một [witch_scope.GetWomanMan] đang tụng thần chú và ban phước như thể [witch_scope.GetSheHe] là một [ROOT.Char.GetFaith.PriestNeuter]!"
  travel_events.4033.desc.mid.zealous:0 "Chỉ nhìn thấy sự dị giáo suy đồi này cũng đủ khiến ta buồn nôn và ta cảm thấy bàn tay thiêu phù thủy của mình run lên vì giận dữ."
  travel_events.4033.desc.mid:0 "Đối với ta thì thật kỳ lạ, nhưng người dân lại tỏ ra vô cùng phấn khởi khi ở trước mặt [witch_scope.GetHerHis]."
  travel_events.4033.a:0 "Họ phải hiểu rằng [witch_scope.Custom('MagicPracticeTerm')] là tội lỗi."
  travel_events.4033.b:0 "Ta còn nhiều điều phải học, hãy dạy ta!"
  travel_events.4033.c:0 "Chuyện này thực sự không liên quan đến ta."
  travel_events.4033.d:0 "[witch_scope.Custom('MagicPracticeTerm')|U]! [witch_scope.GetSheHe|U] sẽ sám hối, nếu không [witch_scope.GetSheHe] sẽ bị thiêu!"
  travel.burned_witch:0 "Ngài đã bắt và thiêu sống [witch_scope.Custom('MagicUserTerm')]"
  travel.beaten_by_locals:0 "Ngài bị người dân địa phương ngăn lại"
 
  travel_events.4034.t:0 "Tro Tàn Thành Báu Vật"
  travel_events.4034.desc.intro:0 "Tên [witch_scope.Custom('MagicUserTerm')] độc ác của vùng [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] đã bị thiêu sống một cách đích đáng vì những tội ác của [witch_scope.GetHerHis] chống lại [ROOT.Char.GetFaith.HighGodName], và khi khói tan, ta thấy tên [witch_scope.GetWomanMan] [witch_scope.Custom2('InsultAdjective', ROOT.Char)] này đã để lại thứ gì đó.\n\n"
  travel_events.4034.desc.mid.bones:0 "Chôn trong đống tro là xương của [witch_scope.GetHerHis], được bảo tồn hoàn hảo bất chấp ngọn lửa dữ dội. Không nghi ngờ gì, đây hẳn là một hành động ma thuật ghê tởm cuối cùng."
  travel_events.4034.desc.mid:0 "Lấp lánh trong tro là một vật phẩm tuyệt vời, kỳ diệu thoát khỏi ngọn lửa dữ dội. Có lẽ đây là món quà từ [ROOT.Char.GetFaith.HighGodName] cho sự phục vụ của ta, hoặc là hành động ma thuật cuối cùng của mụ phù thủy độc ác."
  travel_events.4034.desc.outro:0 "Vật phẩm được lấy ra khỏi tro và được một thành viên trong đoàn của ta làm sạch, để rồi thuộc về ta mãi mãi."
  travel_events.4034.a:0 "Một bổ sung tuyệt vời cho bộ sưu tập của ta."

  travel_events.4035.t:1 "Không Còn Ở [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] Nữa"
  travel_events.4035.desc.intro:1 "Là một Ta tớ trung thành của [ROOT.Char.GetFaith.WitchGodName], việc du hành đồng nghĩa với thực hiện các nghi thức và thần chú để bảo vệ đoàn của ta khỏi linh hồn tà ác.\n\nỞ đây tại [ROOT.Char.GetCurrentLocation.GetNameNoTooltip],"
  travel_events.4035.desc.mid.zealous:1 "những kẻ dị giáo đê tiện"
  travel_events.4035.desc.mid:1 "người dân"
  travel_events.4035.desc.outro:1 "tin rằng mọi phép thuật và phép màu không do giáo sĩ của họ thực hiện đều là phù thủy.\n\nTheo đó, [zealous_priest_scope.GetFaith.PriestNeuter] địa phương giờ lao đến đoàn của ta như thú dữ, xóa bỏ các biểu tượng bảo vệ của ta và gào thét về cái ác bị cho là từ cách làm của ta."
  travel_events.4035.a:1 "Có lẽ [zealous_priest_scope.GetSheHe] sẽ nghe lý lẽ?"
  travel_events.4035.b:0 "Ta sám hối vì những việc làm tà ác!"
  travel_events.4035.c:0 "Chạy đi!"
  travel_events.4035.d:0 "Ta sẽ chiến đấu để thoát khỏi đây!"
  travel.beat_zealot:0 "Ngài đã đánh bại đám đông cuồng tín"

  travel_events.4036.t:0 "Những Người Buôn Lữ Hành [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetNameNoTooltip]"
  travel_events.4036.desc:1 "Khi chúng ta men theo rìa [ROOT.Char.GetCurrentLocation.GetCounty.GetName], ta thấy một đoàn lạc đà buôn bán ở phía xa và sớm gặp người lãnh đạo kỳ lạ của họ.\n\n"Chào buổi tối, người Ngài đáng kính. Lại đây! Lại đây! Ta hứa với ngài rằng những gì ta có trong quầy hàng, giống như chính [kingdom_scope.GetBaseNameNoTierNoTooltip], đều hơn cả vẻ ngoài của chúng," [merchant_character_scope.GetSheHe] nói, trưng ra vô số món đồ lấp lánh trước mắt ta."
  travel_events.4036.a:0 "Ta sẽ trả bất cứ giá nào!"
  travel_events.4036.b:0 "Ta sẽ trộm nó!"
  travel_events.4036.d:0 "Có lẽ chúng ta có thể thương lượng."
  travel_events.4036.c:0 "Ta không hứng thú với mấy món đồ lặt vặt [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetNameNoTooltip]."
 
  travel_events.4037.t:0 "[ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] và [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetNameNoTooltip]"
  travel_events.4037.desc:0 "Ta từng nghe nói rằng người dân ở [ROOT.Char.GetCurrentLocation.GetCounty.GetName] thực hành [ROOT.Char.GetFaith.GetReligion.GetName] kết hợp với tín ngưỡng [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdjective] của riêng họ, và giờ khi ở đây, ta có thể thấy sự đan xen tôn giáo đó ở khắp mọi nơi.\n\nMột tá điền kỳ dị và nhiệt thành tự gọi [fanboy_character_scope.GetHerselfHimself] là [fanboy_character_scope.GetFirstName] hào hứng tiếp cận đoàn tùy tùng của ta và bắt đầu nghiên cứu các biểu tượng tôn giáo của chúng ta một cách đầy hăng hái.\n\n"Nhân danh [fanboy_character_scope.GetFaith.HighGodName], một nhóm tín đồ [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] lại ở ngay nơi này sao! Xin hãy cho thảo dân biết, thưa [ROOT.Char.Custom('FormOfAddressForLiege')], ngài có thể dạy cho chúng tôi cách thờ phụng theo lối [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] không?""
  travel_events.4037.a:0 "Ta sẽ dạy họ!"
  travel.good_cermon:0 "Ngài đã giảng một bài giảng hay"
  travel.bad_cermon:0 "Ngài đã giảng một bài giảng tệ"
  travel_events.4037.b:0 "Ta quan tâm hơn đến việc nghe về [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetNameNoTooltip]."
  travel_events.4037.c:0 "Biến đi, [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')]!"

  travel_events.4038.t:0 "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdherentNamePluralNoTooltip] Giữa Chúng Ta"
  travel_events.4038.desc:0 "Trong đức tin [ROOT.Char.GetFaith.GetAdjective], chúng ta giữ các nghi thức và niềm tin riêng, nhưng vẫn đặt [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetReligion.GetName] lên trên mọi tôn giáo khác và cảm thấy có sự gắn bó với niềm tin của họ.\n\nViệc [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] thực hành [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetReligion.GetNameNoTooltip] cùng với việc thờ phụng [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] truyền thống là khá phổ biến, và giờ khi ta ở [ROOT.Char.GetCurrentLocation.GetCounty.GetName], ta có cơ hội tham dự một buổi giảng và tìm hiểu về đức tin [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdjective]."
  travel_events.4038.a:0 "Ta nhất định phải tham dự!"
  travel_events.4038.b:0 "Có lẽ ta có thể khiến họ quan tâm đến cách của chúng ta!"
  travel_events.4038.c:0 "Ta không hứng thú."

  travel_events.4039.t:0 "Lòng Hiếu Khách Một Ngày"
  travel_events.4039.desc:0 "Hành trình dài và mệt mỏi, chân ta đau đến mức tổ tiên chắc cũng cảm nhận được. Khi ta cảm thấy sắp gục xuống vì kiệt sức, ta cảm thấy thứ gì đó nặng trĩu trên cổ!\n\nChẳng bao lâu, ta được mặc từ đầu đến chân trong trang phục truyền thống [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetName], và đường phố tràn ngập niềm vui! Mọi gia chủ đều mời ta vào nghỉ ngơi. Chỉ cần một lát là ta có thể hồi phục sức lực, và ta sẽ được chào đón như vị khách danh dự.\n\nLòng hiếu khách [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetNameNoTooltip] là huyền thoại, liệu ta có thể #EMP không#! tự mình trải nghiệm?"
  travel_events.4039.a:0 "Có lẽ chỉ nghỉ một lát..."
  travel_events.4039.b:0 "Ta phải tiếp tục!"
 
  travel_events.4040.t:0 "Một Sự Say Mê Văn Hóa"
  travel_events.4040.desc:1 "Kể từ khi vào [ROOT.Char.GetCurrentLocation.GetCounty.GetName], ta được đối xử như một con vật lạ trong khu vườn kỳ diệu. Người dân nhìn ta kinh ngạc chỉ vì cách ta nói chuyện và cư xử.\n\nKhi chúng ta đi qua, một [fanboy_character_scope.GetWomanMan] nhiệt tình tiến đến và dường như nói được [ROOT.Char.GetCulture.GetLanguage.GetName].\n\n"Trời ơi, vậy là thật! Một [ROOT.Char.GetCulture.GetName] [ROOT.Char.GetTitleAsNameNoTooltip] ở nơi này! Ta đã ngưỡng mộ phong tục [ROOT.Char.GetCulture.GetNameNoTooltip] từ lâu, thậm chí còn học [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]! Thật vinh dự!""
  travel_events.4040.a:0 "Vinh dự là của ngươi."
  travel_events.4040.b:0 "Hãy dạy ta về #EMP dân tộc của ngươi#!."
