  travel_events.1005.a.tt.success:0 "Trưởng đoàn Lữ hành của Ngài đã cứu được báu vật."
  travel_events.1005.a.tt.failure:0 "Trưởng đoàn Lữ hành của Ngài đã chết khi cố cứu báu vật."

  travel_events.1010.t:1 "[GetCourtPositionType('travel_leader_court_position').GetNameNoTooltip()]"
  travel_events.1010.desc:0 "Theo yêu cầu của ta, các cận thần đã chuẩn bị hai lựa chọn để ta cân nhắc cho vai trò Trưởng đoàn Lữ hành. [great_travel_leader_option.GetName] được cho là người giàu kinh nghiệm hơn trong hai người, nhưng dĩ nhiên [good_travel_leader_option.GetName] thì rẻ hơn. "
  travel_events.1010.a:1 "[great_travel_leader_option.GetNameNoTooltip] là một lựa chọn tuyệt vời."
  travel_events.1010.b:1 "[good_travel_leader_option.GetNameNoTooltip] cũng được."
  travel_events.1010.c:0 "Không lựa chọn nào trong số này đủ tốt."
  travel_events.1010.a.aptitude:0 "[great_travel_leader_option.GetFirstNamePossessiveNoTooltip] có [aptitude|E] là [great_travel_leader_option.GetCourtPositionAptitude( GetCourtPositionType( 'travel_leader_court_position' ) )]"
  travel_events.1010.b.aptitude:0 "[good_travel_leader_option.GetFirstNamePossessiveNoTooltip] có [aptitude|E] là [good_travel_leader_option.GetCourtPositionAptitude( GetCourtPositionType( 'travel_leader_court_position' ) )]"

  travel_events.1020.t:0 "Một [GetCourtPositionType('travel_leader_court_position').GetNameNoTooltip()] Mới"
  travel_events.1020.intro.prev_leader_dead:0 "[GetCourtPositionType('travel_leader_court_position').GetName()] cũ của ta là [old_travel_leader.GetFirstName] đã trút bỏ lớp xác phàm khi [old_travel_leader.GetSheHe] [old_travel_leader.GetDeathReason]. Việc chọn một người khác để dẫn dắt đoàn tùy tùng là điều cần thiết đối với ta.\n\n"
  travel_events.1020.intro.fallback:0 "Với vị trí [GetCourtPositionType('travel_leader_court_position').GetName()] hiện đang để trống, ta nhìn vào đoàn tùy tùng của mình. Liệu có ai có thể phục vụ tốt, ít nhất là cho đến khi ta trở về nhà và có thể tìm kiếm một sự thay thế thích hợp không?\n\n"
  travel_events.1020.desc.two_entourage_members:0 "Thực ra có hai người có thể dễ dàng thay thế vị trí của [old_travel_leader.GetFirstNamePossessiveNoTooltip]: hoặc [ROOT.Char.Custom2('RelationToMeShort',temp_caravan_master_option_1)] của ta là [temp_caravan_master_option_1.GetName], hoặc [ROOT.Char.Custom2('RelationToMeShort',temp_caravan_master_option_2)] của ta là [temp_caravan_master_option_2.GetName], cả hai đều có thể phục vụ ta trong lúc cấp bách."
  travel_events.1020.desc.one_entourage_member:0 "Chỉ có một người duy nhất trong đoàn tùy tùng của ta có thể gánh vác trọng trách này: [ROOT.Char.Custom2('RelationToMeShort',temp_caravan_master_option_1)] của ta, [temp_caravan_master_option_1.GetFirstName]. Tuy nhiên, một người dân địa phương tên là [temp_caravan_master_option_2.GetName] cũng đã đề xuất dịch vụ của [temp_caravan_master_option_2.GetHerHis]."
  travel_events.1020.desc.fallback:0 "Thật không may, ta chẳng tin nổi đám người đáng thương này có thể tự tìm đường về nhà từ chợ, chứ đừng nói là dẫn dắt chuyến hành trình tới [next_destination.GetName]. May mắn thay, hai người địa phương đã đề nghị phục vụ."
  travel_events.1020.a:0 "Ta sẽ chọn [temp_caravan_master_option_1.GetFirstNameNoTooltip]."
  travel_events.1020.b:0 "[temp_caravan_master_option_2.GetFirstNameNoTooltip|U] sẽ làm tốt thôi."
  travel_events.1020.a.aptitude:0 "[temp_caravan_master_option_1.GetFirstNamePossessiveNoTooltip] có [aptitude|E] là [temp_caravan_master_option_1.GetCourtPositionAptitude( GetCourtPositionType( 'travel_leader_court_position' ) )]"
  travel_events.1020.b.aptitude:0 "[temp_caravan_master_option_2.GetFirstNamePossessiveNoTooltip] có [aptitude|E] là [temp_caravan_master_option_2.GetCourtPositionAptitude( GetCourtPositionType( 'travel_leader_court_position' ) )]"

  travel_events.2200.t:0 "Một Trận Đấu Tay Đôi Được Yêu Cầu"
  travel_events.2200.desc:0 "Một [local_knight.GetWomanMan] đầy uy thế đang đứng chắn con đường phía trước.\n\n"Ta là [local_knight.GetName] của [local_knight.GetCurrentLocation.GetNameNoTooltip]! Ta đã đánh bại hàng chục [ROOT.Char.GetWomenMen] trong chiến đấu! Và thật lòng mà nói, tất cả những trận đó đều quá nhàm chán. Vì vậy Ta đứng ở con đường này, tìm một người giỏi hơn mình, một người mà Ta có thể học hỏi.\n\nNếu ngài có thể đánh bại Ta trong chiến đấu, Ta sẽ trở thành một kẻ phục vụ trung thành và có giá trị. Vì thế, hôm nay, Ta yêu cầu được đấu công bằng với một người trong số các ngài!"" 
  travel_events.2200.a:0 "Ta không hứng thú với ngươi hay một trận đấu công bằng."
  travel_events.2200.a.desc:0 "Cả đoàn tùy tùng của Ngài giẫm nát [local_knight.GetName]"
  travel_events.2200.a.success.tt:0 "[local_knight.GetName] đã nhanh chóng bị đoàn tùy tùng của Ngài giẫm nát"
  travel_events.2200.a.success:0 "Xung phong thành công!"
  travel_events.2200.a.failure.tt:0 "[adult_victim.GetName] đã vô tình bị đoàn tùy tùng của Ngài giẫm phải"
  travel_events.2200.a.failure:0 "Xung phong gần như thành công!"
  travel_events.2200.b:0 "Sau khi ta thắng, ngươi có thể sẽ kém giá trị hơn!"
  travel_events.2200.b.success:0 "Ngài thắng trận đấu!"
  travel_events.2200.b.failure:0 "[local_knight.GetName] thắng trận!"
  travel_events.2200.c:0 "[travel_duel_champion.GetTitledFirstNameNoTooltip] sẽ cho ngươi thấy cách làm."
  travel_events.2200.c.success:0 "[travel_duel_champion.GetName] thắng trận!"
  travel_events.2200.c.failure:0 "[local_knight.GetNameNoTooltip] thắng trận!"

  travel_events.4050.t: "Gần Về Nhà"
  travel_events.4050.interpreter: "Ta đã cho một nhóm nhân vật đáng chú ý người [foreign_county.GetAdjective] một buổi yết kiến ngẫu hứng bên đường, vài khoảnh khắc để bày tỏ sự kính trọng.\n\nTa thấy mình bị phân tâm bởi [friendly_child.GetName]: [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friendly_child'))] trẻ tuổi của ta đang làm phiên dịch cho vài người Ngài đồng hành, chuyển đổi giữa các ngôn ngữ và phép tắc một cách tinh tế và dễ dàng, tạo nên một cuộc trao đổi sôi nổi.\n\nTheo những gì ta hiểu, [friendly_child.Custom('GirlBoy')] đang lớn lên thành một sứ giả bẩm sinh."
  travel_events.4050.religious: "Ta đã cho một nhóm [friendly_child.GetFaith.AltPriestTermPlural] người [foreign_county.GetAdjective] một buổi yết kiến ngẫu hứng bên đường, vài khoảnh khắc để chia sẻ phúc lành và trí tuệ của đức tin [friendly_child.GetFaith.GetAdjective].\n\nTa thấy mình bị phân tâm bởi [friendly_child.GetName], vì [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friendly_child'))] trẻ tuổi của ta đã tập hợp một nhóm tín đồ trẻ, và giữa họ đang giải thích một cách chín chắn về bản chất của đức tin chung.\n\nTheo những gì ta hiểu, việc được dạy cả giáo lý của ta lẫn của [friendly_child.GetHerHis] đã mang lại cho [friendly_child.Custom('GirlBoy')] một số hiểu biết sâu sắc."
  travel_events.4050.singing: "Ta đã cho vài địa chủ người [foreign_county.GetAdjective] một buổi yết kiến ngẫu hứng bên đường, vài khoảnh khắc để họ thể hiện phép tắc trong khi nhìn ta đầy lo lắng.\n\nTa thấy mình bị phân tâm bởi [friendly_child.GetName]: [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friendly_child'))] trẻ tuổi của ta đang rất vui vẻ, hát những bài ca quen thuộc, nhảy múa và ca ngợi các anh hùng xưa của [friendly_child.GetCulture.GetHeritage.GetName] cùng với vài thanh niên người [friendly_child.GetCulture.GetName].\n\nViệc sống trong triều đình của ta dường như chỉ càng làm sâu sắc thêm sự quan tâm của [friendly_child.Custom('GirlBoy')] đối với việc thực hành văn hóa của chính mình."

  travel_events.4050.a: "Một tài năng cần được nuôi dưỡng."

  travel_events.4050.b: "Ta nên chấm dứt chuyện này..."
  travel_events.4050.b.tt: "Đứa trẻ thuộc về triều đình của ta — thuộc về dân của ta."
  travel_events.4050.c.interpreter: "[friendly_child.Custom('GirlBoy')|U]! Lại đây kể chuyện cho chúng ta bằng [friendly_child.GetCulture.GetLanguage.GetNameNoTooltip]."
  travel_events.4050.c.religious: "[friendly_child.Custom('GirlBoy')|U]! Lại đây gây ấn tượng với những [friendly_child.GetFaith.GetAdherentNamePluralNoTooltip] này."
  travel_events.4050.c.singing: "[friendly_child.Custom('GirlBoy')|U]! Lại đây giải trí cho những người [friendly_child.GetCulture.GetCollectiveNounNoTooltip] này."
  travel_events.4050.c.tt: ""Hãy làm ta tự hào, [friendly_child.Custom('GetLassLad')]!""

  sponsored_emissaries_modifier: "Bảo Trợ Sứ Giả"
  sponsored_emissaries_modifier_desc: "Nhân vật này khuyến khích việc học ngôn ngữ và ngoại giao giữa các nền văn hóa."

  raised_other_faiths_mystic_modifier: "Nuôi Dưỡng Nhà Thần Bí Tín Ngưỡng Khác"
  raised_other_faiths_mystic_modifier_desc: "Nhân vật này đã nuôi dưỡng một tín đồ trẻ đáng chú ý của một tín ngưỡng khác."

  insisting_on_norms_modifier: "Khăng Khăng Giữ Chuẩn Mực"
  insisting_on_norms_modifier_desc: "Các cận thần bị giám sát chặt chẽ, mọi cách thức ngoại lai hoặc khác thường đều bị hạn chế."

  custom.every_same_culture_courtier: "Mọi [courtier|E] cùng [culture|E]"

  travel_events.5001.t: "Những Câu Chuyện Thì Thầm"
  travel_events.5001.desc: "Đây là lần thứ ba hôm nay ta nghe thấy một người địa phương lải nhải về một câu chuyện nào đó khi chúng ta đi ngang qua. [travelling_character.GetFirstName] thấy sự bối rối của ta.\n\n"Đó là một câu chuyện của vùng này, thưa [ROOT.Char.Custom('FormOfAddressForLiege')]. Người ta gọi nó là [potential_legend.GetName]." [travelling_character.GetSheHe|U] nói nhỏ.\n\nỪm. Nghe có vẻ khá thú vị..."
  travel_events.5001.a: "Ta sẽ theo đuổi câu chuyện này!"
  travel_events.5001.b: "Chắc chắn ta cũng sẽ nói về nó."
  travel_events.5001.b.flavor: "Ít nhất nó sẽ là một câu chuyện thú vị cho bất kỳ ai ta gặp trên đường!"
  travel_events.5001.c: "Thật vô nghĩa."
