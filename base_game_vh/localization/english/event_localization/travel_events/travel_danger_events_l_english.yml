  travel_danger_events.1012.t:0 "$travel_danger_prefix$ Quả Quyến Rũ"
  travel_danger_events.1012.desc:0 "Con đường dẫn chúng Ta đi qua những khu vực hiểm trở của [ROOT.Char.GetCurrentLocation.GetName]. Trong khi Ta quan sát các nguy hiểm phía trước, một bụi cây kêu xào xạc thu hút sự chú ý của Ta, có phải là một con thú hoang? Khi Ta chuẩn bị đối mặt, [poisonous_plant_eater.GetFirstName] nhảy ra khỏi bụi cây, tay cầm một loại thực vật.\n\n"Ngài làm Ta giật mình, [poisonous_plant_eater.GetFirstNameNoTooltip]! Dù sao đi nữa, để Ta xem Ngài cầm gì đây, có phải là một loại quả không?"
  travel_danger_events.1012.desc_food_taster:0 "$travel_danger_events.1012.desc$ Chúng ta nên hỏi [food_taster.GetFirstName] về nó."\n\n"Ta phải nói, đây là món ăn lạ và không có dấu hiệu nguy hiểm ngay lập tức, nhưng..." "Vậy là ăn được rồi chứ!" [poisonous_plant_eater.GetFirstNameNoTooltip] nhanh chóng ngắt lời."
  travel_danger_events.1012.desc_unknown:0 "$travel_danger_events.1012.desc$" Ta thốt lên.\n\n"Vâng! Nó trông và ngửi #EMP thật hấp dẫn#! Ta tự hỏi hương vị ra sao? Có lẽ Ta chỉ thử một chút?" [poisonous_plant_eater.GetSheHe] nói."
  travel_danger_events.1012.desc_again:0 "Một lần nữa chặng đường phía trước lại đầy rẫy hiểm nguy, nên để bảo đảm an toàn chúng ta đành phải nghỉ lại qua đêm. Trong lúc những người khác đang dựng trại, ta bắt gặp [poisonous_plant_eater.GetFirstName] đang hái một loại quả lạ khác.\n\n"Ta rất ngưỡng mộ sự hiếu kỳ của ngươi đấy, [poisonous_plant_eater.GetFirstNameNoTooltip]."\n\nTa mỉm cười, nhưng [poisonous_plant_eater.GetSheHe] lại nhìn ta với ánh mắt đầy tinh nghịch, rồi thốt lên:\n\n"Tôi xin lỗi, [poisonous_plant_eater.Custom2('RelationToMe', ROOT.Char)] của tôi, nhưng tôi không thể kiềm chế được bản thân!" khi [poisonous_plant_eater.GetSheHe] cố cắn ngập răng của [poisonous_plant_eater.GetHerHis] vào quả lạ."
  travel_danger_events.1012.a:0 ""Khoan đã, nếu nó độc thì sao?!""
  travel_danger_events.1012.a_again:0 ""Đừng nhét #EMP tất cả#! vào miệng!""
  travel_danger_events.1012.a.tt:0 "Ngài túm lấy cây và vứt đi"
  travel_danger_events.1012.regular_plant:0 "Rốt cuộc đó là cây vô hại"
  travel_danger_events.1012.touched_poisonous_plant:0 "Xuất hiện phát ban nơi cây chạm vào"
  travel_danger_events.1012.b:0 "Để [poisonous_plant_eater.GetFirstNameNoTooltip] ăn đi."
  travel_danger_events.1012.ate_poisonous_plant:0 "Gây đau bụng dữ dội"
  travel_danger_events.1012.ate_delicious_plant:0 "Hồi phục cơ thể và tinh thần"
  travel_danger_events.1012.c:0 ""Chỉ khi Ta được thử trước!""
  travel_danger_events.1012.c.tt:0 "Ngài lấy quả và ăn nó"
 
  travel_danger_events.1013.t:0 "$travel_danger_prefix$ Bỏ Trốn hay Lạc?"
  travel_danger_events.1013.desc:0 "Khi chúng Ta vừa vượt qua một con đường nguy hiểm ở [ROOT.Char.GetCurrentLocation.GetName], đột nhiên có cảm giác lạ là ai đó đang mất tích khiến Ta bận tâm. Ta không nhớ đã thấy [runaway_character.GetFirstName] cả ngày.\n\n"
  travel_danger_events.1013.desc_rival:0 "$travel_danger_events.1013.desc$Không phải Ta phiền, không phải nhìn mặt đối thủ cũng coi là một ngày tốt. Tuy nhiên, nó có thể làm những người khác sợ và không muốn đi xa hơn trên [ROOT.Char.GetCurrentLocation.Custom('TerrainTypeProvince')]."
  travel_danger_events.1013.desc_lover:0 "$travel_danger_events.1013.desc$Cùng lúc, người ta đồn rằng [runaway_character.GetSheHe] muốn gặp [current_location_holder.GetTitledFirstName]. Ta biết chúng Ta đi qua đất của [current_location_holder.GetHerHis], nhưng không hiểu tại sao [runaway_character.GetFirstNameNoTooltip] lại làm vậy? Ta đoán [runaway_character.GetSheHe] chỉ bị lạc đâu đó trong [ROOT.Char.GetCurrentLocation.Custom('TerrainTypeProvince')]!"
  travel_danger_events.1013.desc_knight:0 "$travel_danger_events.1013.desc$Hắn giữ đội hậu vệ khi chúng Ta vào tỉnh chiến tranh. Có lẽ không phải ý hay khi biết [runaway_character.GetHerHis] liều lĩnh, [runaway_character.GetSheHe] có thể đã nhắm tới tuyến đầu! Hoặc [runaway_character.GetSheHe] chỉ bị lạc đâu đó trong [ROOT.Char.GetCurrentLocation.Custom('TerrainTypeProvince')]?"
  travel_danger_events.1013.desc_child:0 "$travel_danger_events.1013.desc$Điều này đáng lo, [runaway_character.GetSheHe] vẫn chỉ là trẻ con! Nếu [runaway_character.GetSheHe] bị lạc đâu đó trong [ROOT.Char.GetCurrentLocation.Custom('TerrainTypeProvince')] trên đường đi? [runaway_character.GetSheHe|U] có lẽ cô đơn, và quan trọng hơn, đói!"
  travel_danger_events.1013.a:0 "Hãy tổ chức một đội tìm kiếm [runaway_character.GetHerHim]."
  travel_danger_events.1013.success:0 "Đội tìm kiếm đã tìm thấy [runaway_character.GetFirstNameNoTooltip]"
  travel_danger_events.1013.success_root:0 "Ngài tìm thấy [runaway_character.GetFirstNameNoTooltip]"
  travel_danger_events.1013.failure:0 "[runaway_character.GetFirstNameNoTooltip] không ở đâu cả"
  travel_danger_events.1013.failure_root:0 "Ngài lang thang vô định trên [ROOT.Char.GetCurrentLocation.Custom('TerrainTypeProvince')]"
  travel_danger_events.1013.runaway_joins:0 "[runaway_character.GetFirstNameNoTooltip] gia nhập triều đình của Ngài"
  travel_danger_events.1013.runaway_return:0 "Trở lại [entourage|E]"
  travel_danger_events.1013.b:0 "Ta sẽ tự tìm [runaway_character.GetHerHim]!"
  travel_danger_events.1013.c:0 "Ta không muốn rủi ro thêm người bị lạc."
  delayed_toast:0 "Ngài bị trì hoãn"
 
  travel_hired_foreign_guide:0 "Thuê Hướng Dẫn Viên Nước Ngoài"

  travel_danger_events.1020.t: "[ROOT.Char.GetCurrentLocation.Custom('TerrainTypeProvince')|U] của"
 #Horse gets startled, I fall off
 #Hearing the horse whinnying, I rush off
 #Horse is stuck, about to die
 #Whatever will I do, oh my, oh my?
  travel_danger_events.1020.t.wetlands: "Khốn Khổ"
  travel_danger_events.1020.t.floodplains: "Sợ Hãi"
  travel_danger_events.1020.t.jungle: "Nguy Hiểm"
  travel_danger_events.1020.t.taiga: "Kinh Hoàng"
  travel_danger_events.1020.desc.intro: "Chúng Ta đã lang thang nhiều ngày để đến đích, đoàn hộ tống mệt mỏi, và cả chiến mã hùng mạnh của Ta, [ROOT.Char.Custom('WarhorseStoryName')], cũng vậy. Khi Ta sắp xuống ngựa, điều gì đó khiến [ROOT.Char.Custom('HorseStoryMareStallion')] của Ta hoảng sợ, và [ROOT.Char.Custom('HorseStorySheHe')] lao đi một hướng ngẫu nhiên. Ta cố nắm chặt để giữ mạng sống trước khi bị ném xuống đất với một tiếng động lớn.\n\nKhi Ta từ từ đứng lên sau cú ngã, [ROOT.Char.Custom('WarhorseStoryName')] hí lên từ xa, và toàn bộ đoàn hộ tống chạy theo sát để xem chuyện gì đang xảy ra.\n\nNgựa của Ta đang chiến đấu để giữ mạng sống của [ROOT.Char.Custom('HorseStoryHerHis')]#!"
  travel_danger_events.1020.wetlands: "đầm lầy nuốt chửng [ROOT.Char.Custom('HorseStoryHerHim')], từng chút một."
  travel_danger_events.1020.floodplains: "băng qua dòng nước mà không thành công."
  travel_danger_events.1020.jungle: "cát tràn xuống hai bên thân [ROOT.Char.Custom('HorseStoryHerHis')], từ từ nhưng chắc chắn chìm vào hố cát."
  travel_danger_events.1020.taiga: "cố tìm lối thoát khỏi hố sụt — nỗ lực vô vọng."
  travel_danger_events.1020.a: ""Chiến đấu đi [ROOT.Char.Custom('WarhorseStoryName')]!""
  travel_danger_events.1020.a.success: "Ngài cứu được [ROOT.Char.Custom('WarhorseStoryName')]"
  travel_danger_events.1020.a.failure: "[ROOT.Char.Custom('WarhorseStoryName')] bị kéo xuống"
  travel_danger_events.1020.b: ""Đừng đứng đó, hãy #EMP làm gì đi!#!"""
  travel_danger_events.1020.b.success: "[horse_helper.GetFirstNameNoTooltip] cứu được [ROOT.Char.Custom('WarhorseStoryName')]"
  travel_danger_events.1020.b.failure: "Cả [horse_helper.GetFirstNameNoTooltip] và [ROOT.Char.Custom('WarhorseStoryName')] đều bị kéo xuống"
  travel_danger_events.1020.c: "Chúng ta không thể làm gì cả..."
