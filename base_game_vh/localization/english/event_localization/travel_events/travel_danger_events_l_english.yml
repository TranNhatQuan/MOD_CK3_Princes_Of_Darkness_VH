l_english:

# Travel Danger Event Prefix
  travel_danger_prefix:0 "Nguy Hiểm:"

#travel_danger_events.0001.t: "Bandits!"
#travel_danger_events.0001.desc: "You have encountered bandits because of low control!"
#travel_danger_events.0001.a: "Run"
#travel_danger_events.0001.b: "Fight"

# Hills Terrain
  travel_danger_events.1000.t:1 "$travel_danger_prefix$ Núi Cao Như Đồi Mole"
  travel_danger_events.1000.desc:0 "Con đường trở nên gập ghềnh trong vài giờ qua và mọi người bắt đầu mệt mỏi. Không thấy cuối của những ngọn đồi, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('travel_leader'))] [travel_leader.GetFirstName] tiến đến Ta và nói:\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], những con thú cưỡi của chúng ta không thể tiếp tục như thế này lâu nữa. Những con vật tội nghiệp cần nghỉ ngơi, nếu không sợ chúng sẽ kiệt sức! Chúng ta phải dừng lại để nghỉ!"\n\n[travel_leader.GetSheHe|U] biết rõ rằng điều này sẽ trì hoãn hành trình đến [destination.GetName]..."
  travel_danger_events.1000.a:0 "[travel_leader.GetSheHe|U] nói đúng. Nghỉ ngơi là khôn ngoan."
  travel_danger_events.1000.b:0 ""Ta không chấp nhận trì hoãn. Chúng ta tiến lên!""

  travel_danger_events.1001.t:0 "$travel_danger_events.1000.t$"
  travel_danger_events.1001.desc:0 "Ta thúc giục mọi người đi tiếp, mong đến [destination.GetName] đúng kế hoạch. Khi chúng Ta leo đến ngọn đồi cao nhất, Ta nghĩ khó khăn cuối cùng cũng kết thúc, thì...\n\n#EMP BÙM! ... BÙM, BÙM, BÙM!#!\n\nTa quay lại để nhìn nguồn tiếng động và há hốc mồm khi tất cả thú cưỡi của chúng Ta sụp xuống đất! Hóa ra [travel_leader.GetFirstName] đã đúng... những con vật tội nghiệp chỉ chịu đựng được đến mức này. Ta nên nghe lời khi còn cơ hội."
  travel_danger_events.1001.a:0 ""[travel_leader.GetFirstNameNoTooltip], đi đến thị trấn gần nhất và mua thú mới.""
  travel_danger_events.1001.b:0 ""Chúng ta đi bộ tiếp!""

  travel_danger_events.1002.t:1 "$travel_danger_prefix$ Dốc Trơn Trượt"
  travel_danger_events.1002.desc:0 "Khi đi qua [current_location.GetName], Ta ngắm nhìn quang cảnh tuyệt đẹp từ sườn núi. Khi Ta quay mắt trở lại đường đá phía trước, nhận ra chúng Ta đã bị nhóm côn đồ vây quanh! Một [bandit.GetWomanMan] đáng sợ, có lẽ là thủ lĩnh, đứng trước đoàn lữ hành.\n\n"Đi qua núi của Ta sẽ phải trả giá. Không quan tâm ngươi là ai, ai đi qua núi Ta cũng phải trả tiền.""
  travel_danger_events.1002.a:0 ""Hãy nói chuyện lý lẽ.""
  travel_danger_events.1002.a.success:0 "Ngài thuyết phục được bọn côn đồ"
  travel_danger_events.1002.a.success.desc:0 "Ngài và đoàn lữ hành đi qua hẻm núi một cách tự do"
  travel_danger_events.1002.a.failure:0 "Ngài không thuyết phục được bọn côn đồ"
  travel_danger_events.1002.a.failure.desc:0 "Ngài phải hối lộ bọn côn đồ để được đi qua"
  travel_danger_events.1002.b:0 ""Ta không dễ dàng đầu hàng. #EMP Chiến thôi!#!"""
  travel_danger_events.1002.b.success:1 "Ngài đánh bại bọn côn đồ"
  travel_danger_events.1002.b.success.desc:0 "$travel_danger_events.1002.a.success.desc$"
  travel_danger_events.1002.b.failure:1 "Bọn côn đồ đánh bại Ngài"
  travel_danger_events.1002.b.failure.desc:0 "$travel_danger_events.1002.a.failure.desc$"
  travel_danger_events.1002.c:0 ""Vệ binh! Loại bỏ bọn này!""
  travel_danger_events.1002.c.tt:0 "Ngài sai vệ binh từ [travel_option|E] để xử lý bọn côn đồ"
  travel_danger_events.1002.d:0 ""Nếu Ta trả tiền cho ngươi dẫn chúng Ta qua núi thì sao?""
  travel_danger_events.1002.e:0 "Đó là đất của chúng..."

  travel_danger_events.1003.t:1 "$travel_danger_prefix$ Bùn Lầy"
  travel_danger_events.1003.desc:0 "Ta biết chúng Ta phải đi cẩn thận qua đầm lầy [current_location.GetName]. Nơi kỳ quái này làm Ta rùng mình, có vô vàn nguy hiểm cần đề phòng. Đoàn của Ta đã được chỉ dẫn mọi biện pháp phòng ngừa.\n\nNhìn lại từ đầu đoàn, Ta đếm các đồng hành...\n\n#EMP Một người trong chúng Ta mất tích!#!"
  travel_danger_events.1003.a:0 "Ta có thể sai trưởng đoàn, [travel_leader.GetFirstNameNoTooltip], đi tìm người bị lạc."
  travel_danger_events.1003.b.success:0 "Đồng hành mất tích đã được tìm thấy"
  travel_danger_events.1003.b.success.desc:0 "[missing_companion.GetShortUIName] trở lại đoàn của Ngài"
  travel_danger_events.1003.b.failure:0 "Đồng hành mất tích không tìm thấy"
  travel_danger_events.1003.b:0 "Họ coi như đã chết. Bỏ họ đi."

  travel_danger_events.1006.t:1 "$travel_danger_prefix$ Cây Cũ Quen"
  travel_danger_events.1006.desc:0 ""Chẳng phải chúng ta đã thấy cây to đó trước đây sao? Ta thề chúng ta đang đi vòng quanh!" trưởng đoàn [travel_leader.GetName] la lên.\n\nCó lẽ [travel_leader.GetSheHe] đúng... chúng Ta đã không thấy lối ra khỏi rừng này trong nhiều giờ. Chúng Ta còn ở #EMP trong#! [current_location.GetName]? Tán cây dày đặc khiến không thể biết thời gian hay hướng đi.\n\nVới tốc độ này, chúng Ta sẽ không bao giờ đến [destination.GetName]..."
  travel_danger_events.1006.a:0 "Ta biết #EMP chính xác#! chúng ta đang ở đâu!"
  travel_danger_events.1006.a.success:0 "Ngài tìm được đường đúng"
  travel_danger_events.1006.a.success.desc:0 "Nhận được kinh nghiệm về nguy hiểm"
  travel_danger_events.1006.a.failure:0 "Ngài vật lộn để tìm đường đúng"
  travel_danger_events.1006.b:0 "Gửi người đi tìm hướng dẫn địa phương."
  travel_danger_events.1006.b.hire_guide:0 "Ngài tìm hướng dẫn để thuê"
  travel_danger_events.1006.c:0 "Gửi trinh sát đi trước."
  travel_danger_events.1006.c.major_speed_decrease:0 "Hành trình bị trì hoãn nhiều"
  travel_danger_events.1006.c.minor_speed_decrease:0 "Hành trình bị trì hoãn ít"

  travel_danger_events.1007.t:1 "$travel_danger_prefix$ Khô Cạn"
  travel_danger_events.1007.desc:0 "Hành trình đến [destination.GetName] đưa chúng Ta qua vùng hoang mạc [current_location.GetName]. Chúng Ta không chuẩn bị cho quãng đường dài mà không có nguồn nước, và nhiều đồng hành bắt đầu trông khô như [ROOT.Char.Custom('RegionalRootVegetablePlural')].\n\nTa phải làm gì đó... và nhanh chóng!"
  travel_danger_events.1007.a:0 "Ta biết một ốc đảo gần đây có thể cứu chúng Ta."
  travel_danger_events.1007.a.tt:0 "Kế hoạch di chuyển sẽ được chuyển hướng tới ốc đảo."
  travel_danger_events.1007.b:0 "Người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('water_hider'))] của Ta, [water_hider.GetFirstNameNoTooltip], uống như #EMP ngựa#!, không còn nữa!"
  travel_danger_events.1007.b.success:0 "Đồng hành được truyền cảm hứng"
  travel_danger_events.1007.b.success.desc:0 "[water_hider.GetFirstName] chết vì khát"
  travel_danger_events.1007.b.failure:0 "Không truyền cảm hứng được"
  travel_danger_events.1007.b.failure.desc:0 "[water_hider.GetFirstName] mất nước nghiêm trọng"
  travel_danger_events.1007.c:0 "Chúng Ta phải tiếp tục đi."
  travel_danger_events.1007.c.tt:0 "Ngài thẩm vấn [water_hider.GetFirstName] về nguồn nước bí mật"
  travel_danger_events.1007.c.success:0 "Tìm được nước từ thẩm vấn"
  travel_danger_events.1007.c.failure:0 "Không tìm thấy nước từ thẩm vấn"
  dehydrated_modifier: "Mất nước"
  dehydrated_modifier_desc: "Nhân vật này bị mất nước sau khi đi qua sa mạc."
  travel_danger_events.1007.d:0 "May mà chúng Ta mang thêm nước!"

  travel_danger_events.1008.t:1 "$travel_danger_prefix$ Hậu Quả"
  travel_danger_events.1008.desc:0 "Hành trình dẫn chúng Ta qua [current_location.GetName]. Những gì từng là một [current_location_barony.Custom('BaronyTownType')] xinh đẹp giờ chỉ còn là bóng ma của chính nó.\n\nĐống đổ nát từng là nhà cửa bốc khói, bị phá hủy bởi quân đội tàn nhẫn. Một [zombie.GetWomanMan] gầy gò tìm kiếm những gì còn sót lại của [zombie.GetHerHis] trên mảnh đất có thể là nông trại.\n\n[zombie.GetSheHe|U] nhận ra chúng Ta, rõ ràng không hợp nơi này, và lao về phía đoàn của chúng Ta!"
  travel_danger_events.1008.a:0 ""Vệ binh! Chặn kẻ [zombie.GetWomanMan] đó!""
  travel_danger_events.1008.a.tt:0 "[zombie.GetFirstNameNoTooltip] bị giết theo lệnh Ngài"
  travel_danger_events.1008.b:0 "Ta chắc [zombie.GetSheHe] không có ác ý."
  travel_danger_events.1008.c:0 ""#EMP Dừng lại!#! Lấy cái này và đi đi.""
  travel_danger_events.1008.good_intentions:0 "[zombie.GetFirstNameNoTooltip] không có ác ý"
  travel_danger_events.1008.bad_intentions:0 "[zombie.GetFirstNameNoTooltip] có ý đồ xấu"

  travel_danger_events.1009.t:0 "$travel_danger_events.1008.t$, Ý Định Tốt"
  travel_danger_events.1009.desc:0 "Kẻ [zombie.GetWomanMan] gầy guộc nhanh chóng băng qua khoảng đất giữa chúng ta, chẳng mảy may bận tâm đến hàng tá thi thể đang ngổn ngang trên mặt đất. [zombie.GetSheHe|U] cúi đầu của [zombie.GetHerHis] và bái kiến ta:\n\n "[ROOT.Char.Custom('FormOfAddressForLiege')|U], nhà cửa của thảo dân đã bị thiêu rụi thành tro than và sinh kế cũng bị cướp mất. Thảo dân xin phó thác mạng mọn này vào lòng từ bi của ngài. #EMP Xin hãy cứu giúp thảo dân!#!""
  travel_danger_events.1009.a:0 ""Ngươi thật tội nghiệp...""
  travel_danger_events.1009.b:0 "#EMP Giết [zombie.GetHerHim] đi!#!"
  travel_danger_events.1009.c:0 ""Ta sẽ bảo vệ ngươi!""
  travel_danger_events.1009.d:0 "Chuyện này không phải vấn đề của ta, đúng không?"

  travel_danger_events.1010.t:0 "$travel_danger_events.1008.t$, Ý Định Xấu"
  travel_danger_events.1010.desc:0 "Kẻ [zombie.GetWomanMan] gầy guộc nhanh chóng băng qua khoảng đất giữa chúng ta, chẳng mảy may bận tâm đến hàng tá thi thể đang ngổn ngang trên mặt đất. [zombie.GetSheHe|U] lao thẳng về phía ta, với cái miệng gầm gừ dữ tợn và sự cuồng nộ dại cuồng trong đôi mắt của [zombie.GetHerHis]."
  travel_danger_events.1010.a:0 ""Ta sẽ xử lý!""
  travel_danger_events.1010.a.success:0 "Đẩy lùi kẻ xấu"
  travel_danger_events.1010.a.failure:0 "Bị thương bởi kẻ xấu"
  travel_danger_events.1010.b:0 "#EMP Vệ binh!#!"
  travel_danger_events.1010.b.success:0 "Đẩy lùi kẻ xấu"
  travel_danger_events.1010.b.failure:0 "Đồng hành bị thương"
  travel_danger_events.1010.tt:0 "[zombie.GetFirstNameNoTooltip] chạy mất"

  travel_danger_events.1011.t:0 "$travel_danger_prefix$ Bị Cắn Bởi Giá Lạnh"
  travel_danger_events.1011.t_twice:0 "$travel_danger_prefix$ Nỗi Đau Đông Cứng"
  travel_danger_events.1011.t_thrice:0 "$travel_danger_prefix$ Tê Cóng Chết Người"
  travel_danger_events.1011.desc:0 "Tuyết đã rơi suốt mấy ngày qua và cái lạnh thật thấu xương. Ta nhìn quanh và thấy đoàn tùy tùng của mình cũng đang chật vật chống chọi, vì vậy ta quyết định đi bộ cùng họ. Sau khi chúng ta tiến bước trong bão tuyết thêm một giờ nữa, [frostbite_victim.GetTitledFirstName] kéo ta sang một bên, vừa run rẩy [frostbite_victim.GetSheHe] vừa kêu lên:\n\n"Xin ngài, [frostbite_victim.Custom2('RelationToMeShort', ROOT.Char)] của tôi, tôi không còn cảm giác gì ở [frostbite_victim.Custom('GetFrostbittenBodyPart')] của mình nữa rồi!""
  travel_danger_events.1011.desc_frostbite_twice:0 "Một lần nữa, cuộc hành trình lại đòi hỏi một cái giá quá đắt đối với đoàn lữ hành của chúng ta. Bão tuyết liên miên và nhiệt độ hạ xuống cực thấp đã buộc chúng ta phải hạ trại. Ta đến kiểm tra tình hình của [frostbite_victim.GetTitledFirstName], vì [frostbite_victim.GetSheHe] từng bị hoại tử do băng giá trước đây và giờ đây [frostbite_victim.GetSheHe] đang nằm trên một chiếc giường dã chiến.\n\n"Tôi cảm thấy không được ổn cho lắm, [frostbite_victim.Custom2('RelationToMeShort', ROOT.Char)] của tôi." Đúng như ta dự đoán, cái lạnh giá lại một lần nữa hạ gục phần [frostbite_victim.Custom('GetFrostbittenBodyPart')] tội nghiệp của [frostbite_victim.GetNamePossessiveNoTooltip]!"
  travel_danger_events.1011.desc_frostbite_thrice:0 "Mùa đông lại bất ngờ thử thách chúng Ta. Đường quanh co và trơn trượt, tầm nhìn thấp như tinh thần của chúng Ta. Ta phải kiểm tra [frostbite_victim.GetTitledFirstName] vì [frostbite_victim.GetSheHe] đã bị tê cóng hai lần trước đó.\n\n"Lạnh quá, [frostbite_victim.Custom2('RelationToMeShort', ROOT.Char)]." [frostbite_victim.GetSheHe|U] thì thầm, rồi [frostbite_victim.GetSheHe] ngất đi, cái lạnh tấn công [frostbite_victim.GetNameNoTooltip] lần thứ ba, và nó đang rút hơi thở cuối cùng khỏi [frostbite_victim.GetHerHim]."
  travel_danger_events.1011.desc_head:0 "$travel_danger_events.1011.desc$ Ta nhìn kỹ [frostbite_victim.Custom('GetFrostbittenBodyPart')], đầu ngón tay phủ băng và hơi sưng. Ta nghĩ nếu không làm gì, nó sẽ tồi tệ hơn!"
  travel_danger_events.1011.desc_upper_limb:0 "$travel_danger_events.1011.desc$ [frostbite_victim.GetSheHe] cố nắm tay, nhưng đau quá. [frostbite_victim.GetHerHis] [frostbite_victim.Custom('GetFrostbittenBodyPart')] sưng và chuyển đủ các sắc thái xanh đen."
  travel_danger_events.1011.desc_lower_limb:0 "$travel_danger_events.1011.desc$ Ta lệnh cho [frostbite_victim.GetHerHim] cởi chiếc ủng của [frostbite_victim.GetHerHis] ra để kiểm tra phần [frostbite_victim.Custom('GetFrostbittenBodyPart')]. Nó đã chuyển sang màu xanh thẫm hoàn toàn và tại thời điểm này, có lẽ đã quá muộn để cứu vãn nó."
  travel_danger_events.1011.desc_head_twice:0 "$travel_danger_events.1011.desc_frostbite_twice$ Lần này Ta xem [frostbite_victim.GetHerHis] [frostbite_victim.Custom('GetFrostbittenBodyPart')] và so sánh với tai. Nó xanh nhạt hơn, có thể vì vết tê cóng trên [frostbite_victim.Custom('GetFrostbittenBodyPart')] còn mới."
  travel_danger_events.1011.desc_upper_limb_twice:0 "$travel_danger_events.1011.desc_frostbite_twice$ Vết hoại tử ngón tay cũ thậm chí còn tồi tệ hơn và giờ đây nó đã lan ra toàn bộ phần [frostbite_victim.Custom('GetFrostbittenBodyPart')], cứ theo đà này [frostbite_victim.GetSheHe] sẽ mất đi cả cánh tay của [frostbite_victim.GetHerHis] mất!"
  travel_danger_events.1011.desc_lower_limb_twice:0 "$travel_danger_events.1011.desc_frostbite_twice$ Ta giữ lấy chiếc ủng của [frostbite_victim.GetHerHis] để giúp [frostbite_victim.GetHerHim] cởi ra, chúng ta chật vật một lúc, nhưng cuối cùng cũng làm lộ ra phần [frostbite_victim.Custom('GetFrostbittenBodyPart')] đang sưng tấy. [frostbite_victim.GetSheHe|U] sẽ sớm mất đi cả cái chân của mình thôi!"
  travel_danger_events.1011.desc_head_thrice:0 "$travel_danger_events.1011.desc_frostbite_thrice$ Tê cóng lan sang [frostbite_victim.Custom('GetFrostbittenBodyPart')] khác, mặt [frostbite_victim.GetHerHis] xanh thẫm và lạnh như băng. Sao chuyện này có thể xảy ra?!"
  travel_danger_events.1011.desc_upper_limb_thrice:0 "$travel_danger_events.1011.desc_frostbite_thrice$ Vết mất [frostbite_victim.Custom('GetFrostbittenBodyPart')] giúp tê cóng lan lên phần thân trên, ngực và cổ [frostbite_victim.GetHerHis] tối đi từng phút."
  travel_danger_events.1011.desc_lower_limb_thrice:0 "$travel_danger_events.1011.desc_frostbite_thrice$ Sau khi mất [frostbite_victim.Custom('GetFrostbittenBodyPart')] từ những lần tê cóng trước, lạnh tấn công thẳng vào bụng và toàn bộ cơ thể đang dần xanh."
  travel_danger_events.1011.a:0 "Hãy đốt [to_be_burned.GetNameNoTooltip] để sưởi ấm [frostbite_victim.GetHerHim]."
  travel_danger_events.1011.a.success:0 "[frostbite_victim.GetTitledFirstNameNoTooltip] ấm lên"
  travel_danger_events.1011.a.failure:0 "$travel_danger_events.1011.c.tt$"
  travel_danger_events.1011.a_frostbite_treatment_burn_failure:0 "Có thể lần này đốt [to_be_burned.GetNameNoTooltip] sẽ hiệu quả?"
  travel_danger_events.1011.b_physician:0 "Chắc chắn, [court_physician.GetTitledFirstNameNoTooltip] biết cách chữa!"
  travel_danger_events.1011.b_physician_success:0 "$travel_danger_events.1011.b.success$"
  travel_danger_events.1011.b_physician_failure:0 "$travel_danger_events.1011.a.failure$"
  travel_danger_events.1011.b:0 "Ta từng đọc cách chữa trong một bản thảo."
  travel_danger_events.1011.b.success:0 "Chữa tê cóng thành công"
  travel_danger_events.1011.b.failure:0 "Chữa tê cóng thất bại"
  travel_danger_events.1011.b_root_knows_winter:0 "Ta cũng khá rành về mùa đông."
