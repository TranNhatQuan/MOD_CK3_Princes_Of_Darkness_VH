l_english:

### Dying Embers
  travel_events_fp3.0010.t: "Ngọn Lửa Tàn"
  travel_events_fp3.0010.desc.intro: "Khi đoàn của Ta đi qua cơn bão bất ngờ, Ta thấy một nhóm pháp sư vũ trang đi theo hướng ngược lại. Họ khiêng một kiệu với một lò than đang tàn giữa họ. Gió và mưa đang quật vào ngọn lửa linh thiêng, có nguy cơ dập tắt nó.\n\nDù tay họ mệt mỏi chạm vào vũ khí, các thầy tế gọi chúng Ta, hy vọng chúng Ta có thể giúp che chở ngọn lửa thiêng của họ."
  travel_events_fp3.0010.a: "Bắt họ và dập tắt dị giáo!"
  travel_events_fp3.0010.a.success: "Ta dập tắt ngọn lửa của họ"
  travel_events_fp3.0010.a.failure: "Các pháp sư đánh bật chúng ta"
  travel_events_fp3.0010.a.lightning.desc: "Chiến đấu trong bão rất nguy hiểm và khó lường"
  travel_events_fp3.0010.b: "Tịch thu Lò than, lửa sẽ an toàn hơn trong tay Ta!"
  travel_events_fp3.0010.b.success: "Ngài tịch thu lò than"
  travel_events_fp3.0010.b.failure: "Các pháp sư đánh bật chúng ta."
  travel_events_fp3.0010.c: "Ngài có thể trú cùng chúng Ta!"
  travel_events_fp3.0010.c.success: "Ngọn lửa sống sót qua cơn bão"
  travel_events_fp3.0010.c.success.desc: "Ngài nhận được lòng biết ơn của các pháp sư"
  travel_events_fp3.0010.c.flavor: "Nếu chúng ta bảo vệ những người hành hương, họ sẽ tỏ lòng biết ơn"
  travel_events_fp3.0010.c.failure: "Ngọn lửa bị dập tắt"
  travel_events_fp3.0010.d: "Cơn bão này là sự phán xét của [ROOT.Char.GetFaith.HighGodName]."
  travel_events_fp3.0010.d.flavor: "Ngài để những người hành hương theo đức tin của họ"

  travel_events_fp3.0011.t: "Ngọn Lửa Tàn"
  travel_events_fp3.0011.desc.intro: "Các pháp sư chống trả dũng cảm, cố che chắn ngọn lửa linh thiêng trong khi chống lại Ta và đoàn quân. Nhưng khi Ta thấy cơ hội, Ta đá kiệu khỏi tay họ và lò than lăn vào bùn, ngọn lửa tắt dần.\n\nChúng Ta chế nhạo các thầy tế bị đánh bại, nhưng niềm vui bị cắt ngang, khi thế giới bừng sáng với tiếng sấm chói tai. Hình ảnh tia chớp lóe lên trước mắt Ta. Khi Ta tỉnh lại sau cơn choáng váng, Ta thấy ngọn lửa sáng bừng từ lò than linh thiêng được thắp lại. Đoàn quân của Ta đã tháo chạy hoảng loạn."
  travel_events_fp3.0011.a: "Mọi người phải biết sức mạnh không thể chối cãi của [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]!"
  travel_events_fp3.0011.b: "Ta sẽ âm thầm giữ phép lạ không thể chối cãi này trong tim."
  travel_events_fp3.0011.c: "Chỉ là trùng hợp mà thôi!"
  travel_events_fp3.0012.t: "Ngọn Lửa Tàn"
  travel_events_fp3.0012.desc.intro: "Ngài và các pháp sư tìm được nơi trú tạm trong một công trình đổ nát. Sau khi vắt khô quần áo ướt và đảm bảo lò than cùng than vẫn sống, cả nhóm nghỉ ngơi. Có vẻ như các Ngài sẽ cùng chờ cơn bão qua.\n\nNgười dẫn đầu các thầy tế, [fp3_zoroastrian_armed_pilgrim.GetName], là một người am hiểu và có nhiều câu chuyện để kể."
  travel_events_fp3.0012.a: "Ta sẽ lấy những than quý của họ khi họ nghỉ..."
  travel_events_fp3.0012.a.success: "Chúng Ta đánh cắp than khi họ đang ngủ"
  travel_events_fp3.0012.a.failure: "Ngài bị các pháp sư phát hiện và bị lộ là kẻ trộm"
  travel_events_fp3.0012.b: "Trí tuệ của Ngài có thể giúp ích cho Ta."
  travel_events_fp3.0012.c: "Chúc hành trình an toàn."

  zoroastrian_brazier_name: "Lò Than [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdjective]"
  zoroastrian_brazier_desc: "Một $zoroastrian_brazier_name$ được cứu từ tay các pháp sư bất lực giữa cơn bão dữ dội, than của ngày đó vẫn còn cháy"

### Qanat Diving
  travel_events_fp3.0020.t: "Cuộc Gặp Gỡ Khác Thường"
  travel_events_fp3.0020.desc.intro: "Tránh nắng gay gắt giữa trưa, chúng Ta tạm dừng trong một hang động ẩm ướt kỳ lạ.\n\n\"Ngài có nghe thấy không, [ROOT.GetCharacter.GetTitleTierName|U] của Ta?\" [travel_leader.GetName] tỏ ra không thoải mái với nơi trú tối này.\n\nKhi Ta quay lại, bất ngờ gặp một [fp3_young_rascal.Custom('GirlBoy')] trẻ tuổi, dường như đã đi ngang qua [travel_leader.GetNameNoTooltip]. Đứa trẻ hoảng sợ lập tức biến mất sâu hơn vào hang."
  travel_events_fp3.0020.a: "Theo đuổi đứa trẻ!"
  travel_events.fp3.0020.a.flavor: "Khám phá hang động có thể mang nguy hiểm hoặc hé lộ bí mật"
  travel_events_fp3.0020.a.success: "Ngài tìm thấy đứa trẻ"
  travel_events_fp3.0020.a.success.tooltip: "Ngài theo đuổi đứa trẻ và khám phá bí mật dưới lòng đất"
  travel_events_fp3.0020.b: "Chúng ta phải rời nơi này."
  travel_events.fp3.0020.b.flavor: "[travel_leader.GetNameNoTooltip] thúc giục rời hang. Nơi này không an toàn"
  travel_events_fp3.0020.b.tt: "Hành trình của Ngài tiếp tục."
  travel_events_fp3.0020.a.failure.title: "Ngài ngã và bị thương trong hang tối"
  travel_events_fp3.0020.a.failure: "Ngài mất dấu đứa trẻ và lạc trong hang nhiều ngày"

  travel_events_fp3.0021.t: "Hệ Thống Qanat của [ROOT.Char.GetCurrentLocation.GetCounty.GetName]"
  travel_events_fp3.0021.desc: "Chúng ta càng lúc càng dấn sâu xuống lòng đất, bỏ lại khung cảnh ngập tràn ánh nắng rực rỡ phía sau để bước vào những đường hầm ngày càng ẩm thấp và tối tăm.\n\nKhi ta cuối cùng cũng đuổi kịp đứa [fp3_young_rascal.Custom('GirlBoy')], ta bị thu hút bởi một cảnh tượng huy hoàng. Một hệ thống kênh rạch ngầm cổ xưa trải dài ngút tầm mắt.\n\n"Chào mừng [ROOT.Char.GetTitleAsName] đến với cung điện của riêng ta. Nơi này chắc chắn sẽ khiến cung điện của ngài trở nên nhỏ bé." [fp3_young_rascal.GetSheHe|U] ngước nhìn ta đầy thách thức, lộ rõ vẻ thất vọng khi ta có thể bám đuôi theo [fp3_young_rascal.GetHerHim] xuống tận nơi này."
  travel_events_fp3.0021.a: "Hãy lặn tìm kho báu dưới nước này."
  travel_events_fp3.0021.a.success.t: "Ngài vớt được [newly_created_artifact.GetName]"
  travel_events_fp3.0021.a.success.desc: "Ngài tìm thấy kho báu cổ"
  travel_events_fp3.0021.a.failure.t: "Chỉ Lấy Được Cái Rùng Mình"
  travel_events_fp3.0021.a.failure.desc: "Ngài suýt chết đuối trong nước bẩn"
  travel_events_fp3.0021.a.artifact: "Ngài tìm thấy cổ vật cũ"

  travel_events_fp3.0021.b: "Ta có thể học hỏi từ việc nghiên cứu cấu trúc này."
  travel_events_fp3.0021.b.success.t: "Ngài học được một số bí quyết tưới tiêu"
  travel_events_fp3.0021.b.success.desc: "Ngài nghiên cứu hệ thống Qanat"
  travel_events_fp3.0021.b.failure.t: "Vấn đề vượt quá khả năng Ngài"
  travel_events_fp3.0021.b.failure.desc: "Điều này vượt khả năng của Ngài"

  travel_events_fp3.0021.c: "[fp3_young_rascal.Custom('GirlBoy')|U], Ngài phải học cách tôn trọng bậc trên!"

### Tower of Silence
  travel_events_fp3.0030.t: "Bữa Tiệc Cho Chim Ưng"
  travel_events_fp3.0030.desc.intro: "Chim săn mồi bay vòng trên đầu, tạo bóng đen đe dọa trên vùng đất cháy nắng. Khi Ta leo lên sườn đồi looming, mùi thịt thối lấn át các giác quan.\n\nTa thấy xác người được sắp xếp trên đá. Kền kền và chim ưng xé thịt, những miếng thịt máu me treo lủng lẳng trên mỏ. Một người mặc đồ giản dị giám sát tang lễ trên trời. Hắn ra hiệu cho Ta.\n\n\"Xin rời đi, [ROOT.Char.GetTitleAsNameNoTooltip], nơi này chỉ dành cho Nusessalars...\""
  travel_events_fp3.0030.a: "Thật man rợ, chúng ta sẽ chôn những xác này!"
  every_faith_vassal: "Mọi Chư Hầu [local_faith.GetAdjective]"
  travel_events_fp3.0030.b: "Mong Ta được ra đi như vậy, cơ thể Ta được Nasu thanh tẩy..."
  travel_events_fp3.0030.c: "Tưởng tượng bay lên trời, được mang bởi đôi cánh hùng mạnh..."
  travel_events_fp3.0030.d: "Cái chết đến với tất cả chúng ta."
  travel_events_fp3.0030.d_flavor: "Dành chút thời gian suy ngẫm về cái chết rồi rời đi"
  travel_events_fp3.0030.e: "Tìm cho Ta con chim ưng trẻ nhất, Ta sẽ huấn luyện nó."
  travel_events_fp3.0030.e.tooltip: "Ngài sẽ có cơ hội huấn luyện chim."

  travel_events_fp3.0031.t: "Bữa Tiệc Cho Chim Ưng"
  travel_events_fp3.0031.desc.intro: "Ta quyết tâm huấn luyện chim ưng tìm được ở khu tang lễ trên trời. Chúng Ta tập trung trên cánh đồng với một đoàn tùy tùng nhỏ, bao gồm [falcon_victim.GetName], [ROOT.Char.Custom2('RelationToMe', falcon_victim)] của Ta, sẵn sàng với con thỏ bị bắt. Chim non bị trùm mũ chờ trên tay găng của Ta.\n\n[falcon_victim.GetNameNoTooltip] thả con mồi, nó lao qua cánh đồng. Ta tháo mũ của chim, và nó bay lên. Nhưng thay vì lao vào mồi, nó lao vào đầu [falcon_victim.GetNameNoTooltip]. Trước khi bị kéo đi, chim cắn và móc [falcon_victim.GetHerHim], để lại vết thương chảy máu."
  travel_events_fp3.0031.a: "Ta chắc có thể sửa hành vi này."
  travel_events_fp3.0031.a.success.desc: "Việc huấn luyện thành công"
  travel_events_fp3.0031.a.success.t: "Chim tháp im lặng trở thành chim săn mồi"
  travel_events_fp3.0031.a.failure.desc: "Chim vẫn hung dữ"
  travel_events_fp3.0031.a.failure.t: "Chim vẫn thèm thịt người"
  travel_events_fp3.0031.b: "Ta có thể nuôi dưỡng những bản năng này..."
  travel_events_fp3.0031.c: "Ta nên loại bỏ con thú này."
  travel_events_fp3.0031.d: "Mọi [ROOT.Char.GetCulture.GetPrefixNoTooltip] [ROOT.Char.GetWomanMan] đều biết cách thuần hóa cả những loài chim hung dữ nhất."
  travel_events_fp3.0031.d.tt: "Lựa chọn này khả dụng nhờ văn hóa Ngài có $tradition_ep2_avid_falconers_name$ [culture_tradition|E]"

### Mare's Milk
  travel_events_fp3.0040.t: "Sữa Ngựa"
  travel_events_fp3.0040.desc.intro: "Đường đi đưa chúng Ta qua một trại lớn của dân du mục Thổ Nhĩ Kỳ. Nhóm thân thiện vẫy tay mời chúng Ta tham gia. Một [fp3_turkic_traveler.GetWomanMan] lực lưỡng khuấy chất lỏng trắng đục trong nồi. [fp3_turkic_traveler.GetSheHe|U] rót một ít vào bát nhỏ đưa cho Ta.\n\n\"#EMP Kumis!#! Tốt cho đường ruột!\"\n\nHai người khác nhìn Ta và thì thầm bằng ngôn ngữ của họ, đủ nghe."
  travel_events_fp3.0040.desc.intro.a: "\n\"Tại sao lại phí #EMP kumis#! cho lạ này?\"\n\nHọ nghĩ Ta không hiểu, nhưng ít nhất không đầu độc Ta."
  travel_events_fp3.0040.desc.intro.b: "\n\"Ta chọn trước đồ của hắn! Đôi ủng đẹp này sẽ hợp Ta.\"\n\nHọ nghĩ Ta không hiểu. Nhưng giờ Ta biết ý đồ xấu của họ."
  travel_events_fp3.0040.desc.intro.c: "Nhưng Ta không hiểu ngôn ngữ lạ. Hy vọng họ có ý tốt..."
  travel_events_fp3.0040.a: "Ta cảm ơn họ bằng tiếng mẹ đẻ, chúc sức khỏe!"
  travel_events_fp3.0040.ab.tt: "Lựa chọn khả dụng vì Ngài biết [fp3_turkic_traveler.GetCulture.GetLanguage.GetNameNoTooltip]"
  travel_events_fp3.0040.b: "Bằng tiếng mẹ đẻ, Ta ra lệnh giam họ."
  travel_events_fp3.0040.c: "Ta không nên nghi ngờ quá."
  travel_events_fp3.0040.c.success: "Kumis thật ngon"
  travel_events_fp3.0040.c.success.t: "Kumis thật tuyệt!"
  travel_events_fp3.0040.c.failure: "Ngài bị mê hoặc và cướp"
  travel_events_fp3.0040.c.failure.t: "Ta bị mê hoặc và cướp!"
  travel_events_fp3.0040.d: "Sữa ngựa? Thật ghê tởm."
  travel_events_fp3.0040.e: "Hãy để [fp3_turkic_traveler.GetWomanMan] này dạy chúng ta cách [fp3_turkic_traveler.GetHerHis]."

### Tomb Raiders
  travel_events_fp3.0050.t: "Kẻ Cướp Mộ"
  travel_events_fp3.0050.desc.intro: "Quẹo một khúc đường, chúng Ta gặp nhóm người phủ đầy bụi, vừa ra từ ngôi mộ từng nguy nga. Họ khiêng bao bố kêu leng keng, nặng bởi những đồ vật họ khai quật.\n\n\"Thời gian khó khăn, uy vương [ROOT.Char.GetTitleAsNameNoTooltip]! Gia đình chúng Ta phải được ăn và chúng Ta không gây hại ai cả.\""
  travel_events_fp3.0050.a: "Người coi thường quá khứ sẽ không có tương lai."
  travel_events_fp3.0050.b: "[ROOT.Char.GetTitleAsNameNoTooltip] xứng đáng nhận được phần chia của [ROOT.Char.GetHerHis]!"
  travel_events_fp3.0050.b.entourage: "Người đồng hành [entourage_helper.GetName] giúp Ngài kiểm tra chiến lợi phẩm."
  travel_events_fp3.0050.b.success.desc: "Ngài chọn được kho báu quý giá"
  travel_events_fp3.0050.b.success.tooltip: "Ngài nhận được kho báu cổ"
  travel_events_fp3.0050.b.failure.desc: "Không có gì đặc biệt lọt vào mắt Ngài"
  travel_events_fp3.0050.b.failure.t: "Ngài nhận vài món đồ có giá trị"
  travel_events_fp3.0050.c: "Ta không có thời gian cho dân thường."
