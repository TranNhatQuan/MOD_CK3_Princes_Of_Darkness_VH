l_english:
  travel_danger_events.3000.t:0 "$travel_danger_prefix$ Trên Đường Núi"
  travel_danger_events.3000.desc.first_time:0 "Từng bước một, Ta chậm rãi tiến trên con đường núi hẹp. Đột nhiên, Ta nghe thấy một tiếng động rung và một tiếng thét nhanh chóng im bặt.\n\nBàng hoàng trước sự náo loạn, Ta quay lại. Thay vì [fallen_victim.GetFirstName] đi phía sau Ta, chỉ còn khuôn mặt mệt mỏi và bối rối của [char_next_in_line.GetFirstName] đứng trước những tảng đá mới bị xới lên.\n\n\"[fallen_victim.GetFirstNameNoTooltip] đâu rồi?\" Ta hỏi, giọng khan đặc khó thoát ra.\n\nPhản ứng duy nhất là tiếng gió huýt yếu ớt."
  travel_danger_events.3000.desc.second_time:0 "Ta tiếp tục bước trên con đường núi hẹp tưởng như vô tận. Cảm giác mệt mỏi bao trùm tâm trí. Ta nghe thấy những thì thầm lừa dối từ ký ức nửa quên lãng và tiếng gió huýt nhẹ.\n\nNhưng có điều gì đó rất thực về tiếng thét sắc nhọn của [fallen_victim.GetFirstName]. Lạnh sống lưng, Ta chậm rãi quay lại, và lần nữa, Ta thấy một khoảng trống kích thước người trong hàng ngũ di chuyển.\n\n\"Chúng ta... vừa... mất thêm một người nữa sao?\" Ta thốt ra chậm rãi. [char_next_in_line.GetFirstName] không cần nói. Khuôn mặt sững sờ kinh hoàng của [char_next_in_line.GetHerHis|U] đã đủ trả lời."

  travel_danger_events.3000.a.first_time:0 "Chú ý bước đi! Chúng ta phải tiến lên."
  travel_danger_events.3000.a.second_time:0 "Ah, [fallen_victim.GetFirstNameNoTooltip]! Ta #EMP đã nói#! Ngài phải chú ý bước đi!"
  travel_danger_events.3000.a.tt:0 "Địa hình hiểm trở đã cướp đi thêm một nạn nhân, chắc chắn không phải lần đầu, và chắc chắn cũng chưa phải lần cuối."

  travel_danger_events.3000.b:0 "[fallen_victim.GetFirstNameNoTooltip]! [fallen_victim.GetFirstNameNoTooltip]! Chúng Ta sẽ cứu Ngài!"
  travel_danger_events.3000.b.tt:0 "Ngài và đoàn tùy tùng cố gắng cứu nạn trên núi. #EMP #X Điều này rất nguy hiểm.#! #!Nhiều người sẽ thiệt mạng."
  travel_danger_events.3000.b.found_nothing:0 "[fallen_victim.GetFirstNameNoTooltip] không được tìm thấy."
  travel_danger_events.3000.b.found_cloth:0 "Chỉ tìm thấy một mảnh vải rách, dính máu."
  travel_danger_events.3000.b.found_fallen_victim:0 "Bất chấp mọi khó khăn, [fallen_victim.GetFirstNameNoTooltip] được tìm thấy còn sống."

  travel_danger_events.3000.c.first_time:0 "[fallen_victim.GetSheHe|U] sẽ được chúng Ta cầu nguyện."
  travel_danger_events.3000.c.second_time:0 "Lạy [ROOT.Char.GetFaith.HighGodName], xin cứu chúng Ta khỏi nguy hiểm!"

  travel_danger_events.3000.d.first_time:0 "Không thể làm tốt hơn cả!"
  travel_danger_events.3000.d.second_time:0 "Thậm chí còn buồn cười hơn lần thứ hai!"

  travel_danger_events.3001.t:0 "$travel_danger_prefix$ Tuyết Lở!"
  travel_danger_events.3001.desc:0 "Sau một hành trình dài vất vả giữa các đỉnh núi phủ tuyết, Ta từ từ sưởi ấm bên lò sưởi trong quán trọ địa phương khi [first_avalanche_victim.GetFirstName] và [second_avalanche_victim.GetFirstName] chăm sóc đoàn lữ hành ngoài trời. Đột nhiên, có một tiếng động mạnh, vang xa và dội lại.\n\n\"Tuyết lở!\" ai đó hét lên. Trước khi ai kịp phản ứng, âm thanh ngày càng lớn cho đến khi dội vào các bức tường và sàn nhà. Sau một nhịp tim hay một khoảng thời gian vô tận, có một sự im lặng khủng khiếp hơn."
  travel_danger_events.3001.a:0 "[ROOT.Char.GetCulture.GetCollectiveNoun] biết cách sinh tồn trên núi."
  travel_danger_events.3001.a.alternate:0 "[travel_leader.GetCulture.GetCollectiveNoun] biết cách sinh tồn trên núi."
  travel_danger_events.3001.a.flavor:0 "So với một vụ tuyết lở chuẩn mực của [ROOT.Char.GetCulture.GetName] thì chuyện này chẳng thấm vào đâu!"
  travel_danger_events.3001.a.flavor.alternate:0 "$travel_leader_court_position$ [travel_leader.GetFirstName] đã chuẩn bị các biện pháp phòng ngừa nguy hiểm núi, nhờ di sản [travel_leader.GetHerHis] của [travel_leader.GetCulture.GetName]."
  travel_danger_events.3001.b:0 "Cố lên, cứu hộ sắp tới!"
  travel_danger_events.3001.b.flavor:0 "Với những người bị tuyết vùi, tốc độ là quan trọng nhất!"
  travel_danger_events.3001.b.success:0 "Cứu nạn tuyết lở kịp thời"
  travel_danger_events.3001.b.failure:0 "Cứu nạn tuyết lở khó khăn"
  travel_danger_events.3001.c:0 "Ta sẽ ở lại bên trong... một thời gian."

  travel_danger_events.3002.opening:1 "[ROOT.Char.GetTitledFirstName],"
  travel_danger_events.3002.desc:0 "Con xin thông báo, bệ hạ, rằng một vụ tuyết lở khủng khiếp vừa xảy ra tại [avalanche_location.GetName].\n\nNó đã cướp đi nhiều sinh mạng và phá vỡ cuộc sống của những người sống sót, bao gồm cả những lữ khách đi qua."
  travel_danger_events.3002.a.special:0 "Con biết! Con đã #EMP có mặt ở đó!#"
  travel_danger_events.3002.a.default:0 "Thật là thảm khốc!"
  travel_danger_events.3002.b:0 "Điều này sẽ giúp họ hồi phục."

  travel_danger_events.3003.t:0 "$travel_danger_prefix$ Tuyết Bao Trùm"
  travel_danger_events.3003.desc:0 "Tuyết đã rơi liên tục nhiều ngày. Con đường phía trước dường như không thể đi tiếp. Tuy nhiên, khi Ta nhìn lên, thấy một nhóm nhỏ người tiến nhanh qua những cồn tuyết. Chẳng mấy chốc, một [maron_leader.GetWomanMan] đứng trước mặt Ta và cười rộng:\n\n\"Các ngươi dường như gặp khó khăn. Nhưng đừng lo, với một mức giá hợp lý, chúng Ta sẽ giúp các ngươi tiếp tục cuộc hành trình.\""
  travel_danger_events.3003.a:0 "Giúp người khác là phần thưởng tự thân!"
  travel_danger_events.3003.a.success:0 "Đoàn tùy tùng của Ta nhanh chóng tiếp tục di chuyển!"
  travel_danger_events.3003.a.failure:0 "Đoàn tùy tùng của Ta vẫn mắc kẹt trong tuyết"
  travel_danger_events.3003.b:0 "Mức giá này hợp lý."
  travel_danger_events.3003.c:0 "Chúng Ta sẽ tự xoay sở."
  travel_danger_events.3003.c.flavor:0 "Kinh nghiệm mùa đông sẽ giúp chúng Ta tiếp tục di chuyển... nếu chúng Ta có kinh nghiệm đó."
  travel_danger_events.3003.c.complete_success:0 "Đoàn tùy tùng của Ta nhanh chóng tiếp tục di chuyển!"
  travel_danger_events.3003.c.partial_success:0 "Đoàn tùy tùng của Ta bắt đầu di chuyển trở lại chậm chạp"
  travel_danger_events.3003.c.failure:0 "Đoàn tùy tùng của Ta vẫn mắc kẹt trong tuyết"


  travel_danger_events.3004.t:0 "$travel_danger_prefix$ Cơn Giông Trắng"
  travel_danger_events.3004.desc:0 "\"Cơn giông trắng! Quay sang mạn trái!\"\n\nTiếng hét kinh hoàng của người lái không phù hợp với thời tiết bình yên. Nhưng tai Ta đầy tiếng gió gầm ngày càng to. Trong nháy mắt, sương trắng ẩm tràn khắp tàu. Lớn hơn cả gió, cột buồm chính gãy và rơi xuống biển.\n\nVà cũng đột ngột như khi đến, cơn giông trôi qua. Thuyền chúng Ta lắc lư trên biển lặng, kéo theo cánh buồm rách và mái chèo gãy."
  travel_danger_events.3004.a:0 "Chúng ta phải tìm cách giăng buồm tạm!"
  travel_danger_events.3004.a.success:0 "Thuyền chúng Ta lại ra khơi!"
  travel_danger_events.3004.a.failure:0 "Chúng Ta trôi theo gió chậm chạp"
  travel_danger_events.3004.b:0 "Đừng sợ! Chúng Ta còn buồm khác."
  travel_danger_events.3004.b.flavor:0 "Nhờ kinh nghiệm hàng hải của đoàn tùy tùng, chúng Ta đã chuẩn bị sẵn. Buồm và khung gỗ được dựng lại nhanh chóng."
  travel_danger_events.3004.c:0 "Ai đó #EMP sẽ#! tìm thấy chúng Ta... Hy vọng là vậy"
  travel_danger_events.3004.c.success:0 "Một con tàu đi ngang giúp đỡ"
  travel_danger_events.3004.c.failure:0 "Trong nhiều ngày, không thấy tàu nào khác"

  travel_danger_events.3005.t:0 "$travel_danger_prefix$ Lửa Ban Đêm"
  travel_danger_events.3005.desc:1 "Chúng Ta đi qua những ngọn đồi vào cuối ngày. Bóng tối ập đến bất ngờ, do những đám mây đen phía trên mang lại. Rồi, có một tiếng sấm vang xa. Chẳng bao lâu, tiếng sấm khác kết hợp với chớp lóe sáng chói.\n\nMột tia sét khác chiếu sáng vùng đất, hình ảnh cháy rực in sâu vào mắt Ta. Ta chớp mắt và nhìn nơi tia sét đánh: bây giờ, một đám cháy bụi rậm nhanh chóng lan rộng. Và nó đang lan về phía chúng Ta!"
  travel_danger_events.3005.a:0 "CHẠY!"
  travel_danger_events.3005.a.success:0 "Chúng Ta chạy thoát khỏi đám cháy"
  travel_danger_events.3005.a.failure:0 "Lửa đuổi kịp khi chúng Ta chạy!"
  travel_danger_events.3005.b:0 "Dập tắt đám cháy trước khi lan quá rộng!"
  travel_danger_events.3005.b.success:0 "Ngài đã dập tắt thành công đám cháy"
  travel_danger_events.3005.b.failure:0 "Đám cháy bị ngăn lại, nhưng với giá phải trả"
  travel_danger_events.3005.b.c_failure:0 "Lửa bao trùm cả đoàn tùy tùng!"


