l_english:
#Travel Completion Events
#Generic completion
  travel_completion_event.1000.t:1 "$travel_event_prefix$ Đến Nơi"
  travel_completion_event.1000.desc.home:0 "Cuối cùng, Ta đã trở về nhà! Không gì bằng được về lại [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] sau một chuyến đi dài. Ta mong được nghỉ ngơi một thời gian, "
  travel_completion_event.1000.desc.abroad:0 "Sau một hành trình dài, Ta cuối cùng đã đến [final_destination_province.GetName]! Ta sẽ thoát khỏi bụi đường và mỏi lưng một thời gian, "
  travel_completion_event.1000.desc.activity:0 "vì bây giờ đã đến lúc tham gia [ROOT.Char.GetInvolvedActivity.GetName].\n\n"
  travel_completion_event.1000.desc.mandala_contract: "sau khi hoàn thành các nhiệm vụ thần thánh tạm thời của Ta.\n\n"
  travel_completion_event.1000.desc.no_activity:0 "nhưng tiếng gọi của đường xá vẫn tiếp tục thôi thúc.\n\n"
  travel_completion_event.1000.stats:2 "Phái đoàn của Ta báo cáo rằng chúng Ta đã đi trong [travel_plan_scope.MakeScope.Var('travel_plan_elapsed_days').GetValue] ngày và băng qua [travel_plan_scope.MakeScope.Var('travel_plan_provinces_traversed').GetValue] quận.\n\n"
  travel_completion_event.1000.stats.travel_leader:0 "[GetCourtPositionType('travel_leader_court_position').GetNameNoTooltip()] của Ta, [travel_leader_scope.GetName], báo cáo rằng chúng Ta đã đi trong [travel_plan_scope.MakeScope.Var('travel_plan_elapsed_days').GetValue] ngày và băng qua [travel_plan_scope.MakeScope.Var('travel_plan_provinces_traversed').GetValue] quận.\n\n"
  travel_completion_event.1000.desc.memory:0 "Ta sẽ không bao giờ quên khi [travel_conc_memory.GetDescription]."
  travel_completion_event.1000.desc.cultural_ambassador:0 "Đại sứ Văn hóa của Ta đã có cơ hội lan tỏa sự chấp nhận đối với [ROOT.Char.GetCulture.GetName]!\n\n"
  travel_completion_event.1000.a:1 "Cảm tạ [ROOT.Char.GetFaith.HighGodName], Ta có thể vào trong lại..."
  travel_completion_event.1000.a.adventurer: "Cảm tạ [ROOT.Char.GetFaith.HighGodName], lại được nằm trên giường êm ái..."
  travel_completion_event.1000.b:1 "Du lịch thật kỳ diệu, nhưng trở về nhà ngọt ngào hơn nhiều."
  travel_completion_event.1000.b.adventurer: "Du lịch thật kỳ diệu, nhưng còn tuyệt hơn khi thoải mái."
  cultural_ambassador_cultural_acceptance_gain_desc:0 "Du lịch cùng Đại sứ Văn hóa"
  cultural_ambassador_toast.t:0 "[cultural_ambassador.GetFirstNameNoTooltip] tăng sự Chấp nhận Văn hóa"
  cultural_ambassador_option.tt:0 "Hiệu ứng từ Đại sứ Văn hóa của Ngài:\n$EFFECT_LIST_BULLET$Sự [cultural_acceptance|E] giữa mọi [culture|E] Ngài đã đến và [SCOPE.GetRootScope.GetCharacter.GetCulture.GetName] tăng thêm #positive_value +1%#!"

  finally_there_perk_title_message: "[GetPerk('finally_there_perk').GetName( GetNullCharacter )]"
  souvenirs_aplenty_perk_title_message: "[GetPerk('souvenirs_aplenty_perk').GetName( GetNullCharacter )]"
  no_stone_unturned_perk_title_message: "[GetPerk('no_stone_unturned_perk').GetName( GetNullCharacter )]"
  no_stone_unturned_perk_cooldown_title_message: "[GetPerk('no_stone_unturned_perk').GetName( GetNullCharacter )]: Không có hiệu ứng"
  no_stone_unturned_perk_cooldown_message: "Quận vẫn đang chịu ảnh hưởng từ lần ghé thăm trước của Ngài."
