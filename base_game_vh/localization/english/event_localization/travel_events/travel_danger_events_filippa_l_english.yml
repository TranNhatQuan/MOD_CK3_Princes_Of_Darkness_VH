l_english:
#Travel Danger Events
#Sea: Someone falls overboard
  travel_danger_events.4000.t:0 "$travel_danger_prefix$ [overboard_character.GetWomanMan|U] Rơi Xuống Biển!"
  travel_danger_events.4000.desc:0 "Những đợt sóng dữ dội đủ để khiến bất kỳ thủy thủ dày dạn kinh nghiệm nào cũng phải say sóng. Khi chúng ta chao đảo qua lại trên những ngọn sóng, những người trên tàu đang chậm rãi di chuyển để tìm nơi trú ẩn bên dưới.\n\nTa nhận thấy [overboard_character.GetTitledFirstName] đang nhìn ra phía ngoài lan can trước khi quay người bước đi của [overboard_character.GetHerHis] về phía boong tàu — nhưng trước khi bất kỳ ai kịp phản ứng, con tàu bất ngờ nghiêng hẳn sang một bên và [overboard_character.GetSheHe] ngã nhào xuống dòng nước tối tăm."
  travel_danger_events.4000.desc.again:0 "Biển không nhân nhượng trên đường đến [destination.GetNameNoTooltip]. Khi tiếp tục trải qua những cơn sóng dữ, ngay khi thuyền trưởng hô cảnh báo, mọi người lần này di chuyển nhanh xuống khoang.\n\nTuy nhiên, [overboard_character.GetTitledFirstName] vẫn chần chừ quá lâu và rơi xuống biển với một #EMP tiếng nước vỡ#!!"
  travel_danger_events.4000.desc.seriously:0 "Bằng cách nào đó, chúng Ta chắc đã khơi gợi cơn thịnh nộ của [ROOT.Char.GetFaith.WaterGodName]; biển lại nổi sóng và mọi người vội vàng xuống khoang trước khi thuyền trưởng kịp hô cảnh báo.\n\nKhi Ta chạy xuống khoang, Ta chợt thấy [overboard_character.GetTitledFirstName] vướng chân vào một sợi dây rời từ lan can. Một thủy thủ vội chạy đến bên [overboard_character.GetHerHis], nhưng quá muộn và với cú lắc tiếp theo của tàu, [overboard_character.GetFirstNameNoTooltip] lao xuống biển sâu!"
  travel_danger_events.4000.a:0 "Chúng ta phải cứu [overboard_character.GetHerHim]!"
  travel_danger_events.4000.a_again:0 "Lại nữa sao! Cứu [overboard_character.GetHerHim]!"
  travel_danger_events.4000.a_seriously:0 "Thật sao? [overboard_character.GetFirstNameNoTooltip], giữ chặt!"
  travel_danger_events.4000.a.saved.t:0 "Đã cứu"
  travel_danger_events.4000.a.saved.desc:0 "Thủy thủ tìm kiếm trên sóng và cứu [overboard_character.GetShortUIName]"
  travel_danger_events.4000.a.wounded.t:0 "Đã cứu nhưng bị thương"
  travel_danger_events.4000.a.wounded.desc:0 "Thủy thủ cứu [overboard_character.GetShortUIName] nhưng [overboard_character.GetSheHe] bị thương khi rơi"
  travel_danger_events.4000.a.failure.t:0 "Chết"
  travel_danger_events.4000.a.failure.desc:0 "[overboard_character.GetShortUIName] chết đuối"
  travel_danger_events.4000.b:0 "Không còn thời gian! Ta sẽ cứu [overboard_character.GetHerHim] tự mình!"
  travel_danger_events.4000.b_travel_leader:0 "[travel_leader.GetFirstNameNoTooltip], nhanh lên!"
  travel_danger_events.4000.b.flavor:0 "[overboard_character.GetFirstNameNoTooltip] #EMP phải# sống sót!"
  travel_danger_events.4000.c:0 "Quá muộn rồi."
  travel_danger_events.4000.c.flavor:0 "Gió sau sẽ giúp chúng ta đi nhanh hơn!"
 #Illness, an entourage member falls ill
  travel_danger_events.4010.t:1 "$travel_danger_prefix$ Mọi Thứ Ổn"
  travel_danger_events.4010.desc:0 "Việc du hành qua những môi trường đôi khi khắc nghiệt mang lại tác dụng tiếp thêm sinh lực cho ít nhất là tâm trạng và sinh khí #EMP của riêng ta#!.\n\nTuy nhiên, khi ta liếc nhìn sang [ill_character.GetTitledFirstName], [ill_character.GetSheHe] dường như không được ổn cho lắm. Mọi cử động của [ill_character.GetHerHis|U] đều vô cùng nặng nề, hơi thở của [ill_character.GetHerHis] hổn hển và những tràng ho bất chợt liên tục rung lên khắp cơ thể của [ill_character.GetHerHis] — rõ ràng là [ill_character.GetSheHe] đang bất an trong người."
  travel_danger_events.4010.desc_again:0 "Chúng ta vừa chuẩn bị nhổ trại vào buổi sáng, trên đường đến [destination.GetNameNoTooltip], thì ta tìm thấy [ill_character.GetTitledFirstName] trong nơi trú ngụ của [ill_character.GetHerHis], hơi thở dồn dập và mặt mũi nhợt nhạt như một tờ giấy. [ill_character.GetSheHe|U] nhăn mặt dưới cái nhìn dò xét của ta, rồi bật ra một tiếng ho khan dữ dội.\n\nPhải chăng [ill_character.GetFirstNameNoTooltip] cũng đã nhiễm phải thứ gì đó? Liệu đây có phải là bệnh dịch chăng?"
  travel_danger_events.4010.desc_sea:0 "Khi chúng Ta đi thuyền tới [destination.GetNameNoTooltip], không khí trong lành trên biển thật tốt cho ít nhất #EMP sức khỏe#! và sự hưng phấn của Ta. Tuy nhiên, không phải ai cũng may mắn như vậy.\n\nTa nhận thấy [ill_character.GetTitledFirstName] ngày càng yếu trong vài ngày qua, giờ thì chắc chắn [ill_character.GetSheHe] đã mắc phải một căn bệnh nào đó."
  travel_danger_events.4010.desc_sea_again:0 "Chúng Ta tiến khá tốt về [destination.GetNameNoTooltip], điều này làm Ta cảm thấy rất sảng khoái. Tuy nhiên, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('ill_character'))], [ill_character.GetTitledFirstName], dường như lại trải qua điều ngược lại.\n\nSáng nay Ta thấy [ill_character.GetHerHim] — dựa mạnh vào lan can với cơn ho khàn — và rõ ràng [ill_character.GetSheHe] cũng mắc phải thứ gì đó. Có phải là dịch bệnh?"
  travel_danger_events.4010.a:0 "Chúng ta nên để [ill_character.GetHerHim] nghỉ ngơi và hồi phục hoàn toàn."
  travel_danger_events.4010.a_sea:0 "Tìm một cảng để [ill_character.GetFirstNameNoTooltip] có thể nghỉ ngơi và hồi phục hoàn toàn."
  travel_danger_events.4010.b:0 "Ta nghĩ mình biết cách chữa."
  travel_danger_events.4010.b.flavor:0 "Một cành này, một chút kia..."
  travel_danger_events.4010.b.tt:0 "[ill_character.GetShortUINamePossessive] mắc [GetTrait('pneumonic').GetName( GetNullCharacter )]"
  travel_danger_events.4010.b.cured.t:0 "Đã chữa khỏi"
  travel_danger_events.4010.b.cured.desc:0 "[ill_character.GetSheHe|U] đã hồi phục hoàn toàn"
  travel_danger_events.4010.b.worsened.t:0 "Tình trạng xấu đi"
  travel_danger_events.4010.b.worsened.desc:0 "Tình trạng [ill_character.GetHerHis|U] trở nên xấu hơn"
  travel_danger_events.4010.c:0 "[medicine_person.GetTitledFirstNameNoTooltip], ngươi có thể chữa [ill_character.GetHerHim] không?"
  travel_danger_events.4010.d:0 "Thôi nào, ta vừa #EMP tìm ra cách...#!"
  travel_danger_events.4010.d.flavor:0 "Cơ hội để loại bỏ [ill_character.GetHerHim] một lần và mãi mãi!"
  travel_danger_events.4010.d.poisoned.t:0 "Chết"
  travel_danger_events.4010.d.poisoned.desc:0 "Ngươi đã đầu độc thành công [ill_character.GetHerHim]"
  travel_danger_events.4010.d.failure.t:0 "Bị phát hiện"
  travel_danger_events.4010.d.failure.desc:0 "[ill_character.GetSheHe|U] phát hiện ra"
  travel_danger_events.4010.e:0 "Chỉ là một cơn ho nhỏ."
  travel_danger_events.4010.e.flavor:0 "Ta đã thấy tệ hơn."
  travel_danger_events.4010.e.pneumonic.t:0 "Viêm phổi"
  travel_danger_events.4010.e.no_change.t:0 "Không thay đổi"
  every_patient_entourage_tt:0 "Mọi thành viên trong đoàn [GetTrait('patient').GetName( GetNullCharacter )]"
