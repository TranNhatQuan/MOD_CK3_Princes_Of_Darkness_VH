l_english:
#Travel Flavor Events
#Troll bridge - you encounter a troll bridge.
  travel_events.5100.t: "Cây cầu của [ROOT.Char.GetCurrentLocation.Custom('GetProvinceTricksterSpirit')|U]"
  travel_events.5100.desc: "“Thưa Ngài! Cây cầu này mang tiếng ác đã lâu. Một con [ROOT.Char.GetCurrentLocation.Custom('GetProvinceTricksterSpirit')] đang trú ngụ bên dưới nó!” [ROOT.Char.Custom2('RelationToMe', superstitious_traveler)] của ta, [superstitious_traveler.GetTitledFirstName], thốt lên đầy sợ hãi. “Chắc chắn nó sẽ vồ lấy chúng ta, hoặc gieo rắc lời nguyền từ xa khi ta đi ngang qua.”\n\nĐoàn tùy tùng bắt đầu bàn tán xôn xao. Có kẻ đã vội cầu khẩn danh thánh của [ROOT.Char.GetFaith.HighGodName] để cầu mong sự che chở. Ngặt nỗi, đây là nơi duy nhất có thể băng qua sông trong vòng dặm dài quanh đây."
  travel_events.5100.a: "“Ta chẳng sợ bất kỳ [ROOT.Char.GetCurrentLocation.Custom('GetProvinceTricksterSpirit')] hay yêu quỷ nào hết!”"
  travel_events.5100.b: "“Làm gì có những thứ quỷ quái đó chứ, [superstitious_traveler.GetTitledFirstNameNoTooltip].”"
  travel_events.5100.c: "“Chúng ta phải hiệp lòng cầu nguyện để xua đuổi tà linh này.”"
  travel_events.5100.d: "“Thật đáng kinh hãi! Hãy tìm đường khác để đi vòng qua thôi.”"
  custom.every_brave_or_impatient_entourage_member: "Mọi thành viên [GetTrait('brave').GetName( GetNullCharacter )] hoặc [GetTrait('impatient').GetName( GetNullCharacter )] trong đoàn"
  custom.every_cynical_or_impatient_entourage_member: "Mọi thành viên [GetTrait('cynical').GetName( GetNullCharacter )] hoặc [GetTrait('impatient').GetName( GetNullCharacter )] trong đoàn"
  custom.every_eccentric_or_zealous_entourage_member: "Mọi thành viên [GetTrait('eccentric').GetName( GetNullCharacter )] hoặc [GetTrait('zealous').GetName( GetNullCharacter )] trong đoàn"
  custom.every_craven_or_impatient_entourage_member: "Mọi thành viên [GetTrait('craven').GetName( GetNullCharacter )] hoặc [GetTrait('impatient').GetName( GetNullCharacter )] trong đoàn"
