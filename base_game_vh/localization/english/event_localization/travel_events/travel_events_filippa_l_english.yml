l_english:
#Travel Flavor Events
#Good omen? - Encounter a duck
  travel_events.2000.t:0 "Con Vịt Gì Thế?"
  travel_events.2000.desc:0 "Ngày trên đường khá yên ắng và tẻ nhạt cho tới giờ. Chúng Ta đang ở đâu đó bên ngoài [ROOT.Char.GetCurrentLocation.GetName] và Ta nhắm mắt khi thú cưỡi của Ta đưa Ta tiến về phía trước, từng bước vững chắc.\n\nKhi gió thổi qua những tán cây tạo thành một giai điệu tuyệt vời, một tiếng động khác theo làn gió, và không phải từ đoàn hộ tống. Có phải… tiếng vịt kêu không?\n\n"
  travel_events.2000.desc_meh_memory:0 "Ta tìm quanh để xem con vịt. Lần cuối Ta theo một con vịt vào rừng mọi chuyện trở nên… khó xử."
  travel_events.2000.desc_delicious_memory:0 "Lần cuối Ta theo một con vịt vào rừng Ta có một bữa ăn #EMP ngon tuyệt#!. Có lẽ hôm nay là ngày may mắn của Ta?"
  travel_events.2000.desc_good_memory:0 "Ta nhớ một cách trìu mến lần gặp con vịt trong rừng trước đây. Nó dẫn Ta tới một tổ đầy #EMP vịt con mềm mại#!."
  travel_events.2000.desc_bad_memory:0 "Ta do dự một chút, nhớ lại lần cuối Ta theo một con vịt vào rừng. Kết quả không tốt."
  travel_events.2000.desc_default:0 "Ta xác định âm thanh phát ra từ một bụi cây phía tay phải."
  travel_events.2000.a:0 "Đây là một điềm lành."
  travel_events.2000.a_sadist:0 "Chuyện này thật ngớ ngẩn."
  travel_events.2000.b:0 "Theo con vịt đó!"
  travel_events.2000.b_sadist:0 "Ta đoán Ta có thể theo nó..."
  travel_events.2000.b.tt:0 "Ngài theo con vịt một lúc"
  travel_events.2000.c:0 "Ghê, con chim phiền phức! Đi đi!"
  travel_events.2000.c.tt:0 "Ngài ném một viên sỏi về phía tiếng kêu vịt."

#Duck follow-up
  travel_events.2001.t_positive:0 "Đây Là..."
  travel_events.2001.t_negative:0 "Đó Không Phải Vịt!"
  travel_events.2001.t:0 "Quạc!"
  travel_events.2001.intro:0 "Ta xuống ngựa và tìm thấy con vịt trong bụi cây gần đó. Nó bắt đầu đi về phía hoang dã, và Ta theo chân nó bộ hành."
  travel_events.2001.desc_positive:0 "\n\nKhi Ta tiếp tục đi, tiếng kêu nhẹ nhàng dần được hòa cùng — lúc đầu nhỏ, rồi lớn dần — bởi một dàn tiếng líu lo của những con vịt con. Khi Ta rẽ qua bụi cây tiếp theo, Ta thấy không chỉ một con vịt mà là một #EMP đàn#! vịt và tổ vịt con!"
  travel_events.2001.desc_positive_sadist:0 "\n\nTa cảm thấy bụng mình kêu lên khi nhìn thấy những con vịt và vịt con mềm mại."
  travel_events.2001.desc_positive_default:0 "\n\nĐầu gối Ta mềm nhũn khi chiêm ngưỡng sự mềm mại tuyệt vời của tất cả."
  travel_events.2001.desc_negative:0 "\n\nKhi Ta lạc xa đoàn hộ tống, một cảm giác lạnh chạy dọc sống lưng. Có gì đó đang theo dõi Ta?\n\nĐột nhiên, một [ROOT.Char.Custom('RegionalFerociousAnimal')] xuất hiện ở rìa bụi rậm! Nó phì và nhìn Ta với đôi mắt giận dữ."
  travel_events.2001.desc:0 "\n\nĐột nhiên, con vịt dừng lại và nghiêng đầu về phía Ta, rõ ràng bối rối vì có một người theo sau.\n\nTa mỉm cười với con vịt, cố gắng xoa dịu căng thẳng, nhưng nó bất ngờ vùng vẫy, vỗ cánh và bay đi."
  travel_events.2001.a:0 "Chuyện này… #EMP quá sức!#!"
  travel_events.2001.a_tt:0 "#EMP Thú Vị#!"
  travel_events.2001.a_tt_death:0 "Sự dễ thương quá mức cho trái tim yếu ớt của Ngài"
  travel_events.2001.b:0 "Những con này sẽ làm một bữa nướng hoàn hảo..."
  travel_events.2001.b_success.tt:0 "Bữa Ăn Ngon"
  travel_events.2001.b_failure.tt:0 "Bị Nghẹn"
  travel_events.2001.c:0 "Điều này #EMP tệ lắm!#!"
  travel_events.2001.c_success.tt:0 "Thành Công"
  travel_events.2001.c_ran:0 "Ngài chạy trốn thành công"
  travel_events.2001.c_failure.tt:0 "Bị Thương"
  travel_events.2001.c_hit_and_ran:0 "Ngài bị thương nhưng chạy thoát"
  travel_events.2001.c_critical_failure:0 "Quái vật làm Ngài bị thương nặng"
  travel_events.2001.d:0 "En garde!"
  travel_events.2001.d_scare_beast:0 "Ngài dọa con thú đi"
  travel_events.2001.d_beast_hit:0 "Con thú phản công nhưng bỏ chạy"
  travel_events.2001.e:0 "Một cuộc rượt đuổi… #EMP vịt#! hoang dã?"

#Crossing an ant path - Ignore or don't ignore your guide
  travel_events.2002.t:0 "Con Đường Bị Dẫm"
  travel_events.2002.desc:0 "Đoàn tùy tùng đã phải dừng lại ở nơi cách [ROOT.Char.GetCurrentLocation.GetName] chỉ một cái ném đá. Ta nhìn sang và thấy [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guide_leader'))] của ta, [guide_leader.GetFirstName], đã xuống ngựa và đang chăm chú nhìn vào thứ gì đó dưới mặt đất. Những thành viên khác trong đoàn đã tụ tập quanh [guide_leader.GetHerHim].\n\n[guide_leader.GetFirstNameNoTooltip] ngước lên nhìn khi ta tiến lại gần. "[ROOT.Char.Custom('FormOfAddressForLiege')|U], có một đường kiến bò ở đây. Thần có lẽ hơi mê tín một chút, nhưng ngài tuyệt đối không bao giờ được băng qua một con đường kiến bò."\n\n[guide_leader.GetSheHe|U] ngập ngừng một lát. "Cố [great_grand_parent.Custom('MotherFather')] của thần đã từng làm vậy, và [great_grand_parent.GetSheHe] đã không bao giờ có thể trở về nhà nữa.""
  travel_events.2002.a:0 "#EMP Được rồi#!. Chúng ta sẽ tìm một lối khác."
  travel_events.2002.b:1 "Chuyện vô lý. Ta sẽ làm hướng dẫn!"
  travel_events.2002.c:0 "Ta có phương pháp chữa mê tín của Ngài đây."
  travel_competent_guide_tt:0 "Ngài là hướng dẫn viên có năng lực"
  travel.competent_guide:0 "$travel_competent_guide_tt$"
  travel_get_lost_tt:0 "Ngài bị lạc"

#Visit the local military place (barrack/military camp/regiment grounds) - Try to improve your martial
  travel_events.2003.t:0 "Học Hỏi Về Võ Thuật"
  travel_events.2003.intro:0 "[local_captain.GetFirstName], vị chỉ huy địa phương, cùng một vài sĩ quan của [local_captain.GetHerHis] chào đón Ta khi đoàn hộ tống vào doanh trại quân sự của [ROOT.Char.GetCurrentLocation.GetName]."
  travel_events.2003.desc_barracks:0 "Ta nhanh chóng xuống ngựa, háo hức kiểm tra doanh trại địa phương, nơi đầy hoạt động."
  travel_events.2003.desc_regiment:0 "Ta quan sát nhanh khu vực quân đoàn rồi xuống ngựa, các nhóm binh sĩ đang tham gia lập kế hoạch tác chiến."
  travel_events.2003.desc_camp:1 "Khi [local_captain.GetSheHe] đi dạo, Ta nhanh chóng xuống ngựa và theo [local_captain.GetHerHim] qua các trang bị vây công mới nhất."
  travel_events.2003.outro:0 "\n\nTa gật đầu, trân trọng sự hỗn loạn có tổ chức mà Ta quan sát được.\n\"Vậy, [ROOT.Char.Custom('FormOfAddressForLiege')] muốn làm gì tiếp theo?\" [local_captain.GetFirstNameNoTooltip] nhìn Ta đầy trông đợi."
  travel_events.2003.a:0 "Ta không ngại giao đấu một chút!"
  travel_events.2003.a_sparring_tt:0 "Ngài giao đấu thành công với binh sĩ"
  travel_events.2003.a_wounded_tt:0 "Ngài vô tình bị thương"
  travel_events.2003.b:0 "Cái cỗ máy kia là gì?"
  travel_events.2003.b_success_tt:0 "Học Võ Thành Công"
  travel_events.2003.b_learn_tt:0 "Ngài học được gì đó từ việc nghiên cứu thiết bị"
  travel_events.2003.b_failure_tt:0 "Bị Phát Hiện"
  travel_events.2003.b_spy_tt:0 "[county_liege.GetShortUIName] nghĩ Ngài đang gián điệp"
  travel_events.2003.b_cut_tt:0 "Ngài vô tình cắt vào thiết bị"
  travel_events.2003.c:0 "Ngài nên gia nhập cùng Ta."
  travel_events.2003.c_success_tt:0 "Tuyển Bí Mật"
  travel_events.2003.c_secret_tt:0 "[county_liege.GetShortUIName] không phát hiện việc Ngài lén tuyển"
  travel_events.2003.c_found_out_tt:0 "[county_liege.GetShortUIName] phát hiện việc Ngài lén tuyển"
  travel_events.2003.d:0 "Thực ra Ta có việc phải đi…"

#Visit (your own) crappy pasture - Try to address or ignore the issues
  travel_events.2004.t:0 "Đồng Cỏ Tệ Hại"
  travel_events.2004.desc:0 "Mùi hôi thối tấn công mũi Ta như một cú đấm nồng nặc. Gia súc trông ốm yếu khi Ta nhìn quanh các đồng cỏ ngay tại [ROOT.Char.GetCurrentLocation.GetName].\n\nNông dân làm việc ở đây lê bước và lang thang vô định cố tỏ ra bận rộn. Thiếu động lực và tinh thần rõ rệt của họ ảnh hưởng đến toàn bộ dân cư, phát triển khu vực rõ ràng đã tê liệt.\n\nTa rùng mình khi lãnh đạo địa phương, [local_farmer.GetFirstName], tiến tới. Thật là một nơi quản lý tệ hại!"
  travel_events.2004.a:0 "Một con lợn mù cũng điều hành nơi này tốt hơn, [local_farmer.GetFirstNameNoTooltip]."
  travel_events.2004.a_success_tt:0 "Lời phê bình được tiếp thu"
  travel_events.2004.a_critique_success_tt:0 "[local_farmer.GetShortUIName] tiếp nhận lời phê bình của Ngài"
  travel_events.2004.a_failure_tt:0 "Lời phê bình bị bác bỏ"
  travel_events.2004.a_critique_reject_tt:0 "[local_farmer.GetShortUIName] từ chối lời phê bình của Ngài"
  travel_events.2004.b:0 "Ta cần ngựa của Ngài. Ngay bây giờ."
  travel_events.2004.c:0 "Ta có việc quan trọng hơn."

#Visit another ruler's pasture - Give advice or sabotage the pasture
  travel_events.2005.t:0 "Đồng Cỏ Người Khác"
  travel_events.2005.desc:0 "Một ngày đẹp trời như thế này, thời tiết thật dễ chịu, đồng cỏ của [ROOT.Char.GetCurrentLocation.GetName] trông tuyệt vời và gia súc địa phương nhảy múa, reo hò theo cách ù ù đặc trưng của chúng. Những con bê đi bên cạnh mẹ chúng, bộ lông bóng mượt và sạch sẽ.\n\nNhìn chung nơi này được quản lý rất tốt, mặc dù Ta nhận ra vài chi tiết hơi lạ mà Ta sẽ xử lý khác đi một chút.\n\n[local_farmer.Custom('MatriarchPatriarch')] địa phương tiến tới. \"Một buổi sáng tốt lành tới Ngài, [ROOT.Char.Custom('FormOfAddressForLiege')]! Những sinh vật xinh đẹp này không phải là cảnh tượng tuyệt vời sao?\""
  travel_events.2005.a:1 "Ta có thể áp dụng vài điều này về nhà!"
  travel_events.2005.a_success_tt:0 "Lời Khuyên Thành Công"
  travel_events.2005.a_implemented_tt:0 "Lời khuyên của Ngài đã được áp dụng thành công"
  travel_events.2005.a_failure_tt:0 "Lời Khuyên Bị Hiểu Sai"
  travel_events.2005.a_misinterpreted_tt:0 "Lời khuyên của Ngài bị hiểu hoàn toàn sai"
  travel_events.2005.b:0 "Hãy xem liệu chúng ta có thể cải thiện mọi thứ quanh đây không."
 #travel_events.2005.b_success_tt:0 "Sabotage Successful"
 #travel_events.2005.b_sabotage_tt:0 "Your sabotage is successful and secretive"
 #travel_events.2005.b_failure_tt:0 "Sabotage Averted"
 #travel_events.2005.b_averted_tt:0 "Your #EMP sabotage#! actually fixes some local problems"
  travel_events.2005.c:0 "Ta chắc rằng [county_liege.GetTitledFirstNameNoTooltip] có thể chăm sóc đồng cỏ của [county_liege.GetHerHis]."
#Visit a camel farm - Get defiled by a camel
  travel_events.2006.t:0 "Lại Là Lạc Đà?"
  travel_events.2006.desc:0 "Mặt trời đang cao trên trại lạc đà ở [ROOT.Char.GetCurrentLocation.GetName], và Ta tìm bóng mát dưới các tấm da căng che một số khu vực của trại. Một tiếng rên đột ngột làm Ta giật mình, và Ta quay lại.\n\nBên cạnh Ta, một trong những sinh vật hùng vĩ có cùng ý tưởng và trú dưới bóng râm. Ta cúi xuống vỗ đầu dài của nó, khi con vật #EMP trong một động tác nhanh quật Ta vào trán và nhổ vào má Ta#!.\n\nKhi Ta lấy lại bình tĩnh, Ta thấy chủ nhân nó đứng chỉ khoảng hai mươi bước, sửng sốt."
  travel_events.2006.a:0 "Ngài và sinh vật của Ngài cần học phép lịch sự!"
  travel_events.2006.a_tt:0 "Ngài quất sinh vật và chủ nhân của nó."
  travel_events.2006.b:0 "Đầu con vật này sẽ là một #EMP lời cảnh báo tuyệt vời#!"
  travel_events.2006.b_tt:0 "Ngài chặt đầu lạc đà"
  travel_events.2006_camel_head:0 "Đầu Lạc Đà"
  travel_events.2006_camel_head_desc:0 "Đầu của một con lạc đà cứng đầu."
  travel_events.2006.c:1 "Sinh vật chỉ là một kẻ vô tri vô giác."

#Visit an elephant pen - Train with the elephants
  travel_events.2007.t:0 "Voi Tuyệt Vời"
  travel_events.2007.desc_memory:0 "Ta nhìn nghi ngờ những con vật khổng lồ tại chuồng voi [ROOT.Char.GetCurrentLocation.GetName], vẫn còn hơi ám ảnh từ khi "
  travel_events.2007.desc_memory_rival:0 "đối thủ "
  travel_events.2007.desc_memory_nemesis:0 "kẻ thù "
  travel_events.2007.desc_memory_segway:0 "[crushing_person.GetTitledFirstName] suýt bị một con ngồi lên Ta "
  travel_events.2007.desc_memory_here:0 "tại chính chỗ này."
  travel_events.2007.desc_memory_not_here:0 "ở [elephant_memory.Var('elephant_location').GetProvince.GetName] [elephant_memory.Var('elephant_location').GetTerrain.GetName]"
  travel_events.2007.desc_default:0 "Những con vật uy nghiêm tại chuồng voi [ROOT.Char.GetCurrentLocation.GetName] thực sự ấn tượng. Ta quan sát chúng khi mang gỗ và tham gia các bài tập thể chất."
  travel_events.2007.desc_outro:0 "\n\nKhi Ta quan sát voi làm nhiệm vụ, Ta nghe lỏm vài người quản tượng bàn về các cách huấn luyện chúng.\n\nNghe có vẻ khá vất vả, và thực sự khiến Ta hứng thú."
  travel_events.2007.a:0 "Điều này chẳng thấm gì với #EMP [ROOT.Char.GetTitleAsNameNoTooltip|U]#!"
  travel_events.2007.a_success_tt:0 "Huấn Luyện Hiệu Quả"
  travel_events.2007.a_efficient_training_tt:0 "Buổi huấn luyện diễn ra hoàn hảo"
  travel_events.2007.a_soft_success_tt:0 "Huấn Luyện Ổn"
  travel_events.2007.a_alright_training_tt:0 "Buổi huấn luyện ổn"
  travel_events.2007.a_failure_tt:0 "Huấn Luyện Tệ"
  travel_events.2007.a_failed_training_tt:0 "Ngài vấp chân"
  travel_events.2007.b:0 "Ta sẽ không lãng phí thời gian."

#Visit an elephant pen, your rival is on site - Attempt to crush your rival?
  travel_events.2008.t:0 "Ngồi Đi"
  travel_events.2008.desc:0 "Mồ hôi chảy xuống khuôn mặt khi cái nóng rừng rực tràn tới. Dừng lại lau trán, Ta thấy [elephant_rival.Custom2('InsultNoun', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('elephant_rival'))], [elephant_rival.GetTitledFirstName], gần chuồng voi địa phương tại [ROOT.Char.GetCurrentLocation.GetName].\n\n[elephant_rival.GetSheHe|U] làm cử chỉ thô lỗ và cười lớn, chắc chắn là chế giễu Ta. Ta nghiến chặt hàm.\n\nLúc đó Ta nhận ra [elephant_rival.GetTitledFirstNameNoTooltip] đang đứng #EMP ngay sau con voi#!, và con vật đang di chuyển. Ta kịp thu hút sự chú ý của người quản tượng."
  travel_events.2008.a:0 "[ROOT.Char.Custom('RandomElephantName')], #EMP ngồi!#!"
  travel_events.2008.a_success_tt:0 "Đè Bẹp Voi"
  travel_events.2008.a_crushed_tt:0 "[elephant_rival.GetShortUIName] bị voi đè bẹp"
  travel_events.2008.a_soft_success_tt:0 "Bán Bẹp"
  travel_events.2008.a_wounded_tt:0 "[elephant_rival.GetShortUIName] bị thương"
  travel_events.2008.a_failure_tt:0 "[elephant_rival.GetTitledFirstNameNoTooltip] Thoát"
  travel_events.2008.a_scotfree_tt:0 "[elephant_rival.GetShortUIName] trốn khỏi voi"
  travel_events.2008.b:0 "[elephant_rival.GetTitledFirstNameNoTooltip], cẩn thận!"

#Visit an orchard - Kid falls out of tree
  travel_events.2010.t:0 "Cành Cây Gãy"
  travel_events.2010.temperate_summer:0 "Cơn gió ấm áp vuốt ve cổ Ta khi Ta đi quanh vườn cây ăn quả ở [ROOT.Char.GetCurrentLocation.GetName]. Cây nghiêng mình về phía trời, pha trộn giữa cành non và trái đang hình thành."
  travel_events.2010.temperate_winter:0 "Không khí lạnh, hơi thở Ta bốc thành những đám sương nhỏ khi đi qua vườn cây ăn quả ở [ROOT.Char.GetCurrentLocation.GetName]. Cây dường như co rúm trong giá lạnh, mong ngày ấm hơn."
  travel_events.2010.tropical_summer:0 "Nhiệt độ oi bức khi Ta đi qua vườn cây ăn quả ở [ROOT.Char.GetCurrentLocation.GetName]. Xung quanh Ta, cây trổ đầy hoa, ăn mừng mùa vụ."
  travel_events.2010.tropical_winter:0 "Cuối cùng là thời tiết ôn hòa để dạo vườn cây ở [ROOT.Char.GetCurrentLocation.GetName], Ta tranh thủ đi dạo. Cây ngủ đông nhưng vẫn xanh, chờ mùa ấm."
  travel_events.2010.fallback:0 "Cây vươn lên trời khi Ta đi giữa các hàng thân cây được bố trí cẩn thận tại vườn cây địa phương ở [ROOT.Char.GetCurrentLocation.GetName]. Một ngày tốt để dạo chơi."
  travel_events.2010.desc:0 "\n\nĐột nhiên, một tiếng thét chói tai vang lên. Ta bước nhanh hơn chỉ để thấy "
  travel_events.2010.entourage:0 " [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fallen_child'))] [fallen_child.GetFirstName] "
  travel_events.2010.peasant:0 "một đứa trẻ nông dân "
  travel_events.2010.outro:0 "dưới gốc cây, rối bời và khóc lóc dữ dội.\n\nCó vẻ như [fallen_child.GetSheHe] cố trèo cây, trước khi trượt và rơi xuống đất. Một số xương lộ ra ở góc kỳ lạ."
  travel_events.2010.a:0 "Những cây này thật nguy hiểm!"
  travel_events.2010.a_flavor:0 "Đốt sạch nơi này đi!"
  travel_events.2010.a_tt:0 "Chấn thương của [fallen_child.GetShortUINamePossessive] có thể tồi tệ hơn"
  travel_events.2010.a_tt_2:0 "[ROOT.Char.GetTitledFirstName] đã đốt vườn cây của Ngài ở [location_county.GetNameNoTier]!"
  travel_events.2010.b:0 "Ngài đang nghĩ gì, [fallen_child.GetFirstNameNoTooltip]!"
  travel_events.2010.b_tt:0 "Thuộc tính Mới"
  travel_events.2010.c:0 "Đừng lo."
  travel_events.2010.c_physician:0 "Để Ta khám cho Ngài, trẻ ạ."
  travel_events.2010.c_physician_tt:0 "[court_physician.GetShortUIName] chăm sóc [fallen_child.GetShortUIName]"
  travel_events.2010.d:0 "Trẻ nhỏ [fallen_child.Custom('GirlBoyPlural')|U] thì chung quy vẫn chỉ là lũ trẻ nhỏ [fallen_child.Custom('GirlBoyPlural')]."

#Orchard hidden follow-up event
  travel_events.2011.tt_healed:0 "Vết Thương Đã Lành"
  travel_events.2011.tt_healed_desc:0 "Vết thương của [fallen_child.GetShortUINamePossessive] đã lành"
  travel_events.2011.tt_worsened:0 "Vết Thương Xấu Đi"
  travel_events.2011.tt_worsened_desc:0 "Vết thương của [fallen_child.GetShortUINamePossessive] tệ hơn"

#Visit a plantation - Fire!
  travel_events.2012.t:0 "Lửa!"
  travel_events.2012.desc:0 "Chúng Ta đi qua những vùng nặng nề với nông nghiệp. Điểm dừng tiếp theo là đồn điền địa phương ở [ROOT.Char.GetCurrentLocation.GetName], nhưng khi nhìn thấy cổng khoảng một trăm bước, Ta nhận ra điều gì đó không ổn...\n\nTa hít vào mùi khét của… khói? Khói? Lửa! Ta đột nhiên thấy cột khói hình thành trên đồn điền.\n\nCột khói dày và nặng — quá lớn để chỉ là một người lao công đốt vài mảnh vụn."
  travel_events.2012.a:0 "[guard_type_character.GetFirstNameNoTooltip], nhanh lên! Lấy xô đi!"
  travel_events.2012.a_unscathed:0 "Ngọn lửa Tắt"
  travel_events.2012.a_unscathed_desc:0 "[guard_type_character.GetShortUIName] dập tắt đám cháy"
  travel_events.2012.a_scarred:0 "Dập Tắt Nhưng Bị Thương"
  travel_events.2012.a_scarred_desc:0 "[guard_type_character.GetShortUIName] dập tắt đám cháy nhưng bị sẹo"
  travel_events.2012.a_death:0 "Dập Tắt Nhưng Chết"
  travel_events.2012.a_death_desc:0 "[guard_type_character.GetShortUIName] dập tắt đám cháy nhưng chết trong quá trình"
  travel_events.2012.b:0 "Hãy sơ tán người dân khỏi nhà làm việc!"
  travel_events.2012.b_unscathed:0 "Người an toàn"
  travel_events.2012.b_unscathed_desc:0 "Ngài cứu công nhân an toàn"
  travel_events.2012.b_scarred:0 "Bị Sẹo"
  travel_events.2012.b_scarred_desc:0 "Ngài cứu công nhân nhưng bị sẹo"
  travel_events.2012.b_tt:0 "Ý kiến của đoàn hộ tống về Ngài tăng đáng kể"
  travel_events.2012.c:0 "#EMP Vậy thì#!, phải chăng đây là cơ hội..."
  travel_events.2012.c_secret:0 "Cướp Bí Mật"
  travel_events.2012.c_secret_desc:0 "Hành vi cướp của của Ngài vẫn bí mật"
  travel_events.2012.c_revealed:0 "Cướp Bị Phát Hiện"
  travel_events.2012.c_revealed_desc:0 "Hành vi cướp của của Ngài bị [county_liege.GetShortUIName] phát hiện"
  travel_events.2012.c_tt:0 "Ý kiến của các thành viên đoàn về Ngài giảm mạnh"
  travel_events.2012.d:0 "Chúng ta chưa từng ở đây."
  travel_events.2012.d_flavor:0 "Đoàn lặng lẽ rút lui."
  travel_events.2012.d_tt:0 "Ý kiến của đoàn về Ngài giảm"

#Visit a hillfort - Train to gain military skillz
  travel_events.2013.t:0 "Kiến Thức Phòng Thủ"
  travel_events.2013.intro:0 "Độ cao và không khí trong lành ở [ROOT.Char.GetCurrentLocation.GetName] thật dễ chịu khi chúng Ta đi qua pháo đài đồi địa phương."
  travel_events.2013.martial:0 "\n\nTa chăm chú quan sát các binh sĩ tập luyện bên dưới. Chiến thuật của họ không hoàn toàn xa lạ với Ta, vì Ta đã được huấn luyện võ thuật."
  travel_events.2013.default:0 "\n\nCác binh sĩ trong thung lũng có vẻ đang luyện tập kỹ thuật hiếm mà Ta chưa từng thấy. Ta tiến lại gần, không kìm được sự tò mò."
  travel_events.2013.outro:0 "\n\nTrong khi đó, chỉ huy địa phương, [local_captain.GetFirstNameNoTooltip], tiến đến: \"Ngài có muốn tham gia không, [ROOT.Char.Custom('FormOfAddressForLiege')]?\""
  travel_events.2013.rough_terrain:0 "trở thành chuyên gia về địa hình khó"
  travel_events.2013.reckless:0 "trở nên liều lĩnh"
  travel_events.2013.a:0 "Ta luôn sẵn sàng thử thách!"
  travel_events.2013.a_success.tt:0 "Thuộc tính Mới"
  travel_events.2013.a_failure.tt:0 "Huấn Luyện Thất Bại"
  travel_events.2013.a_rough_terrain:0 "Ngài trở thành chuyên gia về địa hình khó"
  travel_events.2013.a_reckless:0 "Ngài trở nên liều lĩnh"
  travel_events.2013.a_failed:0 "Buổi huấn luyện thất bại"
  travel_events.2013.b:0 "[entourage_heir.GetFirstNameNoTooltip], tham gia cùng [local_captain.GetWomanMan]."
  travel_events.2013.b_rough_terrain:0 "[entourage_heir.GetShortUIName] $travel_events.2013.rough_terrain$"
  travel_events.2013.b_reckless:0 "[entourage_heir.GetShortUIName] $travel_events.2013.reckless$"
  travel_events.2013.c:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guard_type_character'))] của Ta chắc chắn sẽ hưởng lợi từ chế độ huấn luyện này."
  travel_events.2013.c_rough_terrain:0 "[guard_type_character.GetShortUIName] $travel_events.2013.rough_terrain$"
  travel_events.2013.c_reckless:0 "[guard_type_character.GetShortUIName] $travel_events.2013.reckless$"
  travel_events.2013.d:0 "Thực ra, Ta sẽ ở lại để ngắm cảnh."
  travel_events.2013.e:0 "Thật tiếc, chúng Ta đang vội."

#Visit a logging camp - Burn off some stress chopping wood
  travel_events.2014.t:0 "Chặt, Chặt"
  travel_events.2014.desc:0 "Khối gỗ khổng lồ giữa trại khai thác gỗ ở [ROOT.Char.GetCurrentLocation.GetName] đã được dùng nhiều. Trông như thể luôn tồn tại ở đó, ngay cả trước khi con người xuất hiện.\n\nVai Ta căng và cẳng tay hơi run vì căng thẳng khi tiếp cận thân cây tuyệt vời.\n\nTa cẩn thận đặt một mảnh gỗ bỏ đi lên bục, và trong một động tác nhanh, Ta giơ rìu."
  travel_events.2014.a:0 "#EMP Huraagh!#!"
  travel_events.2014.a_flavor:0 "Đập #EMP đi#!, căng thẳng!"
  travel_events.2014.a_stress_tt:0 "Giảm Căng Thẳng"
  travel_events.2014.a_great_stress_desc:0 "Ngài giảm căng thẳng rất nhiều"
  travel_events.2014.a_stress_desc:0 "Ngài giảm căng thẳng"
  travel_events.2014.a_injured_tt:0 "Bị Thương"
  travel_events.2014.a_injured_desc:0 "Ngài vô tình làm mình bị thương"
  travel_events.2014.b:0 "... không, lao động tay chân không dành cho Ta."
  travel_events.2014.b_flavor:0 "Ngài đặt rìu xuống."

#Visit a peat quarry - Try not to fall asleep
  travel_events.2015.t:0 "Than Bùn, Kể Thêm Đi..."
  travel_events.2015.desc:0 "[quarry_guide.GetTitledFirstName|U] tỏ ra háo hức như một đứa trẻ khi [quarry_guide.GetSheHe] dẫn Ta thăm mỏ than bùn ở [ROOT.Char.GetCurrentLocation.GetName]. Vì lý do không thể hiểu được, [quarry_guide.GetSheHe] dường như nghĩ nơi này là viên ngọc trong vương miện cỏ xanh của [quarry_guide.GetHerHis].\n\nTa nhìn ra cánh đồng bị tàn phá, toàn màu nâu và xanh xám.\nMi mắt Ta trở nên nặng trĩu. Gần đây, giấc ngủ cứ tránh xa Ta. Chậm rãi, chúng khép lại...\n\nĐột nhiên Ta giật mình tỉnh dậy, tay [quarry_guide.GetFirstNamePossessiveNoTooltip] nắm lấy tay áo Ta.\n"... Ta có làm #EMP chán Ngài#! không?""
  travel_events.2015.a:0 "Ta chỉ đang thưởng thức tất cả thôi!"
  travel_events.2015.a_convinced_tt:0 "Thuyết Phục"
  travel_events.2015.a_convinced_desc:0 "Ngài thuyết phục thành công [quarry_guide.GetShortUIName]"
  travel_events.2015.a_insulted_tt:0 "Bị Lăng Mạ"
  travel_events.2015.a_insulted_desc:0 "[quarry_guide.GetShortUIName] cảm thấy bị xúc phạm"
  travel_events.2015.b:0 "Nhìn cái túi tiền này..."
  travel_events.2015.b_flavor:0 "Ngài hối lộ [quarry_guide.GetShortUIName]"
#Visit a hill farm - Bull rush!
  travel_events.2016.t:0 "Con Bò Hung Hăng?"
  travel_events.2016.desc:1 "Tiếng bò nhẹ nhàng và mùi phân không phải là tất cả những gì cánh đồng đồi núi ở [ROOT.Char.GetCurrentLocation.GetName] mang lại cho khách thăm. Còn có những tiếng la hét của nông dân, tiếng rống vang trời, và một con bò bỏ trốn trên đường trước mặt chúng Ta.\n\nQuái vật khổng lồ chạy tới chạy lui trong hoảng loạn, cho tới khi nhắm vào một nạn nhân: [entourage_member.GetFirstName], trên lưng con ngựa hoảng loạn của [entourage_member.GetHerHis].\n\nCó một cổng mở để giữ quái vật phía sau — chỉ cần một người đủ dũng cảm dụ nó!"
  travel_events.2016.a:0 "Qua bên này, đồ bò mộng [bull_loc.Custom2('InsultAdjective', ROOT.Char)]!"
  travel_events.2016.a_captured.tt:0 "Bắt Được"
  travel_events.2016.a_captured.desc:0 "Ngài bắt được con bò thành công"
  travel_events.2016.a_wounded.tt:0 "$travel_events.2001.c_failure.tt$"
  travel_events.2016.a_wounded.desc:0 "Con bò bị bắt nhưng Ngài bị thương"
  travel_events.2016.b:1 "[guard_type_character.GetFirstNameNoTooltip], #EMP làm gì đi chứ!#!"
  travel_events.2016.b_putdown.tt:0 "Đặt Xuống"
  travel_events.2016.b_putdown.desc:1 "[guard_type_character.GetShortUIName] dập con bò để kết thúc nỗi khổ"
  travel_events.2016.b_wounded.desc:1 "[guard_type_character.GetShortUIName] bị trúng đòn"
  travel_events.2016.c:0 "Tốt hơn là không mạo hiểm."
  travel_events.2016.c_escaped.tt:0 "Thoát"
  travel_events.2016.c_escaped.desc:1 "[entourage_member.GetShortUIName] vừa kịp tránh được cú húc của con bò"
  travel_events.2016.c_wounded.desc:0 "[entourage_member.GetShortUIName] bị thương"

#Visit a 'haunted' mansion (farm estate) - Enter at your own peril
  travel_events.haunted_manor.t:0 "Biệt Thự 'Ma Ám'"
  travel_events.2017.t:0 "$travel_events.haunted_manor.t$"
  travel_events.2017.desc:0 "Khi đi qua hành lang biệt thự ở [ROOT.Char.GetCurrentLocation.GetName], chủ đất địa phương, [estate_character.GetTitledFirstName], quay sang Ta. \"Người ta nói phần này của trang viên bị ma ám, [ROOT.Char.Custom('FormOfAddressForLiege')].\"\n\nTa lưỡng lự nhìn quanh. Hành lang tối hơn Ta nghĩ, nến chập chờn trên các chân nến.\n\nKhi chúng Ta dừng lại ở phòng ăn cũ, [estate_character.GetFirstNameNoTooltip] lại quay sang Ta, lần này với một nụ cười. \"Ngài có muốn đi tham quan biệt thự #EMP ma ám#! không?\""
  travel_events.2017.a: ""Ồ, #EMP hấp dẫn!#!"""
  travel_events.2017.a_tt:0 "Ngài vào biệt thự"
  travel_events.2017.b:0 "Điều này không thể xảy ra."
  travel_events.2017.b_tt:0 "Ngài rời biệt thự"

#Go with the pack or explore on your own?
  travel_events.2018.t:0 "$travel_events.haunted_manor.t$: Con Đường Tiếp Theo"
  travel_events.2018.desc:0 "Chúng ta đang rảo bước dọc theo một hành lang tối tăm và hoang vắng. Vài món đồ đạc chúng ta bắt gặp đều được phủ kín bằng những tấm vải, càng làm tăng thêm bầu không khí ma mị.\n\nĐó có phải... là... một con chuột không? Ta vội vã rảo bước để bắt kịp đoàn tùy tùng của mình.\n\n[estate_character.GetTitledFirstName|U] quay lại đối mặt với chúng ta, nheo mắt khi [estate_character.GetSheHe] thốt ra những lời "... và đi qua lối này, thưa các bậc tôn kính.""
  travel_events.2018.a:0 "Tốt hơn là theo lộ trình."
  travel_events.2018.a_tt:0 "Ngài ở lại cùng đoàn"
  travel_events.2018.b:0 "Còn cái ngóc ngách này thì sao..."
  travel_events.2018.b_tt:0 "Ngài có thể tìm thấy điều thú vị"
  travel_events.2018.c:0 "Ta đi trước đây!"

#Oh look, someone is trying to murder you
  travel_events.2019.t:0 "$travel_events.haunted_manor.t$: Phản Bội Tại Biệt Thự"
  travel_events.2019.desc:0 "Ta đi theo lối bên trái, qua một cổng vòm thấp. Trước mặt là một cửa hầm hơi mở.\n\nBóng tối bị phá vỡ bởi ánh sáng nhấp nháy từ dưới lầu. Ta cẩn thận trèo xuống thang, chỉ để thấy... #EMP một kẻ che mặt với dao?!#!\n\nTa vội quan sát xung quanh khi sát thủ lao đến."
  travel_events.2019.a: ""Nhìn kìa! Phía sau Ngài!""
  travel_events.2019.a_tt:0 "Cố gắng đẩy tủ vào sát thủ"
  travel_events.2019.a_retaliate.tt:0 "Phản Kích"
  travel_events.2019.a_retaliate.desc:0 "Chiếc tủ nghiền nát sọ sát thủ"
  travel_events.2019.a_retaliate.effect_tt:0 "Sát thủ chết"
  travel_events.2019.a_death.desc:0 "Ngài chết"
  travel_events.2019.b: ""Ta sẽ nhét tiền vào túi Ngài!""
  travel_events.2019.b_tt:0 "Cố hối lộ sát thủ"
  travel_events.2019.b_paid_off.tt:0 "Được Trả Hối Lộ"
  travel_events.2019.b_paid_off.desc:0 "Sát thủ nhận tiền và bỏ trốn"
  travel_events.2019.a_paid_off.effect_tt:0 "Sát thủ bỏ trốn"
  travel_events.2019.c: ""Chớ dại, đồ khốn!""
  travel_events.2019.c_tt:0 "Đánh với sát thủ"
  travel_events.2019.c_retaliate.desc:0 "Ngài giết sát thủ"
  travel_events.2019.expose_effect_tt:0 "Kẻ ám sát bị lộ"

#You found a very weird mendicant character
  travel_events.2020.t:0 "$travel_events.haunted_manor.t$: Phù Thủy Nào?"
  travel_events.2020.desc_witch:0 "Ta bỗng muốn khám phá hành lang hẹp bên phải. Đi qua hành lang, ánh sáng ấm áp từ cửa mở chào đón.\n\nPhòng đầy dụng cụ đủ loại. Ta nhận ra vài loại thảo mộc, bình chưng cất, cốc, ấm, nồi... Thật là bức tranh toàn cảnh về thuật giả kim.\n\nMột [mendicant_character.GetWomanMan] mỉm cười chào: \"Chào đồng đạo [ROOT.Char.Custom('SisterBrother')]. Ta là [mendicant_character.GetFirstNameNoTooltip], đã lâu không có ai đến. Ngài có muốn uống một chút không?\" [mendicant_character.GetSheHe|U] chỉ vào ấm mà [mendicant_character.GetSheHe] đang chăm sóc."
  travel_events.2020.desc:0 "Ta tách khỏi nhóm, đi qua một hành lang thậm chí còn tối tăm hơn cho đến khi bắt gặp một cánh cửa. Ta nhận thấy có ánh sáng lọt qua các kẽ hở.\n\nTa khẽ đẩy cửa bước vào và được chào đón bởi một tiếng xèo xèo trầm thấp. Ở giữa căn phòng chật chội, chứa đầy sách vở, chai lọ và đủ loại dụng cụ hóa chất là một [mendicant_character.GetWomanMan] đang đứng.\n\nMột mùi hôi thối bốc ra từ chiếc vạc mà [mendicant_character.GetSheHe] đang trông nom. Chẳng thèm quay đầu của [mendicant_character.GetHerHis] lại, [mendicant_character.GetSheHe] cất tiếng nói: "Người có muốn thử một chút không? Thứ này thường mang lại hiệu quả kỳ diệu lắm đấy.""
  travel_events.2020.a: ""Ta không ngại thử một ít trà đó.""
  travel_events.2020.b: ""Ngài có thể hữu dụng trong triều đình Ta, Ngài biết đấy.""
  travel_events.2020.c: ""Thử Ngài trước; trà sau.""
  travel_events.2020.d: ""Ơ... hướng nào để tham quan đây?""

#You found a shiny bauble
  travel_events.2021.t:0 "$travel_events.haunted_manor.t$: Vật Lạ Nhặt Được"
  travel_events.2021.desc_intro:0 "Ta bước qua cánh cửa hẹp và gặp ánh sáng mờ từ cửa sổ che. Phòng có vẻ từng là một thư phòng cũ."
  travel_events.2021.desc_illustrious:0 "\n\nNgay lập tức, ánh mắt Ta hướng tới [new_trinket.GetName] tinh xảo trên bệ giữa phòng. Ta tiến lại gần cẩn thận.\n\nThật là tác phẩm nghệ thuật, từng chi tiết tuyệt đẹp. Ta ngắm một lúc."
  travel_events.2021.desc_famed:0 "\n\nTa nhìn quanh và không thể bỏ qua [new_trinket.GetName] được chế tác tinh xảo trên bệ, thu hút mọi ánh nhìn.\n\nTác phẩm này không nên để lộ, là mục tiêu cho kẻ cướp. Ta tiếp cận cẩn thận."
  travel_events.2021.desc_masterwork:0 "\n\nNgồi chính giữa phòng trên bệ là [new_trinket.GetName]. Ta tiến lại gần cẩn thận.\n\nAi có thể sở hữu nó? Nó còn rất tốt, xét vị trí cất giữ."
  travel_events.2021.desc_common:0 "\n\nKhi mắt quen với phòng, Ta nhận thấy một món đồ thú vị trên bàn cạnh cửa sổ.\n\n[new_trinket.GetName] có thể không nổi bật, nhưng Ta nhận ra tay nghề chế tác. Đây là sản phẩm chắc chắn."
  travel_events.2021.desc_bad:0 "\n\nTa nhìn quanh phòng, cảm ơn ánh sáng từ cửa sổ. Khi định ra đi, Ta thấy một vật trên đống đổ nát.\n\nCó phải là... #EMP một vật?!#! Có mục đích? Ta chần chừ một chút."
  travel_events.2021.a:0 "Đây là bổ sung tuyệt vời cho bộ sưu tập của Ta."
  travel_events.2021.a_bad:0 "... Ta phải nhặt sao?"
  travel_events.2021.b:0 "Tốt hơn là bỏ qua."
  travel_events.2021.b_tt:0 "Ngài phớt lờ [new_trinket.GetName]"

#Resolution: You were joshed / You found a bauble / You survived the murder attempt / You came back from the mendicant
  travel_events.2022.t:0 "$travel_events.haunted_manor.t$: An Toàn"
  travel_events.2022.desc_pack:0 "Khi chúng ta bước qua một vòm cửa để vào căn phòng tiếp theo, một bóng đen lớn bất thình lình lao thẳng về phía chúng ta. Cả nhóm giật nảy mình và la hét.\n\nKhi ta ngước nhìn lên, bóng đen đó hóa ra là một bộ xương, được quấn trong một tấm vải tối màu. Ta cau mày khi [estate_character.GetTitledFirstName|U] cười lớn và cười toe toét với chúng ta.\n\n"Các người nên nhìn lại biểu cảm trên khuôn mặt của chính mình vừa rồi đi, thưa các bậc tôn kính!" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('entourage_member_one'))] của ta, [entourage_member_one.GetTitledFirstName], lộ rõ vẻ giận dữ và tiến lại gần [estate_character.GetTitledFirstNameNoTooltip] với một bàn tay giơ cao."
  travel_events.2022.desc_murder:0 "Vừa thoát sát thủ, Ta đứng lên chập chững. #EMP Chuyện gì vừa xảy ra?!#!\n\nRun rẩy, Ta leo lên thang và trở về hành lang phía phòng ăn. Cơn giận thay thế nỗi sợ. #EMP Có phải [estate_character.GetTitledFirstName] tham gia vào chuyện này?!#!\n\nKhi đến nhóm, Ta hầu như không để ý bộ xương treo trên vòm.\n\nMắt Ta đầy giận dữ, Ta nhìn [estate_character.GetFirstNameNoTooltip], người nhìn Ta bối rối."
  travel_events.2022.desc_mendicant:0 "Sau khi rời khỏi nơi ở của tu sĩ khất sĩ, ta dễ dàng lần theo tiếng động để quay trở lại căn phòng chính.\n\nCả nhóm trông có vẻ bất an nhưng đã nhẹ nhõm hơn, và ta thấy một bóng đen đang treo lơ lửng trên vòm cửa phía trên họ. [estate_character.GetTitledFirstName|U] nhanh chóng quay người lại và giật mình một chút khi nhìn thấy ta.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Ngài đã tự mình đi đâu một mình sao? Như vậy thật không an toàn chút nào đâu!" [estate_character.GetSheHe|U] nheo đôi mắt của [estate_character.GetHerHis] lại."
  travel_events.2022.desc_mendicant_recruit:0 "Ta cùng người đồng hành mới của mình, [mendicant_character.GetTitledFirstName], rời khỏi phòng của [mendicant_character.GetHerHis] và quay trở lại với nhóm ở căn phòng chính.\n\n[mendicant_character.GetFirstNameNoTooltip] khịt mũi khi [mendicant_character.GetSheHe] nhận ra một bóng đen đang treo trên vòm cửa mà cả nhóm hẳn đã đi qua, khiến người dẫn đường của chúng ta, [estate_character.GetTitledFirstName], phải quay ngoắt người lại.\n\nĐôi mắt của [estate_character.GetHerHis|U] mở to khi [estate_character.GetSheHe] nhận ra [mendicant_character.GetFirstNameNoTooltip]. "Kẻ nào #EMP đây!#! Thưa [ROOT.Char.GetLadyLord] của tôi, ngài không thể tự ý bỏ đi như vậy được! Như thế không an toàn chút nào đâu!""
  travel_events.2022.desc_bauble:0 "Với vật mới trong túi, Ta đi quanh hành lang tối và hẹp. Cuối cùng, Ta thấy nhóm ở phòng ăn cuối biệt thự.\n\nMột hình bóng lớn treo trên vòm, và Ta tự hỏi mục đích là gì. Những người khác có vẻ hơi lo lắng...?\n\n[estate_character.GetTitledFirstName|U] giật mình và quay về phía Ta. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Ngươi làm gì vậy? Những hành lang tối này không an toàn khi đi một mình!\""
  travel_events.2022.desc_joshed:0 "Ta loạng choạng trong bóng tối, cố gắng bỏ qua cảm giác hoảng sợ. Ta vội đi qua cánh cửa tiếp theo, tìm nhóm...\n\n...và #EMP đột nhiên#! một hình bóng lớn lao xuống trên Ta. Ta hét lên vì sợ.\n\nKhi tỉnh lại, Ta thấy nhóm đứng trong phòng Ta vừa vào. [estate_character.GetTitledFirstName] cười không thở nổi, chỉ tay về Ta. \"M... [ROOT.Char.GetLadyLord] #EMP *phì*#! ngươi... có vui không?\""
  travel_events.2022.a: ""Ta vừa thoát khỏi một âm mưu giết người, do #EMP ngươi!#!"" 
  travel_events.2022.a_slain.tt:0 "Kẻ Gây Hại Bị Giết"
  travel_events.2022.a_slain.desc:0 "Ngài giết [estate_character.GetShortUIName]"
  travel_events.2022.a_escape.tt:0 "Kẻ Gây Hại Bỏ Trốn"
  travel_events.2022.a_escape.desc:0 "[estate_character.GetShortUIName] làm Ngài bị thương và bỏ trốn"
  travel_events.2022.b: ""Bảo vệ! Người này dính líu âm mưu giết Ta!""
  travel_events.2022.b_slain.desc:0 "[estate_character.GetShortUIName] bị [travel_leader.GetShortUIName] giết"
  travel_events.2022.b_escape.desc:0 "[estate_character.GetShortUIName] làm [travel_leader.GetShortUIName] bị thương và bỏ trốn"
  travel_events.2022.c: ""Ngươi nên tìm phù thủy trong nhà.""
  travel_events.2022.d: ""Thật ra, Ta tìm thấy phù thủy này, [mendicant_character.GetFirstNameNoTooltip].""
  travel_events.2022.e: ""Nhìn có vẻ là nhà bình thường.""
  travel_events.2022.f_pack:0 "Ta không nên can thiệp."
  travel_events.2022.f: ""Đồ ti tiện!""
  travel_events.2022.g_pack: ""[entourage_member_one.GetFirstNameNoTooltip], đừng.""
  travel_events.2022.g: ""Ồ. Haha, đúng vậy!""

#You ratted out the witch; have a curse(?) dream
  travel_events.2024.t:0 "$travel_events.haunted_manor.t$: Một Lời Nguyền"
  travel_events.2024.desc:0 "[mendicant_character.GetFirstName] nhìn Ta. [mendicant_character.GetSheHe|U] cứ nhìn Ta. Ta cố chạy qua hành lang — nhưng [mendicant_character.GetSheHe] theo sát. Mắt [mendicant_character.GetHerHis|U] ở khắp nơi.\n\n\"Ta... biết rồi...\" [mendicant_character.GetSheHe] thì thầm. Khi Ta quay đầu chạy, Ta vấp ngã xuống một hố tối đến nỗi ngàn ngọn nến cũng không soi sáng nổi. Ta cứ rơi, rơi...\n\nĐột nhiên Ta giật mình tỉnh dậy, ướt đẫm mồ hôi."
  travel_events.2024.a:0 "Chẳng qua... chỉ là một cơn ác mộng?"

#Visit your own farm estate - Tax or don't tax your hospitable subject
  travel_events.2025.t:0 "Chủ Nhà Hiếu Khách"
  travel_events.2025.desc:0 "Đến trước khi màn đêm buông xuống tại các điền trang ở [ROOT.Char.GetCurrentLocation.GetName], [estate_owner.GetFirstName] đóng vai trò một chủ nhà vô cùng hiếu khách, chu toàn mọi nhu cầu của chúng Ta.\n\nVào buổi tối, một bữa tiệc được tổ chức để tôn vinh Ta và [ROOT.Char.Custom('RegionalDrink')] dường như chảy không ngừng cho đến khi những dấu hiệu bình minh xuất hiện trên bầu trời.\n\nSáng hôm sau, Ta được [estate_owner.GetFirstNameNoTooltip] tiếp cận: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], chúng Ta thật sự rất vui khi được tiếp đón ngài, và bữa tiệc này sẽ sưởi ấm chúng Ta trong nhiều đêm tới,\" [estate_owner.GetSheHe] mỉm cười và gật đầu."
  travel_events.2025.a: ""... kho [ROOT.Char.Custom('RegionalDrink')] của ngài có tương xứng với mức thuế không?""
  travel_events.2025.b: ""Ngài thật là một chủ nhà hiếu khách, [estate_owner.GetFirstNameNoTooltip].""
  travel_events.2025.c: ""Đổi lại, hãy để Ta chia sẻ một vài ý tưởng cải tiến.""

#Visit someone else's farm estate - Pay or don't pay for the hospitality
  travel_events.2026.t:0 "Hậu Tạ Chủ Nhà"
  travel_events.2026.desc_intro:0 "Buổi chiều nhanh chóng tiến tới chạng vạng khi chúng Ta đến các điền trang địa phương ở [ROOT.Char.GetCurrentLocation.GetName]. Chủ điền trang [estate_owner.GetFirstName] chào đón chúng Ta nồng hậu, và hứa sẽ tổ chức một bữa tiệc xa hoa.\n\nKhi bữa tiệc bắt đầu, chúng Ta dùng bữa với"
  travel_events.2026.desc_carnivore:0 "một bàn tiệc gồm đủ loại thịt nướng, hầm, súp, bánh mì và những món tương tự."
  travel_events.2026.desc_vegetarians:0 "một loạt các món ăn từ rau quả, nhiều món Ta chưa từng nghe tới trước đây."
  travel_events.2026.desc_outro:0 "\n\nVào buổi sáng, [estate_owner.GetFirstNameNoTooltip] tiếp cận Ta khi Ta đang dùng bữa sáng. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], tổ chức một bữa tiệc xa hoa như hôm qua thật #EMP tốn kém...#!\""
  travel_events.2026.a: ""#EMP Ngài#! nên trả #EMP cho Ta#! vì danh tiếng Ta mang đến cho #EMP điền trang#!.""
  travel_events.2026.b: ""Để Ta bồi thường cho ngài.""
  travel_events.2026.c: ""Có lẽ [county_liege.GetTitledFirstNameNoTooltip] và Ta có thể đi đến một thỏa thuận.""
  travel_events.2026.d: ""Ngài dám #EMP sao#!?""
#Visit your own quarry - Encounter hungry workers
  travel_events.2027.t:0 "Tranh Cãi Tại Mỏ"
  travel_events.2027.desc:1 "Khi bước vào mỏ địa phương tại [ROOT.Char.GetCurrentLocation.GetName], Ta thấy vài đứa trẻ gầy còm và lấm lem đang giúp bố mẹ đói meo với công việc nặng nhọc. Thực phẩm dường như khan hiếm ở khu vực này.\n\nHơi xa hơn trên bãi đất, quản mỏ [foreman_character.GetFirstName] đang tranh cãi với [peasant_leader.GetFirstName], người có vẻ là phát ngôn viên của công nhân. \"Điều này #EMP không thể chấp nhận được#!!\" [peasant_leader.GetFirstNameNoTooltip] hét lên.\n\n\"Chúng Ta không đủ thực phẩm và đã phải đi ngủ đói trong nhiều tháng. Trẻ con chúng Ta đang chết đói và sức lực cạn kiệt khi làm công việc nặng nhọc này. Tất cả những gì chúng Ta cần là một #EMP chút tăng lương nhỏ nhất#!...\" [peasant_leader.GetSheHe|U] ngừng lời khi [peasant_leader.GetSheHe] nhận ra sự hiện diện của Ta."
  travel_events.2027.a: ""Công nhân an toàn và đủ ăn sẽ hiệu quả hơn.""
  travel_events.2027.b: ""Đói giữ động lực.""
  travel_events.2027.c: ""Xếp hàng đi, #EMP nông dân.#!"" 
  travel_events.2027.d: ""Tại sao không ăn thịt quản mỏ nhỉ?""

#Visit someone else's quarry - Encounter an architect
  travel_events.2028.t:0 "Tạp Chí Kiến Trúc"
  travel_events.2028.desc:1 "[budding_architect.GetFirstName] mải mê suy nghĩ khi đoàn chúng Ta bước vào các mỏ của [ROOT.Char.GetCurrentLocation.GetName]. [budding_architect.GetSheHe|U] cúi người trên một bàn gỗ thô, tập trung vẽ gì đó trên cuộn giấy.\n\nTa nghiêng người sát vai [budding_architect.GetHerHis], thu hút sự chú ý của [budding_architect.GetHerHis]. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Ta không nhận ra ngài ở đây, thật lòng xin lỗi!\"\n\nTa hỏi về việc [budding_architect.GetSheHe] đang làm, và [budding_architect.GetFirstNameNoTooltip] trả lời.\n\"Ồ, Ta đang vẽ suy nghĩ của mình về xây dựng và nền móng. Ta thực sự là một kiến trúc sư, nhìn xem,\" [budding_architect.GetSheHe] mỉm cười e thẹn."
  travel_events.2028.a_architect: ""Những bản vẽ này khá tốt. Ta lấy một cái!"" 
  travel_events.2028.a: ""Kiến trúc sư à? Ta lấy một bản vẽ!""
  holding_blueprint:0 "Bản Vẽ Kiến Trúc"
  holding_blueprint_desc:0 "Một cuộn giấy chứa bản vẽ với kiến thức xây dựng hiệu quả các công trình."
  travel_events.2028.b:0 "Kỹ năng của ngươi sẽ hữu dụng tại triều đình Ta."
  travel_events.2028.b.tt:0 "[budding_architect.GetShortUIName] sẽ làm việc với mức lương thấp hơn trong 20 năm"
  trainee_salary_mod:0 "Lương Người Tập Sự"
  travel_events.2028.c:0 "Thật... tuyệt... Hãy tiếp tục công việc tốt."

#Visit a cereal field - Encounter a heathen
  travel_events.2029.t:1 "Thức Tỉnh"
  travel_events.2029.desc:1 "Màn đêm buông xuống và một [crop_circler.GetWomanMan] đang cật lực làm việc khi chúng ta đến những cánh đồng ngũ cốc ở phía nam [ROOT.Char.GetCurrentLocation.GetName]. [crop_circler.GetSheHe|U] dường như đang giẫm nát các bông lúa với tốc độ chóng mặt, bằng cách sử dụng một khúc gỗ phẳng lớn và những phiến đá nặng.\n\nTa cau mày khi nhìn tên [crop_circler.GetWomanMan] thực hiện công việc của [crop_circler.GetHerHis], rồi chất vấn xem chính xác thì [crop_circler.GetSheHe] đang định làm gì.\n\n[crop_circler.GetSheHe|U] nhăn mặt, rồi bắt đầu thao thao bất tuyệt một tràng dài về việc tất cả chúng ta cần phải thức tỉnh và bái kiến những chủ nhân thực sự của mình, thay vì trốn tránh đằng sau những giáo lý [crop_circler.GetFaith.GetReligion.GetAdjectiveNoTooltip] giả tạo. Ta lùi lại vài bước vì kinh ngạc."
  travel_events.2029.a: ""Dừng lại, kẻ dị giáo!""
  travel_events.2029.b: ""Ngươi dám báng bổ [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]!""
  travel_events.2029.c: ""Kể cho ta thêm về những #EMP chủ nhân thật sự#!.""
  travel_events.2029.d: ""Ừm... được thôi.""

#Cereal field potential follow-up
  travel_events.2030.t:0 "Lời Thú Nhận Của Người Không Tin"
  travel_events.2030.desc:0 "Vào buổi sáng, [entourage_chaplain.GetTitledFirstName] đến gần Ta, vò tay [entourage_chaplain.GetHerHis]. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U] và [entourage_chaplain.Custom2('RelationToMe', ROOT.Char)], Ta có một lời thú nhận kinh khủng.\" \n\n[entourage_chaplain.GetSheHe|U] thở dài. \"Dù Ta không theo bất kỳ... giáo lý điên rồ... nào như [crop_circler.Custom('GetLassLad')] hôm qua, Ta đã có... #EMP nghi ngờ.#!\" [entourage_chaplain.GetFirstNameNoTooltip] nhìn Ta kỹ, tìm sự đồng cảm với tình trạng của [entourage_chaplain.GetHerHis].\n\n\"Ta chỉ không chắc [entourage_chaplain.GetFaith.HighGodName] thực sự tồn tại và theo dõi chúng ta.\" [entourage_chaplain.GetSheHe|U] kết thúc, có một khoảnh khắc im lặng kịch tính."
  travel_events.2030.a: ""Không sao cả.""
  travel_events.2030.b: ""Điều này #EMP không thể chấp nhận được#!!""

#Visit another cereal field - Encounter a gardener
  travel_events.2031.t:0 "Bụng Mẹ Trái Đất"
  travel_events.2031.desc:0 "Cánh đồng [ROOT.Char.GetCurrentLocation.GetName] thật đẹp mắt. Mỗi cây trổ bông, mỗi lá xanh, mỗi thân mập mạp.\n\nTa nhanh chóng tìm ra nguồn xanh tốt, thấy một [gardener_character.GetWomanMan] đứng trong cánh đồng, dường như đang giảng bài cho một nhóm người nghe. \"Tên Ta là [gardener_character.Custom('MistressMaster')|U] [gardener_character.GetFirstName].\"\n\n[gardener_character.GetSheHe|U] nhận ra Ta từ xa và quay về phía Ta. \"Kiến thức làm vườn của Ta rất rộng, thực sự là rộng vô cùng — hãy ở lại một lát, và lắng nghe.\""
  travel_events.2031.a: ""Thật là hấp dẫn!""
  travel_events.2031.a_down_to_earth.t:0 "Thực Tế"
  travel_events.2031.b: ""[ROOT.Char.GetTitleAsNameNoTooltip|U]? Làm #EMP vườn!?!"" 

#Visit a ramparts/forest fort - Encounter a herbalist/physician
  travel_events.2032.t:0 "Một Loại Thảo Dược Cho Ngài..."
  travel_events.2032.desc:0 "Cấu trúc phòng thủ ấn tượng tại đỉnh của vùng [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] thuộc [ROOT.Char.GetCurrentLocation.GetName] quả là một kiệt tác. Khi ta lang thang dọc theo vành đai bên ngoài, ta nhận thấy một kẻ kỳ dị ở phía xa.\n\n[herbalist_character.GetSheHe|U] dường như đang lẩm bẩm một mình [herbalist_character.GetHerselfHimself], trong khi liên tục dừng lại để cúi xuống và thu lượm những thứ trông giống như các loại thảo mộc khác nhau. Cứ như thể [herbalist_character.GetSheHe] đang trò chuyện với... các #EMP loài thảo mộc#! vậy?\n\nTa cẩn thiện tiến lại gần [herbalist_character.GetHerHim], và [herbalist_character.GetSheHe] ngước nhìn lên, với nhiều loại thảo mộc khác nhau đang đặt trong lòng bàn tay của [herbalist_character.GetHerHis]. Ta nhận thấy một tia hiếu kỳ lóe lên sau đôi mắt của [herbalist_character.GetHerHis], như đang đưa ra một câu hỏi không lời."
  travel_events.2032.a: ""Loại thảo này có tác dụng gì?""
  travel_events.2032.a_poisonous.tt:1 "Ngài thu thập một số thảo mộc độc có thể dùng cho [GetScheme('murder').GetTypeName] tiếp theo [scheme|E]"
  travel_events.2032.a_poisonous.t:0 "Thu Thập Thảo Dược"
  travel_events.2032.a_poisonous.desc:1 "Ngài tìm thấy một số thảo mộc độc"
  travel_events.2032.a_learning.tt:0 "Kỹ Năng Cải Thiện"
  travel_events.2032.b: ""Ngài có muốn trở thành bác sĩ riêng của Ta không?""
  travel_events.2032.c: ""Đây là lãng phí thời gian của Ta.""

#Visit some hunting grounds - If you have a prisoner with you; manhunt!
  travel_events.2033.t:0 "Tù Nhân Trốn Thoát!"
  travel_events.2033.desc_intro:0 "Ngay khi chúng Ta bước vào vùng săn bắn [ROOT.Char.GetCurrentLocation.GetName], các vệ sĩ chạy tới, thở hổn hển và hơi hoảng loạn. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Kẻ [prisoner.Custom2('InsultAdjective', ROOT.Char)] [prisoner.GetTitledFirstName] đã thoát khỏi xiềng xích của chúng ta!\"\n\nÁnh mắt Ta ngay lập tức hướng về mé rừng, tìm dấu hiệu di chuyển nhưng không thấy gì."
  travel_events.2033.desc_manhunt:0 "Chỉ có thể là một điều. #EMP Truy Nã!#!\n\n"
  travel_events.2033.desc_manhunt_previous:0 "Niềm vui khi nhớ lại cuộc truy nã trước khiến Ta run rẩy. Hứng thú. Nguy hiểm. Ta nóng lòng."
  travel_events.2033.desc_manhunt_first:0 "Ta đã mong muốn thử sức với con mồi khéo léo và nguy hiểm nhất của thiên nhiên từ lâu. Một nụ cười hé trên môi."
  travel_events.2033.desc:0 "Hơi choáng vì vụ trốn thoát, Ta cân nhắc tình hình.\n\nChắc chắn chúng ta nên đưa tù nhân trốn thoát ra trước công lý chứ?"
  travel_events.2033.a_manhunt:0 "#EMP Thú Vị!#!"
  travel_events.2033.a_cannibal:0 "À, tù nhân; thịt trắng khác."
  travel_events.2033.a_manhunt_tt:0 "Một mục tiêu thoát truy nã có thể quay lại trả thù"
  travel_events.2033.a_manhunt.tt:0 "Hoàn Thành Truy Nã"
  travel_events.2033.a_manhunt.desc:1 "[prisoner.GetShortUIName] bị săn và giết"
  travel_events.2033.a_caught_trophy.desc:1 "[prisoner.GetShortUIName] bị săn và biến thành chiến lợi phẩm"
  travel_events.2033.a_caught_eaten.tt:0 "Tù Nhân Bị Ăn"
  travel_events.2033.a_caught_eaten.desc:0 "[prisoner.GetShortUIName] bị bắt và ăn thịt"
  travel_events.2033.a_escaped.tt:0 "Tù Nhân Trốn Thoát"
  travel_events.2033.a_escaped.desc:0 "[prisoner.GetShortUIName] thoát khỏi tầm tay Ngài"
  travel_events.2033.a_killed.desc:0 "[prisoner.GetShortUIName] giết Ngài và trốn thoát"
  travel_events.2033.a_accident.desc:0 "Ngài vấp ngã và gãy cổ"
  manhunt_skull_cup:0 "Chén Đầu Lâu Truy Nã"
  manhunt_skull_cup_desc:0 "Chén đầu lâu này là chiến lợi phẩm từ việc truy nã thành công [new_skull_cup.MakeScope.Var('skull_origin').Char.GetUIName] tại [ROOT.Char.GetCurrentLocation.GetName] [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l]."
  manhunt_skull_cup_desc_fallback:0 "Chén đầu lâu này là chiến lợi phẩm từ việc truy nã thành công con mồi người."
  travel_events.2033.b:0 "... Ta đoán chúng ta nên bắt [prisoner.GetHerHim] chứ?"
  travel_events.2033.b_caught.tt:0 "Tù Nhân Bắt Được"
  travel_events.2033.b_caught.desc:0 "[prisoner.GetShortUIName] bị bắt"
  travel_events.2033.b_caught.effect:0 "[prisoner.GetShortUIName] vẫn là tù nhân của Ngài"
  travel_events.2033.c:0 "Để [prisoner.GetFirstNameNoTooltip] chạy. Hoang dã sẽ lo cho [prisoner.GetHerHim] thôi."

#Your escaped manhunted prisoner seeks revenge
  travel_events.2034.t:0 "Gieo Gì Gặt Nấy..."
  travel_events.2034.desc_intro:0 "Sáng đang lên tại trại chúng Ta ở [ROOT.Char.GetCurrentLocation.GetName] [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l]. Ta ngáp và vươn vai, lăn sang bên.\n\nNgái ngủ Ta đứng dậy và tiến tới cửa lều để hít thở không khí buổi sáng. Bất ngờ, những sợi tóc gáy dựng đứng,"
  travel_events.2034.desc:0 "và trong tầm mắt Ta thấy [vengeful_prisoner.GetTitledFirstName], dao rút.\n\n[vengeful_prisoner.GetSheHe|U] mỉm cười cay độc. \"[ROOT.Char.GetTitledFirstNameNoTooltip|U], thật vui khi gặp lại ngài. Lần này #EMP Ta#! sẽ thực hiện truy nã.\" Ta chớp mắt, hơi sững sờ."
  travel_events.2034.desc_long_time:0 "và trong tầm mắt Ta thấy một [vengeful_prisoner.GetWomanMan], dao rút.\n\n[vengeful_prisoner.GetSheHe|U] mỉm cười cay độc. \"Ngươi không nhớ ta sao? Ta nhớ #EMP ngươi#!, [ROOT.Char.GetTitledFirstNameNoTooltip] và các hành vi truy nã #EMP tàn bạo#! của ngươi.\" Một ký ức mơ hồ quay về. Tù nhân trốn thoát #EMP [vengeful_prisoner.GetTitledFirstName]#!...?"
  travel_events.2034.a:0 "Ngươi không cần làm điều này!"
  travel_events.2034.a_overpowered_desc:0 "Ngươi khống chế [vengeful_prisoner.GetShortUIName]"
  travel_events.2034.a_overpowered_effect:0 "Ngươi được quyết định số phận [vengeful_prisoner.GetShortUINamePossessive]"
  travel_events.2034.a_death_desc:0 "$travel_events.2019.a_death.desc$"
  travel_events.2034.b:0 "#EMP [bodyguard.GetFirstNameNoTooltip]!!#!"
  travel_events.2034.b_overpowered_desc:0 "[bodyguard.GetShortUIName] khống chế [vengeful_prisoner.GetShortUIName]"
  travel_events.2034.b_death_tt:0 "Tù Nhân Trốn Thoát Bị Giết"
  travel_events.2034.b_death_desc:0 "[bodyguard.GetShortUIName] giết [vengeful_prisoner.GetShortUIName]"
#Decide their fate
  travel_events.2035.t:0 "...Gieo Gì Gặt Nấy"
  travel_events.2035.desc:0 "[vengeful_prisoner.GetTitledFirstName|U] đang quỳ trước mặt Ta, bị trói và không thể cử động. Sau cú sốc ban đầu, các vệ sĩ của Ta đã đầy lều.\n\n[vengeful_prisoner.GetSheHe|U] ngoan cố nhìn xuống đất và từ chối nhìn Ta. Ta nên làm gì với [vengeful_prisoner.Custom2('InsultNoun', ROOT.Char)] này?"
  travel_events.2035.a:0 "Ngươi xứng đáng chết."
  travel_events.2035.b:0 "Ngươi nên trở lại tù."
  travel_events.2035.c:0 "Ta sẽ nhẫn nhịn."

#Your escaped/reformed prisoner is... pretty peaceful actually
  travel_events.2036.t:0 "Một Kết Thúc?"
  travel_events.2036.desc_intro:0 "Chúng Ta bước vào cổng một thôn nhỏ ở [ROOT.Char.GetCurrentLocation.GetName]. Người dân dường như sống yên bình, làm việc và giúp đỡ nhau.\n\nKhi quan sát dân làng, một cơn nhận ra bất ngờ tràn qua Ta."
  travel_events.2036.desc_reformed:0 "Tại đền thờ địa phương, Ta ngay lập tức nhận ra tù nhân trốn thoát của mình, [peaceful_prisoner.GetTitledFirstName], đang trò chuyện nhẹ nhàng với thủ lĩnh tinh thần.\n\nThật là trùng hợp! Ta nhìn [peaceful_prisoner.GetSheHe] giúp các chức sắc với công việc nhỏ, dường như yên bình."
  travel_events.2036.desc:0 "Ta ngay lập tức nhận ra tù nhân trốn thoát của mình, [peaceful_prisoner.GetTitledFirstName], cười vui và giúp một cụ già trong làng.\n\n[peaceful_prisoner.GetSheHe|U] có vẻ hài lòng với tình cảnh của [peaceful_prisoner.GetHerHis]."
  travel_events.2036.a:0 "Sống và để người khác sống."
  travel_events.2036.a_criminal:0 "Có vẻ tội phạm cũng có thể cải tà."
  travel_events.2036.a_reformed:0 "Miễn là [peaceful_prisoner.GetSheHe] không thử giết Ta lần nữa."
  travel_events.2036.b:0 "[peaceful_prisoner.GetTitledFirstNameNoTooltip|U] đi cùng #EMP Ta#!."
  travel_events.2036.b_criminal:0 "Một lần tội phạm, luôn là tội phạm."
  travel_events.2036.b_reformed:0 "#EMP ...không#!, Ta không cảm thấy an toàn khi [peaceful_prisoner.GetSheHe] còn ngoài kia."

#Visit some hunting grounds - Sadistic county holder is manhunting
  travel_events.2037.t:0 "Kẻ Săn Người"
  travel_events.2037.desc:0 "Chúng Ta gặp [2037_county_liege.GetTitledFirstName], người cai quản [ROOT.Char.GetCurrentLocation.GetName], cùng đoàn tùy tùng của [2037_county_liege.GetHerHis] tại khu săn bắn địa phương.\n\nSau khi trao đổi vài câu chào hỏi lịch sự, [2037_county_liege.GetSheHe] nhìn Ta với nụ cười tinh quái: \"Ngươi có muốn tham gia môn thể thao cao quý nhất,"
  travel_events.2037.desc_child:0 "bé nhỏ?" "
  travel_events.2037.desc_adult:0 "người [2037_county_liege.Custom2('RelationToMeShort', ROOT.Char)] của ta?" "
  travel_events.2037.desc_segway:1 "[2037_county_liege.GetSheHe|U] gật đầu về phía tù nhân đang xích ở rìa rừng."
  travel_events.2037.desc_outro_segway_adult:1 "\n\nTa nhanh chóng nhận ra môn #EMP thể thao#! mà [2037_county_liege.GetSheHe] đang nhắc đến."
  travel_events.2037.desc_outro_child:1 "\n\nSự hiếu kỳ của ta chắc chắn đã bị kích thích. Trò chơi này có thể là trò gì được chứ... ? Đuổi bắt sao?\n\nTrong lúc ta đang cân nhắc lời đề nghị, ta nhận thấy [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('entourage_character'))] của ta, [entourage_character.GetTitledFirstName], đang cố thu hút sự chú ý của ta và khẽ lắc đầu của [entourage_character.GetHerHis] một cách đầy thận trọng."
  travel_events.2037.desc_outro_manhunter:0 "Là một kẻ săn người dày dạn, gợi ý này khiến Ta thấy thú vị."
  travel_events.2037.desc_outro:1 "#EMP Truy nã con người.#! Ta thực sự cảm thấy ghê tởm... hay là bị kích thích?"
  travel_events.2037.a:0 "Nghe có vẻ thú vị..."
  travel_events.2037.a_child:0 "Ta sẽ tham gia!"
  travel_events.2037.a_manhunted:0 "Hãy bắt đầu."
  travel_events.2037.a_your_kill.desc:1 "Ngài săn và giết [2037_manhunt_prisoner.GetShortUIName]"
  travel_events.2037.a_their_kill.tt:0 "[2037_county_liege.GetShortUINameNoTooltip] Giết Con Mồi"
  travel_events.2037.a_their_kill.desc:1 "[2037_manhunt_prisoner.GetShortUIName] bị [2037_county_liege.GetShortUIName] săn và giết"
  travel_events.2037.b:0 "Ta có thể dùng tù nhân đó, nếu ngươi không phiền."
  travel_events.2037.b_child:0 "Ta muốn [2037_manhunt_prisoner.GetFirstNameNoTooltip] đi cùng Ta."
  travel_events.2037.c:0 "Ngươi điên rồi sao?"
  travel_events.2037.c_child:0 "Không. Trò này có vẻ tàn nhẫn."

#Visit some hunting grounds - Friendly competition with an entourage member
  travel_events.2038.t:0 "Bắn Trúng Mục Tiêu"
  travel_events.2038.desc:0 "Khu vực này đầy sinh vật hoang dã, và Ta cùng [entourage_character.GetTitledFirstName] đồng ý rằng [ROOT.Char.GetCurrentLocation.GetName] là nơi tuyệt vời để săn bắn.\n\nDù không có thời gian cho một chuyến đi đầy đủ, khi đi qua khu vực Ta nhận thấy một con thỏ hoang tinh khôi gần rìa rừng. Trên lông nó có những dấu hiệu đặc biệt, và Ta ra hiệu cho [entourage_character.GetFirstNameNoTooltip] quan sát.\n\nKhi [entourage_character.GetSheHe] nhìn thấy con thỏ, [entourage_character.GetSheHe] mỉm cười. \"Ngươi nghĩ sao về một cược vui, [entourage_character.Custom2('RelationToMeShort', ROOT.Char)]? Ai bắn trúng con thỏ tinh khôi đó sẽ thắng.\""
  travel_events.2038.a:0 "Nghe có vẻ hợp lý!"
  travel_events.2038.a_your_kill.tt:0 "Ngài Giết Con Mồi"
  travel_events.2038.a_your_kill.desc:0 "Mũi tên của Ngài xuyên thẳng vào tim con thỏ"
  travel_events.2038.a_their_kill.tt:0 "[entourage_character.GetShortUINameNoTooltip] Giết Con Mồi"
  travel_events.2038.a_their_kill.desc:0 "Con thỏ bị [entourage_character.GetShortUIName] giết"
  lucky_rabbits_paw:0 "Chân Thỏ May Mắn"
  lucky_rabbits_paw_desc:0 "Một chân thỏ duy nhất tinh khôi, bị hạ trong trận săn vui với [entourage_character.GetTitledFirstName] tại khu săn bắn [ROOT.Char.GetCurrentLocation.GetName]."
  travel_events.2038.b:0 "#EMP Ôi không#!, ánh mặt trời chói mắt Ta!"
  travel_events.2038.c:0 "...pft, Ta không có thời gian cho trò này."

#Follow-up hunt outcome
  travel_events.2039.t:0 "Bắn Trúng Mục Tiêu Thật"
  travel_events.2039.desc_child_won:1 "[entourage_character.GetTitledFirstName] lao theo con thỏ, cung sẵn sàng, không nhận ra mũi tên lỏng lẻo của Ta.\n\nSau một hồi vật lộn với bụi rậm, [entourage_character.GetTitledFirstNameNoTooltip] reo lên chiến thắng và lao tới nhặt xác con thỏ với mũi tên cắm chắc vào thân nhỏ. Ta vỗ tay khi [entourage_character.GetSheHe] rạng rỡ nhìn Ta."
  travel_events.2039.desc_won:1 "Khi thấy con thỏ, chúng Ta chậm rãi nhưng chắc chắn tiến lại gần, nhắm vào thân hình nhỏ bé của nó. Ta kéo cung — và thả — mũi tên #EMP xuyên thẳng vào cơ thể con vật#!.\n\nCú va chạm khiến nó nhảy vài bước, rồi thân hình nhỏ rũ xuống, bất động. Ta hét lên chiến thắng, và [entourage_character.GetTitledFirstName] cùng reo hò với Ta. \"Bắn đẹp đó,\" [entourage_character.GetSheHe] khen, khi Ta lao tới nhặt chiến lợi phẩm."
  travel_events.2039.desc_lost:1 "[entourage_character.GetTitledFirstName] dẫn Ta vài bước khi chúng Ta cố tiến gần con thỏ để bắn. Ta vật lộn để theo kịp, khi [entourage_character.GetSheHe] nhắm mũi tên vào con vật và, trong một động tác nhanh, bắn thẳng vào thân nhỏ của nó.\n\n[entourage_character.GetFirstNameNoTooltip] giơ tay chiến thắng và reo hò khi con thỏ rũ xuống, và [entourage_character.GetSheHe] vội nhặt xác. Ta vỗ tay khen ngợi."
  travel_events.2039.a:0 "Bắn đẹp!"
  travel_events.2039.a_trinket.t:0 "Nhận Vật Phẩm"
  travel_events.2039.a_win:0 "Quả thật vui!"
  travel_events.2039.a_cynical:0 "Ta từng thấy tệ hơn."

#The rescued manhunt prisoner from travel_events.2037 turns out to be a psycho
  travel_events.2040.t:0 "Có Khoảng Thở"
  travel_events.2040.intro:0 "Một đêm khi chúng Ta ngồi bên đống lửa trại, Ta nhìn lên và nhận ra chỉ còn một mình với [2037_manhunt_prisoner.GetTitledFirstName]. Đôi mắt [2037_manhunt_prisoner.GetHerHis|U] phản chiếu ánh lửa bập bùng khi [2037_manhunt_prisoner.GetSheHe] tập trung nhìn Ta.\n\n"
  travel_events.2040.desc_child:0 "\"Tại sao kẻ [2037_county_liege.GetWomanMan] đáng ghét đó lại muốn giết ngươi trước đây?\" Ta bật ra. [2037_manhunt_prisoner.GetTitledFirstNameNoTooltip] ngập ngừng một lúc, rồi nhìn đi khi [2037_manhunt_prisoner.GetSheHe] trả lời:"
  travel_events.2040.desc:0 "Ta nhận ra mình chưa bao giờ thực sự hỏi [2037_manhunt_prisoner.GetHerHim] lý do tại sao [2037_manhunt_prisoner.GetSheHe] lại bị giam giữ. Thế rồi, như thể [2037_manhunt_prisoner.GetSheHe] đã đọc được suy nghĩ của ta, [2037_manhunt_prisoner.GetTitledFirstNameNoTooltip] lẩm bẩm:"
  travel_events.2040.outro:0 "\n\n\"Như thể xác của [2040_previous_victim.GetHerHis] kêu gào giải thoát, ngươi hiểu không,\" giọng [2037_manhunt_prisoner.GetHerHis] đầy hoài niệm nghiêm trọng."
  travel_events.2040.a:0 "...rất triết lý."
  travel_events.2040.a_child:0 "Ta cũng đã làm những điều xấu."
  travel_events.2040.a.flavor:0 "Ai nguy hiểm hơn một kẻ điên?"
  travel_events.2040.a.flavor_child:0 "Chắc chắn [2037_manhunt_prisoner.GetSheHe] sẽ không làm hại #EMP Ta#!, phải không?"
  travel_events.2040.a.tt:0 "[2037_manhunt_prisoner.GetShortUIName] sẽ làm [GetCourtPositionType('bodyguard_court_position').GetName()] cho Ngài miễn phí"
  insane_bodyguard_salary_mod:0 "Vệ Sĩ Điên Loạn"
  travel_events.2040.b:0 "Xóa Bạn người phải ở tù."
  travel_events.2040.b_child:0 "Làm hại người khác là sai."
  travel_events.2040.b.flavor:0 "Vậy nên mới biết [2037_manhunt_prisoner.GetSheHe] bị giam..."
  travel_events.2040.b.flavor_child:0 "[2037_manhunt_prisoner.GetTitledFirstNameNoTooltip] làm Ta sợ..."
  travel_events.2040.c:0 "#EMP Ta không thể để Xóa Bạn người sống!#!"
  travel_events.2040.c.flavor:0 "Đền mạng bằng mạng."
  travel_events.2040.c_slay.t:0 "Xóa Bạn Người Bị Giết"
  travel_events.2040.c_slay.desc:0 "Ngài giết [2037_manhunt_prisoner.GetShortUIName]"
  travel_events.2040.c_wounded.t:0 "$travel_events.2001.c_failure.tt$"
  travel_events.2040.c_wounded.desc:0 "Ngài giết [2037_manhunt_prisoner.GetShortUIName], nhưng bị thương"
  travel_events.2040.c_incapable.t:0 "Thương Tích Nặng"
  travel_events.2040.c_incapable.desc:0 "Ngài bị thương nặng trong trận đấu, và [2037_manhunt_prisoner.GetShortUIName] thoát"
  travel_events.2040.c_death.desc:0 "Ngài tử vong"

#Ruler Events#
#Visiting Ruler: Someone is trying to assassinate the Target Ruler!
  travel_events_life_or_death.t:0 "Sinh Tử"
  travel_events.2100.t:0 "$travel_events_life_or_death.t$"
  travel_events.2100.desc_intro:0 "Chúng Ta tiến nhanh để tới [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName], và "
  travel_events.2100.desc_intro_trees:0 "rừng rậm ở [ROOT.Char.GetCurrentLocation.GetName] không thể thắng trí thông minh của hướng dẫn viên địa phương.\n\nKhi cây cối thưa ra, Ta nhận thấy một nhóm khách đi trước."
  travel_events.2100.desc_intro_hills:0 "gió thổi sau lưng khi chúng Ta đi dọc sườn đồi [ROOT.Char.GetCurrentLocation.GetName] [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l].\n\nXa phía trước, một đoàn khác cũng đang tiến qua sườn đồi."
  travel_events.2100.desc_intro_flats:0 "đồng bằng [ROOT.Char.GetCurrentLocation.GetName] cho phép chúng Ta hạ cảnh giác vài phút.\n\nKhi tới đỉnh thung lũng nhìn xuống, Ta nhận ra một đoàn khác đang đi thận trọng."
  travel_events.2100.desc_relation_in:0 " Khi Ta nheo mắt, Ta nhận ra người đứng đầu đoàn đó là"
  travel_events.2100.desc_negative_segway:0 "kẻ [murder_target.Custom('InsultAdjectiveGeneric')]"
  travel_events.2100.desc_positive_segway:0 "người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murder_target'))] của Ta"
  travel_events.2100.desc_relation_out:0 "[murder_target.GetTitledFirstName]."
  travel_events.2100.desc_no_relation_traveller:0 "Họ dường như đang ngắm cảnh, gần như chơi đùa và tham quan vùng địa phương."
  travel_events.2100.desc_no_relation_liege:0 "Họ dường như đang khảo sát khu vực, ghi chú và thảo luận cảnh quan."
  travel_events.2100.desc_trees:0 "Nhưng có gì đó không ổn. Nhìn dọc theo hàng cây, Ta nhận thấy một nhóm người khoác áo choàng đáng ngờ, dường như đang chờ đoàn khách tiến gần."
  travel_events.2100.desc_hills:0 "Nhưng những kỵ sĩ bịt mặt, rút vũ khí, tiến từ phía tây là gì vậy... ?"
  travel_events.2100.desc_flats:0 "Quan sát đoàn, dường như các kỵ sĩ bịt mặt với vũ khí giơ cao đang tiến nhanh từ phía đông!"
  travel_events.2100.desc_outro:0 "\n\nCó vẻ như một vụ phục kích, và "
  travel_events.2100.desc_outro_negative:0 "Ta chần chừ. Liệu Ta có nên can thiệp vào cái chết chắc chắn của [murder_target.GetTitledFirstNameNoTooltip]?"
  travel_events.2100.desc_outro_positive:0 "không còn nghi ngờ gì nữa. Ta phải cứu [murder_target.GetTitledFirstNameNoTooltip]!"
  travel_events.2100.desc_outro_default:0 "Ta chần chừ. Liệu có phải trách nhiệm của Ta bảo vệ những người đi đường khác?"
  travel_events.2100.a:0 "Tại sao #EMP Ta#! phải can thiệp?"
  travel_events.2100.a_rival:0 "May mà không phải việc của Ta."
  travel_events.2100.a_nemesis:0 "#EMP Cuối cùng!#!"
  travel_events.2100.a_stealthy_entourage.tt:0 "Đoàn Ẩn"
  travel_events.2100.a_stealthy_entourage.desc:0 "Ngài và đoàn của Ngài vẫn ẩn mình"
  travel_events.2100.a_stealthy_outcome.tt:0 "Nếu [murder_target.GetShortUIName] sống sót, [murder_target.GetSheHe] sẽ không biết Ngài đã ở đây"
  travel_events.2100.a_nonstealthy_entourage.tt:0 "Đoàn Bị Phát Hiện"
  travel_events.2100.a_nonstealthy_entourage.desc:0 "Sự hiện diện của Ngài được [murder_target.GetShortUIName] nhận ra"
  travel_events.2100.a_nonstealthy_outcome.tt:0 "Nếu [murder_target.GetShortUIName] sống sót, [murder_target.GetSheHe] sẽ nhớ chuyện này"
  travel_events.2100.b:0 "Ta phải hành động!"
  travel_events.2100.b.tt:0 "Ngài can thiệp vào vụ ám sát [murder_target.GetShortUIName]"
  travel_events.2100.b_outcome_tt:0 "[murder_target.GetShortUIName] sẽ nhớ chuyện này"

#Target Ruler: You are being assassinated
  travel_events.2101.t:1 "$travel_danger_prefix$ $travel_events_life_or_death.t$, Sát thủ!"
  travel_events.2101.desc:0 "Khi đang khảo sát vùng đất của [ROOT.Char.GetCurrentLocation.GetName], mặt trời cao và có làn gió nhẹ. Ta nhìn quanh và nhận ra khu vực này khá hoang vắng, chỉ có vài đàn chim di cư bay xa trên bầu trời.\n\nKhi Ta cúi xuống chỉnh lại đôi giày, Ta bỗng giật mình đứng thẳng khi nghe thấy những kỵ sĩ đang tới gần. Những bóng người khoác áo choàng dường như từ mọi hướng xuất hiện, và trước khi Ta kịp phản ứng, một tên ác nhân đã đứng ngay trước mặt, rút dao và lao thẳng vào cổ Ta!"
  travel_events.2101.a:0 "Đồ vô liêm sỉ!"
  travel_events.2101.a_guards:0 "[bodyguard.GetNameNoTooltip]!!"
  travel_events.2101.a_assassin_death.tt:0 "Sát thủ bị giết"
  travel_events.2101.a_bodyguard_kill.desc:0 "Sát thủ bị giết bởi [bodyguard.GetShortUIName]"
  travel_events.2101.a_bodyguard_wounded.tt:0 "Vệ sĩ bị thương"
  travel_events.2101.a_bodyguard_wounded.desc:0 "[bodyguard.GetShortUIName] giết sát thủ nhưng bị thương"
  travel_events.2101.a_assassin_death.desc:0 "Ngài đã giết sát thủ"
  travel_events.2101.a_death.desc:0 "Ngài đã chết"
  travel_events.2101.a_ruler_assassinated.tt:0 "[murder_target.GetShortUIName] Đã chết"
  travel_events.2101.a_ruler_assassinated.desc:0 "[murder_target.GetShortUIName] bị ám sát khi đang thăm [visiting_ruler.MakeScope.Var('assassination_location').GetProvince.GetName]"
  travel_events.2101.a_ruler_survived.tt:0 "[murder_target.GetShortUIName] Sống sót"
  travel_events.2101.a_ruler_survived.desc:0 "[murder_target.GetShortUIName] sống sót sau vụ ám sát tại [visiting_ruler.MakeScope.Var('assassination_location').GetProvince.GetName]"

#Target Ruler: Wait a minute, didn't I see Visiting Ruler??
  travel_events.2102.t:1 "$travel_danger_prefix$ $travel_events_life_or_death.t$, Phản bội"
  travel_events.2102.desc:0 "Cuộc chiến diễn ra dường như hàng giờ, nhưng thực tế chỉ vài phút. Những sát thủ bị đánh bại, và chúng Ta sống sót không tổn hại gì.\n\nTa rà soát chiến trường và tìm thấy bằng chứng về âm mưu ám sát Ta trên một xác chết. Trong trạng thái cảnh giác cao, Ta cũng nhận thấy một lá cờ biến mất khỏi tầm nhìn. [visiting_ruler.GetTitledFirstName]?"
  travel_events.2102.desc_negative:0 "\n\nTất nhiên. Thật vô lý nếu Ta kỳ vọng sự giúp đỡ từ một người như [visiting_ruler.GetFirstNameNoTooltip] và loại người như [visiting_ruler.GetHerHis]. Xin nguyền rủa ngôi mộ của [visiting_ruler.GetHerHis]."
  travel_events.2102.desc_positive:0 "\n\nLàm sao... [visiting_ruler.GetSheHe]? Ta... kỳ vọng nhiều hơn ở [visiting_ruler.GetHerHim]. Mắt Ta nhắm một nửa khi vết thương từ sự phản bội này đau hơn bất kỳ lưỡi kiếm nào."
  travel_events.2102.desc_default:0 "\n\n[visiting_ruler.GetSheHe|U] đã chứng kiến sự việc xảy ra mà không giúp đỡ Ta trong lúc cần? Thái độ thờ ơ này thật sự cho thấy ai là người Ngài có thể tin cậy."
  travel_events.2102.a:0 "Điều này thực sự đã nói lên bản tính [visiting_ruler.Custom('InsultAdjectiveGeneric')] của [visiting_ruler.GetTitledFirstNamePossessiveNoTooltip]."

#Visiting Ruler: Letter event - Target Ruler knows you what you did (or rather, didn't do)
  travel_events.2103.t:0 "[murder_target.Custom2('AppropriateGreetingNegative', ROOT.Char )]"
  travel_events.2103.desc_intro:0 "[murder_target.Custom2('NegativeSupplimentaryGreeting', ROOT.Char )]"
  travel_events.2103.desc_negative:0 "\n\nTa không mong đợi gì hơn từ Ngài ngoài việc để Ta thoi thóp giữa hoang mạc của [ROOT.Var('assassination_location').GetProvince.GetName] [ROOT.Var('assassination_location').GetProvince.GetTerrain.GetNameNoTooltip|l].\n\nThật, Ta sẽ chờ ngày linh hồn rời khỏi đôi mắt Ngài, đồ [visiting_ruler.Custom('InsultAdjectiveGeneric')] [murder_target.Custom2('RelationToMe', SCOPE.sC( 'visiting_ruler' ))]."
  travel_events.2103.desc_positive:0 "\n\nLàm sao Ngài có thể, [murder_target.Custom2('RelationToMe', SCOPE.sC( 'visiting_ruler' ))]? Làm sao Ngài có thể bỏ Ta chết giữa [ROOT.Var('assassination_location').GetProvince.GetName] [ROOT.Var('assassination_location').GetProvince.GetTerrain.GetNameNoTooltip|l]? Ta sẽ nhớ điều này, Ngài có thể chắc chắn."
  travel_events.2103.desc_default:0 "\n\n[ROOT.Char.GetTitledFirstName], Ta mong đợi sự tử tế cơ bản và tôn trọng sinh mạng như bất kỳ người tốt nào. Ngài bỏ Ta chết giữa [ROOT.Var('assassination_location').GetProvince.GetName] [ROOT.Var('assassination_location').GetProvince.GetTerrain.GetNameNoTooltip|l] thật sự phản ánh bản chất Ngài không phải là người sùng kính [ROOT.Char.GetWomanMan]. Ta sẽ nhớ điều này."
  travel_events.2103.a:0 "Chà, [murder_target.GetSheHe] #EMP sống sót#! cuối cùng."

#Visiting Ruler: You heroically thwart the assassination of Target Ruler
  travel_events.2104.t:1 "$travel_danger_prefix$ $travel_events_life_or_death.t$, Cách cứu mạng người"
  travel_events.2104.desc:0 "Ta cùng đoàn tùy tùng của mình thúc ngựa lao thẳng vào toán kẻ tính hành thích, đánh úp khiến chúng hoàn toàn trở tay không kịp. Ngươi phải bất tài đến mức nào thì mới không thể quan sát rõ ràng phía sau lưng mình chứ?\n\nChúng ta dễ dàng chém gục vài kẻ chống cự, số còn lại thì chạy trốn vào chốn hoang vu. Ta ngước nhìn lên và thấy [murder_target.GetTitledFirstName] đang chằm chằm nhìn ta, đôi mắt mở to và khuôn miệng khẽ há hốc.\n\nKhi [murder_target.GetSheHe] bừng tỉnh, các nét mặt của [murder_target.GetHerHis] giãn ra, nhưng [murder_target.GetSheHe] trông vẫn đầy kinh ngạc và biết ơn trước sự can thiệp của ta. [murder_target.GetSheHe|U] vẫy tay ra hiệu bảo ta tiến lại gần."
  travel_events.2104.a:0 "Đây là việc tốt của Ta hôm nay."
  travel_events.2104.a_shy:0 "Đó là điều đúng đắn."

#Target Ruler: Visiting Ruler thwarted your assassination
  travel_events.2105.t:0 "$travel_events.2104.t$"
  travel_events.2105.desc_intro:0 "Trong lúc đang tuần du qua các vùng đất thuộc [ROOT.Char.GetCurrentLocation.GetName], chúng ta bất ngờ bị vây hãm bởi những kẻ hành thích. Và, như thể từ trên trời rơi xuống, [visiting_ruler.GetTitledFirstName] cùng đoàn tùy tùng của [visiting_ruler.GetHerHis] phi ngựa tới, lao thẳng vũ khí giương cao vào ngay giữa đám đông thích khách!\n\n"
  travel_events.2105.desc_negative:0 "Ta kinh ngạc khi thấy [ROOT.Char.Custom2('GetRivalNemesis', SCOPE.sC('visiting_ruler'))] chém qua sát thủ, phần còn lại bỏ chạy. [visiting_ruler.GetFirstNameNoTooltip] quay lại, dừng ngay trước mặt Ta: 'Có vẻ Ngài cần giúp đỡ,' [visiting_ruler.GetSheHe] gầm.\n\nTa ngập ngừng. Dù [visiting_ruler.GetSheHe] #EMP đã#! cứu Ta, làm sao Ta có thể tin [visiting_ruler.GetHerHim]...? Ta miễn cưỡng gật đầu."
  travel_events.2105.desc_positive:0 "Ta vui mừng khi thấy người cứu và [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('visiting_ruler'))] [visiting_ruler.GetFirstNameNoTooltip] đuổi sát thủ, rồi vòng lại đoàn tùy tùng: 'Người [visiting_ruler.Custom2('RelationToMe', ROOT.Char)] của Ta! Mọi chuyện thế nào?' [visiting_ruler.GetSheHe|U] cười với Ta."
  travel_events.2105.desc_default:0 "Hành động giúp người — dù là người xa lạ — thật sự cho thấy có một kế hoạch thần thánh. Chắc hẳn đây là dấu hiệu từ [ROOT.Char.GetFaith.HighGodName] rằng chuyến đi của chúng Ta được phù hộ.\n\nNgười cứu quay lại gật đầu lịch sự. Ta mỉm cười đáp lại: '[ROOT.Char.GetFaith.HighGodName] phù hộ cho ngài, [visiting_ruler.GetLadyLord]!'"
  travel_events.2105.a:0 "Ngươi thật quý phái!"
  travel_events.2105.a_cynical:0 "Cảm ơn về tấm lòng."
  travel_events.2105.a.tt: "[visiting_ruler.GetShortUIName] đã cứu Ngài!"

#County Liege: You notice a Travelling Ruler coming under attack
  travel_events.2107.t:1 "$travel_danger_prefix$ $travel_events_life_or_death.t$, Nơi an toàn"
  travel_events.2107.desc_intro_plains:0 "Khi mặt trời bắt đầu lặn, Ta nhìn ra [holding_location.GetTerrain.GetNameNoTooltip|l] từ phòng tại [holding_location.GetName]. Xa xa, một nhóm du khách đang băng qua cánh đồng phía trước. "
  travel_events.2107.desc_intro_desert:0 "Làn gió nhẹ thổi trên cát ngoài [holding_location.GetName], cuốn bụi xoáy tứ phía. Nhìn ánh mặt trời ngoài pháo đài, Ta nhận thấy một nhóm du khách đang đi qua sa mạc. "
  travel_events.2107.desc_intro_wetlands:0 "Khi mặt trời lặn, [holding_location.GetTerrain.GetNameNoTooltip|l] ngoài [holding_location.GetName] nhuốm sắc tối. Từ pháo đài, Ta quan sát và thấy một nhóm du khách đi qua những con đường lầy lội. "
  travel_events.2107.desc_intro_forest:0 "Khi mặt trời lặn, khu rừng quanh [holding_location.GetName] tối dần. Ta quan sát và nhận thấy nhóm du khách đi dọc theo mép rừng. "
  travel_events.2107.desc_intro_mountains:0 "Không khí trong lành khi Ta nhìn xuống thung lũng bên dưới [holding_location.GetName]. Ta thấy một nhóm du khách đang đi qua thung lũng. "
  travel_events.2107.desc_intro_hills:0 "Những ngọn đồi quanh [holding_location.GetName] dịu mắt. Một nhóm du khách đang đi vòng quanh hồ nhỏ, tiến về đích. "
  travel_events.2107.desc_intro_jungle:0 "Khu rừng già vẫn nóng nực và ẩm ướt như thường lệ, và từ sự an toàn nơi thành trì của mình, ta phóng tầm mắt về phía những tán cây phía trên [holding_location.GetName] để ngắm nhìn những loài chim rực rỡ sắc màu đang làm tổ ở trên cao. Từ khóe mắt, ta nhận thấy một nhóm lữ khách đang băng qua những lùm cây rậm rạp ở phía bắc. "
  travel_events.2107.desc_intro:0 "Bầu trời gần như không mây khi Ta đi ngoài rìa [holding_location.GetName]. Trên đường về, Ta nhận thấy nhóm du khách đi gần ngoài ranh giới thành phố. "
  travel_events.2107.desc_segway:0 "\n\nKhi nhìn kỹ hơn, ta nhận ra thủ lĩnh của nhóm không ai khác chính là [travelling_ruler.GetTitledFirstName] cùng đoàn tùy tùng của [travelling_ruler.GetHerHis]. Đang thong thả quan sát chuyển động của họ, ta theo bản năng ngước nhìn lên khi một toán kỵ sĩ nhanh chóng áp sát nhóm người đang yên bình kia.\n\nKhi toán kỵ sĩ đến gần hơn, chúng bắt đầu giương cao vũ khí của mình. "
  travel_events.2107.desc_outro_negative:0 "Chuyện này sẽ thú vị đây."
  travel_events.2107.desc_outro_positive:0 "Ta phải làm gì đó!"
  travel_events.2107.desc_outro_family:0 "Máu chảy ruột mềm, đúng không?"
  travel_events.2107.desc_outro:0 "Nhóm du khách rõ ràng sắp bị tấn công, ngay trên đất #EMP của Ta#!."
  travel_events.2107.a:0 "Chúng ta có trách nhiệm can thiệp."
  travel_events.2107.a_christian:0 "Đó là điều bất kỳ [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] tốt nào cũng làm."
  travel_events.2107.a_outcome_tt:0 "[travelling_ruler.GetShortUIName] sẽ nhớ điều này"
  travel_events.2107.b:0 "Quá nguy hiểm."
  travel_events.2107.b_negative:0 "Thế là tốt rồi."
  travel_events.2107.b_outcome_tt:0 "Nếu [travelling_ruler.GetShortUIName] sống sót, [travelling_ruler.GetSheHe] sẽ nhớ điều này"

#Travelling Ruler: You are saved by County Liege
  travel_events.2108.t:1 "$travel_danger_prefix$ $travel_events_life_or_death.t$, Được cứu"
  travel_events.2108.desc_intro:1 "Khi đi qua [holding_location.GetTerrain.GetNameNoTooltip|l] ở ngoại vi [holding_location.GetName], chúng Ta bất ngờ bị một bầy kỵ binh cướp tấn công, khát máu. Một đoàn kỵ binh khác từ vùng đất gần đó nhanh chóng tiến đến, do [province_liege.GetTitledFirstName] dẫn đầu!"
  travel_events.2108.desc_negative:0 "\n\nTa tạm kìm nén sự ngạc nhiên của mình, vì được cứu bởi chính [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('province_liege'))] của Ta là điều hoàn toàn ngoài dự đoán!"
  travel_events.2108.desc_positive:0 "\n\nTrái tim Ta ấm áp khi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('province_liege'))] của Ta, [province_liege.GetFirstNameNoTooltip], dẫn đầu tấn công thẳng vào phía sau không được bảo vệ của bọn cướp."
  travel_events.2108.desc:0 "\n\nTa thật sự ngạc nhiên trước thái độ vị tha của [province_liege.GetTitleAsNameNoTooltip] địa phương, và Ta cầu nguyện [ROOT.Char.GetFaith.HighGodName] rằng họ đã đến kịp thời."
  travel_events.2108.desc_segway:0 "\n\n[province_liege.GetFirstNameNoTooltip] quay ngựa trở lại với một nụ cười đắc thắng trên khuôn mặt của [province_liege.GetHerHis]: "
  travel_events.2108.desc_outro_negative:0 ""Ta không thể để bất kỳ ai khác giành mất niềm vui được kết liễu [province_liege.Custom2('RelationToMe', ROOT.Char)] của ta, đúng không?" Ta ngập ngừng một lát, rồi vặn lại."
  travel_events.2108.desc_outro_positive:0 "\"Ngài có bị thương không? Hãy đến [holding_location.GetNameNoTooltip] dùng chút lòng hiếu khách của chúng Ta khi mọi chuyện lắng xuống.\""
  travel_events.2108.desc_outro:0 "\"Ngài nên tham gia lòng hiếu khách kiểu [province_liege.GetCulture.GetNameNoTooltip] tại [holding_location.GetNameNoTooltip]!\""
  travel_events.2108.a:0 "Thật vinh dự cho Ta!"
  travel_events.2108.a_negative:0 "Cũng may mình còn sống."
  travel_events.2108.a.tt:0 "[province_liege.GetShortUIName] đã đến cứu Ngài!"

#County Liege: You save Travelling Ruler
  travel_events.2109.t:0 "$travel_events.2108.t$"
  travel_events.2109.desc_intro:0 "Bọn cướp không biết mình bị gì. Ta dẫn dắt những chiến binh tinh nhuệ nhất ra chiến trận ngoài [holding_location.GetName] và chúng Ta quét qua nhóm bọn chúng như bơ trên ngày hè nóng bức."
  travel_events.2109.desc_negative:0 "\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('travelling_ruler'))] của Ta, [travelling_ruler.GetTitledFirstName], đứng sững sờ như bị sét đánh, quan sát cuộc tấn công và bảo vệ thành công nhóm đi đường của [travelling_ruler.GetHerHis]."
  travel_events.2109.desc_positive:0 "\n\n[travelling_ruler.GetTitledFirstName] cùng đoàn tùy tùng của [travelling_ruler.GetHerHis] đang reo hò cổ vũ chúng ta khi chúng ta tung ra đòn phản công quyết định nhằm vào lũ gian tặc."
  travel_events.2109.desc:0 "\n\n[travelling_ruler.GetTitledFirstName] quan sát chúng Ta kỹ càng khi chúng Ta dọn dẹp bọn cướp, rồi mềm mại hơn khi nhận ra chúng Ta là Bạn Bè."
  travel_events.2109.desc_segway:0 "\n\nKhi kẻ tấn công cuối cùng chạy trốn, Ta quay lại hướng [travelling_ruler.GetFirstNameNoTooltip], "
  travel_events.2109.desc_outro_negative:0 "người giờ đây dường như đã lấy lại được sự bình tĩnh của [travelling_ruler.GetHerHis]. [travelling_ruler.GetSheHe|U] gật đầu một cách thân thiện về phía ta. "Không có gì mà chúng ta không thể tự giải quyết, nhưng thật tốt khi không phải lao lực quá mức," [travelling_ruler.GetSheHe] thừa nhận."
  travel_events.2109.desc_outro_positive:0 "người đang tiến nhanh về phía Ta. \"[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('province_liege'))] của Ta! Giá như chúng ta gặp nhau trong hoàn cảnh bớt nghiêm trọng hơn,\" [travelling_ruler.GetSheHe] reo lên."
  travel_events.2109.desc_outro:0 "người giờ có vẻ thoải mái hơn với sự hiện diện của chúng Ta. \"Bạn ta, cảm ơn vì đã giúp chúng Ta lúc nguy nan,\" [travelling_ruler.GetSheHe] nói, mỉm cười với Ta."
  travel_events.2109.a:0 "Vùng đất đã an toàn trở lại."
  travel_events.2109.a_negative:0 "Ta chỉ muốn tránh dọn dẹp một mớ hỗn độn lớn hơn."
  travel_events.2109.a_positive:0 "Rất vui được phục vụ, [province_liege.Custom2('RelationToMe', SCOPE.sC('travelling_ruler'))]!"
  travel_events.2109.a_hurt.tt:0 "[ROOT.Char.Custom('KnightCultureNoTooltip')] Bị thương"
  travel_events.2109.a_first_hurt.desc:0 "[first_potential_hurt_knight.GetShortUIName] bị thương trong trận chiến"
  travel_events.2109.a_second_hurt.desc:0 "[second_potential_hurt_knight.GetShortUIName] bị thương trong trận chiến"
  travel_events.2109.a_third_hurt.desc:0 "[third_potential_hurt_knight.GetShortUIName] bị thương trong trận chiến"
  travel_events.2109.a_none_hurt.tt:0 "Không bị thương"
  travel_events.2109.a_none_hurt.desc:0 "Không có [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] nào bị thương trong trận chiến"

#Travelling Ruler: You get ruthlessly attacked
  travel_events.2110.t:1 "$travel_danger_prefix$ $travel_events_life_or_death.t$, Bị bỏ lại"
  travel_events.2110.desc:0 "Đi qua [holding_location.GetTerrain.GetNameNoTooltip|l] ở ngoại vi [holding_location.GetName], chúng Ta bất ngờ bị một bầy kỵ binh cướp tấn công, khát máu. Chúng Ta gần đến nơi trú đóng, chắc chắn [province_liege.GetTitledFirstName] sẽ gửi cứu viện chứ?\n\nKhi thời gian trôi và bọn cướp truy đuổi, tránh giao chiến lâu nhất, rõ ràng là chẳng ai đến giúp cả."
  travel_events.2110.desc_negative:0 "Ta không biết mình kỳ vọng gì từ một [travelling_ruler.Custom2('InsultNoun', ROOT.Char)] như [province_liege.GetFirstNameNoTooltip]. Nhưng ngay cả điều này cũng dưới tầm [province_liege.GetHerHim]."
  travel_events.2110.desc_positive:0 "Ta cảm thấy nhói đau ở ngực khi nhận ra sự phản bội vừa xảy ra bởi [province_liege.GetTitledFirstNameNoTooltip]."
  travel_events.2110.desc_neutral:0 "Làm sao một vị lãnh chúa để những kỵ binh ác độc như vậy tồn tại trong biên cương của [province_liege.GetHerHis] được?"
  travel_events.2110.desc_outro:0 "\n\n[ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] của ta, [knight_to_sacrifice.GetTitledFirstName], phi ngựa lên bên cạnh ta, một vẻ trang nghiêm hiện rõ trong đôi mắt của [knight_to_sacrifice.GetHerHis]. Cả hai chúng ta đều biết rõ chiến thuật mà chúng ta đã từng luyện tập trong quá khứ."
  travel_events.2110.a:0 "Chúng ta đứng cùng nhau."
  travel_events.2110.a_unscathed.tt:0 "Không bị thương"
  travel_events.2110.a_unscathed.desc:0 "Ngài sống sót mà không bị thương"
  travel_events.2110.a_injured.tt:0 "Bị thương"
  travel_events.2110.a_injured.desc:0 "Ngài sống sót nhưng bị thương"
  travel_events.2110.a_severely_injured.tt:0 "Bị thương nặng"
  travel_events.2110.a_severely_injured.desc:0 "Ngài bị thương nặng trong trận chiến"
  travel_events.2110.a_death:0 "Ngài bị giết trong trận chiến"
  travel_events.2110.b:0 "[knight_to_sacrifice.GetFirstNameNoTooltip], Ngài biết phải làm gì."
  travel_events.2110.b_tt:0 "[knight_to_sacrifice.GetShortUIName] ở lại làm mồi nhử cho kẻ tấn công"

#County Liege: You observe the attack on Travelling Ruler
  travel_events.2111.t:1 "$travel_danger_prefix$ $travel_events.2110.t$"
  travel_events.2111.desc_sacrifice:0 "Mặt trời đang lặn dần xuống vùng [holding_location.GetTerrain.GetNameNoTooltip|l] khi ta quan sát khung cảnh trước mắt mình. Nếu ta từng mong đợi một trận chiến toàn diện, thì ta đã lầm.\n\nDường như [travelling_ruler.GetTitledFirstName] đã ra lệnh nghi binh và rút lui, đồng nghĩa với việc một trong số các [travelling_ruler.Custom('KnightCulturePluralNoTooltipLowercase')] của [travelling_ruler.GetHerHis] sẽ ở lại phía sau để bọc lót cho đoạn hậu của phân đội. Trong khi đó, phái đoàn du hành đã chấn chỉnh lại đội hình và đang mở đường máu hướng về phía rìa xa của ranh giới thành phố.\n\nKế hoạch có vẻ hiệu quả, khi toán kỵ sĩ phớt lờ nhóm người đang trốn chạy mà thay vào đó tập trung vây hãm người chiến binh đơn độc, hoàn toàn nuốt chửng [knight_to_sacrifice.GetHerHim] khỏi tầm mắt của ta. Hy vọng rằng kết cục diễn ra thật nhanh chóng."
  travel_events.2111.desc_unscathed:0 "Khi vầng thái dương nhuộm đỏ bầu trời lúc lụi tàn nơi chân trời, trận chiến trước mắt ta cũng nhuộm đỏ mặt đất. Tuy nhiên, có vẻ như nơi này chỉ nhuốm đỏ bởi máu của lũ gian tặc.\n\nPhái đoàn du hành đang thể hiện bản lĩnh đáng kinh ngạc trước cuộc tấn công bất ngờ, và họ đang chiến đấu một mất một còn — cuối cùng đã ép lũ gian tặc phải tháo chạy. Chúng chỉ đơn giản là vứt bỏ vũ khí của mình và nhanh chóng rút lui theo con đường chúng vừa đến.\n\n[travelling_ruler.GetTitledFirstName] ra dấu đầy thách thức về phía thành trì của ta, và ta khẽ nhướng mày kinh ngạc trong im lặng. Điều này quả là #EMP vô cùng#! bất ngờ."
  travel_events.2111.desc_survived:0 "Khi mặt trời lặn trên [holding_location.GetTerrain.GetNameNoTooltip|l], hai nhóm hợp nhất trong một hỗn loạn của vũ khí và đau đớn. Ta quan sát khi cú sốc ban đầu qua đi, họ đứng dậy và đẩy lùi kỵ binh vũ trang.\n\n[travelling_ruler.GetTitledFirstName] dẫn đầu phản công, nhanh và chết chóc xuống bọn cướp bẩn thỉu. Một tên dường như gây thương tích nặng lên [travelling_ruler.GetFirstNameNoTooltip], nhưng bị trả đòn ngay bởi một trong [travelling_ruler.GetHerHis] [travelling_ruler.Custom('KnightCulturePluralNoTooltipLowercase')].\n\nNhững kỵ binh còn sống rút lui nhanh chóng, để lại xác và động vật chết; nhưng đoàn đi đường vẫn khỏe mạnh đáng ngạc nhiên."
  travel_events.2111.desc_died:0 "Khi vầng thái dương nhuộm đỏ bầu trời lúc lụi tàn nơi chân trời, trận chiến trước mắt ta cũng nhuộm đỏ mặt đất. Ta chăm chú quan sát, cố gắng nhận biết xem bên nào đang chiếm thế thượng phong.\n\nMối băn khoăn của ta sớm được làm rõ khi một tên kỵ sĩ đặc biệt to lớn và lực lưỡng gầm lên đắc thắng, giơ cao hai tay của [rider.GetHerHis] hướng lên bầu trời. Một tay hắn đang cầm một lưỡi đao, tay còn lại... là thủ cấp của [travelling_ruler.GetTitledFirstName]."
  travel_events.2111.desc_negative_outro:0 "\n\nTa thở phào nhẹ nhõm. Cuối cùng, [travelling_ruler.Custom2('InsultNoun', ROOT.Char)] đó không còn là gai trong mắt Ta nữa."
  travel_events.2111.desc_positive_outro:0 "\n\nTa chớp mắt vài lần, chưa hiểu hết chuyện vừa xảy ra. Vâng, Ta đoán đây là kết thúc cho [travelling_ruler.GetHerHim]..."
  travel_events.2111.desc_outro:0 "\n\nTa cảm thấy trống rỗng, vừa chứng kiến cái chết của [travelling_ruler.GetTitledFirstNameNoTooltip]. Ta nên làm gì đó với bọn kỵ binh kia."
  travel_events.2111.a:0 "Chiến thuật thú vị."
  travel_events.2111.a_compassionate:0 "Mình đã làm gì..."
  travel_events.2111.a_sadist:0 "Thú vị!"
  travel_events.2111.a_dead:0 "Điều này sớm muộn cũng phải xảy ra."
