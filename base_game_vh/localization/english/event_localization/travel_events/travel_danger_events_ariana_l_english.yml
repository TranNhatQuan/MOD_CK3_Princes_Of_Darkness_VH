l_english:
  travel_danger_events.7000.t: "$travel_danger_prefix$ Rắn!"
  travel_danger_events.7000.desc_intro: "Khi chúng Ta tiến về [destination.GetName], chúng Ta dừng lại để nghỉ ngắn."
  travel_danger_events.7000.desc_desert: "Vài người băng qua các cồn cát, trong khi những người khác nghỉ ngơi dưới bóng râm của đoàn lữ hành. Mặt trời đang ở đỉnh điểm, và cái nóng thật ngột ngạt. Ta đứng nhìn [snake_victim.GetTitledFirstName] chậm chạp bước đi trên cát, nhưng bỗng nhiên [snake_victim.GetSheHe] quỵ gối xuống [snake_victim.GetHerHis], ôm chặt lấy chân của [snake_victim.GetHerHis]."
  travel_danger_events.7000.desc_oasis: "Hầu hết mọi người tụ tập quanh ốc đảo, uống dòng nước mát lành và rửa sạch bụi bẩn trên mặt. [snake_victim.GetName] nhúng bàn tay của [snake_victim.GetHerHis] xuống nước, và bốt chốc [snake_victim.GetSheHe] giật phắt người lại với một tiếng hét thất thanh."
  travel_danger_events.7000.desc_mountains: "Nhiều người đi tìm thức ăn hoặc nước, trong khi những người khác nghỉ dưới bóng cây. Ta quan sát [snake_victim.GetName] kiếm thức ăn trong bụi rậm, nhưng đột nhiên [snake_victim.GetSheHe] nhảy lùi và kêu lên."
  travel_danger_events.7000.desc_hills: "Nhiều người quây quanh lửa trại, sưởi ấm và kể chuyện. [snake_victim.GetName] ở xa, có lẽ đang tìm kiếm thú rừng. [snake_victim.GetSheHe] với tay vào cỏ, nhưng lập tức kêu lên."
  travel_danger_events.7000.desc_floodplains: "Một vài người lên đường đi lấy nước gần đó, số khác ở lại trông coi đoàn lữ hành và tìm kiếm những vùng đất khô ráo. [snake_victim.GetName] nhúng bình nước của [snake_victim.GetHerHis] xuống dòng nước, nhưng nhanh chóng rụt lại với một tiếng kêu thất thanh."
  travel_danger_events.7000.desc: "\n\n[snake_victim.GetSheHe|U] bị cắn bởi [current_location.Custom('GetRandomRegionalPoisonousSnake')]! Cuối cùng con rắn nhả nanh ra khỏi thịt [snake_victim.GetHerHis], nhưng rõ ràng nọc độc đã gây ảnh hưởng."
  travel_danger_events.7000.desc_recent: "Mặc dù tình hình nghiêm trọng, [snake_victim.GetSheHe] không còn lạ với những nguy hiểm kiểu này..."
  travel_danger_events.7000.a_1: "Chúng ta sẽ đợi cho tình trạng [snake_victim.GetHerHis] cải thiện."
  travel_danger_events.7000.a_2: "Hy vọng theo thời gian, [snake_victim.GetSheHe] sẽ hồi phục."
  travel_danger_events.7000.a_3: "Tốt nhất là để cơ thể [snake_victim.GetHerHis] nghỉ ngơi."
  every_victim_relation_tt: "Mọi thành viên gia đình của [snake_victim.GetName]:"
  travel_danger_events.7000.a_recover: "[snake_victim.GetSheHe|U] hồi phục sau nọc độc"
  travel_danger_events.7000.a_dont_recover: "[snake_victim.GetSheHe|U] vẫn như cũ"
  travel_danger_events.7000.a_dont_recover_die: "[snake_victim.GetSheHe|U] chết vì nọc độc"
  travel_danger_events.7000.b: "Có lẽ nọc độc có thể được chữa..."
  travel_danger_events.7000.b_flavor: "Ngài cố tự chữa nọc độc"
  travel_danger_events.7000.treatment_good: "Phương thuốc thành công"
  travel_danger_events.7000.treatment_bad: "Nọc độc không phản ứng với phương thuốc"
  travel_danger_events.7000.c: "À, có lẽ ai đó ở [current_location.GetNameNoTooltip] có thể giúp."
  travel_danger_events.7000.c_tt: "Ngài trả tiền cho một người địa phương để thử chữa nọc độc"
  travel_danger_events.7000.d_physician: "[treatment_giver.GetNameNoTooltip] là một thầy thuốc lành nghề."
  travel_danger_events.7000.c_known: "[current_location.GetTitle.GetHolder.GetNameNoTooltip] cư trú ở đây, [current_location.GetTitle.GetHolder.GetSheHe] có thể giúp."
  travel_danger_events.7000.c_known_tt: "Ngài dùng quan hệ với [current_location.GetTitle.GetHolder.GetName] để tìm thầy thuốc giỏi."
  travel_danger_events.7000.d: "[treatment_giver.GetNameNoTooltip] khá thông minh, có lẽ [treatment_giver.GetSheHe] có thể giúp."
  travel_danger_events.7000.e_flavor: "Ban phát lương thực cho [snake_victim.GetHerHim], để [snake_victim.GetSheHe] có cơ hội phục hồi cao hơn."
  travel_danger_events.7000.d_tt: "[treatment_giver.GetName] cố chữa nọc độc"
  travel_danger_events.7000.d_tt_phys: "[treatment_giver.GetName] chữa cho [snake_victim.GetFirstName]"
  travel_danger_events.7000.e: "Hãy cho [snake_victim.GetFirstNameNoTooltip] ăn thêm một phần tối nay."
  travel_danger_events.7000.f_sea: "Để thủy triều cuốn đi [snake_victim.GetHerHim]!"
  travel_danger_events.7000.f: "Ta không muốn nhìn [snake_victim.GetHerHim] chịu đau."
  travel_danger_events.7000.g: "Đủ rồi, hãy tiếp tục hành trình."
