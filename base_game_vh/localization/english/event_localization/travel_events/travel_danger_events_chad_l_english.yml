l_english:
 
  travel_danger_events.5000.t:0 "$travel_danger_prefix$ Một Đoàn Người Cãi Lộn"
  travel_danger_events.5000.intro.land:0 "Khi chúng Ta đi qua [location.GetName], đoàn lữ hành dừng lại ở một khoảng trống được bao quanh bởi [location.Custom('GetProvinceFoliageDesc')]. Ta tiến về phía ồn ào chỉ để thấy [entourage_member_one.GetFirstName] và [entourage_member_two.GetFirstName] đang cãi nhau dữ dội.\n\n"
  travel_danger_events.5000.intro.sea:0 "Nghe thấy vài tiếng động và la hét giận dữ từ bên ngoài, Ta vội chạy lên từ khoang dưới chỉ để thấy [entourage_member_one.GetFirstName] và [entourage_member_two.GetFirstName] đang tranh cãi căng thẳng.\n\n"
  travel_danger_events.5000.craven:0 ""Tại sao ngươi làm khổ ta, [entourage_member_two.GetFirstNameNoTooltip]? Ta ghét bị giật mình từ phía sau, đặc biệt là khi đi qua những [location.Custom('GetTerrainLandPlural')] này!"\n\n"Thôi mà, chỉ là đùa thôi! Hãy lấy chút can đảm — vì tất cả chúng ta...""
  travel_danger_events.5000.brave:0 ""Hãy phấn chấn lên, đồ [entourage_member_two.Custom2('InsultNoun', SCOPE.sC('entourage_member_one'))] sướt mướt kia, và #EMP đấu với ta đi#!! Hãy cho ta thấy giá trị của ngươi! Một kẻ hèn nhát như ngươi không có quyền tham gia vào cuộc hành trình này!" [entourage_member_one.GetFirstNameNoTooltip] nhổ nước bọt xuống đất.\n\n[entourage_member_two.GetFirstNameNoTooltip] chỉ biết co rúm lại vì sợ hãi, âm thầm khóc lóc một mình [entourage_member_two.GetHerselfHimself]."
  travel_danger_events.5000.chaste:0 ""Ngươi có thôi lải nhải về những... #EMP thương vụ#! đầy nhục dục của mình đi không, đồ [entourage_member_two.Custom2('InsultNounSexual', SCOPE.sC('entourage_member_one'))]! Ta không muốn nghe thêm một lời nào nữa!" [entourage_member_one.GetFirstNameNoTooltip] che mặt [entourage_member_one.GetHerHis] vì xấu hổ.\n\n"Thôi đi mà, [entourage_member_one.GetFirstNameNoTooltip]! Ta từ chối cảm thấy hổ thẹn vì những nhu cầu..." [entourage_member_two.GetFirstNameNoTooltip] đáp lại đầy phẫn nộ."
  travel_danger_events.5000.stubborn:0 ""Ta thề chúng ta đi sai đường! Ta sẽ không bước thêm một bước nào nữa cho đến khi chuyện này được giải quyết!" [entourage_member_one.GetFirstNameNoTooltip] hét.\n\n"#EMP Ngươi lỳ lợm như con dê già!#! Chẳng thấy cả đoàn đã mệt mỏi vì ngươi và [entourage_member_one.Custom2('PointOfRidicule', ROOT.Char)] sao?""
  travel_danger_events.5000.generous:0 ""Lần cuối cùng rồi, [entourage_member_two.GetFirstNameNoTooltip], ta không còn gì để cho nữa! Ngươi dám đòi thêm vàng sau khi ta đã để ngươi vắt kiệt ta!" [entourage_member_one.GetFirstNameNoTooltip] gầm gừ.\n\n"Nhưng ta cần nhiều hơn! Đừng keo kiệt như vậy, [entourage_member_one.GetFirstNameNoTooltip]!""
  travel_danger_events.5000.gregarious:0 ""Nào mà, [entourage_member_two.GetFirstNameNoTooltip], ta chỉ đang cố gắng giết thời gian thôi mà. Chúng ta chẳng phải nên tìm hiểu nhau một chút sao?" [entourage_member_one.GetFirstNameNoTooltip] thốt lên, một vẻ ủ dột hiện rõ trên khuôn mặt của [entourage_member_one.GetHerHis].\n\n[entourage_member_two.GetFirstNameNoTooltip] run lên vì khó chịu, dường như đã sẵn sàng lao thẳng về [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]."
  travel_danger_events.5000.shy:0 "[entourage_member_one.GetFirstNameNoTooltip], bối rối, quay sang Ta giải thích, "[entourage_member_two.GetFirstNameNoTooltip] không chịu buông tha! Hãy bảo tên [entourage_member_one.Custom2('InsultAdjective', SCOPE.sC('entourage_member_two'))] [entourage_member_one.Custom2('InsultNoun', SCOPE.sC('entourage_member_two'))] này rằng ta cần yên tĩnh!"\n\n"Ta chỉ đang đùa về [entourage_member_one.GetFirstNamePossessiveNoTooltip] [entourage_member_one.Custom2('PointOfRidicule', SCOPE.sC('entourage_member_two'))], thật mà!""
  travel_danger_events.5000.just:0 ""Ngươi dám làm ta ngã khỏi ngựa, [entourage_member_one.GetFirstNameNoTooltip]! Ngươi [entourage_member_one.Custom2('InsultAdjective', SCOPE.sC('entourage_member_two'))] [entourage_member_one.Custom2('InsultNoun', SCOPE.sC('entourage_member_two'))]!" [entourage_member_two.GetFirstNameNoTooltip] kêu lên, nằm sõng soài trên [location.Custom('GetProvinceGroundDesc')].\n\n"Ta không chịu trách nhiệm cho sự thiếu kỹ năng của ngươi," [entourage_member_one.GetFirstNameNoTooltip] trả lời với nụ cười tự mãn."
  travel_danger_events.5000.patient:0 ""...và đó là cách ta thoát khỏi tình huống tuyệt vọng khi ghé thăm [location.GetNameNoTooltip] trước đây. Thực ra, điều này làm ta nhớ đến một câu chuyện khác..."\n\n"#EMP Không nói nữa, [entourage_member_one.GetFirstNameNoTooltip]!#!" [entourage_member_two.GetFirstNameNoTooltip] chen ngang."
  travel_danger_events.5000.impatient:0 "[entourage_member_one.GetFirstNameNoTooltip] than vãn lớn tiếng. "Chúng ta #EMP bao giờ mới#! đến [next_destination.GetName]? Ta không thể đi thêm một dặm nữa!"\n\n"Chúng ta sẽ đến khi đến! Cơn càu nhàu vô ơn của ngươi chỉ mang lại tâm trạng xấu cho cả đoàn. Nếu là ta, ta đã bỏ ngươi lại ở [random_visited_province.GetNameNoTooltip] rồi!""
  travel_danger_events.5000.temperate:0 ""Ngươi đúng là một con heo tham ăn và tội lỗi! Không nghĩ đến gì ngoài đồ ăn trong một giờ sao!"\n\n"Nhưng ta #EMP đói quá#! Chỉ nghĩ đến tất cả [entourage_member_two.Custom('GetExpensiveDessert')] mà chúng ta bỏ lại ở [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]," [entourage_member_two.GetFirstNameNoTooltip] than vãn, nước miếng chảy ra từ miệng [entourage_member_two.GetHerHis]."
  travel_danger_events.5000.paranoid:0 ""Ngươi được cử đến đây để hại ta! Đừng nói dối, ngươi [entourage_member_two.Custom2('InsultAdjective', SCOPE.sC('entourage_member_one'))] kẻ mưu mô!" [entourage_member_one.GetFirstNameNoTooltip] hét lên trong hoảng loạn.\n\n"Bình tĩnh đi, [entourage_member_one.GetFirstNameNoTooltip]! Chỉ là ta thôi! Sao ngươi lại nghĩ vậy?" [entourage_member_two.GetFirstNameNoTooltip] đáp, cố trấn an [entourage_member_one.GetWomanMan]."
  travel_danger_events.5000.zealous:0 "[entourage_member_one.GetFirstNameNoTooltip] dường như đang ca tụng những đức hạnh của đức tin [entourage_member_one.GetFaith.GetNameNoTooltip]. "...nhưng ngươi không hiểu được tầm quan trọng của [entourage_member_one.GetFaith.HighGodName] đối với một cuộc sống tốt đẹp. Điều tối quan trọng là — "\n\n"#EMP Lại chuyện này nữa à!#!" [entourage_member_two.GetFirstNameNoTooltip] đảo mắt [entourage_member_two.GetHerHis]. "Lạy [entourage_member_two.GetFaith.HighGodName], nếu Người đang lắng nghe, xin hãy cứu con khỏi tên [entourage_member_one.Custom2('InsultNoun', SCOPE.sC('entourage_member_two'))] này, con xin Người!""
  travel_danger_events.5000.fallback:0 ""Ta không muốn nghe thêm bất kỳ điều ngu xuẩn nào từ ngươi nữa, đồ [entourage_member_two.Custom2('InsultAdjective', SCOPE.sC('entourage_member_one'))] [entourage_member_two.Custom2('InsultNoun', SCOPE.sC('entourage_member_one'))]!" [entourage_member_one.GetFirstNameNoTooltip] giậm chân [entourage_member_one.GetHerHis] xuống [location.Custom('GetProvinceGroundDesc')].\n\n"Ngươi mới là kẻ đã cằn nhằn suốt cả chặng đường này! Cứ rên rỉ '#EMP Chúng ta đã đến nơi chưa?#!' ở mỗi ngã rẽ!" [entourage_member_two.GetFirstNameNoTooltip] vặn lại."

  travel_danger_events.5000.a:0 "Thôi nào, chắc chắn hai người có thể làm lành."
  travel_danger_events.5000.a.success:0 "Ngài thuyết phục [entourage_member_one.GetFirstNameNoTooltip] và [entourage_member_two.GetFirstNameNoTooltip] giải quyết mâu thuẫn"
  travel_danger_events.5000.a.failure:0 "[entourage_member_one.GetFirstNameNoTooltip] và [entourage_member_two.GetFirstNameNoTooltip] không thể hòa giải"
  entourage_member_one_leaves.tt:0 "[entourage_member_one.GetFirstNameNoTooltip] rời khỏi đoàn của Ngài"
  entourage_member_two_leaves.tt:0 "[entourage_member_two.GetFirstNameNoTooltip] rời khỏi đoàn của Ngài"
  travel_danger_events.5000.b:0 "Chúng ta không có thời gian cho những tranh cãi vặt vãnh của các ngươi!"
  travel_danger_events.5000.c:0 "Chỉ có một cách để giải quyết chuyện này."
  travel_danger_events.5000.c.success:0 "[entourage_member_one.GetFirstNameNoTooltip] thắng"
  travel_danger_events.5000.c.failure:0 "[entourage_member_two.GetFirstNameNoTooltip] thắng"

  travel_danger_events.5010.t:0 "$travel_danger_prefix$ Hết Chỗ"
  travel_danger_events.5010.desc.intro:0 "Sau vài ngày đi mệt mỏi, chúng Ta đã dừng lại tại một nhà trọ ở [location.GetName] để tìm chỗ nghỉ qua đêm. Ta cử [ROOT.Char.Custom2('RelationToMeShort', travel_leader )] [travel_leader.GetName] đi hỏi về khả năng lưu trú. Tuy nhiên, vẻ mặt u sầu khi [travel_leader.GetHerHis] trở về đoàn báo trước điều không lành.\n\n"
  travel_danger_events.5010.desc.seriously:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], như ngài có thể đã đoán trước..."\n\n[travel_leader.GetSheHe|U] chỉ biết cúi đầu bất lực của [travel_leader.GetHerHis]. Tên [angry_char.Custom2('InsultNoun', ROOT.Char)] [angry_char.Custom2('InsultAdjective', ROOT.Char)] đó, [angry_char.GetTitledFirstName], đang quyết tâm biến cuộc hành trình này thành một địa ngục trần gian đối với thần!"
  travel_danger_events.5010.desc.again:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], một lần nữa, chủ nhà trọ nói rằng họ #EMP hoàn toàn đầy!#! Có vẻ như [angry_char.GetName] đã lan truyền tin về chuyến đến của chúng ta ở vùng này.""
  travel_danger_events.5010.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], chủ nhà trọ nói rằng chỗ đã đầy, dù trong phòng chung rất ít khách. Ta nghi ngờ họ từ chối vì vùng đất này thuộc về [angry_char.GetName]...""

  travel_danger_events.5010.a_seriously:0 "Tên [angry_char.GetFirstNameNoTooltip] sẽ hối hận..."
  travel_danger_events.5010.a_again:0 "#EMP Lại nữa sao?#! Thật là tên [angry_char.Custom2('InsultNoun', ROOT.Char)]!"
  travel_danger_events.5010.a:0 "Không sao, chúng ta sẽ tìm chỗ khác."
  travel_danger_events.5010.b_seriously:0 "#EMP CHO. TA. VÀO!#!"
  travel_danger_events.5010.b:0 "Không ai cản [ROOT.Char.GetTitledFirstNameNoTooltip] nghỉ ngơi."
  travel_danger_events.5010.b.flavor:0 "Ngài cố gắng xông vào nhà trọ bằng bạo lực"
  travel_danger_events.5010.b.success:0 "Chủ nhà trọ bị khuất phục"
  travel_danger_events.5010.b.failure:0 "Chủ nhà trọ chống cự lại"
  travel_danger_events.5010.c:0 "Ta sẽ nói chuyện với chủ nhà trọ."
  travel_danger_events.5010.c.flavor:0 "Ngài cố thuyết phục chủ nhà trọ cho Ngài và đoàn nghỉ lại"
  travel_danger_events.5010.c.success:0 "Chủ nhà trọ bị thuyết phục"
  travel_danger_events.5010.c.failure:0 "Chủ nhà trọ không bị thuyết phục"
