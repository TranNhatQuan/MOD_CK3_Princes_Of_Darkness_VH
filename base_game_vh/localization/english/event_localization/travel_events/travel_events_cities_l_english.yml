l_english:
 #Travel City Events
 #Generic:
  travel_city_companion_impressed:0 "\n\n[ROOT.Char.Custom2('RelationToMe', sightseeing_companion)] của Ta lầm bầm khi chiêm ngưỡng cảnh tượng học thuật này: “Ta có thể dành cả đời ở đây [ROOT.Char.Custom2('RelationToMeAddress', sightseeing_companion)|U]”\n"
  travel_city_companion_idea:0 "\n\n[ROOT.Char.Custom2('RelationToMe', sightseeing_companion)] của Ta, [sightseeing_companion.GetFirstName], trầm ngâm suy nghĩ: “[ROOT.Char.Custom2('RelationToMeAddress', sightseeing_companion)|U], chúng ta có thể dành thời gian ở đây để học hỏi tập quán của họ.”"
  travel_city_option_study_locals: "Hãy học hỏi những gì có thể ở đây."
  travel_city_option_souvenir: "Ta sẽ tìm thứ gì đó để mang về từ đây."
  travel_city_option_reflection_on_existance: "Đáng để suy ngẫm về sự mong manh của cuộc sống."
  travel_city_option_reflection_on_existance_tooltip:0 "Ta dành thời gian suy ngẫm về sự mong manh của cuộc sống"
  travel_city_contemplated_life_and_death:0 "Ta suy ngẫm về sự sống và cái chết"
  travel_city_contemplated_religion_tooltip:0 "Ta dành thời gian suy ngẫm về bản chất của Đấng Christ"
  travel_city_religious_mystic:0 "Ta kết nối với khía cạnh huyền bí của đức tin"
  travel_city_contemplated_life_and_death_companion:0 "[sightseeing_companion.GetName] và Ta thảo luận về sự sống và cái chết"
  travel_city_option_learn_local_history: "Ta cần biết nhiều hơn về thành phố xưa cũ này."
  travel_city_duel_history_fail:0 "[sightseeing_companion.GetName] không thể dạy Ta lịch sử của [city_province.GetNameNoTooltip]"
  travel_city_duel_teaching_fail_no_companion:0 "Ta không học được gì có giá trị ở [city_province.GetNameNoTooltip]"
  travel_city_option_learning: "Cơ hội tuyệt vời để có một cuộc trò chuyện học thuật."
  travel_city_duel_teaching_great_success:0 "Ta thu nhận được nhiều hiểu biết từ chuyến thăm [city_province.GetNameNoTooltip]"
  travel_city_duel_teaching_success:0 "Ta học được nhiều điều mới ở [city_province.GetNameNoTooltip]"
  travel_city_duel_teaching_fail:0 "Ta tạo được ấn tượng tạm ổn"
  travel_city_duel_teaching_great_fail:0 "Ta tự làm bẽ mặt mình khi tiếp xúc với dân địa phương ở [city_province.GetNameNoTooltip]"
  travel_city_duel_learning_fail:0 "Ta không học hỏi được gì từ lịch sử"
  duel_companion_tooltip:0 "Người đồng hành [sightseeing_companion.GetName] đã cải thiện khả năng thành công của lựa chọn này"
  travel_city_option_study_fortifications: "Hãy nghiên cứu những công trình kiến trúc đáng chú ý này."
  travel_city_option_party_hard:0 "Ta sẽ tận hưởng tất cả những gì nơi này mang lại!"
  travel_city_option_earn_money: "Đây là cơ hội để #EMP kiếm#! tiền!"
  travel_city_new_dessert:0 "[ROOT.Char.Custom('FavoriteTreat')] của [city_province.GetNameNoTooltip] gây ấn tượng với Ta"
  travel_city_new_techniques:0 "Ta sẽ mang về những kỹ thuật và thời trang mới từ [city_province.GetNameNoTooltip]"
  travel_city_well_rested:0 "Ta đã có một kỳ nghỉ thư giãn ở [city_province.GetNameNoTooltip]"
  travel_city_resupplied:0 "Ta đã kiếm được tiền và tiếp tế ở [city_province.GetNameNoTooltip]"
  travel_city_option_opt_out: "Ta sẽ không lãng phí thời gian ở nơi này."
  travel_city_major_windfall: "Ta kiếm được ít nhưng học hỏi được nhiều ở khu Ngân hàng của [city_province.GetNameNoTooltip]"
  travel_city_gained_money: "Ta tìm thấy các nhà tài chính ở khu Ngân hàng của Constantinople"
  travel_city_option_opt_out_tooltip:0 "Chỉ dành thời gian cần thiết ở [city_province.GetNameNoTooltip] để chuẩn bị cho chuyến hành trình tiếp theo"
  souvenir_bought_companion:0 "[sightseeing_companion.GetName] giúp Ta mua [souvenir.GetName]"
  book_souvenir_companion_tooltip:0 "Cơ hội tìm được sách tốt hơn được cải thiện nhờ người đồng hành [sightseeing_companion.GetName]"
  book_souvenir_tooltip:0 "Một hiện vật sách sẽ được mua tại chợ sách"
  book_souvenir_bought:0 "[souvenir.GetName] được mua tại các chợ sách của [city_province.GetNameNoTooltip]"
  book_artifact_loc:0 "[souvenir.GetDesc]\n\nỞ trang cuối, có ai đó ghi chú đã mua nó tại chợ sách của [city_province.GetName]."
  regalia_artifact_loc: "[souvenir.GetDesc]\n\nRegalia được gói trong một mảnh vải, nơi ai đó ghi chú đã mua từ một trong những nghệ nhân ở [city_province.GetName]."
  crown_artifact_loc: "[souvenir.GetDesc]\n\nBên trong vương miện có một con dấu nhỏ từ xưởng sản xuất ở [city_province.GetName]."
  souvenir_companion_tooltip:0 "Cơ hội tìm được hiện vật tốt hơn được cải thiện nhờ người đồng hành [sightseeing_companion.GetName]"
  souvenir_tooltip:0 "Một hiện vật sẽ được mua từ các chợ của [city_province.GetNameNoTooltip]"
  souvenir_bought:0 "[souvenir.GetName] được mua ở [city_province.GetNameNoTooltip]"

 #Baghdad - Specific:
  travel_city_baghdad_intro:0 "Đi qua cổng thành [city_province.GetNameNoTooltip], thật khó để không suy ngẫm về việc đã đến trung tâm truyền thống của thế giới Ả Rập và Hồi giáo.\n\n"
  travel_city_baghdad_suq_al_warraqin_title:0 "[city_province.GetNameNoTooltip]: Suq al-Warraqin"
  travel_city_baghdad_royal_enclosure_title:0 "[city_province.GetNameNoTooltip]: Khu Hoàng Gia"
  travel_city_baghdad_cemeteries_title:0 "[city_province.GetNameNoTooltip] của quá khứ"
  travel_city_baghdad_suq_al_warraqin:0 "Khi tiến vào nội thành, không khí tràn ngập các cuộc tranh luận văn học trí thức. Toàn bộ con phố này, kể cả cầu, đều được chi phối bởi hàng trăm hiệu sách và salon văn học nhộn nhịp."
  travel_city_baghdad_royal_enclosure:0 "Ở ngoại vi nội thành, Ta thấy mình bị bao quanh bởi các cung điện nhỏ, bếp núc và tiệm bánh. Trên cao, mái vòm xanh của Cung Điện Cổng Vàng luôn hiện diện."
  travel_city_baghdad_cemeteries:0 "Đi qua thành phố, Ta thấy nhiều tàn tích và di tích cũ. Cuối cùng Ta đến khu nghĩa trang, giữa lăng mộ các Caliph và học giả pháp lý xưa kia."
  travel_city_baghdad_companion_reflection:1 "\n\n[ROOT.Char.Custom2('RelationToMe', sightseeing_companion)] của ta, [sightseeing_companion.GetName], nhận xét rằng đây là những người từng biết đến một Baghdad rất khác, một Baghdad mà ngày nay gần như không thể nhận ra."

#Rome - Specific
  travel_city_rome_intro:0 "Từ xa, thành phố [city_province.GetNameNoTooltip] là một rừng tháp và mê cung các tòa nhà đá. Khi tiến gần, cảnh quan thay đổi: tàn tích các đài tưởng niệm, tường và nhà thờ cổ tồn tại cùng với nông trại và gia súc.\n\n"
  travel_city_rome_fortified_monuments_title:0 "[city_province.GetNameNoTooltip]: Công trình kiên cố"
  travel_city_rome_fortified_monuments:0 "Khi đi qua thành phố, Ta nhận thấy các di tích được các gia tộc tranh chấp củng cố cẩn thận. Nhờ vậy, Lăng Hadrian và cả Colosseum giờ trở thành pháo đài."
  travel_city_rome_caesars_needle_title:0 "[city_province.GetNameNoTooltip]: Kim Tự Tháp Caesar"
  travel_city_rome_caesars_needle:0 "Khi dừng trước một Obelisk lớn, một người địa phương kể rằng tro cốt Julius Caesar nằm ở một hộp tròn nhỏ trên đỉnh.\n\n#EMP “Trong cái chết cũng như trong cuộc sống, Caesar vượt trên mọi người La Mã.”#!"
  travel_city_rome_companion_reflection:0 "\n[ROOT.Char.Custom2('RelationToMe', sightseeing_companion)|U] của ta, [sightseeing_companion.GetName], nói thêm rằng chúng ta nên tận dụng cơ hội này để tìm hiểu sâu hơn về thành phố."
  travel_city_rome_alone_reflection:0 "\nTa không thể không suy ngẫm về tuổi đời khổng lồ của thành phố này."
  travel_city_rome_pilgrims_and_shrines_title:0 "[city_province.GetNameNoTooltip]: Điện thờ và Người hành hương"
  travel_city_rome_pilgrims_and_shrines:0 "Người hành hương dường như ở khắp nơi. Mặc cả, trò chuyện và xếp hàng đến các điện thờ và lăng mộ các thánh của thành phố. Các dinh thự của giới quý tộc quên lãng giờ trở thành nhà trọ cho người tín ngưỡng."

#Constantinople - Specific
  travel_city_constantinople_augustaion_title: "[city_province.GetBaronyNameExplicitlyNoTooltip]: Trung tâm Thế Giới"
  travel_city_constantinople_aqueducts_title: "[city_province.GetBaronyNameExplicitlyNoTooltip]: Cống & Bể chứa"
  travel_city_constantinople_goldsmiths_moneychangers_title: "[city_province.GetBaronyNameExplicitlyNoTooltip]: Thợ vàng & Ngân hàng"
  PROSPHORION_GLOSS: "Cảng thương mại phía bắc của [GetTitleByKey('b_constantinople').GetNameNoTier], thành phố cũng có nhiều cảng quân sự, thương mại và hoàng gia khác."
  travel_city_constantinople_intro: "Không thể không nhận ra [city_province.GetBaronyNameExplicitlyNoTooltip] trên chân trời, với những bức tường khổng lồ chọc lên cảnh quan và khi tiến lên [Glossary( 'Mese', 'MESE_GLOSS')], đám đông cũng gây cảm giác khiêm nhường.\n\n"
  travel_city_constantinople_intro_chalcedon: "Quen với khách lạ, người Constantinople hầu như không chú ý đến chúng Ta ở cảng [Glossary( 'Prosphorion', 'PROSPHORION_GLOSS')]. #EMP Chúng Ta#! thấy các bức tường biển của [city_province.GetBaronyNameExplicitlyNoTooltip] nổi bật ngay cả từ bến [last_visited_location.GetBaronyNameExplicitlyNoTooltip].\n\n"
  travel_city_constantinople_intro_sea: "Khi cập cảng [Glossary( 'Prosphorion', 'PROSPHORION_GLOSS')], chúng Ta kinh ngạc trước quy mô của [city_province.GetBaronyNameExplicitlyNoTooltip], nhìn thấy tháp, mái vòm và tường biển từ xa.\n\n"
  travel_city_constantinople_augustaion: "Đến giữa ngày, chúng Ta nghỉ dưới nắng bên một công trình kỳ lạ ở quảng trường tuyệt đẹp [Glossary( 'Augustaion', 'AUGUSTAION_GLOSS')]. Công trình chứa một mốc vàng mà dân địa phương khẳng định đánh dấu trung tâm thế giới."
  travel_city_center_of_the_world_reflection: "\n\nXung quanh là những tòa nhà tráng lệ, thật khó để không tin lời họ. Sự tồn tại của Ta bỗng trở nên nhỏ bé."
  travel_city_companion_center_of_the_world_reflection:0 "\n\n“[ROOT.Char.Custom2('RelationToMeAddress', sightseeing_companion)|U], đây là nơi không giống bất cứ đâu Ngài từng đến. Chúng ta đứng trước hơn một thiên niên kỷ lịch sử”"
  AUGUSTAION_GLOSS: "Augustaion là quảng trường ngay ngoài cổng Chalke của khu hoàng cung Constantinople. Ở cuối quảng trường là [Glossary( 'Milion', 'MILION_GLOSS' )], trước Hippodrome, hai bên là các nhà tắm tráng lệ Zeuxippos và Nhà thờ Hagia Sophia."
  travel_city_constantinople_aqueduct_valens: "Bị tò mò thúc đẩy, chúng Ta theo [Glossary( 'enormous aqueduct', 'AQUEDUCT_OF_VALENS_GLOSS' )] đến cửa vào bể chứa ngầm. Một lính gác nói đây là nguồn nước của thành phố nhiều thế hệ và đề nghị cho chúng Ta tham quan bên trong với một khoản phí nhỏ.\n"
  travel_city_option_study_aqueducts: "Chúng ta phải khảo sát và ghi chép những chiều sâu này."
  travel_city_constantinople_goldsmiths_moneychangers: "Cuối cùng, chúng Ta dừng lại ở khu thợ vàng. Đây là trung tâm tài chính của thành phố, nơi tiền được trao đổi, cho vay và gửi. Đồng vàng [ROOT.Char.GetCurrentLocation.Custom('GetByzantineCoinWithGloss')] với các hoàng đế đã quên lâu nay đổi tay cùng đồng đồng và electrum."
  BYZANTINE_COINAGE_GLOSS: "Đồng đồng và vàng là tiền tệ chính trong Đế chế Byzantine. Đồng Solidus vàng và sau này là Hyperpyron được đánh giá cao và được tìm kiếm ở phương Tây, nơi được gọi là #EMP Bezants#!."
  AQUEDUCT_OF_VALENS_GLOSS: "#EMP Cống Valens#! được xây thế kỷ 4 và cung cấp nước cho Constantinople hơn một nghìn năm. Kết hợp bể mở và bể ngầm khổng lồ giúp thành phố dự trữ hơn một triệu mét khối nước."
  SOLIDUS: "[Glossary( 'Solidi', 'BYZANTINE_COINAGE_GLOSS')]"
  HYPERPYRON: "[Glossary( 'Hyperpyra', 'BYZANTINE_COINAGE_GLOSS')]"
  FALLBACK_COIN: "đồng"
  travel_city_well_supplied: "Được tiếp tế đầy đủ"
  travel_city_well_supplied_desc: "Nhân vật này vừa tiếp tế đầy đủ các nhu yếu phẩm cần thiết cho hành trình."
