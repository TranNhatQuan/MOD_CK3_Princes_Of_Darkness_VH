l_english:
  tgp_travel_events.0025.t: "Gia Đình Trên Hết"
  tgp_travel_events.0025.desc: ""Thưa [ROOT.Char.GetTitleAsNameNoTooltip] của ta, ta ước ao được ngắm nhìn cảnh vật! Ngài có thể cho phép ta cưỡi cỗ xe của mình đi trước được không? Tầm nhìn của ta đã bị cản trở nghiêm trọng ở phía sau xe của ngài," [spouse.GetTitledFirstName] thỉnh cầu ta khi đang tạm dừng chân tại [ROOT.Char.GetCurrentLocation.GetName]. [spouse.GetSheHe|U] khẽ che miệng ngáp dài sau bàn tay của [spouse.GetHerHis] và nhìn ta với ánh mắt ngái ngủ. \n\nBefore ta kịp lên tiếng phản hồi, [crusty_person.GetTitledFirstName] đã bước tới xen vào với một nụ cười ngọt ngào giả tạo. "Chắc chắn rồi, chúng ta tuyệt đối không được quên tôn ti trật tự mà một người phối ngẫu chuẩn mực cần phải tuân theo. Lễ nghi đòi hỏi rằng [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('spouse'))] của ngài phải ở đúng vị trí được chỉ định của [spouse.GetHerHis].""
  tgp_travel_events.0025.a: "Như ngài [spouse.GetTitleAsNameNoTooltip] mong muốn."
  tgp_travel_events.0025.a.tt: "Mối quan hệ với [spouse.GetTitledFirstName] tăng khả năng sinh sản."
  soulmate_travel_bond: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] gắn kết trong chuyến đi cùng nhau. Ngọn lửa trong nhà ấm áp đêm đó."
  lover_travel_bond: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] gắn kết trong chuyến đi cùng nhau. Ngọn lửa trong nhà ấm áp đêm đó."
  tgp_travel_events.0025.b: "Có phải [crusty_person.GetTitledFirstName] đang tìm cách chia rẽ chúng ta?"
  tgp_travel_events.0025.b.flavor: "Ta phải để mắt cẩn thận đến [crusty_person.GetHerHim]."
  tgp_travel_events.0025.b.success: "Ngài phát hiện ra [crusty_person.GetTitledFirstName] đang giấu điều gì"
  tgp_travel_events.0025.b.failure: "Ngài không phát hiện ra [crusty_person.GetTitledFirstName] đang giấu điều gì"
  tgp_travel_events.0025.c: "Người yêu, ngươi có thể đi phía sau."
  tgp_travel_events.0025.d: "Mọi người im lặng!"
  tgp_travel_events.0030.t: "Thơ Ven Đường"
  tgp_travel_events.0030.desc: "Đến một ngã đường, Ta thấy nhiều bài thơ dán trên các bia giới hạn.\n\nChúng dường như được viết bởi các lữ khách khác, một số nhắc đến những nơi xa xôi như [poem_province.GetName]'s [poem_province.Custom('TerrainInspirationLoc')].\n\nMột bài thơ đặc biệt thu hút Ta. Nó kể về "
  tgp_travel_events.0030.desc.wanderer_poem: "nhiều chuyến đi mà nhà thơ đã trải qua trong đời, và sự phong phú mà không khí tự do mang lại cho tâm hồn."
  tgp_travel_events.0030.desc.diplomacy_poem: "một cuộc tranh cãi khủng khiếp giữa hai gia đình quý tộc, bị xé nát vì tranh chấp thừa kế."
  tgp_travel_events.0030.desc.martial_poem: "nhiều cuộc chiến mà nhà thơ tham gia, một chiến binh vừa tinh thông kiếm vừa tinh thông bút."
  tgp_travel_events.0030.desc.stewardship_poem: "nhiều thử thách của một quý tộc đối mặt với hạn hán và đói kém."
  tgp_travel_events.0030.desc.intrigue_poem: "mối tình nồng nàn giữa hai trẻ em của các gia đình đang chiến tranh."
  tgp_travel_events.0030.desc.learning_poem: "một miêu tả đầy ấn tượng về vùng nông thôn. Rõ ràng được viết bởi một nhà thơ tài ba."
  tgp_travel_events.0030.desc.fallback: "$tgp_travel_events.0030.desc.wanderer_poem$"
  tgp_travel_events.0030.a: "Cố gắng rút ra bài học từ một bài thơ."
  tgp_travel_events.0030.a.success: "Ngài đã thành công trong việc giải thích bài thơ"
  tgp_travel_events.0030.a.failure: "Ngài thất bại trong việc giải thích bài thơ"
  tgp_travel_events.0030.b: "Thật kỳ lạ!"
  tgp_travel_events.0035.t: "Rễ Cây Yếu"
  tgp_travel_events.0035.desc: "Vật lộn qua [ROOT.Char.Custom('TerrainStruggleLoc')], Ta thấy "
  tgp_travel_events.0035.desc.farmlands: "những ngọn đồi lăn tăn của [farming_county.GetProvince.GetName] mở ra trước mắt."
  tgp_travel_events.0035.desc.ricefields: "ruộng bậc thang của [farming_county.GetProvince.GetName] trải dài trước mắt."
  tgp_travel_events.0035.desc.outro: "\n\nMột lão nông đứng bên lề đường, tấm lưng còng xuống bên chiếc bánh xe vừa bị rơi ra khỏi cỗ xe của [farmer_char.GetHerHis]. [farmer_char.GetSheHe|U] nhìn thấy ta cùng phái đoàn của ta, và biểu cảm trên khuôn mặt của [farmer_char.GetHerHis] lập tức biến thành sự nghiêm khắc của một bậc phụ huynh. "Ngài đã trưng binh con trai tôi để tham gia vào cuộc chiến của ngài. Nếu nó ở đây, tôi đã chẳng phải lao dịch cực nhọc thế này." \n\nNhìn ra xa khắp những cánh đồng, ta nhận ra giới nông phu thưa thớt biết nhường nào. Hẳn là bọn họ đều đang chịu chung một số phận tương tự."
  tgp_travel_events.0035.a: "Dừng lại và giúp [farmer_char.GetHerHim]."
  tgp_travel_events.0035.b: "Ta nên cải thiện điều kiện cho nông dân của mình."
  tgp_travel_events.0035.c: "Ta không có thời gian!"
  tgp_travel_events.0040.t: "Lông Trâu"
  tgp_travel_events.0040.desc: "Sự đơn điệu của hành trình bị làm phiền bởi tiếng ve rền trong cỏ dại. Nhưng, khi Ta vòng qua "
  tgp_travel_events.0040.desc.farmlands: "bức tường đá, Ta bắt gặp một nông dân đang chơi đùa với đứa trẻ gần đó, cạnh một con trâu to."
  tgp_travel_events.0040.desc.ricefields: "khúc quanh ruộng lúa, Ta bắt gặp một nông dân đang chơi đùa với đứa trẻ trong nước, cạnh một con trâu to."
  tgp_travel_events.0040.desc.outro: "\n\n\"Ngài [ROOT.Char.GetTitleAsNameNoTooltip]!\" nông dân gọi. \"Con trâu này của Ta. Nó bị lấy trộm khỏi chuồng tối qua! Chắc là [farmer_child.GetHerHis] [parent.GetMotherFather] vô dụng lại làm rối. [farmer_child.GetHerHis|U] [parent.GetMotherFather] là một kẻ say xỉn và trộm cắp, và [farmer_child.Custom('GirlBoy')] này luôn che giấu tội lỗi của [parent.GetHerHis].\" \n\nTa nhìn đứa trẻ. [farmer_child.GetSheHe|U] tái mặt và run rẩy."
  tgp_travel_events.0040.a: "Xử lý [farmer_child.GetHerHis] [parent.GetMotherFather] để làm gương."
  tgp_travel_events.0040.b: "Đứa trẻ có thể trả nợ bằng lao động tại triều."
  tgp_travel_events.0040.c: "Bỏ qua chuyện này."
  tgp_travel_events.0041.t: "Một Khoản Nợ Được Trả"
  tgp_travel_events.0041.desc: "Theo mùa màng thay đổi, thời gian ở triều đình của [farmer_child.GetTitledFirstName] cũng kết thúc. \n\nĐầu tiên, [farmer_child.GetSheHe] phục vụ như một người trông coi chuồng ngựa đáng tin cậy, "
  tgp_travel_events.0041.desc.court_position: "sau đó đã thăng tiến lên vị trí [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('farmer_child'))]. Sự chăm chỉ của [farmer_child.GetHerHis|U] đã giúp nâng cao học vấn của [farmer_child.GetHerHis] và nhào nặn [farmer_child.GetHerHim] thành một [farmer_child.GetWomanMan] đáng gờm!"
  tgp_travel_events.0041.desc.knight: "sau đó trở thành một hiệp sĩ trong quân đội của Ta."
  tgp_travel_events.0041.desc.stables: "và làm việc gần gũi với ngựa suốt nhiều năm, nuôi dưỡng nhiều chiến mã xuất sắc."
  tgp_travel_events.0041.desc.kitchens: "sau đó làm việc với đầu bếp trong bếp, rửa nồi chảo và gọt vô số rau củ."
  tgp_travel_events.0041.desc.study: "sau đó làm việc với các học giả tại triều, mang mực và giữ gìn kho lưu trữ."
  tgp_travel_events.0041.desc.fallback: "$tgp_travel_events.0041.desc.study$"
  tgp_travel_events.0041.desc.alive: "[farmer_child.GetSheHe|U] rõ ràng đã học hỏi được rất nhiều điều trong suốt thời gian lưu lại. \n\nGiờ đây, đã đến lúc trả [farmer_child.GetHerHim] về lại với người [parent.GetMotherFather] nghiện ngập của [farmer_child.GetHerHis] và những cánh đồng của vùng [thieving_county.GetProvince.GetName]."
  tgp_travel_events.0041.desc.dead: "\n\n[farmer_child.GetHerHis|U] [parent.GetMotherFather] say xỉn đã qua đời, và [farmer_child.GetTitledFirstName] có trách nhiệm trở về chăm sóc đất đai gia đình."
  tgp_travel_events.0041.a: "Ta chắc [farmer_child.GetSheHe] sẽ làm tốt khi trở về nhà."
  tgp_travel_events.0041.tt_pay_first: "#weak... nhưng ta phải đền bù cho gia đình họ để tỏ lòng thành.#!"
  tgp_travel_events.0041.c: "[farmer_child.GetTitledFirstName] nên tiếp tục làm Quản Ngựa của Ta."
  tgp_travel_events.0041.d: "[farmer_child.GetTitledFirstName] nên tiếp tục làm Rượu Thủ."
  tgp_travel_events.0041.e: "[farmer_child.GetTitledFirstName] nên tiếp tục làm Thơ Gia Triều."
  tgp_travel_events.0041.f: "[farmer_child.GetTitledFirstName] nên tiếp tục làm Gia Sư tại triều."
  tgp_travel_events.0041.g: "[farmer_child.GetTitledFirstName] sẽ tiếp tục phục vụ Ta!"
  tgp_travel_events.0041.g.tt: "[farmer_child.GetTitledFirstName] tiếp tục phục vụ như [THIS.Char.Custom2('RelationToMeShort', SCOPE.sC('farmer_child'))] của Ngài."
  tgp_travel_events.0045.t: "Phương Pháp Canh Tác Lạc Hậu"
  tgp_travel_events.0045.desc: "Từ đỉnh đồi nhìn ra cánh đồng của [foreign_county.GetName], Ta nhận thấy nông dân đang cày bừa vất vả, làm lưng gù khi gieo hạt bằng tay. \n\nTừ khi nhớ được, chúng ta đã sử dụng máy gieo hạt tại quê nhà. Dường như những người phương Tây này vẫn chưa khám phá ra công nghệ đó."
  tgp_travel_events.0045.a: "Có lẽ Ta có thể sắp xếp trao đổi với thủ lĩnh của họ."
  tgp_travel_events.0045.b: "Ta có thể dạy họ cách canh tác của chúng ta."
  tgp_travel_events.0045.b.flavor: "Những cử chỉ tay sống động và bản vẽ hy vọng sẽ vượt qua rào cản ngôn ngữ."
  tgp_travel_events.0045.b.success: "Ta chứng minh sự ưu việt của văn hóa Nho giáo giáo dục và sáng tạo"
  tgp_travel_events.0045.b.failure: "Cuộc trao đổi gây sự chú ý, nhưng Ta không truyền đạt được ý định của mình"
  cultural_acceptance_taught_methods: "Sự [cultural_acceptance|E] giữa [foreign_county.GetCulture.GetCollectiveNoun] và [foreign_county.GetCulture.GetCollectiveNoun] tăng [minor_cultural_acceptance_gain]."
  tgp_travel_events.0045.c: "Việc này không liên quan đến Ta."
