  pet_animal.3030.bad: "Bằng cách nào đó, họ làm tình trạng đại bàng tệ hơn"

  pet_animal.3040.t: "Cách Huấn Luyện Đại Bàng" # corny
  pet_animal.3040.desc: "Ở tuổi [ROOT.Char.MakeScope.Var('eagle_age_variable').GetValue], [ROOT.Char.Custom('EagleStoryName')] đã trở thành thợ săn khá thành thạo, nhưng luôn còn chỗ để cải thiện. Ta quyết định dành thời gian huấn luyện [ROOT.Char.Custom('EagleStoryHerHim')], xem liệu [ROOT.Char.Custom('EagleStorySheHe')] có thể tốt hơn nữa, hoặc Ta học được điều gì mới về [ROOT.Char.Custom('EagleStoryHerHim')]."
  pet_animal.3040.training_bad_title: "Buổi Huấn Luyện Thất Bại"
  pet_animal.3040.training_good_title: "Buổi Huấn Luyện Thành Công"
  pet_animal.3040.training_bad_desc: "Buổi huấn luyện diễn ra không tốt"
  pet_animal.3040.training_good_desc: "Buổi huấn luyện diễn ra tốt"
  pet_animal.3040.training_very_bad: "Và [ROOT.Char.Custom('EagleStoryName')] bị thương trong quá trình"
  pet_animal.3040.training_bad: "[ROOT.Char.Custom('EagleStoryName')] mất đi một phần sinh lực của [ROOT.Char.Custom('EagleStoryHerHis')]"
  pet_animal.3040.training_neutral: "Nhưng may mắn thay, [ROOT.Char.Custom('EagleStoryName')] không hề hấn gì"
  pet_animal.3040.personality_less_effective: "Tính cách của đại bàng Ngài #N kém hữu ích hơn#!"
