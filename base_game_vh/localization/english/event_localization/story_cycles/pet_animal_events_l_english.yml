l_english:
##############
## CAT
##############
  pet_animal.0001.t:0 "Con Mèo"
  pet_animal.0001.desc:1 "Khi con mèo nằm trên lòng Ta, kêu rừ rừ thỏa mãn, Ta suy nghĩ xem nên đặt tên cho [ROOT.Char.Custom('CatStoryHerHim')] là gì. Một cái tên mang tính lịch sử? Một cái tên ám chỉ bộ lông [ROOT.Char.Custom('CatFurColor')] của [ROOT.Char.Custom('CatStoryHerHis')]? Hay một cái tên diễn tả cảm giác dịu dàng Ta trải qua khi vuốt tai [ROOT.Char.Custom('CatStoryHerHim')]?\n\nÀ, Ta biết rồi! Ta sẽ đặt tên cho [ROOT.Char.Custom('CatStoryHerHim')] là..."
  pet_animal.0001.a:1 "Thật là một cái tên tuyệt vời!"

  pet_animal.0101.t:0 "[ROOT.Char.Custom('CatStoryName')]: Người Tặng Quà"
  pet_animal.0101.desc:0 "Hai mắt [ROOT.Char.Custom('CatEyeColor')] dõi theo Ta khi Ta đi qua, và một tiếng meo nhỏ phá vỡ sự yên lặng khi [ROOT.Char.Custom('CatStoryName')] nhảy lên mắt cá chân Ta."
  pet_animal.0101.desc_old:0 "[ROOT.Char.Custom('CatStorySheHe')|U] đã trải qua nhiều năm, nhưng tuổi tác chưa bao giờ ngăn cản [ROOT.Char.Custom('CatStoryHerHim')]!"
  pet_animal.0101.desc_young:0 "Dù [ROOT.Char.Custom('CatStorySheHe')|U] vẫn còn nhỏ, nhưng [ROOT.Char.Custom('CatStorySheHe')] lại vô cùng hung dữ!"
  pet_animal.0101.desc_middle:0 "Một con mèo đang ở thời kỳ sung sức nhất của [ROOT.Char.Custom('CatStoryHerHis')], dù vậy [ROOT.Char.Custom('CatStorySheHe')] vẫn không hề để lại vết xước nào trên người ta."
  pet_animal.0101.desc_ending:0 "\n\nKhi [ROOT.Char.Custom('CatStorySheHe')] nhảy đi, Ta thấy [ROOT.Char.Custom('CatStorySheHe')] để lại một món quà sáng bóng nơi [ROOT.Char.Custom('CatStorySheHe')] đã ẩn náu."
  pet_animal.0101.a_female:0 "Cảm ơn, quý cô!"
  pet_animal.0101.a_male:0 "Cảm ơn, quý ngài!"

  pet_animal.0103.t:0 "[ROOT.Char.Custom('CatStoryName')]: Chú Tể Bị Mê Hoặc"
  pet_animal.0103.desc:0 "Khi Ta bước ra ngoài, Ta thấy [vassal.GetTitledFirstName] — [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))] — đang cúi bên cạnh mèo của Ta, [ROOT.Char.Custom('CatStoryName')], âu yếm vuốt ve đầu [ROOT.Char.Custom('CatStoryHerHis')].\n\n\"Thật là một con mèo đáng yêu, [ROOT.Char.Custom('FormOfAddressForLiege')] của Ta.\""
  pet_animal.0103.a:0 "Ngươi thật tinh tường!"

  pet_animal.0104.t:0 "[ROOT.Char.Custom('CatStoryName')]: Tiếng Rừ Rừ Dịu Dàng"
  pet_animal.0104.desc:0 "Sau một ngày căng thẳng nữa, Ta gục xuống ghế – liệu Ta có thể chịu nổi bao lâu nữa?\n\nBỗng Ta nghe tiếng meo nhẹ, và mèo của Ta [ROOT.Char.Custom('CatStoryName')] nhảy lên lòng Ta và bắt đầu rừ rừ. Ta ngồi bên [ROOT.Char.Custom('CatStoryHerHim')] một lúc, chỉ lắng nghe âm thanh dịu dàng và vuốt ve bộ lông [ROOT.Char.Custom('CatFurColor')] của [ROOT.Char.Custom('CatStoryHerHis')]."
  pet_animal.0104.a:0 "Ta nghĩ Ta có thể tiếp tục một chút nữa."

  pet_animal.0105.t:0 "[ROOT.Char.Custom('CatStoryName')]: Bí Mật Bị Tiết Lộ"
  pet_animal.0105.desc_opening:0 "#EMP Meo!#!\n\nTa cúi xuống và thấy mèo của Ta [ROOT.Char.Custom('CatStoryName')] đã thả một cuộn giấy dưới chân Ta – niêm phong theo phong cách riêng của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('person'))] [person.GetTitledFirstNamePossessive]. Dâng hiếu kỳ, Ta liếc qua nội dung..."
  pet_animal.0105.desc_murder:0 "\"... vụ giết người Ta đã gây ra đè nặng lên Ta, và...\""
  pet_animal.0105.desc_lover:0 "\"... tình yêu Ta dành cho một người khác...\""
  pet_animal.0105.desc_homosexual:0 "\"... những ham muốn Ta cảm thấy với người cùng giới...\""
  pet_animal.0105.desc_deviant:0 "\"... những hành vi lệch lạc Ta đã gây ra...\""
  pet_animal.0105.desc_cannibal:0 "\"... vì Ta đã nếm thử thịt người...\""
  pet_animal.0105.desc_murder_attempt:0 "\"... khi Ta cố kết liễu mạng sống người khác...\""
  pet_animal.0105.desc_non_believer:0 "\"... vì Ta không tin vào [person.GetFaith.HighGodName]...\""
  pet_animal.0105.desc_incest:0 "\"... Ta cảm thấy ham muốn với thành viên trong gia đình...\""
  pet_animal.0105.desc_witch:0 "\"... hội phù thủy của Ta sẽ...\""
  pet_animal.0105.desc_fallback:0 "\"... giữ bí mật này làm Ta nặng lòng...\""
  pet_animal.0105.a:0 "Ngỡ ngàng khi [person.GetSheHe] giấu một chuyện như vậy...!"
  pet_animal.0105.b:0 "Thế giới phải biết chuyện này."

  pet_animal.0106.t:0 "[ROOT.Char.Custom('CatStoryName')]: Nhạy Cảm"
  pet_animal.0106.desc:0 ""[ROOT.Char.GetFirstNameNoTooltip], con mèo này phải đi!"\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] của ta, [spouse.GetTitledFirstName] đang xách gáy [ROOT.Char.Custom('CatStoryName')] lên, mắt đỏ hoe và mũi sụt sịt. "Ta không thể chịu đựng thêm nữa, ta gần như không thở nổi khi [ROOT.Char.Custom('CatStorySheHe')] quanh quẩn ở đây!""
  pet_animal.0106.a:0 "Ta sẽ đưa [ROOT.Char.Custom('CatStoryHerHim')] cho [receiver_1.GetFirstNameNoTooltip]..."
  pet_animal.0106.b:0 "[receiver_2.GetFirstNameNoTooltip] có thể cần một người Ngài..."
  pet_animal.0106.c:0 "[receiver_3.GetFirstNameNoTooltip] sẽ chăm sóc [ROOT.Char.Custom('CatStoryHerHim')]..."
  pet_animal.0106.d:0 "Ta sẽ không đưa [ROOT.Char.Custom('CatStoryName')] đi!"
  pet_animal.0106.e:0 "Ta... Ta đoán Ta phải loại bỏ [ROOT.Char.Custom('CatStoryHerHim')]..."

  pet_animal.0107.t:0 "[ROOT.Char.Custom('CatStoryName')]: Con Mèo"
  pet_animal.0107.desc:0 ""[giver.Custom2('RelationToMe', SCOPE.sC('spouse'))] của ta không thể chịu nổi việc ở cùng tội nghiệp [ROOT.Char.Custom('CatStoryName')] nữa... Vì vậy ta sẽ tin tưởng giao [ROOT.Char.Custom('CatStoryHerHim')] cho ngài chăm sóc thay ta."\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('giver'))] của ta, [giver.GetTitledFirstName] đưa một con mèo lông màu [receiver.Custom('CatFurColor')] về phía ta. "[ROOT.Char.Custom('CatStoryName')] là một... một người bạn đồng hành tuyệt vời.""
  pet_animal.0107.a:0 "Cảm ơn, Ta sẽ trân trọng [ROOT.Char.Custom('CatStoryHerHim')]!"
  pet_animal.0107.b:0 "Cảm ơn. Ta chắc [ROOT.Char.Custom('CatStorySheHe')] sẽ hữu ích."

  pet_animal.0108.t:0 "[receiver.Custom('CatStoryName')]: Cuộc Sống Không Có Ngươi"
  pet_animal.0108.t_dead:0 "Cuộc Sống Không Có Ngươi"
  pet_animal.0108.desc_opening:0 "Ta đến thăm [receiver.GetTitledFirstName] — [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('receiver'))] — xem [receiver.Custom('CatStoryName')] đang sống thế nào dưới sự chăm sóc của [receiver.GetHerHis]."
  pet_animal.0108.desc_alive_landed:0 "[receiver.GetSheHe|U] ra đón ta bên ngoài [receiver.Custom('ResidenceBuilding')] của [receiver.GetHerHis], với con mèo lông màu [receiver.Custom('CatFurColor')] trong vòng tay [receiver.GetHerHis]. "[receiver.Custom('CatStorySheHe')|U] vẫn đang rất ổn –"
  pet_animal.0108.desc_alive:0 "[receiver.GetSheHe|U] ra đón ta bên ngoài, với con mèo lông màu [receiver.Custom('CatFurColor')] trong vòng tay [receiver.GetHerHis]. "[receiver.Custom('CatStorySheHe')|U] vẫn đang rất ổn –"
  pet_animal.0108.desc_alive_1:0 "[receiver.Custom('CatStorySheHe')] thích săn chim quanh vùng!"
  pet_animal.0108.desc_alive_2:0 "[receiver.Custom('CatStorySheHe')] thích thử chăm sóc gà!"
  pet_animal.0108.desc_dead_opening:1 "Ta đến thăm [receiver.GetTitledFirstName] — [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('receiver'))] — xem con mèo đang sống ra sao dưới sự chăm sóc của [receiver.GetHerHis]."
  pet_animal.0108.desc_dead_landed:0 "[receiver.GetSheHe|U] gặp Ta ngoài [receiver.GetHerHis] [receiver.Custom('ResidenceBuilding')], không thấy mèo đâu."
  pet_animal.0108.desc_dead:0 "[receiver.GetSheHe|U] gặp Ta ngoài, không thấy mèo đâu."
  pet_animal.0108.desc_dead_ending:0 "\"À, chắc nó đang ra ngoài chơi đâu đó...\"\n\n[receiver.GetSheHe|U] nhìn khắp nơi nhưng không nhìn Ta."
  pet_animal.0108.a:0 "Ta thấy nhẹ nhõm!"
  pet_animal.0108.b:1 "Mèo của Ta đâu rồi?!"

  pet_animal.0109.t:1 "[ROOT.Char.Custom('CatStoryName')]: Kẻ Săn Chuột"
  pet_animal.0109.desc:1 "Khi [ROOT.Char.Custom('CatStoryName')] tiến đến với thêm một con chuột chết nữa, Ta không thể làm gì ngoài việc khen ngợi [ROOT.Char.Custom('CatStoryHerHim')]. [ROOT.Char.Custom('ResidenceBuilding')] chưa bao giờ sạch chuột như bây giờ!"
  pet_animal.0109.a:0 "Tiếp tục phát huy nhé!"

  pet_animal.0110.t:1 "[ROOT.Char.Custom('CatStoryName')]: Kẻ Quậy"
  pet_animal.0110.desc:2 "[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến về phía ta, cơn thịnh nộ hằn trong ánh mắt của [vassal.GetHerHis] và con mèo bị xách gáy trên tay [vassal.GetHerHis]. Khi [vassal.GetSheHe] gí con mèo vào mặt ta, ta nhận ra đó chính là [ROOT.Char.Custom('CatStoryName')] yêu dấu của mình!\n\n"Ta phát hiện ra con tiểu yêu này trong mớ đồ đạc của ta – những thứ không bị cào nát bươm thì cũng ngập ngụa trong bãi đái của nó!""
  pet_animal.0110.a:0 "Ta sẽ đền bù cho ngươi!"
  pet_animal.0110.b:0 "[ROOT.Char.Custom('CatStorySheHe')|U] chỉ là một con mèo..."

  pet_animal.0197.t:0 "[ROOT.Char.Custom('CatStoryName')]: Biến Mất"
  pet_animal.0197.desc_court_5020:0 "Kể từ khi Ta hạn chế việc ra vào của [ROOT.Char.Custom('CatStoryName')], Ta thấy [ROOT.Char.Custom('CatStoryHerHim')] ngày càng ít xuất hiện.\n\nĐã nhiều tuần trôi qua kể từ lần cuối Ta gặp [ROOT.Char.Custom('CatStoryHerHim')] và Ta lo rằng [ROOT.Char.Custom('CatStorySheHe')] đã rời bỏ Ta mãi mãi.\n\nCác quan lại dường như vui vì khu vực không lông, nhưng lòng Ta trống rỗng chưa từng thấy..."
  pet_animal.0197.desc:0 "[ROOT.Char.Custom('CatStoryName')] gần đây hay lang thang xa nhà hơn và thời gian vắng nhà cũng lâu hơn.\n\nĐã nhiều tuần kể từ lần cuối Ta gặp [ROOT.Char.Custom('CatStoryHerHim')] và Ta lo rằng [ROOT.Char.Custom('CatStorySheHe')] đã rời bỏ Ta mãi mãi."
  pet_animal.0197.a:0 "Xin hãy quay lại, [ROOT.Char.Custom('CatStoryName')]!"

#Cat dies :(
  pet_animal.0199.t:0 "[ROOT.Char.Custom('CatStoryName')]: Ngày Buồn"
  pet_animal.0199.desc:0 "[ROOT.Char.Custom('CatStoryName')] không còn trẻ trung như [ROOT.Char.Custom('CatStorySheHe')] ngày xưa nữa, và khi [ROOT.Char.Custom('CatStorySheHe')] bò vào lòng ta, ta có thể cảm nhận được [ROOT.Char.Custom('CatStoryHerHim')] đang run rẩy.\n\nTa nhẹ nhàng vuốt ve bộ lông [ROOT.Char.Custom('CatFurColor')] của [ROOT.Char.Custom('CatStoryHerHis')] và lắng nghe tiếng [ROOT.Char.Custom('CatStoryHerHim')] gầm gừ thật lâu trong đêm, nhưng khi sự tĩnh lặng buông xuống, ta biết rằng [ROOT.Char.Custom('CatStorySheHe')] sẽ không bao giờ tỉnh lại nữa."
  pet_animal.0199.a:0 "Ta sẽ nhớ ngươi, [ROOT.Char.Custom('CatStoryName')]!"
  pet_animal.0199.b:0 "Ta sẽ đảm bảo ngươi luôn ở bên ta!"
  pet_animal.0199.b.tt:0 "Ngài nhận được một miếng da rám nắng nhỏ [court_artifact|E]"

#Extra cat events

  pet_animal.0200.t: "[ROOT.Char.Custom('CatStoryName')]: Bịch!"
  pet_animal.0200.desc: "Ta đang ngồi tại bàn, đọc qua các báo cáo gửi đến từ khắp vương quốc. [ROOT.Char.Custom('CatStoryName')] nhảy lên bên cạnh Ta, đuổi theo ánh nắng và cuộn mình thoả mãn bên cạnh công việc của Ta.\n\nTa đưa tay vuốt bộ lông [ROOT.Char.Custom('CatFurColor')] của [ROOT.Char.Custom('CatStoryHerHis')] và [ROOT.Char.Custom('CatStorySheHe')] duỗi mình dài ra. Một cú duỗi thật hùng vĩ!\n\n#EMP Quá#! hùng vĩ, hóa ra là thế. [ROOT.Char.Custom('CatStoryName')] lộn một vòng và ngã hoàn toàn khỏi bàn, rơi lên chân [ROOT.Char.Custom('CatStoryHerHis')]. Với ánh nhìn kiêu căng — như thể đây là lỗi #EMP của Ta#! — [ROOT.Char.Custom('CatStorySheHe')] đi điệu bộ hờn dỗi."
  pet_animal.0200.a: "Ha! Ngươi thật ngốc!"

  pet_animal.0201.t: "[ROOT.Char.Custom('CatStoryName')]: Lung Lay"
  pet_animal.0201.desc: "Đây là một ngày dài. Ta duỗi chân ra trước mặt khi thư giãn tại bàn viết, xương cốt mệt mỏi được nghỉ ngơi lần đầu trong ngày. Qua phòng, [ROOT.Char.Custom('CatStoryName')] đi dọc theo kệ, khám phá các tầng cao hơn. [ROOT.Char.Custom('CatStorySheHe')|U] dường như thích ở trên cao—\n\n[cat_artifact.GetName] của Ta! Ngồi ở đầu kệ, [ROOT.Char.Custom('CatStoryName')] đang hướng thẳng tới nó, mắt mèo mở to đầy tò mò. Ta kinh hoàng khi thấy một bàn chân giơ ra..."
  pet_animal.0201.a: "Không!"
  pet_animal.0201.a.tt: "Chộp lấy nó!"
  pet_animal.0201.a.success: "Ngài đã bắt thành công"
  pet_animal.0201.a.failure: "[cat_artifact.GetNameNoTooltip] đổ xuống sàn"
  pet_animal.0201.b: "Ôi không, ngươi không thể—"
  pet_animal.0201.b.success: "Ngài đã nắm được [ROOT.Char.Custom('CatStoryName')]"
  pet_animal.0201.b.failure: "[ROOT.Char.Custom('CatStoryName')] không hài lòng với Ngài"
  pet_animal.0201.b.tt: "Bắt [ROOT.Char.Custom('CatStoryHerHim')]!"

  pet_animal.0202.t: "[ROOT.Char.Custom('CatStoryName')]: Chuyện Tình Yêu"
  pet_animal.0202.desc: "Nến leo lét và chăn nệm sột soạt khi [cat_lover.GetFirstName] và ta quấn lấy nhau trên giường. Cả hai cố gắng giữ yên lặng, nhưng đôi khi những âm thanh lại vang vọng một chút! Những tiếng thở dốc, những tiếng nỉ non, tiếng... meo meo?\n\nTa bật dậy và thấy [ROOT.Char.Custom('CatStoryName')] đang ngồi rất vui vẻ trên chiếc gối bên cạnh, gầm gừ vẻ mãn nguyện. Trong khi ta há hốc mồm suy nghĩ xem nên làm gì, [ROOT.Char.Custom('CatStorySheHe')] bắt đầu ồn ào liếm láp làm sạch một chi.\n\n[cat_lover.GetFirstNameNoTooltip|U] nhìn ta đầy kiêu kỳ. Ta uể oải hích nhẹ con mèo đang thỏa mãn kia một cái; [ROOT.Char.Custom('CatStorySheHe')] liền lăn ngửa [ROOT.Char.Custom('CatStoryHerHis')] ra, sẵn sàng để chơi đùa."
  pet_animal.0202.a: "\"Ôi thôi— #EMP đi chỗ khác!#!\""
  pet_animal.0202.a.success: "Ngài đã xua mèo đi thành công"
  pet_animal.0202.a.failure: "[ROOT.Char.Custom('CatStoryName')] ngoan cố không chịu di chuyển"
  pet_animal.0202.b: "Chà, làm phiền [ROOT.Char.Custom('CatStoryHerHim')] cũng hơi bất lịch sự..."

  pet_animal.0203.t: "[ROOT.Char.Custom('CatStoryName')]: Phản Bội!"
  pet_animal.0203.desc: "Có phải ta vừa nghe thấy tiếng #EMP nựng nịu#! không? Và cả tiếng... meo meo nghèn nghẹt nữa?\n\nNgồi trong một hốc tường là [random_courtier.GetFirstName], đang ôm [ROOT.Char.Custom('CatStoryName')] gọn lỏn trong vòng tay của [random_courtier.GetHerHis]. Con mèo nhìn lên [random_courtier.GetHerHim] một cách âu yếm, các chân gập lại như một đứa trẻ sơ sinh, và [random_courtier.GetFirstNameNoTooltip] thì đang đong đưa [ROOT.Char.Custom('CatStoryHerHim')] bằng tất cả tình yêu thương.\n\nTa lên tiếng chào, nhưng dẫu người kia có đáp lại, thì con mèo chỉ khẽ gầm gừ mãn nguyện và rúc mặt [ROOT.Char.Custom('CatStoryHerHis')] vào khuỷu tay họ. Bất giác, ta cảm thấy có chút gì đó ghen tị."
  pet_animal.0203.a: "Này! Trả mèo của ta đây!"
  pet_animal.0203.b: "Chà, có lẽ Ta không phải là người [ROOT.Char.Custom('CatStoryHerHis')] yêu thích..."

  pet_animal.0204.t: "[ROOT.Char.Custom('CatStoryName')]: Bác Sĩ Mèo"
  pet_animal.0204.desc: "Ta run nhẹ và kéo chăn sát quanh mình. Căn bệnh khốn khổ này đã khiến Ta mệt mỏi nhiều ngày, và nó chưa có dấu hiệu giảm.\n\nKhi Ta loay hoay với chăn, một tiếng meo vui vẻ báo hiệu sự xuất hiện của mèo Ta, [ROOT.Char.Custom('CatStoryName')]. [ROOT.Char.Custom('CatStorySheHe')|U] nhìn Ta với vẻ lo lắng mơ hồ, đi một vòng quanh giường bệnh.\n\nCuối cùng, với một #EMP mrrp!#! nhỏ tự mãn, [ROOT.Char.Custom('CatStorySheHe')] bắt đầu nhào chăn, rồi cuộn tròn trong khủy tay Ta."
  pet_animal.0204.a: "Aww. Ngươi đến bên ta sao, [ROOT.Char.Custom('CatStoryName')]?"

  pet_animal.0205.t: "[ROOT.Char.Custom('CatStoryName')]: Sự Gián Đoạn"
  pet_animal.0205.desc: "Ta ngồi xuống, ra hiệu cho hội đồng của mình làm điều tương tự. Những người quyền lực nhất trong vương quốc đều ở đây. Ta mở lời chuẩn bị nói, và—\n\n#EMP "Meo!"#! Ta nhìn quanh tìm kiếm thủ phạm. #EMP "Meo!"#!\n\n[ROOT.Char.Custom('CatStoryName')] nhảy phốc lên chiếc bàn dài, gầm gừ đầy mãn nguyện. [ROOT.Char.Custom('CatStorySheHe')|U] vui vẻ dụi đầu [ROOT.Char.Custom('CatStoryHerHis')] vào tay ta; trong khi đó, [cat_disapprover.GetFirstName] lại bĩu môi tỏ vẻ không hài lòng.\n\n"Có lẽ chúng ta nên dọn dẹp con vật này đi chứ, [ROOT.Char.Custom('FormOfAddressForLiege')]? Chúng ta có những việc rất hệ trọng cần bàn bạc mà.""
  pet_animal.0205.a: "Tôn trọng [ROOT.Char.Custom('CatStoryName')], nếu không mất lời đấy."
  pet_animal.0205.b: "Bạn Bè! Mang con mèo này ra ngoài!"
  pet_animal.0205.c: "Ôi thôi nào, [ROOT.Char.Custom('CatStorySheHe')] không phiền phức. [ROOT.Char.Custom('CatStorySheHe')|U] có thể ở lại."
  pet_animal.0205.c.tt: "Lại đây nào, con mèo bé xíu!"

##############
## DOG
##############
  dog_got_pregnant_tooltip:0 "Cô ấy đang mang thai những chú chó con!"
  pet_animal.1001.t:0 "Con Chó"
  pet_animal.1001.desc:0 "Khi ta xoa đầu con chó, [ROOT.Char.Custom('DogStorySheHe')] vui sướng vẫy đuôi của [ROOT.Char.Custom('DogStoryHerHis')]. Cái tên nào sẽ hợp với [ROOT.Char.Custom('DogStoryHerHim')] đây? Một cái tên lịch sử chăng? Hay thứ gì đó liên quan đến bộ lông màu [ROOT.Char.Custom('DogFurColor')] của [ROOT.Char.Custom('DogStoryHerHis')]? Đó là một quyết định quan trọng, và khi con chó lăn ra để ta vuốt ve bụng [ROOT.Char.Custom('DogStoryHerHis')], ta bỗng thấy mình bị phân tâm mất một lúc.\n\nNhưng khoan đã, ta biết rồi! Ta sẽ đặt tên cho [ROOT.Char.Custom('DogStoryHerHim')] là..."

  pet_animal.1101.t:0 "[ROOT.Char.Custom('DogStoryName')]: Chân và Móng"
  pet_animal.1101.desc:0 "Việc dắt [ROOT.Char.Custom('DogStoryName')] đi dạo hàng ngày đã trở thành thói quen, và Ta không chắc ai trong chúng Ta tận hưởng không khí trong lành và ánh nắng nhiều hơn!\n\n[ROOT.Char.Custom('DogStoryName')] nhảy về phía trước, quay lại nhìn Ta và sủa, như muốn nói #EMP theo kịp đi!#!"
  pet_animal.1101.a:0 "Đi thôi!"

  pet_animal.1102.t:0 "[ROOT.Char.Custom('DogStoryName')]: Chạy Trốn"
  pet_animal.1102.desc:0 "Ta đang cưỡi ngựa, con chó [ROOT.Char.Custom('DogStoryName')] bên cạnh, thì [ROOT.Char.Custom('DogStorySheHe')] bỗng chạy mất vào [ROOT.Char.Custom('TerrainType')].\n\nĐoàn tùy tùng trấn an Ta rằng [ROOT.Char.Custom('DogStorySheHe')] sẽ quay lại, nhưng nếu [ROOT.Char.Custom('DogStorySheHe')] không quay thì sao?!"
  pet_animal.1102.a:0 "Theo Ta! [ROOT.Char.Custom('DogStoryName')], Ta nói theo Ta! Chờ Ta!"
  pet_animal.1102.a.tt:0 "Ngài cố gắng gọi [ROOT.Char.Custom('DogStoryHerHim')] quay lại"
  pet_animal.1102.b:0 "Ta sẽ kiên nhẫn."
  pet_animal.1102.b.tt:0 "[ROOT.Char.Custom('DogStorySheHe')|U] sẽ quay lại...!"

  pet_animal.1103.desc_followed:0 "Ta tìm thấy [ROOT.Char.Custom('DogStoryName')] sau vài phút tìm kiếm, đang vui vẻ vẫy cái đuôi của [ROOT.Char.Custom('DogStoryHerHis')] và vờ như không có chuyện gì xảy ra."
  pet_animal.1103.desc:0 "Cuối cùng [ROOT.Char.Custom('DogStoryName')] trở lại, giả vờ như không có gì xảy ra."
  pet_animal.1103.desc_ending:0 "\n\n[ROOT.Char.Custom('DogStorySheHe')|U] đang ngậm chặt thứ gì đó trong miệng [ROOT.Char.Custom('DogStoryHerHis')], và khi [ROOT.Char.Custom('DogStorySheHe')] nhẹ nhàng thả nó xuống trước mặt ta, ta thấy đó là vài đồng tiền vàng."
  pet_animal.1103.a:0 "Cảm ơn Ngài!"

  pet_animal.1104.desc_followed:0 "Ta tìm rất lâu nhưng không thấy dấu vết của [ROOT.Char.Custom('DogStoryName')]."
  pet_animal.1104.desc:0 "Dù chờ bao lâu [ROOT.Char.Custom('DogStoryName')] cũng không quay lại."
  pet_animal.1104.desc_ending:0 "\n\nKhi chúng Ta quay về, khoảng trống bên cạnh ngựa làm Ta thấy đau lòng."
  pet_animal.1104.a:0 "[ROOT.Char.Custom('DogStoryName')], sao ngươi bỏ Ta đi?"

  pet_animal.1105.desc_ending:0 "\n\nNgay khi Ta chuẩn bị bỏ cuộc, một kỵ sĩ trong đoàn tùy tùng trở lại với tin lo lắng – [dummy_gender.GetSheHe] thề rằng [dummy_gender.GetSheHe] đã thấy [rival.Custom2('MyCharacterIntroduction', ROOT.Char)] lén lút xung quanh!"
  pet_animal.1105.a:1 "Nếu [rival.GetSheHe] có liên quan tới chuyện này..."

  pet_animal.1106.desc_ending:0 "\n\nNgay khi Ta chuẩn bị rời đi, [friend.Custom2('MyCharacterIntroduction', ROOT.Char)] xuất hiện từ hư không, dẫn theo [ROOT.Char.Custom('DogStoryName')].\n\n\"Người  Bạn củaTa, Ta nghĩ ngươi đã mất ai đó!\""
  pet_animal.1106.a:0 "Thật may mắn! Cảm ơn nhiều!"

  pet_animal.1107.t:0 "[ROOT.Char.Custom('DogStoryName')]: Thần Duyên Chiếm Hữu"
  pet_animal.1107.desc:0 "Ta bắt gặp [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))] [vassal.GetTitledFirstName] đang quỳ cạnh con chó [ROOT.Char.Custom('DogStoryName')], cào bụng [ROOT.Char.Custom('DogStoryHerHis')] hăng say.\n\n\"Con chó của ngài thật duyên dáng, [ROOT.Char.Custom('FormOfAddressForLiege')]!\""
  pet_animal.1107.a_female:0 "Cô ấy là một cô bé ngoan!"
  pet_animal.1107.a_male:0 "Cậu ấy là một cậu bé ngoan!"

  pet_animal.1108.t:0 "[ROOT.Char.Custom('DogStoryName')]: Người Bảo Vệ Lông Xù"
  pet_animal.1108.desc:0 "Ta đang ở phòng riêng thì con chó [ROOT.Char.Custom('DogStoryName')] bỗng sủa ầm cửa. Ta nghe một tiếng thét bất ngờ và khi mở cửa, [agent.GetFirstName] – người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))] – đứng sững lại giữa bước đi."
  pet_animal.1108.a:0 "Ngươi đang làm gì ở đây? Nói cho ta biết!"

  pet_animal.1109.t:0 "[ROOT.Char.Custom('DogStoryName')]: Cuộc Gặp"
  pet_animal.1109.desc:0 "Ta đang dắt [ROOT.Char.Custom('DogStoryName')] đi dạo thì bỗng thấy [other_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] đến cùng một con chó [other_owner.Custom('DogFurColor')] đẹp đẽ.\n\nTrước khi ai kịp phản ứng, [ROOT.Char.Custom('DogStoryName')] và con chó kia lao đi."
  pet_animal.1109.a:0 "Ta chắc chúng sẽ ổn thôi."
  pet_animal.1109.a.tt:0 "Ta #EMP hy vọng#! chúng sẽ ổn"

  pet_animal.1110.desc:0 "[other_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] và Ta tìm thấy hai con chó sau một lúc, đang giao phối dữ dội.\n\n"
  pet_animal.1110.desc_your_dog:0 "\"Thôi nào, [ROOT.Char.GetTitledFirstNameNoTooltip]... có lẽ chúng ta sắp trở thành họ hàng rồi!\""
  pet_animal.1110.desc_their_dog:0 "\"[ROOT.Char.Custom('DogStoryName')], sao ngươi để con chó kia...!\"\n\n[other_owner.GetSheHe|U] dừng lời, nhưng Ta thấy sự tức giận trong mắt [other_owner.GetHerHis]."
  pet_animal.1110.a:0 "Chà... đó cũng là điều tự nhiên thôi."

  pet_animal.1111.desc:0 "[other_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] và Ta tìm thấy hai con chó sau một lúc, đang chơi đùa.\n\n\"Thật vui khi thấy [other_owner.Custom('DogStoryName')] chơi vui thế!\""
  pet_animal.1111.a:0 "Hoàn toàn đồng ý!"

  pet_animal.1112.desc:0 "[other_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] và Ta tìm thấy hai con chó sau một lúc, đang đánh nhau dữ dội.\n\n\"Hãy gọi con chó của ngươi ra!\"\n\n"
  pet_animal.1112.desc_dead:0 "Khi Ta cuối cùng bắt [ROOT.Char.Custom('DogStoryName')] dừng lại, con chó của [other_owner.GetFirstNamePossessiveNoTooltip] đã lạnh cứng."
  pet_animal.1112.desc_alive:0 "Khi Ta cuối cùng bắt [ROOT.Char.Custom('DogStoryName')] dừng lại, [other_owner.GetTitledFirstNameNoTooltip] rời đi mà không ngoảnh lại."
  pet_animal.1112.a:0 "Ngươi có ổn không, [ROOT.Char.Custom('DogStoryName')]?"

  pet_animal.1113.t:0 "[ROOT.Char.Custom('DogStoryName')]: Cuộc Họp Hội Đồng"
  pet_animal.1113.desc:1 "Khi Ta và các cố vấn tập hợp cho cuộc họp, con chó [ROOT.Char.Custom('DogStoryName')] đến gần Ta với ánh mắt van xin và đuôi rũ xuống.\n\n[ROOT.Char.Custom('DogStorySheHe')|U] không thích bị bỏ lại một mình, nhưng đây là một cuộc họp quan trọng..."
  pet_animal.1113.a:1 "[ROOT.Char.Custom('DogStorySheHe')|U] sẽ ở cùng Ta."
  pet_animal.1113.a_success:1 "[ROOT.Char.Custom('DogStoryName')] ngoan ngoãn"
  pet_animal.1113.a_success.tt:0 "Không có gì xấu xảy ra"
  every_councillor:0 "Mọi cố vấn"
  pet_animal.1113.a_failure:1 "[ROOT.Char.Custom('DogStoryName')] làm đủ thứ"
  pet_animal.1113.a_failure.tt:0 "Điều gì đó... xấu xảy ra"
  pet_animal.1113.b:1 "Chó không nên xuất hiện trong cuộc họp hội đồng."
  pet_animal.1113.b.tt:0 "Ngài đóng cửa trước mắt van xin của chó"
  pet_animal.1113.b_success:1 "[ROOT.Char.Custom('DogStoryName')] chờ đợi kiên nhẫn"
  pet_animal.1113.b_failure:1 "[ROOT.Char.Custom('DogStoryName')] đi phiêu lưu"
 
  pet_animal.1114.desc:2 "\"Xin lỗi, [ROOT.Char.GetTitledFirstNameNoTooltip],\" nói [councillor.GetCouncilTitle] [councillor.GetTitledFirstName]. \"Ta phải phản đối những gì ngài vừa–\"\n\n#EMP *Grrr*#!\n\n[ROOT.Char.Custom('DogStoryName')] gầm gừ và [councillor.GetTitledFirstNameNoTooltip] giật mình, nhìn từ con chó sang Ta và ngược lại.\n\n\"Nghĩ lại thì, Ta thấy đó là một ý tưởng tuyệt vời!\""
  pet_animal.1014.a_girl:0 "Cô bé ngoan quá, [ROOT.Char.Custom('DogStoryName')]!"
  pet_animal.1014.a_boy:0 "Cậu bé ngoan quá, [ROOT.Char.Custom('DogStoryName')]!"

  pet_animal.1115.desc:2 ""Bây giờ chuyển sang vấn đề tiếp theo," [councillor.GetCouncilTitle] của ta, [councillor.GetTitledFirstName] lầm bầm. "Có một điều cực kỳ quan trọng là–"\n\n#EMP *Phhffrrt*#!\n\nSự im lặng bao trùm sau đó chỉ bị phá vỡ bởi tiếng [ROOT.Char.Custom('DogStoryName')] sủa vui vẻ, sau khi vừa giải quyết xong 'nỗi buồn' của [ROOT.Char.Custom('DogStoryHerHis')]."
  pet_animal.1115.a:0 "Chó hư!"

  pet_animal.1116.desc_opening:0 "Ta bước ra khỏi phòng họp chỉ để phát hiện ra rằng [ROOT.Char.Custom('DogStoryName')] đã biến mất. Ta tìm kiếm [ROOT.Char.Custom('DogStoryHerHim')] khắp mọi nơi, từ trên xuống dưới; lỡ như [ROOT.Char.Custom('DogStorySheHe')] bị lạc và đang hoảng sợ thì sao?\n\n"
  pet_animal.1116.desc:1 "Đột nhiên ta bắt gặp [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] với một con chó nằm gọn trong lòng [courtier.GetHerHis], đang được gãi bụng một cách hăng say dưới lớp lông màu [ROOT.Char.Custom('DogFurColor')]. Một con chó trông giống [ROOT.Char.Custom('DogStoryName')] một cách đáng ngờ.\n\n"Ngài có một người bạn đồng hành thật quý giá đấy, [ROOT.Char.GetTitledFirstNameNoTooltip]!""
  pet_animal.1116.a:0 "Ha, đúng rồi. [ROOT.Char.Custom('DogStorySheHe')|U] tuyệt lắm..."

  pet_animal.1117.desc:1 "Bỗng Ta bắt gặp [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] đang mắng một con chó; một con chó trông rất giống [ROOT.Char.Custom('DogStoryName')] với giấy và vải rách rưới quanh [ROOT.Char.Custom('DogStoryHerHim')].\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip]! Con... con #EMP quái vật#! này đã phá tan phòng của Ta! Mọi thứ tan tành hết!\""
  pet_animal.1117.a:0 "Ê... Ối. Chó hư!"

  pet_animal.1118.t:1 "[ROOT.Char.Custom('DogStoryName')]: Kẻ Gây Rối"
  pet_animal.1118.desc:2 "[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến về phía ta, cơn thịnh nộ hằn trong ánh mắt của [vassal.GetHerHis] và con chó bị xách lết đi trên tay [vassal.GetHerHis]. Khi [vassal.GetSheHe] đến gần, ta nhận ra con vật mà [vassal.GetSheHe] đang xách chính là [ROOT.Char.Custom('DogStoryName')] yêu dấu của mình!\n\n"Ta phát hiện ra con quái thú này trong mớ đồ đạc của ta – những thứ không bị cắn nát bươm thì cũng ngập ngụa trong phân!""
  pet_animal.1118.a:0 "Ta sẽ đền bù cho ngài!"
  pet_animal.1118.b:0 "[ROOT.Char.Custom('DogStorySheHe')|U] chỉ là một con chó thôi..."

  pet_animal.1190.t:0 "[ROOT.Char.Custom('DogStoryName')]: Chó Con"
  pet_animal.1190.desc:1 "[ROOT.Char.Custom('DogStoryName')] đã sinh ra một chú chó con đáng yêu! Dù Ta rất yêu thích nó – cùng chiếc đuôi nhỏ vẫy vẫy – Ta không thể chăm sóc nó tốt được..."
  pet_animal.1190.a:0 "Ta sẽ đưa nó cho [receiver_1.GetFirstNameNoTooltip]..."
  pet_animal.1190.b:0 "[receiver_2.GetFirstNameNoTooltip] cần một người Ngài..."
  pet_animal.1190.c:0 "[receiver_3.GetFirstNameNoTooltip] sẽ chăm sóc nó..."
  pet_animal.1190.d:0 "Ta sẽ bán nó ở chợ."

  pet_animal.1191.t:0 "Chú Chó Con"
  pet_animal.1191.desc:1 "[giver.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến về phía ta với một chú chó con trong vòng tay [giver.GetHerHis].\n\n"Ta không thể chăm sóc cho nó, nhưng có lẽ ngài có thể cho nó một mái ấm?""
  pet_animal.1191.a:0 "Chắc chắn! Đưa cho Ta đi!"
  pet_animal.1191.b:0 "Ta có thể... #EMP chăm sóc#! nó."

  pet_animal.1192.t:0 "[receiver.Custom('DogStoryName')]: Cuộc Sống Không Có Ngươi"
  pet_animal.1192.desc_opening:0 "Ta đến thăm [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('receiver'))] [receiver.GetTitledFirstName] để xem [receiver.Custom('DogStoryName')] bé nhỏ sống ra sao dưới sự chăm sóc của [receiver.GetHerHis].\n\n"
  pet_animal.1192.desc_alive_landed:0 "[receiver.GetSheHe|U] gặp Ta ngoài [receiver.GetHerHis] [receiver.Custom('ResidenceBuilding')], chú chó [receiver.Custom('DogFurColor')] bên cạnh [receiver.GetHerHim]. \"[receiver.Custom('DogStorySheHe')|U] vẫn khỏe –\""
  pet_animal.1192.desc_alive:0 "[receiver.GetSheHe|U] gặp Ta ngoài sân, chú chó [receiver.Custom('DogFurColor')] bên cạnh [receiver.GetHerHim]. \"[receiver.Custom('DogStorySheHe')|U] vẫn khỏe –\""
  pet_animal.1192.desc_alive_1:0 "[receiver.Custom('DogStorySheHe')] thích đuổi gà!"
  pet_animal.1192.desc_alive_2:0 "[receiver.Custom('DogStorySheHe')] thích đi theo ngựa!"
  pet_animal.1192.desc:0 "[receiver.GetSheHe|U] gặp Ta ngoài [receiver.GetHerHis] [receiver.Custom('ResidenceBuilding')], không thấy chó đâu. \"Ồ, [receiver.Custom('DogStorySheHe')] hẳn đang chơi ngoài nào đó...\"\n\n[receiver.GetSheHe|U] nhìn khắp nơi nhưng không nhìn Ta."
  pet_animal.1192.a:0 "Ta nhẹ nhõm!"
  pet_animal.1192.b:0 "[receiver.Custom('DogStoryName')] đâu rồi?!"

#Dog dies :(
  pet_animal.1199.t:0 "[ROOT.Char.Custom('DogStoryName')]: Ngày Đau Buồn"
  pet_animal.1199.desc:1 "[ROOT.Char.Custom('DogStoryName')] đã đồng hành bên ta nhiều năm trời, và thời gian thì chẳng chừa một ai, kể cả là những chú chó. Khi ta quỳ xuống bên cạnh [ROOT.Char.Custom('DogStoryHerHim')], [ROOT.Char.Custom('DogStorySheHe')] bắt đầu vẫy đuôi chầm chậm, nhưng [ROOT.Char.Custom('DogStorySheHe')] chẳng thể cất nổi cái đầu của [ROOT.Char.Custom('DogStoryHerHis')] lên nữa.\n\nTa ngồi bên [ROOT.Char.Custom('DogStoryHerHim')] thật lâu trong đêm, vuốt ve cái lưng màu [ROOT.Char.Custom('DogFurColor')] của [ROOT.Char.Custom('DogStoryHerHis')] cho đến khi cái đuôi ấy ngừng vẫy."
  pet_animal.1199.a:0 "Ta sẽ nhớ ngươi, [ROOT.Char.Custom('DogStoryName')]!"

##############
## CAT AND DOG
##############
  pet_animal.2001.t:0 "Ôm Đêm"
  pet_animal.2001.desc:0 "Ta về phòng khi đêm xuống và thấy [ROOT.Char.Custom('CatStoryName')] và [ROOT.Char.Custom('DogStoryName')] cuộn mình ôm nhau trên sàn! Bộ lông [ROOT.Char.Custom('DogStoryNamePossessive')] [ROOT.Char.Custom('DogFurColor')] óng ánh – rõ ràng [ROOT.Char.Custom('CatStoryName')] đã dọn dẹp cho [ROOT.Char.Custom('DogStoryHerHim')]."
  pet_animal.2001.a:0 "Chúng thật đáng yêu khi ở cùng nhau!"

  pet_animal.2002.t:0 "Như Mèo với Chó"
  pet_animal.2002.desc:0 "Ta bước ra ngoài khi [ROOT.Char.Custom('CatStoryName')] và [ROOT.Char.Custom('DogStoryName')] xuất hiện từ hai hướng đối diện.\n\nTa không kịp phản ứng – chúng lao vào nhau trong vài giây. Những búi lông [ROOT.Char.Custom('DogFurColor')] bay khắp nơi, và Ta nghe cả hai gầm gừ. Lại nữa. Cái việc đánh nhau liên tục này phải chấm dứt!"
  pet_animal.2002.a:0 "Ngừng ngay lập tức, [ROOT.Char.Custom('DogStoryName')]!"
  pet_animal.2002.a.tt:0 "Ta cố kiểm soát con chó"
  pet_animal.2002.b:0 "[ROOT.Char.Custom('CatStoryName')], đủ rồi!"
  pet_animal.2002.b.tt:0 "Ta cố kiểm soát con mèo"
  pet_animal.2002.c:0 "Ta không muốn bị vướng vào..."
  pet_animal.2002.c.tt:0 "Chắc chúng sẽ tự giải quyết"

  pet_animal.2003.desc:0 "Ta tìm khắp [ROOT.Char.Custom('ResidenceBuilding')], [ROOT.Char.Custom('CatStoryName')] đi theo sau, nhưng không thấy con chó [ROOT.Char.Custom('DogStoryName')] đâu cả!\n\nTa dừng lại, cúi xuống vuốt ve [ROOT.Char.Custom('CatStoryName')], thì thấy một búi lông [ROOT.Char.Custom('DogFurColor')] dính máu trong răng [ROOT.Char.Custom('CatStoryHerHis')]. Khi Ta nhổ ra, [ROOT.Char.Custom('CatStorySheHe')] gầm lên và nhảy về một góc sân – một góc có thứ gì đó màu [ROOT.Char.Custom('DogFurColor')] nằm trên đất."
  pet_animal.2003.a:0 "Ôi, không! [ROOT.Char.Custom('CatStoryName')], ngươi không..."

  pet_animal.2004.desc_opening:0 "Ngay khi ta vừa rời khỏi [ROOT.Char.Custom('ResidenceBuilding')], [ROOT.Char.Custom('DogStoryName')] lũn cũn chạy đến bên ta, vui vẻ vẫy cái đuôi của [ROOT.Char.Custom('DogStoryHerHis')].\n\n"
  pet_animal.2004.desc_female:0 "\"Chào cô bé ngoan! Ai ngoan đây? Đúng rồi, ai–\""
  pet_animal.2004.desc_male:0 "\"Chào cậu bé ngoan! Ai ngoan đây? Đúng rồi, ai–\""
  pet_animal.2004.desc:0 "\n\nKhi [ROOT.Char.Custom('DogStorySheHe')] đến gần, Ta thấy miệng [ROOT.Char.Custom('DogStoryHerHis')] dính đầy máu và ruột. Ta nặng trĩu lòng bước về nơi [ROOT.Char.Custom('DogStorySheHe')] vừa tới, và không lâu sau Ta gặp xác con mèo [ROOT.Char.Custom('CatStoryName')] bất động."
  pet_animal.2004.a:0 "Ôi không... [ROOT.Char.Custom('DogStoryName')], sao ngươi có thể?"

  pet_animal.2005.desc_opening:0 "Ta không thể tìm thấy cả [ROOT.Char.Custom('CatStoryName')] lẫn [ROOT.Char.Custom('DogStoryName')]. Ta lùng sục [ROOT.Char.Custom('ResidenceBuilding')] và khu vực xung quanh, nhưng chẳng ai thấy họ.\n\n"
  pet_animal.2005.desc:0 "Khi Ta quay lại, Ta phát hiện một vũng máu nhỏ trên mặt đất, rồi thêm một vũng nữa, rồi nữa... Chúng dẫn Ta tới một đống lông máu – hai xác nằm quấn quýt trên đất, không nhầm được là ai."
  pet_animal.2005.a:0 "Tại sao các ngươi không thể hòa hợp?!"

  pet_animal.2006.desc:0 "Khi Ta quay lại, Ta thấy chúng – nằm cuộn mình trên mặt đất. Ôi không! Cuối cùng họ... Nhưng khi Ta tiến tới, [ROOT.Char.Custom('CatStoryNamePossessive')] đầu ngẩng lên, [ROOT.Char.Custom('CatStorySheHe')] nhìn Ta bằng đôi mắt mệt mỏi rồi lại tiếp tục ngủ."
  pet_animal.2006.a:0 "Ôi, họ... Họ thực sự hòa giải rồi!"

##############
## OTHER PEOPLE
##############
  pet_animal.5001.t:0 "Con Mèo Của Kẻ Thù"
  pet_animal.5001.desc:0 "Khi Ta đi ngang [rival_home.GetName] để làm việc vặt, Ta bị một con mèo [rival.Custom('CatFurColor')] tiếp cận. Ta đã từng thấy con mèo này ở đâu rồi...? À! Đó là con mèo [rival.Custom('CatStoryName')] của [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('rival'))] [rival.GetTitledFirstNamePossessive]!\n\nKhi nó kêu meo meo và rừ rừ, Ta cảm thấy nụ cười hiểm độc lan tỏa trên khuôn mặt."
  pet_animal.5001.a:0 "#EMP Pss pss#! – Ta không làm hại ngươi đâu..."
  pet_animal.5001.a.tt:0 "Chỉ là một vết dao nhỏ"
  pet_animal.5001.b:0 "Ta sẽ vuốt ve con mèo của kẻ ngốc đó thật kỹ!"

  pet_animal.5002.t:0 "Con Chó Của Kẻ Thù"
  pet_animal.5002.desc:0 "Khi Ta đi ngang [rival_home.GetName] để làm việc vặt, Ta bị một con chó [rival.Custom('DogFurColor')] tiếp cận. Ta đã từng thấy con chó này ở đâu rồi...? À! Đó là con chó [rival.Custom('DogStoryName')] của [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('rival'))] [rival.GetTitledFirstNamePossessive]!\n\nTa cảm thấy nụ cười hiểm độc lan tỏa khi nó sủa vui vẻ với đuôi vẫy."
  pet_animal.5002.a:0 "Lại đây, ta không làm hại ngươi..."
  pet_animal.5002.b:0 "Ta sẽ vuốt ve con chó của kẻ ngốc đó thật kỹ!"


##############
## DECISION EVENTS
##############
  pet_animal.6001.t:0 "Vuốt ve [ROOT.Char.Custom('DogStoryName')|U]"
  pet_animal.6001.desc:0 "Khi Ta vuốt ve bộ lông [ROOT.Char.Custom('DogStoryNamePossessive')] màu [ROOT.Char.Custom('DogFurColor')], Ta cảm thấy mọi lo lắng tan biến. Được ai đó trung thành tuyệt đối, và biết rằng họ luôn ở bên cạnh Ta... Giá mà những người xung quanh Ta cũng như ngươi, [ROOT.Char.Custom('DogStoryName')]!\n\nChúng Ta ngồi bên nhau nhiều phút, đuôi [ROOT.Char.Custom('DogStoryHerHis')] vẫy và vai Ta thả lỏng, cho đến khi Ta sẵn sàng đối mặt với thế giới một lần nữa."
  pet_animal.6001.a:0 "Cảm ơn ngươi,  Bạn củata!"

  pet_animal.6002.desc:0 "Ta tìm thấy [ROOT.Char.Custom('DogStoryName')] bên ngoài, đang nô đùa cùng vài đứa trẻ. Khi [ROOT.Char.Custom('DogStorySheHe')] nhìn thấy ta, [ROOT.Char.Custom('DogStorySheHe')] liền cuống cuồng chạy đến với cái đuôi vẫy tít, và khi ta cúi xuống, [ROOT.Char.Custom('DogStorySheHe')] ngay lập tức lăn ngửa [ROOT.Char.Custom('DogStoryHerHis')] ra.\n\nTa dành nhiều phút để vuốt ve cái bụng màu [ROOT.Char.Custom('DogFurColor')] của [ROOT.Char.Custom('DogStoryHerHis')], và đã lâu lắm rồi ta mới cảm thấy thư giãn đến vậy."

  pet_animal.6003.desc:0 "Khi bước ra ngoài, ta thấy [ROOT.Char.Custom('DogStoryName')] lao về phía mình, miệng ngậm một khúc cây. Ta cho rằng mình có thể dành vài phút để chơi ném gậy với [ROOT.Char.Custom('DogStoryHerHim')]. Phải, điều đó sẽ rất thư giãn.\n\n#EMP Khoan đã nào, cái gì đây?#!\n\nKhi cúi xuống cầm lấy khúc cây, ta nhận ra đó hoàn toàn không phải là một khúc cây, mà là một #EMP yêu sách đối với [target_county.GetName]!#! Làm thế quái nào mi lại có được thứ này, [ROOT.Char.Custom('DogStoryName')]!?"
  pet_animal.6003.a:0 "Tốt lắm [ROOT.Char.Custom('DogStoryGirlBoy')], [ROOT.Char.Custom('DogStoryName')]. #EMP Tốt lắm [ROOT.Char.Custom('DogStoryGirlBoy')]!#!"
  pet_animal.6003.b:0 "[neighboring_ruler.GetTitledFirstNameNoTooltip] sẽ vui mừng khi lấy lại được cái này!"

  pet_animal.6004.desc:0 "Ta tìm thấy [ROOT.Char.Custom('DogStoryName')] bên ngoài, đang ngủ trưa dưới ánh nắng. Ta ngồi xổm xuống cạnh [ROOT.Char.Custom('DogStoryHerHim')] và luồn tay qua bộ lông màu [ROOT.Char.Custom('DogFurColor')] của [ROOT.Char.Custom('DogStoryHerHis')], và–\n\nLời cảnh báo duy nhất dành cho ta là một tiếng gầm gừ trầm đục và một hàm răng nhe nanh trước khi ta cảm thấy thứ gì đó #EMP xé toạc#! cánh tay mình. Ta hoảng hốt lùi lại trước khi [ROOT.Char.Custom('DogStorySheHe')] kịp lao vào ta một lần nữa, nhưng nỗi đau thì...!"
  pet_animal.6004.a:0 "Chắc... Chắc là nhầm lẫn thôi!"
  pet_animal.6004.b:0 "Ngươi #EMP quái vật#!!"

  pet_animal.6051.t:0 "Vuốt ve [ROOT.Char.Custom('CatStoryName')|U]"
  pet_animal.6051.desc:0 "Ta thấy [ROOT.Char.Custom('CatStoryName')] đang ngủ trên giường, và khi Ta ngồi xuống bên cạnh [ROOT.Char.Custom('CatStoryHerHim')], Ta được chào bằng một tiếng kêu nhỏ, bối rối.\n\nTuy nhiên, khi Ta bắt đầu lướt tay qua bộ lông màu [ROOT.Char.Custom('CatFurColor')] của [ROOT.Char.Custom('CatStoryHerHis')], [ROOT.Char.Custom('CatStorySheHe')] nhanh chóng kêu rừ rừ sung sướng, và âm thanh đó làm Ta thư giãn toàn bộ."

  pet_animal.6052.desc:0 "Ta tìm thấy [ROOT.Char.Custom('CatStoryName')] bên ngoài, đang ưỡn ẹo đi dạo quanh sân. Ngay khi [ROOT.Char.Custom('CatStorySheHe')] nhìn thấy ta, [ROOT.Char.Custom('CatStorySheHe')] liền kêu meo meo và khoan thai bước tới, cọ quậy vào chân ta.\n\nTa dành nhiều phút ngồi cạnh [ROOT.Char.Custom('CatStoryHerHis')], vuốt ve [ROOT.Char.Custom('CatStoryHerHim')] và gãi cằm cho [ROOT.Char.Custom('CatStoryHerHim')], và khi đứng lên lại, ta cảm thấy nhẹ nhõm hơn hẳn so với một khoảng thời gian dài."

##############
## EAGLE
##############
  pet_animal.3001.t: "Đại Bàng"
  pet_animal.3001.desc: "Ta đặt chú đại bàng non mới lên găng tay và nhẹ nhàng vuốt lông [ROOT.Char.Custom('EagleStoryHerHis')]. Một sinh vật uy nghi và dữ tợn thật sự, [ROOT.Char.Custom('EagleStorySheHe')] không phải là loài chim bình thường.\n\nMơ mộng về những cuộc săn sắp tới, Ta phải nghĩ xem sẽ đặt tên [ROOT.Char.Custom('EagleStoryHerHim')] là gì, trước khi chúng Ta đi săn con cáo hay thỏ đầu tiên của [ROOT.Char.Custom('EagleStoryHerHis')]."

  pet_animal.3010.t: "[ROOT.Char.Custom('EagleStoryNamePossessive')|U] Mất Tích"
  pet_animal.3010.desc: "[eagle_informer.GetFirstName] tiến lại gần ta, vẻ mặt đầy lo lắng. "Là về [ROOT.Char.Custom('EagleStoryName')], [ROOT.Char.Custom('FormOfAddressForLiege')]. Ta không thể tìm thấy [ROOT.Char.Custom('EagleStoryHerHim')] ở đâu cả!"\n\n[eagle_informer.GetSheHe|U] nhìn quanh, cứ như thể [eagle_informer.GetSheHe] đang mong [ROOT.Char.Custom('EagleStoryName')] xà xuống từ bầu trời bất cứ lúc nào. [eagle_informer.GetFirstNameNoTooltip] cho ta thấy chỗ đậu trống không của [ROOT.Char.Custom('EagleStoryHerHis')], và cả hai chúng ta đều tự hỏi [ROOT.Char.Custom('EagleStorySheHe')] có thể đã bay đi đâu."
  pet_animal.3010.desc_thief: "\n\nKiểm tra hiện trường, ta nhận thấy vài chiếc lông vũ rụng trên mặt đất, và một vài chiếc nữa mắc trên cành cây gần đó, liệu [ROOT.Char.Custom('EagleStoryName')] đã tự ý rời đi của [ROOT.Char.Custom('EagleStoryHerHis')] sao?"
  pet_animal.3010.a: "Ta sẽ làm mọi cách để tìm [ROOT.Char.Custom('EagleStoryName')]!"
  pet_animal.3010.a_tt: "Sẽ có nhiều người tìm kiếm đại bàng hơn, và khả năng tìm thấy sẽ cao hơn"
  pet_animal.3010.b: "Phải có ai đó đã lấy [ROOT.Char.Custom('EagleStoryHerHim')]..."
  pet_animal.3010.b_tt: "Ngài tập hợp nghi phạm và bắt đầu điều tra vụ mất tích đại bàng"
  pet_animal.3010.c: "[ROOT.Char.Custom('EagleStorySheHe')|U] cuối cùng cũng sẽ xuất hiện."
  pet_animal.3010.c_tt: "Ngài để việc quay lại của đại bàng tùy cơ may mắn"
  pet_animal.3010.d_mean: "Dù sao thì Ta cũng chẳng mấy quan tâm đến [ROOT.Char.Custom('EagleStoryName')]."
  pet_animal.3010.d_old: "[ROOT.Char.Custom('EagleStorySheHe')|U] cũng đã lớn tuổi rồi."
  pet_animal.3010.d: "Có lẽ điều này là tốt nhất."
  pet_animal.3010.d_tt: "Ngài bỏ cuộc tìm kiếm đại bàng"

  pet_animal.3011.t: "[ROOT.Char.Custom('EagleStoryName')]: Trở Về"
  pet_animal.3011.desc: "Đã lâu kể từ khi đại bàng thân yêu [ROOT.Char.Custom('EagleStoryName')] biến mất, và Ta gần như đã mất hy vọng săn cùng [ROOT.Char.Custom('EagleStoryHerHim')] một lần nữa."
  pet_animal.3011.desc_freedom: "Ta bắt đầu hồi tưởng về khoảng thời gian chúng ta bên nhau, và tìm đường đến chỗ đậu quen thuộc của [ROOT.Char.Custom('EagleStoryHerHis')]. Thật vui mừng, [ROOT.Char.Custom('EagleStoryName')] đang ở đó, nhìn ta bằng ánh mắt sắc lẹm của [ROOT.Char.Custom('EagleStoryHerHis')]. [ROOT.Char.Custom('EagleStorySheHe')|U] đã trở về!"
  pet_animal.3011.desc_found: "Tình cờ, một sứ giả đến báo tin có người nhìn thấy một con chim giống [ROOT.Char.Custom('EagleStoryHerHis')]. Ta vội tới nơi, và thấy [ROOT.Char.Custom('EagleStorySheHe')] đang đậu trên cành, nhìn Ta như chẳng có chuyện gì xảy ra."
  pet_animal.3011.desc_stolen: "Ta thấy [ROOT.Char.Custom('EagleStoryHerHim')] trong tay [eagle_thief.GetName], kẻ đang cố bán [ROOT.Char.Custom('EagleStoryHerHim')] cho người trả giá cao nhất. Ta nhanh chóng can thiệp, và [ROOT.Char.Custom('EagleStoryName')] trở lại trong tay Ta."
  pet_animal.3011.desc_change: "\n\nDù vui mừng khi thấy [ROOT.Char.Custom('EagleStoryName')] trở lại, Ta không thể không nhận ra rằng [ROOT.Char.Custom('EagleStorySheHe')] đã thay đổi."
  pet_animal.3011.desc_brave: "[ROOT.Char.Custom('EagleStoryName')] dường như can đảm hơn, như thể [ROOT.Char.Custom('EagleStorySheHe')] đã nhìn thế giới và không còn sợ hãi."
  pet_animal.3011.desc_curious: "[ROOT.Char.Custom('EagleStorySheHe')|U] đi quanh trại, quan sát mọi thứ với đôi mắt háo hức."
  pet_animal.3011.desc_loyal: "[ROOT.Char.Custom('EagleStorySheHe')|U] bám lấy Ta, biến găng tay thành nơi đậu riêng của [ROOT.Char.Custom('EagleStoryHerHis')]."
  pet_animal.3011.desc_calm: "[ROOT.Char.Custom('EagleStorySheHe')|U] trước kia hay bồn chồn và bứt rứt, nhưng bây giờ [ROOT.Char.Custom('EagleStorySheHe')] đậu rất bình thản, ngay cả khi không bị trùm mũ."
  pet_animal.3011.desc_wise: "[ROOT.Char.Custom('EagleStorySheHe')|U] nhìn ta bằng một ánh nhìn thấu tỏ, như thể [ROOT.Char.Custom('EagleStorySheHe')] đã chứng kiến những điều mà ta không bao giờ có thể tưởng tượng được."
  pet_animal.3011.desc_cunning: "[ROOT.Char.Custom('EagleStorySheHe')|U] dường như đã học được vài mánh khóe, và [ROOT.Char.Custom('EagleStorySheHe')] không ngần ngại sử dụng chúng."
  pet_animal.3011.desc_observant: "[ROOT.Char.Custom('EagleStorySheHe')|U] bay lượn trên cao, quan sát mọi thứ với đôi mắt sắc bén."
  pet_animal.3011.desc_protective: "[ROOT.Char.Custom('EagleStorySheHe')|U] mổ bất cứ ai lại gần, trước kia [ROOT.Char.Custom('EagleStorySheHe')] chẳng bận tâm gì."
  pet_animal.3011.desc_aggressive: "[ROOT.Char.Custom('EagleStorySheHe')|U] suýt chút nữa đâm thủng găng tay của ta bằng bộ móng vuốt của [ROOT.Char.Custom('EagleStoryHerHis')], và ta có thể thấy rằng [ROOT.Char.Custom('EagleStorySheHe')] không phải là kẻ dễ bị chọc giận."
  pet_animal.3011.a: "Chào mừng trở lại, [ROOT.Char.Custom('EagleStoryName')]."
  pet_animal.3011.b: "[eagle_thief.GetName] sẽ trả giá cho việc này!"

  pet_animal.3012.desc: "Sau nhiều tháng tìm kiếm, Ta đi tới kết luận rằng sẽ không bao giờ thấy lại đại bàng thân yêu [ROOT.Char.Custom('EagleStoryName')]. [eagle_informer.GetName] cố trấn an Ta, \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], Ta chắc rằng [ROOT.Char.Custom('EagleStorySheHe')] vẫn còn đâu đó, và sẽ trở lại.\" nhưng Ta biết rõ hơn.\n\n[ROOT.Char.Custom('EagleStorySheHe')|U] đã đi, và Ta phải chấp nhận điều đó."
  pet_animal.3012.a: "Tạm biệt, [ROOT.Char.Custom('EagleStoryName')]."

  pet_animal.3013.t: "Tìm Kiếm [ROOT.Char.Custom('EagleStoryName')]"
  pet_animal.3013.desc: "Với việc hiểu rõ [ROOT.Char.Custom('EagleStoryName')], rất ít khả năng [ROOT.Char.Custom('EagleStorySheHe')] tự ý rời đi một mình. Ta cẩn thận kiểm tra lại nơi cuối cùng nhìn thấy [ROOT.Char.Custom('EagleStoryHerHis')], và dọ hỏi xung quanh xem có ai nhìn thấy [ROOT.Char.Custom('EagleStoryHerHim')] không.\n\nMột vài người bị ta tra hỏi tỏ ra khá lo lắng, và ta tự hỏi liệu họ có biết nhiều hơn những gì họ đã tiết lộ. Suy nghĩ thêm một chút, "
  pet_animal.3013.desc_thief_1: "Ta đặt [accused_thief_1.GetName] vào diện nghi phạm, vì bản tính [accused_thief_1.Custom2('InsultAdjective', ROOT.Char)] của [accused_thief_1.GetHerHis]."
  pet_animal.3013.desc_thief_2: "$pet_animal.3013.desc_thief_1$ Nhưng [accused_thief_2.GetName] cũng là ứng cử viên có khả năng, vì khá [accused_thief_2.Custom2('InsultAdjective', ROOT.Char)]..."
  pet_animal.3013.desc_thief_single: "Ta chỉ nghĩ tới một người có thể làm chuyện này..."
  pet_animal.3013.desc_thief_none: "Ta không thể tưởng tượng ai đã lấy [ROOT.Char.Custom('EagleStoryName')]."
  pet_animal.3013.a: "[accused_thief_1.GetName] đã lấy đại bàng quý giá của Ta!"
  pet_animal.3013.b: "Hoặc có thể là [accused_thief_2.GetName]?"
  pet_animal.3013.d: "Ta không thể buộc tội ai nếu không có bằng chứng."
  pet_animal.3013.tt: "Ngài buộc tội [accused_thief.GetNameNoTooltip] đã đánh cắp đại bàng"
  pet_animal.3013.wrong: "[accused_thief.GetName] không đánh cắp [ROOT.Char.Custom('EagleStoryName')]"
  pet_animal.3013.unknown: "Số phận của đại bàng vẫn chưa biết..."
  rival_stole_from_me_eagle: "[CHARACTER.GetShortUIName|U] đã cố đánh cắp đại bàng săn mồi của [TARGET_CHARACTER.GetNamePossessive]."
  rival_stole_from_me_eagle_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] đã cố đánh cắp đại bàng săn mồi của [CHARACTER.GetNamePossessive]."

  pet_animal.3020.t: "Chu Kỳ Tiếp Diễn"
  pet_animal.3020.desc_intro: "Ta ngắm nhìn [ROOT.Char.Custom('EagleStoryName')], nhớ về ngày mà Ta"
  pet_animal.3020.desc_intro_standard: "bắt [ROOT.Char.Custom('EagleStoryHerHim')] từ tổ của [ROOT.Char.Custom('EagleStoryHerHis')]"
  pet_animal.3020.desc_intro_lure: "dụ [ROOT.Char.Custom('EagleStoryHerHim')] đến với Ta"
  pet_animal.3020.desc_intro_gift: "nhận [ROOT.Char.Custom('EagleStoryHerHim')] như một món quà"
  pet_animal.3020.desc_intro_market: "mua [ROOT.Char.Custom('EagleStoryHerHim')] từ gian hàng của một thương nhân"
 #pet_animal.3020.desc_intro_rescue: "rescued [ROOT.Char.Custom('EagleStoryHerHim')] from a trap."
  pet_animal.3020.desc_intro_stolen: "lấy [ROOT.Char.Custom('EagleStoryHerHim')] khỏi tay người khác"
  pet_animal.3020.desc_intro_none: "tìm thấy [ROOT.Char.Custom('EagleStoryHerHim')]"
  pet_animal.3020.desc: "và tất cả những kỷ niệm mà chúng Ta đã chia sẻ. Trở nên khá [ROOT.Char.Custom('EaglePersonalityTrait1')] theo thời gian, [ROOT.Char.Custom('EagleStoryName')] đã là Ngài đồng hành của Ta, và Ta không thể tưởng tượng săn bắn mà không có [ROOT.Char.Custom('EagleStoryHerHim')].\n\n"
  pet_animal.3020.desc_normal: "Nhưng sinh vật này không sinh ra để bị giam cầm bởi những người như ta, và sẽ tốt nhất nếu [ROOT.Char.Custom('EagleStorySheHe')] được tự do để duy trì nòi giống của riêng [ROOT.Char.Custom('EagleStoryHerHis')]. Đã đến lúc rồi chăng?"
  pet_animal.3020.desc_let_go: "Tình huống này từng xuất hiện trước đây, và Ta đã chọn giữ [ROOT.Char.Custom('EagleStoryName')] bên mình. Ta biết [ROOT.Char.Custom('EagleStorySheHe')] nên được tự do, nhưng [ROOT.Char.Custom('EagleStorySheHe')] vẫn chưa yếu đuối. Có lẽ Ta nên đợi thêm một thời gian?"
  pet_animal.3020.desc_let_go_2: "Dù sao, Ta đã giữ [ROOT.Char.Custom('EagleStoryName')] trong tay quá lâu. Đã đến lúc thả [ROOT.Char.Custom('EagleStoryHerHim')] ra."
  pet_animal.3020.a_tt: "Ngài thả đại bàng vào tự nhiên."
  pet_animal.3020.a_second: "Không, tự do của [ROOT.Char.Custom('EagleStoryHerHis')] đã quá trễ."
  pet_animal.3020.b: "Ta chưa thể chia tay với [ROOT.Char.Custom('EagleStoryHerHim')] ngay bây giờ."
  pet_animal.3020.b_second: "[ROOT.Char.Custom('EagleStorySheHe')|U] còn vài năm nữa trong [ROOT.Char.Custom('EagleStoryHerHim')]."
  pet_animal.3020.b_tt: "Ngài giữ đại bàng bên mình thêm một thời gian, suy nghĩ về việc thả ra sau."
  pet_animal.3020.c: "Ta sẽ không bao giờ để [ROOT.Char.Custom('EagleStoryName')] đi!"
  pet_animal.3020.c_tt: "Ý tưởng trả đại bàng về với thiên nhiên hoàn toàn không thể chấp nhận."
  pet_animal.3020.warning_less: "#warning Điều này có khả năng nhỏ ảnh hưởng tới sức khỏe của đại bàng#!"
  pet_animal.3020.warning: "#warning Điều này có khả năng ảnh hưởng tới sức khỏe của đại bàng#!"
  pet_animal.eagle_weak_title: "Sức khỏe của [ROOT.Char.Custom('EagleStoryNamePossessive')] xấu đi"
  pet_animal.eagle_unweak_title: "Sức khỏe của [ROOT.Char.Custom('EagleStoryNamePossessive')] cải thiện"

  pet_animal.3030.t_eye: "Mắt của [ROOT.Char.Custom('EagleStoryNamePossessive')|U]"
  pet_animal.3030.t_wing: "Cánh của [ROOT.Char.Custom('EagleStoryNamePossessive')|U]"
  pet_animal.3030.t_claw: "Móng vuốt của [ROOT.Char.Custom('EagleStoryNamePossessive')|U]"
  pet_animal.3030.desc_intro: "Gần đây, Ta nhận thấy [ROOT.Char.Custom('EagleStoryName')] có vẻ khá căng thẳng."
  pet_animal.3030.desc_training: "Sau buổi huấn luyện gần đây, Ta nhận thấy điều gì đó không ổn với [ROOT.Char.Custom('EagleStoryName')]."
  pet_animal.3030.desc_eye: "Sự chuẩn xác thường thấy của [ROOT.Char.Custom('EagleStoryName')] đã thuyên giảm, và một trong những con mắt của [ROOT.Char.Custom('EagleStoryHerHis')] đã nhắm lại nhiều hơn bình thường. Nghi ngờ điều tồi tệ nhất, ta vẫy tay trước con mắt hỏng đó, và [ROOT.Char.Custom('EagleStorySheHe')] thậm chí không hề chớp mắt! Trông nó có vẻ đã bị xẹp, giải thích cho những khó khăn gần đây của [ROOT.Char.Custom('EagleStoryHerHis')]."
  pet_animal.3030.desc_wing: "Một vài chiếc lông vũ của [ROOT.Char.Custom('EagleStoryName')] đã bị rụng, và [ROOT.Char.Custom('EagleStorySheHe')] đã không thể bay cao như [ROOT.Char.Custom('EagleStorySheHe')] từng bay được nữa. Nhẹ nhàng chạm vào cánh của [ROOT.Char.Custom('EagleStoryHerHis')], ta có thể cảm nhận nó xệ xuống nhiều hơn bình thường, giải thích cho những khó khăn gần đây của [ROOT.Char.Custom('EagleStoryHerHis')]."
  pet_animal.3030.desc_claw: "Một trong những móng vuốt của [ROOT.Char.Custom('EagleStoryName')] đã bị gãy, và [ROOT.Char.Custom('EagleStorySheHe')] không thể bám chặt vào găng tay ta như [ROOT.Char.Custom('EagleStorySheHe')] từng bám được nữa. Kiểm tra cái vuốt, ta có thể cảm nhận nó đã bị nứt, giải thích cho những khó khăn gần đây của [ROOT.Char.Custom('EagleStoryHerHis')]."
  pet_animal.3030.desc_weak: "Điều này khiến Ta càng lo lắng hơn, vì [ROOT.Char.Custom('EagleStorySheHe')] vốn đã không khỏe."
  pet_animal.3030.desc_outro: "\n\nMột vết thương có thể trở nặng nếu không điều trị, nhưng làm sao Ta tìm được phương pháp chữa?"
  pet_animal.3030.court_physician: "Nếu [court_physician.GetFirstName] có thể chữa bệnh, [court_physician.GetSheHe] cũng có thể chữa cho đại bàng của Ta."
  pet_animal.3030.court_huntsman: "Ngươi biết về thú vật chứ, [court_huntsman.GetFirstName]?"
  pet_animal.3030.random_smart_courtier: "[random_smart_courtier.GetFirstName] khá hiểu biết, có lẽ [random_smart_courtier.GetSheHe] có thể giúp."
  pet_animal.3030.self: "Ta biết cách điều trị bệnh này."
  pet_animal.3030.none: "Ta phải để tự nhiên tự xử."
  pet_animal.3030.very_good: "Họ phục hồi đại bàng của Ngài hoàn toàn"
  pet_animal.3030.good: "Họ chữa trị vết thương cho đại bàng của Ngài"
  pet_animal.3030.good_self: "Ngài chữa trị thành công vết thương cho đại bàng"
  pet_animal.3030.very_good_self: "Ngài phục hồi hoàn toàn sức khỏe cho đại bàng"
