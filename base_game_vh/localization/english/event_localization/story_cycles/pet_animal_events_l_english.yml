  pet_animal.3040.personality_new_protective: "[ROOT.Char.Custom('EagleStorySheHe')|U] trở nên rất bảo vệ Ngài"
  pet_animal.3040.personality_bonus_stewardship: "@skill_stewardship_icon! #P Có khả năng hơn#! với huấn luyện [stewardship|E]"
  pet_animal.3040.personality_bonus_martial: "@skill_martial_icon! #P Có khả năng hơn#! với huấn luyện [martial|E]"
  pet_animal.3040.personality_bonus_intrigue: "@skill_intrigue_icon! #P Có khả năng hơn#! với huấn luyện [intrigue|E]"
