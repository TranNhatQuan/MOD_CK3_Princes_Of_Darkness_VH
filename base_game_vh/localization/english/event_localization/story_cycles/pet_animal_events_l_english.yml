  pet_animal.3040.personality: "Ngài hiểu thêm về #bold tính cách#! của [ROOT.Char.Custom('EagleStoryNamePossessive')]"
  pet_animal.3040.personality_change: "Tính cách #bold của [ROOT.Char.Custom('EagleStoryNamePossessive')]# thay đổi"
  pet_animal.3040.personality_change_tooltip: "Đại bàng của Ngài nhận được một đặc điểm tính cách mới"
  pet_animal.3040.personality_new_brave: "[ROOT.Char.Custom('EagleStorySheHe')|U] khá dũng cảm"
  pet_animal.3040.personality_new_curious: "[ROOT.Char.Custom('EagleStorySheHe')|U] vô cùng tò mò về thế giới xung quanh của [ROOT.Char.Custom('EagleStoryHerHis')]"
  pet_animal.3040.personality_new_cunning: "[ROOT.Char.Custom('EagleStorySheHe')|U] chơi khăm Ngài một cách tinh ranh"
  pet_animal.3040.personality_new_loyal: "[ROOT.Char.Custom('EagleStorySheHe')|U] trung thành bên Ngài"
  pet_animal.3040.personality_new_wise: "[ROOT.Char.Custom('EagleStorySheHe')|U] thông minh hơn so với các loài chim khác"
  pet_animal.3040.personality_new_calm: "[ROOT.Char.Custom('EagleStorySheHe')|U] không phải loài hay hung dữ"
