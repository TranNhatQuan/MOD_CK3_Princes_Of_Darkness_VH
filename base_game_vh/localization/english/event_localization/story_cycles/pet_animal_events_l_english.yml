  pet_animal.3040.personality_bonus_diplomacy: "@skill_diplomacy_icon! #P Có khả năng hơn#! với huấn luyện [diplomacy|E]"
  pet_animal.3040.martial: "Một bài học trên chiến trường chưa bao giờ hại thợ săn dày dạn kinh nghiệm."
  pet_animal.3040.stewardship: "[ROOT.Char.Custom('EagleStorySheHe')|U] sẽ biết về đất đai và cách điều hướng chúng."
  pet_animal.3040.intrigue: "Để là thợ săn giỏi, phải biết đánh lừa con mồi."
  pet_animal.3040.learning: "Kiến thức là sức mạnh, và [ROOT.Char.Custom('EagleStoryName')] sẽ là một con chim khôn ngoan."
  pet_animal.3040.diplomacy: "Ta sẽ dạy [ROOT.Char.Custom('EagleStoryHerHim')] nhiều hơn về con người."
  pet_animal.3040.money: "Ta có thể chi một ít tiền cho sự phát triển của [ROOT.Char.Custom('EagleStoryHerHis')]."
  pet_animal.3040.money_tt: "Ngài thuê huấn luyện viên giúp đỡ"
  pet_animal.3040.none: "Sự tiến bộ của [ROOT.Char.Custom('EagleStoryHerHis')|U] nên để may rủi quyết định."

  pet_animal.3050.t: "Đại Bàng Của Kẻ Thù"
  pet_animal.3050.desc: "Khi Ta đi ngang [rival_home.GetName] để làm một việc vặt, Ta bắt gặp một con đại bàng [rival.Custom('EaglePersonalityTraitTooltip')] trong lồng. Ta đã thấy con chim này ở đâu rồi...? À! Đó là đại bàng [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('rival'))] [rival.GetTitledFirstNamePossessive] của Ta, [rival.Custom('EagleStoryName')]!\n\nMột nụ cười độc ác hiện lên trên mặt Ta khi nó kêu lên với ánh nhìn sắc bén."
  pet_animal.3050.a.tt: "Ngài cố gắng làm hại đại bàng của [rival.GetFirstNamePossessiveNoTooltip]"
  pet_animal.3050.steal: "Ta sẽ lấy con chim này cho riêng mình!"
  pet_animal.3050.steal.tt: "Ngài cố gắng đánh cắp đại bàng của [rival.GetFirstNamePossessiveNoTooltip]"
  pet_animal.3050.b: "Ta sẽ lấy con chim này cho [token_child.GetName]!"
  pet_animal.3050.b.flavor: "Không có gì sai khi lấy trộm vì lý do tốt"
  pet_animal.3050.b.tt: "Ngài cố gắng đánh cắp đại bàng của [rival.GetFirstNamePossessiveNoTooltip] cho [token_child.GetNameNoTooltip]"
  pet_animal.3050.good: "Ngài thành công trong hành động phá hoại đối với [rival.GetFirstNameNoTooltip]"
  pet_animal.3050.bad: "Đại bàng vẫn không hề hấn gì"
  pet_animal.3050.c: "Ta có thể kiếm được một khoản kha khá từ [rival.Custom('EagleStoryName')]..."
  pet_animal.3050.c_tt: "Ngài cố gắng bán đại bàng của kẻ thù để kiếm tiền lớn"
  pet_animal.3050.c.tt: "Cái gì tốt cho ngỗng cũng tốt cho ngỗng trống"
  pet_animal.3050.d: "Thật dễ thương!"

  pet_animal.3060.t: "Một Thợ Săn Trong Tương Lai"
  pet_animal.3060.t_girl: "Một Nữ Thợ Săn Trong Tương Lai"
  pet_animal.3060.desc_intro: "[token_child.GetName] đã trưởng thành và khá [token_child.Custom('ComplimentAdjective')], và Ta không thể tự hào hơn về [token_child.GetHerHim]. Mặc dù [token_child.GetHerHis] có thành tích, [token_child.GetSheHe] sẽ gặp nhiều khó khăn nếu không được dạy cách săn bắn đúng cách.\n\n"
  pet_animal.3060.desc: "Ta quyết định dùng đại bàng của mình, [ROOT.Char.Custom('EagleStoryName')], để giúp, và theo cách đó [ROOT.Char.Custom('EagleStorySheHe')] sẽ trở nên thân thiết hơn với [token_child.GetFirstNameNoTooltip]."
  pet_animal.3060.desc_child: "May mắn thay, [token_child.GetSheHe] tiếp thu rất nhanh, và đã sở hữu một chú đại bàng của riêng [token_child.GetHerHis]. Tên của nó là [token_child.Custom('EagleStoryName')], và [token_child.GetNameNoTooltip] đã sớm quấn quýt lấy [ROOT.Char.Custom('EagleStoryHerHim')]."
  pet_animal.3060.a: "Hy vọng [token_child.GetFirstNameNoTooltip] sẽ trở thành thợ săn giỏi một ngày!"
  pet_animal.3060.a_girl: "[token_child.GetFirstNameNoTooltip] sẽ trở thành nữ thợ săn giỏi một ngày!"
  pet_animal.3060.good: "[token_child.GetFirstNameNoTooltip] điều khiển đại bàng tốt"
  pet_animal.3060.decent: "Kỹ năng săn bắn của [token_child.GetFirstNamePossessiveNoTooltip] cần cải thiện"

  pet_animal.3070.t: "Bài Hát Của [ROOT.Char.Custom('EagleStoryNamePossessive')]"
  pet_animal.3070.desc: "Dù ta thường không để chú đại bàng của mình lộ diện trước người khác, nhưng [ROOT.Char.Custom('EagleStorySheHe')] đã kêu ré lên suốt cả tuần qua. Không muốn phải nghe những thứ âm thanh phiền toái ấy cả ngày, tổ tạm thời của [ROOT.Char.Custom('EagleStoryHerHis')] đã được chuyển ra ngoài sân.\n\nKhi ta đến kiểm tra [ROOT.Char.Custom('EagleStoryHerHim')] sau đó, ta thấy [target.GetName] đang lắng nghe giai điệu của [ROOT.Char.Custom('EagleStoryNamePossessive')]. "Đây là chim của ngài sao?" [target.GetFirstNameNoTooltip] hỏi, và ta khẽ gật đầu một cách miễn cưỡng.\n\n"[ROOT.Char.Custom('RandomPositiveLookAdjective')|U]!" [target.GetSheHe] thốt lên, dẫu ta không thể nói rằng mình đồng tình với điều đó."
  pet_animal.3070.a: "Ta vui khi có người thích nó."
  eagle_funny_sing_modifier: "Độc Thoại Của Loài Chim"

  pet_animal.3080.t: "Món Quà Của [ROOT.Char.Custom('EagleStoryNamePossessive')|U]"
  pet_animal.3080.desc: "Ta thấy mình đang phải lao theo [ROOT.Char.Custom('EagleStoryName')], kẻ vừa bất thình lình lao vút đi khi chúng ta đang cưỡi ngựa. Khi ta đuổi kịp [ROOT.Char.Custom('EagleStoryHerHim')], [ROOT.Char.Custom('EagleStorySheHe')] đang bận rộn với một sinh vật lông xù, cựa quậy trong móng vuốt của [ROOT.Char.Custom('EagleStoryHerHis')]! Ấn tượng trước chiến lợi phẩm này, ta để [ROOT.Char.Custom('EagleStoryHerHim')] thưởng thức phần thưởng của [ROOT.Char.Custom('EagleStoryHerHis')].\n\n"QUÁC...!" [ROOT.Char.Custom('EagleStorySheHe')] cất tiếng kêu vang khi nó thả sinh vật vô hồn xuống chân ta."
  pet_animal.3080.a: "Thật... ngọt ngào?"

  pet_animal.3199.t: "[ROOT.Char.Custom('EagleStoryName')]: Chuyến Bay Cuối"
  pet_animal.3199.desc_intro: "[ROOT.Char.Custom('EagleStoryName')] đã bay bên Ta nhiều năm, và thời gian không tha cho [ROOT.Char.Custom('EagleStoryHerHim')]."
  pet_animal.3199.desc: "Dù thật đau lòng khi phải nói ra điều này, bộ lông của [ROOT.Char.Custom('EagleStoryHerHis')] đã trở nên xơ xác, và [ROOT.Char.Custom('EagleStorySheHe')] không còn có thể sải cánh bay lượn với dũng khí mà [ROOT.Char.Custom('EagleStorySheHe')] từng có trước đây nữa."
  pet_animal.3199.desc_dying: "Với sức khỏe [ROOT.Char.Custom('EagleStoryHerHis')] ngày càng yếu, Ta biết [ROOT.Char.Custom('EagleStorySheHe')] sẽ không ở bên Ta lâu nữa."
  pet_animal.3199.desc_outro: "\n\nTa tháo mũ trùm mắt [ROOT.Char.Custom('EagleStoryHerHis')], và thả [ROOT.Char.Custom('EagleStoryHerHim')] lên trời. [ROOT.Char.Custom('EagleStorySheHe')|U] bay cao, rồi cao hơn nữa, nhưng Ta biết [ROOT.Char.Custom('EagleStorySheHe')] sẽ không quay lại."
  pet_animal.3199.a: "Ta sẽ nhớ Ngài, [ROOT.Char.Custom('EagleStoryName')]!"
  artifact_animal_feather_name_eagle: "Lông của [ROOT.Char.Custom('EagleStoryNamePossessive')]"
  artifact_bird_feather_pet_description: "Chiếc lông của đại bàng săn mồi yêu quý, được [ROOT.Char.GetTitledFirstName] nhổ ra."
