l_english:
  murders_at_court.1001.t:1 "Các Vụ Giết Người Tại Triều: Cầu Nguyện Cho Những Linh Hồn Vô Danh"
  murders_at_court.1001.desc_physician:1 ""Một số phần cơ thể đã được tìm thấy sáng nay, [ROOT.Char.Custom('FormOfAddressForLiege')]," [physician.Custom2('MyCharacterIntroduction', ROOT.Char)] nói, chỉ vào bàn trước mặt. Máu đọng quanh những đống thịt nhỏ; những sợi mô nằm trong chất dịch sẫm màu.\n\n\"Như ngài thấy, đây không phải là một con... người nguyên vẹn. Không đủ để nhận dạng.""
  murders_at_court.1001.desc:1 ""Một số phần cơ thể đã được tìm thấy sáng nay, [ROOT.Char.Custom('FormOfAddressForLiege')]," một vệ sĩ nói, chỉ vào bàn trước mặt. Máu đọng quanh những đống thịt nhỏ; những sợi mô nằm trong chất dịch sẫm màu.\n\n\"Như ngài thấy, đây không phải là một con... người nguyên vẹn. Không đủ để nhận dạng.""
  murders_at_court.1001.a:0 "Ta sẽ cầu nguyện cho nạn nhân."
  murders_at_court.1001.b:0 "Hãy bảo đảm rằng tất cả mọi người luôn được kiểm soát hành tung, vào #EMP mọi#! lúc."
  murders_at_court.1001.b.tt:0 "Ta sẽ hạn chế sự di chuyển của mọi người tại triều đình — hy vọng sẽ gây áp lực để kẻ sát nhân lộ diện"
  murder_at_court_movement_restricted_courtiers_craven:0 "Mọi triều thần nhút nhát"
  murder_at_court_movement_restricted_courtiers_other:0 "Mọi triều thần khác"
  murder_at_court_movement_restricted_courtiers:0 "Mọi triều thần"
  murders_at_court.1001.c:0 "Gấp đôi số vệ sĩ!"
  murders_at_court.1001.c.tt:0 "Số vệ sĩ thêm chắc chắn sẽ ngăn cản kẻ sát nhân – hoặc ít nhất làm khó chúng"
  murders_at_court.1001.d:0 "Có ai thấy gì không? Xin hãy giúp Ta!"
  murders_at_court.1001.d.tt:0 "Ta công bố khắp chốn rằng Ta đang tìm thông tin và manh mối"
  murders_at_court.1001.e:0 "Ta sẽ tự mình điều tra vụ này."
  murders_at_court.1001.e.tt:0 "Ta sẽ dùng kiến thức của mình để giải quyết vụ án"

  murders_at_court.1002.t:1 "Các Vụ Giết Người Tại Triều: Giết Người Vào Buổi Sáng"
  murders_at_court.1002.desc_named:0 "Khi mặt trời mọc, Ta nhận được tin rằng [victim.Custom2('MyCharacterIntroduction', ROOT.Char)] đã bị giết trong đêm. Bị mổ bụng dã man và đặt ra để ai đi qua cũng thấy...\n\nThi thể nhanh chóng được đưa đi, và khi mặt trời lặn không còn dấu vết gì của vụ án kinh hoàng."
  murders_at_court.1002.desc:0 "Một ngày khác, một thi thể khác. Ta nhận ra với nỗi buồn nặng nề rằng sự thường nhật đã len lỏi vào [ROOT.Char.Custom('ResidenceBuilding')] sau những vụ giết người gần đây.\n\nThi thể — một [ROOT.Char.Custom('RandomWomanMan')] trẻ bị mổ bụng — nhanh chóng được đưa đi, và khi mặt trời lặn không còn dấu vết gì của vụ án kinh hoàng."

  murders_at_court.1003.t:1 "Các Vụ Giết Người Tại Triều: Cho Đến Khi Chết"
  murders_at_court.1003.desc_opening:0 "Ta thấy [spouse.GetTitledFirstName] trong phòng, nằm sấp trên sàn trong một vũng máu của [spouse.GetHerHis]."
  murders_at_court.1003.desc_like:0 "Kêu la, Ta rơi xuống sàn, ôm chặt [spouse.GetHerHim] vào lòng"
  murders_at_court.1003.desc:1 "Ta rơi xuống sàn, ôm chặt [spouse.GetHerHim] vào lòng"
  murders_at_court.1003.desc_end:0 "– [spouse.GetSheHe] lạnh lùng quá... Ôi [ROOT.Char.GetFaith.HighGodName], sao [spouse.GetSheHe] lại lạnh đến vậy?!"

  murders_at_court.1004.t:1 "Các Vụ Giết Người Tại Triều: Đứa Con Của Ta"
  murders_at_court.1004.desc:0 "Ta tìm thấy [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('child'))] [child.GetTitledFirstName] trong giường của [child.GetHerHis] — lạnh lẽo và chết. Ga trải giường thấm đẫm máu, và tiếng #EMP nhỏ giọt, nhỏ giọt#! rơi xuống sàn dưới giường vang vọng trong phòng."

  murders_at_court.2001.t:1 "Các Vụ Giết Người Tại Triều: Leo Thang"
  murders_at_court.2001.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('victim'))] [victim.GetTitledFirstName] nằm sấp trên sàn lạnh, máu rỉ ra từ nhiều vết dao khắp cơ thể [victim.GetHerHis].\n\nSao kẻ sát nhân này lại trêu ngươi Ta đến vậy?!"

  murders_at_court.2002.t:1 "Các Vụ Giết Người Tại Triều: Đi Trước Một Bước"
  murders_at_court.2002.desc:0 "Đầu lìa của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))] [heir.GetTitledFirstName] nằm trên bàn Ta khi Ta trở về phòng, miệng há ra trong tiếng thét im lặng. Người thừa kế [ROOT.Char.Custom2('DescriptorPositive', SCOPE.sC('heir'))] của Ta... Ôi [ROOT.Char.GetFaith.HighGodName], tại sao? Kẻ sát nhân đang ám chúng ta này phải bị ngăn chặn!"
  murders_at_court.2002.a:0 "Ta phải cầu nguyện cho [ROOT.Char.Custom('RealmType')] của chúng ta!"

  murders_at_court.2003.t:1 "Các Vụ Giết Người Tại Triều: Xóa Bạn Người Lộ Diện"
  murders_at_court.2003.desc:0 "Một cơn đau nhói ở sau lưng— ta hít vào, và nỗi đau đớn ngày một tăng lên khiến ta phải thét lên. Khi ta cố quay người lại thì cơ thể gục xuống, theo sau tiếng #EMP tí tách#! #EMP tí tách#! của những giọt máu rơi xuống sàn nhà.\n\nTầm nhìn của ta đang tối dần đi, nhưng ta vẫn thấy [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murderer'))] của mình là [murderer.GetTitledFirstName] đang đứng nhìn ta với một nụ cười toe toét. Ta cố với lấy [murderer.GetHerHim] và [murderer.GetSheHe] ban cho ta một cú đá khiến cả căn phòng quay cuồng; vòng quanh và vòng quanh– ánh sáng rồi bóng tối, và ngày một tối hơn, tối tăm hơn..."
  murders_at_court.2003.a:0 "[murderer.GetFirstNameNoTooltip]... Tại sao...?"

  murders_at_court.2101.t:1 "Các Vụ Giết Người Tại Triều: Người Thừa Kế Bị Giết"
  murders_at_court.2101.desc_opening:0 "Ta nhìn xuống thi thể vô hồn của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other_heir'))] [other_heir.GetTitledFirstName] và cảm thấy chóng mặt. Chắc chắn máu Ta đang phủ sàn dưới [other_heir.GetHerHim], vì không giọt nào chảy lên đến não Ta.\n\n"
  murders_at_court.2101.desc_family:0 "Ta quỳ xuống bên [other_heir.GetHerHim], nâng má lạnh bằng tay – đôi mắt [other_heir.GetHerHis] mở to, nhưng là ngạc nhiên chứ không phải kinh hãi. 'Có ai quen của ngươi làm điều này với ngươi sao?'"
  murders_at_court.2101.desc:0 "[other_heir.GetSheHe|U] trông ngạc nhiên nhiều hơn sợ hãi... Có lẽ [other_heir.GetSheHe] biết Xóa Bạn [other_heir.GetHerHis]?"

  murders_at_court.2201.t:1 "Các Vụ Giết Người Tại Triều: Điều Không Thể Thấy"
  murders_at_court.2201.desc:0 "\"Nhưng... đôi mắt đã mất! Bị móc ra như đá trong đồng ruộng!\" Người hầu [ROOT.GetCharacter.Custom('lowly_servant_type')] tìm thấy nạn nhân mới nhất của kẻ sát nhân được dẫn ra – mặt trắng bệch, tay run rẩy, vẫn la hét.\n\nKhi nhìn vào những hốc đỏ không thấy gì nơi đôi mắt lẽ ra phải có, Ta rùng mình. Kẻ sát nhân cần mắt để làm gì? Một nghi lễ nào đó sao?"

  murders_at_court.5001.t:0 "Các Vụ Giết Người Tại Triều: Trợ Lý"
  murders_at_court.5001.desc:0 "Một người đàn ông tò mò đã tìm đến Ta sau khi nghe về những vụ giết người đang hoành hành tại triều đình.\n\n\"Ta là [watson.GetTitledFirstName], [ROOT.Char.Custom('FormOfAddressForLiege')]. Ta nghĩ Ta có thể giúp được ngài.\""
  murders_at_court.5001.a:0 "Ta sẽ cần mọi sự giúp đỡ có thể!"
 #murders_at_court.5001.b: ""
  murders_at_court.5001.c:0 "Điều này không liên quan đến ngươi!"

  murders_at_court.8001.t:1 "Các Vụ Giết Người Tại Triều: Memento Mori"
  murders_at_court.8001.desc:1 "Khi chúng Ta an táng [story_owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], Ta thề sẽ tìm ra kẻ đã làm điều này với [story_owner.GetHerHim]. Kẻ sát nhân dường như đã ngừng chuỗi tội ác, và Ta phải tự hỏi liệu [story_owner.GetTitleAsNameNoTooltip] có phải là mục tiêu từ đầu không..."
  murders_at_court.8001.a:0 "Nguyện [story_owner.GetFirstNameNoTooltip] yên nghỉ trong bình an."

  murders_at_court.8002.desc:1 "Khi chúng Ta an táng [story_owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], Ta khó kiềm nén tiếng cười; gương mặt [story_owner.GetSheHe] làm lúc cuối thật vô giá! Một [ROOT.Char.Custom2('DescriptorPositive', SCOPE.sC('story_owner'))] [story_owner.GetWomanMan] họ nói – ha ha.\n\nÍt ra mọi chuyện sẽ lắng xuống bây giờ khi kẻ sát nhân đáng sợ đang bận với những việc khác."
  murders_at_court.8002.a:0 "Như cai trị [ROOT.Char.Custom('RealmType')]!"

  murders_at_court.8003.t:1 "Các Vụ Giết Người Tại Triều: Kế Thừa"
  murders_at_court.8003.desc:0 "[predecessor.GetTitledFirstName] thường nói về những vụ giết người hoành hành triều đình [predecessor.GetHerHis]; những vụ giết tàn nhẫn và kinh hoàng.\n\nMọi biện pháp [predecessor.GetSheHe] thực hiện để ngăn chặn vụ giết người đều được giữ lại, và Ta chỉ hy vọng rằng nó đủ..."
  murders_at_court.8003.a:0 "Nguyện lời nguyền đã ám triều đình chết theo [predecessor.GetHerHim]."

  murders_at_court.9001.t:1 "Các Vụ Giết Người Tại Triều: Đối Đầu"
  murders_at_court.9001.desc_opening_watson:0 "Một lá thư đang chờ Ta và [watson.GetTitledFirstName] khi chúng Ta về phòng, được viết bằng mực đỏ — không, bằng #EMP máu#!.\n\n"
  murders_at_court.9001.desc_opening:0 "Một lá thư đang chờ Ta khi Ta trở về phòng, được viết bằng mực đỏ — không, bằng #EMP máu#!.\n\n"
  murders_at_court.9001.desc_heir:1 "#EMP Vì [ROOT.Char.Custom('RealmType')], ngươi sẽ ngừng tìm kiếm. Ta sống cả đời ngay trước mắt ngươi, mà ngươi vẫn mù lòa. Việc tìm ra danh tính ta chỉ mang lại đau khổ cho ngươi.#!"
  murders_at_court.9001.desc_rival:1 "#EMP Ta đã biến việc #EMP hủy diệt#! ngươi – hủy diệt gia đình và triều đại ngươi – thành sứ mệnh cả đời. Không việc gì ngươi làm có thể ngăn ta, nhưng nếu ngươi không ngừng can thiệp, ngươi buộc ta phải làm những điều còn đen tối hơn.#!"
  murders_at_court.9001.desc_witch:1 "#EMP Ngươi nghĩ can thiệp có thể làm được gì sao? Những thế lực hắc ám đã bắt đầu, và việc cản đường chỉ đưa ngươi và người thân vào nguy hiểm.#!"
  murders_at_court.9001.desc_cannibal:1 "#EMP Ngươi không hiểu. Ta cần điều này để sống, để tồn tại, để tìm #EMP dưỡng chất#!. Ngừng tìm kiếm ngay kẻo cơn đói của ta sẽ nuốt hết mọi thứ!#!"
  murders_at_court.9001.desc_vassal:0 "#EMP Vì [ROOT.Char.Custom('RealmType')], ngươi sẽ ngừng tìm kiếm. Ta cần – #EMP quý giá#!, và ngươi sẽ hối hận nếu phát hiện danh tính ta.#!"
  murders_at_court.9001.desc_fallback:1 "#EMP Ngươi sẽ ngừng tìm kiếm ngay. Không điều tốt nào đến từ việc lộ danh tính ta, và ta sẽ đảm bảo không điều tốt nào đến với ngươi nếu ngươi cứ cố gắng.#!"
  murders_at_court.9001.desc_ending:1 "\n\nChữ viết này... gần như giống của [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)]!"
  murders_at_court.9001.a:0 "Có thể là...?"
  murders_at_court.9001.a.tt:0 "Ta sẽ đối chất [murderer.GetTitledFirstNameNoTooltip] về chuyện này"
  murders_at_court.9001.b:0 "Ta nghĩ những vụ giết người này sẽ không được giải quyết."
  murders_at_court.9001.b.tt:0 "Điều tồi tệ nhất có thể xảy ra là gì?"
  murders_at_court.9001.c:0 "[watson.GetFirstNameNoTooltip], ngươi nghĩ sao?"
  murders_at_court.9001.c.tt:0 "Ta không nghĩ mọi chuyện đơn giản thế này..."

  murders_at_court.9002.t:0 "Các Vụ Giết Người Tại Triều: Hậu Quả"
  murders_at_court.9002.desc:0 "Ta thấy [the_one_to_kill.Custom2('MyCharacterIntroduction', ROOT.Char)] bị treo ngoài [ROOT.Char.Custom('ResidenceBuilding')]. Thi thể [the_one_to_kill.GetHerHis|U] lạnh, tái nhợt, bất động... Nhưng đó là gì? Một mẩu giấy nhỏ được kẹp vào nếp quần áo [the_one_to_kill.GetHerHis]!\n\n#EMP Đây là nạn nhân cuối cùng của ta – món quà cuối cùng cho ngươi, [ROOT.Char.GetTitledFirstNameNoTooltip]. Nhưng đừng lo, ta vẫn sẽ ở quanh đây, theo dõi ngươi.#!"
  murders_at_court.9002.a:0 "Thật khó tin một quái vật như vậy lại được thả tự do..."

  murders_at_court.9003.t:1 "Các Vụ Giết Người Tại Triều: Di Sản Đen Tối"
  murders_at_court.9003.a:0 "Ngươi sẽ bị trừng phạt vì tội ác!"
  murders_at_court.9003.b:0 "Mắt đền mắt, mạng đổi mạng...!"
  murders_at_court.9003.c:0 "Hãy đi tự do, [murderer.GetTitledFirstNameNoTooltip]."
  murders_at_court.9003.d:0 "Chắc hẳn chán lắm khi phạm tội một mình..."
  murders_at_court.9003.e:0 "Ôi... Ta– Ta rất xin lỗi."

  murders_at_court.9004.t:0 "Các Vụ Giết Người Tại Triều: Bắt Quả Tang"
  murders_at_court.9004.desc_letter_event:0 "[watson.GetTitledFirstName] và Ta dành nhiều giờ nghiền ngẫm lá thư. Nhưng mùi hương này... Ôi, nó giống mùi [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)] [murderer.GetTitledFirstName] của Ta!"
  murders_at_court.9004.desc:0 "\"[My [ROOT.Char.GetTitleAsNameNoTooltip], [victim.GetTitledFirstName] và [murderer.GetTitledFirstName] đều đã mất tích].\"\n\nTa vẫy tay đuổi vệ sĩ và nhận thấy nỗi báo động trong mắt [watson.GetTitledFirstNamePossessive] như Ta cảm nhận; [murderer.GetTitledFirstNameNoTooltip] có thể là..."
  murders_at_court.9004.desc_ending:1 "\n\nKhi chúng Ta cuối cùng truy tìm [murderer.GetTitleAsNameNoTooltip], [murderer.GetSheHe] đang tiến về phía [victim.GetTitledFirstName], dao trên tay.\n\n\"Dừng lại ngay!\""

  murders_at_court.9021.t:1 "Các Vụ Giết Người Tại Triều: Ma Thuật Đen"
  murders_at_court.9021.desc:3 "Khi binh lính của ta và ta cuối cùng cũng lần theo dấu vết của [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)] để bắt giữ, [murderer.GetSheHe] đang quỳ bằng đôi đầu gối trần của [murderer.GetHerHis] trước một cuốn thư tịch cổ, trán tì sát xuống sàn nhà và hai tay giơ cao quá đầu [murderer.GetHerHis] với một góc độ gần như dị thường.\n\n"

  murders_at_court.9031.t:1 "Các Vụ Giết Người Tại Triều: Cơn Thèm Khát"
  murders_at_court.9031.desc:2 "Khi vệ sĩ và Ta cuối cùng truy tìm được [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)], [murderer.GetSheHe] đang gặm thứ trông giống như ngón tay người #EMP!#"

  murders_at_court.9041.t:0 "Các Vụ Giết Người Tại Triều: Trốn Thoát"
  murders_at_court.9041.desc_opening:0 "Điều duy nhất chờ Ta khi cuối cùng truy tìm [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)] là"
  murders_at_court.9041.desc_witch:0 "mảnh xương, thứ trông đáng ngờ như mắt người, và"
  murders_at_court.9041.desc_cannibal:0 "mảnh xương trông như đã bị gặm, và"
  murders_at_court.9041.desc:0 "một lá thư trêu chọc nỗ lực của Ta. [murderer.GetTitledFirstNameNoTooltip] [murderer.GetHerselfHimself] không thấy đâu."
  murders_at_court.9041.a:0 "Mọi người sẽ biết về tội ác của họ!"
  murders_at_court.9041.b:0 "Tốt hơn là giữ kín chuyện này..."

  murders_at_court.9099.t:1 "Các Vụ Giết Người Tại Triều: Giao Dịch Đẫm Máu"
  murders_at_court.9099.t_wrong:0 "Các Vụ Giết Người Tại Triều: Sai Lầm"
  murders_at_court.9099.desc_wrong:0 "Khi cuối cùng Ta truy tìm [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)], [murderer.GetSheHe] thậm chí không cố chạy trốn. Thật ra, [murderer.GetSheHe] nhìn Ta với sự bối rối hoàn toàn.\n\n\"Cuối cùng ta cũng tìm thấy ngươi, Xóa Bạn người!\"\n\n\"Xin lỗi, gì cơ? Ngươi nghĩ #EMP ta#! đã giết tất cả những người đó sao?!\""
  murders_at_court.9099.desc_nothing:1 "Khi cuối cùng Ta truy tìm [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)], [murderer.GetSheHe] thậm chí không cố chạy trốn Ta và vệ sĩ.\n\n"
  murders_at_court.9099.desc:1 "\"Xin chào [ROOT.Char.GetFirstNameNoTooltip],\" [murderer.GetSheHe] nói, nhìn Ta từ đầu đến chân. \"Đã đến lúc ngươi tìm thấy ta. Ta đoán ngươi thích những... #EMP món quà#! của ta?\"\n\nNụ cười lan tỏa trên mặt [murderer.GetHerHis] khiến Ta rùng mình."

  murders_at_court.9989.desc:0 "Tuy nhiên, Ta không khỏi nhận thấy các vụ giết người dừng lại ngay khi [murderer.GetTitledFirstName] rời triều đình..."
  murders_at_court.9989.a:0 "Ta sẽ để mắt đến người đó."

  murders_at_court.9999.t:1 "Các Vụ Giết Người Tại Triều: Lời Nguyền Được Gỡ Bỏ"
  murders_at_court.9999.desc_opening:1 "Thời gian trôi đi mà không có thi thể mới xuất hiện, Ta dần thư giãn trở lại. Xóa Bạn người đã dừng lại!\n\n"
  murders_at_court.9999.desc:1 "Tuy nhiên, Ta không khỏi nhận thấy các vụ giết người dừng lại ngay khi [murderer.GetTitledFirstName] chết..."
  murders_at_court.9999.a:0 "Bây giờ [murderer.GetSheHe] đã đi, Ta có thể sẽ không bao giờ biết chắc..."
