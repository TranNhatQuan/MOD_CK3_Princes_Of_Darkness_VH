l_english:
  bell_special_yearly.1000.t:0 "Chuông của [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
  bell_special_yearly.1000.desc:0 "[steward.GetCouncilTitle] của Ta, [steward.GetFirstName], gợi ý Ta khảo sát một nhà thờ bỏ hoang gần đây từ thời người Visigoth.\n\nGiữa những mái vòm thùng và các vòm móng ngựa, có một tháp chuông từng rất đẹp, với vài chiếc chuông hư hỏng, mất cả quả lắc.\n\nKhi Ta lang thang trong đống đổ nát, Ta nghe thấy tiếng vó ngựa. Nhìn qua một lỗ hổng, Ta thấy [faction_member_1.GetTitledFirstName] đang tiến tới. Có thể [faction_member_1.GetSheHe] nghĩ nơi này có thể là nơi ẩn náu cho phe phản bội của mình?"
 # [faction_member_1_faction.GetName]
  bell_special_yearly.1000.a:0 "Ta có thể giết [faction_member_1.GetHerHim] mà không ai thấy!"
  bell_special_yearly.1000.a.tt:0 "Ngài lén tiến đến [faction_member_1.GetTitledFirstName] và cố giết [faction_member_1.GetHerHim]"
  bell_special_yearly.1000.b:0 "Ta nên lặng lẽ rút lui."

  bell_special_yearly.1500.desc:0 "Ta ẩn mình trong tiền sảnh nhà thờ, chỉ nghe thấy nhịp tim đầy sát khí của Ta và bước chân của [faction_member_1.GetTitledFirstNamePossessive].\n\nKhi [faction_member_1.GetSheHe] bước vào phòng, Ta đánh vào đầu [faction_member_1.GetHerHis] bằng một mảnh vụn, và [faction_member_1.GetSheHe] ngã xuống đất.\n\nKhi Ta tiếp tục đánh, một ảo tưởng thoáng qua che mờ tầm nhìn nhuốm máu. Một giấc mơ về tháp chuông cũ vang lên một lần nữa, với đầu tất cả kẻ thù của Ta làm quả lắc."
  bell_special_yearly.1500.a:0 "Một kẻ ngu ngốc nữa sẽ gia nhập bản hòa tấu của ta!"
  bell_special_yearly.1500.a.tt:0 "Ngài tìm một nạn nhân khác."
  bell_special_yearly.1500.discovery.tt:0 "Khả năng bị phát hiện tăng lên"
  bell_special_yearly.1500.b:0 "Ta nên về nhà nghỉ ngơi."
  bell_special_yearly.1500.b.tt:0 "Ngài dừng việc thu thập đầu cho chuông."

  bell_special_yearly.2000.desc:1 "Ta triệu tập tên [faction_member_2.GetTitledFirstName] đáng ghét đến [ROOT.Char.Custom('FortifiedBuilding')] của ta và cải trang thành một người hát rong. Trong bộ trang phục, ta dõng dạc tuyên bố '[ROOT.Char.GetTitledFirstName] ra lệnh cho ngài phải nghe bản nhạc mới tuyệt vời được sáng tác ngay tại thủ đô này!'\n\nMột khi [faction_member_2.GetSheHe] đã vào trong, ta ép [faction_member_2.GetHerHim] vào một căn phòng một mình. Tại đó, ta chơi những bài #italic canso#! tẻ nhạt nhất trong suốt nhiều giờ cho đến khi cái tên đần độn đó ngủ gục.\n\nTa ra tay thật nhanh — ta siết cổ kẻ thù bằng một trong những sợi dây đàn lute, giấu cái đầu [Select_CString(ROOT.Char.IsFemale,'dưới lớp váy','trong áo choàng')] của mình, và chuồn thẳng qua các hành lang trước khi bất cứ ai kịp chớp mắt."
  bell_special_yearly.2000.a:0 "Chuông vẫn chưa đủ đầu!"
  bell_special_yearly.2000.b:0 "Đây là một tội ác tuyệt vời — Ta không nên làm hỏng nó."

#Dropping an organ out of a window
  bell_special_yearly.3000.desc:0 "Ta áp đặt một cuộc viếng thăm hoàng gia đến [faction_member_3.GetTitledFirstNamePossessive] [faction_member_3.Custom('FortifiedBuilding')] dưới cớ nhằm giải tỏa căng thẳng với phe nổi loạn của [faction_member_3.GetHerHis]. Trong lúc tạm nghỉ đàm phán, Ta khám phá phòng nhạc của [faction_member_3.GetHerHis] và yêu cầu được ở một mình để chơi nhạc.\n\nPhòng nhạc có một cửa sổ lớn nhìn ra vườn [faction_member_3.Custom('FortifiedBuilding')] — với một đàn organ lớn bên cạnh. Khoảnh khắc quá hoàn hảo.\n\nKhi [faction_member_3.GetFirstNameNoTooltip] bước ra dưới cửa sổ để nghỉ, Ta đẩy đàn organ. Nó lao xuống không trung và nghiền nát [faction_member_3.GetHerHim] bên dưới. Cười khúc khích, Ta vội vã thu thập đầu trước khi cái chết bị phát hiện."
  bell_special_yearly.3000.a:0 "Chuông sẽ tuyệt mỹ!"
  bell_special_yearly.3000.b:0 "Những tai nạn đàn organ kỳ quái xảy ra hàng ngày."

#[faction_member_3_faction.GetName]
  bell_special_yearly.4000.desc:0 "Ta ngồi chơi trong vườn, vô tình nghịch những bông hồng, nhổ từng cái đầu một.\n\nTa tự hỏi phải làm gì với tháp chuông. Liệu nó có bao giờ được cất tiếng?"
  bell_special_yearly.4000.desc_discoverer:0 "\n\nKhi đang suy nghĩ, Ta nhận thấy [bell_discoverer.GetTitledFirstName], một kẻ vẫn còn thương tiếc nạn nhân mất tích, nhìn Ta trong vườn. Ta cười khúc khích, gần như muốn nói với [bell_discoverer.GetHerHim] ngay lập tức."
  bell_special_yearly.4000.a:0 "Ta nên tổ chức một buổi hòa nhạc lớn tại nhà thờ!"
  bell_special_yearly.4000.a.tt:0 "Mọi người nhận ra các vụ giết người của Ngài."
  bell_special_yearly.4000.b:0 "Không ai cần biết giải trí riêng tư của Ta."
  bell_discovery_success_effect:0 "Chuông được giữ bí mật"
  bell_discovery_failure_effect:0 "Chuông bị phát hiện"


  bell_special_yearly.5000.desc:0 "Một đêm, Ta cưỡi ngựa đi thăm chuông và đắm mình trong vẻ xảo quyệt lộng lẫy của nó. Ngạc nhiên thay, có những ngọn đuốc đang cháy khi Ta vào đống đổ nát.\n\nLúc đầu, Ta tưởng ma Visigoth sẽ không hài lòng vì Ta đã phá hoại nhà thờ, nhưng rồi [bell_discoverer.GetTitledFirstName] rút mũ trùm ra. \"Ta cảm thấy như đã bước vào [bell_discoverer.GetFaith.NegativeAfterLife] và sẽ ở đó cả đời, sau khi phát hiện ra điều ghê tởm ngươi gây ra. Ngươi sẽ gia nhập nạn nhân, sinh vật!\"\n\nTa thoáng cảm nhận lưỡi thép qua cổ, rồi chẳng còn gì nữa."
  bell_special_yearly.5000.a:0 "Chơi tiếp đi, [bell_discoverer.GetTitledFirstNameNoTooltip]."


  bell_special_yearly.6000.desc:0 "Một buổi hòa nhạc được tổ chức tại đống đổ nát Visigoth cho toàn bộ triều đình, hứa hẹn một đêm nhạc trong nhà thờ ánh nến cũ.\n\nCác nhạc công trình diễn theo thường lệ trong khi vài khách phàn nàn về mùi lạ. Chúng Ta thưởng thức các giai điệu nhẹ nhàng với sáo và đàn pluck, và các bản nhạc trở nên u sầu hơn khi đêm trôi qua.\n\nCuối cùng, hầu gái theo lệnh Ta vội vàng rung chuông cùng nhịp bài cuối. Tiếng la hét của triều thần hòa cùng tiếng hợp xướng khi mọi người chứng kiến đầu người rung lắc, ngân vang!"
  bell_special_yearly.6000.a:0 "Âm nhạc tuyệt vời!"
  bell_special_yearly.6000.b:0 "Những kẻ phản nghịch sẽ gia nhập họ nếu chống lại ta!"

