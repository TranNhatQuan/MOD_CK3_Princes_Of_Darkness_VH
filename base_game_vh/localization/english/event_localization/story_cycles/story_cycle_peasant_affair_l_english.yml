l_english:
  peasant_affair.1001.t:0 "Cuộc Gặp Lại Bất Ngờ"
  peasant_affair.1001.desc_opening:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], trái tim ta không thể bình yên cho đến khi tìm thấy ngươi lần nữa! Chính ta đây, [peasant_character.GetFirstNameNoTooltip]. Chắc chắn ngươi còn nhớ ta, [ROOT.Char.Custom('LoverPetName')] của ta chứ?\"\n\n"
  peasant_affair.1001.desc_child: "Ta không thể tin vào mắt mình: [peasant_character.GetWomanMan] xinh đẹp mà ta từng say đắm nhiều trăng trước, [peasant_character.GetMotherFather] của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peasant_child'))] thân yêu [peasant_child.GetTitledFirstName], đã xuất hiện tại [ROOT.Char.Custom('GetCourtType')|l]."
  peasant_affair.1001.desc_their_child: "Ta không thể tin vào mắt mình: [peasant_character.GetWomanMan] xinh đẹp mà ta từng say đắm nhiều trăng trước đã xuất hiện tại [ROOT.Char.Custom('GetCourtType')|l]. Bên cạnh [peasant_character.GetHerHim] là đứa trẻ trông có vẻ là [peasant_character.GetHerHis] [peasant_child.Custom('GetDaughterSon')], và ta không khỏi bàng hoàng trước tuổi của [peasant_child.GetHerHis]..."
  peasant_affair.1001.desc_rakish_night: "Ta không thể tin vào mắt mình: [peasant_character.GetWomanMan] xinh đẹp mà ta từng say đắm trong một đêm hoang dại nhiều trăng trước đã xuất hiện tại [ROOT.Char.Custom('GetCourtType')|l]."
  peasant_affair.1001.desc: "Ta không thể tin vào mắt mình: [peasant_character.GetWomanMan] xinh đẹp mà ta từng tình cờ gặp bên ngoài [ROOT.Char.Custom('FortifiedBuilding')] nhiều trăng trước đã xuất hiện tại [ROOT.Char.Custom('GetCourtType')|l]."
  peasant_affair.1001.a_1: "Hãy ở lại đây như một phần của [ROOT.Char.Custom('GetCourtType')|l], ta yêu cầu!"
  peasant_affair.1001.a_2:0 "Ngươi là [peasant_character.GetFirstNameNoTooltip] phải không? Ngươi được chào đón ở lại đây."
  peasant_affair.1001.b:0 "[peasant_child.GetFirstNameNoTooltip] xứng đáng có [peasant_child.GetHerHis] [peasant_character.GetMotherFather]..."
  peasant_affair.1001.c:0 "Ngươi sẽ không tìm thấy mái ấm ở đây."

  peasant_affair.2001.t:0 "[peasant_character.GetWomanMan|U] Trong Giấc Mơ Của Ta"
  peasant_affair.2001.desc_opening:0 "Một lần nữa ta thức dậy với trái tim đập mạnh và ngọn lửa còn âm ỉ nơi lòng dạ.\n\n"
  peasant_affair.2001.desc_rakish_night:1 "Nhiều đêm trôi qua kể từ khi ta chia giường với [peasant_character.GetWomanMan] xinh đẹp mà ta tình cờ gặp trong một trong những chuyến đi đêm, nhưng nỗi khao khát chỉ càng lớn..."
  peasant_affair.2001.desc_known_father:1 "Nhiều đêm trôi qua kể từ khi ta chia giường với [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peasant_character'))], [peasant_character.GetTitledFirstName], nhưng nỗi khao khát chỉ càng lớn..."
  peasant_affair.2001.desc_unknown_peasant:1 "Nhiều đêm trôi qua kể từ khi ta chia giường với [peasant_character.GetWomanMan] xinh đẹp mà ta tình cờ gặp bên ngoài [ROOT.Char.Custom('FortifiedBuilding')], nhưng nỗi khao khát chỉ càng lớn..."
  peasant_affair.2001.desc_child:0 "Đặc biệt là vì [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peasant_child'))] thân yêu [peasant_child.GetTitledFirstName], kết quả của đam mê chúng ta, luôn nhắc nhở ta về [peasant_character.GetHerHim]!"
  peasant_affair.2001.a:0 "Ta phải tìm [peasant_character.GetHerHim]!"
  peasant_affair.2001.a.tt:0 "#F Bắt đầu tìm kiếm ngay!#!"
  peasant_affair.2001.b:0 "Tốt hơn là quên [peasant_character.GetHerHim]."
  peasant_affair.2001.c:0 "Ta sẽ không nao núng, đây là thử thách cho quyết tâm của ta!"

  peasant_affair.2002.desc_opening:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], chúng ta không tìm thấy dấu vết của người nông dân mà ngài yêu cầu. Với nguồn lực hạn chế, Ta chỉ có thể làm được đến mức này...\"\n\n"
  peasant_affair.2002.desc_child:0 "Ngay cả khi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('searching_character'))] [searching_character.GetTitledFirstName] cúi đầu khúm núm, mắt Ta vẫn dõi theo khuôn mặt tò mò của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peasant_child'))] [peasant_child.GetTitledFirstName]."
  peasant_affair.2002.desc:0 "Ngay cả khi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('searching_character'))] [searching_character.GetTitledFirstName] cúi đầu khúm núm, tâm trí Ta lại lang thang về đêm kỳ diệu đó..."
  peasant_affair.2002.a:0 "Ta phải có [peasant_character.GetHerHim], bằng mọi giá!"
  peasant_affair.2002.b:0 "Chắc chắn không một nông dân nào đáng đến thế."

  peasant_affair.2003.desc_opening:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ta trình diện [peasant_character.GetTitledFirstName], được đưa đến trước mặt ngài theo yêu cầu của ngài.\"\n\n"
  peasant_affair.2003.desc_dead_brought_child:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], Ta mang tin. [peasant_character.GetWomanMan] mà ngài muốn tìm tiếc thay đã rời khỏi thế gian này, nhưng chúng Ta đã mang đến cho ngài [peasant_character.GetHerHis] [peasant_child.Custom('GetDaughterSon')].\"\n\nThật là trò đùa tàn nhẫn, cuối cùng tìm thấy [peasant_character.GetHerHim] chỉ để mất [peasant_character.GetHerHim] mãi mãi! Nhưng đứa [peasant_child.Custom('GirlBoy')] đó, có thể [peasant_child.GetSheHe] là của ta...?"
  peasant_affair.2003.desc_dead: "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], Ta mang tin. [peasant_character.GetWomanMan] mà ngài muốn tìm tiếc thay đã rời khỏi thế gian này.\"\n\nThật là trò đùa tàn nhẫn, cuối cùng tìm thấy [peasant_character.GetHerHim] chỉ để mất [peasant_character.GetHerHim] mãi mãi!"
  peasant_affair.2003.desc_dislike: "Người nông dân [peasant_character.GetWomanMan] trong giấc mơ của ta chống lại cái nắm tay của [searching_character.GetTitledFirstNamePossessive], khuôn mặt [peasant_character.GetHerHis] méo mó vì giận dữ và sợ hãi\n\n\"Xin ngài [ROOT.Char.GetLadyLord], hãy để Ta đi! Đêm đó là sai lầm, Ta chỉ muốn được yên.\""
  peasant_affair.2003.desc_dislike_their_child: "Tên tá điền [peasant_character.GetWomanMan] trong mộng của ta đang vùng vẫy khỏi sự kìm kẹp của [searching_character.GetTitledFirstNamePossessive], khuôn mặt của [peasant_character.GetHerHis] co rúm lại vì giận dữ và sợ hãi khi [peasant_character.GetSheHe] ôm chặt [peasant_child.Custom('GetDaughterSon')] của [peasant_character.GetHerHis] vào bên sườn [peasant_character.GetHerHis].\n\n"Xin ngài, [ROOT.Char.Custom('FormOfAddressForLiege')], hãy để mẹ con tôi đi! Tôi chỉ mong muốn được một mình nuôi dưỡng đứa [peasant_child.Custom('GetDaughterSon')] #EMP của tôi#! mà thôi.""
  peasant_affair.2003.desc_their_child:0 "Cuối cùng! Khi [peasant_character.GetSheHe] đứng trước mặt ta, ta cảm giác như thời gian chúng ta chia sẻ chưa từng kết thúc. Tuy nhiên, bên cạnh [peasant_character.GetHerHim] là đứa trẻ trông như [peasant_character.GetHerHis] [peasant_child.Custom('GetDaughterSon')], và ta không khỏi bàng hoàng trước tuổi của [peasant_child.GetHerHis]..."
  peasant_affair.2003.desc:0 "Cuối cùng thì! Khi [peasant_character.GetSheHe] đứng trước mặt ta, ta cảm thấy như khoảng thời gian chúng ta từng chia sẻ chưa bao giờ kết thúc. Nhìn vào nụ cười ấm áp của [peasant_character.GetHerHis], [peasant_character.GetSheHe] hẳn cũng chưa hề lãng quên ta."
  peasant_affair.2003.a_alive: "Xin [peasant_character.GetFirstNameNoTooltip], hãy ở lại [ROOT.Char.Custom('GetCourtType')|l]."
  peasant_affair.2003.a_dead: "Xin [peasant_child.GetFirstNameNoTooltip], hãy ở lại [ROOT.Char.Custom('GetCourtType')|l]."
  peasant_affair.2003.b:0 "[peasant_child.GetFirstNameNoTooltip], con yêu, cha muốn con gặp [peasant_character.GetMotherFather] của con."
  peasant_affair.2003.c:0 "Giờ ngươi đã ở đây... giữ chặt [peasant_character.GetWomanMan] đó!"
  peasant_affair.2003.c.tt:0 "#F Một [peasant_character.GetWomanMan] có quyền lực như vậy đối với ta không thể để đi tự do!#!"
  peasant_affair.2003.d:0 "Đuổi đứa trẻ đi!"
  peasant_affair.2003.d.tt:0 "#F Hãy quên hết rắc rối này đi.#!"
  peasant_affair.2003.e:0 "Thật là số phận tàn nhẫn!"
  peasant_affair.2003.f:0 "Đó là con ta phải không?! Lấy [peasant_child.GetHerHim] đi!"
  peasant_affair.2003.g:0 "Thả [peasant_character.GetHerHim] ngay lập tức! Ngươi tự do ra đi."

  peasant_affair.2004.desc_opening:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], chúng Ta không tìm thấy dấu vết của người nông dân mà ngài muốn. Rất có thể [peasant_character.GetSheHe] đã chết...\"\n\n"
  peasant_affair.2004.a:0 "Không bao giờ được thấy [peasant_character.GetHerHim] nữa... Thật đau khổ!"

  peasant_affair.3001.t:0 "Một Yêu Cầu Nhỏ"
  peasant_affair.3001.available_desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peasant_character'))] của ta, [peasant_character.GetFirstName], đã đến gặp ta với một điều mà [peasant_character.GetSheHe] nghĩ là một lời thỉnh cầu khiêm nhường.\n\n"Thưa người thương, người biết rõ [peasant_child.GetTitledFirstName] là giọt máu của người. Xin hãy công nhận [peasant_child.GetHerHim] là một phần trong huyết thống của người.""
  peasant_affair.3001.unavailable_desc:0 "\n\nPhải chăng [peasant_character.GetSheHe] không nhận ra rằng với việc ta đã có [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('other_spouse'))] là [other_spouse.GetTitledFirstName], mọi chuyện không hoàn toàn nằm trong tầm tay của ta sao?"
  peasant_affair.3001.a:0 "Ta sẽ công nhận [peasant_child.GetTitledFirstNameNoTooltip] là con máu mủ và dòng họ của ta."
  peasant_affair.3001.b: "Đứa trẻ có thể là máu mủ của ta, nhưng sẽ không mang họ của ta."
  peasant_affair.3001.c:0 "Chắc chắn, đứa con hoang đó là của ta."
  peasant_affair.3001.d:0 "Ta sẽ không bao giờ làm điều đó!"
  peasant_affair.3001.d.tt:0 "Ta làm rõ với [peasant_character.GetTitledFirstNameNoTooltip] rằng điều đó sẽ không bao giờ xảy ra."

  peasant_affair.3002.t:0 "Một Yêu Cầu Nhỏ"
  peasant_affair.3002.available_desc:0 "Người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peasant_character'))] [peasant_character.GetFirstName] đã đến gặp ta với điều mà [peasant_character.GetSheHe] cho là một yêu cầu khiêm tốn.\n\n\"Ngươi biết rõ như ta rằng [peasant_child.GetTitledFirstName] là con ta. Ta khẩn cầu, xin hãy để điều này được biết đến.\""
  peasant_affair.3002.unavailable_desc:0 "\n\nPhải chăng [peasant_character.GetSheHe] not nhận ra rằng với việc ta đã có [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('other_spouse'))] là [other_spouse.GetTitledFirstName], mọi chuyện đâu có đơn giản như vậy!"
  peasant_affair.3002.a:0 "Điều đúng đắn duy nhất là [peasant_child.GetSheHe] phải được biết về huyết thống của [peasant_child.GetHerHis]."
  peasant_affair.3002.b:0 "Không, ta không thể."

  peasant_affair.3003.t:0 "Một Kỷ Niệm"
  peasant_affair.3003.desc:0 "\"Chắc ngươi còn nhớ thời gian chúng ta bên nhau như ta vậy chứ?\" [peasant_character.GetTitledFirstName] gặp riêng ta ở hành lang. [peasant_character.GetSheHe|U] cúi gần để thì thầm vào tai ta. \"Những gì chúng ta có... ta không thể từ bỏ.\""
  peasant_affair.3003.a:0 "Ôi [ROOT.Char.GetFaith.HighGodName], cứu ta, làm sao ta có thể nói không?"
  peasant_affair.3003.b:0 "Nguy hiểm cho chúng ta nếu bị thấy cùng nhau!"

  peasant_affair.3004.t:0 "Một Cơ Hội"
  peasant_affair.3004.desc:0 "[peasant_character.GetTitledFirstName] trông suy tư khi [peasant_character.GetSheHe] [peasant_character.Custom('quirk_pos_present')]. \"Ngươi cần một [peasant_character.Custom('WifeHusband')],\" [peasant_character.GetSheHe] nói cuối cùng. \"Ta biết ta không quý tộc, nhưng hãy nghĩ về tất cả những gì chúng ta chia sẻ...\""
  peasant_affair.3004.a:0 "Chỉ có thể là ngươi mà thôi."
  peasant_affair.3004.b:0 "Chúng ta không thể cưới, nhưng không có nghĩa là không thể ở bên nhau."
  peasant_affair.3004.c:0 "Ngươi không thể là [peasant_character.Custom('WifeHusband')] của ta, nhưng ngươi thuộc về ta."
  peasant_affair.3004.d:0 "Hôn nhân không phải là lựa chọn."
