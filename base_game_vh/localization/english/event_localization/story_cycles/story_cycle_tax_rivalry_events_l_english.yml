l_english:
  tax_rivalry.t: "Máu và Vàng"

  tax_rivalry.0011.t: "$tax_rivalry.t$: Hòa Giải"
  tax_rivalry.0011.desc_intro: "[forgiven_rival.GetTitledFirstName|U] từ lâu là một gai bạc cản đường ta, nhưng có lẽ không phải lúc nào cũng phải như vậy."
  tax_rivalry.0011.desc_opinion: "Chúng ta thực ra chẳng còn thù ghét nhiều, và với một chút cố gắng, thậm chí có thể trở thành đồng minh quý giá nếu chúng ta chấm dứt mối hiềm khích này."
  tax_rivalry.0011.desc_compassion: "Ta không phải người thích cãi vã kéo dài, nhưng liệu ta có thể tin [forgiven_rival.GetHerHim] sẽ cởi mở như ta không?"
  tax_rivalry.0011.desc_unity: "Vì lợi ích của gia tộc, ta có thể hòa giải với [forgiven_rival.GetHerHim], ít nhất là trong đời sống công khai. Nhưng liệu [forgiven_rival.GetTitledFirstNameNoTooltip] có cảm thấy như vậy không?"
  tax_rivalry.0011.desc_fallback: "Ta có thể tiếp cận [forgiven_rival.GetHerHim] để hòa giải, nhưng ai biết liệu [forgiven_rival.GetSheHe] có chấp nhận cành ô liu của ta không?"
  tax_rivalry.0011.a: "Hãy xem [forgiven_rival.GetSheHe] nghĩ gì về ý tưởng của ta."
  tax_rivalry.0011.a.tt_ai: "Ta sẽ yêu cầu [forgiven_rival.GetTitledFirstNameNoTooltip] đặt qua một bên mối thù hận của chúng ta."
  tax_rivalry.0011.a.tt_player: "[forgiven_rival.GetTitledFirstNameNoTooltip|U] sẽ quyết định cách phản ứng cuối cùng."
  tax_rivalry.0011.a.failure: "[forgiven_rival.GetTitledFirstNameNoTooltip] khinh miệt đề nghị của ta"
  tax_rivalry.0011.b: "[forgiven_rival.GetTitledFirstNameNoTooltip|U] sẽ nếm mùi trả thù của ta!"
  tax_rivalry.0011.b.tt: "Mối hiềm khích cay đắng của chúng ta sẽ tái diễn."

  tax_rivalry.0012.desc_intro_unfriendly: "Dù thường thì ta gạt bỏ bất cứ nhắc nhở nào về [forgiving_rival.GetTitledFirstName], nhưng một tâm trạng nào đó đã khiến ta chấp nhận chuyến ghé thăm đột ngột của [forgiving_rival.GetHerHis] tới sân của ta."
  tax_rivalry.0012.desc_intro_friendly: "Dù [forgiving_rival.GetTitledFirstName] và ta không thân thiết từ khi tranh chấp bắt đầu, nhưng ta vẫn trân trọng chuyến ghé thăm bất ngờ của [forgiving_rival.GetHerHis] tới sân của ta."
  tax_rivalry.0012.desc_outro: "Tại đó chúng ta đã dùng bữa trong tiết trời đẹp đến lạ kỳ cho đến khi [forgiving_rival.GetSheHe] hắng giọng của [forgiving_rival.GetHerHis]:\n\n"Nếu chúng ta không vướng vào cuộc tranh chấp này, thì có lẽ chúng ta đã có thể tận hiện thêm nhiều buổi chiều như thế này rồi. Vậy nên ngài sẽ tha thứ cho sự ngu xuẩn trong quá khứ của ta chứ, [ROOT.Char.GetTitledFirstNameNoTooltip]?""
  tax_rivalry.0012.a: "Nếu ngươi cũng tha thứ cho lỗi lầm của ta."
  tax_rivalry.0012.b: "Các Bạn Bè, hộ tống [forgiving_rival.GetTitledFirstNameNoTooltip] ra cửa."

  tax_rivalry.0013.desc_intro: "[forgiven_rival.GetTitledFirstName|U] đã đồng ý với đề xuất của ta, và từ hôm nay các tranh chấp tài chính của chúng ta là quá khứ."
  tax_rivalry.0013.desc_outro_neutral: "Hy vọng rằng quá khứ cay đắng sẽ không ảnh hưởng đến quan hệ của chúng ta trong tương lai..."
  tax_rivalry.0013.desc_outro_vengeful: "Dù sao, sẽ còn nhiều cơ hội khác để trừng phạt [forgiven_rival.GetHerHim] mà không để [forgiven_rival.GetHerHis] hay biết..."
  tax_rivalry.0013.a: "Chỉ có thể hy vọng thôi."

  tax_rivalry.0014.desc: "Dường như, vì lợi ích của vương quốc, [forgiven_rival.Custom2('MyCharacterIntroduction', ROOT.Char)] và [forgiving_rival.Custom2('MyCharacterIntroduction', ROOT.Char)] đã gác lại tranh chấp nhỏ nhặt. Chỉ thời gian mới nói được liệu ngọn lửa còn sót lại có bùng lên lần nữa hay không."
  tax_rivalry.0014.a: "Chúng ta sẽ chờ xem."

  tax_rivalry.1000.t: "$tax_rivalry.t$: Điểm Mù"
  tax_rivalry.1000.desc: "[steward.GetTitledFirstNamePossessive|U] và [tax_collector.GetTitledFirstNamePossessive] cãi vã đã gây tổn hại cho tài chính của vương quốc. Không ai muốn liên lạc với ai, dẫn đến việc thanh toán bị bỏ qua, sai vị trí, thậm chí mất mát.\n\nKhi ta cau mày vì việc này, ta thấy rõ các đóng góp của họ cho vương quốc. Thật dễ dàng để 'mất' số tiền này và đổ lỗi cho nhau..."
  tax_rivalry.1000.b: "Ta nên mắng họ vì sơ suất này."
  tax_rivalry.1000.b.tt: "Ta ra lệnh cho [steward.GetTitledFirstNameNoTooltip] và [tax_collector.GetTitledFirstNameNoTooltip] chấm dứt mối hiềm khích."

  tax_rivalry.1001.desc: "Số thuế nộp cho [liege.Custom2('MyCharacterIntroduction', ROOT.Char)] đã biến mất đúng lúc [other_rival.Custom2('MyCharacterIntroduction', ROOT.Char)] thanh toán cho [other_rival.GetHersHis]!\n\nKhông có bằng chứng khác, ta chỉ có thể cho rằng đây là mưu đồ của [other_rival.GetTitledFirstNamePossessiveNoTooltip] nhằm bôi nhọ danh tiếng và kho bạc của ta."
  tax_rivalry.1001.a: "Tên [other_rival.Custom2('InsultNoun', ROOT.Char)] đó!"

  tax_rivalry.1002.desc: "\"Hai ngươi đang trở nên cẩu thả,\" [liege.Custom2('MyCharacterIntroduction', ROOT.Char)] đẩy một túi vàng về phía chúng ta. \"Ta đã phải suy nghĩ xem có dễ dàng lấy đóng góp của các ngươi và đổ lỗi cho người kia không, vì các ngươi quá ít liên lạc. Hãy chấm dứt những tranh chấp nhỏ nhặt này.\"\n\n[liege.GetSheHe|U] cầm túi và bỏ vào túi, nhìn chúng ta nghiêm nghị."
  tax_rivalry.1002.a: "Sẽ không để xảy ra lần nữa."

  tax_rivalry.3001.t: "$tax_rivalry.t$: Dân Quần Chúng"
  tax_rivalry.3001.desc_intro: "Khi ta đang suy nghĩ về bất bình với [sabotaged_rival.GetTitledFirstNameNoTooltip], một kế hoạch nham hiểm lóe lên. Chỉ với chút hối lộ, ta có thể thuyết phục dân chúng [sabotaged_county.GetNameNoTierNoTooltip] rằng [sabotaged_rival.GetTitledFirstNameNoTooltip] định tăng thuế gấp năm lần và kích động nổi loạn chống lại chúa [liege.GetTitledFirstName]."
  tax_rivalry.3001.desc_outro_assigned: "Tất nhiên, lỗi sẽ rơi vào tên [sabotaged_rival.Custom2('InsultNoun', ROOT.Char)] vì quản lý tồi huyện."
  tax_rivalry.3001.desc_outro_fallback: "Dù [sabotaged_rival.GetTitledFirstNameNoTooltip] thực sự không quản huyện, thiệt hại sẽ xảy ra."
  tax_rivalry.3001.a: "Gọi người đưa tin."
  tax_rivalry.3001.a.tt: "Một [peasant_faction|E] sẽ nổi dậy chống lại chúa của ngươi tại [sabotaged_county.GetNameNoTierNoTooltip]"
  tax_rivalry.3001.b: "Bảo vệ vị trí của ta quan trọng hơn."

  tax_rivalry.3002.desc: "Tên [saboteur.Custom2('InsultNoun', ROOT.Char)] bẩn thỉu! [saboteur.Custom2('MyCharacterIntroduction', ROOT.Char)|U] lan truyền thông tin sai rằng ta tăng thuế tại [sabotaged_county.GetName]. Giờ đây một đám đông đã nổi lên chống lại chúa ta, và không lời nào có thể xoa dịu [liege.GetHerHis] giận dữ."
  tax_rivalry.3002.a: "Tất cả là lỗi của [saboteur.GetTitledFirstNamePossessiveNoTooltip]!"

  tax_rivalry.3003.desc: "Ôi trò ngớ ngẩn... giờ [sabotaged_county.GetName] đã hình thành một đám dân chống lại danh tiếng của ta, chỉ vì họ tin rằng [sabotaged_rival.GetTitledFirstName] sẽ tăng thuế!\n\n[sabotaged_rival.GetTitledFirstNameNoTooltip|U] đổ lỗi cho [saboteur.GetTitledFirstName], nhưng rõ ràng một điều: mối hiềm khích giữa họ đang nhanh chóng vượt ngoài tầm kiểm soát."
  tax_rivalry.3003.a: "Chuẩn bị chiến đấu!"
  tax_rivalry.3003.a.tt: "Một [peasant_faction|E] sẽ nổi dậy chống lại ngươi tại [sabotaged_county.GetNameNoTierNoTooltip]"

  tax_rivalry.4000.t: "$tax_rivalry.t$: Gia Tộc Rạn Nứt"
  tax_rivalry_liege_notification_desc: "Điều này xảy ra vì mối hiềm khích giữa [steward.GetShortUIName] và [tax_collector.GetShortUIName]."
  tax_rivalry_steward_notification_desc: "Điều này xảy ra vì mối hiềm khích giữa ngươi và [tax_collector.GetShortUIName]."
  tax_rivalry_tax_collector_notification_desc: "Điều này xảy ra vì mối hiềm khích giữa ngươi và [steward.GetShortUIName]."
 
  tax_rivalry.4010.t: "$tax_rivalry.t$: Mối Thù Cay Đắng"
  tax_rivalry.4010.desc_liege_friendly: "Điều này xảy ra bất chấp quan hệ tốt giữa hai bên."
  tax_rivalry.4010.desc_liege_unfriendly: "Điều này xảy ra vì quan hệ kém giữa hai bên."
  tax_rivalry.4010.desc_steward_friendly: "Điều này xảy ra bất chấp quan hệ tốt của ta với [tax_collector.GetHerHim]."
  tax_rivalry.4010.desc_steward_unfriendly: "Điều này xảy ra vì quan hệ xấu của ta với [tax_collector.GetHerHim]."
  tax_rivalry.4010.desc_tax_collector_friendly: "Điều này xảy ra bất chấp quan hệ tốt của ta với [steward.GetHerHim]."
  tax_rivalry.4010.desc_tax_collector_unfriendly: "Điều này xảy ra vì quan hệ xấu của ta với [steward.GetHerHim]."

  tax_rivalry.4011.t: "$tax_rivalry.t$: Hàn Gắn Quan Hệ"
  tax_rivalry.4011.desc_liege_friendly: "Điều này xảy ra nhờ quan hệ tốt giữa hai bên."
  tax_rivalry.4011.desc_liege_unfriendly: "Điều này xảy ra bất chấp quan hệ xấu giữa hai bên."
  tax_rivalry.4011.desc_steward_friendly: "Điều này xảy ra nhờ quan hệ tốt của ta với [tax_collector.GetHerHim]."
  tax_rivalry.4011.desc_steward_unfriendly: "Điều này xảy ra bất chấp quan hệ xấu của ta với [tax_collector.GetHerHim]."
  tax_rivalry.4011.desc_tax_collector_friendly: "Điều này xảy ra nhờ quan hệ tốt của ta với [steward.GetHerHim]."
  tax_rivalry.4011.desc_tax_collector_unfriendly: "Điều này xảy ra bất chấp quan hệ xấu của ta với [steward.GetHerHim]."

  tax_rivalry.9000.t: "$tax_rivalry.t$: Chiến Thắng"
  tax_rivalry.9000.desc: "Ta không còn phải chịu đựng [less_fortunate_rival.Custom('quirk_neg_noun')] của [less_fortunate_rival.GetTitledFirstName]. Giờ đây ta là [ROOT.Char.Custom('MistressMaster')] của miền đất của mình, và [less_fortunate_rival.GetTitledFirstNameNoTooltip] sẽ nhận một bài học mạnh hơn nếu [less_fortunate_rival.GetSheHe] dám phá rối triều đại của ta lần nữa."
  tax_rivalry.9000.a: "Thật tốt khi được là [ROOT.Char.GetTitleAsNameNoTooltip]."
  tax_rivalry.9000.a.tt: "Mối thù với [less_fortunate_rival.GetTitledFirstNameNoTooltip] kết thúc, ít nhất là bây giờ."

  tax_rivalry.9001.t: "$tax_rivalry.t$: Thất Bại"
  tax_rivalry.9001.desc: "Làm sao ta có thể ngờ [fortunate_rival.GetFullName] sẽ trở thành [fortunate_rival.GetTitleAsNameNoTooltip] của [fortunate_rival.GetPrimaryTitle.GetNameNoTierNoTooltip]? Giá mà ta hành động sớm hơn, có lẽ số phận ta đã không bị định đoạt như thế này!"
  tax_rivalry.9001.a_spurned: "Chưa kết thúc đâu!"
  tax_rivalry.9001.a_neutral: "Một chương mới bắt đầu..."
  tax_rivalry.9001.a.tt: "Mối thù với [fortunate_rival.GetTitledFirstNameNoTooltip] kết thúc, ít nhất là bây giờ."
