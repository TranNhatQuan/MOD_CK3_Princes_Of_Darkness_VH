l_english:
  start_hunt_mystical_animal_story_cycle_effect.tt:1 "#EMP Ta sẽ không nghỉ cho đến khi tìm thấy nó!#!"

  hunt_mystical_animal.1001.t:1 "[ROOT.Char.Custom('GetLegendaryColor')|U] [ROOT.Char.Custom('GetAnimalType')|U]"
  hunt_mystical_animal.1001.desc:1 "Sinh vật khó nắm bắt hiện về với ta trong giấc mơ, ánh mắt sâu thẳm của nó như xét đoán Ta khi nó [ROOT.Char.Custom('GetAnimalChargePresent')] xung quanh, khoe bộ lông [ROOT.Char.Custom('GetLegendaryColor')] nguyên vẹn.\n\nChúng Ta đứng giữa [legendary_county.GetCountyData.GetCapital.Custom('GetTerrainTypePlural')] yên lặng dưới ánh trăng tròn. Dù cố gắng thế nào, Ta cũng không thể tiến gần con mồi.\n\nKhi tự cào mình tỉnh dậy, Ta cảm nhận quyết tâm trong lòng ngày càng cứng cỏi..."
  hunt_mystical_animal.1001.a:0 "Nó sẽ không trốn Ta được lâu nữa!"

  hunt_mystical_animal.1002.desc:1 "Cưỡi qua [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] của [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip], chúng Ta gặp một khúc quanh và Ta lại thấy nó, lấp lánh dưới ánh nắng — [ROOT.Char.Custom('GetLegendaryColor')] [ROOT.Char.Custom('GetAnimalType')].\n\nTa quay lại để báo cho những người khác, nhưng khi nhìn lại thì [ROOT.Char.Custom('GetAnimalType')] đã biến mất..."
  hunt_mystical_animal.1002.a:0 "Nó đang trêu Ta!"

  hunt_mystical_animal.1003.desc:1 "Kể từ khi bắt đầu tìm kiếm, những báo cáo về việc nhìn thấy [ROOT.Char.Custom('GetLegendaryColor')] [ROOT.Char.Custom('GetAnimalType')] đã đến từ khắp [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\nPhân tích các báo cáo và phân biệt thật giả là một nhiệm vụ khổng lồ. Giá mà các báo cáo đáng tin hơn..."
  hunt_mystical_animal.1003.a:0 "Ta sẽ thuê người tìm nó!"
  hunt_mystical_animal.1003.b:0 "Nhiệm vụ quá lớn. Ta sẽ không làm."
  hunt_mystical_animal.1003.b.tt:2 "Bỏ cuộc truy tìm #V [THIS.Char.Custom('GetLegendaryColor')] [THIS.Char.Custom('GetAnimalType')]#!"
  hunt_mystical_animal.1003.c:0 "[steward.GetCouncilTitle] của Ta sẽ lo việc này."
  hunt_mystical_animal.1003.d:0 "Ta có thể làm được. Ta #EMP phải#!!"
  hunt_mystical_animal.1003.e:0 "[m_hunt.GetTitledFirstNameNoTooltip], tổ chức một đội săn!"

  hunt_mystical_animal.1004.desc:1 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [m_hunt.GetTitledFirstName] hầu như không kiềm chế được, \"Chúng ta có báo cáo thấy [ROOT.Char.Custom('GetLegendaryColor')] [ROOT.Char.Custom('GetAnimalType')] ở [legendary_county.GetCountyData.GetCapital.Custom('GetTerrainTypePlural')] của [legendary_county.GetCountyData.GetCapital.GetNameNoTooltip]!\"\n\n\"Một số cho rằng nó mang bệnh tật, người khác nói nó mang lại phồn vinh, nhưng tất cả dường như chắc chắn nó ở trong khu vực.\"\n\nNó ở đây sao? Ở [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]?!"
  hunt_mystical_animal.1004.a:0 "Chúng ta cưỡi đi!"
  hunt_mystical_animal.1004.a.tt:0 "Lần này nó sẽ không trốn Ta."
  hunt_mystical_animal.1004.a.success:0 "Ngài tìm thấy #V [THIS.Char.Custom('GetLegendaryColor')] [THIS.Char.Custom('GetAnimalType')]#!"
  hunt_mystical_animal.1004.b:0 "Ta sẽ không để nó điều khiển ta như vậy."

  hunt_mystical_animal.1005.desc:1 "\n\nChớp mắt, [activity.Custom('GetAnimalType')] [activity.Custom('GetAnimalChargePresent')] biến mất vào [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]: mất hút nhanh như khi xuất hiện."
  hunt_mystical_animal.1005.a:1 "Đồ quỷ! Ta #EMP sẽ# bắt được ngươi, thú vật!"

  hunt_mystical_animal.1006.desc: "Ta nhìn ra buổi sáng sương mù và thấy [ROOT.Char.Custom('GetLegendaryColor')] [ROOT.Char.Custom('GetAnimalType')] ngồi ở ranh giới [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')], #EMP trêu chọc#! Ta.\n\nQuay đi, Ta đối mặt với tấm vải trên giường và khi cố gắng rút ra, vấp phải đầu [ROOT.Char.Custom('GetAnimalType')] treo trên xà nhà.\n\nTa nhắm mắt, nhưng không có đường thoát. [ROOT.Char.Custom('GetLegendaryColor')] [ROOT.Char.Custom('GetAnimalType')] ở đó – cười nhạo Ta!"
  hunt_mystical_animal.1006.a:1 "TA SẼ BẮT NGƯƠI, THÚ VẬT!"
  hunt_mystical_animal.1006.b:1 "Ngươi! Ngươi giờ là [ROOT.Char.Custom('GetLegendaryColor')] [ROOT.Char.Custom('GetAnimalType')]! Quay lại đây!"

  hunt_mystical_animal.1007.desc:2 "Ta đi khắp vùng để tìm [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')] khó nắm bắt, xé toang vùng hoang dã [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] — lần này Ta sẽ không để nó thoát!\n\nKhi theo dấu vết vào [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTree')], càng sâu vào cây cối, mọi thứ bắt đầu biến dạng.\n\nTa thấy nấm to bằng [ROOT.Char.Custom('ResidenceBuildingPlural')], cây nhỏ như chuột, và sâu bướm to như ngựa."
  hunt_mystical_animal.1007.a:0 "Dù ngươi chui vào lỗ nào, ta cũng sẽ tìm ra!"
  hunt_mystical_animal.1007.b:0 "Ôi, những cây nấm này... Trông ngon ghê."
  hunt_mystical_animal.1007.b.success:0 "Ngon!"
  hunt_mystical_animal.1007.b.failure:0 "Ái chà, Ta cảm thấy hơi buồn nôn..."

  hunt_mystical_animal.1008.desc:1 "Những ngày trôi qua, Ta không nghe gì về [ROOT.Char.Custom('GetLegendaryColor')] [ROOT.Char.Custom('GetAnimalType')], và Ta trở nên bồn chồn...\n\nChắc chắn ai đó phải nhìn thấy nó? Còn tất cả nông dân quanh [legendary_county.GetCountyData.GetCapital.Custom('GetTerrainTypePlural')] thì sao? Có lẽ Ta nên nhờ họ giúp..."
  hunt_mystical_animal.1008.a:0 "Gửi thông điệp!"
  hunt_mystical_animal.1008.b:0 "Ta sẽ không hạ mình đến mức đó."
  hunt_mystical_animal.1008.c:0 "Ta sẽ sai [knight.GetFirstNameNoTooltip]."

  hunt_mystical_animal.1009.desc:1 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], việc tìm kiếm một con thú như này... Ta phải thừa nhận là lo lắng.\"\n\n[court_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến đến khi Ta sàng lọc các báo cáo nhìn thấy [ROOT.Char.Custom('GetLegendaryColor')] [ROOT.Char.Custom('GetAnimalType')].\n\n\"Rõ ràng bất cứ điều gì thu hút nhiều sự chú ý như thế có thể do [ROOT.Char.GetFaith.DevilName] gửi; đừng coi sự tồn tại của nó là dấu hiệu từ [ROOT.Char.GetFaith.HighGodNameAlternate]!\""
  hunt_mystical_animal.1009.a:1 "[ROOT.Char.Custom('GetAnimalType')] là sứ giả từ [ROOT.Char.GetFaith.HighGodName]!"
  hunt_mystical_animal.1009.a.success:0 "\"Ngươi có thể đúng...\""
  hunt_mystical_animal.1009.a.failure:0 "\"Ngươi nói gì vậy?!\""
  hunt_mystical_animal.1009.b:0 "Không phải chuyện của ngươi."
  hunt_mystical_animal.1009.c:0 "Ngươi nói đúng, ta đã nghĩ gì vậy?"

  hunt_mystical_animal.9001.desc:2 "Ta theo dấu càng sâu vào [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] của [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] khi bỗng không khí xung quanh Ta trở nên im lặng.\n\nNhư sinh ra từ chính không khí, [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')] đứng trước mặt Ta, lông óng ánh dưới nắng, mắt sâu như giấc mơ. Ta giương cung..."
  hunt_mystical_animal.9001.a:1 "... và thả mũi tên."

  hunt_mystical_animal.9002.desc:2 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [m_hunt.GetTitledFirstName] e dè nói, \"Một nông dân địa phương đã gửi quà cho ngài. [dummy_gender.GetSheHe|U] cho rằng màu sắc [activity.Custom('GetLegendaryColor')] này là tự nhiên, nhưng Ta chưa bao giờ thấy thứ gì như vậy!\"\n\nVới nỗi lo lắng dâng lên, Ta tiến đến bó — và ở đó: [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')] mà Ta đã dành nhiều năm săn lùng."
  hunt_mystical_animal.9002.a:0 "Chắc chắn phải là trò đùa...!"
