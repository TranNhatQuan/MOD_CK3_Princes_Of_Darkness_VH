l_english:

  SITUATION_LIST_STORY_CYCLE_MODIFIERS_HEADER: "Hiệu ứng tác động"
  SITUATION_LIST_STORY_CYCLE_DECISIONS_HEADER: "Quyết sách khả thi"

  not_yet_chosen: "chưa được chọn"
  story_cycle_pet_dog: "Chó Cưng"
  story_cycle_pet_dog_desc: "#F Một người bạn đồng hành trung thành luôn sát cánh bên Ngài, mang lại sự bảo vệ và một mối liên kết tận tụy mà ít người có thể sánh được.#!"
  DOG_INFORMATION_STRING: "Chú chó của ngài tên là #V [Story.Custom('DogStoryNameAll')].#!\n[Story.Custom('DogStoryHerHisAll')|U] bộ lông màu [Story.Custom('DogFurColorAll')], đôi mắt của [Story.Custom('DogStoryHerHisAll')] màu [Story.Custom('DogEyeColorAll')], và [Story.Custom('DogStorySheHeAll')] hiện đang ở tuổi [Story.Custom('DogStoryPuppyOrAgeAll')].\n[Story.Custom('DogStorySheHeAll')|U] là một đứa [Story.Custom('DogStoryGirlBoyAll')] rất ngoan."
  dog_age_puppy: "một chú chó con"
  dog_age_proper: "[Story.MakeScope.Var('dog_age_variable').GetValue|0] tuổi"
  cat_age_kitten: "một chú mèo con"
  cat_age_proper: "[Story.MakeScope.Var('cat_age_variable').GetValue|0] tuổi"
  story_cycle_pet_cat: "Mèo Cưng"
  story_cycle_pet_cat_desc: "#F Một chú mèo kiêu hãnh bầu bạn với Ngài, một thợ săn nhanh nhẹn chỉ trao đi tình cảm theo cách riêng của nó.#!"
  CAT_INFORMATION_STRING: "Mèo của ngài tên là #V [Story.Custom('CatStoryNameAll')].#!\n[Story.Custom('CatStoryHerHisAll')|U] bộ lông màu [Story.Custom('CatFurColorAll')], đôi mắt của [Story.Custom('CatStoryHerHisAll')] màu [Story.Custom('CatEyeColorAll')], và [Story.Custom('CatStorySheHeAll')] hiện đang ở tuổi [Story.Custom('CatStoryKittenOrAgeAll')].[Story.Custom('CatStupidOrNotStupidAll')]"
  dumb_but_sweet_orange_boy: "\n[Story.Custom('CatStorySheHeAll')|U] là một chú [Story.Custom('CatStoryGirlBoyAll')] màu [Story.Custom('CatFurColorAll')] hơi ngốc nghếch, nhưng rất ngọt ngào."
  story_cycle_pet_eagle: "Đại Bàng Săn"
  story_cycle_pet_eagle_desc: "#F Trên găng tay Ngài là một con đại bàng săn, luôn cảnh giác, luôn đói khát, mang đến cái chết từ trên cao.#!"
  EAGLE_INFORMATION_STRING: "Tên con đại bàng của Ngài là #V [Story.Custom('EagleStoryNameAll')].#!\n[Story.Custom('EagleStorySheHeAll')|U] hiện được [Story.MakeScope.Var('eagle_age_variable').GetValue|0] tuổi."
  bp2_hostage_loyalty: "Con Tin Trung Thành"
  bp2_hostage_loyalty_desc: "Một trong những [hostages|E] của Ngài đang bắt đầu có cảm tình với Ngài và cách sống của Ngài."
  hostage: "[hostage|E]"
  HOSTAGE_STORY_PRACTICAL_INFORMATION_STRING: "[hostage|E] của Ngài, [Story.MakeScope.Var('hostage_target').Char.GetUIName], đang lớn lên tại [court|E] của Ngài, điều này ảnh hưởng đến lòng trung thành của [Story.MakeScope.Var('hostage_target').Char.GetHerHis]. Hãy giữ [opinion|E] của [Story.MakeScope.Var('hostage_target').Char.GetHerHis] ở mức cao và chọn các phương án đúng trong sự kiện để giúp [Story.MakeScope.Var('hostage_target').Char.GetHerHim] có khả năng trung thành hơn khi [Story.MakeScope.Var('hostage_target').Char.GetSheHe] trưởng thành.\n\nLòng trung thành hiện tại: [Story.MakeScope.Var('theon_points').GetValue|0+]"
  LOYALTY_LABEL: "Điểm Trung Thành"
  claimant: "[claimant|E]"
  diverted_crusaders: "Thập Tự Quân Chệch Hướng"
  frankokratia_story: "Frankokratia"
  frankokratia_story_desc: "Một kẻ đòi ngôi [GetTitleByKey('e_byzantium').GetName|l] đã dụ dỗ những kẻ cơ hội phương Tây rời bỏ cuộc thập tự chinh, hướng những thanh kiếm tham lam vào ngay trái tim của Kitô giáo..."
  FRANKOKRATIA_STORY_PRACTICAL_INFORMATION_STRING: "Một cuộc [war|E] chống lại [GetTitleByKey('e_byzantium').GetHolder.GetShortUIName] sẽ quyết định tương lai của [GetTitleByKey('e_byzantium').GetName|l]. Hoặc [claimant|E] [Story.MakeScope.Var('byz_claimant').Char.GetUIName] sẽ chiếm lấy ngai vàng và trả công cho quân thập tự — hoặc một [GetTitleByKey('e_latin_empire').GetBaseName] mới sẽ được thiết lập dưới sự cai trị của [GetFaithByKey('catholic').GetAdjective]."
  story_conqueror: "Kẻ Chinh Phục"
  story_conqueror_desc: "Tham vọng của Ngài là không giới hạn! Thế giới nằm dưới chân Ngài, sẵn sàng để được thu phục."
  CONQUEROR_STORY_PRACTICAL_INFORMATION_STRING: "Những Kẻ Chinh Phục nhận được nhiều phần thưởng mạnh mẽ, như giảm tỉ lệ hình thành [factions|E], quyền sử dụng [vassalize_casus_belli|E], và đôi khi là các sự kiện đặc biệt đầy quyền năng.\n\nNgài sẽ mất tư cách Kẻ Chinh Phục nếu:\n$BULLET_WITH_TAB$Ngài không còn [independent|E]\n$BULLET_WITH_TAB$Tước hiệu bị giảm xuống cấp [count|E]\n$BULLET_WITH_TAB$Ngài trở thành kẻ [unlanded|E]\n$BULLET_WITH_TAB$Ngài không tham chiến trong #V 10#! năm\n$BULLET_WITH_TAB$Ngài lâm vào cảnh nợ nần chồng chất [debt|E]\n$BULLET_WITH_TAB$Ngài thua từ #V 3#! cuộc [wars|E] trở lên\n$BULLET_WITH_TAB$Ngài mắc đặc điểm [GetTrait('incapable').GetName( GetNullCharacter )]"
  story_destiny_child: "Đứa Trẻ Định Mệnh"
  story_destiny_child_desc: "Một đứa trẻ với triển vọng lớn lao đã chào đời, như thể được chính định mệnh lựa chọn."
  DESTINY_CHILD_STORY_PRACTICAL_INFORMATION_STRING: "Hiếm khi trên đời mới có một đứa trẻ mang thiên mệnh vĩ đại được sinh ra. Chúng phát triển nhanh hơn bình thường và đạt đến những tầm cao mà kẻ khác chẳng thể chạm tới.\n\nHãy chăm sóc thật tốt cho [Story.MakeScope.Var('destiny_child').Char.GetUIName], và cân nhắc việc đưa [Story.MakeScope.Var('destiny_child').Char.GetHerHim] trở thành [player_heir|E] của ngài — ví dụ như bằng cách sắc phong [Story.MakeScope.Var('destiny_child').Char.GetHerHim] làm [designated_heir|E] của ngài."
  CHILD_OF_DESTINY: "Thiên Tử Định Mệnh"
  story_cycle_martial_lifestyle_warhorse: "Chiến Mã"
  story_cycle_martial_lifestyle_warhorse_desc: "Ngài đang sở hữu một con chiến mã được huấn luyện tinh nhuệ bậc nhất. Nguyện cho quân thù phải run rẩy khi đối mặt với cú tông mãnh liệt của ngài."
  WARHORSE_STORY_PRACTICAL_INFORMATION_STRING: "Chiến mã của ngài tên là #V [Story.Custom('WarhorseStoryNameAll')]#!. [Story.Custom('HorseStorySheHeAll')|U] là một con [Story.Custom('HorseStoryMareStallionAll')]."
  DOPPELGANGER: "Kẻ [Glossary( 'Doppelgänger', 'DOPPELGANGER_GLOSS' )] của ngài"
  story_doppelganger: "Soi bóng bùn lầy"
  DOPPELGANGER_GLOSS: "Một kẻ có dung mạo giống hệt một người đang sống, thường tình cờ gặp mặt. Trong dân gian, đây là một điềm gở — nhìn thấy bản sao của chính mình thường báo hiệu bệnh tật hoặc cái chết cận kề."
  story_doppelganger_desc: "Một tên tá điền có diện mạo giống hệt ngài đã được tìm thấy — một kẻ [Glossary( 'doppelgänger', 'DOPPELGANGER_GLOSS' )] đích thực..."
  DOPPELGANGER_STORY_PRACTICAL_INFORMATION_STRING: "Một tên tá điền có ngoại hình và giọng điệu giống hệt ngài có thể là một cơ hội... hoặc là một lời nguyền. Hiện tại, [Story.MakeScope.Var('doppelganger_character').Char.GetUIName] đang cư ngụ tại [court|E] của ngài."
  story_cycle_hunt_mystical_animal: "Cuộc săn Linh thú"
  story_cycle_hunt_mystical_animal_desc: "Trong một chuyến đi săn, ngài đã thoáng thấy một linh thú trắng muốt. Thu phục được nó chẳng khác nào tìm thấy Chén Thánh!"
  WHITE_ANIMAL_INFORMATION_STRING: "Ngài đang lần theo dấu vết của một con #V [Story.MakeScope.Var('animal_type').GetFlagName|U] Trắng#!.\n\nBắt được nó sẽ mang lại phần thưởng lớn — nhưng ngài sẽ bị tăng [stress|E] mỗi khi con [Story.MakeScope.Var('animal_type').GetFlagName] trốn thoát khỏi ngài. Thỉnh thoảng, một điềm báo [GetModifier('hunt_sighting_legendary_modifier').GetNameWithTooltip] sẽ cho phép ngài tiếp tục cuộc đi săn.\n\nSố lần chạm trán [Story.MakeScope.Var('animal_type').GetFlagName] Trắng: [Story.MakeScope.Var('encounters').GetValue|0V] #weak (tính từ lần đầu tiên)#!"
  LEGENDARY_COUNTY_LABEL: "Nơi trú ngụ của [Story.MakeScope.Var('animal_type').GetFlagName|U] Trắng"
  story_sycophant: "Kẻ Nịnh Thần"
  story_sycophant_desc: "Một kẻ trong triều, với thói nịnh hót lộ liễu, đang khiến các phong thần phẫn nộ chỉ bởi sự hiện diện của hắn."
  SYCOPHANT_INFORMATION_STRING: "[Story.GetOwner.Custom2( 'RelationToMeShort', Story.MakeScope.Var('sycophant_character').Char )] [Story.MakeScope.Var('sycophant_character').Char.GetShortUIName] và [Story.GetOwner.Custom2( 'RelationToMeShort', Story.MakeScope.Var('jealous_character').Char )] [Story.MakeScope.Var('jealous_character').Char.GetShortUIName] của ta đang đối đầu gay gắt. Ta có thể chọn thiên vị một người, nhưng chắc chắn sẽ làm kẻ kia phật ý. Thời gian sẽ trả lời cục diện này đi về đâu..."
  SYCOPHANT_LABEL: "Kẻ Nịnh Thần"
  JEALOUS_VASSAL_LABEL: "Phong thần đố kỵ nhất của ta"
  story_cycle_pet_rock: "Đá Cảnh"
  story_cycle_pet_rock_desc: "Bên cạnh ngài là một hòn đá cảnh, vẻ mặt bất biến của nó lại hòa hợp lạ kỳ với phong thái đồng hành đặc biệt của ngài."
  PET_ROCK_INFORMATION_STRING: "Hòn đá của ngài tên là #V [Story.GetOwner.Custom('RockStoryName')].#!\nBề ngoài gồ ghề của [Story.GetOwner.Custom('RockStoryHerHis')|U] có màu [Story.GetOwner.Custom('RockColor')]."
  story_cycle_admin_eunuch: "Hoạn Quan Ưu Tú"
  story_cycle_admin_eunuch_desc: "Một hoạn quan với tài năng xuất chúng đã tìm đường vào triều đình của ngài. Là một cơ hội, hay là một hiểm họa..?"
  EUNUCH_INFORMATION_STRING: "Theo thời gian, ngài sẽ có cơ hội ban cho [Story.MakeScope.Var('eunuch').Char.GetShortUIName] quyền lực và tầm ảnh hưởng lớn hơn. Làm như vậy sẽ tăng cường sức mạnh cho [modifier|E] [GetModifier('admin_eunuch_liege_4_modifier').GetNameWithTooltip].\n\nNhưng hãy cẩn thận — hắt hủi [Story.MakeScope.Var('eunuch').Char.GetHerHim], hoặc ban cho [Story.MakeScope.Var('eunuch').Char.GetHerHim] #EMP quá nhiều#! quyền lực mà không bảo đảm lòng trung thành của [Story.MakeScope.Var('eunuch').Char.GetHerHis], hậu quả có thể sẽ rất thảm khốc...\n\nNgài đã từ chối thỉnh cầu của [Story.MakeScope.Var('eunuch').Char.GetHerHis] [Story.MakeScope.Var('eunuch_refusals').GetValue|0V] lần tính đến nay."
  EUNUCH_LABEL: "Hoạn Quan"
  UPSET_COURTIERS: "Thần tử bất mãn với Hoạn quan"
  POETRY_BOOK_LABEL: "Thi Tập của Ta"
  commission_epic_story: "Biên soạn Sử thi"
  commission_epic_story_desc: "Ngài đang hạ lệnh biên soạn một bản sử thi vĩ đại để ghi danh công trạng của gia tộc ngài."
  EPIC_INFORMATION_STRING: "[Story.GetOwner.Custom('CommissionEpicScribe')][AddTextIf(Story.MakeScope.Var('composer').IsSet, Concatenate(Concatenate(', ', Story.MakeScope.Var('composer').Char.GetShortUIName), ','))] của ngài đang biên soạn một bản [Story.Custom('CompositionTypeAll')] để gia tăng [dynasty_prestige|E] cho [dynasty|E] [Story.GetOwner.GetDynasty.GetName] và tạo nên một [artifact|E].\n\nTỉ lệ tạo ra một bản [Story.Custom('CompositionTypeAll')] kiệt tác là: [Story.MakeScope.Var('final_outcome_chance').GetValue|0+/%]"
  COMPOSER: "Người biên soạn Sử thi"
  story_foreign_raised_reformer: "Kẻ Duy Tân Ngoại Bang"
  story_foreign_raised_reformer_desc: "Ngài được nuôi dưỡng xa rời mảnh đất mà ngài gọi là quê hương.\nThật khác biệt... nhưng nếu quê nhà cũng giống như nơi ấy thì sao?"
  REFORMER_INFORMATION_STRING: "Ngài được nuôi dưỡng tại [Story.MakeScope.Var('advanced_realm').Title.GetBaseName] bởi [Story.MakeScope.Var('foreign_educator').Char.GetShortUIName], một tín đồ [Story.MakeScope.Var('advanced_culture_faith').Faith.GetAdjective] thuộc nền văn hóa [Story.MakeScope.Var('advanced_culture').Culture.GetName]. Ngài bị ấn tượng bởi [culture|E] [Story.MakeScope.Var('advanced_culture').Culture.GetName] và mong muốn khiến thần dân của mình trở nên giống họ hơn.\n\nNgài sẽ bắt đầu nhận được các cơ hội để tích lũy điểm Cải cách hoặc điểm Tái khẳng định:\n$BULLET_WITH_TAB$#indent_newline:7 Bằng cách theo đuổi Cải cách, ngài có thể nhận được [innovations|E], [cultural_acceptance|E], [traditions|E], hoặc thậm chí có thể là một [GetBuilding('generic_university').GetName]. Hãy lưu ý rằng, Cải cách là một quá trình lâu dài và tốn kém.#!\n$BULLET_WITH_TAB$#indent_newline:7 Bằng cách theo đuổi Tái khẳng định, ngài có thể nhận được [opinion|E] của [vassal|E], [dynasty_prestige|E], các phần thưởng bổ trợ cho [war|E] dưới dạng [casus_bellis|E] và [special_troops|E].#!"
  REFORM_LABEL: "Tiến trình Duy Tân [culture|E]"
  REAFFIRMATION_LABEL: "Tiến trình Tái Khẳng Định [culture|E]"
  REFORM_MIN_VALUE_LABEL: ""
  REFORM_MAX_VALUE_LABEL: "Tối đa: #V 3#!"
  REAFFIRMATION_MIN_VALUE_LABEL: ""
  REAFFIRMATION_MAX_VALUE_LABEL: "Tối đa: #V 2#!"
  ECCENTRIC_MIN_VALUE_LABEL: ""
  ECCENTRIC_MAX_VALUE_LABEL: "Tối đa: #V 5#!"
  IMAGINARY_FRIEND_INFORMATION_STRING: "Người bạn trong tưởng tượng của ngài tên là [Story.MakeScope.Var('imaginary_friend_name').Char.GetShortUINameNoTooltip]. Đôi khi ngài sẽ có cơ hội tương tác với [Story.MakeScope.Var('imaginary_friend_name').Char.GetHerHim]."
  ECCENTRIC_VALUE: "Tiến trình đạt được đặc tính [GetTrait('eccentric').GetName( GetNullCharacter )]"
  story_cycle_imaginary_friend: "Người Bạn Tâm Tưởng"
  story_cycle_imaginary_friend_desc: "Cuối cùng cũng có một người bạn để chơi cùng! Ai quan tâm họ có thật hay không? Với ta, họ là thật!"
  story_greatest_of_khans: "Đại Hãn của các Đại Hãn"
  story_greatest_of_khans_desc: "Trên trời cao có muôn vàn tinh tú, có mặt trăng và thái dương. Nhưng dưới mặt đất, chỉ có thể có một vị Khả Hãn duy nhất."
  GREATEST_OF_KHANS_INFORMATION_STRING: "$become_greatest_of_khans_decision_enable_gok_invasion_cb$\n$gok_enable_offer_submission_or_ruin_tt$\n\n@alert_icon! #alert_trial Nếu [dynasty|E] của ngài mất quyền kiểm soát [Story.GetOwner.GetPrimaryTitle.GetName|l], không còn là chính phủ [GetGovernment( 'nomad_government' ).GetName], hoặc thất bại trong việc thực hiện [decision|E] #high $mpo_gok_world_conquest_decision$#! trước năm #high [Story.MakeScope.Var('gok_final_date').GetValue|0]#!, các bùa lợi này sẽ mất sạch và [Story.GetOwner.GetPrimaryTitle.GetName|l] có nguy cơ tan vỡ!#!"
 
