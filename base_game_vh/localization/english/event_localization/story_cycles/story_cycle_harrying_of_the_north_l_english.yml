 #Maintenance
  ep3_story_cycle_harrying.0001.t: "Chiếc Búa Rơi"
  ep3_story_cycle_harrying.0001.desc: "Khi vị vua Ætheling cuối cùng bị hạ bệ, Harrying of the North có thể thực sự coi là kết thúc.\n\n"
  ep3_story_cycle_harrying.0001.desc.hereward: "Không còn thách thức nào đối với ngai vàng [england.GetName]. Quý tộc Anglo-Saxon nằm rải rác, nhu nhược và thụ động, bị tước bỏ quyền lực và địa vị. Tất cả đều phải khuất phục trước [ruler_england.GetTitledFirstNamePossessive] chân.\n\nMục đích của Ta đã mất. Với người Norman giờ đã hiện diện để ở lại, không còn hy vọng cho tương lai Anglo-Saxon. Tốt nhất, chúng ta sẽ hòa nhập và trở thành một phần của vùng đất; tệ nhất, chúng ta sẽ hoàn toàn biến mất khỏi lịch sử."
  ep3_story_cycle_harrying.0001.desc.william: "Ta đang thăng tiến: không ai dám thách thức quyền lực của Ta ở [england.GetName]. Quý tộc Anglo-Saxon nằm rải rác, nhu nhược và thụ động, bái kiến Ta vì sợ trả thù. Mỗi người sẽ hôn nhẫn Ta và quỳ lạy trước Ta trước khi năm kết thúc.\n\nQuyền lực của Ta không bị tranh cãi, và giờ Ta có thể tiến tới những tham vọng khác."
  ep3_story_cycle_harrying.0001.desc.therest: "Sự kháng cự dữ dội mà [ruler_england.GetTitledFirstName] phải đối mặt cuối cùng cũng tan biến trước sự trả thù cay nghiệt. Quyền lực của người Norman trên [england.GetName] giờ không bị tranh cãi."
  ep3_story_cycle_harrying.0001.a: "Nguyên nhân của Ta đã thất bại."
  ep3_story_cycle_harrying.0001.b: "Vùng đất của Ta không còn bị chia cắt."
  ep3_story_cycle_harrying.0001.c: "Thật thú vị."

  ep3_story_cycle_harrying.0002.t: "Sự Trở Về"
  ep3_story_cycle_harrying.0002.desc: "Với một người Anglo-Saxon trở lại ngai vàng [england.GetName], Harrying of the North có thể thực sự coi là kết thúc.\n\n"
  ep3_story_cycle_harrying.0002.desc.hereward: "Nguyên nhân của chúng ta là chính nghĩa, thử thách hùng mạnh, trả thù cay nghiệt. Nhưng tinh thần Anglo-Saxon đã chiến thắng, và giờ chúng ta trở lại vị trí chính đáng trong các ghế quyền lực tại vùng đất này.\n\nTa phải đặt kiếm xuống. Có thể chưa rèn nó thành cày, vì kẻ thù của vương quốc vẫn nhiều, nhưng huyền thoại của Wake giờ phải từ từ phai nhạt trong ký ức."
  ep3_story_cycle_harrying.0002.desc.ruler: "Những kẻ xâm nhập Norman tan biến trước mắt chúng Ta. Một số bám víu quyền lực, một số trở về quê hương, và còn lại chôn dưới cỏ xanh Anh.\n\nKhông ai dám thách thức vị trí của Ta."
  ep3_story_cycle_harrying.0002.desc.therest: "Cuộc xâm lược thành công nhanh chóng biến thành ác mộng cho những kẻ xâm nhập Norman, và sự thăng lên quyền lực của [ruler_england.GetTitledFirstName] đã chấm dứt tham vọng ngoại bang cho ngai vàng. Ít nhất là hiện tại."
  ep3_story_cycle_harrying.0002.a: "Hãy để nó phai nhanh và vui vẻ."
  ep3_story_cycle_harrying.0002.b: "Vùng đất của Ta không còn bị chia cắt."
  ep3_story_cycle_harrying.0002.c: "Thật thú vị."

  ep3_story_cycle_harrying.0003.t: "Thời Kỳ Bấp Bênh"
  ep3_story_cycle_harrying.0003.desc: "Cuộc xung đột tàn khốc nổ ra giữa các nhà cai trị Norman và giới quý tộc Anglo-Saxon đã tàn phá cả hai bên, mang lại những kết quả thực sự bất ngờ.\n\nNgười [ruler_england.GetCulture.GetCollectiveNounNoTooltip] giờ đây đã kiểm soát ngai vàng của [england.GetName], với việc [ruler_england.GetTitledFirstName] ngự trị từ đỉnh cao quyền lực đối với những vùng đất đã bị tàn phá và chia cắt. Chiến dịch tàn sát miền Bắc cũng vì thế mà lụi tàn, hai phe tham chiến không còn khả năng tiếp tục mối thâm thù của mình.\n\nTương lai của vương triều vẫn mịt mờ, và còn nhiều điều bất định trong thời kỳ chuyển giao này."
  ep3_story_cycle_harrying.0003.a: "Còn phải xem liệu đây có phải cải thiện..."
  ep3_story_cycle_harrying.0003.b: "Ta sẽ thống nhất các vùng đất rời rạc này."
  ep3_story_cycle_harrying.0003.c: "Thật thú vị"

  ep3_story_cycle_harrying.0004.t: "Những Thời Đại Qua"
  ep3_story_cycle_harrying.0004.desc: "Đã nhiều năm trôi qua kể từ cuộc xâm lược của người Norman vào Anh.\n\n"
  ep3_story_cycle_harrying.0004.desc.ruler: "Quá nhiều năm đến nỗi người dân địa phương giờ hầu như không nhớ tại sao họ lại căm ghét quyền lực của Ta. Họ dần đặt kiếm xuống, không còn muốn tiếp tục cuộc chiến của ông bà họ.\n\nQuyền lực của Ta giờ gần như không bị thách thức, và Ta không cần tiếp tục chiến dịch hòa giải này. Harrying of the North đã kết thúc."
  ep3_story_cycle_harrying.0004.desc.anglo_saxon: "Những người còn sống cách đây nhiều thập kỷ đã ra đi, xác của họ trở thành phân bón cho cánh đồng. Ngay cả con cháu họ cũng đã tóc bạc và yếu ớt. Con cháu họ ngày càng gác lại cuộc đấu tranh của tổ tiên để sống hòa bình. Ngược lại, các nhà cai trị [ruler_england.GetCulture.GetCollectiveNounNoTooltip] trên ngai vàng dần nới lỏng tay áp bức, không còn thấy lợi ích từ xung đột.\n\nHarrying of the North đã kết thúc."
  ep3_story_cycle_harrying.0004.desc.therest: "Đủ thời gian đã trôi qua để thế hệ hiện tại của người Anglo-Saxon tại Anh gần như không nhớ họ đang chiến đấu vì điều gì. Các nhà cai trị [ruler_england.GetCulture.GetCollectiveNounNoTooltip] trở thành một phần của vùng đất, và ít người ở cả hai bên còn lý do để tiếp tục xung đột.\n\nHarrying of the North đã kết thúc."
  ep3_story_cycle_harrying.0004.a: "Họ là một phần của vương quốc này, cũng như chúng ta."
  ep3_story_cycle_harrying.0004.b: "Hãy tiến về phía trước, trong tình hữu nghị."
  ep3_story_cycle_harrying.0004.c: "Thật thú vị."

 ### WILLIAM EVENTS
  ep3_story_cycle_harrying.1000.t: "Bốc Cháy"
  ep3_story_cycle_harrying.1000.desc: "Khi những quý tộc Anglo-Saxon bất mãn tiếp tục theo đuổi nguyên nhân tuyệt vọng của họ, Ta dành nhiều buổi tối để suy nghĩ cách tước bỏ quyền lực của họ.\n\nĐột nhập và tước bỏ tước vị của họ sẽ gây ra phản ứng dữ dội, nhưng cuộc sống của một [ROOT.Char.GetLadyLord] phụ thuộc vào công việc của nông dân. Chúng ta ngồi trên họ, được [ROOT.Char.GetFaith.HighGodName] chỉ định, nhưng chính nhờ lao động vất vả của họ mà quyền lực của chúng ta được củng cố.\n\nLúa gạo, ngược lại, là mạch sống của nông dân. Ít lúa gạo hơn nghĩa là ít nông dân hơn. Ít nông dân hơn thì [ROOT.Char.GetLadyLord] yếu đi. Và [ROOT.Char.GetLadyLord] yếu đi thì..."
  ep3_story_cycle_harrying.1000.a: "Mọi hạt lúa ở [crop_duchy.GetNameNoTooltip] đều phải bị phá hủy."
  ep3_story_cycle_harrying.1000.b: "Chỉ để lại mức tối thiểu. Đốt hết phần còn lại."
  ep3_story_cycle_harrying.1000.c: "Nếu họ muốn lúa, họ phải trả giá."
  every_county_in_duchy_aetheling: "Mọi [county|E] trong [crop_duchy.GetName]"

  ep3_story_cycle_harrying.1005.t: "Con Đường Bắc Vĩ Đại"
  ep3_story_cycle_harrying.1005.desc: ""Miền Bắc sao?" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))] của ta, [marshal.GetFirstName], suy ngẫm một lát. "Nhiều năm bị xâm lược từ bên kia đại dương đã để lại cho họ một nền văn hóa khác biệt so với những gì ngài thấy ở dưới này." [marshal.GetSheHe|U] di ngón tay trên tấm bản đồ đang trải ra trước mặt chúng ta.\n\n"Ngài có thấy đường ranh giới này không? Họ gọi đó là Đại Lộ Phương Bắc." [marshal.GetSheHe|U] vuốt cằm một cách đầy suy tư. "Theo truyền thống, đây là con đường bộ đáng tin cậy duy nhất để dẫn lên phía bắc, nhưng nó đã rơi vào tình trạng hư hại nặng nề."\n\nTa đã nhận ra thế tiến thoái lưỡng nan này. Một lộ trình như vậy vừa là phước lành vừa là lời nguyền. Bảo đảm lối đi an toàn cho chúng ta là điều tối quan trọng, nhưng bất kỳ con đường nào cũng có thể bị cả hai bên lợi dụng..."
  ep3_story_cycle_harrying.1005.a: "Cải tạo đường, và thêm lính gác."
  ep3_story_cycle_harrying.1005.b: "Chúng ta cần con đường trong tình trạng tốt."
  ep3_story_cycle_harrying.1005.c: "Phá hủy từng tấc đường nào nằm dưới quyền kiểm soát Anglo-Saxon."
  ep3_story_cycle_harrying.1005.a.tt: "Mỗi [county|E] trên [Glossary( 'Great North Road', 'GNR_GLOSS' )]"
  ep3_story_cycle_harrying.1005.c.tt1: "Tất cả [counties|E] do Anglo-Saxon nắm giữ trên [Glossary( 'Great North Road', 'GNR_GLOSS' )]:"
  ep3_story_cycle_harrying.1005.c.tt2: "Tất cả [counties|E] do Norman nắm giữ trên [Glossary( 'Great North Road', 'GNR_GLOSS' )]:"
  GNR_GLOSS: "Một con đường do người La Mã xây, chạy dọc theo phần lớn xương sống của Anh. Con Đường Bắc Vĩ Đại đi qua các [counties|E] sau:\n\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_middlesex').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_hertfordshire').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_bedford').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_northamptonshire').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_leicestershire').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_nottinghamshire').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_west_riding').GetBaseName]"

  ep3_story_cycle_harrying.1010.t: "Định Đoạt Số Phận"
  ep3_story_cycle_harrying.1010.desc: "Thật không may khi làm tù binh chiến tranh. Một sinh vật như vậy nhìn Ta u sầu qua song sắt của [captured.GetHerHis] phòng giam.\n\n\"Ta có giá trị, Ngài biết không.\" Giọng [captured.GetHerHis|U] mỏng và khàn, nứt nẻ sau nhiều ngày trong ngục. \"Ta là [captured.GetFirstName] của Nhà [captured.GetHouse.GetBaseName]. Nếu Ngài gửi tin cho gia đình Ta, Ngài sẽ nhận được khoản tiền chuộc tốt.\"\n\nMột khoản chuộc? Điều đó cũng tốt, nhưng trong thời kỳ khốn khó này, một [captured.GetWomanMan] có tầm vóc như vậy có thể hữu dụng hơn như một thông điệp thay vì một con bài mặc cả chỉ vì vàng..."
  ep3_story_cycle_harrying.1010.a: "\"Ngài đã chọn nhầm [ROOT.Char.GetWomanMan] để chống lại, [captured.Custom('GirlBoy')].\""
  ep3_story_cycle_harrying.1010.b: "\"Ta sẽ để Ngài đi. Nhưng Ta sẽ để lại một lời nhắc về #EMP lòng hiếu khách#! của Ta.\""
  ep3_story_cycle_harrying.1010.c: "\"Ngài có phong thái tuyệt vời. Một phong thái #EMP [ROOT.Char.GetCulture.GetNameNoTooltip]#, thậm chí...\""
  ep3_story_cycle_harrying.1010.c.success: "[captured.GetSheHe|U] chấp nhận đề xuất của Ngài"
  ep3_story_cycle_harrying.1010.c.failure: "[captured.GetSheHe|U] chế nhạo đề xuất của Ngài"
  ep3_story_cycle_harrying.1010.d: "\"Ngài có thể thối rữa ở đây cho đến khi tiền chuộc được trả.\""

  ep3_story_cycle_harrying.1011.t: "Một [ROOT.Char.GetCulture.GetNameNoTooltip] Đích Thực"
  ep3_story_cycle_harrying.1011.desc: "Ngạc nhiên thay, [captured.GetWomanMan] cân nhắc đề xuất của Ta.\n\n\"Ta sẽ trở thành... một [ROOT.Char.GetCulture.GetName]?\" [captured.GetSheHe|U] thốt ra, suy nghĩ về hệ quả. \"Và Ta sẽ được chấp nhận như một trong các người của các ngài?\"\n\nTa dành chút thời gian để cân nhắc hoàn toàn hậu quả từ đề xuất vội vã của mình. Nếu Ta muốn cai trị vùng đất này, Ta cần càng nhiều [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] quanh Ta càng tốt. Chấp nhận những nhà cai trị trước vào vòng này có thể thúc đẩy nông dân chấp nhận chúng ta, bất chấp ngoại hình xa lạ của chúng ta."
  ep3_story_cycle_harrying.1011.desc.spouse: "\n\nBất ngờ, một ý tưởng lóe lên. [spouse_courtier.GetFirstName]! Có lẽ [spouse_courtier.GetSheHe] sẽ là một người phối ngẫu thích hợp..."
  ep3_story_cycle_harrying.1011.a.spouselanguage: "\"[spouse_courtier.GetWifeHusband] mới của Ngài cũng sẽ giúp Ngài học ngôn ngữ nhanh chóng.\""
  ep3_story_cycle_harrying.1011.a.language: ""Và ngươi cũng sẽ trở thành một kẻ xuất sắc, một khi ngươi học được [ROOT.Char.GetCulture.GetLanguage.GetName].""
  ep3_story_cycle_harrying.1011.b: "\"Đi đi, và được tự do.\""

  ep3_story_cycle_harrying.1015.t: "Ngọn Lửa Lập Lòe"
  ep3_story_cycle_harrying.1015.desc: "#EMP Cái đó#!, Ta nghĩ khi ngọn lửa bốc cao hơn, là điều Ngài nhận được vì phản loạn.\n\n[offending_village.GetName] từng là ổ nhóm chống đối quyền lực của Ta. Ngôi nhà cháy, vốn trước đây là nơi trú ẩn an toàn cho những kẻ chống đối, giờ bốc khói mỏng vào không khí. Ta quan sát nó, cảm nhận cơn giận của chính mình dâng lên cùng khói.\n\nHọ #EMP dám#! chống lại Ta sao? Phần còn lại của nơi này cũng đồng lõa: tất cả họ đều biết chính xác nhóm đó đang âm mưu gì. Không ai vô tội!"
  ep3_story_cycle_harrying.1015.a: "Đốt thêm một tòa nhà."
  ep3_story_cycle_harrying.1015.b: "Họ phải học cách vâng lời. Di dời một nửa dân số."
  ep3_story_cycle_harrying.1015.c: "Ta phải kiềm chế bản thân."
  ep3_story_cycle_harrying.1015.c.tt: "Rốt cuộc, nếu không, còn vương quốc nào để cai trị?"
  all_neighbouring_villages: "Tất cả [holdings|E] lân cận [offending_village.GetName]"

 ###AETHELING EVENTS
  ep3_story_cycle_harrying.2000.t: "Linh Hồn Sụp Đổ"
  ep3_story_cycle_harrying.2000.desc: "Người dân thị trấn [location.GetName] đang phải chịu thống khổ: các lệnh hạn chế lương thực do [william.GetTitledFirstNameRegnal] áp đặt đã thực sự bắt đầu để lại hậu quả tàn khốc, vắt kiệt chút da thịt cuối cùng của họ. Một kẻ khốn khổ trong số đó nhận ra phong thái của ta, và [starving_man.GetHerselfHimself] đã phủ phục xuống trước mặt ta để cầu xin.\n\n"Xin ngài làm ơn!" [starving_man.GetSheHe|U] kêu van, những ngón tay gầy guộc bấu chặt lấy chân ta. "Tôi đã không có gì bỏ bụng suốt hai ngày qua rồi. Còn hai ngày trước đó tôi cũng chỉ được ăn một bữa. Xin ngài, xin ngài... #DIE1 ngài phải làm #EMP điều gì đó đi chứ...#!#!""
  ep3_story_cycle_harrying.2000.notcallous: "\n\nNgười [starving_man.GetWomanMan] đáng thương này."
  ep3_story_cycle_harrying.2000.a: "Trả tiền cho hàng nhập khẩu, bằng tiền của Ta."
  ep3_story_cycle_harrying.2000.b: "\"Đi theo Ta. Ta sẽ cho Ngài ăn.\""
  ep3_story_cycle_harrying.2000.c: "Có lẽ Ta có thể tìm cách khắc phục việc này?"
  ep3_story_cycle_harrying.2000.c.success: "Phương pháp tăng sản lượng nông trại của Ngài hiệu quả"
  ep3_story_cycle_harrying.2000.c.failure: "Phương pháp của Ngài không hiệu quả"

  ep3_story_cycle_harrying.2001.opening: "[marshal.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
  ep3_story_cycle_harrying.2001.desc: "Khi sản xuất lương thực ở khu vực ổn định, nhiều người vốn quá yếu để làm việc giờ sẵn sàng phục vụ.\n\nNhững người khỏe mạnh nhất sẵn sàng trở thành chiến binh cho nguyên nhân của Ngài!"
  ep3_story_cycle_harrying.2001.a: "Hãy nhận họ vào!"
  ep3_story_cycle_harrying.2001.b: "Ta hiện không cần chiến binh."
  ep3_story_cycle_harrying.2001.b.tt: "Nhưng có lẽ trong tương lai..."

  ep3_story_cycle_harrying.2005.t: "Tạm Dừng Hình Phạt"
  ep3_story_cycle_harrying.2005.desc: "Khi đứng ở vị thế của một [ROOT.Char.GetLadyLord] như ta, đôi khi người ta phải đưa ra những quyết định nghiệt ngã. Nghĩ vậy nên khi một kẻ sát nhân khét tiếng trong vùng bị xiềng xích giải đến trước mặt ta, ta đã lệnh cho [spymaster.GetFirstName] tống khứ [murderer.GetHerHim] xuống kho vũ khí để chúng ta có thể mật đàm.\n\nTên [murderer.GetWomanMan] nhìn ta đầy tò mò. Chẳng có chút nghi ngờ gì về việc nếu không có sự can thiệp của ta, [murderer.GetSheHe] sẽ phải treo cổ trên giá treo vào cuối tuần này. Ta nhìn [spymaster.GetFirstNameNoTooltip] để xác nhận và nhận được một cái gật đầu phản hồi.\n\n"Ta đang cần một [murderer.GetWomanMan] có năng lực như ngươi...""
  ep3_story_cycle_harrying.2005.a: "Chúng ta phải nhắm mục tiêu cao nhất có thể."
  ep3_story_cycle_harrying.2005.b: "Lấy vàng này, thuê một số tay sai..."
  ep3_story_cycle_harrying.2005.b.tt: "Và giết mọi người Norman Ngài tìm thấy trong [willy_vassal.GetName]."
  ep3_story_cycle_harrying.2005.c: "Ngài có vẻ là một [murderer.GetWomanMan] hữu dụng."

  ep3_story_cycle_harrying.2010.t: "Nỗ Lực Chiến Tranh"
  ep3_story_cycle_harrying.2010.desc: "Là một trong những Æthelings quyền lực nhất, Ta phải tập hợp các quý tộc nhỏ ủng hộ nguyên nhân chính nghĩa của chúng ta. Với stakes lớn như vậy, tất cả họ đều lo lắng khi hỗ trợ toàn tâm, nhưng chúng ta cần họ để thành công.\n\nCâu hỏi duy nhất là, chúng ta cần loại hỗ trợ gì? Vàng luôn chào đón, nhưng có lẽ Ta có thể khích động quần chúng nhiều hơn? Có thể, chúng ta cần một lực lượng kháng cự được tổ chức đúng cách?"
  ep3_story_cycle_harrying.2010.a: "Kháng cự được tổ chức là cách nên làm."
  ep3_story_cycle_harrying.2010.a.critsuccess: "Kháng cự leo thang nhanh chóng"
  ep3_story_cycle_harrying.2010.a.success: "Kháng cự tăng lên"
  ep3_story_cycle_harrying.2010.a.failure: "Lời kêu gọi của Ngài bị phớt lờ"
  ep3_story_cycle_harrying.2010.a.critfailure: "Thông điệp của Ngài bị Norman chặn"
  ep3_story_cycle_harrying.2010.b: "Ta sẽ kêu gọi một số món quà bằng vàng."
  ep3_story_cycle_harrying.2010.b.success: "Vàng đến nhanh chóng"
  ep3_story_cycle_harrying.2010.b.failure: "Các quý tộc phớt lờ lời kêu gọi của Ngài"
  ep3_story_cycle_harrying.2010.c: "Họ nên khuyến khích dân thường nổi dậy."
  county_list_tt: "Mỗi [county|E] do Norman nắm giữ trong [realm|E] của [william.GetTitledFirstNamePossessive]"

  ep3_story_cycle_harrying.2015.t: "Rèn Vị Thế"
  ep3_story_cycle_harrying.2015.desc: "Khi các tài liệu Ta yêu cầu được đưa đến, Ta gần như cảm nhận tay mình run. Những tài liệu giả mạo tuyệt hảo; không ai có thể nghi ngờ. Với điều này, yêu sách của Ta với các vùng đất này là không thể tranh cãi, và còn nhiều tài liệu khác cho các Æthelings khác.\n\nTuy nhiên, câu hỏi lớn hơn đang chờ. Ta muốn tận dụng lợi thế này ra sao? Có vô số cách tấn công vị thế [william.GetTitledFirstNamePossessive], và quan trọng hơn là củng cố vị thế của chúng ta."
  ep3_story_cycle_harrying.2015.a: "Hãy xem [william.GetHerHim] loại chúng ta sau việc này..."
  ep3_story_cycle_harrying.2015.a.success: "[william.GetSheHe|U] đồng ý một cách giận dữ"
  ep3_story_cycle_harrying.2015.a.failure: "[william.GetSheHe|U] kiên quyết từ chối"
  ep3_story_cycle_harrying.2015.b: "Thêm một chút tự do có thể giúp nguyên nhân của chúng ta."
  ep3_story_cycle_harrying.2015.c: "Có lẽ một thỏa thuận đặc biệt..."

 ###HEREWARD EVENTS
  ep3_story_cycle_harrying.3000.t: "Lợi Ích Chung"
  ep3_story_cycle_harrying.3000.desc: "Thật là một nhà thờ xinh đẹp! Ta mừng vì chuyến đi đến [neighboring_church.GetName] đã dẫn Ta tới đây. Nó cũng không phải là một nguyện đường khiêm tốn, nhìn vào các họa tiết trang trí tinh xảo. Ta giật mình khi một [bishop.GetFaith.PriestNeuter] lên tiếng.\n\n\"Ta biết ngài là ai.\" [bishop.GetSheHe|U] giơ tay ra ngăn Ta phản đối. \"Ta cũng biết tại sao ngài đến đây. Danh tiếng của ngài đã vang trước, trẻ tuổi [ROOT.Char.GetFirstNameNoTooltip], khó mà không tìm được đường đến đây sớm thôi.\"\n\n\"Tất cả những gì Ta xin — và Ta cầu xin ngài, như một [bishop.GetWomanMan] của [bishop.GetFaith.HighGodName] — xin hãy để các thánh tích yên vị. Lấy tiền nếu cần.\""
  ep3_story_cycle_harrying.3000.a: "...một thánh tích, ngài nói sao?"
  ep3_story_cycle_harrying.3000.b: "Ta sẽ không hạ mình để cướp một thánh tích từ nhà thờ."
  ep3_story_cycle_harrying.3000.b.tt: "...nhưng một túi tiền thì..."
  ep3_story_cycle_harrying.3000.c: "\"[bishop.GetMotherFather|U]! Bình tĩnh. Ta không hề mơ tới việc lấy cắp của ngài.\""
  artifact_church_saint_brooch_name: "Trâm Thánh"
  artifact_church_saint_brooch_description: "Một chiếc trâm cổ chế tác từ thiếc với các khảm bạc, được cho là từng thuộc về Thánh [ROOT.Char.Custom('GetCatholicSaint')]. Nó đã bị [ROOT.Char.GetFirstName] đánh cắp từ nguyện đường tại [neighboring_church.GetName]."

  ep3_story_cycle_harrying.3005.t: "Lưỡi Kiếm Trong Sương"
  ep3_story_cycle_harrying.3005.desc: "Ta cúi thấp, rút kiếm, trong khi sương mù bao quanh và nhóm nhỏ nhưng vũ trang đầy đủ của [ROOT.Char.GetWomenMen] đi cùng. Chúng Ta chỉ cách con đường vài mét, nơi một lính đánh thuê Norman nheo mắt nhìn vào màn sương.\n\n[norman_soldier.GetSheHe|U] dẫn đầu một đoàn, theo lời đồn đại là một đoàn lữ hành chở vũ khí và giáp, hướng tới [vassal_county.GetName]. Chặn họ có thể gây tổn thất lớn cho kẻ thù, và chiến lợi phẩm có thể được phân phát lại cho đồng minh.\n\nThanh kiếm trông ấn tượng của [norman_soldier.GetWomanMan] lóe sáng mờ khi Ta kiểm tra vũ khí của mình. Trận chiến sắp tới chắc chắn sẽ khốc liệt."
  ep3_story_cycle_harrying.3005.a: "Tấn công mạnh mẽ; vũ khí đó là của chúng ta!"
  ep3_story_cycle_harrying.3005.a.success: "Cuộc mai phục thành công hoàn hảo"
  ep3_story_cycle_harrying.3005.a.failure: "Cuộc mai phục thất bại"
  ep3_story_cycle_harrying.3005.b: "Đồng minh cần trang bị đó."
  ep3_story_cycle_harrying.3005.b.tt: "Mỗi thanh kiếm đều sẽ thuộc về họ."
  ep3_story_cycle_harrying.3005.c: "Chúng ta phải tận dụng thời tiết này."
  ep3_story_cycle_harrying.3005.c.tt: "Nếu chúng ta lẻn đi và phá hoại đường phía trước, có thể trì hoãn sự đến nơi của họ mà không cần giao chiến."
  every_knight: "Mọi [knight|E]"
  every_anglo_vassal: "Mọi [vassal|E] Anglo-Saxon của [william.GetTitledFirstName]"
  norman_sword_name: "Kiếm Norman"
  stolen_norman_sword_name: "Kiếm Norman Bị Ăn Cắp"
  stolen_norman_sword_description: "Thanh kiếm này mang dấu ấn chế tác của người Norman, với một rãnh nổi chạy dọc theo chiều dài thanh kiếm đẹp mắt."

  ep3_story_cycle_harrying.3010.t: "Tiền Hay Mạng"
  ep3_story_cycle_harrying.3010.desc: "Gió xào xạc qua những tán cây khi [norman_noble.GetTitledFirstName] vừa đi hết cây cầu mà [norman_noble.GetSheHe] đang băng qua. Tiếng động khẽ khàng ấy không thể lấn át được tiếng huýt sáo chói tai mà ta phát ra, và ngay lập tức, cả con đường ngập tràn trong máu hành hình.\n\n[norman_noble.GetFirstNameNoTooltip|U] ngã lộn nhào khỏi yên ngựa của [norman_noble.GetHerHis] khi một mũi tên đâm toạc hông con ngựa, một trong số hàng loạt mũi tên lao ra từ bìa rừng khi bẫy sập.\n\nCác hiệp sĩ của ta lao lên để chiến đấu và bắt giữ những kẻ hộ tống đối phương. Ta tiến lại gần [norman_noble.GetTitleAsNameNoTooltip] khi [norman_noble.GetSheHe] đang chật vật gượng dậy trên đôi chân của [norman_noble.GetHerHis], rút gươm ra đúng lúc [norman_noble.GetSheHe] cũng làm điều tương tự."
  ep3_story_cycle_harrying.3010.a: "\"Chuẩn bị vũ khí, chó Norman.\""
  ep3_story_cycle_harrying.3010.a.tt: "#V Duel#! [norman_noble.GetFirstName] đến chết.\nKỹ năng của Ngài: [prowess_i]#V [root_for_loc.GetProwess]#!\nKỹ năng [norman_noble.GetFirstNamePossessive]: [prowess_i]#V [norman_noble.GetProwess]#!"
  ep3_story_cycle_harrying.3010.b: "\"Đưa hết tài sản, Ta sẽ rút hiệp sĩ.\""

  ep3_story_cycle_harrying.3011.t: "Lối Thoát"
  ep3_story_cycle_harrying.3011.desc: "Máu nhỏ giọt trên kiếm khi Ta lau sạch. Ngày vẫn yên tĩnh, cuộc mai phục nhanh chóng và tàn nhẫn. Khi [norman_noble.GetFirstName] gục xuống, nhiều người trong [norman_noble.GetHerHis] giơ tay đầu hàng. Bảo vệ quý tộc địa phương là công việc, không phải hy sinh mạng sống. Một người gọi Ta khi Ta đi qua.\n\n\"Chúng Ta sẽ ra sao?\" [saxon_soldier_1.GetSheHe|U] hỏi, hơi lo lắng. Người khác, ngay bên phải [saxon_soldier_1.GetHerHis], gật đầu đồng tình.\n\nTa quan sát hai người. Họ đều khỏe mạnh, rõ ràng có thể chiến đấu, nhưng sự tàn nhẫn của cuộc tấn công khiến họ ngạc nhiên. Qua giọng, họ không phải người Norman."
  ep3_story_cycle_harrying.3011.a: "Hai người có muốn một công việc không?"
  ep3_story_cycle_harrying.3011.b: "\"Quay về nhà. Sống tốt.\""

  ep3_story_cycle_harrying.3015.t: "Từ Biển Cả"
  ep3_story_cycle_harrying.3015.desc: "Chúng Ta không xa lạ với xâm nhập ngoại bang. Nhưng những người ngoại bang trước đây trở thành một phần của vùng đất này. Người Đan Mạch trở thành chúng Ta và chúng Ta trở thành họ, từ sự đan xen đó sinh ra gia đình Ta.\n\nTa ngồi và suy tư. Anh quốc là phần thưởng quý giá, và [danish_king.GetTitledFirstName] chắc chắn muốn có. Một Đan Mạch cai trị Anh không phải chuyện lạ; họ là một phần của chúng ta.\n\nTay Ta run run hướng tới giấy và bút..."
  ep3_story_cycle_harrying.3015.a: "Một người Đan Mạch nên cai trị, nếu Anglo-Saxon không thể."
  ep3_story_cycle_harrying.3015.a.success: "[danish_king.GetFirstNameNoTooltip] dùng lời cầu của Ngài để giành quyền"
  ep3_story_cycle_harrying.3015.a.failure: "[danish_king.GetFirstNameNoTooltip] từ chối can thiệp"
  ep3_story_cycle_harrying.3015.b: "Yêu cầu binh lính là khởi đầu tốt."
  ep3_story_cycle_harrying.3015.b.success: "[danish_king.GetFirstNameNoTooltip] gửi binh lính cho Ngài"
  ep3_story_cycle_harrying.3015.b.failure: "[danish_king.GetFirstNameNoTooltip] không thể cử ai"
  ep3_story_cycle_harrying.3015.c: "Không thư từ. Đây là cuộc chiến của chúng ta một mình."

  ep3_story_cycle_harrying.3020.t: "An Ủi Kẻ Phản Bội"
  ep3_story_cycle_harrying.3020.desc: "Những lời bàn tán thì thầm truyền đến tai ta tại [location.GetName] giờ đây đã quá lớn để có thể phớt lờ. Tên chuột nhắt [willy_vassal.GetTitledFirstName] đó rõ ràng đang sống quá đỗi nhung lụa dưới ách đô hộ của ngoại bang, quá mức dễ chịu rồi.\n\nThứ duy nhất tồi tệ hơn một tên Norman chính là một kẻ phản bội Anglo-Saxon. Có lẽ ta nên ghé thăm [willy_vassal.GetHerHim] một chuyến và khiến [willy_vassal.GetHerHim] phải nhận ra sai lầm trong đường lối của [willy_vassal.GetHerHis]..."
  ep3_story_cycle_harrying.3020.a: "Ta sẽ khởi hành ngay."
  ep3_story_cycle_harrying.3020.a.tt: "Bắt đầu đi đến [willy_vassal_capital.GetName]"
  ep3_story_cycle_harrying.3020.b: "Ta nên để [willy_vassal.GetHerHim] tự hư hỏng."

  ep3_story_cycle_harrying.3021.t: "Đối Mặt Với Rắn"
  ep3_story_cycle_harrying.3021.desc: "Những lời đồn đại quả không sai. [willy_vassal.GetFirstName] đã cấu kết sâu nặng với các quan thầy Norman của [willy_vassal.GetHerHis]. Thật tự tin làm sao, khi đường đường chính chính trở về từ một cuộc mật nghị nào đó với chúng, mà chỉ mang theo vài ba lính gác vũ trang bên mình [willy_vassal.GetHerHim].\n\nTa ra hiệu. Chúng ta lao ra khỏi bóng tối, các đồng hành của ta đánh úp toán lính gác của [willy_vassal.GetHerHis], kề gươm vào cổ chúng. Ta tiến lại gần chính bản thân [willy_vassal.GetFirstNameNoTooltip] [willy_vassal.GetHerselfHimself].\n\n"Ngươi... ngươi là [ROOT.Char.GetHerHim], đúng không?" [willy_vassal.GetSheHe|U] lắp bắp nói. "Kẻ mà họ vẫn hay đồn đại. Kẻ ở vùng đầm lầy Fens...""
  ep3_story_cycle_harrying.3021.a: "\"Rút kiếm đi, giun.\""
  ep3_story_cycle_harrying.3021.a.tt: "#V Duel#! [willy_vassal.GetFirstName] đến chết.\nKỹ năng của Ngài: [prowess_i]#V [root_for_loc.GetProwess]#!\nKỹ năng [willy_vassal.GetFirstNamePossessive]: [prowess_i]#V [willy_vassal.GetProwess]#!"
  ep3_story_cycle_harrying.3021.b: "\"Ta chỉ muốn nói chuyện, [willy_vassal.GetFirstNameNoTooltip].\""
  ep3_story_cycle_harrying.3021.b.success: "[willy_vassal.GetSheHe|U] gia nhập phe Ngài"
  ep3_story_cycle_harrying.3021.b.failure: "[willy_vassal.GetSheHe|U] từ chối nghe lý lẽ của Ngài"
  ep3_story_cycle_harrying.3021.c: "\"Ngươi sợ #EMP [willy.GetHerHim]?#! Chờ xem ta làm gì...\""
  ep3_story_cycle_harrying.3021.c.success: "[willy_vassal.GetSheHe|U] gia nhập phe Ngài"
  ep3_story_cycle_harrying.3021.c.failure: "[willy_vassal.GetSheHe|U] không bị đe dọa"
  ep3_story_cycle_harrying.3021.d: "\"Bất kỳ Anglo-Saxon trung thành nào ở đây, ngươi có chỗ bên ta.\""
  ep3_story_cycle_harrying.3021.d.flavour: "Ta sẽ đổi mạng hắn ngàn lần cho mạng họ."

  ep3_story_cycle_harrying.3022.t: "Không Còn Nữa"
  ep3_story_cycle_harrying.3022.desc: "Ta bước qua xác không hồn của [willy_vassal.GetFirstNamePossessive]. Vệ sĩ của [willy_vassal.GetHerHis|U] tản ra, không còn lý do ở lại.\n\n[willy_vassal.GetFirstNameNoTooltip] là một [willy_vassal.GetWomanMan] giàu có, tiếc nếu bỏ phí. Ta lục túi lấy một ít tiền, [willy_vassal.GetHerHis] [newly_created_artifact.GetName] ở đây đó.\n\nTa đứng lại, nhìn xác chết.\n\nĐã đến lúc gửi đi một thông điệp."
  ep3_story_cycle_harrying.3022.a: "Ta biết ai có thể thích một món quà..."
  ep3_story_cycle_harrying.3022.b: "Người dân nên biết về công lý chúng ta thực thi."

  ep3_story_cycle_harrying.3050.opening: "Gửi Hereward, kẻ khét tiếng ở Fen,"
  ep3_story_cycle_harrying.3050.desc: "Ta có một đề nghị cho ngươi.\n\nĐi tới [london.GetNameNoTier] càng sớm càng tốt; ngươi sẽ muốn nghe những gì Ta có để đưa ra.\n\nĐừng để Ta chờ."
  ep3_story_cycle_harrying.3050.a: "Ta sẽ nghe [william.GetHerHim] nói."
  ep3_story_cycle_harrying.3050.a.tt: "Đặt lộ trình hướng về $cn_lunden$.\n#Weak Ta thà chết từ lâu còn hơn là gọi nó là "#EMP $cn_londres$" ... #!#!"
  ep3_story_cycle_harrying.3050.b: "Rõ ràng đây là một cái bẫy."

  ep3_story_cycle_harrying.3051.t: "Đứa Con Bất Chính Trên Ngai"
  ep3_story_cycle_harrying.3051.desc: "Nơi cung điện quyền lực thật tráng lệ biết bao. [william.GetTitledFirstNameRegnal] ngồi ngự một cách cứng nhắc trên ngai vàng khi ta được hộ tống vào bái kiến [william.GetHerHim], nhưng sự xa hoa của không gian xung quanh phần nào làm dịu đi tư thế bất an đó của [william.GetHerHis].\n\n"[ROOT.Char.GetFirstNameNoTooltip]. Kẻ [ROOT.Char.GetWomanMan] đã biến vùng đất phía nam The Wash thành một nghĩa địa đầy xương máu." Khóe môi của [william.GetHerHis|U] cong lên đầy giận dữ khi ta không thể che giấu hoàn toàn sự đắc ý trước lời mô tả đó.\n\n"Ta không nghĩ ngươi sẽ đến. Cứ ngỡ ngươi sẽ cố thủ mãi trên hòn đảo của mình chứ. Rõ ràng, ngươi là một [ROOT.Char.GetWomanMan] mang lại nhiều bất ngờ."\n\nTa ngước nhìn lại [william.GetHerHim], tên con hoang ngoại bang đang chễm chệ trên chiếc ngai danh tiếng kia."
  ep3_story_cycle_harrying.3051.a: "\"Ngai đó có vẻ hơi lớn so với ngài, phải không?\""
  ep3_story_cycle_harrying.3051.a.success: "[william.GetSheHe|U] bỏ qua"
  ep3_story_cycle_harrying.3051.a.failure: "[william.GetSheHe|U] yêu cầu Ngài im lặng"
  ep3_story_cycle_harrying.3051.b: "\"Đề xuất của ngươi là gì?\""
  ep3_story_cycle_harrying.3051.b.tt: "Không có lý do để trao đổi những lời châm chọc."

  ep3_story_cycle_harrying.3052.t: "Giao Ước Với Quỷ"
  ep3_story_cycle_harrying.3052.desc: ""Ta biết ngươi, [ROOT.Char.GetFirstNameNoTooltip], [ROOT.Char.Custom('GetDaughterSon')] của [father.GetFirstName]. Ta biết lý do tại sao ngươi lại làm những việc này. Thậm chí ta còn biết tại sao ngươi lại ở đây." [william.GetFirstName] nhoài người về phía trước khi [william.GetSheHe] nói, nhìn xoáy vào ta bằng ánh mắt của [william.GetHerHis].\n\n"Ta biết điều gì thúc đẩy ngươi, và ta biết ngươi muốn gì." [william.GetSheHe|U] nhặt một cuộn giấy ở bên cạnh [william.GetHerHim] khi [william.GetSheHe] nói, rồi trao nó cho một tên lính gác. [william.GetSheHe|U] tiếp tục nói khi tên lính gác tiến lại gần ta với cuộn giấy trên tay.\n\n"Khế ước này dành cho toàn bộ vùng [cambridgeshire.GetName]. Không chỉ riêng xứ Ely. Mà là tất cả." [william.GetFirstNameNoTooltip], kẻ cai trị mới của những vùng đất này, ngả người ra sau đầy đắc thắng.\n\n"Mọi thứ có thể thuộc về ngươi, miễn là ngươi hạ vũ khí xuống và không bao giờ tuốt gươm chống lại ta nữa.""
  ep3_story_cycle_harrying.3052.a: "Nhà ta! Ngôi nhà tổ tiên của ta..."
  ep3_story_cycle_harrying.3052.a.flavor: "Quá khó để từ chối một đề nghị tuyệt vời như vậy."
  ep3_story_cycle_harrying.3052.a.tt: "[william.GetFirstNameNoTooltip] triệu tập một thư ký..."
  ep3_story_cycle_harrying.3052.b: "\"...trả lại anh trai Ta, đồ rắn Norman.\""

  ep3_story_cycle_harrying.3053.t: "Ba Mươi Đồng Bạc"
  ep3_story_cycle_harrying.3053.desc: "Nụ cười toe toét đầy nham hiểm trên khuôn mặt của [william.GetTitledFirstNamePossessive] khiến ta cảm thấy buồn nôn tận ruột gan. [william.GetSheHe|U] vẫy tay gọi một tên thư lại.\n\n"Một sự lựa chọn xuất sắc. Sự an nhàn và thịnh vượng của ngươi cùng gia quyến trong nhiều thế hệ mai sau sẽ được bảo đảm!" [william.GetSheHe|U] đứng dậy khỏi ngai vàng của [william.GetHerHis], nhìn thẳng vào mắt ta.\n\n"Hãy nhớ lấy. Ngươi có được tất cả những điều này để đổi lấy việc không được động một ngón tay chống lại ta trong suốt phần đời còn lại của ngươi. Nếu ta nghe thấy dù chỉ một lời đồn đại nhỏ nhất rằng có tiếng đá mài đang mài bất cứ thứ gì lớn hơn một con dao đâm tiết lợn ở Cambridgeshire..."\n\nTa vô cảm gật đầu đồng ý. Ta nhìn xuống bàn tay mình đang đưa ra nhận văn kiện, rồi nhìn lại nụ cười ranh mãnh của [william.GetFirstNamePossessiveNoTooltip]."
  ep3_story_cycle_harrying.3053.a: "... Ta không thể làm."
  ep3_story_cycle_harrying.3053.b: "\"Ta ký ở đâu?\""
  ep3_story_cycle_harrying.3053.b.tt: "@warning_icon! #X Điều này sẽ chấm dứt sự chống đối của ngươi với người Norman và tham gia vào [harrying_widget_i]Harrying of the North!#!"

  ep3_story_cycle_harrying.3054.t: "Tiền Thù Quỷ"
  ep3_story_cycle_harrying.3054.desc: "[william.GetTitledFirstNamePossessive] face contorts suddenly, riven with anger.\n\n"You fool," [william.GetSheHe] spits venomously, "you short-sighted, half-witted #EMP fool!#!" [william.GetSheHe|U] gestures [william.GetHerHis] guards forward.\n\n"Can't you see? You cling to history! You chase an existence already denied to you by [ROOT.Char.GetFaith.HighGodName]! You stand by principles you hold for no reason other than to hold them!"\n\nI look around frantically. The door I came in from is still lightly-guarded. Maybe if I can just get through them...\n\n"#EMP Seize him!#!""
  ep3_story_cycle_harrying.3054.a: "Ta sẽ không chịu khuất phục dễ dàng!"
  ep3_story_cycle_harrying.3054.a.success: "Ngươi trốn thoát thành công!"
  ep3_story_cycle_harrying.3054.a.failure: "Ngươi bị bắt và đánh đập"
  ep3_story_cycle_harrying.3054.b: "Vô ích thôi."
  ep3_story_cycle_harrying.3054.b.tt: "Tốt hơn nên giữ sức. Ta sẽ cần nó."

  ep3_story_cycle_harrying.3055.t: "Giá Sắt"
  ep3_story_cycle_harrying.3055.desc: "Một cú đấm vào bụng khiến ta gập người lại khi bị bắt giữ, và hai tay ta nhanh chóng bị bẻ ngoặt ra sau lưng. Những khuôn mặt nghiêm nghị, giận dữ — thậm chí có một [sympathetic_courtier.GetWomanMan] ở phía sau với ánh mắt có vẻ đầy cảm thông — chập chờn qua tầm mắt ta khi ta bị áp giải đi.\n\nĐoạn đường đi tuy ngắn nhưng đầy hiểm họa. Ánh sáng tự nhiên lịm dần khi chúng ta bước xuống các bậc cầu thang. Chẳng mấy chốc, ta thấy mình bị cùm trong xích sắt, bị khóa chặt vào bức tường trong phòng giam.\n\n"Hãy coi là ngươi còn may mắn vì giữ được mạng sống đi, tên thảo khấu." Giọng nói của [william.GetTitledFirstNamePossessive] vang vọng từ những bức tường đá ẩm ướt. [william.GetSheHe|U] liếc nhìn xung quanh một lát. "Or... có lẽ cũng chẳng may mắn đến thế đâu."\n\n[william.GetSheHe|U] quay gót bước đi và rời khỏi căn phòng cùng với đoàn tùy tùng của [william.GetHerHis], bỏ lại ta cô độc một mình."
  ep3_story_cycle_harrying.3055.a: "Chà... chết tiệt."

  ep3_story_cycle_harrying.3056.opening: "Gửi Chúa Công Dũng Cảm Hereward,"
  ep3_story_cycle_harrying.3056.desc: "Ngươi cần tin chúng ta.\n\nBa đêm nữa, phòng giam của ngươi sẽ không khóa sau bữa ăn. Ở lại đó cho tới khi màn đêm buông xuống.\n\nĐi lên cầu thang, rẽ trái lần hai, sau đó rẽ phải lần đầu.\n\n#BOL NGƯƠI KHÔNG ĐƠN ĐỘC.#!"
  ep3_story_cycle_harrying.3056.a: "Gì cơ?"

  ep3_story_cycle_harrying.3057.t: "Tự Do"
  ep3_story_cycle_harrying.3057.desc: "Theo chỉ dẫn, Ta chờ đến khi hoàng hôn trôi qua trước khi thử mở khóa phòng giam có bảo vệ. Nó mở ra với một tiếng kẽo kẹt nhẹ, Ta lập tức lao lên cầu thang. Rẽ trái lần hai, rẽ phải lần đầu, thêm một cầu thang nữa và...\n\nTa lao ra không khí đêm trong lành. Cách không xa, một bóng người trùm mũ trồi lên, quan sát Ta. Ta nhận ra [sympathetic_courtier.GetHerHim] là gương mặt đầy cảm thông Ta đã thấy khi bị dẫn đến phòng giam.\n\n\"Ngươi làm được rồi!\" [sympathetic_courtier.GetSheHe|U] vui mừng chào Ta, chỉ ra con đường xuyên qua thành phố. \"Đó là đường ra phía bắc. Nếu ngươi đi ngay, sẽ biến mất trước khi họ nhận ra.\""
  ep3_story_cycle_harrying.3057.a: "Đi cùng ta!"
  ep3_story_cycle_harrying.3057.a.success: "[sympathetic_courtier.GetFirstNameNoTooltip] vui vẻ đồng ý"
  ep3_story_cycle_harrying.3057.a.failure: "[sympathetic_courtier.GetSheHe|U] miễn cưỡng từ chối"
  ep3_story_cycle_harrying.3057.b: "Ta sẽ không quên ngươi. Đi đi, nhanh lên, trước khi bị phát hiện."
