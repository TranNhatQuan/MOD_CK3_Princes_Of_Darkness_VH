l_english:

# Secret has been exposed/discovered — lover/spouse decides how to react, by Mathilda Bjarnehed
	infidelity_confrontation.1000.t:0 "Không chung thủy"
 	#Special confession desc
	infidelity_confrontation.1000.confession.apologetic_start.desc:0 "[infidelity_partner.GetFirstName] im lặng như đóng băng trong thời gian, nhưng Ta có thể thấy trong mắt [infidelity_partner.GetHerHis]. Nỗi sợ của Ta là thật. Ta cũng dường như đóng băng — trừ trái tim Ta, vẫn đập thình thịch.\n\nKhi lời cuối cùng trào ra từ môi [infidelity_partner.GetFirstNamePossessiveNoTooltip], nước mắt cũng rơi từ mắt [infidelity_partner.GetHerHis].\n\n\"Ôi, [infidelity_partner.Custom2('RelationToMeShort', ROOT.Char)], Ta không bao giờ muốn làm tổn thương Ngài. Ta thề! Ta... Ta sẽ kể hết mọi chuyện. Ta đã chia sẻ giường với "
	infidelity_confrontation.1000.confession.your_lovername.desc:0 "[infidelity_partners_lover.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)]."
	infidelity_confrontation.1000.confession.my_lovername.desc:0 "[infidelity_partners_lover.Custom2('MyCharacterIntroductionNoComma', infidelity_partner)]."
	infidelity_confrontation.1000.confession.apologetic_end.desc:0 """
	infidelity_confrontation.1000.confession.unapologetic_start.desc:0 "[infidelity_partner.GetFirstNameNoTooltip] không ngờ đến lời buộc tội của Ta, điều đó rõ ràng. Tuy nhiên, [infidelity_partner.GetSheHe|U] không bị lay chuyển lâu.\n\n\"Ngài mất khá lâu mới nhận ra, #EMP [infidelity_partner.Custom2('RelationToMeShort', ROOT.Char)]#!\" Lời của [infidelity_partner.GetHerHis|U] đầy độc địa. \"Vâng, Ta đã nằm với người khác – "
	infidelity_confrontation.1000.confession.unapologetic_end_opposite_sex.desc:0 "Ta thà ngủ với cả trăm [infidelity_partners_lover.GetWomenMen] còn hơn ở một đêm với Ngài.\""
	infidelity_confrontation.1000.confession.unapologetic_end_same_sex.desc:0 "[infidelity_partners_lover.GetSheHe|U] gấp đôi [infidelity_partners_lover.GetWomanMan] mà Ngài có thể trở thành.\""
 	#Regular desc
	infidelity_controntation.1000.partner_exposed_intro.desc:0 "[infidelity_partner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã thú nhận có quan hệ ngoài luồng với [infidelity_partners_lover.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\n"
	infidelity_controntation.1000.partners_lover_exposed_intro.desc:0 "[infidelity_partners_lover.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã thú nhận có quan hệ ngoài luồng với [infidelity_partner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\n"
	infidelity_controntation.1000.exposed_intro.desc:0 "[exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã vạch trần mối quan hệ ngoài luồng của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('infidelity_partner'))] [infidelity_partner.GetFirstNamePossessive] với [infidelity_partners_lover.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\n"
	infidelity_controntation.1000.investigation_intro.desc:0 "Cuộc điều tra của Ta thành công, và nỗi sợ của Ta được xác nhận. [infidelity_partner.GetSheHe|U] đang có quan hệ ngoài luồng với [infidelity_partners_lover.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\n"
	infidelity_controntation.1000.exposed_knew.desc:0 "Giờ khi mọi chuyện đã bại lộ, [ROOT.Char.Custom2('RelationToMeShort', infidelity_partner )] của Ta và [infidelity_partner.GetHerHis] [infidelity_partners_lover.Custom2('InsultNounSexual', ROOT.Char)] sắp phải đối mặt với hậu quả của hành động của họ."
	infidelity_controntation.1000.start_lover.desc:0 "Như thể lấy thêm tình nhân chưa đủ,"
	infidelity_controntation.1000.start_spouse.desc:0 "Như thể phá vỡ sự thiêng liêng của hôn nhân chưa đủ,"
	infidelity_controntation.1000.incest.desc:1 "đứa [infidelity_partner.Custom2('InsultNoun', ROOT.Char)] mang danh [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('infidelity_partner'))] của ta lại đi chung giường với [infidelity_partners_lover.GetHerHim] trong số tất cả mọi người! Chính #EMP [infidelity_partner.Custom2('RelationToMeShort', SCOPE.sC('infidelity_partners_lover'))]#!! của [infidelity_partner.GetHerHis|U]\n\nCó lẽ ta nên biết từ trước. Họ lúc nào cũng... thân thiết như thế. Ôi, [ROOT.Char.GetFaith.HighGodName]. Ý nghĩ về việc họ ở bên nhau... Nó làm ta buồn nôn."
	infidelity_controntation.1000.sodomy.desc:1 "đứa [infidelity_partner.Custom2('InsultNoun', ROOT.Char)] mang danh [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('infidelity_partner'))] của ta lại đi chung giường với [infidelity_partners_lover.GetHerHim] trong số tất cả mọi người! Lại một kẻ #EMP [infidelity_partner.GetWomanMan]#! khác!!\n\nÔi, [ROOT.Char.GetFaith.HighGodName]. Nghĩ đến cảnh họ... ở bên nhau... Nó làm ta buồn nôn."
	infidelity_controntation.1000.regular.desc:0 "Sao [infidelity_partner.GetTitledFirstName] có thể chia sẻ chiếc giường của [infidelity_partner.GetHerHis] với kẻ khác chứ? Sao [infidelity_partner.GetSheHe] có thể phản bội ta như thế này? Có lẽ ta sẽ chẳng bao giờ biết được lý do của [infidelity_partner.GetHerHis], nhưng dường như không còn nghi ngờ gì về tội lỗi của [infidelity_partner.GetHerHis] nữa."
 	#Options
	infidelity_confrontation.1000.demand_break_up.lover:0 "Hãy chọn. Là [infidelity_partners_lover.GetHerHim] hoặc Ta!"
	infidelity_confrontation.1000.demand_break_up.spouse:0 "Chấm dứt, hoặc #EMP sẽ#! có hậu quả!"
	infidelity_confrontation.1000.demand_break_up.success:0 "[infidelity_partner.GetFirstNameNoTooltip] chấp nhận yêu cầu của Ngài"
	infidelity_confrontation.1000.break_up.failure:0 "[infidelity_partner.GetFirstNameNoTooltip] từ chối chấm dứt mối quan hệ"
	infidelity_confrontation.1000.demand_break_up.flavor:0 "[infidelity_partner.GetFirstNameNoTooltip] có khả năng đồng ý nếu [infidelity_partner.GetSheHe] sợ hậu quả"
	infidelity_confrontation.1000.plead_break_up:0 "Người yêu, Ta van xin Ngài! Hãy chấm dứt sai lầm này!"
	infidelity_confrontation.1000.plead_break_up.flavor:1 "[infidelity_partner.GetFirstNameNoTooltip] có khả năng đồng ý nếu [infidelity_partner.GetSheHe] quan tâm hoặc thương hại Ngài"
	infidelity_confrontation.1000.plead_break_up.success:0 "[infidelity_partner.GetFirstNameNoTooltip] chấm dứt mối quan hệ ngoài luồng và cầu xin sự tha thứ"
	infidelity_confrontation.1000.break_up:0 "Ta #EMP biết#! [infidelity_partner.GetSheHe] không xứng đáng với sự quan tâm của Ta."
	infidelity_confrontation.1000.expose:0 "Thế giới sẽ biết về mối quan hệ bẩn thỉu của Ngài!"
	infidelity_confrontation.1000.blackmail:0 "Chắc chắn, Ngài muốn chuyện này giữ bí mật..."
	infidelity_confrontation.1000.imprison:0 "Tình yêu sẽ giữ ấm cho Ngài trong ngục tối."
	infidelity_confrontation.1000.opt_out:0 "Ta cần thời gian để suy nghĩ..."
	infidelity_confrontation.1000.opt_out.knew:0 "Ta mệt mỏi với trò hề này."
	infidelity_confrontation.1000.opt_out.blackmail.tt:0 "Ta có thể cân nhắc việc [blackmailing|E] [infidelity_partner.GetShortUIName], cho [infidelity_partner.GetHerHim] nếm mùi gậy ông đập lưng ông, hoặc tha thứ cho [infidelity_partner.GetHerHim]"
	infidelity_confrontation.1000.opt_out.divorce.tt:0 "Ta có thể cân nhắc việc [divorcing|E] [infidelity_partner.GetShortUIName], cho [infidelity_partner.GetHerHim] nếm mùi gậy ông đập lưng ông, hoặc tha thứ cho [infidelity_partner.GetHerHim]"
	infidelity_confrontation.1000.opt_out.fallback.tt:0 "Ta có thể cân nhắc việc cho [infidelity_partner.GetShortUIName] nếm mùi gậy ông đập lưng ông, hoặc tha thứ cho [infidelity_partner.GetHerHim]"
 
# Demand break up branch: Demand is presented to infidelity partner, by Mathilda Bjarnehed
	infidelity_confrontation.1010.start.desc:0 ""Ta biết mọi chuyện về mối quan hệ bẩn thỉu giữa Ngài và [infidelity_partners_lover.GetTitledFirstNamePossessive]! Đừng phí lời phủ nhận nữa!""
	infidelity_confrontation.1010.sad.desc:0 "Giọng [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('confronting_partner'))] [confronting_partner.GetFirstNamePossessive] run rẩy, nước mắt tuôn dài trên má [confronting_partner.GetHerHis].\n\n"
	infidelity_confrontation.1010.angry.desc:0 "Tiếng hét của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('confronting_partner'))] [confronting_partner.GetFirstNamePossessive] vang dội trong xương Ta. Ta phải dùng hết sức để không chùn bước.\n\n"
	infidelity_confrontation.1010.break_up.desc:0 ""Ta không chịu nổi nữa, [ROOT.Char.GetFirstNameNoTooltip]. Ngài phải lựa chọn. Là [infidelity_partners_lover.GetHerHim] hay là Ta!""
	infidelity_confrontation.1010.celibacy.desc:0 ""Nếu Ngài không rời bỏ [infidelity_partners_lover.GetHerHim], Ta sẽ không bao giờ chia giường với Ngài nữa!""
	infidelity_confrontation.1010.imprisonment.desc:0 ""Nếu Ngài từ chối rời bỏ [infidelity_partners_lover.GetHerHim], Ta sẽ chia cắt Ngài bằng song sắt!""
	infidelity_confrontation.1010.a:0 "Ta sẽ chấm dứt, Ta thề!"
	infidelity_confrontation.1010.c:0 "Hãy làm điều Ngài muốn — [infidelity_partners_lover.GetSheHe] và Ta sinh ra là để thuộc về nhau!"
 
# Demand break up branch: Demand is accepted, by Mathilda Bjarnehed
	infidelity_confrontation.1011.unapologetic_start.desc:0 "Đôi mắt [infidelity_partner.GetFirstNamePossessive] bừng cháy như lửa dữ, nhưng giọng nói [infidelity_partner.GetHerHis] lạnh như băng.\n\n\"Ngài có nghĩ rằng lời đe dọa sẽ hàn gắn được"
	infidelity_confrontation.1011.unapologetic_marriage.desc:0 "hôn nhân,"
	infidelity_confrontation.1011.unapologetic_love.desc:0 "tình yêu,"
	infidelity_confrontation.1011.unapologetic_end.desc:0 "[ROOT.Char.GetFirstNameNoTooltip]? Được thôi. Hãy làm theo ý Ngài. Nhưng đừng tự lừa mình — Ta không hối hận vì những gì Ta đã làm. Ngay cả trong một giây cũng không.""
	infidelity_confrontation.1011.a:0 "Liệu mọi thứ có thể trở lại như xưa giữa chúng ta?"
	infidelity_confrontation.1011.apologetic_start.desc:0 "Nước mắt rơi trên má [infidelity_partner.GetFirstNamePossessive]. Liệu đó có phải là nước mắt hối hận, hay là sợ hãi, Ta tự hỏi?\n\n\"Xin Ngài, hãy tha thứ cho Ta. Ta van Ngài! Ta sẽ chấm dứt, tất nhiên là Ta sẽ. Đó là một sai lầm ngớ ngẩn — không hơn! Ta thề!\""

# Demand break up branch: Demand is rejected, by Mathilda Bjarnehed
	infidelity_confrontation.1012.apologetic_start.desc:0 "[infidelity_partner.GetFirstName] vẫn im lặng khi Ta đưa ra yêu cầu, nước mắt chảy dài trên má [infidelity_partner.GetHerHis]. Nhưng khi [infidelity_partner.GetSheHe] cuối cùng lên tiếng, lời nói [infidelity_partner.GetHerHis] không như Ta mong đợi.\n\n"
	infidelity_confrontation.1012.apologetic_imprisonment.desc:0 ""Ta xin lỗi, nhưng Ta không thể làm được. Ta thà dành cả phần đời còn lại trong ngục tối còn hơn phủ nhận tình cảm của Ta dành cho [infidelity_partners_lover.GetFirstName]. Nếu Ngài ghét Ta đến vậy — nếu Ngài muốn thấy Ta đau khổ — thì mặc kệ.""
	infidelity_confrontation.1012.apologetic_break_up.desc:0 ""Ta chưa bao giờ muốn làm tổn thương Ngài, và vì điều đó Ta xin lỗi. Nhưng Ta không thể phủ nhận tình cảm của mình với [infidelity_partners_lover.GetFirstName]. Những gì chúng ta có — không gì sánh bằng. Ngay cả Ngài cũng không.""
	infidelity_confrontation.1012.unapologetic_imprisonment.desc:0 "[ROOT.Char.GetFirstNameNoTooltip]? Ta thà dành cả đời còn lại trong ngục tối còn hơn một giây nữa bên Ngài!""
	infidelity_confrontation.1012.unapologetic_break_up.desc:0 "[ROOT.Char.GetFirstNameNoTooltip]? Ngài luôn là kẻ ngốc. Cảm ơn vì đã mở mắt cho Ta. Chưa bao giờ Ta thấy Ngài rõ ràng hơn thế!""
	infidelity_confrontation.1012.a:0 "Được thôi! Làm theo ý Ngài, [infidelity_partner.Custom2('InsultAdjective', ROOT.Char)] [infidelity_partner.Custom2('InsultNounSexual', ROOT.Char)]!"

 # Demand break up branch: break up notification for the infidelity partner's lover, by Mathilda Bjarnehed
	infidelity_confrontation.1013.t:1 "[infidelity_partners_lover.Custom2('AppropriateGreeting', infidelity_partner)]"
	infidelity_confrontation.1013.love.desc:1 "[ROOT.Char.Custom('LoverPetName')|U], Ta đã nghĩ chúng ta sẽ luôn ở bên nhau, không gì có thể chia cắt. Nhưng dù Ta có quan tâm đến Ngài đến đâu, Ta không thể bỏ qua thực tế phũ phàng của tình huống này. Những giấc mơ của chúng ta, dù ngọt ngào và hoàn hảo đến đâu, cũng chỉ là giấc mơ. Và giờ sẽ chẳng còn bao giờ.\n\nDù sao đi nữa, chúng ta vẫn phải sống tiếp, tình yêu của Ta. Nếu chúng ta không thể bên nhau ở đời này, chúng ta phải kiên nhẫn chờ đợi kiếp sau."
	infidelity_confrontation.1013.like.desc:0 "Người thân yêu [ROOT.Char.Custom('LoverPetName')]. Ta viết lá thư này với trái tim nặng trĩu. Chúng ta đã có một giấc mơ, một giấc mơ tuyệt vời và hạnh phúc. Nhưng đó chưa bao giờ vượt quá giấc mơ, và dù đau lòng đến đâu, câu trả lời rõ ràng. Chúng ta không thể tiếp tục bên nhau.\n\nTa muốn cảm ơn Ngài vì mọi khoảnh khắc tốt đẹp. Ta sẽ không bao giờ quên chúng. Mong Ngài sống lâu và hạnh phúc."
	infidelity_confrontation.1013.neutral.desc:0 "Mối quan hệ của chúng ta, dù thú vị đến đâu, không còn là chuyện riêng nữa. Nó tốt khi tồn tại, nhưng giờ, nó phải kết thúc.\n\nHãy chăm sóc bản thân, [ROOT.Char.GetTitledFirstNameNoTooltip]. Lời chia tay này có thể đau hôm nay, nhưng Ta đảm bảo — nó sẽ sớm bị lãng quên."
	infidelity_confrontation.1013.a:0 "Và thậm chí còn không được hôn tạm biệt..."

 # Plead for break up branch: infidelity partner is presented with request, by Mathilda Bjarnehed
	infidelity_confrontation.1001.kind_start.desc:0 "Nước mắt của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('confronting_partner'))] [confronting_partner.GetFirstNamePossessive] đau hơn bất cứ lời nói nặng lời nào. Ta đứng sững sờ khi"
	infidelity_confrontation.1001.unkind_start.desc:0 "Liệu nước mắt của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('confronting_partner'))] [confronting_partner.GetFirstNamePossessive] có thật không? Có lẽ đó chỉ là một màn kịch, nhằm đánh thức lòng thương hại của Ta? Ta thở dài exasperated khi"
	infidelity_confrontation.1001.love_end.desc:0 "[confronting_partner.GetSheHe] vùi khuôn mặt của [confronting_partner.GetHerHis] vào [ROOT.Char.Custom('GetClothingArticle')] của ta.\n\n"[ROOT.Char.GetFirstNameNoTooltip], sao người có thể làm như vậy? Ta yêu người, đồ [ROOT.Char.GetWomanMan] ngốc nghếch kia!" [confronting_partner.GetFirstName] hít một hơi dài, run rẩy. "Hãy trở lại với ta, [ROOT.Char.Custom('LoverPetName')] của ta. Hãy rời bỏ kẻ [infidelity_partners_lover.Custom2('InsultNoun', SCOPE.sC('confronting_partner'))] đó và mọi thứ sẽ được tha thứ.""
	infidelity_confrontation.1001.regular_end.desc:0 "[confronting_partner.GetSheHe] lau má của [confronting_partner.GetHerHis] bằng một chiếc khăn tay.\n\n"Ta biết mình có thể không phải là một [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('confronting_partner'))] hoàn hảo, nhưng ta xứng đáng nhận được điều tốt hơn thế này. Cả hai chúng ta đều vậy. Ta xin người — hãy tỉnh ngộ đi và rời bỏ kẻ [infidelity_partners_lover.Custom2('InsultNoun', SCOPE.sC('confronting_partner'))] đó. Vẫn chưa quá muộn để cứu vãn mọi chuyện đâu.""
	infidelity_confrontation.1020.a:0 "Ta sẽ làm bất cứ điều gì để xứng đáng với sự tha thứ của Ngài!"
	infidelity_confrontation.1020.b:0 "Ta không thể phủ nhận tình cảm với [infidelity_partners_lover.GetFirstNameNoTooltip]!"

 # Plead for breakup branch: request is accepted, by Mathilda Bjarnehed
	infidelity_confrontation.1021.love.desc:0 "Sự nhẹ nhõm trên khuôn mặt của [infidelity_partner.GetFirstNamePossessive] là không thể nhầm lẫn. Cùng với đó là những giọt nước mắt rơi xuống, và khi [infidelity_partner.GetSheHe] gieo [infidelity_partner.GetHerselfHimself] vào lòng ta, ta có thể cảm nhận được sự ướt đẫm của chúng trên cổ mình.\n\n"Ta không xứng đáng nhận được sự tha thứ của người," [infidelity_partner.GetSheHe] thì thầm giữa những tiếng nấc nghẹn. "But ta sẽ làm tất cả mọi thứ trong khả năng của mình để thay đổi điều đó. Ta thề đấy, tình yêu của ta. Ta xin thề bằng cả mạng sống.""
	infidelity_confrontation.1021.regular.desc:0 "Sự hổ thẹn trên khuôn mặt của [infidelity_partner.GetFirstNamePossessive] là không thể nhầm lẫn. "Ta từng tự thuyết phục bản thân rằng mình chẳng làm gì sai trái, nhưng giờ đây khi mọi chuyện đã phơi bày ra ánh sáng..."\n\n[infidelity_partner.GetSheHe|U] lắc đầu với một tiếng thở dài của [infidelity_partner.GetHerHis]. "Ta cuối cùng cũng đã nhận ra lỗi lầm trong đường lối của mình. Xin hãy tha thứ cho ta, [ROOT.Char.GetFirstNameNoTooltip]. Chúng ta hãy làm lại từ đầu.""
	infidelity_confrontation.1021.a:0 "Sẽ mất thời gian, nhưng chúng ta sẽ xây dựng lại."

 # Plead for breakup branch: request is rejected, by Mathilda Bjarnehed
	infidelity_confrontation.1021.unapologetic_start.desc:0 "\"Bỏ màn kịch đi,\" [infidelity_partner.GetFirstName] nói, [infidelity_partner.Custom('quirk_neg_pp')]. \"Không nước mắt nào khiến Ta thay đổi quyết định. Đừng lãng phí thời gian — cũng như của Ta.\"\n\nLàm sao [infidelity_partner.GetSheHe] có thể lạnh lùng đến vậy?"
	infidelity_confrontation.1022.apologetic_start.desc:0 "[infidelity_partner.GetFirstName] vẫn im lặng khi Ta van xin tình yêu [infidelity_partner.GetHerHis], nước mắt chảy dài trên má [infidelity_partner.GetHerHis]. Nhưng khi [infidelity_partner.GetSheHe] cuối cùng lên tiếng, lời nói [infidelity_partner.GetHerHis] không như Ta mong đợi.\n\n"
	infidelity_confrontation.1022.a:0 "Ta trao Ngài trái tim mình, còn Ngài lại ném đi?"

 # Break up branch: infidelity partner is informed about confronting partner's decision to end it, by Mathilda Bjarnehed
	infidelity_confrontation.1030.t:0 "[confronting_partner.Custom2('AppropriateGreetingNegative', infidelity_partner)]"
	infidelity_confrontation.1030.desc:0 "Ta đã nghe về mối quan hệ bẩn thỉu của Ngài với [infidelity_partners_lover.GetTitledFirstName]. Cảm ơn Ngài đã bộc lộ bản chất thật rõ ràng như vậy!\n\nKhông còn nghi ngờ gì nữa; Ta đã lãng phí thời gian và sự quan tâm cho một [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('confronting_partner'))] [ROOT.Char.Custom2('InsultNounSexual', SCOPE.sC('confronting_partner'))]. Ngài thậm chí không xứng đáng với mực từ bút Ta! Một khi lá thư này được gửi, Ta sẽ không dành thêm một suy nghĩ nào cho Ngài nữa."
	infidelity_confrontation.1030.a:0 "Nếu Ngài chịu để Ta giải thích!"


 
