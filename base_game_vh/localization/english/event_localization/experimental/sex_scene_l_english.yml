 #Garden
  sex_scene.0003.opening_garden_1:1 "[second.Custom2('RelationToMe', SCOPE.sC('second'))] của ta đến với ta khi ta đang dạo bước trong khu vườn. Hương da [second.GetHerHis] hòa với vị ngọt của hoa."
  sex_scene.0003.conclusion_garden_1:1 "[second.GetSheHe|U] rời đi, để lại ta thỏa mãn và thư thái phía sau một hàng rào cây."

 #Private chambers
  sex_scene.0003.opening_private_chambers_1:1 "Với trái tim đập dồn dập, ta mở khóa cửa để cho [second.GetHerHim] bước vào phòng riêng của mình."
  sex_scene.0003.conclusion_private_chambers_1:0 "Nhiều giờ sau, chúng ta vẫn vẽ những hoa văn bằng những ngón tay vuốt ve, viết những thông điệp yêu thương lên làn da của nhau."

 #The Stables
  sex_scene.0003.opening_stables_1:1 "Sẽ là một vụ bê bối nếu ta bị bắt gặp cùng [second.Custom2('RelationToMe', SCOPE.sC('second'))] của mình, nhưng tối hôm đó không có ai khác trong chuồng ngựa."
  sex_scene.0003.conclusion_stables_1:0 "Ta chỉ hy vọng những tiếng rên rỉ đam mê của chúng ta bị lấn át bởi tiếng vó và tiếng hí của lũ ngựa."

#A copse
  sex_scene.0003.opening_copse_1:1 "Ta gặp [second.Custom2('RelationToMe', SCOPE.sC('second'))] của mình trong một lùm cây không xa [second.Custom('ResidenceBuilding')]. Tim ta đập mạnh, dù biết chẳng ai thấy chúng ta ở đó..."
  sex_scene.0003.conclusion_copse_1:1 "Một lúc lâu sau khi [second.GetSheHe] rời đi, bãi cỏ nơi ta nằm vẫn còn giữ lại hơi ấm của [second.GetHerHis]."

#The kitchen
  sex_scene.0003.opening_kitchen_1:1 "Một người hầu có thể bước vào bếp bất cứ lúc nào! Ta gần như phản đối khi [second.GetSheHe] kéo ta về phía mặt bàn, giật lấy [second.Custom('GetClothingArticle')] của ta. Nhưng chỉ là gần như."
  sex_scene.0003.conclusion_kitchen_2:1 "Nhiều giờ sau ta vẫn còn cảm thấy sự dính dáp của lớp kem mà [second.GetSheHe] đã đổ lên ngực ta."
  sex_scene.0003.conclusion_kitchen_3:0 "Đó là một cơn kích thích đầy hứng khởi, dù chỉ thoáng qua. Có lẽ ngày mai ta sẽ bỏ qua món hầm."


