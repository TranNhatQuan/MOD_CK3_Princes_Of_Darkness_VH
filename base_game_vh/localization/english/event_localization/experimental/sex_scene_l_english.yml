  sex_scene.0001.last_1:1 "Sau đó ta nhẹ nhàng vuốt ve cơ thể [second.GetHerHis] bằng bàn tay mình."
  sex_scene.0001.last_2:1 "Đẫm mồ hôi của cả hai, [second.GetSheHe] buông mình và ngã xuống trên ta."
  sex_scene.0001.last_3:1 "Khi chúng ta cuối cùng rời nhau, ta thấy ký ức khoái lạc lóe lên trong đôi mắt [second.GetHerHis], phản chiếu như của chính ta."
  sex_scene.0001.last_4:0 "Với một nụ hôn cuối cùng đầy cuốn hút, tất cả kết thúc. Khoảnh khắc này sẽ trở lại trong giấc mơ của ta suốt phần đời còn lại."
  sex_scene.0001.last_5:1 "[second.GetSheHe|U] dường như hơi ngượng ngùng khi chúng ta rời nhau. Một sự đối lập đáng yêu với niềm đam mê chúng ta vừa chia sẻ."
  sex_scene.0001.last_6:1 "Khi [second.GetSheHe] bước đi, [second.GetSheHe] ngoái lại nhìn ta. [second.GetSheHe|U] cắn môi [second.GetHerHis] với nụ cười trìu mến."
  sex_scene.0001.a:1 "Hẹn lần sau, [second.GetFirstNameNoTooltip]."

