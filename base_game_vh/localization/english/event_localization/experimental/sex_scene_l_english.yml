  sex_scene.0001.t:0 "Một Khoảnh Khắc Bên Nhau"
  sex_scene.0001.opening_1:1 "Ta ôm lấy [second.GetHerHim] – cơ thể [scope.GetHerHis] khao khát áp vào ta, hơi thở [second.GetHerHis] nặng nề bên tai ta."
  sex_scene.0001.opening_2:1 "Da kề da – không còn rào cản nào giữa cơ thể chúng ta khi ta tìm đến nhau."
  sex_scene.0001.opening_3:1 "Đôi mắt [second.GetHerHis|U] cháy bỏng dục vọng khi nhìn vào ta, khi lướt dọc cơ thể ta, khi y phục ta rơi xuống."
  sex_scene.0001.opening_4:1 ""Hãy cho ta thấy cảm xúc của ngươi," [second.GetSheHe] thì thầm, hơi thở nặng nề khi [second.GetSheHe] tháo dây [ROOT.GetCharacter.Custom('GetClothingArticle')] của ta."
  sex_scene.0001.opening_5:0 "Khi làn da mịn màng được giải thoát khỏi lớp vải, một làn sóng ham muốn mãnh liệt chợt dâng lên trong ta."
  sex_scene.0001.opening_6:1 "Miệng [second.GetHerHis|U] của ngài, những đôi môi mềm mại đó, cái lưỡi tìm kiếm đó. Đôi mắt [second.GetHerHis|U] của ngài mỉm cười với ta."
  sex_scene.0001.opening_7:1 "Khi thấy [second.GetHerHim] trước mặt ta, nhu cầu ấy quá lớn để có thể kiềm chế."
  sex_scene.0001.opening_8:1 "Chưa từng có âm thanh nào khơi dậy trong ta dục vọng như những lời [second.GetSheHe] đang thì thầm bên tai."

  sex_scene.0001.second_1:1 "Ta cảm thấy cơn khao khát được chạm vào [second.GetHerHis] cháy bỏng trên da mình."
  sex_scene.0001.second_2:1 "Những tiếng rên gọi tên ta của [second.GetHerHis|U] nhanh chóng trở nên lớn hơn khi chuyển động của chúng ta trở nên cuồng nhiệt."
  sex_scene.0001.second_3:1 "Giữa những nụ hôn nồng nhiệt, hơi thở dồn dập và nhịp tim dồn dập, không còn ranh giới giữa khoái cảm của [second.GetHerHis] và của ta."
  sex_scene.0001.second_4:1 "[second.GetSheHe|U] vòng tay nhẹ quanh cổ ta, kéo đôi môi ta lại gần. Trong khoảnh khắc ta kháng cự, nhưng chỉ là một khoảnh khắc."
  sex_scene.0001.second_5:0 "Không do dự, không chậm trễ, không thời gian cho sự dịu dàng. Chỉ còn lại dục vọng của ta."
  sex_scene.0001.second_6:1 "Những ngón tay khẽ lướt trên cơ thể [second.GetHerHis] khiến [second.GetHerHim] vặn mình dưới sự chạm của ta, cong người lên để đòi hỏi thêm."
  sex_scene.0001.second_7:1 "Những khao khát đau nhức của chúng ta gặp nhau, và với một cú đẩy trơn tru chúng ta hòa làm một."
  sex_scene.0001.second_8:1 "[second.GetSheHe|U] cọ sát vào ta, cơ thể [second.GetHerHis] van nài một sự giải thoát nào đó."
  sex_scene.0001.second_9:1 "[second.GetSheHe|U] hướng dẫn tay ta xuống giữa hai chân [second.GetHerHis] của ngài để cho ta thấy [second.GetSheHe] [second.Custom('wet_hard')] đến mức nào."

  sex_scene.0001.third_1:0 "Cường độ ấy cuốn lấy cả hai chúng ta, thế giới xoay quanh trục chỉ có khoảnh khắc này."
  sex_scene.0001.third_2:1 "Ta biết rằng trong khoảnh khắc này, [second.GetSheHe] là của ta, và chỉ của riêng ta..."
  sex_scene.0001.third_3:1 "Da [second.GetHerHis] nổi gai khi ta để những ngón tay khẽ lướt trên cơ thể [second.GetHerHis]. Chẳng mấy chốc sự chạm trở nên mạnh mẽ hơn, và khao khát hơn. Siết chặt."
  sex_scene.0001.third_4:0 "Ta tiếp tục, vượt qua mọi giới hạn của kiệt sức hay lý trí; không còn gì ngoài hai chúng ta."
  sex_scene.0001.third_5:1 "Chưa từng ai khiến ta cảm thấy như thế này trước đây. [second.GetSheHe|U] mỉm cười nhìn xuống ta. [second.GetSheHe|U] biết."
  sex_scene.0001.third_6:1 "Ta tưởng mình biết cách dập tắt ngọn lửa này, nhưng [second.GetSheHe] chỉ khiến nó cháy mạnh hơn nữa, cho đến khi nó vượt quá sức chịu đựng của bất kỳ ai."

