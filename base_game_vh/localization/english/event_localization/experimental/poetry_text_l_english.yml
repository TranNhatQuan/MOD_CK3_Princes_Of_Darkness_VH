l_english:
 first_line_text_set_1_A:0 "Ta là một đóa hoa dịu dàng, mong manh"
 first_line_text_set_1_B:0 "Ta ước gì ngài mời ta vào khu vườn riêng của ngài"
 first_line_text_set_2_A:0 "Ngài là vì sao dẫn lối đời ta"
 first_line_text_set_2_B:0 "Ta khá chắc rằng ta không phải người Thụy Sĩ"
 second_line_text_set_1_A:0 "Ngài khiến ta liên tưởng đến một tòa tháp"
 second_line_text_set_1_B:0 "Và ta nắm trong tay biết bao quyền lực phong kiến"
 second_line_text_set_2_A:0 "Quả thật, đó là nguồn cội mọi niềm hạnh phúc của ta"
 second_line_text_set_2_B:0 "Mọi thứ tan chảy trong một nụ hôn dịu dàng"
 third_line_text_set_1_A:0 "Có lẽ ta nên dành thêm thời gian suy ngẫm"
 third_line_text_set_1_B:0 "Có lẽ ta nên làm gì đó với mùi hôi này"
 third_line_text_set_2_A:0 "Dọc theo đường bay của một chú chim nhỏ"
 third_line_text_set_2_B:0 "Đâu đó giữa phô mai dê và sữa đông"
 fourth_line_text_set_1_A:0 "Nhưng ta lại yêu cái cảm giác đang chìm xuống"
 fourth_line_text_set_1_B:0 "Chỉ đùa thôi, hãy uống thêm vài chén nữa"
 fourth_line_text_set_2_A:0 "Tất cả chỉ gói gọn trong một lời"
 fourth_line_text_set_2_B:0 "Xin thứ lỗi cho sự ngớ ngẩn của ta"
 poetry_line_break:0 "\n"
 # Lines from the Song of Roland
 poetry.0002.t:0 "Một Bài Thơ!"
 # First line
 0002.blank_verse_line_1_A:0 " Vua Marsilies đang ở tại Sarraguce,"
 0002.blank_verse_line_1_B:0 " Blancandrins là một kẻ ngoại giáo rất khôn ngoan,"
 0002.blank_verse_line_1_C:0 " Vua Charles, chúa thượng và quân vương của chúng ta,"
 0002.blank_verse_line_1_D:0 " Vị hoàng đế ấy giờ đây vui vẻ và táo bạo,"
 # Second line
 0002.blank_verse_line_2_A:0 " Ngài bước vào một khu vườn mát lành;"
 0002.blank_verse_line_2_B:0 " Trong thân phận chư hầu, ông là một hiệp sĩ dũng cảm,"
 0002.blank_verse_line_2_C:0 " Tròn bảy năm chinh chiến nơi đất Tây Ban Nha,"
 0002.blank_verse_line_2_D:0 " Cordres nằm trong tay ngài, tường thành đã sụp đổ,"
 # Third line
 0002.blank_verse_line_3_A:0 " Tại đó ngài ngồi trên ngai đá cẩm thạch xanh,"
 0002.blank_verse_line_3_B:0 " Đứng đầu về dũng lực, ông đứng cạnh quân vương."
 0002.blank_verse_line_3_C:0 " Chinh phục miền đất ấy và cả biển Tây,"
 0002.blank_verse_line_3_D:0 " Máy bắn đá của ngài đã phá nát thành quách và tháp canh."
 # Fourth line
 0002.blank_verse_line_4_A:0 " Chung quanh ngài là hai vạn quân sĩ đứng chầu."
 0002.blank_verse_line_4_B:0 " Và ông nói rằng: 'Xin đừng kinh hãi!'"
 0002.blank_verse_line_4_C:0 " Giờ đây không còn pháo đài nào chống nổi ngài,"
 0002.blank_verse_line_4_D:0 " Bạc vàng cùng vô số y phục nạm ngọc."



# Lines from the Song of Roland for now

 poetry.0003.t:0 "Bài Thơ Về [ROOT.GetCharacter.Custom('theme_announcement')|UD]"
 # First line
 0003.line_1_A:0 "Một miền đất bị tàn phá bởi [ROOT.GetCharacter.Custom('noun_specific_singular_one')|D] hung tàn"
 0003.line_1_B:0 "Trong một thời đại dài đằng đẵng của [ROOT.GetCharacter.Custom('noun_abstract_plural_one')|D]"
 0003.line_1_C:0 "[ROOT.GetCharacter.Custom('noun_specific_singular_two')|D] Vua Charles, chúa thượng và quân vương của chúng ta,"
 0003.line_1_D:0 "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] Vị hoàng đế ấy giờ đây vui vẻ và táo bạo,"
 # Second line
 0003.line_2_A:0 "Chúng ta đều khuất phục trước [ROOT.GetCharacter.Custom('noun_abstract_singular_one')|D] tàn nhẫn ấy"
 0003.line_2_B:0 "Giờ đây nhìn đời bằng đôi mắt của [ROOT.GetCharacter.Custom('noun_abstract_plural_two')|D]"
 0003.line_2_C:0 "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] Tròn bảy năm chinh chiến nơi đất Tây Ban Nha,"
 0003.line_2_D:0 "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] Cordres nằm trong tay ngài, tường thành đã sụp đổ,"
 # Third line
 0003.line_3_A:0 "Nếu ta không thể chạm đến [ROOT.GetCharacter.Custom('noun_specific_singular_two')|D] của ngài"
 0003.line_3_B:0 "Sau [ROOT.GetCharacter.Custom('two_syllable_number')|D] năm của [ROOT.GetCharacter.Custom('noun_abstract_plural_two')|D]"
 0003.line_3_C:0 "[ROOT.GetCharacter.Custom('noun_specific_singular_two')|D] Chinh phục miền đất ấy và cả biển Tây,"
 0003.line_3_D:0 "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] Máy bắn đá của ngài đã phá nát thành quách và tháp canh."
 # Fourth line
 0003.line_4_A:0 "Chúng có thể không bao giờ chiếm được [ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] của ta"
 0003.line_4_B:0 "Chẳng bao lâu nữa [ROOT.GetCharacter.Custom('noun_specific_plural_two')|D] sẽ bị lãng quên"
 0003.line_4_C:0 "[ROOT.GetCharacter.Custom('noun_specific_singular_two')|D] Giờ đây không còn pháo đài nào chống nổi ngài,"
 0003.line_4_D:0 "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] Bạc vàng cùng vô số y phục nạm ngọc."
 0003.poetry_from:0 "[actor.GetTitledFirstName] đã viết tặng ngài một bài thơ\n\n"


