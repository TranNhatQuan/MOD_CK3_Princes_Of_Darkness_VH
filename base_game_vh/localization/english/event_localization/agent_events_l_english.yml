 scheme_type_contract: "hợp đồng"
 scheme_type_scheme: "âm mưu"
 scheme_type_contracts: "hợp đồng"
 scheme_type_schemes: "âm mưu"

 #################################################
 # General Agent Events

 agent_events.0001.t: "Thân Như Trộm Cướp"
 agent_events.0001.desc: "Kể từ khi chiêu mộ cả [char_1.GetTitledFirstName] và [char_2.GetTitledFirstName] vào [scheme.Custom('GetSchemeContract')] của Ta, cặp đôi này đã trở nên khá thân thiện với nhau.\n\nCó vẻ như những nhiệm vụ chung và mối bận tâm chung đã khơi lên một tia đồng cảm giữa hai kẻ vô lại này.\n\nSự thấu hiểu của họ vẫn chưa có gì nghiêm trọng, nhưng chỉ cần một chút thúc đẩy nữa thì Tình bạn thực sự có thể nảy nở."
 agent_events.0001.a: "Ý ngươi là động lực à..."
 agent_events.0001.b: "Có lẽ sự hòa hợp của họ sẽ mang lại kết quả tốt..."
 agent_events.0001.b.tt.success: "Những sợi dây tình cảm được thắt chặt"
 agent_events.0001.b.tt.failure: "Ngài không thể thúc đẩy họ thêm"
 agent_events.0001.c: "Hãy tập trung vào nhiệm vụ trước mắt."
 agent_events.0001.d: "Tốt cho họ."

 agent_events.0011.t: "Làm Việc Gần Gũi"
 agent_events.0011.desc: "[char_1.GetTitledFirstName] và [char_2.GetTitledFirstName] dường như đang tận hưởng bản thân hơi #EMP quá#! nhiều so với vai trò khiêm tốn của họ trong kế hoạch của Ta.\n\nĐiểm chung trong kế hoạch nhỏ của chúng ta nhằm [scheme.GetName] đã dẫn đến sự tôn trọng lẫn nhau, và điều đó rõ ràng đang dần trở thành một mối liên kết bền chặt.\n\nDù khởi đầu của nó có vẻ khó tin đến đâu."
 agent_events.0011.a: "Một Tình bạn được rèn nên nhờ ân huệ của ta!"
 agent_events.0011.b: "[char_1.GetFirstNameNoTooltip] #EMP thật sự#! thú vị..."
 agent_events.0011.c: "[char_2.GetFirstNameNoTooltip] có thể chọn người tốt hơn."
 agent_events.0011.d: "Ba chúng ta hãy cùng làm Ngài."
 agent_events.0011.e: "Ta rất vui khi tất cả chúng ta hòa thuận!"
 agent_events.0011.f: "Đây không phải buổi tụ họp xã giao."

 agent_events.0012.t: "Làm Việc Gần Gũi Hơn"
 agent_events.0012.desc: "[char_1.GetTitledFirstName] và [char_2.GetTitledFirstName] dường như đang tận hưởng bản thân hơi #EMP quá#! nhiều so với vai trò khiêm tốn của họ trong kế hoạch của Ta.\n\nNhững ánh nhìn lén lút, lời thì thầm khe khẽ, những lá thư trao tay dưới danh nghĩa khác — nếu Ta đa nghi hơn, có lẽ Ta sẽ không nhận ra đây là dấu hiệu rõ ràng của một mối quan hệ chớm nở đang chờ bén rễ.\n\nKhông #EMP hẳn#! là mục đích của kế hoạch nhằm [scheme.GetName]."
 agent_events.0012.a: "Và chẳng phải họ nên biết ơn ta vì đã giúp sao?"
 agent_events.0012.b: "Không nghi ngờ gì, đam mê của họ có thể được tận dụng."
 agent_events.0012.c: "Có lẽ đam mê của họ có thể được tận dụng..."
 agent_events.0012.c.tt.success: "Đôi chim tình biến [scheme.GetNameNoTooltip] thành trò chơi"
 agent_events.0012.c.tt.failure: "Tia lửa bị dập tắt"
 agent_events.0012.d: "Đây không phải lý do chúng ta ở đây!"
 agent_events.0012.e: "Ai quan tâm chứ?"
 agent_events.0012.e.tt.become_lovers: "Khởi đầu của điều gì đó hơn thế"
 agent_events.0012.e.tt.not_lovers: "$agent_events.0012.c.tt.failure$"

 agent_events.0021.t: "Học Hỏi Từ Người Giỏi Nhất"
 agent_events.0021.desc.intro: "Hai mật vụ của ta, [char_1.GetTitledFirstName] và [char_2.GetTitledFirstName], dường như đã tìm thấy tiếng nói chung trong kế hoạch của ta ngoài mục tiêu cơ bản.\n\nBị ấn tượng bởi kỹ năng của đồng đội [char_2.GetHerHis] với"
 agent_events.0021.desc.diplomacy: "thư từ, tài hùng biện và nghệ thuật diễn thuyết"
 agent_events.0021.desc.martial: "hậu cần, ý chí và phong thái lãnh đạo"
 agent_events.0021.desc.stewardship: "số học, kế toán và con mắt tinh tường với chi tiết"
 agent_events.0021.desc.intrigue: "sự xảo quyệt, mưu mẹo và những thủ đoạn hai mặt tàn nhẫn"
 agent_events.0021.desc.learning: "trí tuệ, việc đọc sách và kiến thức nói chung"
 agent_events.0021.desc.prowess: "trí nhanh, sức mạnh và thể lực"
 agent_events.0021.desc.outro: "cần thiết để [scheme.GetName], [char_2.GetFirstNameNoTooltip] đã bắt đầu nghiên cứu những gì [char_1.GetFirstNameNoTooltip] làm khác để cải thiện bản thân [char_2.GetHerselfHimself] với hy vọng nâng cao kỹ năng của mình.\n\nVề lý thuyết thì vô hại, nhưng điều đó không giúp ích cho mục tiêu chung của chúng ta."
 agent_events.0021.a: "Tuyệt vời!"
 agent_events.0021.b: "Hãy dùng năng lượng đó cho kế hoạch, đồ ngốc."
 agent_events.0021.c: "Có lẽ ta cũng có thể học được điều gì đó từ chuyện này..."

 agent_events.0031.t: "Học Hỏi Trong Công Việc"
 agent_events.0031.desc: "Trong số những người ta đã chọn để dính líu vào [scheme.Custom('GetSchemeContract')] nhỏ này, [char_1.GetTitledFirstName] có lẽ không phải là người #EMP giỏi nhất#!.\n\nTuy nhiên, [char_1.GetSheHe] rõ ràng đang rất nỗ lực, quyết không để những cố gắng của ta đổ sông đổ bể, với mục đích cải thiện kỹ năng của [char_1.GetHerHis] trong các vấn đề về [scheme.Custom('GetSchemeType')|l].\n\nTự hoàn thiện bản thân là tốn kém, nhưng xét cho cùng thì đều có lợi cho tất cả chúng ta."
 agent_events.0031.a: "Ngươi có thể tiến xa hơn thế!"
 agent_events.0031.a.tt.success: "Bị đẩy tới giới hạn"
 agent_events.0031.a.tt.failure: "Căng sức mà không có kết quả"
 agent_events.0031.b: "Công lao dĩ nhiên thuộc về kẻ chủ mưu của chúng ta."
 agent_events.0031.c: "Kế hoạch đang tiến triển tốt..."

 agent_events.0041.t: "Âm Mưu Học Hành"
 agent_events.0041.desc: "[char_1.GetTitledFirstName] chắc chắn là một tài sản quý giá cho [scheme.Custom('GetSchemeContract')] của Ta, cung cấp kỹ năng, trí tuệ và lời khuyên bất cứ khi nào [char_1.GetSheHe] có thể.\n\nGần đây nhất, điều đó có nghĩa là đề nghị giúp dạy kèm #EMP Ta#!, nhằm cải thiện cơ hội thành công chung của chúng ta.\n\nLời đề nghị đó... #EMP khá hấp dẫn#!, dù có phần tự cao."
 agent_events.0041.a: "Ta chấp nhận."
 agent_events.0041.a.tt.success: "Ngài học được đôi điều"
 agent_events.0041.a.tt.failure: "Phí thời gian"
 agent_events.0041.a.tt.they_attempt_to_teach_you: "[char_1.GetFirstName] sẽ cố dùng [skill|E] của [char_1.GetHerHis] để dạy Ngài #WEAK (việc này dễ hơn nếu kỹ năng của [char_1.GetSheHe] tốt hơn Ngài)#!"
 agent_events.0041.b: "Thật buồn cười! Không."
 agent_events.0041.c: "Hãy tập trung vào nhiệm vụ, không phải vào ta."

 agent_events.1001.t: "Cãi Nhau Không Ngừng"
 agent_events.1001.desc: "Ta hiếm khi nghe hai người cãi nhau nhiều như [char_1.GetTitledFirstName] và [char_2.GetTitledFirstName], hai đồng minh #EMP trên danh nghĩa#! trong [scheme.Custom('GetSchemeContract')] của chúng ta. Dường như có điều gì đó ở đối phương khiến họ luôn khó chịu với nhau.\n\nBan đầu, Ta cố mặc kệ, hy vọng họ tự giải quyết, nhưng rõ ràng nếu không ngăn lại thì điều này sẽ gây tổn hại cho phần còn lại của chúng ta."
 agent_events.1001.a: "Lên lớp cả hai."
 agent_events.1001.a.tt.success: "Họ ghi nhớ lời Ngài"
 agent_events.1001.a.tt.failure: "Lời Ngài rơi vào tai điếc"
 agent_events.1001.b: "Kêu gọi lý trí."
 agent_events.1001.b.tt.success: "$agent_events.1001.a.tt.success$"
 agent_events.1001.b.tt.failure: "$agent_events.1001.a.tt.failure$"
 agent_events.1001.c: "Thù hận cũng không phải công cụ tệ..."
 agent_events.1001.d: "Các ngươi. Phải. Dừng."
 agent_events.1001.e: "Cứ để lũ đó cãi nhau."
 agent_events.1001.e.rivals_bicker: "Cãi vã không ngừng"
 agent_events.1001.e.rivals_bicker_less: "Thỉnh thoảng cãi vã"

 agent_events.1011.t: "Vết Thương Mưng Mủ"
 agent_events.1011.desc: "Có lẽ thật ngu ngốc khi Ta chọn hai người dường như #EMP căm ghét#! nhau để làm trợ thủ cho mình trong [scheme.Custom('GetSchemeContract')] này — những cuộc cãi vã liên miên và sự cay cú vặt vãnh từ [char_1.GetTitledFirstName] và [char_2.GetTitledFirstName] dường như quyết tâm chứng minh điều đó.\n\nDù vậy, bất kể họ ghét nhau thế nào thì họ vẫn phải có khả năng tập trung vào công việc trước mắt."
 agent_events.1011.a: "Buộc họ làm việc cùng nhau."
 agent_events.1011.b: "Cố gắng tách họ ra."
 agent_events.1011.c: "Cứ để mọi thứ như vậy."

 agent_events.2001.t: "Một Người Đồng Sự Tuyệt Vời"
 agent_events.2001.desc: "Thật may mắn khi Ta có cơ hội lên kế hoạch cho [scheme.Custom('GetSchemeContract')] này cùng với [relation.Custom2('MyCharacterIntroduction', ROOT.Char)] ở bên cạnh.\n\nMột trợ thủ tốt hơn, tinh ý hơn thì không [ROOT.Char.GetWomanMan] nào có thể mong đợi — luôn sẵn sàng đi thêm một bước vì nhu cầu của chúng ta, luôn tập trung vào cách tốt nhất để thúc đẩy [scheme.Custom('GetSchemeContract')].\n\nGần đây nhất, công việc của [relation.GetHerHis] đã tạo ra một lối tắt có thể giúp chúng ta tiết kiệm đáng kể thời gian."
 agent_events.2001.a: "Tin tuyệt vời!"

 agent_events.2011.t: "Chương Trình Cá Nhân"
 agent_events.2011.desc: "Cơn điên nào đã khiến Ta đưa [relation.Custom2('MyCharacterIntroduction', ROOT.Char)] vào [scheme.Custom('GetSchemeContract')] của mình?\n\nTên ngốc đó chẳng mang lại gì ngoài rắc rối kể từ ngày đầu tiên Ta lôi [relation.GetHerHim] vào việc này — một cái gai nhỏ khó chịu luôn ở bên cạnh Ta.\n\nTất nhiên là chưa bao giờ công khai phá hoại Ta, nhưng khi mọi thứ Ngài chạm vào đều sai lệch một cách khó hiểu, và luôn có ai đó mỉm cười về điều đó..."
 agent_events.2011.a: "Tên [relation.Custom2('InsultNoun', ROOT.Char)] xảo quyệt đó!"

 agent_events.2021.t: "Một Chút Cạnh Tranh"
 agent_events.2021.desc: "Có vẻ như [scheme.Custom('GetSchemeContract')] của chúng ta đã trở thành một trò chơi đối với [agent_1.GetTitledFirstName] và [agent_2.GetTitledFirstName].\n\nDù trước đây không đặc biệt thân thiết hay hay cãi vã, hai người này đang tận hưởng một cuộc ganh đua nhẹ nhàng xem ai có thể làm nhiệm vụ của mình tốt hơn, mỗi người liên tục cố vượt mặt người kia.\n\nHiện tại chỉ là chuyện nhỏ, nhưng nó chứa mầm mống của điều gì đó dữ dội hơn."
 agent_events.2021.a: "Một chút cạnh tranh thân thiện cũng tốt!"
 agent_events.2021.b: "Một sự kình địch nghiêm túc có thể có lợi..."
 agent_events.2021.c: "Cứ để họ vậy."

 agent_events.3001.t: "Đốt Nến Hai Đầu"
 agent_events.3001.desc: "Rõ ràng là [relation.Custom2('MyCharacterIntroduction', ROOT.Char)] đang chân thành dốc toàn lực vào [scheme.GetName] [scheme.Custom('GetSchemeContract')] của ta, dành cả những đêm không ngủ và những ngày dài cho các mục tiêu chung của chúng ta.\n\nCó lẽ... có lẽ ta thật độc ác khi lợi dụng một người thân thiết với mình như vậy? Chắc chắn ta không thể nói rằng mình muốn bị lợi dụng như thế.\n\nTuy nhiên, [relation.GetSheHe] #EMP thực sự#! hiệu quả, và đó cũng là vì mục đích tốt đẹp."
 agent_events.3001.a: "Hãy dốc #EMP toàn lực#!."
 agent_events.3001.b: "Ngươi có thể làm nhiều hơn nữa!"
 agent_events.3001.c: "Hãy dành chút thời gian cho ta thay vào đó, [relation.GetFirstNameNoTooltip]."
 agent_events.3001.d: "Hãy nghỉ ngơi một lúc, [relation.GetFirstNameNoTooltip], ngươi đã làm đủ rồi."

 agent_events.3011.t: "Vì Ta"
 agent_events.3011.desc: ""#EMP Làm ơn#!, [ROOT.Char.GetFirstNameNoTooltip]. Ngươi làm việc quá nhiều rồi, như thể [scheme.Custom('GetSchemeContract')] này đang nuốt chửng ngươi!" [relation.Custom2('MyCharacterIntroduction', ROOT.Char)] rên rỉ, có lẽ đã đến lần thứ một trăm.\n\nDạo gần đây Ta #EMP quả thật#! rất chăm chỉ, điều đó không thể phủ nhận, nhưng chắc chắn cũng không hơn mức cần thiết.\n\nVẻ lo lắng hốc hác trên khuôn mặt [relation.Custom('MaskFace_BehindAcross')] của [relation.GetFirstNamePossessiveNoTooltip] [relation.Custom('MaskFace')] khiến Ta nghĩ rằng có lẽ không phải vậy."
 agent_events.3011.a: "Vì ngươi? Tất nhiên!"
 agent_events.3011.b: "Một [ROOT.Char.Custom2('RelationToMeShort',SCOPE.sC('relation'))] #EMP thật sự#! sẽ không yêu cầu ta như vậy."
 agent_events.3011.c: "Cách duy nhất là tiếp tục tiến lên, [relation.GetFirstNameNoTooltip]..."

 agent_events.3021.t: "Gia Đình Ở Bên Nhau"
 agent_events.3021.desc: "Thật hơi kỳ lạ khi [relation.Custom2('MyCharacterIntroduction', ROOT.Char)] và Ta lại trở nên gắn bó như vậy qua [scheme.Custom('GetSchemeContract')] nhằm [scheme.GetName] này.\n\nDù vậy, có niềm vui trong một nhiệm vụ chung, khi cùng nhau làm việc hướng tới một mục tiêu. Những bực bội được chia sẻ sẽ nhẹ đi, chiến thắng được nhân lên, và luôn có điều gì đó để nói chuyện.\n\nTa vui vì đã kéo [relation.GetHerHim] vào nỗ lực này."
 agent_events.3021.a: "Hạnh phúc gia đình..."

 agent_events.3031.t: "Rạn Nứt"
 agent_events.3031.desc: ""Nhân danh [relation.GetFaith.HealthGodName], ngươi còn là [relation.Custom2('RelationToMeShort',ROOT.Char)] của ta nữa không? Chỉ nhìn thấy ngươi thôi cũng khiến ta nổi giận!" [relation.GetFirstName] quát lên.\n\nNhững cuộc tranh cãi kiểu này gần đây khá phổ biến giữa chúng Ta, bất đồng về kế hoạch và phương thức, lời nói bị hiểu theo cách tệ nhất, và những bất đồng nhỏ nhất cũng biến thành cuộc cãi vã kéo dài hàng giờ.\n\nMọi nền tảng chung mà Ta hy vọng xây dựng bằng cách lôi [relation.GetHerHim] vào [scheme.Custom('GetSchemeContract')] này dường như đã hoàn toàn tan vỡ."
 agent_events.3031.a: "Làm ơn, [relation.GetFirstNameNoTooltip], không phải vậy."
 agent_events.3031.a.tt.success: "Lời cầu xin của Ngài đủ đáng thương"
 agent_events.3031.a.tt.failure: "Lời Ngài rơi vào tai điếc"
 agent_events.3031.b: "Ngươi просто không hiểu tầm nhìn của ta!"

 agent_events.3041.t: "Suy Nghĩ Lại"
 agent_events.3041.desc: "\"Đó là [target_relation.Custom2('RelationToMeShort',SCOPE.sC('target'))] của ta mà, chết tiệt!\" [target_relation.GetFirstName] hét lên, mất kiểm soát vì thất vọng và lo lắng khi bị cuốn vào [scheme.Custom('GetSchemeContract')] của ta.\n\nTất nhiên, vì chúng ta đang âm mưu [scheme.GetName] chống lại [target.GetFirstName], nên điều đó cũng dễ hiểu thôi.\n\n\"Có lẽ ta có thể... rút lui một chút. Dù sao thì trong trạng thái này ta cũng chẳng giúp ích gì được cho ngài\"."
 agent_events.3041.tt.forced_to_stay: "[relation.GetFirstName] sẽ bị buộc ở lại trong [scheme.GetName] [scheme|E]"
 agent_events.3041.a: "Hãy #EMP nhớ#! lý do ngươi ở đây."
 agent_events.3041.a.tt.forced_to_stay_longer: "$agent_events.3041.tt.forced_to_stay$ lâu hơn nữa"
 agent_events.3041.b: "Để ta thay đổi suy nghĩ của ngươi..."
 agent_events.3041.b.tt.success: "[relation.GetFirstNameNoTooltip] sẽ ở lại"
 agent_events.3041.b.tt.failure: "[relation.GetFirstNameNoTooltip] được tự do rời đi"
 agent_events.3041.c: "Ngươi biết rõ mình không thể rời đi."
 agent_events.3041.c.tt.success: "$agent_events.3041.b.tt.success$"
 agent_events.3041.c.tt.failure: "$agent_events.3041.b.tt.failure$"
 agent_events.3041.d: "Ngươi có thể rời đi bất cứ lúc nào."

 agent_events.3051.t: "Kẻ Thù Chung"
 agent_events.3051.desc: "Qua những cuộc thảo luận gần đây, rõ ràng [target_rival.GetFirstName] đang dần thiện cảm với Ta, chủ yếu vì tôn trọng cách Ta xử lý [scheme.GetName] [scheme.Custom('GetSchemeContract')] chống lại kẻ thù mà [target_rival.GetHerHis] căm ghét — [target.GetTitledFirstName].\n\nMột cách khá kỳ lạ để tìm điểm chung với ai đó, nhưng lại vô cùng chân thành.\n\nThực tế, [target_rival.GetFirstNameNoTooltip] dường như quyết tâm đền đáp nỗ lực của Ta chống lại đối thủ của [target_rival.GetHerHis], thậm chí còn chủ động trước!"
 agent_events.3051.a: "Có qua có lại."
 agent_events.3051.b: "Có lẽ chúng ta có thể trở thành bạn?"
 agent_events.3051.c: "Hãy dành thời gian cho kế hoạch của chúng ta."

 agent_events.3061.t: "Ân Huệ Cứu Rỗi"
 agent_events.3061.desc: "Một trong những lợi thế chính của việc để [target_spymaster.GetFirstName], mật vụ của [target.GetTitledFirstNamePossessive], tham gia vào [scheme.GetName] [scheme.Custom('GetSchemeContract')] của chúng ta là người có khả năng phát hiện ra chúng ta nhất lại đang nỗ lực giữ bí mật cho chúng ta.\n\nMặc dù luôn hữu ích trong việc duy trì bức màn im lặng này quanh những nỗ lực của chúng ta, nhưng [target_spymaster.GetFirstNameNoTooltip] gần đây đã tỏ ra #EMP đặc biệt#! khéo léo, mang lại cho chúng ta vài tháng im lặng tuyệt đối và không bị gián đoạn."
 agent_events.3061.a: "Một bất ngờ thú vị!"
 agent_events.3061.a.tt.extra_grace: "[scheme.GetName] [scheme|E] của Ngài nhận thêm vài tháng [secrecy_grace|E]"

 agent_events.3071.t: "Nếu Ta Có Thể Đề Xuất"
 agent_events.3071.desc.intro.nemesis: "Sự căm hận sâu sắc của [agent.GetTitledFirstNamePossessive|U] đối với [target.GetTitledFirstName] thúc đẩy một sự sáng tạo #EMP thực sự#! đáng kinh ngạc khi có cơ hội bộc lộ."
 agent_events.3071.desc.intro.spymaster: "Là gián điệp trưởng của [target.GetTitledFirstNamePossessive], [agent.GetTitledFirstName] có nhiều cơ hội tìm ra những cách độc đáo để hỗ trợ [scheme.Custom('GetSchemeContract')] nhỏ của chúng ta."
 agent_events.3071.desc.intro.councillor: "Là một trong những cố vấn đáng tin cậy của [target.GetTitledFirstNamePossessive], kỹ năng và tầm nhìn của [agent.GetTitledFirstNamePossessive] phục vụ rất tốt cho mục tiêu của chúng ta."
 agent_events.3071.desc.outro: "\n\nHôm nay, điều đó thể hiện dưới dạng một loạt điệp viên tiềm năng mà chúng ta có thể đưa vào kế hoạch. Hơn một người có thể làm kế hoạch mất ổn định, nhưng bất kỳ ai trong số họ cũng có thể là một sự bổ sung mạnh mẽ."
 agent_events.3071.a: "Một cách để cải thiện cơ hội của chúng ta sao..."
 agent_events.3071.b: "Một cách để tăng tốc kế hoạch?"
 agent_events.3071.c: "Giữ bí mật hấp dẫn ta."
 agent_events.3071.d: "Kế hoạch của ta đã hoàn hảo rồi."

 agent_events.4001.t: "Quá Xa Xôi"
 agent_events.4001.desc: "Dù [distant_agent.GetHerHis] có giá trị thế nào với [scheme.Custom('GetSchemeContract')] của chúng ta, không thể phủ nhận rằng khoảng cách quá lớn giữa [distant_agent.GetTitledFirstNamePossessive] và [scheme.GetTargetCharacter.GetTitledFirstName] đang gây ra... vấn đề.\n\nMột điệp viên ở xa đơn giản không thể hữu ích bằng người có thể di chuyển khi cần.\n\nThan ôi, giờ chúng ta phải trả giá cho điều đó."
 agent_events.4001.a: "Ngươi là gánh nặng, [distant_agent.GetTitledFirstNameNoTooltip], biến đi!"
 agent_events.4001.b: "Chết tiệt..."

 agent_events.4011.t: "Bóng Tối Trong Triều"
 agent_events.4011.desc: "Thật sự là một phước lành khi có người như [skilled_agent.GetTitledFirstName] tham gia vào [scheme.Custom('GetSchemeContract')] của chúng ta — một người có thể thúc đẩy mục tiêu của chúng ta theo vô số cách, chỉ chờ đợi chỉ thị.\n\nSự kết hợp đáng mơ ước giữa kỹ năng, quyền tiếp cận và sự gần gũi với [scheme.GetTargetCharacter.GetTitledFirstName] mang đến cho chúng ta nhiều lựa chọn để khai thác [skilled_agent.GetHerHim]."
 agent_events.4011.a: "Lợi ích tinh tế luôn là tốt nhất."
 agent_events.4011.b: "Tiềm năng trong tương lai có vẻ hữu ích..."
 agent_events.4011.c: "Bí mật là chìa khóa!"
 agent_events.4011.d: "Điều này mở ra vài cánh cửa cho chúng ta."

