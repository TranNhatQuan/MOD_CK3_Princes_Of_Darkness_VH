 # Agent Modifiers

  agent_events_0001_agents_focused_on_scheme_modifier: "Làm Việc, Đừng Nói"
  agent_events_0001_agents_focused_on_scheme_modifier_desc: "Chúng ta không ở đây để giao du, chúng ta ở đây để #EMP hoàn thành#! nhiệm vụ."

  agent_events_0011_friends_working_on_scheme_together_modifier: "Bầu Không Khí Thân Mật"
  agent_events_0011_friends_working_on_scheme_together_modifier_desc: "Âm mưu này có một nhóm Bạn Thân gắn bó đứng sau."

  agent_events_0012_lovers_get_weird_about_scheme_modifier: "Tất Cả Chỉ Là Một Phần Của Cuộc Chơi"
  agent_events_0012_lovers_get_weird_about_scheme_modifier_desc: "Những kẻ sắp thành tình nhân có thể tìm thấy lãng mạn ở những nơi kỳ lạ nhất."

  agent_events_0021_scheme_speed_boost_modifier: "Tập Trung Vào Mục Tiêu"
  agent_events_0021_scheme_speed_boost_modifier_desc: "Trên hết, điều quan trọng là phải nhớ chúng ta cần hoàn thành điều gì."

  agent_events_0041_better_agent_focusing_modifier: "Tài Năng Được Chuyển Hướng"
  agent_events_0041_better_agent_focusing_modifier_desc: "Chỉ vì Ngài có thể dạy ai đó một bài học, không có nghĩa là Ngài nên làm vậy."

  agent_events_1001_rival_agents_squabble_modifier: "Đặc Vụ Cãi Vã"
  agent_events_1001_rival_agents_squabble_modifier_desc: "Một số đặc vụ trong âm mưu này không chịu ngừng tranh cãi về những chi tiết nhỏ nhặt nhất."

  agent_events_1001_rival_agents_squabble_less_modifier: "Đặc Vụ Cãi Cọ"
  agent_events_1001_rival_agents_squabble_less_modifier_desc: "Các đặc vụ của âm mưu này thường gặp khó khăn khi làm việc cùng nhau, dù họ vẫn xoay xở được."

  agent_events_1001_rival_agents_forced_submission_modifier: "Bị Ép Phục Tùng"
  agent_events_1001_rival_agents_forced_submission_modifier_desc: "Một màn phô trương sức mạnh hữu ích trong mưu kế cũng như trong chiến tranh."

  agent_events_1011_rival_agents_forced_to_work_together_modifier: "Kẻ Thù Bị Ép Làm Chung"
  agent_events_1011_rival_agents_forced_to_work_together_modifier_desc: "Có thể không thực tế khi tách các đặc vụ thù địch ra, nhưng ép họ làm cùng nhau cũng mang lại rắc rối riêng."

  agent_events_1011_rival_agents_kept_separate_modifier: "Kẻ Thù Bị Tách Riêng"
  agent_events_1011_rival_agents_kept_separate_modifier_desc: "Đấu đá nội bộ có thể ngăn chặn, nhưng sự kém hiệu quả thì không."

  agent_events_1011_rival_agents_left_alone_modifier: "Kẻ Thù Bị Bỏ Mặc"
  agent_events_1011_rival_agents_left_alone_modifier_desc: "Người trưởng thành có thể tự giải quyết vấn đề của mình."

  agent_events_2021_competing_agents_encouraged_rivalry_modifier: "Khuyến Khích Cạnh Tranh"
  agent_events_2021_competing_agents_encouraged_rivalry_modifier_desc: "Một chút cạnh tranh sẽ giúp tăng hiệu quả."

  agent_events_2021_competing_agents_encouraged_friendship_modifier: "Khuyến Khích Tình bạn"
  agent_events_2021_competing_agents_encouraged_friendship_modifier_desc: "Sự phối hợp sẽ sinh ra hợp tác."

  agent_events_2021_competing_agents_left_alone_modifier: "Đặc Vụ Cạnh Tranh"
  agent_events_2021_competing_agents_left_alone_modifier_desc: "Theo truyền thống, thách thức sẽ được đáp lại bằng những thách thức khác."

  agent_events_3001_pushed_best_relation_hard_modifier: "Khai Thác Tàn Nhẫn"
  agent_events_3001_pushed_best_relation_hard_modifier_desc: "Một số người sẵn sàng hy sinh mọi thứ vì người họ yêu."

  agent_events_3001_pushed_positive_relation_hard_modifier: "Khai Thác Không Khoan Nhượng"
  agent_events_3001_pushed_positive_relation_hard_modifier_desc: "Luôn có thể vắt thêm một chút ý chí — nếu Ngài đủ quan tâm."

  agent_events_3001_did_not_push_positive_relation_modifier: "Khai Thác Tuyệt Vời"
  agent_events_3001_did_not_push_positive_relation_modifier_desc: "Không gì tạo động lực mạnh bằng tình cảm."

  agent_events_3011_relaxed_for_relation_modifier: "Đặt Quan Hệ Lên Trước"
  agent_events_3011_relaxed_for_relation_modifier_desc: "Cuộc sống còn nhiều điều khác ngoài âm mưu."

  agent_events_3011_pushed_relation_away_hard_modifier: "Mục Đích Là Trên Hết"
  agent_events_3011_pushed_relation_away_hard_modifier_desc: "Mọi thứ khác — mọi#EMP người#! khác — đều là thứ yếu."

  agent_events_3011_pushed_relation_away_slightly_modifier: "Lạnh Lùng"
  agent_events_3011_pushed_relation_away_slightly_modifier_desc: "Đôi khi ưu tiên đã quá rõ ràng."

  agent_events_4001_distance_malus_t1_modifier: "Đặc Vụ Phân Tán"
  agent_events_4001_distance_malus_t1_modifier_desc: "Những đặc vụ ở xa có thể gây ra đủ loại vấn đề."

