l_english:
  religious_decision.0001.t:0 "Thờ Cúng"
  religious_decision.0001.desc: "[ROOT.Char.Custom('MyPriestTitle')] [realm_priest.GetFirstName] của ta dẫn ta đến một vùng trũng yên tĩnh gần một con suối nhỏ, dòng nước róc rách chảy qua các tảng đá tạo nên một bầu không khí thư thái.\n\n"Các linh hồn thích nơi này, [ROOT.Char.GetFirstNameNoTooltip]. Đây là nơi tốt nhất để chúng ta thỉnh cầu sự giúp đỡ từ họ."\n\nGiơ hai chiếc giỏ mà [realm_priest.GetFirstNameNoTooltip] mang theo [realm_priest.GetHerHim], [realm_priest.GetSheHe] nói thêm: "Bây giờ chúng ta phải quyết định xem sẽ để lại loại lễ vật nào cho họ.""
  religious_decision.0001.desc_landless: "Lang thang trong hoang dã với các giỏ lễ vật, Ta nhanh chóng nhận ra một dòng suối yên tĩnh, ẩn mình trong cửa hang.\n\nKhông khí dày đặc sự hiện diện của các thần linh.\n\nTuy nhiên, không biết chính xác thần nào có mặt, Ta suy nghĩ về nội dung giỏ lễ. Ta nên dâng gì?"
  religious_decision.0001.a:0 "Một lễ vật lớn gồm vỏ sò, hoa quả và nhũ hương."
  religious_decision.0001.b:0 "Một lễ vật truyền thống gồm hạt giống và borassa."
  religious_decision.0001.c:0 "Dâng lễ vật? Ha! Chẳng phải sự hiện diện của Ta đã đủ sao?"
  religious_decision.0001.d:0 "Nhìn lại, tốt hơn là đừng làm phiền họ..."
  religious_decision.0001.a.tt.1:0 "Các thần linh sẽ #P chắc chắn chú ý#! đến lễ vật này"
  religious_decision.0001.a.tt.2:1 "Điều này có thể thu hút sự chú ý của một #Z thần linh quyền năng#!, tốt hay xấu"
  religious_decision.0001.b.tt:0 "Các thần linh #P có khả năng chú ý#! đến lễ vật này"
  religious_decision.0001.c.tt:0 "Các thần linh #N có khả năng bị xúc phạm#!, nhưng sự táo bạo có thể #P gây ấn tượng#!"
  religious_decision.0001.d.flavor:0 "Các thần linh hay thay đổi. Tốt nhất là không mạo hiểm làm họ tức giận."

  religious_decision.0002.t:0 "Thờ Cúng"
  religious_decision.0002.desc.start_offering:0 "[realm_priest.GetFirstName] đổ lễ vật của Ta xuống đất và bắt đầu đi vòng quanh nó."
  religious_decision.0002.desc.start_offering_alone: "Ta đổ lễ vật xuống đất và bắt đầu đi vòng quanh nó."
  religious_decision.0002.desc.start_no_offering:0 "[realm_priest.GetFirstName] nhìn ta, bối rối. "Ngài hiến tế... chính bản thân mình? Ta đoán là cách đó cũng được..." [realm_priest.GetSheHe] nói, khi bắt đầu bước đi xung quanh ta theo vòng tròn."
  religious_decision.0002.desc.start_no_offering_alone: "Ta chần chừ một chút, suy nghĩ về sự táo bạo khi chỉ dâng chính mình cho các thần linh. Rồi Ta bắt đầu đi vòng để thực hiện nghi lễ."
  religious_decision.0002.desc:0 "\n\n"Ôi các linh hồn, hãy lắng nghe ta. Ta kêu gọi các người hãy ban sự giúp đỡ của các người cho kẻ thỉnh cầu này!" [realm_priest.GetFirstNameNoTooltip] tụng niệm.\n\n[realm_priest.GetSheHe|U] bắt đầu di chuyển nhanh hơn, nhảy múa, những chuyển động [realm_priest.GetHerHis] của người này trở nên điên cuồng hơn, mồ hôi lấp lánh trên khuôn mặt [realm_priest.GetHerHis]. Cuối cùng, [realm_priest.GetSheHe] đạt đến cao trào, vừa kịp kết thúc điệu nhảy trước khi đổ gục xuống đất vì kiệt sức."
  religious_decision.0002.desc_alone: "\n\n""Các thần linh, xin hãy nghe Ta. Hãy xem xét lễ vật của Ta và giúp Ta trong lời cầu xin!"" Ta hô lên trong ánh hoàng hôn của thung lũng.\n\nKhi Ta tiếp tục đi vòng, một luồng năng lượng bất ngờ tràn qua Ta. Mồ hôi ứa ra trên trán, tay chân chuyển động cuồng loạn — nhanh hơn và nhanh hơn. Ta di chuyển, di chuyển, #EMP di chuyển#! — cho đến khi Ta cuối cùng ngã xuống đất, thở hổn hển."
  religious_decision.0002.desc.end_changed:0 "\n\nKhi nghi lễ kết thúc, Ta cảm thấy khác lạ. Thay đổi theo cách nào đó..."
  religious_decision.0002.desc.end_no_change:0 "\n\nSự tĩnh lặng và yên ắng trở lại thung lũng. Mọi thứ dường như y nguyên như trước."
  religious_decision.0002.shrewd:0 "Tâm trí Ta chưa bao giờ rõ ràng đến thế!"
  religious_decision.0002.strong:0 "Thật là sức mạnh! Thật là sinh lực!"
  religious_decision.0002.good:0 "Cảm giác lạ lùng này là gì vậy?"
  religious_decision.0002.bad:0 "Điều này không thể đúng..."
  religious_decision.0002.possessed:0 "Ta cảm thấy bị mắc kẹt trong chính cơ thể mình!"
  religious_decision.0002.no_change.zealous:0 "Liệu Ta có xúc phạm thần linh theo cách nào đó?"
  religious_decision.0002.no_change:0 "Thật là lãng phí thời gian."

  religious_decision.0101.t:0 "Bhakti"
  religious_decision.0101.desc.start:0 "Bhakti có thể được ví như cảm giác yêu mến, tôn sùng, và thờ phụng, nhưng không điều nào bao quát hết khái niệm này. Bằng cách dâng hiến bản thân cho một hiện thân của thần linh, Ta cam kết toàn bộ thân tâm với họ.\n\n[ROOT.Char.GetFaith.GetNameNoTooltip] tập trung vào việc tôn kính"
  religious_decision.0101.desc.generic:0 "chỉ vài vị thần trong số họ."
  religious_decision.0101.desc.vaishnavism:0 "các hiện thân của Vishnu, Đấng Bảo Vệ."
  religious_decision.0101.desc.shaivism:0 "các hiện thân của Shiva, Đấng Hủy Diệt."
  religious_decision.0101.desc.smartism:0 "các khía cạnh của thực tại tối thượng."
  religious_decision.0101.desc.end:0 "Trong số các khía cạnh này, một khía cạnh đặc biệt phải hướng đến Ta nhiều hơn các khía cạnh khác..."
  religious_decision.0101.ganga:0 "Ganga, thần của sự trong sạch và chuộc lỗi."
  religious_decision.0101.saraswati:0 "Saraswati, nữ thần của tri thức và nghệ thuật."
  religious_decision.0101.kali:0 "Kali, nữ thần của sự hủy diệt cái ác."
  religious_decision.0101.kubera:0 "Kubera, thần của sự giàu có và công lý."
  religious_decision.0101.lakishmi:0 "Lakishmi, nữ thần của may mắn và thịnh vượng."
  religious_decision.0101.jagganath:0 "Jagganath, Chúa của Vũ Trụ."
  religious_decision.0101.hayagriva:0 "Haygriva, thần của tri thức và trí tuệ."
  religious_decision.0101.parvati:0 "Parvati, nữ thần của sự sinh sản và sắc đẹp."
  religious_decision.0101.virabhadra:0 "Vīrabhadra, thần của cơn thịnh nộ chính nghĩa."
  religious_decision.0101.munishwarar:0 "Munīshwarar, thần của gia đình và tổ ấm."
  religious_decision.0101.dakshinamoorthy:0 "Dakshinamoorthy, thần của mọi hình thức học tập."
  religious_decision.0101.ganesha:0 "Ganesha, thần của trí tuệ và khởi đầu mới."
  religious_decision.0101.vishnu:0 "Vishnu, thần giám sát sự sáng tạo."
  religious_decision.0101.shiva:0 "Shiva, thần săn đuổi cái ác."
  religious_decision.0101.optout:0 "Ta vẫn chưa sẵn sàng để quyết định."
  religious_decision.0101.flavor:0 "Không có gì xấu hổ khi chờ đợi cho đến khi Ta chắc chắn."

  religious_decision.0102.t:0 "Quyết Định Chọn Thần"
  religious_decision.0102.desc:0 "[ROOT.Char.GetFaith.PantheonTerm|U] có nhiều vị thần và khó nắm bắt, nhưng Ta không thể nói rằng không có vị nào có sức hấp dẫn đặc biệt với Ta. Nếu Ta dâng hiến công khai cho việc thờ chủ yếu một vị thần như vậy, chắc chắn Ta sẽ thu hút những linh hồn cùng chí hướng về bên mình.\n\nDù phước lành của vị thần bảo trợ ra sao, ở bên những [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] tương tự chỉ mang lại sức khỏe, của cải và vinh quang."
  religious_decision.0102.odin:0 "Odin, Thủ Lãnh của Aesir!"
  religious_decision.0102.ullr:0 "Ullr, thợ săn, chiến binh, Sứ giả Vinh quang!"
  religious_decision.0102.tyr:0 "Tyr Một Tay, chiến binh!"
  religious_decision.0102.thor:0 "Thor, Người  Bạn củaNhân Loại!"
  religious_decision.0102.freyr:0 "Freyr, Chúa và Người Bảo Hộ!"
  religious_decision.0102.optout:0 "$religious_decision.0101.flavor$"
  religious_decision.0102.flavor:0 "$religious_decision.0101.flavor$"

  religious_decision.0201.t:0 "Thiền Ẩn Dật"
  religious_decision.0201.desc:0 "Bắt đầu một hành trình nội tâm thông qua thiền định không phải là điều đơn giản. Nhiều chuẩn bị cần phải thực hiện, ít nhất là quyết định nơi Ta sẽ ẩn dật.\n\nĐịa điểm Ta chọn để thiền sẽ ảnh hưởng lớn đến kết quả của hành trình."
  religious_decision.0201.home:0 "Sự thoải mái tại [ROOT.Char.Custom('ResidenceBuilding')] của chính Ta."
  religious_decision.0201.plains:1 "Những đồng bằng dịu dàng của [plains_location.GetNameNoTooltip]."
  religious_decision.0201.hills:1 "Những ngọn đồi uốn lượn của [hills_location.GetNameNoTooltip]."
  religious_decision.0201.steppe:1 "Dưới bầu trời xanh bao la của [steppe_location.GetNameNoTooltip]."
  religious_decision.0201.forest:1 "Những khu rừng tách biệt của [forest_location.GetNameNoTooltip]."
  religious_decision.0201.drylands:1 "Vùng đất khô cằn của [drylands_location.GetNameNoTooltip]."
  religious_decision.0201.mountains:1 "Những ngọn núi xa xôi của [mountains_location.GetNameNoTooltip]."
  religious_decision.0201.wetlands:1 "Những đầm lầy ô nhiễm của [wetlands_location.GetNameNoTooltip]."
  religious_decision.0201.jungle:1 "Những khu rừng rậm ồn ào của [jungle_location.GetNameNoTooltip]."
  religious_decision.0201.desert:1 "Nắng nóng gay gắt của [desert_location.GetNameNoTooltip]."
  religious_decision.0201.optout:0 "Hiện Ta quá bận để thiền."
  religious_decision.0201.optout.flavor:0 "Không vội. Thế giới không đi đâu cả."
  religious_decision.0201.difficulty.easy:0 "[tooltip_loc.GetName] là nơi #P an toàn và dễ dàng#! để thiền"
  religious_decision.0201.difficulty.medium:1 "[tooltip_loc.GetName] là nơi #Z thử thách vừa phải#! để thiền"
  religious_decision.0201.difficulty.hard:0 "[tooltip_loc.GetName] là nơi #N khó khăn và nguy hiểm#! để thiền"
  religious_decision.0201.stress:0 "Ta dễ mất [stress|e] hơn ở địa điểm này"
  religious_decision.0201.trait:0 "Ta dễ đạt được những nhận thức cá nhân hơn ở địa điểm này"
  religious_decision.0201.learning:0 "Ta dễ đạt được những hiểu biết thần học hơn ở địa điểm này"

  religious_decision.0210.toast:0 "Ngài bắt đầu thiền"

  religious_decision.0211.t:0 "$religious_decision.0201.t$"
  religious_decision.0211.desc.beginning.home:0 "Rút về nơi riêng tư trong phòng, Ta bắt đầu một thời gian dài nhịn ăn và thiền định."
  religious_decision.0211.desc.beginning.plains:1 "Đi tới những đồng bằng rộng lớn của [meditation_location.GetName], Ta thấy tâm trí mình thanh thản và tự do lang thang."
  religious_decision.0211.desc.beginning.hills:1 "Tầm nhìn rõ ràng từ đỉnh đồi ở [meditation_location.GetName] rất thích hợp cho những suy tư sâu sắc."
  religious_decision.0211.desc.beginning.steppe:1 "Dưới bầu trời rộng lớn của thảo nguyên [meditation_location.GetName], Ta thấy tâm trí mình thanh thản và tự do lang thang."
  religious_decision.0211.desc.beginning.forest:1 "Sau khi đến khu rừng hoang dã của [meditation_location.GetName], Ta tìm thấy một khoảng trống yên tĩnh để thiền."
  religious_decision.0211.desc.beginning.drylands:1 "Không khí khô cằn của vùng đất [meditation_location.GetName] làm đầy phổi Ta và thanh tẩy làn da."
  religious_decision.0211.desc.beginning.mountains:1 "Không khí loãng trên núi ở [meditation_location.GetName] giúp Ta làm sạch suy nghĩ khi tập trung vào nội tâm."
  religious_decision.0211.desc.beginning.wetlands:1 "Không khí ẩm ướt của đầm lầy [meditation_location.GetName] làm quần áo Ta dính sát da khi Ta ngồi xuống và nhìn sâu vào tâm hồn mình."
  religious_decision.0211.desc.beginning.jungle:1 "Côn trùng kêu vo ve và chim hót trong rừng rậm [meditation_location.GetName] tạo nên âm thanh nền liên tục khi Ta tìm cách nhìn vào bản thân."
  religious_decision.0211.desc.beginning.desert:1 "Dưới ánh nắng nóng của sa mạc [meditation_location.GetName], Ta nhìn vào nội tâm để tìm hiểu sâu hơn về vị trí của mình trong vũ trụ."
  religious_decision.0211.desc.result.impatient:0 "\n\nTuy nhiên, Ta sớm trở nên nôn nóng, vì dù ngồi yên thế nào hay cố gắng ra sao, Ta chỉ cảm thấy chán nản."
  religious_decision.0211.desc.result.secret:0 "\n\nĐáng tiếc, Ta không thể ngừng nghĩ về những bí mật đen tối mà Ta giữ. Nếu thế giới biết, chuyện gì sẽ xảy ra? Bị ám ảnh bởi những suy nghĩ đó, Ta không thể tìm thấy bình yên."
  religious_decision.0211.desc.result.hungry:0 "\n\nSớm đói cồn cào, Ta nhận ra thức ăn mang theo quá ít. Những ngày còn lại trong chuyến đi là cuộc vật lộn tìm thức ăn trong hoang dã, ít thời gian cho việc tự chiêm nghiệm."
  religious_decision.0211.desc.result.thirsty:0 "\n\nKhông lâu sau, môi Ta nứt nẻ và cơn khát tăng lên, không thể thỏa mãn chỉ với bình nước. Ta nhận ra cần tìm chỗ trú ẩn để sống sót trong cái nóng, nhưng nhà trọ Ta tìm quá đông, không đủ yên tĩnh."
  religious_decision.0211.desc.result.headache:0 "\n\nĐáng tiếc, Ta sớm bị đau đầu dữ dội không dứt. Chẳng mấy chốc Ta không thể nghĩ gì ngoài cơn đau."
  religious_decision.0211.desc.result.distraction:0 "\n\nTiếng ồn vô tận trở thành sự xao lạc liên tục, và Ta nhận thấy sự khó chịu ngày càng tăng là chướng ngại tâm lý không thể vượt qua."
  religious_decision.0211.desc.result.minor_stress: "\n\nKhông còn bị gánh nặng những mối quan tâm tầm thường của đời sống [ROOT.Char.Custom('GetCourt')|l], Ta sớm thấy mình dành nhiều thời gian hơn cho những thú vui đơn giản trong cuộc sống."
  religious_decision.0211.desc.result.medium_stress: "\n\nVị trí tách biệt là một lợi thế lớn, mang lại cho Ta sự nghỉ ngơi cần thiết khỏi những vấn đề thường ngày mà Ta thường phải đối mặt tại [ROOT.Char.Custom('GetCourt')|l]."
  religious_decision.0211.desc.result.major_stress: "\n\nBị cô lập sâu trong hoang dã, Ta thấy những lo lắng đã đè nặng lên Ta ở [ROOT.Char.Custom('GetCourt')|l] giờ không còn giá trị. Lần đầu tiên sau quá lâu, Ta cảm thấy bình yên."
  religious_decision.0211.desc.result.reflection:0 "\n\nNhìn sâu vào bản thân, Ta nhận ra cuộc sống Ta đã sống nông cạn và thiếu hoàn hảo, bị nhuốm những ham muốn không lành mạnh. Sau khi trở về, Ta thấy những thứ đó không còn hấp dẫn như trước."
  religious_decision.0211.desc.result.epiphany:0 "\n\nThiền trong cô lập, Ta bỗng nhận ra một sự giác ngộ. Sự hiện diện của con người trong thế giới và vị trí của chúng ta trong trật tự tự nhiên... Một mảnh ghép khác của vũ trụ được đặt đúng chỗ!"
  religious_decision.0211.desc.result.fugue:0 "\n\nSau nhiều ngày, Ta rơi vào trạng thái mơ màng, hoàn toàn mất đi cảm giác về bản thân. Không bị ràng buộc bởi ham muốn và định kiến, Ta thấy chân lý của vũ trụ được viết trong mọi thứ xung quanh. Ta có thể nhìn thấy mọi thứ... hiểu mọi thứ... vũ trụ và Ta, như một.\n\nCuối cùng Ta trở về với chính mình, dù vẫn nhớ được những mảnh ghép Ta học được trong cơn mê."
  religious_decision.0211.a.critical_success:0 "Trải nghiệm này sẽ ở lại với Ta mãi mãi."
  religious_decision.0211.a.success:0 "Ta vui vì đã dành thời gian làm điều này."
  religious_decision.0211.a.failure:0 "Ôi thôi..."
  religious_decision.0211.experience:0 "Ngài cải thiện kỹ năng thiền của mình"
  religious_decision.0291.toast:1 "Ngài kết thúc buổi thiền"

  religious_decision.0302.t:0 "Mai táng trên trời"
  religious_decision.0302.desc.wilderness:0 "Theo truyền thống, một nhóm nhỏ từ [ROOT.Char.Custom('GetCourt')|l] của ta tập hợp lại để mang thi hài của [ROOT.Var('ancestor_to_bury').Char.GetFirstNamePossessive] ra nơi hoang dã để chúng ta có thể thực hiện một nghi lễ an táng đúng cách cho [ROOT.Var('ancestor_to_bury').Char.GetHerHim].\n\nĐể ý thấy đám rước, không lâu sau những loài chim ăn xác đã bắt đầu lượn vòng trên cao. Nóng lòng nhưng không thiếu kiên nhẫn, chúng chờ chúng ta nói những lời cuối cùng và rời đi trước khi sà xuống để mở tiệc."
  religious_decision.0302.desc.zoroastrian:0 "Vì lợi ích tránh bị vấy bẩn bởi quỷ xác Nasu, ta không được phép vào Tháp Dakhma, nơi thi hài của [ROOT.Var('ancestor_to_bury').Char.GetFirstNamePossessive] sẽ được xử lý.\n\nThay vào đó, một vài [ROOT.Char.GetFaith.PriestNeuterPlural] đã được đào tạo chuyên biệt về xử lý xác chết nhận thi thể của [ROOT.Var('ancestor_to_bury').Char.GetHerHis], hộ tống nó lên đỉnh tháp.\n\nSau một thời gian, các [ROOT.Char.GetFaith.PriestNeuterPlural] quay lại. "Đã xong, thưa [ROOT.Char.GetTitleAsNameNoTooltip] của con. Giờ đây chim ăn xác sẽ rỉa sạch thịt trên thi thể [ROOT.Var('ancestor_to_bury').Char.GetHerHis] và tia nắng mặt trời sẽ tẩy trắng xương cốt của [ROOT.Var('ancestor_to_bury').Char.GetHerHis].""
  religious_decision.0302.a:0 "An nghỉ bình yên, [ROOT.Char.Custom2('RelationToMe', ROOT.Var('ancestor_to_bury').Char)]."


  religious_decision.0401.t:0 "Tiên đoán sao trời"
  religious_decision.0401.desc.beginning:1 "Ta đã dành nhiều đêm nhìn lên bầu trời đêm, theo dõi chuyển động của các thiên thể.\n\nQua thời gian Ta nhận thấy một mô hình, và sau nhiều ngày phân tích, giờ Ta tự tin với dự đoán. Các dấu hiệu rõ ràng —"
  religious_decision.0401.desc.great_battle:0 "một trận chiến lớn đang chờ Ta."
  religious_decision.0401.desc.new_friends:0 "đã đến lúc hàn gắn vết thương cũ và kết bạn mới."
  religious_decision.0401.desc.hard_work:0 "chăm chỉ sẽ dẫn Ta tới vận may lớn trong tương lai."
  religious_decision.0401.desc.betrayal:0 "đồng minh của Ta không như Ta tưởng."
  religious_decision.0401.desc.new_beginnings:0 "đây là thời điểm cho những khởi đầu mới và tấm lòng rộng mở."
  religious_decision.0401.a:0 "Ta tự hỏi tương lai còn chứa điều gì nữa?"
 
  religious_decision.0501.t:0 "Người [ROOT.Char.GetTitleAsNameNoTooltip] và đức tin [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]"
  religious_decision.0501.desc:1 "Qua nhiều thế hệ, quý tộc [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] đã bày tỏ sự sùng đạo với [ROOT.Char.GetFaith.GetAdherentNameNoTooltip], nhưng sự đa nguyên tôn giáo với các vị thần địa phương vẫn phổ biến trong xã hội [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]. Tuy nhiên, với sự phục hồi của Chức Tổng Giám Mục, [ROOT.Char.GetFaith.ReligiousHeadTitleName] [ROOT.Char.GetFaith.ReligiousHeadName] yêu cầu chấm dứt thực hành dị giáo này và bắt mọi ai thề trung thành với Khan phải thề trung thành với Thiên Chúa và thờ Ngài đúng cách.\n\nTuy nhiên, với tư cách [ROOT.Char.GetTitleAsNameNoTooltip], Ta cuối cùng nắm quyền quyết định tương lai của đức tin trong [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] của Ta và tương lai của thảo nguyên dựa vào lời Ta."
  religious_decision.0501.a:0 "Một [ROOT.Char.GetTitleAsNameNoTooltip] tốt cho phép [ROOT.Char.GetHerHis] dân giữ lối sống của họ."
  religious_decision.0501.b:0 "Có lẽ cải cách vừa phải sẽ làm hài lòng cả hai bên."
  religious_decision.0501.c:1 "[ROOT.Char.GetFaith.GetNameNoTooltip] phải được truyền giáo ra thế giới!"
  religious_decision.0501.jewish.tt:2 "Mỗi [vassal|E] Do Thái"
  religious_decision.0501.nonjewish.tt:2 "Mỗi [vassal|E] không Do Thái"
  religious_decision.0501.diff_culture.tt:0 "Mỗi [vassal|E] thuộc [culture|E] khác"
  can_never_reform_kuzarism_tt:0 "[GetFaithByKey('kabarism').GetName] sẽ giữ nguyên giáo lý hiện tại mãi mãi."
  religious_decision.0502.t:0 "Người [khazar_khan.GetTitleAsNameNoTooltip] và đức tin [khazar_khan.GetFaith.GetAdherentNameNoTooltip]"
  religious_decision.0501.d:0 "[ROOT.Char.GetFaith.GetNameNoTooltip] là đức tin chân chính duy nhất, và [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] là sứ giả của [ROOT.Char.GetFaith.HighGodNamePossessive]."
  religious_decision.0502.desc.intro:0 "Qua nhiều thế hệ, quý tộc [khazar_khan.GetPrimaryTitle.GetNameNoTierNoTooltip] đã bày tỏ sự sùng đạo với [ROOT.Char.GetFaith.GetAdherentNameNoTooltip], nhưng đa nguyên tôn giáo với các vị thần địa phương vẫn phổ biến trong xã hội [khazar_khan.GetPrimaryTitle.GetAdjectiveNoTooltip]."
  religious_decision.0502.desc.body:0 "Tuy nhiên, gần đây [khazar_khan.GetTitleAsNameNoTooltip] và các giáo sĩ trong vương quốc đã tranh luận nảy lửa về tôn giáo dân gian và những người không tin trong [khazar_khan.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n[khazar_khan.GetTitleAsNameNoTooltip] cuối cùng đã đưa ra quyết định."
  religious_decision.0502.desc.righteous:1 "Trong một sắc lệnh hoàng gia, những ai vẫn thờ cúng các lối cũ sẽ không được ưu tiên trong [khazar_khan.GetPrimaryTitle.GetTierAsNameNoTooltip], và tất cả những ai thề trung thành với [khazar_khan.GetTitleAsNameNoTooltip] phải thề trung thành với [khazar_khan.GetFaith.HighGodName]."
  religious_decision.0502.desc.fundamentalist:0 "Không chỉ đa nguyên tôn giáo chấm dứt, mà bất cứ ai không thực hành [khazar_khan.GetFaith.GetNameNoTooltip] đúng chính thống đều là kẻ thù của [khazar_khan.GetPrimaryTitle.GetTierAsNameNoTooltip]. [khazar_khan.GetTitleAsNameNoTooltip] muốn lan truyền [khazar_khan.GetFaith.GetNameNoTooltip] khắp Thảo Nguyên và hơn thế nữa, tuyên bố rằng bất kỳ [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] tốt nào cũng phải tham gia kỷ nguyên chiến tranh tôn giáo này."
  religious_decision.0502.a:0 "Thật là một ngày đen tối cho [ROOT.Char.GetFaith.GetNameNoTooltip]"
  religious_decision.0502.b:0 "Đúng lúc rồi!"
  religious_decision.0503.t:0 "Ngôn ngữ Hebrew"
  religious_decision.0503.desc:0 "Là vị lãnh đạo có ảnh hưởng nhất của văn hóa [hebrew_language_adopter_scope.GetCulture.GetName], và lãnh đạo một vương quốc Do Thái rộng lớn, [hebrew_language_adopter_scope.GetName] đã ra sắc lệnh rằng Hebrew là cả ngôn ngữ thánh lễ và ngôn ngữ phổ thông của dân [hebrew_language_adopter_scope.GetCulture.GetNameNoTooltip]!\n\nHebrew đã là ngôn ngữ thánh lễ của Do Thái giáo hàng thiên niên kỷ, nhưng giờ khi [hebrew_language_adopter_scope.GetNameNoTooltip] cai trị đa số người Do Thái, nhu cầu dùng ngôn ngữ khác trong đời sống hằng ngày giảm dần. Dù không phải tất cả dân [hebrew_language_adopter_scope.GetCulture.GetNameNoTooltip] đều theo Do Thái giáo, chỉ một hoặc hai thế hệ nữa sẽ nói tiếng Hebrew."
  religious_decision.0503.a.jewish:0 "L'chaim!"
  religious_decision.0503.a.non_jewish:0 "Ta nên bắt đầu luyện tập."
  religious_decision.0503.b:0 "Ta không thể nói ngôn ngữ lạ này!"

  religious_decision.0601.t:0 "Chia rẽ Ummah: [founder.GetFaith.GetAdjectiveNoTooltip] [founder.GetFaith.ReligiousHeadTitleName|U]"
  religious_decision.0601.desc:0 "Không có #EMP lãnh đạo chân chính#!, chúng ta lạc lối.\n\n[old_caliph.GetTitledFirstName] chưa cung cấp sự hướng dẫn này cho chúng Ta [founder.GetFaith.GetAdherentNamePlural] kể từ khi [old_caliph.GetSheHe] nhận chức, và những người theo đạo khác đã chịu khổ vì thiếu chỉ dẫn, quyền lực và luật pháp của [old_caliph.GetHerHis].\n\nVới trái tim nặng trĩu và sự ủng hộ của một số giáo sĩ có ảnh hưởng nhất trong thế giới [founder.GetFaith.GetAdjectiveNoTooltip], Ta tuyên bố rằng ý chí không mệt mỏi của [founder.GetFaith.HighGodName] là Ta đảm nhận chức [founder.GetFaith.ReligiousHeadTitleName].\n\nCon cháu và Ta sẽ nắm giữ từ nay đến Ngày Phán Xét, và dưới bàn tay vững chắc của Ta, những tín đồ chân chính sẽ thịnh vượng!"
  religious_decision.0601.a:0 "Ta giờ gánh vác gánh nặng nặng nề này..."
  religious_decision.0601.b:0 "Ha, chịu #EMP đi#! [old_caliph.GetFirstNameNoTooltip]."
  religious_decision.0601.tt.some_rulers_converted_away:0 "[THIS.Var('schismed_caliphate_major_ruler_converted_count').GetValue|0] [rulers|E] sẽ cải sang [old_caliph.GetFaith.GetName] để phản đối"
  religious_decision.0601.tt.all_rulers_stayed:0 "Không [rulers|E] quan trọng nào [founder.GetFaith.GetAdjective] sẽ cải sang [old_caliph.GetFaith.GetName] để phản đối"

  religious_decision.0602.t:0 "$religious_decision.0601.t$"
  religious_decision.0602.desc:0 "[founder.GetFirstName] không che giấu việc [founder.GetSheHe] #EMP ghét#! cách [old_caliph.GetTitledFirstName] sử dụng chức vụ linh thiêng [old_caliph.GetFaith.ReligiousHeadName], nhưng Ta nghi ngờ ai nghĩ rằng [founder.GetSheHe] sẽ làm tới mức #EMP này#!.\n\nVị điên [founder.GetWomanMan] đã tập hợp đủ ủng hộ để tuyên bố #EMP [founder.GetHerselfHimself]#! [founder.GetFaith.ReligiousHeadName], làm chia rẽ Ummah!\n\nĐáng lo, dân thường phần lớn chấp nhận quyết định như một phần trò chơi quyền lực của tầng lớp trên. Là một trong những người dẫn dắt của [founder.GetFaith.GetName], Ta phải quyết định liệu vương quốc mình sẽ tuân theo hay phản đối."
  religious_decision.0602.a:0 "[founder.GetTitledFirstNameNoTooltip] chắc chắn sẽ chứng minh xứng đáng."
  religious_decision.0602.a.tt:0 "Ngài yên lặng chấp nhận trật tự mới"
  religious_decision.0602.b:0 "Lòng trung thành của Ta với [old_caliph.GetTitledFirstNameNoTooltip] không thể lay chuyển!"
  religious_decision.0602.c:0 "Người dân dường như khao khát một lãnh đạo thật sự..."
  fp2_opportunistic_schismatic_modifier:0 "Kẻ ly giáo cơ hội"
  fp2_opportunistic_schismatic_modifier_desc:0 "Nhân vật này đang hướng tới một sự mặc khải..."

  religious_decision.0603.t:0 "$religious_decision.0601.t$"
  religious_decision.0603.desc:0 "Căng thẳng giữa [founder.GetFirstName] và [old_caliph.GetShortUINameNoFormat] gần đây đang dâng cao, nhưng [founder.GetFirstNameNoTooltip] đã leo thang đến mức độ hung hãn không ngờ.\n\nVới sự ủng hộ của nhiều giáo sĩ hàng đầu của [founder.GetFaith.GetName], [founder.GetFirstNameNoTooltip] đã tuyên bố thành công bản thân là [founder.GetFaith.ReligiousHeadName] #EMP thực sự#! của đức tin [founder.GetHerHis] mình, thay thế quyền lực của [old_caliph.GetShortUINamePossessiveNoTooltipNoFormat] đối với những người đã quay lưng lại với giáo lý chính thống [old_caliph.GetFaith.GetName].\n\nNhiều người có tư tưởng cộng đồng hơn trên thế giới $islam_religion_adherent_plural$ công khai rơi lệ khi thấy thêm một vết nứt xuất hiện trong Ummah."
  religious_decision.0603.a:0 "Quái vật! Kẻ bỉ ổi! Kẻ báng bổ!"
  religious_decision.0603.b:0 "[old_caliph.GetTitledFirstNameNoTooltip] không thể giữ trật tự cho gia đình của mình..."
  religious_decision.0603.c:0 "Ha! Kịch cao trào thật!"
