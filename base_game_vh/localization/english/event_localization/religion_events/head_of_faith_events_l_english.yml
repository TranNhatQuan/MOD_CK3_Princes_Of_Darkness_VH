l_english:
  head_of_faith.0000.new_faith_submitted_for_hook:0 "[ROOT.Char.GetTitledFirstName] đã cam kết với caliphate của Ngài"
  head_of_faith.0000.wishes_to_schism_caliphate_flag_added:0 "Từ bỏ caliphate mà Ngài đã chọn sẽ dễ dàng hơn trong suốt cuộc đời Ngài"
  head_of_faith.0000.t:0 "Hậu Duệ của Nhà Tiên Tri"
  head_of_faith.0000.desc:0 "và tất cả tín đồ chân chính mong Ta, với tư cách là thành viên ưu tú nhất của đức tin, phải cam kết trung thành với một caliph hiện có.\n\nChỉ bằng cách phục tùng quyền tối cao dưới [ROOT.Char.GetFaith.HighGodName] Ta mới có thể có thẩm quyền của riêng mình, bất kể những khác biệt thần học khác.\n\nCâu hỏi chính trước mặt Ta, tất nhiên, là #EMP với ai#! — mặc dù những người thông minh nhất trong chúng Ta cũng hỏi cách #EMP thành tâm#! — Ta sẽ cam kết..."

  head_of_faith.0001.t:0 "$head_of_faith.0000.t$: Sunni"
  head_of_faith.0001.desc:0 "Chúng Ta [ROOT.Char.GetFaith.GetAdherentName] đã chọn đi theo con đường của hậu duệ Abu Bakr, $head_of_faith.0000.desc$"
  head_of_faith.0001.a:0 "Điều chỉnh lại theo chính thống Sunni là lựa chọn duy nhất của chúng ta."
  head_of_faith.0001.b:0 "Chúng ta phải tiếp tục gắn bó với quyền lực [old_caliph.GetFaith.GetAdjectiveNoTooltip]!"
  head_of_faith.0001.c:0 "[sunni_caliph.GetTitledFirstNameNoTooltip] có sự trung thành #EMP của chúng ta..."
  head_of_faith.0001.d:0 "Chúng ta sẽ theo [old_caliph.GetTitledFirstNameNoTooltip]... tạm thời..."

  head_of_faith.0011.t:0 "$head_of_faith.0000.t$: Shia"
  head_of_faith.0011.desc:0 "[ROOT.Char.GetFaith.GetName] theo dòng Ali bất khả sai, $head_of_faith.0000.desc$"
  head_of_faith.0011.a:0 "Tư tưởng Shia chính thống gọi mời chúng Ta."
  head_of_faith.0011.b:0 "$head_of_faith.0001.b$"
  head_of_faith.0011.c:0 "[shia_caliph.GetTitledFirstNameNoTooltip] ra lệnh cho chúng Ta. Hiện tại."
  head_of_faith.0011.d:0 "$head_of_faith.0001.d$"

  head_of_faith.0021.t:0 "$head_of_faith.0000.t$: Muhakkima"
  head_of_faith.0021.desc:0 "Từ chối chính trị tầm thường của Sunni và Shia đã để lại [ROOT.Char.GetFaith.GetName] là tín đồ dòng Muhakkima của Hồi giáo. Mặc dù các thành viên thường của phong trào không mong Ta cam kết phục tùng một caliph hiện có, họ có thể chấp nhận nếu Ta làm rõ lòng trung thành của mình."
  head_of_faith.0021.a:0 "Chúng Ta có thể bầu lãnh đạo của riêng mình."
  head_of_faith.0021.b:0 "$head_of_faith.0001.b$"

  head_of_faith.0031.t:0 "$head_of_faith.0000.t$: Zandaqa"
  head_of_faith.0031.desc:0 "Là Zandaqa, chúng Ta ít quan tâm cách các dòng Hồi giáo khác truy tìm dòng kế vị của Nhà Tiên Tri, và họ cũng không ưa chúng Ta. Các đồng đạo [ROOT.Char.GetFaith.GetAdherentNamePlural] chắc chắn không mong Ta tuyên bố phục tùng bất kỳ caliph hiện có nào.\n\nTuy nhiên, có lẽ bằng cách cam kết trung thành với một trong các cường quốc Hồi giáo, có thể mua được phần nào an ninh và khoan dung cho đức tin của chúng ta..."
  head_of_faith.0031.a:0 "$head_of_faith.0021.a$"
  head_of_faith.0031.b:0 "$head_of_faith.0001.a$"
  head_of_faith.0031.c:0 "$head_of_faith.0011.a$"
  head_of_faith.0031.d:0 "$head_of_faith.0001.b$"
  head_of_faith.0031.rejection_body:0 "từ chối lời cam kết"
  head_of_faith.0031.acceptance_body:0 "chấp nhận lời cam kết"
  head_of_faith.0031.rejection.outcome:0 "Ngài buộc phải đi con đường của riêng mình"
  head_of_faith.0031.b.rejection:0 "@piety_level_0_icon_islam! [sunni_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.rejection_body$"
  head_of_faith.0031.b.acceptance:0 "@piety_level_3_icon_islam! [sunni_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.acceptance_body$"
  head_of_faith.0031.c.rejection:0 "@piety_level_0_icon_islam! [shia_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.rejection_body$"
  head_of_faith.0031.c.acceptance:0 "@piety_level_3_icon_islam! [shia_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.acceptance_body$"
  head_of_faith.0031.d.rejection:0 "@piety_level_0_icon_islam! [old_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.rejection_body$"
  head_of_faith.0031.d.acceptance:0 "@piety_level_3_icon_islam! [old_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.acceptance_body$"
  head_of_faith.0032.t:0 "Lời Cam Kết Đức Tin"
  head_of_faith.0032.desc:0 "Đối với [pledge_target.GetTitledFirstNameNoTooltip], chúng Ta, những [pledgeing_individual.GetFaith.GetAdherentNamePlural], mong muốn cam kết trung thành với Ngài và xem Ngài là [head_of_faith|E] của chúng Ta.\n\nXin Ngài vui lòng dẫn dắt chúng Ta?"
  head_of_faith.0032.a:0 "@piety_level_3_icon_islam! Tất nhiên rồi, Ta làm sao có thể nói không?"
  head_of_faith.0032.b:0 "@piety_level_0_icon_islam! Cút đi, lũ ăn mày hèn hạ!"
  head_of_faith.0032.notif.a:0 "[pledge_target.GetTitledFirstNameNoTooltip] đã chấp nhận lời cam kết của Ngài!"
  head_of_faith.0032.notif.b:0 "[pledge_target.GetTitledFirstNameNoTooltip] đã từ chối lời cam kết của Ngài!"
