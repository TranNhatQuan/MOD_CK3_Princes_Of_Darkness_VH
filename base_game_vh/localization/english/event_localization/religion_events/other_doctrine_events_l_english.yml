l_english:
 #False conversion events.
  false_conversion.0020.t:0 "Crypto-[old_faith.GetNameNoTooltip]"
  false_conversion.0020.desc:0 "Trong đời sống công khai, Ta theo [ROOT.Char.GetFaith.GetNameNoTooltip] từng chữ. Ta tuân theo các giá trị [ROOT.Char.GetFaith.GetAdjectiveNoTooltip], đọc [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetFaith.ReligiousText], và đi đến các [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetFaith.HouseOfWorshipPlural].\n\nTuy nhiên, sau cánh cửa đóng kín, Ta thấy khó mà buông bỏ các giáo lý của [old_faith.GetNameNoTooltip], và một phần trong Ta khao khát được thực hành các đường lối cũ một cách công khai.\n\nCó lẽ bây giờ là lúc để khẳng định lại bản sắc [old_faith.GetAdherentNameNoTooltip] của Ta, mang theo những tín đồ bí mật và những người mới cải đạo mà Ta có thể?"
  false_conversion.0020.desc_landless: "Cho đến thời điểm này, Ta đã theo [ROOT.Char.GetFaith.GetNameNoTooltip] từng chữ. Ta tuân theo các giá trị [ROOT.Char.GetFaith.GetAdjectiveNoTooltip], đọc [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetFaith.ReligiousText], và đi đến các [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetFaith.HouseOfWorshipPlural].\n\nTuy nhiên, sau cánh cửa đóng kín, Ta thấy khó buông bỏ các giáo lý của [old_faith.GetNameNoTooltip], và một phần trong Ta khao khát quay lại các đường lối cũ.\n\nCó lẽ bây giờ là lúc để khẳng định lại bản sắc [old_faith.GetAdherentNameNoTooltip] của Ta, và củng cố điều này trong [ROOT.Char.Custom('GetCourt')|l]?"
  false_conversion.0020.a:0 "[old_faith.HighGodName] biết trái tim Ta!"
  false_conversion.0020.b:0 "Không, không, chưa phải lúc."
  false_conversion.0020.c: "$false_conversion.0020.a$"
  false_conversion.0030.t:0 "Ân Xá Cho Các Tín Đồ Bí Mật"
  false_conversion.0030.desc_start:0 "Những câu chuyện đã đến tai Ta về một số người trong lãnh thổ Ta, những người âm thầm thực hành các tín ngưỡng bí ẩn, toàn phần hay từng phần.\n\n"
  false_conversion.0030.desc_no_secret_faith:0 "Dù Ta là một [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] kiên định, đức tin của Ta luôn đề cao lý tưởng đa nguyên, và thật đáng tiếc khi một số người cảm thấy họ phải giữ bí mật việc thờ phụng vì sợ bị đàn áp.\n\n"
  false_conversion.0030.desc_no_secret_faith_not_pluralist:0 "Một số tín đồ bí mật này có thể là [ROOT.Char.GetFaith.GetAdherentNameNoTooltip], bị đẩy vào bóng tối từ lâu vì sự bức hại tôn giáo.\n\n"
  false_conversion.0030.desc_has_secret_faith:0 "Bản thân Ta cũng gặp khó khăn khi buông bỏ nhiều nghi lễ và niềm tin của [old_faith.GetNameNoTooltip]. Dù Ta sẽ không bao giờ thừa nhận việc thờ phụng tiếp tục trước công chúng, trái tim Ta vẫn đau xót trước hoàn cảnh của những cộng đồng bí mật của các tín đồ crypto.\n\n"
  false_conversion.0030.desc_end:0 "Tất nhiên, với tư cách là [ROOT.Char.GetTitleAsNameNoTooltip], Ta có thể ban một ân xá công khai cho tất cả những người cải đạo giả..."
  false_conversion.0030.a:0 "Ai cũng nên được tự do thờ phụng thần linh!"
  false_conversion.0030.a.tt:0 "Ta sẽ được thông báo có bao nhiêu, nếu có, tín đồ crypto nhận lời đề nghị của Ta."
  false_conversion.0030.b_no_secret_faith:0 "Crypto cái gì? Thật vô lý."
  false_conversion.0030.b_has_secret_faith:0 "Một số bí mật thì tốt hơn là nên giữ."
  false_conversion.0031.t:0 "$false_conversion.0030.t$"
  false_conversion.0031.desc:0 "Bệ hạ của Ta, [ROOT.Char.GetLiege.GetTitledFirstName], đã ban hành một thông báo chung trên toàn [ROOT.Char.GetLiege.GetPrimaryTitle.GetNameNoTier] rằng họ muốn mọi người thờ phụng thần linh một cách công khai, bất kể bản chất đức tin của họ. [ROOT.Char.GetLiege.GetSheHe|U] đang ban ân xá cho những người thực hành tôn giáo của họ trong bí mật."
  false_conversion.0031.a:0 "Cuối cùng, chúng ta thoát khỏi bóng tối!"
  false_conversion.0031.b:0 "Chúng ta từng nghe những lời dối trá về sự khoan dung trước đây..."

  false_conversion.1000.t: "Chấm Dứt [ROOT.Char.GetFaith.GetName]"
  false_conversion.1000.desc_intro: "[actor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] cuối cùng đã yêu cầu Ta"
  false_conversion.1000.desc_has_family: "và cả gia đình Ta"
  false_conversion.1000.desc_convert: "cải đạo sang [actor.GetFaith.GetName].\n\n"
  false_conversion.1000.desc_forced: "[actor.GetSheHe|U] gần như đã áp đặt thanh kiếm lên cổ Ta để yêu cầu việc này bằng cách dùng [actor.GetHerHis] quyền lực chống lại Ta. Tuy nhiên, nếu Ta chấp nhận rủi ro, Ta có thể tiếp tục thực hành [ROOT.Char.GetFaith.GetName] "
  false_conversion.1000.desc_voluntary: "Ta đã chấp nhận yêu cầu của [actor.GetHerHis], nhiều hay ít. Nhưng có lẽ có cách để giảng dạy [actor.GetFaith.GetNameNoTooltip] một cách công khai, nhưng vẫn thực hành [ROOT.Char.GetFaith.GetName] "
  false_conversion.1000.desc_bold: "một cách thách thức bí mật."
  false_conversion.1000.desc_cowardly: "sau tấm màn."
  false_conversion.1000.desc_outro: "\n\nĐây là một quyết định nặng nề phải tự mình đưa ra..."
  false_conversion.1000.a: "Những đường lối cũ chết hôm nay."
  false_conversion.1000.b_single: "Ta sẽ giữ [actor.GetFaith.GetNameNoTooltip] trên môi, nhưng [ROOT.Char.GetFaith.GetNameNoTooltip] trong tim."
  false_conversion.1000.b_sanctioned_single: "[ROOT.Char.GetFaith.HighGodName] sẽ tha thứ cho Ta vì thực hành [ROOT.Char.GetFaith.GetName] trong bí mật."
  false_conversion.1000.b_plural: "Chúng Ta sẽ giữ [actor.GetFaith.GetNameNoTooltip] trên môi, nhưng [ROOT.Char.GetFaith.GetNameNoTooltip] trong tim chúng Ta."
  false_conversion.1000.b_sanctioned_plural: "[ROOT.Char.GetFaith.HighGodName] sẽ tha thứ cho chúng Ta vì thực hành [ROOT.Char.GetFaith.GetName] trong bí mật."

  false_conversion.1010.desc_has_no_family: "và [spouse.Custom2('MyCharacterIntroduction', ROOT.Char)]"
  false_conversion.1010.desc_spouse_intro: "[spouse.GetFirstNameNoTooltip] và Ta đã trải qua nhiều đêm dài cố gắng tránh các yêu cầu của [actor.GetTitledFirstNamePossessiveNoTooltip] mà không thành công. Cuối cùng, [spouse.GetFirstNameNoTooltip] nói lên suy nghĩ của [spouse.GetHerHis]:\n\n"
  false_conversion.1010.desc_spouse_advises_secrecy: ""Chúng ta không thể bỏ rơi [spouse.GetFaith.HighGodName], bất kể [actor.GetTitledFirstNameNoTooltip] yêu cầu gì. Chúng ta phải tiếp tục thờ phụng [spouse.GetFaith.HighGodName], dù chỉ trong bí mật.""
  false_conversion.1010.desc_spouse_advises_conversion_cynical: ""Cho dù chúng ta thờ [actor.GetFaith.GetNameNoTooltip] hay [spouse.GetFaith.GetNameNoTooltip] thì cũng không khác gì với Ta. Nhưng nếu [actor.GetTitledFirstNameNoTooltip] muốn chúng ta theo [actor.GetFaith.GetNameNoTooltip], thì tại sao chúng ta không làm?""
  false_conversion.1010.desc_spouse_advises_conversion_neutral: ""Dù Ta đau lòng khi nói vậy, chúng ta không thể thực hành [spouse.GetFaith.GetNameNoTooltip], ngay cả trong bí mật. Chúng ta phải theo ý muốn của [actor.GetTitledFirstNameNoTooltip] và cải đạo sang [actor.GetFaith.GetNameNoTooltip].""
  false_conversion.1010.desc_outro_demure: "\n\nTa có nên nghe lời khuyên của "
  false_conversion.1010.desc_spouse_disliked: "[spouse.Custom2('InsultAdjective', ROOT.Char)] "
  false_conversion.1010.desc_spouse_liked: "[spouse.Custom('ComplimentAdjective')] "
  false_conversion.1010.desc_outro_wife_husband: "[spouse.GetWifeHusband]?"

  false_conversion.2000.t: "Khoảnh Khắc Yếu Đuối"
  false_conversion.2000.desc_intro: "Càng dành nhiều thời gian với [vulnerable_relation.Custom2('MyCharacterIntroduction', owner)], càng thấy [vulnerable_relation.GetHerHis] trở nên áp đảo"
  false_conversion.2000.desc_descriptor_grief: "nỗi đau"
  false_conversion.2000.desc_descriptor_depression: "trầm cảm"
  false_conversion.2000.desc_descriptor_stress: "căng thẳng"
  false_conversion.2000.desc_bridge: "ngày càng rõ rệt.\n\n"
  false_conversion.2000.desc_quote_grief: ""Ngay cả những điều nhỏ nhất cũng nhắc Ta nhớ đến [deceased_character.GetFirstName]," [vulnerable_relation.GetTitledFirstNameNoTooltip] than thở. "Bây giờ Ta sẽ sống thế nào trên đời này khi không có họ?"" 
  false_conversion.2000.desc_quote_depression: ""Mỗi ngày càng khó khăn hơn ngày hôm trước," [vulnerable_relation.GetTitledFirstNameNoTooltip] tâm sự với Ta. "Làm sao Ta có thể tiếp tục thế này, khi ý chí sống dần rời mắt Ta?"" 
  false_conversion.2000.desc_quote_stress: ""Những phiền muộn hàng ngày đã trở nên đau đớn với Ta," [vulnerable_relation.GetTitledFirstNameNoTooltip] than thở. "Mỗi ngày Ta cầu nguyện để được giải thoát khỏi số phận không thể tránh khỏi.""
  false_conversion.2000.desc_outro: "\n\nCó lẽ [owner.GetSecretFaith.HighGodName] sẽ thổi luồng sinh khí mới vào xác thân héo mòn này..."
  false_conversion.2000.a: ""[owner.GetSecretFaith.GetName] sẽ xoa dịu nỗi buồn của Ngài.""
  false_conversion.2000.a_flavor: "[vulnerable_relation.GetTitledFirstNameNoTooltip] sẽ cân nhắc cải đạo bí mật sang [owner.GetSecretFaith.GetNameNoTooltip]"
  false_conversion.2000.a_success: "[vulnerable_relation.GetTitledFirstNameNoTooltip] tìm thấy sự an ủi trong [owner.GetSecretFaith.HighGodName]"
  false_conversion.2000.a_failure: "[vulnerable_relation.GetTitledFirstNameNoTooltip] bị xúc phạm bởi đề nghị của Ta"
  false_conversion.2000.b: "Sai lầm nếu làm hơn việc an ủi [vulnerable_relation.GetTitledFirstNameNoTooltip]."

  false_conversion.2001.t: "Thời Khắc Cần Ta"
  false_conversion.2001.desc_grief: "Không ngày nào trôi qua mà Ta không nhớ [deceased_character.GetTitledFirstName]. Mỗi lời nhắc về cuộc sống của [deceased_character.GetHerHis] trên đời lại mở ra một giếng nỗi buồn mới."
  false_conversion.2001.desc_depression: "Những ngày lê thê trôi qua vô tận với niềm vui và nỗi buồn mới từ mọi người xung quanh. Nhưng Ta vẫn ở đây, lạc trong biển xám, chìm đắm suốt [vulnerable_relation.GetAge] năm qua."
  false_conversion.2001.desc_stress: "Ta phát triển thói quen không kiểm soát như giật mình. Ta cắn móng tay, nghiến răng, đi đi lại lại mệt mỏi trước khi nằm trên giường thức trắng. Và vẫn, Ta thấy bản thân bị áp lực quá mức không thể hiểu nổi."
  false_conversion.2001.desc_outro: "\n\nNgay khi Ta tự hỏi làm sao tiếp tục, [vulnerable_relation.Custom2('RelationToMeAddress', owner)] thì thầm bên tai Ta. "Ngài chỉ cần đón nhận sức mạnh chữa lành của [owner.GetSecretFaith.GetName], [owner.Custom2('RelationToMeAddress', vulnerable_relation)], và mọi phiền muộn sẽ bị quên lãng.""
  false_conversion.2001.a: "Vậy Ta sẽ ôm trọn [owner.GetSecretFaith.GetNameNoTooltip] bằng cả trái tim mình!"
  false_conversion.2001.b: "Ý Ngài là gì, [owner.GetTitledFirstNameNoTooltip]?"
  false_conversion.2001.b_flavor: "[owner.GetTitledFirstNameNoTooltip] không nói thêm gì... cho đến bây giờ"

  false_conversion.8000.t: "Đức Tin Ta Bị Phơi Bày"
  false_conversion.8000.desc_intro: "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã tiết lộ rằng Ta thực hành [ROOT.Char.GetSecretFaith.GetName] sau cánh cửa đóng kín!"
  false_conversion.8000.desc_disapproving_chaplain: "[disapproving_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] yêu cầu Ta ăn năn công khai và khuất phục trước [disapproving_chaplain.GetFaith.HighGodName]."
  false_conversion.8000.desc_silent_chaplain: "[silent_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] im lặng về vấn đề này, do đó Ta phải tự xử lý các yêu cầu ăn năn."
  false_conversion.8000.desc_outro: ""
  false_conversion.8000.a: "Ta sẽ không bao giờ nghi ngờ [ROOT.Char.GetFaith.GetNameNoTooltip] nữa!"
  false_conversion.8000.b: "[ROOT.Char.GetSecretFaith.GetNameNoTooltip] là đức tin duy nhất đúng!"

  event_false_convert_my_vassal.t:0 "Chư Hầu Bị Tiết Lộ Là Tín Đồ Bí Mật"
  event_false_convert_my_liege.t:0 "Quản Lãnh Bị Tiết Lộ Là Tín Đồ Bí Mật"
  event_false_convert_interface.desc:0 "[ROOT.Char.GetShortUIName] đã từ bỏ đức tin công khai của [ROOT.Char.GetHerHis] mình để theo [ROOT.Char.GetFaith.GetName], để lộ bản thân là một kẻ theo tôn giáo bí mật."
  event_false_converts.t:0 "Các Tín Đồ Crypto Bị Tiết Lộ"
  event_false_converts_plus_counties.desc:0 "[ROOT.Var('num_false_converts_vassal').GetValue|V0] chư hầu có đất của Ta đã từ bỏ đức tin công khai.\n\n[ROOT.Var('num_false_converts_landless').GetValue|V0] nhân vật không có đất trong triều của Ta đã từ bỏ đức tin công khai.\n\n[ROOT.Var('num_false_converts_counties').GetValue|V0] hạt của Ta chứa cộng đồng tín đồ crypto rộng lớn đã công khai đức tin bí mật của họ."
  event_false_converts_without_counties.desc:0 "[ROOT.Var('num_false_converts_vassal').GetValue|V0] chư hầu có đất của Ta đã từ bỏ đức tin công khai.\n\n[ROOT.Var('num_false_converts_landless').GetValue|V0] nhân vật không có đất trong triều của Ta đã từ bỏ đức tin công khai."
  event_false_converts_counties_only.desc:0 "[ROOT.Var('num_false_converts_counties').GetValue|V0] hạt trong lãnh thổ Ta chứa cộng đồng rộng lớn của crypto-[ROOT.Char.GetFaith.GetAdherentNameNoTooltip], và nhiều trong số này đã công khai đức tin cùng với Ta."

  false_convert_modifier:0 "Nghi Ngờ Cải Đạo Giả"
  false_convert_modifier_desc:0 "Nhiều cộng đồng trong hạt này được cho là vẫn thực hành đức tin cũ trong bí mật."
  relieved_cryptos_modifier:0 "Tín Đồ Crypto Nhẹ Nhõm"
  relieved_cryptos_modifier_desc:0 "Dân chúng nơi đây biết ơn vì được phép thực hành đức tin một cách công khai trở lại."

 # Spreading the crypto-faith events
  convert_to_crypto_religion_key: "Cải đạo sang Crypto-[ROOT.Char.GetSecretFaith.GetNameNoTooltip]"
  convert_to_crypto_religion_interaction_key: "Cải đạo sang Crypto-[actor.GetSecretFaith.GetNameNoTooltip]"
  convert_to_crypto_religion_interaction: "$convert_to_crypto_religion_interaction_key$ #weak (Scheme)#!"
  convert_to_crypto_religion_interaction_desc: "Cố gắng khiến [recipient.GetShortUINameNoTooltip] trở thành tín đồ bí mật của [actor.GetSecretFaith.GetName]"
  convert_to_crypto_religion: "Cải đạo sang Crypto-#D Religion#!"
  convert_to_crypto_religion_desc: "Ta sẽ truyền bá trí tuệ của [SCHEME.GetOwner.GetSecretFaith.KnowledgeGodName] tới [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] và biến [SCHEME.GetTargetCharacter.GetHerHim] thành tín đồ bí mật của [SCHEME.GetOwner.GetSecretFaith.GetNameNoTooltip]."
  convert_to_crypto_religion_desc_general: "Dạy một mục tiêu trở thành tín đồ bí mật của [CHARACTER.GetSecretFaith.GetName]."
  convert_to_crypto_religion_action: "Cải đạo"
  convert_to_crypto_religion_interaction_notification: "$convert_to_crypto_religion_interaction_key$"
  convert_to_crypto_religion_scheme_invalidated_title: "@scheme_icon! Kế Hoạch $convert_to_crypto_religion$ Kết Thúc"
  convert_to_crypto_religion_general_desc: "Một [scheme|E] để giới thiệu đức tin bí mật cho một mục tiêu với hy vọng mở rộng cộng đồng bí mật của người sở hữu."
  convert_to_crypto_religion_no_more_secret: "Ta không còn thực hành Crypto-[CHARACTER.GetSecretFaith.GetName] nữa."
  convert_to_crypto_religion_invalid: "Ta không thể cải đạo [target.GetShortUIName|U] sang Crypto-[CHARACTER.GetSecretFaith.GetName] nữa."
