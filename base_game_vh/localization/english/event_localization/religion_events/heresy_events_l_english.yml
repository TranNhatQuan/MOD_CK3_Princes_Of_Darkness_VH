l_english:
  heresy.0010.t:2 "Dị giáo: [heretic_faith.GetAdherentNamePluralNoTooltip] tại [heretic_title.GetNameNoTierNoTooltip]"
  heresy.0010.desc:1 "[heretic_ruler.GetTitledFirstName] của [heretic_title.GetNameNoTier] đã công khai với thế giới rằng [heretic_ruler.GetSheHe] và các chư hầu của [heretic_ruler.GetHerHis] đã theo [heretic_faith.GetName]."
  heresy.0010.desc.nonexistant:1 "\n\nSau khi thất vọng với giáo lý của [origin_faith.GetAdjective] [origin_faith.PriestMalePlural], các quý tộc của [heretic_title.GetNameNoTierNoTooltip] không còn coi [origin_faith.AltPriestTermPlural] là chính trực và chân thật. Là [heretic_faith.GetAdherentNamePluralNoTooltip], họ tin rằng đức tin mới của mình phù hợp hơn với ý muốn của [heretic_faith.HighGodName] và họ đang dần tách khỏi các thể chế tôn giáo trước đây."
  heresy.0010.desc.exists:1 "\n\nSau khi thất vọng với giáo lý của [origin_faith.GetAdjective] [origin_faith.PriestMalePlural], các quý tộc của [heretic_title.GetNameNoTierNoTooltip] không còn coi [origin_faith.AltPriestTermPlural] là chính trực và chân thật và đang dần tách khỏi các thể chế tôn giáo trước đây. Thay vào đó, họ tuyên xưng mình là [heretic_faith.GetAdherentNamePluralNoTooltip], với giáo lý mà họ cảm thấy phù hợp hơn với ý muốn của [heretic_faith.HighGodNamePossessive]."
  heresy.0010.desc.resurgent:1 "\n\nSau khi thất vọng với giáo lý của [origin_faith.GetAdjective] [origin_faith.PriestMalePlural], các quý tộc của [heretic_title.GetNameNoTierNoTooltip] không còn coi [origin_faith.AltPriestTermPlural] là chính trực và chân thật. Kết quả là, các quý tộc của [heretic_title.GetNameNoTierNoTooltip] đã phục hưng các giáo lý bị bỏ hoang của [heretic_faith.GetAdherentNamePluralNoTooltip], với giáo lý mà họ cảm thấy phù hợp hơn với ý muốn của [heretic_faith.HighGodNamePossessive]."
  heresy.0010.tt.custom:0 "[heretic_faith.GetName|V] xuất hiện tại [heretic_title.GetName]"
  heresy.0010.a.new_heresy:0 "Đây là sự nhạo báng đức tin của chúng ta sao!?"
  heresy.0010.a.existing_heresy:0 "Những kẻ dị giáo xấu xa đó đã lạc hướng họ!"
  heresy.0010.a.astray_faith:0 "Ta không hiểu, nhưng chắc là họ vui chăng?"
  heresy.0010.a.same_faith:0 "Ta biết họ sẽ sớm thấy ánh sáng thôi!"
  heresy.0010.b:0 "Nghe này, họ cũng có vài quan điểm hay mà..."
  heresy.0010.notification.title:0 "Phong Trào Tôn Giáo Mới"
  heresy.0010.notification:0 "[heretic_ruler.GetFullName] đã thành lập một phong trào [heretic_faith.GetAdjective] mới!"

  heresy.0011.notification.heresy:1 "[convert_ruler.Custom2('HierarchicalStatus', me)] Theo Dị Giáo: [convert_ruler.GetShortUINameNoTooltip]"
  heresy.0011.notification.same_faith:1 "[convert_ruler.Custom2('HierarchicalStatus', me)] Theo Đức Tin Chính Thống: [convert_ruler.GetShortUINameNoTooltip]"
  heresy.0011.notification.other:1 "[convert_ruler.Custom2('HierarchicalStatus', me)] Đổi Đức Tin: [convert_ruler.GetShortUINameNoTooltip]"
