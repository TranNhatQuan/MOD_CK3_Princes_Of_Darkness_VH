l_english:
  faith_conversion.1001.t:0 "Chuyển Đạo"
  faith_conversion.1001.start:0 "Với quyết định theo [new_faith.GetName], Ta đã sắp xếp để một [new_faith.PriestNeuter] đến [ROOT.Char.Custom('GetCourt')|l] của Ta và tiến hành nghi lễ.\n\n"
  faith_conversion.1001.desc:0 "Với số phận linh hồn bất tử của Ta đang được đặt câu hỏi, Ta chỉ có thể cầu nguyện rằng mình đã đưa ra quyết định đúng đắn.\n\nBỏ qua Metaphysica,"
  faith_conversion.1001.desc.zealous:0 "Khi [template_priest.GetSheHe] đọc các câu từ [new_faith.ReligiousText], Ta có thể #EMP cảm nhận#! lòng tin trong Ta bùng cháy mạnh mẽ hơn — không còn nghi ngờ gì trong tâm trí Ta rằng mình đã chọn con đường đúng đắn.\n\nDù lòng nhiệt thành của Ta mạnh mẽ đến đâu,"
  faith_conversion.1001.desc.zealous.carnal_male:0 "Khi [template_priest.GetSheHe] đọc các câu từ [new_faith.ReligiousText], Ta có thể #EMP cảm nhận#! niềm tin trong Ta trỗi dậy — không còn nghi ngờ gì trong tâm trí Ta rằng mình đã chọn con đường đúng đắn.\n\nDù lòng nhiệt thành của Ta mạnh mẽ đến đâu,"
  faith_conversion.1001.desc.zealous.carnal_female:0 "Khi [template_priest.GetSheHe] đọc các câu từ [new_faith.ReligiousText], Ta có thể #EMP cảm nhận#! niềm tin nhịp đập trong Ta — không còn nghi ngờ gì trong tâm trí Ta rằng mình đã chọn con đường đúng đắn.\n\nDù lòng nhiệt thành của Ta mạnh mẽ đến đâu,"

  faith_conversion.1001.desc.compassionate:0 "Với số phận linh hồn bất tử của Ta — cũng như linh hồn của thần dân — Ta cầu nguyện rằng mình đã đưa ra quyết định đúng đắn.\n\nBỏ qua Metaphysica,"
  faith_conversion.1001.desc.reincarnation:0 "Với sinh mệnh kiếp sau của Ta đang được đặt câu hỏi, Ta cầu nguyện rằng mình đã đưa ra quyết định đúng đắn.\n\nBỏ qua Metaphysica,"
  faith_conversion.1001.desc.cynical:0 "Mặc dù Ta không thực sự tin vào những lời vớ vẩn mà [new_faith.PriestNeuter] nói, nhưng có đủ lợi ích chính trị khi chuyển đạo khiến Ta biết rằng sớm muộn gì Ta cũng phải làm điều này.\n\nBất kể lý do của Ta, "

  faith_conversion.1001.end.is_vassal.convert_away:0 "mối quan tâm cấp bách nhất của Ta là trần tục — [my_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] sẽ phản ứng thế nào khi biết rằng Ta đã từ bỏ đức tin của [my_liege.GetHerHis]?"
  faith_conversion.1001.end.is_vassal.convert_to:0 "Ta có thể thở phào nhẹ nhõm khi biết rằng [my_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] sẽ không còn dùng đức tin của Ta để chống lại Ta."
  faith_conversion.1001.end.is_top_liege.convert_away:0 "mối quan tâm cấp bách nhất của Ta là trần tục — khi hầu hết các chư hầu theo đức tin khác, liệu Ta có thể giữ vững lãnh thổ trước các cuộc nổi loạn nội bộ và những kẻ cơ hội bên ngoài không?"
  faith_conversion.1001.end.is_top_liege.convert_to:0 "Ta có thể an tâm khi biết rằng phần lớn lãnh thổ của Ta đoàn kết dưới [new_faith.PantheonTerm], một vương quốc thật sự [new_faith.GetAdjectiveNoTooltip]."
  faith_conversion.1001.end.is_landless_adventurer: "ý tưởng về việc [new_faith.GetNameNoTooltip] lan tỏa — từng bước một — từ trại khiêm tốn của Ta khiến lòng Ta rộn ràng."

  faith_conversion.1001.a:0 "Vinh quang thuộc về [ROOT.Char.GetFaith.HighGodName]!"
  faith_conversion.1001.b:0 "Ít nhất Ta có [template_priest.GetFirstNameNoTooltip] dẫn dắt..."

  faith_conversion.1101.toast:0 "Chư Hầu Chuyển Đạo"
