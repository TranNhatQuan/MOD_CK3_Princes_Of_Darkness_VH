l_english:
  holy_order_hired_message:0 "Đơn vị Thánh được thuê"
  holy_order.hired_message:1 "[holy_order.GetName] đã được triệu tập bởi [actor.GetUIName]"
  holy_order_hired_by_enemy_message:0 "Đơn vị Thánh của Kẻ Thù"
  holy_order.hired_by_enemy:1 "[holy_order.GetName] đã được triệu tập bởi [actor.GetUIName], và giờ đứng chống lại chúng ta"
  holy_order.destroyed_message:1 "[title.GetName] đã bị phá hủy"
  holy_order_expanded:0 "Đơn vị Thánh mở rộng"
  holy_order.new_lease:1 "[holy_order.GetName] hiện đang thuê [barony.GetName] từ [former_holder.GetTitledFirstName]"

  holy_order.0001.t:0 "Đơn vị Thánh"
  holy_order.0001.desc_opening:0 "[recipient.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] đứng ngoài chờ Ta, [recipient.GetHerHis] hành lý và đoàn tùy tùng đã sẵn sàng.\n\n"
  holy_order.0001.desc:0 "“Vậy, [root.GetLadyLord] của Ta, chuyến đi này sẽ đưa Ta tới đâu?”"
  holy_order.0001.desc_relation:0 "“Vậy, [recipient.Custom2('RelationToMeShort', ROOT.Char)], chuyến đi này sẽ đưa Ta tới đâu?”"
  holy_order.0001.a:0 "Ngươi sẽ tới [holy_order_1.GetName]."
  holy_order.0001.b:0 "[holy_order_2.GetName] là điểm đến của ngươi."
  holy_order.0001.c:0 "Xa xôi. Tới [recipient.GetHerHim]!"
  holy_order.0001.d:0 "Ngươi giờ là một vấn đề đối với [holy_order_4.GetName]."
  holy_order.0001.e:0 "Ta đã sai— ngươi thuộc về nơi này!"

  holy_order.0002.desc:0 "Ta sẽ đáp lời kêu gọi phục vụ quyền lực tối cao, và cảm ơn ngươi đã đặt Ta trên con đường chính nghĩa này."
  holy_order.0002.a:0 "Ta chắc chắn ngươi sẽ phục vụ [ROOT.Char.GetFaith.HighGodName] tốt!"

  char_interaction.0001.opening_low_piety:0 "Một kẻ [ROOT.GetCharacter.Custom('GetSinfulShameful')] như ngươi lại bò đến trước một đơn vị thánh của [ROOT.Char.GetFaith.HighGodName]... Ngươi nên tập trung cứu rỗi linh hồn mình trước khi lo lắng về của cải trần gian."
  holy_order.0200.desc_opening:0 "[recipient.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
  holy_order.0200.desc:0 "Ta đã nghe lời kêu cứu của ngươi về vàng, và [order.GetName] sẽ đáp lời."
  holy_order.0200.a:0 "[ROOT.Char.GetFaith.HighGodName] mỉm cười với ta!"
  holy_order.0200.b:0 "Nhưng... Nhưng Ta cần tiền!"

  holy_order.0202.second_time:0 "Một lần nữa Ta nhắc ngươi rằng ngươi còn nợ đơn vị chúng Ta #bold [ROOT.Var('loan_amount_owed').GetValue|0]#! vàng."
  holy_order.0202.opening:0 "Ngươi còn nợ đơn vị chúng Ta #bold [ROOT.Var('loan_amount_owed').GetValue|0]#! vàng."
  holy_order.0202.desc:0 "Nếu ngươi không trả vàng, chúng Ta sẽ tìm cách khác để ngươi hoàn trả — cách hợp với ý muốn của [ROOT.Char.GetFaith.HighGodName], nhưng có thể không hợp với ngươi."
  holy_order.0202.a:0 "Tất nhiên, Ta sẽ giữ lời."
  holy_order.0202.a_no:0 "Ta sẽ trả! Chỉ cần cho Ta tìm vàng..."
  holy_order.0202.a._not.tt:0 "@warning_icon! #X Không đủ [gold_i][gold|E]#!"
  holy_order.0202.b_christian:0 "Nhẫn nại chẳng phải là đức hạnh sao?"
  holy_order.0202.b:0 "Là một tín đồ đồng hành... Xin cho Ta thêm thời gian!"
  holy_order.0202.b.tt:0 "[recipient.GetTitledFirstNameNoTooltip] sẽ cho ngươi thêm 5 năm"
  holy_order.0202.c:0 "Có lẽ chúng ta có thể tìm cách trả khác...?"
  holy_order.0202.c.tt:0 "@warning_icon! #X [recipient.GetTitleAsNameNoTooltip] sẽ yêu cầu điều gì đó từ ngươi#!"
  holy_order.0202.d:0 "Vàng ở tay Ta sẽ hữu ích hơn!"

  holy_order.0203.desc:0 "Ta không thiện cảm với những kẻ thất hứa, và [ROOT.Char.GetFaith.HighGodNameAlternate] cũng vậy. Để sửa sai này, ngươi sẽ cho chúng Ta thuê [province.GetName] để tiếp tục công việc của [ROOT.Char.GetFaith.HighGodNamePossessive]."
  holy_order.0203.a:0 "Tất nhiên [province.GetNameNoTierNoTooltip] sẽ thuộc về các ngươi."
  holy_order.0203.b:0 "Yêu cầu này thật nực cười!"

  holy_order.0204.desc:0 "Ta không thiện cảm với những kẻ thất hứa, và [ROOT.Char.GetFaith.HighGodNameAlternate] cũng vậy. Để sửa sai này, ngươi sẽ gửi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetTitledFirstName] của ngươi để làm công việc của [ROOT.Char.GetFaith.HighGodNamePossessive]."
  holy_order.0204.a:0 "Ta sẽ... ta sẽ tiễn [child.GetHerHim] lên đường."
  holy_order.0204.a.tt:1 "Ngươi sẽ không còn nợ đơn vị vàng nào nữa"

  holy_order.0205.desc:0 "Toàn bộ chuyện vay mượn này thật là sự thể hiện đáng xấu hổ của lòng tham của ngươi. Ta sẽ chắc rằng [ROOT.Char.GetFaith.ReligiousHeadName] sẽ nghe về chuyện này!"
  holy_order.0205.a:0 "Chết tiệt!"

  holy_order_letter.opening:0 "Người phục vụ đồng hành của [ROOT.Char.GetFaith.HighGodNameAlternate]"
  holy_order.1001.intro:1 "Khi đơn vị [holy_order.GetName] của chúng Ta phát triển, chúng Ta cần thêm đất đai để tổ chức phòng thủ cho đức tin [ROOT.Char.GetFaith.GetAdjective]."
  holy_order.1001.end:0 "\n\n[target_barony.GetName] hoàn toàn phù hợp với mục đích của chúng ta, và chúng ta muốn cho thuê nó để phục vụ cho sự nghiệp của chúng ta."
  holy_order.1001.a:0 "Yêu cầu của ngươi được chấp thuận. Vì [ROOT.Char.GetFaith.HighGodName]!"
  holy_order.1001.b:0 "[alternative_barony.GetNameNoTierNoTooltip] liệu không thể phục vụ tốt như vậy sao?"
  holy_order.1001.c:1 "Không, Ta sẽ không trao đất này cho ngươi."

  holy_order.2001.t:0 "Mục Đích Thiêng Liêng"
  holy_order.2001.desc:0 "Khi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))], [child.GetFirstName], đến gặp Ta, Ta nhanh chóng hiểu rằng [child.GetSheHe] có điều rất nghiêm trọng muốn bàn.\n\n[ROOT.Char.Custom('MotherFather')|U], cuộc đời Ta nơi đây sẽ luôn sống trong bóng của người khác. Hãy để Ta gia nhập [holy_order.GetName], và phục vụ [child.GetFaith.HighGodName]. Ta đã suy nghĩ kỹ và đó là điều Ta muốn làm."
  holy_order.2001.a:0 "Hãy để [child.GetFaith.HighGodNameAlternate] dẫn dắt ngươi, [child.Custom('DaughterSon')] của ta."
  holy_order.2001.b:0 "Chúng có thể không vĩ đại, nhưng ta có kế hoạch cho ngươi ở đây."

  holy_order.2002.desc:0 "Khi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling'))], [sibling.GetTitledFirstName], nói với Ta về kế hoạch của [sibling.GetHerHis], rõ ràng là [sibling.GetSheHe] đã suy nghĩ lâu về điều này.\n\n"Ở đây chẳng còn gì cho Ta, và nếu Ta phải phục vụ ai đó, Ta muốn phục vụ [sibling.GetFaith.HighGodName] [sibling.GetFaith.HighGodHerselfHimself]. Ta sẽ gia nhập [holy_order.GetName].""
  holy_order.2002.a:0 "Ta hiểu lựa chọn của ngươi, [sibling.Custom('SisterBrother')]."
  holy_order.2002.b:0 "Ồ, ngươi chắc chắn #EMP không được phép #! làm điều đó!"

  holy_order.2003.opening:0 "[grandmaster.Custom2('AppropriateGreetingPositive', ROOT.Char)|U]"
  holy_order.2003.desc:1 "Sẽ luôn có nhu cầu cho những chiến binh thật sự để ngăn chặn mọi mối đe dọa đến đức tin [grandmaster.GetFaith.GetAdjective].\nVới nhiều năng lực nhưng ít cơ hội thừa kế, Ta tin rằng [child.Custom('DaughterSon')], [child.GetTitledFirstName], của ngươi có thể có cuộc đời tốt hơn khi phục vụ [holy_order_scope.GetName]. Với chúng Ta, [child.GetSheHe] sẽ được huấn luyện, học hỏi và mang lại vinh dự lớn cho tên tuổi ngươi."
  holy_order.2003.a:0 "[child.GetHersHis|U] sẽ sống cuộc đời của một [child.GetFaith.GetAdherentName] thực thụ."
  holy_order.2003.child_joins_order:0 "[child.GetFirstName] nhận được [GetTrait('order_member').GetName( child.Self )] và gia nhập triều đình của [grandmaster.GetTitledFirstNameNoTooltip]"
  holy_order.2003.b:0 "Có lẽ ngươi có thể huấn luyện [alternative_child.GetFirstNameNoTooltip] thay?"
  holy_order.2003.alternative_child_joins_order:0 "[alternative_child.GetFirstName] nhận được [GetTrait('order_member').GetName( alternative_child.Self )] và gia nhập triều đình của [grandmaster.GetTitledFirstNameNoTooltip]"
  holy_order.2003.c:0 "[child.GetHerHis|U] thuộc về nơi đây với ta."

  holy_order.2004.opening:0 "[child.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
  holy_order.2004.desc:0 "Ta đã dâng hiến cuộc đời mình cho [child.GetFaith.HighGodNameAlternate], nhưng [child.GetFaith.HighGodNameSheHe] sẽ không muốn Ta bỏ mặc gia đình mình.\n\n[grandmaster.GetTitledFirstName] đã cho phép Ta trở về cuộc sống cũ, và trở thành một phần của [ROOT.Char.Custom('GetCourt')] của ngươi một lần nữa."
  holy_order.2004.a:0 "Chào mừng về nhà, [child.Custom('DaughterSon')] của ta!"
  holy_order.2004.b:0 "Không. Nơi đây không còn chỗ cho ngươi nữa."

  holy_order.2005.t:0 "Trở Về Nhà"
  holy_order.2005.desc:0 "Chuyến thăm của [child.GetTitledFirstNamePossessive] kéo dài lâu hơn bình thường. Chỉ sau khi [child.Custom('DaughterSon')] của ta đã ổn định [child.GetHerselfHimself] tại [ROOT.Char.Custom('GetCourt')] của ta — ngấu nghiến [child.GetHerselfHimself] thức ăn của ta và quấy rầy các tôi tớ của ta — ta mới mở lời về chuyện quay trở lại [holy_order.GetName]. Phản ứng của [child.GetHerHis|U] thật không may lại vô cùng hào hứng.\n\n"Người chưa nghe sao, [ROOT.Char.Custom('MotherFather')]? [grandmaster.GetTitledFirstName] đã rất rộng lượng khi miễn cho con khỏi các nghĩa vụ với [child.GetFaith.GetName]! Con cuối cùng đã về nhà, với gia đình của mình.""
  holy_order.2005.a:0 "Ồ, ngươi... ở lại đây sao?"

  holy_order.destroyed_title:0 "Đơn vị Thánh bị giải tán"
