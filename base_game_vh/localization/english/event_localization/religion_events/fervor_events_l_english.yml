l_english:
 #Scandal Event Localization
  fervor.1002.t:0 "Vị Linh Mục Tai Tiếng"
  fervor.1002.desc.start:0 "Thế giới [sinful_theocrat.GetFaith.GetAdjectiveNoTooltip] đã [sinful_theocrat.Custom('GetShockedExpression')] khi biết rằng [sinful_theocrat.Custom2('MyCharacterIntroduction', ROOT.Char)]"
  fervor.1002.desc.start_hof:0 "Thế giới [sinful_theocrat.GetFaith.GetAdjectiveNoTooltip] kinh hoàng khi biết rằng [sinful_theocrat.GetTitledFirstName] [sinful_theocrat.GetHerselfHimself]"
  fervor.1002.desc.lustful:0 "bị bắt quả tang 'trong tình trạng phạm tội' với vài người hầu trẻ trong nhà của [sinful_theocrat.GetHerHis]! Người hầu đáng thương phát hiện họ phải tránh ánh mắt [dummy_clergy_gender.GetHerHis] trong khi những kẻ phạm tội vội vàng lấy quần áo và mặc lại."
  fervor.1002.desc.chaste:0 "bị phát hiện đã không quan hệ tình dục trong nhiều năm! Dù nhận được nhiều đề nghị, [sinful_theocrat.Custom('GetCouncilOrTitleName')] dường như hoàn toàn không quan tâm đến chuyện xác thịt với bất kỳ ai."
  fervor.1002.desc.gluttonous:0 "đã bị phát hiện đang ngấu nghiến [sinful_theocrat.GetHerselfHimself] trong một bữa tiệc xa hoa gồm [sinful_theocrat.Custom('GetExpensiveMeal')], [sinful_theocrat.Custom('GetExpensiveMealAlt')], [sinful_theocrat.Custom('GetExpensiveDessert')], và [sinful_theocrat.Custom('GetExpensiveDrink')]. Sự đắm chìm thái quá trong bữa tiệc đã đổ bóng đen lên tính chính danh [sinful_theocrat.GetHerHis] của người này."
  fervor.1002.desc.temperate:0 "sống một lối sống khắc khổ kín đáo! [sinful_theocrat.GetSheHe] được cho là tránh mọi tiện nghi và xa hoa, thích sống giản dị nhất có thể."
  fervor.1002.desc.greedy:0 "đang biển thủ số tiền mà tín đồ [sinful_theocrat.GetHerHis] quyên góp từ thiện, dùng vào mục đích cá nhân của [sinful_theocrat.GetHerHis]!"
  fervor.1002.desc.generous:0 "đã bí mật sử dụng chính tiền của mình để nuôi sống người nghèo và những người túng thiếu!"
  fervor.1002.desc.lazy:0 "luôn bịa cớ để trì hoãn và tránh trách nhiệm của [sinful_theocrat.GetHerHis] bằng mọi giá!"
  fervor.1002.desc.diligent:0 "làm việc thâu đêm để hoàn thành một trong những dự án cá nhân của [sinful_theocrat.GetHerHis]!"
  fervor.1002.desc.wrathful:0 "đánh đập những người hầu không làm hài lòng [sinful_theocrat.GetHerHim], gây tổn thương nghiêm trọng!"
  fervor.1002.desc.calm:0 "không thể bộc lộ cảm xúc mạnh mẽ, thay vào đó luôn giữ vẻ điềm tĩnh và lãnh đạm ngay cả khi hành vi đó rõ ràng là không phù hợp!"
  fervor.1002.desc.patient:0 "thường do dự và chần chừ khi đưa ra quyết định quan trọng, gây chậm trễ không cần thiết trong công việc của [sinful_theocrat.GetHerHis]!"
  fervor.1002.desc.impatient:0 "không thể chờ đợi mọi việc được hoàn thành đúng cách, liên tục hối thúc các phụ tá và tôi tớ [sinful_theocrat.GetHerHis] của mình!"
  fervor.1002.desc.arrogant:0 "tự coi [sinful_theocrat.GetHerselfHimself] là cao quý hơn hẳn những đồng cấp [sinful_theocrat.GetHerHis] của mình, không thể phạm sai lầm và đứng trên mọi sự nghi ngờ."
  fervor.1002.desc.humble:0 "đã bị phát hiện là kẻ nhu nhược và luôn đầy rẫy sự tự ti, nghĩ rằng những người xung quanh [sinful_theocrat.GetHerHim] đều tài giỏi hơn và rằng [sinful_theocrat.GetSheHe] không xứng đáng với vị trí [sinful_theocrat.GetHerHis] của mình!"
  fervor.1002.desc.deceitful:0 "thường xuyên nói dối các [sinful_theocrat.Custom('DefaultPriestTitlePlural')] địa phương. [sinful_theocrat.GetSheHe|U] dường như đã lừa họ hành động dựa trên thông tin sai để tiến hành những âm mưu bí mật của [sinful_theocrat.GetHerHis]!"
  fervor.1002.desc.honest:0 "đã bị phát hiện là một kẻ nói dối kinh khủng, những âm mưu và sự lừa dối vụng về của người này hoàn toàn không đủ để thuyết phục bất cứ ai."
  fervor.1002.desc.craven:0 "bị phát hiện nhát gan và nhu nhược, là người thích nhượng bộ yêu cầu của người khác hơn là đứng lên bảo vệ điều đúng đắn."
  fervor.1002.desc.brave:0 "đã liều lĩnh đặt bản thân [sinful_theocrat.GetHerselfHimself] và các phụ tá [sinful_theocrat.GetHerHis] của mình vào tình thế nguy hiểm không cần thiết chỉ để tìm kiếm chút cảm giác mạnh rẻ tiền!"
  fervor.1002.desc.shy:0 "đã tạo ra hàng tá lý do để tránh tham gia các buổi giao lưu xã hội, thay vào đó chỉ thích nhốt mình một mình trong nhà [sinful_theocrat.GetHerHis]!"
  fervor.1002.desc.gregarious:0 "đã bị phát hiện cố tình áp đặt sự hiện diện [sinful_theocrat.GetHerHis] của mình lên người khác, xâm phạm không gian riêng tư và lãng phí thời gian của họ!"
  fervor.1002.desc.ambitious:0 "đã âm mưu thu thập thêm tài sản và tước hiệu cho bản thân [sinful_theocrat.GetHerselfHimself], dường như chưa bao giờ hài lòng với biết bao nhiêu điền trang mà [sinful_theocrat.GetSheHe] đang sở hữu."
  fervor.1002.desc.content:0 "đã bỏ lỡ nhiều cơ hội để gia tăng quyền lực và tài sản cá nhân [sinful_theocrat.GetHerHis] của mình, dường như rất hài lòng với những gì [sinful_theocrat.GetSheHe] đang có."
  fervor.1002.desc.arbitrary:0 "đã tạo ra những ngoại lệ cho các quy trình quan trọng để ưu ái những kẻ mà [sinful_theocrat.GetSheHe] cá nhân yêu thích hơn những người mà [sinful_theocrat.GetSheHe] không ưa."
  fervor.1002.desc.just:0 "đã bị phát hiện nắm giữ một bộ quy tắc danh dự cứng nhắc và không thể lay chuyển, thứ mà [sinful_theocrat.GetSheHe] từ chối làm trái, bất chấp mọi hoàn cảnh giảm nhẹ nào!"
  fervor.1002.desc.cynical:0 "bị phát hiện không thực sự tin vào giáo lý [sinful_theocrat.GetFaith.GetAdjective], coi chúng chỉ là công cụ chính trị tiện lợi."
  fervor.1002.desc.zealous:0 "bị phát hiện có niềm tin không lay chuyển vào thế giới siêu nhiên và tâm linh, dù thiếu bằng chứng hợp lý."
  fervor.1002.desc.paranoid:0 "đã bị phát hiện là một kẻ vô cùng hoang tưởng và ngờ vực, luôn nghĩ rằng tất cả những người xung quanh [sinful_theocrat.GetHerHim] đều đang âm mưu lật đổ [sinful_theocrat.GetHerHis] của mình!"
  fervor.1002.desc.trusting:0 "đã bị phát hiện là một kẻ ngây thơ và cả tin đến mức khó tin, không hề nghi ngờ ngay cả những lời dối trá trắng trợn nhất mà các phụ tá [sinful_theocrat.GetHerHis] đã nhồi nhét vào đầu [sinful_theocrat.GetHerHim]."
  fervor.1002.desc.compassionate:0 "đã quá thông cảm, ban ân huệ trong những tình huống không cần thiết chỉ vì [sinful_theocrat.GetSheHe] không thể chịu nổi khi thấy người khác đau khổ."
  fervor.1002.desc.callous:0 "lạnh lùng tàn nhẫn, không thể hoặc không muốn cảm thông ngay cả với những người trong tình cảnh khốn cùng."
  fervor.1002.desc.sadistic:0 "đã bị phát hiện đang tra tấn một tôi tớ [sinful_theocrat.Custom('GirlBoy')] trong một căn phòng bí mật dưới phòng [sinful_theocrat.GetHerHis] của mình, tỏ ra thích thú trước những tiếng thét đau đớn của tội nghiệp [sinful_theocrat.Custom('GirlBoyPossessive')]!"
  fervor.1002.desc.stubborn:0 "đã vứt bỏ các báo cáo từ các phụ tá [sinful_theocrat.GetHerHis] của mình mà thậm chí không thèm đọc, từ chối xem xét bất kỳ thông tin mới nào về những quyết định mà [sinful_theocrat.GetSheHe] đã đưa ra."
  fervor.1002.desc.fickle:0 "không thể giữ vững lập trường khi mọi việc trở nên khó khăn, gục ngã ngay tại dấu hiệu chống cự đầu tiên đối với các quyết định [sinful_theocrat.GetHerHis] của mình."
  fervor.1002.desc.vengeful:0 "đã giữ một danh sách tất cả những ai từng làm hại [sinful_theocrat.GetHerHim], ghi chép chi tiết vô số cách mà người này lên kế hoạch để trả đũa và thỏa mãn cơn khát báo thù [sinful_theocrat.GetHerHis] của mình!"
  fervor.1002.desc.forgiving:0 "thường không trừng phạt đúng mực những người không hoàn thành trách nhiệm, thay vào đó cho họ cơ hội thứ hai hoặc thứ ba trước khi trừng phạt!"
  fervor.1002.desc.fallback:0 "vô cùng bất kính, không đáp ứng được các tiêu chuẩn tối thiểu của một [sinful_theocrat.Custom('GetCouncilOrTitleName')]."
  fervor.1002.desc.end:0 "\n\nMặc dù tai tiếng trong số [sinful_theocrat.GetFaith.AltPriestTermPlural] không phải chuyện mới, nhưng thật đáng lo khi nó xảy ra ngay gần nhà..."
  fervor.1002.desc.end_hof:0 "\n\nMặc dù tai tiếng trong số [sinful_theocrat.GetFaith.AltPriestTermPlural] không phải chuyện mới, nhiều người kinh ngạc rằng thủ lĩnh đức tin của chúng ta lại sa ngã trước cám dỗ như vậy."
  fervor.1002.b:0 "Kết tội [sinful_theocrat.GetHerHim] vì những tội lỗi [sinful_theocrat.GetHerHis] của người ấy!"
  fervor.1002.c:0 "Bảo vệ danh tiếng [sinful_theocrat.GetHerHis] công khai, ngay cả khi phải mạo hiểm bản thân!"
  fervor.1002.d:0 "Có lẽ Ta nên im lặng về chuyện này..."

 #Exaltation Event Localization
  fervor.2002.t:0 "Sự Tôn Vinh [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]"
  fervor.2002.desc.lustful:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] đã trở thành nguồn cảm hứng cho vô số [virtuous_theocrat.GetWomenMen] đức hạnh và là đối tượng khao khát của nhiều [virtuous_theocrat.GetFaith.GetAdherentNamePlural] trẻ tuổi hơn.\n\nNhững câu chuyện về chiến tích tình ái của [virtuous_theocrat.GetHerHis] đã lan xa, khiến nhiều người coi [virtuous_theocrat.GetHerHim] là tấm gương của tình yêu vô tận của [ROOT.Char.GetFaith.FertilityGodNamePossessive]."
  fervor.2002.desc.chaste:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] đã đạt được danh tiếng không tì vết nhờ việc khước từ hoàn toàn mọi khoái lạc xác thịt.\n\nKỷ luật không lay chuyển [virtuous_theocrat.GetHerHis] của người này đã trở thành một tấm gương để nhiều [virtuous_theocrat.GetFaith.GetAdherentNamePlural] trẻ tuổi noi theo trong nỗ lực chống lại sự cám dỗ thấp hèn của ham muốn."
  fervor.2002.desc.gluttonous:0 "Nhiều người kể lại những câu chuyện kỳ diệu về những bữa tiệc xa hoa của [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstNamePossessive]. Là một [virtuous_theocrat.GetWomanMan] tinh tế, [virtuous_theocrat.Custom('GetCouncilOrTitleName')] của [scoped_primary_title.GetNameNoTier] thực sự theo đuổi đức hạnh ẩm thực mà bất kỳ tín đồ nào của [ROOT.Char.GetFaith.WealthGodName] cũng nên hướng tới."
  fervor.2002.desc.temperate:0 "Là một hình mẫu của sự khổ hạnh không lay chuyển, [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] đã cho thấy một tâm hồn kỷ luật có thể tìm thấy sự bình yên và rõ ràng thực sự chỉ thông qua thiền định và kiêng khem.\n\nBất chấp cấp bậc lẫy lừng [virtuous_theocrat.GetHerHis] của mình, [virtuous_theocrat.GetFirstNameNoTooltip] chỉ duy trì bản thân [virtuous_theocrat.GetHerselfHimself] bằng những bữa ăn thanh đạm nhất để thể hiện cam kết không lay chuyển của người này đối với giáo điều [virtuous_theocrat.GetFaith.GetAdjectiveNoTooltip]."
  fervor.2002.desc.greedy:0 "Ít có [virtuous_theocrat.GetFaith.HouseOfWorshipPlural] nào có thể sánh bằng [scoped_primary_title.GetName] về sự huy hoàng và hào phóng.\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] đã biến việc chứng minh lòng tận tụy bền bỉ [virtuous_theocrat.GetHerHis] của mình thành sứ mệnh cuộc đời bằng cách dâng hiến dòng chảy vàng bạc và của cải vô tận cho vinh quang của [ROOT.Char.GetFaith.WealthGodName]."
  fervor.2002.desc.generous:0 "Người nghèo và người túng thiếu luôn được chào đón tại [virtuous_theocrat.GetFirstNamePossessive] [virtuous_theocrat.GetFaith.HouseOfWorship].\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] của [scoped_primary_title.GetNameNoTier] đã trở nên nổi tiếng vì bản tính hào phóng và nhiều công việc từ thiện [virtuous_theocrat.GetHerHis] của mình. Tấm gương [virtuous_theocrat.GetHerHis|U] đã thúc đẩy nhiều [virtuous_theocrat.GetFaith.GetAdherentNamePlural] từ bỏ của cải vật chất để theo đuổi phần thưởng thiêng liêng."
  fervor.2002.desc.generous.pope:0 "Người nghèo và người túng thiếu luôn được chào đón tại [virtuous_theocrat.GetFirstNamePossessive] [virtuous_theocrat.GetFaith.HouseOfWorship].\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] của [scoped_primary_title.GetNameNoTier] sẽ mãi được nhớ đến vì bản tính hào phóng và nhiều công việc từ thiện [virtuous_theocrat.GetHerHis] của mình. Tấm gương [virtuous_theocrat.GetHerHis|U] đã thúc đẩy nhiều [virtuous_theocrat.GetFaith.GetAdherentNamePlural] từ bỏ của cải vật chất để theo đuổi phần thưởng thiêng liêng."
  fervor.2002.desc.lazy:0 "Chỉ khi hoàn toàn tách rời khỏi những công việc trần tục, linh hồn mới tìm thấy chỗ đúng của mình ở thế giới khác. Và ít người thể hiện đức hạnh này như [virtuous_theocrat.Custom('GetCouncilOrTitleName')] của [scoped_primary_title.GetNameNoTier].\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] dành phần lớn ngày của [virtuous_theocrat.GetHerHis] trong thiền định thanh tịnh, tránh xa trò chơi chính trị vô nghĩa và lao động tay chân để đạt trạng thái bình an thần thánh."
  fervor.2002.desc.diligent:0 "Nhiều câu chuyện đã được truyền cảm hứng từ công việc không mệt mỏi của [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstNamePossessive] trong việc phục vụ [ROOT.Char.GetFaith.HighGodName].\n\nBất chấp cấp bậc danh giá [virtuous_theocrat.GetHerHis] của mình, [virtuous_theocrat.GetFirstNameNoTooltip] luôn sẵn sàng tự tay thực hiện ngay cả những nhiệm vụ mệt mỏi và gian khổ nhất, một ví dụ thực sự về đức hạnh [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]."
  fervor.2002.desc.wrathful:0 "Là một [virtuous_theocrat.GetWomanMan] đầy nhiệt huyết, [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] đã trở nên nổi tiếng ở khắp các thị trấn gần xa nhờ bản tính nóng nảy và hung bạo [virtuous_theocrat.GetHerHis] của mình.\n\nChỉ bằng cách trừng phạt sự báng bổ một cách nhanh chóng và rõ ràng thì tội lỗi mới có thể được gột rửa, và [virtuous_theocrat.GetFirstNameNoTooltip] chắc chắn đã gieo rắc nỗi sợ hãi về [ROOT.Char.GetFaith.WarGodName] vào vô số tín đồ bằng những cơn thịnh nộ thường xuyên [virtuous_theocrat.GetHerHis] của người ấy."
  fervor.2002.desc.wrathful.pope:0 "Là một [virtuous_theocrat.GetWomanMan] đầy nhiệt huyết, [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] đã trở nên khét tiếng nhờ bản tính nóng nảy và hung bạo [virtuous_theocrat.GetHerHis] của mình.\n\nChỉ bằng cách trừng phạt sự báng bổ một cách nhanh chóng và rõ ràng thì tội lỗi mới có thể được gột rửa, và [virtuous_theocrat.GetFirstNameNoTooltip] chắc chắn đã gieo rắc nỗi sợ hãi về [ROOT.Char.GetFaith.WarGodName] vào vô số tín đồ bằng những cơn thịnh nộ thường xuyên [virtuous_theocrat.GetHerHis] của người ấy."
  fervor.2002.desc.calm:0 "Nhiều người cho rằng [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] hiện thân cho sự thanh thản thần thánh mà chỉ vài người có thể đạt được trong đời.\n\nLà một [virtuous_theocrat.GetWomanMan] kỷ luật nghiêm ngặt, [virtuous_theocrat.GetFirstNameNoTooltip] là tấm gương sáng về chiến thắng lý trí trước dục vọng."
  fervor.2002.desc.impatient:0 "Con người chỉ được ban cho một khoảng thời gian ngắn ngủi trên thế gian này, và đó là ý muốn của [ROOT.Char.GetFaith.HighGodName] rằng chúng ta không được lãng phí dù chỉ một giây.\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] đã khắc ghi nguyên tắc này trong lòng, đến mức [virtuous_theocrat.GetSheHe] đã trở nên nổi tiếng khắp nơi vì sự không khoan dung đối với sự lười biếng và những công việc không cần thiết."
  fervor.2002.desc.impatient.pope:0 "Con người chỉ được ban cho một khoảng thời gian ngắn ngủi trên thế gian này, và đó là ý muốn của [ROOT.Char.GetFaith.HighGodName] rằng chúng ta không được lãng phí dù chỉ một giây.\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] đã khắc ghi nguyên tắc này trong lòng, đến mức [virtuous_theocrat.GetSheHe] sẽ mãi được nhớ đến vì sự không khoan dung đối với sự lười biếng và những công việc không cần thiết."
  fervor.2002.desc.arrogant:0 "Xúc phạm một sứ giả của [ROOT.Char.GetFaith.HighGodName] không khác gì sự báng bổ ngay trước mặt chính vị thần đó.\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] biết điều này quá rõ, và trong thời gian tại [scoped_primary_title.GetName], [virtuous_theocrat.GetSheHe] luôn thể hiện sự không khoan dung đối với những kẻ hoài nghi và những kẻ ngốc."
  fervor.2002.desc.humble:0 "Mọi công trình của con người đều trở nên nhạt nhòa khi so sánh với sự tráng lệ của [ROOT.Char.GetFaith.HighGodNamePossessive].\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] biết điều này rõ hơn nhiều vị linh mục khác: nhiều câu chuyện đã lan truyền về bản tính nhu mì và khiêm tốn [virtuous_theocrat.GetHerHis] của người ấy. Từ bỏ cuộc sống thoải mái mà cấp bậc [virtuous_theocrat.GetHerHis] của mình có thể mang lại, [virtuous_theocrat.GetFirstNameNoTooltip] thường được nhìn thấy đi chân trần giữa những thành viên nghèo khổ nhất trong đàn chiên [virtuous_theocrat.GetHerHis] của mình."
  fervor.2002.desc.deceitful:0 "Lý trí là món quà vĩ đại nhất của [ROOT.Char.GetFaith.KnowledgeGodName] ban cho nhân loại, tách biệt chúng ta khỏi loài thú.\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] là một ví dụ sáng chói về sự thật này. Với sự sắc sảo và cái lưỡi dẻo [virtuous_theocrat.GetHerHis] của mình, [virtuous_theocrat.GetSheHe] đã vượt mặt và chế giễu vô số kẻ hoài nghi, những kẻ báng bổ và, một số người nói, thậm chí cả quỷ dữ."
  fervor.2002.desc.honest:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] đã trở thành một nhân vật nổi tiếng và được tôn trọng sâu sắc giữa nhiều [virtuous_theocrat.GetFaith.GetAdherentNamePlural] nhờ sự trung thực [virtuous_theocrat.GetHerHis] của mình.\n\nKhông có lời nói dối nào là quá nhỏ, không có sự thật nào là quá khó chịu đối với vị [virtuous_theocrat.GetWomanMan] sùng đạo này, tấm gương của người ấy đang truyền cảm hứng cho vô số tín đồ khác mỗi ngày."
  fervor.2002.desc.honest.pope:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] sẽ được nhiều [virtuous_theocrat.GetFaith.GetAdherentNamePlural] nhớ lâu nhờ tính trung thực.\n\nKhông lời nói dối nào quá nhỏ, không sự thật nào quá khó chịu đối với [virtuous_theocrat.GetWomanMan] sùng đạo này, tấm gương của [virtuous_theocrat.GetHerHis] truyền cảm hứng cho vô số tín đồ trung thành mỗi ngày."
  fervor.2002.desc.craven:0 "Sự sống là một món quà vô cùng quý giá, và [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] đã thúc đẩy nhiều người theo dõi [virtuous_theocrat.GetHerHis] của mình nắm lấy đức tính thận trọng và biết nhìn xa trông rộng để tránh những rủi ro không đáng có và sống lâu để phục vụ [ROOT.Char.GetFaith.HighGodNamePossessive].\n\n[virtuous_theocrat.GetSheHe|U] hiếm khi rời khỏi [virtuous_theocrat.GetHerHis] [virtuous_theocrat.GetFaith.HouseOfWorship], nơi được cho là an toàn hơn bất kỳ kho báu nào và kiên cố như bất kỳ pháo đài nào."
  fervor.2002.desc.brave:0 "Nhiều nhà thuyết giáo đầy tham vọng đi đến [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstNamePossessive] [virtuous_theocrat.GetFaith.HouseOfWorship] mỗi ngày để tìm kiếm sự hướng dẫn từ vị linh mục đáng kính này.\n\n[virtuous_theocrat.GetFirstNamePossessiveNoTooltip] đã trở nên nổi tiếng nhờ lòng quyết tâm không lay chuyển và sự dũng cảm. Dù là đi săn lùng một con dã thú hay đối mặt với những kẻ dị giáo và báng bổ, [virtuous_theocrat.GetFirstNameNoTooltip] luôn sẵn sàng và háo hức lao vào kẻ thù [virtuous_theocrat.GetHerHis] của mình một cách trực diện."
  fervor.2002.desc.shy:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] trở thành tấm gương về sự tách biệt cơ bản cần thiết để thanh tẩy linh hồn.\n\nTừ chối phiền phức xã hội, vị linh mục được tôn kính này đạt được trạng thái giao hòa với thần linh mà nhiều [virtuous_theocrat.GetFaith.GetAdherentNamePlural] chỉ có thể mơ ước."
  fervor.2002.desc.gregarious:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] đã trở thành trụ cột của cộng đồng [virtuous_theocrat.GetHerHis] của mình.\n\nLuôn sẵn sàng lắng nghe và tương tác với đàn chiên [virtuous_theocrat.GetHerHis] của mình, [virtuous_theocrat.GetSheHe] thể hiện tinh thần hội chúng mà thường chỉ được rao giảng nhưng hiếm khi được thực hiện bởi các đồng nghiệp [virtuous_theocrat.GetHerHis] của mình."
  fervor.2002.desc.gregarious.pope:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] thường xuyên thể hiện sự gắn kết với cộng đồng mà tất cả các [virtuous_theocrat.GetFaith.GetAdherentNamePlural] đều khao khát noi theo.\n\nLuôn sẵn sàng lắng nghe đàn chiên [virtuous_theocrat.GetHerHis] của mình, [virtuous_theocrat.GetSheHe] thể hiện tinh thần hội chúng mà thường được rao giảng nhưng hiếm khi được thực hiện bởi các đồng nghiệp [virtuous_theocrat.GetHerHis] của mình."
  fervor.2002.desc.ambitious:0 "Ít ai theo đuổi ân sủng của [ROOT.Char.GetFaith.HighGodName] với lòng nhiệt thành và quyết tâm hơn [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName].\n\nCuộc theo đuổi vinh quang không ngừng của [virtuous_theocrat.GetHerHis|U] đã trở thành nguồn cảm hứng cho vô số [virtuous_theocrat.GetFaith.GetAdherentNamePlural] trẻ tuổi gần xa."
  fervor.2002.desc.content:0 "Theo nhiều người, [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] thực sự nắm bắt được sự tách rời khỏi trần thế, trung tâm của giáo lý [ROOT.Char.GetFaith.GetAdjectiveNoTooltip].\n\n[virtuous_theocrat.GetWomanMan] không quan tâm danh vọng hay vinh quang, hài lòng sống phục vụ [ROOT.Char.GetFaith.HighGodName]."
  fervor.2002.desc.arbitrary:0 "Bất kỳ học giả nhạy bén nào cũng biết rằng ý chí thần thánh là không thể dò thấu và luôn thay đổi, nhưng chỉ một vài người thể hiện bản chất đó như [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName].\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] của [scoped_primary_title.GetNameNoTier] đã đạt được danh tiếng nhờ sự phán xét nhanh chóng và bí ẩn [virtuous_theocrat.GetHerHis] của mình, đến nỗi nhiều người nghĩ rằng [virtuous_theocrat.GetSheHe] đã được chạm đến bởi [ROOT.Char.GetFaith.HighGodName]."
  fervor.2002.desc.just:0 "Danh tiếng vững chắc và không thể chê trách của [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstNamePossessive] đã giúp [virtuous_theocrat.GetHerHim] giành được sự tôn trọng của nhiều người.\n\nThường được triệu tập để phân xử các tranh chấp, [virtuous_theocrat.GetSheHe] được nhiều người coi là hiện thân của tinh thần công lý thiêng liêng vốn là trung tâm của giáo điều [virtuous_theocrat.GetFaith.GetAdjectiveNoTooltip]."
  fervor.2002.desc.cynical:0 "Trong những năm tháng học tập và thuyết giáo, [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] đã xây dựng cho bản thân [virtuous_theocrat.GetHerselfHimself] một danh tiếng lẫy lừng như một nhà tư tưởng phản biện.\n\n[ROOT.Char.GetFaith.HighGodName] đã lấp đầy thế giới bằng những bí ẩn, và chỉ thông qua việc không ngừng đặt câu hỏi và thái độ hợp lý thì tín đồ mới thực sự đạt được sự khai sáng."
  fervor.2002.desc.zealous:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] đứng trong mắt nhiều người như một bức tường thành bảo vệ đức tin khỏi sự tham nhũng và dị giáo.\n\nLà một [virtuous_theocrat.GetWomanMan] có lòng tận tụy không lay chuyển, [virtuous_theocrat.GetSheHe] chiến đấu ngày đêm để đảm bảo rằng tất cả các thành viên trong đàn chiên [virtuous_theocrat.GetHerHis] của mình tuân theo giáo điều [virtuous_theocrat.GetFaith.GetAdjectiveNoTooltip] một cách tuyệt đối."
  fervor.2002.desc.zealous.pope:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] là chốt chặn bảo vệ đức tin khỏi tham nhũng và dị giáo trong mắt nhiều người.\n\nLà một [virtuous_theocrat.GetWomanMan] tận hiến, [virtuous_theocrat.GetSheHe] ngày đêm bảo đảm sự toàn vẹn của [virtuous_theocrat.GetFaith.GetName] và tu sĩ tuân theo giáo lý của [virtuous_theocrat.GetFaith.ReligiousText] một cách tuyệt đối."
  fervor.2002.desc.paranoid:0 "Khi những kẻ dị giáo và báng bổ ẩn nấp ở mọi ngóc ngách, một tâm trí sắc bén và hay tò mò là công cụ tốt nhất của bất kỳ tín đồ sùng đạo nào của [ROOT.Char.GetFaith.HighGodName].\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] đã truyền cảm hứng cho vô số nhà thuyết giáo bằng những bài luận [virtuous_theocrat.GetHerHis] của mình liên quan đến việc vạch trần dị giáo, đảm bảo tính toàn vẹn liên tục của đức tin chúng ta."
  fervor.2002.desc.trusting:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] đã nỗ lực trong những năm gần đây để truyền bá chân lý rằng mọi người [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] đều trung thực.\n\nChỉ bằng cách tin tưởng tuyệt đối lời người khác, tín đồ mới khơi dậy tính trung thực đáp lại."
  fervor.2002.desc.compassionate:0 "Một tâm hồn thực sự được ban phước, [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] đã trở thành một ví dụ thực sự về lòng nhân hậu [ROOT.Char.GetFaith.GetAdjectiveNoTooltip], dẫn dắt đàn chiên [virtuous_theocrat.GetHerHis] của mình bằng một bàn tay nhẹ nhàng, luôn sẵn sàng lắng nghe và giúp đỡ những tâm hồn kém may mắn tìm đến [virtuous_theocrat.GetHerHim] để xin lời khuyên."
  fervor.2002.desc.callous:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] đã chứng tỏ hết lần này đến lần khác với nhiều đồng nghiệp và tín đồ [virtuous_theocrat.GetHerHis] của mình rằng điều quan trọng như thế nào đối với một [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] sùng đạo là phải duy trì thái độ tách biệt đối với cả sự cám dỗ và nỗi đau.\n\nNhững đam mê được truyền cảm hứng từ thế giới vật chất là nhất thời và không đáng kể khi so sánh với vinh quang của thiên đàng."
  fervor.2002.desc.sadistic:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] đã trở nên được cả đàn chiên [virtuous_theocrat.GetHerHis] của mình tôn trọng và sợ hãi. Là một [virtuous_theocrat.GetWomanMan] tàn nhẫn, [virtuous_theocrat.GetSheHe] dành những ngày [virtuous_theocrat.GetHerHis] của mình để trừng phạt những kẻ tội lỗi bất cứ nơi nào [virtuous_theocrat.GetSheHe] có thể tìm thấy họ, đảm bảo sự gột rửa linh hồn họ thông qua sự thăng hoa của nỗi đau."
  fervor.2002.desc.sadistic.pope:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] đã trở nên được cả các tín đồ tôn trọng và sợ hãi. Là một [virtuous_theocrat.GetWomanMan] tàn nhẫn, [virtuous_theocrat.GetSheHe] dành những ngày [virtuous_theocrat.GetHerHis] của mình để trừng phạt những kẻ tội lỗi bất cứ nơi nào [virtuous_theocrat.GetSheHe] có thể tìm thấy họ, đảm bảo sự gột rửa linh hồn họ thông qua sự thăng hoa của nỗi đau."
  fervor.2002.desc.forgiving:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] trở thành biểu tượng cho sự tha thứ vô hạn của [ROOT.Char.GetFaith.HighGodNamePossessive].\n\nLuôn sẵn sàng giúp đỡ và lắng nghe những người cần, [virtuous_theocrat.GetFirstNameNoTooltip] góp phần duy trì nguyên tắc [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] rằng không ai thực sự vô tội, và chỉ có [ROOT.Char.GetFaith.HighGodName] mới xét xử được."
  fervor.2002.desc.fallback:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] được nhiều người coi là tấm gương về đức hạnh [ROOT.Char.GetFaith.GetAdjectiveNoTooltip].\n\nHành vi trong sạch và công việc không mệt mỏi của [virtuous_theocrat.GetHerHis|U] với vai trò học giả và giảng sư đã giúp củng cố đức tin trong vài năm gần đây."
  fervor.2001.a.a:0 "[virtuous_theocrat.GetSheHe|U] là tấm gương cho tất cả chúng ta!"
  fervor.2001.a.b:0 "Thật đáng khen ngợi."
  fervor.2001.a.c:0 "Nhưng liệu [virtuous_theocrat.GetSheHe] làm vì [ROOT.Char.GetFaith.HighGodName] hay vì danh tiếng?"
