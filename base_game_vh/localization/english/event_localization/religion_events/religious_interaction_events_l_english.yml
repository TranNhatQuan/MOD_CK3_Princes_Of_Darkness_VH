l_english:
  religious_interaction.1.opening:0 "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
  religious_interaction.1.desc:0 "Sau nhiều lần cầu nguyện và cân nhắc, Ta đã quyết định chấp thuận yêu cầu ly hôn [secondary_recipient.GetWifeHusband] của Ngài, [secondary_recipient.GetFirstNameNoTooltip],"
  religious_interaction.1.consanguinity:0 "với lý do quan hệ huyết thống."
  religious_interaction.1.fallback:0 "với lý do nghi ngờ ngoại tình."
  religious_interaction.1.adultery:0 "với lý do ngoại tình."
  religious_interaction.1.different_faith:0 "với lý do họ không theo đức tin chân chính."
  religious_interaction.1.eunuch:0 "với lý do họ không đủ khả năng thực hiện."
  religious_interaction.1.a:0 "Ta xin lỗi, [secondary_recipient.GetFirstNameNoTooltip]."
 
  religious_interaction.2.desc:0 "Sau nhiều cân nhắc, Ta quyết định rằng lợi ích tốt nhất cho gia tộc chúng ta là chấp thuận yêu cầu ly hôn [secondary_recipient.GetWifeHusband] của Ngài, [secondary_recipient.GetFirstNameNoTooltip],"
  religious_interaction.2.infertility:0 "với lý do họ từ chối hoàn tất hôn nhân."
  religious_interaction.2.adultery:0 "với lý do họ vi phạm sự thánh thiện của hôn nhân khi ngủ với người khác."
 
  religious_interaction.3.desc:0 "Ta đã cân nhắc tình cảnh của Ngài và quyết định chấp thuận yêu cầu."
  religious_interaction.3.defensive_war:0 "Cầu mong những khoản tiền này giúp ngài bảo vệ đức tin chống lại [war_target.GetTitledFirstName] và những đám quân xâm lược [war_target.GetFaith.GetAdjective] của hắn!"
  religious_interaction.2.offensive_war:0 "Mong rằng số tiền này sẽ mang lại chiến thắng trong cuộc chiến chống lại [war_target.GetTitledFirstName]!"
  religious_interaction.3.fallback:0 "Mong rằng số tiền này giúp Ngài lan truyền đức tin chân chính trên vùng đất của Ngài!"
  religious_interaction.3.a:0 "Tạ ơn [ROOT.Char.GetFaith.WealthGodName], đây là khoản hoàn thuế!"
  religious_interaction.3.b:0 "Số tiền này sẽ mang lại chiến thắng cho Ta!"
  religious_interaction.3.c:0 "Ta sẽ sử dụng số tài sản này một cách khôn ngoan."
  religious_interaction.3.d:0 "Vàng này sẽ hàn gắn kho bạc đang đau của Ta!"

  religious_interaction.32.desc:0 "Ta đã cân nhắc yêu cầu của Ngài và quyết định từ chối."
  religious_interaction.32.a:0 "Ôi không!"

  religious_interaction.4.desc:0 "Ta đã cân nhắc yêu cầu của Ngài về quyền sở hữu [target.GetName] và quyết định công nhận nó."
  religious_interaction.4.child:0 "Vì [secondary_recipient.GetTitledFirstName] còn là trẻ nhỏ, Ngài có quyền can thiệp."
  religious_interaction.4.they_are_female:0 "Vì [secondary_recipient.GetTitledFirstName] là phụ nữ, Ngài có quyền can thiệp."
  religious_interaction.4.they_are_male:0 "Vì [secondary_recipient.GetTitledFirstName] là đàn ông, Ngài có quyền can thiệp."
  religious_interaction.4.fallback:0 "Có bằng chứng không thể chối cãi rằng tổ tiên của Ngài từng cai trị vùng đất này từ thời cổ đại."
  religious_interaction.4.a:0 "Ta sẽ chứng minh mình là một vị vua xứng đáng!"

  religious_interaction.42.desc:0 "Ta đã cân nhắc yêu cầu của Ngài về quyền sở hữu [target.GetName] và quyết định từ chối."
  religious_interaction.42.a:0 "Chết tiệt!"

  religious_interaction.5.child:0 "Vì Ngài chưa thành niên,"
  religious_interaction.5.they_are_female:0 "Vì Ngài là phụ nữ,"
  religious_interaction.5.they_are_male:0 "Vì Ngài là đàn ông,"
  religious_interaction.5.fallback:0 "Vì Ngài thiếu đức hạnh rõ ràng,"
  religious_interaction.5.outro:0 "một tình trạng gây lo ngại lớn cho Giáo hội,"
 religious_interaction.5.outro_different_recipient: "I have granted [actor.GetName] a claim on [target.GetName], at [actor.GetHerHis] request."
 religious_interaction.5.self: "I have decided to pursue my claim on [target.GetName], as it is my right."
  religious_interaction.5.a:0 "Thật là một bất công!"

  religious_interaction.6.opening:0 "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
  religious_interaction.6.desc:0 "Sau nhiều lần cầu nguyện và cân nhắc, Ta quyết định chấp thuận yêu cầu ly hôn [secondary_actor.GetFirstNameNoTooltip] và [secondary_recipient.GetWifeHusband] của họ, [secondary_recipient.GetFirstNameNoTooltip],"
  religious_interaction.6.consanguinity:0 "với lý do quan hệ huyết thống."
  religious_interaction.6.fallback:0 "với lý do nghi ngờ ngoại tình."
  religious_interaction.6.adultery:0 "với lý do ngoại tình."
  religious_interaction.6.different_faith:0 "với lý do họ không theo đức tin chân chính."
  religious_interaction.6.eunuch:0 "với lý do họ không đủ khả năng thực hiện."
  religious_interaction.6.a:0 "Ta xin lỗi, [secondary_recipient.GetFirstNameNoTooltip]."

  religious_interaction.1001.t.fatwa:0 "Fatwa đã ban hành!"
  religious_interaction.1001.t:0 "Kết án pháp lý!"
  religious_interaction.1001.desc:1 "Người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))], [actor.GetTitledFirstName], đã thấy Ta bị kết án là kẻ tội lỗi trong văn bản do [actor.GetHerHis] [actor.GetFaith.PriestNeuterPlural] ban hành!\n\nĐiều này có thể được dùng làm cơ sở pháp lý để lập luận rằng Ta không đủ khả năng cai trị vùng đất [recipient.GetFaith.GetAdjective]."
  religious_interaction.1001.a:0 "Nếu [actor.GetSheHe] không phải là chúa tể của Ta, Ta đã..."
  religious_interaction.1001.a.revoke_tt:0 "[actor.GetTitledFirstName] có thể [revoke|E] một trong các tước vị của Ta"

 # Religious Head of Faith Interactions
  religious_interaction.1010:0 "Thật đáng khen khi Ngài tìm cách chuộc tội cho những lỗi lầm của mình. Ta chấp nhận món cúng dường rộng lượng của Ngài và gửi lại cho Ngài lời chúc phúc của Ta."
  religious_interaction.1011:0 "Những tội lỗi của Ngài quá nghiêm trọng để chỉ được chuộc bằng vàng. Nếu Ngài thực sự muốn chuộc tội, Ngài phải thay đổi cách sống và chứng minh với Ta rằng Ngài thật sự tìm kiếm sự tha thứ. Chỉ khi đó Ta mới chấp nhận món cúng dường của Ngài."
  religious_interaction.1020:0 "Ta đã nghe một số tin gây lo lắng từ [actor.GetTitledFirstName] về những việc làm sai trái của Ngài."
  religious_interaction.1021:0 "Ngài có thể tự gọi mình là [actor.GetFaith.GetAdherentName], nhưng hành động của Ngài chứng minh rằng Ngài không thật sự theo con đường của [actor.GetFaith.HighGodName]. Vì Ta không thể cho phép hành vi xấu xa của Ngài ẩn sau mặt nạ của đức hạnh [actor.GetFaith.GetAdjective], Ta buộc phải khai trừ Ngài khỏi đức tin. Nguyện [actor.GetFaith.HighGodName] thương xót linh hồn Ngài."
  religious_interaction.1022:0 "Ta vô cùng bàng hoàng trước những câu chuyện Ngài kể về những tội lỗi của [secondary_recipient.GetTitledFirstNamePossessive]. Dù đau lòng, nhưng Ta đồng ý rằng vì lợi ích của đức tin [actor.GetFaith.GetAdjective], [secondary_recipient.GetSheHe] phải bị khai trừ."
  religious_interaction.1023:0 "Ngài nghĩ gì khi cố gắng khai trừ một đồng đạo [actor.GetFaith.GetAdherentName]? Đức tin [actor.GetFaith.GetAdjective] không phải công cụ chính trị! Ngài nên cảm thấy may mắn vì Ta không khai trừ Ngài chỉ vì yêu cầu đó."
  religious_interaction.1024:0 "Ta thấy rằng Ngài đã thực sự hối lỗi về tội lỗi của mình và đã nỗ lực để chuộc tội. Dù những hành vi sai trái trước đây với đức tin [actor.GetFaith.GetAdjective] thật nghiêm trọng, những hành động gần đây khiến Ta tin rằng Ngài xứng đáng được cơ hội khác.\n\nVì thế, Ta chính thức gỡ bỏ việc khai trừ và chào đón Ngài trở lại đức tin [actor.GetFaith.GetAdjective]."
  religious_interaction.1025:0 "Ngài có nghĩ Ta khai trừ người khác một cách dễ dàng sao? Ngài có nghĩ lời xin lỗi hời hợt là đủ để chuộc lỗi? Xin cậy bao nhiêu tùy ý; Ngài sẽ không được phép trở lại đức tin [actor.GetFaith.GetAdjective] cho đến khi chứng minh rằng Ngài đã thay đổi cách sống xấu xa."
  religious_interaction.1030:0 "Sau nhiều thời gian chiêm nghiệm, Ta kết luận rằng lời nói của Ngài là chân thật và khôn ngoan. Ta sẽ gia nhập một tu viện và bắt đầu cuộc sống mới để phục vụ [actor.GetFaith.HighGodName] duy nhất."
  religious_interaction.1031:0 "Gợi ý của Ngài về việc Ta bỏ tất cả cuộc sống hiện tại để chạy trốn vào một tu viện cô lập thật nực cười. Ta hạnh phúc với nơi mình đang ở, và không có kế hoạch thay đổi điều đó."
  religious_interaction.1000.positive:0 "Ta vui vì [recipient.GetFirstNameNoTooltip] nhận ra sự khôn ngoan trong yêu cầu của Ta."
  religious_interaction.1000.negative:0 "Thật đáng tiếc..."
  religious_interaction.1000.strong_negative:0 "Chết tiệt!"
  religious_interaction.1024.positive:0 "Ta vui vì [recipient.GetFirstNameNoTooltip] nhận ra sự khôn ngoan trong hành động này."

  religious_interaction.2002.desc:0 "Ta đã quyết định đi theo ánh sáng và cải đạo sang [ROOT.Char.GetFaith.GetName]!"
  religious_interaction.2002.a:0 "Nguyện [ROOT.Char.GetFaith.HighGodName] được ban phước!"

  religious_interaction.2003.desc:0 "Đức tin của Ta quá mạnh mẽ để bị lay động bởi lời lẽ trần thế của Ngài. Ta muốn nhận phần thưởng trong [recipient.GetFaith.DivineRealm]."
  religious_interaction.2003.hooking_out:0 "\n\nTa cũng nhắc Ngài rằng Ngài nợ Ta, và tốt hơn hết là đừng truy cứu Ta chỉ vì Ta là người tin thật sự."
  religious_interaction.2003.a:0 "Ta chỉ mong Ngài được cứu rỗi."
  religious_interaction.2003.b:0 "Chà, Ngài sẽ trả giá ở trần gian này!"
  religious_interaction.2003.c:0 "Đừng nghĩ Ta sẽ để Ngài thoát tội!"
  religious_interaction.2003.d:0 "Ô, Ta nghĩ Ngài sẽ tin chính xác những gì Ta nói."

  religious_interaction.2011.desc:0 "Ta sẽ vui lòng tham gia cùng Ngài trong niềm hân hoan, nhưng chi phí để tân trang [recipient.GetFaith.HouseOfWorshipPlural] và truyền giáo cho nông dân...\n\nNếu Ngài giúp chi trả cho những nỗ lực này, Ta sẵn sàng cầu nguyện cho [ROOT.Char.GetFaith.HighGodName] của Ngài."
  religious_interaction.2011.a:0 "Mọi thứ vì đức tin."
  religious_interaction.2011.b:0 "Ta sẽ không trả tiền cho sự cứu rỗi vĩnh hằng của Ngài!"
  religious_interaction.2011.c:0 "Ngài sẽ làm điều này để nhận một thứ quý giá hơn vàng."

  religious_interaction.2012.desc:0 "Ta thấy sự khôn ngoan trong đức tin của Ngài, nhưng hy vọng Ngài hiểu rằng con đường từ bóng tối đến ánh sáng là dài và quanh co.\n\nCó lẽ nếu Ngài hứa sẽ hỗ trợ Ta mọi cách cần thiết, hành trình sẽ trở nên dễ dàng hơn."
  religious_interaction.2012.a:0 "Ta chấp nhận, vì lợi ích của các tín đồ ở khắp mọi nơi."
  religious_interaction.2012.b:0 "Ta sẽ không mặc cả linh hồn của Ngài!"
  religious_interaction.2012.c:0 "Ngài còn nợ Ta những điều khác trước."

  religious_interaction.2021.opening:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
  religious_interaction.2021.desc:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]\nĐã đến lúc Ngài đi theo ánh sáng, [actor.Custom2('RelationToMe', SCOPE.sC('recipient'))] của Ta. Xét về tất cả những gì Ngài nợ Ta, Ta yêu cầu Ngài cải đạo sang [actor.GetFaith.GetName]!"
  religious_interaction.2021.a:0 "Ta... Vâng, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))] của Ta."
 
#######################################################
### Sun Trial by Mathilda Bjarnehed & Nick Meredith ###
#######################################################

#I have been left in the sun to die!
  religious_interaction.2100.t:0 "Phán Xét của [imprisoner.GetFaith.HighGodNamePossessive|U]"
  religious_interaction.2100.desc:1 "Sau [ROOT.Char.GetFaith.HighGodName] biết bao lâu trong ngục tối, ánh sáng chói chang làm Ta hoa mắt. Những vệ sĩ dẫn Ta ra khỏi [imprisoner.Custom('FortifiedBuilding')] và vào hoang dã tỏ ra nghiêm trang — thậm chí nghi thức."
  religious_interaction.2100.descwaterlogged:0 "Dù mặt trời chiếu sáng rực rỡ, mặt đất ẩm ướt dưới chân Ta sủi bọt và hút chân Ta. Ta nhanh chóng thấy người giam giữ Ta [imprisoner.GetTitledFirstName] tiến tới tự mãn nhưng dè chừng trên thảm ướt, cùng vài [imprisoner.Custom('DefaultPriestTitlePlural')]."
  religious_interaction.2100.descpleasant:0 "Mặt trời chiếu sáng, mặt đất nơi Ta đứng xanh tươi và khỏe mạnh. Ta nhanh chóng thấy người giam giữ Ta [imprisoner.GetTitledFirstName] tiến tới — với vẻ ngập ngừng — cùng vài [imprisoner.Custom('DefaultPriestTitlePlural')]."
  religious_interaction.2100.descforest:0 "Ánh mặt trời chiếu sáng rực rỡ, rơi xuống qua những tán lá cây. Ta sớm phát hiện kẻ giam giữ mình [imprisoner.GetTitledFirstName] đang chiến đấu mở đường qua bụi rậm, cùng với vài [imprisoner.Custom('DefaultPriestTitlePlural')].\n\n""
  religious_interaction.2100.descoasis:0 "Mặt trời chiếu xuống sa mạc, ánh sáng phản chiếu trên mặt nước ốc đảo. Ta thấy người giam giữ [imprisoner.GetTitledFirstName] đang bơi qua nước, cùng vài [imprisoner.Custom('DefaultPriestTitlePlural')]."
  religious_interaction.2100.deschostile:0 "Khi Ta nhìn [imprisoner.GetTitledFirstName], bao quanh bởi một tá [imprisoner.Custom('DefaultPriestTitlePlural')], mục đích của chuyến đi trở nên rõ ràng.\n\n[ROOT.Char.GetFullNameNoTooltip]. Ngài sẽ bị bỏ lại đây, trói vào cọc, và [imprisoner.GetFaith.HighGodName] sẽ quyết định số phận Ngài. Nếu Ngài vô tội, Ngài sẽ sống; nếu có tội, Ngài sẽ chết."
  religious_interaction.2100.middledefault:0 "\"Vì những vi phạm của Ngài, Ngài sẽ bị phán xét bởi toàn năng [imprisoner.GetFaith.HighGodName|U].\" [imprisoner.GetSheHe|U] hô lớn. Vệ sĩ tiến tới trói Ta vào cọc; các [imprisoner.Custom('DefaultPriestTitlePlural')] bắt đầu tụng ca, giơ tay ra. Nhóm rút lui, Ta đơn độc, chờ chết vì khát."
  religious_interaction.2100.middleoasis:0 "\"Vì những vi phạm của Ngài, Ngài sẽ bị phán xét bởi toàn năng [imprisoner.GetFaith.HighGodName|U].\" [imprisoner.GetSheHe|U] hô lớn. Vệ sĩ tiến tới trói Ta vào cọc, giữa ốc đảo; các [imprisoner.Custom('DefaultPriestTitlePlural')] bắt đầu tụng ca, giơ tay ra. Nhóm rút lui, Ta đơn độc, chờ chết vì khát."
  religious_interaction.2100.endwaterlogged:0 "\n\nTa nhìn quanh cảnh vật ngập nước xung quanh."
  religious_interaction.2100.endpleasant:0 "\n\nTa nhìn quanh cảnh vật dễ chịu xung quanh."
  religious_interaction.2100.endforest:0 "\n\nTa nhìn quanh cảnh xanh tươi xung quanh."
  religious_interaction.2100.endoasis:0 "\n\nTa nhìn xuống mặt nước."
  religious_interaction.2100.a.believer:0 "[imprisoner.GetFaith.HighGodName|U] sẽ phán xét Ta công bằng!"
  religious_interaction.2100.a.unbeliever:0 "Ngài thật sự #EMP bỏ Ta lại đây#!"
  religious_interaction.2100.a.confused:0 "Ơ…"
  religious_interaction.2100.a.success:0 "Ngài sống sót qua thử thách"
  religious_interaction.2100.a.failure:0 "Ngài chết dưới nắng"

#I have survived!
  religious_interaction.2101.t:0 "Lòng Thương Xót của [imprisoner.GetFaith.HighGodNamePossessive|U]"
  religious_interaction.2101.start.desc:0 "Nước, Ta cần nước! Cổ họng, đầu, da Ta — tất cả như đang cháy!\n\n[ROOT.Char.GetFaith.DevilName] thật sự ở đây sao, cười vào nỗi khổ của Ta? [ROOT.Char.GetFaith.WaterGodName] có đưa Ta một bình nước? Ta uống và uống, nhưng khát vẫn không giảm."
  religious_interaction.2101.end.desc:0 "\n\nKhi [imprisoner.GetTitledFirstName] trở lại và áp bình nước lên môi Ta, đầu óc Ta tỉnh táo trở lại. [imprisoner.GetTitleAsNameNoTooltip] có vẻ hơi thất vọng khi thấy Ta còn sống, nhưng thần linh đã phán."
  religious_interaction.2101.desc.pleasant:0 "Ta gần như #EMP tận hưởng#! những ngày bị trói ngoài trời. Chim hót, nắng sưởi ấm da, mưa rào làm Ta tươi tỉnh và bớt khát.\n\nKhi [imprisoner.GetTitledFirstName] trở lại, [imprisoner.GetSheHe] rõ ràng tức giận vì Ta vẫn khỏe mạnh và vui vẻ, nhưng không thể thay đổi các điều kiện mà [imprisoner.GetSheHe] [imprisoner.GetHerselfHimself] đặt ra: thần linh đã phán!"
  religious_interaction.2101.desc.oasis:0 "Ta gần như #EMP tận hưởng#! những ngày treo mình trên mặt nước mát của ốc đảo. Dù nắng gay gắt, dây trói vẫn đủ lỏng để Ta cúi xuống uống nước sâu.\n\nKhi [imprisoner.GetTitledFirstName] trở lại, [imprisoner.GetSheHe] rõ ràng tức giận vì sức khỏe tốt của Ta, nhưng không thể thay đổi các điều kiện mà [imprisoner.GetSheHe] [imprisoner.GetHerselfHimself] đặt ra: thần linh đã phán!"
  religious_interaction.2101.a:0 "Ta vô tội!"

#They survived...
  religious_interaction.2102.desc:0 "Đêm cuối của thử thách [prisoner.GetTitledFirstNamePossessive], chúng Ta thấy [prisoner.GetHerHim] bất tỉnh nhưng vẫn thở.\n\n\"Thật là một phép màu!\" [ROOT.Char.Custom('DefaultPriestTitle')] tuyên bố, giơ tay lên trời. \"[ROOT.Char.GetFaith.HighGodName|U] đã phán! [prisoner.GetWomanMan] vô tội!\""
  religious_interaction.2102.oasis:0 "Khi Ta tiếp cận [prisoner.GetTitledFirstName], bơi qua ốc đảo nơi [prisoner.GetSheHe] bị trói, chúng Ta thấy [prisoner.GetHerHim] không chỉ tỉnh táo mà còn hoàn toàn khỏe mạnh.\n\n\"Thật là một phép màu!\" [ROOT.Char.Custom('DefaultPriestTitle')] tuyên bố, giơ tay lên trời. \"[ROOT.Char.GetFaith.HighGodName|U] đã phán! [prisoner.GetWomanMan] vô tội!\"\n\nTa nghiến răng tức giận khi [ROOT.Char.Custom('DefaultPriestTitlePlural')] tháo trói [prisoner.GetFirstNameNoTooltip]. Tại sao chúng ta phải bỏ [prisoner.GetSheHe] #EMP lại đây#!?!"
  religious_interaction.2102.pleasant:0 "Khi Ta tiếp cận [prisoner.GetTitledFirstName], bơi qua ốc đảo nơi [prisoner.GetSheHe] bị trói, chúng Ta thấy [prisoner.GetHerHim] không chỉ tỉnh táo mà gần như #EMP cười toe toét#!.\n\n\"Thật là một phép màu!\" [ROOT.Char.Custom('DefaultPriestTitle')] tuyên bố, giơ tay lên trời. \"[ROOT.Char.GetFaith.HighGodName|U] đã phán! [prisoner.GetWomanMan] vô tội!\"\n\nTa nghiến răng tức giận khi [ROOT.Char.Custom('DefaultPriestTitlePlural')] tháo trói [prisoner.GetFirstNameNoTooltip]. Tại sao chúng ta phải bỏ [prisoner.GetSheHe] #EMP lại đây#!?!"
  religious_interaction.2102.a:0 "Đó là ý muốn của [ROOT.Char.GetFaith.HighGodNamePossessive|U]."
  religious_interaction.2102.b:0 "[prisoner.GetSheHe|U] trông như đã chết với Ta..."
  religious_interaction.2102.b.tt:0 "[ROOT.Char.GetFaith.HighGodName|U] không phải lúc nào cũng #EMP đúng#!"
  religious_interaction.2102.b.success:0 "Hành động của Ngài không bị phát hiện"
  religious_interaction.2102.b.failure:0 "Ngài bị lộ là Xóa Bạn người"

#I have died...
  religious_interaction.2103.t: "[imprisoner.GetFaith.HighGodNamePossessive|U] Thịnh Nộ"
  religious_interaction.2103.end.desc:0 "\n\nNếu đó là ý muốn của [ROOT.Char.GetFaith.HighGodHerHis|U], có lẽ Ta xứng đáng với điều này. Có lẽ Ta... tội lỗi."
  religious_interaction.2103.desc.pleasant:0 "Ta tự tin thái quá, thật ngớ ngẩn. Bị phơi ra ngoài lâu như thế này sẽ tàn phá bất kỳ [ROOT.Char.GetWomanMan] nào, Ta nhận ra điều đó rồi. Ban ngày nắng gắt, đêm đến gió rít và quật vào người, bầu trời vẫn kinh khủng, tàn nhẫn, không một đám mây.\n\nNước, nước. Nước bao quanh Ta, bị khóa trong vòng tay của thiên nhiên, nhưng chẳng có giọt nào Ta có thể uống. Đầu Ta lảo đảo tuyệt vọng."
  religious_interaction.2103.desc.waterlogged:0 "Dù gió quật mạnh và nắng chiếu xuống da Ta, Ta ít nhất cũng được làm mát nhờ dòng nước liên tục từ những đám mây mưa trút xuống vùng này. Ta mỉm cười nhìn lên bầu trời khi một trận mưa khác bắt đầu.\n\nĐột nhiên thế giới bắt đầu rung lắc. Lúc đầu rất nhẹ, rồi nhanh hơn và nhanh hơn. Một lúc sau Ta nhận ra cọc trụ của Ta đã mất thăng bằng và đổ thẳng vào hồ nước trước mặt!\n\nKhi va chạm với nước, Ta vùng vẫy điên cuồng để thoát ra, nhưng vô ích. Tất cả chi của Ta đều bị trói, và trọng lượng của cọc đẩy Ta sâu hơn xuống hồ nước nông. Ta hét lên, nhưng không phát ra âm thanh nào, và nước tràn vào miệng Ta."
  religious_interaction.2103.desc.oasis:0 "Khi Ta chịu thử thách, ánh nắng gay gắt chiếu xuống da Ta. Ít nhất Ta được làm mát bởi làn nước vỗ vào ngực, treo thẳng trong ốc đảo.\n\nĐột nhiên thế giới bắt đầu rung lắc. Lúc đầu rất nhẹ, rồi nhanh hơn và nhanh hơn. Một lúc sau Ta nhận ra cát mềm dưới cọc trụ đã sụt xuống, khiến Ta đổ thẳng vào ốc đảo trước mặt!\n\nKhi va chạm với nước, Ta vùng vẫy điên cuồng để thoát ra, nhưng vô ích. Tất cả chi của Ta đều bị trói, và trọng lượng của cọc đẩy Ta sâu hơn xuống nước. Ta hét lên, nhưng không phát ra âm thanh nào."
  religious_interaction.2103.a:0 "Ta... Ta quá mệt..."
  religious_interaction.2103.b: " #DIE1 Bl-#! #DIE2 blub...#!"

#They died!
  religious_interaction.2104.desc:0 "Đêm cuối của thử thách [prisoner.GetTitledFirstNamePossessive], [prisoner.GetSheHe] không cử động khi chúng Ta tiến đến. Một người hầu áp bình nước lên môi khô khát của [prisoner.GetHerHis], nhưng nước chảy xuống cằm [prisoner.GetHerHis] mà không phản ứng.\n\n\"[ROOT.Char.GetFaith.HighGodName|U] đã phán!\" [ROOT.Char.Custom('DefaultPriestTitle')] tuyên bố, giơ tay lên trời. \"[prisoner.GetWomanMan] có tội!\""
  religious_interaction.2104.desc.drowned:0 "Khi chúng ta tiến lại gần nơi ta để [prisoner.GetTitledFirstName] bị buộc vào cọc, rõ ràng là có điều gì đó không ổn. Cọc của [prisoner.GetHerHis|U] có lẽ đã đổ về phía trước, trực tiếp xuống vũng nước mà ta để [prisoner.GetHerHim] bên cạnh. Những sợi dây trói trên tứ chi [prisoner.GetHerHis] của hắn rõ ràng đã làm tốt nhiệm vụ, và với sức nặng của khúc gỗ đè lên người [prisoner.GetHerHim], [prisoner.GetSheHe] chưa bao giờ có cơ hội sống sót.\n\n"[ROOT.Char.GetFaith.HighGodName|U] đã lên tiếng!" Vị [ROOT.Char.Custom('DefaultPriestTitle')] tuyên bố, tay giơ lên hướng về phía thiên đường. "Kẻ này có tội!""
  religious_interaction.2104.desc.oasisdrowned:0 "Khi chúng ta tiến lại gần nơi ta để [prisoner.GetTitledFirstName] bị buộc vào cọc, rõ ràng là có điều gì đó không ổn. Cọc của [prisoner.GetHerHis|U] có lẽ đã đổ về phía trước, trực tiếp xuống ốc đảo mà ta để [prisoner.GetHerHim] bên cạnh. Những sợi dây trói trên tứ chi [prisoner.GetHerHis] của hắn rõ ràng đã làm tốt nhiệm vụ, và với sức nặng của khúc gỗ đè lên người [prisoner.GetHerHim], [prisoner.GetSheHe] chưa bao giờ có cơ hội sống sót.\n\n"[ROOT.Char.GetFaith.HighGodName|U] đã lên tiếng!" Vị [ROOT.Char.Custom('DefaultPriestTitle')] tuyên bố, tay giơ lên hướng về phía thiên đường. "Kẻ này có tội!""
  religious_interaction.2104.b.drowned:0 "Chà, Ta đoán đó cũng là một cách nhìn..."

##############################################
### Literalist Debate by Ewan Cowhig Croft ###
##############################################

  religious_interaction.2400.t:0 "Cuộc Tranh Luận Lớn"
  religious_interaction.2400.desc:0 "Trang thiếu niên run rẩy khi [recipient.GetSheHe] đọc bức thư hừng hực của [actor.GetTitledFirstNamePossessive] gửi Ta, thách thức Ta trong một cuộc tranh luận công khai về đức hạnh và tội lỗi của đức tin chung, và đặt câu hỏi về sự tuân thủ của Ta đối với các nguyên tắc cơ bản của [recipient.GetFaith.GetNameNoTooltip].\n\nNgười hầu của Ta lắp bắp trước từng từ, vì giọng điệu của bức thư không để nghi ngờ gì về quan điểm của [actor.GetShortUINamePossessiveNoTooltip] về lòng sùng đạo của Ta."
  religious_interaction.2400.a:0 "Tên khốn! Thách thức được chấp nhận!"
  religious_interaction.2400.a.tt_success:0 "Cuộc tranh luận công khai làm nhục [actor.GetShortUINameNoTooltip]"
  religious_interaction.2400.a.tt_fail:0 "[actor.GetShortUINameNoTooltip] thành công trong việc nghi ngờ đức tin của Ta"
  religious_interaction.2400.b:0 "Ta sẽ không làm ô danh [recipient.GetFaith.HighGodNamePossessive] bằng trò hề này."
  religious_interaction.2400.b.tt:0 "[actor.GetShortUINameNoTooltip] sẽ được thông báo"
  religious_interaction.2400.b_turned_down:0 "[recipient.GetShortUIName|U] đã từ chối thách thức tranh luận của Ta"

  used_literalist_debate_modifier:0 "Gần đây đã tranh luận"
  used_literalist_debate_modifier_desc:0 "Nhân vật này gần đây đã tham gia tranh luận về nền tảng của đức tin."
  literally_debated_modifier:0 "Gần đây đã tranh luận"
  literally_debated_modifier_desc:0 "Nhân vật này gần đây đã tham gia tranh luận về nền tảng của đức tin."

  religious_interaction.2401.desc_intro:0 "Đối thủ và Ta gặp nhau trong một đại sảnh lớn ở [debate_locale.GetNameNoTierNoTooltip], đứng trên những bàn xiêu vẹo cách nhau chỉ vài bước, xung quanh là đám đông háo hức. Một tràng im lặng rơi xuống, mọi người chờ cuộc tranh luận bắt đầu.\n\n"
  religious_interaction.2401.desc_won:0 "Trong vòng một giờ, ta hạ gục [recipient.GetTitledFirstName], tấn công vào lòng mộ đạo, ý thức về đức hạnh, và thậm chí nghi ngờ sự trung thành của [recipient.GetHerHis] hắn với [actor.GetFaith.HighGodName]. Đám đông hung hãn, ném vào [recipient.GetTitledFirstNameNoTooltip] trứng thối và bắp cải mốc cho đến khi [recipient.GetSheHe] bỏ chạy khỏi sảnh."
  religious_interaction.2401.desc_lost:0 "[recipient.GetTitledFirstNamePossessive] tấn công bằng lời ngay lập tức, hầu như không để Ta phản bác, và trước khi lâu, đám đông đã quyết định người chiến thắng.\n\nTa cố gắng vài phút, chịu trận mưa rau thối, nhưng cuối cùng phải rút lui khi một người nông dân ném con gà sống vào đầu Ta."
  religious_interaction.2401.a_won:0 "Chẳng phải Ta được [actor.GetFaith.HighGodName] yêu thương sao?"
  religious_interaction.2401.a_lost:0 "Những người này không hiểu [actor.GetFaith.GetReligion.GetNameNoTooltip]!"

  religious_interaction.2402.desc_won:0 "Dù [actor.GetTitledFirstNamePossessive] tự tin khi thách thức Ta, quyết tâm của [actor.GetHerHis] tan chảy trước bão từ lời lẽ và chỉ trích sùng đạo của Ta. Đám đông nhanh chóng tham gia, và đối thủ rút lui dưới mưa rau mốc và một con gà cực kỳ hung hăng."
  religious_interaction.2402.desc_lost:0 "Mặc dù ta đã cố gắng hết sức, [actor.GetTitledFirstName] rõ ràng đã nghiên cứu các lập luận [actor.GetHerHis] của mình rất kỹ, và khiến đám đông nghe theo răm rắp gần như ngay lập tức. [actor.GetSheHe|U] tiếp tục mắng nhiếc ta trong hơn một giờ, buộc tội ta với mọi thói hư tật xấu trên đời, và thậm chí ám chỉ rằng lòng trung thành của ta với [recipient.GetFaith.HighGodName] là có vấn đề.\n\nCuối cùng, ta bỏ chạy, bị theo sau bởi một loạt những nông sản thối từ đám đông."

  religious_interaction.2403.desc:0 "[victim.GetTitledFirstName] thậm chí không có cơ hội. Mặc dù [victim.GetSheHe] tin rằng bản thân đã chuẩn bị kỹ lưỡng, ta gạt phăng những lập luận yếu ớt của hắn như thể chúng là những con ruồi. Với mỗi luận điểm phản bác, [victim.GetFirstNameNoTooltip] lại nhăn nhó như bị trúng đòn. Thời gian trôi qua, [victim.GetSheHe] dường như không còn khả năng bảo vệ bản thân đến mức cả đám đông cũng im lặng.\n\n"...và đó là lý do tại sao," ta nói khi giơ tay một cách đầy kịch tính, ngón tay buộc tội chỉ về phía kia căn phòng, "ngươi sẽ không bao giờ—"\nTa dừng lại khi nhận ra [victim.GetFirstNameNoTooltip] đang thở hổn hển và nắm chặt"
  religious_interaction.2403.conclusion_either:0 "[victim.GetHerHis] ngực."
  religious_interaction.2403.conclusion_man:1 "[victim.GetHerHis] cánh tay."
  religious_interaction.2403.conclusion_woman:1 "[victim.GetHerHis] bụng."
  religious_interaction.2403.a.low_compassion:0 "\"Chọn cách hèn nhát, Ta thấy vậy.\""
  religious_interaction.2403.a.zealous:0 ""Có vẻ như [ROOT.Char.GetFaith.PantheonTerm] đã chọn ra người chiến thắng.""
  religious_interaction.2403.a.stubborn:0 "\"Này, Ta chưa xong!\""
  religious_interaction.2403.a:0 "\"Ngài... Ngài có ổn không?\""
  religious_interaction.2403.a.tt:0 "[victim.GetShortUIName] bị đau tim và [character_death_dies|E]"

  religious_interaction.2500.desc:0 "Ngài tỉnh táo lại... Chắc hẳn đó là dấu hiệu từ [ROOT.Char.GetFaith.HighGodNameAlternate]! Ngài được mời tham gia đức tin chân chính."
  religious_interaction.2500.a:0 "Ngợi khen [ROOT.Char.GetFaith.HighGodName]!"

  religious_interaction.2501.desc:0 "Chắc Ngài đang đùa? Những cố gắng rõ ràng để thoát khỏi chính trị của Ngài sẽ không bao giờ ngăn nổi thịnh nộ của [recipient.GetFaith.HighGodName]!"
 
