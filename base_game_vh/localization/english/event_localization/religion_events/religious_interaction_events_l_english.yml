 # Exaltation of Pain tenet
 #########################

  religious_interaction.2600.t: "Bài học về Ân sủng"
  religious_interaction.2600.desc.recipient: "[actor.GetTitledFirstName|U] nhẹ nhàng nắm lấy tay ta để dẫn đến một loạt các vật sắc nhọn và cùn mà chúng ta sẽ sử dụng cho phiên của mình. Một trong những lưỡi dao bắt sáng và ta cảm thấy một cảm giác bình yên bao trùm lấy mình.\n\nCông cụ trong tay, ta ra hiệu cho [actor.GetHerHim] quay lưng lại, khi [actor.GetSheHe] vén áo [actor.GetHerHis] mình lên, để lộ làn da chưa bị đụng chạm của tấm lưng. Ta bắt tay vào việc, và những tiếng rên rỉ và càu nhàu thấp sớm biến thành một tiếng ngân nga nhỏ trong cổ họng [actor.GetHerHis].\n\nTa đã biết mình sẽ dùng công cụ nào để tinh chỉnh ân điển của chính mình."
  religious_interaction.2600.desc.actor: "[recipient.GetTitledFirstName|U] cẩn thận nhìn qua các công cụ siêu việt, run rẩy nhẹ vì mong đợi.\n\nTa bắt lấy cổ tay [recipient.GetHerHis], đặt lưỡi dao sắc bén vào tay [recipient.GetHerHis] và nhẹ nhàng ấn nó vào ngực ta. "Thật nhẹ nhàng nhé? Bàn tay vững vàng nào. Chúng ta đang đi trên một ranh giới mong manh đây."\n\n[recipient.GetFirstNameNoTooltip] nhìn thẳng vào mắt ta và gật đầu, sau đó bắt đầu cởi cúc áo của chính mình, để lộ một mảng da tinh khiết, chưa có sẹo, sắp nhận được ân điển của [recipient.GetFaith.HighGodName]."
  religious_interaction.2600.a: "\"Hãy cùng siêu việt, cùng nhau.\""

  religious_interaction.2610.desc: "Thật không may, Ta có một số công việc quan trọng cần giải quyết lần này... nhưng lần sau chúng ta sẽ thờ phượng nhiệt thành hơn!"
  religious_interaction.2610.a: "Thật tiếc."

  attempted_transcendence_together_opinion: "Cố gắng Siêu việt cùng nhau"
