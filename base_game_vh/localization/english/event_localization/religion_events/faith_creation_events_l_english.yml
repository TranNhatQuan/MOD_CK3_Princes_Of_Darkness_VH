l_english:
  faith_creation.1001.t.schism:0 "Ly giáo [reformed_faith.GetAdjectiveNoTooltip]"
  faith_creation.1001.t.reformation:0 "Cải cách [reformed_faith.GetAdjectiveNoTooltip]"
  faith_creation.1001.desc.schism:0 "Một cuộc ly giáo mới trong [reformed_faith.GetReligion.GetName] đã xảy ra khi [reformer.GetTitledFirstName] và các tín đồ của [reformer.GetHerHis] tách ra khỏi đức tin [old_faith.GetAdjective] để thành lập một phong trào tôn giáo mới."
  faith_creation.1001.desc.reformation:0 "[reformer.GetTitledFirstName], một nhân vật nổi bật trong số [reformed_faith.GetAdherentNamePlural], đã tập hợp tất cả các [reformer.Custom('DefaultPriestTitle')] trong đất nước để thảo luận về niềm tin và thiết lập giáo lý chính thức cho đức tin ngoại đạo."
  faith_creation.1001.desc.schism.personal:0 "[old_faith.GetAdjective] [old_faith.AltPriestTermPlural] đã lạc đường và không còn đáng tin để dẫn dắt chúng ta. Để khắc phục điều này, Ta đã tập hợp một nhóm chọn lọc [reformer.Custom('DefaultPriestTitlePlural')] để thảo luận về tương lai của đức tin chúng ta."
  faith_creation.1001.desc.reformation.personal:0 "Cuối cùng, Ta đã quản lý để tập hợp tất cả các [reformer.Custom('DefaultPriestTitle')] quan trọng trên thế giới để họ thảo luận về niềm tin và thiết lập giáo lý chính thức dẫn dắt đức tin của chúng ta trong tương lai."

#Pick one line from this set (Outlook):
  faith_creation.1001.desc.outlook.ghw:0 "\n\nNhững [reformer.Custom('DefaultPriestTitlePlural')] đầy nhiệt huyết đang bàn về việc phát động [reformed_faith.GHWNamePlural] để truyền bá đức tin mới ra khắp thế giới và"
  faith_creation.1001.desc.outlook.pacifism:0 "\n\nNhững [reformed_faith.GetAdjectiveNoTooltip] [reformer.Custom('DefaultPriestTitlePlural')] này đã lên án bạo lực và đổ máu, nói rằng chiến tranh chỉ dẫn đến đau khổ và thù hận, và"
  faith_creation.1001.desc.outlook.dogmatic:0 "\n\nNhững [reformer.Custom('DefaultPriestTitlePlural')] này đã tuyên bố [reformed_faith.GetNameNoTooltip] là Một Đức Tin Đích Thực, và"
  faith_creation.1001.desc.outlook.accepting:0 "\n\nNhững [reformed_faith.GetAdjectiveNoTooltip] [reformer.Custom('DefaultPriestTitlePlural')] này khuyến khích hợp tác và khoan dung, ngay cả với những người không tin, và"
  faith_creation.1001.desc.outlook.fallback:0 "\n\nNhững [reformed_faith.GetAdjectiveNoTooltip] [reformer.Custom('DefaultPriestTitlePlural')] này đã tiếp cận một quan điểm thực dụng và cân bằng đối với các đức tin khác và"

#And one line from this second set (Beliefs):
  faith_creation.1001.desc.belief.sacrifice:0 "cho rằng cách duy nhất để thể hiện sự tận hiến đúng mực là thờ phụng [reformed_faith.HighGodName] bằng hiến tế con người!"
  faith_creation.1001.desc.belief.indulgent:0 "khuyến khích tín đồ thỏa mãn những ham muốn xác thịt và sống hết mình."
  faith_creation.1001.desc.belief.incest:0 "cho phép hôn nhân giữa người thân cận, cho rằng mối quan hệ gia đình là thiêng liêng và những cuộc hôn nhân như vậy được ban phước."
  faith_creation.1001.desc.belief.aniconism:0 "từ chối sử dụng bất kỳ biểu tượng tôn giáo nào, cho rằng tượng chỉ không thể diễn tả sự vĩ đại của [reformed_faith.HighGodName]."
  faith_creation.1001.desc.belief.ascetic:0 "thúc đẩy chủ nghĩa khắc khổ trong tín đồ, cho rằng những ham muốn vật chất cản trở con đường đạt thành tựu tâm linh."
  faith_creation.1001.desc.belief.spirits:0 "đã nhờ sự trợ giúp của các linh hồn để hướng dẫn tín đồ qua những thời kỳ hỗn loạn này."
  faith_creation.1001.desc.belief.superstition:0 "nhiều truyền thuyết và mê tín cổ xưa đã được chính thức hóa trong giáo lý."
  faith_creation.1001.desc.belief.nature:0 "tôn trọng thiên nhiên, tìm cách bảo vệ nó khỏi những kẻ khai thác cho lợi ích riêng."
  faith_creation.1001.desc.belief.community:0 "đức tin mới hòa nhập với truyền thống văn hóa của tín đồ, hình thành các cộng đồng [reformed_faith.GetAdherentNamePluralNoTooltip] gắn bó chặt chẽ, dè dặt với người ngoài."
  faith_creation.1001.desc.belief.fallback:0 "yêu cầu tất cả tín đồ gác lại những tranh chấp cũ để cùng nhau vun đắp đức tin mới."

#End with a reference to 
  faith_creation.1001.desc.temporal:0 "\n\n[reformer.GetFirstNameNoTooltip] đã chọn đích thân dẫn dắt phong trào [reformed_faith.GetAdjectiveNoTooltip] đang phát triển này và đảm nhận tước hiệu [reformed_faith.ReligiousHeadName], một vị thế cao quý mà [reformer.GetSheHe] dự kiến sẽ truyền lại cho người thừa kế [reformer.GetHerHis] của mình."
  faith_creation.1001.desc.temporal.personal:0 "\n\nTa đã chọn dẫn dắt trực tiếp phong trào [reformed_faith.GetAdjectiveNoTooltip] đang nở rộ này và nhận danh hiệu [reformed_faith.ReligiousHeadName], một vị trí cao quý mà Ta sẽ truyền lại cho con cháu."
  faith_creation.1001.desc.spiritual:0 "\n\nCác [reformed_faith.GetAdjectiveNoTooltip] [reformer.Custom('DefaultPriestTitlePlural')] đã chọn [reformed_hof.GetFirstNameNoTooltip] làm [reformed_faith.ReligiousHeadName] mới, người sẽ xác định giáo lý tôn giáo và giải quyết tranh chấp giữa các đức tin cho toàn bộ thế giới [reformed_faith.GetAdjectiveNoTooltip]."
  faith_creation.1001.desc.spiritual.sameold:0 "\n\nCác [reformed_faith.GetAdjectiveNoTooltip] [reformer.Custom('DefaultPriestTitlePlural')] đã chọn giữ [reformed_hof.GetFirstNameNoTooltip] làm [reformed_faith.ReligiousHeadName], [reformer.GetSheHe] sẽ tiếp tục xác định giáo lý tôn giáo và giải quyết tranh chấp giữa các đức tin cho toàn bộ thế giới [reformed_faith.GetAdjectiveNoTooltip]."
  faith_creation.1001.desc.no_head:0 "\n\nPhong trào đang nở rộ đã quyết định không bổ nhiệm thủ lĩnh tôn giáo, thay vào đó để mỗi [reformer.Custom('DefaultPriestTitle')] tự quyết định giáo lý phù hợp cho [reformed_faith.HouseOfWorship] của riêng mình."
  faith_creation.1001.desc.no_holy_sites:0 "\n\n[reformed_faith.GetAdherentNamePluralNoTooltip] háo hức chờ đợi sự xuất hiện được tiên tri của [reformed_faith.ReligiousHeadName], một lãnh đạo vĩ đại sẽ tập hợp tất cả tín đồ phía sau và mở ra một kỷ nguyên vàng [reformed_faith.GetAdjectiveNoTooltip]."

  faith_creation.1001.o.frightened:0 "[ROOT.Char.GetFaith.random_GoodGodNames] cứu chúng Ta khỏi những [second.Custom('GetUnbelieverNamePlural')] máu lạnh này!"
  faith_creation.1001.o.heretical:0 "Những kẻ dị giáo này sẽ trả giá vì tội ác chống lại [ROOT.Char.GetFaith.HighGodName]!"
  faith_creation.1001.o.crusader:0 "Một hai [ROOT.Char.GetFaith.GHWName] sẽ đặt những [second.Custom('GetUnbelieverNamePlural')] này vào vị trí của chúng!"
  faith_creation.1001.o.interested:0 "Chúng ta nên theo dõi diễn biến mới này..."
  faith_creation.1001.o.uninterested:0 "Không quan trọng những [second.Custom('GetUnbelieverNamePlural')] này tin gì."
  faith_creation.1001.o.getreaction:0 "[ROOT.Char.Custom2('GetFaithCreationReaction', reformer)]"
  faith_creation.1001.o.personal:0 "Thế giới sẽ thấy rằng [ROOT.Char.GetFaith.HighGodName] ủng hộ chúng ta!"

  faith_creation.1010.t:0 "[HoF.GetFirstNameNoTooltip] Tuyên bố [faith.ReligiousHeadName|U]"
  faith_creation.1010.desc.start:0 "Dù sự chính trực của đức tin chúng ta chưa bao giờ bị nghi ngờ, nhưng khoảng thời gian phải chịu đựng mà không có lãnh đạo tinh thần thật khó khăn. Cuối cùng, thử thách này đã kết thúc khi"
  faith_creation.1010.desc.temporal.personal:0 "Ta cuối cùng đã thuyết phục các [faith.AltPriestTermPlural] chấp nhận Ta là [faith.ReligiousHeadName|U] duy nhất."
  faith_creation.1010.desc.temporal:0 "[HoF.GetTitledFirstName] đã thuyết phục các [faith.AltPriestTermPlural] chấp nhận [HoF.GetHerHim] là [faith.ReligiousHeadName|U] duy nhất."
  faith_creation.1010.desc.spiritual:0 "Các [faith.AltPriestTermPlural] đã triệu tập để bầu [HoF.GetFirstName] làm [faith.ReligiousHeadName|U] duy nhất."
  faith_creation.1010.desc.end:0 "\n\nVới tín đồ cuối cùng đoàn kết phía sau một lãnh đạo duy nhất, dường như một kỷ nguyên vàng mới cho [faith.GetNameNoTooltip] đang đến."
  faith_creation.1010.desc.end.personal:0 "\n\nVới tín đồ cuối cùng đoàn kết phía sau Ta, Ta sẽ dẫn dắt [faith.GetNameNoTooltip] vào một kỷ nguyên vàng mới!"

  faith_creation.1010.a:0 "Vinh quang thuộc về [faith.HighGodName]!"

  faith_creation.1011.message.title:0 "Lãnh đạo Tôn giáo Được Bổ Nhiệm"
  faith_creation.1011.message.desc:0 "Các [faith.GetAdjective] [faith.AltPriestTermPlural] đã tuyên bố [faith.ReligiousHeadName|U] [HoF.GetFirstName] là [head_of_faith|E]"
