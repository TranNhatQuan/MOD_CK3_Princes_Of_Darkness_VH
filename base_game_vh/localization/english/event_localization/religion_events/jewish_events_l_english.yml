l_english:
 jewish_events.0001.t:0 "Sự Chấm Dứt Chế Đa Phối của [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]"
 jewish_events.0001.desc:0 "Suốt nhiều thế kỷ, việc có nhiều phối ngẫu có được cho phép hay không vẫn chưa rõ ràng, nhưng sau một hội nghị nhỏ của những Giáo sĩ Do Thái (Rabbis) có ảnh hưởng nhất của [ROOT.Char.GetFaith.GetName], đã quyết định rằng chế độ đa phối không còn là tập tục được chấp nhận bởi đức tin [ROOT.Char.GetFaith.GetAdjectiveNoTooltip].\n\nQuyết định này phần lớn xuất phát từ lo ngại rằng một người khó có thể chu cấp đầy đủ cho nhiều phối ngẫu, và rằng việc đa phối có thể dẫn đến những hành vi tội lỗi do lòng đố kỵ giữa các phối ngẫu."
 jewish_events.0001.a:0 "Vậy thì cứ thế mà làm."
 jewish_events.0001.b:0 "Chúng ta, người [ROOT.Char.GetCulture.GetCollectiveNoun], sẽ không từ bỏ phong tục của mình!"
 jewish_events.0001.c:0 "Ta nghĩ các giáo sĩ đã quên vị trí của họ."
