l_english:

 steward_task.0001.t:0 "Lãnh Địa De Jure Bị Thuyết Phục"
 steward_task.0001.desc:0 "Hôm nay ta nhận được tin dữ: dân chúng tại [county.GetNameNoTier] đã tuyên bố rằng họ thuộc về lãnh địa cao quý và danh giá hơn là [councillor_liege.GetPrimaryTitle.GetNameNoTierNoTooltip]!\n\nBị những lời hứa ngọt ngào của [councillor.GetTitledFirstName] thuyết phục và mê hoặc trước sự huy hoàng của triều đình [councillor_liege.GetTitledFirstNamePossessive], họ giờ đây mong ta đơn giản giao lại lãnh địa này cho kẻ láng giềng hay xen vào chuyện của ta!\n\nTa phải cân nhắc bước đi tiếp theo thật cẩn thận. Mất đất chưa bao giờ là điều tốt, nhưng dân địa phương sẽ vô cùng bất mãn với ta nếu ta không để họ rời đi."
 steward_task.0001.a:0 "Ta không còn lựa chọn. Ta sẽ nhượng lại."
 steward_task.0001.b:0 "Thật quá đáng! Ta sẽ không cho phép!"
 steward_task.0001.liege_changed:0 "Được Trao Cho Lãnh Chúa De Jure"
 steward_task.0001.liege_changed.tt:0 "Lãnh chúa của ngươi [ROOT.Char.GetTitledFirstName] đã nhượng bộ trước sự phản đối của thần dân và trao [county.GetNameNoTooltip] cho lãnh chúa De Jure của nó, lãnh chúa mới của ngươi là [councillor_liege.GetTitledFirstName]."
 steward_task.0001.county_loss.tt:0 "Lãnh chúa của ngươi [ROOT.Char.GetTitledFirstName] đã nhượng bộ trước sự phản đối của thần dân và trao [county.GetNameNoTooltip] cho lãnh chúa De Jure của nó, [councillor_liege.GetTitledFirstName]. Ngươi không còn kiểm soát lãnh địa này nữa!"

 steward_task.0002.t:0 "Lãnh Địa De Jure Được Trao Trả!"
 steward_task.0002.desc:0 "Có vẻ như nỗ lực của [councillor.GetCouncilTitle] của ta tại [county.GetName] cuối cùng đã mang lại kết quả!\n\nDân địa phương đã bị thuyết phục bởi tài ăn nói khéo léo của [councillor.GetTitledFirstNamePossessive] và bị lay động trước uy danh của triều đình ta. Đối mặt với sự bất mãn của cả lãnh địa, [previous_owner.GetTitledFirstName] đã chọn con đường ít kháng cự nhất và trao trả [county.GetNameNoTierNoTooltip].\n\nGiờ đây lãnh địa này đã thuộc về lãnh chúa De Jure của nó — chính là ta!"
 steward_task.0002.a:0 "Làm tốt lắm, [councillor.GetFirstNameNoTooltip]!"

 steward_task.0003.t:0 "Thuyết Phục Lãnh Thổ De Jure Thất Bại!"
 steward_task.0003.desc:0 "Có vẻ như nỗ lực của [councillor.GetCouncilTitle] của ta tại [county.GetName] đã không mang lại kết quả.\n\nDân địa phương, dù đã bị thuyết phục bởi tài ăn nói của [councillor.GetTitledFirstNamePossessive] và uy danh của triều đình ta, đã phản đối kịch liệt kẻ cai trị bất hợp pháp của họ là [previous_owner.GetTitledFirstName], nhưng vô ích.\n\nDù sự bất mãn của dân địa phương có thể khiến nơi này trở thành con mồi dễ dàng hơn cho chúng ta, kế hoạch ngoại giao của ta hiện đã thất bại. Ít nhất là vào lúc này."
 steward_task.0003.a:0 "Nguyền rủa ngươi, [previous_owner.GetFirstNameNoTooltip]!"

 steward_task.1101.t:0 "Thu Thuế Hiệu Quả Hơn"
 steward_task.1101.desc:0 "Khi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] của ta liệt kê từng lãnh địa, giá trị của chúng và các nghĩa vụ phải nộp, ta chặn [councillor.GetHerHim] lại khi nghe thấy một con số mà #EMP chắc chắn#! phải là sai lầm.\n\"Ngươi thu được BAO NHIÊU từ [county.GetName] cơ?!\"\n\n[councillor.GetFirstName] mỉm cười. \"Thần nghĩ rằng ngài sẽ vui khi nghe điều này, [ROOT.Char.Custom('FormOfAddressForLiege')].\""
 steward_task.1101.a:2 "Nhân danh [ROOT.Char.GetFaith.WealthGodName], tất nhiên ta vui mừng!"
 steward_task.1101.b:0 "Ha ha! Đến ngày lĩnh tiền rồi!"
 steward_task.1101.notification:0 "Thuế Gia Tăng"

 steward_task.1001.t:0 "Giảm Gánh Nặng Cho Chính Họ"
 steward_task.1001.opening:0 "Có vẻ như nỗ lực của [councillor.GetCouncilTitle] của ta nhằm cải thiện việc thu thuế đã gây ra vài hậu quả đáng tiếc."
 steward_task.1001.end:0 "\n\nBọn cướp đã xuất hiện tại [county.GetName], cho rằng với mức thuế mới thì cướp bóc là cách duy nhất để nuôi sống gia đình họ."
 steward_task.1001.a:0 "Sớm muộn chúng cũng sẽ nếm mùi thép!"
 steward_task.1001.notification:0 "Thuế Nặng Dẫn Đến Cướp Bóc"

 steward_task.1002.end:0 "\n\nNgười dân tại [county.GetName] đã bắt đầu giấu người thân và gia súc khỏi [councillor.GetTitledFirstName] cùng các viên chức kiểm kê của ta!"
 steward_task.1002.a:0 "Ta phải biết đến họ thì mới đánh thuế được, [councillor.GetFirstNameNoTooltip]!"
 steward_task.1002.notification:0 "Điều Tra Dân Số Vô Dụng"

 steward_task.1003.end:0 "\n\nVới các khoản phí mới được áp dụng, nhiều người tại [county.GetName] đang từ chối nhờ các trọng tài của ta giải quyết tranh chấp!"
 steward_task.1003.a:0 "Ngươi đang mất kiểm soát sao, [councillor.GetFirstNameNoTooltip]?"
 steward_task.1003.notification:0 "Không Bổ Nhiệm Cảnh Trưởng"

 steward_task.1004.end:0 "\n\nVới các trạm thu phí mới tại [county.GetName], ngày càng nhiều người chuyển sang buôn lậu thay vì giao thương hợp pháp!"
 steward_task.1004.a:0 "Chúng gần như đang móc túi của [ROOT.Char.GetTitleTierName]!"
 steward_task.1004.notification:0 "Thuế Quan Quá Mức"

 steward_task.1005.t: "Bị Đánh Thuế Hai Lần"
 steward_task.1005.desc: "\"Thật quá đáng,\" [steward.GetCouncilTitle] của ta là [steward.GetTitledFirstName] xông vào phòng hội đồng, theo sau là [tax_collector.GetTitledFirstName]. \"Trước tiên ta được lệnh thu thuế của mình, rồi sau đó [tax_collector.GetTitledFirstNameNoTooltip] lại thu chúng lần nữa? Ngài phải bảo [tax_collector.GetHerHim] tránh xa lãnh địa của ta.\" \n\n\"[steward.GetTitledFirstNameNoTooltip] đã mắc một... sai sót sổ sách,\" [tax_collector.GetTitledFirstNameNoTooltip] xen vào. \"Ta chỉ đơn giản sửa lại bằng cách thu phần chênh lệch, không hơn.\" \n\n[steward.GetTitledFirstNameNoTooltip] trừng mắt nhìn [tax_collector.GetHerHim]."
 steward_task.1005.a: "Để ta xem kỹ lại sổ sách..."
 steward_task.1005.a_success: "Ngươi cải tổ hệ thống thuế của lãnh địa"
 steward_task.1005.a_failure: "Ngươi không tìm thấy sai sót nào trong sổ sách của [tax_collector.GetTitledFirstNamePossessiveNoTooltip]"
 steward_task.1005.b: "[tax_collector.GetTitledFirstNameNoTooltip] nắm quyền kiểm soát thuế của vương quốc."
 steward_task.1005.c: "[steward.GetTitledFirstNameNoTooltip] nắm quyền cai trị lãnh địa [steward.GetHerHis] của riêng ngài."

 steward_task.2001.t:0 "Thiếu Nhân Công"
 steward_task.2001.desc:0 "Nông dân đang phàn nàn về sự can thiệp của [councillor.GetCouncilTitle] của ta tại [county.GetName]! Việc [councillor.GetTitledFirstNamePossessive] điều động lao động khắp [county.GetTitleTierName] khiến nhiều công trình khác đang xây dựng hiếm khi được hoàn thành."
 steward_task.2001.a:0 "Ngươi không thể hy sinh mọi thứ cho nhiệm vụ này, [councillor.GetFirstNameNoTooltip]!"
 steward_task.2001.notification:0 "Phát Triển Quản Lý Kém"

 steward_task.2002.desc:0 "Thân gửi [councillor.Custom2('RelationToMe', ROOT.Char)],\nNỗ lực của ta nhằm giúp đỡ [county.GetName] và dẫn dắt sự phát triển của vùng đất này đã không được đón nhận. Thực tế mà nói, nông dân đang kêu gọi, ừm, \"treo đầu ta lên cọc\", đại loại vậy. Một phần cơn giận đó cũng hướng về ngài, dù điều đó hoàn toàn vô lý."
 steward_task.2002.a:0 "[councillor.GetFirstNameNoTooltip]! Ngươi đã làm gì vậy?!"
 steward_task.2002.notification:0 "Dân Số Bị Quản Lý Kém"

 steward_task.2003.t:0 "Mất Kiểm Soát"
 steward_task.2003.desc:0 "Dù [councillor.GetCouncilTitle] của ta đã nỗ lực sắp xếp các lãnh địa mới tại [county.GetName], mọi thứ dường như đã vượt khỏi tầm kiểm soát. Với quá nhiều người di chuyển, [councillor.GetTitledFirstName] dường như không biết phần nào của [county.GetTitleTierName] đã được định cư và phần nào dự định khai hoang. Thực tế là dường như chẳng ai biết!"
 steward_task.2003.a:0 "Hãy kiểm soát tình hình, [councillor.GetFirstNameNoTooltip]!"
 steward_task.2003.notification:0 "Mất Kiểm Soát"

 steward_task.2005.t: "Lợi Nhuận Đang Hình Thành"
 steward_task.2005.desc: "Trong khi tập trung thực hiện chỉ thị của lãnh chúa ta là [liege.GetTitledFirstNamePossessive] nhằm phát triển [county.GetName], viên $clan_tax_collector_court_position$ của [liege.GetHerHis] là [tax_collector.GetTitledFirstName] tiếp cận ta với một quyển sổ dày và một người hầu khác phải khiêng nó.\n\n\"Vì lãnh địa đang mở rộng,\" [tax_collector.GetSheHe] giải thích, \"thì việc thuế của họ tăng lên cũng là điều hợp lý. Ta đã dành nhiều đêm tính toán một con số công bằng mà ngài có thể tự xem trong quyển sổ này...\"\n\nNgười hầu bước tới, hai đầu gối run rẩy."
 steward_task.2005.a: "Vậy hãy thu khoản thuế xứng đáng."
 steward_task.2005.a.tt: "Ta tin rằng [liege.GetTitledFirstNameNoTooltip] coi trọng tiền bạc và lợi ích trước mắt."
 steward_task.2005.b: "Không, sự phát triển của [county.GetNameNoTierNoTooltip] phải được ưu tiên."
 steward_task.2005.b.tt: "Ta tin rằng [liege.GetTitledFirstNameNoTooltip] coi trọng lợi ích lâu dài và không ham vàng."
 steward_task.2005.c: "[liege.GetTitledFirstNameNoTooltip] nên tự mình quyết định cho [liege.GetHerselfHimself]."
 steward_task.2005.c.tt: "[liege.GetTitledFirstNameNoTooltip] sẽ quyết định nên ưu tiên thu thuế hay phát triển tại [county.GetNameNoTierNoTooltip]."
 steward_task.2005.success: "[liege.GetTitledFirstNameNoTooltip|U] tán thành hướng đi của ngươi"
 steward_task.2005.failure: "[liege.GetTitledFirstNameNoTooltip|U] không đồng ý với hướng đi của ngươi"

 steward_task.2006.opening: "[steward.Custom2('AppropriateGreeting', ROOT.Char)]"
 steward_task.2006.desc_intro: "Trong lúc khảo sát [county.GetName], [tax_collector.GetTitledFirstName] đã khuyên ta tăng thuế của lãnh địa song song với việc phát triển của nó.\n\n"
 steward_task.2006.desc_development: "Tuy nhiên, ta tin rằng làm vậy sẽ kìm hãm sự phát triển của lãnh địa, vì thế ta đã không làm theo lời khuyên của [tax_collector.GetHerHis]."
 steward_task.2006.desc_taxation: "Ta đã làm theo lời khuyên của [tax_collector.GetHerHis] và tin rằng ngài sẽ hài lòng với kết quả."
 steward_task.2006.a: "Làm tốt lắm, [steward.GetTitledFirstNameNoTooltip]."
 steward_task.2006.b: "Cái gì? Đó hoàn toàn không phải điều ta mong muốn!"
 steward_task.2006.b_notification: "Quyết Định Bị Lật Ngược"

 steward_task.2007.desc: "[tax_collector.GetTitledFirstName] và ta không thể quyết định nên ưu tiên thu thuế từ [county.GetName] hay phát triển lãnh địa này, nên chúng ta đành trình việc này lên ngài."
 steward_task.2007.a: "Thuế nhiều hơn luôn là điều tốt, đó là châm ngôn của ta."

 steward_task.2008.desc_intro_friendly: "Dù [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] và [tax_collector.Custom2('MyCharacterIntroduction', ROOT.Char)] thường hợp tác khá tốt, nhưng lần này họ lại tranh cãi gay gắt — chỉ vì [county.GetNameNoTier] mà thôi."
 steward_task.2008.desc_intro_unfriendly: "Không ngày nào trôi qua mà [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] và [tax_collector.Custom2('MyCharacterIntroduction', ROOT.Char)] không cãi vã. Lần này, cuộc tranh chấp của họ cũng lại xoay quanh [county.GetNameNoTier]."
 steward_task.2008.desc_outro: "\n\n\"Khi [county.GetNameNoTooltip] trở nên phồn thịnh hơn, thuế của nó cũng nên tăng theo,\" [tax_collector.GetTitledFirstNameNoTooltip] khẳng định. \"Chúng ta nên nâng thuế ngay bây giờ thay vì đợi đến khi nhiệm vụ của [steward.GetTitledFirstNamePossessiveNoTooltip] chính thức kết thúc.\"\n\n\"Nhưng làm vậy sẽ làm chậm sự phát triển của [county.GetNameNoTierNoTooltip],\" [steward.GetTitledFirstNameNoTooltip] phản bác. \"Suy cho cùng, nhiệm vụ của ta là phát triển lãnh địa, chứ không phải bóc thuế nó.\""
 steward_task.2008.a: "[tax_collector.GetTitledFirstNameNoTooltip] nói đúng trong chuyện này."
 steward_task.2008.b: "[steward.GetTitledFirstNameNoTooltip] có lý."
 steward_task.2008.c: "Hai ngươi không thể tự giải quyết chuyện này sao?!"

 steward_task.2101.t:0 "Thu Thuế Hiệu Quả"
 steward_task.2101.desc:0 "Với [councillor.GetTitledFirstName], [councillor.GetCouncilTitle] của ta, đang hướng dẫn việc định cư và khai hoang tại [county.GetName], [councillor.GetSheHe] có cái nhìn rõ ràng không chỉ về các lãnh địa mới mà cả những lãnh địa đã tồn tại trước đó.\n\nTheo lời [councillor.GetHerHim], hồ sơ thuế của chúng ta chưa bao giờ chi tiết đến thế!"
 steward_task.2101.a:0 "Ngươi biết phải làm gì rồi đấy, [councillor.GetFirstNameNoTooltip]!"
 steward_task.2101.notification:0 "Thuế Lãnh Địa Hiệu Quả"

 steward_task.2102.t:0 "Gia Tăng Kiểm Soát"
 steward_task.2102.desc:0 "Việc hướng dẫn định cư các lãnh địa mới tại [county.GetName] buộc [councillor.GetCouncilTitle] của ta phải thực thi mức kiểm soát lớn hơn so với truyền thống của người dân nơi đây.\n\nMay thay, [councillor.GetTitledFirstName] được kính trọng rộng rãi, và bộ máy hành chính được củng cố tại [county.GetTitleTierName] mang lại cho ta nhiều lợi ích."
 steward_task.2102.a:0 "Hãy nhắc cho tất cả biết ai là người cai trị [ROOT.Char.GetTitleTierName] này."
 steward_task.2102.notification:0 "Gia Tăng Kiểm Soát"

 steward_task.3001.t:0 "Sự Kháng Cự Với Người Định Cư"
 steward_task.3001.desc:0 "Nhiều người định cư mới thuộc văn hóa [ROOT.Char.GetCulture.GetName] tại [county.GetName] đang gặp khó khăn. Tại [county.GetNameNoTier], họ không chỉ bị cộng đồng địa phương phớt lờ mà còn xảy ra nhiều vụ tấn công trực tiếp vào các trang trại!"
 steward_task.3001.a:0 "Những người định cư [ROOT.Char.GetCulture.GetNameNoTooltip] phải được tôn trọng!"
 steward_task.3001.notification:0 "Kháng Cự Người Định Cư"

 steward_task.3002.t:0 "Kháng Cự Bộ Máy Hành Chính"
 steward_task.3002.desc:0 "[councillor.GetTitledFirstName] đang gặp rắc rối bất ngờ tại [county.GetName]. Người dân địa phương từ chối hợp tác với bộ máy hành chính mới của [ROOT.Char.GetCulture.GetName]. Nhiều lời phàn nàn cho rằng nỗ lực của [councillor.GetCouncilTitle] của ta gây xáo trộn nhiều hơn là mang lại lợi ích."
 steward_task.3002.a:0 "Ta e rằng tất cả điều này là cần thiết."
 steward_task.3002.notification:0 "Hành Chính [ROOT.Char.GetCulture] Thất Bại"
 
 steward_task.3101.t:0 "Hoan Nghênh Bộ Máy Hành Chính"
 steward_task.3101.desc:0 "[councillor.GetCouncilTitle] của ta, [councillor.GetTitledFirstName], đang nỗ lực thiết lập một bộ máy hành chính dựa trên nguyên tắc của văn hóa [ROOT.Char.GetCulture.GetName] tại [county.GetName].\n\nNỗ lực của [councillor.GetHerHis|U] dường như được người dân địa phương đón nhận, khi cuộc sống của họ trở nên dễ dàng và an toàn hơn."
 steward_task.3101.a:0 "Ta đã đúng khi đặt niềm tin vào [councillor.GetTitledFirstNameNoTooltip]!"
 steward_task.3101.notification:0 "Hành Chính [ROOT.Char.GetCulture] Được Hoan Nghênh"

 steward_task.3102.t:0 "Quản Lý Được Đánh Giá Cao"
 steward_task.3102.desc:1 "[councillor.GetCouncilTitle] của ta, [councillor.GetTitledFirstName], đang cải thiện bộ máy quản trị tại [county.GetName] bằng cách áp dụng những ý tưởng dựa trên truyền thống [ROOT.Char.GetCulture.GetName].\n\nVới cách quản lý khéo léo tại [county.GetTitleTierName], các địa chủ địa phương dường như không quá bận tâm đến việc thuế tăng nhẹ."
 steward_task.3102.a:0 "Nhiều vàng hơn trong kho luôn là điều tốt!"
 steward_task.3102.notification:0 "Hành Chính [ROOT.Char.GetCulture]"

 steward_task.3103.t:0 "Quân Đoàn Được Tăng Cường"
 steward_task.3103.desc:0 "Một điều kỳ lạ đã xảy ra nhờ nỗ lực của [councillor.GetTitledFirstNamePossessive] trong việc đưa người định cư [ROOT.Char.GetCulture.GetName] tới [county.GetNameNoTier].\n\nNgười dân địa phương dường như đã hiểu rõ hơn vai trò của mình trong lãnh quốc, và khi đến lúc chiến đấu bảo vệ nó, mỗi ngôi làng đều cố gắng gửi những [ROOT.Char.Custom('LevyMenWomen')] khỏe mạnh nhất của họ đi phục vụ. Thậm chí có những nông dân tự nguyện nhập ngũ!"
 steward_task.3103.a:0 "Đúng là chuyện hiếm thấy."
 steward_task.3103.notification:0 "Tình Nguyện Quân [ROOT.Char.GetCulture]"

 steward_task.3201.notification:0 "Gia Tăng Quyền Tự Trị"
