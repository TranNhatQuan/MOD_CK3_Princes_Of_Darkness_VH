 steward_task.4001.opening:0 "[county_liege.Custom2('AppropriateGreeting', ROOT.Char)]"
 steward_task.4001.desc:0 "Ta đã nhận ra rằng [councillor.GetCouncilTitle] của ngươi đang tìm cách quyến rũ dân chúng tại [county.GetName] và kích động họ chống lại ta. Đừng nghĩ rằng hành động thiếu danh dự này sẽ không bị đáp trả."
 steward_task.4001.a:0 "Nhưng ta có #EMP yêu sách hợp pháp#! đối với nó!"

 steward_task.4002.t:0 "Mất Uy Danh"
 steward_task.4002.desc:0 "[councillor.GetTitledFirstName] đang gặp rắc rối bất ngờ tại [county.GetName]. Người dân địa phương hoàn toàn không ấn tượng trước những nỗ lực lôi kéo họ của chúng ta."
 steward_task.4002.a:0 "Rồi sớm muộn họ cũng sẽ hiểu."
 steward_task.4002.notification:0 "Mất Uy Danh"

 steward_task.4101.t:0 "Uy Danh Gia Tăng"
 steward_task.4101.desc:0 "Nhiệm vụ của [councillor.GetTitledFirstNamePossessive] tại [county.GetName] đang bắt đầu cho thấy kết quả. Người dân địa phương ấn tượng với nỗ lực của chúng ta và nhìn chúng ta với thiện cảm."
 steward_task.4101.a:0 "Kết quả tuyệt vời!"
 steward_task.4101.notification:0 "Uy Danh Gia Tăng"
