l_english:
 court_chaplain_task.0201.opening:0 "[councillor.Custom2('AppropriateGreeting', ROOT.Char)]"

 court_chaplain_task.0301.desc:0 "Ta đã lục soát những văn kiện cổ xưa và cả... những tài liệu có nguồn gốc kém chắc chắn hơn. Cuối cùng ta đã có đủ bằng chứng để chứng minh rằng ngài chính là [ROOT.Char.GetLadyLord|U] hợp pháp của [county.GetName]!\n\nChỉ còn thiếu một khoản hối lộ nho nhỏ..."
 court_chaplain_task.0301.a:0 "Hãy lo cho xong việc!"
 court_chaplain_task.0301.b:0 "Không, ta không thể."
 court_chaplain_task.0301.b.tt:0 "Mất toàn bộ tiến độ Tạo Yêu Sách"

 court_chaplain_task.0302.desc:1 "Ta đã lục soát những văn kiện cổ xưa và cả... những tài liệu có nguồn gốc kém chắc chắn hơn. Cuối cùng ta đã có đủ bằng chứng để chứng minh rằng ngài chính là [ROOT.Char.GetLadyLord|U] hợp pháp của [county.GetName].\n\nThậm chí ta còn có thể lập luận rằng ngài chính là [ROOT.Char.GetLadyLord|U] hợp pháp của [duchy.GetName]!"
 court_chaplain_task.0302.desc_heretic_addition:0 "Ta đã lục soát những văn kiện cổ xưa và cả... những tài liệu có nguồn gốc kém chắc chắn hơn. Cuối cùng ta đã có đủ bằng chứng để chứng minh rằng ngài chính là [ROOT.Char.GetLadyLord|U] hợp pháp của [county.GetName].\n\nXét việc [duchy_holder.GetFirstName] ngoan cố theo #EMP [duchy_holder.GetFaith.GetAdherentName]#!, ta thậm chí có thể lập luận rằng ngài có quyền đòi [duchy.GetName] — theo thiên mệnh!"
 court_chaplain_task.0302.a:0 "Công bố yêu sách của ta đối với [county.GetNameNoTierNoTooltip]."
 court_chaplain_task.0302.b:0 "Phải! Toàn bộ [duchy.GetNameNoTierNoTooltip] sẽ thuộc về ta!"
 
 court_chaplain_task.0311.t:0 "Một Yêu Sách Đối Với [county.GetNameNoTierNoTooltip]!"
 court_chaplain_task.0311.opening:0 "Trong nhiều tháng qua, [councillor.GetTitledFirstName], [councillor_liege.GetTitledFirstNamePossessive] [councillor.GetCouncilTitle], đã đào bới những khế ước đáng ngờ và các bản sử bịa đặt."
 court_chaplain_task.0311.end:0 "\n\nGiờ đây [councillor_liege.GetTitleTierName] [councillor_liege.GetFirstName] còn dám hành xử như thể tất cả những thứ đó đủ để tạo nên một yêu sách hợp pháp đối với [county.GetName]!"
 court_chaplain_task.0311.a:0 "Toàn là dối trá!"

 court_chaplain_task.0312.a:0 "[councillor_liege.GetFirstNameNoTooltip] không biết xấu hổ sao?!"

 court_chaplain_task.0313.t:0 "Một Yêu Sách Đối Với [county.GetNameNoTierNoTooltip]!"
 court_chaplain_task.1001.notification:0 "Rao Giảng Giáo Lý Dị Đoan"
 court_chaplain_task.1002.notification:0 "Khả Năng Hùng Biện Kém"
 court_chaplain_task.1101.notification:0 "Hùng Biện Ấn Tượng"
 court_chaplain_task.2001.notification:0 "Kháng Cự Cải Đạo"
 court_chaplain_task.2002.notification:0 "Dân Chúng Kháng Cự Việc Cải Đạo"
 court_chaplain_task.2101.notification:0 "Những Cuộc Cải Đạo Nhiệt Thành"
 court_chaplain_task.2102.notification:1 "Thiết Lập [councillor.GetFaith.HouseOfWorshipPlural|U] Mới"
 court_chaplain_task.2103.notification:0 "Tân Tín Đồ Tình Nguyện"

 court_chaplain_task.3001.t:0 "Làm Suy Yếu Trật Tự"
 court_chaplain_task.3001.desc:1 "[councillor.GetCouncilTitle] của ta, [councillor.GetFirstName], dường như vô cùng lo lắng khi [councillor.GetSheHe] đến gặp ta.\n\n\"Đã lộ ra rằng tôi đang... điều tra sự tồn tại của một yêu sách chính đáng dành cho ngài đối với [county.GetName]. Chỉ cần nói rằng, nhiều chư hầu của ngài đang rất khó chịu vì [ROOT.Char.GetTitleTierName] của họ lại phớt lờ lòng trung thành của họ và hành động chống lại họ như thế này.\""
 court_chaplain_task.3001.a:0 "Sao ngươi lại để họ phát hiện?!"
 court_chaplain_task.3002.notification:0 "Bị Cáo Buộc Bịa Đặt Yêu Sách"

 court_chaplain_task.3003.opening:0 "[vassal.Custom2('AppropriateGreeting', ROOT.Char)]"
 court_chaplain_task.3003.desc:0 "Ta vừa biết rằng [councillor.GetCouncilTitle] của ngài, [councillor.GetFirstName], đang tìm cách dựng nên một yêu sách giả tạo đối với [county.GetName]. Ta khẩn cầu ngài hãy nhớ rằng ngài là [ROOT.Char.GetTitleTierName] nhờ quyền chính đáng, chứ không phải nhờ lòng tham."
 court_chaplain_task.3003.a:0 "Ta biết rõ mình đang làm gì, [vassal.GetFirstNameNoTooltip]."
 court_chaplain_task.3003.b:0 "Hãy nhớ vị trí của mình, [vassal.GetTitledFirstNameNoTooltip]."

 court_chaplain_task.3004.opening:0 "[target.Custom2('AppropriateGreeting', ROOT.Char)]"
 court_chaplain_task.3004.desc:0 "Rõ ràng rằng [councillor.GetCouncilTitle] của ngươi đang cố dựng nên một yêu sách giả tạo và vô căn cứ đối với [county.GetName]. Đừng nghĩ rằng hành động vô danh dự như vậy sẽ không bị đáp trả."
 court_chaplain_task.3004.a:0 "Ồ, nhưng ở đây #EMP thực sự#! có cơ sở cho yêu sách."
