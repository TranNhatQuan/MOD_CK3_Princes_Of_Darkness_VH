l_english:
 marshal_task.0301.t:0 "Thăng Chức Chỉ Huy"
 marshal_task.0301.desc:0 "[councillor.GetCouncilTitle] của ta, [councillor.GetTitledFirstName], đã dẫn tới trước mặt ta một tân binh đầy triển vọng.\n\n"[commander.GetSheHe|U] có thể không xuất thân cao quý như ngài, hỡi [councillor.Custom2('RelationToMe', ROOT.Char)] của ta, nhưng nhân danh ta, ta thề rằng [commander.GetTitledFirstName] là người mà ngài sẽ muốn đứng cùng phe.""
 marshal_task.0301.a:0 "Được rồi, [commander.GetFirstNameNoTooltip] sẽ phục vụ ta."
 marshal_task.0301.b:0 "Tống cổ tên rác rưởi này khỏi [ROOT.Char.Custom('ResidenceBuilding')] của ta!"
 
 marshal_task.0302.opening:0 "[councillor.Custom2('AppropriateGreeting', ROOT.Char)]"
 marshal_task.0302.desc:1 "Ta đã thấy [commander.GetTitledFirstName] bộc lộ thiên hướng đối với [commander.Custom('CommanderTraitSkillDescription')]."
 marshal_task.0302.desc.known:0 "Đó là một trong những chuyên môn của ta, và ta có thể dạy [commander.GetHerHim] cách tận dụng tốt nhất kỹ năng này."
 marshal_task.0302.desc.unknown:0 "Mặc dù ta không thực hành trong lĩnh vực đó, ta vẫn có thể cố gắng giúp [commander.GetHerHim] tinh chỉnh các kỹ năng [commander.GetHerHis] của ngài."
 marshal_task.0302.a:0 "Tốt, hãy dạy cho [commander.GetHerHim]."
 marshal_task.0302.b:0 "Không, [commander.GetFirstNameNoTooltip] nên tập trung vào chiến đấu cá nhân."

 marshal_task.0304.t: "Thăng Chức Chỉ Huy?"
 marshal_task.0304.desc: " [councillor.GetCouncilTitle] của ta, [councillor.GetTitledFirstName], do dự đưa [beneficiary_of_nepotism.Custom2('MyCharacterIntroduction', ROOT.Char)] tới trước mặt ta.\n\n"[advocate_of_nepotism.GetTitledFirstName|U] đã yêu cầu ta phong cho [beneficiary_of_nepotism.GetTitledFirstNameNoTooltip] vinh dự trở thành chỉ huy. Nhưng ta nghĩ có lẽ ngài sẽ muốn tự mình quyết định trước..."\n\n[beneficiary_of_nepotism.GetTitledFirstNameNoTooltip] [beneficiary_of_nepotism.Custom('quirk_neg_present')]."
 marshal_task.0304.a_clan:0 "Mọi con cháu nhà [ROOT.Char.GetHouse.GetBaseNameNoTooltip] đều được chào đón trong quân đội."
 marshal_task.0304.a_neutral:0 "[beneficiary_of_nepotism.Custom('GetDaughterSon')] của ngươi được chào đón vào quân đội của ta."
 marshal_task_0304_a_tt: "@warning_icon! #X [CHARACTER.GetShortUINameNoTooltip|U] sẽ tức giận nếu [TARGET_CHARACTER.GetShortUINameNoTooltip|U] bị sa thải trong vòng 20 năm#!"
 marshal_task.0304.b:0 "[beneficiary_of_nepotism.GetTitledFirstNameNoTooltip] chẳng phải thích làm cận thần hơn sao?"
 marshal_task.0304.b.success:0 "[advocate_of_nepotism.GetTitledFirstNameNoTooltip] hài lòng với đề nghị của ngươi"
 marshal_task.0304.b.failure:0 "[advocate_of_nepotism.GetTitledFirstNameNoTooltip] cảm thấy bị xúc phạm"
 marshal_task.0304.c:0 "Quân đội của ta #EMP không#! phải nhà trẻ!"

 marshal_task.0306.opening: "[advocate_of_nepotism.Custom2('AppropriateGreetingNegative', SCOPE.sC('councillor_liege'))]"
 marshal_task.0306.desc: "Ta đã tin lời ngươi khi ngươi hứa sẽ phong [beneficiary_of_nepotism.Custom2('MyCharacterIntroduction', advocate_of_nepotism)] làm [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] của ngươi, nhưng giờ ta thấy lòng tin của ta đã đặt sai chỗ. Hãy tha thứ cho ta vì đã quá tin lời ngươi."
 marshal_task.0306.a: "Chỉ là hiểu lầm thôi!"

 marshal_task.1001.t:0 "Lính Trưng Binh Đào Ngũ"
 marshal_task.1001.desc:0 "Những biện pháp tuyển quân khắc nghiệt của [councillor.GetCouncilTitle] ta, [councillor.GetTitledFirstName], dường như đang mang lại kết quả ngược lại.\n\nTrong khi nhiều nông dân bị gom vào quân ngũ, cũng có vô số người bỏ trốn khỏi quân lính của [councillor.GetFirstNamePossessive] để tránh nghĩa vụ!"
 marshal_task.1001.a:0 "Ta cần nhiều quân hơn, không phải ít hơn!"
 marshal_task.1001.notification:0 "Lính Trưng Binh Đào Ngũ"

 marshal_task.1002.t:0 "Đất Nông Bỏ Hoang"
 marshal_task.1002.desc:0 "Số lượng kỷ lục lính trưng binh được huy động bởi [councillor.GetCouncilTitle] của ta đã gây ra những hậu quả không lường trước.\n\nViệc tuyển quân bừa bãi của [councillor.GetTitledFirstNamePossessive] đã khiến nhiều mẫu ruộng ở [county.GetName] bị bỏ hoang."
 marshal_task.1002.a:0 "Chuyện này không nên xảy ra."
 marshal_task.1002.notification:0 "Trưng Binh Khiến Ruộng Đất Bỏ Hoang"

 marshal_task.1003.t:0 "Thiếu Lính Gác"
 marshal_task.1003.desc:0 "Chiến dịch tuyển quân hăng hái của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))], [councillor.GetTitledFirstName], đã khiến [county.GetName] thiếu hụt đàn ông khỏe mạnh.\n\nVới ít người làm lính gác địa phương hơn, tội phạm bắt đầu gia tăng."
 marshal_task.1003.a:0 "Ngươi đã làm gì vậy, [councillor.GetFirstNameNoTooltip]..."
 marshal_task.1003.notification:0 "Lính Gác Bị Trưng Binh"

 marshal_task.1101.t:0 "Tổ Chức Tuyển Quân Tốt"
 marshal_task.1101.desc:0 "Nhờ kiểm tra và lựa chọn cẩn thận các binh sĩ trưng binh, [councillor.GetCouncilTitle] của ta, [councillor.GetTitledFirstName], đã đảm bảo không một nông trại nào ở [county.GetName] bị bỏ hoang.\n\nNhững sổ sách mà [councillor.GetSheHe] ghi chép cũng sẽ rất hữu ích khi đến mùa thu thuế..."
 marshal_task.1101.a:0 "Làm tốt lắm, [councillor.GetFirstNameNoTooltip]."
 marshal_task.1101.notification:0 "Trưng Binh Được Tổ Chức Tốt"

 marshal_task.1102.t:0 "Hiện Diện Quân Sự Gia Tăng"
 marshal_task.1102.desc:0 "Công việc tái tổ chức quân trưng binh của [councillor.GetTitledFirstNamePossessive] đã tới [county.GetName], nơi sự hiện diện quân sự gia tăng mang lại hiệu quả rõ rệt.\n\nThổ phỉ bị quét sạch, còn bọn buôn lậu và bắt cóc thì quá sợ hãi để hoạt động."
 marshal_task.1102.a:0 "Thần dân của ta có thể luôn cảm thấy an toàn."
 marshal_task.1102.notification:0 "Hiện Diện Quân Sự Gia Tăng"
 marshal_task.1103.notification:0 "Trưng Binh Sẵn Sàng Chiến Đấu"

 marshal_task.2001.t:0 "Chỉ Huy Bị Thương"
 marshal_task.2001.opening:0 "Trong một trận đấu tập, [commander.GetTitledFirstName] đã bị trúng đòn!"
 marshal_task.2001.ending:0 "\n\n[councillor.GetCouncilTitle] của ta, [councillor.GetTitledFirstName], đã kịp thời cầm máu, nhưng [commander.GetFirstName] sẽ phải mất một thời gian mới hồi phục."
 marshal_task.2001.a:0 "Họ dùng vũ khí thật sao?!"
 marshal_task.2001.notification:0 "Chiến Binh Bị Thương Khi Luyện Tập"
 
 marshal_task.2101.notification:0 "Nhận Được Đặc Tính [commander.Custom('CommanderTraitBeingTaughtNoTooltip')]"
 marshal_task.2102.notification:0 "Kỵ Sĩ Cải Thiện"
 marshal_task.2103.notification:0 "Huấn Luyện Hastilude"
 marshal_task.0302.notification.a:0 "Chỉ Huy Cải Thiện Đáng Kể"
 marshal_task.0302.notification.b:0 "Chỉ Huy Cải Thiện"
 marshal_task.0303.notification.a:0 "Kỵ Sĩ Cải Thiện Đáng Kể"
 marshal_task.0303.notification.c:0 "Kỵ Sĩ Trở Thành Bậc Thầy Kiếm Thuật"

 marshal_task.2002.t:0 "Chỉ Huy Bị Thương Nặng"
 marshal_task.2002.eye:0 "\n\n[councillor.GetCouncilTitle] của ta lập tức gọi thầy thuốc, nhưng không còn cách nào cứu được đôi mắt của [commander.GetHerHis]."
 marshal_task.2002.leg:0 "\n\n[councillor.GetCouncilTitle] của ta lập tức gọi thầy thuốc, nhưng không còn cách nào cứu được chân của [commander.GetHerHis]."
 marshal_task.2002.hand:0 "\n\n[councillor.GetCouncilTitle] của ta lập tức gọi thầy thuốc, nhưng không còn cách nào cứu được cánh tay của [commander.GetHerHis]."
 marshal_task.2002.a:0 "Ít nhất là tâm trí [commander.GetHerHis] của ngài vẫn còn nguyên vẹn."
 marshal_task.2002.b:0 "Ngựa của [commander.GetHerHis] sẽ phải chở [commander.GetHerHim] ra trận."
 marshal_task.2002.c:0 "Xin hãy nói rằng [commander.GetSheHe] vẫn còn tay cầm kiếm!"
 marshal_task.2002.generic_title:0 "Chiến Binh Bị Thương Khi Luyện Tập"
 marshal_task.2002.notification_eye:0 "[commander.GetTitledFirstName] đã mất một mắt khi luyện tập dưới sự chỉ đạo của [councillor.GetCouncilTitle] của ta!"
 marshal_task.2002.notification_leg:0 "[commander.GetTitledFirstName] đã mất một chân khi luyện tập dưới sự chỉ đạo của [councillor.GetCouncilTitle] của ta!"
 marshal_task.2002.notification_hand:0 "[commander.GetTitledFirstName] đã bị tàn phế khi luyện tập dưới sự chỉ đạo của [councillor.GetCouncilTitle] của ta!"

 marshal_task.2003.t:0 "Cái Chết Của Một Chỉ Huy"
 marshal_task.2003.ending:0 "\n\n[councillor.GetCouncilTitle] của ta lập tức gọi thầy thuốc, nhưng [commander.GetFirstName] đã mất máu và chết chỉ trong chốc lát."
 marshal_task.2003.a:0 "Một tổn thất đáng tiếc cho quân đội của ta."

 marshal_task.2101.desc:0 "[councillor.GetCouncilTitle] của ta, [councillor.GetTitledFirstName], đến gặp ta với một đề nghị.\n\n"Ta nhận thấy [commander.GetTitledFirstName] có tiềm năng đối với [commander.Custom('CommanderTraitSkillDescription')] giống như [teacher.GetTitledFirstName] trước đây. Ta tin rằng [commander.GetFirstName] có thể học được rất nhiều nếu được [teacher.GetFirstName] trực tiếp chỉ dạy.""
 marshal_task.2101.a:0 "Hãy tiến hành."
 marshal_task.2101.b:0 "[commander.GetFirstNameNoTooltip] nên tập trung vào chiến đấu cá nhân hơn!"

 marshal_task.3001.t:0 "Sự Kháng Cự Địa Phương"
 marshal_task.3001.desc:0 "[councillor.Custom2('RelationToMe', ROOT.Char)] đáng kính của ta,\n Trong khi nỗ lực tái tổ chức [county.GetName] của ta đang tiến triển, không phải ai cũng tin vào lợi ích của nó.\nCó vẻ ta đã đụng chạm tới không ít thị trưởng và trưởng làng. Thực ra là tất cả bọn họ."
 marshal_task.3001.a:0 "Ngươi đã làm gì vậy, [councillor.GetFirstNameNoTooltip]..."
 marshal_task.3001.notification:0 "Mất Sự Kính Trọng Của Dân Chúng"

 marshal_task.3002.desc:0 "[councillor.Custom2('RelationToMe', ROOT.Char)] đáng kính của ta...\n\nCó vẻ ta đã phạm vài sai lầm trong phán đoán. Những cải cách ta đưa vào ở [county.GetName] nhằm củng cố quyền lực của ngài, nhưng giờ người dân thậm chí còn chẳng biết ai là [ROOT.Char.GetTitleTierName] của họ..."
 marshal_task.3002.a:0 "Ngươi đã làm mọi thứ #EMP tồi tệ hơn cả?!#!"
 marshal_task.3002.notification:0 "[councillor.GetCouncilTitle] Mất Kiểm Soát"

 marshal_task.3003.t:0 "Một Sự Thất Vọng"
 marshal_task.3003.desc:0 "Chào ngài, [baron.Custom2('RelationToMe', ROOT.Char)],\n Ta phải phàn nàn về hành vi của [councillor.GetCouncilTitle] của ngài, [councillor.GetTitledFirstName]!\n [councillor.GetSheHe|U] đã đến [county.GetName] và bắt đầu thay đổi mọi thứ theo ý mình, chẳng hề tôn trọng truyền thống hay tập tục cổ xưa của chúng ta!"
 marshal_task.3003.a:0 "Ngươi không thể khéo léo hơn sao, [councillor.GetFirstNameNoTooltip]?"
 marshal_task.3003.notification:0 "Nam Tước Bất Mãn"

 marshal_task.3101.t:0 "Lợi Ích Địa Phương"
 marshal_task.3101.desc:0 "[councillor.Custom2('RelationToMe', ROOT.Char)] đáng kính của ta,\n Ta vui mừng báo rằng việc tái tổ chức [county.GetName] đang tiến triển tốt.\n Không chỉ ngài hưởng lợi từ điều này. Người dân [county.GetNameNoTier] vẫn luôn trung thành với [ROOT.Char.GetTitleTierName] của họ, nhưng hiếm khi họ biết ơn đến vậy."
 marshal_task.3101.a:0 "Làm tốt lắm, [councillor.GetCouncilTitle]!"
 marshal_task.3101.notification:0 "[councillor.GetCouncilTitle] Giành Được Sự Kính Trọng"

 marshal_task.3102.t:0 "Lòng Biết Ơn"
 marshal_task.3102.desc:0 "[baron.Custom2('RelationToMe', ROOT.Char)] của ta,\n [councillor.GetCouncilTitle] của ngài, [councillor.GetTitledFirstName], đã làm việc không mệt mỏi để tái tổ chức [county.GetName], và chúng ta đã bắt đầu gặt hái thành quả.\nTa muốn đích thân cảm ơn ngài vì đã cử một [councillor.GetWomanMan] tài năng như vậy tới giúp chúng ta!"
 marshal_task.3102.a:0 "Tiếp tục làm tốt, [councillor.GetFirstNameNoTooltip]."
 marshal_task.3102.notification:0 "[councillor.GetCouncilTitle] Gây Ấn Tượng Với Chư Hầu"

 marshal_task.3103.notification:0 "[acclaimed_knight] Trấn Áp Nông Dân"

 marshal_task.4002.notification:0 "Lính Gác Hỗn Loạn"
 task_manage_guards_disorganized_modifier:0 "$marshal_task.4002.notification$"
