l_english:
 chancellor_task.0991_end_desc:0 "Thiện cảm của [target_character.GetTitledFirstNamePossessiveNoTooltip] đối với ngươi sẽ không thể tăng thêm nữa."
 chancellor_task.0991_increase_desc:0 "[target_character.GetTitledFirstNameNoTooltip] đã rất ấn tượng và vinh dự trước ân huệ mà ngươi ban cho [target_character.GetHerHim]."

 chancellor_task.1001.t:0 "Một Kẻ Đòi Quyền Mới"
 chancellor_task.1001.desc:0 "Trong tất cả những trò hề mà ta từng thấy...\n\nTrong những nỗ lực vô nghĩa [councillor.GetTitledFirstNamePossessive] nhằm cải thiện mối quan hệ của ta với những người hàng xóm, [councillor.GetCouncilTitle] vô dụng [councillor.GetCouncilTitle] của ta đã chính thức công nhận yêu sách [neighboring_ruler.GetTitledFirstNamePossessive] đối với [target_county.GetName]!"
 chancellor_task.1001.a:0 "Ta bảo ngươi kết bạn cho ta, không phải gây thêm kẻ thù!"
 chancellor_task.1001.title_message:0 "Sai Lầm Tạo Ra Yêu Sách"
 chancellor_task.1001.message:0 "[councillor.GetTitledFirstName] đã chính thức công nhận yêu sách của ngươi đối với [target_county.GetName]"

 chancellor_task.1002.t:0 "Sự Kết Thúc Của Một Hòa Ước"
 chancellor_task.1002.desc:0 "Trong nỗ lực cải thiện danh tiếng [councillor.GetTitledFirstNamePossessive] của ta, [councillor.GetCouncilTitle] bất tài [councillor.GetCouncilTitle] của ta đã đồng ý với một hiệp ước #EMP hủy bỏ#! một phần hiệp ước cũ của ta với [target.GetName]!\n\nTheo cách mà [target.GetTitleTierName] nhìn nhận, [target.GetSheHe] hoàn toàn tự do tuyên chiến với ta bất cứ khi nào [target.GetSheHe] muốn."
 chancellor_task.1002.a:0 "Tại sao ngươi lại đồng ý chuyện này, [councillor.GetFirstNameNoTooltip]?!"

 chancellor_task.1003.opening:1 "[neighbor.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 chancellor_task.1003.desc:0 "Ta đã trao đổi thư từ với [councillor.GetCouncilTitle] của ngươi, [councillor.GetTitledFirstName], và đó là một màn ngoại giao đáng xấu hổ. Ngươi không phải là [ROOT.Char.GetWomanMan] mà ta từng nghĩ!"
 chancellor_task.1003.a:0 "Ắt hẳn đây là một sự hiểu lầm khủng khiếp..."

 chancellor_task.1003.message:0 "[councillor.GetCouncilTitle] Làm Phật Lòng [neighbor.GetTitledFirstName]"

 chancellor_task.1102.t:0 "Ngoại Giao Khéo Léo"
 chancellor_task.1102.desc:0 "[councillor.GetCouncilTitle] của ta, [councillor.GetTitledFirstName], đã nỗ lực thuyết phục các vương quốc láng giềng và chư hầu rằng hiệp ước hòa bình ta ký với [target.GetName] là khiếm khuyết, không chính đáng và bất công với ta!\n\nTa giờ đây lại được tự do tuyên chiến với [target.GetHerHim] khi ta muốn."
 chancellor_task.1102.a:0 "Làm rất tốt, [councillor.GetFirstNameNoTooltip]!"

 chancellor_task.1103.opening:0 "[neighbor.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 chancellor_task.1103.desc:0 "Ta đã trao đổi thư từ với [councillor.GetCouncilTitle] của ngươi, [councillor.GetTitledFirstName], và phải nói rằng ta đã nhìn ngươi dưới một ánh sáng hoàn toàn mới.\n\nCó lẽ một ngày nào đó ta thậm chí còn tự hào gọi ngươi là bằng hữu."
 chancellor_task.1103.a:0 "Hôm nay cái lưỡi bạc của ngươi thật sáng chói, [councillor.GetFirstNameNoTooltip]!"

 chancellor_task.1103.message:0 "[councillor.GetCouncilTitle] Gây Ấn Tượng Với Láng Giềng"

 chancellor_task.2001.t:0 "Sự Kháng Cự Địa Phương"
 chancellor_task.2001.desc:0 "[councillor.Custom2('RelationToMe', ROOT.Char)] đáng kính của ta,\n Trong khi những nỗ lực của ta nhằm tái tổ chức [county.GetName] đang tiến triển thuận lợi, không phải ai cũng tin vào lợi ích của chúng.\nDường như ta đã chạm vào lợi ích của vài thị trưởng và trưởng lão làng. Thực ra là của tất cả bọn họ."
 chancellor_task.2001.a:0 "Ngươi đã làm gì vậy, [councillor.GetFirstNameNoTooltip]..."
 chancellor_task.2001.notification:0 "Sự bất tài của [councillor.GetCouncilTitle] khiến dân [county.GetName] mất đi sự tôn trọng với ta"

 chancellor_task.2002.desc:0 "[councillor.Custom2('RelationToMe', ROOT.Char)] đáng kính của ta...\n\nCó vẻ ta đã phạm vài sai lầm trong phán đoán. Những cải cách ta đưa ra tại [county.GetName] vốn nhằm củng cố quyền lực của ngài tại vùng này, nhưng giờ dân chúng dường như còn chẳng biết ai là [ROOT.Char.GetTitleTierName] của họ..."
 chancellor_task.2002.a:0 "Ngươi còn làm mọi thứ #EMP tệ hơn nữa?!#!"
 chancellor_task.2002.notification:0 "[councillor.GetCouncilTitle] của ta đang mất kiểm soát tại [county.GetName]!"

 chancellor_task.2003.t:0 "Một Nỗi Thất Vọng"
 chancellor_task.2003.desc:0 "Chào ngài, [baron.Custom2('RelationToMe', ROOT.Char)],\n Ta phải phàn nàn về hành vi của [councillor.GetCouncilTitle] của ngài, [councillor.GetTitledFirstName]!\n [councillor.GetSheHe|U] đã đến [county.GetName] và bắt đầu thay đổi mọi thứ theo ý thích, chẳng hề quan tâm đến truyền thống hay tập tục cổ xưa của chúng ta!"
 chancellor_task.2003.a:0 "Ngươi không thể tinh tế hơn chút sao, [councillor.GetFirstNameNoTooltip]?"
 chancellor_task.2003.notification:0 "[councillor.GetCouncilTitle] bất tài của ta đã khiến một chư hầu phật lòng!"

 chancellor_task_2001.message:0 "$baron_plural_upper_case$ Kháng Cự Việc Sáp Nhập"

 chancellor_task_2002.message:1 "[resisting_culture.GetNameNoTooltip] Kháng Cự Việc Sáp Nhập"

 chancellor_task_2101.message:0 "$baron_plural_upper_case$ Ủng Hộ Việc Sáp Nhập"

 chancellor_task_2102.message:1 "[supporting_culture.GetNameNoTooltip] Ủng Hộ Việc Sáp Nhập"
 chancellor_task_every_county_of_culture_in_title:0 "Mọi Quận [supporting_culture.GetAdjective] trong [title.GetNameNoTier]"

 chancellor_task.2103.opening:0 "[councillor.Custom2('AppropriateGreeting', ROOT.Char)]"
 chancellor_task.2103.desc:0 "Những nỗ lực sáp nhập của chúng ta tại [title.GetName] đang tiến triển rất tốt. Trên thực tế, chúng ta có thể thử áp dụng tập quán thu thuế của [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] ở quy mô hạn chế."
 chancellor_task.2103.a:0 "Tuyệt vời. Hãy làm như vậy!"
 chancellor_task.2103.b:0 "Hay là chúng ta cũng nên học thêm từ tập quán của họ?"
 chancellor_task.2103.c:0 "Không, những việc này cần thời gian."

 chancellor_task.3001.opening:0 "[vassal.Custom2('AppropriateGreeting', ROOT.Char)]"
 chancellor_task.3001.desc:0 "Ta đã đón tiếp [councillor.GetCouncilTitle] của ngươi, [councillor.GetTitledFirstName], một thời gian rồi. Cách [councillor.GetSheHe] áp đặt [councillor.GetHerselfHimself] lên nhà ta, trong khi liên tục khuyến khích sự phục tùng khúm núm đối với ngươi, thật làm ta ghê tởm!\n\n[ROOT.Char.GetLadyLord] nào lại cử một đại diện tồi tệ đến thế?"
 chancellor_task.3001.a:0 "[councillor.GetFirstNameNoTooltip]! Ngươi đã làm gì vậy?!"

 chancellor_task.3002.opening:0 "[councillor.Custom2('AppropriateGreeting', ROOT.Char)]"
 chancellor_task.3002.desc:0 "Có vẻ như trong lúc thương lượng với [vassal.GetTitledFirstName], ta đã... vô tình đưa ra vài lời hứa miễn trừ nghĩa vụ của [vassal.GetHerHis]...\n\nTa đã cố gắng, nhưng e rằng giờ chẳng còn cách nào khác để thoát khỏi chuyện này..."
 chancellor_task.3002.a:0 "Đồ ngu!"
 chancellor_task.3002.c:0 "Không, ta vẫn có thể cứu vãn việc này."
 chancellor_task.3002.d:0 "Ồ, ta nghĩ là không."

 chancellor_task.3101.opening:0 "[active_councillor.Custom2('AppropriateGreeting', ROOT.Char)]"
 chancellor_task.3101.desc:0 "Với cuộc xung đột đang diễn ra giữa [attacker_vassal.GetTitledFirstName] và [defender_vassal.GetTitledFirstName], ta đã làm việc không ngừng nghỉ để tìm ra căn nguyên tranh chấp của họ. Ta tin rằng với sự khuyến khích đúng lúc, một thỏa thuận có thể đạt được."
 chancellor_task.3101.a:0 "Dù tốn kém thế nào, hãy khiến họ ngừng chiến đấu."
 chancellor_task.3101.b:0 "Họ sẽ làm theo lệnh của ta, vì ta là [ROOT.Char.GetTitleTierName] của họ!"
 chancellor_task.3101.c:0 "Cứ để họ tự giải quyết."
 chancellor_task.3101.c.tt:0 "Cuộc chiến giữa [attacker_vassal.GetFirstNameNoTooltip] và [defender_vassal.GetFirstNameNoTooltip] tiếp tục"

 chancellor_task.3102.desc:0 "Ta phát hiện rằng hợp đồng của [vassal.GetTitledFirstNamePossessive] buộc [vassal.GetHerHim] phải nộp nhiều hơn những gì ngươi đã thu."
 chancellor_task.3102.a:0 "Đã đến lúc sửa lại sai lầm này!"
 chancellor_task.3102.c:1 "Ta sẽ bỏ qua lần này..."

 chancellor_task.3003.t:0 "Suy Giảm Quyền Lực"
 chancellor_task.3003.desc:0 "Có vẻ như dù [councillor.GetCouncilTitle] của ta có làm gì đi nữa — nếu có làm! — thì vẫn chưa đủ.\n\nDưới sự giám sát của [councillor.GetTitledFirstNamePossessive], các chư hầu của ta hành động tùy ý, hiếm khi hỏi ý ta trong bất cứ việc gì."
 chancellor_task.3003.a:0 "Ta cảm thấy quyền lực đang tuột khỏi tay mình."
 chancellor_task.3003.notification:0 "[councillor.GetCouncilTitle] Không Kiểm Soát Được Chư Hầu"

 chancellor_task.3103.desc:0 "Ta đã tiếp đón [councillor.GetCouncilTitle] của ngài, [councillor.GetTitledFirstName], suốt vài tuần qua, và [councillor.GetSheHe] đã giúp ta thực sự nhận ra sự huy hoàng của vương quốc dưới quyền cai trị của ngài.\n\nThật vinh dự khi được làm chư hầu của ngài!"
 chancellor_task.3103.a:0 "Ta thật may mắn khi có những thuộc hạ biết ơn như vậy."

 chancellor_task.3104.desc:0 "Ta đã phát hiện vài hợp đồng cổ liên quan đến [primary_title.GetName]. Có thể lập luận rằng [vassal.GetTitledFirstName] phải công bằng hơn trong việc phân chia quyền thừa kế của [vassal.GetHerHis] so với trước đây."
 chancellor_task.3104.a:0 "Chúng ta phải bảo vệ quyền của những người thừa kế của [vassal.GetFirstNamePossessiveNoTooltip]!"
 chancellor_task.3104.b:0 "Cứ để mọi thứ như cũ... với một cái giá."
 chancellor_task.3104.c:0 "Không cần phải chia cắt lãnh thổ."
