 councillor_spouse_intrigue.1001.t:1 "[councillor.GetCouncilTitle]: Không tin bất cứ ai"
 councillor_spouse_intrigue.1001.desc:0 "\"Ngài phải cẩn trọng với những người quanh mình.\" Ánh mắt của [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('councillor'))] ta trở nên vô cùng nghiêm trọng. \"Ta đã phát hiện rằng ngay lúc này, [spymaster.GetTitledFirstName] đang âm mưu chống lại ngài!\"\n\nChuyện đó có thể là thật sao? Chính [spymaster.GetCouncilTitle] của ta?!"
 councillor_spouse_intrigue.1001.a:0 "Ta đúng là một kẻ ngu xuẩn!"

 councillor_spouse_intrigue.1002.t:1 "[councillor.GetCouncilTitle]: Tin đồn và Suy đoán"
 councillor_spouse_intrigue.1002.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] [councillor.Custom('quirk_pos_present')] của ta theo cách mà [councillor.GetSheHe] vẫn thường làm khi [councillor.GetSheHe] có điều gì đó muốn chia sẻ. \"Ngươi có biết những tin đồn về [target.GetTitledFirstName], rằng [target.GetSheHe] đang che giấu một điều gì đó khủng khiếp không?\" Ta nghiêng người lại gần hơn khi [councillor.GetSheHe] hạ thấp giọng [councillor.GetHerHis] của mình xuống. \"Tất cả đều là sự thật. Tất cả những gì chúng ta cần là bằng chứng.\""
 councillor_spouse_intrigue.1002.a:0 "Đã đến lúc dùng đến gián điệp rồi, [councillor.Custom('LoverPetName')] của ta!"
 councillor_spouse_intrigue.1002.b:0 "Ta phải tìm ra đó là điều gì!"
 councillor_spouse_intrigue.1002.c:0 "Ta giữ bí mật của mình tốt hơn [target.GetFirstNameNoTooltip]."

 councillor_spouse_intrigue.1003.t:1 "[councillor.GetCouncilTitle]: Được tiết lộ"
 councillor_spouse_intrigue.1003.desc:0 "Chỉ cần nhìn cách [councillor.GetSheHe] tiến đến, ta biết [councillor.GetTitledFirstName] lại phát hiện thêm một bí mật trong triều đình.\n\n\"[agent.GetTitledFirstName] đang tham gia vào một âm mưu,\" [councillor.GetSheHe] nói. \"[agent.GetSheHe|U] chưa biết rằng ta đã biết, nhưng ta khuyên ngài nên ban ân xá cho [agent.GetHerHim], đổi lại là lòng trung thành tuyệt đối...\""
 councillor_spouse_intrigue.1003.a:0 "Hãy để [agent.GetHerHim] hiểu rõ mức độ nghiêm trọng của chuyện này."
 councillor_spouse_intrigue.1003.b:0 "Dùng [agent.GetHerHim] để tìm ra kẻ chủ mưu thật sự!"
 councillor_spouse_intrigue.1003.c:0 "Theo dõi mọi hành động [agent.GetHerHis] của hắn, và bảo vệ ta khỏi bị tổn hại!"

 councillor_spouse_intrigue.1004.t:1 "[councillor.GetCouncilTitle]: Nghiên cứu Đối thủ"
 councillor_spouse_intrigue.1004.desc:1 "[secret_holder.GetTitledFirstName] đã gây không ít phiền toái, công khai ủng hộ [faction.GetName]. May thay, ta dường như sắp chiếm được thế thượng phong.\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] của ta đã phát hiện một bí mật được giữ kín của [secret_holder.GetHerHis], [councillor.GetSheHe] nói với ta cùng nụ cười đầy mưu trí.\n\n\"Ta nghĩ rằng điều này có thể khiến ngài hứng thú, thưa người thân mến...\""
 councillor_spouse_intrigue.1004.a:0 "Một chút tống tiền sẽ khiến [secret_holder.GetHerHim] ngoan ngoãn."
 councillor_spouse_intrigue.1004.b:0 "Thật là bê bối! Cả lãnh quốc phải biết chuyện này!"
 councillor_spouse_intrigue.1004.c:0 "Đôi khi tốt nhất là chờ đợi khi đang nắm lợi thế."
 councillor_spouse_intrigue.1004.c.tt:1 "Ngươi chưa tiết lộ bí mật của [secret_holder.GetFirstNamePossessiveNoTooltip]"

 councillor_spouse_intrigue.1005.t:1 "[councillor.GetCouncilTitle]: Chia để Trị"
 councillor_spouse_intrigue.1005.desc:0 "[faction_member.GetTitledFirstName] đã tích cực ủng hộ [leader.GetTitledFirstName] và phe [faction.GetName] của [leader.GetHerHis]. Tuy nhiên, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] của ta có một kế hoạch để thay đổi điều đó.\n\n\"Hãy tin ta, chỉ cần vài điều ta nói với [faction_member.GetTitledFirstName] thôi cũng đủ khiến [faction_member.GetHerHim] lập tức từ bỏ [leader.GetFirstNameNoTooltip].\""
 councillor_spouse_intrigue.1005.a:0 "Hãy đảm bảo [faction_member.GetFirstNameNoTooltip] không bao giờ ủng hộ [leader.GetFirstNameNoTooltip] nữa!"
 councillor_spouse_intrigue.1005.b:0 "Ngươi có thể khiến #EMP ta#! trông như lựa chọn tốt hơn không?"

 councillor_spouse_intrigue.1006.t:1 "[councillor.GetCouncilTitle]: Một Đại diện Phù hợp"
 councillor_spouse_intrigue.1006.desc:0 "Biết rõ kế hoạch của ta đối với [target.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] của ta là [councillor.GetFirstName] đã mang đến một đề nghị.\n\n\"Ta có bằng hữu tại triều đình của [court_owner.GetTitledFirstNamePossessive]. Ta có thể nhờ họ cho một vị khách trú lại một thời gian. Chỉ cần một chút biểu thị trung thành cùng mọi sự hỗ trợ ta có thể cung cấp, [plant.GetTitledFirstName] sẽ làm được nhiều điều vì lợi ích của ngài...\""
 councillor_spouse_intrigue.1006.a:0 "Một ý tưởng tuyệt vời, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] của ta!"
 councillor_spouse_intrigue.1006.b:0 "Ta nghĩ chúng ta có thể cần [plant.GetFirstNameNoTooltip] ở đây."
