l_english:
 councillor_spouse_diplomacy.1001.desc:0 "Danh Tiếng Gia Tộc"
 councillor_spouse_diplomacy.1002.desc:0 "Xung Đột Anh Em Được Hòa Giải"
 councillor_spouse_diplomacy.1003.desc:0 "Quan Hệ Anh Em Cải Thiện"
 councillor_spouse_diplomacy.1004.desc:0 "Huấn Luyện Ngoại Giao"
 councillor_spouse_diplomacy.1004.desc_diplo_councillor:0 "Được dạy bởi [councillor.GetTitleAsName]"
 councillor_spouse_diplomacy.1005.desc:0 "Rèn Luyện Ngoại Giao"
 councillor_spouse_diplomacy.1006.desc:0 "Nhờ sự nỗ lực không ngừng của [councillor.GetTitledFirstNamePossessive], [councillor.GetSheHe] đã trở nên khéo léo hơn trong việc giao tiếp với mọi người."
 councillor_spouse_diplomacy.1007.desc:0 "Những Cuộc Trao Đổi Thân Thiện"

 councillor_spouse_diplomacy.2001.t_female:1 "[councillor.GetCouncilTitle]: Nữ độc thân đủ điều kiện"
 councillor_spouse_diplomacy.2001.t_male:1 "[councillor.GetCouncilTitle]: Nam độc thân đủ điều kiện"
 councillor_spouse_diplomacy.2001.desc_mother:0 "[councillor.GetTitledFirstName] nhìn các [ROOT.Char.Custom('ChildChildrenGender')] của chúng ta với vẻ [councillor.Custom('quirk_pos_noun')] quen thuộc của [councillor.GetHerHis]. \"Không đứa con nào của chúng ta nên thiếu một cuộc hôn phối xứng đáng.\""
 councillor_spouse_diplomacy.2001.desc:0 "[councillor.GetTitledFirstName] nhìn các [ROOT.Char.Custom('ChildChildrenGender')] của ta với vẻ [councillor.Custom('quirk_pos_noun')] quen thuộc của [councillor.GetHerHis]. \"Không đứa con nào của ngài nên thiếu một cuộc hôn phối xứng đáng.\""
 councillor_spouse_diplomacy.2001.desc_end:0 "Nếu ngài cho phép ta chỉ dạy chúng, chẳng bao lâu nữa những kẻ cầu hôn sẽ xếp hàng kín cả đường trước cổng!"
 councillor_spouse_diplomacy.2001.a:0 "Người thừa kế của ta, [child_heir.GetTitledFirstNameNoTooltip], có thể cần sự chỉ dạy đó."
 councillor_spouse_diplomacy.2001.b:0 "Tất cả chúng đều nên được chỉ dạy đôi chút."
 councillor_spouse_diplomacy.2001.b.all_kids:0 "Tất cả những đứa con chưa kết hôn của ta:"
 councillor_spouse_diplomacy.2001.c:0 "Chi bằng ngươi hãy dạy ta những phép tắc đáng trọng ấy!"

 councillor_spouse_diplomacy.2002.t:1 "[councillor.GetCouncilTitle]: Trở nên thân thiết hơn"
 councillor_spouse_diplomacy.2002.desc:0 "\"Việc nuôi dưỡng mối quan hệ giữa thế hệ cai trị tiếp theo là trách nhiệm chúng ta không nên bỏ bê,\" [councillor.GetTitledFirstName] nói.\n\n\"Một vài chư hầu quyền thế của ngài có con cái mà ta tin rằng [child_heir.GetTitledFirstName] sẽ có lợi khi làm quen.\""
 councillor_spouse_diplomacy.2002.a:0 "[vassal_heir_1.GetTitledFirstNameNoTooltip] có vẻ là một [vassal_heir_1.Custom('WomanManGirlBoy')] đáng trọng."
 councillor_spouse_diplomacy.2002.b:0 "[vassal_heir_2.GetTitledFirstNameNoTooltip] hẳn sẽ là một ảnh hưởng tốt!"
 councillor_spouse_diplomacy.2002.c:0 "Ta đã nghe nhiều điều tốt về [vassal_heir_3.GetTitledFirstNameNoTooltip]."
 councillor_spouse_diplomacy.2002.d:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('child_heir'))] của ta sẽ tự làm tốt việc của mình [child_heir.GetHerHis]."

 councillor_spouse_diplomacy.2003.t:1 "[councillor.GetCouncilTitle]: Cơ hội cho Hòa bình"
 councillor_spouse_diplomacy.2003.desc:0 "Ngay khi ta nhìn thấy [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival'))] [rival.GetTitledFirstName] của mình ở phía bên kia của [ROOT.Char.GetFaith.HouseOfWorship], ta bắt đầu quay lưng bỏ đi, nhưng thật ngạc nhiên là [councillor.GetTitledFirstName] lại vẫy [rival.Custom2('InsultNoun', ROOT.Char)] [councillor.Custom('quirk_pos_adverb')] về phía chúng ta.\n\n\"[rival.GetSheHe|U] đã đồng ý gặp ngươi trên vùng đất trung lập. Thật đáng tiếc khi hai [SCOPE.Custom('PersonalityGetSharedTraitDescriptionFromFlag')] [ROOT.Char.Custom2('WomenMenPeople', SCOPE.sC('rival'))] như ngươi lại đang thù hằn nhau. Ngươi không nghĩ rằng đã đến lúc làm hòa sao?\""
 councillor_spouse_diplomacy.2003.a:0 "Có lẽ ngươi nói đúng..."
 councillor_spouse_diplomacy.2003.b:0 "Ta sẽ làm hòa với khuôn mặt [rival.GetHerHis] của hắn!"
 councillor_spouse_diplomacy.2003.c:0 "Ngươi gọi [rival.GetHerHim] là [SCOPE.Custom('PersonalityGetSharedTraitDescriptionFromFlag')] ư?! Để ta vạch trần bản chất thật của [rival.GetHerHis]..."

 councillor_spouse_diplomacy.2004.t:1 "[councillor.GetCouncilTitle]: Yêu sách Tiện lợi"
 councillor_spouse_diplomacy.2004.desc:1 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] của ta, [councillor.GetTitledFirstName], hào hứng dẫn một [claimant.GetWomanMan] đến trước mặt ta.\n\n\"Thưa [ROOT.Char.GetTitleTierName], cho phép ta giới thiệu với ngài [claimant.GetTitledFirstName], người có yêu sách đối với [title_to_claim.GetName].\"\n\n[claimant.GetFirstName] cúi đầu trước ta và nói: \"Thật vinh hạnh, [claimant.Custom2('RelationToMeAddress', ROOT.Char)]. Đáng tiếc thay, [title_to_claim.GetNameNoTier] rất có thể sẽ mãi ngoài tầm với của ta nếu không có một... người bảo trợ đứng về phía ta.\""
 councillor_spouse_diplomacy.2004.a:0 "Có lẽ ta có thể giúp ngươi việc đó."
 councillor_spouse_diplomacy.2004.a.tt:0 "#F Khi [claimant.GetFirstNameNoTooltip] ở lại triều đình ta, ta có thể thúc đẩy yêu sách của [claimant.GetHerHis] khi thời cơ đến#!"
 councillor_spouse_diplomacy.2004.b:0 "Chúc ngươi may mắn."
 councillor_spouse_diplomacy.2004.c:0 "Ngục giam. Thư. Chim bồ câu gửi tới [current_holder.GetTitledFirstNameNoTooltip]. Theo đúng thứ tự đó."
 councillor_spouse_diplomacy.2004.c.tt:0 "#F Ta sẽ báo cho [current_holder.GetTitleTierName] rằng [claimant.GetFirstNameNoTooltip] không còn là mối đe dọa nữa.#!"
