 #Events
 councillor_spouse_learning.2601.t:1 "[councillor.GetCouncilTitle]: Giáo dục Nâng cao"
 councillor_spouse_learning.2601.not_scholarly.desc:0 ""Ngươi nên đọc sách nhiều hơn một chút," [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] của ta, [councillor.GetTitledFirstName] ham học, thường nói với ta như vậy. [councillor.GetSheHe|U] đã đề nghị làm gia sư cho ta, nếu ta cần chút trợ giúp để bắt đầu."
 councillor_spouse_learning.2601.scholarly.desc:0 "Mỗi khi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] của ta, [councillor.GetTitledFirstName], thấy ta cúi mình bên một cuốn sách, [councillor.GetSheHe] liền tỏ ra vô cùng hứng thú.\n\n"Ngươi có muốn ta giúp việc học của ngươi không? Có người trao đổi ý tưởng, hoặc vài cuốn sách mới chăng? Ta vừa có được một quyển phân tích rất hay về [ROOT.Char.Custom('education_conversation_subject')]!""
 councillor_spouse_learning.2601.a:0 "Được, ta rất cảm kích sự chỉ dẫn của ngươi."
 councillor_spouse_learning.2601.b:0 "[tutoring_student_1.GetTitledFirstNameNoTooltip] cần sự giúp đỡ của ngươi hơn ta."
 councillor_spouse_learning.2601.c:0 "Ngươi nên dạy dỗ [tutoring_student_2.GetTitledFirstNameNoTooltip] thì hơn."
 councillor_spouse_learning.2601.d:0 "Ngươi nên tập trung vào việc học của chính mình."
 councillor_spouse_learning_2601_tutoring_effect.critical_success:0 "Sự hiểu biết của [THIS.Char.GetTitledFirstNamePossessiveOrMyNoTooltip|U] về [THIS.Char.Custom('education_focus')] tăng lên rất nhiều"
 councillor_spouse_learning_2601_tutoring_effect.success:0 "Sự hiểu biết của [THIS.Char.GetTitledFirstNamePossessiveOrMyNoTooltip|U] về [THIS.Char.Custom('education_focus')] tăng lên"
 

 councillor_spouse_learning.2001.faith.t:1 "[councillor.GetCouncilTitle]: Những người bất đồng [councillor.GetFaith.GetAdjectiveNoTooltip]"
 councillor_spouse_learning.2001.culture.t:1 "[councillor.GetCouncilTitle]: Những người bất đồng [councillor.GetCulture.GetNameNoTooltip]"
 councillor_spouse_learning.2001.start.desc:0 "[faction_leader.GetTitledFirstName] và đồng bọn của [faction_leader.GetHerHis]"
 councillor_spouse_learning.2001.faith.desc:0 "[councillor.GetFaith.GetAdjectiveNoTooltip]"
 councillor_spouse_learning.2001.culture.desc:0 "[councillor.GetCulture.GetNameNoTooltip]"
 councillor_spouse_learning.2001.middle.desc:0 "trong phe phái [different_culture_or_faith_faction.GetName] không bao giờ để ta được yên!"
 councillor_spouse_learning.2001.independence_faction.desc:0 "Đáng lẽ họ phải là thần dân trung thành, vậy mà ta biết họ đang âm mưu chống lại ta."
 councillor_spouse_learning.2001.liberty_faction.desc:0 "Chúng tìm cách làm suy yếu quyền lực của ta ở mọi cơ hội."
 councillor_spouse_learning.2001.claimant_faction.desc:0 "Những kẻ trộm vô sỉ ấy muốn cướp lấy vùng đất vốn thuộc về ta."
 councillor_spouse_learning.2001.end.desc:0 "\n\nMay thay, với tư cách là "một trong số họ", [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] của ta, [councillor.GetTitledFirstName], có ảnh hưởng nhất định với họ. [councillor.GetSheHe|U] đề nghị đứng ra hòa giải và muốn biết ta muốn xử lý thế nào."
 councillor_spouse_learning.2001.a.faith:0 "Xoa dịu các thành viên phe [councillor.GetFaith.GetAdjectiveNoTooltip]."
 councillor_spouse_learning.2001.a.culture:0 "Xoa dịu các thành viên phe [councillor.GetCulture.GetNameNoTooltip]."
 councillor_spouse_learning.2001.a.faction_members_faith:0 "Mọi thành viên [councillor.GetFaith.GetAdjective] của phe [different_culture_or_faith_faction.GetName]"
 councillor_spouse_learning.2001.a.faction_members_culture:0 "Mọi thành viên [councillor.GetCulture.GetName] của phe [different_culture_or_faith_faction.GetName]"
 councillor_spouse_learning.2001.b:0 "Khiến [faction_member_1.GetTitledFirstNameNoTooltip] rời khỏi phe."
 councillor_spouse_learning.2001.c:0 "Thuyết phục [faction_member_2.GetTitledFirstNameNoTooltip] tiếp tục trung thành với ta."

 councillor_spouse_learning.2301.t:1 "[councillor.GetCouncilTitle]: Một Quyền năng Cao hơn"
 councillor_spouse_learning.2301.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] của ta, [councillor.GetTitledFirstName], đã trở thành một nhân vật nổi tiếng trong giới tôn giáo. Sự bảo trợ của [councillor.GetHerHis|U] đối với các học giả [councillor.GetFaith.GetAdjectiveNoTooltip], các [councillor.GetFaith.HouseOfWorshipPlural], và các giáo đoàn thậm chí còn thu hút sự chú ý của [religious_head.GetTitledFirstName] [religious_head.GetHerselfHimself].\n\nLòng biết ơn của [religious_head.GetTitleAsNamePossessiveNoTooltip] mang lại nhiều lợi ích lớn lao. [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] của ta đề nghị thay mặt ta liên hệ với [religious_head.GetHerHim]."
 councillor_spouse_learning.2301.a:0 "Ngươi có thể giới thiệu ta chứ?"
 councillor_spouse_learning.2301.a.success:0 "Ta đã kết giao với [religious_head.GetTitledFirstName]."
 councillor_spouse_learning.2301.b:0 "Vậy [religious_head.GetSheHe] có thể làm gì cho chúng ta?"
 councillor_spouse_learning.2301.c:0 "Đây là cơ hội để ta được đón nhận trở lại cộng đồng thiêng liêng!"
 councillor_spouse_learning.2301.d:0 "Hãy nói với [religious_head.GetHerHim] — mọi điều chúng ta làm đều vì [councillor.GetFaith.HighGodName]."

 councillor_spouse_learning.2602.t:1 "[councillor.GetCouncilTitle]: Mở rộng Chân trời"
 councillor_spouse_learning.2602.not_root.desc:0 "Trong khi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('student'))] [student.GetTitledFirstName] của ta chắc chắn biết một hoặc hai điều về [student.Custom('highest_skill_noun')], [councillor.GetTitledFirstName] nghĩ đã đến lúc [student.GetHerHim] mở rộng chân trời [student.GetHerHis] của mình.\n\n\"Ta có thể tìm kiếm vài cuốn sách mới, chuẩn bị một vài bài tập, kèm cặp [student.GetHerHim] một chút. Ngươi nghĩ chủ đề nào sẽ giúp ích nhiều nhất cho [student.GetFirstNameNoTooltip]?\""
 councillor_spouse_learning.2602.root.desc:0 "\"Trong khi ngươi biết một hoặc hai điều về [student.Custom('highest_skill_noun')], [student.GetTitleTierName] của [student.GetPrimaryTitle.GetNameNoTierNoTooltip] nên sở hữu một loạt các kỹ năng rộng hơn,\" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] của ta nói, [ROOT.Char.Custom2('QuirkPPPosOrNeg', SCOPE.sC('councillor'))].\n\n\"Ta có thể tìm kiếm vài cuốn sách mới, chuẩn bị một vài bài tập, kèm cặp ngươi một chút. Ngươi quan tâm nhất đến chủ đề nào?\""
 councillor_spouse_learning.2602.a:0 "Ngoại giao."
 councillor_spouse_learning.2602.b:0 "Lý luận quân sự."
 councillor_spouse_learning.2602.c:0 "Kinh tế lãnh địa."
 councillor_spouse_learning.2602.d:0 "Quản lý mạng lưới gián điệp."
 councillor_spouse_learning.2602.e:0 "Thần học."

 councillor_spouse_learning.1304.desc:0 "Phối Ngẫu Bảo Trợ Cho Các [religious_vassal.GetFaith.AltPriestTermPlural]"
 councillor_spouse_learning.1305.desc:0 "Lòng Sùng Đạo Của Phối Ngẫu Gây Ấn Tượng Với [religious_head.GetTitleAsNameNoTooltip]"



 councillor_spouse_learning.2603.t:1 "[councillor.GetCouncilTitle]: Đảm nhiệm Công việc"
 councillor_spouse_learning.2603.desc:0 "Một số cố vấn của ta cho rằng họ xứng đáng với chức vị chỉ vì huyết thống hoặc ảnh hưởng — thật sai lầm! Ta cần kết quả, vậy mà thường chỉ nhận lấy thất vọng.\n\nSau một ngày dài, ta đang than phiền với [councillor.GetFirstName] thì [councillor.GetSheHe] ngắt lời ta. "Hãy để ta xử lý việc này, [ROOT.Char.GetWifeHusband]. Vài bài học có lẽ sẽ giúp họ sáng trí hơn.""
 councillor_spouse_learning.2603.a:0 "[chancellor.GetCouncilTitle|U] [chancellor.GetFirstNameNoTooltip] cần một gia sư."
 councillor_spouse_learning.2603.b:0 "[marshal.GetCouncilTitle|U] [marshal.GetFirstNameNoTooltip] sẽ hưởng lợi từ sự giúp đỡ của ngươi."
 councillor_spouse_learning.2603.c:0 "Hãy dạy dỗ [steward.GetCouncilTitle] của ta, [steward.GetFirstNameNoTooltip]."
 councillor_spouse_learning.2603.d:0 "Có lẽ ngươi nên cho [spymaster.GetCouncilTitle] [spymaster.GetFirstNameNoTooltip] vài lời khuyên."
 councillor_spouse_learning.2603.e:0 "[court_chaplain.GetCouncilTitle] [court_chaplain.GetFirstNameNoTooltip] cần được chỉ dẫn."
 councillor_spouse_learning.2603.f:0 "Ở lại đây với ta thì hơn..."
 
