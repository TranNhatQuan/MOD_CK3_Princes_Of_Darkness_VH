 councillor_spouse_martial.1001.t:1 "[councillor.GetCouncilTitle]: Ngày Giải đấu"
 councillor_spouse_martial.1001.desc:2 "Mặt trời tỏa sáng khi đám nông dân tụ tập quanh hội tỷ võ do [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] của ta tổ chức. Tất cả $knight_culture_player_plural_no_tooltip_lowercase$ của ta reo hò khi [councillor.GetTitledFirstName] tuyên bố giải đấu được tổ chức để tôn vinh họ, và lần này ta chỉ cần ngồi xem.\n\nNhưng ta sẽ không dành cả ngày hội bị giam trên ngai vàng!"
 councillor_spouse_martial.1001.a:2 "Ta cũng hò reo cùng các $knight_culture_player_plural_no_tooltip_lowercase$ của ta!"
 councillor_spouse_martial.1001.commanders:2 "Mỗi $knight_culture_player_no_tooltip_lowercase$"
 councillor_spouse_martial.1001.b:0 "Đây là cơ hội hoàn hảo để chỉ bảo [child.GetFirstNameNoTooltip] vài điều!"
 councillor_spouse_martial.1001.b.education_tt:0 "Ta thúc đẩy nền giáo dục quân sự của [child.GetFirstNamePossessiveNoTooltip]"
 councillor_spouse_martial.1001.c:0 "Ngày hôm nay là để tôn vinh #EMP chúng ta#!, ái khanh!"
 
 councillor_spouse_martial.1002.t:1 "[councillor.GetCouncilTitle]: Hành động thay mặt ta"
 councillor_spouse_martial.1002.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] của ta dành một lượng thời gian đáng kể để đi khắp lãnh địa cùng với đội cận vệ [councillor.GetHerHis] của mình. Có rất nhiều vấn đề [councillor.GetSheHe] có thể giải quyết thay mặt ta, và sự hiện diện quân sự [councillor.GetTitledFirstName] mang đến cùng với [councillor.GetHerHim] là một lời nhắc nhở vững chắc về quyền cai trị của ta."
 councillor_spouse_martial.1002.a:0 "[councillor.GetTitleAsNameNoTooltip] của ta và ta luôn sẵn sàng bảo vệ vương quốc!"
 councillor_spouse_martial.1002.b:0 "Hãy đảm bảo thần dân quỳ lạy đúng mực, ái khanh."
 councillor_spouse_martial.1002.c:0 "Tất cả phải vừa sợ hãi ta vừa tôn thờ dưới chân ta, [councillor.GetFirstNameNoTooltip]!"

 councillor_spouse_martial.1003.t:1 "[councillor.GetCouncilTitle]: Một Vấn đề Danh dự"
 councillor_spouse_martial.1003.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] của ta [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('councillor'))]. Điều [councillor.GetSheHe] muốn nói là cuộc xung đột giữa [attacker_vassal.GetTitledFirstName] và [defender_vassal.GetTitledFirstName].\n\n"Cuộc chiến của họ không có danh dự, và đang làm ô danh lãnh địa của ngài. Hãy để ta xử lý họ. Ta tin mình có thể ép họ lập hòa.""
 councillor_spouse_martial.1003.a:0 "Hãy giải quyết việc này, bất kể giá nào."
 councillor_spouse_martial.1003.b:0 "Không, ta muốn xem ai chiến thắng!"
 councillor_spouse_martial.1003.b.tt:0 "[attacker_vassal.GetFirstNameNoTooltip] và [defender_vassal.GetFirstNameNoTooltip] tiếp tục cuộc chiến của họ"
 councillor_spouse_martial.1003.c:0 "Ồ, ta tin ngươi làm được, ái khanh."
 councillor_spouse_martial.1003.c.unlock_tt:0 "Tùy chọn này khả dụng nhờ tài năng chiến lược của [councillor.GetFirstNamePossessiveNoTooltip]"

 councillor_spouse_martial.1004.t:1 "[councillor.GetCouncilTitle]: Đội Cận vệ"
 councillor_spouse_martial.1004.desc:0 "Ta hơi khó hiểu khi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] của ta muốn tặng ta một "món quà lớn" tại sân trong. Nhưng ta nhanh chóng hiểu ra khi [councillor.GetTitledFirstName] ra lệnh cho một nhóm binh sĩ xếp hàng. "Một trung đoàn hoàn chỉnh, được tuyển từ chính lãnh địa của ta, sẵn sàng phục vụ ngài."\n\nĐây #EMP quả thật#! là món quà lớn!"
 councillor_spouse_martial.1004.a:0 "Thêm binh sĩ để tăng cường quân đội!"
 councillor_spouse_martial.1004.b:0 "Họ sẽ làm đội cận vệ riêng của ta."

 councillor_spouse_martial.1005.t:1 "[councillor.GetCouncilTitle]: Để lại Ấn tượng"
 councillor_spouse_martial.1005.desc:0 "[vassal.GetTitledFirstName] sẽ đến [capital.GetNameNoTier] để dâng cống phẩm cho ta. Tuy nhiên, [councillor.GetTitledFirstName] cho rằng một màn phô diễn quân sự sẽ đảm bảo lòng trung thành lâu dài.\n\n"Nhìn thấy sức mạnh áp đảo của ngài sẽ khiến bất kỳ ai phải suy nghĩ lại nếu từng nảy sinh ý định phản bội," [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] của ta nói."
 councillor_spouse_martial.1005.a:0 "Đúng vậy, [vassal.GetFirstNameNoTooltip] sẽ thấy binh lính ở khắp nơi [vassal.GetSheHe] nhìn!"
 councillor_spouse_martial.1005.a.tt:1 "[vassal.GetFirstNameNoTooltip] trở nên dễ bị ảnh hưởng bởi [dread|E] hơn"
 councillor_spouse_martial.1005.b:0 "Một cuộc diễu binh thông thường là đủ."
