 councillor_spouse_stewardship.1011.desc.corruption:0 "Kiểm Soát Người Thu Thuế"

 councillor_spouse_stewardship.2001.t:1 "[councillor.GetCouncilTitle]: Câu hỏi về Đầu tư"
 councillor_spouse_stewardship.2001.desc:0 "Nhờ sự quản lý tài chính gia đình đầy tận tụy của [councillor.GetTitledFirstNamePossessive], số vàng còn lại vào cuối mùa này nhiều hơn dự tính.\n\n"Chúng ta nên sử dụng nó thế nào cho tốt nhất, [ROOT.Char.GetWifeHusband]?""
 councillor_spouse_stewardship.2001.a:0 "Tổ chức một bữa tiệc thịnh soạn để mọi người cùng vui!"
 councillor_spouse_stewardship_2001_every_powerful_vassal:0 "Mọi Chư Hầu Quyền Lực"
 councillor_spouse_stewardship.2001.b:0 "Đầu tư số tiền này vào địa phương."
 councillor_spouse_stewardship.2001.c:0 "Nếu tiền có thể mua được thứ gì, thì đó là tai mắt!"
 councillor_spouse_stewardship.2001.d:0 "Tạm thời hãy giữ lại."

 councillor_spouse_stewardship.2002.t:1 "[councillor.GetCouncilTitle]: Cơ hội Lấp lánh"
 councillor_spouse_stewardship.2002.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U].\" [courtier_lender.GetTitledFirstName] lê bước tới chỗ ta và mỉm cười [courtier_lender.Custom('quirk_pos_adverb')]. \"Ta đã được [councillor.GetTitledFirstName] tiếp cận, người với trí tuệ [councillor.GetHerHis] của mình đã đề xuất một sự sắp xếp giữa hai chúng ta. Vì ngài có thể cần hỗ trợ tài chính, và ta có thể cần một chút hỗ trợ xã hội...\""
 councillor_spouse_stewardship.2002.a:0 "Ta hứa sẽ hoàn trả."
 councillor_spouse_stewardship.2002.money_loan_tooltip:0 "Ta sẽ vay [gold_i] #bold [THIS.Var('amount_to_loan').GetValue]#! vàng từ [courtier_lender.GetFirstNameNoTooltip]."
 councillor_spouse_stewardship.2002.b:0 "Sao ngươi không quyên góp nó cho [ROOT.Char.GetFaith.HouseOfWorship]?"
 councillor_spouse_stewardship.2002.c:0 "Ngươi nên đem nó bố thí cho người nghèo."
 councillor_spouse_stewardship.2002.d:0 "Ta gladly nhận cống phẩm này!"

 councillor_spouse_stewardship.2003.t:1 "[councillor.GetCouncilTitle]: Cơ hội Thương mại"
 councillor_spouse_stewardship.2003.desc:0 "[councillor.GetTitledFirstName] tiếp cận ta với ba cuộn giấy da trên tay [councillor.GetHerHis] của mình.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ta đã soạn thảo các đề xuất thương mại cho các nhà cai trị láng giềng. Ta chắc chắn rằng một thỏa thuận có thể đạt được mà sẽ mang lại lợi ích cho cả hai bên!\""
 councillor_spouse_stewardship.2003.a:0 "[ruler_1.GetTitledFirstNameNoTooltip] có vẻ hợp lý."
 councillor_spouse_stewardship.2003.b:0 "Ký thỏa thuận với [ruler_2.GetTitledFirstNameNoTooltip]."
 councillor_spouse_stewardship.2003.c:0 "Hãy giao thương với [ruler_3.GetTitledFirstNameNoTooltip]."
 councillor_spouse_stewardship.2003.d_greedy:0 "Không ai trong số họ xứng đáng với vàng của ta!"
 councillor_spouse_stewardship.2003.d_arrogant:0 "Không ai trong số họ xứng đáng ký thỏa thuận với #EMP ta#!!"
 councillor_spouse_stewardship.2003.d:0 "Không ai đưa ra cơ hội đủ hấp dẫn..."

 councillor_spouse_stewardship.2004.t:1 "[councillor.GetCouncilTitle]: Một Bàn tay Giúp đỡ"
 councillor_spouse_stewardship.2004.desc:0 "\"[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('on_my_hook'))] của ngài, [on_my_hook.GetTitledFirstName], gần đây đã tự đẩy [on_my_hook.GetHerselfHimself] vào một chút rắc rối.\"\n\n[councillor.GetTitledFirstName] mỉm cười [councillor.Custom('quirk_pos_adverb')] khi [councillor.GetSheHe] tiếp tục, \"Ta đã đảm bảo tình huống đó tự giải quyết, và đề cập đến ngài như là người ân nhân.\""
 councillor_spouse_stewardship.2004.a:0 "Làm tốt lắm!"
 councillor_spouse_stewardship.2004.b:0 "Việc tốt không cần báo đáp."

 councillor_spouse_stewardship.2005.t:1 "[councillor.GetCouncilTitle]: Đầu tư vào [county_to_boost.GetNameNoTierNoTooltip]"
 councillor_spouse_stewardship.2005.desc:1 ""[ROOT.Char.GetLadyLord|U] của ta. Ta nhận thấy có một cơ hội hiếm có để đầu tư vào [county_to_boost.GetName]."\n\n[councillor.Custom('WifeHusband')] của ta, [councillor.GetFirstName], trình bày chi tiết về khoản đầu tư này, và quả thật nếu thành công thì [county_to_boost.GetNameNoTierNoTooltip] sẽ được hưởng lợi rất lớn."
 councillor_spouse_stewardship.2005.a:0 "Đây là rủi ro đáng để thử!"
 councillor_spouse_stewardship.2005.a_1:0 "Thỏa thuận mang lại lợi nhuận lớn cho [county_to_boost.GetNameNoTierNoTooltip]"
 councillor_spouse_stewardship.2005.a_2:0 "Thỏa thuận thất bại"
 councillor_spouse_stewardship.2005.b:0 "Hãy để cơ hội này cho người dân [county_to_boost.GetNameNoTierNoTooltip]."
 councillor_spouse_stewardship.2005.c:0 "Những chuyện địa phương này không đáng để ta bận tâm!"
