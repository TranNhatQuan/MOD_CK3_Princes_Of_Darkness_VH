l_english:
 spymaster_task.0311.t:0 "Một Bí Mật Bị Phát Hiện"
 spymaster_task.0311.councillor_liege_opening:0 "Trong khi thực hiện các nhiệm vụ [councillor.GetHerHis] của mình với tư cách là [councillor.GetCouncilTitle] của ta, [councillor.GetTitledFirstName] đã phát hiện ra một bí mật được nắm giữ bởi [secret_holder.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]."
 spymaster_task.0311.spymaster_opening:0 "Trong khi điều tra cho [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor_liege'))] của ta, [councillor_liege.GetTitledFirstName], ta đã phát hiện một bí mật do [secret_holder.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] che giấu."
 spymaster_task.0311.notification:0 "[councillor.GetCouncilTitle]: Phát Hiện Bí Mật"
 
 spymaster_task.0341.t:0 "Gián Điệp: Lệch Lạc"
 spymaster_task.0311.secret_deviant.shared:0 "\n\nTa không thể tin nổi những cách ghê tởm mà [secret_holder.GetSheHe] tìm kiếm khoái lạc. Chỉ cần nghĩ đến thôi cũng khiến bất kỳ [secret_holder.GetWomanMan] tử tế nào kinh tởm, vậy mà [secret_holder.GetSheHe] lại sẵn lòng... thậm chí còn háo hức!"
 spymaster_task.0311.secret_deviant:1 "\n\nNhững cách mà [secret_holder.GetSheHe] tìm kiếm khoái lạc khiến bất kỳ [secret_holder.GetWomanMan] tử tế nào cũng phải ghê tởm khi nghĩ đến, vậy mà [secret_holder.GetSheHe] không chỉ sẵn lòng mà còn háo hức! Thật dị dạng và bệnh hoạn. Không — nó #emphasis là#! dị dạng và bệnh hoạn; một sự xúc phạm đối với [ROOT.Char.GetFaith.HighGodName]!"
 spymaster_task.0341.a:0 "Kẻ hầu! Mau mang cho ta cái xô trước khi ta— #EMP *nôn*#!"
 spymaster_task.0341.a.deviant:0 "Kể lại lần nữa. Càng chi tiết càng tốt..."
 spymaster_task.0341.a.detached:0 "Thật ghê tởm, nhưng hữu ích để biết."

 spymaster_task.0342.t:0 "Gián Điệp: Đồng Tính"
 spymaster_task.0311.sodomy.accepted:1 "\n\n[secret_holder.GetSheHe|U] tận hưởng sự đồng hành thân mật của những [secret_holder.GetWomenMen] khác. Những [secret_holder.GetFaith.GetAdherentNamePlural] đồng nghiệp [secret_holder.GetHerHis|U] của ngài coi đây là một tội lỗi nghiêm trọng, và mặc dù điều đó chẳng có ý nghĩa gì, nó có thể mang lại cho ta đòn bẩy mà ta cần..."
 spymaster_task.0311.secret_sodomy.illegal_shared:0 "\n\n[secret_holder.GetSheHe|U] thích sự thân mật với những [secret_holder.GetWomenMen] khác. Khác với ta, tuy nhiên, [secret_holder.GetFirstName] đã không che giấu đủ tốt những tội lỗi của [secret_holder.GetHerHis]."
 spymaster_task.0311.secret_sodomy.illegal:0 "\n\n[secret_holder.GetSheHe|U] đã tận hưởng sự thân mật với những [secret_holder.GetWomenMen] khác. Thật ngu xuẩn khi nghĩ rằng tội lỗi chống lại [ROOT.Char.GetFaith.HighGodName] như vậy sẽ không bị phát hiện..."
 spymaster_task.0342.a:0 "Ngươi sẽ phải hối hận vì đã chiều theo dục vọng của mình, [secret_holder.GetFirstNameNoTooltip]."

 spymaster_task.0343.t:0 "Gián Điệp: Mưu Sát Thất Bại"
 spymaster_task.0311.secret_murder_attempt.targeting_me:0 "\n\n[secret_holder.GetSheHe|U] chính là [secret_holder.GetWomanMan] đứng sau một âm mưu thất bại nhằm vào mạng sống của ta! Sự trả thù cuối cùng cũng sẽ đến hạn..."
 spymaster_task.0311.secret_murder_attempt.close_to_me:0 "\n\n[secret_holder.GetSheHe|U] chính là [secret_holder.GetWomanMan] đứng sau một âm mưu giết người thất bại nhằm vào [murder_target.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murder_target'))] của ta! Sự trả thù cuối cùng cũng sẽ đến hạn..."
 spymaster_task.0311.secret_murder_attempt.other:0 "\n\n[secret_holder.GetSheHe|U] chính là [secret_holder.GetWomanMan] đứng sau một âm mưu giết người thất bại nhằm vào [murder_target.GetTitledFirstName]!"
 spymaster_task.0343.a:0 "Không ngờ [secret_holder.GetFirstNameNoTooltip] lại có thể hạ mình thấp hèn đến vậy."
 spymaster_task.0343.murder_back:0 "Thấy chưa, hành động của ta hoàn toàn chính đáng."

 spymaster_task.0344.t:0 "Gián Điệp: Ám Sát"
 spymaster_task.0311.secret_murder.sadistic:0 "\n\nCó vẻ như [secret_holder.GetSheHe|U] đứng sau cái chết bất ngờ của [murder_target.GetTitledFirstName]."
 spymaster_task.0311.secret_murder.callous:0 "\n\n[secret_holder.GetSheHe|U] đã âm mưu và tính kế để sát hại [murder_target.GetTitledFirstName]! Thế giới này không có chỗ cho một kẻ yếu đuối và hèn nhát như [secret_holder.GetHerHim]."
 spymaster_task.0311.secret_murder.close_to_me.vengeful:2 "\n\n[secret_holder.GetSheHe|U] chính là kẻ sát nhân đứng sau cái chết của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murder_target'))] của ta, [murder_target.GetTitledFirstName]! [secret_holder.GetFirstName] phải trả giá bằng mạng sống của [secret_holder.GetHerHis], và mọi thứ mà [secret_holder.GetHerHim] trân quý!"
 spymaster_task.0311.secret_murder.close_to_me:1 "\n\nSự thật cuối cùng cũng được phơi bày trước mắt ta. [secret_holder.GetSheHe|U] chính là [secret_holder.GetWomanMan] đã âm mưu giết [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murder_target'))] của ta, [murder_target.GetTitledFirstName]."
 spymaster_task.0311.secret_murder.close_to_me_regret:0 "Phải chăng mọi thứ đã có thể tránh được, nếu ta biết sớm hơn?"
 spymaster_task.0311.secret_murder.other:0 "\n\n[secret_holder.GetSheHe|U] đã âm mưu trong bóng tối để sát hại [murder_target.GetTitledFirstName]!"
 spymaster_task.0344.a.sadistic:0 "Hừm. Liệu ta có thể nghĩ ra một sự trừng phạt đủ khủng khiếp không?"
 spymaster_task.0344.a.callous:0 "Ta không nên để chó dại chạy rông."
 spymaster_task.0344.a:0 "Không chỉ tàn nhẫn và vô tâm, mà còn vô danh dự!"
 spymaster_task.0344.b:0 "Ta hoàn toàn có lý. Không ai có thể phán xét ta."

 spymaster_task.0345.t:0 "Gián Điệp: Ăn Thịt Người"
 spymaster_task.0311.secret_cannibal.shared:0 "\n\n[secret_holder.GetSheHe|U] dường như rất biết hưởng thụ những thú vui tinh tế của đời sống. Một chén [ROOT.Char.Custom('RegionalDrink')] chẳng hạn, cùng một miếng thịt đỏ mềm."
 spymaster_task.0311.secret_cannibal:0 "\n\nTrong tất cả những điều đê tiện, [secret_holder.GetSheHe] đã thỏa mãn cơn đói [secret_holder.GetHerHis] của mình bằng thịt người! Liệu còn có điều gì bệnh hoạn và điên rồ hơn thế?!"
 spymaster_task.0345.a.cannibal:0 "Ta hy vọng một ngày nào đó [secret_holder.GetSheHe] sẽ mời ta dự tiệc."
 spymaster_task.0345.a:0 "Ôi nhân loại ghê tởm, ngươi sẽ không bao giờ thôi khiến ta kinh tởm sao?"

 spymaster_task.0346.t:0 "Gián Điệp: Tình Nhân"
 spymaster_task.0311.secret_lover.consort:0 "\n\nChính [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secret_holder'))] của ta lại đã nhận [lover.Custom2('MyCharacterIntroduction', ROOT.Char)] làm tình nhân!"
 spymaster_task.0311.secret_lover.consort_is_lover:0 "\n\n[secret_holder.GetSheHe|U] đã nhận [lover.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))] của ta, làm tình nhân của [secret_holder.GetHerHis]!"
 spymaster_task.0311.secret_lover.lover_close_to_me:1 "\n\n[secret_holder.GetSheHe|U] đã nhận [lover.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))] của ta, làm tình nhân. Không ai biết chuyện này bắt đầu thế nào, nhưng nếu bị lộ ra thì đó sẽ là nỗi ô nhục lớn cho cả hai!"
 spymaster_task.0311.secret_lover.lustful:0 "\n\n[secret_holder.GetSheHe|U] đã tham gia vào việc xác thịt với [lover.GetTitledFirstName], lướt những bàn tay [secret_holder.GetHerHis] của ngài trên cơ thể [lover.GetFirstNamePossessiveNoTooltip], khóa môi theo mọi kiểu... Ồ, thật là một vụ bê bối nếu điều này được công khai!"
 spymaster_task.0311.secret_lover:0 "\n\n[secret_holder.GetSheHe|U] đã bí mật nhận [lover.Custom2('MyCharacterIntroduction', ROOT.Char)] làm tình nhân."
 spymaster_task.0346.a.consort:0 "Thật là một sự sỉ nhục!"
 spymaster_task.0346.a.close:0 "Chuyện này rồi sẽ rắc rối đây."
 spymaster_task.0346.a:0 "Thông tin hữu ích..."

 spymaster_task.0347.t:0 "Gián Điệp: Kẻ Vô Tín"
 spymaster_task.0311.secret_non_believer.shared:0 "\n\nGiống như ta, [secret_holder.GetSheHe] có những nghi ngờ [secret_holder.GetHerHis] của ngài về sự tận tâm của ngài đối với [ROOT.Char.GetFaith.HighGodName]. Không giống như ta, [secret_holder.GetSheHe] không biết cách che giấu nó tốt như [secret_holder.GetSheHe] lẽ ra phải làm."
 spymaster_task.0311.secret_non_believer.other_faith:1 "\n\nCó vẻ [secret_holder.GetSheHe] đang bắt đầu nhận ra sự thật về vị thần giả dối [secret_holder.GetFaith.HighGodName]. Tất nhiên, những [secret_holder.GetFaith.GetAdherentNamePlural] đồng đạo của [secret_holder.GetHerHis] hẳn sẽ không khoan dung như ta."
 spymaster_task.0311.secret_non_believer.other_sect:0 "\n\nCó vẻ [secret_holder.GetSheHe] đang rời bỏ con đường [ROOT.Char.GetFaith.GetAdjective], để theo những giáo lý lầm lạc của [secret_holder.GetFaith.GetAdherentNamePlural]. [secret_holder.GetFaith.HighGodName] hẳn phải đau lòng khi thấy giáo huấn của [secret_holder.GetFaith.HighGodHerHis] bị bóp méo như vậy."
 spymaster_task.0311.secret_non_believer:0 "\n\n[secret_holder.GetSheHe|U] dường như đang mang nghi ngờ về giáo lý [secret_holder.GetFaith.GetAdjective]. Ôi [secret_holder.GetFirstNameNoTooltip]... Các [secret_holder.GetFaith.AltPriestTermPlural] sẽ nói gì đây?"
 spymaster_task.0347.a:0 "Dấu hiệu của một linh hồn yếu đuối."

 spymaster_task.0348.t:0 "Gián Điệp: Loạn Luân"
 spymaster_task.0311.secret_incest:0 "\n\n[secret_holder.GetSheHe|U] đã phạm một tội lỗi ghê tởm, một tội ác chống lại [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself]! Chỉ kẻ bệnh hoạn mới có thể quan hệ xác thịt với người thân cận của mình."
 spymaster_task.0311.secret_incest.shared:0 "\n\nTrong khi ta thấy rõ ràng rằng tình yêu không có giới hạn, thế giới sẽ phản ứng với sự kinh hoàng và lên án những cách thức mà [secret_holder.GetFirstNameNoTooltip] đã đón nhận khao khát [secret_holder.GetHerHis] của ngài..."
 spymaster_task.0348.a.shared:0 "Mọi chuyện vốn phải như vậy."
 spymaster_task.0348.a.lustful:0 "Chính gia đình của mình...? Ôi, ta không nên nghĩ tới điều đó. #EMP Không nên#!..."
 spymaster_task.0348.a:0 "Ta phải lên án sự kết hợp vô đạo này!"

 spymaster_task.0349.t:0 "Gián Điệp: Phù Thủy"
 spymaster_task.0311.secret_witch.shared:0 "\n\nCó vẻ [secret_holder.GetSheHe] cũng đang tìm kiếm câu trả lời vượt ngoài giới hạn của thế giới này. Ôi những điều mà [secret_holder.GetSheHe] hẳn đã thấy... Giá như chúng ta có thể công khai tri thức ấy."
 spymaster_task.0311.secret_witch.zealous:0 "\n\nCó bằng chứng cho thấy [secret_holder.GetSheHe] có thể đang tham gia các nghi lễ bí mật, hẳn là để giao tiếp với tà linh! [secret_holder.GetSheHe|U] thậm chí có thể nhảy múa trần truồng cùng lũ quỷ quyến rũ, ánh lửa lập lòe vuốt ve cơ thể họ khi họ..."
 spymaster_task.0311.secret_witch.zealous_end:0 "Thật là một ý nghĩ ghê tởm!"
 spymaster_task.0311.secret_witch:0 "\n\nCó bằng chứng cho thấy [secret_holder.GetSheHe] đang tham gia các nghi lễ bí mật. Còn lý do nào khác cho việc đó ngoài việc giao tiếp với tà linh, thậm chí cấu kết với ác quỷ?!"
 spymaster_task.0349.a.zealous:0 "Ta không được để những ảo tưởng mê hoặc ấy quyến rũ mình!"
 spymaster_task.0349.a:0 "Điều ác nào mà [secret_holder.GetSheHe] đang lên kế hoạch đây?"

 spymaster_task.0350.t:0 "Gián Điệp: Con Hoang"
 spymaster_task.0311.secret_bastard.i_am_real_father:1 "\n\nKhông chỉ [bastard.GetTitledFirstName] thực chất là con hoang, mà... ta mới chính là cha thật của [bastard.GetHerHis]!"
 spymaster_task.0311.secret_bastard.i_am_not_father:1 "\n\n[bastard.GetTitledFirstName] không phải con ruột của ta, mà là [bastard.Custom('DaughterSon')] của [secret_holder.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 spymaster_task.0311.secret_bastard.i_am_not_real_father:0 "\n\n[bastard.GetTitledFirstName] không phải con ruột của ta, mà là [bastard.Custom('DaughterSon')] của [actual_father.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 spymaster_task.0311.secret_bastard.father_is_interesting:1 "\n\n[bastard.GetTitledFirstName] thực chất là con hoang của [mother.GetTitledFirstName] và [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actual_father'))] của ta, [actual_father.GetTitledFirstName]!"
 spymaster_task.0311.secret_bastard:1 "\n\n[bastard.GetTitledFirstName] thực chất là con hoang của [mother.GetTitledFirstName] và [actual_father.GetTitledFirstName]!"
 spymaster_task.0350.a.related:0 "Sao ngươi có thể giấu ta chuyện này, [mother.GetFirstNameNoTooltip]?"
 spymaster_task.0350.a:0 "Không thể tin nổi!"

 spymaster_task.0353.t: "Gián Điệp: Tín Đồ Bí Mật - [secret_holder.GetSecretFaith.GetAdherentNameNoTooltip]"
 spymaster_task.0311.secret_crypto_religionist.cynical_uncompassionate: "\n\nVậy ra, [secret_holder.GetSheHe] vẫn thực hành [secret_holder.GetSecretFaith.GetName] trong bí mật. Thật ngu ngốc khi [secret_holder.GetHerHim] bám lấy thần tượng [secret_holder.GetHerHis] của ngài ngay cả khi đối mặt với cái chết! Liệu những kẻ ngu ngốc này có bao giờ học được không?"
 spymaster_task.0311.secret_crypto_religionist.cynical_compassionate: "\n\nCó vẻ [secret_holder.GetSheHe] vẫn bí mật thực hành [secret_holder.GetSecretFaith.GetName]. Thật lạ khi thấy ai đó bám víu vào một đức tin thay vì đức tin khác. Chẳng lẽ họ không thấy điều đó nguy hiểm thế nào sao?"
 spymaster_task.0311.secret_crypto_religionist.shared_secret: "\n\nCó vẻ như [secret_holder.GetSheHe] phải che giấu niềm tin [secret_holder.GetHerHis] của ngài vào [secret_holder.GetSecretFaith.GetName] khỏi ánh nhìn công chúng, giống như ta che giấu [root_crypto_faith.GetName] của ta. Tuy nhiên, tại sao [secret_holder.GetSheHe] lại thờ phụng đức tin giả mạo [secret_holder.GetHerHis] của ngài với rủi ro của chính mình vẫn sẽ là một bí ẩn."
 spymaster_task.0311.secret_crypto_religionist.shared_faith: "\n\nVậy ra [secret_holder.GetSheHe] là đồng đạo [ROOT.Char.GetFaith.GetAdherentName] của ta, nhưng là một kẻ vô đạo che giấu niềm tin [secret_holder.GetHerHis] của ngài trong bóng tối. [ROOT.Char.GetFaith.HighGodName] sẽ nói gì về sự thiếu đức tin như vậy?"
 spymaster_task.0311.secret_crypto_religionist.shared_faith_taqiya: "\n\nVậy ra [secret_holder.GetSheHe] là đồng đạo [root_crypto_faith.GetAdherentName] của ta. Không sai khi [secret_holder.GetHerHim] thực hành trong bóng tối, nhưng ta tự hỏi liệu những [secret_holder.GetFaith.GetAdherentNamePlural] đồng nghiệp của ngài có nghĩ như vậy không?"
 spymaster_task.0311.secret_crypto_religionist.shared_faith_shared_secret: "\n\nCó vẻ cả hai chúng ta đều phải hành đạo [secret_holder.GetSecretFaith.GetName] trong bóng tối. Ta tự hỏi giờ nên làm gì với thông tin này?"
 spymaster_task.0311.secret_crypto_religionist: "\n\nBan ngày [secret_holder.GetSheHe|U] là một [secret_holder.GetFaith.GetAdherentName], nhưng khi màn đêm buông xuống lại bí mật thực hành [secret_holder.GetSecretFaith.GetName]. Ôi, ta có thể làm bao điều với thông tin này..."
 spymaster_task.0353.a.shared_faith_shared_secret: "Hàng ngũ của chúng ta đang lớn mạnh."
 spymaster_task.0353.a.cynical: "Sự ngu ngốc [secret_holder.GetHerHis] của ngài chính là lợi ích của ta."
 spymaster_task.0353.a: "Các [secret_holder.GetFaith.AltPriestTermPlural] sẽ không tha thứ cho chuyện này."

 spymaster_task.0359.t:0 "Gián Điệp: Một Phát Hiện"
 spymaster_task.0359.a:0 "Thật thú vị..."

 spymaster_task.0381.opening:0 "[councillor.Custom2('AppropriateGreetingPositive', SCOPE.sC('councillor_liege'))]"
 spymaster_task.0381.desc_your_court:1 "Trong quá trình điều tra, ta đã không tìm thấy bất kỳ bí mật nào mà [character_to_hook.Custom2('YourCharacterIntroduction', target_character)] có thể đang che giấu."
 spymaster_task.0381.desc_other_court:1 "Trong quá trình điều tra [target_character.GetTitledFirstName], [character_to_hook.Custom2('HerHisCharacterIntroduction', target_character)] có vẻ là người có khả năng che giấu một sự thật đen tối nhất. Đáng tiếc thay, dù ta đào sâu đến đâu, [character_to_hook.GetTitleAsNameNoTooltip] trông đầy đáng ngờ kia dường như chẳng hề che giấu điều gì."
 spymaster_task.0381.desc:2 "\n\nTuy nhiên, sự thật không nhất thiết phải cản trở nhiệm vụ trước mắt. Chúng ta có thể sắp đặt để [character_to_hook.GetFirstNameNoTooltip] mang một bí mật — thứ chắc chắn sẽ hủy hoại [character_to_hook.GetHerHim] nếu bị phơi bày."
 spymaster_task.0381.a:0 "Hãy làm như vậy."
 spymaster_task.0381.a.truth_is_relative_unlock:0 "Tùy chọn này khả dụng vì ta có đặc quyền [GetPerk('truth_is_relative_perk').GetName(GetPlayer)]"
 spymaster_task.0381.b:0 "Không có lý do gì chúng ta không thể trở thành bằng hữu."
 spymaster_task.0381.b.flavor:0 "Miễn là [character_to_hook.GetSheHe] biết rằng ta hoàn toàn có thể trở thành kẻ thù của [character_to_hook.GetHerHis]"

 spymaster_task.0399.opening:0 "[councillor.Custom2('AppropriateGreeting', SCOPE.sC('councillor_liege'))]"
 spymaster_task.0399.desc:1 "Dù đã nỗ lực hết sức, các mật thám của ta vẫn chưa phát hiện ra bất kỳ bí mật nào"
 spymaster_task.0399.home_court:0 "tại triều đình này."
 spymaster_task.0399.other_court:0 "tại triều đình của [target_character.GetTitledFirstNamePossessive]."
 spymaster_task.0399.nothing_to_find:1 "\n\nTa e rằng chúng ta sẽ chẳng bao giờ tìm thấy gì cả. Nơi này còn tĩnh lặng hơn nghĩa địa giữa trưa."
 spymaster_task.0399.something_here:0 "\n\nTuy vậy, ta vẫn tin rằng có điều gì đó đang diễn ra trong bóng tối. Ta chỉ cần thêm chút thời gian để xác định nó là gì."
 spymaster_task.0399.a.recommended:0 "Được thôi, ngươi hiểu rõ nhất."
 spymaster_task.0399.a.counter:0 "Không, đừng phí thêm thời gian nữa."
 spymaster_task.0399.a.tt:0 "[councillor.GetCouncilTitle] [councillor.GetFirstNameNoTooltip] chuyển nhiệm vụ sang [GetCouncilTaskType('task_disrupt_schemes').GetName|V]"
 spymaster_task.0399.b.recommended:0 "Nếu thật sự có #EMP bất cứ thứ gì#!, chúng ta sẽ tìm ra."
 spymaster_task.0399.b.counter:0 "Ta không chắc đâu. Hãy tiếp tục!"
 spymaster_task.0399.b.tt:0 "[councillor.GetCouncilTitle] [councillor.GetFirstNameNoTooltip] tiếp tục nhiệm vụ [GetCouncilTaskType('task_find_secrets').GetName|V]"

 spymaster_task.1001.t:0 "Một "Tai Nạn""
 spymaster_task.1001.desc:0 "Lời xin lỗi [councillor.GetTitledFirstNamePossessive] #EMP nghe#! có vẻ chân thành, nhưng sai lầm này dường như gần như quá nực cười để có thể là thật.\n\n\"Ngài thấy đó, chúa công của tôi,\" [councillor.GetCouncilTitle] của ta giải thích, \"đơn giản chỉ là vấn đề gửi nhầm thư với nhầm người đưa tin.\" [councillor.GetSheHe|U] nín thở [councillor.GetHerHis]. \"Vì vậy, đó là cách các tài liệu buộc tội bị mất.\""
 spymaster_task.1001.a:0 "Đồ [councillor.Custom2('InsultNoun', ROOT.Char)] ngu xuẩn!"
 spymaster_task.1001.b:0 "Ai cũng mắc sai lầm, [councillor.GetFirstNameNoTooltip]."
 spymaster_task.1001.a.tt:1 "Một người trong lãnh địa của ngươi đã biết một trong những [secrets|E] của ngươi.\n\n"
 spymaster.1001.notification:0 "Tài Liệu Bí Mật Bị Thất Lạc"

 spymaster_task.1002.greeting:1 "Gửi tới người nhận..."
 spymaster_task.1002.desc:0 "Ta đã đính kèm các tài liệu buộc tội. Ta nhắc lại rằng ngươi không được nói chuyện này với bất kỳ ai. Ngay cả bệ hạ của ta, [councillor_liege.GetTitledFirstName], cũng không biết chúng tồn tại, và chuyện này phải tiếp tục như vậy."
 spymaster_task.1002.a:0 "Ta không nghĩ mình đáng lẽ phải nhận được thứ này..."
 spymaster_task.1002.a.tt:1 "#F ...nhưng ai lại từ chối món quà từ một [councillor.GetCouncilTitle] chứ?#!"
 spymaster_task.1003.a.tt:1 "Một người trong lãnh địa của ngươi đã biết một trong những [secrets|E] của [courtier.GetTitledFirstNamePossessiveNoTooltip].\n\n"
 spymaster_task.1003.notification:0 "Thư Bí Mật Bị Thất Lạc"

 spymaster_task.1101.desc_opening:0 "Ta đã phát hiện một âm mưu hiểm độc của [owner.GetTitledFirstName]"
 spymaster_task.1101.murder:0 "nhằm ám sát ngươi!"
 spymaster_task.1101.abduct:0 "nhằm bắt cóc ngươi!"
 spymaster_task.1101.spy_on:0 "nhằm khám phá mọi bí mật của ngươi!"
 spymaster_task.1101.fallback:0 "chống lại ngươi!"
 spymaster_task.1101.ending:0 "\n\nCác đặc vụ [owner.GetHerHis|U] của ngài đang bị vây bắt khi ta viết những dòng này, nhưng mặc dù [owner.GetFirstName] đã bị ngăn chặn lúc này, [owner.GetSheHe] vẫn là một mối đe dọa đối với tương lai.\nTrừ khi chúng ta hành động, đó là..."
 spymaster_task.1101.a:0 "Thế giới này có lẽ không đủ chỗ cho cả hai chúng ta."
 spymaster_task.1101.exposure_tt:0 "Âm mưu đã bị phơi bày"

 spymaster_task.2001.t:0 "Những Cáo Buộc Trống Rỗng"
 spymaster_task.2001.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] của ta đã đưa một [ROOT.Char.Custom('DefaultPriestTitle')], [accused_priest.GetFirstName], ra trước sự tiết lộ và phán xét của một âm mưu lớn. Tuy nhiên, khi [ROOT.Char.Custom('DefaultPriestTitle')] từ chối thú nhận, [councillor.GetTitledFirstName] hoàn toàn không có bằng chứng hay sự hỗ trợ nào cho những lời buộc tội [councillor.GetHerHis] của ngài."
 spymaster_task.2001.a:0 "Làm ơn đừng khiến ta mất mặt nữa, [councillor.GetFirstNameNoTooltip]."
 spymaster_task.2001.b:0 "[ROOT.Char.Custom('DefaultPriestTitle')] hẳn phải phạm #EMP tội gì đó#!."
 spymaster_task.2001.c: "Ngươi nên gia nhập triều đình của ta, [accused_priest.GetFirstNameNoTooltip]."
 spymaster_task.2002.notification:0 "Tiếng Xấu Mưu Mô"

 spymaster_task.2003.t:0 "Âm Mưu Tan Vỡ"
 spymaster_task.2003.desc:0 "[councillor.GetCouncilTitle] của ta tiến đến trước mặt ta tại triều đình với vẻ mặt trang trọng khác thường. "[ROOT.Char.Custom('FormOfAddressForLiege')|U], ngài có từng nghĩ rằng âm mưu trong bóng tối có lẽ không phải cách tốt nhất để đạt được điều mình muốn không?" Một lời nhận xét bất ngờ, nhưng rồi [councillor.GetTitledFirstName] cũng nói vào trọng tâm.\n\n"Có vẻ như... à, mọi mật thám trong kế hoạch [scheme.GetName] đều đã ngừng trả lời thư của ta. Cứ như thể chẳng có chuyện gì từng xảy ra.""
 spymaster_task.2003.a:0 "Ngươi đã hoàn toàn mất kiểm soát rồi sao?"

 spymaster_task.2102.t:0 "Tri Thức Ẩn Giấu"
 spymaster_task.2102.desc:0 "Duy trì một mạng lưới gián điệp khắp lãnh địa thay mặt [councillor_liege.GetTitledFirstName] cũng có những lợi ích riêng. Ta thường phát hiện những điều mà ta thậm chí không hề tìm kiếm. Chẳng hạn như bằng chứng về bí mật của [secret_owner.GetTitledFirstNamePossessive]..."
 spymaster_task.2102.a:0 "[councillor_liege.GetFirstNameNoTooltip] hẳn sẽ muốn biết điều này."
 spymaster_task.2102.b:0 "Tin đồn cũ đó sao? [councillor_liege.GetTitleTierName] chắc cũng muốn nghe."
 spymaster_task.2102.c:0 "Không cần phải chia sẻ chuyện này."
 spymaster_task.2102.c.tt:1 "Ngươi nên cẩn thận với việc bệ hạ có thể nghĩ rằng ngươi đang che giấu điều gì đó khỏi [councillor_liege.GetHerHim]"
 spymaster_task.2103.notification:0 "[councillor.GetCouncilTitle] Phát Hiện Bí Mật"
 
 spymaster_task.3001.opening:0 "[target_character.Custom2('AppropriateGreeting', ROOT.Char)]"
 spymaster_task.3001.desc:0 "Giờ đây đã quá rõ ràng rằng [councillor.GetCouncilTitle] của ngươi, [councillor.GetTitledFirstName], đã cài gián điệp tại triều đình của ta. Ta không biết họ đang tìm kiếm điều gì, vì ta và gia nhân của ta chẳng có gì phải che giấu, nhưng ta cầu xin ngươi hãy khiến họ dừng lại."
 spymaster_task.3001.a:0 "Ngươi chỉ tưởng tượng ra thôi!"
 spymaster_task.3001.continue_snooping:0 "[councillor.GetFirstNameNoTooltip] tiếp tục do thám"
 spymaster_task.3001.b:0 "Chỉ là hiểu lầm đáng tiếc. Chuyện này kết thúc tại đây."

 spymaster_task.3002.t:0 "Gián Điệp Trong Triều"
 spymaster_task.3002.opening:0 "Những thông điệp bí mật được truyền đi trong các lời thì thầm tại triều đình, và rõ ràng rằng các mật thám của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor_liege'))] đang đào bới bí mật."
 spymaster_task.3002.end:0 "Tuy nhiên khi ta đối chất với [councillor_liege.GetTitledFirstName], [councillor_liege.GetSheHe] lại phủ nhận mọi thứ!"
 spymaster_task.3002.a:0 "[councillor_liege.GetSheHe] đang âm mưu điều gì đây?"

 spymaster_task.3003.end:1 "May thay, [councillor_liege.GetTitledFirstName] đã hứa rằng mọi mưu toan của [councillor_liege.GetHerHis] [councillor.GetCouncilTitle] sẽ chấm dứt ngay lập tức."
 spymaster_task.3003.a:0 "Nhưng tại sao họ lại ở đây ngay từ đầu?"
 
 spymaster_task.3004.desc:0 "Ngươi không thật sự nghĩ rằng các mật thám của [councillor.GetCouncilTitle] của ngươi sẽ không bị phát hiện mãi tại triều đình của ta chứ? Ta yêu cầu ngươi chấm dứt hành vi khiêu khích này ngay lập tức!"
 spymaster_task.3004.a:0 "Ngươi hẳn đang tưởng tượng ra thôi..."
 spymaster_task.3004.b:0 "Chỉ là một sai lầm nhỏ, bệ hạ, vậy thôi!"

 spymaster_task.3005.opening:0 "Ta đã phát hiện các mật thám tại triều đình của mình, rõ ràng là làm việc cho [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor_liege'))] của ta, [councillor_liege.GetTitledFirstName]!"
 spymaster_task.3005.end:0 "\n\nTuy nhiên khi ta yêu cầu rút họ đi, [councillor_liege.GetTitleTierName] lại phủ nhận mọi chuyện!"
 spymaster_task.3005.a:0 "Tên phản trắc vô lễ!"

 spymaster_task.3006.end:0 "\n\nKhi được lệnh rút họ đi, [councillor_liege.GetTitleTierName] đã đồng ý, nhưng ta vẫn nên đề phòng..."
 spymaster_task.3006.a:0 "Những lời thì thầm đen tối luôn báo trước hành động đen tối."

 spymaster_task.3007.desc:0 "Gián điệp đào bới bí mật đã quấy rối triều đình của ta, và thật bất ngờ khi ta phát hiện chúng đang phục vụ cho [councillor.GetCouncilTitle] của ngươi! Hãy chấm dứt trò hề này ngay lập tức!"
 spymaster_task.3007.a:0 "Ta không biết gì về gián điệp nào cả, [target_character.GetFirstNameNoTooltip]."
 spymaster_task.3007.b:0 "Ồ, có lẽ họ chỉ bị lạc đường trên đường về nhà thôi!"

 spymaster_task.3009.end:0 "Khi được yêu cầu rút họ đi, [councillor_liege.GetTitleTierName] đã đồng ý, nhưng ta vẫn phải đề phòng..."
