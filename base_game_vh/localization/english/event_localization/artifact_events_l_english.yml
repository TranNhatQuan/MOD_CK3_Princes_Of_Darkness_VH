l_english:
 # Debug
  test_artifact_name:0 "[ROOT.Char.GetTitledFirstNamePossessiveNoTooltip] Artifact"
  test_artifact_desc:0 "Cổ vật này được khắc huy hiệu gia tộc [ROOT.Char.GetDynasty.GetName]."
  debug_test_artifact_cloth_option:0 "Thật mềm! Thật mịn!"
 
 # Notification localization
  artifact_lost_toast:0 "Mất Cổ Vật"
  artifact_lost_in_siege:0 "[SAISE_artifact.GetName] đã bị [SAISE_attacker.GetShortUINameNoTooltip] đánh cắp trong cuộc vây hãm [SAISE_location.GetNameNoTooltip]"
  artifact_lost_in_raid:0 "[SAISE_artifact.GetName] đã bị [SAISE_attacker.GetShortUINameNoTooltip] đánh cắp trong cuộc cướp phá của [SAISE_attacker.GetHerHis] tại [SAISE_location.GetNameNoTooltip]"
  artifact_seized_toast:0 "Chiếm Được Cổ Vật"
  artifact_seized_in_siege:0 "Ta đã chiếm được [SAISE_artifact.GetName] sau cuộc vây hãm [SAISE_location.GetNameNoTooltip]"
  artifact_seized_in_raid:0 "Ta đã chiếm được [SAISE_artifact.GetName] trong cuộc cướp phá của mình tại [SAISE_location.GetNameNoTooltip]"
  artifact_damaged_toast:0 "Cổ Vật Bị Hư Hại"
  artifact_damaged_in_siege:0 "[DAIBE_artifact.GetName] của ta chịu [DAIBE_artifact.MakeScope.Var('DAIBE_damage').GetValue|V0] sát hại trong cuộc vây hãm [DAIBE_location.GetNameNoTooltip]"
  artifact_damaged_in_duel:0 "[DAIBE_artifact.GetName] của ta chịu [DAIBE_artifact.MakeScope.Var('DAIBE_damage').GetValue|V0] sát hại trong trận đấu tay đôi với [DAIBE_opponent.GetShortUINameNoTooltip]"
  artifact_claim_gained_notification:0 "Nhận Yêu Sách Cổ Vật"
  artifact_claim_lost_notification:0 "Mất Yêu Sách Cổ Vật"

 # Event localization
  artifact.0011.t:1 "[this_artifact.Custom('InventoryCourtArtifact')] Bị Mất!"
  artifact.0011.tooltip:0 "Ngài đã mất [this_artifact.GetName] vào tay [owner.GetTitledFirstNameNoTooltip]"
  artifact.0012.t_1: "Nhận Được Cổ Vật!"
  artifact.0012.t: "Nhận Được Các Cổ Vật!"
  artifact.0012.tooltip:0 "Ngài đã lấy được [this_artifact.GetName] từ [old_owner.GetTitledFirstNameNoTooltip]"
  msg_artifact_gained_acquired_desc_1: "Ngài đã nhận được [PlayerMessageItem.GetRightArtifact.GetName]"
  msg_artifact_gained_acquired_desc_2: "Ngài đã nhận được [PlayerMessageItem.GetRightArtifact.GetName] và [PlayerMessageItem.GetLeftArtifact.GetName]"
  msg_artifact_gained_acquired_desc: "Ngài đã nhận được [PlayerMessageItem.GetRightArtifact.GetName], [PlayerMessageItem.GetLeftArtifact.GetName], và $msg_artifact_gained_desc_others$"
  msg_artifact_gained_desc_others: "#tooltip:message_consolidation_names #L thêm#!#!"
  artifact.0021.t:1 "[this_artifact.Custom('InventoryCourtArtifact')] Bị Phá Hủy!"

  artifact.1001.t:0 "Tro Về Tro, Rỉ Sét Về...?"
  artifact.1001.desc.antiquarian:1 "Người quản cổ vật của ta, [antiquarian.GetTitledFirstName], tiến đến chỗ ta, cầm [this_artifact.GetName] trong tay [antiquarian.GetHerHis]."
  artifact.1001.desc.servant:2 "Một trong những người hầu của ta tiến đến, cầm [this_artifact.GetName] trong tay [dummy_servant_gender.GetHerHis]."
  artifact.1001.desc.weapon:0 "\n\n\"Thưa bệ hạ, khi Ta đang dọn dẹp kho vũ khí thì nhận thấy [SCOPE.Custom('ThisArtifactType')] này đã rỉ sét gần như chẳng còn gì. Chúng ta nên làm gì với nó?\"\n\nTa xem xét [SCOPE.Custom('ThisArtifactType')] đó. Dù không thể rèn lại để dùng trong chiến trận, nhưng vẫn có thể làm sạch và bảo tồn nó để trưng bày với chi phí không quá lớn."
  artifact.1001.desc.other:0 "\n\n\"Thưa bệ hạ, khi Ta đang dọn dẹp kho chứa thì nhận thấy [SCOPE.Custom('ThisArtifactType')] này đã quá cũ đến mức gần như vỡ vụn! Chúng ta nên làm gì với nó?\"\n\nTa xem xét [SCOPE.Custom('ThisArtifactType')] đó. Dù không thể sửa chữa để dùng lại được nữa, nhưng vẫn có thể làm sạch và bảo tồn nó để trưng bày với chi phí không quá lớn."
  artifact.1001.a:0 "Đây là một việc đáng làm."
  artifact.1001.a.tt.free:0 "#instruction [artifact|E] này có thể được chuyển đổi miễn phí!#!"
  artifact.1001.a.tt:1 "[this_artifact.GetName] được chuyển đổi thành một [court_artifact|E] chỉ mang lại [grandeur|E] và [prestige|E]"
  artifact.1001.b:0 "Không, quá tốn kém."

  manhunter:0 "#EMP \"Thợ Săn Người\"#!"
  heartseeker:0 "#EMP \"Kẻ Tìm Tim\"#!"

  artifact.1001.desc.kills_none:0 "[this_artifact.GetDesc]\n\nChưa từng được dùng trong chiến đấu, vũ khí này chỉ đơn thuần là vật trang trí treo trên tường của một quý tộc trẻ."
  artifact.1001.desc.kills_one:0 "[this_artifact.GetDesc]\n\nĐã từng được dùng để hạ gục một kẻ địch trong trận chiến, vũ khí này đã chứng minh đủ giá trị để trưng bày trong đại sảnh của một vị quân chủ."
  artifact.1001.desc.kills_some:0 "[this_artifact.GetDesc]\n\nSau khi hạ gục [ROOT.Var('num_kills').GetValue|V0] kẻ thù trong chiến trận, vũ khí này đã giành được vị trí xứng đáng trong đại sảnh của một chiến binh vĩ đại hoặc vị quân chủ."
  artifact.1001.desc.kills_many:0 "[this_artifact.GetDesc]\n\nDù không còn thích hợp cho chiến đấu, [ROOT.Var('num_kills').GetValue|V0] sinh mạng mà vũ khí này đã cướp đi khiến nó trở thành biểu tượng của võ công, xứng đáng trưng bày trong đại sảnh của một chiến binh vĩ đại."
  artifact.1001.desc.kills_tons:0 "[this_artifact.GetDesc]\n\nDù không còn thích hợp cho chiến đấu, [ROOT.Var('num_kills').GetValue|V0] sinh mạng mà vũ khí này đã cướp đi đã biến nó thành biểu tượng huyền thoại của võ công, khiến mọi kẻ nhìn thấy đều cảm thấy kính sợ hoặc kinh hãi."

 #Degraded Artifact Events
  artifact.3000.t:0 "Cổ Vật Suy Tàn: Tái Sử Dụng"
  artifact.3000.desc.armorer_intro:0 "Quan võ $armorer_camp_officer$ của ta, [antiquarian.GetTitledFirstName], tiến đến với vẻ mặt lo lắng.\n\n\"Thưa [ROOT.GetCharacter.GetLadyLord], thần ngày càng lo ngại về [this_artifact.GetName] của ngài và tình trạng hư hỏng hoàn toàn mà nó đang gặp phải. Nó sắp rã rời ra rồi!\""
  artifact.3000.desc.antiquarian_intro:0 "Quan quản thư $antiquarian_court_position$ của ta, [antiquarian.GetTitledFirstName], tiến đến với vẻ mặt lo lắng.\n\n\"Thưa [ROOT.GetCharacter.GetLadyLord], thần ngày càng lo ngại về [this_artifact.GetName] của ngài và tình trạng hư hỏng hoàn toàn mà nó đang gặp phải. Nó sắp rã rời ra rồi!\""
  artifact.3000.desc.antiquarian:0 "\n\n\"Có lẽ đã quá muộn để phục hồi nó, nhưng chưa phải là mất hết. Nếu ngài cho phép, Ta có thể tháo rời nó thành những bộ phận hữu ích để dùng cho một cổ vật trong tương lai!\""
  artifact.3000.desc.servant_intro:1 "Một người hầu tiến đến với vẻ mặt tội lỗi và thứ gì đó giấu sau lưng.\n\n\"Thưa [ROOT.GetCharacter.GetLadyLord], trong lúc con lau chùi bộ sưu tập cổ vật như thường lệ, con đã nhận thấy tình trạng hư hỏng hoàn toàn của [this_artifact.GetName] của ngài.\""
  artifact.3000.desc.servant:0 "\"Không có chuyên gia trong triều đình thì có lẽ không thể phục hồi nó như trước, nhưng chúng ta vẫn có thể giữ lại các mảnh vụn để tái sử dụng cho một cổ vật mới...\""
  artifact.3000.a:0 "Thật đau lòng, nhưng cứ làm đi."
  artifact.3000.b:0 "Nó vẫn có thể cứu được!"
  artifact.3000.c:0 "Ta cá là #EMP ngươi#! đã làm hỏng nó!"
 
  artifact.3001.t:0 "Cảm Hứng: Tái Sử Dụng"
  artifact.3001.desc:0 "[inspiration_owner.GetFirstName] bước tới chỗ ta hôm nay với những bước chân đầy hứng khởi.\n\n\"Thưa [ROOT.GetCharacter.GetLadyLord]! Trong lúc tìm kiếm cảm hứng ở các nhà kho, thần đã tình cờ tìm thấy một kho báu bất ngờ giữa những món đồ bị loại bỏ và đồ lặt vặt hỏng hóc. Có vẻ như ngài đã để lại một số vật liệu thừa từ một cổ vật đã bị tháo dỡ trong kho để dùng cho tương lai... Chà, tương lai là đây!\n\nNếu thần dùng những bộ phận thừa này cho dự án của mình, chất lượng sẽ không bị ảnh hưởng, và thần có thể hoàn lại cho ngài một phần vàng mà ngài đã dành để mua vật liệu!\""
  artifact.3001.a:0 "Đây đúng là tin tuyệt vời!"

  artifact.3010.t:0 "Cổ Vật Suy Tàn: Bán"
  artifact.3010.desc.antiquarian:0 "\n\n\"Có lẽ một thương nhân phế liệu sẽ quan tâm đến việc mua những bộ phận này với giá hợp lý...\""
  artifact.3010.desc.servant:0 "\n\n\"Giờ thì nó hoàn toàn vô dụng và không thể nhận ra nữa! Ngài cũng có thể bán nó cho người thu mua phế liệu để đổi lấy vài đồng vàng...\""
  artifact.3010.a:0 "Được thôi, ta cũng chẳng cần nó nữa."
  artifact.3010.a.tt:0 "[this_artifact.GetNameNoTooltip|U] được bán cho thương nhân và mất vĩnh viễn."
  artifact.3010.b:0 "Cổ vật đó là #EMP CỦA TA!#!"

  artifact.3020.t:0 "Cổ Vật Suy Tàn: Chuyển Đổi"
  artifact.3020.desc:0 "\n\n\"Có thể nó sẽ không bao giờ lấy lại công dụng ban đầu, nhưng nếu ngài cho phép, Ta ít nhất có thể cứu lại một phần của nó làm kỷ vật của vinh quang xưa! Dù sao thì nó đã từng là biểu tượng mạnh mẽ cho quyền lực của ngài...\""
  artifact.3020.a:0 "Ít ra nó vẫn còn dùng được việc gì đó..."
  artifact.3020.b:0 "Cứ làm đúng việc của ngươi và sửa nó đi!"
  keepsake_trinket_name:0 "Kỷ Vật Từ [this_artifact.GetNameNoTooltip]"
  keepsake_trinket_description:0 "Một mảnh của [this_artifact.GetNameNoTooltip] đã mất, được [owner.GetHerHis] $antiquarian_court_position$ cứu lại cho [owner.GetTitledFirstNameNoTooltip] làm kỷ vật."

  artifact.3030.t:0 "Cổ Vật Suy Tàn: Bảo Tồn"
  artifact.3030.desc:0 "\n\n"Để cứu nó, Ta có một đề xuất. Gần đây Ta đã thắng được một cuộn giấy bụi bặm khi chơi xúc xắc với một kẻ đáng ngờ ở hội chợ lưu động – một vụ rất may mắn, vì nội dung của nó lại rất hợp với niềm hứng thú mới của Ta về giả kim thuật! Cuộn giấy cổ này mô tả một loại thuốc bí mật có thể khiến #EMP bất kỳ cổ vật nào#! trở nên tốt hơn cả lúc mới. Xin hãy để Ta thử!"" 
  artifact.3030.a:0 "Được thôi, cũng chẳng thể tệ hơn thế này..."
  artifact.3030.b:0 "Ngươi #EMP không#! được chạm vào nó bằng thứ hỗn hợp đó!"
  artifact.3030.a.bigsuccess:0 "Cổ vật sạch hơn và bền chắc hơn bao giờ hết"
  artifact.3030.a.bigsuccess.t:0 "Cổ Vật Được Khôi Phục Và Cải Thiện"
  artifact.3030.a.success:0 "Cổ vật được sửa chữa"
  artifact.3030.a.success.t:0 "Cổ Vật Được Sửa Chữa"
  artifact.3030.a.failure:0 "Phương pháp xử lý thất bại"
  artifact.3030.a.failure.t:0 "Phương Pháp Vô Dụng"
  artifact.3030.a.bigfailure:0 "Cổ vật bị phá hủy"
  artifact.3030.a.bigfailure.t:0 "Cổ Vật Bị Phá Hủy!"

  artifact.3040.t:0 "Cổ Vật Suy Tàn: Một Lời Đề Nghị"
  artifact.3040.desc.antiquarian:0 ""$antiquarian_court_position$ của ta, [antiquarian.GetTitledFirstName], tiến đến cùng với [vassal.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n"Thưa [ROOT.GetCharacter.GetLadyLord], Ta được biết rằng [this_artifact.GetName] của ngài đang ở trong tình trạng rất tệ... Dù đã cố gắng hết sức, Ta không thể làm gì hơn để bảo tồn nó nếu không có nguồn tài trợ thích hợp!\n\nTuy vậy, Ta đã tìm được một giải pháp giúp ngài không phải chi tiền. [vassal.GetTitledFirstNameNoTooltip|U] đã đề nghị gánh chi phí đổi lại một dấu hiệu nhỏ của lòng biết ơn từ ngài."" 
  artifact.3040.desc.no_antiquarian:0 "[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến đến với vẻ mặt hối lỗi giả tạo khiến ta đã lo sợ trước những lời tiếp theo của [vassal.GetHerHis].\n\n""Thưa [ROOT.GetCharacter.GetLadyLord], thật là #EMP đáng tiếc#! khi những báu vật quý giá như [this_artifact.GetName] của ngài lại bị bỏ quên và phủ đầy bụi! Xin hãy cho phép Ta trả chi phí để phục hồi nó – đổi lại một ân huệ nhỏ."" 
  artifact.3040.a:0 "Ta biết ngay là có điều kiện... Nhưng được thôi!"
  artifact.3040.b:0 "Vậy coi như huề."
  artifact.3040.c:0 "Ta không cần sự giúp đỡ của ngươi."
  artifact.3050.t:0 "Cổ Vật Suy Tàn!"
  artifact.3050.desc:0 "Một cổ vật chất lượng cao trong sở hữu của Ngài – [this_artifact.GetName] – đang tiến gần #N 0#! [durability|E] và có thể bị phá hủy!"
  artifact.4000.t:0 "Tin Đồn Bị Nguyền Rủa"
  artifact.4000.desc.antiquarian_intro:0 "$antiquarian_court_position$ [antiquarian.GetTitledFirstName] của ta đã trông rất lo âu trong vài ngày qua trước khi [antiquarian.GetSheHe] tiến đến chỗ ta.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], thần có tin buồn về một trong những vật sở hữu quý giá của ngài, [this_artifact.GetName]. Trong cung hiện đang lan truyền những lời đồn thổi về món đồ này, khách khứa và tùy tùng đều nhìn nó với vẻ sợ hãi và nghi hoặc... Họ tin rằng nó đã bị #EMP nguyền rủa#!. Theo như lời đồn,"
  artifact.4000.desc.servant_intro:0 "Trong vài ngày qua, ta nhận thấy gia đình mình rộn ràng tin đồn hơn thường lệ, dù mọi tiếng nói đều im bặt khi ta bước vào phòng.\n\nKhi cuối cùng ta bắt được một người hầu để hỏi, [dummy_servant_gender.GetHerHis] trả lời: "[ROOT.Char.Custom('FormOfAddressForLiege')|U], ngài không biết sao? Chính là [this_artifact.GetName] của ngài! Ai cũng biết nó bị #EMP nguyền rủa!#! Rõ ràng là"
  artifact.4000.desc.stolen:0 "không ai thực sự có thể sở hữu nó, vì số phận của nó là bị đánh cắp và gây ra xung đột vĩnh viễn!"
  artifact.4000.desc.assassinated:0 "nó mang lại tai họa lớn và cái chết bạo lực cho bất kỳ ai sở hữu!"
  artifact.4000.desc.ghost:0 "nó bị chiếm giữ bởi linh hồn phẫn nộ của người đã chết!"
  artifact.4000.desc.fallback:0 "nó thấm nhuần sức mạnh hiểm độc của [ROOT.Char.GetFaith.DevilName]!"
  artifact.4000.desc.end:0 "\n\n"Có lẽ sự can thiệp của một người thánh thiện có thể giúp mọi người yên tâm..."" 
  artifact.4000.cursed_name:1 "[this_artifact.GetNameNoTooltip] Bị Nguyền Rủa"
  artifact.4000.cursed_desc:1 "[this_artifact.GetDesc]\n\nCả quý tộc lẫn dân thường đều im lặng hoặc cầu xin sự bảo hộ thần thánh khi đứng trước món đồ này, thứ nổi tiếng là bị nguyền rủa."
  artifact.4000.a:0 "Hãy gọi người đó đến ngay!"
  artifact.4000.b:0 "Cứ để mọi người run sợ khi nhìn thấy nó!"
  artifact.4001.t:0 "Tin Đồn Bị Nguyền Rủa: Sự Can Thiệp Thánh Thiện"
  artifact.4001.desc.antiquarian_intro:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]," [ROOT.Char.Custom('GetAntiquarianOrArmorer')] của Ta, [antiquarian.GetTitledFirstName], xin được gặp Ta,"
  artifact.4001.desc.servant_intro:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]," một người hầu vội vã tiến đến gần Ta, đi cùng một nhân vật có vẻ trang nghiêm,"
  artifact.4001.desc:0 ""theo yêu cầu của ngài, chúng Ta đã tìm được một [holy_man.GetWomanMan] thánh thiện để ban phước cho [this_artifact.GetName] của ngài. \n\n"Xin cho Ta giới thiệu [holy_man.GetFirstName]. Ta tin rằng sự can thiệp của [holy_man.GetHerHis] sẽ xua tan lời nguyền và giúp mọi người yên tâm.""
  artifact.4001.a:0 "Hãy cố hết sức đi, [holy_man.GetFirstNameNoTooltip]..."
  artifact.4001.a.success:0 "Lời Nguyền Được Hóa Giải"
  artifact.4001.a.failure:0 "Lời Nguyền Vẫn Còn"
  artifact.4001.a.success.desc:0 "Lời nguyền đã được hóa giải"
  artifact.4001.a.failure.desc:0 "Lời nguyền vẫn còn"
  artifact.4002.t:0 "Tin Đồn Bị Nguyền Rủa: Danh Tiếng Hắc Ám"
  artifact.4002.desc.antiquarian_intro:0 "[ROOT.Char.Custom('GetAntiquarianOrArmorer')] của Ta, [antiquarian.GetTitledFirstName], nói chuyện với Ta với vẻ suy tư trên gương mặt [antiquarian.GetHerHis].""
  artifact.4002.desc.servant_intro:0 "Một nhóm người hầu sợ hãi chặn Ta lại khi Ta đang đi về phòng. Một người trong số họ lên tiếng:"
  artifact.4002.desc:0 "\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], hẳn ngài cũng biết rằng danh tiếng xấu xa của [this_artifact.GetName] như một món đồ bị nguyền rủa đã ngày càng lan rộng qua nhiều năm... Tùy tùng, người hầu, thậm chí cả khách của ngài đều bị nó làm cho kinh hãi!\n\nNgài có đồng ý gọi một người thánh thiện đến ban phước cho món đồ này để cuối cùng mang lại chút bình yên cho những thần dân đang sợ hãi của ngài không?"
  artifact.4010.t:0 "Vũ Khí Sát Phạt Lừng Danh"
  artifact.4010.desc.antiquarian_intro:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], ngài đã nghe tin chưa?" [ROOT.Char.Custom('GetAntiquarianOrArmorer')] của Ta, [antiquarian.GetTitledFirstName], tiến đến."
  artifact.4010.desc.servant_intro:0 "Ta không thể không nghe thấy những tiếng nói phấn khích phát ra từ một nhóm nhỏ người hầu trong đại sảnh."
  artifact.4010.desc:1 "\n\n"Danh tiếng của [ROOT.Char.GetTitledFirstNamePossessiveNoTooltip] [this_artifact.GetName] đang lan rộng khắp nơi và ngày càng lớn mạnh! Mọi người đều nói về [SCOPE.Custom('ThisArtifactType')] bất khả chiến bại có thể hạ gục kẻ thù dễ dàng như cắt hoa trên cánh đồng, cùng với chủ nhân vinh quang của nó!"" 
  artifact.4010.a:0 "Tin tuyệt vời!"
  artifact_killer_1_name:1 "[this_artifact.GetNameNoTooltip] [this_artifact.Custom('RandomWeaponTitle1')]"
  artifact_killer_2_name:1 "[this_artifact.Custom('RandomWeaponTitle2')] [this_artifact.GetNameNoTooltip]"
  artifact_killer_3_name:1 "[this_artifact.GetNameNoTooltip] [this_artifact.Custom('RandomWeaponTitle3')]"
  artifact_killer_4_name:1 "[this_artifact.Custom('RandomWeaponTitle4')] [this_artifact.GetNameNoTooltip]"
  artifact_killer_1_desc:0 "[this_artifact.GetDesc]\n\nĐã được sử dụng trong ít nhất 15 chiến thắng trên chiến trường, vũ khí này nổi danh vì thể hiện lòng dũng cảm thực sự của chủ nhân."
  artifact_killer_2_desc:0 "[this_artifact.GetDesc]\n\nĐã được sử dụng trong ít nhất 30 chiến thắng trên chiến trường, vũ khí này nổi danh vì mang lại đau đớn cho kẻ thù."
  artifact_killer_3_desc:0 "[this_artifact.GetDesc]\n\nĐã được sử dụng trong ít nhất 50 chiến thắng trên chiến trường, vũ khí này nổi danh vì luôn mang lại chiến thắng cho chủ nhân."
  artifact_killer_4_desc:0 "[this_artifact.GetDesc]\n\nĐã được sử dụng trong ít nhất 100 chiến thắng trên chiến trường, vũ khí này được nhắc đến trong các truyền thuyết."
  artifact.4020.t:0 "Bộ Giáp Lừng Danh"
  artifact.4020.desc:1 "\n\n"Ai cũng nhận ra [ROOT.Char.GetTitledFirstNamePossessiveNoTooltip] [this_artifact.GetName], thứ tỏa sáng trên chiến trường không giống bất kỳ món nào khác và khiến cả Ngài lẫn thù đều biết rằng một anh hùng bất tử đang bước đi giữa họ!"" 
  artifact.4020.a:0 "Tin tuyệt vời!"
  artifact_armor_1_name:1 "[this_artifact.Custom('RandomArmorTitle1')] [this_artifact.GetNameNoTooltip]"
  artifact_armor_2_name:1 "[this_artifact.GetNameNoTooltip] [this_artifact.Custom('RandomArmorTitle2')]"
  artifact_armor_3_name:1 "[this_artifact.Custom('RandomArmorTitle3')] [this_artifact.GetNameNoTooltip]"
  artifact_armor_4_name:1 "[this_artifact.GetNameNoTooltip] [this_artifact.Custom('RandomArmorTitle4')]"
  artifact_armor_1_desc:0 "[this_artifact.GetDesc]\n\nĐã bảo vệ chủ nhân an toàn qua ít nhất 15 trận chiến, bộ giáp này bắt đầu được nhận ra trên chiến trường."
  artifact_armor_2_desc:0 "[this_artifact.GetDesc]\n\nĐã bảo vệ chủ nhân an toàn qua ít nhất 30 trận chiến, bộ giáp này đang tạo dựng danh tiếng trên chiến trường."
  artifact_armor_3_desc:0 "[this_artifact.GetDesc]\n\nĐã bảo vệ chủ nhân an toàn qua ít nhất 50 trận chiến, bộ giáp này được cả Ngài lẫn thù nhận ra và khiếp sợ."
  artifact_armor_4_desc:0 "[this_artifact.GetDesc]\n\nĐã bảo vệ chủ nhân an toàn qua ít nhất 100 trận chiến, bộ giáp này được xem là một vật phẩm huyền thoại."
  artifact.4030.t:0 "Vương Miện Của Dân Tộc Chúng Ta"
  artifact.4030.desc.antiquarian_intro:0 ""[ROOT.Char.Custom('GetAntiquarianOrArmorer')] của Ta, [antiquarian.GetTitledFirstName], tiến đến với nụ cười lớn trên gương mặt [antiquarian.GetHerHis] và [this_artifact.GetName] của Ta trong tay [antiquarian.GetHerHis]."
  artifact.4030.desc.servant_intro:0 "Người hầu thường được giao nhiệm vụ lau dọn những báu vật quý giá nhất của Ta đến gặp Ta với [this_artifact.GetName] trong tay [dummy_servant_gender.GetHerHis]."
  artifact.4030.desc_emperor:1 "\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ngài có biết rằng sau nhiều thế hệ thuộc về [ROOT.Char.GetTitleTierName], chiếc vương miện này giờ đây thường được biết đến như biểu tượng của quyền lực Đế quốc không?"" 
  artifact.4030.desc_kingdom:1 "\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ngài có biết rằng sau nhiều thế hệ thuộc về [ROOT.Char.GetTitleAsNameNoTooltip], chiếc vương miện này giờ đây được xem là một phần không thể tách rời của bản sắc [primary_title_scope.GetBaseNameNoTierNoTooltip]?"" 
  artifact_emperors_crown_name:1 "Đế Miện [this_artifact.GetNameNoTooltip]"
  artifact_emperors_crown_desc:1 "[this_artifact.GetDesc]\n\nTrong nhiều thế hệ, chiếc vương miện này thuộc về các Hoàng đế, nhờ đó có thêm uy quyền."
  artifact_crown_special_name:1 "[this_artifact.GetNameNoTooltip] của [primary_title_scope.GetNameNoTierNoTooltip]"
  artifact_crown_special_desc:1 "[this_artifact.GetDesc]\n\nChiếc vương miện này đã được truyền qua nhiều thế hệ cai trị cùng một tước vị, trở thành biểu tượng quyền lực của họ."
  artifact.4040.t:0 "Con Mắt Của Chuyên Gia"
  artifact.4040.desc:0 "Với ánh nhìn lấp lánh trong mắt [helpful.GetHerHis] mà [helpful.Custom2('MyCharacterIntroduction', ROOT.Char)] tiến lại gần Ta.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], Ta không thể không nhận ra tay nghề chế tác tinh xảo của [this_artifact.GetName] của ngài... Tuy nhiên, chỉ một chuyên gia chiến trường thực thụ như Ta mới có thể nhận ra những điều chỉnh nhỏ có thể khiến nó trở thành một công cụ chiến tranh hiệu quả hơn nữa!"\n\nTa bắt đầu bỏ ngoài tai [helpful.GetHerHim] khi [helpful.GetSheHe] thao thao bất tuyệt về #EMP sự cân xứng#!, #EMP độ cân bằng#!, và #EMP độ mòn của lưỡi#!, nhưng Ta hiểu đại khái rằng [helpful.GetFirstNameNoTooltip] có thể cải thiện cổ vật của Ta để đổi lấy một #EMP món quà tượng trưng cho lòng biết ơn của Ta#!."
  artifact.4040.a:0 "Được thôi, cứ làm đi."
  artifact.4040.a.tt:0 "[this_artifact.GetName|U] được cải thiện!"
  artifact.4040.b:0 "Ta không cần sự giúp đỡ của ngươi."
  artifact.4050.t:0 "Cơn Bộc Phát Giận Dữ"
  artifact.4050.desc:0 "Sự căng thẳng đã chồng chất lên Ta như một đống gạch suốt một thời gian. Ta cảm thấy cơn nóng giận của mình đã dần tích tụ đến điểm sôi, chỉ chờ một cái cớ để bùng nổ dữ dội.\n\nMọi thứ sụp đổ khi Ta bước vào đại sảnh, những người hầu đang buôn chuyện, các cận thần thì nói huyên thuyên, các cố vấn tranh nhau sự chú ý của Ta cùng một lúc, và tất cả trở nên quá sức chịu đựng.\n\n"#EMP ĐỦ RỒI!#!" Ta hét lên trong khi chộp lấy thứ đầu tiên tay mình chạm vào và ném nó vào bức tường gần nhất.\n\nSự im lặng bao trùm căn phòng và, khi Ta thấy [this_artifact.GetName] của mình nằm hư hỏng trên sàn, cong vênh và gãy nát, Ta cảm thấy toàn bộ cơn giận tan biến, thay vào đó là cảm giác kinh hãi..."
  artifact.4050.a:0 "Chết tiệt!"
  artifact.4060.t:0 "[SCOPE.Custom('ThisArtifactType')|U] Được Ban Phước Của [ROOT.Char.GetFaith.HighGodName]"
  artifact.4060.desc:0 ""hãy để Ta giới thiệu với ngài [holy_man.GetFirstName], một [holy_man.GetWomanMan] có đức thánh cao cả nổi danh khắp lãnh thổ của ngài.\n\n"[holy_man.GetSheHe|U] vô cùng cảm động trước danh tiếng của ngài như một vị quân chủ mộ đạo và công chính, và mong muốn ban sự bảo hộ thiêng liêng cho một trong những bảo vật của ngài."\n\n"Ngài có cho phép không?""
  artifact.4060.a:0 "Ta khiêm nhường chấp nhận lời đề nghị của ngài, [holy_man.GetFirstNameNoTooltip]."
  artifact.4060.b:0 "Không cần thiết đâu."
  artifact_4060_blessed_artifact_name:1 "[this_artifact.GetNameNoTooltip] Được Ban Phước"
  artifact_4060_blessed_artifact_desc:0 "[this_artifact.GetDesc]\n\nTheo câu chuyện truyền thống, vật phẩm này đã được một người đàn ông hoặc phụ nữ thánh thiện ban phước, nhờ đó nhận được sự bảo hộ thiêng liêng. Người khôn ngoan không đùa giỡn với những điều siêu nhiên, dù họ có tin hay không."
  artifact.4070.t:0 "Thánh Tích Bị Ô Uế"
  artifact.4070.desc:0 "Giành lại quyền kiểm soát [this_artifact.GetName] quý giá của chúng ta từ tay bọn [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] chắc chắn đã khiến Ta có vị thế tốt hơn trong mắt [ROOT.Char.GetFaith.HighGodName]. Tuy vậy, một cảm giác bất an vẫn còn trong Ta, được nuôi dưỡng bởi nhiều lời bàn tán tại triều đình.\n\n#EMP "Bọn [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] đã làm ô uế thánh tích của chúng ta!" "Chúng đã đặt lời nguyền lên nó!" "Ai mà biết chúng đã dùng nó cho những nghi lễ bệnh hoạn nào!"#!\n\nCó lẽ họ đang phóng đại, nhưng Ta đoán rằng tổ chức một nghi lễ tôn giáo long trọng để "thanh tẩy" nó cũng chẳng có hại gì?"
  artifact.4070.a:0 "Hãy tổ chức ngay!"
  artifact.4070.b:0 "Không, họ chỉ mê tín thôi."
  artifact.4080.t:0 "Vũ Khí Của Bậc Đấu Sĩ Lão Luyện"
  artifact.4080.desc:0 "\n\n"Mọi người đều đang nói về [ROOT.Char.GetTitledFirstNamePossessiveNoTooltip] [this_artifact.GetName]! Nghe nói bất cứ ai cầm nó cũng không thể thua trong bất kỳ cuộc đấu tay đôi nào! Ta còn nghe rằng nó chỉ chọn những người xứng đáng nhất làm chủ! Và hôm trước Ta đã nói chuyện với một thương nhân lữ hành: danh tiếng của vũ khí bất khả chiến bại này đã lan tới cả quê hương của ông ta!""
  artifact_duel_weapon_1_name:1 "[this_artifact.Custom('RandomDuelTitle1')] [this_artifact.GetNameNoTooltip]"
  artifact_duel_weapon_2_name:1 "[this_artifact.GetNameNoTooltip] [this_artifact.Custom('RandomDuelTitle2')]"
  artifact_duel_weapon_3_name:1 "[this_artifact.Custom('RandomDuelTitle3')] [this_artifact.GetNameNoTooltip]"
  artifact_duel_weapon_4_name:1 "[this_artifact.GetNameNoTooltip] [this_artifact.Custom('RandomDuelTitle4')]"
  artifact_duel_weapon_1_desc:0 "[this_artifact.GetDesc]\n\nĐã đánh bại ít nhất 5 kẻ địch trong các cuộc đấu tay đôi, vũ khí này chứng tỏ mình đáng tin cậy và may mắn."
  artifact_duel_weapon_2_desc:0 "[this_artifact.GetDesc]\n\nĐã đánh bại ít nhất 10 kẻ địch trong các cuộc đấu tay đôi, vũ khí này bắt đầu có chút danh tiếng."
  artifact_duel_weapon_3_desc:0 "[this_artifact.GetDesc]\n\nĐã đánh bại ít nhất 20 kẻ địch trong các cuộc đấu tay đôi, vũ khí này đã có được danh tiếng đáng sợ."
  artifact_duel_weapon_4_desc:0 "[this_artifact.GetDesc]\n\nĐã đánh bại ít nhất 30 kẻ địch trong các cuộc đấu tay đôi, vũ khí này đã để lại một di sản huyền thoại."
 
  artifact.6001.t:0 "Quân Kỳ Của Kẻ Thù"
  artifact.6001.desc.commander:1 "Ta quan sát chiến trường, suy ngẫm về cách trận chiến này sẽ được ghi nhớ, và nhìn về những xác chết còn nằm lại. Ta nhận thấy một nhóm binh sĩ của mình tiến đến và họ kính cẩn cúi chào trước Ta.\n\n"
  artifact.6001.desc:0 "Trận chiến tại [combat_location.GetName] đã kết thúc với một chiến thắng vang dội! Ta chăm chú lắng nghe người đưa tin khi anh ta đọc bản báo cáo từ chỉ huy của Ta, [friendly_commander.GetTitledFirstName], rồi quay sang những người lính trước mặt.\n\n"
  artifact.6001.desc.looting:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Chúng Ta tìm thấy quân kỳ của kẻ thù khi đang... 'dọn dẹp' chiến trường! Chúng Ta nghĩ thật đáng tiếc nếu bỏ lại nó, có lẽ ngài muốn giữ nó làm chiến lợi phẩm?""
  artifact.6001.desc.killed_defender:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Chúng Ta đã dồn những kẻ địch còn lại vào góc khi chúng cố gắng chống cự anh dũng. Chúng đã hy sinh mạng sống để bảo vệ lá cờ này.""
  artifact.6001.a:0 "Nó sẽ là một bổ sung tuyệt vời cho bộ sưu tập của ta!"
  artifact.6001.b:0 "Hãy ném nó lên giàn lửa ăn mừng. Ta không cần thứ kỷ vật vô dụng này."
  artifact.6001.toast:0 "Quân Kỳ Bị Mất Tại [combat_location.GetNameNoTooltip]"
 
  artifact.7000.a.boil_skull:0 "[skull_boiler.GetFirstName] luộc chiếc sọ của [skull_to_boil.GetFirstNamePossessive], biến nó thành một [court_artifact|E]"
  artifact_rival_skull:0 "Chiếc sọ của [skull_to_boil.GetTitledFirstName], kẻ thù đã bị xử tử của [ROOT.Char.GetTitledFirstName]. Được luộc và làm sạch bởi [skull_boiler.GetFirstName]. Trên trán của nó khắc những dòng chữ: "[skull_to_boil.Custom2('InsultAdjective', ROOT.Char)|U] [skull_to_boil.Custom2('InsultNoun', ROOT.Char)]"."
  artifact.7000.t:0 "Kẻ Thù Là Mãi Mãi"
  artifact.7000.desc:0 "Ah, tạ ơn [ROOT.Char.GetFaith.HighGodName] vì [skull_to_boil.GetFirstName] đã chết, và còn bị xử tử theo chính mệnh lệnh của #EMP ta#! nữa!\n\nPhải thừa nhận rằng ta sẽ nhớ những tiếng rên rỉ thảm hại của [skull_to_boil.GetHerHis] trong ngục tối của ta... Có lẽ ta nên giữ lại một phần của [skull_to_boil.GetHerHim], để có thứ gì đó mà ta có thể ném lời sỉ nhục vào khi ngồi trên ngai vàng?\n\nDù sao thì [skull_boiler.GetFirstName] cũng đâu có làm việc gì quan trọng..."
  artifact.7000.a:0 "[skull_boiler.GetFirstNameNoTooltip], luộc và làm sạch chiếc sọ của [skull_to_boil.GetFirstNamePossessiveNoTooltip] cho ta. Ngay bây giờ."
  artifact.7000.b:0 "Không, ta #EMP nóng lòng#! muốn quên sạch sự tồn tại của [skull_to_boil.GetFirstNamePossessiveNoTooltip]!"


  artifact.4090.t:0 "Thánh Tích Trong Tay..."
  artifact.4090.desc.antiquarian:0 "Người Quản Thủ Cổ Vật của Ta [antiquarian.GetTitledFirstName] đã đến gặp Ta với một ý tưởng. Nếu niêm phong [that_artifact.GetName] của Ta vào bên trong chuôi của [this_artifact.GetName], Ta sẽ luôn ở gần [ROOT.Char.GetFaith.HighGodName] hơn mỗi khi sử dụng nó.\n\n"Ngài sẽ thực sự chạm vào một mảnh của [ROOT.Char.GetFaith.PositiveAfterLife] mỗi khi cầm [this_artifact.GetType] của mình." [antiquarian.GetTitledFirstNameNoTooltip] nói với ánh nhìn say mê tôn giáo tỏa sáng trong mắt [antiquarian.GetHerHis]."
  artifact.4090.desc:0 "Khi đang ngắm nhìn [that_artifact.GetName] của mình một ngày nọ, Ta bỗng nảy ra một ý tưởng. Nếu Ta gắn thánh tích này vào chuôi của [this_artifact.GetName], Ta sẽ luôn ở gần [ROOT.Char.GetFaith.HighGodName] hơn mỗi khi sử dụng nó."
  artifact.4090.a:0 "Ta sẽ luôn ở gần [ROOT.Char.GetFaith.HighGodName]."
  artifact.4090.b:0 "Điều đó không thích hợp."

  artifact.4090.a.tt:0 "Thánh Tích Và Vũ Khí Được Kết Hợp"

  artifact_weapon_relic_desc:0 "[this_artifact.GetDesc]\n\n[that_artifact.GetNameNoTooltip] một thánh tích của [ROOT.Char.GetFaith.GetName] được gắn vào bên trong chuôi."

  relic_weapon_name:0 "[this_artifact.GetType|U] của [ROOT.Char.Custom('artifact_relic_desc')]"

  embedded_not_destroyed_tooltip:0 "[that_artifact.GetName] được gắn vào bên trong [this_artifact.GetName] của Ta "

  relic_name_afterlife:0 "[ROOT.Char.GetFaith.PositiveAfterLife|U]"
  relic_name_highgod:0 "[ROOT.Char.GetFaith.HighGodName]"
  relic_name_highgod_alternate:0 "[ROOT.Char.GetFaith.HighGodNameAlternate]"
