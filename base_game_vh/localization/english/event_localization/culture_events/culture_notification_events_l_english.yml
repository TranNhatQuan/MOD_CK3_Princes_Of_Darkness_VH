l_english:
 culture_notification.0010.t:0 "Từ Bỏ Truyền Thống"
 culture_notification.0010.desc:2 "[culture|E] [this_player.GetCulture.GetName] đã từ bỏ [tradition|E] [tradition.GetName]"
 culture_notification.0011.t:1 "Đón Nhận Truyền Thống"
 culture_notification.0011.desc:2 "[culture|E] [this_player.GetCulture.GetName] đã đón nhận [tradition|E] [tradition.GetName]"


 culture_notification.1001.t:0 "Văn Hóa Lai: [new_culture.GetNameNoTooltip|V]"
 culture_notification.1001.desc:0 "[founder.GetTitledFirstName] đã hình thành [hybrid_culture|E] [new_culture.GetName|V] từ hai nền văn hóa [parent_1.GetName] và [parent_2.GetName]"

 culture_notification.1011.t:0 "Sự Lai Hóa [new_culture.GetNameNoTooltip]"
 culture_notification.1011.intro:1 "Được thúc đẩy bởi quan hệ tốt đẹp và sự giao lưu văn hóa ngày càng gia tăng, người [parent_1.GetName] và [parent_2.GetName] qua nhiều năm đã trở nên ngày càng gắn bó. Giờ đây, nhiều cá nhân trong hai xã hội này bắt đầu xem mình không còn chỉ thuộc về một bên hay bên kia, mà là cả hai cùng lúc — một nền văn hóa mới mang tên [new_culture.GetName].\n\n"
 culture_notification.1011.hybrid_primary_1:1 "Truyền thống và giá trị của [parent_1.GetNameNoTooltip] tạo thành nền tảng cho nền văn hóa mới này, trong khi nhiều đặc điểm của [parent_2.GetNameNoTooltip] đã được tiếp thu và hòa nhập để đáp ứng nhu cầu của xã hội mới."
 culture_notification.1011.hybrid_primary_2:1 "Truyền thống và giá trị của [parent_2.GetNameNoTooltip] tạo thành nền tảng cho nền văn hóa mới này, trong khi nhiều đặc điểm của [parent_1.GetNameNoTooltip] đã được tiếp thu và hòa nhập để đáp ứng nhu cầu của xã hội mới."
 culture_notification.1011.hybrid_no_primary:1 "Người [new_culture.GetNameNoTooltip] đã tiếp nhận các yếu tố từ cả hai nền văn hóa một cách cân bằng, hình thành nên một nền văn hóa lai thực thụ, hòa quyện các yếu tố của cả hai thế giới."
 culture_notification.1011.outro.other:0 "$culture_notification.1111.outro.other$"
 culture_notification.1011.outro.founder:0 "$culture_notification.1111.outro.founder$"
 culture_notification.1011.a.other:0 "$culture_notification.1111.a.other$"
 culture_notification.1011.a.founder:0 "$culture_notification.1111.a.founder$"
 culture_notification_hybrid_tooltip:0 "[hybrid_culture|E] [new_culture.GetName] đã được hình thành từ hai [cultures|E] [parent_1.GetName] và [parent_2.GetName]."



 culture_notification.1101.t:0 "Văn Hóa Phân Nhánh: [new_culture.GetNameNoTooltip|V]"
 culture_notification.1101.desc:0 "[founder.GetTitledFirstName] đã tạo ra [new_culture.GetName|V], một [divergent_culture|E] tách ra từ [parent_1.GetName]"

 culture_notification.1111.t:0 "Sự Phân Nhánh [new_culture.GetNameNoTooltip]"
 culture_notification.1111.intro:0 "Những thay đổi nhỏ trong phương ngữ, vài phong tục hơi khác biệt... Ban đầu rất dễ bỏ qua. Nhưng theo thời gian, những biến đổi nhỏ ấy dần trở thành thay đổi lớn, và giờ đây người [parent_1.GetCollectiveNoun] sống tại [founder.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] đã bắt đầu tự nhận mình là người [new_culture.GetName].\n\n"
 culture_notification.1111.ethos.bellicose:0 "Đối mặt với áp lực ngày càng tăng từ thiên nhiên hoang dã lẫn kẻ thù, người [new_culture.GetCollectiveNounNoTooltip] đang trở nên hiếu chiến hơn bao giờ hết khi tìm cách xây dựng và bảo vệ sinh kế của mình bằng sức mạnh vũ lực."
 culture_notification.1111.ethos.bureaucratic:1 "Người [new_culture.GetCollectiveNounNoTooltip] dường như đang phát triển niềm say mê với những bộ luật dài dòng, biên niên sử đồ sộ và các điều lệ rắc rối, tìm thấy sự an tâm trong một xã hội được điều hành bởi những quy tắc ngày càng phức tạp."
 culture_notification.1111.ethos.courtly:1 "Với sự tận tâm ngày càng lớn dành cho lễ nghi và phép tắc, người [new_culture.GetCollectiveNounNoTooltip] đang chấp nhận một lối sống có trật tự và nghi thức, nhằm mở ra một thời kỳ mới của ổn định và phồn vinh."
 culture_notification.1111.ethos.communal:0 "Bằng việc giúp đỡ láng giềng khi hoạn nạn và cùng chia sẻ những chiến thắng của họ, người [new_culture.GetCollectiveNounNoTooltip] đang hình thành những mối liên kết cộng đồng bền chặt, nuôi dưỡng cảm giác thuộc về và mục đích chung."
 culture_notification.1111.ethos.stoic:0 "Trước một thế giới nguy hiểm và khó lường, người [new_culture.GetCollectiveNounNoTooltip] ngày càng coi trọng ý chí kiên cường và quyết tâm hơn bao giờ hết."
 culture_notification.1111.ethos.spiritual:0 "Vừa tìm kiếm câu trả lời trong nội tâm, vừa hướng ra thế giới rộng lớn, người [new_culture.GetCollectiveNounNoTooltip] đang trở nên sùng đạo và tâm linh hơn trước."
 culture_notification.1111.ethos.egalitatian:0 "Nhận ra rằng hoàn cảnh xuất thân không phải lúc nào cũng quyết định năng lực hay tài năng, người [new_culture.GetCollectiveNounNoTooltip] đang trở nên bình đẳng và cởi mở hơn trong xã hội của mình."
 culture_notification.1111.ethos.unchanged:0 "Dù quan niệm sống của họ về cơ bản không thay đổi, sự khác biệt giữa người [new_culture.GetCollectiveNounNoTooltip] và [parent_1.GetCollectiveNounNoTooltip] dường như mang tính chính trị nhiều hơn bất cứ điều gì khác — nhưng sự thật vẫn là những khác biệt về truyền thống, chính sách và biên giới đã biến một dân tộc thành hai."
 culture_notification.1111.outro.other:0 "\n\nCho dù là do sự thao túng khéo léo hay một mong muốn thực sự để dẫn dắt người dân [founder.GetHerHis] của ngài bước vào một kỷ nguyên mới, [founder.GetTitledFirstName] đã tự đặt [founder.GetHerselfHimself] vào vị trí là người lãnh đạo của sự thức tỉnh văn hóa này."
 culture_notification.1111.outro.founder:0 "\n\nKhi người [new_culture.GetNameNoTooltip] giờ đây trông cậy vào ta để được dẫn dắt, đã đến lúc chuẩn bị cho tương lai chung của chúng ta."
 culture_notification.1111.a.other:0 "Chúng ta sẽ xem tình hình tiến triển ra sao."
 culture_notification.1111.a.founder:0 "Vì một thời đại mới, một kỷ nguyên mới, một dân tộc mới!"
 culture_notification_tooltip:0 "[divergent_culture|E] [new_culture.GetName] đã tách ra từ [culture|E] [parent_1.GetName]."
