l_english:
  legitimize_bastard_interaction:1 "Hợp Pháp Hóa Con Hoang #weak (Gia Tộc)#!"
  legitimize_bastard_interaction_extra_icon:0 "$hook_extra_icon$"
  legitimize_bastard_interaction_desc_house_head:1 "$house_head_interaction_header$Tuyên bố [secondary_recipient.GetShortUINameNoTooltip] là một [legitimized_bastard|E]\n\n#weak Điều này khả dụng vì [secondary_recipient.GetSheHe] là một [bastard|E] của [house|E] của ta#!"
  legitimize_bastard_interaction_desc_not_house_head:0 "Yêu cầu [recipient.GetShortUINameNoTooltip] thừa nhận [bastard|E] của Ngài là [legitimate|E]\n#weak ([recipient.GetShortUINameNoTooltip] là [house_head_head|E] của [house|E] của Ngài)#!"
  legitimize_bastard_interaction_notification:0 "Con Hoang Được Hợp Pháp Hóa"
  legitimize_bastard_interaction_decline_notification:0 "Con Hoang Không Được Hợp Pháp Hóa"
  I_AM_HOUSE_HEAD_MODIFIER:0 "Là Gia Chủ, ta có quyền quyết định"
  PRESTIGOUS_IN_OUR_HOUSE:0 "Mức Độ Danh Tiếng: $VALUE|+0$"
  house_bastard_was_legitimized:0 "Con Hoang Của Gia Tộc Được Hợp Pháp Hóa"
  dynasty_bastard_was_legitimized:0 "Con Hoang Của Triều Tộc Được Hợp Pháp Hóa"

  bastard_interaction.0001.t:0 "Gia Tộc [actor.GetHouse.GetBaseName]"
  bastard_interaction.0001.desc.standard:0 "Sau ngần ấy thời gian, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))] của ta cuối cùng cũng quyết định trao cho ta sự thừa nhận mà ta hằng mong mỏi. Từ ngày hôm nay trở đi, ta là [secondary_recipient.Custom('DaughterSon')] hợp pháp của [actor.GetHerHis]. Chỉ với vài lời nói, [actor.GetSheHe] đã hoàn toàn thay đổi con đường tương lai của ta."
  bastard_interaction.0001.desc.child:1 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))|U] đã 'hợp pháp hóa' ta — giờ ta là [secondary_recipient.Custom('DaughterSon')] thật sự của [actor.GetHerHis], [actor.GetSheHe] nói vậy. Ta không thật sự hiểu điều đó nghĩa là gì, nhưng ta nhận ra một số người nhìn ta khác đi. Phần lớn thì tử tế hơn, còn vài người thì không..."
  bastard_interaction.0001.a.standard:0 "Mọi giấc mơ của ta dường như đã gần hơn bao giờ hết."
  bastard_interaction.0001.a.child:1 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))|U] nói đây là điều tốt."
  bastard_interaction.0002.t:0 "Chào Mừng Đến Với Gia Đình"
  bastard_interaction.0002.house_head:0 "Ta đã tuyên bố [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('legitimized_bastard'))] của mình, [legitimized_bastard.GetFirstName], là con hợp pháp của ta và là thành viên của Gia Tộc [actor.GetHouse.GetBaseName]. Ta đã suy nghĩ rất nhiều trước khi đi đến quyết định này, và dù có người không đồng ý, đây vẫn là điều đúng đắn."
  bastard_interaction.0002.dynast:0 "Ta đã tuyên bố [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('legitimized_bastard'))] của mình, [legitimized_bastard.GetFirstName], là một hậu duệ hợp pháp của Triều Tộc [actor.GetDynasty.GetBaseName]."
  bastard_interaction.0002.approved:0 "Ta đã tuyên bố [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('legitimized_bastard'))] của mình, [legitimized_bastard.GetFirstName], là con hợp pháp của ta và là thành viên của Gia Tộc [actor.GetHouse.GetBaseName]. Ta đã suy nghĩ rất nhiều trước khi đi đến quyết định này, và dù có người không đồng ý, đây vẫn là điều đúng đắn."
  bastard_interaction.0002.a:1 "Tương lai của ngươi rất tươi sáng, [legitimized_bastard.GetFullNameNoTooltip]."
  bastard_interaction.0003.t:0 "Kết Cục Tốt Đẹp"
  bastard_interaction.0003.desc:0 "Phải mất một thời gian [actor.GetHerHim] mới đi đến kết luận, nhưng cuối cùng [actor.GetTitledFirstName] đã hợp pháp hóa [secondary_recipient.Custom('DaughterSon')] [secondary_recipient.GetFirstName] của chúng ta. Là thành viên của gia tộc [actor.GetHouse.GetBaseName], [secondary_recipient.GetFirstName] giờ đây có một tương lai tươi sáng hơn những gì ta từng dám hy vọng."
  bastard_interaction.0003.a:0 "Hãy khiến chúng ta tự hào!"
  bastard_interaction.0004.t:0 "Một Bóng Ma Cũ Trở Lại"
  bastard_interaction.0004.desc:0 "Thật ngu ngốc khi ta đã từng tin rằng [secondary_recipient.GetTitledFirstName] là vấn đề của quá khứ, rằng [secondary_recipient.GetSheHe] sẽ không bao giờ quay lại ám ảnh ta nữa. Làm sao ta có thể không lường trước việc [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))] [actor.Custom2('InsultAdjective', ROOT.Char)] của ta lại hợp pháp hóa [secondary_recipient.GetHerHim]? Ta đã nghĩ mình đã chịu đựng quá đủ rồi..."
  bastard_interaction.0004.newborn_desc:0 "[actor.GetFirstName] không chỉ có con hoang, mà [actor.GetSheHe] còn chọn hợp pháp hóa đứa trẻ thành con của chính mình!\n\nTiểu [legitimized_bastard.GetTitledFirstName] sẽ ám ảnh cuộc đời ta mãi mãi..."
  bastard_interaction.0004.a:0 "Ta sẽ không quên sự phản bội này."
  bastard_interaction.0005.t:0 "Ngày Trọng Đại Của [secondary_recipient.GetFirstNamePossessiveNoTooltip]"
  bastard_interaction.0005.desc.bastard:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))|U] đã quyết định hợp pháp hóa [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] của ta, [secondary_recipient.GetTitledFirstName]. Ta không thể không cảm thấy hơi cay đắng... Liệu ta có bao giờ nhận được sự thừa nhận như vậy không?"
  bastard_interaction.0005.desc.approve:0 "Đây là một ngày tốt lành cho [secondary_recipient.GetTitledFirstName]! Cuối cùng thì [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))] của chúng ta cũng đã tỉnh ngộ và hợp pháp hóa [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] của ta. Giờ đây [secondary_recipient.GetSheHe|U] thực sự là một thành viên của gia đình."
  bastard_interaction.0005.desc.disapprove:1 "Ta không thể tin được — [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))] đã quyết định hợp pháp hóa [secondary_recipient.GetTitledFirstName]! Theo thời gian, ta đã chấp nhận sự hiện diện của [secondary_recipient.GetHerHis], nhưng chuyện này thì quá đáng. [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))] thật sự mong ta chào đón [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] con hoang của ta vào gia đình sao?"
  bastard_interaction.0005.a.approve:0 "Chúc may mắn trong cuộc sống mới của Ngài."
  bastard_interaction.0005.a.disapprove:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))] có nghĩ đến ta chút nào không?"
  every_child_adult_non_bastard_dislike:0 "Tất cả những đứa con trưởng thành, không phải con hoang của ta mà ghét đứa con hoang"
  every_child_adult_non_bastard_dislike_me:0 "Tất cả những đứa con trưởng thành, không phải con hoang của [THIS.Char.GetFirstNamePossessive] mà ghét ta"
 
  bastard_interaction.0006.t:0 "[legitimized_bastard.GetFirstNameNoTooltip] Được Hợp Pháp Hóa"
  bastard_interaction.0006.desc:0 "[legitimized_bastard.GetTitledFirstName] đã được hợp pháp hóa bởi gia chủ của [legitimized_bastard.GetHerHis], [actor.GetTitledFirstName]!"
  bastard_interaction.0006.a:0 "Cuối cùng thì [legitimized_bastard.GetSheHe] cũng có một gia đình."

  bastard_interaction.0007.desc:0 "[legitimized_bastard.GetTitledFirstName], [legitimized_bastard.Custom('GetDaughterSon')] con hoang của [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('parent'))] ta, đã được hợp pháp hóa bởi [actor.GetTitledFirstName], gia chủ của [actor.GetHerHis] gia tộc."
  bastard_interaction.0007.newborn_desc:0 "[parent.GetTitledFirstName] đã mang một đứa con hoang đến thế giới này, và nó đã được hợp pháp hóa bởi [actor.GetTitledFirstName], [legitimized_bastard.Custom2('RelationToMe', SCOPE.sC('actor'))] của [legitimized_bastard.GetHerHis]."
  bastard_interaction.0007.a:0 "Cầu mong [legitimized_bastard.GetSheHe] rời khỏi cuộc đời ta mãi mãi."

  bastard_interaction.0008.desc:0 "[legitimized_bastard.GetTitledFirstName], [legitimized_bastard.Custom('GetDaughterSon')] con hoang của [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('parent'))] ta, đã được hợp pháp hóa bởi gia chủ của gia tộc mới của [legitimized_bastard.GetHerHis]!"
  bastard_interaction.0008.a:0 "Như thể [legitimized_bastard.GetSheHe] sẽ bao giờ thực sự "hợp pháp"."

  bastard_interaction.0009.t:0 "Một Người Thừa Kế Của Triều Tộc"
  bastard_interaction.0009.desc:0 "[actor.GetTitledFirstName], gia chủ của toàn bộ triều tộc chúng ta, đã tuyên bố ta là người thừa kế hợp pháp cho danh xưng của chúng ta!\n\nTa luôn là một [ROOT.Char.GetDynasty.GetBaseName] thực thụ, và giờ đây cả thế giới phải thừa nhận điều đó."
  bastard_interaction.0009.a:0 "Cuối cùng!"

  bastard_interaction.0010.t:0 "Thêm Một Người Thừa Kế Cho Triều Tộc"
  bastard_interaction.0010.desc:0 "[actor.GetTitledFirstName], gia chủ của toàn bộ triều tộc chúng ta, đã tuyên bố [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('recipient'))] của ta là người thừa kế hợp pháp cho danh xưng của chúng ta!\n\n[recipient.GetSheHe|U] giờ đây xứng đáng là người thừa kế của triều tộc [ROOT.Char.GetDynasty.GetBaseName] như bất kỳ đứa con sinh ra hợp pháp nào."
  bastard_interaction.0010.a:0 "Thêm một người nữa trong hàng kế vị."
  bastard_interaction.0010.a.tt:0 "[recipient.GetShortUIName|U] giờ đủ điều kiện thừa kế"

  every_father_house_member:0 "Mọi thành viên của [father.GetFirstNamePossessiveNoTooltip] [house|E]"
  every_mother_house_member:0 "Mọi thành viên của [mother.GetFirstNamePossessiveNoTooltip] [house|E]"
  every_real_father_house_member:0 "Mọi thành viên của [real_father.GetFirstNamePossessiveNoTooltip] [house|E]"
  every_child_house_member:0 "Mọi thành viên của [child.GetFirstNamePossessiveNoTooltip] [house|E]"
