  secrets_secondary_character_my_character_introduction:0 "[secondary_character.Custom2('MyCharacterIntroductionNoComma', event_root)]"
  secrets_secondary_character_primary_characters_introduction:0 "[secondary_character.Custom2('HerHisCharacterIntroductionNoComma', primary_character)]"
	
  secrets.0001.t:0 "Bí Mật Của Ta Bị Phơi Bày!"
  secrets.0001.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã phơi bày bí mật của Ta trước toàn thế giới!\n\nHam muốn bất thường và dục vọng không thể kiểm soát của Ta giờ đây ai cũng biết, và được xem là sự thật!"
  secrets.0001.a:0 "Làm sao Ta có thể sống với nỗi nhục nhã này đây?"

  secrets.0101.negative.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã cáo buộc [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] là một kẻ đồi bại sinh lý! Những tình tiết trong lời thuật lại của hắn thật kinh tởm tột cùng!"
  secrets.0101.positive_1.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã công khai buộc tội [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] là một kẻ lệch lạc tình dục!"
  secrets.0101.worried.desc:0 "\n\nTa phải kiềm chế dục vọng để chúng không chi phối mình. Ai mà biết ngón tay họ sẽ chỉ vào ai tiếp theo..."
  secrets.0101.positive_2.desc:0 "\n\nTa không thấy có gì phải làm om sòm. Dục vọng đâu phải căn bệnh bất thường..."
  secrets.0101.b:0 "[owner.GetFirstNameNoTooltip] sẽ phải trả giá cho tội lỗi của [owner.GetHerHis]. Cầm gươm đi!"

  secrets.0003.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã công khai lên án Ta là kẻ nằm với những [ROOT.Char.GetWomenMen] khác! Dù Ta có giải thích là hiểu lầm, nhưng [ROOT.Char.Custom('DefaultPriestTitlePlural')] xem Ta là kẻ tội lỗi trước mắt [ROOT.Char.GetFaith.HighGodName]."
  secrets.0003.a:0 "Giá mà Ta có cơ hội giải thích, Ta… Ta…"

  secrets.0103.negative.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã buộc tội [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] có quan hệ xác thịt với những [owner.GetWomenMen] khác! Điều này chắc chắn không phải ý muốn của [ROOT.Char.GetFaith.HighGodNameAlternate]!"
  secrets.0103.positive_1.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã công khai buộc tội [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] về tội loạn luân!"
  secrets.0103.positive_2.desc:0 "\n\nXét theo những lời lẽ độc ác của [secret_exposer.GetTitledFirstNamePossessiveNoTooltip], [secret_exposer.GetSheHe] cho rằng [owner.GetTitledFirstNameNoTooltip] là [ROOT.Char.GetFaith.DevilName] [ROOT.Char.GetFaith.DevilHerselfHimself]. Nhưng làm sao tình yêu lại là sai?"
  secrets.0103.worried_2.desc:0 "\n\nTa phải cẩn thận với [lover.GetFirstName], vì sự an nguy của [lover.GetHerHis] cũng như bản thân Ta. Ai mà biết ngón tay họ sẽ chỉ vào đâu tiếp theo..."
  secrets.0103.worried_3.desc:0 "Chúng Ta liệu có thể yêu nhau tự do, không còn nỗi sợ hãi?"
  secrets.0103.dislikes_negative:0 "[ROOT.Char.GetFaith.HighGodName] sẽ xét xử ngươi!"
  secrets.0103.b:0 "Cầm gươm đi! Trói kẻ [owner.GetWomanMan] này lại!"

  secrets.0004.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã lên án Ta là kẻ ma quái thích ăn thịt người! [secret_exposer.GetSheHe|U] chắc chắn không hiểu điều [secret_exposer.GetSheHe] nói, nhưng mọi người dường như tin đó là sự thật."
  secrets.0004.a:0 "Danh tiếng của Ta rệu rã rồi!"

  secrets.0104.negative.desc:0 "Nghẹn ngào nổi lên trong cổ Ta khi nghĩ về những lời buộc tội mà [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)] đưa ra. [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U], một kẻ ăn thịt người! Ta không thể xua đi những hình ảnh kinh tởm đó khỏi tâm trí..."
  secrets.0104.positive_1.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã công khai buộc tội [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] là kẻ ăn thịt người!"
  secrets.0104.worried.desc:0 "Ta phải cẩn thận. Nếu Ta không kiềm chế cơn đói, có thể Ta sẽ là nạn nhân tiếp theo..."
  secrets.0104.positive_2.desc:0 "Hắn có hiểu được rằng [ROOT.Char.GetFaith.HighGodName] vui mừng khi chúng ta cùng tiệc tùng không?"
  secrets.0104.dislikes_negative:0 "Ngươi làm ta kinh tởm, [owner.GetFirstNameNoTooltip]!"
  secrets.0104.b:0 "Tên ác quỷ này sẽ phải trả giá cho những tội ác của [owner.GetHerHis]. Lính canh!"

  secrets.0005.desc:0 "Bằng cách kể với mọi người những suy nghĩ của Ta về [ROOT.Char.GetFaith.HighGodName], [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)] đã thuyết phục [ROOT.Char.Custom('DefaultPriestTitlePlural')] rằng Ta là kẻ không tin thần, kẻ phản bội [ROOT.Char.GetFaith.HighGodNameAlternate]!"
  secrets.0005.a:0 "Suy nghĩ cho riêng mình có gì sai chứ?!"

  secrets.0105.negative.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã buộc tội [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] là kẻ không tin thần! Kẻ phản bội [owner.GetFaith.HighGodName]! Ai cho [owner.GetSheHe] quyền chất vấn [owner.GetFaith.HighGodNameAlternate]?"
  secrets.0105.positive_1.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã công khai buộc tội [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] là kẻ không tin thần!"
  secrets.0105.positive_2.desc:0 "Sự phi lý của [secret_exposer.GetFirstNamePossessiveNoTooltip] thật xấu hổ. [owner.GetFirstNameNoTooltip] gây hại gì chứ?"
  secrets.0105.worried.desc:0 "Trong tương lai, Ta phải lựa lời cẩn thận, nếu không Ta sẽ là mục tiêu tiếp theo..."
  secrets.0105.dislikes_negative:0 "[owner.GetSheHe] chẳng biết xấu hổ sao?!"
  secrets.0105.likes_positive:0 "Suy nghĩ cho riêng mình có gì xấu chứ?"

  secrets.0006.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã lan truyền những tin đồn bẩn về mối quan hệ xác thịt giữa Ta và một người thân chưa nêu tên! Mọi người dường như quá háo hức tin [secret_exposer.GetHerHim] nữa!"
  secrets.0006.a:0 "Ai mà dám nói họ biết tình yêu thật sự là gì?!"

  secrets.0106.t:0 "Bí Mật Bị Phơi Bày!"
  secrets.0106.negative.desc:0 "Theo [ROOT.Char.GetFaith.HighGodName]! [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã đưa ra bằng chứng không thể chối cãi cho toàn châu về việc [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] đang tham gia những hành vi loạn luân!"
  secrets.0106.positive_1.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã công khai buộc tội [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] có quan hệ loạn luân!"
  secrets.0106.worried.desc:0 "\n\nSự đau khổ của [owner.GetTitledFirstNamePossessiveNoTooltip] hiện rõ, nhưng Ta buộc phải kìm nén sự an ủi. Ta thề đôi mắt họ dõi theo Ta mọi nơi..."
  secrets.0106.positive_2.desc:0 "Nhưng tình yêu giữa huyết tộc chẳng phải tự nhiên như hít thở sao?"
  secrets.0106.likes_negative:0 "Ta không… Ta chưa bao giờ nghĩ tới!"
  secrets.0106.dislikes_negative:0 "Ghê tởm! Hoàn toàn ghê tởm!"
  secrets.0106.likes_positive:0 "Sự ngược đãi này thật không đúng!"
  secrets.0106.dislikes_positive:0 "Chúng ta chẳng còn việc quan trọng nào hơn sao?"


  secrets.0007.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã lên án những hành vi của Ta là bất kính và không thể tha thứ! Mọi người giờ gọi Ta là phù thủy, kẻ thù của [ROOT.Char.GetFaith.HighGodName]!"
  secrets.0007.a:0 "Họ không thấy sự thật mà Ta thấy sao?"

  secrets.0107.negative.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã buộc tội [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] là phù thủy! Kẻ [owner.GetWomanMan] độc ác này đang cấu kết với [ROOT.Char.GetFaith.DevilName] để đầu độc tâm trí chúng ta và lôi chúng ta ra khỏi [ROOT.Char.GetFaith.HighGodName]!"
  secrets.0107.positive_1.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã công khai buộc tội [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] về phù thủy!"
  secrets.0107.positive_2.desc:0 "Tên [secret_exposer.GetWomanMan] ngốc nghếch này lải nhải về "[secret_exposer.GetFaith.DevilName]." Liệu [secret_exposer.GetSheHe] có mù quáng trước sự thông tuệ của [owner.GetTitledFirstNamePossessiveNoTooltip] chăng?"
  secrets.0107.worried.desc:0 "\n\nTa muốn lên tiếng, cho mọi người thấy sự thật, nhưng liệu họ có nghe không? Nếu Ta làm, Ta sợ họ sẽ quay sang Ta tiếp..."
  secrets.0107.dislikes_negative:0 "Đốt phù thủy đi!"
  secrets.0107.b:0 "Tên phù thủy này sẽ phải trả giá cho những tội ác của [owner.GetHerHis]!"
  secrets.0107.c:0 "Những lời buộc tội này chỉ toàn là ác ý và dối trá."
 

  secrets.0008.desc:1 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã phơi bày rằng ta đang lén lút qua lại với [Select_CString( ObjectsEqual( secret_exposer, target ), 'them', target.GetTitledFirstName )]! Với việc sự thật đang lan truyền như cháy rừng, niềm đam mê của chúng ta có lẽ không được che giấu kỹ như chúng ta tưởng."
  secrets.0008.forbidden.desc:1 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã phơi bày mối quan hệ của ta với [Select_CString( ObjectsEqual( secret_exposer, target ), 'them', target.GetTitledFirstName )] cho cả thế giới!\n\nKhi họ chỉ trỏ và hét lên những lời lăng mạ, ta không cảm thấy xấu hổ. Ta chỉ nói dối để giữ an toàn cho [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))] của mình. Tuy nhiên, điều ta cảm thấy lúc này là sự sợ hãi... Điều gì sẽ xảy ra với chúng ta bây giờ?"
  secrets.0008.a:0 "Họ có quyền gì để xét đoán?!"

  secrets.0108.no_exposer.desc:3 "Một sự thật bí mật đã được phơi bày. [ROOT.Char.Custom2('RelationToMeShort', primary_character)] của Ta, [primary_character.GetTitledFirstName], đã"
  secrets.0108.exposer.desc:1 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã cáo buộc [secret_exposer.Custom2('RelationToMeShort', primary_character)] của [secret_exposer.GetHerHis], [primary_character.GetTitledFirstName], về việc đã"
  secrets.0108.incest_bad.desc:2 "có mối quan hệ loạn luân với [primary_character.GetHerHis] #EMP [primary_character.Custom2('RelationToMeShort', SCOPE.sC('secondary_character'))]#!! [primary_character.GetFirstNameNoTooltip] và [secondary_character.GetTitledFirstName] là người yêu!\n\nTa đã chứng kiến và nghe nhiều chuyện trong đời, nhưng chuyện này..."
  secrets.0108.sodomy_bad.desc:3 "có quan hệ loạn luân với [SCOPE.Custom('SecretRevealSecondCharacterIntroduction')]! Chắc chắn điều này không phải là ý muốn của [ROOT.Char.GetFaith.HighGodNameAlternate]!"
  secrets.0108.adulterer_bad.desc:3 "ngoại tình với [SCOPE.Custom('SecretRevealSecondCharacterIntroduction')]! Làm sao [primary_character.GetSheHe] có thể bôi nhọ sự thiêng liêng trong cuộc hôn nhân của [primary_character.GetHerHis] được chứ?"
  secrets.0108.fornicator_bad.desc:3 "quan hệ tình dục với [SCOPE.Custom('SecretRevealSecondCharacterIntroduction')]! Những điều này không thể chấp nhận ngoài hôn nhân!"
  secrets.0108.incest_is_good.desc:3 "có quan hệ với [secondary_character.Custom2('HerHisCharacterIntroductionNoComma', primary_character)]. Có nhiều người xét đoán họ, nhưng Ta biết không có gì hại trong những gì [primary_character.GetFirstNameNoTooltip] và [secondary_character.GetFirstNameNoTooltip] chia sẻ..."
  secrets.0108.all_is_good.desc:3 "có quan hệ với [SCOPE.Custom('SecretRevealSecondCharacterIntroduction')].\n\nTa không thấy có gì phải làm om sòm. Dục vọng đâu phải căn bệnh bất thường..."
  secrets.0108.dislikes_negative:0 "[ROOT.Char.GetFaith.HighGodName] sẽ xét xử họ!"
  secrets.0108.b:0 "Tội ác này không thể bỏ qua. Cầm gươm đi!"

  secrets.0110.start.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã đưa ra bằng chứng không thể chối cãi rằng"
  secrets.0110.start.above_cutoff:0 "Dù không thể chứng minh chắc chắn, [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã đưa ra bằng chứng rằng"
  secrets.0110.single_child.desc:0 "[child.GetTitledFirstName] không phải"
  secrets.0110.single_child_relation.desc:0 "[child.GetFirstName] không phải"
  secrets.0110.is_not_fathers.desc:0 "là [child.Custom('GetDaughterSon')] của [father.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], mà [child.GetSheHe] là con của"
  secrets.0110.are_not_fathers.desc:0 "những đứa con của [father.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], nhưng chúng là con của"
  secrets.0110.is_not_mine.desc:0 "là [child.Custom('GetDaughterSon')] của Ta, nhưng được sinh ra bởi"
  secrets.0110.incest_real_father.desc:0 "[mother.GetTitledFirstNamePossessive] chính là [mother.Custom2('RelationToMeShort', SCOPE.sC('real_father'))], [real_father.GetTitledFirstName]!\n\n"
  secrets.0110.regular_real_father.desc:1 "[real_father.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
  secrets.0110.regular_real_father_self_expose:0 "không ai khác ngoài [real_father.GetHerHim]!"
  secrets.0110.father.child_above_cutoff:0 "\n\nKhông thể chứng minh chắc chắn, nhưng tất cả dần sáng tỏ..."
  secrets.0110.father_knew.desc:0 "\n\nDù là vết thương cũ, vẫn đau khi bị nhắc về sự không chung thủy của [mother.GetFirstNamePossessive]... Và giờ, Ta phải mang nỗi nhục này cho mọi người thấy."
  secrets.0110.father_love.desc:0 "\n\nÔi [mother.GetFirstName], sao con có thể? Ta đã yêu mẹ, và [child.Custom('GetDaughterSon')] của chúng ta... [child.Custom('GetDaughterSon')] của mẹ. Trong một đòn nặng nề, mẹ đã lấy đi cả hai."
  secrets.0110.father_no_love.desc:0 "\n\nMột ngàn tuần trăng có thể trôi qua, nhưng ta sẽ không bao giờ quên sự phản bội của [mother.GetFirstName]. Có lẽ ta sẽ tin tưởng [mother.GetHerHim] một lần nữa, nhưng hôm nay không phải là ngày đó."
  secrets.0110.incest_consort.desc:0 "\n\nSự nhận ra như búa bổ vào đầu Ta. Ôi, [ROOT.Char.GetFaith.HighGodName], [consort_bastard.GetFirstNameNoTooltip] là [ROOT.Char.Custom2('CloseOrExtendedFamilyRelationToMe', SCOPE.sC('consort_bastard'))] của Ta. Tất cả thời gian qua... những gì chúng Ta đã làm..."
  secrets.0110.incest_consort_accepted.desc:0 "\n\nNhờ [ROOT.Char.GetFaith.HighGodName], điều này có nghĩa [consort_bastard.GetFirstNameNoTooltip] là [ROOT.Char.Custom2('CloseOrExtendedFamilyRelationToMe', SCOPE.sC('consort_bastard'))] của Ta! Ta biết đã có #EMP một điều gì đó#!, một kết nối đặc biệt... Giờ Ta cảm thấy gần gũi với [consort_bastard.GetHerHim] hơn bao giờ hết."
  secrets.0110.mother_spouse.desc:0 "\n\nTin đồn lan nhanh như lửa cháy trong triều đình, và [mother.GetFirstName] đã khóa mình trong phòng. Ta nên an ủi hay trách mắng bà? Ta có nên... lo lắng không?"
  secrets.0110.real_father_spouse.desc:0 "\n\nTin đồn lan nhanh trong triều, nhưng Ta không biết nghĩ gì hay nói gì. Sao con có thể làm thế này, [real_father.GetFirstName]? Làm sao Ta có thể tin con lần nữa?"
  secrets.0110.mother_family.desc:0 "\n\nSao [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('mother'))] của Ta có thể làm điều này với chúng Ta? [child.GetFirstNameNoTooltip] thì không có lỗi gì cả. Nhưng hậu quả với [child.GetHerHis] có thể nghiêm trọng..."
  secrets.0110.real_father_family.desc:0 "\n\nSao [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('real_father'))] của Ta có thể làm điều này với chúng Ta? [child.GetFirstNameNoTooltip] thì không có lỗi gì cả. Nhưng hậu quả với [child.GetHerHis] có thể nghiêm trọng..."
  secrets.0110.general_end.desc:0 "\n\n[child.GetFirstNameNoTooltip] vô tội, nhưng hậu quả với [child.GetHerHis] có thể nghiêm trọng. [real_father.GetTitledFirstNameNoTooltip] và [mother.GetTitledFirstName], ngược lại..."
  secrets.0110.a:0 "Ta không biết nói gì!"
  secrets.0110.a.incest:0 "Ta nghĩ mình sắp nôn ra."
  secrets.0110.b:0 "Ngươi vẫn đang ngủ với [consort_bastard_parent_lover.GetHerHim], đúng không?!"
  secrets.0110.b.success.desc:0 "Những buộc tội của Ta là chính xác"
  secrets.0110.b.success.tt:0 "Bí mật của [consort_bastard_parent.GetTitledFirstNamePossessive] được tiết lộ cho Ta"
  secrets.0110.b.failure.desc:0 "[consort_bastard_parent_lover.GetTitledFirstNameNoTooltip] không phải là người yêu của [consort_bastard_parent.GetTitledFirstNamePossessiveNoTooltip]"
  secrets.0110.c:0 "Ta ước gì chưa từng biết..."
 
  secrets.0112.single_child_relation.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] của Ta là con của"
  secrets.0112.single_child.desc:0 "[child.GetTitledFirstName] là con của"
  secrets.0112.mother_family.desc:0 "Ôi mẹ. Ta không chắc nên nói gì hay cảm thấy thế nào. Ít nhất bây giờ mọi thứ đã được phơi bày."
  secrets.0112.real_father_family.desc:1 "\n\nSao [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('real_father'))] của Ta có thể làm điều này với chúng ta? [real_father.GetFirstNameNoTooltip], con có biết điều này có ý nghĩa gì cho gia đình ta không?"
  secrets.0112.general_end.desc:0 "Ta tự hỏi, liệu [child.GetFirstNameNoTooltip] có biết về nguồn cội thực sự của [child.GetHerHis], hay tin này đối với [child.GetHerHim] cũng mới mẻ y như đối với ta? Liệu sự tiết lộ này sẽ trở thành phước lành — hay là một lời nguyền?"
  secrets.0112.b.success.desc:0 "Nghi ngờ của Ta là chính xác"
  secrets.0112.a:0 "Ai mà ngờ được?"
  secrets.0112.b:0 "Ngươi vẫn đang gặp [consort_bastard_parent_lover.GetHerHim] đúng không?"
  secrets.0112.c:0 "Hãy bỏ chuyện này lại phía sau."

  secrets.0115.start.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã đưa ra bằng chứng không thể chối cãi về việc Ta đã cố gắng giết [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]! [ROOT.Char.Custom('CulturalCurse')|U]!\n\n"
  secrets.0115.victim_alive.desc:0 "Giờ [victim.GetSheHe] đã biết, Ta phải cẩn trọng. Sự trả thù của [victim.GetHerHis|U] có thể xảy ra vào ngày mai, mười năm sau, hoặc có thể không bao giờ. Nhưng nếu xảy ra, Ta phải chuẩn bị."
  secrets.0115.victim_dead.desc:0 "Ít nhất thì bây giờ cái thứ [victim.Custom2('InsultNoun', ROOT.Char)] đó đang thối rữa trong nấm mồ của [victim.GetHerHis]!"
  secrets.0115.a:0 "Ta có lý do của mình!"

  secrets.0116.negative.desc:0 "Theo [ROOT.Char.GetFaith.HighGodName]! [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã đưa ra bằng chứng không thể chối cãi về việc âm mưu giết [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], do [murderer.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] chủ mưu!\n\nKẻ [murderer.Custom2('InsultNoun', ROOT.Char)] nhẫn tâm ấy không tôn trọng mạng người sao?"
  secrets.0116.positive.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã cáo buộc [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)] âm mưu sát hại [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\nGiờ thì sự thật đã phơi bày, [murderer.GetFirstNameNoTooltip] tốt nhất là nên cẩn thận sau lưng [murderer.GetHerHis]."
  secrets.0106.victim_knows.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã công khai buộc tội [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)] âm mưu hãm hại Ta. Dù [murderer.GetSheHe] có giải thích hay che giấu, bằng chứng giờ đã ở đó cho mọi người thấy."
  secrets.0106.victim.desc:0 "Nhân danh [ROOT.Char.GetFaith.HighGodName]! [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã đưa ra bằng chứng không thể chối cãi về một âm mưu sát hại nhằm vào #EMP chính ta#!! Kẻ [murderer.Custom2('InsultNoun', ROOT.Char)] xảo trá đứng sau âm mưu này không ai khác chính là [murderer.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\nCứ tin lời ta đi, [murderer.GetSheHe] sẽ phải hối hận vì sự thất bại của [murderer.GetHerHis]."
  secrets.0116.likes_negative:0 "Làm sao [murderer.GetSheHe] có thể làm vậy!"
  secrets.0116.dislikes_negative:0 "[murderer.GetSheHe|U] sẽ trả giá, bằng mọi cách!"
  secrets.0116.likes_positive:0 "Ta chắc [victim.GetFirstNameNoTooltip] đáng bị vậy!"
  secrets.0116.victim_knows:0 "Giờ mọi người sẽ biết [murderer.GetSheHe] thật sự là ai."
  secrets.0116.b:0 "Cầm gươm đi! Bắt tên tội phạm hèn hạ này!"
  secrets.0116.c:0 "[murderer.GetSheHe|U] vẫn được tự do. Tạm thời thôi."

  secrets.0117.start.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã đưa ra bằng chứng không thể chối cãi về vai trò của Ta trong cái chết của [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]! [ROOT.Char.Custom('CulturalCurse')|U]!\n\n"
  secrets.0117.kinslayer.desc:0 "Ta hy vọng chuyện này sẽ không xảy ra. Sai lầm của kẻ ngốc. Giờ Ta ở trong tay [dynast.GetTitledFirstNamePossessive], và nếu [dynast.GetSheHe] tha thứ, vẫn còn nhiều kẻ thèm khát trả thù..."
  secrets.0117.kinslayer_dynasty_head.desc:0 "Ta hy vọng chuyện này sẽ không xảy ra. Sai lầm của kẻ ngốc. Giờ Ta sợ cả dòng họ sẽ quay lưng với Ta..."
  secrets.0117.regular.desc:0 "Tốt nhất Ta phải đề phòng và chuẩn bị phòng thủ. Có nhiều kẻ thèm khát trả thù ngoài kia..."
  secrets.0117.a:0 "Ta có lý do của mình!"


  secrets.0118.known_murder.t:0 "Kẻ sát nhân!"
  secrets.0118.negative_start.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã phơi bày một bí mật kinh hoàng! [victim.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã chết trẻ dưới tay [murderer.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\n"
  secrets.0118.negative_start_known.desc:0 "[murderer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã giết [victim.Custom2('MyCharacterIntroduction', ROOT.Char)] lạnh lùng!\n\n"
  secrets.0118.negative_end_family.desc:0 "Tên [murderer.Custom2('InsultAdjective', ROOT.Char)] [murderer.Custom2('InsultNoun', ROOT.Char)] đó nên ngủ với một mắt mở. Dù bằng cách nào, [murderer.GetSheHe] sẽ hối hận cay đắng. Ta thề trên mộ của [victim.GetTitledFirstNamePossessiveNoTooltip]!"
  secrets.0118.negative_end.desc:0 "[murderer.GetFirstNameNoTooltip] chắc nghĩ [murderer.GetHerselfHimself] ngang bằng [ROOT.Char.GetFaith.HighGodNamePossessive], rằng [murderer.GetSheHe] nắm quyền sinh tử, luật pháp thì bỏ qua! Tội ác này không có sự chuộc lỗi!"
  secrets.0118.positive.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã cáo buộc [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)] đã gây ra cái chết tức tưởi cho [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\nGiờ thì sự thật đã phơi bày, [murderer.GetFirstNameNoTooltip] tốt nhất là nên cẩn thận sau lưng [murderer.GetHerHis]."
  secrets.0118.positive_known.desc:0 "[murderer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã gây cái chết sớm cho [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]! Tên [murderer.GetWomanMan] này hôm nay đã tạo ra không chỉ một kẻ thù."
 
  secrets.0121.start.desc.intro.self_exposed:0 "Treo cổ và cướp đoạt tên chó ba lần bị nguyền rủa đó, [secret_exposer.GetTitledFirstName] đã đi rêu rao với cả thế giới về khoản tiền Ta đã lấy từ [secret_exposer.GetHerHim].\n\n"
  secrets.0121.start.desc.intro:1 "Chết tiệt và nguyền rủa tên hèn nhát [secret_exposer.GetTitledFirstName], [secret_exposer.GetWomanMan] đã đi rêu rao với cả thế giới về khoản tiền Ta đã lấy từ [secret_target.GetTitledFirstName].\n\n"
  secrets.0121.desc.victim_is_liege_or_above:1 "Tệ hơn nữa, vì [secret_target.GetFirstNameNoTooltip] có quyền lực pháp lý với Ta, [secret_target.GetSheHe] có thể đòi Ta trả lại #EMP tất cả#!. Ta có thể bị phá sản vì chuyện này."
  secrets.0121.desc.victim_not_liege.root_has_liege:0 "May mắn thay, [secret_target.GetFirstNameNoTooltip] không có quyền trực tiếp yêu cầu bồi thường. Không may, [secret_target.GetSheHe] có thể nhờ chúa tể của Ta, [secret_owner.GetLiege.GetTitledFirstName], yêu cầu trả tiền. Ta chỉ còn hy vọng chuyện đó không xảy ra."
  secrets.0121.desc.victim_not_liege.root_has_no_liege:0 "Ít ra không có quyền lực nào có thể bắt Ta trả bất cứ khoản nào. Cảm ơn [secret_owner.GetFaith.WealthGodName] cho những ân huệ nhỏ."
  secrets.0121.a:1 "Số tiền đó chỉ đang nằm trong kho bạc của Ta thôi!"

  secrets.0122.t:1 "Đôi Tay Dính Vàng"
  secrets.0122.start.desc.intro.self_exposed:0 "Ta đã đưa ra bằng chứng không thể chối cãi rằng [secret_owner.Custom2('MyCharacterIntroduction', secret_target)] đã bí mật ăn cắp của Ta! Các thư ký và thủ quỹ đã kiểm tra kỹ các tài sản bất hợp pháp, và chúng khớp chính xác với các khoản thuế và lệ phí bị mất hoặc lãng phí trong toàn vương quốc.\n\n"
  secrets.0122.start.desc.intro:1 "Theo [secret_exposer.Custom2('MyCharacterIntroduction', secret_target)], [secret_owner.Custom2('MyCharacterIntroduction', secret_target)] đã bí mật ăn cắp của Ta! Bằng chứng không thể chối cãi, khớp hoàn hảo với các khoản thuế và lệ phí bị mất hoặc lãng phí trong toàn vương quốc.\n\n"
  secrets.0122.desc.victim_is_vassal_or_below.secret_owner:1 "Là chúa tể của [secret_owner.GetFirstNamePossessiveNoTooltip], may mắn thay, Ta có thể yêu cầu bồi thường. #EMP Nếu không thì thôi#!."
  secrets.0122.desc.victim_is_vassal_or_below.other:0 "Dù [secret_owner.GetFirstNameNoTooltip] không chịu quyền trực tiếp của Ta, [secret_owner.GetSheHe] #EMP vẫn#! có một chúa tể có thể bắt [secret_owner.GetHerHim] trả — [secret_owner.GetLiege.GetTitledFirstName] có thể sẵn lòng giúp nếu Ta chia phần thuế trốn với [secret_owner.GetHerHim]."
  secrets.0122.desc.victim_not_vassal:1 "Vì [secret_owner.GetFirstName] độc lập với quyền lực Ta, không có cách nào để Ta lấy lại bạc đã mất."
  secrets.0122.a:1 "Ta sẽ lấy lại tiền, [secret_owner.GetFirstNameNoTooltip]!"
  secrets.0122.a.tt:1 "[secret_owner.GetFirstName] sẽ trả lại #P [gold_i][secret.MakeScope.Var('embezzlement_stake').GetValue]#!, đủ, hoặc nổi loạn"
  secrets.0122.b:1 "Ta không quan tâm đến vàng. Ta thích... sắt..."
  secrets.0122.c:1 "Nhân vô thập toàn, tha thứ là thiên tính."
  secrets.0122.c.tt:1 "[secret_target.GetFirstNameNoTooltip] tha thứ cho 'món nợ' của Ngài"
  secrets.0122.d:1 "$secrets.0122.a$"
  secrets.0122.d.tt:0 "Ngài yêu cầu [secret_owner.GetFirstName] trả lại #P [gold_i][secret.MakeScope.Var('embezzlement_stake').GetValue]#! — [secret_owner.GetSheHe] không bắt buộc làm và khó lòng tuân theo"
  secrets.0122.e:1 "Chắc chắn [secret_owner.GetLiege.GetTitledFirstNameNoTooltip] thấy chuyện này bất công..."
  secrets.0122.e.tt:0 "Ngài đề nghị chia đôi #P [gold_i][secret.MakeScope.Var('embezzlement_stake').GetValue]#! với [secret_owner.GetLiege.GetTitledFirstName] nếu [secret_owner.GetLiege.GetSheHe] buộc [secret_owner.GetFirstName] trả"
  secrets.0122.f:1 "$secrets.0122.c$"
  secrets.0122.g:1 "Ta có thể chờ đợi..."
  secrets.0122.g.tt:1 "[secret_owner.GetFirstName] chắc chắn sẽ đối mặt với phán xét. Cuối cùng."

  secrets.0123.t:1 "[secret_target.Custom2('AppropriateGreeting', secret_owner)]"
  secrets.0123.desc.self_exposed:0 "Giờ tất cả đều biết về việc Ngài chuyển lậu thuế, lệ phí và hàng hóa từ kho bạc của Ta.\n\nNgài phải trả lại ngay những gì lấy được, hoặc chịu hậu quả."
  secrets.0123.desc:1 "[secret_exposer.Custom2('MyCharacterIntroduction', secret_target)|U] đã cảnh báo Ta về việc Ngài chuyển lậu thuế, lệ phí và hàng hóa từ kho bạc của Ta.\n\nNgài phải trả lại ngay những gì lấy được, hoặc chịu hậu quả."
  secrets.0123.a:1 "Đây là ăn cắp tài sản hợp pháp của Ta, nhưng #EMP được thôi#!."
  secrets.0123.a.tt:0 "Vàng của Ngài được trả đầy đủ và đúng hạn"
  secrets.0123.b:1 "Ngài sẽ nhận vàng khi nếm thanh gươm của Ta!"
  secrets.0123.b.tt.on_the_lamb:0 "[secret_owner.GetFirstNameNoTooltip] chạy trốn khỏi Vương quốc"
  secrets.0123.b.tt.captured:0 "[secret_owner.GetFirstNameNoTooltip] chạy trốn thất bại"
  secrets.0123.b.tt.refused:0 "[secret_owner.GetFirstNameNoTooltip] cứng rắn từ chối"

  secrets.0124.t:0 "[secret_target.Custom2('AppropriateGreetingPositive', SCOPE.sC('liege'))]"
  secrets.0124.desc:0 "[secret_owner.Custom2('YourCharacterIntroduction', SCOPE.sC('liege'))|U] đã ăn cắp một lượng lớn vàng từ Ta, Ta không thể lấy lại nếu không có giúp đỡ của Ngài.\n\nTa khẩn cầu Ngài, yêu cầu bồi thường thay Ta, và Ngài có thể giữ một nửa vàng làm công."
  secrets.0124.a:0 "À, thôi. Rốt cuộc chỉ là số tiền Ngài được trả..."
  secrets.0124.a.tt:0 "Ngài và [secret_target.GetShortUIName] nhận #P [gold_i][secret.MakeScope.Var('embezzlement_stake_half').GetValue]#! mỗi người"
  secrets.0124.b:0 "Ngài sẽ nhận đủ số tiền!"
  secrets.0124.b.tt:0 "[secret_target.GetShortUIName|U] nhận #P [gold_i][secret.MakeScope.Var('embezzlement_stake').GetValue]#!"
  secrets.0124.b.tt.conditional:0 "Nếu [secret_owner.GetTitledFirstName] chấp nhận"
  secrets.0124.b.tt.conditional_failed: "Nếu [secret_owner.GetTitledFirstName] từ chối"
  secrets.0124.c:0 "Nghe có vẻ chuyện cá nhân."
  secrets.0124.c.tt:0 "[liege.GetTitledFirstNameNoTooltip] không quan tâm"

  secrets.0125.t:0 "[liege.Custom2('AppropriateGreeting', secret_owner)]"
  secrets.0125.desc:0 "Ta sốc khi nghe chuyện Ngài ăn cắp từ [secret_target.Custom2('YourCharacterIntroduction', secret_owner)]. [secret_target.GetSheHe|U] nhờ Ta phán xét, và với tư cách chúa tể của Ngài, Ta ra lệnh Ngài trả lại một nửa số tiền đã lấy từ [secret_target.GetFirstNameNoTooltip].\n\nNửa còn lại trả cho Ta để chuộc tội. Vì lợi ích vương quốc."
  secrets.0125.a:0 "Ha, nhận đi."
  secrets.0125.a.tt:0 "Nửa số vàng của Ngài được trả"
  secrets.0125.b:0 "Không ai trong số các ngươi nhận được gì ngoài thép!"
  secrets.0125.b.tt:0 "[secret_owner.GetTitledFirstNameNoTooltip] nổi loạn thay vì trả tiền"

  secrets.0126.t:0 "[liege.Custom2('AppropriateGreeting', secret_owner)]"
  secrets.0126.desc:0 "Hành vi ăn cắp hèn nhát của Ngài từ kho bạc [secret_target.GetTitledFirstName] sẽ không được bỏ qua. Trả [secret_target.GetHerHim] ngay và đủ, hoặc chịu cơn thịnh nộ của Ta."
  secrets.0126.a:0 "Số tiền đó kiếm hợp pháp, nhưng #EMP được thôi#!."
  secrets.0126.a.tt:0 "[liege.GetTitledFirstNameNoTooltip] gửi Ngài toàn bộ"
  secrets.0126.b:0 "Ngươi không phải chúa tể của ta!"
  secrets.0126.b.tt:0 "$secrets.0125.b.tt$"

  secrets.0131.desc: "Người [secret_target.GetTitledFirstName] của Ta không tỏ ra khoan dung. [secret_target.GetSheHe|U] đã phơi bày âm mưu chiếm [secret_target.GetPrimaryTitle.GetTierAsNameNoTooltip|l] cho riêng Ta với toàn thể [secret_target.GetPrimaryTitle.GetBaseName]!\n\nGiá mà có cách nào bồi thường cho hành động của Ta..."
  every_fellow_vassal_tt: "Mọi [vassal|E]"
  secrets.0131.a: "Xin [ROOT.Char.GetFaith.FateGodName] thương xót Ta."

  secrets.0141.start.desc.intro.other_exposed: "[secret_exposer.GetTitledFirstName] đã tiết lộ toàn bộ âm mưu cho [secret_exposer.GetHerHim]...\n\n"
  secrets.0141.start.desc.intro.self_exposed: "Ta đoán [secret_target.GetTitledFirstName] cũng sẽ phát hiện thôi, bằng cách này hay cách khác...\n\n"
  secrets.0141.start.desc.intro: "Lẽ ra Ta phải biết cuộc đột kích vào [secret_target.GetHouse.GetBaseName] không thể giữ bí mật lâu trong tổ rắn mà chúng ta gọi là [secret_owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]!"
  secrets.0141.desc.target_emperor: "Chúng ta phải sẵn sàng chịu cơn thịnh nộ vô giới hạn của [secret_target.GetTitleAsNameNoTooltip]..."
  secrets.0141.desc.owner_emperor: "Với tư cách [secret_owner.GetTitleAsNameNoTooltip], Ta phải cẩn thận để không khơi mào sự giận dữ của các gia tộc lớn..."
  secrets.0141.desc.fallback: "Với kiến thức này, [secret_target.GetFirstNameNoTooltip] chắc chắn sẽ tìm cách chống lại [secret_owner.GetTopLiege.GetTitleAsNameNoTooltip] đối với Nhà [secret_owner.GetHouse.GetBaseName]..."
  secrets.0141.a: "Để kẻ ngốc nói nhảm!"
  secrets.0142.t: "Kẻ Cướp Bị Lộ"
  secrets.0142.start.desc.intro.other_exposed: "Xin phước lành của [secret_target.GetFaith.HighGodName] cho [secret_exposer.GetTitledFirstName] vì đã vạch trần tội ác của Nhà [secret_owner.GetHouse.GetBaseName]!\n\n"
  secrets.0142.start.desc.intro.self_exposed: "Ngợi khen [secret_target.GetFaith.HighGodNameAlternate] vì đã dẫn dắt Ta vạch trần tội ác của Nhà [secret_owner.GetHouse.GetBaseName]!\n\n"
  secrets.0142.start.desc.intro: "Cuối cùng, chúng ta đã biết ai đứng sau cuộc đột kích tệ hại vào điền trang Nhà [secret_target.GetHouse.GetBaseName]! Kẻ quái ác, [secret_owner.GetTitledFirstName] và Nhà [secret_owner.GetHerHis] ghê tởm!"
  secrets.0142.desc.target_emperor: "Với tư cách [secret_target.GetTitleAsNameNoTooltip], Ta có quyền lực để trừng phạt gia tộc tội lỗi này."
  secrets.0142.desc.owner_emperor: "Chúng ta phải cẩn thận, [secret_owner.GetTitleAsNameNoTooltip] đang chờ đợi bước đi tiếp theo của chúng ta..."
  secrets.0142.desc.fallback: "Giờ chúng ta có thể đưa kẻ thù ra trước [secret_target.GetTopLiege.GetTitleAsNameNoTooltip], và [secret_target.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]!"
  secrets.0142.a: "Âm mưu này không thể tồn tại!"
  secrets.0142.b: "Chúng ta sẽ trả thù, bằng mọi cách..."

  secrets.0500.single_child.t:0 "[child.Custom('GetDaughterSon')|U] Của Kẻ Khác"
  secrets.0500.start.desc:0 "Chuyện này có thật sao?"
  secrets.0500.single_child.desc:0 "[child.GetFirstName] là con của"
  secrets.0500.incest_real_father.desc:0 "[mother.GetTitledFirstNamePossessive] chính là [mother.Custom2('RelationToMeShort', SCOPE.sC('real_father'))], [real_father.GetTitledFirstName],"
  secrets.0500.regular_real_father.desc:0 "[real_father.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)],"
  secrets.0500.end.desc:0 "chứ không phải Ta?\n\nTa nên khóc? La hét? Trừng phạt? Tha thứ? [child.GetFirstNameNoTooltip] luôn được coi là con chính thức của Ta, nhưng Ta không thể phủ nhận bằng chứng trước mắt..."
  secrets.0500.a:0 "Ta cần thời gian suy nghĩ..."

  secrets.0501.t:0 "Nguồn Gốc Thật Của Ta"
  secrets.0501.desc_incest_marriage:0 "Cuối cùng Ta cũng biết ai là [real_father.Custom('MotherFather')] thật sự của Ta – [real_father.GetTitledFirstName]. Ta chỉ ước điều này không đi kèm với sự thật rằng [incest_spouse.Custom('WifeHusband')] [incest_spouse.GetTitledFirstName] cũng là [incest_spouse.Custom('SisterBrother')] của Ta!"
  secrets.0501.desc_unmarried_mother:0 "Sự thật rằng Ta được sinh ra ngoài hôn nhân đã ám ảnh Ta từ khi còn bé.\n\nGiờ khi biết rằng [real_father.GetTitledFirstName] chính là [real_father.Custom('MotherFather')] của Ta, Ta cuối cùng cũng thở phào."
  secrets.0501.desc_married_mother:0 "Chuyện này là trò đùa sao? Một giấc mơ sao? [father.GetFirstName], người đã nuôi Ta, không phải là cha thật sao?\n\nDường như không thực, nhưng Ta không thể phủ nhận bằng chứng trước mắt. Ta được cha khác sinh ra – [real_father.GetTitledFirstName]."
  secrets.0501.a:0 "Sự thật có thể là phước lành, cũng có thể là lời nguyền."

  secrets.0502.single_child.t:0 "Con [child.Custom('GetDaughterSon')|U] Mất Của Ta"
  secrets.0502.single_child_start.desc:0 "Theo [ROOT.Char.GetFaith.HighGodName], [child.GetTitledFirstName] là [child.Custom('GetDaughterSon')] của Ta?!"
  secrets.0502.lover.desc:0 "Ta luôn nghi ngờ, nhưng giờ khi sự thật đã rõ, Ta không biết phải nói gì."
  secrets.0502.unmarried.desc:0 "\n\nViệc [mother.Custom2('MyCharacterIntroduction', ROOT.Char)] mang thai ngoài hôn nhân ai cũng biết, nhưng #EMP sự liên quan chính xác của Ta#! được giữ bí mật, cho đến bây giờ."
  secrets.0502.married.desc:0 "\n\nTất cả chúng Ta đều nghĩ [father.Custom2('MyCharacterIntroduction', ROOT.Char)] là cha. Ai ngờ [mother.GetTitledFirstName] giữ kín sự thật suốt thời gian qua!"
  secrets.0502.end:0 "\n\nLuôn có kẻ khẳng định rằng [child.GetFirstNameNoTooltip] là con chính thức của [father.GetFirstNamePossessiveNoTooltip], nhưng Ta biết sự thật."
  secrets.0502.a.incest:0 "Ta nghĩ mình sắp nôn mửa..."
  secrets.0502.a:0 "[child.GetFirstNameNoTooltip], suốt thời gian qua..."
  secrets.0502.b:0 "Thế giới phải biết!"

  secrets.0503.t:0 "Mối Liên Kết Gần Gũi"
  secrets.0503.incest_accepted.desc:0 "Theo [ROOT.Char.GetFaith.HighGodName], [sibling_partner.GetFirstName] là [sibling_partner.Custom('SisterBrother')] của Ta! Ta đã biết có #EMP gì đó#! đặc biệt… Giờ Ta cảm thấy gần gũi với [consort_bastard.GetHerHim] hơn bao giờ hết."
  secrets.0503.incest.desc:0 "Sự thật về cha mẹ của [sibling_partner.GetFirstNamePossessive] mang đến hệ quả ghê tởm. Nếu chúng Ta cùng cha...\n\nNhững hình ảnh về những lời đã nói, việc đã làm hiện lên trước mắt Ta. Suốt thời gian qua..."
  secrets.0502.likes_incest.a:0 "Ta thực sự may mắn!"
  secrets.0502.dislikes_incest.a:0 "Ta nghĩ mình sắp nôn mửa."

  secrets.0510.t:0 "Kẻ Rắn Bị Lộ"
  secrets.0510.traitor.desc:0 "Ta không thể tin [murderer.GetTitledFirstName] dám âm mưu chống lại Ta! Giết cả [murderer.GetHerHis] [murderer.Custom2('RelationToMeShort', ROOT.Char)]!\n\n"
  secrets.0510.regular.desc:0 "Vừa nhẹ nhõm vừa tức giận khi biết ai định giết Ta. [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] là một con rắn [murderer.Custom2('InsultAdjective', ROOT.Char)]!\n\n"
  secrets.0510.alive.desc:0 "Ta không thể bỏ qua chuyện này — ai mà biết chuyện gì sẽ xảy ra lần tới. Ta tự hỏi phương án tốt nhất là gì..."
  secrets.0510.dead.desc:0 "Kế hoạch của [murderer.GetHerHis|U] thất bại thảm hại. Ta vẫn đứng đây, còn [murderer.GetSheHe] thì mục rữa dưới đất!"
  secrets.0510.a.alive:0 "Ta cần lập kế hoạch bước tiếp theo..."
  secrets.0510.a.dead:0 "Thoát nợ!"

  secrets.0511.regular.desc:0 "Chuyện gì thế này, nhân danh [ROOT.Char.GetFaith.HighGodNamePossessive]! [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã cố giết [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
  secrets.0511.dead.desc:0 "Ít nhất con rắn [murderer.Custom2('InsultAdjective', ROOT.Char)] đó đã chết và được chôn!"
  secrets.0511.alive.desc:0 "Nếu Ta không hành động, [victim.GetFirstNameNoTooltip] vẫn có thể gặp nguy."
 
  secrets.0512.regular.desc:0 "Cuối cùng, Ta đã khám phá ra sự thật! Kẻ [murderer.Custom2('InsultNoun', ROOT.Char)] máu lạnh đứng sau cái chết sớm của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('victim'))] [victim.GetFirstNamePossessive] không ai khác chính là [murderer.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\n"
  secrets.0512.immured.desc:0 "Khi các đặc vụ Ta tìm kỹ [murderer.GetHerHis] [murderer.Custom('ResidenceBuilding')], họ phát hiện một căn phòng bị bịt kín, bên trong là xác [victim.GetFirstNamePossessiveNoTooltip].\n\n"
  secrets.0512.alive.desc:0 "Ôi, [murderer.GetSheHe] nghĩ [murderer.GetSheHe] sẽ thoát tội, nhưng nghe Ta này. [murderer.GetFirstNameNoTooltip] sẽ trả giá đắt cho tội ác của [murderer.GetHerHis]."
  secrets.0512.dead.desc:0 "Mặc dù ta rất vui vì [murderer.GetSheHe] đang thối rữa trong nấm mồ của [murderer.GetHerHis], nhưng có một phần trong ta ước gì [murderer.GetSheHe] vẫn còn sống sờ sờ ngay trước mặt mình. Ta biết một vài hình phạt sẽ thích đáng với [murderer.GetFirstNameNoTooltip] hơn là giấc ngủ ngàn thu..."


  secrets.1001.t:0 "Một Phát Hiện"
  secrets.1001.opening_spymaster:0 "Cuối báo cáo mới nhất của [spymaster.GetCouncilTitle] [spymaster.GetFirstNamePossessive], [spymaster.GetSheHe] dừng lại một chút. "Có điều Ngài nên biết về [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secret_holder'))] của Ngài.""
  secrets.1001.opening_no_spymaster:0 "Đã có tin đồn về [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secret_holder'))] của Ta từ lâu, nhưng Ta chưa thấy bằng chứng cho đến giờ."
  secrets.1001.sexual_habits:0 "\n\nCó vẻ [secret_holder.GetTitledFirstName] có những sở thích tình dục rất khác thường..."
  secrets.1001.secret_relationships:0 "\n\n[secret_holder.GetTitledFirstName] và [secret_lover.GetTitledFirstName] đang có mối quan hệ lén lút!"
  secrets.1001.fallback:0 "\n\n[secret_holder.GetTitledFirstName] dường như có nhiều bí mật."
  secrets.1001.a:0 "Thích [secret_holder.Custom('WomenMen')], Ngài nói sao?"
  secrets.1001.b:0 "Hình như Ta không phải người duy nhất để dục vọng chi phối."
  secrets.1001.c:0 "[secret_holder.GetSheHe] có hiểu nhầm 'chăn nuôi' không?"
  secrets.1001.f:0 "[secret_holder.GetFirstNameNoTooltip] và [secret_lover.GetFirstNameNoTooltip]? Nghe thôi đã thấy ghê tởm!"
  secrets.1001.option_fallback:0 "Nếu Ta không biết đó là thật..."

  secrets.1012.t:0 "Ngài Và Người Yêu"
  secrets.1012.close_relation:0 "Khó mà giấu bí mật với một người Ngài thực sự, và Ta biết từ lâu rằng [first_lover.GetTitledFirstNamePossessive] có hứng thú với [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))] của Ta, [lover.GetTitledFirstName].\n\nGiờ Ta phát hiện rằng đó không chỉ là hứng thú. Hai người họ đang có mối quan hệ lén lút!"
  secrets.1012.desc:0 "Khó mà giấu bí mật với một người Ngài thực sự, và Ta biết từ lâu rằng [first_lover.GetTitledFirstName] quan tâm tới [lover.GetTitledFirstName].\n\nGiờ Ta phát hiện rằng đó không chỉ là quan tâm. Hai người họ đang có mối quan hệ lén lút!"
  secrets.1012.a:0 "Không ngạc nhiên khi [first_lover.GetFirstNameNoTooltip] muốn giữ bí mật này."

  secrets.1101.t:0 "Dòng Dõi Của Chúng Ta"
  secrets.1101.opening:0 "Biết sự thật làm tất cả các mảnh ghép nối lại với nhau."
  secrets.1101.friendly:0 "Dù có nhiều điểm giống nhau, vẫn có những khác biệt lớn giữa chúng Ta, và giờ Ta hiểu rõ lý do."
  secrets.1101.unfriendly:0 "Lẽ ra Ta phải biết rằng khác biệt của chúng Ta không chỉ là những tranh cãi vô tận."
  secrets.1101.end:0 "\n\n[bastard.GetTitledFirstName] không phải con [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('bastard'))] trọn vẹn của Ta, mà là [bastard.Custom('GetDaughterSon')] của [real_father.GetTitledFirstName]!"
  secrets.1101.a:0 "Ta khó mà tin nổi."

  secrets.1102.friendly:0 "Ban đầu Ta chưa chắc, nhưng cách [father.Char.GetSheHe] nhấn mạnh "#EMP [ROOT.Char.Custom('SisterBrother')]#!" khi chào Ta đã làm mọi thứ rõ ràng."
  secrets.1102.unfriendly:0 "Lúc đầu ta không chắc lắm, nhưng cái cách chế giễu mà [father.GetSheHe] nhấn mạnh "#EMP [ROOT.Char.Custom('SisterBrother')]#!" khi [father.GetSheHe] chào ta đã làm mọi chuyện rõ như ban ngày."
  secrets.1102.end:0 "\n\n[father.GetTitledFirstName] biết ai là cha thật sự của Ta."
  secrets.1102.a:0 "[father.GetSheHe] sẽ làm gì với kiến thức này?"

  secrets.2002.t:0 "Không Thể Tha Thứ?"
  secrets.2002.desc:0 "Ta gần như ước chưa từng biết! Nghĩ rằng [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secret_holder'))] của Ta, [secret_holder.GetTitledFirstName], có khả năng giết người...\n\nNgay cả [murdered_character.GetTitledFirstName] cũng không xứng đáng kết cục nhục nhã này."
  secrets.2002.a:0 "Trừng phạt [secret_holder.GetFirstNameNoTooltip] vì tội ác của [secret_holder.GetHerHis]!"
  secrets.2002.a.tt:0 "#F [secret_holder.GetFirstNameNoTooltip] có thể ăn năn.#!"
  secrets.2002.b:0 "Chà, chính trị thật xấu xa."

  secrets.2003.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('close_character'))] của ta tìm đến, một biểu cảm đầy mâu thuẫn hiện rõ trên khuôn mặt [close_character.GetHerHis].\n\n"Ta biết những gì ngài đã làm với [murdered_character.GetTitledFirstName]," [close_character.GetFirstName] nói với ta. "Nghĩ đến việc ngài có khả năng thực hiện một tội ác như vậy... Nó cứ ám ảnh tâm trí ta.""
  secrets.2003.a:0 "Ta đã làm những gì phải làm."
  secrets.2003.b:0 "Ta hối hận về việc đã làm, từng ngày thức dậy!"

  secrets.2004.desc:0 "Bất chấp những lời lẽ gay gắt của mình, ta không ngờ tới phản ứng mà mình nhận được từ [secret_holder.GetTitledFirstName] khi chất vấn [secret_holder.GetHerHim] về cái chết của [murdered_character.GetTitledFirstName].\n\n"Ngài không biết chuyện này đã ám ảnh ta thế nào sao?" [secret_holder.GetSheHe] hỏi. "Thật nhẹ nhõm khi cuối cùng cũng có thể nói với ai đó về sự hối hận của mình.""
  secrets.2004.a:0 "Có lẽ [secret_holder.GetSheHe] có thể được tha thứ theo thời gian."
  secrets.2004.b:0 "Ah, Ta không thể giận ngươi, [target.GetFirstNameNoTooltip]!"

  secrets.3001.t:0 "Chăm Sóc Ta"
  secrets.3001.opening:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('close_character'))] của ta, [close_character.GetTitledFirstName] tìm đến ta, với vẻ mặt đầy lo âu."
  secrets.3001.scheme_owner_known:0 "\n\n"Ta đã tìm thấy một trong những tay sai đang hỗ trợ [known_scheme_owner.GetTitledFirstName] trong âm mưu của [known_scheme_owner.GetHerHis] chống lại ngài! [agent.GetTitledFirstName] đã cố gắng chuyển một báo cáo cho [known_scheme_owner.GetFirstName] vào lúc nửa đêm.""
  secrets.3001.scheme_known:0 "\n\n\"Ta đã tìm ra một trong các đặc vụ tham gia âm mưu chống lại Ngài! [agent.GetTitledFirstName] cố gắng đưa báo cáo đến chủ nhiệm của [agent.GetHerHis] giữa đêm.\""
  secrets.3001.scheme_not_known:0 "\n\n\"Ta tìm thấy một đặc vụ tham gia âm mưu chống lại Ngài! [agent.GetTitledFirstName] cố gắng chuyển báo cáo cho chủ nhiệm của [agent.GetHerHis] giữa đêm.\""
  secrets.3001.a:0 "Cảm ơn ngươi, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('close_character'))]!"

  secrets.4001.t: "Lộ Gian Lận Trong Kỳ Thi"
  secrets.4001.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('minister'))] của ta, [minister.GetTitledFirstName] bước vào phủ đệ của ta cùng với lính gác bên cạnh [minister.GetHerHis].\n\n"Ta hoàn toàn thất vọng về ngài, [ROOT.Char.GetFirstNameNoTooltip]! Ngài đã có một sự nghiệp tốt đẹp, nhưng nó kết thúc ngay tại đây." [minister.GetSheHe] đập mạnh tay xuống bàn ta, để lại một tập tài liệu. "Đây là bằng chứng không thể chối cãi, lời khai của vô số nhân chứng, rằng ngài đã gian lận để vượt qua các kỳ thi của mình.""
  secrets.4001.a: "\"Vô lý! Nhân chứng trực tiếp không đáng tin.\""
  secrets.4001.b: "\"Dù sao đi nữa, ta vẫn là thần tử trung thành của Thiên Tử.\""
  secrets.4001.c: "\"Tượng đất sợ mưa, lời dối sợ sự thật.\""
  exam_cheater_bribe_t: "Kẻ Gian Lận Thi Được Biết Đến Hối Lộ"
  exam_cheater_reimburse_t: "Kẻ Gian Lận Thi Được Biết Đến Hoàn Tiền"
  exam_cheater_guilty_t: "Kẻ Gian Lận Thi Được Biết Đến Có Tội"
