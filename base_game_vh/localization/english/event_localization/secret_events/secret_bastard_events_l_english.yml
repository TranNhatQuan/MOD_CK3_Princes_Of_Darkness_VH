l_english:
  bastardy_pregnancy_announcement_tooltip:0 "Thế giới biết được dòng dõi thật sự của đứa trẻ"

  secret_bastard.0001.t:0 "Một Dòng Dõi Mờ Ám"
  secret_bastard.0001.real_father:0 "Tòa án của [mother.GetTitledFirstNamePossessive] đang ăn mừng sinh nhật của [mother.GetHerHis] đứa con, dường như không biết sự thật. Đứa trẻ trong vòng tay [mother.GetHerHis] không thực sự là của [assumed_father.GetTitledFirstNamePossessive], mà là của ta!"
  secret_bastard.0001.real_father.no_assumed_father:0 "Bên dưới vẻ ngoài ăn mừng, tin đồn đang lan tràn tại tòa án của [mother.GetTitledFirstNamePossessive] sau khi [mother.GetHerHis] sinh con. Nếu họ biết điều ta biết, rằng đứa trẻ trong vòng tay [mother.GetHerHis] thực ra là con của ta..."
  secret_bastard.0001.real_father.multiple:0 "Tòa án của [mother.GetTitledFirstNamePossessive] đang ăn mừng sinh nhật của [mother.GetHerHis] các đứa trẻ, dường như không biết sự thật. Những đứa trẻ trong vòng tay [mother.GetHerHis] không thực sự là của [assumed_father.GetTitledFirstNamePossessive], mà là của ta!"
  secret_bastard.0001.real_father.no_assumed_father.multiple:0 "Bên dưới vẻ ngoài ăn mừng, tin đồn đang lan tràn tại tòa án của [mother.GetTitledFirstNamePossessive] sau khi [mother.GetHerHis] sinh các đứa trẻ. Nếu họ biết điều ta biết, rằng những đứa trẻ trong vòng tay [mother.GetHerHis] thực ra là con của ta..."
  secret_bastard.0001.assumed_father:0 "[ROOT.Char.Custom2('RelationToMe', mother)] của ta, [mother.GetTitledFirstName], ôm chặt đứa con mới sinh vào lòng. Đáng lẽ đây phải là một khoảnh khắc ngập tràn niềm vui nếu như ta không biết sự thật.\n\nĐứa bé mà cô ấy đang ôm ấp không phải là con của ta, mà là nòi giống của [real_father.GetTitledFirstName]!"
  secret_bastard.0001.assumed_father.multiple:0 "[ROOT.Char.Custom2('RelationToMe', mother)] của ta, [mother.GetTitledFirstName], ôm chặt những đứa con mới sinh vào lòng. Đáng lẽ đây phải là một khoảnh khắc ngập tràn niềm vui nếu như ta không biết sự thật.\n\nNhững đứa trẻ mà cô ấy đang ôm ấp không phải là con của ta, mà là nòi giống của [real_father.GetTitledFirstName]!"
  secret_bastard.0001.family_of_mother:0 "[ROOT.Char.Custom2('RelationToMe', mother)] của ta, [mother.GetTitledFirstName], ôm ấp đứa con mới sinh xinh đẹp trong vòng tay. Thế nhưng, ta không khỏi cảm thấy bất an khi biết được huyết thống thực sự của [child.Custom('GetDaughterSon')] của [mother.GetHerHis]. Đứa trẻ không được sinh ra từ cuộc hôn nhân của [ROOT.Char.Custom2('RelationToMe', mother)] của ta với [assumed_father.GetTitledFirstName], mà là kết quả của một mối quan hệ vụng trộm với [real_father.GetTitledFirstName]!\n\nĐiều gì sẽ xảy ra với [mother.GetHerHim] và [ROOT.Char.Custom2('RelationToMe', child)] của ta nếu sự thật bị phơi bày?"
  secret_bastard.0001.family_of_mother.multiple:0 "[ROOT.Char.Custom2('RelationToMe', mother)] của ta, [mother.GetTitledFirstName], ôm ấp những đứa con mới sinh xinh đẹp trong vòng tay. Thế nhưng, ta không khỏi cảm thấy bất an khi biết được huyết thống thực sự của chúng. Những đứa trẻ không được sinh ra từ cuộc hôn nhân của [ROOT.Char.Custom2('RelationToMe', mother)] của ta với [assumed_father.GetTitledFirstName], mà là kết quả của một mối quan hệ vụng trộm với [real_father.GetTitledFirstName]!\n\nĐiều gì sẽ xảy ra với [mother.GetHerHim] và lũ trẻ nếu sự thật bị phơi bày?"
  secret_bastard.0001.family_of_real_father:0 "[mother.GetTitledFirstName] và triều đình của [mother.GetHerHis] đang ăn mừng sự ra đời của đứa con của [assumed_father.GetTitledFirstName], nhưng nếu sự thật được biết đến thì các buổi tiệc tùng có lẽ sẽ trầm lắng hơn nhiều.\n\nĐứa bé mà [mother.GetFirstName] đang ôm chặt vào lòng chính là đứa con hoang của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))] của ta, [real_father.GetTitledFirstName]!"
  secret_bastard.0001.family_of_real_father.multiple:0 "[mother.GetTitledFirstName] và triều đình của [mother.GetHerHis] đang ăn mừng sự ra đời của những đứa con của [assumed_father.GetTitledFirstName], nhưng nếu sự thật được biết đến thì các buổi tiệc tùng có lẽ sẽ trầm lắng hơn nhiều.\n\nNhững đứa bé mà [mother.GetFirstName] đang ôm chặt vào lòng chính là những đứa con hoang của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))] của ta, [real_father.GetTitledFirstName]!"
  secret_bastard.0001.family_of_assumed_father:0 "Tòa án của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('assumed_father'))] của ta, [father.GetTitledFirstName], và [father.GetHerHis] [SCOPE.Char.Custom2('RelationToMe', mother)], [mother.GetTitledFirstName], đang ăn mừng sinh nhật đứa con mới. Tuy nhiên, bầu không khí sẽ u ám nếu sự thật được biết.\n\nĐứa trẻ của [mother.GetFirstNamePossessive] thực ra là con hoang của [real_father.GetTitledFirstName]! Thật là một sự xấu hổ cho nhà ta nếu dòng dõi thật sự của đứa trẻ bị lộ..."
  secret_bastard.0001.family_of_assumed_father.multiple:0 "Tòa án của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('assumed_father'))] của ta, [father.GetTitledFirstName], và [father.GetHerHis] [SCOPE.Char.Custom2('RelationToMe', mother)], [mother.GetTitledFirstName], đang ăn mừng sinh nhật các đứa trẻ mới. Tuy nhiên, bầu không khí sẽ u ám nếu sự thật được biết.\n\nNhững đứa trẻ của [mother.GetFirstNamePossessive] thực ra là con hoang của [real_father.GetTitledFirstName]! Thật là một sự xấu hổ cho nhà ta nếu dòng dõi thật sự của các đứa trẻ bị lộ..."
  secret_bastard.0001.other:0 "Lễ ăn mừng đứa con mới sinh của [mother.GetTitledFirstName] vừa mới bắt đầu, nhưng không khí hẳn sẽ hoàn toàn khác biệt nếu triều đình của [mother.GetHerHis] biết được sự thật.\n\nĐứa trẻ mà [mother.GetSheHe] đang bế trên tay không phải là kết quả từ cuộc hôn nhân của cô với [assumed_father.GetTitledFirstName], mà là nòi giống hoang thai của [real_father.GetTitledFirstName]!"
  secret_bastard.0001.other.multiple:0 "Lễ ăn mừng những đứa con mới sinh của [mother.GetTitledFirstName] vừa mới bắt đầu, nhưng không khí hẳn sẽ hoàn toàn khác biệt nếu triều đình của [mother.GetHerHis] biết được sự thật.\n\nNhững đứa trẻ mà [mother.GetSheHe] đang bế trên tay không phải là kết quả từ cuộc hôn nhân của cô với [assumed_father.GetTitledFirstName], mà là nòi giống hoang thai của [real_father.GetTitledFirstName]!"
  secret_bastard.0001.a:0 "Giá mà họ biết..."

  secret_bastard.0002.t:0 "Dòng Dõi Không Chắc Chắn"
  secret_bastard.0002.real_father:0 "[mother.GetTitledFirstName] mang trong mình gánh nặng sinh con hoang không cha.\n\nĐiều này thật tệ với một [mother.GetWomanMan] chưa kết hôn và [mother.GetHerHis] đứa trẻ, nhưng ta không thể để lộ rằng ta chính là cha thật sự.\n\nÔi, số phận của [child.Custom('GetDaughterSon')] ta sẽ ra sao..."
  secret_bastard.0002.family_of_mother:0 "[ROOT.Char.Custom2('RelationToMe', mother)] của ta, [mother.GetTitledFirstName], đã sinh một đứa trẻ, bị nguyền phải sống như một đứa con hoang không cha.\n\nĐiều này là nỗi xấu hổ cho gia đình ta, nhưng [real_father.GetTitledFirstName] cho đến nay vẫn không chịu thừa nhận là cha của đứa trẻ của [mother.GetFirstNamePossessive], nếu ông ta biết..."
  secret_bastard.0002.family_of_real_father:0 "Đứa trẻ mới sinh của [mother.GetTitledFirstNamePossessive] được biết rộng rãi là con hoang không cha, nhưng ta biết sự thật. Chính [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))] của ta, [real_father.GetTitledFirstName], là cha đứa trẻ đang nằm trong vòng tay cô ấy! Ta chỉ có thể cầu nguyện rằng [real_father.GetFirstName] biết mình đang làm gì."
  secret_bastard.0002.family_of_real_father.dislike:0 "Hy vọng của ta không cao."
  secret_bastard.0002.other:0 "Tin đồn và những lời vu cáo thì thầm về người cha của đứa con hoang mới sinh của [mother.GetTitledFirstNamePossessive] lan truyền khắp nơi.\n\nDĩ nhiên, họ không biết điều ta biết, rằng cha thật sự là [real_father.GetTitledFirstName]!"
  secret_bastard.0002.a:0 "Một vụ bê bối đang chờ xảy ra."
  secret_bastard.0002.b:0 "\"Đợi đã! Đứa trẻ… là của ta!\""

  secret_bastard.0010.t:0 "Bị Phơi Bày"
  secret_bastard.0010.spouse_reveal:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('father'))] của ta phát hiện ra bản chất thật của đứa trẻ, và giờ [father.GetSheHe] đã tiết lộ sự thật với cả thế giới!"
  secret_bastard.0010.other_reveal:0 "Bí mật mà ta cất giữ cẩn thận đã bị [secret_exposer.GetTitledFirstName] kéo ra ánh sáng! Gia đình ta ngần ngại nói chuyện với ta, và [father.GetFirstName] từ chối nhìn thẳng vào mắt ta."
  secret_bastard.0010.desc:0 "\n\nLiệu số phận ta và đứa trẻ sẽ ra sao khi mọi người đều biết [real_father.GetTitledFirstName] mới là cha thật sự?"
  secret_bastard.0010.a:0 "Ta lo cho tương lai của chúng ta!"

  secret_bastard.001.opening:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('mother'))] của ta, [mother.GetTitledFirstName] đã có dấu hiệu mang thai được một thời gian rồi,"

  secret_bastard.0011.t:0 "Vết Nhơ Của Con Hoang"
  secret_bastard.0011.spouse_exposer:0 "và đã đến lúc cả thế giới biết sự thật. [mother.GetSheHe|U] đã cùng chung giường với [real_father.GetTitledFirstName], và [real_father.GetSheHe] mới là cha thật sự!"
  secret_bastard.0011.desc:0 "và ta chưa bao giờ thực sự nghĩ rằng đứa trẻ có thể là của ai khác ngoài ta.\n\nTuy nhiên, giờ đây [mother.GetSheHe] đã công khai thú nhận với thế giới rằng cô ấy đã chung chăn gối với [real_father.GetTitledFirstName], và hắn ta mới là người cha thực sự!"
  secret_bastard.0011.a:0 "Làm sao cô ấy có thể làm vậy?"
  secret_bastard.0011.b:0 "Ngỡ rằng [mother.GetSheHe] từng thề trung thành."

  secret_bastard.0012.t:0 "Vụ Bê Bối"
  secret_bastard.0012.dislike_desc:0 "mọi người đều nghĩ rằng [mother.Custom2('RelationToMe', SCOPE.sC('father'))] của cô ấy, [father.GetTitledFirstName], là cha đứa trẻ. Giờ thì rõ ràng cha thật sự không ai khác ngoài [real_father.GetTitledFirstName]!\n\nÔi, thật là một vụ bê bối!"
  secret_bastard.0012.like_desc:0 "mọi người đều nghĩ rằng [mother.Custom2('RelationToMe', SCOPE.sC('father'))], [father.GetTitledFirstName], là cha đứa trẻ. Giờ thì rõ ràng cha thật sự không ai khác ngoài [real_father.GetTitledFirstName]!\n\nGiá mà nó vẫn còn là bí mật!"
  secret_bastard.0012.a:0 "Giờ mọi người đều biết."

  secret_bastard.0013.t:0 "Đứa Trẻ Của Ta"
  secret_bastard.0013.desc:0 "Mối tình vụng trộm với [mother.GetTitledFirstName] đã sinh ra một đứa trẻ!"
  secret_bastard.0013.secret_exposer:0 "Ta phải để mọi người biết. Đứa trẻ mà [mother.GetTitledFirstName] mang là của ta!\n\nGiờ mọi người đều biết."
  secret_bastard.0013.suspicious_desc:0 "và nghi ngờ của ta rằng ta là cha đứa trẻ đã lớn lên cùng với bụng cô ấy.\n\nGiờ ta biết chắc chắn, và cả vương quốc cũng vậy. Đứa trẻ là của ta!"
  secret_bastard.0013.a:0 "Chắc chắn như vậy là tốt hơn."

  secret_bastard.0014.t:0 "Dấu Hiệu Phản Bội"
  secret_bastard.0014.desc:0 "nhưng ta chưa bao giờ nghĩ rằng [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))] lại liên quan. Giờ thì rõ ràng [real_father.GetFirstName] mới là cha thật sự của đứa trẻ chưa sinh của [mother.GetFirstNamePossessive]!"
  secret_bastard.0014.a:0 "Làm sao anh có thể làm điều này, [real_father.GetFirstNameNoTooltip]?"
 
  secret_bastard.1000.t:0 "Dòng Dõi Rõ Ràng"
  secret_bastard.1000.desc:0 "Không còn bí mật hay che giấu sự thật!\n\nMọi người đều biết rằng đứa trẻ trong bụng ta là con của [real_father.Custom2('MyCharacterIntroductionNoComma' , ROOT.Char)]."
  secret_bastard.1000.real_father_reveal:0 "Không còn bí mật hay che giấu sự thật!\n\n[real_father.Custom2('MyCharacterIntroduction' , ROOT.Char)|U] đã để mọi người biết rằng [real_father.GetSheHe] là cha của đứa trẻ chưa sinh của ta."
  secret_bastard.1000.a:0 "Giờ thì sự thật đã lộ."
  secret_bastard.1000.a.tt:0 "[real_father.GetShortUINameNoTooltip] sẽ được biết là cha của con ta khi đứa trẻ chào đời"

  secret_bastard.1001.t:0 "Dòng Dõi Cháu Nội"
  secret_bastard.1001.desc:0 "Việc [ROOT.Char.Custom2('RelationToMe', mother)], [mother.GetTitledFirstName], mang thai từ một mối quan hệ tội lỗi không phải là bí mật, [mother.GetSheHe] vốn không phải là một [mother.GetWomanMan] đã kết hôn.\n\nTuy nhiên, việc biết rằng [real_father.GetTitledFirstName] là [real_father.GetMotherFather] của đứa trẻ..."
  secret_bastard.1001.a:0 "Làm sao ông ấy có thể đặt [ROOT.Char.Custom2('RelationToMe', mother)] của ta vào tình cảnh này?"

  secret_bastard.1002.t:0 "Ngoài Hôn Nhân"
  secret_bastard.1002.desc:0 "Chẳng có gì bí mật khi [ROOT.Char.Custom2('RelationToMe', mother)] của ta, [mother.GetTitledFirstName] đang mang thai một đứa trẻ được hình thành từ một mối quan hệ đầy tội lỗi, rốt cuộc thì [mother.GetSheHe] cũng đâu phải là một [mother.GetWomanMan] đã có gia đình.\n\nTuy nhiên, ai là người đã làm cho đứa trẻ thụ thai vẫn luôn là một bí ẩn cho đến tận bây giờ – [real_father.GetTitledFirstName] chính là kẻ phải chịu trách nhiệm!"

  secret_bastard.1003.t:0 "[mother.GetFirstNameNoTooltip] và Ta"
  secret_bastard.1003.desc:0 "Việc [ROOT.GetCharacter.Custom2('RelationToMe' , mother)] của ta, [mother.GetTitledFirstName], mang thai đứa con của ta giờ đã trở thành kiến thức phổ biến.\n\nMối tình vụng trộm của chúng ta có thể dẫn đến điều này là khả năng mà ta nhận thức, nhưng phải đối mặt với thực tế của nó..."

  secret_bastard.1004.desc:0 "[mother.GetTitledFirstName] đã mang thai đứa trẻ có dòng dõi không rõ từ lâu, nhưng ta chưa bao giờ nghĩ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))], [real_father.GetTitledFirstName], lại có liên quan.\n\nThật vậy, giờ không còn nghi ngờ gì nữa rằng chính [real_father.GetSheHe] là cha!"

  secret_bastard.2000.t:0 "Sự Thật Được Biết"
  secret_bastard.2000.desc_opening:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã tiết lộ bí mật của ta với thế giới!"
  secret_bastard.2000.desc_opening.me:0 "Cuối cùng đã đến lúc thế giới biết."
  secret_bastard.2000.desc:0 "\n\nTa đã giữ bí mật dòng dõi thật sự của [child.Custom('GetDaughterSon')] [child.GetTitledFirstName] từ trước khi [child.GetSheHe] chào đời. Tuy nhiên, mối quan hệ vụng trộm với [real_father.GetTitledFirstName], cha thật sự của [child.GetHerHis], giờ đã được nhiều người biết!"
  secret_bastard.2000.a:0 "Số phận của [child.Custom('GetDaughterSon')] ta sẽ ra sao?"
 
  secret_bastard.2001.t:0 "Sự Thật"
  secret_bastard.2001.desc_opening.me:0 "Ta đã tiết lộ bằng chứng rằng"
  secret_bastard.2001.desc:0 "[child.GetFirstName] không phải là con hợp pháp của ta."
  secret_bastard.2001.father:0 "Thực ra, [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)] mới là cha thật sự của [child.GetHerHis]!"
  secret_bastard.2001.change_lineage_lowborn.twin:0 "\n\nThật tiếc khi mọi việc phải đi đến mức này, nhưng mọi người cần biết rằng chúng là con hoang hèn hạ."
  secret_bastard.2001.change_lineage_lowborn:0 "\n\nThật tiếc khi mọi việc phải đi đến mức này, nhưng cần biết rằng [child.GetSheHe] là con hoang hèn hạ."
  secret_bastard.2001.change_lineage.twin:0 "\n\nThật tiếc khi mọi việc phải đi đến mức này, nhưng mọi người cần biết rằng chúng là con hoang của Nhà [child.GetHouse.GetBaseName]."
  secret_bastard.2001.change_lineage:0 "\n\nThật tiếc khi mọi việc phải đi đến mức này, nhưng mọi người cần biết rằng [child.GetSheHe] là con hoang của Nhà [child.GetHouse.GetBaseName]."
  secret_bastard.2001.keep_lineage.twin:0 "\n\nDù không thể biết sự thật, dòng dõi của chúng sẽ mãi chìm trong tin đồn và nghi ngờ."
  secret_bastard.2001.keep_lineage:0 "\n\nDù không thể biết sự thật, dòng dõi của [child.GetHerHis] sẽ mãi chìm trong tin đồn và nghi ngờ."
  secret_bastard.2001.a:0 "Như vậy cũng tốt hơn."
  secret_bastard.2001.b:0 "Sự thật phải được biết."

  secret_bastard.2002.t:0 "Một Bí Mật Bị Phơi Bày"
  secret_bastard.2002.i_am_exposer:0 "Ta đã để mọi người biết rằng [child.GetTitledFirstName] thực ra là con của ta! Điều đó cũng đồng nghĩa ta thú nhận những sai lầm với [mother.GetTitledFirstName], nhưng sự thật phải được biết."
  secret_bastard.2002.other_exposer:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã tiết lộ rằng [child.GetTitledFirstName] là con của ta! Nhờ đó, mọi người giờ biết về những sai lầm của ta với [mother.GetTitledFirstName]!"
  secret_bastard.2002.known:0 "\n\nHậu quả với [child.GetFirstNameNoTooltip] có thể nghiêm trọng; một cuộc đời với dòng dõi không chắc chắn không hề dễ dàng."
  secret_bastard.2002.not_known:0 "\n\nDĩ nhiên ta biết mối tình vụng trộm có thể dẫn đến con cái, nhưng ta không ngờ… Sao cô ấy không nói với ta trước?!"
  secret_bastard.2002.assumed_father_exists:0 "\n\nSẽ luôn có những người khẳng định [child.GetSheHe] là con hợp pháp của [father.GetTitledFirstNamePossessive], nhưng họ không thể xua tan bóng nghi ngờ."
  secret_bastard.2002.a:0 "Bí mật đã lộ!"
  secret_bastard.2002.b:0 "Ôi, [child.GetFirstNameNoTooltip]..."

  secret_bastard.2003.t:0 "Một Bí Mật Đen Tối"
  secret_bastard.2003.i_exposed:0 "Cuối cùng đã đến lúc sự thật được biết."
  secret_bastard.2003.other_exposer:0 "Bí mật mà ta mang theo bấy lâu giờ đã bị [secret_exposer.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] phơi bày."
  secret_bastard.2003.known:1 "Sự thật rằng [real_father.GetTitledFirstName] là cha thật sự của ta, chứ không phải [father.GetTitledFirstName] như [mother.Custom('MotherFather')] từng muốn mọi người tin, cuối cùng đã trở thành kiến thức chung."
  secret_bastard.2003.not_known:1 "Ta là một đứa con hoang sao?! [father.GetTitledFirstName], người [father.GetWomanMan] mà ta đã lớn lên với niềm tin rằng đó là cha mình, hoàn toàn không có chút máu mủ nào với ta! [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã tiết lộ rằng [father.Custom('MotherFather')] thực sự của ta dường như là [real_father.GetTitledFirstName], và [mother.Custom('MotherFather')] của ta, [mother.GetTitledFirstName] thậm chí chưa từng hé răng nói với ta nửa lời."
  secret_bastard.2003.desc_ending_exposer:0 "\n\nTa không thể tin rằng cha ta — rằng [father.GetTitledFirstName] — lại tiết lộ bí mật này với mọi người!"
  secret_bastard.2003.desc_ending_known:0 "\n\nCuộc sống của ta sẽ không bao giờ như trước nữa!"
  secret_bastard.2003.desc_ending_not_known:0 "\n\nNgỡ rằng [mother.Custom('MotherFather')] sẽ không làm điều này với ta!"
  secret_bastard.2003.a:0 "Thật là một thảm họa!"

  secret_bastard.2004.t:0 "Dòng Dõi Lộn Xộn"
  secret_bastard.2004.likes:0 "Việc [child.GetTitledFirstName] là đứa con ngoài giá thú của [mother.GetTitledFirstName] và [real_father.GetTitledFirstName] là một bí mật mà Ta biết, nhưng giờ thì mọi người cũng biết!\n\nThật khó tin rằng [child.GetTitledFirstName] lại là kết quả của một mối quan hệ đáng xấu hổ như vậy. Ta chỉ hy vọng sự giải thoát của sự thật được phơi bày sẽ mang lại điều tốt cho [child.GetHerHim]."
  secret_bastard.2004.dislikes:0 "Sự thật cuối cùng đã lộ!\n\nRằng [child.GetTitledFirstName] là kết quả của một mối quan hệ tội lỗi giữa [real_father.GetTitledFirstName] và [mother.GetTitledFirstName] là điều mà mọi người trong triều đều thì thầm bàn tán.\n\n[child.GetSheHe|U] luôn cư xử không xứng với một đứa trẻ hợp pháp, và giờ [child.GetSheHe] cuối cùng sẽ được đối xử đúng với địa vị của [child.GetHerHis]."
  secret_bastard.2004.a:0 "Thương [child.GetTitledFirstNameNoTooltip] quá!"
  secret_bastard.2004.b:0 "Ngẫm xem [child.GetFirstNameNoTooltip] phải xấu hổ thế nào!"
  secret_bastard.2004.c:0 "Thương [child.GetFirstNameNoTooltip] và [child_twin.GetFirstNameNoTooltip] quá!"
  secret_bastard.2004.d:0 "Ngẫm xem họ phải xấu hổ thế nào!"
  secret_bastard.2005.t:0 "Bí Mật Bị Phơi Bày"
  secret_bastard.2005.alive:0 "[child.GetTitledFirstName] là đứa con hoang của [ROOT.Char.Custom2('RelationToMe', mother)] của ta, [mother.GetTitledFirstName] và [real_father.GetTitledFirstName]!\n\nThật không thể ngờ rằng [mother.GetSheHe] lại hành động một cách đáng xấu hổ như vậy đối với [father.GetTitledFirstName], lén lút sau lưng [father.GetHerHis] và phạm tội ngoại tình."
  secret_bastard.2005.dead:0 "[child.GetTitledFirstName] là đứa con ngoài giá thú của [ROOT.Char.Custom2('RelationToMe', mother)] [mother.GetTitledFirstName] và [real_father.GetTitledFirstName]!\n\nNgẫm rằng cố [father.GetTitledFirstName] đã bị [mother.GetTitledFirstName] lừa dối một cách tồi tệ."
  secret_bastard.2005.end:0 "\n\nLàm sao Ta có thể tin tưởng [mother.GetHerHim] một lần nữa đây?"
  secret_bastard.2005.a:0 "[mother.GetSheHe|U] thật không chung thủy!"
  secret_bastard.3000.t:0 "Bí Mật Bị Phơi Bày"
  secret_bastard.3000.married_known:0 "\"Ngươi có một đứa con hoang?!\"\nVợ Ta đối chất Ta với một sự thật gây sốc, và Ta không có câu trả lời nào tốt.\n\nTa đã biết rằng [child.GetTitledFirstName] là kết quả của mối quan hệ vụng trộm với [mother.GetTitledFirstName], nhưng việc dòng dõi thật sự của [child.GetHerHis] giờ đã được biết khiến Ta ngỡ ngàng. Ta phải làm gì đây?"
  secret_bastard.3000.married_not_known:0 "\"Ngươi có một đứa con hoang?!\"\nVợ Ta đối chất Ta với một sự thật gây sốc, và Ta không có câu trả lời nào tốt.\n\nTa cũng ngạc nhiên như bất kỳ ai, mặc dù tất nhiên Ta biết có nguy cơ điều này xảy ra. Nhưng việc [mother.GetTitledFirstName] không nói cho Ta biết dòng dõi thật của [child.GetTitledFirstName] trước đó… Ta phải làm gì đây?"
  secret_bastard.3000.known:0 "Bí mật rằng [child.GetTitledFirstName] là con của Ta bỗng dưng trở thành đề tài bàn tán khắp nơi!\n\nTa đã biết [child.GetFirstNameNoTooltip] là kết quả của mối quan hệ vụng trộm với [mother.GetTitledFirstName], nhưng hậu quả với [child.GetFirstNameNoTooltip] có thể rất nghiêm trọng. Sống như một đứa con hoang không hề dễ dàng."
  secret_bastard.3000.not_known:0 "Bí mật rằng [child.GetTitledFirstName] là con của Ta bỗng dưng trở thành đề tài bàn tán khắp nơi!\n\nMặc dù Ta ngạc nhiên như bất kỳ ai, tất nhiên Ta biết có nguy cơ điều này xảy ra. Nhưng cô ấy không nói cho Ta biết trước…"
  secret_bastard.3000.a:0 "Giờ thì mọi người cũng biết rồi!"
  secret_bastard.3000.b:0 "Thật là một thảm họa!"

  secret_bastard.3001.t:0 "Dòng Dõi Thật Sự Của Ta"
  secret_bastard.3001.incest_marriage:0 "[real_father.GetTitledFirstName] là [real_father.Custom('MotherFather')] của Ta!\n\nBiết được sự thật là một sự nhẹ nhõm lớn, nhưng cũng mang đến… rắc rối. [incest_spouse.Custom('WifeHusband')] của Ta, [incest_spouse.GetTitledFirstName], là [real_father.Custom2('RelationToMe', SCOPE.sC('incest_spouse'))] của [real_father.GetFirstName] – nghĩa là [incest_spouse.GetSheHe] cũng là [incest_spouse.Custom('SisterBrother')] của Ta!"
  secret_bastard.3001.known:0 "Việc Ta sinh ra ngoài hôn nhân đã ám ảnh Ta suốt đời. Biết rằng [real_father.GetTitledFirstName] là cha Ta, nhưng chưa bao giờ được nhắc đến, là một gánh nặng nặng nề.\n\nGiờ bí mật đã lộ, Ta cảm thấy nhẹ nhõm!"
  secret_bastard.3001.not_known:0 "Việc Ta sinh ra ngoài hôn nhân đã ám ảnh Ta từ khi sinh ra. Ta bị xa lánh và chế nhạo, nhưng mẹ Ta từ chối tiết lộ dòng dõi thật sự dù Ta có van nài nhiều đến đâu.\n\n\"Được vậy là tốt nhất, không nên nhắc tới những chuyện này.\"\n\nGiờ khi biết được sự thật, Ta cuối cùng có thể thở phào, kiến thức rằng [real_father.GetTitledFirstName] là cha Ta mang lại sự bình yên mà Ta đã lâu không có."
  secret_bastard.3001.a:0 "Giờ sự thật đã được biết!"
  secret_bastard.3001.b:0 "Cuối cùng Ta biết cha mình là ai!"
