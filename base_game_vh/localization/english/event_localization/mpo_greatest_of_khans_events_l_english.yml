l_english:

  mpo_great_war_of_defiance_cb: "Đại Chiến Phản Kháng"
  MPO_GREAT_WAR_OF_DEFIANCE_NAME: "$mpo_great_war_of_defiance_cb$ chống lại [DEFENDER.GetShortUINameNotMe]"
  MPO_GREAT_WAR_OF_DEFIANCE_NAME_MY: "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')]$mpo_great_war_of_defiance_cb$ chống lại [DEFENDER.GetShortUIName]"
  MPO_GREAT_WAR_OF_DEFIANCE_NAME_BASE: "$mpo_great_war_of_defiance_cb$"
  mpo_war_of_defiance_gok_loses_defender: "Ngài bị [attacker.GetShortUIName] giam cầm, và tất cả [titles|E], [vassals|E] và [tributaries|E] trên đất đai của Ngài trở nên độc lập. Phần lớn [herd|E], [prestige|E], [gold|E], [nomadic_authority|E] và [legitimacy|E] của Ngài bị mất."
  mpo_war_of_defiance_gok_loses_attacker: "[defender.GetShortUIName] bị Ngài giam cầm, nhục nhã, nghèo nàn và mất tất cả [landed|E] [titles|E]. [defender.GetHerHis|U] [vassals|E], [counties|E] và [tributaries|E] trở nên độc lập."
  mpo_war_of_defiance_gok_loses_other: "[defender.GetShortUIName] bị [attacker.GetShortUIName] giam cầm, nhục nhã, nghèo nàn và mất tất cả [landed|E] [titles|E]. [defender.GetHerHis|U] [vassals|E], [counties|E] và [tributaries|E] trở nên độc lập."
  mpo_war_of_defiance_gok_wins_defender: "[independent|E] [nomads|E] bị đánh bại trở thành [obedient|E] [vassals|E] của Ngài. Tất cả [truces|E] khác với Ngài bị xóa bỏ. Ngài trở thành [GetTrait('greatest_of_khans').GetName( GetNullCharacter )] và nhận các lợi ích mạnh mẽ trong việc chinh phục toàn cầu."
  mpo_war_of_defiance_gok_wins_other: "[independent|E] [nomads|E] bị đánh bại trở thành [defender.GetShortUINamePossessive] [obedient|E] [vassals|E]. Tất cả [truces|E] khác với [defender.GetShortUIName] bị xóa bỏ. [defender.GetShortUIName] trở thành [GetTrait('greatest_of_khans').GetName( GetNullCharacter )] và nhận các lợi ích mạnh mẽ trong việc chinh phục toàn cầu."
  accolade_attackers_all_gain_glory_tt: "#high Kẻ Tấn Công'#! @accolade_icon![accolades|E] nhận được [glory|E] đáng kể"
  accolade_defenders_all_gain_glory_tt: "#high Kẻ Phòng Thủ'#! @accolade_icon![accolades|E] nhận được [glory|E] đáng kể"
  mpo_war_of_defiance_gold_herd_tt: "Mỗi #high Kẻ Tấn Công#! nhận @herd_icon![herd|E] và @gold_icon![gold|E]"
  custom.every_defender_vassal: "Mỗi [vassals|E] của [defender.GetShortUINamePossessive]"
  custom.every_defender_tributary: "Mỗi [tributaries|E] của [defender.GetShortUINamePossessive]"
  great_war_of_defiance_attackers_gold_tt: "Được @gold_icon![gold|E] bởi mỗi #high Kẻ Tấn Công#!"
  gok_delete_all_truces_tt: "Mọi [truce|E] hiện có kết thúc"
  will_become_greatest_of_khans_tt: "Trở thành [GetTrait('greatest_of_khans').GetName( GetNullCharacter )]... và sự chinh phục thế giới bắt đầu"
  every_new_vassal_becomes_obedient_tt: "Mỗi [vassal|E] mới trở thành [obedient|E] ít nhất #high 10 năm#!"

  msg_great_war_of_defiance_war_invalidated_message: "[war.GetName] không có mục đích: [defender.GetShortUIName] không thể trở thành [GetTrait('greatest_of_khans').GetName( GetNullCharacter )]."

  war_declared_opening_mpo_gok: "[ROOT.War.GetActiveCB.GetDefender.GetTitledFirstNameNoTooltip], ngươi chó bọt mép,\n\n"
  war_declared_flavor_mpo_gok: "Tất cả thịt trên trái đất không dành cho hàm răng đói khát của ngươi. Thế giới sẽ không bao giờ thuộc về ngươi.\n\nChúng ta đồng lòng từ chối quyền lực của ngươi, hạ ngươi xuống! Chưa bao giờ ngươi quay lưng hay giơ mông ngựa. Và vì vậy, chúng ta sẽ có chiến tranh."

  mpo_greatest_of_khans.0101.t: "Chiến Tranh Trời Đất"
  mpo_greatest_of_khans.0101.desc_intro: "Vô số bộ tộc nổi dậy chống lại Ta, bị kích động chiến tranh bởi"
  mpo_greatest_of_khans.0101.desc_gok_opponent: "[primary_coalition_defender.GetName]. Và quân đội của [gok_opponent.GetPrimaryTitle.GetNameNoTier] gia nhập họ — [gok_opponent.GetTitledFirstName] tuyệt vọng muốn thấy Đại Mãn Châu chia rẽ!"
  mpo_greatest_of_khans.0101.desc_primary_attacker: "giọng nói đen tối và túi nặng của [primary_coalition_defender.GetName]."
  mpo_greatest_of_khans.0101.desc_sub: "\n\nNhững người khác, yếu đuối và sợ hãi, bò đến [ROOT.Char.GetCapitalLocation.GetName] và gia nhập [big_sub.GetName] để đầu hàng Ta."
  mpo_greatest_of_khans.0101.desc: "\n\n\"Tất cả các dòng tộc dưới [ROOT.Char.GetPrimaryTitle.GetName] được gọi!\" kêu lên [ROOT.Char.Custom2('RelationToMeShort', vassal_1)], [vassal_1.GetTitledFirstName], \"Những người dũng cảm cưỡi ngựa chiến! Chúng ta tiến tới nơi cờ ngựa của ngươi đón gió!\""

  gok_submitters_became_tributaries_tt: "Nhiều [rulers|E] láng giềng  nhỏ trở thành [obedient|E] [tributaries|E] của Ngài"

  mpo_greatest_of_khans.0101.a: "Còn #EMP kẻ hèn nhát?#! Ta sẽ bắt họ cưỡi ngựa nữa!"
  mpo_greatest_of_khans.0101.a.flavor: "Gửi gia đình Ta đi van nài họ sẽ mang một số đến chiến trận... nhưng mất đi lòng tự hào."
  mpo_greatest_of_khans.0101.b: "Hãy giữ sức cho các cuộc chiến sắp tới."
  mpo_greatest_of_khans.0101.b.flavor: "Ta tự mình chiến đấu."
  mpo_greatest_of_khans.0101.c: "Chúng ta sẽ có thế giới — hoặc chúng ta sẽ chết!"

  became_your_tributary_tt: "Trở thành [tributary|E] của Ngài"
  gok_fights_alone_reward_on_victory_tt: "Nếu Ngài trở thành [GetTrait('greatest_of_khans').GetName( GetNullCharacter )], Ngài sẽ nhận @dynasty_prestige_icon![dynasty_prestige|E] dựa trên số lượng và [title_tier|E] của [vassals|E] này"
  gok_obedient_vassals_leave_war_tt: "@alert_icon! #alert_trial Tất cả [vassals|E] đã tham gia [war|E] bên Ngài sẽ bị loại khỏi các tham gia#!"
  gok_joiners_wars_cancelled_tt: "Những [vassals|E] này sẽ bị loại khỏi các [wars|E] khác hoặc kết thúc chúng bằng [white_peace|E]"

  mpo_greatest_of_khans.0102.t: "Vươn Ra Vũ Trụ"
  mpo_greatest_of_khans.0102.desc: "Những kỵ sĩ mặt tái và dân chúng tàn phá tràn ra từ vùng đất khắc nghiệt của [gurkhan_to_gok.GetPrimaryTitle.GetBaseNameNoTier], tất cả đều khóc tên giống nhau - [gurkhan_to_gok.GetName]!\n\n[gurkhan_to_gok.GetSheHe|U], kẻ du mục đáng sợ nhất, giờ yêu cầu sự phục tùng của tất cả các dòng tộc. Họ, dưới cờ máu của [gurkhan_to_gok.GetHerHis], mơ ước chinh phục toàn thế giới!\n\nMột liên minh rộng lớn, được tập hợp bởi [primary_coalition_defender.GetName], chống lại niềm kiêu hãnh của [gurkhan_to_gok.GetTitledFirstNamePossessiveNoTooltip]... chiến tranh đã bắt đầu, và cái chết vang lên theo tiếng vó ngựa."
  mpo_greatest_of_khans.0102.a: "#EMP Khan của các Khan, Ta cưỡi cùng bên ngài!#!"
  mpo_greatest_of_khans.0102.b: "Chúng ta phải hạ [gurkhan_to_gok.GetTitledFirstNameNoTooltip]!"
  mpo_greatest_of_khans.0102.c: "[gurkhan_to_gok.GetFirstNameNoTooltip] không thể bị ngăn cản. Ta phải phục tùng."
  mpo_greatest_of_khans.0102.d: "Kẻ chinh phục này có thể nhận lời thề của ta."
  mpo_greatest_of_khans.0102.e: "Bầu trời tối sầm bởi mũi tên, và định mệnh trượt khỏi tầm nhìn..."

  gok_took_become_gok_decision_tt: "Đã thực hiện #high $mpo_become_greatest_of_khans_decision$#! [decision|E]"
  gok_began_war_of_defiance_tt: "Bắt đầu #high $mpo_great_war_of_defiance_cb$#! chống lại tất cả [nomads|E] trong [situation_sub_regions|E] chung của [the_great_steppe|E]"
  gok_gurkhan_declared_intent_tt: "@warning_icon! #X Nếu #high $mpo_great_war_of_defiance_cb$#! thắng, họ sẽ trở thành [GetTrait('greatest_of_khans').GetName( GetNullCharacter )] và bắt đầu chinh phục thế giới#!"
  gok_warning_one_off_tt: "@alert_icon! #alert_trial Không [ruler|E] nào khác sẽ có thể trở thành [GetTrait('greatest_of_khans').GetName( GetNullCharacter )]#!"

  mpo_greatest_of_khans.0103.t: "Những Khan Thấp Nhất"

  mpo_greatest_of_khans.0103.desc_defender_intro: "Ta, kẻ mạnh nhất trong tất cả du mục — hổ tuyết vĩ đại dám gọi mọi sói và mèo rừng khuất phục — bị đánh bại, xiềng xích.\n\n[defender.GetFirstName], [defender.GetLadyLord] của [defender.GetDomicile.GetCulture.GetCollectiveNoun], sẽ không trở thành Khan Vĩ Đại.\n\nBước tiến trên thảo nguyên lại rơi vào hỗn loạn."
  mpo_greatest_of_khans.0103.desc_intro: "Kẻ mạnh nhất trong tất cả du mục — hổ tuyết vĩ đại dám gọi mọi sói và mèo rừng khuất phục — bị đánh bại, xiềng xích.\n\n[defender.GetFirstName], [defender.GetLadyLord] của [defender.GetDomicile.GetCulture.GetCollectiveNoun], sẽ không trở thành Khan Vĩ Đại.\n\nBước tiến trên thảo nguyên lại rơi vào hỗn loạn."
  mpo_greatest_of_khans.0103.desc_defender: "Những chiến binh tuyệt vọng của Ta quay lưng với Ta, bán Ta cho [attacker.GetName]. Dân chúng khinh bỉ gia đình, giấc mơ, và tên tuổi của Ta.\n\nTa không phải là [defender.Custom('GetDaughterSon')] của định mệnh."
  mpo_greatest_of_khans.0103.desc_attacker: "Ta đã phá vỡ quyền lực của kẻ thù trên các thủ lĩnh! Giờ đây, những con chó sẽ chảy máu cho nhau để tranh mảnh vụn."
  mpo_greatest_of_khans.0103.desc_defenders: "Chúng Ta cúi mặt đầy gió trong xấu hổ, cất dây cung sờn rách, và nguyền rủa những điềm báo giả khiến chúng Ta theo một [defender.GetWomanMan] không xứng đáng vào chiến tranh..."
  mpo_greatest_of_khans.0103.desc_attackers: "Chiến thắng tự hào của chúng Ta đã phá tan ý chí của dân [defender.GetFirstNamePossessiveNoTooltip], và chúng Ta, những kẻ chiến đấu cùng nhau, vui mừng! Kẻ thù của tất cả chúng Ta đã bị kéo trước [attacker.GetName] trong nhục nhã."
  mpo_greatest_of_khans.0103.desc: "Dân [defender.GetFirstNamePossessiveNoTooltip] bị phân tán, bị truy đuổi từ đồng cỏ này sang đồng cỏ khác bởi đồng minh [attacker.GetTitledFirstNamePossessive]. Nơi từng là một mối đe dọa lớn, giờ là tranh giành xác thối."
  mpo_greatest_of_khans.0103.a: "Nhưng một ngày nào đó, một bậc thầy thực sự cho tất cả du mục có thể xuất hiện..."

  mpo_greatest_of_khans.0001.t: "Kurultai Của Ta Nói — Cho Toàn Thế Giới!"
  mpo_greatest_of_khans.0001.desc: "Trên Trời có nhiều ánh sáng vĩ đại. Trên Trời, mặt trời, mặt trăng và các vì sao. Nhưng trên đất, chỉ có một Khan.\n\nTa, [ROOT.Char.GetFirstName], là Khan đó — Khan Vĩ Đại Nhất.\n\nSau chiến thắng trước những con rắn quấn quanh chân Ta, không ai dám chống lại Ta tại Kurultai của tất cả các dòng tộc. Nhiệt tình, các thủ lĩnh đầu hàng và đưa lời thề, khao khát chinh phục vũ trụ.\n\nNhững tia nắng đầu tiên chiếu qua chân trời. Ta lên ngựa, và toàn bộ quân đội của [ROOT.Char.GetPrimaryTitle.GetNameNoTier] gầm thét."

  mpo_greatest_of_khans.0001.a: "Ta sẽ chiếm lấy thế giới."
  mpo_greatest_of_khans.0001.mongol_invasion_cb: "Ta có thể sử dụng [mongol_invasion_casus_belli|E]"

  mpo_greatest_of_khans.0002.a: "Mọi thứ thuộc về [genghis_khan.GetTitledFirstNameNoTooltip]."
  mpo_greatest_of_khans.0002.b: "Chỉ khi đoàn kết, chúng ta, các thủ lĩnh, mới chống lại [genghis_khan.GetFirstNameNoTooltip]."

  mpo_greatest_of_khans.0003.t: "Một Danh Hiệu cho [ROOT.Char.GetTitleAsNameNoTooltip]"
  mpo_greatest_of_khans.0003.desc: "Những điềm báo quyền lực thì nhiều.\n\nThiên Địa, người ta nói, đang vươn tay bảo vệ ta. Trong những giấc mơ, trong cột bụi, những con bò tót hùng dũng hứa mang tai ương cho kẻ thù. Những chiến mã đẹp, những con ngựa cái, quà tặng từ lều cung điện... các trưởng lão bộ tộc hứa hẹn, liên tục...\n\nTa cần một danh hiệu xứng đáng với số mệnh này."
  mpo_greatest_of_khans.0003.a: "Ta là #EMP $nick_genghis_khan$#!."
  mpo_greatest_of_khans.0003.b: "Ta là #EMP $nick_cengiz_khan$#!."
  mpo_greatest_of_khans.0003.c: "#EMP $nick_yekhe_khagan$#!: Vĩ Đại."
  mpo_greatest_of_khans.0003.d: "#EMP $nick_dort_yonlug_khagan$#!: Chủ Nhân Bốn Phương."
  mpo_greatest_of_khans.0003.e: "#EMP $nick_tengri_khagan$#!: Thiên Sinh."
  mpo_greatest_of_khans.0003.f: "#EMP $nick_xormuzta$#!: thần thánh, cổ xưa và khôn ngoan."
  mpo_greatest_of_khans.0003.g: "#EMP $nick_cihangir$#!: Kẻ Chinh Phục Thế Giới!"
  mpo_greatest_of_khans.0003.h: "#EMP $nick_mar_sargis$#!: được dẫn dắt bởi vị tử đạo thánh!"
  mpo_greatest_of_khans.0003.i: "#EMP $nick_akhshunwar$#!: Kẻ Mang Quyền Lực!"
  mpo_greatest_of_khans.0003.j: "#EMP [ROOT.Char.GetCulture.GetNameNoTooltip] Khagan#!: kẻ thật sự duy nhất của [ROOT.Char.GetCulture.GetNameNoTooltip]."
  mpo_greatest_of_khans.0003.k: "Ta chỉ cần danh xưng của riêng ta."

  gok_event_troops: "Binh Đoàn [ROOT.Char.GetCulture.GetNameNoTooltip]"
  become_gok_decision_now_unavailable_tt: "@alert_icon! #alert_trial #high $mpo_become_greatest_of_khans_decision$#! [decision|E] hiện không thể thực hiện nữa#!"

  mpo_gok_onslaught_cb: "Cuộc Tấn Công của Những Khan Vĩ Đại"
  MPO_GOK_ONSLAUGHT_NAME: "Cuộc Xung Kích [ATTACKER.GetPrimaryTitle.GetAdjective] vào [DEFENDER.GetPrimaryTitle.GetBaseNameNoTier]"
  MPO_GOK_ONSLAUGHT_NAME_MY: "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')][ATTACKER.GetPrimaryTitle.GetAdjective] Cuộc Xung Kích vào [DEFENDER.GetPrimaryTitle.GetBaseNameNoTier]"
  MPO_GOK_ONSLAUGHT_NAME_BASE: "[ATTACKER.GetPrimaryTitle.GetAdjective] Cuộc Xung Kích vào [DEFENDER.GetPrimaryTitle.GetBaseNameNoTier]"
  gok_subjugated_army_name_subject_troops: "Quân Chủng [army_origin_realm.GetAdjectiveNoTooltip|U] Phụ Thuộc"
  mpo_war_nomad_army_name: "Binh Đoàn [army_culture.GetNameNoTooltip|U]"
  gok_offer_submission_acceptance_bonus_tt: "Tất cả [rulers|E] trở nên dễ chấp nhận #high $mpo_offer_submission_or_ruin$#! [interaction|E]"
  gok_cb_event_troops_tt: "Nhận một quân đoàn [special_troops|E], kích cỡ theo [gok_victim.GetShortUINamePossessive] [realm|E]"
  refused_the_great_khan_opinion: "Từ chối Lòng Thương Xót của Những Khan Vĩ Đại"
  tried_to_become_gok_opinion: "Đã cố trở thành Những Khan Vĩ Đại"
  gok_sacking_cultural_acceptance: "Trừng phạt tàn bạo từ một đạo quân xâm lược"
  gok_slaughter.t: "Thảm sát tại [defender.GetCapitalLocation.GetNameNoTooltip]"
  gok_slaughter.tooltip: "Người ta nói rằng, trong đống xác chết [defender.GetPrimaryTitle.GetAdjective], có #N [gok_slaughter_value]#! quý tộc bị tàn sát không thể nhận ra.\n\n[defender.GetTitleAsName] đã chọn chống lại [attacker.GetPrimaryTitle.GetAdjective] [attacker.GetTitleAsName]."
  gok_slaughter_victim.t: "Bị Giết bởi Kẻ Xâm Lược"
  gok_destruction.t: "[defender.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] Bị Tàn Phá"
  gok_destruction.tooltip: "Các đạo quân [attacker.GetPrimaryTitle.GetAdjective] tràn qua đất đai của [defender.GetTitledFirstName]! Trong cơn thịnh nộ, họ san phẳng #N [destroyed_holdings]#! [holdings|E] và giết mọi cư dân.\n\nĐây là cơn thịnh nộ vĩ đại của [attacker.GetTitleAsNamePossessive]."

  gok_slaughter_victim.tooltip: "[victim.GetShortUIName] bị bắt gặp trong cuộc tiến quân của đạo quân [gok.GetPrimaryTitle.GetAdjective] và bị giết tàn nhẫn."
  custom.every_taken_county: "Mỗi [county|E] mới chiếm được"
  mpo_gok_onslaught_victory_attacker_admin: "Ngài chiếm toàn bộ đất đai và danh hiệu của [defender.GetShortUINamePossessive]."
  mpo_gok_onslaught_victory_defender_admin: "[attacker.GetShortUIName|U] chiếm toàn bộ đất đai và danh hiệu của Ngài!"
  mpo_gok_onslaught_victory_admin: "[attacker.GetShortUIName|U] chiếm toàn bộ đất đai và danh hiệu của [defender.GetShortUINamePossessive]."
  mpo_gok_onslaught_victory_attacker: "Ngài chiếm toàn bộ đất đai của [defender.GetShortUINamePossessive], cũng như danh hiệu thuộc về [defender.GetHerHim] và [defender.GetHerHis] các chư hầu mạnh hơn."
  mpo_gok_onslaught_victory_defender: "[attacker.GetShortUIName|U] chiếm toàn bộ đất đai của Ngài, cũng như danh hiệu thuộc về Ngài và các chư hầu mạnh hơn!"
  mpo_gok_onslaught_victory: "[attacker.GetShortUIName|U] chiếm toàn bộ đất đai của [defender.GetShortUINamePossessive], cũng như danh hiệu thuộc về [defender.GetHerHim] và [defender.GetHerHis] các chư hầu mạnh hơn."
  mpo_gok_onslaught_white_peace: "[defender.GetShortUIName|U] vẫn là người cai trị độc lập, chỉ mất các hạt đã bị chiếm đóng."
  mpo_gok_onslaught_white_peace_defender: "Ngài vẫn là người cai trị độc lập, chỉ mất các hạt đã bị chiếm đóng."
  mpo_gok_onslaught_defeat_attacker: "$mpo_gok_onslaught_white_peace$ Ngài bị nhục nhã."
  mpo_gok_onslaught_defeat_defender: "$mpo_gok_onslaught_white_peace_defender$ [attacker.GetShortUIName|U] bị nhục nhã."
  mpo_gok_onslaught_defeat: "$mpo_gok_onslaught_white_peace$ [attacker.GetShortUIName|U] bị nhục nhã."

  mpo_greatest_of_khans.0020_title: "[recipient.GetTitledFirstNameNoTooltip] Khuất Phục"
  goK_war_gain_all_titles: "Nhận #high tất cả#! [vassals|E] và [titles|E] của [defender.GetShortUINamePossessive] dưới [empire|E]-[title_tier|E]"
  goK_war_gain_vassal_titles: "Nhận hầu hết [landed|E] [titles|E] do [defender.GetShortUINamePossessive] [duchy|E] và [kingdom|E]-[title_tier|E] nắm giữ, không bao gồm [administrative|E] [vassals|E]"

  mpo_greatest_of_khans.0021.opening: "Đại [actor.GetTitledFirstNameNoTooltip], Người Thống Nhất Các Bộ Tộc Ngựa,"
  mpo_greatest_of_khans.0021.desc_nomad: "Số mệnh thuộc về Ngài, cũng như [recipient.GetDomicile.GetCulture.GetCollectiveNoun].\n\nTa, [recipient.GetFirstName], hứa trao trọn sức mạnh. Với những kỵ sĩ giỏi nhất, ta sẽ trở thành cánh tay phải của Ngài."
  mpo_greatest_of_khans.0021.desc: "Ta khuất phục. Chỉ phải rằng ta, và tất cả những chủ quyền trên đất, đều kính sợ và tôn trọng sự vĩ đại và quyền lực của ngươi.\n\nBóng tối đáng sợ của ngươi phủ lên tường nhà ta, trên ngai vàng của [recipient.GetPrimaryTitle.GetNameNoTier]. Ngươi sẽ không bao giờ thiếu lòng trung thành và cống nạp của ta."
  mpo_greatest_of_khans.0021.a: "[recipient.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] được tha mạng từ cơn thịnh nộ của ta."
  mpo_greatest_of_khans.0022.opening: "[actor.GetFirstNameNoTooltip], O Kẻ Vĩ Đại của Người Du Mục,"
  mpo_greatest_of_khans.0022.desc_nomad: "Liệu một [recipient.GetWomanMan] — với hơi thở vẫn còn trong [recipient.GetHerHim] — có để kẻ thù lấy mất bao tên của [recipient.GetHerHis] không? Khi đó thì cuộc đời của [recipient.GetHerHis] còn có giá trị gì nữa?\n\nNếu ta chết trong khi bảo vệ [recipient.GetDomicile.GetCulture.GetCollectiveNoun] của mình, họ sẽ chôn bao tên và cây cung của ta bên cạnh hài cốt của ta. Nhưng nếu #EMP ngươi#! chết ở đây... chúng ta sẽ bẻ gãy cây cung của ngươi. Làm nhục cơ thể ngươi trong đống phân thú vật. Ném thịt của ngươi cho lũ chó ăn."
  mpo_greatest_of_khans.0022.desc: "Sứ giả của ngươi nặng mùi ngựa, và chỉ đưa ra những lời đe dọa thô lỗ tới vùng đất quý tộc [recipient.GetPrimaryTitle.GetNameNoTier]. Ta đã giết họ.\n\nHãy bước ra khỏi những túp lều nơi đất hoang của ngươi, nếu muốn, nhưng những bức tường kiên cố đang chờ ngươi."
  mpo_greatest_of_khans.0022.a: "[recipient.GetPrimaryTitle.GetNameNoTierNoTooltip|U] sẽ chìm trong biển máu."
  mpo_greatest_of_khans.0022.a_nomadic: "Vận mệnh [recipient.GetPrimaryTitle.GetNameNoTierNoTooltip] đã được định đoạt."

  mpo_greatest_of_khans.0030.t: "Vĩnh Hằng [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]"
  mpo_greatest_of_khans.0030.desc: "Trong hàng ngàn thành phố và làng mạc, chiến binh [ROOT.Char.GetCulture.GetName] diễu hành đầy tự hào. Trong các cung điện và đại sảnh, lời của các quan của ta là luật. Mọi kẻ du mục, mọi loài vật trên thảo nguyên đều biết trong lòng rằng họ bị ta cai trị. Và những chủ đất định cư run rẩy dưới chân ta.\n\nVới triết gia và tướng lĩnh phục vụ theo ý ta, tất cả có thể được tái tạo, và [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] của ta sẽ được ban hình thái vĩnh cửu..."
  mpo_greatest_of_khans.0030.a: "#EMP Đốt! Thảm sát! Đuổi đi!#! Cho tới khi mọi người sống theo đời du mục!"
  mpo_greatest_of_khans.0030.a.flavor: "Cuộc sống định cư thấp kém. Nó làm con người yếu đuối. Phần lớn dân chúng trong đế quốc ta phải chọn: rời nhà và sống đời du mục... hoặc chết."
  mpo_greatest_of_khans.0030.b: "Một nhà nước hành chính, để củng cố trật tự [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]."
  mpo_greatest_of_khans.0030.b.flavor: "Các đế chế hành chính hùng mạnh của thế giới tồn tại lâu dài và ảnh hưởng rộng khắp."
  mpo_greatest_of_khans.0030.c: "Một hệ thống phong kiến, để củng cố quyền lực [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]."
  mpo_greatest_of_khans.0030.c.flavor: "Chúng ta, những kẻ du mục, không xa lạ với lời thề, và có điều gì đó thú vị trong những lời danh dự phong kiến..."
  mpo_greatest_of_khans.0030.d: "Hãy để các bộ tộc cai trị những gì họ đã chiến thắng."
  mpo_greatest_of_khans.0030.d.flavor: "Vinh quang của bộ tộc [ROOT.Char.GetHouse.GetName] là lớn nhất... nếu chúng ta đứng cùng nhau và sắp xếp lãnh thổ theo dòng họ."
  mpo_greatest_of_khans.0030.e: "[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] của ta vốn đã rực rỡ."
  mpo_greatest_of_khans.0030.e.flavor: "Chỉ bằng sức mạnh, dân ta cai trị. Hãy để thần dân định cư than khóc. Bàn chân ngựa ta sẽ làm họ câm lặng."
  gok_every_held_title_gains_castles: "Mỗi [county_capital|E] trong [domain|E] của Ngài nhận một [castle|E] [holding|E]"
  gok_some_nomad_vassals_holdings_switch: "Chấp thuận [nomadic|E] [vassals|E] #high ([switching_vassals_value])#! cũng sẽ thay đổi [government|E] và loại [holding|E] của họ"
  great_khans_capital_modifier: "Ngai vàng Thảo Nguyên"
  great_khans_capital_modifier_desc: "Từ gần xa, thương nhân, binh lính, quan lại, di dân đổ về. Hạt này đang được định cư và đô thị hóa nhanh chóng."
  gok_capital_holdings_switch_tt: "Nhận một [castle|E] [holding|E] và, nếu có thể, thêm [temple|E] và [city|E]"
  gok_some_sedentaries_become_admin_tt: "Các chư hầu [feudal|E] và [clan|E] tình nguyện trở thành [administrative|E]"
  gok_counties_become_nomad_counties_tt: "Hầu hết [counties|E] không-[nomadic|E] trong [realm|E] của Ngài #high ([burned_to_nomadism_value])#! nhận một [nomadic_holding|E] và mất tất cả [holdings|E] khác"
  gok_new_nomad_counties_lose_development_tt: "Những [counties|E] này mất tất cả các @development_icon![development|E] và @control_icon![control|E]"
  gok_other_counties_lose_development_tt: "Tất cả các [counties|E] khác trong [realm|E] của Ngài mất một phần @development_icon![development|E]"
  gok_non_nomads_become_nomad_tt: "Các [vassals|E] không-[nomadic|E] tình nguyện #high ([sedentary_to_nomad_vassals_value])#! sẽ trở thành [nomadic|E]"
  gok_city_state_creation: "Các [vassals|E] không-[nomadic|E] không muốn #high ([city_state_vassals_value])#! sẽ bị giảm xuống [duke|E]-[title_tier|E] và Ngài nhận các [titles|E] dư thừa của họ"
  gok_time_limit_end_decision_tt: "@alert_icon! #alert_trial Nếu [dynasty|E] của Ngài mất quyền kiểm soát [gok_title.GetName] hoặc thất bại trong #high $mpo_gok_world_conquest_decision$#! [decision|E] trước năm #high [gok_empire_crumble_date|0]#!, các phần thưởng này sẽ mất và [gok_title.GetName] có nguy cơ sụp đổ!#!"
  gok_time_limit_end_decision_other_players_tt: "Nếu [dynasty|E] của [genghis_khan.GetShortUINamePossessive] mất quyền kiểm soát [gok_title.GetName] hoặc thất bại trong #high $mpo_gok_world_conquest_decision$#! [decision|E] trước năm #high [gok_empire_crumble_date|0]#!, phần thưởng của họ sẽ mất"

  mpo_greatest_of_khans.0040.t: "Giấc Mơ Vĩ Đại Lụi Tàn"
  mpo_greatest_of_khans.0040.desc_timed_out: "Hàng thập kỷ, dòng họ [ROOT.Char.GetHouse.GetName] cai trị đế quốc máu của chúng ta. Tường thành kiêu hãnh của kẻ thù đã vỡ tan, đạo quân ta béo tốt với chiến lợi phẩm. Từ đỉnh núi cao nhất, chúng ta đã ca ngợi [ROOT.Char.GetFaith.HighGodName], và nghe trăm ngàn tiếng gọi tên ta!\n\nNhưng chúng ta cai trị quá lâu. Những lời hứa chinh phục không còn cảm hứng. Các thủ lĩnh và quý tộc cãi cọ như kền kền, và những tiếng nói đặt câu hỏi về mệnh lệnh của ta..."
  mpo_greatest_of_khans.0040.desc: "Đế quốc vĩ đại của chúng ta đã trượt khỏi tay dòng họ! Không còn có thể yêu cầu sự phù hộ của Đại Thiên Xanh mà không gặp thách thức — không còn triệu tập đạo quân chỉ bằng một cái vung roi.\n\nTrong những năm tới, ta có thể vật lộn trở lại ngai vàng đúng mệnh của mình, như một tên tội phạm bị xấu hổ trượt khỏi [Glossary( 'cangue', 'CANGUE_GLOSS' )]... nhưng thời đại vinh quang của chinh phục đã kết thúc."
  mpo_greatest_of_khans.0040.a: "Nhưng... thế giới vẫn run rẩy trước tên ta."
  gok_no_more_special_powers: "Ngài không thể sử dụng #high $mpo_offer_submission_or_ruin$#! hoặc #high $mpo_gok_onslaught_cb$#! nữa"
  gok_no_more_reform_decision: "Ngài không thể thực hiện #high $mpo_gok_world_conquest_decision$ [decision|E] nữa"
  gok_guaranteed_disastrous_chaotic_succession_tt: "@warning_icon! #X Thừa kế #high Chaotic#! tiếp theo của Ngài có thể phá vỡ [ROOT.Char.GetPrimaryTitle.GetName]#!"

  mpo_greatest_of_khans.0041.t: "Vẫn Vĩ Đại, Nhưng Ít Là Khan"
  mpo_greatest_of_khans.0041.desc: "Trong những bức tường kiên cố của [ROOT.Char.Custom('ResidenceBuilding')], trong [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l] của luật pháp, định cư và thương mại hòa bình... giấc mơ cũ vẫn đến?\n\nTrái tim ta có còn hát về số mệnh Đại Khan, về nghiền nát thế giới dưới móng ngựa?\n\nVương quốc [ROOT.Char.GetGovernment.GetAdjective] này không tụ họp thành một dưới cờ đuôi ngựa. Nó không chất lên xe theo lệnh ta. [ROOT.Char.Custom('GetFighterTermPlural')] và [ROOT.Char.Custom('GetLocalCommonerTermPlural')] không khao khát, cùng nhau, chinh phục dưới Bầu Trời Xanh Vĩnh Hằng.\n\nGiấc mơ vĩ đại của chúng ta đã mờ đi, nhưng chúng ta vẫn mạnh, và giàu có."
  mpo_greatest_of_khans.0041.a: "Chẳng phải đây là #EMP giấc mơ thật#! của những kẻ du mục sao?"

  gok_forsaken_nomadism_tt: "Ngài đã nhận [root_scope.GetGovernment.GetName] [government|E]"
  has_gok_story_tt: "[GetTrait('greatest_of_khans').GetName( GetNullCharacter )] có thể chinh phục Trung Quốc và sau đó thay đổi [government|E] bằng [decision|E]"

