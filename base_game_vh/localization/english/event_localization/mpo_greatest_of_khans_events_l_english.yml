  mpo_greatest_of_khans.0050.opening: "Cái chết của ngươi bị ngăn lại bởi những lời này."
  mpo_greatest_of_khans.0050.desc: "Đại [attacker.GetTitleAsName] — [attacker.GetSheHe] có số mệnh nghiền nát mọi vương quốc dưới móng ngựa, [attacker.GetSheHe] đốt và tàn phá — sẽ để ngươi sống, để ngươi phục vụ [attacker.GetPrimaryTitle.GetName].\n\n"
  mpo_greatest_of_khans.0050.desc_end: "Chó của [defender_primary.GetNameNoTier]: ngươi sẽ trông coi bầy lớn của dân [attacker.GetTitleAsNamePossessiveNoTooltip], và cầu xin những mảnh vụn theo ý [attacker.GetHerHis]."
  mpo_greatest_of_khans.0050.desc_reorganized: "[attacker.GetTitleAsNameNoTooltip] không muốn nghe tiếng nói nhỏ bé của ngươi. Ngươi sẽ trả lời [liege.GetName]."
  mpo_greatest_of_khans.0050.a: "Có lẽ chúng sẽ rời đi nhanh như khi đến..."

  mpo_greatest_of_khans.0051.opening: "Gửi tất cả những kẻ khốn nạn [defender_primary.GetAdjective],"
  mpo_greatest_of_khans.0051.desc: "Đại [attacker.GetTitleAsName] — [attacker.GetSheHe] đã lấy mọi thứ của dân ngươi, những chiến binh tràn qua đất đai ngươi — bảo ngươi rằng:\n\nHãy giơ khuôn mặt đầy nước mắt ra gió và đi thật xa. Hãy nói với tất cả những gì ngươi thấy rằng thế giới sắp thuộc về đạo quân [attacker.GetTitleAsNamePossessiveNoTooltip]."
  mpo_greatest_of_khans.0051.a: "Chủ nhân ta thất bại... Ta bại rồi."
  gok_noble_army_name: "Thần Tử Cao Quý [army_culture.GetNameNoTooltip]"
