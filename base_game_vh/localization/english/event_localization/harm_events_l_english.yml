l_english:

 ##################################################
 # #Misc Keys
  aging_gracefully_modifier:0 "Tuổi Già Thanh Nhã"
  aging_gracefully_modifier_desc:0 "Nhân vật này đang dần suy yếu, nhưng bước tiến của thời gian dường như đè nặng lên họ ít hơn so với người thường."

  thick_skulled_modifier:0 "Đầu Cứng"
  thick_skulled_modifier_desc:0 "Cái đầu của nhân vật này, dường như, có thể chịu đòn rất tốt."

  strong_willed_modifier:0 "Ý Chí Kiên Cường"
  strong_willed_modifier_desc:0 "Nhân vật này đã quen với việc chịu đựng ngay cả những cơn đau dữ dội nhất."

  harm.0000.tt.spared_for_now:0 "Ngươi được tha. Tạm thời."
  harm.0000.tt.no_permanent_damage:0 "Ngươi không chịu tổn hại vĩnh viễn."

  harm.0000.tt.physician:0 "#EMP [ROOT.Char.Custom('GetRandomCourtMedic')|U]! [medic.GetFirstNameNoTooltip]!#!"
  harm.0000.tt.incapable.success:0 "Ngươi không bị thương tật vĩnh viễn"
  harm.0000.tt.incapable.failure:0 "Trải nghiệm này khiến ngươi trở nên suy nhược"
  harm.0000.tt.death.success:0 "Ngươi sống sót"
  harm.0000.tt.death.failure:0 "Ngươi bỏ mạng"











 ##################################################
 # #Responsive Incapability Events
  harm.0001.t.pre_title:0 "Tuổi Già Bệnh Tật"

  harm.0001.t:0 "$harm.0001.t.pre_title$: Suy Nhược"
  harm.0001.desc:0 "Ta tỉnh giấc trong cơn ho sặc sụa, đầu óc mơ hồ, đầu đau như búa bổ. Gần như muốn nôn, ta cố gượng dậy khỏi giường, nhưng bàn tay bấu vào khung giường yếu ớt, mong manh như trẻ sơ sinh.\n\nVới nỗ lực to lớn, ta run rẩy đứng lên rồi loạng choạng bước tới chậu rửa. Nhân danh [ROOT.Char.GetFaith.HealthGodName], cơn suy nhược này từ đâu mà đến? Ta... ta cảm thấy yếu ớt quá.\n\nNước mát cũng chẳng khiến ta tỉnh táo hơn. Đôi mắt lờ đờ, ta nhìn vào hình ảnh mờ nhạt, u ám phản chiếu trong chiếc gương bạc đánh bóng. [ROOT.Char.GetWomanMan] đang nhìn lại ta trông già nua đến đáng sợ."
  harm.0001.a:0 "Ta vẫn còn sống lâu lắm, chắc chắn vậy!"
  harm.0001.a.tt.success:0 "Thân thể ngươi khỏe mạnh, tinh thần minh mẫn"
  harm.0001.a.tt.failure:0 "Ngươi không khỏe như ngươi tưởng"
  harm.0001.b:0 "Có lẽ ta nên sống điều độ hơn..."
  harm.0001.b.tt.success:0 "Ngươi thực hiện vài thay đổi cần thiết"
  harm.0001.b.tt.failure:0 "Không gì ngăn nổi bước đi của thời gian"
  harm.0001.c:0 "Ta sẽ ra đi khi ta đã sẵn sàng, [ROOT.Char.GetFaith.DeathDeityName], không phải trước đó."
  harm.0001.d:0 "Ta không còn là kẻ trẻ tuổi năm xưa nữa."
  harm.0001.d.tt.success:0 "Thời gian đối xử khoan dung với ngươi"
  harm.0001.d.tt.failure:0 "Thân thể ngươi bệnh tật vì tuổi già"

  harm.0002.t:0 "$harm.0001.t.pre_title$: Lú Lẫn"
  harm.0002.desc:0 "Ta định đi đâu nhỉ? Tại sao ta lại vào đây? Ta chắc rằng... phải, ta đang tìm một thứ. Một thứ. Một thứ gì đó.\n\nCó gấp không? Ta phải quay lại gặp #EMP ai đó#!. Nhanh lên! Tuần sau chăng? Phải, ta nghĩ vậy.\n\nÀ! Đây rồi, thứ ta cần, ta cần nó để... để..."
  harm.0002.a:0 "Ta đang nghĩ đến chuyện gì vậy?"
  harm.0002.a.tt:0 "Trí óc của ngươi không còn nhanh nhạy như xưa..."

  harm.0003.t:0 "$harm.0001.t.pre_title$: Đau Nhức"
  harm.0003.desc.intro:0 "Nhân danh [ROOT.Char.GetFaith.HealthGodName], vì sao ta lại #EMP đau nhức#! đến vậy? Ta đã ngủ ngon, như mọi khi, nhưng mỗi khi vươn người, ta cảm thấy xương cốt như phát ra tia lửa khi cọ xát vào nhau.\n\n"
  harm.0003.desc.sighted:0 "Ta nhìn xuống [ROOT.Char.Custom('HandHands')] của mình, quan sát kỹ móng tay. Chúng đã ngả vàng theo năm tháng, trên làn da nhăn nheo hơn ta mong muốn."
  harm.0003.desc.blind:0 "Ta đưa [ROOT.Char.Custom('HandHands')] lướt trên da, cảm nhận lớp da khô mỏng như giấy và những nếp nhăn dày đặc phủ kín thân thể."
  harm.0003.desc.outro:0 "Thật khó tưởng tượng rằng tuổi trẻ từng trào dâng trong thân xác này, nóng bỏng và tràn đầy sinh lực."
  harm.0003.a:0 "Hừ, khớp xương của ai cũng #EMP kêu răng rắc#! như vậy sao?"
  harm.0003.a.tt:0 "Thân thể ngươi đang dần chậm lại..."

  harm.0011.t:0 "Gục Ngã Nơi Chiến Trận"
  harm.0011.desc.default_body:0 "Khi giao tranh tại [battle_location.GetName] kết thúc, kẻ bị thương và tàn phế lê bước rời khỏi chiến trường, còn những kẻ tử trận đáng chú ý nhất được bằng hữu và gia nhân mang đi.\n\nPhần ta, ta bị cuốn vào nơi giao chiến ác liệt nhất — không còn chỗ cho kỹ xảo, chỉ có chém giết, gào thét và máu đổ. Đầu ta vẫn quay cuồng vì những đòn đánh và cơn hưng phấn, những cơn dâng trào của sợ hãi, phẫn nộ và khoái thắng...\n\nQuay... đầu ta quay cuồng. Tầm nhìn mờ đi, rồi chồng chéo, và ta bắt đầu đổ gục xuống [ROOT.Char.Custom('GritType')].\n\n"Mau gọi một [ROOT.Char.Custom('GetRandomBattlefieldMedic')|U], [ROOT.Char.GetTitleAsNameNoTooltip] đã bị thương!" tiếng ai đó hét lên,"
  harm.0011.desc.medic_present:0 "và điều cuối cùng ta thấy là [medic.GetTitledFirstName] chen qua đám đông."
  harm.0011.desc.no_medic:0 "nhưng không ai đáp lại. Không một ai."
  harm.0011.a:0 "Ta ổn! Ta- ta ổn..."
  harm.0011.a.tt.success:0 "Ngươi hồi phục theo thời gian"
  harm.0011.a.tt.success.bone:0 "Cái đầu cứng của ngươi cứu ngươi"
  harm.0011.a.tt.success.brain:0 "Ý chí kiên cường giúp ngươi vượt qua"
  harm.0011.a.tt.failure:0 "Ngươi không hề ổn"
  harm.0011.b:0 "[medic.GetFirstNameNoTooltip]. Làm ơn. Đầu... #EMP đầu ta.#!"
  harm.0011.b.tt.success:0 "Nhờ sự trợ giúp của [medic.GetHerHis], ngươi vượt qua"
  harm.0011.b.tt.failure:0 "Khả năng của [medic.GetFirstNamePossessive|U] vẫn là không đủ"











 ##################################################
 # #Random Incapability Events
  harm.0501.t.prefix:0 "Tội Lỗi Gia Tộc"
  harm.0501.t:0 "$harm.0501.t.prefix$: Tinh Tuyển Nhất"
  harm.0501.desc:0 "Toàn thân ta như bốc cháy — tựa như linh hồn đang bị thiêu đốt từ bên trong. Ta định đi đâu... vì sao ta lại ở đây? Vì sao lại #EMP đau đớn đến vậy#!?\n\nTừng dây thần kinh một, cơn đau cháy bỏng lan khắp thân thể khốn khổ của ta, dâng lên từng đợt rồi lại lắng xuống. Ta vừa nóng vừa lạnh, bị giày vò bởi những cơn đau nhói, như điện giật.\n\nTrong một khoảnh khắc sáng tỏ rực cháy, nguồn gốc của cơn bệnh hiện ra. Thân thể ta đang gánh chịu những khiếm khuyết của huyết thống."
  harm.0501.a:0 "Đây... đây là đâu?"
  harm.0501.a.tt.success:0 "$harm.0000.tt.incapable.success$"
  harm.0501.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
  harm.0501.b:0 "Ta có thể #EMP kiểm soát bản thân#!."
  harm.0501.c:0 "Trí óc ta sắc bén hơn thế này."
  harm.0501.c.tt.success:0 "$harm.0000.tt.incapable.success$"
  harm.0501.c.tt.failure:0 "$harm.0000.tt.incapable.failure$"

  harm.0502.t:0 "$harm.0501.t.prefix$: Sao Băng Xẹt Qua"
  harm.0502.desc:0 "Vội vã băng qua [ROOT.Char.Custom('GetCourtyard')] vì một việc nhỏ nhặt, ta chợt cảm thấy một cơn đau siết chặt ở chân, rồi ở tay. Tay ta... đang run sao? Vì sao đầu ta đau nhói? Chuyện gì...\n\nTrong khoảnh khắc ngắn ngủi, ta loạng choạng, suýt ngã nhào xuống đất. Rồi ta lấy lại thăng bằng và tiếp tục bước.\n\nTa... ta không biết đó là gì."
  harm.0502.a:0 "Căn bệnh quái lạ gì thế này?"
  harm.0502.a.tt:0 "#WEAK Cơn đau lại dần tan biến...#!"

  harm.0511.t.prefix:0 "Nếm Mùi Đất"
  harm.0511.t:0 "$harm.0511.t.prefix$: Một Cú Ngã Nhẹ"
  harm.0511.desc:0 "Ta cùng đoàn tùy tùng đang tận hưởng một chuyến cưỡi ngựa thong thả gần [ROOT.Char.GetCurrentLocation.GetName] — công việc trong ngày đã xong, chúng ta đang trở về kịp bữa tối.\n\nMặt trời bắt đầu lặn, ánh đỏ phủ lên đoàn người, thì con ngựa của ta bất ngờ hí vang. Cú giật quá mạnh và quá nhanh khiến ta không kịp khống chế, hất ta văng khỏi yên."
  harm.0511.a:0 "Chờ, khô-!"
  harm.0511.a.tt.success:0 "$harm.0000.tt.incapable.success$"
  harm.0511.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
  harm.0511.b:0 "Cúi người rồi lăn."
  harm.0511.c:0 "Đỡ bằng vai."
  harm.0511.c.tt.success:0 "$harm.0000.tt.incapable.success$"
  harm.0511.c.tt.failure:0 "$harm.0000.tt.incapable.failure$"

  harm.0512.t:0 "$harm.0511.t.prefix$: Suýt Nữa"
  harm.0512.desc:0 "Cưỡi ngựa qua vùng hoang dã gần [ROOT.Char.GetCurrentLocation.GetName] là một niềm vui giản dị của ta với tư cách [ROOT.Char.GetTitleAsNameNoTooltip] của [ROOT.Char.GetPrimaryTitle.GetNameNoTier]. Khi công việc trị quốc trở nên quá tải, ta có thể tận hưởng nó một mình hoặc cùng tùy tùng.\n\nMải mê suy nghĩ, ta suýt không nhận ra khi con ngựa thấy một loài bò sát nhỏ đáng sợ và định hất tung. Nhanh chóng siết chặt dây cương, ta trấn an nó.\n\nChuyến đi tiếp tục."
  harm.0512.a:0 "Hừ, không để chuyện #EMP đó#! xảy ra lần nữa."
  harm.0512.a.tt:0 "#WEAK Con ngựa vẫn bồn chồn suốt quãng đường còn lại...#!"

  harm.0521.t.prefix:0 "Hết Lớp Sóng Này Đến Lớp Sóng Khác"
  harm.0521.t:0 "$harm.0521.t.prefix$: Sặc Nước & Vùng Vẫy"
  harm.0521.desc.sea:0 "Ta luôn thích ở trên biển. Ngay cả trong ngày giông bão như hôm nay, nó vẫn có vẻ đẹp khắc nghiệt, cảm giác mong manh, của—"
  harm.0521.desc.river:0 "Con sông gần [ROOT.Char.GetCurrentLocation.GetName] thường không dữ dội như thế này, nhưng ta vẫn tận hưởng chuyến đi. Nó thật thư thái, nó—"
  harm.0521.desc.coastal:0 "Bờ biển bão tố của [ROOT.Char.GetCurrentLocation.GetName] đôi khi rất nguy hiểm, nhưng ta vẫn thích ra khơi. Nó khiến ta cảm thấy—"
  harm.0521.desc.outro:0 "\n\nCon thuyền nghiêng mạnh, và ta bị hất xuống nước. Cú va chạm khiến không khí bật khỏi phổi, sự thay đổi nhiệt độ đột ngột khiến cơ thể ta choáng váng.\n\nKhi ta tỉnh lại, ho sặc sụa dưới nước, thân thể và trí óc ta như bốc cháy. Ý thức dần rời bỏ, đầu óc ta nghẹt thở và mờ dần theo từng giây."
  harm.0521.a:0 "Dây thừng, lưới, tấm ván, ném cho ta thứ gì đó!"
  harm.0521.a.tt.success:0 "Ngươi bám được vào thứ gì đó"
  harm.0521.a.tt.failure:0 "Ngươi chìm dưới nước quá lâu"
  harm.0521.b:0 "Ngoi lên mặt nước!"
  harm.0521.b.tt.unlocked_by_cultrad:0 "Lựa chọn này mở khóa bởi [culture_possessive|E] [traditions|E] của ngươi"
  harm.0521.c:0 "Bơi, #EMP bơi#!!!"
  harm.0521.c.tt.success:0 "Ngươi kịp lên mặt nước"
  harm.0521.c.tt.failure:0 "Ngươi quá chậm"

  harm.0522.t:0 "$harm.0521.t.prefix$: Dáng Vẻ Bình Thản"
  harm.0522.desc.sea:0 "Có gì sảng khoái hơn biển cả chăng? Mùi muối, tiếng hải âu khi gần đất liền, âm thanh nước vỗ nhẹ vào thân thuyền."
  harm.0522.desc.river:0 "Con sông gần [ROOT.Char.GetCurrentLocation.GetName] là một phương tiện di chuyển thuận tiện tuyệt vời, thứ mà ta thỉnh thoảng sử dụng như hôm nay.\n\nThật sảng khoái. Nghe tiếng chèo khua nước, nhìn cảnh vật trôi qua trong khi ta vẫn đứng yên."
  harm.0522.desc.coastal:0 "Hiếm khi có năm nào ta #EMP không#! phải dùng đến đường biển. Với vị trí gần [ROOT.Char.GetCurrentLocation.GetName], không dùng mới là ngu.\n\nChuyến đi hôm nay rất nhanh, chỉ để giải quyết một tranh chấp nhỏ, để ta tận hưởng cảm giác yên bình khi được đưa về — ngắm bờ biển trôi qua mà không chút lo nghĩ."
  harm.0522.desc.outro:0 "\n\nĐứng trên boong tàu, tựa người qua lan can, ta cảm thấy bình yên lạ thường."
  harm.0522.a:0 "Mặt nước thật thôi miên..."
  harm.0522.a.tt:0 "#WEAK Gần như... thôi miên...#!"

  harm.0531.t.prefix:0 "Rối Loạn Nội Tạng"
  harm.0531.t:0 "$harm.0531.t.prefix$: Thế Giới Tan Biến"
  harm.0531.desc:0 "Ta cảm thấy... tê liệt. Chuyện gì... đang xảy ra...\n\nKhông đứng vững. Không tập trung. Không cảm nhận. Chỉ còn đau đớn và—\n\nCứu.\n\nBằng cách nào đó.\n\nAi đó.\n\nXin.\n\n#EMP Xin hãy#!."
  harm.0531.a:0 "Trí óc ta... đang #EMP bốc cháy#!..."
  harm.0531.a.tt.success:0 "Cảm giác trống rỗng dần rút lui"
  harm.0531.a.tt.failure:0 "Ngươi gục ngã vì đột quỵ nặng"
  harm.0531.b:0 "Ta hiểu bản thân, rồi sẽ qua thôi."
  harm.0531.c:0 "[ROOT.Char.GetFaith.HealthGodName], ban cho ta sức mạnh."
  harm.0531.c.tt.success:0 "$harm.0531.a.tt.success$"
  harm.0531.c.tt.failure:0 "$harm.0531.a.tt.failure$"

  harm.0532.t:0 "$harm.0531.t.prefix$: Không Thể Nghĩ"
  harm.0532.desc:0 "Gần đây, ta bị hành hạ bởi những cơn đau đầu khủng khiếp. Chúng xé toạc trí óc và thân thể ta, khiến từng cơn đau nhói lan khắp đầu.\n\nTheo thời gian, chúng #EMP có#! qua đi, nhưng chưa bao giờ đủ nhanh."
  harm.0532.a:0 "Những cơn đau đầu chết tiệt này, bao giờ mới dứt?"
  harm.0532.a.tt:0 "#WEAK Chúng sẽ... có lẽ...#!"

  harm.0541.t.prefix:0 "Bệnh Tật Mùa Đông"
  harm.0541.t:0 "$harm.0541.t.prefix$: Lặng Lẽ & Tĩnh Lặng"
  harm.0541.desc.baby:0 "...\n\nTa tự hỏi. Cuộc sống sẽ ra sao.\n\n..."
  harm.0541.desc.fallback:0 "Kéo chăn chặt hơn. Co người lại. Nghiến răng chống lại cái lạnh.\n\nMùa đông khắc nghiệt này dường như hút cạn sức lực khỏi thân thể ta, khiến ta yếu ớt đến mức khó mà ho nổi. Ta sẽ không gục ngã.\n\nTa sẽ không..."
  harm.0541.a:0 "..."
  harm.0541.a.tt.success:0 "$harm.0000.tt.incapable.success$"
  harm.0541.a.tt.failure:0 "Cái lạnh phát huy sự tàn nhẫn của nó"
  harm.0541.b:0 "Ta đã vượt qua những thứ tệ hơn."
  harm.0541.c:0 "Ta sẽ không gục ngã trước #EMP băng giá#!!!"
  harm.0541.c.tt.success:0 "$harm.0000.tt.incapable.success$"
  harm.0541.c.tt.failure:0 "$harm.0541.a.tt.failure$"

  harm.0542.t:0 "$harm.0541.t.prefix$: Lạnh Thấu Xương"
  harm.0542.desc.baby:0 "Thế giới nhỏ bé của ta thật kỳ lạ. Cảm giác này là gì? Vì sao ta không ấm?\n\nTrước đây không như vậy, nhưng giờ thì có. Ta không hiểu. Ta cố khóc gọi người chăm sóc, nhưng phổi chỉ phát ra tiếng ho yếu ớt."
  harm.0542.desc.fallback:0 "Dù quấn chăn chặt đến đâu, ta vẫn lạnh đến tận xương. Cái rét này bám lấy ta như thịt bám xương.\n\nTa nhắm chặt mắt — bình minh sẽ đến, mang theo ánh sáng và hơi ấm."
  harm.0542.a:0 "Ước gì ấm hơn..."
  harm.0542.a.tt:0 "#WEAK Lửa... cần thêm lửa...#!"

  harm.0551.t.prefix:0 "Chơi Trèo Cao"
  harm.0551.t:1 "$harm.0551.t.prefix$: Một Cú Rơi & Gãy Vỡ"
  harm.0551.desc:1 "Nhân danh [ROOT.Char.GetFaith.FateGodName], ta thật thích được khám phá [ROOT.Char.GetCurrentLocation.GetName]! Nếu không có lối đi bí mật vượt qua tường thành, ta đã chẳng bao giờ có cơ hội rời xa những kẻ giám hộ phiền toái, chứ đừng nói là chơi một mình như thế này.\n\nLàm sao ta có thể tìm được một cái cây lớn như thế này, chứ đừng nói là leo lên nó? Lũ người phiền phức ấy sẽ chẳng bao giờ cho phép ta... chẳng bao giờ...\n\nCây này... khá cao đấy chứ?"
  harm.0551.a:1 "Chỉ cần... cẩn thận..."
  harm.0551.a.tt.success:1 "Ngươi leo xuống được"
  harm.0551.a.tt.failure:1 "Một cú rơi & gãy vỡ"
  harm.0551.b:1 "Cứu. Cứu! CỨU!"
  harm.0551.c:0 "Trông không #EMP cao#! đến thế..."
  harm.0551.c.tt.success:1 "$harm.0551.a.tt.success$"
  harm.0551.c.tt.failure:1 "$harm.0551.a.tt.failure$"

  harm.0552.t:0 "$harm.0551.t.prefix$: Lối Đi Bí Mật"
  harm.0552.desc:0 "Với tư cách [ROOT.Char.GetTitleAsNameNoTooltip], ta hiếm khi có thời gian một mình. Người hầu và lính canh ở khắp nơi, bảo vệ ta khỏi nguy hiểm và cả mọi niềm vui.\n\nNhưng cuối cùng ta cũng qua mặt được tất cả! Chỉ cần một chút liều lĩnh, bởi chúng không biết con đường bí mật vượt tường mà #EMP ta#! biết.\n\nTa không thể dùng nó quá thường xuyên, nhưng mỗi khi dùng, toàn bộ [ROOT.Char.GetCurrentLocation.GetName] trải rộng trước mắt. Tự do."
  harm.0552.a:0 "Thật thú vị!"
  harm.0552.a.tt:0 "#WEAK Chắc chắn sẽ không ai tìm ra ngươi bằng cách này...#!"

  harm.0561.t.prefix:0 "Không Còn Trẻ"
  harm.0561.t:0 "$harm.0561.t.prefix$: Bước Xuống"
  harm.0561.desc_adventurer: "Một lần nữa, ta nhìn ra bãi bùn cùng dây lều chằng chịt, tự hỏi liệu ta có cần người trông coi hay không.\n\nĐáng lẽ phải đơn giản. Ta là một [ROOT.Char.GetWomanMan] trưởng thành và biết cách đi qua trại mà không gãy cổ.\n\nNó đáng lẽ phải rất, #EMP rất#! đơn giản.\n\nVậy mà..."
  harm.0561.desc:0 "Một lần nữa, ta nhìn xuống cầu thang từ phòng mình, tự hỏi liệu ta có cần người trông coi hay không.\n\nĐáng lẽ phải đơn giản. Ta là một [ROOT.Char.GetWomanMan] trưởng thành và biết cách đi cầu thang mà không gãy cổ.\n\nNó đáng lẽ phải rất, #EMP rất#! đơn giản.\n\nVậy mà..."
  harm.0561.a:0 "Khoan — chờ — KHÔNG-"
  harm.0561.a.tt.success:0 "$harm.0000.tt.incapable.success$"
  harm.0561.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
  harm.0561.b:0 "Từng bước một, bình tĩnh."
  harm.0561.c:0 "Chỉ là #EMP cầu thang#! thôi."
  harm.0561.c.adventurer:0 "Chỉ là #EMP lều trại#! thôi."
  harm.0561.c.tt.success:0 "$harm.0000.tt.incapable.success$"
  harm.0561.c.tt.failure:0 "$harm.0000.tt.incapable.failure$"

  harm.0562.t:0 "$harm.0561.t.prefix$: Sự Mong Manh Gia Tăng"
  harm.0562.desc_adventurer: "Rời khỏi giường, bước vào sự nhộn nhịp của trại, ta gần như phải bám vào cột lều.\n\nViệc này... đáng lẽ phải đơn giản. Thế nhưng lại khó khăn và đáng sợ đến vậy, với bùn đất, dây lều và hành lý trải dài trước mắt như vô tận...\n\nKhông, không. Ta đang làm quá lên. Ta là #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#!, và ta có thể đi qua trại mà không cần trợ giúp."
  harm.0562.desc:0 "Bước xuống cầu thang từ phòng ngủ, ta gần như phải bám vào tường.\n\nViệc này... đáng lẽ phải đơn giản. Thế nhưng lại khó khăn và đáng sợ đến vậy, với cầu thang hẹp trải dài trước mắt như vô tận...\n\nKhông, không. Ta đang làm quá lên. Ta là #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#!, và ta có thể rời khỏi [ROOT.Char.Custom('GetRoom')|l] mà không cần trợ giúp."
  harm.0562.rump: ""
  harm.0562.a:0 "Đáng lo."
  harm.0562.a.tt:0 "#WEAK Từ khi nào việc này lại trở thành vấn đề với ngươi?#!"

  harm.0571.t.prefix:0 "Huấn Luyện Cần Thiết"
  harm.0571.t:0 "$harm.0571.t.prefix$: Một Đòn Bất Ngờ"
  harm.0571.desc:0 "Huấn luyện [sparring_partner.GetTitledFirstName] trở thành chiến binh giỏi hơn là một trong những nhiệm vụ nặng nề của ta, nhưng vẫn là điều cần thiết với tư cách [ROOT.Char.GetTitleAsName].\n\nTrận đấu hôm nay đặc biệt bực bội, khi [sparring_partner.GetFirstNamePossessiveNoTooltip] thể hiện tệ hơn bao giờ hết. Đôi khi ta tự hỏi liệu—\n\nCơn đau bùng lên trong đầu ta. Ta... [sparring_partner.GetSheHe] vừa đánh trúng #EMP thái dương#! của ta sao? Cái loại #EMP ngu ngốc#! gì vậy..."
  harm.0571.a:0 "Nhân danh [ROOT.Char.GetFaith.TricksterGodName], đồ ngu, đó là đầu ta!"
  harm.0571.a.tt.success:0 "$harm.0000.tt.incapable.success$"
  harm.0571.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
  harm.0571.b:0 "Chỉ là vết xước."
  harm.0571.c:0 "Hít thở — còn có thể tệ hơn."
  harm.0571.c.tt.success:0 "$harm.0000.tt.incapable.success$"
  harm.0571.c.tt.failure:0 "$harm.0000.tt.incapable.failure$"

  harm.0572.t:0 "$harm.0571.t.prefix$: Chỉ Là Tai Nạn"
  harm.0572.desc:0 "Luyện tập tại [ROOT.Char.Custom('GetCourtyard')], ta và [sparring_partner.GetTitledFirstName] khóa chặt vũ khí trong một điệu múa mà trên chiến trường có lẽ đã khiến [sparring_partner.GetHerHim] chết hàng ngàn lần.\n\n[sparring_partner.GetSheHe|U] đơn giản không phải chiến binh như ta.\n\nDẫu vậy, đây là huấn luyện cần thiết cho kẻ đại diện ta ngoài chiến trường, nên ta vẫn dành thời gian—\n\nNhân danh [ROOT.Char.GetFaith.WarGodName]! Cú đó suýt trúng đầu ta!"
  harm.0572.a:0 "Cẩn thận, đồ thô lỗ!"
  harm.0572.a.tt:0 "#WEAK Ngươi có thể đã gặp hậu quả tệ hơn nhiều...#!"

  harm.0581.t.prefix:0 "Khoảnh Khắc Cô Độc"
  harm.0581.t:0 "$harm.0581.t.prefix$: Trượt Chân Bất Cẩn"
  harm.0581.desc:0 "Tận hưởng một lần tắm hiếm hoi một mình, tránh xa người hầu và kẻ bám theo phiền toái là một niềm vui lớn đối với ta. Hiếm khi ta có thời gian hoàn toàn thuộc về bản thân, và ta trân trọng từng khoảnh khắc.\n\nNhưng mọi điều tốt đẹp đều phải kết thúc, và ta bắt đầu đứng dậy khỏi bồn tắm.\n\nNhưng— tay ta không vững như ta nghĩ, chân trượt, và ta bắt đầu ngã nhanh chóng."
  harm.0581.a:0 "Chờ, [ROOT.Char.GetFaith.TricksterGodName], kh—"
  harm.0581.a.tt.success:0 "$harm.0000.tt.incapable.success$"
  harm.0581.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
  harm.0581.b:0 "Chậm lại, an toàn."

  harm.0582.t:0 "$harm.0581.t.prefix$: Trơn Trượt Khi Ướt"
  harm.0582.desc:0 "Tắm một mình là niềm vui hiếm hoi của ta. Với tư cách [ROOT.Char.GetTitleAsNameNoTooltip], ta khó có khoảnh khắc nào không bị người hầu hoặc [ROOT.Char.Custom('GetCourtier')|l] làm phiền — ngay cả việc tắm rửa cũng vậy.\n\nTừ từ đứng dậy khỏi bồn, ta bám vào mép và bước tới chồng khăn.\n\nNhưng... không hẳn.\n\nChân ta, vẫn còn ướt, trượt đi, và chỉ nhờ phản xạ ta mới không ngã xuống sàn."
  harm.0582.a:0 "Có lẽ ta nên cẩn thận hơn."
  harm.0582.a.tt:0 "#WEAK Dù sao ngươi cũng hiếm khi tắm một mình...#!"

  harm.0591.t.prefix:0 "Không Cảnh Giác"
  harm.0591.t:0 "$harm.0591.t.prefix$: Tai Họa Từ Trên Cao"
  harm.0591.desc:0 "Một việc nhỏ trong thị trấn đã giữ chân ta lâu hơn dự định, nhưng cuối cùng ta và đoàn tùy tùng cũng trở về.\n\nDân chúng [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] tấp nập trên phố, mỗi người bận rộn với cuộc sống của mình, chẳng mấy quan tâm đến [ROOT.Char.GetTitleAsNameNoTooltip] đang đi qua.\n\nBỗng một cảm giác cảnh báo dữ dội bùng lên trong ta: #EMP nguy hiểm#!. Có thứ gì đó ngay trên đầu ta, đang rơi xuống rất nhanh."
  harm.0591.a:0 "Lao sang một bên."
  harm.0591.a.tt.success:0 "Ngươi an toàn"
  harm.0591.a.tt.failure:0 "Một chiếc nồi rơi trúng thái dương ngươi"
  harm.0591.b:0 "#EMP Ta không bao giờ được an toàn sao?!#!"
  harm.0591.b.tt:0 "Ngươi phản ứng với tốc độ do hoang tưởng"
  harm.0591.c:0 "Ta đã di chuyển rồi."
  harm.0591.c.tt.success:0 "$harm.0591.a.tt.success$"
  harm.0591.c.tt.failure:0 "$harm.0591.a.tt.failure$"

  harm.0592.t:0 "$harm.0591.t.prefix$: Vứt Bỏ"
  harm.0592.desc:0 "Khi đi qua [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], sau khi xử lý việc nhỏ, ta và đoàn tùy tùng nghe thấy tiếng động lớn.\n\nHóa ra một kẻ dân thường nào đó ném nồi đất từ cửa sổ xuống, chẳng màng đến việc có thể trúng người bên dưới.\n\nVô trách nhiệm, đúng vậy, nhưng còn mong gì hơn?\n\nDù sao cũng chẳng đáng bận tâm thêm."
  harm.0592.a:0 "Lũ #EMP dân đen#!."
  harm.0592.a.tt:0 "#WEAK Điều đó có thể làm ai đó bị thương...#!"

  harm.0601.t.prefix:0 "Chơi Quá Đà"
  harm.0601.t:0 "$harm.0601.t.prefix$: Hậu Quả"
  harm.0601.desc:0 "Như thường lệ, ta và [playmate.GetFirstName] chơi trong một góc bỏ hoang của cung điện.\n\nLà bạn thân, chúng ta #EMP luôn#! tìm được cách giải trí, và thật tốt khi có người không phải lính canh hay người trông coi.\n\nHôm nay, chúng ta vật lộn giả vờ xa khỏi tầm mắt người lớn. Rất vui! Nhưng... nhưng cú khóa cổ vừa rồi khiến ta chóng mặt và... #DIE1 và...#!"
  harm.0601.a:0 "Ta... không ổn..."
  harm.0601.a.tt.success:0 "$harm.0000.tt.incapable.success$"
  harm.0601.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"

  harm.0602.t:0 "$harm.0601.t.prefix$: Có Hại Gì Đâu?"
  harm.0602.desc:0 "Ta thích chơi với [playmate.GetFirstName], [playmate.GetSheHe] luôn biết cách vui chơi!\n\nLeo trèo, dọa động vật, trêu chọc triều thần... tất cả đều vui vẻ, khiến triều đình bớt buồn tẻ. Ta chỉ muốn chơi với [playmate.GetHerHim] mãi mãi."
  harm.0602.a:0 "Chúng ta nên chơi mỗi ngày!"
  harm.0602.a.tt:0 "#WEAK Dù sao hai ngươi cũng chỉ là trẻ con...#!"

  harm.0611.t.prefix:0 "Quá Xa, Quá Nhanh"
  harm.0611.t:0 "$harm.0611.t.prefix$: Chóng Mặt"
  harm.0611.desc.intro:0 "Sau một buổi tối bận rộn xử lý thư từ, ta đứng dậy. Đến giờ ăn tối, và ta muốn— nhân danh [ROOT.Char.GetFaith.HealthGodName], cơn #EMP choáng#! này là gì? Vì sao ta lại lâng lâng?\n\nTa đang ở đâu? Chuyện gì xảy ra?\n\n"
  harm.0611.desc.blind:0 "Như thể ta bị ném lên tận trời cao. Không nghe thấy gì. Không cảm nhận gì. Chỉ còn khoảng cách, độ cao chóng mặt và tiếng máu đập trong tai."
  harm.0611.desc.fallback:0 "Tầm nhìn của ta thu hẹp lại, ánh sáng và âm thanh biến mất, thay bằng bóng tối đang ập tới."
  harm.0611.a:0 "Chờ.. cái... ta..."
  harm.0611.a.tt.success:0 "$harm.0000.tt.incapable.success$"
  harm.0611.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
  harm.0611.b:0 "Nghiến răng chịu đựng."
  harm.0611.c:0 "Tập trung. Rõ ràng. #EMP Tập trung#!."
  harm.0611.c.tt.success:0 "$harm.0000.tt.incapable.success$"
  harm.0611.c.tt.failure:0 "$harm.0000.tt.incapable.failure$"

  harm.0612.t:0 "$harm.0611.t.prefix$: Cơn Dâng"
  harm.0612.desc:0 "Cuối cùng cũng xong. Một trăm lẻ một bức thư, hoặc cảm giác là vậy, từ đủ loại quan lại giữ cho [ROOT.Char.Custom('GetRealmOrDomicile')|l] của ta vận hành — chưa kể cả một buổi tối dài để hồi đáp từng cái một.\n\nGiờ thì, ta nghĩ, ăn nhẹ trước khi nghỉ.\n\nĐẩy ghế ra, ta đứng bật dậy và... và... choáng váng quá. Máu dồn dập trong huyết quản.\n\nTập trung.\n\n#EMP Tập trung#!.\n\nUghh, cái #EMP gì#! vừa xảy ra vậy?"
  harm.0612.a:0 "Ta vẫn còn choáng."
  harm.0612.a.tt:0 "#WEAK Thân thể ngươi thật sự yếu đến vậy sao?#!"

  harm.0621.t.prefix:0 "Say Mèm"
  harm.0621.t:0 "$harm.0621.t.prefix$: Một Đêm Vui Vẻ"
  harm.0621.desc:0 "Thêm một đêm, thêm một cốc, đó là điều ta luôn nói! Và #EMP luôn#! có thêm một đêm nữa!\n\nQuán rượu nhỏ ở [ROOT.Char.GetCurrentLocation.GetName] quay cuồng quanh ta, một mớ hình ảnh nhòe nhoẹt của khuôn mặt và hành động. Thêm nữa! Thêm... cái... cái bàn này khó rời đi quá. Ta đứng thế nào nhỉ?\n\nTa... Ối, ngã r— aghh, nhân danh [ROOT.Char.GetFaith.HealthGodName], đầu ta..."
  harm.0621.a:0 "*Nấc*... *nấc*... ..."
  harm.0621.a.tt.success:0 "$harm.0000.tt.incapable.success$"
  harm.0621.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
  harm.0621.b:0 "Heh, sáng mai chắc sẽ đau đấy."
  harm.0621.c:0 "Ôi, đầu ta. Cú đó đau thật, nhỉ?"
  harm.0621.c.tt.success:0 "$harm.0000.tt.incapable.success$"
  harm.0621.c.tt.failure:0 "$harm.0000.tt.incapable.failure$"

  harm.0622.t:0 "$harm.0621.t.prefix$: Thói Quen Xấu"
  harm.0622.desc:0 ""Chủ quán, thêm một vòng!" ta hô lớn, khiến cả quán reo hò.\n\nKhi tiếng hò reo vang lên từ những kẻ đang *nấc* tụ tập, ta mỉm cười. Có lẽ nửa [ROOT.Char.GetCurrentLocation.GetName] đang ở đây, tất cả đều cổ vũ ta.\n\nDù sao, ai có thể uống giỏi như #EMP ta#! chứ?"
  harm.0622.a:0 "Đời thật đẹp."
  harm.0622.a.tt:0 "#WEAK Và còn đẹp hơn với thêm rượu!#!"

  harm.0631.t.prefix:0 "Khoái Lạc"
  harm.0631.t:0 "$harm.0631.t.prefix$: Một Đêm Cuồng Nhiệt"
  harm.0631.desc:0 "[bonker.GetFirstName] khiến ta cảm thấy mình là [ROOT.Char.GetWomanMan] may mắn nhất thế gian. Những đêm như thế này, khi tình yêu được thể hiện bằng thân xác, tình cảm của [bonker.GetHerHis] thật mãnh liệt.\n\nNgón tay ta co lại, mắt ta đảo đi, và ta lao vào người tình cuồng nhiệt nhất đời mình.\n\nMáu dồn dập, ta khó mà tập trung. Máu. Máu... dồn... Đây là... không phải... chuyện này..."
  harm.0631.a:0 "Chờ — ta không — ngực ta!"
  harm.0631.a.tt.success:0 "$harm.0000.tt.incapable.success$"
  harm.0631.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
  harm.0631.b:0 "K-không đâu, tim ta, không phải #EMP lúc này#!..."
  harm.0631.c:0 "Ta chỉ cần chịu đựng qua thôi."
  harm.0631.c.tt.success:0 "$harm.0000.tt.incapable.success$"
  harm.0631.c.tt.failure:0 "$harm.0000.tt.incapable.failure$"

  harm.0632.t:0 "$harm.0631.t.prefix$: Khúc Nhạc Ngọt Ngào"
  harm.0632.desc:0 "Thề với các vì sao trên cao, [bonker.GetFirstName] khơi dậy trong ta ngọn lửa tình yêu mãnh liệt nhất. Không [bonker.GetWomanMan] nào có thể mang đến cho ta trải nghiệm cuồng nhiệt, một đêm đầy khoái lạc như [bonker.GetSheHe], và vào lúc này, ta không thể nghĩ đến bất kỳ ai —\n\n...\n\n— bất kỳ ai mà ta muốn ở bên hơn."
  harm.0632.a:0 "[bonker.GetFirstNameNoTooltip] khiến ta cảm thấy thật #EMP sống#!."
  harm.0632.a.tt:0 "#WEAK Sống... thật sống...#!"

  harm.0641.t.prefix:0 "Ứ Dịch"
  harm.0641.t:0 "$harm.0641.t.prefix$: Sưng Phồng Nhẹ"
  harm.0641.desc:0 "Đáng nguyền rủa cái bệnh phù này, ta không thể yên ổn chút nào sao? Thịt da ta... #EMP phồng lên#! bởi thứ dịch bệnh này, chất lỏng nhạt nhẽo và mô nhợt nhạt trương lên quá mức.\n\nThân thể phình to của ta đau đớn khôn cùng, và ta cũng vậy.\n\nTa không thể suy nghĩ rõ ràng.\n\nTa chỉ có thể chịu đựng.\n\nChịu đựng, chịu đựng và rên rỉ..."
  harm.0641.a:0 "Ta... bị sao thế này..."
  harm.0641.a.tt.success:0 "$harm.0000.tt.incapable.success$"
  harm.0641.a.tt.failure:0 "$harm.0000.tt.incapable.failure$"
  harm.0641.b:0 "Rồi sẽ qua thôi."
  harm.0641.c:0 "Chẳng lẽ không thể chữa được sao?"
  harm.0641.c.tt.success:0 "$harm.0000.tt.incapable.success$"
  harm.0641.c.tt.failure:0 "$harm.0000.tt.incapable.failure$"

  harm.0642.t:0 "$harm.0641.t.prefix$: Nhạy Cảm"
  harm.0642.desc:0 "Gần đây, khớp xương ta đau nhức dữ dội.\n\nCó gì đó như bầm tím? Viêm? Ít nhất là chất dịch tụ lại quanh các khớp khiến ta đau đớn không ít.\n\nTa chỉ còn hy vọng nó sẽ giảm dần theo thời gian và nghỉ ngơi."
  harm.0642.a:0 "Agh, đau quá."
  harm.0642.a.tt:0 "#WEAK Rồi sẽ qua thôi...#!"












 ##################################################
 # #Random Death Events
  harm.1001.t.prefix:0 "Bữa Tối"
  harm.1001.t:0 "$harm.1001.t.prefix$: Nghẹn Cổ"
  harm.1001.desc:0 "Bữa tối hôm nay là sự kết hợp của nhiều món ta ưa thích — dạo gần đây thức ăn được chuẩn bị ngon một cách bất ngờ, và ta ăn ngấu nghiến đầy khoái chí.\n\nNhưng. Nhưng có gì đó không... cổ họng ta, có thứ gì mắc trong cổ họng!\n\nKhông khí, không— #EMP không khí#!."
  harm.1001.a:0 "Cố ho tống nó ra."
  harm.1001.a.tt.success:0 "$harm.0000.tt.death.success$"
  harm.1001.a.tt.failure:0 "$harm.0000.tt.death.failure$"
  harm.1001.b:0 "Bình tĩnh, hít thở."
  harm.1001.c:0 "Đập vào ngực và phổi."
  harm.1001.c.tt.success:0 "$harm.0000.tt.death.success$"
  harm.1001.c.tt.failure:0 "$harm.0000.tt.death.failure$"

  harm.1002.t:0 "$harm.1001.t.prefix$: Suýt Mắc"
  harm.1002.desc:0 "Ho sặc sụa vài tiếng, ta theo phản xạ làm thông đường thở. Bữa tối thật ngon, nhưng có lẽ... #EMP quá#! ngon, khiến ta nuốt quá nhanh.\n\nBình tĩnh, ta tự nhủ.\n\nKhông cần phải vội."
  harm.1002.a:0 "Gần đây ta thật sự rất tận hưởng việc ăn uống."
  harm.1002.a.tt:0 "#WEAK Một niềm vui vô hại...#!"

  harm.1011.t.prefix:0 "Bất Kham"
  harm.1011.t:0 "$harm.1011.t.prefix$: Cưỡi Hay Chết"
  harm.1011.desc:0 "Khi ta cùng đoàn tùy tùng trở về từ một việc vặt ở vùng quê [ROOT.Char.GetCurrentLocation.GetName], một sinh vật nhỏ nhưng hung hãn bất ngờ bò ra từ dưới tảng đá và rít lên với con ngựa của ta.\n\nBất ngờ, con ngựa hoảng loạn, lao vào một cú phi nước đại hỗn loạn và phóng đi với tốc độ kinh hoàng.\n\nHoảng sợ bởi chính phản ứng bản năng của mình, con vật vừa chạy vừa lồng lên, suýt tự ngã chứ chưa nói đến ta."
  harm.1011.a:0 "Bám lấy bằng mọi giá."
  harm.1011.a.tt.success:0 "$harm.0000.tt.death.success$"
  harm.1011.a.tt.failure:0 "$harm.0000.tt.death.failure$"
  harm.1011.b:0 "Cúi đầu, bám chặt."
  harm.1011.c:0 "Đây đâu phải lần đầu ta gặp ngựa hoảng."
  harm.1011.c.tt.success:0 "$harm.0000.tt.death.success$"
  harm.1011.c.tt.failure:0 "$harm.0000.tt.death.failure$"

  harm.1012.t:0 "$harm.1011.t.prefix$: Trên Đường Về"
  harm.1012.desc:0 "Như mọi kẻ lãnh đạo, ta được kỳ vọng phải biết cưỡi ngựa, và cưỡi thật giỏi. Dù sao, ta khó mà quản lý [ROOT.Char.Custom('GetRealmOrDomicile')|l] nếu không làm được điều đó.\n\nCông việc hôm nay chỉ là chuyện nhỏ ở vùng quê [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], thứ mà ta và đoàn tùy tùng có thể giải quyết nhanh chóng và suôn sẻ—\n\nKhông báo trước, con ngựa của ta lồng lên vì một con vật nhỏ trên đường. Ta suýt bị hất văng mạnh, chỉ kịp giành lại quyền kiểm soát vào giây cuối cùng."
  harm.1012.a:0 "Nào nào, ngoan nào, bình tĩnh..."
  harm.1012.a.tt:0 "#WEAK Suýt nữa thì nguy to...#!"

  harm.1021.t.prefix:0 "No Nê"
  harm.1021.t:0 "$harm.1021.t.prefix$: Quá Mức"
  harm.1021.desc:0 "Bữa tối, bữa ăn ngon nhất, chưa kể là lớn nhất trong ngày!\n\nAhh, thật là thời khắc tuyệt vời để còn sống: bao nhiêu kết cấu để thưởng thức, bao nhiêu hương vị để cảm nhận, bao nhiêu gia vị đậm đà để— để—\n\nCó gì đó thắt lại trong bụng ta.\n\nMột khối đau đớn nở ra, bóp nghẹt dạ dày, đồng thời lan những ngón tay lạnh buốt của đau đớn khắp nội tạng. Không phải độc dược, chỉ là sự kết hợp kinh khủng của thức ăn giàu chất đang xé toạc bên trong ta.\n\nTa đã ăn gì... #DIE1 ta#!... #DIE2 ưgh#!..."
  harm.1021.a:0 "Ta... không ổn..."
  harm.1021.a.tt.success:0 "$harm.0000.tt.death.success$"
  harm.1021.a.tt.failure:0 "$harm.0000.tt.death.failure$"
  harm.1021.b:0 "Mang nước mát — ta cần nằm xuống. Ngay."
  harm.1021.c:0 "Chắc phải có thuốc gì đó chứ!"
  harm.1021.c.tt.success:0 "$harm.0000.tt.death.success$"
  harm.1021.c.tt.failure:0 "$harm.0000.tt.death.failure$"

  harm.1022.t:0 "$harm.1021.t.prefix$: Chưa Đủ"
  harm.1022.desc:0 "Nhân danh [ROOT.Char.GetFaith.HouseholdGodName], ta thật #EMP no nê#!. Ngả người trên ghế sau bữa tối, nghe [ROOT.Char.Custom('GetCourtierPlural')] trò chuyện, thế giới dường như наконец cũng trở nên đúng đắn.\n\nGần đây ta thực sự mong chờ bữa tối hơn bao giờ hết. Hình ảnh, hương vị, âm thanh... và cả cảm giác nước sốt đậm đà chảy xuống cằm.\n\nÍt nhất là cho đến khi dạ dày ta rên rỉ vì quá tải, và một cơn cuộn nhẹ đe dọa làm ta trào ra.\n\nDẫu vậy, nó cũng qua nhanh như lúc đến. Hầu hết các buổi tối."
  harm.1022.a:0 "May mà nó qua nhanh."
  harm.1022.a.tt:0 "#WEAK Trở lại bữa tối...#!"

  harm.1031.t.prefix:0 "Cổ Họng Tắc Nghẽn"
  harm.1031.t:0 "$harm.1031.t.prefix$: Ngạt Thở"
  harm.1031.desc:0 "Cơn nóng bỏng như lửa trong huyết quản khiến ta choàng tỉnh, tiếng kêu cháy bỏng của thân xác đòi không khí, đòi giải thoát, đòi thứ gì đó.\n\nMiệng ta... cổ họng ta... bị tắc? Không phải bị nhét đầy, mà bị chặn bởi thứ gì đó ghê tởm dâng lên từ bên trong.\n\nTa ho ra những cục mủ vàng đặc, ngọt lợ, mùi tử khí và thịt thối bám theo từng sợi đờm, nhưng nó vẫn không ngừng trào ra.\n\nCứu... ta cần... #EMP cứu#!."
  harm.1031.a:0 "Không... thở... được..."
  harm.1031.a.tt.success:0 "$harm.0000.tt.death.success$"
  harm.1031.a.tt.failure:0 "$harm.0000.tt.death.failure$"
  harm.1031.b:0 "Chỉ cần... kiểm soát... hơi thở... cho đến khi gặp thầy thuốc."
  harm.1031.c:0 "Bình tĩnh. Thở nhẹ. Đến chỗ thầy thuốc."
  harm.1031.c.tt.success:0 "$harm.0000.tt.death.success$"
  harm.1031.c.tt.failure:0 "$harm.0000.tt.death.failure$"

  harm.1032.t:0 "$harm.1031.t.prefix$: Khó Thở"
  harm.1032.desc:0 "Nhân danh [ROOT.Char.GetFaith.HealthGodName], lần này đã hai #EMP ngày#! đau đớn.\n\nHàm ta đau nhức, cổ họng khàn và rát, bên trong miệng như... sưng lên? Ăn đau. Nuốt đau. Thậm chí nhai cũng #EMP đau#!.\n\nThầy thuốc cam đoan rằng có lẽ không có gì đáng lo, chỉ là sự mất cân bằng tự nhiên, sẽ tự khỏi theo thời gian.\n\nTa... hy vọng vậy."
  harm.1032.a:0 "Những thứ này rồi sẽ qua."
  harm.1032.a.tt:0 "#WEAK Rồi sẽ sớm đỡ thôi...#!"

  harm.1041.t.prefix:0 "Mặt Nước Yên Bình"
  harm.1041.t:0 "$harm.1041.t.prefix$: Tai Nạn Không Tránh"
  harm.1041.desc:0 "Cho lính canh lui ra ngoài tầm nhìn nhưng vẫn trong tầm nghe, ta tận hưởng chút cô tịch bên [ROOT.Char.Custom('IndefiniteBodyOfWater_Static')] mà ta từng đi ngang qua.\n\nĐưa chân xuống làn nước mát, ta hoan hỉ cảm nhận bụi bặm trong ngày dần được rửa trôi. Đây sẽ là một lần tắm đáng nhớ!\n\nKhông suy nghĩ, chân ta trượt, ta ngã sấp mặt xuống nước. Đầu ta va vào vật cứng khiến ta choáng váng.\n\nNơi này... sâu hơn ta nghĩ. Ta đang bị kéo xuống, xuống sâu vào bóng tối..."
  harm.1041.a:0 "Phải... di chuyển... không... thở..."
  harm.1041.a.tt.success:0 "$harm.0000.tt.death.success$"
  harm.1041.a.tt.failure:0 "$harm.0000.tt.death.failure$"
  harm.1041.b:0 "#EMP Ta phải sống!#!"

  harm.1042.t:0 "$harm.1041.t.prefix$: Có Lẽ An Toàn"
  harm.1042.desc:0 "Không thường xuyên ta có được chút thời gian một mình tại [ROOT.Char.GetCurrentLocation.GetName], nhưng đôi khi vẫn có. Tương đối là một mình — người hầu vẫn ở trong tầm nghe, nhưng đủ xa để ta có chút không gian khi cưỡi ngựa qua lãnh địa.\n\nMột lúc, ta dừng lại bên [ROOT.Char.Custom('IndefiniteBodyOfWater_Static')]. Một nơi hẻo lánh, ta không nghĩ mình từng đi qua đây trước đó... thật yên bình. Dòng nước có vẻ rất sâu, dù những xoáy nhỏ trên bề mặt cho thấy nó chảy về một nơi lớn hơn gần đó.\n\nCó lẽ ta sẽ quay lại đây sớm thôi."
  harm.1042.a:0 "Nơi này thật đẹp."
  harm.1042.a.tt:0 "#WEAK Đáng để quay lại...#!"

  harm.1051.t.prefix:0 "Ngọn Lửa Chập Chờn"
  harm.1051.t:0 "$harm.1051.t.prefix$: Biển Lửa"
  harm.1051.desc:0 "Ta tỉnh giấc bởi tiếng hét \"[ROOT.Char.GetTitledFirstNameNoTooltip]!\" từ bên ngoài, tiếng cảnh báo đầy hoảng loạn của một người hầu.\n\nKhi ta choàng tỉnh, mồ hôi đã ướt đẫm thân thể, theo sau là sức nóng thiêu đốt. [ROOT.Char.Custom('GetRoom')] đang bốc cháy, da ta đã phồng rộp dưới ngọn lửa!\n\nTa ph-*HO*-ải ra khỏi đây, chuyện này là sao... #EMP lũ nến chết tiệt#!\n\nLối ra bị lửa chặn, và nó chỉ càng lúc càng dữ dội."
  harm.1051.a:0 "Chỉ còn cách lao xuyên qua!"
  harm.1051.a.tt.success:0 "$harm.0000.tt.death.success$"
  harm.1051.a.tt.failure:0 "$harm.0000.tt.death.failure$"
  harm.1051.b:0 "Nhảy qua cửa sổ, đó là đường nhanh nhất!"

  harm.1052.t:0 "$harm.1051.t.prefix$: Ánh Nến"
  harm.1052.desc:0 "Giật mình tỉnh giấc, ta rút tay khỏi cây nến đang cháy mà tay ta vừa vô tình chạm vào. Nhân danh mọi cực hình của [ROOT.Char.GetFaith.random_EvilGodNames], đau quá!\n\nMắt còn lờ đờ, ta nhìn quanh [ROOT.Char.Custom('GetRoom')|l]. Hẳn là ta đã ngủ quên mà không dập nến — thật may tay ta chạm vào nó.\n\nNếu nó đổ lên giường..."
  harm.1052.a:0 "Ta phải cẩn thận hơn với nến."
  harm.1052.a.tt:0 "#WEAK Suýt nữa thì tệ hơn nhiều...#!"

  harm.1061.t.prefix:0 "Quang Cảnh"
  harm.1061.t:0 "$harm.1061.t.prefix$: Rơi Xuống"
  harm.1061.desc:0 "Như thường lệ, ta bắt đầu buổi sáng bằng cách thưởng thức cảnh sắc và âm thanh của thế giới bên ngoài cửa sổ phòng mình.\n\nThật sống động, đầy ánh sáng và sinh khí, mọi thứ dường như hoàn hảo; giá mà ta có thể nhìn từ cao hơn một chút, chỉ thêm một chú—\n\n#EMP Chết tiệt#!, quá xa, #EMP trượt rồi#!!"
  harm.1061.a:0 "Chộp lấy khung cửa."
  harm.1061.a.tt.success:0 "$harm.0000.tt.death.success$"
  harm.1061.a.tt.failure:0 "$harm.0000.tt.death.failure$"
  harm.1061.b:0 "Chụp—#EMP chụp#!—CHỤP!"
  harm.1061.c:0 "Ngả người ra sau."
  harm.1061.c.tt.success:0 "$harm.0000.tt.death.success$"
  harm.1061.c.tt.failure:0 "$harm.0000.tt.death.failure$"

  harm.1062.t:0 "$harm.1061.t.prefix$: Ngắm Nhìn Vô Hại"
  harm.1062.desc:0 "Ôi, một ngày bên ngoài thật ngoạn mục!\n\nĐứng bên cửa sổ phòng mình, ta cảm thấy thật may mắn khi còn sống, nhìn xuống những con người đang qua lại bên dưới và vùng hoang dã xa xa. Được tiếp thêm sinh lực, ta hoàn toàn sẵn sàng bắt đầu công việc trong ngày.\n\nTuy vậy... thêm một chút nữa cũng chẳng hại gì. Háo hức tận hưởng tất cả, ta nghiêng đầu ra ngoài, tận hưởng làn không khí trong lành lướt qua căn phòng cao vút.\n\nVà thế là đủ rồi."
  harm.1062.a:0 "Thật ngoạn mục!"
  harm.1062.a.tt:0 "#WEAK Một cách dễ chịu, vô hại để bắt đầu buổi sáng...#!"

  harm.1071.t.prefix:0 "Tội Ác Của Đam Mê"
  harm.1071.t:0 "$harm.1071.t.prefix$: Hành Động"
  harm.1071.desc:0 "Cánh cửa [ROOT.Char.Custom('GetDoor')] gần như bị xé toạc khi ta bước qua, [other.GetTitledFirstName] đang chạy trốn dữ dội và nhanh nhất có thể, khiến ta ngã ngửa ra sau.\n\nTa thấy một tia thép bạc lóe lên sau [other.GetHerHim], và tiếng gầm gừ của [killer.GetTitledFirstName] khi [killer.GetSheHe] truy đuổi, con dao đã nhắm thẳng vào ta — sự giận dữ của kẻ sát nhân chùn xuống khi [killer.GetWomanMan] nhận ra rằng ta #EMP không#! phải là nạn nhân mà hắn nhắm tới, nhưng cú lao người không kiểm soát của [killer.GetHerHim] đã quá nhanh để dừng lại.\n\nMũi dao lao thẳng vào cổ ta."
  harm.1071.a:0 "Tránh con dao."
  harm.1071.a.tt.success:0 "$harm.0000.tt.death.success$"
  harm.1071.a.tt.failure:0 "$harm.0000.tt.death.failure$"
  harm.1071.b:0 "Dễ dàng né sang bên khỏi lưỡi dao."
  harm.1071.c:0 "Dựa vào phản xạ của bản thân."
  harm.1071.c.tt.success:0 "$harm.0000.tt.death.success$"
  harm.1071.c.tt.failure:0 "$harm.0000.tt.death.failure$"

  harm.1072.t:0 "$harm.1071.t.prefix$: Một Cuộc Cãi Vã Nhỏ"
  harm.1072.desc:0 ""Và còn một chuyện nữa, ngươi [other.Custom2('InsultAdjective', SCOPE.sC('killer'))] [other.Custom2('InsultNoun', SCOPE.sC('killer'))]!", [killer.GetTitledFirstName] hét lên, mắng nhiếc [other.GetTitledFirstName] trong cuộc cãi vã ầm ĩ lần thứ ba trong ngày.\n\nTa phớt lờ sự cãi cọ dù ồn ào, tiếp tục bước đi. Hai kẻ này lúc nào cũng cãi nhau, và dù lớn tiếng, rốt cuộc cũng vô hại.\n\nTa còn nhiều chuyện lớn hơn phải lo thay vì mấy cuộc khẩu chiến nhỏ giữa đám [ROOT.Char.Custom('GetCourtierPlural')|l] của mình."
  harm.1072.a:0 "Lại một ngày náo nhiệt ở [ROOT.Char.Custom('GetCourt')|l], nhỉ?"
  harm.1072.a.tt:0 "#WEAK Chuyện của chúng mà thôi...#!"

  harm.1081.t.prefix:0 "Thời Tiết Thất Thường"
  harm.1081.t:0 "$harm.1081.t.prefix$: Cơn Thịnh Nộ Của Bão"
  harm.1081.desc:0 "Chết tiệt cái linh hồn thất thường của [ROOT.Char.GetFaith.WaterGodName], [ROOT.Char.GetFaith.WaterGodSheHe] đã kết án ta cùng đoàn tùy tùng phải chết trong cơn bão khốn kiếp này!\n\nĐiều đáng lẽ chỉ là một chuyến đi nhỏ tới ngôi làng gần đó đã biến từ một ngày sáng sủa thành bóng tối u ám, thành một hành trình qua những cơn gió gào thét, bị mưa quất như đá cuội và đe dọa bởi những tia sét cùng tiếng sấm vang rền.\n\nNếu không tìm được chỗ trú sớm, cái lạnh và ẩm ướt sẽ cướp mạng chúng ta chắc chắn như bất kỳ lưỡi kiếm nào."
  harm.1081.a:0 "Nếu phi nhanh đủ, ta có thể về đến nhà."
  harm.1081.a.tt.success:0 "$harm.0000.tt.death.success$"
  harm.1081.a.tt.failure:0 "$harm.0000.tt.death.failure$"
  harm.1081.b:0 "Chỗ trũng kia, ta có thể trú ở đó!"
  harm.1081.c:0 "Ta — ta nghĩ mình có chỗ ẩn gần đây?"
  harm.1081.c.tt.success:0 "$harm.0000.tt.death.success$"
  harm.1081.c.tt.failure:0 "$harm.0000.tt.death.failure$"

  harm.1082.t:0 "$harm.1081.t.prefix$: Sấm Xa"
  harm.1082.desc:0 "Ta nhìn những cơn bão dữ dội bất thường cuộn mình trên đường chân trời, tiếng sấm vọng lại từ những đám mây chỉ cách vài dặm.\n\nMột trận mưa đáng lo — liệu đây có phải dấu hiệu thần linh vì ta đã bỏ sót điều gì, hay chỉ là chuyển động ngẫu nhiên của gió?\n\nDù sao đi nữa, ta không hề muốn bị mắc kẹt trong đó."
  harm.1082.a:0 "Hy vọng [ROOT.Char.GetFaith.FateGodName] không ám chỉ điều gì."
  harm.1082.a.tt:0 "#WEAK Không phải lúc thích hợp để ở ngoài...#!"

  harm.1091.t.prefix:0 "Trái Tim Dồn Dập"
  harm.1091.t:0 "$harm.1091.t.prefix$: Suy Nghĩ Cháy Bỏng"
  harm.1091.desc:0 "#EMP Lạy [ROOT.Char.GetFaith.HighGodName] nhân từ, xin hãy cứu ta khỏi cảnh này#!!\n\nCơn đau dồn dập nào đang nện nát hộp sọ ta thành từng mảnh máu me, nhịp đập thiêu đốt nào đang dội trong mạch máu ta theo nhịp trống của [ROOT.Char.GetFaith.DevilNamePossessive]...\n\nTa— ta vẫn ổn, rồi bỗng... buồn nôn dâng lên không báo trước, rồi ta... #EMP aggggh#!, dừng lại đi, dừng lại đi, #BER DỪNG LẠI ĐI#!!\n\nX-xin. #DIE1 Làm nó#! #DIE2 dừng lại#!."
  harm.1091.a:0 "#EMP Đầu óc ta?!#!"
  harm.1091.a.tt.success:0 "$harm.0000.tt.death.success$"
  harm.1091.a.tt.failure:0 "$harm.0000.tt.death.failure$"
  harm.1091.b:0 "Ta. Sẽ. Chịu Đựng."
  harm.1091.c:0 "Tỉnh táo, tỉnh táo, ta cần #EMP tỉnh táo#!."
  harm.1091.c.tt.success:0 "$harm.0000.tt.death.success$"
  harm.1091.c.tt.failure:0 "$harm.0000.tt.death.failure$"

  harm.1092.t:0 "$harm.1091.t.prefix$: Đầu Óc Đau Nhức"
  harm.1092.desc.intro:0 "Hai tuần qua, ta bị hành hạ bởi những cơn đau đầu #EMP dồn dập#! như vậy.\n\n"
  harm.1092.desc.blind:0 "Ta không thể nghĩ, không thể tập trung, thậm chí gần như không nghe thấy — âm thanh dường như biến mất trừ khi quá cao hoặc quá trầm.\n\n[ROOT.Char.GetFaith.HealthGodName|U] hẳn đang thấy thú vị khi nguyền rủa ta bằng những cơn đau đầu chỉ để lại tiếng trẻ con khóc và tiếng ngựa hí."
  harm.1092.desc.fallback:0 "Mỗi khi cơn đau ập đến, tầm nhìn của ta co lại, mọi ánh sáng và hình ảnh biến mất cho đến khi chỉ còn một góc nhỏ của thế giới, luôn ở rìa tầm nhìn và bị nhấn chìm bởi cơn đau.\n\n[ROOT.Char.GetFaith.HealthGodName|U] rõ ràng thấy nỗi khổ của ta thật thú vị, vì những cơn đau này xuất hiện ngày càng thường xuyên."
  harm.1092.a:0 "Uggh, đầu ta..."
  harm.1092.a.tt:0 "#WEAK Có lẽ ngươi nên nghỉ ngơi...#!"

  harm.1101.t.prefix:0 "Khu Dân Cư Nhộn Nhịp"
  harm.1101.t:0 "$harm.1101.t.prefix$: Tránh Ra!"
  harm.1101.desc:0 "Một lần nữa ta cưỡi ngựa qua các con phố của [ROOT.Char.GetCurrentLocation.GetName], đoàn tùy tùng tự hào mang theo cờ hiệu phía sau. Một việc nhỏ trong thị trấn cần ta xử lý, nên ta tranh thủ đi một chuyến, nhưng ta vẫn mong được trở về nhà.\n\nKhi tới một ngã giao, ta bị phân tâm bởi tiếng cười khúc khích của một nhóm thanh niên ngưỡng mộ, và không nghe thấy tiếng chiếc xe ngựa lao tới cho đến khi người đánh xe hét lên cảnh báo."
  harm.1101.a:0 "Nhảy tránh ra."
  harm.1101.a.tt.success:0 "Một tiếng va chạm kinh hoàng và tiếng hí thất thanh phía sau"
  harm.1101.a.tt.failure:0 "Thế giới biến thành mớ gỗ vỡ và tay chân gãy vụn"
  harm.1101.b:0 "Ép ngựa sát vào tường hơn."
  harm.1101.c:0 "Lao người về phía trước và cầu may."
  harm.1101.c.tt.success:0 "$harm.0000.tt.death.success$"
  harm.1101.c.tt.failure:0 "$harm.0000.tt.death.failure$"

  harm.1102.t:0 "$harm.1101.t.prefix$: An Toàn Đường Phố"
  harm.1102.desc:0 "Cưỡi ngựa cùng đoàn tùy tùng qua các con phố của [ROOT.Char.GetCurrentLocation.GetName], ta giữ phong thái nghiêm nghị. Đôi khi cần phải xuất hiện, nhưng cũng quan trọng không kém là giữ uy quyền.\n\nChúng ta dừng lại khi một chiếc xe ngựa lao qua ngã giao đông đúc với tốc độ quá nhanh.\n\nMay cho người đánh xe — không khôn ngoan khi cắt ngang đường của [ROOT.Char.GetTitleAsNameNoTooltip], nhưng con ngựa của hắn chạy quá nhanh để nhận ra, chứ đừng nói là dừng lại."
  harm.1102.a:0 "Dân thường cũng cần thấy [ROOT.Char.GetTitleAsNameNoTooltip] của họ."
  harm.1102.a.tt:0 "#WEAK Dù chỉ là thoáng qua trước nhà họ...#!"

  harm.1111.t.prefix:0 "Triều Đại Khủng Bố"
  harm.1111.t:0 "$harm.1111.t.prefix$: Công Lý Của Dân"
  harm.1111.desc:0 "Khi đi ngang qua [ROOT.Char.Custom('GetCourt')] của mình, ta luôn được hộ tống bởi lính canh để bảo vệ. Lại còn nhiều người canh gác lối vào, chưa kể đến [ROOT.Char.Custom('GetChamber')] của ta. Đủ để ngăn chặn bất kỳ kẻ xâm nhập nào, nhưng rõ ràng là không đủ để ngăn một tên hầu chết tiệt va vào ta và —\n\nĐau. Một cơn đau buốt nhói như bị đâm thật sự. Máu đang trào ra từ bụng ta khi ta loạng choạng lùi lại, con dao của tên hầu cắm phập vào người ta.\n\nVệ sĩ của ta đã hạ tên sát thủ xuống sàn chỉ trong vài giây. Hắn vẫn cười nhếch mép ngay cả khi [killer.GetSheHe] chết — không nghi ngờ gì nữa, đây hoàn toàn là chuyện cá nhân.\n\nAi cũng muốn chết như một người hùng."
  harm.1111.a:0 "Gah, ta xong rồi!"
  harm.1111.a.tt.success:0 "$harm.0000.tt.death.success$"
  harm.1111.a.tt.failure:0 "$harm.0000.tt.death.failure$"
  harm.1111.b:0 "Thế này chưa giết được #EMP ta#! đâu."
  harm.1111.c:0 "#EMP Lại#! thích khách nữa sao? Nực cười!"
  harm.1111.c.tt.dread:0 "Tùy chọn này mở khóa nhờ [dread|E] cao của ngươi"
  harm.1111.c.tt.success:0 "$harm.0000.tt.death.success$"
  harm.1111.c.tt.failure:0 "$harm.0000.tt.death.failure$"

  harm.1112.t:0 "$harm.1111.t.prefix$: Tuân Phục Vì Sợ"
  harm.1112.desc:0 "Khi ta rẽ góc, lính hộ vệ theo sát phía sau, một tên hầu suýt va vào ta khi đang mang một cái bát.\n\nVào giây cuối, hắn xoay người tránh, vừa kịp không làm đổ bát súp nóng bỏng vào mặt ta.\n\n"Nhìn đường mà đi!" một lính hộ vệ gầm lên.\n\nTên hầu gật đầu lia lịa, sợ đến mức không dám nói, rồi vội vàng bỏ đi. Cách hành xử đúng sau một sai lầm nghiêm trọng như vậy."
  harm.1112.a:0 "Cũng may chưa tệ hơn."
  harm.1112.a.tt:0 "#WEAK Dạo này đúng là không tìm nổi người hầu ra hồn...#!"











 ##################################################
 # #Random Death Battle Events
  harm.2001.t:0 "Sốt Doanh Trại"
  harm.2001.desc:0 "Nguyền rủa toàn bộ [ROOT.Char.GetCurrentLocation.GetName]! Thật là một sự mỉa mai quái quỷ khi các cuộc vây hãm vốn nhằm bào mòn kẻ phòng thủ, thì chính các #EMP trại#! vây hãm lại là ổ bẩn thỉu và bệnh tật?\n\nKhi Ta tỉnh dậy sáng nay, đó là cảm giác ruột gan quặn thắt và ngọn lửa lỏng thiêu đốt trong bụng. Ta không thể ngừng tuôn ra từ mọi lỗ, Ta thậm chí không còn đứng nổi.\n\nTa chưa từng muốn chết theo cách này."
  harm.2001.a:0 "Ruột... ruột của Ta... eurgh..."
  harm.2001.a.tt.success:0 "$harm.0000.tt.death.success$"
  harm.2001.a.tt.failure:0 "$harm.0000.tt.death.failure$"
  harm.2001.b:0 "Ta sẽ không kết thúc tại đây."
  harm.2001.c:0 "Ta biết Ta cần gì. Mang cho Ta... mang cho Ta..."
  harm.2001.c.tt.success:0 "$harm.0000.tt.death.success$"
  harm.2001.c.tt.failure:0 "$harm.0000.tt.death.failure$"

  harm.2011.t:0 "Cơn Bệnh Trên Đường Hành Quân"
  harm.2011.desc:0 "Cơn đau đã hành hạ Ta gần một tuần — mồ hôi lạnh và cơn sốt dồn dập, ruột gan quặn thắt và đôi tay run rẩy. Ta không biết mình mắc phải thứ gì, nhưng rõ ràng đó là căn bệnh bất ngờ do điều kiện hành quân và những trại nghỉ đêm gây ra.\n\nNgay cả lúc này, tầm nhìn của Ta bắt đầu chao đảo, nhưng Ta phải tiếp tục.\n\nPhải. Tiếp tục. Chúng Ta phải... tiếp..."
  harm.2011.a:0 "Tại sao... cái gì..."
  harm.2011.a.tt.success:0 "$harm.0000.tt.death.success$"
  harm.2011.a.tt.failure:0 "$harm.0000.tt.death.failure$"
  harm.2011.b:0 "Binh lính của Ta chỉ chịu đựng những gì Ta có thể chịu."
  harm.2011.c:0 "Ta đã chịu đựng điều tệ hơn, chắc vậy?"
  harm.2011.c.tt.success:0 "$harm.0000.tt.death.success$"
  harm.2011.c.tt.failure:0 "$harm.0000.tt.death.failure$"

  harm.2021.t:0 "Lạnh... Quá Lạnh..."
  harm.2021.desc:0 "Không đúng khi phải hành quân trong cái lạnh thế này. Không đúng. Mỗi buổi tối trong trại, chúng Ta đào những ngôi mộ mới cho những người sẽ được phát hiện vào sáng hôm sau, cho những kẻ phải bị bỏ lại nhưng không đáng phải phó mặc cho lũ quạ vô tâm.\n\nTa gần như ghen tị với họ. Với họ, cuộc vật lộn đã kết thúc. Họ không còn phải đối mặt với cái #EMP giá rét#! vô nghĩa này.\n\nCái lạnh mùa đông cắt vào tận tủy xương Ta, liên tục chen ngang suy nghĩ bằng những cơn đau tê buốt, không cho Ta nghỉ ngơi, không cho Ta tập trung.\n\nCó lẽ... có lẽ sẽ tốt hơn nếu..."
  harm.2021.a:0 "..."
  harm.2021.a.tt.success:0 "$harm.0000.tt.death.success$"
  harm.2021.a.tt.failure:0 "$harm.0000.tt.death.failure$"
  harm.2021.b:0 "Ta. Có. Một số mệnh. Cao hơn."
  harm.2021.c:0 "Ta. Sẽ không. Kết thúc."
  harm.2021.c.tt.success:0 "$harm.0000.tt.death.success$"
  harm.2021.c.tt.failure:0 "$harm.0000.tt.death.failure$"

  harm.2031.t:0 "Nóng... Quá Nóng..."
  harm.2031.desc:0 "Mặt trời luôn sáng như thế này sao? Nóng như thế này sao? Áp bức như thế này sao?\n\nTa thậm chí không biết mình đã ở vùng đất bị [ROOT.Char.GetFaith.HealthGodName] nguyền rủa này bao lâu rồi, thiếu nước sạch và buộc phải tiếp tục tiến bước.\n\nChiến dịch buộc chúng Ta phải tiếp tục, nhưng mỗi ngày lại rút cạn thêm một chút sức lực. Một chút nữa, đổ ra qua mồ hôi và thấm xuống mảnh đất khát nước. Một phần của chính Ta vĩnh viễn mất đi trong cái nóng vô tình.\n\nTừng ngày một."
  harm.2031.a:0 "Sự bạo ngược của ánh sáng và cơn khát đang hủy diệt chúng Ta..."
  harm.2031.a.tt.success:0 "$harm.0000.tt.death.success$"
  harm.2031.a.tt.failure:0 "$harm.0000.tt.death.failure$"
  harm.2031.b:0 "Ta. Có. Một số mệnh. Cao hơn."
  harm.2031.c:0 "Ta không phải kẻ ngu của [ROOT.Char.GetFaith.DeathDeityNamePossessive]."
  harm.2031.c.tt.success:0 "$harm.0000.tt.death.success$"
  harm.2031.c.tt.failure:0 "$harm.0000.tt.death.failure$"

  harm.2041.t:0 "Vì Lãnh Địa"
  harm.2041.desc:0 "Ngay cả Ta cũng gần như quên mất chúng Ta đã chiến tranh bao nhiêu năm. Con đường chinh chiến bào mòn tất cả, mỗi ngày lấy đi thêm một chút và chỉ ban cho chút nghỉ ngơi ít ỏi mỗi đêm trong trại.\n\nTrở về lều sau khi bàn bạc với quan hậu cần, Ta thấy nơi này kỳ lạ vắng vẻ. Không lính canh mệt mỏi, không lính đánh thuê cay đắng, không lính nghĩa vụ nhớ nhà. Vắng vẻ, cho đến khi nửa tá binh sĩ vũ trang giáp trụ bước ra từ bóng tối bao quanh Ta.\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip],\" tên phản loạn dẫn đầu khạc ra, \"những cuộc chiến ngu xuẩn của ngươi đã khiến tất cả chúng Ta phải trả giá quá đắt. Lần này, #EMP chính ngươi#! sẽ trả giá.\""
  harm.2041.a:0 "Phản bội! PHẢN BỘI!"
  harm.2041.a.tt.success:0 "$harm.0000.tt.death.success$"
  harm.2041.a.tt.failure:0 "$harm.0000.tt.death.failure$"
  harm.2041.b:0 "Chỉ sáu tên? Tới đây, lũ vô dụng!"
  harm.2041.c:0 "#BER TA SẼ KHIẾN CÁC NGƯƠI CHẢY MÁU VÌ ĐIỀU NÀY!#!"
  harm.2041.c.tt.success:0 "$harm.0000.tt.death.success$"
  harm.2041.c.tt.failure:0 "$harm.0000.tt.death.failure$"

  harm.2051.t:0 "Chết Đói"
  harm.2051.desc:0 "Ít thứ nào hủy diệt một đội quân triệt để như cơn đói — không tấm khiên nào chặn được nó, không lưỡi kiếm nào đẩy lùi được nó, không giáp trụ nào làm dịu cơn đau của nó.\n\nKhông thức ăn, không nước, không gì giữ chúng Ta tiếp tục ngoài những con vật thồ thúc đẩy bước tiến, quân lính của Ta đang dần kiệt quệ.\n\nNgay cả... ngay cả Ta... cũng đang héo mòn vì thiếu dưỡng chất..."
  harm.2051.a:0 "Da Ta... như giấy..."
  harm.2051.a.tt.success:0 "$harm.0000.tt.death.success$"
  harm.2051.a.tt.failure:0 "$harm.0000.tt.death.failure$"
  harm.2051.b:0 "Tình hình vẫn còn cứu vãn được."
  harm.2051.c:0 "Chúng Ta còn dự trữ, chúng Ta #EMP phải#! còn dự trữ!"
  harm.2051.c.tt.success:0 "$harm.0000.tt.death.success$"
  harm.2051.c.tt.failure:0 "$harm.0000.tt.death.failure$"

  harm.2061.t:0 "Bị Truy Đuổi Từng Bước"
  harm.2061.desc:0 "Khi quân đội của Ta tháo chạy khỏi chiến trường [ROOT.Char.GetCurrentLocation.GetName], các nhóm lính nhỏ giao chiến, bỏ chạy hoặc truy đuổi khắp nơi. Tùy tùng của Ta tan rã, lính canh chết hoặc bỏ chạy, và Ta cũng tản ra cùng họ.\n\nChỉ cần tập hợp lại, chỉ cần—\n\nTa vòng qua một tảng đá lớn, chỉ để đối mặt trực diện với một nhóm binh lính mang huy hiệu của kẻ địch.\n\nNhe răng, chúng lao tới với tiếng hét."
  harm.2061.a:0 "Tránh xa Ta ra, lũ khốn!"
  harm.2061.a.tt.success:0 "$harm.0000.tt.death.success$"
  harm.2061.a.tt.failure:0 "$harm.0000.tt.death.failure$"
  harm.2061.b:0 "CHẠY!"
  harm.2061.c:0 "Thổi kèn, [ROOT.Char.GetTitleAsNameNoTooltip] cần trợ giúp!"
  harm.2061.c.tt.success:0 "$harm.0000.tt.death.success$"
  harm.2061.c.tt.failure:0 "$harm.0000.tt.death.failure$"

  harm.2071.t:0 "Chiến Thắng Thảm Khốc"
  harm.2071.desc:0 "Đội quân chiến thắng của Ta quét sạch chiến trường tại [ROOT.Char.GetCurrentLocation.GetName]. Khắp nơi là tiếng reo hò chiến thắng của binh lính khi chúng Ta truy đuổi kẻ thù.\n\nNgay cả Ta và tùy tùng cũng đắm mình trong sự tàn sát, hân hoan trong chiến thắng. Nó khiến đội hình hơi phân tán, đúng, nhưng kẻ địch đã bị đánh bại và không thể—\n\nLính canh của Ta đâu? Những binh lính quanh Ta... chúng mang cờ của [actor.GetPrimaryTitle.GetNameNoTier]! Sự thù hận trong mắt và máu trên răng, kẻ thù bại trận lao về phía Ta, sẵn sàng kết liễu Ta."
  harm.2071.a:0 "Ngươi chưa thể lấy mạng Ta đâu, [ROOT.Char.GetFaith.DeathDeityName]!"
