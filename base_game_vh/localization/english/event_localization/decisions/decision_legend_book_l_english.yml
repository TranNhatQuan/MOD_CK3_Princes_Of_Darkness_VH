l_english:
 # Commision Legend Book
 ce1_decision_events.0001.t: "Ghi Chép Lại"
 ce1_decision_events.0001.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chronicler'))] [chronicler.GetFirstName] của ta chào ta với một nụ cười hài lòng. Đèn đọc sách [chronicler.GetHerHis] của ngài gần như đã cạn dầu.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [chronicler.GetSheHe] nói, khi [chronicler.GetSheHe] đặt xuống một cuốn sách được trang trí đẹp đẽ, \"chúng ta đã đảm bảo theo dõi mọi thứ nhỏ nhặt, mọi hành động, mọi trận chiến, mọi cuộc phiêu lưu và mọi mối tình.\"\n\n\"Tất cả,\" [chronicler.GetSheHe] tiếp tục, \"được ghi lại cho hậu thế.\""
 ce1_decision_events.0001.a: "Thật tuyệt vời!"
 legend_book: "[ROOT.Var('finished_legend_var').Legend.GetName]"
 legend_book_desc: "#EMP [ROOT.Var('finished_legend_var').Legend.GetChapterDescriptionByName('opening')]#!\n\n#EMP Truyền thuyết của [ROOT.Var('finished_legend_var').Legend.GetProtagonist.GetTitledFirstNamePossessiveNoTooltip|U] đạt đến cao trào trong một cuộc phiêu lưu kỳ vĩ: những chiến công lẫy lừng của [ROOT.Var('finished_legend_var').Legend.GetProtagonist.GetHerHis] khiến mọi vị vua đều kinh ngạc, và nhiều quý tộc lẫn thứ dân đã tìm đến để gặp [ROOT.Var('finished_legend_var').Legend.GetProtagonist.GetHerHis], bởi họ mong được tận mắt chứng kiến huyền thoại sống.#!\n\n#EMP [ROOT.Var('finished_legend_var').Legend.GetChapterDescriptionByName('conclusion')]#!"
