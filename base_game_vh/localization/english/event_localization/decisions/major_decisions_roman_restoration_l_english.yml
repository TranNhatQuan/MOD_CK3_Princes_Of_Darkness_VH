l_english:
# Restoring Roman Empire as Byzantium, by Henrik Thyrwall & Flavio Verna
 roman_restoration.0001.t:0 "Bình Minh của một Kỷ Nguyên Mới"
 roman_restoration.0001.desc.intro:0 "Hỡi bằng hữu, hỡi người La Mã, hỡi đồng bào, hãy lắng nghe ta!\n\nSau sự phục hồi kỳ diệu của những lãnh thổ đã mất từ nhiều thế kỷ trước, Đế chế La Mã đã được tái sinh! Châu Âu đã phải chịu đựng thời kỳ tăm tối kể từ khi lũ man rợ tràn qua biên cương đế quốc, nhưng giờ đây một kỷ nguyên rực rỡ mới đã ló dạng cho toàn bộ nền văn minh."
 roman_restoration.0001.desc.greeks:0 "\n\nNhà nước La Mã sẽ không còn bị những kẻ tự xưng ghen ghét ở phương Tây gọi là \"Đế chế của người Hy Lạp\" nữa, mà sẽ được công nhận là người thừa kế chân chính của di sản La Mã."
 roman_restoration.0001.desc.other:0 "\n\nNơi vô số kẻ tự xưng Hy Lạp đã thất bại, thì một người [scoped_emperor.GetCulture.GetName] đã thành công, khôi phục lại \"Đế chế của người Hy Lạp\" đã suy tàn."
 roman_restoration.0001.desc.christians:0 "Imperium Romanum một lần nữa đứng vững, được khôi phục lại vinh quang cổ xưa dưới sự cai trị sáng suốt của ta, sẵn sàng mang văn minh, an toàn và ánh sáng thiêng liêng của Chúa đến mọi góc của thế giới đã biết. Vì Viện Nguyên Lão và Nhân dân La Mã!"
 roman_restoration.0001.desc.hellenics:0 "Imperium Romanum một lần nữa đứng vững, được khôi phục lại vinh quang cổ xưa và tôn giáo của nó dưới sự cai trị sáng suốt của ta. \n\nNhững Quân đoàn mới sẽ tiến quân đến các tỉnh còn lại vẫn từ chối chủ quyền của Đế chế mới này, và rèn nên một Pax Romana mới từ thời đại tăm tối này. Vì Viện Nguyên Lão và Nhân dân La Mã!"
 roman_restoration.0001.desc.fallback: "Imperium Romanum một lần nữa đứng vững, được khôi phục lại vinh quang cổ xưa dưới sự cai trị sáng suốt của ta, sẵn sàng mang văn minh, an toàn và tình yêu của [ROOT.Char.GetFaith.HighGodName] đến mọi góc của thế giới đã biết. Vì Viện Nguyên Lão và Nhân dân La Mã!"
 roman_restoration.0001.a:0 "Esto perpetua!"
 roman_restoration.0002.t:0 "Kỷ Nguyên Thứ Hai của La Mã"
 roman_restoration.0002.desc:0 "Đế quốc Byzantine, trước đây bị nhiều người ở phương Tây gọi là \"Đế chế của người Hy Lạp\", bằng cách nào đó đã giành lại đủ lãnh thổ đã mất để tuyên bố Đế chế La Mã được khôi phục!"
 roman_restoration.0002.desc.christians:0 "\n\nKhông thể phủ nhận nữa rằng họ chính là những người kế thừa chân chính của La Mã và di sản huy hoàng của nó. Một kỷ nguyên mới đã mở ra."
 roman_restoration.0002.desc.hellenics:0 "\n\nCòn đáng kinh ngạc hơn, Đế chế La Mã mới này đã từ bỏ Kitô giáo để quay về với các vị thần ngoại giáo cổ xưa! Nếu không sớm bị ngăn chặn, làn sóng dị giáo mới này có thể đe dọa sự tồn vong của chính Kitô giáo!"
 roman_restoration.0002.a:0 "Chuyện đó có thể là thật sao?"
 roman_restoration.0002.b:0 "Nhưng... còn Đế chế của ta thì sao?"
 roman_restoration.0002.c:0 "Ngày tận thế đã gần!"
 roman_restoration.0002.d:0 "Ta sẽ ngăn chặn chúng!"
 roman_restoration.0002.e:0 "Ta hiểu rồi..."

# Restoring Roman Empire as HRE, by Flavio Verna
 roman_restoration.0003.t:0 "Thánh và La Mã"
 roman_restoration.0003.desc.greeks:0 "Thật trớ trêu khi Đế chế từng bị người Byzantine bôi nhọ là kẻ giả mạo man rợ lại được đưa tới vinh quang vĩnh cửu dưới sự lãnh đạo của người Hy Lạp...\n\n"
 roman_restoration.0003.desc.other:0 ""
 roman_restoration.0003.desc:1 "Giấc mơ của Charlemagne đã được hoàn thành nhờ những hành động dũng cảm của ta. Đế chế La Mã Thần thánh đã vươn lên vị trí xứng đáng của mình như người kế thừa chân chính của La Mã, tuyên bố quyền thống trị cả phương Đông lẫn phương Tây. \n\nĐây là khởi đầu của một kỷ nguyên mới của hòa bình và thịnh vượng cho mọi [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] khắp nơi. Những Quân đoàn được chúc phúc của đế quốc này sẽ mang thông điệp thiêng liêng của Chúa đến mọi góc của thế giới cho đến khi một Giáo hội Phổ quát thực sự được thiết lập. Vì [ROOT.Char.GetFaith.HighGodName|U] và [scoped_emperor.GetTitleTierName] của La Mã!"
 roman_restoration.0003.a:0 "Esto perpetua!"
 roman_restoration.0004.t:0 "Thánh và La Mã"
 roman_restoration.0004.desc.byzantines:0 "Điều không thể tưởng tượng đã xảy ra! Những kẻ giả danh phương Tây đã quản lý để tạo ra một con đường đẫm máu ở các tỉnh phía Đông và tuyên bố chủ quyền trái tim của Đế chế vinh quang một thời của chúng ta.\n\nSau khi khôi phục hầu hết các tỉnh cổ xưa dưới sự cai trị [scoped_emperor.GetHerHis] của ngài, [scoped_emperor.GetTitledFirstName] đã tuyên bố Đế chế La Mã được khôi phục dưới sự lãnh đạo man di [scoped_emperor.GetHerHis] của ngài."
 roman_restoration.0004.desc.others:1 "Kể từ khi Charlemagne được Giáo hoàng Leo III trao vương miện, Đế chế của người Hy Lạp luôn nhìn kẻ tự xưng ở phương Tây bằng ánh mắt khinh miệt. Thế nhưng [scoped_emperor.GetTitledFirstName] đã đạt được điều không tưởng: khôi phục các biên giới Đông và Tây như thời cổ đại.\n\nĐế chế mới này, được rèn nên dưới ánh sáng thiêng liêng của [scoped_emperor.GetFaith.HealthGodName], đứng như Imperium Romanum chân chính duy nhất, sẵn sàng mang trật tự đến một thế giới tăm tối."
 roman_restoration.0004.a:0 "Có thể sao...?"
 roman_restoration.0004.b:0 "Chúng vẫn chỉ là kẻ giả mạo!"

# New Emperor becomes Augustus, by Flavio Verna
 roman_restoration.0005.t:0 "Augustus"
 roman_restoration.0005.desc.regular:0 "Được Viện Nguyên Lão và Quân đội tung hô, ta đã được công nhận là người cai trị hợp pháp của Đế chế La Mã được khôi phục. \n\nKhông có vinh dự hay trách nhiệm nào lớn hơn có thể đặt lên một [ROOT.Char.GetWomanMan]. Ta phải sống xứng đáng với kỳ vọng của thần dân nếu muốn giữ quyền lực lâu dài."
 roman_restoration.0005.desc.holy:0 "Được hàng giáo sĩ [ROOT.Char.GetFaith.GetAdjective] và Quân đội tung hô, ta đã được công nhận là người cai trị hợp pháp của Đế chế La Mã được khôi phục. \n\nNhờ ân sủng của [ROOT.Char.GetFaith.HighGodName], ta sẽ có thể cai trị công chính và lâu dài."
 roman_restoration.0005.a:0 "Vạn tuế Caesar!"

# Old Emperor loses Augustus, by Flavio Verna
 roman_restoration.0006.t:0 "Một Hoàng Đế Mới"
 roman_restoration.0006.desc:0 "Sau khi mất toàn bộ tính chính danh, ta không còn có thể tuyên bố danh hiệu Augustus nữa. Đế chế giờ đây thuộc về [new_holder.GetTitledFirstName]."
 roman_restoration.0006.a:0 "Ta sẽ trở lại!"

# Old Roman Provinces are Restored, by Henrik Thyrwall & Flavio Verna
 roman_restoration.0010.t:0 "Tỉnh Syria Palaestina"
 roman_restoration.0010.desc:0 "Toàn bộ tỉnh cổ đại Syria Palaestina cuối cùng đã được giải phóng khỏi bàn tay bẩn thỉu của lũ man rợ và khôi phục về Imperium Romanum. Một lễ khải hoàn vĩ đại sẽ được tổ chức cho những anh hùng dũng cảm đã thực hiện chiến công này. Mong tên tuổi của họ vang vọng đến muôn đời!"
 roman_restoration.0010.a:0 "Đế chế muôn năm!"
 roman_restoration.0011.t:0 "Tỉnh Aegyptus"
 roman_restoration.0011.desc:0 "Thời kỳ tăm tối đã chấm dứt đối với người dân Aegyptus, khi quyền cai trị của La Mã một lần nữa được khôi phục tại tỉnh này. Vùng đất của các Pharaoh từng phục vụ như vựa lúa của đế chế cổ, và nay nó sẽ lại trở thành nền tảng thiết yếu cho sự thịnh vượng tiếp tục của Nhà nước La Mã huy hoàng."
 roman_restoration.0012.t:0 "Tỉnh Cyrenaica"
 roman_restoration.0012.desc:0 "Người dân Cyrenaica có thể vui mừng, vì luật pháp La Mã một lần nữa được duy trì trên vùng đất cằn cỗi này. Một tỉnh La Mã cổ đại khác đã trở về vòng tay của đế chế hùng mạnh nhất mà thế giới văn minh từng biết. Mong rằng nó sẽ không bao giờ phải chịu sự tàn bạo của lũ man rợ nữa."
 roman_restoration.0013.t:0 "Tỉnh Africa"
 roman_restoration.0013.desc:0 "Những đại bàng vàng của La Mã một lần nữa tỏa sáng trên tỉnh Africa xưa kia, như chúng đã từng cách đây rất nhiều thế kỷ. Quân đội đế quốc đang tiến qua thành phố Carthage, kẻ thù cổ đại của La Mã, như minh chứng rõ ràng rằng lịch sử thực sự lặp lại."
 roman_restoration.0014.t:0 "Tỉnh Illyricum"
 roman_restoration.0014.desc:0 "Tỉnh Illyricum trước đây của La Mã một lần nữa được khôi phục cho những chủ nhân chính đáng trong Imperium Romanum đang trỗi dậy. Khi bờ đông Adriatic đã được bảo đảm, vùng đất tuyển quân quan trọng này có thể trở nên thiết yếu trong các chiến dịch tương lai nhằm khôi phục biên giới chính đáng của La Mã ở phương Tây."
 roman_restoration.0015.t:0 "Tỉnh Italia"
 roman_restoration.0015.desc:0 "Lần thứ hai kể từ khi Đế chế Tây La Mã sụp đổ, Italia đã được giải phóng và khôi phục dưới quyền cai trị chính đáng của La Mã — hy vọng lần này là vĩnh viễn. Thành phố vĩ đại Roma giờ đã nằm dưới quyền kiểm soát của ta, và ngay cả những người lính dày dạn cũng rơi lệ khi cờ hiệu đế quốc tung bay trong gió từ Cột Trajan."
 roman_restoration.0016.t:0 "Tỉnh Gallia"
 roman_restoration.0016.desc:0 "Gallia, từ lâu bị cho là đã vĩnh viễn mất khỏi quyền cai trị của La Mã, nay đã khuất phục trước La Mã và được tái nhập vào Đế chế. Tỉnh này đã thay đổi rất nhiều kể từ khi Caesar chinh phạt vùng đất này hơn một nghìn năm trước, nhưng giờ nó sẽ không còn phải chịu sự cai trị của những vị vua nổi lên hay các hoàng đế giả mạo nữa."
 roman_restoration.0017.t:0 "Tỉnh Germania"
 roman_restoration.0017.desc:0 "Đế chế La Mã giờ đây đã mở rộng vượt xa biên giới mà nó từng đạt tới ngay cả dưới thời vĩ đại của [GetScriptedCharacterByHistoryID( '145279' ).GetFirstName]. Germania, kẻ thù lâu đời của các quân đoàn La Mã, cuối cùng cũng đã bị bình định và sáp nhập vào Đế chế. Từ nay nó sẽ được cai trị bởi sự tiếp nối chân chính của Nhà nước La Mã — chứ không phải một đế chế giả mạo."
 roman_restoration.0018.t:0 "Tỉnh Britannia"
 roman_restoration.0018.desc:0 "Bị bỏ mặc cho số phận khi các đồn trú La Mã rời khỏi tỉnh Britannia vào thế kỷ thứ 5, người Briton cuối cùng cũng có thể vui mừng. Sau nhiều thế kỷ tăm tối, quyền cai trị của La Mã cuối cùng đã được khôi phục trên hòn đảo nhỏ của họ, và họ có thể một lần nữa tự xem mình là thần dân của Đế quốc."
 roman_restoration.0019.t:0 "Tỉnh Hispania"
 roman_restoration.0019.desc:0 "Quyền lực và ảnh hưởng của Đế chế La Mã giờ đây một lần nữa lan tới tỉnh Hispania cổ. Vùng đất này đã chịu nhiều đau khổ bởi những cuộc giao tranh biên giới liên miên giữa các lãnh chúa Hồi giáo và Công giáo, nhưng giờ nó cuối cùng cũng có thể biết đến hòa bình khi Pax Romana phủ xuống bán đảo."
 roman_restoration.0020.t:0 "Tỉnh Mauretania"
 roman_restoration.0020.desc:0 "Danh tướng Belisarius từng tái chinh phục một phần Mauretania từ tay người Vandal man rợ vào thế kỷ thứ 6, nhưng cuối cùng tất cả đều bị người Ả Rập chiếm lại trong cuộc tiến công không ngừng khắp Bắc Phi. Nay khi vùng đất này đã hoàn toàn trở lại quyền kiểm soát của La Mã sau nhiều thế kỷ cai trị hỗn loạn, nó có thể lại thịnh vượng."
 roman_restoration.0021.t:0 "Tỉnh Mesopotamia"
 roman_restoration.0021.desc:0 "Hoàng đế Trajan từng chinh phục Mesopotamia từ Đế chế Parthia và tổ chức nó thành một tỉnh La Mã, nhưng nó đã bị người kế vị Hadrian từ bỏ chỉ vài năm sau đó. Giờ đây hai con sông Euphrates và Tigris lại nằm dưới sự bảo hộ của La Mã, và lần này có lẽ sẽ là lâu dài."
 roman_restoration.0022.t:0 "Tỉnh Caledonia"
 roman_restoration.0022.desc:0 "Biên giới của La Mã giờ đã tiến xa vượt qua tàn tích cổ của cả Tường Hadrian và Tường Antonine để cuối cùng bao gồm toàn bộ Caledonia. Vùng đất khắc nghiệt và khắc khổ này là quê hương của một dân tộc kỳ lạ, nhưng rồi họ cũng sẽ trở thành những công dân La Mã hữu ích."
 roman_restoration.0023.t:0 "Tỉnh Hibernia"
 roman_restoration.0023.desc:0 "Hòn đảo Hibernia là vùng đất mới nhất gia nhập lãnh thổ ngày càng mở rộng của Đế chế La Mã. Vùng đất đồi thoai thoải và cánh đồng xanh này chưa từng bị đế chế cổ chinh phục, nhưng nó sẽ trở thành một lãnh địa dễ chịu để cai trị nếu người cai trị không ngại mưa hay những người Norse bốc mùi dọc bờ biển."
 roman_restoration.0024.t:1 "Biên Giới Đế Quốc Được Khôi Phục"
 roman_restoration.0024.desc.intro:0 "Câu chuyện về sự phục hưng huy hoàng của Đế chế La Mã sẽ được kể lại qua nhiều thời đại. Những kẻ kém may mắn từng sống trong những ngày đen tối khi lũ man rợ cướp phá Roma tùy ý hoặc khi các đạo quân Ả Rập tràn ra từ sa mạc hẳn không dám mơ đến ngày hôm nay. Tất cả các tỉnh cổ đã được tái chiếm, và Đế chế giờ đây trải rộng hơn bất kỳ thời điểm nào trong gần một nghìn năm."
 roman_restoration.0024.desc.christian:0 "\n\nChuông nhà thờ khắp châu Âu đang vang lên để chúc mừng sự kiện trọng đại này và nam nữ ở cả Roma lẫn Constantinople đang rơi nước mắt vì vui sướng. Vì lợi ích của toàn thể nhân loại, Pax Romana mới phải trường tồn, kẻo thế giới lại chìm vào một thời đại tăm tối khác của ngu muội và man rợ khi thiếu ánh sáng dẫn đường của La Mã."
 roman_restoration.0024.desc.hellenic:0 "\n\nBằng cách gạt bỏ gánh nặng của vị thần đã chết của người Galilee và tái tôn kính các vị thần Olympus, Đế chế của Caesar và Augustus đã trỗi dậy từ tro tàn của mình. Vì lợi ích của toàn thể nhân loại, Pax Romana mới phải trường tồn, kẻo thế giới lại chìm vào một thời đại tăm tối khác của ngu muội và man rợ khi thiếu ánh sáng dẫn đường của La Mã."
 roman_restoration.0024.desc.fallback:0 "\n\nVô số người thuộc mọi chủng tộc và tín ngưỡng khắp châu Âu đang ăn mừng sự kiện trọng đại này và nam nữ ở cả Roma lẫn Constantinople đang rơi nước mắt vì vui sướng. Vì lợi ích của toàn thể nhân loại, Pax Romana mới phải trường tồn, kẻo thế giới lại chìm vào một thời đại tăm tối khác của ngu muội và man rợ khi thiếu ánh sáng dẫn đường của La Mã."

# Schism is mended, by Henrik Thyrwall & Flavio Verna
 roman_restoration.0100.t:0 "Đại Ly Giáo Được Hàn Gắn"
 roman_restoration.0100.desc.intro:1 "Cuối cùng thì Đại Ly Giáo cũng đã được hàn gắn."
 roman_restoration.0100.desc.orthodox:0 "\n\nNhững Giám mục kiêu ngạo ở Roma sẽ không còn có thể tự nhận quyền tối thượng vượt trên các đồng cấp của họ nữa, phớt lờ hoặc công khai bất tuân các giáo luật. Với việc Ngũ Tòa được tái thống nhất dưới quyền đế quốc Chính Thống, đức tin Công giáo giờ đây chỉ còn rất ít ảnh hưởng đối với người dân châu Âu. \n\nChỉ còn là vấn đề thời gian trước khi số ít vẫn bám víu vào những nghi thức lỗi thời và dị giáo bị đưa trở lại vòng tay của Giáo hội Đại kết chân chính."
 roman_restoration.0100.desc.catholic:0 "\n\nCuộc đấu tranh kéo dài hàng thế kỷ của Giáo hoàng nhằm khẳng định quyền tối thượng của mình đối với Ngũ Tòa cuối cùng đã đi đến hồi kết. Với việc các tòa nguyên thủy được tái thống nhất dưới quyền Công giáo, hàng giáo sĩ Chính Thống đã bị buộc phải cúi đầu trước thẩm quyền không thể chối cãi của ngai tòa Thánh Phêrô. \n\nSố ít trong bọn họ vẫn bám víu vào những nghi thức lỗi thời và dị giáo sẽ sớm bị đưa vào vòng tay của Giáo hội Đại kết chân chính, bằng cách này hay cách khác."
 roman_restoration.0100.desc.generic:0 "\n\nVới Ngũ Tòa nằm vững chắc dưới quyền kiểm soát của [mending_faith.GetAdjective], trong một bước ngoặt bất ngờ, cả Giáo hoàng ở Roma lẫn Thượng phụ Constantinople giờ đây đều không còn có thể phủ nhận quyền tối thượng của [mending_faith.GetName] đối với mọi nhánh khác của Kitô giáo."
 roman_restoration.0100.a:0 "Giáo hội Phổ quát đã được khôi phục!"
 roman_restoration.0101.desc.intro:0 "Đại Ly Giáo đã giày vò Kitô giáo suốt bấy lâu cuối cùng cũng đã chấm dứt."
 roman_restoration.0101.desc.orthodox:0 "\n\nSau khi [scoped_emperor.GetTitledFirstName] chinh phục toàn bộ các tòa Đại kết của Ngũ Tòa nguyên thủy, Giáo hội Chính Thống đã có thể buộc phần lớn thế giới Công giáo phải công nhận thẩm quyền của mình như nhánh Kitô giáo hợp pháp duy nhất. Tầng lớp quý tộc Vatican mục nát đã bị buộc phải lưu vong, và những kẻ ủng hộ họ đang suy tàn từng ngày."
 roman_restoration.0101.desc.catholic:0 "\n\nSau khi [scoped_emperor.GetTitledFirstName] chinh phục toàn bộ các tòa Đại kết của Ngũ Tòa nguyên thủy, Tòa Thánh cuối cùng đã đạt được tham vọng lâu dài của mình là nhổ tận gốc Giáo hội Chính Thống và trở thành nhánh Kitô giáo hợp pháp duy nhất. Khi Thượng phụ bị buộc phải lưu vong và nhiều thần học gia Chính Thống nổi tiếng quy phục trước thẩm quyền của ngai tòa Thánh Phêrô, Chính Thống giáo có thể sớm chìm vào quên lãng."
 roman_restoration.0101.desc.generic:0 "\n\nSau khi [scoped_emperor.GetTitledFirstName] chinh phục toàn bộ các tòa Đại kết của Ngũ Tòa nguyên thủy, Giáo hội [mending_faith.GetAdjective] đã cưỡng ép mình trở thành nhánh Kitô giáo hợp pháp duy nhất trong mắt nhiều người. Khi cả Giáo hoàng lẫn Tòa Thượng phụ Đại kết đều bị bật khỏi những trung tâm quyền lực tổ tiên của mình, nhiều tín đồ Chính Thống và Công giáo đang đổ về Giáo hội Phổ quát mới."
 roman_restoration.0101.a:0 "Nếu gió đang thổi theo hướng này..."
 roman_restoration.0101.b:0 "Dị giáo! Tất cả bọn chúng!"
 roman_restoration.0102.a:0 "Tin tức đáng lo..." 

# Restored Patriarchate Events, by Henrik Thyrwall & Flavio Verna
	roman_restoration.0104.t:0 "Tòa Thượng phụ Antiôkia"
	roman_restoration.0104.desc:0 "Với việc thành phố đã trở lại dưới quyền kiểm soát của La Mã, Tòa Thượng phụ Antiôkia đã được khôi phục đúng vị trí của mình như một trong các tòa giám mục của Ngũ Thượng Phụ trong Giáo hội Chính Thống Đông phương. Ban đầu nó được thành lập bởi Thánh Tông đồ Phêrô, người được Giáo hội Công giáo phương Tây coi là Giáo hoàng đầu tiên."
	roman_restoration.0104.a:0 "Tạ ơn Chúa!"
	roman_restoration.0105.t:0 "Tòa Thượng phụ Jerusalem"
	roman_restoration.0105.desc:0 "Với việc thành phố đã trở lại dưới quyền kiểm soát của La Mã, Tòa Thượng phụ Jerusalem đã được khôi phục đúng vị trí của mình như một trong các tòa giám mục của Ngũ Thượng Phụ trong Giáo hội Chính Thống Đông phương. Ban đầu nó được thành lập bởi Thánh Giacôbê Công Chính, người được đặt làm người đứng đầu Giáo hội tại Jerusalem ngay sau cái chết của Chúa Giêsu."
	roman_restoration.0106.t:0 "Tòa Thượng phụ Alexandria"
	roman_restoration.0106.desc:0 "Với việc thành phố đã trở lại dưới quyền kiểm soát của La Mã, Tòa Thượng phụ Alexandria đã được khôi phục đúng vị trí của mình như một trong các tòa giám mục của Ngũ Thượng Phụ trong Giáo hội Chính Thống Đông phương. Ban đầu nó được thành lập bởi Thánh Máccô Thánh sử, người trở thành Thượng phụ đầu tiên của Alexandria."
	roman_restoration.0107.t:0 "Tòa Thượng phụ Roma"
	roman_restoration.0107.desc:0 "Với việc thành phố đã trở lại dưới quyền kiểm soát của La Mã, Tòa Thượng phụ Roma đã được khôi phục đúng vị trí của mình như một trong các tòa giám mục của Ngũ Thượng Phụ trong Giáo hội Chính Thống Đông phương. Nếu cả năm tòa thượng phụ lịch sử được đưa trở lại Ngũ Thượng Phụ, Đại Ly giáo giữa Giáo hội Đông và Tây cuối cùng có thể được hàn gắn."
	roman_restoration.0120.t:0 "Tòa Thượng phụ Bài Trừ Thánh Tượng"
	roman_restoration.0120.desc:0 "Với việc đại đô thành Constantinople rơi vào tay phe Bài Trừ Thánh Tượng, một Thượng phụ mới đã được đặt lên lãnh đạo Giáo hội Đông phương. Với sự trợ giúp của [new_pope.GetFaith.HighGodName], [new_pope.GetFirstName] sẽ chứng tỏ mình là một nhà lãnh đạo đức hạnh và thấu đáo hơn so với các vị tiền nhiệm Đại kết của [new_pope.GetHerHis]. \n\nTòa Thượng phụ mới này chắc chắn sẽ chống lại sự thái quá, tham nhũng và thờ ngẫu tượng của người tiền nhiệm, và mở ra một kỷ nguyên mới huy hoàng cho tất cả các tín đồ Bài Trừ Thánh Tượng trung thành."

# Imposing the Iconoclast Patriarchate, by Flavio Verna
	roman_restoration.0120.a:0 "Đả đảo những thần tượng báng bổ này!"
	roman_restoration.0121.desc.orthodox:0 "Với việc đại đô thành Constantinople rơi vào tay những kẻ dị giáo, tên Bài Trừ Thánh Tượng đê hèn [reformer.GetTitledFirstName] đã bổ nhiệm một Thượng phụ giả cho Giáo hội Đại kết, trục xuất toàn bộ các giáo phẩm Chính Thống khỏi chức vị của họ.\n\nNếu tên bạo chúa này không sớm bị phế truất và sự báng bổ của [reformer.GetHerHis] không bị sửa chữa, đây có thể là khởi đầu cho sự kết thúc của Giáo hội Chính Thống."
	roman_restoration.0121.desc.iconoclast:0 "Với việc đại đô thành Constantinople nằm trong tay phe Bài Trừ Thánh Tượng, một Thượng phụ mới đã được [reformer.GetTitledFirstName] đặt lên lãnh đạo Giáo hội Đông phương. Với sự trợ giúp của [new_pope.GetFaith.HighGodName], [new_pope.GetFirstName] sẽ chứng tỏ mình là một nhà lãnh đạo đức hạnh và thấu đáo hơn so với các vị tiền nhiệm Đại kết của [new_pope.GetHerHis]. \n\nTòa Thượng phụ mới này chắc chắn sẽ chống lại sự thái quá, tham nhũng và thờ ngẫu tượng của người tiền nhiệm, và mở ra một kỷ nguyên mới huy hoàng cho tất cả các tín đồ Bài Trừ Thánh Tượng trung thành."
	roman_restoration.0121.desc.other:0 "Với việc đại đô thành Constantinople nằm trong tay phe Bài Trừ Thánh Tượng, một Thượng phụ mới đã được [reformer.GetTitledFirstName] đặt lên lãnh đạo Giáo hội Đông phương.\n\nVà khi phần lớn hàng giáo sĩ Chính Thống cũ đã bị phế truất, bắt giữ hoặc buộc phải lưu vong, đức tin Đại kết đã bị hạ xuống thành địa vị của một tà giáo."
	roman_restoration.0121.a:0 "Lũ man rợ!"
	roman_restoration.0121.b:0 "Cuối cùng thì cũng đến lúc!"
	roman_restoration.0121.c:0 "Ta hiểu..."

# Restoring the Ecumenical Patriarchate, by Flavio Verna
	roman_restoration.0122.t:0 "Tòa Thượng phụ Đại kết"
	roman_restoration.0122.desc:0 "Cuộc lưu đày đáng tiếc của Tòa Thượng phụ Đại kết cuối cùng đã chấm dứt.\n\nGiáo hội chân chính duy nhất đã trở lại Constantinople, sẵn sàng dẫn dắt thế giới Kitô giáo bằng một bàn tay vững vàng nhưng nhân từ."
	roman_restoration.0122.a:0 "Vinh quang!"
	roman_restoration.0123.desc.orthodox:0 "Cuộc lưu đày đáng tiếc của Tòa Thượng phụ Đại kết cuối cùng đã chấm dứt.\n\nNhờ sự lãnh đạo mộ đạo của [reformer.GetTitledFirstName], Giáo hội chân chính duy nhất đã trở lại Constantinople, sẵn sàng dẫn dắt thế giới Kitô giáo bằng một bàn tay vững vàng nhưng nhân từ."
	roman_restoration.0123.desc.iconoclast:0 "Một bè lũ thờ ngẫu tượng đê hèn do [reformer.GetTitledFirstName] tổ chức đã chiếm được Constantinople và khôi phục lại Tòa Thượng phụ dị giáo tham nhũng của thời trước. Nếu họ không sớm bị ngăn chặn, phong trào Bài Trừ Thánh Tượng có thể sớm chìm vào quên lãng!"
	roman_restoration.0123.desc.other:0 "Cuộc lưu đày đáng tiếc của Tòa Thượng phụ Đại kết cuối cùng đã chấm dứt.\n\nNhờ sự lãnh đạo mộ đạo của [reformer.GetTitledFirstName], Giáo hội Đông phương đã trở lại vị trí chính đáng của mình tại Constantinople."
	roman_restoration.0123.a:0 "Cuối cùng lý trí đã được khôi phục cho Giáo hội!"
	roman_restoration.0123.b:0 "Lũ thờ ngẫu tượng đê hèn, tất cả bọn chúng!"
	roman_restoration.0123.c:0 "Ta hiểu..."

# Restoring the Papacy, by Flavio Verna
	roman_restoration.0124.t:0 "Tòa Thánh"
	roman_restoration.0124.desc:0 "Thời kỳ hỗn loạn và tuyệt vọng của thế giới Công giáo đã chấm dứt: với một Giáo hoàng mới được khôi phục tại tòa lịch sử của Roma, Giáo hội chân chính duy nhất cuối cùng có thể phục hồi sau những thất bại thảm khốc trong thời gian gần đây.\n\nVới sự trợ giúp của [new_pope.GetFaith.HighGodName], [new_pope.GetTitledFirstName] sẽ mang lại trật tự và ổn định cho hàng giáo sĩ Công giáo từng bị phân tán khắp châu Âu và tái lập một hệ thống thứ bậc nghiêm ngặt cho Giáo hội."
	roman_restoration.0124.a:0 "Tòa Thánh đã trỗi dậy từ tro tàn!"
	roman_restoration.0125.desc.catholic:0 "Nhờ sự can thiệp được ban phước của [reformer.GetTitledFirstName], thời kỳ hỗn loạn và tuyệt vọng của thế giới Công giáo đã chấm dứt: với một Giáo hoàng mới được khôi phục tại tòa lịch sử của Roma, Giáo hội chân chính duy nhất cuối cùng có thể phục hồi sau những thất bại thảm khốc trong thời gian gần đây.\n\nVới sự trợ giúp của [new_pope.GetFaith.HighGodName], [new_pope.GetTitledFirstName] sẽ mang lại trật tự và ổn định cho hàng giáo sĩ Công giáo từng bị phân tán khắp châu Âu và tái lập một hệ thống thứ bậc nghiêm ngặt cho Giáo hội."
	roman_restoration.0125.desc.other:0 "Sau khi mất đi tòa tổ tiên và phần lớn những người ủng hộ, Giáo hội Công giáo đã bị nhiều người cho là đang bên bờ sụp đổ. Tuy nhiên, nhờ sự can thiệp mộ đạo của [reformer.GetTitledFirstName], một Giáo hoàng mới lại một lần nữa trị vì tại Roma.\n\nVới việc Tòa Thánh cuối cùng được khôi phục, người Công giáo có thể giành lại vị trí của mình như một nhánh Kitô giáo lớn."
	roman_restoration.0125.a:0 "Giáo hội Mẹ của chúng ta lại toàn vẹn một lần nữa!"
	roman_restoration.0125.b:0 "Thật thú vị..."

# Destroying the Papacy, by Flavio Verna
	roman_restoration.0130.t:0 "Sự Giải Thể Giáo hoàng quyền"
	roman_restoration.0130.desc.muslim:1 "Quyền thống trị của Kitô hữu tại Roma cuối cùng đã chấm dứt. \n\nNhờ nỗ lực tận tâm của nhiều tôi tớ trung thành của [scoped_destroyer.GetFaith.HighGodName], toàn bộ Ý đã rơi vào sự cai trị của [scoped_destroyer.GetFaith.GetAdjective]. Những tín đồ đã không mệt mỏi loại bỏ mọi biểu tượng báng bổ và đưa hàng giáo sĩ sa đọa từng cai trị những vùng đất này ra trước công lý."
	roman_restoration.0130.desc.hellenic:1 "Sự chuyên chế của bọn Galile trên châu Âu cuối cùng đã chấm dứt.\n\nTrong nhiều thế kỷ, những kẻ sùng bái tự tôn này đã được tự do phỉ báng và phá hoại các tượng đài cổ xưa của các vị thần bảo hộ thiêng liêng của chúng ta, nhưng giờ thì không còn nữa! Bằng việc khôi phục sự cai trị của [scoped_destroyer.GetFaith.GetAdjective] tại Roma và bán đảo Ý, chúng ta đã nghiền nát trái tim của Giáo hội của vị thần thợ mộc."
	roman_restoration.0130.desc.fallback:0 "Sau nhiều thế kỷ bị coi thường và lừa dối bởi các nhà truyền giáo của họ, những người theo [scoped_destroyer.GetFaith.HighGodName] cuối cùng đã trả thù những kẻ theo vị thần Christ. \n\nTrung tâm đức tin của họ đã bị chinh phục với sự phù hộ của các vị thần chúng ta, các nhà thờ của họ bị cướp phá, các linh mục bị tước bỏ toàn bộ quyền lực và phẩm giá. Nhờ cuộc xâm lược vinh quang của ta, ta đã loại bỏ tôn giáo hèn nhát này khỏi thế giới và rửa nhục cho những tổn hại mà họ đã gây ra cho đất đai và tổ tiên chúng ta bằng mưu mẹo của mình."
	roman_restoration.0130.desc.pope.submission:0 "\n\nTrước sự vượt trội tôn giáo không thể chối cãi của chúng ta, cựu Giáo hoàng [scoped_pope.GetFullName] thậm chí đã công khai từ bỏ đức tin [catholic.GetAdjectiveNoTooltip] và cải sang [scoped_destroyer.GetFaith.GetNameNoTooltip]!"
	roman_restoration.0130.desc.pope.crucifixion:0 "\n\n[scoped_pope.GetFirstName], vẫn ngoan cố bám víu vào danh hiệu Pontifex Maximus không xứng đáng, đã bị đóng đinh giữa đống tàn tích đang cháy của Vatican. Như vậy là chấm dứt dòng giáo hoàng Kitô giáo ô nhục của Roma."
	roman_restoration.0130.desc.pope.sacrificed:0 "\n\nNhà thờ chính tòa của Vatican đã được thánh hiến và dâng lại cho [scoped_destroyer.GetFaith.HighGodName] bằng máu của [scoped_pope.GetTitledFirstName] [scoped_pope.GetHerselfHimself], người đã bị hiến tế ngay trên chính bàn thờ mà [scoped_pope.GetSheHe] từng giảng đạo."
	roman_restoration.0130.desc.no_pope:0 "\n\nNhững [catholic.BishopNeuterPlural] rời rạc đã cố gắng riêng lẻ tập hợp những [catholic.GetAdherentNamePluralNoTooltip] đang suy sụp tinh thần, nhưng không có một [catholic.ReligiousHeadName] thực sự để dẫn dắt họ thì rõ ràng những ngày quyền lực Giáo hoàng đã kết thúc."
	roman_restoration.0130.a.a:0 "[scoped_destroyer.GetFaith.HighGodName] đã ban phước cho chúng ta!"
	roman_restoration.0130.a.b:0 "Đây là thời khắc phục hưng của chúng ta!"
	roman_restoration.0130.a.c:0 "Vị thần đã chết của họ cuối cùng cũng không thể bảo vệ họ."
	roman_restoration.0131.desc.faithful:0 "Nhờ chiến dịch chinh phạt không ngừng nghỉ của [scoped_destroyer.GetTitledFirstNamePossessive], toàn bộ bán đảo Ý đã rơi vào sự cai trị của [scoped_destroyer.GetFaith.GetAdjective].\n\nVới sự trợ giúp của [scoped_destroyer.GetFaith.HighGodNamePossessive], [scoped_destroyer.GetSheHe] đã truy lùng mọi bè phái Công giáo còn tụ tập tại Ý và tước đoạt của các Tòa Giám mục lớn toàn bộ của cải và ảnh hưởng, giáng một đòn nặng nề vào quyền uy của Giáo hội giả dối."
	roman_restoration.0131.desc.christians:0 "Chiến dịch khủng bố quái dị của [scoped_destroyer.GetTitledFirstName] đã mang sự đổ nát và bóng tối đến vùng trung tâm của Giáo hội Thánh Mẫu thiêng liêng của chúng ta!\n\nTên dị giáo đê hèn ấy đã tước đoạt toàn bộ tài sản và phẩm giá của Giáo hoàng quyền, tàn sát dã man vô số thần học gia và sẽ không dừng lại cho đến khi [scoped_destroyer.GetSheHe] buộc toàn bộ Kitô giáo phải khuất phục. Với Vatican bị phá hủy và hệ thống phẩm trật tan nát, đức tin Công giáo đã bị hạ xuống thành một giáo phái hỗn loạn."
	roman_restoration.0131.desc.fallback:0 "Chiến dịch chinh phạt táo bạo của [scoped_destroyer.GetTitledFirstName] đã mang sự đổ nát và bóng tối đến vùng trung tâm của Giáo hội Công giáo!\n\nSau khi đã tước đoạt phần lớn tài sản và phẩm giá của Giáo hoàng quyền, dường như [scoped_destroyer.GetSheHe] sẽ chỉ hài lòng khi toàn bộ Kitô giáo bị buộc phải khuất phục. Với Vatican bị phá hủy và hệ thống phẩm trật tan nát, đức tin Công giáo đã bị hạ xuống thành một giáo phái hỗn loạn."
	roman_restoration.0131.a.a:0 "Cuối cùng cũng có kẻ làm điều đó."
	roman_restoration.0131.a.b:0 "Ngày tận diệt đã gần kề!"
	roman_restoration.0131.a.c:0 "Ta hiểu..."

# Unifying Italy, by Flavio Verna
	roman_restoration.0140.t:0 "Đế quốc Ý"
	roman_restoration.0140.desc:0 "Kể từ khi Đế quốc Tây La Mã sụp đổ, bán đảo Ý đã bị chia cắt giữa các thành bang nổi loạn, những giám mục tham lam và các kẻ chinh phục man rợ.\n\nTuy nhiên, dưới sự cai trị của triều đại ta, Ý đã gạt bỏ những cuộc tranh chấp nhỏ nhen và trở nên thống nhất một lần nữa, trỗi dậy như một cường quốc thống trị tại phương Tây. Từ nay chúng ta sẽ không còn là phần thưởng để người Frank và người Hy Lạp tranh đoạt, cũng không còn bị cướp biển và những kẻ mạo danh man rợ tàn phá. Kể từ hôm nay chúng ta giành lại vị thế của mình như những người thừa kế chân chính của Đế quốc La Mã!"
	roman_restoration.0140.a:0 "Labor omnia vincit!"
	roman_restoration.0141.desc:0 "Kể từ khi Đế quốc Tây La Mã sụp đổ, bán đảo Ý đã bị chia cắt giữa các thành bang nổi loạn, những giám mục tham lam và các kẻ chinh phục man rợ, vinh quang cổ xưa của nó bị phung phí trong những cuộc tranh chấp nhỏ nhen.\n\nTuy nhiên, dưới sự cai trị của [scoped_ruler.GetTitledFirstNamePossessive], Ý đã được thống nhất một lần nữa, trỗi dậy như một cường quốc thống trị tại phương Tây. Từng là chiến lợi phẩm tranh giành giữa người Frank và người Hy Lạp, giờ đây nó đã trở thành một Đế quốc đúng nghĩa, cai trị vùng trung tâm của lãnh thổ La Mã cổ đại."
	roman_restoration.0141.a:0 "Thật đáng tiếc."
	roman_restoration.0141.b:0 "Thật thú vị..."

# Restoring Roman Empire as Italy, by Flavio Verna
	roman_restoration.0150.t:0 "Từ Roma đến Roma"
	roman_restoration.0150.desc:0 "Giờ đây đã rõ rằng mọi nỗ lực khôi phục Đế quốc tan vỡ ngày xưa đều không thể thành công, chừng nào nó còn được theo đuổi bởi những người Đức man rợ hoặc những kẻ Hy Lạp mềm yếu.\n\nChỉ thông qua sự hy sinh của người Ý mà Roma một lần nữa trở về vị trí chính đáng của mình — Nữ vương của các thành phố.\n\n"
	roman_restoration.0150.a:0 "Omnes viae Romam ducunt."
	roman_restoration.0151.t:0 "Kỷ nguyên La Mã thứ hai"
	roman_restoration.0151.desc.byzantines:0 "Điều không thể tưởng tượng đã xảy ra! Những thành bang nhỏ bé của Ý đã xoay xở để thống nhất dưới một ngọn cờ duy nhất và mở ra con đường nhuốm máu tiến vào các tỉnh Đông phương của chúng ta nhằm khôi phục Đế quốc xưa.\n\nSau khi khôi phục phần lớn các tỉnh cổ đại dưới sự cai trị của [scoped_emperor.GetHerHis], [scoped_emperor.GetTitledFirstName] đã tuyên bố Đế quốc La Mã được phục hưng dưới sự lãnh đạo man rợ của [scoped_emperor.GetHerHis]. Với chút ít tính chính danh còn sót lại, chúng ta không còn có thể bác bỏ lời tuyên bố lố bịch này."
	roman_restoration.0151.desc.others:0 "Đế quốc Ý đang trỗi dậy đã chiếm lại đủ số tỉnh cổ xưa dưới sự lãnh đạo của [scoped_emperor.GetTitledFirstName] để tự tuyên bố mình là Đế quốc La Mã tái sinh.\n\nKhinh miệt cả những kẻ mạo danh ở phương Bắc lẫn phương Đông, quốc gia mới này tìm cách khôi phục biên giới cổ xưa của mình trước mọi đối thủ."
 
# Roman Empire dismantles pretenders, by Flavio Verna
	roman_restoration.0160.t:0 "Kẻ Mạo Danh"
	roman_restoration.0160.desc:0 "Quá lâu rồi chúng ta đã dung thứ cho những kẻ mạo danh man rợ ở phương Bắc khoác lên mình phẩm giá Hoàng đế mà chúng không xứng đáng. Roma đang nằm vững chắc dưới sự kiểm soát của Đế quốc chân chính, và liên minh đáng thương của những lãnh chúa Đức từng mưu toan thống trị phương Tây đã bị đẩy vượt qua sông Rhine, trở về những khu rừng man dã nơi chúng thuộc về.\n\nĐã đến lúc dạy cho bọn man rợ này bài học cuối cùng và tước bỏ Đế quốc giả dối của chúng một lần và mãi mãi."
	roman_restoration.0160.a:0 "Quân đoàn của ta sẽ nghiền nát chúng!"
	roman_restoration.0161.t:0 "Phán Quyết La Mã"
	roman_restoration.0161.desc:1 "[byz_emperor.GetTitledFirstName] đã công khai tố cáo ta là một [hre_emperor.GetTitleTierName] giả mạo và sẵn sàng tung sức mạnh khủng khiếp của [byz_emperor.GetPrimaryTitle.GetName] chống lại thần dân của ta.\n\nChừng đó vẫn chưa đủ để giống loài của [byz_emperor.GetHerHis] xua đuổi chúng ta ngày càng xa khỏi quê hương. Roma sẽ không hài lòng cho đến khi nàng tiêu diệt toàn bộ những kẻ mạo danh vinh quang của mình."
	roman_restoration.0161.a:0 "Chúng ta vẫn còn sức chiến đấu!"
	roman_restoration.0162.t:0 "Người Frank bên kia sông Rhine"
	roman_restoration.0162.desc:0 "Xong rồi. Chiến dịch vĩ đại của chúng ta đã phá vỡ cái gọi là Đế quốc La Mã Thần thánh không thể cứu vãn. [hre_emperor.GetTitledFirstName] đã bị làm nhục hoàn toàn và bị tước bỏ mọi phẩm giá Hoàng đế. [hre_emperor.GetSheHe|U] không còn đủ quyền lực hay nguồn lực để thống nhất các bộ tộc Đức man rợ dưới một lá cờ duy nhất."
	roman_restoration.0162.a:0 "Và thật đáng đời!"
	roman_restoration.0163.t:0 "Phán Quyết La Mã"
	roman_restoration.0163.desc:0 "Những người La Mã phục hưng đã làm tê liệt Đế quốc của người Đức đến mức không thể nhận ra. Sau thất bại thảm khốc trước các quân đoàn của họ, lời nói của ta không còn trọng lượng với các chư hầu cũ. Đây là hồi kết của giấc mơ Charlemagne."
	roman_restoration.0163.a:0 "Làm sao điều này có thể xảy ra?"
	roman_restoration.0164.t:0 "Người Frank Phản Công"
	roman_restoration.0164.desc:0 "Trái với mọi dự đoán, [hre_emperor.GetTitledFirstName] đã dựng lên được một cuộc phòng thủ hiệu quả trước các quân đoàn của ta! Với chiến thắng của [hre_emperor.GetHerHis], [hre_emperor.GetSheHe] đã mang lại tính chính danh mới cho Đế quốc xiêu vẹo của [hre_emperor.GetHerHis], đồng thời làm hoen ố danh tiếng của ta không thể cứu vãn."
	roman_restoration.0164.a:0 "Thế còn những Đại Bàng của ta thì sao?!"
	roman_restoration.0165.t:0 "Người Frank Phản Công"
	roman_restoration.0165.desc:1 "Niềm kiêu hãnh của người La Mã đã trở thành sự diệt vong của họ. Bất chấp mọi lời khoe khoang của [byz_emperor.GetHerHis], các quân đoàn của [byz_emperor.GetTitledFirstNamePossessive] đã không thể đứng vững trước những $knight_culture_player_plural_no_tooltip_lowercase$ trung thành của ta. Nhờ sự phòng thủ kiên cường của ta, ta đã mang lại phẩm giá mới cho tước vị của mình."
	roman_restoration.0165.a:0 "Và đừng bao giờ quay lại nữa!"

	roman_restoration.0170.t:0 "Kẻ Mạo Danh"
	roman_restoration.0170.desc:0 "Quá lâu rồi chúng ta đã để cho tàn dư yếu ớt của Đế quốc Justinian bám víu vào phẩm giá của một tước vị mà họ đã làm hoen ố từ lâu bằng một chuỗi vô tận những vị vua bất tài, nhỏ nhen và sa đọa.\n\nCả Ý lẫn Hy Lạp đều đã nằm dưới quyền kiểm soát của chúng ta, trong khi họ chỉ còn là một chế độ chuyên chế phương Đông mục nát, quá tham lam và cay độc để thừa nhận rằng thời đại của họ đã qua từ lâu."
	roman_restoration.0170.a:0 "Chúng ta sẽ đưa ra sự khuyến khích cần thiết."
	roman_restoration.0171.t:0 "Phán Quyết La Mã"
	roman_restoration.0171.desc:1 "[hre_emperor.GetTitledFirstName] đã công khai tố cáo ta là một [byz_emperor.GetTitleTierName] giả mạo và sẵn sàng tung sức mạnh khủng khiếp của [hre_emperor.GetPrimaryTitle.GetName] chống lại thần dân của ta.\n\nChừng đó vẫn chưa đủ để giống loài của [hre_emperor.GetHerHis] xua đuổi chúng ta ngày càng xa khỏi quê hương. Roma sẽ không hài lòng cho đến khi nàng tiêu diệt toàn bộ những kẻ mạo danh vinh quang của mình."
	roman_restoration.0171.a:0 "Chúng ta mới là những người thừa kế chân chính duy nhất của Roma!"
	roman_restoration.0172.t:0 "Byzantion Sụp Đổ"
	roman_restoration.0172.desc:0 "Mọi việc đã xong. Tàn dư thối nát của Đế chế Hy Lạp đã bị xóa sổ khỏi các bờ biển Hy Lạp và Tiểu Á. Với việc các nhà lãnh đạo và quan chức của họ bị tước quyền lực và quân đội bị tê liệt, [byz_emperor.GetTitledFirstName] không còn có thể hỗ trợ triều đình suy đồi của những kẻ nịnh hót và đâm sau lưng [byz_emperor.GetHerHis] của ngài, cũng như không thể dự phóng quyền lực [byz_emperor.GetHerHis] của ngài ra ngoài những bức tường cung điện [byz_emperor.GetHerHis] của ngài."
	roman_restoration.0172.a:0 "Cuối cùng thì cũng đến lúc."
	roman_restoration.0173.t:0 "Phán Quyết La Mã"
	roman_restoration.0173.desc:0 "Đế quốc của ta nằm trong đống đổ nát. Sau chiến dịch tàn bạo nhằm làm nhục và hủy diệt của họ, bầy man rợ của [hre_emperor.GetTitledFirstName] đã để lại cho ta chẳng còn gì ngoài những phế tích và các thành bang đang chinh chiến. Tước vị mà ta từng nắm giữ giờ đây không còn mang bất kỳ phẩm giá Hoàng đế nào."
	roman_restoration.0173.a:0 "Lũ quái vật!"
	roman_restoration.0174.t:0 "Người Hy Lạp Phản Công"
	roman_restoration.0174.desc:0 "Trái với mọi dự đoán, [byz_emperor.GetTitledFirstName] đã dựng lên được một cuộc phòng thủ hiệu quả trước lực lượng của ta! Với chiến thắng của [byz_emperor.GetHerHis], [byz_emperor.GetSheHe] đã mang lại tính chính danh mới cho Đế quốc xiêu vẹo của [byz_emperor.GetHerHis], đồng thời làm hoen ố danh tiếng của ta không thể cứu vãn."
	roman_restoration.0174.a:0 "Làm sao điều này có thể xảy ra?!"
	roman_restoration.0175.t:0 "Người Hy Lạp Phản Công"
	roman_restoration.0175.desc:0 "Các học giả sẽ còn tranh luận lâu dài về sự ngu xuẩn nào đã khiến [hre_emperor.GetTitledFirstName] phát động chiến tranh chống lại những người thừa kế chân chính của Roma. Nỗ lực đáng thương của kẻ mạo danh này nhằm tước bỏ quyền thiêng liêng của ta trong việc cai trị châu Âu chỉ dẫn đến một thất bại nhục nhã và hoàn toàn có thể đoán trước."
	roman_restoration.0175.a:0 "Điều đó chưa từng bị nghi ngờ."
 ######## Byz emp reclaims Constantinople
	roman_restoration.1200.t: "Thành Phố Niềm Khát Khao Của Thế Giới"
	roman_restoration.1200.desc: "Cuối cùng thì đại đô thành Constantinople, ngọn hải đăng rực rỡ của đế quốc phương Đông, đã trở về với chúng ta!\n\nĐám đông reo hò tràn ngập con đường [Glossary( 'Mese', 'MESE_GLOSS' )] treo đầy cờ từ Cổng Theodosian đến Đại Cung Điện, và tiếng hô vang chào đón sự trở về của [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] có thể vang đến tận bên kia Bosporos.\n\nNhiều thế kỷ sau, người ta sẽ còn nhớ rằng chính ta, [ROOT.Char.GetFirstNameRegnal], đã đưa viên ngọc La Mã quý giá nhất này trở lại vòng tay của đế quốc."
	MESE_GLOSS: "Con đường #EMP Mese#!, hay 'Đại Lộ Trung Tâm', là trục đường chính của Constantinople và là tuyến đường của các cuộc rước và khải hoàn. Phần có cột bao quanh của nó, #EMP Regia#!, hay 'Đại Lộ Hoàng Gia', chạy về phía tây từ Hagia Sophia qua từng [Glossary( 'fora', 'FORUM_GLOSS' )] của thành phố, trước khi tách ra đến các cổng trong tường thành Theodosian."
	FORUM_GLOSS: "Forum, được Hy Lạp hóa thành #EMP Fóros#!, là thuật ngữ La Mã chỉ một quảng trường công cộng lớn, dành cho hội họp và chợ búa, thường được trang trí bằng chiến lợi phẩm và tượng đài."
	roman_restoration.1200.a: "Ngai vàng Hoàng đế đã trở về đúng chỗ!"
	roman_restoration.1200.b.rome: "Roma victa!"
	roman_restoration.1200.b: "Thành phố của Constantine lại được an toàn."
	half_price_chariot_race_tooltip: "Ngươi có thể tổ chức một #V $activity_chariot_race$#! [activity|E] với nửa chi phí"
	half_price_chariot_race_flag_desc: "Khôi Phục"
	free_triumph_tooltip: "Ngươi có thể sử dụng #V $hold_triumph_decision$#! [decision|E] miễn phí"
 ######## Byz emp reclaims Constantinople from you by Isabella Welch
	roman_restoration.1204.t:0 "Ngươi, tên [ROOT.Char.Custom('GirlBoy')] khốn khổ,"
	roman_restoration.1204.desc_vassal:0 "Ta đã kéo ngươi ra khỏi bùn lầy, và ta cũng có thể ném ngươi trở lại đó! Ngươi không #EMP thực sự#! nghĩ rằng #EMP Constantinople#!, trụ cột cuối cùng của tri thức trên cõi đời đáng khinh này, có thể thuộc về ngươi! Ngay cả ngón chân nhỏ nhất của ngươi cũng không xứng đặt lên những viên gạch lấp lánh của nó! Hãy trả lại nó, nếu không Vịnh Sừng Vàng sẽ trở thành nơi chôn xác ngươi — chính tay ta sẽ ném ngươi xuống đó nếu cần."
	roman_restoration.1204.a:0 "Ta chỉ trông giữ nó hộ ngài thôi!"
	roman_restoration.1204.b:0 "Mong cái mông lắm lời của ngài bị dằm đâm khi ngồi trên Ngai."
 
