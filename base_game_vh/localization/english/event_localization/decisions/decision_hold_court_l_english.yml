l_english:
 hold_court_decision:0 "Thiết Triều"
 hold_court_decision_desc:0 "Để trở thành một kẻ cai trị thành công, ta phải thực sự phán quyết những tình huống và khó khăn phát sinh trong phạm vi quyền lực của ta.\n\nBằng cách chính thức mời toàn bộ thần dân đến [ROOT.Char.Custom('ResidenceBuilding')] của ta để dâng đơn thỉnh cầu trợ giúp, ta có thể nắm bắt tình hình, xoay chuyển thế cân bằng quyền lực, và cho thiên hạ thấy rõ rằng ta mới là kẻ nắm quyền."
 hold_court_decision_tooltip:0 "Thể hiện quyền uy của ngươi bằng cách [holding_court|E]"
 hold_court_decision_effects:0 "Ngươi mời khách khứa và thần dân đến thỉnh cầu sự trợ giúp của ngươi:\n$EFFECT_LIST_BULLET$ Ngươi có thể biết được những cơ hội đặc biệt\n$EFFECT_LIST_BULLET$ Ngươi có thể ảnh hưởng đến tình thế tại các lãnh địa ngoại quốc\n$EFFECT_LIST_BULLET$ Ngươi có thể nhận thêm Uy Nghi Triều Đình\n$EFFECT_LIST_BULLET$ Ngươi có thể nhận hoặc mất Thiện Cảm, Danh Vọng, Vàng và nhiều thứ khác"
 hold_court_decision_confirm:0 "Tiếp Nhận Thỉnh Nguyện"
 hold_court_gain_grandeur_tooltip:0 "Ngươi sẽ tăng [court_grandeur|E] của mình"
 hold_court_gain_legitimacy_tooltip: "Ngươi sẽ tăng [legitimacy|E] của mình"
