  major_decisions.9000.desc_steward:0 "\n\n[steward.GetTitledFirstName], [ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName] của ta, đang hỏi về mức độ hào phóng mà ta sẵn lòng ban cho thần dân trung thành của mình với tư cách người bảo hộ."
  major_decisions.9000.a:0 "Hãy để các tín đồ biết đến lòng hào phóng của [founder.GetTitleAsNameNoTooltip]!"
  major_decisions.9000.b:0 "Nguyện Allah chấp nhận sadaqah của chúng ta."
