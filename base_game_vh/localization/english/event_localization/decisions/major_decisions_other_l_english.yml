l_english:
 major_decisions.0100.t:0 "Huyết Thống Thiêng Liêng"
 major_decisions.0100.desc.temporal:0 "Nhờ lòng sùng kính thuần khiết và những nỗ lực không ngừng của ta, chức vị linh thiêng nhất của đức tin [scoped_ruler.GetFaith.GetAdjective] đã được gắn chặt với triều đại [scoped_ruler.GetDynasty.GetBaseName].\n\nNgày càng nhiều người trong hàng giáo sĩ và giữa các tín đồ tin rằng gia tộc ta chính là những người được chọn để gìn giữ thánh tích và truyền đạt ý chỉ thần thánh."
 major_decisions.0100.desc.spiritual:0 "Sự tận tâm không lay chuyển của ta đối với những đại diện của [scoped_ruler.GetFaith.HighGodNamePossessive] trên trần thế đã không bị bỏ qua. \n\n[scoped_pope.GetTitledFirstName] đã chính thức công nhận những đóng góp của gia tộc ta và phong thánh danh của chúng ta như những người bảo vệ vĩnh cửu của đức tin [scoped_ruler.GetFaith.GetAdjective]."
 major_decisions.0100.a:0 "Chúng ta hơn cả phàm nhân."
 major_decisions.0100.b:0 "Đức hạnh không tì vết!"
 major_decisions.0102.desc.temporal:0 "Nhờ vào cách hành xử hoàn hảo và sự cai trị sáng suốt [scoped_ruler.GetHerHis] của ngài, [scoped_ruler.GetTitledFirstName] sẽ được bất tử hóa như một trụ cột của [scoped_ruler.GetFaith.GetName].\n\n[scoped_ruler.GetSheHe|U] đã trở thành [scoped_ruler.GetTitleTierName] có ảnh hưởng và được kính trọng nhất trong lịch sử gần đây, và một số người cho rằng có thể có một chút dòng máu thần thánh đang chảy trong huyết quản [scoped_ruler.GetHerHis] của ngài."
 major_decisions.0102.desc.spiritual:1 "Những thành tựu của [scoped_ruler.GetTitledFirstName] lớn lao đến mức [scoped_pope.GetFaith.ReligiousHeadName] [scoped_pope.GetHerselfHimself] đã chính thức công nhận vai trò trọng yếu của [scoped_ruler.GetHerHis] trong việc bảo vệ và truyền bá các đức hạnh [scoped_ruler.GetFaith.GetAdjective].\n\nTriều đại [scoped_ruler.GetDynasty.GetBaseName] sẽ còn được nhớ đến rất lâu nhờ lòng mộ đạo và nhiệt thành xuất phát từ phẩm hạnh hoàn hảo của vị [scoped_ruler.GetWomanMan] vĩ đại này."
 major_decisions.0102.a:0 "Chúng ta đang sống trong thời đại được chúc phúc."
 major_decisions.0102.b:0 "Người ấy là tấm gương cho tất cả chúng ta!"
 major_decisions.0103.desc.temporal:0 "[scoped_ruler.GetTitledFirstName] đã cống hiến cuộc đời [scoped_ruler.GetHerHis] của ngài để khoác lên danh tiếng gia tộc chúng ta chiếc áo choàng của sự thăng tiến thần thánh, và thành quả lao động [scoped_ruler.GetHerHis] của ngài cuối cùng cũng đang lộ diện. \n\nNgày càng nhiều người trong hàng ngũ giáo sĩ và các tín đồ bắt đầu coi triều đại của chúng ta là những người chăm sóc được chọn cho các thánh tích và là những người báo trước ý chí thần thánh."
 major_decisions.0103.desc.spiritual:0 "[scoped_ruler.GetTitledFirstName] đã cống hiến cuộc đời [scoped_ruler.GetHerHis] của ngài để giành lấy sự ủng hộ của giáo sĩ [scoped_ruler.GetFaith.GetAdjective], và thành quả lao động [scoped_ruler.GetHerHis] của ngài cuối cùng cũng đang lộ diện. \n\n[scoped_pope.GetTitledFirstName] đã chính thức công nhận những đóng góp của gia đình chúng ta và thánh hóa tên tuổi chúng ta như những người bảo vệ đức tin vĩnh cửu."
 major_decisions.0103.a:0 "Tất cả chúng ta đều nên biết ơn [scoped_ruler.GetHerHim]."
 major_decisions.0103.b:0 "Lại thêm lời báng bổ từ [scoped_ruler.GetFirstNameNoTooltip]..."


#STRENGTHEN BLOODLINE
 major_decisions.0500.t:0 "Sức Mạnh của [ROOT.Char.GetDynasty.GetBaseNameNoTooltip]"
 major_decisions.0500.desc:0 "Trong nhiều thế hệ, triều đại chúng ta nổi danh vì sức mạnh của dòng máu. Sức sống, vẻ đẹp và trí tuệ đều là những phẩm chất gắn liền với cái tên [ROOT.Char.GetDynasty.GetBaseNameNoTooltip].\n\nSự xuất chúng của chính ta chỉ càng khẳng định điều đó — mọi phẩm chất tốt đẹp nhất của triều đại hội tụ trong một cá nhân hoàn hảo. Danh tiếng và ân phúc của ta sẽ tiếp tục sống mãi qua hậu duệ trong nhiều thế kỷ tới."
 major_decisions.0500.a:0 "Một tương lai rạng rỡ đang chờ đợi chúng ta!"

 #DYNASTY OF MANY CROWNS
 major_decisions.0501.desc:0 "Thông qua những cuộc hôn nhân, liên minh và chinh phạt được tính toán cẩn thận, triều đại [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] đã chiếm lấy vị trí xứng đáng giữa những thế lực chân chính của thế giới đã biết.\n\n[realm_1.GetNameNoTierNoTooltip|U], [realm_2.GetNameNoTierNoTooltip|U], [realm_3.GetNameNoTierNoTooltip|U], [realm_4.GetNameNoTierNoTooltip|U]... Lãnh địa của chúng ta trải rộng khắp nơi. Nhiều vương miện đội trên đầu chúng ta, nhưng bằng huyết thống, chúng ta vẫn là một."
 major_decisions.0501.a:0 "Cầu cho di sản của chúng ta tồn tại vĩnh cửu!"

 major_decisions.0001.t:0 "Kỷ Nguyên Mới"
 major_decisions.0001.desc:0 "Những lề lối cũ đã phục vụ chúng ta rất tốt, và chúng ta sẽ luôn tôn trọng chúng. Tuy nhiên, với tư cách là [ROOT.Char.GetTitleAsNameNoTooltip] của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], ta đã đi đến kết luận rằng chúng ta phải chấp nhận chế độ phong kiến và những nguyên tắc của nó nếu muốn tiếp tục thịnh vượng. Đó là bước đi thiết yếu tiếp theo trên con đường tiến tới vĩ đại!"
 major_decisions.0001.a:0 "Muôn năm [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"

 major_decisions.0002.opening:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"

 major_decisions.0200.t:0 "Trở Về Cội Nguồn"
 major_decisions.0200.desc:0 "Dù ta đã quen với một hệ thống phân cấp nghiêm ngặt và những nông dân không dám chất vấn khi cày cấy trên đồng ruộng, giờ đây ta lại thấy mình cai trị những bộ lạc hỗn loạn. Những người này không tôn trọng ta — họ chỉ tôn trọng sức mạnh.\n\nTa sẽ cho họ thấy sức mạnh! Ta sẽ vứt bỏ những biểu tượng vương quyền mà thần dân của ta căm ghét và chinh phục trái tim họ bằng lưỡi kiếm giương cao!"
 major_decisions.0200.a:0 "Ta sẽ chứng minh giá trị của mình!"

 #Dai Viet
 major_decisions.4000.t: "Triều Đại Nam Đế"
 major_decisions.4000.desc: "Từ vùng đất tổ tiên thiêng liêng của ta đến những dòng sông không ngừng chảy nơi đồng bằng Mekong, chiến thắng vang dội của ta là điều không thể phủ nhận.\n\nDân tộc ta đã đấu tranh suốt nhiều thế kỷ để phát huy tiềm năng thực sự trước những kẻ áp bức phương Bắc, và giờ đây chúng ta đứng cùng nhau để đối mặt với những hiểm họa còn lớn hơn.\n\nHãy để các quốc gia biết rằng ta, [ROOT.Char.GetTitleAsNameNoTooltip] của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], cùng dòng máu được chúc phúc của mình, sẽ là những người bảo hộ chân chính của vùng đất này."
 major_decisions.4000.a: "Trời cao phù hộ gia tộc ta!"
 major_decisions.4000.b: "Đây là lá cờ #italic của chúng ta#!."
 major_decisions.4000.c: "Ta đứng chắn mặt trời để che bóng cho dân mình."
 major_decisions.4001.t: "Sự Khai Sinh của một Đế Chế Việt"
 major_decisions.4001.desc: "Tin tức từ phương xa cho biết một sắc lệnh đế quốc đã được ban ra, tuyên bố [founder.GetFullNameNoTooltip] là người cai trị. Sau nỗ lực gian nan để bảo vệ nền độc lập chủ quyền của mình, họ đã tích lũy đủ năng lực để dựng nên quê hương cho dân tộc mình.\n\nChúng ta sẽ xem sự ổn định này kéo dài được bao lâu trước khi những đối thủ nguy hiểm bắt đầu dòm ngó."
 major_decisions.4001.a: "Chào mừng đến bàn tròn."
 major_decisions.4001.b: "Lại thêm một kẻ nữa?"

 #Majapahit
 major_decisions.5000.t: "Nghi Thức Thăng Ngôi"
 major_decisions.5000.desc: "Cùng với sự hình thành đế chế của ta, [ritual_guide.GetTitledFirstName] đã hộ tống ta đến ngôi đền lúc bình minh để vạch ra con đường phía trước.\n\n\"Vũ trụ thần linh xoay quanh ngài, thưa [ROOT.Char.GetTitleAsNameNoTooltip] của ta. Ngài không còn là kẻ tìm kiếm nữa mà là người định hình. Ngài sẽ đạt được điều này bằng cách hấp thụ tro tàn của Merapi hay thanh tẩy linh hồn dưới thác Sri?\" [ritual_guide.GetSheHe] kết lời với giọng điềm tĩnh.\n\nTa phải lựa chọn con đường cho bản thân và thần dân."
 major_decisions.5000.a: "Ta phải hòa làm một với núi Merapi, tung lửa và tro!"
 major_decisions.5000.b: "Om, Sri Sedana, hãy gắn kết chúng ta với linh hồn của thế giới."
 major_decisions.5001.t: "Sự Ra Đời của Majapahit"
 major_decisions.5001.desc: "Các cố vấn của ta đã kể cho ta nghe về việc thành lập đế chế đảo [founder.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\nMặc dù họ tuyên bố rằng [founder.GetTitleAsNameNoTooltip] của nó được người dân [founder.GetHerHis] của ngài coi là vị cứu tinh của đức tin và văn hóa của họ, chúng ta vẫn chưa biết mong đợi điều gì về động cơ của họ trong tương lai.\n\nTa sẽ xem liệu họ có quyết định hành động thân thiện hay không đối với lãnh địa của ta."
 major_decisions.5001.a: "Hiện giờ chúng ta còn nhiều vấn đề riêng."
 major_decisions.5001.b: "Rốt cuộc cũng chỉ là một kẻ tranh quyền khác."

 #Ryukyu (Ruucuu)
  major_decisions.6000.t:0 "Gia Bảo Ryukyu"
  major_decisions.6000.desc:0 "\"Toàn thể đảo dân đều ca tụng ngài, thưa [founder.GetTitleAsNameNoTooltip]. Tin tức đã được truyền đến mọi tộc trưởng, những thần dân khiêm nhường của ngài về việc dựng nên lá cờ mới của chúng ta. Ngai vàng Ryukyu đang nóng lòng chờ ngài đăng tọa,\" [antiquarian.GetTitledFirstName] thốt lên sau một bài diễn thuyết dài.\n\nThật tốt khi là một [founder.GetTitleAsNameNoTooltip], nhưng thời gian của ta trên thế gian này hữu hạn, con cháu ta cũng vậy. Ta phải củng cố và bất tử hóa quyền lực của mình bằng một gia bảo có thể trường tồn qua vô số thế hệ."
  major_decisions.6000.a:0 "Chế tác một bảo vật truyền cảm hứng cho thần dân của ta."
  major_decisions.6000.b:0 "Mang đến cho ta một thánh vật tượng trưng cho đế uy của chúng ta."
  ryukyu_artifact_regalia_craft_tt:0 "Một #italic bảo khí#! [artifact|E] sẽ được trao #bold trong vòng một năm#!:\n[GetModifier( 'ryukyu_empire_shaku_modifier' ).GetNameWithTooltip]"
  ryukyu_artifact_crown_craft_tt:0 "Một #italic vương miện#! [artifact|E] sẽ được trao #bold trong vòng một năm#!:\n[GetModifier( 'ryukyu_empire_crown_modifier' ).GetNameWithTooltip]"
  ryukyu_empire_shaku_modifier:0 "Shaku của Tam Sơn"
  ryukyu_empire_crown_modifier:0 "Vương Miện Rồng"

  major_decisions.6001.t:0 "Shaku của Hoàng Đế"
  major_decisions.6001.desc:0 "Chiếc shaku được mong đợi bấy lâu, xứng danh một [ROOT.Char.GetTitleAsNameNoTooltip], đã được chế tác theo đúng yêu cầu của ta. Nó vượt xa mọi dự liệu và chắc chắn sẽ nhấn mạnh vai trò của ta như một cầu nối giữa thần dân và linh giới.\n\nThần dân của ta sẽ không còn lười nhác hay u sầu khi xây dựng đế quốc huy hoàng này. Phục vụ cho mục đích thiêng liêng như vậy ắt sẽ xóa bỏ mọi trở ngại."
  major_decisions.6001.a:0 "Chúng ta đồng lòng nâng Tam Sơn lên tận trời cao!"

  major_decisions.6002.t:0 "Vương Miện Rồng"
  major_decisions.6002.desc:0 "Theo như sắp đặt, [antiquarian.GetTitledFirstName] dâng lên chiếc vương miện mới của ta, tượng trưng cho ý chí khám phá điều chưa biết và sự kiên định trước hiểm họa của sự trì trệ.\n\nChẳng bao lâu nữa, cả thế giới sẽ biết đến và ca tụng người Ryukyu, và danh ta sẽ được ghi nhớ trong uy nghi và vinh quang. Hậu duệ của ta sẽ đội biểu tượng dũng khí này với niềm tự hào và thách thức kẻ thù."
  major_decisions.6002.a:0 "Uy thế của chúng ta sẽ vang vọng đến muôn đời."

  major_decisions.6003.t:0 "Sự Thức Tỉnh của Ryukyu"
  major_decisions.6003.desc:0 "Ta được hay tin rằng một vị hoàng đế đã trỗi dậy từ quần đảo Ryukyu, khẳng định quyền thống trị trên những đồng bằng phì nhiêu và núi non huyền thoại, thống nhất các bộ tộc dưới một lá cờ.\n\nViệc giữ vững một đế quốc chưa bao giờ là dễ dàng, nhất là khi tài nguyên hạn chế. Chúng ta sẽ quan sát xem điều gì sẽ xảy ra."
  major_decisions.6003.a:0 "Khởi đầu khiêm nhường mà đáng khen."
  major_decisions.6003.b:0 "Dẫu vậy, ta không mấy ấn tượng."

 #Siam
  major_decisions.7000.t:0 "Bình Minh Hạnh Phúc"
  major_decisions.7000.desc:0 "Khi ta bước vào đại sảnh, hương trầm lan tỏa, tiếng chiêng đồng vang vọng khắp không gian, báo hiệu sự hiện diện của ta. Các đại thần và thư lại hoàng gia chào đón ta từ những hàng ghế thấp.\n\nSau những lời xã giao, nhiều đại thần đưa ra lời khuyên về ưu tiên trị vì của ta: lựa chọn một lĩnh vực đầu tư sẽ định hình di sản người Tai.\n\nKhi họ vẫn chưa đi đến kết luận, ta bắt đầu định đoạt suy nghĩ cuối cùng của mình."
  major_decisions.7000.a:0 "Chúng ta nên hỗ trợ các xưởng gốm sangkhalok tại [kingdom_capital.GetNameNoTier]."
  major_decisions.7000.b:0 "Chiến binh của ta xứng đáng được trang bị tốt hơn nếu muốn vượt qua đối thủ."
  major_decisions.7000.c:0 "Việc đề cao giá trị Tai phải là nỗ lực không ngừng của ta."
  siam_kingdom_sangkhalok_workshops_county_modifier:0 "Hỗ Trợ Xưởng Sangkhalok"
  siam_kingdom_sangkhalok_workshops_province_modifier:0 "Thương Mại Sangkhalok Phồn Thịnh"
  siam_kingdom_military_modifier:0 "Tài Trợ Doanh Trại Quân Sự"
  siam_kingdom_culture_modifier:0 "Văn Hóa Rạng Rỡ"

  major_decisions.7001.t:0 "Sự Trỗi Dậy của Người Tai"
  major_decisions.7001.desc:0 "Sâu trong vùng hoang dã, nơi được một số người biết đến là Vùng Đất Vàng, [founder.GetNameNoTierNoTooltip] đã lên nắm quyền với tư cách là [founder.GetTitleAsNameNoTooltip] của [founder.GetPrimaryTitle.GetNameNoTierNoTooltip] và thách thức số phận của người dân [founder.GetHerHis] của ngài.\n\nNgười Thái đã dành nhiều năm tìm kiếm quê hương, lang thang đầy tự hào với tư cách là những người du mục trong khu vực và dần dần tiến về phía nam.\n\nLiệu tầm ảnh hưởng của họ có tồn tại trước sự trôi chảy của thời gian?"
  major_decisions.7001.a:0 "Lại thêm một kẻ bị cuốn vào cơn bão."
  major_decisions.7001.b:0 "Họ có phải mối đe dọa với chúng ta không? Rồi sẽ rõ."

 #Brunei Kingdom
  major_decisions.8000.t:0 "Miền Đất An Bình"
  major_decisions.8000.desc:0 "[imam.GetTitledFirstName], người sẽ dẫn buổi cầu nguyện thứ Sáu sắp tới, nhắc ta về truyền thống chuẩn bị khutbah nhân danh [founder.GetTitleAsNameNoTooltip]. Ngoài những lời kinh bắt buộc, [imam.GetSheHe] hỏi ta về phần sẽ đọc trước các tín đồ để tuyên bố chủ quyền và vai trò bảo hộ của ta."
  major_decisions.8000.a:0 "Hãy để họ biết công tích của [founder.GetTitleAsNameNoTooltip] của họ."
  major_decisions.8000.b:0 "Mọi vinh quang đều thuộc về Allah."
  brunei_kingdom_khutbah_prestige_option_modifier:0 "Người Bảo Hộ Ummah"
  brunei_kingdom_khutbah_piety_option_modifier:0 "Ánh Sáng Ummah"

 #Brunei Empire
  major_decisions.9000.t:0 "Ân Huệ Đăng Cơ của Hoàng Đế"
