l_english:

# Forming the Swiss Confederation, by Flavio Verna
 middle_europe_decisions.0001.t:0 "Liên Bang Thụy Sĩ"
 middle_europe_decisions.0001.desc:0 "Trong một thời gian dài, các thành phố quanh dãy Alps trung tâm đã bị các thế lực khác trong Đế chế đe dọa. Nay, dưới cùng một lá cờ, họ đã thiết lập những liên minh cùng có lợi và được ban vinh dự trực tiếp phụ thuộc hoàng đế. \n\nĐể vinh danh những đóng góp của triều đại ta cho các thành bang Thụy Sĩ, ta đã được chọn làm người đứng đầu liên minh này — biểu tượng đại diện cho toàn bộ các Canton của Liên Bang Thụy Sĩ mới. Từ nay chúng ta sẽ không còn bị đe dọa bởi ngoại nhân, mà sẽ vươn lên như một thế lực độc lập mạnh mẽ trong Đế chế."
 middle_europe_decisions.0001.a:0 "Chúng ta đứng cùng nhau!"
 middle_europe_decisions.0002.desc.emperor:0 "Sau nhiều năm xung đột và những thỏa thuận ngoại giao bất ổn, ta đã buộc phải trao cho các Canton Thụy Sĩ quyền trực tiếp phụ thuộc hoàng đế.\n\nTập hợp các thị trấn vùng Alps này đã liên kết thành một Liên bang lớn để bảo vệ mình trước sự xâm lấn của người Burgundy và các lãnh chúa Đức. Ta phải cẩn thận kiểm soát họ, kẻo thành tựu này gieo mầm bất mãn trong giới thị dân lân cận."
 middle_europe_decisions.0002.desc.vassals:0 "Một thực thể mới mang tên Liên Bang Thụy Sĩ đã xuất hiện trong Đế chế. Họ là tập hợp các thành phố có quyền trực tiếp phụ thuộc hoàng đế quanh vùng Alps trung tâm, và đã lập một liên minh phòng thủ để tự bảo vệ trước các tuyển hầu xung quanh.\n\nMột thế lực độc lập đáng gờm, họ đã thoát khỏi mọi tuyên bố chủ quyền trước đây đối với vùng đất của mình — từ người Burgundy cổ ở phía tây đến các lãnh chúa Đức ở phía bắc.\n\nTa nên chú ý tới mối đe dọa tiềm tàng mới này trong Đế chế."
 middle_europe_decisions.0002.a:0 "Thật kỳ lạ..."

# Forming the Archduchy of Austria, by Flavio Verna
 middle_europe_decisions.0003.t:0 "Đại Công Quốc Áo"
 middle_europe_decisions.0003.desc:1 "Nhờ những thành tựu lẫy lừng của ta trong việc củng cố vùng trung tâm Áo, cùng ảnh hưởng to lớn mà triều đại ta đạt được trong Đế chế La Mã Thần Thánh, [scoped_emperor.GetTitledFirstName] cuối cùng đã công nhận vị thế vượt trội của Áo so với vô số công tước nhỏ bé của nước Đức.\n\nKể từ ngày hôm nay, mọi người kế vị ta sẽ mang tước hiệu danh giá #EMP đại công tước#! — ngang hàng với bất kỳ vị vua nào — để tách biệt mình khỏi các vương công và công nương thấp hơn trong Đế chế."
 middle_europe_decisions.0003.a:0 "Austria erit in orbe ultima!"
 middle_europe_decisions.0004.desc.emperor_archduke:0 "Tận dụng quyền kiểm soát ngai vàng đế quốc [scoped_ruler.GetHerHis] của ngài, [scoped_ruler.GetTitledFirstName] đã hợp pháp cấp cho bản thân tước hiệu Đại công tước Áo, biến công quốc này trở nên ngang hàng với bất kỳ vương quốc nào."
 middle_europe_decisions.0004.desc.emperor:0 "Điều hoàn toàn hợp lý khi các vị cai trị vùng trung tâm Áo — quê hương của chính triều đại ta — được đặt cao hơn các vương công và công nương khác trong Đế chế. \n\nVì vậy gần đây ta đã chấp nhận lời thỉnh cầu của [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('scoped_ruler'))] và tuyên bố [scoped_ruler.GetFirstName] là [scoped_ruler.GetTitleTierName] của Áo."
 middle_europe_decisions.0004.desc.emperor_blackmailed:0 "Áo luôn coi mình là một bậc cao hơn phần còn lại của Đế chế, và hôm nay, [scoped_ruler.GetFirstName] đã xác nhận điều đó. Sử dụng mối quan hệ [scoped_ruler.GetHerHis] của ngài với ta, ta không còn lựa chọn nào khác ngoài việc xác nhận trạng thái [scoped_ruler.GetHerHis] của ngài là đại công tước, ngang hàng với bất kỳ vị vua nào."
 middle_europe_decisions.0004.desc.vassals:0 "Tận dụng ảnh hưởng của triều đại [scoped_ruler.GetDynastyName] đối với ngai vàng Đế chế, [scoped_ruler.GetFirstName] đã thuyết phục [scoped_emperor.GetTitledFirstName] ban cho [scoped_ruler.GetHerHim] những vinh dự đặc biệt.\n\nTừ hôm nay trở đi, Áo sẽ được coi là một Đại Công Quốc — đứng đầu trong các Thân vương quốc của Đế chế La Mã Thần Thánh."
 middle_europe_decisions.0004.a:0 "Hoàn toàn xứng đáng."
 middle_europe_decisions.0004.b:0 "Thật thuận tiện..."

# Reforming the Carolingian Empire, by Flavio Verna
 middle_europe_decisions.0005.t:0 "Giấc Mộng của Charlemagne"
 middle_europe_decisions.0005.desc:0 "Châu Âu lại được thống nhất một lần nữa. Tất cả hậu duệ của người Frank đã được quy tụ dưới một lá cờ duy nhất và cùng đứng lên chống lại kẻ ngoại đạo ở phía Tây và những kẻ dị giáo ở phía Đông.\n\nNhờ ân sủng của [scoped_ruler.GetFaith.HighGodName], gia tộc ta được ban đặc quyền đội vương miện của Đế chế Caroling tái lập này. Và không giống những người đi trước, chúng ta sẽ không để những tranh chấp triều đại xé nát vương quốc vĩ đại này."
 middle_europe_decisions.0005.a:0 "Ngợi ca [scoped_ruler.GetFaith.HighGodName]!"
 middle_europe_decisions.0006.desc:0 "[scoped_ruler.GetTitledFirstName] cùng đạo quân Frank của [scoped_ruler.GetHerHis] đã tiến sâu vào lãnh thổ Đế chế đến mức [scoped_ruler.GetSheHe] bắt đầu tuyên bố rằng [scoped_ruler.GetSheHe] mới là người thừa kế chân chính của Charlemagne và Đế chế La Mã Thần Thánh chỉ là bản sao nhạt nhòa của vinh quang Caroling.\n\nVới toàn bộ các tỉnh gốc và phần lớn Tây Âu nằm dưới quyền kiểm soát của [scoped_ruler.GetHerHis], thật khó để bất cứ ai phủ nhận tuyên bố đó."
 middle_europe_decisions.0006.a:0 "[scoped_ruler.GetSheHe] dám sao!"
 middle_europe_decisions.0006.b:0 "Không biết đế chế này sẽ tồn tại bao lâu?"

# Unifying the Burgundies, by Flavio Verna
 middle_europe_decisions.0007.t:0 "Một Burgundy"
 middle_europe_decisions.0007.desc:0 "Toàn bộ vùng đất Burgundy đã được thống nhất dưới một vương miện duy nhất. Không còn bị chia cắt giữa các vương quốc nhỏ bé luôn chiến tranh, vùng đất cổ xưa của chúng ta đã lấy lại phẩm giá của một Vương quốc.\n\nĐã một thời gian kể từ khi quyền lực của [former_liege.GetTitledFirstNamePossessive] đối với ta suy yếu đến mức ta không còn cảm thấy bất kỳ lòng trung thành nào với người mà ta xem là ngang hàng hơn là chủ nhân."
 middle_europe_decisions.0007.a:0 "Chúng ta không cần sự bảo hộ của ai!"
 middle_europe_decisions.0008.desc.liege:0 "Ta đã lo ngại từ lâu về nỗ lực của [scoped_ruler.GetTitledFirstNamePossessive] nhằm thống nhất vùng Burgundy dưới một lá cờ, và giờ nỗi sợ tồi tệ nhất của ta đã thành sự thật.\n\nTên vô ơn đó đã quyết định tuyên bố [scoped_ruler.GetHerselfHimself] là [scoped_ruler.GetTitleTierName] của Burgundy và phá bỏ lời thề chư hầu của [scoped_ruler.GetHerHis]!"
 middle_europe_decisions.0008.desc.others:0 "Sau nhiều năm thống nhất các vùng đất Burgundy, [scoped_ruler.GetFirstName] đã quyết định tự đội vương miện [scoped_ruler.GetHerselfHimself] là [scoped_ruler.GetTitleTierName] của Burgundy và tuyên bố độc lập khỏi [former_liege.GetTitledFirstName].\n\nHành động phản nghịch trắng trợn này chắc chắn sẽ không sớm bị lãng quên..."
 middle_europe_decisions.0008.a:0 "[scoped_ruler.GetSheHe|U] chẳng qua chỉ là kẻ phản bội!"
 middle_europe_decisions.0008.b:0 "Ít ra các nhà địa lý sẽ hài lòng."

# Empowering Sicilian Parliament, by Flavio Verna
 middle_europe_decisions.0010.t:0 "Hội Nghị Ba Đẳng Cấp"
 middle_europe_decisions.0010.desc:0 "Cơ sở hạ tầng do người Hy Lạp để lại tại các tỉnh Sicily và Apulia sẽ trở thành nền tảng thúc đẩy sự chuyển đổi của [scoped_ruler.GetPrimaryTitle.GetName] sang một hình thức quản trị khai sáng hơn. \n\nBằng cách tập hợp đại diện của ba Đẳng cấp vào một cơ quan cố vấn chung được hướng dẫn bởi những đạo luật mới dựa trên truyền thống La Mã cổ, ta sẽ đảm bảo sự ổn định và thịnh vượng tại Địa Trung Hải cho nhiều thế hệ sau. Giờ ta chỉ cần quyết định nơi đặt Nghị viện này."
 middle_europe_decisions.0010.tt_napoli_warning: "@warning_icon! #warning Xây dựng nghị viện tại [GetTitleByKey('c_napoli').GetNameNoTier] sẽ khiến bạn không thể xây dựng đại học!#!"
 middle_europe_decisions.0010.a:0 "Tại Palermo, trụ sở cổ xưa của nó!"
 middle_europe_decisions.0010.b:0 "Nó sẽ đặt tại Naples."
 middle_europe_decisions.0010.c:0 "Ta nên cân nhắc nghiêm túc quyết định này."
 middle_europe_decisions.0011.desc:0 "[scoped_ruler.GetTitledFirstName] đã bổ nhiệm đại diện từ Giới Quý tộc, Giáo sĩ và Thị dân để thành lập một Nghị viện mới tại Vương quốc Sicily.\n\nCơ quan cố vấn này sẽ giúp [scoped_ruler.GetTitleTierName] và những người kế vị của [scoped_ruler.GetHerHis] cai trị một cách khôn ngoan và hiệu quả, vì lợi ích của toàn thể thần dân."
 middle_europe_decisions.0011.a:0 "Ta hiểu..."

# Gothic Innovations, by Flavio Verna
 middle_europe_decisions.0012.t:0 "Opus Francigenum"
 middle_europe_decisions.0012.desc:0 "Một thời đại thịnh vượng mới đang mở ra trước mắt chúng ta. [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] đã bước ra khỏi thời kỳ tăm tối để trở thành ngọn hải đăng rực rỡ của nghệ thuật và triết học.\n\nCác thành phố của chúng ta đang phát triển thành những trung tâm thương mại sầm uất, dựng nên những nhà thờ lớn kỳ vĩ sánh ngang các công trình cổ đại của Đế chế La Mã, thu hút họa sĩ, thi sĩ và triết gia khắp nơi. Dưới sự bảo trợ khai sáng của triều đại ta, người [scoped_ruler.GetCulture.GetName] sẽ trở thành niềm ghen tị của toàn châu Âu."
 middle_europe_decisions.0012.a:0 "Hãy để công trình vĩ đại của chúng ta tiếp tục!"
 middle_europe_decisions.0013.t:0 "Thời Kỳ Gothic"
 middle_europe_decisions.0013.desc.french:0 "[scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] đang trải qua một thời kỳ thịnh vượng và phát triển rực rỡ, vì lợi ích của toàn thể dân chúng. \n\nCác thành phố của chúng ta đang phát triển thành những trung tâm thương mại sầm uất, dựng nên những nhà thờ lớn kỳ vĩ sánh ngang các công trình cổ đại của Đế chế La Mã, thu hút họa sĩ, thi sĩ và triết gia khắp nơi. Dưới sự bảo trợ khai sáng của [scoped_ruler.GetTitledFirstName] và triều đại [scoped_ruler.GetDynasty.GetBaseName], chúng ta sẽ trở thành niềm ghen tị của toàn châu Âu."
 middle_europe_decisions.0013.desc.italian:0 "Có vẻ như [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] đang trải qua một thời kỳ thịnh vượng và phát triển mạnh mẽ. \n\nThi sĩ, triết gia, kiến trúc sư... Nhiều người tri thức đang tụ họp tại triều đình của [scoped_ruler.GetTitledFirstNamePossessive], nhưng tất cả những gì họ đạt được cho đến nay chỉ là một cuộc diễu hành bất tận của những công trình thô kệch và man rợ."
 middle_europe_decisions.0013.desc.fallback:0 "[scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] đang trải qua một thời kỳ thịnh vượng và phát triển rực rỡ, vì lợi ích của toàn thể người [ROOT.Char.GetCulture.GetNameNoTooltip]. \n\nNhững thành phố mới đang mọc lên thành các trung tâm thương mại sầm uất, dựng nên những nhà thờ lớn kỳ vĩ sánh ngang các công trình cổ đại của Đế chế La Mã, thu hút họa sĩ, thi sĩ và triết gia khắp nơi. Dưới sự bảo trợ khai sáng của [scoped_ruler.GetTitledFirstName] và triều đại [scoped_ruler.GetDynasty.GetBaseName], vùng đất này sẽ trở thành niềm ghen tị của toàn châu Âu."
 middle_europe_decisions.0013.a:0 "Thật là thời đại tuyệt vời để sống!"
 middle_europe_decisions.0013.b:0 "Bah! Điều này sẽ không kéo dài."
 middle_europe_decisions.0013.c:0 "Tốt cho họ, ta đoán vậy..."

# Restore Holy Roman Empire, by Ewan Cowhig Croft
 middle_europe_decisions.0015.t:0 "Đế Chế Phương Tây"
 middle_europe_decisions.0015.desc:0 "Đã quá lâu rồi tước hiệu Hoàng đế La Mã ở phương Tây không có người kế vị. Hôm nay, khi ta đối diện [founder_hof.GetTitledFirstName] trong [founder.GetFaith.HouseOfWorship] vĩ đại nhất tại [ceremony_locale.GetNameNoTooltip], xung quanh là các chư hầu và giáo sĩ của ta, điều đó đã thay đổi.\n\nChúng ta đọc những lời cầu nguyện và nghi thức quen thuộc, cầu xin [founder.GetFaith.HighGodName] ban cho ta sức mạnh và lòng nhân từ để cai trị đế chế theo ý chí của [founder.GetFaith.HighGodHerHis|U]. Trang nghiêm, [founder_hof.GetTitledFirstNameNoTooltip] trao cho ta vương miện và thanh kiếm, giao phó cho ta trách nhiệm chăm sóc toàn thể Cơ Đốc giáo.\n\nSự im lặng bao trùm, rồi bùng nổ thành những khúc thánh ca vang dội, chỉ bị lấn át bởi tiếng reo hò cuồng nhiệt của các quý tộc.\n\nCuối cùng. Ta là Hoàng đế La Mã Thần Thánh."
 middle_europe_decisions.0015.a:0 "Từ Augustus, đến Charlemagne, đến [founder.GetFirstNameNoTooltip]!"
 middle_europe_decisions.0016.desc:0 "Đế chế La Mã ở phương Tây đã ngủ yên trong một thời gian dài, khiến câu trả lời của [founder.GetFaith.GetAdjectiveNoTooltip] cho câu hỏi về phẩm giá đế quyền trở nên mơ hồ.\n\nNhưng điều đó chỉ kéo dài cho đến lúc này, khi [founder.GetTitledFirstName], với sự đồng thuận của [founder_hof.GetTitledFirstName], đã tái lập đế chế của Charlemagne trong một nghi lễ xa hoa được tổ chức tại [founder.GetFaith.HouseOfWorshipPlural] tráng lệ nhất ở [ceremony_locale.GetNameNoTooltip].\n\nKhắp thế giới, các [founder.GetFaith.GetAdjectiveNoTooltip] [founder.GetFaith.PriestNeuterPlural] vui mừng, tin tưởng rằng Rome cuối cùng đã có một người thừa kế chân chính và kính Chúa một lần nữa!"
 middle_europe_decisions.0016.a:0 "Bah, một đế chế tự phụ và khoe khoang."
 middle_europe_decisions.0016.b:0 "Bọn Đức man rợ, #emphasis ta#! mới là Hoàng đế La Mã!"
 middle_europe_decisions.0016.c:0 "Hy vọng đế chế này sẽ mang lại hòa bình."
 middle_europe_decisions.0016.d:0 "Một cảnh tượng huy hoàng!"
 # Electorate of Saxony by James Beaumont
 establish_the_electorate_of_saxony_decision:0 "Thiết Lập Tuyển Hầu Quốc Sachsen"
 establish_the_electorate_of_saxony_decision_desc:0 "Các vùng đất phía Đông đã quá lâu nằm ngoài tầm với của Đế chế. Chúng ta phải hợp nhất các tước vị này thành một Sachsen mới để củng cố quyền cai trị của mình tại khu vực."
 establish_the_electorate_of_saxony_decision_tooltip:0 "$establish_the_electorate_of_saxony_decision_desc$"
 establish_the_electorate_of_saxony_decision_confirm:0 "Rèn nên một Sachsen mới!"
 polabia_must_be_hre_culture_tt:0 "Ít nhất 12 [counties|E] trong [GetGeographicalRegion('custom_polabia').GetName] có văn hóa của bạn hoặc của [liege|E] của bạn."
 polabia_held_or_nonexistent.tt:0 "$k_sorbia$ không tồn tại hoặc do bạn nắm giữ."
 middle_europe_decision.0017.tt:0 "Là Hoàng đế, Sachsen sẽ được trao cho một [vassal|E] hoặc [courtier|E] khi được tạo ra."
 middle_europe_decisions.0017.t:0 "Tuyển Hầu Quốc Sachsen"
 middle_europe_decisions.0017.desc:0 "Polabia từ lâu đã thoát khỏi tay các kẻ thù của [hre_emperor_scope.GetPrimaryTitle.GetTierAsNameNoTooltip], và giờ đây dân chúng của nó đã coi $e_hre$ là quê hương thực sự của mình.\n\nVới việc thành lập Tuyển Hầu Quốc Sachsen, vùng Thượng Sachsen sẽ từ nay và mãi mãi nằm trong tay [hre_emperor_scope.GetTitleAsNameNoTooltip] và dưới sự dẫn dắt của [hre_emperor_scope.GetFaith.HighGodName]."
 middle_europe_decisions.0017.a:0 "Vinh quang cho Sachsen!"
 middle_europe_decisions.0017.b:0 "[heir_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] xứng đáng với tước hiệu này."
 middle_europe_decisions.0017.c:0 "Quả thật [most_powerful_saxon.GetNameNoTooltip] là người xứng đáng."
 middle_europe_decisions.0017.d:0 "Đây là món quà của ta dành cho Giáo hội."
 middle_europe_decisions.0017.e:0 "Chúc mừng, [rando_courtier_scope.GetNameNoTooltip]!"
 middle_europe_decisions.0018.desc:0 "$middle_europe_decisions.0017.desc$\n\n[hre_emperor_scope.GetNameNoTooltip] đã quyết định trao tước hiệu mới này cho [new_saxon_king.GetName], nhằm ghi nhận công lao của [new_saxon_king.GetHerHis] đối với ngai vàng."
 middle_europe_decisions.0018.a.new_king:0 "Vinh quang thuộc về ta!"
 middle_europe_decisions.0018.a.slav:0 "Nguyền rủa chúng!"
 middle_europe_decisions.0018.a:0 "Tốt cho họ."
