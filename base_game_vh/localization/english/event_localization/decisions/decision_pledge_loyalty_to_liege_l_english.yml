l_english:
 # Decision Menu Localization
  pledge_loyalty_to_liege_decision: "Tuyên Thệ Trung Thành với [GetPlayer.GetLiege.GetTitleTierName|U]"
  pledge_loyalty_to_liege_decision_desc: "Ta phải chính thức và công khai cam kết lòng trung thành với [GetPlayer.GetLiege.GetTitleTierName|U] tại triều đình [ROOT.Char.GetLiege.GetHerHis] của ngài. Việc không làm như vậy sẽ bị coi là một sự xúc phạm và một thách thức đối với sự cai trị [ROOT.Char.GetLiege.GetHerHis] của ngài."
  pledge_loyalty_to_liege_decision_tooltip: "Chính thức #V Tuyên Thệ Trung Thành#! với [liege|E] của ngươi tại [court|E] của họ"
  pledge_loyalty_to_liege_decision_effects: "Ngươi đến triều đình của [THIS.Char.GetLiege.GetTitledFirstNamePossessive] để chính thức quỳ lạy trước ngài"
  pledge_loyalty_to_liege_decision_confirm: "$pledge_loyalty_to_liege_decision$"
  pledge_loyalty_to_liege_decision_second_tooltip: "$DESC$\n$pledge_loyalty_to_liege_grace_tt$"
  pledge_loyalty_to_liege_grace_tt: "#weak Ngươi chỉ có thể #V Tuyên Thệ Trung Thành#! với cùng một lãnh chúa một lần#!"
  pledge_loyalty_to_liege_gift_warning_effect: "#weak Quà tặng sẽ tăng phần thưởng cho việc #V Tuyên Thệ Trung Thành#!#!\n$pledge_loyalty_to_liege_grace_tt$"
  pledge_loyalty_to_liege_grace_valid_tt: "Chưa từng Tuyên Thệ Trung Thành với [THIS.Char.GetLiege.GetTitledFirstName]"
  pledge_loyalty_to_liege_DECISION_NEXT_STEP_BUTTON: "Chọn một món quà"
  pledge_loyalty_to_liege_available_adult_tt: "Là một người trưởng thành khả dụng"
  pledge_loyalty_to_liege_available_liege_tt: "[ROOT.Char.GetLiege.GetTitledFirstName] là một người trưởng thành khả dụng"
 # Submission
  pledge_loyalty_to_liege_decision_option_submission: "Thể Hiện Sự Thần Phục\n#low Không dâng gì#!"
  pledge_loyalty_to_liege_submission_desc: "[ROOT.Char.GetLiege.GetTitledFirstName] sẽ chỉ nhận được sự thể hiện thần phục của ngươi"
  pledge_loyalty_to_liege_submission_tooltip: "$pledge_loyalty_to_liege_decision_second_tooltip$"
 # Gold
  pledge_loyalty_to_liege_decision_option_gold: "...và Dâng Tặng Lễ Vật\n#low Dâng [gold|E]#!"
  pledge_loyalty_to_liege_gold_desc: "[ROOT.Char.GetLiege.GetTitledFirstName] sẽ nhận được một món quà [gold|E] từ ngươi"
  pledge_loyalty_to_liege_gold_tooltip: "$pledge_loyalty_to_liege_decision_second_tooltip$"
  pledge_loyalty_to_liege_decision_effects_gold: "[liege|E] của ngươi sẽ nhận món quà [gold|E] từ ngươi"
  pledge_loyalty_to_liege_gold_tt: "#X Ngươi không có đủ [gold|E]#!"
 # Hook
  pledge_loyalty_to_liege_decision_option_hook: "...và Hứa Ban Ân Huệ\n#low Trao một [hook|E]#!"
  pledge_loyalty_to_liege_hook_desc: "[ROOT.Char.GetLiege.GetTitledFirstName] sẽ nhận được một [hook|E] yếu đối với ngươi"
  pledge_loyalty_to_liege_hook_tooltip: "$pledge_loyalty_to_liege_decision_second_tooltip$"
  pledge_loyalty_to_liege_decision_effects_hook: "[liege|E] của ngươi sẽ nhận được một [hook|E] mạnh đối với ngươi"
  pledge_loyalty_to_liege_hook_tt: "#X [liege|E] của ngươi đã có một [hook|E] đối với ngươi#!"
 # Contract
  pledge_loyalty_to_liege_decision_option_contract: "...và Tăng Nghĩa Vụ\n#low Tăng nghĩa vụ [vassal_contract|E]#!"
  pledge_loyalty_to_liege_contract_desc: "[ROOT.Char.GetLiege.GetTitledFirstName] sẽ nhận thêm thuế hoặc binh lính từ [vassal_contract|E]"
  pledge_loyalty_to_liege_contract_tooltip: "$pledge_loyalty_to_liege_decision_second_tooltip$"
  pledge_loyalty_to_liege_decision_effects_contract_gold: "[liege|E] của ngươi sẽ nhận thêm [taxes|E] từ ngươi"
  pledge_loyalty_to_liege_decision_effects_contract_levies: "[liege|E] của ngươi sẽ nhận thêm [levies|E] từ ngươi"
  pledge_loyalty_to_liege_contract_modifiable_tt: "#X [vassal_contract|E] của ngươi đã được thay đổi quá gần đây#!"
  pledge_loyalty_to_liege_contract_increasable_tt: "#X [taxes|E] và [levies|E] của ngươi không thể tăng thêm#!"

  pledge_loyalty_to_liege_costs_refunded: "Chi phí $pledge_loyalty_to_liege_decision$ đã được hoàn lại"

  pledge_loyalty_to_liege_header: "Tuyên Thệ Trung Thành:"

 # Activity Start: Liege decides whether or not to hear petition
  pledge_loyalty_to_liege.0001.opening: "[pledge_loyalty_to_liege_vassal.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
  pledge_loyalty_to_liege.0001.desc: "Ta đã đến [pledge_loyalty_to_liege_scope.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] để bày tỏ sự tôn kính với ngài, vinh quang thay [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip], như một minh chứng cho lòng trung thành của ta. \n\n"
  pledge_loyalty_to_liege.0001.desc.submission: "Ta hy vọng lời thề thần phục của mình đã đủ chứng minh danh dự của ta."
  pledge_loyalty_to_liege.0001.desc.gold: "Ta mang đến những lễ vật giàu có xứng đáng với uy nghi của ngài, như một biểu tượng cho thiện chí và sự phụng sự của ta."
  pledge_loyalty_to_liege.0001.desc.hook: "Ngài có lời hứa của ta rằng ta sẽ làm bất cứ điều gì ngài mong muốn, thưa [pledge_loyalty_to_liege_scope.GetLadyLord]."
  pledge_loyalty_to_liege.0001.desc.contract: "Để ghi dấu quyền uy của ngài và lòng trung thành của ta, ta sẽ cam kết những nghĩa vụ lớn hơn với tư cách chư hầu của ngài."
  pledge_loyalty_to_liege.0001.a: "Ban lại những ân huệ theo thông lệ."
  pledge_loyalty_to_liege.0001.b: "Không ban cho [pledge_loyalty_to_liege_vassal.GetHerHim] bất cứ thứ gì."
  pledge_loyalty_to_liege.0001.c: "Đáp lại lễ vật của [pledge_loyalty_to_liege_vassal.GetHerHis] bằng những món quà còn hào phóng hơn."
  pledge_loyalty_to_liege.0001.c.insulted: "#EMP [pledge_loyalty_to_liege_vassal.GetShortUIName] sẽ xem đó là sự xúc phạm!#!"
  pledge_loyalty_to_liege.0001.c.honored: "#EMP [pledge_loyalty_to_liege_vassal.GetShortUIName] sẽ xem đó là một vinh dự#!"

 # Liege Event: Liege receives homage from vassal
  pledge_loyalty_to_liege.0101.t: "$pledge_loyalty_to_liege_header$ Quỳ Gối Thần Phục"
  pledge_loyalty_to_liege.0101.desc: "Ta kiên nhẫn chờ trên ngai vàng sự xuất hiện của [pledge_loyalty_to_liege_vassal.GetTitledFirstName], kẻ nhanh chóng được xướng danh và dẫn vào trước mặt ta. \n\n"
  pledge_loyalty_to_liege.0101.desc.submission: "[pledge_loyalty_to_liege_vassal.GetSheHe|U] quỳ xuống bày tỏ sự tôn kính, không cung cấp gì ngoài lời thề [pledge_loyalty_to_liege_vassal.GetHerHis] của ngài để trung thành phục vụ với tư cách là chư hầu của [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
  pledge_loyalty_to_liege.0101.desc.gold: "[pledge_loyalty_to_liege_vassal.GetSheHe|U] quỳ xuống bày tỏ sự tôn kính, khi những người tham dự mang đến những món quà bằng tiền và vật phẩm quý giá [pledge_loyalty_to_liege_vassal.GetHerHis] của ngài. Lời thề được thực hiện, và các thư lại ghi lại các cam kết [pledge_loyalty_to_liege_vassal.GetHerHis] của ngài để phục vụ [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetNameNoTooltip].\n\n"
  pledge_loyalty_to_liege.0101.desc.hook: "[pledge_loyalty_to_liege_vassal.GetSheHe|U] quỳ xuống bày tỏ sự tôn kính, và, trong số các lời thề khác [pledge_loyalty_to_liege_vassal.GetHerHis] của ngài để phục vụ [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetNameNoTooltip], đặt bản thân vào sự tùy ý của ta và nợ ta một ân huệ.\n\n"
  pledge_loyalty_to_liege.0101.desc.contract: "[pledge_loyalty_to_liege_vassal.GetSheHe|U] quỳ xuống bày tỏ sự tôn kính, và, trong số các lời thề khác [pledge_loyalty_to_liege_vassal.GetHerHis] của ngài để phục vụ [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetNameNoTooltip], đề nghị đóng góp nhiều hơn với tư cách là một lãnh chúa chư hầu của [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
  pledge_loyalty_to_liege.0101.desc.success: "Cuối cùng ta ra lệnh cho [pledge_loyalty_to_liege_vassal.GetTitleAsNameNoTooltip] đứng dậy, xác nhận sự hài lòng của ta, và các quyền [pledge_loyalty_to_liege_vassal.GetFirstNamePossessiveNoTooltip] đối với các vùng đất mà [pledge_loyalty_to_liege_vassal.GetSheHe] cai trị thay cho ta."
  pledge_loyalty_to_liege.0101.smooth.submission: ""Hãy phục vụ ta thật tốt, [pledge_loyalty_to_liege_vassal.GetTitledFirstNameNoTooltip].""
  pledge_loyalty_to_liege.0101.smooth.gold: ""Ta chấp nhận những lễ vật hào phóng của ngươi, [pledge_loyalty_to_liege_vassal.GetTitledFirstNameNoTooltip].""
  pledge_loyalty_to_liege.0101.smooth.hook: ""Ta rất vui khi biết rằng ta có thể gọi đến ngươi, [pledge_loyalty_to_liege_vassal.GetTitledFirstNameNoTooltip].""
  pledge_loyalty_to_liege.0101.smooth.contract: ""Những phục vụ của ngươi vô cùng quý giá, [pledge_loyalty_to_liege_vassal.GetTitledFirstNameNoTooltip].""
# Activity End: Vassal learns that liege refuses to hear petition

  pledge_loyalty_to_liege.0009.opening: "[pledge_loyalty_to_liege_scope.Custom2('AppropriateGreeting', ROOT.Char )]"
  pledge_loyalty_to_liege.0009.desc: "Ta không bị lừa bởi màn kịch [pledge_loyalty_to_liege_vassal.Custom2('InsultAdjective', SCOPE.sC('pledge_loyalty_to_liege_scope'))] của ngươi; lời tuyên thệ tôn kính từ ngươi chẳng có ý nghĩa gì đối với ta."
  pledge_loyalty_to_liege.0009.a: "Thật quá đáng!"

 # Vassal Event: Vassal hears how it went
  pledge_loyalty_to_liege.0201.t: "$pledge_loyalty_to_liege_header$ Quỳ Gối Tuyên Thệ"
  pledge_loyalty_to_liege.0201.desc: "Những người hầu dẫn ta vào đại sảnh của [pledge_loyalty_to_liege_scope.GetTitledFirstNamePossessiveRegnal] tại [pledge_loyalty_to_liege_scope.GetCapitalLocation.GetNameNoTooltip], nơi [pledge_loyalty_to_liege_scope.GetSheHe] đang ngồi trên ngai vàng của [pledge_loyalty_to_liege_scope.GetHerHis] chờ nghe lời tuyên thệ của ta.\n\n"
  pledge_loyalty_to_liege.0201.desc.success: "Ta quỳ xuống dưới chân [pledge_loyalty_to_liege_scope.GetLadyLord] của ta và tuyên đọc những lời thề thần phục, trong khi các thư lại của [pledge_loyalty_to_liege_scope.GetHerHis] ghi chép lại sự kiện này.\n\n"
  pledge_loyalty_to_liege.0201.desc.submission: "Như vậy nghi lễ đã hoàn tất; ta không có gì để dâng lên [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] ngoài lời hứa sẽ trung thành phục vụ với tư cách chư hầu của [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
  pledge_loyalty_to_liege.0201.desc.gold: "Sau đó các tùy tùng của ta tiến lên, dâng những lễ vật hậu hĩnh của ta lên [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] trước toàn thể triều đình."
  pledge_loyalty_to_liege.0201.desc.gold.received_as_expected: " Theo thông lệ, [pledge_loyalty_to_liege_scope.GetSheHe] đáp lại bằng một vài lễ vật tượng trưng, củng cố mối quan hệ của chúng ta cho thời gian sắp tới.\n\n"
  pledge_loyalty_to_liege.0201.desc.gold.received_more: "\n\nĐúng như ta dự đoán, [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] đáp lễ bằng những món quà tương xứng, nhưng chúng dường như không ngừng lại! Sau một thời gian dài, ta nhận ra mình được bao quanh bởi còn nhiều của cải hơn cả những gì ta đã dâng lên [pledge_loyalty_to_liege_scope.GetHerHim]. Các cận thần quanh ta cố giấu sự kinh ngạc trước sự phá vỡ nghi thức này, không rõ [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] đang ban thưởng cho ta, hối lộ ta, hay chỉ đơn thuần phô bày quyền lực và sự giàu có của [pledge_loyalty_to_liege_scope.GetHerHis].\n\n"
  pledge_loyalty_to_liege.0201.desc.gold.received_nothing: "\n\nTa quỳ gối dường như quá lâu trước khi nhận ra rằng [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] sẽ không ban cho ta bất kỳ lễ vật đáp lễ nào như thông lệ. Các cận thần quanh ta trông đầy lúng túng, không rõ liệu ngân khố hoàng cung đang cạn kiệt hay [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] đang cố tình lấy ta làm gương.\n\n"

  pledge_loyalty_to_liege.0201.desc.hook: "Sau đó đến lời hứa của ta, rằng [pledge_loyalty_to_liege_scope.GetSheHe] có thể gọi ta thực hiện bất kỳ ân huệ nào, như một người ủng hộ trung thành của [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] trong mọi sự nghiệp của [pledge_loyalty_to_liege_scope.GetHerHis].\n\n"
  pledge_loyalty_to_liege.0201.desc.contract: "Sau đó đến lễ vật của ta; ta khẳng định sẽ gia tăng cống hiến của mình cho [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetTierAsNameNoTooltip] như dấu hiệu của lòng trung thành và vì lợi ích của vương quyền.\n\n"
  pledge_loyalty_to_liege.0201.desc.brush_off: "Điều khiến ta bất ngờ là [pledge_loyalty_to_liege_scope.GetFirstNameNoTooltip] hành xử gần như thể chẳng có chuyện gì xảy ra, và tiếp nhận sự thần phục của ta một cách điềm nhiên.\n\n"
  pledge_loyalty_to_liege.0201.desc.outro: "[pledge_loyalty_to_liege_scope.GetFirstNameNoTooltip] ra hiệu cho ta đứng dậy, xác nhận sự hài lòng của [pledge_loyalty_to_liege_scope.GetHerHis], đồng thời công nhận quyền của ta đối với những vùng đất ta cai trị nhân danh [pledge_loyalty_to_liege_scope.GetHerHis]."
  pledge_loyalty_to_liege.0201.smooth.submission: "Vạn tuế [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip]."
  pledge_loyalty_to_liege.0201.smooth.gold: "Cái giá của lòng trung thành..."
  pledge_loyalty_to_liege.0201.smooth.hook: "Mong rằng đó chỉ là một ân huệ nhỏ..."
  pledge_loyalty_to_liege.0201.smooth.contract: "Gánh nặng của sự phụng sự..."
  pledge_loyalty_to_liege.0201.faux_pas: "Rốt cuộc vẫn là một vị quân chủ công bằng."
  pledge_loyalty_to_liege.0201.insult: "Ta lẽ ra không nên đến."

 # Invalidated event
  pledge_loyalty_to_liege.0601.t: "$pledge_loyalty_to_liege_header$ Bị Vô Hiệu"
  pledge_loyalty_to_liege.0601.desc.court: "Với việc ta đã đăng quang làm [ROOT.Char.GetTitleAsNameNoTooltip], việc chuẩn bị đến triều kiến và tuyên thệ thần phục giờ đây không còn cần thiết nữa..."
  pledge_loyalty_to_liege.0601.desc.imprisoned_me: "$pledge_loyalty_to_liege.0601_shared_intro$ [ROOT.Char.GetImprisonedBy.GetTitledFirstName] đã tống ta vào ngục."
  pledge_loyalty_to_liege.0601.desc.imprisoned: "$pledge_loyalty_to_liege.0601_shared_intro$ Ta đã bị bắt giữ bởi [ROOT.Char.GetImprisonedBy.GetTitledFirstName]."
  pledge_loyalty_to_liege.0601.desc.liege_dead_me: "$pledge_loyalty_to_liege.0601_shared_intro$ Cuối cùng ta đã giết [pledge_loyalty_to_liege_scope.GetTitledFirstName]... \n\n"
  pledge_loyalty_to_liege.0601.desc.liege_dead: "$pledge_loyalty_to_liege.0601_shared_intro$ [pledge_loyalty_to_liege_scope.GetTitledFirstName] [pledge_loyalty_to_liege_scope.GetDeathReasonHideKiller]... \n\n"
  pledge_loyalty_to_liege.0601.desc.liege_imprisoned_me: "$pledge_loyalty_to_liege.0601_shared_intro$ Cuối cùng ta đã bắt giữ [pledge_loyalty_to_liege_scope.GetTitledFirstName]!"
  pledge_loyalty_to_liege.0601.desc.liege_imprisoned: "$pledge_loyalty_to_liege.0601_shared_intro$ [pledge_loyalty_to_liege_scope.GetTitledFirstName] đã bị bắt bởi [pledge_loyalty_to_liege_scope.GetImprisonedBy.GetTitledFirstName]."
  pledge_loyalty_to_liege.0601.desc.new_liege: "Nếu ta còn phải tuyên thệ, thì lời thề đó phải dành cho lãnh chúa mới của ta, [ROOT.Char.GetLiege.GetTitledFirstNameRegnal]."
  pledge_loyalty_to_liege.0601_shared_intro: "Ngay khi ta vừa hoàn tất những chuẩn bị cuối cùng cho lời thề trung thành của mình,"
  pledge_loyalty_to_liege.0601.desc: "\n\nĐiều này rõ ràng đã thay đổi toàn bộ tình thế."
  pledge_loyalty_to_liege.0601.a_court: "Tiến lên, hướng tới những điều lớn lao hơn."
  pledge_loyalty_to_liege.0601.a_prison: "Chết tiệt."
  pledge_loyalty_to_liege.0601.a_liege: "Thật phiền toái..."
  pledge_loyalty_to_liege.0601.a: "Đã đến lúc phải suy tính lại..."

  pledge_loyalty_to_liege_overdue.1000.t: "Chư Hầu Bất Danh Dự"
  pledge_loyalty_to_liege_overdue.1000.desc.1: "Khi ta xem xét hồ sơ của những người đã đến để cam kết lòng trung thành với ta với tư cách là [ROOT.Char.GetTitleAsName] của họ, một cái tên vẫn còn thiếu vắng đáng kể: [SCOPE.sC('pledge_loyalty_to_liege_offender').GetTitledFirstName] thuộc triều đại [SCOPE.sC('pledge_loyalty_to_liege_offender').GetDynasty.GetName]. Hơn [SCOPE.sC('pledge_loyalty_to_liege_offender').MakeScope.Var('pledge_loyalty_to_liege_found_overdue_years').GetValue|0] năm đã trôi qua "
  pledge_loyalty_to_liege_overdue.1000.desc.new_liege: "kể từ khi ta đăng cơ, "
  pledge_loyalty_to_liege_overdue.1000.desc.new_title: "kể từ khi [SCOPE.sC('pledge_loyalty_to_liege_offender').GetSheHe] trở thành chư hầu của ta, "
  pledge_loyalty_to_liege_overdue.1000.desc.2: "vậy mà chẳng có lấy một lời hay cống phẩm nào được gửi từ lãnh địa của [SCOPE.sC('pledge_loyalty_to_liege_offender').GetHerHis].\n\nCác cận thần của ta trao nhau những ánh nhìn bất an. Những tiếng xì xào lan khắp đại sảnh — đây chỉ là một sự sơ suất, hay là một sự xúc phạm có chủ ý đối với quyền cai trị của ta? Sức nặng của sự thách thức không nói thành lời treo lơ lửng trong không khí."
  pledge_loyalty_to_liege_overdue.1000.a: "Phái sứ giả yêu cầu [SCOPE.sC('pledge_loyalty_to_liege_offender').GetHerHis] lập tức đến diện kiến."
  pledge_loyalty_to_liege_overdue.1000.a.tt: "[SCOPE.sC('pledge_loyalty_to_liege_offender').GetTitledFirstName] sẽ nhận được một bức thư nhắc nhở [SCOPE.sC('pledge_loyalty_to_liege_offender').GetHerHim] về nghĩa vụ của [SCOPE.sC('pledge_loyalty_to_liege_offender').GetHerHis]. Tùy theo phản hồi của [SCOPE.sC('pledge_loyalty_to_liege_offender').GetHerHis], ngươi có thể [usurp|E] các [titles|E] của [SCOPE.sC('pledge_loyalty_to_liege_offender').GetHerHis]."
  pledge_loyalty_to_liege_overdue.1000.b: "[SCOPE.sC('pledge_loyalty_to_liege_offender').GetSheHe|U] có lẽ chỉ đang bận rộn."
  pledge_loyalty_to_liege_overdue.1000.b.tt: "[SCOPE.sC('pledge_loyalty_to_liege_offender').GetTitledFirstName] sẽ được tha thứ khỏi nghĩa vụ của [SCOPE.sC('pledge_loyalty_to_liege_offender').GetHerHis]."
  pledge_loyalty_to_liege_overdue.1010.t: "Danh Dự Triệu Gọi"
  pledge_loyalty_to_liege_overdue.1010.desc.new_liege: "Với việc [ROOT.Char.GetLiege.GetTitledFirstName] đăng cơ lên ngai vàng cao quý của [ROOT.Char.GetLiege.GetPrimaryTitle.GetName], "
  pledge_loyalty_to_liege_overdue.1010.desc.new_title: "Với tư cách là [ROOT.Char.GetTitleTierName|U] của [ROOT.Char.GetPrimaryTitle.GetName] và là chư hầu của [ROOT.Char.GetLiege.GetPrimaryTitle.GetName], "
  pledge_loyalty_to_liege_overdue.1010.desc: "đã đến lúc ta phải lên đường đến triều kiến, tái khẳng định lòng trung thành và nghĩa vụ thần phục của mình.\n\nNếu không làm như vậy trong thời hạn thích hợp, điều đó có thể bị xem là hành động vô danh dự — hoặc tệ hơn, bị hiểu như một lời tuyên bố phản loạn."
  pledge_loyalty_to_liege_overdue.1010.a: "Lập tức lên đường, không được chậm trễ!"
  pledge_loyalty_to_liege_overdue.1010.a.tt: "Mở bảng [decision|v] #V Tuyên Thệ Trung Thành với [GetPlayer.GetLiege.GetTitleTierName|U]#!"
  pledge_loyalty_to_liege_overdue.1010.b: "[ROOT.Char.GetLiege.GetTitleAsName] sẽ phải chờ."
  pledge_loyalty_to_liege_overdue.1010.b.tt: "Nếu ngươi chậm trễ quá lâu, các [titles|E] của ngươi có thể bị [revoked|E]!"
  pledge_loyalty_to_liege_overdue.1020.t: "[spurned_liege.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
  pledge_loyalty_to_liege_overdue.1020.desc: "Việc ngươi không đến trình diện tại triều đình của ta đã không thoát khỏi sự chú ý của ta. Danh dự buộc ngươi phải nhanh chóng khắc phục sự sơ suất này.\n\nSự sao nhãng nghĩa vụ của ngươi có thể buộc ta phải hành động để giữ gìn hòa bình và trật tự trong vương quốc."
  pledge_loyalty_to_liege_overdue.1020.a: "Lập tức lên đường, không được chậm trễ!"
  pledge_loyalty_to_liege_overdue.1020.a.tt: "Mở bảng [decision|v] #V Tuyên Thệ Trung Thành với [GetPlayer.GetLiege.GetTitleTierName|U]#!\n$pledge_loyalty_to_liege_overdue.1020.b.tt$"
  pledge_loyalty_to_liege_overdue.1020.b: "Những lời đe dọa mong manh như cánh hoa anh đào trong gió."
  pledge_loyalty_to_liege_overdue.1020.b.tt: "Nếu ngươi chậm trễ quá lâu, các [titles|E] của ngươi có thể bị [revoked|E]!"
  pledge_loyalty_to_liege_overdue.1020.c: "Làm nhục con dấu rồi trả lại bức thư."
  pledge_loyalty_to_liege_overdue.1020.c.tt: "[SCOPE.sC('spurned_liege').GetName] có thể sẽ cố [revoke|E] các [titles|E] của ngươi!"
  pledge_loyalty_to_liege_overdue.1030.t: "Tha Thứ Và Bỏ Qua"
  pledge_loyalty_to_liege_overdue.1030.desc: "Dù ta đã lơ là với [ROOT.Char.GetLiege.GetTitledFirstName], dường như không có hậu quả thông thường nào xảy ra. Có thể nào [ROOT.Char.GetLiege.GetPrimaryTitle.GetName] đã bỏ qua phong tục của chúng ta?"
  pledge_loyalty_to_liege_overdue.1030.a: "Ít đi một nỗi lo."
  pledge_loyalty_to_liege_overdue.1030.b: "Rõ ràng [ROOT.Char.GetLiege.GetSheHe] sợ uy thế của gia tộc [ROOT.Char.GetDynasty.GetName]!"

  msg_pledged_loyalty_to_liege: "Chư Hầu Tuyên Thệ Trung Thành"
  msg_pledged_loyalty_to_liege_desc: "$EFFECT$"
  msg_pledged_loyalty_to_liege.liege.desc: "[pledge_loyalty_to_liege_vassal.GetShortUIName] đã cam kết lòng trung thành [pledge_loyalty_to_liege_vassal.GetHerHis] của ngài với ngài bằng cách chính thức phủ phục trước ngài"
  msg_pledged_loyalty_to_liege.subject.desc: "Ngươi đã thể hiện lòng trung thành của mình với [pledge_loyalty_to_liege_vassal.GetLiege.GetShortUIName] bằng cách chính thức quỳ lạy trước mặt [pledge_loyalty_to_liege_vassal.GetLiege.GetHerHim]"

  msg_refused_pledge_loyalty_to_liege: "Từ Chối Quỳ Lạy"
  msg_refused_pledge_loyalty_to_liege_desc: "$EFFECT$"
  msg_refused_pledge_loyalty_to_liege.liege.desc: "Ngài đã có quyền $revoke_title_interaction$ do [SCOPE.sC('pledge_loyalty_to_liege_offender').GetShortUINamePossessive] không #V Tuyên Thệ Trung Thành#! với ngài"
  msg_refused_pledge_loyalty_to_liege.subject.desc: "[ROOT.Char.GetLiege.GetShortUIName] đã có quyền $revoke_title_interaction$ do ngươi không #V Tuyên Thệ Trung Thành#! với [ROOT.Char.GetLiege.GetHerHim]"
