l_english:
 # Decision Menu Localization
  pay_homage_decision:0 "Dâng Thần Phục"
  pay_homage_decision_desc:0 "Ta có thể chính thức và công khai tuyên thệ trung thành với lãnh chúa của ta, củng cố lòng tin và tính chính danh cho vị thế của cả hai."
  pay_homage_decision_tooltip:0 "Chính thức tuyên thệ [pay_homage|E] với [liege|E] của ngài"
  pay_homage_decision_effects:0 "Ngươi đến triều đình của [THIS.Char.GetLiege.GetTitledFirstNamePossessive] để dâng Thần Phục"
  pay_homage_decision_confirm:0 "$pay_homage_decision$"
  pay_homage_decision_second_tooltip:0 "$DESC$\n$pay_homage_grace_tt$"
  pay_homage_grace_tt:0 "#weak Ngươi chỉ có thể dâng Thần Phục với cùng một lãnh chúa một lần#!"
  pay_homage_gift_warning_effect:0 "#weak Lễ vật sẽ tăng phần thưởng khi dâng Thần Phục#!\n$pay_homage_grace_tt$"
  pay_homage_grace_valid_tt:0 "Chưa từng dâng [pay_homage|E] cho [THIS.Char.GetLiege.GetTitledFirstName]"
  PAY_HOMAGE_DECISION_NEXT_STEP_BUTTON:0 "Chọn lễ vật Thần Phục"
  petition_available_adult_tt:0 "Là một người trưởng thành khả dụng"
  petition_available_liege_tt:0 "[THIS.Char.GetLiege.GetTitledFirstName] là một người trưởng thành khả dụng"
 # Submission
  pay_homage_decision_option_submission:0 "Thể Hiện Sự Thần Phục\n#low Không dâng gì#!"
  pay_homage_submission_desc:0 "[ROOT.Char.GetLiege.GetTitledFirstName] sẽ chỉ nhận được lời thề [pay_homage|E] của ngươi"
  pay_homage_submission_tooltip:0 "$pay_homage_decision_second_tooltip$"
 # Gold
  pay_homage_decision_option_gold:0 "...và Dâng Lễ Vật\n#low Dâng [gold|E]#!"
  pay_homage_gold_desc:0 "[ROOT.Char.GetLiege.GetTitledFirstName] sẽ nhận được một lễ vật [gold|E] từ ngươi"
  pay_homage_gold_tooltip:0 "$pay_homage_decision_second_tooltip$"
  pay_homage_decision_effects_gold:0 "[liege|E] của ngươi sẽ nhận được lễ vật [gold|E] của ngươi"
  pay_homage_gold_tt:0 "#X Ngươi không có đủ [gold|E]#!"
 # Hook
  pay_homage_decision_option_hook:0 "...và Hứa Ban Ân Huệ\n#low Trao một [hook|E]#!"
  pay_homage_hook_desc:0 "[ROOT.Char.GetLiege.GetTitledFirstName] sẽ nhận được một [hook|E] yếu đối với ngươi"
  pay_homage_hook_tooltip:0 "$pay_homage_decision_second_tooltip$"
  pay_homage_decision_effects_hook:0 "[liege|E] của ngươi sẽ nhận được một [hook|E] mạnh đối với ngươi"
  pay_homage_hook_tt:0 "#X [liege|E] của ngươi đã có một [hook|E] đối với ngươi#!"
 # Contract
  pay_homage_decision_option_contract:0 "...và Gia Tăng Nghĩa Vụ\n#low Tăng nghĩa vụ [vassal_contract|E]#!"
  pay_homage_contract_desc:0 "[ROOT.Char.GetLiege.GetTitledFirstName] sẽ nhận được nhiều thuế hoặc quân hơn từ ngươi theo [vassal_contract|E]"
  pay_homage_contract_tooltip:0 "$pay_homage_decision_second_tooltip$"
  pay_homage_decision_effects_contract_gold:0 "[liege|E] của ngươi sẽ nhận được nhiều [taxes|E] hơn từ ngươi"
  pay_homage_decision_effects_contract_levies:0 "[liege|E] của ngươi sẽ nhận được nhiều [levies|E] hơn từ ngươi"
  pay_homage_contract_modifiable_tt:0 "#X [vassal_contract|E] của ngươi đã bị thay đổi quá gần đây#!"
  pay_homage_contract_increasable_tt:0 "#X [taxes|E] và [levies|E] của ngươi không thể tăng thêm#!"
