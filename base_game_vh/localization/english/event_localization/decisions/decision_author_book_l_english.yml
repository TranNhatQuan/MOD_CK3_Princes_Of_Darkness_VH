  ci_poem_name: "[SCOPE.Custom('GetCiPoemName')]"
  ci_poem_description_full: "[SCOPE.Custom('GetCiPoemName')] là một [Glossary( 'Ci poem', 'CI_GLOSS' )], được dùng để ngâm hoặc hát theo nhịp điệu của khúc nhạc mang cùng tên. Bài thơ tập trung vào chủ đề [SCOPE.Custom('GetCiPoemTheme')].\n[SCOPE.Custom('GetCiPoemQuality')]"
  ci_poem_theme_love: "tình yêu và những cảm xúc của nó"
  ci_poem_theme_nature: "thiên nhiên và ảnh hưởng của nó"
  ci_poem_theme_longing: "nỗi nhớ mong"
  ci_poem_theme_separation: "ly biệt"
  ci_poem_theme_sadness_and_pain: "nỗi buồn và đau khổ"
  ci_poem_theme_philosophy: "triết học"
  ci_poem_theme_mythological_events: "những sự kiện thần thoại"
  ci_poem_theme_daily_chores: "những công việc thường ngày giản dị"
  ci_poem_theme_historical_events: "những sự kiện lịch sử anh hùng"
  ci_poem_description_weak: "Dù bài thơ được ghép lại khá khéo léo, một số người có thể cho rằng nó quá giản dị và thiếu sự mới mẻ."
  ci_poem_description_mid: "Bài thơ thể hiện khá nhiều kỹ nghệ và tiềm năng."
  ci_poem_description_great: "Bài thơ lay động lòng người bằng vẻ thanh nhã giản dị của nó."

  author_book.0001.t: "Đức Hạnh Thi Ca"
  author_book.0001.desc: "Ít thể loại nào thuần khiết và linh hoạt như [Glossary( 'Ci poetry', 'CI_GLOSS' )]. Những đoạn khác nhau có thể đảm nhận việc khắc họa những chủ đề hay cảm xúc khác nhau, cho phép các thi nhân yêu thích của ta bày tỏ cảm xúc sâu sắc một cách ngắn gọn và đẹp đẽ.\n\nGiờ đây khi đã đến lúc đặt lời của chính mình vào một khúc nhạc, ta phải cẩn thận chọn giai điệu sẽ sử dụng."
  CI_GLOSS: "#bold Thơ Từ (Ci)#! — Một hình thức thi ca trở nên ngày càng phổ biến trong thời Đường và Tống.\nNhững bài thơ này được dùng để hát và điều chỉnh chủ đề theo các đoạn thơ có độ dài khác nhau phù hợp với giai điệu tương ứng.\n\nDo các bài Từ thường mượn chữ từ những bài thơ cổ hơn nên ý nghĩa văn tự của chúng có thể khó hiểu nếu không có sự học tập đầy đủ."


  author_book.0001.a: "Ta sẽ dùng #italic [SCOPE.Custom('GetCiPoemName')]#!"
  author_book.0001.a.tt: "#italic [SCOPE.Custom('GetCiPoemName')]#! sẽ là tên bài thơ của ta"
  author_book.0001.b: "Ta sẽ hỏi ý kiến [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))] của ta là [trusted_influencer.GetShortUINameNoTooltip]"
  author_book.0001.b.tt: "[trusted_influencer.GetShortUIName] sẽ chọn giai điệu cho bài thơ"
  paid_me_respect: "Đã bày tỏ sự kính trọng với ta"

  author_book.0004.t: "Về Đức Hạnh Trong Thời Đại Ta"
  author_book.0004.desc: "Khi ta ngồi xuống bàn để suy ngẫm về công việc phía trước, ánh mắt ta dừng lại ở [Glossary( 'Four Treasures of the Study', 'FOUR_TREASURES')]. Đối với một học giả, đây chính là công cụ hành nghề của ta. Với chúng, ta có thể dùng lý trí và khai sáng cho người khác.\n\nNhưng ta nên nói điều gì?\n\nTa có thể thử soi sáng lại những sự kiện trong quá khứ, hoặc bắt đầu điều gì đó gần gũi hơn bằng cách phân tích những hành động đức hạnh thông qua một sự kiện gần đây."
  author_book.0004.a: "Một tác phẩm lịch sử"
  author_book.0004.a.tt: "Cuốn sách [artifact|E] tạo ra sẽ cho [influence_i][influence|E]"
  author_book.0004.b: "Một bài luận triết học"
  author_book.0004.b.tt: "Cuốn sách [artifact|E] tạo ra sẽ cho [GetTrait('confucian_education').GetName( GetNullCharacter )]"
