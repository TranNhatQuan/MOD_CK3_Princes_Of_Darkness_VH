  author_book.1000.t: "[newly_created_artifact.GetNameNoTooltip]"
  author_book.1000.poem_intro.desc: "Khi ta ngâm bài thơ mới sáng tác của mình cho [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))] [trusted_influencer.GetFirstName], ta không khỏi cảm thấy một niềm tự hào nhất định về điều mình đã đạt được. Chủ đề [SCOPE.Custom('GetCiPoemTheme')] là điều mà ta cảm thấy trước đây chưa từng được thể hiện theo cách này. Ta nhìn sang [trusted_influencer.GetFirstNameNoTooltip] với vẻ mong đợi, chờ đợi lời đánh giá của [trusted_influencer.GetHerHis] về tác phẩm của ta.\n\n"
  author_book.1000.poem_weak.desc: ""Mọi thứ đều có vẻ đẹp, nhưng không phải ai cũng nhìn thấy điều đó." [trusted_influencer.GetHerHis] nói — có lẽ là với sự tán thưởng?\n\nCó lẽ tác phẩm mới này của ta chưa rực rỡ như ta từng hy vọng."
  author_book.1000.poem_mid.desc: ""Một tác phẩm đầy cảm xúc" [trusted_influencer.GetSheHe] nhìn ta với ánh mắt tán thưởng sau khi im lặng một khoảng thời gian dài tưởng như vô tận."
  author_book.1000.poem_great.desc: ""Học điều mới trong khi suy ngẫm về điều cũ, ngươi có thể trở thành người thầy của kẻ khác" [trusted_influencer.GetSheHe|U] rõ ràng đang rất trân trọng tác phẩm mới của ta."

  author_book.1000.prose_intro.desc: "Văn nghị luận là điều lẽ ra phải đến một cách tự nhiên với bất kỳ học giả nào. Trong văn bản của ta về [SCOPE.Custom('GetProseTheme')], ta đã có cơ hội rèn luyện kỹ năng sử dụng ví dụ để củng cố một luận điểm trung tâm.\n\n"
  author_book.1000.prose_weak.desc: ""Lập luận của ngươi rất vững chắc nhưng ta vẫn thấy vài chỗ có thể cải thiện" đó là điều [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))] của ta, [trusted_influencer.GetFirstName], nói với ta. Rõ ràng muốn khích lệ, [trusted_influencer.GetSheHe] sau đó tiếp tục chỉ ra một số điểm trong văn bản mà [trusted_influencer.GetSheHe] e rằng độc giả có thể bỏ lỡ."
  author_book.1000.prose_mid.desc: ""Đây là một tác phẩm hay, ngươi đã nắm bắt được bản chất của vấn đề rất tốt" đó là điều [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))] của ta, [trusted_influencer.GetFirstName], nói khi là người đọc đầu tiên của tác phẩm."
  author_book.1000.prose_great.desc: ""Ngươi đã diễn đạt với sự rõ ràng mà rất ít người trong thời đại chúng ta có được!" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))] của ta, [trusted_influencer.GetFirstName], tuyên bố.\nRõ ràng lời văn của ta đã khơi dậy cảm xúc chân thành."

  author_book.1000.scholarship_intro.desc: "Đây không phải là một nỗ lực nhanh chóng nhưng cuối cùng ta cũng đã hoàn thành. Chuyên khảo mới của ta về [SCOPE.Custom('GetMonographTopic')] đã xong và khoảng thời gian ta dành để nghiền ngẫm các tài liệu liên quan đã khiến ta hiểu rõ chủ đề này hơn bao giờ hết.\n\n"
  author_book.1000.scholarship_weak.desc: ""Một cột mốc lớn trong sự nghiệp của ngươi!" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))] của ta, [trusted_influencer.GetFirstName], tuyên bố, và ta có thể thấy niềm tự hào trong ánh mắt [trusted_influencer.GetHerHis]. Tuy vậy ta vẫn tự hỏi liệu mình có thể làm tốt hơn nếu có thêm một cơ hội."
  author_book.1000.scholarship_mid.desc: ""Một cuốn sách hữu ích và giàu thông tin, ta sẽ giới thiệu nó cho người khác!" đó là điều [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))] của ta, [trusted_influencer.GetFirstName], nói khi [trusted_influencer.GetSheHe] đọc xong toàn bộ.\nTa nên cảm thấy hài lòng với tác phẩm của mình, nhưng thật khó để không nghĩ rằng tương lai ta có thể viết điều gì đó còn tốt hơn."
  author_book.1000.scholarship_great.desc: ""Một tác phẩm mang tính cột mốc, đưa tên ngươi vào hàng những tác giả vĩ đại nhất thời đại chúng ta!"\nNgười đọc đầu tiên của ta, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))] của ta [trusted_influencer.GetFirstName], nói sau khi hoàn thành tác phẩm. Đây là một thành tựu mà ta sẽ không quên trong thời gian dài."

  author_book.1000.a: "Ta đã học được rất nhiều từ trải nghiệm này."
  author_book.1000.b: "Một tác phẩm được hoàn thành tốt."
  author_book.1000.c: "Rõ ràng ta có năng lực này."
  author_book.1000.d: ""Đây sẽ là món quà ta dành cho ngươi!""
