 #History
  prose_theme_rewriting_history: "lịch sử Ngũ Đại, một cách nhìn mới về một chủ đề quen thuộc"
  prose_theme_bio: "sự thuật lại tiểu sử cuộc đời của các nhân vật lịch sử"
  prose_theme_emperor: "một vị hoàng đế và thời đại khó khăn mà ngài đã sống qua"

  prose_quality_weak: "Văn phong đi thẳng vào vấn đề nhưng không nổi bật hơn các tác giả đương thời theo bất kỳ cách rõ rệt nào."
  prose_quality_mid: "Tác phẩm này rõ ràng được biên soạn khéo léo bởi một người am hiểu thể loại, và được xem là một cuốn sách thú vị đối với bất kỳ học giả nào."
  prose_quality_great: "Văn phong giản dị thể hiện sự tinh thông ngôn ngữ bậc thầy. Các lập luận được trình bày một cách xuất sắc khiến bất kỳ tác giả đương thời nào cũng phải ấn tượng."

  author_book.0005.t: "Mô tả thế giới"
  author_book.0005.desc: "Với nỗ lực lớn lao, trí tuệ có thể thấu hiểu ý nghĩa ẩn sau bản chất của thế giới. Nhưng việc thực sự mô tả và sắp xếp những quan sát ấy thành văn bản để người khác có thể học hỏi còn vĩ đại hơn, đồng thời cũng mệt mỏi và tốn thời gian hơn nhiều.\n\nKhi ta ngồi xuống để vạch ra kế hoạch cho một chuyên khảo mới, ta phải quyết định nên tập trung vào lĩnh vực nào. Toán học và Địa lý đều là những chủ đề xứng đáng, và nhiều đồng môn của ta cũng quan tâm đến chúng."
  author_book.0005.a: "Địa lý"
  author_book.0005.a.tt: "Chất lượng của cuốn sách này sẽ phụ thuộc rất nhiều vào kinh nghiệm [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )] của ngươi"
  author_book.0005.b: "Toán học"
  author_book.0005.b.tt: "Chất lượng của bảo vật sách sẽ phụ thuộc rất nhiều vào [learning|E] của ngươi."
  author_book.0005.c: "Khảo cổ học"
  author_book.0005.c.tt: "Lựa chọn này có thể khiến ngươi nhận được một [artifact|E] ngoài cuốn sách được tạo ra."
