l_english:
# Forming Outremer, by Flavio Verna
 middle_east_decisions.0001.t:0 "Thiên Quốc Đế Chế"
 middle_east_decisions.0001.desc:0 "Kể từ khi Muhammad trỗi dậy, đạo Hồi đã trở thành một thế lực đáng gờm khắp phương Đông, đồng thời là mối đe dọa luôn rình rập những người thờ phụng Đấng Christ. Nhưng nhờ những nỗ lực của ta trong việc bảo vệ Thánh Địa, điều đó nay đã không còn nữa. \n\nTa đã quét sạch bọn dị giáo khỏi bờ biển Địa Trung Hải và truy đuổi chúng vượt qua những sa mạc cháy bỏng của Ả Rập. Ta đã dựng thánh giá thiêng liêng của Đức Chúa từ biển này sang biển khác, và rèn nên một Đế Chế Thiên Quốc chân chính trên mảnh trăng lưỡi liềm vỡ nát của kẻ tiên tri giả."
 middle_east_decisions.0001.a:0 "Cầu Chúa xót thương chúng, bởi ta thì không."
 middle_east_decisions.0002.desc.christians:0 "Kể từ khi Muhammad trỗi dậy, đạo Hồi đã trở thành một thế lực đáng gờm khắp phương Đông, đồng thời là mối đe dọa luôn rình rập những người thờ phụng Đấng Christ. Nhưng nhờ những nỗ lực của [scoped_ruler.GetTitledFirstName] trong việc bảo vệ Thánh Địa, điều đó nay đã không còn nữa. \n\nVới sự ban phước của [scoped_ruler.GetFaith.HighGodName], [scoped_ruler.GetFirstName] đã quét sạch bọn dị giáo khỏi bờ biển Địa Trung Hải và truy đuổi chúng vượt qua những sa mạc cháy bỏng của Ả Rập. [scoped_ruler.GetSheHe|U] đã dựng thánh giá của Đức Chúa từ biển này sang biển khác, và rèn nên một Đế Chế Thiên Quốc chân chính trên mảnh trăng lưỡi liềm vỡ nát của kẻ tiên tri giả."
 middle_east_decisions.0002.desc.muslims:0 "Đám quân Thập Tự man rợ của [scoped_ruler.GetTitledFirstName] đã giáng xuống tai họa không thể tưởng tượng nổi lên những tín đồ của [ROOT.Char.GetFaith.HighGodName]!\n\nNhững kẻ thờ ngẫu tượng ghê tởm này đã chiếm giữ mọi nơi thờ tự thiêng liêng của đức tin chúng ta. Ngay cả thánh địa Mecca giờ cũng rơi vào tay lũ lợn phạm thượng ấy. Nếu các tín đồ chân chính của Nhà Tiên Tri không sớm giành lại Ả Rập, đây có thể sẽ là khởi đầu cho sự suy vong của Hồi giáo."
 middle_east_decisions.0002.desc.others:0 "Kể từ khi Muhammad trỗi dậy, đạo Hồi đã trở thành một thế lực đáng gờm khắp phương Đông. Nhưng nhờ những nỗ lực của [scoped_ruler.GetTitledFirstName] trong việc chiếm giữ Thánh Địa, điều đó nay đã không còn như trước. \n\n[scoped_ruler.GetTitleTierName] theo đạo [scoped_ruler.GetFaith.GetAdjective] này đã đẩy những tín đồ của Allah khỏi bờ biển Địa Trung Hải và truy đuổi họ vượt qua những sa mạc cháy bỏng của Ả Rập. [scoped_ruler.GetSheHe|U] đã dựng thánh giá từ biển này sang biển khác, và rèn nên thứ mà [scoped_ruler.GetSheHe] gọi là một Đế Chế Thiên Quốc trên mảnh trăng lưỡi liềm vỡ nát của Nhà Tiên Tri."
 middle_east_decisions.0002.a:0 "Ngợi khen Đức Chúa!"
 middle_east_decisions.0002.b:0 "Ngàn lời nguyền rủa giáng lên dòng tộc [scoped_ruler.GetHerHis]!"
 middle_east_decisions.0002.c:0 "Ra vậy..."

# Restoring the Sunni Caliphate, by Flavio Verna
 middle_east_decisions.0003.t:0 "Một Khalip Mới"
 middle_east_decisions.0003.desc:0 "Kể từ khi bọn ngoại đạo chiếm đóng vùng đất thánh, những người theo đạo thực thụ của Tiên tri đã bị phân tán đến bốn phương trời, mà không có sự lãnh đạo hoặc ý chí để tiếp tục cuộc đấu tranh thiêng liêng.\n\nĐiều này kết thúc hôm nay. Bằng lòng thương xót [reformer.GetFaith.HighGodNamePossessive], ta đã đòi lại Mecca và Medina và ngăn chặn làn sóng ngoại đạo tràn vào Ả Rập. Với sự hậu thuẫn của một số học giả đáng kính về sách, ta đã được công nhận là Caliph mới của [reformer.GetFaith.GetName], và ta đã sẵn sàng dẫn dắt những người theo đạo của mình chống lại những kẻ thờ thần tượng độc ác vẫn đang làm ô nhiễm quê hương chúng ta!"
 middle_east_decisions.0003.a:0 "Allahu Akbar!"
 middle_east_decisions.0004.desc.ashari:0 "Kể từ khi bọn ngoại đạo chiếm đóng vùng đất thánh, những người theo đạo thực thụ của Tiên tri đã bị phân tán đến bốn phương trời, mà không có sự lãnh đạo hoặc ý chí để tiếp tục cuộc đấu tranh thiêng liêng.\n\nĐiều này kết thúc hôm nay. Bằng lòng thương xót [reformer.GetFaith.HighGodNamePossessive], [reformer.GetFirstName] đã đòi lại Mecca và Medina và ngăn chặn làn sóng ngoại đạo tràn vào Ả Rập. Với sự hậu thuẫn của một số học giả đáng kính về sách, [reformer.GetSheHe] đã được công nhận là Caliph mới của [reformer.GetFaith.GetName] và sẵn sàng dẫn dắt những người theo đạo [reformer.GetHerHis] của ngài chống lại những kẻ thờ thần tượng độc ác vẫn đang làm ô nhiễm quê hương chúng ta."
 middle_east_decisions.0004.desc.other:0 "Kể từ khi bọn ngoại đạo chiếm đóng vùng đất thánh, những người theo đạo [reformer.GetFaith.GetName] đã bị phân tán đến bốn phương trời, mà không có sự lãnh đạo hoặc ý chí để tiếp tục cuộc đấu tranh thiêng liêng.\n\nTuy nhiên, có vẻ như cuối cùng họ đã cùng nhau một lần nữa, dưới sự lãnh đạo khôn ngoan của [reformer.GetFirstName]. Sau khi đòi lại các thành phố thánh Mecca và Medina và hợp pháp hóa tuyên bố [reformer.GetHerHis] của ngài là Caliph mới, [reformer.GetFirstName] đã sẵn sàng để tiếp tục cuộc chiến lớn chống lại bọn ngoại đạo."
 middle_east_decisions.0004.a:0 "Allahu Akbar!"
 middle_east_decisions.0004.b:0 "Có lẽ quen mặt vẫn hơn..."

# Creating Israel, by Flavio Verna
 middle_east_decisions.0005.t:0 "Miền Đất Hứa"
 middle_east_decisions.0005.desc:0 "Với Jerusalem và Miền Đất Hứa đã nằm dưới quyền kiểm soát của người Do Thái, thời khắc đã chín muồi để lập nên một Vương Quốc Thống Nhất mới mang tên Israel — giống như vương quốc vĩ đại thời cổ dưới David và Solomon.\n\nDân tộc Do Thái chịu đựng khổ đau bấy lâu cuối cùng cũng có thể nắm giữ vận mệnh của mình. Thánh Địa sẽ không còn bị xé nát bởi các lãnh chúa Kitô giáo và Hồi giáo giao tranh nữa. Mong rằng vương quốc mới này sẽ mở ra một thời đại hòa bình và thịnh vượng cho vùng đất này!"
 middle_east_decisions.0005.a:0 "Israel muôn năm!"
 middle_east_decisions.0006.desc.others:0 "Sau khi đưa Jerusalem trở lại dưới quyền kiểm soát của người Do Thái, [scoped_ruler.GetTitledFirstName] đã tuyên bố [scoped_ruler.GetHerselfHimself] là [scoped_ruler.GetTitleTierName] của một Israel được phục hưng.\n\nCuộc lưu đày dài lâu của dân tộc Do Thái có lẽ cuối cùng cũng chấm dứt khi nhiều cộng đồng của họ quyết định trở về Miền Đất Hứa."
 middle_east_decisions.0006.a:0 "Thời khắc đã đến!"
 middle_east_decisions.0006.b:0 "Ra vậy..."

# Restore Jewish High Priesthood, by Flavio Verna
 middle_east_decisions.0007.t:0 "Tân Giáo Sĩ Đoàn [scoped_ruler.GetFaith.GetAdjective]"
 middle_east_decisions.0007.desc.intro:0 "Đã không còn Kohen — Đại Tư Tế của Do Thái giáo — kể từ khi người La Mã phá hủy Đền Thờ Thứ Hai cách đây khoảng một nghìn năm. Cuối cùng thì chức vị này cũng đã được lấp đầy, và chức Đại Tư Tế được tái lập.\n\n"
 middle_east_decisions.0007.desc.me:0 "Với tư cách là một lãnh đạo có ảnh hưởng và mộ đạo của dân Do Thái, tầng lớp giáo sĩ dĩ nhiên đã quyết định rằng ta là ứng cử viên thích hợp nhất để dẫn dắt tôn giáo Do Thái bước vào một kỷ nguyên mới. Dù ta không mang dòng máu Aaron truyền thống cần có để trở thành Kohen Gadol, cả giáo sĩ lẫn tín đồ đều hoan nghênh việc ta được phong làm người đứng đầu Đại Tư Tế đoàn."
 middle_east_decisions.0007.desc.not_me:0 "Giống như các giáo sĩ Do Thái thời cổ, Kohen Gadol theo truyền thống phải là hậu duệ của Aaron, người anh trai của Moses. Do thiếu ứng viên thích hợp, điều kiện này đã được miễn trừ, nhưng vị Đại Tư Tế mới vẫn nhận được sự tôn kính của các cộng đồng tôn giáo [ROOT.Char.GetFaith.GetAdjective]."
 middle_east_decisions.0007.a:0 "Mong rằng sự lãnh đạo của [new_priest.GetHerHis] sẽ soi đường cho chúng ta!"
 middle_east_decisions.0007.a.me:0 "Sự lãnh đạo của ta sẽ soi đường cho tất cả!"
 middle_east_decisions.0008.desc.others:0 "Sau khi sự hiện diện đáng kể của người Do Thái tại Jerusalem được tái lập, [scoped_ruler.GetTitledFirstName] đã thúc đẩy việc thành lập một Đại Tư Tế đoàn [new_priest.GetFaith.GetAdjective] mới để dẫn dắt dân Israel.\n\nDưới sự lãnh đạo của [new_priest.GetTitledFirstName], giáo đoàn này được kỳ vọng sẽ mang lại sự đoàn kết và chỉ dẫn cho các cộng đồng Israel đang ngày càng phát triển."
 middle_east_decisions.0008.a:0 "Mong rằng sự lãnh đạo của [new_priest.GetHerHis] sẽ soi đường cho chúng ta!"
 middle_east_decisions.0008.b:0 "Ra vậy..."

# Restore Zoroastrian High Priesthood, by Flavio Verna
 middle_east_decisions.0009.t:0 "Tân Giáo Sĩ Đoàn [scoped_ruler.GetFaith.GetAdjective]"
 middle_east_decisions.0009.desc:0 "Sau thời kỳ lưu đày và đàn áp sau các cuộc chinh phục của người Ả Rập, Hỏa giáo cuối cùng đã được người dân Ba Tư chấp nhận trở lại như con đường chân chính dẫn đến chính đạo. [scoped_ruler.GetTitledFirstName] đã ra lệnh thiết lập chức vị [new_priest.GetTitleTierName], một Giáo Sĩ Tối Cao đứng đầu hệ thống giáo sĩ được phục hưng.\n\n[new_priest.GetTitleTierName] sẽ giữ vai trò quyền lực tôn giáo cao nhất trong thế giới [scoped_ruler.GetFaith.GetAdjective], với quyền hạn từ ban phước cho các cuộc viễn chinh quân sự tương lai cho đến chấp thuận việc ly hôn của các cặp vợ chồng."
 middle_east_decisions.0009.a:0 "Ngọn lửa vĩnh hằng lại bùng cháy!"
 middle_east_decisions.0010.desc.muslims:0 "Những kẻ đáng nguyền rủa thờ phụng [scoped_ruler.GetFaith.HighGodName] đã giành lại đủ đất đai và ảnh hưởng để tái lập một giáo đoàn phạm thượng dưới sự bảo hộ của [scoped_ruler.GetTitledFirstName].\n\nNếu không sớm bị ngăn chặn, lũ dị giáo thờ quỷ này có thể xoay chuyển cục diện sự bành trướng của Hồi giáo tại Ba Tư, đầu độc tâm trí những thần dân ngây thơ của chúng bằng lời dối trá và tà thuyết."
 middle_east_decisions.0010.desc.others:0 "Những kẻ kỳ lạ thờ lửa của [scoped_ruler.GetFaith.HighGodName] đã giành lại đủ lãnh thổ tổ tiên Ba Tư của họ để tái lập một Giáo Sĩ đoàn hoạt động trở lại.\n\nNếu không sớm bị ngăn chặn, họ có thể đảo ngược làn sóng bành trướng của Hồi giáo và khôi phục châu Á dưới sự bảo hộ của những vị thần cổ xưa của họ."
 middle_east_decisions.0010.a:0 "Vinh danh [scoped_ruler.GetFaith.HighGodName]!"
 middle_east_decisions.0010.b:0 "Lũ ác quỷ của chúng sẽ không che chở chúng khỏi sức mạnh của [ROOT.Char.GetFaith.HighGodName]!"
 middle_east_decisions.0010.c:0 "...Thờ lửa sao?"

# The Saoyshant appears, by Flavio Verna
 middle_east_decisions.0011.t:0 "Đấng Được Zoroaster Tuyển Chọn"
 middle_east_decisions.0011.desc:0 "Kể từ khi Đế chế Sassanid sụp đổ trước các cuộc xâm lược của người Ả Rập, Ba Tư đã phải chịu ách cai trị của các lãnh chúa Mohammedan. Những tàn dư cuối cùng của trật tự Hỏa giáo cổ xưa đã rút về phía bắc đến vùng thảo nguyên Trung Á, nhưng nay cuối cùng quyền cai trị của Hỏa giáo tại Ba Tư đã được khôi phục.\n\nSự phục hưng kỳ diệu này chỉ có thể được quy cho tài lãnh đạo xuất chúng của ta, và nhiều giáo sĩ đã tuyên bố ta chính là Saoshyant — vị cứu thế của thế giới mà Zoroaster đã tiên tri từ hàng nghìn năm trước. Sau khi chấp nhận vai trò này, ta giờ đây được tôn kính như một biểu tượng linh thiêng bởi các tín đồ Hỏa giáo khắp nơi."
 middle_east_decisions.0011.a:0 "Ta sẽ mang lại lợi ích cho muôn dân."
 all_held_counties:0 "Tất Cả Lãnh Địa Dị Giáo"
 middle_east_decisions.0013.desc:0 "Kể từ khi Đế chế Sassanid sụp đổ trước các cuộc xâm lược của người Ả Rập, Ba Tư đã phải chịu ách cai trị của các lãnh chúa Mohammedan. Những tàn dư cuối cùng của trật tự Hỏa giáo cổ xưa đã rút về phía bắc đến vùng thảo nguyên Trung Á, nhưng nay cuối cùng quyền cai trị của Hỏa giáo tại Ba Tư đã được khôi phục.\n\nSự phục hưng kỳ diệu này chỉ có thể được quy cho tài lãnh đạo xuất chúng của [scoped_ruler.GetFirstNamePossessive], và nhiều giáo sĩ đã tuyên bố [scoped_ruler.GetHerHim] chính là Saoshyant — vị cứu thế của thế giới mà Zoroaster đã tiên tri từ hàng nghìn năm trước. Sau khi chấp nhận vai trò này, [scoped_ruler.GetTitledFirstNameNoTooltip] giờ đây được tôn kính như một biểu tượng linh thiêng bởi các tín đồ Hỏa giáo khắp nơi."
 middle_east_decisions.0013.desc.muslims:0 "Từng bị đẩy thành những kẻ lưu vong nơi sa mạc, các tư tế thờ lửa của tên báng bổ Zoroaster đáng nguyền rủa đã trỗi dậy từ tro tàn và chiếm lấy ngai vàng Ba Tư!\n\nNgập tràn niềm kiêu ngạo điên cuồng, [scoped_ruler.GetTitleTierName] của chúng giờ đây còn tuyên bố [scoped_ruler.GetHerselfHimself] là một vị thần sống."
 middle_east_decisions.0013.desc.others:0 "Kể từ khi Đế chế Sassanid sụp đổ trước các cuộc xâm lược của người Ả Rập, những tín đồ của Zoroaster đã phải sống lưu vong. Nhưng thời kỳ lưu đày của họ gần đây đã chấm dứt khi các tín đồ [scoped_ruler.GetFaith.GetAdjective] đã thành công khôi phục đế chế cổ xưa của họ.\n\nVì có công lớn trong bước ngoặt bất ngờ này, [scoped_ruler.GetTitleTierName] của họ đã quyết định tuyên bố [scoped_ruler.GetHerselfHimself] là Saoshyant, vị cứu thế được tiên tri của tín ngưỡng họ."
 middle_east_decisions.0013.a:0 "Mong rằng [scoped_ruler.GetSheHe] sẽ mang lại lợi ích cho tất cả chúng ta!"
 middle_east_decisions.0013.b:0 "Điên loạn và tà ác!"
 middle_east_decisions.0013.c:0 "Ra vậy..."

# Create Sultanate of Rum, by Flavio Verna
 middle_east_decisions.0014.t:0 "Một La Mã Mới"
 middle_east_decisions.0014.desc:0 "Sau khi chinh phục những vùng đất trù phú của Tiểu Á, ta đã tích lũy đủ quyền lực để thành lập một vương triều Sultan mới, một vương triều chắc chắn sẽ vượt qua cả sự vĩ đại của La Mã.\n\nVẫn còn nhiều việc phải làm, nhưng ta không nghi ngờ rằng các sử gia sẽ ghi nhớ khoảnh khắc này như một bước tiến lớn trong cuộc chinh phục châu Âu của các tín đồ [scoped_ruler.GetFaith.HighGodName]."
 middle_east_decisions.0014.a:0 "Hãy để phương Tây run sợ!"
 middle_east_decisions.0015.desc.liege:0 "Sau một loạt chiến thắng tại Anatolia, [scoped_ruler.GetTitledFirstName] đã quyết định tự xưng [scoped_ruler.GetHerselfHimself] là [scoped_ruler.GetTitleTierName] của Rum, tuyên bố rằng [scoped_ruler.GetSheHe] không còn trung thành với ta nữa và sẽ tiếp tục cuộc chiến chống dị giáo theo ý riêng của [scoped_ruler.GetHerHis]."
 middle_east_decisions.0015.desc.romans:0 "Tên lãnh chúa man rợ [scoped_ruler.GetTitledFirstName] đã mở đường [scoped_ruler.GetHerHis] của ngài qua Anatolia và thiết lập một Vương quốc Hồi giáo mới trong khu vực.\n\nNhư thể điều này là chưa đủ để xúc phạm, trong một màn thể hiện sự kiêu ngạo đáng khinh bỉ, [scoped_ruler.GetSheHe] đã quyết định tuyên bố tước hiệu [scoped_ruler.GetTitleTierName] của Rome cho bản thân [scoped_ruler.GetHerselfHimself]."
 middle_east_decisions.0015.desc.others:0 "Tỉnh giàu có Tiểu Á, từng là thành trì của Kitô giáo, giờ đã rơi vào tay [scoped_ruler.GetTitledFirstName], kẻ đã lập nên một vương triều Sultan mới tại vùng này."
 middle_east_decisions.0015.a:0 "Sao [scoped_ruler.GetSheHe] dám!"
 middle_east_decisions.0015.b:0 "Ra vậy..."

 # Revive the Armenian Empire, by Ewan Cowhig Croft
 middle_east_decisions.1001.t:0 "Đại Bàng Mới Trỗi Dậy"
 middle_east_decisions.1001.desc:0 "Đã nhiều thế kỷ kể từ lần cuối Armenia đạt tới mức bá quyền này tại Levant và Kavkaz; hai đế chế Đông và Tây đã hết lần này đến lần khác đánh chúng ta đến đẫm máu. Khi thì phương Tây nói tiếng Latin, khi thì tiếng Hy Lạp; khi thì phương Đông nói tiếng Ba Tư, khi thì tiếng Ả Rập, nhưng những đế chế ấy luôn giao chiến, và vùng đất cổ xưa của chúng ta luôn trở thành chiến trường.\n\nNhưng sau hôm nay thì không còn nữa. Ta đã tái lập những lãnh thổ xưa của Tigranes Đại Đế, và lá cờ đại bàng của Đại Armenia lại tung bay!"
 middle_east_decisions.1001.a:0 "Ta sẽ còn đạt tới những vinh quang lớn hơn!"
 middle_east_decisions.1001.b:0 "Lặp lại cũng không làm giảm đi thành tựu này."
 middle_east_decisions.1002.desc:0 "Một tình thế kỳ lạ đã âm ỉ hình thành tại dãy núi Kavkaz từ một thời gian nay. Trái với mọi dự đoán, [founder.GetFullNameNoTooltip] đã thành công dựng nên một lãnh địa rộng lớn, trải dài từ biển Caspi phía đông đến bờ Địa Trung Hải phía tây. Dù chưa hoàn hảo, điều này phần nào tái hiện lại đế chế đã mất từ lâu của Tigranes Đại Đế, và các sứ giả của [founder.GetFullNameNoTooltip] nhanh chóng rêu rao điều đó.\n\nLá cờ đại bàng của Đại Armenia lại tung bay, nhưng sẽ kéo dài được bao lâu?"
 middle_east_decisions.1002.a:0 "Phẩm giá đế quốc cần nhiều hơn chỉ đất đai."
 middle_east_decisions.1002.b:0 "Lần này, không ai xé nát chúng ta nữa."
 middle_east_decisions.1002.c:0 "Cũng chỉ là chú thích nhỏ như kẻ tiền nhiệm."

 # Found the Empire of Beth Nahrain, by Anna Johansson
 middle_east_major_decisions.1020.t: "Quê Hương Của Hai Dòng Sông"
 middle_east_major_decisions.1020.desc: "Liệu có thể thống nhất các vương quốc quanh hai con sông Tigris và Euphrates dưới một lá cờ duy nhất không? Một đế chế rộng lớn đến mức các bậc vương giả thời xưa cũng phải ghen tị!"
 middle_east_major_decisions.1020.tt: "Truyền bá và thống nhất [culture|E] $assyrian$"
 middle_east_major_decisions.1020.lack_nestorian: "Nếu ngươi đã theo [GetFaithByKey('nestorian').GetAdherentName] [faith|E], nhận thêm tùy chọn [GetTrait('crusader_king').GetName( GetNullCharacter )]"
 middle_east_major_decisions.1020.promote_culture.tt: "Khả năng thực hiện [councillor_task|E] $task_promote_culture|V$ của [GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName] của ta trở nên hiệu quả hơn tại các [counties|E] nơi tồn tại [GetModifier('promote_culture_beth_nahrain_modifier').GetNameWithTooltip]"
 promote_culture_beth_nahrain_modifier_custom_desc: "Mọi lãnh địa trong Beth Nahrain không có [culture|E] $assyrian$"
 promote_culture_beth_nahrain_modifier: "Dòng Chảy Lên Xuống"
 promote_culture_beth_nahrain_modifier_desc: "Ảnh hưởng $assyrian$ nay đã trở thành một phần quen thuộc của đời sống nơi đây, và cư dân trong vùng dễ dàng chấp nhận phong tục cùng giá trị $assyrian$ hơn."
 middle_east_major_decisions.1020.learning.desc: "Nếu ngươi tập trung [empire|E] của mình vào [learning|E]"
 learning_beth_nahrain_house_modifier: "Tri Thức Là Sức Mạnh"
 learning_beth_nahrain_house_modifier_desc: "Cuộc chinh phục Trung Đông đã làm hồi sinh văn hóa Syriac, cho phép họ mở rộng tri thức của mình."
 middle_east_major_decisions.1020.martial.desc: "Nếu ngươi tập trung [empire|E] của mình vào [martial|E]"
 martial_beth_nahrain_house_modifier: "Kỷ Luật Và Trật Tự"
 martial_beth_nahrain_house_modifier_desc: "Cuộc chinh phục Trung Đông đã làm hồi sinh văn hóa Syriac, tàn phá chiến trường để mở rộng biên giới của họ."
 middle_east_major_decisions.1020.nestorian.desc: "Nếu ngươi tập trung [empire|E] của mình vào [GetFaithByKey('nestorian').GetAdherentName] [faith|E]"
 middle_east_major_decisions.1020.no_faith.desc: "Nếu ngươi chọn cải đạo sang [GetFaithByKey('nestorian').GetAdherentName] [faith|E]"
 completely_controls_jazira_mesopotamia_tt: "[completely_controls|E] [GetTitleByKey('k_jazira').GetNameNoTier] và [GetTitleByKey('k_mesopotamia').GetNameNoTier]"
 has_titles_jazira_mesopotamia_tt: "Sở hữu các [title|E] của [GetTitleByKey('k_jazira').GetNameNoTier] và [GetTitleByKey('k_mesopotamia').GetNameNoTier]"
 has_title_and_completely_control_jerusalem_tt: "[completely_control|E] và nắm giữ [GetTitleByKey('k_jerusalem').GetName]"
 has_title_and_completely_control_syria_tt: "[completely_control|E] và nắm giữ [GetTitleByKey('k_syria').GetName]"
 found_empire_of_beth_nahrain_decision_confirm: "Hãy để hai dòng sông hòa làm một!"
 middle_east_major_decisions.1020_fervor: "Sự Thành Lập Beth Nahrain"

 middle_east_decisions.1020.t: "Đế Chế Beth Nahrain"
 middle_east_decisions.1020.desc: "Cũng như dòng sông chảy mãi không ngừng, đế chế trước mắt ta đây cũng sẽ lớn mạnh như vậy.\n\nSự hợp nhất của những vùng đất này sẽ đứng vững trước thử thách của thời gian — ta chỉ cần đẩy chúng theo đúng hướng để giữ cho điều đó tiếp diễn.\n\nVì giờ đây ta phải chọn một con đường phía trước, để dẫn dắt thần dân của ta vượt qua làn sóng biến đổi vô tận sắp tới."
 middle_east_decisions.1020.a: "Ngòi bút mạnh hơn lưỡi gươm"
 middle_east_decisions.1020.b: "Chiến trường đang vẫy gọi"
 middle_east_decisions.1020.c: "Ta đặt niềm tin vào đức tin của mình"
 middle_east_decisions.1020.d: "Hãy cho chúng thấy đức tin #EMP chân chính#!!"
 beth_nahrain_crusader_desc: "Một sự hội tụ, kết nối cả đế chế thành một."
 
 # Dar al-Islam
 middle_east_decisions.1100.t: "Dar al-Islam"
 middle_east_decisions.1100.desc: "Kể từ thời Khalip Rashidun, Hồi giáo chưa từng đứng thống nhất dưới một lá cờ duy nhất như thế này. Được dẫn dắt bởi một mục đích, một tầm nhìn. Một [Glossary( 'Dar al-Islam', 'DAR_AL_ISLAM_GLOSS' )] chân chính.\n\nTừ khắp mọi nơi trên thế giới, các tín đồ [GetReligionByKey('islam_religion').GetAdherentNamePluralNoTooltip] giờ đây kéo về [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]. Người hành hương và vương tử, học giả và binh sĩ. Từ những sa mạc xa xôi và bến cảng đông đúc, từ mọi trường phái và giáo phái, họ tụ họp trước mặt ta — cúi đầu, dâng trọn lòng trung thành.\n\nChỉ thời gian mới có thể trả lời liệu sự thống nhất này sẽ kéo dài — hay rồi cũng phai mờ vào lịch sử. Nhưng hiện tại, muôn dân sẽ được biết đến nền hòa bình bao trùm của Hồi giáo."
 middle_east_decisions.1100.a: "Cả thế giới sẽ thuộc về Ngôi Nhà Hồi giáo!"
 DAR_AL_ISLAM_GLOSS: "#bold Dar al-Islam#!, dịch là "ngôi nhà của Hồi giáo", là thuật ngữ chỉ những vùng đất nằm dưới quyền cai trị của người Hồi giáo, quản lý cả thần dân Hồi giáo lẫn không theo Hồi giáo."
 
 middle_east_decisions.1101.intro: "Kể từ thời Khalip Rashidun, Hồi giáo chưa từng là một thế lực thống nhất. Thế nhưng dường như [dar_al_islam_ruler.GetShortUIName] đã làm được điều không tưởng và tạo nên một [Glossary( 'Dar al-Islam', 'DAR_AL_ISLAM_GLOSS' )] duy nhất."
 middle_east_decisions.1101.islam_desc: "Các tín đồ [GetReligionByKey('islam_religion').GetAdherentNamePluralNoTooltip] từ khắp thế giới đang tụ hội dưới lá cờ của [dar_al_islam_ruler.GetHerHis]. Mang theo sức mạnh, sự an toàn và thịnh vượng mà triều đại mới này hứa hẹn đem lại."
 middle_east_decisions.1101.other_desc: "Thời gian sẽ cho biết vị [dar_al_islam_ruler.GetTitleAsNameNoTooltip] mới này sẽ cai trị ra sao. Người ta không khỏi tự hỏi điều đó sẽ có ý nghĩa gì đối với phần còn lại của thế giới?"
 middle_east_decisions.1101.a: "Vinh danh [dar_al_islam_ruler.GetTitleAsNameNoTooltip]!"
 middle_east_decisions.1101.b: "Có lẽ ta cũng nên gia nhập cùng [dar_al_islam_ruler.GetHerHim]?"
 middle_east_decisions.1101.c: "Một diễn biến đáng lo ngại."
 
 middle_east_decisions.1102.desc: "Điều này có nghĩa là ta không còn là quyền lực tôn giáo của đức tin [ROOT.Char.GetFaith.GetName] nữa. Và ta, giống như mọi tín đồ [GetReligionByKey('islam_religion').GetAdherentName], sẽ phải phục tùng vị [dar_al_islam_ruler.GetTitleAsNameNoTooltip] mới."
 middle_east_decisions.1102.a: "Thời gian sẽ cho biết liệu [dar_al_islam_ruler.GetSheHe] có xứng đáng hay không."
