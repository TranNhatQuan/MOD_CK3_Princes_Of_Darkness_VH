l_english:
 #
  great_holy_war.0011.christian.t:0 "Các Vua Thập Tự Chinh"
  great_holy_war.0011.muslim.t:0 "Jihad Tái Lập"
  great_holy_war.0011.pagans.t:0 "Cơn Thịnh Nộ Của Các Thần Cổ"
  great_holy_war.0011.fallback.t:0 "[awakening_faith.GetAdherentNamePlural] Hăng Hái"
  great_holy_war.0011.catholic.rome.desc:0 "Rome, thành phố của Thánh Peter và là tòa thánh của chính Giáo hoàng, đã rơi vào tay những kẻ ngoại đạo. Để đáp lại, Giáo hoàng lưu vong, Đức Giáo hoàng [ghw_first_sponsor.GetTitledFirstName], đã tuyên bố ý định của [ghw_first_sponsor.GetHerHis] nhằm thành lập một liên minh các chúa tể Kitô giáo để giành lại thành phố vĩnh cửu."
  great_holy_war.0011.christian.europe.desc:0 "Ngay chính vùng trung tâm của Kitô giáo phương Tây đang bị bao vây bởi những kẻ ngoại đạo! Các chúa tể Kitô giáo tuyệt vọng đã thuyết phục Đức Giáo hoàng [ghw_first_sponsor.GetTitledFirstName] tuyên bố ý định của [ghw_first_sponsor.GetHerHis] về việc thành lập một liên minh chính nghĩa để trục xuất những kẻ dị giáo nhân danh [awakening_faith.WarGodName]."
  great_holy_war.0011.christian.byzantion.desc:0 "Đế quốc La Mã phương Đông, Byzantium — pháo đài vững chắc của Kitô giáo chống lại ngoại đạo Hồi phương Đông — đang suy yếu. Tình hình nguy cấp này đã thuyết phục [ghw_first_sponsor.GetHerHis|U] Thánh, [ghw_first_sponsor.GetTitledFirstName], chấp nhận khả năng xâm lược trực tiếp bởi lực lượng Kitô chung."
  great_holy_war.0011.catholic.jerusalem.desc:0 "Những người hành hương Kitô tới Đất Thánh đang chịu đủ mọi sự lạm dụng, và các lộ trình của họ đầy nguy hiểm.\n\nĐể bảo vệ các hành hương và giành Jerusalem cho Chúa và tín đồ, [ghw_first_sponsor.GetHerHis|U] Thánh, [ghw_first_sponsor.GetTitledFirstName], đã chấp nhận khả năng xâm lược trực tiếp bởi lực lượng Kitô chung."
  great_holy_war.0011.christian.fallback.desc:0 "Trong thời gian quá lâu, các tín đồ [awakening_faith.GetAdjective] đã bị dị giáo và ngoại đạo tàn bạo. Chúng ta không còn chịu đựng việc các thánh địa bị hủy hoại bởi kẻ báng bổ, niềm tin bị chế giễu bởi những tiên tri giả nữa. Đã đến lúc các tín đồ thực sự của [awakening_faith.WarGodName] đoàn kết và phản công kẻ vô tín!"
  great_holy_war.0011.muslim.mecca.desc:0 "Điều không thể tưởng tượng đã xảy ra! Thành phố thánh Mecca đã rơi vào tay ngoại đạo, và Kaaba đang bị ô uế bởi sự hiện diện của họ. [ghw_first_sponsor.GetHerHis|U] Đại Vương, [ghw_first_sponsor.GetTitledFirstName], tuyên bố một kỷ nguyên Jihad tái lập bắt đầu. Thành phố thánh phải được chiếm lại bằng mọi giá. Tất cả tín đồ Hồi giáo chính trực hãy chuẩn bị gia nhập hàng ngũ mujahideen cho những cuộc chiến sắp tới."
  great_holy_war.0011.muslim.jerusalem.desc:0 "Thành Thánh Jerusalem, nơi Nhà Tiên Tri được đưa lên thiên đàng, đã rơi vào tay ngoại đạo! [ghw_first_sponsor.GetHerHis|U] Đại Vương, [ghw_first_sponsor.GetTitledFirstName], sẽ không để điều này xảy ra và tuyên bố một kỷ nguyên Chinh Phục Vĩ Đại mới, như thời các Caliph đầu tiên. Dar al-Islam phải được bảo vệ! Tất cả tín đồ Hồi giáo chính trực hãy chuẩn bị gia nhập hàng ngũ mujahideen cho những cuộc chiến sắp tới."
  great_holy_war.0011.muslim.arabia.desc:0 "Ngôi Nhà Hồi giáo đang chịu đe dọa nghiêm trọng từ cuộc tấn công của [ghw_first_sponsor.Custom('GetDerogatoryNonbelieverPlural')] ngay tại trung tâm của nó. Để đáp trả, [ghw_first_sponsor.GetHerHis|U] Đại Vương, [ghw_first_sponsor.GetTitledFirstName], tuyên bố kỷ nguyên Jihad tái lập bắt đầu. Các vùng lõi của Dar al-Islam phải được chiếm lại bằng mọi giá. Tất cả tín đồ Hồi giáo chính trực hãy chuẩn bị gia nhập hàng ngũ mujahideen cho những cuộc chiến sắp tới."
  great_holy_war.0011.muslim.africa.desc:0 "Ngôi Nhà Hồi giáo đang chịu đe dọa nghiêm trọng từ cuộc tấn công của [ghw_first_sponsor.Custom('GetDerogatoryNonbelieverPlural')] tại châu Phi. Để đáp trả, [ghw_first_sponsor.GetHerHis|U] Đại Vương, [ghw_first_sponsor.GetTitledFirstName], tuyên bố kỷ nguyên Jihad tái lập bắt đầu. Các vùng tây của Ummah phải được chiếm lại bằng mọi giá. Tất cả tín đồ Hồi giáo chính trực hãy chuẩn bị gia nhập hàng ngũ mujahideen cho những cuộc chiến sắp tới."
  great_holy_war.0011.muslim.fallback.desc:0 "Ngôi Nhà Hồi giáo đang chịu đe dọa nghiêm trọng từ ngoại đạo và kẻ bỏ đạo. Tất cả tín đồ [awakening_faith.GetAdjective] chính trực hãy chuẩn bị gia nhập hàng ngũ mujahideen cho những cuộc chiến sắp tới. Điều này báo hiệu một kỷ nguyên mở rộng Hồi giáo mới."
  great_holy_war.0011.generic.fallback.head.desc:0 "Với các tín đồ [awakening_faith.GetReligion.GetAdjective] bị tấn công từ mọi phía bởi kẻ báng bổ, [ghw_first_sponsor.GetTitledFirstName] quyết định rằng đã đến lúc tất cả chiến binh của [awakening_faith.WarGodName] cầm vũ khí và bảo vệ thánh địa bằng một chiến dịch chinh phục tôn giáo vĩ đại."
  great_holy_war.0011.generic.fallback.desc:0 "Chúng ta không thể đứng nhìn kẻ báng bổ tấn công từ mọi phía, phá hoại thánh địa và tàn bạo anh em. Đã đến lúc chiến binh của [awakening_faith.WarGodName] cầm vũ khí, đoàn kết vì một mục tiêu chung."
  great_holy_war.0011.generic.ending.positive:0 "\n\nĐiều này báo hiệu sự khởi đầu của một kỷ nguyên mới của các cuộc Thánh Chiến [awakening_faith.GetReligion.GetAdjective] — [awakening_faith.GHWNamePlural]."
  great_holy_war.0011.generic.ending.negative:0 "\n\nĐiều này có thể là khởi đầu của sự hung hãn chưa từng có của [awakening_faith.GetReligion.GetAdjective]."
  great_holy_war.0011.generic.ending.coreligionist.head:0 "\n\nHệ quả thần học của tin này đang được thảo luận bởi [other_pope.GetTitleTierName] và các thành viên đáng chú ý khác của giáo hội, những người háo hức theo gương [awakening_faith.GetAdherentNamePluralNoTooltip] và bắt đầu kỷ nguyên chiến tranh tôn giáo mới nhân danh [ROOT.Char.GetFaith.GetNameNoTooltip]."
  great_holy_war.0011.generic.ending.coreligionist.autonomous:0 "\n\nHệ quả thần học của tin này đang được thảo luận bởi một số thành viên đáng chú ý của giáo hội, những người háo hức theo gương [awakening_faith.GetAdherentNamePluralNoTooltip] và bắt đầu kỷ nguyên chiến tranh tôn giáo mới nhân danh [ROOT.Char.GetFaith.GetNameNoTooltip]."
  great_holy_war.0011.directed.a:0 "Quân Ta sẽ tham gia chiến dịch ngay lập tức!"
  great_holy_war.0011.directed.b:0 "Ta sẽ bảo vệ đồng đạo [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] của mình!"
  great_holy_war.0011.a:1 "Deus Vult!"
  great_holy_war.0011.b:0 "Allahu Akbar!"
  great_holy_war.0011.c:1 "[ROOT.Char.GetFaith.WarGodName|U] ở cùng chúng ta!"
  great_holy_war.0011.d:1 "[ROOT.Char.GetFaith.WarGodName|U] hãy bảo vệ chúng ta!"
  great_holy_war.0011.e:0 "Nếu họ nói thế..."
  great_holy_war.0011.tooltip.effect:0 "Các [faiths|E] [awakening_faith.GetReligion.GetAdjective] giờ có quyền truy cập vào [awakening_faith.GHWNamePlural]"
  great_holy_war.0015.opening:0 "[scoped_pope.Custom2('AppropriateGreeting', ROOT.Char)]"
  great_holy_war.0016.custom:0 "Mọi chư hầu [scoped_pope.GetFaith.GetAdjective] [theocratic|E]"
  great_holy_war.0015.desc:0 "Bằng cách cam kết ủng hộ cuộc chiến chính nghĩa chống ngoại đạo, Ngài đã chuộc tội trước mắt [scoped_pope.GetFaith.WarGodName]. Vì vậy, Chúng Ta coi Ngài xứng đáng tham dự Thánh Thể một lần nữa."
  great_holy_war.0015.a:0 "Đã đến lúc rồi..."
  great_holy_war.0015.b:0 "Quả thật, [scoped_pope.GetFaith.WarGodName] thật nhân từ!"
  great_holy_war.0016.desc.a:1 "Chúng Ta vô cùng thất vọng về quyết định bỏ rơi sự nghiệp chính nghĩa của [scoped_pope.GetFaith.GHWName]. Chúng Ta sẽ không quên sự khinh bỉ của Ngài đối với [scoped_pope.GetFaith.WarGodName], và [scoped_pope.GetFaith.WarGodSheHe|U] cũng vậy."
  great_holy_war.0016.desc.b:0 "Chúng Ta vô cùng thất vọng và bối rối khi nghe quyết định bỏ rơi sự nghiệp chính nghĩa của [scoped_pope.GetFaith.GHWName]. Ngài đã làm ô danh chính mình trước mắt [scoped_pope.GetFaith.WarGodName] bằng sự báng bổ này."
  great_holy_war.0016.desc.c:0 "Chúng Ta sẽ không dung thứ hành vi báng bổ của Ngài. Bằng cách từ chối ủng hộ [scoped_pope.GetFaith.GHWName], Ngài buộc Chúng Ta phải loại Ngài ra. Từ nay Ngài bị cấm tham dự Thánh Thể."
  great_holy_war.0016.a:0 "Ta có việc khác quan trọng hơn."
  great_holy_war.0016.b:0 "Ta đã làm gì vậy?!"
  great_holy_war.0017.title:0 "Rời bỏ [scoped_pope.GetFaith.GHWName]"
  great_holy_war.0017.desc.a:0 "Bỏ cam kết với [scoped_pope.GetFaith.GHWName] chắc chắn sẽ giảm uy tín của Ta trước giới giáo sĩ, và có thể gây thịnh nộ của Tòa Thánh.\n\nTa nên cân nhắc kỹ hậu quả trước khi quyết định, vì có nguy cơ bị gán là dị giáo trước mắt Giáo hội."
  great_holy_war.0017.desc.b:0 "Bỏ cam kết với [scoped_pope.GetFaith.GHWName] chắc chắn sẽ giảm uy tín của Ta trước giới giáo sĩ, và có thể gây thịnh nộ của [scoped_pope.GetTitledFirstName]. Ta nên cân nhắc kỹ hậu quả trước khi quyết định, vì có nguy cơ bị gán là kẻ báng bổ."
  great_holy_war.0017.a:0 "Ta không quan tâm."
  great_holy_war.0017.b:0 "Có lẽ Ta quá vội..."
  great_holy_war.0018.desc:0 "Nếu Ta cam kết với [scoped_pope.GetFaith.GHWName], Ta sẽ phải tuyển quân và tiến đánh kẻ thù của đức tin khi thời cơ đến.\n\nVì việc thất hứa có thể khiến [scoped_pope.GetTitledFirstName] nổi giận, Ta nên cân nhắc kỹ quyết định trước khi đưa vương quốc vào chiến tranh."
  great_holy_war.0018.a:0 "Ta sẽ tham gia quân đội của [scoped_pope.GetFaith.WarGodName]!"
  great_holy_war.0018.b:0 "Ta cần suy nghĩ thêm..."
  great_holy_war.0003.title:0 "Các Tín Đồ Chuẩn Bị Chiến Tranh"
  great_holy_war.0003.catholic.desc:1 "Một sứ giả Giáo Hoàng đã tới triều của Ta, mang tin từ Vatican. [ghw_sponsor.GetTitledFirstName] đã phát động lời kêu gọi tất cả các lãnh chúa Kitô chính nghĩa. Là một [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] [ROOT.Char.GetTitleAsNameNoTooltip], Ta được kỳ vọng chuẩn bị binh lính hỗ trợ cho sự nghiệp thánh thiện này, do Giáo hội Toàn cầu bảo trợ.\n\nĐối với tất cả những ai chiến đấu chống [target_character.Custom('GetUnbelieverNamePlural')] đang báng bổ thánh địa [target_kingdom.GetBaseNameNoTier], Tòa Thánh đảm bảo xá tội và chỗ trong thiên đường."
  great_holy_war.0003.fallback.desc:0 "Tin vinh quang đã đến triều của Ta. [ghw_sponsor.GetTitledFirstName] quyết định rằng đã đến lúc tất cả [ghw_sponsor.GetFaith.GetAdherentNamePluralNoTooltip] chính nghĩa đoàn kết dưới một ngọn cờ và tiến đánh kẻ thù của đức tin trong [ghw_sponsor.GetFaith.GHWName] vì vinh quang của [ghw_sponsor.GetFaith.WarGodName].\n\nĐối với tất cả những ai tham gia cuộc thánh chiến này, [ghw_sponsor.GetTitleTierName] đảm bảo chỗ trong [ghw_sponsor.GetFaith.DivineRealm]."
  great_holy_war.0003.a:0 "Quân Ta sẽ sẵn sàng chiến đấu!"
  great_holy_war.0003.a.tt:0 "Cam kết tham gia [ghw_sponsor.GetFaith.GHWName] do [ghw_sponsor.GetTitledFirstName] phát động ngay khi bắt đầu"
  great_holy_war.0003.b:0 "Ta sẵn lòng tài trợ cho sự nghiệp thánh thiện này."
  great_holy_war.0003.c:0 "Có lẽ Ta nên cân nhắc tham gia..."
  great_holy_war.0003.a.lifted_excommunication:0 "Tội [excommunication|E] của Ta sẽ được gỡ bỏ"
  great_holy_war.0023.desc:0 "Chúng Ta được biết Ngài vẫn chưa cam kết ủng hộ [scoped_pope.GetFaith.GHWName] sắp tới. Ta có cần nhắc Ngài rằng đây là bổn phận thiêng liêng của Ngài với tư cách [scoped_pope.GetFaith.GetAdjectiveNoTooltip] [ROOT.GetCharacter.GetTitleTierName] phải đánh bại ngoại đạo và [target_character.Custom('GetUnbelieverNamePlural')] không?"
  great_holy_war.0023.desc.hooked:0 "Chúng Ta được biết Ngài vẫn chưa cam kết ủng hộ [scoped_pope.GetFaith.GHWName] sắp tới. Điều này không thể chấp nhận! Ta yêu cầu Ngài ngay lập tức tham gia chiến tranh chống ngoại đạo và [target_character.Custom('GetUnbelieverNamePlural')]."
  great_holy_war.0003.a.hooked:0 "Ta gần như không còn lựa chọn, đúng không?"
  great_holy_war.0023.c:0 "Ta đã làm phần của mình chống lại [target_character.Custom('GetUnbelieverNamePlural')]!"
  great_holy_war.0023.d:0 "Đây không phải chiến tranh của Ta."
  great_holy_war.0024.dead.recipient.title:0 "[ghw_claimant.GetFirstNameNoTooltip] Đã Chết"
  great_holy_war.0024.dead.recipient.replaced:0 "[ghw_claimant.GetTitledFirstName] giờ là Ứng Cử Viên Chính Thống mới của [the_faith.GHWName]."
  great_holy_war.0024.dead.recipient.open:2 "[former_recipient.GetTitledFirstName] đã qua đời, để lại [target_kingdom.GetBaseNameNoTier] cho chiến binh thánh thiện."
  great_holy_war.0028.dead.beneficiary_title:0 "Người Thụ Hưởng Đã Mất"
  great_holy_war.0028.dead.beneficiary:0 "Với sự ra đi của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))] [former_beneficiary.GetFirstName], Ta phải chọn người thụ hưởng mới cho [ROOT.Char.GetFaith.GHWName] đang diễn ra."
  great_holy_war.0029.invalid.beneficiary_title:0 "Người Thụ Hưởng Không Hợp Lệ"
  great_holy_war.0029.converted.beneficiary:0 "Việc cải đạo không may của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))] [former_beneficiary.GetFirstName] khiến [former_beneficiary.GetHerHim] không đủ tư cách nhận đất từ [ROOT.Char.GetFaith.GHWName]."
  great_holy_war.0030.incapable.beneficiary:0 "Thật không may, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))] [former_beneficiary.GetFirstName] không còn đủ khả năng làm người thụ hưởng của Ta. Hay bất cứ thứ gì khác, thực ra."
  great_holy_war.0030.excommunicated.beneficiary:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))] [former_beneficiary.GetFirstName] đã bị khai trừ, và vì vậy [former_beneficiary.GetSheHe] không còn đủ tư cách làm người thụ hưởng trong [ROOT.Char.GetFaith.GHWName] đang diễn ra."
  great_holy_war.0030.devoted.beneficiary:0 "Vì [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))] [former_beneficiary.GetFirstName] đã quyết định thụ nguyện, Ta phải chọn người khác làm thụ hưởng trong [ROOT.Char.GetFaith.GHWName] đang diễn ra."
  great_holy_war.0030.sick.beneficiary:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))] [former_beneficiary.GetFirstName] quá yếu và bệnh tật để làm người thụ hưởng, Ta phải chọn người khác."
  great_holy_war.0030.ruler.beneficiary:0 "Vì đã trở thành một nhà cai trị sở hữu những trách nhiệm của riêng [former_beneficiary.GetHerHis], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))] của ta, [former_beneficiary.GetFirstName], không còn phù hợp để làm người thụ hưởng của ta nữa."
  great_holy_war.0030.heir.beneficiary:0 "Vì đã trở thành người kế vị tiếp theo để thừa kế tước hiệu của riêng [former_beneficiary.GetHerHis], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))] của ta, [former_beneficiary.GetFirstName], không còn phù hợp để làm người thụ hưởng của ta nữa."
  great_holy_war.0040.desc:0 "Kho Vàng Chiến Tranh đại diện cho tổng số vàng quyên góp bởi những người ủng hộ [ROOT.Char.GetFaith.GHWName].\n\nMột phần vàng sẽ được chia cho các người tham gia khi giai đoạn chuẩn bị kết thúc, phần còn lại sẽ chia cho những người thắng tùy theo đóng góp."
  great_holy_war.0040.a:0 "Ta sẽ rút hết ngân khố cho sự nghiệp!"
  great_holy_war.0040.b:0 "Ta sẽ đóng góp hào phóng."
  great_holy_war.0040.c:0 "Ta có thể dành vài đồng cho việc này."
  great_holy_war.0040.d:0 "Ta sẽ cân nhắc nghiêm túc."

  great_holy_war.0050.title:1 "[the_faith.GHWName] cho [target_kingdom.GetBaseNameNoTierNoTooltip]"
  great_holy_war.0050.base.desc:0 "Các lãnh chúa [the_faith.GetAdjectiveNoTooltip], được khuấy động bởi lời kêu gọi vũ trang của [ghw_sponsor.GetTitledFirstName], đã bắt đầu tập hợp một lực lượng lớn các tín đồ cuồng nhiệt để tiến hành [the_faith.GHWName] chống lại mọi kẻ thù của [the_faith.ReligiousSymbol] tại [target_kingdom.GetBaseNameNoTierNoTooltip]. Ngày càng nhiều tín đồ bị thu hút, tạo thành một đạo quân hùng mạnh của [the_faith.ReligiousSymbol], sẵn sàng mang chiến tranh tới vùng đất của chúng ta."
  great_holy_war.0050.defender.desc:0 "\n\nTrách nhiệm của Ta là tổ chức các lãnh chúa [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] trong vùng và chuẩn bị đối phó với làn sóng [ghw_sponsor.Custom('GetUnbelieverNamePlural')] trước khi quá muộn."
  great_holy_war.0050.others.desc:1 "\n\nChúng ta chỉ có thể cầu nguyện [ROOT.Char.GetFaith.WarGodName] ban cho [target_character.GetTitledFirstName] lòng dũng cảm và sức mạnh để đứng vững trước làn sóng [ghw_sponsor.Custom('GetUnbelieverNamePlural')]."
  great_holy_war.0050.a:0 "[ROOT.Char.GetFaith.WarGodName] hãy bảo vệ chúng ta khỏi những [ghw_sponsor.Custom('GetUnbelieverNamePlural')] này!"
  great_holy_war.0051.catholic.attackers.desc:0 "Cuối cùng đã đến lúc mang cơn thịnh nộ thiêng liêng của [the_faith.WarGodNamePossessive] xuống những [ghw_defender.Custom('GetUnbelieverNamePlural')] xấu xa tại [target_kingdom.GetBaseNameNoTier].\n\nBị khơi dậy bởi cơn thịnh nộ chính nghĩa và ý chí kiên định, đạo quân Thập Tự Chinh hùng mạnh do [ghw_sponsor.GetTitledFirstName] tập hợp sẽ tiến hành công lý thần thánh đối với kẻ ác và giành vị trí của họ trong [the_faith.DivineRealm]."
  great_holy_war.0051.generic.attackers.desc:0 "Cuối cùng đã đến lúc tẩy rửa vùng đất [target_kingdom.GetBaseNameNoTier] bằng máu của [ghw_defender.Custom('GetUnbelieverNamePlural')] và giành lấy vùng đất này cho vinh quang của [the_faith.WarGodName].\n\nCác chiến binh thánh thiện tiến bước với niềm tin rằng, dù thắng hay hy sinh khi chống lại những kẻ ngoại đạo, lòng tận hiến của họ sẽ được ghi nhận trong [the_faith.PositiveAfterLife]."
  great_holy_war.0051.generic.defenders.desc:0 "Đám đông [ghw_sponsor.Custom('GetUnbelieverNamePlural')] do [ghw_sponsor.GetTitledFirstName] tập hợp đã bắt đầu tiến quân tới [target_kingdom.GetBaseNameNoTier]. \n\nNhững chiến binh man rợ này, rõ ràng được [ROOT.Char.GetFaith.DevilName] truyền cảm hứng, sẽ tàn phá đất đai và giết hại dân chúng nếu chúng ta không ngăn cản! Vì lợi ích của tất cả tín đồ [ghw_defender.GetFaith.GetAdjective] tại [target_kingdom.GetBaseNameNoTierNoTooltip], chúng ta phải chiến thắng!"
  great_holy_war.0051.generic.start.tt:0 "Một [the_faith.GHWName] được phát động cho [target_kingdom.GetBaseNameNoTierNoTooltip] ngay lập tức!"
  great_holy_war.0052.title.winners:0 "[the_faith.GHWName] chiến thắng"
  great_holy_war.0052.title.losers:0 "Cơn Thịnh Nộ của [the_faith.ReligiousSymbol|U]"
  great_holy_war.0052.generic.attackers.desc:0 "[the_faith.WarGodName] đã ban chiến thắng cho [title_recipient.GetShortUIName] trong [the_faith.GHWName] cho [target_kingdom.GetBaseNameNoTier]. Sau khi đánh bại [ghw_defender.GetTitledFirstName] và [ghw_defender.GetHerHis] [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] nhiều lần, các chiến binh của chúng ta buộc kẻ thù phải thừa nhận thất bại nhục nhã.\n\nVới vùng đất chiếm đóng nằm dưới sự lãnh đạo của một lãnh chúa [the_faith.GetAdjectiveNoTooltip] sùng đạo, chúng ta có thể yên tâm rằng ý muốn thần thánh của [the_faith.WarGodName] đã được thực hiện. Đây là một ngày vinh quang cho tất cả tín đồ trung thành của [the_faith.ReligiousSymbol|U]!"
  great_holy_war.0052.generic.defenders.desc:1 "[ghw_defender.GetFaith.WarGodName] chắc hẳn đã bỏ rơi [ghw_defender.GetTitledFirstName] khi để [ghw_defender.GetHerHis] quân đội bị đánh bại hoàn toàn bởi các chiến binh của [the_faith.ReligiousSymbol|U].\n\nSau thành công của [the_faith.GHWName], [ROOT.Char.Custom('GetUnbelieverNamePlural')] đã chiếm [target_kingdom.GetBaseNameNoTier] và tuyên bố các vùng xung quanh là đất [the_faith.GetAdjectiveNoTooltip] hợp pháp."
  great_holy_war.0052.generic.outsiders.desc:0 "[the_faith.GetAdjectiveNoTooltip] [the_faith.GHWName] chống lại [target_kingdom.GetBaseName] là một thành công vang dội. Các chiến binh thánh thiện, bị khuấy động bởi lời kêu gọi của [ghw_sponsor.GetTitledFirstNamePossessive], đã liên tục đánh bại kẻ thù và chiếm đóng vĩnh viễn vùng đất của họ.\n\nKhó mà biết họ sẽ cai trị bao lâu, và liệu tín đồ của [ghw_defender.GetFaith.WarGodName] có trả thù sau nhục nhã này không, nhưng ít nhất hiện giờ, dân [target_kingdom.GetBaseNameNoTierNoTooltip] phải học cách sống dưới bóng [the_faith.ReligiousSymbol|U]."
  great_holy_war.0052.a:0 "[the_faith.WarGodName] ở cùng chúng ta!"
  great_holy_war.0052.b:0 "[ROOT.Char.GetFaith.WarGodName], tại sao Ngài trừng phạt chúng ta?!"
  great_holy_war.0052.c:0 "Những lời cãi cọ của [ghw_sponsor.Custom('GetUnbelieverNamePlural')] không liên quan đến chúng ta."
  great_holy_war.0053.title:0 "[the_faith.ReligiousSymbol|U] tan vỡ"
  great_holy_war.0053.generic.attackers.desc:0 "Các chiến binh của [the_faith.WarGodName] chỉ tìm thấy cái chết và nhục nhã tại cổng [target_kingdom.GetBaseNameNoTier].\n\n[the_faith.GHWName] do [ghw_sponsor.GetTitledFirstName] phát động đã kết thúc trong thất bại thảm hại, chỉ làm tổn hại đến sự nghiệp của tín đồ. Điều này chắc chắn sẽ khích lệ nhiều kẻ báng bổ và ngoại đạo đi lệch khỏi [the_faith.GetName]."
  great_holy_war.0053.generic.defenders.desc:0 "Những binh lính đáng thương của [the_faith.WarGodName] không phải là đối thủ của các chiến binh của chúng ta. \n\nDưới sự lãnh đạo sáng suốt và ngoan đạo của [ghw_defender.GetTitledFirstName], the [ghw_defender.GetFaith.GetAdjective] đã đẩy lùi quân xâm lược và một lần nữa khẳng định lại chủ quyền của họ đối với [target_kingdom.GetBaseNameNoTier]. Có lẽ lần tới [ghw_sponsor.GetTitleTierName] của đức tin [the_faith.GetAdjective] sẽ không quá nóng lòng vứt bỏ mạng sống các môn đồ của [ghw_sponsor.GetHerHis] trong một nỗ lực vô ích nhằm thử thách sức mạnh của [ghw_defender.GetFaith.WarGodName]."
  great_holy_war.0053.generic.outsiders.desc:0 "Sau nhiều thất bại và nhục nhã, [the_faith.GHWName] do [ghw_sponsor.GetTitledFirstName] phát động để chinh phục [target_kingdom.GetBaseNameNoTier] đã kết thúc hoàn toàn thất bại.\n\nTín đồ [ghw_defender.GetFaith.GetAdjective] dưới cờ [ghw_defender.GetTitledFirstNamePossessive] đã đẩy lui tất cả xâm lược và buộc lãnh đạo của họ đầu hàng."
  great_holy_war.0053.a:0 "[the_faith.WarGodName] đã bỏ rơi chúng ta!"
  great_holy_war.0053.b:1 "[attacker.Custom('GetUnbelieverNamePlural')] đã nếm mùi thịnh nộ của [ghw_defender.GetFaith.WarGodName]!"
  great_holy_war.0056.title:0 "[the_faith.GHWName] thất bại"
  great_holy_war.0056.desc:0 "Có vẻ như lời kêu gọi tha thiết của [ghw_sponsor.GetTitledFirstNamePossessive] nhằm liên minh chống lại kẻ thù của [the_faith.ReligiousSymbol] kém thuyết phục hơn so với những gì [ghw_sponsor.GetSheHe] kỳ vọng. Quá ít tín đồ quyết định hưởng ứng lời kêu gọi vũ trang của [ghw_sponsor.GetHerHis], quá ít để tổ chức một quân đội chỉnh tề.\n\nKhông còn lựa chọn nào khác, [ghw_sponsor.GetTitleTierName] đã buộc phải hủy bỏ cuộc [the_faith.GHWName] và lên án tất cả các nhà cai trị [the_faith.GetAdjective] vì sự hèn nhát và độc ác của họ."
  great_holy_war.0056.a:0 "Chúng ta đã lạc đường quá xa khỏi sự dẫn dắt của [the_faith.WarGodNamePossessive]?"
  great_holy_war.0056.b:0 "Thật đáng thương."
  great_holy_war.0056.c:0 "Tại sao chuyện này lại liên quan đến Ta nữa?"
  great_holy_war.0057.title:0 "Chiến binh của [the_faith.ReligiousSymbol|U]"
  great_holy_war.0057.crusader.desc:0 "Quân đội của chúng ta đã sẵn sàng tham gia vào cuộc [the_faith.GHWName] giành [target_kingdom.GetBaseNameNoTier]. Nếu [the_faith.WarGodName] phù hộ, chúng ta sẽ sớm giành chiến thắng, máu của lũ [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] sẽ nhuộm đỏ mặt đất."
  great_holy_war.0057.mujahid.desc:0 "Cuộc đấu tranh vĩ đại của chúng ta cuối cùng đã đến. Quân đội chúng Ta sẵn sàng gặp kẻ ngoại đạo và, với sự ban phước của [the_faith.WarGodName], sẽ sớm chiến thắng trên các bức tường [target_kingdom.GetBaseNameNoTier]."
  great_holy_war.0057.generic.outsiders.desc:0 "Quân đội chúng Ta sẵn sàng tham gia [the_faith.GHWName] cho [target_kingdom.GetBaseNameNoTier]. Với [the_faith.WarGodName] ở bên, chúng Ta chắc chắn sẽ chiến thắng!"
  great_holy_war.0057.a:0 "Nguyện [the_faith.WarGodName] dẫn chúng ta tới chiến thắng!"
  great_holy_war.0058.title:0 "Thể hiện Sự Hèn Nhát"
  great_holy_war.0058.base.desc:0 "Trong khi những chiến binh đức hạnh vẫn tiến về [target_kingdom.GetBaseNameNoTier], Ta đã bỏ lại quân đội để tìm nơi an toàn. Khi họ chiến đấu không ngừng chống lại những [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] xấu xa, Ta đã làm ô danh bản thân và đặt câu hỏi về quyết tâm theo đuổi [the_faith.GHWName]."
  great_holy_war.0058.a:0 "Lẽ ra Ta không nên rời khỏi chiến trường..."
  great_holy_war.0061.title:0 "Được Thưởng"
  great_holy_war.0061.notification:0 "[scoped_beneficiary.GetFirstName] đã được trọng thưởng vì sự đóng góp của gia đình [scoped_beneficiary.GetHerHis] trong cuộc [scoped_beneficiary.GetFaith.GHWName] gần đây."
  great_holy_war.0070.title:0 "Vương Quốc Mới"
  great_holy_war.0070.base.desc:0 "Với việc thành lập một [the_faith.GetAdjective] [title_recipient.GetTitleTierName] đúng đắn tại [target_kingdom.GetBaseNameNoTier], tín đồ có thể an tâm, biết rằng [the_faith.WarGodName] đang mỉm cười với việc làm tốt của chúng ta. Việc người cai trị mới của [target_kingdom.GetBaseNameNoTier] thuộc triều đại của Ta chỉ càng chứng minh phước lành thần thánh của chúng ta."
  great_holy_war.0070.a:0 "Ta tự hỏi [title_recipient.GetSheHe] sẽ là một vị vua như thế nào..."
  great_holy_war.0070.b:0 "Đã đến lúc tập trung trở lại vào vương quốc của Ta."
  great_holy_war.0071.generic.attackers.desc:0 "[attacker.GetTitledFirstName] đã phát động một [attacker.GetFaith.GHWName] để tập hợp tất cả [attacker.GetFaith.GetAdherentNamePlural] trung thành dưới một ngọn cờ và dẫn họ chống lại kẻ thù của đức tin.\n\nCuối cùng đã đến lúc tẩy rửa vùng đất [target_kingdom.GetBaseNameNoTier] bằng máu của [ghw_defender.Custom('GetUnbelieverNamePlural')] và giành lấy vùng đất này cho vinh quang của [the_faith.WarGodName]."
  great_holy_war.0071.generic.defenders.desc:0 "Kẻ xấu xa [attacker.GetTitledFirstName] đã phát động [attacker.GetFaith.GHWName] chống lại dân thường [defender.GetPrimaryTitle.GetBaseNameNoTier].\n\nChúng ta phải tập hợp chống lại đám fan cuồng tàn nhẫn dưới quyền chỉ huy của [attacker.GetHerHis] nếu muốn sống sót."
  great_holy_war.0081.title:0 "Một [actor.GetFaith.GHWName] Mới"
  great_holy_war.0081.desc:0 "Vì lý do nào đó, [actor.GetFaith.GHWName] đã rời bỏ mục tiêu ban đầu và chuyển sang [secondary_recipient.GetPrimaryTitle.GetBaseNameNoTier].\n\nCó vẻ như vùng đất của chúng ta sẽ được tránh khỏi sự tàn bạo của các chiến binh [actor.GetFaith.GetAdjective], ít nhất là hiện giờ."
  great_holy_war.0081.a:0 "Ít nhất thì chúng ta vẫn an toàn."
  great_holy_war.0082.desc:0 "Trong một thời gian, tín đồ [actor.GetFaith.GetAdjective] đã tập hợp lực lượng cho một [actor.GetFaith.GHWName].\n\nTuy nhiên, trong một bước ngoặt bất ngờ, những tín đồ dẫn đầu đạo quân này đã quyết định thay đổi kế hoạch và tiến tới [secondary_recipient.GetPrimaryTitle.GetBaseNameNoTier]!"
  great_holy_war.0082.a:0 "Chúng ta chỉ có ít thời gian để chuẩn bị!"
  great_holy_war.0085.toast:0 "Việc cải đạo của [converter.GetTitledFirstNamePossessive] đã buộc Ta phải từ bỏ lời cam kết"
