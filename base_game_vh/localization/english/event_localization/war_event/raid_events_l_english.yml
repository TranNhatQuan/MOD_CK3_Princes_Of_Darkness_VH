l_english:
  raiding.0002.t:0 "Lửa và Máu"
  raiding.0002.desc:0 "Khu định cư [sacked_barony.GetNameNoTierNoTooltip], một pháo đài quan trọng trong vùng lớn [sacked_county.GetNameNoTierNoTooltip], đã rơi vào tay quân cướp của Ta. Chúng Ta có quyền tự do trên vùng đất rộng lớn, cùng vô số thần dân run rẩy và kho báu sáng chói của [sacked_county_owner.GetTitledFirstName] để lựa chọn.\n\nQuân lính đã sẵn sàng, chờ lệnh của Ta để hành động."
  raiding.0002.a:0 "Bắt những nô lệ lành nghề cho [raider_capital.GetNameNoTooltip]!"
  raiding.0002.a_nomad: "Cướp hết cừu và ngựa cái!"
  stolen_ewes_and_mares_modifier: "Cừu & Ngựa Cái Bị Cướp"
  stolen_ewes_and_mares_modifier_desc: "Hạt này đang thịnh vượng, nhờ vào làn sóng cừu và ngựa cái chất lượng được cướp từ các cuộc đột kích gần đây."
  raiding.0002.b:0 "Mang về cho ta những chiến lợi phẩm phong phú!"
  raiding.0002.c:0 "Chúng ta đã lấy đủ rồi."
  raiding.0003.t_spared:0 "[sacked_county.GetNameNoTierNoTooltip] Được Tha"
  raiding.0003.t_attacked:0 "Cuộc Cướp của [sacked_county.GetNameNoTierNoTooltip]"
  raiding.0003.desc.admin_plundered_independent:0 "Sau khi phá hủy các cổng vào khu định cư [sacked_barony.GetNameNoTierNoTooltip], [raider.GetTitledFirstName] đã tự do tung hoành trên khắp phần lớn vùng rộng lớn [sacked_county.GetNameNoTierNoTooltip], và đã tận dụng cơ hội của [raider.GetHerHis] để bắt cóc và nô dịch hóa nhiều quan lại uyên bác và thợ thủ công lành nghề nhất có thể. Giới tá điền vò đầu bứt tai và khóc lóc cho những thành viên gia đình bị thất lạc của họ."
  raiding.0003.desc.gold_plundered_independent:0 "Sau một cuộc vây hãm căng thẳng, [raider.GetTitledFirstName] đã thành công trong việc xâm nhập vào khu định cư kiên cố [sacked_barony.GetNameNoTierNoTooltip], và ra lệnh cho binh lính của [raider.GetHerHis] cướp bóc mọi thứ có giá trị. Trong thời gian ngắn, họ sẽ vơ vét sạch một nửa của cải của vùng rộng lớn [sacked_county.GetNameNoTierNoTooltip]!"
  raiding.0003.desc.spared_plundered_independent:0 "Mặc dù khu định cư [sacked_barony.GetNameNoTierNoTooltip] đầu hàng quân đội [raider.GetHerHis], [raider.GetTitledFirstName] đã tha mạng dân cư của vùng lớn [sacked_county.GetNameNoTierNoTooltip] khỏi cướp bóc thêm. Thay vào đó, [raider.GetSheHe] dường như chỉ quan tâm đến việc lấy chiến lợi phẩm của [raider.GetHerHis] từ #EMP Ta#!!"
  raiding.0003.desc.admin_plundered_vassal:0 "Chúa tể của Ta đã thất bại trong việc bảo vệ khu định cư [sacked_barony.GetNameNoTierNoTooltip] trước sự tàn phá của [raider.GetTitledFirstName], và với sự sụp đổ này, một pháo đài quan trọng của vùng lớn [sacked_county.GetNameNoTierNoTooltip] đã mất. Ngay cả bây giờ, quân lính [raider.GetTitledFirstNamePossessiveNoTooltip] đang tràn khắp nông thôn, bắt và nô dịch mọi thợ lành nghề và học viên mà họ có thể tìm thấy."
  raiding.0003.desc.gold_plundered_vassal:0 "Không có sự trợ giúp từ chúa tể của Ta, [sacked_barony.GetNameNoTierNoTooltip] gần như không có cơ hội. Những kẻ cướp theo [raider.GetTitledFirstName] đã tàn phá khu định cư, lấy đi mọi thứ từ tài sản của dân thường đến chiếc cốc may mắn của Ta.\n\nNửa vùng lớn [sacked_county.GetNameNoTierNoTooltip] đang bốc cháy vì cướp bóc [raider.GetPrimaryTitle.GetAdjectiveNoTooltip], và [raider.GetTitledFirstNameNoTooltip] vẫn đang đâu đó, uống từ chiếc cốc cá nhân của Ta."
  raiding.0003.desc.spared_plundered_vassal:0 "Mặc dù chúa tể của ta đã thất bại trong việc giải vây cho [sacked_barony.GetNameNoTierNoTooltip], [raider.GetTitledFirstName] bất kể thế nào vẫn giữ quân lính của [raider.GetHerHis] trong sự kiểm soát chặt chẽ.\n\nHầu hết vùng nông thôn nhờ đó đã được tha bổng khỏi những cuộc cướp bóc thông thường, nhưng những đôi mắt đói khát của đức tin [raider.GetPrimaryTitle.GetAdjectiveNoTooltip] đang chuyển hướng sang nơi khác..."
  raiding.0003.a:0 "Quái vật!"
  raiding.0003.b:0 "Ta #EMP sẽ#! báo thù cho sự sỉ nhục này."
  raiding.0003.c:0 "Chúng ta sẽ tái thiết [sacked_county.GetNameNoTierNoTooltip]."
  raiding.0004.desc.admin_plundered:0 "[sacked_county_owner.GetTitledFirstName] đã phải trả giá cho lòng tham của [raider.GetTitledFirstNamePossessive]. Với sự sụp đổ của khu định cư [sacked_barony.GetNameNoTierNoTooltip], nhiều phần của vùng lớn [sacked_county.GetNameNoTierNoTooltip] trở nên không được bảo vệ.\n\nKhông ai chống cự, quân cướp [raider.GetPrimaryTitle.GetAdjectiveNoTooltip] tung hoành, bắt và nô dịch mọi thợ lành nghề mà họ tìm thấy."
  raiding.0004.desc.gold_plundered:0 "Với sự sụp đổ của khu định cư [sacked_barony.GetNameNoTierNoTooltip] vào tay [raider.GetTitledFirstNameNoTooltip], phần lớn vùng lớn [sacked_county.GetNameNoTierNoTooltip] bị bỏ trống cho những kẻ cướp [raider.GetPrimaryTitle.GetAdjectiveNoTooltip].\n\nDo ít pháo đài lớn còn lại để chống lại, quân cướp đã lấy đi mọi vật quý giá và bạc mà họ tìm được."
  raiding.0004.desc.spared_plundered:0 "Mặc dù bao vây thành công khu định cư [sacked_barony.GetNameNoTierNoTooltip], một công trình kiên cố bảo vệ các dải đất rộng lớn thuộc [sacked_county.GetNameNoTierNoTooltip], [raider.GetTitledFirstName] đã kiềm chế quân lính của [raider.GetHerHis]. Cuộc cướp bóc diễn ra sau đó chỉ mang tính cục bộ và rải rác.\n\nMặc dù chư hầu của bạn đã được tha bổng, nhưng tộc [raider.GetPrimaryTitle.GetAdjectiveNoTooltip] đang thèm khát dòm ngó các lãnh địa cá nhân của bạn..."
  raiding.0004.a:0 "Ta nguyền rủa những kẻ man rợ phiền phức này!"
  raiding.0004.a.tribal:0 "Nguyền rủa bọn chó [raider.GetPrimaryTitle.GetAdjectiveNoTooltip]!"
  raiding.0004.b:0 "Trả tiền bồi thường cho những mất mát."
  raiding.0004.c:0 "Giúp họ xây dựng lại."
  raiding.0004.c.architect:0 "Ngươi phái [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('architect'))] [architect.GetTitledFirstNameNoTooltip] giám sát việc sửa chữa."
  recently_sacked_modifier:0 "Mới Bị Cướp"
  recently_sacked_modifier_desc:0 "Quân cướp sẽ không tìm thấy gì thêm, trong khi nỗi sợ về lần trở lại giữ dân chúng tuân phục."
  rebuilding_after_sacking_modifier:0 "Xây Dựng Lại Sau Cướp"
  rebuilding_after_sacking_modifier_desc:0 "Một nhà hảo tâm giàu có giúp dân địa phương sửa chữa khu định cư bị hư hại."
  raiding.0004.c.feed.t:0 "Chúa tể chi trả cho việc sửa chữa"
  raiding.0004.c.feed.desc:0 "Chúa tể của Ta đã chi trả cho đội ngũ kiến trúc sư và quản lý giúp sửa chữa [sacked_county.GetNameNoTierNoTooltip]."
  raiding.0004.c.feed.desc2:0 "Chúa tể của Ta đã phái Kiến trúc sư Hoàng gia dẫn dắt đội ngũ kiến trúc sư và quản lý giúp sửa chữa [sacked_county.GetNameNoTierNoTooltip]."
  raiding.0011.t:0 "Chiến Lợi Phẩm Đã Được Mang Về"
  raiding.0011.desc:0 "Quân cướp của Ngài mang về [ROOT.Var('raid_loot').GetValue|V0] [gold_i] và [ROOT.Var('raid_loot').GetValue|V0] [prestige_i] trong chiến lợi phẩm và danh tiếng."
  raiding.0011.desc_non_tribal:0 "Quân cướp của Ngài mang về [ROOT.Var('raid_loot').GetValue|V0] [gold_i], nhưng làm Ngài mất [SCOPE.ScriptValue('non_tribal_loot_value')|V0] [prestige_i] danh tiếng."
  raiding.0012.a.t:0 "Chiến Lợi Phẩm Bị Mất"
  raiding.0012.a.desc:0 "[recipient.GetTitledFirstName] đã lấy [loot_i][ROOT.Var('raid_loot').GetValue|V0] từ chúng ta!\nChiến thắng này đã mang lại cho [recipient.GetHerHim] [ROOT.Var('raid_prestige').GetValue|V0] [prestige_i]."
  raiding.0012.b.t:0 "Chiến Lợi Phẩm Được Thu Hồi"
  raiding.0012.b.desc:0 "Ngài đã chiếm lại [loot_i][ROOT.Var('raid_loot').GetValue|V0] từ [raider.GetTitledFirstName]!\nChiến thắng này mang lại cho Ngài [ROOT.Var('raid_prestige').GetValue|V0] [prestige_i]."
  raiding.0023.t:0 "Nỗi Kinh Hoàng từ [capital_province.GetNameNoTooltip]"
  raiding.0023.desc:0 "Trong nhiều năm, Ta đã càn quét trong các cuộc đột kích tàn phá, mang toàn bộ cơn thịnh nộ của [raid_leader.GetFaith.HighGodName] đến một thế giới run sợ, vì chắc chắn nếu [raid_leader.GetFaith.HighGodNameSheHe|U] không đồng ý, [raid_leader.GetFaith.HighGodNameSheHe|U] đã trừng phạt Ta rồi?\n\nThay vào đó, gia đình Ta ngủ giữa những của cải cướp được từ các lãnh chúa nước ngoài, và nô lệ ngoại quốc sưởi ấm giường Ta.\n\nThật vậy, cả quý tộc lẫn nông dân đều run sợ khi Ta đến, và các bậc cha mẹ dọa trẻ em im lặng bằng việc Ta sẽ ghé thăm."
  raiding.0023.a:0 "Ha! Hãy để chúng khóc tên ta!"
