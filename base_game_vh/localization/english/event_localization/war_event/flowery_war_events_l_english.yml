l_english:

  designated_sacrifice_died.t:0 "Người Hiến Sinh Được Đánh Dấu Đã Chết"
  designated_sacrifice_died.desc:0 "[dead_designated_sacrifice.GetShortUIName|U] đã chết trước khi Ta kịp hiến [dead_designated_sacrifice.GetHerHim] cho [ROOT.Char.GetFaith.HighGodName]. [ROOT.Char.GetFaith.AltPriestTermPlural] của Ta và dân chúng đều không vui."
  designated_sacrifice_release.t:0 "Người Hiến Sinh Được Đánh Dấu Được Thả"
  designated_sacrifice_released.desc:0 "[released_designated_sacrifice.GetShortUIName|U] đã được thả thay vì hiến cho [ROOT.Char.GetFaith.HighGodName]. [ROOT.Char.GetFaith.AltPriestTermPlural] của Ta và dân chúng đều không vui."
  designated_human_sacrifice_modifier:0 "Người Hiến Sinh Được Chỉ Định"
  designated_human_sacrifice_modifier_desc:0 "Nhân vật này đã được thần linh đánh dấu để hiến sinh. Ít nhất là theo quan điểm của kẻ bắt giữ."
  human_sacrifice.0001.t:0 "Thần Thèm Khát"
  human_sacrifice.0001.desc:0 "Đã vài năm trôi qua kể từ khi ta tiến hành một cuộc chiến hoa mỹ nhân danh [ROOT.Char.GetFaith.HighGodName], nhưng ta vẫn chưa tế lễ tất cả các tù binh cấp cao bị bắt giữ khi xung đột kết thúc. Các [ROOT.Char.GetFaith.AltPriestTermPlural] của ta đang dần mất kiên nhẫn, và thứ dân đang bàn tán xôn xao rằng [ROOT.Char.GetFaith.WarGodName] đã ngoảnh mặt làm ngơ với ta."
  human_sacrifice.0001.a:0 "Chờ đã, chắc một lễ hiến muộn cũng được chứ?"
  human_sacrifice.0001.b:0 "Ta chịu đựng sự khinh bỉ của họ một cách điềm tĩnh."
  human_sacrifice.0001.c:0 "Sự man rợ này thật không phù hợp với ta."
  human_sacrifice_coward_modifier:0 "Thần Thèm Khát Bị Xúc Phạm"
  human_sacrifice_coward_modifier_desc:0 "Nhân vật này nổi tiếng là hay sợ hãi và biện minh trước thần linh."
  flowery_war_cb_ended_invalid.t:0 "Chiến Tranh Bị Hủy Bỏ"
  flowery_war_cb_ended_invalid.desc_other_sacrifices_attacker:0 "Chiến tranh [war.GetName] đã kết thúc: Ta đã lấy hiến sinh ở nơi khác."
  flowery_war_cb_ended_invalid.desc_other_sacrifices_defender:0 "Chiến tranh [war.GetName] đã kết thúc: [attacker.GetShortUIName] đã lấy hiến sinh phù hợp ở nơi khác."
  flowery_war_cb_ended_invalid.desc_no_sacrificers:0 "Chiến tranh [war.GetName] đã kết thúc: không có bên tham gia chính nào thực hiện hiến sinh công khai."
