  combat_event.1012.slain_message.desc.double:3 "Quân đội của Ngài đã giết [primary_deceased.Custom2('YourCharacterIntroduction', ROOT.Char)|U] và [secondary_deceased.Custom2('YourCharacterIntroduction', ROOT.Char)]"
