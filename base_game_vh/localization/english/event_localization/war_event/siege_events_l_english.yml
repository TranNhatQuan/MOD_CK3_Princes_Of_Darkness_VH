l_english:
# Captured prisoner notifications, by Mathilda Bjarnehed
  siege.0002.one_captured.t:1 "Bắt Tù Nhân Trong Cuộc Bao Vây"
  siege.0002.several_captured.t:1 "Bắt Nhiều Tù Nhân Trong Cuộc Bao Vây"
  siege.0002.one_captured:0 "Ngài đã bắt [prisoner_1.Custom2('NamePossessiveCharacterIntroduction', SCOPE.sC('holder'))] trong cuộc [siege|E] của [barony.GetNameNoTier]."
  siege.0002.two_captured:0 "Ngài đã bắt [prisoner_1.Custom2('NamePossessiveCharacterIntroduction', SCOPE.sC('holder'))] và [prisoner_2.Custom2('HerHisCharacterIntroduction', SCOPE.sC('holder'))] trong cuộc [siege|E] của [barony.GetNameNoTier]."
  siege.0002.several_captured:0 "Ngài đã bắt [prisoner_1.Custom2('NamePossessiveCharacterIntroduction', SCOPE.sC('holder'))] và [ROOT.Var('num_other_relevant_captured_combatants').GetValue|V0] người khác trong cuộc [siege|E] của [barony.GetNameNoTier]."
	
  siege.0003.one_captured.t:1 "Quan Ái Bị Bắt Trong Cuộc Bao Vây"
  siege.0003.several_captured.t:1 "Các Quan Ái Bị Bắt Trong Cuộc Bao Vây"
  siege.0003.one_captured:0 "[prisoner_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã bị bắt"
  siege.0003.two_captured:0 "[ROOT.Char.Custom2('RelationToMeShort', prisoner_1)] [prisoner_1.GetFirstName] và [ROOT.Char.Custom2('RelationToMeShort', prisoner_2)] [prisoner_2.GetFirstName] của Ta đã bị bắt"
  siege.0003.several_captured:0 "[ROOT.Char.Custom2('RelationToMeShort', prisoner_1)] [prisoner_1.GetFirstName] và [ROOT.Var('num_other_relevant_captured_combatants').GetValue|V0] người khác đã bị bắt"
  siege.0003.end:0 "bởi [occupant.Custom2('MyCharacterIntroduction', ROOT.Char)] trong cuộc [siege|E] của [barony.GetNameNoTier]."

  siege.0004.relation_captured.t:0 "[ROOT.Char.Custom2('RelationToMeShort', prisoner_1)|U] Bị Bắt"
  siege.0004.one_captured:0 "$siege.0003.one_captured$"
  siege.0004.two_captured:0 "$siege.0003.two_captured$"
  siege.0004.several_captured:0 "$siege.0003.several_captured$"
  siege.0004.end:0 "$siege.0003.end$"

  siege.0013.one_killed.t:1 "Quan Ái Chết Trong Cuộc Bao Vây"
  siege.0013.several_killed.t:1 "Các Quan Ái Chết Trong Cuộc Bao Vây"
  siege.0013.one_killed:0 "Quan ái [casualty_1.GetFirstName] của Ta đã bị giết"
  siege.0013.two_killed:0 "Các quan ái [casualty_1.GetFirstName] và [casualty_2.GetFirstName] của Ta đã bị giết"
  siege.0013.several_killed:0 "[casualty_1.GetFirstName] và [ROOT.Var('num_other_relevant_slain_combatants').GetValue|V0] quan ái khác của Ta đã bị giết"
  siege.0013.end:0 "$siege.0003.end$"

  siege.0014.one_killed.t:1 "[ROOT.Char.Custom2('RelationToMeShort', casualty_1)|U] Chết Trong Cuộc Bao Vây"
  siege.0014.one_killed:0 "[casualty_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã bị giết"
  siege.0014.two_killed:0 "[casualty_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] và [casualty_2.Custom2('MyCharacterIntroduction', ROOT.Char)] đã bị giết"
  siege.0014.several_killed.t:0 "Người Bị Giết Trong Cuộc Bao Vây"
  siege.0014.several_killed:0 "[casualty_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] và [ROOT.Var('num_other_relevant_slain_combatants').GetValue|V0] người khác đã bị giết"
  siege.0014.end:0 "$siege.0013.end$"

  siege.0102.title:0 "Mất Cuộc Bao Vây [barony.GetNameNoTierNoTooltip]"
  siege.0102.message.foe:0 "$siege.0103.message$"
  siege.0102.message.neutral:1 "Lãnh địa hiện đang bị [occupant.Custom2('MyCharacterIntroduction', ROOT.Char)] [occupied|E] trong cuộc [war.GetName]"
  siege.0103.title:0 "$siege.0102.title$"
  siege.0103.message:1 "Lãnh địa hiện đang bị kẻ thù của Ta [occupant.GetTitledFirstName] [occupied|E] trong cuộc [war.GetName]"

  siege.1005.pow_toast.t:1 "Bắt Tù Nhân Quý Giá"
  siege.1005.pow_toast.desc:2 "Ta đã bắt [valuable_prisoner.Custom2('NamePossessiveCharacterIntroduction', primary_siege_defender)] làm tù nhân trong Cuộc Bao Vây [barony.GetNameNoTier]"
  siege.1005.pow_toast.desc.primary:2 "Ta đã bắt kẻ thù của Ta [valuable_prisoner.GetTitledFirstName] làm tù nhân trong Cuộc Bao Vây [barony.GetNameNoTier]"
  siege.1006.pow_toast.t:2 "Tù Nhân Quý Giá Bị Bắt"
  siege.1006.pow_toast.desc:2 "[occupant.GetTitledFirstName] đã bắt [valuable_prisoner.Custom2('MyCharacterIntroduction', ROOT.Char)] làm tù nhân sau Cuộc Bao Vây [barony.GetNameNoTier]"
  siege.1007.pow_toast.t:0 "$siege.1005.pow_toast.t$"
  siege.1007.pow_toast.desc:2 "[occupant.GetTitledFirstName] đã bắt [valuable_prisoner.Custom2('NamePossessiveCharacterIntroduction', primary_siege_defender)] làm tù nhân sau Cuộc Bao Vây [barony.GetNameNoTier]"
  siege.1007.pow_toast.desc.primary:2 "[occupant.GetTitledFirstName] đã bắt kẻ thù của Ta [valuable_prisoner.GetTitledFirstName] làm tù nhân sau Cuộc Bao Vây [barony.GetNameNoTier]"
  war_siege: "cuộc bao vây"
  war_raid: "cuộc đột kích"
