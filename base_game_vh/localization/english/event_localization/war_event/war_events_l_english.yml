l_english: 
  war_event.1901:1 "[liege|E] của bạn, [attacker_winner.GetUIName], đã chiến thắng trong cuộc [war|E] của [attacker_winner.GetHerHis] chống lại [defender_loser.GetUIName]!"
  war_event.1902:1 "[liege|E] của bạn, [defender_loser.GetUIName], đã thất bại trong cuộc [war|E] của [defender_loser.GetHerHis] trước [attacker_winner.GetUIName]!"
  war_event.1903:1 "Ngài [liege|E] của Ngài, [attacker_white_peace.GetUIName], đã ký [white_peace|E] với [defender_white_peace.GetUIName]!"
  war_event.1904:1 "Ngài [liege|E] của Ngài, [defender_white_peace.GetUIName], đã ký [white_peace|E] với [attacker_white_peace.GetUIName]!"
  war_event.1905:1 "[liege|E] của bạn, [attacker_loser.GetUIName], đã thất bại trong cuộc chiến của [attacker_loser.GetHerHis] trước [defender_winner.GetUIName]!"
  war_event.1906:1 "[liege|E] của bạn, [defender_winner.GetUIName], đã chiến thắng trong cuộc chiến của [defender_winner.GetHerHis] chống lại [attacker_loser.GetUIName]!"
  war_event.notification_liege_win.t:0 "Ngài Thắng Trong Chiến Tranh"
  war_event.notification_liege_loss.t:0 "Ngài Thua Trong Chiến Tranh"

  war_event.1001.t:0 "Ngài Ta Tuyên Chiến"
  war_event.1001.desc:0 "Thật kỳ lạ khi tình hình có thể thay đổi nhanh chóng như thế nào trong chiến tranh.\n\nỞ giữa cuộc chiến chống lại [recipient.Custom2('MyCharacterIntroduction', ROOT.Char)], một mật thư từ [liege_invalidator.Custom2('MyCharacterIntroduction', ROOT.Char)] được gửi tới. [liege_invalidator.GetSheHe|U] đang bảo ta từ bỏ đại nghĩa của chính mình để gia nhập cùng [liege_invalidator.GetHerHim] trong cuộc chiến #EMP của [liege_invalidator.GetHerHis]#! chống lại [recipient.GetTitledFirstName]."
  war_event.1001.a:0 "Nh-nhưng còn chiến tranh của Ta thì sao!? Chết tiệt!"

  war_event.2003.desc:0 "Vì [liege_invalidator.Custom2('MyCharacterIntroduction', invalidator)] hiện đang tuyên chiến với ngài, lực lượng của thần sẽ gia nhập đại nghĩa của [liege_invalidator.GetHerHis]."
  war_event.2003.a:0 "Được thôi."

  war_event.2001.t:0 "Đối Thủ Mới"
  war_event.2001.desc:0 "Không gì trên đời là chắc chắn, đặc biệt trong thời chiến. [war.GetName] cũng không khác.\n\nVì cuộc xung đột giờ không còn chống lại [previous_defender.Custom2('MyCharacterIntroduction', ROOT.Char)] mà là [defender.Custom2('MyCharacterIntroduction', ROOT.Char)], có lẽ nên đánh giá lại tình hình."
  war_event.2001.a:0 "Mục tiêu của Ta vẫn như cũ."
  war_event.2001.a.tt:0 "Cuộc chiến vẫn tiếp diễn"
  war_event.2001.b:0 "Điều này không còn là lựa chọn tốt nhất nữa."
  war_event.2001.c:0 "Có lẽ chúng ta có thể thương lượng?"
  war_event.2001.c.tt:0 "Yêu cầu một khoản vàng lớn từ [defender.GetTitledFirstName] để đổi lấy việc chấm dứt chiến tranh"

  war_event.2002.t:0 "[invalidator.Custom2('AppropriateGreeting', ROOT.Char)]"
  war_event.2002.desc:0 "Thật tiếc khi chúng ta giờ ở phe đối lập trong cuộc xung đột này. Ta không hề muốn điều đó, vì vậy Ta sẽ rút quân."
  war_event.2002.a:0 "Lựa chọn khôn ngoan."

  war_event.2004.t: "[harald.Custom2('AppropriateGreeting', ROOT.Char)]"
  war_event.2004.desc: "Vì chúng ta giờ ở phe đối lập, có lẽ chúng ta có thể thương lượng để giải quyết xung đột một cách hòa bình?\n\nTa sẽ rút quân nếu nhận được khoản vàng hợp lý..."
  war_event.2004.a: "Thỏa thuận tốt."
  war_event.2004.b: "Không đời nào!"

  war_event.2005.t: "[william.Custom2('AppropriateGreeting', ROOT.Char)]"
  war_event.2005.desc: "Sự khôn ngoan của Ngài thật đáng nể. Chúng ta có thỏa thuận."
  war_event.2005.a: "Tuyệt vời!"

  war_event.2006.t: "[william.Custom2('AppropriateGreeting', ROOT.Char)]"
  war_event.2006.desc: "Rất tiếc Ta phải từ chối đề nghị của Ngài. Chúng ta sẽ gặp nhau trên chiến trường."
  war_event.2006.a: "Chiến tranh thôi."

  war_event.3001.t:0 "[war_owner.Custom2('AppropriateGreeting', ROOT.Char)]"
  war_event.3001.desc:0 "Hai năm trước Ngài hứa sẽ giúp Ta trong [war.GetName], nhưng đến giờ Ngài vẫn chưa làm gì để hỗ trợ Ta.\n\nLiệu liên minh của chúng ta có ý nghĩa gì nếu Ngài không hề giơ tay giúp?"
  war_event.3001.a:0 "Ta sẽ gửi quân ngay lập tức để giúp Ngài!"
  war_event.3001.a.tt:0 "Nếu Ta không đóng góp bất kỳ [war_contribution|E] nào trong 12 tháng, Ta sẽ mất một [prestige_level|E] và làm nguy hiểm liên minh với [war_owner.GetTitledFirstNameNoTooltip]!"
  war_event.3001.b:0 "Kho vàng này sẽ bù đắp cho sự vắng mặt của Ta..."
  war_event.3001.b.tt:0 "Ta sẽ không còn phải gửi quân tham chiến trong [war.GetName]."
  war_event.3001.c:0 "Ta xin lỗi, Ta không nên hứa sẽ giúp."

  war_event.3002.t:0 "[war_owner.Custom2('AppropriateGreeting', ROOT.Char)]"
  war_event.3002.desc.start:0 "Dù Ngài hứa sẽ gửi quân giúp, Ta vẫn chưa thấy một chiến binh nào của Ngài trên chiến trường."
  war_event.3002.desc.end.1:0 "Việc phá vỡ lời thề này đã đem lại nhục nhã cho Ngài và gia đình."
  war_event.3003.desc.end.2:0 "Sự thất bại này đã làm giảm nghiêm trọng niềm tin của Ta vào Ngài, [ROOT.Char.GetTitledFirstName]."
  war_event.3002.1.a:0 "Được thôi."
  war_event.3003.2.a:0 "Lần sau Ta sẽ làm tốt hơn."
  war_event.3003.2.b:0 "Có lẽ Ta nên kết thúc liên minh này...?"

  war_event.neighbor_war.both_neighbors.t:0 "Chiến Tranh Của Hàng Xóm Đã Kết Thúc"
  war_event.neighbor_war.both_neighbors.desc:1 "láng giềng  của ngài [winner.GetTitledFirstName] đã thắng hàng xóm khác của Ngài [loser.GetTitledFirstName] trong [war.GetName]!"

  war_event.neighbor_war.only_winner.t:0 "láng giềng Thắng Chiến Tranh"
  war_event.neighbor_war.only_winner.desc:3 "láng giềng  của ngài [winner.GetTitledFirstName] đã thắng [loser.Custom2('YourCharacterIntroductionNoComma', this_player)] trong [war.GetName]!"

  war_event.neighbor_war.only_loser.t:0 "láng giềng Thua Chiến Tranh"
  war_event.neighbor_war.only_loser.desc:2 "láng giềng  của ngài [loser.GetTitledFirstName] đã thua trước [winner.Custom2('YourCharacterIntroductionNoComma', this_player)] trong [war.GetName]!"

 #Holy wars "soft invalidated" by faith change
  war_event.3101.t:0 "Đức Tin Mới"
  war_event.3101.desc:0 "Tin tức đã đến tai Ta về việc [defender.GetTitledFirstNamePossessive] chuyển sang [defender.GetFaith.GetNameNoTooltip]. Ta không còn quyền được [ROOT.Char.GetFaith.HighGodName] ban để phát động chiến tranh chống lại [defender.GetPrimaryTitle.GetNameNoTierNoTooltip]."
  war_event.3101.a:0 "Đã đến lúc đặt kiếm xuống."
  war_event.3101.b.tt:0 "[war.GetName] vẫn tiếp diễn"
  war_event.3101.b:0 "[defender.GetSheHe|U] nghĩ điều này sẽ ngăn Ta sao? Ha!"

  war_event.3102.t:0 "[attacker.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
  war_event.3102.desc:0 "Đức tin mới của Ngài vào [ROOT.Char.GetFaith.HighGodName] khó mà thuyết phục. Lý do của Ta vẫn chính đáng — sẽ không có khoan nhượng."
  war_event.3102.a:0 "[ROOT.Char.Custom('CulturalCurse')|U]!"


