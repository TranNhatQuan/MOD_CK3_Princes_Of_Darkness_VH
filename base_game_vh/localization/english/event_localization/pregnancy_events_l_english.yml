l_english:
  pregnancy.1001.t:0 "Mang Thai!"
  pregnancy.1001.d:0 "Một đứa trẻ đang lớn trong bụng ta. [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))] của ta, [real_father.GetTitledFirstNameNoTooltip], sẽ tự hào!"
  pregnancy.1001.a:0 "Tốt lắm!"

  pregnancy.1002.t:0 "Mang Thai!"
  pregnancy.1002.d:0 "Định mệnh mỉm cười với ta! [spouse.Custom2('RelationToMe', SCOPE.sC('mother'))] của ta, [mother.GetTitledFirstNameNoTooltip], đang mang thai đứa con của ta!"
  pregnancy.1002.a:0 "Ta không thể chờ để ôm đứa trẻ vào lòng!"

  pregnancy.1101.t.dead:0 "Cuộc Sống Tiếp Diễn"
  pregnancy.1101.t.divorced:0 "Hoàn Cảnh Đặc Biệt"
  pregnancy.1101.desc.start:0 "Một đứa trẻ đang lớn trong bụng ta, và ta không nghi ngờ rằng đó là con của"
  pregnancy.1101.desc.dead:0 "người chồng quá cố [ex_spouse.GetTitledFirstName]."
  pregnancy.1101.desc.divorced:0 "người chồng cũ [ex_spouse.GetTitledFirstName]."
  pregnancy.1101.desc.end:0 "\n\nDù hoàn cảnh xung quanh việc mang thai này thật đáng tiếc, ít nhất ta có thể mừng rằng đứa trẻ chưa sinh sẽ không bị coi là con rơi."
  pregnancy.1101.a.dead:0 "Giá mà [ex_spouse.GetFirstNameNoTooltip] có thể ở đây cho chuyện này..."
  pregnancy.1101.a.divorced:0 "Ta đoán phải thông báo cho [ex_spouse.GetFirstNameNoTooltip] ngay lập tức."

  pregnancy.1102.t:0 "$pregnancy.1101.t.divorced$"
  pregnancy.1102.desc:0 "Đến giờ đã rõ rằng [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))] của ta, [mother.GetTitledFirstName], đang mang thai, dù dựa theo thời gian, ta không nghĩ đó là con của ta.\n\nRất có khả năng cha thật sự là người chồng trước đây của [mother.GetTitledFirstNamePossessiveNoTooltip], [ex_spouse.GetTitledFirstName]."
  pregnancy.1102.a:0 "Đáng tiếc."

  pregnancy.1103.opening:0 "Gửi người chồng cũ của [mother.Custom2('RelationDescriptor', ROOT.Char)],"
  pregnancy.1103.opening_concubine:0 "Gửi người [ROOT.Char.GetWomanMan] cũ của [mother.Custom2('RelationDescriptor', ROOT.Char)],"
  pregnancy.1103.desc:0 "Ta viết thư này để thông báo rằng ta đang mang thai, và chắc chắn đứa trẻ là con của ngài.\n\nVì chúng ta đã là vợ chồng khi đứa trẻ được thụ thai nên không hề có vết nhơ con rơi; khi sinh ra, đứa trẻ sẽ được biết là con hợp pháp của ngài."
  pregnancy.1103.desc_concubine:0 "Ta viết thư này để thông báo rằng ta đang mang thai, và chắc chắn đứa trẻ là con của ngài.\n\nVì chúng ta đã ở bên nhau khi đứa trẻ được thụ thai nên không hề có vết nhơ con rơi; khi sinh ra, đứa trẻ sẽ được biết là con của ngài."
  pregnancy.1103.a:0 "Được thôi."

  pregnancy_not_first_child_message_title: "[spouse.Custom2('RelationToMe', SCOPE.sC('mother'))|U] Mang Thai"
  pregnancy_not_first_child_message:1 "[spouse.Custom2('RelationToMe', SCOPE.sC('mother'))] của Ngài, [mother.GetTitledFirstName], đang mang thai con của Ngài"

  pregnancy.2001.t:0 "Ngoài Hôn Nhân"
  pregnancy.2001.opening:0 "Ta đã dằn vặt về điều này, và dấu hiệu rõ ràng. Ta đang mang thai!"
  pregnancy.2001.father_is_married:0 "\n\n[real_father.Custom2('MyCharacterIntroduction', ROOT.Char)|U] chắc chắn là cha, nhưng [real_father.GetSheHe] đã kết hôn, và chắc chắn sẽ không bao giờ công nhận đứa trẻ của ta là [real_father.GetHerHis]!"
  pregnancy.2001.father_is_unmarried:0 "\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))] của ta, [real_father.GetTitledFirstName], chắc chắn là cha, nhưng không có ràng buộc hôn nhân, thì mọi người sẽ nói gì về đứa trẻ của ta?"
  pregnancy.2001.a:0 "Ta sẽ cho mọi người biết ai là cha!"
  pregnancy.2001.b:0 "[real_father.GetFirstNameNoTooltip] phải biết, nhưng không ai khác!"
  pregnancy.2001.c:0 "Ta không thể nói #EMP với ai#!..."
  pregnancy.2001.c.tt:0 "Ngài hy vọng không ai phát hiện!"
  pregnancy.2001.d:0 "Ta phải nhờ một bà thông thái chuẩn bị thuốc."

  pregnancy.2002.t:0 "Với Người Khác"
  pregnancy.2002.desc:0 "Ta đã dằn vặt về điều này, và dấu hiệu rõ ràng. Ta đang mang thai!\n\nĐây không phải điều vui, vì ta chắc chắn rằng cha thật sự là [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)], chứ không phải [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] của ta, [spouse.GetFirstName]!"
  pregnancy.2002.desc.polyamorous:0 "Ta đã dằn vặt về điều này, và dấu hiệu rõ ràng. Ta đang mang thai!\n\nTa chắc chắn rằng [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)] là cha thật sự, chứ không phải [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] của ta, [spouse.GetFirstName]."
  pregnancy.2002.a:0 "Ta thú nhận sự phản bội!"
  pregnancy.2002.b:0 "[real_father.GetFirstNameNoTooltip] sẽ biết, bí mật."
  pregnancy.2002.c:0 "Không ai được biết."
  pregnancy.2002.c.tt:1 "#F Ngài hy vọng điều này vẫn là bí mật#!"
  reveal_illegitimate_pregnancy_to_real_father_tt:0 "Bí mật được tiết lộ cho [real_father.GetFirstName]"
  pregnancy.2002.d:0 "Ta cần thuốc của một bà thông thái."
  search_for_real_father_tt:0 "#F Ta sẽ đi tìm người đó!#!"

  pregnancy_treatment_fails_tt:0 "Điều trị thất bại"

  pregnancy.2003.t:0 "Chờ Đợi"
  pregnancy.2003.desc_no_notice:0 "Ta lo lắng rằng hỗn hợp [ROOT.Char.Custom('Abortifacient')] sẽ có hiệu quả, nhưng giờ đã rõ.\n\nTa không còn mang thai nữa."
  pregnancy.2003.desc_pain:0 "Hỗn hợp [ROOT.Char.Custom('Abortifacient')] gây cho ta chuột rút và nôn mửa, nhưng tốt hơn là như vậy còn hơn không có tác dụng.\n\nTa không còn mang thai nữa."
  pregnancy.2003.a:0 "Ta đã làm điều phải làm."

  pregnancy.2004.t:0 "Cơn Bệnh"
  pregnancy.2004.desc:0 "Hỗn hợp [ROOT.Char.Custom('Abortifacient')] đã chấm dứt việc mang thai, nhưng khiến ta nôn mửa và sốt. Bà thông thái đã cảnh báo về cơn sốt, nhưng nỗi đau không dừng lại như bà nói."
  pregnancy.2004.a:0 "Ta có thể vượt qua điều này."

  pregnancy.2005.t:0 "Chờ Đợi"
  pregnancy.2005.desc:0 "Ta hy vọng hỗn hợp [ROOT.Char.Custom('Abortifacient')] sẽ kết thúc rắc rối, nhưng bà thông thái cảnh báo rằng có thể không hiệu quả.\n\nTa sợ rằng lo lắng của bà là có cơ sở, vì ta chắc chắn rằng đứa trẻ vẫn đang lớn trong bụng."
  pregnancy.2005.a:0 "Không còn gì có thể làm."

  pregnancy.2007.t:0 "Sự Ra Đi"
  pregnancy.2007.desc:0 "Mọi thứ mờ nhạt kể từ khi ta uống hỗn hợp [ROOT.Char.Custom('Abortifacient')]. Những bóng người đi qua giường ta thì thầm, mờ và xám, hòa lẫn vào rìa tối của tầm nhìn. Khi tiếng thì thầm trở nên dữ dội, nỗi nóng cháy trong lồng ngực cũng tăng theo."
  pregnancy.2007.a:0 "Ai sẽ đón nhận ta?"

  pregnancy.2050.t:0 "Với Người Khác"
  pregnancy.2050.desc.polyamorous:0 "Ta đã dằn vặt về điều này, và dấu hiệu rõ ràng. Ta đang mang thai!\n\nTa không nghi ngờ rằng [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)] là cha thật sự."
  pregnancy.2050.desc:0 "Ta đã khổ sở vì điều này, và những dấu hiệu đã rõ ràng. Ta đã có mang!\n\nĐây không phải là nguyên do cho niềm vui vì mọi người giờ đây đều biết ta đã không chung thủy với [spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] của mình. Ta không nghi ngờ gì rằng [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)] chính là cha của đứa bé..."

  pregnancy.2101.t:0 "Sinh Non"
  pregnancy.2101.desc_other_children:0 "Khi bụng lớn lên, nỗi lo lắng cũng tăng. Đây không phải lần đầu ta mang thai, nhưng cảm giác đáng ngại này là mới; có điều gì đó không ổn.\n\nChuột rút đến vào ban đêm, và khi ta thức dậy sáng hôm sau, ga trải giường đầy máu và hỏng."
  pregnancy.2101.desc_pain:0 "Khi bụng lớn lên, nỗi lo lắng cũng tăng. Đây là lần đầu ta mang thai, nhưng cảm giác đáng ngại này không đúng; có điều gì đó không ổn.\n\nChuột rút đến vào ban đêm, và khi ta thức dậy sáng hôm sau, ga trải giường đầy máu và hỏng."
  pregnancy.2101.desc:0 "Theo thời gian, sự lo sợ càng tăng thay vì bụng. Chắc chắn bụng phải lớn hơn bây giờ chứ? Chắc chắn đứa trẻ phải xuất hiện rồi chứ?\n\nChắc hẳn có điều gì đó sai, vì ta không cảm nhận được tia sống nào trong mình."
  pregnancy.2101.a:0 "Ta không còn mang thai nữa."

  pregnancy.2102.desc:0 "\"Đứa trẻ không được định ra để tồn tại.\"\n\n[mother.Custom2('MyCharacterIntroduction', ROOT.Char)|U] trấn an rằng đó là quy luật đời sống, nhưng tay [mother.GetHerHis] vẫn đặt trên bụng [mother.GetHerHis]."
  pregnancy.2102.a:0 "[mother.GetSheHe|U] không còn mang thai."

  pregnancy.3001.t:0 "Những Lỗi Lầm"
  pregnancy.3001.opening:0 "Khi bụng [mother.GetTitledFirstNamePossessive] lớn lên, không còn nghi ngờ gì nữa. [mother.GetSheHe|U] đang mang thai!"
  pregnancy.3001.lovers_love:0 "[mother.GetSheHe|U] không nói gì, nhưng liệu đây có phải kết quả từ tình yêu của chúng ta?"
  pregnancy.3001.lovers_not_love:0 "[mother.GetSheHe|U] không nói gì, nhưng liệu đây có phải kết quả từ quan hệ xác thịt của chúng ta?"
  pregnancy.3001.not_lovers:0 "[mother.GetSheHe|U] không nói gì, nhưng liệu đây có phải kết quả từ cuộc lãng mạn gần đây của chúng ta?"
  pregnancy.3001.a:0 "Ta phải tự hỏi [mother.GetHerHim] về chuyện này."
  pregnancy.3001.a.tt:1 "Ngài đối chất với [mother.GetFirstNameNoTooltip] về đứa trẻ"
  pregnancy.3001.b:0 "Có thể ta sẽ không bao giờ biết, nhưng ta sẽ luôn tự hỏi..."
  pregnancy.3001.b.tt:0 "Ngài không hành động theo nghi ngờ của mình"

  pregnancy.3002.t:0 "Những Lỗi Lầm"
  pregnancy.3002.lovers:1 "Tất nhiên ta đã nghi ngờ khi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('mother'))] của ta, [mother.GetTitledFirstName], bắt đầu có dấu hiệu mang thai, và giờ [mother.GetSheHe] đã cho biết đó là con của ta."
  pregnancy.3002.not_lovers:1 "[mother.GetTitledFirstName] đang mang thai, và [mother.GetSheHe] đã bí mật cho biết đây là kết quả của mối quan hệ lén lút của chúng ta."
  pregnancy.3002.spouse_exists:0 "\n\nMay thay, [mother.GetHerHis] [mother.Custom2('RelationToMe', SCOPE.sC('spouse'))], [spouse.GetTitledFirstName] nghĩ rằng đó là con của [spouse.GetHersHis]."
  pregnancy.3002.a:0 "Ôi [mother.GetFirstNameNoTooltip], giá như chỉ có chúng ta và đứa trẻ của chúng ta..."
  pregnancy.3002.b.not_again:0 "Làm sao để chuyện này xảy ra lần nữa chứ?!"
  pregnancy.3002.b:0 "Chuyện này phải giữ bí mật!"
  pregnancy.3002.a.tt:0 "Con của [mother.GetShortUINamePossessiveNoTooltip] sẽ sinh ra mà không rõ cha"
  pregnancy.3002.c:0 "Ta sẽ để sự thật được biết!"


  pregnancy.3003.t:0 "Bụng Phình Lên"
  pregnancy.3003.desc:1 "[mother.GetTitledFirstName] đã đến gặp ta, và ta lập tức hiểu lý do. [mother.GetSheHe|U] đang mang thai, và trong lòng [mother.GetHerHis] cũng ít nghi ngờ như trong lòng ta, về người cha là ai. Một đứa trẻ sinh ngoài hôn nhân sẽ mang số phận làm con rơi. Có phải đây là định mệnh ta muốn cho con mình?"
  pregnancy.3003.desc_no_bastards:0 "[mother.GetTitledFirstName] đã đến gặp ta, và ta lập tức hiểu lý do. [mother.GetSheHe|U] đang mang thai, và trong lòng [mother.GetHerHis] cũng ít nghi ngờ như trong lòng ta, về người cha là ai. Cuộc sống nào đang chờ đợi con ta, sinh ra ngoài ràng buộc hôn nhân?"
  pregnancy.3003.a:0 "Chuyện này phải giữ bí mật!"
  pregnancy.3003.a.tt:0 "Bí mật vẫn được giấu, ít nhất bây giờ"
  pregnancy.3003.b:0 "Ôi, đây là tin vui!"

  pregnancy.3004.t:0 "Bụng Phình Lên"
  pregnancy.3004.desc:1 "[mother.GetTitledFirstName] đã đến gặp ta, và ta lập tức hiểu lý do. [mother.GetSheHe|U] đang mang thai, và trong lòng [mother.GetHerHis] cũng ít nghi ngờ như trong lòng ta, về người cha là ai.\n\nTuy nhiên, với hôn nhân của ta với [spouse.GetFirstName], ta không còn cách nào ngoài việc hy vọng rằng việc này sẽ được giữ bí mật."
  pregnancy.3004.a:0 "Ta không bao giờ nghĩ nó sẽ đến mức này."

  pregnancy.5001.t:0 "\"Ta Phải Biết!\""
  pregnancy.5001.desc:0 "[real_father_inquirer.GetTitledFirstName] đã tìm đến ta. Khi đặt tay lên bụng ta, [real_father_inquirer.GetSheHe] nhìn ta với vẻ lo lắng."
  pregnancy.5001.real_father:0 "\n\n\"Ta chỉ muốn nghe ngươi nói, ta đã biết nó là con của ta.\""
  pregnancy.5001.not_father:0 "\n\n\"Xin hãy thành thật với ta.\"\n\nMắt ta dõi theo hành lang phía sau [real_father.GetHerHim], lo sợ rằng ai đó sẽ nhìn thấy chúng ta."
  pregnancy.5001.a:0 "Đứa trẻ là của ngươi, [real_father.GetFirstNameNoTooltip]."
  pregnancy.5001.b:0 "Ngươi không phải cha của đứa trẻ của ta."

  pregnancy.5002.t:0 "Máu Mủ Chúng Ta"
  pregnancy.5002.love:0 "\"Tất nhiên là của ngươi, [ROOT.Char.GetFirstNameNoTooltip]!\"\n\nTa thậm chí quên lo lắng nếu ai đó nghe thấy chúng ta. Niềm vui và bối rối tràn ngập cơ thể ta. Như thể mọi lời cầu nguyện đã được đáp, sự gắn kết của chúng ta được ban phước, dù có… rắc rối."
  pregnancy.5002.not_love:0 "\"Tất nhiên là của ngươi, [ROOT.Char.GetFirstNameNoTooltip]!\"\n\nTa lo rằng ai đó có thể đã nghe [mother.GetHerHim], nhưng chúng ta vẫn ở một mình với sự im lặng. Thật tốt, vì ta bỗng dưng có nhiều điều phải nghĩ."
  pregnancy.5002.a:0 "Chỉ có chúng ta… Một đứa trẻ…"
  pregnancy.5002.b:0 "Đây là tin vui, phải được chia sẻ!"

  pregnancy.5003.t:0 "Ý Nghĩa Sai Lầm"
  pregnancy.5003.desc:1 "Dù ta liên tục nhấn mạnh vấn đề, [mother.GetTitledFirstName] vẫn kiên quyết. \"Đứa trẻ không phải của ngươi, [ROOT.Char.GetFirstNameNoTooltip].\"\n\nLiệu ta thật sự sai sao?"
  pregnancy.5003.a:1 "Liệu [mother.GetSheHe] đang nói thật với ta?"
  pregnancy.5003.a.tt:0 "\"Chỉ thời gian mới trả lời liệu ta đúng hay sai…\""

  pregnancy_announcement_my_child_will_be_a_bastard:0 "Con của ta sẽ sinh ra là một [bastard|E] với [real_father.GetTitledFirstNameNoTooltip] làm cha"
  pregnancy_announcement_the_child_will_be_a_bastard_real_father:0 "Con của [mother.GetTitledFirstNamePossessiveNoTooltip] sẽ sinh ra là một [bastard|E], với ta làm cha biết rõ"
  pregnancy_announcement_the_child_will_be_a_bastard:0 "Con của [mother.GetTitledFirstNamePossessiveNoTooltip] sẽ sinh ra là một [bastard|E] với [real_father.GetTitledFirstNameNoTooltip] làm cha"

  pregnancy.6001.t:0 "Không Còn Nghi Ngờ"
  pregnancy.6001.desc:0 "Đứa trẻ ta đang mang có thể là con rơi, nhưng sẽ lớn lên biết ai là cha, bất kể [real_father.GetTitledFirstName] [real_father.GetHerselfHimself] muốn gì."
  pregnancy.6001.a:0 "Ta sẽ luôn làm điều tốt nhất cho con."

  pregnancy.6002.t:0 "Không Còn Nghi Ngờ"
  pregnancy.6002.desc:1 "[mother.GetTitledFirstName] đã công khai gọi ta là cha của đứa trẻ chưa sinh của [mother.GetHerHis]!"
  pregnancy.6002.married:0 "\n\n\"Ngươi làm sao có thể làm điều này?!\" [spouse.GetFirstName] nhìn ta với [spouse.Custom('GeneralTemperament')]."
  pregnancy.6002.unmarried_sympathetic:1 "\n\nSinh ra ngoài hôn nhân, đứa trẻ sẽ có cuộc sống khó khăn, nhưng ít ra sẽ biết sự thật."
  pregnancy.6002.unmarried_unsympathetic:1 "\n\nViệc [mother.GetSheHe] phải gánh chịu gánh nặng này đã không đủ sao, [mother.GetSheHe] còn phải lôi kéo ta xuống cùng với [mother.GetHerHis] nữa ư?"
  pregnancy.6002.a:0 "Mọi người sẽ nói gì?"

  pregnancy.6003.t:0 "Không Còn Nghi Ngờ"
  pregnancy.6003.desc:1 "[mother.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))] của ta, đã thú nhận rằng không chỉ việc mang thai của [mother.GetHerHis] là kết quả của một cuộc hôn phối bất hợp pháp, mà cha thực sự của đứa con chưa chào đời của [mother.GetHerHis] không ai khác chính là [real_father.GetTitledFirstName]!\n\nThật nhục nhã thay cho gia đình ta! Làm sao [mother.GetSheHe] có thể làm điều này với ta? Với chúng ta?"
  pregnancy.6003.a:0 "[real_father.GetFirstNameNoTooltip]?!"

  pregnancy.6004.t:0 "Không Còn Nghi Ngờ"
  pregnancy.6004.desc:1 "[mother.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))] của ta, đã để lộ rằng đứa con chưa chào đời của [mother.GetHerHis] không chỉ là sản phẩm của một cuộc hôn phối bất chính, mà cha của nó không ai khác chính là [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)]!"
  pregnancy.6004.incest:0 "\n\nĐứa trẻ được sinh ra từ mối quan hệ bất chính sẽ ra sao?"
  pregnancy.6004.mother_married:1 "\n\nĐiều này sẽ ảnh hưởng thế nào đến hôn nhân của [mother.GetHerHis] với [spouse.GetTitledFirstName]?"
  pregnancy.6004.mother_unmarried:1 "\n\nĐiều gì sẽ xảy ra với đứa trẻ của [mother.GetHerHis], giờ khi cả thế giới đều biết?"
  pregnancy.6004.a:1 "[mother.GetSheHe|U] đã làm đảo lộn gia đình này!"

  pregnancy.6005.t:0 "Không Còn Nghi Ngờ"
  pregnancy.6005.desc:0 "[mother.GetTitledFirstName] đã cho cả thế giới biết ai là cha của đứa con bất hợp pháp của [mother.GetHerHis]. Ta đã muốn hy vọng rằng không phải vậy, nhưng tất nhiên ta biết điều đó là sự thật. [real_father.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))] của ta, chính là cha thực sự của đứa trẻ trong bụng [mother.GetHerHis]!"
  pregnancy.6005.a:0 "[real_father.GetFirstNameNoTooltip], sao ngươi có thể làm vậy?"

  pregnancy.6006.t:0 "Không Còn Nghi Ngờ"
  pregnancy.6006.desc:1 "[real_father.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã được xác nhận là cha thật sự của đứa trẻ chưa sinh của [mother.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
  pregnancy.6006.real_father_married:1 "\n\n[real_father.GetSheHe] không nghĩ gì đến tầm quan trọng của cuộc hôn nhân của [real_father.GetHerHis] với [spouse.Custom2('HerHisCharacterIntroduction', SCOPE.sC('real_father'))] sao?"
  pregnancy.6006.real_father_unmarried:1 "Liệu [real_father.GetSheHe] có quan tâm gì đến danh dự của gia đình [real_father.GetHerHis] không?"
  pregnancy.6006.a:0 "Đứa trẻ rơi này sẽ có ý nghĩa gì đối với chúng ta?"
 
 # For polyamorous faith reveal
  pregnancy.6999.t:0 "Với Người Khác"
  pregnancy.6999.desc:1 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))] của ta, [mother.GetTitledFirstName], đã để mọi người biết rằng [mother.GetSheHe] đang mang thai đứa con của [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\nDù đứa trẻ không phải của ta, ta vẫn là [mother.GetHerHis] [ROOT.Char.Custom('WifeHusband')], và ta có bổn phận chăm sóc [mother.GetHerHim] trong những tháng tới."
  pregnancy.6999.a:1 "Bổn phận ta sẽ thực hiện."
