l_english:
  vassal_interaction.0001.opening:0 "[actor.Custom2('GreetingToVassal', ROOT.Char)]"
  vassal_interaction.0001.desc:0 "Ta yêu cầu ngươi chấm dứt ngay cuộc chiến chống lại [defender.GetTitledFirstName] của [defender.GetPrimaryTitle.GetName]!\n\nVương quốc tồn tại khi chúng ta đoàn kết, không phải khi chia rẽ."
  vassal_interaction.0001.a:0 "Nguyện vọng của ngài là mệnh lệnh của Ta, Thượng Hoàng."
  vassal_interaction.0001.b:0 "Đây là vấn đề danh dự, không thể từ bỏ một cách dễ dàng."
  vassal_interaction.0001.request_favor_tt:0 "Ta yêu cầu một [favor|E] để đổi lại"
  vassal_interaction.0001.request_gold_tt:0 "Ta yêu cầu vàng để đổi lại"
  vassal_interaction.0001.accept:0 "[actor.GetFirstNameNoTooltip] chấp nhận yêu cầu của Ta"
  vassal_interaction.0001.decline:0 "[actor.GetFirstNameNoTooltip] từ chối"
  vassal_interaction.0001.c:0 "Ta đã đầu tư quá nhiều vào cuộc chiến này..."
  vassal_interaction.0001.d:0 "Không, ta sẽ theo đến cùng!"
  vassal_interaction.0001.e:0 "Không. Và ngươi không thể ngăn ta!"

  vassal_interaction.0002.opening:0 "[recipient.Custom2('GreetingToLiege', ROOT.Char)]"
  vassal_interaction.0002.desc:0 "Tất nhiên, ta sẽ tuân theo trí tuệ và mong muốn của ngài. Dù lý do của ta là chính đáng, ta sẽ tạm nhường nó, vì lợi ích của vương quốc."
  vassal_interaction.0002.a:0 "Một thần dân ngoan ngoãn là một thần dân tốt."

  vassal_interaction.0003.desc:0 "Ta đã đến quá gần mục tiêu để từ bỏ không vì lý do gì. Ta sẽ nhượng bộ nếu ngươi hứa bồi thường trong tương lai."
  vassal_interaction.0003.a:0 "Ngươi có lời hứa của ta."
  vassal_interaction.0003.b:0 "Ngươi nên làm theo lời ta, bất kể thế nào!"
  vassal_interaction.0003.b.tt:0 "Cuộc chiến tiếp tục"

  vassal_interaction.0004.desc:0 "Cuộc chiến này đã quá tốn kém để ta bỏ cuộc ngay bây giờ. Tuy nhiên, một khoản đóng góp nhỏ vào kho bạc của ta có thể thuyết phục ta làm khác."
  vassal_interaction.0004.a:0 "Bồi thường là điều công bằng."
  vassal_interaction.0004.b:0 "Đây là một khoản tiền quá phi lý!"

  vassal_interaction.0005.opening:0 "[recipient.Custom2('GreetingToLiege', ROOT.Char)]"
  vassal_interaction.0005.desc:0 "Ta rất tôn trọng ý muốn của ngài, nhưng mọi việc đã định. Ta sẽ theo đến cùng cuộc chiến này."
  vassal_interaction.0005.a:0 "Ngươi dám chống lệnh ta!"
  vassal_interaction.0005.b:0 "Ta sẽ phải chấp nhận. Lần này thôi."

  vassal_interaction.0006.desc:0 "Lý do của ngươi là chính đáng, và sẽ không công bằng nếu đòi hỏi mà không có sự bồi thường."
  vassal_interaction.0006.favor:0 "Ta sẽ mang ơn ngươi vì điều này."
  vassal_interaction.0006.gold:0 "Ta sẽ trả vàng đã mất, miễn là cuộc chiến chấm dứt ngay."
  vassal_interaction.0006.a:0 "Cảm ơn sự khoan hồng của ngươi."
  vassal_interaction.0006.b:0 "Cảm ơn sự hào phóng của ngươi."

  vassal_interaction.0007.desc:0 "Ta tức giận vì ngươi yêu cầu hối lộ để làm theo lệnh Thượng Hoàng! Ngươi đã gửi đến ta một sự từ chối không danh dự!"
  vassal_interaction.0007.a:0 "Rất tốt. Ta còn phải trở lại cuộc chiến."


  vassal_interaction.0011.desc:0 "Yêu sách của [attacker.GetTitledFirstNamePossessive] là chính đáng. Ta yêu cầu ngươi đầu hàng [attacker.GetHerHim] ngay lập tức, để khôi phục trật tự trong vương quốc."
  vassal_interaction.0011.a:0 "Nếu đó là lẽ phải, Thượng Hoàng."
  vassal_interaction.0011.b:0 "Xin đừng yêu cầu ta từ bỏ danh dự vô cớ."
  vassal_interaction.0011.c:0 "Đó là một sự hy sinh quá đắt mà ngươi đòi hỏi..."
  vassal_interaction.0011.d:0 "Không, ta sẽ chống lại [attacker.GetHerHim]!"

  vassal_interaction.0012.desc:0 "Ta van ngươi hãy xem xét những gì ngươi đã yêu cầu, nhưng nếu đó là ý muốn của ngài, ta sẽ đầu hàng [attacker.GetTitledFirstName]. Vì lợi ích của vương quốc."
  vassal_interaction.0012.a:0 "Phần thưởng cho lòng trung thành luôn đến vào thời điểm thích hợp."

  vassal_interaction.0013.desc:0 "Ta sẽ mất nhiều nếu từ bỏ cuộc chiến với [attacker.GetTitledFirstName]. Ta chỉ nhượng bộ nếu ngươi hứa bồi thường trong tương lai."

  vassal_interaction.0014.desc:0 "Đầu hàng trong cuộc chiến sẽ là một tổn thất quá lớn. Tuy nhiên, nếu ngươi bồi thường cho ta, ta có thể làm theo yêu cầu."

  vassal_interaction.0015.desc:0 "Ta sẽ mất quá nhiều nếu đầu hàng. Ta không muốn chống lệnh, nhưng [attacker.GetTitledFirstName] đã ép buộc ta."

  vassal_interaction.0016.gold:0 "Ta sẽ trả cho ngươi khoản tổn thất, miễn là chiến đấu chấm dứt ngay."
  vassal_interaction.0016.a:0 "Ít nhất ta chưa mất tất cả."
  vassal_interaction.0016.b:0 "Ta sẽ dùng khoản này để khôi phục."

  vassal_interaction.you_owe_me:0 "Ngươi sẽ làm theo lời ta!"

  vassal_interaction.war_ender_gives_up:1 "[recipient.GetShortUIName|U] đã từ bỏ cuộc chiến, theo lệnh của [actor.GetShortUINamePossessive]"

  vassal_interaction.0022.desc:0 "Ta viết để thông báo rằng ta đã ban cho đồng hầu vương của ngươi, [recipient.GetName], sự độc lập của [recipient.GetHerHis]."
  vassal_interaction.0022.a:0 "Rất tốt."

  vassal_interaction.0023.desc:0 "Ta viết để thông báo rằng ta đã ban cho hầu vương của ta, [recipient.GetName], sự độc lập của [recipient.GetHerHis]."
  vassal_interaction.0023.a:0 "Rất tốt."

  vassal_interaction.0030.desc:0 "Yêu cầu của ngươi là chính đáng, và ta thấy mình bị thuyết phục bởi lập luận của ngươi.\n\nTa chính thức ân xá cho ngươi mọi tội lỗi hiện tại trước mắt [recipient.GetPrimaryTitle.GetNameNoTooltip], vĩnh viễn. Ngươi vẫn là một [actor.GetWomanMan] tự do!"
  vassal_interaction.0030.a:0 "Cuối cùng cũng an toàn!"
 
  vassal_interaction.0040.desc:0 "Trong khi ngài nắm giữ [target.GetBaseName], mọi người đều thấy rõ ràng rằng chính #EMP ta#! mới là người cai trị nó. Các [county_in_title.Custom('TerrainTypeProvince')] và làng mạc của nó đều được giám sát bởi các thừa hành của #EMP ta#! và các quan tòa của #EMP ta#!.\n\nVì vậy, ta đang đặt yêu sách cho nó. Ngài có thể ban tước hiệu cho ta bất cứ khi nào ngài muốn, nếu không, ta chắc chắn rằng nó sẽ thuộc về ta vào đúng thời điểm.\n\nBằng cách này hay cách khác."
  vassal_interaction.0040.a:0 "Ta đã để [actor.GetFirstNameNoTooltip] mạnh quá..."
