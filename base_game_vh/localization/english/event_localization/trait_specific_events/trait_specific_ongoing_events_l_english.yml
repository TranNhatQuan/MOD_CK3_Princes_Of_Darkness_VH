l_english:
  trait_specific_ongoing.1001.t:0 "Những Khám Phá Kinh Hoàng"
  trait_specific_ongoing.1001.desc:0 "Ta vỗ tay lên khung giường để chắc chắn. Nhìn xuống, Ta thấy một vết nứt chạy dọc – nỗi sợ hãi của Ta đã trở thành hiện thực! Ta được làm bằng thủy tinh!\n\nTa sẽ phải di chuyển nhẹ nhàng và chậm rãi, không động tác mạnh, không hát cao vút..."
  trait_specific_ongoing.1001.a:0 "Đừng ai chạm vào Ta!"

  trait_specific_ongoing.1003.t:0 "Hãy Nhẫn Nại Với Ta"
  trait_specific_ongoing.1003.desc:0 "Ta bước vào [ROOT.Char.Custom('GetChamber')] và thấy mình đứng đối diện với một con gấu khổng lồ.\n\n\"Ôi, bé cưng! Cậu bỏ Bạn Bè rồi sao?\" Ta hỏi, dỗ dành nó đi theo.\n\nKhi chúng Ta bước ra ngoài, một loạt âm thanh vang lên — tất cả động vật mà Ta có thể tìm được chào đón Ta đồng loạt!"
  trait_specific_ongoing.1003.a:0 "Những đứa ngọt ngào của Ta! Ta sẽ tìm thêm Ngài cho các cậu!"
  trait_specific_ongoing.1003.a.flavor:0 "Khi chúng Ta ra ngoài, bé cưng đuổi theo Ta"
  trait_specific_ongoing.1003.b:0 "Ta... Ta nên bán chúng chứ?"

  trait_specific_ongoing.1004.t:0 "Một Bó Niềm Vui Nhỏ"
  trait_specific_ongoing.1004.desc:0 "Theo lệnh của Ta, tất cả các động vật bước vào [court_location.Custom('BaronyTownType')] của [court_location.GetNameNoTier] đều được mang đến cho Ta.\n\n"
  trait_specific_ongoing.1004.desc_cat:0 "Các Bạn Bè mang đến cho Ta con thú bắt được trong một giỏ nhỏ. Đôi mắt [ROOT.Char.Custom('RandomCatEyeColor')] của một chú mèo con nhìn ra khỏi rìa giỏ, và một tiếng meo nhỏ phát ra từ bên trong."
  trait_specific_ongoing.1004.desc_dog:0 "Các Bạn Bè mang đến cho Ta con thú bắt được trong một giỏ nhỏ. Nhìn vào bên trong, Ta thấy một chú chó con sủa khi thấy Ta và vẫy đuôi!"
  trait_specific_ongoing.1004.a:0 "Con mèo này là của Ta bây giờ!"
  trait_specific_ongoing.1004.b:0 "Con chó này là của Ta bây giờ!"
  trait_specific_ongoing.1004.c_cat:0 "Một con mèo! Bán nó cho bếp."
  trait_specific_ongoing.1004.c_dog:0 "Một con chó! Bán nó cho chuồng."

  trait_specific_ongoing.1005.t:0 "Người Quá Cố [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_person'))|U]"
  trait_specific_ongoing.1005.desc:0 "Khi ta đang dạo bước ngoài trời trong một đêm đầy sương mù, một ảo ảnh bất ngờ hiện ra, và cất tiếng nói vang vọng như sấm truyền.\n\n"[ROOT.Char.GetFirstNameNoTooltip]! Đã lâu quá rồi không gặp!"\n\nĐó chính là [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('dead_person') )] của ta, [dead_person.GetTitledFirstName], người mà ta cứ ngỡ là đã [dead_person.GetDeathReason]!"
  trait_specific_ongoing.1005.a:0 "May mà cậu chưa chết!"

  trait_specific_ongoing.1006.desc:0 "Suốt một năm qua, ta liên tục nhận được những chuyến viếng thăm thường xuyên của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('dead_person') )] của ta là [dead_person.GetTitledFirstName], ngày qua ngày. [dead_person.GetSheHe|U] khăng khăng đòi không một ai khác được phép nhìn thấy [dead_person.GetHerHim], nhưng mọi người đã bắt đầu lo ngại rồi...\n\nLàm sao ta có thể tập trung vào [ROOT.Char.Custom('child_object_of_interest')] của mình khi [dead_person.GetSheHe] cứ hành xử như thế này cơ chứ?!"
  trait_specific_ongoing.1006.a:0 "Để Ta yên!"

  trait_specific_ongoing.1007.t:0 "Giấc Mơ Thủy Tinh"
  trait_specific_ongoing.1007.desc:0 "Ta bò dậy sau một giấc ngủ sâu đến mức gần như mất chính mình.\n\nTa mơ thấy những tấm kính lớn đưa Ta gần hơn tới mặt trời trong cơn lốc các vì sao. Vươn tay hết cỡ, Ta nắm được thiên thể và rực lửa của nó — kéo cho đến khi nó đổ xuống đất. Ôm nó, Ta cảm nhận sự thanh thản và ấm áp chưa từng trải qua!"
  trait_specific_ongoing.1007.a:0 "Tuyệt vời quá, thật hùng vĩ!"
  trait_specific_ongoing.1007.a.tt:0 "Ta có thể quyết định xây dựng một #bold Tượng Thủy Tinh#!"

  trait_specific_ongoing.1008.t:0 "Mất Thực Tại"
  trait_specific_ongoing.1008.desc:0 "Ta đang ở bên Ngài [friend.GetTitledFirstName] khi mọi thứ đột nhiên bắt đầu xoay tròn...\n\nXám thép, đỏ thẫm, gương mặt la hét, biển đỏ thẫm...\n\nTa quỳ xuống bên cơ thể [friend.GetHerHis], dao dính máu trên tay."
  trait_specific_ongoing.1008.a:0 "[friend.GetFirstNameNoTooltip]! Ôi không... Ta phải giấu xác."
  trait_specific_ongoing.1008.b:0 "Ta phải thú nhận!"

  trait_specific_ongoing.1009.t:0 "Không Thể Bị Thương Tích"
  trait_specific_ongoing.1009.desc:0 "\"Đừng sợ!\" Ta hét từ trên mái nhà để trấn an mọi người phía dưới. \"Ta không thể bị hại!\"\n\nTa nhảy duyên dáng từ mép tòa nhà và cười khi bụng rạo rực vì cú rơi."
  trait_specific_ongoing.1009.a:0 "HAHAHA – AAAAAH!"
  trait_specific_ongoing.1009.a.success:0 "Ta tiếp đất hoàn hảo"
  trait_specific_ongoing.1009.a.failure:0 "Ta không vô địch như Ta tưởng"

  trait_specific_ongoing.1010.t:0 "Ngựa Của Ta [ROOT.Char.Custom('WarhorseStoryName')]"
  trait_specific_ongoing.1010.desc:0 "Chiến mã tuyệt đẹp [ROOT.Char.Custom('WarhorseStoryName')] của Ta mang Ta dễ dàng trước toàn bộ [ROOT.Char.Custom('GetCourt')] tập hợp.\n\n\"Con ngựa này hoàn hảo! Mỗi người trong các ngươi sẽ dành ít nhất một giờ mỗi ngày chăm sóc [ROOT.Char.Custom('HorseStoryHerHim')], từ huấn luyện đến chăm sóc. [ROOT.Char.Custom('HorseStorySheHe')|U] quý giá hơn bất kỳ ai khác đối với ta. Giải tán!\""
  trait_specific_ongoing.1010.a:0 "Tất cả phải cúi chào [ROOT.Char.Custom('HorseStoryHerHim')]!"

  trait_specific_ongoing.1011.t:0 "Sáng Tạo Luật"
  trait_specific_ongoing.1011.desc:0 "Khi Ta chủ trì triều đình, Ta liên tục bị phân tâm bởi trang phục lộng lẫy của mọi người. Vải xa hoa, đồ trang sức – chà!\n\nTại sao họ phải làm thế? Chẳng phải họ biết Ta nhìn thấu tâm can sao? Sẽ dễ hơn nếu ai đó có thể... cấm mặc quần áo.\n\n...Đợi đã."
  trait_specific_ongoing.1011.a:0 "Trang phục bị cấm. Cởi hết đi!"
  all_adult_courtiers:0 "Tất cả quan viên trưởng thành"

  trait_specific_ongoing.1012.t:0 "Những Tầm Nhìn Bóng Tối"
  trait_specific_ongoing.1012.desc:0 "Ta không nhớ chuyện này xảy ra, nhưng khi trở lại [ROOT.Char.Custom('ResidenceBuilding')], [ROOT.Char.Custom('GetCourtierPlural')] kể lại mọi chuyện.\n\nTa đã chạy loanh quanh, cảnh báo mọi người về đàn dơi đang đến. Chúng nhiều đến mức che khuất mặt trời và đem [capital.GetNameNoTier] đến một nơi kinh khủng mà [ROOT.Char.GetFaith.PositiveAfterLife] không thể tới được."
  trait_specific_ongoing.1012.a:0 "Chuyện gì đang xảy ra với Ta..."
  trait_specific_ongoing.1012.b:0 "Ôi, Ta sẽ chuẩn bị khi chúng đến!"

 ### DIVINE OR WITCHY VISIONS? ###
  trait_specific_ongoing.2001.t:0 "Một Thông Điệp Từ Cõi Trên"
  trait_specific_ongoing.2001.start.desc:0 "Ta biết họ sắp đến ngay trước khi nhìn thấy họ. Một luồng"
  trait_specific_ongoing.2001.dread.desc:0 "sợ hãi,"
  trait_specific_ongoing.2001.anxiety.desc:0 "lo lắng,"
  trait_specific_ongoing.2001.euphoria.desc:0 "phấn khích,"
  trait_specific_ongoing.2001.joy.desc:0 "vui sướng,"
  trait_specific_ongoing.2001.nausea.desc:0 "buồn nôn,"
  trait_specific_ongoing.2001.walls.desc:0 "[ROOT.Char.Custom('GetChamber')] của Ta đang ép sát,"
  trait_specific_ongoing.2001.sulfur.desc:0 "mùi lưu huỳnh hắc"
  trait_specific_ongoing.2001.smoke.desc:0 "mùi khói khét"
  trait_specific_ongoing.2001.citrus.desc:0 "vị chua sắc của cam chanh trên lưỡi Ta"
  trait_specific_ongoing.2001.lavender.desc:0 "mùi oải hương tươi mới"
  trait_specific_ongoing.2001.bile.desc:0 "mùi mật đắng"
  trait_specific_ongoing.2001.incense.desc:0 "mùi nhang ngọt ngấy"
  trait_specific_ongoing.2001.blood.desc:0 "mùi kim loại của máu"
  trait_specific_ongoing.2001.stand_before_me.desc:0 "- và rồi họ đứng trước mặt Ta.\n\n[ROOT.Char.Custom('one_syllable_number')|U]"
  trait_specific_ongoing.2001.glowing.desc:0 "những sinh thể phát sáng,"
  trait_specific_ongoing.2001.hazy.desc:0 "bóng mờ ảo,"
  trait_specific_ongoing.2001.dark.desc:0 "những sinh thể tối tăm,"
  trait_specific_ongoing.2001.shaking.desc:0 "những sinh thể rung rinh,"
  trait_specific_ongoing.2001.shimmering.desc:0 "những sinh thể lấp lánh,"
  trait_specific_ongoing.2001.speaking.desc:0 "nói theo giọng đồng ca của"
  trait_specific_ongoing.2001.whispers.desc:0 "những thì thầm."
  trait_specific_ongoing.2001.screeches.desc:0 "tiếng thét chói tai."
  trait_specific_ongoing.2001.chimes.desc:0 "tiếng chuông ngân vang."
  trait_specific_ongoing.2001.raindrops.desc:0 "tiếng mưa rơi."
  trait_specific_ongoing.2001.thunder.desc:0 "tiếng sấm."
  trait_specific_ongoing.2001.end.desc:0 "Họ là những sinh vật gì, và họ muốn gì từ Ta?"
  trait_specific_ongoing.2001.a:0 "Họ chắc chắn là sứ giả của [ROOT.Char.GetFaith.HighGodName]!"
  trait_specific_ongoing.2001.a.success:0 "Ngài thuyết phục [clergy.GetCouncilTitle] [clergy.GetShortUIName] rằng tầm nhìn của Ngài là thiêng liêng"
  trait_specific_ongoing.2001.a.failure:0 "[clergy.GetCouncilTitle|U] [clergy.GetShortUIName] bị bối rối trước câu chuyện của Ngài"
  trait_specific_ongoing.2001.b:0 "Đây là một quyền năng khác, sâu xa hơn, và Ta #EMP muốn#! nó."
  trait_specific_ongoing.2001.c:0 "Ta... Ta chỉ mệt mỏi. Ta cần chăm sóc bản thân tốt hơn."

  trait_specific_ongoing.2001.b.success:0 "Ngài tìm thấy tri thức bí mật"
  trait_specific_ongoing.2001.b.success.tt:0 "Ngài được lựa chọn tiếp nhận chân lý mới, hoặc trung thành với [clergy.GetFaith.HighGodName]"
  trait_specific_ongoing.2001.b.failure:0 "Ngài tìm thấy vài quyển sách thú vị, nhưng bình thường"

  trait_specific_ongoing.2002.desc:0 "Cuộc tìm kiếm tri thức mà các Sứ Giả hứa hẹn đã đưa Ta đến những nơi kỳ lạ. Ngõ hẻm tối, quán rượu tồi tàn, hiệu sách bụi bặm — Ta đi đến nơi chưa từng [ROOT.Char.GetTitleAsNameNoTooltip] nào đặt chân, và phần thưởng của Ta thật tuyệt vời.\n\nTa đã khám phá nhiều quyển sách về [ROOT.Char.GetFaith.WitchGodName] và quyền năng mà [ROOT.Char.GetFaith.WitchGodSheHe] ban cho những người theo [ROOT.Char.GetFaith.WitchGodHerHis]. Ta bị cám dỗ, điều mà Ta không thể chối từ."
  trait_specific_ongoing.2002.a:0 "Hắc [ROOT.Char.GetFaith.WitchGodMistressMaster], Ta là Ta tớ khiêm tốn của Ngài!"
  trait_specific_ongoing.2002.b:0 "Ta vượt quá khả năng của mình. Điều này quá nguy hiểm."

  trait_specific_ongoing.2003.desc:0 "Ta đã tìm thấy nhiều quyển sách thú vị trong cuộc tìm kiếm tri thức ẩn giấu, nhưng không có gì thực sự đặc biệt.\n\nTa sợ rằng Ta có thể đã hiểu sai ý muốn của những sinh vật kỳ lạ đó — hoặc tưởng tượng ra toàn bộ chuyện!"
  trait_specific_ongoing.2003.a:0 "Tâm trí Ta đang chơi khăm Ta sao?"

 ### WHICH GOD/SAINT IS SPEAKING TO ME? ###
  trait_specific_ongoing.2010.t:0 "Tập Trung Thần Thánh"
  trait_specific_ongoing.2010.possessed_start.desc:0 "Ta thường xuyên nhận được những thông điệp từ ba thực thể thiêng liêng. Họ đến với Ta gần như mỗi đêm, gương mặt họ tỏa sáng ánh sáng thần thánh. Ta nghĩ họ hẳn là linh hồn của"
  trait_specific_ongoing.2010.zeal_start.desc:0 "Kể từ khoảng một tháng trước, Ta đã có một giấc mơ lặp lại, trong đó Ta bàn luận về thần học với"
  trait_specific_ongoing.2010.health.desc:0 "[ROOT.Char.GetFaith.HealthGodName],"
  trait_specific_ongoing.2010.fertility.desc:0 "[ROOT.Char.GetFaith.FertilityGodName],"
  trait_specific_ongoing.2010.wealth.desc:0 "[ROOT.Char.GetFaith.WealthGodName],"
  trait_specific_ongoing.2010.household.desc:0 "[ROOT.Char.GetFaith.HouseholdGodName],"
  trait_specific_ongoing.2010.knowledge.desc:0 "[ROOT.Char.GetFaith.KnowledgeGodName],"
  trait_specific_ongoing.2010.war.desc:0 "[ROOT.Char.GetFaith.WarGodName],"
  trait_specific_ongoing.2010.trickster.desc:0 "[ROOT.Char.GetFaith.TricksterGodName],"
  trait_specific_ongoing.2010.and_health.desc:0 "và [ROOT.Char.GetFaith.HealthGodName]."
  trait_specific_ongoing.2010.and_fertility.desc:0 "và [ROOT.Char.GetFaith.FertilityGodName]."
  trait_specific_ongoing.2010.and_wealth.desc:0 "và [ROOT.Char.GetFaith.WealthGodName]."
  trait_specific_ongoing.2010.and_household.desc:0 "và [ROOT.Char.GetFaith.HouseholdGodName]."
  trait_specific_ongoing.2010.and_knowledge.desc:0 "và [ROOT.Char.GetFaith.KnowledgeGodName]."
  trait_specific_ongoing.2010.and_war.desc:0 "và [ROOT.Char.GetFaith.WarGodName]."
  trait_specific_ongoing.2010.and_trickster.desc:0 "và [ROOT.Char.GetFaith.TricksterGodName]."
  trait_specific_ongoing.2010.end.desc:0 "\n\nCó lẽ họ đã chọn Ta để truyền lời của họ, và ban phước cho Ta? Ta sẽ cầu nguyện với..."
  trait_specific_ongoing.2010.health:0 "[ROOT.Char.GetFaith.HealthGodName] cho sức khỏe và trường thọ."
  trait_specific_ongoing.2010.fertility:0 "[ROOT.Char.GetFaith.FertilityGodName] cho sự sống mới và sinh sản."
  trait_specific_ongoing.2010.wealth:0 "[ROOT.Char.GetFaith.WealthGodName] cho của cải và sung túc."
  trait_specific_ongoing.2010.household:0 "[ROOT.Char.GetFaith.HouseholdGodName] cho một gia đình hạnh phúc."
  trait_specific_ongoing.2010.household.tt:0 "Tất cả [close_family_members|E] và [spouses|E] của Ngài"
  trait_specific_ongoing.2010.knowledge:0 "[ROOT.Char.GetFaith.KnowledgeGodName] cho tri thức và sự thông thái."
  trait_specific_ongoing.2010.war:0 "[ROOT.Char.GetFaith.WarGodName] cho sức mạnh trong chiến trận."
  trait_specific_ongoing.2010.trickster:0 "[ROOT.Char.GetFaith.TricksterGodName] cho trí khôn và may mắn."
  trait_specific_ongoing.2010.fallback:0 "Ta không dám cho rằng mình được chọn."


 ### COURT CHAPLAIN WANTS TO TREAT YOU ###
  trait_specific_ongoing.2015.t:0 "Bởi [ROOT.Char.GetFaith.HighGodName] Hãy Khỏe Lại"
  trait_specific_ongoing.2015.desc:0 "Những cây cột của [ROOT.Char.GetFaith.HouseOfWorship] bắt đầu đổ nghiêng ngả khi một cơn phát tác khác lại ập đến với ta. Ta không hề phát ra một tiếng động nào, nhưng ta biết [chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)] có thể nhận ra điều gì đó bất thường.\n\nSau khi kết thúc lễ [ROOT.Char.Custom('GetReligiousRite')], [chaplain.GetSheHe] tiến lại gần với vẻ mặt đầy lo âu hiện rõ trên khuôn mặt của [chaplain.GetHerHis]. "Đó hẳn phải là [ROOT.Char.GetFaith.DevilName] cùng lũ tay sai của [ROOT.Char.GetFaith.DevilHerHis] đang chiếm đoạt cơ thể của ngài, thưa [ROOT.Char.Custom('FormOfAddressForLiege')]. Ngài phải hướng lòng về [ROOT.Char.GetFaith.HighGodName] để cầu xin sự cứu rỗi, trước khi quá muộn!""
  trait_specific_ongoing.2015.physician.desc:0 "\n\n[physician.Custom2('MyCharacterIntroduction', ROOT.Char)|U] hẳn đã nghe thấy [chaplain.GetHerHim]. \"Điều [ROOT.Char.GetTitleAsNameNoTooltip] cần là yên tĩnh và bình yên, không phải những lời đe dọa hỏa ngục!\""
  trait_specific_ongoing.2015.a:0 "Ta sẽ cầu nguyện xua tan bóng tối."
  trait_specific_ongoing.2015.a.success:0 "Lời cầu nguyện có hiệu quả"
  trait_specific_ongoing.2015.a.failure:0 "Các cơn co giật vẫn tiếp diễn"
  trait_specific_ongoing.2015.b:0 "Nhịn ăn sẽ thanh tẩy linh hồn Ta."
  trait_specific_ongoing.2015.b.success:0 "Việc nhịn ăn có hiệu quả"
  trait_specific_ongoing.2015.b.failure_health:0 "Việc nhịn ăn khiến Ngài yếu đi"
  trait_specific_ongoing.2015.b.failure_eating:0 "Ngài vật lộn với các quy tắc khắc nghiệt"
  trait_specific_ongoing.2015.b.failure_eating.tt:0 "Thái độ của Ngài với thức ăn sẽ thay đổi"
  trait_specific_ongoing.2015.c:0 "Ngài gợi ý gì, [physician.GetFirstNameNoTooltip]?"
  trait_specific_ongoing.2015.c.success:0 "Phương pháp điều trị của bác sĩ có hiệu quả"
  trait_specific_ongoing.2015.e:0 "Đừng làm phiền Ta!"

  trait_specific_ongoing.2016.physician1.desc:0 "[physician.GetTitledFirstName] bảo Ta nghỉ ngơi nhiều và tránh những vật sáng lấp lánh, tiếng ồn lớn và thời tiết khắc nghiệt."
  trait_specific_ongoing.2016.physician2.desc:0 "\n\n[Lời khuyên của [physician.GetHerHis|U] hẳn đã hiệu quả, vì Ta chưa gặp cơn bộc phát nào kể từ đó!"
  trait_specific_ongoing.2016.fasting1.desc:0 "[chaplain.GetTitledFirstName] bảo Ta chỉ ăn một bữa nhỏ vào buổi tối, và đưa cho Ta danh sách dài những loại thực phẩm phải loại bỏ. Sữa, thịt, trứng, đồ ngọt, rượu, dầu, gia vị hăng, rau củ mọc dưới đất..."
  trait_specific_ongoing.2016.fasting2.desc:0 "\n\nChế độ khó theo, nhưng hẳn đã hiệu quả, vì Ta chưa gặp cơn bộc phát nào kể từ đó!"
  trait_specific_ongoing.2016.prayer1.desc:0 "[chaplain.GetTitledFirstName] bảo Ta dành ít nhất ba giờ mỗi ngày để cầu nguyện tập trung và hướng dẫn Ta tới một chục phần trong [ROOT.Char.GetFaith.ReligiousText] để học thêm."
  trait_specific_ongoing.2016.prayer2.desc:0 "\n\nSự tận tâm của Ta đã được đền đáp, vì Ta chưa gặp cơn bộc phát nào kể từ đó!"
  trait_specific_ongoing.2016.a.physician:0 "Cảm ơn Ngài, [physician.GetFirstNameNoTooltip]!"
  trait_specific_ongoing.2016.a.chaplain:0 "[ROOT.Char.GetFaith.HighGodName] thật hùng mạnh!"

  trait_specific_ongoing.2017.prayer2.desc:0 "\n\nTa đã cố gắng hết sức, nhưng có vẻ như Ta không xứng đáng với lòng thương xót của [ROOT.Char.GetFaith.HighGodNamePossessive]. Các cơn bộc phát vẫn đều đặn như trước."
  trait_specific_ongoing.2017.physician2.desc:0 "\n\nTa đã cố gắng hết sức để theo lời khuyên của [physician.GetHerHis], nhưng các cơn bộc phát vẫn đều đặn như trước."
  trait_specific_ongoing.2017.a:0 "Có lẽ Ta đã làm điều gì sai?"

  trait_specific_ongoing.2018.fasting2.desc:1 "\n\nTa đã cố gắng hết sức để theo chế độ nghiêm ngặt, nhưng chỉ cảm thấy yếu hơn. Các cơn bộc phát vẫn đều đặn như trước, và sự mệt mỏi sau đó càng khó chịu hơn."
  trait_specific_ongoing.2018.a:0 "Ta bỏ cuộc. Ta cần lấy lại sức mạnh."

  trait_specific_ongoing.2019.fasting2.desc:0 "\n\nCác quy tắc khó tuân theo, và Ta thấy mình ám ảnh từng chi tiết nhỏ. Thức ăn luôn chiếm tâm trí Ta."
  trait_specific_ongoing.2019.a:0 "Không ai biết nếu Ta phá luật... Chỉ một chút thôi!"
  trait_specific_ongoing.2019.b:0 "Ta không được thất bại — quá nhiều thứ đang đặt lên vai Ta!"


 ### POSSESSED REOCCURANCE EVENT ### 
  trait_specific_ongoing.2020.t:0 "Một Cảm Giác Quen Thuộc"
  trait_specific_ongoing.2020.a:0 "Lại nữa sao! Ta #EMP từ chối#!! Điều này #EMP không thể# xảy ra..."
  trait_specific_ongoing.2020.start.desc:0 "Một luồng"
  trait_specific_ongoing.2020.dread.desc:0 "sợ hãi"
  trait_specific_ongoing.2020.fear.desc:0 "lo lắng"
  trait_specific_ongoing.2020.anxiety.desc:0 "bồn chồn"
  trait_specific_ongoing.2020.nausea.desc:0 "buồn nôn"
  trait_specific_ongoing.2020.anger.desc:0 "giận dữ"
  trait_specific_ongoing.2020.end.desc:0 "ập đến khi sàn nhà bắt đầu xoắn và uốn dưới chân Ta. Mặc dù đã được an toàn một thời gian dài, Ta ngay lập tức nhận ra các dấu hiệu.\n\nTa chạy về phòng của mình trước khi bắt đầu khóc — hoặc mất hoàn toàn quyền kiểm soát cơ thể..."

  trait_specific_ongoing.2025.t:0 "Không Nơi Ẩn Nấp"
  trait_specific_ongoing.2025.start.desc:0 "[dummy_gender.GetWomanMan] trước mặt Ta trông kỳ lạ. Khuôn mặt [dummy_gender.GetHerHis|U] bị méo... đang xoắn? Liệu [dummy_gender.GetSheHe] có còn là con người không?\n\nThực tại #EMP rung chuyển#!, và Ta nhận ra mình đang trải qua một [ROOT.Char.Custom('PossessedEpisode')] khác — ngay trước mặt [ROOT.Char.Custom('GetCourt')] đã tập hợp. Khi"
  trait_specific_ongoing.2025.end.desc:0 "tràn đầy mũi Ta, Ta cố gắng nói, nhưng môi Ta không nhúc nhích."
  trait_specific_ongoing.2025.a:0 "Ta phải rời khỏi đây, trước khi mọi chuyện tồi tệ hơn!"
  trait_specific_ongoing.2025.b:0 "Ta là [ROOT.Char.GetTitleAsNameNoTooltip] — Ta không quan tâm họ nghĩ gì."
  trait_specific_ongoing.2025.b.success:0 "[ROOT.Char.Custom('GetCourtierPlural')] của Ngài ấn tượng trước lòng dũng cảm của Ngài"
  trait_specific_ongoing.2025.b.failure:0 "[ROOT.Char.Custom('GetCourtierPlural')] của Ngài cảm thấy kinh tởm"
  trait_specific_ongoing.2025.c:0 "[helper.GetFirstNameNoTooltip] đâu rồi? Ta cần sự giúp đỡ của [helper.GetHerHis]!"
  trait_specific_ongoing.2025.d:0 "Đây là thông điệp từ [ROOT.Char.GetFaith.HighGodName]! Ta sẽ nói cho họ biết!"
  trait_specific_ongoing.2025.d.success:0 "[ROOT.Char.Custom('GetCourtierPlural')] của Ngài tin Ngài"
  trait_specific_ongoing.2025.d.failure:0 "[ROOT.Char.Custom('GetCourtierPlural')] của Ngài nghĩ Ngài nói dối"
  trait_specific_ongoing.2025.e:0 "Ta có thể giả vờ đây là một thị kiến từ [ROOT.Char.GetFaith.HighGodName]..."
  trait_specific_ongoing.2025.e.failure:0 "[ROOT.Char.Custom('GetCourtierPlural')] nhận ra chiêu trò của Ngài"
  trait_specific_ongoing.2025.every_courtier:0 "Mọi [actor.Custom('GetCourtier')]"



  trait_specific_ongoing.3001.t:0 "Nỗi Khổ Yêu Cùng Người"
  trait_specific_ongoing.3001.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sympathetic_character') )] [sympathetic_character.GetTitledFirstName] đến gần Ta khi Ta vừa kết thúc việc phát biểu trước [ROOT.Char.Custom('GetCourt')], trong khi mọi người vẫn đang giao lưu xung quanh.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], Ta nghe nói ngài cũng trải qua những giai đoạn... u sầu. Có lẽ chúng ta có thể trao đổi kinh nghiệm của mình?""
  trait_specific_ongoing.3001.a:0 "Đến đây, chúng ta còn nhiều điều để nói."
  trait_specific_ongoing.3001.b:0 "Ta không có vấn đề đó! Ngươi nói gì thế?!"
  trait_specific_ongoing.3001.b.tt:0 "Ahaha... ha."

  trait_specific_ongoing.3002.t:0 "Giải Pháp Dài Hạn"
  trait_specific_ongoing.3002.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]," [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] đến gặp Ta một buổi tối. "Ta có vài phương thuốc có thể thử cho cơn u sầu dai dẳng của ngài. Có thể sẽ tồi tệ hơn một chút trước khi tốt lên, nhưng đáng để thử!""
  trait_specific_ongoing.3002.a:0 "Ta sẽ làm bất cứ điều gì để thoát khỏi nó."
  trait_specific_ongoing.3002.b:0 "Tất cả những gì Ta cần chỉ là một giấc ngủ dài. Hoặc ba giấc."

  trait_specific_ongoing.3003.desc:0 ""Để chữa những chứng bệnh này, điều quan trọng là phải giải tỏa những suy nghĩ xấu," [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] đảm bảo với Ta. "Hãy đến gặp Ta vài lần mỗi tuần, và chúng ta sẽ nói về những gì đang đè nặng lên ngài.""
  trait_specific_ongoing.3003.a:0 "Ta sẽ dành thời gian."
  trait_specific_ongoing.3003.b:0 "Quá sức với Ta – Ta sẽ quay lại giường."

  trait_specific_ongoing.3004.desc:0 ""Để ngài cảm thấy tốt hơn, chúng ta phải làm việc cả với suy nghĩ lẫn thói quen của ngài," [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] thông báo. "Ta sẽ giúp ngài xác định các suy nghĩ và thói quen tiêu cực và làm việc để thay đổi chúng.""
  trait_specific_ongoing.3004.a:0 "Hợp lý!"

  trait_specific_ongoing.3005.desc:0 ""Tập thể dục và kích thích cơ thể hiệu quả trong việc cân bằng các trạng thái tinh thần," [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] nói với Ta. "Ngài sẽ đi vòng quanh [ROOT.Char.Custom('ResidenceBuilding')] ba lần mỗi ngày.""
  trait_specific_ongoing.3005.a:0 "Ta sẽ cố gắng hết sức."

  trait_specific_ongoing.3006.desc:0 ""Những suy nghĩ xấu và u sầu này rõ ràng là kết quả của các linh hồn ác hoặc quỷ dữ," [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] nói. "Chúng ta sẽ giao cho một [ROOT.Char.Custom('DefaultPriestTitle')] cầu nguyện cho ngài để xua đuổi cái ác bên trong.""
  trait_specific_ongoing.3006.a:0 "Sức mạnh của [ROOT.Char.GetFaith.HighGodName] sẽ chữa lành Ta!"

  trait_specific_ongoing.3007.desc:0 "Sau tất cả những gì [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] đã trải qua với Ta, Ta chậm rãi nhận ra rằng Ta #EMP cảm nhận#! mọi thứ một lần nữa."
  trait_specific_ongoing.3007.desc_ending:0 "\n\nNhư mặt trời xuyên qua một lớp mây dày, Ta cảm nhận hạnh phúc chảy trở lại vào tâm hồn mình."
  trait_specific_ongoing.3007.a:0 "Ta... Ta hạnh phúc!"

  trait_specific_ongoing.3008.desc_physician_died:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] qua đời trước khi [court_physician.GetSheHe] có thể hoàn tất việc chữa trị cho Ta, nhưng những hướng dẫn [court_physician.GetSheHe] để lại giúp Ta hoàn thành liệu trình một mình."
  trait_specific_ongoing.3008.desc_no_depression:0 "Ta không phải tiếp tục thói quen mà [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] đặt ra để thoát khỏi u sầu vì Ta đã khỏi bệnh!"
  trait_specific_ongoing.3008.desc_fallback:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] của ta, [court_physician.GetTitledFirstName] vẫn chưa hoàn tất quá trình chữa trị chứng u uất của [court_physician.GetHerHis] cho ta, nhưng ta đã cảm nhận được màn đêm tăm tối đang dần tan biến khỏi tâm trí mình."

  trait_specific_ongoing.3009.t:0 "Những Ngày Nặng Nề"
  trait_specific_ongoing.3009.desc:0 "Ngày này nối tiếp ngày khác, không ngừng, ngay cả khi tâm trí Ta chìm trong mệt mỏi và tuyệt vọng.\n\nĐôi khi chỉ việc ra khỏi giường vào buổi sáng cũng là quá sức với Ta."
  trait_specific_ongoing.3009.a:0 "Ta chỉ muốn nằm xuống..."

 ### Someone thinks you're slothful ###
  trait_specific_ongoing.3015.t:0 "Những Lời Nhạo Báng"
  trait_specific_ongoing.3015.start.desc:0 "Dù đó là một lời nhận xét mỉa mai hay một ánh nhìn đầy phản đối, [unsympathetic.Custom2('MyCharacterIntroduction', ROOT.Char)] liên tục thể hiện sự khinh miệt của [unsympathetic.GetHerHis] đối với bệnh tình của ta. Khi ta"
  trait_specific_ongoing.3015.council.desc:0 "vội vã đến cuộc họp hội đồng, lại trễ một lần nữa,"
  trait_specific_ongoing.3015.withdraw.desc:0 "rời bàn ăn sớm,"
  trait_specific_ongoing.3015.book.desc:0 "nhận ra mình đã quên cuốn sách [unsympathetic.GetSheHe] cho mượn,"
  trait_specific_ongoing.3015.end.desc:0 "Ta biết chính xác [unsympathetic.GetSheHe] sẽ phản ứng thế nào.\n\n"Tại sao Ta còn ngạc nhiên nữa chứ," [unsympathetic.GetTitledFirstNameNoTooltip] thở dài, và tim Ta chìm xuống."
  trait_specific_ongoing.3015.a:0 "Ta sẽ chứng minh [unsympathetic.GetHerHim] sai!"
  trait_specific_ongoing.3015.b:0 ""Im đi, ngươi [unsympathetic.Custom2('InsultAdjective', ROOT.Char)] [unsympathetic.Custom2('InsultNoun', ROOT.Char)]!""
  trait_specific_ongoing.3015.c:0 "[unsympathetic.GetSheHe|U] đúng. Ta vô dụng..."
  trait_specific_ongoing.3015.a.success:0 "Ta vượt qua sự lười biếng của mình"
  trait_specific_ongoing.3015.a.neutral:0 "Ta vẫn mệt mỏi"
  trait_specific_ongoing.3015.a.failure:0 "Cố gắng quá sức thật mệt mỏi"
 

  trait_specific_ongoing.5001.t:0 "Cuộc Hẹn Riêng"
  trait_specific_ongoing.5001.desc_opening:0 "Ta và [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('victim') )] [victim.GetTitledFirstName] tìm thấy mình ở một mình khi phần còn lại của [ROOT.Char.Custom('GetCourt')] đã đi ngủ.\n\n"
  trait_specific_ongoing.5001.desc_small:0 "Khi trò chuyện, Ta không khỏi để ý đến cánh tay rắn chắc của [victim.GetHerHis], làn da căng trên cơ bắp..."
  trait_specific_ongoing.5001.desc_big:0 "Khi trò chuyện, Ta không khỏi để ý đến cánh tay tròn đầy của [victim.GetHerHis], thịt và mỡ nằm mềm mại..."
  trait_specific_ongoing.5001.desc:0 "Khi trò chuyện, Ta chú ý đến làn da của [victim.GetHerHis], và sự chuyển động bên dưới khi [victim.GetSheHe] di chuyển..."
  trait_specific_ongoing.5001.a:0 "Một bữa ăn nhẹ lúc nửa đêm sẽ thật tuyệt."
  trait_specific_ongoing.5001.b:0 "\"Xin mời, [victim.GetFirstNameNoTooltip], tiếp tục đi.\""

  trait_specific_ongoing.5002.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murderer') )] của ta, [murderer.GetTitledFirstName], và ta chợt thấy hai người cô độc bên nhau khi phần còn lại của triều đình đã chìm sâu vào giấc ngủ.\n\nĐêm càng về khuya, [murderer.GetSheHe] lại càng trở nên cuồng nhiệt hơn, đôi mắt của [murderer.GetHerHis] không bao giờ rời xa khỏi bất kỳ phần da thịt nào đang để lộ trên cơ thể ta. Đúng lúc ta chuẩn bị chất vấn ý đồ của [murderer.GetHerHis], [murderer.GetSheHe] bất ngờ rút ra một con dao và nở nụ cười nham hiểm."
  trait_specific_ongoing.5002.a:0 "Không, không, xin– KHÔNG! AAAH!"

  trait_specific_ongoing.5003.t:0 "Cám Dỗ Thịt Xác"
  trait_specific_ongoing.5003.desc_opening:0 "Tên người hầu [servant.GetTitledFirstName] đã thu hút sự chú ý của ta – đường nét cánh tay của [servant.GetHerHis], chiếc cổ cong quyến rũ của [servant.GetHerHis]... Khi ta dồn [servant.GetHerHim] vào góc khuất một mình giữa kho lương thực, [servant.GetSheHe] hỏi ta muốn gì ở [servant.GetHerHim] với một nụ cười tán tỉnh trên đôi môi của [servant.GetHerHis].\n\n"Ta thèm khát thân xác của ngươi," ta đáp lời khi áp sát vào người [servant.GetHerHim]."
  trait_specific_ongoing.5003.desc_big:0 ""Nó thật căng mọng – tràn đầy #EMP nhựa sống#!!"
  trait_specific_ongoing.5003.desc:0 ""Nó thật tràn đầy #EMP nhựa sống#!!"
  trait_specific_ongoing.5003.a:0 "Bằng một nhát dao dứt khoát, ta rạch ngọt yết hầu của [servant.GetHerHis]."
  trait_specific_ongoing.5003.b:0 "Ta cởi [servant.GetHerHis] [servant.Custom('GetUpperClothingArticle')]."

  trait_specific_ongoing.5004.t:0 "Trạm Dừng Ăn Nhẹ"
  trait_specific_ongoing.5004.desc:0 "Khi Ta đi cùng đoàn tùy tùng ở [county.GetNameNoTier], chúng Ta tình cờ thấy một căn nhà nhỏ với bà lão sống một mình.\n\nTa bảo đoàn tùy tùng chờ ngoài đường và vào nhà một mình."
  trait_specific_ongoing.5004.a:0 "Xin bà, giúp Ta một tay!"
  trait_specific_ongoing.5004.b:0 "Vậy, kể Ta nghe, mọi việc quanh đây thế nào?"

  trait_specific_ongoing.5005.t:0 "Bữa Ăn Muộn"
  trait_specific_ongoing.5005.desc:0 "Một buổi tối muộn, Ta tình cờ gặp [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('courtier'))] [courtier.GetTitledFirstName] đang ngủ trưa.\n\nTrước đây Ta chưa để ý, nhưng [courtier.GetSheHe] thực sự có vóc dáng hấp dẫn..."
  trait_specific_ongoing.5005.a:0 "Điều đó #EMP gần như#! vượt quá khả năng chịu đựng của ta rồi!"
  trait_specific_ongoing.5005.b:0 "Ta sẽ đánh thức [courtier.GetHerHim] – [courtier.GetSheHe] không thể thoải mái ngoài đây."

  trait_specific_ongoing.6001.t:0 "Bị Bắt Quá Bất Ngờ"
  trait_specific_ongoing.6001.desc:0 "Để tạo thêm niềm hứng khởi trước cuộc hẹn với [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover') )] của ta là [lover.GetTitledFirstName], ta mang [ROOT.Char.Custom('DeviantObjectArticle')] ra – #EMP ôi...!#!\n\nTa đã quá say mê với nó, mải mê khám phá từng ngóc ngách bên trong lẫn bên ngoài, đến mức không hề nghe thấy có tiếng người bước vào [ROOT.Char.Custom('GetRoom')]. Điều duy nhất ta nghe thấy là tiếng thở hổn hển đầy kinh ngạc của [lover.GetFirstNamePossessiveNoTooltip] khi [lover.GetSheHe] phát hiện ra những gì ta đang làm."
  trait_specific_ongoing.6001.a:0 "Ta còn một cái... Nếu ngươi muốn tham gia?"
  trait_specific_ongoing.6001.a.success:0 "[lover.GetSheHe|U] đồng ý"
  trait_specific_ongoing.6001.a.failure:0 "[lover.GetSheHe|U] không cùng sở thích"
  trait_specific_ongoing.6001.b_woman:0 "Ta... Bác sĩ khuyên làm vậy để tăng cường sức khỏe!"
  trait_specific_ongoing.6001.b_man:0 "Ta... Bác sĩ khuyên làm vậy để tăng cường sinh lực!"

  trait_specific_ongoing.6002.t:0 "Chủ Nhân Dị Thường"
  trait_specific_ongoing.6002.desc:0 "Khi Ta đến thăm [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('liege') )] [liege.GetTitledFirstName], Ta được dẫn tới phòng của [liege.GetHerHis].\n\nTa mở cửa và thấy [liege.GetHerHim] đang tận hưởng khoái cảm, nhờ vào [ROOT.Char.Custom('DeviantObjectArticle')] – Ta còn không ngờ nó có thể dùng như vậy!"
  trait_specific_ongoing.6002.a:0 "Ôi ôi ôi, thật #EMP thú vị#!"
  trait_specific_ongoing.6002.b:0 "Ồ, cái này... thật #EMP thú vị#!"
  trait_specific_ongoing.6002.c:0 "Chuyện này nghĩa là gì?!"
  trait_specific_ongoing.6002.d:0 "Ta sẽ ra ngoài."

  trait_specific_ongoing.6003.t:0 "Hành Vi Dị Thường"
  trait_specific_ongoing.6003.desc_opening:0 "Ta đang tận hưởng khoái cảm, nhờ vào [ROOT.Char.Custom('DeviantObjectArticle')], khi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal') )] [vassal.GetTitledFirstName] bước vào phòng.\n\n"
  trait_specific_ongoing.6003.desc_deviant:0 "Đôi mắt của [vassal.GetHerHis|U] mở to – không phải vì ghê tởm, mà là đầy hứng thú. "Ồ, thần chưa bao giờ nghĩ đến việc sử dụng nó theo cách #EMP như vậy#!. Ngài quả là một nguồn cảm hứng vĩ đại!""
  trait_specific_ongoing.6003.desc_joined:0 "Ta thấy [vassal.GetHerHim] do dự, nhưng rồi [vassal.GetSheHe] đóng cửa và bước vào. 'Ô, [liege.GetTitledFirstNameNoTooltip], thật... thật #EMP thú vị#! Để ta giúp ngươi.'"
  trait_specific_ongoing.6003.desc_exposed:0 "Kinh hãi, [vassal.GetSheHe] mở tung cửa: '[liege.GetTitledFirstNameNoTooltip], chuyện này nghĩa là gì?!'"
  trait_specific_ongoing.6003.desc_ew:0 "Kinh hãi, [vassal.GetSheHe] lùi ra ngoài: 'Hãy... giả vờ Ta không thấy gì, được chứ?'"
  trait_specific_ongoing.6003.a:0 "#EMP Hng...!#!"
