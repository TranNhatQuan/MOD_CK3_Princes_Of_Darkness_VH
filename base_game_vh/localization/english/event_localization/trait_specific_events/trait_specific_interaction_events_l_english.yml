l_english:
  send_poem_interaction:0 "Gửi Thơ"
  send_poem_interaction_desc:0 "Gửi một tác phẩm cá nhân đầy cảm xúc tới [recipient.GetTitledFirstNameNoTooltip]"
  send_poem_interaction.positive_auto_accept.tt:0 "Vì bài thơ này mang ý nghĩa tích cực, [recipient.GetFirstNameNoTooltip] có thể chấp nhận ngay nếu [recipient.GetSheHe] có [opinion|E] đủ cao đối với Ngài"
  SEND_POEM_ROMANCE:0 "Tác phẩm về Tình Yêu"
  SEND_POEM_MOURNING:0 "Tác phẩm về Nỗi Buồn"
  SEND_POEM_LEGACY:0 "Tác phẩm về Di Sản"
  SEND_POEM_STRIFE:0 "Tác phẩm về Khó Khăn"
  SEND_POEM_INCOMPETENCE:0 "Tác phẩm chỉ ra sự Kém Cỏi của họ"

  send_poem_interaction.success:0 "Bài Thơ Được Khen Ngợi"
  send_poem_interaction.failure:0 "Bài Thơ Bị Chế Giễu"

  trait_specific_interactions.000.generate_poem:1 "#POE [actor.Custom('GeneratePoem_Title')]#!\n[actor.Custom('GeneratePoem_Intro_Rhyming')]\n[actor.Custom('GeneratePoem_Outro_Rhyming')]"
  trait_specific_interactions.000.intro.part1:0 "Tác phẩm mới nhất của [recipient.Custom2('RelationToMe', SCOPE.sC('actor'))], [actor.GetTitledFirstName], đã trở thành tâm điểm tại [actor.Custom('GetCourt')] gần đây:"
  trait_specific_interactions.000.intro.part3:0 "và [actor.GetFirstNameNoTooltip] đã công khai dành tặng nó cho #EMP Ta.#!"
  trait_specific_interactions.000.outro:0 "Cho đến nay, Ta vẫn giữ cảm nghĩ riêng, nhưng sự ồn ào đã trở nên quá lớn để phớt lờ."

  trait_specific_interactions.0001.t:0 "Một Chút Lãng Mạn"
  trait_specific_interactions.0001.desc.intro:0 "$trait_specific_interactions.000.intro.part1$ tác phẩm này nói về tình cảm yêu đương, $trait_specific_interactions.000.intro.part3$"
  trait_specific_interactions.0001.desc.poem:0 "\n\n$trait_specific_interactions.000.generate_poem$\n\n"
  trait_specific_interactions.0001.desc.outro:0 "$trait_specific_interactions.000.outro$"
  trait_specific_interactions.0001.a:0 "Ta không biết mình cảm thấy thế nào về chuyện này..."
  trait_specific_interactions.0001.b:0 "[actor.GetFirstNameNoTooltip], Ta thấy đây là #EMP thực sự#! chân thành!"
  trait_specific_interactions.0001.c:0 "Pfft, nhảm nhí!"

  trait_specific_interactions.0011.t:0 "Niềm An Ủi Qua Văn Chương"
  trait_specific_interactions.0011.desc.intro:0 "$trait_specific_interactions.000.intro.part1$ tác phẩm nói về nỗi buồn và mất mát, $trait_specific_interactions.000.intro.part3$"
  trait_specific_interactions.0011.desc.poem:0 "\n\n$trait_specific_interactions.000.generate_poem$\n\n"
  trait_specific_interactions.0011.desc.outro:0 "$trait_specific_interactions.000.outro$"
  trait_specific_interactions.0011.a:0 "$trait_specific_interactions.0001.a$"
  trait_specific_interactions.0011.b:0 "$trait_specific_interactions.0001.b$"
  trait_specific_interactions.0011.c:0 "$trait_specific_interactions.0001.c$"

  trait_specific_interactions.0021.t:0 "Những Dòng Về Di Sản"
  trait_specific_interactions.0021.desc.intro:0 "$trait_specific_interactions.000.intro.part1$ tác phẩm nói về ký ức và những gì chúng ta để lại, $trait_specific_interactions.000.intro.part3$"
  trait_specific_interactions.0021.desc.poem:0 "\n\n$trait_specific_interactions.000.generate_poem$\n\n"
  trait_specific_interactions.0021.desc.outro:0 "$trait_specific_interactions.000.outro$"
  trait_specific_interactions.0021.a:0 "$trait_specific_interactions.0001.a$"
  trait_specific_interactions.0021.b:0 "$trait_specific_interactions.0001.b$"

  trait_specific_interactions.0031.t:0 "Nỗ Lực Trong Gian Khổ"
  trait_specific_interactions.0031.desc.intro:0 "$trait_specific_interactions.000.intro.part1$ tác phẩm nói về thành công và sự lớn mạnh, $trait_specific_interactions.000.intro.part3$"
  trait_specific_interactions.0031.desc.poem:0 "\n\n$trait_specific_interactions.000.generate_poem$\n\n"
  trait_specific_interactions.0031.desc.outro:0 "$trait_specific_interactions.000.outro$"
  trait_specific_interactions.0031.a:0 "$trait_specific_interactions.0001.a$"
  trait_specific_interactions.0031.b:0 "$trait_specific_interactions.0001.b$"

  trait_specific_interactions.0041.t:0 "Kẻ Đáng Ghét [recipient.GetTitleAsNameNoTooltip]"
  trait_specific_interactions.0041.desc.intro:0 "$trait_specific_interactions.000.intro.part1$ tác phẩm mang tính công kích, khiêu khích, và được dành #EMP riêng biệt#! cho Ta cùng với “sự pha trộn độc đáo giữa sự kém cỏi và bất cẩn” của Ta."
  trait_specific_interactions.0041.desc.poem:0 "\n\n$trait_specific_interactions.000.generate_poem$\n\n"
  trait_specific_interactions.0041.desc.outro:0 "$trait_specific_interactions.000.outro$"
  trait_specific_interactions.0041.a:0 "$trait_specific_interactions.0001.a$"
  trait_specific_interactions.0041.b:0 "Hmmm. Vâng. #EMP Thật. Thú Vị.#!"
