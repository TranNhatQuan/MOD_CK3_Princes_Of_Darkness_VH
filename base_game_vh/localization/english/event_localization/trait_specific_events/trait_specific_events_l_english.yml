l_english: 
  trait_specific.1001.desc:0 "Gần đây, những người lạ xuất hiện quanh [ROOT.Char.Custom('GetCourt')|l] – một số Ta chỉ thấy như bóng mờ ngoài rìa mắt, và những người khác Ta thoáng nhìn rồi họ dường như biến mất.\n\nDù Ta giao nhiệm vụ tìm kiếm bao nhiêu lần, những người lạ này vẫn không thể tìm thấy, nhưng sự trêu chọc của họ ngày càng dữ dội!"
  trait_specific.1001.a:0 "Ở đó–! Ta thề là Ta đã thấy..."

  trait_specific.1002.desc:0 "Gần đây Ta khó mà suy nghĩ rõ ràng – những ý nghĩ rải rác như mây trên bầu trời mùa hè.\n\nNhững con chim ngoài [ROOT.Char.Custom('ResidenceBuilding')] của Ta đã bắt đầu hót một giai điệu khác. Người khác nói những câu đố cố ý, và #EMP không ai#! thừa nhận rằng ngò là một loại gia vị thật kinh khủng."
  trait_specific.1002.a:0 "Khoan, Ta đang nghĩ gì vậy?"

  trait_specific.1010.t:0 "Điên Loạn Trỗi Dậy"
  trait_specific.1010.desc:0 "Tuần vừa qua Ta như xoáy theo cơn lốc, như lá trong bão, quay tròn mãi. Thực tại là gì? Điều gì là #EMP thực#!? Ta không còn trả lời được nữa.\n\nTất cả những gì Ta biết là người phụ nữ trên mây hiểu Ta — nhưng những bóng đen càng ngày càng lan rộng."
  trait_specific.1010.a:0 "Chúng như loài gặm nhấm... Cút đi, biến khỏi đây!"

  trait_specific.2001.t:0 "Khởi Phát"
  trait_specific.2001.desc:0 "Một cảm giác bệnh tật dâng lên trong bụng Ta. Ta cố quay lại [ROOT.Char.Custom('GetChamber')], nhưng lối vào thu nhỏ trước mắt Ta! C-có chuyện gì đang #EMP xảy ra?!#!\n\nĐột nhiên Ta ngửi thấy thứ gì đó... thứ mà Ta biết đã từng ngửi, nhưng... #EMP ở đâu#!? Ai đó hỏi Ta có ổn không, nhưng Ta không trả lời được, Ta chẳng thể làm gì..."
  trait_specific.2001.a:0 "Ta... Ta đã biến mất bao lâu rồi?"

  trait_specific.2002.desc:0 "Gần đây Ta trải qua một vài... cơn. Một thứ gì đó chiếm lấy cơ thể Ta, rồi để lại Ta mệt mỏi và bối rối.\n\nTa cố giấu mọi người, cố che đậy, nhưng thật khó kiểm soát thứ gì đó đến đi theo ý thích."
  trait_specific.2002.a:0 "Họ nhìn Ta như thể Ta... #EMP bị quỷ ám#!."

  trait_specific.3001.desc:0 "Một mũi tên lạc bay qua đầu Ta, và Ta cảm thấy #EMP chẳng gì#! – không sợ hãi, không hoảng loạn, thậm chí không tức giận.\n\nĐây đã trở thành trạng thái bình thường đáng lo – Ta cảm thấy như tồn tại sau một tấm rèm, ngăn Ta cảm nhận, ngăn Ta kết nối với thế giới, và Ta quá #EMP mệt mỏi#!..."
  trait_specific.3001.a:0 "Ta nghĩ mình sẽ quay lại giường."

  trait_specific.3002.desc_opening:0 "Tất cả những điều này có ý nghĩa gì? Tại sao chúng ta phải lặp đi lặp lại những việc này ngày này qua ngày khác..."

  trait_specific.3999.t:0 "Những Ngày Xám Xịt"
  trait_specific.3999.desc:0 "Cả đời Ta cảm thấy hạnh phúc không đến dễ dàng như người khác, và giờ cảm giác đó xa lạ với Ta như không khí với cá."
  trait_specific.3999.desc_end:0 "\n\nĐộng lực và năng lượng rời khỏi Ta. Khi cuộc sống chìm vào tẻ nhạt xám xịt, Ta cảm thấy mình nên hoảng loạn, nhưng ngay cả điều đó giờ cũng vượt quá khả năng của Ta."
  trait_specific.3999.a:0 "Mọi thứ quá sức chịu đựng..."

  trait_specific.4001.t:0 "Đọc Khác Thường"
  trait_specific.4001.landed: "Trong một góc bụi bặm của thư viện Ta tìm thấy một cuốn sách"
  trait_specific.4001.adventurer: "Trong góc một chiếc rương tả tơi Ta tìm thấy một cuốn sách"
  trait_specific.4001.desc:0 " – bọc da và khắc những ký hiệu lạ – một phần bị che bởi các cuốn sách khác. Nó cũ, nhưng rõ ràng đã được sử dụng gần đây.\n\nKhi Ta lật từng trang, Ta nhanh chóng nhận ra nó chứa kiến thức #EMP phi truyền thống#!."
  trait_specific.4001.a:0 "Thú vị... Ta liếc xung quanh trước khi ngồi xuống đọc."
  trait_specific.4001.a_tt:0 "Hy vọng người vừa đọc cuốn sách không ở đây để thấy Ta..."
  trait_specific.4001.b:0 "Ngụy giáo! Ta sẽ giao cho [ROOT.Char.GetFaith.PriestNeuterPlural]."

  trait_specific.5001.t:0 "Người Sành Ăn"
  trait_specific.5001.desc:0 "Thịt nai, nai sừng tấm, chim cút... Có quá nhiều món kỳ lạ để thử trên thế giới này!\n\nĐã nếm qua nhiều loại thịt tuyệt hảo suốt những năm qua, Ta không khỏi thắc mắc còn những gì khác ngoài kia? Những chuyến phiêu lưu vị giác nào đang chờ lưỡi Ta?"
  trait_specific.5001.a:0 "Ta phải thử tất cả!"
  trait_specific.5001.a.tt:0 "Ta sẽ tìm những loại thịt kỳ lạ hơn"
  trait_specific.5001.b:0 "Loại thịt Ta có lúc này là đủ rồi."

  trait_specific.5002.desc:0 "Trên hành trình tìm kiếm thịt hiếm, một ý nghĩ nảy nở trong đầu Ta. Ta khó mà thừa nhận với chính mình, nhưng Ta không khỏi tự hỏi thịt #EMP con người#! sẽ như thế nào...\n\nKhi một người hầu [ROOT.Char.Custom('GetCourt')|l] ốm yếu, đứng trước cửa tử, Ta ra lệnh đặt anh ta dưới sự chăm sóc của riêng Ta."
  trait_specific.5002.a:0 "Xin tha thứ – Ta phải tìm hiểu!"
  trait_specific.5002.b:0 "Ta sẽ không làm gì ngoài việc cầu nguyện cho linh hồn anh ta."

  trait_specific.5003.t:0 "Đưa Đến Cực Đoan"
  trait_specific.5003.desc:0 "Ban đầu chỉ là một chuyến đi ngắn, một chuyến dạo thú vị ngoài đồng quê. Giờ đã nhiều ngày trôi qua mà không thấy người sống khác, và thức ăn thì đã hết – chúng Ta đã ăn cả ngựa.\n\nHướng dẫn viên hứa chúng Ta sẽ đến được nền văn minh trong tuần này, nhưng một số người hầu đã đến giới hạn, và bụng Ta gầm lên với mỗi giờ trôi qua."
  trait_specific.5003.a:0 "Ta sẽ làm tất cả để sinh tồn..."
  trait_specific.5003.b:0 "Chúng Ta sẽ vượt qua chuyện này!"

  trait_specific.6001.t:0 "Vị Thay Thế"
  trait_specific.6001.desc:0 "Gần đây các hoạt động bình thường không còn... #EMP thỏa mãn#! Ta. Bác sĩ đề xuất nhiều loại thuốc mỡ, nhưng chẳng gì kích thích.\n\nKhi Ta ngày càng tuyệt vọng, Ta tình cờ phát hiện một vài cuốn sách, giấu dưới đáy đống trong gian hàng của thương nhân, mô tả những hoạt động bất thường. Ta không thể ngừng lật trang, và sự nóng bừng dâng lên trong cơ thể."
  trait_specific.6001.a:0 "Thôi được, nếu cần phải thế..."
  trait_specific.6001.b:0 "Ta còn tốt hơn thế này!"

  trait_specific.6002.t:0 "Thử Nghiệm"
  trait_specific.6002.desc:0 "Ta đang chuẩn bị nới lỏng [lover.Custom('GetUpperClothingArticle')] của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover') )] của ta, [lover.GetTitledFirstNamePossessive], thì [lover.GetSheHe] bỗng dưng lùi lại.\n\n"Ta đã luôn muốn thử một điều gì đó #EMP mới mẻ#!, [ROOT.Char.Custom('LoverPetName')] của lòng ta," [lover.GetSheHe] thầm thì oanh yến, đưa tay xuống dưới gầm giường với một nụ cười đầy ma mị.\n\nBàn tay của [lover.GetHerHis|U] đưa ra, nắm chặt lấy [ROOT.Char.Custom('DeviantObjectArticle')]. "Ta đang nghĩ chúng ta có thể sử dụng #EMP thứ này#!.""
  trait_specific.6002.a:0 "Rất tốt, đừng để Ta chờ lâu!"
  trait_specific.6002.b:0 "Ngài thích những thứ như... #EMP này?!#!"
  trait_specific.6002.b_known:0 "Ta biết [lover.GetSheHe] thích một số chuyện kỳ quặc, nhưng cái này thì?!"

  trait_specific.7001.t:0 "Nâng Ly!"
  trait_specific.7001.desc:0 "Không gì làm Ta bình tĩnh nhanh bằng một ly [ROOT.Char.Custom('RegionalAlcoholicDrink')]. Sau một ngày vất vả, sau một ngày tốt lành, sau #EMP bất kỳ#! ngày nào... Ta luôn tìm thấy an ủi ở đáy cốc."
  trait_specific.7001.a:0 "Mang cho Ta thêm một ly!"
  trait_specific.7002.b:0 "Ta còn mạnh mẽ hơn thế này."

  trait_specific.8001.t:0 "Mầm Sống Mới"
  trait_specific.8001.desc:0 "Một thương nhân vui vẻ đưa vào tay Ta một túi hạt – những cây mà [ROOT.Char.Custom('RandomSheHe')] nói sẽ củng cố sức khỏe và trí tuệ.\n\nTa phải thừa nhận Ta ít kinh nghiệm chăm sóc cây, nhưng khó đến mức nào chứ?"
  trait_specific.8001.a:0 "Ta sẽ dùng chúng để tạo một khu vườn riêng!"
  trait_specific.8001.a.success:0 "Ngài trồng được một khu vườn xanh tươi"
  trait_specific.8001.a.small_success:0 "Dự án thất bại, nhưng Ngài học được nhiều"
  trait_specific.8001.a.failure:0 "Hạt giống từ chối nảy mầm"
  trait_specific.8002.b:0 "Chúng chắc hẳn cũng có giá trị nào đó..."

  trait_specific.9001.t:0 "Suy Ngẫm Buổi Tối"
  trait_specific.9001.desc:0 "Ta nhấp một cốc [ROOT.Char.Custom('GetExpensiveDrink_Singular')], mắt lướt qua những dòng chữ vừa viết.\n\n#POE [ROOT.Char.Custom('GeneratePoem_Title')|U]#!\n[ROOT.Char.Custom('GeneratePoem_Intro_Rhyming')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming')]\n\nThật vậy, Ta là một trong những tâm hồn nghệ thuật vĩ đại của thời đại!"
  trait_specific.9001.a:0 "Một câu thơ hay! Tiếp theo Ta sẽ suy ngẫm gì?"
  trait_specific.9001.b:0 "Viết thì thú vị, nhưng Ta không biết về #EMP vần điệu#!."
  trait_specific.9001.c:0 "Có lẽ Ta sẽ tắm thay vào đó..."


  trait_specific.8501.t:0 "Cười Khúc Khích Đáng Ngờ"
  trait_specific.8501.desc:0 "Ta đang nói chuyện với một số [ROOT.Char.Custom('GetCourtierPlural')] về một chủ đề khá nghiêm túc, khi Ta không thể không nhận thấy [mean_courtier.GetTitledFirstName] cười khúc khích.\n\nChỉ khi Ta đối chất với [mean_courtier.GetHerHim] và [mean_courtier.GetSheHe] yêu cầu Ta nhắc lại từ 'đáng ngờ', Ta mới nhận ra [mean_courtier.GetSheHe] đang chế nhạo cách Ta phát âm."
  trait_specific.8501.a:0 "Thô lỗ, nhưng Ta có thể làm gì?"
  trait_specific.8501.b:0 "Bắt giam [mean_courtier.GetHerHim]!"
  trait_specific.8501.c:0 "Nếu Ngài thấy vui thế, có lẽ Ngài cũng muốn thử."
  trait_specific.8501.d:0 "Nói lại lần nữa, Ta dám cá."
  trait_specific.8501.e:0 "Có lẽ Ngài muốn xem gần hơn."
  trait_specific.8501.f:0 "Thật ra Ta nghĩ [ROOT.Char.GetFaith.HealthGodName] cũng từng nói lắp."
  trait_specific.8501.g:0 "Ngài sẽ #EMP không tin#! Ta có thể làm gì với lưỡi này..."
  trait_specific.8501.d.tt:0 "[mean_courtier.GetTitledFirstName] và Ngài có một [single_combat_duel|E]"
  trait_specific.8501.h:0 "Mọi chuyện ổn chứ?"
