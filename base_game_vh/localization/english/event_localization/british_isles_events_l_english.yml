l_english:

# Reclaiming Britannia, by Linnéa Thimrén
 british_isles.0001.t:0 "Britannia của người [reclaimer.GetCulture.GetNameNoTooltip|U]"
 british_isles.0001.desc:0 "Đã quá lâu hòn đảo vĩ đại này của chúng ta nằm dưới sự cai trị của ngoại bang — cuối cùng nó cũng trở lại trong tay người Celt! Ta nhìn ra những cánh đồng, và dường như mặt trời đang tỏa sáng lần đầu tiên sau nhiều năm; như thể vùng đất sung túc và khỏe mạnh, Tír na nÓg, đã quay trở lại để chào đón chúng ta. Những ngọn đồi và thung lũng của tổ tiên ta một lần nữa được bao bọc bởi văn hóa [ROOT.Char.GetCulture]."
 british_isles.0001.custom:0 "Tất cả [counties|E] tại Britannia"
 british_isles.0001.a:0 "Ngợi ca tổ tiên!"

 british_isles.0002.desc:0 "[ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('reclaimer'))] [reclaimer.GetName] đã chính thức tuyên bố sự tái sinh của một Britannia Celtic. \n\nSau hàng thế kỷ dưới ách cai trị của ngoại bang, quần đảo này đã trở lại dưới quyền kiểm soát của những chủ nhân nguyên thủy."
 british_isles.0002.a:0 "Tai họa [reclaimer.GetCulture.GetNameNoTooltip] giáng xuống vùng đất..."
 british_isles.0002.b:0 "Britannia một lần nữa thuộc về chúng ta!"

# Restoring the Danelaw, by Linnéa Thimrén
 british_isles.1001.t:0 "Luật Lệ Được Khôi Phục"
 british_isles.1001.desc:0 "Danelaw được tái sinh nhờ nỗ lực của ta; vùng đất này sẽ một lần nữa biết đến sự cai trị của người [restorer.GetCulture.GetName]!\n\nTa đang bước theo dấu chân của những huyền thoại như Guðrum và Eric Bloodaxe, những chiến binh vĩ đại thuở xưa, và nhân danh [restorer.GetFaith.WarGodName], ta sẽ không bao giờ để vương quốc rơi vào tay người Anglo-Saxon thêm lần nữa!"
 british_isles.1001.a:0 "Một kỷ nguyên mới bắt đầu!"

 british_isles.1002.t:0 "Danelaw"
 british_isles.1002.desc_same_culture:0 "Danelaw đã được tái sinh nhờ nỗ lực của [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('restorer'))] [restorer.GetName]! Một lần nữa, hòn đảo vĩ đại này nằm dưới sự cai trị của người [restorer.GetCulture.GetName]."
 british_isles.1002.desc:0 "[ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('restorer'))] [restorer.GetName] cùng những kẻ cướp bóc hung tàn của [restorer.GetHerHis] đã tạo nên một vương quốc mới trên quần đảo và tuyên bố đó là Vương quốc Danelaw tái sinh.\n\nLiệu nỗ lực khôi phục sự cai trị của người [restorer.GetCulture.GetName] tại Anh lần này có thành công hơn lần trước hay không vẫn còn phải chờ xem..."
 british_isles.1002.a:0 "Tai họa [restorer.GetCulture.GetNameNoTooltip] giáng xuống vùng đất."
 british_isles.1002.b:0 "Một chiến thắng cho người [restorer.GetCulture.GetNameNoTooltip]!"
 british_isles.1002.c:0 "Hm, người [restorer.GetCulture.GetNameNoTooltip] à? Cho ta tham gia!"

# Embrace English Culture, by Linnéa Thimrén
 british_isles.2001.t:0 "Không Còn Là Người [embracer_former_culture.GetNameNoTooltip|U]"
 british_isles.2001.desc:0 "Thời kỳ khi chúng ta, người [embracer.GetCulture.GetCollectiveNounNoTooltip], coi nước Pháp là quê hương đã qua từ lâu. Con cháu chúng ta sinh ra tại đây, giữa những người Saxon, và đối với chúng, Normandy sẽ chỉ mãi là một đường nét mờ nhạt bên kia bờ biển sương mù của Britannia.\n\nVà khi chúng ta tiếp nhận một số phong tục địa phương làm của mình, di sản văn hóa của chúng ta cũng lan rộng khắp vùng đất Saxon, khai sinh nên một bản sắc Anh mới."
 british_isles.2001.a:0 "Nước Anh muôn năm!"

 british_isles.2002.desc:0 "[ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('embracer'))] [embracer.GetName], các chư hầu của [embracer.GetHerHis], và toàn bộ gia đình của [embracer.GetHerHis] đã lắng nghe lời gọi của Albion và chấp nhận văn hóa Anh."
 british_isles.2002.a:0 "Chuyện này sớm muộn gì cũng xảy ra."
 british_isles.2002.b:0 "Những kẻ phản bội!"

# Request Laudabiliter, by Flavio Verna
 british_isles.3001.t:0 "Chúng Ta Long Trọng Tuyên Bố,"
 british_isles.3001.desc:0 "Mong muốn của ngươi trong việc mở rộng quyền cai trị thiêng liêng của Giáo hội Phổ quát đến các bộ tộc man rợ tại Ireland là một mục tiêu đạo hạnh và chính đáng. Vì vậy, Giáo hội La Mã Thánh thiện ra lệnh rằng ngươi hãy chiếm lấy hòn đảo này và thực thi Ý Chúa tại đó. \n\nNếu chẳng may ngươi qua đời trước khi chiến dịch thiêng liêng này kết thúc, chúng ta sẽ trao quyền thiêng liêng này cho những người kế vị hợp pháp của ngươi. Cầu mong gia tộc [scoped_ruler.GetHouse.GetBaseNameNoTooltip] tiếp tục sứ mệnh thánh này mãi mãi, cho đến khi ý chí thiêng liêng được hoàn thành và Ireland được thống nhất dưới sự cai trị của người [scoped_ruler.GetCulture.GetNameNoTooltip]."
 british_isles.3001.a:0 "Chuẩn bị hạm đội!"
 british_isles.3002.t:0 "Yêu Sách Đối Với Ireland"
 british_isles.3002.desc.irish:0 "Bởi ân điển của Đức Thánh Cha [scoped_pope.GetFirstName], Đại diện của Chúa và người thừa kế ngai vàng của Thánh Peter, [scoped_ruler.GetFullName] đã được ban quyền thống trị thần thánh đối với Eire và tất cả các bộ tộc ở đó.\n\nBất kỳ lãnh chúa Ireland nào không tuân theo sắc lệnh của Giáo hoàng và từ chối quy phục sẽ phải đối mặt với cơn thịnh nộ của [scoped_ruler.GetTitledFirstName], đội quân [scoped_ruler.GetCulture.GetName] của ngài và Đức Chúa Trời Toàn năng."
 british_isles.3002.a:0 "Chúng ta sẽ còn xem!"
 british_isles.3002.b:0 "Ta hiểu..."

# Refound Dumnonia, by Ewan Cowhig Croft
 british_isles.4001.t:0 "Vương Quốc [founder.GetPrimaryTitle.GetAdjectiveNoTooltip] Được Khôi Phục"
 british_isles.4001.desc:0 "[founder.GetPrimaryTitle.GetNameNoTierNoTooltip] không bao giờ dung thứ cho những kẻ xâm lược, bất kể là ai. Trong nhiều thế kỷ, chúng ta đã đấu tranh chống lại chúng, chiến đấu để giành lại quê hương. Với mưu lược và kỹ năng lớn lao, cuối cùng ta đã thành công trong việc giành lại vùng đất Dumnonia cổ xưa, tái lập Vương quốc [founder.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\nMối đe dọa ngoại bang đã bị đẩy lùi, sự sụp đổ của Britannia cổ đại đã bị vượt qua, và giờ đây ta sẵn sàng đối mặt với bất cứ thử thách mới nào mà [founder.GetFaith.DevilName] có thể ném vào chúng ta. Dù chuyện gì xảy ra, [founder.GetPrimaryTitle.GetNameNoTierNoTooltip] sẽ trường tồn."
 british_isles.4001.a:0 "Ta như Corineus tái sinh!"
 british_isles.4001.b:0 "Vương quốc của ta là danh hiệu duy nhất quan trọng."
 british_isles.4002.desc:0 "Sau nhiều thế kỷ đấu tranh, [founder.GetFullName] đã khôi phục vương quốc cổ Dumnonia, được cư dân gọi là [founder.GetPrimaryTitle.GetNameNoTier] và đẩy lùi những kẻ xâm lược ngoại bang khỏi hòn đảo của họ.\n\nDù các lãnh chúa khác của Quần đảo Anh khó có thể chấp nhận thế lực mới nổi này xâm phạm những vùng đất mà họ coi là của tổ tiên, người dân [founder.GetPrimaryTitle.GetAdjective] đã từng chống chịu những cuộc xâm lăng tệ hại hơn nhiều so với bất cứ điều gì thời đại này có thể mang lại. Ngay lúc này, họ đã chuẩn bị để chống lại cuộc trả đũa khắc nghiệt không thể tránh khỏi..."
 british_isles.4002.a:0 "Onen hag oll!"
 british_isles.4002.b:1 "Chúng ta sẽ đẩy chúng về tận Land's End."
 british_isles.4002.c:0 "Các vương quốc nhỏ bé đến rồi đi."


 british_isles.1011.t:0 "Một Thỏa Thuận Không Tưởng"
 british_isles.1011.nord:0 "$k_england$ là một vùng đất khó khăn nhưng màu mỡ: mùa đông ôn hòa và mùa hè ẩm ướt, một nơi hoàn hảo để những người thực dân và chiến binh phát triển.\n\nTuy nhiên, sự cạnh tranh từ những người Bắc Âu khác và sự kháng cự từ các chính thể bản địa còn lại ngày càng trở nên khốc liệt qua từng năm. Tất cả chúng ta đều đang tranh giành chỗ đứng, tự tạo cho mình những thái ấp nhỏ và các [ntd_actor.Custom('QueenKing')]dom nhỏ bé, không thể đạt được quyền thống trị thực sự."
 british_isles.1011.brit:0 "Mỗi năm, sự tàn phá của người Bắc Âu lại trở nên tồi tệ hơn. Họ gửi thêm người định cư, cướp bóc xa hơn dọc bờ biển của chúng ta, và tàn sát thêm nhiều giáo sĩ.\n\nDù vậy, việc đoàn kết chống lại mối đe dọa ngoại bang lại vô cùng khó khăn. Giữa những kẻ chinh phục Norse và lòng kiêu hãnh cay đắng của các lãnh chúa $anglo_saxon$, dường như chúng ta sẽ không bao giờ có một [ntd_actor.Custom('QueenKing')] của $k_england$."
 british_isles.1011.outro:0 "\n\nKẻ thù của ta, [ntd_recipient.GetTitledFirstName], là đối thủ lớn nhất trong cuộc tranh giành quyền cai trị vùng đất này. Nếu [ntd_recipient.GetSheHe] đồng ý #EMP phân chia#! đất nước thay vì tranh đoạt nó, sẽ có rất ít người có thể chống lại sức mạnh kết hợp của chúng ta..."
 british_isles.1011.a:0 "Hmm. Gửi bức thư."
 british_isles.1011.a.tt:0 ""
 british_isles.1011.b:0 "Bức thư, cùng một bàn tay hữu nghị rộng mở."
 british_isles.1011.b.above_applies.tt:0 "#BOL Tất cả hiệu ứng của thỏa thuận trên đều được áp dụng.#!"
 british_isles.1011.b.offer_faith.tt:0 "Ngài cũng đề nghị chia sẻ [faith|E] của mình và trở thành [friends|E]"
 british_isles.1011.c:0 "Ngoại giao là con đường của kẻ hèn!"
 british_isles.1011.c.tt:0 ""

 british_isles.1021.t:0 "$british_isles.1011.t$"
 british_isles.1021.intro:0 "[ntd_actor.GetTitledFirstName] có lẽ là đối thủ lớn nhất của ta trong việc giành quyền cai trị $k_england$.\n\nVì thế, một bức thư viết tay của [ntd_actor.GetHerHis] kèm theo con dấu của [ntd_actor.GetHerHis], đề nghị chia đôi vương quốc với ta, gần như là điều cuối cùng ta mong đợi hôm nay.\n\n"
 british_isles.1021.nord:0 "Kẻ thù của ta đề nghị công nhận và ủng hộ quyền tự trị của người Nord, cùng một vương quốc riêng cho ta với tước vị [ntd_recipient.Custom('QueenKing')], ngang hàng với [ntd_actor.GetHerHis]. Những vùng đất nơi ta hoặc đồng loại của ta cai trị sẽ nằm dưới quyền tài phán của #EMP ta#!."
 british_isles.1021.brit:0 "Kẻ thù của ta đề nghị công nhận ta là [ntd_recipient.Custom('QueenKing')] của $k_england$, nếu ta đồng ý ủng hộ quyền tự trị của người Nord và thừa nhận [ntd_actor.GetHerHis] có địa vị ngang hàng tại những vùng đất nơi [ntd_actor.GetSheHe] đã nắm giữ lãnh thổ."
 british_isles.1021.outro:0 "\n\nTa phải thừa nhận, ý nghĩ về một vương miện hoàng gia trên đầu mình thật... hấp dẫn."
 british_isles.1021.a:0 "Một vương miện mà không ai có thể phủ nhận, ngươi nói vậy sao?"
 british_isles.1021.a.accepted:0 "Thỏa Thuận Được Chấp Nhận"
 british_isles.1021.a.accepted.tt:0 "Ngài và [ntd_recipient.GetTitledFirstNameNoTooltip] chia đôi vương quốc giữa hai người"
 british_isles.1021.b:0 "Có lẽ... có lẽ đã #EMP đến#! lúc thay đổi..."
 british_isles.1021.b.above_applies.tt:0 "$british_isles.1011.b.above_applies.tt$"
 british_isles.1021.b.accepted.critical:0 "Thỏa Thuận #EMP và#! Tình bạn Được Chấp Nhận"
 british_isles.1021.b.accepted.critical.tt:0 "$british_isles.1021.a.accepted.tt$"
 british_isles.1021.c:0 "Thật nhảm nhí! Hãy để cả thế giới thấy sự hèn nhát của [ntd_actor.GetHerHis]!"
 british_isles.1021.c.rejected:0 "Thỏa Thuận Bị Từ Chối"
 british_isles.1021.c.rejected.tt:0 "Cả thế giới biết đến sự phản bội của Ngài"
 british_isles.1021.invalidation.t:0 "Thỏa Thuận Của Ngài Đã Bị Vô Hiệu"
 british_isles.1021.invalidation.tt:0 "Nó có thể được đề xuất lại thông qua bảng '$DECISIONS_VIEW_TITLE$'"

 negotiate_the_danelaw_each_way_effect.accepted:0 "Nếu thỏa thuận được chấp nhận"
 negotiate_the_danelaw_each-way_effect.rejected:0 "Nếu thỏa thuận bị từ chối"
 negotiate_the_danelaw_accept_effect.partition_active.tt:0 "$k_england$ và $k_danelaw_article$$k_danelaw$ được [de_jure_partitioned|E]"
 negotiate_the_danelaw_accept_effect.de_jure_holdings_recognised.tt:0 "Tất cả [duchies|E] $k_england_adj$ mà [ntd_nord.GetTitledFirstName] nắm giữ ít nhất một [county|E] sẽ trở thành một phần [de_jure|E] của $k_danelaw_article$$k_danelaw$"
 negotiate_the_danelaw_accept_effect.independent_holdings_recognised.tt:0 "Tất cả [duchies|E] $k_england_adj$ độc lập có [ruler|E] thuộc [culture|E] $north_germanic_group$ hoặc [faith|E] $germanic_religion$ trở thành một phần [de_jure|E] của $k_danelaw_article$$k_danelaw$"
 negotiate_the_danelaw_accept_effect.riled_independents_list:0 "Tất cả các lãnh chúa độc lập trong $k_england$"
 TRUCE_SIGNED_PARTITION:1 "\nĐình chiến được ký kết như một phần của việc phân chia vương quốc"

 resolve_danelaw_partition_effect.adjust_de_jures.tt:0 "Tất cả các phần [de_jure|E] của $k_danelaw_article$$k_danelaw$ được [de_jure_drift_drifted|E] vào $k_england$"
 resolve_danelaw_partition_effect.coa_changed.tt:0 "$k_england$ sẽ sử dụng huy hiệu của $k_danelaw_article$$k_danelaw$"
 resolve_danelaw_partition_effect.all_claimants:0 "Tất cả những người tuyên bố quyền"

 formalise_the_daneland_effect.partition_status.tt:0 "$k_england$ và $k_danelaw_article$$k_danelaw$ không còn được coi là [de_jure_partitioned|E]"
 formalise_the_daneland_effect.adjust_de_jures.tt:0 "Tất cả các phần [de_jure|E] của $k_danelaw_article$$k_danelaw$ được [de_jure_drift_drifted|E] vào $k_daneland$"
 formalise_the_daneland_effect.all_claimants:0 "Tất cả những người tuyên bố quyền"

 british_isles.1022.t:0 "$british_isles.1011.t$"
 british_isles.1022.desc:0 "Trong một nỗ lực củng cố quyền lực cá nhân của mình, có vẻ như [ntd_actor.GetTitledFirstName] và [ntd_recipient.GetTitledFirstName] đã ký một hiệp ước quỷ quyệt, chia đôi vương quốc $k_england$ giữa họ!\n\nTừ nay trở đi, các vùng hiện nằm dưới quyền kiểm soát của người Nord sẽ thuộc $k_danelaw_article$$k_danelaw$, trong khi các quốc gia bản địa còn lại được công nhận là lãnh thổ $k_england_adj$."
 british_isles.1022.a:0 "Đây là loại phản bội trơ trẽn nào đối với đất nước [dummy_gender.GetWomenMen] của họ vậy?"
 british_isles.1022.a.tt:0 "$k_england$ và $k_danelaw_article$$k_danelaw$ được [de_jure_partitioned|E]"

 british_isles.1051.t:0 "Một [partition_winner.GetTierAsNameNoTooltip] Thống Nhất"
 british_isles.1051.desc:0 "Cuối cùng thì không ai có thể tranh cãi quyền cai trị của ta với tư cách là [victor.GetTitleAsNameNoTooltip] #EMP chân chính#! của [england.GetNameNoTierNoTooltip]. Với quốc gia giả mạo đã bị giải quyết, quyền bá chủ tối cao của ta trên toàn Britannia gần như đã được đảm bảo."
 british_isles.1051.a:0 "Một vương quốc, một [victor.GetTitleAsNameNoTooltip]!"
 british_isles.1051.a.tt:0 "Sự [de_jure_partition|E] giữa $k_england$ và $k_danelaw_article$$k_danelaw$ chấm dứt"

 british_isles.1052.t:0 "$british_isles.1051.t$"
 british_isles.1052.desc:0 "[loser.GetFaith.FateGodName|U] đã giở một trò đùa tàn nhẫn với ta hôm nay, trao chiến thắng quyết định cho [victor.GetTitledFirstName] trong cuộc chiến giành $k_england$.\n\nDù ta không còn có thể tuyên bố cai trị những vùng đất từng thuộc về mình, chuyện này vẫn chưa kết thúc chừng nào dòng dõi ta còn tồn tại."
 british_isles.1052.a:0 "Sẽ #EMP có#! một sự thanh toán cho sự sỉ nhục này."
 british_isles.1052.a.tt:0 "$british_isles.1051.a.tt$"

 british_isles.1053.t:0 "$british_isles.1051.t$"
 british_isles.1053.desc:0 "Những biến cố gần đây đã khiến [victor.GetTitledFirstName] trở thành ứng cử viên nghiêm túc duy nhất cho ngai vàng $k_england_adj$. Dù chưa phải tất cả đều sẵn lòng cúi đầu trước vị quân vương đắc thắng, ít nhất có thể nói rằng $k_england$ về tinh thần đã lại trở nên thống nhất."
 british_isles.1053.a:0 "Cuối cùng cũng có ổn định cho $k_england$?"
 british_isles.1053.a.tt:0 "$british_isles.1051.a.tt$"

 british_isles.1061.t:0 "Luật Lệ Của Vùng Đất"
 british_isles.1061.desc:0 "Đã nhiều năm kể từ khi người Scandinavia lần đầu đặt chân đến những bờ biển trù phú này. Nhiều năm đổ máu, bạo lực và xung đột, nhưng cũng là những năm trao đổi, phát triển và hòa trộn.\n\nCon cháu của những người định cư đầu tiên giờ đây không còn thực sự là người Nord nữa, và người bản địa cũng không còn là những $anglo_saxon_collective_noun$ như khi người Scandinavia mới đến.\n\nChúng ta bây giờ là ai, có lẽ khó mà nói rõ.\n\nChỉ biết rằng chúng ta là tất cả những gì đã đến trước chúng ta, cả tốt lẫn xấu, và lịch sử của chúng ta từ nay sẽ là lịch sử của $k_daneland_adj$."
 british_isles.1061.a:0 "Chúng ta sẽ cùng nhau viết nên nó."

 british_isles.1062.t:0 "$british_isles.1061.t$"
 british_isles.1062.desc:0 "Tên khốn đó! Tên đê tiện đó! Tên [founder.Custom2('InsultAdjective', ROOT.Char)] [founder.Custom2('InsultAdjective', ROOT.Char)] #EMP [founder.Custom2('InsultNoun', ROOT.Char)]!#!\n\nDù các vương quốc $k_england$ và $k_danelaw_article$$k_danelaw$ đã bị chia cắt quá lâu, #EMP ai cũng#! biết rằng một ngày nào đó chúng sẽ được thống nhất lại.\n\nCho đến hôm nay.\n\nTrong một tuyên bố khoa trương và đầy kiêu ngạo, [founder.GetTitledFirstName] đã chính thức từ bỏ mọi yêu sách kiểm soát đối với $k_england$, và qua đó dập tắt mọi hy vọng dễ dàng tái thống nhất vương quốc của ta với các vùng đất của $k_danelaw_article$$k_danelaw$!"
 british_isles.1062.a:0 "Đất của [founder.GetHerHis|U] từng là $k_england_adj$, và #EMP sẽ#! lại là $k_england_adj$."

 british_isles.1063.t:0 "$british_isles.1061.t$"
 british_isles.1063.desc:0 "Từ nhiều năm nay, $k_england$ đã bị chia cắt giữa vùng đất của [england.GetTitledFirstName] và [founder.GetTitledFirstName]. Mặc dù trên danh nghĩa cả hai đều có địa vị ngang hàng, nhưng ngầm hiểu rằng mỗi vương quốc đều muốn loại bỏ bên kia và đưa quân chủ của mình lên làm vị vua duy nhất của một $k_england$ thống nhất.\n\nNhưng không còn nữa.\n\nTrong một hành động đầy kịch tính, [founder.GetTitledFirstNameNoTooltip] đã tuyên bố rằng [founder.GetSheHe] từ bỏ mọi yêu sách thống trị đối với phần còn lại của vương quốc, và từ nay về sau, [founder.GetSheHe] sẽ cai trị một vương quốc độc lập và có chủ quyền."
 british_isles.1063.a:0 "Có lẽ điều này sẽ làm dịu bớt vài cái đầu nóng..."
 british_isles.1063.a.tt:0 "$british_isles.1051.a.tt$"
