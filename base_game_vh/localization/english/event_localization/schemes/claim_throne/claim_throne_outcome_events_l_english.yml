l_english:
  do_not_execute_claim_throne_tooltip:0 "Ta sẽ không cố gắng Thống trị [target.GetPrimaryTitle.GetName]"

 # Distant Relation
  claim_throne_outcome.1001.t:0 "Tuyên Bố Quyền Thống"
  claim_throne_outcome.1001.desc:0 "Sau tất cả những nỗ lực của Ta, cuối cùng cũng đến lúc trình ra bằng chứng mà Ta “tìm thấy”, rằng thực ra Ta là người thừa kế hợp pháp của [target_title.GetName] thông qua một cuộc hôn nhân dòng tộc cổ xưa.\n\n[target.GetTitledFirstName] sẽ chẳng là gì ngoài một kẻ giả danh nếu [target.GetSheHe] cản đường Ta!"
  claim_throne_outcome.1001.a:1 "Chẳng bao lâu nữa Ta sẽ cai trị [target.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
  claim_throne_outcome.1001.b:0 "Có lẽ Ta quá vội vàng…"

  claim_throne_outcome.2001.opening:0 "Cuối cùng, không ai có thể nghi ngờ việc Ta có quyền hợp lý với [target_title.GetName]!"
  claim_throne_outcome.2001.discovered:0 "\n\nMặc dù [target.GetTitledFirstName] tin rằng tuyên bố về cuộc hôn nhân dòng tộc cổ xưa của Ta hoàn toàn là bịa đặt, điều quan trọng là [target.GetSheHe] không thể bác bỏ nó."
  claim_throne_outcome.2001.no_awareness:0 "\n\nDù chi tiết về cuộc hôn nhân dòng tộc cổ xưa bị phủ mây thời gian, nhưng không có lý do gì để nghi ngờ tính xác thực của nó. Ngay cả [target.GetTitledFirstName] cũng phải thừa nhận quyền của Ta là hợp pháp."
  claim_throne_outcome.2001.a:0 "Không gì có thể ngăn Ta bây giờ!"
  claim_throne_outcome.2001.b:0 "[target.GetFirstNameNoTooltip] có thể phàn nàn bao nhiêu tùy thích! Điều đó chẳng thay đổi được gì cả."

  claim_throne_outcome.4001.opening:0 "Quyền của Ta với [target_title.GetName] không thuyết phục được ai cả!"
  claim_throne_outcome.4001.owner_discovered:0 "\n\nĐiều tồi tệ hơn, [target.GetTitledFirstName] đã phát hiện ra nỗ lực của Ta trong việc bịa ra hồ sơ hôn nhân giữa triều đại [ROOT.Char.GetDynasty.GetBaseName] và triều đại cai trị cũ của [target_title.GetNameNoTierNoTooltip]!"
  claim_throne_outcome.4001.owner_secret:0 "\n\nDù các hồ sơ hôn nhân giữa triều đại [ROOT.Char.GetDynasty.GetBaseName] và triều đại cai trị cũ của [target_title.GetNameNoTierNoTooltip] bị coi là không chính xác, ít nhất không ai biết rằng chính Ta là người đã tạo ra chúng."
  claim_throne_outcome.4001.a:0 "\"Ta chỉ muốn tham gia vào vinh quang của gia tộc ngươi, thưa Chúa Tể!\""
  claim_throne_outcome.4001.b:0 "Ta sẽ dành thời gian cần thiết cho việc này."
  claim_throne_outcome.4001.c:0 "Trò chơi này mà ta đang tham gia quá nguy hiểm."


 # Relation to Mythical Founder
  claim_throne_outcome.1002.desc:0 "Giờ đây Ta có bằng chứng gần như không thể chối cãi rằng Ta thuộc dòng dõi của chính [ROOT.Char.Custom('ClaimThroneMythicalFounder')] [ROOT.Char.Custom('ClaimThroneMythicalFounderHerselfHimself')]!\n\nNgay cả [target.GetTitledFirstName] cũng không thể phủ nhận tính chính đáng trong tuyên bố quyền cai trị [target_title.GetName] của Ta."

  claim_throne_outcome.2002.discovered:0 "\n\nMặc dù [target.GetTitledFirstName] tin rằng việc truy nguồn dòng dõi của Ta đến [ROOT.Char.Custom('ClaimThroneMythicalFounder')] hoàn toàn là giả, [target.GetSheHe] không thể bác bỏ điều đó, và đó là tất cả những gì quan trọng."
  claim_throne_outcome.2002.no_awareness:0 "\n\nVới dòng dõi truy về [ROOT.Char.Custom('ClaimThroneMythicalFounder')], ai có thể thấy quyền của Ta là phi lý?"

  claim_throne_outcome.4002.owner_discovered:1 "\n\nViệc [target.GetTitledFirstName] bác bỏ quan hệ của Ta với vị vua cổ xưa [owner.Custom('ClaimThroneMythicalFounder')] dễ dàng hơn Ta tưởng. [target.GetSheHe|U] thậm chí biết rằng tất cả “bằng chứng” của Ta hoàn toàn là giả mạo!"
  claim_throne_outcome.4002.owner_secret:1 "\n\nKhông ai tin rằng Ta có thể là hậu duệ của vị vua cổ xưa [owner.Custom('ClaimThroneMythicalFounder')], nhưng ít nhất [target.GetTitledFirstName] có vẻ không biết rằng tất cả “bằng chứng” của Ta đều được bịa ra ngay từ đầu."
  claim_throne_outcome.4002.a:0 "\"Ta chỉ muốn chia sẻ vinh quang, thưa Chúa Tể!\""


 # Chosen by previous ruler
  claim_throne_outcome.1003.desc:0 "Ta có vài nhân chứng sẽ thề với [ROOT.Char.GetFaith.PantheonTerm] rằng [previous_title_holder.GetTitledFirstName], vị [previous_title_holder.GetTitleAsNameNoTooltip] cũ của [target_title.GetNameNoTier], đã có mong muốn cuối cùng là [target.Custom('RealmType')] nên được trao cho ta.\n\nTrong khi [target.GetTitledFirstName] khó có khả năng thừa nhận yêu sách của ta, nhưng thực ra không phải [target.GetHerHim] là người ta cần thuyết phục..."

  claim_throne_outcome.2003.discovered:0 "[target.GetTitledFirstName] đã công khai lên án lời hứa của cựu [previous_holder.GetTitledFirstName] với Ta là những lời nói dối tuyệt vọng, nhưng đó là lời của [target.GetHerHis] chống lại những lời thề thiêng liêng đứng về phía Ta."
  claim_throne_outcome.2003.no_awareness:0 "Với lời hứa của cựu [previous_holder.GetTitledFirstNamePossessive] dành cho Ta, và nhiều người sẵn sàng thề rằng họ đã chứng kiến, không có gì [target.GetTitledFirstName] có thể làm ngoài việc thừa nhận. [target.GetSheHe|U] có thể không dễ dàng từ bỏ [target.GetTierAsNameNoTooltip], nhưng Ta cũng không thể bị từ chối."
  claim_throne_outcome.4003.owner_discovered:0 "\n\nDưới áp lực từ [target.GetTitledFirstName], tất cả những người từng thề rằng cựu [previous_holder.GetTitledFirstName] hứa sẽ để Ta làm người thừa kế của [previous_holder.GetHerHis] bỗng thay đổi ý định! Thay vào đó, họ giờ cho rằng Ta đã hối lộ họ để làm vậy! Dù điều đó có thật, nhưng đây là một sự phản bội hoàn toàn đáng khinh."
  claim_throne_outcome.4003.owner_secret:0 "\n\nDưới áp lực từ [target.GetTitledFirstName], tất cả những người từng thề rằng cựu [previous_holder.GetTitledFirstName] hứa sẽ để Ta làm người thừa kế của [previous_holder.GetHerHis] đã rút lại lời tuyên bố. Tuy nhiên, vì [target.GetFirstNameNoTooltip] chưa buộc tội Ta điều gì, [target.GetSheHe] chắc hẳn lo rằng có thể đã có phần sự thật."
  claim_throne_outcome.4003.a:0 "Ngày nay chẳng còn ai đáng tin sao?"

 # Response events for target
  claim_throne_outcome.5001.opening:0 "Người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))] của Ta, [owner.GetTitledFirstName], đã tuyên bố quyền với [target_title.GetName]!"
  claim_throne_outcome.5001.distant_relation:0 "\n\nHóa ra có một cuộc hôn nhân chiến lược giữa các triều đại của chúng ta vài thế hệ trước, mà [owner.GetSheHe] giờ đang tận dụng thành tranh chấp thừa kế."
  claim_throne_outcome.5001.mythical_founder:0 "\n\n[owner.GetFirstNameNoTooltip] tuyên bố là hậu duệ của không ai khác ngoài [owner.Custom('ClaimThroneMythicalFounder')]! [owner.GetSheHe|U] tin rằng đó là tất cả lý do [owner.GetSheHe] cần để được chỉ định là người cai trị [target_title.GetNameNoTooltip]."
  claim_throne_outcome.5001.previous_holder_promise:0 "\n\n[owner.GetFirstNameNoTooltip] khẳng định [previous_holder.Custom2('RelationToMe', ROOT.Char)] đã thề trên giường tử của [previous_holder.GetHerHis] rằng [target_title.GetTierAsNameNoTooltip] phải truyền lại cho [owner.GetFirstNameNoTooltip]. Đáng lo, [owner.GetSheHe] đã tìm được vài người sẵn sàng thề thốt linh thiêng rằng điều đó là thật."
  claim_throne_outcome.5001.fallback:0 "\n\n[owner.GetFirstNameNoTooltip] từ chối nói bằng chứng dựa trên gì, nhưng [owner.GetSheHe] từ chối nhượng bộ!"
  claim_throne_outcome.5001.discovered:0 "\n\nNhững tuyên bố này hoàn toàn bịa đặt, nhưng có đủ sự mơ hồ để tạo ra mối đe dọa thực sự, nếu người khác ủng hộ!"
  claim_throne_outcome.5001.a:0 "Như thể Ta sẽ từ bỏ lãnh thổ mà không chiến đấu!"
  claim_throne_outcome.5002.a:0 "[owner.GetSheHe] thật sự nghĩ [owner.GetSheHe] sẽ thoát khỏi việc này sao?!"
  claim_throne_outcome.5003.opening:0 "Người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))] của Ta, [owner.GetTitledFirstName], đã cố gắng tuyên bố quyền với [target_title.GetName]!"
  claim_throne_outcome.5003.owner_known:0 "\n\nNhững tuyên bố này thật nực cười, và nếu đây là mức độ đe dọa duy nhất của [owner.GetFirstNamePossessiveNoTooltip], Ta chẳng có lý do gì để lo lắng."
  claim_throne_outcome.5003.a:0 "[owner.GetSheHe|U] sẽ trả giá cho sự hỗn xược này."

 # Other text
  claim_throne_invalidated:0 "Kế hoạch Thống trị kết thúc"
  claim_throne_target_died_tt:0 "[target.GetTitledFirstName] đã qua đời"
  claim_throne_target_lost_titles_tt:0 "[target.GetTitledFirstName] không còn đất đai"
  claim_throne_target_no_longer_liege_tt:0 "[target.GetTitledFirstName] không còn là Chúa Tể của Ta"
  claim_throne_invalidate_fallback_tt:0 "Ta không còn có thể tuyên bố quyền với ngai của [target.GetTitledFirstNamePossessive]"
