l_english:
 # Target is followed by ill omens
  claim_throne_ongoing.1001.t:0 "Điềm Gở"
  claim_throne_ongoing.1001.desc:0 "Rõ ràng Ta không đơn độc trong tham vọng thống trị [target_title.GetNameNoTooltip]! Những con quạ đã tụ tập trên mái của [target.GetTitledFirstNamePossessive] [target.Custom('ResidenceBuilding')], và vài đêm trước, ngay cả các vì sao cũng như rơi xuống khắp [target_title.GetNameNoTierNoTooltip].\n\nNgười dân và quý tộc thì thầm rằng đó là dấu hiệu cho thấy [target.GetFirstNameNoTooltip] đã mất sự ưa thích của [ROOT.Char.GetFaith.PantheonTerm]."
  claim_throne_ongoing.1001.a:0 "Đã đến lúc có một [target.GetTitleAsNameNoTooltip] mới!"
  claim_throne_ongoing.1001.b:0 "Chỉ có [ROOT.Char.GetFaith.AltPriestTermPlural] mới có thể giải thích những điềm này."
 # Gradually take on more responsibility in the realm
  claim_throne_ongoing.1002.t:0 "Quyền Lực Được Khẳng Định"
  claim_throne_ongoing.1002.desc:1 "Tham vọng giành [target_title.GetName] của Ta không chỉ đơn thuần là khát vọng quyền lực, mà vì Ta là người duy nhất có thể gánh vác trọng trách to lớn này! Ngay cả [target.GetTitledFirstName] cũng dường như nhận ra điều đó, khi [target.GetSheHe] giao cho Ta những nhiệm vụ ngày càng quan trọng trong phục vụ vương quốc.\n\nSớm thôi, Ta hầu như sẽ cai trị [target_title.GetTierAsNameNoTooltip] về mọi mặt, chỉ trừ danh nghĩa..."
  claim_throne_ongoing.1002.a:0 "\"Đừng lo, bệ hạ, Ta cũng sẽ lo việc này...\""
  claim_throne_ongoing.1002.b:0 "Mọi chuyện thực sự đang trở nên quá sức rồi."
 # Buying support from vassals
  claim_throne_ongoing.1003.t:0 "Giành Lòng Hộ Vệ"
  claim_throne_ongoing.1003.desc:0 "Ta nhận thức rõ rằng nếu Ta trở thành [target.GetTitleAsName] của [target_title.GetNameNoTier], Ta sẽ cần sự ủng hộ của các thần tử hiện tại nhiều hơn so với những gì [target.GetTitledFirstName] đang có.\n\nChứng minh sự hào phóng của Ta khi là [target.GetTitleAsName] có thể giúp tiến triển rất nhiều."
  claim_throne_ongoing.1003.a:0 "Không gì là quá tốt đối với những thần tử tương lai của Ta!"
  claim_throne_ongoing.1003.b:0 "Ta sẽ cần toàn bộ vàng bạc của mình cho cuộc đấu sắp tới."
 # Lunatic declares themselves ruler
  claim_throne_ongoing.1004.t:0 "Tuyên Bố Thống Trị"
  claim_throne_ongoing.1004.desc:0 "Có vẻ như Ta phải nỗ lực để giành quyền cai trị [target_title.GetName], nhưng thực ra Ta đã nắm trong tay một danh hiệu quyền lực còn lớn hơn.\n\nTa là [ROOT.Char.GetLadyLord|U] của Tất cả Củ Cải tại [target_title.GetNameNoTierNoTooltip]!"
  claim_throne_ongoing.1004.a:0 "Castellan, mang con dấu củ cải của ta đến!"
  claim_throne_ongoing.1004.b:0 "Không, không phải là [ROOT.Char.GetLadyLord] của tất cả Củ Cải tại [target_title.GetNameNoTierNoTooltip]..."
  claim_throne_ongoing.1004.b_flavor:0 "...mà là của cả thế giới!"

  claim_throne_ongoing.1005.t:0 "[ROOT.Char.GetLadyLord|U] của Củ Cải"
  claim_throne_ongoing.1005.desc:0 "Ta đã cho vài người hầu bị trừng phạt vì điều mà Ta nghĩ là sự chế giễu, khi họ gọi Ta là “Ngài Củ Cải”, nhưng giờ đây Nguyên Lãnh Sự của Ta đã chỉ cho Ta văn bản Ta từng soạn để khẳng định điều đó.\n\nCảm giác như một trò đùa tàn nhẫn mà thế giới đang chơi với Ta, nhưng cùng lúc có một ký ức mơ hồ đang khơi dậy trong những phần sương mù của tâm trí Ta..."
  claim_throne_ongoing.1005.a:0 "Cái gì… Ta đã làm gì vậy?"
  claim_throne_ongoing.1005.b:0 "Ta không mắc sai lầm. Tất cả các người sẽ tuân theo văn bản."

  claim_throne_ongoing.1006.t:0 "Ủng Hộ Kiên Định"
  claim_throne_ongoing.1006.desc:0 "Như nhiều việc khác, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))] của Ta, [friend.GetTitledFirstName], đồng quan điểm với Ta rằng [target.GetTitledFirstName] không xứng cai trị [target_title.GetNameNoTier].\n\n\"Ta có thể nghĩ ra những ứng viên tốt hơn nhiều,\" [friend.GetSheHe] thầm nói với Ta. \"Và ngươi đứng đầu trong số đó. Hãy ra lệnh, và ngươi có sự ủng hộ của ta.\""
  claim_throne_ongoing.1006.a:0 "Tình bạn là hình thức trung thành cao quý nhất."
  claim_throne_ongoing.1006.b:0 "Hãy dùng nỗ lực của mình để cho người khác biết Ta xứng đáng đến mức nào."

  claim_throne_ongoing.1007.t:0 "Quyền Lực Bằng Kiếm"
  claim_throne_ongoing.1007.desc:2 "Tin đồn về tham vọng kiểm soát [target_title.GetNameNoTier] đã bắt đầu lan truyền trong số các [GetPlayer.Custom( 'KnightCulturePluralNoTooltipLowercase' )] của vương quốc. Bất mãn gia tăng trong hàng ngũ khi nhiều người tin rằng đã đến lúc thay đổi.\n\nKhi căng thẳng này dâng cao, Ta được tiếp cận bởi không ai khác ngoài [scheming_knight.GetTitledFirstName], một trong số các [GetPlayer.Custom( 'KnightCulturePluralNoTooltipLowercase' )] của [target.GetTitledFirstNamePossessive]. \"Chiến binh của chúng ta xứng đáng nhận được tốt hơn thế này. Hứa sẽ đối xử công bằng với họ, cùng với một túi vàng hào phóng, và ngươi sẽ có thanh kiếm của ta.\""
  claim_throne_ongoing.1007.a:0 "Các $knight_culture_player_plural_no_tooltip_lowercase$ của ta sẽ luôn được ưu tiên!"
  claim_throne_ongoing.1007.b:1 "Một $knight_culture_player_no_tooltip_lowercase$ phản bội chúa tể mình thì không còn là $knight_culture_player_no_tooltip_lowercase$ nữa."

  claim_throne_ongoing.1008.t:0 "Lừa Mọi Người"
  claim_throne_ongoing.1008.desc:1 "Nỗ lực củng cố tuyên bố quyền thống trị [target_title.GetName] của Ta có lẽ có thể được trợ giúp bằng một chút mưu mẹo.\n\nMột lá thư tuyên bố tận thế gần đây đã lưu hành trong các vương quốc láng giềng . Với một chút giả mạo và kiên nhẫn, Ta chắc chắn có thể soạn một lá thư tương tự tuyên bố rằng Ta mới là người nên cai trị thay vì [target.GetTitledFirstName].\n\nNhưng Ta nên sử dụng lá thư đó như thế nào?"
  claim_throne_ongoing.1008.a:0 "Trình diễn công khai."
  claim_throne_ongoing.1008.b:1 "Chia sẻ với các thần tử đồng hành."
  claim_throne_ongoing.1008.c:0 "Không tham gia."
  claim_throne_ongoing.1008.c.tt:0 "Ngài nên dùng thời gian đó một cách khôn ngoan hơn."

  claim_throne_ongoing.1009.t:0 "Bị Bắt Quả Tang"
  claim_throne_ongoing.1009.desc:0 "Có vẻ như [fraud_catcher.GetTitledFirstName] đang cố gắng tạo tên tuổi cho [fraud_catcher.GetHerselfHimself] bằng cách tuyên bố lá thư gần đây của Ta chỉ là giả mạo và không có nội dung nào là đúng.\n\nTệ hơn nữa, [target.GetTitledFirstName] lại tin vào từng lời đó! Liệu Ta đã bị phát hiện?"
  claim_throne_ongoing.1009.a:0 "Đây chỉ là thử thách, và các người đã thất bại."
  claim_throne_ongoing.1009.b:0 "Sao dám buộc tội ta nói dối?"
  claim_throne_ongoing.1009.b.duel_success:0 "Ngươi lập luận thuyết phục"
  tooltip.claim_throne_ongoing.1009.b.duel_success:0 "Họ đều bị lừa"
  claim_throne_ongoing.1009.b.duel_failure:0 "Không ai tin"
  tooltip.claim_throne_ongoing.1009.b.duel_failure:0 "Ngươi không làm ai ấn tượng"
