l_english: 
  hostile_scheme_discovery.1001.t:1 "Âm Mưu Tại [ROOT.Char.Custom('GetCourt')|U]"
  hostile_scheme_discovery.1001.close_relation:0 "[spymaster.GetCouncilTitle] của Ta mang tin nghiêm trọng đến. [spymaster.GetSheHe|U] chắc chắn rằng [agent.GetTitledFirstName], chính [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))] của Ta, đang âm mưu chống lại Ta!"
  hostile_scheme_discovery.1001.close_relation_no_spymaster:0 "Tin nghiêm trọng đã đến. [agent.GetTitledFirstName], chính [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))] của Ta, đang âm mưu chống lại Ta!"
  hostile_scheme_discovery.1001.close_relation_spymaster_other_target:0 "[spymaster.GetCouncilTitle] của Ta mang tin nghiêm trọng đến. [spymaster.GetSheHe|U] chắc chắn rằng [agent.GetTitledFirstName], chính [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))] của Ta, đang âm mưu chống lại [spymaster.GetHerHim]!"
  hostile_scheme_discovery.1001.close_relation_other_target:0 "[spymaster.GetCouncilTitle] của Ta mang tin nghiêm trọng đến. [spymaster.GetSheHe|U] chắc chắn rằng [agent.GetTitledFirstName], chính [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))] của Ta, đang âm mưu chống lại [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('targeted_courtier'))] của Ta, [targeted_courtier.GetTitledFirstName]!"
  hostile_scheme_discovery.1001.close_relation_no_spymaster_other_target:0 "Tin nghiêm trọng đã đến. [agent.GetTitledFirstName], chính [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))] của Ta, đang âm mưu chống lại [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('targeted_courtier'))] của Ta, [targeted_courtier.GetTitledFirstName]!"
  hostile_scheme_discovery.1001.desc:0 "[spymaster.GetCouncilTitle] của Ta mang đến một phát hiện. [spymaster.GetSheHe|U] chắc chắn rằng [agent.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))] của Ta, đang âm mưu chống lại Ta!"
  hostile_scheme_discovery.1001.desc_no_spymaster:0 "Tin nghiêm trọng đã đến. Người ta phát hiện rằng [agent.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))] của Ta, đang âm mưu chống lại Ta!"
  hostile_scheme_discovery.1001.desc_other_target_spymaster:0 "[spymaster.GetCouncilTitle] của Ta mang đến một phát hiện. [spymaster.GetSheHe|U] chắc chắn rằng [agent.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))] của Ta, đang âm mưu chống lại [spymaster.GetHerHim]!"
  hostile_scheme_discovery.1001.desc_other_target:0 "[spymaster.GetCouncilTitle] của Ta mang đến một phát hiện. [spymaster.GetSheHe|U] chắc chắn rằng [agent.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))] của Ta, đang âm mưu chống lại [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('targeted_courtier'))] của Ta, [targeted_courtier.GetTitledFirstName]!"
  hostile_scheme_discovery.1001.desc_no_spymaster_other_target:0 "Tin nghiêm trọng đã đến. Người ta phát hiện rằng [agent.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))] của Ta, đang âm mưu chống lại [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('targeted_courtier'))] của Ta, [targeted_courtier.GetTitledFirstName]!"
  hostile_scheme_discovery.1001.a:0 "Hãy để kẻ phản bội lộ diện trước mọi người."
  hostile_scheme_discovery.1001.b:0 "Nhốt [agent.GetHerHim] vào tù!"
  hostile_scheme_discovery.1001.b.tt_not_your_courtier_or_vassal: "[agent.GetTitledFirstName] không phải là [courtier|E] hoặc [vassal|E] của Ngài"
  hostile_scheme_discovery.1001.c:0 "Dù đúng hay sai, Ta sẽ không buộc tội [agent.GetFirstNameNoTooltip]."
  hostile_scheme_discovery.1001.c.tt:0 "[agent.GetFirstNameNoTooltip] được tự do."

  hostile_scheme_discovery.1002.t:0 "Kẻ Âm Mưu Bị Phát Hiện!"
  hostile_scheme_discovery.1002.intro:0 "[spymaster.GetCouncilTitle] của Ta mang tin nghiêm trọng: đó là [owner.Custom2('MyCharacterIntroduction', ROOT.Char)]"
  hostile_scheme_discovery.1002.intro_no_spymaster:0 "Tin nghiêm trọng đã đến: [owner.Custom2('MyCharacterIntroduction', ROOT.Char)]"
  hostile_scheme_discovery.1002.murder:0 "đang âm mưu giết"
  hostile_scheme_discovery.1002.abduction:0 "đang âm mưu bắt cóc"
  hostile_scheme_discovery.1002.elope:0 "đang âm mưu trốn chạy với"
  hostile_scheme_discovery.1002.steal_back_artifact:0 "đang âm mưu đánh cắp một cổ vật từ"
  hostile_scheme_discovery.1002.fallback:0 "đang âm mưu chống lại"
  hostile_scheme_discovery.1002.a:0 "Kẻ [owner.Custom2('InsultAdjective', ROOT.Char)] đáng ghét!"

  hostile_scheme_discovery.2001.intro:0 "[spymaster.GetCouncilTitle] của Ta mang tin nghiêm trọng. Mặc dù chúng Ta chưa biết ai,"
  hostile_scheme_discovery.2001.intro_no_spymaster:0 "Tin nghiêm trọng đã đến. Mặc dù chưa biết ai,"
  hostile_scheme_discovery.2001.murder:0 "ai đó đang âm mưu giết"
  hostile_scheme_discovery.2001.abduction:0 "ai đó đang âm mưu bắt cóc"
  hostile_scheme_discovery.2001.fallback:0 "ai đó đang âm mưu chống lại"
  hostile_scheme_discovery.2001.elope:0 "ai đó đang âm mưu trốn chạy với"
  hostile_scheme_discovery.2001.steal_back_artifact:1 "ai đó đang cố đánh cắp từ"
  hostile_scheme_discovery.2001.depose: "ai đó đang âm mưu lật đổ"
  hostile_scheme_discovery.2001.target_other:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] của Ta, [target.GetTitledFirstName]!"
  hostile_scheme_discovery.2001.target_spymaster:0 "[target.GetHerHim]!\n\n\"Họ không biết họ đang đụng phải ai, [ROOT.Char.Custom('FormOfAddressForLiege')]. Họ nghĩ có thể giết #EMP Ta#!? Ta sẽ cho họ thấy. Ồ vâng, Ta sẽ làm.\""
  hostile_scheme_discovery.2001.target_me:0 "Ta!"
  hostile_scheme_discovery.2001.a:0 "Chúng ta phải ngăn kẻ xấu đằng sau việc này!"

  hostile_scheme_discovery.3001.t:0 "Điệp Viên Bị Phát Hiện!"
  hostile_scheme_discovery.3001.intro:0 "[agent.GetTitledFirstName], điệp viên của Ta tại [court_owner.GetTitledFirstNamePossessive] [scheme.GetName|l], đã bị phát hiện!"
  hostile_scheme_discovery.3001.imprisoned:0 "\n\nBây giờ [court_owner.GetTitleAsName] đã nhốt [agent.GetHerHim] lại."
  hostile_scheme_discovery.3001.accused:0 "\n\nBây giờ [agent.GetSheHe] bị coi là không đáng tin, và không thể giúp Ta nữa."
  hostile_scheme_discovery.3001.a:0 "Nguyền rủa [court_owner.GetTitledFirstNameNoTooltip], và [spymaster.GetCouncilTitle] của [court_owner.GetHerHis]!"

  hostile_scheme_discovery.3002.t:0 "Âm Mưu Bị Phát Hiện"
  hostile_scheme_discovery.3002.desc:0 "Sự tồn tại của kế hoạch [scheme.GetFullActionName] của Ta đã bị phát hiện!\n\nMặc dù vai trò của Ta chưa bị lộ, việc này sẽ khiến kế hoạch khó hoàn tất hơn nhiều."
  hostile_scheme_discovery.3002.a:0 "Trời ơi!"

  hostile_scheme_discovery.3003.t:0 "Vai Trò Bị Phát Hiện"
  hostile_scheme_discovery.3003.desc:0 "[target.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã phát hiện Ta là kẻ chủ mưu của âm mưu"
  hostile_scheme_discovery.3003.murder:0 "giết [target.GetHerHim]!"
  hostile_scheme_discovery.3003.abduction:0 "bắt cóc [target.GetHerHim]!"
  hostile_scheme_discovery.3003.elope:0 "trốn chạy với [target.GetHerHim]!"
  hostile_scheme_discovery.3003.steal_back_artifact:0 "đánh cắp cổ vật từ [target.GetHerHim]!"
  hostile_scheme_discovery.3003.fallback:0 "chống lại [target.GetHerHim]!"
  hostile_scheme_discovery.3003.a:0 "Chắc chắn đã có sự hiểu lầm!"

  hostile_scheme_discovery.4001.t:0 "Âm Mưu Bị Phát Hiện!"
  hostile_scheme_discovery.4001.opening:0 "Kế hoạch chống lại [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] của Ta, [target.GetTitledFirstName], đã bị phát hiện!"
  hostile_scheme_discovery.4001.end:0 "\n\nNgay cả [ROOT.Char.Custom('GetCourtierPlural')|l] của Ta cũng thì thầm phía sau lưng Ta, bất kỳ lòng tin hay tình cảm nào họ từng có với Ta đều bị sự tiết lộ phá hủy."
  hostile_scheme_discovery.4002.opening:0 "Kế hoạch giết [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] của Ta đã bị phát hiện! Bây giờ mọi người đều biết âm mưu giết [target.GetTitledFirstName]."
  hostile_scheme_discovery.4001.a:0 "Đây chắc chắn là một sự hiểu lầm lớn!"
  hostile_scheme_discovery.4001.b:0 "Ồ, Ta sẽ cho họ thấy Ta có thể đi bao xa."
 
