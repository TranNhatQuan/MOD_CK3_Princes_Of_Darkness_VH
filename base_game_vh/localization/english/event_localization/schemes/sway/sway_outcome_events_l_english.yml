l_english:
  sway_outcome.1001.t:0 "Thuyết Phục: Một Cơ Hội"
  sway_outcome.1001.desc:0 "Trong nỗ lực hướng [target.GetTitledFirstName] theo lợi ích của Ta, Ta đã tìm thấy một cơ hội. Ta nghĩ Ta có thể lập luận rằng mục tiêu của chúng Ta thực ra là giống nhau. Khi Ta soạn bức thư tiếp theo..."
  sway_outcome.1001.a:0 "...Ta nhấn mạnh những lợi ích chung đó."
  sway_outcome.1001.a.success:0 "[target.GetFirstNameNoTooltip] đã bị thuyết phục"
  sway_outcome.1001.a.failure:0 "[target.GetFirstNameNoTooltip] nhận ra nỗ lực của Ta"
  sway_outcome.1001.b:0 "...Ta cố gắng duy trì sự tinh tế."

  sway_outcome.1002.t:0 "Thuyết Phục: Niềm Tin Tôn Giáo"
  sway_outcome.1002.same_faith:0 "Ta vừa nảy ra một ý tưởng trong những nỗ lực hướng [target.GetTitledFirstName] theo ý muốn của ta.\n\nVới những lý lẽ xác đáng, ta có thể thuyết phục được [target.GetHerHim] rằng ta đang hành động không chỉ vì lợi ích của riêng mình, mà là vì lợi ích của [ROOT.Char.GetFaith.HighGodNameAlternate] [ROOT.Char.GetFaith.HighGodHerselfHimself]!"
  sway_outcome.1002.other_faith:0 "Ta đã nảy ra một ý tưởng trong nỗ lực hướng [target.GetTitledFirstName] theo lợi ích của Ta.\n\nCó lẽ Ta có thể lập luận rằng lợi ích của tất cả [target.GetFaith.GetAdherentNamePlural] là ủng hộ Ta, thay vì bất kỳ vị vua [ROOT.Char.GetFaith.GetAdjective] nào khác?"
  sway_outcome.1002.a:0 "Ta tin rằng mình có thể lập luận rất thuyết phục."
  sway_outcome.1002.b:0 "Có lẽ Ta nên chỉ giữ các nghi lễ ngoại giao."

  sway_outcome.1003.t:0 "Thuyết Phục: Thử Vận May"
  sway_outcome.1003.desc:0 "Ta vừa đọc xong bức thư mới nhất từ [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] và mỉm cười – [target.GetSheHe] dường như đã ấm lòng với Ta cuối cùng.\n\nMặc dù đây là một thành công, Ta bị cám dỗ dùng cơ hội này để tiến gần hơn..."
  sway_outcome.1003.a:0 "Đã đến lúc thử sức kỹ năng ngoại giao của Ta!"
  sway_outcome.1003.a.success:0 "[target.GetSheHe|U] đánh giá cao nỗ lực"
  sway_outcome.1003.a.failure:0 "[target.GetSheHe|U] cảm thấy bị xúc phạm"
  sway_outcome.1003.a_friend:0 "Ta sẽ để [friend.GetFirstNameNoTooltip] xử lý việc này."
  sway_outcome.1003.b:0 "Chiến thắng này đã đủ rồi."

  sway_outcome.2001.t:0 "Thuyết Phục: Hiểu Lầm"
  sway_outcome.2001.opening:0 "Hình như những nỗ lực ngoại giao của Ta với [target.GetTitledFirstName] đã gây ra một hiểu lầm lớn! Ta nhận được bức thư rõ ràng rằng [target.GetSheHe] nghĩ Ta đang theo đuổi một mục tiêu hoàn toàn khác..."
  sway_outcome.2001.not_interested_relation:0 "\n\n\"Ta là [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))] của Ngài, vì [target.GetFaith.HighGodNamePossessive] mà!\""
  sway_outcome.2001.not_interested_romantically:0 "\n\n\"Dù Ta cảm thấy được khen, nhưng Ta thấy sự quan tâm của Ngài không phù hợp với một [ROOT.Char.GetWomanMan] ở vị thế của Ngài.\""
  sway_outcome.2001.not_interested_horses:0 "\n\n\"Ta sẽ không bán những con ngựa thuần chủng của mình, dù Ngài có gửi bao nhiêu thư tâng bốc!\""
  sway_outcome.2001.not_interested_toll_exemptions:0 "\n\n\"Ta không thể cấp miễn phí phí trạm, dù Ngài hứa bao nhiêu thương mại!\""
  sway_outcome.2001.not_interested_friend:0 "\n\n\"Nghe có vẻ Ngài thật sự cần một người Ngài, và Ta e rằng Ta không thể là người đó với Ngài. Tuy nhiên, Ta có thể gợi ý rằng Ngài—\""
  sway_outcome.2001.not_interested_relics:0 "\n\n\"Ta sẽ không trao bất kỳ báu vật nào của Ta, dù Ngài có cầu nguyện bao nhiêu lần!\""
  sway_outcome.2001.end:0 "\n\nTa không cần đọc thêm để hiểu ý."
  sway_outcome.2001.a:0 "Tất cả chỉ là một hiểu lầm lớn!"

  sway_outcome.2002.t:0 "Thuyết Phục: Âm Mưu Xảo Quyệt"
  sway_outcome.2002.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] đã kết thúc mọi cuộc trò chuyện với Ngài.\"\n\nNhìn thấy sự quan tâm đột ngột của Ta, cùng lượng thư từ nhiều, như một dấu hiệu của âm mưu xảo quyệt, có vẻ như [target.GetSheHe] nghĩ rằng Ta đang âm mưu chống lại [target.GetHerHim]!"
  sway_outcome.2002.a:0 "Ta chỉ đang cố tạo ấn tượng tốt..."
