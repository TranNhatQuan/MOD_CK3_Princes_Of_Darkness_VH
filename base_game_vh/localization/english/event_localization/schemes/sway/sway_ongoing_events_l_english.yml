l_english:
  sway_ongoing.1001.t:0 "Thuyết Phục: Văn Hóa [target.GetCulture.GetNameNoTooltip]"
  sway_ongoing.1001.desc:2 "Một thường dân thuộc dòng dõi [target.GetCulture.GetNameNoTooltip] đã bị quấy rối trên đường phố [capital.GetNameNoTooltip] vì một lỗi nhỏ.\n\nBằng cách lên tiếng bảo vệ họ, Ta có thể thuyết phục [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], người cũng thuộc văn hóa [target.GetCulture.GetNameNoTooltip], về phẩm hạnh tốt của Ta, nhưng Ta có thể làm phật ý các đồng nghiệp [ROOT.Char.GetCulture.GetNameNoTooltip]..."
  sway_ongoing.1001.a:1 "[target.GetCulture.GetCollectiveNounNoTooltip] là những con người tốt."
  sway_ongoing.1001.b:1 "[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] có phẩm hạnh đạo đức vượt trội!"

  sway_ongoing.1002.t:0 "Thuyết Phục: Khen Ngợi"
  sway_ongoing.1002.desc:0 "Để khiến [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] dễ tiếp nhận hơn những nỗ lực tiếp cận [target.GetHerHim] của ta, ta có thể lồng ghép một lời khen vào bức thư tiếp theo gửi đến triều đình của [target.GetHerHis].\n\nChắc chắn ta sẽ phải nhắc đến ... của [target.GetHerHis]."
  sway_ongoing.1002.success.tt:0 "Theo quyết định của [friend.GetTitledFirstNameNoTooltip]:"
  sway_ongoing.1002.b:0 "Ta sẽ giữ nó ngắn gọn và chuyên nghiệp."

  sway_ongoing.1003.opening:0 "[target.Custom2('AppropriateGreeting', ROOT.Char)]"
  sway_ongoing.1003.desc:0 "Thư từ gần đây giữa chúng Ta là nguồn niềm vui cho Ta. Ta không thể không nghĩ rằng cả hai chúng Ta sẽ hưởng lợi từ việc giao tiếp nhiều hơn."
  sway_ongoing.1003.a:0 "Tuyệt vời!"

  sway_ongoing.1004.desc:0 "Thư từ gần đây của chúng Ta vẫn còn nhiều điều chưa hài lòng. Xin tránh những nhận xét cá nhân trong tương lai."
  sway_ongoing.1004.a:0 "Ôi không..."

  sway_ongoing.1005.t:0 "Thuyết Phục: [target.GetTitleAsNameNoTooltip] Lương Thiện"
  sway_ongoing.1005.desc:0 "Trong khi tiếp đãi các quý tộc từ những vùng gần xa, có vài cơ hội để thể hiện [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] dưới ánh sáng tốt.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], xin cho biết, ai là người [target.Custom('FormalComplimentAdjective')] nhất mà ngài từng nghe?\""
  sway_ongoing.1005.a:0 "[target.GetTitledFirstNameNoTooltip], không nghi ngờ gì!"
  sway_ongoing.1005.b:0 "Chà, tất nhiên là Ta rồi!"

  sway_ongoing.1006.t:0 "Thuyết Phục: Kẻ Xâm Nhập"
  sway_ongoing.1006.desc:0 "Ta được biết một số thường dân địa phương đang di chuyển đến [capital.GetNameNoTooltip], thủ đô của [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)].\n\nNgười dân, mới định cư hay không, khen ngợi Ta chắc chắn không làm tổn hại đến cách nhìn của [target.GetHerHis] về Ta..."
  sway_ongoing.1006.a:0 "\"Cầm lấy vàng này và đảm bảo tiếng nói của Ngài được nghe.\""
  sway_ongoing.1006.b:0 "Không đáng để làm vậy."

  sway_ongoing.5001.t:0 "Thuyết Phục: Cá Nhân Hóa"
  sway_ongoing.5001.desc:0 "Trong thư từ gần đây, [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] bày tỏ muốn tập trung hơn vào tham vọng và sở thích của [target.GetHerHis].\n\nTa #EMP có thể#! chắc chắn rằng các bức thư sắp tới sẽ chứa nhiều nội dung gần gũi với trái tim [target.GetHerHis]..."
  sway_ongoing.5001.diplomacy_lifestyle:0 "Ta nghĩ [target.GetSheHe] thích tập trung vào các vấn đề ngoại giao."
  sway_ongoing.5001.martial_lifestyle:0 "Ta nghe rằng [target.GetSheHe] đánh giá cao những chiến công quân sự."
  sway_ongoing.5001.stewardship_lifestyle:0 "Việc cai trị một lãnh thổ chắc chắn thu hút [target.GetHerHim]."
  sway_ongoing.5001.intrigue_lifestyle:0 "[target.GetSheHe|U] chắc chắn thích các mưu mẹo và âm mưu."
  sway_ongoing.5001.learning_lifestyle:0 "Ta tin rằng chẳng gì quyến rũ [target.GetHerHim] hơn một cuốn sách hay!"
  sway_ongoing.5001.a.tt:0 "Ta sẽ khéo léo đưa chủ đề này vào các bức thư sắp tới"
  sway_ongoing.5001.b:0 "Đó không phải là việc của Ta."

  sway_ongoing.5002.t:0 "Cá Nhân Hóa"
  sway_ongoing.5002.desc_opening:0 "Trong thư gần đây nhất, [owner.Custom2('MyCharacterIntroductionNoComma', target)] đã đề cập thoáng qua về"
  sway_ongoing.5002.desc_diplomacy:0 "một cuộc trò chuyện gần đây mà [owner.GetSheHe] đã có"
  sway_ongoing.5002.desc_martial:0 "tình trạng quân đội [owner.GetHerHis]"
  sway_ongoing.5002.desc_stewardship:0 "việc quản lý lãnh thổ [owner.GetHerHis]"
  sway_ongoing.5002.desc_intrigue:0 "những tinh tế của âm mưu triều đình"
  sway_ongoing.5002.desc_learning:0 "một cuốn sách mà [owner.GetSheHe] mới đọc"
  sway_ongoing.5002.desc_fallback:0 "một chủ đề không liên quan đến cuộc trò chuyện của chúng Ta"
  sway_ongoing.5002.desc_success:0 "– Ta không biết rằng [owner.GetSheHe] cũng quan tâm đến chủ đề này!"
  sway_ongoing.5002.desc_failure:0 "– như thể chủ đề này sẽ hấp dẫn Ta!"
  sway_ongoing.5002.desc_ending:0 "\n\nNhững bức thư này vốn dĩ mang tính ngoại giao nghiêm túc, nhưng dĩ nhiên đôi khi vẫn đi vào những chủ đề cá nhân hơn..."
  sway_ongoing.5002.a:0 "Hãy nói nhiều hơn về điều đó!"
  sway_ongoing.5002.b:0 "Ôi, #EMP làm ơn#! kể thêm đi!"
  sway_ongoing.5002.b.tt:0 "Chắc Ta sẽ chiều lòng [owner.GetHerHim]..."
  sway_ongoing.5002.c:0 "Ta sẽ trân trọng nếu chúng ta chỉ bàn về các chủ đề liên quan."

  sway_ongoing.5003.desc_opening:0 "Trong phản hồi của [target.GetHerHis], [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] đã khuyến khích Ta đi sâu vào các chủ đề cá nhân hơn!"
  sway_ongoing.5003.desc_nonsense:0 "\n\nGiờ Ta chỉ cần giả vờ rằng Ta biết gì về [owner.Custom('LifestyleFocusTopic')]..."
  sway_ongoing.5003.desc:0 "\n\nThật thú vị, [target.GetSheHe] cũng quan tâm đến [owner.Custom('LifestyleFocusTopic')]."
  sway_ongoing.5003.a:0 "Hãy nói nhiều hơn!"
  sway_ongoing.5003.b_diplomacy:0 "\"Vậy.. còn các chư hầu thì sao?\""
  sway_ongoing.5003.b_martial:0 "\"Vậy... còn kiếm thì sao?\""
  sway_ongoing.5003.b_stewardship:0 "\"Vậy... còn vàng thì sao?\""
  sway_ongoing.5003.b_intrigue:0 "\"Vậy... còn âm mưu thì sao?\""
  sway_ongoing.5003.b_learning:0 "\"Vậy... còn thư từ thì sao?\""
  sway_ongoing.5003.b.tt:0 "Hy vọng [target.GetSheHe] sẽ tin lời Ta!"
  sway_ongoing.5003.c:0 "Ta không thể làm điều này!"

  sway_ongoing.5004.desc:0 "Trong phản hồi của [target.GetHerHis], [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] yêu cầu Ta ngừng những câu hỏi cá nhân và chỉ giữ đúng chủ đề.\n\n\"Ta không đánh giá cao những cố gắng gây xao nhãng này,\" [target.GetSheHe] nói."
  sway_ongoing.5004.desc_nonsense:0 "\n\nCó lẽ cũng tốt thôi... dù sao Ta cũng chẳng biết nhiều về [owner.Custom('LifestyleFocusTopic')] mà."
  sway_ongoing.5004.a:0 "Cũng đáng thử một lần!"

  sway_ongoing.5005.desc:0 "Trong phản hồi mới nhất của [owner.GetHerHis], [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] thú nhận rằng [owner.GetSheHe] thật ra chẳng biết gì về chủ đề [owner.Custom('LifestyleFocusTopic')] và chỉ giả vờ để câu chuyện giữa chúng Ta thôi!"
  sway_ongoing.5005.a:0 "Kẻ nói dối! Nhưng Ta sẽ không nói ra, đừng lo."

  sway_ongoing.5006.desc:0 "Trong phản hồi mới nhất của [target.GetHerHis], [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] thú nhận rằng [target.GetSheHe] thật ra chẳng biết gì về chủ đề [target.Custom('LifestyleFocusTopic')] và chỉ giả vờ để câu chuyện giữa chúng Ta thôi!"

  sway_ongoing.5007.desc:0 "Bức thư mới nhất từ [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] bao gồm cả một đoạn dài về [owner.Custom('LifestyleFocusTopic')]! Ta chẳng ngờ [owner.GetSheHe] lại quan tâm đến những thứ này...\n\nBan đầu có lẽ Ta chỉ chiều lòng [owner.GetHerHim], nhưng giờ có lẽ đã quá sâu để rút lui..."
  sway_ongoing.5007.b.tt:0 "Hy vọng [owner.GetSheHe] sẽ tin lời Ta!"

  sway_ongoing.5009.desc_success:0 "Sau nhiều cuộc thảo luận với [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] về [owner.Custom('LifestyleFocusTopic')], và những nghiên cứu Ta phải làm để giả vờ thành chuyên gia, Ta nhận ra rằng chủ đề này không còn xa lạ với Ta như trước nữa!"
  sway_ongoing.5009.desc_owner_discovered:0 "Trong thư gần đây, [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] đã tỏ ra nghi ngờ rõ ràng về kiến thức thực sự của Ta về [owner.Custom('LifestyleFocusTopic')].\n\nKhi đọc thư mới nhất, Ta nhận ra mưu mẹo bị phát hiện — [target.GetSheHe] cứ lải nhải về 'sự thiếu hiểu biết rõ ràng' và 'một màn trình diễn ngu ngốc xấu hổ'."
  sway_ongoing.5009.desc_target_discovered:0 "Trong thư gần đây, [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] đã thể hiện sự thiếu hiểu biết xấu hổ về [owner.Custom('LifestyleFocusTopic')].\n\nVà nếu ngay cả Ta cũng nhận ra rằng [target.GetSheHe] đang nói nhăng nói cuội, thì thật là #EMP tệ!#!"
  sway_ongoing.5009.a:0 "Ta thực sự học được rất nhiều!"
  sway_ongoing.5009.b:0 "Oái."
  sway_ongoing.5009.c:0 "Đừng lo. Ta sẽ không nói với ai cả."

  sway_ongoing.5010.desc_success:0 "Sau nhiều cuộc thảo luận với [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] về [owner.Custom('LifestyleFocusTopic')], và những nghiên cứu Ta phải làm để giả vờ thành chuyên gia, Ta nhận ra rằng chủ đề này không còn xa lạ với Ta như trước nữa!"
  sway_ongoing.5010.desc_target_discovered:0 "Trong thư gần đây, [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] đã tỏ ra nghi ngờ rõ ràng về kiến thức thực sự của Ta về [owner.Custom('LifestyleFocusTopic')].\n\nKhi đọc thư mới nhất, Ta nhận ra mưu mẹo bị phát hiện — [owner.GetSheHe] cứ lải nhải về 'sự thiếu hiểu biết rõ ràng' và 'một màn trình diễn ngu ngốc xấu hổ'."
  sway_ongoing.5010.desc_owner_discovered:0 "Trong thư gần đây, [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] đã thể hiện sự thiếu hiểu biết xấu hổ về [owner.Custom('LifestyleFocusTopic')].\n\nVà nếu ngay cả Ta cũng nhận ra rằng [owner.GetSheHe] đang nói nhăng nói cuội, thì thật là #EMP tệ!#!"

  sway_ongoing.5011.t:0 "Thuyết Phục: Chuyến Thăm"
  sway_ongoing.5011.desc_opening:0 "Ta đi qua [capital.GetNameNoTooltip], thủ đô của [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], khi nhận được lời mời thăm [target.GetHerHis] [target.Custom('ResidenceBuilding')].\n\nKhi Ta đến"
  sway_ongoing.5011.desc_friendly:0 "[target.GetSheHe] chào đón Ta nồng hậu"
  sway_ongoing.5011.desc_dislike:0 "[target.GetSheHe] chào đón Ta với vẻ cau có"
  sway_ongoing.5011.desc_normal:0 "[target.GetSheHe] chào đón Ta với thái độ tôn trọng"
  sway_ongoing.5011.desc:0 "và một chuyến tham quan. Một điều làm Ta chú ý là nơi này đầy những dự án dang dở..."
  sway_ongoing.5011.a:0 "Ta sẽ ở lại một lúc."
  sway_ongoing.5011.a.tt:0 "Có thể Ta sẽ giúp được [target.GetHerHim]"
  sway_ongoing.5011.b:0 "Chỉ dẫn Ta đến phòng thôi."
  sway_ongoing.5011.b.tt:0 "Ta sẽ rời đi vào sáng mai"

  sway_ongoing.5013.desc_opening:0 "Một thư viện với sách xếp góc, dự án xây dựng dang dở khắp nơi – đặc biệt là một phòng ăn – và một rương vàng đứng giữa hành lang...\n\n[target.GetTitledFirstNamePossessive] [target.Custom('ResidenceBuilding')] thật lộn xộn!"
  sway_ongoing.5012.a_trait:0 "Ta sẽ sửa phòng ăn ngay."
  sway_ongoing.5012.a:0 "Ta nghĩ Ta có thể giúp phòng ăn."
  sway_ongoing.5012.a.tt:0 "[target.GetTitledFirstNameNoTooltip] sẽ phản ứng với hành động của Ngài"
  sway_ongoing.5012.a_success:0 "Ta thành công"
  sway_ongoing.5012.a_failure:0 "Ta chỉ làm tình hình tệ hơn"
  sway_ongoing.5012.b_trait:0 "Ta sẽ sắp xếp lại những cuốn sách này..."
  sway_ongoing.5012.b:0 "Những cuốn sách... Thật đáng thương!"
  sway_ongoing.5012.b.tt:0 "Ta sẽ cố dọn dẹp thư viện"
  sway_ongoing.5012.b_success:0 "Mọi thứ được sắp xếp ổn"
  sway_ongoing.5012.b_failure:0 "Ta chỉ làm mọi thứ lộn xộn hơn"
  sway_ongoing.5012.c:0 "Rương vàng đó #EMP thật#! không được bảo vệ."
  sway_ongoing.5012.c.tt:0 "Ta nên cảnh báo [target.GetHerHim]"
  sway_ongoing.5012.c_success:0 "[target.GetSheHe|U] chú ý lời cảnh báo của Ta"
  sway_ongoing.5012.c_failure:0 "[target.GetSheHe|U] nghĩ Ta đang tính toán gì đó"
  sway_ongoing.5012.d:0 "Ta sẽ đi ngủ."

  sway_ongoing.5013.desc_expansion_success:0 "Chỉ cần một chút chú ý – Ta nhanh chóng giúp [target.GetTitledFirstNamePossessiveNoTooltip] phòng ăn tiến gần đến hoàn thành."
  sway_ongoing.5013.desc_expansion_failure:0 "Dù nỗ lực hết sức, phòng ăn của [target.GetTitledFirstNamePossessiveNoTooltip] có vẻ còn tệ hơn khi Ta xong..."
  sway_ongoing.5013.desc_library_success:0 "Sách đóng bìa, tài liệu rời, gáy sách trang trí... Sau nhiều sắp xếp, cuối cùng thư viện [target.GetTitledFirstNamePossessiveNoTooltip] cũng có chút trật tự."
  sway_ongoing.5013.desc_library_failure:0 "Sách đóng bìa, tài liệu rời, gáy sách trang trí... Dù cố gắng thế nào Ta cũng không thể tìm ra trật tự trong đống lộn xộn của thư viện [target.GetTitledFirstNamePossessiveNoTooltip]."
  sway_ongoing.5013.desc_gold_success:0 "Khi Ta giải thích rủi ro của việc để rương vàng ở nơi công khai, mắt [target.GetTitledFirstNamePossessiveNoTooltip] mở to nhận ra.\n\n\"Ồ, tất nhiên không nên để ngoài kia! Cảm ơn [ROOT.Char.GetTitledFirstNameNoTooltip].\""
  sway_ongoing.5013.desc_gold_failure:0 "Khi Ta cố giải thích rủi ro của việc để rương vàng ngoài trời, Ta thấy mắt [target.GetTitledFirstNamePossessive] hẹp lại.\n\n\"Và tại sao #EMP anh#! lại nhìn rương vàng của Ta?\""
  sway_ongoing.5013.desc_steal_success:0 "\"Vàng của Ta! Vàng của Ta đâu rồi?!\"\n\nTa thấy [target.GetTitledFirstName] lo lắng đứng giữa hành lang, rương trống trước mặt [target.GetHerHim]. \"Ôi, [ROOT.Char.GetTitledFirstNameNoTooltip], giá mà Ta nghe lời anh!\""
  sway_ongoing.5013.desc_end_good:0 "\n\nTa đã làm tất cả trong khả năng để giúp [target.GetHerHim]."
  sway_ongoing.5013.desc_end_bad:0 "\n\nĐường đi có chông gai, nhưng Ta đã làm tất cả những gì có thể để giúp [target.GetHerHim]."
  sway_ongoing.5013.desc_good:0 "\n\nMọi việc trông ổn, và còn nhiều nơi Ta có thể giúp [target.GetHerHim]."
  sway_ongoing.5013.desc_bad:0 "\n\nMọi việc có thể chưa suôn sẻ, nhưng vẫn còn những lĩnh vực Ta có thể giúp!"
  sway_ongoing.5013.c:0 "Ta biết cách làm cho [target.GetHerHim] lắng nghe...!"
  sway_ongoing.5013.c.tt_intrigue:0 "Nếu điều gì đó xảy ra với vàng của [target.GetHerHis] thì sao..."
  sway_ongoing.5013.d:0 "#EMP Bây giờ#! là giờ đi ngủ."

  sway_ongoing.5014.desc_opening:0 "Ta thấy [target.GetTitledFirstName] ở lối vào, chờ tiễn Ta sáng nay. Khi Ta tiến đến, nghe [target.GetHerHim] lẩm bẩm với [target.GetHerselfHimself].\n\n"
  sway_ongoing.5014.desc_great:0 "\"[ROOT.Char.GetSheHe|U] tuyệt vời, [target.Custom('ResidenceBuilding')] như mới...\""
  sway_ongoing.5014.desc_good:0 "\"[ROOT.Char.GetSheHe|U] thực sự đã sửa sang nơi này\""
  sway_ongoing.5014.desc_bad:0 "\"[ROOT.Char.GetSheHe|U] thực sự làm hỏng nơi này\""
  sway_ongoing.5014.desc_failed_but:0 "nhưng"
  sway_ongoing.5014.desc_failed_dot:0 "–"
  sway_ongoing.5014.desc_failed_three:0 "[ROOT.Char.GetSheHe] phá hỏng thư viện, phòng ăn, #EMP và#! [ROOT.Char.GetSheHe] cố gắng ăn trộm vàng của Ta..."
