l_english:
 # For scripted loc
  own_court_language_scheme_key:1 "[ROOT.GetScheme.GetOwner.GetCourtLanguage.GetName]"
  liege_court_language_scheme_key:1 "[ROOT.GetScheme.GetOwner.GetLiege.GetCourtLanguage.GetName]"
  target_character_language_scheme_key:1 "[ROOT.GetScheme.GetTargetCharacter.GetCulture.GetLanguage.GetName]"
  own_court_language_scheme_key_no_tt:1 "[ROOT.GetScheme.GetOwner.GetCourtLanguage.GetNameNoTooltip]"
  liege_court_language_scheme_key_no_tt:1 "[ROOT.GetScheme.GetOwner.GetLiege.GetCourtLanguage.GetNameNoTooltip]"
  target_character_language_scheme_key_no_tt:1 "[ROOT.GetScheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip]"

  learn_language_ongoing.1000.t:1 "$learn_language$: Sự Dễ Dàng của Tuổi Trẻ"
  learn_language_ongoing.1000.desc:3 "Việc học ngôn ngữ [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] của Ta tiến triển rất tốt — Ta cảm thấy như mình có tất cả sự tập trung và năng lượng trên đời!\n\n"Tên... Ta... là... [fast_learner.GetFirstNameNoTooltip]!"\n\n"Ta... thích... ăn... [fast_learner.Custom('FavoriteTreatDemand')]!"\n\nNếu Ta chỉ #EMP tập trung hơn nữa#!, Ta sẽ nói lưu loát trong nháy mắt!"
  learn_language_ongoing.1000.a:0 "Ta sẽ dành #EMP tất cả#! thời gian cho việc này!"
  learn_language_ongoing.1000.b:0 "Ta muốn dành thời gian vào việc khác hơn..."
 
  learn_language_ongoing.1010.t:1 "$learn_language$: Một Hiểu Lầm Lãng Mạn"
  learn_language_ongoing.1010.desc:4 "\"-và vì vậy [ROOT.Char.GetTitleTierName] thảo luận về [ROOT.Char.Custom('education_conversation_subject')] với hội đồng, trong khi [scheme.GetTargetCharacter.GetCouncillorPosition( 'councillor_steward' ).GetPositionName] tiến hành...\"\n\nTa giật mình ngẩng lên từ cuốn sách [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName], chỉ để nhận ra [lover_target.GetFirstName] đỏ mặt đang nghiêng về phía Ta.\n\n"Oh TRỜI, có phải Ngài đang nói #EMP [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip]#! không?" [lover_target.GetSheHe] nói. \"Ngài biết không... [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip] là ngôn ngữ của tình yêu — và nếu Ta không nghe nhầm, Ngài vừa gọi Ta là một [lover_target.Custom('RomanticComplimentAdjective')] [lover_target.Custom('RomanticComplimentNoun')]? Ngài [ROOT.Char.Custom('RomanticComplimentNoun')], Ngài!\""
  learn_language_ongoing.1010.a:0 "...vâng, vâng tất nhiên là Ta đã nói! Đó chính xác là điều Ta muốn nói!"
  learn_language_ongoing.1010.b:0 "Không, không! Tất cả chỉ là một hiểu lầm!"
  learn_language_ongoing.1010.c:0 "Đi đi, [lover_target.Custom2('InsultNounSexual', ROOT.Char)]. Ta phải tập trung!"
 
  outside_help_modifier:0 "Sự Giúp Đỡ Bên Ngoài"
  learn_language_ongoing.1020.c.success:0 "Ngài thuyết phục [language_helper.GetFirstNameNoTooltip] giúp Ngài"
  learn_language_ongoing.1020.c.failure:0 "[language_helper.GetFirstNameNoTooltip] nhìn thấu sự thao túng của Ngài"
  learn_language_ongoing.1020.t_hash_collision:1 "$learn_language$: Sự Giúp Đỡ Bên Ngoài"
  learn_language_ongoing.1020.desc:3 "Có vẻ như việc học ngôn ngữ [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] của Ta đã lọt vào tai [language_helper.GetTitledFirstName]. [language_helper.GetSheHe|U] là người bản ngữ, và sẵn sàng giúp Ta trong việc học.\n\n\"Ta không yêu cầu gì ngoài một phần thưởng tượng trưng cho nỗ lực của Ta, [ROOT.Char.GetTitleTierName].\" [language_helper.GetSheHe|U] nói, [language_helper.Custom('quirk_pos_pp')]."
  learn_language_ongoing.1020.a:0 "Nếu Ngài giúp, vàng này sẽ là của Ngài."
  learn_language_ongoing.1020.b:0 "Một ân huệ đổi lấy một ân huệ?"
  learn_language_ongoing.1020.c:0 "Ôi, Ngài thật #EMP vị tha#! sẵn sàng giúp Ta miễn phí!"
  learn_language_ongoing.1020.d:0 "Cảm ơn, nhưng Ta có thể tự lo được."
 
  learn_language_ongoing.1020.b.success:0 "[chosen_peasant.GetFirstName] đồng ý thỏa thuận"
  learn_language_ongoing.1020.b.failure:0 "[chosen_peasant.GetFirstName] cảm thấy bị xúc phạm bởi đề nghị của Ngài"
  gain_artifact_tt:0 "Ngài nhận được [newly_created_artifact.GetName] [artifact|E]"
  steal_artifact_tt:0 "Ngài đánh cắp [newly_created_artifact.GetName] [artifact|E]"
  learn_language_ongoing.1030.t:1 "$learn_language$: Một Giáo Trình Cũ"
  learn_language_ongoing.1030.desc:3 "[chosen_peasant.GetTitledFirstName] đến gặp Ta, [chosen_peasant.Custom('quirk_pos_pp')].\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], Ta nghe nói ngài đang học ngôn ngữ [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName]. Cha Ta là thương gia, và ông ấy có thể học bất kỳ ngôn ngữ nào trong thời gian ngắn!\" [chosen_peasant.GetSheHe] nói.\n\n\"Bí quyết của ông ấy nằm trong cuốn giáo trình này. Ta không dùng tới, vì Ta không đọc được. Ta sẽ để nó đi với một số tiền hợp lý.\""
  learn_language_ongoing.1030.a:0 "Thú vị. Ta sẽ trả."
  learn_language_ongoing.1030.b:0 "Có lẽ yêu cầu của Ngài hơi... đắt đỏ."
  learn_language_ongoing.1030.c:0 "Một món quà tốt! Vệ sĩ, lấy nó từ [chosen_peasant.GetHerHim]."
  learn_language_ongoing.1030.d:0 "Chuyện nhảm nhí! Cút đi, kẻ lừa đảo!"
 
  learn_language_ongoing.1040.t:1 "$learn_language$: Sự Ngưỡng Mộ"
  learn_language_ongoing.1040.desc:3 "[target.GetTitledFirstName], người mà ta vẫn luôn nỗ lực noi theo trong nỗ lực học hỏi ngôn ngữ [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName], dạo gần đây đã bắt đầu gửi thư tín cho ta.\n\nTa đã nhận được nhiều bức thư trong đó [target.GetSheHe] hết lời khen ngợi nỗ lực học ngôn ngữ của [target.GetHerHis], gọi đó là những cố gắng đáng trân trọng và đáng khâm phục!\n\nThật tốt biết bao khi công lao khổ luyện của ta đã được ghi nhận!"
  learn_language_ongoing.1040.a:0 "Người viết! Gửi lời cảm ơn của Ta."
  learn_language_ongoing.1040.b:0 "Chữ viết của [target.GetFirstNamePossessiveNoTooltip] thật thú vị..."
  learn_language_ongoing.1040.c:0 "Bah! Ta không cần sự công nhận từ ai ngoài #EMP chính mình!#!"
 
  extra_success_chance_modifier:0 "Tăng Cơ Hội Thành Công"
  massive_extra_success_chance_modifier: "Tăng Cực Lớn Cơ Hội Thành Công"
  tutorial_success_chance_modifier: "$extra_success_chance_modifier$"
  learn_language_ongoing.1050.t:1 "$learn_language$: Nếp Nhăn Ở Góc Mắt"
  learn_language_ongoing.1050.desc:3 "Những ghi chú quý giá về [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] của Ta vương vãi khắp phòng học, và con quạ ngâm mực vẫn #EMP bay loạn#! khắp nơi! Nó làm sao vào được đây? #EMP Ai bôi mực lên nó!?#!\n\n\"Một bức thư cho ngài, [ROOT.Char.GetTitleTierName].\" Ta quay lại và giật lấy tin nhắn từ tay người hầu.\n\n\"Thật đáng tiếc chuyện ghi chú của ngài — nhưng nhìn mặt tích cực, chữ viết của ngài vốn đã giống nếp nhăn góc mắt rồi! Trân trọng, [sabotage_rival.GetTitledFirstName].\""
  learn_language_ongoing.1050.a:0 "Ghi chú của Ta... không! Bao nhiêu công sức, tan biến!"
  learn_language_ongoing.1050.b:0 "[sabotage_rival.GetTitledFirstNameNoTooltip] đáng #EMP CHẾT!#!"
  learn_language_ongoing.1050.c:0 "Ha-Hah! Ta luôn giữ #EMP bản sao dự phòng!#!"
 
  learn_language_ongoing.1060.t:1 "$learn_language$: Lạc Trong Dịch Thuật"
  learn_language_ongoing.1060.desc:3 "\"...nhà giả kim với [target.Custom('RandomWeirdObject')] trong tay, trong khi [target.Custom('lowly_servant_type')] nhìn sợ hãi, rồi—\" đột nhiên Ta bị ngắt lời bởi [offended_character.GetTitledFirstName] đang tức giận.\n\n\"Ngài vừa gọi người thân yêu của Ta là [offended_character.Custom('MotherFather')] là [offended_character.Custom2('InsultNoun', SCOPE.sC('offended_character'))] và [offended_character.Custom2('InsultNounSexual', SCOPE.sC('offended_character'))]!?" [offended_character.GetSheHe] la lên. \"Ta yêu cầu bồi thường vì sự xúc phạm nghiêm trọng này!\"\n\nCó lẽ [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] của Ta cần luyện tập thêm..."
  learn_language_ongoing.1060.a:0 "Ta thực sự xin lỗi! Hy vọng điều này đủ."
  learn_language_ongoing.1060.b:2 "Ôi, Ngài nghe nhầm! Ta gọi [offended_character.GetHerHim] là #EMP [offended_character.Custom('ComplimentAdjective')]#! và #EMP [offended_character.Custom('RomanticComplimentNoun')]!#!"
  learn_language_ongoing.1060.c:0 "Ha! Vâng, Ta đã nói, và [offended_character.GetSheHe] cũng #EMP [offended_character.Custom2('InsultAdjective', ROOT.Char)]!#!"
  learn_language_ongoing.1060.d:4 "Ta chỉ đang luyện [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip]! Ta nói nhầm!"
  extra_careful_modifier:0 "Cẩn Thận Hơn"
  carefully_chosen_words_modifier:0 "Lời Nói Chọn Lọc"
  learn_language_ongoing.1060.b.success:0 "Ngài lừa [offended_character.GetHerHim] nghĩ rằng Ngài #EMP tâng bốc#! [offended_character.GetHerHis] [offended_character.Custom('MotherFather')]"
  learn_language_ongoing.1060.b.failure:0 "[offended_character.GetFirstNameNoTooltip] nhìn thấu lời dối trá của Ngài"
  learn_language_ongoing.1060.d.success:0 "Ngài giải thích thành công rằng đó chỉ là hiểu lầm"
  learn_language_ongoing.1060.d.failure:0 "[offended_character.GetFirstNameNoTooltip] không tin Ngài"
 
  learn_language_ongoing.1070.t:1 "$learn_language$: Văn Học Tự Do"
  learn_language_ongoing.1070.desc:3 "Khi Ta đọc to cuốn sách [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] mà [target.GetTitledFirstName] gửi cho Ta trước đây, Ta nhận ra nhiều người hầu đang cười khúc khích...\n\n\"Làm ơn, đừng ngừng đọc!\" họ cười.\n\"[ROOT.Char.GetSheHe|U] sắp cho [ROOT.Char.GetHerHis] xem [ROOT.Char.Custom('ObjectifiedFeature')]! Chúng ta phải biết liệu [ROOT.Char.GetTitleTierName] và [target.Custom('lowly_servant_type')] có đến với nhau, hay liệu [target.Custom2('InsultNounSexual', ROOT.Char)] lại xen vào!\"\n\nTa đang đọc... #EMP điều gì tục tĩu?#! [ROOT.Char.Custom('CulturalCurse')|U]."
  learn_language_ongoing.1070.a:0 "Vệ sĩ! Hãy lấy cuốn sách chết tiệt này đi!"
  learn_language_ongoing.1070.b:0 "Ngài dám cười Ta sao!? #EMP Đánh chúng hết.#!"
  learn_language_ongoing.1070.c:0 "À, có lẽ nó #EMP cũng#! có tính giáo dục, theo một cách nào đó..."
  erotic_novel_connoisseur_modifier:0 "Người Sành Sách Khiêu Dâm"
  lauded_loud_reader_modifier:0 "Người Đọc To Được Khen"
  lauded_loud_reader_modifier_desc:0 "Nhân vật này đã giải trí cho gia đình bằng việc đọc to 'thú vị'."
 
  learn_language_ongoing.1080.t:1 "$learn_language$: Một Bài Học"
  learn_language_ongoing.1080.desc:5 "Gia sư tại triều của Ta, [court_tutor.GetFirstName], đã giúp đỡ Ta ngày đêm trong nỗ lực học ngôn ngữ [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName].\n\nSự tận tụy của [court_tutor.GetHerHis|U] với nghệ thuật giảng dạy thật truyền cảm hứng — chẳng ngày nào Ta không được mang đến một bức thư [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip] để đọc, một [scheme.GetTargetCharacter.GetCulture.GetNameNoTooltip] [ROOT.Char.GetWomanMan] thông thái để trò chuyện, hoặc một câu vần nhớ đặc biệt.\n\nThật sự, Ta đã không thể tiến xa đến mức này nếu không có sự giúp đỡ của [court_tutor.GetFirstNamePossessiveNoTooltip]."
  learn_language_ongoing.1080.a:0 "[court_tutor.GetFirstNameNoTooltip], ngài xứng đáng nhận một phần thưởng!"
  learn_language_ongoing.1080.b:0 "[court_tutor.GetSheHe|U] đang làm tốt công việc của [court_tutor.GetHerHis]."
  attended_by_tutor_modifier:0 "Có Gia Sư Hướng Dẫn"
  court_tutor_child_language_rank_1_modifier:0 "$attended_by_tutor_modifier$"
  court_tutor_child_language_rank_2_modifier:0 "$attended_by_tutor_modifier$"
  court_tutor_child_language_rank_3_modifier:0 "$attended_by_tutor_modifier$"
  court_tutor_child_language_rank_4_modifier:0 "$attended_by_tutor_modifier$"
  court_tutor_child_language_rank_5_modifier:0 "$attended_by_tutor_modifier$"
 
  learn_language_ongoing.1090.t:1 "$learn_language$: Không Còn Chỗ"
  learn_language_ongoing.1090.desc:3 "Học ngôn ngữ [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] thật khó. Rất khó.\n\nTa cảm thấy trong đầu chẳng còn chỗ nào nữa, đầy ắp. Ngay khi một từ chui vào trí nhớ, từ khác lại rơi vào vực quên lãng. Ta vật lộn với từng bài học, chẳng tiến bộ chút nào."
  learn_language_ongoing.1090.friend.desc:0 "\n\nMay mắn thay, [helpful_friend.GetTitledFirstName] luôn ở bên Ta.\n\"Cố lên, người Ngài [ROOT.Char.Custom('ComplimentAdjective')] của Ta, Ta tin ở Ngài!\" [helpful_friend.GetSheHe] cứ nói. Thật sự Ta rất may mắn."
  learn_language_ongoing.1090.no_friend.desc:0 "\n\nCó lẽ Ta cần nghỉ ngơi?"
  learn_language_ongoing.1090.a:0 "Ta luôn có thể dựa vào [helpful_friend.GetFirstNameNoTooltip] để nhận sự hỗ trợ!"
  learn_language_ongoing.1090.b:0 "Dù khó khăn đến đâu, Ta cũng phải kiên trì!"
  learn_language_ongoing.1090.c:0 "Ta cần nghỉ một chút..."
  encouraged_by_friend_modifier:0 "Được Ngài Khích Lệ"
  learn_language_ongoing.1100.t:1 "$learn_language$: [ROOT.Char.GetTitleTierName] Quan Tâm"
  learn_language_ongoing.1100.desc:3 "Không có gì bí mật khi Ta đang nỗ lực học ngôn ngữ [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName], và dường như điều đó đã trở thành kiến thức phổ biến trong tầng lớp nông dân [target.GetCulture.GetNameNoTooltip].\n\nHọ gọi Ta là 'ngài [ROOT.Char.GetTitleTierName] quan tâm', thật là một lời khen ngợi. Ngay cả quý tộc hạng thấp cũng ca ngợi nỗ lực của Ta!\n\nTa cảm thấy những cố gắng của mình đã đưa [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] và [target.GetCulture.GetCollectiveNounNoTooltip] xích lại gần nhau hơn."
  learn_language_ongoing.1100.a:3 "Có lẽ ta nên tổ chức một buổi diễn thuyết, bằng #EMP cả#! ngôn ngữ [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip] và [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] chăng?"
  learn_language_ongoing.1100.b:0 "Hãy để họ quên Ta, Ta không thể bị phân tâm."
  learn_language_ongoing.1100.c:0 "Thật may mắn làm sao!"
  learn_language_ongoing.1100.a.success:0 "Ngài đã phát biểu một bài nói tuyệt vời"
  learn_language_ongoing.1100.a.failure:0 "Ngài làm trò cười cho mọi người"
 
  learn_language_ongoing.1110.t:1 "$learn_language$: Sức Hút Của Thơ Ca"
  learn_language_ongoing.1110.desc:3 "Ah, '[target.Custom('RegionalDrink')|U] bên Hồ' của [the_poet.GetFirstName] tại [poet_location.GetNameNoTierNoTooltip]. Thật là một tuyển tập thơ [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] tuyệt vời!\n\n#POE [ROOT.Char.Custom('GeneratePoem_Title')]#!\n[ROOT.Char.Custom('GeneratePoem_Intro_Rhyming')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming')]\n\nCó lẽ Ta cũng nên thử làm thơ?"
  learn_language_ongoing.1110.a:0 "Ta nghĩ Ta sẽ thử!"
  learn_language_ongoing.1110.b:0 "Có lẽ Ta nên đọc một bài thơ #EMP lãng mạn#! cho [lover_to_be.GetFirstNameNoTooltip]?"
  learn_language_ongoing.1110.c:0 "Không, Ta đang #EMP học tập#!, không có thời gian cho việc lãng phí!"
  poetry_collector_modifier:0 "Người Sưu Tầm Thơ"
  learn_language_ongoing.1110.a.success:0 "Ngài thấy mình khá có năng khiếu"
  learn_language_ongoing.1110.a.failure:0 "Ngài chẳng thể vần điệu nổi"
 
  learn_language_ongoing.1120.t:1 "$learn_language$: Truyện Cổ Nhi Đồng"
  learn_language_ongoing.1120.desc:3 "\"Con [ROOT.Char.Custom('GetAnimalType')|U] thông thái nói với [ROOT.Char.Custom('GirlBoy')] nhỏ — hãy coi chừng, vì có một...\" đột nhiên Ta bị gián đoạn.\n\n\"Cái gì!? Ngài [ROOT.Char.GetTitleTierName] đang đọc #EMP truyện thiếu nhi!#! Ngài không có tự trọng sao?\" [insensitive_asshole.GetTitledFirstName] kêu lên. \"Điều này không thể chấp nhận! Nếu kẻ thù biết, họ sẽ nghĩ ngài yếu đuối!\"\n\nCó lẽ lựa chọn văn học [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] của Ta hơi... tầm thường, theo mắt [ROOT.Char.Custom('GetCourt')]."
  learn_language_ongoing.1120.a:0 "Không! Đây là... #EMP những tác phẩm kinh điển [target.GetCulture.GetNameNoTooltip] được tôn kính!#! Chính là vậy!"
  learn_language_ongoing.1120.b:0 "Ngài dám xúc phạm Ta!? Ta sẽ cho Ngài biết tay!"
  learn_language_ongoing.1120.c:0 "Ngài đúng. Chúng không xứng với một [ROOT.Char.GetTitleTierName]."
  learn_language_ongoing.1120.d:0 "Hãy để người ta nghĩ gì tùy ý. Những câu chuyện này có tính giáo dục!"
  learn_language_ongoing.1120.a.success:0 "Ngài lừa [insensitive_asshole.GetFirstNameNoTooltip] nghĩ rằng truyện là tác phẩm kinh điển"
  learn_language_ongoing.1120.a.failure:0 "Ngài mất uy tín khi việc đọc truyện bị ai cũng biết"
  easily_read_fables_modifier:0 "Truyện Dễ Đọc"
  seemingly_feeble_minded_modifier:0 "Có Vẻ Ngây Ngô"
  seemingly_feeble_minded_modifier_desc:0 "Nhân vật này thường bị nhìn thấy đọc truyện thiếu nhi, tạo ấn tượng rằng trí não chưa chín chắn."
  learn_language_ongoing.1120.b.tt:0 "#V Song đấu#! với [insensitive_asshole.GetFirstName] để trừng phạt [insensitive_asshole.GetHerHim] vì thói hỗn xược của [insensitive_asshole.GetHerHis]!\n#weak Trận song đấu này KHÔNG phải là một mất một còn.#!\nNếu chiến thắng, ngài sẽ nhận được [prestige_i] [prestige|E] và một [modifier|E] cho [scheme|E]. Nếu thất bại, ngài sẽ bị chuốc lấy nhục nhã.\n\n[prowess|E] của ngài: [prowess_i]#V [root_for_loc.GetProwess]#!\n[prowess|E] của [insensitive_asshole.GetFirstNamePossessive]: [prowess_i]#V [insensitive_asshole.GetProwess]#!"
  learn_language_ongoing.1121.trigger_failure:0 "Trận đấu của Ta với [insensitive_asshole.GetFirstNameNoTooltip] đã bị hủy"
  learn_language_ongoing.1123.t:0 "$learn_language_ongoing.1120.t$"
  learn_language_ongoing.1123.desc:0 "\"Ta đầu hàng! Xin tha cho Ta, ngài hoàn toàn không ngây ngô! Chỉ cần tha cho Ta thôi!\" [insensitive_asshole.GetTitledFirstName] kêu lên.\n\nĐó sẽ là bài học cho [insensitive_asshole.GetHerHim] để không xúc phạm #EMP Ta#!."
  learn_language_ongoing.1123.a:0 "Như con [ROOT.Char.Custom('GetAnimalType')|U] thông thái từng nói: \"Đừng xúc phạm bậc trên!\""
  learn_language_ongoing.1123.b:0 "Ngươi sẽ mục rữa trong ngục vì sự hỗn xược!"
  learn_language_ongoing.1124.t:0 "$learn_language_ongoing.1120.t$"
  learn_language_ongoing.1124.desc:0 "[insensitive_asshole.GetTitledFirstName] nhổ cạnh nơi Ngài nằm trên mặt đất.\n\n\"Ngươi là một [ROOT.Char.GetTitleTierName] yếu đuối, đáng thương. Bây giờ ta sẽ giúp ngươi và loại bỏ những cuốn sách vô nghĩa này.\" [insensitive_asshole.GetSheHe] nói."
  learn_language_ongoing.1124.a:0 "Một bước lùi trong việc học..."
 
  learn_language_ongoing.1130.t:1 "$learn_language$: Tình Yêu Từ Từ Vựng"
  learn_language_ongoing.1130.desc:4 "\"Ôi, [ROOT.Char.GetFirstNameNoTooltip] của Ta! Ngài thực sự đang học ngôn ngữ [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] yêu quý của Ta? Ta cảm thấy rất được trân trọng, ngài đã nỗ lực để hiểu Ta!\" [lover_to_help.GetTitledFirstName] nói, [lover_to_help.Custom('quirk_pos_pp')].\n\n\"Ta có thể giúp gì cho ngài? Dạy vài từ chăng?\" [lover_to_help.GetSheHe] nói."
  learn_language_ongoing.1130.a:0 "Ta sẽ nhận mọi sự giúp đỡ!"
  learn_language_ongoing.1130.b:0 "Nói thế nào: 'Gặp Ta ở buồng ngủ, khỏa thân?'"
  learn_language_ongoing.1130.c:0 "Cảm ơn, nhưng Ta vẫn ổn."
  motivated_by_love_modifier:0 "Được Thúc Đẩy Bởi Tình Yêu"
  learn_language_ongoing.1130.a.success:0 "[lover_to_help.GetFirstNameNoTooltip] là một giáo viên tốt, dù có chút tán tỉnh"
  learn_language_ongoing.1130.a.failure:0 "[lover_to_help.GetFirstNameNoTooltip] nghĩ rằng hợp lý khi #EMP bắt đầu#! bài học bằng những từ như 'terpsichorean', 'transmogrify' và 'lugubrious'"
 
  learn_language_ongoing.1140.t:1 "$learn_language$: Một Bàn Tay Giúp Đỡ"
  learn_language_ongoing.1140.desc:4 "\"Ngài đang học [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName], Ta thấy — lựa chọn tốt, nói ngôn ngữ này chắc chắn sẽ củng cố vị trí của ngài là [ROOT.Char.GetTitleTierName].\" [SCOPE.sC('root_for_loc').Custom2('RelationToMeShort', SCOPE.sC('close_one_to_help'))] [close_one_to_help.GetFirstName] kêu lên, [close_one_to_help.Custom('quirk_pos_pp')].\n\n\"Ta nói [target.GetCulture.GetNameNoTooltip] như ngôn ngữ mẹ đẻ. Có lẽ Ta có thể giúp, [SCOPE.sC('close_one_to_help').Custom2('RelationToMeShort', SCOPE.sC('root_for_loc'))]?\" [close_one_to_help.GetSheHe] nói."
  learn_language_ongoing.1140.a:0 "Ngươi có thể giúp Ta hiểu câu này chăng?"
  learn_language_ongoing.1140.b:0 "Ngươi có muốn tham gia bài học cùng Ta từ bây giờ không?"
  helpful_assistance_modifier:0 "Sự Hỗ Trợ Hữu Ích"

  learn_language_ongoing.1300.t:0 "$learn_language$: Buổi Nói Chuyện Vui"
  learn_language_ongoing.1300.desc:0 "Khi chúng Ta đi qua [ROOT.Char.GetCurrentLocation.GetTitle.GetName], một người dân địa phương vui vẻ tiến đến đoàn tùy tùng của Ta. [interlocutor.GetHerHis] cười rộng từ tai này sang tai kia. Ta nhận ra [interlocutor.GetSheHe] đang chào đón nồng nhiệt, nhưng các khía cạnh tinh tế trong lời nói của [interlocutor.GetHerHis] tiếc là Ta không hiểu được.\n\nDù sao, Ta vẫy tay đuổi những người đồng hành chăm chú và đáp lại lời chào vui vẻ của [interlocutor.GetHerHis] — Ta khó có thể tưởng tượng một cơ hội tốt hơn để luyện tập [interlocutor.GetCulture.GetLanguage.GetName]!"
  learn_language_ongoing.1300.a:0 "Chúng ta hãy trò chuyện vui vẻ thôi."
  learn_language_ongoing.1300.a.flavor:0 "Ngài cố gắng tham gia cuộc trò chuyện về sự giống và khác nhau giữa [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] và [interlocutor.GetCulture.GetLanguage.GetNameNoTooltip]"
  learn_language_ongoing.1300.b:0 "Hôm nay Ta cảm thấy khá #EMP hăng hái#!..."
  learn_language_ongoing.1300.b.flavor:0 "Ngài cố gắng lôi [interlocutor.GetFirstNameNoTooltip] vào một cuộc tranh luận thân thiện"
  learn_language_ongoing.1300.b.success:0 "Ngài có một cuộc tranh luận thú vị với [interlocutor.GetFirstNameNoTooltip]"
  learn_language_ongoing.1300.b.failure:0 "Ngài không thể giao tiếp với [interlocutor.GetFirstNameNoTooltip]"
  learn_language_ongoing.1300.c:0 "\"Hãy cùng chúng Ta đến [next_destination.GetNameNoTooltip]!\""
  learn_lang_cult_acceptance_gain_debate:0 "Tham gia tranh luận thân thiện trong chuyến đi"
  interlocutor_entourage_member:0 "Người Giao Tiếp Tham Gia Đoàn Tùy Tùng"
