l_english:
  learn_language_ongoing.1200.t:1 "$learn_language$: Một Vấn Đề Bốn Chân"
  learn_language_ongoing.1200.desc:3 "Trong nỗ lực học ngôn ngữ [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip], Ta ghi rất nhiều ghi chú vì kiến thức quá nhiều để nhớ trong đầu. Nhưng giờ đây, khi cần, Ta không thể tìm thấy chúng! Một lần tìm kiếm nhanh chóng cũng không giúp Ta biết chúng ở đâu.\n\nKhi Ta quay lại, Ta nhìn xuống thấy [ROOT.Char.Custom('DogStoryName')], vẫy [ROOT.Char.Custom('DogStoryHerHis')] đuôi, vui vẻ như một [ROOT.Char.Custom('GetAnimalType')]. Phải một lúc Ta mới nhận ra rằng [ROOT.Char.Custom('DogStorySheHe')] đang cắn chặt tất cả ghi chú của Ta trong hàm răng của [ROOT.Char.Custom('DogStoryHerHis')]..."
  learn_language_ongoing.1200.a:0 "Ta không thể giận Ngài lâu được!"
  learn_language_ongoing.1200.b:0 "Muốn đi dạo không? Đi thôi nào."
  learn_language_ongoing.1200.c:0 "Đây không phải là đồ chơi! #EMP Đồ xấu#! chó!"
