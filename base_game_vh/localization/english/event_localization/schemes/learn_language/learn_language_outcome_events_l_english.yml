l_english:
  learn_language_outcome.1000.t:1 "$learn_language$: Thành Công!"
  learn_language_outcome.1000.desc:3 "Sau nhiều nỗ lực vất vả, cuối cùng Ta đã học được ngôn ngữ [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName]! Hàng giờ luyện tập phát âm, những đêm không ngủ mô phỏng ngữ điệu, vô số bài học làm chủ ngữ điệu... tất cả đều xứng đáng cuối cùng.\n\nTrong quá trình học, Ta cố gắng bắt chước giọng [target.GetTitledFirstNamePossessive] — Ta chắc chắn [target.GetSheHe] sẽ ấn tượng với kết quả của Ta!\n\nVà, tất nhiên, nông dân [target.GetCulture.GetNameNoTooltip] giờ đây kính trọng Ta hơn rất nhiều."
  learn_language_outcome.1000.a:0 "Ta cảm thấy thật thành tựu!"
  learn_language_outcome.1000.b:3 "Có lẽ Ta nên gửi một bức thư bằng [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip] cho [target.GetFirstNameNoTooltip]?"
  learn_language_outcome.1000.b.success:4 "Ta gây ấn tượng với [target.GetFirstNameNoTooltip] bằng kiến thức của mình"
  learn_language_outcome.1000.b.failure:4 "Bức thư của Ta bị xem như lời nhạo báng không thành thật"
  target_responds:0 "[target.GetTitledFirstName] trả lời bức thư của Ngài"
 
  learn_language_outcome.1001.opening:0 "[owner.Custom2('AppropriateGreetingPositive', target)]"
  learn_language_outcome.1001.desc:5 "Ta đã học ngôn ngữ [target.GetCulture.GetLanguage.GetName] suốt nhiều tháng. Ta tự tay viết bức thư này bằng chữ [target.GetCulture.GetLanguage.GetNameNoTooltip] — một lá thư hữu nghị từ người nói [owner.GetCulture.GetLanguage.GetName]!\n\nTa hy vọng các giao dịch ngoại giao trong tương lai sẽ mang lại lợi ích lớn cho cả hai chúng ta!"
  learn_language_outcome.1001.a:4 "[owner.GetSheHe|U] đã học [target.GetCulture.GetLanguage.GetNameNoTooltip]? Ấn tượng, gửi lời chào của Ta!"
  learn_language_outcome.1001.b:0 "Ha! Nỗ lực hão huyền của [owner.GetHerHis|U] để tìm vinh quang thật buồn cười!"
 
  learn_language_outcome.2000.t:1 "$learn_language$: Thất Bại"
  learn_language_outcome.2000.desc:3 "Sau nhiều nỗ lực vất vả... chẳng được gì! Thật #EMP không thể#! học được ngôn ngữ [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName]. Dù Ta có cố gắng đến đâu, Ta nói như đứa trẻ mới cai sữa và viết như một nông nô mù chữ, thiếu hầu hết các ngón tay!\n\nBah! Thật lãng phí thời gian..."
  learn_language_outcome.2000.a:3 "Ta đành nhận thua... ngôn ngữ [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip] quả thực nằm ngoài khả năng của ta."
  learn_language_outcome.2000.b:0 "Không! Ta cần bắt đầu lại, và lần này làm đúng."
  learn_language_outcome.2000.c:0 "Chà, ít nhất Ta cũng học được một số phép lịch sự hữu hiệu!"
  scheme_loses_half_progress:0 "[scheme|E] mất một nửa tiến trình, nhưng vẫn hoạt động"
 
  learn_language_outcome.3000.t:1 "$learn_language$: Tiếp Tục Học?"
  learn_language_outcome.3000.desc:4 "Đáng tiếc là [target.GetTitledFirstName] không còn ở đây nữa. Thật tiếc, Ta đã định bắt chước [target.GetHerHim] để điều chỉnh giọng khi học [target.GetCulture.GetLanguage.GetName].\n\nDù sao cũng không cần cắt ngắn việc học — Ta chỉ cần tìm người khác để bắt chước!"
  learn_language_outcome.3000.a:0 "[potential_continuation_target_1.GetTitledFirstNameNoTooltip] có giọng thật tuyệt!"
  learn_language_outcome.3000.b:0 "Có lẽ [potential_continuation_target_2.GetTitledFirstNameNoTooltip]? Giọng điệu của [potential_continuation_target_2.GetHerHis|U] thú vị."
  learn_language_outcome.3000.c:0 "Có thể [potential_continuation_target_3.GetTitledFirstNameNoTooltip]?"
  learn_language_outcome.3000.d:0 "À, Ta đã tìm lý do để ngừng học! Hoan hô!"
  scheme_retains_progress:0 "[scheme|E] giữ nguyên toàn bộ tiến trình trước đó"
 
  child_learned_language_title:0 "[owner.Custom('GetDaughterSon')|U] Học Ngôn Ngữ!"
  child_learned_language_desc:0 "[owner.Custom('GetDaughterSon')] của Ngài đã học ngôn ngữ [target.GetCulture.GetLanguage.GetName] [language|E]"
  child_learned_language_fail_title:0 "[owner.Custom('GetDaughterSon')|U] thất bại trong học Ngôn Ngữ"
  child_learned_language_fail_desc:0 "[owner.Custom('GetDaughterSon')] của Ngài đã thất bại trong việc học ngôn ngữ [target.GetCulture.GetLanguage.GetName] [language|E]"
  child_learned_language_invalidated_title:0 "Kế Hoạch Học Ngôn Ngữ Của Con Ngài Bị Hủy"
  child_learned_language_invalidated_desc:0 "[GetScheme('learn_language').GetTypeName] của con Ngài [scheme|E] đã bị hủy"
