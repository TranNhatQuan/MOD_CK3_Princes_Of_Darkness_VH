l_english:
  diplomatic_scheme_lifestyle.1001.t:0 "Lợi Ích Chiến Lược"
  diplomatic_scheme_lifestyle.1001.desc:0 "Ban đầu Ta chỉ trao đổi thư từ với [target.GetTitledFirstName] như một cách để hiểu về [target.GetHerHim]. Tuy nhiên, chúng Ta sớm tìm thấy điểm chung, và giờ đây chúng Ta gửi cho nhau cả trang giấy đầy những suy nghĩ về chiến lược quân sự!"
  diplomatic_scheme_lifestyle.1001.a:0 "Ta không thể chờ để đọc thêm những suy nghĩ của [target.GetHerHis]."
  diplomatic_scheme_lifestyle.1001.b:0 "Ta có một ý tưởng mới chắc chắn sẽ làm [target.GetHerHim] ấn tượng!"

  diplomatic_scheme_lifestyle.3001.t:0 "Hiểu Rõ [target.GetHerHim|U]"
  diplomatic_scheme_lifestyle.3001.desc:0 "Ta biết điều này có thể bị nhiều người phản đối, nhưng việc theo dõi sát sao [target.GetTitledFirstName] không phải là điều xấu. Ít nhất đó là những gì Ta tự nhủ khi hướng dẫn các điệp viên ghi lại từng sở thích và ghét bỏ của [target.GetHerHis]."
  diplomatic_scheme_lifestyle.3001.a:0 "Để giành được tình  Bạn của[target.GetHerHis], trước hết Ta phải hiểu [target.GetHerHim]!"
  diplomatic_scheme_lifestyle.3001.a.tt:0 "#F Chắc chắn [target.GetSheHe] sẽ hiểu!#!"
  diplomatic_scheme_lifestyle.3001.b:0 "Có lẽ họ đang nhận ra điều gì đó..."
  diplomatic_scheme_lifestyle.3001.b.tt:0 "#F Ta cần suy nghĩ lại chiến lược.#!"

  diplomatic_scheme_lifestyle.3101.t:0 "Đối Mặt"
  diplomatic_scheme_lifestyle.3101.desc_opening_good:1 "\"Dù tất cả điều này khá tâng bốc, Ta không chắc về ý định của Ngài.\"\n\n[target.GetTitledFirstName] [target.Custom('quirk_pos_present')] trước khi tiếp tục, \"Và Ngài lúc nào cũng xuất hiện... có thể cho Ta yên một lúc được không?\""
  diplomatic_scheme_lifestyle.3101.desc_opening_bad:0 "\"Chuyện này phải dừng lại!\"\n\n[target.GetTitledFirstName] [target.Custom('quirk_neg_present')] trước khi tiếp tục, \"Ta không chắc mục tiêu của Ngài là gì, [ROOT.Char.GetFirstNameNoTooltip], nhưng nếu là để tăng sự ghét bỏ của Ta đối với Ngài, thì chắc chắn đã thành công!\""
  diplomatic_scheme_lifestyle.3101.a:0 "Ta sẽ lùi lại một thời gian."
  diplomatic_scheme_lifestyle.3101.a.tt:0 "#F Nhưng Ta chưa từ bỏ!#!"
  diplomatic_scheme_lifestyle.3101.b:0 "Ta sẽ không từ bỏ!"
  diplomatic_scheme_lifestyle.3101.b.tt:0 "#F Chắc chắn [target.GetSheHe] không thực sự có ý đó.#!"
  diplomatic_scheme_lifestyle.3101.c:0 "Nếu [ROOT.Char.GetSheHe] cảm thấy như vậy, có lẽ tốt nhất là dừng lại."

  diplomatic_scheme_lifestyle.3201.t:0 "Sỉ Nhục"
  diplomatic_scheme_lifestyle.3201.desc:0 ""Cái [sacrificial_agent.Custom2('InsultAdjective', ROOT.Char)] [sacrificial_agent.Custom2('InsultNoun', ROOT.Char)] [sacrificial_agent.GetFirstNameNoTooltip] đó lúc nào cũng lảng vảng — ta không thể tìm được sự yên ổn!"\n\nTa đã tìm thấy [target.GetTitledFirstName] giữa cơn thịnh nộ của hắn, hướng vào [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sacrificial_agent'))] [sacrificial_agent.GetTitledFirstName] của ta."
  diplomatic_scheme_lifestyle.3201.a:0 "Đúng! Và cách mà [sacrificial_agent.GetSheHe] luôn [sacrificial_agent.Custom('quirk_neg_present')]... #EMP Chán quá#!!"
  diplomatic_scheme_lifestyle.3201.b:0 "[sacrificial_agent.GetSheHe|U] thật sự là một [sacrificial_agent.Custom('quirk_pos_adjective')] [sacrificial_agent.GetWomanMan]!"
