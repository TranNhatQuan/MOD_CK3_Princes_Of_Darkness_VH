l_english:
  murder_event_title:0 "Ám Sát:"
  murder_ongoing.3010.t:0 "$murder_event_title$ Kẻ Say Rượu"
  murder_ongoing.3010.desc_opening:0 "[agent_in_question.GetTitledFirstName] ngày ngày chìm đắm trong men rượu của [agent_in_question.GetHerHis]."
  murder_ongoing.3010.desc_hero:0 "Mặc dù điều này mở ra một số cơ hội để tìm hiểu thêm về [scheme.GetTargetCharacter.GetTitledFirstName], [agent_hero_of_the_moment.GetTitledFirstName] – [target.Custom2('RelationToMe', SCOPE.sC('agent_hero_of_the_moment'))] của [scheme.GetTargetCharacter.GetTitleAsNamePossessiveNoTooltip] và là đại lý của Ta — đã bày tỏ lo ngại rằng kẻ say này đang gây nguy hiểm cho vị trí của [agent_hero_of_the_moment.GetHerHis] tại triều đình [scheme.GetTargetCharacter.GetTitleAsNamePossessiveNoTooltip].\n\n"Chỉ là vấn đề thời gian trước khi cơn giận của [agent_in_question.GetHerHis] vượt qua [agent_in_question.GetHerHim]!""
  murder_ongoing.3010.desc:0 "Mặc dù đã mở ra một số cơ hội để tìm hiểu thêm về [scheme.GetTargetCharacter.GetTitledFirstName], [agent_in_question.GetSheHe] ít hữu dụng cho bất cứ việc gì khác..."
  murder_ongoing.3010.a:0 "Uống thêm một ly nữa đi [agent_in_question.GetFirstNameNoTooltip]!"
  murder_ongoing.3010.a.success:0 "Những trò say rượu của [agent_in_question.GetHerHis|U] hữu ích"
  murder_ongoing.3010.a.failure:0 "[agent_in_question.GetSheHe|U] đã tự bộc lộ hành tung của [agent_in_question.GetHerselfHimself]"
  murder_ongoing.3010.b:0 "[agent_in_question.GetTitledFirstNameNoTooltip] phải tránh xa mọi loại rượu."
  murder_ongoing.3010.c:0 "Ta sẽ đảm bảo cơn say không làm [agent_in_question.GetHerHim] mất kiểm soát! Chuẩn bị đi."
  murder_ongoing.3301.t:0 "$murder_event_title$ Không Khéo Lắm"
  murder_ongoing.3301.desc:0 "Dao nghi lễ của Ta đâu rồi?! Dao mà Ta định cắm vào ngực [target.GetTitledFirstNamePossessive]! Dao mà Ta đã mài cả mấy ngày nay!\n\nTa lật tung phòng lên tìm, nhưng chẳng thấy đâu."
  murder_ongoing.3301.a:0 "Ta chắc chắn đã để ở đây rồi mà!"
 #Apply poisonous herbs to the scheme that you found while travelling
  murder_ongoing.3302.t:0 "$murder_event_title$ Một Nhúm Này, Một Nhánh Kia..."
  murder_ongoing.3302.desc:0 "Ta chợt nhớ tới số thảo dược mình đã cất công thu thập khi băng qua [herb_location.GetTerrain.GetNameNoTooltip|l] ở [herb_location.GetNameNoTooltip].\n\nChúng ắt hẳn sẽ giúp #EMP thúc đẩy#! mọi chuyện nhanh chóng hơn trong công cuộc giải thoát [target.GetTitledFirstName] khỏi cõi trần tục của [target.GetHerHis]."
  murder_ongoing.3302.a:0 "Điều này sẽ rất hữu ích cho Ta."
