l_english:
  do_not_execute_assassination_tooltip: "Không được cố gắng ám sát"

  assassination_ongoing.0001.t: "Một Người Hòa Hợp Bí Mật"
  assassination_ongoing.0001.desc: "Kẻ ám sát của Ta, [assassin.GetName], phát hiện ra rằng [secret_sympathizer.GetName], một trong những triều thần của [target.GetNamePossessive], phần nào ủng hộ chúng ta — nếu không thực hành đức tin [ROOT.Char.GetFaith.GetName] một cách công khai.\n\n"[secret_sympathizer.GetSheHe|U] sẵn sàng hỗ trợ chúng ta trong âm mưu này", [assassin.GetFirstNameNoTooltip] giải thích. "Nhưng đổi lại, [secret_sympathizer.GetSheHe] muốn nhận được lời ban phước và sự ưu ái của Ngài như một nhà vô địch vĩ đại của [ROOT.Char.GetFaith.GetAdherentNameNoTooltip].""
  assassination_ongoing.0001.a: "Ta sẽ nói tốt về [secret_sympathizer.GetHerHim] trước [ROOT.Char.GetFaith.HighGodNameAlternate]."
  assassination_ongoing.0001.b: "Ta không thể ban phước cho mọi kẻ lạc lối mà ngươi đưa đến trước mặt Ta."
  fp3_sympathizer_might_betray_you.flavor: "[secret_sympathizer.GetFirstNameNoTooltip] có thể cản trở chúng ta, thay vì giúp đỡ..."

  assassination_ongoing.0002.t: "Ve Vãn Giáo Đồ Cuồng Tín"
  assassination_ongoing.0002.desc: "[assassin.GetName] có vẻ khá căng thẳng khi chuẩn bị cho nhiệm vụ của [assassin.GetHerHis]. Đương nhiên ta thừa hiểu, viễn cảnh về một cái chết đau đớn chẳng thể làm [assassin.GetHerHim] e sợ, vậy ắt hẳn là vì một nguyên do khác. Khi ta hỏi, [assassin.GetSheHe] liền đi thẳng vào vấn đề.\n\n"Ta cần thêm đồng bọn trợ giúp để thực hiện nhiệm vụ chống lại [target.GetTitledFirstName]", [assassin.GetSheHe] nói với ta. "Ta đã chạm mặt vài tín đồ [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] ở nơi hoang dã, nơi họ bị đày ải bởi một [Select_CString(ROOT.Char.IsFemale,'vị phu nhân','vị lãnh chúa')] căm ghét mưu đồ của chúng ta. Bọn họ sẽ sẵn lòng giúp đỡ, miễn là ta cung cấp cho họ binh khí và giáp phục.""
  assassination_ongoing.0002.a: "Mọi nam nữ tín đồ đều được chào đón để giúp chúng ta!"
  assassination_ongoing.0002.b: "Ta thà không đặt niềm tin vào những kẻ lang thang này..."

  assassination_usury_event_title: "Vàng và [owner.GetFaith.HighGodNameAlternate]"
  assassination_not_usury_event_title: "Một Túi Vàng Nhỏ"
  assassination_ongoing.0003_opening: "[assassin.GetName] dường như đã tìm ra điểm yếu quanh [target.GetName] mà chúng ta có thể lợi dụng.\n\n"Quả thật", [assassin.GetSheHe] nói, "Ta đã liên lạc bí mật với "
  assassination_usury_event_scullery_maid_desc: "một cô hầu bếp thấp kém nhưng đầy thù hận"
  assassination_usury_event_guard_desc: "một lính canh tham nhũng"
  assassination_usury_event_harem_slave_desc: "một nô lệ hậu cung tham vọng"
  assassination_usury_event_gardener_desc: "một người làm vườn hiền lành từng là tín đồ [owner.GetFaith.GetAdherentNameNoTooltip]"
  assassination_usury_event_minor_servant_desc: "một tớ nhỏ không quan trọng nhưng rất khéo léo"
  assassination_ongoing.0003.outro: " — và họ sẵn sàng cung cấp thông tin, nhưng có giá. Chúng ta phải trả bằng vàng... một cách bí mật."\n\nChỉ trong giây lát, Ta cảm thấy nghi ngờ. Dịch vụ có thể mua được, đúng, nhưng lòng trung thành và niềm tin thì sao?"
  assassination_ongoing.0003.a: "Sai lầm là bản chất con người..."
  assassination_ongoing.0003.b: "Ta thấy không lý do gì phải chần chừ!"
  assassination_ongoing.0003.c: "Không, Ta sẽ #italic kiếm được#! lòng trung thành của mọi người, chứ không mua nó."


  assassination_ongoing.0004.t: "Khoảnh Khắc Nghi Ngờ"
  assassination_ongoing.0004_opening: "[assassin.GetName] dường như bất thường lo lắng, thậm chí có phần tuyệt vọng.\n\n"Đúng," [assassin.GetSheHe] thú nhận khi Ta lại gần, "đức tin của Ta đang dao động, [ROOT.Char.Custom('FormOfAddressForLiege')]. Ta đã nghi ngờ về lời hứa phần thưởng lớn ở thế giới bên kia. Liệu Ta có nên hy sinh mạng sống để giết kẻ [target.Custom2('InsultAdjective', SCOPE.sC('assassin'))] [target.GetFirstName]? Nếu [assassin.GetFaith.HighGodNameAlternate] không chấp thuận việc giết #EMP tất cả#! những kẻ không tin thì sao?"\n\nKhi Ta nhìn kẻ ám sát chủ nhiệm đầy mâu thuẫn, Ta nhận ra rằng tất cả những gì [assassin.GetSheHe] cần là "
  assassination_doubt_event_hashish_desc: "thư giãn với ít hashish, trở thành chiếc bình trống cho ý muốn của [assassin.GetFaith.HighGodName]."
  assassination_doubt_event_alcohol_desc: "chìm vào men say đến mức [assassin.GetSheHe] có thể nhìn thấu tới cõi thế giới bên kia."
  assassination_doubt_event_food_desc: "thưởng thức một chút khoái lạc mà chỉ thức ăn ngon mang lại."
  assassination_doubt_event_confide_desc: "ai đó lắng nghe [assassin.GetHerHim] và an ủi [assassin.GetHerHim]."
  assassination_doubt_event_orgy_desc: "một buổi tối tràn đầy sinh lực với phi tần mà Ta sẵn sàng cung cấp."
  assassination_doubt_event_meditation_desc: "một khoảnh khắc yên tĩnh và đối thoại nội tâm với [assassin.GetFaith.HighGodName]."
  assassin_doubt_event_nothing_else: "để Ta củng cố lại đức tin [assassin.GetHerHis] vào [assassin.GetFaith.PositiveAfterLife3|U]."
  assassination_console.success: "Ngài trấn an [assassin.GetFirstNameNoTooltip]"
  assassination_console.failure: "Ngài không trấn an được [assassin.GetFirstNameNoTooltip]"
  assassination_console_toast.success: "[assassin.GetFirstNameNoTooltip] củng cố quyết tâm của [assassin.GetHerHis]"
  assassination_console_toast.failure: "[assassin.GetFirstNameNoTooltip] tiếp tục nghi ngờ"
  assassination_ongoing.0003.c_hashish: "Nào, hãy ăn bánh hashish cùng Ta."
  assassination_ongoing.0003.c_alcohol: "Nào, hãy uống cùng Ta."
  assassination_ongoing.0003.c_food: "Nào, cùng ăn với Ta."
  assassination_ongoing.0003.c_confide: "Nào, hãy tâm sự với Ta."
  assassination_ongoing.0003.c_orgy: "Nào, Ta sẽ sắp xếp một buổi xem trước [assassin.GetFaith.PositiveAfterLife3|U]..."
  assassination_ongoing.0003.c_meditation: "Nào, cùng thiền định với Ta."
  assassination_ongoing.0004.b: "Ngươi không được nao núng. Hãy đặt niềm tin vào trí tuệ của [assassin.GetFaith.HighGodName]."
  assassination_ongoing.0004.c: "Có lẽ chúng ta nên cân nhắc lại vụ ám sát này..."
  high_risk_of_dying.tt: "@warning_icon! #X [assassin.GetNameNoTooltip] có thể có nguy cơ tử vong cao hơn trong vụ ám sát!#!"

  assassination_ongoing.0005.t: "Độc Dược hay Dịch Bệnh"
  assassination_ongoing.0005.desc: ""[ROOT.Char.GetTitleTierName] của Ta," [assassin.GetName] nói, "chúng ta cần dùng mọi lợi thế để kết liễu [target.GetTitledFirstName]. Có một loại độc dược mạnh, được các ẩn sĩ phương Đông dùng với lượng nhỏ, mà Ta có thể dùng để tẩm lên lưỡi kiếm. Nhưng chi phí sẽ rất đắt...""
  assassination_ongoing.0005.a_you: "Không cần. Ta có thể tạo độc dược cho ngươi!"
  assassination_ongoing.0005.a_them: "Ngươi là một dược sĩ tài ba, tự làm đi."
  assassination_ongoing.0005.b: "Không có giá nào Ta không trả cho sự nghiệp!"
  assassination_ongoing.0005.c: "Chỉ cần ngâm lưỡi kiếm trong hố cầu tiêu qua đêm là đủ."
  assassination_ongoing.0005.d: "Không, đây là lãng phí thời gian, và dưới tầm chúng ta."

  assassination_ongoing.0006.t: "Kẻ Ám Sát Bỏ Trốn"
  assassination_ongoing.0006.desc: "Một âm mưu ám sát [target.GetNamePossessive] đã được thực hiện, nhưng tiếc thay, ngay khi kẻ ám sát chủ nhiệm [assassin.GetName] thấy cơ hội, một trong các đồng sự của [assassin.GetHerHis] bị sợ hãi cái chết và bỏ chạy.\n\nKế hoạch phải hủy bỏ. May thay, [target.GetTitledFirstNameNoTooltip] dường như không hề hay biết, và [assassin.GetFirstNameNoTooltip] đã đảm bảo rằng một lần thử mới có thể được thực hiện sớm. Tuy nhiên, kẻ ám sát bỏ trốn vẫn có thể là gánh nặng nếu chúng ta không tìm được [dummy_assassin_gender.GetHerHim]."
  assassination_ongoing.0006.a: "Chúng ta sẽ tìm [dummy_assassin_gender.GetHerHim] — và im lặng [dummy_assassin_gender.GetHerHim] mãi mãi."
  assassination_ongoing.0006.b: "Chúng ta sẽ phải sống chung với rủi ro đó."
  assassination_hunted_down_toast.success: "Ngài đã trấn áp kẻ phản loạn"
  assassination_hunted_down_toast.failure: "Ngài không tìm được kẻ phản loạn"
  assassination_hunted_down.success: "Kẻ ám sát phản loạn đã bị truy đuổi và tiêu diệt"
  assassination_hunted_down.failure: "Ngài không thể truy lùng [dummy_assassin_gender.GetHerHim]"

  assassination_ongoing.0007.t: "Một [target.GetWomanMan|U] Đầy Đức Hạnh?"
  assassination_ongoing.0007.desc: ""Ta không thể làm được," kẻ ám sát của Ta [assassin.GetFirstName] đột nhiên tuyên bố, trông lo lắng bất thường.\n\n"Mặc dù [target.GetSheHe] là kẻ dị giáo, [target.GetTitledFirstName] vẫn là một [target.GetWomanMan] đầy đức hạnh và tin tưởng mạnh mẽ vào [assassin.GetFaith.HighGodName]. [target.GetSheHe|U] được biết đến là không tham nhũng và không bất công. Nếu Ta giết [target.GetHerHim], Ta e rằng [assassin.GetFaith.HighGodNamePossessive] sẽ trừng phạt và báo thù kinh khủng trong [ROOT.Char.GetFaith.NegativeAfterLife].""
  assassination_ongoing.0007.a: "Ngươi là một #italic kẻ ám sát#!! Ta không thuê ngươi để do dự!"
  assassination_ongoing.0007.b: "Có lẽ ngươi đúng... chúng ta sẽ tạm dừng tại đây."
