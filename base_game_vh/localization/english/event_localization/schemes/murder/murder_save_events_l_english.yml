l_english: 
  murder_save_header: "Ngăn Chặn Ám Sát:"
  murder_save.failure_known_owner_tt:0 "[owner.GetTitledFirstNameNoTooltip] đã thất bại trong việc ám sát Ta"
  murder_save.failure_unknown_owner_tt:0 "Ai đó đã thất bại trong việc ám sát Ta"
  murder_save.used_up_guile_legacy_5_save:0 "Đã tiêu hao bảo vệ từ [GetDynastyPerk('guile_legacy_5').GetName]"
  murder_save.dynasty_member_used_guile_legacy_5_save:0 "Nỗ lực ám sát"
  murder_save.dynasty_member_used_guile_legacy_5_save_desc:0 "[target.GetTitledFirstName] đã sống sót sau một âm mưu ám sát nhắm vào tính mạng của [target.GetHerHis] nhờ sự che chở của [GetDynastyPerk('guile_legacy_5').GetName]!"

  murder_save.0001.t:1 "$murder_save_header$ Bị Ngăn Cản Bởi Tình Yêu"
  murder_save.0001.opening:1 "Âm mưu tước đoạt mạng sống của [target.GetTitledFirstNamePossessive] đã bị cản trở!\n\nTên sát thủ đã tìm đường của [dummy_assassin_gender.GetHerHis] vào tẩm cung của [target.GetTitleTierName], nhưng lại thấy [target.GetHerHim] đang có người kề bên, đó là"
  murder_save.0001.rel_to_me:0 " — [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))] của ta — "
  murder_save.0001.end:0 "[lover.GetTitledFirstName], người yêu của [target.GetHerHis]!\n\n[lover.GetFirstName] lao đến cứu [target.GetFirstNamePossessive], và cuộc vật lộn khiến cả [lover.GetHerHim] lẫn kẻ ám sát đều chết trên sàn."
  murder_save.0001.a:0 "Ta sẽ không bao giờ có được [target.GetHerHim] nữa."
  murder_save.0001.b:0 "Ta cần một kế hoạch mới..."

  murder_save.1001.desc:1 "\"Ngươi sẽ không làm hại [target.GetHerHim]!\" [lover.GetTitledFirstName] hét lên và nhảy vào bóng người vừa bước vào phòng Ta, dao rút sẵn.\n\nThật là phúc lẫn họa khi [lover.GetSheHe] có mặt cùng Ta tối nay. Nếu không có [lover.GetHerHim], Ta có thể đã mất mạng, nhưng cuộc vật lộn khiến [lover.GetHerHim] chảy máu trong vòng tay Ta, bên cạnh kẻ ám sát đã chết."
  murder_save.1001.a:0 "Kẻ tàn nhẫn nào đứng sau chuyện này?"
  murder_save.1001.b:0 "[owner.GetTitledFirstNameNoTooltip] sẽ phải trả giá cho việc này!"
  murder_save.1001.c:0 "Tốt hơn là [lover.GetFirstNameNoTooltip] chứ không phải Ta!"

  murder_save.0002.t:2 "$murder_save_header$ Tình Yêu [SCOPE.Custom('VenomousCreatureAttackPlural')|U]"
  murder_save.0002.opening:0 "[target.GetTitledFirstName] vẫn còn sống!\n\n[SCOPE.Custom('VenomousCreature')] được đặt trong giường [target.GetTitleTierNamePossessive], nhưng nó tấn công nhầm mục tiêu! Thay vào đó là"
  murder_save.0002.rel_to_me:0 " — [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))] của ta — "
  murder_save.0002.end:0 "[lover.GetTitledFirstName], người yêu của [target.GetHerHis], đã chết!"

  murder_save.1002.desc:1 "\"Quay lại giường đi, [lover.Custom('LoverPetName')] của ta...\"\n\nTa sắp hành động theo lời mời của người yêu thì [lover.GetSheHe] bắt đầu hét lên. \"Chuyện gì vậy?!\" Câu trả lời đến khi [lover.GetSheHe] vùng vẫy đủ để lộ [SCOPE.Custom('VenomousCreatureType')] đang bò giữa ga trải giường.\n\nKhi bác sĩ đến, [lover.GetFirstName] đã cứng đờ và lạnh. Ta cũng lạnh lùng. Con [SCOPE.Custom('VenomousCreatureType')] đó vốn dành cho Ta."

  murder_save.0003.t:1 "$murder_save_header$ Kẻ Ám Sát"
  murder_save.0003.desc:0 "[target.GetTitledFirstName] vẫn còn sống!\n\nSát thủ của ta đã vào được tẩm cung của [target.GetTitleTierName], nhưng [broken_person.GetTitledFirstName] — trong số tất cả mọi người — lại can thiệp! [target.GetFirstName] chẳng làm gì ngoài việc hành hạ [broken_person.GetHerHim], vậy mà [broken_person.GetSheHe] lại hy sinh mạng sống của [broken_person.GetHerHis] để bảo vệ [target.GetHerHim]. Sát thủ của ta đã bỏ mạng, còn [target.GetFirstName] thì bình an vô sự rời đi."
  murder_save.0003.a:0 "Thế giới này thật bất công."
  murder_save.0003.b:0 "Ta phải thử với một kế hoạch mới!"

  murder_save.1003.desc:0 "[broken_person.GetTitledFirstName] cố tỏ ra bình thản khi tên sát thủ tiến về phía ta.\n\n"Dẫn một kẻ sát nhân vào tẩm cung của ta sao, [broken_person.GetFirstNameNoTooltip], ngay cả sau khi những tiếng la hét của ngài đã minh chứng cho lòng trung thành vĩnh cửu?" Ánh mắt của [broken_person.GetHerHis|U] đảo lướt giữa ta và thứ vũ khí trên tay tên sát thủ. "Thật là một sự thất vọng tồi tệ. Ngài hẳn không muốn trở thành một nỗi thất vọng, đúng chứ?"\n\nCó điều gì đó thay đổi trong ánh mắt của [broken_person.GetHerHis]. Với một tiếng hét, [broken_person.GetSheHe] lao [broken_person.GetHerselfHimself] vào tên sát thủ. Khi cuộc giằng co kết thúc, cả hai đều nằm gục chết trên sàn."
  murder_save.1003.a:0 "Xem đây là hình phạt thích đáng, [broken_person.GetFirstNameNoTooltip]."

  murder_save.0004.t:1 "$murder_save_header$ Bị Tấn Công"
  murder_save.0004.desc:0 "[target.GetTitledFirstName] vẫn còn sống!\n\nĐám côn đồ Ta thuê đã phục kích đoàn tùy tùng của [target.GetHerHis] theo kế hoạch, nhưng không thể đánh bại họ! Có lẽ họ đã có thể bắt [target.GetTitleTierName] nếu không có con ngựa chiến hung dữ mà [target.GetSheHe] tự hào!"
  murder_save_failure_warhorse_tt:0 "Ngựa chiến của [target.GetFirstNamePossessiveNoTooltip] chết vì vết thương"
 
  murder_save.1004.opening:0 "Ta đang đi cùng đoàn tùy tùng khi nghe một tiếng hét từ rừng cây. \"Tấn công! Nhắm vào [ROOT.Char.GetTitleTierName]!\" Một vụ phục kích!\n\nĐây không phải bọn cướp vàng, mà là côn đồ muốn mạng Ta! May mắn thay, [ROOT.Char.Custom('HorseStoryMareStallion')] biết phải làm gì! [ROOT.Char.Custom('HorseStorySheHe')|U] đứng rearing và đá để Ta tránh các lưỡi kiếm trong khi vệ sĩ chống lại chúng."
  murder_save.1004.warhorse_dies:0 "\n\nChỉ khi cuộc chiến lắng xuống, [ROOT.Char.Custom('WarhorseStoryName')] mới gục xuống dưới Ta, và Ta phát hiện [ROOT.Char.Custom('HorseStoryHerHis')] bị thương nặng. [ROOT.Char.Custom('HorseStorySheHe')|U] thực sự bảo vệ Ta đến cùng..."
  murder_save.1004.a:0 "Những côn đồ này làm thuê cho ai đó, nhưng là ai?"
  murder_save.1004.b:0 "Rõ ràng ai đứng sau chuyện này!"
  murder_save.1004.c:0 "Ta sẽ tìm ra kẻ làm chuyện này!"
  murder_save.1004.d:0 "Ngươi đã lấy đi con ngựa tuyệt vời của ta, [owner.GetFirstNameNoTooltip]!"
  murder_save_warhorse_dies_to_thugs:0 "#F [THIS.Char.Custom('WarhorseStoryName')] chết vì vết thương [THIS.Char.Custom('HorseStoryHerHis')]#!"

  murder_save.0005.t:1 "$murder_save_header$ Báo Động"
  murder_save.0005.desc:0 "Nhóm âm mưu tiến vào phòng giam của [target.GetTitledFirstNamePossessive], nhưng tù nhân bắt đầu gây náo loạn. Hối lộ cai ngục thì dễ, nhưng giả vờ như không có gì xảy ra khi toàn bộ lâu đài thức giấc thì khác!\n\nKẻ ám sát của Ta rút lui gấp, và [target.GetFirstName] vẫn an toàn..."

  murder_save.1005.desc:0 "Ta không biết những bóng người trùm mũ xuất hiện trong phòng giam là ai, nhưng biết chắc họ muốn hại Ta. Họ không ngờ người bảo vệ của Ta.\n\n\"Đánh bại chúng!\" Ta hét, và [ROOT.Char.Custom('prison_pet')] lao tới, sẵn sàng chiến đấu để bảo vệ Ta! Ta biết chúng không thể thắng Bạn ta, và khi Ta hét lên chúng bỏ chạy trong kinh hoàng!\n\nCai ngục đến đánh Ta, nhưng ít nhất Ta vẫn còn thở."
  murder_save.1005.a:0 "Ta nợ mạng sống mình cho ngươi, [ROOT.Char.Custom('prison_pet')]."
  murder_save.1005.b:0 "Hy sinh của ngươi không vô ích, [ROOT.Char.Custom('prison_pet')] của ta!"

  murder_save.0006.t:1 "$murder_save_header$ Hộ Vệ"
  murder_save.0006.opening:0 "Đám \"tay sai\" của ta đã chặn đánh [target.GetTitledFirstName] như kế hoạch, nhưng điều ta không lường trước được là đội hộ vệ riêng mà"
  murder_save.0006.spouse:0 "[spouse.GetTitledFirstName] đã lập nên để bảo vệ [target.GetHerHim]."
  murder_save.0006.no_spouse:0 "đã được lập nên bởi phối ngẫu của [target.GetHerHis]."
  murder_save.0006.end:0 "\n\nChúng chiến đấu vô cùng dũng mãnh và đáng gờm, đủ để [target.GetFirstName] vẫn sống sót qua ngày hôm nay."

  murder_save.1006.opening:0 "Ta đang trên đường du hành thì đoàn tùy tùng bị một bọn côn đồ tập kích! May thay, đội hộ vệ được lập nên cho ta bởi"
  murder_save.1006.spouse:0 "[spouse.GetTitledFirstName]"
  murder_save.1006.no_spouse:0 "phối ngẫu của ta"
  murder_save.1006.end:0 "đã chiến đấu quả cảm và bảo vệ ta khỏi cuộc tấn công.\n\nKhi chúng chiến đấu đến hơi thở cuối cùng, rõ ràng bọn cướp này không nhằm vào vàng bạc, mà là mạng sống của ta! Cuối cùng chúng bị đánh lui, nhưng đội hộ vệ của ta gần như bị tiêu diệt hoàn toàn."

  murder_save.0007.t:1 "$murder_save_header$ Vệ Sĩ Lông Xù"
  murder_save.0007.desc:0 "[target.GetTitledFirstName] vẫn còn sống!\n\n[SCOPE.Custom('VenomousCreature')] được đặt trong giường [target.GetTitleTierNamePossessive], nhưng trước khi nó kịp tấn công, con mèo [target.GetTitleTierNamePossessive] gây ồn và bắt đầu đánh nhau với sinh vật!"
  murder_save_failure_cat_tt:0 "Mèo của [target.GetFirstNamePossessiveNoTooltip] chết vì vết thương"

  murder_save.1007.opening:1 "Khi Ta bước vào phòng, ngay lập tức nhận ra mèo yêu quý của Ta, [THIS.Char.Custom('CatStoryName')], căng thẳng – [THIS.Char.Custom('CatStorySheHe')] đi lại trước giường. Như tia chớp màu [THIS.Char.Custom('CatFurColor')], [THIS.Char.Custom('CatStorySheHe')] bất ngờ nhảy lên, lộ [SCOPE.Custom('VenomousCreatureType')] giữa ga trải giường!"
  murder_save.1007.cat_dies:0 "\n\nSinh vật kinh tởm đó không dễ dàng gục ngã, và khi [THIS.Char.Custom('CatStoryName')] rốt cuộc cũng cắn được vào cổ nó, thì [THIS.Char.Custom('CatStorySheHe')] [THIS.Char.Custom('CatStoryHerselfHimself')] đã bị thương quá nặng để có thể cứu chữa."
  murder_save.1007.a:0 "Ta nợ mạng sống mình cho ngươi, [THIS.Char.Custom('CatStoryName')]!"
  murder_save.1007.b:0 "Rõ ràng ai đứng sau chuyện này!"
  murder_save.1007.c:0 "Ta sẽ tìm ra kẻ làm chuyện này!"
  murder_save.1007.d:0 "Ngươi sẽ phải trả giá, [owner.GetFirstNameNoTooltip]!"
  murder_save_creepy_crawlies_cat_dies:0 "[THIS.Char.Custom('CatStoryName')] chết vì vết thương [THIS.Char.Custom('CatStoryHerHis')]"

  murder_save.0008.t:1 "$murder_save_header$ Vệ Sĩ Lông Xù"
  murder_save.0008.desc:1 "Âm mưu tước đoạt mạng sống của [target.GetTitledFirstNamePossessive] đã bị cản trở!\n\nSát thủ đã tìm được đường của [dummy_assassin_gender.GetHerHis] vào tẩm cung của [target.GetTitleTierNamePossessive], nhưng trước khi [dummy_assassin_gender.GetSheHe] kịp ra tay, một con chó đã bắt đầu sủa ầm ĩ! Con chó của [target.GetTitleTierNamePossessive], thứ mà [target.GetSheHe] vô cùng tự hào, đã nhanh chóng làm tên sát thủ hoảng sợ tháo chạy."

  murder_save.1008.desc:0 "Ngay khi Ta bước vào phòng, chó yêu quý của Ta, [ROOT.Char.Custom('DogStoryName')], sủa, và đột nhiên [ROOT.Char.Custom('DogStorySheHe')] lao tới bóng tối... Một bóng tối vấp ngã! [ROOT.Char.Custom('DogStoryName')] đuổi kẻ ám sát cho đến khi Ta gọi [ROOT.Char.Custom('DogStoryHerHim')] quay lại."
  murder_save.1008.a:0 "Ta nợ mạng sống mình cho ngươi, [ROOT.Char.Custom('DogStoryName')]!"

  murder_save.0009.t:1 "$murder_save_header$ Quan Hệ Gia Đình"
  murder_save.0009.desc:0 "Trong những khoảnh khắc cuối cùng của âm mưu ám sát [target.GetTitledFirstName], mọi thứ tan tành!\n\nDường như nỗ lực của Ta đã hoàn toàn bị xâm nhập bởi những người ủng hộ Triều đại [target.GetDynasty.GetBaseName], và vào đêm định mệnh, tất cả những kẻ khác bị chặn trước khi âm mưu được thực hiện!"
  murder_save.0009.a:0 "Ta phải rút lui, trước khi họ trả thù!"
  murder_save.0009.b:0 "Những gì mất đi, Ta có thể xây dựng lại."
  murder_save.targets_guile_legacy_save_used_up:0 "[target.GetShortUIName|U] không thể được cứu bởi [GetDynastyPerk( 'guile_legacy_5' ).GetName] lần nữa"

  murder_save.1009.opening:0 "Một nỗ lực ám sát Ta đã bị phá!"
  murder_save.1009.owner_discovered:0 "\n\n[owner.GetTitledFirstName] đã lập kế hoạch cẩn thận, nhưng không tính đến việc âm mưu của [owner.GetHerHis] bị xâm nhập bởi những người trung thành với Nhà [target.GetHouse.GetNameNoTooltip]!"
  murder_save.1009.owner_not_discovered:0 "\n\nMay mắn thay, kẻ đã lập âm mưu độc ác này không lường trước việc âm mưu bị xâm nhập bởi các điệp viên trung thành với Nhà [target.GetHouse.GetNameNoTooltip]!"
  murder_save.1009.end:0 "\n\nÂm mưu tan vỡ ngay khi vừa bắt đầu, và mạng sống Ta vẫn an toàn."
  murder_save.1009.a:0 "Chính cái tên của Ta đã cứu mạng Ta!"

 # Saved by a Varangian
  murder_save.0010.t:0 "$murder_save_header$ Varangian"
  murder_save.0010.desc:0 "Âm mưu tước đoạt mạng sống của [target.GetTitledFirstNamePossessive] đã bị cản trở!\n\nTên sát thủ đã bị chặn lại bởi một trong những tên lính Varangian vô vị đó! Ta cho rằng rốt cuộc thì [target.GetTitleAsNameNoTooltip] cũng đã đề cao phòng bị của [target.GetHerHis]..."
  murder_save.0010.varangian_dies:0 "\n\nÍt ra kẻ ám sát cũng thắng được người bảo vệ. [varangian.GetTitledFirstName] sẽ không cản Ta nữa."
  murder_save.0010.a:0 "Ta sẽ không bao giờ có được [target.GetHerHim] nữa!"
  murder_save.0010.b:0 "Ta cần một kế hoạch mới..."

  murder_save.1010.desc:0 "Một kẻ ám sát đã cố giết Ta! May mắn thay, [varangian.GetFirstName], một thành viên trong Vệ sĩ Varangian của Ta, đang đứng ngay ngoài phòng và nhanh chóng can thiệp. [varangian.GetSheHe|U] xử lý kẻ ám sát trước khi Ta gặp nguy hiểm."
  murder_save.1010.varangian_dies:0 "Đáng tiếc, [varangian.GetFirstNameNoTooltip] bị thương nặng và tử vong trong quá trình này."
  murder_save.1010.owner_discovered:0 "\n\nKhông còn nghi ngờ gì nữa, tất cả đều là việc của [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
  murder_save.1010.a:0 "Ai đứng sau nỗ lực độc ác này?"
  murder_save.1010.b:0 "[owner.GetSheHe|U] sẽ phải trả giá cho việc này!"

  murder_save.0011.t:0 "$murder_save_header$ Con Mèo Đói"
  murder_save.0011.desc:1 "Âm mưu tước đoạt mạng sống của [target.GetTitledFirstNamePossessive] đã bị cản trở!\n\nChất độc, món vịt, bữa ăn... Mọi thứ đều diễn ra theo đúng kế hoạch cho đến khi con mèo của [target.GetHerHis] lén ngoạm một miếng trên đĩa của [target.GetHerHis] trước khi [target.GetSheHe] kịp dùng bữa! Nhìn thấy con mèo quằn quại trong đau đớn cho đến chết đã phần nào làm [target.GetTitledFirstNameNoTooltip] chùn bước trước việc thưởng thức bữa ăn của [target.GetHerHis]."
  murder_save_poison_cat_tt:0 "Mèo của [target.GetFirstNamePossessiveNoTooltip] chết vì độc"

  murder_save.1011.desc:0 "Khi ta vừa ngồi xuống chuẩn bị dùng bữa, con mèo của ta, [ROOT.Char.Custom('CatStoryName')], nhảy phốc lên đùi ta, vỗ cào vào chiếc đĩa, và ta để [ROOT.Char.Custom('CatStoryHerHim')] vuốt đi một miếng trước khi [ROOT.Char.Custom('CatStorySheHe')] nhảy xuống lại.\n\nNgay khi ta chuẩn bị bắt đầu dùng bữa, ta giật mình bởi tiếng kêu gào lớn và đau đớn. [ROOT.Char.Custom('CatStoryName')] đang quằn quại trên sàn, những tiếng rên rỉ đau đớn của [ROOT.Char.Custom('CatStoryHerHis')] ngày càng yếu ớt đi khi [ROOT.Char.Custom('CatStorySheHe')] nằm bất động. Thức ăn đã bị tẩm độc ư?!"
  murder_save_poison_cat_dies:0 "[THIS.Char.Custom('CatStoryName')] cứu Ngài và chết vì độc"

  murder_save.0012.t:0 "$murder_save_header$ Con Chó Đói"
  murder_save.0012.desc:1 "[target.GetTitledFirstName] vẫn còn sống!\n\nChất độc, món vịt, bữa ăn... Mọi thứ đều diễn ra theo đúng kế hoạch cho đến khi con chó của [target.GetHerHis] cầu xin một miếng trên đĩa của [target.GetHerHis] trước khi [target.GetSheHe] kịp dùng bữa! Nhìn thấy con chó quằn quại trong đau đớn cho đến chết đã phần nào làm [target.GetTitledFirstNameNoTooltip] chùn bước trước việc thưởng thức bữa ăn của [target.GetHerHis]."
  murder_save_poison_dog_tt:0 "Chó của [target.GetFirstNamePossessiveNoTooltip] chết vì độc"

  murder_save.1012.desc:0 "Khi ta vừa ngồi xuống chuẩn bị dùng bữa, con chó của ta, [ROOT.Char.Custom('DogStoryName')], đi theo ta với ánh mắt cầu khẩn, và ta thản nhiên thả một miếng từ đĩa của mình xuống sàn cho [ROOT.Char.Custom('DogStoryHerHim')].\n\nNgay khi ta chuẩn bị bắt đầu dùng bữa, ta giật mình bởi một tiếng rên rỉ lớn, đớn đau và ỉ ôi. [ROOT.Char.Custom('DogStoryName')] đang quằn quại trên sàn, tiếng rên rỉ của [ROOT.Char.Custom('DogStoryHerHis')] ngày càng yếu ớt đi khi [ROOT.Char.Custom('DogStorySheHe')] nằm bất động. Thức ăn đã bị tẩm độc ư?!"
  murder_save_poison_dog_dies:0 "[THIS.Char.Custom('DogStoryName')] cứu Ngài và chết vì độc"

  murder_save.0013.t:0 "$murder_save_header$ Mũi Thính Ẩm Thực"
  murder_save.0013.desc:0 "[target.GetTitledFirstName] vẫn sống!\n\nĐộc, [target.Custom('GetExpensiveMeal')]… Mọi thứ theo kế hoạch cho đến khi [target.GetSheHe] nhận thấy có gì đó không ổn. Chúng Ta thử đầu độc món yêu thích của [target.GetHerHis], và [target.GetSheHe] ngay lập tức nhận ra mùi khác thường và vứt bỏ."

  murder_save.1013.desc:0 "Khi Ta chuẩn bị bữa tối yêu thích, một mùi kỳ lạ đánh vào mũi. Hơi chua lấn vào hương thơm thường lệ, gia vị mất cân bằng… Hỏi đầu bếp, họ bảo mọi thứ chuẩn bị bình thường, nhưng Ta chỉ nghĩ một điều: ai đó đã cố đầu độc Ta!"

  murder_save.0014.t:0 "$murder_save_header$ Sự Hiểu Biết Tới Mộ"
  murder_save.0014.desc:0 "Nỗ lực ám sát [target.GetTitledFirstNamePossessive] của Ta đã bị phá!\n\nHóa ra những kẻ ám sát ngu ngốc không biết rằng [target.GetSheHe] nói [owner.GetCulture.GetLanguage.GetNameNoTooltip], và đã khoe chuyện âm mưu ngay trước mũi [target.GetHerHis]."

  murder_save.1014.desc:0 "Một tối khi Ta chuẩn bị đi ngủ, nghe hai Bạn Bè nói thầm. Ta nhận ra họ đang nói [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] chứ không phải [owner.GetCulture.GetLanguage.GetNameNoTooltip]. Họ rõ ràng không biết Ta hiểu.\n\n\"Chờ [ROOT.Char.GetHerHim] ngủ. Rồi canh khi Ta cắt cổ [ROOT.Char.GetHerHis]\".\n\nTa nhanh chóng ra khỏi phòng báo cho vệ sĩ rằng có kẻ ám sát. Cảm ơn [ROOT.Char.GetFaith.HighGodName] Ta nói [owner.GetCulture.GetLanguage.GetNameNoTooltip]!"

  murder_save.1014.a:0 "Bây giờ ai sẽ gửi những kẻ ám sát nói [owner.GetCulture.GetLanguage.GetNameNoTooltip]?"
  murder_save.0015.t:0 "$murder_save_header$ Vật Phẩm Đúng Lúc"
  murder_save.0015.desc:0 "[target.GetTitledFirstName] sống sót sau nỗ lực ám sát, dường như dùng [target.GetHerHis] [this_artifact.GetName] để tàn nhẫn giết kẻ ám sát chúng Ta gửi đi."

  murder_save.1015.start_desc:0 "[attempted_assassin.GetFirstName|U] từ bóng tối lao ra, dao trong tay. Ta nhìn quanh tuyệt vọng tìm vũ khí trước khi mắt dừng lại trên"

  murder_save.1015.blunt_artifact.desc:0 "$murder_save.1015.start_desc$ [this_artifact.GetName]. Ta cầm nó để chắn nhát dao rồi đập liên tiếp lên đầu [attempted_assassin.GetFirstNamePossessiveNoTooltip].\n\nCuối cùng Ta mệt mỏi lùi lại, bỏ [SCOPE.Custom('ThisArtifactType')] đầy máu và nội tạng."

  murder_save.1015.sculpture_artifact.desc:1 "$murder_save.1015.start_desc$ [this_artifact.GetName]. Lùi lại khỏi [attempted_assassin.GetFirstNameNoTooltip], ta chờ đợi một khoảnh khắc hoàn hảo trước khi xô ngã [SCOPE.Custom('ThisArtifactType')] lên người của [attempted_assassin.GetHerHim].\n\n[this_artifact.GetNameNoTooltip] tạo ra một tiếng rắc rợn người, khi nó đè nát [attempted_assassin.GetHerHim] bên dưới."

  murder_save.1015.chest_artifact.desc:0 "$murder_save.1015.start_desc$ [this_artifact.GetName]. Ta chậm rãi lùi lại, dụ dỗ [attempted_assassin.GetHerHim] tiến về phía [SCOPE.Custom('ThisArtifactType')] đang mở. Đúng khoảnh khắc hoàn hảo, ta chộp lấy đầu của [attempted_assassin.GetHerHis] và đẩy nó xuống dưới nắp rương, trước khi đóng sầm nó xuống hộp sọ mỏng manh của [attempted_assassin.GetHerHis] với một tiếng rắc sởn gai ốc.\n\nTa dập nó xuống thêm ba hoặc bốn lần nữa cho chắc chắn trước khi lùi lại và mặc cho cái xác đổ gục xuống sàn."

  murder_save.1015.actual_weapon_artifact.desc:1 "$murder_save.1015.start_desc$ [this_artifact.GetName]. Màu sắc rút khỏi mặt [attempted_assassin.GetHerHis] khi [attempted_assassin.GetSheHe] nhận ra Ta có vũ khí. Dễ dàng hạ [attempted_assassin.GetHimHer] bằng [SCOPE.Custom('ThisArtifactType')]."

  murder_save.1015.strangling_artifact.desc:0 "$murder_save.1015.start_desc$ [SCOPE.Custom('ThisArtifactType')]. Cầm [this_artifact.GetName], Ta né nhát dao rồi quấn quanh cổ kẻ tấn công.\n\nChỉ vài khoảnh khắc vật lộn trước khi xác kẻ ám sát mềm ra."

  murder_save.1015.small_artifact.desc:0 "$murder_save.1015.start_desc$ [this_artifact.GetName]. Chộp lấy nó, ta nhảy chồm lên kẻ ám sát và nhét món đồ trang sức đó xuống cổ họng chúng.\n\nNghẹt thở, [attempted_assassin.GetSheHe] đánh rơi con dao, ngã khuỵu trên đầu gối của [attempted_assassin.GetHerHis] trong khi cào cấu vào cổ họng [attempted_assassin.GetHerHis], tuyệt vọng cố gắng hít thở. Khi lính gác rốt cuộc cũng vội vã đến ứng cứu, ta nhủ thầm phải tìm ai đó moi [this_artifact.GetName] của ta ra khỏi cái xác này sau."

  murder_save.1015.throne_start.desc:0 "Ta đang tản bộ quanh ngai phòng trống vắng của mình vào một buổi tối, thì từ trong bóng tối [attempted_assassin.GetFirstName] lao vào ta cùng một con dao. Khó khăn lắm mới né được kẻ ám sát, ta xoay sở tóm được gáy của [attempted_assassin.GetHerHis] và liên tục đập mặt [attempted_assassin.GetHerHis] vào"

  murder_save.1015.throne_artifact.desc:0 "$murder_save.1015.throne_start.desc$ phần gỗ [this_artifact.GetFeatureText('generic_material_wood')] cứng cáp trên [this_artifact.GetName] của ta, làm máu và răng của [attempted_assassin.GetHerHis] văng tung tóe khắp lớp [this_artifact.GetFeatureText('generic_material_cloth')] vốn dĩ hoàn mỹ trước đó."

  murder_save.1015.throne_special_artifact.desc:0 "$murder_save.1015.throne_start.desc$ [this_artifact.GetName] huyền thoại.\n\nMáu văng khắp ngai, Ta hy vọng Bạn Bè có thể làm sạch vết bẩn."

  new_artifact_loc:0 "[this_artifact.GetDesc]\n\nĐã được dùng để ngăn một âm mưu ám sát [target.GetTitledFirstName]."

  new_artifact_loc_banner:0 "[this_artifact.GetDesc]\n\nCó vết máu trên góc từ khi được dùng để ngăn một âm mưu ám sát [target.GetTitledFirstName]."

  death_by_artifact:0 "bị giết bởi một vật phẩm"
  death_by_artifact_killer:0 "bị giết bởi một vật phẩm [TARGET_CHARACTER.GetUIName]"
