  murder_outcome_reworked.0000.memories.bad.general: "Ta sẽ luôn nhớ khi [bad_memory.GetDescription], [ROOT.Char.Custom('MurderMemoryEnding')]\n\n"
  murder_outcome_reworked.0000.memories.bad.house_feud: "Ít đi một [target.GetHouse.GetBaseName] phải lo lắng.\n\n"
  murder_outcome_reworked.0000.memories.line_break: "Gai trong mắt Ta không còn, cảm ơn [owner.GetFaith.FateGodName].\n\n"

 # Kept Secret (Scheme Owner)
  murder_outcome_reworked.0000.kept_secret.generic.1: "\n\nMay thay, dù sẽ luôn có lời đồn, sự liên quan của Ta trong vụ án vẫn chưa bị phát hiện."
  murder_outcome_reworked.0000.kept_secret.generic.2: "\n\nTa đã che dấu kỹ mọi dấu vết, và nếu ai đó nghi ngờ Ta đứng sau vụ tấn công, họ cũng không dám nói ra."

 # Revealed (Scheme Owner)
  murder_outcome_reworked.0000.revealed.generic.1: "\n\nĐáng tiếc, dù Ta có phản đối thế nào, những lời buộc tội không có chứng cứ từ khắp nơi chỉ thẳng vào #EMP Ta#! như kẻ chủ mưu."
  murder_outcome_reworked.0000.revealed.success.1: "\n\nĐáng tiếc, ai đó, ở đâu đó, đã sơ hở và để lộ sự tham gia của Ta; ít ra Ta có thể tự an ủi khi biết rằng [target.GetTitledFirstName] còn thê thảm hơn Ta."
  murder_outcome_reworked.0000.revealed.failure.1: "\n\nTệ hơn, đủ chứng cứ đã lộ ra để chứng minh Ta liên quan, biến Ta vừa là kẻ thất bại vừa là Xóa Bạn người."
  murder_outcome_reworked.0000.addendum.house_feud.1: "Đồ chết tiệt [target.GetHouse.GetBaseName] #EMP bastards#!."
  murder_outcome_reworked.0000.addendum.house_feud.2: "Nhà [owner_to_reveal.GetHouse.GetBaseName], nguyền rủa tất cả xuống [target.GetFaith.random_NegativeAfterLife]!"
  murder_outcome_reworked.0000.addendum.house_feud.2.2: "Và "$murder_outcome_reworked.0000.addendum.house_feud.2$""
  murder_outcome_reworked.0000.addendum.house_feud.2.servants: "Người hầu càu nhàu: $murder_outcome_reworked.0000.addendum.house_feud.2.2$"

 # Memories (Scheme Target)
  murder_outcome_reworked.0000.memories.target.voice_overheard: "\n\nKhi Ta mờ dần, một giọng lạnh lùng thì thầm: #EMP 'Hãy xem đây là trả thù cho lúc [bad_memory.GetSecondPerspectiveDescription], quý [target.GetTitleAsNameNoTooltip]. Hy vọng đáng giá.'#!"
  murder_outcome_reworked.0000.memories.target.note_discovered: "\n\nMột mảnh giấy nhăn được tìm thấy gần hiện trường: #EMP 'Thanh toán đầy đủ. Hợp đồng lập cho khi [bad_memory.GetThirdPerspectiveDescription].'#!"

 # Revealed (Scheme Target)
  murder_outcome_reworked.0000.revealed.scheme_target.success.1: "\n\nKhi cái chết gọi, không một chút nghi ngờ trong đầu Ta về kẻ gây ra điều này: [owner.GetTitledFirstName]!"
  murder_outcome_reworked.0000.revealed.scheme_target.success.2: "\n\nDù tâm trí Ta mờ đi, suy nghĩ cuối cùng là đây chắc chắn là công việc của [owner.Custom2('InsultAdjective', ROOT.Char)] [owner.Custom2('InsultNoun', ROOT.Char)], [owner_to_reveal.GetTitledFirstName]!"
  murder_outcome_reworked.0000.revealed.scheme_target.success.child: "\n\nTa sẽ không bao giờ nhìn thấy nỗi tuyệt vọng đau lòng của gia đình, cũng không nghe những lời thì thầm của người hầu: 'Chính [owner_to_reveal.GetTitledFirstName]!'"
  murder_outcome_reworked.0000.revealed.scheme_target.success.baby: "\n\nTa sẽ không hiểu nỗi hoảng loạn khi người hầu tìm thấy Ta, cũng không nghe lời thì thầm: 'Chính [owner_to_reveal.GetTitledFirstName]!'"
  murder_outcome_reworked.0000.revealed.scheme_target.failure.baby: "\n\nTa không hiểu tiếng la hét của người hầu khi tìm thấy Ta, cũng không nghe lời thì thầm: 'Chắc chắn là [owner_to_reveal.GetTitledFirstName]!'"
  murder_outcome_reworked.0000.revealed.scheme_target.failure.baby.2: "\n\nTa không hiểu lời thì thầm giận dữ của người hầu: 'Chắc chắn là [owner_to_reveal.GetTitledFirstName]!'"
  murder_outcome_reworked.0000.revealed.scheme_target.success.baby.end: "Dù sao thì Ta chỉ là một đứa bé."
  murder_outcome_reworked.0000.revealed.scheme_target.failure.baby.end: "Dù sao thì Ta chỉ là một đứa bé."
  murder_outcome_reworked.0000.revealed.scheme_target.success.1.incapable: "\n\nKhi cơ thể Ta được tìm thấy, nhiều lời sẽ được nói, ý nghĩa mà trí óc yếu ớt Ta đã quên từ lâu: 'Chính [owner_to_reveal.GetTitledFirstName]!'"
  murder_outcome_reworked.0000.revealed.scheme_target.failure.1.incapable: "\n\nNếu lời vẫn còn ý nghĩa, Ta sẽ nhận ra những gì mọi người xung quanh lầm bầm và lặp lại giận dữ: 'Chắc chắn là [owner_to_reveal.GetTitledFirstName]!'"
  murder_outcome_reworked.0000.revealed.scheme_target.success.no_linebreak.1: "Không một chút nghi ngờ trong Ta về kẻ gây ra điều này. [owner.GetTitledFirstName]!"
  murder_outcome_reworked.0000.revealed.scheme_target.success.no_linebreak.2: "Chắc chắn đây là công việc của [owner.Custom2('InsultAdjective', ROOT.Char)] [owner.Custom2('InsultNoun', ROOT.Char)], [owner_to_reveal.GetTitledFirstName]!"
  murder_outcome_reworked.0000.revealed.scheme_target.failure.1: "\n\nDù [owner_to_reveal.GetHerHis] phản đối kịch liệt, tất cả bằng chứng đều chỉ ra sự liên quan trực tiếp của [owner_to_reveal.GetTitledFirstName] trong vụ việc."
  murder_outcome_reworked.0000.revealed.scheme_target.failure.2: "\n\nKhông chỉ vụ ám sát thất bại, mà dấu vết vụng về để lại dẫn thẳng đến kẻ chủ mưu: [owner_to_reveal.GetTitledFirstName]!"

