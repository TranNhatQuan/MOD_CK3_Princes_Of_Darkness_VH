 # Outcome Responses

 # Revealed (Scheme Owner)
  murder_outcome_reworked.0000.revealed.owner.response.1: "Những lời buộc tội bỉ ổi này!"

 # General Successful Responses (Scheme Target)
  murder_outcome_reworked.0000.successful_scheme_target.adult: "Ta vẫn còn quá nhiều việc phải làm..."
  murder_outcome_reworked.0000.successful_scheme_target.child: "Thật không công bằng!"
  murder_outcome_reworked.0000.successful_scheme_target.incapable: "Rồi, chỉ còn hư vô."

 #################################################
 # Outcomes — Standard

 # Hired an Assassin
  murder_outcome_reworked.0001.desc.assassin_present_at_location.consort: "[assassin.GetFirstName], với vai trò [target.GetHerHis] [assassin.Custom2('GetYourConsortType', target)], tất nhiên đã có mặt: tất cả những gì [assassin.GetSheHe] phải làm là chờ [target.GetFirstNameNoTooltip] ngủ, rút dao từ gối [assassin.GetHerHis], và cắt cổ [target.Custom2('InsultNoun', ROOT.Char)]. Một sợi dây thòng từ cửa sổ, vài vết cắt tự tạo, và dấu hiệu vật lộn chuẩn bị sẵn bên dưới giả mạo Xóa Bạn thực sự rất khéo."
  murder_outcome_reworked.0001.desc.hired_assassin.assassin_present_at_location: "[assassin.GetFirstName] đã thi hành kế hoạch của chúng ta một cách hoàn hảo. Giữa đêm khuya thanh vắng, [assassin.GetSheHe] lẻn qua một kẽ hở của toán lính tuần tra, tự đưa [assassin.GetHerselfHimself] xâm nhập vào tẩm cung của con mồi với một chiếc chìa khóa ăn cắp được, và kết liễu sự tồn tại khốn khổ của [target.GetFirstNamePossessiveNoTooltip] bằng một cái chết máu me và đầy uất nghẹn."
  murder_outcome_reworked.0001.desc.hired_assassin.assassin_remote_working: "Tên đánh thuê của [assassin.GetFirstNamePossessive] đã thực thi kế hoạch của chúng ta một cách hoàn hảo. Giữa đêm khuya thanh vắng, [dummy_assassin_gender.GetWomanMan] đó đã lẻn qua một kẽ hở được trinh sát trước của toán lính tuần tra, tự đưa [dummy_assassin_gender.GetHerselfHimself] xâm nhập vào tẩm cung của con mồi với một chiếc chìa khóa ăn cắp được, và kết liễu sự tồn tại khốn khổ của [target.GetFirstNamePossessiveNoTooltip] bằng một cái chết máu me và đầy uất nghẹn."
  murder_outcome_reworked.0002.desc: "$murder_outcome.5001.hired_assassin$"
  murder_outcome_reworked.0003.desc: "Tên sát thủ đã phạm phải một sai lầm chí mạng vào khoảnh khắc nhạy cảm nhất! [target.GetFirstNameNoTooltip] choàng tỉnh và bắt gặp một bóng ma đầy hăm dọa ẩn trong màn đêm đang đứng cạnh giường của [target.GetHerHis], ngài lập tức hét lớn kêu cứu, khiến cho tên thuộc hạ giật mình hoảng hốt tháo chạy."
  murder_outcome_reworked.0004.desc: "Tiếng động tay chân lóng ngóng và lời nguyền thì thầm đánh thức Ta.\n\nGần bên Ta — #EMP quá gần khiến Ta khó chịu#! — là bóng dáng trong bóng tối, có vẻ hoảng sợ như Ta. Tiếng la hét của Ta khiến nó chạy, trong khi lính gác Ta lao tới."
 
 # Hired A Gang Of Thugs
  murder_outcome_reworked.0011.desc: "Thật ra không cần nhiều — chỉ một băng cướp thèm bạc và cơ hội được sắp đặt để tấn công — nhưng kết quả thật #EMP xuất sắc#!. Cuộc chiến khiến [target.GetHerHis] lính bảo vệ hoàn toàn bất ngờ, cho một tên cướp có thể xuyên thẳng mắt hắn."
  murder_outcome_reworked.0012.desc.alley: "Đoàn tùy tùng và Ta đi qua ngõ sau của [target.GetCurrentLocation.GetName],"
  murder_outcome_reworked.0012.desc.wilderness: "Đoàn tùy tùng và Ta đi qua vùng hoang dã của [target.GetCurrentLocation.GetName],"
  murder_outcome_reworked.0012.desc: "khi tiếng la hét rợn tóc gáy vang qua đội hình.\n\nBất ngờ từ đâu, một băng cướp lao tới! Mũi tên và gươm bay tứ phía, sự tàn nhẫn khiến lính gác Ta chết hàng loạt. Không muốn cái bẫy này trở thành mồ chôn mình, Ta tháo chạy, tìm nơi an toàn. Rồi, qua tiếng ồn trận, Ta nghe tiếng đàn dây cung vang lên."
  murder_outcome_reworked.0013.desc: "Kế hoạch của chúng ta tưởng chừng... quá đỗi hoàn hảo... một sự xao nhãng được sắp đặt tinh vi, một đám thảo khấu liều mạng, và một cuộc phục kích bất ngờ. Nơi đó #EMP lẽ ra#! đã là nấm mồ của [target.GetFirstNamePossessiveNoTooltip], nhưng đám lính gác ngu ngốc chết tiệt của [target.GetHerHis] đã lấy thân mình chắn đỡ từng cú đấm, mũi tên, hay lưỡi đao, rồi chúng tập hợp lại và phản công. Đám lính đánh thuê của ta đã ngã xuống như ngả rạ."
  murder_outcome_reworked.0014.desc: "khi tiếng la hét rợn tóc gáy vang qua đội hình.\n\nBất ngờ từ đâu, một băng cướp lao tới! Cuộc tấn công dữ dội, nhưng chưa bằng cơn thịnh nộ của lính Ta, và chúng Ta xông ra đối mặt. Một trận chiến ác liệt diễn ra, những kẻ cướp #EMP rõ ràng#! nhắm vào Ta nhiều nhất. Chỉ kẻ ngu mới không nhận ra đây là âm mưu ám sát."

 # Poisoning
  murder_outcome_reworked.0021.desc: "Phải mất tuần để chuẩn bị kế hoạch: một món ăn có độc, xứng với [target.GetWomanMan] cỡ [target.GetHerHis]. Hắn ngu ngốc, [target.GetFirstNameNoTooltip] không ngửi thấy mùi độc qua lớp thảo mộc trên con vịt. Rõ ràng chưa nhận ra mùi đắng chết người cho tới khi quá muộn."
  murder_outcome_reworked.0022.desc: "Ta đang thưởng thức vịt quay ngon tuyệt khi... sao lại có vị đắng lạ thế? Đầu bếp ngu ngốc hẳn phải —\n\nCổ Ta sưng. Một cái gì đó nặng nề nổ ra trong cổ, tầm nhìn mờ đi, đau đầu ập lên như bão. Tại sao... sao tầm nhìn mờ tối. Một tiếng cười xa xăm biến thành tiếng la hét kinh hoàng. Ta không thể tập trung, #DIE1 Ta không thể nghĩ#!, #DIE2 Ta không thể...#!"
  murder_outcome_reworked.0023.desc: "#EMP Đồ ngu!#! Sao luôn có một kẻ phá hỏng kế hoạch hoàn hảo?!\n\nCon vịt đã sẵn sàng, mùi độc giấu dưới thảo mộc thơm, sự im lặng của bếp đã mua chuộc... Và rồi một tên hầu #EMP had#! phải nếm thử, chỉ để chết ngay trước mặt [target.GetFirstNameNoTooltip]!"
  murder_outcome_reworked.0024.desc: "Khi Ta sắp cắn miếng vịt ngon nhất từng thấy, một tên hầu ngã sấp bàn, ôm cổ họng. Hắn đã tự giúp mình một miếng!\n\nÍt nhất, hắn là lời cảnh báo để không chạm vào con vịt, đồng thời nhận hình phạt xứng đáng."
 
 # Creepy-Crawly
  murder_outcome_reworked.0031.desc: "Kế hoạch thành công rực rỡ: con [SCOPE.Custom('VenomousCreature')] quý giá của ta đã nằm đợi sẵn [target.GetFirstNameNoTooltip] trên giường của [target.GetHerHis] khi [target.GetSheHe] đi ngủ gác lại mọi chuyện đêm nay, im lìm và sẵn sàng xuất kích ngay khi bị đụng chạm. Và rồi [target.GetFirstNameNoTooltip] nhúc nhích."
  murder_outcome_reworked.0033.desc: "Kế hoạch lẽ ra phải là hoàn hảo không tì vết: một con [SCOPE.Custom('VenomousCreature')] đã nằm đợi sẵn [target.GetFirstNameNoTooltip] trên giường của [target.GetHerHis] khi [target.GetSheHe] đi ngủ; [target.GetSheHe] chỉ cần ngả lưng xuống và để cho sinh vật nhỏ bé đó làm nhiệm vụ của nó! Thế nhưng thay vào đó, [target.Custom2('InsultNoun', ROOT.Char)] đó đã nhận ra những chuyển động khả nghi trong chăn và giết chết con [SCOPE.Custom('VenomousCreatureType')] trước khi nó kịp ra đòn."
  murder_outcome_reworked.0034.desc: "Khi Ta lên giường, chuyển động lạ trên chăn thu hút Ta. Ta kéo chăn cẩn thận, không để làm giật mình khách không mời, và thấy một [SCOPE.Custom('VenomousCreatureType')] chờ Ta!\n\n"
  murder_outcome_reworked.0034.desc_unknown: "Ta không xác định chính xác sinh vật nhỏ này, nhưng chắc chắn không thân thiện."
  murder_outcome_reworked.0034.desc_end: "Không chần chừ, Ta cầm dao găm đâm thẳng vào sinh vật."
 
 # Riled-Up Mob
  murder_outcome_reworked.0041.desc: "Một đám đông bần nông giận dữ và kích động đã đứng đợi sẵn [target.GetFirstNameNoTooltip] trên đường [target.GetHerHis] đi ngang qua thị trấn.\n\nChỉ vừa thoáng thấy [target.GetLadyLord] thong dong cưỡi ngựa qua là đã đủ để khiến bọn chúng bùng nổ bạo lực đoạt mạng. Vài tên lính gác hộ tống chủ nhân đều bất lực trước cơn thịnh nộ mù quáng của một đám đông đang khao khát đổ máu; [target.GetFirstNameNoTooltip] đã bị chà đạp, đánh đập và đâm chém tới mức chẳng thể nhận dạng nổi — dập tắt mọi cơ may sống sót."
  murder_outcome_reworked.0042.desc: "Ta mải mê trong suy nghĩ khi cưỡi ngựa qua thị trấn, nên không để ý đến tiếng lẩm bẩm lo lắng của vệ sĩ hay đám đông ngày càng đông chắn đường chúng Ta. Khi nhận ra, thì đã quá muộn.\n\nNhững người nông dân giận dữ bao quanh chúng Ta, giật chúng Ta khỏi ngựa và đánh đập tàn nhẫn. Khi những cú đánh liên tiếp rơi xuống Ta, quá nhiều đến không thể đếm, tầm nhìn của Ta bị che khuất bởi máu, rồi mọi thứ tối đen."
  murder_outcome_reworked.0043.desc: "Mọi chuyện đều đang diễn tiến rất tốt đẹp: những kẻ xúi giục của ta đã tập hợp thành công một đám đông bần nông và kích động tinh thần của họ chống lại [target.GetFirstNameNoTooltip].\n\nTuy nhiên, khi [target.GetFirstNameNoTooltip] xuất hiện cùng đám lính canh vũ trang hộ tống xung quanh, cơn khát máu của đám đông đã bốc hơi như tuyết tan dưới mặt trời! Chỉ còn lại vài kẻ tụt hậu dám xông lên tấn công, và chúng đã nhanh chóng bị bọn lính gác tiêu diệt."
  murder_outcome_reworked.0044.desc: "Khi Ta cưỡi ngựa qua thị trấn cùng đoàn tùy tùng, Ta không thể không nhận thấy đám đông ngày càng đông xung quanh từ mọi phía.\n\nMay mắn thay, sáng nay Ta quyết định xuất phát cùng một nhóm binh lính vũ trang đông đảo, cảnh tượng này thật hiệu quả để làm dịu sự bất mãn của đám đông. Khi một nhóm nông dân trông giận dữ cố gắng tấn công chúng Ta, vệ sĩ của Ta nhanh chóng hạ gục họ, giải tán những kẻ còn lại."
 
 # Bricked Up Alive
  murder_outcome_reworked.0051.desc: "Kế hoạch thật đơn giản mà tinh tế: Ta mời [target.GetFirstNameNoTooltip] đến uống rượu, biết rất rõ rằng [target.GetSheHe] sẽ không dừng lại cho đến khi say mềm. Sau đó, tên ngốc đó theo Ta vào tầng hầm mà không phản kháng và nhanh chóng ngủ thiếp đi. [target.GetSheHe|U] thậm chí không nhúc nhích khi các Ta tớ dựng lên một bức tường để bịt lối vào căn phòng. #EMP Mãi mãi.#!"
  murder_outcome_reworked.0053.desc: "Mọi thứ diễn ra đúng theo kế hoạch: Ta mời [target.GetFirstNameNoTooltip] đến uống rượu, biết rất rõ rằng [target.GetSheHe] sẽ không dừng lại cho đến khi say mềm. Sau đó, tên ngốc đó theo Ta vào tầng hầm mà không phản kháng và nhanh chóng ngủ thiếp đi. Các Ta tớ chỉ dự định xây một bức tường để nhốt [target.GetHerHim] bên trong, nhưng rõ ràng họ #EMP quá mệt#! và không hoàn thành công việc, nên [target.GetFirstNameNoTooltip] đã trốn thoát!"
 
 # Sink A Boat They're On
  murder_outcome_reworked.0061.desc: "Tàu thuyền luôn chìm. Đó là một sự thật của cuộc sống. Thỉnh thoảng, chúng được #EMP giúp#! chìm bằng một vài thủ thuật, đúng khi chúng hơi xa bờ. Cái ôm lạnh lẽo của biển cả thật đáng sợ, người ta kể lại. Ta có thể hỏi [target.GetFirstNameNoTooltip], nếu [target.GetSheHe] chưa chết đuối. Một #EMP bi kịch#! thực sự."
  murder_outcome_reworked.0062.desc_port: "Ta đang ở trên một con tàu địa phương cho chuyến giám sát ngắn. Bờ biển vẫn còn gần tầm mắt, và tâm trí Ta mải mê với một báo cáo nào đó nên Ta hầu như không nghe thấy tiếng kêu răng rắc và tiếng la hét của thủy thủ."
  murder_outcome_reworked.0062.desc_travel: "Ta yêu biển cả! Nắng hôn lên mặt Ta, gió thổi bay áo choàng, mùi muối biển tươi mát tràn ngập mũi, tiếng răng rắc rùng rợn kèm theo những tiếng la hét hoảng loạn của thủy thủ— Khoan, #EMP CÁI GÌ#!?!"
  murder_outcome_reworked.0062.desc: "\n\nTa không kịp phản ứng khi cột buồm gãy rơi lên người, hất hết không khí ra khỏi phổi và quăng Ta xuống biển. Cú sốc khi va chạm với nước lạnh làm phần còn lại, quần áo nặng kéo Ta xuống... dưới sóng..."
  murder_outcome_reworked.0063.desc: "Tàu thuyền luôn chìm. Đó là một sự thật của cuộc sống. Hoặc ít nhất, nó #EMP nên#! là như vậy! Khó đến mức nào để phá hỏng một mảnh đống rác nổi để nó chìm xuống cùng với [target.GetFirstNameNoTooltip]?!\n\nRõ ràng điều đó quá khó đối với đồng bọn của Ta, vì tàu của [target.GetFirstNamePossessiveNoTooltip] trở về an toàn chỉ với một trục trặc nhỏ trên đường đi. Một trục trặc được dàn dựng rõ ràng và có khả năng gây chết người."
  murder_outcome_reworked.0064.desc: "Tàu Ta đang lướt nhẹ dưới ánh hoàng hôn khi tiếng răng rắc và những tiếng la hét hoảng loạn của thủy thủ thu hút sự chú ý của Ta. Trong nháy mắt, Ta bị một trong những vệ sĩ quăng ra khi một phần cột buồm rơi và dừng ngay trước mặt Ta.\n\nThiệt hại trên tàu khá lớn, nhưng thuyền trưởng tự tin chúng Ta sẽ về cảng gần nhất an toàn. Và quan trọng nhất, không ai bị thương."
 
 # Poisoned Drink
  murder_outcome_reworked.0071.desc: "Đồng bọn của ta đã không gì khác ngoài tiếp cận được chiếc ly của chính [target.GetFirstNamePossessiveNoTooltip] trong bữa tối cuối cùng của [target.GetHerHis]! Thừa lúc không ai để ý, chúng đã rót vài giọt độc dược cực mạnh vào đồ uống của [target.GetHerHis]. [target.Custom2('InsultNoun', ROOT.Char)] tội nghiệp nọ đã uống cạn chiếc ly chỉ trong một hơi và chầu trời trước cả khi nhận ra chuyện gì đang xảy ra!"
  murder_outcome_reworked.0073.desc: "Đồng bọn của ta đã xoay sở tuồn trót lọt một thùng rượu tẩm độc vào bếp của [target.GetFirstNamePossessiveNoTooltip], đồng thời chuẩn bị và dâng cho [target.GetHerHim] một ly rượu đầy từ chiếc thùng đó. Ý tưởng dùng thùng rượu đúng là một sai lầm.\n\nTrước khi [target.Custom2('InsultNoun', ROOT.Char)] đó kịp đưa ly lên môi [target.GetHerHis], đám gia nhân đã xông vào phòng, thông báo rằng một ai đó khác đã chết ngay tức khắc sau khi uống từ chính thùng rượu kia."
  murder_outcome_reworked.0074.desc: "Ta đang thưởng thức bữa tối như bao buổi khác. Một ly đầy hấp dẫn đặt trước mặt Ta, thôi thúc Ta. Khi Ta cuối cùng đưa tay lấy, cả đám Ta tớ xông vào phòng la hét. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], dừng lại! Có độc! Một người trong chúng ta đã uống từ cùng thùng và lập tức chết!\" Tay Ta đứng im giữa không trung."
 
 #################################################
 # Outcomes — Children

 # Left Child In Forest
  murder_outcome_reworked.4001.desc: "[target.GetSheHe|U] đã vô cùng hào hứng với chuyến dạo chơi của [target.GetHerHis] tới khu rừng! Buồn thay, ai ai cũng biết rằng những cánh rừng đâu phải là chốn dành cho lũ trẻ — quá non nớt, quá #EMP ngây thơ#! — thật dễ dàng để chúng bị sự phấn khích của mình cuốn đi mà lạc mất phương hướng, đánh mất cả những người bảo vệ, và lạc cả đường về. Chúng sẽ không bao giờ trở về nữa. Giống như [target.GetFirstNameNoTooltip] bé nhỏ vậy. Thật là một thảm kịch."
  murder_outcome_reworked.4003.desc: "Lẽ ra mọi chuyện phải rất dễ dàng chứ! Những cánh rừng đâu phải là chốn dành cho trẻ nhỏ: tăm tối, hiểm nguy, đầy rẫy những khe núi sâu, thảo mộc có độc, và những loài ác thú khát máu! Làm sao một đứa trẻ lại khó đi lạc và mất mạng tới vậy chứ?!\n\nRõ ràng điều đó quá khó đối với [target.GetFirstNameNoTooltip], khi mà cái thứ tiểu quỷ này lại có #EMP gan#! tìm được đường của [target.GetHerHis] quay trở về nhà bình an vô sự!"
 
 # Infant Stabbed To Death
  murder_outcome_reworked.4011.desc: "Trẻ con thật mong manh... Bất kỳ căn bệnh nào cũng có thể cướp chúng khỏi gia đình. Hoặc bất kỳ tai nạn nào! Như những tai nạn liên quan đến những cái đầu bé nhỏ và kim nhọn — Ta không cần và không muốn nghe chi tiết, miễn là công việc hoàn tất. Thật kinh khủng, một #EMP nỗi ô nhục#!."
  murder_outcome_reworked.4013.desc: "Mọi người hay ngần ngại về trẻ con. Đồng bọn Ta đồng ý rằng [target.GetFirstNameNoTooltip] phải chết, họ được trả hậu hĩnh để thực hiện, nhưng vẫn chần chừ khi nhìn thấy em bé ngủ yên! Thật dễ dàng, chỉ cần một nhát dao nơi mềm nhất trên đầu, và mọi thứ đã xong... Một cơ hội bị lãng phí."
 
 # Infant Bitten By Creepy Crawly
  murder_outcome_reworked.4021.desc: "Con người thật lạ. Thật khó để tìm ai dám động tay lên một trẻ sơ sinh, nhưng đặt một [SCOPE.Custom('VenomousCreature')] trong nôi lại, rõ ràng, dễ chấp nhận hơn nhiều. [SCOPE.Custom('VenomousCreatureType')], về phần nó, cũng không ngần ngại gì và đã tấn công chuẩn xác. Nọc độc phát huy tác dụng nhanh chóng và tàn nhẫn."
  murder_outcome_reworked.4023.desc: "[SCOPE.Custom('VenomousCreature')] được đưa tới giường của [target.GetFirstNamePossessiveNoTooltip] như dự định, nhưng dường như chuyển động của trẻ sơ sinh khiến nó sợ và trốn thay vì tấn công. Sinh vật vô dụng này được một Ta tớ tìm thấy vài giờ sau, ẩn dưới tủ. Đứa bé bị nguyền rủa không hề hấn gì."
  murder_outcome_reworked.4024.desc: "Một chiếc giường mềm dưới Ta và chăn ấm phủ lên Ta là tất cả những gì Ta mong muốn. Ta gần như bất tỉnh khi cảm nhận mơ hồ một cảm giác kỳ lạ, như thể có gì đó bò lên cơ thể. Ta quay mạnh sang một bên và cảm giác biến mất. Ta ngủ tiếp.\n\nVề sau, Ta bị đánh thức bởi tiếng la hét chói tai của một Ta tớ. Ta không chắc chuyện gì đang xảy ra: nhiều người lớn chạy xung quanh, giọng mạnh mẽ vang lên, và nhiều người chỉ vào một thứ Ta không thấy dưới tủ."
 
 # Poisoned Candy
  murder_outcome_reworked.4031.desc: "Trẻ con thật dễ bị lừa! Ta chỉ cần cải trang một đồng bọn thành Ta tớ, để hắn mang một miếng bánh trông thật ngon, hoàn toàn có độc, đến [target.GetFirstNameNoTooltip], và tên nhóc ngu ngốc đó chỉ nuốt chửng trong một miếng to, không thắc mắc gì!\n\nCó lẽ nên bắt đầu dạy trẻ không nhận kẹo từ người lạ..."
  murder_outcome_reworked.4033.desc: "Đồ trẻ con và tính khó đoán của chúng! Lẽ ra phải dễ dàng thôi: lén đưa món ngon có độc không thể cưỡng lại đến [target.GetFirstNameNoTooltip], và [target.GetFirstNameNoTooltip] chết. Một đứa trẻ kiểu gì lại nói \"Ta không đói\" khi được mời #EMP kẹo?#!"
  murder_outcome_reworked.4034.desc: "Ta đang chơi ngoài trời, hơi khát, khi một Ta tớ xuất hiện từ hư không, đưa cho Ta một [ROOT.Char.Custom('FavoriteTreat')]. Nhưng Ta không muốn [ROOT.Char.Custom('FavoriteTreat')], Ta muốn uống! Ta tớ ngốc!\n\nTa đã quên hết mọi chuyện khi vài Ta tớ đến gặp Ta, vài giờ sau, chúc mừng Ta vì thông minh và dũng cảm, phá hoại kế hoạch xấu hay gì đó. Kệ. Nhưng giờ Ta muốn [ROOT.Char.Custom('FavoriteTreat')]!"
 
 # Child Pushed To Death
  murder_outcome_reworked.4041.desc: "Mọi thứ rồi cũng rơi xuống: vương quốc, [ROOT.Char.Custom('LadiesLords')], #EMP trẻ bị đẩy từ trên cao#!...\n\nMột bi kịch không thể tránh khỏi."
  murder_outcome_reworked.4043.desc: "Khi đặc vụ của Ta đẩy [target.GetHerHim] khỏi mép, quần áo [target.GetHerHis] vướng vào một mảnh tường nhô ra bên dưới. Nó giữ [target.GetHerHim] đủ lâu để giúp đến cứu cả đứa trẻ và"
 
 #################################################
 # Outcomes — Prison

 # Beaten To Death In Prison
  murder_outcome_reworked.7001.desc: "Một điều chắc chắn trong cuộc sống là cai ngục chỉ quan tâm ai được phép rời khỏi nhà tù, và hầu như không quan tâm ai vào hay chuyện gì xảy ra với họ.\n\nKhi đồng bọn Ta đưa cho họ một hối lộ hậu hĩnh để được thăm #EMP người Bạn Tốt#! [target.GetFirstNameNoTooltip], họ chỉ quá sẵn lòng chấp nhận. Lờ đi tiếng la hét và xương gãy chỉ là một phần của dịch vụ."
  murder_outcome_reworked.7003.desc: "$murder_outcome_reworked.7001.desc$ Vậy sao họ lại phải can thiệp trước khi công việc hoàn tất?!"
  murder_outcome_reworked.7004.desc: "$murder_outcome.5001.beat_to_death_in_dungeon$ Rồi, những cai ngục thường lệ của Ta xông vào, và vụ đánh đập dừng lại."
 
 # Unwelcome Guest - House Arrest
  murder_outcome_reworked.7011.desc: "Tù nhân dưới quản chế tại gia cần được giám sát chặt chẽ; vì vậy, lén đưa một đặc vụ của Ta vào nhà [target.GetFirstNamePossessiveNoTooltip] dưới vỏ bọc là thăm một người Ngài cũ thực sự là một bước đi thiên tài, nếu Ta có thể nói vậy! Đồng bọn Ta vào và ra trước khi vệ sĩ kịp nhận ra có gì đó sai."
  murder_outcome_reworked.7012.desc: "Vệ sĩ Ta đã giới thiệu một nhân vật trùm mũ lạ vào phòng Ta như một người Ngài cũ. Ta định phản đối rằng chắc có nhầm lẫn, vì rõ ràng Ta không quen người này, thì một con dao sáng ló ra từ túi giấu. #EMP Ồ.#! Nó là một trong #EMP những#! người Ngài cũ đó.\n\nTa không kịp phản ứng khi dao bay tới nhanh hơn mũi tên, và Ta ngã xuống đất không phát ra tiếng động."
  murder_outcome_reworked.7013.desc: "Tù nhân dưới quản chế tại gia cần được giám sát chặt chẽ; vì vậy, lén đưa một đặc vụ của Ta vào nhà [target.GetFirstNamePossessiveNoTooltip] dưới vỏ bọc thăm một người Ngài cũ đáng lẽ là một bước đi thiên tài! Thật đáng tiếc, vệ sĩ không tin câu chuyện của đồng bọn Ta và đứng ngoài phòng, sẵn sàng can thiệp nếu có dấu hiệu khả nghi. Rõ ràng, cố giết người #EMP cũng#! được tính là #EMP hành vi khả nghi#!."

 #################################################
 # Outcomes — Special/Other
 
 # Strangling Incapable
  murder_outcome_reworked.8001.desc: "Những tháng ngày hoàng kim của [target.GetFirstNamePossessiveNoTooltip] đã bị bỏ lại phía sau [target.GetHerHim] từ lâu. Vậy mà [target.GetSheHe] vẫn bám víu lấy sự sống lâu đến thế, liều lĩnh đến thế, và #EMP vô ích#! đến thế... Ta tin rằng những gì thuộc hạ của ta đã làm không gì khác ngoài một sự nhân từ. [target.GetFirstNameNoTooltip] vốn chỉ còn là một cái vỏ rỗng tuếch. Liệu đó có thực sự là mưu sát không chứ?"
  murder_outcome_reworked.8003.desc: "Thật quá đáng khi một đặc vụ lại kém cỏi đến mức này. Khó đến mức nào để siết cổ một người mong manh, tâm trí không còn hiện diện và gần như đã chết?! Thế mà Ta chỉ gặp thất bại."
