l_english:
  do_not_execute_murder_tooltip:0 "Đừng cố ám sát"
  murder_child_really_tooltip:1 "Giết một đứa trẻ. Ngài chắc chứ?"
  murder_outcome_murdered_rival_tt: "Ngài nhận được [prestige_i][EmptyScope.ScriptValue('rival_outlived_prestige_value')|P0] vì sống lâu hơn [rival|E] của Ngài"
  murder_unknown_murder_against_you_was_successful:0 "#X Ngài đã bị sát hại bởi một kẻ tấn công ẩn danh!#!"
  murder_unknown_murder_against_you_was_successful_other:0 "#X [THIS.Char.GetShortUIName] đã bị sát hại bởi một kẻ tấn công ẩn danh!#!"

  murder_outcome.1001.t:0 "Kẻ Ám Sát!"
  murder_outcome.1001.d:0 "Thời khắc đã đến. Các đại lý của Ta đã sẵn sàng. Một trong số họ sẽ trả tiền cho kẻ ám sát vào đêm xảy ra việc đó. Người khác sẽ đảm bảo bức tường không có lính canh. Người thứ ba sẽ để lại dấu vết nến dẫn tới phòng ngủ của [target.GetTitledFirstNamePossessive].\n\nMọi thứ đã sẵn sàng."
  murder_outcome.1001.a:0 "Hãy làm đi."
  murder_outcome.1001.b:0 "Đợi đã, Ta chưa sẵn sàng."

  murder_outcome.1002.t:0 "Chặn Đường"
  murder_outcome.1002.opening:0 "Các đại lý của Ta đã sắp xếp một chuyến đi cho [target.GetTitledFirstName] qua rừng tối. $murder_outcome.1002.d$"
  murder_outcome.1002.opening_travel:0 "Các mật thám của ta đã nắm được tin [target.GetTitledFirstName] đang thực hiện một chuyến du hành tới [province.GetName], hành trình này sẽ đưa [target.GetHerHim] đi qua vài vùng hoang dã.\n\n$murder_outcome.1002.d$"
  murder_outcome.1002.d:1 "Chỉ còn thiếu băng nhóm côn đồ sẽ giết [target.GetHerHim] trong một vụ cướp đường đi sai lầm.\n\nTa đã tưởng tượng được máu của [target.GetHerHis] thấm vào đất tối..."
  murder_outcome.1002.a:1 "Ôi, rừng rậm thật nguy hiểm."
  murder_outcome.1002.b:0 "Đợi đã, không phải lúc này."

  murder_outcome.1003.t:0 "Bữa Ăn Tử Thần"
  murder_outcome.1003.d:0 "Các đại lý của Ta đã chuẩn bị suốt nhiều tuần. Đầu bếp đã bị hối lộ làm ngơ, thuốc độc đã có, và con vịt được tặng riêng cho [target.GetTitledFirstName]. Nó sẽ được bôi thuốc độc, và lớp thảo mộc sẽ che mùi khi phục vụ. Vị đắng chết người sẽ là thứ cuối cùng mà mục tiêu của Ta nếm."
  murder_outcome.1003.a:0 "Chúc ngon miệng, [target.GetFirstNameNoTooltip]..."
  murder_outcome.1003.b:0 "Đợi đã, Ta cần thêm thời gian chuẩn bị!"

  murder_outcome.1004.t:0 "Khách Không Mời"
  murder_outcome.1004.desc:0 "Một trong các đại lý của Ta đã có được [SCOPE.Custom('VenomousCreature')], và sắp xếp cho một người hầu giấu nó trong giường của [target.GetTitledFirstNamePossessive] trước khi trời tối.\n\nChỉ cần Ta gật đầu, [target.GetSheHe] sẽ coi như chết ngay khi [SCOPE.Custom('VenomousCreatureType')] tấn công."
  murder_outcome.1004.a:0 "Hy vọng Ngài không sợ [SCOPE.Custom('VenomousCreatureTypePlural')], [target.GetFirstNameNoTooltip]..."
  murder_outcome.1004.b:0 "Đây không phải cách làm."

  murder_outcome.1005.t:1 "$knight_culture_player_plural_no_tooltip$ và Nông Dân"
  murder_outcome.1005.desc:0 "Với cuộc nổi loạn gần đây của nông dân ở [home_province.GetNameNoTier], một trong các đại lý của Ta đưa ra đề xuất độc đáo để xử lý [target.GetTitledFirstName].\n\nVới tiền rơi đúng túi và những kẻ kích động ở mọi góc đường, chúng ta có thể dựng lên một cuộc bạo loạn khi [target.GetTitleTierName] đi qua phố."
  murder_outcome.1005.a:0 "Thời gian cho chế độ đám đông kiểu cũ."
  murder_outcome.1005.b:0 "Điều này quá khó đoán!"

  murder_outcome.1006.t:0 "Thùng Rượu"
  murder_outcome.1006.desc:0 "[target.GetTitledFirstName] sẽ tham dự lễ hội địa phương ở [home_province.GetName], và Ta biết rằng [target.GetSheHe] là một người mê rượu.\n\nTa có thể dụ [target.GetHerHim] vào hầm rượu của [target.Custom('ResidenceBuilding')] để thử rượu riêng, và rồi đảm bảo [target.GetSheHe] không bao giờ ra ngoài nữa...!"
  murder_outcome.1006.a:0 "Chuyện này sẽ dễ thôi!"

  murder_outcome.1007.t:0 "Trên Sóng Nước"
  murder_outcome.1007.travel:0 "[target.GetTitledFirstName] hiện đang trên một con tàu ở [province.GetName]."
  murder_outcome.1007.desc_not_inspection:0 "[target.GetTitledFirstName] sẽ ghé thăm một con tàu neo ở cảng [province.GetNameNoTier] trong tuần tới."
  murder_outcome.1007.desc:0 "[target.GetTitledFirstName] sẽ kiểm tra một con tàu neo ở cảng [province.GetNameNoTier] trong tuần tới."
  murder_outcome.1007.desc_ending:0 "\n\nThật dễ để các đại lý của Ta tẩm thuyền chở [target.GetHerHim] bằng chất dễ cháy, đợi khi ra giữa cảng, phóng mũi tên cháy, rồi... để nước nuốt chửng [target.GetHerHim]."
  murder_outcome.1007.desc_ending_travel:0 "\n\nSẽ là một thảm kịch nếu các thân tín của ta tưới thứ chất lỏng dễ cháy lên ván thuyền, tẩu thoát trên chiếc thuyền mái chèo duy nhất và phóng hỏa đốt tàu khi chúng an toàn rút lui... qua đó nắm chắc cái chết của [target.GetFirstNamePossessiveNoTooltip] cùng đám tùy tùng của [target.GetHerHis]."
  murder_outcome.1007.a:0 "Bắt đầu thực hiện kế hoạch."

  murder_outcome.1008.t:0 "Ly Nước Cuối Cùng"
  murder_outcome.1008.desc:0 "Các đại lý của Ta đã có một loại bột kín đáo, không để lại dấu vết khi hòa vào nước uống. Những người hầu phụ trách rót nước cho [target.GetTitledFirstNamePossessive] đã bị hối lộ để làm ngơ, và chỉ còn chờ Ta phê duyệt để giấu thuốc độc vào thức uống tiếp theo của [target.GetHerHis]."
  murder_outcome.1008.a:0 "Một ly chúc sức khỏe [target.GetShortUINamePossessiveNoTooltip]!"

  murder_outcome.1201.t:0 "Con Đường Ít Người Đi"
  murder_outcome.1201.desc:0 "[assassin.GetTitledFirstName] chuẩn bị một chuyến đi đặc biệt cho trẻ [target.GetTitledFirstName]. Đứa trẻ tin rằng [target.GetSheHe] sẽ có một ngày vui chơi trong rừng.\n\nKhông may, [target.GetFirstNameNoTooltip] sẽ lạc, và không tìm thấy trước khi trời tối. Ôi, [target.GetSheHe] còn quá nhỏ..."
  murder_outcome.1201.no_assassin:0 "Một trong các đại lý chuẩn bị chuyến đi đặc biệt cho trẻ [target.GetTitledFirstName]. Đứa trẻ tin rằng [target.GetSheHe] sẽ có một ngày vui chơi trong rừng.\n\nKhông may, [target.GetFirstNameNoTooltip] sẽ lạc, và không tìm thấy trước khi trời tối. Ôi, [target.GetSheHe] còn quá nhỏ..."
  murder_outcome.1201.a:0 "Một đứa trẻ lạc trong rừng... Điều này xảy ra quá thường xuyên."
  murder_outcome.1201.b:0 "Không, Ta phải suy nghĩ lại!"

  murder_outcome.1202.t:0 "Không Phòng Vệ"
  murder_outcome.1202.desc:0 "Đã đến lúc. Một trong những người nuôi trẻ của [target.GetTitledFirstNamePossessive] sẵn sàng làm việc cần làm, tất nhiên với đủ thù lao.\n\nTa ra hiệu cho đại lý ra đi trước khi [dummy_gender.GetSheHe] kịp mô tả mục đích của chiếc kim nhọn."
  murder_outcome.1202.a:0 "Hãy làm, bất kể giá nào."
  murder_outcome.1202.b:0 "Ta đã nghĩ gì thế nhỉ?"

  murder_outcome.1203.desc:0 "Khó tìm người dám động tay với trẻ sơ sinh, nhưng tìm người đặt [SCOPE.Custom('VenomousCreatureType')] vào nôi thì dễ hơn.\n\nTa nhìn đại lý nhét [SCOPE.Custom('VenomousCreature')] vào túi nhỏ và rùng mình – nó gần bằng nạn nhân tương lai!"

  murder_outcome.1204.t:0 "Thích Ngọt"
  murder_outcome.1204.desc:0 "Nếu có một thứ mà cá nhân [target.GetTitledFirstName] chẳng thể nào cưỡng lại, thì đó chính là món ngon yêu thích của [target.GetHerHis]...\n\nMón đồ ngọt tiếp theo của [target.GetHerHis|U] sẽ gồm một phần [target.Custom('FavoriteTreat')] và một phần kịch độc – được mật thám của ta "vô tình để quên" ngay trước mặt đứa trẻ."
  murder_outcome.1204.a:0 "Chúc ngọt ngào!"

  murder_outcome.1205.t:0 "Chiều Cao Nguy Hiểm"
  murder_outcome.1205.desc_opening:0 "Thời khắc của [target.GetTitledFirstNamePossessive] đã đến. Mọi thứ rồi sẽ rơi: vương quốc, [ROOT.Char.Custom('LadiesLords')], #EMP những đứa trẻ bị đẩy từ chỗ cao#!...\n\n"
  murder_outcome.1205.desc_dog:0 "Đại lý buộc dây vào chú chó của [target.GetTitledFirstNamePossessiveNoTooltip] và treo lên tường cao– tiếng kêu sẽ lôi kéo đứa trẻ."
  murder_outcome.1205.desc_cat:0 "Đại lý buộc dây vào chú mèo của [target.GetTitledFirstNamePossessiveNoTooltip] và treo lên tường cao– tiếng kêu sẽ lôi kéo đứa trẻ."
  murder_outcome.1205.desc_toy:0 "Đại lý buộc dây vào món đồ chơi ưa thích của [target.GetTitledFirstNamePossessiveNoTooltip], [target.Custom('child_favorite_toy_indefinite')], và treo lên tường cao– [target.GetSheHe] chắc chắn sẽ tìm."
  murder_outcome.1205.desc:0 "Đại lý để lại một dấu vết kẹo dẫn lên cao, cao, cao– đủ làm dạ dày [target.GetTitledFirstNamePossessiveNoTooltip] cồn cào. Khi lên tới đỉnh, [target.GetSheHe] sẽ thấy giỏ đầy đồ ăn treo trên tường."
  murder_outcome.1205.desc_ending:0 "Và khi [target.GetSheHe] cúi xuống tháo dây, thật dễ dàng để [target.GetHerHim] trượt..."
  murder_outcome.1205.a:0 "Thật là một bi kịch."

  murder_outcome.1301.t:0 "Bị Quên Trong Bóng Tối"
  murder_outcome.1301.desc:0 "Có vẻ như chỉ cần đưa ra một cái giá thích hợp, đám cai ngục thuộc ngục tối của [prison_owner.GetTitledFirstNamePossessive] sẽ "tiện thể" làm lơ một đám cận thần, khi bọn chúng tìm đường tới ban cho [target.GetTitledFirstName] chuyến viếng thăm cuối cùng mà [target.GetSheHe] từng có..."
  murder_outcome.1301.a:0 "Bao lâu để [prison_owner.GetFirstNameNoTooltip] nhận ra [target.GetFirstNameNoTooltip] đã chết?"
  murder_outcome.1301.b:0 "Không, lúc này chưa phải."

  murder_outcome.1302.t:0 "Khách Không Mời"
  murder_outcome.1302.desc:0 "Quả thực rất khó để tiếp cận [target.GetTitledFirstName] trong thời gian [target.GetHerHis] bị giam lỏng tại gia. Tuy nhiên, mật thám của ta đã tìm được một kẻ thuộc hạ cũ từ"
  murder_outcome.1302.home_court_exists:0 "triều đình tại [target_home.GetNameNoTier],"
  murder_outcome.1302.home_court_does_not_exists:0 "triều đình cũ của [target.GetHerHis],"
  murder_outcome.1302.end:0 "sẵn sàng giả làm  Bạn của[target.GetFirstNamePossessive], tới thăm..."
  murder_outcome.1302.a:0 "Hãy vũ trang cho kẻ thuộc hạ đó và đưa [dummy_gender.GetHerHim] lên đường để thực hiện nghĩa vụ của [dummy_gender.GetHerHis]."
  murder_outcome.1302.b:0 "Không, lúc này chưa phải."

  murder_outcome.1401.t:0 "Một Lòng Thương Xót"
  murder_outcome.1401.desc:0 "Tội nghiệp, [target.GetTitledFirstName] vô lực... Khi nào một mạng sống đáng để sống?\n\nMột trong các đại lý đã sắp xếp cho kẻ ám sát xâm nhập vào phòng nơi [target.GetTitleTierName] bất lực 'nghỉ ngơi'."
  murder_outcome.1401.a:0 "Điều này là tốt nhất."
  murder_outcome.1401.b:0 "Không, việc này có vẻ sai."

  murder_outcome.2000.t:0 "Ngẫu Nhiên Định Mệnh"
  murder_outcome.2000.desc:0 "Khi Ta chuẩn bị tất cả những gì cần thiết để [target.GetTitledFirstNamePossessive] rời khỏi thế giới này thì bị một người hầu gián đoạn. [owner.Custom2('InsultNoun', ROOT.Char)] chết rồi mà chẳng cần Ta giúp đỡ!"
  murder_outcome.2000.a:0 "[ROOT.Char.GetFaith.DevilName|U] chắc hẳn rất mong muốn có công ty của [target.GetHerHis]!"
  murder_outcome.2000.a.tt:0 "[target.GetTitledFirstName] [target.GetDeathReason]"
  murder_outcome.2500.desc:0 "Khi Ta tiếp tục chuẩn bị cho cuộc gặp giữa [target.GetTitledFirstName] và [ROOT.Char.GetFaith.DevilName|U], Ta bị người hầu gián đoạn. [owner.Custom2('InsultNoun', ROOT.Char)] đã đi xa và giờ ngoài tầm với của Ta!"
  murder_outcome.2500.a:0 "Ngươi có thể trốn thoát Ta, nhưng không thể chạy trốn cái chết!"

  murder_outcome.2001.t:0 "Kẻ Ám Sát!"
  murder_outcome.2001.opening_1:0 "Kế hoạch thành công, và [target.GetName] cuối cùng đã chết!"
  murder_outcome.2001.opening_2:0 "Có vẻ khó tiếp cận [target.GetTitledFirstName] bằng chính [target.GetHerselfHimself], nhưng một khi kẻ ám sát đã thực hiện, [target.GetSheHe] không còn sống lâu nữa."
  murder_outcome.2001.opening_3:0 "Kẻ ám sát thực hiện xuất sắc, và [target.GetName] cuối cùng đã chết!"
  murder_outcome.2001.heh:0 "\nHeh."
  murder_outcome.2001.owner_is_known_1:0 "\n\nĐáng tiếc, trong khi Ta vẫn khẳng định cáo buộc chưa được chứng minh, không ai nghi ngờ rằng chính Ta đã làm."
  murder_outcome.2001.owner_is_known_2:0 "\n\nTuy nhiên, ai đó, ở đâu đó, đã sơ suất để lộ sự tham gia của Ta! Ít nhất Ta có thể an ủi bản thân với thực tế rằng [target.GetTitledFirstName] còn tệ hơn Ta."
  murder_outcome.2001.no_awareness_1:0 "\n\nMay mắn thay, sự tham gia của Ta trong vụ án vẫn chưa bị biết đến."
  murder_outcome.2001.no_awareness_2:0 "\n\nTa đã che dấu kỹ, và nếu ai nghi ngờ Ta đứng sau vụ tấn công, không ai dám nói ra."
  murder_outcome.2001.a.discovered:0 "Kẻ ám sát của Ta chỉ ở đó để bảo vệ [target.GetHerHim] khỏi #EMP Xóa Bạn thật#! Thật mà!"
  murder_outcome.2001.a:0 "Ta thích những chuyến ghé thăm bất ngờ."

  murder_outcome.2001.memories:0 "\n\nTa nhớ khi [bad_memory.GetDescription], [ROOT.Char.Custom('MurderMemoryEnding')]"

 
  murder_outcome.2002.t:0 "Những Chuyến Đi Nguy Hiểm"
  murder_outcome.2002.opening_1:0 "Nhờ kế hoạch thông minh và bọn côn đồ thuê, [target.GetTitledFirstName] cuối cùng đã chết!"
  murder_outcome.2002.opening_2:0 "Bọn côn đồ đã làm nhiệm vụ, và [target.GetTitledFirstName] không còn nữa!"
  murder_outcome.2002.opening_3:0 "[target.GetTitledFirstName] đã rời bỏ thế giới này, bị lưỡi dao cướp bóc đưa đi."
  murder_outcome.2002.heh:0 "\nHeh."
  murder_outcome.2002.no_save:0 "\n\nKhi đoàn đi dừng cắm trại, bọn cướp tràn ra từ rừng, đòi máu và vàng! Lính chống lại, nhưng may mắn là không đủ. [target.GetTitledFirstName] bi thương bị giết trong hỗn loạn."
  murder_outcome.2002.owner_is_known_1:0 "\n\nĐáng tiếc một tên cướp bị bắt và tiết lộ rằng Ta đã trả tiền để đảm bảo cái chết của [target.GetTitleTierNamePossessive]!"
  murder_outcome.2002.owner_is_known_2:0 "\n\nTuy nhiên, một tên cướp phải bị bắt, vì đã lộ ra rằng Ta đứng sau vụ tấn công!"
  murder_outcome.2002.no_awareness_1:0 "\n\nBọn cướp giờ bị săn lùng, và không ai nghi ngờ Ta!"
  murder_outcome.2002.no_awareness_2:0 "\n\nTiện lợi thay, hầu hết bọn cướp đã chết trong trận đánh, và kẻ chết không nói. Không ai biết đến sự tham gia của Ta!"
  murder_outcome.2002.a.discovered:0 "Tội duy nhất của Ta là tin tưởng bọn cướp hạ đẳng..."
  murder_outcome.2002.a:0 "Ha! Có lẽ dân thường không hoàn toàn vô dụng sao?"
  murder_outcome.2002.a.less_arrogant:0 "Hai vấn đề của Ta đã tự giải quyết cho nhau!"

  murder_outcome.2003.t:0 "Người Ăn Uống Khỏe Mạnh"
  murder_outcome.2003.opening_1:0 "Nhờ con vịt và lọ thuốc độc, [target.GetTitledFirstName] cuối cùng đã chết!"
  murder_outcome.2003.opening_2:0 "Thuốc độc đã phát huy tác dụng, và [target.GetTitledFirstName] không còn nữa!"
  murder_outcome.2003.opening_3:0 "Con chim đó trở thành thứ cuối cùng [target.GetFirstName] từng ăn!"
  murder_outcome.2003.owner_is_known_1:0 "\n\nTuy nhiên, khi dường như nghẹn xương, [target.GetTitledFirstName] kịp lẩm bẩm tên Ta, nguyền rủa Ta là Xóa Bạn [target.GetHerHis]!"
  murder_outcome.2003.owner_is_known_2:0 "\n\nĐáng tiếc, thuốc độc bị phát hiện, và kẻ đầu độc nhanh chóng điểm tên Ta là thủ phạm!"
  murder_outcome.2003.owner_is_known_3:0 "\n\nMột người hầu của [target.GetTitledFirstNamePossessive] tội lỗi và đã thừa nhận, chỉ Ta là người cung cấp thuốc độc."
  murder_outcome.2003.no_awareness_1:0 "\n\nCòn tuyệt vời hơn nữa, trong cơn hấp hối của [target.GetHerHis], một chiếc xương đã kẹt lại trong cổ họng của [target.GetTitledFirstNamePossessive]! Hiện giờ chẳng ai biết rõ thực sự điều gì đã giết chết [target.GetHerHim]!"
  murder_outcome.2003.no_awareness_2:0 "\n\nCó vẻ không ai nghi ngờ đại lý của Ta, nghĩa là không ai truy ngược thuốc độc về Ta!"
  murder_outcome.2003.a.discovered_1:0 "Ta chỉ muốn làm bữa tiệc thêm phần sinh động!"
  murder_outcome.2003.a.discovered_2:0 "Ôi dào. [target.GetSheHe|U] cũng làm hỏng bầu không khí rồi."
  murder_outcome.2003.a:0 "Chắc là do [target.GetSheHe] ăn phải thứ gì đó."

  murder_outcome.2004.opening_1:0 "[target.GetTitledFirstName] đã bỏ mạng, bởi cú [SCOPE.Custom('VenomousCreatureAttack')] chí mạng từ một con [SCOPE.Custom('VenomousCreature')]! Con [SCOPE.Custom('VenomousCreatureType')] đã tập kích không lâu sau khi [target.GetSheHe] lui về ngọa thất của [target.GetHerHis], và dù lính gác đã được gọi đến, chẳng một ai có thể làm gì để cứu mạng [target.GetHerHim]."
  murder_outcome.2004.owner_is_known_1:0 "\n\nĐáng tiếc [target.GetSheHe] chết trong khi nguyền rủa tên Ta, và tin đồn về sự tham gia của Ta đã lan rộng."
  murder_outcome.2004.no_awareness_1:0 "\n\nMay mắn thay, [SCOPE.Custom('VenomousCreatureTypePlural')] không biết nói, nên không thể truy về Ta."
  murder_outcome.2004.no_awareness_1_beaked_mammal:0 "\n\nMay mắn thay, những sinh vật như vậy không biết nói — chắc chắn không? — nên không thể truy về Ta."
  murder_outcome.2004.a.discovered:0 "Thời gian để [SCOPE.Custom('VenomousCreatureMovement')] đi như một [SCOPE.Custom('VenomousCreatureType')]!"
  murder_outcome.2004.a:0 "Người Bạn Nhỏ đã hoàn thành tốt công việc."

  murder_outcome.2005.opening_1:1 "[target.GetTitledFirstName] đã tử mạng, bị đánh đập và chà đạp bởi chính các thần dân của [target.GetHerHis]!\n\nĐám bần nông phẫn uất đã hóa điên khi thấy vị lãnh chúa của họ cưỡi ngựa qua đường phố, và lôi tuột cả [target.GetHerHim] lẫn một vài $knight_culture_player_plural_no_tooltip_lowercase$ của [target.GetHerHis] khỏi yên ngựa, đánh đập bọn họ cho tới chết!"
  murder_outcome.2005.owner_is_known_1:0 "\n\nNhiều nông dân bị treo cổ, nhưng trước khi hành quyết, một số kẻ kích động chỉ Ta là thủ phạm."
  murder_outcome.2005.no_awareness_1:0 "\n\nNhiều nông dân bị treo cổ, bao gồm cả kẻ kích động của Ta, nên không thể truy về Ta!"
  murder_outcome.2005.a.discovered:0 "Nông dân đơn giản không thể tin tưởng để nghĩ đến lợi ích lớn hơn của Ta."
  murder_outcome.2005.a.discovered.less_arrogant:0 "Bị phản bội, ngay cả bởi những người hầu khiêm tốn của Ta!"
  murder_outcome.2005.a:0 "Đừng bao giờ xem thường sức mạnh của đám đông."

  murder_outcome.2006.desc:0 "[target.GetTitledFirstName] chết, bị giam trong tường và sắp bị quên lãng!\n\n[target.GetSheHe|U] đi theo Ta willingly, say vui vẻ và rượu, vào hầm. Sau nhiều ly rượu 'tốt', [target.GetSheHe] dễ dàng ngủ, không hay biết khi Ta mang bay và xây tường kín lối ra."
  murder_outcome.2006.scheme_owner_known:0 "Đáng tiếc Ta bị nhìn thấy dẫn [target.GetHerHim] xuống tầng hầm, và vài tuần sau, bức tường mới xây bị phá để lộ kinh hoàng phía sau."
  murder_outcome.2006.scheme_unknown:0 "May mắn thay, có vẻ không ai nhận ra bức tường lạ trong tầng hầm..."
  murder_outcome.2006.a.discovered:0 "[target.GetSheHe|U] say và cần chỗ nghỉ!"
  murder_outcome.2006.a:0 "Nguyện [target.GetSheHe] yên nghỉ!"

  murder_outcome.2007.desc:0 "[target.GetTitledFirstName] chết, bị đại dương lạnh giá ôm lấy!\n\nMũi tên cháy do đại lý bắn tạo đường lửa trên cảng, và chỉ vài khoảnh khắc sau toàn bộ thuyền bốc cháy."
  murder_outcome.2007.desc_lowborn:0 "Tất cả hành khách rơi xuống nước, quần áo ướt nặng..."
  murder_outcome.2007.desc_highborn:0 "Tất cả hành khách rơi xuống nước, vải đẹp ướt cũng nặng..."
  murder_outcome.2007.scheme_owner_known:0 "\n\nĐáng tiếc cung thủ bị nhìn thấy và không ngần ngại chỉ Ta!"
  murder_outcome.2007.scheme_unknown:0 "\n\n#EMP Đáng tiếc#! cung thủ không tìm thấy."
  murder_outcome.2007.a.discovered:0 "Ta... Ta tưởng [target.GetSheHe] biết bơi!"
  murder_outcome.2007.a:0 "Thật là một bi kịch!"
  every_entourage_member:0 "Mọi thành viên trong đoàn tùy tùng [target.GetTitledFirstNamePossessiveNoTooltip]:"

  murder_outcome.2008.desc_drunkard:0 "[target.GetTitledFirstName] chết, bị giết bởi [target.Custom('RegionalAlcoholicDrink')] mà [target.GetSheHe] rất yêu thích!"
  murder_outcome.2008.desc_not_drunkard:0 "[target.GetTitledFirstName] chết, bị giết bởi một ngụm sâu [target.Custom('RegionalDrink')]!"
  murder_outcome.2008.desc:0 "\n\nCác đại lý đã bỏ thuốc độc vào cốc [target.GetHerHis] và quan sát tan biến không dấu vết. Chỉ khi cổ họng [target.GetHerHis] sưng tịt, [target.GetSheHe] mới nhận ra điều bất thường, nhưng đã quá muộn.\n\n"
  murder_outcome.2008.scheme_owner_known:0 "Đáng tiếc các đại lý bị nhìn thấy, và người hầu hối lộ không ngần ngại tiết lộ sự tham gia của Ta!"
  murder_outcome.2008.scheme_unknown:0 "May mắn thay, các đại lý rút lui trước khi thuốc độc lộ hiệu quả!"
  murder_outcome.2008.a.discovered:0 "...[target.GetSheHe|U] khát nước sao?"
  murder_outcome.2008.a:0 "Chúc mừng, [target.GetTitledFirstNameNoTooltip]!"

  murder_outcome.2201.t:0 "Xác Thịt Bị Tàn Phá"
  murder_outcome.2201.opening:0 "[target.GetTitledFirstName] chết!\n\nViệc tìm kiếm kéo dài đến đêm, chỉ tạm dừng và tiếp tục vào bình minh. Lúc đó mới tìm thấy xác, đầy máu, bị xé nát bởi một sinh vật hung dữ. Ít ra Ta hy vọng đó là việc của thú dữ."
  murder_outcome.2201.scheme_owner_known:0 "\n\nThảm họa, đại lý thú nhận ngay khi tìm thấy đứa trẻ. Giờ ai cũng biết Ta đứng sau bi kịch!"
  murder_outcome.2201.scheme_unknown:0 "\n\nMay mắn thay, mọi người đều đồng ý đó là thảm kịch, và sự tham gia của Ta — cũng như kế hoạch — vẫn chưa biết."
  murder_outcome.2201.a.discovered:0 "Đối mặt trở ngại bất ngờ là phần tất yếu trong sự nuôi dạy trẻ!"
  murder_outcome.2201.a:0 "Người ta nói trẻ em là tương lai."

  murder_outcome.2202.desc:0 "Công việc đã xong. [target.GetTitledFirstName] sẽ không bao giờ lớn lên, hay hiểu thế giới quanh [target.GetHerHim]. Thật đơn giản, một chiếc kim sắt nhọn vào tai, xuyên qua da mềm và sụn."
  murder_outcome.2202.desc_sadistic:0 "Ta bắt triều thần nhắc lại tiếng khóc và máu phun vài lần trước khi thỏa mãn sự tò mò."
  murder_outcome.2202.desc_normal:0 "Ta cho triều thần ra ngoài trước khi nhận thêm chi tiết."
  murder_outcome.2202.scheme_owner_known:0 "\n\nThảm họa, người nuôi bị bắt và điểm Ta là thủ phạm vụ tội ác ghê tởm."
  murder_outcome.2202.scheme_unknown:0 "\n\nNgười nuôi bị bắt nhưng hành quyết trước khi kịp khai sự tham gia của Ta."
  murder_outcome.2202.a:0 "Ta phải làm điều này. Ta phải làm điều này."
  murder_outcome.2202.a.tt:0 "#F Ta phải!#!"
  murder_outcome.2202.a.sadistic:0 "Tiếp theo trong danh sách hôm nay là gì?"

  murder_outcome.2203.desc:0 "Công việc đã xong. [target.GetTitledFirstName] sẽ không bao giờ lớn lên, sẽ không bao giờ biết nỗi đau và niềm vui của thế giới này. Có vẻ đó là cái chết nhanh chóng, nọc độc đã phát huy tác dụng trước cả khi đại lý của Ta rời khỏi phòng.\n\n"
  murder_outcome.2203.scheme_owner_known:0 "Lính nhanh chóng bắt được hắn, và gã hèn nhát đã điểm tên Ta là lực lượng đứng sau hành vi tàn ác này."
  murder_outcome.2203.scheme_unknown:0 "Lính cũng nhanh chóng, và họ sớm xích đại lý của Ta lại. May thay, hắn bị hành quyết trước khi kịp nhắc đến Ta là người đứng sau vụ án."

  murder_outcome.2204.desc:0 "[target.GetTitledFirstName] đã bỏ mạng; [target.GetSheHe] đã nuốt trọn mồi nhử, món [target.Custom('FavoriteTreat')] và mọi thứ! Chỉ trong nháy mắt [target.GetSheHe] đã phải đưa tay bóp chặt cổ họng [target.GetHerHis], hổn hển cầu xin dưỡng khí, trước khi gục rạp xuống đất và chẳng thể nào gượng dậy được nữa."
  murder_outcome.2204.scheme_owner_known:0 "\n\nThảm họa, ai đó nhìn thấy đại lý của Ta đặt mồi và Ta sớm bị lộ là kẻ chủ mưu đằng sau toàn bộ vụ việc!"
  murder_outcome.2204.scheme_unknown:0 "\n\nTất cả thợ làm bánh trong vùng bị thẩm vấn, nhưng không tìm thấy dấu vết gian trá nào."

  murder_outcome.2205.t:0 "Sa Ngã"
  murder_outcome.2205.desc_opening:0 "[target.GetTitledFirstName] chết! Họ tìm thấy xác [target.GetHerHis] bị tàn phá trên mặt đất,"
  murder_outcome.2205.desc_dog:0 "ôm xác con chó rách nát của [target.GetHerHis]."
  murder_outcome.2205.desc_cat:0 "ôm xác con mèo xơ xác của [target.GetHerHis]."
  murder_outcome.2205.desc_cat_alive:0 "nhưng không thấy dấu vết con mèo xơ xác của [target.GetHerHis]."
  murder_outcome.2205.desc_toy:0 "ôm chặt món [target.Custom('child_favorite_toy')] vào ngực [target.GetHerHis]."
  murder_outcome.2205.desc_nothing:0 "kẹo rải khắp mặt đất quanh [target.GetHerHim]."
  murder_outcome.2205.desc:0 "Khuôn mặt trẻ thơ của [target.GetHerHis|U] vĩnh viễn méo mó trong vẻ ngạc nhiên và kinh hoàng."
  murder_outcome.2205.scheme_owner_known:0 "\n\nTa cảm nhận cùng nỗi kinh hoàng trên khuôn mặt mình khi rõ ràng đại lý của Ta bị bắt và không ngần ngại tiết lộ Ta!"
  murder_outcome.2205.scheme_unknown:0 "\n\nÍt nhất mọi người nghĩ [target.GetSheHe] ngã do tai nạn."

  murder_outcome.2301.t:0 "Bị Lãng Quên Trong Bóng Tối"
  murder_outcome.2301.opening_1:0 "Cuối cùng thì [target.GetTitledFirstName] cũng đã chết! [target.GetSheHe|U] đã vong mạng dưới tay một đám người vô danh trong ngục tối của [prison_owner.GetTitledFirstName]. Trong tình trạng nửa nhịn đói, [target.GetSheHe] gần như không thể làm gì để phòng vệ cho [target.GetHerselfHimself] khi bị bọn chúng đánh cho đến chết."
  murder_outcome.2301.heh:0 "Heh."
  murder_outcome.2301.owner_is_known_1:0 "\n\nĐáng tiếc, khi có thắc mắc, một trong những kẻ gây án đã sơ suất và điểm Ta là người chịu trách nhiệm."
  murder_outcome.2301.no_awareness_1:0 "\n\nDù không còn nghi ngờ gì rằng kẻ sát nhân thuộc triều đình [prison_owner.GetTitledFirstNamePossessive], họ giữ kín miệng và bí mật sự tham gia của Ta."
  murder_outcome.2301.a.discovered:0 "Ngài không thể bỏ mặc ai chết, rồi tỏ vẻ kinh ngạc khi họ thực sự chết."
  murder_outcome.2301.a:0 "Ta đã thả Ngài tự do, [target.GetFirstNameNoTooltip]."

  murder_outcome.2302.t:0 "Khách Không Mời"
  murder_outcome.2302.opening_1:0 "[target.GetTitledFirstName] chết! Như kế hoạch, người hầu vào được phòng của [target.GetHerHis], chắc hẳn làm [target.GetHerHis] bối rối. Dĩ nhiên, bối rối qua đi khi người hầu rút dao [dummy_gender.GetHerHis]. [target.GetFirstNameNoTooltip] không sống được lâu."
  murder_outcome.2302.owner_is_known_1:0 "\n\nThật không may, vụ mưu sát đã bị bại lộ trước khi kẻ thuộc hạ có thể tẩu thoát, và [dummy_gender.GetSheHe] đã khai ra danh tính của ta để đổi lấy mạng sống cho [dummy_gender.GetHerHis]."
  murder_outcome.2302.no_awareness_1:0 "\n\nNgười hầu trốn ra ngoài, và đã đi lâu trước khi xác được phát hiện. Không ai biết đến sự tham gia của Ta."
  murder_outcome.2302.a.discovered:1 "Ít nhất thì, [target.GetFirstNameNoTooltip] sẽ không thể rời khỏi nơi giam lỏng của [target.GetHerHis] trong khoảng thời gian sắp tới."
  murder_outcome.2302.a:0 "Dễ như một chuyến thăm thân thiện!"

  murder_outcome.2401.opening_1:0 "[target.GetTitledFirstName] đã rời thế giới này, mặc dù người ta phải tự hỏi liệu điều đó đã đúng từ trước đó. [target.GetSheHe|U] không hề chống cự khi kẻ ám sát giữ gối trên mặt [target.GetHerHis]. [target.GetSheHe|U] chỉ rên vài tiếng qua vải, rồi im lặng."
  murder_outcome.2401.owner_is_known_1:0 "\n\nĐáng tiếc, lính phát hiện kẻ ám sát, và hắn sớm thú nhận sự tham gia của Ta!"
  murder_outcome.2401.no_awareness_1:0 "\n\nKẻ ám sát đã tẩu thoát, và không còn nhân chứng nào, dường như không thể truy ngược hành vi về Ta."
  murder_outcome.2401.a.discovered:0 "Đừng nghĩ đây là giết người, mà là giải thoát!"
  murder_outcome.2401.a:0 "Nguyện nghỉ yên cuối cùng, [target.GetFirstNameNoTooltip]."

  murder_outcome.4001.t:0 "Kẻ Ám Sát!"
  murder_outcome.4001.failure_declaration_1:0 "[target.GetTitledFirstName] thoát nạn!"
  murder_outcome.4001.failure_declaration_2:0 "Nỗ lực giết [target.GetTitledFirstName] của Ta đã bị phá!"
  murder_outcome.4001.failure_declaration_3:0 "Có vẻ [target.GetTitledFirstName] lại một lần nữa thoát khỏi sự phán xét của [ROOT.Char.GetFaith.HighGodNamePossessive]."
  murder_outcome.4001.desc:0 "Kẻ ám sát vào [target.Custom('ResidenceBuilding')], nhưng không tới phòng của [target.GetFirstNamePossessiveNoTooltip]."
  murder_outcome.4001.exposed_scheme:0 "[dummy_assassin_gender.GetSheHe|U] bị bắt và, trước nguy cơ tử hình, tiết lộ tên Ta!"
  murder_outcome.4001.not_exposed_scheme:0 "Khi [dummy_assassin_gender.GetSheHe] bị phát giác và tiếng tri hô báo động vang lên, tên sát thủ ngay lập tức trốn chạy cứu lấy mạng [dummy_assassin_gender.GetHerHis], và kể từ đó không còn nghe ngóng được gì nữa.\n\n[target.GetTitledFirstName] hiện đang thắt chặt phòng bị cho [target.GetHerHis]."
  murder_outcome.4001.a.discovered:0 "[dummy_assassin_gender.GetSheHe|U] thực ra chỉ ở đó để hù #EMP kẻ ám sát thật#! Và thành công!"
  murder_outcome.4001.a:0 "Sẽ có ngày ngươi trả giá, [target.GetFirstNameNoTooltip]!"
  murder_outcome.4001.b:0 "Nếu lần đầu không thành..."

  murder_outcome.4002.desc:1 "\n\nBọn côn đồ thuê của Ta thất bại trong việc áp đảo đoàn tùy tùng [target.GetHerHis]."
  murder_outcome.4002.exposed_scheme:0 "Tệ hơn, một số bị bắt sống và tiết lộ rằng đã được trả tiền để tấn công! Không lâu sau, khoản trả tiền được truy ngược về Ta."
  murder_outcome.4002.not_exposed_scheme:0 "Ít nhất tất cả đã bị giết. Không còn ai để nói, họ được cho là bọn cướp bình thường."
  murder_outcome.4002.a:0 "Không thể tin dân thường làm gì đúng..."
  murder_outcome.4002.a.less_arrogant:0 "Công việc đơn giản vậy mà..."
  murder_outcome.4002.a.discovered:0 "Bọn cướp điển hình. Chúng sẽ nói bất cứ gì để thoát tội."

  murder_outcome.4003.desc:0 "\n\nThuốc độc không có tác dụng như dự định, chỉ khiến [target.GetTitleTierName] nằm liệt giường một tuần."
  murder_outcome.4003.exposed_scheme:0 "Tệ hơn, thầy thuốc cung cấp thuốc bị truy tìm, và [target.GetFirstNameNoTooltip] giờ biết Ta đứng sau kế hoạch!"
  murder_outcome.4003.not_exposed_scheme:0 "May thay, người ta nghĩ chỉ là bệnh thường, và [target.GetFirstName] không hề biết gì."
  murder_outcome.4003.a:0 "Lần sau Ta sẽ đảm bảo [target.GetSheHe] nghẹn với nó!"
  murder_outcome.4003.a.discovered:0 "Chắc con chim không hợp khẩu vị [target.GetFirstNamePossessiveNoTooltip]?"

  murder_outcome.4004.failure_declaration_1:0 "[target.GetTitledFirstName] sống sót sau [SCOPE.Custom('VenomousCreature')]'s [SCOPE.Custom('VenomousCreatureAttack')]!"
  murder_outcome.4004.failed_attempt_1:0 "Dù [SCOPE.Custom('VenomousCreatureType')] tấn công, bác sĩ nhanh chóng ngăn nọc độc lan rộng."
  murder_outcome.4004.scheme_owner_known:0 "\n\nThảm họa, người hầu đặt [SCOPE.Custom('VenomousCreatureType')] bị phát hiện, và sự tham gia của Ta sớm bị lộ!"
  murder_outcome.4004.scheme_known:1 "\n\nViệc đặt [SCOPE.Custom('VenomousCreature')] trong giường [target.GetTitleAsNamePossessiveNoTooltip] khó mà kín đáo, nhưng ít nhất không ai biết Ta đứng sau."
  murder_outcome.4004.scheme_unknown:0 "\n\nÍt nhất [SCOPE.Custom('VenomousCreatureAttack')] được đổ lỗi cho [SCOPE.Custom('VenomousCreatureType')] lang thang, chứ không phải Ta."
  murder_outcome.4004.a:0 "Số may mắn của ngươi cũng chỉ đến thế thôi, [target.GetFirstNameNoTooltip]!"

  murder_outcome.4005.failure_declaration_1:0 "[target.GetTitledFirstName] sống sót sau cuộc tấn công của đám nông dân!"
  murder_outcome.4005.failed_attempt_1:0 "\n\nLũ kích động của ta đã thành công xúi giục bọn họ, nhưng khi đám đông bắt đầu nổi loạn, binh lính của [target.GetFirstNamePossessive] đã tàn sát sạch. Những kẻ sống sót chạy trốn trong sự kinh hoàng khi [target.GetTitleTierName] tìm đường an toàn quay trở về [target.Custom('ResidenceBuilding')] của [target.GetHerHis]."
  murder_outcome.4005.scheme_owner_known:0 "\n\nNhiều nông dân bị treo cổ, và kẻ kích động thú nhận sự tham gia của Ta!"
  murder_outcome.4005.scheme_known:0 "\n\nNhiều nông dân bị treo cổ, kẻ kích động thừa nhận sự tham gia của lực lượng bên ngoài. May thay họ không biết Ta đứng sau."
  murder_outcome.4005.scheme_unknown:0 "\n\nNhiều nông dân bị treo cổ, may mắn thay cả kẻ kích động cũng vậy, nên bạo loạn không thể truy về Ta."
  murder_outcome.4005.a:0 "Sự bất tài này là lý do chúng ta cai trị, và nông dân thì không."
  murder_outcome.4005.a.discovered:0 "Luôn tin vào đám đông sẽ đưa ra quyết định sai."

  murder_outcome.4006.desc:0 "[target.GetTitledFirstName] đi theo Ta willingly xuống tầng hầm, say vui vẻ và rượu.\n\nSau nhiều ly 'tốt', [target.GetSheHe] ngủ dễ dàng, nhưng trước khi Ta kịp xây kín lối ra, vài người hầu đi vào.\n\n"
  murder_outcome.4006.scheme_owner_known:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Và [target.GetTitledFirstNameNoTooltip]? Một bức tường nửa xây giam [target.GetHerHim]... Ôi không.""
  murder_outcome.4006.scheme_unkown:0 ""Ô, hình như [target.GetTitledFirstNameNoTooltip] ngủ giữa chừng dự án của ngài. Chúng Ta có thể giúp đưa [target.GetHerHim] vào phòng ngủ không, [ROOT.Char.Custom('FormOfAddressForLiege')]?""
  murder_outcome.4006.a.discovered:0 "Ta... Ta chỉ đang sửa sang một chút!"
  murder_outcome.4006.a:0 "...Vâng, cảm ơn vì đã giúp."

  murder_outcome.4007.opening:0 "Mũi tên cháy do đại lý bắn tạo đường lửa trên cảng, chỉ trượt thuyền trong gang tấc.\n\nKhi lửa tắt trên mặt nước lạnh, hành khách nhìn không hiểu trong vài giây trước khi hỗn loạn bùng phát.\n\n"
  murder_outcome.4007.scheme_owner_known:0 "Tệ hơn nữa, cung thủ bị bắt, và không ngần ngại tiết lộ Ta là người đứng sau kế hoạch."
  murder_outcome.4007.scheme_unkown:0 "May thay cung thủ thoát, và không tìm thấy dấu vết tham gia của Ta."
  murder_outcome.4007.a.discovered:0 "Ta chỉ muốn [target.GetHerHim] rèn luyện kỹ năng bơi lội của [target.GetHerHis] mà thôi!"
  murder_outcome.4007.a:0 "Bắn trúng một con thuyền khó đến vậy sao?!"

  murder_outcome.4008.desc:0 "[target.GetTitledFirstName] đã sống sót sau chất độc!\n\nKhông may, một trong những hầu gái trong bếp của [target.GetTitledFirstNamePossessive] đã tự rót một ngụm trước khi phục vụ [target.GetLadyLord], và một người hầu chết rõ ràng là một lời cảnh cáo.\n\n"
  murder_outcome.4008.scheme_owner_known:0 "Và nếu điều đó chưa đủ tệ, một trong những người hầu khác không ngần ngại chỉ thẳng Ta là kẻ đứng sau âm mưu!"
  murder_outcome.4008.scheme_unkown:0 "Ít ra không ai trong số những người hầu thú nhận sự liên quan của Ta. Một chút may mắn."
  murder_outcome.4008.a.discovered:0 "Những người hầu của [target.GetHerHis] thật táo bạo!"
  murder_outcome.4008.a:0 "Lần sau, những người hầu của [target.GetHerHis] sẽ biết đừng can thiệp!"

  murder_outcome.4201.t:0 "Con Đường Về Nhà"
  murder_outcome.4201.opening:0 "\n\n[assassin.GetTitledFirstName] đã bỏ mặc [target.GetHerHim] cho số phận của [target.GetHerHis], bơ vơ giữa nơi hoang dã.\n\nTuy nhiên, khi quay về triều đình để báo tin dữ về đứa trẻ đi lạc, [target.GetFirstName] đã đứng đợi sẵn ở đại sảnh, và hỏi [assassin.GetFirstName] xem liệu chúng có thể chơi đùa thêm được nữa không!"
  murder_outcome.4201.scheme_owner_known:0 "[assassin.GetFirstNameNoTooltip] bị thẩm vấn nhanh chóng, và kế hoạch của Ta bị lộ!"
  murder_outcome.4201.scheme_unknown:0 "Nói chung, [assassin.GetFirstNameNoTooltip] hiện đang được giám sát chặt chẽ."
  murder_outcome.4201.a.discovered:0 "Vậy… Đây là âm mưu giết người hay một hành động #EMP từ bi#!?"
  murder_outcome.4201.a:0 "Một nhát dao vào lưng cũng đủ rồi."

  murder_outcome.4202.opening:0 "[target.GetTitledFirstName] vẫn còn sống! Có vẻ như y tá đã không nỡ đâm đứa trẻ và bỏ qua cơ hội."
  murder_outcome.4202.scheme_owner_known:0 "\n\nĐiều tệ hơn, lương tâm của cô ấy thắng thế, và cô thú nhận mọi chuyện, kể cả sự liên quan của Ta!"
  murder_outcome.4202.scheme_known:0 "\n\nĐiều tệ hơn, lương tâm cô ấy thắng thế và cô thú nhận âm mưu! Ít nhất sự liên quan của Ta vẫn được giữ bí mật."
  murder_outcome.4202.scheme_unkown:0 "\n\nÍt nhất cô ấy đủ khôn ngoan để giữ im lặng về kế hoạch. Có lẽ đây là điều tốt nhất..."
  murder_outcome.4202.a:0 "Ta cần suy nghĩ thật kỹ."

  murder_outcome.4203.opening:0 "[target.GetTitledFirstName] vẫn còn sống! Có vẻ như nọc độc của [SCOPE.Custom('VenomousCreatureType')] không đủ mạnh, chỉ gây nổi mẩn nhẹ trên da trẻ.\n\n"
  murder_outcome.4203.scheme_owner_known:0 "Như thể chưa đủ tệ, tay sai hèn nhát của Ta bị bắt và thú nhận, nêu tên Ta là kẻ đứng sau hành động!"
  murder_outcome.4203.scheme_unkown:0 "Một chút may mắn là tay sai của Ta đã rời phòng mà không gây ra cảnh báo."

  murder_outcome.4204.desc_opening:0 "[target.GetTitledFirstName] vẫn còn sống! [target.GetSheHe|U] đã cầm lấy món [target.Custom('FavoriteTreat')], nhưng trước khi [target.GetSheHe] kịp cắn một miếng, một con chó hoang đã giật lấy nó từ tay [target.GetHerHis] và chạy tót xuống phố.\n\n"
  murder_outcome.4204.scheme_unkown:0 "Ít nhất không ai biết ý định thực sự của Ta…"
  murder_outcome.4204.a:0 "Có phải đây là một dấu hiệu không nhỉ?"

  murder_outcome.4205.desc_opening:0 "[target.GetTitledFirstName] vẫn còn sống! Khi tay sai của Ta đẩy [target.GetHerHim] khỏi bờ, quần áo của [target.GetHerHis] bị vướng vào một mảnh tường nhô ra ngay phía dưới. Nó giữ [target.GetHerHim] đủ lâu để cứu cả đứa trẻ và"
  murder_outcome.4205.desc_dog:0 "con chó chết tiệt…"
  murder_outcome.4205.desc_cat:0 "con mèo chết tiệt…"
  murder_outcome.4205.desc_toy:0 "con [target.Custom('child_favorite_toy')] chết tiệt…"
  murder_outcome.4205.desc_nothing:0 "mớ kẹo chết tiệt…"
  murder_outcome.4205.scheme_unkown:0 "Ít nhất tay sai của Ta đã tẩu thoát mà không bị phát hiện, và đứa trẻ quá hoảng sợ để nhớ rõ chuyện gì đã xảy ra."

  murder_outcome.4302.t:0 "Khách Không Mời"
  murder_outcome.4302.failure_declaration_1:0 "[target.GetTitledFirstName] vẫn sống!"
  murder_outcome.4302.failed_lack_of_planning:0 "Có lẽ Ta nên lập kế hoạch tốt hơn. Ngay khi 'người Ngài cũ' bước vào phòng [target.GetHerHis], [target.GetSheHe] gọi lính gác. Có phải [target.GetSheHe] đã được cảnh báo?"
  murder_outcome.4302.failed_attempt_1:0 "Kẻ "cố nhân" đã không khéo léo trong màn cải trang của [dummy_gender.GetHerHis] như dự tính, và ngay khoảnh khắc [dummy_gender.GetSheHe] tuốt vỏ thanh dao găm giấu sẵn của [dummy_gender.GetHerHis], [target.GetFirstName] đã lập tức tri hô gọi lính gác."
  murder_outcome.4302.disastrous_attempt_1:0 "\n\nThật không may, dường như kẻ thuộc hạ chẳng hề có chút áy náy nào khi khai ra sự dính líu của ta vào âm mưu này cốt để giữ lấy cái mạng hèn của [dummy_gender.GetHerHis]."
  murder_outcome.4302.something_is_known:0 "\n\nÍt nhất sự liên quan của Ta vẫn chưa bị phát hiện."
  murder_outcome.4302.unknown_so_far:0 "\n\nDù vậy kẻ thuộc hạ vẫn trốn thoát được, và cái cách mà [dummy_gender.GetSheHe] cuỗm lấy những đồ vật giá trị trên đường [dummy_gender.GetHerHis] tẩu thoát đã khiến thiên hạ lầm tưởng rằng đây là một vụ trộm cướp tinh vi, chứ không phải một vụ ám sát!"
  murder_outcome.4302.a:0 "Thời gian của ngươi sẽ tới, [target.GetFirstNameNoTooltip]..."

  murder_outcome.4301.t:0 "Bị Lãng Quên Trong Bóng Tối"
  murder_outcome.4301.failure_declaration_1:0 "Có vẻ kế hoạch giết [target.GetTitledFirstName] của Ta đã thất bại!"
  murder_outcome.4301.failed_lack_of_planning:0 "Có lẽ nên lập kế hoạch tốt hơn, vì nhóm sát thủ của Ta phải tháo chạy trước một lính gác quá hăng hái, và không hoàn thành nhiệm vụ."
  murder_outcome.4301.failed_attempt_1:0 "Dù những tên sát thủ nhắm chừng của ta đã đánh đập [target.GetHerHim] nhừ tử chỉ còn lại một chút hơi tàn, nhưng một chút đó là tất cả những gì [target.GetSheHe] cần để giữ lấy mạng sống."
  murder_outcome.4301.something_is_known:0 "\n\nMọi người đều biết đây là một âm mưu ám sát [target.GetTitledFirstNamePossessive], nhưng sự liên quan của Ta vẫn chưa bị lộ."
  murder_outcome.4301.unknown_so_far:0 "\n\nÍt ra mọi người cho rằng đó là một trận đánh giữa các tù nhân, nên Ta vẫn chưa bị phát hiện."
  murder_outcome.4301.disastrous_lack_of_planning:0 "\n\nCó lẽ Ta nên kiên nhẫn hơn, vì nhóm sát thủ bị gián đoạn bởi lính gác quá hăng hái, và vài người đã tiết lộ Ta là kẻ chịu trách nhiệm!"
  murder_outcome.4301.disastrous_attempt_1:0 "\n\nNhóm sát thủ bị gián đoạn và một vài người đã tiết lộ Ta là kẻ chịu trách nhiệm!"
  murder_outcome.4301.a.discovered:0 "Thật sự tốt hơn sao khi cứ để [target.GetHerHim] thối rữa?"
  murder_outcome.4301.a:0 "Chết tiệt!"

  murder_outcome.4401.failure_declaration_1:0 "Bằng cách nào đó, #EMP bằng cách nào đó#!, [target.GetTitledFirstName] vẫn sống!"
  murder_outcome.4401.failed_attempt_1:0 "Sát thủ xông vào phòng [target.GetHerHis], nhưng dù giữ gối trên mặt [target.GetTitleTierName] bao lâu, [target.GetWomanMan] vẫn không chết."
  murder_outcome.4401.disastrous_attempt_1:0 "\n\nSớm thôi lính gác xuất hiện, và sát thủ thú nhận không chỉ âm mưu mà cả sự liên quan của Ta!"
  murder_outcome.4401.something_is_known:0 "\n\nLính gác xuất hiện, sát thủ phải trốn gấp. Ít nhất không ai biết Ta đứng sau âm mưu."
  murder_outcome.4401.unknown_so_far:0 "\n\nKhi lính gác xuất hiện, sát thủ trốn thoát kịp, và ít nhất không ai biết hắn đã từng ở đó."
  murder_outcome.4302.a.discovered:0 "Ồ, Ta đã nhầm ngày hành quyết của [target.GetHerHis] sao?"
  murder_outcome.4401.a:0 "Chỉ là vấn đề thời gian thôi, [target.GetFirstNameNoTooltip]."

  murder_outcome.5001.t:0 "Rời Bỏ Vỏ Xác Trần Thế"
  murder_outcome.5001.poisoned_duck:0 "Ta đang thưởng thức vịt trong bữa tiệc khi cảm giác cổ họng sưng lên và cơ thể chậm lại. Ta biết điều gì sắp xảy ra, nhưng không thể ngăn chặn.\n\nKhông lâu sau, tầm nhìn tối sầm và những tiếng cười xa xăm trở thành tiếng thét kinh hoàng, dần dần trôi xa Ta."
  murder_outcome.5001.gang_of_thugs:0 "Đi qua rừng cùng đoàn tùy tùng, chúng Ta bị một băng cướp chặn đường. Họ quan tâm đến mạng sống của chúng Ta hơn vàng bạc, và dù lính của Ta chiến đấu dũng cảm, bọn cướp có lợi thế bất ngờ.\n\nTa chạy hết tốc lực, cho đến khi nghĩ rằng đã an toàn. Rồi, giữa tiếng ồn trận chiến, Ta nghe tiếng dây cung kêu vang."
  murder_outcome.5001.hired_assassin:0 "Ta tỉnh giữa đêm và thấy một bóng đen trong phòng. Ta không biết lính gác ra sao, nhưng khi thấy ánh trăng lóe trên lưỡi dao, Ta biết đã quá muộn.\n\nDao đủ bén gần như không phát ra tiếng khi đâm vào thịt, và giữa cơn đau cùng cực Ta không biết tiếng thét của mình còn nghe được không."
  murder_outcome.5001.creepy_crawly_intro:0 "Khi cảm thấy vật gì đó chạm vào chân, Ta rùng mình và vứt chăn đi, nhưng chuyển động nhanh càng làm vị khách không mời thêm phần kích động."
  murder_outcome.5001.creepy_crawly_known:0 "Dù trong ánh trăng yếu ớt, Ta nhận ra hình dạng [ROOT.Char.Custom('VenomousCreature')]."
  murder_outcome.5001.creepy_crawly_unknown:0 "Cảm thấy bị đe dọa, [ROOT.Char.Custom('VenomousCreatureType')] di chuyển nhanh và tấn công."
  murder_outcome.5001.creepy_crawly_end:0 "[ROOT.Char.Custom('VenomousCreatureAttack')] lúc đầu chỉ hơi đau, nhưng nhanh chóng toàn thân Ta bị thiêu đốt. Ta cố kêu cứu nhưng giọng quá yếu, tay chân tê liệt và ý thức dần mờ đi."
  murder_outcome.5001.riled_up_mob:0 "Ta cưỡi ngựa qua đường phố [ROOT.Char.GetCurrentLocation.GetName] thì một đám dân cày la hét ập xuống đoàn tùy tùng. Trước khi nhận ra, họ kéo Ta khỏi ngựa và đấm đá. Ta nghe lính gác hô hoán, nhưng trước khi đến, thế giới dần mờ nhạt."
  murder_outcome.5001.bricked:0 "Hôm qua Ta say mê bữa tiệc rượu.\n\nSáng hôm sau tỉnh dậy với cơn đau đầu kinh khủng và chẳng nhớ mình ở đâu, Ta thấy mình trong hầm ẩm với bức tường mới chặn lối ra! Tiếng kêu cứu bị nuốt bởi tường dày, hy vọng được tìm thấy mờ nhạt theo từng giờ trôi qua... Chỉ còn cảm giác yếu dần... #EMP Có lẽ Ta chỉ chợp mắt thôi...#!"
  murder_outcome.5001.sunken_boat:1 "Ta trên thuyền, tận hưởng gió tối, khi một mũi tên lửa bốc cháy lao qua bầu trời về phía chúng Ta!\n\nNó trúng thuyền với tiếng #EMP mạnh#!, chỉ một lát sau cả thuyền bốc cháy và Ta nhảy xuống nước lạnh. Quần áo nặng kéo Ta xuống, Ta cố bơi, cố bám vào vật gì đó, cố #EMP thở#!..."
  murder_outcome.5001.sunken_boat_travel:1 "Ta trên tàu giữa biển, khi một mũi tên bốc cháy lao qua bầu trời về phía chúng Ta!\n\nNó trúng thuyền với tiếng #EMP mạnh#!, chỉ một lát sau cả thuyền bốc cháy và Ta nhảy xuống nước lạnh. Quần áo nặng kéo Ta xuống, Ta cố bơi, cố bám vào vật gì đó, cố #EMP thở#!..."
  murder_outcome.5001.poisoned_drink_alcohol:0 "Khi đang thưởng thức bữa tối và một cốc đầy [ROOT.Char.Custom('RegionalAlcoholicDrink')], Ta bỗng cảm giác lạ trong cổ họng."
  murder_outcome.5001.poisoned_drink_no_alcohol:0 "Khi đang thưởng thức bữa tối và một cốc đầy [ROOT.Char.Custom('RegionalDrink')], Ta bỗng cảm giác lạ trong cổ họng."
  murder_outcome.5001.poisoned_drink:0 "Không lâu sau Ta #EMP vật vã#! cổ họng để thở, la hét, cố lấy không khí qua cổ sưng và chảy máu. Khi ý thức mờ dần, Ta thấy máu và da dưới móng tay; Ta sẽ phải rửa nó đi, thật đáng xấu hổ..."
  murder_outcome.5001.assassin:0 "[assassin.GetFirstName] đã dẫn Ta vào rừng chơi, và chúng Ta đã rất vui hôm nay! Tuy nhiên, [assassin.GetSheHe] đi trốn từ lâu, và Ta không tìm thấy [assassin.GetHerHim], trời tối nhanh quá..."
  murder_outcome.5001.courtier:0 "Một số quan lại dẫn Ta vào rừng chơi, và chúng Ta đã rất vui hôm nay! Tuy nhiên, họ đi trốn từ lâu, và Ta không tìm thấy họ, trời tối nhanh quá..."
  murder_outcome.5001.lured_into_forest:0 "\n\nTa cố tìm đường về nhà, nhưng tất cả cây đều giống nhau, và sớm nghe tiếng quái vật đến. Ta bắt đầu chạy, nhưng chúng nhanh hơn, lớn hơn, mạnh hơn... Ta nhắm mắt và khóc gọi mẹ."
  murder_outcome.5001.stab_infant:0 "Đèn đổi màu. Gương mặt quen, gương mặt lạ. Âm thanh quen, âm thanh lạ. Tiếng sắc lạnh làm tai đau, Ta bắt đầu khóc.\n\nCảm thấy ai đó ôm đầu Ta. Đau sáng. Rồi không còn gì."
  murder_outcome.5001.infant_creepy_crawly:0 "Một chiếc giường mềm dưới Ta và chăn ấm là tất cả Ta muốn. Ta gần ngủ thì cảm giác lạ, như có gì đó bò lên người. Một cơn đau bùng lên trên cánh tay, Ta bắt đầu khóc.\n\nĐau lan rộng và tăng dần. #EMP Đau quá!#! Đau là tất cả thế giới của Ta cho đến khi không còn gì."
  murder_outcome.5001.poisoned_candy:0 "Ta ra chơi, hơi đói, thì một người hầu xuất hiện với món quà tuyệt vời nhất: [ROOT.Char.Custom('FavoriteTreat')].\n\nChỉ vài khoảnh khắc, thế giới nghiêng, bụng Ta kêu la, và Ta #EMP không thở được#!! Ta ngã xuống đất khi miếng [ROOT.Char.Custom('FavoriteTreat')] rơi khỏi tay."
  murder_outcome.5001.child_pushed_dog:0 "Ta ra chơi và nghe thấy: tiếng kêu tuyệt vọng của chú chó [ROOT.Char.Custom('DogStoryName')]! Nhìn lên thấy [ROOT.Char.Custom('DogStoryHerHim')] treo trên tường cao bằng dây, Ta chạy tới cứu [ROOT.Char.Custom('DogStoryHerHis')] càng nhanh càng tốt.\n\nKhi Ta với xuống cứu [ROOT.Char.Custom('DogStoryHerHim')], thế giới lật ngược và Ta rơi; mặt đất lao lên chạm Ta, Ta nhắm mắt và–"
  murder_outcome.5001.child_pushed_cat:0 "Ta ra chơi và nghe thấy: tiếng kêu tuyệt vọng của chú mèo [ROOT.Char.Custom('CatStoryName')]! Nhìn lên thấy [ROOT.Char.Custom('CatStoryHerHim')] treo trên tường cao bằng dây, Ta chạy tới cứu [ROOT.Char.Custom('CatStoryHerHis')] càng nhanh càng tốt.\n\nKhi Ta với xuống cứu [ROOT.Char.Custom('CatStoryHerHim')], thế giới lật ngược và Ta rơi; mặt đất lao lên chạm Ta, Ta nhắm mắt và–"
  murder_outcome.5001.child_pushed_toy:0 "Ta ra chơi và thấy: [target.Custom('child_favorite_toy')] treo trên tường cao. Ta leo lên cầu thang nhanh nhất có thể, nhưng khi với xuống cứu nó, thế giới lật ngược và Ta rơi; mặt đất lao lên chạm Ta, Ta nhắm mắt và–"
  murder_outcome.5001.child_pushed:0 "Ta ra chơi và thấy: dấu kẹo dẫn lên cầu thang. Lên tới đỉnh, thấy giỏ treo đầy kẹo! Nhưng khi Ta với xuống, thế giới lật ngược và Ta rơi; mặt đất lao lên chạm Ta, Ta nhắm mắt và–"
  murder_outcome.5001.beat_to_death_in_dungeon:0 "Khi cửa phòng giam mở ra, Ta hy vọng được tự do. Một nhóm người khoác áo choàng bước vào, và Ta biết điều gì đang chờ.\n\nCú đánh dữ dội và tàn nhẫn. Thân thể yếu ớt của Ta không chống cự. Nằm trên sàn, thấy máu hòa với nước trên sàn ẩm."
  murder_outcome.5001.unwelcome_guest_house_arrest:0 "Ta không quen [dummy_gender.GetWomanMan] đang chờ trong phòng, dù [dummy_gender.GetSheHe] thuyết phục người bắt rằng [dummy_gender.GetSheHe] là Ngài cũ của Ta.\n\nChỉ khi [dummy_gender.GetSheHe] rút dao giấu, Ta nhận ra [dummy_gender.GetHerHim] là [dummy_gender.Custom('GenderedLowlyServantType')] cũ từ"
  murder_outcome.5001.unwelcome_guest_house_arrest.target_court:0 "triều đình tại [target_home.GetNameNoTier]."
  murder_outcome.5001.unwelcome_guest_house_arrest.no_court:0 "triều đình cũ của [target.GetFirstNamePossessiveNoTooltip]."
  murder_outcome.5001.unwelcome_guest_house_arrest.end:0 "Đòn tấn công của [dummy_gender.GetHerHis|U] đến quá nhanh để phản ứng."
  murder_outcome.5001.strangle_incapable:0 "Thế giới còn tồn tại không? Ta không cảm nhận được thời gian trôi. Đau ở… ngực? Hay… cổ? Đây có phải cơ thể của Ta không? Đêm phủ lên tâm trí Ta? Thật khó tập trung.\n\nQuá… khó…"
  murder_outcome.5001.schemer_known:0 "\n\nKhông còn nghi ngờ ai là thủ phạm. [owner.GetTitledFirstName]!"
  murder_outcome.5001.avenge_me:0 "Hậu duệ, hãy báo thù cho ta!"
  murder_outcome.5001.not_my_time:0 "Ta còn quá nhiều điều muốn sống!"
  murder_outcome.5001.option_incapable:0 "Cuối cùng, cái chết."
 
  murder_outcome.5002.t:0 "Một Âm Mưu Giết Ta!"
  murder_outcome.5002.poisoned_duck:0 "Khi Ta sắp cắn miếng vịt ngon nhất từng thấy, một trong những người hầu của Ta ngã vật ra, ôm cổ họng! Rõ ràng tên ngốc đó đã tự giúp mình một miếng trong bữa ăn của Ta.\n\nÍt nhất, hắn là lời cảnh báo để không chạm vào con vịt có độc, đồng thời nhận hình phạt thích đáng cho sự liều lĩnh của mình."
  murder_outcome.5002.gang_of_thugs:0 "Khi đi qua rừng, đoàn tùy tùng của Ta bị bọn cướp chặn đường! Chúng không nhắm vào vàng bạc của Ta, mà tấn công trực tiếp — trước khi Ta kịp ra lệnh cho lính giết chúng tại chỗ. Cuộc chiến dữ dội hơn mong đợi, và tệ hơn, bọn cướp rõ ràng nhắm vào Ta!\n\nMay mà cuối cùng không ai còn đứng, vì cuộc tấn công quyết liệt gần như khiến Ta thất bại."
  murder_outcome.5002.hired_assassin:0 "Tiếng động như sát thủ vấp phải chậu kéo Ta ra khỏi giấc ngủ nửa đêm. Nhìn thấy kẻ định hãm hại, Ta hô cho lính gác theo một cách điềm tĩnh và [SCOPE.GetRootScope.GetCharacter.GetWomanMan]. Khi họ đến, xảy ra một cuộc vật lộn ngắn, kết thúc với cái chết của kẻ xâm nhập."
  murder_outcome.5002.creepy_crawly_end:0 "Nọc độc của [SCOPE.Custom('VenomousCreatureType')] lan khắp cơ thể Ta với cảm giác bỏng rát, nhưng Ta lập tức gọi bác sĩ. Quá trình đau đớn, nhưng khi mặt trời mọc, nỗi đau từ chất độc cuối cùng cũng dịu bớt."
  murder_outcome.5002.riled_up_mob:0 "Ta đang cưỡi qua các con phố ở [home_province.GetNameNoTier] khi một đám dân cày la hét xông vào đoàn tùy tùng. May mà lính gác của Ta không chần chừ mà bắt đầu chém họ, trong khi Ta quay về [ROOT.Char.Custom('ResidenceBuilding')] an toàn."
  murder_outcome.5002.bricked:0 "Hôm qua Ta tham dự lễ hội địa phương ở [home_province.GetName] và có một buổi tối thú vị với rượu và niềm vui.\n\nSáng hôm sau tỉnh dậy với cơn đau đầu kinh khủng và chẳng nhớ mình đang ở đâu, Ta thấy mình trong hầm ẩm với bức tường mới xây #EMP almost#! chắn lối ra duy nhất. Ai đó muốn chôn Ta ở đây!"
  murder_outcome.5002.sunken_boat:0 "Ta đang trên thuyền trong cảng ở [province.GetNameNoTier] khi bất ngờ một mũi tên bốc cháy lao qua trời hướng về phía chúng Ta!\n\nNó suýt trúng thuyền, và khi Ta cúi xuống xem nó rơi vào nước lạnh, Ta ngửi thấy mùi gỗ thuyền đặc trưng: lửa Hy Lạp! Đây là một âm mưu giết Ta."
  murder_outcome.5002.poisoned_drink:0 "Khi đang dùng bữa, một người hầu lao vào và giật cốc khỏi tay Ta #EMP just#! khi Ta sắp uống!\n\n'[ROOT.Char.Custom('FormOfAddressForLiege')|U], có độc! Một trong những cô hầu... Tha lỗi cho cô ấy, cô ấy đã uống một ngụm, và cô ấy — cô ấy chết!'"
  murder_outcome.5002.lured_into_forest:0 "[assassin.GetFirstName] dụ Ta vào rừng chơi, nhưng sau đó [assassin.GetSheHe] trốn mất!\n\nSau khi khóc, vấp vào cành cây và la hét đến khản cổ, Ta bất ngờ tìm được lối ra khỏi rừng và về nhà an toàn."
  murder_outcome.5002.stab_infant:0 "Đèn thay đổi. Gương mặt quen, gương mặt lạ. Tiếng quen, tiếng lạ. Một âm thanh sắc lạnh làm tai Ta đau, và Ta bắt đầu khóc.\n\nRồi Ta nghe tiếng phụ nữ nức nở, lớn tuổi. Tiếng la hét, hoảng loạn. Sau đó Ta lại một mình."
  murder_outcome.5002.infant_creepy_crawly:0 "Một tấm chăn mềm dưới Ta và một chiếc chăn ấm. Ta gần ngủ thì cảm giác lạ, như có gì đó bò lên cơ thể. Một cơn đau bùng lên ở cánh tay, Ta bắt đầu khóc.\n\nTa nghe tiếng đàn ông gần đó, rồi nhiều giọng nói hốt hoảng vang lên. Khi tiếng nói mờ dần, cơn đau cũng giảm và Ta ngủ thiếp đi."
  murder_outcome.5002.poisoned_candy:0 "Ta ra chơi thì thấy trước mặt: một món [ROOT.Char.Custom('FavoriteTreat')] hấp dẫn vô cùng. Không ai gần, và không ai nhận ra nếu Ta ăn một miếng...\n\nKhi Ta định cắn, một con chó hoang gầy guộc giật mất, nuốt chửng, rồi sập xuống chết."
  murder_outcome.5002.child_pushed_dog:0 "Ta ra chơi và nghe tiếng kêu tuyệt vọng của chú chó yêu quý [ROOT.Char.Custom('DogStoryName')]! Nhìn lên thấy [ROOT.Char.Custom('DogStoryHerHim')] treo trên tường cao, Ta lao đến cứu [ROOT.Char.Custom('DogStoryHerHis')] nhanh nhất có thể.\n\nKhi Ta với xuống cứu [ROOT.Char.Custom('DogStoryHerHim')], thế giới lật ngược và Ta rơi; mặt đất lao lên chạm Ta, Ta nhắm mắt và– ...thấy mình treo trên tường bằng phần lưng áo [ROOT.Char.Custom('GetUpperClothingArticle')]. #EMP Phew!#!"
  murder_outcome.5002.child_pushed_cat:0 "Ta ra chơi và nghe tiếng kêu tuyệt vọng của chú mèo yêu quý [ROOT.Char.Custom('CatStoryName')]! Nhìn lên thấy [ROOT.Char.Custom('CatStoryHerHim')] treo trên tường cao, Ta lao đến cứu [ROOT.Char.Custom('CatStoryHerHis')] nhanh nhất có thể.\n\nKhi Ta với xuống cứu [ROOT.Char.Custom('CatStoryHerHim')], thế giới lật ngược và Ta rơi; mặt đất lao lên chạm Ta, Ta nhắm mắt và– ...thấy mình treo trên tường bằng phần lưng áo [ROOT.Char.Custom('GetUpperClothingArticle')]. #EMP Phew!#!"
  murder_outcome.5002.child_pushed_toy:0 "Ta ra chơi thì thấy: [target.Custom('child_favorite_toy')] yêu thích treo trên tường cao. Ta leo nhanh, nhưng khi với xuống cứu, thế giới lật ngược và Ta rơi; mặt đất lao lên chạm Ta, Ta nhắm mắt và– ...thấy mình treo trên tường bằng phần lưng áo [ROOT.Char.Custom('GetUpperClothingArticle')]. #EMP Phew!#!"
  murder_outcome.5002.child_pushed:0 "Ta ra chơi và thấy: dấu kẹo dẫn lên cầu thang. Lên tới đỉnh, giỏ treo đầy kẹo! Nhưng khi Ta với xuống, thế giới lật ngược và Ta rơi; mặt đất lao lên chạm Ta, Ta nhắm mắt và– ...thấy mình treo trên tường bằng phần lưng áo [ROOT.Char.Custom('GetUpperClothingArticle')]. #EMP Phew!#!"
  murder_outcome.5002.beat_to_death_in_dungeon:0 "Khi cửa phòng giam mở, Ta hy vọng được tự do. Nhưng những kẻ khoác áo choàng phá tan hy vọng, đánh Ta tàn nhẫn.\n\nThật may, sự xuất hiện kịp thời của lính gác cứu Ta."
  murder_outcome.5002.unwelcome_guest_house_arrest:0 "Một người Ngài cũ chờ Ta trong phòng, nhưng Ta gặp một kẻ đội mũ trùm — lạ và đáng ngờ.\n\nKhi dao giấu xuất hiện, Ta chuẩn bị chạy ra cửa, hô to cho lính gác, may mà họ đứng ngoài phòng, có lẽ cũng không tin kẻ lạ."
  murder_outcome.5002.strangle_incapable:0 "Thế giới vẫn tồn tại chứ? Ta không cảm nhận thời gian. Cơn đau ở… ngực? Hay… cổ? Đây có phải cơ thể Ta? Đêm phủ lên tâm trí Ta? Thật khó tập trung.\n\nCó ai quanh Ta không? Ta không nghe, nhưng cảm giác #EMP feels#! như ai đó đang hét. Rồi lại chỉ còn im lặng."
  murder_outcome.5002.schemer_known:0 "\n\nChắc chắn là công việc của [owner.Custom2('InsultAdjective', ROOT.Char)] [owner.Custom2('InsultNoun', ROOT.Char)], [owner_to_reveal.GetTitledFirstName]!"
  murder_outcome.5002.will_find_out:0 "Ta sẽ tìm ra kẻ đứng sau!"
  murder_outcome.5002.revenge_will_be_had:0 "Ta sẽ khiến [owner_to_reveal.GetHerHim] hối hận!"
  murder_outcome.5002.child:0 "Người lớn nào lại tàn nhẫn đến thế?"
  murder_outcome.5002.infant:0 "Ta lại khóc thêm."
  murder_outcome.5002.option_incapable:0 "Chuyện gì đang xảy ra?"

  murder_outcome.5002.memories_death:0 "\n\nKhi Ta mờ dần, một giọng lạnh lùng nói:\n#EMP 'Hợp đồng xong. Trả thù cho lúc [bad_memory.GetThirdPerspectiveDescription], kiểm tra. Thu vàng thôi.'#!"
  murder_outcome.5002.memories:1 "\n\nMột mảnh giấy nhăn được tìm thấy gần hiện trường: #EMP 'Thanh toán đầy đủ. Hợp đồng được lập cho khi [bad_memory.GetThirdPerspectiveDescription].'#!"
 # Family Feud
  murder_outcome.5002.house_feud:0 "\n\nNhà [owner_to_reveal.GetHouse.GetBaseName]! Lẽ ra Ta phải biết!"
  murder_outcome.4301.house_feud:0 "\n\nĐồ chết tiệt [target.GetHouse.GetBaseName]!"
  murder_outcome.2001.house_feud:0 "\n\nÍt ra bớt một [target.GetHouse.GetBaseName] phải lo!"
  murder_outcome.2001.b:0 "Đây mới chỉ là khởi đầu."
  murder_outcome.2001.c:0 "Công lý được thực thi."






