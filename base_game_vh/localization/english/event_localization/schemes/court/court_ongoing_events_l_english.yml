 #GIFT: wolf Pelt, by Mathilda Bjarnehed
  court_ongoing.1022.t:1 "$court_event_title$ Kẻ Xám"
  court_ongoing.1022.start.desc:0 "'Ngọt ngào [target.GetLadyLord] [target.GetFirstName]!' Ta thở dài khi quỳ trước [target.GetHerHim]. 'Mong muốn duy nhất của Ta là mang lại vinh quang và hạnh phúc cho ngươi. Xin cho biết — ta phải làm gì để chứng tỏ tình yêu của ta?'\n\n"
  court_ongoing.1022.end.desc:0 "[target.GetTitledFirstNameNoTooltip] ngập ngừng và má [target.GetHerHis] đỏ lên. Bởi [ROOT.Char.GetFaith.HighGodName], Ta hy vọng [target.GetSheHe] vui và không xấu hổ!\n\n'Giết một con sói và mang da về cho ta. Sau đó, chúng ta có thể tiếp tục cuộc trò chuyện.'"
  court_ongoing.1022.a:0 "'Mệnh lệnh của ngài là mệnh lệnh của Ta!'"
  court_ongoing.1022.a.success:0 "Ngươi giết được một con sói"
  court_ongoing.1022.a.failure:0 "Ngươi trở về tay trắng"
  court_ongoing.1022.b:0 "Ta thấy một con thú xù trong chuồng..."
  court_ongoing.1022.b.success:0 "[target.GetShortUINameNoTooltip] bị thuyết phục bởi da chó"
  court_ongoing.1022.b.failure:0 "[target.GetShortUINameNoTooltip] nhận ra mưu mẹo của Ngài"
  court_ongoing.1022.c:0 "Ta sẽ hối lộ một thợ săn."
  court_ongoing.1022.c.master_of_hunt:0 "$master_of_hunt_court_position$ của Ta sẽ tìm da sói cho Ta!"
  court_ongoing.1022.c.master_of_hunt.success:0 "[master_of_hunt.GetFirstNameNoTooltip] tìm và hạ một con sói trong khi săn"
  court_ongoing.1022.c.master_of_hunt.success.tt:0 "Ngươi nhận được da miễn phí, không rủi ro."
  court_ongoing.1022.c.master_of_hunt.failure:0 "[master_of_hunt.GetFirstNameNoTooltip] tìm da sói để mua"
  court_ongoing.1022.d:0 "'Xin lỗi, nhưng Ta không thể làm điều này.'"

  court_ongoing.1023.desc:0 "Một trong những con chó yêu thích của Ta đã mất tích khỏi chuồng. [dummy_gender.Custom('MistressMaster')] của đàn chó đã tìm kiếm đêm qua, nhưng không có kết quả. 'Ta không biết [dog_gender.GetSheHe] làm thế nào để ra ngoài,' [dummy_gender.GetWomanMan] tóc xám thở dài. 'Một con chó không thể mở cổng...'\n\n'[ROOT.Char.GetLadyLord] [ROOT.Char.GetFirstNameNoTooltip]!' Khi Ta quay lại, Ta gặp nụ cười rộng của [owner.GetTitledFirstNamePossessive]. Trong tay [target.GetHerHis] là một tấm da sáng bóng..."
  court_ongoing.1023.a:0 "Để Ta yên. Ta cần thời gian suy nghĩ..."
  court_ongoing.1023.b:0 "Đồ sát nhân! Ta không muốn gặp lại ngươi!"

  court_ongoing.1024.desc:0 "Dưới màn đêm, ta lẻn vào cũi chó. Ta sớm tìm thấy nạn nhân hoàn hảo. "Đến đây nào, con quái vật nhỏ," ta thì thầm khi vẫy một khúc xúc xích dày trước mặt sinh vật không nghi ngờ...\n\nNhưng kế hoạch xảo quyệt của ta đã có một bước ngoặt bất ngờ khi ta trình bày tấm da cho [target.GetTitledFirstName]. Ngay khi [target.GetSheHe] đặt mắt lên nó, ta biết [target.GetSheHe] nhận ra nó. "Ngươi... Ngươi kẻ sát nhân! Con chó đó như một đứa con đối với ta!""
  court_ongoing.1024.a:0 "Ta... Ta không biết ngươi đang nói gì!"

 #GIFT: PET, by Mathilda Bjarnehed
  court_ongoing.1030.t:1 "$court_event_title$ Thú Cưng Đồng Hành"
  court_ongoing.1030.desc:2 "Mưa đang trút xuống ngoài kia. [target.Custom('ComplimentAdjective')] [target.GetTitledFirstName] thở dài khi [target.GetSheHe] nhìn ra cửa sổ mờ.\n\n'Ôi [location.GetNameNoTooltip] thật khốn khổ. Ta ước có một người đồng hành trong những ngày dài tẻ nhạt...'\n\nLiệu [target.Custom('LoverPetName')] của Ta thích mèo hay thích chó nhỉ?"
  court_ongoing.1030.desc.eagle: "Hoặc có lẽ [target.GetSheHe] sẽ muốn một đồng hành chiến thuật hơn?"
  court_ongoing.1030.a:0 "Một chú mèo thông minh sẽ khiến [target.GetHerHim] vui vẻ."
  court_ongoing.1030.a.success:0 "[target.GetShortUINameNoTooltip] yêu thích chú mèo"
  court_ongoing.1030.a.failure:0 "[target.GetShortUINameNoTooltip] không thích chú mèo"
  court_ongoing.1030.b:0 "Một chú chó trung thành sẽ là đồng hành tuyệt vời."
  court_ongoing.1030.b.success:0 "[target.GetShortUINameNoTooltip] yêu thích chú chó"
  court_ongoing.1030.b.failure:0 "[target.GetShortUINameNoTooltip] không thích chú chó"
  court_ongoing.1030.d: "Một chú đại bàng mạnh mẽ sẽ giúp [target.GetHerHim]."
  court_ongoing.1030.d.success: "[target.GetShortUINameNoTooltip] yêu thích chú đại bàng"
  court_ongoing.1030.d.failure: "[target.GetShortUINameNoTooltip] không thích chú đại bàng"
  court_ongoing.1030.c:0 "'Đừng sợ, ta sẽ luôn bên cạnh ngươi!'"

  court_ongoing.1031.start.desc:0 "'Ta đã suy nghĩ kỹ, [ROOT.Char.Custom('LoverPetName')],' [owner.GetTitledFirstName] nói khi [owner.GetSheHe] nhẹ nhàng đặt giỏ lên bàn Ta. 'Người Ngài hoàn hảo cho một sinh vật trung thành, năng động và hòa đồng như ngươi là gì? Và rồi ta nhận ra — chẳng gì phù hợp hơn một chú chó!' \n\n[owner.GetFirstNameNoTooltip|U] mở chiếc chăn che giỏ, lộ ra một chú cún nhỏ! Nó nhảy lên Ta, vấp vành giỏ vì quá hứng khởi."
  court_ongoing.1031.a:0 "Awh! Ta sẽ chăm sóc ngươi thật tốt!"
  court_ongoing.1031.b:0 "Cái này... không phải điều ta mong đợi."

  court_ongoing.1032.desc:0 "'Ta đã suy nghĩ kỹ, [ROOT.Char.Custom('LoverPetName')],' [owner.GetTitledFirstName] nói khi [owner.GetSheHe] nhẹ nhàng đặt giỏ lên bàn Ta. 'Người Ngài hoàn hảo cho một sinh vật thông minh và độc lập như ngươi là gì? Và rồi ta nhận ra — chẳng gì phù hợp hơn một chú mèo!' \n\n[owner.GetFirstNameNoTooltip|U] mở chiếc chăn che giỏ, lộ ra một chú mèo con! Nó ngước lên nhìn Ta bằng đôi mắt to, màu [ROOT.Char.Custom('RandomCatEyeColor')] và bắt đầu kêu rừ rừ."

  court_ongoing.1033.desc: "'Ta đã suy nghĩ kỹ, [ROOT.Char.Custom('LoverPetName')],' [owner.GetTitledFirstName] nói khi [owner.GetSheHe] dẫn Ta ra ngoài. [owner.GetSheHe|U] chỉ vào một mảnh vải che một vật nhỏ. 'Người Ngài hoàn hảo cho một sinh vật mạnh mẽ và chiến lược như ngươi là gì? Và rồi ta nhận ra — chẳng gì phù hợp hơn một chú đại bàng!' \n\n[owner.GetFirstNameNoTooltip|U] mở mảnh vải, lộ ra một chú đại bàng non trên cọc gỗ. Mắt nó được che bằng chiếc mũ nhỏ để giữ bình tĩnh, nhưng tiếng kêu của nó khiến Ta phấn khích."

 #GIFT: Necklace, by Mathilda Bjarnehed
  court_ongoing.1040.t:1 "$court_event_title$ Vàng Lấp Lánh"
  court_ongoing.1040.end.desc:0 "[target.GetFirstNameNoTooltip] nhìn ta một cái thật lâu. "Chiếc vòng cổ của [necklace_owner.GetLadyLord|U] [necklace_owner.GetFirstNamePossessiveNoTooltip] thật đáng yêu," [target.GetSheHe] nói và gật đầu về phía [necklace_owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. "Nhưng nó sẽ trông đẹp hơn nữa quanh cổ con.""
  court_ongoing.1040.a:0 "Đặt làm một chiếc dây chuyền giống hệt."
  court_ongoing.1040.b:0 "Đề nghị [necklace_owner.GetFirstNameNoTooltip] một ân huệ để đổi lấy chiếc vòng cổ của [necklace_owner.GetHerHis]."
  court_ongoing.1040.c:0 "Ăn trộm nó."
  court_ongoing.1040.c.success:0 "Ngài lấy được dây chuyền mà không ai hay biết"
  court_ongoing.1040.c.failure:0 "Ngài bị phát hiện trong phòng của [necklace_owner.GetFirstNamePossessiveNoTooltip]"

  court_ongoing.1040.d:0 "Khen gu thẩm mỹ của [target.GetFirstNamePossessiveNoTooltip]."

 #GIFT: Flower, by Mathilda Bjarnehed
  court_ongoing.1050.t:0 "$court_event_title$ Một Bông Hoa Quý Hiếm"
  court_ongoing.1050.start.desc:0 "Khi Ta và [target.Custom('LoverPetName')] đi dạo qua khu vườn [target_location.GetNameNoTooltip], Ta chỉ vào cây cối xung quanh. 'Dù tất cả đều đẹp, không có bông hoa nào sánh được với ngươi, [target.GetLadyLord] của ta.'\n\n'Có một bông,' [target.GetSheHe] nói với nụ cười tinh nghịch. 'Một bông lan quý từ [orchid_origin.GetNameNoTierNoTooltip], gần như không thể trồng được.'"
  court_ongoing.1050.monastery.desc:0 "Tàn tích tu viện ở [orchid_location.GetNameNoTooltip] là nơi duy nhất nó sinh trưởng trong vùng này."
  court_ongoing.1050.temple.desc:0 "Khu vườn [target_host.GetFaith.HouseOfWorship] bỏ hoang ở [orchid_location.GetNameNoTooltip] là nơi duy nhất nó sinh trưởng trong vùng này."
  court_ongoing.1050.a:0 "Chắc chắn Ta có thể tìm một thương nhân sẵn sàng bán cho Ta."
  court_ongoing.1050.b:0 "'Ta sẽ dám mạo hiểm vào tàn tích vì ngươi!'"
  court_ongoing.1050.b.success:0 "Ngài tìm thấy một bông lan trong tàn tích"
  court_ongoing.1050.b.soft_failure:0 "Ngài tìm suốt cả ngày mà không thấy gì"
  court_ongoing.1050.b.hard_failure:0 "Ngài bị thương khi leo tháp"
  court_ongoing.1050.b.friend.success:0 "[helpful_friend.GetShortUIName|U] tìm thấy một bông lan trong tàn tích"
  court_ongoing.1050.b.friend.soft_failure:0 "[helpful_friend.GetShortUIName|U] không tìm thấy gì"
  court_ongoing.1050.b.friend.hard_failure:0 "[helpful_friend.GetShortUIName|U] bị thương trong tàn tích"
  court_ongoing.1050.b.friend:0 "[helpful_friend.GetTitledFirstNameNoTooltip] có thể giúp Ta."
  court_ongoing.1050.b.friend.f:0 "Lựa chọn này có sẵn nhờ vào kỹ năng [prowess|E] cao của Bạn Bè [helpful_friend.GetShortUINamePossessive]"
  court_ongoing.1050.c:0 "Gần như không thể? Ta đã có trong bộ sưu tập rồi!"
  court_ongoing.1050.c.friend.f:0 "Lựa chọn này có sẵn nhờ vào đặc điểm Thảo Dược của Bạn Bè [helpful_friend.GetShortUINamePossessive]"
  court_ongoing.1050.d:0 "'Nghe nói tàn tích bị ma ám...'"
  court_ongoing.1050.e:0 "'Chắc chắn chúng chẳng thể sánh với nhan sắc của ngươi!'"
  court_ongoing.1050.f:0 "'Có lẽ một ngày nào đó Ta sẽ được thấy nó.'"

 

 #COMPLIMENT POEM, by Mathilda Bjarnehed
  court_ongoing.1100.t:1 "$court_event_title$ Thư Pháp Ca Ngợi"
  court_ongoing.1100.desc:0 "Không có [target.GetWomanMan] nào xinh đẹp hơn [target.GetTitledFirstName]! Khi ở bên [target.GetHerHis], lời nói của Ta thường thất bại — không lời khen nào của Ta có thể làm [target.GetHerHim] công bằng. Có lẽ một bài thơ được soạn cẩn thận sẽ khắc họa tốt hơn đức hạnh của [target.GetHerHis]?\n\nTa sẽ viết về [target.GetHerHis]..."
  court_ongoing.1100.compliment.tt:0 "Phản ứng của [target.GetTitledFirstNamePossessive] sẽ dựa trên mức độ phù hợp của bài thơ với [target.GetHerHim]."
  court_ongoing.1100.success.tt:0 "[target.GetFirstNameNoTooltip] phản hồi tích cực"
  court_ongoing.1100.neutral.tt:0 "[target.GetFirstNameNoTooltip] không phản hồi"
  court_ongoing.1100.failure.tt:0 "[target.GetFirstNameNoTooltip] phản hồi tiêu cực"

  court_ongoing.1100.compassionate:0 "Trái tim nhân hậu và giàu cảm xúc."
  court_ongoing.1100.bold:0 "Dũng cảm không sợ hãi."
  court_ongoing.1100.honorable:1 "Chính trực và cao quý."
  court_ongoing.1100.greed:0 "Tham vọng cao vời."
  court_ongoing.1100.rational:0 "Trí tuệ vô tận."
  court_ongoing.1100.zealous:0 "Đức tin nồng nhiệt."
  court_ongoing.1100.energetic:0 "Sức trẻ tràn đầy."
  court_ongoing.1100.forgiving:0 "Tấm lòng khoan dung."
  court_ongoing.1100.beautiful:0 "Nét đẹp tinh tế."
  court_ongoing.1100.strong:0 "Thân thể mạnh mẽ."
  court_ongoing.1100.extroverted:0 "Phẩm chất cuốn hút."
  court_ongoing.1100.dominant:0 "Ánh hào quang quyết đoán."
  court_ongoing.1100.fallback:0 "Thơ ca không phải sở trường của Ta."

  court_ongoing.1101.t:1 "Gửi [target.Custom('RomanticComplimentAdjective')] [target.GetTitledFirstNameNoTooltip],"
  court_ongoing.1101.desc:0 "[owner.Custom2('love_letter_compliment_system', SCOPE.sC('target'))]"
  court_ongoing.1101.a.good:0 "[owner.GetSheHe|U] đã truyền tải bản chất của Ta lên trang giấy!"
  court_ongoing.1101.a.bad:0 "Thật kỳ lạ! Nhưng mà... duyên dáng."
  court_ongoing.1101.c.good:0 "Quá khoa trương."
  court_ongoing.1101.c.bad:0 "[owner.GetSheHe] đang cố xúc phạm Ta sao?!"

  court_ongoing.1102.t:1 "Gửi [owner.Custom('RomanticComplimentAdjective')] [owner.GetTitledFirstNameNoTooltip],"
  court_ongoing.1102.desc:0 "[target.Custom2('love_letter', SCOPE.sC('owner'))]"
  court_ongoing.1102.a:0 "[target.GetSheHe|U] hẳn là thích bài thơ của Ta!"

  court_ongoing.1103.t:1 "[target.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
  court_ongoing.1103.a:0 "[target.GetSheHe]... đang chế nhạo Ta sao?"


 #Dealing with competition, by Mathilda Bjarnehed
  court_ongoing.1110.t:0 "$court_event_title$ Đối Thủ"
  court_ongoing.1110.desc:0 "Gần đây, tất cả các chuyến thăm của ta đến [target.GetFirstName] đều bị [competitor.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] phá hỏng! [competitor.GetSheHe|U] theo [target.GetHerHim] khắp mọi nơi, như một chú cún đi lạc. Những nỗ lực của [competitor.GetHerHis] nhằm quyến rũ [target.GetLadyLord] thật nực cười, nhưng ta sợ rằng sự kiên trì của [competitor.GetHerHis] sẽ được đền đáp."
  court_ongoing.1110.a:0 "Một trận đấu tay đôi sẽ chứng minh ai xứng đáng!"
  court_ongoing.1110.a.success:0 "Ngài thắng trận đấu tay đôi"
  court_ongoing.1110.a.failure:0 "Ngài thua trận đấu tay đôi"
  court_ongoing_1110.competitor_remains.tt:0 "[competitor.GetShortUIName|U] vẫn tiếp tục tán tỉnh [target.GetShortUIName]"
  court_ongoing.1110.b:0 "Một 'tai nạn' ngộ độc thực phẩm sẽ ổn thôi."
  court_ongoing.1110.b.success:0 "[competitor.GetShortUINameNoTooltip] tạo cảnh tượng xấu hổ trong bữa tối"
  court_ongoing.1110.b.failure:0 "[competitor.GetShortUINameNoTooltip] nhận ra khi Ngài đổ độc vào chén của [competitor.GetHerHis]"
  court_ongoing.1110.b.murder:0 "Loại độc này #EMP quá mạnh#!"
  court_ongoing.1110.c:0 "Tình yêu của [competitor.GetHerHis|U] không thật; tiền sẽ thuyết phục [competitor.GetHerHim] ngừng lại."
  court_ongoing.1110.c.success:0 "[competitor.GetShortUINameNoTooltip] nhận hối lộ"
  court_ongoing.1110.c.failure:0 "[competitor.GetShortUINameNoTooltip] kể cho [target.GetShortUINameNoTooltip] về đề nghị của Ngài"
  court_ongoing.1111.t:0 "Được Yêu Thích"
  court_ongoing.1111.start.desc:0 "[owner.GetTitledFirstName] không phải là người duy nhất cố gắng giành được sự chấp thuận của ta. Ngày càng thường xuyên hơn, ta được tiếp cận bởi [competitor.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] và những lời khen ngợi của [competitor.GetHerHis] đã chuyển từ lịch sự sang thân mật.\n\n"
  court_ongoing.1111.duel_success.desc:0 "[owner.GetTitledFirstNameNoTooltip] không hề hài lòng trước sự quan tâm của [competitor.GetFirstNamePossessiveNoTooltip]. [owner.GetSheHe|U] thách đấu [competitor.GetFirstNameNoTooltip]! Khi ta đến đó, mọi chuyện đã kết thúc; [owner.GetTitledFirstNameNoTooltip] đứng chiến thắng trên kẻ thù bị đánh bầm dập của mình."
  court_ongoing.1111.duel_failure.desc:0 "[owner.GetTitledFirstNameNoTooltip] không hề hài lòng trước sự quan tâm của [competitor.GetFirstNamePossessiveNoTooltip]. [owner.GetSheHe|U] thách đấu [competitor.GetFirstNameNoTooltip]! Khi ta đến đó, mọi chuyện đã kết thúc; [competitor.GetTitledFirstNameNoTooltip] đứng chiến thắng trên kẻ thù bị đánh bầm dập của mình."
  court_ongoing.1111.poison_success.desc:0 "Nhưng tối nay, trong bữa tối, [competitor.GetTitledFirstNameNoTooltip] uống quá nhiều và nôn lên váy của Ta! Ngay lập tức, [owner.GetTitledFirstNameNoTooltip] lao vào cứu Ta khỏi cảnh lộn xộn."
  court_ongoing.1111.poison_failure.desc:0 "Bây giờ [competitor.GetTitledFirstNameNoTooltip] kể rằng [owner.GetTitledFirstNameNoTooltip] ghen tuông điên cuồng và cố đầu độc [competitor.GetHerHim]!"

  court_ongoing.1111.a.success:0 "Ôi, [owner.GetTitledFirstNameNoTooltip]! Thật anh hùng!"
  court_ongoing.1111.a.duel_failure:0 "Thương xót [owner.GetTitledFirstNameNoTooltip]! Để Ta chăm sóc vết thương cho ngươi."
  court_ongoing.1111.a.poison_failure:0 "[owner.GetTitledFirstNameNoTooltip] sẽ không dùng mưu mẹo đáng khinh như vậy!"
  court_ongoing.1111.b.poison_success:0 "Để Ta yên! Ta tự lo được!"
  court_ongoing.1111.b.poison_failure:0 "Ngươi làm sao thế, [owner.GetTitledFirstNameNoTooltip]?!"
  court_ongoing.1111.b.duel_success:0 "Tranh cãi trẻ con #EMP không#! làm Ta ấn tượng."
  court_ongoing.1111.b:0 "Ghen tuông không hợp với ngươi, [owner.GetTitledFirstNameNoTooltip]."
  court_ongoing.1111.c.duel_failure:0 "Ôi, [competitor.GetTitledFirstNameNoTooltip]! Ngươi thật dũng cảm!"
  court_ongoing.1111.c:0 "Thương xót [competitor.GetTitledFirstNameNoTooltip]! Trái tim Ta đau cho ngươi!"
  court_ongoing.1111.d:0 "Ta chán cả hai rồi!"

  court_ongoing.1112.desc:0 "[competitor.GetTitledFirstName] không có cơ hội chống lại sức mạnh của Ta! Thất bại của [competitor.GetHerHis|U] thật đáng xấu hổ — và [target.Custom('LoverPetName')] của Ta, [target.GetFirstName], đã chứng kiến tất cả! [target.GetSheHe|U] kể từ đó không hề chú ý đến [competitor.GetHerHim]."
  court_ongoing.1112.a:0 "Một kẻ thù nữa bị đánh bại!"

  court_ongoing.1113.desc:0 "Có vẻ như Ta đã đánh giá thấp khả năng của [competitor.GetTitledFirstNamePossessive] — thất bại dưới tay [competitor.GetHerHis] thật đau đớn và xấu hổ. Niềm an ủi duy nhất là [target.GetTitledFirstName] không chứng kiến."
  court_ongoing.1113.a:0 "Hãy quên tất cả chuyện này đi..."
  court_ongoing.1113.b:0 "Ta sẽ trả thù! Hãy tin lời ta!"

  court_ongoing.1114.desc:0 "Không gì sánh bằng cảm giác thỏa mãn khi một kế hoạch được thực hiện hoàn hảo!\n\nKhông ai nhìn thấy khi Ta đổ độc vào chén của [competitor.GetTitledFirstNamePossessive], và cảnh tượng sau đó sẽ không bao giờ quên! [competitor.GetSheHe|U] nôn lên [target.GetFirstNamePossessive] [target.Custom('GetClothingArticle')] và [target.GetSheHe] vô cùng biết ơn khi Ta lao vào cứu [target.GetHerHim] khỏi mớ hỗn độn."
  court_ongoing.1114.a:0 "[target.GetSheHe|U] sẽ không bao giờ nhìn về phía [competitor.GetHerHis] nữa!"


  court_ongoing.1115.desc:0 "Hóa ra, [competitor.GetTitledFirstName] nhạy bén hơn nhiều so với những gì ta đánh giá. [competitor.GetSheHe|U] bắt quả tang ta khi ta cố gắng bỏ thuốc độc vào cốc của [competitor.GetHerHis] và hắn đã tố cáo ta trong chớp mắt!"
  court_ongoing.1115.a:0 "Không phải như vẻ ngoài đâu..."

  court_ongoing.1116.desc:0 "Phần đầu trong kế hoạch của ta diễn ra hoàn hảo. Không ai nhìn thấy ta khi ta đổ thuốc độc vào cốc của [competitor.GetTitledFirstNamePossessive]. Tuy nhiên, có vẻ như ta đã đánh giá thấp tác dụng của nó.\n\nChỉ vài giây sau khi [competitor.GetFirstNameNoTooltip] đưa đồ uống lên môi, [competitor.GetSheHe] bắt đầu nghẹt thở! Trước khi ai đó có thể giúp đỡ, [competitor.GetSheHe] đổ gục vào món hầm của mình, chết cứng."
  court_ongoing.1116.a:0 "Ít ra [competitor.GetSheHe] sẽ không còn tán tỉnh [target.GetFirstNameNoTooltip] nữa."

 # Boring party guest
  court_ongoing.1120.t:0 "$court_event_title$ $court_ongoing.1121.t$"
  court_ongoing.1120.desc:0 "Ta tham dự một buổi dạ hội ở [target_location.GetNameNoTooltip] để dành thời gian bên [target.GetTitledFirstName]. Chỉ nghĩ đến việc chạm tay nhau thôi cũng làm tim Ta nhảy lên! Nhưng khi tới nơi, Ta thấy [target.GetHerHim] đang mắc kẹt trong cuộc trò chuyện với [unpleasant_guest.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)].\n\n[unpleasant_guest.Custom2('InsultAdjective', ROOT.Char)] [unpleasant_guest.GetWomanMan] nói lảm nhảm mãi, hoàn toàn không nhận ra [target.GetFirstNamePossessiveNoTooltip] đang khó chịu."
  court_ongoing.1120.a:0 "Một chút #EMP 'xao nhãng'#! có vẻ hợp lý."
  court_ongoing.1120.a.failure:0 "Cuộc trò chuyện thật nhàm chán đến khó chịu"
  court_ongoing.1120.b:0 "Sức quyến rũ của Ta sẽ làm bất cứ cuộc trò chuyện nào thú vị hơn!"
  court_ongoing.1120.c:0 "Ta sẽ thay chỗ [target.GetHerHis]. Thà Ta chịu khổ còn hơn [target.GetHerHim]."
  court_ongoing.1120.d:0 "'Đủ rồi! Ngươi đang làm [target.GetLadyLord] chán chết!'"
  court_ongoing.1120.e:0 "Ta sẽ không tiến gần tới [unpleasant_guest.GetWomanMan] đó một bước nào!"


  court_ongoing.1121.t:0 "Những Lời Chào Khó Chịu"
  court_ongoing.1121.start.desc:0 "Khi Ta gửi lời mời tới buổi dạ hội, Ta mong chờ một buổi tối với Bạn Bè và niềm vui nhẹ nhàng. Thay vào đó, Ta lại mắc kẹt trong một cuộc trò chuyện khủng khiếp với [unpleasant_guest.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]...\n\n"
  court_ongoing.1121.diplomacy.desc:0 "'Chào buổi tối,' một giọng quen thuộc chào — [owner.GetTitledFirstName] tham gia cuộc trò chuyện. [owner.GetSheHe|U] lắng nghe chăm chú, và ngay lập tức [unpleasant_guest.GetFirstNamePossessiveNoTooltip] hoàn toàn chú ý tới [owner.GetHerHim]. Ta được tự do thoát khỏi tình thế khó chịu."
  court_ongoing.1121.intrigue.desc:1 "'Xin lỗi, nhưng có một việc khẩn cấp cần sự chú ý của ngài, [unpleasant_guest.Custom2('RelationToMeAddress', owner)].' Giọng quen thuộc ấy không ai khác chính là [owner.GetTitledFirstName]. [owner.GetSheHe|U] nháy mắt với Ta khi [owner.GetSheHe] ra hiệu cho [unpleasant_guest.GetFirstNameNoTooltip] đi theo."
  court_ongoing.1121.insult.desc:1 "'Ta nghĩ [ROOT.Char.GetLadyLord] đã quá đủ rồi,' một [owner.GetWomanMan] ngắt lời — đó là [owner.GetTitledFirstName]! 'Ngươi không nhận ra ngươi đang làm [ROOT.Char.GetHerHim] chán ngấy sao, [unpleasant_guest.Custom2('RelationToMeAddress', owner)]?'"
  court_ongoing.1121.a:0 "Một bài học về ngoại giao hữu ích, dù khó chịu!"
  court_ongoing.1121.a.critical_success:0 "Ngài học được một mánh ngoại giao mới"
  court_ongoing.1121.a.success:0 "Hiểu biết của Ngài về ngoại giao tăng lên"
  court_ongoing.1121.b:0 "Một bài học về mưu mô hữu ích, dù khó chịu!"
  court_ongoing.1121.b.critical_success:0 "Ngài học được một mánh lừa gạt mới"
  court_ongoing.1121.b.success:0 "Hiểu biết của Ngài về mưu mô tăng lên"
  court_ongoing.1121.c:0 "'Thật vậy, Ta đã quá đủ rồi.'"
  court_ongoing.1121.c.success:0 "[unpleasant_guest.GetShortUIName|U] trân trọng sự thẳng thắn của Ngài"
  court_ongoing.1121.c.failure:0 "[unpleasant_guest.GetShortUIName|U] bị xúc phạm"
  court_ongoing.1121.d:0 "Một [ROOT.Char.GetTitleAsNameNoTooltip] luôn có thời gian cho mọi người. [owner.GetFirstNameNoTooltip] nên biết điều đó."
  court_ongoing.1121.e:0 "Ta sẽ không ở lâu hơn mức cần thiết!"
 

 #EXTREME REQUEST — CHOOSE, by Linnéa Thimrén
  court_ongoing.1201.t:0 "Lời Yêu Cầu"
  court_ongoing.1201.desc:0 "'[target.GetLadyLord|U] [target.GetFirstName], hãy để Ta chứng minh lòng tận tụy với ngài theo bất cứ cách nào ngài thấy xứng đáng!' [owner.GetTitledFirstName] van nài Ta tạo ra một thử thách để kiểm chứng lòng tận tụy của [owner.GetHerHis] — một việc do Ta chọn. Ta sẽ yêu cầu [owner.GetHerHim] kiêng nhiều ngày khỏi..."
  court_ongoing.1201.a:0 "Ngủ — bảo vệ Ta khỏi những cơn ác mộng!"
  court_ongoing.1201.a_success:0 "[owner.GetHerHis|U] canh gác khiến Ta ngủ yên"
  court_ongoing.1201.a_failure:0 "[owner.GetSheHe|U] thất bại trong [owner.GetHerHis] nhiệm vụ"
  court_ongoing.1201.b:0 "Thức ăn — tình yêu của ngươi với ta đủ làm lương thực rồi."
  court_ongoing.1201.b_success:0 "[owner.GetSheHe|U] chứng minh [owner.GetHerHis] lòng tận tụy"
  court_ongoing.1201.c:0 "Ta không quan tâm thử thách [owner.GetHerHim]."

 #EXTREME REQUEST — SLEEP, by Linnéa Thimrén
  court_ongoing.1211.t:1 "$court_event_title$ Lời Yêu Cầu"
  court_ongoing.1211.desc_opening:0 "'[target.GetLadyLord|U] [target.GetFirstName], hãy để Ta chứng minh lòng tận tụy với ngài theo bất cứ cách nào ngài thấy xứng đáng!'\n\n[target.GetFirstNameNoTooltip] suy nghĩ một lúc trước khi [target.GetHerHis] mặt rạng rỡ."
  court_ongoing.1211.desc:0 "'Gần đây Ta thường gặp ác mộng. Nếu ngươi thực sự tận tụy, ngươi sẽ canh gác ngoài [target.Custom('GetChambersOrTent')] của Ta và đảm bảo không có điều ác nào làm Ta kinh sợ.'"
  court_ongoing.1211.a:0 "Ngươi sẽ ngủ không bị quấy rầy!"
  court_ongoing.1211.a.success:0 "Ngươi quản lý để thức suốt"
  court_ongoing.1211.a.failure:0 "Sức hấp dẫn của giấc ngủ đã thắng"
  court_ongoing.1211.b:0 "Hãy để Ta yên cả đêm và Ta sẽ canh gác."
  court_ongoing.1211.b.tt:0 "Một cây chổi với áo choàng của Ta cũng đủ để chống lại ác mộng."
  court_ongoing.1211.b.success:0 "Không ai phát hiện ra mưu mẹo"
  court_ongoing.1211.b.failure:0 "[target.GetSheHe|U] nhận ra mưu mẹo"
  court_ongoing.1211.c:0 "Ta sẽ không làm việc đó."

  court_ongoing.1212.desc:0 "Khi mặt trời mọc sau một đêm ngủ ngon, Ta chỉ có thể cảm ơn [owner.GetTitledFirstName] vì đã canh gác ngoài [ROOT.Char.Custom('GetChambersOrTent')], giữ cho giấc ngủ Ta yên bình và không bị quấy rầy."
  court_ongoing.1212.a:0 "Người bảo vệ dũng cảm của ta!"

  court_ongoing.1213.desc:0 "Ngay khi Ta sắp chìm vào giấc ngủ, giữa đêm tối mịt mù, Ta đột nhiên nghe một tiếng #EMP đập mạnh#!! Nhìn ra từ [ROOT.Char.Custom('GetChambersOrTent')], Ta thấy không ai khác ngoài [owner.GetTitledFirstName], ngủ say trên sàn."
  court_ongoing.1213.a:0 "Người bảo vệ dũng cảm của ta..."

  court_ongoing.1214.desc:0 "\n\nTa thậm chí đã nhìn ra cửa vài lần để thấy [owner.GetHerHim] đứng thẳng cứng, không hề chao đảo."

  court_ongoing.1215.desc:0 "Ngay khi Ta sắp chìm vào giấc ngủ, giữa đêm tối mịt mù, Ta đột nhiên nghe một tiếng #EMP đập mạnh#!! Nhìn ra từ [ROOT.Char.Custom('GetChambersOrTent')], Ta chỉ thấy áo choàng trống rỗng của [owner.GetTitledFirstName], một chiếc mũ sắt và cây chổi bị đổ xuống đất."
  court_ongoing.1215.a:0 "[owner.GetSheHe|U] định lừa Ta!"

 #EXTREME REQUEST — FOOD, by Linnéa Thimrén
  court_ongoing.1221.desc:0 "'Ngươi nên chỉ cần tình yêu dành cho ta làm lương thực trong nhiều ngày.'"
  court_ongoing.1221.a:0 "Lòng tận tụy của Ta sẽ giúp Ta vượt qua!"
  court_ongoing.1221.a.success:0 "Ngươi tránh được việc ăn uống"
  court_ongoing.1221.a.failure:0 "Ngươi đầu hàng nhu cầu cơ thể"
  court_ongoing.1221.b:0 "Không một mẩu nào được đưa vào miệng!"
  court_ongoing.1221.b.tt:0 "Nhưng Ta sẽ không từ chối một miếng nhỏ hay một lát..."

  court_ongoing.1222.desc:0 "[owner.GetTitledFirstName] trông ngày càng tiều tụy qua mỗi ngày, nhưng ngay cả khi thân xác [owner.GetHerHis] hao mòn, ý chí và lòng tận tụy của [owner.GetHerHis] vẫn luôn vững vàng.\n\nTa tìm đến [owner.GetHerHim] để tuyên bố ngài đã vượt qua thử thách, và điều đầu tiên thoát ra từ đôi môi [owner.GetHerHis] lại là một lời thề trung thành khác."
  court_ongoing.1222.a:0 "Người [owner.GetLadyLord] tận tụy của ta!"

  court_ongoing.1223.desc:0 "[owner.GetTitledFirstName] trông ngày càng gầy gò qua từng ngày."
  court_ongoing.1223.desc_ending:0 "Thế nhưng, khi ta đi tìm [owner.GetHerHim] để tuyên bố thử thách đã được chinh phục, ta lại thấy [owner.GetHerHim] trong phòng chứa thức ăn, người dính đầy vụn bánh và đang nhồm nhoàm ngấu nghiến cả một tảng phô mai lớn."
  court_ongoing.1223.a:0 "Ta thấy ngươi tìm được nguồn lương thực khác..."

  court_ongoing.1225.desc:1 "[owner.GetTitledFirstName] dường như xử lý việc nhịn ăn khá tốt, và khi Ta tìm [owner.GetHerHim] để bày tỏ sự ngạc nhiên và ngưỡng mộ, Ta phát hiện ra cách thức.\n\nToàn bộ áo choàng của [owner.GetHerHis|U] chứa đầy thức ăn! Nhìn vẻ xấu hổ trên mặt [owner.GetHerHis] Ta hiểu ra rằng Ta không được phép thấy điều đó..."
