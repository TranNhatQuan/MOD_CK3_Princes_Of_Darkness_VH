l_english:
  court_event_title:0 "Lãng mạn:"

 #Modifiers
  court_competitor_modifier:0 "Đối thủ tình cảm"

 #ONGOING MANAGEMENT: Player target opted out
  court_ongoing.0001.t:0 "$court_event_title$ Từ chối"
  court_ongoing.0001.desc:0 "[target.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã từ chối những lời tán tỉnh của Ta! [target.GetSheHe|U] làm rõ ràng rằng [target.GetSheHe] không quan tâm, và có lẽ sẽ không bao giờ quan tâm."
  court_ongoing.0001.a:0 "Ôi, thật đau lòng!"

 #START EVENT: Owner picks method
  court_ongoing.0501.t:1 "$court_event_title$ Tuyên bố Tình yêu"
  court_ongoing.0501.desc:0 "Đã đến lúc để cảm xúc của ta đối với [target.GetTitledFirstName] được biết đến. Ta muốn [target.GetHerHim] ghi nhớ ngày này trong suốt quãng đời còn lại của [target.GetHerHis]."
  court_ongoing.0501.a:0 "Hát một khúc tình ca."
  court_ongoing.0501.b:0 "Lén để một bức thư trong [target.GetHerHis] [target.Custom('GetChambersOrTent')]."
  court_ongoing.0501.c:0 "Viết một bài thơ tình."
  court_ongoing.0501.d:0 "Gây ấn tượng với [target.GetHerHim] bằng cách thắng một trận đấu tập."
  court_ongoing.0501.x:0 "Theo trực giác lúc đó."
  court_ongoing.0501.tt:0 "Ngài tuyên bố lòng trung thành vĩnh cửu với [target.GetShortUIName]"

 #START EVENT: For Target 
  court_ongoing.0502.t:0 "$court_event_title$ Tuyên bố Tình yêu"
  court_ongoing.court_start_song.start.0502.desc:1 "Ta đang đi dạo trong khu vườn cùng vài người [ROOT.Char.Custom('LadiesLords')] tại triều đình thì nhìn thấy [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] tiến tới. Ta bước sang một bên để [owner.GetHerHim] đi qua, nhưng thật bất ngờ, [owner.GetSheHe] chặn đường và quỳ trước mặt Ta!\n\nTrước khi Ta kịp xử lý tình huống này, [owner.GetTitledFirstNameNoTooltip] bắt đầu hát.\n\n"
  court_ongoing.court_start_song.bad.0502.desc:0 "Trước sự thất vọng lớn của ta, người [owner.GetWomanMan] trước mặt ta không thể hát dù chỉ một nốt nhạc để cứu mạng mình. Phải mất một lúc ta mới nhận ra bài hát — đó là một bản ballad tình yêu nổi tiếng của [target.GetCulture.GetNameNoTooltip]. [owner.GetSheHe|U] đã thay đổi lời bài hát để bao gồm tên ta và nhắc đến ngoại hình của ta, làm hỏng nhịp điệu hơn nữa."
  court_ongoing.court_start_song.good.0502.desc:0 "Ta nhanh chóng nhận ra giai điệu — đó là một khúc tình ca nổi tiếng của [target.GetCulture.GetNameNoTooltip]. Ta đã nghe nhiều lần, nhưng chưa bao giờ với kỹ năng và cảm xúc mãnh liệt đến vậy!\n\nCảm xúc trong bài hát được phản chiếu trong ánh mắt của [owner.GetFirstNamePossessiveNoTooltip], dõi theo Ta. [owner.GetSheHe|U] không rời mắt một nhịp nào."
  court_ongoing.court_start_sneaky_love_letter.start.0502.desc:0 "Khi Ta xua tấm chăn để nằm xuống, thấy một cuộn giấy nhỏ đặt trên gối. Ai đó đã vào [ROOT.Char.Custom('GetChambersOrTent')] của Ta mà không bị phát hiện? Lạnh sống lưng khi Ta cẩn thận mở cuộn giấy dày.\n\n'Người [ROOT.Char.Custom('RomanticComplimentAdjective')]'"
  court_ongoing.court_start_sneaky_love_letter.compliment.0502.desc:0 "[ROOT.Char.Custom('RomanticComplimentNoun')]!"
  court_ongoing.court_start_sneaky_love_letter.relative.0502.desc:0 "[owner.Custom2('RelationToMeShort', ROOT.Char)]!"
  court_ongoing.court_start_sneaky_love_letter.end.0502.desc:0 "[ROOT.Char.GetLadyLord|U] trong trái tim Ta! Ta không thể giữ cảm xúc này bí mật nữa. Từ hôm nay, Ta sẽ làm mọi cách để chứng tỏ tình cảm trung thành của mình.'\n\n'Chúng ta sẽ sớm gặp lại. Cho đến lúc đó, hãy mơ về Ta, tình yêu của Ta. Mãi mãi là của Ngài, [owner.GetTitledFirstName].'"
  court_ongoing.court_start_poem_love_letter.0502.desc:0 "[owner.Custom2('love_letter', SCOPE.sC('target'))]\n\nNhững dòng này chỉ là phản ánh mờ nhạt cảm xúc của Ta dành cho Ngài. Ta sẽ làm bất cứ điều gì để chứng tỏ tình cảm trung thành của mình."
  court_ongoing.court_start_sparring.start.0502.desc:1 "Tiếng va chạm của vũ khí và tiếng reo hò kéo Ta tới sân tập. Chuyện gì đang xảy ra?\n\nTa thấy hai chiến binh mặc giáp đang tham gia một"
  court_ongoing.court_start_sparring.bad.0502.desc:0 "trận đấu vụng về. Ta cố không nhăn mặt khi một trong số họ vấp ngã sau một cú đánh quá mạnh."
  court_ongoing.court_start_sparring.good.0502.desc:0 "trận đấu sôi nổi. Cả hai chắc chắn đã được thử thách trên chiến trường."
  court_ongoing.court_start_sparring.great.0502.desc:0 "trận đấu tuyệt vời. Chưa từng thấy kỹ năng nào như vậy với [owner.Custom('SignatureWeaponArticle')] [owner.Custom('signature_weapon')]! Ta không thể rời mắt!"
  court_ongoing.court_start_sparring.end.0502.desc:0 "\n\nVới một đòn tấn công liều lĩnh cuối cùng, một trong những võ sĩ tước vũ khí của người kia. Thật ngạc nhiên, [owner.GetSheHe] quỳ xuống trước mặt ta và tháo mũ bảo hiểm của mình. Đó là [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\n"Con dành chiến thắng này cho người, [ROOT.Char.GetTitledFirstNameNoTooltip]," hắn nói một cách long trọng. "Mang lại vinh dự cho người là mong muốn duy nhất của con!""
  court_ongoing.0502.a:0 "Ngươi tâng bốc ta, [owner.GetLadyLord] của ta!"
  court_ongoing.0502.b.incest:0 "Gì cơ? Ngươi là #EMP [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('owner'))] của ta#!!"
  court_ongoing.0502.b:0 "Hãy từ bỏ việc ngu ngốc này #EMP ngay lập tức#!."
  court_ongoing.0502.a.tt:0 "[owner.GetShortUIName|U] sẽ cố gắng chinh phục trái tim Ta"


 #START EVENT: For Owner (target's reaction)
  court_ongoing.court_start_song.intro.0503.desc:1 "Ta đã chọn được một khúc tình ca cổ điển của [target.GetCulture.GetNameNoTooltip], rất phù hợp với [target.GetFirstName]! Ta luyện tập đi luyện tập lại — mọi thứ phải hoàn hảo!\n\nTa nhìn thấy [target.Custom('LoverPetName')] đi dạo trong khu vườn [target_location.GetNameNoTooltip], xung quanh là Bạn Bè [target.GetHerHis]. Tim Ta đập thình thịch, Ta quỳ xuống trước [target.GetHerHim] và hát."
  court_ongoing.court_start_song.success.0503.desc:1 "\n\nĐôi má của [target.GetFirstNamePossessiveNoTooltip] đỏ ửng như quả lựu, nhưng [target.GetSheHe] không ngắt lời ta. Tất cả những người bạn đồng hành của [target.GetHerHis] đều trông có vẻ hài lòng, hoặc ghen tị — chắc chắn là một dấu hiệu tốt!\n\n"Người có một giọng hát tuyệt vời, [ROOT.Char.Custom('FormOfAddressForLiege')]," [target.GetFirstNameNoTooltip] nói trước khi [target.GetSheHe] vội vã rời đi. Những người bạn của [target.GetHerHis] nhanh chóng đi theo. Ta đứng dậy trên đôi chân run rẩy, nhìn họ biến mất giữa những hàng rào, trái tim ta đập mạnh hơn bao giờ hết."
  court_ongoing.court_start_sneaky_love_letter.intro.0503.desc:0 "Tuyên bố tình yêu của Ta chỉ dành cho đôi mắt của [target.GetTitledFirstNamePossessive]. Không ai khác quan trọng! Ta trút hết tâm tư, trang này nối tiếp trang khác, cảm xúc dâng trào khi Ta cuối cùng cũng viết ra. Mực còn chưa khô, Ta ra đi đến [target.GetFirstNamePossessive] [target.Custom('GetChambersOrTent')].\n\nTa đặt nhẹ cuộn giấy lên gối [target.GetHerHis]. Liệu [target.GetSheHe] sẽ nằm mơ về Ta tối nay chăng?"
  court_ongoing.court_start_sneaky_love_letter.success.0503.desc:1 "\n\nSự chờ đợi thật khó chịu. Nghĩ đến bị từ chối làm Ta thấy buồn nôn! Khi [target.GetHerHis] trả lời đến, Ta run tay xé niêm phong.\n\n'Mặc dù Ta không thể đáp lại ngươi, [owner.Custom2('RelationToMeAddress', ROOT.Char)], Ta thật biết ơn những lời tử tế của ngươi. Trân trọng, [target.GetFirstNameNoTooltip].'"
  court_ongoing.court_start_poem_love_letter.intro.0503.desc:0 "Ngọn nến đang cháy yếu khi Ta hoàn thành bài thơ. Trước khi gửi đi, Ta đọc lại lần cuối.\n\n'[owner.Custom2('love_letter', SCOPE.sC('target'))]'"
  court_ongoing.court_start_sparring.same_locaton_intro.0503.desc:0 "Ta tuyển một trong những chiến binh kỳ cựu nhất và luyện tập với [sparring_soldier.GetHerHim] suốt ba ngày liên tiếp. Khi [sparring_soldier.GetSheHe] thấy Ta sẵn sàng, chúng Ta cùng đi đến sân chính.\n\nKhi bắt đầu đấu tập, một đám đông tụ tập, và tiếng reo hò thu hút không ai khác ngoài [target.Custom('RomanticComplimentAdjective')] [target.GetTitledFirstName].\n\nChiến binh chiến đấu dũng cảm, nhưng Ta hạ gục [sparring_soldier.GetHerHim] bằng một đòn cuối cùng hoàn hảo. Ta quỳ trước [target.GetFirstNameNoTooltip] và tuyên bố ý định cao thượng. 'Ta dâng chiến thắng này cho ngài, [target.GetTitledFirstNameNoTooltip]. Mang lại vinh quang cho ngài là mong muốn duy nhất của Ta!'"
  court_ongoing.court_start_sparring.other_locaton_intro.0503.desc:2 "Ta tuyển một trong những chiến binh kỳ cựu nhất và đi tới [target_location.GetNameNoTooltip]. Chúng Ta luyện tập sau mỗi chuyến cưỡi trong ngày.\n\nKhi đến nơi, chúng Ta bắt đầu đấu tập ở sân chính. Một đám đông tụ tập, và tiếng reo hò thu hút không ai khác ngoài [target.Custom('RomanticComplimentAdjective')] [target.GetTitledFirstName].\n\nChiến binh chiến đấu dũng cảm, nhưng Ta hạ gục [sparring_soldier.GetHerHim] bằng một đòn cuối cùng hoàn hảo. Ta quỳ trước [target.GetFirstNameNoTooltip] và tuyên bố ý định cao thượng. 'Ta dâng chiến thắng này cho ngài, [target.Custom2('RelationToMeAddress', ROOT.Char)]. Mang lại vinh quang cho ngài là mong muốn duy nhất của Ta!'"
  court_ongoing.court_start_sparring.success.0503.desc:0 "[ROOT.Char.Custom('LoverPetName')] của Ta câm lặng, nhưng rõ ràng là cảm thấy được tâng bốc. Nếu không, sao [target.GetSheHe] lại mỉm cười như vậy?"
  court_ongoing.public_sodomy_rejection.0503.desc:1 "Phản ứng của [target.GetFirstNamePossessiveNoTooltip] không như Ta mong. 'Ngươi điên sao, [ROOT.Char.Custom2('RelationToMeAddress', target)]?! Ngươi đang gợi ý điều gì?'"
  court_ongoing.public_incest_rejection.0503.desc:0 "Phản ứng của [target.GetFirstNamePossessiveNoTooltip] không như Ta mong. 'Ngươi đang gợi ý gì? Ta là #EMP [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))]# của ngươi!!'"
  court_ongoing.public_regular_rejection.0503.desc:1 "Phản ứng của [target.GetFirstNamePossessiveNoTooltip] không như Ta mong. 'Đừng làm xấu hổ hơn nữa, [ROOT.Char.Custom2('RelationToMeAddress', target)]. Ta thà ăn chính [target.Custom('GetClothingArticle')] của mình còn hơn phải chịu thêm một phút trong sự hiện diện của ngươi!'"
  court_ongoing.written_sodomy_rejection.0503.desc:0 "\n\nPhản hồi của [target.GetFirstNamePossessiveNoTooltip] nhanh chóng và rõ ràng. 'Ngươi điên sao? Ngươi có biết lời ngươi nguy hiểm đến mức nào nếu rơi vào tay kẻ khác không? Ta cầu xin — hãy từ bỏ việc ngu ngốc này ngay lập tức!'"
  court_ongoing.written_incest_rejection.0503.desc:0 "\n\nPhản hồi của [target.GetFirstNamePossessiveNoTooltip] nhanh chóng và rõ ràng. 'Ngươi luôn kỳ quặc, nhưng chuyện này? Một tuyên bố tình cảm với chính #EMP [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))]# của ngươi?! Nghĩ đến chuyện chúng ta bên nhau thôi cũng khiến ta buồn nôn!'"
  court_ongoing.written_regular_rejection.0503.desc:0 "\n\nPhản hồi của [target.GetFirstNamePossessiveNoTooltip] nhanh chóng và rõ ràng. 'Ta thật biết ơn bức thư của ngươi. Nó khiến ta cười sặc sụa! Thật nực cười khi trái tim ta lại khao khát #EMP ngươi#!!'"
  court_ongoing.0503.a:0 "[target.GetFirstNameNoTooltip] sẽ không thể chống lại sự quyến rũ của ta lâu đâu!"
  court_ongoing.0503.a.tt:0 "Kế hoạch chinh phục [target.GetShortUIName] tiếp tục"
  court_ongoing.0503.b:0 "Ta tưởng chúng ta sinh ra để thuộc về nhau..."


 #Someone farted! by Mathilda Bjarnehed
  court_ongoing.1000.t:1 "$court_event_title$ Một Mùi Khó Chịu"
  court_ongoing.1000.desc:1 "Ta có được lời mời dự tiệc tại [location.GetNameNoTooltip], và một chỗ ngồi gần [target.GetFirstName]. Dù cố gắng thế nào, Ta vẫn không thể bắt chuyện. Có lẽ [target.GetSheHe|U] đã câm lặng trước cường độ tình cảm của Ta.\n\nĐột nhiên, một tiếng xì hơi to nhất Ta từng nghe vang lên từ bàn. Một vài khách nhìn [target.GetFirstNameNoTooltip]. Ta phải cứu [target.GetHerHim]!"
  court_ongoing.1000.a:0 "Là Ta! Ta xì hơi!"
  court_ongoing.1000.a.success:0 "[target.GetFirstNameNoTooltip] thở phào và biết ơn"
  court_ongoing.1000.a.failure:0 "[target.GetFirstNameNoTooltip] không phải là người xì hơi"
  court_ongoing.1000.b:0 "[scapegoat.GetTitledFirstNameNoTooltip], đồ [scapegoat.Custom2('InsultNoun', ROOT.Char)] hôi hám!"
  court_ongoing.1000.b.rl:0 "Ta cố đổ lỗi cho [scapegoat.GetTitledFirstNameNoTooltip]"
  court_ongoing.1000.b.failure:0 "[target.GetFirstNameNoTooltip] thương hại [scapegoat.GetTitledFirstNameNoTooltip]"
  court_ongoing.1000.b.tt:0 "Kết quả phụ thuộc vào mức độ đồng cảm của [target.GetFirstNameNoTooltip]"
  court_ongoing.1000.c:0 "Có lẽ Ta nên im lặng..."

 #Defend their honor through duel or diplomacy, by Mathilda Bjarnehed
  court_ongoing.1010.t:1 "$court_event_title$ Danh dự của [target.GetLadyLord|U]"
  court_ongoing.1010.desc:1 ""Lạy [insulter.GetFaith.HighGodName], [target.GetTitledFirstName] là một [target.Custom2('InsultNoun', SCOPE.sC('insulter'))] không thể chịu nổi! Các ngươi có thấy cách [target.GetSheHe] [target.Custom('quirk_neg_present')] không? Nực cười!"\n\n[insulter.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ngửa đầu ra sau với một tiếng cười độc ác.\n\n[target.GetFirstNameNoTooltip] vẫn đang trò chuyện với những người bạn của mình, nhưng ta có thể nói rằng [target.GetSheHe] đã nghe thấy [insulter.GetHerHim]. Ta ghét nhìn thấy [target.GetHerHim] bị tổn thương."
  court_ongoing.1010.a:0 "Lời dối trá! Rút gươm đi, [insulter.Custom2('InsultNoun', ROOT.Char)]!"
  court_ongoing.1010.b:0 "Ngươi nên xin lỗi [target.GetLadyLord]."
  court_ongoing.1010.c:0 "Ôi, [target.GetFirstNameNoTooltip]. [insulter.GetSheHe|U] hoàn toàn sai!"

  court_ongoing.1010.a.success:0 "Ngươi thắng [insulter.GetFirstNameNoTooltip] trong đấu kiếm"
  court_ongoing.1010.a.failure:0 "Ngươi bị [insulter.GetFirstNameNoTooltip] đánh bại"
  court_ongoing.1010.b.success:0 "Ngươi thuyết phục [insulter.GetFirstNameNoTooltip] xin lỗi"
  court_ongoing.1010.b.failure:0 "[insulter.GetFirstNameNoTooltip] từ chối nghe"

  court_ongoing.1011.desc:0 "[insulter.GetTitledFirstName] rút kiếm với một nụ cười ngạo nghễ. Ồ, ta sẽ thích thú thế nào khi xóa bỏ cái vẻ kiêu ngạo đó khỏi khuôn mặt [insulter.GetHerHis]!\n\nKhi ta làm xong với [insulter.GetHerHim], sự sỉ nhục của [insulter.GetTitledFirstNamePossessiveNoTooltip] là hoàn toàn. Bị bầm tím và đỏ mặt, [insulter.GetSheHe] thốt ra một lời xin lỗi và khập khiễng rời đi để liếm vết thương của mình.\n\n[target.GetTitledFirstName], ngược lại, đang rạng rỡ như mặt trời. "Người đúng là một anh hùng thực thụ, [ROOT.Char.GetTitledFirstNameNoTooltip]! Người có lòng biết ơn vĩnh viễn của con!""
  court_ongoing.1011.a:0 "Đó là vinh dự của ta, [target.GetLadyLord] [target.GetFirstNameNoTooltip]."

 #Fetch gift, by Mathilda Bjarnehed
  court_ongoing.1021.t:1 "Bằng chứng của Lòng trung thành"
  court_ongoing.1021.desc:0 ""[target.GetLadyLord|U] [target.GetFirstName]! [target.Custom('RomanticComplimentAdjective')] [target.Custom('RomanticComplimentNoun')] của con!"\n\n[owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đang quỳ trong bụi trước mặt ta, tay phải đặt lên trái tim mình. "Mong muốn duy nhất của con là mang lại vinh dự và hạnh phúc cho người. Xin hãy nói cho con biết — con có thể chứng minh tình yêu của mình dành cho người như thế nào?""
  court_ongoing.1021.a:0 "Giết một con sói và mang da về cho ta."
  court_ongoing.1021.wolf_pelt.success:0 "[owner.GetShortUINameNoTooltip] mang về da sói cho Ngài"
  court_ongoing.1021.wolf_pelt.failure:0 "[owner.GetShortUINameNoTooltip] thất bại trong việc giết sói"
  court_ongoing.1021.b:0 "Ta muốn một thú cưng có lông."
  court_ongoing.1021.cat_pet.success:0 "[owner.GetShortUINameNoTooltip] tặng Ngài một con mèo"
  court_ongoing.1021.dog_pet.success:0 "[owner.GetShortUINameNoTooltip] tặng Ngài một con chó"
  court_ongoing.1021.eagle_pet.success: "[owner.GetShortUINameNoTooltip] tặng Ngài một chú chim ưng non"
  court_ongoing.1021.pet.failure:1 "[owner.GetShortUINameNoTooltip] không tặng Ngài thú cưng"
  court_ongoing.1021.c:0 "Dây chuyền của [necklace_owner.GetTitledFirstNamePossessive] trông thật đẹp..."
  court_ongoing.1021.necklace.success:0 "[owner.GetShortUINameNoTooltip] tặng Ngài dây chuyền"
  court_ongoing.1021.necklace.failure:0 "[owner.GetShortUINameNoTooltip] từ chối tặng Ngài dây chuyền"
