l_english:
 #Unused texts for secrecy event
  court_outcome.0001.t:1 "$court_event_title$ Ngay hay Không Bao Giờ"
  court_outcome.0001.desc:0 "Ôi, [target.GetFirstName], [target.Custom('LoverPetName')] của ta! Ta khao khát vòng tay ngươi! Ta nghĩ mình sẽ chết nếu thiếu đi vị ngọt của những nụ hôn của ngươi!\n\nDù tình cảm của ta thuần khiết, nhưng có quá nhiều người sẽ phán xét chúng ta. Ta nên đến bên [target.GetHerHim] chăng? Hay phải giữ khoảng cách?"
  court_outcome.0001.b:0 "Ta không thể mạo hiểm đến an toàn của [target.GetHerHis]..."
  court_outcome.0001.a:0 "Không gì có thể ngăn cản chúng ta!"

 #Player target picks outcome
  court_outcome.0003.t:0 "Có Phải Là Tình Yêu?"
  court_outcome.0003.success.desc:0 "Ta hầu như chẳng thể nhớ nổi cuộc sống của mình ra sao trước khi [owner.GetFirstName] bày tỏ tình cảm của [owner.GetHerHis] dành cho ta. Những tháng ngày ấy nhạt nhẽo và u buồn biết bao... Nhưng với [owner.GetHerHim] kề bên, dường như mọi thứ đều trở nên khả dĩ!\n\nTa ước mong đôi ta có thể mãi mãi như thế này, nhưng thẳm sâu trong lòng, ta biết mình phải đưa ra lựa chọn. Liệu ta có đủ dũng khí để phó mặc cho những xúc cảm này, hay ta phải khép chặt trái tim mình trước [owner.GetFirstNameNoTooltip] mãi mãi?"
  court_outcome.0003.failure.desc:0 "Ta hầu như chẳng thể nhớ nổi cuộc sống của mình ra sao trước khi [owner.GetFirstName] bày tỏ tình yêu của [owner.GetHerHis] dành cho ta. Ta thấy vinh hạnh, nhưng cũng thật choáng ngợp trước những sự quan tâm của [owner.GetHerHis]. Ta nhận ra mình chỉ đang khao khát chút bình yên và tĩnh lặng.\n\nTuy nhiên, ta không khỏi bận lòng. Liệu ta có đang vứt bỏ viễn cảnh duy nhất về một tình yêu đích thực hay không? Điều đó hẳn không thể nào đúng được! Có phải vậy không...?"
  court_outcome.0003.a:0 "Ta là của ngươi, [owner.GetFirstNameNoTooltip]. Ngay bây giờ và mãi mãi!"
  court_outcome.0003.a.tt:0 "[owner.GetShortUIName|U] có thể trở thành Tri Kỷ của ta"
  court_outcome.0003.b.success:0 "Một nụ hôn tình yêu duy nhất là tất cả ta có thể trao."
  court_outcome.0003.b.failure:0 "[owner.GetSheHe|U] xứng đáng ít nhất một nụ hôn, vì lòng tận tụy của [owner.GetHerHis]."
  court_outcome.0003.b.tt:0 "[owner.GetShortUIName|U] sẽ #bold không#! trở thành Tri Kỷ của ta"
  court_outcome.0003.c:0 "Cơn say mê này kết thúc hôm nay."


  court_outcome.kiss.tt:0 "[target.GetShortUIName|U] và ta trao nhau một nụ hôn"
 
 
 #Generic keys
  court_outcome.0001.a.tt:0 "Ta tiến hành nỗ lực tán tỉnh [target.GetTitledFirstName]"

 ### WILD HUNT ###
  court_outcome.1000.t:1 "$court_event_title$ Cuộc Săn Hoang Dã"
  court_outcome.1000.i_invite.desc:1 "Khi [target.GetTitledFirstName] đề xuất một cuộc săn, ta không ngần ngại tổ chức ngay. Ta sẽ làm mọi thứ chỉ để được nhìn thấy [target.Custom('LoverPetName')] của mình một lần!"
  court_outcome.1000.own_invite.desc:0 "Khi [target.GetFirstName] mời ta tham gia săn, ta không chút do dự chấp nhận. Ta không thể tưởng tượng cảnh tượng nào đẹp hơn dáng vẻ tuyệt mỹ của [target.GetHerHis] trên lưng chiến mã!"
  court_outcome.1000.liege_invite.desc:1 "Khi [target_host.Custom2('NamePossessiveCharacterIntroduction', target)] mời ta tham gia săn, ta không ngần ngại chấp nhận. Ta sẽ làm mọi thứ chỉ để được nhìn thấy [target.Custom('LoverPetName')] của mình một lần!"
  court_outcome.1000.end.desc:0 "\n\nTa len lỏi qua bụi rậm, trang bị đi theo sau và chó săn phía trước. Có vẻ nó vừa phát hiện dấu vết! Rồi bất ngờ, sự tập trung của ta bị phá vỡ bởi một tiếng hét của [target.GetWomanMan]!"
  court_outcome.1000.a:0 ""Ta đến cứu ngươi đây, tình yêu của ta!""
  court_outcome.1000.b:0 "Có lẽ nên phái trang bị đi thay..."
  court_outcome.1000.c:0 "Chắc chỉ là một con chim thôi."
  court_outcome.1000.b.failure:0 "[target.GetFirstNameNoTooltip] bị tấn công bởi một thú hoang"
  court_outcome.1000.b.success:0 "[target.GetFirstNameNoTooltip] không gặp nguy hiểm"


  court_outcome.1001.desc:1 "Chỉ trong vòng một khắc trôi qua mà ngỡ như cả một canh giờ, ta đã đến được khoảng đất trống. [target.GetFirstName] đang ngã gục trên mặt đất ngay trước mắt ta, tóc tai rũ rượi và tay không tấc sắt. Phía đối diện [target.GetHerHim], và đang chực chờ vồ lấy ngài, là một con [ROOT.Char.Custom('GetAnimalType')] khổng lồ!\n\nMũi tên của ta xé gió lao đi chuẩn xác, và con ác thú gục ngã xuống đất. Trong một khoảnh khắc, [target.GetFirstNameNoTooltip] chỉ biết trân trối nhìn, nhưng ngay sau đó, [target.GetSheHe] lảo đảo chạy về phía ta và ngã nhào, gục [target.GetHerselfHimself] vào vòng tay ta."
  court_outcome.1001.a:0 "Ta cần ngươi, tình yêu của ta, ngay tại đây và bây giờ!"
  court_outcome.1001.b:0 "Một nụ hôn ngọt ngào là phần thưởng duy nhất ta mong muốn."

  court_outcome.1002.desc:1 ""[target.GetFirstName]! Ta đến đây!" Ta lao xuyên qua tán lá rậm rạp tiến vào khoảng đất trống, tim đập thình thịch, mồ hôi tuôn rơi ướt đẫm khuôn mặt.\n\nNhưng cảnh tượng phơi bày trước mắt lại chẳng như ta lường trước. Có một con [ROOT.Char.Custom('GetAnimalType')] ở đó, đúng vậy — nhưng nó đang nằm bẹp dưới đất, với một mũi tên cắm ngập giữa hai mắt. [target.GetFirstNameNoTooltip] từ từ hạ cây cung của [target.GetHerHis] xuống khi [target.GetSheHe] quay lại nhìn ta.\n\n"Thế này là sao, [owner.GetTitledFirstNameNoTooltip]? Ngài nghĩ ta vô năng tới mức không thể tự bảo vệ mình ư?""
  court_outcome.1002.a:0 "Ta… ta bị lạc sao?"

  court_outcome.1005.desc:0 "Khi ta tiến đến gần hơn, tiếng la hét càng thêm dữ dội. Chắc chắn đó là [target.GetFirstName] [target.Custom('RomanticComplimentAdjective')] của ta — ta có thể nhận ra giọng nói của [target.GetHerHis] ở bất cứ nơi đâu!\n\nNhưng có điều gì đó #EMP kỳ lạ#! trong những tiếng hét của [target.GetHerHis]. Nghe không hẳn là [target.GetFirstNameNoTooltip] đang sợ hãi... Hoặc là [target.GetSheHe] đang đau đớn...\n\nTrái tim ta chùng xuống khi cuối cùng cũng nhìn thấy [target.GetHerHim]: trần truồng như ngày [target.GetSheHe] chào đời, đang quấn lấy nhau lăn lộn trên bãi cỏ cùng [targets_lover.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]."
  court_outcome.1005.a:0 "[target.GetSheHe|U] rõ ràng không còn chỗ trong trái tim [target.GetHerHis] cho ta."
  court_outcome.1005.b:1 "[targets_lover.GetFirstNameNoTooltip] sẽ phải ân hận vì ngày [targets_lover.GetSheHe] dám cản bước ta!"
  court_outcome.1005.c:0 "Ta sẽ cứu [target.GetHerHim] khỏi con thú đó!"
  court_outcome.1005.c.murder_undiscovered:0 "Mũi tên của ta trúng [targets_lover.GetFirstNameNoTooltip]"
  court_outcome.1005.c.murder_discovered:0 "Mũi tên của ta trúng [targets_lover.GetFirstNameNoTooltip] nhưng ta bị phát hiện"
  court_outcome.1005.c.murder_attempt:0 "Ta bắn hụt và bỏ chạy"
  court_outcome.1005.d:0 "Nếu ta không thể có [target.GetHerHim], không ai được phép có!"
  court_outcome.1005.d.murder_undiscovered:0 "Mũi tên của ta trúng [target.GetFirstNameNoTooltip]"
  court_outcome.1005.d.murder_discovered:0 "Mũi tên của ta trúng [target.GetFirstNameNoTooltip] nhưng ta bị phát hiện"

  court_outcome.1003.t:0 "Cuộc Săn Hoang Dã"
  court_outcome.1004.desc:1 "Ta đang cưỡi ngựa thì chiến mã bỗng ném mình ra khỏi đường mòn. Vụ ngã không tránh khỏi, khiến ta nghẹt thở. Khi ngẩng lên, ta đối mặt với một con [owner.Custom('GetAnimalType')]!\n\nTrước khi kịp hét lên, con thú ngã xuống, mũi tên cắm giữa hai mắt.\n\n"[target.GetFirstNameNoTooltip], [target.Custom('LoverPetName')] của ta! Ta tưởng đã mất ngươi!" Anh hùng của ta không ai khác chính là [owner.GetTitledFirstName]!"
  court_outcome.1003.b:0 "Chúng ta trao nhau một nụ hôn, ngọt như mật ong."


 ### INTRUDER ###

 # OWNER CHOICE
  court_outcome.1100.t:0 "$court_event_title$ Kẻ Xâm Nhập"
  court_outcome.1100.start.desc:0 "Mỗi khi nhắm mắt, ta lại thấy khuôn mặt của [target.GetTitledFirstNamePossessive]. Giấc ngủ không đến. Ta không thể chờ thêm giây nào — khoác bóng tối lên người, ta tiến tới"
  court_outcome.1100.targets_residence.desc:0 "[target.GetHerHis] [target.Custom('ResidenceBuilding')]."
  court_outcome.1100.my_residence.desc:0 "khu vườn phía ngoài phòng sinh hoạt của [target.GetHerHis]."
  court_outcome.1100.targets_host_residence.desc:0 "tòa [target_host.GetTitledFirstNamePossessive] [target.Custom('ResidenceBuilding')]."
  court_outcome.1100.end.desc:0 "\n\nCảnh tượng cửa sổ phòng của [target.GetFirstNamePossessiveNoTooltip] làm tim ta loạn nhịp. Gần mà xa!\n\nNhưng khoan — ai đó đang leo lên tháp? Hình dáng mờ ảo dừng lại bên cửa sổ [target.GetFirstNamePossessiveNoTooltip] và mở chốt cửa..."
  court_outcome.1100.a:0 "[target.Custom('LoverPetName')] của ta đang gặp nguy hiểm — ta phải cứu [target.GetHerHim]!"
  court_outcome.1100.b:0 ""Người canh gác! #EMP Người canh gác!#! Có kẻ xâm nhập trong tháp!"
  court_outcome.1100.b.failure:0 "[target.GetShortUIName|U] bị thương bởi kẻ xâm nhập"
  court_outcome.1100.b.success:0 "[target.GetShortUIName|U] thoát nạn an toàn"
  court_outcome.1100.c:0 "Ta không đến đây để vật lộn với kẻ trộm."

 # OWNER SUCCESS: You save target from the burglar/comfort target!
  court_outcome.1101.start.desc:0 "Tiếng động từ cuộc vật lộn trên cao là động lực lớn nhất ta từng biết. Không quan tâm đến tính mạng hay thân thể, ta trèo qua cửa sổ của [target.GetTitledFirstNamePossessive].\n\n"
  court_outcome.1101.owner_fights.desc:0 "Ta như lao xuống một hồ băng. [target.GetFirstNameNoTooltip] nằm dưới sàn, kẻ xâm nhập đẩy [target.GetHerHim] xuống, một lưỡi dao sáng loáng giữa họ. Với một tiếng gầm, ta túm cổ tội phạm và quăng [ROOT.Char.GetHerHim] vào tường. Phần còn lại chỉ là mờ mịt.\n\nKhi nguy hiểm qua đi, ta quay về phía [target.GetHerHim]."
  court_outcome.1101.target_fights.desc:0 "Cảnh tượng hiện ra trước mắt ta không như những gì ta lường trước. Đồ đạc ngổn ngang, rèm cửa rách nát, và [target.GetFirstName] đang đứng sừng sững bên một cái xác bất động với thanh dao găm đẫm máu trong tay [target.GetHerHis].\n\n"
  court_outcome.1101.end.desc:0 ""[target.GetFirstNameNoTooltip], ngài không sao chứ?" Ta thận trọng hỏi. Như thể lời nói của ta là một câu thần chú, [target.GetSheHe] bừng tỉnh, và sà [target.GetHerselfHimself] vào vòng tay ta. "Tạ ơn [target.GetFaith.HighGodName] vì ngài đã ở đây, [ROOT.Char.GetFirstNameNoTooltip]!""
  court_outcome.1101.a:0 "Ta sẽ không bao giờ để ngươi gặp nguy hiểm nữa!"

 # OWNER FAILURE: Target was fine without your help/is scared 
  court_outcome.1102.end.desc:0 ""Ngài làm gì ở đây?!" [target.GetSheHe] hỏi, giọng [target.GetHerHis] run rẩy. Ta giơ hai tay lên để tỏ thiện ý, nhưng [target.GetSheHe] lại rút thanh dao găm của [target.GetHerHis] ra. "Đừng bước tới gần hơn nữa! Đi ngay đi, nếu không ta #EMP sẽ#! đả thương ngài đấy!""
  court_outcome.1102.a:0 "Ta chỉ muốn giúp thôi!"

 # OWNER FAILURE: Target has another lover...
  court_outcome.1103.desc:0 "Tiếng động từ cuộc vật lộn trên cao là động lực lớn nhất ta từng biết. Trước khi kịp nghĩ ra kế hoạch, ta tới cửa sổ. Ta trèo lên — nhưng cảnh tượng trước mắt không như ta tưởng.\n\n[target.GetTitledFirstName] không hề… #EMP vật lộn#!. Không, [target.GetSheHe] dường như đang tận hưởng [target.GetHerselfHimself] — cùng với [targets_lover.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]."

 # TARGET SUCCES: is informed about outcome
  court_outcome.1105.t:0 "Kẻ Xâm Nhập"
  court_outcome.1105.start.desc:0 "#EMP Rầm!#! Ta… ở đâu đây? Chuyện gì xảy ra vậy? Ta nhìn vào bóng tối, mắt dần quen. #EMP [ROOT.Char.GetFaith.HighGodName].#! Có ai đó bên cửa sổ phòng ta.\n\n"
  court_outcome.1105.owner_fights.desc:0 "Ta vội nhảy khỏi giường và chạy ra cửa, nhưng kẻ xâm nhập nhanh hơn. [owner.GetSheHe|U] túm tay ta kéo, và ta ngã. Trước khi kịp hét, một bàn tay bịt miệng ta.\n\n""Nghe kỹ đây, [ROOT.Char.GetTitleAsNameNoTooltip]. Nếu làm theo ta nói, sẽ không ai—"" Lời của [owner.GetHerHis|U] biến thành tiếng nghẹn khi dao đâm sâu vào cổ [owner.GetHerHis].\n\n""[target.GetFirstNameNoTooltip], ngươi ổn chứ?" Ta nhận ra giọng đó ở bất cứ đâu. Vị cứu tinh không ai khác chính là [owner.GetTitledFirstName]!"
  court_outcome.1105.target_fights.desc:0 "Ta bật dậy khỏi giường, vớ lấy thanh dao găm trên bàn ngủ. Tên đột nhập tóm lấy cánh tay ta, giật mạnh, và ta xoay người lại — đâm ngập lưỡi dao vào bụng [owner.GetHerHis]. [owner.GetSheHe|U] nhìn ta đăm đăm trong một khoảnh khắc tưởng chừng vô tận, đôi môi [owner.GetHerHis] mấp máy không thành lời. Sau đó [owner.GetSheHe] gục ngã xuống mặt đất.\n\n"[target.GetFirstNameNoTooltip], ngài có sao không?" Bên bậu cửa sổ không ai khác chính là [owner.GetTitledFirstName], tay lăm lăm vũ khí, sẵn sàng bảo vệ ta. Ta gieo mình vào vòng tay [owner.GetHerHis] và [owner.GetSheHe] ôm chặt lấy ta."
  court_outcome.1105.a:0 "Ôi, tình yêu của ta! Đừng bao giờ để ta rời khỏi tầm mắt ngươi nữa!"
