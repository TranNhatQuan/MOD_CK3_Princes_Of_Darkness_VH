l_english:
  befriend_ongoing.0901.t:0 "Kẻ chi kỉ: Lẽ Ra Có Thể"
  befriend_ongoing.0901.desc:0 "Ta vừa nhận được tin sốc. [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] đã qua đời.\n\nĐúng là định mệnh, Ta sẽ không bao giờ được hưởng tình  Bạn của[target.GetHerHis]."
  befriend_ongoing.0901.a:0 "Thế giới thật nghiệt ngã và bất ngờ."

  befriend_ongoing.0902.t:0 "Kẻ chi kỉ: Khán Giả Bị Giam"
  befriend_ongoing.0902.t.other:0 "Kẻ chi kỉ: Bị Khóa Lại"
  befriend_ongoing.0902.desc:0 "Ta đã giam giữ [target.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\nNgay cả khi [target.GetSheHe] bây giờ có tất cả thời gian trên thế giới để dành cho ta, khi [target.GetSheHe] vẫn còn trong cảnh giam cầm, [target.GetSheHe] khó có khả năng tiếp nhận những nỗ lực giành lấy tình bạn [target.GetHerHis] của ta."
  befriend_ongoing.0902.desc.other:0 "[target.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã bị giam bởi [imprisoner.Custom2('MyCharacterIntroduction', ROOT.Char)]! Chừng nào [target.GetSheHe] còn bị giam, Ta sẽ không thể giành được tình  Bạn của[target.GetHerHis]."
  befriend_ongoing.0902.a:0 "Tại sao lại không chứ!? Ta là người giam giữ tuyệt vời!"
  befriend_ongoing.0902.a.other:0 "Thật tiếc."

  befriend_ongoing.0903.t:0 "Kẻ chi kỉ: Chiến Tranh và Tình bạn"
  befriend_ongoing.0903.desc:0 "Khi các vương quốc của chúng Ta đối đầu trong chiến trận, giấc mơ về lòng khoan dung và Tình bạn với [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] dường như bất khả thi, ít nhất là hiện tại."
  befriend_ongoing.0903.a:0 "Hy vọng sẽ có những thời khắc tốt đẹp hơn."
  befriend_ongoing.0903.a.tt:0 "Đã kết thúc Kế Hoạch kết bạn với [target.GetTitledFirstNameNoTooltip]"

  befriend_ongoing.1001.t:0 "Kẻ chi kỉ: Kính Trọng Trong Ngưỡng Mộ"
  befriend_ongoing.1001.desc.startnormal:0 "Xét đến những việc Ta đã làm trong đời, thật tự nhiên khi người khác nên tôn trọng Ta."
  befriend_ongoing.1001.desc.starthumble:0 "Dù hiếm khi đề cập, Ta có vài thành tựu mà Ta tự hào."
  befriend_ongoing.1001.desc.end:0 "Ta tin rằng [target.GetTitledFirstName] cũng đã đạt được vài điều khiến [target.GetHerHim] tự hào.\n\nCó lẽ Ta nên đặt làm một bài thơ nhỏ so sánh thành tựu của chúng Ta, để chứng minh rằng chúng Ta đều cùng một chí hướng."
  befriend_ongoing.1001.a:0 "[target.GetSheHe|U] sẽ rất ấn tượng với thành tích của Ta!"
  befriend_ongoing.1001.b:0 "Tập trung vào thành tựu của [target.GetFirstNamePossessiveNoTooltip]."
  befriend_ongoing.1001.c:0 "Ta sẽ để #EMP tất cả mọi người#! biết về vĩ đại của Ta!"
 
  befriend_ongoing.1002.t:0 "Kẻ chi kỉ: Cử Chỉ Hào Phóng"
  befriend_ongoing.1002.desc.start:0 "Ta có thể giúp việc kết bạn với [target.GetTitledFirstName] bằng cách tặng [target.GetHerHim] một món quà.\n\n"
  befriend_ongoing.1002.desc.greedy:0 "Ai mà chả thích quà!"
  befriend_ongoing.1002.desc.malicious:0 "Người ta dễ dàng bị thao túng bởi những thứ bóng bẩy..."
  befriend_ongoing.1002.desc.benevolent:0 "Tìm món quà hoàn hảo có thể thật sự cho thấy Ngài quan tâm người đó đến mức nào."
  befriend_ongoing.1002.desc.generic:0 "\n\nNếu nó giúp Ta tiến gần hơn tới mục tiêu, thì thật đáng đồng tiền."
  befriend_ongoing.1002.d:0 "Ta sẽ tìm thứ gì đó thật xa xỉ!"
  befriend_ongoing.1002.a:0 "Không phải lúc để tiết kiệm."
  befriend_ongoing.1002.b:0 "Quan trọng là tấm lòng."
  befriend_ongoing.1002.c:0 "Không, Ta không muốn tỏ ra quá vồ vập."

  befriend_ongoing.1003.t:0 "Kẻ chi kỉ: Kẻ Thù Của Kẻ Thù Ta"
  befriend_ongoing.1003.desc:0 "Một điều mà [target.GetTitledFirstName] và Ta cùng chia sẻ là sự căm ghét [rival.GetTitledFirstName].\n\nSẽ là thông điệp mạnh mẽ nếu làm một tượng kẻ thù của Ta, treo lên tường vào lần [target.GetFirstNameNoTooltip] trở lại [barony.GetTitledFirstNameNoTier]."
  befriend_ongoing.1003.a:0 "Và nó sẽ bốc cháy!"
  befriend_ongoing.1003.b:0 "Ta không cần thêm xung đột với [rival.GetFirstNameNoTooltip]."

  befriend_ongoing.1004.t:0 "Kẻ Thù Của Kẻ Thù Ta"
  befriend_ongoing.1004.desc:1 "Trong chuyến thăm mới nhất của ta đến [barony.GetNameNoTooltip] của [owner.GetTitledFirstNamePossessive], một cảnh tượng khá bất ngờ hiện ra khi ta đến gần [barony.Custom('BaronyTownType')]. Treo trên các bức tường là một hình nộm mà ta nhận ra ngay lập tức là kẻ thù chung lâu năm của chúng ta, [rival.GetTitledFirstName]!\n\n[owner.GetFirstNameNoTooltip] hét lên chào đón ta khi [owner.GetSheHe] đổ hắc ín nóng xuống "[rival.GetFirstNameNoTooltip].""
  befriend_ongoing.1004.a:0 "Ta vui khi thấy chúng ta cùng quan điểm về [rival.GetHerHim]!"

  befriend_ongoing.1005.t:0 " Bạn củaKẻ Thù Ta"
  befriend_ongoing.1005.desc:1 "Sứ giả ngập ngừng khi kể tin đồn.\n\n\"Dường như kẻ thù của ngài, [owner.GetTitledFirstName], và [target.GetTitledFirstName], đã đốt tượng ngài treo trên tường [barony.GetNameNoTooltip], đồng thời chế giễu tên ngài.\"\n\nCùng nhau, họ tệ gấp mười lần khi ở một mình."
  befriend_ongoing.1005.a:0 "Ta biết Ta có lý do chính đáng để ghét họ."
 
  befriend_ongoing.2001.t:0 "Kẻ chi kỉ: Sự Ấm Áp Của Thân Thiện"
  befriend_ongoing.2001.desc:0 "Ta nghĩ Ta sẽ phải cố gắng để [target.GetTitledFirstName] thích Ta, nhưng [target.GetSheHe] lại là người thân thiện nhất Ta từng biết!\n\n[target.GetFirstNameNoTooltip] nói với Ta rằng luôn có chỗ bên lò sưởi của [target.GetHerHis] cho những người quen mới."
  befriend_ongoing.2001.a:0 "Tuyệt. Ta sẽ để [target.GetHerHim] đến gần Ta."
  befriend_ongoing.2001.b:0 "Ta sẽ không từ chối lời mời như vậy!"
 
  befriend_ongoing.3001.t:0 "Kẻ chi kỉ: Mắt Xích Trong Chuỗi"
  befriend_ongoing.3001.desc:0 "[befriend_envoy.GetTitledFirstName], người đang hỗ trợ ta trong nỗ lực tiếp cận [target.GetTitledFirstName], đã đề nghị đóng vai trò là sứ giả giữa chúng ta. [befriend_envoy.GetSheHe|U] tin rằng mình có thể trình bày ta dưới một ánh sáng tuyệt vời."
  befriend_ongoing.3001.a:0 "[befriend_envoy.GetSheHe|U] nên tiếp cận [target.GetFirstNameNoTooltip] trực tiếp."
  befriend_ongoing.3001.b:0 "Quá nhiều rủi ro để dựa vào [befriend_envoy.GetFirstNameNoTooltip]."
  befriend_ongoing.3001.tt:0 "#F [befriend_envoy.GetFirstName] sẽ tìm cơ hội gặp [target.GetFirstName]#!"
 
  befriend_ongoing.3002.t:0 "Một Thỏa Thuận Khác Thường"
  befriend_ongoing.3002.desc:0 "Mặc dù không có gì lạ khi [befriend_envoy.GetTitledFirstName] — [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('befriend_envoy') )] của ta — yêu cầu được yết kiến ta, lý do [befriend_envoy.GetHerHis] lần này thực sự kỳ lạ. [befriend_envoy.GetSheHe|U] đã tuyên bố bản thân là một sứ giả hữu nghị thay mặt cho [owner.GetTitledFirstName]!"
  befriend_ongoing.3002.a:0 "Lạ thật, nhưng Ta chào đón [befriend_envoy.GetHerHim] nói về [owner.GetFirstNameNoTooltip]."
  befriend_ongoing.3002.b:0 "Không ai trong hạ thần của Ta sẽ làm sứ giả cho người khác!"

  befriend_ongoing.3003.t:0 "Kẻ chi kỉ: Báo Cáo Từ Sứ Giả"
  befriend_ongoing.3003.accepted_envoy:0 "[befriend_envoy.GetTitledFirstName] đã mang đến cho ta tin tốt. [target.GetTitledFirstName] đã nồng nhiệt đón tiếp [befriend_envoy.GetHerHim] như một "sứ giả" thay mặt cho tình bạn của ta."
  befriend_ongoing.3003.dismissed_envoy:0 "Ta biết mình đã vượt ranh giới khi sử dụng [target.GetTitledFirstNamePossessive] [scheme.GetTargetCharacter.Custom2('RelationToMe', SCOPE.sC('befriend_envoy') )], nhưng Ta hy vọng [target.GetSheHe] thấy thiện chí. Sai lầm quá. Ta không bao giờ nên đồng ý kế hoạch của [befriend_envoy.GetTitledFirstNamePossessive]..."
  befriend_ongoing.3003.a:0 "Vì Tình bạn mới nảy nở của chúng ta!"
  befriend_ongoing.3003.b:0 "Ta sẽ phải thận trọng hơn."

  befriend_ongoing.3007.t:0 "Kẻ chi kỉ: Phán Quyết Từ [agent_speaking_highly.GetFaith.DivineRealm|U]"
  befriend_ongoing.3007.desc.conviction:0 "Đó là một phép màu! [agent_speaking_highly.GetTitledFirstName] đã có một thị kiến từ [agent_speaking_highly.GetFaith.HighGodName]. [agent_speaking_highly.GetSheHe|U] đảm bảo với ta rằng [target.GetTitledFirstName] và ta được định sẵn bởi thần linh là những người bạn!"
  befriend_ongoing.3007.desc.doubt:0 "[agent_speaking_highly.GetTitledFirstName] đã kể cho ta nghe về một thị kiến từ [agent_speaking_highly.GetFaith.HighGodName]. Rõ ràng, [target.GetTitledFirstName] và ta được định sẵn bởi thần linh là những người bạn. Thật thuận lợi."
  befriend_ongoing.3007.a:0 "Chúng ta sẽ kể với [target.GetFirstNameNoTooltip] về thị kiến này."
  befriend_ongoing.3007.b:0 "[agent_speaking_highly.GetFirstNameNoTooltip], hãy cầu nguyện cùng nhau trong lòng biết ơn."
 
  befriend_ongoing.3009.t:0 "Kẻ chi kỉ: Một Lời Tốt"
  befriend_ongoing.3009.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] để ý nỗ lực gây ấn tượng với [target.GetTitledFirstName], và giờ [spouse.GetSheHe] đến với Ta với một gợi ý.\n\n\"Ta tin lời Ta có ảnh hưởng lớn với [spouse.Custom2('RelationToMe', SCOPE.sC('target'))]. Ta có thể cho [target.GetHerHim] biết Ta nghĩ Ngài tuyệt vời như thế nào.\""
  befriend_ongoing.3009.a:0 "À, đừng giữ gì cả, người thân của Ta."
  befriend_ongoing.3009.a.success:0 "Lời của [spouse.GetFirstNamePossessiveNoTooltip] làm [target.GetFirstNameNoTooltip] xiêu lòng"
  befriend_ongoing.3009.a.failure:0 "[target.GetFirstNameNoTooltip] vẫn không bị ấn tượng"
  befriend_ongoing.3009.b:0 "Không, Ta sẽ tự xử lý."
  befriend_ongoing.3009.b.tt:0 "Ta không thể dựa vào người khác để kết bạn thay mình."
 
  befriend_ongoing.3010.t:0 "Một Lời Tốt"
  befriend_ongoing.3010.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] đã kể cho Ta nhiều về [spouse.GetHerHis] [spouse.Custom2('RelationToMe', SCOPE.sC('owner'))] gần đây.\n\nPhải thừa nhận, [spouse.GetSheHe] khiến [owner.GetTitledFirstName] nghe như một người xứng đáng được tôn trọng."
  befriend_ongoing.3010.a:0 "Có lẽ Ta nên hiểu rõ hơn về [owner.GetHerHim]."

  befriend_ongoing.3011.desc:0 ""[target.GetTitledFirstName] dường như chắc chắn quan tâm hơn đến việc làm quen với người bây giờ," [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] của ta nói với ta. Có vẻ như kế hoạch [spouse.GetHerHis] của người ấy đã diễn ra hoàn hảo!"
  befriend_ongoing.3011.a:0 "Ta luôn có thể tin cậy vào Ngài, [spouse.GetFirstNameNoTooltip]."

  befriend_ongoing.3012.desc:0 "\"Ta rất tiếc phải nói rằng dù Ta đã nỗ lực, [spouse.Custom2('RelationToMe', SCOPE.sC('target'))] của Ta vẫn không ấn tượng với Ngài,\" [spouse.GetTitledFirstName] nói với Ta. Có vẻ kế hoạch của [spouse.GetHerHis] thực ra không mấy tốt."
  befriend_ongoing.3012.a:0 "Tại sao Ta lại tin người khác chứ."

  befriend_ongoing.3014.t:0 "Danh Tiếng Không Vui"
  befriend_ongoing.3014.desc:0 "Ta thấy [owner.GetTitledFirstName] đặc biệt thân thiện với ta gần đây. Tuy nhiên, khi ta kể với [owner.GetHerHis] [owner.Custom2('RelationToMe', SCOPE.sC('spouse'))], [spouse.GetFirstName] — [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] của ta, [spouse.GetSheHe] chế nhạo.\n\n"[owner.GetFirstNameNoTooltip] không xứng đáng với tình bạn của người. Để con kể cho người nghe hắn thực sự như thế nào...""
  befriend_ongoing.3014.a:0 "Ai hiểu rõ hơn cơ chứ?"

  befriend_ongoing.3015.t:0 "Kẻ chi kỉ: Lời Vu Khống!"
  befriend_ongoing.3015.desc:0 "[target.GetTitledFirstName] đã trở nên lạnh nhạt hơn một chút với ta, bất chấp mọi nỗ lực. Có vẻ như [target.GetSheHe] đã nghe thấy một số tin đồn khó chịu về ta, và thật sốc, chúng đến từ [target.GetHerHis] [target.Custom2('RelationToMe', SCOPE.sC('spouse'))] — [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] của chính ta!\n\n[spouse.GetFirstName] có vẻ không quan tâm. "Con chỉ nói cho [target.GetHerHim] biết sự thật thôi, #EMP thân yêu #!.""
  befriend_ongoing.3015.a:0 "Làm sao Ngài có thể làm vậy chứ?"

  befriend_ongoing.4000.t:0 "Kẻ chi kỉ: Chúng Ta Hiểu Chiến Tranh"
  befriend_ongoing.4000.desc:0 "Ta đang cố kết bạn với [target.GetTitledFirstName], và Ta biết [target.GetSheHe] cũng là một học trò tận tâm về quân sự như Ta. Chắc chắn, chúng Ta sẽ có nhiều điều để trao đổi."
  befriend_ongoing.4000.a:0 "Ta sẽ tiếp cận [target.GetHerHim]."
  befriend_ongoing.4000.a.tt:0 "#F Sở thích chung có thể giúp chúng Ta gần nhau hơn#!"
  befriend_ongoing.4000.b:0 "Ta sẽ tìm cách tận dụng điều đó."
 
  befriend_ongoing.4002.t:0 "Chúng Ta Hiểu Chiến Tranh"
  befriend_ongoing.4002.desc:0 "[owner.GetTitledFirstName] tiếp cận ta, đề cập đến sở thích chung của chúng ta về các vấn đề quân sự và muốn trao đổi ý kiến. [owner.GetSheHe|U] dường như rất uyên bác về tất cả các chủ đề liên quan đến chiến lược và chiến thuật."
  befriend_ongoing.4002.a:0 "Cuối cùng, một cuộc trò chuyện thú vị!"
  befriend_ongoing.4002.b:0 "[owner.GetTitledFirstNameNoTooltip]? Ta không nghĩ vậy."

  befriend_ongoing.4004.a.desc:0 "[target.GetTitledFirstName] và ta đã dành một khoảng thời gian tốt đẹp để thảo luận về các cuộc vây hãm, bao vây, các cuộc đột kích tìm kiếm lương thực, việc sử dụng cung thủ và triển khai hợp lý các vũ khí công thành. Chúng ta đã có một trận cười sảng khoái khi thấy những kẻ bàng quan thiếu hiểu biết lắc đầu khi nghe lỏm được câu chuyện của chúng ta."
  befriend_ongoing.4004.b.desc:0 "[target.GetTitledFirstName] đáp lại một cách lạnh lùng rằng [target.GetSheHe] không thực sự quan tâm đến các vấn đề quân sự. Nhưng ta biết điều đó là không đúng."
  befriend_ongoing.4004.a:0 "Chiến tranh thực sự là nghệ thuật cao quý nhất."
  befriend_ongoing.4004.b:0 "Thật đáng thất vọng."

  befriend_ongoing.4010.t:0 "Kẻ chi kỉ: Hai Mặt Trời"
  befriend_ongoing.4010.desc:1 "Khi ta hỏi mọi người về [target.GetTitledFirstName], họ nói về sự dí dỏm, duyên dáng và vẻ tự nhiên mà [target.GetSheHe] thống trị bất kỳ buổi tụ họp xã hội nào. Có vẻ như chúng ta có điểm chung."
  befriend_ongoing.4010.a:0 "Hai mặt trời cùng nhau sẽ rực rỡ gấp ba lần!"
 
  befriend_ongoing.4012.t:0 "Hai Mặt Trời"
  befriend_ongoing.4012.desc:0 "[owner.GetTitledFirstName] đang lan truyền những gợi ý rõ ràng rằng [owner.GetSheHe] muốn kết bạn với ta. [owner.GetSheHe|U] dường như là một người có bản năng xã hội tự nhiên, và đang ngầm ý rằng những tài năng chung của chúng ta trong lĩnh vực này lẽ ra phải đưa chúng ta lại gần nhau."
  befriend_ongoing.4012.a:0 "Và [owner.GetSheHe] đúng!"
  befriend_ongoing.4012.b:0 "[owner.GetSheHe|U] thực sự không thú vị như hắn nghĩ đâu."

  befriend_ongoing.4014.a.desc:0 "Theo lời mời của Ta, [target.GetTitledFirstName] và Ta gặp nhau tại một buổi tụ tập xã hội. Chúng Ta rất vui, và mọi người cũng vậy. Thật vui khi thấy cả sự kiện xoay quanh hai chúng Ta chỉ sau vài phút."
  befriend_ongoing.4014.b.desc:0 "[target.GetTitledFirstName] đã sử dụng các kỹ năng xã hội đáng kể của mình một cách hiệu quả để tạo ra một câu trả lời tàn nhẫn và đầy khinh miệt đối với lời mời của ta, được truyền đạt thông qua những gợi ý và lời thì thầm từ những người quen chung."
  befriend_ongoing.4014.a:0 "Như ruồi quanh hai hũ mật!"
  befriend_ongoing.4014.b:0 "Ta vừa ấn tượng vừa bị xúc phạm."

  befriend_ongoing.4020.t:0 "Kẻ chi kỉ: Không Có Gì Để Thảo Luận"
  befriend_ongoing.4020.desc:0 "Ta nhận ra rằng [target.GetTitledFirstName] cũng có thiên hướng giống ta, ở chỗ [target.GetSheHe] hiểu và đánh giá đúng tầm quan trọng của việc giữ cho các con số được chính xác."
  befriend_ongoing.4020.a:0 "Liệu [target.GetSheHe] có biết số không? Ta phải tìm hiểu!"
 
  befriend_ongoing.4022.t:0 "Không Có Gì Để Thảo Luận"
  befriend_ongoing.4022.desc:1 "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] đã tiếp cận ta, muốn thảo luận về sự quan tâm chung của chúng ta đối với hành chính và các con số. Số không là một điểm cụ thể mà [owner.GetSheHe] muốn thảo luận."
  befriend_ongoing.4022.a:0 "Tất nhiên! Đây sẽ rất bổ ích!"
  befriend_ongoing.4022.b:0 "Con số đó đủ để diễn tả mức quan tâm của Ta."

  befriend_ongoing.4024.a.desc:0 "[target.GetTitledFirstName] và ta đã nói chuyện rất lâu về số không và tầm quan trọng cũng như khả năng của nó trong toán học và hành chính. Ta rất vui vì đã tìm được một người có cái nhìn tích cực hoàn toàn về các con số và hiểu giá trị thực sự của chúng."
  befriend_ongoing.4024.b.desc:0 "[target.GetTitledFirstName] chỉ trả lời rằng số không tương ứng gần nhất với mức độ quan tâm của [target.GetHerHis] hắn trong việc thảo luận với ta."
  befriend_ongoing.4024.a:0 "Đôi khi tốt khi chỉ nói về không có gì."
  befriend_ongoing.4024.b:0 "Nhưng thất vọng của Ta vô hạn."

  befriend_ongoing.4030.t:0 "Kẻ chi kỉ: Điệu Nhảy Của Những Kẻ Mưu Mẹo"
  befriend_ongoing.4030.desc:0 "Người ta nói về [target.GetTitledFirstName] rằng [target.GetSheHe] khá giỏi trong mưu mẹo và thao túng. Có lẽ Ta nên tiếp cận [target.GetHerHim] để xem liệu đó có phải điểm chung chúng Ta có thể gắn kết."
  befriend_ongoing.4030.a:0 "Ta sẽ làm điều đó, gián tiếp và khôn khéo."
 
  befriend_ongoing.4032.t:0 "Điệu Nhảy Của Những Kẻ Mưu Mẹo"
  befriend_ongoing.4032.desc:1 "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] đã thông qua các phương tiện gián tiếp gợi ý rằng [owner.GetSheHe] muốn kết bạn với ta. Rõ ràng là điều đó đang được thực hiện như một hình thức của trò chơi hoặc điệu nhảy mưu mô, nơi ta được mời đáp lại một cách gián tiếp."
  befriend_ongoing.4032.a:0 "Ta sẽ đáp lại [owner.GetFirstNameNoTooltip] một cách tích cực."
  befriend_ongoing.4032.b:0 "[owner.GetSheHe|U] là một kẻ ngốc, và [owner.GetSheHe] sẽ phải biết điều đó."

  befriend_ongoing.4034.a.desc:0 "[target.GetTitledFirstName] đã đáp lại tích cực các tín hiệu tinh tế của ta, và ta tin rằng điều này đã đưa chúng ta đến gần nhau hơn một chút so với trước đây. Đã chứng minh được rằng chúng ta thực sự có điểm chung."
  befriend_ongoing.4034.b.desc:0 "[target.GetTitledFirstName] đã đáp lại các tín hiệu hữu nghị của ta theo cách xúc phạm nhất, dù tinh tế và gián tiếp. Ta thậm chí không thể đáp lại mà không tự làm mình trông như một kẻ ngốc."
  befriend_ongoing.4034.a:0 "Dùng mưu kế để kết bạn với kẻ mưu mẹo."
  befriend_ongoing.4034.b:0 "Đây không phải điều Ta mong đợi."

  befriend_ongoing.4040.t:0 "Kẻ chi kỉ: Trí Tuệ Vĩ Đại"
  befriend_ongoing.4040.desc:0 "[target.GetTitledFirstName] dường như là một học giả chân chính giống như ta. Chắc chắn là có nhiều chủ đề uyên bác mà chúng ta có thể trò chuyện. Ta nên tiếp cận [target.GetHerHim]."
  befriend_ongoing.4040.a:0 "Hãy xem điều gì sẽ xảy ra."

  befriend_ongoing.4042.t:0 "Trí Tuệ Vĩ Đại"
  befriend_ongoing.4042.desc:1 "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] đã tiếp cận ta, ám chỉ rằng [owner.GetSheHe] muốn tham gia vào cuộc đối thoại uyên bác về một chủ đề mà ta lựa chọn. [owner.GetSheHe|U] rõ ràng đang cố gắng kết bạn với ta."
  befriend_ongoing.4042.a:0 "Vậy hãy để hai trí tuệ vĩ đại gặp nhau!"
  befriend_ongoing.4042.b:0 "Liệu [owner.GetSheHe] có gì thú vị để nói đây?"

  befriend_ongoing.4044.a.desc:0 "[target.GetTitledFirstName] và ta đã có một cuộc trò chuyện dài về bản chất của tri thức và các vấn đề triết học khác. Ta cảm thấy rằng tâm trí chúng ta đã chạm đến nhau và chúng ta gần hơn với việc trở thành bạn bè."
  befriend_ongoing.4044.b.desc:0 "[target.GetTitledFirstName] đã làm rõ rằng [target.GetSheHe] không quan tâm đến việc thảo luận các vấn đề học thuật với ta. Có một giọng điệu khinh miệt không thể nhầm lẫn trong câu trả lời [target.GetHerHis] của hắn."
  befriend_ongoing.4044.a:0 "Trí tuệ vĩ đại nghĩ giống nhau, cuối cùng."
  befriend_ongoing.4044.b:0 "Thật thất vọng."

  befriend_ongoing.4050.t:0 "Kẻ chi kỉ: Hộp Quẹt Tình Ái"
  befriend_ongoing.4050.desc:0 "Tin đồn nói rằng [target.GetTitledFirstName] cũng giống Ta, là chuyên gia khơi dậy ngọn lửa tình ái trong người khác. Ta nghĩ chúng Ta nên gặp nhau và so sánh kinh nghiệm."
  befriend_ongoing.4050.a:0 "Không biết [target.GetSheHe] có giữ danh sách những chinh phục của [target.GetHerHis] không nhỉ?"
 
  befriend_ongoing.4052.t:0 "Hộp Quẹt Tình Ái"
  befriend_ongoing.4052.desc:1 "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] đã tiếp cận ta, đề cập đến sự quan tâm chung của chúng ta đối với sự quyến rũ và những cuộc phiêu lưu tình ái. [owner.GetSheHe|U] muốn gặp nhau để so sánh các ghi chú và trải nghiệm."
  befriend_ongoing.4052.a.wine:0 "Vâng, hãy cùng chia sẻ những câu chuyện cay nồng bên ly rượu!"
  befriend_ongoing.4052.a.tee:0 "Vâng, hãy cùng chia sẻ những câu chuyện cay nồng!"
  befriend_ongoing.4052.b:0 "[owner.GetSheHe|U] thực sự nghĩ mình có thể so sánh bản thân với ta sao? Hah!"

  befriend_ongoing.4054.a.desc:0 "[target.GetTitledFirstName] và ta đã dành hàng giờ để nói chuyện và so sánh các cuộc chinh phục của chúng ta. Những câu chuyện kỳ lạ và phức tạp tạo ra những câu chuyện hay hơn là những câu chuyện tầm thường, mặc dù những câu chuyện sau đó nhiều hơn."
  befriend_ongoing.4054.b.desc:0 "[target.GetTitledFirstName] không muốn gặp và trao đổi những câu chuyện về cuộc chinh phục tình ái. [target.GetSheHe|U] nói rằng không đời nào ta có thể so sánh bản thân với hắn."
  befriend_ongoing.4054.a:0 "Chúng Ta nhận ra đã mất cả đếm từ lâu."
  befriend_ongoing.4054.b:0 "Ha! Đố kị là quái vật ghê tởm!"

  befriend_ongoing.4060.t:0 "Kẻ chi kỉ: Gươm Song Hành"
  befriend_ongoing.4060.desc:0 "Người ta nhắc đến kỹ năng tuyệt vời mà [target.GetTitledFirstName] thể hiện khi cầm kiếm. Người ta nói rằng rất ít người có thể trụ vững quá vài giây dưới các đòn tấn công của [target.GetHerHis] khi rút kiếm."
  befriend_ongoing.4060.a:0 "Chúng ta phải gặp nhau và giao đấu!"
 
  befriend_ongoing.4062.t:0 "Gươm Song Hành"
  befriend_ongoing.4062.desc:1 "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U], một người sùng bái kiếm thuật giống như ta, đã tiếp cận ta, muốn tham gia vào một số trận đấu giao hữu và có thể là cuộc trò chuyện về chủ đề yêu thích của chúng ta."
  befriend_ongoing.4062.a:0 "Một đề nghị tuyệt vời!"
  befriend_ongoing.4062.b:0 "Không, [owner.GetSheHe] không đáng để Ta tốn thời gian."

  befriend_ongoing.4064.a.desc:0 "[target.GetTitledFirstName] và ta đã gặp nhau cho một trận đấu kiếm. Sau khi dành hai giờ tốt đẹp trong điệu nhảy nhanh chóng của những cú đâm và đỡ, chúng ta đã dành thêm ba giờ để thảo luận về kỹ thuật và chiến thuật."
  befriend_ongoing.4064.b.desc:0 "[target.GetTitledFirstName] đã nói rất rõ ràng và bất lịch sự rằng [target.GetSheHe] không có ý định gặp ta cho một trận đấu tập."
  befriend_ongoing.4064.a:0 "Quá ít người hiểu vẻ đẹp bên trong của thanh kiếm."
  befriend_ongoing.4064.b:0 "Đó là lời của kẻ hèn nhát."

  befriend_ongoing.4070.t:0 "Kẻ chi kỉ: Chuyện Kể Từ Thảo Nguyên"
  befriend_ongoing.4070.desc:0 "[target.GetTitledFirstName] là một thợ săn tận tụy giống như ta. Ta chắc rằng chúng ta sẽ có nhiều điều để nói và nhiều kinh nghiệm để gắn kết."
  befriend_ongoing.4070.a:0 "Chúng ta nên gặp và so sánh thành tích săn bắn!"
 
  befriend_ongoing.4072.t:0 "Chuyện Kể Từ Thảo Nguyên"
  befriend_ongoing.4072.desc:1 "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] đã tiếp cận ta, muốn gặp gỡ và thảo luận về kinh nghiệm của chúng ta với tư cách là những thợ săn. Đó là một cơ hội để trao đổi những câu chuyện phóng đại từ vùng hoang dã."
  befriend_ongoing.4072.a:0 "Liệu [owner.GetHerHis] đã săn con gì khó nhất nhỉ?"
  befriend_ongoing.4072.b:0 "Ta không quan tâm đến kẻ săn thỏ đó."

  befriend_ongoing.4074.a.desc:0 "[target.GetTitledFirstName] và ta đã dành cả một buổi tối để nói chuyện, trao đổi câu chuyện và so sánh kinh nghiệm từ các cuộc săn khác nhau."
  befriend_ongoing.4074.b.desc:0 "[target.GetTitledFirstName] chỉ đáp lại cách tiếp cận của ta bằng sự khinh bỉ, gọi ta là kẻ bắt thỏ."
  befriend_ongoing.4074.a:0 "Chắc [target.GetSheHe] đã phóng đại vài chi tiết."
  befriend_ongoing.4074.b:0 "Vậy thì [target.GetSheHe] có thể là con thỏ."

  befriend_ongoing.4080.t:0 "Kẻ chi kỉ: Những Đêm Hoang Dã"
  befriend_ongoing.4080.desc:0 "[target.GetTitledFirstName] là một kẻ thích tiệc tùng nổi tiếng giống như ta. Ta nghĩ chúng ta sẽ có một khoảng thời gian rất vui vẻ nếu chúng ta sắp xếp một buổi ăn chơi nhỏ."
  befriend_ongoing.4080.a:0 "Phải thực hiện thôi!"
 
  befriend_ongoing.4082.t:0 "Những Đêm Hoang Dã"
  befriend_ongoing.4082.desc:1 "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] đã hỏi ta liệu ta có muốn cùng nhau tổ chức một bữa tiệc nhỏ và vui vẻ không. [owner.GetSheHe|U] có vẻ là một kẻ thích tiệc tùng có chút tiếng tăm."
  befriend_ongoing.4082.a:0 "Chắc chắn sẽ vui."
  befriend_ongoing.4082.b:0 "[owner.GetFirstNameNoTooltip]? Ta thà uống rượu một mình còn hơn."

  befriend_ongoing.4084.a.desc:0 "[target.GetTitledFirstName] và ta đã dành một ngày một đêm (hay là hai?) để ăn chơi. Ta chỉ có thể nhớ rõ nơi nó bắt đầu và nơi nó kết thúc, nhưng lạy [ROOT.Char.GetFaith.random_GoodGodNames], chúng ta đã có một khoảng thời gian tuyệt vời!"
  befriend_ongoing.4084.b.desc:0 "[target.GetTitledFirstName] đã tuyên bố rằng [target.GetSheHe] thà uống rượu một mình còn hơn dành thời gian với ta."
  befriend_ongoing.4084.a:0 "Cũng không phải cách tệ để trải qua... một khoảng thời gian."
  befriend_ongoing.4084.b:0 "Có vẻ Ta vừa thoát hiểm hẹp, nhỉ."

  befriend_ongoing.4090.t:0 "Kẻ chi kỉ: Bản Giao Hưởng Của Đau Đớn"
  befriend_ongoing.4090.desc:0 "Ta đã hiểu ra rằng [target.GetTitledFirstName] cũng giống như ta, là một học trò tận tụy của những nghệ thuật tinh tế về nỗi đau và sự cưỡng ép. Sẽ rất thú vị nếu được gặp [target.GetHerHim] để thảo luận về các phương pháp và ứng dụng."
  befriend_ongoing.4090.a:0 "Chúng ta sẽ cần công cụ và đối tượng, tất nhiên."
 
  befriend_ongoing.4092.t:0 "Bản Giao Hưởng Của Đau Đớn"
  befriend_ongoing.4092.desc:0 "[owner.GetTitledFirstName] đã tuyên bố rằng [owner.GetSheHe] muốn gặp ta để thảo luận về sự quan tâm chung đối với những nghệ thuật tinh tế về nỗi đau và sự cưỡng ép."
  befriend_ongoing.4092.a:0 "Ý kiến tuyệt vời. Ta sẽ mang theo công cụ của mình."
  befriend_ongoing.4092.b:0 "Ta chẳng muốn nói gì với kẻ thô tục đó."

  befriend_ongoing.4094.a.desc:0 "[target.GetTitledFirstName] và ta đã dành cả ngày đêm cùng với một số tội phạm nhỏ không may và được tập hợp vội vàng, thảo luận và áp dụng các kỹ thuật khác nhau và lập kế hoạch cho các thí nghiệm xa hơn."
  befriend_ongoing.4094.b.desc:0 "[target.GetTitledFirstName] đã trả lời lời mời của ta chỉ bằng cách ám chỉ rằng các phương pháp của ta quá thô thiển và rằng [target.GetSheHe] không có mong muốn kết giao với ta."
  befriend_ongoing.4094.a:0 "Điều này vừa truyền cảm hứng vừa khai sáng."
  befriend_ongoing.4094.b:0 "Ta sẽ vui lòng chỉ cho [target.GetHerHim] thấy chính xác sự thô tục…"

  befriend_ongoing.4100.t:0 "Kẻ chi kỉ: Kẻ Thù Của Kẻ Thù Ta"
  befriend_ongoing.4100.desc:0 "Chiến tranh mang lại nỗi kinh hoàng cũng như cơ hội vinh quang. Một điều khác là những mối quan hệ hình thành giữa những người chiến đấu cùng bên. \n\nTrong nỗ lực chống lại [befriend_ongoing_4100_enemy.GetTitledFirstName], dường như [befriend_ongoing_4100_text_scope.GetTitledFirstName] và Ta đã tìm thấy mối quan tâm chung."
  befriend_ongoing.4100.a:0 "Chiến tranh sẽ rèn luyện Tình bạn."

  befriend_ongoing.4110.t:0 "Mục Tiêu Chung"
  befriend_ongoing.4110.desc:0 "Tương tác với [befriend_ongoing_4110_text_scope.GetTitledFirstName] như thành viên cùng phe, Ta nhận thấy rằng mối quan hệ sẽ hình thành tất yếu giữa những người làm việc vì một mục tiêu dài hạn chung."
  befriend_ongoing.4110.a:0 "Mong chúng ta đều thịnh vượng."

  befriend_ongoing.4300.t:0 "Kẻ chi kỉ: Màn Trình Diễn Của Giá Treo"
  befriend_ongoing.4300.a:0 "Công lý sẽ được thực thi, công lý và nỗi sợ."
  befriend_ongoing.4300.b:0 "Chắc hẳn còn cách khác."
  befriend_ongoing.4300.desc:0 "Ta hiểu rằng [target.GetTitledFirstName] giống như ta, là một nhà cai trị mà công lý của hắn khiến người khác khiếp sợ. Ta nên mời [target.GetHerHim] ngồi bên cạnh ta tại buổi hành quyết công khai tiếp theo."
  befriend_ongoing.4300.a.tt:0 "#F Gửi một lá thư cho [target.GetHerHim]#!"

  befriend_ongoing.4302.t:0 "Lời Mời Xử Tử"
  befriend_ongoing.4302.desc:0 "[owner.GetTitledFirstName] đã mời ta một chỗ ngồi danh dự bên cạnh [owner.GetHerHis] hắn cho buổi hành quyết công khai tiếp theo."
  befriend_ongoing.4302.c:0 "Ngài coi Ta là kẻ ngốc sao? Ta sẽ không dễ dàng rơi vào bẫy của Ngài!"
  befriend_ongoing.4302.a:0 "Ý kiến tuyệt vời. Ta sẽ rất vinh dự khi quan sát cách Ngài thi hành công lý."
  befriend_ongoing.4302.b:0 "Ta còn nhiều việc quan trọng hơn là xem Ngài xử lý những tên tội phạm vặt."

  befriend_ongoing.4304.t:0 "Kẻ chi kỉ: Một Màn Trình Diễn Kinh Khiếp"
  befriend_ongoing.4304.a.desc:0 "[target.GetTitledFirstName] đã đến triều đình của ta để chứng kiến cảnh tượng hành quyết công khai và tinh thần công lý của ta. Đây là cơ hội để ta gây ấn tượng với [target.GetHerHim] bằng sự nghiêm khắc của mình. Tên tù nhân nào ta nên xử tử?"
  befriend_ongoing.4304.b.desc:1 "[target.GetTitledFirstName] đã trả lời lời mời của ta rằng [target.GetSheHe] không có mong muốn kết giao với ta và để danh tiếng đáng sợ của hắn mang lại tính chính danh cho ta."
  befriend_ongoing.4304.a:0 "Đến lúc chết rồi, [prisoner_a.GetFirstNameNoTooltip]."
  befriend_ongoing.4304.b:0 "Hết đường rồi, [prisoner_b.GetFirstNameNoTooltip]."
  befriend_ongoing.4304.c:0 "Chém đầu [prisoner_c.GetFirstNameNoTooltip]!"
  befriend_ongoing.4304.d:0 "Hôm nay Ta cảm thấy khoan dung. Không ai chết cả."
  befriend_ongoing.4304.d.tt:0 "#F [target.GetTitledFirstName] có thể coi lòng thương xót của ta là sự yếu đuối#!"
  befriend_ongoing.4304.e:0 "Một ngày nào đó, cổ họng của [owner.GetHerHis] sẽ cảm nhận lưỡi thép của Ta."
  befriend_ongoing.4304.e.tt:0 "#F [owner.GetTitledFirstName] không muốn ghé thăm triều đình của ta#!"
  befriend_ongoing.4304.f:0 "Giết hết tất cả!"

  befriend_ongoing.5001.t:0 "Kẻ chi kỉ: Một Kẻ Hoài Nghi và Một Kẻ Nhiệt Thành"
  befriend_ongoing.5001.desc:0 "Nỗ lực làm dịu căng thẳng giữa [target.GetTitledFirstName] và Ta bị cản trở bởi việc [target.GetSheHe] liên tục chỉ trích Ta thiếu lòng mộ đạo. Những cố gắng thuyết phục của [target.GetHerHis|U] hầu như không làm Ta thay đổi niềm tin..."
  befriend_ongoing.5001.a:0 "Ta sẽ đến [ROOT.Char.GetFaith.HouseOfWorship] nếu [target.GetFirstNameNoTooltip] thấy vui lòng."
  befriend_ongoing.5001.b:0 "Chúng ta có thể tìm những điểm khác để đồng thuận."
 
  befriend_ongoing.5002.t:0 "Kẻ chi kỉ: Vấn Đề Niềm Tin"
  befriend_ongoing.5002.desc:0 "Sẽ dễ dàng hơn nhiều để khiến [target.GetTitledFirstName] thích Ta nếu [target.GetSheHe] tin vào sự chân thành trong nỗ lực của Ta! Ta biết [target.GetSheHe] nghi ngờ sự thành thật của Ta khi [target.GetSheHe] đưa ra câu trả lời mơ hồ và rút lui khỏi cuộc trò chuyện..."
  befriend_ongoing.5002.a:0 "Ta sẽ kiên trì, nhưng không nói dối về con người mình."
  befriend_ongoing.5002.b:0 "Đáng tiếc, dối trá thuyết phục hơn sự thật."
 
  befriend_ongoing.5003.t:0 "Kẻ chi kỉ: Mây Đen Trên Ngày Nắng"
  befriend_ongoing.5003.desc:0 "Tất cả những gì ta muốn là làm cho [target.GetTitledFirstName] cảm nhận được niềm vui khi ở bên người khác! Tuy nhiên, ta càng cố gắng, [target.GetSheHe] càng rút lui khỏi ta. Giờ đây, [target.GetSheHe] hiếm khi rời khỏi phòng [target.GetHerHis] mình..."
  befriend_ongoing.5003.c:0 "Ta sẽ lắng nghe và cố gắng thấu hiểu."
  befriend_ongoing.5003.a:0 "[target.GetSheHe|U] phải vực dậy tinh thần thôi!"
  befriend_ongoing.5003.b:0 "Nếu [target.GetSheHe] cần không gian, Ta sẽ cho [target.GetHerHim]."
 
  befriend_ongoing.5004.t:0 "Kẻ chi kỉ: Không Theo Gu [target.GetHerHis|U]"
  befriend_ongoing.5004.desc:0 "Không gì làm Ta vui hơn một [ROOT.Char.Custom('FavoriteTreat')] hấp dẫn, vì vậy Ta đã gửi một phần do đầu bếp riêng chuẩn bị đến [target.GetTitledFirstName] như bằng chứng thiện chí.\n\nTuy nhiên, cử chỉ này hóa ra là thảm họa, vì [target.GetSheHe] đã sai một người hầu ném đi mà không nếm thử..."
  befriend_ongoing.5004.a:0 "Ta sẽ xin lỗi vì sự quá đáng của mình."
  befriend_ongoing.5004.b:0 "Kẻ [target.Custom2('InsultNoun', ROOT.Char)] thật vô ơn!"
 
  befriend_ongoing.5005.t:0 "Kẻ chi kỉ: Lời Kêu Gọi Hành Động"
  befriend_ongoing.5005.desc:0 "Ta đang cố gắng làm cho [target.GetTitledFirstName] hiểu ta hơn, nhưng tất cả những gì ta nhận được là việc mình ngày càng ít hiểu hắn. Động lực [target.GetHerHis] đâu, tham vọng [target.GetHerHis] đâu? Có vẻ như [target.GetSheHe] sẽ chẳng bận tâm nếu không có gì thay đổi."
  befriend_ongoing.5005.a:0 "Ta có thể không đồng ý, nhưng Ta chấp nhận."
  befriend_ongoing.5005.b:0 "Người như vậy có đáng để quen biết không?"

  befriend_ongoing.5006.t:0 "Kẻ chi kỉ: Kết Nối Khoảng Cách"
  befriend_ongoing.5006.desc:0 "Ta đã tìm kiếm rất nhiều, nhưng dường như [target.GetTitledFirstName] và Ta không có điểm chung nào.\n\nKhông có điểm chung, Ta bắt đầu xây dựng Tình bạn từ đâu?"
  befriend_ongoing.5006.a:0 "Với nỗ lực, Ta sẽ hiểu [target.GetHerHim]."
  befriend_ongoing.5006.b:0 "Chắc chắn cuối cùng sẽ có điều gì đó xuất hiện."

  befriend_ongoing.5007.t:0 "Kẻ chi kỉ: Tri Thức Trong Tầm Tay"
  befriend_ongoing.5007.opening:0 "[target.GetTitledFirstName] và ta không có nhiều điểm chung, điều đó khiến việc giao tiếp với [target.GetHerHim] trở nên khó khăn.\n\nTuy nhiên, với một chút nỗ lực, ta có thể tự học đủ để duy trì một cuộc trò chuyện"
  befriend_ongoing.5007.martial:0 "về chiến lược và tuyến cung ứng."
  befriend_ongoing.5007.diplomacy:0 "với nghi thức và truyền thống triều đình thích hợp."
  befriend_ongoing.5007.intrigue:0 "về quyền lực tiềm ẩn trong bí mật. Mọi loại bí mật."
  befriend_ongoing.5007.stewardship:0 "về những chi tiết tinh vi trong các hợp đồng phong kiến của vương quốc."
  befriend_ongoing.5007.learning:0 "về bản chất siêu hình của linh hồn."
  befriend_ongoing.5007.a:0 "Chủ đề này xứng đáng với tất cả thời gian Ta có thể dành."
  befriend_ongoing.5007.a.success:0 "Ngài thu được những hiểu biết mới"
  befriend_ongoing.5007.a.failure:0 "Học sai hướng rồi"
  befriend_ongoing.5007.b:0 "Ta luôn có thể thư giãn thay vì học."

  befriend_ongoing.6001.t:0 "Tự Do và Thân Thiện"

  befriend_ongoing.6002.t:0 "Tự Do và Thân Thiện"
  befriend_ongoing.6002.desc:0 "[owner.GetTitledFirstName] dạo này tỏ ra thân thiện một cách bất thường đối với ta.\n\nNếu sự thay đổi giọng điệu này cho thấy một sự thay đổi về tính cách, có lẽ [owner.GetSheHe] có thể bị thuyết phục để thả [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))] của ta — [prisoner.GetTitledFirstName] — khỏi nơi giam cầm?"
  befriend_ongoing.6002.a:0 "Chắc chắn nếu [owner.GetSheHe] thật sự muốn làm Ngài với Ta..."
  befriend_ongoing.6002.a.tt:0 "Nếu [owner.GetFirstNameNoTooltip] chấp nhận:"
  befriend_ongoing.6002.b:0 "[prisoner.GetFirstNameNoTooltip] có thể đợi thêm một chút nữa."
  befriend_ongoing.6002.b.tt:0 "#F [owner.GetFirstNameNoTooltip] có thể giữ [prisoner.GetHerHim] lại#!"

  befriend_ongoing.6004.desc:1 "Nhận thấy sự thân thiện gần đây của Ta như một tín hiệu, [target.GetTitledFirstName] đã đến gặp Ta với mối quan tâm cho một trong các tù nhân của Ta.\n\n'Thật vui mừng nếu ngài thả [target.Custom2('RelationToMe', SCOPE.sC('prisoner'))] [prisoner.GetTitledFirstName] khỏi [prisoner.GetHerHis] [prisoner.Custom('PrisonTypeCell')],' [target.GetSheHe] nói, [ROOT.Char.Custom2('QuirkPPPosOrNeg', SCOPE.sC('target'))]."
  befriend_ongoing.6004.a:0 "Một cách rẻ tiền để lấy lòng [target.GetFirstNamePossessiveNoTooltip]."
  befriend_ongoing.6004.b:0 "Không, nhưng Ta có thể làm [prisoner.GetHerHim] dễ chịu hơn một chút."
  befriend_ongoing.6004.c:0 "Thả [prisoner.GetFirstNameNoTooltip]? Không bao giờ!"

  befriend_ongoing.6005.desc:0 "[owner.GetTitledFirstName] đã đề nghị sự khoan hồng cho [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))] của ta! [prisoner.GetTitledFirstName] cuối cùng đã được an toàn."
  befriend_ongoing.6005.a:0 "Chào mừng về nhà."

  befriend_ongoing.6006.desc:0 "Bất chấp mọi sự giả vờ thân thiện, [owner.GetTitledFirstName] đã từ chối thả [prisoner.GetFirstNameNoTooltip]."
  befriend_ongoing.6006.a:0 "Còn nhiều cách khác, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))] của Ta."

  befriend_ongoing.6007.desc:0 "Trong khi [owner.GetTitledFirstName] dành quá nhiều thời gian để hối tiếc giải thích lý do tại sao [owner.GetSheHe] không thể thả [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))] của ta, thì ít nhất [prisoner.GetTitledFirstName] cũng đã được chuyển đến nơi ở thoải mái hơn nhiều."
  befriend_ongoing.6007.a:0 "Một ngày nào đó, ngươi sẽ lại tự do, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))] của ta."

  befriend_ongoing.6008.desc:0 "Có vẻ như việc ta được thả khỏi cảnh giam cầm dưới tay [owner.GetTitledFirstName] là do [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] của ta, [target.GetTitledFirstName], dàn dựng!"
  befriend_ongoing.6008.a:0 "Ta không biết nói sao cho đủ cảm ơn, [target.GetFirstNameNoTooltip]."

  befriend_ongoing.6009.t:0 "Kẻ chi kỉ: Thiện Ý"
  befriend_ongoing.6009.desc:0 "Một lời hứa tận tâm sẽ gửi đi thông điệp mạnh mẽ về thiện chí của Ta đối với [target.GetTitledFirstName].\n\nAi cũng trân trọng một ân huệ lớn."
  befriend_ongoing.6009.a:0 "Lời hứa sẽ chính thức và long trọng!"
  befriend_ongoing.6009.b:0 "Hãy chắc chắn [target.GetSheHe] nhớ lời hứa mỗi ngày."
  befriend_ongoing.6009.c:0 "Tốt hơn là tránh những việc như thế này."
  befriend_ongoing.6009.c.tt:0 "#F Ta sẽ không chịu bất kỳ món nợ nào#!"

  befriend_ongoing.6010.t:0 "Thiện Ý"
  befriend_ongoing.6010.desc:0 "Thật ngạc nhiên, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))] của ta là [owner.GetTitledFirstName] đã đến gặp ta, hứa rằng bất cứ điều gì ta cần, bất cứ điều gì [owner.GetSheHe] có thể làm, [owner.GetSheHe] sẽ cung cấp nếu ta yêu cầu."
  befriend_ongoing.6010.a:0 "[owner.GetSheHe] nhận được gì từ lời hứa này?"

  befriend_ongoing.6011.desc:0 "Mặc dù [target.GetTitledFirstName] nợ ta một ân huệ đáng kể, nhưng có lẽ tốt hơn là nên nhấn mạnh vào một tình bạn bình đẳng.\n\n[target.GetSheHe|U] cũng sẽ — chắc chắn rồi — vô cùng biết ơn nếu ta làm rõ rằng ta không mong đợi việc trả ơn."
  befriend_ongoing.6011.a:0 "Bạn Bè cho đi tự nguyện, không vì nghĩa vụ."
  befriend_ongoing.6011.b:0 "Không thể chỉ là Tình bạn vĩnh cửu thay cho ân huệ sao?"
  befriend_ongoing.6011.b.tt:0 "#F Rõ ràng Tình bạn không hoạt động như vậy#!"

  befriend_ongoing.6012.desc:0 "Kể từ khi lời hứa được đưa ra, ta đã lo lắng về việc [owner.GetTitledFirstName] có thể đòi hỏi gì để trả cho ân huệ mà ta nợ [owner.GetHerHim]. Tuy nhiên, giờ đây [owner.GetSheHe] đã cho ta biết rằng [owner.GetSheHe] sẽ coi món nợ của ta đã được trả miễn là ta có cái nhìn thiện cảm với [owner.GetHerHim]."
  befriend_ongoing.6012.a:0 "[owner.GetSheHe] hy vọng sẽ nhận được gì từ điều này?"

  befriend_ongoing.6013.desc:0 "Có vẻ giữa Ta và [target.GetTitledFirstName] có không ít bất hòa, do vấn đề nhỏ là việc Ta tống tiền [target.GetHerHim].\n\nTa có thể bỏ cuộc, tất nhiên, để cho [target.GetHerHim] biết rằng mục đích của Ta — cuối cùng — chỉ là tốt."
  befriend_ongoing.6013.a:0 "Tình bạn luôn mạnh mẽ hơn cưỡng bức."
  befriend_ongoing.6013.b:0 "Ta không thể từ bỏ lợi thế duy nhất của mình!"

  befriend_ongoing.6014.desc:0 "Thật là một sự nhẹ nhõm to lớn! [owner.GetTitledFirstName] đã thề — một cách long trọng trên tất cả những gì thiêng liêng — rằng [owner.GetSheHe] sẽ từ bỏ việc tống tiền mà [owner.GetSheHe] nắm giữ đối với ta.\n\nTa không biết điều gì đã gây ra điều này, nhưng cảm giác như ta cuối cùng cũng có thể hít thở trở lại."
  befriend_ongoing.6014.a:0 "Cảm ơn [ROOT.Char.GetFaith.HighGodNameAlternate]!"

  befriend_ongoing.6015.t:0 "Kẻ chi kỉ: Đưa Ra Sự Giải Tỏa"
  befriend_ongoing.6015.opening:0 "Nỗ lực gần gũi với [target.GetTitledFirstName] đã gặp nhiều khó khăn, phần không nhỏ vì áp lực mà [target.GetSheHe] đang cố gắng chịu đựng.\n\nCó lẽ sẽ giúp Ta nhiều hơn nếu Ta đảm bảo cho [target.GetHerHim] một ngày dành cho riêng [target.GetHerselfHimself], nơi [target.GetSheHe] có thể"
  befriend_ongoing.6015.malicious:0 "dành thời gian ngoài đồng, cười nhạo sự bẩn thỉu và vụng về của nông dân."
  befriend_ongoing.6015.benevolent:0 "phân phát từ thiện cho nhà tình thương — hoặc các quý tộc kém may mắn."
  befriend_ongoing.6015.dominant:0 "đi cưỡi ngựa cùng tuần tra quân đội, đảm bảo họ giữ trật tự đúng cách."
  befriend_ongoing.6015.submissive:0 "hiến [target.GetHerselfHimself] mình cho việc cầu nguyện và suy ngẫm, tránh xa những đòi hỏi của người khác."
  befriend_ongoing.6015.extroverted:0 "dành thời gian với các triều thần vui vẻ, tránh xa phòng hội đồng ngột ngạt và sổ sách hành chính đầy bụi bặm."
  befriend_ongoing.6015.introverted:0 "dành thời gian tránh xa các triều thần và quan viên đòi hỏi, cho phép một khoảnh khắc yên tĩnh hiếm hoi."
  befriend_ongoing.6015.emotional:1 "tạm quên [target.GetHerHis] đi những vấn đề cai trị bằng cách tham dự một vở kịch tại [barony.Custom('BaronyTownType')] của [barony.GetNameNoTooltip]."
  befriend_ongoing.6015.levelheaded:0 "tạo khoảng cách và đánh giá lại các ưu tiên của [target.GetHerHis]."
  befriend_ongoing.6015.a:0 "Điều này sẽ đòi hỏi nhiều, nhưng xứng đáng."
  befriend_ongoing.6015.b:0 "Ta đã có đủ vấn đề của riêng mình rồi."

  befriend_ongoing.6016.t:0 "Đưa Ra Sự Giải Tỏa"
  befriend_ongoing.6016.opening:0 "Ngạc nhiên thay, [owner.GetTitledFirstName] đã liên lạc với các cố vấn của Ta để sắp xếp một ngày cho riêng Ta, nhằm giảm bớt áp lực mà Ta đang chịu.\n\nCuối cùng, Ta đã trải qua ngày đó theo gợi ý từ [owner.GetFirstName] [owner.GetHerselfHimself],"
  befriend_ongoing.6016.malicious:0 "đi cưỡi ngựa ngoài đồng, tìm thú vui trong sự bẩn thỉu và vụng về thái quá của nông dân."
  befriend_ongoing.6016.benevolent:0 "phân phát từ thiện cho nhà tình thương và các quý tộc kém may mắn."
  befriend_ongoing.6016.dominant:0 "đi cưỡi ngựa cùng tuần tra quân đội, trực tiếp quản lý trật tự trong vương quốc."
  befriend_ongoing.6016.submissive:0 "một mình cầu nguyện và suy ngẫm, tránh xa những yêu cầu của người khác nhưng hướng về [ROOT.Char.GetFaith.HighGodName]."
  befriend_ongoing.6016.extroverted:0 "cùng các triều thần vui vẻ, tránh xa phòng hội đồng ngột ngạt và sổ sách hành chính đầy bụi bặm."
  befriend_ongoing.6016.introverted:0 "xa rời các triều thần và quan viên đòi hỏi, cho phép một khoảnh khắc yên bình hiếm hoi."
  befriend_ongoing.6016.emotional:1 "để tâm trí khỏi công việc quản lý bằng cách xem một vở kịch ở [barony.Custom('BaronyTownType')] của [barony.GetNameNoTooltip]."
  befriend_ongoing.6016.levelheaded:0 "tạo khoảng cách và đánh giá lại các ưu tiên của Ta."
  befriend_ongoing.6016.a:0 "Ta cần điều này."

  befriend_ongoing.6017.t:0 "Kẻ chi kỉ: Sự Phát Triển Thân Thiện"
  befriend_ongoing.6017.desc:1 "Có nhiều khác biệt giữa [target.GetTitledFirstName] và ta. Một trong số đó là tình trạng đáng buồn của [county.GetNameNoTooltip].\n\nTuy nhiên, có lẽ một số phương pháp mà chúng ta áp dụng tại [owner_county.GetNameNoTooltip] cũng có thể hữu ích ở [county.GetNameNoTooltip]. [target.GetFirstNameNoTooltip] đã nói rõ rằng một dự án phát triển đất đai được tài trợ tốt sẽ được đánh giá rất cao..."
  befriend_ongoing.6017.a:0 "Một kế hoạch tuyệt vời!"
  befriend_ongoing.6017.b:0 "Mặc dù Tình bạn với [target.GetFirstNamePossessiveNoTooltip] quý giá như vàng..."
  befriend_ongoing.6017.b.tt:0 "#F ... nhưng không nặng bằng thế này.#!"

  befriend_ongoing.6018.t:0 "Sự Phát Triển Thân Thiện"
  befriend_ongoing.6018.desc:1 "Nhận thấy những gợi ý tinh tế của Ta như khích lệ tích cực, [owner.GetTitledFirstName] đã tài trợ không gì khác ngoài một dự án tưới tiêu quy mô lớn ở [county.GetNameNoTooltip] của Ta!\n\nĐiều này có thể là vượt quá quyền hạn theo nhiều cách, nhưng với kỹ thuật áp dụng ở [owner_county.GetNameNoTooltip], [county.GetNameNoTooltip] có thể trở nên giàu có hơn bao giờ hết!"
  befriend_ongoing.6018.a:0 "Không theo lối truyền thống, nhưng Ta chắc chắn hoan nghênh!"

  befriend_ongoing.6019.t:0 "Kẻ chi kỉ: Khó Khăn Trong Cuộc Trò Chuyện"
  befriend_ongoing.6019.desc:0 "Ta đang bàn về [ROOT.Char.Custom('education_conversation_subject')] với [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target') )] [target.GetTitledFirstName] và [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('opinion_target') )] [opinion_target.GetTitledFirstName] khi nhận ra rằng [target.GetFirstNameNoTooltip] hoàn toàn lạc lõng với chủ đề...\n\nCố gắng không làm [target.GetHerHim] trông như kẻ ngốc, Ta bối rối khi [opinion_target.GetTitledFirstNameNoTooltip] yêu cầu một trong chúng Ta giải thích điều gì đó cho [opinion_target.GetHerHim]."
  befriend_ongoing.6019.a:0 "[target.GetFirstNameNoTooltip] nên giải thích, [target.GetSheHe] sở hữu một cái nhìn rất sắc bén!"
  befriend_ongoing.6019.b:0 "Bây giờ, hãy nghe Ta..."
  befriend_ongoing.6019.c:0 "Ta nghĩ sẽ tốt nhất nếu thảo luận theo nhóm!"
 
  befriend_ongoing.9001.t:0 "Kẻ chi kỉ: Cuộc Gặp Gỡ Tình Cờ"
  befriend_ongoing.9001.desc:0 "[target.GetTitledFirstName] đang đi du lịch và sẽ dành một vài đêm tại trang viên của một trong những nam tước của ta. Đây có thể là cơ hội mà ta đã chờ đợi!"
  befriend_ongoing.9001.a:0 "Chuẩn bị đoàn tùy tùng, chúng ta khởi hành ngay!"
  befriend_ongoing.9001.b:0 "Ta e rằng thời điểm chưa thích hợp..."

  befriend_ongoing.9100.t:0 "Kẻ chi kỉ: Cản Trở Quan Hệ"
  befriend_ongoing.9100.desc:0 "Ta vừa nhận được tin vô cùng đáng lo ngại! [scoped_rival.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_rival') )], [scoped_rival.GetTitledFirstName] đã lan truyền tin đồn sai lệch về Ta đến [target.GetFirstName], nói rằng mong muốn giành được lòng tin của [target.GetHerHis] chỉ là âm mưu lợi dụng [target.GetHerHim]."
  befriend_ongoing.9100.a:0 "Vô lý! Không ai tin những lời dối trá đó."
  befriend_ongoing.9100.b:0 "Ta sẽ không để [scoped_rival.GetHerHim] bôi nhọ danh tiếng tốt của Ta!"
  befriend_ongoing.9100.b.success.desc.tt:0 "Ta thuyết phục được [target.GetFirstNameNoTooltip]"
  befriend_ongoing.9100.b.success.desc.toast:0 "[target.GetFirstName] đã bị thuyết phục bởi lời thỉnh cầu của ta"
  befriend_ongoing.9100.b.failure.desc.tt:0 "Tin đồn của [scoped_rival.GetFirstNamePossessiveNoTooltip] vẫn tiếp tục lan truyền"
  befriend_ongoing.9100.c:0 "Tốt nhất là bỏ qua [scoped_rival.GetHerHim] hoàn toàn."

  befriend_ongoing.9101.t:0 "Kẻ chi kỉ: Hỗ Trợ Thân Thiện"
  befriend_ongoing.9101.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scoped_friend') )] thân mến của ta là [scoped_friend.GetFirstName] đã đánh hơi được mong muốn cải thiện vị thế của ta với [target.GetTitledFirstName] và đã đề nghị giúp đỡ ta.\n\n[scoped_friend.GetSheHe|U] đảm bảo với ta rằng [scoped_friend.GetSheHe] và [target.GetFirstNameNoTooltip] là những kiểu người tương tự nhau. [scoped_friend.GetFirstNameNoTooltip] biết chính xác những gì ta cần làm để giành được sự tin tưởng của [target.GetHerHis]."
  befriend_ongoing.9101.a:0 "Xin nói ra đi!"
  befriend_ongoing.9101.b:0 "Cảm ơn, nhưng Ta không cần giúp đỡ."
  befriend_ongoing.9102.desc:1 "Dạo này, có vẻ như [owner.GetFirstName] chỉ có thể nghĩ về một điều duy nhất. [target.GetSheHe|U] hoàn toàn cam kết giành được sự tin tưởng của [target.GetFirstNamePossessive], vì vậy ta quyết định giúp [owner.GetHerHim].\n\n[owner.GetFirstNameNoTooltip] rất vui mừng khi nhận được sự thấu hiểu của ta và tuyên bố [owner.GetSheHe] sẽ không quên cử chỉ tử tế này."
  befriend_ongoing.9102.a:0 "Chẳng phải đó là điều Bạn Bè nên làm sao?"

  befriend_ongoing.9103.t:0 "Kẻ chi kỉ: Hiểu Lầm Thảm Khốc"
  befriend_ongoing.9103.vassal.desc:0 "Ta đã hy vọng làm [target.GetTitledFirstName] bất ngờ với một bữa tiệc lớn để vinh danh [target.GetHerHis], nhưng [target.GetSheHe] lại quyết định hủy bỏ sự hiện diện vào phút chót.\n\nCó vẻ như [target.GetSheHe] nghĩ rằng sự bất ngờ của ta thực tế là một phần của âm mưu ám sát [target.GetHerHim]!"
  befriend_ongoing.9103.ruler.desc:1 "Ta gần đây đã gửi một sứ giả đến triều đình của [target.GetTitledFirstNamePossessive] để kể về sự giàu có và quyền lực của [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] với hy vọng giành được sự tôn trọng của [target.GetHerHis].\n\nTuy nhiên, khi nghe báo cáo của sứ giả, có vẻ như ta đã mang lại cho [target.GetHerHim] một ấn tượng rất khác. [target.GetSheHe|U] nghĩ rằng ta đang đe dọa xâm lược [target.GetHerHis] [target.GetPrimaryTitle.GetNameNoTierNoTooltip] trừ khi [target.GetSheHe] khuất phục trước ta!"
  befriend_ongoing.9103.a:0 "Hãy để [target.GetHerHim] nghĩ bất cứ điều gì [target.GetSheHe] muốn."
  befriend_ongoing.9103.b:0 "Có lẽ nên xin lỗi."

  befriend_ongoing.9104.t:0 "Kẻ chi kỉ: Lời Cống Hiến Thân Thiện"
  befriend_ongoing.9104.desc:0 "Cách nào tốt hơn để chiếm được cảm tình của [target.GetWomanMan] sùng đạo ngoài việc thể hiện công khai sự tận hiến với [owner.GetFaith.HighGodName]?\n\nTa tự hỏi cử chỉ nào sẽ phù hợp nhất cho dịp này..."
  befriend_ongoing.9104.a:0 "Một sự nhục nhã công khai chắc sẽ hiệu quả."
  befriend_ongoing.9104.b:0 "Đóng góp lớn cho [target.GetHerHis] [target.GetFaith.HouseOfWorship]."
  befriend_ongoing.9104.c:0 "Máu của người vô tội sẽ chứng minh sự quyết tâm của Ta!"
  befriend_ongoing.9104.d:0 "Nỗi đau của Ta vì tình yêu [owner.GetFaith.HighGodNamePossessive]!"
  befriend_ongoing.9104.e:0 "Nếu Ta bước lên bàn thờ của [target.GetHerHis] thì sao?"
  befriend_ongoing.9104.e.tt:0 "#F Ta sẽ tham gia [target.GetTitledFirstName] trong hiệp thông thiêng liêng#!"
  befriend_ongoing.9104.f:0 "Người Ngài [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_mate') )] của Ta sẽ làm dịu cơn khát của [target.GetHerHis]!"
  befriend_ongoing.9104.f.tt:0 "#F [scoped_mate.GetFirstName] sẽ đứng ra hòa giải với [target.GetTitledFirstName] thay Ta#!"
  befriend_ongoing.9104.g:0 "Dâng mình cho [target.GetFaith.HouseOfWorship]."
  befriend_ongoing.9104.h:0 "Dành [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_monk') )] của Ta cho đời sống tôn thờ."
  befriend_ongoing.9104.z:0 "Nghĩ lại thì..."
