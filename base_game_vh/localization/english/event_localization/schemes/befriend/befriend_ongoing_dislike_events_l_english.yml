l_english:
  befriend_ongoing_dislike.0001.t:0 "Kẻ chi kỉ: Món Quà Thân Thiện"
  befriend_ongoing_dislike.0001.desc:0 "Ta muốn [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] thích Ta hơn, và ai mà lại không thích quà chứ?"
  befriend_ongoing_dislike.0001.a:0 "[target.GetSheHe|U] chắc chắn sẽ ấn tượng với món này!"
  befriend_ongoing_dislike.0001.b:0 "Xét đến mối quan hệ của chúng Ta, thận trọng vẫn hơn."
  befriend_ongoing_dislike.0001.c:0 "Quà tặng không phải cách tốt."

  befriend_ongoing_dislike.0002.t:0 "Kẻ chi kỉ: Đối Mặt Với Sự Thù Địch"
  befriend_ongoing_dislike.0002.desc:0 "[target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] liên tục né tránh những nỗ lực của ta để kết bạn với [target.GetHerHim].\n\n[target.GetSheHe|U] đã nói rõ rằng [target.GetSheHe] nghĩ rằng mình sẽ không bao giờ coi trọng ta. Hoặc thậm chí tốt hơn một con giun đất."
  befriend_ongoing_dislike.0002.a:0 "Thật khó khăn..."
 
  befriend_ongoing_dislike.0003.t:0 "Kẻ chi kỉ: Giá Trị Của Sự Kiên Trì"
  befriend_ongoing_dislike.0003.desc:0 "Những lá thư và món quà mà Ta lo lắng dường như đã đến tay [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] vì [target.GetSheHe] cuối cùng đã trả lời!\n\nTuy nhiên, câu trả lời là nói rằng sự kiên trì của Ta đang làm phiền [target.GetHerHim]."
  befriend_ongoing_dislike.0003.a:0 "Ít nhất Ta cũng để lại ấn tượng!"
 
  befriend_ongoing_dislike.0004.t:0 "Kẻ chi kỉ: Trả Lại Người Gửi"
  befriend_ongoing_dislike.0004.desc:1 "Có vẻ như một vài bức thư thân thiện mà ta gửi cho [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] đã được trả lại cùng với sứ giả của ta, chưa mở.\n\nLàm sao [target.GetSheHe] không hiểu rằng ta chỉ đang cố gắng làm cho mọi thứ tốt đẹp hơn?"
  befriend_ongoing_dislike.0004.a:0 "Ta chỉ muốn [target.GetHerHim] thích Ta."
  befriend_ongoing_dislike.0004.b:0 "Ta sẽ để một sứ giả trực tiếp truyền lời!"
 
  befriend_ongoing_dislike.0005.t:0 "Kẻ chi kỉ: Tấm Lòng Dịu Dàng"
  befriend_ongoing_dislike.0005.desc:0 "Những nỗ lực của ta để cải thiện vị thế của mình trong mắt [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] chắc chắn đã đối mặt với nhiều thách thức, nhưng những người đưa tin của ta đã báo cáo rằng những lá thư của ta không còn được đón nhận với những tiếng càu nhàu thất vọng nữa.\n\nKhuôn mặt [target.GetHerHis|U] giờ đây thỉnh thoảng thể hiện một cái gì đó có thể là... sự quan tâm."
  befriend_ongoing_dislike.0005.a:0 "Haha, Ta sẽ chinh phục được [target.GetHerHim]!"
 
  befriend_ongoing_dislike.2001.t:0 "Kẻ chi kỉ: Không Mời"
  befriend_ongoing_dislike.2001.desc:0 "[target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] nổi tiếng là một [target.GetWomanMan] hòa đồng và thân thiện, háo hức dự tiệc và ăn mừng với người khác.\n\nTuy nhiên [target.GetSheHe] đã không mời ta đến bữa tiệc mới nhất của hắn tại trang viên của một nam tước, mặc dù nó khá gần với đất đai của ta, khiến ta trở thành một vị khách tự nhiên!"
  befriend_ongoing_dislike.2001.a:0 "Đây là một sự sỉ nhục nặng nề!"
  befriend_ongoing_dislike.2001.b:0 "Lỡ mất cơ hội, nhưng Ta không thể suy diễn quá nhiều."
 
  befriend_ongoing_dislike.2002.t:0 "Kẻ chi kỉ: Tiến Gần"
  befriend_ongoing_dislike.2002.desc:0 "Ai cũng biết rằng [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] khá nhút nhát, hiếm khi mong muốn dành nhiều thời gian với mọi người hơn mức [target.GetSheHe] cho là cần thiết.\n\nGiờ đây [target.GetSheHe] đã ngừng trả lời các thông báo của ta, và ta không chắc phải làm thế nào để tiếp tục."
  befriend_ongoing_dislike.2002.a:0 "Ta phải để [target.GetHerHim] có thời gian."
  befriend_ongoing_dislike.2002.b:0 "Ta sẽ làm cho [target.GetHerHim] nghe thấy Ta. Rất nhiều!"
 
  befriend_ongoing_dislike.5001.t:0 "Kẻ chi kỉ: Kẻ Hoài Nghi Và Kẻ Cuồng Tín"
  befriend_ongoing_dislike.5001.desc:0 "Nỗ lực giảm căng thẳng giữa Ta và [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] bị cản trở bởi sự ám ảnh vô lý của [target.GetHerHis] với việc Ta thiếu mộ đạo.\n\nDù [target.GetHerHis] có phàn nàn, [target.GetTitledFirstName] vẫn không giải thích được vì sao phải quan tâm đến [ROOT.GetCharacter.GetFaith.HighGodName] hơn Ta đã làm."
  befriend_ongoing_dislike.5001.a:0 "Chắc Ta nên thường xuyên đến [ROOT.Char.GetFaith.HouseOfWorship]."
  befriend_ongoing_dislike.5001.b:0 "Chúng ta sẽ phải tự xoay sở."
  befriend_ongoing_dislike.5001.c:0 "Ai quan tâm những nghi ngờ Ta đang ấp ủ!"
  befriend_ongoing_dislike.5002.t:0 "Kẻ chi kỉ: Tin Cậy Và Nghi Ngờ"
  befriend_ongoing_dislike.5002.desc:0 "Sẽ dễ dàng hơn nhiều để [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] thích Ta hơn nếu [target.GetSheHe] tin vào sự chân thành của Ta! Thay vào đó, [target.GetSheHe] cười khẩy và tự hỏi Ta mong đạt được gì từ sự tử tế này."
  befriend_ongoing_dislike.5002.a:0 "Ta sẽ kiên trì, nhưng không giả vờ ai khác."
  befriend_ongoing_dislike.5002.b:0 "À, vâng, có lẽ Ta đang muốn đạt được điều gì đó..."
  befriend_ongoing_dislike.5003.t:0 "Kẻ chi kỉ: Tâm Trạng Tồi"
  befriend_ongoing_dislike.5003.desc:0 "Tất cả những gì ta muốn là làm cho [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] thấy được niềm vui khi ở gần những người khác! Tuy nhiên, [target.GetSheHe] dường như luôn giữ mình và hiếm khi muốn rời khỏi phòng [target.GetHerHis] mình, trừ khi hoàn toàn cần thiết."
  befriend_ongoing_dislike.5003.a:0 "[target.GetSheHe|U] chỉ nên thôi nhõng nhẽo!"
  befriend_ongoing_dislike.5003.b:0 "Nếu [target.GetSheHe] cần không gian, Ta sẽ để [target.GetHerHim]."
  befriend_ongoing_dislike.5004.t:0 "Kẻ chi kỉ: Món Quà Lộng Lẫy Gây Thất Vọng"
  befriend_ongoing_dislike.5004.desc:0 "Ta muốn thể hiện thiện ý với [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] bằng cách chuẩn bị một bữa tiệc hoành tráng gửi tới [target.GetHerHis] [target.Custom('ResidenceBuilding')], nhưng Ta vừa nghe tin [target.GetSheHe] thậm chí không động vào chút nào!\n\nTa nghĩ có gì đó sai, nhưng hóa ra không phải ai cũng thích đồ ăn nhiều như Ta."
  befriend_ongoing_dislike.5004.a:0 "Ta sẽ xin lỗi vì quá lố."
  befriend_ongoing_dislike.5004.b:0 "Vậy thì hắn cứ để thức ăn [target.GetHerHis] của mình thối rữa đi."
  befriend_ongoing_dislike.5005.t:0 "Kẻ chi kỉ: Lời Kêu Gọi Hành Động"
  befriend_ongoing_dislike.5005.desc:0 "Ta đang cố gắng làm cho [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] hiểu ta hơn, nhưng tất cả những gì nó mang lại là việc ta ngày càng ít hiểu hắn. Động lực [target.GetHerHis] đâu, tham vọng [target.GetHerHis] đâu? Dường như [target.GetSheHe] sẽ chẳng quan tâm nếu mọi thứ giữ nguyên như hiện tại."
  befriend_ongoing_dislike.5005.a:0 "Ta sẽ tạm chấp nhận hiện tại."
  befriend_ongoing_dislike.5005.b:0 "Một người như vậy có đáng để quen biết không?"
  befriend_ongoing_dislike.5005.c:0 "Tham vọng bí mật của họ là gì vậy?!"
