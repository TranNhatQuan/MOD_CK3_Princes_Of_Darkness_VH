l_english:
  befriend_outcome.1001.t:0 "Kẻ chi kỉ: Một Buổi Tối Ra Ngoài"
  befriend_outcome.1001.desc:0 "Sau khi biết rằng [target.GetTitledFirstName] sẽ là khách tại một dinh thự ở [barony.Custom('BaronyTownType')] của [barony.GetNameNoTier], Ta nhận ra đây là dịp hoàn hảo để gặp gỡ [target.GetHerHim].\n\n"
  befriend_outcome.1002.t:0 "Kẻ chi kỉ: Tại Điệu Nhảy"
  befriend_outcome.1002.desc:0 "Sau khi biết rằng [target.GetTitledFirstName] sẽ tham dự buổi dạ hội ở [barony.Custom('BaronyTownType')] của [barony.GetNameNoTier], Ta quyết định đây là dịp hoàn hảo để ghé thăm và có chút thời gian đối mặt với [target.GetHerHim]!\n\n"
  befriend_outcome.1201.t:0 "Kẻ chi kỉ: Một Cuộc Gặp Chính Thức"
  befriend_outcome.1201.desc:0 "Mặc dù đã có những bất đồng trước đây, các cố vấn của [target.GetTitledFirstNamePossessive] đề xuất một cuộc gặp như cơ hội để xóa bỏ mọi khác biệt và đặt kiếm sang một bên.\n\n"

  befriend_outcome.1301.t:0 "Kẻ chi kỉ: Thăm Trang Viên"
  befriend_outcome.1301.desc:0 "Sau nhiều suy nghĩ, cuối cùng Ta quyết định mời [target.GetTitledFirstName] tham quan một trong những trang viên của Ta ở [barony.GetNameNoTier]."

  befriend_outcome.2001.t:0 "Kẻ chi kỉ: Một Buổi Tối Thú Vị"
  befriend_outcome.2001.desc:0 "Theo yêu cầu của Ta, Ta được xếp ngồi cạnh [target.GetHerHim] trong suốt bữa tối, và cả hai chúng Ta đều có khoảng thời gian tuyệt vời! Ta ngạc nhiên vì chúng Ta có rất nhiều điều để nói."
  befriend_outcome.2001.a:0 "Thật là một [target.GetWomanMan] dễ mến!"

  befriend_outcome.2002.t:0 "Kẻ chi kỉ: Điệu Nhảy"
  befriend_outcome.2002.desc:0 "Buổi dạ hội thật tuyệt vời, và [target.GetTitledFirstName] đã biểu diễn xuất sắc! Sau đó, Ta nói với [target.GetHerHim] rằng Ta rất ấn tượng, và chúng Ta bắt đầu trò chuyện."
  befriend_outcome.2002.a:0 "Một ngày thật tuyệt vời!"

  befriend_outcome.2003.t:0 "Kẻ chi kỉ: Buổi Tối Cùng Nhau"
  befriend_outcome.2003.opening:0 "Sau nhiều chuẩn bị công phu, cuối cùng Ta có thể dành một buổi tối riêng với [target.GetTitledFirstName], để"
  befriend_outcome.2004.opening:0 "Sau nhiều chuẩn bị công phu, cuối cùng Ta có thể dành chút thời gian riêng với [target.GetTitledFirstName]."
  befriend_outcome.2003.same_fame:0 "kết nối về những thời khắc đã qua, những hành động cũ, và thế giới kỳ lạ mà chúng ta đang sống."
  befriend_outcome.2003.same_lifestyle:0 "nói về những điều làm cho cuộc sống đáng sống, và chia sẻ vài câu chuyện hay."
  befriend_outcome.2003.same_education:0 "thảo luận về [ROOT.GetCharacter.Custom('education_conversation_subject')]."
  befriend_outcome.2003.deceitful:0 "Cuối cùng Ta cũng dành được chút thời gian với [target.GetTitledFirstName] để thảo luận về [target.Custom('education_conversation_subject')]. May mắn thay, [target.GetSheHe] không nhận ra rằng Ta hiểu rất ít về điều mình đang nói."
  befriend_outcome.2003.fallback:0 "chia sẻ vài câu chuyện và khám phá sở thích chung."
  befriend_outcome.2003.great_time:0 "\n\nKhi Ta rời đi, [target.GetTitledFirstName] nói rằng thật tốt khi được nói chuyện với người thực sự hiểu [target.GetHerHim]. Ta hoàn toàn đồng ý."
  befriend_outcome.2003.a:0 "Chúng Ta gần gũi hơn bao giờ hết."

  befriend_outcome.2201.t:0 "Kẻ chi kỉ: Ngoại Giao Hiệu Quả"
  befriend_outcome.2201.desc:0 "Sau khi ngồi lại với [target.GetTitledFirstName] như những người bình đẳng thay vì kẻ thù, Ta cảm thấy mình đã học được rất nhiều về [target.GetHerHim]. [target.GetSheHe|U] cũng nhận thấy rằng theo thời gian, chúng Ta có thể nhìn nhận nhau đồng cảm."
  befriend_outcome.2201.a:0 "[target.GetSheHe|U] còn mỉm cười với Ta trước khi Ta rời đi."

  befriend_outcome.2301.desc:0 "\n\nChuyến thăm hóa ra còn tuyệt hơn Ta tưởng. Không chỉ [target.GetTitledFirstName] đưa ra những hiểu biết bất ngờ về các vấn đề trang viên, mà [target.GetSheHe] còn giữ tâm trạng Ta vui vẻ suốt thời gian đó."
  befriend_outcome.2301.increase_opinion:0 "Ta cảm thấy như chúng Ta hiểu nhau theo những cách mà trước đây chưa từng."
  befriend_outcome.2301.a:0 "Chuyến đi thật đáng công sức."
  befriend_outcome.4001.t:0 "Kẻ chi kỉ: Một Bữa Ăn Ngượng Ngùng"
  befriend_outcome.4001.desc:0 "Khi đến giờ, Ta được xếp ngồi ngay cạnh [target.GetTitledFirstName] suốt bữa tối, nhưng Ta chẳng nói được gì thú vị!"
  befriend_outcome.4001.b:0 "Ái chà, Ta bỏ cuộc!"

  befriend_outcome.4002.t:0 "Kẻ chi kỉ: Điệu Nhảy"
  befriend_outcome.4002.desc:0 "Ngày dạ hội trời xám xịt, và không như những lễ hội Ta mong đợi, bầu không khí thật u ám."
  befriend_outcome.4002.a:0 "Lần sau gặp [target.GetHerHim], thôi!"
  befriend_outcome.4002.b:0 "Thật vô vọng..."

  befriend_outcome.4003.t:0 "Kẻ chi kỉ: Một Sai Lầm"
  befriend_outcome.4003.same_fame:0 "Vì nổi tiếng với nhiều điều giống nhau, Ta nghĩ [target.GetTitledFirstName] và Ta sẽ có nhiều điểm chung. Nhưng nếu có, Ta cũng không tìm ra."
  befriend_outcome.4003.same_lifestyle:0 "Ta chắc chắn rằng [target.GetTitledFirstName] và Ta sống cuộc đời theo cách rất giống nhau, nhưng sau vài giờ trò chuyện với [target.GetHerHim], Ta không còn chắc nữa..."
  befriend_outcome.4003.same_education:0 "Ta thật sự tin rằng [target.GetTitledFirstName] và Ta nhìn thế giới cùng một cách, nhưng sau vài giờ cãi vã về [target.Custom('education_conversation_subject')] mà chẳng tìm thấy điểm chung, Ta buộc phải thừa nhận mình sai lầm nghiêm trọng."
  befriend_outcome.4003.deceitful:0 "Ta nghĩ mình có thể giả vờ hiểu về bất cứ điều gì [target.GetTitledFirstName] muốn thảo luận, nhưng đến giờ thứ ba về [target.Custom('education_conversation_subject')], nỗ lực giao tiếp của Ta hoàn toàn sụp đổ."
  befriend_outcome.4003.fallback:0 "Dù ban đầu Ta nghĩ sao, Ta chẳng thể tìm được điểm chung nào để kết nối với [target.GetTitledFirstName]."
  befriend_outcome.4003.bad_time:0 "\n\nChán nản, Ta rời đi, và có vẻ như [target.GetSheHe] vui mừng khi thấy Ta ra đi."
  befriend_outcome.4003.b:0 "Tình  Bạn củachúng Ta không định tồn tại."

  befriend_outcome.4201.t:0 "Kẻ chi kỉ: Một Cuộc Gặp Lạnh Lùng"
  befriend_outcome.4201.desc:0 "Thật không may, dù có ý tốt, cuộc gặp gỡ chỉ khiến Ta nhớ tại sao chúng Ta không hợp nhau."
  befriend_outcome.4201.b:0 "Ta không nên thử điều này."

  befriend_outcome.4301.desc:0 "\n\nThật không may, chuyến đi hóa ra là một ý tưởng thảm họa. [target.GetTitledFirstName] chuẩn bị kém, và mỗi khi Ta cố gắng làm nhẹ bầu không khí, [target.GetSheHe] chỉ đáp lại bằng vẻ bất mãn lén lút."
  befriend_outcome.4301.b:0 "Sau tất cả, Ta bỏ cuộc."

  befriend_outcome.6001.begin_friendship:0 "\n\nKhi Ta rời đi, cảm giác như chúng Ta đã biết nhau cả đời."

  befriend_outcome.6301.begin_friendship:0 "\n\n[target.GetSheHe|U] không chỉ là [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] của Ta mà còn là Bạn ta."
 
  befriend_outcome.8001.disastrous_time:0 "\n\nKhi Ta rời đi, Ta thề rằng [target.GetSheHe] đã nhìn Ta bằng một ánh mắt xấu xa nhất mà Ta từng thấy."
 
  befriend_outcome.8201.disastrous_time:0 "\n\nMột lúc, Ta vô tình xúc phạm cả mẹ [target.GetHerHis] #EMP và#! con ngựa yêu thích của [target.GetHerHis]."
 
  befriend_outcome.8301.disastrous_time:0 "\n\nSau khi trở về, [target.GetSheHe] gần như không muốn nói chuyện với Ta!"
 
  befriend_outcome.9800.t:0 "Kẻ chi kỉ: Chia Sẻ Nỗi Buồn Là Giảm Một Nửa Nỗi Buồn"
  befriend_outcome.9800.desc:0 "Khi gián điệp của Ta kể về chuyến thăm hàng năm của [target.GetTitledFirstNamePossessive] tới"
  befriend_outcome.9800.desc_same_parent.our_parent:0 "ngôi mộ của [target_dead_parent.Custom('MotherFather')] chúng Ta,"
  befriend_outcome.9800.desc_strangers.their_parent:0 "ngôi mộ của [target.GetHerHis] [target_dead_parent.Custom('MotherFather')],"
  befriend_outcome.9800.mid.desc:0 "Ta ngay lập tức nhận ra đây là cơ hội tốt nhất để xóa khoảng cách giữa chúng Ta.\n\nKhi ngày đến, Ta thấy [target.GetTitledFirstNameNoTooltip] quỳ trước bia mộ.\n\n\"Xin lỗi đã làm phiền,\" Ta nói bằng giọng nhỏ."
  befriend_outcome.9800.desc_same_parent.dialogue:0 "\"Ta biết [target_dead_parent.GetSheHe] rất quan trọng với Ngài. Ta cũng nhớ [target_dead_parent.GetHerHim].\""
  befriend_outcome.9800.desc_strangers.dialogue:0 "\"Ta muốn gửi lời chia buồn. Ta cũng biết cảm giác mất cha mẹ như thế nào.\""
  befriend_outcome.9800.end:0 "\n\nChúng Ta chia sẻ những câu chuyện về người thân đã mất trong vài giờ và rời đi với tâm hồn nhẹ nhõm hơn."

  befriend_outcome.9800.a:0 "Nỗi buồn của chúng Ta đã kết nối chúng Ta."

  befriend_outcome.9900.t:0 "Kẻ chi kỉ: Cảm xúc Tràn ngập"
  befriend_outcome.9900.end:0 "Thật không may, ngay khi [target.GetTitledFirstName] nhìn thấy ta, [target.GetSheHe] đứng bật dậy và lao về phía ta, đầy giận dữ."
  befriend_outcome.9900.b:0 "...Có phải lúc này không phải là thời điểm thích hợp?"

  befriend_outcome.0002.t:0 "Tình  Bạn của[owner.GetTitledFirstNamePossessiveNoTooltip]"
  befriend_outcome.0002.critsucc.desc:0 "Đã rõ ràng từ lâu rằng [owner.GetTitledFirstName] đã cố gắng [GetScheme('befriend').GetTypeName|l] ta.\n\nTrong nhiều dịp, [owner.GetSheHe] đã chứng minh [owner.GetHerselfHimself] là một người [owner.GetWomanMan] đáng tin cậy và thẳng thắn, chỉ có ý muốn tốt nhất cho ta."
  befriend_outcome.0002.succ.desc:0 "Đã rõ ràng từ lâu rằng [owner.GetTitledFirstName] đã cố gắng [GetScheme('befriend').GetTypeName|l] ta.\n\nTa bắt đầu nhận ra [owner.GetTitledFirstName] và ta có bao nhiêu điểm chung, và [owner.GetSheHe] đã chứng tỏ [owner.GetHerselfHimself] đáng tin cậy như thế nào trong vài tháng qua."
  befriend_outcome.0002.fail.desc:1 "Đã rõ ràng từ lâu rằng [owner.GetTitledFirstName] đã cố gắng [GetScheme('befriend').GetTypeName|l] ta.\n\nTa không thể không cảm thấy khó chịu trước sự quan tâm đột ngột của [owner.GetTitledFirstNamePossessive] dành cho ta. Và ta không thể xua đi cảm giác rằng ý định của [owner.Custom('WomanManPossessive')] không hề trong sáng..."
  befriend_outcome.0002.critfail.desc:1 "Đã rõ ràng từ lâu rằng [owner.GetTitledFirstName] đã cố gắng [GetScheme('befriend').GetTypeName|l] ta.\n\nTa không thể không cảm thấy khó chịu trước sự quan tâm đột ngột của [owner.GetTitledFirstNamePossessive] dành cho ta. Nếu có gì, thì mong muốn ám ảnh của [owner.GetHerHis] nhằm gây ấn tượng với ta và những biểu hiện vụng về của sự tình cảm giả tạo chỉ khiến ta ghét [owner.GetHerHim] hơn."
  befriend_outcome.0002.a:0 "Thật hiếm khi tìm thấy một người Ngài chân thành."
  befriend_outcome.0002.b.success:0 "Chúng ta nên dành nhiều thời gian bên nhau hơn!"
  befriend_outcome.0002.b.failure:0 "Nhưng [owner.GetSheHe] vẫn có một sức hút nào đó..."
  befriend_outcome.0002.c.success:0 "Ta vẫn chưa bị thuyết phục."
  befriend_outcome.0002.c.failure:0 "Tại sao [owner.GetSheHe] không thể để Ta yên?"
  befriend_outcome.0002.d:0 "Ta không muốn thấy mặt [owner.GetHerHis] lần nào nữa!"

  befriend_outcome.2004.t:0 "Kẻ chi kỉ: Tâm hồn Đồng điệu"
  befriend_outcome.2004.spouse:0 "\n\nKhi chúng Ta trở về phòng vào cuối buổi tối, Ta cảm nhận được [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] trông thoải mái và dễ chịu hơn với Ta rất nhiều."
  befriend_outcome.2004.relative:0 "\n\nTa rất vui khi có cơ hội này để tăng cường mối quan hệ gia đình, và dựa vào thái độ của [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('target'))] vào cuối buổi tối, [target.GetSheHe] cũng vậy."
  befriend_outcome.2004.vassal:0 "\n\nCuối bữa tối, [target.GetTitledFirstNameNoTooltip] nói với Ta rằng [target.GetSheHe] biết ơn vì có một chúa tể hiếu khách và thân thiện, và [target.GetSheHe] hy vọng sẽ có dịp báo đáp lòng tốt của Ta trong tương lai."
  befriend_outcome.2004.liege:0 "\n\nĐể thể hiện lòng biết ơn, chỉ vài ngày sau cuộc gặp riêng, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] đã khen ngợi lòng hiếu khách của Ta trước toàn bộ triều đình, nói rằng [target.GetSheHe] thật may mắn khi có một thần tử trung thành và thân thiện như Ta dưới sự bảo vệ của [target.GetHerHis]."
  befriend_outcome.2004.outsider:0 "\n\nCuối cùng, khoảng cách không phải là rào cản lớn để Ta giành được sự tin tưởng và tình  Bạn của[target.GetTitledFirstNamePossessiveNoTooltip]. Ta chỉ hy vọng mối quan hệ chúng Ta xây dựng hôm nay sẽ ngày càng bền chặt trong những năm tới."
  befriend_outcome.2004.fallback:0 "\n\nTa đã học được nhiều điều về [target.GetTitledFirstNameNoTooltip] trong cuộc gặp, và Ta chắc chắn rằng [target.GetHerHim] cũng vậy. Ta thực sự nghĩ rằng buổi tối bên nhau này đã giúp chúng Ta xây dựng phần nào sự tin tưởng lẫn nhau."


  befriend_outcome.6004.spouse:0 "\n\nKhi chúng Ta trở về phòng vào cuối buổi tối, Ta chắc chắn rằng mình có thể hoàn toàn tin tưởng [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))], và biết rằng [target.GetSheHe] cũng cảm thấy như vậy về Ta."
  befriend_outcome.6004.relative:0 "\n\nTa rất vui khi có cơ hội này để củng cố mối quan hệ gia đình và, đến cuối bữa tối, Ta hoàn toàn chắc chắn rằng [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('target'))] cũng cảm thấy như vậy."
  befriend_outcome.6004.vassal:0 "\n\nCuối bữa tối, [target.GetTitledFirstNameNoTooltip] cũng chắc chắn rằng Ta luôn quan tâm đến lợi ích của [target.GetHerHis] như [target.GetSheHe] quan tâm đến Ta. Nhờ nỗ lực của mình, chúng Ta đã xây dựng được một mối quan hệ tin tưởng và trung thành, điều hiếm khi đạt được giữa chúa tể và thần tử."
  befriend_outcome.6004.liege:0 "\n\nĐể tỏ lòng biết ơn, chỉ vài ngày sau cuộc gặp riêng tư của chúng ta, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] của ta đã quyết định ca ngợi sự hiếu khách của ta trước toàn thể triều đình, tuyên bố rằng [target.GetSheHe] thật may mắn khi có một chư hầu trung thành và chào đón như ta dưới sự bảo hộ của [target.GetHerHis] và rằng [target.GetSheHe] tự hào gọi ta là bạn của [target.GetHerHis]."
  befriend_outcome.6004.outsider:0 "\n\nCuối cùng, khoảng cách không phải là rào cản lớn để Ta giành được sự tin tưởng và tình  Bạn của[target.GetTitledFirstNamePossessiveNoTooltip]. Chúng Ta đã học được nhiều điều về nhau trong cuộc gặp, đến mức chúng Ta ra về với tư cách là Bạn Bè."

  befriend_outcome.4004.t:0 "Kẻ chi kỉ: Khác biệt Không thể Hòa giải"
  befriend_outcome.4004.spouse:0 "Dù Ta đã cố gắng hết sức để gây ấn tượng với [target.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] vẫn đối xử với Ta bằng sự nghi ngờ và xa cách."
  befriend_outcome.4004.relative:0 "Ta nghĩ việc củng cố mối quan hệ với [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] sẽ dễ dàng... Ta đã sai lầm. Dù nỗ lực hết sức, [target.GetTitledFirstName] dường như hoàn toàn không quan tâm đến việc dành thời gian với Ta hay tìm hiểu sở thích của Ta."
  befriend_outcome.4004.vassal:0 "Bất chấp nhiều nỗ lực của ta để giành được sự tin tưởng của [target.GetTitledFirstNamePossessive], [target.GetSheHe] vẫn giữ khoảng cách khi nói chuyện với ta. Sự khác biệt về cấp bậc của chúng ta dường như là một trở ngại quá lớn để [target.GetHerHim] có thể vượt qua."
  befriend_outcome.4004.liege:0 "[target.GetTitledFirstName] hoàn toàn không bị ấn tượng bởi nhiều nỗ lực của ta để giành được sự tin tưởng của [target.GetHerHis]. Nghe những lời đồn thổi lưu hành trong triều đình, ta nhận ra rằng [target.GetSheHe] đã coi ta chỉ là một kẻ nịnh hót tìm kiếm sự ưu ái của [target.GetHerHis]."
  befriend_outcome.4004.outsider:0 "Thật không may, có vẻ như những khác biệt và khoảng cách giữa [target.GetTitledFirstName] và ta quá lớn để có thể vượt qua, bất kể sự quyết tâm của ta. Sau tất cả thời gian ta dành để cố gắng giành được sự tin tưởng của [target.GetHerHis], [target.GetTitledFirstNameNoTooltip] đã không cho thấy bất kỳ sự thay đổi nào trong thái độ của [target.GetHerHis] đối với ta."
  befriend_outcome.4004.ending:0 "\n\nTa e rằng không còn gì nhiều Ta có thể làm để thu hẹp khoảng cách giữa chúng Ta vào lúc này."
 
  befriend_outcome.8005.desc:0 "Ta thật là một kẻ ngốc khi hy vọng có thể thay đổi suy nghĩ của [target.GetTitledFirstNamePossessive] về ta. \n\n[target.GetSheHe|U] chỉ lợi dụng sự cởi mở và thân thiện gần đây của ta đối với [target.GetHerHim] để công khai chế nhạo ta, cho rằng ta chẳng là gì ngoài một kẻ không bạn bè thảm hại, quá háo hức muốn tự làm nhục [owner.GetHerselfHimself] chỉ vì sợ cô đơn."
  befriend_outcome.8005.a:0 "Ta đã nên dự đoán điều đó từ [target.GetHerHim]."
  befriend_outcome.2005.t:0 "Kẻ chi kỉ: Chấm dứt Mâu thuẫn"
  befriend_outcome.2005.relative:0 "Ban đầu không dễ để thuyết phục [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] về sự chân thành của Ta, nhưng dần dần, Ta đã làm cho [target.GetHerHim] hiểu rằng Ta sẵn sàng chấm dứt sự cạnh tranh vì lợi ích của cả hai chúng Ta."
  befriend_outcome.2005.vassal:0 "Không bao giờ là một dấu hiệu tốt khi một lãnh chúa mâu thuẫn với chư hầu của mình. Nhờ những nỗ lực ngoại giao của ta, ta đã có thể giải quyết những bất đồng mà ta có với [target.GetTitledFirstName].\n\nNếu may mắn, chúng ta sẽ có thể học cách tin tưởng lẫn nhau nhiều hơn khi chúng ta tiến về phía trước. Hiện tại, ta chỉ vui vì không còn coi [target.GetHerHim] là kẻ thù nữa."
  befriend_outcome.2005.liege:0 "Sự ổn định của bất kỳ vương quốc nào phụ thuộc vào sự đồng thuận tôn trọng giữa một lãnh chúa và chư hầu của [target.GetHerHis]. Ta vui mừng vì đã có thể thuyết phục [target.GetTitledFirstName] rằng sự xung đột giữa chúng ta sẽ chỉ mang lại nỗi đau không cần thiết cho thần dân của chúng ta.\n\nTa cảm thấy nhẹ nhõm khi biết rằng cuối cùng chúng ta đã giải quyết được những khác biệt."
  befriend_outcome.2005.fallback:0 "Không dễ để thuyết phục [target.GetTitledFirstName] gặp ta để giải quyết những khác biệt, tuy nhiên, khi ta cuối cùng đã có thể ngồi xuống với [target.GetHerHim] và giải thích lý do cho những bất đồng trong quá khứ, ta thấy [target.GetHerHim] hợp lý hơn nhiều so với những gì ta lo sợ."
  befriend_outcome.2005.a:0 "Cuối cùng chúng ta có thể bắt đầu lại."
  befriend_outcome.8006.t:0 "Kẻ chi kỉ: Chính trị Không thể Hòa giải"
  befriend_outcome.8006.desc:0 "Ta đã dành tuần qua gặp gỡ [target.GetTitledFirstName] để làm [target.GetHerHim] hiểu rằng không cần thiết phải là kẻ thù.\n\nThật không may, dường như nỗ lực của Ta để làm dịu phe phái của [target.GetHerHis] chỉ làm nó thêm kiên quyết."
  befriend_outcome.8006.everyfactionmember.custom:0 "Mọi thành viên của [target.GetTitledFirstNamePossessive] [faction|E]"
  befriend_outcome.8006.a:0 "Ta không nên tin tưởng [target.GetWomanMan] đó."
  befriend_outcome.8007.t:0 "Kẻ chi kỉ: Giá trị của Sự Tin tưởng"
  befriend_outcome.8007.desc:0 "Đêm qua, như một nỗ lực cuối cùng để giành được tình cảm của [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('target'))], Ta quyết định tiết lộ với [target.GetHerHim] một trong những bí mật đáng xấu hổ nhất của Ta. Ta hy vọng sự thành thật của mình sẽ thu hẹp khoảng cách giữa chúng Ta, nhưng Ta đã nhầm.\n\n[target.GetSheHe|U] hiện đang đe dọa tiết lộ bí mật của Ta trước toàn bộ triều đình trừ khi Ta nhượng bộ yêu cầu của [target.GetHerHis]!"
  befriend_outcome.8007.a:0 "Được thôi! Cần bao nhiêu?"
  befriend_outcome.8007.b:0 "Dù sao cũng được, thân yêu!"
  befriend_outcome.8007.c:0 "Ta sẽ không để chính [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] tống tiền mình!"
  befriend_outcome.8008.t:0 "Kẻ chi kỉ: Mâu thuẫn Linh mục"
  befriend_outcome.8008.desc:0 "Thật không may, có vẻ như [target.GetTitledFirstName] tin rằng nỗ lực giành sự tin tưởng của [target.GetHerHis] chỉ là một âm mưu để đạt được sự xá tội từ những tội lỗi của ta trong mắt [ROOT.Char.GetFaith.HighGodNameAlternate].\n\nNhư thể việc từ chối lời đề nghị tình bạn của ta là chưa đủ, [target.GetTitledFirstNameNoTooltip] đã bắt đầu bôi nhọ tên tuổi của ta khi thuyết giáo cho người dân [owner.GetPrimaryTitle.GetName]!"
  befriend_outcome.8008.a:0 "Đủ rồi! Ta bỏ cuộc!"
  befriend_outcome.8009.t:0 "Kẻ chi kỉ: Nịnh hót Không Đúng"
  befriend_outcome.8009.desc:0 "Ta tin rằng việc ca ngợi công khai nhiều phẩm chất và khả năng lãnh đạo của [target.GetTitledFirstNamePossessive] sẽ giúp Ta được [target.GetHerHis] quý mến. Thật đáng tiếc, Ta đã nhầm.\n\nNgay khi kết thúc bài phát biểu, [target.GetTitledFirstNameNoTooltip] chế nhạo Ta trước toàn triều đình, nói rằng Ta chỉ là kẻ nịnh hót hèn nhát, cố nâng tầm của [owner.GetHerHis] bằng cách liếm giày của những người quyền cao chức trọng hơn [owner.GetHerHis]."
  befriend_outcome.8009.everycourtier.custom:0 "Mọi thành viên của triều đình [target.GetTitledFirstNamePossessive]"
  befriend_outcome.8009.a:0 "Nhưng Ta nói thật lòng!"
  befriend_outcome.2006.t:0 "Kẻ chi kỉ: Thấu hiểu Lẫn nhau"
  befriend_outcome.2006.desc:0 "Cuối cùng ta đã thuyết phục [target.GetTitledFirstName] từ bỏ sự ủng hộ sai lầm của [target.GetHerHis] đối với [targeting_faction.GetName].\n\nHóa ra, chúng ta có nhiều điểm chung hơn cả hai chúng ta nghĩ lúc đầu."
  befriend_outcome.2006.a:0 "Luôn tốt khi lý trí chiến thắng."
  befriend_outcome.6006.t:0 "Kẻ chi kỉ: Chính trị Hòa giải"
  befriend_outcome.6006.desc:0 "Nhờ kỹ năng ngoại giao sắc bén, Ta đã thuyết phục [target.GetTitledFirstName] không chỉ từ bỏ lãnh đạo [scoped_faction.GetName] mà còn giải tán hoàn toàn, tránh nguy cơ nội chiến."
  befriend_outcome.6007.desc:0 "Ta không thể hiểu bằng cách nào, nhưng [owner.GetTitledFirstName] đã thuyết phục [target.GetTitledFirstName] giải tán phe phái của [target.GetHerHis].\n\n[target.GetSheHe|U] đã tập hợp tất cả các thành viên vào đêm qua, tuyên bố rằng [target.GetSheHe] đã sai lầm khi phản đối [owner.GetTitledFirstNameNoTooltip] và rằng [target.GetSheHe] mong muốn một giải pháp hòa bình cho cuộc xung đột của chúng ta."
  befriend_outcome.6007.a.a:0 "[target.GetTitledFirstNameNoTooltip] đã phản bội chúng ta!"
  befriend_outcome.6007.a.b:0 "Có lẽ [target.GetSheHe] cũng có lý..."

 # Travel Befriend Success Outcome
  befriend_outcome.2007.opening_travel:0 "Thật vui mừng, một trong những người đưa tin của [target.GetTitledFirstNamePossessive] đã tìm thấy Ta ở [current_location.GetName] khi đoàn tùy tùng của Ta và Ta đang tiến về [next_destination.GetName].\n\n"
  befriend_outcome.2007.opening_no_travel:0 "Thật vui mừng, một trong những người đưa tin của [target.GetTitledFirstNamePossessive] đã đến [ROOT.Char.Custom('FortifiedBuilding')] của Ta tại [ROOT.Char.GetCurrentLocation.GetName].\n\n"
  befriend_outcome.2007.desc:0 "[courier.GetSheHe|U] mang tin vui, vì [target.GetFirstNameNoTooltip] muốn chính thức hóa tình  Bạn củachúng Ta! Ta chưa bao giờ nghĩ chúng Ta sẽ thân thiết đến vậy, nhưng [target.GetSheHe] đã chứng minh [target.GetHerselfHimself] là một [target.GetWomanMan] đáng tin cậy và thẳng thắn, luôn đặt lợi ích tốt nhất của Ta lên hàng đầu."
