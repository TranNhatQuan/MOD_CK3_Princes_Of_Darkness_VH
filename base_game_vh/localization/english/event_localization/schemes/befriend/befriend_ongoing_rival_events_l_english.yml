l_english:
  befriend_ongoing_rival.3000.t:0 "Kẻ chi kỉ: Một Cân Bằng Tinh Tế"
  befriend_ongoing_rival.0001.t:0 "Kẻ chi kỉ: Trả Lại Người Gửi"
  befriend_ongoing_rival.0001.desc:0 "Ta cẩn thận cân nhắc từng lời khi viết thư gửi [target.GetTitledFirstName]. Ngay cả khi đặt bút xuống và trở về phòng riêng, Ta vẫn không thể ngừng nghĩ về những cụm từ và ý nghĩa ẩn có thể gây xúc phạm.\n\nTa hy vọng bức thư sẽ trở thành bước ngoặt trong nỗ lực của mình, nhưng Ta đã lầm to. Hôm nay, thư được trả lại mà không mở!"
  befriend_ongoing_rival.0001.a:0 "Thật là một [target.Custom2('InsultNoun', ROOT.Char)] vô ơn!"
  befriend_ongoing_rival.0002.t:0 "Kẻ chi kỉ: Dùi Đập và Tận Tụy"
  befriend_ongoing_rival.0002.desc:0 "Ta đã dành đủ thời gian gần [target.GetTitledFirstNamePossessive] để biết rằng [target.GetSheHe] có thể nói về [target.Custom('herhis_subject_of_interest')] hàng giờ. Ta đã nghiên cứu và chuẩn bị một vài câu hỏi, hi vọng có được một cuộc thảo luận hiệu quả.\n\nThật không may, Ta đã lầm to. Chỉ trong vài phút, chúng Ta đã tìm ra điểm bất đồng và lao vào một trận tranh cãi ầm ĩ."
  befriend_ongoing_rival_0002.a:0 "Ta sẽ nuốt nhục và ủng hộ quan điểm của [target.GetHerHis]."
  befriend_ongoing_rival_0002.b:0 "Giá mà Ta có thể làm [target.GetHerHim] hiểu..."
  befriend_ongoing_rival_0002.b.tt:0 "Tiến trình kế hoạch của Ta sẽ bị ảnh hưởng tích cực hay tiêu cực tùy theo kết quả."
  befriend_ongoing_rival_0002.c:0 "Ta không bao giờ đồng ý với quan điểm lố bịch đó!"
  befriend_ongoing_rival.0003.t:0 "Kẻ chi kỉ: Đồng Thuận"
  befriend_ongoing_rival.0003.desc:0 "Sau khá nhiều tranh cãi và lời nguyền rủa, cuối cùng có vẻ như [target.GetTitledFirstName] và Ta đã tìm thấy một điểm chung trong vấn đề này.\n\nChúng Ta có thể chưa chia tay như những người Ngài, nhưng Ta cảm thấy chúng Ta đang tiến triển."
  befriend_ongoing_rival_0003.a:0 "Có lẽ vẫn còn chút hy vọng cho chúng Ta."
  befriend_ongoing_rival.0004.t:0 "Kẻ chi kỉ: Một Sai Lầm Ngớ Ngẩn"
  befriend_ongoing_rival.0004.desc:0 "Ta cố gắng giải thích quan điểm theo cách mà [target.GetTitledFirstNamePossessive] có thể hiểu, nhưng cuối cùng chỉ tự làm mình rối trong lập luận. \n\nĐiều này cho [target.GetHerHim] nhiều cơ hội để tấn công, và Ta ra khỏi cuộc tranh luận trông như một kẻ ngốc thực thụ."
  befriend_ongoing_rival_0004.a:0 "[target.GetTitledFirstNameNoTooltip] có lẽ đã thắng lần này..."
  befriend_ongoing_rival.0005.t:0 "Kẻ chi kỉ: Trong Ánh Sáng Xấu"
  befriend_ongoing_rival.0005.desc:0 "Khi [spymaster.GetTitledFirstName] báo cho Ta về tin đồn xấu về Ta lan truyền trong triều đình, Ta cảm thấy cơn giận dâng lên. Ta bảo [spymaster.GetHerHim] điều tra nguồn tin, và không có gì ngạc nhiên, thủ phạm không ai khác chính là [target.GetTitledFirstName].\n\n[ROOT.Char.GetFaith.HighGodName], sao [target.Custom2('InsultNoun', ROOT.Char)] dối trá đó không ngừng việc này?!"
  befriend_ongoing_rival_0005.a:0 "Ta phải tự bảo vệ mình khỏi những lời dối trá bẩn thỉu của [target.GetFirstNamePossessiveNoTooltip]!"
  befriend_ongoing_rival_0005.b:0 "Có lẽ bây giờ tốt nhất là để mọi việc diễn ra theo lẽ tự nhiên."
  befriend_ongoing_rival.2000.t:0 "Kẻ chi kỉ: Vuốt Ve Cái Ta Của [target.GetHerHis|U]"
  befriend_ongoing_rival.2000.desc:0 "Ta thường tập trung vào mặt tiêu cực của [target.GetTitledFirstNamePossessive], điều này không có lợi cho mục tiêu hiện tại của Ta. Chắc chắn [target.GetSheHe] cũng có những điểm mạnh đáng ngưỡng mộ.\n\nMột lời khen thận trọng nhưng tinh tế, công nhận một đức tính của [target.GetHerHis], có thể là một ý tưởng tốt."
  befriend_ongoing_rival_2000.a:0 "Dù đã có tranh cãi, [target.GetFirstNameNoTooltip] là một người tốt bụng."
  befriend_ongoing_rival_2000.b:0 "[target.GetSheHe|U] thực sự có sự hiện diện khá ấn tượng."
  befriend_ongoing_rival_2000.c:0 "Nghĩ kỹ thì [target.GetSheHe] rất giỏi giao tiếp với mọi người."
  befriend_ongoing_rival_2000.d:0 "[target.GetFirstNameNoTooltip] thường giữ được sự điềm tĩnh."
  befriend_ongoing_rival_2000.tt:0 "#F Một lời khen chân thành sẽ giúp kế hoạch tiến triển, nhưng lời khen sai có thể làm [target.GetHerHim] phật lòng.#!"
  befriend_ongoing_rival_2000.a.tt:0 "Khen [target.GetFirstName] vì tốt bụng"
  befriend_ongoing_rival_2000.b.tt:0 "Khen [target.GetFirstName] vì tự tin"
  befriend_ongoing_rival_2000.c.tt:0 "Khen [target.GetFirstName] vì hòa đồng"
  befriend_ongoing_rival_2000.d.tt:0 "Khen [target.GetFirstName] vì điềm tĩnh"
  befriend_ongoing_rival.2001.t:0 "Kẻ chi kỉ: Sức Mạnh Của Sự Công Nhận"
  befriend_ongoing_rival.2001.intro:0 "Ta chắc chắn rằng [target.GetTitledFirstName] nghe thấy khi Ta đề cập"
  befriend_ongoing_rival.2001.benevolent:0 "rằng Ta luôn cho rằng lòng hào phóng của [target.GetHerHis] là tấm gương quý báu cho người khác."
  befriend_ongoing_rival.2001.dominant:0 "cách [target.GetSheHe] luôn thu hút sự chú ý của mọi người khi [target.GetSheHe] bước vào phòng."
  befriend_ongoing_rival.2001.extroverted:0 "rằng [target.GetSheHe] nổi tiếng là khách được mọi người yêu thích, luôn là trung tâm của bữa tiệc."
  befriend_ongoing_rival.2001.levelheaded:0 "rằng mặc dù chúng Ta có nhiều bất đồng, Ta luôn ngưỡng mộ khả năng giữ bình tĩnh của [target.GetHerHis]."
  befriend_ongoing_rival.2001.end:0 "\n\nSau đó Ta được xác nhận rằng [target.GetSheHe] đã khó giấu nụ cười hài lòng khi nghe lời Ta."
  befriend_ongoing_rival_2001.a:0 "Một lời khen chân thành thật sự có thể mang lại kỳ tích."
  befriend_ongoing_rival.2002.t:0 "Kẻ chi kỉ: Một Hiểu Lầm Trầm Trọng"
  befriend_ongoing_rival.2002.end:0 "\n\nSau đó, khi [target.GetSheHe] đến gần Ta, Ta nghĩ đó là để cảm ơn! Ít nhất cho đến khi nhìn thấy ánh mắt giận dữ trên khuôn mặt [target.GetHerHis]... Hóa ra, [target.GetSheHe] hiểu lời khen của Ta là sự chế nhạo."
  befriend_ongoing_rival_2002.a:0 "Ta không nên mở miệng..."
  befriend_ongoing_rival.2003.t:0 "Kẻ chi kỉ: Thật Ngượng Ngùng"
  befriend_ongoing_rival.2003.end:0 "\n\nKhi Ta liếc nhìn [target.GetTitledFirstNameNoTooltip], Ta mong ít nhất thấy một chút hài lòng, nhưng [target.GetSheHe] trông thật bối rối, có lẽ còn hơi khó chịu."
  befriend_ongoing_rival_2003.a:0 "Có lẽ Ta nên suy nghĩ kỹ hơn về việc này..."
