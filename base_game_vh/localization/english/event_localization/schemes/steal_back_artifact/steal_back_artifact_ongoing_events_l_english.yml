l_english:
  steal_back_artifact_event_title:1 "Ăn Cắp Hiện Vật:"
  steal_back_artifact_ongoing.1001.t:0 "$steal_back_artifact_event_title$ Nhà Cổ Vật Học"
  steal_back_artifact_ongoing.1001.desc:0 "Một trong những trở ngại rõ ràng để lấy lại hiện vật là nhà cổ vật học của [target.GetTitledFirstNamePossessive], [antiquarian.GetTitledFirstName].\n\nTất nhiên, có nhiều cách để... #EMP xử lý#! một người, nhưng Ta tự hỏi liệu [antiquarian.GetFirstNameNoTooltip] có phải là kiểu người mà Ta có thể thuyết phục bỏ qua bằng một khoản hối lộ thích hợp hay không."
  steal_back_artifact_ongoing.1001.a:0 "Vàng là ngôn ngữ phổ quát của hối lộ."
  steal_back_artifact_ongoing.1001.a.tt:0 "Ngài tin rằng lòng trung thành của [antiquarian.GetTitledFirstNamePossessive] có thể được mua bằng của cải..."
  steal_back_artifact_ongoing.1001.b:0 "Có lẽ hiện vật đổi hiện vật?"
  steal_back_artifact_ongoing.1001.b.tt:0 "[antiquarian.GetTitledFirstName] sẽ đồng ý với một 'thương vụ công bằng'."
  steal_back_artifact_ongoing.1001.c:0 "Một cuộc gặp gỡ với [random_beauty.GetTitledFirstNameNoTooltip] có thể... #EMP kích thích#!."
  steal_back_artifact_ongoing.1001.c.tt:0 "Ngài đang đánh cược rằng [antiquarian.GetTitledFirstName] sẽ trân trọng vẻ đẹp thể chất hơn là lòng trung thành."
  steal_back_artifact_ongoing.1001.d:0 "Ta sẽ xem xét các khả năng khác thay thế."

  steal_back_artifact_ongoing_notification.1001.success:0 "[antiquarian.GetTitledFirstName] Chấp Nhận Hối Lộ"
  steal_back_artifact_ongoing_notification.1001.failure:0 "[antiquarian.GetTitledFirstName] Từ Chối Hối Lộ"

  steal_back_artifact_ongoing.1002.t:0 "$steal_back_artifact_event_title$ Quản Lý Nhỏ"
  steal_back_artifact_ongoing.1002.desc:0 "Ta đã bảo [agent.Custom2('MyCharacterIntroduction', ROOT.Char)] theo dõi [target.GetTitledFirstName] để chúng Ta có thể tìm cơ hội hoàn hảo lấy cắp hiện vật từ [target.GetHerHim].\n\nTiến triển, tuy nhiên, chậm hơn nhiều so với Ta mong muốn. Có lẽ Ta nên đưa cho [agent.GetHerHim] một điều cụ thể để chú ý?"
  steal_back_artifact_ongoing.1002.a:0 "Đưa hướng dẫn cụ thể cho [agent.GetFirstNameNoTooltip]."
  steal_back_artifact_ongoing.1002.b:0 "Ta tin họ sẽ làm tốt công việc."
  steal_back_artifact_ongoing_notification.1002.success:0 "[agent.GetTitledFirstName] Báo Cáo Lại"
  steal_back_artifact_ongoing_notification.1002.failure:0 "[antiquarian.GetTitledFirstName] Không Tìm Thấy Thông Tin Nào"

