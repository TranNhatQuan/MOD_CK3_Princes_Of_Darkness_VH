l_english:
  steal_back_artifact_outcome.1001.t:0 "$steal_back_artifact_event_title$ Thành Công!"
  steal_back_artifact_outcome.1001.desc:1 "Ta cảm thấy một luồng tự hào dâng trào, và không khỏi cười toe toét khi được trao hiện vật mà Ta đã tìm cách thu hồi. [artifact.GetName] trở về tay chủ nhân hợp pháp!\n\nDù có lẽ hơi xước xát và bẩn một chút sau những thử thách trong việc cứu lấy, Ta vẫn không thể nhịn việc sờ tay lên bề mặt sang trọng của món đồ bị đánh cắp này... [artifact.GetName], một chiến lợi phẩm tuyệt vời!"
  steal_back_artifact_outcome.1001.a:0 "Nó trở về đúng chỗ, vào đúng tay."

  steal_back_artifact_outcome.1002.t:0 "$steal_back_artifact_event_title$ Hiện Vật Bị Ăn Cắp!"
  steal_back_artifact_outcome.1002.desc:0 "Hôm nay, Ta định chiêm ngưỡng [artifact_to_steal.GetName] của mình... nhưng kinh hoàng thay, nó đã biến mất! #EMP Biến mất!#!\n\nSau một cuộc điều tra hối hả, một người hầu bước ra cho biết [owner.GetName] đã dàn xếp vụ trộm táo tợn! Quả thật, người ta nói rằng [owner.GetSheHe] thường khoe khoang về việc [artifact_to_steal.GetName] sẽ trông đẹp hơn biết bao khi thuộc về [owner.GetHerHis]..."
  steal_back_artifact_outcome.1002.a:0 "Nguyền rủa tên trộm đáng khinh đó!"

  steal_back_artifact_outcome.2001.t:0 "$steal_back_artifact_event_title$ Thất Bại"
  steal_back_artifact_outcome.2001:0 "Kế hoạch thâm nhập khôn ngoan của Ta diễn ra đúng như dự tính, nhưng [artifact.GetName] không thể tìm thấy!\n\nNó đã bị di chuyển? Giấu đi? Hoặc là may mắn đã cứu chủ nhân của nó... hoặc lũ thuộc hạ bất tài của Ta đã bị vượt mặt một cách tinh vi. Hoảng sợ vì thất bại hoàn toàn này, chúng sẽ không giúp Ta nữa. Chiến lợi phẩm vẫn còn trong tay chủ nhân..."
  steal_back_artifact_outcome.2001.a:0 "Ta không thể tin được! #EMP Không thể chấp nhận được!#!"

