l_english:
  intrigue_scheme_ongoing.1001.t:0 "Hối Lộ Đúng Lúc"
  intrigue_scheme_ongoing.1001.desc:0 "Có vẻ không phải tất cả các Bạn Bè tại triều đình [scheme.GetTargetCharacter.GetTitledFirstNamePossessive] đều trung thành mù quáng... [agent.GetFirstName] đảm bảo với Ta rằng [agent.GetSheHe] có một cách len vào, và vài đồng vàng trong túi đúng có thể đi một chặng đường dài."
  intrigue_scheme_ongoing.1001.elope.desc:0 "Có vẻ không phải tất cả các Bạn Bè tại triều đình [scheme.GetTargetCharacter.GetTitledFirstNamePossessive] đều trung thành mù quáng với [scheme.GetTargetCharacter.GetLiege.GetTitledFirstName]... [agent.GetFirstName] đảm bảo với Ta rằng [agent.GetSheHe] có một cách len vào, và vài đồng vàng trong túi đúng có thể đi một chặng đường dài."
  intrigue_scheme_ongoing.1001.a:0 "Vàng một chút thì sao chứ?"
  intrigue_scheme_ongoing.1001.b:0 "Quá mạo hiểm!"

  intrigue_scheme_ongoing.1002.t:0 "Công Lý Thần Linh"
  intrigue_scheme_ongoing.1002.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent_in_question'))] của ta, [agent_in_question.GetTitledFirstName], đã lên án [scheme.GetTargetCharacter.GetTitledFirstName] vì những tội ác [scheme.GetTargetCharacter.GetHerHis] hắn gây ra đối với [agent_in_question.GetFaith.HighGodName].\n\n[agent_in_question.GetSheHe|U] thậm chí đã kêu gọi [agent_in_question.GetFaith.HighGodNameAlternate] trừng phạt [scheme.GetTargetCharacter.GetFirstName], và ám chỉ những hình phạt sắp tới."
  intrigue_scheme_ongoing.1002.a:0 "Có chút lạc quan, nhưng Ta thích tinh thần này!"
  intrigue_scheme_ongoing.1002.a.success:0 "[agent_in_question.GetSheHe|U] chiêu mộ các [agent_in_question.GetFaith.GetAdherentNamePlural] địa phương cho mục tiêu của chúng ta"
  intrigue_scheme_ongoing.1002.a.failure:0 "[agent_in_question.GetFirstNameNoTooltip] tự làm lộ bản thân trong sự cuồng tín [agent_in_question.GetHerHis] của mình"
  intrigue_scheme_ongoing.1002.b:0 "[agent_in_question.GetTitledFirstNameNoTooltip] sẽ im miệng, nếu không, [agent_in_question.GetFaith.HighGodName] giúp Ta."
  intrigue_scheme_ongoing.1002.c:0 "Ta sẽ giúp [agent_in_question.GetHerHim] trong cách tiếp cận cao quý của hắn!"

  intrigue_scheme_ongoing.1004.t:0 "Quá Nhiều Lời"
  intrigue_scheme_ongoing.1004.desc:0 "Mặc dù khả năng kết bạn của [agent_in_question.GetFirstNamePossessive] đã chứng tỏ vô giá trong âm mưu của ta, [agent_in_question.GetSheHe] không hoàn toàn cẩn thận xung quanh người khác như [agent_in_question.GetSheHe] nên làm.\n\n[agent_in_question.GetSheHe|U] quá thích đưa ra những gợi ý mơ hồ, và nếu ai đó bắt đầu đặt câu hỏi, không biết [agent_in_question.GetSheHe] sẽ tiết lộ điều gì."
  intrigue_scheme_ongoing.1004.a:0 "Những thứ hắn học được quá giá trị để bắt hắn im lặng."
  intrigue_scheme_ongoing.1004.a.success:0 "[agent_in_question.GetFirstNameNoTooltip] không bị phát hiện"
  intrigue_scheme_ongoing.1004.a.failure:0 "[agent_in_question.GetFirstNameNoTooltip] bị phát hiện"
  intrigue_scheme_ongoing.1004.b:0 "Nếu [agent_in_question.GetSheHe] không giữ được bí mật, [agent_in_question.GetSheHe] phải im lặng!"
  intrigue_scheme_ongoing.1004.toast.success:0 "[agent_in_question.GetFirstNameNoTooltip] không bị phát hiện"
  intrigue_scheme_ongoing.1004.toast.failure:0 "[agent_in_question.GetFirstNameNoTooltip] bị phát hiện"

  intrigue_scheme_ongoing.1006.t:0 "Dọn Dẹp"
  intrigue_scheme_ongoing.1006.desc:0 "Dĩ nhiên là [agent_in_question.Custom2('InsultAdjective', ROOT.Char)] [agent_in_question.GetTitledFirstName] sẽ gây rắc rối.\n\n[agent_in_question.GetSheHe|U] không thận trọng khi di chuyển quanh triều đình [scheme.GetTargetCharacter.GetTitledFirstNamePossessive], và [scheme.GetTargetCharacter.GetTitleAsNameNoTooltip] bắt đầu chú ý. Chỉ là vấn đề thời gian trước khi [agent_in_question.GetSheHe] bị phát hiện!"
  intrigue_scheme_ongoing.1006.elope.desc:0 "Dĩ nhiên là [agent_in_question.Custom2('InsultAdjective', ROOT.Char)] [agent_in_question.GetTitledFirstName] sẽ gây rắc rối.\n\n[agent_in_question.GetSheHe|U] không thận trọng khi di chuyển quanh triều đình [scheme.GetTargetCharacter.GetTitledFirstNamePossessive], và [scheme.GetTargetCharacter.GetLiege.Custom2('HerHisCharacterIntroduction', scheme.GetTargetCharacter)] bắt đầu chú ý. Chỉ là vấn đề thời gian trước khi [agent_in_question.GetFirstNameNoTooltip] bị phát hiện!"
  intrigue_scheme_ongoing.1006.a.success:0 "[agent_in_question.GetFirstNameNoTooltip] không bị phát hiện"
  intrigue_scheme_ongoing.1006.a.failure:0 "[agent_in_question.GetFirstNameNoTooltip] bị phát hiện"
  intrigue_scheme_ongoing.1006.a:1 "Dấu vết của kẻ lén lút chắc chắn sẽ khiến [scheme.GetTargetCharacter.GetFirstNameNoTooltip] căng thẳng!"
  intrigue_scheme_ongoing.1006.b:0 "[agent_in_question.GetSheHe|U] cần dành thời gian làm tốt hơn."

  intrigue_scheme_ongoing.1007.t:0 "Thể Hiện Lo Lắng"
  intrigue_scheme_ongoing.1007.desc:0 "\"Nếu [target.GetTitledFirstName] phát hiện ra Ngài thì sao? Liệu có khôn ngoan khi tiếp tục việc tốn thời gian này không?\"\n\n[caring_agent.GetTitledFirstName] [caring_agent.Custom('QuirkPresentPosOrNeg')], và mặc dù Ta biết [caring_agent.GetSheHe] sẽ làm theo hướng dẫn của Ta, Ta có thể nhận ra mối quan tâm chân thành của [caring_agent.GetHerHis] dành cho Ta."
  intrigue_scheme_ongoing.1007.a:0 "Kế hoạch của Ta sẽ tiếp tục, và Ta mong Ngài làm việc chăm chỉ!"
  intrigue_scheme_ongoing.1007.b:0 "Ngài đúng, điều này đã tốn nhiều thời gian của Ta. Ngồi xuống đây với Ta đi."

  intrigue_scheme_ongoing.1008.t:0 "Theo Dõi Sát"
  intrigue_scheme_ongoing.1008.desc:0 "Có vẻ [defender.GetTitledFirstName] đang siết an ninh tại triều đình, hy vọng tìm ra kẻ mưu phản. Đồng mưu của Ta, [agent.GetTitledFirstName], lo rằng [agent.GetSheHe] có thể đã thu hút sự nghi ngờ không mong muốn."
  intrigue_scheme_ongoing.1008.a:0 "Ta tin vào khả năng của [agent.GetFirstNamePossessiveNoTooltip]."
  intrigue_scheme_ongoing.1008.a.success:0 "[agent.GetFirstNameNoTooltip] không bị phát hiện"
  intrigue_scheme_ongoing.1008.a.failure:0 "[agent.GetFirstNameNoTooltip] bị phát hiện"
  intrigue_scheme_ongoing.1008.b:0 "Dấu vết [agent.GetHerHis|U] dẫn đến Ta cần phải kết thúc. Ngay bây giờ."
  intrigue_scheme_ongoing.1008.c:1 "Cảm ơn [ROOT.Char.GetFaith.HighGodNameAlternate] vì [councillor.GetTitledFirstNameNoTooltip] có mặt và có thể can thiệp."

  intrigue_scheme_ongoing.1009.t:0 "Nhận Sự Giúp Đỡ"
  intrigue_scheme_ongoing.1009.desc:1 "[potential_agent.GetTitledFirstName] đến gặp Ta, ánh mắt quyết tâm trong đôi mắt [potential_agent.GetHerHis].\n\n\"[potential_agent.Custom2('RelationToMe', ROOT.Char)] của Ta, Ta đã do dự trong việc tham gia kế hoạch chống lại [potential_agent.Custom2('RelationToMe', SCOPE.sC('target'))], [target.GetTitledFirstName], nhưng Ta cảm thấy đã đến lúc tin tưởng phán quyết của Ngài về việc này.\""
  intrigue_scheme_ongoing.1009.elope.desc:0 "[potential_agent.GetTitledFirstName] đến gặp Ta, ánh mắt quyết tâm trong đôi mắt [potential_agent.GetHerHis].\n\n\"[potential_agent.Custom2('RelationToMe', ROOT.Char)] của Ta, Ta đã do dự tham gia kế hoạch chạy trốn cùng [target.GetTitledFirstName], nhưng bây giờ Ta thấy Ngài thật sự quan tâm đến [target.GetHerHim].\""
  intrigue_scheme_ongoing.1009.a:0 "Xin hãy ủng hộ mục tiêu của Ta, [potential_agent.GetFirstNameNoTooltip]."
  intrigue_scheme_ongoing.1009.b:0 "Ta chỉ muốn nhờ Ngài một chút việc nhỏ thôi..."

  intrigue_scheme_ongoing.2001.t:0 "Niềm Tin Sai Chỗ"
  intrigue_scheme_ongoing.2001.desc:0 "Bản tính cả tin của [scheme.GetTargetCharacter.GetFirstNamePossessive] đã làm cho mọi việc dễ dàng hơn mong đợi để [agent_in_question.GetTitledFirstName] làm thân với [scheme.GetTargetCharacter.GetTitleTierName] – khi [agent_in_question.GetFirstNameNoTooltip] đưa ra lời khuyên, [target.GetSheHe] có khả năng lắng nghe hơn là không."
  intrigue_scheme_ongoing.2001.a:0 "[agent_in_question.GetSheHe|U] phải tiếp tục đưa lời khuyên đúng đắn, cho đến khi..."
  intrigue_scheme_ongoing.2001.b:0 "[agent_in_question.GetSheHe|U] có thể đảm bảo các điệp viên khác đến và đi tự do."

  intrigue_scheme_ongoing.2002.t:0 "Kẻ Say Rượu"
  intrigue_scheme_ongoing.2002.desc:0 "[target.GetTitledFirstName] quá mê rượu, khiến [target.GetHerHim] đôi khi hành xử vô lý.\n\nRất đơn giản để [agent_in_question.GetTitledFirstName] chiều theo [target.GetHerHim], và đảm bảo thói quen này được duy trì."
  intrigue_scheme_ongoing.2002.a:0 "Ta sẽ giúp [agent_in_question.GetFirstNameNoTooltip] nhập loại rượu mạnh nhất!"
  intrigue_scheme_ongoing.2002.b:1 "Khiến cho [target.GetHerHim] cảm thấy an toàn trong sự lười biếng [target.GetHerHis] của mình."
  intrigue_scheme_ongoing.2002.c:0 "Ha, tên ngốc đó không nhận ra điểm yếu của chính [target.GetHerHis]!"

  intrigue_scheme_ongoing.2003.t:0 "Gián Điệp Tình Cờ"
  intrigue_scheme_ongoing.2003.bad_habits:0 "Không phải điều [agent.GetTitledFirstName] hy vọng tìm được khi nghe lén các cuộc trò chuyện bí mật, nhưng khám phá thói quen bất thường của [other_secret_target.GetTitledFirstNamePossessive] cũng không hại gì..."
  intrigue_scheme_ongoing.2003.secret_relationships:0 "Không phải điều [agent.GetTitledFirstName] mong đợi khi nghe lén các cuộc trò chuyện bí mật, nhưng khám phá mối quan hệ lén lút của [other_secret_target.GetTitledFirstNamePossessive] cũng không hại gì..."
  intrigue_scheme_ongoing.2003.bastardy:0 "Không phải điều [agent.GetTitledFirstName] mong đợi khi nghe lén các cuộc trò chuyện bí mật, nhưng khám phá sự thật về nguồn gốc của [secret_target.GetTitledFirstNamePossessive] cũng không hại gì..."
  intrigue_scheme_ongoing.2003.murder:0 "Không phải điều [agent.GetTitledFirstName] mong đợi khi nghe lén các cuộc trò chuyện bí mật, nhưng khám phá tội ác kinh khủng của [other_secret_target.GetTitledFirstNamePossessive] cũng không hại gì..."
  intrigue_scheme_ongoing.2003.desc:0 "Không phải điều [agent.GetTitledFirstName] hy vọng tìm được khi nghe lén các cuộc trò chuyện bí mật, nhưng khám phá sự thật về [other_secret_target.GetTitledFirstName] cũng không hại gì..."
  intrigue_scheme_ongoing.2003.a:0 "Có lẽ điều này có thể giúp ích cho nỗ lực của Ta?"

  intrigue_scheme_ongoing.3001.t:0 "Công Lý và Bí Mật"
  intrigue_scheme_ongoing.3001.desc:0 "Cách Ta hành xử dạo này... Bí mật và mưu mô trong bóng tối. Điều này không đúng. Điều này không công bằng."
  intrigue_scheme_ongoing.3001.a:0 "Ta làm những gì cần làm!"
  intrigue_scheme_ongoing.3001.b:0 "Nếu phải làm, thì phải làm cho đúng."

  intrigue_scheme_ongoing.3002.t:0 "Gánh Nặng Của Lời Nói Dối"
  intrigue_scheme_ongoing.3002.desc:0 "Tất cả những kế hoạch bí mật và âm mưu đen tối... Một bàn tay lạnh lùng siết chặt trái tim Ta mỗi khi nghĩ về chúng. Cảm giác thật sai trái."
  intrigue_scheme_ongoing.3002.a:0 "Đây là việc phải làm!"
  intrigue_scheme_ongoing.3002.b:0 "Ta đã dành quá nhiều thời gian suy nghĩ về điều này."
  intrigue_scheme_ongoing.3002.c:0 "Xin [ROOT.Char.GetFaith.HighGodName] tha thứ cho Ta, Ta đã làm gì vậy?"
  intrigue_scheme_ongoing.3002.d:0 "Ta phải thành thật về ý định của mình."

 # Map wilderness outside of target location
  intrigue_scheme_ongoing.3003.t:0 "Trên Đường"
  intrigue_scheme_ongoing.start.3003.desc:0 "Khi đến thời điểm, các điệp viên của Ta sẽ cần một"
  intrigue_scheme_ongoing.escape_route.3003.desc:0 "lối thoát an toàn ra khỏi [defender.GetTitledFirstNamePossessive] [defender.Custom('ResidenceBuilding')], nếu có điều gì sai xảy ra."
  intrigue_scheme_ongoing.leave_with_target.3003.desc:0 "lối đi an toàn để đưa [target.GetTitledFirstName] ra khỏi [defender.GetTitledFirstNamePossessive] [defender.Custom('ResidenceBuilding')]."
  intrigue_scheme_ongoing.end.3003.desc:0 "Một bản đồ chi tiết về [scheme_location.Custom('TerrainTypeProvince')] địa phương, với mọi đường mòn và hang động ẩn, sẽ là tài nguyên vô giá."
  intrigue_scheme_ongoing.3003.a:0 "Trả tiền cho một thợ săn từ [scheme_location.GetNameNoTooltip] để vẽ bản đồ."
  intrigue_scheme_ongoing.3003.a.success:0 "Thợ săn [hunter.GetShortUIName] rất kín đáo"
  intrigue_scheme_ongoing.3003.a.failure:0 "Thợ săn [hunter.GetShortUIName] khoe khoang về sự giàu có mới có được của hắn"
  intrigue_scheme_ongoing.3003.d:0 "Hỏi  Bạn của bạn [hunter.GetTitledFirstNameNoTooltip]."
  intrigue_scheme_ongoing.3003.b:0 "Tự mình khám phá [scheme_location.Custom('TerrainTypeProvince')]."
  intrigue_scheme_ongoing.3003.b.success:0 "Ngài vẽ bản đồ khu vực xung quanh [scheme_location.GetNameNoTooltip]"
  intrigue_scheme_ongoing.3003.b.soft_failure:0 "Ngài bị lạc trong [scheme_location.Custom('TerrainTypeProvince')]"
  intrigue_scheme_ongoing.3003.b.hard_failure:0 "Ngài bị lạc qua đêm trong [scheme_location.Custom('TerrainTypeProvince')]"
  intrigue_scheme_ongoing.3003.c:0 "Bỏ ý tưởng này."
  intrigue_scheme_ongoing.3003.e:0 "Hỏi $master_of_hunt_court_position$ [hunter.GetTitledFirstNameNoTooltip]."

  intrigue_scheme_ongoing.3004.t:0 "Bản Đồ"
  intrigue_scheme_ongoing.3004.desc:0 "Các gián điệp của Ta đã báo về một thợ săn gây náo loạn tại quán rượu địa phương. [hunter.GetWomanMan] đã tiêu rất nhiều tiền và khoe khoang ầm ĩ về thương vụ tuyệt vời mà [hunter.GetSheHe] đã ký với 'một [owner.GetLadyLord] sang trọng trong ngọc trai và lụa'.\n\nHình như [hunter.GetSheHe] đã vẽ một bản đồ [defender.Custom('TerrainType')] địa phương cho một quý tộc không rõ danh tính [owner.GetWomanMan]. Gián điệp tin rằng [owner.GetLadyLord] hẳn đang âm mưu chống lại Ta hoặc một trong các thần dân của Ta."
  intrigue_scheme_ongoing.3004.a:0 "Cảm ơn đã báo cho Ta biết."
  intrigue_scheme_ongoing.3004.b:0 "Tên ngốc đó phải ở trong ngục của Ta!"
  intrigue_scheme_ongoing.3004.c:0 "Đưa [hunter.GetHerHim] đến gặp Ta. Ta nghĩ có thể gợi nhớ cho [hunter.GetHerHis]..."
  intrigue_scheme_ongoing.3004.c.tt:0 "Một [scheme_hostile|E] hoặc [scheme|E] ác ý bị phơi bày"
  intrigue_scheme_ongoing.3004.toast:0 "Âm mưu bị phơi bày"

 # MESSENGER PIGEON
  intrigue_scheme_ongoing.3005.t:0 "Sứ Giả Có Cánh"
  intrigue_scheme_ongoing.3005.desc:0 "Khi âm mưu của Ta tiến gần đến thành công, việc liên lạc nhanh là then chốt. Ta có một con bồ câu rất thông minh mà [pigeon_recipient.GetTitledFirstName] có thể dùng để gửi thông điệp khẩn cấp đến Ta tại [root_location.GetNameNoTooltip], nếu cần.\n\nNhưng làm thế nào để Ta đưa con chim vào [defender.Custom('ResidenceBuilding')] của [target_location.GetNameNoTooltip]?"
  intrigue_scheme_ongoing.3005.c.f:0 "Tùy chọn này khả dụng vì điệp viên của Ngài [elope_agent.GetShortUIName] là [friend|E], [close_family_member|E] hoặc là người hầu [elope_agent.Custom('FemaleMale')] của [pigeon_recipient.GetShortUIName]"
  intrigue_scheme_ongoing.3005.a:0 "Một huấn luyện viên chim địa phương có thể gửi nó như một 'món quà'."
  intrigue_scheme_ongoing.3005.a.success:0 "'Món quà' đến tay [pigeon_recipient.GetShortUIName]"
  intrigue_scheme_ongoing.3005.a.failure:0 "[defender.GetShortUIName|U] từ chối huấn luyện viên chim"
  intrigue_scheme_ongoing.3005.b:0 "Nếu Ta tự gửi 'món quà', [defender.GetTitledFirstNameNoTooltip] sẽ không thể từ chối."
  intrigue_scheme_ongoing.3005.c:0 "Để [elope_agent.GetTitledFirstNameNoTooltip] giao con chim."
  intrigue_scheme_ongoing.3005.d:0 "Quá mạo hiểm."


  intrigue_scheme_ongoing.4001.t:0 "Người Lớn Có Trách Nhiệm"
  intrigue_scheme_ongoing.4001.desc:0 "[agent_in_question.GetTitledFirstName] đã nói với Ta rằng [agent_in_question.GetSheHe] được giao trông nom một nhóm trẻ chơi tại triều đình.\nMay mắn thay, trong số đó có [scheme.GetTargetCharacter.GetTitledFirstName].\n\nĐây là cơ hội tuyệt vời để [agent_in_question.GetTitledFirstName] tiến hành các bước tiếp theo."
  intrigue_scheme_ongoing.4001.a:0 "Dạy bọn trẻ thói quen chơi xa khỏi tầm mắt người lớn."
  intrigue_scheme_ongoing.4001.b:0 "Cố gắng kết bạn với [scheme.GetTargetCharacter.GetTitledFirstNameNoTooltip]. Làm cho [scheme.GetTargetCharacter.GetHerHim] tin tưởng Ngài."

  intrigue_scheme_ongoing.4002.t:0 "Sự Ngây Ngô Của Trẻ Thơ"
  intrigue_scheme_ongoing.4002.desc:0 "[target.GetTitledFirstName] thậm chí không thể hiểu được rằng có ai đó sẽ tạo ra những kế hoạch không trung thực, mặc dù triều đình hỗn loạn xung quanh [target.GetHerHim].\n\nTrò chuyện với [scheme.GetTargetCharacter.GetHerHim], có vẻ như [scheme.GetTargetCharacter.GetSheHe] thực sự tin tưởng ta!"
  intrigue_scheme_ongoing.4002.a:0 "Một cơ hội để tiến gần hơn với [target.GetHerHis] [target.Custom2('RelationToMe', SCOPE.sC('parent'))]!"
  intrigue_scheme_ongoing.4002.b:0 "Một nơi trốn bí mật? Có thể chỉ cho Ta không?"

  intrigue_scheme_ongoing.4003.t:0 "Nghi Ngờ Lại"
  intrigue_scheme_ongoing.4003.desc:0 "[agent_in_question.GetTitledFirstName] đến gặp Ta với mối lo về âm mưu mà Ta đã lôi kéo [agent_in_question.GetHerHim] tham gia. Dù Ta đã ra lệnh cho [agent_in_question.GetHerHim] kết bạn với [scheme.GetTargetCharacter.GetTitledFirstName], Ta chưa từng muốn họ gắn kết tình cảm!\n\nBây giờ Ta tự hỏi liệu có thể tin họ đến mức nào..."
  intrigue_scheme_ongoing.4003.a:0 "\"Đừng bắt Ta nhắc Ngài lý do vì sao Ngài giúp Ta ngay từ đầu!\""
  intrigue_scheme_ongoing.4003.b:0 "Ta sẽ âm thầm giảm sự tham gia của họ trong âm mưu."

  intrigue_scheme_ongoing.5001.t:0 "Muốn Phá Đám"
  intrigue_scheme_ongoing.5001.desc:0 "[servant.GetWomanMan] phụ trách giặt quần áo của lính gác [target.GetTitledFirstNamePossessive] được đưa đến Ta. Không ai để ý nếu [servant.GetHerHim] phá quấy quần áo, và nếu có thể đặt thứ gì làm xao nhãng lính gác...\n\n'Ngài muốn Ta làm gì, [ROOT.Char.Custom('FormOfAddressForLiege')]?'"
  intrigue_scheme_ongoing.5001.a:0 "Ta muốn Ngài nghiền hồng hoa thật mịn..."
  intrigue_scheme_ongoing.5001.b:0 "Cắt lỗ trên quần áo của họ. Ở những chỗ không đúng."

  intrigue_scheme_ongoing.5002.t:0 "Viết Trong Sao"
  intrigue_scheme_ongoing.5002.desc:0 "Một [target.GetTitleAsNameNoTooltip] để dọa, một nhà tiên tri địa phương [local_mystic.GetName], với đạo đức mờ ám, và một điềm báo bịa đặt... Hoàn hảo.\n\nTrước khi nhà tiên tri đến triều đình [target.GetTitledFirstNamePossessive], chỉ còn một câu hỏi — điềm báo giả của Ta là may mắn hay tai họa?"
  intrigue_scheme_ongoing.5002.a:0 "Điềm xấu cho một [target.GetTitleAsNameNoTooltip] xấu xa!"
  intrigue_scheme_ongoing.5002.a.tt:0 "Ta tin rằng [target.GetFirstNameNoTooltip] dễ bị ảnh hưởng bởi tin xấu"
  intrigue_scheme_ongoing.5002.a.success:0 "[target.GetSheHe|U] mất nhiều đêm trằn trọc lo lắng"
  intrigue_scheme_ongoing.5002.a.failure:1 "[target.GetSheHe|U] chỉ trở nên cảnh giác hơn"
  intrigue_scheme_ongoing.5002.b:0 "Điềm tốt, để làm [target.GetHerHim] lơ là và an tâm giả."
  intrigue_scheme_ongoing.5002.b.tt:0 "Ta tin rằng [target.GetFirstNameNoTooltip] dễ tin tin tốt hơn"
  intrigue_scheme_ongoing.5002.b.success:0 "[target.GetSheHe|U] mất cảnh giác"
  intrigue_scheme_ongoing.5002.b.failure:0 "[target.GetSheHe|U] càng đề phòng hơn"

  intrigue_scheme_ongoing.5003.t:0 "Điềm Báo"
  intrigue_scheme_ongoing.5003.desc_opening:0 "Một nhà tiên tri địa phương, [local_mystic.GetName], insist gặp Ta, và khi được đưa vào trước mặt Ta, [local_mystic.GetSheHe] bắt đầu khóc than, và... có phải là máu trên tay [local_mystic.GetHerHis] không?\n\n"
  intrigue_scheme_ongoing.5003.desc:1 "'Những dấu hiệu! Những dấu hiệu không thuận lợi cho ngài, [target.GetLadyLord]. Ta đã làm đổ ruột gà, và máu chỉ cho Ta tương lai của ngài – nó tăm tối và đầy cái chết!'"
  intrigue_scheme_ongoing.5003.a:0 "Ôi, thật đáng lo…!"

  intrigue_scheme_ongoing.5004.desc:1 "'Những dấu hiệu! Những dấu hiệu thuận lợi cho ngài, [target.GetLadyLord]. Ta đã làm đổ ruột gà, và máu chỉ cho Ta tương lai của ngài – nó rực rỡ!'"
  intrigue_scheme_ongoing.5004.a:0 "Ừ… cảm ơn?"

  intrigue_scheme_ongoing.5005.t:0 "Tất Cả Những Gì Lấp Lánh"
  intrigue_scheme_ongoing.5005.desc:0 "[spymaster.GetCouncilTitle], [spymaster.GetTitledFirstName], tiến đến với Ta nụ cười gian xảo.\n\n'[ROOT.Char.Custom('FormOfAddressForLiege')|U], túi này chứa bột rất hiểm độc. Nếu rắc lên thứ gì đó – ví dụ quà tặng cho [target.GetTitledFirstName] – nó không để lại dấu vết nhưng khiến ai chạm vào suy yếu và tâm tính xấu đi.'"
  intrigue_scheme_ongoing.5005.a:0 "Ồ, Ta nói [target.GetSheHe] xứng đáng có quà."
  intrigue_scheme_ongoing.5005.b:0 "[target.GetSheHe|U] sẽ không có đồng vàng nào của Ta!"

  intrigue_scheme_ongoing.5006.t:0 "Món Quà"
  intrigue_scheme_ongoing.5006.desc:0 "[owner.GetTitledFirstName] gửi Ta một món quà, hộp trang trí lộng lẫy đầy vàng. Khi Ta sờ vào những đồng vàng, cảm giác như căn phòng quay cuồng và hơi thở Ta trở nên ngắn."
  intrigue_scheme_ongoing.5006.a:0 "Thật bất ngờ! Và hiệu ứng thật kỳ lạ."

  intrigue_scheme_ongoing.5007.t:0 "Vàng Nhiễm Độc"
  intrigue_scheme_ongoing.5007.desc_opening:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('poisoned'))] của ta, [poisoned.GetTitledFirstName], tiếp cận ta với những giọt mồ hôi đọng trên trán và khuôn mặt tái nhợt.\n\n""
  intrigue_scheme_ongoing.5007.desc:0 "'[ROOT.Char.GetMotherFather], có gì đó sai. Cân bằng cơ thể Ta bị rối từ khi Ta giúp ngài đóng gói món quà cho [target.GetTitledFirstName]...'"
  intrigue_scheme_ongoing.5007.a:0 "Chuyện gì đã… Vàng nhiễm độc!"
  intrigue_scheme_ongoing.5007.a.tt:0 "Xin [ROOT.Char.GetFaith.HighGodName] giúp [poisoned.GetHerHim]!"

  intrigue_scheme_ongoing.5008.desc:0 "'[ROOT.Char.Custom('FormOfAddressForLiege')|U], cân bằng cơ thể Ta bị rối kể từ khi giúp ngài đóng gói quà cho [target.GetTitledFirstName]… Ta e rằng sự nhiễm độc của vàng đã ảnh hưởng tới Ta.'"
  intrigue_scheme_ongoing.5008.a:0 "Chết tiệt."

  intrigue_scheme_ongoing.5009.t:0 "Đường Hầm"
  intrigue_scheme_ongoing.5009.desc:0 "Báo cáo đến Ta về mật độ cao chuột quanh [target.GetTitledFirstNamePossessive] [target.Custom('ResidenceBuilding')], và vì Ta có khả năng với động vật nên đi điều tra.\n\nKhi đến nơi, những con chuột hội tụ chào đón Ta, dẫn Ta đến một đường hầm tối cách [target.Custom('ResidenceBuilding')] một đoạn."
  intrigue_scheme_ongoing.5009.a:0 "Hãy chỉ đường cho Ta, các Ngài!"
  intrigue_scheme_ongoing.5009.a.tt:1 "Ta tự hỏi nơi #EMP rodents#!"
  intrigue_scheme_ongoing.5009.b:0 "Ôi. Ta sẽ không đi vào đó."

  intrigue_scheme_ongoing.5010.desc:0 "Trời tối, tiếng chân nhỏ lách cách vọng lại trong không khí nặng mùi rác thải.\n\nĐột nhiên làn gió mát thổi đến, và Ta thấy ánh sáng lọt qua một lưới phía trước. Những con chuột dẫn Ta đến một đường hầm thẳng vào [target.GetTitledFirstNamePossessive] [target.Custom('ResidenceBuilding')]!"
  intrigue_scheme_ongoing.5010.a:0 "Cảm ơn các Ngài, những người  Bạn củaTa!"
  intrigue_scheme_ongoing.5010.b:0 "*Ho khan* Cảm ơn các Ngài! Nhưng mùi này…!"

  intrigue_scheme_ongoing.5011.t:0 "Sinh Vật"
  intrigue_scheme_ongoing.5011.desc:0 "Một loạt sinh vật có độc chào Ta tại quầy hàng của thương nhân, và Ta bị truyền cảm hứng. Chẳng phải một trong những sinh vật tinh xảo này sẽ là món quà hoàn hảo cho [target.GetTitledFirstName] sao?"
  intrigue_scheme_ongoing.5011.a:0 "Một trong những sinh vật chết người– thú vị nhất, làm ơn."
  intrigue_scheme_ongoing.5011.a.tt:0 "[target.GetSheHe|U] sẽ không hề hay biết!"
  intrigue_scheme_ongoing.5011.b:0 "Đưa Ta [SCOPE.Custom('VenomousCreature')] đó để nghiên cứu."

  intrigue_scheme_ongoing.5012.desc:0 "Thương nhân đặt [SCOPE.Custom('VenomousCreature')] vào một giỏ đan mà không hỏi gì. Trên đường về, Ta mở nắp giỏ, nhưng thật bất ngờ khi thấy nó trống rỗng…"
  intrigue_scheme_ongoing.5012.a:0 "Nó đi đâu rồi…? Ở đâu – AHH!"

  intrigue_scheme_ongoing.5013.desc:0 "\n\n'Nhìn kìa, mẹ ơi, nhìn kìa! [ROOT.Char.GetWomanMan] đang cân một sinh vật trên đầu [ROOT.Char.GetHerHis]!' Một giọng reo vui vang lên phía sau Ta và khi quay lại Ta thấy một đám đông đã tụ tập."
  intrigue_scheme_ongoing.5013.a:0 "...TADA! Giờ thì bỏ nó xuống đi. Bỏ ra ngay #EMP!!"
  intrigue_scheme_ongoing.5013.a.tt:0 "Ta mất sinh vật, nhưng ít ra vẫn còn mạng sống…"

  intrigue_scheme_ongoing.5014.t:0 "Thảm Sang Trọng và Độc Đáo"
  intrigue_scheme_ongoing.5014.t_persian: "$persian_has_plush_carpet_modifier$"
  intrigue_scheme_ongoing.5014.desc:0 "Mềm mại, sống động và êm như ánh bình minh đầu tiên — một thương nhân tặng Ta một tấm thảm tinh xảo với hy vọng tạo quan hệ tốt đẹp trong tương lai.\n\nKhi Ta chiêm ngưỡng sợi dệt tinh xảo, một ý nghĩ lóe lên. Chẳng phải tấm thảm này sẽ làm giảm tiếng bước chân sao? Thậm chí che giấu bước đi của một điệp viên vụng về…?"
  intrigue_scheme_ongoing.5014.a:0 "[target.GetTitledFirstNameNoTooltip] sẽ vinh dự khi nhận món quà này."
  intrigue_scheme_ongoing.5014.a.success:0 "[target.GetSheHe|U] nhận quà"
  intrigue_scheme_ongoing.5014.a.failure:0 "[target.GetSheHe|U] nghi ngờ có điều gì đó không ổn"
  intrigue_scheme_ongoing.5014.b:0 "Nhưng trông #EMP thật tuyệt# trong phòng Ta…"

  intrigue_scheme_ongoing.5015.desc:0 "Một tấm thảm mềm mại, sống động, được gửi làm quà từ [owner.GetTitledFirstName].\n\nTại sao [owner.GetSheHe] gửi Ta món quà tinh xảo này Ta không biết, nhưng sợi dệt của tấm thảm thật dễ chịu khi chạm, như làn da người yêu."
  intrigue_scheme_ongoing.5015.a:0 "Tấm thảm này sẽ phủ toàn bộ sàn phòng Ta!"
  intrigue_scheme_ongoing.5015.b:0 "Ta nghĩ Ta nên bỏ nó đi…"

  intrigue_scheme_ongoing.5016.t:0 "Sức Mạnh Của Lời Nói"
  intrigue_scheme_ongoing.5016.desc:0 "[servant.GetTitledFirstName] đứng trước Ta, là người hầu của [target.Custom2('InsultAdjective', ROOT.Char)] [target.GetTitledFirstName].\n\n'Bây giờ, Ta muốn ngươi làm một việc cho Ta… Và dĩ nhiên ngươi sẽ được trả công xứng đáng.'"
  intrigue_scheme_ongoing.5016.a:0 "Những lời thì thầm có thể lật đổ [target.GetTitleAsNameNoTooltip]!"
  intrigue_scheme_ongoing_5016_every_courtier:0 "Mọi quan lại và khách trừ điệp viên"
  intrigue_scheme_ongoing.5016.b:0 "Giữ cửa [target.Custom('ResidenceBuilding')] mở cho Ta."
  intrigue_scheme_ongoing.5016.c_man:0 "Không sao. Chạy về với chủ của ngươi."
  intrigue_scheme_ongoing.5016.c_woman:0 "Không sao. Chạy về với chủ nhân của ngươi."

  intrigue_scheme_ongoing.5017.t:0 "Người [target.Custom2('RelationToMe', SCOPE.sC('spouse'))|U] Dễ Tin"
  intrigue_scheme_ongoing.5017.desc:0 "Ta gần như không kìm nổi niềm vui khi thấy [spouse.GetTitledFirstName], [target.GetTitledFirstNamePossessive] [target.Custom2('RelationToMe', SCOPE.sC('spouse'))] đang chờ Ta cùng một đoàn tùy tùng nhỏ. Nếu Ta có thể khiến #EMP [spouse.GetHerHim]#! giúp Ta trong âm mưu…\n\n'Ngươi đã gửi tin muốn gặp ta, [ROOT.Char.Custom('FormOfAddressForLiege')]?'"
  intrigue_scheme_ongoing.5017.a:1 "Người [spouse.Custom2('RelationToMe', SCOPE.sC('target'))] của ngươi đã gọi ngươi là [spouse.Custom2('InsultAdjectiveArticle', ROOT.Char)] [spouse.Custom2('InsultNoun', ROOT.Char)]."
  intrigue_scheme_ongoing.5017.a.success:0 "[spouse.GetTitledFirstNameNoTooltip] tin Ta"
  intrigue_scheme_ongoing.5017.a.failure:0 "[target.GetTitleAsNameNoTooltip] thuyết phục [spouse.GetHerHim] rằng đó là lời nói dối"
  intrigue_scheme_ongoing.5017.b:0 "Làm ơn, kể cho Ta về [target.Custom('ResidenceBuilding')] của ngươi!"

  intrigue_scheme_ongoing.5018.t:0 "Người Theo Hậu Cung"
  intrigue_scheme_ongoing.5018.desc:0 "[target.Custom2('InsultAdjective', ROOT.Char)] [target.GetTitledFirstName] đang đi chiến.\n\n[target.GetSheHe|U] hiện đang đóng quân ở [location.GetName], và nguồn tin cho Ta biết [target.GetSheHe] sẽ sớm nhận thêm người theo hậu cung — cơ hội hoàn hảo để đưa người của Ta vào trại!"
  intrigue_scheme_ongoing.5018.a:0 "Ẩn mình trong đám đông, họ sẽ báo cáo cho Ta."
  intrigue_scheme_ongoing.5018.b:0 "Bột, lúa mì, thịt… Đốt hết."
  intrigue_scheme_ongoing.5018.msg.t:0 "Hàng tiếp tế bị cháy do tai nạn"

  intrigue_scheme_ongoing.5019.t:0 "Đường Hầm Bí Mật"
  intrigue_scheme_ongoing.5019.desc:1 "Điệp viên của Ta [agent.GetTitledFirstName] đến gặp Ta, nắm chặt một đống giấy trong tay [agent.GetHerHis].\n\n'Ta tìm thấy bản phác thảo kiến trúc cũ của [target.GetTitleAsNamePossessive] [target.Custom('ResidenceBuilding')]! Chúng có thể hơi lỗi thời, nhưng xem này…'"
  intrigue_scheme_ongoing.5019.a:0 "Nhìn giống như một đường hầm chúng ta có thể dùng!"
  intrigue_scheme_ongoing.5019.b:1 "Giá mà Ta có nhiều chỗ ẩn giấu thế này… Gọi kiến trúc sư của Ta."
  intrigue_scheme_ongoing.5019.b.tt:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('architect'))|U] [architect.GetFirstNameNoTooltip] sẽ giám sát công trình."

  intrigue_scheme_ongoing.5021.t:0 "Những Lo Lắng Nguy Hiểm"
  intrigue_scheme_ongoing.5021.desc:0 "Ta đi tìm [owner.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))] của Ta, tại phòng của [owner.GetHerHis] chỉ để gặp một [owner.Custom('GetChamber')] trống rỗng.\n\nLật từng trang giấy của [owner.GetHerHis], Ta tình cờ thấy điều gì đó — những kế hoạch, không thể chối cãi, chống lại [target.Custom2('MyCharacterIntroduction', ROOT.Char)]!"
  intrigue_scheme_ongoing.5021.a:0 "Ý nghĩa của chuyện này là gì, [owner.GetFirstNameNoTooltip]?!"
  intrigue_scheme_ongoing.5021.a.success:0 "[owner.GetSheHe|U] thực sự âm mưu giết người"
  intrigue_scheme_ongoing.5021.a.success.tt:0 "Âm mưu bị phơi bày"
  intrigue_scheme_ongoing.5021.a.failure:0 "[owner.GetSheHe|U] cảm thấy bị xúc phạm"
  intrigue_scheme_ongoing.5021.b:0 "Ta chẳng thấy #EMP gì cả#!."

  intrigue_scheme_ongoing.5022.t:0 "Cáo Buộc"
  intrigue_scheme_ongoing.5022.desc:0 ""Ngươi đang âm mưu giết ai đó?!"\n\n[family_member.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('family_member'))] của ta, đối mặt với ta với vẻ mặt kinh hoàng trên khuôn mặt [family_member.GetHerHis]. Trong tay [family_member.GetHerHis], [family_member.GetSheHe] đang nắm chặt những tờ giấy ghi chú về kế hoạch giết [target.GetTitledFirstName] của ta – những tờ giấy mà ta biết mình đã để trong phòng làm việc riêng."
  intrigue_scheme_ongoing.5022.a:0 "Ta #EMP không bao giờ#!!"
  intrigue_scheme_ongoing.5022.a.success:0 "[family_member.GetSheHe|U] tin Ngài"
  intrigue_scheme_ongoing.5022.a.failure:0 "[family_member.GetSheHe|U] không tin lời Ngài"
  intrigue_scheme_ongoing.5022.b:0 "Vậy là tốt. Nghe Ta nói đây…"
  intrigue_scheme_ongoing.5022.b.success:0 "[family_member.GetSheHe|U] lắng nghe lập luận của Ngài"
  intrigue_scheme_ongoing.5022.b.failure:0 "[family_member.GetSheHe|U] không bị thuyết phục"
  intrigue_scheme_ongoing.5022.c:0 "Có vẻ kế hoạch của Ta vừa leo thang."

  intrigue_scheme_ongoing.5023.desc:0 ""Ngươi không được phép thấy điều đó."\n\nGiọng của [owner.GetTitledFirstNamePossessive] thấp, nhưng ta có thể nghe thấy sự giận dữ trong đó. Khi [owner.GetSheHe] đưa tay về phía thắt lưng [owner.GetHerHis] mình, ta lùi lại một bước, nhưng trước khi ta kịp làm bất cứ điều gì, [owner.GetSheHe] đã lao vào ta, con dao trên tay."
  intrigue_scheme_ongoing.5023.a:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('owner'))|U], làm ơn – Agh!"

  intrigue_scheme_ongoing.5024.t:0 "Lễ Hội Ở [province.GetNameNoTooltip|U]"
  intrigue_scheme_ongoing.5024.desc:0 "[agent.GetTitledFirstName] nói với Ta rằng một lễ hội địa phương ở [province.GetName], quê hương [target.GetTitledFirstName], đang gặp khó khăn về tiền bạc.\n\n'Nếu lễ hội diễn ra, nó sẽ thu hút nhiều người, cả cao lẫn thấp; cơ hội hoàn hảo để thâm nhập!'"
  intrigue_scheme_ongoing.5024.a:0 "Đảm bảo nó được tổ chức."
  intrigue_scheme_ongoing.5024.b:0 "Ta sẽ không lãng phí tiền cho [target.GetHerHim]!"

  intrigue_scheme_ongoing.5026.t:0 "Một Bàn Tay Giúp Đỡ"
  intrigue_scheme_ongoing.5026.desc:0 "Giống như tất cả [target.GetFaith.GetAdherentNamePluralNoTooltip], [target.Custom2('MyCharacterIntroduction', ROOT.Char)] chia sẻ nhiều điều với [target.GetFaith.HighGodName], và mở rộng ra là với [court_chaplain.GetTitledFirstName], hơn là với hầu hết những người phàm trần.\n\nGiá mà ta có thể khiến [court_chaplain.GetCouncilTitle] chuyển đạt lại một số nỗi sợ hãi và kế hoạch của [target.GetTitledFirstNamePossessiveNoTooltip] cho ta...!"
  intrigue_scheme_ongoing.5026.a:0 "'Vì lợi ích của đức tin!'"
  intrigue_scheme_ongoing.5026.a.success:0 "[court_chaplain.GetSheHe|U] giúp Ta"
  intrigue_scheme_ongoing.5026.a.failure:0 "[court_chaplain.GetSheHe|U] từ chối"
  intrigue_scheme_ongoing.5026.a_gregarious:0 "'Đi dạo một chút.'"
  intrigue_scheme_ongoing.5026.a_gregarious_tt:0 "[court_chaplain.GetSheHe|U] thậm chí sẽ không nhận ra rằng [court_chaplain.GetSheHe] kể #EMP mọi thứ# cho Ta!"
  intrigue_scheme_ongoing.5026.b_agent:0 "'Ngươi đã đồng ý giúp Ta rồi, nên…'"
  intrigue_scheme_ongoing.5026.b:0 "'Nhưng theo [target.GetFaith.HighGodName]…'"
  intrigue_scheme_ongoing.5026.b_scholar:0 "'Hãy xem [target.GetFaith.HighGodName] muốn gì.'"
  intrigue_scheme_ongoing.5026.b_scholar_tt:1 "Thật trùng hợp, điều đó cũng trùng với điều Ta muốn!"
  intrigue_scheme_ongoing.5026.c:0 "Chuyện đó giữa [target.GetHerHim] và [target.GetFaith.PantheonTerm]."

  intrigue_scheme_ongoing.3010.t:0 "[scheme.GetNameNoTooltip]: Bí Mật [target.GetCulture.GetLanguage.GetNameNoTooltip]"
  intrigue_scheme_ongoing.3010.desc:0 "Trong kế hoạch đang thực hiện để [scheme.GetNameNoTooltip|l] [target.GetTitledFirstName], một số tay sai của Ta thường chặn thư của [target.GetHerHis]. Nhờ khả năng hiểu [target.GetCulture.GetLanguage.GetName], Ta có thể đọc trực tiếp thay vì dựa vào bản dịch trung gian, dù chắc chắn mất thời gian cho các nhiệm vụ khác.\n\nCó lẽ Ta sẽ thu được thông tin giá trị theo cách này?"
  intrigue_scheme_ongoing.3010.a:0 "Ta sẽ tự dịch [target.GetCulture.GetLanguage.GetNameNoTooltip]."
  intrigue_scheme_ongoing.3010.b:0 "Nghe có vẻ quá mệt cho Ta."

  intrigue_scheme_ongoing.3011.t:0 "[scheme.GetNameNoTooltip]: Mã [language_culture.GetLanguage.GetNameNoTooltip]-[language_culture_2.GetLanguage.GetNameNoTooltip]-[multilingual_agent.GetCulture.GetLanguage.GetNameNoTooltip]"
  intrigue_scheme_ongoing.3011.desc:0 "Trong kế hoạch [scheme.GetNameNoTooltip|l] [target.GetTitledFirstName] của ta, ta đã tranh thủ sự giúp đỡ của [multilingual_agent.GetName], người hóa ra là một bách khoa toàn thư về ngôn ngữ. Sử dụng kiến thức sâu rộng về nhiều phương ngữ của [multilingual_agent.GetHerHis] mình, [multilingual_agent.GetSheHe] đã tạo ra một mật mã mà [multilingual_agent.GetSheHe] khẳng định là 'không thể bẻ khóa'.\n\n"Không chỉ cần một chuyên gia mật mã bậc thầy: họ cũng cần phải hiểu những sắc thái ngữ pháp của [language_culture_2.GetLanguage.GetNameNoTooltip], chi tiết các câu tục ngữ của [language_culture.GetLanguage.GetNameNoTooltip], trong khi vẫn phải ghi nhớ cấu trúc từ ngữ của [multilingual_agent.GetCulture.GetLanguage.GetNameNoTooltip].""
  intrigue_scheme_ongoing.3011.a:0 "Sáng kiến tuyệt vời."
  intrigue_scheme_ongoing.3011.b:0 "Có vẻ lãng phí thời gian."
