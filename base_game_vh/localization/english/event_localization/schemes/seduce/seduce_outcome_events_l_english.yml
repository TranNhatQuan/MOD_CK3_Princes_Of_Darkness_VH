l_english:
  seduce_outcome.permanent_block:0 "[owner.GetTitledFirstName] sẽ không bao giờ cố gạ gẫm Ta nữa"
  seduce_outcome.cooldown:0 "[owner.GetTitledFirstName] sẽ không cố gạ gẫm Ta trong một thời gian"

  seduce_outcome.0001.t:0 "Ngay Bây Giờ hoặc Không Bao Giờ"
  seduce_outcome.0001.desc:0 "Phản ứng của [target.GetTitledFirstNamePossessive] trước những tiến triển của Ta nói lên tất cả những gì Ta cần biết. Đã đến lúc thực hiện kế hoạch của mình.\n\n"
  seduce_outcome.0001.positive.desc:0 "Ta nghĩ cơ hội của Ta tốt, nhưng phải nhớ rằng [discoverer.Custom2('NamePossessiveCharacterIntroduction', target)] luôn dõi theo..."
  seduce_outcome.0001.negative.desc:0 "Nhưng Ta sợ hậu quả. [discoverer.Custom2('NamePossessiveCharacterIntroduction', target)|U] và các tay sai của [discoverer.GetHerHis] có thể đang ẩn mình ở bất kỳ bóng tối nào, nghe lén qua bất kỳ bức tường nào..."
  seduce_outcome.0001.a:0 "[target.GetFirstNameNoTooltip] sẽ thuộc về Ta!"
  seduce_outcome.0001.a.tt:0 "Ta tiến hành gạ gẫm [target.GetTitledFirstName]"
  seduce_outcome.0001.b:0 "Ta không thể mạo hiểm bị phát hiện."

  seduce_outcome.0003.t:0 "Lời Đề Nghị Gợi Cảm"
  seduce_outcome.0003.success.desc:0 "[owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã bước vào cuộc đời ta với những lời mật ngọt và những cái chạm còn ngọt ngào hơn. Đêm khuya thanh vắng, ta chật vật để xua [owner.GetHerHim] ra khỏi tâm trí mình...\n\nNhững xúc cảm đang âm ỉ giữa chúng ta sẽ sớm bùng lên thành ngọn lửa hoặc lụi tàn."
  seduce_outcome.0003.failure.desc:1 "Ở đâu Ta cũng đi, [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] chắc chắn theo sát. Cái nhìn trong mắt [owner.GetHerHis], lời nói trên môi [owner.GetHerHis]... Ta biết chính xác [owner.GetSheHe] đang muốn gì."
  seduce_outcome.0003.a.success:0 "Ta muốn mãi đắm chìm trong ngọn lửa này!"
  seduce_outcome.0003.a.failure:0 "Ta sẽ giữ [owner.GetHerHim] thật gần. #EMP Rất#! gần."
  seduce_outcome.0003.a.tt:1 "[owner.GetShortUIName|U] có thể trở thành người tình của Ta"
  seduce_outcome.0003.b.success:0 "Đây là một mối tình cháy sáng, nhưng ngắn ngủi."
  seduce_outcome.0003.b.failure:0 "Chỉ là một sự xao nhãng cho đêm nay, không hơn."
  seduce_outcome.0003.c:0 "Thật ngọt ngào... nhưng không."
  seduce_outcome.0003.d:0 "Không bao giờ! Thế giới sẽ biết bản chất biến thái của [owner.GetHerHis]!"
  seduce_outcome.0003.e:0 "Ta mệt mỏi với những trò chơi này. Hãy để Ta yên, tất cả các ngươi!"
  seduce_outcome.0003.e.tt:0 "Không ai dám gạ gẫm Ta trong #V 10#! năm"
 
  seduce_outcome.0004.t:0 "[target.Custom('LoverPetName_uppercase')] của Ta"
  seduce_outcome.0004.desc:0 "Khi ta cúi nhìn [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target') )] của ta, [target.GetTitledFirstName] [ROOT.Char.Custom2('DescriptorPositive', SCOPE.sC('target'))], đang thiếp đi trong vòng tay ta, ta thấy mình mỉm cười trong sự mãn nguyện và hạnh phúc ngập tràn.\n\nAi mà ngờ được rằng [target.GetSheHe] lại đáp lại tình cảm và sự tận hiến mà ta cảm nhận!"
  seduce_outcome.0004.a:0 "Ta là [ROOT.Char.GetWomanMan] may mắn nhất trên đời!"

  seduce_outcome.0005.t:0 "Chấm Dứt Thảm Thương"
  seduce_outcome.0005.desc:0 "Với cái chết của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target') )] [target.GetTitledFirstName], những kế hoạch cho tương lai của chúng Ta không còn ý nghĩa.\n\nBất cứ điều gì từng tồn tại, giờ đã chết."
  seduce_outcome.0005.a:0 "Giá như Ta chiếm được tình cảm của [target.GetHerHis] sớm hơn!"

  seduce_outcome.2000.t:0 "Phép Lành Bí Mật"
  seduce_outcome.2000.desc:0 "Khi chúng ta gặp nhau lén lút, Đức Giáo Tông và ta, con người ta tràn ngập một sự kính sợ và khao khát mang tính nhục dục nhiều hơn là tâm linh. Chắc chắn, chưa có ai trước ta nhận được phước lành của Đức Thánh Cha [target.GetHerHis|U] theo một cách như thế này.\n\nBàn tay [target.GetHerHis|U] vươn ra, ta nhắm mắt lại và quỳ xuống..."
  seduce_outcome.2000.a:0 "[target.GetSheHe|U] nắm chìa khóa vương quốc của Ta."
  seduce_outcome.2000.b:0 "Ta đã nhận được phép lành của mình."
 
  seduce_outcome.2010.t:0 "Niềm Vui Trong Rượu"
  seduce_outcome.2010.desc:0 "Ta đến phòng của [target.GetNamePossessive] với hai loại khát, mang theo nhiều rượu cho loại đầu tiên. Ngay lập tức rõ ràng rằng [target.GetSheHe] cũng có cùng suy nghĩ với Ta.\n\nNụ hôn đầu tiên niêm phong giao ước, và rồi chúng Ta trải qua ngày và đêm tiếp theo uống, yêu, uống, yêu..."
  seduce_outcome.2010.a:0 "Ôi, hãy để chuyện này kéo dài mãi!"
  seduce_outcome.2010.b:0 "Quên lãng ngọt ngào, ôm lấy Ta."

  seduce_outcome.2020.t:0 "Chuyện Riêng Tư"
  seduce_outcome.2020.desc:0 "Nhà vệ sinh là một không gian nhỏ, mùi hôi thối vừa được thải ra vẫn còn. Nhưng nó riêng tư, oh thật sự riêng tư...\n\n[target.GetName] nhìn Ta đầy khao khát, cởi bỏ trang phục của [target.GetHerHis]. Ta làm theo, và khi chúng Ta hôn nhau, một làn sóng dục vọng trỗi dậy khiến chúng Ta quên đi cả sự bất tiện về không gian và cảnh tượng cũng như mùi xung quanh."
  seduce_outcome.2020.a:0 "Chúng ta nên làm lại, nhưng có lẽ ở chỗ khác..."
  seduce_outcome.2020.b:0 "Đi vệ sinh để giải quyết, Ta luôn nói vậy."

  seduce_outcome.2030.t:0 "Cơn Thèm Khát Xác Thịt"
  seduce_outcome.2030.a.desc:0 "Thức ăn. Ta biết [target.GetSheHe] thích, và Ta mang nhiều. Khi Ta vẫy tay, [target.GetSheHe] mềm mại cởi bỏ quần áo và nằm xuống. Ta bày cảnh, đặt phô mai, trái cây, mật ong. Trên [target.GetHerHim], bên cạnh [target.GetHerHim]."
  seduce_outcome.2030.alcohol.desc:0 "Rồi, rót rượu ngon lên ngực [target.GetHerHis]."
  seduce_outcome.2030.b.desc:0 "\n\nMột nụ hôn, một cái chạm — cả hai sớm chìm trong khoái lạc. Khi mùi vị và mùi cơ thể [target.GetHerHis] hòa với thức ăn, Ta nhắm mắt và cười — thật là một cuộc sống ngọt ngào!"
  seduce_outcome.2030.a:0 "Hãy có nhiều khoảnh khắc như thế này nữa!"
  seduce_outcome.2030.b:0 "Một bữa ăn thật tuyệt vời!"

  seduce_outcome.2040.t:0 "Bước Vào Bóng Tối"
  seduce_outcome.2040.desc:0 "Khi bóng tối kéo dài, Ta thấy [target.GetTitledFirstName] dưới bức tường [owner.Custom('ResidenceBuilding')], chờ Ta.\n\n[target.GetSheHe|U] tiến về phía Ta, ban đầu do dự, rồi háo hức. Ta nghe nhịp thở của [target.GetHerHis] nhanh hơn khi Ta kéo [target.GetHerHim] gần. Trong bóng râm của bức tường, chúng Ta làm tình, lính tuần tra không nhận ra đam mê của chúng Ta..."
  seduce_outcome.2040.a:0 "Một lần nữa!"
  seduce_outcome.2040.b:0 "Sau khi chinh phục [owner.Custom('ResidenceBuilding')], Ta rút lui."

  seduce_outcome.2050.t:0 "Lời Thề Bí Mật"
  seduce_outcome.2050.desc:0 "Chúng ta gặp nhau trong đêm, lén lút, che giấu khỏi tai mắt của thế giới bên ngoài. Ta đã thề hẹn với [target.GetHerHim]: "Hãy để chúng ta thành thân, thực sự là vậy, nhưng trong bí mật. Sẽ không ai biết ngoại trừ hai ta. Một cuộc hôn nhân thuần khiết, thượng đẳng hơn hẳn những gì lễ giáo đã ép buộc chúng ta!"\n\n[target.GetSheHe|U] gật đầu đồng ý của [target.GetHerHis], cảm xúc khiến [target.GetHerHim] nghẹt thở. Rồi, dưới bức màn che chở của bóng đêm, chúng ta viên mãn lời thề ước bí mật của mình..."
  seduce_outcome.2050.a:0 "Một mối dây kết nối mãi mãi!"
  seduce_outcome.2050.b:0 "Một đêm kỳ diệu, nhưng chúng ta không thể gặp nhau như thế lần nữa."

  seduce_outcome.2301.t:0 "Trong Phòng Của [target.GetHerHis|U]"
  seduce_outcome.2301.desc:0 "Một cơn rùng mình của sự mong đợi chạy dọc sống lưng Ta khi Ta đi đến phòng của [target.GetTitledFirstNamePossessive]. Ngay khi [target.GetSheHe] mở cửa, [target.GetSheHe] [target.Custom('quirk_pos_present')], mỉm cười [target.Custom('quirk_pos_adverb')], và kéo Ta vào trong bằng tay giữ lấy [ROOT.Char.Custom('GetUpperClothingArticle')].\n\nKhi [target.GetHerHis] vòng tay ôm lấy Ta, ngọn lửa trong ngực Ta bùng cháy, và phần còn lại của đêm trôi qua trong hơi ấm và ngọn lửa."
  seduce_outcome.2301.a:0 "Ôi [target.GetFirstNameNoTooltip], [target.Custom('LoverPetName')] của Ta, hãy gặp nhau lần nữa!"
  seduce_outcome.2301.a.tt:0 "#F Lại nữa, lại nữa, lại nữa...!#!"
  seduce_outcome.2301.b:1 "[target.GetSheHe|U] chắc chắn biết cách làm một [ROOT.Char.GetWomanMan] hài lòng."


  seduce_outcome.2302.t:0 "Ở Bất Kỳ Tòa Án Nào Khác"
  seduce_outcome.2302.desc_court_owner:0 ""Ngươi đã đi cả đoạn đường này vì ta, [ROOT.Char.Custom('LoverPetName')] của ta?"\n\nSau khi tìm khắp hành lang [target.GetTitledFirstNamePossessive] [target.Custom('ResidenceBuilding')], mặc đồ hầu để tránh chú ý, Ta tìm thấy [target.GetHerHim] trong một khu vườn riêng."
  seduce_outcome.2302.desc_not_court_owner:1 ""Ngươi đã đi cả đoạn đường này vì ta, [ROOT.Char.Custom('LoverPetName')] của ta?"\n\nSau khi tìm khắp hành lang [target.GetTitledFirstNamePossessive] [target.Custom('ResidenceBuilding')], mặc đồ hầu để tránh chú ý, Ta tìm thấy [target.GetFirstName] trong một khu vườn riêng."
  seduce_outcome.2302.desc_end:0 "[target.GetSheHe|U] bừng sáng khi [target.GetSheHe] nhìn thấy ta, và cảnh tượng của [target.GetHerHim] đến lượt nó lại làm ta bừng sáng.\n\n[ROOT.Char.Custom('GetClothingArticle')] tơi tả mà ta mặc đã sớm bị lãng quên trên sàn nhà khi chúng ta dành cả đêm để đảm bảo rằng chuyến đi của ta là bõ công sức!"
  seduce_outcome.2302.a:0 "Vì ngươi, Ta sẽ đi chuyến đường này cả trăm lần!"
  seduce_outcome.2302.b:0 "Ngọt ngào và thoáng qua, nhưng thật đáng nhớ."

  seduce_outcome.2303.t:0 "Những Thì Thầm Của Trái Tim"
  seduce_outcome.2303.desc:0 ""[ROOT.Char.Custom2('ComplimentSentence', SCOPE.sC('target'))|U]."\n\n"Ta sẽ không bao giờ chán nụ cười [owner.Custom('quirk_pos_adjective')] của ngươi," [target.GetTitledFirstName] đáp lại với gương mặt đỏ bừng, "cũng như vòng tay ôm của ngươi."\n\nNhững lời tán dương lầm rầm chúng Ta trao đổi sớm trở nên khó hiểu, nhưng những gì thay thế nói một ngôn ngữ rõ ràng hơn."
  seduce_outcome.2303.a:0 "Ai dám từ chối một [target.GetWomanMan] tài hoa như thế bất cứ điều gì?"
  seduce_outcome.2303.b:0 "Ta chắc đã thích cuộc trao đổi này, nhưng cuộc trò chuyện kết thúc ở đây."

  seduce_outcome.2304.t:0 "Dưới Bầu Trời Rộng"
  seduce_outcome.2304.desc:0 "[target.GetTitledFirstName] và ta sát cánh cúi mình, con [ROOT.Char.Custom('GetAnimalType')] [ROOT.Char.Custom('GetAnimalAdjective')] trước mặt không hề hay biết sự hiện diện của chúng ta. Sự chú ý của ta là không hề lay chuyển — đặc biệt là khi [target.Custom('GetClothingArticle')] của [target.GetFirstNamePossessive] sượt qua người ta. Khi ta vươn tay để ôm lấy [target.GetHerHim], ta nhận ra rằng [target.GetSheHe] cũng đã đặt sự chú ý của [target.GetHerHis] #EMP vào nơi khác#!.\n\nKhi con [ROOT.Char.Custom('GetAnimalType')] biến mất vào [ROOT.Char.Custom('TerrainType')], da thịt trần trụi của chúng ta đã được ôm ấp bởi lớp đất mềm mại, cũng như bởi chính nhau."
  seduce_outcome.2304.a:0 "Được ở bên nhau là điều tự nhiên!"
  seduce_outcome.2304.b:0 "Hợp lại rồi lại rời xa — đó là phần của cuộc sống."

  seduce_outcome.2305.t:0 "Bức Thư Tình"
  seduce_outcome.2305.desc_opening:0 ""[letterAuthor.Custom2('love_letter', SCOPE.sC('love_letter_target'))]"
  seduce_outcome.2305.desc_ending:0 ""\n\nChưa kịp đọc xong bức thư từ [target.GetTitledFirstName] gửi đến, Ta đã trên đường tới phòng [target.GetHerHis]."
  seduce_outcome.2305.a:0 "Hành động của Ta sẽ trả lời lời nói của [target.GetHerHis]!"
  seduce_outcome.2305.a_terrible:0 "#F Hay đúng hơn, ý nghĩa ẩn sau lời [target.GetHerHis] — bài thơ đó thật tệ!#!"
  seduce_outcome.2305.a_okay:0 "#F Và bù đắp cho những gì còn thiếu!#!"
  seduce_outcome.2305.a_great:0 "#F Một tác giả tài hoa xứng đáng được tưởng thưởng!#!"
  seduce_outcome.2305.a_amazing:0 "#F Ngọn lửa mà [target.GetSheHe] thắp lên bằng những áng văn của [target.GetHerHis] chỉ có thể được dập tắt trong vòng tay của [target.GetHerHis]!#!"
  seduce_outcome.2305.b:0 "Sự kết hợp của chúng Ta sẽ độc đáo như bài thơ của [target.GetHerHis]."

  seduce_outcome.2306.t:0 "Người Yêu Quý [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))|U] Của Ta"
  seduce_outcome.2306.desc:0 "Tất cả Bạn Bè đã được gửi đi, và giường của chúng Ta được trang trí bằng [SCOPE.Custom('SeductionObjectMultiple')]. Khi [target.GetTitledFirstName] bước vào phòng, [target.GetSheHe] mỉm cười [target.Custom('quirk_pos_adverb')] và hòa nhập cùng Ta không chút do dự.\n\nVới sự giúp đỡ của tay, miệng và chi, chúng Ta củng cố sự tận tụy đã thề trước [ROOT.Char.GetFaith.HighGodName] — có lẽ theo cách xác thịt hơn dự định."
  seduce_outcome.2306.a:0 "Như đã kết hôn, giờ chúng Ta hợp nhất trong trái tim!"
  seduce_outcome.2306.b:0 "Sự ràng buộc của hôn nhân là đủ."

  seduce_outcome.2307.t:0 "Người Tình [target.Custom2('InsultAdjective', ROOT.Char)|U] Của Ta"
  seduce_outcome.2307.desc:0 "Khi Ta tiến gần [target.GetTitledFirstName], Ta không biết nên xé quần áo [target.GetHerHis] hay đấm nụ cười [target.Custom('quirk_neg_adjective')] trên mặt [target.GetHerHis]. [target.GetSheHe|U] hôn Ta — một thử thách — và Ta kéo [target.GetHerHim] lại gần — một phản ứng xứng đáng.\n\nCảm xúc chiến tranh trong ngực Ta được phản chiếu qua cơ thể chúng Ta; cả đêm chúng Ta trao nhau vừa nhục mạ vừa hạnh phúc."
  seduce_outcome.2307.a:0 "Hôn Ta nữa đi, [target.Custom2('InsultAdjective', ROOT.Char)] [target.Custom2('InsultNoun', ROOT.Char)]!"
  seduce_outcome.2307.b:0 "Để Ta yên, [target.Custom2('InsultNounSexual', ROOT.Char)]."

  seduce_outcome.2308.t:0 "Người Yêu Quý [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))|U] Của Ta"
  seduce_outcome.2308.desc_illigal:0 "Khi [target.Custom('ComplimentAdjective')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))] [target.GetTitledFirstName] mỉm cười [target.Custom('quirk_pos_adverb')], Ta khó mà nhớ rằng sự hấp dẫn Ta cảm thấy bị lên án.\n\nRồi — khi [target.GetSheHe] kéo áo [ROOT.Char.Custom('GetUpperClothingArticle')] Ta lên và để tay [target.GetHerHis] lang thang — Ta nhận ra Ta không quan tâm."
  seduce_outcome.2308.desc_not_illigal:0 "Khi [target.Custom('ComplimentAdjective')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))] [target.GetTitledFirstName] mỉm cười [target.Custom('quirk_pos_adverb')], Ta từ bỏ mọi kiềm chế. Xé [ROOT.Char.Custom('GetUpperClothingArticle')] của [target.GetHerHim], đặt tay quanh eo [target.GetHerHis], miệng trên cổ [target.GetHerHis], khao khát dâng trào đối mặt với [target.GetHerHis]...\n\n"
  seduce_outcome.2308.a:0 "Tình yêu một [target.Custom2('RelationToMeShort', ROOT.Char)] dành cho [ROOT.Char.GetHerHis] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))] không thể sai!"
  seduce_outcome.2308.b:0 "[target.GetSheHe|U] sẽ không là gì ngoài [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))] của Ta."

  seduce_outcome.2309.t:0 "Cơn Khát Đam Mê"
  seduce_outcome.2309.desc_opening:0 "Ta thấy [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))] [target.GetTitledFirstName] chờ đợi háo hức."
  seduce_outcome.2309.desc_ending:0 "[ROOT.Char.Custom2('sex_scene', SCOPE.sC('target'))]"
  seduce_outcome.2309.a:0 "Điều này quá tuyệt để chỉ là lần một."

  seduce_outcome.2900.t:0 "Cơn Thịnh Nộ Của [target_liege.GetTitledFirstNamePossessiveNoTooltip]"
  seduce_outcome.2900.start.desc:0 "Khi tiếng la hét và sủa vang lên, bức tường [target_liege.Custom('FortifiedBuilding')]"
  seduce_outcome.2900.capital.desc:0 "của [capital.GetNameNoTierNoTooltip]"
  seduce_outcome.2900.end.desc:1 "vẫn gần một cách khó chịu. Trước khi ai đó phát hiện, Ta xuống ngựa và trốn sau một số [target_liege.Custom('OutdoorsHidingPlace')] bên lề đường.\n\nTim Ta đập như trống khi đoàn săn bắn phi nước đại qua. “Nhanh lên! [ROOT.Char.GetTitledFirstNameNoTooltip] không thể đi xa được!”"
  seduce_outcome.2900.a:0 "Bây giờ chúng ta sẽ ra sao?"

  seduce_outcome.3901.t:0 "Một Con Rắn Tại Triều"
  seduce_outcome.3901.desc:0 "Ta nhận ra ánh mắt lo lắng trên khuôn mặt người hầu. [dummy_servant_gender.GetSheHe|U] đến mang tin xấu.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ngươi phải đến ngay! [owner.Custom2('YourCharacterIntroduction', ROOT.Char)|U] vừa bị nhìn thấy rời khỏi phòng của [target.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)]!\""
  seduce_outcome.3900.a:0 "Điều này chỉ có thể có một nghĩa!"

  seduce_outcome.3000.desc:0 "Khi chúng ta gặp nhau lén lút, Đức Giáo Tông và ta, con người ta tràn ngập một sự kính sợ và khao khát mang tính nhục dục nhiều hơn là tâm linh. Chắc chắn, chưa có ai trước ta nhận được phước lành của Đức Thánh Cha [SCOPE.sC('owner').GetHerHis|U] theo một cách như thế này.\n\nBàn tay [owner.GetHerHis|U] vươn ra, ta nhắm mắt lại và quỳ xuống..."
  seduce_outcome.3000.a:0 "[owner.GetSheHe|U] nắm chìa khóa vương quốc của Ta."

  seduce_outcome.3010.desc:0 "[owner.GetTitledFirstName ] đến phòng Ta, rõ ràng với hai loại khát, và mang theo nhiều rượu cho loại đầu tiên. Ta dễ dàng chứng minh rằng Ta cùng chí hướng với [owner.GetSheHe].\n\nNụ hôn đầu tiên niêm phong giao ước và sau đó chúng Ta trải qua ngày và đêm tiếp theo uống, yêu, uống, yêu..."

  seduce_outcome.3020.desc:1 "Nhà vệ sinh là một không gian nhỏ, mùi hôi thối vừa được thải ra vẫn còn. Nhưng nó riêng tư, oh thật sự riêng tư...\n\nTa nhìn [owner.GetTitledFirstName] đầy khao khát, cởi bỏ trang phục của mình. [owner.GetSheHe|U] làm tương tự, và khi chúng Ta hôn nhau, một làn sóng dục vọng trỗi dậy khiến chúng Ta quên đi sự bất tiện không gian và cảnh tượng cũng như mùi xung quanh."

  seduce_outcome.3030.a.desc:1 "[owner.GetTitledFirstName] xuất hiện, mang theo thức ăn — rất nhiều; ngài ấy biết ta thích nó. [owner.GetSheHe|U] vẫy tay của [owner.GetHerHis], và ta ngoan ngoãn cởi bỏ xiêm y rồi nằm xuống. [owner.GetSheHe|U] sắp xếp bối cảnh, đặt phô mai, trái cây, mật ong. Lên cơ thể ta, ngay bên cạnh ta."
  seduce_outcome.3030.alcohol.desc:0 "Rồi, rót rượu ngon lên ngực Ta."
  seduce_outcome.3030.b.desc:0 "\n\nMột nụ hôn, một cái chạm — chúng Ta bắt đầu tận hưởng, cả hai sớm chìm trong khoái lạc. Khi hương vị và mùi cơ thể [owner.GetHerHis] hòa với thức ăn, Ta nhắm mắt và cười — thật là cuộc sống ngọt ngào!"

  seduce_outcome.3040.desc:0 "Khi bóng tối kéo dài, Ta thấy [owner.GetTitledFirstName] tiến tới Ta trong bóng tối dưới bức tường lâu đài, mỉm cười [target.Custom('quirk_pos_adverb')] khi [owner.GetSheHe] thì thầm: “Ngươi biết ta đến vì sao.”\n\nTa tiến về phía [owner.GetHerHim], ban đầu do dự, rồi háo hức. Nhịp tim Ta nhanh lên khi [owner.GetSheHe] kéo Ta gần. Trong bóng râm của tường, chúng Ta làm tình, lính tuần tra bên trên không nhận ra đam mê của chúng Ta."

  seduce_outcome.3050.desc:0 "Chúng Ta gặp nhau vào ban đêm, bí mật, che chắn khỏi mắt và tai thế giới bên ngoài. [owner.GetSheHe|U] thề với Ta: \"Hãy cưới nhau, thật sự, nhưng bí mật. Chỉ có hai chúng ta biết. Một cuộc hôn nhân thuần khiết, cao hơn những gì truyền thống áp đặt!\"\n\nTa gật đầu đồng ý, cảm xúc khiến Ta hụt hơi. Rồi, dưới lớp màn đêm, chúng Ta hoàn thành lời thề bí mật..."

  seduce_outcome.3301.t:0 "Trong Phòng Của Ta"
  seduce_outcome.3301.desc:0 "Một cơn rùng mình mong đợi chạy dọc sống lưng khi có tiếng gõ vang lên trong sự tĩnh lặng của phòng Ta. Có phải #EMP [owner.GetHerHim]#!?\n\nTa được chào đón bởi [owner.GetTitledFirstName], mỉm cười [owner.Custom('quirk_pos_adverb')], dục vọng hiển hiện trên mặt [owner.GetHerHis]. Cuối cùng! Khi vòng tay [owner.GetHerHis] ôm Ta, ngọn lửa trong ngực bùng cháy, và phần còn lại của đêm trôi qua trong hơi ấm và ngọn lửa."
  seduce_outcome.3301.a:0 "Ôi [owner.GetFirstNameNoTooltip], [owner.Custom('LoverPetName')] của Ta, hãy gặp nhau lần nữa!"
  seduce_outcome.3301.a.tt:0 "#F Lại nữa, lại nữa, lại nữa...!#!"
  seduce_outcome.3301.b:0 "Người [owner.GetTitleTierName] đó chắc chắn biết cách làm một [ROOT.Char.GetWomanMan] hài lòng."
 
  seduce_outcome.3302.desc_opening:1 "Đi dạo trong vườn, Ta bất ngờ gặp một cảnh tượng ngọt ngào hơn bất cứ bông hoa nào: [owner.GetTitledFirstName] mặc trang phục hầu và nở nụ cười [owner.Custom('quirk_pos_adjective')].\n\n"
  seduce_outcome.3302.desc_court_owner:0 ""Không gì có thể ngăn cản Ta đến bên Ngài, [ROOT.Char.Custom('LoverPetName')] của Ta – ít nhất là khoảng cách!""
  seduce_outcome.3302.desc_not_court_owner:0 ""Không gì có thể ngăn cản Ta đến bên Ngài, [ROOT.Char.Custom('LoverPetName')] của Ta – không khoảng cách, cũng không phải [court_owner.GetTitledFirstName]!""
  seduce_outcome.3302.desc_end:0 "\n\nTa nhanh chóng cởi bỏ [ROOT.Char.Custom('GetUpperClothingArticle')] của hầu mà [owner.GetSheHe] đang mặc, rồi tất cả trang phục khác. Rốt cuộc, Ta muốn cảm ơn [owner.GetFirstName] vì đã đi cả quãng đường này!"
  seduce_outcome.3302.a:0 "Đừng để chúng ta xa nhau quá lâu lần nữa!"

  seduce_outcome.3303.t:0 "Những Thì Thầm Của Trái Tim"
  seduce_outcome.3303.desc:0 ""[ROOT.Char.Custom2('ComplimentSentence', SCOPE.sC('owner'))|U]."\n\n"Ta sẽ không bao giờ chán nụ cười [target.Custom('quirk_pos_adjective')] của Ngài," [owner.GetTitledFirstName] đáp lại với gương mặt đỏ ửng, "cũng như vòng tay ôm của Ngài."\n\nNhững lời tán dương lí nhí chúng Ta trao nhau sớm trở nên khó hiểu, nhưng những gì thay thế cho chúng lại nói lên một ngôn ngữ rõ ràng hơn."
  seduce_outcome.3303.a:0 "Chúng ta sẽ tiếp tục cuộc trò chuyện này mãi thôi!"

  seduce_outcome.3304.desc:0 "[owner.GetTitledFirstName] và ta sát cánh cúi mình, con [owner.Custom('GetAnimalType')] [owner.Custom('GetAnimalAdjective')] trước mặt không hề hay biết sự hiện diện của chúng ta. Sự chú ý của ta là không hề lay chuyển — đặc biệt là khi [owner.Custom('GetClothingArticle')] của [owner.GetFirstNamePossessive] sượt qua người ta. Khi ta vươn tay để ôm lấy [owner.GetHerHim], ta nhận ra rằng [owner.GetSheHe] cũng đã đặt sự chú ý của [owner.GetHerHis] #EMP vào nơi khác#!.\n\nKhi con [owner.Custom('GetAnimalType')] biến mất vào [ROOT.Char.Custom('TerrainType')], da thịt trần trụi của chúng ta đã được ôm ấp bởi lớp đất mềm mại, cũng như bởi chính nhau."
  seduce_outcome.3304.a:0 "Được ở bên nhau là điều hoàn toàn tự nhiên!"

  seduce_outcome.3305.desc:1 ""[letterAuthor.Custom2('love_letter', SCOPE.sC('love_letter_target'))]"\n\nSự trân trọng mà Ta cảm nhận với [owner.GetFirstName] vì đã viết cho Ta một bài thơ so với niềm đam mê mà Ta cảm thấy khi trả ơn [owner.GetHerHim] chỉ là hạt cát giữa biển khơi."
  seduce_outcome.3305.a:0 "Hãy để cơ thể chúng ta cùng nhau kể thơ, [owner.Custom('LoverPetName')] của Ta!"

  seduce_outcome.3306.t:0 "Người Yêu Quý [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))|U] Của Ta"
  seduce_outcome.3306.desc:0 "Khi Ta trở về phòng ngủ cùng [owner.GetTitledFirstName], Ta gặp một cảnh tượng bất ngờ – nhưng thật đáng trân trọng. Giường của chúng Ta được trang trí bằng [SCOPE.Custom('SeductionObjectMultiple')], và [owner.GetFirstName] [owner.GetHerselfHimself] đang nằm trên giường, nở nụ cười [owner.Custom('quirk_pos_adverb')].\n\nBằng tay, miệng và thân thể, chúng Ta khẳng định lại lời thề đã hứa trước [ROOT.Char.GetFaith.HighGodName] – có lẽ theo cách dục vọng hơn là tinh thần."
  seduce_outcome.3306.a:0 "Như chúng ta đã được kết hợp trong hôn nhân, giờ đây chúng ta kết hợp trong trái tim!"

  seduce_outcome.3307.t:0 "Người Tình [owner.Custom2('InsultAdjective', ROOT.Char)|U] Của Ta"
  seduce_outcome.3307.desc:0 "Khi [owner.GetTitledFirstName] tiến lại gần, Ta không biết nên xé quần áo khỏi cơ thể [owner.GetHerHis] hay tát vào nụ cười [owner.Custom('quirk_neg_adjective')] trên mặt [owner.GetHerHis]. Ta hôn [owner.GetHerHim] – một thử thách – và [owner.GetSheHe] kéo Ta gần hơn – một phản ứng thích hợp.\n\nNhững cảm xúc hỗn loạn trong lồng ngực Ta được phản chiếu qua cơ thể chúng Ta; chúng Ta dành cả đêm trao nhau cả sỉ nhục lẫn khoái lạc."
  seduce_outcome.3307.a:0 "Hôn Ta lần nữa, [owner.Custom2('InsultAdjective', ROOT.Char)] [owner.Custom2('InsultNoun', ROOT.Char)] của Ta!"
  seduce_outcome.3307.b:0 "Khoảnh khắc yếu đuối này tốt hơn nên quên đi."

  seduce_outcome.3308.t:0 "Người Yêu Quý [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('owner'))|U] Của Ta"
  seduce_outcome.3308.desc_illigal:0 "Khi [owner.GetTitledFirstName] – [owner.Custom('ComplimentAdjective')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))] – mỉm cười [owner.Custom('quirk_pos_adverb')], Ta khó mà nhớ rằng cảm giác bị cấm đoán.\n\nRồi – khi [owner.GetSheHe] kéo lên [ROOT.Char.Custom('GetUpperClothingArticle')] của Ta và để tay [owner.GetHerHis] lang thang – Ta nhận ra rằng Ta chẳng còn bận tâm."
  seduce_outcome.3308.desc_not_illigal:0 "Khi [owner.GetTitledFirstName] — [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))] [owner.Custom('ComplimentAdjective')] của ta — mỉm cười [owner.Custom('quirk_pos_adverb')] và xé toạc [ROOT.Char.Custom('GetUpperClothingArticle')] khỏi người ta, ta tan chảy vào vòng tay của [owner.GetHerHis]. [owner.GetSheHe|U] vòng tay của [owner.GetHerHis] qua eo ta, đặt miệng của [owner.GetHerHis] lên cổ ta, áp sát dục vọng nhức nhối của [owner.GetHerHis] vào của chính ta...\n\n"
  seduce_outcome.3308.a:0 "Tình yêu chúng Ta chia sẻ không thể là sai!"

  seduce_outcome.3309.desc_opening:0 "Người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))] [owner.GetTitledFirstName] của Ta tiến lại gần Ta với niềm háo hức."
  seduce_outcome.3309.desc:0 "[ROOT.Char.Custom2('sex_scene', SCOPE.sC('owner'))]"

  seduce_outcome.4001.t:0 "Vết Cắn Của Sự Từ Chối"
  seduce_outcome.4001.incest.desc:0 ""Ta thích ngài [ROOT.Char.GetFirstNameNoTooltip], ta thực sự rất thích," [target.GetTitledFirstName] mỉm cười [target.Custom('quirk_pos_adverb')] khi [target.GetSheHe] từ chối ta. "Nhưng ngài là #EMP [target.Custom2('RelationToMe', SCOPE.sC('owner') )]#! của ta, và điều đó thì— chà, ai biết được tương lai sẽ mang đến điều gì.""
  seduce_outcome.4001.regular.desc:0 ""Ngài là [target.Custom2('ComplimentAdjectiveArticle', ROOT.Char)] [ROOT.Char.GetWomanMan] [ROOT.Char.GetFirstNameNoTooltip], nhưng Ta không thích Ngài theo cách đó," nói [target.GetTitledFirstName] và [target.Custom('quirk_neg_present')]. "Chỉ [target.GetFaith.HighGodName] biết tương lai sẽ ra sao.""
  seduce_outcome.4001.a:0 "Ồ... Vâng, tất nhiên rồi..."

  seduce_outcome.4002.desc:0 "Khi Ta bước vào phòng [target.GetTitledFirstNamePossessive] vào đêm khuya, Ta không được chào đón bằng vòng tay ngọt ngào, mà bằng một [target.Custom2('InsultNoun', ROOT.Char)] khinh bỉ!\n\n"Ta đã chịu đựng những nỗ lực hài hước của Ngài để quyến rũ Ta. Nhưng điều này Ta không thể chịu được! Tránh xa Ta, [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('target'))] [ROOT.Char.Custom2('InsultNounSexual', SCOPE.sC('target'))]!""
  seduce_outcome.4002.a:0 "Chà, Ngài thật là một... [target.Custom2('InsultAdjective', ROOT.Char)]... [target.Custom2('InsultNounSexual', ROOT.Char)]!"

  seduce_outcome.4003.t:0 "Bị Lộ"
  seduce_outcome.4003.plot.desc:0 "[target.GetTitledFirstName] chào đón Ta bằng nụ cười tinh nghịch, và đôi tay háo hức [target.GetHerHis] lập tức bắt đầu tháo cúc và dây buộc. Trong vài nhịp tim, Ta đứng trần và run rẩy trước mặt [target.GetHerHim]. Nhưng khi Ta cố đáp lại, [target.GetFirstNameNoTooltip] đẩy Ta ra — và la hét!\n\n"Vệ binh! Có kẻ đột nhập vào phòng Ta! #EMP Vệ binh!#!"\n\nTrần như nhộng, Ta lao qua phòng và chui ra cửa sổ."
  seduce_outcome.4003.regular.desc:0 "Khi Ta trèo lên cửa sổ [target.GetTitledFirstNamePossessive], tiếng la hét kinh ngạc của [target.GetHerHis] không phải là lời chào đón Ta mong đợi! Ta không kịp ngăn [target.GetHerHim] trước khi [target.GetSheHe] chạy tới cửa và mở tung nó.\n\n"Giúp Ta! Vệ binh! Có kẻ đột nhập vào phòng Ta!"\n\nTrước khi đêm nay trở nên tồi tệ hơn, Ta chui xuống đường cũ."
  seduce_outcome.4003.a.plot:0 "Tên [target.Custom2('InsultAdjective', ROOT.Char)] [target.Custom2('InsultNoun', ROOT.Char)] sẽ phải trả giá!"
  seduce_outcome.4003.a.regular:0 "Có lẽ Ta đã đánh giá sai sự háo hức của [target.GetHerHis]."

  seduce_outcome.4004.t:0 "Trò Chơi Nguy Hiểm"
  seduce_outcome.4004.start.desc:0 "Tim Ta đập như búa khi Ta gõ cửa."
  seduce_outcome.4004.incest.desc:0 ""[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target') )] ngọt ngào nhất, ngài có đó không? Là ta đây – [ROOT.Char.GetFirstNameNoTooltip]!""
  seduce_outcome.4004.end.desc:0 "\n\nCánh cửa hé mở, lộ ra [target.GetFirstName] đau khổ. "Xin tha cho Ta [target.Custom2('RelationToMeShort', ROOT.Char)], nhưng Ta không thể làm được. Ta ước... Không, quá nguy hiểm!"\n\nMất lời, [target.GetSheHe] hôn Ta nhanh chóng, rồi đóng sầm cửa trước mặt Ta!"
  seduce_outcome.4004.sodomy.desc:0 ""[target.Custom('LoverPetName')|U], Ngài có ở đó không? Chính Ta – [ROOT.Char.GetFirstNameNoTooltip]!""
  seduce_outcome.4004.a:0 "Chúng ta cần gì phải bận tâm? Mở cửa ra đi!"

  seduce_outcome.4005.desc:0 "Giàn leo dưới cửa sổ [target.GetTitledFirstNamePossessive] trông không chắc chắn, nhưng không gì ngăn được ham muốn của Ta! Cuối chặng leo nguy hiểm, ngón tay Ta quấn quanh bậu cửa sổ [target.GetHerHis].\n\n"[target.GetFirstNameNoTooltip]! Mở ra đi, [target.Custom('LoverPetName')] của Ta! Chính Ta – [ROOT.Char.GetFirstNameNoTooltip]!" Ta gõ vào cửa, nhưng không ai trả lời.\n\n"Ngài vừa gọi [target_liege.Custom2('RelationToMeShort', SCOPE.sC('target'))] của Ta là gì, đồ [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('target_liege'))] [ROOT.Char.Custom2('InsultNounSexual', SCOPE.sC('target_liege'))]?!" Ta ngước lên. [target_liege.GetTitledFirstName] đang nghiêng người ra cửa sổ phía trên Ta!"
  seduce_outcome.4005.a:0 "Có lẽ đã đến lúc rút lui!"

  seduce_outcome.4900.desc:0 "Ta đang hướng về phòng mình để tận hưởng giấc ngủ phúc lành thì nghe thấy tiếng xào xạc nhẹ từ một cửa sổ. Ta nghĩ chỉ là gió – cho đến khi gió bắt đầu nói.\n\n"[target.GetFirstNameNoTooltip]! Mở ra đi, [target.Custom('LoverPetName')] của Ta! Chính Ta – [owner.GetFirstNameNoTooltip]!" Ta đẩy cửa sổ ra, và thật không ngờ; một [owner.GetWomanMan] đã trèo lên cửa sổ [target.GetTitledFirstNamePossessive]! Đó là [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
  seduce_outcome.4900.a.family:0 "Ngài vừa gọi [target_liege.Custom2('RelationToMeShort', SCOPE.sC('target'))] của Ta là gì, đồ [owner.Custom2('InsultNounSexual', SCOPE.sC('target_liege'))]?!"
  seduce_outcome.4900.a.courtier:0 "Theo [ROOT.Char.GetFaith.DevilName], Ngài không biết xấu hổ sao? Vệ binh!"
  
  seduce_outcome.8101.t:1 "Tình Yêu Của [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('owner') )|U]"
  seduce_outcome.8101.desc:0 "Không thể còn chút nghi ngờ nào nữa. [owner.GetTitledFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner') )] của chính ta – muốn tiến xa hơn tình thân gia đình...\n\n"
  seduce_outcome.8101.desc_positive:0 "Dù Ta không thể nói rằng ý nghĩ này chưa từng thoáng qua, nhưng sự nhận ra vẫn là một cú sốc."
  seduce_outcome.8101.desc_neutral:0 "Dù Ta rất quý trọng [owner.GetHerHim], sự nhận ra vẫn là một cú sốc."
  seduce_outcome.8101.desc_negative:0 "Liệu sự đồi bại của [ROOT.Char.Custom2('InsultNounSexual', SCOPE.sC('owner'))] này có bao giờ kết thúc?"
  seduce_outcome.8101.a:0 "Dừng sự điên rồ này lại đi! Ta là #EMP [owner.Custom2('RelationToMe', SCOPE.sC('target') )] #! của ngài!"
  seduce_outcome.8101.c:0 "Thế giới sẽ biết những biến thái kinh tởm của Ngài!"
  seduce_outcome.8101.b:0 "Vâng, nhưng cuộc sống sẽ ra sao nếu không có chút hưởng thụ?"
  seduce_outcome.8101.b.tt:0 "Ta sẽ không ngăn cản [owner.GetFirstNameNoTooltip] theo đuổi [owner.GetHerHis]"
 
  seduce_outcome.blocked_from_seduction:0 "Ta sẽ không thể cố gắng quyến rũ [target.GetTitledFirstName] nữa"

  seduce_outcome.8102.t:0 "Vết Cắn Của Sự Từ Chối"
  seduce_outcome.8102.desc:0 ""Chuyện này đã đi quá xa rồi, [target.Custom2('RelationToMe', SCOPE.sC('owner') )]. Vì thánh thần [ROOT.Char.GetFaith.HighGodNamePossessive], ta là [owner.Custom2('RelationToMe', SCOPE.sC('target') )] của ngài!"\n\n[target.GetFirstName] [target.Custom('quirk_neg_present')] khi [target.GetSheHe] làm rõ sự khinh miệt của [target.GetHerHis] đối với những lời gạ gẫm tình ái của ta."
  seduce_outcome.8102.a:0 "Ta cứ chắc chắn rằng chúng ta có điều gì đó đặc biệt!"

  seduce_outcome.8103.t:0 "Bị Bỏ Rơi Và Lộ Ra"
  seduce_outcome.8103.desc:0 ""Ngài làm ta kinh tởm, [owner.GetFirstNameNoTooltip]. Vì thánh thần [ROOT.Char.GetFaith.HighGodNamePossessive], ta là [owner.Custom2('RelationToMe', SCOPE.sC('target') )] của ngài! Ta sẽ mang những sự đồi bại gớm ghiếc của ngài ra ánh sáng, cứ tin lời ta đi!"\n\n[target.GetFirstName] [target.Custom('quirk_neg_present')] khi [target.GetSheHe] làm rõ sự khinh miệt của [target.GetHerHis] đối với những lời gạ gẫm tình ái của ta."
  seduce_outcome.8103.a:0 "Ngài sẽ làm điều này với chính [target.Custom2('RelationToMe', SCOPE.sC('owner') )] của mình sao?!"

  seduce_outcome.4100.desc:0 "Khi đang tản bộ, ta bắt gặp [target.GetFirstName] vẫy gọi mình ở đằng xa. Ta đuổi theo, và sau khi bắt được [target.GetHerHim], chúng ta lẩn khuất khỏi tầm mắt mọi người. Chúng ta khao khát khám phá cơ thể của nhau, và ta bị cuốn đi trong một cơn bão của những nụ hôn cuồng nhiệt và những tiếng thở dài hổn hển. Đột nhiên, [target.GetFirstNameNoTooltip] ngắt nụ hôn của chúng ta bằng cách đặt một ngón tay lên môi ta.\n\n"Vui đấy," [target.GetSheHe] cất giọng nhẹ nhàng khi [target.GetSheHe] lùi lại, "nhưng ta đã chán trò chơi này rồi, đã đến lúc " "
  seduce_outcome.4100.desc_married:0 "Ta tiếp tục trách nhiệm của mình với tư cách là [target_spouse.GetTitledFirstNamePossessive] [target_spouse.Custom2('RelationToMeShort', target)]."
  seduce_outcome.4100.desc_fallback:0 "Ta tập trung vào những mục tiêu mình đã đặt ra."
  seduce_outcome.4100.a:0 ""Đợi đã, chuyện này không phải nên như thế này!""
