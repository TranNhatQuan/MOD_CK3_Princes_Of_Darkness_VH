l_english:
  seduce_ongoing.success.rejection:0 "Thật vui, nhưng đến đây thôi."
  seduce_ongoing.failure.rejection:0 "Không, không, và mãi mãi không, [owner.GetFirstNameNoTooltip]."
  seduce_ongoing_decline_event.tt:0 "Ta từ bỏ cơ hội gây ấn tượng với [target.GetTitledFirstName]"
  seduce_ongoing_possible_outcomes_tooltip_effect.success.desc:0 "Mọi thứ diễn ra theo kế hoạch"
  seduce_ongoing_possible_outcomes_tooltip_effect.failure.desc:0 "[target.GetFirstNameNoTooltip] không ấn tượng"

  seduce_ongoing.1001.t:0 "Điệu Nhảy"
  seduce_ongoing.1001.distant_opening:0 "Ta đã đến triều đình ở [court_of_residence.GetNameNoTier] đúng lúc cho điệu nhảy tại [court_owner.Custom('ResidenceBuilding')]. Ta đã có được lời mời, vì Ta phải gặp [target.GetTitledFirstName]."
  seduce_ongoing.1001.close_opening:0 "Ta tham dự điệu nhảy không chỉ vì Ta là [ROOT.Char.GetLadyLord|U] của [court_owner.Custom('ResidenceBuilding')], mà còn vì muốn gặp [target.GetTitledFirstName] ở đó."
  seduce_ongoing.1001.desc:0 "\n\n[target.GetSheHe|U] trông lộng lẫy, và khi chúng Ta cuối cùng có một khoảnh khắc riêng tư, Ta đưa ra lời đề nghị."
  seduce_ongoing.1001.a:0 "Tham gia cùng Ta trong vòng nhảy tiếp theo chứ, [target.GetLadyLord] của Ta?"
  seduce_ongoing.1001.a.tt:0 "#F Kích thích khía cạnh tinh nghịch của [target.GetFirstNamePossessiveNoTooltip].#!"
  seduce_ongoing.1001.b:0 "Đi dạo trong vườn, tránh xa tất cả nơi này chứ?"
  seduce_ongoing.1001.b.tt:0 "#F Kích thích khía cạnh trầm tư của [target.GetFirstNamePossessiveNoTooltip].#!"
  seduce_ongoing.1001.c:0 "Ta có thể mang thêm thức ăn cho Ngài không?"
  seduce_ongoing.1001.c.tt:0 "#F Kích thích khía cạnh tham lam của [target.GetFirstNamePossessiveNoTooltip].#!"
  seduce_ongoing.1001.d:0 "Ngài có thấy mọi người nhảy thế nào không?"
  seduce_ongoing.1001.d.tt:0 "#F Kích thích khía cạnh hiểm độc của [target.GetFirstNamePossessiveNoTooltip].#!"

  seduce_ongoing.1003.opening:0 "Tại điệu nhảy [court_owner.Custom('ResidenceBuilding')], [owner.GetTitledFirstName] đến với Ta, đề nghị [owner.GetHerHis] cùng đi."
  seduce_ongoing.1003.dance:0 "\n\nKhi chúng Ta xoay trên sàn, chắc chắn đã thu hút nhiều ánh nhìn, và Ta cười như một [ROOT.Char.Custom('GirlBoy')] nhỏ!"
  seduce_ongoing.1003.walk:0 "\n\nChúng Ta đi dạo trong vườn, trò chuyện đủ thứ cho đến khi nhận ra cả hai đều quên thời gian!"
  seduce_ongoing.1003.food:0 "\n\n[owner.GetSheHe|U] sai Bạn Bè mang thêm vài món, và chúng Ta ngồi ăn cùng nhau suốt phần lớn buổi tối. Thật tuyệt vời!"
  seduce_ongoing.1003.mockery:0 "\n\nChúng Ta ngồi trêu chọc các vị khách khác, chia sẻ những tiếng cười. Ta thực sự ấn tượng với sự hóm hỉnh sắc bén của [owner.GetFirstNamePossessiveNoTooltip]!"
  seduce_ongoing.1003.fallback:0 "\n\nChúng Ta đã có quá nhiều niềm vui, gần như nhảy suốt cả buổi lễ!"
  seduce_ongoing.1003.a:0 "Thật là một buổi tối tuyệt vời!"

  seduce_ongoing.1004.dance:0 "[owner.GetSheHe|U] không hiểu rằng Ta không muốn nhảy, và sau vài vòng miễn cưỡng, Ta phải nhờ [owner.GetHerHim] buông tay."
  seduce_ongoing.1004.walk:0 "Đi dạo trong vườn thì sảng khoái, nhưng [owner.GetFirstNamePossessive] nói quá nhiều khiến Ta chán.\n\nTa sớm cáo lỗi, quay lại điệu nhảy."
  seduce_ongoing.1004.food:0 "Ta không phản đối sự hiện diện của [owner.GetHerHis], nhưng suốt buổi tối, [owner.GetSheHe] liên tục sai Bạn Bè mang thêm món ăn. Ta nhanh chóng no, và cáo lỗi để đi nhảy."
  seduce_ongoing.1004.mockery:0 "[target.GetSheHe|U] ngồi bên Ta, bình phẩm về các vị khách khác.\n\nVừa độc ác không cần thiết, vừa thô lỗ và thiếu nghệ thuật."
  seduce_ongoing.1004.fallback:0 "[owner.GetSheHe|U] không ngừng gợi ý những cách để dành thời gian tại các buổi lễ hội, nhưng [owner.GetSheHe] cũng chẳng thể làm gì hơn khi chính bản thân [owner.GetHerselfHimself] lại là một kẻ đồng hành chán ngắt đến vậy."
  seduce_ongoing.1004.a:0 "[owner.GetSheHe] đang nghĩ gì vậy?"

  seduce_ongoing.1005.dance:0 "[target.GetTitledFirstName] và ta cùng nhau xoay bước trên sàn khiêu vũ, thu hút bao ánh nhìn khi [target.GetSheHe] cười đùa thỏa thích trong niềm vui của [target.GetHerHis]."
  seduce_ongoing.1005.walk:0 "[target.GetTitledFirstName] và Ta đi dạo trong vườn, nói đủ thứ. Chúng Ta nhận ra mất thời gian, và khi quay lại, điệu nhảy gần kết thúc."
  seduce_ongoing.1005.food:0 "Ta sai Bạn Bè mang thêm thức ăn cho [target.GetTitledFirstName] và Ta, và cả buổi tối, chúng Ta thưởng thức từng món ngon mà đầu bếp [court_of_residence.GetNameNoTier] chuẩn bị. [target.GetWomanMan] này thật sự biết thưởng thức cuộc sống."
  seduce_ongoing.1005.mockery:0 "Chúng Ta ngồi cùng nhau, trêu chọc các vị khách khác. Ta không ngờ [target.GetTitledFirstName] lại tinh tế trong việc trêu đùa đến vậy!"
  seduce_ongoing.1005.fallback:0 "[target.GetTitledFirstName] và Ta quá vui, gần như nhảy suốt cả buổi lễ!"
  seduce_ongoing.1005.a:0 "Thật là một buổi tối tuyệt vời!"

  seduce_ongoing.1006.dance:0 "Ta tưởng đã thành công khi [target.GetSheHe] đồng ý nhảy, nhưng dù Ta xoay xở khéo léo, [target.GetTitledFirstName] nhanh chóng viện cớ rời đi, để Ta đứng một mình giữa những người nhảy khác."
  seduce_ongoing.1006.walk:0 "Ta những tưởng đó là một cuộc tản bộ thú vị, nhưng có lẽ trời quá lạnh, hoặc có lẽ ta đã nói quá nhiều, vì [target.GetSheHe] sớm viện cớ của [target.GetHerHis] và quay lại sàn nhảy, thậm chí chẳng thèm đợi xem ta có đi cùng hay không.\n\nKhi ta quay lại được, [target.GetSheHe] đang bận rộn vui vẻ cùng những vũ công khác."
  seduce_ongoing.1006.food:0 "Có lẽ thức ăn ta sai gia nhân mang ra cho [target.GetTitledFirstName] có vấn đề chăng? Ngay cả sau khi [target.GetSheHe] đã viện cớ của [target.GetHerHis], thức ăn vẫn tiếp tục được dọn ra từ nhà bếp, chất đống lên trong khi ta ngồi gảy gót một mình."
  seduce_ongoing.1006.mockery:0 "Dù Ta cố gắng, [target.GetTitledFirstName] không cười trước trò đùa. Cuối cùng [target.GetSheHe] cho Ta là độc ác vô ích, rồi bỏ Ta ngồi một mình."
  seduce_ongoing.1006.fallback:0 "Ta liên tục gợi ý cách tận hưởng lễ hội, nhưng [target.GetTitledFirstName] dường như không quan tâm. Ta có làm gì sai không?"
  seduce_ongoing.1006.a:0 "Buổi tối này thật thất bại."

  seduce_ongoing.successful.target:0 "\n\nDù món quà giấu tên, [owner.GetTitledFirstName] đã làm mọi cách để Ta biết rằng [owner.GetSheHe] là người gửi."
  seduce_ongoing.unsuccessful.target:0 "\n\nDù món quà gửi giấu tên, không khó để hiểu rằng [owner.GetTitledFirstName] đứng sau nó..."
  seduce_ongoing.target_successful.option:0 "[owner.GetSheHe|U] xứng đáng nhận lời cảm ơn trọn vẹn của Ta!"
  seduce_ongoing.target_unsuccessful.option:0 "Có lẽ #EMP ai đó#! sẽ thích món này..."
 
  seduce_ongoing.target.opening:0 "[target.Custom2('AppropriateGreeting', ROOT.Char)]"
  seduce_ongoing.successful.owner:0 "Cảm ơn nhiều vì [SCOPE.Custom('SeductionGiftType')] mà Ngài đã tặng. Ta gần như không nhớ lần cuối nhận được món quà tuyệt vời như thế!"
  seduce_ongoing.unsuccessful.owner:0 "Ta nhận [SCOPE.Custom('SeductionGiftType')] Ngài gửi. Ta... chưa hiểu lý do tại sao Ngài tặng, nhưng Ta ghi nhận."
  seduce_ongoing.owner_successful.option:0 "Bất cứ điều gì cho Ngài, [target.GetFirstNameNoTooltip]."
  seduce_ongoing.owner_unsuccessful.option:0 "Ta làm gì sai?"

  seduce_ongoing.1101.t:0 "Một Món Quà Đắt Giá"
  seduce_ongoing.1101.desc:0 "Một món quà chắc chắn sẽ thu hút sự chú ý của [target.GetTitledFirstNamePossessive], và ai cũng sẽ đánh giá cao món quà tinh xảo, rõ ràng là đắt giá."
  seduce_ongoing.gift_selection.tapestry:0 "Một bức thảm thêu, có hình triều đại [target.GetHerHis]."
  seduce_ongoing.gift_selection.tapestry_tt:0 "Ta cho rằng [target.GetTitledFirstName] là một [target.GetWomanMan] với lòng trung thành dành cho gia đình và gia tộc của [target.GetHerHis]"
  seduce_ongoing.gift_selection.horse:0 "Một con ngựa thuần chủng chắc chắn được đánh giá cao."
  seduce_ongoing.gift_selection.horse_tt:0 "Ta nghĩ [target.GetTitledFirstName] là người yêu thích hoạt động và bầu trời rộng mở."
  seduce_ongoing.gift_selection.tailor:0 "Một thợ may để mặc cho [target.GetHerHim] hoàn hảo!"
  seduce_ongoing.gift_selection.tailor_tt:0 "Ta nghĩ [target.GetTitledFirstName] trân trọng phong cách và gây ấn tượng."
  seduce_ongoing.gift_selection.decline:0 "Có lẽ không."

  seduce_ongoing.1102.t:0 "Món Quà Lao Động"
  seduce_ongoing.1102.desc:0 "Ai cũng đánh giá quà tặng, nhưng có lẽ Ta có thể nghĩ ra món gì thật đặc biệt để gây ấn tượng với [target.GetTitledFirstName]!"
  seduce_ongoing.gift_selection.embroidery:0 "Một bức thêu có huy hiệu gia đình [target.GetHerHis]."
  seduce_ongoing.gift_selection.embroidery_tt:0 "Ta cho rằng [target.GetTitledFirstName] quan tâm đến danh tiếng gia tộc của [target.GetHerHis]"
  seduce_ongoing.gift_selection.poem:0 "Một bài thơ đặt làm về niềm vui cuộc sống, dành cho [target.GetHerHim]."
  seduce_ongoing.gift_selection.poem_tt:0 "Ta nghĩ [target.GetTitledFirstName] thích thú vật chất, hoặc chí ít là thơ ca."
  seduce_ongoing.gift_selection.woodcarving:0 "Một tác phẩm chạm khắc lâu đài!"
  seduce_ongoing.gift_selection.woodcarving_tt:0 "Ta nghĩ [target.GetTitledFirstName] đánh giá kiến trúc."
 
  seduce_ongoing.1103.t:0 "Nhỏ Nhưng Ý Nghĩa"
  seduce_ongoing.1103.desc:0 "Không phải món quà nào cũng phải sang trọng. Những món nhỏ có thể gây ấn tượng lớn nếu chọn đúng. Ta tự hỏi [target.GetTitledFirstName] sẽ thích gì."
  seduce_ongoing.gift_selection.jewelry:0 "Một chiếc hộp bạc, luôn gần trái tim [target.GetHerHis]."
  seduce_ongoing.gift_selection.jewelry_tt:0 "Ta nghĩ [target.GetTitledFirstName] thích thu hút sự chú ý — hoặc ít nhất là thứ lấp lánh."
  seduce_ongoing.gift_selection.stuffed_animal:0 "Một con cáo nhồi bông chắc chắn sẽ lạ..."
  seduce_ongoing.gift_selection.stuffed_animal_tt:0 "Ta nghĩ [target.GetTitledFirstName] trân trọng biểu tượng quyền lực — với cuộc sống."
  seduce_ongoing.gift_selection.flower_display:0 "Một bình hoa, cho vườn tại [court_location.GetNameNoTierNoTooltip]."
  seduce_ongoing.gift_selection.flower_display_tt:0 "Ta nghĩ [target.GetTitledFirstName] thích chăm sóc mọi thứ, hoặc chí ít trân trọng cái đẹp."

  seduce_ongoing.1104.t:0 "Một Món Quà Đặc Biệt"
  seduce_ongoing.1104.desc:0 "Bất cứ ai cũng có thể mua một món quà bày tỏ tấm lòng, dù lớn hay nhỏ. Nếu ta muốn gây ấn tượng với [target.GetTitledFirstName], ta nên gửi cho [target.GetHerHim] một thứ gì đó thực sự đặc biệt"
  seduce_ongoing.gift_selection.rare_book:0 "Ta nên tìm một quyển sách cực hiếm cho [target.GetHerHim]."
  seduce_ongoing.gift_selection.rare_book_tt:0 "Ta nghĩ [target.GetTitledFirstName] thích tri thức, hoặc chí ít là đồ vật chứa nó."
  seduce_ongoing.gift_selection.handkerchief:0 "Một chiếc khăn tay có huy hiệu của Ta."
  seduce_ongoing.gift_selection.handkerchief_tt:0 "Ta nghĩ [target.GetTitledFirstName] sẽ trân trọng biểu tượng từ người có địa vị như Ta."
  seduce_ongoing.gift_selection.object:0 "[SCOPE.Custom('SeductionObjectIndefinite')|U], kỷ niệm lần gặp đầu tiên."
  seduce_ongoing.gift_selection.object_tt:0 "Ta nghĩ [target.GetTitledFirstName] đã quan tâm đến Ta, bằng cách nào đó."

  seduce_ongoing.1201.t:0 "Một Món Quà Lựa Chọn Khéo"
  seduce_ongoing.1201.desc:0 "Ta nhận được món quà, một tấm thảm tuyệt đẹp có cảnh sử của triều đại Ta, khung được dệt tinh xảo!"
  seduce_ongoing.1201.a:0 "[owner.GetSheHe|U] xứng đáng nhận lời cảm ơn trọn vẹn của Ta!"

  seduce_ongoing.1301.t:0 "Một Món Quà Kỳ Lạ"
  seduce_ongoing.1301.desc:0 "Ta nhận được một tấm thảm, nhằm thể hiện cảnh sử triều đại Ta, nhưng các hình vẽ trông lạ, không ai hiểu rõ cảnh nào diễn ra."
  seduce_ongoing.1301.a:0 "Bán nó đi. Ít ra cũng dùng làm chăn."

  seduce_ongoing.1202.opening:0 "Ta được tặng một con ngựa, thuần chủng và khỏe mạnh! Con vật tuyệt vời dường như hoàn hảo cho việc cưỡi, và"
  seduce_ongoing.1202.courtier:0 "Ta đã thấy [courtier.GetTitledFirstName] liếc nhìn nó đầy ghen tị."
  seduce_ongoing.1202.no_courtier:0 "Nó đã có vài người ngưỡng mộ tại triều đình."

  seduce_ongoing.1302.desc:0 "Ta nhận một con ngựa, khiến Ta tự hỏi người khác nghĩ gì về Ta. Họ có nghĩ Ta sẽ cưỡi con vật gầy yếu đó không?"
  seduce_ongoing.1302.a:0 "Ta sẽ làm gì với con lừa này? Bán nó đi."

  seduce_ongoing.1203.desc:0 "Một thợ may đến triều đình, chỉ để cung cấp cho Ta bất cứ trang phục nào Ta muốn. Bây giờ [ROOT.Char.GetHerHis] đã xong việc, Ta phải nói rằng [ROOT.Char.GetSheHe] cũng rất khéo!"
  seduce_ongoing.1203.a:0 "Ta cảm thấy tuyệt vời!"

  seduce_ongoing.1303.desc:0 "Một thợ may đến cung cấp cho Ta bất cứ trang phục nào Ta muốn. [ROOT.Char.GetSheHe|U] sớm sợ hãi khi Ta thắc mắc trang phục cũ sao lại tệ như vậy."
  seduce_ongoing.1303.a:0 "Ít nhất Ta có thể bán mớ rách xấu xí mà [ROOT.Char.GetSheHe] đã cố mặc cho Ta."

  seduce_ongoing.1204.desc:0 "Ta gần như không tin khi mở gói da. Cuốn sách bên trong phải cả trăm năm tuổi, nếu không hơn, được viết cẩn thận, trang trí và mạ vàng bởi bàn tay cổ xưa."
  seduce_ongoing.1204.a:0 "Cuốn sách này chứa điều gì kỳ diệu?"

  seduce_ongoing.1304.desc:0 "Ta hơi bối rối khi mở gói da và thấy cuốn sách cũ phủ bụi. Lật trang, Ta thấy vài minh họa đẹp, nhưng không đọc được chữ."
  seduce_ongoing.1304.a:0 "Ta dùng cuốn sách này làm gì? Bán đi."

  seduce_ongoing.1205.desc:0 "Ta được gửi một bức thêu lớn, tái hiện huy hiệu gia đình Ta với màu sắc sống động! Sẽ là điểm nhấn hoàn hảo trong phòng của Ta."
  seduce_ongoing.1205.a:0 "Chắc chắn sự tinh xảo sẽ gây ấn tượng."

  seduce_ongoing.1305.desc:0 "Ta nhận một bức thêu lớn, được cho là tái hiện huy hiệu gia đình Ta. Ta không chắc nghệ nhân tham khảo gì, vì Ta không nhận ra. Có lẽ người khác sẽ thích hơn..."
  seduce_ongoing.1305.a:0 "Sẽ tuyệt nếu là đúng huy hiệu..."

  seduce_ongoing.1206.desc:0 "Một nhà thơ đến đọc tác phẩm về thú vui cuộc sống, dành cho 'người [ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitledFirstName]!''"
  seduce_ongoing.1206.a:0 "Một làn gió thơ mát lành!"

  seduce_ongoing.1306.desc:0 "Một nhà thơ đọc tác phẩm dài về thú vui cuộc sống, dành cho 'người [ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitledFirstName].' Niềm vui cuộc sống không bao gồm bài thơ này."

  seduce_ongoing.1207.desc:0 "Ta được tặng một tác phẩm chạm khắc lâu đài thu nhỏ! Mỗi vị khách ghé qua đều khen ngợi chi tiết và sự tinh xảo."
  seduce_ongoing.1207.a:0 "Thật là một món lạ!"

  seduce_ongoing.1307.desc:0 "Ta nhận được một tác phẩm chạm khắc bằng gỗ... hình như là một tòa nhà gì đó? À— nó được cho là một lâu đài! Đúng ra là vậy."
  seduce_ongoing.1307.a:0 "Ta tự hỏi nó có thể giữ lửa được bao lâu."

  seduce_ongoing.1208.desc:0 "[owner.GetTitledFirstName] đã gửi Ta [SCOPE.Custom('SeductionObjectIndefinite')], một vật kỷ niệm cho lần gặp đầu tiên của chúng Ta."
  seduce_ongoing.1208.a:0 "[owner.GetSheHe] có nghĩ Ta có thể quên sao?"

  seduce_ongoing.1308.desc:0 "[owner.GetTitledFirstName] đã gửi Ta [SCOPE.Custom('SeductionObjectIndefinite')], một vật kỷ niệm cho lần gặp đầu tiên. [owner.GetSheHe|U] chắc chắn có những kỷ niệm yêu thích hơn Ta."

  seduce_ongoing.1209.desc:0 "Ta nhận được một chiếc mặt dây chuyền nhỏ, một món trang sức bạc tuyệt đẹp. Dù Ta thắc mắc bên trong có gì, điều quan trọng hơn là mọi người sẽ tò mò bàn tán về nó."
  seduce_ongoing.1209.a:0 "Có lẽ một ngày nào đó ai đó sẽ giúp Ta mở nó?"

  seduce_ongoing.1309.desc:0 "Ta nhận một chiếc mặt dây chuyền nhỏ, và lúc đầu Ta không nhận ra rằng khối nhỏ chưa đánh bóng đó thực ra là bạc. Nó cũng không mở được, nên Ta thấy ít công dụng."
  seduce_ongoing.1309.a:0 "Tại sao ai đó nghĩ Ta muốn món này?"

  seduce_ongoing.1210.desc:0 "Thật lạ, điều đó đúng, nhưng có điều gì đó hấp dẫn ở con cáo nhồi bông đặt trước mặt Ta. Có lẽ là nụ cười dữ tợn, đóng băng trên môi nó?"
  seduce_ongoing.1210.a:0 "Lạ thường, nhưng không khó chịu."

  seduce_ongoing.1310.desc:0 "\"Cách xa thứ đó ra khỏi Ta!\" Con cáo nhồi bông có nụ cười ghê tởm trên môi, lộ ra răng nanh dữ tợn."
  seduce_ongoing.1310.a:0 "Ai mà lại thích món quà kiểu này chứ?!"

  seduce_ongoing.1211.desc:0 "Bình hoa thật ngoạn mục, và từ khi nông dân trồng xong trong vườn, việc đi dạo ở đó trở nên phổ biến hơn hẳn."
  seduce_ongoing.1211.a:0 "Ta không ngờ vẻ đẹp kiểu này lại chạm tới Ta như vậy."

  seduce_ongoing.1311.desc:0 "\"Vậy ngài không muốn chúng Ta trồng chúng, [ROOT.Char.Custom('FormOfAddressForLiege')]?\" Nông dân đứng trước Ta, đất rơi từ thùng trên vai. Bình hoa họ mang trông cũ và hư hỏng."
  seduce_ongoing.1311.a:0 "Ta không muốn chúng ở gần khu vườn."

  seduce_ongoing.1212.desc:0 "[owner.GetTitledFirstName] đã gửi Ta một món quà, một chiếc khăn tay với huy hiệu của [owner.GetDynasty.GetBaseName].\n\nChắc chắn sẽ thú vị khi xem phản ứng của mọi người khi Ta phô trương biểu tượng [owner.GetTitlePossessive]."
  seduce_ongoing.1212.a:0 "Chắc chắn sẽ để lại ấn tượng nào đó."

  seduce_ongoing.1312.desc:0 "[owner.GetTitledFirstName] đã gửi Ta một món quà, một chiếc khăn tay với huy hiệu của [owner.GetDynasty.GetBaseName].\n\nNếu [owner.GetSheHe] nghĩ Ta sẽ bao giờ phô trương biểu tượng [owner.GetHerHis] nơi công cộng, [owner.GetSheHe] thật sự nhầm lẫn!"

  seduce_ongoing.1801.t:0 "[ROOT.Char.Custom('MistressMaster')|U] của Lời Nói"
  seduce_ongoing.1801.start.desc:0 "Là một học giả về nghệ thuật ngoại giao, Ta hiểu rõ sức mạnh của lời khen khéo léo. Thể hiện sự ngưỡng mộ về phẩm chất tốt nhất của một [target.GetWomanMan] chắc chắn là con đường đến trái tim [target.GetHerHis].\n\n"
  seduce_ongoing.1801.close.desc:0 "Lần tới khi chúng Ta gặp nhau, Ta sẽ khen ngợi [target.GetFirstNamePossessive]..."
  seduce_ongoing.1801.distant.desc:0 "Ta sẽ viết một bức thư gửi [target.GetFirstName], khen ngợi [target.GetHerHis]..."

  seduce_ongoing.1801.compassionate:0 "Trái tim ấm áp và dịu dàng."
  seduce_ongoing.1801.bold:0 "Tinh thần dũng cảm, không bị ràng buộc."
  seduce_ongoing.1801.honorable:0 "Bản chất cao quý và trung thành."
  seduce_ongoing.1801.greed:0 "Tham vọng và khao khát cuộc sống."
  seduce_ongoing.1801.rational:0 "Tư duy lý trí, xuất sắc."
  seduce_ongoing.1801.zealous:0 "Đức tin sắt đá và tôn nghiêm."
  seduce_ongoing.1801.energetic:0 "Tính bốc đồng và đầy sinh lực."
  seduce_ongoing.1801.forgiving:0 "Bản tính khoan dung."
  seduce_ongoing.1801.beautiful_male:0 "Ngoại hình nổi bật, ấn tượng."
  seduce_ongoing.1801.beautiful_female:0 "Vẻ đẹp không gì sánh được, ngoạn mục."
  seduce_ongoing.1801.strong:0 "Thể trạng mạnh mẽ, ấn tượng."
  seduce_ongoing.1801.extroverted:0 "Sức hút khó cưỡng."
  seduce_ongoing.1801.dominant:0 "Sự hiện diện mạnh mẽ, quyết đoán."
  seduce_ongoing.1801.compliment.tt:0 "#F Mức độ lời khen được [target.GetTitledFirstName] đón nhận dựa trên mức độ phù hợp với [target.GetHerHim]#!"
 
  seduce_ongoing.1802.t:0 "Những Lời Ngọt Ngào"
  seduce_ongoing.1802.close.desc:0 "Khi Ta lang thang trong vườn, suy tư yên tĩnh, Ta suýt va vào [owner.GetTitledFirstName]. Trước khi Ta kịp định thần, [owner.GetSheHe] xin lỗi, nói rằng [owner.GetSheHe] không hề muốn làm phiền một [target.Custom('LadyLordWomanMan')] như Ta."
  seduce_ongoing.1802.distant.desc:0 "Ta nhận được một bức thư thú vị từ [owner.GetTitledFirstName]. Xen lẫn những câu hỏi và giai thoại bình thường là những lời khen tinh tế, rõ ràng, về..."
  seduce_ongoing.1802.compassionate.desc:0 "\"lòng trắc ẩn dịu dàng.\""
  seduce_ongoing.1802.bold.desc:0 "\"dũng khí phi thường.\""
  seduce_ongoing.1802.honorable.desc:0 "\"đạo đức cao quý.\""
  seduce_ongoing.1802.greed.desc:0 "\"tham vọng bay cao.\""
  seduce_ongoing.1802.rational.desc:0 "\"tư duy sáng suốt độc nhất.\""
  seduce_ongoing.1802.zealous.desc:0 "\"đức tin đáng ngưỡng mộ.\""
  seduce_ongoing.1802.energetic.desc:0 "\"năng lượng sống mãnh liệt.\""
  seduce_ongoing.1802.forgiving.desc:0 "\"lòng khoan dung rộng lượng.\""
  seduce_ongoing.1802.beautiful_male.desc:0 "\"ngoại hình nổi bật.\""
  seduce_ongoing.1802.beautiful_female.desc:0 "\"vẻ đẹp truyền cảm hứng.\""
  seduce_ongoing.1802.strong.desc:0 "\"sức mạnh thể chất.\""
  seduce_ongoing.1802.extroverted.desc:0 "\"sức hấp dẫn khó cưỡng.\""
  seduce_ongoing.1802.dominant.desc:0 "\"năng lượng quyết đoán.\""
  seduce_ongoing.1802.good.desc:0 "\n\nLời nói của [owner.GetHerHis|U] thể hiện sự quan tâm ân cần, khiến Ta bất ngờ."
  seduce_ongoing.1802.neutral.desc:0 "\n\nLời nói của [owner.GetHerHis|U] không mấy ý nghĩa, nhưng cử chỉ ấy mang lòng tốt, Ta đoán vậy."
  seduce_ongoing.1802.bad.desc:0 "\n\nTa nghi ngờ [owner.GetSheHe] có ý tốt, nhưng nghe có vẻ như mỉa mai tinh vi."
  seduce_ongoing.1802.a.good:0 "[owner.GetTitledFirstNameNoTooltip]... Ngài làm Ta ngượng khen!"
  seduce_ongoing.1802.a.bad:0 "Hơi thiếu hiểu biết, nhưng phần lớn là ngọt ngào."
  seduce_ongoing.1802.b.good:0 "Ngài nên cố gắng hơn lần sau."
  seduce_ongoing.1802.b.bad:0 "Thật xấu hổ..."
  seduce_ongoing.1802.c:0 "Ta không hứng thú với những lời quan tâm này!"

  seduce_ongoing.1601.t:1 "Một Buổi Đọc Tại [location.GetNameNoTooltip]"
  seduce_ongoing.1601.t_no_location:0 "Một Buổi Đọc"
  seduce_ongoing.1601.desc:0 "Buổi lễ kết thúc, giải trí buổi tối dường như tạm ngừng, khi [target.GetTitledFirstName] đề nghị một buổi đọc.\n\nMột thư ký sớm xuất hiện, hỏi khách muốn nghe gì, và Ta thấy cơ hội gây ấn tượng với [target.GetFirstName]."
  seduce_ongoing.1601.a:0 "Một điều gì đó sùng đạo, như [SCOPE.Custom('RandomReligiousTextName')]."
  seduce_ongoing.1601.a.tt:0 "Ta nghĩ [target.GetSheHe] muốn nghe về tôn giáo."
  seduce_ongoing.1601.b:0 "Hãy để được giải trí. [SCOPE.Custom('RandomEntertainmentTextName')|U]!"
  seduce_ongoing.1601.b.tt:0 "Ta nghĩ [target.GetSheHe] muốn nghe điều gì đó thú vị."
  seduce_ongoing.1601.c:0 "[SCOPE.Custom('RandomInformativeTextName')|U] sẽ cho chúng ta cơ hội học hỏi."
  seduce_ongoing.1601.c.tt:0 "Ta nghĩ [target.GetSheHe] muốn nghe điều gì đó bổ ích."

  seduce_ongoing.1603.desc:0 "Có vẻ sẽ là một buổi tối nhàm chán sau khi giải trí tiệc kết thúc, nhưng [owner.GetTitledFirstName] đã cứu ngày bằng cách đề nghị đọc từ [SCOPE.Custom('BookInQuestion')]!"
  seduce_ongoing.1603.a:0 "Ta cũng yêu cuốn đó!"

  seduce_ongoing.1604.desc:0 "Khi thư ký đọc cho chúng Ta, [target.GetFirstName] dường như hoàn toàn chú tâm.\n\n[target.GetSheHe|U] sau đó tiến tới Ta. \"Lựa chọn tốt, [ROOT.Char.GetFirstName],\" [target.GetSheHe] nói và [target.Custom('quirk_pos_present')]."
  seduce_ongoing.1604.a:0 "Thật tuyệt, phải không?"

  seduce_ongoing.1605.desc_1:0 "Một bữa tiệc nhàm chán trở nên tồi tệ hơn khi [owner.GetTitledFirstName] đề nghị đọc từ [SCOPE.Custom('BookInQuestion')]."
  seduce_ongoing.1605.desc_2:0 "May thay, [other_guest.GetTitledFirstName] sớm đề nghị đọc [SCOPE.Custom('GoodBookSuggestion')] thay vào đó!"
  seduce_ongoing.1605.desc_no_other_guest:0 "May thay, một người hầu sớm đề nghị đọc [SCOPE.Custom('GoodBookSuggestion')] thay vào đó!"
  seduce_ongoing.1605.a:0 "Lựa chọn tốt hơn nhiều!"

  seduce_ongoing.1606.desc_1:0 "Khi thư ký đọc lê thê, Ta thấy sự chú ý của [target.GetFirstNamePossessive] đang giảm."
  seduce_ongoing.1606.desc_2:0 "\n\nKhi Ta đang nghĩ cách cứu vãn tình hình, [other_guest.Custom2('MyCharacterIntroduction', ROOT.Char)] bất ngờ chen vào và hỏi, \"Ta có thể đề nghị đọc [SCOPE.Custom('GoodBookSuggestion')] thay không?\" và "
  seduce_ongoing.1606.desc_3:0 "[target.GetFirstName] ngay lập tức hứng thú trở lại."
  seduce_ongoing.1606.desc_no_other_guest:0 "Một người hầu bất ngờ chen vào. \"Ta có thể đề nghị đọc [SCOPE.Custom('GoodBookSuggestion')] thay không?\""
  seduce_ongoing.1606.a:0 "Sao Ta không nghĩ ra điều đó nhỉ?"

  seduce_ongoing.1701.t:0 "Cuộc Gặp Gỡ"
  seduce_ongoing.1701.desc:0 "Ta chắc chắn sẽ đi qua [court_of_residence.GetNameNoTier] vào ngày diễn ra buổi luyện đấu kiếm. Các sĩ quan của [target.GetTitledFirstNamePossessive] đang đi lại, hướng dẫn các [target.Custom('MountedWarriorTermPlural')] trẻ, và Ta thấy [target.GetFirstName] đi lang thang giữa họ.\n\nDù có ý định gì đi nữa, sự chú ý của [target.GetHerHis] rõ ràng đang tập trung vào nhiệm vụ của [target.GetHerHis] với vai trò [target.GetLadyLord|U] của những binh sĩ này."
  seduce_ongoing.1701.a:0 "Hay chúng ta cho những người mới này xem một màn đấu kiếm giả?"
  seduce_ongoing.1701.a.tt:0 "#F Thu hút khía cạnh năng động hoặc nghịch ngợm của [target.GetFirstNamePossessiveNoTooltip].#!"
  seduce_ongoing.1701.b:0 "Đi dạo trên thành, để bàn về chiến lược."
  seduce_ongoing.1701.b.tt:0 "#F Thu hút khía cạnh suy nghĩ thận trọng của [target.GetFirstNamePossessiveNoTooltip].#!"
  seduce_ongoing.1701.c:0 "Ta muốn nghe tất cả về kế hoạch của ngài cho mùa thu thuế."
  seduce_ongoing.1701.c.tt:0 "#F Thu hút khía cạnh tiết kiệm của [target.GetFirstNamePossessiveNoTooltip].#!"
  seduce_ongoing.1701.d:0 "Một trong số những “[target.Custom('MountedWarriorTermPlural')]” này có thể bị biến thành trò hề thật..."
  seduce_ongoing.1701.d.tt:0 "#F Thu hút khía cạnh xảo trá của [target.GetFirstNamePossessiveNoTooltip].#!"

  seduce_ongoing.1703.opening:0 "Thật bất ngờ, [owner.GetTitledFirstName] đã đến buổi luyện đấu kiếm cho những [target.Custom('MountedWarriorTermPlural')] trẻ tại [court_of_residence.GetNameNoTier]."
  seduce_ongoing.1703.duel:0 "\n\n[owner.GetSheHe|U] thách Ta một trận đấu kiếm giả, và chúng Ta đã trình diễn một màn biểu diễn thật hoành tráng cho những chiến binh mới. Trận đấu nhanh chóng trở nên gay cấn, nhưng cuối ngày, chúng Ta chia sẻ một cái ôm, và cảm thấy hài lòng với nỗ lực của mình."
  seduce_ongoing.1703.strategy:0 "\n\nChúng Ta đi dọc thành, bàn luận chiến lược trong khi quan sát các chiến binh mới ở sân dưới. [owner.GetFirstName] có vài ý kiến sâu sắc, và Ta cảm ơn [owner.GetHerHim] vì đã giúp Ta xem xét lại một số giả định về binh lính mới. Những câu chuyện lạc đề trong cuộc trò chuyện cũng rất thú vị..."
  seduce_ongoing.1703.tax_season:0 "\n\nDù buổi gặp là cần thiết, Ta cảm thấy thú vị hơn khi ngồi trong nhà, bàn về kế hoạch thuế sắp tới với [owner.GetFirstName]. Quân đội chẳng có ích gì nếu không có cách nuôi dưỡng nó, như [owner.GetSheHe] đã chỉ ra."
  seduce_ongoing.1703.trap:0 "\n\nQuan sát các chiến binh mới là cần thiết nhưng không thú vị, vì vậy Ta biết ơn khi [owner.GetFirstName] gợi ý một trò vui nhỏ. Một tì nữ đổ máu lợn xuống đất phía sau máng nước, khiến một số ngựa chưa được huấn luyện hoảng sợ, và vài kỵ sĩ ngã khỏi ngựa, trong khi số còn lại vật lộn để giữ thăng bằng!"
  seduce_ongoing.1703.fallback:0 "\n\nThông thường quan sát các chiến binh mới khá nhàm chán, nhưng [owner.GetFirstName] đã khiến cả ngày trôi qua nhanh chóng."
  seduce_ongoing.1703.a:1 "Ta phải cảm ơn [owner.GetFirstNameNoTooltip] về chuyến thăm của [owner.GetHerHis]."

  seduce_ongoing.1704.duel:0 "\n\n[owner.GetSheHe|U] khăng khăng muốn đấu kiếm giả trước các chiến binh mới, nhưng Ta không muốn tự làm xấu mặt. [owner.GetFirstName] có vẻ thất vọng, nhưng Ta có việc quan trọng hơn để an ủi [owner.GetHerHim]."
  seduce_ongoing.1704.strategy:0 "\n\n[owner.GetSheHe|U] đề nghị đi dạo trên thành để bàn về chiến lược, nhưng Ta phải bác bỏ hết gợi ý này đến gợi ý khác. Có lẽ [owner.GetFirstName] nên tập trung vào những việc mà [owner.GetSheHe] biết rõ..."
  seduce_ongoing.1704.tax_season:0 "\n\nBất chấp việc ta rõ ràng đang bận rộn với các tân binh, [owner.GetSheHe] vẫn nằng nặc đòi thảo luận về kế hoạch của ta cho mùa thuế tới. Cuối cùng, ta đành phải để mặc [owner.GetHerHim] với [owner.GetHerselfHimself] để có thể giải quyết những vấn đề thực sự quan trọng."
  seduce_ongoing.1704.trap:0 "\n\nThật kinh ngạc, [owner.GetSheHe] đề nghị tạo một kế hoạch rối loạn tinh vi cho các [target.Custom('MountedWarriorTermPlural')] mới. [owner.GetSheHe] không nhận ra rằng đó là điều cuối cùng Ta muốn sao?"
  seduce_ongoing.1704.fallback:0 "\n\n[owner.GetFirstName] muốn dành thời gian viếng thăm của [owner.GetHerHis] để trò chuyện, làm như [owner.GetSheHe] không nhận ra rằng hôm nay là một ngày vô cùng bận rộn đối với ta."
  seduce_ongoing.1704.a:0 "Chuyện gì đang xảy ra với [owner.GetTitledFirstNameNoTooltip] vậy?"

  seduce_ongoing.1705.duel:0 "Trận thương đấu giả hóa ra lại là một thành công lớn với các [target.Custom('MountedWarriorTermPlural')] tập sự!\n\n[target.GetTitledFirstName] có vẻ cũng rất thích thú cho [target.GetHerselfHimself], và sau "trận chiến" căng thẳng, chúng ta đã trao nhau một cái ôm khích lệ, cảm thấy tốt hơn vì những nỗ lực của mình."
  seduce_ongoing.1705.strategy:0 "Đi dọc thành, [target.GetTitledFirstName] và Ta chia sẻ nhiều ý tưởng về cách sử dụng các chiến binh mới, như những người ở sân dưới.\n\nCuối ngày, Ta thấy rõ [target.GetSheHe] hài lòng với các cuộc bàn luận, dù có nhiều câu chuyện lạc đề — hoặc có lẽ chính vì chúng."
  seduce_ongoing.1705.tax_season:0 "[target.GetFirstName] và Ta dành phần lớn ngày để bàn về kế hoạch thuế sắp tới. Rốt cuộc, quân đội có ích gì nếu không thể nuôi được nó? [target.GetSheHe|U] cười lớn khi nghe vậy.\n\nChúng Ta còn cười nhiều hơn khi chìm vào các cuộc bàn luận."
  seduce_ongoing.1705.trap:0 "Sau một lúc, Ta gợi ý một trò vui nhỏ để giải trí khỏi việc quan sát các chiến binh mới. Một tì nữ đổ máu lợn gần máng nước, mùi hương khiến một số ngựa chưa được huấn luyện hoảng sợ. Vài [target.Custom('MountedWarriorTermPlural')] trẻ bị ngã, số khác khó giữ thăng bằng.\n\n[target.GetFirstName] cười to trước cảnh tượng Ta tạo ra."
  seduce_ongoing.1705.fallback:0 "Cuối chuyến thăm, [target.GetTitledFirstName] có vẻ hài lòng. 'Quan sát các chiến binh mới thường nhàm chán, nhưng hôm nay trôi qua trong chớp mắt!'"
  seduce_ongoing.1705.a:0 "[target.GetSheHe|U] chắc chắn sẽ nhớ ngày này."

  seduce_ongoing.1706.duel:0 "[target.GetTitledFirstName] chỉ cười xòa trước gợi ý của ta về một trận thương đấu giả. "Chẳng cần ai phải tự bôi nhọ bản thân như vậy trước mặt những [target.Custom('MountedWarriorTermPlural')] trẻ tuổi này đâu!"\n\nTa đã dành phần còn lại của ngày để cố gắng suy đoán xem [target.GetSheHe] đang ám chỉ [target.GetHerHim] hay ta."
  seduce_ongoing.1706.strategy:0 "[target.GetTitledFirstName] và Ta đi dọc thành, trong khi Ta cố gắng đưa ra lời khuyên chiến lược. [target.GetSheHe|U] dường như không muốn nghe. Mọi ý tưởng của Ta đều bị [target.GetFirstName] chỉ ra yếu điểm, và rõ ràng [target.GetHerHis] chú ý nhiều hơn đến sân dưới."
  seduce_ongoing.1706.tax_season:0 "Ta đã cố gắng thảo luận về mùa thuế sắp tới, và làm thế nào để đảm bảo [target.GetFirstName] có đủ phương tiện để nuôi dưỡng quân đội của [target.GetHerHis]. Đáng tiếc thay, tâm trí của [target.GetFirstNamePossessive] lại ở nơi khác, và [target.GetSheHe] nhanh chóng bỏ ta lại phía sau để tập trung vào các chiến binh tập sự."
  seduce_ongoing.1706.trap:0 "Khi ta đề nghị chúng ta chơi khăm những [target.Custom('MountedWarriorTermPlural')] đang luyện tập, [target.GetFirstName] chỉ sững sờ nhìn ta.\n\n"Máu lợn và ngựa điên á? Ngài #EMP điên#! rồi sao, [ROOT.Char.GetWomanMan]?""
  seduce_ongoing.1706.fallback:0 "Ta đã cố gắng trò chuyện với [target.GetTitledFirstName] suốt cả ngày, nhưng luôn có thứ gì đó tại buổi gặp mặt đòi hỏi sự chú ý của [target.GetHerHis]. Cuối cùng, ta chẳng bao giờ thu hút được sự chú ý của [target.GetHerHis] quá một khoảnh khắc mỗi lần, và ta cảm thấy mình giống như một kẻ cản đường hơn bất cứ điều gì khác."
  seduce_ongoing.1706.a:0 "Hy vọng [target.GetFirstNameNoTooltip] quên nhanh ngày hôm nay."

  seduce_ongoing.2001.t:0 "Thuốc Tình Yêu"
  seduce_ongoing.2001.desc:0 "Một người hầu của Ta lấy được một lọ thuốc tình yêu từ một [dummy_gender.GetWomanMan] già ở chợ hội, nhưng nói rằng [dummy_gender.GetHerHim] không gặp may.\n\nCầm lọ nhỏ trên tay, Ta không thể không nghĩ đến [target.GetTitledFirstName] và tự hỏi liệu may mắn của mình có khác đi không."
  seduce_ongoing.2001.a:0 "[target.GetSheHe|U] chắc chắn sẽ thấy vui!"
  seduce_ongoing.2001.b:0 "[target.GetFirstNameNoTooltip] sẽ thích trêu chọc những mê tín như thế này."
  seduce_ongoing.2001.c:0 "Ta không có thời gian cho mấy thứ thuốc tình yêu vớ vẩn."
  seduce_ongoing.2001.c.tt:0 "#F Ta cần cơ hội tốt hơn để bày tỏ tình cảm!#!"


  seduce_ongoing.2002.desc:0 "[owner.GetTitledFirstName] đã đưa cho Ta một lọ “thuốc tình yêu” mà [owner.GetSheHe] lấy được từ chợ hội. Chúng Ta rót một ít vào rượu và có một buổi tối vui vẻ, giả vờ rằng nó có tác dụng với chúng Ta, và đến cuối buổi, ranh giới giữa giả vờ và thực tế bắt đầu trở nên mờ nhạt."
  seduce_ongoing.2002.a:0 "Thật là một trò giải trí thú vị!"

  seduce_ongoing.2003.desc:0 "[target.GetFirstName] và Ta dùng “thuốc tình yêu” cùng chút rượu và dành cả buổi tối giả vờ rằng nó có tác dụng với chúng Ta.\n\nTất cả chỉ là trò vui ngây thơ, nhưng dấu hiệu tình cảm hiện rõ trong nụ cười của [target.GetHerHis] khi [target.GetSheHe] tạm biệt Ta."
  seduce_ongoing.2003.a:0 "Thời gian bên nhau thật đáng giá."

  seduce_ongoing.2004.desc:0 "Để tìm chút thú vui, [owner.GetTitledFirstName] thách ta uống một "tình dược" mà [owner.GetSheHe] lấy được từ một hội chợ. Khi ta từ chối uống thứ mà mình không biết rõ thành phần, [owner.GetSheHe] dường như có chút khó chịu! Ta liền sớm yêu cầu [owner.GetHerHim] thứ lỗi cho [owner.GetHerselfHimself] để ta có thể về nghỉ ngơi sớm."
  seduce_ongoing.2004.a:0 "Chuyện gì đang xảy ra với [owner.GetHerHim] vậy?"

  seduce_ongoing.2005.desc:0 "[target.GetFirstName] từ chối “thuốc tình yêu” và tự hỏi Ta định làm gì. Ta hơi quá tay khi cố giải thích rằng tất cả chỉ là trò vui, và sau đó [target.GetSheHe] yêu cầu Ta ra đi."
  seduce_ongoing.2005.a:0 "Thật không may."

  seduce_ongoing.2006.t:0 "Thuốc “Tình Yêu”"
  seduce_ongoing.2006.desc:0 "[owner.GetTitledFirstName] mang cho Ta một lọ thuốc tình yêu mà [owner.GetSheHe] lấy được từ chợ hội. Ta thấy thú vị, và chiều theo [owner.GetHerHis] muốn thử một chút.\n\nTuy nhiên, [owner.GetFirstName] từ chối uống khi Ta bỗng nhiên bị đau bụng dữ dội!"
  seduce_ongoing.2006.a:0 "Ta không cảm thấy khỏe..."
  seduce_ongoing.2006.a.tt:0 "#F Thật là ngớ ngẩn #EMP *bluuurgh#! [owner.GetFirstNameNoTooltip]!#!"

  seduce_ongoing.2007.desc:0 "Ôi không! [target.GetTitledFirstName] đồng ý thử thuốc tình yêu, nhưng trò vui nhỏ lại kết thúc bằng việc [target.GetHerHim] nôn mửa và nằm liệt giường!"
  seduce_ongoing.2007.a:0 "Người hầu đã đưa cái này cho Ta đâu rồi?"
 
  seduce_ongoing.2008.desc:0 "[owner.GetTitledFirstName] đến với Ta mang theo một lọ “thuốc tình yêu” mà người hầu của [owner.GetHerHis] lấy được ở chợ hội. Chúng Ta không uống chất lỏng không rõ nguồn gốc, thay vào đó có một buổi tối vui vẻ với chút rượu, trêu chọc những mê tín đơn giản ngoài đời.\n\nNếu không thể nói cho Ta biết nó tác động vào tâm tính nào, thì không thể nói là nó có hiệu quả! À, dân thường sẽ tin bất cứ điều gì..."
  seduce_ongoing.2008.a:0 "Ta đã có một buổi tối thật vui với [owner.GetFirstNameNoTooltip]!"

  seduce_ongoing.2009.desc:0 "Ta mang “thuốc tình yêu” đến cho [target.GetTitledFirstName], và [target.GetSheHe] cũng kinh ngạc về sự cả tin của người hầu Ta như Ta vậy!\n\nChúng Ta dành buổi tối bàn về mê tín và những niềm tin lố bịch. Dân thường sẽ tin bất cứ điều gì."
  seduce_ongoing.2009.a:0 "Đó là một buổi tối thật dễ chịu."

  seduce_ongoing.2010.desc:0 "[owner.GetTitledFirstName] đến với Ta mang theo một lọ “thuốc tình yêu” mà người hầu của [owner.GetHersHis] lấy được. Ta không thấy thú vị, nhưng [owner.GetFirstName] cứ nói liên tục về điều đó, và về sự mê tín và cả tin của dân thường."
  seduce_ongoing.2010.a:0 "Nếu không tin thì đừng làm phiền Ta với chuyện đó!"

  seduce_ongoing.2011.desc:0 "[target.GetFirstName] có vẻ không ấn tượng với “thuốc tình yêu”, và Ta không còn may mắn khi cố bàn về mê tín nông dân nữa. Thật ra [target.GetSheHe] có vẻ khó chịu với tất cả!"
  seduce_ongoing.2011.a:0 "[target.GetSheHe|U] chắc hôm nay đặc biệt điềm tĩnh."

  seduce_ongoing.3001.t:0 "Trái Tim và Tâm Trí"
  seduce_ongoing.3001.desc:0 "Ta được biết rằng [target.GetTitledFirstName] rất thân với [target.GetHerHis] [target.Custom2('RelationToMe', SCOPE.sC('close_character'))], [close_character.GetTitledFirstName]. Lấy được thiện cảm của [close_character.GetHerHis] có thể giúp Ta thu hút sự chú ý của [target.GetFirstNamePossessive]."
  seduce_ongoing.3001.a:0 "Ta sẽ mua cho [close_character.GetFirstNameNoTooltip] bất cứ thứ gì [close_character.GetSheHe] yêu cầu."
  seduce_ongoing.3001.b:0 "Một cử chỉ thiện chí chắc sẽ đủ."
  seduce_ongoing.3001.c:0 "Ta có thể giúp trả nợ cho [close_character.GetHerHis]."
  seduce_ongoing.3001.d:0 "Chắc chắn ai cũng sẽ cảm thấy may mắn khi nhận vàng."
  seduce_ongoing.3001.e:0 "Điều này không đúng."
  seduce_ongoing.3001.e.tt:0 "#F Ta sẽ tìm cách khác để giành được tình cảm của [target.GetFirstNamePossessiveNoTooltip].#!"

  seduce_ongoing.3002.desc:1 "Người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('close_character'))] của Ta, [close_character.GetTitledFirstName], gần đây nói với Ta rằng [close_character.GetSheHe] rất ấn tượng với sự hào phóng của [owner.GetTitledFirstName].\n\nRõ ràng [owner.GetSheHe] đã giúp [close_character.GetHerHim] khi [close_character.GetSheHe] cần nhất."
  seduce_ongoing.3002.a:0 "Có lẽ Ta đã đánh giá thấp [owner.GetHerHim]?"
  seduce_ongoing.3002.b:1 "[owner.GetFirstNameNoTooltip] giúp [close_character.GetFirstNameNoTooltip]? Ấn tượng đấy chứ."

  seduce_ongoing.3003.desc:0 "Lần gặp tiếp theo, [target.GetFirstName] mỉm cười rộng hơn bình thường với Ta.\n\n'[Người [target.Custom2('RelationToMe', SCOPE.sC('close_character'))] của Ta] [close_character.GetFirstName] kể về cách Ngài giúp [close_character.GetHerHim], và Ta muốn gửi lời cảm ơn.'"
  seduce_ongoing.3003.a:0 "Bất cứ điều gì cho một [target.Custom2('RelationToMe', SCOPE.sC('close_character'))] của [target.GetFirstNamePossessiveNoTooltip]."

  seduce_ongoing.3004.desc:0 "Có vẻ như [target.GetFirstName] chưa nhận ra sự hào phóng của Ta đối với [target.GetHerHis] [target.Custom2('RelationToMe', SCOPE.sC('close_character'))]. Ít nhất thì [close_character.GetFirstName] cũng biết ơn!"
  seduce_ongoing.3004.a:0 "Cần làm gì đây?"

  seduce_ongoing.4001.t:0 "Sự Cống Hiến của [target.Custom('MusicalPerformerPossessive')|U]"
  seduce_ongoing.4001.desc:0 "Một [target.Custom('MusicalPerformer')] sắp biểu diễn tại [court_location.GetNameNoTier]. Sẽ là một yêu cầu đơn giản nếu Ta nhờ [dummy_musician_gender.GetHerHim] thay đổi màn biểu diễn thành lời cống hiến cho [target.GetTitledFirstName], người Ta thương."
  seduce_ongoing.4001.desc.court_musician:0 "Một [target.Custom('MusicalPerformer')] sắp biểu diễn tại [court_location.GetNameNoTier]. Ta có thể nhờ [dummy_musician_gender.GetHerHim] thay đổi màn biểu diễn thành cống hiến cho [target.GetTitledFirstName], người Ta thương.\n\nHoặc nếu Ta nhờ [GetCourtPositionType('court_physician_court_position').GetName()] [court_musician.GetName] tham gia, Ta có thể yêu cầu họ chơi những bản nhạc làm Ta nổi bật trước khán giả."
  seduce_ongoing.4001.a:0 "Sẽ là một tuyên bố táo bạo với [target.GetLadyLord]!"
  seduce_ongoing.4001.b:0 "Ta thích những ám chỉ kín đáo về khao khát với [target.GetHerHim]."
  seduce_ongoing.4001.b.failure:0 "Sự cống hiến không được chú ý"
  seduce_ongoing.4001.c:1 "Mọi người tại [court_location.GetNameNoTierNoTooltip] sẽ ngưỡng mộ Ta!"
  seduce_ongoing.4001.d:0 "Ta không nên dính líu vào những việc như thế này."

  seduce_ongoing.4002.desc.opening:0 "Ở triều đình thường có các nghệ sĩ biểu diễn, nhưng lần này chúng Ta được hứa hẹn điều gì đó đặc biệt, và quả thật Ta đã nhận được."
  seduce_ongoing.4002.desc:1 "\n\nKhi [ROOT.Char.Custom('MusicalPerformer')] bắt đầu một đoạn mới, Ta cố không tỏ ra quá ngạc nhiên trước sự cống hiến này, hướng về Ta trước toàn triều đình."
  seduce_ongoing.4002.desc.court_musician:0 "\n\nKhi [ROOT.Char.Custom('MusicalPerformer')] cùng với [owner.GetTitledFirstNamePossessive] [GetCourtPositionType('court_physician_court_position').GetName()] [court_musician.GetName] bắt đầu đoạn mới, Ta cố không tỏ ra quá hâm mộ khi nghe về chiến công của [owner.GetFirstNameNoTooltip]."
  seduce_ongoing.4002.a:0 "[owner.GetTitledFirstNameNoTooltip] quả thực đã tự làm khó chính [owner.GetHerselfHimself]."

  seduce_ongoing.4003.desc:1 "\n\nKhi [ROOT.Char.Custom('MusicalPerformer')] bắt đầu đoạn mới, Ta bước ra khỏi đại sảnh trong sự ngượng ngùng. Mỗi bài hát đều là cống hiến cho Ta từ [owner.GetTitledFirstName]!"
  seduce_ongoing.4003.desc.court_musician:0 "\n\nKhi [ROOT.Char.Custom('MusicalPerformer')] cùng với [GetCourtPositionType('court_physician_court_position').GetName()] của [owner.GetTitledFirstNamePossessive] là [court_musician.GetName] bắt đầu một khổ thơ khác, ta lúng túng bước ra khỏi sảnh đường. Liệu có phải [owner.GetFirstNameNoTooltip] đã phái [GetCourtPositionType('court_physician_court_position').GetName()] của [owner.GetHerHis] đến chỉ để tâng bốc về [owner.GetHerselfHimself] không!?"
  seduce_ongoing.4003.a:0 "Thật láo xược!"

  seduce_ongoing.4004.desc:1 "Cảm ơn vì món quà âm nhạc của Ngài. Màn trình diễn của [target.Custom('MusicalPerformerPossessive')] thật sự rất được trân trọng! Ta luôn biết Ngài là một [ROOT.Char.GetWomanMan] có gu thẩm mỹ tuyệt vời."
  seduce_ongoing.4004.a:0 "Hoàn hảo!"

  seduce_ongoing.4005.opening:0 "[target.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
  seduce_ongoing.4005.desc.court_musician:0 "Ta viết để cho Ngài biết Ngài đã làm trò cười thế nào khi buộc khán giả phải nghe những gì Ngài gọi là chiến công của mình. Ngài thật sự tin rằng kể về bản thân là cách hay để giải trí triều đình sao?"
  seduce_ongoing.4005.desc:0 "Sao ngài dám làm ta mất mặt trước đám đông như vậy?! Ngài #EMP muốn#! ta phải giải thích ý nghĩa của những từ ngữ của [target.Custom('MusicalPerformerPossessive')] cho"
  seduce_ongoing.4005.spouse:0 "người [target.Custom2('RelationToMe', SCOPE.sC('spouse'))] của Ta?"
  seduce_ongoing.4005.court:0 "toàn bộ triều đình?"
  seduce_ongoing.4005.a:0 "Đó không phải điều Ta muốn!"

  seduce_ongoing.4006.desc:0 "Khi [ROOT.Char.Custom('MusicalPerformer')] tiếp tục phát biểu những câu nói về tình yêu và khao khát, Ta cố gắng không để cả triều đình thấy Ta cảm thấy hãnh diện thế nào.\n\nDù [owner.GetSheHe] ẩn sau ẩn dụ và ngụ ngôn, Ta biết đây là một lời cống hiến từ [owner.GetTitledFirstName] gửi đến Ta."
  seduce_ongoing.4006.a:0 "Ngài biết cách thu hút sự chú ý của Ta, [owner.GetFirstNameNoTooltip]."

  seduce_ongoing.4007.desc:0 "Có lẽ sự cống hiến của Ta cho [target.GetLadyLord] [target.GetFirstName] hơi quá tế nhị… [target.GetSheHe|U] có vẻ không nhận ra gì cả."
  seduce_ongoing.4007.a:0 "Thật lãng phí công sức."

  seduce_ongoing.4011.t:0 "Một Dạo Chơi ở [court_location.GetNameNoTierNoTooltip]"
  seduce_ongoing.4011.desc:0 "Có vẻ táo bạo, nhưng Ta đã nghĩ đến việc mời [target.GetTitledFirstName] đi dạo cùng Ta qua [court_location.Custom('BaronyTownType')] của [court_location.GetNameNoTier]."
  seduce_ongoing.4011.a:0 "Đi dạo qua phố chợ, để mọi người nhìn thấy!"
  seduce_ongoing.4011.b:0 "Chúng ta đi vào các hẻm nhỏ thôi. Ai cần sự chú ý của người khác?"
  seduce_ongoing.4011.b.failure:0 "Ta không gây ấn tượng được với [target.GetFirstNameNoTooltip]"
  seduce_ongoing.4011.c:0 "Có lẽ chúng ta không nên làm thế."
  seduce_ongoing.4011.c.tt:0 "#F Ta có thể chờ cơ hội khác#!"

  seduce_ongoing.4012.opening:0 "Ta hơi ngạc nhiên khi [owner.GetTitledFirstName] mời Ta đi dạo qua [court_location.Custom('BaronyTownType')] của [court_location.GetNameNoTier]."
  seduce_ongoing.4012.end:0 "\n\nTuy nhiên, ngày hôm đó thật dễ chịu khi chúng Ta đi qua phố chợ, trò chuyện về đủ thứ trong khi những thương nhân rao bán hàng cho dân thường há hốc mồm trước đoàn người áo giáp lấp lánh của chúng Ta."
  seduce_ongoing.4012.a:0 "Chúng Ta chắc chắn đã để lại ấn tượng."

  seduce_ongoing.4013.end:0 "\n\nTa càng trở nên bối rối khi [owner.GetSheHe] nhất quyết đi qua phố chợ, và giữa đoàn tùy tùng lộng lẫy cùng sự im lặng trong cuộc trò chuyện, rõ ràng [owner.GetSheHe] chỉ muốn khoe khoang. Ta đã định cưỡi đi nếu không gây ra cảnh tượng."
  seduce_ongoing.4013.a:0 "Chúng ta đừng làm thế nữa."

  seduce_ongoing.4014.desc:0 "Kính gửi [owner.GetTitledFirstName],\n\nThật là một niềm vui khi có Ngài đi cùng ở [court_location.GetNameNoTier] [court_location.Custom('BaronyTownType')], và Ta hy vọng sẽ còn gặp Ngài nhiều lần nữa."
  seduce_ongoing.4014.a:0 "Niềm vui là của Ta."

  seduce_ongoing.4015.desc:0 "Gửi [target.GetTitledFirstName],\n\nNgài định làm Ta xấu hổ trước công chúng sao? Diễu Ta như một chiến lợi phẩm lố bịch… Ngài có biết họ đang nói gì ở triều đình không?"
  seduce_ongoing.4015.a:0 "Ta không có ý như vậy!"

  seduce_ongoing.4016.end:0 "\n\nChúng Ta đi qua nhiều con hẻm, cười trước vẻ ngạc nhiên của dân thường khi đoàn tùy tùng đi qua. Cuối ngày, Ta biết [court_location.Custom('BaronyTownType')] hơn cả những gì Ta tưởng."
  seduce_ongoing.4016.a:0 "[target.GetFirstNameNoTooltip] khiến Ta thấy nhiều góc nhìn mới."

  seduce_ongoing.4017.desc:0 "Kính gửi [ROOT.Char.GetTitledFirstName],\n\nCảm ơn vì đi cùng Ta khi Ta đến thăm [court_location.GetNameNoTier] [court_location.Custom('BaronyTownType')], dù Ngài nhất quyết đi vào hẻm nhỏ và tránh tầm mắt, điều đó làm Ta khá bối rối. Có lẽ Ngài có thể giải thích vào lúc khác."
  seduce_ongoing.4017.a:0 "Thật… chỉ có hai chúng ta, chúng ta—"

  seduce_ongoing.4018.desc:0 "Kính gửi [owner.GetTitledFirstName],\n\nTa đã có thật nhiều niềm vui trong chuyến thăm [court_location.GetNameNoTier]. Ta bây giờ biết những phần của [court_location.Custom('BaronyTownType')] mà Ta chưa từng nghĩ sẽ thấy!"
  seduce_ongoing.4018.a:0 "Niềm vui là của Ta."

  seduce_ongoing.4101.t:0 "Ban Công Của Người Yêu"
  seduce_ongoing.4101.desc_opening:0 "Những cửa sổ của [target.GetTitledFirstNamePossessive] được chiếu sáng rực rỡ, và ngay từ dưới đất Ta đã nhìn thấy có sự chuyển động bên trong.\n\n"
  seduce_ongoing.4101.desc_same_court:0 "Tim Ta đập thình thịch trong lồng ngực; có thể Ta đang ở trong [ROOT.Char.Custom('ResidenceBuilding')] của mình, nhưng khi theo đuổi khao khát với [target.GetHerHis] Ta vẫn đang bước trên vùng đất mới."
  seduce_ongoing.4101.desc_other_court:0 "Tim Ta đập thình thịch trong lồng ngực; vừa theo đuổi cơ hội giường chiếu với [target.GetHerHim], vừa ghé thăm [court_location.GetNameNoTier], Ta rơi vào tình thế khó khăn."
  seduce_ongoing.4101.a:0 "[target.GetFirstNameNoTooltip]! Hãy nhìn ra ngoài và thắp sáng đêm của Ta!"
  seduce_ongoing.4101.a.tt:0 "#F Ta cố gắng thu hút sự chú ý của [target.GetHerHis] một cách kín đáo#!"
  seduce_ongoing.4101.b:0 "Ta sẽ leo lên."
  seduce_ongoing.4101.b.tt:0 "#F Chắc chắn [target.GetSheHe] sẽ vui khi thấy Ta!#!"
  seduce_ongoing.4101.c:0 "Ta sẽ để lại [SCOPE.Custom('SeductionObjectIndefinite')] cho [target.GetHerHim] cùng một mẩu giấy."
  seduce_ongoing.4101.c.tt:0 "#F [target.GetSheHe|U] chắc chắn sẽ trân trọng cử chỉ tinh tế này, và biết [target.GetSheHe] có ý nghĩa thế nào với Ta#!"
  seduce_ongoing.4101.d:0 "Ta nên rời đi trước khi ai đó thấy."
  seduce_ongoing.4101.d.tt:0 "#F Ta sẽ không tiếp cận [target.GetHerHim] như kẻ trộm ban đêm!#!"

  seduce_ongoing.4102.t:0 "Dưới Ban Công Ta"
  seduce_ongoing.4102.desc:0 "Sau khi rút về phòng tối cho buổi tối, Ta ngạc nhiên khi nghe giọng nói nhỏ vẳng vào từ bên ngoài, nghe giống hệt [owner.GetTitledFirstName].\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip], Ta cầu xin Ngài, cho Ta được nhìn thấy dung nhan xinh đẹp của Ngài!\""
  seduce_ongoing.4102.a:0 "Như chuyện trong truyện, lãng mạn quá!"
  seduce_ongoing.4102.b:0 "Để Ta phải chịu nhìn dáng vẻ xấu xí của Ngài sao? Không."

  seduce_ongoing.4103.desc:0 "Khi ánh sáng từ cửa mở của [target.GetTitledFirstNamePossessive] lan ra ban công, cũng lan tỏa trong tim Ta.\n\nBóng tối bao quanh mang đến cảm giác tự do lạ lùng cho cuộc trò chuyện của chúng Ta, và — dù Ta đứng dưới đất — chúng Ta chưa bao giờ thân mật đến vậy."
  seduce_ongoing.4103.a:0 "Ôi [target.GetFirstNameNoTooltip], Ngài là mặt trời trong đêm tối của Ta!"

  seduce_ongoing.4104.desc:0 "Khi ánh sáng từ cửa mở của [target.GetTitledFirstNamePossessive] lan ra ban công, cũng lan tỏa trong tim Ta.\n\nNhưng ánh sáng nhanh chóng tắt khi Ta thấy [target.Custom('quirk_neg_adjective')] trên khuôn mặt [target.GetHerHis], và biến mất hoàn toàn khi [target.GetSheHe] nói: \"Ngài đang làm gì ở đây, [ROOT.Char.GetTitledFirstNameNoTooltip]?! Xin hãy để Ta yên.\""
  seduce_ongoing.4104.a:0 "Nhưng… Ngài là mặt trời trong đêm tối của Ta…!"

  seduce_ongoing.4105.desc:1 "#EMP Hừm!#!\n\nSau khi rút về phòng tối, Ta đột nhiên đứng đối diện với một [owner.GetWomanMan] ngoài cửa sổ… Một [owner.GetWomanMan] trông giống hệt [owner.GetTitledFirstName]."
  seduce_ongoing.4105.a:0 "Ôi Ngài ngốc nghếch [owner.GetWomanMan], vào trong đi!"
  seduce_ongoing.4105.b:0 "May mà rèm cửa Ta dày."
  seduce_ongoing.4105.c:0 "Vệ binh! Giúp Ta, vệ binh!"

  seduce_ongoing.4106.desc:0 "Ngay khi Ta tới ban công của [target.GetTitledFirstNamePossessive], [target.GetSheHe] bước ra cười. \"Tại sao Ngài lại làm trò này, [ROOT.Char.GetFirstNameNoTooltip]? Chỉ cần dùng cửa như một [ROOT.Char.GetWomanMan] bình thường. Ngài hành xử như thể có dự định gì muốn giấu.\" \n\nNiềm vui tinh nghịch trong mắt [target.GetHerHis] làm mọi việc trở nên xứng đáng."
  seduce_ongoing.4106.a:0 "Không gì có thể ngăn Ta đến bên Ngài!"

  seduce_ongoing.4107.desc_paranoid:0 "Ngay khi ta vừa leo lên ban công của [target.GetTitledFirstNamePossessive], [target.GetSheHe] đã bắt đầu la hét gọi lính gác của [target.GetHerHis]. "Cứu với, có kẻ đột nhập!"\n\nGiọng nói của [target.GetHerHis|U] đuổi theo ta xuống dưới khi ta cuống cuồng tìm đường tẩu thoát, lộn nhào đoạn đường cuối cùng xuống đất trước khi biến mất vào màn đêm."
  seduce_ongoing.4107.desc:0 "Ngay khi ta vừa leo lên ban công của [target.GetTitledFirstNamePossessive], [target.GetSheHe] bước ra ngoài với một nét mặt [target.Custom('quirk_neg_adjective')] trên khuôn mặt của [target.GetHerHis].\n\n"Trò hề nông cạn gì thế này hả [ROOT.Char.GetFirstNameNoTooltip]? Ngài không thể — ngài là một [ROOT.Char.GetTitleTierName] cơ mà! Việc này thật không đúng mực chút nào.""
  seduce_ongoing.4107.a:0 "Điều này có thể đã tốt hơn…"
  seduce_ongoing.4107.a.tt:0 "#F Lẽ ra Ta không nên lén đến gần một [target.GetWomanMan] hay nghi ngờ như vậy!#!"

  seduce_ongoing.4108.desc:0 "Sau khi rút về phòng tối, Ta giật mình khi nghe tiếng sỏi gõ cửa sổ. Nhìn vào khu vườn tối, Ta thấy [SCOPE.Custom('SeductionObjectIndefinite')] nằm trên đất kèm một mảnh giấy, và một [owner.GetWomanMan] trông giống [owner.GetTitledFirstName] biến mất vào đêm.\n\n#EMP Gửi đến [ROOT.Char.Custom2('ComplimentAdjective', ROOT.Char)] [ROOT.Char.GetTitledFirstNameNoTooltip], như một dấu hiệu của tình cảm Ta.#!"
  seduce_ongoing.4108.a:0 "Ta sẽ để lại [SCOPE.Custom('SeductionObjectIndefinite')] để [owner.GetHerHim] tìm lại!"
  seduce_ongoing.4108.b:0 "Ta phải làm gì với cái này đây? Bán đi thôi!"

  seduce_ongoing.4109.desc:1 "Hai [SCOPE.Custom('SeductionObjectMultiple')], đang chờ Ta trong phòng. Không có mảnh giấy hay lời chào, nhưng Ta thề vẫn còn ngửi thấy mùi hương ngọt ngào của [ROOT.Char.Custom2('ComplimentAdjective', SCOPE.sC('target'))] [target.GetTitledFirstName] trong không khí!"
  seduce_ongoing.4109.a:0 "Ôi, [target.GetFirstNameNoTooltip]!"

  seduce_ongoing.4110.desc:0 "Những ngày trôi qua mà không thấy phản hồi từ [target.GetTitledFirstName], Ta quyết định thử vận may thêm lần nữa — có thể [target.GetSheHe] chưa từng thấy món quà ngay từ đầu?\n\nÔi, hy vọng của Ta tan vỡ nhanh đến mức Ta tìm thấy [SCOPE.Custom('SeductionObject')] dưới cửa sổ [target.GetHerHis], dấu gót giày vẫn còn in trên bùn mà [target.GetSheHe] đã giẫm lên."
  seduce_ongoing.4110.a:0 "Trái tim Ta tan vỡ như [SCOPE.Custom('SeductionObject')]!"

  seduce_ongoing.5001.t_rival:0 "Kẻ Địch [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))|U] Của Ta"
  seduce_ongoing.5001.t:0 "[ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))|U] [target.GetWomanMan|U]"
  seduce_ongoing.5001.desc_tier_up:0 "\"Ta được vinh hạnh gì, #EMP [ROOT.Char.GetTitleTierName]#!?\" [target.GetTitledFirstName] hỏi với nụ cười không chạm tới mắt [target.GetHerHis]."
  seduce_ongoing.5001.desc_tier_down:0 ""Liệu [ROOT.Char.GetWomanMan] [target.Custom2('RelationDescriptor', ROOT.Char)] này sẽ không bao giờ buông tha cho ta ư..." [target.GetTitledFirstName] lẩm bẩm trong hơi thở của [target.GetHerHis] khi ta tiến lại gần. "Ta có thể giúp gì cho ngài, [ROOT.Char.GetTitledFirstNameNoTooltip]?""
  seduce_ongoing.5001.desc_ending:0 "\n\nNhững căng thẳng giữa chúng Ta âm ỉ như thường lệ, nhưng Ta có một kế hoạch để chế ngự cảm xúc bão tố mà chúng Ta dành cho nhau…"
  seduce_ongoing.5001.a:0 "Ngài nghĩ sao về chủ đề [ROOT.GetCharacter.Custom('education_conversation_subject')]?"
  seduce_ongoing.5001.a.tt:0 "#F Khơi gợi trí tuệ của [target.GetFirstNamePossessiveNoTooltip]#!"
  seduce_ongoing.5001.b:0 "Về [mocked_courtier.Custom2('InsultNoun', ROOT.Char)] [mocked_courtier.GetFirstNameNoTooltip]..."
  seduce_ongoing.5001.b.tt:0 "#F Khơi gợi tính ác của [target.GetFirstNamePossessiveNoTooltip] bằng cách chế nhạo [mocked_courtier.GetTitledFirstNameNoTooltip] cùng nhau#!"
  seduce_ongoing.5001.c_tier_down:0 "Câu hỏi là Ta #EMP có thể làm gì cho #EMP Ngài#!, thưa [target.GetLadyLord]."
  seduce_ongoing.5001.c_tier_up:0 "Niềm vui là của Ta, thưa [target.GetLadyLord]. Chúng ta nên khắc phục điều đó."
  seduce_ongoing.5001.c.tt:0 "#F Khơi gợi mặt dục vọng của [target.GetFirstNamePossessiveNoTooltip]#!"
  seduce_ongoing.5001.d:0 "Xin lỗi vì làm phiền, Ta vừa định ra đi."
 

  seduce_ongoing.5003.t:0 "Kẻ Địch [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('owner'))|U] Của Ta"
  seduce_ongoing.5003.opening:0 "Mỗi bước [owner.GetTitledFirstName] tiến về phía Ta khiến tâm trạng Ta càng tệ. Kẻ [owner.Custom2('InsultNoun', ROOT.Char)] này muốn gì nữa đây?\n\n"
  seduce_ongoing.5003.conversation:0 "Thật ngạc nhiên khi [owner.GetSheHe] cuốn ta vào một cuộc thảo luận về chủ đề [ROOT.GetCharacter.Custom('education_conversation_subject')], và bất chấp những e ngại ban đầu của ta về sự đồng hành của [owner.GetHerHis], ta lại thấy nó vô cùng thú vị!"
  seduce_ongoing.5003.mockery:0 "\"[ROOT.Char.GetTitledFirstNameNoTooltip]! Ngài sẽ không tin kẻ [mocked_courtier.Custom2('InsultNoun', SCOPE.sC('owner'))] [mocked_courtier.GetFirstName] đã làm gì hôm nay!\"\nNgạc nhiên thay, chúng Ta có một cuộc trò chuyện khá vui vẻ về những khuyết điểm của [mocked_courtier.GetFirstNamePossessive]."
  seduce_ongoing.5003.bodily:0 "Không gì có thể chuẩn bị cho Ta trước cám dỗ từ làn da trần của [owner.GetHerHis] khi [owner.GetSheHe] cởi [owner.GetHerHis] [owner.Custom('GetUpperClothingArticle')]."
  seduce_ongoing.5003.fallback:0 "Ngạc nhiên thay, chúng Ta đã có một buổi tối thú vị cùng nhau, cười đùa về những chuyện tầm thường và đi dạo trong vườn."
  seduce_ongoing.5003.a:0 "Chưa bao giờ ta thấy [owner.GetHerHim] lại #EMP đáng mến#! đến thế!"

  seduce_ongoing.5004.opening:0 "Mỗi bước [owner.GetTitledFirstName] tiến về phía Ta khiến tâm trạng Ta càng tệ. Kẻ [owner.Custom2('InsultNoun', ROOT.Char)] này muốn gì nữa đây?\n\n"
  seduce_ongoing.5004.conversation:0 "\"Về chủ đề [owner.Custom('education_conversation_subject')]...\"\n\nTa không hiểu sao [owner.GetSheHe] lại tưởng Ta quan tâm, nhưng Ta nhanh chóng cho thấy rõ ràng rằng Ta hoàn toàn không hứng thú."
  seduce_ongoing.5004.mockery:0 "\"[ROOT.Char.GetTitledFirstNameNoTooltip]! Ngài sẽ không tin kẻ [mocked_courtier.Custom2('InsultNoun', SCOPE.sC('owner'))] [mocked_courtier.GetFirstName] đã làm gì hôm nay!\"\n\nTa không thể tưởng tượng được gì đã thôi thúc [owner.GetHerHim] bôi nhọ [mocked_courtier.GetTitledFirstName] trước mặt Ta, nhưng [owner.GetSheHe] không ngừng ngay lập tức."
  seduce_ongoing.5004.bodily:0 "Khi [owner.GetSheHe] tiến sát Ta và cố tình kéo [owner.GetHerHis] [owner.Custom('GetUpperClothingArticle')], Ta nhanh chóng lùi lại."
  seduce_ongoing.5004.fallback:0 "Rõ ràng [owner.GetSheHe] đã ghi tạc vào tâm trí của [owner.GetHerHis] việc dành cả ngày ở bên ta, bởi vì [owner.GetSheHe] từ chối rời đi trước khi ta nói rõ sự chán ghét của mình đối với sự hiện diện của [owner.GetHerHis]."
  seduce_ongoing.5004.a:0 "Một cuộc tương tác khó chịu như thường lệ!"

  seduce_ongoing.5005.conversation:0 "Nụ cười của [target.GetTitledFirstNamePossessive] làm bừng sáng cả khuôn mặt [target.GetHerHis] vào cuối cuộc trò chuyện dài về [target.Custom('herhis_subject_of_interest')]. Khi một sự im lặng chan hòa bao trùm giữa chúng ta, ta nhận ra chúng ta đang đứng gần nhau hơn nhiều so với trước đó; tay ta gần như sượt qua [target.Custom('GetClothingArticle')] của [target.GetHerHis]."
  seduce_ongoing.5005.mockery:0 "\"... và cách [mocked_courtier.GetSheHe] [mocked_courtier.Custom('quirk_neg_present')] – Ta chưa bao giờ thấy gì như vậy!\"\n\nTiếng cười chúng Ta chia sẻ về [mocked_courtier.GetTitledFirstNamePossessive] chân thật hơn Ta mong đợi, và khi im lặng thân thiện bao trùm, Ta nhận ra chúng Ta đứng gần nhau hơn trước; tay Ta gần như chạm vào [target.GetHerHis] [target.Custom('GetClothingArticle')]."
  seduce_ongoing.5005.bodily:0 "Ta chỉ được nếm trải một chút từ [target.GetTitledFirstName], nhưng nó khiến Ta khao khát nhiều hơn. Im lặng thân thiện bao trùm khi chúng Ta tách ra, và Ta nhận ra [target.GetSheHe] thoải mái hơn bao giờ hết bên Ta – [target.Custom('GetUpperClothingArticle')] lệch một bên vẫn vậy."
  seduce_ongoing.5005.fallback:0 "Chúng Ta dành buổi tối bên nhau, nói chuyện và cười đùa. Khi im lặng thân thiện bao trùm, Ta nhận ra chúng Ta đứng gần nhau hơn trước; tay Ta gần như chạm vào [target.GetHerHis] [target.Custom('GetClothingArticle')]."
  seduce_ongoing.5005.ending:0 "\n\n\"Ta chưa bao giờ biết Ngài là một người đồng hành tuyệt vời đến vậy, [ROOT.Char.GetFirstNameNoTooltip]!\""
  seduce_ongoing.5005.a:0 "Ta sẽ chứng minh cho [target.GetHerHim] thấy Ta tuyệt vời đến mức nào!"

  seduce_ongoing.5006.conversation:0 "Sau gần một canh giờ trò chuyện gượng gạo, [target.GetFirstName] trông buồn chán hơn bao giờ hết kể từ khi ta biết [target.GetHerHim]. Khi ta đổi chủ đề từ [target.Custom('herhis_subject_of_interest')] sang [ROOT.GetCharacter.Custom('education_conversation_subject')], [target.GetSheHe] [target.Custom('quirk_neg_present')] và xin phép cho [target.GetHerselfHimself] lui."
  seduce_ongoing.5006.mockery:0 ""[ROOT.Char.GetTitledFirstNameNoTooltip]! Ngài có tin được là [mocked_courtier.GetFirstName] [mocked_courtier.Custom2('InsultNoun', ROOT.Char)] đó thực sự..."\n\nTa nhanh chóng lảng đi khi sự khinh miệt trên khuôn mặt của [target.GetFirstNamePossessive] ngày càng rõ rệt."
  seduce_ongoing.5006.bodily:0 "Khi Ta tiến tới [target.GetFirstName], cười [ROOT.Char.Custom('quirk_pos_adverb')] và gợi ý nâng [ROOT.Char.Custom('GetUpperClothingArticle')], [target.GetSheHe] lùi lại với vẻ ghê tởm hoàn toàn."
  seduce_ongoing.5006.fallback:0 "Khi ta đang bối rối, cố gắng tìm điểm chung với [target.GetFirstName], thì sự khinh thường của [target.GetHerHis] lại càng lộ rõ theo từng phút.\n\nNgay sau đó, [target.GetSheHe] viện cớ cho [target.GetHerselfHimself] và nhanh chóng lánh mặt ta."
  seduce_ongoing.5006.a:0 "Tại sao Ta lại muốn lên giường với một kẻ [target.Custom2('InsultNounSexual', ROOT.Char)] như thế?!"

  seduce_ongoing.5011.t:0 "Sự Hấp Dẫn Khiêu Khích"
  seduce_ongoing.5011.desc:0 "Ít người có thể khiêu khích Ta như [target.GetTitledFirstName], và khi chúng Ta ở riêng, [target.GetSheHe] nhanh chóng vừa sỉ nhục vừa dùng tay với Ta. Dĩ nhiên Ta đáp trả tương xứng.\n\nPhải thừa nhận rằng sự kích thích từ cả cuộc chiến và sự gần gũi với [target.GetHerHis] cơ thể mồ hôi, thở hổn hển, là đủ để khiến máu Ta bừng lên. Chẳng mấy chốc Ta không còn biết mình thật sự muốn đánh bại [target.GetHerHim], hay chỉ muốn kéo dài cuộc ẩu đả..."
  seduce_ongoing.5011.a:0 "Ta sẽ khiến nụ cười [target.Custom('quirk_neg_adjective')] biến mất trên khuôn mặt [target.GetHerHis]!"
  seduce_ongoing.5011.b:0 "Ta có giúp Ngài đứng dậy không?"
  seduce_ongoing.5011.c:0 "Cú đấm tiếp theo của [target.GetHerHis|U] sẽ chảy máu."
  seduce_ongoing.5011.c.tt:0 "#F Nỗi đau Ta chịu vì tình yêu!#!\nLựa chọn này có vì đặc điểm Sadistic của [target.GetFirstNamePossessiveNoTooltip]"
  seduce_ongoing.5011.d:0 "Đấu vật như trẻ con không thể là cách để đến trái tim [target.GetHerHis]!"

  seduce_ongoing.5012.desc:0 "Ít người có thể khiêu khích Ta như [owner.GetTitledFirstName], và khi chúng Ta ở riêng, chúng Ta nhanh chóng vừa sỉ nhục vừa dùng tay lên nhau.\n\nPhải thừa nhận rằng cảm giác hồi hộp từ cả cuộc chiến và sự gần gũi với cơ thể mồ hôi, thở hổn hển – đủ để khiến máu Ta bừng lên, và [owner.GetSheHe] không có dấu hiệu nhường bước."
  seduce_ongoing.5012.a:0 "[owner.GetSheHe|U] tốt hơn đừng nương tay với Ta!"
  seduce_ongoing.5012.b:0 "Đủ rồi! Rời đi."

  seduce_ongoing.5013.desc:0 "[target.GetTitledFirstName] và Ta kết thúc trên mặt đất, đánh nhau như những đứa trẻ nhỏ [target.Custom('GirlsBoysChildren')]. Nụ nhăn nhó của chúng Ta nhanh chóng chuyển thành nụ cười, nắm đấm thành vuốt ve, chửi thề thành rên rỉ...\n\nNếu [target.GetSheHe] nhận ra Ta lưu lại trong vòng tay siết chặt của [target.GetHerHis] lâu hơn cần thiết, [target.GetSheHe] dường như không bận tâm."
  seduce_ongoing.5013.a:0 "Thật tốt khi xả hơi!"

  seduce_ongoing.5014.desc:0 "[target.GetTitledFirstName] và Ta kết thúc trên mặt đất, đánh nhau như những đứa trẻ nhỏ [target.Custom('GirlsBoysChildren')], và nụ nhăn nhó của [target.GetHerHis] nhanh chóng chuyển thành nhăn mặt.\n\n\"Để Ta yên, đồ cục súc!\""
  seduce_ongoing.5014.a:0 "Thật không may."

  seduce_ongoing.5015.desc:0 "Ít người có thể khiêu khích Ta như [owner.GetTitledFirstName], và khi chúng Ta ở riêng, chúng Ta nhanh chóng vừa sỉ nhục vừa dùng tay lên nhau.\n\nTa phải thừa nhận Ta hơi ngạc nhiên khi [owner.GetSheHe] đưa tay ra, giúp Ta đứng dậy."
  seduce_ongoing.5015.a:0 "Cảm ơn Ngài, [owner.GetFirstNameNoTooltip]."
  seduce_ongoing.5015.b:0 "[owner.GetSheHe] nghĩ [owner.GetSheHe] là ai chứ?!"

  seduce_ongoing.5016.desc:0 "[target.GetTitledFirstName] và ta kết thúc bằng việc nằm lăn trên đất, ẩu đả như những [target.Custom('GirlsBoysChildren')] nhỏ, và những cái cau mày của chúng ta nhanh chóng chuyển thành nụ cười.\n\nKhi ta chìa tay đỡ [target.GetHerHim] đứng dậy, [target.GetSheHe] nắm lấy nó và gật đầu cảm ơn [target.GetHerHis]."

  seduce_ongoing.5017.desc:0 "[target.GetTitledFirstName] và Ta kết thúc trên mặt đất, đánh nhau như những đứa trẻ nhỏ [target.Custom('GirlsBoysChildren')], và nụ nhăn nhó của [target.GetHerHis] nhanh chóng chuyển thành nhăn mặt sâu hơn khi Ta đứng dậy trước [target.GetHerHim].\n\n\"Ngay cả việc giúp Ta đứng dậy… Ta không nên mong gì hơn từ một kẻ [owner.Custom2('InsultNoun', ROOT.Char)].\""

  seduce_ongoing.5018.desc:0 "Ít người có thể khiêu khích Ta như [owner.GetTitledFirstName], và khi chúng Ta ở riêng, chúng Ta nhanh chóng vừa sỉ nhục vừa dùng tay lên nhau.\n\nSau một chút do dự từ [owner.GetHerHis], Ta chiếm ưu thế trong cuộc ẩu đả, và Ta không thể không tận hưởng việc thấy [owner.GetHerHim] ở thế phục tùng như vậy, thở hổn hển và nhún nhường."
  seduce_ongoing.5018.a:0 "Hãy cúi mình trước Ta đi!"
  seduce_ongoing.5018.b:0 "Thật đáng thương. Rời đi."

  seduce_ongoing.5019.desc:0 "Khi [target.GetTitledFirstName] đứng trên Ta, Ta không thể ngăn rùng mình sợ hãi chạy dọc sống lưng khi thấy niềm vui trong mắt [target.GetHerHis]. Ít ra [target.GetSheHe] dường như đánh giá cao cử chỉ này..."
  seduce_ongoing.5019.a:0 "Cái rùng mình đó là vì háo hức! Th–thật đấy!"

  seduce_ongoing.5020.desc:0 "Khi [target.GetTitledFirstName] đứng trên Ta, Ta không thể ngăn rùng mình sợ hãi chạy dọc sống lưng khi thấy niềm vui trong mắt [target.GetHerHis]. Khi [target.GetSheHe] quay lưng với Ta với vẻ khinh bỉ, Ta cảm thấy vừa nhẹ nhõm vừa thất vọng.\n\n\"Ngài không bao giờ làm Ta hài lòng. Để Ta yên, [ROOT.Char.GetFirstNameNoTooltip].\""
  seduce_ongoing.5020.a:0 "Điều này có thể đã tốt hơn… nhưng cũng có thể tệ hơn!"

  seduce_ongoing.5101.t:0 "Nghĩa Vụ và Khao Khát"
  seduce_ongoing.5101.desc:1 "[target.GetTitledFirstName] thường nói chuyện với ta theo cách cho thấy rõ rằng sự phục vụ của [target.GetHerHis] đối với ta đã tạo ra một khoảng cách giữa chúng ta.\n\nTa cần làm cho [target.GetHerHim] hiểu rằng ta khao khát [target.GetHerHim] nhiều hơn là với tư cách chư hầu của ta, rằng ta thèm khát hơi ấm của [target.GetHerHis], sự đụng chạm của [target.GetHerHis], và đôi môi căng mọng ấy."
  seduce_ongoing.5101.a:0 "Chúng ta là đồng đẳng trước [ROOT.Char.GetFaith.HighGodNameAlternate], [target.GetFirstNameNoTooltip]!"
  seduce_ongoing.5101.a.tt:0 "#F Ta nhấn mạnh sự tương đồng giữa chúng ta#!"
  seduce_ongoing.5101.success_tt:0 "Nếu [target.GetFirstNameNoTooltip] đáp lại tích cực:"
  seduce_ongoing.5101.b:0 "Vẫn còn nhiều cách để Ngài phục vụ Ta, [target.GetFirstNameNoTooltip]..."
  seduce_ongoing.5101.b.tt:0 "#F Ta nhấn mạnh quyền lực của mình#!"
  seduce_ongoing.5101.c:0 "Hiện giờ Ta nên giữ cảm xúc cho riêng mình."
  seduce_ongoing.5101.c.tt:0 "#F Luôn có những cách tốt hơn để cho [target.GetHerHim] biết.#!"

  seduce_ongoing.5102.desc:0 "\"Ta có thể là [owner.GetTitleTierName] của ngài, nhưng Ta luôn nghĩ chúng ta là đồng đẳng.\" Chúa công, [owner.GetFirstName], đã đến gặp Ta, và ban đầu Ta chưa hiểu lý do, nhưng nhanh chóng mọi chuyện trở nên rõ ràng. \"Chúng ta... điều này... Chúng ta không cần bị ràng buộc bởi danh hiệu. Chúng ta còn hơn cả những cái tên. Còn nhiều hơn thế nữa.\""
  seduce_ongoing.5102.a:0 "Sự chú ý của [ROOT.Char.Custom2(''RelationToMe'Possessive', SCOPE.sC('owner'))] của ta thật đáng hãnh diện."
  seduce_ongoing.5102.b:0 "Ta không muốn nhiều hơn những gì chúng ta đang có."

  seduce_ongoing.5103.desc:0 "Thân yêu [target.Custom2('RelationToMe', ROOT.Char)], [ROOT.Char.GetTitledFirstName],\nTa rất hân hạnh khi nghe ngài mô tả chúng ta không chỉ là chúa công và thần dân, mà còn nhiều mặt là đồng đẳng. Mong rằng chúng ta sẽ cùng nhau chia sẻ một tương lai tươi sáng như nhau."
  seduce_ongoing.5103.a:0 "[target.GetFirstNameNoTooltip], Ta sẽ có được ngươi!"

  seduce_ongoing.5104.desc:0 "[owner.GetFirstName], [target.Custom2('RelationToMe', SCOPE.sC('owner'))] của Ta!\nNhững gì ngài ám chỉ, những gì ngài yêu cầu, thật là không đúng mực! Ta có nghĩa vụ phục vụ cho vương quốc, nhưng đừng nhầm lẫn lòng trung thành với khao khát."
  seduce_ongoing.5104.a:0 "À, nhưng [target.GetFirstNameNoTooltip]..."

  seduce_ongoing.5105.desc:0 "\"Ngài luôn phục vụ Ta rất tốt, rất trung thành.\" Chúa công, [owner.GetFirstName], đã đến gặp Ta, và ban đầu Ta chưa hiểu lý do, nhưng nhanh chóng mọi chuyện trở nên rõ ràng. \"Ta khao khát ngài không chỉ như một thần dân, mà như một [target.GetWomanMan]. Hãy phục vụ [owner.GetLadyLord] theo cách này nữa!\""
  seduce_ongoing.5105.a:0 "Ta có thể chăm sóc ngài theo cách mà không ai khác làm được."
  seduce_ongoing.5105.b:0 "Ngài có nghĩa vụ của Ta, nhưng sẽ không bao giờ có nhiều hơn."

  seduce_ongoing.5106.desc:0 "Thân yêu [target.Custom2('RelationToMe', ROOT.Char)], [ROOT.Char.GetTitledFirstName],\nTa rất hân hạnh khi ngay cả Ta, thần dân khiêm tốn, cũng có thể truyền cảm hứng cho ngài theo cách này. Hãy xem thời gian sẽ đưa chúng ta đến đâu."

  seduce_ongoing.5201.t:0 "Hơn Cả Bạn Bè"
  seduce_ongoing.5201.desc:0 "[target.GetFirstName] và Ta đi dạo qua [court_location.Custom('BaronyTownType')] của [court_location.GetNameNoTier].\n\nKhi chúng Ta đến một quảng trường với đài phun nước xinh đẹp, chúng Ta dừng lại để ngắm nhìn hoạt động nhộn nhịp xung quanh, đoàn tùy tùng của chúng Ta tạm thời lùi vào hậu cảnh."
  seduce_ongoing.5201.a:0 "Hãy tung đồng xu và ước cho tình yêu!"
  seduce_ongoing.5201.a.tt:0 "Ta nghĩ [target.GetTitledFirstName] đang tưởng tượng về chúng ta, hoặc ít nhất là về tình yêu nói chung."
  seduce_ongoing.5201.b:0 "Nhớ lần đó chúng ta..."
  seduce_ongoing.5201.b.tt:0 "Ta nghĩ [target.GetTitledFirstName] thật sự trân trọng tình  Bạn củachúng ta."
  seduce_ongoing.5201.c:0 "Ta sẽ không làm hỏng khoảnh khắc này."


  seduce_ongoing.5202.desc:0 "Khi [owner.GetFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))] của Ta – và Ta đi qua [court_location.Custom('BaronyTownType')] của [court_location.GetNameNoTier], chúng Ta gặp một quảng trường với đài phun nước đẹp.\n\n\"Chúng ta cùng tung đồng xu, [ROOT.Char.Custom('FormOfAddressForLiege')]? Người ta nói điều đó sẽ mang lại tình yêu…\""
  seduce_ongoing.5202.a:0 "Hãy làm ba lần, để thêm may mắn!"
  seduce_ongoing.5202.b:0 "Nghe như chuyện dành cho đôi lứa, chứ không phải Bạn Bè."

  seduce_ongoing.5203.desc:0 "[target.GetFirstName] vui vẻ đứng bên cạnh Ta, tung đồng xu xuống nước trong đài phun và nhìn Ta với nụ cười.\n\nPhần còn lại của buổi đi dạo trở nên thân thiện hơn nhờ ước nguyện chung của chúng Ta."
  seduce_ongoing.5203.a:0 "[target.GetSheHe|U] thực sự là [target.Custom2('ComplimentAdjectiveArticle', ROOT.Char)] [target.GetWomanMan]!"

  seduce_ongoing.5204.desc:0 "\"Ngươi đang chơi trò gì ngớ ngẩn thế, [ROOT.Char.GetFirstNameNoTooltip]?\"\n\n[target.GetFirstName] từ chối yêu cầu ước cho tình yêu của Ta. Phần còn lại của buổi đi dạo diễn ra trong im lặng căng thẳng, và chúng Ta sớm chào tạm biệt nhau."
  seduce_ongoing.5204.a:0 "Tâm trạng Ta u ám như đáy đài phun..."

  seduce_ongoing.5205.desc:0 "Khi [owner.GetFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))] của Ta – và Ta đi qua [court_location.Custom('BaronyTownType')] của [court_location.GetNameNoTier], chúng Ta trò chuyện về những kỷ niệm xưa.\n\n\"Nhớ lần chúng ta ở bên nhau suốt đêm, lập kế hoạch cho tương lai, tưởng tượng về một tương lai chung...?\""
  seduce_ongoing.5205.a:0 "Làm sao Ta có thể quên được?"
  seduce_ongoing.5205.b:0 "Tại sao [owner.GetSheHe] lại nhắc về đêm đáng xấu hổ đó?!"

  seduce_ongoing.5206.desc:0 "[target.GetFirstName] và Ta dành hàng giờ hồi tưởng về quá khứ và tưởng tượng về tương lai cùng nhau.\n\nBuổi đi dạo còn lại tràn ngập bầu không khí thân thiện, và Ta không khỏi hy vọng một số giả thuyết vui vẻ sẽ trở thành hiện thực."

  seduce_ongoing.5207.desc:0 ""Ngài là một người bạn quá tốt, [ROOT.Char.GetFirstNameNoTooltip], đó là điều ta không bao giờ muốn thay đổi.""\n\n[target.GetFirstName] làm rõ rằng [target.GetSheHe] không có hứng thú với những suy đoán về những gì đã có thể, hoặc vẫn có thể xảy ra, giữa chúng ta. Phần còn lại của buổi tản bộ trôi qua trong sự im lặng căng thẳng, và chúng ta sớm nói lời cáo biệt nhau."
  seduce_ongoing.5207.a:0 "Chà, điều đó có thể đã tốt hơn!"

  seduce_ongoing.5301.t:0 "Khoảnh Khắc Riêng Tư"
  seduce_ongoing.5301.desc:0 "Không ai thấy lạ khi Ta ngồi với [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] bên lò sưởi đến tận tối muộn. Nhưng có một sự căng thẳng trong không khí.\n\nTa chỉ muốn kéo [target.GetHerHis] lại gần và xé quần áo khỏi cơ thể [target.GetHerHis], nhưng nếu [target.GetSheHe] biết, [target.GetSheHe] sẽ kinh hãi. Hay là...?"
  seduce_ongoing.5301.a:0 "Một bàn tay trên tay [target.GetHerHis] sẽ nói lên tất cả."
  seduce_ongoing.5301.a.tt:0 "#F Ta hy vọng tín hiệu tinh tế của Ta sẽ được đón nhận#!"
  seduce_ongoing.5301.b:0 "Chúng ta ở riêng, và Ta sẽ không từ chối đôi môi [target.GetHerHis]."
  seduce_ongoing.5301.b.tt:0 "#F Ta hy vọng sự quan tâm rõ ràng của Ta sẽ được đón nhận#!"
  seduce_ongoing.5301.c:0 "Sẽ thật đáng tiếc nếu phá hỏng một buổi tối tuyệt vời."
  seduce_ongoing.5301.c.tt:0 "#F Sẽ còn những lần khác. [THIS.Char.Custom2('RelationToMe', SCOPE.sC('target'))] của Ta không đi đâu cả.#!"
  seduce_ongoing.5301.success_tt:0 "Nếu [target.GetFirstName] đáp lại sự tiến cử của Ta:"

  seduce_ongoing.5302.desc:0 "Mọi thứ diễn ra tự nhiên đến mức, lúc đầu ta thậm chí chẳng để tâm, nhưng khi chúng ta ngồi trước lò sưởi, [owner.GetFirstName] — [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))] của ta — siết lấy tay ta với một sự mãnh liệt vượt xa sự an ủi của một [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))].\n\nTa có thể cảm nhận được nhịp đập của [owner.GetHerHis] đang nhanh hơn vì dục vọng."
  seduce_ongoing.5302.a:0 "Ta từ chối tin rằng cảm giác này là sai."
  seduce_ongoing.5302.b:0 "Ta hân hạnh vì sự quan tâm, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))], nhưng không."

  seduce_ongoing.5303.desc:0 "[target.GetFirstName] thậm chí không giật mình khi tay Ta nắm lấy [target.GetHersHis], mặc dù cả hai đều biết ý nghĩa của nó. Ta cảm nhận nhịp tim [target.GetHerHis] tăng lên khi cuộc trò chuyện tiếp tục. Bàn tay Ta ra mồ hôi và hơi thở trở nên nông trước-\n#EMP Cái gì vậy?!# Chỉ là một người hầu.\n\n[Ta] và [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] chúng Ta xin phép rồi rời đi. Mỗi người một hướng."
  seduce_ongoing.5303.a:0 "Ta biết ngươi cũng cảm nhận điều đó, [target.GetFirstNameNoTooltip]."

  seduce_ongoing.5304.desc:0 "Ta cố gắng xem đó như một trò đùa, nhưng [target.GetFirstName] đã hiểu đúng ý định của Ta.\n\n\"Một [target.Custom2('RelationToMe', SCOPE.sC('owner'))] không bao giờ... Điều này không bao giờ nên xảy ra!\" [target.GetSheHe|U] rời bỏ Ta một mình bên lò sưởi."
  seduce_ongoing.5304.a:0 "Ta biết, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))], nhưng vẫn…"

  seduce_ongoing.5305.desc:0 "Mọi chuyện xảy ra quá nhanh, nhưng Ta không ngạc nhiên. Một khoảnh khắc chúng Ta ngồi bên lò sưởi, khoảnh khắc tiếp theo [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))] nghiêng lại gần. Rồi đôi môi [owner.GetHerHis] chạm vào Ta, tay vuốt ve cổ, vai, đùi, thắt lưng-\n\nTiếng ồn của người hầu đến gần khiến chúng Ta vội tách ra, và suy nghĩ của Ta nhanh chóng theo kịp khao khát."
  seduce_ongoing.5305.a:0 "Cảm giác như mọi thứ cuối cùng cũng đúng."

  seduce_ongoing.5306.desc:0 "[target.GetFirstName] đáp lại nụ hôn của Ta, và trong vài khoảnh khắc hồi hộp, mọi thứ đều ổn. Dĩ nhiên không thể kéo dài, vì chúng Ta nhanh chóng tách ra trước khi bị người hầu đi qua thấy.\n\nKhi ra đi mỗi người một hướng, [target.GetSheHe] nhìn Ta. \"Ta chưa hoàn toàn hiểu cho tới bây giờ, [target.Custom2('RelationToMe', SCOPE.sC('owner'))].\""
  seduce_ongoing.5306.a:0 "Ngươi và ta, thân yêu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] của ta."

  seduce_ongoing.5307.desc:0 "[target.GetFirstName] dường như lạc vào nụ hôn một lúc, khi tay Ta lang thang trên cơ thể [target.GetHerHis], tìm kiếm thèm khát. Rồi [target.GetSheHe] đẩy Ta ra. \"Ngươi đang làm gì vậy?! Ngươi là [target.Custom2('RelationToMe', SCOPE.sC('owner'))] của ta!\"\n\nTa không biết nói gì, không cách nào giải thích, trước khi [target.GetSheHe] lao ra khỏi phòng."
  seduce_ongoing.5307.a:0 "[target.GetFirstNameNoTooltip], ta thực sự đã nghĩ..."

  seduce_ongoing.6001.t:0 "Chỉ Là Tò Mò"
  seduce_ongoing.6001.desc:0 "Khi thăm các triều đình khác, Ta thấy việc dành thời gian với các quan lại giúp hiểu rõ hơn về chúa công của họ. Nếu điều đó xảy ra với [target.GetTitledFirstName], càng tốt.\n\n[target.GetSheHe|U] trả lời câu hỏi của Ta tận tâm, và Ta cảm thấy như có thể nghe suốt cả ngày, và [target.GetSheHe] có vẻ hài lòng khi nói chuyện."
  seduce_ongoing.6001.a:0 "Ngươi – [target.Custom2('RelationToMe', SCOPE.sC('court_owner'))] – thật thú vị, nhưng #EMP ngươi#! thích gì?"
  seduce_ongoing.6001.b:0 "Chắc chắn ngươi sẽ nhắc tới ta với [court_owner.GetFirstNameNoTooltip] chứ?"

  seduce_ongoing.6011.t:0 "Trình Diễn Quyền Lực"
  seduce_ongoing.6011.desc:0 "Ta quan sát binh lính trong sân tập luyện theo bài tập Ta chỉ dẫn, lặp đi lặp lại. Ta chú ý đến mức không nhận ra [target.GetTitledFirstName] đã đến bên cạnh.\n\n\"Họ di chuyển tốt, nhưng kẻ [dummy_gender.GetWomanMan] đó luôn chậm nửa bước.\""
  seduce_ongoing.6011.a:0 "Ấn tượng thật! Chúng ta có nhiều điểm chung hơn Ta nghĩ."
  seduce_ongoing.6011.b:0 "Ngươi thật tinh tường!"
  seduce_ongoing.6011.c:0 "Một chiêu đánh lạc hướng. Xem chuyện gì xảy ra tiếp theo..."

  seduce_ongoing.6021.t:0 "Cuộc Gặp Gỡ Của Những Trí Tuệ"
  seduce_ongoing.6021.desc:0 "Ta ngạc nhiên khi [target.GetTitledFirstName] và Ta bị cuốn vào một cuộc thảo luận về quân sự, nhưng [target.GetSheHe] dường như nhiệt tình chẳng kém Ta về chủ đề này. [target.GetSheHe|U] cũng vô cùng hiểu biết!"
  seduce_ongoing.6021.a:0 "Sao vậy [target.GetFirstNameNoTooltip], cả đời ta chưa từng nghe điều như vậy!"
  seduce_ongoing.6021.b:0 "[target.GetFirstNameNoTooltip], ta chưa từng biết chúng ta có nhiều điểm chung đến vậy."
  seduce_ongoing.6021.c:0 "Kể thêm cho ta nghe suy nghĩ của ngươi về đội hình kỵ binh..."

  seduce_ongoing.6031.t:0 "Mạng Lưới"
  seduce_ongoing.6031.desc:0 "Cũng giống như Ta, [target.GetTitledFirstName] có mạng lưới gián điệp của [target.GetHerHis], vươn xa hết mức có thể để tìm mọi loại thông tin ẩn giấu. Ta có thể để họ “phát hiện” ý định của Ta đối với [target.GetFirstName] và để [target.GetHerHim] cảm thấy rằng [target.GetSheHe] nắm thế thượng phong."
  seduce_ongoing.6031.a:0 "Ta cũng sẽ để họ biết rằng Ta biết rằng họ biết..."
  seduce_ongoing.6031.b:0 "Ta sẽ chắc chắn rằng các gián điệp tìm thấy #EMP thứ gì đó thú vị.#!"
  seduce_ongoing.6031.c:0 "Ôi, cơ hội tuyệt vời để luyện tập!"

  seduce_ongoing.6041.t:0 "Hiểu Biết Đam Mê"
  seduce_ongoing.6041.desc:0 "Trong việc theo đuổi tình cảm của [target.GetTitledFirstNamePossessive], sẽ rất hữu ích nếu biết chính xác sở thích và gu của [target.GetHerHis]..."
  seduce_ongoing.6041.a:0 "#EMP Chà#!, điều này thậm chí không phải là thử thách!"
  seduce_ongoing.6041.b:0 "Ta chắc chắn có thể thuyết phục [target.GetHerHim] nói cho Ta biết."
  seduce_ongoing.6041.b.success:0 "Ta học thêm về sở thích của [target.GetFirstNamePossessive]"
  seduce_ongoing.6041.b.failure:0 "[target.GetFirstName] né tránh câu hỏi của Ta"
  seduce_ongoing.6041.c:0 "Các gián điệp của Ta sẽ sớm phát hiện ra."
  seduce_ongoing.6041.c.success:0 "Các gián điệp của Ta thành công"
  seduce_ongoing.6041.c.failure:0 "[target.GetFirstName] tránh được gián điệp của Ta"
  seduce_ongoing.6041.d:0 "Biết sao được? Ta sẽ hỏi thẳng thôi."

  seduce_ongoing.6042.desc:0 "Điều này thật thú vị... [target.GetFirstName] là một [target.GetWomanMan] có gu tinh tế."
  seduce_ongoing.6042.a:0 "Điều này sẽ giúp Ta chiếm được tình cảm của [target.GetHerHis]."

  seduce_ongoing.6043.desc:0 "Có vẻ Ta hơi vụng về khi tiếp cận [target.GetFirstName]. Giờ [target.GetSheHe] tự hỏi tại sao Ta lại quan tâm thái quá đến vật quý của [target.GetHerHis]!"
  seduce_ongoing.6043.a:0 "Điều này không tốt cho Ta."

  seduce_ongoing.6051.t:0 "Bức Màn Lịch Sự"
  seduce_ongoing.6051.close:0 "Ta bày ra tất cả như một cơ hội để thực hành phép lịch sự ngoại giao. Ta chắc chắn [target.GetTitledFirstName] nhìn thấu cái cớ của Ta, nhưng [target.GetSheHe] vẫn đồng ý."
  seduce_ongoing.6051.far:0 "Thăm triều đình khác luôn là lý do để trao đổi phép lịch sự ngoại giao. May mắn thay [target.GetTitledFirstName] rất sẵn lòng đáp lại Ta."
  seduce_ongoing.6051.end:0 "\n\nVới người ngoài, những cuộc trao đổi của chúng Ta có thể nghe như những lời sáo rỗng theo truyền thống. Nhưng với chúng Ta, ngọn lửa đam mê bên dưới những lời nói ấy mới là thật."
  seduce_ongoing.6051.a:0 "Ah, thật sảng khoái!"
  seduce_ongoing.6051.b:0 "Một số gợi ý ngươi đưa cho ta, [target.GetFirstNameNoTooltip]..."
  seduce_ongoing.6051.c:0 "Ta cần luyện tập nhiều hơn kiểu này."

  seduce_ongoing.7001.t:0 "Bên Dưới Những Lớp Vỏ"
  seduce_ongoing.7001.desc:0 "Ta nên tiếp cận [target.GetTitledFirstName] thế nào đây? [target.GetSheHe|U] có vẻ là một người kín đáo, thích lấy sự tĩnh lặng làm bầu bạn, ít nhất đó là biểu hiện của [target.GetSheHe] ở bên ngoài. Ai biết được [target.GetSheHe] là người như thế nào ở chốn riêng tư? Liệu [target.GetSheHe] có nhu mì và phục tùng hay lại nồng nàn và cuồng nhiệt?\n\nTa sẽ sớm khám phá ra một khi ta xuyên thủng được vẻ ngoài cứng như đá của [target.GetHerHis]. Giờ thì, ta phải quyết định làm cách nào để hình bóng ta vẫn còn vương vấn trong tâm trí [target.GetHerHis] sau khi ở một mình."
  seduce_ongoing.7001.a:0 "Hãy lịch lãm và duyên dáng hết mức có thể."
  seduce_ongoing.7001.a.tt:0 "#F Ngài nghĩ [target.GetFirstNameNoTooltip] có một khía cạnh lãng mạn bí mật và thích người tình nồng nàn#!"
  seduce_ongoing.7001.b:0 "Tiếp cận [target.GetFirstNameNoTooltip] nhẹ nhàng – như một người Ngài."
  seduce_ongoing.7001.b.tt:0 "#F Ngài nghĩ [target.GetFirstNameNoTooltip] là kiểu người thích người tình dịu dàng#!"
  seduce_ongoing.7001.c:0 "Ta sẽ chờ cơ hội thích hợp…"

  seduce_ongoing.7101.desc_opening:0 "Ta tìm được khoảnh khắc riêng tư với [target.GetTitledFirstName]. Ta chờ đợi, cân bằng giữa tâng bốc và trò chuyện. Rồi khi tâm trạng thích hợp ngự trị, "
  seduce_ongoing.7101.desc_can_touch_arms:0 "Ta với tay và nắm lấy tay [target.GetFirstNamePossessive]."
  seduce_ongoing.7101.desc_cannot_touch_arms:0 "Ta nhận ra mình đưa tay định nắm tay [target.GetFirstNamePossessive], nhưng rút lại trước khi [target.GetSheHe] nhận thấy."
  seduce_ongoing.7101.desc_closing:0 "Ta phơi bày tình cảm của mình dành cho [target.GetFirstNameNoTooltip] và tuyên thệ tình yêu bất diệt của mình cho [target.GetHerHim].\n\n"Ngay cả trong những giấc mơ hoang đường nhất, ta cũng không thể tưởng tượng ngài lại say đắm đến thế này, [owner.GetFirstNameNoTooltip]!" [target.GetSheHe|U] thốt lên trong khi tuyệt vọng phe phẩy quạt cho [target.GetHerselfHimself].\n\nMặc dù [target.GetSheHe] không đáp lại lời tuyên xưng của ta một cách tương tự, ta chắc chắn rằng sắc đỏ trên tai của [target.GetHerHis] là do [target.GetHerHim] đang đỏ mặt tía tai trước những lời lẽ bạo dạn của ta."
  seduce_ongoing.7101.a:0 "Chẳng mấy chốc [target.GetSheHe] sẽ đáp lại tình cảm của Ta."
  seduce_ongoing.7102.desc:0 "Ta cố tạo cơ hội riêng tư với [target.GetTitledFirstName], nhưng tâm trạng lãng mạn không tự nhiên xuất hiện với [target.GetHerHim]. Dù không thành công, Ta quyết định thử, mặc cho bầu không khí chưa hoàn hảo. Ta nghiêng gần để thì thầm lời ngọt ngào vào tai [target.GetHerHis], nhưng trước khi kịp nói gì, [target.GetFirstNameNoTooltip] rụt lại như bị bỏng và bỏ đi.\n\nTa không chắc phản ứng đó là do thiếu kinh nghiệm, ghê tởm hay e thẹn. Nhưng Ta biết mọi chuyện có thể đã tốt hơn."
  seduce_ongoing.7102.a:0 "Ta nên suy nghĩ lại cách tiếp cận…"
  seduce_ongoing.7201.desc:0 ""Ta muốn được hiểu ngài nhiều hơn."\n[target.GetTitledFirstName] tỏ vẻ căng thẳng lúc đầu, nhưng dần thư giãn khi [target.GetSheHe] bắt đầu tin rằng không có động cơ thầm kín nào đằng sau thỉnh cầu của ta.\n\nTrước khi chia tay, ta cảm ơn [target.GetFirstNameNoTooltip] vì khoảng thời gian tuyệt vời và [target.GetSheHe] cố gắng đáp lại nụ cười của ta bằng một nụ cười rụt rè của [target.GetHerHis]. Mặc dù thời gian bên nhau chẳng đáng được ghi vào sử sách, nhưng không thể phủ nhận rằng ta chưa bao giờ thấy [target.GetFirstNameNoTooltip] cười nhiều đến thế trong một ngày. Ta tin chắc rằng [target.GetFirstNameNoTooltip] sẽ còn nghĩ đến ta rất lâu."
  seduce_ongoing.7202.desc:1 "Để có một khoảnh khắc riêng tư với [target.GetTitledFirstName] không khó. Tuy nhiên, hóa ra phần khó nhằn lại là có một cuộc trò chuyện bình thường với [target.GetHerHim]. Ta hỏi [target.GetHerHim] một câu và [target.GetSheHe] đáp lại bằng câu trả lời ngắn nhất mà [target.GetSheHe] có thể nghĩ ra chỉ để chấm dứt cuộc trò chuyện của chúng ta. Quả là như vắt cổ chày ra nước!"
  seduce_ongoing.7202.desc_animal:0 "\n\nTa không thể ngừng nghĩ rằng Ta sẽ nhận được phản hồi nhiều hơn từ một [ROOT.Char.Custom('GetAnimalType')] chết còn hơn từ [target.GetFirstNameNoTooltip]."
