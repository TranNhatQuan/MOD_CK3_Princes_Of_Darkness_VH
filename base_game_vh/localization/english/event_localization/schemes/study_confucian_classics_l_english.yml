l_english:
  study_confucian_classics_outcome.10.t: "$study_confucian_classics_title$Lựa Chọn Phương Pháp"
  study_confucian_classics_outcome.10.desc: "Trước mặt Ta là #EMP Luận Ngữ của [Glossary( 'Kǒngzǐ', 'CONFUCIUS_GLOSS' )]#!, #EMP Kinh Thi#!, #EMP Kinh Thư#!, #EMP Lễ Kinh#!, #EMP Dịch Kinh#!, và #EMP Xuân Thu#!. Ta đã chuẩn bị [Glossary( 'Four Treasures', 'FOUR_TREASURES')] — và một #EMP núi#! trà...\n\nĐể chứng minh năng lực và học vấn, Ta cần học tập. Nhưng Ta sẵn sàng đi xa đến mức nào?"
  study_confucian_classics_outcome.10.a: "Ta sẽ không nghỉ ngơi cho tới khi chinh phục tri thức!"
  study_confucian_classics_outcome.10.b: "Ta sẽ nghiên cứu một cách nghiêm trang."
  study_confucian_classics_outcome.10.c: "Thời gian sẽ quyết định."
  no_change_study_tt: "Kế hoạch [GetScheme('study_confucian_classics').GetTypeName] của Ngài [scheme|E] tiếp tục tiến triển không thay đổi"
  tgp_focused_studies_modifier: "Học Tập Tập Trung"
  tgp_focused_studies_personal_modifier: "Chuyên Tâm Nghiên Cứu Khổng Tử"
  tgp_focused_studies_personal_modifier_desc: "Nhân vật này hoàn toàn tận tụy với việc nghiên cứu các kinh điển Khổng Tử."
  tgp_dignified_studies_modifier: "Học Tập Nghiêm Trang"
  tgp_dignified_studies_personal_modifier: "Học Trò Khổng Tử Nghiêm Trang"
  tgp_dignified_studies_personal_modifier_desc: "Nhân vật này đang nghiên cứu kinh điển Khổng Tử một cách nghiêm trang."
 
  study_confucian_classics_title: "$study_confucian_classics$: "
  study_confucian_classics_outcome.100.t: "$study_confucian_classics_title$Cả Đêm"
  study_confucian_classics_outcome.100.desc: "Khi kỳ [GetActivityType('activity_imperial_examination').GetName] tiếp theo diễn ra, Ta sẽ sẵn sàng. Đêm buông xuống khi Ta đặt Xuân Thu [ROOT.Char.Custom('GetRandomAnnalsPassage')] trước mặt, các trang sách được soi sáng bởi ánh sáng yếu ớt.\n\nNếu Ta kiên trì suốt đêm và ghi nhớ những đoạn quan trọng nhất, chắc chắn Ta sẽ có lợi thế... nhưng liệu Ta có thực sự học được không? Có lẽ Ta nên dành thời gian thực sự để #EMP hiểu#! chúng?"
  study_confucian_classics_outcome.100.a: "Ta phải vượt qua kỳ thi, bất chấp mọi giá."
  study_confucian_classics_outcome.100.b: "Trí tuệ cần thời gian."
  study_confucian_classics_outcome.100.c: "Tốt hơn là Ta đi ngủ..."
  preparatory.imperial_examination.advantage.tt: "Ngài nhận được một [exam_advantage|E] cho kỳ [GetActivityType('activity_imperial_examination').GetName] tiếp theo"
 
  study_confucian_classics_outcome.200.t: "$study_confucian_classics_title$Thi Hứng"
  study_confucian_classics_outcome.200.desc: "Vẻ đẹp và nét chữ của [ROOT.Char.Custom('GetRandomPoetryPassage')], thật #EMP kinh ngạc#! Và các tác phẩm của [poet.GetTitledFirstName] — đáng ngưỡng mộ, bền bỉ, thơ ca xứng đáng với thời đại. Lướt qua từng văn bản, Ta không thể ngừng đọc.\n\nCó lẽ Ta cũng nên nhúng bút... và đóng góp vào kho tàng của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier]?"
  study_confucian_classics_outcome.200.a: ""[ROOT.Char.Custom('GeneratePoem_Title_Fragment_Season')] của đức hạnh [ROOT.Char.Custom('FormalComplimentAdjective')] gọi mời..."""
  study_confucian_classics_outcome.200.b: "Ta sẽ đợi cảm hứng đến!"
  study_confucian_classics_outcome.200.c: "[poet.GetFirstNameNoTooltip] xứng đáng nhận thư ngưỡng mộ."
  study_confucian_classics_outcome.200.d: "Ta nên đọc lại [ROOT.Char.Custom('GetRandomPoetryPassage')]."
  friend_praised_privately: "[CHARACTER.GetShortUIName|U] khen ngợi [TARGET_CHARACTER.GetShortUIName]."
  friend_praised_privately_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] đã ca ngợi [CHARACTER.GetShortUIName]."
 
  study_confucian_classics_outcome.300.t: "$study_confucian_classics_title$Cảm Hứng Mùa [ROOT.Char.Custom('GetSeason')|U]"
  study_confucian_classics_outcome.300.desc: "Khi Ta ngắm nhìn khu vườn [location_province.Custom('ProvinceCompliment')] mùa [ROOT.Char.Custom('GetSeason')], Ta suy ngẫm về các câu thơ của đại thi nhân [ROOT.Char.Custom('GetRandomAncientChinesePoet')]. Làn gió lay tay áo, hướng tay Ta tới bút — như thể Trời mời gọi Ta viết.\n\nTrang giấy trước mặt, tĩnh lặng và chờ đợi, sẵn sàng nhận lời Ta."
  study_confucian_classics_outcome.300.a: "Với nỗ lực, một ngày nào đó Ta cũng sẽ vĩ đại!"
  study_confucian_classics_outcome.300.b: "Một bài thơ đơn giản, để lưu giữ khoảnh khắc."
  study_confucian_classics_outcome.300.c: "Trí tuệ của ông ấy đã là mực cho Ta."
  wang_wei: "Vương Duy"
  tao_yuanming: "Tao Yuanming"
  li_bai: "Lý Bạch"
  du_fu: "Đỗ Phủ"
  meng_haoran: "Mạnh Hạo Nhiên"
  liu_zongyuan: "Lưu Tông Nguyên"
  bai_juyi: "Bạch Cư Dị"
 
  study_confucian_classics_outcome.110.t: "$study_confucian_classics_title$Kinh Điển Khổng Tử"
  study_confucian_classics_outcome.110.desc: "Xuân Thu [ROOT.Char.Custom('GetRandomAnnalsPassage')], [ROOT.Char.Custom('GetRandomPoetryPassage')], [ROOT.Char.Custom('GetRandomRitesPassage')] — từng phần một, Ta nghiên cứu các kinh điển Khổng Tử, thu thập trí tuệ vượt thời gian từ các trang sách.\n\nNếu Ta muốn làm một quan công minh, Ta phải đi theo con đường mà [Glossary( 'Kǒngzǐ', 'CONFUCIUS_GLOSS' )] đã đặt. Đây là những lời mà Ta phải khắc sâu vào trí nhớ."
  study_confucian_classics_outcome.110.a: "Ta phải học, bất kể chi phí."
  study_confucian_classics_outcome.110.b: "Ta sẽ từ từ tìm hiểu."
 
  study_confucian_classics_outcome.120.t: "$study_confucian_classics_title$Đọc Xuân Thu"
  study_confucian_classics_outcome.120.desc: "Trước khi cai quản đất đai, Ta phải cai quản bàn giấy của mình. Xuân Thu [ROOT.Char.Custom('GetRandomAnnalsPassage')] mở ra trước mắt — tác phẩm uyên thâm, nền tảng cho quyền lực chính đáng. Qua từng lời, Ta sẽ tăng cường kiến thức và theo dấu chân của [Glossary( 'Kǒngzǐ', 'CONFUCIUS_GLOSS' )].\n\nChỉ bằng kỷ luật Ta mới thành công."
  study_confucian_classics_outcome.120.a: "Ta sẽ đọc kỹ để tìm ra chân lý ẩn giấu."
  study_confucian_classics_outcome.120.b: "Ba chén trà, không ngủ cho tới khi lật hết trang."
  study_confucian_classics_outcome.120.c: "Trí tuệ đến với [ROOT.Char.GetSheHe] người kiên nhẫn."
  confucian_xp_high_tt: "Ngài tiến bộ đáng kể trong nghiên cứu Khổng Tử"
  confucian_xp_low_tt: "Ngài tiến bộ một chút trong nghiên cứu Khổng Tử"
 
  study_confucian_classics_outcome.130.t: "$study_confucian_classics_title$Nhìn Nhận về Học Hành"
  study_confucian_classics_outcome.130.desc: "Tại sao ta không thể hiểu các văn bản? Tại sao ta không thể nắm bắt ý nghĩa tinh tế của chúng? Ta thực sự #EMP bất tài đến thế này #! sao? Ta đặt cây bút xuống và tựa nhẹ trán vào bàn.\n\n"Con mang trà đến cho người," [servant.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', servant)] của ta, nói khi [servant.GetSheHe] bước vào phòng làm việc. "Đó có phải là #EMP [ROOT.Char.Custom('GetRandomRitesPassage')]#! không? Con có những kỷ niệm đẹp về bài đó... Con có thể đọc cùng người một lúc không?"\n\nTa nhìn lên. Có lẽ một bàn tay giúp đỡ chính là điều ta cần."
  study_confucian_classics_outcome.130.a: "Xin hãy giúp Ta hiểu chúng."
  study_confucian_classics_outcome.130.b: "Có lẽ chúng ta nên ra ngoài uống một chút?"
 
  study_confucian_classics_outcome.140.t: "$study_confucian_classics_title$Nghệ Thuật Ngoại Giao"
  study_confucian_classics_outcome.140.desc: "Ta khép Luận Ngữ với một tiếng thở dài. [Glossary( 'Master Kong', 'CONFUCIUS_GLOSS' )] nói về hài hòa — thể hiện đức hạnh qua chính trực, không tâng bốc. Thế nhưng [ROOT.Char.Custom2('RelationToMeShort', diplomatic_vassal)], [diplomatic_vassal.GetTitledFirstName], lại đạt được hòa bình bằng nụ cười và một ly chúc mừng.\n\nTa tự hỏi... liệu đó cũng là Con Đường?"
  study_confucian_classics_outcome.140.a: "Ta nên học hỏi từ [diplomatic_vassal.GetHerHim]."
  study_confucian_classics_outcome.140.b: "Không, Ta sẽ tìm giá trị theo cách khác."
  relation_servant_of_china_female: "đồng hương hầu hạ của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier]"
  relation_servant_of_china_male: "đồng hương hầu hạ của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier]"
 
  study_confucian_classics_outcome.150.t: "$study_confucian_classics_title$Hiểu Đất"
  study_confucian_classics_outcome.150.desc: "\"Đi cùng Ta,\" [ROOT.Char.Custom2('RelationToMeShort', servant)], [servant.GetFirstName], nói, vẫy Ta ra ngoài. \"Hãy quan sát [location_province.Custom('GetTerrainTypePlural')] của [location_province.GetName].\"\n\n\"Ghi chú các gò đống, địa hình dốc, thung lũng, đồng bằng và đầm lầy — mỗi loại quyết định cách sử dụng đất tốt nhất. Đó là trí tuệ của #EMP Lễ Kinh#!\""
  study_confucian_classics_outcome.150.a: "Rất thấm thía."
  study_confucian_classics_outcome.150.b: "À, một chuyến đi sẽ làm sáng tỏ tâm trí Ta."
 
  study_confucian_classics_outcome.160.t: "$study_confucian_classics_title$Công Việc Xuất Sắc"
  study_confucian_classics_outcome.160.desc: "Ta đã nghiền ngẫm [ROOT.Char.Custom('GetRandomPoetryPassage')], [ROOT.Char.Custom('GetRandomRitesPassage')], và Xuân Thu [ROOT.Char.Custom('GetRandomAnnalsPassage')] — trí óc Ta sắc bén, kỹ năng tinh luyện, và Ta cảm thấy sẵn sàng chứng minh công đức.\n\nCó lẽ Ta nên giúp các quan huyện địa phương xem lại các vụ án cũ, khảo sát tình trạng các cây cầu địa phương,"
  study_confucian_classics_outcome.160.desc_own_elder: "hoặc soạn một báo cáo chính thức cho trưởng bối của Ta, [higher_merit_vassal.GetTitledFirstName]."
  study_confucian_classics_outcome.160.desc_other_elder: "hoặc soạn một báo cáo chính thức cho [higher_merit_vassal.GetTitledFirstName], một trưởng bối nổi tiếng và uy tín."
  study_confucian_classics_outcome.160.a: "Nếu Ta phục vụ [higher_merit_vassal.GetFirstNameNoTooltip] tốt, danh tiếng về công đức của Ta sẽ lan xa."
  study_confucian_classics_outcome.160.b: "Một khảo sát đúng mực nói nhiều hơn bất kỳ lời khoe khoang nào."
  study_confucian_classics_outcome.160.c: "Ta sẽ giúp các quan huyện."
  merit_gain_high_tt: "Công Đức Tăng Cao"
  merit_gain_low_tt: "Công Đức Tăng Nhẹ"
  because_of_your_diplomacy: "Nhờ [diplomacy_i][diplomacy|E] của Ngài:"
  because_of_your_stewardship: "Nhờ [stewardship_i][stewardship|E] của Ngài:"
  because_of_your_learning: "Nhờ [learning_i][learning|E] của Ngài:"
 
  study_confucian_classics_outcome.170.t: "$study_confucian_classics_title$Ảnh Hưởng Của Trưởng Bối"
  study_confucian_classics_outcome.170.desc: "\"Một cuộn thư mang dấu triện của trưởng bối, [elder.GetTitledFirstName], vừa đến,\" [ROOT.Char.Custom2('RelationToMeShort', letterman)], [letterman.GetFirstName], nói, trao cho Ta. \"Ta tin rằng đây là tin tốt!\"\n\nTa cẩn thận mở cuộn thư.\n\n\"Gửi học trò [ROOT.Char.Custom('ComplimentAdjective')] nhất của ta — nét bút vững, tấm lòng ngay thẳng, tâm trí kiên cường của ngươi không bị bỏ qua. Danh tiếng về hành vi của ngươi đã tới tai các thư ký và quan huyện. Công đức của ngươi đã được biết đến.\""
  study_confucian_classics_outcome.170.a: "Ta sẽ soạn một bức thư tạ ơn."
  study_confucian_classics_outcome.170.b: "Có lẽ có thể thuyết phục [elder.GetSheHe] tác động thêm một chút?"
  study_confucian_classics_outcome.170.c: "Ta vui quá, Ta có thể rót cho ngài mười chén trà!"
 
  study_confucian_classics_outcome.180.t: "$study_confucian_classics_title$Nhẹ Nhõm"
  study_confucian_classics_outcome.180.desc: "Ta đã làm được. Ta hoàn thành toàn bộ #EMP Lễ Kinh#! — và Ta thậm chí còn nhớ được trí tuệ của nó! Như thể một tấm màn đã được nhấc lên khỏi mắt Ta. Lần đầu tiên, Ta thấy con đường phía trước rõ ràng.\n\nVà suy nghĩ rằng... chẳng ai tin vào Ta. Ngay cả bản thân Ta cũng vậy.\n\nCó lẽ cuối cùng Ta thực sự sinh ra để làm nhiều điều hơn."
  study_confucian_classics_outcome.180.a: "Bây giờ, đọc gì tiếp theo đây..."
 
  study_confucian_classics_outcome.190.t: "$study_confucian_classics_title$Tận Dụng Ảnh Hưởng"
  study_confucian_classics_outcome.190.desc: "Một lời nói đúng lúc, một tặng phẩm thơ ca, sự ưu ái của một thầy đáng kính... cơ hội cho [Glossary( 'guānxi', 'GUANXI_GLOSS' )]. Ngay cả một chỗ ngồi tại buổi tụ họp thơ yên tĩnh cũng có thể mở ra con đường.\n\nTa làm việc chăm chỉ, nhưng các bậc hiền triết dạy rằng đức hạnh phải tỏa sáng để được biết đến."
  GUANXI_GLOSS: "Guānxi là một mạng lưới quan hệ cá nhân, những người tin tưởng lẫn nhau và trao đổi ân huệ. Nó được xây dựng trực tiếp qua trà, bữa ăn, hoặc khi giúp đỡ, và thường quan trọng hơn các quy tắc chính thức."
  study_confucian_classics_outcome.190.a: "Ta sẽ đảm bảo các quan huyện nghe danh Ta."
  study_confucian_classics_outcome.190.b: "Ta sẽ nhờ các học giả chia sẻ ghi chú của họ."
  study_confucian_classics_outcome.190.c: "Những câu thơ tuyệt hảo phải được nghe, Ta sẽ học cùng những người giỏi nhất."
  study_confucian_classics_outcome.190.d: "Công đức của Ta tự nó đã đủ."
  tgp_known_by_magistrates_modifier: "Nổi Tiếng Với Quan Huyện"
  tgp_known_by_magistrates_modifier_desc: "Nhân vật này nổi tiếng với các quan huyện địa phương."
  tgp_assisted_by_scholars_modifier: "Được Các Học Giả Địa Phương Hỗ Trợ"
  tgp_assisted_by_scholars_modifier_desc: "Một nhóm học giả địa phương đang hỗ trợ nhân vật này."
  tgp_known_by_poets_modifier: "Nổi Tiếng Với Thi Nhân"
  tgp_known_by_poets_modifier_desc: "Nhân vật này nổi tiếng với các thi nhân địa phương."
 
  study_confucian_classics_outcome.1000.t: "$study_confucian_classics_title$Nuôi Dạy Nghiêm Khắc"
  study_confucian_classics_outcome.1000.desc: ""Tại sao con không học hành chăm chỉ hơn? Con làm nhục gia tộc [ROOT.Char.GetHouse.GetName]!" [parent.GetMotherFather] của ta vung tay lên trong cơn giận dữ. "Những lời bào chữa của con chẳng đáng giá bằng bụi bặm trên bàn học."\n\n"Nếu con không học, con sẽ kết thúc công việc trong kho hàng trong sự nhục nhã.""
  study_confucian_classics_outcome.1000.a: "Ta không được làm phụ lòng [parent.GetMotherFather]."
  study_confucian_classics_outcome.1000.b: "Ta sẽ chẳng làm nên trò trống gì."
  study_confucian_classics_outcome.1000.c: "Xin tha thứ, Ta cần nghỉ một chút."
  tgp_gave_up_modifier: "Bỏ Cuộc"
  tgp_gave_up_modifier_desc: "Nhân vật [GetTrait('burdened').GetName( GetNullCharacter )] này đã hoàn toàn bỏ cuộc."
  tgp_study_harder_modifier: "Học Nhiều Hơn"
  tgp_study_harder_modifier_desc: "Cha mẹ của nhân vật này đã thúc đẩy họ học chăm hơn.\n[GetScheme('study_confucian_classics').GetTypeName] [success_chance|E]: #P +10%#!"
  never_study_again_tt: "Ngài sẽ không bao giờ có thể [GetScheme('study_confucian_classics').GetTypeName] nữa"
  dishonor_opinion: "Mất Danh Dự"
  honorable_opinion: "Đáng Kính"
  satisfied_opinion: "Hài Lòng"
 
  study_confucian_classics_outcome.1010.t: "$study_confucian_classics_title$Chỉ Dẫn Của Trưởng Bối"
  study_confucian_classics_outcome.1010.desc: "Việc học của Ta không tiến triển tốt... Xuân Thu [ROOT.Char.Custom('GetRandomAnnalsPassage')] đọc dở đang chờ Ta, nhưng tâm trí Ta khao khát thêm một chén trà. Khi Ta rót trà, Ta nhận thấy một cuộn thư từ trưởng bối, [elder.GetTitledFirstName].\n\nNó viết: \"Học trò thân mến, ta nghe việc học của con chậm chạp. Đính kèm là suy nghĩ của ta về Luận Ngữ, cùng một vài ghi chú có thể giúp con.\"\n\nKhao khát học hỏi lại trỗi dậy!"
  study_confucian_classics_outcome.1010.a: "Với sự giúp đỡ của [elder.GetHerHis], Ta sẽ học chăm như chưa từng học trước đây!"
  study_confucian_classics_outcome.1010.b: "Cuộn thư sẽ rất hữu ích."
  artifact_elder_text_name: "Những Suy Ngẫm Của [elder.GetFirstNamePossessiveNoTooltip]"
  artifact_elder_text_description: "Tập hợp các suy nghĩ và ghi chú tỉ mỉ của [elder.GetTitledFirstName], nhằm giúp học trò của [elder.GetHerHis], [owner.GetFirstName]."
  tgp_motivated_elder_study_modifier: "Hỗ Trợ Từ Trưởng Bối"
 
  study_confucian_classics_outcome.1020.t: "$study_confucian_classics_title$Tập Trung Hơn"
  study_confucian_classics_outcome.1020.desc: "Điều này không hiệu quả. Ta dường như không hoàn thành được gì. Nơi học của Ta hoang vắng, sách chưa đọc chất đống như buộc tội một tên cướp, và các cuộn thư vung vãi trên sàn như lá cây khô.\n\nNhưng Ta #EMP biết#! Ta có thể làm được.\n\nTa. Chỉ. Cần. Tập. Trung."
  study_confucian_classics_outcome.1020.a: "Không còn lý do nữa. Ta sẽ tiếp tục!"
  study_confucian_classics_outcome.1020.b: "Một chút [ROOT.Char.Custom('RegionalAlcoholicDrink')] sẽ giúp Ta qua cơn..."
  study_confucian_classics_outcome.1020.c: "Hít thở, và bắt đầu lại."
  tgp_double_down_on_studies_modifier: "Tập Trung Cao Độ"
 
  study_confucian_classics_outcome.1030.t: "$study_confucian_classics_title$Sự Trợ Giúp Thần Thánh"
  study_confucian_classics_outcome.1030.desc: "Việc học của Ta không tiến triển. Có lẽ Ta không cần thêm cuộn thư... mà là sự chỉ dẫn từ [ROOT.Char.GetFaith.KnowledgeGodName]. Ta bước vào đền địa phương, quỳ trước bàn thờ, chắp tay cầu nguyện.\n\n\"Ngươi tìm kiếm sự hiểu biết, [priest.Custom2('RelationToMeShort', owner)] của ta?\" [ROOT.Char.Custom2('RelationToMeShort', priest)], [priest.GetFirstName], thì thầm, bước ra từ bóng tối. \"Nếu ngươi dâng một lễ vật nhỏ, hoặc giúp việc quanh đền, ta có thể hỗ trợ.\""
  study_confucian_classics_outcome.1030.a: "Ta có thể dâng một lễ vật tượng trưng."
  study_confucian_classics_outcome.1030.b: "Đôi tay Ta sẵn sàng phục vụ."
  study_confucian_classics_outcome.1030.c: "Ta chỉ tin vào [ROOT.Char.GetFaith.KnowledgeGodName]."
  tgp_divine_favor_modifier: "Được Ưa Thần"
 
  study_confucian_classics_outcome.1040.t: "$study_confucian_classics_title$Người Đồng Hành Hỗ Trợ"
  study_confucian_classics_outcome.1040.desc: "Quá nhiều rồi, Ta không hiểu được #EMP [ROOT.Char.Custom('GetRandomRitesPassage')]#!. Tất cả ghi chép của Ta đều sai! Vô dụng!\n\n\"[partner.Custom('LoverPetName')|U], việc học của ngươi có khó khăn không?\" [ROOT.Char.Custom2('RelationToMeShort', partner)], [partner.GetFirstName], hỏi nhẹ nhàng, mang khay bánh trà. \"Tại sao không để ta tham gia cùng ngươi? Không gì là không thể nếu chúng ta chung sức! À, và hãy ăn một chiếc bánh, ta làm cho ngươi.\""
  study_confucian_classics_outcome.1040.a: "Xin hãy mang mực và giấy trắng cho Ta."
  study_confucian_classics_outcome.1040.b: "Sự hỗ trợ của ngươi là tất cả với Ta."
  study_confucian_classics_outcome.1040.c: "Tất cả những gì Ta cần lúc này là ngươi."
  tgp_servile_partner_modifier: "Người Đồng Hành Phục Vụ"
  tgp_assistant_partner_modifier: "Người Đồng Hành Hỗ Trợ"
