l_english:
  intrigue_scheme_lifestyle.1001.t:0 "Kỷ Luật và Trung Thành"
  intrigue_scheme_lifestyle.1001.desc:0 "Biết cách binh lính hành xử với nhau, và nhận thấy thông tin cùng tin đồn lan truyền tự do thế nào, Ta chợt nảy ra một ý tưởng.\n\nNếu một số binh lính của Ta thâm nhập vào quân đội của [target.GetTitledFirstNamePossessive], họ có thể cung cấp một góc nhìn khác về kế hoạch của [target.GetHerHis]."
  intrigue_scheme_lifestyle.1001.a:0 "Đến lúc [target.GetFirstNameNoTooltip] cần thêm lính mới rồi."
  intrigue_scheme_lifestyle.1001.a.tt:0 "#F Tin đồn lan nhanh giữa các binh lính... Ta có thể học hỏi được nhiều, miễn là các điệp viên của Ta không gặp rắc rối.#!\n"
  intrigue_scheme_lifestyle.1001.b:0 "Không, quá mạo hiểm."
  intrigue_scheme_lifestyle.1001.b.tt:0 "#F Ta sẽ không mạo hiểm với lòng trung thành thực sự của một binh lính bình thường.#!\n"

  intrigue_scheme_lifestyle.1002.t:0 "Kỷ Luật và Trung Thành"
  intrigue_scheme_lifestyle.1002.desc:1 "Ta vừa nhận được tin rằng những binh lính Ta cử đi thâm nhập quân đội của [target.GetTitledFirstNamePossessive] đã bị lộ! Ai biết họ đang chịu hình phạt gì — hoặc tệ hơn, bị tra khảo! — ngay lúc này."
  intrigue_scheme_lifestyle.1002.a:0 "Họ tốt hơn là không tiết lộ bất kỳ kế hoạch nào của Ta!"

  intrigue_scheme_lifestyle.3001.t:0 "Thói Quen Hàng Ngày"
  intrigue_scheme_lifestyle.3001.desc_agents:0 "Các điệp viên của Ta nhận thấy rằng [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))], [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName], dường như có những thói quen khá đều đặn.\n\nNếu những thói quen này được quan sát, chúng cũng có thể là chìa khóa dẫn đến đột phá..."
  intrigue_scheme_lifestyle.3001.desc:0 "Ta nhận ra rằng [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))], [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName], giữ một lịch trình khá đều đặn. Nếu những thói quen này được quan sát, chúng cũng có thể là chìa khóa dẫn đến đột phá..."
  intrigue_scheme_lifestyle.3001.a:0 "Ta sẽ tự mình nghiên cứu thói quen của họ."
  intrigue_scheme_lifestyle.3001.a_agent:0 "Ta muốn có người theo dõi [target.GetHerHim] mọi lúc!"
  intrigue_scheme_lifestyle.3001.a.tt:0 "#F Dĩ nhiên đây là một công việc mạo hiểm...#!"
  intrigue_scheme_lifestyle.3001.b:0 "Quá mạo hiểm."
  intrigue_scheme_lifestyle.3001.b.tt:0 "#F [target.GetSheHe|U] có thể nhận ra rằng mình đang bị theo dõi!#!"

  intrigue_scheme_lifestyle.3101.t:0 "Nắm Thông Tin Tường Tận"
  intrigue_scheme_lifestyle.3101.desc:0 "Nhân viên phục vụ trong một triều đình thường bị bỏ qua vì họ nghe lén được các cuộc trò chuyện, dọn dẹp, di chuyển không ai để ý trong hành lang...\n\nĐiều này cũng đúng với triều đình [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] [target.GetTitledFirstNamePossessive], tạo ra một cơ hội."
  intrigue_scheme_lifestyle.3101.a:0 "Một số người sẽ bị thuyết phục để tiết lộ thông tin cho điệp viên của Ta."
  intrigue_scheme_lifestyle.3101.a.tt:0 "#F Những người cung cấp thông tin có thể cho Ta thông tin vô giá, nhưng họ cũng là người mới với mọi rủi ro đi kèm...#!"
  intrigue_scheme_lifestyle.3101.b:0 "Rủi ro quá lớn!"
  intrigue_scheme_lifestyle.3101.b.tt:0 "#F Ta không thể đặt niềm tin vào những người như vậy!#!"

  intrigue_scheme_lifestyle.3102.desc:0 "Nhân viên phục vụ cung cấp thông tin cho điệp viên của Ta về [target.GetTitledFirstName] đã bị phát hiện!"
  intrigue_scheme_lifestyle.3102.a:0 "Tốt hơn là họ giữ im lặng!"

  intrigue_scheme_lifestyle.3201.t:0 "Giao Tiếp"
  intrigue_scheme_lifestyle.3201.desc_animal:0 "Thật may mắn! Những chim đưa tin của [target.GetTitledFirstNamePossessive] lại thích loại hạt có trong vườn của Ta, và chúng ở lại đủ lâu để Ta đọc các thông điệp!"
  intrigue_scheme_lifestyle.3201.elope.desc:0 "Thật may mắn! Các đặc vụ của ta đã tìm ra một lối vào phòng làm việc nơi [target.GetLiege.Custom2('NamePossessiveCharacterIntroduction', target )] cất giữ những bức thư đã soạn thảo của hắn. Tất cả các tin nhắn [target.GetLiege.GetHerHis] của hắn giờ đây là của ta để đọc! "
  intrigue_scheme_lifestyle.3201.desc:1 "Thật may mắn! Các đặc vụ của ta đã tìm ra lối vào phòng làm việc nơi [target.GetTitledFirstName] cất giữ những bức thư đã soạn thảo. Tất cả các tin nhắn [target.GetHerHis] của hắn giờ đây là của ta để đọc!"

  intrigue_scheme_lifestyle.3201.a:0 "Hãy biến đây thành việc thường xuyên!"
  intrigue_scheme_lifestyle.3201.b:1 "Ta đã khiến các người đưa tin của [target.GetHerHis] ăn theo tay Ta."
  intrigue_scheme_lifestyle.3201.b.tt:1 "Tùy chọn này có sẵn nhờ vào $modifier_hunt_friend_of_animal$ Modifier"
  intrigue_scheme_lifestyle.3201.c:0 "Chỉ là một sự may mắn tình cờ, không hơn."

  intrigue_scheme_lifestyle.3301.t:0 "Một Con Đường Khác"
  intrigue_scheme_lifestyle.3301.desc_murder:0 "Các điệp viên của Ta nhận thấy [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName] phản ứng lạ mỗi khi nhắc tới [target.GetHerHis] [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_target'))] [secret_to_reveal_target.GetTitledFirstName]..."
  intrigue_scheme_lifestyle.3301.desc_lover:0 "Các điệp viên của Ta nhận thấy [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName] dành rất nhiều thời gian một mình với [target.GetHerHis] [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_target'))] [secret_to_reveal_target.GetTitledFirstName]..."
  intrigue_scheme_lifestyle.3301.desc_pregnancy:0 "Các điệp viên của Ta nhận thấy [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName] dường như rất lo lắng về sức khỏe của [target.GetHerHis] [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_target'))] [secret_to_reveal_target.GetTitledFirstName]..."
  intrigue_scheme_lifestyle.3301.desc_child:0 "Các điệp viên của Ta nhận thấy [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName] tham gia rất nhiều vào đời sống của [target.GetHerHis] [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_target'))] [secret_to_reveal_target.GetTitledFirstName]..."
  intrigue_scheme_lifestyle.3301.desc_fallback:0 "Các điệp viên của Ta nhận thấy [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName] cư xử lạ xung quanh [target.GetHerHis] [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_target'))] [secret_to_reveal_target.GetTitledFirstName]."
  intrigue_scheme_lifestyle.3301.desc_end:0 "\n\nĐiều tra thêm sẽ có nghĩa là tạm gác các kế hoạch đen tối của Ta đối với [target.GetTitleTierName], nhưng Ta phải thừa nhận là sự tò mò của Ta bị kích thích!"
  intrigue_scheme_lifestyle.3301.a:0 "Nếu [target.GetSheHe] đang giấu điều gì, Ta phải biết!"
  intrigue_scheme_lifestyle.3301.b:0 "Ta sẽ tập trung vào mục tiêu của mình."
  intrigue_scheme_lifestyle.3301.b.tt:0 "#F Chính xác chết người!#!"

  intrigue_scheme_lifestyle.3302.t:0 "Bí Mật Của [target.GetTitleAsNamePossessiveNoTooltip]"
  intrigue_scheme_lifestyle.3302.desc_murder:0 "Các điệp viên của Ta nhận thấy một dấu hiệu này đến dấu hiệu khác, và chẳng mấy chốc bức tranh được hé lộ. [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('target'))] [target.GetTitledFirstName] đã giết [target.GetHerHis] [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_target'))] [secret_to_reveal_target.GetTitledFirstName]!"
  intrigue_scheme_lifestyle.3302.desc_lover:0 "Các điệp viên của Ta nhận thấy một dấu hiệu này đến dấu hiệu khác, và không lâu sau bức tranh hé lộ: [secret_to_reveal_target.GetTitledFirstName] là tình nhân của [target.GetTitledFirstName]!"
  intrigue_scheme_lifestyle.3302.desc_pregnancy:0 "Các đặc vụ của ta nhận thấy một sự tò mò — một dấu hiệu — hết cái này đến cái khác, và không mất nhiều thời gian trước khi bức tranh tự hé lộ: [secret_to_reveal_target.GetTitledFirstName] đang mang thai đứa con của [target.GetTitledFirstNamePossessive]!"
  intrigue_scheme_lifestyle.3302.desc_child:0 "Các điệp viên của Ta nhận thấy một dấu hiệu này đến dấu hiệu khác, và không lâu sau bức tranh hé lộ: [secret_to_reveal_target.GetTitledFirstName] là con của [target.GetTitledFirstName] và [target.GetHerHis] [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_owner'))] [secret_to_reveal_owner.GetTitledFirstName]!"
  intrigue_scheme_lifestyle.3302.desc_fallback:0 "Các điệp viên của Ta nhận thấy một dấu hiệu này đến dấu hiệu khác, và không lâu sau bức tranh hé lộ: [target.GetTitledFirstName] thực sự có điều gì đó giấu!"
  intrigue_scheme_lifestyle.3302.a:0 "Ồ, điều này hay đây!"
  intrigue_scheme_lifestyle.3302.a.tt:0 "#F Ta có thể tống tiền [target.GetHerHim], hoặc buộc [target.GetHerHim] làm theo ý Ta, hoặc #EMP bất cứ điều gì#!!#!"

  intrigue_scheme_lifestyle.3401.t:0 "Một Lối Vào"
  intrigue_scheme_lifestyle.3401.desc:1 "[target.GetTitledFirstNamePossessive] [target.Custom2('RelationToMe', SCOPE.sC('courtier_to_fool'))] [courtier_to_fool.GetTitledFirstName] là một [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('courtier_to_fool'))] [courtier_to_fool.GetWomanMan], và khi Ta tìm thấy mình ở bên cạnh [courtier_to_fool.GetHerHis], ban đầu Ta còn cảnh giác. Tuy nhiên, Ta sớm nhận ra rằng [courtier_to_fool.GetSheHe] không ghét Ta như Ta nghĩ..."
  intrigue_scheme_lifestyle.3401.a:0 "Làm ơn,  Bạn củaTa, hãy kể cho Ta về bản thân!"
  intrigue_scheme_lifestyle.3401.a.tt:0 "#F Ta là sói đội lốt cừu, đang tiếp cận con mồi...!#!"
  intrigue_scheme_lifestyle.3401.b:1 "Vấn đề này chỉ giữa Ta và [target.GetFirstNameNoTooltip]."
