l_english:

  abduct_event_title:0 "Bắt Cóc:"
  do_not_execute_abduct_tooltip:0 "Ta sẽ không thử bắt cóc"

  abduct_outcome.1001.t:0 "$abduct_event_title$ Tấn Công Trên Đường"
  abduct_outcome.1001.opening:1 "Các đặc vụ của Ta báo rằng [target.GetTitledFirstName] đang di chuyển"
  abduct_outcome.1001.arrival:1 "từ [departure.GetNameNoTooltip] đến [arrival.GetNameNoTooltip]."
  abduct_outcome.1001.no_arrival:1 "trong [departure.GetNameNoTooltip]."
  abduct_outcome.1001.ending:0 "\n\nTa đã sắp xếp một nhóm cướp ngăn chặn chuyến đi nhỏ của [target.GetHerHis] và đảm bảo rằng [target.GetSheHe] sẽ đến đây thay vào đó."
  abduct_outcome.1001.a:0 "Chẳng mấy chốc [target.GetSheHe] sẽ chịu khuất phục trước Ta!"
  abduct_outcome.1001.b:0 "Không, rủi ro quá lớn."

  abduct_outcome.1002.t:0 "$abduct_event_title$ Đang Diễn Ra"
  abduct_outcome.1002.desc:2 "Một cơ hội hoàn hảo xuất hiện! [target.GetTitledFirstName] đang di chuyển từ [departure.GetNameNoTooltip] đến [arrival.GetNameNoTooltip], gần như không có lính bảo vệ.\n\n[target.GetSheHe|U] chắc hẳn nghĩ rằng [target.GetHerselfHimself] an toàn..."
  abduct_outcome.1002.a:0 "Thời điểm tuyệt vời để tấn công!"

  abduct_outcome.1003.t:0 "$abduct_event_title$ Khách Không Mời"
  abduct_outcome.1003.desc:0 "Khi các đặc vụ của Ta ra vào tự do tại triều đình ở [court_location.GetNameNoTierNoTooltip], [target.GetTitledFirstName] trong tầm tay!\n\nCác đặc vụ đã sẵn sàng để đưa một nhóm nhỏ người vào giữa đêm, và che chắn cho họ khi rút đi mà không bị phát hiện. Lý tưởng là vừa bịt miệng túi có người đang đạp."
  abduct_outcome.1003.a:0 "Ta thích kế hoạch này!"

  abduct_outcome.2001.desc:0 "Thành công! Nhóm cướp hoàn thành xuất sắc nhiệm vụ, và [target.GetTitledFirstName] đã an toàn trong tay Ta."
  abduct_outcome.2001.a:0 "Hy vọng [target.GetSheHe] thích chỗ ở mới của [target.GetHerHis]..."

  abduct_outcome.2002.desc:0 "Trước khi [target.GetTitledFirstName] biết chuyện gì đang xảy ra, các đặc vụ của Ta đã chộp được [target.GetHerHim]! [target.GetSheHe|U] cuối cùng đã nằm trong tay Ta."

  abduct_outcome.2003.desc:1 "Ta không thể tin là nó đã hiệu quả! Nó đơn giản như việc để một vài đồng minh của ta vào [target.Custom('ResidenceBuilding')] vào giữa đêm. \n\n[target.GetTitledFirstName] chắc chắn đang tự đá bản thân [target.GetHerselfHimself] vì an ninh kém. Rất may là nó tốt hơn nhiều ở nơi [target.GetSheHe] đang ở bây giờ."

  abduct_outcome.4001.opening:0 "Nguyền rủa thật! [target.GetTitledFirstName] đã trốn thoát khỏi đám cướp ta thuê, và an toàn trở về [departure.GetBaronyNameExplicitly]."
  abduct_outcome.4001.owner_discovered:0 "\n\nThảm họa thay, một tên cướp sau đó bị bắt và khai hết mọi chuyện, kể cả sự liên quan của Ta!"
  abduct_outcome.4001.owner_secret:0 "\n\nÍt nhất sẽ không ai biết rằng nhóm cướp đang làm việc cho Ta."
  abduct_outcome.4001.a:1 "Ta sẽ tìm cách khác để xử lý [target.GetHerHim]."
  abduct_outcome.4001.b:0 "Sự may mắn của [target.GetHerHis|U] sẽ không kéo dài. Phải thử lại thôi!"

  abduct_outcome.4002.opening:0 "Chuyện này sao có thể xảy ra?! Các đặc vụ của Ta chờ đúng thời điểm, đúng địa điểm, nhưng [target.GetTitledFirstName] không xuất hiện!"
  abduct_outcome.4002.owner_discovered:0 "\n\nCó vẻ [target.GetSheHe|U] đã ngửi thấy kế hoạch của Ta!"
  abduct_outcome.4002.owner_secret:0 "\n\n[target.GetSheHe|U] chắc chắn đã biết có chuyện gì, nhưng ít nhất [target.GetSheHe] sẽ không bao giờ biết Ta liên quan."

  abduct_outcome.4003.opening:0 "Không! Đồng minh của Ta bị phát hiện khi cố xâm nhập phòng [target.GetTitledFirstNamePossessive]. Lẽ ra Ta phải biết không dễ vậy."
  abduct_outcome.4003.owner_discovered:0 "\n\nĐiều tệ hơn, họ khai ra và tiết lộ sự tham gia của Ta trong âm mưu!"
  abduct_outcome.4003.owner_secret:0 "\n\nBằng một phép màu, đồng minh Ta thoát được, và Ta vẫn ẩn danh."

  abduct_outcome.5001.t:0 "Bị Bắt Cóc!"
  abduct_outcome.5001.opening:0 "Ta đã bị [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] bắt cóc!"
  abduct_outcome.5001.seized_roadside:0 "\n\nTa đang đi cùng đoàn hộ vệ thì bị nhóm cướp chặn. Ta không biết chuyện gì xảy ra với những người khác, vì bị trùm túi lên đầu. Khi túi được gỡ ra, Ta thấy mình là tù nhân ở [prison_location.GetBaronyNameExplicitly]."
  abduct_outcome.5001.on_the_way:0 "\n\nTa đang trên đường đến thị trấn với chỉ vài lính hộ tống, và [owner.GetSheHe] biết lúc nào tấn công khi Ta yếu nhất!"
  abduct_outcome.5001.unwelcome_guests:1 "\n\nMột nhóm người lạ xông vào phòng Ta giữa đêm. Kẻ phản bội phải đã mở cửa [ROOT.Char.Custom('ResidenceBuilding')], và Ta tưởng chết rồi. Tuy nhiên, họ trùm túi lên đầu Ta và kéo đi. Bị trói, Ta được đưa đến hầm tối ẩm này."
  abduct_outcome.5001.a:0 "Chờ đến khi Ta ra khỏi đây!"

  abduct_outcome.5002.t:0 "Ngăn Chặn Bắt Cóc!"
  abduct_outcome.5002.seized_roadside:0 "Ta đang đi ở [departure.GetBaronyNameExplicitly] khi một nhóm cướp lao xuống.\n\nTa may mắn thoát thân, vì rõ ràng nhóm cướp không muốn làm hại Ta. Thay vào đó họ muốn bắt sống Ta!"
  abduct_outcome.5002.on_the_way:1 "Ta đang đi đến thị trấn với vài lính hộ tống khi họ tấn công.\n\nMay thay những người đi cùng đã hành động nhanh và dũng cảm, và Ta sớm an toàn trở lại [target.Custom('ResidenceBuilding')]."
  abduct_outcome.5002.unwelcome_guests:1 "Một tiếng ồn giữa đêm đánh thức Ta. Một nhóm côn đồ đã được thả vào [ROOT.Char.Custom('ResidenceBuilding')], chỉ bị phát hiện khi tới cửa phòng Ta!"
  abduct_outcome.5002.fallback:0 "Ta đã thoát khỏi một lần bắt cóc!"
  abduct_outcome.5002.owner_known:0 "\n\nChắc chắn đây là việc của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))], [owner.GetTitledFirstName]!"
  abduct_outcome.5002.owner_not_known:0 "\n\nTa không biết ai đứng sau vụ bắt cóc này, nhưng họ vẫn còn ngoài kia..."
  abduct_outcome.5002.a:0 "Ồ, [owner.GetSheHe] sẽ trả giá!"
  abduct_outcome.5002.b:0 "Ta phải cảnh giác."
