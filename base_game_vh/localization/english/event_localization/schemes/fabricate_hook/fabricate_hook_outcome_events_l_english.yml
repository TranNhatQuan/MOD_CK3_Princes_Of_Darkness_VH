l_english:
  fabricate_hook_header:0 "Bày Mưu Gài Bẫy:"
  fabricate_hook_hook_gained_on_you:0 "@warning_icon [owner.GetShortUIName] đã tạo ra một [hook|E] trên Ngài!"

  fabricate_hook_outcome.0001.t:1 "$fabricate_hook_header$ Một Bí Mật"
  fabricate_hook_outcome.0001.desc:0 "[target.GetTitledFirstName] dường như đang giấu điều gì đó. May cho ta, ta không cần quá sáng tạo để nắm giữ [target.GetHerHim] trong tay."
  fabricate_hook_outcome.0001.a:0 "Tất cả những gì ta cần làm là cho [target.GetHerHim] biết ta biết gì..."
  fabricate_hook_outcome.0001.b:0 "Ta sẽ giữ bí mật này cho riêng mình trước."
  fabricate_hook_outcome.0001.c:0 "Ôi, đây là điều mà mọi người nên biết!"

  fabricate_hook_outcome.1001.t:1 "$fabricate_hook_header$ Một Tình Huống Bẽ Mặt"
  fabricate_hook_outcome.1001.desc:0 "Ai cũng có lúc phải cởi truồng #EMP mà thôi.#! Khó khăn là đảm bảo đoàn nghệ sĩ xiếc bước vào phòng của [target.GetTitledFirstNamePossessive] đúng lúc, và có đủ người hầu để bàn tán về hỗn loạn sắp tới.\n\nTa nghi ngờ [target.GetFirstNameNoTooltip] sẽ làm mọi cách để ngăn ta thêu dệt những lời đồn này…"
  fabricate_hook_outcome.1001.a:0 "Cho những nghệ sĩ vào!"
  fabricate_hook_outcome.1001.a.flavor:0 "Ôi, lại phải nói chuyện với các xiếc viên. Lại nữa."
  fabricate_hook_outcome.1001.b:0 "Ta nên suy nghĩ cẩn thận hơn về việc này."
  fabricate_hook_outcome.1001.c:0 "Tất cả chuyện này hẳn là một sai lầm lớn."

  fabricate_hook_outcome.1002.t:1 "$fabricate_hook_header$ Một Bức Thư Đáng Ngờ"
  fabricate_hook_outcome.1002.desc:1 "Bằng cách chặn một sứ giả từ triều đình của [target.GetTitledFirstName], một cơ hội đã mở ra.\n\n"
  fabricate_hook_outcome.1002.desc.vassals:0 "Bằng cách sao chép con dấu của [target.GetTitleAsNamePossessive], ta có thể tạo ra một lá thư đe dọa tăng thuế và phát tán tới các chư hầu của [target.GetHerHis]. Hoặc ít nhất là đe dọa…"
  fabricate_hook_outcome.1002.desc.no_vassals:0 "Bằng cách sao chép con dấu của [target.GetTitleAsNamePossessive], ta có thể tạo ra một lá thư đe dọa tăng thuế và phát tán tới các quan lại của [target.GetHerHis]. Hoặc ít nhất là đe dọa…"
  fabricate_hook_outcome.1002.a:0 ""Đây #EMP là#! chữ ký của ngươi, phải không?""

  fabricate_hook_outcome.1003.t:1 "$fabricate_hook_header$ Một Cuộc Giải Cứu Táo Bạo"
  fabricate_hook_outcome.1003.desc:0 "Sẽ thật tuyệt nếu [target.GetTitledFirstName] nợ ta, không phải vì sợ hãi, mà vì biết ơn? Ví dụ, nếu ta cứu [target.GetHerHim] khỏi bọn cướp tàn ác khi [target.GetSheHe] đi du hành? Đúng vậy, bọn cướp tàn ác như những tên đang chờ trước cổng lâu đài lúc này?\n\nTa sẽ xông vào cùng vệ sĩ vào phút cuối, đuổi chúng đi và để [target.GetFirstNameNoTooltip] mang ơn ta cả đời."
  fabricate_hook_outcome.1003.a:0 "Quá đơn giản, mà lại thuyết phục."

  fabricate_hook_outcome.1004.t:1 "$fabricate_hook_header$ Lời Nói Xúc Phạm"
  fabricate_hook_outcome.1004.desc:0 "Ta đã bắt đầu một loạt những lời đồn ác ý nhắm vào [target.GetTitledFirstName]. Không lời nào là thật, và ai đó sẽ phải lên tiếng phản bác những lời nói dối này.\n\nCách nào tốt hơn để #EMP người đó#! khiến [target.GetFirstNameNoTooltip] mang ơn họ?"
  fabricate_hook_outcome.1004.a:0 "Ta phải đứng lên chống lại sự bất công này!"
  fabricate_hook_outcome.1004.a.flavor:0 "[ROOT.Char.GetFaith.PriestNeuter] của ta sẽ không thích việc này."
  fabricate_hook_outcome.1004.a.flavor_sacred_shadows:0 "[ROOT.Char.GetFaith.PriestNeuter] của ta chắc chắn sẽ thích thú với việc này!"

  fabricate_hook_outcome.1005.t:1 "$fabricate_hook_header$ Dã Man nhưng Hiệu Quả"
  fabricate_hook_outcome.1005.desc:0 "Giải pháp đơn giản thường là tốt nhất. Tại sao phải lo lắng về âm mưu và thao túng khi ta có thể ép buộc [target.GetTitledFirstName] làm theo ý mình?\n\nMột vài tay lực lưỡng và những lá thư đầy uy lực là đủ."
  fabricate_hook_outcome.1005.a:0 "Thư ký! Chúng ta có thư phải soạn!"
  fabricate_hook_outcome.1005.a.flavor:0 ""Nạn nhân thân mến của ta...""

  fabricate_hook_outcome.2001.t:1 "$fabricate_hook_header$ Mưu Kế Xảo Quyệt"
  fabricate_hook_outcome.2001.desc:0 "Thông qua những thủ đoạn xảo quyệt, [owner.GetTitledFirstName] đã tạo ra một tình huống để chiếm lợi thế với ta!\n\nTa lên án tất cả những dối trá này, nhưng gần như không còn lựa chọn nào khác ngoài việc tiếp tục theo đuổi."
  fabricate_hook_outcome.2001.a:0 "Ta nghĩ chuyện này hẳn là dưới tầm ngươi, [owner.GetFirstNameNoTooltip]."

  fabricate_hook_outcome.3001.t:1 "$fabricate_hook_header$ Mất Thế Thượng Phong"
  fabricate_hook_outcome.3001.desc:0 "[target.GetTitledFirstName] đã phát hiện ta đang cố gắng chiếm lợi thế với [target.GetHerHim] bằng cách không trung thực!\n\nTa phải làm gì đó để cứu vãn danh tiếng!"
  fabricate_hook_outcome.3001.a:0 "Điều này báo hiệu sự kết thúc nỗ lực của ta..."
