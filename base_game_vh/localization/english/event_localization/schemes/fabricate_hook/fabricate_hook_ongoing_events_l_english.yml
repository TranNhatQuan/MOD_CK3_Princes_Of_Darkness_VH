l_english:
  fabricate_hook_ongoing.0001.t:0 "$fabricate_hook_header$ Liên Lạc Gia Đình"
  fabricate_hook_ongoing.0001.desc:1 "[target.GetTitledFirstNamePossessive] [target.Custom2('RelationToMe', SCOPE.sC('family_member'))], [family_member.GetTitledFirstName], đã tỏ ra bất thường trong việc cởi mở. Ngay cả khi biết rằng ta có thể không hoàn toàn trong sáng với [target.GetFirstName], [family_member.GetSheHe] vẫn sẵn sàng trả lời các câu hỏi của ta."
  fabricate_hook_ongoing.0001.a:0 ""[target.GetSheHe] có điểm yếu nào mà ta nên biết không?""
  fabricate_hook_ongoing.0001.b:0 ""Làm thế nào để tiến gần hơn tới [target.GetHerHim]?""

  fabricate_hook_ongoing.0002.t:0 "$fabricate_hook_header$ Ảnh Hưởng Không Hợp Lý"
  fabricate_hook_ongoing.0002.desc:0 "[target.GetTitledFirstName] tỏ ra cẩn trọng bất thường khi ở gần [target.GetHerHis] [target.Custom2('RelationToMeShort', hooking_character )], [hooking_character.GetTitledFirstName]. Sự kính trọng này chỉ có thể có nghĩa là [hooking_character.GetFirstNameNoTooltip] nắm giữ một lợi thế nào đó đối với [target.GetHerHim].\n\nCó lẽ ta có thể học được điều gì đó từ đây?"
  fabricate_hook_ongoing.0002.a:0 "Gián điệp của ta sẽ điều tra để giải mã bí ẩn này."
  fabricate_hook_ongoing.0002.b:0 "Ta phải biết [hooking_character.GetSheHe] khiến [target.GetHerHim] làm gì!"

  fabricate_hook_ongoing.0003.t:0 "$fabricate_hook_header$ Chuyện Tào Lao"
  fabricate_hook_ongoing.0003.desc_servant:0 "Các điệp viên của ta đã tiếp cận [servant.GetTitledFirstName], một người hầu trong [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] [target.GetTitledFirstNamePossessive] [target.Custom('ResidenceBuilding')] của ta."
  fabricate_hook_ongoing.0003.desc:0 "Các điệp viên của ta đã tiếp cận một người hầu trong [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] [target.GetTitledFirstNamePossessive] [target.Custom('ResidenceBuilding')] của ta."
  fabricate_hook_ongoing.0003.desc_ending:0 "\n\nVới phần thưởng thích hợp, [dummy_servant_gender.GetSheHe] sẵn sàng bắt đầu vài #EMP lời đồn# về việc [target.GetTitledFirstNameNoTooltip] không hẳn là [target.Custom('FormalComplimentAdjective')] như vẻ ngoài của [target.GetSheHe]!"
  fabricate_hook_ongoing.0003.a:0 "Chúng ta sẽ phá hủy danh tiếng của [target.GetHerHis]!"
  fabricate_hook_ongoing.0003.a_gregarious:0 "Ngươi #EMP biết#! đây là việc nên làm."
  fabricate_hook_ongoing.0003.b:0 "Một tai nghe biết lắng nghe gần [target.GetHerHim] là đủ."
  fabricate_hook_ongoing.0003.b_lustful:0 "Hoặc #EMP chúng ta#! có thể khởi đầu một chuyện khác ở đây…"

  fabricate_hook_ongoing.0004.t:0 "$fabricate_hook_header$ Vấn Đề Khẩu Vị"
  fabricate_hook_ongoing.0004.desc:0 "[target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] là một [target.GetWomanMan] phức tạp.\n\nTa cần hiểu rõ [target.GetHerHim] nếu muốn thuyết phục người khác đứng về phía ta trong bất cứ… #EMP tranh luận#! sắp tới."
  fabricate_hook_ongoing.0004.a:0 "Ta sẽ sớm khám phá ra bản chất thật của [target.GetHerHim]."
  fabricate_hook_ongoing.0004.b.success:0 "Ngươi hiểu rõ về [target.GetHerHim]"
  fabricate_hook_ongoing.0004.b.failure:0 "[target.GetSheHe|U] phát hiện ra ngươi"
  fabricate_hook_ongoing.0004.b:0 "Ta sẽ từ từ tìm hiểu chuyện này."

  fabricate_hook_ongoing.0005.desc:0 "Mọi người mô tả [target.GetTitledFirstName] vừa [target.Custom('ComplimentAdjective')] vừa [target.Custom2('InsultAdjective', ROOT.Char)], điều này cho ta biết nhiều hơn về mối quan hệ của họ với [target.GetHerHim] hơn bất cứ thứ gì khác.\n\nCòn nữa, một số người tò mò nhắc đến việc [target.GetSheHe] thường xuyên [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('target'))] và nói về [target.Custom('herhis_subject_of_interest')]."
  fabricate_hook_ongoing.0005.a:0 "Chắc chắn thông tin này sẽ hữu ích."
