 # Suicide events, by Linnéa Thimrén 
	health.6001.t:0 "Quyết Định"
	health.6001.desc_opening:0 "Ta sẽ kết thúc cuộc đời mình. Ta không thể ngăn nỗi buồn dâng lên khi nghĩ đến tất cả những gì sẽ bỏ lại phía sau, nhưng tâm trí ta đã quyết."
	health.6001.desc_depression:0 "Sự đau khổ dường như không có hồi kết."
	health.6001.desc_sickness:0 "Cơ thể ta đã trở thành một nhà tù, dần lụi tàn..."
	health.6001.desc_lunacy:0 "Những cái bóng đã lên tiếng, và ta sắp gia nhập cùng chúng."
	health.6001.desc_loss:0 "Ta không thể chịu thêm một mất mát nào nữa."
	health.6001.desc_stress:0 "Ta không thể chịu đựng thêm được nữa."
	health.6001.desc_ending:0 "\n\nĐiều ta vẫn chưa quyết định là ta sẽ làm điều đó bằng cách nào..."
	health.6001.warning:0 "Luôn có khả năng việc này sẽ thất bại"
	health.6001.a:0 "Ta sẽ tìm một tòa nhà đủ cao."
	health.6001.a_tribal:0 "Ta sẽ tìm một vách đá đủ cao."
	health.6001.b:0 "Trà pha từ một loài cây chết người... Nghe cũng khá dễ uống."
	health.6001.c:0 "Một bồn tắm ấm và một con dao sắc là đủ."
	health.6001.d:0 "Ta không còn chắc đây là điều mình muốn làm."
	health.6001.d_tt:0 "Ta không thực hiện попыт"

	health.6002.desc_fall:0 "Khi ta tiến gần đến mép, gió cuốn lấy vạt [ROOT.Char.Custom('GetClothingArticle')] của ta và quất mạnh quanh người. Khoảng cách xuống dưới thật xa."
	health.6002.desc_poison:0 "Khi trà sôi, không khí tràn ngập mùi hôi thối như nhắc ta về mục đích của nó. Ta rót chất lỏng vào một chiếc cốc. Nó nguội nhanh, và ta đưa cốc lên môi."
	health.6002.desc_knife:0 "Ngồi trong bồn tắm ấm, ta hít hơi nước khi với lấy con dao sắc bên cạnh."
	health.6002.desc_ending:1 "\n\n\"[ROOT.Char.GetFirstNameNoTooltip]! Đừng làm vậy, [friendly_person.Custom2('RelationToMeShort', ROOT.Char)]!\"\n\nTa quay lại và thấy [friendly_person.GetTitledFirstName] đứng đó, vươn tay về phía ta với vẻ kinh hoàng. \"Làm ơn, đây không phải là con đường.\""
	health.6002.a:0 "Không có gì ngươi có thể làm để ngăn ta."
	health.6002.a_success:0 "Nỗ lực của Ngài thành công"
	health.6002.a_failure:0 "Nỗ lực của Ngài thất bại"
	health.6002.b:0 "Ngươi nói đúng. Mọi thứ có thể vẫn sẽ tốt hơn."

	health.6004.desc:0 "Chỉ cần một bước nhỏ qua mép, thế là đủ. Gió gào thét quanh ta khi ta nhấc chân và bước tới.\n\nTrong khoảnh khắc ta cảm thấy như lơ lửng giữa không trung, thế giới xoay vòng quanh ta, rồi mọi thứ diễn ra rất nhanh. Gió rít bên tai, cảm giác rơi xuống, mặt đất dâng lên đón lấy ta..."
	health.6004.a:0 "Cuối cùng cũng được tự do."

	health.6005.desc:0 "Chỉ cần một bước nhỏ qua mép, thế là đủ. Gió gào thét quanh ta khi ta nhấc chân và–\n\nTa bất ngờ bị kéo giật lại, một lính canh ghì chặt ta xuống. "
	health.6005.desc_ending:0 "\"Thần xin lỗi, [ROOT.Char.Custom('FormOfAddressForLiege')], nhưng ngài không còn tỉnh táo!\""
	health.6005.a:0 "Kế hoạch của ta... bị phá hỏng..."

	health.6007.desc:0 "Ta hít hơi bốc lên từ tách trà trong tay và nhắm mắt lại. Chậm rãi ta đưa miệng cốc lên môi và nhấp một ngụm dài. Ta nuốt.\n\nChẳng bao lâu thế giới bắt đầu trở nên xám xịt và mờ nhạt, bóng tối len vào rìa tầm nhìn, và ta đặt đầu xuống bàn. Hơi thở ta ngắn dần. Ta nhắm mắt."
 
	health.6008.desc:0 "Ta hít hơi bốc lên từ tách trà trong tay và nhắm mắt lại. Chậm rãi ta đưa miệng cốc lên môi và–\n\nChiếc cốc bị giật khỏi tay ta và ném xuống sàn vỡ tan. Một lính canh đứng phía trên ta, sự hoảng loạn hiện rõ trong mắt [dummy_gender.GetHerHis]."

	health.6010.desc:0 "Hơi nước từ bồn tắm nóng bốc quanh ta và ta hít sâu khi nhấc con dao bên cạnh. Ta đặt nhẹ nó lên một cánh tay, rồi ấn xuống. Mạnh.\n\nKhi hai cánh tay đều có vết cắt giống nhau, ta thả chúng vào làn nước đang đỏ dần. Ta ngả đầu ra sau và thở dài khi thế giới bắt đầu quay cuồng. Sẽ không lâu nữa..."
 
	health.6011.desc:0 "Ngay khi ta sắp rạch vào cánh tay bằng con dao, hơi nước từ bồn tắm nóng bốc quanh, lính canh xông vào và nhanh chóng giật con dao khỏi tay ta.\n\n"

	health.6100.desc:0 "\"Xin chào [ROOT.Char.GetTitledFirstNameNoTooltip]. Ta chỉ muốn ghé thăm, hỏi xem ngài dạo này thế nào kể từ... sự cố trước đó.\"\n\n[friendly_person.GetTitledFirstName] hỏi ta với sự ấm áp chân thành, đến mức ngay cả việc nhắc đến lần ta tự sát hụt cũng không thể dập tắt hoàn toàn."
	health.6100.a:0 "Ta khá hơn rồi, cảm ơn."
	health.6100.b:0 "Ta thế nào không phải việc của ngươi."

	health.6200.desc_opening:0 "Trong khoảnh khắc hiếm hoi tỉnh táo, ta cảm nhận có ai đó bên giường."
	health.6200.desc_close_person:0 "\n\nChắc hẳn là [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('close_person'))] của ta, [close_person.GetTitledFirstName], một trong số ít người còn đến thăm ta. Ta cố với tay về phía [close_person.GetHerHim], nhưng tay ta thậm chí không nhúc nhích..."
	health.6200.desc:0 "Những người duy nhất còn đến thăm ta giờ đây là gia nhân, nhưng ta cần #EMP ai đó#! giải thoát ta..."
	health.6200.a:0 "\"[close_person.GetFirstNameNoTooltip]... Làm ơn... Kết thúc chuyện này...\""
	health.6200.a_success:0 "[close_person.GetSheHe|U] đồng ý làm điều đó"
	health.6200.a_failure:0 "[close_person.GetSheHe|U] từ chối ta"
	health.6200.a_failure_tt:0 "Ngài không chết"
	health.6200.b:0 "Ta không thể yêu cầu [close_person.GetHerHim] làm điều này. Một gia nhân phải làm..."
	health.6200.b_2:0 "Một gia nhân phải làm..."
	health.6200.b_success:0 "Một gia nhân thực hiện mong muốn của Ngài"
	health.6200.b_failure:0 "Không gia nhân nào đồng ý"

	health.6203.desc:0 "Ta ngồi bên giường [incapable_person.GetTitledFirstNamePossessive] khi [incapable_person.GetSheHe] đột nhiên có vẻ tỉnh lại một chút, mắt nhìn lên trên. Kể từ khi [incapable_person.GetSheHe] bị buộc nằm trên giường này, [incapable_person.GetSheHe] hầu như không nói một lời, nhưng đột nhiên sự im lặng bị phá vỡ bởi một giọng thở khò khè.\n\n"[ROOT.Char.GetFirstNameNoTooltip]? [ROOT.Char.GetFirstNameNoTooltip] xin... Kết thúc việc này. Lòng thương xót...""  
	health.6203.desc_murder:0 "\n\n[incapable_person.GetSheHe] không hề hay biết rằng [incapable_person.GetSheHe] đang rơi đúng vào kế hoạch của ta!"  
	health.6203.a:0 "Ta... Ta hiểu..."  
	health.6203.b:0 "Không! Làm sao ngươi có thể yêu cầu điều đó với ta?!"  

	health.6204.desc_opening:0 "Ta không thể nhận ra phản ứng của [close_person.GetTitledFirstNamePossessive], nhưng [close_person.GetSheHe] không rời khỏi bên Ta.\n\n"  
	health.6204.desc_1:0 "Một lúc sau Ta cảm nhận được chuyển động, rồi cảm thấy một áp lực mềm lên mặt mình. Áp lực tăng lên, và Ta nhận ra không thở được, chỉ còn cảm giác... Biết ơn. [close_person.GetSheHe|U] đồng ý. [close_person.GetSheHe|U]..."  
	health.6204.desc_2:0 "Một lúc sau Ta cảm nhận được chuyển động, rồi cảm thấy một áp lực lạnh, sắc lên cổ. Ta hầu như không cảm nhận được vết cắt. Nhưng Ta nghe hơi thở của [close_person.GetHerHis], nghe con dao rơi xuống sàn, nghe tiếng rít trong tai... Và rồi... Im lặng."  
	health.6204.a:0 "Tự do, cuối cùng..."  

	health.6205.desc_1:0 "Một lúc sau Ta cảm nhận được chuyển động, rồi cảm thấy một áp lực mềm lên mặt mình. Áp lực tăng lên, và Ta nhận ra không thở được, chỉ còn cảm giác... Biết ơn. Khi Ta sắp trôi đi, không khí lại tràn vào phổi. Ta nghe tiếng khóc và giọng hoảng loạn. Ta nghe tiếng bước chân rời khỏi [ROOT.Char.Custom('GetRoom')]."  
	health.6205.desc_2:0 "Một lúc sau Ta cảm nhận được chuyển động, rồi cảm thấy một áp lực lạnh, sắc lên cổ. Áp lực tăng dần và– và Ta nghe con dao rơi xuống đất. Ta nghe tiếng khóc, giọng van xin, tiếng bước chân rời khỏi [ROOT.Char.Custom('GetRoom')]."  
	health.6205.a:0 "Không... Xin... Quay lại..."  

	health.6206.desc:0 ""[ROOT.Char.GetFirstNameNoTooltip]..."\n\nTa nghe giọng [close_person.GetFirstNamePossessive] như từ một khoảng cách mênh mông. "[ROOT.Char.GetFirstNameNoTooltip], Ta... Ta không thể."\n\nTuyệt vọng tràn ngập, và chỉ còn âm thanh khóc, tiếng bước chân rời đi phá tan sương mù trong tâm trí Ta."  

	health.6207.desc:0 "Lần tới khi một Bạn Bè bước vào [ROOT.Char.Custom('GetRoom')], Ta vật lộn để vượt qua sương mù trong đầu, sự lười biếng của cơ thể.\n\n"Ngươi... Ai...?"\n\n"Ta, [ROOT.Char.Custom('FormOfAddressForLiege')]?" Tiếng bước nhanh tới giường Ta. "Ta là [servant.GetFirstName]. Có việc gì Ta có thể làm cho ngài không?""  
	health.6207.a:0 ""[servant.GetFirstNameNoTooltip]... Xin... Kết thúc việc này...""  
	health.6207.a_success:0 "[servant.GetSheHe|U] đồng ý làm điều đó"  
	health.6207.a_failure:0 "[servant.GetSheHe|U] từ chối Ta"  

	health.6209.desc_refusal:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Ta..."\n\n"  
	health.6209.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Ta không bao giờ có thể...! Làm sao ngươi có thể yêu cầu một điều như..."\n\nTuyệt vọng tràn ngập, và chỉ còn âm thanh khóc, tiếng bước chân rời đi phá tan sương mù trong tâm trí Ta."  

	health.6210.desc:0 "Ta đang chờ. Điều mà Ta còn nhớ ngay cả qua sương mù trong đầu – Ta đang chờ điều [close_person.GetTitledFirstName] có thể ban cho Ta, nhưng nó không đến. Tại sao...? Tại sao [close_person.GetSheHe] không đến?"  
	health.6210.a:0 "Liệu [close_person.GetSheHe] cũng đã bỏ Ta lại phía sau...?"  

 # Infirm events
	health.7000.t:0 "Tù Nhân Trong Chính Cơ Thể Ta"  
	health.7000.desc:0 "Ta biết rằng tuổi tác sẽ khiến mọi việc chậm hơn, nhưng Ta không nghĩ tất cả sẽ dừng lại cho đến khi chết. Gần đây, Ta luôn cảm thấy khó chịu và mọi việc tốn nhiều nỗ lực hơn trước. Ta lo nếu nằm xuống, có thể Ta sẽ không đứng dậy được nữa. Không còn nghi ngờ gì, thời gian của Ta đang cạn dần."  
	health.7000.desc_collapse:0 "Ta biết Ta đã cố quá – lẽ ra Ta nên nghe cơ thể mình, nhưng Ta chọn phớt lờ. "Ta sẽ hoàn thành việc này trước khi đi ngủ; chỉ vài cái nữa, rồi nghỉ." Đột nhiên Ta thấy chóng mặt, và khi đứng dậy, tầm nhìn mờ đen.\n\nNgày hôm sau, Ta tỉnh dậy trên giường, không thể đứng dậy khi cơ thể không nghe lời. Có lẽ [ROOT.Char.GetFaith.HighGodName] quyết định trừng phạt Ta vì không tôn trọng chiếc thân xác này vốn để phục vụ [ROOT.Char.GetFaith.HighGodNameAlternate]."  
	health.7000.desc_closing:0 "\n\nTa cảm thấy chẳng còn làm gì ngoài việc chờ cái chết êm ái đến nhận lấy Ta."  
	health.7000.a:0 "Ta phải chờ bao lâu nữa?"  
	health.7000.a.lazy:0 "Ít ra thì Ta được nằm trên giường cả ngày..."  
	health.7100.desc:0 "Hôm nay là ngày mấy? Ta đã nghỉ ngơi bao lâu rồi?\n\nTa tìm kiếm trên khuôn mặt những người thường đến thăm dấu hiệu nào đó – nếp nhăn hay vết sẹo – #bold bất cứ điều gì#! để chứng minh thời gian vẫn trôi. Dường như những cuộc gặp gỡ với người khác là họ đang nói #bold với#! Ta, không phải #bold tới#! Ta.\n\nTa vẫn là Ta, hay chỉ là một linh hồn rời khỏi cơ thể? Ta đang sống, hay chỉ tồn tại đơn thuần?"  
	health.7100.a:0 "Sự tồn tại của Ta là cực hình."
	health.7200.t: "Ta đang ở đâu thế này?"
	health.7200.desc: "Khoan đã, sao ta lại ở đây? Ta đâu có định tới chốn này... hay là ta đã đi nhỉ? Phải chăng ta đang tìm kiếm thứ gì đó?\n\nCó lẽ chẳng có gì đâu... chờ đã, ta vừa mới nghĩ về điều gì ấy nhỉ?\n\nĐầu ta đau quá..."
	health.7200.a: "Ta nên về giường nằm nghỉ thôi..."
	health.7300.t: "Nhãn lực mờ đục"
	health.7300.desc: "Lẽ nào vầng thái dương bấy lâu nay vẫn chói chang đến thế? Những tia nắng đâm vào mắt ta như những mũi giáo, tốt hơn hết là ta nên lui vào bóng râm...\n\n...nhưng sao những bóng râm cũng trở nên u tối thế này?"
	health.7300.a: "Thế gian này trông thật ảm đạm và bạc nhược."
	health.7400.t: "Tâm mạch suy vi"
	health.7400.desc: "Lồng ngực ta thắt lại — ta cảm thấy hụt hơi hơn bao giờ hết, thở dốc như một con khuyển đen trong ngày nắng gắt. Một cơn đau âm ỉ lan dần lên hàm, rồi chạy dọc xuống cánh tay, rồi lại tan biến...\n\nNhưng, ta có làm gì nặng nhọc đâu cơ chứ?"
	health.7400.a: "Ta nên nghỉ ngơi tĩnh dưỡng."
	health.7500.t: "Cốt tủy rã rời"
	health.7500.desc: "Ôi! Sao lưng ta lại đau buốt thế này? Ta chỉ hơi lảo đảo khi vừa rời giường, một bước hụt chân chẳng đáng là bao...\n\nChẳng vết bầm, cũng không vết thương, nhưng cơn đau cứ âm ỉ dọc theo sống lưng.\n\nHẳn là nó sẽ qua sớm thôi."
	health.7500.a: "Ta phải cẩn trọng trong từng bước đi."
