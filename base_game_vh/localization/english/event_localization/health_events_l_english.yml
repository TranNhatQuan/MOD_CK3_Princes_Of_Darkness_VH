 #Recovery events, by Linnéa Thimrén and Petter Vilberg
 health.0001.desc:0 "Vết thương của Ta đã lành"

 health_wounded_title:0 "Bị thương:"
 health.0002.t:1 "$health_wounded_title$ Hồi Phục"
 health.0002.desc:0 "Các vết thương của Ta đang dần khá hơn và cơn đau không còn là người Ngài đồng hành thường trực nữa. Ta vẫn còn suy yếu, nhưng hôm nay Ta đã có thể làm được nhiều việc mà chỉ một tháng trước còn là điều không thể."
 health.0002.a:0 "Ta mong chờ ngày hoàn toàn hồi phục."

 health.0003.t:1 "$health_wounded_title$ Thoát Chết Trong Gang Tấc"
 health.0003.desc:0 "Có vẻ như điều tồi tệ nhất đã qua. Những vết thương há miệng và xương gãy của Ta đang dần tự liền lại."
 health.0003.a:0 "Có lẽ Ta sẽ vượt qua được chuyện này."

 health.0004.t:1 "$health_wounded_title$ Cơn Lửa Tắt Dần"
 health.0004.desc:0 "Vùng da xung quanh đã trở nên cứng lại, nhưng cảm giác bỏng rát trong vết thương đã biến mất. Có vẻ như nhiễm trùng đã khỏi."
 health.0004.a:1 "Cảm tạ [ROOT.Char.GetFaith.HealthGodName]."

 health.wounded_1_success:0 "Điều Trị Vết Thương Thành Công"
 health.wounded_1_failure:0 "Điều Trị Vết Thương Thất Bại"

 # Becoming wounded, by Linnéa Thimrén and Petter Vilberg
 health.0102.t:1 "$health_wounded_title$ Bị Cắt Sâu"
 health.0102.desc:0 "Cơn đau lan khắp cơ thể Ta theo từng bước đi, và chỉ một cử động nhỏ cũng khiến Ta thở dốc. Khi Ta đưa tay lên chạm nhẹ vào vết thương, tay Ta rút ra đầy máu, và Ta run rẩy khi máu chảy dọc xuống hông."
 health.0102.court_physician.desc:0 "\n\n"Đừng lo, [ROOT.Char.Custom('FormOfAddressForLiege')]. Vết thương của ngài sâu, nhưng kiến thức của ta còn sâu hơn.""
 health.0102.a:0 "Ta chỉ cần ngồi xuống nghỉ một lúc..."

 health.0104.t:1 "$health_wounded_title$ Bị Thương Nghiêm Trọng"
 health.0104.desc:0 "Đó là xương mà Ta thấy cắm trong thịt mình, hay thứ gì đó đáng ra phải nằm sâu hơn nữa? Khi làn da Ta há ra như miệng đói khát của tử thần, Ta chỉ biết nhìn trân trối dòng máu đang tuôn ra."
 health.0104.court_physician.desc:0 "\n\n"Ngài bị thương rất nặng, [ROOT.Char.Custom('FormOfAddressForLiege')]. Chúng ta phải chữa trị ngay lập tức!""
 health.0104.a:1 "[ROOT.Char.GetFaith.HealthGodName|U], xin giải thoát con khỏi cơn đau này!"

 # Infection/gangrene, by Linnéa Thimrén and Petter Vilberg
 health.0201.desc:0 "Vết Thương Nhiễm Trùng"

 health.0202.t:1 "$health_wounded_title$ Sự Ô Nhiễm Bên Trong"
 health.0202.desc:0 "Ta cảm thấy như có hàng trăm con dao đang xé toạc vết thương của mình! Khi thịt trở nên sẫm màu và máu trở nên nhợt nhạt, rõ ràng vết thương đã bị nhiễm trùng."
 health.0202.unintelligent:0 "Mỗi khi chạm vào vết thương, Ta có cảm giác như nhiều con dao đang cắt da quanh nó. Thịt trở nên đau nhức, và Ta nghĩ máu có màu không đúng."
 health.0202.court_physician.desc:0 "\n\n"Vết thương của ngài đã bị nhiễm trùng, [ROOT.Char.Custom('FormOfAddressForLiege')]. Nhưng đừng lo, ta sẽ giúp ngài vượt qua chuyện này.""
 health.0202.a:0 "Ta hy vọng mình sẽ sống sót."

 health.0203.desc:0 "Vết Thương Hoại Tử"

 health.0204.t:1 "$health_wounded_title$ Điềm Báo Đen Tối"
 health.0204.desc:0 "Vết thương thì phải đau, và sưng tấy cũng không phải điều lạ, nên Ta tưởng rằng nó đang lành lại. Nhưng giờ đây những mụn nước nổi lên khắp da, và màu đỏ đang chuyển thành đen. Cơ thể Ta đang thối rữa ngay trước mắt!"
 health.0204.court_physician.desc:0 "\n\n"Ngài đã mắc chứng hoại tử, [ROOT.Char.Custom('FormOfAddressForLiege')]. Đây là chuyện cực kỳ nghiêm trọng... Chúng ta phải chữa trị ngay!""

 # Disease Contraction, by Mathilda Bjarnehed
 health.1001.t:1 "[SCOPE.Custom('EventTitleDisease')]: Thân Xác Phàm Trần"
 health.1001.desc:0 "[ROOT.Char.GetTitleAsNameNoTooltip] hay nông dân, cao quý hay thấp hèn, điều đó không quan trọng. Cuối cùng thì tất cả chúng ta đều phải chết.\n\nTa nhớ ra điều này khi thức dậy vào sáng sớm với những cơn ho, đầu và cổ họng đau âm ỉ. Cơ thể Ta run rẩy vì lạnh và yếu ớt, đầu Ta rỉ dịch từ mọi lỗ.\n\n"
 health.1001.nophysician.desc: "Chắc hẳn phải có ai đó có thể chữa được tình trạng đáng nguyền rủa này..."
 health.1001.court_physician.desc:0 "\"Thần nghe thấy tiếng khò khè đó từ tận bên kia [ROOT.Char.Custom('GetCourt')], thưa [ROOT.Char.Custom('FormOfAddressForLiege')]!\" [physician.GetFirstName], ngự y của ta, thò đầu vào [ROOT.Char.Custom('GetChamber')]. \"Nếu ngài cần, thần biết khá nhiều phương thuốc phù hợp đấy.\""
 health.1001.a:0 "Tất cả những gì Ta muốn là nằm trên giường..."
 health.1001.b:0 "Ta phải trở về nhà #EMP ngay lập tức!#!"

 health.1002.t:1 "[SCOPE.Custom('EventTitleDisease')]: Sắc Như Dao"
 health.1002.desc:0 "Hít thở vốn là một điều dễ dàng và tuyệt vời — một phép màu nhỏ mà người ta hiếm khi nghĩ tới. Giờ đây, khi Ta vật lộn để giữ hơi thở ổn định và những cơn ho kéo theo cơn đau nhói ở ngực, nó luôn hiện hữu trong tâm trí Ta."
 health.1002.court_physician.desc:0 "\n\nNgự y [physician.GetFirstName] nhìn Ta từ đầu đến chân. "Đó là viêm phổi, [ROOT.Char.Custom('FormOfAddressForLiege')]. Không thể xem nhẹ. Chúng ta nên xử lý thế nào?""
 health.1002.a:0 "Xin đừng để đây là kết thúc!"

 health.1003.t:1 "[SCOPE.Custom('EventTitleDisdease')]: Cái Giá Của Sự Hưởng Lạc"
 health.1003.court_amenities_gout.desc:0 "Bàn ăn của Ta nổi tiếng với những bữa tiệc xa hoa, thức ăn dồi dào không ngớt. Khi bàn chân Ta bắt đầu sưng lên, Ta nhận ra rằng nhiều người trong chúng Ta cũng phải chuẩn bị cho những cơn đau dai dẳng."
 health.1003.desc:0 "Họ gọi đó là "căn bệnh của các vị vua", như thể có điều gì xa hoa hay đáng ghen tị trong những khớp xương sưng tấy đau đớn của Ta.\n\nNgón chân cái của Ta đặc biệt sưng đau, khiến Ta phải đi khập khiễng.\n\nKhi cơn đau đạt đến đỉnh điểm, Ta không khỏi ước mình chỉ là một nông dân bình thường."
 health.1003.court_physician.desc:0 "\n\nNgự y của Ta, [physician.GetFirstName], đặt vài lọ thuốc mỡ bên cạnh. "Ta rất thông cảm, [ROOT.Char.Custom('FormOfAddressForLiege')]. Ta có vài cách có thể làm giảm triệu chứng bệnh gout của ngài.""
 health.1003.a:0 "Mang thuốc mỡ đến đây! Nhanh!"

 health.1004.t:1 "[SCOPE.Custom('EventTitleDisease')]: Những Ánh Nhìn Lảng Tránh"
 health.1004.desc:0 "Những triệu chứng đầu tiên rất nhẹ, và Ta nhanh chóng gạt chúng khỏi tâm trí. Có lẽ Ta quá sợ hãi để nhìn thẳng vào sự thật. Nhưng vết dấu kinh khủng trên mặt Ta, vết loét này... Ta không thể phớt lờ nữa.\n\nCác [ROOT.Char.Custom('GetCourtierPlural')|l] của Ta vẫn nghe lệnh, nhưng cách họ nhìn Ta đã thay đổi. Đó là nỗi sợ trong mắt họ sao? Hay thương hại? Ghê tởm?"
 health.1004.court_physician.desc:0 "\n\n"Ta rất tiếc — bệnh phong là căn bệnh vĩnh viễn, [ROOT.Char.Custom('FormOfAddressForLiege')]. Tuy nhiên, ta có cách giúp giảm nhẹ triệu chứng.""
 health.1004.a:0 "Ta đã làm gì để phải chịu lời nguyền này?"

 health.1005.t:1 "[SCOPE.Custom('EventTitleDisease')]: Sốt Doanh Trại"
 health.1005.desc:0 "Ta từng nghe chuyện những người lính dũng cảm chết như ruồi trước khi đặt chân lên chiến trường. Nhưng Ta, một [ROOT.Char.GetTitleAsNameNoTooltip]? Cơn ác mộng đau đớn và sốt cao này không phải số phận dành cho Ta.\n\nKhi một bữa ăn khác trào ngược lên cổ họng, Ta cầu xin sự cứu rỗi, mũi cay xè vì mùi mật đắng."
 health.1005.court_physician.desc:0 "\n\n"Đừng lo, [ROOT.Char.Custom('FormOfAddressForLiege')]! Bệnh sốt phát ban có thể chữa được.""
 health.1005.a:0 "Xin hãy để nó kết thúc!"

 health.1006.t:1 "[SCOPE.Custom('EventTitleDisease')]: Từng Chút Một"
 health.1006.desc:0 "Một vết đỏ thẫm, nổi bật trên tấm vải nhạt màu. Ta nhìn chằm chằm vào nó với vẻ không tin nổi, cố nén thêm một cơn ho. Có phải...? Có phải Ta...?\n\nTa lau môi bằng ngón tay, bàn tay run rẩy khi rút ra. Ta cảm thấy sự ấm và ướt, nhưng không dám nhìn."
 health.1006.court_physician.desc:0 "\n\n"Ta e rằng ngài đã mắc bệnh lao, [ROOT.Char.Custom('FormOfAddressForLiege')]. Ta sẽ chữa trị ngay.""
 health.1006.a:0 "Đây có phải số phận của Ta không? Tàn lụi dần dần?"

 health.1007.t:1 "[SCOPE.Custom('EventTitleDisease')]: Kẻ Lạ Bên Trong"
 health.1007.desc:0 "Có thứ gì đó bên trong Ta không phải là Ta. Nó ăn mòn thịt Ta, hút lấy sinh lực của Ta, sức mạnh của nó tăng lên trong khi Ta dần tàn tạ.\n\nTa ấn tay vào khối u dưới da, ngón tay đau nhức vì muốn xé nó ra. Ý nghĩ nó tiếp tục lớn lên khiến Ta buồn nôn."
 health.1007.court_physician.desc:0 "\n\n"Đúng vậy, thật không may, đó là ung thư. Ta chỉ biết một phương pháp điều trị hiệu quả...""
 health.1007.a:0 "Trước kẻ thù này, không có chiến thắng."

 health.1008.t:1 "[SCOPE.Custom('EventTitleDisease')]: Ngọn Lửa Tình Ái"
 health.1008.desc:0 "Cảm giác bỏng rát ở háng trở nên không thể chịu nổi khiến Ta phải xin phép rời đi và chạy về [ROOT.Char.Custom('GetChamber')]. Cuối cùng cũng ở một mình, Ta có thể gãi để tìm chút nhẹ nhõm.\n\nNhưng không có sự nhẹ nhõm nào, vì các ngón tay Ta chạm phải những mụn nước và làm chúng vỡ ra!"
 health.1008.partner.a:0 "[infecting_partner.GetFirstNameNoTooltip]...!"
 health.1008.no_partner.a:0 "Làm sao? Là ai?!"

 health.1013.t:1 "[SCOPE.Custom('EventTitleDisease')]: Đại Bệnh Hoa Liễu"
 health.1013.desc:0 "Ta nghĩ đó chỉ là vài mụn nước. Dù ghê tởm và nguyền rủa vận rủi của mình, Ta chưa bao giờ tưởng tượng nó sẽ tệ hơn. Giờ đây một vết phát ban đỏ đang lan khắp cơ thể.\n\nTa biết điều gì sẽ đến tiếp theo. Lở loét, sốt, đủ loại đau đớn và teo mòn. Và cuối cùng — nếu Ta sống đủ lâu — Ta sẽ mất trí."
 health.1013.court_physician.desc:0 "\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]. Điều đó... trông không ổn chút nào. Để ta xem ta có thể làm gì.""
 health.1013.partner.a:0 "Ngươi đã nguyền rủa ta, [infecting_partner.GetFirstNameNoTooltip]."
 health.1013.no_partner.a:0 "Ta bị nguyền rủa. Hoàn toàn và triệt để."

 health.1014.t:1 "[SCOPE.Custom('EventTitleDisease')]: Sự Sa Ngã"
 health.1014.desc:0 "Ta đang ở đâu?\n\nTa nhìn chằm chằm vào hành lang trống rỗng trước mặt, tim đập thình thịch và tay run rẩy. Ta đến đây bằng cách nào? Tâm trí Ta... rời rạc. Có những hình ảnh — cầu thang, ngã xuống, bóng tối trong góc — nhưng Ta không thể ghép chúng lại.\n\nCó ai đó đang nhìn Ta.\n\nTa quay phắt lại, chỉ thấy sự trống rỗng."
 health.1014.a:0 "Ta không sợ ngươi. Nghe rõ không?! KHÔNG SỢ!"

 health.1010.t:1 "[SCOPE.Custom('EventTitleDisease')]: Đại Dịch Đỏ"
 health.1010.desc:0 "Với cơn sốt và nôn mửa đầu tiên, Ta tuyệt vọng hy vọng đó chỉ là bệnh đổ mồ hôi. Và Ta thực sự đã khá hơn một chút, rời giường, quay lại công việc. Trong một tuần mọi thứ đều ổn — cho đến khi Ta nhận ra những đốm đỏ đầu tiên trong miệng."
 health.1010.end.desc:0 "\n\nĐó là hai ngày trước, và giờ những tổn thương đặc trưng đang lan khắp da Ta..."
 health.1010.court_physician.desc:0 "\n\n"Đúng vậy, những tổn thương này là dấu hiệu rõ ràng của bệnh đậu mùa. Rất nguy hiểm nếu không được chữa trị.""
 health.1010.a:1 "[ROOT.Char.GetFaith.HealthGodName], con cầu xin ngài, đừng phải lúc này! Con chưa sẵn sàng!"

 health.1011.t:1 "[SCOPE.Custom('EventTitleDisease')]: Cái Chạm Của Tử Thần"
 health.1011.desc:0 "Nỗi sợ dịch bệnh luôn theo Ta suốt cuộc đời. Bảo mẫu khi Ta còn nhỏ thường kể những câu chuyện rùng rợn trước giờ ngủ về những khối u sưng tấy và những chi thể đen lại.\n\nNhưng dịch bệnh giờ đây không còn chỉ là câu chuyện đáng sợ nữa. Cẩn thận, Ta ấn ngón tay vào khối u dưới nách. Một sức mạnh đen tối và chết chóc đang đầu độc cơ thể Ta, nuốt chửng Ta khi Ta vẫn còn thở."
 health.1011.court_physician.desc:0 "\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ta sẽ làm mọi thứ trong khả năng của mình, nhưng có lẽ ngài nên chuẩn bị cho điều tồi tệ nhất...""
 health.1011.a:1 "Ôi, [ROOT.Char.GetFaith.HealthGodName]! Xin cứu con khỏi cơn ác mộng này!"

 # Travel loc if you get ill on the road
 health.travel.t:0 "[SCOPE.Custom('EventTitleDisease')]: Kết Thúc Của Hành Trình?"
 health.travel.option.home:0 "Ta có thể tìm sự chữa trị tốt nhất tại nhà."
 health.travel.option.home.flavor:0 "Ngài từ bỏ [ROOT.Char.GetInvolvedActivity.GetNameNoTooltip] và bắt đầu hành trình trở về nhà"
 health.travel.option.continue:0 "Chúng ta phải tiếp tục tiến lên."

 # Recover from diseases, by Mathilda Bjarnehed
 health.1101.t:1 "[SCOPE.Custom('EventTitleDisease')]: Trở Lại Như Xưa"
 health.1101.desc:1 "Khi Ta thức dậy sáng nay và nhìn những tia nắng đầu tiên, phải mất một lúc Ta mới nhận ra rằng mình đã ngủ ngon lần đầu tiên sau nhiều tuần. Ta thậm chí không ho một lần nào!\n\nCon đường trở lại sức khỏe thật dài, nhưng giờ đây Ta lại được nó ôm lấy trong vòng tay ấm áp."
 health.1101.a:0 "Thật tốt khi lại khỏe mạnh."

 health.1102.t:1 "[SCOPE.Custom('EventTitleDisease')]: Sức Lực Trở Lại"
 health.1102.desc:0 "Ta phải thừa nhận rằng đã có lúc Ta lo cho mạng sống của mình, nhưng giờ nỗi đau khổ ấy chỉ còn là một ký ức nhạt nhòa. Tràn đầy lòng biết ơn, Ta hít một hơi thật sâu, chuẩn bị cho ngày mới."
 health.1102.a:0 "Đã đến lúc chinh phục thế giới!"

 health.1103.t:1 "[SCOPE.Custom('EventTitleDisease')]: Không Còn Đau Đớn"
 health.1103.desc:0 "Ta đã phải kiềm chế bản thân và từ bỏ rất nhiều thú vui của cuộc đời, nhưng đó là sự hy sinh mà Ta sẵn sàng làm lại. Cuộc sống còn nhiều điều đáng tận hưởng hơn là ăn uống!\n\nGiờ đây khi cơn đau không còn cản trở Ta nữa, cuối cùng Ta cũng có thể theo đuổi chúng."
 health.1103.a:0 "Sự điều độ đã được đền đáp!"

 health.1105.t:1 "[SCOPE.Custom('EventTitleDisease')]: Trận Chiến Đã Thắng"
 health.1105.desc:0 "Không giống như nhiều người trước Ta, Ta đủ mạnh mẽ để sống sót qua sự tàn phá của căn sốt doanh trại đáng sợ. Đó là một thử thách tàn khốc, Ta không phủ nhận, nhưng Ta đã kiên trì vượt qua!"
 health.1105.a:0 "Ta sống để chiến đấu thêm một ngày nữa!"

 health.1106.t:1 "[SCOPE.Custom('EventTitleDisease')]: Cơ Hội Thứ Hai"
 health.1106.desc:0 "Ta gầy gò, ho, và chảy máu. Ta nghĩ mình sẽ tàn lụi dần cho đến khi chẳng còn gì. Quả thực cảm giác đó rất rõ khi Ta thậm chí không thể rời khỏi giường.\n\nThế nhưng sức khỏe và sức lực của Ta đã dần hồi phục, dù rất chậm. Cuối cùng Ta đã sẵn sàng đối mặt với thế giới và mọi thử thách của nó."
 health.1106.a:0 "Đã đến lúc chinh phục thế giới!"

 health.1107.t:1 "[SCOPE.Custom('EventTitleDisease')]: Phép Màu Y Học"
 health.1107.desc:0 "Họ nói Ta là một điều kỳ diệu, một phép màu. Người ta thường không thể hồi phục khỏi thứ như thế này.\n\nThế nhưng Ta cảm thấy hoàn toàn ổn, và khối u đã biến mất. Không còn kết luận nào khác — Ta đã khỏi bệnh ung thư."
 health.1107.a:0 "Ta sẽ sống trọn vẹn cuộc đời!"

 health.1109.t:1 "[SCOPE.Custom('EventTitleDisease')]: Sự Nhẹ Nhõm Lớn Lao"
 health.1109.desc:0 "Ta từng sợ rằng Đại Hoa Liễu sẽ cướp đi mạng sống của mình, nhưng dường như Ta đã thắng trong cuộc đấu tranh này. Ta đã không còn triệu chứng suốt nhiều tháng trăng. Đã đến lúc buông bỏ nỗi lo lắng thường trực ấy."
 health.1109.a:0 "Ta sẽ sống trọn vẹn cuộc đời!"

 health.1110.t:1 "[SCOPE.Custom('EventTitleDisease')]: Thoát Khỏi [ROOT.Char.GetFaith.DeathDeityName]"
 health.1110.desc:0 "Dù những vết sẹo có thể vẫn còn, cả trên da thịt lẫn trong tâm trí, có vẻ như căn bệnh đã rời khỏi cơ thể Ta. Ta sẽ sống sót. Vẫn còn thời gian."
 health.1110.a:1 "Vinh danh [ROOT.Char.GetFaith.HealthGodName]! Ta đã khỏe!"
 health.1110.a.tt:0 "Ta giờ đã miễn nhiễm với [GetTrait('smallpox').GetName( GetNullCharacter )]"

 health.1111.t:1 "[SCOPE.Custom('EventTitleDisease')]: Trái Với Mọi Khả Năng"
 health.1111.desc:0 "Có vẻ như [ROOT.Char.GetFaith.DeathDeityName] đã bước qua cánh cửa của Ta, đứng lại bên giường bệnh, nhưng cuối cùng lại quyết định để Ta sống. Ta sẽ không bao giờ quên những đau đớn từ cái chạm của [ROOT.Char.GetFaith.DeathDeityHerHis|U], nhưng [ROOT.Char.GetFaith.DeathDeitySheHe|U] cũng đã mở mắt Ta trước phép màu của sự sống.\n\n Dịch bệnh đã cướp đi nhiều linh hồn, nhưng Ta sẽ không phải là một trong số đó."
 health.1111.a:1 "Ca ngợi [ROOT.Char.GetFaith.HealthGodName] vì phép màu này!"
 health.1111.a.tt:0 "Ta giờ đã miễn nhiễm với [GetTrait('bubonic_plague').GetName( GetNullCharacter )]"

 # STD events, by Mathilda Bjarnehed
 health.2001.t:1 "[SCOPE.Custom('EventTitleDisease')]: Bất Ngờ Kinh Tởm"
 health.2001.start.desc:0 "Khi Ta chui vào chăn để nằm cùng [std_partner.GetFirstName], Ta kinh hoàng khi thấy những mụn nước rỉ dịch trên phần kín nhất của [std_partner.GetHerHis]!"
 health.2001.not_sick.desc:0 "Làm sao [std_partner.GetSheHe] có thể mang căn bệnh ghê tởm này vào giường của chúng Ta?"
 health.2001.sick.desc:0 "Có phải chính Ta đã gây ra điều này cho [std_partner.GetHerHim]?"
 health.2001.a.not_sick:0 "Ra khỏi giường của ta ngay, đồ [std_partner.Custom2('InsultNounSexual', ROOT.Char)] phản bội!"
 health.2001.a.sick:0 "Tha lỗi cho ta, [std_partner.GetFirstNameNoTooltip], nhưng ta không thể chung giường với ngươi như thế này."
 health.2001.c.not_sick:0 "Chỉ nghĩ đến việc chạm vào ngươi thôi... ta không thể!"
 health.2001.c.sick:0 "Tha lỗi cho ta, [std_partner.GetFirstNameNoTooltip], chúng ta không thể tiếp tục như thế này."
 health.2001.d.not_sick:0 "Ta tha thứ cho ngươi, [std_partner.GetFirstNameNoTooltip]."
 health.2001.d.sick:0 "Người yêu dấu, ta không thể diễn tả hết sự hối hận của mình!"
 health.2001.c.tt:0 "Ta vẫn tiếp tục đến giường của [std_partner.GetFirstNamePossessive], chấp nhận nguy cơ bị lây bệnh"
 health.2001.c.tt_sick:0 "Ta vẫn tiếp tục đến giường của [std_partner.GetFirstNamePossessive]"

 health.2002.t:1 "[SCOPE.Custom('EventTitleDisease')]: Còn Tệ Hơn"
 health.2002.start.desc:0 "Thứ mà [std_partner.GetFirstName] khăng khăng chỉ là vài mụn nước giờ đã lộ rõ bản chất thật. Một vết phát ban đỏ đang lan khắp da của [std_partner.GetHerHis] — dấu hiệu chắc chắn của Đại Hoa Liễu."
 health.2002.early_great_pox.desc:0 "\n\nĐiều đó có nghĩa là...?"
 health.2002.a.not_sick:0 "Tránh xa ta ra!"
 health.2002.a.sick:0 "Ta... ta không thể. Chuyện này quá sức chịu đựng!"
 health.2002.b.not_sick:0 "Ta không thể ở bên ngươi như thế này, [std_partner.GetFirstName]!"
 health.2002.b.sick:0 "Người yêu dấu, ta xin lỗi, nhưng ta không thể..."
 health.2002.c:0 "Ta sẽ ở bên ngươi vượt qua chuyện này, tình yêu của ta."
 health.2002.d.not_sick:0 "Điều này lẽ ra có thể là cái kết của ta."
 health.2002.d.sick:0 "Chúng ta bị nguyền rủa!"

 health.2003.t:1 "[SCOPE.Custom('EventTitleDisease')]: Bị Ruồng Bỏ"
 health.2003.start.desc:1 "Khi ta kể với [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('other_partner'))] về căn bệnh của mình, ta đã tìm kiếm sự an ủi từ [other_partner.GetHerHis] nhưng chỉ nhận lại sự từ chối. Sự ghê tởm lộ rõ trong đôi mắt của [other_partner.GetFirstNamePossessive] khi [other_partner.GetSheHe]"
 health.2003.consort.desc:0 "bảo Ta tránh xa giường của [other_partner.GetHerHis]."
 health.2003.lover.desc:0 "chấm dứt mối quan hệ giữa chúng Ta."
 health.2003.a:0 "Chẳng lẽ mọi thứ đều bị tước khỏi Ta?"

 #Courtier/guest/prisoner has contagious disease
 health.2101.t:1 "[SCOPE.Custom('EventTitleDisease')]: Kẻ Sát Nhân Trong Nội Bộ"
 health.2101.smallpox_outbreak.desc:0 "Lời nguyền của cái chết đã giáng xuống gia đình ta — một ca bệnh đậu mùa đã được phát hiện!"
 health.2101.smallpox_spreads.desc:0 "Lại thêm một linh hồn nữa bị nguyền rủa bởi bệnh đậu mùa."
 health.2101.bubonic_plague_outbreak.desc:2 "[ROOT.Char.GetFaith.DeathDeityName|U] đã giương lưỡi hái của [ROOT.Char.GetFaith.DeathDeityHerHis] trên lãnh địa của ta — một ca dịch hạch hạch đáng sợ đã được phát hiện!"
 health.2101.bubonic_plague_spreads.desc:0 "Lại thêm một linh hồn đứng trước cửa tử, những khối buboes đáng sợ làm hoen ố làn da của [sick_character.GetHerHis]."
 health.2101.typhus_outbreak.desc: "Một ca sốt doanh trại nguy hiểm đã len lỏi vào triều đình. Phát ban, ho và sốt hành hạ những kẻ mắc bệnh."
 health.2101.typhus_spreads.desc: "Một ca thương hàn khác lại xuất hiện."
 health.2101.consumption_outbreak.desc: "Những cơn ho dữ dội vang khắp triều đình. Bệnh lao đang rình rập trong các hành lang, cướp đi nạn nhân đầu tiên."
 health.2101.consumption_spreads.desc: "Thêm nhiều linh hồn bất hạnh rơi vào nanh vuốt của bệnh lao."
 health.2101.measles_outbreak.desc: "Những vết phát ban trên da của người bệnh đã quá rõ ràng: bệnh sởi đã xuất hiện tại triều đình."
 health.2101.measles_spreads.desc: "Ngày càng nhiều người ngã bệnh và xuất hiện những vết phát ban đỏ dữ dội trên da — dấu hiệu của bệnh sởi."
 health.2101.dysentery_outbreak.desc: "Mùi hôi thối quanh nơi này đã kể lên câu chuyện của nó. Bệnh lỵ đã xuất hiện tại triều đình."
 health.2101.dysentery_spreads.desc: "Thêm nhiều ca bệnh lỵ tiếp tục xuất hiện, nhà xí luôn chật kín cả ngày lẫn đêm."
 health.2101.ergotism_outbreak.desc: "Chứng hỏa độc đã xuất hiện tại triều đình, những cơn co giật của nạn nhân khiến ai cũng dễ dàng nhận ra."
 health.2101.ergotism_spreads.desc: "Thêm nhiều nạn nhân bị hỏa độc tấn công, khiến chân tay họ như bốc cháy dưới da."
 health.2101.imporant.desc:1 "[ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))] đáng thương của ta, [sick_character.GetFirstName], đang chiến đấu giành lấy mạng sống của [sick_character.GetHerHis]."
 health.2101.prisoner.desc:1 "Nạn nhân xui xẻo là [sick_character.GetTitledFirstName], một trong những tù nhân của ta."
 health.2101.courtier_or_guest.desc:1 "Nạn nhân bất hạnh là [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))] của ta, [sick_character.GetTitledFirstName]."
 health.2101.immune.desc:0 "\n\nDù ta miễn nhiễm với sự tàn phá của căn bệnh khủng khiếp này, sự hiện diện của [sick_character.GetFirstNamePossessive] vẫn gây nguy hiểm cho tất cả những người khác trong triều đình."
 health.2101.not_immune.desc:0 "\n\nSự ô uế chiếm lấy thân xác của [sick_character.GetHerHis] là mối nguy cho tất cả chúng ta. Chừng nào [sick_character.GetSheHe] còn mắc bệnh, không ai trong triều đình được an toàn."
 health.2101.a:0 "Cách ly [sick_character.GetHerHim] và cầu nguyện cho sự cứu rỗi."
 health.2101.a.tt:0 "Căn bệnh sẽ lan rộng không bị cản trở trong triều đình của ta"
 health.2101.b:0 "[sick_character.GetTitledFirstNameNoTooltip] bị trục xuất khỏi triều đình của ta!"
 health.2101.c:0 "Tống cổ [sick_character.GetHerHim] ra ngoài!"
 
 # Important character has dangerous disease events, by Mathilda Bjarnehed
 health.2201.t:2 "[SCOPE.Custom('EventTitleDisease')]: [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))|U] Đáng Thương Của Ta"
 health.2201.start.desc:1 "Tin dữ vừa đến. [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))] của ta, [sick_character.GetFirstName], đã mắc phải"
 disease_ill_article:0 "một"
 disease_ill:0 "cơn cảm lạnh."
 disease_pneumonic:0 "viêm phổi."
 disease_gout_ridden:0 "bệnh gout."
 disease_leper:0 "bệnh phong."
 disease_typhus:0 "thương hàn."
 disease_consumption:0 "bệnh lao."
 disease_cancer:0 "ung thư."
 disease_lovers_pox:0 "bệnh hoa liễu."
 disease_early_great_pox:0 "bệnh hoa liễu."
 disease_great_pox:0 "đại hoa liễu."
 disease_smallpox:0 "đậu mùa."
 disease_bubonic_plague:0 "dịch hạch."
 disease_measles: "bệnh sởi."
 disease_ergotism: "hỏa độc."
 disease_dysentery: "bệnh lỵ."
 missing_illness:0 "#D Thiếu bệnh #!"
 health.2201.minor_disease.desc:0 "\n\nBình thường, một căn bệnh nhẹ như vậy sẽ không đáng lo, nhưng sức khỏe của [sick_character.GetFirstNamePossessive] vốn đã yếu và điều này có thể quá sức đối với [sick_character.GetHerHim]."
 health.2201.leprosy.desc:1 "\n\nDù [sick_character.GetSheHe] có thể sống thêm nhiều năm nữa, sự dị dạng của [sick_character.GetHerHis] sẽ khiến [sick_character.GetHerHim] bị xa lánh và nghi ngờ. Ngay cả ta cũng không thể kìm nén sự ghê tởm khi nghĩ đến những vết loét mọc khắp da của [sick_character.GetHerHis]..."
 health.2201.lethal_disease.desc:0 "\n\nCăn bệnh này giết người không thương xót, quật ngã cả trẻ lẫn già, kẻ nghèo lẫn người giàu, đàn ông lẫn phụ nữ. Ta e rằng đây là hồi kết. Chỉ có phép màu mới có thể cứu [sick_character.GetHerHim]."
 health.2201.major_disease.desc:1 "\n\nTương lai vẫn chưa chắc chắn. Tử thần lảng vảng bên giường bệnh của [sick_character.GetHerHis], nhưng vẫn chưa phải hết hy vọng. [sick_character.GetFirstNameNoTooltip] có thể sống sót nếu may mắn đứng về phía [sick_character.GetHerHis].\n\nChỉ có [ROOT.Char.GetFaith.FateGodName] mới biết số phận của [sick_character.GetHerHis]."
 health.2201.court_physician.desc:1 "\n\nNgự y muốn biết [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))] của ta nên được điều trị như thế nào."
 health.2201.court_physician.desc_sick_physician:0 "\n\n[sick_character.GetSheHe|U] có thể là ngự y của ta, nhưng [sick_character.GetSheHe] vẫn chờ đợi sự chỉ dẫn từ ta."
 health.2201.a:0 "Đây là kẻ thù mà ta không thể bảo vệ [sick_character.GetHerHim] khỏi."

 #There is no longer an outbreak! 
 health.2102.t:1 "[SCOPE.Custom('EventTitleDisease')]: Một Ngày Mới"
 health.2102.start1.desc:0 "Đợt bùng phát của"
 health.2102.smallpox.desc:0 "đậu mùa"
 health.2102.bubonic_plague.desc:0 "dịch hạch"
 health.2102.start2.desc:0 "đã tàn phá triều đình của ta cuối cùng cũng chấm dứt."
 health.2102.physician.desc:1 "Những nạn nhân hoặc đã hồi phục hoặc đã rời khỏi thế gian này.\n\n[physician.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đảm bảo với ta rằng tất cả thi thể đã được xử lý đúng cách và mối đe dọa đã hoàn toàn biến mất."
 health.2102.no_physician.desc:1 "Những nạn nhân hoặc đã hồi phục hoặc đã rời khỏi thế gian này; căn bệnh đã không còn nữa."
 health.2102.2_victims.desc:0 "\n\nTuy vậy, con đường hồi phục còn dài. Chúng ta đã mất [victim_1.Custom2('MyCharacterIntroduction', ROOT.Char)] và [victim_2.Custom2('MyCharacterIntroduction', ROOT.Char)], cùng nhiều người khác. Cuộc sống vẫn tiếp diễn, nhưng vết sẹo vẫn còn."
 health.2102.1_victim.desc:0 "\n\nTuy vậy, con đường hồi phục còn dài. Chúng ta đã mất [victim_1.Custom2('MyCharacterIntroduction', ROOT.Char)] và nhiều người khác. Cuộc sống vẫn tiếp diễn, nhưng vết sẹo vẫn còn."
 health.2102.root_victim.desc:0 "\n\nCó những đêm ta vẫn tỉnh dậy trong mồ hôi lạnh, tê liệt vì sợ hãi. Ta đã vượt qua, nhưng những vết sẹo — trên da và trong tâm trí — sẽ còn ở lại nhiều năm."
 health.2102.a.victim:0 "Cuối cùng chúng ta cũng có thể nghỉ ngơi. Và tang thương."
 health.2102.a.no_victim:0 "Cuối cùng chúng ta đã an toàn."
 health.2102.a.dead_and_survivors.tt:0 "#N [THIS.Var('dead_victims_num').GetValue|0]#! nạn nhân đã chết và #P [THIS.Var('surviving_victims_num').GetValue|0]#! sống sót tại triều đình"
 health.2102.a.no_survivors.tt:0 "#N [THIS.Var('dead_victims_num').GetValue|0]#! nạn nhân đã chết tại triều đình"
 health.2102.a.no_dead.tt:0 "#P [THIS.Var('surviving_victims_num').GetValue|0]#! nạn nhân đã sống sót tại triều đình"
 health.2102.a.dead.tt:0 "[THIS.Char.GetShortUIName] đã chết trong đợt dịch"
 health.2102.a.surviving.tt:0 "[THIS.Char.GetShortUIName] đã mắc bệnh nhưng hồi phục trong đợt dịch"

 health.2202.t:1 "[SCOPE.Custom('EventTitleDisease')]: Cân Bằng Thể Dịch"
 health.2202.desc:2 "Khi ta bước xuống hành lang, ta nghe thấy tiếng cười khe khẽ. Giọng nói đó... ta không quen nghe nó rõ ràng và tươi sáng như vậy.\n\nTa đẩy cánh cửa hé mở và trước mặt ta là [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))] của ta, [sick_character.GetFirstName], dường như đã hồi phục khỏi"
 health.2202.desc.happy: "\n\nNgười thân yêu [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))] của ta đã khỏe lại! Thật khó để không rơi lệ vì vui mừng..."
 health.2202.desc.angry: "\n\nSao chuyện này có thể xảy ra? Tại sao lại là ta, [ROOT.Char.GetFaith.HealthGodName]? #EMP Tại sao!?#!"
 health.2202.desc.relieved: "\n\nMột gánh nặng lớn được trút khỏi vai ta khi [sick_character.GetSheHe] chào ta, và ta cố gắng kìm nén giọt nước mắt nhẹ nhõm."
 health.2202.desc.neutral: "\n\nTa gật đầu trang nghiêm với [sick_character.GetHerHim]."
 health.2202.a.happy:1 "Tin tuyệt vời! Ca ngợi [ROOT.Char.GetFaith.HealthGodName]!"
 health.2202.a.angry:0 "Thật không may..."
 health.2202.a.relieved:0 "Triều đình của ta giờ an toàn hơn một chút."
 health.2202.a.neutral:0 "May mắn."

 # Recruit physician event
 health.3001.disease.t:0 "[SCOPE.Custom('EventTitleDisease')]:"
 health.3001.t:1 "Ngự y của [ROOT.Char.Custom('GetCourt')|U]"
 health.3001.fallback_reason.desc:0 "Thế giới này đầy rẫy hiểm nguy, ngay cả đối với một [ROOT.Char.GetTitleTierName] và [ROOT.Char.GetHerHis] [ROOT.Char.Custom('GetCourt')|l].\n\nTa đã hỏi thăm khắp nơi để tìm lời giới thiệu, và đã tập hợp được vài lựa chọn để cân nhắc."
 health.3001.decision.desc:0 "Thế giới này đầy rẫy hiểm nguy, ngay cả đối với một [ROOT.Char.GetTitleTierName] và [ROOT.Char.GetHerHis] [ROOT.Char.Custom('GetCourtierPlural')|l]. Theo lệnh ta, các hầu cận đã đi hỏi thăm khắp nơi để tìm lời giới thiệu. Giờ họ đã tập hợp được vài lựa chọn để ta cân nhắc."
 health.3001.already_sick.desc:0 "Cuối cùng, các hầu cận của ta cũng tìm được vài người có thể phù hợp làm ngự y. Dù thế nào đi nữa, ta e rằng lúc này ta không thể quá kén chọn."
 health.3001.a:0 "Nghe nói [high_skill_option.GetFirstNameNoTooltip] khá dày dạn kinh nghiệm."
 health.3001.a.tt:1 "Một [GetCourtPositionType('court_physician_court_position').GetName()] cũng có mức lương hàng tháng là [gold_i][SCOPE.ScriptValue('court_position_physician_salary')]"
 health.3001.a.aptitude:0 "[aptitude|E] của [high_skill_option.GetUINamePossessive|U] là [high_skill_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_physician_court_position' ) )]"
 health.3001.b:0 "[low_skill_option.GetFirstNameNoTooltip] có vẻ rất nhiệt tình, nếu không có gì khác."
 health.3001.b.aptitude:0 "[aptitude|E] của [low_skill_option.GetUINamePossessive|U] là [low_skill_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_physician_court_position' ) )]"
 health.3001.c:0 "[mystic_option.GetFirstNameNoTooltip] tự nhận đã được đào tạo về \"y học thay thế.\""
 health.3001.c.aptitude:0 "[aptitude|E] của [mystic_option.GetUINamePossessive|U] là [mystic_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_physician_court_position' ) )]"
 health.3001.d.two:0 "Cả hai đều không gây ấn tượng với ta."
 health.3001.d.more:0 "Không ai trong số họ khiến ta ấn tượng."
 health.3001.e:0 "[excellent_skill_option.GetFirstNameNoTooltip] nổi tiếng rộng rãi trong giới học giả."
 health.3001.e.aptitude:0 "[aptitude|E] của [excellent_skill_option.GetUINamePossessive|U] là [excellent_skill_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_physician_court_position' ) )]"
 health.3001.d.tt:1 "Ta sẽ không tuyển ai làm [GetCourtPositionType('court_physician_court_position').GetName()]"

 #Disease treatment, by Mathilda Bjarnehed & Milla Isaksson
 health.3101.t:1 "[SCOPE.Custom('EventTitleDisease')]: Đến Lúc Điều Trị"
 health.3101.start.desc:0 "Mùi hăng nồng của những loại thuốc sắc sôi sùng sục và thuốc mỡ nghiền nhuyễn xộc thẳng vào khứu giác ta khi ta bước vào phòng làm việc của ngự y [physician.GetFirstNamePossessive]. [physician.GetSheHe|U] ngẩng đầu khỏi thứ thuốc mà [physician.GetSheHe] đang chuẩn bị.\n\n\"Đã đến lúc rồi, [ROOT.Char.Custom('FormOfAddressForLiege')]. Ta biết vài cách để điều trị căn bệnh của ngài"
 health.3101.safe_recommendation.desc:0 "Dù ta khá chắc rằng chỉ cần một loại thuốc sắc đơn giản là đủ,"
 health.3101.risky_recommendation.desc:0 "Ta sẽ đề nghị những biện pháp mạnh, nhưng"
 health.3101.mystic_recommendation.desc:0 "Nếu cho phép, ta muốn đề nghị một phương pháp... thay thế. Nhưng"
 health.3101.end.desc:1 "quyết định là của ngài, và chỉ của ngài mà thôi.\" [physician.GetSheHe|U] nhăn mặt.\n\n\"Điều này sẽ không dễ chịu đâu.\""
 health.3101.a:0 "Chỉ làm những gì cần thiết."
 health.3101.b:0 "Đã quá muộn để thận trọng!"
 health.3101.c:0 "Ta sẵn sàng... thử những điều mới."
 health.3101.d:0 "Cứ để ta yên!"
 health.3101.e:0 "Gọi ngự y đến! Ngay!"
 health.3101.e.already_looking: "Sắp rồi! Sự giúp đỡ đang trên đường!"
 health.3101.e_sick_physician:0 "Ta cần một ngự y mới!"
 health.3101.e.tt:1 "Các hầu cận của ta sẽ tìm kiếm những ứng viên [GetCourtPositionType('court_physician_court_position').GetName()]"
 health.3101.tutorial.tt:0 "Chọn tùy chọn này sẽ cho Ngài biết cách bổ nhiệm một [GetCourtPositionType('court_physician_court_position').GetName()], người có thể chữa trị bệnh của Ngài."
 health.3101.f:0 "Ôi [ROOT.Char.GetFaith.HighGodName], ta sẽ chết như thế này sao...!?"
 health_3101_already_looking_tt: "Ngài đã đang tìm kiếm một [GetCourtPositionType('court_physician_court_position').GetName()]"

 safe_diseaste_treatment.tt:0 "Phương pháp điều trị an toàn có thể tạm thời giảm triệu chứng và ít rủi ro"
 risky_diseaste_treatment.tt:0 "Phương pháp điều trị mạo hiểm có thể mang lại kết quả lớn, nhưng cũng có thể khiến triệu chứng tệ hơn hoặc gây thương tật vĩnh viễn"
 mystic_diseaste_treatment.tt:0 "Các phương pháp thần bí khó đoán. Nghi lễ kỳ lạ có thể mang lại phép màu, nhưng cũng có thể khiến Ngài phát điên..."
 safe_wound_treatment.tt:0 "Phương pháp điều trị an toàn có thể tạm thời giảm đau và ít rủi ro"
 risky_wound_treatment.tt:0 "Phương pháp điều trị mạo hiểm có thể mang lại kết quả tốt, nhưng cũng có thể khiến tình trạng tệ hơn hoặc gây thương tật vĩnh viễn"
 no_treatment_effect.tt:0 "Không điều trị, tự nhiên sẽ quyết định"
 deny_treatment_effect.tt:0 "Sẽ không có điều trị nào được thực hiện, và tự nhiên sẽ quyết định"
 pick_own_treatment_effect.adult.tt:0 "[sick_character.GetTitledFirstName] sẽ tự quyết định phương pháp điều trị mà [sick_character.GetSheHe] muốn."
 pick_own_treatment_effect.child.tt:0 "Ngự y sẽ quyết định phương pháp điều trị cho [sick_character.GetTitledFirstName]"

 health.3102.t:1 "[SCOPE.Custom('EventTitleDisease')]: [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))|U] Bệnh Tật Của Ta"
 health.3102.preamble: "Bóng tối trong căn phòng bị đẩy lùi phần nào bởi những ngọn lửa lập lòe. Trên bàn của ngự y nằm [sick_character.GetFirstName], thân thể cứng đờ vì lo sợ.\n\n"
 health.3102.start.desc:0 "Đã đến lúc quyết định cách điều trị cho [sick_character.GetFirstNamePossessive]"
 health.3102.start.desc_sick_physician:0 "Đã đến lúc quyết định cách điều trị cho"
 health.3102.treatment: "Có nhiều phương pháp điều trị khác nhau, từ thông thường đến dị thường. Ta phải quyết định phương pháp nào phù hợp nhất với nhu cầu riêng của [sick_character.GetFirstNamePossessiveNoTooltip]."
 health.3102.a:0 "Hãy thận trọng. Chỉ làm những gì cần thiết."
 health.3102.b:0 "Đã đến lúc dùng biện pháp mạnh."
 health.3102.c:0 "Chỉ có sức mạnh thiêng liêng mới cứu được [sick_character.GetHerHim] lúc này."
 health.3102.c_sick_physician:0 "Chỉ có sức mạnh thiêng liêng mới cứu được ngươi lúc này."
 health.3102.d:0 "Sẽ không có điều trị nào."
 health.3102.e_adult:1 "Quyết định thuộc về [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))] của ta."
 health.3102.e_child:1 "Ta tin vào phán đoán của ngươi."

	health.3103.t:1 "[SCOPE.Custom('EventTitleDisease')]: Sáng Hơn Một Chút"
	health.safe_treatment.1.desc:0 "[physician.GetTitledFirstName] quyết định rằng phương pháp điều trị tốt nhất là nghỉ ngơi. [physician.GetSheHe|U] xung quanh Ta với những chiếc gối mềm và nhẹ nhàng đắp Ta dưới nhiều lớp chăn. Trước khi [physician.GetSheHe] rời khỏi [ROOT.Char.Custom('GetChambersOrTent')] của Ta, [physician.GetFirstNameNoTooltip] kéo rèm lại. Lúc đó là giữa trưa.\n\nNgủ thêm một chút"
	health.safe_treatment.2.desc:0 "[physician.GetTitledFirstName] cho rằng bệnh tật của Ta xuất phát từ chế độ ăn không lành mạnh. Để phục hồi cơ thể, [physician.GetSheHe] bắt Ta chỉ ăn rau sống và uống trà thảo mộc trong một tuần. Để không cám dỗ Ta, [physician.GetSheHe] tịch thu kho đồ ăn vặt của Ta. [physician.GetSheHe|U] không bao giờ trả lại.\n\nNhững hạn chế về chế độ ăn"
	health.safe_treatment.3.desc:0 "[physician.GetTitledFirstName] bảo Ta nằm trên giường và đưa tay cho [physician.GetHerHim]. [physician.GetSheHe] xoa và vỗ lòng bàn tay Ta đến khi đỏ, rồi lặp lại với lòng bàn chân. Cuối cùng, [physician.GetSheHe] nhẹ nhàng véo Ta dọc theo các chi.\n\nThủ tục kỳ lạ này"
	health.safe_treatment.4.desc:0 "[physician.GetTitledFirstName] đưa Ta một lọ thuốc trong suốt trong một lọ mạ vàng. Vì trước đó Ta đã từng nếm vài loại thuốc của [physician.GetFirstNamePossessive], Ta lo lắng lúc đầu, nhưng khi uống thì không ngửi hay nếm thấy gì. Ta hỏi về thành phần, nhưng [physician.GetSheHe] bảo đó là công thức bí mật.\n\nLọ thuốc bí ẩn"
	health.safe_treatment.5.desc:1 "\"Thở đều nào,\" [physician.GetTitledFirstName] hướng dẫn Ta. Chiếc lông vũ trong tay [physician.GetHerHis] trông như mơ hồ khi [physician.GetSheHe] bắt đầu nhẹ nhàng vuốt dưới mũi Ta. \"Ma quỷ, biến đi!\" [physician.GetSheHe] ra lệnh khi Ta hắt xì hơi to.\n\nCảm giác nhột lạ"
	health.safe_treatment.6.desc:1 "[physician.GetTitledFirstName] tổ chức một buổi lễ nhỏ nhân danh Ta. Khi gia đình và những người thân cận đã tụ họp ở đại sảnh, [ROOT.Char.Custom('DefaultPriestTitle')] đọc bài giảng ca ngợi đức hạnh và lòng nhân từ của Ta. Buổi lễ kết thúc với một giờ cầu nguyện im lặng.\n\nHướng tới [ROOT.Char.GetFaith.HealthGodName]"
	health.safe_treatment.7.desc:1 "Ta đã trải nhiều buổi tối với [physician.GetTitledFirstName] ngồi bên giường, đọc những đoạn kinh từ [ROOT.Char.GetFaith.ReligiousText].\n\nLời của [ROOT.Char.GetFaith.HealthGodName]"
	health.safe_treatment.8.desc:0 "[physician.GetTitledFirstName] mời [ROOT.Char.Custom('DefaultPriestTitle')] mang đến ca sĩ giỏi nhất trong triều, hóa ra là một đứa trẻ với giọng tenor sáng. Nhiều ngày liền, đứa trẻ hát ru Ta ngủ.\n\nGiọng hát dịu dàng"
	health.safe_treatment.9.desc:0 "Hơi nước bốc lên từ cốc khi [physician.GetTitledFirstName] khuấy bột xanh. [physician.GetSheHe|U] giải thích công dụng chữa bệnh của thảo mộc, rồi ra hiệu Ta uống. \"Rễ cũng có trong đó đấy,\" [physician.GetSheHe] tự hào tiết lộ.\n\nLoại thảo mộc đắng"
	health.safe_treatment.10.desc:0 "[physician.GetTitledFirstName] khẳng định rằng khí huyết của Ta mất cân bằng và cách tốt nhất để phục hồi là xả máu. Sau khi tham khảo bảng sao, [physician.GetSheHe] quyết định xả máu từ nách và thái dương.\n\nViệc xả máu"
	health.safe_treatment.11.desc:0 "[physician.GetTitledFirstName] bảo ta cởi quần áo và quỳ xuống với mông nhổng lên. Điều đó đã đủ khó xử rồi, nhưng khi nhìn thấy công cụ trong tay [physician.GetHerHis], ta suýt chút nữa đã bỏ chạy. [physician.GetSheHe|U] chắc hẳn đã nhận ra điều đó vì [physician.GetSheHe] vỗ nhẹ vào vai ta đầy trấn an và bảo ta hãy thả lỏng.\n\nPhương pháp thụt rửa"
	health.safe_treatment.12.desc:0 "[physician.GetTitledFirstName] bước vào [ROOT.Char.Custom('GetChambersOrTent')] với một cái bình gốm ôm trong tay và ngồi xuống cạnh giường ta. [physician.GetSheHe|U] lấy ra một con đỉa từ bình và nhìn nó một cách đầy trìu mến trước khi cẩn thận đặt nó lên mặt ta. \"Hãy nằm yên, thưa [ROOT.Char.Custom('FormOfAddressForLiege')]. Tốt hơn là đừng làm phiền chúng đang ăn.\"\n\nNhững con đỉa"
	health.safe_treatment.13.desc:0 "Khi [physician.GetTitledFirstName] vào [ROOT.Char.Custom('GetChambersOrTent')] Ta, [physician.GetSheHe] theo sau là mùi hôi khó chịu. Nguồn gốc từ lọ trong tay [physician.GetHerHis] — \"hỗn hợp phân bò và thảo mộc cho cao dán của ngài, [ROOT.Char.Custom('FormOfAddressForLiege')].\" Khi [physician.GetFirstName] bôi lên ngực Ta, Ta suýt nôn.\n\nCuối cùng, cao dán"
	health.safe_treatment.14.desc:0 "[physician.GetTitledFirstName] mang đến cho Ta hỗn hợp từ cây buckthorn và senna. Lúc đầu Ta nghĩ thuốc vô tác dụng, nhưng cùng ngày Ta cảm thấy ruột quặn và chạy vào nhà vệ sinh. Khi Ta kêu đau, [physician.GetFirstName] bảo chất độc đã được tống ra theo phân.\n\nCuối cùng, việc thanh lọc"
	health.safe_treatment.15.desc:0 "[physician.GetTitledFirstName] đưa cho ta một chiếc đĩa với xác mèo cháy đen và giục ta ăn. Khi ta ăn, [physician.GetSheHe] kể cho ta nghe việc [physician.GetSheHe] đã đuổi theo con mèo béo đó quanh thái ấp của ta hàng giờ như thế nào. Ta nghĩ [physician.GetSheHe] muốn được khen ngợi vì công sức vất vả, nhưng mùi vị ghê tởm của bữa ăn khiến ta im lặng.\n\nCuối cùng, thức ăn đầy dầu mỡ"
	health.safe_treatment.16.desc:0 "[physician.GetTitledFirstName] mang xô cóc kêu tới [ROOT.Char.Custom('GetChambersOrTent')] và bảo Ta lộ phần thân trên. [physician.GetSheHe|U] lấy con cóc, moi ruột và đặt xác vẫn còn co giật lên ngực Ta. [physician.GetSheHe|U] làm tới khi xô trống và ngực Ta phủ đầy.\n\nPhương pháp cóc"
	health.safe_treatment.17.desc:1 "[physician.GetTitledFirstName] tới [ROOT.Char.Custom('GetChambersOrTent')] và đưa Ta một cốc nước màu vàng. [physician.GetSheHe|U] bảo Ta bịt mũi khi uống. Khi chất lỏng ấm chạm môi, Ta gần như nhổ ra ngay. Ta hỏi thành phần và [physician.GetSheHe] tiết lộ đó là nước tiểu của lợn cái mang thai.\n\nChất thải động vật"
	health.safe_treatment.18.desc:0 "[physician.GetTitledFirstName] thò tay vào cái xô mà [physician.GetSheHe] mang đến [ROOT.Char.Custom('GetChambersOrTent')] của ta. Khi [physician.GetSheHe] rút tay ra, một con cá nhỏ đang ngọ nguậy giữa những ngón tay [physician.GetHerHis]. \"Há miệng ra nào,\" [physician.GetSheHe] nói và thả nó vào miệng ta. Ta cố gắng không nôn ra khi nó ngọ nguậy trong cổ họng.\n\nBất cứ thứ gì trong con cá đó"
	health.safe_treatment.19.desc:0 "Chất lỏng trong chén ấm và chua. \"Nó sẽ đuổi đi nhiệt khác,\" [physician.GetTitledFirstName] giải thích.\n\nLoại thuốc"
	health.safe_treatment.20.desc:0 "Để cân bằng khí huyết, [physician.GetTitledFirstName] bắt Ta uống nước mặn để gây nôn. Rất hiệu quả.\n\nĐổ hết dạ dày"
	health.safe_treatment.21.desc:0 "Để chữa bệnh, [physician.GetTitledFirstName] bảo Ta ngủ treo ngược vài ngày. \"Nó sẽ cân bằng lại,\" [physician.GetSheHe] trấn an.\n\nTa cảm thấy như dơi.\n\nTư thế ngủ lạ lùng"

	health.3103.end.desc:0 "Hoá ra chính xác là điều Ta cần. Hiện tại, triệu chứng tệ nhất đã giảm, và thế giới có vẻ sáng hơn một chút."
	health.3103.a:0 "Làm tốt lắm, [physician.GetFirstNameNoTooltip]."
	health.3104.t:1 "[SCOPE.Custom('EventTitleDisease')]: Tệ Hơn Nữa"
	health.3104.end.desc:0 "không cải thiện gì. Thực ra, Ta cảm thấy còn tệ hơn!"
	health.3104.a:0 "Đi đi. Ta muốn nghỉ..."

	health.3105.t:1 "[SCOPE.Custom('EventTitleDisease')]: Phép Màu Y Học"
	health.risky_treatment_medicine.1.desc:0 "Cái bình mà [physician.GetTitledFirstName] mang theo bên mình đến [ROOT.Char.Custom('GetChambersOrTent')] phát ra tiếng vo ve kỳ lạ. Trước khi ta kịp ngăn [physician.GetHerHim], [physician.GetSheHe] đã ném nó xuống sàn, nơi nó phát nổ trong một đám mây mảnh sành và bầy ong giận dữ. Khi ngự y của ta chạy khỏi phòng, ta vẫn là mục tiêu duy nhất của chúng."
	health.risky_treatment_medicine.2.desc:0 "Ta không thể tin vào mắt mình khi [physician.GetTitledFirstName] lôi một bàn tay bị chặt rời ra từ túi xách của mình. Những đốm đen trên ngón tay của nó khiến ta ớn lạnh và ta yêu cầu biết [physician.GetSheHe] đã lấy nó ở đâu. [physician.GetSheHe|U] chỉ ra hiệu im lặng và tiếp tục chà bàn tay bị chặt đó lên ngực ta."
	health.risky_treatment_medicine.3.desc:0 "[physician.GetTitledFirstName] đưa Ta một lọ thuốc kỳ lạ. Không mùi, không vị, trông như bạc lỏng. Thuốc dễ uống nhưng Ta không thể kìm nén sự khó chịu."
	health.risky_treatment_medicine.4.desc:0 "[physician.GetTitledFirstName] bảo phương pháp duy nhất là chạy trần vào nửa đêm. Trăng tròn tiếp theo, [physician.GetSheHe] bắt Ta cởi đồ chạy qua hoang dã. \"Đừng dừng cho đến khi chân mỏi!\" [physician.GetSheHe] la. \"Đuổi ma quỷ bằng mồ hôi!\""
	health.risky_treatment_medicine.5.desc:0 "Bột màu vàng thơm phức. Ta kinh hãi khi thấy [physician.GetTitledFirstName] trộn với lưu huỳnh và rắc lên túi mật hươu beaver còn ấm. Con vật bị dại, sùi bọt mép, dấu hiệu bệnh rõ ràng. \"Chúng ta chống ác bằng ác, [ROOT.Char.Custom('FormOfAddressForLiege')].\""
	health.risky_treatment_medicine.6.desc:0 "[physician.GetTitledFirstName] cầm dao tiếp cận Ta. [physician.GetSheHe|U] giữ cánh tay Ta và rạch chính xác, gần như không phá da. Sau đó, [physician.GetSheHe|U] bôi thứ hôi lên vết thương. Nhìn thoáng qua, Ta không thể chịu nổi."
	health.risky_treatment_medicine.7.desc:0 "[physician.GetTitledFirstName] đưa cho ta một cái đĩa chứa chất bột màu xám. Rõ ràng nó bao gồm vảy khô từ một người có tình trạng tồi tệ hơn ta. [physician.GetTitledFirstName] không hề có dấu hiệu đùa giỡn khi [physician.GetSheHe] bảo ta hãy cúi xuống và hít vào nhiều nhất có thể."
	health.risky_treatment_medicine.8.desc:0 "Bột đỏ rất bắt mắt. Một người hầu từng thử, lưỡi sưng lên, [physician.GetTitledFirstName] mắng nghiêm khắc. [physician.GetTitledFirstName] khuấy bột vào chén nước rồi cho Ta uống một thìa."
	health.risky_treatment_medicine.9.desc:0 "Mắt Ta mở to khi [physician.GetTitledFirstName] dẫn một con dê vào [ROOT.Char.Custom('GetChambersOrTent')]. Mùi xì hơi khiến Ta bịt mũi, nhưng bác sĩ kéo tay Ta ra. \"Xin lỗi, [ROOT.Char.Custom('FormOfAddressForLiege')], nhưng đây là phương pháp.\" [physician.GetSheHe|U] gợi hít thở sâu."
	health.risky_treatment_surgery.1.desc:0 "[physician.GetTitledFirstName] đưa Ta một cốc thuốc lạ. Ta tê liệt, mí mắt sụp. \"Xin lỗi, [ROOT.Char.Custom('FormOfAddressForLiege')], nhưng ngài không muốn tỉnh cho phần sau,\" [physician.GetSheHe] nói. Hoảng loạn, Ta muốn đứng dậy nhưng cơ thể không nghe lời."
	health.risky_treatment_surgery.2.desc:0 "Phụ tá của [physician.GetTitledFirstNamePossessive] cam đoan với [physician.GetHerHim] rằng loại thuốc đã làm ta mê man. Ôi, [physician.GetSheHe] đã sai lầm đến mức nào! Ta không thể nói cũng không thể cử động, nhưng ta vẫn nhận thức được mọi thứ họ làm với mình. Ta cố hét lên và vùng vẫy, nhưng ta là tù nhân trong chính cơ thể mình. Thủ thuật dường như kéo dài mãi mãi..."
	health.risky_treatment_amputation.1.desc:0 "[physician.GetTitledFirstName] thắt dây đai cuối cùng, cố định ta trên bàn mổ. \"Thần sẽ không nói dối ngài, thưa [ROOT.Char.Custom('FormOfAddressForLiege')]. Điều này sẽ đau đớn khủng khiếp, nhưng phải làm vậy.\"\n\nTa cố phản đối khi [physician.GetFirstName] mang cái cưa ra, nhưng do loại thuốc an thần mà [physician.GetSheHe] đã bắt ta uống, ta nói líu lưỡi không thể hiểu nổi."
	health.risky_treatment_disfigurement.1.desc:0 "[physician.GetTitledFirstName] thông báo với ta rằng [physician.GetSheHe] đã xác định được mô bị nhiễm độc là nguồn gốc căn bệnh của ta, và việc loại bỏ nó rất có thể sẽ chữa khỏi cho ta. Ta rất vui mừng và đồng ý phẫu thuật.\n\nTa ước gì [physician.GetFirstName] đã nói với ta rằng \"mô\" đó chính là khuôn mặt của ta."
	health.risky_treatment_eye.1.desc:0 "[physician.GetTitledFirstName] bắt ta uống một chén thuốc phiện trước khi trói ta lên bàn mổ [physician.GetHerHis]. Ta gần như thiếp đi trong khi [physician.GetSheHe] chuẩn bị dụng cụ [physician.GetHerHis], nhưng khi [physician.GetSheHe] giơ dao mổ về phía mắt ta, ta cảm thấy tỉnh táo lạ thường. \"Thần xin lỗi, thưa [ROOT.Char.Custom('FormOfAddressForLiege')], nhưng chúng ta phải loại bỏ tận gốc vấn đề.\""
	health.3105.end.desc:0 "\n\nKỳ lạ thay, Ta không còn cảm giác triệu chứng nào..."
	health.3105.a:0 "Thật là một phép màu!"
 
	health.3106.t:1 "[SCOPE.Custom('EventTitleDisease')]: Cân Bằng Khí Huyết"
	health.3106.end.desc:0 "\n\nPhương pháp điều trị gần như khó chịu như triệu chứng của Ta, nhưng dường như có hiệu quả. Dù chưa hoàn toàn khỏi, Ta cảm thấy khá hơn nhiều."
	health.3106.a:0 "Ta sẽ sống thêm một ngày nữa."

	health.3107.t:1 "[SCOPE.Custom('EventTitleDisease')]: Điều Trị Thảm Họa"
	health.3107.death.desc:0 "\n\nKhi tỉnh dậy, Ta cảm nhận được tận xương tủy. Có điều gì đó đã sai. Rất, rất sai."
	health.3107.end.desc:0 "\n\nTa nghĩ không thể tệ hơn những gì đã trải qua, nhưng [physician.GetFirstNameNoTooltip] chắc chắn chứng minh Ta sai!"
	health.3107.a:0 "Ta cảm thấy… yếu…"
	health.3107.b:0 "Chuyện này sẽ không xảy ra nữa. Ngươi hiểu không?"
	health.3107.c:0 "Tất cả chúng ta đều biết rủi ro. Ngươi được tha."
	health.3107.d:0 "Vệ binh! Khóa [physician.GetHerHim] lại!"
	health.3107.d.tt:0 "Một khi đã ở trong ngục của ta, ta có thể quyết định phải làm gì với [physician.GetTitledFirstName]"
	health.3107.e:0 "Kẻ phản bội này đáng chết!"
	health.3107.f:0 "Ôi [physician.GetFirstNameNoTooltip], ngươi đã làm gì với chính mình?"

	health.3108.t:1 "[SCOPE.Custom('EventTitleDisease')]: Quyền Năng Lớn Hơn"
	health.mystic_treatment_occult.cannibal.desc:0 "\"Uống cái này đi,\" [physician.GetTitledFirstName] thì thầm. Chưa kịp nuốt, cảm giác lạ bắt đầu. Tay chân Ta tê liệt, nhưng bên trong, một ngọn lửa bùng lên…\n\n\"Bây giờ, ăn cái này.\" Những miếng thịt ấm, ướt và dai. Ngọn lửa thích điều đó. Nó muốn nhiều hơn. Khi [physician.GetSheHe] đưa phần cánh tay còn lại, Ta ăn tới mức nôn mửa."
	health.mystic_treatment_occult.deviant.desc:0 "[physician.GetTitledFirstName] bảo ta cởi bỏ y phục và dùng dầu xoa bóp khắp làn da. Khi [physician.GetSheHe] lướt bàn tay [physician.GetHerHis] về phía vùng nhạy cảm nhất của ta, đôi mắt [physician.GetHerHis] tìm kiếm ánh mắt ta, ta nhận ra mình khao khát điều này. Ta khẽ gật đầu.\n\nChẳng bao lâu sau, nhiều bàn tay khác cùng tham gia vào [physician.GetFirstNamePossessive]. Mượt mà, thô ráp, nhăn nheo, thanh mảnh, mạnh mẽ. Khi đầu gối ta khuỵu xuống, họ đã đỡ lấy ta, và ta buông mình theo những cái chạm của họ."
	health.mystic_treatment_occult.1.desc:0 "Bị giam trên giường, các Bạn Bè bảo Ta rằng khói từ đống lửa có thể nhìn thấy hàng dặm. Hơn hai tá động vật quý đã bị hi sinh trong đêm, một lễ tế lớn. Theo lệnh [physician.GetTitledFirstNamePossessive], Ta xoa tro lên da hai tuần."
	health.mystic_treatment_occult.2.desc:0 "[physician.GetTitledFirstName] hướng dẫn ta bước vào bồn tắm trống và để ta tự cởi đồ trong riêng tư. Sự trở lại của [physician.GetHerHis|U] được báo trước bằng một tiếng \"beee!\" vang dội. Theo sau [physician.GetSheHe|U] là một người hầu và nửa tá dê. Với bàn tay điêu luyện, [physician.GetFirstNameNoTooltip] tiến hành bắt lũ dê và rạch cổ chúng ngay trên bồn tắm, từng con một.\n\nNhững vết bẩn trên sàn nhà sẽ không bao giờ tẩy sạch được."
	health.mystic_treatment_occult.3.desc:1 "[physician.GetTitledFirstName] nói với ta rằng [ROOT.Char.GetFaith.HealthGodName] đòi hỏi một sự hiến tế. Cuối buổi chiều hôm đó, ta nghe thấy tiếng thét.\n\nLần theo âm thanh đó, ta tìm thấy [physician.GetFirstNameNoTooltip] đang khom người trên một thi thể, sự hoảng loạn hiện rõ trong đôi mắt [physician.GetHerHis], máu dính đầy đôi tay [physician.GetHerHis]. \"Tất cả là vì lợi ích của vương quốc...!\" [physician.GetSheHe] thều thào."
	health.mystic_treatment_occult.4.desc:0 "[physician.GetFirstName] đưa Ta một túi thảo mộc và bảo đi tìm “thần hộ mệnh”. Ta lang thang hoang dã nhiều ngày, ăn rễ từ túi, ngủ dưới sao trời. Cuối cùng, Ta cảm nhận sự hiện diện. Trước mặt là một con quái vật sừng to. Ta quay đi và chạy.\n\nVề nhà an toàn trên giường, giấc ngủ không đến. Liệu Ta có phải quái vật?"
	health.mystic_treatment_occult.5.desc:0 "[physician.GetTitledFirstName] đứng cuối giường khi Bạn Bè thắp nến. Một nồi được đặt vào tay Ta — nghe âm thanh, bên trong là một con vật nhỏ sợ hãi. \"Sinh vật này sẽ gánh vác nỗi đau thay ngài,\" [physician.GetSheHe] giải thích. Rồi tiếng tụng kinh bắt đầu."
	health.mystic_treatment_questionable.1.desc:0 "[physician.GetFirstName] đặt ta ngồi trước một chiếc gương cao và thắp một vòng nến xung quanh ta. \"Chúng ta cần liên lạc với một bản thể khác của ngài,\" [physician.GetSheHe] bình thản tuyên bố. Khi ta nhướng mày nhìn [physician.GetHerHim], [physician.GetSheHe] đặt một bàn tay lên vai ta. \"Việc này có thể... thay đổi ngài đấy.\""
	health.mystic_treatment_questionable.2.desc:1 "Căn phòng chỉ sáng nhờ ngọn nến. Hướng về cửa sổ phía tây, [physician.GetTitledFirstName] sơn móng tay Ta bằng vài giọt dầu. Ta cảm thấy nóng trên da khi [physician.GetSheHe] đưa tay Ta về phía ngọn lửa. \"Đừng lo, [ROOT.Char.Custom('FormOfAddressForLiege')]. Nhờ trí tuệ [ROOT.Char.GetFaith.HealthGodName], ngài sẽ được thanh tẩy.\""
	health.mystic_treatment_questionable.3.desc:1 "\"Mặt trăng đòi hỏi lòng tận tụy của ngài,\" [physician.GetTitledFirstName] nói, trước khi đưa Ta một chiếc bánh có mùi cay. Vài phút sau khi ăn, Ta ngước lên bầu trời đêm và ứng khẩu bài thơ tuyệt vời nhất. Sau này, Ta quên lời…"
	health.mystic_treatment_questionable.4.desc:0 "[physician.GetTitledFirstName] bắt Ta uống một loại thuốc nặng, mỗi tối trước khi ngủ. \"Nó nới lỏng thể xác, để thần linh vào cơ thể,\" [physician.GetSheHe] trấn an. \"Cũng khá… thư giãn,\" [physician.GetSheHe] cười với Ta."
	health.mystic_treatment_questionable.5.desc:0 "[physician.GetFirstName] bảo việc giải nghĩa [ROOT.Char.GetFaith.ReligiousText] khó khăn, nhưng thanh tẩy bằng lửa là nghệ thuật cổ xưa. Ta đâu biết [physician.GetSheHe] sẽ bắt Ta đi trên than hồng."
	health.mystic_treatment_questionable.6.desc:2 "[physician.GetTitledFirstName] bảo rằng [ROOT.Char.GetFaith.HealthGodName] đòi hỏi thử thách tâm trí. Chúng Ta đi đến một hồ nhỏ. Nắm tay nhau, bước vào nước. Ta choáng khi [physician.GetFirstNameNoTooltip] giữ vai Ta. Chắc Ta bất tỉnh, vì không nhớ chuyện gì xảy ra tiếp theo…"
	health.3108.end.desc:0 "\n\nSáng nay tỉnh dậy, những cơn đau và khó chịu quen thuộc đã biến mất. [physician.GetSheHe]… đã chữa Ta?"
	health.3108.a:0 "Ta không biết cảm giác thế nào… Hay tin vào điều gì."

	health.3109.t:1 "[SCOPE.Custom('EventTitleDisease')]: Cảm Xúc Mâu Thuẫn"
	health.3109.end.desc:0 "\n\nTa vẫn chưa chắc cảm giác của mình về những gì đã xảy ra, nhưng không thể phủ nhận hầu hết triệu chứng đã biến mất."
	health.3109.a:0 "Ta không biết mình mong đợi gì, nhưng chắc chắn không phải điều này."

	health.3110.t:1 "[SCOPE.Custom('EventTitleDisease')]: Vào Bóng Tối"
	health.3110.end.desc:0 "\n\nTâm trí Ta hẳn đã bị thay đổi, xoắn vặn bởi một trò ma quái. Ta sẽ không bao giờ tự nguyện đồng ý điều này. Ký ức ám ảnh Ta…"

 # Punishment for mistreating important people
	health.3200.death.desc:0 "Dù Ta có thể nhận ra khuôn mặt [sick_character.GetTitledFirstNamePossessive], nó vẫn không giống [sick_character.GetHerHim]. [sick_character.GetSheHe|U] không còn… hiện diện. Phần còn lại được quấn trong tấm vải dày, che chi tiết kinh hoàng của thất bại [physician.GetTitledFirstNamePossessive]."
	health.3200.failure.desc:0 "Ta phải mất một lúc mới nhận ra [sick_character.GetTitledFirstName]. [sick_character.GetSheHe|U] bầm tím và sưng vù đến mức hầu như không còn hình người. Khi ta nắm lấy bàn tay [sick_character.GetHerHis], [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))] của ta cố gắng nói điều gì đó nhưng không một âm thanh nào thốt ra từ đôi môi [sick_character.GetHerHis]."
	health.3200.failure.desc_2:0 "Khi Ta đến gần [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))] [sick_character.GetTitledFirstNamePossessive] [ROOT.Char.Custom('GetChambersOrTent')], Ta nghe tiếng hét kinh hoàng; gần như không phải con người, đầy đau đớn. Ta lao vào thì thấy [sick_character.GetFirstNameNoTooltip] sụp xuống trên sàn, #EMP đầy máu#!"
	health.3200.failure.desc_3:0 "Ta mất một lát để hiểu mức độ thiệt hại [sick_character.Custom2('MyCharacterIntroduction', ROOT.Char)] gây ra cho cơ thể [sick_character.GetHerHis]; [sick_character.GetSheHe] đầy máu và vẫn cầm dao động tác mạnh. Trước khi Ta can thiệp, [sick_character.GetSheHe] liếc dao đầy thất vọng rồi bất tỉnh."
	health.3200.end.desc:0 "\n\nVị ngự y [physician.Custom2('InsultAdjective', ROOT.Char)] đang đứng ở góc phòng, lo âu vò xé đôi bàn tay [physician.GetHerHis]..."
	health.3200.death.tt:0 "[sick_character.GetTitledFirstName] chết trong khi điều trị."

	health.3201.desc:1 "Có một điều gì đó hoang dại trong đôi mắt của [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))] [sick_character.GetFirstNamePossessive] của ta. Ta hỏi [sick_character.GetHerHim] đã nhìn thấy những gì, nhưng không một lời nào thốt ra từ đôi môi [sick_character.GetHerHis].\n\n\""
	health.3201.occult.desc:0 "Một Bạn Bè nói rằng [physician.GetTitledFirstName] đã thực hiện nghi lễ ác quỷ, gây ra đau khổ [sick_character.GetFirstNamePossessive]. Câu chuyện rùng rợn, ít nhất là vậy."
	health.3201.occult.desc_sick_physician:0 "Một Bạn Bè nói rằng [physician.GetTitledFirstName] đã thực hiện nghi lễ ác quỷ, gây ra đau khổ cho chính [physician.GetHerHis]. Câu chuyện rùng rợn, ít nhất là vậy."
	health.3201.questionable.desc:0 "Có vẻ một trong các phương pháp “thay thế” của [physician.GetFirstNamePossessive] đã thất bại thảm hại."
	health.3201.c:0 "Đừng hé răng một lời nào, [physician.GetFirstNameNoTooltip]!"

	court_physician_treatment_success_message_title:0 "Điều Trị Thành Công"
	court_physician_treatment_failure_message_title:0 "Điều Trị Thất Bại"

	inform_relatives_about_disease_treatment_effect.safe_success.desc:0 "[physician.GetTitledFirstName] đã giảm triệu chứng của [sick_character.GetTitledFirstNamePossessive]"
	inform_relatives_about_disease_treatment_effect.safe_failure.desc:0 "Việc điều trị [sick_character.GetTitledFirstNamePossessive], do [physician.GetTitledFirstName] thực hiện, đã thất bại."
	inform_relatives_about_disease_treatment_effect.risky_critical_success.desc:0 "[physician.GetTitledFirstName] đã chữa khỏi [sick_character.GetTitledFirstNamePossessive]"
	inform_relatives_about_disease_treatment_effect.risky_success.desc:0 "[physician.GetTitledFirstName] đã giảm đáng kể triệu chứng của [sick_character.GetTitledFirstNamePossessive]"
	inform_relatives_about_disease_treatment_effect.risky_failure.desc:0 "[physician.GetTitledFirstName] đã làm hỏng việc điều trị cho [sick_character.GetTitledFirstName]."
	inform_relatives_about_disease_treatment_effect.mystic_failure.desc:0 "[sick_character.GetTitledFirstName] không còn như trước sau khi nghi lễ của [physician.GetTitledFirstNamePossessive] thất bại!"
	physician_level_up_chance_effect.t:0 "Kiến thức của $court_physician_court_position$ tăng lên"
 
 # Wound treatment, by Linnéa Thimrén
	health.4000.t:1 "$health_wounded_title$ [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))|U] Bị Thương"
	health.4000.start.desc:0 "[ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))] [sick_character.GetTitledFirstName] của Ta đã bị thương,"
	health.4000.infected_wound.desc:1 "và thịt của [sick_character.GetHerHis] đã nhiễm trùng và sưng tấy.\n\nNếu được điều trị đúng cách, và [ROOT.Char.GetFaith.HealthGodName] thương xót, [sick_character.GetSheHe] sẽ qua khỏi."
	health.4000.gangrene.desc:1 "và thịt của [sick_character.GetHerHis] đã thối rữa và chết đi.\n\nMàu đen lan trên da [sick_character.GetHerHis], chỉ có [ROOT.Char.GetFaith.FateGodName] biết liệu [sick_character.GetSheHe] có qua khỏi."
	health.4000.close_to_death_wounded.desc:0 "vết thương rất sâu. Mỗi nhịp thở của [sick_character.GetHerHis|U] là một trận chiến, và Ta lo rằng chỉ có phép màu mới cứu được [sick_character.GetHerHim]."
	health.4000.very_wounded.desc:0 "và vết thương vô cùng nghiêm trọng. Ta sợ rằng cơ thể [sick_character.GetHerHis] không đủ khỏe để tự mình chống chọi với điều này; ta cảm thấy cái chết đang lảng vảng bên giường bệnh của [sick_character.GetHerHis]."
	health.4000.wounded.desc:0 "và [sick_character.GetSheHe] rõ ràng đang đau đớn. Tình trạng này nhẹ, nhưng bệnh tật không nên coi thường."
	health.4000.a:0 "Không còn gì có thể làm được."

	health.4001.start.desc:0 "\"Đã đến lúc điều trị vết thương của ngài.\""
	health.4001.safe_recommendation.desc:0 "Ta chắc chắn một phương pháp đơn giản là đủ, nhưng"
	health.4001.gangrene.desc:0 "Vì cái chết đã lan trong thịt, Ta e rằng phải khuyến nghị… #EMP biện pháp quyết liệt#!, nhưng"
	health.4001.infection.desc:0 "Vì vết thương bị nhiễm trùng, Ta phải khuyến nghị biện pháp quyết liệt, nhưng"
	health.4001.risky_recommendation.desc:0 "Ta khuyên dùng biện pháp quyết liệt, nhưng"

	health.4002.start.desc:0 "\"Đã đến lúc điều trị [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))] của ngài.\""
	health.4002.start.desc_sick_physician:0 "\"Đã đến lúc điều trị cho Ta.\""

	health.4101.t:1 "$health_wounded_title$ Đang Hồi Phục"
	health.4101.desc_infection:0 "Khi [physician.GetFirstName] bắt đầu nghiền nhẹ thảo mộc với mật ong, Ta tưởng [physician.GetSheHe] đùa — chắc những thứ này không giúp gì. Khi [physician.GetSheHe] bôi lên vết thương đau nhức,"
	health.4101.desc_1:0 "Khi [physician.GetFirstName] đổ một chai rượu lên vết thương, cơn đau vượt quá mức vết thương gây ra.\n\n\"Hãy chịu đựng, [ROOT.Char.GetTitleTierName] của Ta. Điều này cần để loại bỏ sự ô uế bên trong.\"\n\nVà quả thật, sau khi băng chặt vết thương,"
	health.4101.desc_2:0 "[physician.GetFirstName] nhanh chóng xỏ kim và bắt đầu khâu vết thương cho ta như thể [physician.GetSheHe] đang thêu thùa bên bếp lửa vậy. Cảnh tượng những mũi khâu giữ da thịt ta lại với nhau thật rùng rợn! Thời gian trôi qua, nó"
	health.4101.desc_end:0 "vết thương bắt đầu lành."
	health.4101.a:0 "Tuyệt vời, [physician.GetFirstNameNoTooltip]!"

	health.4102.t:1 "$health_wounded_title$ Đau Nhức"
	health.4102.desc_infection:0 "Chiếc túi mà [physician.GetFirstName] mang vào [ROOT.Char.Custom('GetChambersOrTent')] của ta tự chuyển động, bên trong co giật như thể còn sống. Khi [physician.GetFirstNameNoTooltip] lôi ra một con đỉa đang ngọ nguậy, ta cảm thấy mặt mình cắt không còn giọt máu. \"Hãy nằm yên nào, [ROOT.Char.GetTitleTierName] của thần...\"\n\nBất cứ hiệu quả nào mà [physician.GetSheHe] hy vọng chắc chắn không phải là thế này; khi lũ sinh vật đó rút máu ta, nó"
	health.4102.desc_end:0 "không cân bằng được khí huyết, và cơn đau càng tồi tệ hơn."
	health.4102.a:0 "Argh…! Đừng chạm vào Ta!"

	health.4103.t:1 "$health_wounded_title$ Đôi Tay Hồi Phục"
	health.4103.risky_treatment_medicine.1.desc:0 "Khi [physician.GetFirstName] nhóm lửa trong [ROOT.Char.Custom('GetChambersOrTent')] của ta, ta cho rằng [physician.GetSheHe] muốn dùng hơi nóng để giúp cân bằng các dịch thể. Tuy nhiên, khi phụ tá của [physician.GetHerHis] bắt đầu trói ta xuống giường, ta nhận thấy thanh sắt đang đỏ rực trong ngọn lửa."
	health.4103.risky_treatment_disfigurement.1.desc:0 "[physician.GetFirstName] nhìn thấy nỗi kinh hoàng của ta khi [physician.GetSheHe] lấy ra một con dao dài và một chiếc kim cong từ túi [physician.GetHerHis]. \"Để cơ thể ngài lành lại, chúng ta cần loại bỏ tất cả các mô bị nhiễm độc và khâu vết thương lại.\"\n\nTa không biết điều gì đau đớn hơn — cơn đau như thiêu đốt khi da thịt bị cắt và cảm giác bị kim đâm qua da, hay hình ảnh của chính mình sau đó."
	health.4103.end.desc:0 "\n\nThật ngạc nhiên, Ta thấy cơ thể mình đang trên đường hồi phục!"

	health.4104.t:1 "$health_wounded_title$ Đang Hồi Phục"
	health.4104.end.desc:0 "\n\nSau khi trải qua điều trị đó, Ta khó tìm niềm vui trong việc cơ thể hồi phục, nhưng Ta đang hồi phục."

	health.4105.t:1 "$health_wounded_title$ Thảm Họa Xảy Ra"
	health.4105.end.desc:0 "\n\nTa không tin mình có thể đau hơn, nhưng sớm nhận ra mình đã sai."


