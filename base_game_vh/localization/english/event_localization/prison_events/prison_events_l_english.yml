l_english:
  prison.1001.t:0 "Sự Thật hay Đau Khổ"
  prison.1001.start.desc:1 "Giấc mơ ban ngày của Ta kết thúc đột ngột khi cánh cửa buồng giam bị mở tung. Bóng dáng người lính gác quen thuộc, nhưng [actor.GetWomanMan] đứng phía sau hắn… Ôi. Ôi không.\n\n"
  prison.1001.rack.desc:0 "[actor.GetTitledFirstName] trói Ta lên khung kéo [actor.GetHerselfHimself], nụ cười thích thú hiện trên môi [actor.GetHerHis]. 'Ta tin Ngài đã nghe thấy những tiếng khác. Tiếng thét, tiếng xương và gân răng rắc.'"
  prison.1001.whip.desc:0 "[actor.GetTitledFirstName] quay roi trong tay [actor.GetHerHis]. 'Ôi, cái roi có vẻ vô hại, nhưng nó có thể tách thịt khỏi xương tốt như bất kỳ con dao nào.'"
  prison.1001.rats.desc:0 ""Những con chuột này có vẻ hiền lành," [actor.GetTitledFirstName] nói, ra hiệu về phía một cái thùng đang kêu rít khẽ. "Nhưng nếu chúng ngửi thấy mùi lửa, chúng sẽ vui vẻ gặm nhấm #emp bất cứ thứ gì#! để thoát thân.""
  prison.1001.poetry.desc:0 "[actor.GetTitledFirstName] rút ra một cuộn giấy dài, dài, #EMP dài#! giấu dưới nách [actor.GetHerHis].\n\n'Hy vọng Ngài không phiền nếu Ta đọc cho Ngài nghe vài tập thơ… #EMP tuyệt phẩm#! của Ta.'"
  prison.1001.my_secret.desc:1 "'Ngài đang giấu điều gì đó, Ta đoán được,' [actor.GetTitledFirstName] nói. 'Nói thật cho Ta, nếu không…'"
  prison.1001.anothers_secret.desc:1 "'Ngài biết điều gì đó về [reveal_secret_owner.Custom2('MyCharacterIntroductionNoComma' SCOPE.sC('actor'))],' [actor.GetTitledFirstName] nói. 'Kể tất cả cho Ta, nếu không…'"
  prison.1001.a:0 "Ta sẽ kể hết mọi chuyện, Ta thề!"
  prison.1001.b:0 "…"


  prison.1002.rack.desc:0 "Tại sao phải làm phức tạp vấn đề? Không gì bằng khung kéo cũ kỹ. Khi cai ngục đưa [recipient.GetTitledFirstName] vào phòng, ánh mắt [recipient.GetHerHis] ngay lập tức dõi theo khung gỗ lớn."
  prison.1002.whip.desc:0 "Ôi, nụ hôn ngọt ngào của cái roi! Nó có vẻ vô hại, nhưng có thể tách thịt khỏi xương tốt như bất kỳ con dao nào. Nhìn vào nét mặt [recipient.GetTitledFirstNamePossessive], [recipient.GetSheHe] biết rõ điều đó."
  prison.1002.rats.desc:1 "Những con chuột trong xô có vẻ nhút nhát lúc đầu, nhưng chúng sẽ gặm xuyên qua ngực [recipient.GetWomanMan] khi có nhiệt. Khi Ta giải thích cho [recipient.GetTitledFirstName], quyết tâm của [recipient.GetHerHis] tan biến trước mắt Ta."
  prison.1002.poetry.desc:0 "Khi một người có thể xoay chữ để tìm khoái cảm như Ta, xoay chúng để gây hại là điều đơn giản.\n\nTa rút cuốn thơ dài từ tay, mở ra, để cuộn rơi xuống sàn và cuộn nhẹ ra ngoài cửa."
  prison.1002.anothers_secret.desc:0 "\n\n'Không, không, Ta… Ta có thông tin! [reveal_secret_owner.GetTitledFirstName] [secret_to_reveal.Custom('SecretDescriptionThirdPerson')]! Ta sẽ kể hết mọi chuyện!'"
  prison.1002.my_secret.desc:0 "\n\n'Xin đừng! #EMP Xin đừng!#! Ta sẽ kể bất cứ điều gì Ngài muốn biết! Ta… Ta [secret_to_reveal.Custom('SecretDescriptionFirstPerson')]!'"
  prison.1002.a:0 "Thú vị. Đưa [recipient.GetHerHim] trở lại buồng giam."
  prison.1002.b:0 "Ta chưa xong với Ngài #emp đâu#!…"

  prison.1003.t:0 "Hành Hạ"
  prison.1003.rack.desc:0 "Tại sao phải làm phức tạp? Không gì bằng khung kéo cũ kỹ. Tiếng xương gân răng rắc thật khó quên. Nhưng không thể quên bằng nỗi đau mà [recipient.GetTitledFirstName] sắp trải qua…"
  prison.1003.whip.desc:0 "Ồ, nụ hôn ngọt ngào của chiếc roi! Nó trông có vẻ vô hại, nhưng nó có thể tách thịt khỏi xương cũng giỏi như bất kỳ con dao nào — một sự thật mà [recipient.GetTitledFirstName] sắp được trải nghiệm. [recipient.GetSheHe|U] sẽ phải nằm sấp trên bụng [recipient.GetHerHis] một thời gian dài..."
  prison.1003.rats.desc:0 "'Những con chuột này có vẻ nhút nhát,' Ta nói khi trói xô lên ngực trần [recipient.GetFirstNamePossessive]. 'Nhưng khi nóng lên, chúng sẽ làm mọi cách để thoát. May cho chúng, răng chúng #emp rất# sắc.' [recipient.GetSheHe|U] cầu xin khoan hồng khi Ta cầm than hồng."
  prison.1003.poetry.desc:0 "$prison.1002.poetry.desc$\n\nRồi Ta bắt đầu đọc."
  prison.1003.a:0 "Ah… Ta có thể nghe tiếng thét của [recipient.GetHerHis] hàng giờ."
  prison.1003.b:0 "Phải làm vậy thôi."

  prison.1010.rack.desc:0 "[actor.GetTitledFirstName] trói Ta lên khung kéo [actor.GetHerselfHimself], nụ cười thích thú hiện trên môi [actor.GetHerHis]. Ta đã nghe những tiếng thét, tiếng xương gân #emp răng rắc#!… Ta cầu xin khoan hồng, nhưng nụ cười [actor.GetFirstNamePossessiveNoTooltip] chỉ rộng thêm."
  prison.1010.whip.desc:0 "[actor.GetTitledFirstName] quay roi trong tay [actor.GetHerHis]. 'Ôi, cái roi trông vô hại, nhưng nó có thể tách thịt khỏi xương tốt như bất kỳ con dao nào. Hãy để Ta chứng minh…'"
  prison.1010.rats.desc:0 ""Những con chuột này có vẻ nhút nhát," [actor.GetTitledFirstName] nói khi [actor.GetSheHe] buộc cái thùng vào ngực trần của ta. "Nhưng một khi nó bắt đầu ấm lên ở trong đó, chúng sẽ làm mọi cách để thoát ra. May mắn cho chúng, răng của chúng #emp rất#! sắc.""
  prison.1010.poetry.desc:0 "$prison.1001.poetry.desc$\n\nRồi [actor.GetSheHe] bắt đầu."
  prison.1010.a:0 "Xin đừng, Ta…! #emp Aaaaaaaah!#!"

  prison.1020.t:0 "Mù Lòa"
  prison.1020.start.desc:0 "Người cai ngục kéo một [recipient.GetTitledFirstName] đang hoảng loạn vào [ROOT.Char.Custom('GetRoom')]. "Xin hãy tha cho tôi! Tôi sẽ làm bất cứ điều gì, bất cứ điều gì ngài muốn!" Sự phản kháng [recipient.GetHerHis|U] bị cắt ngang khi người cai ngục bịt miệng [recipient.GetHerHim] và trói [recipient.GetHerHim] xuống bàn.\n\n"
  prison.1020.cruel.desc:0 "'Ôi, [recipient.GetFirstNameNoTooltip],' Ta thở dài kịch tính. 'Chúng ta chưa bao giờ đồng ý với nhau. Nhưng mặt tốt là, Ta đã quyết định cách giải quyết tình huống.'"
  prison.1020.compassionate.desc:0 "'Điều này có thể tàn bạo,' Ta nói khi thầy thuốc chuẩn bị dụng cụ [physician.GetHerHis], 'nhưng vì sự ổn định của vương quốc. Tin Ta đi — Ta không lấy làm vui với nỗi đau của Ngài.'"
  prison.1020.compassionate.landless.desc:0 "'Điều này có thể tàn bạo,' Ta nói khi thầy thuốc chuẩn bị dụng cụ [physician.GetHerHis], 'nhưng vì điều tốt nhất. Tin Ta đi — Ta không lấy làm vui với nỗi đau của Ngài.'"
  prison.1020.child.desc:1 ""Điều này sẽ làm cho mọi thứ dễ chịu hơn," vị bác sĩ nói khi [physician.GetSheHe] đưa cho [recipient.GetTitledFirstName] liều thuốc an thần. Bàn tay nhỏ bé [recipient.GetHerHis|U] đang run rẩy, nhưng [recipient.GetSheHe] vẫn uống hết.\n\nKhi đứa trẻ [recipient.Custom('GirlBoy')] đã ngủ thiếp đi, vị bác sĩ nhìn ta hồi lâu. "Ngài có chắc về điều này không, [actor.GetLadyLord] của ta?""
  prison.1020.a:0 "Ôi, vâng, điều này #emp sẽ#! đau."
  prison.1020.b:0 "Ta có lý do của mình."

  prison.1021.start.desc:0 "Ta đang lặng lẽ suy ngẫm số phận thì cai ngục bất ngờ đập cửa và kéo Ta ra khỏi buồng giam. Ở hành lang tối tăm, [actor.GetTitledFirstName] đang chờ.\n\n"
  prison.1021.landless_start.desc:0 "Ta đang suy ngẫm số phận thì cai ngục bất ngờ vào và kéo Ta ra khỏi lồng. Ta đối mặt trực tiếp với [actor.GetTitledFirstName].\n\n"
  prison.1021.cruel.desc:0 "Cái nhìn hài lòng trên mặt [actor.GetHerHis] khiến Ta run rẩy.\n\n'Đừng sợ. Ta không đến vì đầu Ngài — đôi mắt sẽ đủ.'"
  prison.1021.compassionate.desc:0 "'[recipient.GetFirstNameNoTooltip], Ta muốn Ngài biết Ta không lấy làm vui chuyện này. Ta buộc phải làm Ngài mù. Vì sự ổn định của vương quốc.'"
  prison.1021.child.desc:0 ""Nó sẽ làm cho mọi thứ dễ chịu hơn," vị bác sĩ nói khi [physician.GetSheHe] đưa cho ta một cái chai thủy tinh nhỏ. Đây là một nơi tồi tệ, với những con người tồi tệ, nhưng đôi mắt [physician.GetHerHis]... chúng thật tử tế. Với bàn tay run rẩy, ta đưa chai thuốc lên môi."
  prison.1021.a:0 "Mắt… mắt Ta? Thả Ta ra! #emp Không!#!"
  prison.1021.b:0 "Ta… Ta cảm thấy lạ…"

  prison.1025.t:0 "Thiến"
  prison.1025.cruel.desc:0 ""Ôi, [recipient.GetFirstNameNoTooltip]," Ta thở dài kịch tính. "Đừng lo. Ta không đến để lấy đầu ngươi — hay bất cứ thứ gì giá trị khác. Nam tính của ngươi là đủ rồi.""

  prison.1026.cruel.desc:0 "Cái nhìn hài lòng trên khuôn mặt [actor.GetHerHis] khiến Ta rùng mình.\n\n"Đừng lo. Ta không đến để lấy đầu ngươi — hay bất cứ thứ gì giá trị. Nam tính của ngươi là đủ rồi.""
  prison.1026.compassionate.desc:0 ""[recipient.GetFirstNameNoTooltip], ta muốn ngươi biết ta không lấy làm vui việc này. Ta buộc phải thiến ngươi. Vì sự ổn định của vương quốc.""
  prison.1026.a:0 "Cái gì...? Thả ta ra! #emp Khônggg!#!"  

  prison.1030.t: "Méo mó"
  prison.1030.cruel.desc:0 ""Chà, [recipient.GetFirstNameNoTooltip]," Ta thở dài kịch tính. "Dường như đã đến lúc vẻ ngoài của cơ thể trần gian của ngươi phản ánh sự xấu xí bên trong.""

  prison.1031.cruel.desc:0 "Cái nhìn hài lòng trên khuôn mặt [actor.GetHerHis] khiến Ta rùng mình.\n\n"Đừng lo. Ta không đến để lấy #EMP toàn bộ#! đầu ngươi — chỉ một phần thôi là đủ...""  
  prison.1031.a:0 "Mũi... mũi của Ta? Thả Ta ra! #EMP Khônggg!#!"  

  prison.1041.t: "Tàn tật"
  prison.1041.cruel.desc:0 ""Điều Ta luôn ngưỡng mộ ở ngươi [recipient.GetFirstName]", Ta nhếch môi, "là khả năng tận dụng tối đa những hoàn cảnh bất lợi. Ngươi luôn biết cách làm nhiều hơn với ít hơn — thậm chí ít hơn vài cân...""
  prison.1041.compassionate.desc:0 ""[recipient.GetFirstName], ta muốn ngươi biết ta không lấy làm vui việc này. Ta buộc phải làm ngươi tàn tật. Vì sự ổn định của vương quốc.""
  prison.1042.cruel.desc:0 "Cái nhìn hài lòng trên khuôn mặt [actor.GetHerHis] khiến Ta rùng mình.\n\n""Điều Ta luôn ngưỡng mộ ở ngươi [recipient.GetFirstName]", [actor.GetSheHe] nhếch môi, "là khả năng tận dụng tối đa những hoàn cảnh bất lợi. Ngươi luôn biết cách làm nhiều hơn với ít hơn — thậm chí ít hơn vài cân..."""
  prison.1041.a:0 "Tay... chân của Ta? Không, ngươi không thể, #EMP ngươi không thể!#!"  

  prison.9001.t:0 "Tự do!"
  prison.9001.desc_1:0 "Ta dành nhiều ngày để lập kế hoạch trốn thoát, suy nghĩ về hướng đi và đường trốn tốt nhất. Nhưng tất cả đều vô ích khi một ngày, lính gác quên khóa cánh cửa, loạng choạng bước đi mà không ngoảnh lại."
  prison.9001.desc_2:0 "Một lời nói nhẹ nhàng, một lời khen chân thành – sớm thôi lính gác nhìn Ta với sự thân thiện thay vì nghi ngờ ban đầu [dummy_gender.GetSheHe] mang theo. Khi Ta xin chút không khí trong lành, [dummy_gender.GetSheHe] thậm chí không hỏi, và Ta để mặt [dummy_gender.GetHerHim] úp xuống mương."
  prison.9001.desc_3_opening:0 "Chỉ một khoảnh khắc xao nhãng, đó là tất cả những gì Ta cần để lén lấy chìa khóa từ thắt lưng lính gác, giấu sau lưng."
  prison.9001.desc_3_house_arrest:0 "Khi bóng tối buông xuống, Ta nhẹ nhàng mở cửa phòng giam, nhăn mặt vì tiếng kêu răng rắc."
  prison.9001.desc_3:0 "Khi bóng tối buông xuống, Ta từ từ bước ra khỏi phòng giam, nhăn mặt vì tiếng kêu răng rắc."
  prison.9001.desc_4:0 "Ta rà soát từng tấc trong phòng. Kiểm tra mọi bản lề, sờ từng thanh sắt, và tìm kiếm từng xích. Khi bóng tối lại bao phủ, cuối cùng Ta tìm thấy thứ mình cần – một viên đá lỏng! Sau đó việc mở rộng lỗ thành một đường hầm thật nhanh chóng."
  prison.9001.desc_5:0 "Ta theo dõi nơi này, từng cánh cửa quen thuộc như Ngài cũ, và chờ thời cơ. Ta biết ai đi đâu, vào lúc nào. Ta biết ai gọi Bạn Bè nào, và Ta biết đường ra nhanh nhất. Khi bóng tối buông xuống, Ta chỉ chờ khoảnh khắc hoàn hảo, rồi lén đi như bóng."
  prison.9001.desc_6:0 "Ta chờ đến khi bóng tối bao phủ, và ngay khi chắc chắn không có ai xung quanh, Ta nắm một thanh sắt mỗi tay và #EMP uốn cong#!. Mồ hôi nhỏ vào mắt, hơi thở hổn hển vang vọng trong bóng tối, nhưng sớm thôi Ta tạo được một lỗ vừa đủ để chui qua."
  prison.9001.desc_7:0 "Ngay khi lính gác đi, Ta tấn công ổ khóa. Nó cũ và rỉ sét, và tất cả những gì Ta có là một chiếc đinh nhỏ tìm thấy ở góc, nhưng điều đó không ngăn Ta. Vặn nhẹ, đẩy một chút, và – #EMP xong rồi!#!"
  prison.9001.desc_8:0 "Ta mỉm cười khi tên lính canh cố gắng kìm một cái ngáp. Ta đã duy trì cuộc thảo luận hàng giờ đồng hồ rồi, và ta đi sâu vào chủ đề [ROOT.Char.Custom('subject_of_interest')] mà không hề nao núng. Chẳng bao lâu sau [dummy_gender.GetSheHe] gật gù trên chiếc ghế [dummy_gender.GetHerHis], và sau đó việc lấy chìa khóa [dummy_gender.GetHerHim] trở nên vô cùng đơn giản."
  prison.9001.desc_9:0 "Nhiều ngày nhìn lén, ám hiệu, và lời mời cuối cùng đã có kết quả, và khi lính gác tiến đến với một tay đã cởi [dummy_gender.GetHerHis] [dummy_gender.Custom('GetUpperClothingArticle')], Ta mỉm cười. Thật dễ dàng, ngất đi trong khoái cảm, và Ta đảm bảo không gây hại gì."
  prison.9001.desc_ending_1:0 "\n\nKhi Ta biến mất vào [imprisoner.Custom('TerrainType')] xung quanh [imprisoner.GetTitledFirstNamePossessive] [imprisoner.Custom('ResidenceBuilding')], Ta cuối cùng dám hy vọng."
  prison.9001.desc_ending_2:0 "\n\nKhi Ta biến mất vào đêm, xa tất cả, Ta ngửa đầu lên và cười."
  prison.9001.a:0 "Ta tự do!"  

  prison.9002.desc_opening:0 "Tất cả những gì Ta cần là một khoảnh khắc sơ hở"
  prison.9002.desc_rat:0 " – Ta thả con chuột, nó lặng lẽ bò qua sàn, lên ghế lính gác đang ngồi, và thẳng tới chìa khóa"
  prison.9002.desc_stone:0 " – Ta lẻn ra sau tên lính canh và #EMP đập#! hòn đá của mình vào phía sau mũ trụ [dummy_gender.GetHerHis]. Khi tên lính canh ngã xuống đất, ta nhanh chóng lục soát [dummy_gender.GetHerHim] để tìm chìa khóa"
  prison.9002.desc_spoon:0 " và Ta chọc thìa vào ổ khóa. Sau nhiều lần lắc và uốn, ổ khóa phát ra tiếng #EMP tách!#"
  prison.9002.desc_cockroach:0 " – Ta thả con gián của mình ra, và khi nó chạy dưới chân tên lính canh, [dummy_gender.GetSheHe] giật lùi lại đủ mạnh để đập vỡ hộp sọ [dummy_gender.GetHerHis] xuống đất"
  prison.9002.desc_end:0 ", và sớm thôi cả Ta và [ROOT.Char.Custom('prison_pet')] tin cậy biến mất vào [imprisoner.Custom('TerrainType')] xung quanh [imprisoner.GetTitledFirstNamePossessive] [imprisoner.Custom('ResidenceBuilding')]."
  prison.9002.a:0 "Chúng ta tự do, [ROOT.Char.Custom('prison_pet')]!"  

  prison.9003.desc:0 "Ngay khi lính gác [imprisoner.GetTitledFirstNamePossessive] quay lưng với Ta và Ngài tù [prison_friend.GetTitledFirstName], chúng Ta ra tay.\n\nNhững ngày bị giam khiến Ta yếu, và khi lính gác đấm mạnh vào bụng, Ta nhanh chóng bị áp đảo và ghìm xuống. Lính gác chuẩn bị đòn kết liễu, nhưng Ta thấy [prison_friend.GetTitledFirstNameNoTooltip] xuất hiện phía trên, cầm dao của lính gác – sớm thôi chúng Ta lại tiếp tục di chuyển.\n\nKhi ra ngoài đêm, dựa vào nhau, chúng Ta cười."
  prison.9003.a:0 "Chúng ta tự do!"  

  prison.9499.t:0 "Đã trốn thoát!"
  prison.9499.desc_house_arrest:0 "Tù nhân của ta, [escapee.GetTitledFirstName], đã trốn thoát khỏi sự giam cầm [escapee.GetHerHis]!"
  prison.9499.desc_dungeon:0 "Tù nhân của Ta, [escapee.GetTitledFirstName], đã trốn thoát!"
  prison.9499.desc_ending:0 "\n\nLính gác không còn lời biện hộ, nhưng mọi việc đã rồi."
  prison.9499.a:0 "Ngươi chết đi, [escapee.GetFirstNameNoTooltip]!"  

  prison.9501.t:0 "Xích sắt bất khả phá"
  prison.9501.desc:0 "Khi lính gác sơ hở, Ta với lấy chìa khóa trên thắt lưng [jailor.GetHerHis], nhưng một bàn tay cứng rắn ngăn Ta nửa chừng.\n\n"Ôi không. Ở đây không thể trốn thoát, #EMP [ROOT.Char.GetTitleAsNameNoTooltip] của ta#!." Lính gác cười nhạo Ta.\n\n"Ngươi nghĩ bữa cháo ngươi được ăn tệ lắm sao?"\n\n"Chờ đi.""
  prison.9501.a:0 "Ta sẽ mục nát ở đây..."  

  prison.9502.t:0 "Người Ngài dũng cảm [ROOT.Char.Custom('prison_pet')|U] của ta"
  prison.9502.desc_opening:0 "Khi lính gác quay lại, Ta nhanh tay ném [ROOT.Char.Custom('prison_pet')] vào đầu [dummy_gender.GetHerHis].\n\n"
  prison.9502.desc_rat:0 "Nó vùng vẫy, cố tìm chỗ bám, nhưng tên lính canh nhanh chóng vươn tay lên và ném nó xuống sàn nhà.\n\nTiếng hét phản đối của ta gần như bị át đi bởi tiếng rít đau đớn khi tên lính canh nhẫn tâm nghiền nát gót giày [dummy_gender.GetHerHis] xuống."
  prison.9502.desc_stone:0 "Nó va mạnh vào mũ lính gác, nhưng [dummy_gender.GetSheHe] chỉ quay lại, nhướn mày ngạc nhiên.\n\nNhìn thấy viên đá, [dummy_gender.GetSheHe] ném đi với vẻ khinh miệt."
  prison.9502.desc_spoon:0 "Nó bật ra khỏi mũ trụ của lính canh, và [dummy_gender.GetSheHe] dường như hầu như không nhận ra.\n\nQuay lại và phát hiện ra chiếc thìa không đúng chỗ, [dummy_gender.GetSheHe] nhặt nó lên và nhét vào thắt lưng [dummy_gender.GetHerHis] của mình."
  prison.9502.desc_cockroach:0 "Nó vùng vẫy để bám vào, nhưng chuyển động đó hẳn đã làm tên lính canh chú ý vì bàn tay [dummy_gender.GetHerHis] vung lên và nhẫn tâm đập con gián yêu quý của ta xuống đất, nghiền nát nó với một cái nhếch mép khinh bỉ."
  prison.9502.a:0 "Không!! [ROOT.Char.Custom('prison_pet')] của ta!"

  prison.9503.t:0 "Phản bội"
  prison.9503.desc:0 "Ngài tù [prison_friend.GetTitledFirstName] và Ta đã dành nhiều đêm để lên kế hoạch trốn thoát.\n\nKhi Ta gây ồn ào, [prison_friend.GetSheHe] đứng sẵn bên cửa. Lính gác mở cửa, và Ta mỉm cười, giờ [prison_friend.GetFirstNameNoTooltip] sẽ tấn công từ phía sau — và đó là cửa đóng lại phía sau lính gác. [prison_friend.GetTitledFirstNameNoTooltip] biến mất vào đêm, không bị cản trở khi tất cả lính gác tập trung vào Ta."
  prison.9503.a:0 "Ít nhất [prison_friend.GetSheHe] đã thoát..."
  prison.9503.b:0 "Tên [prison_friend.Custom2('InsultAdjective', ROOT.Char)] [prison_friend.Custom2('InsultNoun', ROOT.Char)] phản bội Ta!"  

  prison.9504.t:0 "Ngài tù của Ta"
  prison.9504.desc:0 "Ta đã dành nhiều giờ lên kế hoạch trốn thoát, và khi ra giữa đêm Ta không thể ngừng cười. Có lẽ sẽ thành công! Lính gác bị vô hiệu hóa, đường ra —\n\n"[ROOT.Char.GetFirstNameNoTooltip] đang trốn thoát! Lính gác! #EMP Lính gác!#!" Giọng chói tai của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prison_rival'))] Ta, [prison_rival.GetTitledFirstName], phá vỡ sự im lặng, và sớm thôi Ta bị bao quanh bởi lính gác có vũ trang và giận dữ."
  prison.9504.a:0 "Ngươi chết đi, [prison_rival.GetFirstNameNoTooltip]!"  

  prison.9505.t:0 "Thử thách giới hạn"
  prison.9505.opening:0 "Ta nhận ra rằng phải tự tay nắm lấy số phận của mình. Cũng rõ ràng rằng không phải mọi phần của [bg_override_char.Custom('GetDungeon')|l] đều được canh gác như nhau."
  prison.9505.tumble:0 "\n\nSau một cú ngã xấu từ mỏm tường, Ta ước rằng mọi thứ được canh gác tốt hơn. Mất một giờ trước khi có ai đó tìm thấy và đưa Ta về phòng, nơi một thầy thuốc được gọi."
  prison.9505.tunnels:0 "\n\nTuy nhiên, Ta sớm nhận ra rằng các đường hầm dưới tường tối và rối rắm. Chỉ sau nhiều vết trầy xước và đá đập vào đầu Ta mới tìm được lối ra, quay lại sân trong."
  prison.9505.camp:0 "\n\nSau đó, Ta nhận ra mình đang ở trung tâm một khu lều, đầy lò sưởi, lính chán chường, và chướng ngại vật. Bị dây lều phản bội đẩy xuống mặt, Ta chấp nhận rằng không còn lối thoát, khi lính gác khóa Ta lại."
  prison.9505.a:0 "Ta... Ta vẫn còn sống...!"
