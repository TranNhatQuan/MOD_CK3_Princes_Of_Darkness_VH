l_english: 
  house_arrest_ongoing.0001.t:0 "Mục Tiêu và Ước Mơ"
  house_arrest_ongoing.0001.desc:0 "Mỗi ngày bị giam giữ dưới tay [prison_holder.GetTitledFirstName] là một ngày nữa những kế hoạch cẩn thận của Ta trôi xa khỏi tầm tay.\n\nHình phạt thực sự không phải là sự giam cầm về thể xác, mà là cảm giác bất lực đến mức này!"
  house_arrest_ongoing.0001.a:0 "Ta tự hỏi công việc của mình đang ở trạng thái nào?"
  house_arrest_ongoing.0001.b:0 "Khi được thả, Ta phải sẵn sàng. Ta phải lập kế hoạch!"

  house_arrest_ongoing.0002.t:0 "Phán Xét Sai Lầm"
  house_arrest_ongoing.0002.desc:0 "[prison_holder.GetTitledFirstName] nghĩ [prison_holder.GetSheHe] là ai chứ?! Để giữ ta ở đây, bị nhốt như một con thú, và rồi còn cả gan tuyên bố rằng đó là công lý.\n\nNhư thể bất kỳ ai ngoài [ROOT.Char.GetFaith.HighGodName] có quyền phán xét #EMP ta#! vậy."
  house_arrest_ongoing.0002.a:0 "Chưa bao giờ Ta bị sỉ nhục đến mức này!"
  house_arrest_ongoing.0002.b:0 "Ta phải cố giữ bình tĩnh trong tâm trí."

  house_arrest_ongoing.0003.t:0 "Những Ngày Cô Đơn"
  house_arrest_ongoing.0003.desc_opening:0 "Dành thời gian tách biệt khỏi tất cả những người Ta yêu là một hình phạt tàn nhẫn. Ta tìm kiếm bất cứ nguồn an ủi và Ngài đồng hành nào có thể, nhưng chúng thật ít ỏi."
  house_arrest_ongoing.0003.desc_friendly_prisoner:0 "\n\nĐiều duy nhất giúp Ta vượt qua những ngày dài là mối liên kết với [friendly_prisoner.GetTitledFirstName]."
  house_arrest_ongoing.0003.a:0 "Không ai chịu nói chuyện với Ta sao?!"
  house_arrest_ongoing.0003.b:0 "Ta sẽ tìm ai đó sẵn sàng trò chuyện với Ta."
  house_arrest_ongoing.0003.c:0 "[friendly_prisoner.GetSheHe|U] là nguồn Bạn Bè duy nhất của Ta."
  house_arrest_ongoing.0003.d:0 "[friendly_prisoner.GetSheHe|U] là nguồn an ủi và yêu thương duy nhất của Ta."
  house_arrest_ongoing.0003.e:0 "[ROOT.Char.GetFirstNameNoTooltip] là nguồn an ủi và yêu thương duy nhất của Ta."

  house_arrest_ongoing.0004.t:0 "Giảm Bớt Đau Khổ"
  house_arrest_ongoing.0004.desc1:0 ""Ta biết Ngài nhớ sách và cuộn giấy như thế nào, nên Ta mang cho Ngài một chút từ chợ!""  
  house_arrest_ongoing.0004.desc2:0 ""Ta biết Ngài thích bánh bao nhiêu, và đầu bếp không để ý, nên...""  
  house_arrest_ongoing.0004.desc3:0 ""Hôm nay Ta thấy chiếc vòng này ở thị trấn, và biết Ngài sẽ thích nó. Làm ơn, hãy đeo nó!""  
  house_arrest_ongoing.0004.desc4:0 ""Ta chỉ thuyết phục được các lính gác đến thế, nhưng hy vọng một vòng đi dạo trong vườn sẽ nâng tinh thần Ngài!""  
  house_arrest_ongoing.0004.desc:0 "\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend_at_court') )] thân yêu của ta, [friend_at_court.GetTitledFirstName], luôn nghĩ về ta và cố gắng hết sức [friend_at_court.GetHerHis] để làm cho sự trừng phạt của ta trở nên dễ chịu hơn."
  house_arrest_ongoing.0004.a:0 "Ta không biết sẽ ra sao nếu không có [friend_at_court.GetHerHim]!"

  house_arrest_ongoing.0005.t:0 "Kẻ Hành Hạ Cá Nhân"
  house_arrest_ongoing.0005.desc:0 ""Ồ, ngài nên xem những người diễn kịch tại lễ hội đi. Thật là một màn trình diễn!"\n\nBị nhốt ở đây đã đủ tệ rồi. Còn phải đối mặt với sự chế nhạo [rival_at_court.GetTitledFirstNamePossessive] của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival_at_court') )] nữa thì quá sức chịu đựng. [rival_at_court.GetSheHe|U] cố tình làm mọi cách [rival_at_court.GetHerHis] để làm cuộc đời ta khổ sở nhất có thể, giờ đây khi ta đã bị hạ thấp đến mức này."
  house_arrest_ongoing.0005.a:0 "Và nó thực sự có tác dụng!"
