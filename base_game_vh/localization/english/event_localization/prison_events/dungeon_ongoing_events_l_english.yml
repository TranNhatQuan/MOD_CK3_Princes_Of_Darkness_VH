l_english: 
  dungeon_ongoing.0001.t:0 "Những Lời Thì Thầm Không Ngừng"
  dungeon_ongoing.0001.desc:0 "Ta không thể thấy đó là ai, hay chính xác họ đang ở đâu, nhưng chỉ khi họ hét lên thì mới không nghe thấy những lời thì thầm ầm ĩ vang vọng khắp ngục tối ẩm ướt."
  dungeon_ongoing.0001.a:0 "Giá mà các ngươi im lặng, dù chỉ một khoảnh khắc!"
  dungeon_ongoing.0001.b:0 "\"Ngươi đang nói với ta chăng,  Bạn củata?\""

  dungeon_ongoing.0002.t:0 "Chờ Đợi"
  dungeon_ongoing.0002.desc:0 "Chính thời gian trôi qua làm Ta khó chịu nhất. Ai biết được đã trôi bao lâu, và Ta sẽ còn ở đây bao lâu nữa? Có thể là vài giờ... hoặc vài tháng."
  dungeon_ongoing.0002.a:0 "Ta cần thoát khỏi đây!"
  dungeon_ongoing.0002.b:0 "Ta có thể chờ lâu tùy thích."

  dungeon_ongoing.0003.t:0 "\"Im Lặng Đi!\""
  dungeon_ongoing.0003.desc:0 "Ta đã quát tháo lính canh qua song sắt, nói với họ rằng họ phải thả Ta ra. Phản ứng duy nhất của họ là ánh mắt đe dọa, nắm đấm giơ lên, và cái gầm gừ bảo 'im lặng'."
  dungeon_ongoing.0003.a:0 "Hình như kêu gọi trách nhiệm không giúp gì cả."
  dungeon_ongoing.0003.b:0 "Ngươi nghĩ đe dọa là có thể làm ta im miệng chăng?!"

  dungeon_ongoing.0004.t:0 "Nhiễm Trùng"
  dungeon_ongoing.0004.desc:0 "Ta nghĩ vết thương gần như đã lành, nhưng giờ nó bắt đầu nóng rát. Ta không thể nhìn rõ trong bóng tối, nhưng cảm giác sờ vào thấy nó phồng lên.\n\nTa không biết độ ẩm kèm theo cơn đau rát đó là máu, mủ, hay là hơi nước từ không khí ẩm ướt."
  dungeon_ongoing.0004.a:0 "Xin giúp Ta…"
  dungeon_no_response_tooltip:0 "#F Dường như không ai nghe thấy lời cầu xin của Ngài.#!"

  dungeon_ongoing.0005.t:0 "Lửa Chấm Dứt"
  dungeon_ongoing.0005.desc:0 "Làn da quanh vết thương cứng lại, như gỗ ướt, nhưng cảm giác bỏng đã qua. Có vẻ như nhiễm trùng đã biến mất."
  dungeon_ongoing.0005.a:0 "Tạ ơn [ROOT.Char.GetFaith.HealthGodName]."

  dungeon_ongoing.0006.t:0 "Suy Sụp"
  dungeon_ongoing.0006.desc:0 "Một cơn lạnh liên tục, độ ẩm vĩnh viễn, và đói dai dẳng vì cháo loãng quá mỏng."
  dungeon_ongoing.0006.a:0 "[ROOT.Char.GetFaith.HighGodName], Ta đã làm gì mà đáng chịu khổ này?!"
  dungeon_ongoing.0006.b:0 "À, có lẽ còn tệ hơn nữa."

  dungeon_ongoing.0007.t:0 "Khao Khát Một Điều Gì Hơn"
  dungeon_ongoing.0007.desc:0 "Bị mắc kẹt nơi tối tăm trong khi thế giới ngoài kia vẫn tiếp diễn. Ta nên ở ngoài kia, với tay vươn tới bầu trời, chứ không phải chôn mình dưới đất."
  dungeon_ongoing.0007.a:0 "Ta xứng đáng với nhiều thứ hơn thế này!"
  dungeon_ongoing.0007.b:0 "Ta phải tập trung vào sinh tồn, chỉ sinh tồn thôi."

  dungeon_ongoing.0008.t:0 "Những Ngày Trôi Qua"
  dungeon_ongoing.0008.desc:0 "Ta đã ở đây mãi mãi. Có phải đã vài tháng? Năm? Thập kỷ? Lưu đày trong bóng tối dường như không bao giờ kết thúc!"
  dungeon_ongoing.0008.a:0 "Quá lâu rồi!"

  dungeon_ongoing.0009.t:0 "Niềm An Ủi Từ Một Người Ngài"
  dungeon_ongoing.0009.desc:0 "Ta không biết mình sẽ sống sót ra sao nếu không có sự an ủi mà [ROOT.Char.Custom('prison_pet')] thân yêu mang lại.\n\nKhi Ta buồn, nó ở đó để an ủi; khi Ta muốn bỏ cuộc, nó thúc giục. Ta chưa từng gặp [ROOT.Char.Custom('prison_pet')] nào giống nó!"
  dungeon_ongoing.0009.a:0 "Ngươi là một [ROOT.Char.Custom('prison_pet')] dễ thương thật đấy, phải không?"

  dungeon_ongoing.0010.t:0 "Dây Cứu Sinh"
  dungeon_ongoing.0010.desc:0 "Có lẽ sự chôn vùi của Ta không phải là điều đã định sẵn. Ta có thể viết thư cho [letter_recipient.Custom2('MyCharacterIntroduction', ROOT.Char)], nài nỉ [letter_recipient.GetHerHim] giải thoát Ta khỏi định mệnh đá chặt này. Nhưng liệu Ta có thể chuyển thư đến [letter_recipient.GetCurrentLocation.GetNameNoTooltip] trước bao nhiêu con mắt soi mói?"
  dungeon_ongoing.0010.a:0 "Chính lính canh sẽ giúp Ta."
  dungeon_ongoing.0010.a.tt: "Ta phải thuyết phục lính canh của [imprisoner.GetShortUINamePossessiveNoTooltip] gửi thư giúp Ta."
  dungeon_ongoing.0010.a.success.t: "Thư của Ta được lén gửi đi"
  dungeon_ongoing.0010.a.success.desc: "[letter_recipient.GetTitledFirstNameNoTooltip] có thể thương lượng để giải thoát Ta khỏi ngục"
  dungeon_ongoing.0010.a.failure.t: "Lính canh không bị thuyết phục"
  dungeon_ongoing.0010.b:0 "Một lá thư dễ bị bỏ qua…"
  dungeon_ongoing.0010.b.tt: "Ta phải lén đưa thư qua mắt lính canh của [imprisoner.GetShortUINamePossessiveNoTooltip]."
  dungeon_ongoing.0010.b.failure.t: "Lính canh tịch thu thư của Ta"
  dungeon_ongoing.0010.c:0 "Không, Ta phải cẩn trọng."

  dungeon_ongoing.0011.t:0 "Người [prisoner.Custom2('RelationToMeShort', ROOT.Char)|U] Của Ta Bị Chôn"
  dungeon_ongoing.0011.desc:0 "Ta nhận được một lá thư từ một nguồn khó tin, [prisoner.Custom2('MyCharacterIntroduction', ROOT.Char)]. [prisoner.GetSheHe|U] kể những chi tiết ghê rợn về việc [prisoner.GetHerHis] bị giam giữ bởi [imprisoner.GetTitledFirstName] và nài nỉ Ta cứu [prisoner.GetHerHim] ngay, kẻo [prisoner.GetSheHe] sợ sẽ chết."
  dungeon_ongoing.0011.a:0 "[prisoner.GetSheHe|U] không thể ở thêm một giây nào nữa ở nơi đó!"
  dungeon_ongoing.0011.a.tt: "Ta sẽ nài nỉ [imprisoner.GetTitledFirstNameNoTooltip] thả [prisoner.GetTitledFirstNameNoTooltip]"
  dungeon_ongoing.0011.a.success.t: "[imprisoner.GetTitledFirstNameNoTooltip] nghe theo yêu cầu của Ta"
  dungeon_ongoing.0011.a.failure.t: "[imprisoner.GetTitledFirstNameNoTooltip] không thả [prisoner.GetTitledFirstNameNoTooltip]"
  dungeon_ongoing.0011.a_not_ai: "[imprisoner.GetTitledFirstNameNoTooltip] sẽ cân nhắc việc thả [prisoner.GetTitledFirstNameNoTooltip]"
  dungeon_ongoing.0011.b:0 "Bah, [prisoner.GetFirstNameNoTooltip] chắc đang phóng đại."

  dungeon_ongoing.0012.t:0 "Thư Bị Đốt"
  dungeon_ongoing.0012.desc:0 "Những ngày trôi qua mà không có hồi âm từ [letter_recipient.Custom2('MyCharacterIntroduction', ROOT.Char)]. [letter_recipient.GetSheHe] đi đâu rồi? Tại sao [letter_recipient.GetSheHe] không trả lời? Giá mà Ta thoát khỏi vòng xoắn đá này!"
  dungeon_ongoing.0012.a:0 "Có lẽ lá thư bị thất lạc?"
  dungeon_ongoing.0012.b:0 "Ta đã biết [letter_recipient.GetTitledFirstNameNoTooltip] là một [letter_recipient.Custom2('InsultNoun', ROOT.Char)]"

  dungeon_ongoing.0013.t:0 "Gia Đình Bị Chôn"
  dungeon_ongoing.0013.desc_intro:0 "Dù [prisoner.Custom2('MyCharacterIntroduction', ROOT.Char)] là tù nhân hợp pháp của Ta, rõ ràng [letter_recipient.GetTitledFirstName] không đồng ý với quan điểm của Ta.\n\n"
  dungeon_ongoing.0013.desc_reasoning_compassionate:0 "\"Ngươi không thương xót một thành viên [ROOT.Char.GetHouse.GetBaseName] khác đang bị nhốt sao?\" [letter_recipient.GetSheHe] hỏi. \"Hãy nhìn vượt qua những lỗi lầm của [prisoner.GetHerHis] và nghĩ đến lợi ích của nhà, Ta nài nỉ ngươi.\""
  dungeon_ongoing.0013.desc_reasoning_other:0 "\"Chúng ta chỉ yếu đi trước các mối đe dọa bên ngoài khi bị nhốt trong tường nhà mình,\" [letter_recipient.GetSheHe] phản đối. \"Ngươi sẽ không thả [prisoner.GetTitledFirstNameNoTooltip] sao, vì lợi ích của [realm_title.GetNameNoTier]?\""
  dungeon_ongoing.0013.a:0 "[prisoner.GetTitledFirstNameNoTooltip] sẽ được thả hôm nay."
  dungeon_ongoing.0013.b:0 "[prisoner.GetSheHe|U] là tù nhân hợp pháp của Ta, mặc kệ gia đình."

  dungeon_ongoing.0014.t:0 "Âm Vang Trống Rỗng"
  dungeon_ongoing.0014.desc:0 "Những lời thì thầm của lính canh lọt vào tai ta. [letter_recipient.Custom2('MyCharacterIntroduction', ROOT.Char)] rõ ràng đã chú ý đến những lá thư của ta và đã tiếp cận người cai ngục [imprisoner.GetTitledFirstName]. Thật không may, kẻ [imprisoner.Custom2('InsultNoun', ROOT.Char)] đó đã chai sạn trái tim [imprisoner.GetHerHis] và từ chối [letter_recipient.GetTitledFirstNameNoTooltip]. Ta vẫn là một [prisoner.GetWomanMan] không được tự do hơn trước."
  dungeon_ongoing.0014.a:0 "Ít nhất [letter_recipient.GetTitledFirstNameNoTooltip] là một [ROOT.Char.Custom2('RelationToMeShort', letter_recipient)] tốt với Ta."
  dungeon_ongoing.0014.b:0 "Chẳng ai giúp Ta sao?!"
 

  dungeon_ongoing.9001.t:0 "Bên Trong"
  dungeon_ongoing.9001.desc:0 "Ta không nhớ lần cuối mình thấy mặt trời là khi nào. Ta cũng không nhớ lần cuối mình ăn thức ăn rắn, hay bất cứ thứ gì rắn khác.\n\nCảm giác như độ ẩm trong không khí đã bám chặt vào phổi Ta.\n\nNếu một chiếc răng đau, Ta chỉ việc nhổ nó ra khỏi nướu mục nát của mình."
  dungeon_ongoing.9001.a:0 "Thật khó để cử động."

  dungeon_ongoing.9002.t:0 "Trống Rỗng"
  dungeon_ongoing.9002.desc:0 "Cơn ho không bao giờ kết thúc. Đã nhiều ngày trôi qua, và Ta chưa từng có một giờ ngủ trọn vẹn mà không tỉnh dậy với tay cào vào cổ họng.\n\nLiếm từng giọt nước nhỏ rỉ ra từ tường cũng chẳng còn tác dụng gì nữa."
  dungeon_ongoing.9002.a:0 "Ta chỉ muốn tất cả kết thúc."

  dungeon_ongoing.9003.t:0 "Hồi Tưởng"
  dungeon_ongoing.9003.desc:0 "Liệu Ta có bao giờ được thả ra khỏi đây không? Hay Ta chỉ bị nhốt lại, bỏ rơi và quên lãng?\n\nCó ai ngoài cai ngục biết Ta ở đây không?\n\nCó ai còn nhớ tên Ta không?\n\nAi biết Ta đã là ai?"
  dungeon_ongoing.9003.a:0 "Ta hầu như không nhớ mặt họ nữa…"

  dungeon_ongoing.9004.t:0 "Bị Bỏ Rơi"
  dungeon_ongoing.9004.desc:0 "Ta sẽ chết ở đây. Ta biết chắc chắn điều đó. Ta sẽ không bao giờ cảm nhận ánh nắng trên mặt nữa, hay nghe tiếng cười mà không pha lẫn sự tuyệt vọng."
  dungeon_ongoing.9004.a:0 "Đây là toàn bộ thế giới của Ta."

  dungeon_ongoing.9005.t:0 "Mất Mát Không Thể Đo Lường"
  dungeon_ongoing.9005.desc:0 "Người Ngài trung thành, người Ngài quý giá nhất của Ta, sợi dây cứu sinh trong nơi tối tăm này…\n\nKhi Ta ôm chặt [ROOT.Char.Custom('prison_pet')] sắp chết trong tay, Ta tràn ngập cảm giác tuyệt vọng về hoàn cảnh của mình. Nếu một sinh linh thuần khiết như [dummy_gender.GetSheHe] cũng phải chết nơi này, thì Ta còn cơ hội gì?"
  dungeon_ongoing.9005.a:0 "Ngươi không thể bỏ Ta lại đây một mình!"
