l_english: 
  prison_notification.0001.t:0 "Bị giam!"
  prison_notification.0001.desc:0 "Ta đã bị bắt và giam giữ trái ý muốn bởi [imprisoner.GetTitledFirstName]!\n\nTa không còn tự do trở về [ROOT.Char.Custom('GetCourt')], hay đi lại theo ý mình."
  prison_notification.0001.a:0 "Hy vọng chuyện này không kéo dài."  

  prison_notification.0002.t:0 "Bị giam!"
  prison_notification.0002.desc:0 "[prisoner.GetTitledFirstName], [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('prisoner'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))] của ta, hiện đang bị giam giữ trái ý muốn [prisoner.GetHerHis] bởi [imprisoner.GetTitledFirstName]."
  prison_notification.0002.a:0 "Có thể làm gì cho [prisoner.GetHerHim]?"  

  prison_notification.0003.message:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))|U] Bị giam!"  
 
  prison_notification.1001.t:0 "Ra khỏi Ánh sáng"
  prison_notification.1001.desc:0 "[actor.GetTitledFirstName] đã ném Ta vào ngục tối! Liệu Ta sẽ mục nát ở đây, trong những đường hầm ẩm ướt của [actor.GetHerHis] [actor.Custom('FortifiedBuilding')]?"
  prison_notification.1001.a:0 "[actor.GetSheHe|U] còn tệ hơn cả lũ chuột đang chạy nhong nhong dưới đây!"
  prison_notification.1001.a.tt:0 "Khi ở ngục tối, Ta sẽ dần tích tụ [stress|E], đến mức nguy hiểm!"  

  prison_notification.1002.t:0 "Không khí trong lành hơn"
  prison_notification.1002.desc:0 "[actor.GetTitledFirstName] thấy nên thả Ta ra khỏi ngục của [actor.GetHerHis], nhưng chỉ đến mức quản thúc tại gia."
  prison_notification.1002.a:0 "Ta nhận lấy những khoan hồng mình có thể."
  prison_notification.1002.a.tt:1 "Quản thúc tại gia không làm tăng mức [stress|E]."  

  prison_notification.2001.t:0 "Tự do một lần nữa"
  prison_notification.2001.desc:0 "Ta không còn bị [imprisoner.GetTitledFirstName] giam trái ý nữa, và Ta tự do trở về nhà, hoặc đến bất cứ nơi nào Ta muốn."
  prison_notification.2001.a:0 "Ta tưởng rằng sẽ không bao giờ nhìn thấy đất đai của mình nữa."  

  prison_notification.2002.t:0 "Tự do một lần nữa"
  prison_notification.2002.desc:0 "[ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('prisoner'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))] của ta, [prisoner.GetTitledFirstName], đã được giải thoát khỏi sự giam cầm [prisoner.GetHerHis] dưới tay [imprisoner.GetTitledFirstName], và một lần nữa được tự do!"
  prison_notification.2002.a:0 "Bị giam là một sự tàn nhẫn."  

  prison_notification.2003.message:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))|U] Được thả!"
