l_english:
  blackmail.0001.t:0 "Tống Tiền Bị Từ Chối!"
  blackmail.0001.desc:0 "Dù là do lòng tự trọng sai lầm hay nỗi sợ một sự trả đũa lớn hơn, [recipient.GetTitledFirstName] khẳng định rằng ta không hề có quyền lực gì đối với [recipient.GetHerHim]!"
  blackmail.0001.a:0 "Một lời đe dọa đã được đưa ra, và chỉ có thể có một kết cục..."
  blackmail.0001.b:0 "Ta ghét phải thừa nhận điều này, nhưng ta không thể tiết lộ bí mật này."

  blackmail.1001.t:0 "Nỗi Sợ Điều Chưa Biết"
  blackmail.1001.desc:0 "Các chư hầu của ta không biết gì về vụ tống tiền này, nhưng họ đã nhận ra cách nạn nhân của ta, [blackmail_target.GetTitledFirstName], hành xử khi ở gần ta. Họ đã thấy nỗi sợ lóe lên trong đôi mắt [blackmail_target.GetHerHis]..."
  blackmail.1001.a:0 "Tất cả bọn họ #EMP đều#! nên sợ ta..."
  blackmail.1001.b:0 "\"Ta đảm bảo với tất cả các ngươi, không có chuyện gì bất thường xảy ra cả!\""

  blackmail.1002.t:0 "Bóng Đen Lơ Lửng"
  blackmail.1002.desc:0 "Mối đe dọa bị phơi bày luôn ám ảnh trong tâm trí ta. [blackmailer.GetTitledFirstName] biết quá nhiều về ta, và hậu quả của việc từ chối bất kỳ yêu cầu nào của [blackmailer.GetHerHis] lớn đến mức ta thậm chí không dám nghĩ tới.\n\nNgay cả khi ta làm theo, liệu ta có thực sự an toàn không?"
  blackmail.1002.a:0 "Ta trằn trọc cả đêm vì lo lắng."
  blackmail.1002.b:0 "Mọi chuyện rồi sẽ ổn thôi, [blackmailer.GetFirstNameNoTooltip] đã nói vậy!"
