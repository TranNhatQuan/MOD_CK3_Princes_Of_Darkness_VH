l_english:
  witch.1001.message:0 "Khai Nhập Phù Thủy"
  child_witch_conversion_success_effect.desc:0 "[child.GetFirstNameNoTooltip] đã bị thuyết phục"
  child_witch_conversion_failure_effect.desc:0 "[child.GetFirstNameNoTooltip] còn nghi ngờ"
  child_witch_conversion_critical_failure_effect.desc:0 "[child.GetFirstNameNoTooltip] tiết lộ bí mật của ta"
  child_witch_conversion_critical_failure_effect.liege.desc:0 "[child.GetFirstNameNoTooltip] tiết lộ người bảo hộ phù thủy"

  witch.1002.t:0 "Thời Đại Hiểu Biết"
  witch.1002.desc:0 "[child.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đang lơ lửng giữa tuổi thơ và trưởng thành. Ta đã dạy [child.GetHerHim] đủ để hiểu sự thật, và [child.GetSheHe] vẫn còn đủ trẻ để giữ tâm trí mở. Nếu ta muốn khai nhập [child.GetHerHim] vào phục vụ [ROOT.Char.GetFaith.WitchGodName], thì bây giờ là cơ hội duy nhất."
  witch.1002.a:0 "[child.GetSheHe|U] xứng đáng biết quyền năng của [ROOT.Char.GetFaith.WitchGodHerHis|U]."
  witch.1002.b:0 "[child.GetFirstNameNoTooltip] là một trường hợp vô vọng."

  witch.1003.t:0 "Kiến Thức Bí Ẩn"
  witch.1003.desc:0 "Có những điều [guardian.Custom2('MyCharacterIntroduction', ROOT.Char)] kể cho ta mà chẳng ai khác nhắc tới. Chúng ta không bao giờ đào sâu chủ đề này, và ta biết không nên hỏi quá nhiều.\n\nTuy nhiên, tối nay có gì đó khác biệt giữa chúng ta. Khi chúng ta ngồi xuống đọc sách, [guardian.GetSheHe] hỏi liệu ta có điều gì tò mò..."
  witch.1003.a:0 "Có, hãy kể cho ta tất cả! Xin hãy!"
  witch.1003.b:0 "Không, ta không nghĩ vậy..."
  witch.1003.c:0 "Đây là sự báng bổ!"

  witch.2001.t:1 "$convert_to_witch$: Thời Khắc Đã Đến"
  witch.2001.start.desc:0 "Ta không thể bắt [target.GetFirstName] nhìn nhận sự thật, nhưng ta đã làm tất cả để mở tâm trí [target.GetHerHis]."
  witch.2001.secrecy.desc:0 "Ta cầu nguyện với [owner.GetFaith.WitchGodName] rằng [target.GetFirstNameNoTooltip] đã nhận ra điều gì đó trong những cuộc trò chuyện vô tội và các văn bản thánh mà ta để lại trong phòng [target.GetHerHis]."
  witch.2001.no_secrecy.desc:0 "Ta cầu nguyện với [owner.GetFaith.WitchGodName] rằng [target.GetFirstNameNoTooltip] đã nhận ra điều gì đó trong những cuộc thảo luận dài và các văn bản thánh ta trao cho [target.GetHerHim]."
  witch.2001.end.desc:0 "\n\nGiờ ta phải đến gặp [target.GetHerHim] và mời [owner.GetFaith.WitchGodHerHis|U] hiệp thông — hoặc từ bỏ nỗ lực này."
  witch.2001.a:0 "[target.GetSheHe|U] xứng đáng được tự mình quyết định."
  witch.2001.b1:0 "Rủi ro quá lớn."
  witch.2001.b2:0 "[target.GetFirstNameNoTooltip] chưa sẵn sàng."
  witch.2001.a.tt:1 "Ngươi tiến hành kế hoạch khai nhập [target.GetShortUIName] theo con đường của [owner.GetFaith.WitchGodName]"

  witch.2002.t:0 "Một Người Hầu Của [owner.GetFaith.WitchGodName]"
  witch.2002.start.desc:0 "Khi mở mắt trong bóng tối, ta ngay lập tức bị choáng ngợp bởi cảm giác đáng ngại. Có ai đang theo dõi ta chăng?\n\n“Ngươi đã sẵn sàng đón nhận sự thật chưa, [ROOT.Char.GetFirstNameNoTooltip]?”"
  witch.2002.discovery.desc:0 "Ta sẽ nhận ra giọng nói đó ở bất cứ đâu. Chắc chắn là [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]."
  witch.2002.no_discovery.desc:0 "Ta ngồi dậy, đột nhiên tỉnh táo hoàn toàn. Ta nhìn quanh tìm kiếm nguồn gốc của giọng nói [owner.GetWomanMan] xa lạ, nhưng chỉ có những bóng đen."
  witch.2002.end.desc:0 "\n\n\"[owner.GetFaith.WitchGodName|U] ban cho ngươi phước lành của [owner.GetFaith.WitchGodHerHis|U]. Ngươi có chấp nhận không?\""
  witch.2002.a:0 "Tất cả tấm lòng!"
  witch.2002.b:0 "Ta không muốn dính líu. Biến đi, quỷ dữ!"
  witch.2002.c:0 "Thế giới sẽ biết tội lỗi của ngươi, [owner.GetFirstNameNoTooltip]!"

  witch.2003.t:1 "$convert_to_witch$: Một Tân Đệ Tử"
  witch.2003.desc:0 "Ta theo dõi hình bóng đang ngủ của [target.GetFirstName] trong khi gửi một lời cầu nguyện nhanh đến [owner.GetFaith.WitchGodName]. Ngay khi từ thì thầm cuối cùng trôi qua môi ta, [target.GetSheHe] cựa quậy, như thể tâm trí vô thức của [target.GetHerHis] đã chờ đợi khoảnh khắc này.\n\nKhi ta bước ra khỏi bóng tối và ban cho [target.GetFirstNameNoTooltip] phước lành của [owner.GetFaith.WitchGodHerHis|U], không có sự sợ hãi hay do dự nào trong mắt [target.GetHerHis]. No, sự chấp nhận của [target.GetHerHis] là toàn tâm toàn ý và khao khát."

  witch.2003.a:0 "Chào mừng đến hiệp thông của chúng ta, [target.Custom('SisterBrother')|U]."
  witch.2003.b:0 "Giờ ta có thể cho [target.GetHerHim] thấy bản chất thật của ta."
  witch.2003.b.tt:0 "[target.GetShortUIName|U] phải biết [secret|E] của ngươi để được mời vào $activity_witch_ritual$"
  witch.2003.c:0 "[target.GetSheHe|U] phải tự tìm con đường của riêng mình."

  witch.2003.message:0 "Phù thủy tiết lộ bản thân với ta"

  witch.2004.t:1 "$convert_to_witch$: Tâm Trí Khép Kín, Trái Tim Lạnh Lùng"
  witch.2004.start.desc:0 "[target.GetFirstName] tỉnh giấc khi ta [SelectLocalization( IsLandlessAdventurer(target), 'witch.2004.start_target_laamp', 'witch.2004.start_target_landed')]. “Ai đó đấy?” [target.GetSheHe] hỏi bằng giọng run rẩy.\n\n“Tên ta không quan trọng. Ta đến vì phục vụ [owner.GetFaith.WitchGodName].”"
  witch.2004.start_target_landed: "leo qua cửa sổ"
  witch.2004.start_target_laamp: "bò vào lều"
  witch.2004.discovered.desc:0 "[target.GetFirstNameNoTooltip] nheo mắt. “[ROOT.Char.GetFirstNameNoTooltip], là ngươi sao? '[owner.GetFaith.WitchGodName|U]'? Chuyện quái gì thế này?!”"
  witch.2004.not_discovered.desc:0 "[target.GetFirstNameNoTooltip] loạng choạng ra khỏi giường, với lấy thứ gì đó trên bàn đầu giường của [target.GetHerHis]. Có lẽ chẳng có gì tốt đẹp cả. \"Ta không muốn liên quan gì đến ngươi hay những lời dối trá của ngươi! Hãy cút đi, đồ quỷ dữ!\" [target.GetFirstNameNoTooltip] hét lên, và ta không chậm trễ mà tuân theo."
  witch.2004.a:0 "Nhầm [target.Custom('GetChamber')], xin lỗi!"
 witch.2005.toast: "Witch Discovered"

  witch.2005.end.desc:0 "[ROOT.Char.GetFirstNameNoTooltip], là ngươi sao? '[owner.GetFaith.WitchGodName|U]'? [target.GetLiege.Custom2('MyCharacterIntroduction', target)|U] sẽ biết về sự báng bổ của ngươi!"
  witch.2005.a:0 "Xin hãy, không phải như ngươi nghĩ!"
  witch.2005.a.tt:0 "Thực ra, nó có thể là #EMP chính xác#! những gì [target.GetSheHe] nghĩ..."

  witch.2006.t:0 "$convert_to_witch$: Tiết Lộ"
  witch.2006.desc:0 "[target.Custom2('MyCharacterIntroduction', ROOT.Char)|U] không ở trên giường của [target.GetHerHis] khi ta lẻn qua cửa sổ của [target.GetHerHis] trong nhiệm vụ từ [owner.GetFaith.WitchGodName]. Nơi nào có thể–\n\n\"Ai đó?!\"\n\nTa quay lại và thấy [target.GetTitledFirstName] đang cúi người trên một hình ngôi sao năm cánh được vẽ trên sàn nhà."
  witch.2006.a:0 "Ồ, ngươi đã…! Chào, [target.Custom('SisterBrother')|U]!"

  witch.2007.t:0 "Đồng Minh Bí Ẩn"
  witch.2007.desc:0 "Ta đang giữa nghi lễ ban đêm tôn vinh [owner.GetFaith.WitchGodName] thì có tiếng động phía sau. Một kẻ trộm? Một vị khách? Một sát thủ?!\n\nKhi quay lại, ta thấy [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] đứng đối diện, mặc áo choàng tối với dấu hiệu rõ ràng của [owner.GetFaith.WitchGodName] – bộ trang phục kinh điển cho việc khai nhập."
  witch.2007.a:1 "Không cần phải làm thế với ta, #EMP [owner.Custom('SisterBrother')|U]#!!"

  witch.2010.t:1 "$convert_to_witchcraft_key$: Nghe Trộm"
  witch.talk.2010:1 "[target.GetFirstName] và ta nói về [owner.GetFaith.WitchGodName] và ý muốn của [owner.GetFaith.WitchGodHerHis] hàng giờ. Khi bầu trời bắt đầu chuyển xanh nơi chân trời, chúng ta chia tay."
  witch.leave.2010:0 "Sau khi đã truyền đạt những điều cốt yếu nhất trong trí tuệ của [ROOT.Char.GetFaith.WitchGodHerHis|U] cho [target.GetFirstName], và đưa cho [target.GetHerHim] cuốn ma đạo thư của riêng [target.GetHerHis], ta xin phép cáo từ."
  witch.end.2010:0 "\n\nKhi mở cửa phòng, ta nghe tiếng bước chân nhanh rời đi dọc hành lang. Có ai nghe lén sao?"
  witch.2010.a:0 "Xin các Thần Trời [ROOT.Char.GetFaith.HighGodName] phù hộ!"
  witch.2010.a.tt:1 "Ai đó biết [secret|E] của ngươi"
  witch.2010.message:0 "Bí mật bị phát hiện"

  convert_to_witchcraft_key:0 "Khai Nhập Phù Thủy"
  convert_to_witchcraft_interaction:1 "$convert_to_witchcraft_key$ #weak (Scheme)#!"
  convert_to_witchcraft_interaction_desc:0 "Cố gắng khai nhập [recipient.GetShortUINameNoTooltip] theo cách của [actor.GetFaith.WitchGodName]"
  convert_to_witchcraft:2 "$convert_to_witchcraft_key$"
  convert_to_witchcraft_desc:0 "Ta sẽ dẫn [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] theo con đường của [SCHEME.GetOwner.GetFaith.WitchGodName] và chỉ cho [SCHEME.GetTargetCharacter.GetHerHim] thấy sức mạnh thực sự của [SCHEME.GetOwner.GetFaith.WitchGodHerHis|U]."
  convert_to_witchcraft_desc_general:0 "Dẫn một mục tiêu theo con đường thực sự và cho họ thấy quyền năng này."
  convert_to_witchcraft_action:0 "Khai Nhập"
  convert_to_witchcraft_interaction_notification:0 "Khai Nhập Phù Thủy"
  convert_to_witchcraft_scheme_invalidated_title:0 "@scheme_icon! Kế Hoạch Khai Nhập Phù Thủy Kết Thúc"
  convert_to_witchcraft_general_desc:1 "Một kế hoạch đưa một mục tiêu vào phù thủy với hy vọng mở rộng hội nhóm của họ."


 ### REVEAL AS WITCH INTERACTION ###
  reveal_as_witch_interaction:0 "Tiết Lộ Là Phù Thủy"
  reveal_as_witch_interaction_desc:0 "Tiết lộ sự tận tâm của Ngài với [actor.GetFaith.WitchGodName] cho một đồng môn [GetTrait('witch').GetName( GetNullCharacter )]"

  witch.2900.t:0 "[actor.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
  witch.2900.desc:1 "Ngươi từ lâu đã là nguồn cảm hứng với ta, và ta cảm thấy ngươi xứng đáng biết điều mà ta đã giấu kín trước thế giới.\n\nTa cũng là một tín đồ của [actor.GetFaith.WitchGodName] và học trò của những bí mật của [actor.GetFaith.WitchGodHerHis|U]. Ta hy vọng rằng nỗ lực chung của chúng ta sẽ đưa chúng ta gần nhau hơn.\n\nNguyện [actor.GetFaith.WitchGodMistressMaster] thông thái phù hộ cho ngươi."
  witch.2900.a:0 "Số lượng chúng ta đang tăng lên!"

  witch.2901.t:0 "[recipient.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
  witch.2901.desc:0 "Ta vui mừng khi nghe về sự tận tâm phục vụ của ngươi đối với [ROOT.Char.GetFaith.WitchGodMistressMaster] tinh ranh của chúng ta! Nguyện [ROOT.Char.GetFaith.WitchGodSheHe|U] phù hộ và dẫn dắt ngươi trên con đường chân lý."
  witch.2901.a:0 "Nguyện [ROOT.Char.GetFaith.WitchGodSheHe|U] phù hộ cho ngươi!"

 ####GRAND RITE####

 #Activity & decision
  host_witch_ritual_decision:0 "Tổ Chức Đại Lễ"
  host_witch_ritual_decision_desc:0 "Chúng ta sẽ tôn thờ [ROOT.Char.GetFaith.WitchGodName] và khám phá sâu những bí ẩn của [ROOT.Char.GetFaith.WitchGodHerHis|U]! $activity_witch_ritual$ là cơ hội tuyệt vời để giao lưu và trao đổi kiến thức với các phù thủy đồng môn."
  host_witch_ritual_decision_tooltip:0 "Tổ Chức Lễ"
  host_witch_ritual_decision_confirm:0 "Hãy bắt đầu lễ!"
  activity_witch_ritual:0 "Đại Lễ"
  activity_witch_ritual_name:0 "Đại Lễ của [ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]"
  activity_witch_ritual_owner:0 "Chủ Lễ"
  activity_witch_ritual_desc:3 "Những tín đồ chân chính có [GetTrait('witch').GetName( GetNullCharacter )] [trait|E] được mời để tôn vinh sức mạnh của [GetPlayer.GetFaith.WitchGodName] và khám phá những bí ẩn sâu sắc."
  activity_witch_ritual_destination_selection:0 "Ngươi chỉ có thể tổ chức $activity_witch_ritual$ tại [capital|E] của mình."
  activity_witch_ritual_selection_tooltip:0 "Tôn thờ [GetPlayer.GetFaith.WitchGodName] và đón nhận món quà tối tăm của [GetPlayer.GetFaith.WitchGodHerHis|U]\n\nPhần thưởng dự kiến:\n$BULLET_WITH_TAB$[opinion_i] [opinion|E]\n$BULLET_WITH_TAB$[stress_loss_i] Mất [stress|E]"
  activity_witch_ritual_province_capital_desc: "Đây là [capital|E] của Ngài"
  activity_witch_ritual_province_domicile_desc: "Đây là [domicile|E] của Ngài"
  activity_witch_ritual_province_both_desc: "$activity_witch_ritual_province_capital_desc$ và [domicile|E]"
  activity_witch_ritual_host_desc:1 "$BULLET_WITH_TAB$Có thể nhận Kinh nghiệm Lối Sống\n$BULLET_WITH_TAB$Người tham gia có thể nhận [opinion|E]\n$BULLET_WITH_TAB$Người tham gia có thể mất [stress_loss_i][stress|E]"
  activity_witch_ritual_conclusion_desc:1 "[GetActivityType( 'activity_witch_ritual' ).GetName] đã kết thúc"
  activity_witch_ritual_guest_desc:1 "$BULLET_WITH_TAB$Người tham gia có thể nhận [opinion|E]\n$BULLET_WITH_TAB$Người tham gia có thể mất [stress_loss_i][stress|E]"
  activity_witch_ritual_guest_help_text:0 "$activity_witch_ritual_desc$"
  witch_ritual_phase_desc:0 "Tận tâm với [GetPlayer.GetFaith.WitchGodName]"
  host_witch_ritual_title:0 "Đại Lễ"
  host_witch_ritual:0 "Tôn thờ [GetPlayer.GetFaith.WitchGodName]"

  host_witch_ritual_decision_cooldown:0 "Ta sẽ không thể tổ chức Đại Lễ khác trong #N 10 năm#!"

 ### PHASES
  witch_ritual_phase:0 "Nghi Lễ Tối"

 ### INTENTS
  worship_devil_intent:2 "Tôn thờ [GetPlayer.GetFaith.WitchGodName]"
  worship_devil_intent_desc:1 "Tận tâm với Đấng Bí Ẩn. Bằng thân thể. Bằng tâm trí."

 #Invitation
  witch.3001.t:0 "Thân gửi [ROOT.Char.Custom('SisterBrother')|U] [ROOT.Char.GetFirstNameNoTooltip],"
  witch.3001.desc:0 "Đã đến lúc cho $activity_witch_ritual$ của hội phù thủy [host.GetHouse.GetBaseNameNoTooltip]. Ta mời ngươi thờ phụng [ROOT.Char.GetFaith.WitchGodName] vào đêm trăng tròn. Cùng nhau, chúng ta sẽ tụng niệm tên của [ROOT.Char.GetFaith.WitchGodHerHis|U] và đi sâu vào những bí ẩn của [ROOT.Char.GetFaith.WitchGodHerHis|U]!"
  witch.3001.a:0 "Ta nóng lòng chờ đợi!"
  witch.3001.b:0 "Thà ta ăn một bát sên còn hơn."

 #Uninvited guest
  witch.3003.t:2 "Khách Không Mời"
  witch.3003.desc:1 "Khi các phù thủy đồng môn đến [capital.GetNameNoTooltip], ta bắt gặp một gương mặt lạ.\n\nKhi đi chào [inviter.Custom2('MyCharacterIntroduction', ROOT.Char)], [inviter.GetSheHe] giới thiệu [new_guest.GetWomanMan] lạ là [new_guest.GetFirstName]. Hóa ra họ là Ngài cũ, và [inviter.GetFirstNameNoTooltip] hỏi liệu [new_guest.GetFirstNameNoTooltip] có thể tham gia lễ của chúng ta không."
  witch.3003.a:0 "Càng đông càng vui!"
  witch.3003.b:0 "Ngươi sẽ là khách danh dự, [new_guest.GetFirstNameNoTooltip]."
  witch.3003.c:0 "$activity_witch_ritual$ là sự kiện riêng tư."

 #No one attended
  witch.3002.t:1 "Thiếu Tận Tâm"
  witch.3002.desc:0 "Không một ai chấp nhận lời mời của ta. Họ không xứng đáng nhận phước lành của [ROOT.Char.GetFaith.WitchGodName]!"
  witch.3002.a:0 "Họ sẽ biết cơn thịnh nộ của [ROOT.Char.GetFaith.WitchGodHerHis|U]."

 #Starting event
  every_grand_rite_participant:0 "Mọi khách tại $activity_witch_ritual$"
  witch.3010.t:2 "Trăng Tròn Lên"
  witch.3010.desc:0 "Khi trăng lên cao trên trời, báo hiệu sự xuất hiện của [ROOT.Char.GetFaith.WitchGodHerHis|U], ta cảm nhận cơ thể mình đáp ứng năng lượng lạ trong không khí. Những bóng người quanh đống lửa lớn im lặng, bất động. Chờ đợi những gì sắp đến.\n\nLà chủ lễ, ta phải bắt đầu nghi lễ. Ta sẽ..."
  witch.3010.a:0 "Đọc từ cuốn sách ma thuật cổ."
  witch.3010.a.great:0 "Bản dịch của ta xuất sắc"
  witch.3010.a.poor:0 "Bản dịch của ta kém"
  witch.3010.b:0 "Chơi trò âm thanh và bóng tối."
  witch.3010.b.great:0 "Trò của ta thật tuyệt vời"
  witch.3010.b.poor:0 "Trò của ta thật buồn cười"
  witch.3010.c:0 "Dựa vào uy tín và ứng biến"
  witch.3010.c.great:0 "Khả năng ứng biến của ta đầy cảm hứng"
  witch.3010.c.poor:0 "Khả năng ứng biến của ta rối rắm"
  witch.3010.d:0 "Dâng lễ vật hoành tráng."
  witch.3010.e:0 "Đọc các lời cầu truyền thống."
  witch.3010.e.tt:0 "$activity_name$ tiếp tục như bình thường"

 #What to do after the rite
  witch.3014.host.great_translation.desc:0 "Những lời cổ xưa thật lạ, nhưng chúng chạm đến ta ở mức bản năng. Chúng dệt nên một mô hình mê hoặc, đầy vẻ đẹp và lời hứa. Khách mời hoàn toàn bị thôi miên.\n\nKhi ta đóng cuốn grimoire bằng một cử chỉ đầy kịch tính, những tràng hoan hô vang lên khắp rừng."
  witch.3014.host.poor_translation.desc:0 "Dù cố gắng đến mấy, những lời cổ xưa vẫn không rõ nghĩa. Biểu cảm của khách mời chuyển từ háo hức sang bối rối rồi thất vọng. Trước khi làm trò cười hơn nữa, ta ứng biến một kết thúc bớt thất vọng. Đám đông nhanh chóng tan rã khi ta xong việc."
  witch.3014.host.great_tricks.desc:0 "Phước lành của [ROOT.Char.GetFaith.WitchGodName] thật nhiều, và trong đó có việc biết khi nào nên dùng chút thủ thuật. Với gương, kèn và trợ giúp sẵn sàng, ta tạo nên một buổi biểu diễn ngoạn mục. Không khí dày đặc sự pha trộn hồi hộp giữa sợ hãi và thích thú. Ta chẳng nhớ lần cuối cảm thấy sống động đến vậy là khi nào!"
  witch.3014.host.poor_tricks.desc:0 "Khi luyện tập một mình trong phòng, trò của ta hiệu quả, nhưng có vẻ hôm nay thần kinh khiến ta lúng túng. Không ai bị thuyết phục — ta còn nghe thấy ai đó nín cười phía sau. Trước khi làm trò cười lớn hơn, ta ứng biến kết thúc nhanh buổi lễ."
  witch.3014.host.great_improvisation.desc:0 "Khi dẫn dắt đám đông qua nghi lễ, ta cẩn thận quan sát phản ứng và điều chỉnh lời nói. Không lâu sau, ta cưỡi trên làn sóng phấn khích của họ, những tràng hoan hô tiếp sức khi ta hướng tới cao trào rực rỡ. Chúng ta đạt đỉnh cùng nhau, hú tên [ROOT.Char.GetFaith.WitchGodHerHis|U] lên trăng như một."
  witch.3014.host.poor_improvisation.desc:0 "Có lẽ ta nên chuẩn bị tốt hơn. Khả năng ứng biến của ta thiếu sức sống và lộn xộn. Ta nhận ra đang mất đám đông, nên cuối cùng quay sang lời cầu truyền thống. Đám đông nhanh chóng tan rã khi xong việc."
  witch.3014.host.offering.desc:0 "Chúng ta đều biết [ROOT.Char.GetFaith.WitchGodHerHis|U] yêu thích đồ ăn và thức uống thịnh soạn. Bàn đầy bánh kẹo, thùng rượu, trái cây lạ và bánh bơ. Chúng ta dâng những món ngon nhất lên [ROOT.Char.GetFaith.WitchGodName], trước khi thưởng thức phần còn lại."
  witch.3014.host.fallback.desc:0 "Những lời cầu cũ có thể không tinh vi, nhưng cũng không đơn giản. Ngắn gọn, súc tích, chứa những chân lý thiêng liêng và quyền năng nhất của [ROOT.Char.GetFaith.WitchGodHerHis|U]. Đọc lại như rơi vào vòng tay an toàn của mẹ."
  witch.3014.guest.start.desc:0 "Vào đêm Đại Lễ, chúng ta tụ họp tại một rừng hẻo lánh. Đống lửa lớn sưởi ấm lưng, không khí nặng trĩu sự hồi hộp."
  witch.3014.guest.good.desc:0 "[host.GetTitledFirstName] dẫn chúng ta qua nghi lễ ngoạn mục. Những lời cầu cổ xưa tuôn chảy trên môi, dệt nên mô hình mê hoặc, đầy vẻ đẹp và lời hứa. Chúng ta bắt đầu nhảy múa, hướng tới cao trào rực rỡ. Cùng nhau, chúng ta hú tên [ROOT.Char.GetFaith.WitchGodHerHis|U] lên trăng."
  witch.3014.guest.bad.desc:0 "[host.GetTitledFirstName] dẫn dắt chúng ta qua một nghi lễ khó xử. [host.GetSheHe|U] đang cố gắng hết sức để làm cho đêm nay trở nên đặc biệt, nhưng những nỗ lực của [host.GetHerHis] thật yếu ớt. Ít nhất thì danh sách khách mời cũng rất thú vị..."
  witch.3014.guest.fallback.desc:0 "[host.GetTitledFirstName] dẫn qua nghi lễ với đúng lời và cử chỉ. Những lời cầu cổ xưa tuôn chảy, nhưng vẻ đẹp và quyền năng đi kèm bị giảm; [host.GetTitledFirstNameNoTooltip] làm khá, nhưng vẫn thiếu gì đó."
  witch.3014.host.end.desc:0 "\n\nGiờ nghi lễ chính đã xong, ta và khách tự do tôn thờ theo ý muốn."
  witch.3014.guest.end.desc:0 "\n\nGiờ nghi lễ chính đã xong, chúng ta tự do tôn thờ theo ý muốn."
  witch.3014.a:0 "Thử nghiệm thảo mộc cùng [herbalist.GetFirstNameNoTooltip]."
  witch.3014.a.knowledge:0 "[herbalist.GetFirstNameNoTooltip] dạy ta điều mới"
  witch.3014.a.inspiration:0 "Cuộc trò chuyện truyền cảm hứng"
  witch.3014.b.start:0 "Nhờ [teacher.GetFirstNameNoTooltip] dạy ta nghệ thuật"
  witch.3014.b.diplomacy:0 "thuyết phục."
  witch.3014.b.martial:0 "chiến lược."
  witch.3014.b.stewardship:0 "thương mại."
  witch.3014.b.intrigue:0 "âm mưu."
  witch.3014.b.learning:0 "thơ ca."
  witch.3014.c:0 "Chia sẻ những món quà xác thịt của [ROOT.Char.GetFaith.WitchGodHerHis|U] với ai đó."
  witch.3014.c.tt:1 "Ngài tìm người có cùng ham muốn"
  witch.3014.d:0 "Dành thời gian với [new_guest.Custom('ComplimentAdjective')] [new_guest.GetFirstNameNoTooltip]."
  witch.3014.e:0 "Người [sex_partner.Custom('LoverPetName')] của ta đâu? Ta thèm chạm [sex_partner.GetHerHis]..."
  witch.3014.d.move_in:0 "Chúng ta hòa hợp tuyệt vời"
  witch.3014.d.friend:0 "Chúng ta hòa hợp tốt"
  witch.3014.d.enemy:0 "Chúng ta tranh cãi dữ dội"
  witch.3014.f:1 "Cười, uống, nhảy múa — tận hưởng phước lành của [ROOT.Char.GetFaith.WitchGodHerHis|U]!"

 #Regular seduction event
  witch.3015.t:1 "Bên Hồ"
  witch.3015.start.desc:0 "Sức mạnh của [ROOT.Char.GetFaith.WitchGodName] chảy trong huyết quản khi ta lang thang vào rừng. Những tiếng thở dài và rên rỉ chào đón ta — ta không phải người duy nhất khao khát tối nay.\n\n"
  witch.3015.new_guest.desc:0 "Ta tình cờ gặp người quen mới, [sex_partner.GetFirstName], bên hồ dưới ánh trăng."
  witch.3015.regular.desc:0 "Ta thấy [sex_partner.Custom2('MyCharacterIntroduction', ROOT.Char)] bên hồ dưới ánh trăng."
  witch.3015.end.desc:0 "Khi nhìn vào mắt [sex_partner.GetHerHis], mọi thứ trở nên rõ ràng. Đây là ý muốn của [ROOT.Char.GetFaith.WitchGodHerHis|U]. [sex_partner.GetSheHe|U] mời ta đến gần..."
  witch.3015.a:0 "Hãy thờ phụng cùng nhau."
  witch.3015.b:0 "Ta... đang tìm người khác."
  witch.3015.b.tt:1 "Ngài ở một mình suốt đêm"

 #Lover/spouse seduction event
  witch.3016.t:1 "Các Vì Sao Hội Tụ"
  witch.3016.end.desc:0 "Một giọng nói quen thuộc gọi ta — đó là [sex_partner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. Khi ta quay lại và gặp ánh mắt [sex_partner.GetHerHis], mọi thứ trở nên rõ ràng. Chúng ta... Là ý muốn của [ROOT.Char.GetFaith.WitchGodHerHis|U]. Chúng ta thuộc về nhau."
  witch.3016.a:0 "Mãi bên nhau."
  witch.3016.b:0 "Ta... chưa sẵn sàng."

 #Soulmate seduction event
  witch.3017.end.desc:0 "Ta không thấy [sex_partner.GetFirstName] đi đâu, nhưng không cần. Ta bị hút về [sex_partner.GetHerHim] như nam châm với sắt. Khi tìm thấy [sex_partner.GetHerHim], đôi mắt đẹp của [sex_partner.GetHerHis] không ngạc nhiên — chỉ có tình yêu và khao khát."
  witch.3017.a:0 "Ta đã khao khát ngươi biết bao."
  witch.3017.b:0 "Ta... quên mất gì đó! Xin lỗi!"

 #End events
  witch.3098.t:1 "Cho Đến Lần Sau"
  witch.3098.start.desc:0 "Ta và khách"
  witch.3098.end.desc:0 "đã thờ phụng [ROOT.Char.GetFaith.WitchGodName], trao đổi kiến thức thiêng liêng và thắt chặt những mối quan hệ sâu sắc. Tâm trí ta đang rộn ràng với những ý tưởng mới, nhưng cơ thể ta đang rất cần được nghỉ ngơi. Một chiếc giường ấm áp chưa bao giờ cảm thấy cám dỗ đến thế."
  witch.3098.a:0 "Nguyện [ROOT.Char.GetFaith.WitchGodSheHe|U] phù hộ chúng ta đến $activity_witch_ritual$ tiếp theo."
  witch.3099.start.desc:0 "Cùng nhau, chúng ta"
  witch.3099.tt:0 "Trở về nhà khi $activity_witch_ritual$ kết thúc"


 ########################
 # ONGOING WITCH EVENTS #
 ########################

 ### Court chaplain / other clergy is an idiot ###
  witch.4001.t:0 "Phán Xét Thần Thánh"
  witch.4001.start.desc:0 "[annoying_clergy.Custom2('MyCharacterIntroduction', ROOT.Char)|U] thực sự làm ta phát cáu! Không một khoảnh khắc nào trôi qua mà [annoying_clergy.GetSheHe] không lải nhải về [annoying_clergy.GetFaith.HighGodName] và ý muốn của [annoying_clergy.GetFaith.HighGodHerHis|U].\n\n[annoying_clergy.GetSheHe|U] đặc biệt thích kể cho mọi người nghe về cách [annoying_clergy.GetFaith.HighGodNameAlternate]"
  witch.4001.forgiving.desc:0 "cho rằng tha thứ là yếu đuối."
  witch.4001.deceitful.desc:0 "sẽ trừng phạt kẻ dối trá."
  witch.4001.gluttonous.desc:0 "trừng phạt kẻ ham ăn uống."
  witch.4001.wrathful.desc:0 "sẽ trừng phạt kẻ nóng nảy."
  witch.4001.greedy.desc:0 "sẽ trừng phạt kẻ tham lam."
  witch.4001.arbitrary.desc:0 "đòi hỏi chúng ta công bằng và chính trực."
  witch.4001.sadistic.desc:0 "sẽ trừng phạt kẻ tàn nhẫn với người khác."
  witch.4001.craven.desc:0 "sẽ trừng phạt kẻ nhút nhát và cẩn trọng."
  witch.4001.lustful.desc:0 "sẽ trừng phạt kẻ gian dâm và mại dâm."
  witch.4001.vengeful.desc:0 "đòi chúng ta phải nhẫn nhịn."
  witch.4001.arrogant.desc:0 "cho rằng tự hào về thành tựu của mình là tội lỗi."
  witch.4001.fallback.desc:0 "sẽ trừng phạt kẻ tội lỗi."
  witch.4001.witch.desc:0 "Nhưng sao ta phải nghe [annoying_clergy.GetHerHim], khi [ROOT.Char.GetFaith.WitchGodName] chấp nhận chúng ta như ta vốn có, với mọi khuyết điểm? Thật cuộc sống buồn tẻ của [annoying_clergy.GetFirstNameNoTooltip]!"
  witch.4001.impious.desc:0 "[annoying_clergy.GetFaith.HighGodName] thật là một thằng xét đoán!"
  witch.4001.a:0 "Ta sẽ biến [annoying_clergy.GetHerHim] thành trò cười của [capital.GetNameNoTooltip]!"
  witch.4001.a.tt:0 "Không chỉ có [annoying_clergy.GetFaith.HighGodName] mới có quyền xét đoán!"
  witch.4001.a.success:0 "Ngài biến [annoying_clergy.GetShortUINameNoTooltip] thành trò cười"
  witch.4001.a.failure:0 "[annoying_clergy.GetShortUINameNoTooltip] phát hiện âm mưu của Ngài"
  witch.4001.c:0 "Giả vờ ngoan đạo sẽ khiến [annoying_clergy.GetHerHim] im lặng."
  witch.4001.b:0 "[annoying_clergy.GetSheHe|U] sẽ không biết tin vào điều gì khi ta xong việc với [annoying_clergy.GetHerHim]."
  witch.4001.b.success:0 "Ngài phá vỡ niềm tin của [annoying_clergy.GetShortUINamePossessiveNoTooltip] vào [annoying_clergy.GetFaith.HighGodName]"
  witch.4001.b.neutral:0 "[annoying_clergy.GetShortUINameNoTooltip] còn do dự"
  witch.4001.b.neutral.tt:0 "Ngài có thể chọn bỏ cuộc hoặc tiếp tục cố gắng"
  witch.4001.b.failure:0 "Ngài thất bại trong việc ảnh hưởng tới [annoying_clergy.GetShortUINameNoTooltip]"
  witch_4001_corruption_success_effect.tt:0 "Ngài có thể [blackmail|E] [annoying_clergy.GetShortUIName] về [annoying_clergy.GetHerHis] [secret|E]"
  witch.4002.witch.desc:0 "[ROOT.Char.GetFaith.WitchGodName|U] hẳn đã giúp ta, vì kế hoạch của ta còn tốt hơn dự kiến!\n\n"
  witch.4002.impious.desc:0 "Kế hoạch của ta hoàn hảo!\n\n"
  witch.4002.gluttonous.desc:0 "[annoying_clergy.GetTitledFirstName] đã ăn ngấu nghiến [annoying_clergy.GetHerselfHimself] những chiếc bánh tẩm thuốc mà ta đã gửi đến phòng của [annoying_clergy.GetHerHis]. Sau đó, [annoying_clergy.GetSheHe|U] bắt đầu lang thang quanh thị trấn với mứt và vụn bánh dính đầy quanh miệng [annoying_clergy.GetHerHis], trước khi ngủ thiếp đi trên các bậc thang của [annoying_clergy.GetFaith.HouseOfWorship]!"
  witch.4002.lustful.desc:0 "Ta đã viết một bài thơ đặc biệt khiêu gợi về [lustful_desc.Custom2('MyCharacterIntroduction', ROOT.Char)] và "[lustful_desc.Custom('ObjectifiedFeature')]" của [lustful_desc.GetHerHis], giả mạo chữ ký của [annoying_clergy.GetTitledFirstNamePossessive], và gửi đến phòng của lãnh chúa. [lustful_desc.GetFirstName] đã #EMP không#! hài lòng với sự tận tâm này, cũng như [lustful_desc.GetSheHe] không kín đáo về điều đó."
  witch.4002.craven.desc:0 "Trong khi [annoying_clergy.GetTitledFirstName] đang ngủ, ta đã lén bỏ một con chuột vào giữa ga giường của [annoying_clergy.GetHerHis]. Ta hầu như không có thời gian để ẩn nấp trước khi [annoying_clergy.GetSheHe] tỉnh dậy với một tiếng thét, quăng [annoying_clergy.GetHerselfHimself] ra khỏi giường và chạy ra ngoài cửa — trần như nhộng!"
  witch.4002.vengeful.desc:0 "Ta đã hối lộ một thư ký để thuyết phục [annoying_clergy.GetTitledFirstName] rằng [vengeful_desc.Custom2('MyCharacterIntroduction', ROOT.Char)] đã lăng mạ [annoying_clergy.GetHerHim] sau lưng [annoying_clergy.GetHerHis]. Những ngày sau đó, [annoying_clergy.GetFirstNameNoTooltip] cực kỳ thô lỗ với [vengeful_desc.GetFirstNameNoTooltip] tội nghiệp mỗi khi [annoying_clergy.GetSheHe] có cơ hội. Cuối cùng, [vengeful_desc.GetFirstNameNoTooltip] đã đối chất với [annoying_clergy.GetHerHim] về hành vi ác ý của [annoying_clergy.GetHerHis]. [annoying_clergy.GetFirstNameNoTooltip] không có gì để nói để biện hộ cho [annoying_clergy.GetHerHis]."
  witch.4002.wrathful.desc:0 "Ta biết [annoying_clergy.GetTitledFirstName] rất hay say, và [annoying_clergy.GetSheHe] hơi để ý đến một trong các Bạn Bè của ta. Ta nhờ [wrathful_desc.GetWomanMan] mang một chai rượu đắt và mạnh tới phòng [annoying_clergy.GetTitledFirstNamePossessiveNoTooltip]. Với lời hứa thăng chức, [wrathful_desc.GetSheHe] làm [annoying_clergy.GetHerHim] say kịp thời cho [annoying_clergy.Custom('GetReligiousRite')]."
  witch.4002.arrogant.desc:0 "Mặc dù [annoying_clergy.GetSheHe] cố gắng che giấu, ta biết [annoying_clergy.GetTitledFirstName] rất quan tâm đến vẻ ngoài của [annoying_clergy.GetHerHis]. [annoying_clergy.GetSheHe|U] có một loại thuốc mỡ mà [annoying_clergy.GetSheHe] bôi một cách sùng đạo mỗi sáng. Ta đã lén vào phòng của [annoying_clergy.GetHerHis] và thêm một vài loại thảo mộc gây kích ứng vào đó. Ngày hôm sau, khuôn mặt của [annoying_clergy.GetTitledFirstNamePossessiveNoTooltip] đã bị nổi mề đay!"
  witch.4002.end.desc:0 "\n\nĐây là chủ đề duy nhất mọi người bàn tán tối qua. [annoying_clergy.GetFirstNameNoTooltip] sẽ không bao giờ quên chuyện này!"
  witch.4002.a:0 "Đúng là [annoying_clergy.GetHerHim] đáng đời!"

  witch.4003.desc:0 "Ẩn mình trong lối đi bí mật sau phòng của [annoying_clergy.GetTitledFirstNamePossessive], ta vui vẻ lắng nghe những tiếng rên rỉ và thở dài của kẻ [annoying_clergy.Custom2('InsultAdjective', ROOT.Char)] [annoying_clergy.Custom('WomanManPossessive')]. [annoying_clergy.GetSheHe|U] đã đọc cuốn sách mà ta để lại trên giường của [annoying_clergy.GetHerHis] — thực tế, [annoying_clergy.GetSheHe] đã không thể đặt nó xuống.\n\nNhững sự thật bên trong dường như đã có tác động đáng kể đến đức tin của [annoying_clergy.GetHerHis]. \"Ồ, [annoying_clergy.GetFaith.HighGodNameAlternate]! Ta cần một dấu hiệu! Ta đã tin vào ngài, thực hiện ý chí của ngài trên Trái Đất, nhưng giờ đây... Tất cả những gì ta có thể thấy là những mâu thuẫn, những ngụy biện, những... lời dối trá!\"\n\nGiọng nói của [annoying_clergy.GetTitledFirstNamePossessiveNoTooltip] tan vỡ thành những tiếng nức nở không thành tiếng."
  witch.4003.a:0 "Ta ra đi, công việc đã hoàn thành."
  witch.4003.b:0 "[annoying_clergy.GetSheHe|U] đã sẵn sàng cho chân lý lớn hơn."
  witch.4003.c:0 "[annoying_clergy.GetSheHe|U] sẽ trở thành đệ tử ta!"

  witch.4004.desc:0 "Dưới vỏ bọc ngây thơ của những truy vấn thần học, ta đã gieo rắc nghi ngờ vào trái tim của [annoying_clergy.GetTitledFirstNamePossessive]. Ta có thể thấy đức tin của [annoying_clergy.GetHerHis] đang dao động từ những câu trả lời không chắc chắn của [annoying_clergy.GetHerHis] và cái bóng lo âu bao trùm khuôn mặt của [annoying_clergy.GetHerHis] khi [annoying_clergy.GetSheHe] nghĩ rằng không có ai nhìn thấy.\n\nTa chưa ở đó, chưa hẳn, nhưng một nỗ lực cuối cùng #EMP nên#! bẻ gãy [annoying_clergy.GetHerHim]."
  witch.4004.a:0 "Đó là nỗ lực đáng giá!"
  witch.4004.b:0 "Thời gian của ta nên dành cho việc khác."

  witch.4005.desc:0 "Ta để một cuốn sách sự thật khó chịu trong phòng [annoying_clergy.GetTitledFirstNamePossessive], nhưng thấy [annoying_clergy.GetHerHim] ném nó vào lửa chỉ sau vài trang. Thử thách chắc đã củng cố đức tin [annoying_clergy.GetHerHis] — ta không còn thấy chút dao động nào trong lòng [annoying_clergy.GetHerHis]."
  witch.4005.a:0 "[annoying_clergy.GetSheHe|U] dù sao cũng không xứng đáng!"

#PERSONAL WITCH RITUAL
  witch.4010.t:0 "Những Món Quà Dồi Dào của [ROOT.Char.GetFaith.WitchGodHerHis|U]"
  witch.4010.desc:1 "Ta rải những món quà lên đất; thảo mộc, sữa và mật ong. Nhắm mắt, khói xộc vào mũi, ta giơ tay về phía trăng.\n\n"[ROOT.Char.GetFaith.WitchGodMistressMaster|U]! Người biết mọi chân lý, [ROOT.Char.GetFaith.WitchGodMotherFather] của mọi quyền năng! Xin hãy nhận những món quà nhỏ nhoi của ta, và ban dẫn dắt cho ta!"\n\nTa cầu xin [ROOT.Char.GetFaith.WitchGodName] về..."
  witch.4010.a:0 "May mắn trong nghệ thuật tình yêu."
  witch.4010.b:0 "Duyên và khéo léo."
  witch.4010.c:0 "Tâm trí chiến lược."
  witch.4010.d:0 "Tư duy về tiền bạc và trật tự."
  witch.4010.e:0 "Sự trợ giúp của bóng tối."
  witch.4010.f:0 "Trí tuệ và sự khôn ngoan."
  witch.4010.g:0 "May mắn với lưỡi dao."
  witch.4010.h:0 "Bình an trong tâm hồn."

# Witch friends: prayer, by Mathilda Bjarnehed
  witch.4020.t:0 "Nhận hay Ban"
  witch.4020.two_witches.desc:0 "[prayer_witch_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] và [prayer_witch_2.Custom2('MyCharacterIntroduction', ROOT.Char)] tham gia cùng ta cho"
  witch.4020.one_witch.desc:0 "[prayer_witch_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tham gia cùng ta cho"
  witch.4020.full_moon.desc:0 "một nghi lễ trăng tròn"
  witch.4020.new_moon.desc:0 "một nghi lễ trăng non"
  witch.4020.equinox.desc:0 "một nghi lễ điểm chí"
  witch.4020.solstice.desc:0 "một nghi lễ điểm chí"
  witch.4020.end.desc:0 "vinh danh [ROOT.Char.GetFaith.WitchGodName]. Là chủ lễ, ta có trách nhiệm dẫn chúng ta cầu nguyện."
  witch.4020.a:0 "Người khôn ngoan [ROOT.Char.GetFaith.WitchGodMistressMaster|U], ban cho [prayer_witch_1.GetFirstNameNoTooltip] sự bình an và sáng suốt!"
  witch.4020.b:0 "Ban phước lành cho [prayer_witch_2.GetFirstNameNoTooltip]!"
  witch.4020.c:0 "[ROOT.Char.GetFaith.WitchGodMotherFather|U] của bí mật, cho ta sức mạnh!"

  witch.4030.t:0 "Những Bí Mật Bọc Da"
  witch.4030.no_friend.desc:1 "Liên lạc của ta gửi cuốn sách viết bằng một mật mã lạ, bìa da trang trí bằng biểu tượng của [ROOT.Char.GetFaith.WitchGodMistressMaster|U].\n\nTa mới chỉ giải mã vài trang đầu, nhưng chúng cực kỳ hấp dẫn."
  witch.4030.friend.desc:1 "Người Bạn Tốt [ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('witch_friend'))] [witch_friend.GetTitledFirstName] mang cho ta cuốn sách viết bằng mật mã lạ, bìa da trang trí bằng biểu tượng [ROOT.Char.GetFaith.WitchGodMistressMaster|U].\n\n[witch_friend.GetSheHe|U] mới chỉ giải mã vài trang đầu, nhưng chúng cực kỳ hấp dẫn."

  witch.4030.friend.a:0 "Chúng ta sẽ cùng nhau mở ra bí mật."
  witch.4030.no_friend.a:0 "Ta sẽ mở ra bí mật, bất kể mất bao lâu!"
  witch.4030.b:0 "Ta biết một tín đồ khác sẽ trả vàng để có được."
  witch.4030.c:0 "Ngay cả [convince_target_1.GetTitledFirstNameNoTooltip] cũng sẽ bị thu hút."
  witch.4030.c.success:0 "[convince_target_1.GetShortUIName|U] say mê với cuốn sách"
  witch.4030.c.failure:0 "[convince_target_1.GetShortUIName|U] đốt cuốn sách"
  witch.4030.d:0 "[convince_target_2.GetTitledFirstNameNoTooltip] sẽ thấy điều này #EMP rất#! thú vị."
  witch.4030.d.success:0 "[convince_target_2.GetShortUIName|U] say mê với cuốn sách"
  witch.4030.d.failure:0 "[convince_target_2.GetShortUIName|U] đốt cuốn sách"

  witch.4031.start.desc:0 "Ta có tầm nhìn không bị cản trở vào cuốn sách, thứ mà ta để lại giữa những món đồ của [convince_target.GetTitledFirstNamePossessive], từ một lỗ nhìn trộm phía sau [convince_target.GetHerHis] [convince_target.Custom('GetChamber')]. Đôi mắt của [convince_target.GetHerHis|U] bị cuốn hút vào nó ngay khi [convince_target.GetSheHe] bước qua ngưỡng cửa, gần như thể cuốn sách sở hữu phép thuật kỳ lạ của riêng nó.\n\n"
  witch.4031.end.desc:0 "Khi [convince_target.GetFirstNameNoTooltip] đọc xong những trang đã dịch, [convince_target.GetSheHe] bắt đầu đi lại qua lại. Cuối cùng, sức hút của cuốn sách dường như không thể cưỡng lại; [convince_target.GetSheHe] vội vàng chộp lấy chiếc bút lông của [convince_target.GetHerHis]."
  witch.4031.a:0 "Đúng vậy, Bạn ta. Khám phá sâu hơn, sâu hơn..."

  witch.4032.end.desc:0 "[convince_target.GetFirstNameNoTooltip] thậm chí còn không mở cuốn sách. Một tiếng thở hổn hển có thể nghe thấy phát ra từ môi của [convince_target.GetHerHis] khi [convince_target.GetSheHe] nhìn thấy những ký hiệu lạ, và [convince_target.GetSheHe] ném nó ra xa khỏi [convince.GetHerselfHimself]."
  witch.4032.a:0 "#EMP Không!#! Nguyện [ROOT.Char.GetFaith.HighGodName] nguyền kẻ hèn nhát này!"
