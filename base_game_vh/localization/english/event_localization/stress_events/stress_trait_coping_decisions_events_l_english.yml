l_english: 

  stress_trait_coping_decisions.1001.t:0 "Đối Phó Căng Thẳng: Uống Lên!"
  stress_trait_coping_decisions.1001.desc:0 "Thêm một cốc nữa, vai Ta thảnh thơi hơn một chút. #EMP Đây#! mới là cách Ta nên tận hưởng thời gian – tỉnh táo là chịu khổ."
  stress_trait_coping_decisions.1001.a:0 "Ta– #EMP *hic*#! Ta đã cảm thấy khá hơn rồi!"

  stress_trait_coping_decisions.1002.t:0 "Đối Phó Căng Thẳng: Ngài Uống!"
  stress_trait_coping_decisions.1002.desc:0 ""[ROOT.Char.GetFirstNameNoTooltip]! Chào!"\n\nĐột nhiên [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fellow_drunkard'))], [fellow_drunkard.GetTitledFirstName], ngồi xuống bên cạnh Ta, cầm cốc. Rõ ràng [fellow_drunkard.GetSheHe] cũng đến quán rượu để thư giãn, và chúng Ta dành phần còn lại của đêm để uống cùng nhau.\n\nTa đã lâu lắm rồi mới cảm thấy thư giãn đến thế trong #EMP mấy tháng#!!"
  stress_trait_coping_decisions.1002.a:0 "Uống đi, Bạn ta!"

  stress_trait_coping_decisions.1003.t:0 "Ngài Uống!"
  stress_trait_coping_decisions.1003.desc:0 "Ta đang uống rượu một mình trong tửu quán thì bỗng nhiên thấy [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('original_drunkard'))] của ta, [original_drunkard.GetTitledFirstName], ngồi xuống đối diện ta.\n\nTa nhanh chóng tiến lại gần, và chúng ta dành phần còn lại của đêm để uống rượu cùng nhau. [original_drunkard.GetSheHe|U] thực sự biết cách tận hưởng cuộc vui đấy!"

  stress_trait_coping_decisions.1004.t:0 "Đối Phó Căng Thẳng: Sáng Lúng Túng"
  stress_trait_coping_decisions.1004.desc:0 "Ta thức dậy với cái đầu gối trên một chiếc gối êm ái và nhiều thân hình ấm áp ở bên cạnh. Đó hẳn phải là một đêm ra trò đây! Ta chỉ có thể nhớ mang mán–\n\n#EMP Be heee!#!\n\n... Hửm. Khi ta mở mắt ra, chào đón ta là một đôi mắt ti hí trên một khuôn mặt vô cùng #EMP trắng#! và #EMP mềm mại#!. Bỗng nhiên chiếc gối của ta đứng dậy và bước đi, và những người bạn cùng giường đang say ngủ cũng lập tức bám đuôi theo. Ta bị bỏ lại trơ trọi một mình trên đống cỏ khô."
  stress_trait_coping_decisions.1004.a:0 "Thôi... Ta đã có một giấc ngủ cừu– tuyệt vời!"

  stress_trait_coping_decisions.1501.t:0 "Đối Phó Căng Thẳng: Làn Khói Dịu Dàng"
  stress_trait_coping_decisions.1501.desc:1 "Ta tựa lưng vào ghế, nhẹ nhàng lấy thêm một chiếc bánh, vị ngọt dịu lan trên lưỡi, một làn sương dễ chịu dần xua tan mọi phiền muộn.\n\nTa đã lâu lắm rồi mới bình tĩnh đến thế trong #EMP mấy tuần#!!. Chỉ… ở đây. Với mâm bánh phủ hạt hashish. Thế là đủ."
  stress_trait_coping_decisions.1501.a:0 "Đây là tất cả những gì Ta cần."

  stress_trait_coping_decisions.2001.t:0 "Đối Phó Căng Thẳng: Dục Vọng Thả Lỏng"
  stress_trait_coping_decisions.2001.desc_woman:0 "Ta nằm giữa một mớ hỗn độn của các cánh tay và chân, [ROOT.Char.Custom('AttractionWomanManIndef')] ở trên Ta, cảm giác giải thoát – và nhẹ nhõm – lan qua cơ thể."
  stress_trait_coping_decisions.2001.desc_man:0 "Ta nằm giữa một mớ hỗn độn của các cánh tay và chân, [ROOT.Char.Custom('AttractionWomanManIndef')] cưỡi lên Ta, cảm giác giải thoát – và nhẹ nhõm – lan qua cơ thể."
  stress_trait_coping_decisions.2001.desc_ending:0 "\n\nTâm trí Ta bình thản hơn so với #EMP mấy tuần#!!, nhưng nhịp tim vẫn đập mạnh! Tuyệt vời!"
  stress_trait_coping_decisions.2001.a:0 "Lần nữa. Lại đây, [ROOT.Char.Custom('AttractionGirlBoyPlural')]!"

  stress_trait_coping_decisions.2002.t:0 "Đối Phó Căng Thẳng: Giá Của Đam Mê"
  stress_trait_coping_decisions.2002.desc_woman:0 "Ta thức dậy sau một đêm đầy đam mê. Và [ROOT.Char.Custom('AttractionWomanMan')], nhất quyết ở lại lâu hơn mọi người, chiều Ta đến khi Ta ngủ… #EMP Hừm#!, thật là một #EMP trải nghiệm#!!"
  stress_trait_coping_decisions.2002.desc_man:0 "Ta thức dậy sau một đêm đầy đam mê. Và [ROOT.Char.Custom('AttractionWomanMan')], nhất quyết ở lại lâu hơn mọi người, cưỡi Ta đến khi Ta ngủ… #EMP Hừm#!, thật là một #EMP trải nghiệm#!!"
  stress_trait_coping_decisions.2002.desc:0 "\n\nTa đứng dậy để mặc quần áo, nhưng có điều gì đó dường như thiếu. Một thứ khá quan trọng. Như #EMP tất cả đồ đạc của Ta#!! Phòng đã bị dọn sạch, không còn dấu vết quần áo hay túi xách.\n\n"
  stress_trait_coping_decisions.2002.desc_ending_rival:0 "Trên sàn Ta tìm thấy một mảnh giấy: #EMP "Hy vọng Ngài thích [ROOT.Char.Custom('AttractionWomanMan')] Ta gửi. Kẻ thù của Ngài, [rival.GetTitledFirstName]."#!"
  stress_trait_coping_decisions.2002.desc_ending:0 "Ôi, [ROOT.Char.Custom('AttractionWomanMan')] đáng ghét đó!"
  stress_trait_coping_decisions.2002.a:0 "Làm ơn… ai đó… mang cho Ta vài bộ đồ!"
  stress_trait_coping_decisions.2002.b:0 "[rival.GetFirstNameNoTooltip]! Đồ rắn độc!"

  stress_trait_coping_decisions.2004.t: "Đối Phó Căng Thẳng: Hậu Quả"
  stress_trait_coping_decisions.2004.desc: "Một buổi chiều bất ngờ Ta được một người phụ nữ nông dân ôm đứa trẻ, nước mắt chảy dài trên má [prostitute.GetHerHis].\n\n"[ROOT.Char.GetTitledFirstNameNoTooltip]!" cô ta trách, "Trò hề của ngươi không vô hậu quả! Đứa [baby.Custom('GirlBoy')] này là #EMP của ngươi#!!"\n\nTa gần như nghẹt thở – nhưng Ta có nhớ khuôn mặt [prostitute.GetHerHis], cơ thể [prostitute.GetHerHis], ánh sáng yếu ớt bởi nến trong một hang động tội lỗi…?"
  stress_trait_coping_decisions.2004.a: "Một [baby.Custom('GetDaughterSon')]! #EMP Của Ta#! [baby.Custom('GetDaughterSon')]!"
  stress_trait_coping_decisions.2004.b: "Người phụ nữ rối rắm tội nghiệp, dù sao Ta cũng sẽ chăm sóc đứa trẻ này..."
  stress_trait_coping_decisions.2004.c: "Ngài coi Ta là gì? Bảo vệ!"
  stress_trait_coping_decisions_2004_a_custom: "Mỗi [spouse|E], [lover|E], và [child|E] hợp pháp"

  stress_trait_coping_decisions.2501.t:0 "Đối Phó Căng Thẳng: Một Mình"
  stress_trait_coping_decisions.2501.desc: "Khi Ta từ từ bước vào [ROOT.Char.Custom('GetChamber')], cuối cùng Ta hoàn toàn một mình. Ta hít thật sâu. Và thở ra.\n\nCác Bạn Bè được ra lệnh không ai được quấy rầy Ta, bất kể chuyện gì xảy ra, và khi vai Ta thư giãn Ta biết rằng đây chính xác là điều Ta cần."
  stress_trait_coping_decisions.2501.a:0 "Ta thực sự thanh thản!"

  stress_trait_coping_decisions.3001.t:0 "Đối Phó Căng Thẳng: Thổ Lộ"
  stress_trait_coping_decisions.3001.desc_vassal:1 ""[vassal.GetTitledFirstName], người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))] thân yêu!" Ta cười [ROOT.Char.Custom('quirk_neg_adverb')].\n\n"Ngươi sinh ra đã là [vassal.Custom2('InsultAdjectiveArticle', ROOT.Char)] [vassal.Custom2('InsultNoun', ROOT.Char)], hay điều đó hình thành sau này?"" 
  stress_trait_coping_decisions.3001.desc_has_vassals:0 "Ngay khi tất cả các chư hầu ngồi xuống, và [vassal.GetTitledFirstName] bắt đầu nói, Ta cười [ROOT.Char.Custom('quirk_neg_adverb')].\n\n"[vassal.GetTitledFirstNameNoTooltip], xin lỗi đã ngắt lời, nhưng sao ngươi luôn là [vassal.Custom2('InsultAdjectiveArticle', ROOT.Char)] [vassal.Custom2('InsultNoun', ROOT.Char)]? Còn ngươi, [vassal_2.GetTitledFirstName], sinh ra đã là [vassal_2.Custom2('InsultNoun', ROOT.Char)], hay điều đó hình thành sau này?"" 
  stress_trait_coping_decisions.3001.desc_has_target_character: "Ngay khi mọi người ngồi xuống, và [target_character.GetTitledFirstName] bắt đầu nói, Ta cười [ROOT.Char.Custom('quirk_neg_adverb')].\n\n"[target_character.GetTitledFirstNameNoTooltip], xin lỗi đã ngắt lời, nhưng sao ngươi luôn là [target_character.Custom2('InsultAdjectiveArticle', ROOT.Char)] [target_character.Custom2('InsultNoun', ROOT.Char)]?"" 
  stress_trait_coping_decisions.3001.desc:0 "Ngay khi [ROOT.Char.Custom('GetCourt'|l)] tập trung Ta cười [ROOT.Char.Custom('quirk_neg_adverb')] – thời khắc đã đến.\n\n"Ngươi kia! Sinh ra đã là kẻ thô lỗ hay điều đó hình thành sau này?"" 
  stress_trait_coping_decisions.3001.a_target:0 "Biểu cảm trên mặt [target_character.GetHerHis]...!"
  stress_trait_coping_decisions.3001.a:0 "Và #EMP ngươi#!! Đừng nghĩ Ta không thấy!"

  stress_trait_coping_decisions.3501.t:0 "Đối Phó Căng Thẳng: Đau Thương Định Tĩnh"
  stress_trait_coping_decisions.3501.desc:0 "#EMP Bịch!#!\n\nCái roi rơi lên lưng Ta, Ta run rẩy trước sự rõ ràng nó mang lại. Chỉ có đau đớn trong cảm giác và trong tâm trí Ta.\n\n#EMP Bịch!#!\n\n#EMP Bịch!#!"
  stress_trait_coping_decisions.3501.a:0 "Hng– Đau ngọt ngào!"

  stress_trait_coping_decisions.4001.t:0 "Đối Phó Căng Thẳng: Giá Phải Trả"
  stress_trait_coping_decisions.4001.desc:0 "Ta đi qua chợ ở [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip], hứng khởi – vải vóc, trang sức, chỉ và đồ trang trí... Ta muốn tất cả!\n\nTa dừng lại ở một quầy do một [ROOT.Char.Custom('RandomWomanMan')] già phục vụ, rất thông cảm với tình huống của Ta và hứa giúp Ta lựa chọn."
  stress_trait_coping_decisions.4001.a:0 "Hai cái đó. Không, đợi. #EMP Ba cái!#!"

  stress_trait_coping_decisions.4501.t:0 "Đối Phó Căng Thẳng: Niềm Vui Cho Đi"
  stress_trait_coping_decisions.4501.desc:0 "Ta rời [ROOT.Char.GetFaith.HouseOfWorship] với túi nhẹ và lòng nhẹ nhàng hơn.\n\nChỉ nghĩ đến những người cần giúp đỡ mà số tiền này có thể trợ giúp cũng đủ làm Ta an tâm!"
  stress_trait_coping_decisions.4501.a:0 "[ROOT.Char.GetFaith.HighGodName] thật rộng lượng!"

  stress_trait_coping_decisions.5001.t:0 "Đối Phó Căng Thẳng: Lời Thú Nhận"
  stress_trait_coping_decisions.5001.desc_opening:0 ""Ta đã triệu tập [ROOT.Char.Custom('GetCourt')|l] hôm nay vì Ta có điều muốn thú nhận."
  stress_trait_coping_decisions.5001.desc_secret:0 "Ta… Ta [secret.Custom('SecretDescriptionFirstPerson')].""
  stress_trait_coping_decisions.5001.desc_sin:0 "Ta… Ta không kiềm chế phần [ROOT.Char.Custom('SinfulTrait')|l] của mình như lẽ ra phải làm.""
  stress_trait_coping_decisions.5001.desc:0 ""Ta… gần đây bị dày vò bởi những suy nghĩ tội lỗi. Hãy nghe Ta…"" 
  stress_trait_coping_decisions.5001.desc_ending:0 "\n\nSự xôn xao của đám đông không làm giảm nhẹ sự an tâm của Ta."
  stress_trait_coping_decisions.5001.a:0 "Ta thấy nhẹ nhõm hẳn!"

  stress_trait_coping_decisions.5002.desc:0 "Ta… Ta [secret.Custom('SecretDescriptionFirstPerson')]. Không, đợi… Đó không phải Ta– là [secret_character.GetTitledFirstName]!"\n\nTiếng hét giận dữ từ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secret_character'))] không làm giảm nhẹ sự an tâm của Ta."
  stress_trait_coping_decisions.5002.a:0 "Dù sao… Ta thấy nhẹ nhõm hẳn!"

  stress_trait_coping_decisions.5501.t:0 "Đối Phó Căng Thẳng: Ăn Đi!"
  stress_trait_coping_decisions.5501.desc:0 "Khi một đĩa [ROOT.Char.Custom('FavoriteTreat')] khác được đặt trước Ta, Ta cảm thấy thư giãn.\n\nKhông gì làm tâm trí dễ chịu như một bữa ăn ngon!"
  stress_trait_coping_decisions.5501.a:0 "Mang thêm [ROOT.Char.Custom('FavoriteTreat')] cho Ta!"

  stress_trait_coping_decisions.5502.t:0 "Đối Phó Căng Thẳng: Bữa Tiệc Bất Ngờ"
  stress_trait_coping_decisions.5502.desc:0 "Trong lúc chờ ngự thiện phòng chuẩn bị bữa ăn, ta tình cờ bắt gặp một tên [ROOT.Char.Custom('lowly_servant_type')] ở ngoài hành lang.\n\n[ROOT.Char.GetSheHe|U] cố gắng cáo lui để rời đi [ROOT.Char.GetHerselfHimself], nhưng chúng ta đâu thể để chuyện đó xảy ra vào lúc này, phải không? Ta vừa tình cờ tìm thấy một bữa ăn tuyệt vời nhất có thể tưởng tượng ra!\n\nTa dẫn [ROOT.Char.GetHerHim] xuống dưới hầm tối, nơi chẳng ai có thể nghe thấy những tiếng la hét. Và rồi ta bắt đầu #EMP đại tiệc#!!"
  stress_trait_coping_decisions.5502.desc_landless: "Lang thang quanh khu lều trại trong khi chờ bữa ăn được chuẩn bị, ta đụng phải một đứa trẻ từ một trong những khu định cư gần đó.\n\n[ROOT.Char.GetSheHe|U] cố tìm cớ để rời đi [ROOT.Char.GetHerselfHimself], nhưng chúng ta đâu thể để chuyện đó xảy ra vào lúc này, phải không? Ta vừa tình cờ tìm thấy một bữa ăn tuyệt vời nhất có thể tưởng tượng ra!\n\nTa dẫn [ROOT.Char.GetHerHim] ra rìa vùng hoang vu, nơi một vài tiếng hét cũng chẳng thành vấn đề. Và rồi ta bắt đầu #EMP đại tiệc#!!"
  stress_trait_coping_decisions.5502.a:0 "Và Ta còn có tráng miệng đợi trên lầu!"
  stress_trait_coping_decisions.5502.a_landless:0 "Giờ #EMP đây#! thật nhẹ nhõm."

  stress_trait_coping_decisions.6001.t:0 "Đối Phó Căng Thẳng: Bỏ Ăn"
  stress_trait_coping_decisions.6001.desc:0 ""Báo với đầu bếp rằng trong tương lai gần, Ta sẽ không tham gia bữa ăn."\n\nNgay khi lời nói rời miệng, Ta cảm thấy nhẹ nhõm – không còn phiền nhiễu, không còn phải nuốt thức ăn mà Ta khó chịu! Giờ Ta có thể tập trung vào điều quan trọng."
  stress_trait_coping_decisions.6001.a:0 "Được rồi, điều này ổn."

  stress_trait_coping_decisions.6501.t:0 "Đối Phó Căng Thẳng: Mực Chảy"
  stress_trait_coping_decisions.6501.desc:0 "Ta cầm bút và mở sổ nhật ký.\n\nMỗi câu viết trên giấy khiến vai Ta thư giãn – sự rõ ràng mà quá trình này mang lại thật tuyệt vời!"
  stress_trait_coping_decisions.6501.a:0 "Ta chấm mực thêm lần nữa…"

  stress_trait_coping_decisions.7001.t:0 "Đối Phó Căng Thẳng: Thổ Lộ"
  stress_trait_coping_decisions.7001.desc:1 "Sau một cuộc trò chuyện dài với [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('confidant'))] [confidant.GetTitledFirstName], Ta cảm thấy suy nghĩ bình tĩnh hơn."
  stress_trait_coping_decisions.7001.desc_ending:2 "\n\nTuy nhiên, khi Ta trở lại [ROOT.Char.Custom('GetCourt')|l], Ta thấy ghen tỵ trên khuôn mặt [ROOT.Char.Custom('GetCourtierPlural')|l]… Rốt cuộc, ai mà không muốn có lòng tin của [confidant.GetFirstNamePossessive]?"
  stress_trait_coping_decisions.7001.a:0 "Dù sao, tâm trí Ta vẫn bình thản."

  stress_trait_coping_decisions.7002.desc:0 "Sau một cuộc trò chuyện dài và mệt mỏi, Ta cảm thấy suy nghĩ bình tĩnh hơn."

  stress_trait_coping_decisions.activity:0 "Đối Phó Căng Thẳng:"
  stress_trait_coping_decisions.7501.t:1 "$stress_trait_coping_decisions.activity$ Đổ Mồ Hôi"
  stress_trait_coping_decisions.7501.desc:0 "Khi Ta hoàn thành vòng chạy quanh [ROOT.Char.Custom('ResidenceBuilding')|l], Ta đã cảm thấy mọi lo lắng theo mồ hôi trôi đi.\n\nNgười ta nói Ta chạy trốn vấn đề, nhưng Ta nói Ta chạy tới giải pháp!"
  stress_trait_coping_decisions.7501.a:0 "Thêm một vòng nữa!"

  stress_trait_coping_decisions.7502.t:0 "$stress_trait_coping_decisions.activity$ Nặng Hơn Mới Khỏe"
  stress_trait_coping_decisions.7502.desc:0 "'Chưa đủ!' Ta nghĩ khi đặt xuống [ROOT.Char.Custom('signature_weapon')]. Ta luyện tập không ngừng nhưng chưa thấy mệt — Ta cần thử thách nặng hơn!\n\nVâng… gì đó to hơn… hoặc nặng hơn!\n\nChắc chắn sẽ làm Ta mệt!"
  stress_trait_coping_decisions.7502.a:0 "[random_artifact.GetNameNoTooltip] sẽ tạm được!"
  stress_trait_coping_decisions.7502.b:0 "Ta sẽ đặt làm một [ROOT.Char.Custom('signature_weapon')] luyện tập cực nặng."
  stress_trait_coping_decisions.7502.c:0 "[lifted_child.GetFirstNameNoTooltip], lại đây!"
  stress_trait_coping_decisions.7502.c.flavor:0 "Lên nào!"
  stress_trait_coping_decisions.7502.d:0 "Hiện tại chưa cần cải thiện."
  stress_trait_coping_decisions.7502.success:0 "Thử thách thêm tiếp thêm sinh lực cho Ngài"
  stress_trait_coping_decisions.7502.failure:0 "Ngài đánh giá quá cao sức mạnh của mình"

  stress_trait_coping_decisions.7503.t:0 "$stress_trait_coping_decisions.activity$ Cạnh Tranh Thân Thiện"
  stress_trait_coping_decisions.7503.desc:0 "Ta đang ở giữa buổi huấn luyện thì phát hiện ra [random_knight.GetTitledFirstName], cũng đang tập luyện. Ta nhìn [random_knight.GetHerHim] từ đầu đến chân — không chỉ [random_knight.GetSheHe] trông có vẻ tráng kiện, mà thể chất còn đạt mức đỉnh cao. Ta rất muốn thử đo lường bản lĩnh của mình với [random_knight.GetHerHis], nhưng theo phương thức nào đây?\n\nTa có nên tính đến nhiều yếu tố nếu muốn giành chiến thắng không? Sức mạnh cơ bắp thuần túy, hay một sự kết hợp bao gồm cả sức bền lẫn trí tuệ?"
  stress_trait_coping_decisions.7503.a:0 "Gợi ý hai người đấu vật."
  stress_trait_coping_decisions.7503.a.tt:0 "Ngài nghĩ sức mạnh thuần túy sẽ chiến thắng"
  stress_trait_coping_decisions.7503.b:0 "Thách [random_knight.GetHerHim] một trận đấu đối kháng."
  stress_trait_coping_decisions.7503.b.tt:0 "Ngài nghĩ sự kết hợp giữa sức mạnh và kỹ năng võ thuật sẽ thắng"
  stress_trait_coping_decisions.7503.c:0 ""Thử một cuộc chạy đua?"""
  stress_trait_coping_decisions.7503.c.tt:0 "Ngài nghĩ sự kết hợp sức mạnh và sức khỏe sẽ giúp Ngài bền bỉ hơn đối thủ"
  stress_trait_coping_decisions.7503.d:0 "Tập trung hoàn thành chế độ luyện tập bình thường."
  stress_trait_coping_decisions.7503.success:0 "Ngài giành chiến thắng!"
  stress_trait_coping_decisions.7503.failure:0 "[random_knight.GetTitledFirstNameNoTooltip] thắng thử thách"

  stress_trait_coping_decisions.7504.desc:0 "Đôi khi khó tìm động lực khi tập một mình.\n\nTa có thể tìm một đối tác, người sẽ không chỉ thúc đẩy Ta trong những ngày tồi tệ, mà còn là người Ta so sánh tiến trình của mình.\n\nLoại Ngài đồng hành nào hợp với Ta nhất? Người để ngưỡng mộ, người khiến Ta cảnh giác, hay người Ta biết không nên trở thành?"
  stress_trait_coping_decisions.7504.a:0 "Ta nên tập với người mà Ta ngưỡng mộ sức mạnh. Như [ideal_character.GetFirstNameNoTooltip]!"
  stress_trait_coping_decisions.7504.b:0 "[similar_character.GetFirstNameNoTooltip] có thể bắt chước chế độ tập của Ta."
  stress_trait_coping_decisions.7504.c:0 "Xem [not_ideal_character.GetFirstNameNoTooltip] vật lộn sẽ là động lực."
  stress_trait_coping_decisions.7504.d:0 "Không cần Ngài đồng hành khi luyện tập."

