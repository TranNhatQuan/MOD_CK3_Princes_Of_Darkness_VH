l_english:
 # Level 1 Stress Events
  stress_threshold_prison.1001.t:0 "Khủng Hoảng Tâm Lý: Rắc Rối Trong Tù"
  stress_threshold_prison.1001.desc:0 "Bị giam giữ, khóa chặt xa tất cả những gì từng là sức sống và thú vị trong đời..."
  stress_threshold_prison.1001.desc.normal:0 "thật khó để không rơi vào tuyệt vọng."
  stress_threshold_prison.1001.desc.cynical:0 "\n\n[ROOT.Char.GetFaith.HighGodName] sao lại để nơi tuyệt vọng này tồn tại? Làm sao bất kỳ vị thần nào có thể cho phép?"
  stress_threshold_prison.1001.desc.depressed:0 "Điều này từng làm Ta khó chịu, nhưng lạ thay, giờ thì không nữa."
  stress_threshold_prison.1001.inappetetic.gain:0 "Ta không thể nuốt nổi món bã này nữa."
  stress_threshold_prison.1001.inappetetic.effect:0 "Đĩa thức ăn vẫn nguyên vẹn trên bàn."
  stress_threshold_prison.1001.cynical.gain:0 "[ROOT.Char.GetFaith.HighGodName] đã bỏ rơi Ta..."
  stress_threshold_prison.1001.cynical.effect:0 "Điều này chỉ chứng minh rằng không có [ROOT.Char.GetFaith.HighGodName] nào tồn tại..."
  stress_threshold_prison.1001.endure:0 "Sao Ta vẫn chưa được thả!? "
  stress_threshold_prison.1001.depressed.gain:0 "Cuộc sống thế này liệu có đáng sống?"
  stress_threshold_prison.1001.depressed.effect:0 "Không còn đau đớn nữa. Ta đã chết bên trong."
  stress_threshold_prison.1011.t:2 "Khủng Hoảng Tâm Lý: Đói Khát"
  stress_threshold_prison.1011.desc:0 "Đã nhiều ngày trôi qua kể từ khi ta có thể nuốt trôi bất cứ thứ gì. Tâm trí bất an đầy lo âu của ta từ chối tiếp thêm sức mạnh cho cơ thể để ăn bát cháo loãng khô khốc mà bọn lính gác mang đến.\n\nTa cảm thấy mình yếu đi từng ngày, nhưng một [ROOT.Char.GetWomanMan] có thể làm gì để chống lại chính cơ thể của [ROOT.Char.GetHerHis] đây?"
  stress_threshold_prison.1011.a:0 "Chết đói còn hơn ăn món bã này."
  stress_threshold_prison.1011.b:1 "Có #EMP những nguồn thực phẩm# khác dưới đây..."
  stress_threshold_prison.1011.c:0 "[ROOT.Char.GetSheHe|U] có thể chiến đấu từng muỗng một!"

  stress_threshold_prison.1012.t:1 "Khủng Hoảng Tâm Lý: Giờ Ăn"
  stress_threshold_prison.1012.desc:0 "Chúng nghĩ rằng Ta không còn gì để ăn, rằng chúng đang đói Ta đến chết, phá hoại Ta.\n\nChúng không biết rằng Ta được ăn no hơn bao giờ hết...\n\nĐây là một đại tiệc, đầy thức ăn ngon và tiếng cười vui sướng."
  stress_threshold_prison.1012.a:0 "Ấm áp, ngon ngọt và tràn đầy sức sống."

  stress_threshold_prison.1021.t:1 "Khủng Hoảng Tâm Lý: Trò Chơi Tàn Nhẫn"
  stress_threshold_prison.1021.desc:0 "Không có gì vui trong [bg_override_char.Custom('GetDungeon')|l] bẩn thỉu này. Một vũng nước ôi thiu, một xô ghê tởm, một đống sỏi nhỏ—\n\nHình bóng tối của [fellow_prisoner.GetTitledFirstName] ở góc đối diện bỗng trở thành mục tiêu hoàn hảo."
  stress_threshold_prison.1021.a:0 "Mười điểm nếu Ta trúng đầu [fellow_prisoner.GetHerHis]!"
  stress_threshold_prison.1021.b:0 "Đau đớn của người khác không làm gì Ta. Nhưng của Ta..."
  stress_threshold_prison.1021.c:0 "Làm sao Ta lại nghĩ những ý nghĩ đen tối như thế này!?"

  stress_threshold_prison.1031.t:0 "Khủng Hoảng Tâm Lý: Khát Khao Quyền Lực"
  stress_threshold_prison.1031.desc:0 "Bị nhốt ở đây, Ta được cho là yếu đuối và cam chịu. Ha!\n\nTrong bóng tối, Ta tập trung sức mạnh và tưởng tượng xé xác kẻ thù từng mảnh! Ngày này qua ngày khác họ được sinh ra và mỗi ngày Ta hủy diệt họ như lũ cặn bã!\n\nĐặc biệt là cai ngục khốn nạn, [jailer.GetTitledFirstName]... [jailer.GetSheHe] sẽ chịu đau nhiều nhất!"
  stress_threshold_prison.1031.a:0 "Khi Ta ra ngoài... chúng sẽ #EMP trả giá#!!"
  stress_threshold_prison.1031.b:0 "Tại sao phải chờ? Trong đầu Ta, chúng đã nằm dưới quyền Ta..."
  stress_threshold_prison.1031.c:0 "Không... điều này sai. Ta tốt hơn thế."

  stress_threshold_prison.1041.t:0 "Khủng Hoảng Tâm Lý: Nhu Cầu Bị Quên Lãng"
  stress_threshold_prison.1041.desc:0 "Thói quen của Ta luôn lặp đi lặp lại khi sáng thành trưa, trưa thành tối...\n\nMùi thức ăn thiu nồng nặc trong không khí. Khi nào đống đĩa này cao như vậy? Bao nhiêu bữa Ta đã bỏ lỡ? Ngay cả việc duy trì sự bình thường cũng ngày càng khó..."
  stress_threshold_prison.1041.depressed:0 "Càng khó hơn để nhớ tại sao Ta còn phải cố gắng."
  stress_threshold_prison.1041.inappetetic:0 "Thức ăn có ý nghĩa gì khi không có tự do?"
  stress_threshold_prison.1041.flagellant:0 "Đau đớn sẽ cho Ta một điểm để tập trung."
  stress_threshold_prison.1041.journaller.gain:0 "Có lẽ viết lách sẽ phá vỡ sự đơn điệu..."
  stress_threshold_prison.1041.journaller.effect:0 "Ta mừng vì ít ra còn có nhật ký của mình."
  stress_threshold_prison.1041.athletic:0 "Ta có thể bị giam, nhưng vẫn có thể tập thể dục..."
  stress_threshold_prison.1041.optout:0 "Ta sẽ ra ngoài sớm thôi... phải không?"

 # Level 2 Stress Events
  stress_threshold_prison.2001.t:1 "Khủng Hoảng Tâm Lý: Vùng Vẫy"
  stress_threshold_prison.2001.desc:0 "Sao chúng không #EMP thả Ta ra#?! Chắc chắn Ta đã ở trong cái lạnh, #EMP tù túng# này, [bg_override_char.Custom('GetDungeon')|l] đủ lâu rồi chứ?\n\nTa ôm đôi tay đầy máu áp sát ngực, ngồi gục dựa vào song sắt. Nếu Ta gãi đủ lâu và đủ mạnh, dây trói phải tuột chứ?"
  stress_threshold_prison.2001.a:0 "Ta phải tiếp tục thử!"
  stress_threshold_prison.2001.b:0 "Ah, bỏ đi. Cố gắng làm gì... chứ?"

  stress_threshold_prison.2011.t:1 "Khủng Hoảng Tâm Lý: Ta và [ROOT.Char.Custom('prison_pet')|U]"
  stress_threshold_prison.2011.desc_rat:0 "Nhiều ngày qua, Ta được một con chuột ghé thăm. Nó nhìn Ta với sự thương cảm và tin tưởng, điều Ta đã lâu không trải qua."
  stress_threshold_prison.2011.desc_stone:0 "Một sự hiện diện vững chắc bên cạnh Ta, một điểm tựa trong đời đảo lộn. Viên đá tin cậy là Ngài đồng hành và  Bạn củaTa, luôn ở bên khi Ta cần."
  stress_threshold_prison.2011.desc_spoon:0 "Một trong số ít những điểm ổn định trong đời ở [bg_override_char.Custom('GetDungeon')|l], một nguồn an ủi và bầu Ngài... Muỗng của Ta luôn ở bên, không bao giờ phán xét Ta — kể cả những ngày tồi tệ nhất."
  stress_threshold_prison.2011.desc_cockroach:0 "Và nó lại đây, con gián, ngồi trong góc tối. Nó là Ngài đồng hành, Ngài tin cậy, #EMP con trai# của Ta!\n\nNó quan sát Ta, bầu Ngài cùng Ta trong nơi khốn nạn này."
  stress_threshold_prison.2011.desc_end:0 "\n\nChưa bao giờ Ta cảm thấy kết nối với sinh vật khác, sự tận tâm và đồng cảm như vậy."
  stress_threshold_prison.2011.a:0 "Lại đây, [ROOT.Char.Custom('prison_pet')], để ta ôm ngươi."

  stress_threshold_prison.2021.t:1 "Khủng Hoảng Tâm Lý: Góc Tối Nhất"
  stress_threshold_prison.2021.desc:0 "Lính gác nói Ta đã ở một mình nhiều ngày, nhưng Ta biết rõ hơn. Ta có thể #EMP cảm nhận#! chúng đang theo dõi Ta, đánh giá nỗi sợ và điểm yếu...\n\nMỗi âm thanh nhắc Ta về sự hiện diện của chúng, mỗi bóng tối là mối đe dọa."
  stress_threshold_prison.2021.a:0 "Ta phải luôn cảnh giác!"
  stress_threshold_prison.2021.b:0 "Ta phải tìm chỗ trốn... bất cứ đâu!"
  stress_threshold_prison.2021.c:0 "Có lẽ Ta có thể nói chuyện với chúng?"

 # Level 3 Stress Events
  stress_threshold_prison.3001.t:1 "Khủng Hoảng Tâm Lý: Người Ngài Cần Thiết"
  stress_threshold_prison.3001.desc:0 "Điều họ không bao giờ nói về [bg_override_char.Custom('GetDungeonPlural')|l] là chúng #EMP chán chết#! May mắn thay [fictional_friend.Custom('DuchessDuke')|U] [fictional_friend.Custom('RandomExampleName')] ở đây bầu Ngài.\n\n[fictional_friend.Custom('DuchessDuke')] vui đùa không ai bì được, luôn nâng cao tinh thần Ta. Và [fictional_friend.GetSheHe] cũng rất khôn ngoan.\n\nGì cơ, [fictional_friend.Custom('DuchessDuke')|U]? #EMP Ha!# Tốt lắm!"
  stress_threshold_prison.3001.a:0 "Lại đây, ngươi hư đốn kia!"

  stress_threshold_prison.3011.t:1 "Khủng Hoảng Tâm Lý: Gia Đình Thực Sự"
  stress_threshold_prison.3011.desc:0 "Ta nén một giọt nước mắt — Ta đã lạc lõng #EMP quá mức#! — nhưng giờ mọi chuyện tốt hơn! Gia đình Ta ở đây, bảo vệ Ta.\n\nMẹ và cha ôm Ta chặt."
  stress_threshold_prison.3011.sibling: "Anh/chị [sibling.Custom('SisterBrother')], [sibling.GetFirstName], chăm sóc Ta."
  stress_threshold_prison.3011.sibling_multiple: "Anh/chị [sibling.Custom('SisterBrother')], [sibling.GetFirstName] — Tất cả anh chị em — chăm sóc Ta."
  stress_threshold_prison.3011.child: "Con [child.GetDaughterSon], [child.GetFirstName], nắm tay Ta, giữ ánh sáng trong mắt Ta."
  stress_threshold_prison.3011.child_multiple: "Các con — tất cả nhiều đứa — tụ họp quanh, giữ ánh sáng trong mắt Ta."
  stress_threshold_prison.3011.fallback: "Chúng đều tụ họp quanh Ta, giữ ánh sáng trong mắt Ta."
  stress_threshold_prison.3011.a:0 "Sao Ta lại nghĩ mình bị bỏ rơi?"

  stress_threshold_prison.3999.t:1 "Khủng Hoảng Tâm Lý: Tự Do"
  stress_threshold_prison.3999.desc:0 "Ta không thể chịu đựng nữa. Tâm trí Ta rõ ràng hơn nhiều so với vài tuần qua, và Ta biết mình đã bị gãy theo nhiều cách.\n\nCơ thể Ta toàn đau đớn, thở cũng khó. [bg_override_char.Custom('GetDungeon')|l] xung quanh không còn áp bức nữa, mà trở nên an ủi. Đón nhận.\n\nTa biết trong lòng rằng đây là hơi thở cuối cùng của mình."
  stress_threshold_prison.3999.a:0 "[ROOT.Char.GetFaith.PositiveAfterLife|U] ôm lấy Ta."
