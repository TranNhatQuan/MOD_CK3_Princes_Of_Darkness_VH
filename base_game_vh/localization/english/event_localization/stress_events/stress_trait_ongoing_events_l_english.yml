  stress_trait_ongoing.0501.t:0 "Một Buổi Tối Thư Giãn"
  stress_trait_ongoing.0501.desc:0 "Công việc cai trị thật căng thẳng gần đây. Nếu không là việc này, thì là việc kia, nếu không là việc kia, thì lại là việc này. Một đoàn người vô tận – nông dân, giáo sĩ, và đủ loại rắc rối – tất cả đều mong #EMP Ta#! giải quyết mọi chuyện vụn vặt của họ.\n\nTa xứng đáng có một ngày cho riêng mình, không có người cầu hôn hay kẻ thỉnh nguyện, không có nhà ngoại giao hay quan tòa. Chỉ Ta và một đĩa lớn bánh hashish..."
  stress_trait_ongoing.0501.adventurer: "Công việc lãnh đạo một trại thật căng thẳng gần đây. Nếu không là việc này, thì là việc kia, nếu không là việc kia, thì lại là việc này. Một danh sách vô tận những nhiệm vụ nhỏ nhặt, vấn đề, và câu hỏi, tất cả đều chờ #EMP giải pháp của Ta#!\n\nTa xứng đáng có một ngày cho riêng mình, không có lời khuyên hay bài diễn thuyết, không có luyện tập hay họp hành. Chỉ Ta và một đĩa lớn bánh hashish..."
  stress_trait_ongoing.0501.administrative: "Công việc lãnh đạo nhà [ROOT.Char.GetDynastyHouse.GetBaseNameNoTooltip] thật căng thẳng gần đây. Nếu không là việc này, thì là việc kia, nếu không là việc kia, thì lại là việc này. Một danh sách vô tận những nhiệm vụ nhỏ nhặt, vấn đề, và câu hỏi, tất cả đều chờ #EMP giải pháp của Ta#!\n\nTa xứng đáng có một ngày cho riêng mình, không có âm mưu hay khoe mẽ, không có tâng bốc hay bịa đặt. Chỉ Ta và một đĩa lớn bánh hashish..."
  stress_trait_ongoing.0501.a:0 "Quay lại làm việc thôi!"
  stress_trait_ongoing.0501.b:0 "Chỉ là một ngày nghỉ thôi mà..."
  overworking_diplomacy_modifier:0 "Quá Tải Ngoại Giao"
  overworking_diplomacy_modifier_desc:0 "$overworking_stewardship_modifier_desc$"
  overworking_martial_modifier:0 "Quá Tải Quân Sự"
  overworking_martial_modifier_desc:0 "$overworking_stewardship_modifier_desc$"
  overworking_stewardship_modifier:0 "Quá Tải Quản Lý"
  overworking_stewardship_modifier_desc:0 "Nhân vật này đặt công việc lên trước sức khỏe tinh thần của mình."
  overworking_intrigue_modifier:0 "Quá Tải Mưu Mẹo"
  overworking_intrigue_modifier_desc:0 "$overworking_stewardship_modifier_desc$"
  overworking_learning_modifier:0 "Quá Tải Học Thuật"
  overworking_learning_modifier_desc:0 "$overworking_stewardship_modifier_desc$"
  stress_trait_ongoing.0506.t:0 "Sự Nhẹ Nhõm Ngọt Ngào"
  stress_trait_ongoing.0506.desc_leper:0 "Căn bệnh hao mòn này đang gặm nhấm cơ thể Ta từ từ, từng ngày lột da thịt Ta. Ta có thể là [ROOT.GetCharacter.GetTitleAsNameNoTooltip], nhưng đôi khi Ta sợ rằng [ROOT.Char.Custom(GetCourtierPlural)] nhìn Ta và chỉ thấy một kẻ phong cùi."
  stress_trait_ongoing.0506.desc_gout_ridden:0 "Cơn đau nhức này ở chi khiến Ta ê ẩm, những giờ phút đau nhức dần dần tàn phá Ta ngày này qua ngày khác. Đôi khi Ta tự hỏi nếu nó ổn định, thay vì lên xuống liên tục, có lẽ sẽ tốt hơn hay tồi tệ hơn."
  stress_trait_ongoing.0506.desc_cancer:0 "Những tuần trôi qua, Ta chỉ chờ đợi cơn đau này hay cơn đau kia. Có ngày tạm chịu đựng được, nhưng những ngày khác Ta khó có thể di chuyển hay nói, nhịp thở ngày càng chậm. Ta cảm nhận thời gian còn lại trên Trái Đất đang trôi đi, bị căn bệnh ung thư cướp đi."
  stress_trait_ongoing.0506.desc_disfigured:1 "Những vết thương có thể đã lành bề ngoài, nhưng bên trong, nỗi đau vì biến dạng vẫn cháy âm ỉ. Ta dùng một ngón tay lần theo vết sẹo cũ, ký ức về khổ đau ùa về."
  stress_trait_ongoing.0506.desc_maimed:0 "Ta ho, khạc ra cục máu nhầy. Ta cũng không biết đây có phải vấn đề mới không, với nỗi đau liên tục hành hạ cơ thể tàn tật, hư hại của Ta."
  stress_trait_ongoing.0506.desc_one_eyed:0 "Hốc mắt trống không nơi từng có con mắt vẫn đau thỉnh thoảng. Đau nhói chủ yếu. Ảo giác thị giác lạ và những hình dạng bất thường xuất hiện vào những ngày tồi tệ."
  stress_trait_ongoing.0506.desc_one_legged:0 "Ta đặt ngón tay lên phần chân bị cụt. Đôi khi, nhất là khi đi trên các lộ trình quen thuộc, Ta vẫn cảm nhận được. Nỗi đau từ việc bị đoạn chi ùa về, thật sống động, tràn ngập tâm trí."
  stress_trait_ongoing.0506.desc_wounded:0 "Ta nhăn mặt khi chạm vào vết cắt. Ngón tay trở về với bụi mảng máu đỏ-đen, một cơn đau nhói nhắc Ta rằng vết thương vẫn còn mới và đau."
  stress_trait_ongoing.0506.desc_fallback:0 "Nỗi đau này giày vò cơ thể Ta, một thử thách quá sức với bộ não mệt mỏi. Ta cần chút nhẹ nhõm, chỉ một cách để chịu đựng."
  stress_trait_ongoing.0506.desc:0 "\n\nBánh hashish sẽ làm dịu cơn đau, tạm thời. Câu hỏi duy nhất là nên dùng một mình hay có Ngài đồng hành sẽ giúp vui vẻ hơn. [medication_friend.GetTitledFirstName] đã hỏi Ta có muốn có Ngài đồng hành tối nay không..."
  stress_trait_ongoing.0506.a:0 "Ta chỉ cần một chút thời gian một mình."
  hashish_alone_modifier:0 "Dùng Thuốc Một Mình"
  hashish_alone_modifier_desc:0 "Nhân vật này đang quản lý cơn đau bằng bánh hashish vào buổi tối."
  stress_trait_ongoing.0506.b:0 "Có lẽ [medication_friend.GetFirstNameNoTooltip] sẽ muốn chia sẻ?"
  hashish_with_friend_modifier:0 "Dùng Thuốc Cùng Ngài"
  hashish_with_friend_modifier_desc:0 "Nhân vật này chia sẻ buổi tối với một người Bạn Tốt và bánh hashish tuyệt hảo."
  stress_trait_ongoing.0511.t:0 "Vẫn Như Thế"
  stress_trait_ongoing.0511.desc:0 "Ta đang thưởng thức buổi tối mát mẻ, ngồi nhấm nháp một chồng nhỏ bánh ngọt phủ hashish, thì đột nhiên cảm nhận được hơi thở nặng nề, văng nước bọt của [crusty_old_person.GetTitledFirstName] giận dữ trên má.\n\n'Bỏ cây nguyền rủa đó xuống đi, [ROOT.GetCharacter.GetFirstNameNoTooltip], và đừng làm mờ tâm trí! [crusty_old_person.GetFaith.HighGodName] không đặt con trên Trái Đất để con phí thời gian trong cơn mê!'"
  stress_trait_ongoing.0511.a:0 "Đúng rồi! Ta phải dừng ngay lập tức."
  stress_trait_ongoing.0511.a_flavour:0 "Ngài ném đi đĩa bánh hashish"
  stress_trait_ongoing.0511.b:0 "<hít một hơi sâu> Đồng ý, #EMP lão nhân#!"
  stress_trait_ongoing.0511.b_flavour:0 "Ăn. Từng. Chiếc. Bánh."
  stress_trait_ongoing_0516.t:0 "Một Mi— Lang Thang"
  stress_trait_ongoing_0516.desc:0 "\"—và đó là lý do tại sao cuộc họp này quan trọng.\" \n\nHả? À đúng rồi, cuộc họp với [important_guest.GetTitledFirstName]. Về... Một chuyện gì đó. Chúng ta #EMP đang nói về#! cái gì nhỉ? [important_guest.GetSheHe|U] trông rất nghiêm túc về nó, dù là gì đi nữa.\n\nTa vươn tay, lấy một chiếc bánh phủ hashish khác và bắt đầu nhấm nháp một cách suy tư. [important_guest.GetFirstNameNoTooltip] nhướng mày trước khoảng dừng trống rỗng của Ta, và Ta nhận ra rằng có lẽ mình đã ăn hơi quá nhiều #EMP bánh#!"
  stress_trait_ongoing.0516.a:0 "Vâng, tất nhiên, một cuộc họp quan trọng..."
  stress_trait_ongoing.0516.a.tt_success:0 "[important_guest.GetFirstNameNoTooltip] ấn tượng với phản ứng điềm tĩnh, ổn định của Ngài"
  stress_trait_ongoing.0516.a.tt_fail:0 "Bị xúc phạm bởi sự say rượu rõ rệt của Ngài"
  stress_trait_ongoing.0516.b:0 "Xin lỗi, Ta cảm thấy không khỏe."
  stress_trait_ongoing.0516.b_flavour:0 "Ngài rút lui khỏi cuộc họp sớm và đi nghỉ"
  stress_trait_ongoing.0516.c:0 "Thư giãn đi, [important_guest.GetFirstNameNoTooltip]. Hãy dùng một ít hashish!"
  stress_trait_ongoing.0516.c_flavour:0 "Ngài sai khiến Bạn Bè mang thêm bánh để chia sẻ"

