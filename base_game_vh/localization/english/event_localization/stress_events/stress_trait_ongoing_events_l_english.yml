  stress_trait_ongoing.4501.t:0 "Không Một Miếng Ăn"
  stress_trait_ongoing.4501.desc:0 "Vài tuần vừa qua thật căng thẳng, và tất cả những gì Ta muốn chỉ là một món [ROOT.Char.Custom('FavoriteTreat')] ngon lành để ăn… có lẽ là vài cái…\n\nChết tiệt, có khi cả một bàn đầy chúng nữa chứ!\n\nThật tiếc, đầu bếp của Ta thông báo rằng ông không còn gì, cũng không có nguyên liệu để làm thêm."
  stress_trait_ongoing.4501.a:0 "Lấy những đồng tiền này đi. Bằng mọi giá, đưa đồ ăn cho ta!"
  stress_trait_ongoing.4501.b:0 "Có #EMP gì#! trong tay có thể thỏa mãn cơn thèm của ta không?"
  stress_trait_ongoing.4501.b.success:0 "Ngài khám phá ra một món tráng miệng ưa thích mới"
  stress_trait_ongoing.4501.b.cannibal:0 "Ngài bắt đầu thích thịt người"
  stress_trait_ongoing.4501.b.failure:0 "Cơn thèm của Ngài vẫn chưa được thỏa mãn"
  stress_trait_ongoing.4501.c:0 "Ugh… Có lẽ Ta phải chịu đói vậy."

  stress_trait_ongoing.4502.t:0 "Cơn Đói"
  stress_trait_ongoing.4502.desc:0 "Vài tuần vừa qua thật căng thẳng, và tất cả những gì Ta muốn chỉ là một miếng thịt ngon, mọng nước. Một miếng mềm như thăn, hay có khi là sườn?\n\nMiệng Ta nhễu nước khi nghĩ tới, và Ta biết mình không thể kìm cơn đói lần này."
  stress_trait_ongoing.4502.a:0 "Chẳng ai để ý đến [prisoner.GetTitledFirstNameNoTooltip] đâu."
  stress_trait_ongoing.4502.b:0 "Dù sao thì [courtier.GetTitledFirstNameNoTooltip] cũng tự chuốc lấy kết cục này cho [courtier.GetHerHim] mà thôi..."
  stress_trait_ongoing.4502.c:0 "Đến lúc đi đến [hapless_village.GetNameNoTier] rồi!"

  stress_trait_ongoing.5001.t:0 "Bữa Tiệc Ý Định"
  stress_trait_ongoing.5001.desc:0 "\"Đi theo ta, [ROOT.Char.GetTitledFirstName]; ta có một bất ngờ cho ngươi!\" [giver.Custom2('MyCharacterIntroduction', ROOT.Char)] hớn hở nói. \"Ta thấy ngươi gần đây không ăn uống đầy đủ, nên ta đã dành cả tuần để tìm những món ngon hiếm có!\"\n\nTheo [giver.GetHerHim], Ta thấy một bàn đầy đủ các món ăn tinh hoa. [ROOT.Char.Custom('GetExpensiveMeal')|U] và [ROOT.Char.Custom('GetExpensiveMealAlt')]… [ROOT.Char.Custom('GetExpensiveDessert')]… chỉ mùi thôi cũng đủ làm dạ dày Ta quay cuồng.\n\n\"Thế nào? Ăn đi, [ROOT.Char.Custom('FormOfAddressForLiege')]!\""
  stress_trait_ongoing.5001.a:0 "\"Thật… ngon. Mmm. Ngon tuyệt.\""
  stress_trait_ongoing.5001.a.flavor:0 "Ta sẽ ăn, nhưng chỉ để lịch sự thôi."
  stress_trait_ongoing.5001.b:0 "\"Ngươi không nên… không, thật mà. #EMP Hầu gái!#! Dọn đi.\""
  stress_trait_ongoing.5001.c.dog:0 "Giả vờ ăn, nhưng bỏ hết cho [ROOT.Char.Custom('DogStoryName')] dưới bàn."
  stress_trait_ongoing.5001.c.cat:0 "Giả vờ ăn, nhưng bỏ hết cho [ROOT.Char.Custom('CatStoryName')] dưới bàn."
  stress_trait_ongoing.5001.c.no_pet:0 "Giả vờ ăn, nhưng bỏ hết cho một con chó dưới bàn."
  stress_trait_ongoing.5001.c.success:0 "[giver.GetTitledFirstName] nghĩ rằng Ta đã thưởng thức bữa ăn"
  stress_trait_ongoing.5001.c.failure:0 "[giver.GetTitledFirstName] nhận ra Ta không ăn gì"

