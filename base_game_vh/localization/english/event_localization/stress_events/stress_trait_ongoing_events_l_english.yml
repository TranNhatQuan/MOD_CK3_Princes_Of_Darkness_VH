  stress_trait_ongoing.1501.t:0 "Ám Ảnh"
  stress_trait_ongoing.1501.desc_1_a:0 "Sáng nay, khi đi qua [obsession.GetHerHim], Ta thoáng thấy khe ngực đầy mê hoặc của [obsession.GetTitledFirstNamePossessive]."
  stress_trait_ongoing.1501.desc_1_b:0 "Sáng nay, khi đi qua [obsession.GetHerHim], Ta nhận ra một phần nhô gợi cảm từ quần tất của [obsession.GetTitledFirstNamePossessive]."
  stress_trait_ongoing.1501.desc_1_c:0 "[obsession.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mỉm cười ấm áp với Ta khi Ta đi qua [obsession.GetHerHim] sáng nay."
  stress_trait_ongoing.1501.desc_1_d:0 "Ta không thể không để ánh mắt dạo quanh cơ thể [obsession.GetTitledFirstNamePossessive] khi đi qua [obsession.GetHerHim] sáng nay."
  stress_trait_ongoing.1501.bridge:0 "Kể từ đó, Ta không thể ngừng nghĩ về [obsession.GetHerHim], và những tưởng tượng trụy lạc cứ liên tục làm Ta xao nhãng công việc.\n\n"
  stress_trait_ongoing.1501.desc_2_a:0 "bầu ngực đầy đặn của [obsession.GetHerHis|U],"
  stress_trait_ongoing.1501.desc_2_b:0 "hông rộng của [obsession.GetHerHis|U],"
  stress_trait_ongoing.1501.desc_2_c:0 "phái mạnh gợi cảm của [obsession.GetHerHis|U],"
  stress_trait_ongoing.1501.desc_2_d:0 "thân hình dẻo dai của [obsession.GetHerHis|U],"
  stress_trait_ongoing.1501.desc_2_e:0 "vai rộng của [obsession.GetHerHis|U],"
  stress_trait_ongoing.1501.desc_2_f:0 "thân hình hấp dẫn của [obsession.GetHerHis|U],"
  stress_trait_ongoing.1501.desc_3_a:0 "cách cơ thể nhanh nhẹn của [obsession.GetHerHis] di chuyển..."
  stress_trait_ongoing.1501.desc_3_b:0 "cách cơ thể đầy đặn của [obsession.GetHerHis] đung đưa khi [obsession.GetSheHe] bước đi..."
  stress_trait_ongoing.1501.desc_3_c:0 "cách những cơ bắp của [obsession.GetHerHis] cuồn cuộn dưới làn da khi [obsession.GetSheHe] lướt qua..."
  stress_trait_ongoing.1501.desc_3_d:0 "phong thái đĩnh đạc và uy nghiêm mà [obsession.GetSheHe] luôn mang theo bên [obsession.GetHerselfHimself]..."
  stress_trait_ongoing.1501.desc_3_e:0 "cách [obsession.GetSheHe] tinh nghịch lảng vảng quanh [ROOT.Char.Custom('ResidenceBuilding')]..."
  stress_trait_ongoing.1501.desc_3_f:0 "nhịp đi đoan chắc mà [obsession.GetSheHe] bước đi..."
  stress_trait_ongoing.1501.end:0 "Quá sức chịu đựng! Ta phải tìm cách giải tỏa ám ảnh này, nếu không sẽ chẳng làm được gì!"
  stress_trait_ongoing.1501.warning:0 "\n\nThật tiếc, Ta biết rằng [obsession.GetFirstName] không hứng thú với [ROOT.Char.GetWomenMen], và vì vậy [obsession.GetSheHe] cũng sẽ không quan tâm đến Ta."
  stress_trait_ongoing.1501.a:0 "Ta phải biết liệu [obsession.GetSheHe] có cảm thấy tương tự không!"
  stress_trait_ongoing.1501.a.flavor:0 "Điều này sẽ giải quyết mọi chuyện, theo một cách nào đó."
  stress_trait_ongoing.1501.a.success:0 "[obsession.GetTitledFirstName] cũng đã khao khát Ta"
  stress_trait_ongoing.1501.a.failure:0 "[obsession.GetTitledFirstName] từ chối sự tiến cử của Ta"
  stress_trait_ongoing.1501.b:0 "Một chút tưởng tượng thì có sao đâu, đúng không?"
  stress_trait_ongoing.1501.b.flavor:0 "Một chút thời gian riêng tư sẽ đem lại nhẹ nhõm tạm thời, ít nhất là vậy."
  stress_trait_ongoing.1501.c:0 "Một chuyến đến nhà thổ sẽ giúp Ta quên đi [obsession.GetHerHim]..."
  stress_trait_ongoing.1501.c.flavor:0 "#EMP Ai đó#! chắc chắn sẽ giúp Ta vượt qua chuyện này."
  stress_trait_ongoing.1501.d:0 "Ta không nên coi [obsession.GetFirstNameNoTooltip] như vật thể để thỏa mãn, điều đó là #EMP sai#!!"
  stress_trait_ongoing.1501.d.flavor:0 "Ám ảnh này vừa không công bằng với [obsession.GetHerHim], vừa có hại cho Ta."

