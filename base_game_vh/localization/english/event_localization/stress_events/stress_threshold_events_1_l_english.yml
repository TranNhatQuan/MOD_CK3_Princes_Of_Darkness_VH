  stress_threshold.2331.j:0 "Ta không cần tình yêu, chỉ cần sự phục tùng."

  stress_threshold.2341.t:0 "Khủng Hoảng Tinh Thần: Bỏ Bê Nghĩa Vụ"
  stress_threshold.2341.desc.intro:0 "Chết tiệt, ta cũng cần thời gian cho bản thân! Thì sao nếu ta rời [ROOT.Char.Custom('GetCourt')|l] vài ngày, hay thậm chí cả tháng? Lãnh đạo là đặc quyền của ta, và ta sẽ thực hiện nó, hoặc bỏ mặc nó, khi ta muốn.\n\nTa là [ROOT.GetCharacter.GetTitleAsNameNoTooltip],"
  stress_threshold.2341.desc.lazy:0 "và ta cần được nghỉ ngơi!"
  stress_threshold.2341.desc.craven:0 "và nếu ta chọn không tự đặt mình vào nguy hiểm, đó không phải chuyện của ai ngoài ta!"
  stress_threshold.2341.desc.shy:0 "và nếu ta không muốn đối mặt với các [ROOT.Char.Custom('GetCourtierPlural')|l] của mình, ta cũng không cần!"
  stress_threshold.2341.desc.arbitrary:0 "và ta không có nghĩa vụ nào ngoài những gì ta chọn giữ!"
  stress_threshold.2341.desc.fickle:0 "$stress_threshold.2341.desc.arbitrary$"
  stress_threshold.2341.desc.fallback:0 "và những lựa chọn của ta là bất khả xâm phạm!"
  stress_threshold.2341.a.reclusive.gain:0 "Biến đi! Tất cả các ngươi!"
  stress_threshold.2341.a.reclusive.effect:0 "$stress_threshold.2341.a.reclusive.gain$"
