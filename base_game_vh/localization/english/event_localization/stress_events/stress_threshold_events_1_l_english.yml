#Character Modifiers
  encouraged_city_burn_modifier:0 "Cứ Để Tất Cả Cháy"
  encouraged_city_burn_modifier_desc:0 "Nhân vật này đã để cả một lãnh địa cháy gần như rụi xuống đất."
  lashing_out_at_victims_modifier:0 "Trút Giận Lên Nạn Nhân"
  lashing_out_at_victims_modifier_desc:0 "Nhân vật này liên tục trút giận lên những nạn nhân đang cần sự giúp đỡ của họ."
  lost_in_lust_modifier:0 "Chìm Đắm Trong Dục Vọng"
  lost_in_lust_modifier_desc:0 "Nhân vật này cố quên đi quá khứ bằng những cuộc hoan lạc xác thịt."
  agonising_irritations_modifier:0 "Những Cơn Khó Chịu Đau Đớn"
  agonising_irritations_modifier_desc:0 "Nhân vật này cố quên đi quá khứ bằng sự bực bội với hiện tại."
  scars_over_scars_modifier:0 "Chồng Chất Vết Sẹo"
  scars_over_scars_modifier_desc:0 "Nhân vật này cố quên đi quá khứ bằng nỗi đau thể xác."
  trying_to_buy_happiness_modifier:0 "Cố Mua Lấy Hạnh Phúc"
  trying_to_buy_happiness_modifier_desc:0 "Nhân vật này cố quên đi quá khứ bằng cách liên tục mua những món đồ phù phiếm."
  outer_monologue_modifier:0 "Độc Thoại Công Khai"
  outer_monologue_modifier_desc:0 "Nhân vật này tìm kiếm sự tha thứ cho quá khứ bằng cách không ngừng phơi bày nó."
  sated_by_mistakes_modifier:0 "No Nê Vì Sai Lầm"
  sated_by_mistakes_modifier_desc:0 "Nhân vật này sống nhờ sự hối hận nhiều hơn là thức ăn."
