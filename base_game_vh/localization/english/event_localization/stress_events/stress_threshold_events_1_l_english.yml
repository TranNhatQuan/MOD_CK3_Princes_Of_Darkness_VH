  stress_threshold.2341.h:0 "Lũ các ngươi thật trẻ con!"

  stress_threshold.2351.t:0 "Khủng Hoảng Tinh Thần: Lời Lẽ Khiếm Nhã"
  stress_threshold.2351.desc.intro:0 "Ta ngồi đó, chỉ chú ý lơ đãng, khi một nông dân địa phương kết thúc câu chuyện than khổ của họ. Thành thật mà nói, ta gần như chẳng nghe họ nói gì. Tâm trí ta đang đầy ắp những vấn đề #EMP của riêng ta#!.\n\n"
  stress_threshold.2351.desc.content:0 ""Ngươi không thể просто #EMP hài lòng#! với những gì còn lại sao?""
  stress_threshold.2351.desc.cynical:0 ""Hừ, làm sao ta biết ngươi không #EMP nói dối#! chứ?""
  stress_threshold.2351.desc.paranoid:0 ""Một câu chuyện #EMP đáng ngờ#!. Có khi ngươi chỉ là gián điệp gian trá!""
  stress_threshold.2351.desc.sadistic:0 ""Ngươi biết không, ta nghĩ có một chỗ #EMP hoàn hảo#! trong [ROOT.Char.Custom('GetDungeon')] cho ngươi đấy.""
  stress_threshold.2351.desc.vengeful:0 ""Ta chắc ngươi đáng phải chịu #EMP tất cả#! những gì đã xảy ra.""
  stress_threshold.2351.desc.fallback:0 ""Nhân danh [ROOT.GetCharacter.GetFaith.HighGodName], ngươi #EMP bốc mùi#! quá.""
  stress_threshold.2351.desc.rump:0 "Ta trả lời mà không suy nghĩ.\n\nCăn [ROOT.Char.Custom('GetRoom')] rơi vào im lặng hoàn toàn, mọi ánh mắt đều hướng về phía người thường dân bối rối và ta. Rõ ràng đó không phải là phản ứng họ mong đợi."
  stress_threshold.2351.a.reclusive.gain:0 "#EMP Cút#! hết đi!"
  stress_threshold.2351.a.reclusive.effect:0 "$stress_threshold.2351.a.reclusive.gain$"
  stress_threshold.2351.b.irritable.gain:0 "Các ngươi muốn gì ở ta, lũ yếu đuối?"
  stress_threshold.2351.b.irritable.effect:0 "$stress_threshold.2351.b.irritable.gain$"
  stress_threshold.2351.c.profligate.gain:0 "$stress_threshold.1701.d.profligate.gain$"
  stress_threshold.2351.c.profligate.effect:0 "$stress_threshold.1701.d.profligate.gain$"
  stress_threshold.2351.d.improvident.gain:0 "$stress_threshold.1711.d.improvident.gain$"
  stress_threshold.2351.d.improvident.effect:0 "$stress_threshold.1711.d.improvident.gain$"
  stress_threshold.2351.e.inappetetic.gain:0 "$stress_threshold.1721.h.inappetetic.gain$"
  stress_threshold.2351.e.inappetetic.effect:0 "$stress_threshold.1721.h.inappetetic.gain$"
  stress_threshold.2351.f.journaller.gain:0 "Có lẽ ta sẽ phác thảo vài nét trong nhật ký khi nghe..."
  stress_threshold.2351.f.journaller.effect:0 "$stress_threshold.2351.f.journaller.gain$"
  stress_threshold.2351.g.drunkard.gain:0 "$stress_threshold.1701.i.drunkard.gain$"
  stress_threshold.2351.g.drunkard.effect:0 "$stress_threshold.1701.i.drunkard.gain$"
  stress_threshold.2351.h.hashishiyah.gain:0 "$stress_threshold.1701.j.hashishiyah.gain$"
  stress_threshold.2351.h.hashishiyah.effect:0 "$stress_threshold.1701.j.hashishiyah.gain$"
  stress_threshold.2351.i:0 "Xin lỗi, bây giờ hãy kể lại câu chuyện của ngươi..."

  stress_threshold.3401.t:0 "Khủng Hoảng Tinh Thần: Trút Giận Lên Người Đưa Tin"
  stress_threshold.3401.desc.intro:0 "Đầu ta như một cơn giông bị nhốt trong quả trứng. Ta vặn vẹo tìm tư thế thoải mái trên ngai vàng, trong khi một sứ giả đang kể lể với ta một câu chuyện than khổ vô nghĩa về cướp biển, thổ phỉ, bọn cướp bóc, hay mấy chuyện tầm thường của đám dân thường.\n\nÁp lực trong đầu ta dâng lên, đòi hỏi phải được trút ra đâu đó, và gần như theo bản năng, miệng ta mở ra để nói."
  stress_threshold.3401.desc.vengeful:0 ""Có phải vài năm trước ngươi đã ném trứng vào ta không?""
  stress_threshold.3401.desc.wrathful:0 ""Ngươi dám mang mấy chuyện vặt vãnh này tới trước mặt ta sao?!""
  stress_threshold.3401.desc.impatient:0 ""Nói nhanh lên, đồ ngu! Gah, chậm quá!""
  stress_threshold.3401.desc.arbitrary:0 ""Nhân danh [ROOT.GetCharacter.GetFaith.HighGodName], ta thấy mùi của ngươi thật nồng nặc.""
  stress_threshold.3401.desc.paranoid:0 ""Ngươi nghĩ ta sẽ tin những lời dối trá lộ liễu này sao? Rõ ràng ngươi là một sát thủ được thuê!""
  stress_threshold.3401.desc.callous:0 ""Ta không quan tâm đến những rắc rối tầm thường như vậy.""
  stress_threshold.3401.desc.sadistic:0 ""Sự phục vụ tồi tệ của ngươi là một tấm gương xấu.""
  stress_threshold.3401.desc.fallback:0 "$stress_threshold.3401.desc.wrathful$"
  stress_threshold.3401.desc.rump:0 "#EMP Chém đầu tên ngu này!#!\n\nTriều đình xung quanh chúng ta lập tức chìm vào im lặng chết chóc."
  stress_threshold.3401.a.reclusive.gain:0 "Và tất cả các ngươi nữa, biến khỏi tầm mắt ta!"
  stress_threshold.3401.a.reclusive.effect:0 "$stress_threshold.3401.a.reclusive.gain$"
  stress_threshold.3401.a.reclusive.list:0 "Mọi [character|E] ngoài gia đình trực hệ của Ngài"
  stress_threshold.3401.b.irritable.gain:0 "Và chém đầu bất kỳ kẻ nào khác dám nói chuyện với ta!"
  stress_threshold.3401.b.irritable.effect:0 "$stress_threshold.3401.b.irritable.gain$"
  stress_threshold.3401.c.journaller.gain:0 "Vắt cái xác đó đi! #EMP Ta sẽ dùng chất lỏng làm mực!#!"
  stress_threshold.3401.c.journaller.effect:0 "$stress_threshold.3401.c.journaller.gain$"
  stress_threshold.3401.d.confider.gain:0 "$stress_threshold.1701.h.confider.gain$"
  stress_threshold.3401.d.confider.effect:0 "$stress_threshold.1701.h.confider.effect$"
  stress_threshold.3401.e.drunkard.gain:0 "Và mang cho ta rượu! Mang thêm một bình nữa!"
  stress_threshold.3401.e.drunkard.effect:0 "$stress_threshold.3401.e.drunkard.gain$"
  stress_threshold.3401.f.hashishiyah.gain:0 "Và mang bánh hashish ra đây!"
  stress_threshold.3401.f.hashishiyah.effect:0 "$stress_threshold.3401.f.hashishiyah.gain$"
  stress_threshold.3401.g:0 "Và mang cái đầu đó làm ghế gác chân cho ta!"

  stress_threshold.3411.t:0 "Khủng Hoảng Tinh Thần: Ta Không Xứng Đáng!"
  stress_threshold.3411.desc.intro:0 "Ta không thể làm việc này. Ta thực sự không thể. Ta không thể làm [ROOT.GetCharacter.GetTitleAsNameNoTooltip|L] thêm một khắc nào nữa! Làm sao người ta có thể #EMP chịu đựng#! được đống căng thẳng sôi sục này chứ? Dù cho"
  stress_threshold.3411.desc.generous:0 "ta cho đi bao nhiêu, dù ta hào phóng với thần dân đến mức nào, vẫn luôn có kẻ nghèo khổ, và vẫn luôn có kẻ ghét ta."
  stress_threshold.3411.desc.diligent:0 "ta làm việc bao nhiêu, bao nhiêu đêm thức trắng không rời bàn làm việc, vấn đề của vương quốc vẫn cứ sinh sôi và mục ruỗng."
  stress_threshold.3411.desc.patient:0 "ta kiên nhẫn lắng nghe hết vấn đề này đến vấn đề khác, ta vẫn dường như không bao giờ có đủ giải pháp tốt."
  stress_threshold.3411.desc.humble:0 "ta cố không để lòng kiêu hãnh cản trở nghĩa vụ của mình đến mức nào, ta vẫn cảm thấy như đang bị chính sự ngạo mạn của mình nuốt chửng."
  stress_threshold.3411.desc.shy:0 "ta cố gắng bao nhiêu để mở triều, cảnh tượng các cận thần tụ tập đông đúc vẫn khiến ta lên cơn hoảng loạn vì sợ hãi."
  stress_threshold.3411.desc.just:0 "ta có công chính đến đâu, dù ta nhiệt thành theo đuổi pháp luật thế nào, tội ác vẫn mục ruỗng ở mọi góc lãnh địa."
  stress_threshold.3411.desc.trusting:0 "bao nhiêu lần ta tha thứ cho người khác, cho họ vay tiền, hoặc tin tưởng họ, vẫn luôn xảy ra điều gì đó thảm khốc và khó lường."
  stress_threshold.3411.desc.compassionate:0 "mỗi khi ta mở triều để lắng nghe dân thường, luôn có hàng trăm người khác chờ đợi để cầu xin sự giúp đỡ của ta."
  stress_threshold.3411.desc.forgiving:0 "$stress_threshold.3411.desc.trusting$"
  stress_threshold.3411.desc.fallback:0 "dù ta cố gắng đến đâu, mọi việc ta làm dường như đều là sai lầm, mọi thành tựu đều hóa thành tro bụi trong tay ta."
  stress_threshold.3411.desc.rump:0 "\n\nRõ ràng ta sẽ #EMP không bao giờ#! đủ tốt để cai trị. Phải có thứ gì đó #EMP thay đổi#!."
  stress_threshold.3411.a.reclusive.gain:1 "ĐỪNG NHÌN TA!"
  stress_threshold.3411.a.reclusive.effect:0 "$stress_threshold.2351.a.reclusive.gain$"
  stress_threshold.3411.b.flagellant.gain:0 "Thân xác ta để chuộc tội!"
  stress_threshold.3411.b.flagellant.effect:0 "$stress_threshold.3411.b.flagellant.gain$"
  stress_threshold.3411.c.profligate.gain:0 "Những công trình vĩ đại sẽ đánh lừa thần dân..."
  stress_threshold.3411.c.profligate.effect:0 "$stress_threshold.3411.c.profligate.gain$"
  stress_threshold.3411.d.improvident.gain:0 "Nếu kho bạc thuộc về tất cả mọi người thì sao?"
  stress_threshold.3411.d.improvident.effect:0 "$stress_threshold.3411.d.improvident.gain$"
  stress_threshold.3411.e.contrite.gain:0 "Cả thế giới #EMP phải#! biết sự bất xứng của ta!"
  stress_threshold.3411.e.contrite.effect:0 "$stress_threshold.3411.e.contrite.gain$"
  stress_threshold.3411.f.inappetetic.gain:0 "Dọn sạch kho lương! Ta không xứng đáng với đồ ăn ngon."
  stress_threshold.3411.f.inappetetic.effect:0 "$stress_threshold.3411.f.inappetetic.gain$"
  stress_threshold.3411.f.inappetetic.list:0 "Mọi [courtier|E] và [guest|E] đều bị bỏ đói cùng Ngài"
  stress_threshold.3411.g.journaller.gain:0 "Những cuốn nhật ký cũ của ta! Ta phải nghiên cứu lỗi lầm của mình..."
  stress_threshold.3411.g.journaller.effect:0 "$stress_threshold.3411.g.journaller.gain$"
  stress_threshold.3411.h.confider.gain:0 "$stress_threshold.1701.h.confider.gain$"
  stress_threshold.3411.h.confider.effect:0 "$stress_threshold.1701.h.confider.effect$"
  stress_threshold.3411.i.athletic.gain:0 "Ta không thể chạy trốn trách nhiệm này, nhưng ta có thể thử."
  stress_threshold.3411.i.athletic.effect:0 "$stress_threshold.3411.i.athletic.gain$"
  stress_threshold.3411.j.drunkard.gain:0 "Mang cho ta cả thùng rượu để dìm nỗi buồn."
  stress_threshold.3411.j.drunkard.effect:0 "$stress_threshold.3411.j.drunkard.gain$"
  stress_threshold.3411.k.hashishiyah.gain:0 "Ta muốn đủ hashish để xóa sạch nỗi nhục này."
  stress_threshold.3411.k.hashishiyah.effect:0 "$stress_threshold.3411.k.hashishiyah.gain$"
  stress_threshold.3411.l:0 "Đủ rồi! Ta thoái vị!"
  stress_threshold.3411.l.list:0 "Mọi [vassal|E] không ghét Ngài"
  stress_threshold.3411.l.tt:0 "Tất cả [claims|E] chống lại [titles|E] của Ngài trở thành [pressed|E]"

  stress_threshold.3421.t:0 "Khủng Hoảng Tinh Thần: Lãnh Địa Sa Đọa"
  stress_threshold.3421.desc.intro:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]", người hầu van nài, "xin ngài làm gì đó đi! [burning_holding.GetNameNoTier] đang cháy! Ngài phải gửi viện trợ!".\n\n"
  stress_threshold.3421.desc.lustful:0 "Ta duỗi người, hai bàn tay dễ dàng chạm vào làn da trẻ trung xinh đẹp. Một dàn tiếng rên rỉ phía sau ta dường như chẳng hề bận tâm đến vị khách."
 #Go full Denethor:
  stress_threshold.3421.desc.gluttonous:0 "Ta tiếp tục tống thức ăn vào miệng mình, chỉ tạm dừng bữa tiệc của một [ROOT.GetCharacter.GetWomanMan] duy nhất này sau vài phút gượng gạo trôi qua khi nhận ra rõ ràng rằng tên lính đưa tin sẽ không rời đi nếu không có một mệnh lệnh dứt khoát."
  stress_threshold.3421.desc.greedy:0 "Ta vẫn tiếp tục đếm tiền, hoàn toàn không bận tâm. Những đống bạc và vàng sáng lấp lánh bao quanh ta như các tháp pháo của một lâu đài tí hon."
  stress_threshold.3421.desc.lazy:0 "Đôi mắt ta vẫn nhắm nghiền. Ta khẽ đung đưa trên chiếc võng vải của mình, cô độc trong tòa tháp cao nhất mà ta sở hữu, ngoại trừ tên lính đưa tin cùng cả một gia tài [ROOT.GetCharacter.GetTitleAsNamePossessiveNoTooltip|L] ngập tràn gối êm nệm ấm."
  stress_threshold.3421.desc.arrogant:0 "Ta tiếp tục xây dựng mô hình cung điện hoàn hảo mới. Nó giống ta ở mọi chi tiết, và vì chính ta tạo ra nó, mọi chi tiết đều đúng."
  stress_threshold.3421.desc.craven:0 "Ta vẫn cố thủ sau cánh cửa sắt nặng nề. Phải cần cả chục binh lính khỏe mạnh mới phá được nơi này."
  stress_threshold.3421.desc.gregarious:0 "Ta hầu như không nghe thấy họ giữa tiếng cười nói ồn ào phía sau. Bữa tiệc của ta đang cực kỳ náo nhiệt, và đã kéo dài nhiều ngày."
  stress_threshold.3421.desc.cynical:0 "Ta nhìn họ từ cửa phòng trú ẩn với vẻ hoài nghi. Cháy ư? Rõ ràng là dối trá. Làm sao ta biết đây thật sự là một trong #EMP người hầu#! của ta? Có thể là bất kỳ ai! Tốt nhất tống cổ họ đi."
  stress_threshold.3421.desc.zealous:0 "Ta tiếp tục đọc [ROOT.GetCharacter.GetFaith.ReligiousText], xung quanh là các biểu tượng thiêng liêng của đức tin, cầu xin [ROOT.GetCharacter.GetFaith.HighGodName] dẫn đường. Chỉ khi rõ ràng rằng sứ giả sẽ không rời đi ta mới quay lại."
  stress_threshold.3421.desc.stubborn:0 "Mắt ta vẫn nhắm, giường vẫn nguyên vẹn. Thói quen của ta là thói quen của ta và ta sẽ không thay đổi nếu không có lý do #EMP cực kỳ#! chính đáng. Chỉ khi sứ giả hỏi lại ta mới động đậy."
  stress_threshold.3421.desc.fallback:0 "Ta đứng trên tháp cao nhất của [capital_holding.GetNameNoTier], nhìn xuống thủ đô với đôi môi mím chặt. Có cảm giác như ta đã không rời khỏi đây nhiều ngày."
  stress_threshold.3421.desc.rump:0 "\n\n"Ta tin rằng ta đã ra lệnh không được làm phiền", ta đáp. Chỉ căn phòng này, chỉ thực tại này, mới còn hợp lý đối với tâm trí đang rạn vỡ của ta."
  stress_threshold.3421.a.rakish.gain:0 "Mang cho ta một Ngài đồng hành, ta sẽ gửi cứu trợ."
  stress_threshold.3421.a.rakish.effect:0 "$stress_threshold.3421.a.rakish.gain$"
  stress_threshold.3421.b.reclusive.gain:0 "Tự các ngươi xử lý đi! Để ta yên!"
  stress_threshold.3421.b.reclusive.effect:0 "$stress_threshold.3421.b.reclusive.gain$"
  stress_threshold.3421.c.irritable.gain:0 "Lũ vô dụng chết tiệt, ta sẽ xử lý!"
  stress_threshold.3421.c.irritable.effect:0 "$stress_threshold.3421.c.irritable.gain$"
  stress_threshold.3421.d.flagellant.gain:0 "Cái gì?! Ta phải bị quất roi để chuộc lỗi!"
  stress_threshold.3421.d.flagellant.effect:0 "$stress_threshold.3421.d.flagellant.gain$"
  stress_threshold.3421.e.profligate.gain:0 "Mở kho bạc! Bảo vệ các khu chợ!"
  stress_threshold.3421.e.profligate.effect:0 "$stress_threshold.3421.e.profligate.gain$"
  stress_threshold.3421.f.comfort_eater.gain:0 "Chuẩn bị bữa ăn thịnh soạn, ta sẽ ra ngay."
  stress_threshold.3421.f.comfort_eater.effect:0 "$stress_threshold.3421.f.comfort_eater.gain$"
  stress_threshold.3421.g.drunkard.gain:0 "Chuẩn bị thùng rượu ngon nhất, ta sẽ ra ngay."
  stress_threshold.3421.g.drunkard.effect:0 "$stress_threshold.3421.g.drunkard.gain$"
  stress_threshold.3421.h.hashishiyah.gain:0 "Chuẩn bị đĩa bánh, ta sẽ ra ngay."
  stress_threshold.3421.h.hashishiyah.effect:0 "$stress_threshold.3421.h.hashishiyah.gain$"
  stress_threshold.3421.i:0 "Cứ để tất cả #EMP cháy#!."
  stress_threshold.3421.b.reclusive.list:0 "Mọi [vassal|E] còn lương tâm"

