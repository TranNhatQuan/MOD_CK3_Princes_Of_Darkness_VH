l_english: 
  stress_threshold.1701.t:0 "Khủng Hoảng Tinh Thần: Hậu Quả Ập Đến"
  stress_threshold.1701.desc.intro:0 "Khi Ta bước ngang qua [ROOT.Char.Custom('GetCourt')] của mình trong tâm trạng bực bội, nhiều [ROOT.Char.Custom('GetCourtierPlural')|l] của Ta cứ lải nhải mãi về một vấn đề nào đó đang xảy ra ở [capital_province.GetNameNoTooltip].\n\n"
  stress_threshold.1701.desc.lazy:0 "Ta đơn giản là không còn chút sức lực nào để bận tâm nữa, ta chỉ muốn quay lại giường ngủ!"
  stress_threshold.1701.desc.wrathful:0 "Những ngày như thế này, khi lời nói của họ chỉ còn là tiếng vo ve khó chịu bên tai, ta chỉ muốn treo cổ cả lũ."
  stress_threshold.1701.desc.impatient:0 "Ước gì họ tự nhanh chóng giải quyết lấy mọi thứ, thay vì bắt ta phải đích thân xử lý từng. Chuyện. Nhỏ."
  stress_threshold.1701.desc.arrogant:0 "Thành thật mà nói, đôi khi ta cảm thấy cả [ROOT.Char.Custom('GetRealmOrDomicile')|l] này sẽ sụp đổ nếu ta không tự mình điều hành mọi thứ."
  stress_threshold.1701.desc.arbitrary:0 "Có khi chuyện này thậm chí còn chẳng phải vấn đề gì nghiêm trọng. Có lẽ chỉ là rắc rối địa phương vặt vãnh mà thôi."
  stress_threshold.1701.desc.trusting:0 "Với tình hình dạo gần đây, ta khó mà tập trung được, nhưng chắc hẳn chẳng ai nói những lời gay gắt như vậy nếu chúng không phải sự thật."
  stress_threshold.1701.desc.stubborn:0 "Thành thật mà nói, chuyện này nghe cũng chẳng nghiêm trọng gì. Nếu họ cố gắng hơn một chút, họ thậm chí còn chẳng nhận ra vấn đề."
  stress_threshold.1701.desc.fallback:0 "Đôi khi chỉ riêng việc là chính mình thôi cũng đã khiến tinh thần kiệt quệ."
  stress_threshold.1701.desc.rump:0 "\n\nCó điều gì đó trong cuộc thảo luận nghe thật... quen thuộc. K-kế hoạch đó chẳng phải là ý tưởng của #EMP ta#! sao? Chuyện này là lỗi của #EMP ta#! ư?"
  stress_threshold.1701.a.rakish.gain:0 "Mặc xác chuyện này! Ta tới nhà thổ đây."
  stress_threshold.1701.a.rakish.effect:0 "$stress_threshold.1701.a.rakish.gain$"
  stress_threshold.1701.b.irritable.gain:0 "Ta thề với [ROOT.GetCharacter.GetFaith.HighGodName], ta sẽ đấm ai đó."
  stress_threshold.1701.b.irritable.effect:0 "$stress_threshold.1701.b.irritable.gain$"
  stress_threshold.1701.c.flagellant.gain:0 "Ta sẽ tự quất roi để chuộc tội!"
  stress_threshold.1701.c.flagellant.effect:0 "$stress_threshold.1701.c.flagellant.gain$"
  stress_threshold.1701.d.profligate.gain:0 "Có lẽ một chiếc áo choàng mới sẽ khiến ta khá hơn..."
  stress_threshold.1701.d.profligate.effect:0 "$stress_threshold.1701.d.profligate.gain$"
  stress_threshold.1701.g.journaller.gain:0 "Ta phải trút bỏ những suy nghĩ này bằng ngòi bút."
  stress_threshold.1701.g.journaller.effect:0 "$stress_threshold.1701.g.journaller.gain$"
  stress_threshold.1701.h.confider.gain:0 "Có lẽ [friend.GetFirstNameNoTooltip] sẽ ủng hộ ta?"
  stress_threshold.1701.h.confider.effect:0 "[friend.GetFirstNameNoTooltip] chắc chắn sẽ ủng hộ ta!"
  stress_threshold.1701.i.drunkard.gain:0 "Một ly rượu mạnh có thể giải quyết hầu hết mọi vấn đề..."
  stress_threshold.1701.i.drunkard.effect:0 "$stress_threshold.1701.i.drunkard.gain$"
  stress_threshold.1701.j.hashishiyah.gain:0 "Hashish sẽ xoa dịu thần kinh rối loạn của ta..."
  stress_threshold.1701.j.hashishiyah.effect:0 "$stress_threshold.1701.j.hashishiyah.gain$"
 #NOTE: Discuss w/ Sean?
  stress_threshold.1701.k:0 "Chỉ là mấy lời tán gẫu vô nghĩa, chẳng liên quan gì tới ta."

  stress_threshold.1711.t:0 "Khủng Hoảng Tinh Thần: Quá Bận Rộn"
  stress_threshold.1711.desc.intro:0 "Nhân danh [ROOT.GetCharacter.GetFaith.FateGodName], dạo gần đây các [ROOT.Char.Custom('GetCourtierPlural')|l] của ta cứ liên tục đưa ra yêu cầu không ngừng. Công việc này dường như #EMP không bao giờ kết thúc#!. Lại thêm một người nữa tiến đến, trông có vẻ bối rối vì một chuyện tầm thường nào đó.\n\n"
  stress_threshold.1711.desc.greedy:0 ""Ngươi có thuế cho ta không? Không à? Vậy ta cũng chẳng quan tâm.""
  stress_threshold.1711.desc.diligent:0 ""Ta sẽ xem xét vấn đề của ngươi trong vài tuần nữa, nhưng ngươi không đủ quan trọng để được giải quyết nhanh hơn.""
  stress_threshold.1711.desc.patient:0 "$stress_threshold.1711.desc.diligent$"
  stress_threshold.1711.desc.deceitful:0 ""Ngươi trông không giống thần dân của ta. Đi làm phiền người khác đi.""
  stress_threshold.1711.desc.ambitious:0 ""Ngươi nghĩ có thể nịnh nọt để lấy được con dấu hoàng gia từ ta sao, hỡi thị dân? Ta là [ROOT.GetCharacter.GetTitleAsNameNoTooltip|L]!"" 
  stress_threshold.1711.desc.just:0 ""Nếu ngươi đến để tìm công lý, hãy biết rằng ta không lật lại phán quyết của thẩm phán chỉ vì chút tiền lẻ.""
  stress_threshold.1711.desc.zealous:0 ""Ta gần như có thể ngửi thấy mùi tội lỗi bốc lên từ ngươi, hỡi thị dân!""
  stress_threshold.1711.desc.fallback:0 ""[ROOT.GetCharacter.GetFaith.HealthGodNamePossessive] phù hộ, lại thêm một người nữa!""
  stress_threshold.1711.desc.rump:0 "\n\n[courtier.GetFirstName] trố mắt nhìn ta, chớp mắt liên tục vì kinh ngạc. Ta vừa nói gì sai sao?"
  stress_threshold.1711.a.reclusive.gain:0 "Người cuối cùng. Sau đó ta muốn ở một mình."
  stress_threshold.1711.a.reclusive.effect:0 "$stress_threshold.1711.a.reclusive.gain$"
  stress_threshold.1711.b.flagellant.gain:0 "Tự quất roi sẽ xua tan tội lỗi..."
  stress_threshold.1711.b.flagellant.effect:0 "$stress_threshold.1711.b.flagellant.gain$"
  stress_threshold.1711.c.profligate.gain:0 "$stress_threshold.1701.d.profligate.gain$"
  stress_threshold.1711.c.profligate.effect:0 "$stress_threshold.1701.d.profligate.gain$"
  stress_threshold.1711.d.improvident.gain:0 "Cứ lấy tiền trong quốc khố đi, hỡi thị dân. Ngươi cần nó."
  stress_threshold.1711.d.improvident.effect:0 "$stress_threshold.1711.d.improvident.gain$"
  stress_threshold.1711.e.journaller.gain:0 "Ta sẽ tìm sự khuây khỏa trong nhật ký của mình."
  stress_threshold.1711.e.journaller.effect:0 "$stress_threshold.1711.e.journaller.gain$"
  stress_threshold.1711.f.athletic.gain:0 "Ta đi cưỡi ngựa. Ngay bây giờ."
  stress_threshold.1711.f.athletic.effect:0 "$stress_threshold.1711.f.athletic.gain$"
  stress_threshold.1711.g.drunkard.gain:0 "Rượu! Tỉnh táo thế này thì chịu không nổi."
  stress_threshold.1711.g.drunkard.effect:0 "$stress_threshold.1711.g.drunkard.gain$"
  stress_threshold.1711.h.hashishiyah.gain:0 "Hashish! Tỉnh táo thế này thì chịu không nổi."
  stress_threshold.1711.h.hashishiyah.effect:0 "$stress_threshold.1711.h.hashishiyah.gain$"
  stress_threshold.1711.i:0 "Ta là [ROOT.GetCharacter.GetTitleAsNameNoTooltip], ta làm được!"

  stress_threshold.1721.t:0 "Khủng Hoảng Tinh Thần: Kẻ Mạo Danh!"
  stress_threshold.1721.desc.intro:1 "Dạo gần đây, ta cảm thấy mình không xứng đáng làm [ROOT.Char.GetTitleAsNameNoTooltip]. Những người khác có nghi ngờ bản thân như ta vẫn nghi ngờ chính mình không?\n\nTa cố gắng trở nên tốt đẹp, "
  stress_threshold.1721.desc.chaste:0 "trong sạch, nhưng ta luôn cảm thấy bị cám dỗ bởi khoái lạc xác thịt. Một người như ta lẽ ra phải chống lại được những ham muốn dục vọng này."
  stress_threshold.1721.desc.temperate:0 "tiết độ, nhưng miệng ta lúc nào cũng thèm ăn. Mọi thứ đều khiến ta đói. Tại sao ta lại đói khát khủng khiếp, gần như vô nhân tính như vậy?"
  stress_threshold.1721.desc.generous:0 "hào phóng, nhưng dù ta cho đi bao nhiêu thì vẫn luôn có ai đó chìa bát xin thêm. Người khác dường như không gặp phải rắc rối này."
  stress_threshold.1721.desc.calm:0 "điềm tĩnh, nhưng từng #EMP người#! trong số [ROOT.Char.Custom('GetCourtierPlural')|l] của ta dường như đều quyết tâm làm ta phát điên. Những khủng hoảng nhỏ nhặt chiếm trọn ngày của ta, và ta cảm thấy mình sắp gục ngã theo cách mà người khác không hề gặp phải."
  stress_threshold.1721.desc.humble:0 "khiêm nhường, nhưng mọi hành động của ta dường như đều nồng nặc mùi kiêu ngạo. Người khác sống thật giản dị, còn ta thì cứ khoe khoang sự vĩ đại của mình mỗi khi có cơ hội, và ta không chịu nổi điều đó."
  stress_threshold.1721.desc.honest:0 "trung thực, nhưng với mỗi quyết định ta đưa ra, ta lại thấy những lời dối trá do bỏ sót và những sai sót nhỏ bóp méo ý nghĩa của mình. Người khác dường như chăm chỉ và thẳng thắn hơn nhiều, vậy tại sao ta lại bị nguyền rủa với bản tính dối trá này?"
  stress_threshold.1721.desc.craven:0 "cao quý, nhưng ta quá hèn nhát để hành động dũng cảm như những người khác, và dường như [ROOT.Char.Custom('GetCourtierPlural')|l] của ta luôn nhận ra điều đó."
  stress_threshold.1721.desc.content:0 "cao quý, hài lòng với vị trí của mình và không bị gánh nặng bởi tham vọng vô ích, nhưng ta cảm thấy mình hành xử ghen tị và kiêu ngạo hơn nhiều so với người khác."
  stress_threshold.1721.desc.cynical_no_collide:0 "lý trí, nhưng [ROOT.Char.Custom('GetCourtierPlural')|l] của ta luôn tán dương triết lý của người khác mà chẳng bao giờ quan tâm tới suy ngẫm của ta."
  stress_threshold.1721.desc.paranoid:0 "thận trọng, nhưng ta không thể dự đoán mọi thứ. Luôn có thêm kẻ phản bội cần tìm ra, thêm những âm mưu ẩn giấu. Người khác dường như không phải đối phó với quá nhiều phản bội như vậy, và ta chỉ có thể tự trách mình vì đã khơi dậy chúng."
  stress_threshold.1721.desc.callous:0 "thực tế, nhưng [ROOT.Char.Custom('GetCourtierPlural')|l] của ta lại hiểu mọi việc ta làm như thể ta độc ác, cứ cằn nhằn về những chuyện vặt vãnh. Người khác dường như không gặp khó khăn như vậy trong việc kiểm soát cấp dưới."
  stress_threshold.1721.desc.compassionate:0 "nhân hậu, nhưng người khác dường như được yêu mến hơn ta rất nhiều. Ta đơn giản là không thể kết nối với mọi người tốt như mình mong muốn."
  stress_threshold.1721.desc.fickle:0 "linh hoạt, nhưng dù ta thay đổi quyết định bao nhiêu lần, dù ta có thêm bao nhiêu thông tin mới, người khác dường như vẫn thích nghi tốt hơn ta."
  stress_threshold.1721.desc.vengeful:0 "công bằng, trừng phạt những xúc phạm và trả thù thích đáng, nhưng người khác dường như luôn thực thi sự báo thù nhanh chóng hơn nhiều."
  stress_threshold.1721.desc.forgiving:0 "khoan dung, nhưng các [ROOT.Char.Custom('GetCourtierPlural')|l] của ta vẫn sợ hãi khi đến gặp ta với vấn đề của họ. Người khác dường như có hàng trăm người tâm phúc, còn ta không biết làm thế nào để khiến người của mình tin tưởng như vậy."
  stress_threshold.1721.desc.fallback:0 "cao quý, nhưng ta đầy rẫy những khuyết điểm."
  stress_threshold.1721.desc.rump:0 "\n\nChết tiệt cái vũ trụ này, vì đã đặt những trách nhiệm như vậy lên một kẻ khốn khổ như ta!"
  stress_threshold.1721.a.reclusive.gain:0 "Ta cần ở một mình để suy nghĩ về chuyện này."
  stress_threshold.1721.a.reclusive.effect:0 "$stress_threshold.1721.a.reclusive.gain$"
  stress_threshold.1721.b.irritable.gain:0 "$stress_threshold.1701.b.irritable.gain$"
  stress_threshold.1721.b.irritable.effect:0 "$stress_threshold.1701.b.irritable.gain$"
  stress_threshold.1721.c.flagellant.gain:0 "$stress_threshold.1701.c.flagellant.gain$"
  stress_threshold.1721.c.flagellant.effect:0 "$stress_threshold.1701.c.flagellant.gain$"
  stress_threshold.1721.d.profligate.gain:0 "$stress_threshold.1701.d.profligate.gain$"
  stress_threshold.1721.d.profligate.effect:0 "$stress_threshold.1701.d.profligate.gain$"
  stress_threshold.1721.e.improvident.gain:0 "Làm từ thiện sẽ khiến ta trở thành người tốt hơn, đúng không?"
  stress_threshold.1721.e.improvident.effect:0 "$stress_threshold.1721.e.improvident.gain$"
  stress_threshold.1721.f.contrite.gain:0 "Ta phải công khai thú nhận tội lỗi của mình."
  stress_threshold.1721.f.contrite.effect:0 "$stress_threshold.1721.f.contrite.gain$"
 #NOTE: Discuss w/ Sean?
  stress_threshold.1721.g.comfort_eater.gain:0 "Chúng ta sẽ mở tiệc, mở tiệc cho tới khi ta cảm thấy khá hơn!"
  stress_threshold.1721.g.comfort_eater.effect:0 "Mở thêm một bữa tiệc nữa! Và thêm nữa, thêm nữa!"
  stress_threshold.1721.h.inappetetic.gain:0 "Bảo đầu bếp ngừng nấu bữa tối cho ta."
  stress_threshold.1721.h.inappetetic.effect:0 "$stress_threshold.1721.h.inappetetic.gain$"
  stress_threshold.1721.i.journaller.gain:0 "$stress_threshold.1711.e.journaller.gain$"
  stress_threshold.1721.i.journaller.effect:0 "$stress_threshold.1711.e.journaller.gain$"
  stress_threshold.1721.j.confider.gain:0 "$stress_threshold.1701.h.confider.gain$"
  stress_threshold.1721.j.confider.effect:0 "$stress_threshold.1701.h.confider.effect$"
  stress_threshold.1721.k.drunkard.gain:0 "$stress_threshold.1701.i.drunkard.gain$"
  stress_threshold.1721.k.drunkard.effect:0 "$stress_threshold.1701.i.drunkard.gain$"
  stress_threshold.1721.l.hashishiyah.gain:0 "$stress_threshold.1701.j.hashishiyah.gain$"
  stress_threshold.1721.l.hashishiyah.effect:0 "$stress_threshold.1701.j.hashishiyah.gain$"
  stress_threshold.1721.m:0 "Ta cũng giỏi giang chẳng kém ai!"
  stress_threshold.1721.n:0 "Có lẽ ta đang thèm thứ thịt hiếm nhất..."

  stress_threshold.1731.t:0 "Khủng Hoảng Tinh Thần: Không Có Thời Gian Cho Bản Thân"
  stress_threshold.1731.desc.intro:1 "Dạo gần đây công việc thật sự kiệt sức. Cứ như thể ta không có lấy một [ROOT.Char.Custom('GetCourtier')|l] nào có thể tự lau mông mà không cần ta phải chỉ dẫn rõ ràng và chi tiết vậy!\n\nNgay giữa lúc ta đang lên kế hoạch cho một chuyến đi ngắn"
  stress_threshold.1731.desc.lustful:0 "tới một nhà thổ địa phương, nơi ta định ở lại cho tới khi kiệt sức và đau nhức,"
  stress_threshold.1731.desc.gluttonous:0 "tới một quán rượu nổi tiếng, nơi ta sẽ thử những món ăn ngoại quốc kỳ lạ,"
  stress_threshold.1731.desc.brave:0 "để thử tài võ nghệ của mình với một đối thủ xứng tầm,"
  stress_threshold.1731.desc.shy:0 "tới một nơi địa phương nổi tiếng vì sự yên tĩnh,"
  stress_threshold.1731.desc.gregarious:0 "để chè chén với vài người địa phương thân thiện,"
  stress_threshold.1731.desc.sadistic:0 "tới một nhà tù địa phương đầy ắp tội phạm và nông dân,"
  stress_threshold.1731.desc.fallback:0 "để trốn khỏi trách nhiệm của [ROOT.Char.Custom('GetCourt')|l],"
  stress_threshold.1731.desc.rump:0 "một người hầu vội vã chạy tới, lắp bắp về một thảm họa tầm thường mới."
  stress_threshold.1731.a.rakish.gain:0 "$stress_threshold.1701.a.rakish.gain$"
  stress_threshold.1731.a.rakish.effect:0 "$stress_threshold.1701.a.rakish.gain$"
  stress_threshold.1731.b.reclusive.gain:0 "Chuyện đó có thể chờ, tất cả đều có thể chờ."
  stress_threshold.1731.b.reclusive.effect:0 "$stress_threshold.1731.b.reclusive.gain$"
  stress_threshold.1731.c.profligate.gain:0 "Ta sẽ dừng lại mua vài thứ trên đường..."
  stress_threshold.1731.c.profligate.effect:0 "$stress_threshold.1731.c.profligate.gain$"
  stress_threshold.1731.d.comfort_eater.gain:0 "Ta sẽ nghĩ về việc quay về sớm trong lúc ăn trưa"
  stress_threshold.1731.d.comfort_eater.effect:0 "$stress_threshold.1731.d.comfort_eater.gain$"
  stress_threshold.1731.e.journaller.gain:0 "$stress_threshold.1711.e.journaller.gain$"
  stress_threshold.1731.e.journaller.effect:0 "$stress_threshold.1711.e.journaller.gain$"
  stress_threshold.1731.f.confider.gain:0 "Ta sẽ nói chuyện với [friend.GetFirstNameNoTooltip] về chuyện này trên đường."
  stress_threshold.1731.f.confider.effect:0 "$stress_threshold.1731.f.confider.gain$"
  stress_threshold.1731.g.athletic.gain:0 "Có lẽ ta sẽ đi bộ tới nơi nghỉ ngơi của mình..."
  stress_threshold.1731.g.athletic.effect:0 "$stress_threshold.1731.g.athletic.gain$"
  stress_threshold.1731.h.drunkard.gain:0 "Có vẻ như ta sẽ uống rượu suốt cả chuyến đi."
  stress_threshold.1731.h.drunkard.effect:0 "$stress_threshold.1731.h.drunkard.gain$"
  stress_threshold.1731.i.hashishiyah.gain:0 "Chúng ta có bánh hashish cho chuyến đi chứ?"
  stress_threshold.1731.i.hashishiyah.effect:1 "$stress_threshold.1731.i.hashishiyah.gain$"
  stress_threshold.1731.g:0 "#EMP Được thôi#!, ta sẽ hủy kế hoạch của mình."

  stress_threshold.2301.t:0 "Khủng Hoảng Tinh Thần: Nhu Cầu Dâng Trào"
  stress_threshold.2301.desc.intro:0 "Dạo gần đây mỗi ngày dường như cứ trôi tuột khỏi tay ta, một chuỗi quyết định khó khăn không bao giờ kết thúc. Lồng ngực ta thắt lại. Đầu ngón tay ngứa ran, mắt ta cảm giác như quá nhỏ so với hộp sọ.\n\nTa cần rời đi, chỉ một lúc thôi, ta cần phải"
  stress_threshold.2301.desc.lustful:0 "cảm nhận hơi ấm của một người khác trong vòng tay mình, chỉ để được kết nối với ai đó một chút."
  stress_threshold.2301.desc.gluttonous:0 "ăn một thứ gì đó, bất cứ thứ gì, để lấp đầy khoảng trống vô nghĩa này."
  stress_threshold.2301.desc.greedy:0 "cảm nhận sự cứng rắn quen thuộc của đồng tiền lạnh giữa các ngón tay, thứ gì đó đáng tin, thứ gì đó có ý nghĩa."
  stress_threshold.2301.desc.gregarious:0 "nói chuyện với ai đó, bất kỳ ai, thật sự #EMP trò chuyện#! và cảm thấy họ hiểu ta."
  stress_threshold.2301.desc.fallback:0 "chỉ đơn giản là thở mà không cảm thấy bị đè nặng, mỉm cười mà không cảm thấy trống rỗng."
  stress_threshold.2301.desc.rump:0 "\n\nChẳng lẽ yêu cầu đó lại quá đáng sao?"
  stress_threshold.2301.a.rakish.gain:0 "$stress_threshold.1701.a.rakish.gain$"
  stress_threshold.2301.a.rakish.effect:0 "$stress_threshold.1701.a.rakish.gain$"
  stress_threshold.2301.b.profligate.gain:0 "Có lẽ... Có lẽ một chiếc giường mới? Hoặc ba chiếc?"
  stress_threshold.2301.b.profligate.effect:0 "$stress_threshold.2301.b.profligate.gain$"
