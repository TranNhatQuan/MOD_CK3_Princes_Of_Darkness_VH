  stress_threshold.2331.t:0 "Khủng Hoảng Tinh Thần: Quyền Uy Xa Cách"
  stress_threshold.2331.desc.intro:0 "Dạo gần đây, các [ROOT.Char.Custom('GetCourtierPlural')|l] của ta dường như tránh mặt ta bằng mọi giá. Ta nghe những lời thì thầm rằng "
  stress_threshold.2331.desc.calm:0 "họ cho rằng sự điềm tĩnh của ta thật đáng sợ, không hề có cảm xúc,"
  stress_threshold.2331.desc.brave:0 "lòng dũng cảm của ta bị nhầm lẫn thành khát máu,"
  stress_threshold.2331.desc.ambitious:0 "họ nghĩ ta sẽ làm mọi thứ để đạt được tham vọng của mình, rằng với ta không có gì là thiêng liêng,"
  stress_threshold.2331.desc.just:0 "họ cho rằng ta quá nghiêm khắc, rằng ta bám vào từng chữ của luật pháp thay vì tinh thần của nó,"
  stress_threshold.2331.desc.callous:0 "họ nói ta không có trái tim, rằng ta chẳng quan tâm đến ai ngoài bản thân mình,"
  stress_threshold.2331.desc.stubborn:0 "họ cho rằng ta quá bướng bỉnh, quá cứng nhắc, quá không khoan nhượng,"
  stress_threshold.2331.desc.fallback:0 "họ nghĩ ta quá lạnh lùng, quá xa cách,"
  stress_threshold.2331.desc.rump:0 "nhưng điều đó chỉ có nghĩa là ta cai trị bằng bàn tay vững vàng. Điều đó không có nghĩa ta là quái vật.\n\n... Phải không?"
  stress_threshold.2331.a.reclusive.gain:0 "Ta cũng chẳng muốn nhìn thấy #EMP chúng#!!"
  stress_threshold.2331.a.reclusive.effect:0 "$stress_threshold.2331.a.reclusive.gain$"
  stress_threshold.2331.a.reclusive.opinion_list:0 "Các [THIS.Char.Custom('GetCourtierPlural')|l] của Ngài bị buộc phải tránh xa"
