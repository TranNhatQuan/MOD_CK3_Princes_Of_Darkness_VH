  stress_threshold.2321.t:0 "Khủng Hoảng Tinh Thần: Bối Rối Vì [ROOT.Char.Custom('GetCourt')|U]"
  stress_threshold.2321.desc.intro:0 "Bất cứ việc gì ta làm, người ta cũng lợi dụng!"
  stress_threshold.2321.desc.impatient:0 "Cuộc đời ta là một chuỗi dài những lời giải thích lê thê mà ta chẳng có thời gian để nghe!"
  stress_threshold.2321.desc.honest:0 "[ROOT.Char.Custom('GetCourt')|l] của ta nói dối ngay trước mặt ta, suốt ngày, mỗi ngày, từ thường dân tới quý tộc!"
  stress_threshold.2321.desc.trusting:0 "$stress_threshold.2321.desc.honest$"
  stress_threshold.2321.desc.compassionate:0 "[ROOT.Char.Custom('GetCourtier')|l] của ta luôn lợi dụng lòng trắc ẩn của ta, háo hức khai thác từng giọt đồng cảm cuối cùng!"
  stress_threshold.2321.desc.forgiving:0 "Lòng khoan dung của ta bị thử thách mỗi ngày, đôi khi hai lần một ngày, bởi cả một đội quân vô ơn hôi hám!"
  stress_threshold.2321.desc.fallback:0 "[ROOT.Char.Custom('GetCourt')|l] của ta đầy rẫy ký sinh trùng! Ma cà rồng! Đỉa!"
  stress_threshold.2321.desc.rump:0 "Nó khiến máu ta sôi lên!\n\nTa không thể chịu đựng thêm nữa! Nếu ta không làm gì đó, ta sẽ gào lên mất!"
  stress_threshold.2321.a.irritable.gain:0 "Và có lẽ ta sẽ gào lên thật!"
  stress_threshold.2321.a.irritable.effect:0 "$stress_threshold.2321.a.irritable.gain$"
