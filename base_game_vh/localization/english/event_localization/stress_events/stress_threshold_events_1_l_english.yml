  stress_threshold.2301.f:0 "Ta ghét cảm giác này."

  stress_threshold.2311.t:0 "Khủng Hoảng Tinh Thần: Bị Quá Khứ Ám Ảnh"
  stress_threshold.2311.desc.intro:0 "Ta ngồi một mình trầm ngâm, trái tim nặng trĩu bởi ký ức, suy ngẫm về những việc ta đã làm từ nhiều năm trước."
  stress_threshold.2311.desc.generous:0 "Ta thực sự là một [ROOT.GetCharacter.GetTitleAsNameNoTooltip] hào phóng sao? Ta có thật sự giúp đỡ mọi người không?"
  stress_threshold.2311.desc.diligent:0 "Khi đó ta đã làm việc đủ chăm chỉ chưa? Công sức của ta đã ngăn chặn rắc rối, hay gây ra chúng?"
  stress_threshold.2311.desc.wrathful:0 "Ta đã bao nhiêu lần nổi cơn thịnh nộ? Cơn giận của ta đã được sử dụng đúng chỗ, hay chỉ là sai lầm?"
  stress_threshold.2311.desc.patient:0 "Ta có quá thận trọng không? Sự kiên nhẫn của ta có khác gì sự do dự được tô vẽ đẹp đẽ?"
  stress_threshold.2311.desc.arrogant:0 "Chính niềm kiêu hãnh đã đưa ta đến đây sao? Liệu một cú ngã tương xứng đang chờ đợi để hủy diệt ta?"
  stress_threshold.2311.desc.humble:0 "Ta có thực sự đủ tốt không? Liệu một [ROOT.GetCharacter.GetTitleAsNameNoTooltip] khác có phù hợp hơn không?"
  stress_threshold.2311.desc.deceitful:0 "Ta có bị mắc kẹt trong chính những lời dối trá của mình không? Ta tưởng mình khôn ngoan, nhưng có lẽ sự lừa dối đang bắt kịp ta ngay lúc này?"
  stress_threshold.2311.desc.zealous:0 "Ta thực sự có được ánh mắt của [ROOT.GetCharacter.GetFaith.HighGodNamePossessive] dõi theo sao? Đức tin của ta là ngọn đuốc trong bóng tối, hay là giàn thiêu cho chính sai lầm của ta?"
  stress_threshold.2311.desc.fallback:0 "Ta đúng hay sai?"
  stress_threshold.2311.desc.rump:0 "Ta đã từng thực sự làm điều đúng đắn chưa?\n\nĐầu ta nhức nhối. Tại sao [ROOT.GetCharacter.GetFaith.HighGodName] lại đặt ta lên con đường này nếu [ROOT.GetCharacter.GetFaith.HighGodNameSheHe] biết nó sẽ khiến ta khốn khổ như vậy?"
  stress_threshold.2311.a.rakish.gain:0 "$stress_threshold.1701.a.rakish.gain$"
  stress_threshold.2311.a.rakish.effect:0 "$stress_threshold.1701.a.rakish.gain$"
