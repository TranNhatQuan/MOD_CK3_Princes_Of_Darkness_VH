l_english:
  stress_threshold_cooldown_message:1 "Nếu Ngài vẫn còn [stressed|E] sau [SCOPE.ScriptValue('stress_threshold_cooldown_duration_in_years')|V0] năm, Ngài có thể phải chịu thêm một lần [mental_break|E] nữa."

 # System Messages
  stress_threshold.0010.toast:2 "Bị Áp Lực Đè Nặng"
  stress_threshold.0010.text:0 "Ngài đã tăng một [stress_level|E]"
  stress_threshold.0400.toast:2 "Ngài đã vượt quá giới hạn [stress|E] và được đặt lại về [stress_level|E] 3"

 # Level 1 Stress Events
  stress_threshold.1001.t:0 "Khủng Hoảng Tâm Lý: Những Suy Nghĩ Đen Tối"
  stress_threshold.1001.desc:0 "Gần đây Ta bị dày vò bởi cảm giác tội lỗi và xấu hổ. Mọi tội lỗi, khuyết điểm và thất bại của Ta... những suy nghĩ đen tối ấy khiến Ta sao nhãng trách nhiệm và làm Ta mất ngủ suốt đêm.\n\nTa cảm thấy mình phải làm gì đó để chấm dứt nỗi đau tinh thần này, nhưng điều gì có thể giúp được?"
  stress_threshold.1001.contrite.gain:0 "Ta phải thú nhận mọi sai lầm của mình!"
  stress_threshold.1001.contrite.effect:0 "Ta không thể giấu kín những bí mật này nữa!"
  stress_threshold.1001.flagellant.gain:0 "Những nhát roi sẽ thanh tẩy tội lỗi của Ta."
  stress_threshold.1001.flagellant.effect:0 "Ta đáng bị trừng phạt! Vì tất cả mọi thứ!"
  stress_threshold.1001.improvident.gain:0 "Quyên góp cho từ thiện sẽ chuộc lại lỗi lầm của Ta."
  stress_threshold.1001.improvident.effect:0 "Người khác cần vàng của Ta hơn Ta!"
  stress_threshold.1001.drunkard.gain:0 "Có lẽ vài ly rượu sẽ giúp?"
  stress_threshold.1001.drunkard.effect:0 "Ta sẽ uống cho đến khi những suy nghĩ này biến mất."
  stress_threshold.1001.hashishiyah.gain:0 "Một chút hashish sẽ làm đầu óc Ta nhẹ nhõm..."
  stress_threshold.1001.hashishiyah.effect:1 "Một đêm thư giãn với khay bánh hashish sẽ giúp ích."
  stress_threshold.1001.journaller.gain:0 "Viết ra nỗi lo sẽ giúp Ta tập trung."
  stress_threshold.1001.journaller.effect:0 "Ta cần một đêm một mình trong phòng làm việc."
  stress_threshold.1001.endure:0 "Ta phải mạnh mẽ và chống lại những cám dỗ này!"

  stress_threshold.1011.t:0 "Khủng Hoảng Tâm Lý: Ham Muốn Phóng Túng"
  stress_threshold.1011.desc:0 "Dạo gần đây Ta liên tục bị phân tâm bởi những suy nghĩ dâm dục và những tưởng tượng nhục dục. Với tất cả khó khăn của cuộc sống hàng ngày, thật quá dễ để Ta chìm trong mộng tưởng và quên đi thực tại.\n\nNhững ham muốn này rõ ràng đang cản trở cuộc sống của Ta, nhưng Ta nên làm gì với chúng?"
  stress_threshold.1011.rakish.gain:0 "Một chuyến tới nhà thổ sẽ giúp giải tỏa!"
  stress_threshold.1011.rakish.effect:0 "Đêm nay không ai ngoài Ta được vào nhà thổ."
  stress_threshold.1011.rakish.tt:0 "Hành vi phóng túng như vậy luôn tiềm ẩn rủi ro..."
  stress_threshold.1011.reclusive.gain:0 "Ta phải tự cô lập để tránh cám dỗ!"
  stress_threshold.1011.reclusive.effect:0 "Chỉ trong cô độc Ta mới tìm thấy bình yên!"
  stress_threshold.1011.conversion.interfaith:0 "Có lẽ một cách nhìn mới về [new_faith.HighGodName] sẽ giúp Ta?"
  stress_threshold.1011.conversion.intrafaith:0 "Có lẽ [new_faith.HighGodName] có thể giúp Ta nơi mà [ROOT.Char.GetFaith.HighGodName] đã thất bại?"
  stress_threshold.1011.conversion.judaism:0 "Những điều răn cổ xưa sẽ giúp Ta giữ mình trong sạch."
  stress_threshold.1011.conversion.christianity:0 "Jesus, hãy cứu con khỏi những cám dỗ này!"
  stress_threshold.1011.exercise.gain:0 "Có lẽ một cách giải tỏa khác sẽ giúp..."
  stress_threshold.1001.exercise.effect:0 "Một buổi tập luyện tốt sẽ thiêu đốt những ham muốn này."
  stress_threshold.1011.endure:0 "Ta sẽ cắn răng và cố gắng tập trung!"

  stress_threshold.1501.t:0 "Khủng Hoảng Tâm Lý: Không Có Gì Quan Trọng"
  stress_threshold.1501.intro.desc:0 "Mỗi ngày trôi qua Ta càng khó tìm được lý do để kéo mình ra khỏi giường."
  stress_threshold.1501.helper.desc:0 "[scoped_helper.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] đang đợi Ta, nhưng Ta biết lời của [scoped_helper.GetHerHis] sẽ chẳng mang lại sự an ủi nào."
  stress_threshold.1501.nohelper.desc:0 "Sau khi miễn cưỡng rời khỏi giường, Ta chẳng còn hứng thú với những việc tầm thường của [ROOT.Char.Custom('GetCourt')], cũng chẳng thấy vui khi ăn sáng."
  stress_threshold.1501.faith.desc:0 "\n\nNgay cả lời của các [scoped_ruler.GetFaith.AltPriestTermPlural] cũng trở nên rỗng tuếch trong tai Ta."
  stress_threshold.1501.fallback.desc:0 "\n\nNhịp sống đơn điệu này đã trở nên không thể chịu đựng nổi."
  stress_threshold.1501.a:0 "Ta không thể chịu nổi [scoped_helper.GetHerHim] nữa!"
  stress_threshold.1501.b:0 "Có lẽ hôm nay Ta lại bỏ bữa trưa."
  stress_threshold.1501.c:0 "Ta chỉ muốn được ở một mình."
  stress_threshold.1501.d:0 "Ăn làm gì khi mọi thứ đều có vị như tro?"
  stress_threshold.1501.e:0 "Ta không thể để những suy nghĩ đen tối này làm mình sao nhãng."
  stress_threshold.1501.f:0 "Cuộc sống của một [scoped_ruler.GetFaith.GetAdherentName] thật vô nghĩa."

  stress_threshold.1502.t:0 "Khủng Hoảng Tâm Lý: Sự Oán Giận"
  stress_threshold.1502.intro.desc:0 "Tại sao #EMP lúc nào#! Ta cũng phải tự làm mọi thứ? Làm sao Ta có thể quản lý công việc của [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] khi một nửa [ROOT.Char.Custom('GetCourt')|l] của Ta không thể làm theo lệnh, còn nửa kia thì thậm chí không hiểu lệnh đó?"
  stress_threshold.1502.courtier.desc:0 "\n\nĐặc biệt là [scoped_courtier.GetFirstName], gần đây trở nên không thể chịu nổi. Ta gần như không thể nghe nổi những lời lảm nhảm vô tận của [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('scoped_courtier'))]."
  stress_threshold.1502.nocourtier.desc:0 ""
  stress_threshold.1502.a:0 "Ngươi chỉ là một [scoped_courtier.Custom2('InsultAdjective', ROOT.Char)] [scoped_courtier.Custom2('InsultNoun', ROOT.Char)]!"
  stress_threshold.1502.b:0 "Lính canh! Mang cho ta thêm một tù nhân!"
  stress_threshold.1502.c:0 ""Tại sao tất cả các ngươi lại là lũ #EMP ngu ngốc#! như vậy!?""
  stress_threshold.1502.d:0 "Một chuyến thăm [ROOT.Char.Custom('GetDungeon')] sẽ giúp Ta tỉnh táo..."
  stress_threshold.1502.e:0 "Ta chỉ còn cách chịu đựng."
  stress_threshold.1502.f:0 "Có lẽ Ta nên ghi chép lại những bất hạnh của mình?"
  stress_threshold.1502.g:0 "[scoped_ruler.GetFaith.HighGodName], Ta cần một ly rượu!"

  stress_threshold.1503.t:0 "Khủng Hoảng Tâm Lý: Sự Trống Rỗng Bên Trong"
  stress_threshold.1503.desc:0 "Không điều gì Ta làm còn khiến Ta hài lòng nữa. Dù cố gắng đến đâu, Ta cũng không tìm thấy hạnh phúc hay sự bình yên. Như thể có thứ gì đó... đang thiếu.\n\nĐiều gì có thể lấp đầy khoảng trống đang gặm nhấm linh hồn Ta?"
  stress_threshold.1503.a.a:0 "Có lẽ thêm vài viên ngọc nữa?"
  stress_threshold.1503.a.b:0 "Ta cần một chiếc vương miện lớn hơn!"
  stress_threshold.1503.a.c:0 "Ta đã chán quần áo của mình..."
  stress_threshold.1503.a.d:0 "Một con chiến mã hùng mạnh mới!"
  stress_threshold.1503.a.e:0 "Một bức tranh mới từ họa sĩ nổi tiếng!"
  stress_threshold.1503.b:0 "Chỉ có [scoped_ruler.Custom('GetExpensiveMeal')] mới chữa lành nỗi đau này."
  stress_threshold.1503.e:0 "Giá như có điều gì đó Ta có thể làm..."

  stress_threshold.1504.t:0 "Khủng Hoảng Tâm Lý: Lao Lực Không Ngừng"
  stress_threshold.1504.desc:0 "Đôi khi Ta cảm thấy như cả thế giới đang đè nặng lên vai mình. Trách nhiệm của Ta với tư cách [scoped_ruler.GetTitleAsNameNoTooltip] dường như không bao giờ kết thúc...\n\nQuả thực, Ta hầu như không còn chút thời gian nào cho bản thân."
  stress_threshold.1504.a:0 "Không ai có thể để Ta yên một lúc được sao?!"
  stress_threshold.1504.b:0 "Ta cần thứ gì đó để cân bằng lại thể trạng của mình..."
  stress_threshold.1504.e:0 "Dù sao thì đây cũng là nghĩa vụ của Ta."
  stress_threshold.1504.f:0 "Xung quanh Ta toàn là lũ ngốc!"
  stress_threshold.1504.g:0 "Ta sẽ sắp xếp lại suy nghĩ của mình bằng cách viết ra."
  stress_threshold.1504.h:0 "Chuẩn bị ngựa cho ta, ta cần đi cưỡi một vòng!"
  stress_threshold.1504.i:0 "Ta cần một khoảnh khắc yên tĩnh để suy nghĩ."
  stress_threshold.1601.t:0 "Khủng Hoảng Tâm Lý: Suy Nghĩ Quay Cuồng"
  stress_threshold.1601.desc:0 "Ta không thể tập trung, suy nghĩ của Ta cứ quay vòng! Ta phải quản lý [ROOT.Char.Custom('GetCourt')|l], Ta phải kiểm tra quân đội, Ta phải...\n\nLàm sao Ta có thể nghỉ ngơi khi ngay cả suy nghĩ của mình cũng phản bội Ta như thế này?!"
  stress_threshold.1601.profligate.gain:0 "Nếu Ta mua thứ gì đó lấp lánh để tập trung suy nghĩ..."
  stress_threshold.1601.profligate.effect:0 "Ta luôn cảm thấy tập trung hơn sau khi mua thứ gì đó đẹp!"
  stress_threshold.1601.inappetetic.gain:0 "Suy nghĩ về thức ăn chỉ làm phân tâm."
  stress_threshold.1601.inappetetic.effect:0 "Ta sẽ để cơn đói xua tan mọi phân tâm!"
  stress_threshold.1601.comfort_eater.gain:0 "Một cái bụng no có thể giúp Ta tập trung."
  stress_threshold.1601.comfort_eater.effect:0 "Một cái bụng no luôn giúp Ta tập trung hơn."
  stress_threshold.1601.rakish.gain:0 "Có lẽ Ta sẽ tìm thấy sự tập trung trong đam mê..."
  stress_threshold.1601.rakish.effect:0 "Một chuyến đến nhà thổ sẽ giúp Ta tập trung suy nghĩ!"
  stress_threshold.1601.reclusive.gain:0 "Có lẽ Ta sẽ tập trung hơn nếu ở một mình..."
  stress_threshold.1601.reclusive.effect:0 "Ta luôn tập trung hơn khi ở một mình..."
  stress_threshold.1601.irritable.gain:0 "Có lẽ Ta sẽ nghĩ được nếu mọi người #EMP im lặng#!!"
  stress_threshold.1601.irritable.effect:0 "Ta sẽ bảo tất cả mọi người #EMP im lặng#!!"
  stress_threshold.1601.confider.gain:0 ""[friend.GetFirstNameNoTooltip], Bạn ta, hãy giúp Ta sắp xếp lại suy nghĩ!"" 
  stress_threshold.1601.confider.effect:0 ""[friend.GetFirstNameNoTooltip], hãy nghe Ta như Ngài vẫn luôn làm!"" 
  stress_threshold.1601.athletic.gain:0 "Ta nghe nói cơ thể khỏe mạnh sẽ mang lại tâm trí minh mẫn..."
  stress_threshold.1601.athletic.effect:0 "Không lúc nào Ta bình tĩnh hơn sau khi vận động!"
  stress_threshold.1601.contrite.gain:0 "Ta sẽ làm sạch tâm trí bằng cách thú nhận lỗi lầm."
  stress_threshold.1601.contrite.effect:0 "Ta phải thú nhận lỗi lầm của mình! Điều đó sẽ mang lại sự rõ ràng."
  stress_threshold.1601.flagellant.gain:0 "Người ta nói đau đớn sẽ làm đầu óc sắc bén..."
  stress_threshold.1601.flagellant.effect:0 "Không gì giúp tập trung suy nghĩ như đau đớn."
  stress_threshold.1601.improvident.gain:0 "Có lẽ một hành động từ thiện rõ ràng sẽ giải thoát suy nghĩ của Ta?"
  stress_threshold.1601.improvident.effect:0 "Quyên góp cho mục đích tốt luôn làm Ta bình tâm."
  stress_threshold.1601.drunkard.gain:0 "Có lẽ Ta sẽ tập trung hơn sau vài ly rượu..."
  stress_threshold.1601.drunkard.effect:0 "Ta luôn thấy tập trung hơn sau khi uống."
  stress_threshold.1601.hashishiyah.gain:0 "Một chút hashish có lẽ sẽ làm đầu óc Ta dịu lại..."
  stress_threshold.1601.hashishiyah.effect:1 "Không lúc nào Ta bình tĩnh hơn sau một buổi tối với bánh hashish."
  stress_threshold.1601.journaller.gain:0 "Viết ra suy nghĩ của mình có thể mang lại sự rõ ràng..."
  stress_threshold.1601.journaller.effect:0 "Viết ra suy nghĩ luôn giúp Ta sáng tỏ!"
  stress_threshold.1601.burdened.gain:0 "Mơ về một nơi tốt đẹp hơn có thể giúp ích."
  stress_threshold.1601.burdened.effect:0 "Mơ về những điều tốt đẹp luôn giúp Ta!"

  stress_threshold.1601.endure_no_option:0 "T– Ta phải chịu đựng. Không còn cách nào khác..."

  stress_threshold.1602.t:0 "Khủng Hoảng Tâm Lý: Cảm Xúc Hỗn Loạn"
  stress_threshold.1602.desc:0 "Cảm xúc của Ta ngày càng bất ổn theo từng ngày. Niềm vui tột cùng có thể thay thế nỗi buồn sâu sắc chỉ trong chốc lát, và cả Ta lẫn [ROOT.Char.Custom('GetCourt')|l] đều dần mệt mỏi.\n\nGiá như Ta có thể tìm ra cách thuần phục cơn lốc cảm xúc trong lòng!"
  stress_threshold.1602.profligate.gain:0 "Có lẽ thứ gì đó mới mẻ – thứ gì đó lấp lánh – sẽ giúp Ta cân bằng."
  stress_threshold.1602.profligate.effect:0 "Một thứ mới mẻ và lấp lánh sẽ mang lại niềm vui thuần khiết!"
  stress_threshold.1602.inappetetic.gain:0 "Nếu Ta không ăn, Ta sẽ không còn năng lượng để cảm nhận..."
  stress_threshold.1602.inappetetic.effect:0 "Ta sẽ bỏ đói mọi cảm xúc."
  stress_threshold.1602.comfort_eater.gain:0 "Ít nhất thức ăn mang lại cảm giác an ủi rõ ràng."
  stress_threshold.1602.comfort_eater.effect:0 "Khi ăn, Ta chỉ cảm thấy sự an ủi."
  stress_threshold.1602.rakish.gain:0 "Ham muốn mạnh mẽ có thể kìm hãm những cảm xúc khác..."
  stress_threshold.1602.rakish.effect:0 "Không gì giúp Ta ổn định như dục vọng và khao khát!"
  stress_threshold.1602.reclusive.gain:0 "Có lẽ Ta sẽ bình tĩnh hơn nếu ở một mình..."
  stress_threshold.1602.reclusive.effect:0 "Ta luôn sáng suốt hơn khi ở một mình."
  stress_threshold.1602.irritable.gain:0 "Sẽ dễ dàng hơn nếu mọi người #EMP để Ta yên#!!"
  stress_threshold.1602.irritable.effect:0 "Ta sẽ nói cho họ biết Ta nghĩ gì về sự #EMP dè chừng# của họ!!"
  stress_threshold.1602.confider.gain:0 "Nói chuyện với [friend.GetFirstNameNoTooltip] có thể giúp."
  stress_threshold.1602.confider.effect:0 "Nói chuyện với [friend.GetFirstNameNoTooltip] thường giúp Ta!"
  stress_threshold.1602.athletic.gain:0 "Ta sẽ chạy cho đến khi chỉ còn lại cảm giác thỏa mãn."
  stress_threshold.1602.athletic.effect:0 "Một cuộc chạy luôn làm Ta bình tĩnh lại."
  stress_threshold.1602.contrite.gain:0 "Có lẽ Ta sẽ bình tĩnh hơn nếu thú nhận lỗi lầm."
  stress_threshold.1602.contrite.effect:0 "Ta luôn cảm thấy cân bằng hơn sau khi thú nhận!"
  stress_threshold.1602.flagellant.gain:0 "Có lẽ Ta có thể loại bỏ mọi cảm xúc ngoài đau đớn..."
  stress_threshold.1602.flagellant.effect:0 "Ta sẽ chỉ cảm thấy đau đớn, không gì khác."
  stress_threshold.1602.improvident.gain:0 "Sự biết ơn từ việc làm từ thiện có thể lấn át mọi thứ."
  stress_threshold.1602.improvident.effect:0 "Ta luôn cảm thấy ổn định hơn sau khi quyên góp..."
  stress_threshold.1602.journaller.gain:0 "Ta sẽ viết cho đến khi chỉ còn sự tập trung."
  stress_threshold.1602.journaller.effect:0 "Viết về cảm xúc của mình luôn hiệu quả!"
  stress_threshold.1602.drunkard.gain:0 "Với đủ rượu, mọi cảm xúc sẽ tan biến..."
  stress_threshold.1602.drunkard.effect:0 "Ta luôn có thể bỏ lại cảm xúc phía sau bằng cách uống!"
  stress_threshold.1602.hashishiyah.gain:0 "Có lẽ một chút hashish sẽ mang lại sự bình tĩnh."
  stress_threshold.1602.hashishiyah.effect:0 "Hashish luôn giúp Ta cân bằng."
  stress_threshold.1602.burdened.gain:0 "Giá như Ta có thể nghĩ về điều gì đó, #EMP bất cứ thứ gì#! khác."
  stress_threshold.1602.burdened.effect:0 "Nếu để suy nghĩ lang thang, sự lo lắng của Ta sẽ giảm bớt."

 # Level 2 Stress Events
  stress_threshold.2001.t:0 "Khủng Hoảng Tâm Lý: Sự Vô Ơn"
  stress_threshold.2001.desc:0 "Lũ vô ơn! Chúng không biết những hy sinh Ta đã làm vì chúng sao?\n\nMỗi ngày Ta lao lực không ngừng vì lợi ích của [ROOT.Char.Custom('GetRealmOrDomicile')|l], vậy mà tất cả những gì mọi người làm chỉ là phàn nàn và đòi hỏi thêm!\n\nGiờ thì [victim.GetFirstName] còn dám chất vấn mệnh lệnh của Ta nữa!?"
  stress_threshold.2001.arbitrary.gain:0 "Ta là [ROOT.Char.GetTitleAsNameNoTooltip], lời ta là luật!"
  stress_threshold.2001.arbitrary.effect:0 "Ta quyết định mọi thứ ở đây!"
  stress_threshold.2001.imprison_victim:0 "Xem thử [victim.GetFirstNameNoTooltip] còn biết ơn thế nào khi ở trong [ROOT.Char.Custom('GetDungeon')]!"
  stress_threshold.2001.endure:0 "Thôi nào, hãy kiên nhẫn với họ..."

  stress_threshold.2101.t:0 "Khủng Hoảng Tâm Lý: Không Được Chào Đón"
  stress_threshold.2101.desc:0 "Đôi khi Ta cảm thấy mình như một kẻ xa lạ trong chính [ROOT.Char.Custom('GetCourt')|l] của mình.\n\nTa không thể không nhận ra những ánh nhìn lạ lẫm mà [ROOT.Char.Custom('GetCourtierPlural')|l] dành cho Ta, sự bất an tràn ngập bất kỳ [ROOT.Char.Custom('GetRoom')|l] nào Ta bước vào... chuyện gì đã xảy ra với cuộc đời Ta? Tại sao Ta lại không được chào đón giữa chính những người của mình?"
  stress_threshold.2101.witch.gain:0 "Ta là kẻ bị ruồng bỏ, giống như [ROOT.Char.GetFaith.WitchGodName]."
  stress_threshold.2101.witch.effect:0 "Ít nhất ta biết [ROOT.Char.GetFaith.WitchGodName] hiểu ta."
  stress_threshold.2101.drunkard.effect:0 "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U] có lẽ là người Ngài thật sự duy nhất của ta."
  stress_threshold.2101.hashishiyah.effect:1 "Ít nhất chiếc bánh phủ hashish này sẽ không phán xét ta."
  stress_threshold.2101.endure:0 "Có lẽ tất cả chỉ là do Ta tưởng tượng..."

  stress_threshold.2201.t:0 "Khủng Hoảng Tâm Lý: Cơn Giận Sôi Sục"
  stress_threshold.2201.desc.insult_adventurer:0 ""Ngươi có thể là [ROOT.Char.Custom('GetCourtier')] của ta, [character_to_yell_at.GetFirstName], nhưng ngươi cũng chỉ là [character_to_yell_at.Custom2('InsultAdjectiveArticle', ROOT.Char)] [character_to_yell_at.Custom2('InsultNoun', ROOT.Char)]!"\n\n"
  stress_threshold.2201.desc.insult:0 ""Ngươi có thể là một [character_to_yell_at.GetTitleAsName], [character_to_yell_at.GetFirstName], nhưng ngươi cũng chỉ là [character_to_yell_at.Custom2('InsultAdjectiveArticle', ROOT.Char)] [character_to_yell_at.Custom2('InsultNoun', ROOT.Char)]!"\n\n"
  stress_threshold.2201.desc:0 "Ta chần chừ ngay khi thấy vẻ mặt của [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('character_to_yell_at'))], nhưng... Ta chỉ cảm thấy #EMP tức giận#! suốt thời gian qua, và mọi người dường như đều khiêu khích cơn thịnh nộ của Ta–\n\n"
  stress_threshold.2201.desc_liege:0 ""Ngươi bị sao vậy, [ROOT.Char.GetTitledFirstNameNoTooltip]?! Hành vi này thật không thể chấp nhận."
  stress_threshold.2201.desc_vassal:0 ""Thưa lãnh chúa, hành vi này có ý nghĩa gì vậy?!"
  stress_threshold.2201.desc.calm:0 " Mà bình thường ngươi lại rất điềm tĩnh..."" 
  stress_threshold.2201.desc.ending:0 """
  stress_threshold.2201.a:0 "Ngươi nghe rõ ta nói rồi đấy!"
  stress_threshold.2201.save:0 "Nói xem, ngươi sẽ phản ứng thế nào trước một sự xúc phạm như vậy?"
  stress_threshold.2201.save_tt:0 "Ta giả vờ như mình chỉ đang thử phản ứng của [character_to_yell_at.GetHerHim]"
  stress_threshold.2201.liege:0 "Xin lỗi, thưa lãnh chúa. Ta sẽ kiềm chế bản thân tốt hơn."
  stress_threshold.2201.c:0 "Xin lỗi. Ta sẽ kiềm chế bản thân tốt hơn."

  stress_threshold.2202.t:0 "Cơn Giận Sôi Sục"
  stress_threshold.2202.desc.liege:0 "Cơn giận vô cớ mà lãnh chúa của Ta, [stress_character.GetTitledFirstName], thể hiện khiến Ta hoàn toàn bất ngờ."
  stress_threshold.2202.desc.vassal:0 "Cơn giận vô cớ mà chư hầu của Ta, [stress_character.GetTitledFirstName], thể hiện khiến Ta hoàn toàn bất ngờ."
  stress_threshold.2202.desc.other_relationship:0 "Cơn giận vô cớ mà [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('stress_character'))] của Ta, [stress_character.GetTitledFirstName], thể hiện khiến Ta hoàn toàn bất ngờ."
  stress_threshold.2202.desc:0 "[stress_character.GetSheHe|U] gần đây chịu rất nhiều căng thẳng, nhưng"
  stress_threshold.2202.desc.rival:0 "khi được yêu cầu giải thích về hành vi của [stress_character.GetHerselfHimself], [stress_character.GetSheHe] chỉ càng buông thêm những lời lăng mạ thậm tệ hơn."
  stress_threshold.2202.desc.other:0 "hành xử như vậy..."
  stress_threshold.2202.a:0 "Ta sẽ hoàn trả sòng phẳng những gì ta đã nhận, tên [stress_character.Custom2('InsultNoun', ROOT.Char)] kia!"
  stress_threshold.2202.b:0 "Ngay cả [stress_character.GetSheHe] cũng phải vật lộn... điều đó làm Ta bình tâm hơn."

 # Level 3 Stress Events
  stress_threshold.3001.t:0 "Khủng Hoảng Tâm Lý: Những Tiếng Nói"
  stress_threshold.3001.desc:0 "Trong khi [ROOT.Char.Custom('GetCourt')|l] của Ta chỉ đầy rẫy dối trá và giả tạo, Ta đã tìm thấy những kẻ tự xưng sẵn sàng nói cho Ta sự thật.\n\nChúng sống cùng Ta.\n\nTrong đầu Ta.\n\nChúng nói rằng chúng biết sự thật...\n\nChúng thật sự biết sao?"
  stress_threshold.3001.possessed.gain:0 "Đúng vậy, chỉ những giọng nói ấy mới biết sự thật!"
  stress_threshold.3001.possessed.effect:0 "Đúng, đúng, chúng biết sự thật, sự thật thực sự..."
  stress_threshold.3001.naked_run:0 "Ta phải trừ tà bằng cách chạy trần truồng!"
  stress_threshold.3001.endure:0 "Chỉ cần... đừng nghe chúng..."

  stress_threshold.3101.t:0 "Khủng Hoảng Tâm Lý: Sai Trái"
  stress_threshold.3101.desc:0 "Mọi thứ đều... sai. [ROOT.Char.Custom('GetRoom')|l] này sai. Mặt đất sai. Ngay cả không khí cũng sai!\n\nTại sao mọi thứ lại sai? Ai đã làm điều này?\n\nAi đã khiến mọi thứ trở nên #EMP sai trái#!?!"
  stress_threshold.3101.kill_victim:0 "Tất cả là lỗi của [victim.GetFirstNamePossessiveNoTooltip], Ta biết mà!"
  stress_threshold.3101.lunatic.gain:0 "Lũ [ROOT.Char.Custom('GetRandomRegionalSmallGamePlural')]... lũ khốn xảo quyệt đó đã làm!"
  stress_threshold.3101.lunatic.effect:0 "Lũ [ROOT.Char.Custom('GetRandomRegionalSmallGamePlural')] xảo quyệt quay lại rồi!"
  stress_threshold.3101.lunatic.tt:0 "#F Mang cho ta một cây đuốc!#!"

  stress_threshold.3201.t:0 "Khủng Hoảng Tâm Lý: Quá Tải"
  stress_threshold.3201.desc:0 "Mọi thứ đã quá sức chịu đựng rồi, tại sao ta lại phải cố gắng đến thế này làm gì cơ chứ?\n\nChúng ta đang ở giữa một bữa tối thì mọi thứ cứ thế mà... đổ bể. Ta phải rà soát ngân khố của [ROOT.Char.Custom('GetCourt')|l], ta phải giải quyết hàng tá tranh chấp vặt vãnh, ta phải–\n\n"Ngài vẫn ổn chứ, thưa [ROOT.Char.GetTitleAsNameNoTooltip] của thần?" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))] của ta, [vassal.GetTitledFirstName], thận trọng bày tỏ sự lo ngại của [vassal.GetHerHis]."
  stress_threshold.3201.depressed.gain:0 "Có quan trọng gì đâu? Ta bỏ cuộc."
  stress_threshold.3201.depressed.effect:0 "Dù sao tất cả cũng vô nghĩa..."
  stress_threshold.3201.help:0 ""[vassal.GetFirstNameNoTooltip]... Xin hãy giúp ta.""
  stress_threshold.3201.wrathful.gain:0 ""Không, đồ [vassal.Custom2('InsultAdjective', ROOT.Char)] [vassal.Custom2('InsultNoun', ROOT.Char)], ta #EMP không#! ổn!"" 
  stress_threshold.3201.wrathful.effect:0 ""Ta sẽ cho ngươi biết ai mới là #EMP ổn#!, đồ [vassal.Custom2('InsultAdjective', ROOT.Char)] [vassal.Custom2('InsultNoun', ROOT.Char)]!"" 
  stress_threshold.3201.wrathful.effect.success:0 "Ngài đánh [vassal.GetTitledFirstName]"
  stress_threshold.3201.wrathful.effect.failure:0 "[vassal.GetTitledFirstName] chống trả Ngài"

  stress_threshold.3301.t:0 "Khủng Hoảng Tâm Lý: Trái Tim Đau Đớn"
  stress_threshold.3301.desc_man:0 "Dấu hiệu đầu tiên cho thấy có điều gì đó không ổn là cơn đau nhói ở ngực. Ta loạng choạng tìm chỗ dựa khi cơn đau lan xuống cánh tay trái. Đầu Ta quay cuồng...\n\nTa... Ta không có thời gian cho chuyện này! Ta còn việc phải làm!\n\nKhi cố bước thêm một bước, Ta gục xuống đất. Ta mở miệng kêu cứu, nhưng thứ duy nhất thoát ra chỉ là tiếng rên nghẹn.\n\nCơn đau trong ngực ngày càng tăng, và tăng, và— bóng tối che phủ tầm nhìn của Ta, và Ta có thể #EMP cảm thấy#! tim mình chệch nhịp."
  stress_threshold.3301.desc_woman:0 "Dấu hiệu đầu tiên cho thấy có điều gì đó không ổn là cơn ợ nóng không chịu biến mất. Ta thử mọi cách chữa trị – đặt len mềm lên bụng, đi dạo nhẹ nhàng...\n\nĐột nhiên Ta không thể hít sâu được và phải bám vào thứ gì đó để đứng vững. Chuyện gì— chuyện gì đang xảy ra vậy?! Ta cố kêu cứu, nhưng chỉ bật ra được một tiếng thở đau đớn.\n\nThật #EMP đau#!! Một cơn đau nhói lan từ giữa hai bả vai xuống cánh tay trái, và khi cơn đau tăng lên Ta gục xuống đất.\n\nBóng tối nhanh chóng kéo đến."
  stress_threshold.3301.a:0 "#EMP #DIE1 Ugh...!#!#!"
