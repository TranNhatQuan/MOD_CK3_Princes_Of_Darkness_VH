l_english:
  stress_threshold_special.1001.t:0 "Khủng Hoảng Tâm Lý: Nỗi Đau Tuôn Trào"
  stress_threshold_special.1001.desc_intro_standard:0 "Cuộc sống chưa bao giờ dễ dàng, nhưng có vẻ như mất đi [ROOT.Char.Custom2('RelationToMeShort', deceased_character)] [deceased_character.GetFirstName] đã đẩy Ta đến bờ vực.\n\n"
  stress_threshold_special.1001.desc_intro_lover:0 "Một ánh sáng trong đời Ta đã tắt.\n\nVới [deceased_character.Custom('LoverPetName')] [deceased_character.GetFirstName] ra đi, cuộc sống bỗng trở nên u ám hơn nhiều."
  stress_threshold_special.1001.desc_intro_friend:0 "Bạn ta [deceased_character.GetFirstName] luôn ở bên Ta. Ta không nghĩ cái chết của [deceased_character.GetHerHis] sẽ dễ dàng, nhưng cũng không bao giờ tưởng tượng nó khó khăn đến thế."
  stress_threshold_special.1001.desc_spouse:0 "[deceased_character.GetSheHe|U] là Ngài đời của Ta, đã cùng Ta vượt qua bao thử thách. Dù có lúc bất đồng, nhưng đối mặt với đời sống mà không có [deceased_character.GetHerHim] thật sự… đáng sợ.\n\nLàm sao Ta sống tiếp mà không có [deceased_character.GetHerHim]?"
  stress_threshold_special.1001.desc_child_toddler:0 "Còn quá trẻ, tràn đầy sức sống và tiềm năng. Giờ đây, hoàn toàn bất động...\n\nBất động vĩnh viễn. Không còn cười, không còn khóc."
  stress_threshold_special.1001.desc_child_older:0 "Ta vẫn nhớ [deceased_character.GetHerHim] khi còn là trẻ sơ sinh. Nhỏ bé, mong manh. Mặc dù vậy, [deceased_character.GetSheHe] đã sống sót, lớn lên, trưởng thành cho đến… giờ. Khi [deceased_character.GetSheHe] bỗng dưng ra đi.\n\nTa đã ấp ủ bao hy vọng cho tương lai của [deceased_character.GetHerHis]… Bao điều Ta muốn chứng kiến giờ sẽ không bao giờ xảy ra."
  stress_threshold_special.1001.desc_parent:0 "Dù Ta biết điều này sẽ đến sớm muộn, Ta vẫn hoàn toàn không chuẩn bị cho cái chết của [ROOT.Char.Custom2('RelationToMe', deceased_character)].\n\nĐột nhiên Ta không thể tìm [deceased_character.GetHerHim] để được an ủi hay xin lời khuyên.\n\nChỉ còn khoảng trống nơi họ từng ở… Liệu nó có thể được lấp đầy không?"
  stress_threshold_special.1001.desc_lover:1 "Mỗi ngày đều là một trận chiến, nơi Ta vật lộn để tìm ý nghĩa trong sự vắng mặt của [deceased_character.GetHerHis]. Ta không ngừng nghĩ về những khoảnh khắc tuyệt vời chúng Ta đã có cùng nhau...\n\nGiờ thì không bao giờ còn nữa."
  stress_threshold_special.1001.desc_friend:0 "\n\n[deceased_character.GetSheHe|U] luôn sẵn sàng giúp Ta vui lên hoặc thoát khỏi khó khăn. Trong tất cả rắc rối gần đây, sự vắng mặt của [deceased_character.GetHerHis] càng trở nên đáng kể."
  stress_threshold_special.1001.depressed:0 "Liệu cuộc sống không có [deceased_character.GetHerHim] còn đáng sống không?"
  stress_threshold_special.1001.drunkard:0 "Một ly để nhớ [deceased_character.GetHerHim]… và một ly để quên."
  stress_threshold_special.1001.hashishiyah:0 "Nỗi đau này quá tươi. Ta cần thứ gì đó để làm tê liệt nó…"
  stress_threshold_special.1001.flagellant:0 "Tất cả cũng là lỗi của Ta. Ta xứng đáng chịu đau vì điều này…"
  stress_threshold_special.1001.inappetetic.trait:0 "Ăn để làm gì khi trái tim Ta đang trống rỗng?"
  stress_threshold_special.1001.inappetetic.effect:0 "Trái tim Ta trống rỗng như dạ dày."
  stress_threshold_special.1001.journaller:0 "Có lẽ viết ra cảm xúc sẽ giúp Ta xử lý nỗi đau?"
  stress_threshold_special.1001.confider.shared:1 "Thật khó, nhưng ít nhất [confidant.GetFirstNameNoTooltip] và Ta có thể cùng nhau vượt qua nỗi đau."
  stress_threshold_special.1001.confider.assist:1 "Thật khó, nhưng [confidant.GetFirstNameNoTooltip] có thể giúp Ta vượt qua điều này."
  stress_threshold_special.1001.frozen_grief:0 "Ta phải tiếp tục. Đó là điều [deceased_character.GetSheHe] muốn."
  stress_threshold_special.1001.lunatic:0 "Nhưng [deceased_character.GetSheHe] không hề rời đi! [deceased_character.GetSheHe|U] vẫn ở đây với Ta..."
  stress_threshold_special.1001.lunatic.flavor:0 "...và [deceased_character.GetSheHe] sẽ luôn ở bên Ta, mãi mãi!"

  stress_threshold_special.2001.t:0 "Khủng Hoảng Tâm Lý: Khao Khát Bị Kìm Nén"
  stress_threshold_special.2001.beginning:0 "Ôi, Ta nhớ những ngày ăn chơi sa đọa và dục vọng trước đây. Lâu rồi Ta không gần gũi ai… và nỗi đau khi ngủ một mình thật nhói lòng.\n\n"
  stress_threshold_special.2001.consort:0 "Ta biết [ROOT.Char.Custom2('RelationToMe', target)] [target.GetFirstName] sẽ chào đón Ta trở lại giường [target.GetHerHis] với vòng tay rộng mở. [target.GetSheHe|U] muốn Ta, Ta biết… ôi, Ta thèm [target.GetHerHim] quá!"
  stress_threshold_special.2001.noble:0 "Ta thấy cách [target.Custom2('MyCharacterIntroduction', ROOT.Char)] nhìn Ta. [target.GetSheHe|U] muốn Ta, Ta biết… ôi, Ta thèm [target.GetHerHim] quá!"
  stress_threshold_special.2001.servant:0 "Dù [target.GetSheHe] chỉ là Bạn Bè thấp hèn, Ta thấy cách [target.GetFirstName] nhìn Ta. [target.GetSheHe|U] muốn Ta, Ta biết… ôi, Ta thèm [target.GetHerHim] quá!"
  stress_threshold_special.2001.ending:0 "\n\nKhi Ta thề hứa, Ta nghĩ mình có thể chịu được kiêng khem, nhưng giờ… Ta không chắc nữa."
  stress_threshold_special.2001.a:0 "Quên đi. Ta không thể cưỡng lại nữa, Ta #EMP cần#! điều này!"
  stress_threshold_special.2001.a.tt:0 "Ngài mất [perk|E] [GetPerk( 'restraint_perk' ).GetName( GetPlayer)|V]"
  stress_threshold_special.2001.b:0 "Không… Đó không còn là Ta nữa. Ta phải kiềm chế những khao khát này!"

