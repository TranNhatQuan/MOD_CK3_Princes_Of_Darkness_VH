  # I Ching Divination Events (0020/0021)
  chinese_students.0020.t: "Tham Vấn Đạo"
  chinese_students.0020.desc: "Sư phụ của ta là [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))] [mentor.GetTitledFirstName] trải những cọng cỏ thi cổ xưa trước mặt chúng ta, bề mặt phong hóa của chúng hắt lên ánh nến chập chờn. "Lời sấm truyền chứa đựng tri thức vô tận, hỡi đệ tử trẻ," [mentor.GetSheHe] trầm giọng đầy kính cẩn. "Nhưng nó chỉ nói với những ai tiếp cận bằng cả kỹ năng lẫn sự chân thành. Ngươi đọc được điều gì từ chúng?"\n\nNhững quẻ Kinh Dịch của "

  chinese_students.0020.desc.heaven: "[Glossary('Heaven','I_CHING_HEAVEN_GLOSS')]"
  chinese_students.0020.desc.thunder: "[Glossary('Thunder','I_CHING_THUNDER_GLOSS')]"
  chinese_students.0020.desc.water: "[Glossary('Water','I_CHING_WATER_GLOSS')]"
  chinese_students.0020.desc.mountain: "[Glossary('Mountain','I_CHING_MOUNTAIN_GLOSS')]"
  chinese_students.0020.desc.wind: "[Glossary('Wind','I_CHING_WIND_GLOSS')]"

  comma_space: "-"
  comma_space_and: "-"

  chinese_students.0020.desc.conclusion: "hiện ra rõ ràng trước mắt ta khi [mentor.GetSheHe] nói. Ta cảm thấy chúng đang kiên nhẫn chờ ta hé lộ những quy luật vũ trụ dẫn dắt thế gian."

  chinese_students.0020.a.strength: "Trời luôn chỉ đường cho ta!"
  chinese_students.0020.a.weakness: "Có lẽ hôm nay những bí ẩn của Trời sẽ không lẩn tránh ta..."
  chinese_students.0020.b.strength: "Sấm là lĩnh vực của ta!"
  chinese_students.0020.b.weakness: "Có lẽ đây là khoảnh khắc ta nắm bắt sức mạnh của Sấm..."
  chinese_students.0020.c.strength: "Nước phản chiếu sự hiểu biết của ta một cách hoàn hảo!"
  chinese_students.0020.c.weakness: "Trí tuệ của Nước khó nắm bắt như chính bản chất của nó..."
  chinese_students.0020.d.strength: "Ta đã nhiều lần chinh phục Núi!"
  chinese_students.0020.d.weakness: "Núi hiện lên nặng nề trong tâm trí ta..."
  chinese_students.0020.e.strength: "Gió là điều ta đã quen thuộc!"
  chinese_students.0020.e.weakness: "Sự tinh tế của Gió khiến ta bối rối..."

  I_CHING_HEAVEN_GLOSS: "Quẻ Trời tượng trưng cho trật tự thiêng liêng, sự cai trị và lãnh đạo. Nó thể hiện nguyên lý của quyền uy và cấu trúc, dẫn dắt những ai tìm cách cai trị bằng trí tuệ và đức hạnh."
  I_CHING_THUNDER_GLOSS: "Quẻ Sấm tượng trưng cho quyền lực, uy quyền và khả năng áp đặt ý chí của mình. Nó dạy tầm quan trọng của sức mạnh và sự quyết đoán trước nghịch cảnh."
  I_CHING_WATER_GLOSS: "Quẻ Nước tượng trưng cho sự thích nghi, dòng chảy và khả năng vượt qua thử thách của cuộc đời. Nó dạy tầm quan trọng của sự linh hoạt và kiên cường trước nghịch cảnh."
  I_CHING_MOUNTAIN_GLOSS: "Quẻ Núi tượng trưng cho sự ổn định, sức mạnh và khả năng chịu đựng gian khó. Nó dạy tầm quan trọng của sự kiên trì và nghị lực trước nghịch cảnh."
  I_CHING_WIND_GLOSS: "Quẻ Gió tượng trưng cho sự thay đổi, linh hoạt và khả năng thích nghi với hoàn cảnh mới. Nó dạy tầm quan trọng của khả năng thích nghi và bền bỉ trước nghịch cảnh."

  chinese_students.0020.tt: "#weak Việc bói toán này sẽ được đánh giá...#!"
  
  chinese_students.0020.heaven.success.tt: "Ta có thể nhận được [GetModifier('heaven_divination_insight_modifier').GetNameWithTooltip]"
  chinese_students.0020.thunder.success.tt: "Ta có thể nhận được [GetModifier('thunder_divination_insight_modifier').GetNameWithTooltip]"
  chinese_students.0020.water.success.tt: "Ta có thể nhận được [GetModifier('water_divination_insight_modifier').GetNameWithTooltip]"
  chinese_students.0020.mountain.success.tt: "Ta có thể nhận được [GetModifier('mountain_divination_insight_modifier').GetNameWithTooltip]"
  chinese_students.0020.wind.success.tt: "Ta có thể nhận được [GetModifier('wind_divination_insight_modifier').GetNameWithTooltip]"

  chinese_students.0020.failure.tt: "Ta có thể thu được kinh nghiệm quý giá"

  chinese_students.0020.success: "Sự thấu hiểu bói toán sâu sắc"
  chinese_students.0020.failure: "Diễn giải sai lệch"

  # Event 0021 - Mentor's Evaluation
  chinese_students.0021.t: "Phán Quyết Của Lời Sấm"
  chinese_students.0021.desc: "[ROOT.Char.Custom2('RelationToMe',SCOPE.sC('divination_student'))] của ta là [divination_student.GetShortUIName] bước ra khỏi phòng bói toán, tâm trí quay cuồng trước những khải thị của Kinh Dịch.\n\n\"[divination_student.Custom2('RelationToMe',ROOT.Char)|U], điều đã được hiển lộ cho ta là"

  chinese_students.0021.desc.heaven.success: "sáu hào liền biểu lộ sức sáng tạo thuần khiết của quẻ Càn. Như Trời bao trùm vạn vật bên dưới, người trị vì cũng phải thể hiện sức mạnh được điều hòa bởi trí tuệ.\""
  chinese_students.0021.desc.heaven.failure: "sáu hào liền nghĩa là quyền lực vô hạn! Hoàng đế nên cai trị bằng nắm đấm sắt, nghiền nát mọi chống đối như Trời nghiền nát kẻ dám chống lại nó!\""
  chinese_students.0021.desc.thunder.success: "hành động quyết đoán đúng lúc sẽ mang lại thành công, theo quẻ Chấn. Như tiếng sấm đánh thức sinh mệnh ngủ yên mùa xuân, lãnh đạo chân chính truyền cảm hứng cho người khác hành động.\""
  chinese_students.0021.desc.thunder.failure: "như sấm đánh nhanh và vang dội, chúng ta cũng phải khiến mọi người run sợ! Do dự là yếu đuối, và lời sấm đòi hỏi sức mạnh ngay lập tức!\""
  chinese_students.0021.desc.water.success: "như nước chảy quanh chướng ngại, quẻ Khảm dạy rằng trí tuệ thật sự nằm ở việc nhận ra nguy hiểm và tìm con đường ít kháng cự nhất.\""
  chinese_students.0021.desc.water.failure: "như nước phá hủy mọi thứ trên đường đi, chúng ta nên nhấn chìm kẻ thù như cơn lũ, dìm chết mọi sự kháng cự!\""
  chinese_students.0021.desc.mountain.success: "tĩnh lặng mang lại minh triết. Khi giữ tâm trí yên tĩnh và thân thể nghỉ ngơi, quẻ Cấn hé lộ con đường phía trước mà không bị xao lãng.\""
  chinese_students.0021.desc.mountain.failure: "núi nghiền nát những kẻ bên dưới! Chúng ta cũng phải bất động và cố chấp, không bao giờ nhượng bộ dù chuyện gì xảy ra!\""
  chinese_students.0021.desc.wind.success: "sự kiên trì nhẹ nhàng vượt qua sức mạnh cứng nhắc. Như gió định hình cảnh quan theo thời gian, ảnh hưởng tinh tế của quẻ Tốn đạt được điều mà vũ lực không thể.\""
  chinese_students.0021.desc.wind.failure: "như cơn bão, ta có thể dập tắt đối lập bằng cách nói nhiều hơn và lớn hơn! Để thắng các cuộc tranh luận về tương lai của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip], chúng ta phải là người nói mạnh mẽ nhất!\""

  chinese_students.0021.positive_heaven.best: "Sự thấu hiểu trật tự của Trời của [divination_student.GetHerHis|U] cho thấy trí tuệ trị quốc chân chính!"
  chinese_students.0021.positive_heaven.worst: "Dù gặp khó khăn, sự tận tâm của [divination_student.GetHerHis] với việc lãnh đạo vẫn gây ấn tượng."
  chinese_students.0021.positive_thunder.best: "[divination_student.GetSheHe|U] nắm bắt bản chất của hành động quyết đoán một cách hoàn hảo!"
  chinese_students.0021.positive_thunder.worst: "Lòng can đảm của [divination_student.GetHerHis|U] khi đối mặt thử thách của Sấm thật đáng ngưỡng mộ."
  chinese_students.0021.positive_water.best: "Cách diễn giải của [divination_student.GetHerHis|U] chảy trôi với sự thích nghi tự nhiên!"
  chinese_students.0021.positive_water.worst: "Sự kiên trì của [divination_student.GetHerHis|U] trước những bí ẩn của Nước thật đáng khen."
  chinese_students.0021.positive_mountain.best: "Sự tĩnh lặng của [divination_student.GetHerHis|U] hé lộ sự thấu hiểu sâu sắc!"
  chinese_students.0021.positive_mountain.worst: "Sự học hỏi chân thành của [divination_student.GetHerHis|U] về Núi xứng đáng được ghi nhận."
  chinese_students.0021.positive_wind.best: "[divination_student.GetSheHe|U] nắm bắt hoàn hảo ảnh hưởng tinh tế của Gió!"
  chinese_students.0021.positive_wind.worst: "Trí tuệ của [divination_student.GetHerHis|U] thể hiện trong việc hiểu sức ảnh hưởng."

  chinese_students.0021.negative_heaven: "[divination_student.GetSheHe|U] thiếu chiều sâu trong nguyên lý cai trị của Trời."
  chinese_students.0021.negative_thunder: "Sức mạnh quyết đoán của Sấm vẫn lẩn tránh [divination_student.GetHerHim]. Hãy hành động có mục đích."
  chinese_students.0021.negative_water: "Sự linh hoạt vẫn lẩn tránh [divination_student.GetHerHim]. Điều thiết yếu cho trí tuệ."
  chinese_students.0021.negative_mountain: "Tinh thần của [divination_student.GetHerHis|U] thiếu sự tĩnh lặng. Hãy tìm đến chiêm nghiệm."
  chinese_students.0021.negative_wind: "[divination_student.SheHe|U] bỏ lỡ sức mạnh tinh tế của Gió. Hãy học sự mềm mại."

  chinese_students.0021.balanced_evaluation: "Có tiềm năng, nhưng cần trau dồi thêm."
  chinese_students.0021.positive.toast: "Sự Tán Thành Của Sư Phụ"
  chinese_students.0021.negative.toast: "Sự Chỉnh Dạy Của Sư Phụ"
  chinese_students.0021.balanced.toast: "Sự Chỉ Dẫn Của Sư Phụ"

  heaven_divination_insight_modifier: "Trật Tự Của Trời"
  thunder_divination_insight_modifier: "Sức Mạnh Của Sấm"
  water_divination_insight_modifier: "Dòng Chảy Của Nước"
  mountain_divination_insight_modifier: "Sự Tĩnh Lặng Của Núi"
  wind_divination_insight_modifier: "Ảnh Hưởng Của Gió"

  # Event 0030 - Showcase or Train Skill
  chinese_students.0030.t: "Sức Mạnh Hay Khiêm Nhường"
  chinese_students.0030.desc: "Giữa lúc luyện tập hằng ngày, ta cảm nhận ánh mắt của [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))] [mentor.GetShortUINamePossessive] đang dõi theo mình. Ta làm việc trong im lặng khi [mentor.GetSheHe] âm thầm đánh giá ta. Sau khoảng thời gian tưởng như vô tận, [mentor.GetSheHe] lên tiếng.\n\n\"Chỉ biết những điểm mạnh lớn nhất của bản thân là chưa đủ. Quan trọng hơn nữa là phải hiểu những giới hạn sâu thẳm nhất của mình. Hãy cho ta thấy điều ngươi đã học được về chính bản thân mình, đệ tử.\""
  chinese_students.0030.a.diplomacy: "Ta sẽ trình bày một lời thỉnh cầu hùng biện cho sự hòa hợp của lãnh địa."
  chinese_students.0030.a.martial: "Ta sẽ cho [mentor.GetHerHim] thấy thế thương hoàn hảo của mình."
  chinese_students.0030.a.stewardship: "Ta có thể nói cho [mentor.GetHerHim] chính xác nơi ngân quỹ lãnh địa đang bị phân bổ sai."
  chinese_students.0030.a.intrigue: "[mentor.GetSheHe|U] có thể sẽ hứng thú với mật mã khéo léo của ta."
  chinese_students.0030.a.learning: "Ta có thể đọc thuộc Luận Ngữ từ trí nhớ."
  chinese_students.0030.b.diplomacy: "Ta sẽ tranh luận #emp trực tiếp#! với [mentor.GetHerHim] một cách sôi nổi!"
  chinese_students.0030.b.martial: "[mentor.GetSheHe|U] thậm chí còn không thể #emp sánh bằng#! thế thương hoàn mỹ của ta!"
  chinese_students.0030.b.stewardship: "Ta sẽ cho [mentor.GetHerHim] thấy ta nghĩ gì về tài chính #emp của chính [mentor.GetHerHis]#!!"
  chinese_students.0030.b.intrigue: "Ta biết đôi điều về #emp những bí mật của [mentor.GetHerHis]#! mà ta có thể tiết lộ!"
  chinese_students.0030.b.learning: "#emp Không ai#! có thể sánh bằng sự hiểu biết của ta về Kinh Điển!"
  chinese_students.0030.c.diplomacy: "Ta có bản thỉnh nguyện này mà ta đang soạn..."
  chinese_students.0030.c.martial: "Dù còn thiếu sót, ta có thể trình diễn thế thương của mình..."
  chinese_students.0030.c.stewardship: "Có vài phép tính trong sổ sách mà ta vẫn còn gặp khó khăn..."
  chinese_students.0030.c.intrigue: "Ta có chút hiểu biết hạn chế về những âm mưu trong cung..."
  chinese_students.0030.c.learning: "Ta có thể kể lại những gì ta biết về lời dạy của Khổng Tử..."
  chinese_students.0030.talent.success: "Ta thể hiện rất xuất sắc"
  chinese_students.0030.talent.success.tt: "Ta có thể nhận được sự tôn trọng của [mentor.GetHerHis]"
  chinese_students.0030.talent.failure: "Ta thể hiện kém"
  chinese_students.0030.talent.failure.tt: "Ta có thể bị khiển trách"
  chinese_students.0030.show_off.success: "Ta vượt qua cả những điều [mentor.GetHerHis] đã dạy"
  chinese_students.0030.show_off.success.tt: "Ta có thể nhận được sự tôn trọng của [mentor.GetHerHis] và [merit|E]"
  chinese_students.0030.show_off.failure: "Ta tự làm mình xấu hổ"
  chinese_students.0030.show_off.failure.tt: "Ta có thể bị trừng phạt vì sự kiêu ngạo"
  chinese_students.0030.improve.success: "Ta thể hiện rất tốt"
  chinese_students.0030.improve.success.tt: "Ta có thể nhận được sự tôn trọng của [mentor.GetHerHis] và kinh nghiệm quý giá"
  chinese_students.0030.improve.failure: "Sư phụ dạy bảo ta"
  chinese_students.0030.improve.failure.tt: "Ta có thể bị khiển trách, nhưng sẽ nhận được kinh nghiệm quý giá"

  # Event 0031 - Mentor's Response

  chinese_students.0031.a.success.talent: "[mentee.GetSheHe|U] thể hiện rất xuất sắc."
  chinese_students.0031.a.success.show_off: "Ta không còn gì để dạy [mentee.GetHerHim] nữa!"
  chinese_students.0031.a.success.improve: "Ta rất vui khi thấy sự tiến bộ của [mentee.GetHerHis]!"
  chinese_students.0031.a.failure.talent: "[mentee.GetSheHe|U] đánh giá quá cao bản thân [mentee.GetHerHim] mình, nhưng tất cả chúng ta đều bắt đầu từ đâu đó."
  chinese_students.0031.a.failure.show_off: "Ta đã sai ở đâu với đứa này chứ?!"
  chinese_students.0031.a.failure.improve: "[mentee.GetSheHe|U] vẫn mắc kẹt trong những khó khăn của [mentee.GetHerHis]."
  chinese_students.0031.b.success.talent: "Không có sự tiến bộ nào đạt được từ lời khen!"
  chinese_students.0031.b.success.show_off: "Kiêu ngạo và táo bạo, nhưng ta chẳng có gì để chỉ trích."
  chinese_students.0031.b.success.improve: "$chinese_students.0031.b.success.talent$"
  chinese_students.0031.b.failure.talent: "[mentee.GetSheHe|U] cần học sự khiêm nhường hơn hết."
  chinese_students.0031.b.failure.show_off: "Không tài năng lại càng thiếu khiêm tốn. Đã đến lúc gạt bỏ gánh nặng này."
  chinese_students.0031.b.failure.improve: "[mentee.GetSheHe|U] có một con đường dài phía trước [mentee.GetHerHim] của hắn."

  # Action description (what the student attempts)
  chinese_students.0031.desc.action.talent.diplomacy: "[mentee.GetSheHe|U] bước lên để trình bày một lời thỉnh cầu hùng biện cho sự hòa hợp của lãnh địa."
  chinese_students.0031.desc.action.talent.martial: "Hít thở đều đặn, [mentee.GetSheHe] trình diễn thế thương hoàn hảo."
  chinese_students.0031.desc.action.talent.stewardship: "Cầm sổ sách trong tay, [mentee.GetSheHe] chỉ ra nơi ngân quỹ lãnh địa đang thất thoát."
  chinese_students.0031.desc.action.talent.intrigue: "[mentee.GetSheHe|U] mở ra một mật mã khéo léo, mời ta xem xét."
  chinese_students.0031.desc.action.talent.learning: "Bình tĩnh, [mentee.GetSheHe] bắt đầu đọc Luận Ngữ từ trí nhớ."

  chinese_students.0031.desc.action.show_off.diplomacy: "Với phong thái táo bạo, [mentee.GetSheHe] bắt đầu cuộc tranh luận sôi nổi, thách thức cả trí tuệ của ta."
  chinese_students.0031.desc.action.show_off.martial: "[mentee.GetSheHe|U] vung thương, thách thức ta sánh ngang thế thương hoàn mỹ của [mentee.GetHerHis]."
  chinese_students.0031.desc.action.show_off.stewardship: "Mỉm cười nhếch mép, [mentee.GetSheHe] phê bình sổ sách của chính ta với vẻ khinh thường đầy kịch tính."
  chinese_students.0031.desc.action.show_off.intrigue: "[mentee.GetSheHe|U] bắt đầu kể lại những bí mật mờ ám của lãnh địa, khéo léo ám chỉ những âm mưu chỉ riêng ta biết."
  chinese_students.0031.desc.action.show_off.learning: "Tuyên bố sự thông thạo vô song, [mentee.GetSheHe] đọc vanh vách những đoạn kinh điển ít người biết."

  chinese_students.0031.desc.action.improve.diplomacy: "Một cách dè dặt, [mentee.GetSheHe] trình bày một bản thỉnh nguyện khiêm nhường, mong được trau dồi khả năng hùng biện của [mentee.GetHerHis]."
  chinese_students.0031.desc.action.improve.martial: "Thừa nhận khuyết điểm, [mentee.GetSheHe] trình diễn thế thương còn run rẩy để được chỉnh sửa."
  chinese_students.0031.desc.action.improve.stewardship: "[mentee.GetSheHe|U] bày ra những con số lộn xộn, xin được chỉ dẫn cách sắp xếp."
  chinese_students.0031.desc.action.improve.intrigue: "[mentee.GetSheHe|U] chia sẻ những suy nghĩ sơ khai về âm mưu trong cung, mong được chỉ dẫn thêm."
  chinese_students.0031.desc.action.improve.learning: "Có phần do dự, [mentee.GetSheHe] kể lại vài đoạn trong lời dạy của Khổng Tử, hy vọng hiểu rõ hơn."

  chinese_students.0031.t: "Ngọc Hay Đá"
  chinese_students.0031.desc.intro: "Trong quá trình luyện tập hàng ngày với [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentee'))] [mentee.GetShortUIName] của ta, ta quan sát nỗ lực của [mentee.GetHerHis] của ngài nhằm thể hiện khả năng [mentee.GetHerHis] của ngài.\n\n"

  # Talent showcase (best skill)
  chinese_students.0031.desc.talent.diplomacy.success: "Lời nói điềm tĩnh và thái độ kính trọng của [mentee.GetHerHis|U] bộc lộ trái tim của một nhà ngoại giao, khéo léo dệt nên sự hòa hợp từ những tiếng nói bất đồng."
  chinese_students.0031.desc.talent.diplomacy.failure: "Lưỡi vấp lời và giọng điệu thiếu chắc chắn, [mentee.GetSheHe] gieo rắc rối ren nơi đáng lẽ phải có hòa hợp."
  chinese_students.0031.desc.talent.martial.success: "Tư thế của [mentee.GetHerHis|U] vững vàng và đòn đánh chuẩn xác, kỷ luật được rèn giũa qua vô số giờ luyện tập."
  chinese_students.0031.desc.talent.martial.failure: "Bước chân lúng túng và đòn đánh thiếu lực, bộc lộ những khoảng trống trong kỹ thuật của [mentee.GetHerHis]."
  chinese_students.0031.desc.talent.stewardship.success: "Quyển sổ mà [mentee.GetSheHe] trình ra cân bằng như cán cân của Trời, mỗi đồng tiền được đặt đúng chỗ với sự tính toán cẩn trọng."
  chinese_students.0031.desc.talent.stewardship.failure: "Những cột số bị cộng sai và vết mực lem nhem làm hỏng trang giấy, phơi bày sự cẩu thả giữa những tuyên bố về chuyên môn."
  chinese_students.0031.desc.talent.intrigue.success: "Tinh tế như bóng trăng, câu đố khéo léo của [mentee.GetHerHis] dần hé lộ động cơ ẩn giấu của những kẻ lắng nghe."
  chinese_students.0031.desc.talent.intrigue.failure: "Những sợi lừa dối rối rắm thành vô nghĩa, mọi bí mật bị phơi bày bởi chính sai lầm của [mentee.GetHerHis]."
  chinese_students.0031.desc.talent.learning.success: "Không ngập ngừng, [mentee.GetSheHe] đọc thuộc Kinh Điển, từng câu như nét bút của lòng tận tụy học thuật."
  chinese_students.0031.desc.talent.learning.failure: "Quên câu lẫn nghĩa, [mentee.GetSheHe] phơi bày sự học hời hợt dưới những lời tuyên bố táo bạo."

  # Show-off attempt (best skill)
  chinese_students.0031.desc.show_off.diplomacy.success: "Phong thái và thực lực hòa làm một: tài hùng biện vừa rực rỡ vừa dẫn dắt lòng người đến hòa hợp."
  chinese_students.0031.desc.show_off.diplomacy.failure: "Nhưng [mentee.GetSheHe] tìm kiếm tràng vỗ tay hơn là sự đồng thuận, biến lời nói thành sự phô trương rực rỡ."
  chinese_students.0031.desc.show_off.martial.success: "Những động tác phô diễn ngoạn mục không che giấu khuyết điểm nào; mỗi cú đâm đều chuẩn xác như bậc thầy."
  chinese_students.0031.desc.show_off.martial.failure: "Lưỡi vũ khí lóe lên chỉ để phô trương, tìm kiếm tiếng reo hò thay vì rèn luyện thế đánh hoàn hảo."
  chinese_students.0031.desc.show_off.stewardship.success: "Bỏ qua vẻ khoe khoang, [mentee.GetSheHe|U] trình ra những sổ sách chuẩn xác đến mức sự tự mãn cũng không thể làm giảm giá trị của chúng."
  chinese_students.0031.desc.show_off.stewardship.failure: "[mentee.GetSheHe|U] phô bày những cột tiền như đạo cụ sân khấu, quên rằng trí tuệ thực sự nằm trong sự cân bằng lặng lẽ."
  chinese_students.0031.desc.show_off.intrigue.success: "Phong thái đi cùng chiến lược hoàn hảo; mỗi lời ám chỉ khẽ khàng đều dẫn dắt người nghe một cách vô hình."
  chinese_students.0031.desc.show_off.intrigue.failure: "Mê cung bí mật của [mentee.GetHerHis|U] dường như chỉ được tạo ra để phô trương, không phải vì cần thiết; sự khéo léo bị cùn đi bởi lòng kiêu hãnh."
  chinese_students.0031.desc.show_off.learning.success: "Lời đọc nhanh chóng vừa gây kinh ngạc vừa soi sáng, chứng minh sự thấu hiểu đằng sau vẻ phô diễn."
  chinese_students.0031.desc.show_off.learning.failure: "[mentee.GetSheHe|U] đọc vanh vách nhanh hơn cả hơi thở, bỏ qua ý nghĩa sâu xa nằm trong từng dòng mực."

  # Improvement request (worst skill)
  chinese_students.0031.desc.improve.diplomacy.success: "Giọng nói vững vàng và lập luận chặt chẽ, [mentee.GetSheHe] vượt quá mong đợi dù đứng trên lĩnh vực còn xa lạ."
  chinese_students.0031.desc.improve.diplomacy.failure: "Lời nói do dự của [mentee.GetHerHis|U] bộc lộ sự thiếu tự tin, nhưng khiêm nhường là bước đầu trên con đường ngoại giao."
  chinese_students.0031.desc.improve.martial.success: "Thế đánh từng run rẩy giờ đã vững vàng, minh chứng cho sự luyện tập chăm chỉ."
  chinese_students.0031.desc.improve.martial.failure: "Ngọn thương run rẩy của [mentee.GetHerHis|U] vẫn chao đảo, nhưng ngay cả vị tướng vĩ đại nhất cũng từng vụng về với kiếm gỗ."
  chinese_students.0031.desc.improve.stewardship.success: "Những phép tính giờ đã chính xác và mực viết ngay ngắn; sự kiên trì đã đem lại trật tự từ hỗn loạn."
  chinese_students.0031.desc.improve.stewardship.failure: "Các phép tính của [mentee.GetHerHis|U] vẫn sai lệch và mực bị lem, nhưng nỗ lực khiêm nhường hướng tới sự thành thạo xứng đáng được chỉ dẫn."
  chinese_students.0031.desc.improve.intrigue.success: "Mưu kế được triển khai với sự khéo léo bất ngờ, gợi ý sự thấu hiểu đáng kinh ngạc về những dòng chảy ẩn giấu."
  chinese_students.0031.desc.improve.intrigue.failure: "Sự lừa dối vụng về của [mentee.GetHerHis|U] quá dễ nhìn thấu, nhưng thành thật về thiếu sót của mình là đồng tiền hiếm nhất."
  chinese_students.0031.desc.improve.learning.success: "Những câu kinh đọc ra còn ngập ngừng nhưng đúng đắn, hạt giống học vấn đang bén rễ vững chắc."
  chinese_students.0031.desc.improve.learning.failure: "[mentee.GetSheHe|U] vấp váp khi đọc Luận Ngữ, nhưng khát vọng tri thức vẫn cháy sáng trong ánh mắt [mentee.GetHerHis]."

  chinese_students.0031.desc.conclusion: "\n\nTa khẽ hắng giọng, và sân viện lặng đi. Phán quyết của ta đã sẵn sàng được nói ra."

  chinese_students.0031.kind_evaluation.toast: "Đánh Giá Khoan Dung"
  chinese_students.0031.harsh_evaluation.toast: "Đánh Giá Nghiêm Khắc"

  # Event 0032 - Mentorship Ends
  chinese_students.0032.t: "Chia Tay"
  chinese_students.0032.desc: "[mentor.GetShortUIName] tiến lại gần, hai tay chắp sau lưng [mentor.GetHerHis] của ngài. \"Con đường của chúng ta chia rẽ tại đây, đệ tử,\" [mentor.GetSheHe] nói, giọng điệu chừng mực. \"Hãy tìm kiếm trí tuệ một mình bây giờ. Những bài học của ta đã kết thúc.\""
  chinese_students.0032.a: "Ta sẽ phải cố gắng mà không còn sự chỉ dẫn."
