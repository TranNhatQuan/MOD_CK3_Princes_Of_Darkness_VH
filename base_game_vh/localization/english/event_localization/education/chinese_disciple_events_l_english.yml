l_english:

  # Event 0002 - Rivalry During Teaching
  chinese_students.0002.t:0 "Thiếu Kỷ Luật"
  chinese_students.0002.desc: "\"[ROOT.Char.Custom('TeachingsAccordingToMovement')].\"\n\nTa tạm dừng để những lời của mình thấm nhuần, nhưng [second_student.GetName] đã chớp lấy khoảnh khắc. Với một cái nhìn liếc sân khấu về phía [first_student.GetName], [second_student.GetSheHe] hắng giọng [second_student.GetHerHis] của ngài. \"[ROOT.Char.Custom('TeachingResponsesAccordingToMovement')]\", [second_student.GetSheHe] phản hồi.\n\nHai kẻ này đã tranh cãi gay gắt suốt cả tuần."

  # Options for Event 0002
  chinese_students.0002.a:0 "Không có gì sai với một chút cạnh tranh lành mạnh!"
  chinese_students.0002.a.tooltip:0 "Cả hai đệ tử sẽ nhận được Công Đức, trở nên cạnh tranh hơn và trân trọng sự chỉ dạy của bạn. Bạn có thể nhận Stress tùy theo tính cách."

  chinese_students.0002.b:0 "Được Nhà [most_renowned_student.GetHouse.GetNameNoTooltip] ưu ái có thể sẽ hữu ích."
  chinese_students.0002.b.tooltip:0 "Học trò từ vương triều danh giá nhất sẽ nhận Công Đức và sự cảm kích (cả gia chủ của họ cũng vậy), trong khi người kia sẽ oán giận sự thiên vị của bạn."

  chinese_students.0002.c: "[underdog.GetShortUINameNoTooltip] cần phải biết vị trí [underdog.GetHerHis] của mình."
  chinese_students.0002.c.tooltip:0 "Kẻ yếu thế sẽ mất Công Đức và nhận Stress, trong khi kẻ mạnh thế hơn sẽ nhận Công Đức. Kẻ yếu thế sẽ oán giận sự khắc nghiệt của bạn."

  chinese_students.0002.d:0 "[overdog.GetShortUINameNoTooltip] đáng ra phải biết điều hơn chứ!"
  chinese_students.0002.d.tooltip:0 "Kẻ mạnh thế hơn sẽ mất Công Đức và nhận Stress, trong khi kẻ yếu thế sẽ nhận Công Đức. Kẻ mạnh thế hơn sẽ oán giận sự khắc nghiệt của bạn."

  chinese_students.0002.e:0 "Cả hai đều cần một bài học về sự khiêm nhường."
  chinese_students.0002.e.tooltip:0 "Cả hai đệ tử sẽ bị khiển trách, gây Stress và sự oán giận. Bạn sẽ nhận một chút Stress vì sự gián đoạn, nhưng cũng nhận được một ít Công Đức vì duy trì kỷ luật."

  # Event 0003 - After the Rivalry Lesson
  chinese_students.0003.t: "$chinese_students.0002.t$"

  # Dynamic descriptions
  chinese_students.0003.desc.intro: "\"[mentor.Custom('TeachingsAccordingToMovement')].\"\n\nKhi [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))] [mentor.GetTitledFirstName] của ta truyền đạt trí tuệ, [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('second_student'))] [second_student.GetTitledFirstName] của ta hắng giọng [second_student.GetHerHis] của ngài và đáp lại, \"[ROOT.Char.Custom('TeachingResponsesAccordingToMovement')]\", với một cái nhìn liếc về phía ta.\n\n"

  chinese_students.0003.desc.encourage_both: "[ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))] của chúng ta khơi dậy sự cạnh tranh giữa hai người. Từ nay mỗi bài học sẽ càng làm cuộc ganh đua thêm gay gắt."
  chinese_students.0003.desc.punish_both: "[ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))] của chúng ta đưa ra lời khiển trách nghiêm khắc cho cả hai."
  chinese_students.0003.desc.favor: "[ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))] của chúng ta cắt ngang lời [second_student.GetHerHim] và tiếp tục bài giảng với ánh nhìn sắc lạnh hướng về phía [second_student.GetHerHis]."
  chinese_students.0003.desc.disfavor: "[ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))] của chúng ta nhẹ nhàng thừa nhận lời của [second_student.GetHerHim] rồi thoáng cau mày về phía ta. Tai ta nóng bừng vì xấu hổ."

  # Options for Event 0003
  chinese_students.0003.a: "Ta sẽ chứng minh [second_student.GetTitledFirstNameNoTooltip] sai!"
  chinese_students.0003.b: "Điều đó chẳng quan trọng; sự bình thản chính là sức mạnh của ta."
  chinese_students.0003.c: "Hãy để tất cả biết rằng ta đã chiến thắng!"
  chinese_students.0003.d: "Chiến thắng đòi hỏi sự khiêm nhường."
  chinese_students.0003.e: "Ta sẽ trả thù!"
  chinese_students.0003.f: "Ta sẽ học hỏi từ thất bại này."

  # Opinion Modifiers
  opinion_mentor_appreciation:0 "Trân Trọng Sự Chỉ Dạy Của Sư Phụ"
  opinion_mentor_favoritism_positive:0 "Cảm Kích Sự Thiên Vị"
  opinion_mentor_favoritism_negative:0 "Oán Giận Sự Thiên Vị"
  opinion_mentor_strict_negative:0 "Oán Giận Sự Khắc Nghiệt Của Sư Phụ"

  TeachingsAccordingToMovementProHegemon_Teaching: "Trục xoay của Thiên mệnh tuy vô hình nhưng khiến mọi thứ dưới bầu trời chuyển động. Khi đức hạnh đứng vững ở trung tâm thiên hạ, hòa hợp sẽ theo sau"
  TeachingsAccordingToMovementExpansion_Teaching: "Khi bờ sông tràn nước, vài người có thể thiệt mạng, nhưng nó nuôi dưỡng những cánh đồng mới để nuôi sống số đông. Vì vậy sự vĩ đại bộc lộ trong dũng khí ôm lấy những vùng đất ngoài lãnh thổ của ta"
  TeachingsAccordingToMovementAdvancement_Teaching: "Chăm sóc khu vườn trong tường thành khiến không khí tràn đầy hương thơm thu hút người khác. Sức mạnh và vinh quang thật sự chỉ lớn lên từ những rễ cây cắm sâu vào mảnh đất được vun trồng cẩn thận"
  TeachingsAccordingToMovementConservative_Teaching: "Dù đại sảnh tổ tiên im lặng, hãy lắng nghe thật kỹ và ngươi sẽ nghe thấy những âm vang trường tồn dẫn lối từng bước. Hãy tôn trọng con đường đã được bước qua đưa chúng ta đến khoảnh khắc này"
  TeachingsAccordingToMovementUndecided_Teaching: "Khi gió đổi chiều, người khôn ngoan sẽ điều chỉnh cánh buồm để đón sức mạnh của nó. Điệu vũ giữa kiềm chế và tham vọng, truyền thống và đổi thay, luôn tìm kiếm sự cân bằng, nên dẫn dắt ngươi trong cả trị quốc lẫn cuộc đời"
  TeachingsAccordingToMovementFallback_Teaching: "Ngay cả một chiếc đèn lồng đơn độc cũng xua tan màn đêm; trí tuệ không cần cờ hiệu để dẫn lối"

  TeachingsAccordingToMovementProHegemon_Response: "Có những kẻ ca tụng trục bánh xe quá lớn tiếng đến mức quên rằng nhiệm vụ của họ chỉ là chiếc nan giữ bánh xe lại với nhau"
  TeachingsAccordingToMovementExpansion_Response: "Ta đã thấy có người quá chú tâm vào những cánh đồng mới mà quên giữ yên bình cho khu vườn của chính mình"
  TeachingsAccordingToMovementAdvancement_Response: "Có kẻ chạy theo những bông hoa xa xôi và gọi đó là vinh quang, nhưng lại quên những trái ngọt nuôi sống chính gia đình họ"
  TeachingsAccordingToMovementConservative_Response: "Ta e rằng những kẻ bám quá chặt vào quá khứ sẽ không thể khai khẩn đất mới, ngay cả khi ruộng cũ đã bỏ hoang"
  TeachingsAccordingToMovementUndecided_Response: "Đáng buồn thay, ta đã thấy nhiều người ca ngợi sự cân bằng như một cái cớ cho sự bất động trong khi thế giới bỏ họ lại phía sau"
  TeachingsAccordingToMovementFallback_Response: "Có những kẻ bay từ đèn lồng này sang đèn lồng khác, như con thiêu thân bị hút vào mọi ngọn lửa"

  # A Test of Wisdom: The Blank Scroll
  chinese_students.0010.t: "Cuộn Trục Trắng"
  chinese_students.0010.desc: "[ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))] [mentor.GetTitledFirstName] của ta tiếp cận ta, cầm một cuộn giấy trang trí trong tay [mentor.GetHerHis] của ngài. Nguyên sơ và không bị mực làm vấy bẩn, nó tiết lộ một khung vải trắng của khả năng.\n\n\"Cuộn giấy trắng là một bài kiểm tra trí tuệ và tính cách của con,\" [mentor.GetSheHe] cất giọng trang nghiêm. \"Những gì con viết ở đây phản ánh linh hồn của con. Hãy chọn từ ngữ của con một cách cẩn thận, đệ tử trẻ.\"\n\n[mentor.GetSheHe|U] để lại cho ta không gì ngoài bút lông, mực và những suy nghĩ của ta."

  # Strong areas - Safe choices
  chinese_students.0010.a.strength: "Một cơ hội để cải cách những luật lệ lỗi thời của triều đình!"
  chinese_students.0010.b.strength: "Một bài thơ gửi tới [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('beloved'))] của ta, đầy ẩn ý và chơi chữ!"
  chinese_students.0010.c.strength.china: "Chỉ có Thiên Tử [ROOT.Char.GetTopLiege.GetHerHim]self xứng đáng với nét bút của ta!"
  chinese_students.0010.c.strength.other: "Chỉ có [ROOT.Char.GetTopLiege.GetShortUINameNoTooltip] xứng đáng với nét bút của ta!"
  chinese_students.0010.d.strength: "Triết học tuôn chảy tự nhiên từ tâm trí ta lên cuộn trục này!"
  chinese_students.0010.e.strength: "Chiến lược quân sự chính là nơi tài năng của ta tỏa sáng nhất!"
  
  # Weak areas - Growth opportunities
  chinese_students.0010.a.weakness: "Dù lập pháp là thử thách với ta, ta vẫn phải thử sức..."
  chinese_students.0010.b.weakness: "Dù lời lẽ vụng về, ta vẫn sẽ bày tỏ tình cảm với [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('beloved'))] của mình..."
  chinese_students.0010.c.weakness.china: "Ta sẽ thử viết một bài ca tụng Thiên Tử..."
  chinese_students.0010.c.weakness.other: "Ta sẽ thử viết một bài ca tụng [ROOT.Char.GetTopLiege.GetShortUINameNoTooltip]..."
  chinese_students.0010.d.weakness: "Triết học thử thách giới hạn của ta, nhưng luận thuyết này có thể mở rộng tâm trí ta..."
  chinese_students.0010.e.weakness: "Chiến tranh khiến ta bối rối, nhưng quân đội [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] cần những ý tưởng mới..."

  chinese_students.0010.f: "Chân lý sâu sắc nhất nằm trong lời chưa nói."
  chinese_students.0010.tt: "#weak Những nỗ lực này sẽ được đánh giá...#!"

  chinese_students.0010.law.success.tt: "Ta có thể nhận được [GetModifier('wrote_law_modifier').GetNameWithTooltip]"
  chinese_students.0010.poem.success.tt: "Ta có thể nhận được [GetModifier('wrote_poem_loved_one_modifier').GetNameWithTooltip]"
  chinese_students.0010.ode.success.tt: "Ta có thể nhận được [GetModifier('wrote_ode_to_liege_modifier').GetNameWithTooltip]"
  chinese_students.0010.treatise.success.tt: "Ta có thể nhận được [GetModifier('wrote_philosophical_treatise_modifier').GetNameWithTooltip]"
  chinese_students.0010.stratagem.success.tt: "Ta có thể nhận được [GetModifier('wrote_strategy_scroll_modifier').GetNameWithTooltip]"
  chinese_students.0010.blank.success.tt: "Ta có thể nhận được [GetModifier('left_scroll_blank_modifier').GetNameWithTooltip]"

  chinese_students.0010.failure.tt: "Ta có thể thu được kinh nghiệm quý giá"

  chinese_students.0010.success: "Tác phẩm chất lượng cao"
  chinese_students.0010.failure: "Tác phẩm dưới mức trung bình"
  chinese_students.0010.success_blank: "Sư phụ hiểu được tầm nhìn của ngươi"
  chinese_students.0010.failure_blank: "Tầm nhìn của ngươi quá khó hiểu"

  # Mentor evaluates the student's scroll
  chinese_students.0011.t: "Khoảnh Khắc Dạy Dỗ"
  chinese_students.0011.desc.intro: "Học trò của ta là [scroll_student.GetShortUIName] xuất hiện trước cửa, kính cẩn mang theo một cuộn trục thư pháp tinh xảo. [scroll_student.GetSheHe|U] dâng nó bằng đôi tay run rẩy, hồi hộp chờ đợi phán quyết của ta.\n\nTa cẩn thận mở cuộn trục để xem [scroll_student.GetSheHe] đã chọn viết điều gì. Hóa ra đó là "

  chinese_students.0011.desc.law: "một đề xuất về một bộ luật mới, liên quan đến những chi tiết tinh tế của việc trị quốc."
  chinese_students.0011.desc.love_letter: "một bức thư tình gửi tới [beloved.GetShortUIName], đầy những tình cảm dịu dàng."
  chinese_students.0011.desc.emperor_ode: "một bài ca tụng vinh quang của [ROOT.Char.GetTopLiege.GetShortUIName], ca ngợi nhiều đức hạnh của [ROOT.Char.GetTopLiege.GetHerHis]."
  chinese_students.0011.desc.treatise: "một luận thuyết triết học, khám phá mối quan hệ giữa ngũ hành và tứ trụ."
  chinese_students.0011.desc.strategy: "một luận thuyết về chiến lược quân sự, đề xuất nhiều chiến thuật khác thường có thể được dùng trong các chiến dịch của quân đội [scroll_student.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip]."
  chinese_students.0011.desc.blank: "hoàn toàn trống!"
  chinese_students.0011.desc.conclusion: "\n\nNó mở ra một góc nhìn rõ ràng vào tâm trí và tính cách của [scroll_student.GetHerHis]."

  chinese_students.0011.desc.quality_success: "Chất lượng của tác phẩm xứng đáng được trưng bày trong thư viện tại [scroll_student.GetTopLiege.GetCapitalLocation.GetNameNoTooltip]!"
  chinese_students.0011.desc.quality_failure: "Đáng tiếc là, dù [scroll_student.GetHerHis] đã nỗ lực đáng kể, nó... không được tốt lắm."
  chinese_students.0011.desc.quality_success.blank: "Thật là một lựa chọn thú vị và sâu sắc!"
  chinese_students.0011.desc.quality_failure.blank: "Rốt cuộc [scroll_student.GetSheHe] đang nghĩ gì vậy?!"
  chinese_students.0011.self_improvement: "Tạm chấp nhận được, nhưng ta tin [scroll_student.GetSheHe] có thể làm tốt hơn."
  
  # Dynamic positive evaluation descriptions by scroll type
  chinese_students.0011.positive_law: "Bộ luật này thể hiện sự thấu hiểu và trí tuệ đáng kinh ngạc."
  chinese_students.0011.positive_love: "Những lời thật dịu dàng! Cảm xúc chân thành và lay động."
  chinese_students.0011.positive_emperor: "Một lời ca tụng hùng hồn, xứng đáng dâng lên Thiên Tử."
  chinese_students.0011.positive_philosophy: "Những hiểu biết triết học này bộc lộ trí tuệ sâu sắc."
  chinese_students.0011.positive_strategy: "Những chiến thuật này cho thấy một tư duy chiến lược đầy hứa hẹn."
  chinese_students.0011.positive_blank: "Phi thường! Trí tuệ chân chính không thể tìm thấy trong lời viết."
  
  chinese_students.0011.positive_law.worst: "Sự hiểu biết của [scroll_student.GetHerHis|U] về pháp luật tiến bộ từng ngày!"
  chinese_students.0011.positive_love.worst: "[scroll_student.GetSheHe|U] đang học được nghệ thuật tinh tế của lời lẽ quyến rũ, ta thấy đấy!"
  chinese_students.0011.positive_emperor.worst: "[scroll_student.GetSheHe|U] cho thấy tài năng bất ngờ trong nghệ thuật ca tụng!"
  chinese_students.0011.positive_philosophy.worst: "Sự nắm bắt các khái niệm triết học của [scroll_student.GetHerHis|U] tiến bộ với tốc độ đáng ngạc nhiên!"
  chinese_students.0011.positive_strategy.worst: "[scroll_student.GetSheHe|U] thể hiện sự sáng suốt mới trong các vấn đề quân sự!"

  # Dynamic negative evaluation descriptions by scroll type
  chinese_students.0011.negative_law: "Một nỗ lực trị quốc thô sơ. [scroll_student.GetSheHe|U] còn phải học hỏi nhiều."
  chinese_students.0011.negative_love: "Những cảm xúc tầm thường được bọc trong ngôn từ hoa mỹ. Thật đáng thất vọng."
  chinese_students.0011.negative_emperor: "Lời nịnh bợ rỗng tuếch phơi bày một tâm trí nông cạn."
  chinese_students.0011.negative_philosophy: "[scroll_student.GetSheHe|U] chỉ đơn thuần lặp lại suy nghĩ của người khác mà không hiểu."
  chinese_students.0011.negative_strategy: "[scroll_student.GetSheHe|U] đặt [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetDefinitiveNameNoTooltip] vào nguy hiểm chỉ để tiến thân."
  chinese_students.0011.negative_blank: "Nội dung cũng rỗng tuếch như trong tâm trí [scroll_student.GetHerHis]."

