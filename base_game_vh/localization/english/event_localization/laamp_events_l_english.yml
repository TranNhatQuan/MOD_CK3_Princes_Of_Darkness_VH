  ep3_laamp_flavour_ewan.1021.t: "Tình Yêu Ngay Lần Trại Đầu"
  ep3_laamp_flavour_ewan.1021.desc: "\"[ROOT.Char.Custom('StammerLetterMotherFather')|U]-[ROOT.Char.GetMotherFather], c-con có một yêu cầu,\" [child.GetFirstName], [child.Custom('GetDaughterSon')] của ta, nói lắp bắp. Phía sau [child.GetHerHim], e thẹn bám lấy tay [child.Custom('GirlBoy')] của ta, là một thiếu niên [crush_child.GetCulture.GetName] cao lêu nghêu.\n\n\"Đây là [crush_child.GetFirstName]. Con t-thực sự rất thích bạn ấy và con đang tự hỏi, l-liệu bạn ấy có thể đi cùng chúng ta không? Cả bố mẹ của bạn ấy nữa, bạn ấy không thể bỏ họ lại được!\""
  ep3_laamp_flavour_ewan.1021.a: "Ta đoán có thể thêm một gia đình nữa..."
  ep3_laamp_flavour_ewan.1021.b: "Ngươi sẽ ngừng gặp [crush_child.GetHerHim] ngay lập tức!"
  ep3_laamp_flavour_ewan.1021.c: "Chắc chỉ là mối tình vụ mùa, ngươi sẽ vượt qua."
  ep3_laamp_flavour_ewan.1021.c.crush_endures: "Mối crush của [child.GetFirstNamePossessiveNoTooltip] vẫn cháy bỏng"
  ep3_laamp_flavour_ewan.1021.c.crush_fades: "Mối crush nhạt dần"
 
  ep3_laamp_flavour_ewan.1031.t: "Nuôi Dưỡng"
  ep3_laamp_flavour_ewan.1031.desc.intro: "Người ta nói rằng trẻ con phản ứng với những nơi chúng đặt chân đến mạnh mẽ hơn bất kỳ ai.\n\nThật may mắn cho [child.GetFirstName], [child.Custom('GetDaughterSon')] của ta, khi [child.GetSheHe] thấy [child.GetHerselfHimself] đang ở trong công ty của những người"
  ep3_laamp_flavour_ewan.1031.desc.purpose.wanderers: "Ngài đồng hành trung thành, người quen thú vị, và những người hầu hữu ích"
  ep3_laamp_flavour_ewan.1031.desc.purpose.mercenaries: "$knight_culture_player_plural_no_tooltip$ cứng cỏi, lính đánh thuê tàn nhẫn, và binh sĩ kiên cường"
  ep3_laamp_flavour_ewan.1031.desc.purpose.scholars: "học giả uyên bác, nhà ngoại giao hùng biện, và những bậc hiền triết xuất sắc"
  ep3_laamp_flavour_ewan.1031.desc.purpose.explorers: "những nhà phiêu lưu đầy tham vọng, dân bản địa lạ lẫm, và du khách dạn dày"
  ep3_laamp_flavour_ewan.1031.desc.purpose.brigands: "kẻ trộm ranh mãnh, bọn cướp tàn nhẫn, và bọn hèn hạ nguy hiểm"
  ep3_laamp_flavour_ewan.1031.desc.purpose.legitimists: "những người trung thành quyết tâm, vệ sĩ tinh nhuệ, và những người làm thuê đáng giá"
  ep3_laamp_flavour_ewan.1031.desc.outro: "mà Ta đã có thể tập hợp.\n\nMột môi trường tốt để một [child.Custom('GirlBoy')] trẻ phát triển, và nơi [child.GetSheHe] dường như quyết tâm ghi nhớ mọi bài học."
  ep3_laamp_flavour_ewan.1031.tt.trait_adopted: "Thuộc Tính Mới"
  ep3_laamp_flavour_ewan.1031.tt.skill_gain: "Kỹ Năng Mới"
  ep3_laamp_flavour_ewan.1031.a: "Ahhh, niềm đam mê phiêu lưu đã chinh phục '[child.Custom('GetErIm')]."
  ep3_laamp_flavour_ewan.1031.b: "[child.GetSheHe|U] sẽ trở thành chiến binh một ngày nào đó."
  ep3_laamp_flavour_ewan.1031.c: "Sao mà nhiệt huyết trong một người còn quá trẻ!"
  ep3_laamp_flavour_ewan.1031.d: "Ta tự hỏi [child.GetSheHe] sẽ thấy những cảnh gì..."
  ep3_laamp_flavour_ewan.1031.e: "Thái độ này sẽ giúp [child.GetHerHim] rất nhiều."
  ep3_laamp_flavour_ewan.1031.f: "Tham vọng như vậy là tự nhiên thôi."
  ep3_laamp_flavour_ewan.1031.g: "Có lẽ chúng ta nên xem xét một con đường khác?"
  ep3_laamp_flavour_ewan.1031.g.tt.success: "Ngài truyền một chút khôn ngoan"
  ep3_laamp_flavour_ewan.1031.g.tt.failure: "Bài học của Ngài không được chú ý"
  ep3_laamp_flavour_ewan.1031.h: "*thở dài* Dừng lại đi, [child.Custom('GirlBoy')]."
  geterim_er: "er"
  geterim_im: "im"

  ep3_laamp_flavour_ewan.1041.t: "Quê Hương Xưa"
  ep3_laamp_flavour_ewan.1041.desc: "\"[ROOT.Char.GetMotherFather|U], quê nhà như thế nào?\" hỏi [child.Custom('GetDaughterSon')] [child.GetFirstName] của Ta khi ăn sáng.\n\nMột chút bối rối trước câu hỏi bất ngờ, Ta nhặt nhạnh trong bát cháo một lúc, nhớ về lúc [memory.GetDescription].\n\nĐã nhiều năm trôi qua... Ta đoán cũng tự nhiên khi một đứa trẻ còn trẻ như [child.GetFirstNameNoTooltip] muốn biết mọi thứ #EMP đã# từng ra sao."
  ep3_laamp_flavour_ewan.1041.a: "Nó thật đẹp, bé ạ."
  ep3_laamp_flavour_ewan.1041.a.tt.diplomacy: "Chuyện Quê Hương Xưa"
  ep3_laamp_flavour_ewan.1041.a.tt.stewardship: "$ep3_laamp_flavour_ewan.1041.a.tt.diplomacy$"
  ep3_laamp_flavour_ewan.1041.a.tt.learning: "$ep3_laamp_flavour_ewan.1041.a.tt.diplomacy$"
  ep3_laamp_flavour_ewan.1041.b: "Một nơi khủng khiếp đã bỏ rơi chúng ta."
  ep3_laamp_flavour_ewan.1041.b.tt.martial: "$ep3_laamp_flavour_ewan.1041.a.tt.diplomacy$"
  ep3_laamp_flavour_ewan.1041.b.tt.intrigue: "$ep3_laamp_flavour_ewan.1041.a.tt.diplomacy$"
  ep3_laamp_flavour_ewan.1041.c: "Một ngày nào đó, con sẽ tự mình biết."
  ep3_laamp_flavour_ewan.1041.d: "Có lẽ một ngày nào đó ta sẽ trở lại; khi đó hãy hỏi ta."
  ep3_laamp_flavour_ewan.1041.e: "Ta sẽ không nhắc đến nó."
  ep3_laamp_flavour_ewan_1041_beautiful_home_diplomacy_modifier.boilerplate: "Nhớ Một Vùng Đất Mất"
  ep3_laamp_flavour_ewan_1041_horrible_home_martial_modifier.boilerplate: "Bài Học Ngày Xưa"
  ep3_laamp_flavour_ewan_1041_beautiful_home_diplomacy_modifier: "$ep3_laamp_flavour_ewan_1041_beautiful_home_diplomacy_modifier.boilerplate$: Ngoại Giao"
  ep3_laamp_flavour_ewan_1041_beautiful_home_diplomacy_modifier_desc: "Nhân vật này thích thú với những câu chuyện về quê hương mà họ chỉ nhớ mơ hồ hoặc chưa từng thấy."
  ep3_laamp_flavour_ewan_1041_beautiful_home_stewardship_modifier: "$ep3_laamp_flavour_ewan_1041_beautiful_home_diplomacy_modifier.boilerplate$: Quản Lý"
  ep3_laamp_flavour_ewan_1041_beautiful_home_stewardship_modifier_desc: "$ep3_laamp_flavour_ewan_1041_beautiful_home_diplomacy_modifier_desc$"
  ep3_laamp_flavour_ewan_1041_beautiful_home_learning_modifier: "$ep3_laamp_flavour_ewan_1041_beautiful_home_diplomacy_modifier.boilerplate$: Học Hành"
  ep3_laamp_flavour_ewan_1041_beautiful_home_learning_modifier_desc: "$ep3_laamp_flavour_ewan_1041_beautiful_home_diplomacy_modifier_desc$"
  ep3_laamp_flavour_ewan_1041_horrible_home_martial_modifier: "$ep3_laamp_flavour_ewan_1041_horrible_home_martial_modifier.boilerplate$: Võ Thuật"
  ep3_laamp_flavour_ewan_1041_horrible_home_martial_modifier_desc: "Nhân vật này có thể không còn gắn bó với quê hương đã mất, nhưng vẫn nhớ bài học của nó."
  ep3_laamp_flavour_ewan_1041_horrible_home_intrigue_modifier: "$ep3_laamp_flavour_ewan_1041_horrible_home_martial_modifier.boilerplate$: Âm Mưu"
  ep3_laamp_flavour_ewan_1041_horrible_home_intrigue_modifier_desc: "$ep3_laamp_flavour_ewan_1041_horrible_home_martial_modifier_desc$"
  ep3_laamp_flavour_ewan_1041_rightful_home_modifier: "$ep3_laamp_flavour_ewan_1041_beautiful_home_diplomacy_modifier.boilerplate$: "
  ep3_laamp_flavour_ewan_1041_rightful_home_modifier_desc: "$ep3_laamp_flavour_ewan_1041_beautiful_home_diplomacy_modifier_desc$"

  ep3_laamp_flavour_ewan.1051.t: "Thật Không Công Bằng"
  ep3_laamp_flavour_ewan.1051.desc: "[child.GetFirstNamePossessive|U] la hét uất ức có thể đánh thức kẻ chết.\n\n\"Ta nói là #EMP không công bằng#! Hoàn toàn không! Tại sao #EMP chúng ta#! phải sống ở đây như thế này? Như những... con vật, lang thang từ nơi này sang nơi khác, không có cung điện, không lâu đài, thậm chí không có giường tử tế. Ta không yêu cầu #EMP nghèo đói#! này và ta xứng đáng được tốt hơn!\"\n\nQua tiếng khóc và phẫn nộ, Ta có thể [ROOT.Char.Custom('SenseObserve_SenseSee')] rằng sự thất vọng của [child.Custom('GetDaughterSon')] là thật. Nước mắt của cả giận dữ và buồn bã lăn dài trên hai má [child.GetHerHis]."
  ep3_laamp_flavour_ewan.1051.tt.success: "[child.GetFirstNameNoTooltip] bình tĩnh lại"
  ep3_laamp_flavour_ewan.1051.tt.failure: "[child.GetFirstNameNoTooltip] không thể nguôi"
  ep3_laamp_flavour_ewan.1051.a: "Lại đây nào, [child.Custom('GirlBoy')], mọi chuyện sẽ ổn thôi."
  ep3_laamp_flavour_ewan.1051.b: "Công bằng? Ngươi là [child.GetHouse.GetNameNoTooltip]! Ngẩng cao đầu lên!"
  ep3_laamp_flavour_ewan.1051.c: "Ta biết, nhưng mọi thứ vốn là như vậy."
  ep3_laamp_flavour_ewan.1051.d: "Để [child.GetHerHim] vùng vẫy với cơn giận của [child.GetHerHis]."
  ep3_laamp_flavour_ewan.1051.d.tt.annoyance_fades: "Cơn giận của [child.GetHerHis|U] lắng xuống theo thời gian"
  ep3_laamp_flavour_ewan.1051.d.tt.grudge_held: "[child.GetFirstNameNoTooltip] vẫn còn hậm hực"

  ep3_laamp_flavour_ewan.1061.t: "Học Nhanh"
  ep3_laamp_flavour_ewan.1061.desc: "Có vẻ thời gian ở [current_county.GetBaseNameNoTier] đã mang lại lợi ích cho [child.Custom('GetDaughterSon')] [child.GetFirstName].\n\nMột điều gì đó về văn hóa địa phương thật #EMP mê hoặc#! [child.GetHerHim], đến mức trong thời gian ngắn ở đây, [child.GetSheHe] đã học được [current_county.GetProvince.GetCulture.GetLanguage.GetName] ở mức chấp nhận được, một thành tích mà [child.Custom('GetLassLad')] tự hào khoe khắp trại, thậm chí nhét vài từ và cụm từ vào câu chuyện với những người kém hơn [child.GetHerHis].\n\nHành vi kiêu ngạo, tất nhiên, nhưng có lẽ là có lý do."
  ep3_laamp_flavour_ewan.1061.a: "Hmm, thông minh thật, [child.Custom('GirlBoy')]."
  ep3_laamp_flavour_ewan.1061.b: "Có lẽ [child.GetSheHe] có thể dạy ta nữa..."
  ep3_laamp_flavour_ewan.1061.b.tt.success: "Cùng nhau học ngôn ngữ"
  ep3_laamp_flavour_ewan.1061.b.tt.failure: "Ngài thử mà thất bại"
  ep3_laamp_flavour_ewan.1061.c: "Nhổ cái bùn nước ngoài đó ra khỏi miệng!"

  ep3_laamp_flavour_ewan.1071.t: "Ở Rìa Trại"
  ep3_laamp_flavour_ewan.1071.desc.intro: "Đường về từ [ROOT.Char.Custom('GetRandomCampBuilding')] dẫn Ta gần đến rìa trại, nơi tiếng la hét của trẻ em thu hút sự chú ý của Ta.\n\n[own_child.Custom('GetDaughterSon')] [own_child.GetFirstName] của Ta đang dẫn vài đứa khác trong"
  ep3_laamp_flavour_ewan.1071.desc.plains: "một cuộc tập trận kỵ binh giả trên mặt đất phẳng, đập gậy nhỏ vào kẻ thù tưởng tượng khi họ khiến kẻ thù ảo hoảng sợ chạy đi."
  ep3_laamp_flavour_ewan.1071.desc.farmlands: "leo lên một cây cô đơn, xoắn vặn giữa cánh đồng của nông dân. Trẻ lớn leo cao hơn nhiều, trong khi trẻ nhỏ chậm rãi quanh gốc."
  ep3_laamp_flavour_ewan.1071.desc.hills: "lăn mạnh, nhào lộn xuống một ngọn đồi cỏ. Không cần nhiều kỹ năng, nhưng trẻ em vẫn thi đua xem ai nhanh nhất."
  ep3_laamp_flavour_ewan.1071.desc.mountains: "ném đá nhỏ từ sườn núi, xem chúng bay xa đến đâu trong thung lũng. Chúng reo hò khi viên đá đi xa hơn và cười khi những viên khác ngừng lại."
  ep3_laamp_flavour_ewan.1071.desc.desert: "lăn xuống đụn cát cao, cát bay tung tóe. Tiếng cười và #EMP ptth#!, #EMP ptth#! vang lên khi trẻ bị cát văng vào miệng. Thường xuyên xảy ra."
  ep3_laamp_flavour_ewan.1071.desc.desert_mountains: "$ep3_laamp_flavour_ewan.1071.desc.mountains$"
  ep3_laamp_flavour_ewan.1071.desc.oasis: "xây... những mẩu cát bằng lá và cỏ? Không rõ để làm gì — một đứa trẻ khác len tới từ đụn gần đó, và ngay lập tức một loạt cát bay ra như lửa đạn."
  ep3_laamp_flavour_ewan.1071.desc.jungle: "chọc vào một con rắn chết bằng cành cây. Con vật đã chết, đầu bị xé nát, nhưng trẻ em vẫn vui chơi, cố nâng cơ thể bằng que và nó lại rớt xuống."
  ep3_laamp_flavour_ewan.1071.desc.forest: "bảo vệ cành cây trên khỏi vài trẻ cố leo từ dưới lên. Khi trẻ dưới lấy chỗ đứng, trẻ trên ném cành, lá và nhựa cây."
  ep3_laamp_flavour_ewan.1071.desc.taiga: "$ep3_laamp_flavour_ewan.1071.desc.forest$"
  ep3_laamp_flavour_ewan.1071.desc.wetlands: "tạo đảo tạm. Chúng tìm thấy mảnh bùn hẹp giữa nước lợ, dần tách ra khỏi đầm lầy bằng tay bẩn và que thối."
  ep3_laamp_flavour_ewan.1071.desc.steppe: "dường như là trò chơi xương knucklebones căng thẳng. Mỗi lần ném, ai đó đưa ra luật mới, người khác đồng tình hoặc phản đối."
  ep3_laamp_flavour_ewan.1071.desc.floodplains: "trận chiến ném bùn căng thẳng như cuộc chiến người lớn. Hai bên dường như sẵn sàng hy sinh vì... bất cứ lý do gì."
  ep3_laamp_flavour_ewan.1071.desc.drylands: "trò chơi đuổi bắt hứng khởi, bụi bay và la hét khi bị bắt."
  ep3_laamp_flavour_ewan.1071.desc.outro: "\n\nSau một lúc, [own_child.GetFirstNameNoTooltip] [own_child.Custom('Saying_3p_AwareSight')] ta. [own_child.Custom('GirlBoy')] rạng rỡ nhìn về phía ta, rõ ràng đang do dự giữa việc đưa bạn chơi của [own_child.GetHerHis] quay lại trại hay tiến xa hơn vào vùng hoang dã."
  ep3_laamp_flavour_ewan.1071.tt.every_playing_child: "Mỗi đứa trẻ chơi"
  ep3_laamp_flavour_ewan.1071.a: "Ở trong tầm mắt!"
  ep3_laamp_flavour_ewan.1071.b: "Đi đi, khám phá nào."
  ep3_laamp_flavour_ewan.1071.c: "Trẻ em, vui vì những điều giản dị..."

  ep3_laamp_flavour_ewan.1081.t: "Trưởng Thành"
  ep3_laamp_flavour_ewan.1081.desc: "\"[ROOT.Char.GetMotherFather|U],\" [child.GetFirstName], [child.Custom('GetDaughterSon')] của ta bắt đầu khi [child.GetSheHe] hùng hổ bước đến chỗ ta, \"Con đã quyết định rằng, vì con đã là một [child.GetWomanMan], con sẽ có lều riêng. Con sẽ không chung đụng với bất kỳ ai nữa!\"\n\nĐứa trẻ đứng yên, bài diễn thuyết kết thúc, vẻ thách thức hờn dỗi toát ra từ tư thế của [child.GetHerHis]. Gần như vô thức, ta nhướng mày trước màn thể hiện vô cớ này.\n\n\"Con sẽ không nhượng bộ đâu! Con đã là người lớn và con yêu cầu được đối xử như người lớn!\""
  ep3_laamp_flavour_ewan.1081.a: "Hmm, được rồi. Ngươi đã là [child.GetWomanMan] rồi."
  ep3_laamp_flavour_ewan.1081.b: "Muốn sao? Hãy chứng minh."
  ep3_laamp_flavour_ewan.1081.b.f: "Ngươi đặt thử thách cho [child.Custom('GetDaughterSon')], theo [education_trait|E]."
  ep3_laamp_flavour_ewan.1081.b.tt.success: "[child.GetFirstNameNoTooltip] chiến thắng"
  ep3_laamp_flavour_ewan.1081.b.tt.failure: "[child.GetSheHe|U] không gây ấn tượng"
  ep3_laamp_flavour_ewan.1081.c: "Bah, ngươi vẫn là trẻ con cho tới khi ta nói khác."

  ep3_laamp_flavour_ewan.1091.t: "Bổn Phận Của Mọi Bậc Cha Mẹ"
  ep3_laamp_flavour_ewan.1091.desc: "\"Và nó sẽ không hất con xuống chứ?\" [child.GetFirstName], [child.Custom('GetDaughterSon')] của ta hỏi, cố gắng — nhưng thất bại — trong việc kiềm chế giọng nói run rẩy của [child.GetHerHis].\n\nTa nhìn xuống con ngựa nhỏ mà [child.GetSheHe] đang cưỡi: con vật dễ dạy, hiền lành nhất mà ta có thể tìm thấy trong cả trại. Liệu ngày trước, khi [ROOT.Char.GetMotherFather] dạy ta cưỡi ngựa, ta có sợ hãi như vậy không?\n\n\"O-okay, vậy thì con sẽ thúc nó chạy nước kiệu và...\""
  ep3_laamp_flavour_ewan.1091.tt.success: "Đang làm rồi, [ROOT.Char.Custom('GetMumDad')], đang làm rồi!"
  ep3_laamp_flavour_ewan.1091.tt.failure: "Không-không-không-KHÔNG!"
  ep3_laamp_flavour_ewan.1091.a: "Nhớ, vững vàng nhưng tôn trọng."
  ep3_laamp_flavour_ewan.1091.b: "Đừng sợ vung roi!"
  ep3_laamp_flavour_ewan.1091.c: "Thành thạo ngựa hoặc nó sẽ quăng ngươi."
  ep3_laamp_flavour_ewan.1091.d: "Im lặng."
  ep3_laamp_flavour_ewan.1091.d.tt.success: "[child.GetSheHe|U] xử lý khá tốt"
  ep3_laamp_flavour_ewan.1091.d.tt.failure: "[child.GetFirstNameNoTooltip] không thể tự xoay sở"
  ep3_laamp_flavour_ewan_1091_confidence_gained_modifier: "Tăng Sự Tự Tin"
  ep3_laamp_flavour_ewan_1091_confidence_gained_modifier_desc: "Thật tuyệt khi thế giới mở ra khi Ngài biết cưỡi ngựa."

  ep3_laamp_flavour_ewan.1101.t: "Giúp Đỡ"
  ep3_laamp_flavour_ewan.1101.desc: "Ngay cả khi trại phải dời vị trí mỗi vài đêm, vẫn có những chuyến đi dài hơn — và kèm theo đó là nhiều việc đóng gói hơn.\n\nVới phần lớn những người khuân vác bận xử lý hậu quả của một bữa tiệc đêm qua, Ta phải tự đóng gói hầu hết đồ đạc của mình lần này. Một tình huống đáng tiếc, và đã khiến Ta thở dài không ít lần.\n\nMột cú kéo nhẹ vào tay áo làm Ta chú ý đến sự xuất hiện của [child.Custom('GetDaughterSon')] [child.GetFirstName] bé nhỏ, đang cầm một chiếc áo quần bốc khúc nỗ lực giúp Ta."
  ep3_laamp_flavour_ewan.1101.a: "Con đang làm gì đó, [child.Custom('GetLassLad')] nhỉ?"
  ep3_laamp_flavour_ewan.1101.b: "Đi ra đi, nhóc ranh!"

  ep3_laamp_flavour_ewan.1103.t: "$ep3_laamp_flavour_ewan.1101.t$: Những Thói Quen Cá Nhân"
  ep3_laamp_flavour_ewan.1103.desc.child_younger: "Với lần dời trại tiếp theo vào ngày mai và những người khuân vác lại bận rộn, Ta vào phòng riêng và thấy [child.Custom('GetDaughterSon')] [child.GetFirstName], phủ đầy [ROOT.Char.Custom('GritType')] sau khi chơi ngoài trời, đang cố gắng đóng gói đồ đạc cho Ta.\n\n\"[child.Custom('GetMaMaPaPa')|U]!\" [child.Custom('GirlBoy')] cười tươi, lao tới ôm Ta. Một bàn tay bẩn giữ chiếc mũ yêu thích của Ta đã nhăn nheo và hỏng hóc."
  ep3_laamp_flavour_ewan.1103.desc.child_older: "Bước vào lều của mình trước chuyến di chuyển vào ngày mai, ta không ngạc nhiên khi thấy [child.GetFirstName], [child.Custom('GetDaughterSon')] của ta đã ở đó.\n\nBên cạnh [child.GetHerHim] trên giường của ta là một chồng quần áo đã gấp gọn và những vật dụng cá nhân xếp chồng thô kệch, [child.GetSheHe] tự hào quay lại trình bày thành quả của [child.GetHerHis] với ta.\n\n\"Con đã sắp xếp tất cả theo đúng cách cha/mẹ thích, [child.Custom('GetMumDad')], sắp xong một nửa rồi!\""
  ep3_laamp_flavour_ewan.1103.desc.child_teen: "Mặc dù [child.GetSheHe] giờ đã gần như là một [child.GetWomanMan], một chuyến đi dài đồng nghĩa với việc ta vẫn nhận được sự giúp đỡ đóng gói hành lý từ [child.GetFirstName], [child.Custom('GetDaughterSon')] của mình.\n\nLần này ít nhất ta đã đến đó trước và bắt đầu công việc khi thiếu niên này xuất hiện.\n\n\"Cha/mẹ đáng lẽ nên đợi con chứ!\" [child.GetFirstNameNoTooltip] nửa than vãn, nửa đùa cợt. Tiếng cười chế nhạo của ta làm dấy lên một tiếng kêu phẫn nộ, và món quần áo gấp dở tiếp theo được ném thẳng vào đầu ta thay vì vào giỏ."
  ep3_laamp_flavour_ewan.1103.desc.child_adult: "[child.GetFirstName], [child.Custom('GetDaughterSon')] của ta lẻn vào lều tối nay và thấy ta đang đóng gói hành lý cho chuyến đi ngày mai, mặc dù rõ ràng là làm chậm hơn một chút so với [child.GetHerHim].\n\n[child.GetSheHe|U] không nói gì khi di chuyển đến để giúp ta phân loại đồ đạc, chỉ mỉm cười nhẹ nhàng và ngân nga một giai điệu quen thuộc trong lúc làm việc.\n\n\"Con không thấy mình hơi lớn để làm việc này sao?\" ta hỏi.\n\n\"Cha/mẹ không bao giờ là quá lớn để giúp một [ROOT.Char.GetWomanMan] già đang cần sự giúp đỡ,\" [child.GetFirstNameNoTooltip] khịt mũi đáp lại."
  ep3_laamp_flavour_ewan.1103.a: "Uhh cảm ơn [child.GetFirstNameNoTooltip], giờ đi dọn dẹp đi."
  ep3_laamp_flavour_ewan.1103.b: "Vuốt tóc [child.GetHerHis]."
  ep3_laamp_flavour_ewan.1103.c: "Luôn giúp đỡ như mọi khi!"
  ep3_laamp_flavour_ewan.1103.d: "Cười và ôm [child.GetFirstNameNoTooltip]."
  ep3_laamp_flavour_ewan.1103.e: "Con nên ngừng việc này [child.GetFirstNameNoTooltip]."

  ep3_laamp_flavour_ewan.1104.t: "$ep3_laamp_flavour_ewan.1101.t$: Những Khoảng Vắng Nhỏ"
  ep3_laamp_flavour_ewan.1104.desc.child_dead: "Buổi sáng dời trại thật ảm đạm. Có một khoảng trống không định hình, một sự vắng mặt mà Ta không thể xác định khi chậm rãi đóng gói đồ.\n\nCảm giác như bị xối một xô nước lạnh.\n\n[child.GetFirstName|U]. [child.GetSheHe|U] không ở đây, không giúp Ta. [child.GetSheHe|U] sẽ không bao giờ nữa."
  ep3_laamp_flavour_ewan.1104.desc.child_rival: "Việc đóng gói đồ cho lần di chuyển ngày mai không khó, nhưng Ta vẫn thở dài buồn bã.\n\nViệc này nhắc Ta về [child.Custom('GetDaughterSon')] [child.GetFirstName], về những ngày hạnh phúc khi [child.Custom('GirlBoy')] còn nhỏ và chỉ muốn ở bên [child.GetHerHis] [child.Custom('GetMaPa')].\n\nNgày mà [child.GetSheHe] còn nói chuyện, còn cười với Ta.\n\nNụ cười nhăn răng đó..."
  ep3_laamp_flavour_ewan.1104.a: "Ta đã làm gì..."
  ep3_laamp_flavour_ewan.1104.b: "Ta sẽ trả thù!"
  ep3_laamp_flavour_ewan.1104.c: "#EMP Ừ nhỉ.#!"
  ep3_laamp_flavour_ewan.1104.d: "Cố gắng bước tiếp."

  ep3_laamp_flavour_ewan.1111.t: "Khứu Giác Rắc Rối"
  ep3_laamp_flavour_ewan.1111.desc.intro: "\"[ROOT.Char.GetMotherFather|U]!\" [child.GetFirstName], [child.Custom('GetDaughterSon')] của ta hét lên, lao nhanh về phía ta và suýt chút nữa đâm sầm vào người ta, \"Nhìn xem con tìm thấy gì này! Là một chú CÚN!\"\n\n[child.Custom('GirlBoy')] quả thực trông như thể đang ôm chặt một chú cún mới đẻ mà [child.GetSheHe] đã kẹp chặt vào cánh tay [child.GetHerHis].\n\n\""
  ep3_laamp_flavour_ewan.1111.desc.has_kennels: "Chắc chắn không phải là một trong những chó của chuồng, và,"
  ep3_laamp_flavour_ewan.1111.desc.no_kennels: "[ROOT.Char.GetFaith.KnowledgeGodName] biết đâu [child.GetSheHe] nhặt nó, nhưng,"
  ep3_laamp_flavour_ewan.1111.desc.outro: "bất chấp sự di chuyển lóng ngóng, con vật có vẻ rất phấn khích khi được ở đây. [child.GetFirstNameNoTooltip] trông hạnh phúc hơn bất kỳ lần nào ta thấy trong nhiều tuần qua."
  ep3_laamp_flavour_ewan.1111.a: "Một [child.Custom('GirlBoy')] và chó của [child.GetHerHis]."
  ep3_laamp_flavour_ewan.1111.b: "Giết chú chó con."
  ep3_laamp_flavour_ewan.1111.c: "#EMP Trời ạ#!, con chó mập. Tìm tốt lắm, [child.Custom('GetLassLad')]!"
  ep3_laamp_flavour_ewan.1111.d: "[child.GetFirstNameNoTooltip]! Ngừng chơi với con chó bẩn đó!"

 ##################################################
 # PERSONAL TENSIONS

  ep3_laamp_flavour_ewan.2001.t: "Nhiều Điểm Chung"
  ep3_laamp_flavour_ewan.2001.desc.intro: "Cuộc sống gần gũi thường làm mối quan hệ trở nên rõ rệt hơn, cả tốt lẫn xấu.\n\nMay mắn cho [follower_1.GetFirstName] và [follower_2.GetFirstName], sở thích chung của họ về"
  ep3_laamp_flavour_ewan.2001.desc.lustful: "những trò đùa tục tĩu và những lời bình luận đầy dục vọng"
  ep3_laamp_flavour_ewan.2001.desc.chaste: "kiềm chế bản thân và sự trong trắng trước công chúng"
  ep3_laamp_flavour_ewan.2001.desc.gluttonous: "thức ăn ngon và đồ uống tuyệt vời"
  ep3_laamp_flavour_ewan.2001.desc.temperate: "chế độ ăn điều độ và lối sống lành mạnh"
  ep3_laamp_flavour_ewan.2001.desc.greedy: "vàng bạc và việc tích lũy của cải"
  ep3_laamp_flavour_ewan.2001.desc.generous: "lợi ích của một tấm lòng rộng lượng và cuộc sống vị tha"
  ep3_laamp_flavour_ewan.2001.desc.lazy: "sự khổ sở của lao động cực nhọc và lợi ích của một giấc ngủ ngon"
  ep3_laamp_flavour_ewan.2001.desc.diligent: "thức sớm và làm việc chăm chỉ với tận tâm"
  ep3_laamp_flavour_ewan.2001.desc.wrathful: "bạo lực và nghệ thuật la hét"
  ep3_laamp_flavour_ewan.2001.desc.calm: "giữ thẳng lưng và bình tĩnh trước nghịch cảnh"
  ep3_laamp_flavour_ewan.2001.desc.patient: "lắng nghe lẫn nhau và chờ đợi thời điểm thích hợp"
  ep3_laamp_flavour_ewan.2001.desc.impatient: "luôn hành động khi thời cơ đến,"
  ep3_laamp_flavour_ewan.2001.desc.arrogant: "tự cho mình là siêu việt"
  ep3_laamp_flavour_ewan.2001.desc.humble: "lợi ích của thái độ khiêm tốn và quan điểm nhún nhường"
  ep3_laamp_flavour_ewan.2001.desc.deceitful: "nói dối ngày càng lộng lẫy hơn"
  ep3_laamp_flavour_ewan.2001.desc.honest: "tránh mọi hiểm họa của việc nói dối"
  ep3_laamp_flavour_ewan.2001.desc.craven: "sống để chiến đấu một ngày khác, bất kể thế nào,"
  ep3_laamp_flavour_ewan.2001.desc.brave: "đối mặt thử thách — và kẻ thách thức — trực tiếp bất chấp rủi ro"
  ep3_laamp_flavour_ewan.2001.desc.shy: "tránh những tình huống xã hội ồn ào và tận hưởng sự im lặng"
  ep3_laamp_flavour_ewan.2001.desc.gregarious: "tiếng huyên náo không ngừng và tiếng cười rộ của người luôn hướng ngoại"
  ep3_laamp_flavour_ewan.2001.desc.ambitious: "lợi ích tương lai và những kế hoạch tinh vi"
  ep3_laamp_flavour_ewan.2001.desc.content: "hài lòng với số phận khiêm nhường của mình"
  ep3_laamp_flavour_ewan.2001.desc.arbitrary: "bỏ qua luật lệ khi chúng trở nên phiền phức với họ"
  ep3_laamp_flavour_ewan.2001.desc.just: "tuân thủ luật pháp được chỉ định, thực sự là bất kỳ luật nào,"
  ep3_laamp_flavour_ewan.2001.desc.cynical: "cái nhìn thực tế, trần trụi về cuộc sống"
  ep3_laamp_flavour_ewan.2001.desc.zealous: "tận tâm tuyệt đối với [follower_1.GetFaith.HighGodName]"
  ep3_laamp_flavour_ewan.2001.desc.paranoid: "ngăn chặn mọi mưu đồ của kẻ thù"
  ep3_laamp_flavour_ewan.2001.desc.trusting: "tránh mọi sự phức tạp của mưu mô và nghi ngờ"
  ep3_laamp_flavour_ewan.2001.desc.compassionate: "vẫn quan tâm và đồng cảm trong mọi hoàn cảnh"
  ep3_laamp_flavour_ewan.2001.desc.callous: "cứng rắn với người khác như cuộc đời đã cứng rắn với họ"
  ep3_laamp_flavour_ewan.2001.desc.sadistic: "hài hước độc ác và mặt tối của cuộc sống"
  ep3_laamp_flavour_ewan.2001.desc.stubborn: "vững vàng giữ lập trường bằng mọi giá"
  ep3_laamp_flavour_ewan.2001.desc.fickle: "thay đổi quan điểm một cách thất thường hằng ngày"
  ep3_laamp_flavour_ewan.2001.desc.vengeful: "giữ mọi mối hận thù làm tổn thương họ"
  ep3_laamp_flavour_ewan.2001.desc.forgiving: "buông bỏ hận thù và tha thứ cho kẻ phạm lỗi"
  ep3_laamp_flavour_ewan.2001.desc.eccentric: "những điều lạ lùng, kỳ quặc và kỳ dị hoàn toàn"
  ep3_laamp_flavour_ewan.2001.desc.outro: "đã trở thành chất gắn kết mạnh mẽ.\n\nHai người cười đùa cùng nhau trong trại và cưỡi bên nhau trên đường ngày càng trở nên phổ biến."
  ep3_laamp_flavour_ewan.2001.a: "Khuyến khích Tình bạn."
  ep3_laamp_flavour_ewan.2001.a.tt.success: "Một Tình bạn nở hoa"
  ep3_laamp_flavour_ewan.2001.a.tt.failure: "Lãnh đạo áp bức"
  ep3_laamp_flavour_ewan.2001.b: "Cố gắng chia rẽ họ."
  ep3_laamp_flavour_ewan.2001.b.tt.success: "Một Tình bạn bị phá hủy"
  ep3_laamp_flavour_ewan.2001.b.tt.failure: "$ep3_laamp_flavour_ewan.2001.a.tt.failure$"
  ep3_laamp_flavour_ewan.2001.c: "Tốt cho họ!"

  ep3_laamp_flavour_ewan.2011.t: "Chuyện Trại"
  ep3_laamp_flavour_ewan.2011.desc.intro: "Không hiếm khi nghe tin đồn xoay quanh trại này — hay bất kỳ trại nào. Những ý tưởng gợi dục và lời thì thầm về vụ bê bối có thể kéo dài nhiều buổi tối, và đôi khi chúng còn đúng.\n\nTuần này"
  ep3_laamp_flavour_ewan.2011.desc.affair: "nói về một mối quan hệ lén lút nào đó, dù #EMP ai#! là người gian dối vẫn là vấn đề tranh luận học thuật giả và đôi khi kèm tiếng cười ầm ĩ."
  ep3_laamp_flavour_ewan.2011.desc.petty_theft: "liên quan đến [victim.GetFirstName], người được cho là đã mất một vài khoản tiền nhỏ gần đây. Ít nhất vài người khẳng định đã thấy một bóng người quanh lều [victim.GetHerHis], cố tình nhắm vào [victim.GetWomanMan]."
  ep3_laamp_flavour_ewan.2011.desc.cruel_pranks: "nói về chuỗi rủi ro xui xẻo với [victim.GetFirstName]. Tai nạn bất hạnh, xấu xa, hay xấu hổ cứ #EMP xảy ra#! với [victim.GetWomanMan], và lời đồn cho rằng chúng có thể là cố ý."
  ep3_laamp_flavour_ewan.2011.desc.nasty_rumours: "là nghịch lý: nhiều người bàn về thói quen xấu của [victim.GetFirstName], nhưng vài người nghi ngờ, cho rằng [victim.GetSheHe] chỉ là nạn nhân của chiến dịch bôi nhọ."
  ep3_laamp_flavour_ewan.2011.desc.hidden_feud: "ngụ ý rằng hai người trong đám đông đang âm thầm chiến đấu với nhau, nhưng cả hai giữ bí mật để tránh bị phát hiện và trừng phạt vì kỷ luật kém."
  ep3_laamp_flavour_ewan.2011.desc.outro: "\n\nKhông phải việc tốt để người ta thêu dệt chỉ để giải trí, nhưng chuyện phiếm hiếm khi tốt đẹp."
  ep3_laamp_flavour_ewan.2011.a: "Điều tra sự thật."
  ep3_laamp_flavour_ewan.2011.a.tt.explanation: "Nếu tin đồn không đúng, Ngài sẽ không tìm thấy gì ngay cả khi thành công"
  ep3_laamp_flavour_ewan.2011.a.tt.success: "Ngài điều tra thành công"
  ep3_laamp_flavour_ewan.2011.a.tt.failure: "Ai mà biết điều gì là thật?"
  ep3_laamp_flavour_ewan.2011.b: "Đồng ý với những cáo buộc vô căn cứ."
  ep3_laamp_flavour_ewan.2011.c: "Để yên cho mọi việc."
  ep3_laamp_flavour_ewan_2011_source_of_truth_modifier: "Nguồn chân lý"
  ep3_laamp_flavour_ewan_2011_source_of_truth_modifier_desc: "Một khi bậc quân vương đã phán, điều đó hiển nhiên là sự thật."
  ep3_laamp_flavour_ewan_2011_truth_hound_modifier: "Kẻ tầm nã chân tướng"
  ep3_laamp_flavour_ewan_2011_truth_hound_modifier_desc: "Nhân vật này nổi danh với việc truy lùng mọi tin đồn cho đến khi tận tường gốc rễ."

  ep3_laamp_flavour_ewan.2012.t: "$ep3_laamp_flavour_ewan.2011.t$: Người Yêu Bí Mật"
  ep3_laamp_flavour_ewan.2012.desc: "Cuộc điều tra khéo léo của một thám tử tài giỏi luôn đem lại kết quả.\n\nGặp [lover_1.GetFirstName] và [lover_2.GetFirstName], đang trong vòng tay #EMP thân mật#! phía sau [ROOT.Char.Custom('GetRandomCampBuilding')], Ta chỉ kịp nhìn trong chốc lát trước khi họ nhận ra và vội chỉnh lại trang phục.\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip], xin, con cầu xin ngài\", thì thầm-rên [lover.GetFirstNameNoTooltip], \"đừng tiết lộ chúng con với trại — những người khác sẽ không hiểu.\""
  ep3_laamp_flavour_ewan.2012.a: "Tiết lộ ngay lập tức."
  ep3_laamp_flavour_ewan.2012.b: "Giữ bí mật — tạm thời."

  ep3_laamp_flavour_ewan.2013.t: "$ep3_laamp_flavour_ewan.2011.t$: Trộm Vặt"
  ep3_laamp_flavour_ewan.2013.desc: "Chỉ cần một cái bẫy đơn giản là đủ để bắt quả tang [thief.GetFirstName] — ta yêu cầu [victim.GetFirstName] để lều của [victim.GetHerHis] một cách lộ liễu, cửa mở, những đồng tiền chất đống ngăn nắp trên một chiếc ghế đẩu bên trong.\n\nSau một phút để chắc chắn rằng [victim.GetFirstNameNoTooltip] sẽ không quay lại ngay, tên trộm lẻn ra khỏi nơi ẩn náu của [thief.GetHerHis] gần đó, chỉ để quay lại và bắt gặp ta đang đứng đó, khoanh tay [ROOT.Char.Custom('ArmArms')].\n\n\"T- con thề không phải như cha/mẹ nghĩ đâu! Con chỉ đang đùa [victim.GetFirstNameNoTooltip] thôi!\" tên trộm kêu lên. Một tiếng khịt mũi nghe rõ từ [victim.GetFirstNameNoTooltip] đang quay lại cho thấy [victim.GetSheHe] không thấy trò đùa này hài hước chút nào."
  ep3_laamp_flavour_ewan.2013.a: "Trừng phạt [thief.GetFirstNameNoTooltip]."
  ep3_laamp_flavour_ewan.2013.b: "Bao che cho [thief.GetFirstNameNoTooltip]."
  ep3_laamp_flavour_ewan.2013.c: "Để sự thật được biết, nhưng dừng lại ở đó."

  ep3_laamp_flavour_ewan.2014.t: "$ep3_laamp_flavour_ewan.2011.t$: Trò Đùa Tàn Nhẫn"
  ep3_laamp_flavour_ewan.2014.desc: "Chỉ cần hỏi vài câu, [prankster.GetFirstName] hiện ra là thủ phạm rõ ràng nhất — [prankster.GetSheHe] đã được thấy gần hầu hết các #EMP tai nạn đáng chú ý#!, trước, sau, hoặc trong khi xảy ra, thường không rõ lý do.\n\n\"Vâng, Ta đã trêu [victim.GetFirstName] vài trò. Sai lầm đến vậy sao? [victim.GetSheHe|U] thật phiền toái, và theo kiểm tra trước, trò đùa lẻ tẻ không đủ để biến ai đó thành kẻ ngoài vòng pháp luật.\""
  ep3_laamp_flavour_ewan.2014.a: "Trừng phạt [prankster.GetFirstNameNoTooltip]."
  ep3_laamp_flavour_ewan.2014.b: "Bao che cho [prankster.GetFirstNameNoTooltip]."
  ep3_laamp_flavour_ewan.2014.c: "Để sự thật được biết, nhưng dừng lại ở đó."

  ep3_laamp_flavour_ewan.2015.t: "$ep3_laamp_flavour_ewan.2011.t$: Người Thêu Dệt Tin Đồn"
  ep3_laamp_flavour_ewan.2015.desc: "Không mất nhiều thời gian để ta dễ dàng chỉ mặt điểm tên [rumourmonger.GetFirstName], và khi bị đối chất về vấn đề này, [rumourmonger.GetSheHe] thừa nhận ngay lập tức, không hề hối lỗi.\n\n\"Thì sao nếu ta có phóng đại một hai chuyện về cái tên [victim.Custom2('InsultNoun', SCOPE.sC('rumourmonger'))] huênh hoang đó. [victim.GetSheHe|U] là một kẻ ngốc và một kẻ đê tiện, và không lời nói dối nào về [victim.GetHerHim] có thể tệ hơn sự thật cả.\"\n\n[victim.GetFirstName] phẫn nộ đứng phía sau ta, gần như sẵn sàng bóp cổ tên [rumourmonger.GetWomanMan] này."
  ep3_laamp_flavour_ewan.2015.a: "Trừng phạt [rumourmonger.GetFirstNameNoTooltip]."
  ep3_laamp_flavour_ewan.2015.b: "Bao che cho [rumourmonger.GetFirstNameNoTooltip]."
  ep3_laamp_flavour_ewan.2015.c: "Để sự thật được biết, nhưng dừng lại ở đó."

  ep3_laamp_flavour_ewan.2016.t: "$ep3_laamp_flavour_ewan.2011.t$: Mâu Thuẫn Bí Mật"
  ep3_laamp_flavour_ewan.2016.desc: "Nhìn lại, có lẽ đã rõ ràng rằng [rival_1.GetFirstName] và [rival_2.GetFirstName] đang kình chống nhau.\n\nKhi Ngài tìm họ, dấu hiệu thù ghét giữa hai người rõ như ban ngày, dù khi bị gọi đối chất, cả hai #EMP khăng khăng#! rằng không để ảnh hưởng đến trại.\n\nTrong không gian chật hẹp như thế này, câu chuyện nghe #EMP khó tin#!."
  ep3_laamp_flavour_ewan.2016.a: "Cố gắng hòa giải hai người."
  ep3_laamp_flavour_ewan.2016.a.tt.success: "Căng thẳng dịu xuống"
  ep3_laamp_flavour_ewan.2016.a.tt.failure: "Chỉ làm tình hình tệ hơn"
  ep3_laamp_flavour_ewan.2016.b: "Ngài sẽ không để chuyện này lan ra, hiểu chưa?"

  ep3_laamp_flavour_ewan.2017.t: "$ep3_laamp_flavour_ewan.2011.t$: Không Có Gì Ở Đây"
  ep3_laamp_flavour_ewan.2017.desc.affair: "Dù có nhiều chuyện tình, những cuộc phiêu lưu lãng mạn dưới trăng phía sau [ROOT.Char.Custom('GetRandomCampBuilding')], và những ánh mắt lén lút qua bữa tối, tình yêu ở [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] dường như... đúng chuẩn."
  ep3_laamp_flavour_ewan.2017.desc.petty_theft: "Bất chấp những lời kêu ca của [victim.GetFirstNamePossessive] trái ngược lại, không có nhân chứng tin cậy nào có thể mô tả những đặc điểm chung của kẻ bí ẩn được cho là đang cướp sạch [victim.GetHerHim], và ngay cả [victim.GetSheHe] cũng chật vật để kiểm kê những mất mát của [victim.GetHerHis]."
  ep3_laamp_flavour_ewan.2017.desc.cruel_pranks: "Ta buộc phải kết luận [victim.GetFirstName] chỉ vụng về, xui xẻo, hoặc cả hai. Không có quy luật hay nghi phạm rõ ràng cho những rắc rối nhỏ của [victim.GetHerHis]."
  ep3_laamp_flavour_ewan.2017.desc.nasty_rumours: "[victim.GetFirstName|U] có thể là yếu tố gây rắc rối. Mọi đầu mối về kẻ muốn hại [victim.GetHerHim] tan biến khi kiểm tra kỹ, trong khi những câu chuyện về lỗi lầm của [victim.GetHerHis] chỉ tăng lên."
  ep3_laamp_flavour_ewan.2017.desc.hidden_feud: "Mâu thuẫn bí mật? Ý tưởng rằng hai người có thể kiềm chế cơn giận khi ăn tối, chưa kể bí mật mà vẫn làm phiền nhau, thật buồn cười. Không với đám trò hề Ta đi cùng."
  ep3_laamp_flavour_ewan.2017.desc.duel.won: "\n\nCuộc điều tra kỹ lưỡng không tìm ra gì, nhưng Ta vẫn hài lòng. Nếu có gì để tìm, Ta đã tìm ra từ lâu."
  ep3_laamp_flavour_ewan.2017.desc.duel.lost: "\n\nTa đã cố hết sức, nhưng chỉ khai thác thêm tin đồn và lời đồn đại.\n\nNgười ta nhận ra khi [ROOT.Char.GetTitleAsNameNoTooltip] đang dò xét, điều đó lại kích thích thêm bình luận vô căn cứ."
  ep3_laamp_flavour_ewan.2017.a: "Ta hài lòng, ít nhất là vậy."
  ep3_laamp_flavour_ewan.2017.b: "Dù sao Ta cũng không quan tâm…"

  ep3_laamp_flavour_ewan.2021.t: "Gắn Kết"
  ep3_laamp_flavour_ewan.2021.desc: "Là [ROOT.Char.GetTitleAsNameNoTooltip] của trại này, khi hai người theo Ta nổi bật mong kết hôn, Ta có quyền quyết định cuối cùng. Họ sống dưới sự bảo hộ của Ta, đi trên thú của Ta, và ăn cùng Ta.\n\nHôm nay cặp đôi hy vọng là [follower_1.GetFirstName] và [follower_2.GetFirstName], và mọi thứ đã sẵn sàng, chỉ chờ Ta gật đầu — hoặc ra tín hiệu phản đối."
  ep3_laamp_flavour_ewan.2021.a: "Cho phép kết hợp."
  ep3_laamp_flavour_ewan.2021.b: "Cho phép, nhưng không có nghi lễ chính thức."
  ep3_laamp_flavour_ewan.2021.c: "Cấm họ."
  ep3_laamp_flavour_ewan.2021.c.tt: "Bảo các đôi yêu nhau ngừng gặp nhau hiếm khi hiệu quả hoàn toàn"

  ep3_laamp_flavour_ewan.2031.t: "Chấm Dứt Với Ngươi"
  ep3_laamp_flavour_ewan.2031.desc.intro: "\"... và những bài phát biểu rên rỉ, khúm núm, những cuộc hành quân chết chóc vô nghĩa, và sự thất bại hoàn toàn của ngươi với vai trò [ROOT.Char.GetTitleAsNameNoTooltip]! Ngươi có nghe không? Ta #EMP chấm dứt rồi!#\" la lên [firebrand.GetFirstName], [firebrand.Custom('ArmArms')] vung vẩy dữ dội khi [firebrand.GetSheHe] trình diễn trước đám đông.\n\n"
  ep3_laamp_flavour_ewan.2031.desc.waverers.some: "Nhiều người theo Ta cũng tỏ vẻ bực dọc, dường như sẵn sàng đi cùng [firebrand.GetFirstNameNoTooltip] — #EMP nếu#! [firebrand.GetSheHe] được phép."
  ep3_laamp_flavour_ewan.2031.desc.waverers.none: "Phần còn lại của người theo dõi dường như không cảm thông. Dù [firebrand.GetHerHis] nổi giận về cái ác của Ta, [firebrand.GetFirstNameNoTooltip] là kẻ duy nhất ghét Ta dữ dội như vậy."
  ep3_laamp_flavour_ewan.2031.tt.success.wavering_courtiers: "Tất cả [followers|E] dao động"
  ep3_laamp_flavour_ewan.2031.tt.failure.wavering_courtiers_move_to_pool: "$ep3_laamp_flavour_ewan.2031.tt.success.wavering_courtiers$"
  ep3_laamp_flavour_ewan.2031.a: "Có lẽ ta có thể thuyết phục ngươi…"
  ep3_laamp_flavour_ewan.2031.a.tt.success: "Ngươi dịu bớt bất mãn"
  ep3_laamp_flavour_ewan.2031.a.tt.failure: "Lời vô ích từ một [ROOT.Char.GetWomanMan] vô dụng"
  ep3_laamp_flavour_ewan.2031.b: "Ngươi không đi đâu, xích [firebrand.GetHerHim] lại!"
  ep3_laamp_flavour_ewan.2031.c: "Đi nếu muốn, nhưng không được mang gì hay ai theo."
  ep3_laamp_flavour_ewan.2031.c.tt.success: "Ngươi nhìn [firebrand.GetHerHim] chằm chằm"
  ep3_laamp_flavour_ewan.2031.c.tt.failure: "Sự kiêu ngạo khiến nhiều người thay đổi quyết định"
  ep3_laamp_flavour_ewan.2031.d.multi: "Đi đi, tất cả các ngươi."
  ep3_laamp_flavour_ewan.2031.d.solo: "Đi đi."

  ep3_laamp_flavour_ewan.2041.t: "Gần Gũi Hơn"
  ep3_laamp_flavour_ewan.2041.desc: "Giữa sự hỗn loạn của việc liên tục dời trại và dòng người mới đến mỗi thị trấn, có nhiều thời gian trong ngày để người theo phát hiện ra kết nối bất ngờ với ai đó mới lạ.\n\nDựa vào trò đùa chung, lời thì thầm trao nhau, và đôi lúc lén lút đi xa, có vẻ [follower_1.GetFirstName] và [follower_2.GetFirstName] đang rơi vào tình huống này.\n\nRõ ràng đôi chim yêu nghĩ mình lén lút. Họ không phải."
  ep3_laamp_flavour_ewan.2041.a: "Đẩy họ ra xa nhau."
  ep3_laamp_flavour_ewan.2041.a.tt.success: "Tình yêu tàn lụi"
  ep3_laamp_flavour_ewan.2041.a.tt.failure: "Trái tim muốn gì thì muốn đó"
  ep3_laamp_flavour_ewan.2041.b: "Thật ra không phải chuyện của ta."

  ep3_laamp_flavour_ewan.2051.t: "Có Ý Nghĩa Gì?"
  ep3_laamp_flavour_ewan.2051.desc.intro: "[smelly.GetFirstName|U] đã ngừng tắm rửa. Ngừng thậm chí cố gắng làm sạch [smelly.GetHerselfHimself], sự thật này khiến Ta bị đối mặt tàn nhẫn khi một số người theo Ta van xin Ta xử lý [smelly.GetHerHim].\n\n\"Ta biết ngươi đang nghĩ gì, [ROOT.Char.GetTitleAsName], nhưng không phải là lười biếng đâu.\""
  ep3_laamp_flavour_ewan.2051.desc.diligent_and_humble: "Ngược lại hoàn toàn! Ta là một [smelly.GetWomanMan] giản dị, tận tụy với nhiệm vụ, và thời gian trong ngày có hạn. Tại sao phải bận tâm làm sạch khi bụi đường ngày mai sẽ bám đầy vào sáng mai cơ chứ?\""
  ep3_laamp_flavour_ewan.2051.desc.athletic: "Ta dành ngày của mình để đi bộ, chạy, hay cưỡi ngựa, tất cả vì lợi ích trại, vì thế việc Ta có một chút mùi #EMP mồ hôi#! là điều tự nhiên. Liệu việc từ bỏ những vẻ ngoài giả tạo có thực sự sai sao?\""
  ep3_laamp_flavour_ewan.2051.desc.gregarious: "Ta là tâm điểm mọi bữa tiệc và được mọi người yêu mến từ vòng trong đến người theo ít quan trọng nhất, ít nhất là Ta nghĩ vậy, điều này giúp tinh thần mọi người. Liệu có quan trọng nếu Ta lấm bùn và mồ hôi khi mang lại niềm vui?\""
  ep3_laamp_flavour_ewan.2051.desc.lazy: "Đó là... một cách để tối ưu hóa? Ta có thể làm #EMP nhiều#! việc hơn nếu dành ít thời gian lau mồ hôi đường đi. Đây là sự tập trung tuyệt đối vào giá trị."
  ep3_laamp_flavour_ewan.2051.desc.outro: "\n\n[smelly.GetSheHe|U] điên. Hoặc ngu. Hoặc cả hai."
  ep3_laamp_flavour_ewan.2051.a.diligent_and_humble: "Đây không phải là việc nhỏ để bỏ qua."
  ep3_laamp_flavour_ewan.2051.a.athletic: "Mồ hôi thường xuyên cần tắm thường xuyên, chết tiệt."
  ep3_laamp_flavour_ewan.2051.a.gregarious: "Chết tiệt, nghĩ đến mọi người khác đi!"
  ep3_laamp_flavour_ewan.2051.a.lazy: "Sự lười biếng của ngươi đi quá xa!"
  ep3_laamp_flavour_ewan.2051.b: "Ngươi nói có lý."
  ep3_laamp_flavour_ewan.2051.c: "Chỉ cần đi trước — #EMP thật xa#!"
  ep3_laamp_flavour_ewan_2051_is_stinker_modifier: "Hôi Hám"
  ep3_laamp_flavour_ewan_2051_is_stinker_modifier_desc: "Nhân vật này, dù có nhiều lời phàn nàn, rất ngại tắm rửa."
  ep3_laamp_flavour_ewan_2051_disciplined_stinker_modifier: "Kỷ Luật Vệ Sinh"
  ep3_laamp_flavour_ewan_2051_disciplined_stinker_modifier_desc: "Nhân vật này không có thời gian cho những kẻ mồ hôi vô kỷ luật."
  ep3_laamp_flavour_ewan_2051_joined_stinker_modifier: "Cũng Hôi Hám"
  ep3_laamp_flavour_ewan_2051_joined_stinker_modifier_desc: "Nhân vật này chọn tham gia cùng một trong những người theo họ trong việc từ bỏ tắm rửa."

  ep3_laamp_flavour_ewan.2061.t: "Chỗ Của Ta"
  ep3_laamp_flavour_ewan.2061.desc: "\"Dẹp cái lều chết tiệt của ngươi đi, chết tiệt thật, [thief.GetFirstName]! Đây là chỗ của ta!\" [victim.GetFirstName] hét lên, làm gián đoạn buổi tản bộ tối của ta. [thief.GetFirstNameNoTooltip|U] dường như không lay chuyển, chỉ đơn giản khoanh [thief.GetHerHis] [thief.Custom('ArmArms')] trước ngực.\n\n\"Đó không thể là chỗ của ngươi nếu #EMP lều của ta#! đang dựng ở đó, phải không?\" [thief.GetSheHe] mỉa mai đáp lại.\n\nTuyệt vọng tìm kiếm một cơ quan thẩm quyền cao hơn, [victim.GetFirstNameNoTooltip] quay phắt sang ta: \"[ROOT.Char.GetTitledFirstName], làm ơn, ta cầu xin ngài, hãy kỷ luật tên #EMP khốn nạn#! này.\""
  ep3_laamp_flavour_ewan.2061.a: "Theo phe [victim.GetFirstNameNoTooltip]."
  ep3_laamp_flavour_ewan.2061.b: "Theo phe [thief.GetFirstNameNoTooltip]."
  ep3_laamp_flavour_ewan.2061.c: "Chúng ta có luật vì lý do, [thief.GetFirstNameNoTooltip]."
  ep3_laamp_flavour_ewan.2061.d: "Tự các ngươi giải quyết với nhau."

  ep3_laamp_flavour_ewan.2071.t: "Thứ Hai Trong Chỉ Huy"
  ep3_laamp_flavour_ewan.2071.desc.sic_exists: "Không có gì bí mật rằng [current_sic.GetFirstName] có lẽ không phải là người thứ hai tốt nhất Ta có thể có."
  ep3_laamp_flavour_ewan.2071.desc.sic_vacant: "Một thời gian dài nay, vị trí thứ hai của Ta vẫn bỏ trống."
  ep3_laamp_flavour_ewan.2071.desc.outro: "Sự bất mãn với tình trạng này cuối cùng đã lên đến đỉnh điểm, đủ để ba ứng cử viên bước lên tự đề cử mình cho vai trò này.\n\n[candidate_1.GetFirstName], người đề nghị thề trung thành với ta đến hơi thở cuối cùng của [candidate_1.GetHerHis].\n\n[candidate_2.GetFirstName], người có vẻ như sắp sửa làm việc đến kiệt sức vì ta.\n\nVà tất nhiên, [candidate_3.GetFirstName] — chắc chắn là người có năng lực tốt nhất trại cho vai trò này."
  ep3_laamp_flavour_ewan.2071.a: "Chấp nhận trung thành của [candidate_1.GetFirstNamePossessiveNoTooltip]."
  ep3_laamp_flavour_ewan.2071.a.tt.candidate_aptitude: "[candidate_1.GetFirstNamePossessive] [aptitude|E] sẽ là [candidate_1.GetCourtPositionAptitude( GetCourtPositionType( 'second_camp_officer') )]"
  ep3_laamp_flavour_ewan.2071.b: "Lợi dụng tinh thần làm việc của [candidate_2.GetFirstNamePossessiveNoTooltip]."
  ep3_laamp_flavour_ewan.2071.b.tt.candidate_aptitude: "[candidate_2.GetFirstNamePossessive] [aptitude|E] sẽ là [candidate_2.GetCourtPositionAptitude( GetCourtPositionType( 'second_camp_officer') )]"
  ep3_laamp_flavour_ewan.2071.c: "Dùng kỹ năng rõ rệt của [candidate_3.GetFirstNamePossessiveNoTooltip]."
  ep3_laamp_flavour_ewan.2071.c.tt.candidate_aptitude: "[candidate_3.GetFirstNamePossessive] [aptitude|E] sẽ là [candidate_3.GetCourtPositionAptitude( GetCourtPositionType( 'second_camp_officer') )]"
  ep3_laamp_flavour_ewan.2071.d.post_filled: "[current_sic.GetFirstNameNoTooltip] sẽ giữ vị trí của [current_sic.GetHerHis]!"
  ep3_laamp_flavour_ewan.2071.d.post_empty: "Vị trí này sẽ vẫn bỏ trống."
  ep3_laamp_flavour_ewan_2071_b_work_self_to_death_modifier: "Làm Việc Quá Sức"
  ep3_laamp_flavour_ewan_2071_b_work_self_to_death_modifier_desc: "\"Nghỉ ngơi\" là cái cớ mà những kẻ lười biếng cực đoan cho phép bản thân như một sự xa xỉ."

  ep3_laamp_flavour_ewan.2081.t: "Cỗ Máy Hoạt Động Trơn Tru"
  ep3_laamp_flavour_ewan.2081.desc.intro: "Rừng lều nhỏ của chúng Ta dựng lên mỗi vài buổi tối là điều mà chúng Ta đã trở nên rất giỏi gần đây. Lều này, rồi lều khác, rồi lại lều khác, với mọi người và dụng cụ lan ra dọc hàng để giúp hàng xóm trong mô hình tốc độ và hiệu quả.\n\n"
  ep3_laamp_flavour_ewan.2081.desc.dislike: "Ngay cả [follower_1.GetFirstName] và [follower_2.GetFirstName], vốn trước đây không hòa thuận, cũng giúp nhau tối nay, cười như Ngài cũ."
  ep3_laamp_flavour_ewan.2081.desc.like: "[follower_1.GetFirstName] và [follower_2.GetFirstName], vốn tương tác tốt trước đây, dường như đặc biệt gắn bó tối nay khi giúp nhau."
  ep3_laamp_flavour_ewan.2081.desc.neutral: "Ngay cả [follower_1.GetFirstName] và [follower_2.GetFirstName], vốn không thường xuyên đi cùng vòng tròn, cũng hợp tác lặng lẽ khi giúp nhau."
  ep3_laamp_flavour_ewan.2081.desc.outro: "\n\nMọi thứ có chỗ của nó, và mọi thứ đều tại chỗ của nó."
  ep3_laamp_flavour_ewan.2081.a: "Ngươi có cần thêm tay giúp không?"
  ep3_laamp_flavour_ewan.2081.b: "Sau khi xong việc, đi giúp dựng lều của ta."
  ep3_laamp_flavour_ewan.2081.c: "Hmmm... không thích, tách họ ra."
  ep3_laamp_flavour_ewan.2081.d: "Như nên thế."
  ep3_laamp_flavour_ewan.2081.e: "Thật tốt khi thấy hai người đó hợp tác!"
  ep3_laamp_flavour_ewan_2081_d_well_oiled_operation_modifier: "Hoạt Động Trơn Tru"
  ep3_laamp_flavour_ewan_2081_d_well_oiled_operation_modifier_desc: "Trại của nhân vật này hoạt động như bánh xe trebuchet được bôi trơn tốt."

  ep3_laamp_flavour_ewan.2091.t: "Tội Ái Nhiệt"
  ep3_laamp_flavour_ewan.2091.desc: "Quanh đống lửa trại, một vài người theo hầu chia sẻ bữa tối của họ.\n\nĐiều kỳ lạ là, [attacker.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('attacker'))] của ta và [defender.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('defender'))] của ta lại ngồi cùng nhau — bất chấp sự ghét bỏ lẫn nhau của họ.\n\n[defender.GetFirstNameNoTooltip|U] lẩm bẩm điều gì đó trong hơi thở của [defender.GetHerHis]. Dù là gì, nó cũng khiến [attacker.GetFirstNameNoTooltip] nổi giận lôi đình. Thép lóe sáng. Máu sắp đổ rồi."
  ep3_laamp_flavour_ewan.2091.tt.duel_commences: "[attacker.GetFirstName] và [defender.GetFirstName] sẽ ngay lập tức đấu đến chết"
  ep3_laamp_flavour_ewan.2091.a: "Can thiệp."
  ep3_laamp_flavour_ewan.2091.a.tt.success: "Ngươi chặn được việc này"
  ep3_laamp_flavour_ewan.2091.a.tt.failure: "Vẫn có vài nhát được đánh ra"
  ep3_laamp_flavour_ewan.2091.b: "Sao không giải quyết bằng một trận đấu công bằng?"
  ep3_laamp_flavour_ewan.2091.c: "Bắt [attacker.GetFirstNameNoTooltip]! Xử vào cọc!"
  ep3_laamp_flavour_ewan.2091.d: "Để họ tự giải quyết."
 
  ep3_laamp_flavour_ewan.2092.tt.attacker_won: "[attacker.GetFirstNameNoTooltip] Thắng"
  ep3_laamp_flavour_ewan.2092.tt.attacker_won.tt: "[attacker.GetSheHe|U] giết [defender.GetFirstName]"
  ep3_laamp_flavour_ewan.2092.tt.defender_won: "[defender.GetFirstNameNoTooltip] Thắng"
  ep3_laamp_flavour_ewan.2092.tt.defender_won.tt: "[defender.GetSheHe|U] giết [attacker.GetFirstName] để tự vệ"

 ##################################################
 # CAMP PURPOSE

  ep3_laamp_flavour_ewan.3001.t: "Nghe Danh Ngươi"
  ep3_laamp_flavour_ewan.3001.desc.intro: "Theo một lính gác, Ta bước vào một lều ánh sáng mờ bên cạnh [ROOT.Char.Custom('GetRandomCampBuilding')], nơi một bộ ba người bản địa lôi thôi đang chờ Ta. Họ [ROOT.Char.Custom('SenseObserve_SeemLook')] có vẻ lo lắng, như thể ở đây là một rủi ro.\n\nMột trong số họ đứng lên, trước khi cúi chào thực sự #EMP kinh khủng#! với Ta. \"Kính chào [ROOT.Char.GetLadyLord]ship của ngài, tên Ta là [brains.GetFirstName]. Kẻ to con là [brawn.Custom('GetLassLad')] [brawn.GetFirstName], và kẻ còn lại là [fingers.GetFirstName]. Chúng Ta đến để gia nhập.\""
  ep3_laamp_flavour_ewan.3001.desc.legendary: "\"Chúng Ta là nghệ sĩ trong tâm hồn — dù là dao, thòng lọng hay mũi tên khía răng — và không thể nghĩ ra ai xứng đáng hơn [ROOT.Char.Custom('MistressMaster')] cho tài năng của chúng Ta.\""
  ep3_laamp_flavour_ewan.3001.desc.exalted: "\"Chúng Ta nghiêm túc với những gì mình làm, và điều đó có nghĩa là không để kiêu hãnh khiến bỏ lỡ cơ hội cả đời. Hãy dẫn chúng Ta theo, và chúng Ta sẽ đánh cắp thế giới cho ngươi.\""
  ep3_laamp_flavour_ewan.3001.desc.illustrious: "\"Chúng Ta là cá lớn nhất ao này — cho đến khi ngươi xuất hiện. Không sao cả. Kinh doanh là kinh doanh, chẳng có lý gì cạnh tranh khi chúng ta có thể hợp tác.\""
  ep3_laamp_flavour_ewan.3001.desc.distinguished: "\"Chúng Ta đã nghe danh ngươi từ khi ngươi đến đây, và nghĩ rằng chúng Ta có thể thực sự là tài sản cho hoạt động của ngươi.\""
  ep3_laamp_flavour_ewan.3001.desc.established: "\"Chúng Ta là những người làm việc chăm chỉ — ít nhất trong #EMP lĩnh vực#! của chúng Ta — và theo cách nhìn của chúng Ta, ngươi có thể dùng chút trợ giúp để xây dựng danh tiếng và làm đầy túi của ngươi.\""
  ep3_laamp_flavour_ewan.3001.desc.disgraced: "\"Chúng Ta ừm... đã gặp rắc rối với luật pháp ở [current_county.GetBaseNameNoTier] quá nhiều lần và đang tìm bất cứ con đường thoát nào khỏi đây. Băng nhóm của ngươi có vẻ tốt như bất cứ nhóm nào.\""
  ep3_laamp_flavour_ewan.3001.a: "Chắc chắn, chúng Ta sẽ nhận ngươi..."
  ep3_laamp_flavour_ewan.3001.b: "... nhưng trước hết ngươi phải đóng vào #EMP quỹ#!"
  ep3_laamp_flavour_ewan.3001.b.tt.success: "Họ trút hết đồ dự trữ cho ngươi"
  ep3_laamp_flavour_ewan.3001.b.tt.failure: "Thì ra kẻ cắp cũng chẳng có danh dự!"
  ep3_laamp_flavour_ewan.3001.c: "Hừ, cút đi các tên chó ghẻ."

  ep3_laamp_flavour_ewan.3011.t: "Tranh Luận Về Sự Vứt Bỏ"
  ep3_laamp_flavour_ewan.3011.desc: "Có quan điểm, sẽ tranh luận.\n\nMột chân lý đơn giản cho bất kỳ cuộc tụ họp nào có hơn hai người học thuật, và chắc chắn ở [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] có nhiều hơn hai người như vậy.\n\nTối nay, có hai cuộc thảo luận chồng chéo — và khá ồn ào — đang diễn ra: một về hùng biện và chính trị tinh tế với [eloquent_follower.GetFirstName], và một về lịch sử và tri thức triết học với [wise_follower.GetFirstName]."
  ep3_laamp_flavour_ewan.3011.a: "[eloquent_follower.GetFirstNameNoTooltip] thật thú vị..."
  ep3_laamp_flavour_ewan.3011.a.tt.success: "Một cuộc tranh luận để đời"
  ep3_laamp_flavour_ewan.3011.a.tt.failure: "Những lời hay và cuộc trò chuyện tinh tế"
  ep3_laamp_flavour_ewan.3011.b: "Tâm trí [wise_follower.GetFirstNamePossessiveNoTooltip] sẽ kích thích Ta!"
  ep3_laamp_flavour_ewan.3011.b.tt.success: "Một cuộc thảo luận sáng tỏ"
  ep3_laamp_flavour_ewan.3011.b.tt.failure: "Những lời lan man thú vị"
  ep3_laamp_flavour_ewan.3011.c: "Thưởng thức hỗn loạn học thuật."
  ep3_laamp_flavour_ewan.3011.d: "Gật gù theo lời nói."
  ep3_laamp_flavour_ewan_3011_d_presiding_over_lively_debates_modifier: "Chủ Trì Tranh Luận Sôi Nổi"
  ep3_laamp_flavour_ewan_3011_d_presiding_over_lively_debates_modifier_desc: "Thật sốc khi thấy các học giả có thể ồn ào đến mức nào khi tập trung vào nó."
  ep3_laamp_flavour_ewan_3011_d_presiding_over_debates_modifier: "Chủ Trì Tranh Luận"
  ep3_laamp_flavour_ewan_3011_d_presiding_over_debates_modifier_desc: "Một chút kiến thức mang lại nhiều giá trị."

  ep3_laamp_flavour_ewan.3021.t: "Qua Chân Trời"
  ep3_laamp_flavour_ewan.3021.desc: "Ngồi trong lều, Ta lật xem sổ sách, bản đồ và bản thảo chi tiết về các vương quốc xa xôi. Những câu chuyện hấp dẫn họ kể, những nơi #EMP kỳ lạ#! mà thế giới này mang đến...\n\nTa tự hỏi, liệu người dân họ có nghe những câu chuyện về chúng ta không? Ta đang phân tích chỉ là tin đồn hay những câu chuyện thật — và tuyệt vời — về những nơi dường như xa khỏi tầm nhìn của [ROOT.Char.GetFaith.HighGodNamePossessive]?"
  ep3_laamp_flavour_ewan.3021.tt.kingdom_1.contracts_appear: "Một số hợp đồng giá trị cao sẽ xuất hiện ở [kingdom_1.GetDefinitiveName]"
  ep3_laamp_flavour_ewan.3021.tt.kingdom_2.contracts_appear: "Một số hợp đồng giá trị cao sẽ xuất hiện ở [kingdom_2.GetDefinitiveName]"
  ep3_laamp_flavour_ewan.3021.tt.kingdom_3.contracts_appear: "Một số hợp đồng giá trị cao sẽ xuất hiện ở [kingdom_3.GetDefinitiveName]"
  ep3_laamp_flavour_ewan.3021.tt.success: "Cú pháp thật tinh tế"
  ep3_laamp_flavour_ewan.3021.tt.failure: "Những từ này thật khó"
  ep3_laamp_flavour_ewan.3021.a: "[kingdom_1.GetBaseNameNoTierNoTooltip] khiến Ta quan tâm."
  ep3_laamp_flavour_ewan.3021.b: "Ta luôn muốn thấy [kingdom_2.GetBaseNameNoTierNoTooltip]!"
  ep3_laamp_flavour_ewan.3021.c: "Ta thấy [kingdom_3.GetBaseNameNoTierNoTooltip] thật hấp dẫn."
  ep3_laamp_flavour_ewan.3021.d: "Ta còn nhiều nơi để suy ngẫm..."

  ep3_laamp_flavour_ewan.3031.t: "Theo Quyền Lợi"
  ep3_laamp_flavour_ewan.3031.desc.intro: "Nó phải thuộc về Ta.\n\nKhông đúng khi Ta ngồi đây, trong lều lạnh, thay vì giường ấm trong cung điện của Ta ở thủ đô. Khát khao thấy tài sản của Ta — #EMP quyền sinh ra#! — được phục hồi khiến mỗi đêm cháy lên một chút, động lực buộc Ta tiếp tục bất chấp những... nhục nhã này.\n\nNhưng đó có phải tất cả không?"
  ep3_laamp_flavour_ewan.3031.desc.family_title: "Chẳng lẽ Ta không có quyền hợp pháp với [family_title.GetBaseNameNoTier]?"
  ep3_laamp_flavour_ewan.3031.desc.adjacent_title: "Chẳng lẽ [adjacent_title.GetBaseNameNoTier] không hợp lý là của Ta?"
  ep3_laamp_flavour_ewan.3031.desc.memory_title: "Chẳng lẽ [memory_title.GetBaseNameNoTier] đã bị lấy đi khỏi Ta?"
  ep3_laamp_flavour_ewan.3031.desc.outro: "\n\nTâm trạng Ta u ám theo bầu trời."
  ep3_laamp_flavour_ewan.3031.a: "[family_title.GetBaseNameNoTierNoTooltip] là của Ta theo quyền lợi!"
  ep3_laamp_flavour_ewan.3031.b: "[adjacent_title.GetBaseNameNoTierNoTooltip] chắc chắn là lãnh thổ tự nhiên của Ta..."
  ep3_laamp_flavour_ewan.3031.c: "Trong tim Ta, Ta chưa bao giờ từ bỏ [memory_title.GetBaseNameNoTierNoTooltip]."
  ep3_laamp_flavour_ewan.3031.d: "Một ngày nào đó, tất cả những điều này và hơn thế nữa..."
  ep3_laamp_flavour_ewan_3031_d_brooding_over_titles_modifier: "Suy Ngẫm Về Các Danh Hiệu"
  ep3_laamp_flavour_ewan_3031_d_brooding_over_titles_modifier_desc: "Một tâm trí tập trung mang lại nhiều lợi ích."

  ep3_laamp_flavour_ewan.3041.t: "Những Người Từ Thời Đại Tốt Hơn"
  ep3_laamp_flavour_ewan.3041.desc.intro: "[commander.GetWomanMan] [commander.GetCulture.GetName] đứng nghiêm nghị trong lều của ta, đầu [commander.GetHerHis] cúi thấp một cách cung kính.\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip], ta là [commander.GetFirstName], và ta mang đến cùng ta bao nhiêu người tùy tùng trung thành nhất của ngài từ [former_title.GetBaseNameNoTier] mà ta có thể xoay xở được. Những kẻ tiếm quyền đang cai trị vùng đất của ngài, và chúng ta, những tôi tớ trung thành của ngài, không thể chịu đựng thêm được nữa —\""
  ep3_laamp_flavour_ewan.3041.desc.compassionate: "bản tính nhân hậu và tấm lòng tốt của ngươi luôn đánh dấu ngươi là chúa tể hợp pháp của chúng Ta.\""
  ep3_laamp_flavour_ewan.3041.desc.sadistic: "không có công lý tàn nhẫn của ngươi, tội phạm phát triển và sinh sôi.\""
  ep3_laamp_flavour_ewan.3041.desc.callous: "không có kỷ luật vững chắc dẫn dắt, vương quốc của ngươi đã sa vào thối nát.\""
  ep3_laamp_flavour_ewan.3041.desc.wrathful: "không có tính cách võ nghệ của ngươi, kẻ thù đe dọa xóa sổ chúng ta khỏi Trái Đất.\""
  ep3_laamp_flavour_ewan.3041.desc.calm: "không có bàn tay dẫn dắt ổn định của ngươi, vương quốc của ngươi đang sụp đổ.\""
  ep3_laamp_flavour_ewan.3041.desc.arrogant: "không có quyền uy tự nhiên của ngươi, vương quốc của ngươi rơi vào hỗn loạn liên tục.\""
  ep3_laamp_flavour_ewan.3041.desc.humble: "không có sự khiêm tốn dẫn dắt, kiêu căng và tàn ác lan tràn.\""
  ep3_laamp_flavour_ewan.3041.desc.ambitious: "không có tham vọng và động lực của ngươi, chúng Ta như những con cừu lạc.\""
  ep3_laamp_flavour_ewan.3041.desc.content: "không có trí tuệ và tầm nhìn của ngươi, chúng Ta như những con chó hoang.\""
  ep3_laamp_flavour_ewan.3041.desc.arbitrary: "không có ý muốn dẫn dắt của ngươi, luật pháp trở nên chuyên chế.\""
  ep3_laamp_flavour_ewan.3041.desc.just: "không có công lý công bằng của ngươi, luật pháp đã chết.\""
  ep3_laamp_flavour_ewan.3041.desc.fallback: "chúng Ta đã thề trung thành, và sẽ giữ lời đến khi chết.\""
  ep3_laamp_flavour_ewan.3041.desc.title_claimed: "\n\n\"Ngươi vẫn tuyên bố quyền với [former_title.GetBaseNameNoTierNoTooltip], hãy nhận #EMP chúng Ta#! làm của ngươi theo quyền hợp pháp!\""
  ep3_laamp_flavour_ewan.3041.desc.title_forsaken: "\n\n\"Dù ngươi muốn chiếm lại [former_title.GetBaseNameNoTierNoTooltip] hay không, chúng Ta thà phục vụ ngươi còn hơn ở lại đó.\""
  ep3_laamp_flavour_ewan.3041.tt.up_to_ten_usurper_held_counties: "Tối đa mười [counties|E] đang bị kẻ chiếm đoạt nắm giữ"
  ep3_laamp_flavour_ewan.3041.a.imperial: "Thêm quân cho quân đội lưu vong hoàng gia!"
  ep3_laamp_flavour_ewan.3041.a.royal: "Thêm quân cho quân đội lưu vong triều đình!"
  ep3_laamp_flavour_ewan.3041.b: "Lòng trung thành của ngươi được ghi nhận, nhưng Ta cần những kẻ mưu mô."
  ep3_laamp_flavour_ewan.3041.c: "Trở về nhà, và quấy rối kẻ chiếm đoạt bất cứ nơi nào chúng có mặt."
  ep3_laamp_flavour_ewan.3041.d: "Ta cảm ơn ngươi, nhưng Ta không #EMP cần#! ngươi."
  legitimist_loyalists: "Những Người Trung Thành Chính Thống"

 # Ngl I think this is probably the funniest title I've ever written.
  ep3_laamp_flavour_ewan.3051.t: "Vẽ Bản Đồ"
  ep3_laamp_flavour_ewan.3051.desc: "Có điều gì đó chữa lành trong việc làm bản đồ.\n\nCầm bút và cọ trên canvas, nhìn các đường cong và địa hình của một vùng đất hiện lên sinh động, thấy thế giới từ một góc nhìn hoàn toàn mới. Thật đơn giản mà dễ chịu, và Ta thấy mình dành nhiều buổi tối nhàn rỗi gần đây cho thú vui này.\n\nBản mới nhất này có thể là tác phẩm tuyệt vời nhất của Ta từ trước đến nay, một bản đồ minh họa và chú thích hoàn chỉnh về [kingdom.GetBaseNameNoTier]."
  ep3_laamp_flavour_ewan.3051.tt.success: "Một tác phẩm tuyệt đẹp"
  ep3_laamp_flavour_ewan.3051.tt.failure: "Những nét vẽ của ngươi chẳng có giá trị"
  ep3_laamp_flavour_ewan.3051.a: "Ta sẽ tạo ra một tác phẩm lừng danh!"
  ep3_laamp_flavour_ewan.3051.b: "Bản đồ của ta sẽ nổi tiếng khắp thế giới."
  ep3_laamp_flavour_ewan.3051.c: "Ta luôn hướng tới những kiệt tác..."
  ep3_laamp_flavour_ewan.3051.d: "Chỉ đơn giản là vui vẻ với nó."
  handcrafted_map: "Bản Đồ Minh Họa của [kingdom.GetBaseNameNoTierNoTooltip]"
  handcrafted_map_desc.boilerplate: "Bản đồ được chăm chút này bao phủ toàn bộ [kingdom.GetBaseNameNoTier], các vùng biên, và những vùng láng giềng  quan trọng nhất.\n\nChú ý đặc biệt đã được dành cho"
  handcrafted_map_desc.mythic_beasts: "miêu tả các truyền thuyết và thần thoại địa phương, vẽ quái vật, thú vật, và những sinh vật kỳ lạ vào từng ngóc ngách mà chúng được cho là ẩn náu."
  handcrafted_map_desc.geography: "địa lý, ghi chú các vùng, các đặc điểm nổi bật của từng địa hình, và cả các đường đồng mức sơ bộ khi có thể."
  handcrafted_map_desc.settlements: "các khu định cư trên đất, bao gồm mọi thành phố lớn, thị trấn, và một số làng lớn — riêng thủ đô được phóng to và đánh dấu các khu vực riêng biệt."
  handcrafted_map_desc.people.urban: "ghi nhận thói quen và danh tiếng của người dân tại các đô thị lớn: ai nên mời đến bữa tối trang trọng, ai nuôi ngựa tốt nhất, ai dễ bị lừa nhất, và tương tự."
  handcrafted_map_desc.fauna: "sinh vật đất đai, từ thú nhỏ nhất và chim chóc bé nhất tới các 'vua chúa' trong vương quốc động vật — nhiều minh họa về chúng trang trí quanh lề và len lỏi trong khoảng trống."
  handcrafted_map_desc.flora: "thực vật đất đai, từ cỏ dại bé nhất tới cây lớn nhất và trải rộng nhất — một dải hoa dày bao quanh biên giới, từng bông hoa được chi tiết tỉ mỉ."
  handcrafted_map_desc.government: "cách người dân địa phương điều hành công việc cai trị, lãnh đạo nổi tiếng của họ, và cách họ hợp pháp hóa quyền lực. Những chân dung nhỏ của các vị vua nổi tiếng đặt ở từng góc."
  handcrafted_map_desc.tourism_sites: "các địa danh thú vị mà hành hương, du khách, và nhà phiêu lưu muốn ghé thăm — các địa điểm lớn hơn thậm chí có minh họa nhỏ."
  handcrafted_map_desc.routes: "các đường đi ngắn nhất, đường bảo trì tốt nhất, và tuyến đi an toàn nhất — minh họa nhỏ các thú vật, cướp, và man rợ đánh dấu những vùng nguy hiểm rõ ràng."
  handcrafted_map_desc.people.rural: "ghi nhận thói quen và danh tiếng của người dân ở nhiều vùng nông thôn: nơi nông dân mặc cả khéo nhất, ai trồng nho ngon nhất, và nơi họ dễ có quan hệ… hơi thân mật."

  ep3_laamp_flavour_ewan.3061.t: "Hướng Dẫn Về ..."
  ep3_laamp_flavour_ewan.3061.desc: "Chỉ còn... vài nét bút cuối cùng... và...\n\nXong! Một tập sách hoàn chỉnh về người dân [current_county.GetBaseNameNoTier] và những nét lập dị của họ. Không, không phải hoàn chỉnh tuyệt đối, nhưng chữ không mọc trên cây — chúng phải được sao chép công phu, từng chữ một.\n\nGiờ, đặt tên gì cho tác phẩm học thuật nhỏ này nhỉ?"
  ep3_laamp_flavour_ewan.3061.a: "\"Người & Địa Phương.\""
  ep3_laamp_flavour_ewan.3061.b: "\"Văn & Thơ.\""
  ep3_laamp_flavour_ewan.3061.c: "\"Thực Vật & Động Vật.\""
  ep3_laamp_flavour_ewan.3061.d: "Chỉ cần tiếp tục ghi chép ý tưởng."
  ep3_laamp_flavour_ewan_3061_peoples_and_places_modifier: "Người & Địa Phương"
  ep3_laamp_flavour_ewan_3061_peoples_and_places_modifier_desc: "Để thao túng người khác, trước hết ngươi phải hiểu họ."
  ep3_laamp_flavour_ewan_3061_prose_and_poetry_modifier: "Văn & Thơ"
  ep3_laamp_flavour_ewan_3061_prose_and_poetry_modifier_desc: "Một học giả thực thụ vừa là nhà viết kịch vừa là hùng biện gia."
  ep3_laamp_flavour_ewan_3061_plants_and_animals_modifier: "Thực Vật & Động Vật"
  ep3_laamp_flavour_ewan_3061_plants_and_animals_modifier_desc: "Thế giới tự nhiên là nguồn tri thức cơ bản."

  ep3_laamp_flavour_ewan.3071.t: "Luật Pháp Ở [current_county.GetBaseNameNoTierNoTooltip]"
  ep3_laamp_flavour_ewan.3071.desc: "Cuộc phục kích tấn công gần như ngay khi ta có lý do để tiến vào vùng hoang dã, hàng đàn chiến binh [local_soldier.GetCulture.GetCollectiveNoun] tràn ra từ những nơi ẩn náu đã chuẩn bị sẵn và lao thẳng vào ta cùng nhóm tùy tùng nhỏ bé của mình.\n\nChúng được trang bị vũ khí và áo giáp tốt, quá tốt cho một cuộc tấn công cơ hội. Một đội dân quân chăng, hoặc có lẽ là quân hộ vệ, đến để hạ sát ta vì những tội lỗi của mình.\n\nMột tên [local_soldier.GetWomanMan] to lớn như người khổng lồ dẫn đầu cuộc tấn công, gào lên lời thách thức của [local_soldier.GetHerHis] với ta bằng hết lá phổi hùng mạnh của [local_soldier.GetHerHis]: \"#EMP Chết!#! #BER CHẾT HOẶC VINH QUANG!#!"
  ep3_laamp_flavour_ewan.3071.a: "Đấu tay đôi với kẻ tấn công chính."
  ep3_laamp_flavour_ewan.3071.b: "Gài bẫy phản công!"
  ep3_laamp_flavour_ewan.3071.c: "Thổi kèn báo động!"
  ep3_laamp_flavour_ewan.3071.c.tt.success: "Quân gần đó tràn ra tấn công họ"
  ep3_laamp_flavour_ewan.3071.c.tt.failure: "Thảm họa!"
  ep3_laamp_flavour_ewan.3071.d: "Phản công dễ dàng."
  ep3_laamp_flavour_ewan.3071.e: "Tập hợp đội để phản công."
  ep3_laamp_flavour_ewan.3071.e.tt.success: "Ngươi đuổi họ đi"
  ep3_laamp_flavour_ewan.3071.e.tt.failure: "Thảm họa!"
  ep3_laamp_flavour_ewan.3071.f: "Chạy trốn."
  ep3_laamp_flavour_ewan.3071.f.success: "Ngươi thoát được"
  ep3_laamp_flavour_ewan.3071.f.failure: "Kẻ thù đuổi kịp ngươi"

  ep3_laamp_flavour_ewan.3073.t: "$ep3_laamp_flavour_ewan.3071.t$: Đấu Tay Đôi Thắng Lợi"
  ep3_laamp_flavour_ewan.3073.desc: "Khi xác [local_soldier.GetFirstNamePossessive] gục xuống đất, một tiếng kêu thất vọng vang lên từ quân lính của [local_soldier.GetHerHis].\n\nVới chỉ huy đã chết, tinh thần người dân hoàn toàn sụp đổ, và họ rút lui hỗn loạn khi binh lính Ta truy đuổi sát nút.\n\nTa nhìn xuống xác. Hừm.\n\nChết hay vinh quang thật."
  ep3_laamp_flavour_ewan.3073.a: "Kẻ ngốc đáng thương."

  ep3_laamp_flavour_ewan.3081.t: "Vật Lộn Cho Nó"
  ep3_laamp_flavour_ewan.3081.desc: "Đối thủ gần đây nhất của [challenger.GetFirstNamePossessive|U] khuỵu xuống, thở dốc và thất bại.\n\nĐấu vật là một môn thể thao khá phổ biến giữa hầu hết các lính đánh thuê, vì những lý do hiển nhiên, nhưng [challenger.GetFirstNameNoTooltip] theo đuổi nó như thể đó là một môn nghệ thuật. Đôi khi ta tự hỏi liệu [challenger.GetSheHe] có thích đánh tay không mà không cần bất kỳ vũ khí nào khác hay không.\n\n[challenger.GetWomanMan] nhìn vẻ suy tư của ta, và giơ đôi nắm đấm [challenger.GetHerHis] lên như một lời thách đố lịch sự — nhưng đầy chế giễu. \"Chà, [ROOT.Char.GetFirstNameNoTooltip], nghĩ sao nào?\""
  ep3_laamp_flavour_ewan.3081.a: "Lời nói dũng cảm cho kẻ sắp thua."
  ep3_laamp_flavour_ewan.3081.a.tt.success: "Ngươi vật lộn [challenger.GetFirstNameNoTooltip] đến khuất phục"
  ep3_laamp_flavour_ewan.3081.a.tt.failure: "Thất bại"
  ep3_laamp_flavour_ewan.3081.b: "Đánh [challenger.GetHerHim] chỉ vì dám hỏi."
  ep3_laamp_flavour_ewan.3081.c: "Hah, #EMP không#!"

 ##################################################
 # TRAVEL DANGER / SUPPLIES

  ep3_laamp_flavour_ewan.4001.t: "Cướp Đường!"
  ep3_laamp_flavour_ewan.4001.desc: "Bọn cướp phát động tấn công trong khi chúng ta vẫn đang di chuyển, những người bảo vệ và các thành viên dễ bị tổn thương của chúng ta bị dàn trải thành một hàng dài như con rắn.\n\nChúng phối hợp tốt, thổi một hồi tù và dài trước khi ùa ra từ những chỗ ẩn nấp, đánh mạnh vào nhiều điểm dọc theo đoàn xe của chúng ta cùng một lúc với sự giận dữ kinh hoàng.\n\nDù vậy, ngay lập tức rõ ràng mục tiêu của chúng là gì, khi thủ lĩnh của chúng, một [bandit_leader.GetWomanMan] [bandit_leader.GetCulture.GetName] đáng sợ, dẫn băng đảng của [bandit_leader.GetHerHis] lao thẳng vào những chiếc xe chở đầy nhu yếu phẩm nhất."
  ep3_laamp_flavour_ewan.4001.a: "Đẩy lùi chúng!"
  ep3_laamp_flavour_ewan.4001.a.tt.success: "Bọn cướp bị đánh bại"
  ep3_laamp_flavour_ewan.4001.a.tt.failure: "Chúng vẫn mang đồ cướp đi"
  ep3_laamp_flavour_ewan.4001.b: "Chuẩn bị nếm thép đi, cướp!"
  ep3_laamp_flavour_ewan.4001.c: "Lùi đi, #EMP cá con#!."
  ep3_laamp_flavour_ewan.4001.c.tt.success: "Ngươi dọa được bọn tội phạm địa phương"
  ep3_laamp_flavour_ewan.4001.c.tt.failure: "Danh tiếng của ngươi thất bại"
  ep3_laamp_flavour_ewan.4001.d: "Đầu hàng lương thực"

  ep3_laamp_flavour_ewan.4003.t: "$ep3_laamp_flavour_ewan.4001.t$: Đấu Tay Đôi Thắng Lợi"
  ep3_laamp_flavour_ewan.4003.desc: "Cái chết của thủ lĩnh làm bọn cướp hoảng loạn.\n\nTiếng la hét chuyển từ dân thường sợ hãi trong đoàn lữ hành sang những kẻ tàn nhẫn khi kế hoạch bị phá hủy trước mắt.\n\nKẻ hèn nhát bỏ chạy, kẻ tàn nhẫn làm bị thương đồng đội để che đường thoát. Dù sao, cuộc tấn công kết thúc trong vài phút."
  ep3_laamp_flavour_ewan.4003.a: "Không ai cướp của ta."

  ep3_laamp_flavour_ewan.4011.t: "Vùng Đất Sữa & Mật"
  ep3_laamp_flavour_ewan.4011.desc: "Có nhiều nơi khắc nghiệt, khó chịu trên thế giới này.\n\n[current_county.GetBaseNameNoTier] không phải một trong số đó.\n\nKhông, thay vào đó, đất đai màu mỡ tạo ra con người hào phóng và dễ tìm kiếm thức ăn. Căng thẳng giảm và thức ăn cho cả nhóm dường như, tạm thời, không còn là vấn đề: thật #EMP sướng tuyệt vời#!."
  ep3_laamp_flavour_ewan.4011.a: "Tận hưởng trái ngọt phong phú."

  ep3_laamp_flavour_ewan.4021.t: "Khát Nước"
  ep3_laamp_flavour_ewan.4021.desc: "Đã nhiều ngày trôi qua kể từ lần cuối trại tìm được nguồn nước ổn định.\n\nThức ăn, một [ROOT.Char.GetWomanMan] có thể chịu được — trong một thời gian. Một cái bụng đói có thể mất vài tuần mới gây nguy hiểm.\n\nNhưng thiếu nước, khi không có nơi nào để bổ sung và dự trữ đang cạn dần, cơn khát đe dọa một sự #EMP diệt vong# nhanh hơn nhiều."
  ep3_laamp_flavour_ewan.4021.tt.dehydration_increments: "[GetModifier('ep3_laamp_flavour_ewan_4021_extended_period_of_dehydration_t1_modifier').GetNameWithTooltip] trở nên tệ hơn nhiều"
  ep3_laamp_flavour_ewan.4021.tt.dehydration_already_at_worst: "[GetModifier('ep3_laamp_flavour_ewan_4021_extended_period_of_dehydration_t3_modifier').GetNameWithTooltip] không thể tồi tệ hơn"
  ep3_laamp_flavour_ewan.4021.tt.every_courtier_at_your_location_with_less_than_excellent_health: "Mọi [follower|E] có sức khỏe dưới mức Xuất sắc [health|E]"
  ep3_laamp_flavour_ewan.4021.a: "Chắc hẳn #EMP có gì đó#! quanh đây..."
  ep3_laamp_flavour_ewan.4021.a.tt.success: "Tìm thấy nguồn nước"
  ep3_laamp_flavour_ewan.4021.a.tt.failure: "Khô cong như xương"
  ep3_laamp_flavour_ewan.4021.b: "[forager.GetFirstNameNoTooltip], đi tìm nước."
  ep3_laamp_flavour_ewan.4021.c: "[hunter.GetFirstNameNoTooltip], đi tìm nước."
  ep3_laamp_flavour_ewan.4021.tt.officer_aptitude: "#WEAK Cuộc đối đầu này được quyết định bởi [officer|E]'s [aptitude|E]#!"
  ep3_laamp_flavour_ewan.4021.tt.delegated_to_officer.success: "Sĩ quan của Ngài thành công"
  ep3_laamp_flavour_ewan.4021.tt.delegated_to_officer.failure: "Sĩ quan của Ngài thất bại"
  ep3_laamp_flavour_ewan.4021.d: "Chúng ta có thể chia khẩu phần mà vượt qua."
  ep3_laamp_flavour_ewan.4021.e: "Cầu nguyện [ROOT.Char.GetFaith.WaterGodName] để thoát khỏi tình trạng này sớm."
  ep3_laamp_flavour_ewan.4021.e.tt.success: "Cuối cùng nguồn nước xuất hiện"
  ep3_laamp_flavour_ewan.4021.e.tt.failure: "[ROOT.Char.GetFaith.WaterGodName] từ chối Ngài"
  ep3_laamp_flavour_ewan_4021_extended_period_of_dehydration_t3_modifier: "Khát Nước Cực Kỳ Kéo Dài"
  ep3_laamp_flavour_ewan_4021_extended_period_of_dehydration_t3_modifier_desc: "Cơ thể nhân vật này vẫn chịu ảnh hưởng từ giai đoạn mất nước kéo dài."
  ep3_laamp_flavour_ewan_4021_extended_period_of_dehydration_t2_modifier: "Khát Nước Nghiêm Trọng Kéo Dài"
  ep3_laamp_flavour_ewan_4021_extended_period_of_dehydration_t2_modifier_desc: "$ep3_laamp_flavour_ewan_4021_extended_period_of_dehydration_t3_modifier_desc$"
  ep3_laamp_flavour_ewan_4021_extended_period_of_dehydration_t1_modifier: "Khát Nước Kéo Dài"
  ep3_laamp_flavour_ewan_4021_extended_period_of_dehydration_t1_modifier_desc: "$ep3_laamp_flavour_ewan_4021_extended_period_of_dehydration_t3_modifier_desc$"

  ep3_laamp_flavour_ewan.4031.t: "Bệnh Trong Đàn Vật"
  ep3_laamp_flavour_ewan.4031.desc: "Không thể chối cãi: từ thời tiết, địa hình, quá tải, hay đơn giản là xui xẻo, một căn bệnh đã tấn công vào đàn vật nuôi của trại.\n\nChúng rên rỉ, kêu rống, đi lại, nhưng càng lúc càng chậm chạp và yếu ớt theo từng giờ, chưa kể đến cả ngày.\n\nMột số con ngựa sốt cao rõ ràng, và một con la già dường như sắp chết — sẽ là mối nguy lớn nếu bệnh lây lan."
  ep3_laamp_flavour_ewan.4031.a: "Chắc chắn chúng ta có thể chữa trị chứ?"
