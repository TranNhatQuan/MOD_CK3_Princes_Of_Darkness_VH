  ep3_laamp_flavour_ewan.4062.t.lion: "$ep3_laamp_flavour_ewan.4061.t$: Sư Tử"
  ep3_laamp_flavour_ewan.4062.t.tiger: "$ep3_laamp_flavour_ewan.4061.t$: Hổ"
  ep3_laamp_flavour_ewan.4062.t.leopard: "$ep3_laamp_flavour_ewan.4061.t$: Báo"
