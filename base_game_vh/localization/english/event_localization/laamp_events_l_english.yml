  ep3_laamp_flavour_ewan.4051.t: "Hậu Cần Mất Tích"
  ep3_laamp_flavour_ewan.4051.tt.most_provisions_regained: "Hầu hết $game_concept_provisions$ được thu hồi"
  ep3_laamp_flavour_ewan.4051.tt.some_provisions_regained: "Một phần $game_concept_provisions$ được thu hồi"
  ep3_laamp_flavour_ewan.4051.tt.provisions_lost: "Toàn bộ $game_concept_provisions$ vẫn mất"
  ep3_laamp_flavour_ewan.4051.desc: "Với nhiều binh lính dưới một lá cờ hành quân, và toàn bộ #EMP lãnh thổ đáng ngờ#! phải đi qua, việc mất một vài vật tư là điều dễ hiểu.\n\nNhưng đây không phải vài món.\n\nĐây là một lượng vật tư #EMP khổng lồ#! mà  Bạn của kỷ nào đó đã bán cho dân địa phương hoặc những tên bất lương trong binh lính của Ta, mất do bất tài, không mua được từ đầu, hoặc đơn giản là tiêu xài lãng phí, và nó là một vi phạm kỷ luật không thể tha thứ."
  ep3_laamp_flavour_ewan.4051.a: "Mang roi đến đây và chúng ta sẽ tìm thủ phạm!"
  ep3_laamp_flavour_ewan.4051.a.tt.success: "Ngài bắt được kẻ trộm"
  ep3_laamp_flavour_ewan.4051.a.tt.failure: "Hắn thoát khỏi Ngài"
  ep3_laamp_flavour_ewan.4051.b: "Nhật ký sẽ ghi lại mọi thứ — cuối cùng."
  ep3_laamp_flavour_ewan.4051.b.tt.success: "$ep3_laamp_flavour_ewan.4051.a.tt.success$"
  ep3_laamp_flavour_ewan.4051.b.tt.failure: "$ep3_laamp_flavour_ewan.4051.a.tt.failure$"
  ep3_laamp_flavour_ewan.4051.c: "Chúng ta chắc chắn có thể bắt gặp họ khi hành động..."
  ep3_laamp_flavour_ewan.4051.c.tt.success: "$ep3_laamp_flavour_ewan.4051.a.tt.success$"
  ep3_laamp_flavour_ewan.4051.c.tt.failure: "$ep3_laamp_flavour_ewan.4051.a.tt.failure$"

  ep3_laamp_flavour_ewan.4061.t: "Đôi Mắt Trong Đêm"
  ep3_laamp_flavour_ewan.4061.desc.intro: "Buổi sáng mang đến báo cáo rằng một con thú ăn thịt người lại xuất hiện:"
  ep3_laamp_flavour_ewan.4061.desc.size.titanic: "ba người mất tích từ đêm qua, không còn gì ngoài vệt máu đỏ và dấu chân lấm bùn của một sinh vật thật sự khổng lồ."
  ep3_laamp_flavour_ewan.4061.desc.size.colossal: "ba người mất tích từ đêm qua, chỉ còn lại mảnh xương và phần lớn cánh tay, bị một quái vật to lớn nuốt chửng."
  ep3_laamp_flavour_ewan.4061.desc.size.mammoth: "hai người mất tích từ đêm qua, bị xé nát và trải dài nửa dặm bởi một kẻ săn mồi khổng lồ."
  ep3_laamp_flavour_ewan.4061.desc.size.huge: "hai người mất tích từ đêm qua, những gì còn lại được tìm thấy không xa chu vi trại, chỉ là những mảnh thịt rối bời do một sinh vật to lớn để lại."
  ep3_laamp_flavour_ewan.4061.desc.size.large: "một người theo khác bị sát hại, phần lớn xác người được tìm thấy cạnh [ROOT.Char.Custom('GetRandomCampBuilding')] nơi con vật to lớn để lại."
  ep3_laamp_flavour_ewan.4061.desc.size.nimble: "một mạng sống khác biến mất không dấu vết, chỉ còn lại vệt kéo nhẹ và vài giọt máu nơi sinh vật nhanh nhẹn làm tê liệt con mồi."
  ep3_laamp_flavour_ewan.4061.desc.midtro: "\n\nCác lính canh không thể nhìn thấy thứ chết tiệt đó. Dù nó là gì, nó thích mùi chúng ta, và dường như đủ thông minh để theo dõi chúng ta vào ban ngày hoặc đầu buổi tối.\n\n"
  ep3_laamp_flavour_ewan.4061.desc.sight.blind: "Ta dồn tâm trí"
  ep3_laamp_flavour_ewan.4061.desc.sight.sighted: "Ta dồn ánh mắt"
  ep3_laamp_flavour_ewan.4061.desc.terrain.major_river: "về phía con sông mà đường đi dẫn chúng ta men theo. Một khối nước rộng lớn như vậy có thể che giấu mọi loại kinh hoàng dưới nước."
  ep3_laamp_flavour_ewan.4061.desc.terrain.farmlands: "về các cánh đồng xung quanh, một biển hàng rào và ruộng đất dày đặc xen lẫn những bụi cây nhỏ. Mỗi khoảng 6 mét có thể giấu một kinh hoàng khác."
  ep3_laamp_flavour_ewan.4061.desc.terrain.hills: "về thảm đồi mà chúng ta len lỏi qua. Mỗi đỉnh gãy tầm nhìn sang phía đối diện, giúp cho một kẻ săn mồi dễ theo dõi chúng ta."
  ep3_laamp_flavour_ewan.4061.desc.terrain.mountains: "về các đỉnh núi đá lởm chởm và sườn núi soi ánh bình minh. Một số lượng vô kể chỗ cho một kinh hoàng sống trong hang ẩn náu."
  ep3_laamp_flavour_ewan.4061.desc.terrain.desert: "về phía biển cồn cát bao quanh chúng ta. Nó [ROOT.Char.Custom('SenseObserve_SeemLook')] rất thoáng đãng, nhưng một kẻ khủng bố ban đêm xảo quyệt có thể bơi qua đó dễ dàng như một con cá mập lướt qua sóng dữ."
  ep3_laamp_flavour_ewan.4061.desc.terrain.desert_mountains: "về các đỉnh bụi và sườn cát che nắng ban mai. Quá nhiều chỗ cho một kẻ đói chờ đợi qua nóng ngày."
  ep3_laamp_flavour_ewan.4061.desc.terrain.oasis: "$ep3_laamp_flavour_ewan.4061.desc.terrain.desert$"
  ep3_laamp_flavour_ewan.4061.desc.terrain.jungle: "về rừng rậm rối rắm với tán cây dày và dây leo phủ trên đầu. Kinh hoàng có thể chỉ cách chúng ta vài mét mà chúng ta không hề hay biết."
  ep3_laamp_flavour_ewan.4061.desc.terrain.forest: "về tấm chăn cây cối trải rộng mọi hướng. Quá dày để nhìn xa hơn 30 mét khỏi chu vi trại, tạo đủ chỗ cho kinh hoàng ẩn nấp."
  ep3_laamp_flavour_ewan.4061.desc.terrain.taiga: "$ep3_laamp_flavour_ewan.4061.desc.terrain.forest$"
  ep3_laamp_flavour_ewan.4061.desc.terrain.wetlands: "về chân trời đầy sương mù và các gò đất thấp lốm đốm vùng đất ngập nước. Hầu hết đất bằng phẳng, nhưng không đủ để che chắn #EMP hoàn toàn#! cho một kinh hoàng lạ."
  ep3_laamp_flavour_ewan.4061.desc.terrain.steppe: "về biển cỏ xung quanh. Chỉ kẻ ngu mới nghĩ địa hình bằng phẳng không chỗ ẩn náu, không sườn đồi hay thung lũng, không hang cho những kinh hoàng lạ."
  ep3_laamp_flavour_ewan.4061.desc.terrain.floodplains: "về vùng đồng bằng lầy lội, hai bên có cây cối mà chúng ta đi qua. Địa hình hoàn hảo cho một kẻ ẩn nấp phục kích lẻn theo."
  ep3_laamp_flavour_ewan.4061.desc.terrain.drylands: "về vùng đất khô, bụi bặm mà chúng ta đi qua. Bị phá vỡ bởi đồi và cây rải rác, bất cứ kinh hoàng rình mồi nào cũng dễ theo dõi qua địa hình này."
  ep3_laamp_flavour_ewan.4061.desc.terrain.plains: "về các đồng bằng rộng, nhấp nhô mà chúng ta băng qua. Bằng phẳng, nhưng không #EMP hoàn toàn#!, đủ đỉnh và hõm để che giấu mọi loại kinh hoàng."
  ep3_laamp_flavour_ewan.4061.desc.outro: "Quan sát. Chờ đợi. Cơn đói dần dần xây dựng cho bữa tối của nó."
  ep3_laamp_flavour_ewan.4061.a: "Siết chặt canh gác."
  ep3_laamp_flavour_ewan.4061.a.tt.duel.safe: "Trong tệ nhất, quái vật sẽ ăn vài [followers|E] quan trọng của Ngài"
  ep3_laamp_flavour_ewan.4061.a.tt.success: "Chặn và tiêu diệt thành công"
  ep3_laamp_flavour_ewan.4061.a.tt.failure: "Một vài cái chết nữa"
  ep3_laamp_flavour_ewan.4061.b: "Ta sẽ chặt đầu nó!"
  ep3_laamp_flavour_ewan.4061.a.tt.duel.risky: "Ngài đuổi theo quái vật, mạo hiểm [character_death_death|E] để đổi lấy [prestige|E]"
  ep3_laamp_flavour_ewan.4061.a.tt.duel.risky.are_you_sure: "@alert_icon! #alert_trial Tùy vào nó là gì — và thực sự lớn bao nhiêu — điều này có thể khá dễ hoặc vô cùng khó, và Ngài không thể rút lui khi đã bắt đầu#!"
  ep3_laamp_flavour_ewan.4061.c: "Miễn là nó không ăn ai quan trọng."
  ep3_laamp_flavour_ewan.4061.c.tt.success: "Nó không ăn"
  ep3_laamp_flavour_ewan.4061.c.tt.failure: "Nó đã ăn"
  ep3_laamp_flavour_ewan_4061_hungry_maneater_size_12_modifier: "Quái Vật Ăn Thịt Người"
  ep3_laamp_flavour_ewan_4061_hungry_maneater_size_12_modifier_desc: "Một sinh vật nào đó trong hạt này thực sự, thực sự thích thịt người."
