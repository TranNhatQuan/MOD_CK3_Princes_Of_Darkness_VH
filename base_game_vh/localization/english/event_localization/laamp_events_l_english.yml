  ep3_laamp_flavour_ewan.4041.t: "Lệ Tín [ROOT.Char.GetFaith.TricksterGodNamePossessive]"
  ep3_laamp_flavour_ewan.4041.desc.weather_type.storm.thunder: "Sấm vang rền ominously trên đầu, một sự gián đoạn cùn đối với gió rít và mưa quất, đang cố gắng làm tan rã đoàn hành quân.\n\nTiếng kêu xa vang lên dọc theo hàng khi xe và vật nuôi sa vào [ROOT.Char.Custom('RainySoilType')], cơn bão làm hết sức để cuốn trôi chúng ta tới [ROOT.Char.GetFaith.NegativeAfterLife]. Trẻ em và người già run rẩy trong im lặng thê lương, ướt sũng và tự hỏi khi nào hạ thân nhiệt sẽ bắt đầu.\n\nKhông khí đầy tĩnh điện lẫn căng thẳng,"
  ep3_laamp_flavour_ewan.4041.desc.weather_type.storm.wind: "Gió hú làm gần như không thể nghe thấy nhau hơn vài bước.\n\nCơn bão khốn nạn này càng lúc càng dữ dội, mưa xối vào mắt chúng Ta và làm các xe chở nặng cùng vật nuôi mắc kẹt trong bùn [ROOT.Char.Custom('RainySoilType')]. Cảnh tượng yên lặng tương tự có thể thấy dọc theo hàng, những người theo mạnh giúp kéo các xe ra trong khi trẻ em và người già co rúm dưới bất cứ nơi trú ẩn nào họ tìm hoặc dựng được.\n\nThiên nhiên dường như chống lại chúng ta, để lại"
  ep3_laamp_flavour_ewan.4041.desc.weather_type.storm.snow: "Tê liệt.\n\nDù quấn kín ấm nhất có thể, cái lạnh vẫn ăn mòn cơ thể Ta, từng cơn tuyết lớn bị gió thổi bay làm ướt mọi phần da hở, rút nhiệt như sáp từ cây nến đã tàn. Đoàn hành quân còn tệ hơn — người, thú và xe liên tục mắc kẹt trong địa ngục trắng xóa này, trẻ em và người già run rẩy dưới mái che phủ đầy tuyết trong khi người lớn làm việc hối hả để giải cứu các phương tiện mắc kẹt.\n\nCơn bão tuyết ngày càng dữ dội, để lại"
  ep3_laamp_flavour_ewan.4041.desc.weather_type.storm.sand: "Cát bay #EMP khắp nơi#! — mắt Ta, mũi Ta, cổ họng Ta. Ngay cả khi che mặt cũng chẳng làm giảm bớt, cát dữ dội quất vào mọi thứ.\n\nCơn bão cát xuất hiện bất ngờ, dường như từ hư không. Chỉ trong vài phút, toàn bộ đoàn hành quân bị nhấn chìm, và giờ Ta chỉ nghe thấy tiếng thét khi vật tư bị gió thổi bay, và tiếng ho khò khè khi phổi trẻ em và người già không chịu nổi.\n\nMọi chuẩn bị cẩn thận đều lộn xộn, để lại"
  ep3_laamp_flavour_ewan.4041.desc.weather_type.wild_fires.intro: "Ngay cả từ khoảng cách này, chúng ta có thể cảm nhận sức nóng dữ dội của ngọn lửa lao về phía mình.\n\n"
  ep3_laamp_flavour_ewan.4041.desc.weather_type.wild_fires.scrub: "Lửa cháy rừng tiến nhanh qua bụi khô hơn chúng ta trên đất trống, gió mạnh đẩy nó về phía chúng ta, đe dọa nướng bất cứ ai quá chậm — la chở nặng hay trẻ em chậm chạp.\n\nNhững cột khói lớn kéo dài trước đám cháy chính, làm nghẹt thở người ốm yếu và người già, để lại"
  ep3_laamp_flavour_ewan.4041.desc.weather_type.wild_fires.slopes: "Dù chúng Ta tiếp tục đẩy mạnh lên dốc, gió ổn định và đất khô khiến lửa cháy đang đuổi kịp, đe dọa nướng bất cứ ai quá chậm — la chở nặng hay trẻ em chậm chạp.\n\nNhững cột khói xoắn vươn lên trên đám cháy chính, len lỏi vào đội hình làm nghẹt thở cả những người cứng cỏi nhất và để lại"
  ep3_laamp_flavour_ewan.4041.desc.weather_type.wild_fires.treeline: "Với quá nhiều cây cối để cháy, lửa rừng bắt kịp nhanh chóng — những vụ nổ bất chợt từ cây khô nhiều nhựa là lời nhắc đáng sợ về kết cục ghê rợn đang chờ ai chậm chạp.\n\nNhững làn khói có mùi dầu kỳ lạ đuổi theo chúng ta trước đám cháy, làm nghẹt những kẻ yếu và để lại"
  ep3_laamp_flavour_ewan.4041.desc.weather_type.wild_fires.fallback: "Lửa cháy đang chạy nhanh hơn chúng ta, tìm #EMP vừa đủ#! nhiên liệu để thiêu rụi đoàn hành quân. Ai chậm sẽ bị thiêu sống — la chở nặng hay trẻ em chậm chạp.\n\nThậm chí tệ hơn, những cột khói lớn bốc lên trước đám cháy, thỉnh thoảng cuốn qua chúng ta làm nghẹt người dễ bị tổn thương, để lại"
  ep3_laamp_flavour_ewan.4041.desc.weather_type.avalanche: "Âm thanh nhẹ nhàng bất ngờ báo hiệu nguy hiểm sắp đến: một #EMP tiếng thình thịch# khổng lồ từ trên cao.\n\nHàng chục ánh mắt trong đoàn hành quân hướng lên những đỉnh núi phía trên, trước khi một tiếng sấm lớn hơn mọi cơn bão vang lên khắp dãy.\n\n\"#BER TUYẾT LŨ!#!\" ai đó hét. Ngay lập tức, mọi thứ hỗn loạn, người và thú lao đi tìm chỗ trú nhỏ nhất khỏi thác trắng đang đổ về, để lại"
  ep3_laamp_flavour_ewan.4041.desc.weather_type.flood: "Sương mù dường như xuất hiện từ hư không — một lúc không khí ẩm ướt, rồi đặc như súp.\n\nTừ trên cao, vài giọt mưa rơi, và một con suối gần đó bắt đầu dâng nhanh. Sự căng thẳng bao trùm đoàn, khiến người và xe dừng lại. Không ai rõ vấn đề, nhưng #EMP có gì đó#! sai.\n\nTrong một phút, đất trước đây vững chắc biến thành bùn đặc, và nước dâng lên từ mọi phía. \"Lũ, #EMP lũ quét#!!\" tiếng ai đó hét, để lại"
  ep3_laamp_flavour_ewan.4041.desc.weather_type.frozen_water: "Tuyết ở đây dai dẳng nhưng không đủ nghiêm trọng để gây vấn đề, chỉ vừa đủ phủ trắng thế giới. Đoàn hành quân đi qua một khoảng trống trong rừng, tận hưởng khoảnh khắc nghỉ ngơi, một chút cơ hội thưởng thức cảnh vật xung quanh.\n\n#BER Rắc.#!\n\nHàng chục ánh mắt nhìn xuống, kinh hoàng thấy một khe nứt rộng xuất hiện trên bề mặt #EMP hồ đóng băng#!! Không còn thời gian, không còn để suy nghĩ, chúng Ta chạy trốn — ngay cả với"
  ep3_laamp_flavour_ewan.4041.desc.weather_type.earthquake: "Thế giới rung chuyển dưới chân. Người và la loạng choạng, trẻ sơ sinh đồng thanh khóc, vài bánh xe xe bị bẻ gãy khi nâng lên rồi đập xuống hoặc bị đẩy ngang.\n\nNửa giây hoảng loạn lan ra toàn đoàn sau chấn động: đó là gì? Có còn nữa không, hay chỉ là i-\n\n#EMP Mặt đất bắt đầu rung chuyển#!. Xa trung tâm, một khe nứt mở ra và uốn lượn, nhanh hơn người chạy, thẳng về phía chúng ta. Cảnh tượng khiến"
  ep3_laamp_flavour_ewan.4041.desc.outro: "người theo của Ta đứng trên bờ vực sụp đổ."
