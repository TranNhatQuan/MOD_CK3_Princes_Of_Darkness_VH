  ep3_laamp_flavour_ewan.9531.t: "Người Theo Mất Tích: [visitor.GetTitledFirstNameNicknamedNoTooltip]"
  ep3_laamp_flavour_ewan.9531.desc: "Đã nhiều năm trôi qua, và giờ đã rõ ràng là người theo hầu vắng mặt của ta, [visitor.GetTitledFirstNameNicknamed], sẽ không quay trở lại nữa.\n\nSự thiếu vắng tin tức cho ta biết rằng [visitor.GetSheHe] đã chết trong chuyến đi của [visitor.GetHerHis], mặc dù ta không thể nói rõ tại sao.\n\nHãy ngừng tìm kiếm sự trở về của [visitor.GetHerHis]."
  ep3_laamp_flavour_ewan.9531.tt.follower_is_dead: "[visitor.GetTitledFirstName] đã chết khi vắng mặt tại [camp|E]"
  ep3_laamp_flavour_ewan.9531.a: "Thật đáng tiếc, chúng ta sẽ không bao giờ gặp lại [visitor.GetHerHim]..."
  ep3_laamp_flavour_ewan.9531.b: "#EMP Chà.#!"

  ep3_laamp_flavour_ewan.9532.t: "$ep3_laamp_flavour_ewan.9531.t$"
  ep3_laamp_flavour_ewan.9532.desc: "Mặc dù người theo của Ta [visitor.GetTitledFirstNameNicknamed] đã vắng mặt nhiều năm, chúng Ta vẫn trông đợi [visitor.GetHerHim] sớm trở lại.\n\nĐáng tiếc, một sứ giả báo rằng điều đó là không thể: hóa ra [visitor.GetSheHe] đang bị giam giữ bởi tên bạo tàn [imprisoner.GetTitledFirstName]! Nếu muốn gặp lại [visitor.GetHerHim], chúng Ta sẽ phải trả tiền chuộc."
  ep3_laamp_flavour_ewan.9532.a: "Chúng ta phải giải cứu [visitor.GetFirstNameNoTooltip]!"
  ep3_laamp_flavour_ewan.9532.b: "[imprisoner.GetFirstNameNoTooltip] cứ giữ [visitor.GetHerHim] đi, Ta không quan tâm."

  ep3_laamp_flavour_ewan.9533.t: "$ep3_laamp_flavour_ewan.9531.t$"
  ep3_laamp_flavour_ewan.9533.desc: "Sau nhiều năm xa cách, chúng ta bắt đầu lo lắng cho [visitor.GetTitledFirstNameNicknamed], người đáng lẽ đã phải quay về từ lâu.\n\nThan ôi, có vẻ như những lo ngại của chúng ta là hoàn toàn có cơ sở, vì tối nay [visitor.GetSheHe] đã loạng choạng bước vào trại và đổ gục xuống, một cái xác không hồn của một [visitor.GetWomanMan]. Làm thế nào điều này lại xảy ra với [visitor.GetHerHim], và làm thế nào [visitor.GetSheHe] tìm được đường đến chỗ chúng ta trong tình trạng này, ta không thể nói được.\n\nTrong tình trạng của [visitor.GetSheHe] hiện tại, chính [visitor.GetSheHe] cũng không biết được."
  ep3_laamp_flavour_ewan.9533.tt.follower_is_incapable: "[visitor.GetTitledFirstName] đã trở nên [GetTrait('incapable').GetName( GetNullCharacter )] khi vắng mặt tại [camp|E]"
  ep3_laamp_flavour_ewan.9533.a: "Chuyện gì đã xảy ra với [visitor.GetHerHim] vậy?"
  ep3_laamp_flavour_ewan.9533.b: "Đừng lo, [visitor.GetFirstNameNoTooltip], chúng Ta sẽ chăm sóc ngươi."
  ep3_laamp_flavour_ewan.9533.c: "Đuổi kẻ ngốc này đi trước khi ai đó nhìn thấy [visitor.GetHerHim]."

  ep3_laamp_flavour_ewan.9534.t: "$ep3_laamp_flavour_ewan.9531.t$"
  ep3_laamp_flavour_ewan.9534.desc: "[visitor.GetTitledFirstNameNicknamed] lẽ ra đã trở lại từ lâu.\n\n[visitor.GetSheHe|U] không nên vắng mặt lâu như vậy, nhưng [visitor.GetSheHe] không trở về cũng không gửi tin. Có lẽ [visitor.GetSheHe] đã mất dấu vết và không thể tìm lại.\n\nDù thế nào, có vẻ rõ ràng rằng [visitor.GetFirstNameNoTooltip] sẽ không bao giờ trở lại với chúng Ta."
  ep3_laamp_flavour_ewan.9534.tt.follower_is_lost: "[visitor.GetTitledFirstName] đã bị mất tích ở đâu đó và sẽ không trở lại [camp|E]"
  ep3_laamp_flavour_ewan.9534.a: "Ta tự hỏi chuyện gì đã xảy ra với [visitor.GetHerHim]..."

  ep3_laamp_flavour_ewan.9541.t.nickname_gained: "Người Theo Nhận Biệt Danh"
  ep3_laamp_flavour_ewan.9541.desc.nickname_gained: "Mọi người quanh trại đã đặt cho [eponymee.GetFirstName] một biệt danh dựa trên [eponymee.GetHerHis] [personality|E] và [traits|E].\n$EFFECT_LIST_BULLET$[eponymee.GetSheHe|U] giờ được biết đến với cái tên #V [eponymee.GetFirstNameNicknamed]#!"
  ep3_laamp_flavour_ewan.9541.t.dog_gained: "Người Theo Nhặt Chó"
  ep3_laamp_flavour_ewan.9541.desc.dog_gained: "[pet_owner.GetFirstNameNicknamed] đã có một chú chó cưng."
  ep3_laamp_flavour_ewan.9541.t.cat_gained: "Người Theo Có Mèo"
  ep3_laamp_flavour_ewan.9541.desc.cat_gained: "[pet_owner.GetFirstNameNicknamed] hiện có một chú mèo nhỏ đi cùng."
  ep3_laamp_flavour_ewan.9541.t.opinion_gained: "Quan Hệ Thân Thiết"
  ep3_laamp_flavour_ewan.9541.desc.opinion_gained: "[follower_1.GetFirstNameNicknamed] và [follower_2.GetFirstNameNicknamed] đang kết thân nhờ những điểm chung."
  ep3_laamp_flavour_ewan.9541.t.opinion_lost: "Quan Hệ Thù Địch"
  ep3_laamp_flavour_ewan.9541.desc.opinion_lost: "[follower_1.GetFirstNameNicknamed] và [follower_2.GetFirstNameNicknamed] đang xung đột vì khác biệt."
  ep3_laamp_flavour_ewan.9541.t.stress_gained: "Cuộc Sống Khó Khăn"
  ep3_laamp_flavour_ewan.9541.desc.stress_gained: "[stressee.GetFirstNameNicknamed] đang không thể chịu nổi những khó khăn hiện tại."
  ep3_laamp_flavour_ewan.9541.t.stress_lost: "Cuộc Sống Dễ Dàng"
  ep3_laamp_flavour_ewan.9541.desc.stress_lost: "[stressee.GetFirstNameNicknamed] trân trọng tự do của cuộc sống phiêu lưu."
