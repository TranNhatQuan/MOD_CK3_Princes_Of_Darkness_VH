  ep3_laamp_flavour_ewan.4062.t.caracal: "$ep3_laamp_flavour_ewan.4061.t$: Mèo Rừng Caracal"
  ep3_laamp_flavour_ewan.4062.t.bear: "$ep3_laamp_flavour_ewan.4061.t$: Gấu"
  ep3_laamp_flavour_ewan.4062.t.hippo: "$ep3_laamp_flavour_ewan.4061.t$: Hà Mã!"
  ep3_laamp_flavour_ewan.4062.t.crocodile: "$ep3_laamp_flavour_ewan.4061.t$: Cá Sấu"
  ep3_laamp_flavour_ewan.4062.t.cannibal_generated: "$ep3_laamp_flavour_ewan.4061.t$: Ăn Thịt Người"
  ep3_laamp_flavour_ewan.4062.t.cannibal_existing: "$ep3_laamp_flavour_ewan.4062.t.cannibal_generated$"
  ep3_laamp_flavour_ewan.4062.t.cannibal_chad: "$ep3_laamp_flavour_ewan.4062.t.cannibal_generated$"
  ep3_laamp_flavour_ewan.4062.desc.intro: "Chúng ta không thể chờ thêm một đêm nữa để chạy trốn thứ đó. Tập hợp đội săn của mình, Ta dự định kết thúc việc này, ngay trong buổi sáng hôm nay.\n\nDấu chân của quái vật"
  ep3_laamp_flavour_ewan.4062.desc.tracks.canine: "mềm và khó theo dõi, nhưng rõ ràng là của loài chó."
  ep3_laamp_flavour_ewan.4062.desc.tracks.feline: "hầu như không thấy, nhưng có vẻ của loài mèo."
  ep3_laamp_flavour_ewan.4062.desc.tracks.ursine: "nhẹ bất ngờ, nhưng rõ ràng là của gấu."
  ep3_laamp_flavour_ewan.4062.desc.tracks.hippopotomine: "nặng và... lạ. Ta không thể nhận dạng chính xác."
  ep3_laamp_flavour_ewan.4062.desc.tracks.crocodyline: "giống hơn như... bàn tay con người, kéo lê bằng các ngón có móng vuốt."
  ep3_laamp_flavour_ewan.4062.desc.tracks.human: "nhẹ như thì thầm và khó nhận dạng, như thể cố tình ngụy trang."
  ep3_laamp_flavour_ewan.4062.desc.tracks.connector: "Sau gần một giờ,"
  ep3_laamp_flavour_ewan.4062.desc.terrain.major_river: "chúng Ta đến một bãi cát ven sông"
  ep3_laamp_flavour_ewan.4062.desc.terrain.farmlands: "chúng Ta đến một khe hở trong hàng rào dài"
  ep3_laamp_flavour_ewan.4062.desc.terrain.hills: "chúng Ta lên đỉnh một ngọn đồi cao"
  ep3_laamp_flavour_ewan.4062.desc.terrain.mountains: "chúng Ta đến mép vách đá dựng đứng"
  ep3_laamp_flavour_ewan.4062.desc.terrain.desert: "chúng Ta đến chân một cồn cát cao"
  ep3_laamp_flavour_ewan.4062.desc.terrain.desert_mountains: "$ep3_laamp_flavour_ewan.4062.desc.terrain.mountains$"
  ep3_laamp_flavour_ewan.4062.desc.terrain.oasis: "$ep3_laamp_flavour_ewan.4062.desc.terrain.desert$"
  ep3_laamp_flavour_ewan.4062.desc.terrain.jungle: "chúng Ta đến một khoảng trống rộng trong rừng rậm"
  ep3_laamp_flavour_ewan.4062.desc.terrain.forest: "chúng Ta đến một lùm rừng rộng"
  ep3_laamp_flavour_ewan.4062.desc.terrain.taiga: "$ep3_laamp_flavour_ewan.4062.desc.terrain.forest$"
  ep3_laamp_flavour_ewan.4062.desc.terrain.wetlands: "chúng Ta đến một mảnh đất khô hơn"
  ep3_laamp_flavour_ewan.4062.desc.terrain.steppe: "chúng Ta đến một khe núi đá"
  ep3_laamp_flavour_ewan.4062.desc.terrain.floodplains: "chúng Ta đến một bán đảo hẹp"
  ep3_laamp_flavour_ewan.4062.desc.terrain.drylands: "chúng Ta đến một thung lũng bụi bặm"
  ep3_laamp_flavour_ewan.4062.desc.terrain.plains: "chúng Ta băng qua một ngọn đồi lùn"
  ep3_laamp_flavour_ewan.4062.desc.terrain.connector: "nơi dấu chân dường như biến mất.\n\n"
  ep3_laamp_flavour_ewan.4062.desc.animal.dog: "Tiếng gầm thấp phía sau khiến Ta quay lại, thấy một con chó sói [ROOT.Char.Custom('4061_size_adjective')] – mõm vẫn còn dính máu của các vụ giết đêm qua – gần như áp sát chúng Ta. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
  ep3_laamp_flavour_ewan.4062.desc.animal.wolf: "Tiếng gầm dữ dội phía sau khiến Ta quay lại, đối diện một con sói [ROOT.Char.Custom('4061_size_adjective')], mắt rực đói, răng nghiến, nước bọt văng tung tóe. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
  ep3_laamp_flavour_ewan.4062.desc.animal.hyena: "Tiếng cười maniac phía sau khiến Ta quay lại, thấy một con linh cẩu [ROOT.Char.Custom('4061_size_adjective')] – mõm dính máu và mảnh thịt người – nhìn chúng Ta đói khát. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
  ep3_laamp_flavour_ewan.4062.desc.animal.lion: "Tiếng gầm vang dội phía sau khiến tất cả quay lại, thấy một con sư tử [ROOT.Char.Custom('4061_size_adjective')] – mõm vẫn còn dính nội tạng tối hôm qua – thở hổn hển, đói khát rõ ràng. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
  ep3_laamp_flavour_ewan.4062.desc.animal.tiger: "Tiếng gầm lạnh sống lưng phía sau khiến tất cả quay lại, thấy một con hổ [ROOT.Char.Custom('4061_size_adjective')], vẫn còn mùi tử thi tối qua, nhìn chúng Ta đói khát. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
  ep3_laamp_flavour_ewan.4062.desc.animal.leopard: "Tiếng gầm lớn phía sau khiến Ta quay lại, thấy một con báo điên [ROOT.Char.Custom('4061_size_adjective')] – mặt và chân vẫn dính máu – đang chờ. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
  ep3_laamp_flavour_ewan.4062.desc.animal.panther: "Tiếng gầm lớn phía sau khiến Ta quay lại, gần như sững sờ thấy một con báo đen tuyền nhìn chúng Ta, vẫn tràn đầy adrenaline và máu từ cuộc săn tối qua. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
  ep3_laamp_flavour_ewan.4062.desc.animal.lynx: "Tiếng xì thấp phía sau khiến Ta quay lại, thấy một con linh miêu [ROOT.Char.Custom('4061_size_adjective')] – mắt sáng quái dị, lướt ra trước. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
  ep3_laamp_flavour_ewan.4062.desc.animal.caracal: "Tiếng gầm lớn phía sau khiến Ta quay lại, thấy một con caracal [ROOT.Char.Custom('4061_size_adjective')] – mặt dính máu – gần như lớn hơn bình thường, nửa sư tử nửa mèo hoang. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
  ep3_laamp_flavour_ewan.4062.desc.animal.bear: "Tiếng gầm trầm phía sau khiến tất cả quay lại, thấy mõm gấu [ROOT.Char.Custom('4061_size_adjective')] dính máu nhìn chúng Ta với ánh mắt thông minh. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
  ep3_laamp_flavour_ewan.4062.desc.animal.hippo.largest: "Tiếng gầm to, giận dữ nhất Ta từng nghe vang lên phía sau — quay lại, thấy một con hà mã [ROOT.Char.Custom('4061_size_adjective')]. Răng như cành cây, thân hình cơ bắp như xe ngựa chất đầy, có thể là sinh vật lớn nhất từng gặp. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
  ep3_laamp_flavour_ewan.4062.desc.animal.hippo.fallback: "Tiếng gầm ồm ồm phía sau khiến tất cả quay lại, thấy hàm hà mã [ROOT.Char.Custom('4061_size_adjective')] sẵn sàng. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
  ep3_laamp_flavour_ewan.4062.desc.animal.crocodile: "Tiếng gầm trầm phía sau khiến tất cả quay lại, mõm cá sấu [ROOT.Char.Custom('4061_size_adjective')] chĩa thẳng vào chúng Ta – vẫn dính nội tạng từ người theo Ta. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
  ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate: "Sinh vật, bẫy đã giăng, lao vút đi."
  ep3_laamp_flavour_ewan.4062.desc.animal.cannibal_generated: "\"Ngươi là kẻ đầu tiên đấy, ngươi biết không,\" một giọng nói lạ cất lên từ phía sau, nghe như đang kéo dài. Quay lại, chúng ta thấy một [cannibal.GetWomanMan] với mái tóc bết máu và những miếng thịt sống trong hàm răng [cannibal.GetHerHis]. \"Món đầu tiên của ta — và hương vị đó thật tuyệt! Nhưng ngươi... ngươi sẽ là một #EMP yến tiệc!#!\" Vũ khí trên tay, tên ăn thịt người lao [cannibal.GetHerselfHimself] về phía ta."
  ep3_laamp_flavour_ewan.4062.desc.animal.cannibal_existing.anna: "Một tiếng thét giận dữ tột độ phá vỡ sự im lặng, trước khi một cây lao phóng ra từ vị trí thấp ngang ống chân đâm xuyên qua đáy cột sống của một thành viên trong nhóm ta, khiến anh ta đổ gục ngay lập tức. Quay lại, ta đối mặt với khuôn mặt đẫm máu của một gã lùn hung dữ, đôi bàn tay dính máu [cannibal.GetHerHis] đang siết chặt một vũ khí lao thẳng vào hạ bộ của ta."
  ep3_laamp_flavour_ewan.4062.desc.animal.cannibal_existing.secret: "\"Ta buộc phải làm vậy. Ta #EMP buộc#! phải làm,\" một giọng nói lạ, đau khổ kêu lên phía sau chúng ta. Quay lại, chúng ta thấy một... [cannibal.GetWomanMan]? Chỉ là một [cannibal.GetWomanMan] — khuôn mặt và hàm răng phủ đầy máu đỏ rỉ sét, đóng vảy. \"Ngươi không biết sự #EMP đói khát#!, ngươi không biết — ngươi #EMP sẽ không#! hiểu đâu!\" tên ăn thịt người thét lên khi [cannibal.GetSheHe] lao [cannibal.GetHerselfHimself] về phía ta."
  ep3_laamp_flavour_ewan.4062.desc.animal.cannibal_existing.fallback: "\"Chà, chà, chà,\" một giọng nói lạ khúc khích phía sau chúng ta. Cùng một lúc, chúng ta quay lại thấy một [cannibal.GetWomanMan], đang nâng vũ khí và mỉm cười điên dại. \"Có vẻ như bữa trưa tự giao hàng đến tận nơi!\" [cannibal.GetSheHe] mỉa mai, lao [cannibal.GetHerselfHimself] thẳng về phía ta."
  ep3_laamp_flavour_ewan.4062.desc.animal.cannibal_chad: "\"Ta không muốn làm ai đau\", giọng run rẩy phía sau. Quay lại, thấy một người? Một học giả mọt sách, hoàn toàn không phù hợp. \"Ta chỉ... cần #EMP thịt#!\" hét, vũ khí trong tay lao thẳng vào Ta."
  ep3_laamp_flavour_ewan.4061.size_adjective.titanic: "#BER khổng lồ#!"
  ep3_laamp_flavour_ewan.4061.size_adjective.colossal: "#EMP to lớn#!"
  ep3_laamp_flavour_ewan.4061.size_adjective.mammoth: "#EMP khổng lồ#!"
  ep3_laamp_flavour_ewan.4061.size_adjective.huge: "#EMP lớn#!"
  ep3_laamp_flavour_ewan.4061.size_adjective.large: "#EMP cỡ lớn#!"
  ep3_laamp_flavour_ewan.4061.size_adjective.sizeable: "#EMP vừa phải#!"
  ep3_laamp_flavour_ewan.4062.tt.success: "Quái vật gục trước sức người của Ngài"
  ep3_laamp_flavour_ewan.4062.tt.failure: "Quái vật thoát thân"
  ep3_laamp_flavour_ewan.4062.a: "Bao vây, vây chặt nó!"
  ep3_laamp_flavour_ewan.4062.b: "Xử nó, quái vật!"
  ep3_laamp_flavour_ewan.4062.c: "[huntsperson.GetFirstNameNoTooltip], phóng ra, PHÓNG RA!"
  ep3_laamp_flavour_ewan.4062.c.tt.success: "Trúng thẳng mắt"
  ep3_laamp_flavour_ewan.4062.c.tt.failure: "Chỉ khiến nó càng giận dữ"
  ep3_laamp_flavour_ewan.4062.d: "[kenneler.GetFirstNameNoTooltip], đưa ta con chó đó!"
  ep3_laamp_flavour_ewan.4062.d.tt.success: "Con chó đã bị khống chế"
  ep3_laamp_flavour_ewan.4062.d.tt.failure: "Cảnh tượng kinh hoàng"
  ep3_laamp_flavour_ewan.4062.e: "Chuẩn bị chết đi, quái vật!"

  ep3_laamp_flavour_ewan.4064.t: "$ep3_laamp_flavour_ewan.4061.t$: Thắng Lợi Trong Trận Đấu"
  ep3_laamp_flavour_ewan.4064.desc: "Thi thể kẻ ăn thịt người ngã ngửa ra sau, máu phun ra trước rồi nhỏ giọt từ những vết thương chí mạng của [cannibal.GetHerHis].\n\nKhông phải kết quả Ta mong đợi, nhưng thế giới không thể nói rằng Ta chưa từng giết một kẻ ăn người.\n\nKhi căng thẳng của trận đấu tan khỏi cơ thể, một tràng hò reo vang lên từ nhóm thợ săn còn lại. Ta liếc nhìn lần cuối [cannibal.GetWomanMan] nằm chết trên sàn, rồi quay về nhà."
  ep3_laamp_flavour_ewan.4064.a.is_cannibal: "À, giờ thì #EMP Ta đói rồi#!..."
  ep3_laamp_flavour_ewan.4064.a.not_cannibal: "Một cơn điên rồ bệnh hoạn."

  ep3_laamp_flavour_ewan.4071.t: "Kẻ Buôn Nô Lệ"
  ep3_laamp_flavour_ewan.4071.desc: "Cuộc phục kích được triển khai một cách chuyên nghiệp.\n\nMột điểm hẹp dễ tổn thương trên địa hình cho phép một bầy kẻ buôn nô lệ — với xích và gươm trên tay — tràn ra từ hai phía, trong khi một nhóm thứ ba cản trở đoàn hộ tống chính trợ giúp chúng ta. Một tràng thét vang lên từ những người theo Ta không có vũ khí khi nhận ra tình huống.\n\nNếu những kẻ quái vật này thắng, số phận kinh hoàng đang chờ nhiều người trong chúng ta."
  ep3_laamp_flavour_ewan.4071.a: "Tấn công! Tấn công và tiêu diệt lũ cặn bã này!"
  ep3_laamp_flavour_ewan.4071.a.tt.success: "Những người phòng thủ của Ngài xông lên"
  ep3_laamp_flavour_ewan.4071.a.tt.failure: "Một trận chiến tàn bạo"
  ep3_laamp_flavour_ewan.4071.b: "Đấu tay đôi với kẻ buôn nô lệ dẫn đầu."
  ep3_laamp_flavour_ewan.4071.c: "Mặc cả và bán vài người theo kém quan trọng."
  ep3_laamp_flavour_ewan.4071.c.sale_explanation.profit: "Ngài sẽ được trả [gold|E] tương đương với tổng [skills|E] của năm [followers|E] tệ nhất của Ngài"
  ep3_laamp_flavour_ewan.4071.c.sale_explanation.limitations: "Bất kỳ ai quan trọng với Ngài, đặc biệt là có kỹ năng, hoặc bị bệnh hoặc thương tích đều không được bán"
  ep3_laamp_flavour_ewan.4071.c.sale_explanation.death: "Bán một [character|E] thành nô lệ sẽ loại họ khỏi trò chơi, coi như [character_death_death|E]"
  ep3_laamp_flavour_ewan.4071.d: "Bỏ qua tiếng kêu và hy vọng điều tốt nhất."
  ep3_laamp_flavour_ewan.4071.d.tt.success: "[ROOT.Char.GetFaith.FateGodName] mỉm cười với Ngài"
  ep3_laamp_flavour_ewan.4071.d.tt.failure: "Tiếng rên rỉ lùi vào màn đêm"

  ep3_laamp_flavour_ewan.4073.t: "$ep3_laamp_flavour_ewan.4071.t$: Thắng Lợi Trong Trận Đấu"
  ep3_laamp_flavour_ewan.4073.desc: "Cái chết của [slaver.GetWomanMan] tạo ra làn sóng hoảng loạn trong hàng ngũ kẻ thù.\n\nTrận chiến xung quanh Ta thay đổi, tràng thét và âm thanh ứ đọng vang lên từ đối phương khi các thương nhân nô lệ bị chém chết hàng loạt. Chỉ trong vài phút, lực lượng cứu viện từ đoàn chính phá vỡ đội hậu vệ của bọn buôn nô lệ, và mọi chuyện kết thúc.\n\nVới một cú đá khinh bỉ, Ta đẩy phần còn lại của thủ lĩnh họ úp mặt xuống [ROOT.Char.Custom('GritType')]."
  ep3_laamp_flavour_ewan.4073.a: "Đây là cách Ta nghĩ về lũ cặn bã này."

  ep3_laamp_flavour_ewan.4081.t: "Sinh Ra Từ Tuyệt Vọng"
  ep3_laamp_flavour_ewan.4081.desc.intro: "Ban đầu, chỉ có vài nông dân [current_county.GetCountyData.GetCulture.GetName] gầy gò mà chúng Ta nhìn thấy. Họ xuất hiện từ xa, hoặc nhìn quanh các địa hình nhỏ, chạy trốn khi chúng Ta để ý.\n\nGiờ trôi qua, dân địa phương rụt rè vẫn quan sát chúng Ta từ xa.\n\nKhi họ dường như cuối cùng đã lui lại, một tiếng la vang lên, và một đám đông điên cuồng lao tới từ vùng gò đất. Mắt hoang dại và gầy mòn,"
  ep3_laamp_flavour_ewan.4081.desc.epidemic: "họ trông bệnh tật, nhiễm một căn bệnh nghiêm trọng —"
  ep3_laamp_flavour_ewan.4081.desc.mundane: "họ trông yếu ớt, chắc chắn đang trong giai đoạn đầu của nạn đói —"
  ep3_laamp_flavour_ewan.4081.desc.outro: "dù không yếu đến mức không thể cướp nhiều lương thực của chúng ta trước khi bị đẩy lui."
  ep3_laamp_flavour_ewan.4081.a: "Cố gắng trấn an đám đông."
  ep3_laamp_flavour_ewan.4081.a.tt.success: "Ngài làm đám đông bình tĩnh lại"
  ep3_laamp_flavour_ewan.4081.a.tt.failure: "Lời nói chẳng có tác dụng với họ"
  ep3_laamp_flavour_ewan.4081.b: "Nếu họ muốn lương thực, họ phải #EMP trả giá!#!"
  ep3_laamp_flavour_ewan.4081.b.tt.success: "Lợi nhuận tốt"
  ep3_laamp_flavour_ewan.4081.b.tt.success.every_compassionate_or_generous_follower: "Mỗi [GetTrait('compassionate').GetName( GetNullCharacter )] hoặc [GetTrait('generous').GetName( GetNullCharacter )] [follower|E]"
  ep3_laamp_flavour_ewan.4081.b.tt.success.every_callous_greedy_or_sadistic_follower: "Mỗi [GetTrait('greedy').GetName( GetNullCharacter )] hoặc [GetTrait('sadistic').GetName( GetNullCharacter )] [follower|E]"
  ep3_laamp_flavour_ewan.4081.b.tt.failure: "Cơn thèm ăn điên cuồng"
  ep3_laamp_flavour_ewan.4081.c: "Đẩy lùi đám hỗn tạp này."
  ep3_laamp_flavour_ewan.4081.c.tt.success: "Các tùy tùng có vũ trang của Ngài phá vỡ đủ xương"
  ep3_laamp_flavour_ewan.4081.c.tt.failure: "Ngài không thể ngăn tất cả họ"
  ep3_laamp_flavour_ewan.4081.d: "Để họ lấy một ít lương thực"

  ep3_laamp_flavour_ewan.4091.t: "Tấn Công Ban Đêm"
  ep3_laamp_flavour_ewan.4091.desc: "Ban đêm, kẻ tấn công đổ xuống vòng ngoài của chúng Ta, một mớ hỗn hợp áo giáp lấp lánh và vũ khí lóe sáng, chỉ được soi sáng bởi ánh lửa xa xăm.\n\nNếu chúng mặc màu, thì cũng không thấy được, nhưng ý định thì rõ ràng. Họ muốn loại chúng Ta khỏi [current_county.GetBaseNameNoTier], sống hay chết.\n\nTrại không thiếu người phòng thủ, và với một tiếng la giận dữ, chúng Ta chuẩn bị phản công kẻ quấy phá địa phương này."
  ep3_laamp_flavour_ewan.4091.a: "Phản công, theo Ta!"
  ep3_laamp_flavour_ewan.4091.a.tt.success: "Chiến thắng chiến thuật"
  ep3_laamp_flavour_ewan.4091.a.tt.failure: "Máu me và tàn phá"
  ep3_laamp_flavour_ewan.4091.b: "Ta lao vào trận!"
  ep3_laamp_flavour_ewan.4091.b.tt.success: "Càn quét thành công"
  ep3_laamp_flavour_ewan.4091.b.tt.failure: "$ep3_laamp_flavour_ewan.4091.a.tt.failure$"
  ep3_laamp_flavour_ewan.4091.c: "Trốn tránh hỗn loạn."
  ep3_laamp_flavour_ewan.4091.c.every_non_craven_follower: "Mỗi [follower|E] không phải [GetTrait('craven').GetName( GetNullCharacter )]"

  ep3_laamps.5999.t: "Tin Từ Đảo"
  ep3_laamps.5999.desc: "Cha Ta là người nghiêm khắc. Giờ đây, nhờ năm tháng, Ta thấy những... lỗi lầm của mình với ông được đón nhận với đúng sự hài hước mà chúng xứng đáng. Lời kêu gọi của ông tới [edward.GetTitledFirstName] đã được lắng nghe, và vì vậy Ta có mặt ở [location.GetName], làm việc bẩn thỉu cho [flanders.GetTitledFirstName].\n\nNhưng đã nhiều năm trôi qua, và nước Anh đang biến động. [edward.GetTitledFirstNameNoTooltip] đã chết, [harold.GetTitledFirstName] chiếm ngôi, và kẻ thù của ông [william.GetTitledFirstName] và [harald.GetTitledFirstName] đang âm mưu lật đổ.\n\nTa chỉ hy vọng mọi hỗn loạn trong những ngày tới sẽ tránh xa gia đình và vùng đất của chúng Ta."
  ep3_laamps.5999.a: "Ta phải để mắt đến tình hình."
  ep3_laamps.5999.b: "Số phận Ta không ở Anh."
  ep3_laamps.5999.b.tt: "Thêm một [task_contract|E] mới"

  ep3_laamps.6000.t: "Định Mệnh"
  ep3_laamps.6000.intro: "Ta lật lá thư trong tay, cảm nhận bề mặt thô ráp, niêm phong sáp, và huy hiệu dập trên đó. Huy hiệu của [ROOT.Char.GetHouse.GetBaseName]. Ta cắt niêm phong và bắt đầu đọc.\n\nTin tức thật u ám."
  ep3_laamps.6000.body.alive: "Anh trai Ta [brother.GetFirstName] còn sống — và thực sự chính tay anh viết lá thư này — nhưng tin đồn từ Normandy hóa ra là sự thật."
  ep3_laamps.6000.body.dead: "Anh trai Ta, [brother.GetFirstName], đã chết — được nói rằng [brother.GetSheHe] [brother.GetDeathReasonHideKiller] — và tin đồn từ Normandy là sự thật."
  ep3_laamps.6000.desc: "\n\n[harold.GetFirstName] của [harold.GetHouse.GetBaseName] đã bị truất ngôi bằng vũ lực, giờ hoặc đã chết hoặc đang trốn. Công tước [william.GetFirstName], Bạn Tốt kế hoang của ngai vàng Anh, giờ là [william.GetTitledFirstNameNoTooltip] của [william.GetPrimaryTitle.GetNameNoTier]. [william.GetSheHe|U] đã bắt đầu phân phát đất cho [william.GetHerHis] những người theo, tước khỏi tay [ROOT.Char.GetCulture.GetCollectiveNoun] bị đánh bại.\n\n"
  ep3_laamps.6000.closing.alive: "Anh trai Ta cầu cứu..."
  ep3_laamps.6000.closing.dead: "Gia đình Ta tan tác..."
  ep3_laamps.6000.a: "Ta sẽ không bỏ rơi gia đình trong giờ phút khó khăn!"
  ep3_laamps.6000.a.dead: "Ta sẽ không bỏ rơi quyền thừa kế chính đáng!"
  ep3_laamps.6000.a.flavor: "Hướng về quê hương của Ta."
  ep3_laamps.6000.a.tt: "Bắt đầu hành trình tới [ely.GetName]"
  ep3_laamps.6000.b: "Ta đã không còn là một [ROOT.Char.GetHouse.GetBaseNameNoTooltip] từ lâu."
  ep3_laamps.6000.b.tt: "@alert_icon!#alert_trial Một khi chọn con đường này, sẽ không còn đường quay lại...#!"

  ep3_laamps.6001.t: "Về Nhà?"
  ep3_laamps.6001.desc: "Ngay khoảnh khắc ta đặt chân vào mảnh đất cũ của gia đình, ta biết có điều gì đó không ổn. Một khối hình thù biến dạng xuất hiện qua màn sương, một cây cột mảnh khảnh nhô lên phía trên. Thêm một bước tiến tới, và...\n\nĐầu của [brother.GetFirstNamePossessive], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('brother'))] của ta, đang đặt chễm chệ trên đỉnh một cây cọc, phần thân còn lại của anh ấy nằm trong một đống đổ nát đẫm máu bên dưới.\n\n\"Ngươi là ai?\" Giọng nói với một âm điệu ta không nhận ra khiến ta giật mình. Ta quay lại nhìn thấy một [frederick.GetWomanMan] đang lau vết máu trên vũ khí trong tay [frederick.GetHerHis], nhướng mày nhìn sự hiện diện của ta. \"Nếu ngươi đến lấy cái xác, ta sẽ không trả tiền để ngươi mang nó đi đâu.\"\n\nTa nhìn lại cái xác đã vặn vẹo, gãy nát của anh trai mình."
  ep3_laamps.6001.a: "'Ngươi sẽ chết vì những gì đã làm ở đây.'"
  ep3_laamps.6001.b: "'Ngươi chỉ có một cơ hội chạy thoát, đồ chó ghẻ.'"
  ep3_laamps.6001.b.one: "[frederick.GetWomanMan] chạy trốn"
  ep3_laamps.6001.b.one.tt: "Ngài thu hồi xác [brother.GetFirstNamePossessiveNoTooltip] nguyên vẹn"
  ep3_laamps.6001.b.two: "[frederick.GetWomanMan] tiến tới Ngài, vũ khí giơ cao"
  ep3_laamps.6001.b.two.tt: "Một [single_combat_duel|E] bắt đầu"

  ep3_laamps.6003.t: "Một Món Ăn Ngon..."
  ep3_laamps.6003.desc: "Ta bước qua thi thể [frederick.GetFirstNamePossessive] giật giật, trở lại bên xác [brother.GetFirstNamePossessive]. Sẽ có một ngôi mộ, một buổi lễ, một nghi thức tưởng nhớ cuộc đời [brother.GetHerHis] ngắn ngủi và tàn nhẫn. Bây giờ, đêm đã xuống, Ta ngồi hồi tưởng.\n\n[brother.GetSheHe|U] là một [brother.GetWomanMan] hiền lành. Không công bằng khi một người chỉ muốn sống yên ổn lại chịu số phận như vậy. Bất giác, một nhận ra lóe lên trong đầu.\n\n[frederick.GetCulture.GetCollectiveNoun]. [brother.GetSheHe|U] đã không còn sống nếu không vì họ. Sẽ có hàng nghìn anh em, hàng nghìn chị em, hàng nghìn cha mẹ và con cái, #EMP tất cả#! trên khắp đất nước, #EMP tất cả#! chết đêm nay, #EMP tất cả#! vì những...\n\n#EMP Đáng nguyền rủa. [frederick.GetCulture.GetCollectiveNounNoTooltip|U].#!"
  ep3_laamps.6003.a: "'Ta sẽ trả thù cho ngươi, anh trai. Ta hứa.'"
  ep3_laamps.6003.b: "Sự bồi thường đầu tiên đang chờ."
  ep3_laamps.6003.b.flavor: "Lũ bẩn thỉu Ta giết dường như còn ít của cải..."
  ep3_laamps.6003.b.tt: "Thu được một vật phẩm [artifact|E]"

  ep3_laamps.6005.t: "Trở Lại Đầm Lầy"
  ep3_laamps.6005.desc: "Đã quá nhiều năm kể từ lần cuối Ta đặt chân lên vùng đất này. Một bước đi nặng nề, cũng có lý do chính đáng. Ngay cả bây giờ, đất lầy hút lấy ủng Ta.\n\nVùng đất này — quê hương Ta — được gọi là '[Glossary( 'The Fens', 'FENS_GLOSS' )]' từ nhiều thế hệ. Thực tế, nước dâng cao tới mức Ely về mặt kỹ thuật là một hòn đảo.\n\nKhông còn thời gian để lãng phí. Ngay cả bây giờ, kẻ Norman đang siết chặt quyền kiểm soát [william.GetHerHis] trên đất Anglo-Saxon. Để chống lại, chúng ta cần hai nguồn sống quan trọng: tiền và người."
  ep3_laamps.6005.a: "Trước hết, chúng ta phải lấp đầy kho bạc, bằng mọi cách."
  ep3_laamps.6005.a.tt: "Ta nghĩ Ta thấy một quý tộc yếu thế đang phi xa đó ngay bây giờ..."
  ep3_laamps.6005.b: "Có lẽ một hiệp sĩ địa phương có thể bị thuyết phục về phe Ta?"
  ep3_laamps.6005.b.tt: "Và, vì là địa phương, có lẽ họ biết cách tốt nhất để điều hướng địa hình này..."
  every_fenland_holding: "Mỗi [holding|E] ở The Fens"
  FENS_GLOSS: "Vùng đầm lầy màu mỡ quanh The Wash thường được gọi là 'The Fens'. Nơi đây có nhiều nhà thờ và nhà thờ lớn nổi bật ở Anh.\n\nThe Fenlands bao gồm các [baronies|E] sau:\n\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_lynn').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_cambridge').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_radfield').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_papworth').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_ely').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_hurstingstone').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_norman_cross').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_stamford').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_boston').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_peterborough').GetBaseName]"

  ep3_laamps.6010.t: "[powerful_vassal.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
  ep3_laamps.6010.desc: "Ta đã nghe về những chiến công của ngươi và công việc tốt ngươi đang làm ở The Fens.\n\nTa muốn ngươi đến [powerful_vassal_capital.GetName]: chúng ta còn nhiều điều phải bàn."
  ep3_laamps.6010.a: "Ngươi có thể trông đợi Ta trong vài ngày tới."
  ep3_laamps.6010.a.flavor: "[powerful_vassal_capital.GetNameNoTooltip], phải không? Ta sẽ sắp xếp ngay."
  ep3_laamps.6010.a.tt: "Ngài khởi hành tới [powerful_vassal_capital.GetNameNoTooltip]."
  ep3_laamps.6010.b: "Ta đi theo con đường riêng của mình."

  ep3_laamps.6015.t: "Vì Nước Anh"
  ep3_laamps.6015.desc: "[powerful_vassal.GetTitledFirstNameRegnal], chư hầu quyền lực nhất trong số các lãnh chúa [powerful_vassal.GetCulture.GetName] còn lại, đã chào đón ta bằng vòng tay rộng mở. Trong các cuộc đối thoại của chúng ta, chủ đề hiếm khi đi chệch khỏi sự hiển nhiên.\n\n\"Chúng ta không xa lạ gì với việc bị những người lạ cai trị ở vùng đất này.\" [powerful_vassal.GetFirstNameNoTooltip] tuyên bố, với một nụ cười gượng gạo trước sự lạc quan của chính [powerful_vassal.GetHerHis], những ngón tay đan chặt đầy chủ ý. \"Xét cho cùng, cha ông chúng ta đã phải chịu sự cai trị của hơn một tên Đan Mạch. Nhưng điều này... điều này thì khác.\"\n\n\"Ta dự định sẽ thách thức cái tên #EMP [william.GetFirstNameNoTooltip]#! đó,\" [powerful_vassal.GetSheHe] nhổ toẹt cái tên ra đầy độc địa, \"nhưng ta cần sự hỗ trợ. Lòng trung thành của hầu hết mọi người đều rất mong manh.\" [powerful_vassal.GetSheHe|U] nâng mắt [powerful_vassal.GetHerHis] nhìn ta.\n\n\"Ta có thể dựa vào sự giúp đỡ của ngài không?\""
  ep3_laamps.6015.a: "Ngươi có sự ủng hộ của ta."
  every_direct_vassal_william: "Mọi [direct_vassal|E] Norman của [william.GetFirstNameRegnal]"
  every_anglo_noble: "Mọi [noble|E] Anglo-Saxon"
  ep3_laamps.6015.b: "Ta cần thêm thời gian."

  ep3_laamps.6016.t: "Kết Thúc Không May"
  ep3_laamps.6016.frustrated: "\"Chúng ta không còn thời gian!\" [powerful_vassal.GetFirstName|U] đập bàn để nhấn mạnh, ánh mắt giận dữ lóe lên trên khuôn mặt [powerful_vassal.GetHerHis]. \"Ngay cả bây giờ cũng có những lời đồn về sự trả thù! Chúng ta càng chần chừ, [william.GetSheHe] càng có thêm thời gian tập hợp lực lượng.\"\n\n\"Chúng ta #EMP phải#! hành động nhanh chóng. Hãy lấy thời gian cần thiết, nhưng ta chỉ có thể van xin ngươi chọn phe trong khi còn cơ hội.\""
  ep3_laamps.6016.happy: "\"Xuất sắc! Quá xuất sắc!\" [powerful_vassal.GetFirstName] đập bàn nhẹ nhõm. \"Ta khó có thể nghĩ ra [ROOT.Char.GetWomanMan] nào tốt hơn để cùng cầm vũ khí.\" [powerful_vassal.GetSheHe|U] vươn tay qua và nắm chặt tay ta trong tay [powerful_vassal.GetHerHis].\n\n\"Cùng nhau, chúng ta có thể vẫn giành lại những vùng đất này từ con rắn Norman đó. Bây giờ, chúng ta phải nhanh chóng-\"\n\n\""
  ep3_laamps.6016.ending: "[powerful_vassal.GetSheHe|U] mở miệng định nói thêm lần nữa, nhưng cánh cửa sập mở cắt ngang [powerful_vassal.GetHerHim]. Một người đưa tin, ướt sũng và ánh mắt hoang dại, ngắt quãng phản ứng phẫn nộ của [powerful_vassal.GetFirstNamePossessiveNoTooltip] bằng cách giơ ra một bức thư.\n\nTa chờ đợi trong khi [powerful_vassal.GetFirstNameNoTooltip] xé phong thư và đọc lướt qua tờ giấy da.\n\nMàu sắc dần rút khỏi khuôn mặt [powerful_vassal.GetHerHis]."
  ep3_laamps.6016.a: "\"Có chuyện gì vậy?\""
  ep3_laamps.6016.a.tt: "Ngươi nhận lấy bức thư được đưa..."

  ep3_laamps.6020.t: "Cơn Hủy Diệt Miền Bắc"
  ep3_laamps.6020.desc: "Việc lắp đặt một vị vua ngoại quốc mới — và hơn nữa lại là một tên khốn [william.GetCulture.GetName] — đã chứng tỏ đủ để làm đứt sợi dây vốn đã sờn cũ đang giữ nước Anh lại với nhau. Các cuộc nổi dậy cục bộ, được tài trợ và khích lệ bởi những [Glossary( 'Æthelings', 'AETHELINGS_GLOSS' )] người Anglo-Saxon thất trận và đầy oán hận, đã lan rộng khắp cả nước như cháy rừng.\n\n[william.GetTitledFirstName], sau khi đảm bảo được cơ sở quyền lực của [william.GetHerHis] ở phía nam, giờ đây đang nhìn về phía bắc để bình định những kẻ dũng cảm và dại dột đủ để chống lại ngài ta. Bất cứ nơi nào ánh nhìn của [william.GetHerHis] rơi xuống, cái chết và sự hủy diệt sẽ theo sau, và một cuộc chiến tuyệt vọng vì lãnh thổ đã nổ ra.\n\n[william.GetFirstNameNoTooltip] sẽ phải đi trên một sợi dây mảnh giữa chiếc găng tay và găng sắt. Một cái chạm quá nhẹ nhàng có thể khiến ngài ta mất đi vương quốc của mình, nhưng sự trả thù quá tàn bạo sẽ chẳng còn lại vương quốc nào để cai trị.\n\nĐối với các Æthelings, chỉ có cái chết hoặc vinh quang đang chờ đợi."
  ep3_laamps.6020.a: "Nước Anh đang treo lơ lửng."
  AETHELINGS_GLOSS: "\"Ætheling\" là một thuật ngữ Anglo-Saxon dùng để chỉ bất kỳ người Anglo-Saxon quý tộc nào, và tiền tố 'Æthel' thường được gắn vào tên của họ."
  every_aetheling: "Mọi [vassal|E] $anglo_saxon$ của [william.GetTitledFirstName]"
  every_county: "Mọi [county|E]"

  ep3_laamps.6021.desc: "Việc ta chính thức lên ngôi vương nước Anh đã chứng tỏ đủ để làm đứt sợi dây vốn đã sờn cũ đang giữ vương quốc này lại với nhau. Các cuộc nổi dậy cục bộ, được tài trợ và khích lệ bởi những [Glossary( 'Æthelings', 'AETHELINGS_GLOSS' )] người Anglo-Saxon thất trận và đầy oán hận, đã lan rộng khắp cả nước như cháy rừng.\n\nVới cơ sở quyền lực ở phía nam đã được đảm bảo, giờ đây ta phải nhìn về phía bắc để bình định những kẻ dũng cảm và dại dột đủ để chống lại ta. Bất cứ nơi nào ánh nhìn của ta rơi xuống, cái chết và sự hủy diệt sẽ theo sau, kẻo ta thấy vị thế của mình bị những kẻ bản địa mưu mô tiếm quyền.\n\nTa phải đi trên một sợi dây mảnh giữa sự mềm mỏng và cứng rắn. Một cái chạm quá nhẹ nhàng sẽ khiến ta mất đi vương quốc của mình, nhưng trả thù quá tàn bạo sẽ chẳng để lại cho ta vương quốc nào để cai trị. Tuy nhiên, đối với các Æthelings thì...\n\nSẽ không có sự khoan hồng cho những kẻ không chịu thần phục."

  ep3_laamps.7000.t: "Một Con Đường Khác"
  ep3_laamps.7000.desc: "Khi hỗn loạn tràn ngập đất nước [england.GetName], Ta đôi khi tự hỏi liệu số mệnh của mình có nằm ở nơi khác.\n\nSự biến động đã bắt đầu, sau khi [william.GetTitledFirstNamePossessive] nắm quyền kiểm soát đất nước. Ta đoán mọi chuyện sẽ còn tệ hơn hiện tại, và một cuộc sống rong ruổi theo dấu chân cha mình cũng hấp dẫn.\n\nCó lẽ Ta có thể đi lên phía bắc, tới Scotland? Hay có thể xuống miền nam Italy, ở các sườn đồi Apulia?"
  ep3_laamps.7000.a: "Scotland nghe có vẻ hợp lý."
  ep3_laamps.7000.b: "Ta đã cảm nhận được vị dầu ô liu Apulia rồi!"
  ep3_laamps.7000.c: "Ta không thể trốn tránh nhiệm vụ của mình."

  ep3_laamps.7001.t: "Còn Một Người Khác"
  ep3_laamps.7001.desc: "\"[ROOT.Char.GetFirstNameNoTooltip]? Đây là nơi [ROOT.Char.GetFirstNameNoTooltip] sống sao? Ah- buông ta ra, ngươi-\" Một giọng nói vang lên báo hiệu khách đến, nhanh chóng bị lính hộ vệ vây quanh. Ta bước ra khỏi lều thấy một [siward.GetWomanMan] cường tráng, kiếm đặt trên vai [siward.GetHerHis].\n\n\"Ngươi! Chính là [ROOT.Char.GetFirstNameNoTooltip], đúng không?\" Ta gật đầu xác nhận khi [siward.GetSheHe] tiến tới, tay trống đưa ra.\n\n\"Tên tuổi ngươi vang xa rồi! Ta là [siward.GetFirstName], thuộc [siward.GetHouse.GetBaseName]. Ta đến để gia nhập ngươi.\""
  ep3_laamps.7001.a: "\"[siward.GetFirstNameNoTooltip], phải không? Hoan nghênh!\""
  ep3_laamps.7001.b: "\"Chúng ta đã đầy, tiếc là vậy.\""

  ep3_laamps.7002.t: "Một Nước Anh Mới"
  ep3_laamps.7002.desc: "[siward.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('siward'))] trung thành của ta, tiến lại gần ta với ánh mắt lấp lánh trong mắt [siward.GetHerHis].\n\n\"Ta đến để nói lời tạm biệt.\" [siward.GetSheHe|U] cắt ngang những phản đối sắp tới của ta bằng một bàn tay giơ lên. \"Ta đã quyết định rồi, không gì có thể ngăn cản ta được.\" [siward.GetSheHe|U] ra hiệu cho ta ngồi xuống.\n\n\"Có những lời thì thầm từ Constantinople. [emperor.GetTitledFirstName] cung cấp lối đi an toàn cho bất kỳ người tị nạn nào khỏi cơn thịnh nộ của [king_england.GetTitledFirstNamePossessive], và một cơ hội để xây dựng lại.\" [siward.GetFirstNameNoTooltip] vỗ vào đùi [siward.GetHerHis] và nhìn quanh.\n\n\"Ta sẽ nhớ nơi này. Tạm biệt, [ROOT.Char.Custom('SisterBrother')] của ta.\""
  ep3_laamps.7002.a: "\"Chúc ngươi hành trình an toàn. Mong tìm thấy bình yên.\""
  ep3_laamps.7002.b: "Nghe có vẻ #EMP rất#! thú vị..."
  ep3_laamps.7002.c.success: "[siward.GetFirstNameNoTooltip] ở lại"
  ep3_laamps.7002.c.failure: "[siward.GetFirstNameNoTooltip] ra đi"

  ep3_laamps.7003.t: "Khán Giả Hoàng Gia"
  ep3_laamps.7003.desc: "Được gặp [emperor.GetTitleAsNameNoTooltip] không phải chuyện nhỏ, nhưng rõ ràng việc Ta đến cùng nhóm người ngoại quốc rách rưới đã khiến nhiều người xôn xao.\n\n\"Chào mừng, [ROOT.Char.GetFirstName] của [ROOT.Char.GetHouse.GetBaseName]. Ngươi đến đây tìm nơi trú ẩn khỏi nỗi khổ của quê hương?\" Ta chỉ có thể gật đầu; [emperor.GetTitleAsNameNoTooltip] mỉm cười nghiêm nghị, không hài hước. \"Ngươi sẽ an toàn ở đây, nhưng điều lớn lao hơn đang chờ đợi ngươi.\"\n\n\"Phía đông bắc có những vùng đất do một chư hầu bạc lòng cai trị. Hãy đến đó, chiếm lấy, và ngươi có thể giữ lại với điều kiện trung thành.\"\n\nLời [emperor.GetTitleAsNamePossessiveNoTooltip] vang lên trong sự ngạc nhiên. Một vương quốc mới? Cho chúng Ta những kẻ chạy trốn?"
  ep3_laamps.7003.a: "\"Ta nhận lời đề nghị của ngài, đại [emperor.GetTitleAsNameNoTooltip].\""
  ep3_laamps.7003.a.tt: "Ngươi bắt đầu lên đường đến vùng đất mới..."
  ep3_laamps.7003.b: "\"Ta muốn ở lại đây, tại Constantinople.\""

  ep3_laamps.7004.t: "Một Khán Giả Hoàng Gia Khác"
  ep3_laamps.7004.desc: "\"Ngài đã phái ngươi đến đây sao, [emperor.GetSheHe]? Gọi chúng là đất của [emperor.GetHerHis], [emperor.GetSheHe] nói vậy sao?\" Môi của [title_holder.GetFirstNamePossessive] cong lên vì giận dữ và chế giễu. \"Ngươi đã bị bán một câu chuyện rồi, đồ ngốc ạ.\"\n\nCó vẻ như Đế chế [emperor.GetTitleAsNamePossessiveNoTooltip] không mở rộng xa như [emperor.GetSheHe] đã ngụ ý. Những vùng đất chúng ta khám phá khi đến nơi — những vùng đất có rừng rậm dày đặc nhưng lại đáng ngạc nhiên là màu mỡ — hoàn toàn không nằm trong tay người Hy Lạp, mà thay vào đó là của [title_holder.GetTitleAsNameNoTooltip] [title_holder.GetFirstNameNoTooltip].\n\n\"Tên chó đó trên ngai vàng sang trọng của [emperor.GetHerHis] đã dẫn ngươi đi sai đường. Nhưng...\" [title_holder.GetSheHe|U] dừng lại để nhìn ta và những người theo hầu rách rưới nhưng đầy nhiệt huyết của ta. \"...có lẽ các ngươi #EMP có thể#! cung cấp thứ gì đó. Nếu ngươi có tiền để mua đường đi, ngươi có thể có những vùng đất này. Tất nhiên là với tư cách chư hầu của ta.\""
  ep3_laamps.7004.a: "\"Ta sẽ vô cùng vinh dự.\""
  ep3_laamps.7004.b: "\"Những vùng đất này đã được hứa. Ta sẽ chiếm bằng vũ lực.\""

 ##################################################
 # LOANED COURTIER RETURNS

  ep3_laamp_flavour_ewan.9511.t: "Người Theo Trở Về: [visitor.GetTitledFirstNameNicknamedNoTooltip]"
  ep3_laamp_flavour_ewan.9511.desc.intro: "Sau nhiều năm xa cách với [host.GetTitledFirstName], [visitor.GetFirstNameNicknamed], người theo hầu trung thành của ta, cuối cùng đã tìm được đường trở về với chúng ta.\n\n\""
  ep3_laamp_flavour_ewan.9511.desc.spouse.got_married: "Dù [visitor.GetSheHe] [visitor.GetHerselfHimself] không thay đổi nhiều kể từ khi rời [ROOT.Char.GetPrimaryTitle.GetDefinitiveName], có vẻ [visitor.GetSheHe] #EMP đã#! tìm được một [visitor_spouse.Custom('WifeHusband')] địa phương từ [capital.GetBaseNameNoTier] — [visitor_spouse.GetFirstName], người đã đi cùng [visitor_spouse.GetHerHis] [visitor.Custom('WifeHusband')] trở về trại."
  ep3_laamp_flavour_ewan.9511.desc.spouse.nope: "[visitor.GetSheHe|U] hầu như chẳng thay đổi gì kể từ cái ngày [visitor.GetSheHe] rời bỏ [ROOT.Char.GetPrimaryTitle.GetDefinitiveName], dù tốt hay xấu, và chủ yếu chỉ cảm thấy vui mừng khi được trở lại giữa những người quen cũ."
  ep3_laamp_flavour_ewan.9511.desc.outro: "\n\nBạn Bè cũ và gương mặt mới cùng nhau tiến đến chào đón [visitor.GetWomanMan] trở về, ai cũng vui mừng trước tin bất ngờ tốt lành."
  ep3_laamp_flavour_ewan.9511.a: "Chào mừng, chào mừng!"
  ep3_laamp_flavour_ewan.9511.b: "#EMP Đã kết hôn?#! Ta nghĩ không!"
  ep3_laamp_flavour_ewan.9511.c: "Ngươi không còn cần thiết nữa. Đi đi."

  ep3_laamp_flavour_ewan.9512.t: "Người Theo Trở Về Cải Thiện: [visitor.GetTitledFirstNameNicknamedNoTooltip]"
  ep3_laamp_flavour_ewan.9512.desc: "\"[ROOT.Char.GetTitledFirstNameNoTooltip]!\" giọng nói quen thuộc của [visitor.GetFirstName] vang lên, phấn khích bước vào trại sau vài năm xa cách [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]. \"Ta đã trở lại, và ta không hề nhàn rỗi trong thời gian bị lưu đày!\"\n\nQuả thực là vậy, [visitor.GetSheHe] không hề nhàn rỗi — dường như khoảng thời gian ở cùng [host.GetTitledFirstName] đã cho [visitor.GetHerHim] cơ hội rộng mở để thực hành các kỹ năng của [visitor.GetHerHis], điều mà [visitor.GetSheHe] dường như rất muốn áp dụng ngay khi đã trở lại với chúng ta."
  ep3_laamp_flavour_ewan.9512.a: "Ngươi đã trưởng thành thật, [visitor.GetFirstNameNoTooltip]!"
  ep3_laamp_flavour_ewan.9512.b: "Biến đi, kẻ lang thang."

  ep3_laamp_flavour_ewan.9521.t: "Không Như Ta Nhớ: [visitor.GetTitledFirstNameNicknamedNoTooltip]"
  ep3_laamp_flavour_ewan.9521.desc.intro: "Sau vài năm rời xa chúng ta, người theo hầu của ta là [visitor.GetTitledFirstNameNicknamed] cuối cùng đã trở lại.\n\nTuy nhiên... [visitor.GetSheHe] không hoàn toàn giống như khi rời bỏ chúng ta."
  ep3_laamp_flavour_ewan.9521.desc.source.host: "Có vẻ thời gian ở với [host.GetTitledFirstName] đã để lại dấu ấn sâu sắc lên cử chỉ và tính cách [visitor.GetHerHis] — [visitor.GetSheHe] giờ dường như mang nhiều nét [new_culture.GetName] hơn [old_culture.GetName].\n\n"
  ep3_laamp_flavour_ewan.9521.desc.source.capital: "Rõ ràng những ngày tháng ở [capital.GetBaseNameNoTier] đã định hình nên [visitor.GetHerHis], vì mọi dấu vết của những cách thức [old_culture.GetName] cũ của [visitor.GetHerHis] đã biến mất, thay vào đó là ngôn từ và cử chỉ của những người [new_culture.GetCollectiveNoun].\n\n"
  ep3_laamp_flavour_ewan.9521.desc.reaction.changed_away: "Là người [old_culture.GetNameNoTooltip], sự thay đổi này thật... đáng lo ngại."
  ep3_laamp_flavour_ewan.9521.desc.reaction.changed_to: "Dĩ nhiên, là người [new_culture.GetNameNoTooltip], Ta hoàn toàn có thể giáo dục [visitor.GetHerHim] #EMP mà không cần#! phải mất nhiều năm xa cách."
  ep3_laamp_flavour_ewan.9521.desc.reaction.uninvolved: "Thật lạ khi thấy thời gian thay đổi [visitor.GetHerHim], nhưng Ta đoán ai cũng trải qua những giai đoạn chuyển đổi."
  ep3_laamp_flavour_ewan.9521.desc.outro: "\n\nBản thân [visitor.GetFirstNameNoTooltip] dường như không hề bận tâm bởi sự biến đổi của mình, chỉ đơn giản là cảm thấy vui mừng khi được trở lại trại."
  ep3_laamp_flavour_ewan.9521.tt.primary_skill.diplomacy: "Nhận được [skill_1.GetValue|V0] [diplomacy|E] [skill|E] nhờ học cách tiếp nhận [new_culture.GetName] [ethos|E]"
  ep3_laamp_flavour_ewan.9521.tt.primary_skill.martial: "Nhận được [skill_1.GetValue|V0] [martial|E] [skill|E] nhờ học cách tiếp nhận [new_culture.GetName] [ethos|E]"
  ep3_laamp_flavour_ewan.9521.tt.primary_skill.stewardship: "Nhận được [skill_1.GetValue|V0] [stewardship|E] [skill|E] nhờ học cách tiếp nhận [new_culture.GetName] [ethos|E]"
  ep3_laamp_flavour_ewan.9521.tt.primary_skill.learning: "Nhận được [skill_1.GetValue|V0] [learning|E] [skill|E] nhờ học cách tiếp nhận [new_culture.GetName] [ethos|E]"
  ep3_laamp_flavour_ewan.9521.tt.secondary_skill.diplomacy: "Nhận được [skill_2.GetValue|V0] [diplomacy|E] [skill|E] nhờ học cách tiếp nhận [new_culture.GetName] [ethos|E]"
  ep3_laamp_flavour_ewan.9521.tt.secondary_skill.stewardship: "Nhận được [skill_2.GetValue|V0] [stewardship|E] [skill|E] nhờ học cách tiếp nhận [new_culture.GetName] [ethos|E]"
  ep3_laamp_flavour_ewan.9521.tt.secondary_skill.intrigue: "Nhận được [skill_2.GetValue|V0] [intrigue|E] [skill|E] nhờ học cách tiếp nhận [new_culture.GetName] [ethos|E]"
  ep3_laamp_flavour_ewan.9521.tt.secondary_skill.learning: "Nhận được [skill_2.GetValue|V0] [learning|E] [skill|E] nhờ học cách tiếp nhận [new_culture.GetName] [ethos|E]"
  ep3_laamp_flavour_ewan.9521.tt.secondary_skill.prowess: "Nhận được [skill_2.GetValue|V0] [prowess|E] [skill|E] nhờ học cách tiếp nhận [new_culture.GetName] [ethos|E]"
  ep3_laamp_flavour_ewan.9521.a.changed_away: "Lạ thật, nhưng ngươi vẫn là một phần của chúng ta!"
  ep3_laamp_flavour_ewan.9521.a.changed_to: "Quyết định hợp lý!"
  ep3_laamp_flavour_ewan.9521.a.uninvolved: "Chào mừng trở lại!"
  ep3_laamp_flavour_ewan.9521.b: "Chúng ta không cần kẻ lạ #EMP [visitor.GetCulture.GetNameNoTooltip]#!, đi đi."

  ep3_laamp_flavour_ewan.9522.t: "$ep3_laamp_flavour_ewan.9521.t$"
  ep3_laamp_flavour_ewan.9522.desc.intro: "Mặc dù phải mất vài năm dài đằng đẵng, cuối cùng thì người theo hầu trước đây của ta, [visitor.GetTitledFirstNameNicknamed], đã tìm được đường quay trở lại [ROOT.Char.GetPrimaryTitle.GetDefinitiveName].\n\nChỉ là... có điều gì đó đã thay đổi —"
  ep3_laamp_flavour_ewan.9522.desc.source.host: "[visitor.GetSheHe] kể về [new_faith.GetAdjective] [new_faith.CreatorName] của [visitor.GetHerHis] [host.GetTitledFirstName] với sự tôn kính, tuyên bố đã tìm thấy cứu rỗi thật sự nhờ các giáo lý của [new_faith.GetNameNoTooltip]"
  ep3_laamp_flavour_ewan.9522.desc.source.capital: "[visitor.GetSheHe] nói về ánh sáng của [new_faith.GetName], tín ngưỡng tại [capital.GetBaseNameNoTier], với sự tôn kính, cho rằng đã tìm thấy cứu rỗi thật sự nhờ các giáo lý của [new_faith.HighGodNamePossessive]"
  ep3_laamp_flavour_ewan.9522.desc.source.bridge: "thay vì [old_faith.GetAdherentName] mà chúng ta đã để lại.\n\n"
  ep3_laamp_flavour_ewan.9522.desc.reaction.give_a_shit: "Không phải điều này quan trọng với Ta bằng người khác, nhưng vẫn thật đáng ngạc nhiên."
  ep3_laamp_flavour_ewan.9522.desc.reaction.changed_away: "Bỏ lại lối sống [old_faith.GetAdjectiveNoTooltip], vứt bỏ những truyền thống thiêng liêng như chiếc áo choàng ném xuống đất, thật gần như không thể tưởng tượng."
  ep3_laamp_flavour_ewan.9522.desc.reaction.changed_to_ours: "Dĩ nhiên, Ta rất vui khi biết [visitor.GetHerHis] đã chọn đúng, đón nhận cứu rỗi và ý nghĩa thực sự của sự tồn tại với [new_faith.HighGodName]."
  ep3_laamp_flavour_ewan.9522.desc.reaction.changed_to_lovable: "Mặc dù quyết định khiến Ta ngạc nhiên, nhưng không thể nói [new_faith.GetNameNoTooltip] là lối sống tệ. [ROOT.Char.GetFaith.GetName] cũng đánh giá cao."
  ep3_laamp_flavour_ewan.9522.desc.reaction.changed_to_acceptable: "Ta không thể biết động lực của [visitor.GetWomanMan] là gì, nhưng ít nhất [new_faith.GetNameNoTooltip] là tín ngưỡng chấp nhận được hơn nhiều trong thế giới vô thần này."
  ep3_laamp_flavour_ewan.9522.desc.reaction.uninvolved: "Là người [ROOT.Char.GetFaith.GetAdjective], việc [visitor.GetHerHis] cải đạo không #EMP quá#! quan trọng với Ta, nhưng chắc chắn là điều không ngờ."
  ep3_laamp_flavour_ewan.9522.desc.outro: "\n\nKhông quan tâm đến sự xôn xao mà sự trở lại đột ngột và những thay đổi của mình mang lại, [visitor.GetFirstNameNoTooltip] chỉ đơn giản tiếp tục công việc của [visitor.GetHerHis] như thể [visitor.GetSheHe] chưa bao giờ rời đi."
  ep3_laamp_flavour_ewan.9522.a: "Chào mừng, [visitor.Custom('SisterBrother')]!"
  ep3_laamp_flavour_ewan.9522.b: "Nhưng sao lại cải đạo sang [new_faith.GetNameNoTooltip]..."
  ep3_laamp_flavour_ewan.9522.c: "Ngươi đã làm gì thế, kẻ ngốc?!"
  ep3_laamp_flavour_ewan.9522.d: "[old_faith.GetAdherentNameNoTooltip], [new_faith.GetAdherentNameNoTooltip], ngươi vẫn là [visitor.GetFirstNameNoTooltip]."
  ep3_laamp_flavour_ewan.9522.e: "Rất vui khi ngươi trở lại, [visitor.GetFirstNameNoTooltip]."
  ep3_laamp_flavour_ewan.9522.f: "Ngươi không còn được chào đón tại đây nữa."

  ep3_laamp_flavour_ewan.9523.t: "$ep3_laamp_flavour_ewan.9521.t$"
  ep3_laamp_flavour_ewan.9523.desc.intro: "$ep3_laamp_flavour_ewan.9522.desc.intro$ [visitor.GetSheHe] nói chuyện và ăn mặc giống người [new_culture.GetCollectiveNoun] mà [visitor.GetSheHe] từng sống cùng, và cho rằng đã tìm thấy ánh sáng của duy nhất tín ngưỡng [new_faith.GetAdjective] thật sự của"
  ep3_laamp_flavour_ewan.9523.desc.source.host: "[visitor.GetHerHis] chủ nhà [host.GetTitledFirstName]"
