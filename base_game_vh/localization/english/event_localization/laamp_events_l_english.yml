l_english: 
  ep3_laamps.0001.t.female: "Từng là [lost_primary_title.Custom('GetTierBaseTitleFemale')]"
  ep3_laamps.0001.t.male: "Từng là [lost_primary_title.Custom('GetTierBaseTitleMale')]"
  ep3_laamps.0001.intro: "Thất bại nhục nhã và ô nhục!"
  ep3_laamps.0001.memory: "Cuộc [war_memory.MakeScope.Var('war_cb').GetFlagName] đáng nguyền rủa này đã cướp đi tất cả của ta!"
  ep3_laamps.0001.fallback: "Cuộc chiến đáng nguyền rủa này đã cướp đi tất cả của ta!"
  ep3_laamps.0001.desc: "Ta bị đẩy ra hoang dã, trong khi [winner.GetTitledFirstName] và binh lính của [winner.GetHerHis] ăn mừng chiến thắng!\n\nTa đã mất ngai vàng [lost_primary_title.GetAdjectiveNoTooltip]... và cái tên [winner.Custom('PersonalityGetNegativeTraitDesc')] [winner.Custom2('InsultNoun', ROOT.Char)] đó có thể ngay lúc này đang khoác lên mình vương quyền của #EMP ta#! [lost_primary_title.GetTierAsNameNoTooltip]!"
  ep3_laamps.0001.a: "Một ngày nào đó, ta #EMP sẽ#! giành lại lãnh thổ của mình!"
  ep3_laamps.0001.b: "Mọi thứ rơi vào tay [alt_1.GetFirstNameNoTooltipRegnal]."
  target_character_government: "[government|E]: [TARGET_CHARACTER.GetGovernment.GetName]"
  target_character_independent: "[independent_ruler|E]"
  target_character_liege: "[Select_CString(TARGET_CHARACTER.IsIndependentRuler, 'Độc lập', 'Chư hầu của')][Select_CString(TARGET_CHARACTER.IsIndependentRuler, "", TARGET_CHARACTER.GetLiege.GetName)]"
  ep3_laamps.0001.c: "[alt_2.GetFirstNameNoTooltipRegnal] phải gây dựng tương lai cho gia tộc ta."
  ep3_laamps.0001.d: "Giờ chúng ta trông cậy vào [alt_3.GetFirstNameNoTooltipRegnal]."
  ep3_laamps.0001.e: "Thời gian đã qua..."
  ep3_laamps.0003.opening: "[adventurer.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
  ep3_laamps.0003.desc: "Ngươi và lũ tay sai hèn hạ của ngươi có thể đã giành được [lost_primary_title.GetTierAsNameNoTooltip|l] của ta, nhưng hãy nhớ lấy: ta vẫn chưa kết thúc, và ta sẽ không từ bỏ [lost_primary_title.GetBaseNameNoTierNoTooltip] dễ dàng như vậy!"
  ep3_laamps.0003.a: "Ha! Kẻ ngu này cũng có chí khí!"
  ep3_laamps.0004.desc: "Những kẻ phản bội đáng nguyền rủa đã giành lấy [conquered.GetTierAsNameNoTooltip|l] của ta, đẩy ta ra hoang dã, trong khi [winner.GetTitledFirstName] và binh lính của [winner.GetHerHis] tung hô [heir.GetTitledFirstName] thay cho ta!\n\nTa đã để cho bọn phản loạn và dối trá cướp đi ngai vàng [conquered.GetAdjectiveNoTooltip] của mình... chúng ta thực sự chỉ là món đồ chơi của [ROOT.Char.GetFaith.FateGodName]..."
  lose_all_prestige_tt: "Ngài chỉ giữ lại tối đa #V 100#! [prestige_i][prestige|E]"
  lose_all_prestige_level_tt: "Ngài mất #value 3#! [prestige_levels|E]"

  ep3_laamps.0010.t: "Một [potential_laamp.Custom('GetDaughterSon')|U] thứ yếu của [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
  ep3_laamps.0010.single: "Khi ta là [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('potential_laamp'))]"
  ep3_laamps.0010.multi: "Khi là các anh chị em của ta"
  ep3_laamps.0010.desc: "và ta than khóc cho [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('deceased'))] quá cố, [deceased.GetTitledFirstNameRegnal], chúng ta bận rộn với việc phân chia lãnh địa của [deceased.GetHerHis].\n\n[inherited.GetBaseNameNoTierNoTooltip] thuộc về ta,"
  ep3_laamps.0010.inheritor_1: "[inherited_1.GetBaseNameNoTierNoTooltip] thuộc về [inheritor_1.GetFirstName];"
  ep3_laamps.0010.inheritor_2: "[inherited_2.GetBaseNameNoTierNoTooltip] thuộc về [inheritor_2.GetFirstName];"
  ep3_laamps.0010.inheritor_3: "[inherited_3.GetBaseNameNoTierNoTooltip] thuộc về [inheritor_3.GetFirstName];"
  ep3_laamps.0010.connector: "và"
  ep3_laamps.0010.laamp: "nhưng còn [potential_laamp.Custom('PersonalityGetPositiveTraitDesc')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('potential_laamp'))] của ta, [potential_laamp.GetFirstName] thì sao?\n\nTay trắng, [potential_laamp.GetSheHe] đứng bên lề theo dõi sự chuyển giao quyền lực: chẳng có buổi lễ nào dành cho #EMP [potential_laamp.GetHerHim]#!, chỉ có những lời thề với kẻ khác. Dòng máu quý tộc và thanh kiếm bên hông [potential_laamp.GetHerHis] là quyền thừa kế duy nhất của [potential_laamp.GetHerHis]."
  ep3_laamps.0010.a: "Than ôi, không phải ai cũng định mệnh để cai trị..."
  ep3_laamps.0010.b: "...dù ta #EMP thật sự#! ghen tị với tự do của [potential_laamp.GetFirstNamePossessiveNoTooltip]."

  ep3_laamps.0020.t: "Kẻ lưu đày [revoked.GetAdjectiveNoTooltip]"
  ep3_laamps.0020.desc: "Ta mất mọi thứ trong chớp mắt: [revoked.GetTierAsNameNoTooltip|l] của ta, các tước vị, danh dự...\n\nTên chó phản bội đó, [banisher.GetTitledFirstName], còn mong ta biết ơn vì mạng sống được tha, khi ta chỉ bị đày khỏi [banisher.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]! Ngay cả kẻ ngu cũng biết lưu đày đôi khi còn là số phận #EMP tệ hơn#! cái chết..."
  ep3_laamps.0020.a: "Ta sẽ không từ bỏ [revoked.GetBaseNameNoTierNoTooltip] dễ dàng như vậy!"
  ep3_laamps.0022.desc: "Ngươi có thể lấy [revoked.GetTierAsNameNoTooltip|l] của ta để đổi lấy tự do cho ta, nhưng [revoked.GetBaseNameNoTier] không phải của ngươi để lấy, và ta sẽ không để cho quyền thừa kế của mình bị lãng quên.\n\nMột ngày nào đó vai trò của chúng ta có thể đảo ngược, và mạng sống của ngươi sẽ nằm trong tay #EMP ta#!."
  ep3_laamps.0022.a: "Sủa to, nhưng chẳng cắn được."

  ep3_laamps.0030.t: "Vượt ra ngoài [old_primary_title.GetBaseNameNoTierNoTooltip]"
  ep3_laamps.0030.desc: "Cuối cùng ta sẽ từ bỏ những trappings, trách nhiệm vụn vặt và công việc tẻ nhạt của cuộc sống tại [old_capital_province.GetNameNoTooltip], và dựng trại giữa [old_capital_province.Custom('GetTerrainTypePlural')] rộng mở!\n\nTa được theo cùng bởi những người hầu và tín đồ trung thành nhất, với mức độ nhiệt tình khác nhau cho cuộc sống mới nơi hoang dã.\n\n"
  ep3_laamps.0030.heir: "Thay ta, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('laamp_inheritor'))] và người thừa kế, [laamp_inheritor.GetFirstName], đã tiếp nhận tước vị của ta với tư cách [laamp_inheritor.GetTitleAsNameNoTooltip] của [laamp_inheritor.GetPrimaryTitle.GetNameNoTierNoTooltip]."
  ep3_laamps.0030.liege: "Lãnh địa cũ của ta chuyển sang lãnh chúa trước đây, [laamp_inheritor.GetTitledFirstName], người đã chấp nhận quyết định rời bỏ sự phục vụ của [laamp_inheritor.GetHerHis]."
  ep3_laamps.0030.new: "Thay ta, [laamp_inheritor.GetFirstName], một lãnh chúa địa phương, đã được quý tộc lựa chọn cai trị lãnh địa cũ của ta."
  ep3_laamps.0030.a: "Vậy chúng ta còn chờ gì nữa?"
  ep3_laamps.0032.opening: "[adventurer.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
  ep3_laamps.0032.desc: "Một cuộc đời phiêu lưu hơn, chu du khắp thế giới, đang gọi ta. Sau nhiều cân nhắc, ta đã quyết định từ bỏ lãnh địa cho ngài, lãnh chúa của ta, để ngài giữ lấy. Ta sẽ sớm rời [old_primary_title.GetBaseNameNoTierNoTooltip] để bước lên con đường phiêu lưu."
  ep3_laamps.0032.a: "Một quyết định táo bạo, có người sẽ gọi là ngu ngốc."

  ep3_laamps.0040.t: "Từ Giàu Sang Thành Nghèo Khó"
  ep3_laamps.0040.family: "#EMP làm sao#! mà [actor.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))]"
  ep3_laamps.0040.other: "#EMP làm sao#! mà lãnh chúa [actor.Custom2('InsultAdjective', ROOT.Char)] của ta "
  ep3_laamps.0040.desc: "dám #EMP cả gan#!! Tước vị của ta bị tước bỏ! Lãnh địa của ta mất sạch! Địa vị của ta tan nát!\n\nNếu ta muốn bảo vệ và khôi phục tài sản chính đáng của mình, chưa nói đến danh dự, có lẽ ta phải bắt đầu từ con số không!\n\nLòng tham vô độ của [actor.GetTitledFirstNamePossessive] sẽ phải được trả giá, dù con đường có dài đến đâu..."
  ep3_laamps.0040.a: "[actor.GetSheHe|U] sẽ không thoát khỏi chuyện này."
  ep3_laamps.0042.desc: "Việc ngươi tịch thu [landed_title.GetTierAsNameNoTooltip|l] của ta khiến ta không còn lựa chọn nào khác; ngươi đã ép ta vào cuộc sống phiêu lưu.\n\nTa vẫn chưa kết thúc, và sẽ không quên quyền thừa kế chính đáng của mình đối với [landed_title.GetNameNoTierNoTooltip]!"
  ep3_laamps.0042.a: "Ta cho [actor.GetHerHim] tối đa hai tuần."

  ep3_laamps.0050.t: "Đi Theo Con Đường Riêng của [potential_laamp.GetHerHis|U]"
  ep3_laamps.0050.desc: "Người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('potential_laamp'))] của ta, [potential_laamp.GetFirstName], gần đây trở nên bồn chồn, và ta không ngạc nhiên khi một buổi tối [potential_laamp.GetSheHe] chặn ta lại, khi chúng ta nhìn ra [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] của [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip].\n\n"[potential_laamp.Custom2('RelationToMeShort', ROOT.Char)|U]," [potential_laamp.GetSheHe] thở dài, nhìn về phía chân trời, "Con chán những [ROOT.Char.Custom('ResidenceBuildingPlural')] rồi. Con muốn ra ngoài #EMP kia#!, nhìn thế giới! Con muốn để lại dấu ấn #EMP của riêng mình#!."\n\n[potential_laamp.GetSheHe|U] dường như thực sự quyết tâm, tràn đầy nhiệt huyết mà ta đã lâu chưa thấy ở [potential_laamp.GetHerHim], hoặc bất kỳ ai khác."
  ep3_laamps.0050.a: "Con làm Nhà [ROOT.Char.GetHouse.GetBaseNameNoTooltip] tự hào!"
  ep3_laamps.0050.b: "Nếu con phải đi, ta sẽ không giữ con lại."
  ep3_laamps.0050.c: "Đừng ngớ ngẩn!"
  ep3_laamps.0051.desc: "Sáng hôm sau khi thức dậy, cuộc cãi vã với [potential_laamp.GetFirstName] vẫn còn đè nặng trong tâm trí, ta được báo rằng tên [potential_laamp.Custom('PersonalityGetNegativeTraitDesc')] khốn đã biến mất trong đêm!\n\nTên ngu đó đã không nghe mệnh lệnh rõ ràng của ta, bỏ đi vào hoang dã chơi với bọn du côn!"
  ep3_laamps.0051.a: "Đứa nhóc láo xược..."
  ep3_laamps.0051.b: "...nhưng đúng là có chí khí!"
  allowed_runaway_laamp_opinion: "Được phép Phiêu Lưu"
  forbidden_runaway_laamp_opinion: "Cấm Phiêu Lưu"

  ep3_laamps.0100.t: "Một Giá cho Mọi Thứ"
  ep3_laamps.0100.desc: "Ta hầu như không tin nổi khi nhận được sự đồng ý của [recipient.GetTitledFirstNamePossessive] với đề nghị của ta; cuối cùng ta sẽ có một [ROOT.Char.Custom('FortifiedBuilding')] của riêng mình, với mái nhà và bốn bức tường vững chắc!\n\nTa sẽ là [ROOT.Char.GetTitleAsNameNoTooltip] mới của [ROOT.Char.GetPrimaryTitle.GetNameNoTier],"
  ep3_laamps.0100.desc_nomadic: "Ta dẫu nằm mơ cũng khó tin được khi nhận được sự chuẩn thuận của [recipient.GetTitledFirstNamePossessive] dành cho đề nghị của mình; cuối cùng ta cũng đã có lãnh địa của riêng mình, một vùng đất trù phú để chăn thả đàn gia súc!\n\nTừ nay, ta sẽ là [ROOT.Char.GetTitleAsNameNoTooltip] mới của [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier],"
  ep3_laamps.0100.fellow_vassal: "cai trị khu vực như một chư hầu cùng bậc với [new_liege.GetName], phụ thuộc và tuân phục lãnh chúa mới của ta đồng đều."
  ep3_laamps.0100.liege: "cai trị khu vực như một chư hầu [recipient.GetPrimaryTitle.GetAdjectiveNoTooltip], phụ thuộc và tuân phục lãnh chúa mới của ta đồng đều."
  ep3_laamps.0100.independent: "cai trị vùng đất [recipient.GetPrimaryTitle.GetAdjectiveNoTooltip] cũ này như lãnh địa riêng của ta!"
  ep3_laamps.0100.unpopular: "\n\nDù vậy, bước thăng tiến nhanh chóng của ta trên [actor.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip] chắc chắn đã khiến các lords và ladies khác khó chịu..."
  ep3_laamps.0100.fallback: "\n\nĐây là một chặng đường dài, nhưng cuối cùng ta cũng có thể rời khỏi giường trại..."
  ep3_laamps.0100.a: " Ha — và người ta nói 'quý tộc không thể mua được'!"
  ep3_laamps.0101.opening: "[recipient.Custom2('AppropriateGreetingPositive', actor)]"
  ep3_laamps.0101.desc: "Ta vô cùng phấn khởi khi nghe ngươi chấp nhận đề nghị của ta!\n\nVàng đã được gửi đi, và ta sẽ chuyển đến sinh sống tại [new_primary_title.GetPreferredCapital.GetName]"
  ep3_laamps.0101.fellow_vassal: "như một chư hầu cùng bậc với [new_liege.GetName]."
  ep3_laamps.0101.liege: "như chư hầu khiêm tốn của ngươi."
  ep3_laamps.0101.independent: "và cai trị nó như lãnh địa riêng của mình."
  ep3_laamps.0101.a: "[actor.GetSheHe|U] tốt nhất nên biết thân biết phận [actor.GetHerHis]."
  ep3_laamps.0101.b: "Hy vọng đây không phải là sai lầm."
  ep3_laamps.0101.c: "Một thương vụ công bằng, hy vọng vậy."
  ep3_laamps.0101.liege_message.title: "Chư hầu bán đất"
  ep3_laamps.0102.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor)]"
  ep3_laamps.0102.desc: "Ngươi đưa ra một đề nghị thật nực cười. Ngươi có thực sự nghĩ ta sẽ bán các tước vị của mình sao? Và lại cho một [actor.GetWomanMan] như #EMP ngươi?!#!"
  ep3_laamps.0102.a: "Không cần thô lỗ như vậy."


  ep3_laamps.0200.opening: "[recipient.Custom2('AppropriateGreeting', actor)]"
  ep3_laamps.0200.desc: "Rất tốt, ta sẽ giúp ngươi xâm chiếm [secondary_recipient.GetTitledFirstNamePossessive] [secondary_recipient.GetPrimaryTitle.GetTierAsNameNoTooltip], với điều kiện ngươi thề trung thành với ta nếu chiến thắng."
  ep3_laamps.0200.a: "Tuyệt vời!"
  ep3_laamps.0201.opening: "[recipient.Custom2('AppropriateGreeting', actor)]"
  ep3_laamps.0201.desc: "Ta đã cân nhắc kỹ lưỡng đề nghị của ngươi và kết luận rằng hiện tại ta không thể hỗ trợ ngươi."
  ep3_laamps.0201.a: "Dù sao ta cũng không cần [recipient.GetHerHim]..."
 
  ep3_laamps.0300.t: "...Và Kẻ Thù Càng Gần"
  ep3_laamps.0300.desc: "Sau khi chờ đợi hồi hộp phản hồi của [recipient.GetFirstNamePossessive] về đề nghị của ta, không thể phủ nhận sự nhẹ nhõm khi thấy [recipient.GetHerHis] ký duyệt trên văn thư.\n\nVậy là xong: [recipient.GetSheHe] sẽ là [recipient.GetTitleAsNameNoTooltip] mới của [recipient.GetPrimaryTitle.GetNameNoTier],"
  ep3_laamps.0300.fellow_vassal: "cai trị khu vực như chư hầu cùng bậc với [new_liege.GetName]."
  ep3_laamps.0300.liege: "cai trị khu vực như chư hầu của ta — nếu [recipient.GetSheHe] tuân thủ."
  ep3_laamps.0300.independent: "cai trị vùng đất [recipient.GetPrimaryTitle.GetAdjectiveNoTooltip] hợp pháp như lãnh địa riêng của [recipient.GetHerHis]!"
  ep3_laamps.0300.unpopular: "\n\nSự thăng tiến nhanh chóng của [recipient.GetHerHis|U] vào hàng ngũ quý tộc [actor.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] chắc chắn sẽ khiến nhiều người ngạc nhiên trong [actor.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]..."
  ep3_laamps.0300.fallback: "\n\nCó lẽ cuối cùng ta có thể chuyển sự chú ý sang những vấn đề quan trọng hơn..."
  ep3_laamps.0300.a: "Hy vọng đây là kết thúc của chuyện này."
  ep3_laamps.0301.opening: "[actor.Custom2('AppropriateGreetingPositive', recipient)]"
  ep3_laamps.0301.desc: "Ta mừng vì ngươi đã nhận ra lý do, và tin rằng điều này kết thúc tranh chấp của chúng ta.\n\n[new_primary_title.GetPreferredCapital.GetNameNoTier] đã được chuẩn bị sẵn cho ngươi, để cai trị"
  ep3_laamps.0301.fellow_vassal: "như chư hầu cùng bậc với [new_liege.GetName]."
  ep3_laamps.0301.liege: "như chư hầu của ta."
  ep3_laamps.0301.independent: "như lãnh địa riêng của ngươi."
  ep3_laamps.0301.a: "Ta sẵn sàng phục vụ ngươi."
  ep3_laamps.0301.b: "Kẻ ngã giờ trở nên hùng mạnh thật!"
  ep3_laamps.0301.c: "Một [ROOT.Char.GetTitleAsNameNoTooltip] cuối cùng."
  ep3_laamps.0301.liege_message.title: "Chư hầu hòa giải nhà phiêu lưu"
  ep3_laamps.0302.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor)]"
  ep3_laamps.0302.desc: "Ngươi nghĩ ta có thể dễ dàng mua chuộc bằng những tước vị ít ỏi này sao? Nếu ta muốn chúng, ta sẽ cướp chúng từ ngươi bằng kiếm."
  ep3_laamps.0302.a: "Ôi! Kẻ vô danh chết tiệt này!"
 #
  ep3_laamps.0800.t: "Ngã Rẽ Trên Đường"

  ep3_laamps.0800.inherited: "Một sứ giả đến mang theo tin nặng nề về việc ta thừa kế [new_title.GetBaseNameNoTier], cùng các vùng lãnh thổ liên quan, từ [previous_holder.GetFullName]..."
  ep3_laamps.0800.abdication: "Một sứ giả đã đến mang theo tin nặng nề về việc ta thừa kế [new_title.GetBaseNameNoTier], cùng các vùng lãnh thổ liên quan, sau khi [previous_holder.GetFullNamePossessive] thoái vị..."
  ep3_laamps.0800.granted: "Một sứ giả đã đến mang theo tin nặng nề về việc [new_liege.GetTitledFirstNamePossessive] ban cho ta [new_title.GetBaseNameNoTier], cùng các vùng lãnh thổ liên quan..."
  ep3_laamps.0800.election: "Một sứ giả đã đến mang theo tin nặng nề về việc ta được bầu làm người cai trị [new_title.GetBaseNameNoTier], cùng các vùng lãnh thổ liên quan..."
  ep3_laamps.0800.faction: "Một sứ giả đã đến mang theo tin nặng nề rằng quý tộc của [new_title.GetBaseNameNoTier] đã trao quyền cai trị cho ta, đẩy [previous_holder.GetFullName] ra ngoài..."
  ep3_laamps.0800.claim_war: "Cuối cùng, ta đã đánh bại [previous_holder.GetTitledFirstName] và giành lại đất đai hợp pháp của mình. Tương lai của [new_title.GetBaseNameNoTier] giờ nằm trong tay ta..."
  ep3_laamps.0800.holy_war: "Cuối cùng, ta đã đánh bại [previous_holder.GetTitledFirstName] và chiếm lấy đất của [previous_holder.GetHerHis] nhân danh [ROOT.Char.GetFaith.HighGodName]. Tương lai của [new_title.GetBaseNameNoTier] giờ nằm trong tay ta..."
  ep3_laamps.0800.conquest: "Cuối cùng, ta đã đánh bại [previous_holder.GetTitledFirstName] và chinh phục đất đai của [previous_holder.GetHerHis]. Tương lai của [new_title.GetBaseNameNoTier] giờ nằm trong tay ta..."
  ep3_laamps.0800.vassal: "\n\nTa có định mệnh để nhận lấy ngai vị, và ngồi tại [new_capital.GetCountyData.GetCapital.GetBaronyNameExplicitlyNoTooltip], phục vụ [new_liege.GetTitledFirstNameRegnal] như một chư hầu [new_liege.GetPrimaryTitle.GetAdjectiveNoTooltip] [ROOT.Char.GetLadyLord]?"
  ep3_laamps.0800.independent: "\n\nTa có định mệnh để nhận lấy ngai vị, và ngồi tại [new_capital.GetCountyData.GetCapital.GetBaronyNameExplicitlyNoTooltip], một [ROOT.Char.GetLadyLord] có chủ quyền theo đúng quyền của mình?"
  ep3_laamps.0800.desc: "\n\nCuộc sống trên đường chắc chắn đầy thử thách và nguy hiểm, nhưng thật là tự do! Ta không thể phủ nhận sức hấp dẫn của nó, không bị ràng buộc bởi nhiều trách nhiệm cai trị.\n\n"
  ep3_laamps.0800.a: "Đúng vậy, đã đến lúc rời bỏ trại của mình..."
  ep3_laamps.0800.a.tt: "#mixed_value #BER [THIS.Char.GetShortUIName|U] sẽ trở thành một [landed|E] [ruler|E]#!#!"
  ep3_laamps.0800.b: "Con đường gọi ta: [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('alt_1'))], [alt_1.GetFirstNameNoTooltip], có thể giữ lấy nó!"
  ep3_laamps.0800.b.claimant: "Con đường gọi ta: để [alt_1.GetFirstNameNoTooltip] nhận lấy quyền thừa kế của [alt_1.GetHerHis]!"
  ep3_laamps.0800.c: "Ta sẽ giao [new_title.GetBaseNameNoTierNoTooltip] cho [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('alt_2'))], [alt_2.GetFirstNameNoTooltip]."
  ep3_laamps.0800.c.claimant: "Ta sẽ giao nó cho người thừa kế hợp pháp: [alt_2.GetFirstNameNoTooltip]!"
  ep3_laamps.0800.d: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('alt_3'))] của ta, [alt_3.GetFirstNameNoTooltip], sẽ cai trị [new_title.Custom('GetTierBase')|l]!"
  ep3_laamps.0800.d.claimant: "Sự ủng hộ của ta thuộc về quyền thừa kế của [alt_3.GetFirstNamePossessiveNoTooltip]!"
  ep3_laamps.0800.e: "Ta từ bỏ những vùng đất này, để cho người khác nhận!"
  ep3_laamps.0800.e.liege: "Ta từ bỏ những vùng đất này, [new_liege.GetTitleAsNameNoTooltip] có thể nhận!"
  ep3_laamps.0800.claim.tt: "@warning_icon! #N Ngươi sẽ mất tất cả [claims|E] đối với [titles|E] đã từ bỏ#!"
  renounced_land_to_me_opinion: "Tước vị từ bỏ cho ta"
  renounced_land_to_weaker_claim_opinion: "Tước vị từ bỏ cho người thừa kế yếu hơn"
  renounced_land_to_other_opinion: "Tước vị từ bỏ cho người khác"
  renounced_land_outside_family_opinion: "Tước vị từ bỏ ngoài gia đình"
  adventurer_titles_renounced_title: "Tước vị đã từ bỏ"
  adventurer_titles_renounced_to_me_desc: "[adventurer.GetFirstName] từ bỏ [adventurer.GetHerHis] [titles|E] mới để tiếp tục là một [adventurer|E]"
  adventurer_titles_renounced_by_me_desc: "Ta đã từ bỏ [titles|E] mới của mình cho [beneficiary.GetTitledFirstName]"

  ep3_laamps.1001.t: "Những Con Đường Chúng Ta Đi"
  ep3_laamps.1001.desc.intro: "Con đường phía trước trải dài, một sợi dây quấn cô đơn hướng về chân trời xa xăm.\n\nTrại của ta... yên tĩnh, chỉ có vài lều rải rác và thú tải ngáp trong gió. Người lạ và những kẻ bám theo thức dậy, chuẩn bị cho công việc buổi sáng một cách miễn cưỡng.\n\nPhần lớn là những kẻ lạ mặt vụn vặt lướt qua nhóm trên đường theo từng khu định cư mới."
  ep3_laamps.1001.desc.blind: "Ít giọng nói là những người ta nhận ra, ít nhất không chỉ qua thoáng qua."
  ep3_laamps.1001.desc.at_least_one_working_eye: "Ít khuôn mặt thu hút ánh nhìn của ta là những người ta nhận ra, ít nhất không chỉ qua thoáng qua."
  ep3_laamps.1001.a: "May thay, những người ta nhận ra là những kẻ ăn nói lưu loát."
  ep3_laamps.1001.a.tt: "Ngươi bắt đầu với hai [followers|E] thành thạo [diplomacy|E]"
  ep3_laamps.1001.b: "Một ngày nào đó, đây sẽ là một đội quân."
  ep3_laamps.1001.b.tt: "Ngươi bắt đầu với hai [followers|E] thành thạo [martial|E]"
  ep3_laamps.1001.c: "Với những người này, ta sẽ xây dựng một đế chế."
  ep3_laamps.1001.c.tt: "Ngươi bắt đầu với hai [followers|E] thành thạo [stewardship|E]"
  ep3_laamps.1001.d: "Hừm, và đêm nay không có trộm cắp."
  ep3_laamps.1001.d.tt: "Ngươi bắt đầu với hai [followers|E] thành thạo [intrigue|E]"
  ep3_laamps.1001.e: "Cảm ơn [ROOT.Char.GetFaith.KnowledgeGodName], ít ra chúng ta cũng có vài kẻ trí thức!"
  ep3_laamps.1001.e.tt: "Ngươi bắt đầu với hai [followers|E] thành thạo [learning|E]"
  ep3_laamps.1001.f: "Ít ra ta có vài chiến binh dũng cảm."
  ep3_laamps.1001.f.tt: "Ngươi bắt đầu với hai [followers|E] thành thạo [prowess|E]"
  ep3_laamps.1001.g: "Ta chưa có những người theo đáng giá — chưa."
  ep3_laamps.1001.g.tt.followers: "Ngươi bắt đầu với không có [followers|E] nào được tạo — chỉ những [family|E] và [friends|E] hiện có"
  ep3_laamps.1001.g.tt.difficulty: "@alert_icon! #alert_trial Ngươi có thể thấy [task_contracts|E] khó, hoặc không thể, cho đến khi có [followers|E]#!"

  ep3_laamps.1011.t: "Thề Bằng Kiếm"
  ep3_laamps.1011.desc.four_plus_titles: ""... và ta thề sẽ luôn giữ quyền của ngươi đối với [title_1.GetNameNoTier], đối với [title_2.GetNameNoTier], đối với [title_3.GetNameNoTier], và với bất kỳ vương quốc nào vốn thuộc về ngươi, chủ nhân", "
  ep3_laamps.1011.desc.three_titles: ""... và ta thề sẽ luôn giữ quyền của ngươi đối với lãnh thổ tự nhiên của ngươi, từ [title_1.GetNameNoTier] đến [title_2.GetNameNoTier] đến [title_3.GetNameNoTier], chủ nhân", "
  ep3_laamps.1011.desc.two_titles: ""... và ta thề sẽ luôn giữ quyền của ngươi đối với hai lãnh thổ song sinh [title_1.GetNameNoTier] và [title_2.GetNameNoTier], chủ nhân", "
  ep3_laamps.1011.desc.one_title: ""... và ta thề sẽ luôn giữ quyền của ngươi đối với lãnh thổ hợp pháp nhất [title_1.GetNameNoTier], chủ nhân", "
  ep3_laamps.1011.desc.midtro: "tuyên bố [recipient.Custom2('MyCharacterIntroduction', actor)].\n\n[recipient.GetWomanMan] rời đi với cái đầu cúi thấp phục tùng khi [recipient.GetSheHe] hoàn thành lời thề dài dòng của [recipient.GetHerHis], chờ đợi câu trả lời của ta.\n\n\""
  ep3_laamps.1011.desc.prior_swords: "Một cánh tay kiếm tuyệt vời khác thề phục vụ cho sự nghiệp của ta"
  ep3_laamps.1011.desc.first_sword: "Cánh tay kiếm đầu tiên thề trung thành với ta"
  ep3_laamps.1011.desc.outro: "— lòng trung thành của [recipient.GetHerHis] giờ không thể chê trách — câu hỏi duy nhất còn lại là ta #EMP sẽ#! sẵn sàng trao bao nhiêu lòng trung thành để đổi lại?"
  ep3_laamps.1011.a: "[recipient.Custom('SisterBrother')], ngươi sẽ luôn có chỗ tại bàn của ta."
  ep3_laamps.1011.b: "Mong chiến thắng của ta sẽ nhận được lòng trung thành của ngươi, [recipient.GetFirstNameNoTooltip]."

  ep3_laamps.5000.t: "Thùng Rỗng"
  ep3_laamps.5000.desc: "Ta nhìn xuống bữa ăn với vẻ buồn bã. Một quả táo còn hơi xanh nổi bật nhất trong số các món ăn.\n\n"
  ep3_laamps.5000.provisionslow: "Thực phẩm của chúng ta tiếp tục cạn, và giờ thật sự khó khăn. Bụng mọi người ầm ầm, và dây thắt lưng gần hết các nấc để siết chặt."
  ep3_laamps.5000.provisionsok: "Không thiếu thức ăn trong trại, nhưng đa dạng thì thiếu. Chúng ta có nhiều rau úa, nhưng thật sự ta muốn có thịt ngon."
  ep3_laamps.5000.ending: "\n\n[hunter.GetFirstName] bật dậy trên đôi chân [hunter.GetHerHis], tay cầm cung, với lấy bao tên.\n\n\"Ta đã chán ngấy chuyện này rồi. Đây có thể là đất của [local_lord.GetTitledFirstNamePossessive], nhưng ta tin rằng [local_lord.GetSheHe] có thể chia sẻ chút ít miếng bánh béo bở của họ.\""
  ep3_laamps.5000.a: "Không săn bắn trái phép."
  ep3_laamps.5000.a.tt: "Ta sẽ gửi thư xin quyền săn bắn."
  ep3_laamps.5000.a.success: "[local_lord.GetFirstNameNoTooltip] đồng ý"
  ep3_laamps.5000.a.failure: "[local_lord.GetFirstNameNoTooltip] bắt ngươi phải trả phí săn bắn"
  ep3_laamps.5000.a.critfailure: "[local_lord.GetFirstNameNoTooltip] từ chối"
  ep3_laamps.5000.b: "Đi nhanh và lặng lẽ."
  ep3_laamps.5000.b.success: "[hunter.GetFirstNameNoTooltip] săn mà không bị phát hiện"
  ep3_laamps.5000.b.failure: "[hunter.GetFirstNameNoTooltip] bị bắt và bị phạt, một nửa số chiến lợi phẩm [hunter.GetHerHis] bị tịch thu"
  ep3_laamps.5000.b.critfailure: "[hunter.GetFirstNameNoTooltip] bị bắt và bị giam"
  ep3_laamps.5000.c: "Không thể liều. Hãy hái quả thay thế."
  ep3_laamps.5000.c.success: "[hunter.GetFirstNameNoTooltip] mang về một ít quả"
  ep3_laamps.5000.c.failure: "Cây quả không còn trái"

  ep3_laamps.5005.t: "Vị Khách Trung Thành"
  ep3_laamps.5005.desc: "Đống lửa trại nổ lách tách, soi sáng một bóng người bước vào vòng trại. [priest.GetSheHe|U] di chuyển nhanh nhẹn bất chấp giờ đã muộn, tay nắm gậy đi đường. Những người đứng canh đã tiến tới, nhưng ta vẫy tay xua đi.\n\n'Ngươi có chỗ cho một người của [priest.GetFaith.HighGodName] không?' [priest.GetSheHe|U] mỉm cười với ta đầy hy vọng, quần áo bẩn kêu xào xạc trong cơn gió mạnh. Một [ROOT.Char.GetFaith.PriestNeuter] lang thang!\n\n"
  ep3_laamps.5005.samefaith: "Những bóng người như vậy vốn quen thuộc trong các vòng tròn [ROOT.Char.GetFaith.GetAdjective]. Những nhà truyền giáo du hành lan tỏa lời của [priest.GetFaith.HighGodName] đến mọi ngóc ngách trên thế giới."
  ep3_laamps.5005.difffaith: "Có lẽ là một [ROOT.Char.GetFaith.PriestNeuter], nhưng không phải [ROOT.Char.GetFaith.PriestNeuter] của đức tin [ROOT.Char.GetFaith.GetAdjective], điều đó ta nhận ra ngay. Một vài tín đồ cùng ta khẽ nhích chân khi nhận ra điều này."
  ep3_laamps.5005.a: "Chúng ta cần một [priest.GetWomanMan] với trải nghiệm thế giới như vậy..."
  ep3_laamps.5005.a.success: "[priest.GetSheHe|U] đồng ý ở lại một thời gian"
  ep3_laamps.5005.a.failure: "[priest.GetSheHe|U] có kế hoạch xa hơn trại này"
  ep3_laamps.5005.b: "'Ngồi xuống, ở lại một đêm, và kể cho ta nghe chuyện của ngươi!'"
  ep3_laamps.5005.c: "'Ta phải mời ngươi ra ngoài.'"
  ep3_laamps.5005.c.tt: "Đơn giản là không đủ chỗ: ta không bao giờ yêu cầu một người theo ta nhường giường cho kẻ lạ!"
  ep3_laamps.5005.d: "'Cút đi! Chúng ta không muốn loại ngươi ở đây!'"
  every_non_faith_follower: "Mọi [follower|E] không phải [priest.GetFaith.GetAdjective]"

  ep3_laamps.5010.t: "Nhức Mỏi"
  ep3_laamps.5010.desc: "#EMP Ối!#!\n\nTa thấy mình phát ra những âm thanh như vậy khi ngồi bên lửa trại buổi tối. Các bậc trưởng lão luôn nói rằng điều này xảy ra khi già đi, nhưng ta chỉ mới [ROOT.Char.GetAge]...\n\nKhông, đó là hao mòn của một cuộc sống gian truân. Ta cũng thấy những dấu hiệu trên người khác: [follower.GetName] nhăn mặt khi [follower.GetSheHe] ngồi xuống bên cạnh ta."
  ep3_laamps.5010.a: "Quán trọ chúng ta vừa qua có nhiều giường trống..."
  ep3_laamps.5010.b: "Lưng ta đáng ra cần vật dụng sang trọng hơn."
  ep3_laamps.5010.b.tt: "Nâng cấp $camp_main_01_domicile_building$ [building|E] với giá ưu đãi"
  ep3_laamps.5010.c: "Chúng ta phải tiếp tục."
  ep3_laamps.5010.c.success: "Cơ thể Ngài dần quen"
  ep3_laamps.5010.c.failure: "Ngài tiếp tục chịu đựng"

  ep3_laamps.5015.t: "Những Chiến Binh Đói"
  ep3_laamps.5015.desc: "Một bóng người loạng choạng bước vào trại, bẩn thỉu và mệt mỏi, rõ ràng đang cần một bữa ăn tử tế. [knight.GetHerHis|U] tên là [knight.GetFirstName], [knight.GetSheHe] nói.\n\n\"Có nhiều người giống như ta lắm,\" [knight.GetSheHe] chỉ tay về phía xa, \"tất cả chúng ta đều bị bỏ mặc cho thối rữa sau khi mọi cuộc xung đột nhỏ nhặt kết thúc. Cánh tay cầm kiếm của chúng ta vẫn tốt như xưa, nhưng số phận chúng ta là lang thang và chết đói.\"\n\n\"Chúng ta là những người duy nhất còn sót lại không cướp bóc người yếu thế để lấy thức ăn và đồ vật giá trị.\" Đôi mắt [knight.GetHerHis|U] ánh lên sự quyết tâm, bất chấp vẻ ngoài tiều tụy của [knight.GetHerHis]. \"Ta thà chết còn hơn.\""
  ep3_laamps.5015.a: "'Ngươi tốt hơn ta. Và ngu ngốc hơn.'"
  ep3_laamps.5015.a.tt: "Lấy hết đồng tiền và món đồ trong tay [knight.GetHerHis]."
  ep3_laamps.5015.b: "Ngươi nói còn nhiều người như ngươi?"
  ep3_laamps.5015.c: "Chúng ta cần thêm một lưỡi kiếm..."
  ep3_laamps.5015.c.success: "Lời tốt của ngươi lan rộng"
  ep3_laamps.5015.d: "Ngồi xuống, nghỉ ngơi. Ăn đi."

  ep3_laamps.5020.t: "Thức Ăn Xa Lạ"
  ep3_laamps.5020.desc: "Văn hóa ở [location.GetName] còn xa lạ với ta, và vài phong tục cũng vậy. Điều này càng rõ khi [cook.GetFirstName], đóng vai đầu bếp tối nay, ra hiệu cho ta xem nồi hầm.\n\n'Đây là món địa phương,' [cook.GetSheHe] bắt đầu, 'được cho là #EMP chính thống#! [local_culture.GetName]. Một thương nhân đi qua đã đảm bảo với ta như vậy.'\n\nTa nhìn chất trong nồi với nghi ngờ. Đó có phải là... [cook.Custom('GetRandomRegionalSmallGame')] hầm? Với #EMP [cook.Custom('RegionalRootVegetablePlural')]?!#!"
  ep3_laamps.5020.tt: "Yêu cầu một trong: [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )], [GetTrait('eccentric').GetName( GetNullCharacter )], hoặc [GetTrait('gluttonous').GetName( GetNullCharacter )]"
  ep3_laamps.5020.a: "...có lẽ cần thêm một chút #EMP gì đó đặc biệt#!."
  ep3_laamps.5020.a.tt: "Và có lẽ [cook.GetFirstNameNoTooltip] cũng sẽ thấy đặc biệt."
  ep3_laamps.5020.b: "Trộn với thảo mộc từ ẩm thực [culture.GetNameNoTooltip]."
  ep3_laamps.5020.c: "Thôi, ta sẽ thử xem."
  ep3_laamps.5020.c.success: "Ngon tuyệt"
  ep3_laamps.5020.c.failure: "Kinh tởm"
  cultural_acceptance_gain_food_acceptance: "Hai nền văn hóa trao đổi kỹ thuật nấu ăn."
  ep3_laamps.5020.d: "Cái thứ bẩn thỉu gì thế này?!"
  ep3_laamps.5020.d.tt: "Sự do dự của Ngài nổi tiếng"

  ep3_laamps.5025.t: "Phương Tiện Mục Đích?"
  ep3_laamps.5025.desc: "Ta ngồi bên [ROOT.Char.Custom('GetRandomCampBuilding')], để âm thanh và mùi vị trại tràn ngập. Khác hẳn cuộc sống trong tường an toàn của cung điện, khác biệt vô cùng.\n\nSự tự do thật dễ chịu. Không ràng buộc, không cố vấn lải nhải, không quan chức cần tiếp đãi, không nhược điểm của quyền lực.\n\nNhưng tự do này giá phải trả đắt. Sự vật lộn để sinh tồn mòn mỏi. Mỗi đêm, ta càng khao khát một chiếc giường đúng nghĩa..."
  ep3_laamps.5025.a: "Ta #EMP phải#! chiếm một số vùng đất trong tương lai."
  ep3_laamps.5025.b: "Ta khá thích cuộc sống này."
  ep3_laamps.5025.b.flavor: "Thế thì hãy quen đi!"
  ep3_laamps.5025.b.tt: "Thêm #value 2#! [task_contracts|E] mới"
  ep3_laamps.5025.c: "Tốt nhất giữ các lựa chọn mở."
  ep3_laamps.5025.c.flavor: "...và cũng tốt nhất để chuẩn bị cho những gì sắp tới."
  ep3_laamps.5025.c.toast: "Ngài học được giá trị của sự linh hoạt"
  lust_for_land_modifier_tt: "[GetModifier( 'ep3_lust_for_land_modifier' ).GetNameWithTooltip] modifier"

  ep3_laamps.5030.t: "Quán Trọ và Bên Ngoài"
  ep3_laamps.5030.desc: "Khi chúng ta lê bước xuống đường, một tòa nhà lọt vào tầm mắt. Bảng hiệu tồi tàn bên ngoài ghi \"[ROOT.Char.Custom('GetPubName')] - Quán trọ\".\n\n\"Đêm nay ở đây không có chỗ đâu. Chúng ta hầu như không còn chỗ cho những khách trọ hiện tại, chứ đừng nói đến người mới.\" Bên trong, chủ quán lắc đầu từ chối. \"Và #EMP đặc biệt#! không phải là những loại như các ngươi!\"\n\n#EMP Loại tồi tàn?!#!"
  ep3_laamps.5030.a: "À, không sao. Hãy uống vài ly thôi."
  ep3_laamps.5030.a.tt: "Lựa chọn này có sẵn nhờ [dynasty_prestige|E] cao của ngươi\n"
  ep3_laamps.5030.b: "Ta không phải ăn xin. Ta là [ROOT.Char.GetFirstNameNoTooltip] của Họ [ROOT.Char.GetHouse.GetNameNoTooltip]."
  ep3_laamps.5030.b.tt: "'Và ta #EMP đòi hỏi#! sự hiếu khách!'"
  ep3_laamps.5030.c: "Ta thực sự cần chỗ nghỉ."
  ep3_laamps.5030.c.success: "Yêu cầu của ngươi được đáp ứng, còn được giảm giá"
  ep3_laamps.5030.c.failure: "Cảnh báo của Ngài trở nên quá lộ"
  ep3_laamps.5030.c.critfailure: "Mọi chuyện vượt tầm kiểm soát"
  ep3_laamps.5030.d: "Chắc chắn chúng ta có thể thoả thuận?"
  ep3_laamps.5030.d.success: "Việc mặc cả thành công"
  ep3_laamps.5030.d.failure: "[innkeeper.GetFirstNameNoTooltip] không nhượng bộ"

  ep3_laamps.5035.t: "Hiểu Biết Địa Hình"
  ep3_laamps.5035.desc: "Không ai trong trại quen thuộc địa hình ở [location.GetName], và vùng đất này không thể coi thường. Vì vậy, ta đứng trước một hướng dẫn viên địa phương, mặc cả dịch vụ.\n\n'Ở ngoài kia không phải chuyện đùa đâu!' [guide.GetSheHe|U] nói, hít thở qua răng nghiến; cử chỉ lo lắng phô trương. 'Ngươi sẽ cần bản đồ này hoặc dịch vụ của ta, ta đảm bảo miễn phí.'\n\n[guide.GetSheHe|U] nói đúng, nhưng... thái độ của [guide.GetHerHis] khiến ta chần chừ."
  ep3_laamps.5035.tt: "Yêu cầu một trong: [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )], [GetTrait('eccentric').GetName( GetNullCharacter )], hoặc [GetTrait('gluttonous').GetName( GetNullCharacter )]"
  ep3_laamps.5035.a: "Ta có thể cần một [guide.GetWomanMan] như ngươi quanh trại."
  ep3_laamps.5035.b: "Ngươi nói bản đồ giá bao nhiêu?"
  ep3_laamps.5035.c: "Chúng ta cần giúp vượt qua #EMP các#! vùng này..."
  ep3_laamps.5035.c.success: "Lời khuyên hữu ích"
  ep3_laamps.5035.c.failure: "Thông tin hướng dẫn sai"
  ep3_laamps.5035.c.critfailure: "Đường dẫn của hướng dẫn viên dẫn Ngài vào bẫy"
  ep3_laamps.5035.d: "Không cần dịch vụ của ngươi."
  ep3_laamps.5035.d.tt: "Ta chỉ hy vọng không bị lạc..."
  ep3_laamps.5035.d.toast: "Ngươi bị lạc"

  guide_map: "Bản Đồ Chi Tiết"
  guide_map_desc: "Bộ bản đồ này thể hiện địa hình chi tiết khắp thế giới đã biết. Đặc biệt hữu ích khi đi qua những địa hình hiểm trở."

  ep3_laamps.5040.t: "Lang Thang Tàn Tích"
  ep3_laamps.5040.desc: "Đi thám thính phía trước trại, ta gặp nhóm thương nhân tồi tàn. Họ tụ tập quanh những tòa nhà cũ nát, những tòa còn lại tốt được thương nhân chiếm đóng.\n\nHàng hóa của họ khá chuẩn: chủ yếu là thực phẩm, trên con đường đông người qua lại. Nhưng mắt ta không thể rời bức tường xám sần sùi của tàn tích.\n\nTuyệt đẹp làm sao! Thương nhân chỉ chiếm vùng ngoại vi, trái tim tàn lụi vẫn nguyên vẹn."
  ep3_laamps.5040.a: "Thôi, thử vận may trong tàn tích đó..."
  ep3_laamps.5040.a.bigsuccess: "Cuộc tìm kiếm rất thành công"
  ep3_laamps.5040.a.bigsuccess.tt: "Ngài tìm thấy một vũ khí phủ bụi"
  ep3_laamps.5040.a.success: "Cuộc tìm kiếm thành công"
  ep3_laamps.5040.a.success.tt: "Ngài tìm thấy một món đồ nhỏ"
  ep3_laamps.5040.a.failure: "Cuộc tìm kiếm vô ích"
  ep3_laamps.5040.a.failure.tt: "Ngài không tìm thấy gì"
  ep3_laamps.5040.b: "Tốt nhất là an toàn và mua lương thực."
  ep3_laamps.5040.c: "Có lẽ một số người trong đó sẽ gia nhập ta?"
  ep3_laamps.5040.c.critsuccess.tt: "Hai [followers|E] gia nhập"
  ep3_laamps.5040.c.success.tt: "Một [follower|E] gia nhập"
  ep3_laamps.5040.c.failure.tt: "Không ai tham gia"
  ep3_laamps.5040.c.critsuccess: "Một cặp người nhận lời mời"
  ep3_laamps.5040.c.success: "Ai đó quyết định gia nhập"
  ep3_laamps.5040.c.failure: "Không ai tiến lên"

  ep3_laamps.5045.t: "Hành Lang Quyền Lực"
  ep3_laamps.5045.desc: "Thức ăn ở nơi cư trú của [local_lord.GetFullNamePossessive] tại [location.GetName] thật tuyệt, tất nhiên. Khác xa với thức ăn thô sơ mà ta quen.\n\n'Rất vui vì ngươi đáp lời triệu tập.' [local_lord.GetFirstNameNoTooltip] nói, ra hiệu về phía ta. 'Ta muốn xem liệu có thể giúp nhau điều gì không.'\n\n'Sau cùng, đôi khi một [local_lord.GetWomanMan] cỡ ta không thể #EMP lấm bùn#! như yêu cầu công việc...'"
  ep3_laamps.5045.a: "Ngươi biết đấy, ta khá mệt với cuộc sống lang thang..."
  ep3_laamps.5045.a.tt: "Lựa chọn này có sẵn vì ngươi có [GetModifier( 'ep3_lust_for_land_modifier' ).GetNameWithTooltip] [modifier|E]"
  ep3_laamps.5045.a.success: "Lời ngươi thuyết phục"
  ep3_laamps.5045.a.failure: "[local_lord.GetSheHe|U] cười bỏ qua"
  ep3_laamps.5045.b: "Vàng thì không bao giờ thừa..."
  ep3_laamps.5045.c: "Một ít thức ăn nữa cũng tốt."
  ep3_laamps.5045.d: "Ta chỉ cần công việc để phục vụ vùng đất này."
 
  world_africa_sahara_provisions_usage_multiplier_modifier: "Tỉnh Sahara"
  world_africa_sahara_provisions_usage_multiplier_modifier_desc: "Tỉnh này chịu ảnh hưởng toàn bộ sức mạnh của Sahara (hoặc một trong các dãy núi kề cận) — chỉ kẻ điên hoặc chuyên gia mới dám vượt qua."

  duel_to_the_death.tt: "@death_icon! #X Ngay lập tức Ngài bước vào [single_combat_duel|E] đến [character_death_death|E]#!"

 ##################################################
 # SIMPLE JOYS

  ep3_laamp_flavour_ewan.0001.t: "Ánh Hồng Nhè Nhẹ"
  ep3_laamp_flavour_ewan.0001.desc.intro.preamble: "Buổi chiều sớm là lúc trại trở nên nhộn nhịp, người và vật dụng được xếp đặt khắp nơi khi tổ ấm di động của chúng Ta được dựng lên lần nữa. Thường thì, đây cũng là lúc Ta đi dạo để giải tỏa đầu óc và"
  ep3_laamp_flavour_ewan.0001.desc.intro.lazy: "tránh xa mọi công việc vụn vặt và câu hỏi từ những người theo Ta.\n\n"
  ep3_laamp_flavour_ewan.0001.desc.intro.diligent: "sắp xếp tinh thần cho các nhiệm vụ của ngày mai.\n\n"
  ep3_laamp_flavour_ewan.0001.desc.intro.fallback: "tạm thoát khỏi ồn ào một lúc.\n\n"
  ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate: "Ta thấy những tia nắng hồng cuối cùng của mặt trời đang tắt nhuộm lên"
  ep3_laamp_flavour_ewan.0001.desc.midtro.small_hill: "Khi Ta vượt qua một ngọn đồi nhỏ, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
  ep3_laamp_flavour_ewan.0001.desc.midtro.tree_covered_hill: "Khi Ta vượt qua một ngọn đồi phủ cây, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
  ep3_laamp_flavour_ewan.0001.desc.midtro.small_ridge: "Khi Ta vượt qua một sườn đồi nhỏ, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
  ep3_laamp_flavour_ewan.0001.desc.midtro.small_dune: "Khi Ta vượt qua một cồn cát nhỏ, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
  ep3_laamp_flavour_ewan.0001.desc.midtro.dusty_ridge: "Khi Ta vượt qua một sườn đồi bụi, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
  ep3_laamp_flavour_ewan.0001.desc.midtro.stubby_hillock: "Khi Ta vượt qua một quả đồi lùn, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
  ep3_laamp_flavour_ewan.0001.desc.midtro.dusty_hill: "Khi Ta vượt qua một ngọn đồi bụi, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
  ep3_laamp_flavour_ewan.0001.desc.plains: "cánh đồng phía dưới, tạo ra những mảng sáng lấp lánh nơi chạm vào các vũng nước và suối, phần còn lại tắm trong ánh sáng dịu nhẹ."
  ep3_laamp_flavour_ewan.0001.desc.farmlands: "cánh đồng phía dưới, bắt lấy hàng rào và nhà cửa, làm mềm các cạnh với bóng tối ngày càng sâu. Bao nhiêu thế giới nhỏ cho những con người nhỏ bé dưới cùng một bầu trời rực rỡ."
  ep3_laamp_flavour_ewan.0001.desc.hills: "những ngọn đồi phía dưới, tạo ra hàng chục túi bóng nhỏ, như tấm chăn thêu đinh hồng và thung lũng tối."
  ep3_laamp_flavour_ewan.0001.desc.mountains: "những đỉnh núi nhỏ phía dưới, đổ cả thung lũng vào bóng nhanh chóng trong khi đỉnh núi tắm trong ánh sáng hồng nhạt."
  ep3_laamp_flavour_ewan.0001.desc.desert: "sa mạc trải dài trước mắt, biển cát hồng nhạt kéo dài tới chân trời. Xa hơn nữa, thưa thớt, nhưng không trống trải, địa hình thay đổi theo gió chiều muộn."
  ep3_laamp_flavour_ewan.0001.desc.desert_mountains: "những đỉnh núi nhỏ phía dưới, núi khô cằn uống trọn ánh sáng hồng nhạt, đổ cả thung lũng vào bóng khi chúng hấp thụ hết."
  ep3_laamp_flavour_ewan.0001.desc.oasis: "sa mạc trải dài trước mắt, bắt sáng mặt nước của ốc đảo sáng nhất. Vũng nước quý giá càng lấp lánh hơn, trở thành hơn cả một ngọn hải đăng tượng trưng một thời gian."
  ep3_laamp_flavour_ewan.0001.desc.jungle: "tán rừng phía dưới, một mảng bóng sâu, những cây cao vươn lên như muốn chiêm ngưỡng ánh sáng cuối cùng."
  ep3_laamp_flavour_ewan.0001.desc.forest: "rừng phía dưới, rối ren những cột cây gồ ghề và lối mòn nhỏ với đủ bóng để che cả một đội quân, dù chỉ hai ba lính cùng lúc."
  ep3_laamp_flavour_ewan.0001.desc.taiga: "rừng phía dưới, thông và vân sam kéo dài qua các ngọn đồi đá, lốm đốm bóng và ánh sáng hồng."
  ep3_laamp_flavour_ewan.0001.desc.wetlands: "đầm lầy phía dưới, nước bẩn chuyển thành lớp ánh bạc hồng, ánh sáng biến mọi vũng nước thành viên ngọc lấp lánh."
  ep3_laamp_flavour_ewan.0001.desc.steppe: "thảo nguyên trải dài trước mắt, biển cỏ vàng nâu nhấp nhô bỗng nổi bật ánh hồng dịu. Đất phẳng làm bóng khó bám, tạo ra một khung cảnh đồng đều dễ chịu."
  ep3_laamp_flavour_ewan.0001.desc.floodplains: "đồng bằng ngập lụt phía trước, cỏ cao mơn mởn và hàng cây tươi tốt đổ bóng mỏng mọi hướng. Cả vùng đất như tỏa sáng, dịu dàng."
  ep3_laamp_flavour_ewan.0001.desc.drylands: "vùng đất khô phía dưới, phủ ánh sáng hồng nhạt khắp cảnh quan, từ đồi này sang đồi khác, từ làng này sang làng khác, mang lại sự tĩnh lặng cho các ngôi làng nhỏ."
  ep3_laamp_flavour_ewan.0001.desc.outro: "\n\nMột cảnh đẹp — có lẽ còn đáng để chia sẻ?"
  ep3_laamp_flavour_ewan.0001.a: "Dừng lại và tận hưởng sự yên tĩnh."
  ep3_laamp_flavour_ewan.0001.b: "[watch_partner_1.GetFirstNameNoTooltip], leo lên đây!"
  ep3_laamp_flavour_ewan.0001.c: "Gọi [watch_partner_2.GetFirstNameNoTooltip] thay vào."
  ep3_laamp_flavour_ewan.0001.d: "Khoảnh khắc đẹp, nhưng công việc gọi."
  ep3_laamp_flavour_ewan_0001_the_little_things_modifier: "Những Điều Nhỏ"
  ep3_laamp_flavour_ewan_0001_the_little_things_modifier_desc: "Nhân vật này luôn dành thời gian để trân trọng những niềm vui nhỏ trong cuộc sống."
  ep3_laamp_flavour_ewan_0001_all_business_modifier: "Toàn Tập Trung"
  ep3_laamp_flavour_ewan_0001_all_business_modifier_desc: "Khi có việc phải làm, mọi thứ khác đều có thể chờ."

  ep3_laamp_flavour_ewan.0011.t: "Lửa & Bạn Bè"
  ep3_laamp_flavour_ewan.0011.desc.intro: "Mỗi đêm, một đống lửa trở thành #EMP trung tâm#! của các hoạt động xã hội trong trại, mọi người tụ tập quanh nhóm thân cận của Ta để tám chuyện và trêu đùa nhau. Tối nay cũng không ngoại lệ.\n\n“Này, ý Ta chỉ là thế này thôi”, [mocker.GetFirstName] cười khúc khích trước tiếng cười của vài người theo khác, “là tội nghiệp [mockee.GetFirstName]”
  ep3_laamp_flavour_ewan.0011.desc.lustful: "đã mắc nhiều bệnh truyền qua đường tình dục hơn số ngón tay của [mockee.GetSheHe] — và chúng ta không thể biết thêm, vì [mockee.GetSheHe] không thể đếm cao hơn!"" 
  ep3_laamp_flavour_ewan.0011.desc.chaste: "là một sứ giả đích thực của sự trong trắng — và Ta nên hy vọng như vậy, nếu không thì [mockee.GetHerHim] sẽ thật xui với khuôn mặt đó!"" 
  ep3_laamp_flavour_ewan.0011.desc.gluttonous: "là #EMP lý do thật sự#! khiến chúng ta phải di chuyển thường xuyên. Mỗi lần [mockee.GetSheHe] đi chợ, là một cơn đói kém xảy ra!"" 
  ep3_laamp_flavour_ewan.0011.desc.temperate: "không thể bị trách khi vô tình uống nước tiểu dê mà không nhận ra vị. Không phải lần đầu, đó là tai nạn, nhưng #EMP lần thứ hai#!? Thì ra là một kiểu mẫu!"" 
  ep3_laamp_flavour_ewan.0011.desc.greedy: "không #EMP thực sự#! làm gì sai khi [mockee.GetSheHe] ném đồng xu cho người ăn xin — không phải lỗi của [mockee.GetHerHis] khi [mockee.GetSheHe] lấy được trước họ!"" 
  ep3_laamp_flavour_ewan.0011.desc.generous: "là một tâm hồn tốt bụng, chỉ không đưa ngay chiếc áo trên lưng [mockee.GetHerHis] cho chúng Ta vì không ai muốn lấy!"" 
  ep3_laamp_flavour_ewan.0011.desc.lazy: "không thể trách khi biến mất nhanh hơn một con thỏ sợ hãi mỗi khi ai đó bắt đầu câu với 'có thể' — đến một lúc nào đó, lười biếng trở thành nghệ thuật!"" 
  ep3_laamp_flavour_ewan.0011.desc.diligent: "không thể trách bước đi chậm của [mockee.GetHerHis] — chắc hẳn khó khăn với cây gậy cắm thẳng vào… [mockee.GetHerHis] mông!"" 
  ep3_laamp_flavour_ewan.0011.desc.wrathful: "không thể trách tính khí của [mockee.GetHerHis] — nếu Ta phải thức dậy mỗi sáng như [mockee.GetHerHim], Ta cũng sẽ nổi điên!"" 
  ep3_laamp_flavour_ewan.0011.desc.calm: "có thể nhàm chán, khô khan, thiếu cảm xúc thường xuyên, vũ khí tốt nhất của trại chống mất ngủ, và… ôi, xin lỗi [mockee.GetFirstNameNoTooltip], không thấy Ngài ở đó!"" 
  ep3_laamp_flavour_ewan.0011.desc.patient: "có thể đã thắng tảng đá trong trò thi nhìn ai lâu hơn nếu chúng ta không phải di chuyển trại sau một tuần hoặc hai!"" 
  ep3_laamp_flavour_ewan.0011.desc.impatient: "có lẽ có khoảng chú ý của một con dĩn, nhưng [mockee.GetSheHe] bù đắp lại bằng sự... tự nhiên... à... sự phấn khích của [mockee.GetHerHis] đối với những điều mới mẻ, phải không [mockee.GetFirstNameNoTooltip]?\""
  ep3_laamp_flavour_ewan.0011.desc.arrogant: "không thể bị chỉ trích vì cái tôi #EMP khổng lồ#! của [mockee.GetHerHis] — xét cho cùng, đó là thứ lớn nhất mà [mockee.GetSheHe] còn lại để đặt tên cho [mockee.GetHerHis] những ngày này!\""
  ep3_laamp_flavour_ewan.0011.desc.humble: "thường xuyên hạ thấp bản thân [mockee.GetHerselfHimself] đến mức ta thực sự không cần phải cố gắng — nhưng ta vẫn sẽ làm vậy!\""
  ep3_laamp_flavour_ewan.0011.desc.deceitful: "có lẽ là người #EMP ít#! trung thực nhất mà ta từng gặp, nhưng ngươi không thể nói rằng trò chuyện với [mockee.GetHerHim] không phải là một chuyến đi hoang dã! Phải không [mockee.GetFirstNameNoTooltip]? Nếu đó thực sự là tên thật của ngươi!\""
  ep3_laamp_flavour_ewan.0011.desc.honest: "không thể nói dối để cứu mạng [mockee.GetHerHis] — hoặc một trò đùa!"" 
  ep3_laamp_flavour_ewan.0011.desc.craven: "là một tâm hồn nhẹ nhàng mà tất cả chúng ta phải cẩn thận để không làm sợ hãi, kẻo tim [mockee.GetHerHis] ngừng đập!"" 
  ep3_laamp_flavour_ewan.0011.desc.brave: "sẵn sàng chiến đấu bất cứ lúc nào, và đó là điều tốt. Tốt hơn là những kẻ xấu xí nhất xung quanh chiến đấu, họ ít mất mát nhất!"" 
  ep3_laamp_flavour_ewan.0011.desc.shy: "rất dũng cảm khi đến và ngồi cạnh lửa tối nay — Ta đã mong chờ chuyến thăm của [mockee.GetHerHis] năm sau!"" 
  ep3_laamp_flavour_ewan.0011.desc.gregarious: "được mọi người biết đến là một người hòa đồng, một người thực sự làm hài lòng đám đông — điều đó tốt thôi, vì [mockee.GetSheHe] chưa bao giờ làm hài lòng bất cứ ai khi chỉ có một mình!\""
  ep3_laamp_flavour_ewan.0011.desc.ambitious: "có thể có những ý tưởng vĩ đại về tiềm năng trong cuộc sống của [mockee.GetHerHis], nhưng phải thừa nhận rằng, không có nhiều người có thể lảm nhảm suốt một phút mà không cần lấy hơi!\""
  ep3_laamp_flavour_ewan.0011.desc.content: "biết giữ tham vọng của [mockee.GetHerHis] nhỏ bé — phù hợp với tài năng của [mockee.GetHerHis]!"" 
  ep3_laamp_flavour_ewan.0011.desc.arbitrary: "không thể bị bắt chịu trách nhiệm vì không hiểu tất cả những #EMP quy tắc#! này — xét cho cùng, [mockee.GetSheHe] thậm chí còn không biết đọc!\""
  ep3_laamp_flavour_ewan.0011.desc.just: "có thể là người rạch ròi với luật lệ, đúng vậy, nhưng xem cách họ kẹp chặt… [mockee.GetHerHis] mông, điều đó là đương nhiên!"" 
  ep3_laamp_flavour_ewan.0011.desc.cynical: "không được biết là một [mockee.GetWomanMan] sùng đạo, chắc chắn, nhưng để #EMP công bằng tuyệt đối#! Ta cũng sẽ gặp rắc rối nếu [mocker.GetFaith.CreatorName] đã nguyền Ta với khuôn mặt đó!"" 
  ep3_laamp_flavour_ewan.0011.desc.zealous: "được biết đến là một trong những tín đồ chính trực, hy sinh bản thân nhất của [mockee.GetFaith.HighGodName] trên Trái Đất — [mockee.GetSheHe] thậm chí còn từ bỏ cả khiếu hài hước của [mockee.GetHerHis]!\""
  ep3_laamp_flavour_ewan.0011.desc.paranoid: "được biết đã tạo ra vài kẻ thù trong đời [mockee.GetHerHis] — có thể một vài người đang ở đây ngay bây giờ, thậm chí… #EMP phía sau Ngài#!, [mockee.GetFirstNameNoTooltip], CẨN THẬN!"" 
  ep3_laamp_flavour_ewan.0011.desc.trusting: "có thể đã mất vài đồng cho vài kẻ lừa gạt — nhưng để biện hộ cho [mockee.GetHerHis], làm sao [mockee.GetSheHe] biết rằng người ăn xin không răng kia thực sự #EMP là vua#! của [current_county.GetBaseNameNoTier]?"" 
  ep3_laamp_flavour_ewan.0011.desc.compassionate: "được mô tả là mềm mại một chút. Hoặc rất mềm. Thực sự đều mềm. Như một tấm chăn lông ngỗng tốt được hóa thân thành con người."" 
  ep3_laamp_flavour_ewan.0011.desc.callous: "Có thể thể hiện mức độ nhận thức xã hội như một con dê trung bình, nhưng, không như dê, [mockee.GetSheHe], uhh… à, [mockee.GetFirstNameNoTooltip], điều này thật khó xử."" 
  ep3_laamp_flavour_ewan.0011.desc.sadistic: "#EMP đã#! đá đứa trẻ mồ côi xuống đồi, và #EMP đã#! cười vào mặt người đàn bà ăn xin, nhưng [mockee.GetSheHe] cũng có những phẩm chất bù đắp… Ta đoán vậy. Ở đâu đó. Có lẽ."" 
  ep3_laamp_flavour_ewan.0011.desc.stubborn: "có thể là thứ cứng đầu nhất trại có, nhưng thật ấn tượng khi xét tới tất cả những con la!"" 
  ep3_laamp_flavour_ewan.0011.desc.fickle: "có thể thay đổi ý định [mockee.GetHerHis] thường xuyên hơn gió đổi hướng, nhưng Ngài phải thừa nhận, chưa bao giờ chán khi nói chuyện với [mockee.GetHerHim]!"" 
  ep3_laamp_flavour_ewan.0011.desc.vengeful: "có thể đã thề trả thù máu đời đời cho toàn bộ dòng họ gia đình đó, nhưng [mockee.GetSheHe] còn có thể làm gì? Họ cắt đường ăn!"" 
  ep3_laamp_flavour_ewan.0011.desc.forgiving: "có thể hơi #EMP quá#! sẵn sàng bỏ qua, nhưng giết chó tí tẹo giữa Bạn Bè thì sao? Ai cũng từng trải — và cả [mockee.GetHerHim]!"" 
  ep3_laamp_flavour_ewan.0011.desc.eccentric: "có thể kỳ quặc, nói năng lạ lùng, mùi hôi khó hiểu như đang nấu nhiều lần, nhưng ít nhất Ngài không thể nói [mockee.GetSheHe] dễ đoán!"" 
  ep3_laamp_flavour_ewan.0011.desc.outro: "\n\nMột loạt tiếng cười say rượu vang lên từ những khán giả dễ hài lòng, mặc dù tất cả dường như làm [mockee.GetFirstNameNoTooltip] mệt mỏi."
  ep3_laamp_flavour_ewan.0011.a: "Tham gia trêu chọc [mockee.GetFirstNameNoTooltip]."
  ep3_laamp_flavour_ewan.0011.a.tt.success: "Ngôi Sao Bữa Tiệc"
  ep3_laamp_flavour_ewan.0011.a.tt.failure: "Vượt Quá Giới Hạn"
  ep3_laamp_flavour_ewan.0011.b: "Đảo ngược tình thế với [mocker.GetFirstNameNoTooltip]."
  ep3_laamp_flavour_ewan.0011.b.tt.success: "$ep3_laamp_flavour_ewan.0011.a.tt.success$"
  ep3_laamp_flavour_ewan.0011.b.tt.failure: "$ep3_laamp_flavour_ewan.0011.a.tt.failure$"
  ep3_laamp_flavour_ewan.0011.c: "Kể một trò đùa của riêng Ngài."
  ep3_laamp_flavour_ewan.0011.c.tt.success: "$ep3_laamp_flavour_ewan.0011.a.tt.success$"
  ep3_laamp_flavour_ewan.0011.c.tt.failure: "Cái #EMP Gì#! Nghĩa Là Sao?"
  ep3_laamp_flavour_ewan.0011.d: "Hưởng thụ mọi khoảnh khắc."

  ep3_laamp_flavour_ewan.0021.t: "Người Theo Nhỏ"
  ep3_laamp_flavour_ewan.0021.desc.intro.cat: "Mấy ngày nay, Ta thấy một chú mèo nhỏ rình rập quanh lều của Ta,"
  ep3_laamp_flavour_ewan.0021.desc.intro.dog: "Mấy ngày nay, một chú chó nhỏ rách rưới đã dành buổi tối ngồi ngoài lều của Ta,"
  ep3_laamp_flavour_ewan.0021.desc.cat.1: "săn chuột trong trại và mạnh mẽ đẩy lùi những kẻ theo kém hơn với vẻ kiêu hãnh của hoàng gia thực thụ.\n\nCó thể có tóm tắt nào tuyệt vời hơn về cuộc sống quý tộc ngoài hai hành động này không?"
  ep3_laamp_flavour_ewan.0021.desc.cat.2: "thức dậy cùng trại lúc bình minh, ngủ quên trên #EMP xe của Ta#!, trước khi lừ đừ dậy để kiếm bữa tối từ vụn thức ăn và đồ ăn cắp.\n\nMột con vật tự phụ, nhưng chắc chắn rất quyết tâm."
  ep3_laamp_flavour_ewan.0021.desc.cat.3: "biến mất mỗi khi ai đó bước tới gần, chỉ để lặng lẽ xuất hiện vài phút sau đó — quan sát từ xa.\n\nNhút nhát, nhưng luôn tò mò. Một sự kết hợp khó chịu cho bất cứ thứ gì phải chịu đựng, nhất là một chú mèo nhỏ như vậy."
  ep3_laamp_flavour_ewan.0021.desc.cat.4: "vòng quanh và len lỏi giữa chân mọi khách tới thăm — thậm chí nhiều người đi đường — để xin chút thức ăn hay vuốt cằm trước khi bỏ mặc những kẻ ngớ ngẩn không chút hối tiếc.\n\nCó thể tàn nhẫn, nhưng hiệu quả."
 # Bazcat.
  ep3_laamp_flavour_ewan.0021.desc.cat.5: "và chưa từng gặp con vật nào ồn ào và dữ dội đến vậy. Chỉ là một quả bóng răng, móng vuốt và cơn thịnh nộ, thân hình nhỏ bé che giấu mức độ #EMP căm ghét#! bên trong.\n\nCó lẽ may mắn là nó sinh ra là mèo chứ không phải báo."
  ep3_laamp_flavour_ewan.0021.desc.dog.1: "sủa và tru lên mỗi khi Ta ra khỏi tầm nhìn, rên rỉ như… đúng, như một chú chó với chủ, dù Ta chỉ mới gặp nó.\n\nCó thể con vật cảm thấy một chút tình cảm đồng cảm với Ta, dù ban ngày nó chạy phía sau Ta ở một khoảng cách vừa phải."
  ep3_laamp_flavour_ewan.0021.desc.dog.2: "gầm gừ và cắn bất cứ ai đến gần một foot vì dám tiến tới lều của Ta.\n\nVề nhiều mặt không thực tế, nhưng không có gì tốt hơn để bảo vệ Ngài ngoài một chú chó trung thành."
  ep3_laamp_flavour_ewan.0021.desc.dog.3: "chạy vòng vòng và vòng vòng và vòng vòng và #EMP vòng vòng#! với năng lượng vô tận của một chú chó có mọi nơi để đi nhưng không nơi nào để tới.\n\nChúng Ta, có lẽ, hơi giống nhau ở điểm này. Cả hai đều là những kẻ lang thang trôi dạt trên đời."
  ep3_laamp_flavour_ewan.0021.desc.dog.4: "dường như tự dạy #EMP bản thân#! mấy trò, có lẽ muốn gây ấn tượng với Ta. Nó thông minh hơn hầu hết các chú chó, điều Ta nhận ra chỉ khi nó nhảy một cú và lấy củ cải hấp từ tay Ta.\n\nTa la nó, nhưng không thể nói là không buồn cười. Thậm chí ấn tượng, vì nó là chó mà."
  ep3_laamp_flavour_ewan.0021.desc.dog.5: "theo Ta chỉ bằng những tiếng thở nửa im lặng mỗi khi Ta đi, trước khi đi cùng Ta trên hành trình trở về. Ta không biết tại sao nó bảo vệ Ta, nhưng có vẻ vui vẻ khi làm vậy vì lý do nào đó.\n\nCó lẽ Ta làm nó nhớ đến [ROOT.Char.Custom('MistressMaster')] trước đây? Khó nói, nhưng thói quen này chắc chắn đến tự nhiên với nó."
  ep3_laamp_flavour_ewan.0021.desc.outro: "\n\nCon vật có vẻ thân thiện với Ta, thích thú vuốt ve và liếm các ngón tay Ta hàng phút, dù từ chối chấp nhận người khác."
  ep3_laamp_flavour_ewan.0021.a: "Lại đây, Bạn Nhỏ, cậu thật tuyệt vời nhỉ?"
  ep3_laamp_flavour_ewan.0021.b: "Đó… là một bữa ăn…"
  ep3_laamp_flavour_ewan.0021.c: "Đá mạnh con vật đi."
  ep3_laamp_flavour_ewan.0021.d: "Chỉ là người Ngài đồng hành thôi, để yên cho nó."
  ep3_laamp_flavour_ewan_0021_respected_cat_modifier: "Mèo Được Tôn Trọng"
  ep3_laamp_flavour_ewan_0021_respected_cat_modifier_desc: "Nhân vật này biết ai mới thực sự là Bạn Tốt nhất của con người."
  ep3_laamp_flavour_ewan_0021_respected_dog_modifier: "Chó Được Tôn Trọng"
  ep3_laamp_flavour_ewan_0021_respected_dog_modifier_desc: "$ep3_laamp_flavour_ewan_0021_respected_cat_modifier_desc$"

  ep3_laamp_flavour_ewan.0031.t: "Ngã Tèo Láng"
  ep3_laamp_flavour_ewan.0031.desc.intro: "Khi chúng ta cưỡi ngựa qua [current_county.GetBaseNameNoTier], suy nghĩ của ta lang thang vô định, chán nản vì sự đơn điệu của chuyến đi, thì có một tiếng #EMP hét#! báo động đột ngột.\n\nMột cuộc tấn công? Ta quay ngoắt đầu lại — không — đó là tên ngốc chết tiệt [stooge.GetTitledFirstName], [stooge.GetSheHe] đã xoay xở để ngã khỏi ngựa của [stooge.GetHerHis] và"
  ep3_laamp_flavour_ewan.0031.desc.plains: "lăn xuống một sườn dốc nhỏ thẳng vào bụi rậm nhìn dữ tợn,"
  ep3_laamp_flavour_ewan.0031.desc.farmlands: "xuyên qua hàng rào dày và vào mương đầy dây gai,"
  ep3_laamp_flavour_ewan.0031.desc.hills: "lăn thẳng xuống sườn đồi dốc, lộn vòng liên tiếp cho đến khi rơi vào hẻm núi,"
  ep3_laamp_flavour_ewan.0031.desc.mountains: "trượt xuống sườn núi, đá tung và bụi mù cho đến khi ngã xuống vách đá"
  ep3_laamp_flavour_ewan.0031.desc.desert: "xoay tròn xuống đụn cát cao, lộn xộn qua lại khi quán tính đưa [stooge.GetHerHim] đi về phía trước"
  ep3_laamp_flavour_ewan.0031.desc.desert_mountains: "$ep3_laamp_flavour_ewan.0031.desc.mountains$"
  ep3_laamp_flavour_ewan.0031.desc.oasis: "$ep3_laamp_flavour_ewan.0031.desc.desert$"
  ep3_laamp_flavour_ewan.0031.desc.jungle: "lăn xuống sườn đồi phủ cây, mắc phải dây leo và gai lạ trong khi"
  ep3_laamp_flavour_ewan.0031.desc.forest: "lăn xuống sườn đồi phủ cây, mắc phải cành và bụi gai trong khi"
  ep3_laamp_flavour_ewan.0031.desc.taiga: "lăn xuống sườn đồi phủ cây, mắc phải cành và quả thông già trong khi"
  ep3_laamp_flavour_ewan.0031.desc.wetlands: "trượt xuống gò đất thấp, đá tung bùn và cỏ ẩm,"
  ep3_laamp_flavour_ewan.0031.desc.steppe: "tìm #EMP một#! ngọn đồi cho hàng dặm xung quanh để lăn xuống,"
  ep3_laamp_flavour_ewan.0031.desc.floodplains: "rơi vào một cái gì đó giống như mương nước lợ,"
  ep3_laamp_flavour_ewan.0031.desc.drylands: "lăn xuống đồi bụi, đá tung mây bụi dày và"
  ep3_laamp_flavour_ewan.0031.desc.midtro: "la hét và khóc khi [stooge.GetSheHe] rơi.\n\n"
  ep3_laamp_flavour_ewan.0031.desc.outro.dead: "Khi [stooge.GetFirstNameNoTooltip] không xuất hiện sau vài phút, một người khuân vác đi xuống kiểm tra. Vài khoảnh khắc sau, một tiếng hét kinh ngạc vang lên.\n\nCó vẻ [stooge.GetSheHe] đã chết vì ngã."
  ep3_laamp_flavour_ewan.0031.desc.outro.fallback: "Vài khoảnh khắc sau, [stooge.GetFirstNameNoTooltip] xuất hiện, chửi thề và còn sống nhưng không hoàn toàn lành lặn."
  ep3_laamp_flavour_ewan.0031.a: "Cười lớn."
  ep3_laamp_flavour_ewan.0031.b: "Cười khúc khích, nhưng thôi."
  ep3_laamp_flavour_ewan.0031.c: "Những ác ý nhỏ nhoi này không đáng để Ta quan tâm."
  ep3_laamp_flavour_ewan_0031_grisly_modifier: "Khiếu Hài Hước Rùng Rợn"
  ep3_laamp_flavour_ewan_0031_grisly_modifier_desc: "Cuộc sống đang cười vào Ngài, sao không cười theo nó?"
  ep3_laamp_flavour_ewan_0031_macabre_modifier: "Khiếu Hài Hước U Ám"
  ep3_laamp_flavour_ewan_0031_macabre_modifier_desc: "Chỉ vì tối tăm không có nghĩa là không buồn cười."

  ep3_laamp_flavour_ewan.0041.t: "Những Khó Khăn Của Một Đầu Bếp"
  ep3_laamp_flavour_ewan.0041.desc.has_cook: ""Ta không nghĩ mình đang vô lý đâu", [camp_cook.GetFirstName] — [GetCourtPositionType( 'camp_cook_camp_officer' ).GetName()] của Ta — càu nhàu khi [camp_cook.GetSheHe] vẫy tay một cách coi thường về cảnh vật xung quanh.\n\n"
  ep3_laamp_flavour_ewan.0041.desc.nameless_cook: ""Ta không nghĩ chúng Ta đang vô lý đâu", đầu bếp càu nhàu, người có lẽ đã rút thăm xui xẻo để phải đến nói chuyện với Ta, vẫy tay coi thường cảnh vật xung quanh.\n\n"
  ep3_laamp_flavour_ewan.0041.desc.plains: ""Ở đây có rất nhiều nông trại, dù không tuyệt vời, cũng chẳng khó để chúng ta dừng lại một chút và"
  ep3_laamp_flavour_ewan.0041.desc.farmlands: ""Tất cả những cánh đồng tuyệt đẹp này mà chúng ta không thể tìm ra chút thời gian để"
  ep3_laamp_flavour_ewan.0041.desc.hills: ""Có quá nhiều đồng cỏ trên đồi xung quanh mà chúng ta vẫn không thể dành thời gian để"
  ep3_laamp_flavour_ewan.0041.desc.mountains: ""Bao quanh toàn trò chơi núi non mà chúng ta thậm chí không thể dành thời gian để"
  ep3_laamp_flavour_ewan.0041.desc.desert: ""Chìm sâu trong hố sa mạc này, không thấy một khu định cư nào, mà chúng ta lại không đủ thời gian để"
  ep3_laamp_flavour_ewan.0041.desc.desert_mountains: ""Đưa tay lên nửa chừng trời và cổ họng khát khô, mà chúng ta còn không thể thử để"
  ep3_laamp_flavour_ewan.0041.desc.oasis: ""Ngay cả ở một ốc đảo thực sự, chúng ta vẫn vội quay lại với khắc nghiệt của sa mạc, không thể"
  ep3_laamp_flavour_ewan.0041.desc.jungle: ""Ngay cả với nhiều món kỳ lạ của rừng rậm sẵn sàng cho chúng ta thưởng thức, chúng ta còn không tìm thấy ý chí để"
  ep3_laamp_flavour_ewan.0041.desc.forest: ""Ngay cả trong khu rừng phong phú này, chúng ta cũng không thể dành thời gian để"
  ep3_laamp_flavour_ewan.0041.desc.taiga: ""Ra đây ở một khu rừng hoang vu xa xôi, cách xa sự sống đến mức chúng ta thậm chí không thể"
  ep3_laamp_flavour_ewan.0041.desc.wetlands: ""Bị buộc phải lang thang trên đầm lầy hôi thối này suốt đời, không thể thậm chí"
  ep3_laamp_flavour_ewan.0041.desc.steppe: ""Lạc giữa biển cỏ trống trải, quá xa nơi nào để thậm chí"
  ep3_laamp_flavour_ewan.0041.desc.floodplains: ""Bị bỏ rơi ở các đồng lụt thối rữa này, phó mặc cho thủy triều và đê điều, không thể thậm chí"
  ep3_laamp_flavour_ewan.0041.desc.drylands: ""Bị lưu đày ra nơi địa ngục bụi này, quá xa những nơi quan trọng để thậm chí"
  ep3_laamp_flavour_ewan.0041.desc.outro: "tích trữ một số tiện nghi nhỏ để làm thức ăn bớt nhạt nhẽo chứ?\n\nTa thở dài, mệt mỏi với cuộc trò chuyện. Ta tự hỏi ai trong chúng Ta sẽ nhượng bộ trước."
  ep3_laamp_flavour_ewan.0041.desc.provisions.high: "\n\nNhững lời này nghe như tiếng nói của một kẻ điên. Ta vừa kiểm tra kho sáng nay và chúng ta vẫn đủ lương thực cho vài tháng tới."
  ep3_laamp_flavour_ewan.0041.desc.provisions.medium: "\n\nĐúng, lương thực của chúng ta có thể #EMP hơi#! thấp hơn mức Ta muốn, nhưng chẳng có gì phải lo lắng đến thế."
  ep3_laamp_flavour_ewan.0041.desc.provisions.low: "\n\nKho dự trữ của chúng ta là như hiện tại và kẻ ngu này còn cãi về việc liệu lượng lương thực cuối cùng có vừa khẩu vị không."
  ep3_laamp_flavour_ewan.0041.desc.provisions.sahara: "\n\nTa nhìn quanh sa mạc gần như vô tận trải ra mọi hướng, vô tận."
  ep3_laamp_flavour_ewan.0041.a: "Cậu đang than phiền gì thế?"
  ep3_laamp_flavour_ewan.0041.b: "Được, chúng ta có thể tiếp tế."
  ep3_laamp_flavour_ewan.0041.b.tt.success: "Ngài đã thương lượng tốt"
  ep3_laamp_flavour_ewan.0041.b.tt.failure: "Người địa phương keo kiệt"
  ep3_laamp_flavour_ewan.0041.c: "Hoàn toàn không, làm việc với những gì Ngài có."
  ep3_laamp_flavour_ewan.0041.d: "Ta chắc các Ngài có thể tìm ra cách với nhau."
  ep3_laamp_flavour_ewan.0041.e: "Chúng ta có thể tìm được gì đó..."
  ep3_laamp_flavour_ewan.0041.e.tt.success: "Nỗ lực của Ngài thành công"
  ep3_laamp_flavour_ewan.0041.e.tt.failure: "Gần như tay không"
  ep3_laamp_flavour_ewan.0041.f: "Tiếp tế cũng là một ý hay thôi."
  ep3_laamp_flavour_ewan.0041.f.tt.success: "$ep3_laamp_flavour_ewan.0041.b.tt.success$"
  ep3_laamp_flavour_ewan.0041.f.tt.failure: "$ep3_laamp_flavour_ewan.0041.b.tt.failure$"
  ep3_laamp_flavour_ewan.0041.g: "Không có trong ngân sách."
  ep3_laamp_flavour_ewan.0041.h: "Chỉ cần nhân đôi khẩu phần bia và xong."
  ep3_laamp_flavour_ewan.0041.i: "Chúng ta có thể dừng lại tìm thức ăn."
  ep3_laamp_flavour_ewan.0041.i.tt.success: "$ep3_laamp_flavour_ewan.0041.e.tt.success$"
  ep3_laamp_flavour_ewan.0041.i.tt.failure: "$ep3_laamp_flavour_ewan.0041.e.tt.failure$"
  ep3_laamp_flavour_ewan.0041.j: "Chúng ta sẽ mua thêm những lương thực phụ còn có thể..."
  ep3_laamp_flavour_ewan.0041.j.tt.success: "$ep3_laamp_flavour_ewan.0041.b.tt.success$"
  ep3_laamp_flavour_ewan.0041.j.tt.failure: "$ep3_laamp_flavour_ewan.0041.b.tt.failure$"
  ep3_laamp_flavour_ewan.0041.k: "Chúng ta #EMP phải#! tiếp tục."
  ep3_laamp_flavour_ewan.0041.l: "Hmm, chúng ta có thể #EMP giữ#! chút gì đó dự trữ."
  ep3_laamp_flavour_ewan.0041.m: "Cậu có #EMP thấy#! chỗ nào mua lương thực không đồ ngốc?"
  ep3_laamp_flavour_ewan.0041.n: "Ta không quan tâm nếu chúng ta phải ăn cháo cho đến hết chuyến đi này."
  ep3_laamp_flavour_ewan_0041_well_provided_camp_modifier: "Trại Được Cung Cấp Đầy Đủ"
  ep3_laamp_flavour_ewan_0041_well_provided_camp_modifier_desc: "Ký ức về sự đầy đủ có thể kéo dài lâu."
  ep3_laamp_flavour_ewan_0041_doubled_beer_rations_camp_modifier: "Nhân Đôi Khẩu Phần Bia"
  ep3_laamp_flavour_ewan_0041_doubled_beer_rations_camp_modifier_desc: "Trại của nhân vật này #EMP rất#! vui vẻ — chỉ là không tập trung lắm."
  ep3_laamp_flavour_ewan_0041_stern_camp_modifier: "Nghiêm Khắc Với Lương Thực"
  ep3_laamp_flavour_ewan_0041_stern_camp_modifier_desc: "Những người theo nhân vật học cách xoay xở hoặc phải xoay xở mà không có."
  ep3_laamp_flavour_ewan_0041_quite_stern_camp_modifier: "Khá Nghiêm Khắc Với Lương Thực"
  ep3_laamp_flavour_ewan_0041_quite_stern_camp_modifier_desc: "$ep3_laamp_flavour_ewan_0041_stern_camp_modifier_desc$"
  ep3_laamp_flavour_ewan_0041_very_stern_camp_modifier: "Rất Nghiêm Khắc Với Lương Thực"
  ep3_laamp_flavour_ewan_0041_very_stern_camp_modifier_desc: "$ep3_laamp_flavour_ewan_0041_stern_camp_modifier_desc$"

  ep3_laamp_flavour_ewan.0051.t: "Tiếng Ồn Thân Thiện"
  ep3_laamp_flavour_ewan.0051.desc.intro: "Thật khó để diễn tả điều gì khiến tiếng rì rầm thấp của một trại đang ổn định vào buổi tối lại gần gũi đến vậy.\n\nCó lẽ là"
  ep3_laamp_flavour_ewan.0051.desc.purpose.wanderers.1: "dòng người mới háo hức thoát khỏi cuộc sống định cư,"
  ep3_laamp_flavour_ewan.0051.desc.purpose.wanderers.2: "tiếng cãi vã buổi tối sớm về kế hoạch ngày mai,"
  ep3_laamp_flavour_ewan.0051.desc.purpose.wanderers.3: "những trò đùa hơi sướt mướt về việc tiếp theo phải làm,"
  ep3_laamp_flavour_ewan.0051.desc.purpose.mercenaries.1: "tiếng va chạm vũ khí được quăng qua lại,"
  ep3_laamp_flavour_ewan.0051.desc.purpose.mercenaries.2: "tiếng cười sảng khoái của chiến binh kể chuyện bẩn,"
  ep3_laamp_flavour_ewan.0051.desc.purpose.mercenaries.3: "tiếng la ó đặc trưng và reo hò từ những trò chơi xúc xắc từ xa,"
  ep3_laamp_flavour_ewan.0051.desc.purpose.scholars.1: "tiếng cào êm ái của bút lông lên nhật ký buổi tối,"
  ep3_laamp_flavour_ewan.0051.desc.purpose.scholars.2: "tiếng tranh luận cũ rích từ đêm trước lại vang lên ngay mà không chậm trễ,"
  ep3_laamp_flavour_ewan.0051.desc.purpose.scholars.3: "tiếng kêu phẫn nộ kiêu kỳ của các học giả sống giữa hoang dã,"
  ep3_laamp_flavour_ewan.0051.desc.purpose.explorers.1: "những cuộc thảo luận về vùng đất xa xôi như thể chúng ta đã từng tới đó,"
  ep3_laamp_flavour_ewan.0051.desc.purpose.explorers.2: "tham vọng rõ ràng muốn nhìn thế giới luôn được phô trương,"
  ep3_laamp_flavour_ewan.0051.desc.purpose.explorers.3: "tình yêu thật sự dành cho những kỳ quan mà thế giới còn ẩn giấu,"
  ep3_laamp_flavour_ewan.0051.desc.purpose.brigands.1: "khao khát chiến lợi phẩm và cướp bóc hiện rõ trên gương mặt mỗi người theo,"
  ep3_laamp_flavour_ewan.0051.desc.purpose.brigands.2: "cáo buộc gian lận và đe dọa giết người nảy sinh từ trò đánh bạc,"
  ep3_laamp_flavour_ewan.0051.desc.purpose.brigands.3: "kể lại những câu chuyện kinh hoàng ngoài lều Bạn Bè,"
  ep3_laamp_flavour_ewan.0051.desc.purpose.legitimists.1: "biết rằng những người này sẽ theo Ta tới [ROOT.Char.random_NegativeAfter] nếu Ta yêu cầu,"
  ep3_laamp_flavour_ewan.0051.desc.purpose.legitimists.2: "tiếng thì thầm nhẹ nhàng của những lời thề hằng ngày được xác nhận khắp các lều,"
  ep3_laamp_flavour_ewan.0051.desc.purpose.legitimists.3: "câu chuyện nền về chiến thắng và anh hùng mà người theo Ta dệt về sự trở lại của Ta."
  ep3_laamp_flavour_ewan.0051.desc.buildings.supply_tent_01: "tiếng lục lọi thùng và thùng gỗ từ lều tiếp tế,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.supply_tent_sutler: "tiếng rao hàng của những người buôn,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.supply_tent_smithy: "tiếng kim loại va chạm vang vọng từ xưởng rèn,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.supply_tent_arsenal: "tiếng đếm tỉ mỉ từng kho vũ khí trong kho vũ khí,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.barber_tent_01: "tiếng la hét lẫn vẻ lịch sự miễn cưỡng từ lều thợ cắt tóc,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.barber_tent_surgeons_tools: "tiếng la hét không kìm nén từ những gì gọi là phẫu thuật trong lều thợ cắt tóc,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.barber_tent_dentists_tools: "tiếng kêu thét của những người theo khi kìm và tay vững được áp lên răng xấu của họ,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.barber_tent_torturers_tools: "tiếng la khàn của tù nhân ở trại quá gần lều thợ cắt tóc,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_01: "sự hỗn loạn và náo loạn của đoàn hành lý sau một ngày di chuyển,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_ample_steeds: "tiếng hí vang của đội ngựa của chúng ta,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_porters: "tiếng đùa và rên rỉ của những người khiêng hành lý từ nơi này sang nơi khác,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_trackers: "những nhóm thợ săn lặng lẽ di chuyển như một qua các lối đi và lều,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_kennel: "tiếng sủa và líu lo của chuồng chó,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_siege_engineers: "tiếng cọt kẹt không ngừng từ xe của kỹ sư dưới trọng lượng lương thực của nó,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_shrine: "hàng dài tín đồ xếp hàng quanh điện thờ di động,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_scribes: "tiếng dí dỏm khô khan và nhận xét hóm hỉnh của các thư ký lang thang,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_bartering_grounds: "tiếng hò hét của thương nhân và người theo tại nơi trao đổi,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_ransom_cages: "tiếng khóc và rên rỉ thấp của tù nhân trong xà lim và lồng,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_pleasure_tents: "tiếng người trở về từ lều vui vẻ với nụ cười ngớ ngẩn,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.mess_tent_01: "tiếng ồn của người theo đói bụng trong lều ăn,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.mess_tent_herbalists: "mùi thảo dược khô từ giá ngoài lều ăn,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.mess_tent_brewers: "tiếng người theo say sưa vì bia tươi,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.mess_tent_bakers: "mùi bánh nở cho bữa tối,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.mess_tent_cooks: "những cuộc tranh cãi thường lệ giữa các đầu bếp về những lựa chọn nhỏ nhặt,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.camp_fire_01: "mùi lửa trại vừa mới nhóm,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.camp_fire_trailing_musicians: "hỗn hợp âm thanh thú vị của các nhạc công đi kèm bắt đầu chơi,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.camp_fire_wandering_poets: "tiếng thở dồn của người theo khi nghe thơ khiêu khích,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.camp_fire_capering_fools: "những trò nghịch ngợm của kẻ ngốc từ lửa trại này sang lửa trại khác,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.camp_fire_local_hangers_on: "người địa phương tò mò xuất hiện, nhìn đám người lạ với sợ hãi và ngạc nhiên,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.camp_fire_juicy_rumors: "tiếng thở dồn kinh ngạc của tin đồn đã bắt đầu lan tỏa quanh lửa trại,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_01: "tiếng hò hét và la hét từ khu huấn luyện,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_horse_run: "tiếng vó ngựa khi kỵ binh nhẹ luyện tập,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_camel_run: "tiếng vó lộp bộp và tiếng la khẽ của lạc đà,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_elephantry_reserve: "tiếng kêu bất mãn của voi,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_nightly_barding_drills: "tiếng rên và va chạm từ kỵ sĩ nặng đang bảo trì áo giáp,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_the_stump: "những đợt #EMP thwick#! gián đoạn khi một loạt bắn nhắm vào [ROOT.Char.Custom('GetStumpName')] hôm nay,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_personal_bouts: "tiếng gầm chiến thắng và reo hò chế giễu từ những trận đấu một đối một,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_training_circle: "tiếng va chạm khiên lên khiên trong vòng tập luyện,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_mock_battle_drills: "tiếng ồn nhỏ từ trận giả khi lính giáo luyện tập kỷ luật chung,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_the_stick_game: "thỉnh thoảng #EMP chửi thề bậy#! khi ai đó thua trò chơi gậy,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_bodyguard_drills: "tiếng rống thô của vệ sĩ luyện tập hết sức,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.camp_perimeter_01: "tiếng ra lệnh và bước chân dậm đánh dấu việc thiết lập vòng trại,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.camp_perimeter_fixed_layout: "những cuộc tranh cãi lặng lẽ và tiếng thở dài khi bố cục cố định của chúng ta ổn định các tranh luận,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.camp_perimeter_palisade: "tiếng gõ gỗ lên gỗ khi tháp canh tạm dựng lên cho đêm,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.camp_perimeter_ditch: "tiếng xẻng đào đất khi ca trực tối hôm nay thực hành công sự giả,"
  ep3_laamp_flavour_ewan.0051.desc.buildings.fallback: "sự nhiệt tình khi cắm trại dưới bầu trời mở,"
  ep3_laamp_flavour_ewan.0051.desc.followers.connector: "hoặc thậm chí là"
  ep3_laamp_flavour_ewan.0051.desc.followers.courtier_relations.friends: "những trò trêu ghẹo vui vẻ của [courtier_friend_1.GetFirstName] và [courtier_friend_2.GetFirstName] khi đi ngang qua lều của Ta."
  ep3_laamp_flavour_ewan.0051.desc.followers.courtier_relations.best_friends: "những lời trêu ghẹo đầy tình cảm của [courtier_best_friend_1.GetFirstName] và [courtier_best_friend_2.GetFirstName] khi hai người Bạn Thân thực hiện các công việc buổi tối."
  ep3_laamp_flavour_ewan.0051.desc.followers.courtier_relations.rivals: "những mũi nhọn cay độc của [courtier_rival_1.GetFirstName] và [courtier_rival_2.GetFirstName], cãi vã như thường lệ."
  ep3_laamp_flavour_ewan.0051.desc.followers.courtier_relations.nemeses: "tiếng gầm gừ khó kìm chế của [courtier_nemesis_1.GetFirstName] và [courtier_nemesis_2.GetFirstName], tận dụng mọi cơ hội để cãi nhau."
  ep3_laamp_flavour_ewan.0051.desc.followers.courtier_relations.lovers: "tiếng cười và thì thầm của [courtier_lover_1.GetFirstName] và [courtier_lover_2.GetFirstName], đi tay trong tay trong một trong những cuộc đi bộ thường nhật của họ."
  ep3_laamp_flavour_ewan.0051.desc.followers.courtier_relations.soulmates: "những lời ngọt ngào sến súa giữa [courtier_soulmate_1.GetFirstName] và [courtier_soulmate_2.GetFirstName], đi ngang qua với tình tứ như mọi khi."
  ep3_laamp_flavour_ewan.0051.desc.followers.courtier_count.many_children: "tiếng cười rộn rã và tiếng hét vui vẻ của nhiều trẻ con đang chơi, khi [leading_child.GetFirstName] chạy vụt qua Ta, dẫn đầu trò chơi đuổi bắt."
  ep3_laamp_flavour_ewan.0051.desc.followers.courtier_count.many_knights: "tiếng hò hét của [leading_knight.GetFirstName] khi [leading_knight.GetSheHe] dẫn $knight_culture_player_plural_no_tooltip$ tập luyện hàng ngày."
  ep3_laamp_flavour_ewan.0051.desc.followers.courtier_count.many_languages: "nhiều ngôn ngữ được nói bởi những người đi ngang qua, từ [culture_1.GetLanguage.GetNameNoTooltip] đến [culture_2.GetLanguage.GetNameNoTooltip] đến [culture_3.GetLanguage.GetNameNoTooltip]."
  ep3_laamp_flavour_ewan.0051.desc.followers.courtier_count.many_faiths: "tiếng cầu nguyện buổi tối vang lên đến [faith_1.GetAdjective] [faith_1.HealthGodName], [faith_2.GetAdjective] [faith_2.HouseholdGodName], và [faith_3.GetAdjective] [faith_3.NightGodName]."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.intro: "tiếng nhận biết của [notable_char.GetFirstName]"
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.lustful: "tán tỉnh một người theo bất hạnh."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.gluttonous: "ăn ngấu nghiến một món địa phương tươi ngon."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.temperate: "rõ ràng đang dạy ai đó về nguy cơ ăn quá nhiều bữa tối."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.greedy: "đếm tiền của mình — là đồng tiền thứ hai trong ba, để chắc chắn không mất gì khi hành quân."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.generous: "cười khi [notable_char.GetSheHe] ném tiền cho một người theo may mắn."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.lazy: "thản nhiên tìm cớ để không phải dựng lều [notable_char.GetHerHis] của riêng mình — một lần nữa."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.diligent: "tổ chức vài người theo nhỏ hơn khi họ thực hiện các công việc buổi tối."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.wrathful: "la hét vào một người theo bất hạnh."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.calm: "làm dịu một cuộc cãi vã giữa hai người theo nhỏ hơn."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.patient: "gật đầu và phát ra âm thanh đồng tình khi người địa phương kể một câu chuyện dài dòng."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.impatient: "ngắt câu chuyện của ai đó để bảo họ nói thẳng vào vấn đề."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.arrogant: "tùy ý kéo vài người theo nhỏ hơn làm một công việc vụn vặt cho [notable_char.GetHerHim]."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.humble: "dừng lại giúp người khác dựng lều."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.deceitful: "đang kể một câu chuyện dài, đáng ngờ với một người địa phương cả tin."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.honest: "giải thích một vấn đề khó xử với một người địa phương khó chịu."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.gregarious: "cười đùa với một số người theo nhỏ hơn."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.arbitrary: "yêu cầu ai đó đổi lều với [notable_char.GetHerHim] — lại một lần nữa."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.just: "rõ ràng đang dạy ai đó một cách to và tự tin như một [notable_char.GetLadyLord] tại triều."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.cynical: "cười nhạo việc cầu nguyện buổi tối của ai đó."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.zealous: "dẫn một nhóm nhỏ tín đồ trong thờ phượng."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.paranoid: "lẩm bẩm và tự nhủ với [notable_char.GetHerselfHimself]."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.trusting: "nghe tin tưởng câu chuyện dài, đáng ngờ của kẻ ngốc."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.compassionate: "đang đứng trên bục giảng [notable_char.GetHerHis] về một ai đó bị cáo buộc là đã đá một con chó."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.callous: "nghe thờ ơ câu chuyện bi thương của người địa phương."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.sadistic: "cười nham hiểm trước câu chuyện bi thương của người địa phương."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.stubborn: "cứng đầu giữ lập trường [notable_char.GetHerHis] trước đám đông người địa phương giận dữ."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.fickle: "tham gia vào cuộc tranh cãi rối rắm với ai đó, thay đổi lập trường [notable_char.GetHerHis] qua mỗi câu."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.vengeful: "thề sẽ mở một mối thù máu thế hệ khác với ai đó vì… chuyện gì đó."
  ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.fallback: "ngâm nga theo [notable_char.GetHerselfHimself] khi [notable_char.GetSheHe] đi qua."
  ep3_laamp_flavour_ewan.0051.desc.followers.fallback.1: "tiếng kêu nửa xa của những con lừa bướng bỉnh được đưa vào chuồng cho buổi tối."
  ep3_laamp_flavour_ewan.0051.desc.followers.fallback.2: "tiếng kêu líu lo của chim địa phương khi đêm bắt đầu buông xuống."
  ep3_laamp_flavour_ewan.0051.desc.followers.fallback.3: "tiếng đinh kim loại nhịp nhàng đóng vào đất mềm quanh Ta."
  ep3_laamp_flavour_ewan.0051.desc.outro: "\n\nTất cả tạo nên một tấm chăn yên bình và thân thuộc. Đây là lãnh địa của Ta, và đây là những người của Ta — một vương quốc nhỏ, nhưng nơi Ta biết mọi cảnh, âm thanh và linh hồn."
  ep3_laamp_flavour_ewan.0051.a: "Rút về lều của Ta và chỉ nghe thôi."
  ep3_laamp_flavour_ewan.0051.b: "Kiểm tra kho dự trữ."
  ep3_laamp_flavour_ewan.0051.c.bald.female: "Có lẽ Ta nên kiểm tra sức khỏe tinh thần?"
  ep3_laamp_flavour_ewan.0051.c.bald.male: "Có lẽ cạo râu?"
  ep3_laamp_flavour_ewan.0051.c.hairy.male: "Có lẽ cạo râu và cắt tóc?"
  ep3_laamp_flavour_ewan.0051.c.fallback: "Có lẽ cắt tóc?"
  ep3_laamp_flavour_ewan.0051.d: "Đã đến lúc kiểm soát sự hỗn loạn của đoàn hành lý..."
  ep3_laamp_flavour_ewan.0051.e: "Tốt nhất là ăn trước khi lều ăn quá đông."
  ep3_laamp_flavour_ewan.0051.f: "Ta nghĩ mình sẽ ngồi ở chỗ quen thuộc bên lửa."
  ep3_laamp_flavour_ewan.0051.g: "Huấn luyện hàng đêm không chờ bất kỳ [ROOT.Char.GetWomanMan] nào."
  ep3_laamp_flavour_ewan.0051.h: "Đi dạo quanh chu vi trại nghe có vẻ thú vị."
  ep3_laamp_flavour_ewan_0051_check_building_supply_tent_modifier: "Dự trữ Trật Tự"
  ep3_laamp_flavour_ewan_0051_check_building_supply_tent_modifier_desc: "Một nét cá nhân thực sự giúp thúc đẩy việc ghi chép chính xác."
  ep3_laamp_flavour_ewan_0051_check_building_barber_tent_modifier: "Luôn Ngăn Nắp"
  ep3_laamp_flavour_ewan_0051_check_building_barber_tent_modifier_desc: "Cuộc sống di chuyển không phải lý do để bỏ bê việc chăm sóc cá nhân."
  ep3_laamp_flavour_ewan_0051_check_building_baggage_train_modifier: "Đoàn Hành Lý Kỷ Luật"
  ep3_laamp_flavour_ewan_0051_check_building_baggage_train_modifier_desc: "Đoàn hành lý là một mớ hỗn độn — trừ khi Ngài giữ chặt."
  ep3_laamp_flavour_ewan_0051_check_building_mess_tent_modifier: "Ăn Cùng Trại"
  ep3_laamp_flavour_ewan_0051_check_building_mess_tent_modifier_desc: "Một lãnh đạo không nhất thiết phải ăn cùng người theo, nhưng sẽ tốt hơn."
  ep3_laamp_flavour_ewan_0051_check_building_camp_fire_modifier: "Người Dẫn Đầu Vòng Trại"
  ep3_laamp_flavour_ewan_0051_check_building_camp_fire_modifier_desc: "Vị trí chỉ huy tạo nên tư thế chỉ huy."
  ep3_laamp_flavour_ewan_0051_check_building_proving_grounds_modifier: "Luôn Trong Huấn Luyện"
  ep3_laamp_flavour_ewan_0051_check_building_proving_grounds_modifier_desc: "Một cái nhìn chắc chắn từ trên cao tạo nên kỷ luật."
  ep3_laamp_flavour_ewan_0051_check_building_camp_perimeter_modifier: "Quan Sát Người Gác"
  ep3_laamp_flavour_ewan_0051_check_building_camp_perimeter_modifier_desc: "Đi tuần đêm quanh chu vi giữ các lính gác tỉnh táo."

  ep3_laamp_flavour_ewan.0061.t: "Hội Chợ Bất Ngờ"
  ep3_laamp_flavour_ewan.0061.desc: "Dù không phải nơi nào cũng chào đón một trại như của chúng ta, dường như [current_county.GetBaseNameNoTier] chắc chắn có — hoặc ít nhất [local_merchant.GetFirstName] đã làm #EMP trông#! như vậy, tổ chức một hội chợ bất ngờ để trao đổi hàng hóa và moi tiền từ những người theo Ta.\n\nCynical? Có thể, nhưng khó mà phủ nhận nụ cười trên khuôn mặt của hầu hết mọi người, và đôi khi chỉ thế thôi cũng đủ rồi."
  ep3_laamp_flavour_ewan.0061.tt.everyone_loves_faires: "Ai cũng thích hội chợ"
  ep3_laamp_flavour_ewan.0061.a: "Thật là một bất ngờ dễ chịu!"
  ep3_laamp_flavour_ewan.0061.b: "Có lẽ [local_merchant.GetFirstNameNoTooltip] muốn xin một công việc..."
  ep3_laamp_flavour_ewan.0061.c: "Mua vài đồ dùng trong lúc chúng ta ở đây."
  ep3_laamp_flavour_ewan.0061.d: "Ta nghĩ Ta sẽ ở lại trại, dù sao đi nữa."

  ep3_laamp_flavour_ewan.0071.t: "Tiếng Nhịp Hồi"
  ep3_laamp_flavour_ewan.0071.desc: "\"Ư ư, cái #EMP đầu#! của ta!\" [hanger.GetFirstName] rên rỉ khi [hanger.GetSheHe] cưỡi ngựa cùng ta. Ta nhướn mày thắc mắc trước lời than vãn của [hanger.GetWomanMan] này.\n\nĐáp lại, [hanger.GetFirstNameNoTooltip] chỉ đơn giản gục xuống trên lưng ngựa của [hanger.GetHerHis], rên rỉ và ôm lấy thái dương [hanger.GetHerHis].\n\nRõ ràng #EMP ai đó#! đã có một đêm tuyệt vời tối qua."
  ep3_laamp_flavour_ewan.0071.a: "Đi chậm lại cho [hanger.GetHerHim]."
  ep3_laamp_flavour_ewan.0071.b: "Cười trước tình cảnh của [hanger.GetHerHis]."
  ep3_laamp_flavour_ewan.0071.c: "Thúc ngựa của [hanger.GetHerHis] đi tiếp."
  ep3_laamp_flavour_ewan.0071.d: "Tiếp tục phi nước kiệu, để [hanger.GetHerHim] với nỗi khổ của [hanger.GetHerHis]."

 ##################################################
 # CHILDREARING

  ep3_laamp_flavour_ewan.1001.t: "Bạn Bè Nơi Thấp Hèn"
  ep3_laamp_flavour_ewan.1001.desc: "\"[ROOT.Char.GetMotherFather|U], [ROOT.Char.GetMotherFather]!\" [own_child.Custom('GetDaughterSon')] của ta hét lên khi [own_child.GetSheHe] chạy về phía ta, \"Con muốn cha/mẹ gặp một người!\"\n\n[own_child.Custom('GirlBoy')] quay lại giới thiệu một đứa trẻ khác, dang rộng cánh tay [own_child.GetHerHis] như thể đang giới thiệu món quà của [ROOT.Char.GetFaith.HighGodNamePossessive] cho các tín đồ thay vì thứ trông giống như một đứa trẻ hạ đẳng nghèo khổ.\n\n\"Đây là [other_child.GetFirstName], bạn chơi mới của con. #EMP Một ngày nào đó#!, [other_child.GetSheHe] sẽ giúp con điều hành trại này.\""
  ep3_laamp_flavour_ewan.1001.set_best_friendship: "Chúng ta chống lại thế giới"
  ep3_laamp_flavour_ewan.1001.set_friendship: "Một Tình bạn ra đời"
  ep3_laamp_flavour_ewan.1001.set_hidden_potential_friendship: "Ngài chơi ưa thích"
  ep3_laamp_flavour_ewan.1001.friendship_fizzles: "Tình bạn vụt tắt"
  ep3_laamp_flavour_ewan.1001.a: "Ha, vậy thì hai đứa chạy đi."
  ep3_laamp_flavour_ewan.1001.b: "Ta nghĩ con đã tìm được Ngài suốt đời rồi, [own_child.Custom('GetDaughterSon')]."
  ep3_laamp_flavour_ewan.1001.c: "[own_child.GetFirstNameNoTooltip], [other_child.GetSheHe] không xứng với con."
 
  ep3_laamp_flavour_ewan.1011.t: "Học Hỏi Theo Gương"
  ep3_laamp_flavour_ewan.1011.desc: "[child.GetFirstName|U] đang ở độ tuổi mà một đứa trẻ hấp thụ mọi thứ xung quanh [child.GetHerHim] như một miếng bọt biển thấm nước.\n\nMặc dù hoàn cảnh hiện tại không cho phép ta mang đến cho [child.GetHerHim] sự giáo dục tốt nhất, nhưng [child.Custom('GetLassLad')] nhỏ có vẻ không vì thế mà bớt khao khát học hỏi. Thay vì gia sư và sách vở mà một người có sự giàu có... cố định hơn có thể cảm thấy mình xứng đáng, [child.GetSheHe] lang thang khắp trại, theo chân các sĩ quan của ta và hăng hái hỗ trợ họ trong công việc.\n\nMột chút gợi ý về một người cụ thể có lẽ sẽ làm nên điều kỳ diệu trong việc tập trung những nỗ lực của [child.GetHerHis]."
  ep3_laamp_flavour_ewan.1011.a: "Phó Tư Lệnh của Ta."
  ep3_laamp_flavour_ewan.1011.b: "$quartermaster_camp_officer$ của ta."
  ep3_laamp_flavour_ewan.1011.c: "$armorer_camp_officer$ của ta."
  ep3_laamp_flavour_ewan.1011.d: "$chief_forager_camp_officer$ của ta."
  ep3_laamp_flavour_ewan.1011.e: "$master_thief_camp_officer$ của ta."
  ep3_laamp_flavour_ewan.1011.f: "$head_porter_camp_officer$ của ta."
  ep3_laamp_flavour_ewan.1011.g: "$head_groom_camp_officer$ của ta."
  ep3_laamp_flavour_ewan.1011.h: "$huntperson_camp_officer$ của ta."
