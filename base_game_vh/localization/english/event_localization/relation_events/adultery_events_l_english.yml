l_english: 

  adultery.0002.t:0 "Một Người Khác"
  adultery.0002.consort_start.desc:0 "[lover_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)|U] lại một lần nữa vắng mặt khỏi [ROOT.Char.Custom('GetChamber')|l] của chúng ta khi màn đêm buông xuống. Gần đây [lover_spouse.GetSheHe|U] trở nên xa cách — thường chìm trong suy nghĩ và hiếm khi xuất hiện tại [ROOT.Char.Custom('GetCourt')|l]."
  adultery.0002.soulmate_start.desc:0 "Đã quá lâu kể từ lần cuối Ta ôm [lover_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] trong vòng tay. Gần đây [lover_spouse.GetSheHe|U] trở nên xa cách — [lover_spouse.GetSheHe] đưa ra hết lý do này đến lý do khác vì sao chúng Ta không thể gặp nhau."
  adultery.0002.desc:1 "\n\nChẳng lẽ Ta không còn làm [lover_spouse.GetHerHis] hài lòng? Hay [lover_spouse.GetSheHe] chỉ đơn giản là bận rộn? Hay có lẽ [lover_spouse.GetSheHe] đang sưởi ấm giường của một kẻ khác...?"
  adultery.0002.a:0 ""Ngươi có người khác rồi sao, [lover_spouse.GetFirstNameNoTooltip]?""
  adultery.0002.a.tt:0 "Ta đối chất với [lover_spouse.GetTitledFirstNameNoTooltip]"
  adultery.0002.b:0 "Ta sẽ tự mình điều tra chuyện này."
  adultery.0002.b.tt:0 "Nếu [lover_spouse.GetSheHe] đã không chung thủy, ta sẽ tìm ra"
  adultery.0002.b.success:0 "Ta đã thành công tìm hiểu đời sống tình ái của [lover_spouse.GetHerHis]"
  adultery.0002.b.success.innocent:0 "[lover_spouse.GetTitledFirstName] vô tội"
  adultery.0002.b.failure:0 "Ta không tìm thấy bằng chứng ngoại tình"
  adultery.0002.c:0 "Mọi hành động của [lover_spouse.GetHerHis|U] sẽ bị theo dõi."
  adultery.0002.c.tt:0 "[spymaster|E] của ta sẽ tiếp tục theo dõi [lover_spouse.GetShortUIName]"
  adultery.0002.d:0 "[lover_spouse.GetSheHe|U] sẽ không bao giờ xúc phạm sự thiêng liêng của hôn nhân chúng ta!"
  adultery.0002.d.concubine_or_soulmate:0 "[lover_spouse.GetSheHe|U] sẽ không bao giờ xúc phạm ta như vậy!"

  adultery.0003.t:0 "Những Lời Cáo Buộc"
  adultery.0003.desc:0 "[spouse.Custom2('MyCharacterIntroduction', ROOT.Char)|U] gần đây tỏ ra căng thẳng, và khi chúng Ta ở riêng với nhau, cuối cùng cũng rõ vì sao.\n\n"Xin hãy thành thật với ta," [spouse.GetSheHe] nói với giọng nghiêm nghị. "Có phải có người khác không? Ngươi đã có tình nhân rồi sao?""
  adultery.0003.a:0 "Dĩ nhiên là không!"
  adultery.0003.a.tt_lie:0 "Hy vọng [spouse.GetSheHe] tin điều đó..."
  adultery.0003.a.tt_truth:0 "Không thể tin được khi [spouse.GetSheHe] lại nghi ngờ điều như vậy..."
  adultery.0003.b:0 "Ta tưởng ngươi chưa nhận ra..."
  adultery.0003.b.tt:0 "[spouse.GetSheHe|U] có thể tha thứ cho Ngài, hoặc không..."

  adultery.0004.desc:0 ""Sao ngươi có thể nói ra điều như vậy, [spouse.GetFirstNameNoTooltip]? Ta sẽ không bao giờ có tình nhân!"\n\n[lover_spouse.GetTitledFirstName] trông thật sự tổn thương khi [lover_spouse.GetSheHe] phủ nhận lời buộc tội của Ta."
  adultery.0004.b:0 "Ta không còn lựa chọn nào khác ngoài việc nghe theo lời [lover_spouse.GetHerHim] [lover_spouse.GetHerHis]."
  adultery.0004.b.malicious:0 "Ít nhất là lúc này..."

 # Shares some text with infidelity_confrontation.1000, the event for discovering a lover secret
  adultery.0006.apologetic_start.desc:1 "[lover_spouse.GetFirstNameNoTooltip] im lặng như thể thời gian đã đông cứng, nhưng Ta có thể thấy điều đó trong mắt [lover_spouse.GetHerHis]. Nỗi sợ của Ta là sự thật. Ta dường như cũng chết lặng — ngoại trừ trái tim đang đập dồn dập.\n\nKhi những lời cuối cùng cũng thoát ra từ môi [lover_spouse.GetFirstNamePossessiveNoTooltip], nước mắt cũng trào ra từ mắt [lover_spouse.GetHerHis]. "Xin hãy tha thứ cho ta, [lover_spouse.Custom2('RelationToMe', SCOPE.sC('spouse'))] yêu dấu. Ta cầu xin ngươi! Ta... ta sẽ nói hết mọi chuyện. Ta đã cùng chung giường với "
  adultery.0006.your_lovername.desc:1 "[sex_partner.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)]."
  adultery.0006.my_lovername.desc:1 "[sex_partner.Custom2('MyCharacterIntroductionNoComma', lover_spouse)]."
  adultery.0006.unapologetic_start.desc:1 "[lover_spouse.GetFirstNameNoTooltip] rõ ràng không ngờ tới lời buộc tội của Ta. Tuy vậy [lover_spouse.GetSheHe|U] không bị lay chuyển lâu.\n\n"Cuối cùng ngươi cũng nhận ra rồi sao, #EMP [lover_spouse.Custom2('RelationToMe', SCOPE.sC('spouse'))]#!." Lời của [lover_spouse.GetHerHis|U] nhỏ giọt đầy độc địa. "Đúng vậy, ta đã nằm cùng người khác – "
  adultery.0006.male_lover.desc:0 "một người đàn ông chẳng đáng nhắc tới. Ta thậm chí còn không biết tên hắn."
  adultery.0006.female_lover.desc:0 "một người phụ nữ chẳng đáng nhắc tới. Ta thậm chí còn không biết tên nàng."
  adultery.0006.apologetic_end.desc:0 "Chuyện đó chỉ xảy ra một lần thôi, ta thề!""
  adultery.0006.unapologetic_end.desc:0 "Chuyện đó chỉ xảy ra một lần, nhưng hãy tin lời ta. Ta sẵn sàng làm lại lần nữa.""

  adultery.0006.a:0 "Mọi người sẽ biết sự phản bội của ngươi, đồ [lover_spouse.Custom2('InsultNounSexual', ROOT.Char)]!"
  adultery.0006.b:0 "Ta tha thứ cho ngươi. Lần này thôi."
  adultery.0006.c:0 "Nếu ta không còn tin được [lover_spouse.GetHerHim], thì chúng ta còn lại gì?"

  adultery.0007.start.desc:0 "Những nghi ngờ của ta không phải vô căn cứ. Ta đã tìm thấy bằng chứng về sự ngoại tình của [lover_spouse.GetFirstNamePossessiveNoTooltip]!\n\n"
  adultery.0007.lover_my.desc:0 "Tên [lover_spouse.Custom2('InsultNoun', ROOT.Char)] dối trá đó đã đưa [sex_partner.Custom2('MyCharacterIntroduction', ROOT.Char)] lên giường của [lover_spouse.GetHerHis]."

  adultery.0007.lover_herhis.desc:0 "Tên [lover_spouse.Custom2('InsultNoun', ROOT.Char)] dối trá đó đã đưa [sex_partner.Custom2('HerHisCharacterIntroduction', lover_spouse)] lên giường của [lover_spouse.GetHerHis]."
  adultery.0007.male_lover.desc:0 "[lover_spouse.GetSheHe|U] đã vấy bẩn chính mình [lover_spouse.GetHerselfHimself] với một thường dân thấp kém, một người đàn ông không có tầm quan trọng."
  adultery.0007.female_lover.desc:0 "[lover_spouse.GetSheHe|U] đã vấy bẩn chính mình [lover_spouse.GetHerselfHimself] với một thường dân thấp kém, một người đàn bà không có tầm quan trọng."
  adultery.0007.end.desc:0 "Theo những gì ta biết, chuyện đó chỉ xảy ra một lần. Nhưng đó chẳng phải sự an ủi nào trước sự phản bội của [lover_spouse.GetHerHis]..."

  adultery.0008.t:0 "Bị Phát Hiện"
  adultery.0008.sex_partner.desc:0 "Ta đã nghĩ mình cực kỳ cẩn thận, rằng sẽ không có bằng chứng nào về cuộc tình vụng trộm nhỏ bé của ta với [sex_partner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. Thế nhưng bằng một cách khó hiểu nào đó, [spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] đã phát hiện ra và phơi bày bí mật của chúng ta trước thiên hạ!"
  adultery.0008.no_sex_partner.desc:0 "Ta đã nghĩ mình cực kỳ cẩn thận, rằng sẽ không có bằng chứng nào về cuộc tình vụng trộm của ta. Thế nhưng bằng một cách khó hiểu nào đó, [spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] đã phát hiện ra chuyện ngoại tình của ta và phơi bày nó trước thiên hạ!"
  adultery.0008.a:0 "[ROOT.Char.Custom('CulturalCurse')|U]!"

  adultery.0009.desc:0 "Những giọt nước mắt [spouse.GetTitledFirstNamePossessive] làm tổn thương ta hơn bất kỳ lời nói cay nghiệt nào. Ta đứng sững sờ khi [spouse.GetSheHe] giấu khuôn mặt [spouse.GetHerHis] vào chiếc khăn tay.\n\n"Em... Em đã nghĩ chúng ta sẽ mãi mãi," [spouse.GetSheHe] thì thầm giữa những tiếng nấc. "Chúng ta đã hứa. #EMP Chính anh#! đã hứa, [ROOT.Char.GetFirstNameNoTooltip] — vậy mà anh vẫn chia sẻ giường chiếu của mình với người khác. Em không bao giờ có thể tin anh nữa. Mọi chuyện kết thúc rồi.""
  adultery.0009.a:0 "Ta đúng là một kẻ ngốc..."

  adultery.1001.t:0 "Câu Hỏi Về Lòng Trung Thành"
  adultery.1001.opening:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))] của ta, [mother.GetTitledFirstName], đang mang thai, và lẽ ra ta phải vui mừng. Tuy nhiên, gần đây [mother.GetSheHe] hành xử rất lạ, và ta không thể xua đi cảm giác rằng có điều gì đó không ổn.\n\n"
  adultery.1001.default:1 "Liệu ta thật sự là cha như [mother.GetSheHe] nói, hay [mother.GetSheHe] đã phản bội mối ràng buộc của chúng ta?"
  adultery.1001.hard_to_believe:0 "Thật khó tin rằng [mother.GetSheHe] lại phản bội ta như vậy, nhưng liệu có thể ta không phải là cha?"
  adultery.1001.easy_to_believe:0 "Có vẻ rất có khả năng [mother.GetSheHe] đã phản bội ta, và ta không phải là cha của đứa con của [mother.GetHerHis]."
  adultery.1001.desc_sadistic:0 "Ta sẽ không ngạc nhiên nếu [mother.GetHerHim] sinh con của kẻ khác chỉ để hành hạ ta."
  adultery.1001.desc_lustful:0 "Ta luôn lo rằng ham muốn vô độ của [mother.GetHerHis] không chỉ dành cho mình ta. Liệu đứa trẻ có phải của người khác?"
  adultery.1001.desc_deceitful:0 "[mother.GetSheHe|U] nói ta là cha, nhưng [mother.GetSheHe] đã nhiều lần nói dối ta trước đây."
  adultery.1001.desc_root_trusting:0 "Ta nghi ngờ có thể mình không phải là cha, nhưng... [mother.GetSheHe|U] sẽ không bao giờ giấu giếm điều như vậy với ta, đúng không?"
  adultery.1001.desc_root_lunatic:0 "Họ đã thì thầm với ta. Ta hiểu. Ta nghĩ ta hiểu. Làm sao ta có thể là cha của thứ đang ở trong bụng nàng? Thứ đáng sợ và tàn nhẫn đó?"
  adultery.1001.desc_lunatic:0 "[mother.GetSheHe|U] nói ta là cha, nhưng [mother.GetSheHe] cũng nói rằng những cái bóng đang nói chuyện với [mother.GetHerHim]."
  adultery.1001.a:0 "[mother.GetSheHe|U] phải nói cho ta biết!"
  adultery.1001.a.tt:0 "Đối chất trực tiếp với [mother.GetFirstNameNoTooltip]"
  adultery.1001.b:0 "Ta sẽ điều tra chuyện này một cách kín đáo."
  adultery.1001.b_no_scheme:0 "Ta nên tìm hiểu chuyện này sau..."
  adultery.1001.b_cannot_start_scheme:0 "#F Ta không có thời gian điều tra lúc này, nhưng ta sẽ ghi nhớ...#!"
  adultery.1001.c:0 "Chắc chắn ta là cha. Nhất định vậy."
  adultery.1001.c.tt:0 "#F Tại sao ta phải lo lắng về những điều vô căn cứ?#!"

  adultery.1002.t:0 "Một Nghi Ngờ Lén Lút"
  adultery.1002.desc_paranoid:1 ""Ta biết đứa trẻ đó không phải của ta!" Đôi mắt của [spouse.Custom('WifeHusbandPossessive')] mở to với lời buộc tội. "Là ai?" [adultery_spouse.GetSheHe] khăng khăng hỏi. "Ai?"" 
  adultery.1002.desc_chaste:0 ""Đứa trẻ nàng mang có thật sự là của ta không?" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] của ta hỏi. "Ta biết sự tận tụy của mình đã... Với tư cách một [spouse.GetWomanMan]... Trước hết là dành cho [spouse.GetFaith.HighGodName]."" 
  adultery.1002.desc_craven:0 ""Đ-Đứa trẻ đó... thật sự là của ta sao?" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] của ta trông như thể [adultery_spouse.GetSheHe] sợ câu trả lời."
  adultery.1002.desc_vengeful:0 ""Đứa trẻ nàng mang thật sự là con của ta sao?" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] của ta hỏi. "Ta thề trước [adultery_spouse.GetFaith.HighGodName], nếu nàng dám nói dối ta...""
  adultery.1002.desc_compassionate:0 ""Đứa trẻ nàng mang thật sự là con của ta sao?" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] của ta hỏi. "Ta không muốn nàng phải chịu khổ, dù nàng đã làm gì đi nữa.""
  adultery.1002.worried:0 ""Hãy nói cho ta biết, thật sự là con của ta chứ?" [adultery_spouse.GetTitledFirstName] trông vô cùng rối trí. Ánh mắt lo lắng của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] của ta nhìn thẳng vào Ta."
  adultery.1002.desc_sadistic:0 ""Nàng không phải đã mang thai với một [spouse.GetWomanMan] khác đấy chứ?" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] của ta nhìn Ta dò xét. "Nàng biết đấy, điều đó gần như cũng tệ hại như việc nói dối ta vậy." [spouse.GetSheHe|U] mỉm cười."
  adultery.1002.desc_lunatic:0 ""Đứa trẻ đó là của ta sao?!" Mắt của [adultery_spouse.GetTitledFirstNamePossessive] đảo loạn trong hốc mắt [adultery_spouse.GetHerHis]. "Chúng sẽ nói cho ta biết, ngươi biết đấy!""
  adultery.1002.conclusion:0 "\n\nTa [ROOT.Char.Custom2('QuirkPersonalTowardsOther', SCOPE.sC('adultery_spouse'))]."
  adultery.1002.a:0 "Ta cần phải nói cho ngươi biết sự thật."
  adultery.1002.a.confession_tt:0 "[adultery_spouse.GetShortUIName|U] sẽ biết sự thật"
  adultery.1002.b:0 "Dĩ nhiên là con của ngươi rồi, [adultery_spouse.GetFirstNameNoTooltip]!"
  adultery.1002.b.tt:0 "#F Hy vọng [adultery_spouse.GetSheHe|U] sẽ không hỏi thêm.#!"
  adultery.1002.c:0 "Dĩ nhiên là con của ngươi rồi, [adultery_spouse.GetFirstNameNoTooltip]!"
  adultery.1002.c.tt:0 "#F Chắc chắn [adultery_spouse.GetSheHe|U] sẽ tin điều đó!#!"

  adultery.1003.desc:0 ""Dĩ nhiên đứa trẻ là của ngươi." [mother.GetFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('mother'))]. "Sao ngươi lại nghĩ khác đi chứ?""
  adultery.1003.a:0 "Ta chỉ cần nghe [mother.GetHerHim] nói vậy."
  adultery.1003.a.tt:0 "#F Biết được điều đó thật nhẹ nhõm.#!"
  adultery.1003.b:0 "Ta không tin [mother.GetHerHim]!"
  adultery.1003.duel_success:0 "Khám phá sự thật"
  adultery.1003.duel_success_tt:0 "Nếu ai đó khác là cha của đứa trẻ của [mother.GetFirstNamePossessiveNoTooltip], ta sẽ tìm thấy bằng chứng về sự không chung thủy của [mother.GetHerHis]"
  adultery.1003.duel_failure:0 "Gián điệp bị phát hiện"

  adultery.1004.default_reaction:0 "Nước mắt dâng lên trong mắt của [mother.GetTitledFirstNamePossessive]."
  adultery.1004.reaction_callous:0 "[mother.GetTitledFirstName] nhìn chằm chằm vào Ta, gương mặt [mother.GetHerHis] không hề thay đổi."
  adultery.1004.reaction_sadistic:0 "[mother.GetTitledFirstName] nở một nụ cười mỉa mai."
  adultery.1004.reaction_gluttonous:0 "[mother.GetTitledFirstName] cố gắng giấu những giọt nước mắt trào dâng trong đôi mắt [mother.GetHerHis] đằng sau chiếc bánh ngọt [mother.GetHerHis]."
  adultery.1004.reaction_deceitful:0 ""Ta đã quá mệt mỏi vì phải nói dối." [mother.GetTitledFirstName] dường như sắp bật khóc."
  adultery.1004.reaction_compassionate:0 ""Ngươi nên ngồi xuống đi, người thân yêu." Có sự lo lắng thật sự trong mắt [mother.GetTitledFirstNamePossessive]."
  adultery.1004.reaction_honest:0 ""Ta không muốn nói dối ngươi, hay bất kỳ ai." Đôi mắt của [mother.GetTitledFirstNamePossessive] đỏ lên vì khóc."
  adultery.1004.reaction_lunatic:0 "[mother.GetTitledFirstName] trông tỉnh táo lạ thường khi [mother.GetSheHe] nhìn Ta. Rồi ánh mắt [mother.GetHerHis] trở nên mờ đục. "Những lời thì thầm đã nói với ngươi rồi sao?""
  adultery.1004.reaction_positive_opinion:0 ""Ngươi phải hiểu, ta chưa bao giờ muốn làm tổn thương ngươi." Nước mắt đang chảy dài trên gương mặt [mother.GetTitledFirstNamePossessive]."
  adultery.1004.reaction_negative_opinion:0 "Môi của [mother.GetTitledFirstNamePossessive] mím lại thành một đường mỏng trong biểu cảm cứng nhắc của [mother.GetHerHis]. "Ngươi biết không, gần như là một sự nhẹ nhõm.""
  adultery.1004.default_admission:0 "\n\nSau một khoảng im lặng kéo dài, cuối cùng [mother.GetSheHe] cũng thừa nhận. "[real_father.GetTitledFirstName] mới là cha thật sự của đứa trẻ của ta.""
  adultery.1004.a:0 "Sao có thể như vậy? Ta cần thời gian để suy nghĩ."
  adultery.1004.a.tt:0 "Ta giữ bí mật này cho riêng mình. Hiện tại."
  adultery.1004.b:0 "Bí mật này phải chỉ ở giữa chúng ta!"
  adultery.1004.c:0 "Mọi người sẽ biết về sự ngoại tình của ngươi!"


  adultery.1006.t:0 "[adultery_spouse.GetSheHe|U] Đã Biết"
  adultery.1006.very_positive_opinion:0 ""Đúng vậy, [real_father.GetTitledFirstName] là cha." Gần như là một sự nhẹ nhõm khi không còn phải giấu bí mật này với [adultery_spouse.GetSheHe]."
  adultery.1006.very_negative_opinion:0 ""Đúng vậy, [real_father.GetTitledFirstName] là cha." Ta không thể không cảm thấy khoái chí khi nói ra điều đó."
  adultery.1006.fallback:0 ""Đúng vậy, [real_father.GetTitledFirstName] là cha..." Ta không còn lựa chọn nào khác ngoài việc thú nhận."
  adultery.1006.conclusion:0 "\n\nÍt nhất thì chỉ có [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] của ta biết điều này."
  adultery.1006.a:0 "Giờ thì chuyện gì sẽ xảy ra?"

  adultery.1009.t:0 "Những Nghi Ngờ Được Xóa Tan"
  adultery.1009.desc:0 "Có vẻ như nỗi sợ của ta là vô căn cứ. Dù các gián điệp của ta đã nỗ lực hết sức, ta vẫn không tìm thấy dấu hiệu nào cho thấy [mother.GetTitledFirstName] đã không chung thủy.\n\nThật không may, [mother.GetSheHe] đã phát hiện ra sự nghi ngờ của ta, và vô cùng thất vọng về ta."
  adultery.1009.a:0 "Dĩ nhiên ta luôn tin ngươi, người thân yêu!"
  adultery.1009.a.flavor_tt:0 "Ta chỉ cần chắc chắn mà thôi."

  adultery.2001.t:0 "[adultery_child.Custom('GetDaughterSon')|U] Của Ta"
  adultery.2001.desc_dislike:0 "Đôi khi ta tự hỏi về [adultery_child.GetTitledFirstName]. Những điều [adultery_child.GetSheHe] nói, tính cách khó chịu của [adultery_child.GetHerHis], cách mà [adultery_child.GetSheHe] luôn khiến ta bực mình... [adultery_child.GetSheHe|U] xa lạ với ta chẳng khác gì những thần dân bình thường."
  adultery.2001.desc_suspicious_mother:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] của ta, [adultery_spouse.GetTitledFirstName], đang giấu điều gì đó về [adultery_child.Custom('GetDaughterSon')] của chúng ta, ta chắc chắn như vậy! Những ánh nhìn lén lút, sự bảo vệ quá mức của nàng đối với [adultery_child.GetTitledFirstName], cách [adultery_spouse.GetSheHe] tránh né mọi câu hỏi của ta..."
  adultery.2001.desc_mother_lover:0 "Kể từ khi ta biết rằng [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] của ta, [adultery_spouse.GetTitledFirstName], đã không chung thủy với cuộc hôn nhân của chúng ta, ta nhìn mọi người gần gũi với [adultery_spouse.GetHerHim] bằng ánh mắt nghi ngờ; mọi cận thần đi ngang qua, chính [ROOT.Char.Custom('ChildChildrenGender')] của ta..."
  adultery.2001.desc_fallback:0 "Mỗi khi ta nói về [adultery_child.GetTitledFirstName] với [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] của ta, [adultery_spouse.GetTitledFirstName], [adultery_spouse.GetSheHe] luôn trở nên xa cách. Ban đầu ta không nghĩ nhiều, nhưng giờ ta bắt đầu nghi ngờ rằng [adultery_spouse.GetFirstName] đang che giấu điều gì đó."
  adultery.2001.desc_end:1 "\n\nTa không dễ dàng nghi ngờ huyết thống của [adultery_child.Custom('GetDaughterSon')] [adultery_child.GetTitledFirstName], nhưng sự nghi ngờ đang gặm nhấm tâm trí ta."
  adultery.2001.a:0 "Ta cần phải chắc chắn!"
  adultery.2001.b:0 "Dĩ nhiên [adultery_child.GetSheHe] là [adultery_child.Custom('GetDaughterSon')] của ta."
  adultery.2001.a.tt:0 "Nếu [adultery_child.GetFirstNameNoTooltip] không phải là con ruột của ta:"
  adultery.2001.a.duel_success:1 "Ta thành công theo dõi gia đình mình"
  adultery.2001.a.duel_success.tooltip:0 "Ngài khám phá ra sự thật, dù nó là gì"
  adultery.2001.a.duel_failure:1 "Ta bị bắt khi cố tìm ra sự thật"

  adultery.2002.t_a:0 "Đứa Con Của Chúng Ta"
  adultery.2002.desc_no_child:0 "Ta vẫy tay với [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] của mình, [adultery_spouse.GetTitledFirstName], khi [adultery_spouse.GetSheHe] bước qua khu vườn, nhưng [adultery_spouse.GetSheHe] cố tình quay đi.\n\nNhững lo lắng ban đầu của ta về sự chung thủy của [adultery_spouse.GetHerHis] dường như chỉ là hiểu lầm. Tuy nhiên, [adultery_spouse.GetFirstNameNoTooltip] sẽ không dễ dàng quên chuyện này."
  adultery.2002.desc_not_born:0 "Ta vẫy tay với [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] của mình, [adultery_spouse.GetTitledFirstName], khi [adultery_spouse.GetSheHe] bước qua khu vườn, nhưng [adultery_spouse.GetSheHe] cố tình quay đi.\n\nNhững lo lắng ban đầu của ta về sự chung thủy của [adultery_spouse.GetHerHis] dường như chỉ là hiểu lầm. Tuy nhiên, [adultery_spouse.GetFirstNameNoTooltip] sẽ không dễ dàng quên chuyện này."
  adultery.2002.desc_spouse:0 "Ta vẫy tay với [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] của mình, [adultery_spouse.GetTitledFirstName], khi [adultery_spouse.GetSheHe] bước qua khu vườn, nhưng [adultery_spouse.GetSheHe] cố tình quay đi.\n\nNhững nghi ngờ ban đầu của ta về huyết thống của [adultery_child.GetTitledFirstNamePossessive] dường như chỉ là hiểu lầm. Tuy nhiên, họ sẽ không dễ dàng quên chuyện này."
  adultery.2002.desc:0 "Ta vẫy tay với [adultery_child.Custom('GetDaughterSon')] của mình, [adultery_child.GetTitledFirstName], khi [adultery_child.GetSheHe] bước qua khu vườn, và cố xua tan những nghi ngờ đen tối.\n\nNhững nghi ngờ ban đầu của ta về huyết thống của [adultery_child.GetTitledFirstNamePossessive] dường như chỉ là hiểu lầm. Tuy nhiên, họ sẽ không dễ dàng quên chuyện này."
  adultery.2002.a_spouse:0 "Nếu họ nghĩ có thể giấu ta điều gì, thì họ nhầm rồi!"
  adultery.2002.a_unborn:0 "[adultery_spouse.GetSheHe|U] không thể giấu ta điều gì!"
  adultery.2002.a:0 "[adultery_child.GetSheHe|U] không thể giấu ta điều gì!"
  adultery.2002.a_spouse_tt:0 "#F Ta sẽ theo dõi họ chặt chẽ hơn nữa!#!"
  adultery.2002.a.tt_unborn:0 "#F Ta sẽ theo dõi [adultery_spouse.GetHerHim] chặt chẽ hơn nữa!#!"
  adultery.2002.a.tt:0 "#F Ta sẽ theo dõi [adultery_child.GetHerHim] chặt chẽ hơn nữa!#!"
  adultery.2002.b:0 "Thật là nhẹ nhõm!"

  adultery.2003.desc:0 ""Vâng cha— [ROOT.Char.GetFirstNameNoTooltip], [real_father.GetTitledFirstName] mới là [real_father.Custom('MotherFather')] thật sự của con!"\n\nNỗi đau từ sự phản bội của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] của ta, [adultery_spouse.GetTitledFirstNamePossessive], gần như bị lấn át bởi sự nhẹ nhõm khi cuối cùng cũng biết được sự thật. Nghĩ rằng [adultery_spouse.GetSheHe] và [adultery_child.GetFirstName] đã giấu ta chuyện này suốt bấy lâu..."
  adultery.2003.a:0 "Sao họ có thể lừa dối ta như vậy?!"

 
  adultery.2006.t:0 "Dòng Máu Của Ta"
  adultery.2006.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))] của Ta, [owner.GetTitledFirstName], đã biết rằng Ta là [ROOT.Char.Custom('GetDaughterSon')] của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))] Ta, [real_father.GetTitledFirstName], chứ không phải của [owner.GetHerHim]! Ít nhất thì chuyện này vẫn chưa phải ai cũng biết... hiện tại là vậy."
  adultery.2006.a:0 "Làm sao Ta còn có thể đối mặt với [owner.GetHerHim] đây?"

  adultery.2008.t:0 "[adultery_child.Custom('GetDaughterSon')|U] của Ta?"
  adultery.2008.desc:2 "Nỗi sợ hãi lớn dần trong lòng Ta bấy lâu nay hóa ra là có cơ sở!\n\nCác gián điệp của Ta đã phát hiện rằng Ta không phải cha của [adultery_child.GetTitledFirstName]. [adultery_child.GetSheHe|U] là kết quả của mối quan hệ vụng trộm giữa [adultery_spouse.GetFirstName] và [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)]!"
  adultery.2008.a:0 "Hãy để tất cả mọi người biết — đó không phải con của ta!"
  adultery.2008.b:0 "Ta cần thời gian suy nghĩ."
  adultery.2008.b.tt:0 "Tạm thời ta sẽ giữ chuyện này cho riêng mình"

  adultery.2009.t:0 "[adultery_child.Custom('GetDaughterSon')|U] của Ta?"
  adultery.2009.desc:1 "Mặc dù các gián điệp của Ta theo dõi [adultery_child.GetTitledFirstName] khắp nơi, họ vẫn không tìm thấy bằng chứng nào cho thấy Ta nên nghi ngờ huyết thống của [adultery_child.GetHerHis].\n\nTuy nhiên, [adultery_child.GetFirstNameNoTooltip] vẫn rất buồn vì việc Ta đã từng nghi ngờ."
  adultery.2009.a:0 "Vậy ra [adultery_child.GetSheHe] đúng là con của ta."

  adultery.3001.t:0 "Bí Mật"
  adultery.3001.desc:0 ""[ROOT.Char.Custom('GetDaughterSon')] của mẹ, đứa con yêu quý của mẹ, mẹ buộc phải nói cho con biết! Con có thể tha thứ cho mẹ không?"\n\nMẹ Ta quỳ xuống đất, nước mắt tuôn dài trên khuôn mặt [parent_with_secret.GetHerHis], còn Ta thì không thốt nên lời."
  adultery.3001.desc_father:1 "[father.GetFirstName], người [father.GetWomanMan] mà ta đã lớn lên và coi như cha, hoàn toàn không có quan hệ huyết thống với ta. Người cha thực sự của ta là [real_father.GetTitledFirstName]!"
  adultery.3001.desc_no_father:0 "[real_father.Custom('MotherFather')] thật sự của Ta là [real_father.GetTitledFirstName]!"
  adultery.3001.a:0 "Sao chính [parent_with_secret.Custom('MotherFather')] của Ta lại có thể làm điều này với Ta?!"
  adultery.3001.a.tt:0 "#F Ít nhất thì chuyện này vẫn chưa phải ai cũng biết...#!"

  adultery.4001.t:0 "Sự Phản Bội Của [adultery_spouse.GetTitledFirstNamePossessiveNoTooltip]"
  adultery.4001.start.desc:0 "[ROOT.Char.Custom2('RelationToMe', adultery_spouse)] của Ta"
  adultery.4001.unsuccessful_sex_attempt.desc:0 "đã cố quyến rũ [sex_partner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]?!"
  adultery.4001.fur.desc:1 "Người ta nói rằng [adultery_spouse.GetSheHe] đã đến phòng của [sex_partner.GetHerHis], chỉ mặc áo lông, và bị đuổi ra ngay lập tức!"
  adultery.4001.laugh.desc:0 "Người ta nói [sex_partner.GetSheHe] đã cười vào mặt [adultery_spouse.GetHerHis] khi [adultery_spouse.GetSheHe] mời [sex_partner.GetHerHim] vào giường [adultery_spouse.GetHerHis]!"
  adultery.4001.threw.desc:0 "Người ta nói [adultery_spouse.GetSheHe] đã ném chính mình [adultery_spouse.GetHerselfHimself] vào [sex_partner.GetHerHim] ngay khi họ ở một mình, nhưng [sex_partner.GetFirstNameNoTooltip] đó không thể chịu nổi ý nghĩ đó!"
  adultery.4001.sex_partner.desc:0 "đã tư thông với [sex_partner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]?!"
  adultery.4001.commoner.desc:0 "đã tư thông với một thường dân thấp kém?!"
  adultery.4001.servant.desc:0 "đã tư thông với một người hầu trong nhà?!"
  adultery.4001.another_gender.desc:0 "Lại còn với một [unknown_sex_partner.GetWomanMan] khác giới nữa chứ!"
  adultery.4001.bed.desc:0 "Ngay trên chính chiếc giường của chúng Ta, nếu những lời đồn là thật!"
  adultery.4001.mare.desc:0 "Trong chuồng ngựa, như một con ngựa cái tầm thường!"
  adultery.4001.stallion.desc:0 "Trong chuồng ngựa, như một con ngựa đực hoang dã!"
  adultery.4001.deer.desc:0 "Trong rừng, như một con hươu đang mùa động dục!"
  adultery.4001.elephant.desc:0 "Trong rừng, như một con voi đang mùa động dục!"
  adultery.4001.desk.desc:0 "Ngay trên bàn làm việc của Ta, nếu những lời đồn là thật!"
  adultery.4001.alley.desc:0 "Trong một con hẻm bẩn thỉu, như một kẻ lang thang!"
  adultery.4001.table:0 "Ngay trên bàn ở đại sảnh, nếu những lời đồn là thật!"
  adultery.4001.kitchen.desc:0 "Ngay dưới bếp, nếu những lời đồn là thật!"
  adultery.4001.privy.desc:0 "Trong nhà xí hôi hám, nếu những lời đồn là thật!"
  adultery.4001.end.desc:0 "\n\nKhi Ta đối chất với [adultery_spouse.GetFirstName], [adultery_spouse.GetSheHe] khăng khăng rằng "chỉ xảy ra một lần thôi" — như thể điều đó có thể làm giảm nỗi đau từ sự phản bội của [adultery_spouse.GetHerHis]!"
  adultery.4001.a:0 "Làm sao Ta còn có thể tin tưởng [adultery_spouse.GetHerHim] nữa?"
  adultery.4001.b:0 "Lính đâu! Bắt giữ kẻ đồi bại [adultery_spouse.Custom2('InsultNounSexual', ROOT.Char)] này!"
  adultery.4001.b2:0 "Ngươi sẽ phải hối hận! Lính đâu!"
  adultery.4001.c:0 "Bằng cách nào đó... ta phải cố gắng tha thứ."
