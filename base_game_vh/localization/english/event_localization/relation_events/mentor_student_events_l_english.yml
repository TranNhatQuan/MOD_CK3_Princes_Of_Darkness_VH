l_english:
  mentor_student.0001.t:0 "Những Gì Từng Là"
  mentor_student.0001.desc:1 ""Điều này không thể tiếp tục được [ROOT.Char.GetFirstNameNoTooltip]!" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mentor_to_lose') )] [mentor_to_lose.GetTitledFirstName] của ta thốt lên, [mentor_to_lose.Custom('quirk_neg_pp')].\n\n"Mối quan hệ của chúng ta kết thúc rồi, chúng ta quá khác biệt để điều này có thể tiếp diễn. Giờ đây con phải tự đứng trên đôi chân mình thôi.""
  mentor_student.0001.a:0 "Rất tốt."

  mentor_student.0002.desc:1 ""Không còn gì để ta dạy con nữa."\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mentor_to_lose') )] [mentor_to_lose.GetTitledFirstName] của ta mỉm cười [mentor_to_lose.Custom('quirk_pos_adverb')] và gật đầu. "Con đã học được rất nhiều, nhưng để đi xa hơn trong các nghiên cứu, con cần phải tự tìm lấy con đường của riêng mình.""
  mentor_student.0002.a:1 "[mentor_to_lose.GetSheHe|U] thật sự đã dạy Ta rất nhiều!"
  mentor_student.0002.b:0 "Ta cảm thấy mối quan hệ của chúng Ta giờ sẽ còn bền chặt hơn."

  mentor_student.0003.t:0 "Suy Nghĩ Lại"
  mentor_student.0003.desc:1 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mentor_to_lose') )] [mentor_to_lose.GetTitledFirstName] của ta mỉm cười [mentor_to_lose.Custom('quirk_neg_adverb')] khi [mentor_to_lose.GetSheHe] kể cho ta nghe về những #EMP chiến thắng#! gần đây nhất [mentor_to_lose.GetHerHis].\n\nTa có thể vẫn còn những điều để học, nhưng ngày càng khó hơn để chịu đựng [mentor_to_lose.GetFirstName] như một con người."
  mentor_student.0003.a:0 "Mối quan hệ này đã kết thúc."
  mentor_student.0003.b:0 "Nếu đó là cái giá cho kiến thức..."
