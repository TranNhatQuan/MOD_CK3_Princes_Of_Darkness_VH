l_english:
  parent_meddling_tt:0 "[parent.Custom('MotherFather')] của ta mong đợi được tham gia vào các quyết định của ta"
  parent_meddling_decrease_tt:0 "[parent.Custom('MotherFather')] của ta hài lòng vì ta tuân theo lời khuyên [parent.GetHerHis] của người"
  parent.1001.t:0 "Lời Khuyên Của [parent.Custom('MotherFather')|U]"
  parent.1001.desc:1 "[parent.Custom('MotherFather')] của ta có nhiều điều muốn nói về đội $knight_culture_player_plural_no_tooltip_lowercase$ tại [ROOT.Char.Custom('GetCourt')] của ta, bình luận về mọi thứ từ cách họ huấn luyện, cho đến những gì họ nên chuẩn bị trên chiến trường.\n\nNgay cả những $knight_culture_player_plural_no_tooltip$ cũng thừa nhận rằng những gì [parent.GetSheHe] nói đều rất hợp lý."
  parent.1001.a:1 ""Vậy [parent.Custom('MotherFather')] nghĩ đội $knight_culture_player_plural_no_tooltip_lowercase$ #EMP nên#! được tổ chức như thế nào?""
  parent.1001.b:0 "Ta tự quyết định cách họ chiến đấu!"
 
  parent.1002.desc:0 "[parent.Custom('MotherFather')] của ta là một [parent.GetWomanMan] thông thái, thấu hiểu sâu sắc nhu cầu và mong muốn của mọi người.\n\n[parent.GetSheHe|U] thường đưa ra lời khuyên cho ta khi đối nhân xử thế."
  parent.1002.a:0 "Thú thật, Ta cần tất cả lời khuyên có thể nhận được."
  parent.1002.b:0 "\"Đây là #EMP việc của Ta#! [ROOT.Char.Custom('GetCourt')], không phải của ngươi, [parent.Custom('MotherFather')].\""
 
  parent.1003.desc:0 "[parent.Custom('MotherFather')] của ta thường dành hàng giờ để chỉ ra những chi tiết nhỏ mà ta bỏ lỡ tại [ROOT.Char.Custom('GetCourt')] của mình.\n\nHai người hầu từng đánh nhau giờ lại ngồi tán gẫu, lính canh có vẻ im lặng hơn bình thường, một lò sưởi đã được chuyển sang phía bên kia của [ROOT.Char.Custom('ResidenceBuilding')]..."
  parent.1003.a:0 "Biết trước còn hơn hối hận vì không biết."
  parent.1003.b:0 "\"Ta sẽ không để ngươi làm Ta lo lắng, [parent.Custom('MotherFather')].\""

  parent.1004.desc:0 "Đôi khi ta nghĩ rằng [parent.Custom('MotherFather')] của ta có cái nhìn tổng quan về ngân khố tốt hơn cả quan quản lý tài chính của ta. Một đồng tiền vàng dường như có giá trị gấp đôi khi [parent.GetSheHe] bảo ta cách chi tiêu nó!"
  parent.1004.a:0 "\"Xin chỉ dẫn Ta cách chi tiêu khôn ngoan, [parent.Custom('MotherFather')].\""
  parent.1004.b:0 "Vương quốc của Ta, kho bạc của Ta!"
 
  parent.1005.desc:0 "Nhiều người đàn ông và phụ nữ thông thái làm rạng danh [ROOT.Char.Custom('GetCourt')] của ta, nhưng ta nghi ngờ rằng không một ai trong số họ có thể thắng [parent.Custom('MotherFather')] của ta trong các cuộc tranh luận. [parent.GetSheHe|U] luôn có một góc nhìn đáng kinh ngạc hoặc một tầng kiến thức khác để hé lộ!"
  parent.1005.a:0 "\"Chia sẻ trí tuệ của ngươi với Ta, [parent.Custom('MotherFather')]!\""
  parent.1005.b:0 "Lời nói có vẻ hay, nhưng liệu có thật sự thông thái?"

  parent.1006.t:0 "Bàn Tay Dẫn Lối"
  parent.1006.desc:0 "[parent.Custom('MotherFather')] của ta gần đây rất quan tâm đến các sự kiện diễn ra tại [county.GetNameNoTier].\n\n[parent.GetSheHe|U] thậm chí đã bắt đầu liên lạc với các nam tước và thị trưởng, hướng dẫn họ cách quản lý đúng đắn!"
  parent.1006.a:0 "Làm tốt lắm, [parent.Custom('MotherFather')]."
 
  parent.1007.t:0 "Hòa Giải [parent.Custom('MotherFather')|U]"
  parent.1007.desc_opening:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('courtier'))] của ta, [courtier.GetTitledFirstName], đã thể hiện rõ sự khinh miệt [courtier.GetHerHis] dành cho ta.\n\n"
  parent.1007.courtier_1:0 "Ta bắt gặp [courtier.GetHerHim] đang kể về một sai lầm mà Ta #EMP bị cho là# đã gây ra ở một sự kiện mà Ta thậm chí không tham dự!"
  parent.1007.courtier_2:0 "Ta gặp [courtier.GetHerHim] và một kẻ đi theo khác đi quanh [ROOT.Char.Custom('ResidenceBuilding')]. Khi [courtier.GetTitledFirstNameNoTooltip] thấy Ta, [courtier.GetSheHe] cố gắng tạm ngưng lời đồn cho tới khi Ta đi qua. Đây không phải lần đầu tiên bị sỉ nhục như vậy!"
  parent.1007.desc_end:0 "\n\nLuôn là một người hòa giải, [parent.Custom('MotherFather')] của ta đã đề nghị làm dịu bầu không khí giữa chúng ta."
  parent.1007.a:0 "Sự giúp đỡ của [parent.Custom('MotherFather')|U] luôn được hoan nghênh."
  parent.1007.b:0 "Ta sẽ tự mình kiểm soát những người này!"

  parent.1009.t:0 "Mối Quan Hệ Mới"
  parent.1009.desc:0 "Một trong những người quen cũ của [parent.Custom('MotherFather')], [new_courtier.GetTitledFirstName], đã đến [ROOT.Char.Custom('GetCourt')] của ta theo lời mời [parent.GetHerHis].\n\n[parent.Custom('MotherFather')] của ta không ngừng ám chỉ về ảnh hưởng tốt mà [new_courtier.GetFirstNameNoTooltip] có thể mang lại nếu [new_courtier.GetSheHe] được trao cho một chức vụ nào đó..."
  parent.1009.a:0 "Ta chắc chắn chúng ta có thể tìm việc gì đó cho [new_courtier.GetHerHim]."
  parent.1009.b:0 "Không, [new_courtier.GetSheHe] sẽ không có chỗ ở đây."

  parent.1010.t:0 "Quan Hệ Thư Giãn"
  parent.1010.desc:0 "Gần đây, gánh nặng của ta với tư cách là [ROOT.Char.GetTitleAsNameNoTooltip] trở nên gay gắt hơn bình thường, và [parent.Custom('MotherFather')] của ta dường như đã nhận ra điều đó.\n\n[parent.GetSheHe|U] khăng khăng bảo ta nghỉ ngơi một ngày, đảm bảo rằng [parent.GetSheHe] sẽ xử lý các trách nhiệm của ta trong thời gian này."
  parent.1010.a:0 "Một chút nghỉ ngơi chính là điều Ta cần."
  parent.1010.b:0 "Bây giờ không phải lúc để thư giãn!"

  parent.2002.t:0 "Một Nền Giáo Dục Vững Vàng"
  parent.2002.desc:0 "Sau nhiều ngày không thấy [child.GetTitledFirstName], ta sớm phát hiện ra rằng [parent.Custom('MotherFather')] hay can thiệp của ta biết chính xác [child.GetSheHe] đang ở đâu:\n"Ta chỉ gửi [child.GetHerHim] đi vì lo lắng cho việc học hành [child.GetHerHis]. Mọi thứ sẽ tốt hơn nhiều cho [child.GetHerHim] dưới sự chăm sóc của [new_guardian.GetTitledFirstNamePossessive].""
  parent.2002.a:0 "Ngươi đã gửi con [child.Custom('DaughterSon')] của Ta #EMP đến đâu#!?!"
  child_sent_away_tt:0 "[child.GetTitledFirstName] sẽ được [new_guardian.GetTitledFirstName] giáo dục"

  parent.2003.t:0 "[parent.Custom('MotherFather')|U] nhỏ nhen của ta"
  parent.2003.desc:0 "Ta cứ tưởng mối thù giữa [parent.Custom('MotherFather')] của ta và [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hated_courtier'))] [hated_courtier.GetTitledFirstName] của ta sẽ không bao giờ kết thúc.\n\nChà, bây giờ nó đã kết thúc rồi. [parent.Custom('MotherFather')] của ta đã trục xuất [hated_courtier.GetFirstNameNoTooltip] khỏi [ROOT.Char.Custom('GetRealmOrDomicile')|l] của ta!"
  parent.2003.a:0 "Ngươi dám làm vậy sao [parent.GetSheHe]?! Đây là #EMP lãnh thổ của Ta#! [ROOT.Char.Custom('GetRealmOrDomicile')|l]!"
  parent.2003.b:0 "Tốt thôi, khỏi phiền."
 
  parent.2004.t:0 "Một Phiền Phức Liên Tục"
  parent.2004.opening:0 "[parent.Custom('MotherFather')] của ta, [parent.GetFirstName], đã bắt đầu theo chân ta khắp mọi nơi, bày tỏ ý kiến [parent.GetHerHis] về mọi việc ta làm và cố gắng đưa ra lời hướng dẫn."
  parent.2004.malicious:0 "\n\n[parent.GetSheHe|U] trêu chọc Ta không thương tiếc, nói rằng cách hành xử nghiêm khắc là vì lợi ích của Ta, trong khi vẫn giấu nụ cười thoáng qua trên môi [parent.GetHerHis]."
  parent.2004.benevolent:0 "\n\n[parent.GetSheHe|U] giảng về đức hạnh, ngụ ý rằng Ta còn nhiều điều cần học."
  parent.2004.dominant:0 "\n\n[parent.GetSheHe|U] liên tục giảng dạy, không ngừng nghỉ, không để Ta thư giãn."
  parent.2004.submissive:0 "\n\n[parent.GetSheHe|U] đã trở thành cái bóng không rời của ta, giấu mọi nhận xét [parent.GetHerHis] đằng sau những gợi ý và ngụ ý."
  parent.2004.extroverted:0 "\n\n[parent.GetSheHe|U] còn hành xử như vậy trước [ROOT.Char.Custom('GetCourtierPlural')|l]. [parent.GetSheHe|U] thúc Ta tiếp xúc với họ, tạo ra những tình huống khó xử cho tất cả mọi người!"
  parent.2004.introverted:0 "\n\n[parent.GetSheHe|U] giảng về đức hạnh của sự tĩnh lặng, cố gắng tách Ta khỏi [ROOT.Char.Custom('GetCourtierPlural')|l]!"
  parent.2004.emotional:0 "\n\n[parent.GetSheHe|U] dễ nổi nóng, và [parent.GetSheHe] lợi dụng Ta sẽ lắng nghe để tránh gây ồn ào."
  parent.2004.levelheaded:0 "\n\n[parent.GetSheHe|U] muốn tranh luận mọi việc với Ta, nói rằng vội vàng là mất tất cả lợi thế. Những cuộc tranh luận dài ngốn quá nhiều thời gian và năng lượng."
  parent.2004.fallback:0 "\n\n[parent.GetSheHe|U] liên tục làm phiền Ta với các gợi ý, và [ROOT.Char.Custom('GetCourt')|l] bắt đầu bàn tán về người thực sự ra quyết định tại [ROOT.Char.Custom('ResidenceBuilding')]!"
  parent.2004.end:0 "Ta biết [parent.GetSheHe] làm vậy vì yêu thương, nhưng điều này thật vô lý."
  parent.2004.a:0 "Ta sẽ ra lệnh cho [parent.GetHerHim] dừng lại!"
  parent.2004.b:0 "[parent.GetSheHe|U] thật phiền phức, nhưng không thể phủ nhận là hữu ích..."
  parent.2004.b.message:0 "Ta ổn với hiện trạng"

  parent.3001.t:0 "Dưới Cánh Tay Ta"
  parent.3001.desc:0 "Gần đây ta nhận thấy [child.Custom('GetDaughterSon')] thân yêu [child.GetTitledFirstName] của ta dành rất nhiều thời gian với [parent.Custom('MotherFather')] của ta.\n\nDường như [parent.GetTitledFirstName] đã quan tâm cá nhân đến cuộc sống [child.GetFirstNamePossessiveNoTooltip] và dự định sẽ là một phần tích cực trong đó."
  parent.3001.a:0 "[parent.Custom('MotherFather')] của ta thực sự quan tâm đến [child.Custom('GetDaughterSon')] của ta!"
  parent.3001.b:0 "Sự quan tâm đột ngột của [parent.GetHerHis|U] đến [child.Custom('GetDaughterSon')] thật đáng lo ngại..."
  parent.3001.c:0 "[parent.Custom('MotherFather')] tinh ranh của ta sẽ không thoát khỏi chuyện này!"
