  bp2_yearly.7021.t: "$bp2_decision.0002.t$: $rites_of_passage_duel$"
  bp2_yearly.7021.desc: "Một [ROOT.Char.GetCulture.GetName] [teentribal.GetWomanMan] phải ghét sợ hãi, từ chối yếu đuối, và phải sẵn sàng chịu đau đớn trong đời.\n\n[teentribal.GetFirstName] trẻ tuổi đã giao đấu với các thiếu niên khác, nhưng chưa từng chịu thử thách từ một [ROOT.Char.GetCulture.GetNameNoTooltip] trưởng thành.\n\nNhiều chiến binh gan dạ trong bộ tộc, nhưng chỉ một người có thể thử thách giá trị của [ROOT.Char.Custom2('RelationToMePossessive',teentribal)]."
  bp2_yearly.7021.desc_root: "Một chiến binh được sinh ra từ đấu tranh, chào đời trong máu.\n\nTa đã giao đấu với các thiếu niên khác, nhưng chưa từng gặp đối thủ xứng đáng thực sự: một [ROOT.Char.GetCulture.GetName] trưởng thành.\n\nNhiều chiến binh gan dạ trong bộ tộc, nhưng chỉ một người có thể chứng minh sự sẵn sàng của ta."
  bp2_yearly.7021.a: "[teentribal.GetSheHe|U] đối mặt với [teentribal.GetHerHis] [teentribal.Custom2('RelationToMeShort', family_duelist)|l]!"
  bp2_yearly.7021.a_root: "[teentribal.Custom2('RelationToMeShort', family_duelist)|U], ta sẽ chứng minh bản thân trước ngươi!"
  bp2_yearly.7021.a.tt: "[teentribal.GetFirstName] thách đấu [teentribal.GetHerHis] [teentribal.Custom2('RelationToMeShort', family_duelist)|l] [family_duelist.GetFirstName] trong [single_combat_duel|E]"
  bp2_yearly.7021.b_root: "Ta thách đấu [ROOT.Char.Custom2('RelationToMeShort', duelist_1)], [duelist_1.GetFirstNameNoTooltip]!"
  bp2_yearly.7021.b: "[teentribal.GetSheHe|U] sẽ đấu với [teentribal.Custom2('RelationToMeShort', duelist_1)|l], [duelist_1.GetFirstNameNoTooltip]!"
  bp2_yearly.7021.b.tt: "[teentribal.GetFirstName] thách đấu [duelist_1.GetFirstName] trong [single_combat_duel|E]"
  bp2_yearly.7021.c: "[duelist_2.Custom('ComplimentAdjective')] [duelist_2.GetFirstNameNoTooltip] — ra đây!"
  bp2_yearly.7021.c_root: "Ta muốn đấu với [ROOT.Char.Custom2('RelationToMeShort', duelist_2)], [duelist_2.GetFirstNameNoTooltip]."
  bp2_yearly.7021.c.tt: "[teentribal.GetFirstName] thách đấu [duelist_2.GetFirstName] trong [single_combat_duel|E]"
  bp2_yearly.7021.d: "$bp2_decision.0002.f$"
  bp2_yearly.7021.d.tt: "$bp2_decision.0002.cooldown$"
  bp2_yearly.7022.t: "$bp2_decision.0002.t$: Trận $rites_of_passage_duel$ được chiến đấu"
  bp2_yearly.7022.desc_child_win: "Khi lời chúc phúc của [ROOT.Char.GetFaith.PriestNeuter] kết thúc, vũ khí của những người thách đấu va vào nhau. Kinh nghiệm của [sc_loser.GetFirstNamePossessive] cho phép người này giành lợi thế ngay lập tức — nhưng dù vậy, [sc_loser.GetSheHe] không thể gạt bỏ được những đòn tấn công thông minh của [sc_victor.GetFirstNamePossessive] lâu được.\n\n[ROOT.Char.Custom2('RelationToMe',teentribal)] của ta khiến [sc_loser.GetFirstNameNoTooltip] ngã nhào xuống.\n\n"Ta đầu hàng!" tên [sc_loser.GetWomanMan] lớn tuổi hơn rên rỉ. "[sc_victor.GetFirstNameNoTooltip] đã đập nát những đốt ngón tay và làm ta mù mắt bởi máu nóng: [sc_victor.GetSheHe] thực sự là một chiến binh toàn năng. Một [sc_victor.GetWomanMan] [ROOT.Char.GetCulture.GetName] xứng đáng nhất!"\n\nNghi lễ đã được hoàn tất."
  bp2_yearly.7022.desc_child_lost: "Những lễ vật vừa mới được rắc thì [sc_loser.GetFirstName] đã phát động một cuộc tấn công dữ dội! Dưới cơn mưa đòn đánh, kinh nghiệm của [sc_victor.GetFirstNamePossessive] đã phát huy tác dụng: [sc_victor.GetSheHe] chịu đựng được cơn bão đó. [ROOT.Char.Custom2('RelationToMe',teentribal)] trẻ tuổi của ta, sớm mệt mỏi, đã dành hết sức lực [sc_loser.GetHerHis] cho cuộc chiến... nhưng kết thúc nghi lễ này với thanh sắt kề ở cổ [sc_loser.GetHerHis].\n\nNhìn thấy ngọn lửa vẫn còn trong mắt đối thủ [sc_victor.GetHerHis], [sc_victor.GetFirstNameNoTooltip] tỏ ra tử tế.\n\n"Trước mặt ta là một [sc_loser.GetWomanMan] thực thụ! Sự đấu tranh, không phải chiến thắng, mới mang lại cho [sc_loser.GetHerHim] một vị trí trong số chúng ta. [sc_loser.GetFirstNameNoTooltip] đã cho thấy lòng dũng cảm của một chiến binh và phẩm giá [ROOT.Char.GetCulture.GetName] của người ấy.""
  bp2_yearly.7022.desc_root_win: "\"Đủ rồi!\" [sc_loser.GetFirstName] thở hổn hển, quăng [sc_loser.GetHerHis] [sc_loser.Custom('SignatureWeaponNameOrType')] xuống đất. \"Hãy thực hiện đòn chí mạng như một [ROOT.Char.GetWomanMan] đầy đủ vinh dự! Ta sẽ xấu hổ nếu chết trước một [teentribal.Custom('GirlBoy')].\"\n\n\"Nhưng — #EMP ta đang nói gì thế này?#! Ngươi đã chiến đấu như một [ROOT.Char.GetWomanMan] thực thụ. Như một [ROOT.Char.GetTitleAsName]: người sẽ biết sức mạnh, biết chiến thắng! Ta sẽ thay ngươi nói, và đảm bảo quyền lợi ngươi tăng lên.\"\n\nXong. Nhờ đức tính của [ROOT.Char.Custom('SignatureWeaponNameOrType')], ta được chứng minh."
  bp2_yearly.7022.desc_root_lost: "Dù không thể sánh với kinh nghiệm của [sc_victor.GetFirstName]... nghi lễ không thể kết thúc thế này! Ta vùng dậy, chuẩn bị, nhưng bị tước vũ khí. Ta truy theo nhưng đối thủ chặn đường. #EMP Không thể kết thúc thế này!#! \n\n[sc_victor.GetFirstNameNoTooltip] nhìn ta, đầy thích thú.\n\n\"Cầm lại, thanh niên [ROOT.Char.Custom('RegionalFerociousAnimal')]! Ta, [ROOT.Char.GetTitleAsName], công nhận ngươi có sự dữ dội của một [ROOT.Char.GetCulture.GetName] [ROOT.Char.Custom( 'KnightCultureNoTooltipLowercase' )]! Ngươi đã chiến đấu dũng cảm — thắng hay thua — ta tôn trọng ngươi như một thành viên bộ tộc.\"\n\n\"Kết quả này sẽ được chấp nhận.\""
  bp2_yearly.7022.toast: "Trận đấu định hình [teentribal.GetFirstNameNoTooltip]"
  bp2_yearly.7022.a: "Đó là quyết tâm của [teentribal.GetHouse.GetBaseNameNoTooltip]!"
  bp2_yearly.7022.a_victory: "Chiến thắng đem lại tự tin trong kỹ năng chiến binh và chính bản thân."
  bp2_yearly.7022.a_loss: "[teentribal.GetFirstNameNoTooltip] sẽ không bao giờ quên sự thất bại này... và [teentribal.GetSheHe] sẽ học được rằng sự kiên trì [teentribal.GetHerHis] của người ấy có những công dụng khác ngoài chiến trường."
  bp2_yearly.7022.b: "Bộ tộc sẽ có nhà vô địch mới."
  bp2_yearly.7022.b_victory: "Vẫn còn nhiều điều để học, nhưng đây là khởi đầu tốt!"
  bp2_yearly.7022.b_loss: "[teentribal.GetFirstNameNoTooltip] phải tận tụy luyện tập, cho các trận đấu tốt hơn trong tương lai!"
  bp2_yearly.7022.c: "Một trận chiến đẫm máu! Một #EMP trận chiến rất#! đẫm máu..."
  bp2_yearly.7022.c_victory: "Một niềm vui kỳ lạ xuất hiện, một hưng phấn độc ác thức dậy... cùng với dòng máu chảy."
  bp2_yearly.7022.c_loss: "Ta thấy một nguồn dự trữ, không phải một chiến binh... nếu [teentribal.GetFirstNameNoTooltip] muốn sống lâu."
  bp2_yearly.7023.t: "$bp2_decision.0002.t$: $rites_of_passage_scarification$"
  bp2_yearly.7023.desc: "Những [ROOT.Char.GetCulture.GetCollectiveNoun] trong bộ tộc Ta tụ họp để chứng kiến nghi lễ khắc da. Khói thảo mộc linh thiêng dày đặc trong không khí, [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] [priest.GetFirstName] bắt đầu buổi lễ. Những người có mặt im lặng.\n\n[priest.GetSheHe|U] rút lưỡi dao nghi lễ.\n\n\"Ở đây, [teentribal.GetFirstName] của [teentribal.GetHouse.GetName],\" thốt lên [priest.GetWomanMan] thánh thiện, \"sẽ được đánh dấu và khắc, chịu đau đớn. Khi chúng ta nhìn thấy [teentribal.GetHerHim] trong những ngày tới, chúng ta sẽ thấy sự kiên định — chúng ta sẽ thấy [teentribal.GetSheHe] là một [teentribal.GetWomanMan]!\""
  bp2_yearly.7023.a: "Mang dấu ấn là hiểu được niềm tự hào."
  bp2_yearly.7023.a.tt: "[priest.GetFirstNameNoTooltip] khắc mạnh mẽ, liên tiếp."
  bp2_yearly.7023.a_nothing: "Các vết cắt sạch sẽ"
  bp2_yearly.7023.a_scarred: "Các vết cắt để lại dấu vĩnh viễn"
  bp2_yearly.7023.a_wounded: "Các vết cắt sâu kinh khủng"
  bp2_yearly.7023.b: "Có lẽ chỉ… tượng trưng thôi?"
  bp2_yearly.7023.b.tt: "[priest.GetFirstNameNoTooltip] nhẹ nhàng với lưỡi dao, chỉ tạo một ấn tượng nhỏ."
  bp2_yearly.7023.c: "$bp2_decision.0002.f$"
  bp2_yearly.7023.c.tt: "$bp2_decision.0002.cooldown$"
  bp2_yearly.7024.t: "$bp2_decision.0002.t$: $rites_of_passage_seclusion$"
  bp2_yearly.7024.desc: "\"Ẩn cư nuôi dưỡng thân xác, tinh thần,\" [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] [priest.GetFirstName] nhấn mạnh. \"Trong yên tĩnh, trí tuệ! Trong sinh tồn, mưu lược. Chọn nơi hòa hợp… nhưng hoang dã, khắc nghiệt.\"\n\n[priest.GetSheHe|U] trao một ít lương thực."
  bp2_yearly.7024.desc_capital: "\"Một [teentribal.Custom('GirlBoy')] an toàn ở nhà, trên [rite_location.GetName]'s [rite_location.GetTerrain.GetNameNoTooltip|l]."
  bp2_yearly.7024.desc_abroad: "Để thử thách thực sự, hãy xem [abroad_location.GetTerrain.GetNameNoTooltip|l] xa lạ của [abroad_location.GetName]!"
  bp2_yearly.7024.desc_realm: "Hoặc người thực hiện nghi lễ có thể đi ngắn: đến [realm_location.GetName], có lẽ?"
  bp2_yearly.7024.desc_end: "Giờ, trẻ ơi, đi — với sự khôn ngoan của [priest.GetFaith.KnowledgeGodName]."
  bp2_yearly.7024.a: "Lên đường, đến vùng đất xa xôi!"
  bp2_yearly.7024.a.tt: "#N Rủi ro cao#!"
  bp2_yearly.7024.a.abroad: "[teentribal.GetFirstName] sẽ đi tới [abroad_location.GetTerrain.GetNameNoTooltip|l] của [abroad_location.GetName], trong lãnh thổ của [foreign_ruler.GetName]"
  bp2_yearly.7024.win: "Tránh được mọi nguy hiểm"
  bp2_yearly.7024.lose: "Bị vướng vào nguy hiểm"
  bp2_yearly.7024.b: "Chuyến đi không cần quá dài."
  bp2_yearly.7024.b.tt: "#Z Rủi ro trung bình#!"
  bp2_yearly.7024.b.realm: "[teentribal.GetFirstName] sẽ đi tới [realm_location.GetTerrain.GetNameNoTooltip|l] của [realm_location.GetName]"
  bp2_yearly.7024.c: "Vùng hoang dã gần nhà cũng đủ."
  bp2_yearly.7024.c.tt: "#P Rủi ro thấp#!"
  bp2_yearly.7024.c.capital: "[teentribal.GetFirstName] sẽ ẩn cư tại [rite_location.GetTerrain.GetNameNoTooltip|l] của [rite_location.GetName], thủ đô [realm_capital|E]"
  bp2_yearly.7024.d: "$bp2_decision.0002.f$"
  bp2_yearly.7024.d.tt: "$bp2_decision.0002.cooldown$"
  bp2_yearly.7025.t: "$bp2_decision.0002.t$: $rites_of_passage_seclusion$"
  bp2_yearly.7025.desc: "— một [teentribal.MakeScope.Var('animal_type').GetFlagName] đói khát len vào trại nhỏ của Ta!\n\nTa không thể chạy nhanh hơn sinh vật tuyệt vọng này. Con thú phải bị đánh bại hoặc lừa được. Ta có một con thỏ vừa giết gần đó…"
  bp2_yearly.7025.desc_realm: "Ta nhanh chóng tới [realm_location.GetTerrain.GetNameNoTooltip|l] gần đó của [realm_location.GetName] và ngay lập tức chuẩn bị cho đêm. Khi Ta đang nhóm lửa nấu bữa tối $bp2_yearly.7025.desc$"
  bp2_yearly.7025.desc_abroad: "Bình minh ló rạng trên [seclusion_location.GetName]. [realm_location.GetTerrain.GetNameNoTooltip|l] xa lạ, không có [seclusion_location.GetCounty.GetCulture.GetCollectiveNoun] bản địa, đáng sợ vào ban đêm và đẹp rực rỡ khi bình minh.\n\nLửa trại Ta nhóm dở và Ta không đơn độc ở đây $bp2_yearly.7025.desc$"
  bp2_yearly.7025.desc_capital: "Ta nhanh chóng tìm được vị trí tốt cho trại, ngay ngoài [rite_location.GetName], lập tức nhóm lửa để chuẩn bị cho đêm và ăn một chút gì ấm áp. $bp2_yearly.7025.desc$"
  bp2_yearly.7025.desc_fight: "có lẽ, ném nó ra, Ta có thể giành thời gian lấy cung?"
  bp2_yearly.7025.desc_outwit: "có lẽ Ta có thể rút lui một cách tinh tế trong khi con [teentribal.MakeScope.Var('animal_type').GetFlagName] no bụng?"
  bp2_yearly.7025.a: "Ta sẽ lén lút rút lui và trốn."
  bp2_yearly.7025.a_win: "Ngài lặng lẽ tránh khỏi con thú phân tâm"
  bp2_yearly.7025.a_lose: "Con [teentribal.MakeScope.Var('animal_type').GetFlagName], bị kích động, tấn công Ngài"
  bp2_yearly.7025.tt: "Một [teentribal.MakeScope.Var('animal_type').GetFlagName] tấn công trong khi ẩn cư"
  bp2_yearly.7025.b: "Với những mũi tên bén, Ta sẽ xua đuổi [teentribal.MakeScope.Var('animal_type').GetFlagName]!"
  bp2_yearly.7025.b_win: "Con [teentribal.MakeScope.Var('animal_type').GetFlagName] bỏ chạy, bị mũi tên làm đau"
  bp2_yearly.7025.b_lose: "Con [teentribal.MakeScope.Var('animal_type').GetFlagName] không bị thương tấn công"
  bp2_yearly.7026.t: "$bp2_decision.0002.t$: $rites_of_passage_shaving$"
  bp2_yearly.7026.desc: "Thắt những bím tóc xinh đẹp và vuốt ve những lọn tóc mượt mà trong lòng biết ơn, bộ tộc tập hợp lại cho nghi lễ cắt tóc.\n\n[ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] [priest.GetFirstName] của ta nắm lấy mái tóc của [teentribal.GetFirstNamePossessive] và cầm một con dao có khắc chữ.\n\n"[teentribal.Custom('GirlBoy')] này phải từ bỏ tuổi thơ vì tương lai của bộ tộc! [teentribal.GetSheHe|U] sẽ mất đi tất cả những gì tồn tại vì sự phù phiếm, để lộ ra bản chất thật [teentribal.GetHerHis], sức mạnh tinh thần [teentribal.GetHerHis] của người ấy!"\n\nNhà hiền triết nhìn về phía ta một cách thận trọng.\n\n"...nếu [ROOT.Char.GetTitleAsName] của chúng ta muốn thế.""
  bp2_yearly.7026.desc_child: "Thắt những bím tóc xinh đẹp và vuốt ve những lọn tóc mượt mà trong lòng biết ơn, bộ tộc tập hợp lại cho nghi lễ cắt tóc.\n\n[ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] của ta là [priest.GetFirstName] nắm lấy mái tóc của ta và cầm một con dao có khắc chữ.\n\n"[ROOT.Char.GetTitleAsName] của chúng ta phải từ bỏ tuổi thơ vì tương lai của bộ tộc! [teentribal.GetSheHe|U] sẽ mất đi tất cả những gì tồn tại vì sự phù phiếm, để lộ ra bản chất thật [teentribal.GetHerHis], sức mạnh tinh thần [teentribal.GetHerHis] của người ấy!"\n\nNhà hiền triết nhìn về phía ta một cách thận trọng.\n\n"...nếu [ROOT.Char.GetTitleAsNameNoTooltip] của chúng ta muốn thế.""
  bp2_yearly.7026.a: "Tận hiến tuyệt đối: cạo đầu toàn bộ, tàn nhẫn."
  bp2_yearly.7026.a.tt: "[ROOT.Char.Custom2('RelationToMeShort',priest)] kéo lưỡi dao [priest.GetHerHis] khắp đầu, với lực thích hợp."
  bp2_yearly.7026.a.toast: "Nghi lễ cạo đầu hoàn tất."
  bp2_yearly.7026.b: "Chỉ cắt một lọn tóc, giữ mãi!"
  bp2_yearly.7026.b.tt: "Một chút tóc được cắt và đặt trong hộp kỷ niệm, biểu tượng của nghĩa vụ."
  bp2_yearly.7026.b.toast: "Cắt tóc hoàn tất"
  bp2_yearly.7026.c: "$bp2_decision.0002.f$"
  bp2_yearly.7026.c.tt: "$bp2_decision.0002.cooldown$"
  bp2_yearly.7027.t: "$bp2_decision.0002.t$: Nghi lễ Thanh tẩy"
  bp2_yearly.7027.desc: "Bộ tộc tập trung trang nghiêm bên bờ nước, khi thánh [priest.GetFirstName] giơ cao chén nghi lễ.\n\n\"Từ vài giọt nhỏ đã sinh ra biển! Từ [teentribal.Custom('GirlBoy')], xuất hiện [teentribal.GetWomanMan]! Mọi việc bắt đầu từ đây.\" [priest.GetSheHe|U] rót nước linh thiêng lên tóc và da.\n\n\"Nhân danh [priest.GetFaith.WaterGodName]: để nước thanh tẩy ngươi, cuốn đi tuổi thơ và để lại trí tuệ trưởng thành.\""
  bp2_yearly.7027.a: "Gần chết đuối mới hiểu được nước!"
  bp2_yearly.7027.a.tt: "Nhảy xuống nước linh thiêng... gần như nguy hiểm tới tính mạng."
  bp2_yearly.7027.b: "Nghi lễ chỉ cần... tắm nhẹ."
  bp2_yearly.7027.b.tt: "Ngâm nhanh: biểu tượng là thượng đế của thế giới thức."
  bp2_yearly.7027.c: "$bp2_decision.0002.f$"
  bp2_yearly.7027.c.tt: "$bp2_decision.0002.cooldown$"
  bp2_yearly.7027.tt: "Nghi lễ $cleansing_type_element$ hoàn tất"
  bp2_yearly.7028.t: "$bp2_decision.0002.t$: Nghi lễ Thanh tẩy"
  bp2_yearly.7028.desc: "Ngọn lửa lớn chiếu sáng khuôn mặt nghiêm nghị của bộ tộc. [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] [priest.GetFirstName], dùng mũi giáo, phá đống lửa và rải than đỏ thành con đường sáng.\n\nHít thở — hãy thở đều, Ta cầu xin.\n\n\"Thanh niên này đã sẵn sàng gia nhập hàng ngũ chăng?!\" [priest.GetFirstNameNoTooltip] gọi. \"[priest.GetFaith.WarGodName] sẽ phán xét, khi [teentribal.GetFirstName] bước qua thử thách lửa! Đi đi, trẻ ơi: thiêu đi những gì không xứng đáng, và con sẽ đặt chân lên đất lạnh như một [ROOT.Char.GetCulture.GetName] [teentribal.GetWomanMan]!\""
  bp2_yearly.7028.a: "[priest.GetFaith.WarGodName|U] đưa người tin qua!"
  bp2_yearly.7028.a.tt: "Bước đi cẩn trọng, tỉ mỉ trong suốt hành trình qua lửa."
  bp2_yearly.7028.b: "Nhanh lên! Chạy qua."
  bp2_yearly.7028.b.tt: "Thử thách lửa được tôn trọng, nhưng bước chạy nhanh như gió."
  bp2_yearly.7028.c: "$bp2_decision.0002.f$"
  bp2_yearly.7028.c.tt: "$bp2_decision.0002.cooldown$"
  bp2_yearly.7028.tt: "$bp2_yearly.7027.tt$"
  bp2_yearly.7029.t: "Nghi lễ Khai trưởng: Nỗi sợ quen thuộc"
  bp2_yearly.7029.desc: "Là [ROOT.Char.GetTitleAsName], Ta cho phép những thanh thiếu niên sắp thực hiện nghi lễ khai trưởng. Một số hứa hẹn táo bạo, những lời thề mà ít [ROOT.Char.GetCulture.GetCollectiveNoun] nào có thể giữ. Những người khác, như [ROOT.Char.Custom2('RelationToMeShort', teentribal)] [teentribal.GetFirstName], run rẩy.\n\nHôm nay, thử thách được chọn giống hệt như Ta từng trải qua:"
  bp2_yearly.7029.desc_duel: "Kỹ năng chiến đấu của [teentribal.GetFirstNamePossessiveNoTooltip] sẽ chứng minh giá trị của [teentribal.GetHerHis]. Nhưng Ta nhận thấy... [teentribal.GetSheHe] không mang kiếm.\n\n\"Đối thủ được nêu như một ngọn núi!\" [teentribal.GetSheHe] than thở. \"Làm sao Ta có thể thắng, trừ khi dùng mưu mẹo bẩn thỉu?\""
  bp2_yearly.7029.desc_scarification: "Khuôn mặt của [teentribal.GetFirstNamePossessiveNoTooltip] sẽ bị khắc, đánh dấu [teentribal.GetHerHim] mãi mãi là một trong chúng ta. [teentribal.GetSheHe|U] co rúm lại chỉ nghĩ tới lưỡi dao.\n\n\"Ta sợ mất một mắt!\" [teentribal.GetSheHe] than thở. \"Làm sao Ta có thể chuẩn bị cho điều kinh khủng thế này?\""
  bp2_yearly.7029.desc_seclusion: "[teentribal.GetFirstNameNoTooltip] sẵn sàng cho con đường ẩn cư, nhưng chưa thực sự tốt. [teentribal.GetSheHe|U] nán lại trong vòng tay, mắt còn đẫm sương.\n\n\"Đó có phải điềm xấu không?\" [teentribal.GetSheHe] hỏi. \"Không? Nhưng… thời tiết tệ quá. Chắc chẳng ai đi trong thời tiết thế này đâu?\""
  bp2_yearly.7029.desc_hair_shaving: "Tóc của [teentribal.GetFirstNamePossessiveNoTooltip] sẽ bị cạo. [teentribal.GetSheHe|U] nắm chặt từng nắm tóc trong nỗi kinh sợ.\n\n\"Người ta nói tóc Ta là đẹp nhất bộ tộc!\" [teentribal.GetSheHe] phản đối. \"Chẳng lẽ chúng ta không thể chỉ cạo lông của vật hiến tế?!\""
  bp2_yearly.7029.desc_fire_cleanse: "Đôi chân của [teentribal.GetFirstNamePossessiveNoTooltip] trần trụi, để chúng có thể biết được cái lạnh trước khi bước qua lửa. [teentribal.GetSheHe|U] nhìn chằm chằm vào một chiếc đèn bấc nhỏ một cách đầy nghi ngờ.\n\n"Liệu thực sự có sự thật nào trong lửa không?" [teentribal.GetSheHe] rên rỉ. "Nếu các người chỉ muốn thấy sự đau đớn từ ta, ta cho các người thỏa mãn...""
  bp2_yearly.7029.desc_water_cleanse: "[teentribal.GetFirstNameNoTooltip] sẽ được trao cho nước. [teentribal.GetSheHe|U] dường như không hề háo hức khi bị nhấn chìm.\n\n\"Có lẽ Ta sẽ ra lệnh cho một sinh vật sâu xuống đến nuốt chửng Ta,\" [teentribal.GetSheHe] càu nhàu. \"[ROOT.Char.GetFaith.PriestNeuter] cũng thèm giết Ta y hệt…\""
  bp2_yearly.7029.a: "Câu chuyện về nghi lễ của Ta sẽ truyền cảm hứng cho [teentribal.GetHerHim]!"
  bp2_yearly.7029.a.tt: "Với lời của Ngài vang vọng trong tai [teentribal.GetHerHis], [teentribal.GetFirstNameNoTooltip] đối mặt thử thách với niềm tin vững vàng."
  bp2_yearly.7029.a.teaching: "[teentribal.GetFirstNameNoTooltip] học hỏi nhiều từ Ngài"
  bp2_yearly.7029.a.inspiration: "Câu chuyện của Ngài thật sự truyền cảm hứng"
  bp2_yearly.7029.b: "[teentribal.GetSheHe|U] phải tự chịu đựng những sai lầm [teentribal.GetHerHis] của chính mình."
  bp2_yearly.7029.b.success: "[teentribal.GetFirstName] học cách tự lập"
  bp2_yearly.7029.b.fail: "[teentribal.GetFirstName] thực hiện nghi lễ kém"
  bp2_yearly.7029.b.tt: "[teentribal.GetFirstNameNoTooltip] tự mình đấu tranh, đạt được sức mạnh của một người trưởng thành hoặc chịu lấy sự hổ thẹn của kẻ thất bại."
