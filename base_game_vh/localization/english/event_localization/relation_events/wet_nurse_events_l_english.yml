  backdown_from_rite_modifier: "Thiếu niên bộ tộc bất an"
  backdown_from_rite_modifier_desc: "Nhân vật này thực hiện kém nghi lễ khai trưởng; bị ám ảnh bởi cảm giác thiếu giá trị."
  proven_adult_modifier: "Người lớn bộ tộc chứng nhận"
  proven_adult_modifier_desc: "Nhân vật này đã vượt qua $bp2_decision.0002.t$ và được coi là thành viên trưởng thành được kính trọng của bộ tộc."
  child_like_parent_modifier: "Không khác xa cha/mẹ"
  child_like_parent_modifier_desc: "Ngài trở nên giống cha/mẹ đáng sợ hơn, tập trung vào bản thân."
