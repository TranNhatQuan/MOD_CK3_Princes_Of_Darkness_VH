l_english:
  bp2_decision.0001.t: "$find_wet_nurse_decision$"
  bp2_decision.0001.desc: "Với ý định chăm sóc tốt nhất cho [ROOT.Char.Custom('GetChildChildren')]$bp2_decision.0001.desc_candidates$"
  bp2_decision.0001.desc_widower: "Vì nuôi dưỡng một đứa trẻ có địa vị không hề là nhiệm vụ đơn độc$bp2_decision.0001.desc_candidates$"
  bp2_decision.0001.desc_candidates: ", Ta đã nhờ các chức năng viên tìm kiếm những phụ nữ có khả năng cho vai trò [GetCourtPositionType('wet_nurse_court_position').GetName()].\n\nGiờ đây, họ trình bày vài người địa phương để Ta đánh giá."
  bp2_decision.0001.a: "Ta thích [wet_nurse_candidate_1.GetFirstNameNoTooltip] có kinh nghiệm hơn."
  bp2_decision.0001.a.aptitude: "[wet_nurse_candidate_1.GetUINamePossessive] [aptitude|E] là [wet_nurse_candidate_1.GetCourtPositionAptitude( GetCourtPositionType( 'wet_nurse_court_position' ) )]"
  bp2_decision.0001.b: "[wet_nurse_candidate_2.GetFirstNameNoTooltip] cũng đủ tốt."
  bp2_decision.0001.b.aptitude: "[wet_nurse_candidate_2.GetUINamePossessive] [aptitude|E] là [wet_nurse_candidate_2.GetCourtPositionAptitude( GetCourtPositionType( 'wet_nurse_court_position' ) )]"
  bp2_decision.0001.c: "Ta không thích ai cả."
  bp2_yearly.7000.t: "Xin Nghỉ Ốm"
  bp2_yearly.7000.desc: "Vú nuôi, [wet_nurse.GetFirstName], đã yêu cầu một buổi yết kiến ngay lập tức với ta.\n\n"Thưa [wet_nurse.Custom2('RelationToMe', ROOT.Char)] thân mến của thần, thần đã đổ bệnh! Thần cần xin nghỉ vài ngày — những uế khí của thần có thể lây sang những đứa trẻ đang được thần chăm sóc."\n\n[wet_nurse.GetSheHe|U] rên rỉ điều này với một sự khẩn thiết đầy ốm yếu."
  bp2_yearly.7000.desc_child_liege: "Vú nuôi của ta, [wet_nurse.GetFirstName], dạo này không được khỏe lắm. [wet_nurse.GetSheHe|U] đã nhận thấy sự lo lắng của ta.\n\n"Thưa [wet_nurse.Custom2('RelationToMe', ROOT.Char)] [nursed_child.GetFirstName] bé bỏng thân mến, dù rất nặng lòng, thần vẫn cần phải nói với ngài... một căn bệnh khó chịu nào đó đã ập đến với thần. Thần phải rời đi một thời gian, nhưng ngài đừng lo lắng quá nhé! Thần sẽ sớm quay lại với ngài thôi.""
  bp2_yearly.7000.a: "Đừng lo, ta sẽ chăm sóc ngươi."
  bp2_yearly.7000.a.tt: "Ngươi chi trả cho việc khám bệnh"
  bp2_yearly.7000.b: "Hãy biến nó thành nghỉ phép vĩnh viễn."
  bp2_yearly.7000.b.tt: "Sự chăm sóc của [wet_nurse.GetFirstNamePossessiveNoTooltip] bị thiếu"
  bp2_yearly.7000.c: "Bệnh ư? Tránh xa con của ta!"
  bp2_yearly.7000.c_child_liege: "Bệnh ư? Tốt hơn là tránh xa ta!"
  bp2_yearly.7000.ill: "[nursed_child.GetFirstNameNoTooltip] nhiễm bệnh"
  bp2_yearly.7000.healthy: "[nursed_child.GetFirstNameNoTooltip] tránh được bệnh"
  bp2_yearly.7000.healthy.tt: "[nursed_child.GetShortUIName] vẫn khỏe mạnh"
  bp2_yearly.7001.t: "Nuôi Dưỡng Sự Nghi Ngờ"
  bp2_yearly.7001.desc: "[wet_nurse.GetFirstName] là một người vú nuôi tuyệt vời cho con Ta, một người chăm sóc đáng trân trọng. Tuy nhiên, gần đây, [ROOT.Char.Custom2('RelationToMe', jealous_spouse)] [jealous_spouse.GetFirstName] tỏ ra khá nghi ngờ [wet_nurse.GetHerHim].\n\n\"[jealous_spouse.Custom2('RelationToMe', ROOT.Char)], thật ngạc nhiên khi sự quan tâm của ngươi tới con cái đã nảy nở kể từ khi chúng ta thuê cô ta, [wet_nurse.GetFirstNameNoTooltip]! Có phải [wet_nurse.GetHerHis] #EMP hào phóng#! đã truyền cảm hứng cho ngươi không?\""
  bp2_yearly.7001.desc_lover: "Có vẻ… ta đã không cẩn thận."
  bp2_yearly.7001.desc_no_lover: "[jealous_spouse.GetFirstNameNoTooltip] đang tấn công ta vô cớ! Phải không…?"
  bp2_yearly.7001.a: "Ngươi muốn ta bỏ qua con cái sao?!"
  bp2_yearly.7001.a.tt: "Tùy chọn này khả dụng vì ngươi có một [lover|E]"
  bp2_yearly.7001.b: "Ngớ ngẩn, người yêu à: ngươi biết ta luôn trung thành!"
  bp2_yearly.7001.b.spouse_convinced: "Ngươi thuyết phục được [jealous_spouse.GetFirstNameNoTooltip]"
  bp2_yearly.7001.b.spouse_not_convinced: "[jealous_spouse.GetFirstNameNoTooltip] không tin ngươi"
  bp2_yearly.7001.c: "Ta sẽ xua tan nỗi lo của ngươi."
  bp2_yearly.7001.tt: "Ngươi là kẻ nói dối đã được biết đến"
  bp2_yearly.7002.t: "Hôn Nhân Nuôi Sữa"
  bp2_yearly.7002.desc: "[court_chaplain.GetFirstName] xông vào [ROOT.Char.Custom('GetChamber')] của ta, vẻ mặt đầy lo lắng [court_chaplain.GetHerHis].\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], xin ngài thứ lỗi vì sự xâm phạm, thần có việc khẩn cấp! Thần biết được rằng ngài và [spouse.GetFirstName] đã chung vú nuôi khi còn nhỏ. Điều này khiến cuộc hôn nhân của hai người cực kỳ không phù hợp; hai người là anh chị em cùng dòng sữa — trong mắt [ROOT.Char.GetFaith.HighGodNamePossessive], hai người là những người thân cận nhất!"\n\nMột tiết lộ gây sốc! [court_chaplain.GetFirstNameNoTooltip] tiếp tục trước khi ta kịp phản bác.\n\n"Thần khuyên ngài nên ly hôn ngay lập tức. Nếu không, thần buộc phải tuyên bố cuộc hôn nhân của ngài là loạn luân.""
  bp2_yearly.7002.a: "Loạn luân ư? Ta chỉ gọi đó là tình yêu!"
  bp2_yearly.7002.b: "Chúng ta sẽ ly hôn ngay."
  bp2_yearly.7002.c: "Có lẽ chúng ta nên quên chuyện này...?"
  bp2_yearly.parental_neglect_effect: "[nursed_child.GetFirstNameNoTooltip] tức giận"
  bp2_yearly.7003.title: "[nursed_child.GetFirstNamePossessiveNoTooltip] Đầu Tiên"
  bp2_yearly.7003.t: "$bp2_yearly.7003.title$ Lời"
  bp2_yearly.7003.desc: "\"Nhanh lên, bệ hạ, ngươi phải nghe này!\"\n\nNgười vú nuôi, [wet_nurse.GetFirstName], dẫn Ta vào [ROOT.Char.Custom2('RelationToMePossessive', nursed_child)] [ROOT.Char.Custom('GetChamber')]. [wet_nurse.GetFirstNameNoTooltip] chỉ vào [nursed_child.GetFirstName] đầy hào hứng, Ta nghiêng người về phía [nursed_child.GetHerHim] và lắng nghe."
  bp2_yearly.7003.desc_gold: "[nursed_child.GetFirstNameNoTooltip] đưa cho Ta một đồng xu nhầy nước bọt và nói:\n\n\"G-gh, g-g-old...\""
  bp2_yearly.7003.desc_secret: "Đặt ngón tay lên đôi môi nhỏ xíu của [nursed_child.GetHerHis], [nursed_child.GetFirstNameNoTooltip] thì thầm với Ta:\n\n\"Bí mật.\""
  bp2_yearly.7003.desc_motto: "\"[nursed_child.GetHouse.GetMotto].\"\n\nKhông thể tin được: phương châm nhà [nursed_child.GetHouse.GetName]! [nursed_child.GetSheHe|U] lẩm bẩm không vấp váp!"
  bp2_yearly.7003.desc_house: "\"[nursed_child.GetHouse.GetNameNoTooltip].\"\n\nTuyệt vời! [nursed_child.GetFirstNameNoTooltip] đã học được tên nhà chúng ta."
  bp2_yearly.7003.desc_military: "\"Guh-bah-nuh... [nursed_child.Custom( 'KnightCultureNoTooltipLowercase' )]!\"\n\nCó vẻ [nursed_child.GetFirstNameNoTooltip] đã có tinh thần chiến binh!"
  bp2_yearly.7003.desc_faith: "\"[nursed_child.GetFaith.random_GoodGodNames].\"\n\nCó vẻ [nursed_child.GetFirstNameNoTooltip] đã là tín đồ!"
  bp2_yearly.7003.desc_father: "\"Pa-, pa-...\""
  bp2_yearly.7003.desc_mother: "\"Ma-, ma-...\""
  bp2_yearly.7003.a: "Thật thú vị!"
  bp2_yearly.7003.b: "Còn gì khác mà [nursed_child.GetSheHe] có thể nói chứ?"
  bp2_yearly.7003.b.tt: "Ngươi thúc ép [nursed_child.GetFirstNameNoTooltip] nói tiếp."
  bp2_yearly.7003.c: "Ta không có thời gian cho chuyện này."
  bp2_yearly.7004.t: "$bp2_yearly.7003.title$ Những Bước Chân"
  bp2_yearly.7004.desc: "Ta nghe thấy một sự náo động từ các căn phòng của [nursed_child.GetFirstNamePossessive] [ROOT.Char.Custom2('RelationToMeShort', nursed_child)]. Vội vã bước vào, ta thấy vú nuôi, [wet_nurse.GetFirstName], đang chơi đùa với [nursed_child.GetFirstName].\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], thời điểm thật hoàn hảo! [nursed_child.GetFirstNameNoTooltip] vừa thực hiện bước đi đầu tiên [nursed_child.GetHerHis]!" [wet_nurse.GetSheHe] hét lên đầy phấn khích.\n\nNắm lấy đôi bàn tay của [nursed_child.Custom('GirlBoy')] của ta, bà ta cố gắng dắt [nursed_child.GetHerHim] đi quanh phòng."
  bp2_yearly.7004.a: "\"Một bước khổng lồ cho một đứa trẻ. Một bước nhỏ cho một vị quân vương.\""
  bp2_yearly.7004.b: "Còn gì khác mà [nursed_child.GetSheHe] có thể làm?"
  bp2_yearly.7004.b.tt: "Ngươi thúc ép [nursed_child.GetFirstNameNoTooltip] đi tiếp."
  bp2_yearly.7004.c: "$bp2_yearly.7003.c$"
  bp2_yearly.7005.t: "$bp2_yearly.7003.title$ Mọc Răng"
  bp2_yearly.7005.desc: "Với sự cho phép của ta, [nursed_child.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', nursed_child)] của ta cùng vú nuôi đi vào [ROOT.Char.Custom('GetChamber')] của ta. [wet_nurse.GetFirstName] tạo dáng như một sứ giả và tuyên bố:\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ngài được chứng kiến một dịp trọng đại! [nursed_child.GetFirstNameNoTooltip] có một món quà quý giá để dâng lên ngài." [wet_nurse.GetSheHe|U] thúc [nursed_child.GetHerHim] tiến lên. "Tiếp tục đi, [nursed_child.GetFirstNameNoTooltip], nói với ngài ấy đi!"\n\n"[ROOT.Char.Custom2('RelationToMeShort', ROOT.Char)|U], con bị rụng một chiếc răng!" [nursed_child.Custom2('RelationToMeShort', nursed_child)] của ta tự hào khoe nụ cười không còn răng của mình, trao cho ta một chiếc túi bên trong chứa chiếc răng đã rụng."
  bp2_yearly.7005.a: "Tuyệt vời! Nhưng giữ chiếc răng như một bùa may mắn."
  bp2_yearly.7005.b: "Này: một món quà xứng với món quà!"
  bp2_yearly.7005.b.tt: "Ngươi nhận được một chiếc răng"
  bp2_yearly.7005.c: "$bp2_yearly.7003.c$"
  child_teeth_memorabilia: "Răng Sữa của [nursed_child.GetNamePossessiveNoTooltip]"
  child_teeth_memorabilia_desc: "Chiếc răng sữa đầu tiên rụng của [nursed_child.GetNamePossessiveNoTooltip]."
  bp2_yearly.7006.t: "$bp2_yearly.7003.title$ Mặc Quần Áo"
  bp2_yearly.7006.desc: "Khi ta đang kiên nhẫn chờ người lấy quần áo, một người hầu nói lắp bắp: "[ROOT.Char.Custom('FormOfAddressForLiege')|U], ờ... không ai tìm thấy y phục của ngài cả!"\n\n"Ta bị bao quanh bởi những kẻ bất tài!" ta lầm bầm, xông ra khỏi [ROOT.Char.Custom('GetChamber')] của mình.\n\nChính trong [ROOT.Char.Custom('GetRoom')] của [nursed_child.GetFirstNamePossessive] [ROOT.Char.Custom2('RelationToMeShort', nursed_child)], ta không chỉ phát hiện ra y phục của mình mà còn thấy cả vú nuôi của [nursed_child.Custom('GirlBoyPossessive')].\n\n"Thần không liên quan gì đến chuyện đó, thưa lãnh chúa — [nursed_child.GetSheHe] tự mặc lấy!" [wet_nurse.GetFirstName] đáp lại bằng một tiếng khúc khích."
  bp2_yearly.7006.a: "Tiểu quỷ này!"
  bp2_yearly.7006.b: "Vậy là [nursed_child.GetSheHe] là một [nursed_child.Custom('GetPrincessPrince')] thời trang?"
  bp2_yearly.7006.c: "$bp2_yearly.7003.c$"
  bp2_yearly.7008.t: "$bp2_yearly.7003.title$ Oán Hận"
  bp2_yearly.7008.desc_start: "\"Ôi, khi ngươi còn là một đứa trẻ nhỏ! Ta sẽ luôn trân trọng những ngày đó,\" nói [ROOT.Char.Custom2('RelationToMeShort', reflecting_parent)] [reflecting_parent.GetFirstName] một cách tự nhiên.\n\nMọi thứ ùa về. Ta #EMP biết#! rằng"
  bp2_yearly.7008.desc: "$bp2_yearly.7008.desc_start$ [reflecting_parent.GetSheHe] chưa bao giờ quan tâm đến Ta. Ta #EMP biết#! Những khoảnh khắc hài hước của [reflecting_parent.GetHerHis] là thử thách tồi tệ nhất của Ta."
  bp2_yearly.7008.desc_dead_parent: "$bp2_yearly.7008.desc_start$ [ROOT.Char.Custom2('RelationToMeShort', ROOT.Var('nursed_child_parent_var').Char)] [ROOT.Var('nursed_child_parent_var').Char.GetFirstName] là kẻ thù của Ta suốt đời nếu [ROOT.Var('nursed_child_parent_var').Char.GetSheHe] còn sống."
  bp2_yearly.7008.desc_word: "[ROOT.Var('nursed_child_parent_var').Char.GetSheHe|U] còn phớt lờ lời nói đầu tiên của Ta!"
  bp2_yearly.7008.desc_step: "[ROOT.Var('nursed_child_parent_var').Char.GetSheHe|U] bỏ đi, chán nản, khi Ta tập đi những bước đầu tiên."
  bp2_yearly.7008.desc_tooth: "[ROOT.Var('nursed_child_parent_var').Char.GetSheHe|U] kinh tởm khi thấy chiếc răng rụng đầu tiên của Ta!"
  bp2_yearly.7008.desc_dress: "[ROOT.Var('nursed_child_parent_var').Char.GetSheHe|U] chế giễu niềm yêu thích trang phục của Ta khi còn nhỏ!"
  bp2_yearly.7008.desc_end: "\n\nTa nên lấy lại những gì thuộc về Ta! Hay có lẽ… tốt hơn Ta nên ngừng nghĩ về quá khứ?"
  bp2_yearly.7008.a: "\"Đưa đất của ngươi cho ta, [nursed_child.Custom2('RelationToMeShort', reflecting_parent)]!\""
  bp2_yearly.7008.a.tt_good: "[reflecting_parent.GetFirstNameNoTooltip] đồng ý với ngươi"
  bp2_yearly.7008.a.tt_bad: "[reflecting_parent.GetFirstNameNoTooltip] đưa ra thứ khác thay thế"
  bp2_yearly.7008.b: "\"Ngươi nợ ta của cải của ngươi!\""
  bp2_yearly.7008.c: "\"Ta ghét ngươi, và hy vọng không bao giờ gặp lại!\""
  bp2_yearly.7008.c_dead_parent: "\"Tại sao ngươi bỏ bê ta như vậy!?\""
  bp2_yearly.7008.d: "Ta muốn tập trung vào con cái của mình."
  bp2_yearly.7008.e: "Cách đối xử đó… là hợp lý."
  bp2_yearly.7008.tt: "[reflecting_parent.GetFirstNameNoTooltip] sẽ phải trả lời"
  bp2_yearly.7009.t: "$bp2_yearly.7003.title$ Tình Thân"
  bp2_yearly.7009.desc: "$bp2_yearly.7008.desc_start$ [ROOT.Char.Custom2('RelationToMeShort', reflecting_parent)] của ta đã nhìn thấy những điều tốt đẹp nhất ở ta, luôn cố gắng bảo vệ ta. Những khoảnh khắc đẹp nhất trong tuổi thơ ta là những khoảnh khắc bên [reflecting_parent.GetHerHim]."
  bp2_yearly.7009.desc_dead_parent: "$bp2_yearly.7008.desc_start$ [ROOT.Char.Custom2('RelationToMeShort', reflecting_parent)] của ta dành tình cảm sâu sắc cho ta và, trong khi [ROOT.Char.Custom2('RelationToMeShort', ROOT.Var('nursed_child_parent_var').Char)] [ROOT.Var('nursed_child_parent_var').Char.GetFirstName] còn sống, [ROOT.Var('nursed_child_parent_var').Char.GetSheHe] cũng yêu thương ta tha thiết."
  bp2_yearly.7009.desc_word: "Chính [ROOT.Var('nursed_child_parent_var').Char.GetSheHe] là người đã nghe những lời đầu tiên của ta."
  bp2_yearly.7009.desc_step: "[ROOT.Var('nursed_child_parent_var').Char.GetSheHe|U] đã giúp ta thực hiện những bước đi đầu đời."
  bp2_yearly.7009.desc_tooth: "[ROOT.Var('nursed_child_parent_var').Char.GetSheHe|U] thậm chí còn đón lấy chiếc răng sữa của ta vào chính lòng bàn tay [ROOT.Var('nursed_child_parent_var').Char.GetHerHis]."
  bp2_yearly.7009.desc_dress: "[ROOT.Var('nursed_child_parent_var').Char.GetSheHe|U] khuyến khích sự nghịch ngợm của ta, việc ta hóa trang."
  bp2_yearly.7009.desc_end: "\n\nCó lẽ ta nên đền đáp tình cảm [ROOT.Var('nursed_child_parent_var').Char.GetHerHis] của người ấy?"
  bp2_yearly.7009.desc_end_dead_parent: "\n\nTuy nhiên, đã quá muộn để cảm ơn [ROOT.Var('nursed_child_parent_var').Char.GetHerHim]. Lòng biết ơn của ta bây giờ chỉ dành cho [ROOT.Char.Custom2('RelationToMe', reflecting_parent)] của ta mà thôi."
  bp2_yearly.7009.a: "\"Ta yêu ngươi nhiều lắm, [nursed_child.Custom2('RelationToMeShort', reflecting_parent)].\""
  bp2_yearly.7009.a.tt_good: "$bp2_yearly.7008.a.tt_good$"
  bp2_yearly.7009.a.tt_bad: "[reflecting_parent.GetFirstNameNoTooltip] muốn một thứ gì đó đổi lại"
  bp2_yearly.7009.b: "Ta sẽ chuyển tình yêu thương này cho con cái của mình!"
  bp2_yearly.7009.c: "Uh-huh. Gia đình, lòng biết ơn… và những thứ tương tự."
  bp2_yearly.7010.t: "$bp2_yearly.7008.t$"
  bp2_yearly.7010.desc_start: "Khi Ta bàn luận một vài việc triều chính với [ROOT.Char.Custom2('RelationToMeShort', nursed_child)] [nursed_child.GetFirstName], [nursed_child.GetSheHe] bỗng nhiên bắt đầu nhắc về tuổi thơ của [nursed_child.GetHerHis].\n\n"
  bp2_yearly.7010.desc: "$bp2_yearly.7010.desc_start$\"Người yêu dấu [nursed_child.Custom2('RelationToMeShort', ROOT.Char)], ngươi phải thừa nhận: ngươi chưa bao giờ quan tâm đến ta, ngay cả khi ta còn nhỏ.\""
  bp2_yearly.7010.desc_dead_parent: "$bp2_yearly.7010.desc_start$\"Ôi [nursed_child.Custom2('RelationToMeShort', ROOT.Char)], nói xấu người đã khuất là không đúng, nhưng ngươi phải thừa nhận [nursed_child.Custom2('RelationToMeShort', nursed_child.MakeScope.Var('nursed_child_parent_var').Char)] của ta là bậc cha mẹ tệ nhất có thể!\""
  bp2_yearly.7010.desc_word: "Lời nói đầu tiên của ta bị phớt lờ!"
  bp2_yearly.7010.desc_step: "Những bước đi đầu tiên của ta bị bỏ qua!"
  bp2_yearly.7010.desc_tooth: "Những chiếc răng đầu tiên rụng của ta bị vứt đi!"
  bp2_yearly.7010.desc_dress: "Sở thích ăn mặc của ta bị chế giễu tàn nhẫn."
  bp2_yearly.7010.desc_end: "Đó có phải là #EMP tình yêu#! không?"\n\n[nursed_child.GetFirstNameNoTooltip] run lên vì xúc động, nhưng có vẻ kiên quyết."
  bp2_yearly.7010.desc_title: "$bp2_yearly.7008.a$"
  bp2_yearly.7010.desc_gold: "$bp2_yearly.7008.b$"
  bp2_yearly.7010.desc_hate: "$bp2_yearly.7008.c$"
  bp2_yearly.7010.desc_hate_dead_parent: "$bp2_yearly.7008.c_dead_parent$"
  bp2_yearly.7010.a: "Ta sẵn sàng chứng minh sự hối lỗi."
  bp2_yearly.7010.a.tt: "$bp2_yearly.7008.a.tt_good$"
  bp2_yearly.7010.b: "\"Từ nay, ngươi sẽ có tất cả những gì cần từ ta!\""
  bp2_yearly.7010.b.tt: "$bp2_yearly.7008.a.tt_bad$"
  bp2_yearly.7010.c: "\"Lớn lên đi.\""
  bp2_yearly.7010.c.tt: "[reflecting_parent.GetFirstNameNoTooltip] thực ra không quan tâm"
  bp2_yearly.7011.t: "$bp2_yearly.7009.t$"
  bp2_yearly.7011.desc: "$bp2_yearly.7010.desc_start$\"[nursed_child.Custom2('RelationToMeShort', ROOT.Char)|U], ngươi chăm sóc ta như chó mẹ chăm đàn con. Còn tốt hơn thế. Những ký ức đầu đời đáng nhớ nhất của ta là với ngươi.\""
  bp2_yearly.7011.desc_dead_parent: "$bp2_yearly.7010.desc_start$\"Khi [nursed_child.Custom2('RelationToMeShort', nursed_child.MakeScope.Var('nursed_child_parent_var').Char)] còn ở với ta, ta thật sự yêu quý [nursed_child.MakeScope.Var('nursed_child_parent_var').Char.GetHerHim]. Luôn luôn, [nursed_child.MakeScope.Var('nursed_child_parent_var').Char.GetSheHe] và ngươi dành thời gian cho ta.\""
  bp2_yearly.7011.desc_word: "Khi ta nói những lời đầu tiên!"
  bp2_yearly.7011.desc_step: "Khi ta tập những bước đi đầu tiên!"
  bp2_yearly.7011.desc_tooth: "Khi ta đặt chiếc răng sữa đầu tiên vào tay ngươi."
  bp2_yearly.7011.desc_dress: "Khi ta nghịch ngợm và tung tăng khắp nơi!"
  bp2_yearly.7011.desc_end: "Ngươi đã ôm ta thật chặt."\n\n[nursed_child.GetSheHe|U] đỏ mặt, cười rạng rỡ.\n\n"
  bp2_yearly.7011.desc_receive_love: "$bp2_yearly.7011.desc_end$$bp2_yearly.7009.a$"
  bp2_yearly.7011.desc_forwarded_love: "\"$bp2_yearly.7011.desc_end$\"$bp2_yearly.7009.b$"
  bp2_yearly.7011.a: "\"Và ta yêu ngươi, [ROOT.Char.Custom2('RelationToMeShort', nursed_child)]!\""
  bp2_yearly.7011.a.tt: "$bp2_yearly.7009.a.tt_good$"
  bp2_yearly.7011.b: "\"Thật tận tâm!\""
  bp2_yearly.7011.b.tt: "$bp2_yearly.7009.a.tt_bad$"
  bp2_yearly.7011.c: "\"Đừng nghĩ về quá khứ.\""
  bp2_yearly.7011.c.tt: "$bp2_yearly.7010.c.tt$"
  bp2_yearly.7012.t: "Sữa Tình Yêu Của Người Vú Nuôi"
  bp2_yearly.7012.desc: "[nursed_child.Custom2('MyCharacterIntroduction', ROOT.Char)|U] loạng choạng bước vào, làm gián đoạn cuộc họp của Ta và cố kéo Ta ra một bên.\n\n\"[nursed_child.GetFirstNameNoTooltip]! Ngươi không nên ở đây,\" Ta phản đối, nhưng [nursed_child.Custom('GirlBoy')] đỏ mặt và bắt đầu la hét.\n\n\"Ta #EMP ghét#! ngươi! Sao lại làm vậy?!\" [nursed_child.GetSheHe|U] dừng lại, hít sụt sịt, mọi ánh mắt đều nhìn vào [nursed_child.GetHerHim]. \"Ngươi đã đuổi [former_wet_nurse.GetFirstName] của ta đi! Cô ấy không chỉ là một người vú nuôi — ta yêu cô ấy như mẹ! #EMP Hơn#! cả mẹ ta!\""
  bp2_yearly.7012.a: "Tha thứ cho ta. Ta sẽ thuê cô ấy trở lại!"
  bp2_yearly.7012.b: "Ngươi nên tôn trọng quyết định của [nursed_child.Custom2('RelationToMePossessive', ROOT.Char)]."
  bp2_yearly.7012.b_win: "Ngươi an ủi và giáo dục [nursed_child.GetFirstNameNoTooltip]"
  bp2_yearly.7012.b_loss: "[nursed_child.GetFirstNameNoTooltip] oán giận sự áp đặt của ngươi"
  bp2_yearly.7012.c: "Con ơi, im đi!"
  bp2_yearly.7013.t: "Nỗi Buồn Của Một Đứa Trẻ"
  bp2_yearly.7013.desc: "Gần đây, [nursed_child.GetFirstName] cứ đi lang thang, chìm đắm trong những suy nghĩ [nursed_child.GetHerHis] của riêng mình. Trong căn phòng [nursed_child.GetHerHis] của người ấy, ta thấy [nursed_child.GetHerHim] khóc vào những chiếc gối [nursed_child.GetHerHis].\n\n"Chuyện gì vậy, [ROOT.Char.Custom2('RelationToMeShort', nursed_child)] của ta?" ta hỏi, khi [nursed_child.GetSheHe] bắt đầu bình tĩnh lại.\n\n"Điều gì xảy ra khi ngài chết? Con chỉ tự hỏi... liệu vú nuôi [former_wet_nurse.GetFirstName] của con có ổn không." [nursed_child.GetSheHe|U] sụt sịt, cố ngăn những giọt nước mắt. "Có lẽ bây giờ bà ấy phải làm vú nuôi cho [ROOT.Char.GetFaith.DevilName] rồi chăng?"\n\nKhi giọng của [nursed_child.GetFirstNamePossessiveNoTooltip] vỡ òa, [nursed_child.GetSheHe] bật khóc với những giọt nước mắt to nhất, mọng nhất mà ta từng thấy."
  bp2_yearly.7013.a: "\"Người vú nuôi mới của con sẽ làm mọi thứ tốt lên!\""
  bp2_yearly.7013.a.tt: "Kích hoạt $bp2_decision.0001.t$"
  bp2_yearly.7013.b: "\"Chắc cô ấy đang ở [nursed_child.GetFaith.PositiveAfterLife] bây giờ.\""
  bp2_yearly.7013.c: "Chết là chết."
  bp2_yearly.7014.t: "Một Sự Hiện Diện Thân Quen"
  bp2_yearly.7014.desc: "Người vú nuôi của Ta, [wet_nurse.GetFirstName], đặt Ta lên giường, tiến đến thổi nến cho đêm.\n\n\"Chờ đã! Ta muốn nói điều gì đó!\" Ta van xin. \"Ta thích ngươi ở đây… Nếu không có ngươi, ta sẽ cảm thấy cô đơn ở [ROOT.Char.GetCurrentLocation.GetName].\"\n\n[wet_nurse.GetFirstNameNoTooltip] có vẻ hơi bối rối vì điều này, nhưng cũng cảm động.\n\n\"Ta là một người tận tâm"
  bp2_yearly.7014.desc_faith: "hầu việc [wet_nurse.GetFaith.HighGodName], như một ngày nào đó ngươi cũng sẽ làm. Khi ngươi mạnh mẽ trong đức tin, [wet_nurse.GetFaith.HighGodName] sẽ hướng dẫn và an ủi ngươi, và ngươi sẽ không cần đến ta nữa.\""
  bp2_yearly.7014.desc_culture: "[wet_nurse.GetCulture.GetName], giống như ngươi. Chúng ta cùng chia sẻ trái tim [wet_nurse.GetCulture.GetEthos.GetNameNoTooltip|l]. [tradition.GetNameNoTooltip], [tradition_2.GetNameNoTooltip]… đó là cách chúng ta! Dù lớn hay nhỏ, chúng ta đều là những con người tốt."
  bp2_yearly.7014.desc_culture_no_trad: "[wet_nurse.GetCulture.GetName], giống như ngươi. Chúng ta cùng chia sẻ trái tim [wet_nurse.GetCulture.GetEthos.GetNameNoTooltip|l] và những cách cổ xưa! Dù lớn hay nhỏ, chúng ta đều là những con người tốt."
  bp2_yearly.7014.a: "\"Ước gì ngươi là mẹ ta!\""
  bp2_yearly.7014.b: "Ta sẽ không quên khoảnh khắc này."
  parenting_by_example: "Làm Cha Mẹ Bằng Gương Mẫu"
  parenting_by_example_desc: "Cha mẹ của nhân vật này dạy họ nuôi dạy con cái bằng tình yêu thương và sự chăm sóc."
  role_model_parent: "Cha Mẹ Gương Mẫu"
  role_model_parent_desc: "Người cha mẹ này truyền cảm hứng cho con cái họ biết yêu thương và chăm sóc con của mình."
  rites_of_passage_decision: "$bp2_decision.0002.t$"
  rites_of_passage_decision_desc: "Thanh thiếu niên ở một độ tuổi nhất định có thể tham gia vào nghi lễ trưởng thành: một nghi lễ đánh dấu họ là người lớn với địa vị trong bộ tộc."
  rites_of_passage_decision_effect_tooltip: "Một thanh niên thực hiện một trong các việc: $rites_of_passage_duel$, $rites_of_passage_scarification$, $rites_of_passage_seclusion$, $rites_of_passage_shaving$ hoặc Thanh Lọc Nguyên Tố"
  rites_of_passage_decision_confirm: "Đã đến lúc"
  rites_of_passage_duel: "Đấu tay đôi"
  rites_of_passage_scarification: "Khắc vết sẹo"
  rites_of_passage_seclusion: "Ẩn dật"
  rites_of_passage_shaving: "Cạo đầu"
  bp2_decision.0002.t: "Nghi Lễ Trưởng Thành"
  bp2_decision.0002.desc: "Thời gian đưa những người trưởng thành mới vào bộ tộc [ROOT.Char.GetCulture.GetName], nhưng chỉ các nghi lễ chứng minh mới xác lập sự trưởng thành, địa vị và giá trị. [teentribal.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort',teentribal)] của ta, đã đến tuổi thích hợp. Dân tộc [ROOT.Char.GetCulture.GetEthos.GetNameNoTooltip|l] của chúng ta có ba cách truyền thống để thử thách [teentribal.GetHerHis].\n\n"
  bp2_decision.0002.desc_root: "Cho đến khi ta khẳng định mình là người trưởng thành, đồng bào [ROOT.Char.GetCulture.GetCollectiveNoun] sẽ không xem ta là thành viên đầy đủ của bộ tộc. Dân tộc [ROOT.Char.GetCulture.GetEthos.GetNameNoTooltip|l] của chúng ta có ba nghi lễ lâu đời để đánh dấu bước vào tuổi trưởng thành… và chứng minh giá trị của ta như [ROOT.Char.GetTitleAsName].\n\n"
  bp2_decision.0002.desc_duel: "Trong một trận đấu tay đôi với một [ROOT.Char.GetCulture.GetName] [teentribal.GetWomanMan] khác, chúng ta chiến thắng nhờ kỹ năng và sức mạnh."
  bp2_decision.0002.desc_scarification: "Trong nghi lễ khắc sẹo, ý chí được khắc sâu trên da."
  bp2_decision.0002.desc_seclusion: "Trong ẩn dật, ta thử thách khả năng thích nghi và dự đoán trước."
  bp2_decision.0002.desc_hair_shaving: "Cạo đầu thể hiện ý chí sắt đá."
  bp2_decision.0002.desc_cleansing: "Sức mạnh thanh lọc của $cleansing_type_element$ chỉ có thể đối mặt bằng kiên nhẫn và nhiệt huyết."
  bp2_decision.0002.desc_end: "\n\nNếu [teentribal.GetFirstNameNoTooltip] vượt qua bất kỳ thử thách nào này, [teentribal.GetSheHe] sẽ được [ROOT.Char.GetFaith.HighGodName] ưu ái, và được tôn trọng như một [ROOT.Char.GetCulture.GetNameNoTooltip] [teentribal.GetWomanMan] xứng đáng."
  bp2_decision.0002.desc_end_root: "\n\nNếu ta vượt qua bất kỳ thử thách nào này, ta sẽ trở nên xứng đáng trong mắt [ROOT.Char.GetFaith.HighGodName], và là một [ROOT.Char.GetCulture.GetNameNoTooltip] [teentribal.GetWomanMan] được tôn vinh."
  bp2_decision.0002.effect_tt: "Nhận một điểm [personality_trait|E], [lifestyle_experience|E] hoặc [skill|E]"
  bp2_decision.0002.effect_modifier_tt: "Nhận [GetModifier('proven_adult_modifier').GetNameWithTooltip] hoặc [GetModifier('insecure_adult_modifier').GetNameWithTooltip] trong #V 10 năm#!"
  bp2_decision.0002.a: "Một trận đấu tay đôi."
  bp2_decision.0002.a.flavor: "Sẽ là [teentribal.Custom('GirlBoy')] đối đầu với [teentribal.GetWomanMan]!"
  bp2_decision.0002.a.tt: "Ngươi sẽ chọn một đối thủ [single_combat_duel|E]"
  bp2_decision.0002.a.win: "Nếu chiến thắng trận đấu"
  bp2_decision.0002.a.lose: "Nếu thua trận đấu"
  bp2_decision.0002.b: "Nghi lễ khắc sẹo."
  bp2_decision.0002.b.tt: "Trưng bày trước mọi người minh chứng sức mạnh tinh thần trên thể xác!"
  bp2_decision.0002.b_scarred: "Nếu vết sẹo sâu"
  bp2_decision.0002.b_scarred.tt: "Nhận [GetTrait('scarred').GetName( GetNullCharacter )|LV] hoặc [GetTrait('wounded_1').GetName( GetNullCharacter )|LV]"
  bp2_decision.0002.b_modifier: "Nếu lưỡi dao chỉ khẽ chạm"
  bp2_decision.0002.c: "Ẩn dật."
  bp2_decision.0002.c.tt: "Hoang dã khắc nghiệt tiết lộ bản ngã thật."
  bp2_decision.0002.c.destination: "Ngươi sẽ chọn một [travel_destination|E]"
  bp2_decision.0002.c_win: "Nếu ẩn dật thành công"
  bp2_decision.0002.c_lose: "Nếu ẩn dật khó khăn"
  bp2_decision.0002.c_trait: "Nhận một [commander_trait|E] dựa trên địa hình điểm đến"
  bp2_decision.0002.d: "Cạo đầu."
  bp2_decision.0002.d.tt: "Hãy cắt đi mọi đặc quyền thời thơ ấu!"
  bp2_decision.0002.d_artifact: "Nhận một [artifact|E]"
  bp2_decision.0002.d_bald: "Nếu tất cả đều được cạo sạch"
  bp2_decision.0002.d_shave: "Nếu chỉ cắt một lọn tóc"
  fire_cleanse: "lửa"
  water_cleanse: "nước"
  cleansing_type_element: "[SelectLocalization(ObjectsEqual(teentribal.MakeScope.Var('cleansing_type').GetFlagName, '$fire_cleanse|q$'),'fire_cleanse','water_cleanse')]"
  passage_rites_effect.trait: "Một điều gì đó bên trong được thức tỉnh"
  passage_rites_effect.xp: "Thu nhận nhiều trí tuệ và kinh nghiệm đời sống"
  passage_rites_effect.skill: "Học được nhiều điều từ nghi lễ"
  bp2_decision.0002.e: "Một $cleansing_type_element$ thanh lọc."
  bp2_decision.0002.e.tt: "Lực nguyên thủy của $cleansing_type_element$ sẽ thanh lọc tinh thần và thể xác."
  bp2_decision.0002.e.full: "Nếu nguyên tố được tiếp nhận trọn vẹn"
  bp2_decision.0002.e.partially: "Nếu nghi lễ thực hiện nửa vời"
