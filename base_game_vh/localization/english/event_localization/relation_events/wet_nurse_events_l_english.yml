 bp2_decision.0002.tt: "@alert_icon! #alert_trial You will not be refunded the cost of this [decision|E]#!\n@alert_icon! #alert_trial $bp2_decision.0002.t$ [decision|E] will become unavailable for #V 1 year#!"
  bp2_decision.0002.backout: "[SelectLocalization(ObjectsEqual(teentribal, ROOT.Char),'Ta',teentribal.GetFirstNameNoTooltip)] [SelectLocalization(ObjectsEqual(teentribal, ROOT.Char),'','vẫn ')]chưa sẵn sàng"
