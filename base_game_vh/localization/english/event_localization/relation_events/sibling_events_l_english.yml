l_english: 
  sibling.0001.t:0 "Đền Đáp Xứng Đáng"
  sibling.0001.desc:0 "[sibling.GetTitledFirstName] đã đến xin được triều kiến chính thức với Ta!\n\n\"Thân mến [sibling.Custom2('RelationToMe' , ROOT.GetCharacter )], Ta đã phục vụ ngài trung thành. Có phải đã đến lúc Ta được thưởng xứng đáng cho những gì mình làm tốt?\""
  sibling.0001.a:0 "Ta sẽ ban cho ngươi một tước hiệu và đất đai riêng!"
  sibling_promised_land_tt:1 "[sibling.GetFirstName] sẽ mong chờ Ta sớm trao tước cho [sibling.GetHerHim]"
  sibling.0001.b:0 "Ngươi có thể yêu cầu bất cứ điều gì, [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling'))] của ta."
  sibling.0001.c:0 "Hãy nhận món quà này và chứng tỏ bản thân trước thế giới, [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )] thân mến!"
  sibling_funded_for_invasion:0 "[sibling.GetFirstName] sẽ tìm kiếm một vương quốc phù hợp để thử vận may [sibling.GetHerHis] của mình."
  sibling_becomes_councillor_tt:0 "[sibling.GetFirstName] trở thành một trong các cố vấn của Ta."
  sibling.0001.e:0 "Ngươi chỉ làm tròn bổn phận của mình thôi!"

  sibling.0002.desc:0 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )] của ta, [sibling.GetFirstName], đã đến gặp ta, nhắc nhở rằng ta từng hứa với [sibling.GetHerHim] những vùng đất và tước hiệu [sibling.GetHerHis] của riêng người.\n\n"Ta đã đợi đủ lâu rồi, [sibling.Custom2('RelationToMe' , ROOT.Char )].""
  sibling.0002.a:1 "Ta sẽ trả tiền để ngươi quên lời hứa đó."
  sibling.0002.b:0 "Ta không có gì để trao cho ngươi, [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )]."

  sibling.0003.desc:1 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )] của Ta, [sibling.GetFirstName], đến mang lễ vật từ vùng đất mới của [sibling.GetHerHis].\n\n\"[sibling.Custom2('RelationToMe' , ROOT.Char )|U]! Mong những món quà này mãi gắn kết chúng ta như tình thân và máu mủ!\""
  sibling.0003.a:0 "Vì gia đình và vương quốc!"

  sibling.0004.t:0 "[sibling.Custom('SisterBrother')|U] và [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('vassal') )|U]"
  sibling.0004.opening:0 "[vassal.GetTitledFirstName] lại đến phàn nàn về [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )] [sibling.GetTitledFirstName]."
  sibling.0004.fallback:0 "\n\nHọ hoàn toàn không thể hòa hợp, lần này dường như một trong hai đã quá quắt."
  sibling.0004.a:0 "[ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )] của ta đang hành động thay mặt ta."
  sibling.0004.b:0 "Hãy tự chỉnh lại đi, [sibling.GetFirstNameNoTooltip]!"
  sibling.0004.c:0 "Ta có cần phải răn dạy cả hai như trẻ con sao?!"

  sibling.0005.t:0 "Nguồn Rắc Rối"
  sibling.0005.desc:0 "Ta đã biết ngày trả giá sẽ đến với [sibling.Custom2('MyCharacterIntroduction', ROOT.Char )].\n\n[vassal.GetTitledFirstName] đưa ra yêu cầu không chỉ thay mặt [vassal.GetHerselfHimself], mà còn từ tất cả [ROOT.GetCharacter.Custom('powerful_vassals_loc')|l] của Ta, rằng Ta phải làm gì đó về [ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )] không thể chịu nổi."
  sibling.0005.a:0 "\"Đừng dám nói về [sibling.GetHerHim] như thế!\""
  sibling.0005.b:1 "[sibling.GetSheHe|U] phải học rằng hành vi của [sibling.GetHerHis] là không thể chấp nhận."
  sibling.0005.c:1 "Đủ rồi, [sibling.GetFirstNameNoTooltip]!"

  sibling.1001.t:0 "Hỗ Trợ Ngoại Giao"
  sibling.1001.desc:0 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )] của ta, [sibling.GetTitledFirstName], đã đến gặp ta với những ý tưởng về cách sử dụng cái lưỡi dẻo [sibling.GetHerHis] của người cho hiệu quả.\n\n"Ta có thể đóng vai trò là sứ giả, hoặc thậm chí là người truyền đạt các văn bản và mệnh lệnh của ngươi.""
  sibling.1001.a:0 "Ta biết nơi ngươi sẽ hữu dụng nhất."
  accepted_sibling_help_tt:0 "Một người em có giá trị có thể nghĩ rằng họ xứng đáng được thưởng..."
  sibling.1001.b:0 "Ta từ chối mắc nợ ngươi bất cứ điều gì, [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )]."

  sibling.1002.t:0 "Kiến Thức Chiến Tranh"
  sibling.1002.desc:0 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )] của ta, [sibling.GetTitledFirstName], đã đến gặp ta để thể hiện sự am hiểu về chiến tranh [sibling.GetHerHis] của mình.\n\n"Hãy để ta giúp huấn luyện binh lính của ngươi, và họ sẽ chiến đấu như chưa từng thấy ở bất kỳ đội quân nào trước đây.""
  sibling.1002.a:0 "Ta biết nơi ngươi sẽ hữu dụng nhất."
  sibling.1002.b:0 "Ta từ chối mắc nợ ngươi bất cứ điều gì, [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )]."

  sibling.1003.t:0 "Bí Mật và Lời Thì Thầm"
  sibling.1003.desc:0 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )] của Ta, [sibling.GetTitledFirstName], đề nghị chuyển tin về những gì diễn ra tại triều đình.\n\n\"Có một người trung thành thực sự giữa [ROOT.Char.Custom('GetCourt')|l] sẽ có lợi cho ngươi...\""
  sibling.1003.a:0 "Mối quan hệ gia đình là thứ duy nhất ta thực sự có thể tin."
  sibling.1003.b:0 "Ngươi nghĩ ta tin ngươi sao, [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )]?"

  sibling.1004.t:0 "Dòng Vàng"
  sibling.1004.desc:0 "Xem lại sổ sách [ROOT.Char.Custom('GetRealmOrDomicile')|l], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )], [sibling.GetTitledFirstName], không thể nhịn cười.\n\n\"[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )|U], hãy để ta chỉ cho người chịu trách nhiệm biết cách làm đúng.\""
  sibling.1004.a:0 "Được rồi, [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )], làm cho kho bạc của ta lớn lên."
  sibling.1004.b:0 "Ta biết lý do — ngươi muốn kiểm soát tiền của ta..."

  sibling.1005.t:0 "Suy Ngẫm Về Thần Linh"
  sibling.1005.desc:0 "Ít [sibling.GetWomenMen] có thể sánh với [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )], [sibling.GetTitledFirstName], về sự thông tuệ.\n\n[sibling.GetSheHe|U] giờ đề nghị chia sẻ điều đó với Ta, làm cố vấn về các vấn đề tâm linh cho [ROOT.Char.Custom('GetCourt')|l]."
  sibling.1005.a:0 "Xin hãy hướng dẫn tay Ta, [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )]."
  sibling.1005.b:0 "Ta sẽ không bao giờ giao linh hồn mình cho ngươi."

  sibling.2001.t:0 "Một Phiền Toái"
  sibling.2001.opening:0 "Ta hầu như không chịu nổi việc có [sibling.GetTitledFirstName] xung quanh."
  sibling.2001.fallback:0 "\n\nNếu [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )] không vô tình đốt cháy thứ gì đó hay lãng phí vàng của ta, thì [sibling.GetSheHe] lại làm phiền các [ROOT.Char.Custom('GetCourtierPlural')]."
  sibling.2001.a:0 "Khốn nạn thật, nhưng [sibling.GetSheHe] là gia đình!"
  sibling.2001.b:0 "Đủ rồi, [ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )]!"

  sibling.8001.t:0 "Giá Của Gia Đình"
  sibling.8001.desc:0 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )] tham lam của ta, [sibling.GetTitledFirstName], liên tục lấy thêm ngày càng nhiều tiền vàng dưới danh nghĩa "trợ cấp" [sibling.GetHerHis].\n\nGiờ thì [sibling.GetSheHe] đã đi quá xa khi khăng khăng đòi tiền cho một dự án thương mại, nhưng lại giữ toàn bộ số tiền đó cho [sibling.GetHerselfHimself]!"
  sibling.8001.a:0 "Ví của ta sẽ đóng cửa, [ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )]!"

  sibling.8002.t:0 "Túi Rộng"
  sibling.8002.desc:0 "[ROOT.GetCharacter.Custom('trait_generous_adjective')] [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )], [sibling.GetTitledFirstName], đã đi khắp [province.GetName], lắng nghe nỗi khổ của dân thường, hào phóng phát quà và hứa hẹn.\n\n[sibling.GetSheHe|U] còn làm rõ đây là tất cả vì lòng tốt nhân danh #EMP '[ROOT.Char.GetTitledFirstNameNoTooltip] the Good'#!..."
  sibling.8002.a:0 "Làm tốt lắm, [ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )]."
  sibling.8002.b:0 "Đây là tiền của TA sao?!"

  sibling.8003.t:0 "Những Lỗi Lầm"
  sibling.8003.desc:0 "[ROOT.GetCharacter.Custom('trait_lustful_adjective')] [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )], [sibling.GetTitledFirstName], đã đưa ra nhiều quyết định sai lầm, nhưng dính líu với một [sibling.Custom('servant_for_romance')] thường dân có lẽ là tệ nhất!"
  sibling.8003.a:0 "Ôi, [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )] có thể làm theo ý [sibling.GetSheHe]..."
  risk_of_sibling_producing_bastard_tt:0 "Điều này có thể có hậu quả..."
  sibling.8003.b:0 "[sibling.GetSheHe|U] có thể sẽ không còn gặp [sibling.Custom('servant_for_romance')] nữa!"

  sibling.8004.t:0 "Tôn Trọng Cấp Trên"
  sibling.8004.desc:1 "Khi đi qua [province.GetName], [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )] của ta dường như đã làm những nông dân ở vài ngôi làng và thị trấn vô cùng khó chịu. [sibling.GetTitledFirstName] không chỉ yêu cầu chỗ ở và được đối xử như thể [sibling.GetSheHe] là [ROOT.GetCharacter.Custom2('using_my_title' , SCOPE.sC('sibling') )], mà [sibling.GetSheHe] còn trừng phạt người dân vì những biểu hiện thiếu tôn trọng nhỏ nhất."
  sibling.8004.a:0 "Ta hiểu vì sao họ bực bội."
  peasants_dislike_sibling_tt:0 "Dân làng [province.GetName] không hài lòng"

  sibling.8005.t:0 "Đón Tiếp Trống Rỗng"
  sibling.8005.desc:0 "[ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )] của ta là [sibling.GetTitledFirstName] lẽ ra phải chào đón [vassal.GetTitledFirstName] trong chuyến thăm [vassal.GetHerHis] đến triều đình của ta.\n\nTuy nhiên, [vassal.GetFirstName] đã bị trì hoãn nhiều ngày, và giờ khi [vassal.GetSheHe] đã đến nơi, [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )] [ROOT.Char.Custom('trait_impatient_adjective')] của ta lại không thấy đâu cả, để khách của ta mà không có người chào đón!"
  sibling.8005.a:0 "Một vài món quà sẽ bù đắp."
  sibling.8005.b:0 "\"[sibling.GetFirstNameNoTooltip]!!!\""

  sibling.8006.t:0 "Khắt Khe Nhưng Công Bằng"
  sibling.8006.desc:1 "Khi thăm triều đình [vassal.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )] của Ta, [sibling.GetTitledFirstName], được yêu cầu xét xử thay mặt Ta.\n\n[vassal.GetFirstNameNoTooltip] khen ngợi tư cách công bằng của [sibling.GetFirstNamePossessiveNoTooltip], và dường như rất hài lòng với chuyến thăm của [sibling.Custom('SisterBrotherPossessive')]."
  sibling.8006.a:0 "[sibling.GetFirstNameNoTooltip] nên dành nhiều thời gian hơn tại triều đình [vassal.GetFirstNamePossessiveNoTooltip]."
  sibling.8006.b:0 "Ta cũng có vài vụ án mà [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )] có thể xử lý thay ta!"
