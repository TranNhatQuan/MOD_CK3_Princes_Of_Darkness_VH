l_english:
  rivalry.0001.t:0 "Chôn Chiếc Rìu Thù Hận"
  rivalry.0001.desc:2 "\"[ROOT.Char.GetTitledFirstNameNoTooltip], chúng ta đã từng mâu thuẫn trong quá khứ, nhưng ngươi có đồng ý rằng đã đến lúc bỏ qua mọi chuyện không?\"\n\n[rival.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ra hiệu từ Ta tới [rival.GetHerHim], \"Dù giữa chúng ta có chuyện gì… hãy bắt đầu lại từ đầu!\""
  rivalry.0001.a:1 "Đúng, hãy làm vậy."
  rivalry.0001.b:0 "Ngươi đang quỳ gối trước ta sao?! [ROOT.Char.GetFaith.HighGodName] thật tốt lành!"

  rivalry.0002.t:0 "Chôn Chiếc Rìu Thù Hận"
  rivalry.0002.desc:0 "Giờ đây, với khoảng cách thời gian, tất cả thật kỳ lạ. Cơn hận thù Ta ôm giữ và nỗi đau Ta khao khát gây ra…\nTất cả để làm gì chứ?\n\nGọi [rival_response.GetTitledFirstName] là kẻ thù giờ đây không còn có nghĩa gì với Ta nữa."
  rivalry.0002.a:0 "Hãy để quá khứ ngủ yên."

  rivalry.0003.t:0 "Đối Thủ Không Xứng"
  rivalry.0003.imprisoned.desc:0 "Khi Ta nghe tin về việc [nemesis.GetTitledFirstNamePossessive] bị giam,"
  rivalry.0003.incapable.desc:0 "Khi Ta lần đầu nghe tin về tai nạn và tình trạng liệt giường, chảy nước dãi của [nemesis.GetTitledFirstNamePossessive],"
  rivalry.0003.my_prisoner.desc:0 "Khi Ta đóng sầm cửa [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'cage', 'cell')] trước mặt [nemesis.GetTitledFirstNamePossessive] đáng khinh,"
  rivalry.0003.middle.desc:0 "Ta tràn đầy vui sướng. Kẻ [nemesis.Custom2('InsultAdjective', ROOT.Char)] [nemesis.Custom2('InsultNoun', ROOT.Char)] đó cuối cùng cũng nhận được điều mà [nemesis.GetSheHe] đáng phải chịu!\n\n"
  rivalry.0003.compassionate.desc:0 "Nhưng niềm vui của Ta phai nhạt theo thời gian. Thắng được [nemesis.GetTitledFirstNameNoTooltip] cũ thì vui, nhưng sinh vật đáng ghét này? Ta gần như #EMP thương hại#! [nemesis.GetHerHim]..."
  rivalry.0003.uncompassionate.desc:0 "Thời gian trôi qua, tình trạng đáng thương của [nemesis.GetHerHis] khiến Ta #EMP chán ngấy#! Ta không còn tìm thấy niềm vui khi tra tấn một con chuột bé nhỏ nhút nhát."
  rivalry.0003.a:0 "Đã đến lúc kết thúc chương này."
  rivalry.0003.b:0 "Ta sẽ không bao giờ tha thứ cho [nemesis.GetHerHim]! Không bao giờ!"

  rivalry.1001.t:0 "Luôn Hiện Diện"
  rivalry.1001.desc.opening:0 "[rival.GetTitledFirstName] đã trở thành một tai họa thường trực trong đời Ta.\n\n"
  rivalry.1001.malicious:0 "[rival.GetSheHe|U] luôn dường như phá hỏng mọi việc ta làm, và tên [rival.Custom2('InsultAdjective', ROOT.Char)] [rival.GetWomanMan] đó nhếch mép khi [rival.GetSheHe] làm điều đó!"
  rivalry.1001.benevolent:0 "Bất cứ khi nào chúng ta tình cờ gặp nhau, tên [rival.Custom2('InsultAdjective', ROOT.Char)] [rival.GetWomanMan] đó luôn cố tỏ ra tử tế và công bằng, chế nhạo ta từ trên đỉnh cao đạo đức [rival.GetHerHis]. Điều thực sự làm ta tức giận là [rival.GetSheHe] dường như đã đánh lừa được tất cả những người khác!"
  rivalry.1001.dominant:0 "Không chỉ liên tục đòi hỏi sự chú ý và không gian, [rival.GetSheHe] còn cả gan đòi hỏi thời gian và sự chú ý của ta. Như thể ta không có việc gì tốt hơn để làm ngoài việc nghe [rival.GetHerHim] khoe khoang vậy!"
  rivalry.1001.submissive:0 "Kẻ [rival.Custom2('InsultAdjective', ROOT.Char)] [rival.GetWomanMan] tỏ ra nhu mì, chỉ để quay lại đâm sau lưng Ta bất cứ khi nào có cơ hội!"
  rivalry.1001.extroverted:0 "[rival.GetSheHe|U] luôn đòi hỏi mọi sự chú ý tại mỗi sự kiện, bắt mọi người phải nghe [rival.GetHerHim] lảm nhảm hàng giờ liền. Như thể điều đó chưa đủ tồi tệ, [rival.GetSheHe] còn có vẻ tận dụng mọi cơ hội để mỉa mai ta khi [rival.GetSheHe] làm điều đó!"
  rivalry.1001.introverted:0 "Kẻ [rival.Custom2('InsultAdjective', ROOT.Char)] [rival.GetWomanMan] tẻ nhạt như một hòn đá, nhưng vẫn tìm thời gian để lan truyền tin đồn về Ta!"
  rivalry.1001.emotional:0 "[rival.GetSheHe|U] tận dụng mọi cơ hội để làm ầm ĩ và biến ta thành kẻ phản diện! [rival.GetSheHe|U] sụt sùi và phàn nàn, bôi nhọ danh tiếng của ta, và đổ lỗi cho ta về mọi điều tồi tệ trong cuộc sống [rival.GetHerHis]."
  rivalry.1001.levelheaded:0 "Dù là để phá hoại triều chính hay để trêu chọc, [rival.GetSheHe] luôn hiện diện, chờ đợi."
  rivalry.1001.desc.fallback:0 "Cảm giác như bất kể Ta đi đâu hay làm gì, [rival.GetTitledFirstName] luôn khiến sự hiện diện của [rival.GetHerHis] được biết đến. Là một cái bóng luôn che khuất mọi ngày của Ta."
  rivalry.1001.a:1 "Ngươi chết đi, [rival.GetFirstNameNoTooltip]!"
 
  rivalry.1010.t:0 "Hành Động Đầy Hằn Thù"
  rivalry.1010.desc:0 "[rival.GetTitledFirstNamePossessive] [rival.Custom2('InsultBehavior', ROOT.Char)] luôn làm phiền Ta, nhưng"
  rivalry.1010.desc.patient:0 "Ngay cả Ta cũng chỉ chịu đựng được mức độ [rival.GetTitledFirstNamePossessive] [rival.Custom2('InsultBehavior', ROOT.Char)] nhất định trước khi quá sức chịu đựng,"
  rivalry.1010.desc.end:0 "gần đây lại càng khiến Ta bực mình hơn bao giờ hết. Ta muốn trả thù [rival.GetHerHim] vì hành vi này, nhưng trả thù thế nào?"
  rivalry.1010.a:0 "Lan truyền tin đồn gây tai tiếng khiến [rival.GetHerHim] khốn khổ nhiều năm!"
  rivalry.1010.a.success.tt:0 "#F Tin đồn dẫn đến nhiều lời bàn tán và suy đoán #!"
  rivalry.1010.a.failure.tt:0 "#F Không ai tin vào những tin đồn phi lý #!"
  rivalry.1010.a.badfailure.tt:0 "#F Ta bị lộ là nguồn gốc của tin đồn #!"
  rivalry.1010.b:0 "Viết một bài thơ dí dỏm chế nhạo tất cả thất bại của [rival.GetHerHis]!"
  rivalry.1010.b.success.tt:0 "#F Bài thơ quá phổ biến, được sao chép liên tục #!"
  rivalry.1010.b.failure.tt:0 "#F Mọi người cho rằng bài thơ kém và thiếu tinh tế #!"
  rivalry.1010.b.badfailure.tt:0 "#F Ta bị lộ là tác giả của bài thơ #!"
  rivalry.1010.c:0 "Chỉ thẳng hành vi thô lỗ của [rival.GetHerHis] ngay trước mặt [rival.GetHerHis]!"
  rivlary.1010.c.tt:0 "#F [rival.GetTitledFirstName] sẽ phản ứng với sự khinh bỉ của Ngài #!"

  rivalry.1011.t:0 "Những Lời Nói Hằn Thù"
  rivalry.1011.desc.poem:0 "Một bài thơ mới lan truyền chế nhạo Ta vì [ROOT.GetCharacter.Custom('quirk_neg_noun')] và làm Ta xấu hổ. Dù không thể chứng minh [from_rival.GetTitledFirstName] là người đứng sau, nhưng văn phong rõ ràng mang dấu ấn của [from_rival.GetHerHis]."
  rivalry.1011.desc.rumors:0 "Những tin đồn vô lý về [ROOT.GetCharacter.Custom('quirk_neg_noun')] đang lan truyền trong [ROOT.Char.Custom('GetCourt')]. Ta bị bám theo bởi những lời xì xầm ác ý và cười nhạo tàn nhẫn. Chiêu trò hèn hạ này đúng kiểu mà [from_rival.GetTitledFirstName] sẽ làm!"
  rivalry.1011.a:0 "Ta sẽ trả thù [from_rival.GetHerHim] vì việc này!"

  rivalry.1012.t:0 "Những Suy Tưởng Ngớ Ngẩn"
  rivalry.1012.desc.poem:0 "Ta vừa biết rằng [from_rival.GetTitledFirstName] đã viết một bài thơ vu khống nhằm mục đích chế nhạo ta về [ROOT.GetCharacter.Custom('quirk_neg_noun')] của mình! Tuy nhiên, bài thơ [from_rival.GetHerHis] của gã đó quá tệ đến mức mọi người thay vào đó đã chế nhạo [from_rival.GetFirstName] vì đã lãng phí giấy tốt cho những lời nhảm nhí [rival.GetHerHis]!"
  rivalry.1012.desc.rumors:0 "Ta vừa biết [from_rival.GetTitledFirstName] đã cố lan truyền những tin đồn ác ý về những việc Ta làm trong riêng tư. Kẻ [from_rival.Custom('quirk_neg_adjective')] hẳn có cái nhìn méo mó về Ta, vì tin đồn quá phi lý khiến mọi người bác bỏ. Thay vào đó, họ xì xào về việc [from_rival.GetFirstName] đã hạ mình đến mức đáng ghét này."
  rivalry.1012.a:0 "Hắn đáng đời!"

  rivalry.1013.t:0 "Tin Đồn Lan Truyền"
  rivalry.1013.desc:0 "Những tin đồn tai tiếng về [rival.GetTitledFirstName] mà Ta phát tán trong [rival.GetHerHis] [rival.Custom('GetCourt')] đã trở thành chủ đề bàn tán mới. Ta nghe nói [rival.GetTitledFirstName] ngày càng bực bội và thất vọng khi cố ngăn chặn chúng!"
  rivalry.1013.a:0 "Có lẽ điều này cuối cùng sẽ đặt [rival.GetHerHim] vào đúng vị trí [rival.GetHerHis] của hắn."

  rivalry.1014.t:0 "Tin Đồn Bị Phủ Nhận!"
  rivalry.1014.desc.start:0 "Không ai tin vào những tin đồn Ta cố lan truyền về [rival.GetTitledFirstName], cho rằng chúng hoang đường và phi lý. Mọi người cười nhiều hơn về"
  rivalry.1014.desc.hidden:0 "người tạo ra chúng, nói rằng phải là"
  rivalry.1014.desc.exposed:0 "Ta đã tạo ra chúng, nói rằng Ta"
  rivalry.1014.desc.end:0 "non nớt và hèn hạ khi hạ mình dùng chiêu trò thấp hèn để làm xấu tên tuổi [rival.GetFirstNamePossessive]."
  rivalry.1014.a:0 "Ít ra Ta đã che được dấu vết..."
  rivalry.1014.a.exposed:0 "Chuyện hoàn toàn không như kế hoạch."

  rivalry.1015.t:0 "Bài Thơ Nổi Tiếng"
  rivalry.1015.desc:0 "Những vần điệu dí dỏm và ám chỉ tinh tế Ta đưa vào bài phê bình chua cay về nhân cách [rival.GetTitledFirstNamePossessive] đã lan truyền khắp [rival.GetHerHis] [rival.Custom('GetCourt')] như cháy rừng! Dù [rival.GetSheHe] cố gắng, [rival.GetSheHe] không thể ngăn cản, càng làm [rival.GetHerHis] xấu hổ thêm!"
  rivalry.1015.a:0 "Có lẽ điều này cuối cùng sẽ đặt [rival.GetHerHim] vào đúng vị trí [rival.GetHerHis] của hắn."

  rivalry.1016.t:0 "Bài Thơ Bị Từ Chối"
  rivalry.1016.desc:0 "Sau khi viết vài bài thơ chế nhạo nhân cách [rival.GetTitledFirstNamePossessive], Ta phát tán trong [rival.GetHerHis] [rival.Custom('GetCourt')] và chờ đợi chúng lan truyền.\n\nKhông may, dường như những tác phẩm của Ta không được ưa chuộng… thực tế, mọi người đồng ý rằng bài thơ rỗng tuếch, không đáng giấy viết!"
  rivalry.1016.desc.exposed:0 "Tệ hơn, sự hận thù với [rival.GetTitledFirstName] quá lộ liễu khiến mọi người biết Ta là người viết!"
  rivalry.1016.a:0 "May mà Ta không ký tên."
  rivalry.1016.a.exposed:0 "Tại sao Ta lại nghĩ đó là ý hay?"

  rivalry.1017.t:0 "Lời Xúc Phạm Táo Bạo!"
  rivalry.1017.desc:2 "Ta đang [ROOT.GetCharacter.Custom('quirk_pos_adverb')] làm việc thì [from_rival.GetTitledFirstName] tiến đến và xúc phạm Ta ngay trước mặt.\n\n\"[ROOT.GetCharacter.Custom('quirk_neg_adjective')|U] [ROOT.GetCharacter.Custom2('InsultNoun', SCOPE.sC('from_rival'))], sự hiện diện của ngươi khiến ta khóc!\""
  rivalry.1017.a:0 "Ta đáp lại sự phỉ báng này bằng loạt lời lẽ sỉ nhục của riêng mình!"
  rivalry.1017.b:0 "Kẻ hèn hạ đó sẽ phải trả giá trong một cuộc đấu tay đôi!"
  rivalry.1017.b.tt:0 "#F Ta sẽ chứng tỏ mình tốt hơn [from_rival.GetSheHe]#!"
  rivalry.1017.c:0 "Ta sẽ làm điều đúng đắn và nhẫn nhịn."

  rivalry.1018.t:0 "Trả Đũa"
  rivalry.1018.desc:0 "Khi ta đến gần [rival.GetTitledFirstName] để nói cho [rival.GetHerHim] biết suy nghĩ của mình, [rival.GetSheHe] đã đáp trả bằng một loạt những lời lăng mạ và ngược đãi [rival.GetHerHis] của riêng hắn!\n\nCuộc trao đổi bị xem là trẻ con, và kết quả là cả hai chúng ta đều mất mặt."
  rivalry.1018.a:0 "Tất cả là lỗi của [rival.GetHerHis] vì đã quá [rival.Custom('quirk_neg_adjective')] ngay từ đầu!"

  rivalry.1019.t:0 "Injuria Gratis"
  rivalry.1019.desc:0 "Khi ta đến gần [rival.GetTitledFirstName] để nói cho [rival.GetHerHim] biết suy nghĩ của mình, liệt kê tất cả các lỗi [rival.GetHerHis] của hắn. [rival.GetSheHe|U] không có gì để nói để tự bào chữa [rival.GetHerHis], và ta rời đi khi biết rằng [rival.GetSheHe] đã bị đặt vào đúng vị trí [rival.GetHerHis] một cách vững chắc."
  rivalry.1019.a:0 "Ta biết [rival.GetSheHe] yếu đuối!"

  rivalry.1020.t:0 "Thách Thức Bị Khinh"
  rivalry.1020.desc:0 "Khi ta chỉ trích [rival.GetTitledFirstName] về [rival.Custom('quirk_neg_noun')] [rival.GetHerHis] của hắn, [rival.GetSheHe] coi đó là một sự xúc phạm nghiêm trọng và thách thức ta đấu tay đôi để giữ gìn danh dự [rival.GetHerHis]!"
  rivalry.1020.a:0 "Ngươi nhận lời rồi đó, [rival.GetFirstNameNoTooltip]!"
  rivalry.1020.b:0 "Ừ… không cần dùng bạo lực đâu…"
  rivalry.1021.tt:0 "Chiến thắng vang dội"
  rivalry.1022.tt:0 "Chiến thắng sít sao"
  rivalry.1023.tt:0 "Thua sít sao"
  rivalry.1024.tt:0 "Thua ê chề"

  rivalry.1021.t:0 "Chiến Thắng Rực Rỡ"
  rivalry.1021.desc:1 "Ngay từ đầu trận đấu với [duel_loser.GetTitledFirstName] đã rõ ràng rằng Ta chiếm ưu thế. Ta tận dụng lợi thế, giữ cho [duel_loser.GetHerHim] luôn mất thăng bằng. Chẳng mấy chốc [duel_loser.GetSheHe] mắc sai lầm và để lộ sơ hở, Ta nhanh chóng tận dụng để [ROOT.GetCharacter.Custom('SignatureWeaponCritical')] vào cánh tay [duel_loser.GetHerHis], kết thúc trận đấu!\n\nChiến thắng nhanh chóng và quyết đoán khiến cảm giác chiến thắng càng ngọt ngào hơn."
  rivalry.1021.a:1 "Ta đã chứng minh mình tốt hơn [duel_loser.GetFirstNamePossessiveNoTooltip]!"

  rivalry.1022.t:0 "Chiến Thắng Gần Kề"
  rivalry.1022.desc:2 "Ta bắt đầu trận đấu với [duel_loser.GetTitledFirstName] và nhận ra chúng Ta cân sức hơn Ta tưởng. Chúng Ta trao đổi đòn và né đòn qua lại trong một thời gian, không ai chiếm ưu thế lâu.\n\nCuối cùng cả hai bắt đầu mệt mỏi và anh ta để lộ sơ hở, cho phép Ta [ROOT.GetCharacter.Custom('SignatureWeaponCritical')] vào chân [duel_loser.GetHerHis] và kết thúc trận đấu!"
  rivalry.1022.a:0 "Chiến thắng của Ta chứng tỏ Ta đúng."

  rivalry.1023.t:0 "Thua Gần Kề"
  rivalry.1023.desc:2 "Khi [duel_winner.GetTitledFirstName] và Ta bắt đầu trận đấu, Ta nhận ra [duel_winner.GetSheHe] là đối thủ mạnh hơn Ta dự đoán. Trận chiến sát nút, mỗi người trao đổi tấn công và né đòn tìm sơ hở.\n\nCuối cùng khi Ta bắt đầu mệt mỏi, phòng thủ bị hở một khoảnh khắc, [duel_winner.GetFirstName] tận dụng để [duel_winner.Custom('SignatureWeaponCritical')] vào cánh tay Ta bằng [duel_winner.GetHerHis] [duel_winner.Custom('signature_weapon')]."
  rivalry.1023.desc.end:0 "Chảy máu nhiều, Ta buộc phải nhượng bộ trận đấu."
  rivalry.1023.desc.death:0 "Vết thương khiến Ta kiệt sức và gục xuống đất."
  rivalry.1023.a:2 "Lần sau Ta sẽ trả thù [duel_winner.GetTitledFirstNameNoTooltip]!"
  rivalry.1023.a.death:0 "Mọi thứ thật tối tăm…"

  rivalry.1024.t:0 "Thua Nhục Nhã"
  rivalry.1024.desc:2 "Khi [duel_winner.GetTitledFirstName] và Ta gặp nhau để bắt đầu trận đấu, [duel_winner.GetSheHe] không lãng phí thời gian và lao vào tấn công! Bị bất ngờ, Ta vật lộn để lấy lại thế trận và những đòn tấn công liên tục của [duel_winner.GetFirstNamePossessive] không cho Ta cơ hội hồi phục.\n\nKhông lâu sau, [duel_winner.GetSheHe] lọt qua phòng thủ của Ta và [duel_winner.Custom('SignatureWeaponCriticalPresent')] vào chân Ta bằng [duel_winner.GetHerHis] [duel_winner.Custom('signature_weapon')],"
  rivalry.1024.desc.end:0 "rõ ràng kết thúc trận đấu. Thất bại ê chề khiến Ta xấu hổ và nhục nhã!"
  rivalry.1024.desc.death:0 "khiến Ta gục xuống đất."
  rivalry.1024.a:0 "Ta phải lê bước về nhà trong nhục nhã."

  rivalry.1025.t:0 "Hành Động Nhục Nhã"
  rivalry.1025.desc:1 "Tên hèn nhát [from_rival.GetTitledFirstName] từ chối thách đấu với Ta, mặc dù đã sỉ nhục Ta ngay trước mặt! Ta không thể nghĩ ra điều gì nhục nhã hơn việc bị xúc phạm mà không có can đảm đáp trả. Ta luôn biết [rival.GetSheHe] vô danh dự, và điều này chứng minh điều đó!"
  rivalry.1025.a:0 "Ít ra Ta vẫn giữ được danh dự."

  rivalry.1030.t:0 "Xen Vào Hôn Nhân"
  rivalry.1030.desc.happy:0 "Ta khó chịu khi đối thủ [rival.GetTitledFirstName] dường như tận hưởng hạnh phúc trong cuộc hôn nhân êm ấm với [rival.GetHerHis] [rival_spouse.GetWifeHusband] [rival_spouse.GetTitledFirstName]. Ta có thể gây cho [rival.GetHerHim] không ít căng thẳng bằng cách gieo nghi ngờ giữa hai người, khiến họ nghi ngờ lẫn nhau."
  rivalry.1030.desc.neutral:0 "Cuộc hôn nhân không tình yêu giữa đối thủ [rival.GetTitledFirstName] của ta và [rival_spouse.GetWifeHusband] [rival_spouse.GetTitledFirstName] [rival.GetHerHis] của hắn để lại một cơ hội hấp dẫn cho ta. Nếu ta có thể gieo rắc sự nghi ngờ và mất lòng tin giữa hai người họ, [rival.GetFirstName] sẽ bị xao nhãng bởi cuộc hôn nhân đang tan vỡ [rival.GetHerHis] của hắn đến mức [rival.GetSheHe] sẽ không thể can thiệp vào các kế hoạch của ta!"
  rivalry.1030.desc.unhappy:0 "Không có gì lạ khi đối thủ [rival.GetTitledFirstName] của ta và [rival_spouse.GetWifeHusband] [rival_spouse.GetTitledFirstName] [rival.GetHerHis] của hắn thường xuyên họng họng lẫn nhau. Ta có thể kích động một cuộc chiến khác giữa họ bằng một bức thư được sắp đặt kỹ lưỡng, làm xao nhãng [rival.GetFirstName] và khiến [rival.GetHerHim] khó can thiệp vào các kế hoạch của ta hơn..."
  rivalry.1030.a:0 "Ta sẽ gửi thư đến [rival_spouse.GetTitledFirstNameNoTooltip] từ một người tình bí mật."
  rivalry.1030.a.tt:1 "[rival.GetTitledFirstName] sẽ phát hiện bằng chứng… nhưng liệu [rival.GetSheHe] có tin không?"
  rivalry.1030.b:0 "Ta sẽ khéo léo đổ tội cho [rival.GetTitledFirstNameNoTooltip] thay."
  rivalry.1030.b.tt:1 "[rival_spouse.GetTitledFirstName] sẽ phát hiện bằng chứng… nhưng liệu [rival_spouse.GetSheHe] có tin không?"
  rivalry.1030.c:0 "Xen vào hôn nhân người khác là quá đáng!"
  rivalry.1030.c.tt:1 "Tạm ngưng con đường này"
  rivalry.1030.a_success:0 "Đổ tội thành công"
  rivalry.1030.a_failure:0 "Kế hoạch thất bại"

  rivalry.1031.t:0 "Bằng Chứng Ngoại Tình?"
  rivalry.1031.desc:0 "Hôm nay Ta tìm thấy một lá thư gửi cho [my_spouse.GetWifeHusband] [my_spouse.GetFirstName], do một người tình viết, kể về cuộc mặn nồng gần đây nhất của họ và hỏi khi nào họ có thể gặp lại!"
  rivalry.1031.desc.fooled:0 "\n\nTác giả của lá thư không được xác định, và tâm trí Ta chạy đi suy đoán xem [my_spouse.GetWifeHusband] của Ta đang ngoại tình với ai!"
  rivalry.1031.desc.suspicious:0 "\n\nBan đầu Ta tức giận, nhưng khi đọc kỹ, Ta nhận thấy lá thư rất chung chung, thiếu chi tiết cá nhân và không xác định tác giả. Ai cũng có thể viết được..."
  rivalry.1031.a.fooled:0 "Ta phải tìm ra người tình bí ẩn của [my_spouse.GetHersHis] là ai!"
  rivalry.1031.a.suspicious:0 "Điều tra lặng lẽ để tìm hiểu chuyện gì đang xảy ra."
  rivalry.1031.b.fooled:0 "Ta sẽ đối chất trực tiếp với [my_spouse.GetFirstNameNoTooltip] về lá thư!"
  rivalry.1031.b.suspicious:0 "Ta sẽ đối chất trực tiếp với [my_spouse.GetFirstNameNoTooltip] và tìm ra sự thật!"
  rivalry.1031.b.tt:1 "Ta sẽ hỏi [my_spouse.GetTitledFirstName] liệu [my_spouse.GetSheHe] có ngoại tình không"
  rivalry.1031.c:0 "Ta tin [my_spouse.GetTitledFirstNameNoTooltip], lá thư này chắc chắn là giả mạo!"
  rivalry.1031.c.tt:1 "Ta ném lá thư đi"

  rivalry.1032.t:0 "Bị Buộc Tội Ngoại Tình"
  rivalry.1032.desc:0 "[suspicious_spouse.GetWifeHusband] [suspicious_spouse.GetFirstName] tiếp cận Ta hôm nay với một lá thư mà [suspicious_spouse.GetSheHe] nói do người tình bí mật của Ta viết! Bây giờ [suspicious_spouse.GetSheHe] buộc tội Ta ngoại tình!"
  rivalry.1032.a:0 "Ta thề Ta không ngoại tình với Ngài!"
  rivalry.1032.a.tt:1 "Ta cố thuyết phục [suspicious_spouse.GetFirstNameNoTooltip] rằng Ta đã trung thành"
  rivalry.1032.b:0 "Ta phải thú nhận về mối quan hệ với [spouse_lover.GetTitledFirstNameNoTooltip]!"

  rivalry.1033.t:0 "Phủ Nhận Sai Lầm"
  rivalry.1033.desc:0 "Hôm nay ta đã đối chất với [my_spouse.GetFirstName] về bức thư từ người tình bí mật [my_spouse.GetHerHis] của cô ấy, nhưng [my_spouse.GetSheHe] có vẻ bị sốc và tổn thương trước lời buộc tội, và đã phản đối sự vô tội [my_spouse.GetHerHis] của mình!"
  rivalry.1033.a:0 "Ta tin [my_spouse.GetFirstNameNoTooltip] và tin những gì [my_spouse.GetSheHe] nói!"
  rivalry.1033.a.tt:1 "Ta kết thúc cuộc điều tra này"
  rivalry.1033.b:0 "Dối trá! Ta sẽ điều tra tiếp và tìm ra sự thật!"

  rivalry.1034.t:0 "Lời Thú Nhận Đẫm Nước Mắt"
  rivalry.1034.desc:0 "Khi Ta đối chất [my_spouse.GetFirstName] về lá thư từ người tình bí mật của [my_spouse.GetHerHis], [my_spouse.GetSheHe] bật khóc và thú nhận đẫm nước mắt về mối quan hệ với [spouse_lover.GetTitledFirstName]!"
  rivalry.1034.a:0 "Làm sao [my_spouse.GetSheHe] có thể làm vậy với Ta?"

  rivalry.1035.t:0 "Phát Hiện Giả Mạo!"
  rivalry.1035.desc:0 "Sau khi điều tra nguồn gốc lá thư từ người tình giả định của [my_spouse.GetFirstName], Ta phát hiện đó là giả, được đặt bởi chính [instigator.Custom2('InsultAdjective', ROOT.Char)] [instigator.Custom2('InsultNoun', ROOT.Char)] [instigator.GetTitledFirstName]!"
  rivalry.1035.a:0 "[instigator.GetSheHe|U] sẽ trả giá vì xen vào hôn nhân của Ta!"

  rivalry.1036.t:0 "Ngõ Cụt"
  rivalry.1036.desc:0 "Ta đã theo mọi manh mối để tìm ra người tình bí mật gửi lá thư cho [rival_spouse.GetFirstName], nhưng không xác định được nguồn gốc lá thư."
  rivalry.1036.a:0 "Dù sao Ta cũng sẽ để mắt tới [rival_spouse.GetFirstNameNoTooltip]..."
  rivalry.1036.b:0 "Ta phải kết luận rằng lá thư là giả!"

  rivalry.1037.t:0 "Xen Vào Hôn Nhân"
  rivalry.1037.desc:0 "Gián điệp của Ta báo rằng có sự căng thẳng mới giữa [rival.GetTitledFirstName] và [rival.GetHerHis] [rival_spouse.GetWifeHusband] [rival_spouse.GetFirstName]. Rõ ràng mưu kế gieo nghi ngờ của Ta đã thành công!"
  rivalry.1037.a:0 "Sự cãi vã của họ thật ngọt tai với Ta!"

  rivalry.1038.t:0 "Xen Vào Hôn Nhân"
  rivalry.1038.desc:0 "Gián điệp báo rằng [rival.GetTitledFirstName] nhận ra lá thư Ta đặt để gieo nghi ngờ giữa [rival.GetHerHim] và [rival.GetHerHis] [rival_spouse.GetWifeHusband] [rival_spouse.GetFirstName] là giả, và không bị lừa!"
  rivalry.1038.a:0 "Thì Ta sẽ phải thử cách khác..."

  rivalry.1039.t:0 "$rivalry.1037.t$"
  rivalry.1039.desc:0 "Gián điệp của Ta báo rằng [my_spouse.GetTitledFirstName] dường như đã ngoại tình từ lâu, và lá thư giả của Ta khiến [my_spouse.GetHerHim] sụp đổ và thú nhận với [suspicious_spouse.GetTitledFirstName]!"
  rivalry.1039.a:0 "Chà... điều đó #EMP thật#! thú vị"

  rivalry.2001.t:0 "Trở Ngại Cho Tình bạn"
  rivalry.2001.desc:2 "Ta nhận được một lá thư từ [target_in_question.GetTitledFirstName] hỏi Ta nghĩ gì về [rival.GetTitledFirstName]. Dường như [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('rival') )] đang có những cử chỉ ngoại giao với [target_in_question.GetHerHim]."
  rivalry.2001.a:0 "Ha, [target_in_question.GetFirstNameNoTooltip] có cần hỏi không?"
  rivalry.2001.b:0 "[target_in_question.GetFirstNameNoTooltip] nên tự quyết định tâm trí [target_in_question.GetHerHis] của riêng mình."

  rivalry.2002.t:0 "Trở Ngại Cho Tình bạn"
  rivalry.2002.desc:0 "Ta đã cố gắng để lại ấn tượng tốt với [target_in_question.GetTitledFirstName], nhưng Ta phát hiện ra gì?\n\nKhông ai khác ngoài [first_rival.GetTitledFirstName] đã lan truyền tin đồn xấu về Ta để phá hoại nỗ lực của Ta!"
  rivalry.2002.a:0 "[target_in_question.GetFirstNameNoTooltip] có thật sự tin những gì [first_rival.GetFirstNameNoTooltip] nói với [target_in_question.GetHerHim] không?"

  rivalry.3001.t:0 "Từ Xấu Đến Tệ Hơn"
  rivalry.3001.desc.opening:0 "Như thể chưa đủ rằng [rival.GetSheHe] ôm lấy những tật xấu tệ nhất của nhân loại, [rival.GetTitledFirstName] giờ còn sỉ nhục Ta ngay trước mặt!\n\n"
  rivalry.3001.malicious:0 "[rival.GetSheHe|U] gửi một sứ giả, đảm bảo toàn bộ [ROOT.Char.Custom('GetCourt')] nghe được lời bình phẩm ghê tởm. 'Đến [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))] [ROOT.Char.GetTitledFirstName]', nó bắt đầu, và càng ngày càng tệ. [rival.Custom2('InsultAdjective', ROOT.Char)] [rival.GetWomanMan] thật liều lĩnh!"
  rivalry.3001.benevolent:0 "[rival.GetSheHe|U] đã gửi một bức thư, yêu cầu cải thiện mối quan hệ và đồng thời gọi ta là "Tên [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))] [ROOT.Char.GetTitledFirstName] hèn hạ." [rival.GetSheHe|U] thực sự đang bộc lộ bản chất thật [rival.GetHerHis] bây giờ!"
  rivalry.3001.dominant:1 "[rival.GetSheHe|U] gửi sứ giả, xưng hô với Ta là '[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))] [ROOT.Char.GetTitledFirstName]', gần như cầu xin một trận chiến!"
  rivalry.3001.submissive:0 "Ta tìm thấy một tờ giấy ghi chú trong [ROOT.Char.Custom('GetChamber')] riêng tư của mình, được tuồn vào đó dưới bức màn đêm. "Gửi tên [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))] [ROOT.Char.GetTitledFirstName] hèn hạ", nó bắt đầu như vậy, và chỉ trở nên tồi tệ hơn khi tiếp tục. Tên [rival.Custom2('InsultAdjective', ROOT.Char)] [rival.GetWomanMan] đó thậm chí còn đủ can đảm để ký tên [rival.GetHerHis] vào đó!"
  rivalry.3001.extroverted:1 "Sứ giả của [rival.GetHerHis|U] tiến tới khi Ta đang phát biểu trước [ROOT.Char.Custom('GetCourt')], chào Ta là '[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))] [ROOT.Char.GetTitledFirstName]', rồi tiếp tục làm xấu tên Ta trước mọi người!"
  rivalry.3001.emotional:1 "[rival.GetSheHe|U] gửi sứ giả cáo buộc Ta 'sabotage cả đời [rival.GetFirstNamePossessiveNoTooltip]', gọi Ta là '[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))] [ROOT.Char.GetTitledFirstName]', rồi gây rối."
  rivalry.3001.levelheaded:1 "[rival.GetSheHe|U] đã cử một sứ giả đến, chờ đợi thời cơ hoàn hảo để gọi ta là "Tên [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))] [ROOT.Char.GetTitledFirstName] hèn hạ" như thể vô tình, và sau đó [rival.GetSheHe] hành động như thể tất cả chỉ là một sai lầm."
  rivalry.3001.desc.fallback:1 "[rival.GetSheHe|U] gửi sứ giả gọi Ta là '[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))] [ROOT.Char.GetTitledFirstName]' trước mặt mọi người!"
  rivalry.3001.desc.end:0 "\n\nChuyện này không thể tiếp diễn, ta sẽ đảm bảo [rival.GetSheHe] phải trả giá cho sự xấc xược [rival.GetHerHis] của hắn."
  rivalry.3001.a:0 "Chờ đấy, [rival.GetTitledFirstNameNoTooltip]!"

  rivalry.3002.t:0 "Kẻ Thù Của Bạn ta"
  rivalry.3002.desc:0 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('friend') )] [friend.GetTitledFirstName] của ta gần đây đã phải vật lộn với một sự phiền toái. [rival.GetTitledFirstName] đã chọn [friend.GetHerHim] làm mục tiêu cho tất cả các âm mưu độc ác [rival.GetHerHis] của hắn.\n\nTa là ai mà có thể để kiểu đối xử này với bạn bè của mình tiếp tục chứ?"
  rivalry.3002.a:0 "Ta tố cáo ngươi, [rival.GetTitledFirstNameNoTooltip]!"
  rivalry.3002.b:0 "[rival.GetTitledFirstNameNoTooltip] không cần biết Ta nghĩ gì."

  rivalry.3003.t:0 "Bầy Chuột Tụ Họp"
  rivalry.3003.desc:2 "Có vẻ như [first_friend.GetTitledFirstName] đã tố cáo Ta, nhắc đến sự đối đầu của Ta với [first_friend.GetHerHis] [first_friend.Custom2('RelationToMe', SCOPE.sC('friend') )], [first_friend.Custom2('InsultAdjective', ROOT.Char)] [friend.GetTitledFirstName].\n\nKẻ thù của Ta dường như đang ngày càng nhiều..."
  rivalry.3003.a:0 "Ha! Một bầy cừu."

  rivalry.3004.t:0 "Người Tệ Nhất Có Thể"
  rivalry.3004.opening:0 "Ngay cả khi Ta chưa ghét [rival.GetTitledFirstName] sâu đậm, Ta biết chúng Ta sẽ không bao giờ hòa hợp!"
  rivalry.3004.fallback:0 "\n\n[rival.GetSheHe|U] dường như cư xử trái ngược với Ta trong mọi tình huống!"
  rivalry.3004.a:0 "Chẳng lẽ [rival.GetSheHe] làm vậy chỉ để trêu tức Ta?!"

 
