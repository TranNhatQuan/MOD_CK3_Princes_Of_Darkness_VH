l_english:
 # Tourney Troubles
 #  Initial Event:
  relation_upgrade.0001.t:0 "Rắc Rối Tại Giải Đấu"
  relation_upgrade.0001.desc.opening:0 "Với tư cách [ROOT.Char.GetTitleAsNameNoTooltip], Ta buộc phải tham dự một giải đấu [ROOT.Char.Custom('MartialTournamentAdjective')] địa phương, nhưng các đấu thủ đang bị chậm — giải đấu sẽ không bắt đầu ít nhất một giờ nữa.\n\n"
  relation_upgrade.0001.desc.rival:0 "[rival.Custom2('MyCharacterIntroduction', ROOT.Char)|U] có mặt và, như thường lệ, thật khó chịu. Sự than phiền liên tục của [rival.GetHerHis|U] khiến mọi người #EMP còn thêm#! khó chịu hơn bình thường."
  relation_upgrade.0001.desc.friend:0 "Nhìn quanh, Ta nhận thấy [friend.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đang ngồi dưới một mái hiên gần đó, rõ ràng đang chán đến chết nửa."
  relation_upgrade.0001.desc.lover:0 "Nhìn quanh, ta thấy [lover.Custom2('MyCharacterIntroduction', ROOT.Char)] đang ngồi một mình [lover.GetHerselfHimself] trên khán đài, trông thật cô đơn."
  relation_upgrade.0001.desc.second_friend:0 "\n\nTrong khi đó, [friend.Custom2('MyCharacterIntroduction', ROOT.Char)] đang ngồi dưới mái hiên, rõ ràng chán đến chết nửa..."
  relation_upgrade.0001.desc.second_lover:0 "\n\nTrong khi đó, [lover.Custom2('MyCharacterIntroduction', ROOT.Char)] đang ngồi một mình [lover.GetHerselfHimself] trên khán đài, trông thật cô đơn..."
  relation_upgrade.0001.desc.second_bridge:0 "\n\nMặt khác,"
  relation_upgrade.0001.desc.drink:0 "Ta vừa nhận thấy một thương nhân đang mang một xe đồ uống [ROOT.Char.Custom('GetExpensiveDrink')] tới..."
  relation_upgrade.0001.desc.food:0 "Ta vừa nhận thấy mùi hấp dẫn của [ROOT.Char.Custom('GetExpensiveMeal')] bay từ bếp..."
  relation_upgrade.0001.desc.prowess:0 "Đây có thể là cơ hội tốt để khoe khả năng bản thân và đồng thời làm khán giả phấn khích."
  relation_upgrade.0001.desc.gossip:0 "Đây có thể là cơ hội tốt để nghe lén cuộc trò chuyện của những người tham dự khác."
  relation_upgrade.0001.desc.book:0 "Ta có thể giết thời gian bằng cách đọc [ROOT.Char.GetFaith.ReligiousText] trong lúc chờ."

  relation_upgrade.0001.rival:0 "Đẩy [rival.GetFirstNameNoTooltip] vào máng nước của ngựa để khuấy động không khí."
  relation_upgrade.0001.friend:0 "Dành thời gian với [friend.GetFirstNameNoTooltip] dưới mái hiên."
  relation_upgrade.0001.lover:0 "Mời [lover.GetFirstNameNoTooltip] tham gia cùng Ta cho một trò '[ROOT.Char.Custom('MartialTournamentAdjective')]' của riêng chúng Ta."
  relation_upgrade.0001.drink:0 "Một ly đồ uống ngon luôn cải thiện tâm trạng của Ta!"
  relation_upgrade.0001.food:0 "Một bữa ăn ngon luôn cải thiện tâm trạng của Ta!"
  relation_upgrade.0001.prowess:0 "Ta sẽ khiến đám đông hò reo cổ vũ!"
  relation_upgrade.0001.gossip:0 "Chắc chắn ai đó ở đây biết điều gì đó..."
  relation_upgrade.0001.gossip.tt:0 "Ngài phát hiện một bí mật ngẫu nhiên trong vương quốc"
  relation_upgrade.0001.book:0 "Đọc [ROOT.Char.GetFaith.ReligiousText] luôn là cách sử dụng thời gian tốt."
  relation_upgrade.0001.opt_out:0 "Ta đã lãng phí đủ thời gian cho thảm họa này..."

 # Tourney Troubles
 #  Follow-Up Event:
  relation_upgrade.0011.t:0 "$relation_upgrade.0001.t$"
  relation_upgrade.0011.desc.opening:0 "$relation_upgrade.0001.desc.opening$"
  relation_upgrade.0011.desc.rival:0 "Trong khi Ta than phiền về sự tổ chức tệ hại của giải đấu, [source.Custom2('MyCharacterIntroduction', ROOT.Char)] đột nhiên tiến tới và đẩy Ta thẳng vào máng nước của ngựa, khiến mọi người xung quanh cười rộ lên!"
  relation_upgrade.0011.desc.friend:0 "Khi Ta chờ dưới mái hiên, [source.Custom2('MyCharacterIntroduction', ROOT.Char)] tới bàn Ta và ngồi xuống. \"Một giải đấu tuyệt vời, phải không? Dù sao, dạo này ngươi ra sao?\""
  relation_upgrade.0011.desc.lover:0 "Khi Ta chờ các đấu thủ xuất hiện, [source.Custom2('MyCharacterIntroduction', ROOT.Char)] tiến tới và mời Ta tham gia với [source.GetHerHim] cho một trò '[ROOT.Char.Custom('MartialTournamentAdjective')]' của riêng chúng Ta."

  relation_upgrade.0011.rival.accept:1 "Ngươi #EMP dám#! làm vậy sao [source.GetSheHe]!?"
  relation_upgrade.0011.rival.accept.toast:0 "[rival.GetFirstNameNoTooltip] tỏ ra giận dữ"
  relation_upgrade.0011.rival.decline:0 "Ta đoán #EMP nó#! cũng khá vui..."
  relation_upgrade.0011.rival.decline.toast:0 "[rival.GetFirstNameNoTooltip] cười trừ"
  relation_upgrade.0011.friend.accept:0 "Ah, thật tốt khi gặp ngươi [source.GetFirstNameNoTooltip]!"
  relation_upgrade.0011.friend.accept.toast:0 "Ngài và [friend.GetFirstNameNoTooltip] trở nên quen nhau"
  relation_upgrade.0011.friend.decline:0 "Ôi, xin lỗi, Ta chỉ định đi thôi..."
  relation_upgrade.0011.friend.decline.toast:0 "[friend.GetFirstNameNoTooltip] không quan tâm"
  relation_upgrade.0011.lover.accept:0 "Nghe thú vị hơn cái này nhiều..."
  relation_upgrade.0011.lover.accept.toast:0 "[lover.GetFirstNameNoTooltip] chấp nhận lời mời của Ta"
  relation_upgrade.0011.lover.decline:0 "Ha, trò đùa hay... ngươi #EMP đang#! đùa, đúng không?"
  relation_upgrade.0011.lover.decline.toast:0 "[lover.GetFirstNameNoTooltip] cười trừ Ta"

# relation_upgrade.1001-1999

# Attending a Terrible Party
#	Initial Event:
  relation_upgrade.1001.t:0 "Một Đêm Quên Đi"
  relation_upgrade.1001.desc.intro:0 "Theo [ROOT.GetCharacter.GetFaith.HighGodName], bữa tiệc này #EMP chán ngắt#!! [terrible_party_host.GetFirstName] chắc chắn là chủ tiệc tệ nhất thế gian từng #EMP thấy#!. Làm sao một [ROOT.GetCharacter.GetWomanMan] phàm tục chịu nổi buổi lễ nhàm chán này?\n\nTa liếc quanh căn phòng, tìm một cách giải trí, bất cứ cách nào."
  relation_upgrade.1001.desc.friend:0 "[potential_friend.GetFirstName] vẫy tay thân thiện từ ban công gần đó."
  relation_upgrade.1001.desc.lover:0 "[potential_lover.GetFirstName] thở dài tiếc nuối khi [potential_lover.GetSheHe] đi qua Ta."
  relation_upgrade.1001.desc.rival:0 "Ở góc phòng, [potential_rival.GetFirstName] nhìn Ta bằng ánh mắt đầy thù hận."
  relation_upgrade.1001.desc.outro:0 "Ta phải làm #EMP gì đó#! để buổi tối này không kéo dài nhàm chán."
  relation_upgrade.1001.a:0 "Có lẽ Ta có thể làm quen với [potential_friend.GetFirstNameNoTooltip] hơn?"
  relation_upgrade.1001.a.tt:0 "Ngài chờ phản hồi..."
  relation_upgrade.1001.b:0 "[potential_lover.GetFirstNameNoTooltip], ngươi có muốn đi dạo dưới ánh trăng không?"
  relation_upgrade.1001.b.tt:0 "$relation_upgrade.1001.a.tt$"
  relation_upgrade.1001.c:0 "Này [potential_rival.GetFirstNameNoTooltip], ngươi có muốn nghe Ta #EMP nghĩ thật#! về ngươi không?"
  relation_upgrade.1001.c.tt:0 "[potential_rival.GetFirstNameNoTooltip] phản ứng với lời chỉ trích của Ngài..."
  relation_upgrade.1001.d:0 "Hãy khiêu vũ thôi!"
  relation_upgrade.1001.d.tt_success:0 "Ngài làm bữa tiệc sống động!"
  relation_upgrade.1001.d.tt_success.list:0 "Tất cả [guests|E] và [courtiers|E] tại bữa tiệc"
  relation_upgrade.1001.d.tt_fail:0 "Rõ ràng #EMP NGƯƠI#! đã phá hỏng bữa tiệc của [terrible_party_host.GetFirstNamePossessiveNoTooltip]"
  relation_upgrade.1001.e:0 "Nếu ai đó chặn cửa, nơi này sẽ dễ dàng bốc cháy..."
  relation_upgrade.1001.e.list:0 "$relation_upgrade.1001.d.tt_success.list$"
  relation_upgrade.1001.f:0 "Ta đoán mình sẽ tận dụng tối đa tình huống."
  relation_upgrade.1001.g:0 "Có lẽ Ta sẽ nói chuyện với người mới?"
  relation_upgrade.1001.h:0 "[terrible_party_host.GetFirstName], ngươi là một chủ tiệc tệ!"
  relation_upgrade.1001.h.list:0 "$relation_upgrade.1001.d.tt_success.list$"
  relation_upgrade.1001.i:0 "Lặng lẽ rút lui."

#	Follow-Up, Friend:
  relation_upgrade.1002.t:0 "$relation_upgrade.1001.t$: Bất Cứ Nơi Nào Ngoài Đây"
  relation_upgrade.1002.desc:0 "Ta bị mắc kẹt tại bữa tiệc tra tấn này (mà [terrible_party_host.GetFirstName] hầu như hoàn toàn thất bại trong việc tổ chức) suốt #EMP giờ#!, yếu ớt vẫy tay với mọi người đi qua.\n\nÝ nghĩ nhảy từ ban công bắt đầu hấp dẫn Ta, thì Ta cảm thấy một cái chạm lên vai.\n\n\"Xin lỗi, [potential_friend.GetFirstNameNoTooltip]?\" nói [party_root.GetTitledFirstName], \"ngươi có muốn đi dạo ra khỏi đây không?\""
  relation_upgrade.1002.a:0 "[ROOT.GetCharacter.GetFaith.HighGodName], vâng, bất cứ nơi nào ngoài đây!"
  relation_upgrade.1002.a.tt:0 "[potential_friend.GetFirstNameNoTooltip] chấp nhận lời mời của Ngài"
  relation_upgrade.1002.b:0 "Ehm, cảm ơn, nhưng không cảm ơn."
  relation_upgrade.1002.b.tt:0 "[potential_friend.GetFirstNameNoTooltip] lịch sự từ chối"
  relation_upgrade.1002.c:0 "Với #EMP ngươi#!? Ngươi là người nhàm chán nhất ở đây!"
  relation_upgrade.1002.c.tt:0 "[potential_friend.GetFirstNameNoTooltip] phỉ báng Ngài thay"

#	Follow-Up, Lover:
  relation_upgrade.1003.t:0 "$relation_upgrade.1001.t$: Dạo Bước Dưới Ánh Trăng"
  relation_upgrade.1003.desc:0 "Ta không hiểu [terrible_party_host.GetFirstName] đã thuyết phục Ta tham dự bữa tiệc tệ hại và buồn tẻ của [terrible_party_host.GetHerHis] như thế nào. Ta chỉ có thể nghĩ rằng đó hẳn là một khoảnh khắc điên rồ, hoặc có lẽ lời hứa rằng [party_root.GetTitledFirstName] cũng có thể tham dự.\n\nTa đã đi ngang qua [party_root.GetHerHis] vào tối hôm đó, nhưng [party_root.GetSheHe] dường như không nhận ra tiếng thở dài cô đơn có chủ ý của Ta. Hoặc ít nhất, [party_root.GetSheHe] không phản-\n\n"Người yêu quý của Ta [potential_lover.GetFirstNameNoTooltip]! Muốn đi dạo dưới ánh trăng chứ?""
  relation_upgrade.1003.a:0 "[party_root.GetFirstNameNoTooltip], Ta tưởng ngươi sẽ không bao giờ hỏi!"
  relation_upgrade.1003.a.tt:0 "[potential_lover.GetFirstNameNoTooltip] sẽ rất vui mừng"
  relation_upgrade.1003.b:0 "Thực ra, Ta nghĩ Ta chỉ muốn xem ngươi là Ngài thôi..."
  relation_upgrade.1003.b.tt_custom_relation:0 "[party_root.GetFirstNameNoTooltip] sẽ không còn cố gắng trở thành [lover|E] của Ngài."
  relation_upgrade.1003.b.tt:0 "[potential_lover.GetFirstNameNoTooltip] chỉ muốn làm Ngài"
  relation_upgrade.1003.c:0 "Không. Hiện tại Ta không nhận lời tỏ tình nào."
  relation_upgrade.1003.c.tt:0 "[potential_lover.GetFirstNameNoTooltip] không phản hồi"

#	Follow-Up, Rival:
  relation_upgrade.1004.t:0 "$relation_upgrade.1001.t$: Tiếng La Lét Không Dứt"
  relation_upgrade.1004.desc:0 "Lạy [ROOT.GetCharacter.GetFaith.HighGodName], [terrible_party_host.GetFirstName] không thể tổ chức nổi một bữa tiệc đàng hoàng! Không âm nhạc, thức ăn nhạt nhẽo, không nhảy múa, hầu như không có ánh sáng, và [terrible_party_host.GetSheHe] còn mời cả gã khốn đó, [party_root.GetTitledFirstName]!\n\n"$relation_upgrade.1001.c$" Tên [party_root.GetWomanMan] đáng ghét đó hét lên khắp phòng, thu hút sự chú ý của cả đàn khách đang buồn ngủ và tiến về phía ta, rõ ràng là muốn dạy ta một bài học."
  relation_upgrade.1004.a:0 "Ồ, ngươi muốn nghe những sự thật #EMP thật#! sao, kẻ hèn?"
  relation_upgrade.1004.a.tt:0 "[potential_rival.GetFirstNameNoTooltip] nổi giận đáp lại"
  relation_upgrade.1004.b:0 "Chuyện này dưới tầm Ta."
  relation_upgrade.1004.b.tt:0 "[potential_rival.GetFirstNameNoTooltip] từ chối hạ mình xuống mức của Ngài"
  relation_upgrade.1004.c:0 "Có lẽ... Chúng ta có thể làm Ngài thay vì sao?"

#	Other:
  aloof_but_alluring_modifier:0 "Lạnh Lùng Nhưng Hấp Dẫn"
  aloof_but_alluring_modifier_desc:0 "Nhân vật này dường như khó nói chuyện, nhưng lại tỏa ra sức hút không thể chối từ..."
  inured_to_boredom_modifier:0 "Quen Với Sự Nhàm Chán"
  inured_to_boredom_modifier_desc:0 "Nhân vật này đã quen với những buổi xã giao tẻ nhạt."

# relation_upgrade.2001-2999

  relation_upgrade.2101.t:0 "Mối Quan Hệ Không Lành Mạnh"
  relation_upgrade.2101.desc_opening:0 "[ROOT.Char.Custom('FormOfAddressForLiege')|U], căn bệnh này dễ lây, hãy cẩn thận!"\n\n"
  relation_upgrade.2101.desc_opening_physician:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('physician'))] [physician.GetTitledFirstName] ngăn Ta lại; cơ thể bệnh tật của một thường dân –"
  relation_upgrade.2101.desc_opening_other:0 "Cơ thể bệnh tật của một thường dân –"
  relation_upgrade.2101.desc_bubonic_plague:0 "phủ đầy những cục bướu lớn rỉ mủ và máu –"
  relation_upgrade.2101.desc_smallpox:0 "làn da đầy phát ban và mụn –"
  relation_upgrade.2101.desc_ending:0 "nằm trên bàn. Bất cứ ai tiếp xúc với thi thể đều có nguy cơ nhiễm bệnh, và... và Ta #EMP đã#! dự định đi gần [rival_capital.GetNameNoTierNoTooltip], nơi trú của [rival.Custom2('MyCharacterIntroduction', ROOT.Char)]..."
  relation_upgrade.2101.a:0 "Phóng nó về phía [rival_capital.GetNameNoTierNoTooltip]!"
  relation_upgrade.2101.a_tt:0 "Một người trong triều [rival.GetHerHis] có thể nhiễm bệnh!"
  relation_upgrade.2101.a_tt_rival:0 "[rival.GetTitledFirstName] có thể trở thành đối thủ của Ngài"
  relation_upgrade.2101.a_tt_nemesis:0 "[rival.GetTitledFirstName] có thể trở thành kẻ thù của Ngài"
  relation_upgrade.2101.b:0 "Thi thể có thể chứa manh mối về nguồn gốc căn bệnh."
  relation_upgrade.2101.b_tt:0 "Một triều thần của Ngài nhiễm bệnh"
  relation_upgrade.2101.b_tt_2:0 "Bùng phát dịch bệnh tại [capital.GetNameNoTooltip]"
  relation_upgrade.2101.c:0 "[peasant.GetSheHe|U] sẽ được an táng trang nghiêm."

  relation_upgrade.2102.desc_opening:1 "Đoàn tùy tùng của [corpse_rival.Custom2('MyCharacterIntroduction', ROOT.Char)] dừng lại cách [rival_capital.GetNameNoTier] một đoạn. Trước khi Ta kịp gửi sứ giả, một thứ gì đó được phóng từ trại của họ về phía [rival.Custom('ResidenceBuilding')] của Ta.\n\nMột thi thể tàn tạ, bị bệnh tàn phá, rơi từ trên trời;"
  relation_upgrade.2102.desc_bubonic_plague:0 "phủ đầy những cục bướu lớn rỉ mủ và máu có thể nhìn thấy ngay cả từ nơi Ta đứng"
  relation_upgrade.2102.desc_smallpox:0 "làn da đầy phát ban và mụn có thể nhìn thấy ngay cả từ nơi Ta đứng."
  relation_upgrade.2102.desc_ending:0 "\n\nNó rơi xuống với tiếng bẹp, lan tỏa máu, ruột, và sự hoảng sợ."
  relation_upgrade.2102.a:0 "Nhặt [peasant.GetHerHim] lên – chúng ta sẽ phóng thi thể trở lại!"
  relation_upgrade.2102.b:0 "Thi thể này cần được nghiên cứu."
  relation_upgrade.2102.tt:0 "Một triều thần của [rival.GetTitledFirstNamePossessive] nhiễm bệnh"
  relation_upgrade.2102.b_tt_2:0 "Bùng phát dịch bệnh tại [rival_capital.GetNameNoTooltip]"


 # Character is very passionate about something
  relation_upgrade.2001.t:0 "Đam Mê Nồng Nàn"
  relation_upgrade.2001.lover_dinner.desc:0 "Trong bữa tối,"
  relation_upgrade.2001.lover_party.desc:0 "Tại một bữa tiệc tối ở [lover_1_location.GetNameNoTooltip],"
  relation_upgrade.2001.lover.desc:0 "Ta đã chọn chỗ ngồi cạnh [lover_1.Custom('ComplimentAdjective')] [lover_1.GetTitledFirstName]. [lover_1.GetSheHe|U] đã kéo Ta vào cuộc trò chuyện về [lover_1.Custom('herhis_subject_of_interest')]."
  relation_upgrade.2001.soulmate.desc:0 "[lover_1.Custom('LoverPetName')] [lover_1.GetTitledFirstName] của Ta đang chơi đùa với tóc Ta khi [lover_1.GetSheHe] kể về [lover_1.Custom('herhis_subject_of_interest')]."
  relation_upgrade.2001.relates.desc:0 "\n\nGóc nhìn [lover_1.GetHerHis|U] thật thú vị, tuy nhiên chính niềm đam mê [lover_1.GetHerHis] đối với chủ đề này mới là điều ta ngưỡng mộ nhất. Càng đi sâu, [lover_1.GetSheHe] càng trở nên hoạt bát, và đôi mắt đẹp [lover_1.GetHerHis] đó thực sự đang #EMP rực sáng#!. Ta nghĩ mình có thể lắng nghe [lover_1.GetHerHim] mãi mãi."
  relation_upgrade.2001.does_not_relate.desc:0 "\n\nDù Ta biết ít về những điều này, Ta bị mê hoặc bởi đam mê của [lover_1.GetHerHis] với chủ đề. Đôi mắt đẹp của [lover_1.GetHerHis|U] thật #EMP rực sáng#!, và sự hiểu biết sâu sắc trong lời nói của [lover_1.GetHerHis] rõ ràng ngay cả với người mới như Ta. Ta có thể lắng nghe [lover_1.GetHerHim] mãi."
  relation_upgrade.2001.a:0 "Chúng ta có nên tiếp tục cuộc trò chuyện ở nơi riêng tư hơn không?"
  relation_upgrade.2001.a.success:0 "[lover_1.GetShortUIName|U] chấp nhận lời mời của Ngài"
  relation_upgrade.2001.a.failure:0 "[lover_1.GetShortUIName|U] không hiểu ý"
  relation_upgrade.2001.b:0 "[lover_1.GetFirstNameNoTooltip] — Ta nghĩ Ta yêu ngươi."
  relation_upgrade.2001.b.success:0 "[lover_1.GetShortUIName|U] cũng có cảm giác như vậy"
  relation_upgrade.2001.b.failure:0 "[lover_1.GetShortUIName|U] không cảm thấy giống Ngài"
  relation_upgrade.2001.c:0 "Thật thú vị! Ngươi có thể giải thích một lần nữa không?"

  relation_upgrade.2002.lover_dinner.desc:0 "Trong bữa tối, Ta nhận ra mình ngồi cạnh [lover_2.Custom('ComplimentAdjective')] [lover_2.GetTitledFirstName]."
  relation_upgrade.2002.lover_party.desc:0 "[lover_2.Custom('ComplimentAdjective')] [lover_2.GetTitledFirstName] là khách mời bất ngờ nhưng dễ chịu tại bữa tiệc tối của Ta."
  relation_upgrade.2002.lover.desc:0 "Chúng ta kết thúc bằng việc nói về [lover_1.Custom('my_subject_of_interest')] — một chủ đề ta có thể dành hàng giờ để nói. Thật vui là [lover_2.GetFirstNameNoTooltip] là một người lắng nghe tuyệt vời. Sự quan tâm [lover_2.GetHerHis|U] đối với những gì ta nói dường như rất chân thành, và những câu hỏi tiếp theo [lover_2.GetHerHis] rất chu đáo và thông minh.\n\nTrước khi ta nhận ra, chúng ta là những người cuối cùng còn lại tại bàn ăn. Khi [lover_2.GetFirstNameNoTooltip] nghiêng người lại gần để nghe rõ hơn, ta có thể cảm thấy nhịp tim mình đập nhanh hơn..."
  relation_upgrade.2002.c.lover:0 "Uhm, vâng, như Ta vừa nói..."
  relation_upgrade.2002.soulmate.desc:0 "Ta đang vô tư nghịch ngợm [lover_2.Custom('LoverPetName')] [lover_2.GetTitledFirstNamePossessive] của mình, đầu [lover_2.GetHerHis] tựa vào ngực ta, khi ta kể cho [lover_2.GetHerHim] nghe về [lover_1.Custom('my_subject_of_interest')]. [lover_2.GetSheHe|U] là một người lắng nghe tuyệt vời — khuyến khích ta bằng những tiếng hừ nhẹ và cái gật đầu, và đặt những câu hỏi đầy suy ngẫm. Cách [lover_2.GetSheHe] thực sự quan tâm đến một chủ đề gần gũi với trái tim ta khiến ta cảm thấy vô cùng ấm áp."
  relation_upgrade.2002.c.soulmate:0 "Ngươi là người nghe rất tốt, ngươi có biết không?"

  relation_upgrade.2003.lover.desc:0 "Khi Ta nghiêng người và đề xuất, ánh mắt [lover_1.GetFirstNamePossessive] lóe lên một loại đam mê khác. [lover_1.GetSheHe|U] do dự một chút, má đỏ bừng, nhưng mâu thuẫn bên trong [lover_1.GetHerHis] nhanh chóng được giải quyết.\n\n\"Chờ ở đây một chút, để không ai nghi ngờ. Rồi hãy đến phòng Ta.\" Khi [lover_1.GetFirstNameNoTooltip] vội đi, Ta không rời mắt khỏi [lover_1.GetHerHim]."
  relation_upgrade.2003.soulmate_start.desc:0 "Lời tỏ tình của Ta khiến [lover_1.GetFirstName] bất ngờ. Tay [lover_1.GetHerHis|U] trở nên bất động trong tóc Ta, và Ta cảm nhận tim [lover_1.GetHerHis] đập trên má Ta. Tim Ta cũng đập mạnh."
  relation_upgrade.2003.soulmate_end.desc:0 "\"Thật sao, [lover_2.GetFirstNameNoTooltip]? Ta cũng đã cảm nhận như vậy từ lâu, nhưng Ta không nghĩ...\"\n\nNụ hôn sau đó là ngọt ngào nhất Ta từng biết."
  relation_upgrade.2003.a:0 "Người [lover_1.GetWomanMan] thật tuyệt vời!"
  relation_upgrade.2003.b:0 "Ta là [lover_2.GetWomanMan] hạnh phúc nhất ở [realm.GetNameNoTierNoTooltip]!"

  relation_upgrade.2004.lover.desc:0 "[lover_1.GetFirstName] không hiểu ý Ta — hoặc có lẽ [lover_1.GetSheHe] phớt lờ để tránh Ta bị từ chối xấu hổ.\n\nCuộc trò chuyện về [lover_1.Custom('my_subject_of_interest')] tiếp tục. May mắn thay, sự quan tâm của [lover_1.GetFirstNameNoTooltip] với chủ đề này vượt qua sự bối rối của Ta."
  relation_upgrade.2004.soulmate_end.desc:0 "\"Ta quan tâm đến ngươi, [lover_2.GetFirstNameNoTooltip], và Ta thích thời gian bên nhau. Chúng ta cứ dừng ở đó được chứ?\"\n\nSau lời xin lỗi ngượng ngùng, Ta trở lại cuộc trò chuyện về [lover_1.Custom('my_subject_of_interest')], cố gắng xua tan căng thẳng giữa chúng Ta."
  relation_upgrade.2004.a:0 "Thật ngớ ngẩn khi Ta đưa ra giả định như vậy..."
 
  relation_upgrade.3000.t:0 "Hận Thù Nảy Nở"
  relation_upgrade.3000.desc:0 "[rival_to_be.Custom2('InsultAdjective', ROOT.Char)] [rival_to_be.Custom2('InsultNoun', ROOT.Char)] [rival_to_be.GetFirstName] khiến máu Ta sôi lên! Làm sao [ROOT.GetCharacter.GetFaith.HighGodName] có thể nguyền rủa trái đất với [rival_to_be.GetFirstNamePossessiveNoTooltip] [rival_to_be.Custom2('InsultAdjective', ROOT.Char)] [rival_to_be.Custom2('InsultNounPlural', ROOT.Char)]!? Không, rõ ràng — [rival_to_be.GetSheHe] là họ hàng [ROOT.GetCharacter.GetFaith.DevilNamePossessive]. [rival_to_be.GetSheHe|U] còn tệ hơn cả bọc mủ thối và châu chấu háu ăn.\n\nTa không thể chịu nổi #EMP suy nghĩ đơn giản#! về việc hít thở cùng bầu không khí [rival_to_be.Custom2('InsultAdjective', ROOT.Char)] với [rival_to_be.GetHerHim]! Ta phải làm gì đó, Ta phải hành động.\n\nSự tỉnh táo của Ta phụ thuộc vào điều đó."
  relation_upgrade.3000.a:0 "Ta sẽ không yên cho tới khi [rival_to_be.GetFirstNameNoTooltip] chết và bị chôn..."
  relation_upgrade.3000.b:0 "Không! Ta không thể để cơn thù hận điều khiển đời Ta!"
 
  driven_by_vengeance_modifier:0 "Bị Thúc Đẩy Bởi Thù Hận"
  driven_by_vengeance_modifier_desc:0 "Nhân vật này tìm động lực từ việc theo đuổi sự sụp đổ của đối thủ."
