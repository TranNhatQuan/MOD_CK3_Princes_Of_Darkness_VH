l_english:
  bishop.2001.t:0 "Đặc Quyền Của Giáo Sĩ"
  bishop.2001.desc.a:0 "[scoped_bishop.GetCouncilTitle] [scoped_bishop.GetFirstName] vô cùng giận dữ. \n\n[scoped_bishop.GetSheHe|U] tuyên bố rằng ta không có quyền giam giữ [scoped_prisoner.GetTitledFirstName] như tù nhân của ta. "[scoped_prisoner.GetSheHe|U] là một [scoped_prisoner.GetWomanMan] của giáo hội! Bất kể tội ác [scoped_prisoner.GetHerHis] là gì, không một kẻ cai trị thế tục nào có quyền phán xét [scoped_prisoner.GetHerHim]!""
  bishop.2001.desc.b:0 "Tù nhân của ta, [scoped_prisoner.GetTitledFirstName], đọc một đoạn từ [scoped_prisoner.GetFaith.ReligiousText] với giọng điệu kiên định và ngước nhìn lên, chờ đợi sự phán xét [scoped_prisoner.GetHerHis]. "[scoped_prisoner.GetFirstNameNoTooltip] đã chứng minh là một thành viên của giáo sĩ," [scoped_bishop.GetCouncilTitle] [scoped_bishop.GetFirstName] tuyên bố, đứng ngay cạnh tù nhân và dành cho ta một ánh nhìn đầy khinh bỉ. "Vì thế, [scoped_prisoner.GetSheHe] phải được đặt dưới sự giám hộ của giáo hội.""
  bishop.2001.desc.c:0 "[scoped_prisoner.GetTitledFirstName] đọc một đoạn từ [scoped_prisoner.GetFaith.ReligiousText] với giọng run rẩy, cuốn sách được giữ trước mặt [scoped_prisoner.GetHerHim], rồi im lặng.\n\n\"[scoped_prisoner.GetFirstNameNoTooltip] đã chứng minh mình là một thành viên của giáo sĩ,\" [scoped_bishop.GetCouncilTitle] [scoped_bishop.GetFirstName] nói, đứng cạnh tù nhân và nhìn ta với ánh mắt khinh miệt. \"Do đó, [scoped_prisoner.GetSheHe] phải được giao cho giáo hội quản thúc.\""
  bishop.2001.a:0 "Chắc hẳn [scoped_prisoner.GetSheHe] có thể đọc một đoạn *do ta chọn*?"
  tooltip.bishop.2001.a.success:0 "[scoped_prisoner.GetTitledFirstName] đọc đúng đoạn kinh"
  bishop.2001.success.a.desc.tt:0 "[scoped_prisoner.GetTitledFirstName] được giao cho giáo hội quản thúc."
  tooltip.bishop.a.2001.fail:0 "[scoped_prisoner.GetTitledFirstName] không thể đọc câu thứ hai"
  bishop.2001.failure.a.desc.tt:0 "[scoped_prisoner.GetTitledFirstName] bị ném trở lại ngục tối."
  bishop.2001.b:0 "Ngươi không cho ta lựa chọn nào khác."
  bishop.2001.c:0 "Đừng vấp ngã trên đường ra ngoài..."
  tooltip.bishop.c.2001.success:0 "[scoped_prisoner.GetTitledFirstName] gặp tai nạn"
  bishop.2001.success.c.desc.tt:0 "[scoped_prisoner.GetFirstName] chết sau khi được trả tự do [scoped_prisoner.GetHerHis]."
  tooltip.bishop.c.2001.fail:0 "[scoped_prisoner.GetTitledFirstName] rời đi an toàn"
  bishop.2001.failure.c.desc.tt:0 "[scoped_prisoner.GetFirstName] thoát khỏi sát thủ của ta!"
  bishop.2001.d:0 "Đây là tù nhân của ta, [scoped_prisoner.GetSheHe] sẽ ở lại ngục của ta!"
 
  bishop.2002.t:1 "Gia Đình [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] Của Ta"
  bishop.2002.desc.b:0 "Ta giơ tay gọi [scoped_relative.GetFirstName] từ phía bên kia đại sảnh, nhưng [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_relative'))] của Ta chỉ đáp lại bằng ánh nhìn ngượng ngùng trước khi vội vàng rời đi."
  bishop.2002.desc.c:0 "Ta nhìn quanh bàn ăn, cố gắng bắt chuyện, nhưng chỉ thấy những ánh nhìn lúng túng và những cái đầu quay đi."
  bishop.2002.desc.a:0 "\n\nChính gia đình Ta đã bị [scoped_bishop.Custom2('InsultAdjective', ROOT.Char)] [scoped_bishop.Custom2('InsultNoun', ROOT.Char)] kia — [scoped_bishop.GetCouncilTitle] [scoped_bishop.GetFirstName] — quay lưng chống lại Ta. [scoped_bishop.GetSheHe|U] đã hình thành thói quen thì thầm những lời dối trá vào tai người thân của Ta mỗi khi họ tìm đến [scoped_bishop.GetHerHim] để xin lời khuyên tâm linh, nói rằng Ta là một [ROOT.Char.GetTitleTierName] độc ác và rằng [ROOT.GetCharacter.GetFaith.HighGodName] đã nguyền rủa dòng tộc của chúng Ta."
  bishop.2002.a:0 "Ta cũng có vài điều muốn nói về [scoped_bishop.GetHerHim]..."
  tooltip.bishop.2002.a.success:0 "Ta thuyết phục người thân rằng [scoped_bishop.GetTitledFirstName] đang nói dối"
  bishop.2002.success.a.desc.tt:0 "Ta vạch trần âm mưu vu khống ta [scoped_bishop.GetFirstNamePossessive]."
  tooltip.bishop.a.2002.fail:0 "Gia đình ta không bị lời nói của ta lay chuyển"
  bishop.2002.failure.a.desc.tt:0 "Người thân của ta từ chối lắng nghe."
  bishop.2002.b:0 "Có lẽ một màn sám hối công khai sẽ giúp ích?"
  bishop.2002.c:0 "Ta sẽ không để một [scoped_bishop.GetCouncilTitle|U] phá hoại mình!"

  bishop.2003.t:0 "Vị Linh Mục Của Dân Chúng"
  bishop.2003.desc:0 "Không ngày nào trôi qua mà [scoped_bishop.GetCouncilTitle] [scoped_bishop.GetFirstName] không chế giễu ta trong các bài giảng của [scoped_bishop.GetHerHis].\n\nTên [scoped_bishop.Custom2('InsultNoun', ROOT.Char)] ám ảnh đó tin chắc rằng ta là tay sai của [ROOT.Char.GetFaith.DevilName] và sẽ không nghỉ cho đến khi [scoped_bishop.GetSheHe] khiến nông dân quay lưng chống lại ta."
  bishop.2003.a:0 "Một khoản quyên góp và vài nhượng bộ sẽ làm [scoped_bishop.GetHerHim] dịu lại..."
  bishop.2003.b.a:0 "Mọi thứ vẫn nằm trong tầm kiểm soát của ta!"
  bishop.2003.b.b:0 "Hừ. Cùng lắm thì chuyện gì có thể xảy ra?"
  bishop.2003.c:0 "Ta sẽ không dung thứ sự bất tuân từ chính chư hầu của mình!"
  bishop.2003.c.infidel:0 "Đã đến lúc khiến [scoped_bishop.GetHerHim] im miệng mãi mãi."
  bishop.2002.everyrelative.custom:0 "Mọi [family_member|E] [scoped_bishop.GetFaith.GetAdjective] khác trong gia đình ta"
  bishop.2002.everypiousrelative.custom:0 "Mọi [family_member|E] ngoan đạo theo [scoped_bishop.GetFaith.GetAdjective] trong gia đình ta"
  bishop.2003.countyunrest.custom:0 "Mọi [county|E] theo [scoped_bishop.GetFaith.GetAdjective] trong [domain|E] của ta"
  bishop.2003.everytheocrat.custom:0 "Mọi chư hầu [theocratic|E] theo [scoped_bishop.GetFaith.GetAdjective]"
 
  bishop.2004.t:0 "Trong Mắt Những Kẻ Cuồng Tín"
  bishop.2004.desc:0 "[scoped_bishop.GetCouncilTitle] của ta, [scoped_bishop.GetFirstName], gần đây luôn phàn nàn về cái gọi là 'sự thiếu mộ đạo' của ta trong mọi bài giảng.\n\nRõ ràng [scoped_bishop.GetSheHe] thậm chí còn gọi ta là một 'kẻ vô đạo [root_scope.Custom2('InsultNoun', SCOPE.sC('scoped_bishop'))]', và những chư hầu cuồng tín hơn của ta bắt đầu lắng nghe [scoped_bishop.GetHerHim]..."
  bishop.2004.theologian:0 "Đây là những lời nói dối và vu khống trắng trợn!"
  bishop.2004.a:0 "Có lẽ thêm một 'khoản quyên góp thiện chí' sẽ giúp..."
  bishop.2004.b:0 "Hừ! Cứ để họ tin những gì họ muốn."
