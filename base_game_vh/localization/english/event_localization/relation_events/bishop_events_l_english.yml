l_english:
  bishop.1001.opening:0 "[bishop.Custom2('AppropriateGreeting', ROOT.Char)]"
  bishop.1001.desc:0 "Bổn phận của Ta là phải thông báo với ngài rằng những bằng chứng không thể chối cãi đã được phát hiện, chứng minh rằng cuộc hôn nhân của ngài với [spouse.GetTitledFirstName] có quan hệ huyết thống gần gũi. Thông tin này sẽ chỉ nằm giữa hai chúng ta nếu ngài lập tức chấm dứt cuộc hôn nhân bất kính này."
 bishop.1001.desc.actually_incestuous: "This information will stay between the two of us if you end this unholy union at once."
 bishop.1001.desc.made_up: "This... #EMP irrefutable#! information will stay between the two of us if you end this #EMP clearly#! unholy union at once."
  bishop.1001.a:0 "Tất nhiên rồi, [bishop.GetTitledFirstNameNoTooltip]."
  bishop.1001.a.tt:1 "@warning_icon! #X Ngài ly hôn với [spouse.GetUIName]#!"
  bishop.1001.b:0 "Cuộc hôn nhân của chúng ta sẽ không bị phá vỡ bởi một lời nói dối trắng trợn như vậy!"
  bishop.1001.b.success:0 "Ta chứng minh rằng cáo buộc này là giả"
  bishop.1001.b.failure:0 "Cáo buộc này quả thực không thể chối cãi"
  bishop.1001.c:0 "Dám nói dối về chuyện như thế... ta sẽ chỉnh đốn [bishop.GetHerHim]."
  bishop.1001.c.success:0 "Ta bảo vệ thành công sự thiêng liêng của cuộc hôn nhân"
  bishop.1001.c.failure:0 "[bishop.GetTitledFirstNameNoTooltip] không bị thuyết phục"
  bishop.1001.d:0 "Chắc hẳn chuyện này có thể... bị lãng quên?"

  bishop.1011.desc_opening:0 "Việc ngài tham gia vào [faction.GetNameNoTooltip] nhằm chống lại [targeting.GetTitledFirstName] là điều hết sức không thích hợp — nếu ngài không rút lui, ta sẽ buộc phải có những hành động quyết liệt."
  bishop.1011.desc_cannibal:0 "\n\nNhân tiện, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('cannibal_food'))] của ngài, [cannibal_food.GetTitledFirstName], trông thật ngon miệng. Sẽ thật #EMP đáng tiếc#! nếu có chuyện gì đó xảy ra với [cannibal_food.GetHerHim]..."
  bishop.1011.desc_beating:0 "\n\nMột nhóm cuồng tín đang lang thang gần đây, ban phát “sự trừng phạt thiêng liêng” với rất ít lòng thương xót. [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('to_beat_up'))] của ngài, [to_beat_up.GetTitledFirstName], đôi khi vẫn đi một mình ngoài phố, đúng không...?"
  bishop.1011.a:0 "Ta không muốn chọc giận [bishop.GetFaith.HouseOfWorship]."
  bishop.1011.b:0 "Lời đe dọa của ngươi chẳng làm hại được ta!"
  bishop.1011.b.tt:1 "Ngài phớt lờ những lời đe dọa úp mở"
  bishop.1011.b.outcome:0 "Bị Phát Hiện Chảy Máu Ngoài Đường"
  all_my_theocratic_vassals:0 "Tất cả chư hầu thần quyền của ta"
  bishop.1011.c:0 "Hãy để ta giải thích lý do của mình..."
  bishop.1011.c.success_vassal:0 "[bishop.GetTitledFirstNameNoTooltip] bị thuyết phục đến mức [bishop.GetSheHe] còn lôi kéo thêm một đồng sự ủng hộ"
  bishop.1011.c.success:0 "[bishop.GetTitledFirstNameNoTooltip] hiểu được động cơ của ta"
  bishop.1011.c.failure:0 "[bishop.GetTitledFirstNameNoTooltip] không hề ấn tượng"
  bishop.1011.c.failure.tt:0 "[bishop.GetSheHe|U] sẽ có hành động quyết liệt"

  bishop.1012.title:0 "Sự Biến Mất Bí Ẩn"
  bishop.1012.desc:0 "[cannibal_food.GetTitledFirstName] đã biến mất, chỉ để lại một vũng máu phía sau..."
 
