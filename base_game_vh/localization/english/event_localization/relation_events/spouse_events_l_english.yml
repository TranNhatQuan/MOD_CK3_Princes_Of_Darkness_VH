l_english:
  spouse.0001.t:0 "Những Điều Chúng Ta Chia Sẻ"
  spouse.0001.desc:0 "Khi chúng Ta trò chuyện về cuộc sống, [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] và Ta thường đồng ý. Ta chỉ biết rằng [spouse.GetFirstName] hiểu cách Ta nhìn nhận thế giới."
  spouse.0001.a:0 "Ta thật may mắn khi có người hiểu mình."
  spouse.0002.t:0 "Những Điều Chúng Ta Chia Sẻ"
  spouse.0002.desc:0 "Một ngày gần đây, [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('first_spouse'))] của Ta, [first_spouse.GetFirstName], nói rằng [first_spouse.GetSheHe] cảm thấy Ta là một trong số ít người thực sự hiểu [first_spouse.GetHerHim]. Ta hoàn toàn hiểu ý [first_spouse.GetSheHe] khi [first_spouse.GetSheHe] nói như vậy."
  spouse.0002.a:0 "Chúng Ta gắn kết bởi nhiều thứ hơn chỉ là hôn nhân."
  spouse.0003.t:0 "Những Điều Chúng Ta Làm"
  spouse.0003.desc:0 "Đôi khi Ta nghĩ rằng không ai Ta muốn dành thời gian cùng hơn là [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] [spouse.GetFirstName]. Trong tất cả những việc có thể làm trong đời, chúng Ta tận hưởng rất nhiều sở thích chung."
  spouse.0003.a:0 "Cuộc sống có thể được chia sẻ theo nhiều cách."
  spouse.0004.t:0 "Những Điều Chúng Ta Chia Sẻ"
  spouse.0004.desc:0 "Trong số tất cả những người tại [ROOT.Char.Custom('GetCourt')] của ta mà [first_spouse.GetSheHe] có thể dành thời gian [first_spouse.GetHerHis] cùng, [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] của ta là [first_spouse.GetFirstName] lại dành hết mức có thể để ở bên ta.\n\n[first_spouse.GetSheHe|U] thực sự thích những việc chúng ta làm cùng nhau!"
  spouse.0004.a:0 "Cuộc sống có thể được chia sẻ theo nhiều cách."
  spouse.0005.t:0 "Bất Đồng Hôn Nhân"
  spouse.0005.desc:0 "Dù Ta giải thích bao nhiêu lần về lý do Ta làm những việc Ta làm, [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] của Ta không bao giờ hoàn toàn hiểu Ta. [spouse.GetFirstName] và Ta dường như hoàn toàn khác biệt."
  spouse.0005.a:0 "Chúng ta phải ở bên nhau dù muốn hay không."
  spouse.0006.t:0 "Bất Đồng Hôn Nhân"
  spouse.0006.desc:0 "Ta không hiểu [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('from_spouse') )] của mình, [from_spouse.GetFirstName]. [from_spouse.GetSheHe|U] cố giải thích lý do [from_spouse.GetSheHe] làm những việc [from_spouse.GetSheHe] làm, nhưng với Ta điều đó chẳng có nghĩa gì. Chúng Ta có phải quá khác nhau không?"
  spouse.0006.a:0 "[from_spouse.GetSheHe|U] đang không làm mọi thứ dễ dàng cho Ta."
  spouse.0007.t:0 " Bạn của bạn"
  spouse.0007.desc:1 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('friend_in_common') )] của Ta, [friend_in_common.GetTitledFirstName], đã nói với Ta về việc [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] [spouse.GetFirstName] là một người Bạn Tốt thế nào với [friend_in_common.GetHerHim]. Biết cách [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] đối xử với người khác khiến Ta càng thêm tôn trọng [spouse.GetHerHim]."
  spouse.0007.a:0 "Điều đó làm Ta mỉm cười."
  spouse.0008.t:0 " Bạn của bạn"
  spouse.0008.desc:1 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('first_spouse') )] của Ta, [first_spouse.GetFirstName], đã gửi nhiều nụ cười ấm áp hơn thường lệ, nói rằng nhìn thấy Ta làm ấm lòng [first_spouse.GetHerHis]. Hình như Ngài chung của chúng Ta, [friend_in_common.GetTitledFirstName], đã nói với [first_spouse.GetHerHim] rằng Ta là một người Bạn Tốt!"
  spouse.0008.a:1 "Cảm ơn ngươi, [friend_in_common.GetFirstNameNoTooltip]!"
  spouse.0008.b:1 "[ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('first_spouse') )] của Ta đã dành bao nhiêu thời gian với [friend_in_common.GetHerHim]?"
  spouse.0009.t:0 "Thân Thiện Nhưng Nghi Ngờ"
  spouse.0009.desc:0 "Dù Ta bày tỏ tình cảm với [spouse.GetFirstName], Ta nhận lại phản ứng lạnh lùng, nghi ngờ. Hình như Ta đã dành quá nhiều thời gian với Ngài chung, [friend_in_common.GetTitledFirstName]."
  spouse.0009.a:0 "Sao [spouse.GetSheHe] dám vậy?"
  spouse.0009.has_lover_tooltip:1 "[spouse.GetFirstNameNoTooltip] không thể biết được. Liệu [spouse.GetSheHe] có biết không?"
 
  spouse.1001.t:0 "Thời Gian Chúng Ta Dành Cho Nhau"
  spouse.1001.desc:0 "Ta có thể không giữ [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] thật gần trái tim, nhưng càng dành nhiều thời gian với [spouse.GetFirstName], Ta càng bắt đầu hiểu [spouse.GetHerHim]."
  spouse.1001.a:0 "Có lẽ theo thời gian Ta sẽ yêu [spouse.GetHerHim]."
  spouse.1002.t:0 "Thời Gian Chúng Ta Dành Cho Nhau"
  spouse.1002.desc:0 "Khi Ta và [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] dành nhiều thời gian bên nhau, Ta thấy [first_spouse.GetHerHim] dần ấm áp với Ta. [first_spouse.GetFirstName] nói rằng [first_spouse.GetSheHe] liên tục thấy những khía cạnh mới của Ta."
  spouse.1002.a:0 "Có lẽ [first_spouse.GetSheHe] cũng sẽ yêu Ta theo thời gian."
  spouse.1003.t:0 "Thời Gian Chúng Ta Dành Cho Nhau"
  spouse.1003.desc:0 "Ta không giữ [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] thật gần trái tim, và càng dành nhiều thời gian với [spouse.GetFirstName], Ta càng hiểu lý do tại sao. Mọi việc [spouse.GetSheHe] làm đều khiến Ta hơi khó chịu."
  spouse.1003.a:0 "Ta phải sống cả đời với người này."
  spouse.1004.t:0 "Thời Gian Chúng Ta Dành Cho Nhau"
  spouse.1004.desc:0 "Ta không thể tưởng tượng nhầm. [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('spouse') )|U] [first_spouse.GetFirstName] dường như càng trở nên khó chịu hơn khi chúng Ta dành nhiều thời gian bên nhau. Nếu Ta không biết gì hơn, Ta sẽ nghĩ mình đang làm phiền [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )]!"
  spouse.1004.a:0 "Hãy dành ít thời gian bên nhau hơn một thời gian."
  spouse.2001.t:0 "Một Niềm An Ủi"
  spouse.2001.opening:0 "Với nhiều việc cần làm mà thời gian lại ít, Ta không biết mình sẽ xoay xở thế nào nếu không có [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('spouse') )] yêu thương, [spouse.GetFirstName]."
  spouse.2001.chaste:0 "\n\n[spouse.GetSheHe|U] cho Ta biết [spouse.GetSheHe] luôn ở bên tinh thần Ta trong mọi khó khăn."
  spouse.2001.lustful:0 "\n\n[spouse.GetSheHe|U] tiếp thêm sinh lực cho Ta trong những đêm nóng bỏng, nhắc nhở Ta về niềm đam mê cần thiết để vượt qua thử thách."
  spouse.2001.temperate:0 "\n\n[spouse.GetSheHe|U] nhắc Ta rằng mọi thứ đều phải đo lường, kẻo Ta tự phá vỡ bản thân."
  spouse.2001.gluttonous:0 "\n\n[spouse.GetSheHe|U] biết chính xác khi nào Ta cần được giải trí bằng đồ ăn ngon và rượu."
  spouse.2001.generous:0 "\n\n[spouse.GetSheHe|U] đã dành rất nhiều tình cảm [spouse.GetHerselfHimself] để ủng hộ ta."
  spouse.2001.greedy:0 "\n\n[spouse.GetSheHe|U] luôn tìm cách mới để Ta đạt được mục tiêu."
  spouse.2001.diligent:0 "\n\nKhi mọi thứ quá tải, [spouse.GetSheHe] giúp Ta, cầm bút khi cần, chưa từng than phiền."
  spouse.2001.lazy:0 "\n\n[spouse.GetSheHe|U] đảm bảo Ta nghỉ ngơi đầy đủ khi cần."
  spouse.2001.wrathful:0 "\n\n[spouse.GetSheHe|U] loại bỏ những việc không quan trọng thay Ta, nguyền rủa những người đưa thư phiền phức."
  spouse.2001.calm:0 "\n\n[spouse.GetSheHe|U] cân nhắc mọi việc công bằng, giúp Ta quản lý những việc không khẩn cấp."
  spouse.2001.impatient:0 "\n\n[spouse.GetSheHe|U] luôn tìm cách giúp Ta hoàn thành công việc nhanh hơn, kết thúc ngày sớm hơn."
  spouse.2001.patient:0 "\n\n[spouse.GetSheHe|U] đảm bảo Ta dành thời gian cho mọi việc cần làm, nhắc Ta rằng dù lâu đến đâu, Ta sẽ vượt qua."
  spouse.2001.stubborn:0 "\n\n[spouse.GetSheHe|U] thúc giục Ta, đảm bảo Ta không bỏ cuộc cho tới khi xong việc."
  spouse.2001.fickle:0 "\n\n[spouse.GetSheHe|U] luôn tìm việc mới cho Ta, để Ta quên đi những gánh nặng trên vai."
  spouse.2001.humble:0 "\n\n[spouse.GetSheHe|U] nhắc Ta rằng công việc là bổn phận, và quan trọng nhất là hoàn thành với danh dự."
  spouse.2001.arrogant:0 "\n\n[spouse.GetSheHe|U] nhắc Ta rằng Ta làm điều mình muốn, và chỉ có [ROOT.Char.GetFaith.HighGodName] mới có quyền phán xét Ta."
  spouse.2001.deceitful:0 "\n\n[spouse.GetSheHe|U] luôn nhắc Ta rằng mọi thứ sẽ ổn."
  spouse.2001.honest:0 "\n\n[spouse.GetSheHe|U] luôn nói rằng dù nhiều việc, [spouse.GetSheHe] tin Ta có thể làm được."
  spouse.2001.craven:0 "\n\n[spouse.GetSheHe|U] luôn giúp Ta tránh những nhiệm vụ Ta ít muốn thực hiện."
  spouse.2001.brave:0 "\n\n[spouse.GetSheHe|U] khích lệ Ta đối mặt thử thách, không để áp lực làm gục ngã."
  spouse.2001.shy:0 "\n\n[spouse.GetSheHe|U] giúp Ta tránh các quan chức và người đưa thư, khi họ mang thêm nhiều việc."
  spouse.2001.gregarious:0 "\n\nKhi có việc mới, [spouse.GetSheHe] biết cách trò chuyện để giải quyết như không ai khác."
  spouse.2001.ambitious:0 "\n\n[spouse.GetSheHe|U] nhắc Ta lý do làm việc và phần thưởng phía trước."
  spouse.2001.content:0 "\n\n[spouse.GetSheHe|U] nhắc Ta rằng cuối cùng mọi việc cũng không quá quan trọng. Mọi thứ sẽ tốt, dù vài nhiệm vụ chưa xong."
  spouse.2001.arbitrary:0 "\n\n[spouse.GetSheHe|U] giúp Ta chọn nhiệm vụ cần hoàn thành, và những gì có thể bỏ qua."
  spouse.2001.just:0 "\n\n[spouse.GetSheHe|U] giữ Ta tập trung, dành sự xem xét xứng đáng cho mọi việc."
  spouse.2001.cynical:0 "\n\n[spouse.GetSheHe|U] cho Ta những nụ cười an ủi, nhắc rằng quan trọng là Ta được thấy đang làm việc, không phải kết quả."
  spouse.2001.zealous:0 "\n\nKhi quá tải, [spouse.GetSheHe] giúp Ta cầu nguyện, để [ROOT.Char.GetFaith.HighGodName] ban sức mạnh."
  spouse.2001.paranoid:0 "\n\n[spouse.GetSheHe|U] chỉ ra ai đang gây rắc rối cho Ta, và ai Ta nên lơ đi."
  spouse.2001.trusting:0 "\n\n[spouse.GetSheHe|U] giữ Ta tập trung vào những người dựa vào Ta hoàn thành bổn phận, và mọi người phải làm tròn trách nhiệm."
  spouse.2001.compassionate:0 "\n\n[spouse.GetSheHe|U] thật tốt bụng và ân cần, luôn lắng nghe những lo lắng của ta và chia sẻ lời khuyên cũng như sự ủng hộ [spouse.GetSheHe] có thể."
  spouse.2001.callous:0 "\n\n[spouse.GetSheHe|U] không kiên nhẫn với "kẻ vô dụng" lãng phí thời gian Ta, và [spouse.GetSheHe] vui mừng cho họ nghe điều đó."
  spouse.2001.sadistic:0 "\n\nKhi Ta khổ sở, nụ cười [spouse.GetHerHis] ngày càng rộng để ủng hộ Ta, khi Ta vật lộn với nhiệm vụ."
  spouse.2001.vengeful:0 "\n\n[spouse.GetSheHe|U] có lời cay nghiệt với những kẻ yêu cầu quá nhiều từ Ta, và nghe ai đó nguyền rủa tên họ thật nhẹ nhõm."
  spouse.2001.forgiving:0 "\n\n[spouse.GetSheHe|U] thông cảm cho hoàn cảnh Ta, nhắc rằng sau thời gian căng thẳng, sự bỏ bê các khía cạnh khác của đời Ta sẽ được tha thứ."
  spouse.2001.a:1 "Không ai làm Ta mỉm cười như [spouse.GetFirstNameNoTooltip] thân yêu."
  spouse.2002.t:0 "Một Lời Khen"
  spouse.2002.desc:0 "Trong một chuyến thăm, dường như Ta đã thu hút sự chú ý của [told_of_character.GetFirstNamePossessive], dù chỉ thoáng qua. Đây có thể là cơ hội để nói lời tốt đẹp về [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('spouse') )] [spouse.GetFirstName]."
  spouse.2002.a:0 "Hãy để Ta nói về [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )]..."
  spouse.2002.b:0 "Hãy để Ta nói về chính Ta..."
  spouse.2003.t:0 "Một [spouse.GetWomanMan] Đáng Vỗ Tay"
  spouse.2003.opening:0 "Trong chuyến thăm gần đây, [initial_spouse.GetTitledFirstName] nói nhiều về [initial_spouse.GetHerHis] [initial_spouse.Custom2('RelationToMe' , SCOPE.sC('spouse') )], [spouse.GetTitledFirstName]."
  spouse.2003.exceptional:0 "\n\nThành thật mà nói, Ta chưa nhận ra [spouse.GetSheHe] là [spouse.GetWomanMan] tuyệt vời thế này!"
  spouse.2003.a:1 "Cảm ơn đã cho Ta thấy, [initial_spouse.GetFirstNameNoTooltip]!"
  spouse.2004.t:0 "Sự Hỗ Trợ Của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('told_of_character'))]"
  spouse.2004.opening:1 "Trong một chuyến thăm gần đây, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('initial_spouse'))] của ta là [initial_spouse.GetFirstName] đã nói chuyện rất lâu với [told_of_character.GetTitledFirstName]."
  spouse.2004.exceptional:0 "\n\nBất cứ điều gì [initial_spouse.GetSheHe] nói, chắc chắn đã để lại ấn tượng! Trước khi đi, [told_of_character.GetFirstName] đã ôm Ta thân thiện!"
  spouse.2004.a:1 "Ta sẽ làm gì nếu không có [initial_spouse.GetFirstNameNoTooltip] thân yêu."
  spouse.2005.t:0 "Lắng Nghe Chú Tâm"
  spouse.2005.desc:0 "Dường như [told_of_character.GetTitledFirstName] rất ấn tượng cách Ta nói về [spouse.GetFirstName]! Trước khi đi, [told_of_character.GetTitledFirstName] còn kéo [spouse.GetHerHim] ôm!"
  spouse.2005.a:0 "Ta gần như không cần tô điểm thêm [spouse.GetHerHim]."
  spouse.2006.t:1 "Một [spouse.GetWomanMan|U] Đáng Khen"
  spouse.2006.good:0 "\n\n[initial_spouse.GetSheHe|U] cho Ta góc nhìn mới về lý do Ta nên tôn trọng [spouse.GetFirstName]."
  spouse.2006.a:1 "Cảm ơn đã cho Ta thấy, [initial_spouse.GetFirstNameNoTooltip]."
  spouse.2007.t:0 "Sự Hỗ Trợ Của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('initial_spouse'))]"
  spouse.2007.good:0 "\n\nBất cứ điều gì [initial_spouse.GetSheHe] nói, chắc chắn để lại ấn tượng tốt. Trước khi đi, [told_of_character.GetFirstName] vỗ vai Ta cười!"
  spouse.2007.a:1 "Ta sẽ làm gì nếu không có [initial_spouse.GetFirstNameNoTooltip] thân yêu."
  spouse.2008.t:0 "Lắng Nghe Chú Tâm"
  spouse.2008.desc:0 "Dường như [told_of_character.GetTitledFirstName] rất ấn tượng cách Ta nói về [spouse.GetFirstName]! Họ hòa hợp hơn bao giờ hết."
  spouse.2008.a:0 "Ta chỉ nói sự thật."
  spouse.2009.t:0 "Một [spouse.GetWomanMan] Đáng Nghi Ngờ"
  spouse.2009.bad:0 "\n\nTa không chắc đây có phải ý định, nhưng nghe [initial_spouse.GetFirstName] khiến Ta nghĩ mình đã đánh giá quá cao [spouse.GetFirstName]."
  spouse.2009.a:1 "Cảm ơn đã cho Ta thấy, [initial_spouse.GetFirstNameNoTooltip]..."
  spouse.2010.t:0 "Sự Hỗ Trợ Của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('told_of_character'))]"
  spouse.2010.desc:0 "\n\nBất cứ điều gì [initial_spouse.GetSheHe] đã nói, chắc hẳn nó đã để lại ấn tượng không tốt với [told_of_character.GetFirstName]. Khi rời đi, [told_of_character.GetSheHe] chỉ nhìn ta và lắc đầu [told_of_character.GetHerHis]."
  spouse.2010.a:1 "\"Ta sẽ làm gì nếu không có [initial_spouse.GetFirstNameNoTooltip] thân yêu..."
  spouse.2011.t:0 "Lắng Nghe Chú Tâm"
  spouse.2011.desc:0 "Dù Ta có cố gắng sửa mình, mọi lời Ta nói về [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] đều bị hiểu lầm là sỉ nhục, thay vì khen ngợi! Khi ra đi, [told_of_character.GetFirstName] chỉ lắc đầu với [spouse.GetFirstName]."
  spouse.2011.a:0 "Ta đã làm gì sai?"
  spouse.2012.t:0 "Bí Mật Hôn Nhân"
  spouse.2012.secret_about_me:0 "Có những điều Ta cảm thấy không thể giấu với [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse'))]. Ta biết [spouse.GetFirstName] sẽ hiểu."
  spouse.2012.secret_about_spouse:0 "Có những điều Ta biết về [spouse.GetFirstName]. [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] không thể tiếp tục sống trong sự vô minh."
  spouse.2012.secret_about_other:0 "Ta đang cân nhắc xem có nên chia sẻ điều gì đó với [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse'))] vào lần tới khi chúng Ta chỉ có hai người, tránh tai nghe nhòm ngó.\n\nNhững điều Ta học được về [owner_of_secret.GetTitledFirstName] chắc chắn sẽ khiến [spouse.GetHerHim] quan tâm."
  spouse.2012.a:1 "Ta sẽ chia sẻ bí mật này với [spouse.GetFirstNameNoTooltip]."
  spouse.2012.a.tt:0 "Bí mật được tiết lộ với [spouse.GetTitledFirstName]"
  spouse.2012.b:0 "Một số điều tốt hơn nên giữ trong bóng tối."
  spouse.2013.t:0 "Bí Mật Hôn Nhân"
  spouse.2013.opening:0 "Người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('first_spouse'))] của Ta, [first_spouse.GetFirstName], kéo Ta sang một bên với vẻ nghiêm trọng."
  spouse.2013.secret_about_me:0 "\n\n\"Ta có một bí mật cần thổ lộ,\" [first_spouse.GetSheHe] nói. Khi [first_spouse.GetSheHe] cúi xuống thì thầm vào tai Ta, mắt Ta mở to kinh ngạc."
  spouse.2013.secret_about_spouse:0 "\n\n\"Có điều Ngài cần biết,\" [first_spouse.GetSheHe] nói. Khi [first_spouse.GetSheHe] cúi xuống thì thầm vào tai Ta, mắt Ta mở to kinh ngạc."
  spouse.2013.secret_about_other:0 "\n\n\"Ta phải nói với Ngài một điều,\" [first_spouse.GetSheHe] nói. \"Về [owner_of_secret.GetTitledFirstName].\" \nKhi [first_spouse.GetSheHe] cúi xuống thì thầm vào tai Ta, mắt Ta mở to kinh ngạc."
  spouse.2013.a:0 "Thật sao? Ta sẽ không bao giờ biết được!"
  spouse.2014.t:0 "Một Mối Đe Dọa?"
  spouse.2014.desc:0 "Có điều gì đó sai trái trong cách [agent.GetTitledFirstName] hành xử quanh [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse'))] khi [agent.GetSheHe] nghĩ không ai nhìn. Ta thường thấy [agent.GetHerHim] liếc sang một bên, đi lang thang hành lang trống, và quan sát kỹ từng cử động của [spouse.GetFirstNamePossessive].\n\nTa lo rằng [agent.GetSheHe] đang lên kế hoạch điều gì đó."
  spouse.2014.a:0 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('spouse') )] của Ta phải được cảnh báo!"
  spouse.2014.reveal_tt:0 "[spouse.GetTitledFirstName] sẽ được cảnh báo rằng [agent.GetTitledFirstName] đang làm điều gì đó."
  spouse.2014.b:0 "Chắc Ta nhầm."
  spouse.2015.t:0 "Một Mối Đe Dọa?"
  spouse.2015.desc:0 "[ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('first_spouse'))] của ta đã đến gặp ta với ánh mắt đầy lo lắng [first_spouse.GetHerHis]. Hạ giọng [first_spouse.GetHerHis] xuống, [first_spouse.GetFirstName] kể cho ta nghe về một số hành vi vô cùng đáng ngờ mà [first_spouse.GetSheHe] đã quan sát được từ [agent.GetTitledFirstName]. [first_spouse.GetFirstName] đã trực tiếp buộc tội [agent.GetHerHim] là đang cấu kết với những thế lực mưu mô!"
  spouse.2015.a:0 "Cảm ơn vì cảnh báo, [first_spouse.Custom2('RelationToMe' , SCOPE.sC('spouse'))] thân yêu!"
  spouse.2015.b:1 "Liệu Ta có thực sự tin [first_spouse.GetFirstNameNoTooltip] về chuyện này không?"
  spouse.3001.t:0 "Khổ Sở Hôn Nhân"
  spouse.3001.desc.opening:0 "Như thể Ta chưa có đủ rắc rối, Ta còn phải đối phó với [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] của mình!"
  spouse.3001.desc.fallback:0 "Luôn có những việc Ta làm chưa đủ tốt, và mỗi ngày lại có thêm một lời phàn nàn."
  spouse.3001.lazy:0 "[spouse.GetSheHe|U] không bao giờ sẵn sàng giúp đỡ Ta. Khi Ta bận rộn nhất, [spouse.GetSheHe] lại chọn ngủ trưa và tán gẫu, thường ngay trước mặt Ta!"
  spouse.3001.wrathful:0 "Ta thề với [ROOT.Char.GetFaith.HighGodName], tính khí [spouse.GetHerHis] làm Ta phát điên. Những cơn giận, cãi vã và hận thù vô tận… Kiên nhẫn của Ta đang cạn kiệt."
  spouse.3001.deceitful:0 "Gần đây, Ta phát hiện quá nhiều lời dối trá. Hầu hết chỉ là những việc nhỏ, nhưng Ta đầy nghi ngờ. [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] còn giấu Ta điều gì nữa…?"
  spouse.3001.paranoid:0 "[spouse.GetFirstName] liên tục đổ lỗi cho Ta về những việc Ta chưa làm, khiến Ta mất kiên nhẫn. Ta thực sự bị cám dỗ để cảm thấy có tội với cáo buộc tiếp theo của [spouse.GetHerHis]…"
  spouse.3001.impatient:0 "\n\n[spouse.GetHerHis] có trách nhiệm hỗ trợ Ta và thấu hiểu, nhưng [spouse.GetSheHe] lại thiếu kiên nhẫn. Dù Ta đang ngộp thở dưới trách nhiệm, [spouse.GetFirstName] chỉ quan tâm đến những lời hứa chưa thực hiện và sự thiếu quan tâm."
  spouse.3001.arrogant:0 "[spouse.GetFirstName] giận dữ về gánh nặng của Ta, nhưng không phải vì quan tâm đến Ta. Không, [spouse.GetSheHe] mong Ta ưu tiên [spouse.GetHerHim] hơn nhiệm vụ của Ta với tư cách [ROOT.Char.GetTitleAsNameNoTooltip]!"
  spouse.3001.sadistic:0 "\n\nTa vật lộn để hoàn thành các trách nhiệm và cảm thấy kiệt sức. Trước đây Ta nghĩ [spouse.GetFirstName] sẽ hỗ trợ, nhưng giờ Ta không còn ngây thơ. Ta nghĩ [spouse.GetSheHe] thực sự thấy vui khi Ta khổ sở!"
  spouse.3001.callous:0 "Sau một ngày dài mệt mỏi, Ta khao khát sự cảm thông và động viên. [spouse.GetFirstName] chỉ đưa ra lời nhận xét sắc bén và từ chối lạnh lùng."
  spouse.3001.vengeful:0 "Ta thừa nhận, Ta chỉ là một [ROOT.Char.GetWomanMan] và có khuyết điểm, nhưng [spouse.GetFirstName] cực kỳ tệ hại! [spouse.GetSheHe|U] nhớ mọi lỗi lầm Ta từng phạm, và tệ hơn, cứ phạt Ta mãi."
  spouse.3001.desc.end:0 "\n\nNgươi sẽ nghĩ rằng [spouse.GetSheHe] đang cố gắng hết sức để biến cuộc đời ta thành một nỗi khổ sở không hồi kết!"
  spouse.3001.a:0 "Tại sao ngươi lại ghét ta đến vậy?!"

  spouse.3002.t:0 "Cơ Hội Trả Thù"
  spouse.3002.desc:0 "Trong một chuyến thăm, dường như Ta đã thu hút sự chú ý của [told_of_character.GetTitledFirstNamePossessive], dù chỉ thoáng qua. Đây có thể là cơ hội để nói với [told_of_character.GetHerHim] những gì [told_of_character.GetSheHe] nên thực sự nghĩ về [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] của Ta, [spouse.GetFirstName]."
  spouse.3002.a:1 "Hãy để Ta kể vài điều, [told_of_character.GetFirstNameNoTooltip]."
  spouse.3002.a.great:0 "Câu Chuyện Thuyết Phục"
  spouse.3002.a.great_tt:0 "#F [told_of_character.GetFirstNameNoTooltip] kinh ngạc#!"
  spouse.3002.a.good:0 "Câu Chuyện Đáng Lo"
  spouse.3002.a.good_tt:0 "#F [told_of_character.GetFirstNameNoTooltip] bị thuyết phục bởi lời Ta#!"
  spouse.3002.a.bad:0 "Lời Nói Vô Danh Dự"
  spouse.3002.a.bad_tt:0 "#F [told_of_character.GetFirstNameNoTooltip] bị xúc phạm vì Ta nói về [THIS.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] như vậy#!"
  spouse.3002.b:0 "Ta không thể làm sau lưng [ROOT.Char.Custom2('RelationToMePossessive' , SCOPE.sC('spouse') )]."

  spouse.3003.t:0 "Một Cuộc Trò Chuyện Đáng Lo"
  spouse.3003.opening:0 "Trong một chuyến thăm gần đây, Ta đã dành thời gian trò chuyện với [spouse.GetTitledFirstNamePossessive] [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('spouse') )], [initial_spouse.GetTitledFirstName]."
  spouse.3003.exceptional:0 "\n\nTrước đây Ta từng đánh giá cao [spouse.GetFirstName], nhưng những gì [initial_spouse.GetSheHe] kể cho Ta khiến Ta hoàn toàn kinh hãi!"
  spouse.3003.a:1 "Ta đã quá tốt với ngươi, [spouse.GetFirstNameNoTooltip]!"
  spouse.3004.t:0 "Một Cuộc Trò Chuyện Đáng Lo"
  spouse.3004.opening:0 "Trong chuyến thăm gần đây, [told_of_character.GetTitledFirstName] đã dành một khoảng thời gian đáng lo khi nghe Ta nói về [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('spouse') )] ít yêu thương, [initial_spouse.GetFirstName]."
  spouse.3004.exceptional:0 "\n\nNỗi sợ tồi tệ nhất của Ta được xác nhận khi rời đi, khi [told_of_character.GetFirstName] thậm chí không thèm nhìn Ta trước khi chia tay!"
  spouse.3004.a:1 "Ngươi đã nói gì với [told_of_character.GetHerHim]?!"
  spouse.3005.t:0 "Người Biết Lắng Nghe"
  spouse.3005.exceptional:0 "Những gì Ta nói về [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] rõ ràng đã gây ấn tượng. Mắt [told_of_character.GetHerHis|U] mở to và [told_of_character.GetSheHe] lẩm bẩm không tin. \"Không thể nào…\""
  spouse.3005.a:0 "Ồ, tất cả đều là sự thật."
  spouse.3006.t:0 "Một Cuộc Trò Chuyện Đáng Lo"
  spouse.3006.good:0 "\n\nTrước đây Ta từng đánh giá cao [spouse.GetFirstName], nhưng những gì [initial_spouse.GetSheHe] kể cho Ta vẽ ra hình ảnh [spouse.GetHerHim] thật thất vọng."
  spouse.3006.a:0 "Ta đã quá tốt với ngươi, [spouse.GetFirstNameNoTooltip]."
  spouse.3007.t:0 "Một Cuộc Trò Chuyện Đáng Lo"
  spouse.3007.good:0 "\n\nTa đã có lý do để lo lắng, vì khi rời đi, [told_of_character.GetFirstName] chỉ đơn giản lắc đầu [told_of_character.GetHerHis] với ta."
  spouse.3007.a:1 "Ngươi đã nói gì với [told_of_character.GetHerHim]?"
  spouse.3008.t:0 "Người Biết Lắng Nghe"
  spouse.3008.good:0 "Chắc hẳn ta đã tạo ấn tượng với những điều ta kể cho [told_of_character.GetFirstName] về [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] của ta, vì khi đến lúc rời đi, [told_of_character.GetSheHe] chỉ đơn giản lắc đầu [told_of_character.GetHerHis] với [spouse.GetFirstName]."
  spouse.3008.a:0 "Ta không ngạc nhiên sao khi điều đó khiến Ta hài lòng đến vậy."
  spouse.3009.t:0 "Một Bất Ngờ Tích Cực"
  spouse.3009.bad:0 "\n\nTa đã đánh giá cao [spouse.GetFirstName], và những gì [initial_spouse.GetSheHe] kể cho Ta cho thấy Ta đã đúng!"
  spouse.3009.a:0 "Một [spouse.GetWomanMan] xứng đáng được tôn trọng."
  spouse.3010.t:0 "Một Bất Ngờ Tích Cực"
  spouse.3010.bad:0 "\n\nTa đã không cần phải lo lắng, vì sau đó [told_of_character.GetFirstName] nói với ta rằng [initial_spouse.GetFirstName] đã khiến [told_of_character.GetHerHim] nhìn thấy những khía cạnh của ta mà [told_of_character.GetSheHe] trước đây chưa thực sự đánh giá cao!"
  spouse.3010.a:0 "Người [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('spouse') )] của Ta nói tốt về Ta? Thật sao?"
  spouse.3011.t:0 "Một Hiểu Lầm Kinh Khủng"
  spouse.3011.bad:0 "Dù Ta có vẽ [spouse.GetFirstName] trong ánh sáng tệ hại thế nào, [told_of_character.GetFirstName] vẫn nghĩ Ta đang khen ngợi [spouse.GetHerHim]! Giờ họ dường như hòa thuận hơn bao giờ hết."
  spouse.3011.a:0 "Ta đã làm gì?"
  spouse.3012.t:0 "Một Mối Đe Dọa..."
  spouse.3012.opening:0 "Dù [spouse.GetSheHe] thật vô dụng, [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] của Ta, [spouse.GetFirstName], lại tỏ ra quá thoải mái với cuộc sống của [spouse.GetHerHis] tại [ROOT.Char.Custom('GetCourt')]."
  spouse.3012.agent_suspicious:0 "\n\nChia sẻ hành vi đáng ngờ Ta đã thấy từ [agent.GetTitledFirstName] sẽ khiến [spouse.GetHerHim] ít thoải mái hơn."
  spouse.3012.agent_probably_innocent:0 "\n\nNói rằng Ta quan sát thấy hành vi đáng ngờ từ [agent.GetTitledFirstName] sẽ khiến [spouse.GetHerHim] ít thoải mái hơn."
  spouse.3012.a:1 "[spouse.GetFirstNameNoTooltip] phải được biết về 'mối đe dọa' này!"
  spouse.3012.false_reveal_tt:1 "[spouse.GetFirstNameNoTooltip] sẽ được 'cảnh báo' về [agent.GetFirstNameNoTooltip]."
  spouse.3012.b:0 "Ta thậm chí sẽ không giả vờ giúp [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('spouse') )] của mình."
  spouse.3013.t:0 "Một Mối Đe Dọa?"
  spouse.3013.desc:1 "[ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('initial_spouse'))] của ta đã đến gặp ta với ánh mắt đầy lo lắng [initial_spouse.GetHerHis]. Hạ giọng [initial_spouse.GetHerHis] xuống, [initial_spouse.GetFirstName] kể cho ta nghe về một số hành vi vô cùng đáng ngờ mà [initial_spouse.GetSheHe] đã quan sát được từ [agent.GetTitledFirstName]. [initial_spouse.GetFirstName] đã trực tiếp buộc tội [agent.GetHerHim] là đang cấu kết với những thế lực mưu mô!"
  spouse.3013.a:1 "Liệu Ta có thực sự tin [initial_spouse.GetFirstNameNoTooltip] về chuyện này không?"
