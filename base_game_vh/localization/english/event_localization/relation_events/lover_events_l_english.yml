l_english:
  lover.0001.t:0 "Hết Nhiệt Huyết"
  lover.0001.desc_opening:1 ""[ROOT.Char.Custom('LoverPetName')], điều này… điều này không còn hiệu quả nữa!"\n\nNgười tình [lover.GetTitledFirstName] rút lui khỏi ta,"
  lover.0001.desc_murder:0 ""Ngọn lửa giữa chúng ta… Vậy mà ngươi lại giết… Quá sức chịu đựng!""
  lover.0001.desc:0 ""Ngọn lửa giữa chúng ta– như đã tắt hẳn.""
  lover.0001.a:1 "Ta đồng ý, đã đến lúc chúng ta chia tay."
  lover.0001.b:1 "Nhưng… Nhớ tất cả những kỷ niệm đẹp đi!"
  lover.0001.b.tt:0 "[lover.GetSheHe|U] sẽ cho mối quan hệ chúng ta thêm cơ hội"

  lover.0002.t:0 "Hết Nhiệt Huyết"
  lover.0002.still_in_love:0 "Lời nói của [first_lover.GetHerHis|U] vẫn vang vọng trong tai ta. Với giọng điệu buồn bã mà [first_lover.GetTitledFirstName] đã nói, ta không khỏi cảm giác như [first_lover.GetSheHe] đang cố làm tổn thương ta.\n\n"Ta… nhưng ta yêu ngươi!" Ta ép ra từ cổ họng khô cằn. Lời van xin không thể thay đổi trái tim [first_lover.GetHerHis]."
  lover.0002.still_likes:0 "Lời nói của [first_lover.GetTitledFirstNamePossessive] khiến ta đau đớn, nhưng ta cố nuốt nỗi đau vào trong.\n\nNếu đây là điều mà [first_lover.GetSheHe] nghĩ là tốt cho chúng ta, ta sẽ không làm khó [first_lover.GetHerHim] khi rời đi."
  lover.0002.neutral:0 ""Mọi thứ rồi cũng kết thúc," [first_lover.GetTitledFirstName] nói với ta. Ta buồn khi nghĩ về tất cả những gì chúng ta đã có, và những gì giờ đã mất, nhưng cuối cùng điều này có vẻ là tốt nhất."
  lover.0002.dislike:0 "[first_lover.GetTitledFirstName] tiếp cận ta, bối rối. Khi nhận ra [first_lover.GetSheHe] đến để nói rằng chúng ta sẽ không còn gặp nhau nữa, ta không buồn. Chỉ cảm thấy nhẹ nhõm."
  lover.0002.hate:0 "[first_lover.GetTitledFirstName] tiếp cận ta, nói rằng họ có một vấn đề nghiêm trọng cần thảo luận. Tuy nhiên, ngay cả trước khi [first_lover.GetSheHe] nói, ta đã buông ra một tràng chỉ trích về cách [first_lover.GetSheHe] đã làm ta thất vọng một lần nữa.\n\nTa gần như vui mừng khi [first_lover.GetSheHe] nói [first_lover.GetSheHe] không muốn gặp ta nữa."
  lover.0002.like.vengeful:0 "Khi những lời biện hộ yếu ớt trôi ra từ môi [first_lover.GetTitledFirstNamePossessive], lòng căm thù bùng cháy trong dạ dày, từng lời khiến lửa thêm bốc. Vậy là ta không còn đủ tốt cho [first_lover.GetHerHim] sao? [first_lover.GetSheHe|U] sẽ hối hận, nhớ lời ta..."
  lover.0002.dislike.vengeful:0 "Khi những lời bào chữa thảm hại trôi ra từ môi [first_lover.GetTitledFirstNamePossessive], lòng khinh bỉ lan tỏa từ đáy dạ dày, phá tan mọi sự dịu dàng còn sót lại với [first_lover.GetHerHim]. [first_lover.GetSheHe|U] sẽ hối hận khi từ chối ta thế này, nhớ lời ta..."
  lover.0002.like.humble:0 "Dù đau đớn mà lời [first_lover.GetTitledFirstNamePossessive] gây ra gần như không thể chịu nổi, ta không thể chối bỏ sự thật. Ta chưa từng đủ tốt cho [first_lover.GetHerHim]. Ta hy vọng [first_lover.GetSheHe|U] sẽ hạnh phúc hơn khi không có ta…"
  lover.0002.like.arrogant:0 "[first_lover.GetTitledFirstName]… không muốn ta nữa sao? Những gì [first_lover.GetSheHe] nói chẳng hợp lý chút nào. Ta nghĩ [first_lover.GetSheHe] chắc không khỏe, hoặc bị ép phải nói những lời kỳ lạ ấy. Ta… Ta hoàn hảo cho [first_lover.GetHerHim]!"
  lover.0002.dislike.arrogant:0 "Ta gần như không nhịn được cười, lời [first_lover.GetTitledFirstNamePossessive] thật nực cười. Dĩ nhiên [first_lover.GetSheHe] vẫn muốn ta, ta là tất cả những gì [first_lover.GetSheHe] từng khao khát! Nhưng ta không tranh cãi — mất mát là của [first_lover.GetHerHis]. Ta chẳng bận tâm chút nào."
  lover.0002.like.lustful:0 "Ta đã nhớ đôi tay háo hức của [first_lover.GetTitledFirstNamePossessive], nên sự xuất hiện bất ngờ của [first_lover.GetHerHis] thật thú vị. Ta nóng lòng được đắm mình trong vòng tay [first_lover.GetHerHis], nhưng khi cố ôm [first_lover.GetHerHim] gần, [first_lover.GetSheHe] lại kháng cự.\n\nTa hầu như không nhớ lời nói tiếp theo, nhưng cơn đau [first_lover.GetSheHe] để lại vẫn chưa phai."
  lover.0002.dislike.lustful:0 "Ngạc nhiên thay, khi [first_lover.GetTitledFirstName] nói chúng ta chia tay, cảm giác đầu tiên của ta là nhẹ nhõm. Cuối cùng ta có thể thừa nhận [first_lover.GetSheHe] không còn thỏa mãn được dục vọng của ta."
  lover.0002.like.understanding:0 "Mặc dù [first_lover.GetTitledFirstNamePossessive] rất vất vả để tìm từ ngữ, ta biết [first_lover.GetHerHim] đủ rõ để biết chúng sẽ là tin xấu. Ta kìm nén nỗi đau buồn, không muốn làm điều này khó khăn hơn đối với [first_lover.GetHerHim], và nắm nhẹ tay [first_lover.GetHerHis]. Sau đó những từ ngữ tuôn ra từ [first_lover.GetHerHim] như một thác nước và nỗi sợ hãi sâu sắc nhất của ta đã được xác nhận."
  lover.0002.dislike.understanding:0 "Dù [first_lover.GetTitledFirstName] đến để nói gì, rõ ràng điều đó làm [first_lover.GetHerHim] lo lắng. Dù tình cảm của ta với [first_lover.GetHerHim] đã phai, vẫn đau khi thấy [first_lover.GetHerHim] trong trạng thái đó.\n\nKhi ta trấn an [first_lover.GetHerHim] rằng mọi chuyện sẽ ổn, [first_lover.GetSheHe] mới nói chúng ta đã chia tay."
  lover.0002.like.angry:0 "Sau khi xem [first_lover.GetTitledFirstName] chật vật gần một giờ, lời thú nhận của [first_lover.GetHerHis] không làm ta bất ngờ. Nhưng phản ứng của chính ta thì có. Những lời cay nghiệt tuôn ra như nham thạch, ta không thể dừng, cũng không muốn. Ta cần thấy nỗi đau của chính mình phản chiếu trên khuôn mặt [first_lover.GetFirstNamePossessive].\n\nCơn giận bảo vệ ta cho đến khi [first_lover.GetFirstName] lao ra khỏi [ROOT.Char.Custom('GetRoom')]. Lúc đó chỉ còn lại thực tại đau đớn của sự bị từ chối."
  lover.0002.dislike.angry:0 "Sau khi xem [first_lover.GetTitledFirstName] chật vật gần một giờ, ta không thể kiềm chế cơn giận nữa. Mọi điều cay độc mà ta từng muốn nói với [first_lover.GetWomanMan] xấu số tuôn ra như nham thạch.\n\nNỗi đau trong mắt [first_lover.GetHerHis] khiến ta mạnh mẽ hơn, và khi [first_lover.GetSheHe] cuối cùng nói chúng ta chia tay, chiến thắng của ta hoàn tất."
  lover.0002.like.paranoid:0 "Khi [first_lover.GetTitledFirstName] nói với ta [first_lover.GetSheHe] không muốn ta nữa, điều đó không có gì đáng ngạc nhiên. Ta đã thấy điều đó trong đôi mắt [first_lover.GetHerHis] từ lâu, cảm thấy điều đó trong sự do dự của những cái chạm [first_lover.GetHerHis]. Mỗi lần ta hỏi, [first_lover.GetSheHe] đều phủ nhận, nhưng có vẻ như [first_lover.GetSheHe] không thể giấu nổi nữa. Hoặc có lẽ [first_lover.GetSheHe] chỉ đơn giản là thích nhìn ta đau khổ..."
  lover.0002.dislike.paranoid:0 "Khi [first_lover.GetTitledFirstName] nói với ta [first_lover.GetSheHe] không muốn ta nữa, điều đó không có gì đáng ngạc nhiên. Ta biết điều đó sẽ xảy ra từ lâu rồi, mặc dù [first_lover.GetSheHe] liên tục phủ nhận nó. Có lẽ [first_lover.GetSheHe] đã kéo dài cả vụ việc để trừng phạt ta... Vâng, ta chắc chắn rằng kẻ [first_lover.GetWomanMan] gớm ghiếc đó đã hả hê trước nỗi đau khổ của ta!"
  lover.0002.a:0 "Nhưng tại sao, người yêu…"
  lover.0002.b:0 "Không, ta phải làm gì đó!"
  lover.0002.c:0 "Có lẽ điều này tốt nhất."
  lover.0002.d:0 "Cuối cùng! Tạ ơn [ROOT.GetCharacter.GetFaith.FertilityGodName]!"
  lover.0002.e:0 "Ta sẽ không bao giờ tha thứ cho sự phản bội của [first_lover.GetHerHis]."

  lover.0003.t:0 "Quá Nhiều Thứ Tốt"
  lover.0003.desc.intro:0 "Chưa bao giờ ta nghĩ một [ROOT.Char.GetWomanMan] có thể có quá nhiều [ROOT.Char.Custom('lover_reason')], nhưng dường như cuộc sống đã chứng minh ta sai. Một vài ngày, ta cảm giác như thời gian rảnh rỗi chỉ toàn là "
  lover.0003.desc.twolovers:0 "[lover_1.Custom('lover_activity')] và [lover_2.Custom('lover_activity')]. "
  lover.0003.desc.threelovers:0 "[lover_1.Custom('lover_activity')], [lover_2.Custom('lover_activity')] và [lover_3.Custom('lover_activity')]. "
  lover.0003.desc.end1:0 "\n\nTa có thể tiếp tục thế này bao lâu? Những "
  lover.0003.desc.end2men:0 "người đàn ông"
  lover.0003.desc.end2women:0 "người phụ nữ"
  lover.0003.desc.end2people:0 "người"
  lover.0003.desc.end3:0 " sẽ là kết thúc của ta!"
  lover_0003.a:0 "Ta phải buông [lover_1.GetFirstNameNoTooltip]."
  lover_0003.b:0 "[lover_2.GetFirstNameNoTooltip] và ta đã đi đến đoạn đường cuối cùng."
  lover_0003.c:0 "Ta không thể tiếp tục thế này với [lover_3.GetFirstNameNoTooltip]."
  lover_0003.d:0 "Tình yêu không phải về số lượng, mà về chất lượng!"
  lover_0003.d.tt:0 "Ngươi dùng kỹ năng lãng mạn để giữ các người tình hài lòng mà không làm bản thân quá sức."
  lover_0003.e:0 "Có thể nó sẽ làm ta tan vỡ, nhưng cuộc sống thiếu [ROOT.Char.Custom('lover_reason')] thì sao?"
  lover_0003.e.tt:0 "Ngươi nỗ lực giữ mối quan hệ luôn sống động."

  lover.0004.t:0 "Nhát Đâm Từ Sự Từ Chối"
  lover.0004.desc:0 "[first_lover.GetFirstName] và ta đã trải qua nhiều khó khăn, ta không thể chối, nhưng sự từ chối của [first_lover.GetHerHis] là cú sốc. Dù không thể giải thích tại sao, ta chưa từng nghĩ chúng ta sẽ kết thúc thế này.\n\nCơn giận, sự phẫn nộ, hối tiếc… thờ ơ. Cảm xúc tràn qua ta và ta đứng sững, không biết phải làm gì hay cảm nhận ra sao."
  lover_0004.a:0 "Ta sẽ tiếp tục thế nào nếu không có [first_lover.GetHerHis] [ROOT.Char.Custom('lover_reason')]?"
  attempt_to_regain_affection_tt:0 "Ta phải thực hiện những biện pháp mạnh để lấy lại tình cảm [first_lover.GetHerHis]!"

  lover.0005.t:0 "Địa Ngục Không Có Cơn Thịnh Nộ"
  lover.0005.desc:0 "Nếu ta tuyên bố rằng [lover.GetFirstName] sẽ đón nhận các quyết định của ta một cách tốt đẹp thì ta là kẻ nói dối, tuy nhiên phản ứng [lover.GetHerHis] lại khiến ta ngạc nhiên. Không nước mắt, không cầu xin, không xúc phạm. Chỉ có đôi mắt [lover.GetTitledFirstNamePossessive] phản bội cảm xúc thật [lover.GetHerHis], và những gì ta thấy làm ta lạnh sống lưng."
  lover_0005.a:0 "Ta e rằng hôm nay ta đã tạo ra kẻ thù."

  lover.0101.t:0 "Bị [lover.GetHerHim|U] Bắt Giữ"
  lover.0101.desc_dungeon:0 "Ta hầu như không thấy song sắt vì lớp màn nước mắt che mắt; sao người [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] lại làm vậy với ta? [lover.GetTitledFirstName], [lover.Custom('LoverPetName')] của ta, xin hãy thả ta…"
  lover.0101.desc_house_arrest:0 "Dù đi cùng hành lang với [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] [lover.GetTitledFirstName], trái tim chúng ta chưa bao giờ xa nhau hơn. [lover.Custom('LoverPetName')] của ta, xin hãy thả ta…"
  lover.0101.a:0 "Người [lover.GetWomanMan] ta yêu sẽ không làm vậy!"
  lover.0101.b:0 "Chỉ là thử thách khác chúng ta phải vượt qua."

  lover.0102.t:0 "Tù Nhân"
  lover.0102.desc:0 "Ai có thể đoán điều này sẽ xảy ra? Người [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('imprisoned_lover'))] [imprisoned_lover.GetTitledFirstName] tránh xa ta, dù [imprisoned_lover.GetSheHe] vẫn còn trong tay ta, tình cảm [imprisoned_lover.GetHerHis] với ta đã biến mất."
  lover.0102.a:0 "Tình yêu mà [imprisoned_lover.GetSheHe] từng có đã bỏ chạy trong khi [imprisoned_lover.GetSheHe] không thể!"

  lover.0103.t:0 "Tình Cảm Đối Kháng"
  lover.0103.desc:0 "Thật khó tin rằng [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('lover'))] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] [lover.GetTitledFirstName] sẽ tuyên chiến với ta… Bất cứ điều gì chúng ta từng chia sẻ — bất cứ cảm xúc nào ta dành cho [lover.GetHerHim] – đang dần bị tiếng kèn chiến tranh át đi."
  lover.0103.a:0 "Không gì có thể cản bước ta. Ngay cả ngươi, người yêu của ta!"
  lover.0103.b:0 "Khi chiến tranh nổ ra, sinh mệnh là quý giá nhất, và tình yêu càng thêm ngọt ngào."
  lover.0103.b.tt:0 "#F Ta sẽ không vội vàng đưa ra quyết định trong cơn chiến!#!"

  lover.0104.desc:0 "Kể từ khi chọn chinh phục [war_title.GetName] thay vì người tình [war_lover.GetTitledFirstName], [war_lover.GetSheHe] từ chối nhìn thẳng vào Ta, và Ta lo rằng những gì chúng ta có đã mất mãi mãi."
  lover.0104.a:0 "Tình yêu và chiến tranh, mọi thứ đều công bằng."

  lover.0201.t:0 "Kết Thúc Một Cuộc Tình"
  lover.0201.desc:0 ""Ta rất vui vì ngươi hiểu tại sao mọi việc phải như thế," người tình Ta nói.\n\nÔi [breaker.GetFirstName], giá mà Ta hiểu! Trước thì ngươi thì thầm những lời ngọt ngào, giờ thì quay đi sao?"
  lover.0201.other_lover:0 "\n\nChẳng phải đó là [other_lover.Custom2('InsultNounSexual', ROOT.Char)] sao?!"
  lover.0201.a:0 "Chuyện này không nên diễn ra thế này."

  lover.0202.t:0 "Người [breaker.Custom('WifeHusband')] Của Ta"
  lover.0202.desc:0 "Ta… bối rối. Người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('breaker'))], [breaker.GetFirstName], nói rằng [breaker.GetSheHe] không còn muốn làm người tình Ta nữa. Niềm đam mê của chúng Ta không đủ giữ ngọn lửa hôn nhân sao?"
  lover.0202.a:0 "[breaker.GetSheHe] nghĩ [breaker.GetSheHe] đang làm gì thế?"

  lover.0203.t:0 "Nhẹ Nhõm"
  lover.0203.desc:0 ""Không phải lỗi ngươi, là tại Ta..." Ta chẳng chú ý lắm khi [breaker.GetFirstName] nói. Không nghi ngờ gì, [breaker.GetSheHe] ở đây để kết thúc mối tình vụn, nhưng tất cả những gì Ta cảm nhận chỉ là một làn sóng nhẹ nhõm tràn qua."
  lover.0203.a:0 "Vâng vâng, thật đáng tiếc. Đi đi, bây giờ."

  lover.0204.t:0 "Một [lover.Custom('WomanManGirlBoy')] Bị Xúc Phạm"
  lover.0204.desc:0 ""Ngươi dám! Ngươi dám chia tay Ta, và lại vì [other_lover.Custom2('InsultNounSexual', SCOPE.sC('lover'))] kia nữa!"\n\nTin đồn lan nhanh, và phản ứng kịch tính của [lover.GetFirstName] hiện ra trước mắt Ta. Rõ ràng [lover.GetSheHe] ghét bỏ Ta, và có thể tìm cách trả thù dù có lý do hay không."
  lover.0204.a:0 "[breaker.GetFirstNameNoTooltip] chọn Ta. Hãy chấp nhận đi."

 # Ask lover to be exclusive (lover -> soulmate)
  lover.3111.t:0 "Một Và Duy Nhất"
  lover.3111.desc:1 "[ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] [lover.GetTitledFirstName] ôm ta trong vòng tay [lover.GetHerHis], và ta cảm thấy một niềm hạnh phúc hiếm có. Hãy tưởng tượng nếu điều này có thể kéo dài mãi mãi — nếu [lover.GetSheHe] có thể mãi mãi là của ta, và chỉ của riêng ta..."
  lover.3111.a:1 "Hãy hứa sẽ không yêu ai khác ngoài nhau!"
  lover.3111.a.success:0 "[lover.GetShortUIName|U] đồng ý trở thành độc quyền"
  lover.3111.a.failure:0 "Gợi ý của Ta khiến [lover.GetShortUIName] khó chịu"
  lover.3111.a.tt:0 "#F Ta sẽ đề nghị rằng chúng Ta chỉ trung thành với nhau#!"
  lover.3111.b:0 "Được [lover.GetHerHim] như thế này là đủ. Hãy trở lại là của Ta!"
  lover_0300_break_up_with_other_lovers_effect.tt:0 "Tất cả người tình khác của Ngài"

 # Send a love letter
  lover.3002.t:0 "Nói Bằng Lời"
  lover.3002.desc:0 "Tình cảm của Ta dành cho [lover.GetFirstName] gần như tràn ra ngực! Ta khao khát bày tỏ cho [lover.GetHerHim] biết cảm xúc của mình!\n\nTình yêu, hãy dẫn tay Ta khi Ta đặt mực lên giấy!"
  lover.3002.a:0 "Chỉ có thơ là chân thật!"
  lover.3002.b:0 "Điều này khó hơn Ta tưởng..."
  lover.3002.a_beautiful:0 "Một bức thư tình đẹp"
  lover.3002.a_good:0 "Một bức thư tình khá"
  lover.3002.a_competent:0 "Một bức thư tình tạm ổn"
  lover.3002.a_bad:0 "Một bức thư tình tệ"
 
 # Terrible love letter
  lover.3003.desc:0 "Ta đã nhận được một lá thư từ [first_lover.GetTitledFirstName]!\n\n[first_lover.Custom2('love_letter', ROOT.Char )]"
  lover.3003.desc_conclusion:0 "\n\nCái… gì thế này?"
  lover.3003.a:0 "Có lẽ đây là bài thơ tệ nhất Ta từng đọc!"

  lover.3004.desc:1 "Thư Ta dường như không được đón nhận tốt. Hãy để xem lại...\n\n[first_lover.Custom2('love_letter', SCOPE.sC('lover'))]"
  lover.3004.a:0 "Thật sự tệ đến thế sao?"

  lover.3005.desc_conclusion:0 "\n\nThật… dễ thương."
  lover.3005.a:0 "Ít nhất [first_lover.GetSheHe] vẫn nghĩ về Ta."

  lover.3006.desc:1 "Thư Ta dường như được đón nhận tốt, dù chỉ là 'nỗ lực thơ ca đơn giản':\n\n[first_lover.Custom2('love_letter', SCOPE.sC('lover'))]"
  lover.3006.a:0 "Chỉ cần ý nghĩa là đủ!"

  lover.3007.desc_conclusion:0 "\n\nMột bài thơ, chỉ dành cho Ta!"
  lover.3007.a:0 "Ôi, thật cảm động!"

  lover.3008.desc:1 "Thư Ta được đón nhận tốt! [lover.GetTitledFirstName] dường như đã đọc cho nhiều người nghe.\n\n[first_lover.Custom2('love_letter', SCOPE.sC('lover'))]"
  lover.3008.a:0 "Lời Ta thật thuyết phục!"

  lover.3009.desc_conclusion:0 "\n\nThật sự đẹp. Và viết riêng cho Ta!"
  lover.3009.a:0 "Ta sẽ giữ những lời này trong tim!"

  lover.3010.desc:1 "[lover.GetTitledFirstName] trả lời thư Ta, nói rằng đó là một trong những điều đẹp nhất [lover.GetSheHe] từng nghe! Nhìn lại, Ta không ngạc nhiên:\n\n[first_lover.Custom2('love_letter', SCOPE.sC('lover'))]"
  lover.3010.a:0 "Có lẽ Ta nên làm nhà thơ thay vì [ROOT.Char.GetTitleAsNameNoTooltip]!"

  lover.3112.desc:0 ""Anh sẽ không bao giờ khao khát ai khác ngoài em, [ROOT.Char.Custom('LoverPetName')] của anh."\n\n[proposing_lover.GetTitledFirstName] ôm ta thật chặt, hơi thở [proposing_lover.GetHerHis] phả vào cổ ta, khi [proposing_lover.GetSheHe] yêu cầu một lời hứa: không bao giờ có người tình nào khác ngoài [proposing_lover.GetHerHim]."
  lover.3112.a:0 "Ta không cần ai ngoài ngươi!"
  lover.3112.b:1 "Chắc chắn, Ta #EMP sẽ không có ai khác#!"
  lover.3112.b.tt:0 "#F Một lời dối trá được tình yêu nuôi dưỡng sẽ gây hại gì?#!"
  lover.3112.c:0 "Ngươi không đùa chứ?!"
  lover.3112.b.remain_together.tt:0 "[THIS.Char.GetShortUIName] vẫn là [lover|E] của ngươi"

  lover.3113.desc:0 ""Vâng, tất nhiên Ta chỉ muốn là của ngươi, [ROOT.Char.Custom('LoverPetName')] của Ta!"\n\nTrái tim Ta tràn đầy yêu thương và khao khát, và Ta kéo [lover.GetTitledFirstName] gần và hôn [lover.GetHerHim] sâu."
  lover.3113.a:0 "Chỉ có ngươi quan trọng!"
  lover.3113.a.tt:0 "#F Ta sẽ không bao giờ yêu ai khác như yêu [lover.GetFirstNameNoTooltip]!#!"

  lover.3114.desc:0 ""Ta yêu ngươi [ROOT.Char.GetFirstNameNoTooltip], nhưng Ta chưa sẵn sàng thề hứa với ngươi."\n\n[lover.GetTitledFirstName] [lover.Custom('quirk_neg_present')] khi chúng Ta chìm vào im lặng ngượng ngùng."
  lover.3114.a:0 "Sao Ta có thể hiểu sai [lover.GetHerHim] đến vậy?"


  lover.0304.opening:1 "Người thân yêu [ROOT.Char.GetFirstNameNoTooltip],"
  lover.0304.desc:0 "Ta không ngờ mọi chuyện lại kết thúc thế này, nhưng đây là sự thật. Xin lỗi, Ta yêu người khác. Chúng ta không thể bên nhau nữa.\n\nChúc ngươi hạnh phúc trọn đời. Mong [ROOT.Char.GetFaith.HighGodName] phù hộ cho ngươi."
  lover.0304.a:0 "Vậy là thế này sao?"


  lover.1001.t:0 "Tin Đồn Và Suy Đoán"
  lover.1001.desc:0 "Người [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('snoopy_lover') )], [snoopy_lover.GetTitledFirstName] nghe được nhiều chuyện trong những lần đi lại tại [ROOT.Char.Custom('GetCourt')] của [snoopy_lover.GetHerHis].\n\nGần đây [snoopy_lover.GetSheHe] nghe được những câu chuyện rất thú vị về những gì [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('secret_holder') )] [secret_holder.GetTitledFirstName] làm trong bóng tối..."
  lover.1001.a:0 "Điều này rất hữu ích để biết, [ROOT.GetCharacter.Custom('LoverPetName')]."

  lover.1002.t:0 "Kéo Dây"
  lover.1002.desc:0 "[ROOT.GetCharacter.Custom('LoverPetName_possessive')|U], [lover.GetTitledFirstName] biết rất nhiều về cách điều hướng các mối quan hệ tại [ROOT.Char.Custom('GetCourt')] của ta. [lover.GetSheHe|U] gợi ý rằng [lover.GetSheHe] có thể vận dụng chuyên môn [lover.GetHerHis] vào những nỗ lực ngoại giao của ta đối với [target.GetTitledFirstName]."
  lover.1002.a:0 "Ý tưởng tuyệt vời!"
  lover.1002.b:0 "Ta không thể để [lover.GetFirstNameNoTooltip] dính vào chuyện này."

  lover.1003.t:0 "An Ủi Từ Người Tình"
  lover.1003.desc:0 "Gánh nặng làm một [ROOT.Char.GetTitleAsNameNoTooltip] đã đè nặng lên Ta gần đây, và chỉ có vòng tay ấm áp của [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('lover') )], [lover.GetTitledFirstName], mới làm Ta nhẹ nhõm.\n\n\"Xin hãy, [ROOT.Char.Custom('LoverPetName')] của ta, để ta giúp ngươi thư giãn.\""
  lover.1003.a:0 "Chúng ta sẽ ra sao nếu thiếu nhau, tình yêu của ta?"
  lover.1003.b:0 "Chính điều Ta cần!"

  lover.1004.t:0 "Đi Trốn"
  lover.1004.desc:0 "[ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('lover') )] [lover.GetTitledFirstName] của ta mỉm cười [lover.Custom('quirk_pos_adverb')] khi [lover.GetSheHe] ôm ta, và ta lại được nhắc nhở một lần nữa tại sao ta lại trân trọng [lover.GetHerHim] đến thế.\n\nThật tốt biết bao nếu chúng ta có thể trốn đi cùng nhau một lúc, chỉ hai chúng ta thôi..."
  lover.1004.a:0 "Nghe nói [county.GetNameNoTierNoTooltip] đẹp vào thời điểm này."
  lover.1004.a.tt:0 "#F Một chuyến đi lãng mạn... Chẳng biết chuyện gì sẽ xảy ra?#!"
  lover.1004.b:0 "Phòng ngủ đã là một điểm đến đủ kích thích rồi!"

  lover.1005.desc_opening_same_court:0 ""Ôi, [ROOT.Char.GetFirstNameNoTooltip]! Trốn khỏi triều đình, dù chỉ trong chốc lát... Giống như một giấc mơ."\n\n"
  lover.1005.desc_opening_other_court:0 ""Ôi, [ROOT.Char.GetFirstNameNoTooltip]! Gặp nhau như thế này, tránh xa cả hai triều đình... Giống như một giấc mơ."\n\n"
  lover.1005.desc_object_of_importance:0 "Nhìn thấy nụ cười phảng phất trên môi [lover.GetTitledFirstNamePossessive], và sự háo hức trong đôi mắt [lover.GetHerHis], ta quá hạnh phúc khi đồng ý và tìm nơi trọ tại một quán trọ ở [county.GetNameNoTier] – một quán trọ được trang trí bằng [ROOT.Char.Custom2('LoverSeductionObjectIndefinite', SCOPE.sC('lover'))]."
  lover.1005.desc:0 "Nhìn thấy nụ cười phảng phất trên môi [lover.GetTitledFirstNamePossessive], và sự háo hức trong đôi mắt [lover.GetHerHis], ta quá hạnh phúc khi đồng ý và tìm nơi trọ tại một quán trọ ở [county.GetNameNoTier]."
  lover.1005.a:0 "Phòng riêng nhất cho một tuần!"
  lover.1005.a.tt:0 "#F Vắng mặt của Ta có thể bị để ý#!"
  lover.1005.b:0 "Hãy tận hưởng một đêm thật trọn vẹn."
  lover.1005.c:0 "Hm, nhà trọ này — cả làng này — chắc cần nâng cấp chút..."

  lover.1006.opening:0 "[lover.Custom2('AppropriateGreeting', ROOT.Char)]"
  lover.1006.desc_opening:0 "Ta cầu xin ngươi cho Ta mượn tài năng của ngươi!"
  lover.1006.desc_chancellor:0 "Kỹ năng ngoại giao của ngươi được nhiều người biết đến,"
  lover.1006.desc_steward:0 "Kỹ năng hành chính của ngươi được nhiều người biết đến,"
  lover.1006.desc_marshal:0 "Kỹ năng quân sự của ngươi được nhiều người biết đến,"
  lover.1006.desc_spymaster:0 "Kỹ năng #EMP nhạy cảm#! của ngươi được nhiều người biết đến,"
  lover.1006.desc_court_chaplain:0 "Kỹ năng thần học của ngươi được nhiều người biết đến,"
  lover.1006.desc_kurultai:0 "Kỹ năng chăn nuôi của ngươi được nhiều người biết đến,"
  lover.1006.desc_end:1 "và Ta nghĩ ngươi sẽ là ứng viên hoàn hảo cho một vị trí trong hội đồng của Ta."
  lover.1006.a:0 "Dĩ nhiên Ta sẽ giúp ngươi [lover.GetFirstNameNoTooltip]!"
  lover.1006.b:0 "Ta không có thời gian phục vụ trong hội đồng."

  lover.1007.t:0 "Chư Hầu Và [ROOT.Char.GetHerHis|U] Chúa"
  lover.1007.desc:1 ""[ROOT.Char.Custom('LoverPetName')] của anh, em xứng đáng với những vì sao." [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] [lover.GetTitledFirstName] của ta lướt tay [lover.GetHerHis] xuống lưng ta khi chúng ta nằm cạnh nhau trên giường [lover.GetHerHis]. "Đáng buồn thay, anh chỉ có thể ban cho em những thứ trần tục... Ngay sáng mai, anh sẽ thực hiện một số điều chỉnh về các điều khoản chư hầu của em.""
  lover.1007.a:0 "Ngươi tốt với ta quá [lover.GetFirstNameNoTooltip]!"
  lover.1007.b:0 "Chỉ #EMP một số#! thay đổi thôi, tình yêu của ta?"
  lover.1007.b_1:0 "Ta sẽ được thỏa thuận tốt hơn"
  lover.1007.b_2:0 "[lover.GetFirstNameNoTooltip] không đánh giá lòng tham của Ta"

  lover.1008.t:0 "Người [lover.GetTitleTierName] Đến"
  lover.1008.desc:0 "Khi Ta đi đón [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] [lover.GetTitledFirstName] đến [capital.GetNameNoTier], [lover.GetSheHe] đã được bao quanh bởi các quan chức, đang chờ sự giúp đỡ và ý kiến của [lover.GetHerHis]."
  lover.1008.a:0 "Giải tán! [lover.GetSheHe|U] đến để gặp Ta!"
  lover.1008.b:0 "Ý kiến của [lover.GetHerHis|U] về những chuyện này sẽ hữu ích..."

  lover.2001.t:0 "Áp Lực Bí Mật"
  lover.2001.desc:0 "Ta dành nhiều thời gian suy nghĩ ai có thể biết về mối quan hệ của Ta với [lover.GetTitledFirstName].\n\nTim Ta đập nhanh khi những lời bình thường trở nên mang ý nghĩa. Ta cố nhủ rằng tất cả chỉ là tưởng tượng."
  lover.2001.a:0 "Không ai biết. Chắc chắn, không ai biết."

  lover.2002.t:0 "Gánh Nặng Của Tình Yêu"
  lover.2002.desc:1 "Ta rất say mê [lover.GetHerHim], nhưng [lover.GetTitledFirstName] đòi hỏi nhiều sự chú ý và quan tâm, điều này thật khó vào thời điểm như thế này!\n[lover.GetSheHe|U] biết nhiệm vụ của Ta với tư cách là một [ROOT.Char.GetTitleAsNameNoTooltip] quan trọng ra sao, nên tất nhiên Ta không thể dành tất cả thời gian còn lại cho [lover.GetHerHim]!"
  lover.2002.secret:0 "\n\nChỉ việc giữ mối quan hệ bí mật thôi cũng là một nhiệm vụ khổng lồ!"
  lover.2002.a:0 "Không, [ROOT.GetCharacter.Custom('LoverPetName')], không phải Ta không quan tâm!"

  lover.2003.t:0 "Gánh Nặng Của Tình Yêu"
  lover.2003.desc:0 "[first_lover.GetSheHe|U] đổ lỗi cho tất cả các nhiệm vụ [first_lover.GetHerHis] với tư cách là một [first_lover.GetTitleAsNameNoTooltip], nhưng có cảm giác như [first_lover.GetTitledFirstName] thậm chí không nhìn ta theo cách [first_lover.GetSheHe] đã từng.\n\nCó phải quá đáng không khi yêu cầu một người khẳng định yêu bạn hãy dành thời gian để ở bên cạnh bạn dù chỉ một khoảnh khắc?"
  lover.2003.a:0 "Ta xứng đáng hơn thế này."

  lover.2004.t:0 "Lời Hứa Tan Vỡ"
  lover.2004.desc:0 "[ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] [lover.GetTitledFirstName] của ta khẳng định rằng cuộc hôn nhân của [lover.GetHerHis] với [lovers_lover.GetTitledFirstName] chỉ là một sự cần thiết về chính trị, nhưng vài nụ cười [lover.GetSheHe] dành cho [lover.GetHerHis] [lover.Custom2('RelationToMe',SCOPE.sC('lovers_lover'))] khiến ta tự hỏi..."
  lover.2004.a:0 "Ta không thể chịu đựng được — chúng ta đã hứa sẽ không yêu ai khác!"
  lover.2004.a.tt:1 "Ngươi đối chất với [lover.GetShortUIName]"
  lover.2004.b:0 "Ta tin [lover.GetHerHim]."
  lover.2004.b.tt:0 "#F Người yêu của Ta sẽ không lừa dối Ta!#!"

  lover.2005.desc:0 ""[ROOT.Char.Custom('LoverPetName')], chắc chắn ánh nhìn dịu dàng Ta thấy giữa [lovers_lover.GetTitledFirstName] và ngươi chỉ là hiểu lầm?"\n\nNgười [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('original_lover'))] [original_lover.GetTitledFirstName] lo lắng về lời hứa tận tụy cá nhân chúng ta đã dành cho nhau từ khi Ta kết hôn..."
  lover.2005.a:0 "Đừng lo, tình yêu à, ngươi là duy nhất với ta!"
  lover.2005.b:0 "Ngươi không có quyền trong hôn nhân của Ta."

  lover.3103.desc_married:1 "Dù [lover.GetFirstName] là [lover.Custom('WifeHusband')] của [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('lovers_lover'))] [lovers_lover.GetTitledFirstName], [lover.GetSheHe] đảm bảo với Ta [lover.GetSheHe] chỉ yêu Ta.\n\n\"[lover.Custom('LoverPetName')|U], ngươi không cần lo gì. Ngươi là cả thế giới của Ta; Ta không thể yêu ai khác.\""
  lover.3103.a:0 "[lover.GetSheHe|U] chọn Ta cuối cùng — đó là tất cả điều quan trọng."

  lover.3104.desc_married:0 ""Ta không thể rời [lovers_lover.GetHerHim] – [lovers_lover.GetSheHe] là [lovers_lover.Custom('WifeHusband')] của Ta! Và dù Ta có thể… Ta quý [lovers_lover.GetHerHim] như quý ngươi, [lover.Custom('LoverPetName')] của Ta.""
  lover.3104.desc_ending:0 "\n\nLời của [lover.GetTitledFirstNamePossessive] đau hơn cả cuộc hôn nhân; nghĩ rằng [lover.GetSheHe] sẽ từ chối Ta như thế này!"
  lover.3104.a:0 "Ít nhất [lovers_lover.GetSheHe] vẫn muốn Ta..."
  lover.3104.a.tt:0 "#F Trong số người khác...#!"
  lover.3104.b:0 "Vậy Ta sẽ kết thúc nó!"

  lover.3105.t:0 "Một Giường Cỡ [ROOT.Char.GetTitleTierName]"
  lover.3105.desc:0 ""Ngươi phản bội ta như thế này [ROOT.Char.GetFirstNameNoTooltip]… Ta không nên để một [ROOT.Char.Custom2('InsultNounSexual', SCOPE.sC('lover'))] như thế vào giường mình."\n\nNghĩ rằng người [discoverer.Custom('LoverPetName')], [discoverer.GetFirstName], rời bỏ Ta vì chuyện nhỏ nhặt thế này!"
  lover.3105.a:0 "Ít nhất Ta vẫn có [lovers_lover.GetFirstNameNoTooltip]!"


  lover.3201.t:0 "Món Quà Hoàn Hảo"
  lover.3201.desc:0 "Nhìn xuống [ROOT.Char.Custom2('LoverSeductionObject', SCOPE.sC('lover'))] được tạo hình hoàn hảo và tưởng tượng nụ cười của [lover.GetTitledFirstNamePossessive], Ta khó mà kiềm chế.\n\n\"Thật tuyệt. Ngươi không đồng ý sao, [ROOT.Char.Custom('FormOfAddressForLiege')]?\" Người thương nhân già ra hiệu về [ROOT.Char.Custom2('LoverSeductionObject', SCOPE.sC('lover'))] với cái nháy mắt. \"Món quà hoàn hảo cho người yêu.\""
  lover.3201.a:0 "Đúng vậy. Hãy gói kỹ."
  lover.3201.b:0 "Thật sự là vậy. Ta lấy mười cái!"
  lover.3201.c:0 "Đồ rác này? Tha cho Ta."
  lover.3201.c.tt:0 "#F Ta chắc sẽ tìm cách khác để cho [lover.GetHerHim] thấy Ta yêu [lover.GetHerHim] biết bao!#!"
 

  lover.3202.desc_exquisite_gift:0 "Mười [ROOT.Char.Custom2('LoverSeductionObjectMultiple', SCOPE.sC('original_lover'))] xếp trên giường Ta — một bí ẩn chỉ trái tim Ta mới giải được."
  lover.3202.desc_ordinary_gift:0 "[ROOT.Char.Custom2('LoverSeductionObjectIndefinite', SCOPE.sC('original_lover'))|U] đặt trên gối Ta — một bí ẩn chỉ trái tim Ta mới giải được."
  lover.3202.desc_ending:0 "\n\nÔi [original_lover.GetTitledFirstName], [original_lover.Custom('LoverPetName')] của Ta, một [ROOT.Char.GetWomanMan] không thể mong một [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('original_lover'))] tuyệt vời hơn!"
  lover.3202.a:0 "Ta phải nhớ cảm ơn [original_lover.GetHerHim] vì món quà này!"
  lover.3202.a.tt:0 "#F Và lòng biết ơn #EMP của Ta#! chắc chắn [original_lover.GetSheHe] sẽ trân trọng#!"

  lover.3203.t:0 "Người Yêu Thương Của Ta"
  lover.3203.desc:0 "Một ngày làm việc hiệu quả nên kết thúc bằng một cuộc ân ái trọn vẹn. Nghĩ rằng Ta may mắn đến mức được bước vào phòng của cả [lover.Custom('ComplimentAdjective')] [lover.GetTitledFirstName] lẫn [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('spouse'))] [spouse.GetTitledFirstName] thật là hạnh phúc!"
  lover.3203.a_not_beloved:0 "Ta sẽ đến với [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('spouse'))], như lẽ phải."
  lover.3203.a_beloved:0 "Ta sẽ đến với [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('spouse'))], theo tiếng gọi trái tim!"
  lover.3203.b:0 "Ta tới đây, [lover.GetFirstNameNoTooltip]!"
  lover.3203.b.success:0 "Ta lén đi mà không bị phát hiện"
  lover.3203.b.failure:0 "Ta bị phát hiện"
  lover.3203.b.tt_safe:0 "[spouse.GetFirstNameNoTooltip] không hề hay biết."
  lover.3203.c:0 "Ta mạnh mẽ hơn những dục vọng này!"

  lover.3204.t:0 "Khao Khát Xa Xôi"
  lover.3204.desc:0 "Mỗi ngày trôi qua, ta cảm nhận rõ rệt hơn sự xa cách với [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] [lover.GetTitledFirstName] của ta. Giá như ta có thể thấy nụ cười [lover.Custom('quirk_pos_adjective')] [lover.GetHerHis] thường xuyên hơn, cảm nhận cơ thể ấm áp [lover.GetHerHis] bên cạnh, thưởng thức những gì [lover.GetSheHe] có thể mang lại...\n\nVới khao khát cháy bỏng như mọi khi, việc bị chia cắt như thế này thật kiệt quệ."
  lover.3204.a:0 "Mọi chuyện xảy ra theo ý [ROOT.Char.GetFaith.HighGodName]."
  lover.3204.a.tt:0 "#F Ta sẽ không hành động, mọi chuyện xảy ra là định mệnh#!"
  lover.3204.b:0 "Xa nhau như thế này có ích gì chứ?"
 
  lover.3205.opening:0 "[original_lover.Custom2('AppropriateGreeting', ROOT.Char)]"
  lover.3205.desc:0 "Gửi [ROOT.Char.Custom('LoverPetName')], [ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitledFirstName] của Ta.\n\nTa lo rằng khoảng cách ngăn Ta ôm Ngài đã làm Ta yếu lòng. Xin tha thứ, tình yêu của Ta, và hãy biết rằng Ta vẫn khao khát sự ngọt ngào và hơi ấm của ngươi, ngay cả khi Ta phải chấm dứt những gì chúng ta có."
  lover.3205.a:0 "Vậy là mọi chuyện kết thúc như thế này..."
  lover.3205.a.tt:0 "#F [original_lover.GetSheHe|U] làm tan nát trái tim Ta qua một #EMP bức thư#!?!#!"

  lover.3206.t:0 "Trên Chiến Trường"
  lover.3206.desc:0 "Ôi [lover.GetTitledFirstName], tình yêu của Ta, liệu chúng ta có cùng sống sót qua chiến tranh này không?\n\nViệc [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('attacker'))] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('attacker'))] [attacker.GetTitledFirstName] gọi Ta ra chiến trận là một chuyện, nhưng buộc Ta chống lại người Ta yêu..."
  lover.3206.a:0 "Trong tình yêu và chiến tranh, mọi thứ đều công bằng — Ta không thể làm gì hơn."
  lover.3206.b:0 "Ta sẽ ngăn chặn nỗ lực của [attacker.GetFirstNamePossessiveNoTooltip]!"
  lover.3206.b.tt:0 "#F Bất cứ điều gì để giữ an toàn cho [lover.GetFirstNameNoTooltip] của Ta!#!"

  lover.3207.t:0 "Tình Yêu Xa Xôi"
  lover.3207.desc:0 "Dù Ta xa [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] [lover.GetTitledFirstName], trái tim chúng Ta vẫn hòa làm một. Nếu Ta nhắc [lover.GetHerHim] về tình cảm của mình, có thể sẽ mang nụ cười [lover.Custom('quirk_pos_adjective')] mà Ta yêu thích trên mặt [lover.GetHerHis]..."
  lover.3207.a:0 "Ta sẽ soạn một bài thơ để diễn tả tình cảm với [lover.GetHerHim]!"
  lover.3207.a_object:0 "Một bài thơ, và [ROOT.Char.Custom2('LoverSeductionObjectIndefinite', SCOPE.sC('lover'))], để truyền tải tình cảm của Ta!"
  lover.3207.a.tt:0 "Nếu [lover.GetFirstNameNoTooltip] trân trọng bài thơ:"
  lover.3207.c:0 "[lover.GetSheHe|U] đã biết giá trị của [lover.GetSheHe] đối với Ta!"
  lover.3207.c.tt:0 "#F Chắc chắn [lover.GetSheHe] biết rồi...!#!"
 
  lover.3208.opening:0 "[writing_lover.Custom2('AppropriateGreeting', ROOT.Char)]"
  lover.3208.desc_object:0 "[ROOT.Char.Custom2('LoverSeductionObject', SCOPE.sC('writing_lover'))] này chỉ là lời nhắc nhở về khao khát và lòng tận tụy của Ta\n"
  lover.3208.a:0 "Thật ngọt ngào!"
  lover.3208.a_terrible:0 "#F Ta biết [writing_lover.GetSheHe] có ý tốt, nhưng bài #EMP thơ#!...#!"
  lover.3208.a_okay:0 "#F Dù thơ của [writing_lover.GetHerHis] cần chút chỉnh sửa...#!"
  lover.3208.a_great:0 "#F [writing_lover.GetSheHe|U] thậm chí có thể viết thơ rất trôi chảy!#!"
  lover.3208.a_amazing:0 "#F Đọc bài thơ này làm Ta yêu [writing_lover.GetHerHim] thêm lần nữa!#!"
  lover.3208.b:0 "Đây là thứ ngớ ngẩn nhất Ta từng đọc!"

  lover.3209.opening:0 "[lover.Custom2('AppropriateGreeting', ROOT.Char)]"
  lover.3209.desc:0 "Bài thơ ngươi gửi đã làm sáng ngày của Ta và khơi dậy khao khát với ngươi; biết rằng ngươi cũng nghĩ về Ta là điều duy nhất khiến Ta chịu nổi."
  lover.3209.a:0 "Ôi [lover.GetFirstNameNoTooltip], Ta nhớ ngươi quá!"

  lover.3210.desc:0 "Xin đừng gửi cho Ta những thứ vô nghĩa như thế nữa. Ta vẫn nghĩ đến ngươi dù khoảng cách xa xôi và muốn giữ điều đó."
  lover.3210.a:0 "Có lẽ Ta không phải là một nhà thơ thực thụ..."

  lover.3211.t:0 "Diễn Tả Tình Yêu"
  lover.3211.desc:0 "Một họa sĩ tài năng đến [capital.GetNameNoTier], và Ta ngay lập tức nghĩ đến [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] [lover.GetTitledFirstName] khi nhìn thấy những tác phẩm nghệ thuật tuyệt đẹp.\n\nMột bức tranh sẽ là món quà tuyệt vời, nếu Ta chỉ có thể chọn chủ đề hoàn hảo để diễn tả..."
  lover.3211.a:0 "Bóng tối của một con hẻm trước bình minh, đầy biểu tượng!"
  lover.3211.a.tt:0 "#F Ta chắc [lover.GetSheHe] sẽ hiểu những hàm ý tinh tế!#!"
  lover.3211.b:0 "Abraham và Sarah, đứng bên nhau."
  lover.3211.b.tt:0 "#F Hy vọng [lover.GetSheHe] sẽ thích biểu tượng tôn giáo!#!"
  lover.3211.c:0 "Diễn tả khao khát cháy bỏng — một trận chiến kịch tính!"
  lover.3211.c.tt:0 "#F Không gì nói lên tình yêu như chiến đấu vì điều ngươi trân trọng!#!"
  lover.3211.d:0 "Một chợ nhộn nhịp là hình ảnh hoàn hảo!"
  lover.3211.d.tt:0 "#F [lover.GetSheHe|U] chắc chắn sẽ thích bức tranh sống động, đầy cơ hội.#!"
  lover.3211.e:0 "Một bức tranh miêu tả cuộc đối thoại giữa Socrates và Phaedrus!"
  lover.3211.e.tt:0 "#F Cách nào tốt hơn để tôn vinh tình yêu của chúng ta bằng cách diễn tả một trong những cuộc thảo luận đầu tiên về chủ đề này?#!"
  lover.3211.f:0 "Ta không có thời gian cho những chuyện xa xỉ như vậy."
  lover.3211.appreciate:0 "Nếu [lover.GetFirstNameNoTooltip] trân trọng cử chỉ:"

  lover.3212.desc_opening:0 "Một món quà cho [ROOT.Char.Custom('LoverPetName')] [ROOT.Char.GetFirstNameNoTooltip],\n\n"
  lover.3212.desc_lifestyle_schemer:0 "Bức tranh miêu tả con hẻm u tối ở [capital.GetNameNoTier] ngay trước bình minh, nhưng Ta sẽ để các biểu tượng và hàm ý ẩn trong bóng tối để ngươi tự khám phá."
  lover.3212.desc_lifestyle_scholar:0 "Bức tranh miêu tả Abraham và Sarah đứng bên nhau, hòa hợp như chúng ta, sẵn sàng đối mặt với tương lai. Ta hy vọng ngươi sẽ trân trọng ý nghĩa biểu tượng của bức tranh."
  lover.3212.desc_lifestyle_general:0 "Bức tranh miêu tả trận chiến tuyệt vời; những anh hùng vĩ đại chiến thắng cái ác. Cũng như bức tranh làm máu Ta sôi lên, chỉ nhắc đến tên ngươi thôi cũng khiến Ta bùng cháy, người yêu dấu [ROOT.Char.GetFirstNameNoTooltip]!"
  lover.3212.desc_lifestyle_administrator:0 "Bức tranh miêu tả một chợ nhộn nhịp, đầy người và hàng hóa, cũng như trái tim Ta đầy yêu thương dành cho ngươi. Xin hãy để bức tranh nhắc ngươi về những cơ hội mỗi ngày, cũng như tình cảm Ta!"
  lover.3212.desc_lifestyle_diplomat:0 "Bức tranh diễn giải cuộc đối thoại giữa Socrates và Phaedrus về tình yêu và hùng biện, lấy cảm hứng từ tình yêu Ta dành cho ngươi."
  lover.3212.a.perfect:0 "#F Ta chưa từng thấy bức tranh nào nói với Ta như thế này trước đây!#!"
  lover.3212.a:0 "Thật tuyệt!"
  lover.3212.b:0 "Bức tranh xấu xí, vứt đi!"

  lover.3213.desc_perfect:0 "Chưa bao giờ Ta thấy một tác phẩm nghệ thuật như bức tranh ngươi gửi. Nó chạm đến tận tâm can Ta,"
  lover.3213.desc:0 "Bức tranh ngươi gửi được Ta trân trọng. Sự chăm chút và tài năng thể hiện rõ ràng,"
  lover.3213.desc_lifestyle_schemer:0 "và những chi tiết tinh tế, hàm ý ẩn trong góc tối của con hẻm thực sự ám chỉ một ý nghĩa sâu xa!"
  lover.3213.desc_lifestyle_scholar:0 "và việc chọn Abraham và Sarah làm motif thật là một sáng kiến tuyệt vời!"
  lover.3213.desc_lifestyle_general:0 "và trận chiến được miêu tả khiến Ta sôi máu, Ta háo hức được gặp ngươi, tình yêu của Ta!"
  lover.3213.desc_lifestyle_administrator:0 "và chợ nhộn nhịp, đầy người và cơ hội, dường như sống động hơn bao giờ hết!"
  lover.3213.desc_lifestyle_diplomat:0 "và thấy cuộc đối thoại nổi tiếng được diễn tả như vậy thật truyền cảm hứng!"
  lover.3213.a:0 "Ta mừng [lover.GetSheHe] trân trọng món quà!"

  lover.3214.desc:0 "Ta trân trọng cử chỉ, nhưng bức tranh ngươi gửi là một trong những tác phẩm xấu xí nhất Ta từng thấy. Có phải đây là một trò đùa không?"
  lover.3214.a:0 "Ahaha... đúng. Một trò đùa."

  lover.3215.t:0 "Ngợi Ca Ngươi"
  lover.3215.desc:0 "Vì Ta không thể ở bên [lover.GetTitledFirstNamePossessive], Ta lo rằng [lover.GetSheHe] sẽ quên rằng tình cảm Ta dành cho [lover.GetHerHim] cháy bỏng thế nào.\n\nGửi một [lover.Custom('MusicalPerformer')] thay mặt Ta trong nghệ thuật tán tỉnh, quyến rũ [lover.GetHerHim] bằng thơ, ca khúc, và lời ngọt ngào viết nhân danh Ta, chắc chắn sẽ nhắc nhở [lover.GetHerHim]!"
  lover.3215.a:0 "Ta sẽ gửi người giỏi nhất ngay lập tức!"
  lover.3215.a.tt:0 "Một [lover.Custom('MusicalPerformer')] trong biên chế của Ta sẽ tham gia [THIS.Char.Custom('GetCourt')] tại [court_location.GetNameNoTier]"
  lover.3215.b:0 "Ai cũng được, đúng không?"
  lover.3215.c:0 "Ta sẽ không nhờ một nhạc sĩ tán tỉnh thay Ta."
  lover.3215.c.tt:0 "#F Ta chắc sẽ có cơ hội khác, cá nhân hơn#!"

  lover.3216.desc:0 "Một [lover.Custom('MusicalPerformer')] đến triều đình, chính thức để biểu diễn và giải trí, nhưng sớm tiếp cận Ta để tiết lộ lý do thực sự."
  lover.3216.desc_fancy_troubadour:0 "Một [lover.Custom('MusicalPerformer')] đến triều đình, hát bằng giọng tuyệt diệu như thần thánh, và diễn đạt lời văn trôi chảy như dòng sông. Người đó sớm tiếp cận Ta để tiết lộ lý do thực sự."
  lover.3216.desc_ending:0 "\n\n"[original_lover.GetTitledFirstName] đã gửi ta đến, để đảm bảo với ngài về tình yêu [original_lover.GetHerHis] và để thực hiện cho ngài, [ROOT.Char.Custom('FormOfAddressForLiege')].""
  lover.3216.a:0 "Thật tuyệt vời!"
  lover.3216.b:0 "Tại sao [original_lover.GetSheHe] phải gửi người khác để tán tỉnh [original_lover.GetHerHis]?!"

  lover.3217.desc:0 "Người [lover.Custom('MusicalPerformer')] ngươi gửi thật tuyệt vời! Người ấy hát như chim hót, và diễn đạt lời văn như sinh ra đã cầm con thoi. Mỗi ngày Ta đều nhớ đến tình yêu của ngươi, và cuộc sống Ta trở nên phong phú hơn!"
  lover.3217.a:0 "Ta mừng!"

  lover.3218.desc:0 "Ngươi đang chế giễu Ta sao, [ROOT.Char.Custom('LoverPetName')]? [lover.Custom('MusicalPerformer')] ngươi gửi gần như không giữ nổi nốt nào, và Ta đã thưởng thức những lời văn dành cho trẻ con còn có nội dung hơn."
  lover.3218.a:0 "Ta #EMP biết#! Ta không nên chọn kẻ hát rong đường phố!"

  lover.3219.t:0 "Kỷ Vật Cá Nhân"
  lover.3219.desc:0 "Người [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))] [lover.GetTitledFirstName] sống quá xa vòng tay Ta... Nếu [lover.GetSheHe] có thứ gì để nhớ về Ta, thứ cá nhân, Ta sẽ yên tâm hơn."
  lover.3219.a:0 "[lover.GetSheHe|U] sẽ nhận một lọn tóc của Ta."
  lover.3219.a.tt:0 "#F [lover.GetSheHe|U] chắc cũng nhớ Ta dữ dội.#!"
  lover.3219.b:0 "Ta sẽ gửi [lover.GetHerHim] một số đồ lót của Ta!"
  lover.3219.b.tt:0 "#F Chắc chắn [lover.GetSheHe] sẽ trân trọng cử chỉ táo bạo.#!"
  lover.3219.c:0 "Gửi [lover.Custom2('LoverSeductionObjectIndefinite', ROOT.Char)], để nhắc lại kỷ niệm xưa."
  lover.3219.c.tt:0 "#F Ta biết [lover.GetSheHe] có thể rất lãng mạn.#!"
  lover.3219.d:0 "Ta không có thời gian cho những món quà vô nghĩa như vậy."
  lover.3219.d.tt:0 "#F Ta sẽ tìm cơ hội tốt hơn để cho [lover.GetHerHim] thấy Ta nhớ [lover.GetHerHim] nhiều thế nào!#!"

  lover.3220.desc_opening:0 "Mỗi ngày không có ngươi đều trống rỗng, và mỗi khoảnh khắc xa vòng tay ngươi là cực hình."
  lover.3220.desc_hair:0 "Để nhắc ngươi về tình yêu của Ta khi Ta không có mặt, Ta đã gửi ngươi một món quà cá nhân: một lọn tóc của Ta."
  lover.3220.desc_smallclothes:0 "Để nhắc ngươi về tình yêu của Ta khi Ta không có mặt, Ta đã gửi ngươi một món quà thân mật: một vài đồ lót của Ta."
  lover.3220.desc_object:0 "Để nhắc ngươi về tình yêu của Ta khi Ta không có mặt, Ta đã gửi ngươi một món quà gợi nhớ quá khứ của chúng ta: [ROOT.Char.Custom2('LoverSeductionObjectIndefinite', SCOPE.sC('original_lover'))]."
  lover.3220.a:0 "Món quà này thật dễ thương!"
  lover.3220.b:0 "Ta nên làm gì với thứ này đây?"
  lover.3220.b.tt_smallclothes:0 "#F Eo ơi. Kinh quá.#!"

  lover.3221.desc_opening:0 "Món quà ngươi gửi đã nhanh chóng trở nên quý giá với Ta."
  lover.3221.desc_hair:0 "Sự bực bội khi hiếm khi được ở bên ngươi sẽ dễ chịu hơn khi có một phần của ngươi ở gần."
  lover.3221.desc_smallclothes:0 "Sự bực bội khi hiếm khi được ở bên ngươi sẽ dễ chịu hơn khi có món đồ thân mật này nhắc Ta về những gì chúng ta chia sẻ."
  lover.3221.desc_object:0 "Sự bực bội khi hiếm khi được ở bên ngươi sẽ dễ chịu hơn khi có món quà nhắc nhớ về quá khứ chúng ta đã cùng trải qua."
  lover.3221.a:0 "Ta mừng vì [lover.GetSheHe] thích món quà!"

  lover.3222.desc_opening:0 "Món quà ngươi gửi thật sự… cá nhân."
  lover.3222.desc_hair:0 "Ta phải hỏi — Ta nên làm gì với lọn tóc này? Có phải để cho một nghi lễ huyền bí nào không?"
  lover.3222.desc_smallclothes:0 "Ta phải hỏi — điều gì khiến ngươi gửi Ta món đồ hở hang này?"
  lover.3222.desc_object:0 "Ta phải hỏi — tại sao ngươi lại tập trung quá nhiều vào quá khứ giữa chúng ta? Ngươi không thấy tương lai sao?"
  lover.3222.a:0 "Ta không thể tin [lover.GetSheHe] không trân trọng món quà!"

  lover.7001.t:0 "Người Ngài [potential_lover.Custom2('ComplimentAdjective', ROOT.Char)|U] Của Ta"
  lover.7001.desc:0 "Ngồi bên cạnh [potential_lover.GetTitledFirstNamePossessive], nói về [potential_lover.Custom('herhis_subject_of_interest')], nhìn thấy [potential_lover.GetHerHim] mỉm cười [potential_lover.Custom('quirk_pos_adverb')]… Khi ánh mắt chúng Ta gặp nhau, tim Ta đập nhanh hơn, và nhìn vào sự đỏ mặt của [potential_lover.GetHerHis], Ta không phải là người duy nhất cảm thấy căng thẳng đột ngột."
  lover.7001.a:0 "Ta sẽ giữ khoảnh khắc này lâu nhất có thể!"
  lover.7001.a.tt:0 "#F Có thể một ngày nào đó chúng Ta sẽ hơn cả Bạn Bè?#!"
  lover.7001.b:0 "Về chuyện ngươi đang nói…"
  lover.7001.b.tt:0 "#F Ta không muốn [potential_lover.GetHerHim] nghĩ rằng chúng Ta có thể là gì hơn Bạn Bè.#!"

  lover.7002.t:0 "Người Ngài [proposing_friend.Custom2('ComplimentAdjective', ROOT.Char)|U] Của Ta"
  lover.7002.desc:0 "Ngồi bên cạnh [proposing_friend.GetTitledFirstNamePossessive], nói về [ROOT.Char.Custom('subject_of_interest')], bắt gặp ánh mắt [proposing_friend.GetHerHis] khi Ta mỉm cười… Đột nhiên, căng thẳng trở nên rõ rệt, và nhìn vào sự đỏ mặt của [proposing_friend.GetHerHis], Ta không phải là người duy nhất cảm thấy điều này."

  lover.7003.t:0 "Đối Thủ [potential_lover.Custom2('InsultAdjective', ROOT.Char)|U]"
  lover.7003.desc:0 "[potential_lover.GetTitledFirstName] lại lao vào một trận tranh cãi về [potential_lover.Custom('herhis_subject_of_interest')], và khi Ta để tâm trí lang thang, không thể không nhận ra rằng [potential_lover.GetSheHe] thực sự là một [potential_lover.Custom2('ComplimentAdjective', ROOT.Char)] [potential_lover.GetWomanMan].\n\nCăng thẳng giữa chúng Ta không phải điều mới, nhưng khi ánh mắt gặp nhau, tim Ta rung lên với thứ khác ngoài thù hận…"
  lover.7003.a:0 "Đối thủ [potential_lover.Custom2('InsultNoun', ROOT.Char)] đã đặt bùa gì lên Ta vậy?!"
  lover.7003.a.tt:0 "#F Ta phải điều tra cảm giác kỳ lạ này thêm…#!"
  lover.7003.b:0 "Chắc chắn Ta chỉ cảm thấy ghét thôi."

  lover.7004.t:0 "Đối Thủ [proposing_rival.Custom2('InsultAdjective', ROOT.Char)|U]"
  lover.7004.desc_opening:0 "Trong lúc thảo luận say sưa về [ROOT.Char.Custom('subject_of_interest')], Ta thấy [proposing_rival.GetTitledFirstName] ở phía đối diện [ROOT.Char.Custom('GetRoom')], cau mày.\n\n"
  lover.7004.desc_potential_lover_is_go:0 "Khi ánh mắt gặp nhau [proposing_rival.GetSheHe], Ta ngạc nhiên khi thấy [proposing_rival.Custom('quirk_pos_adverb')] mỉm cười. Liệu [proposing_rival.GetSheHe] luôn là một [proposing_rival.Custom2('ComplimentAdjective', ROOT.Char)] [proposing_rival.GetWomanMan] như vậy?"
  lover.7004.desc_not:0 "Khi ánh mắt gặp nhau [proposing_rival.GetSheHe] cau mày và nhìn đi chỗ khác nhanh chóng — vẫn là một [proposing_rival.Custom2('InsultNoun', ROOT.Char)] như thường lệ!"
  lover.7004.a:0 "Ta mỉm cười lại…?"
  lover.7004.a.tt:0 "#F Sao tim Ta lại rung lên đột ngột thế này?#!"
  lover.7004.b:0 "Eo, để Ta yên [proposing_rival.GetFirstNameNoTooltip]."

  lover.7005.t:0 "Người Yêu [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('potential_lover') )|U] Của Ta"
  lover.7005.desc:0 "Ta không bỏ qua việc [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('potential_lover') )] [potential_lover.GetTitledFirstName] là một [potential_lover.GetWomanMan] rất đẹp. Cách [potential_lover.GetSheHe] mỉm cười và [potential_lover.Custom('quirk_pos_present')] luôn làm tim Ta rung lên…"
  lover.7005.a:0 "Cảm giác này với [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('potential_lover') )] có bình thường không?"
  lover.7005.a.tt:0 "#F Dù sao đi nữa, Ta muốn nhiều hơn nữa!#!"
  lover.7005.b:0 "[potential_lover.GetSheHe|U] là [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('potential_lover') )] của Ta. Giữ bình tĩnh [ROOT.Char.GetFirstNameNoTooltip]!"

  lover.7006.t:0 "Người Yêu [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('proposing_family') )|U] Của Ta"
  lover.7006.desc:0 "Người [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('proposing_family') )] [proposing_family.GetTitledFirstName] là một [proposing_family.Custom2('ComplimentAdjective', ROOT.Char)] [proposing_family.GetWomanMan]; Ta đã biết điều đó từ lâu. Nhưng gần đây [proposing_family.GetSheHe] bắt đầu linger quanh Ta, mỉm cười ngọt ngào hơn bình thường, nhìn Ta khi [proposing_family.GetSheHe] nghĩ rằng Ta không thấy [proposing_family.GetHerHim]…"
  lover.7006.a:0 "Ta cũng bị hấp dẫn bởi [proposing_family.GetHerHim]!"
  lover.7006.a.tt:0 "#F Nhưng sẽ chẳng có gì xảy ra… Chỉ tưởng tượng tới vụ bê bối thôi!#!"
  lover.7006.b:0 "Chắc chắn chỉ là tình yêu [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('proposing_family') )] thôi."

  lover.8102.t:0 "$pilgrimage_header$ Hậu Quả"
  lover.8102.desc:0 "\"Xin lỗi,\" Một nông dân quen thuộc xuất hiện trước mặt Ta. Khi Ta vắt óc nghĩ xem mình đã gặp [brothel_worker.GetHerHim] ở đâu trước đây, [brothel_worker.GetSheHe] trả lời như đọc suy nghĩ Ta.\n\n\"Chúng ta gặp nhau tại một nhà thổ ở [brothel_location.GetName]. Ngươi đã trả tiền cho dịch vụ của Ta.\" Một vệt hồng lan tỏa trên má [brothel_worker.GetHerHis].\n\"Để chúng ta tái ngộ... chắc chắn là định mệnh khi\""
  lover.8102.desc.puppy_love:0 "Ta đã phải lòng ngươi. Mọi thứ thật đúng đắn trong vòng tay ngươi… Có chỗ nào trong trái tim ngươi cho một người như Ta không?\""
  lover.8102.desc.they_pregnant:0 "Ta đang mang thai con của ngươi. Trà chắc không chứa thảo mộc đúng. Ta không muốn nuôi con một mình.\""
  lover.8102.desc.you_pregnant:0 "ngươi có thể đang mang thai. Trà không chứa thảo mộc và công lực đúng. Ta không muốn ngươi nuôi con một mình.\""
  lover.8102.desc.ending:0 "\n\nGiọng [brothel_worker.GetHerHis|U] lịm dần và [brothel_worker.GetSheHe] mỉm cười e thẹn với Ta. Hay có lẽ đó là nụ cười hiểu chuyện?"
  lover.8102.a:0 "Ta sẽ chịu hoàn toàn trách nhiệm về hành động của mình."
  lover.8102.b:0 "Ngươi chỉ đang bày trò với Ta, phải không!?"
  lover.8102.c:0 "Quên đêm đó đi, nếu không sẽ chẳng ai còn nghe tin từ ngươi nữa."
  lover.8102.c.success:0 "[brothel_worker.GetTitledFirstNameNoTooltip] bị dọa im lặng"
  lover.8102.c.failure:0 "[brothel_worker.GetTitledFirstNameNoTooltip] đồng ý im lặng với một cái giá"
  lover.8102.c.crit_failure:0 "[brothel_worker.GetTitledFirstNameNoTooltip] kể cho cả thế giới những gì ngươi đã làm"
  lover.8102.d:0 "Ngươi có thể đi cùng Ta, miễn là giữ bí mật quá khứ của chúng ta."
