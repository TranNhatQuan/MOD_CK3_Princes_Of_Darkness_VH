l_english:
  friendship.0001.t:0 "Dần Xa Cách"
  friendship.0001.desc_opening:1 "Thời gian và con người đều thay đổi. Đôi khi những người từng gần gũi nhất với chúng ta lại trở nên xa lạ.\n\n"[ROOT.Char.GetTitledFirstNameNoTooltip]," [friend_in_question.Custom2('MyCharacterIntroduction', ROOT.Char)] mỉm cười buồn bã."
  friendship.0001.desc_murder:0 ""Việc ngươi giết người... Ta cảm thấy giữa chúng ta không còn Tình bạn nào nữa.""
  friendship.0001.desc:0 ""Ta cảm thấy giữa chúng ta không còn Tình bạn nào nữa.""
  friendship.0001.a:0 "Đó là lẽ đời."
  friendship.0001.b:1 "Nhưng... Hãy nhớ lại tất cả những khoảng thời gian tốt đẹp!"
  friendship.0001.b.tt:0 "[friend_in_question.GetSheHe|U] sẽ cho mối quan hệ của chúng ta thêm một cơ hội"

  friendship.0002.t:0 "Dần Xa Cách"
  friendship.0002.desc:0 "Thời gian và con người đều thay đổi. Đôi khi những người từng gần gũi nhất với chúng ta lại trở nên xa lạ.\n\nRõ ràng [first_friend.GetTitledFirstName] và ta không còn có thể gọi là Ngài nữa."
  friendship.0002.a:0 "Đó là lẽ đời."

  friendship.0003.t:0 "Điều Gì Đó Hơn Thế"
  friendship.0003.desc_intro:0 "Người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friend_as_potential_lover'))] của ta "
  friendship.0004.desc_intro:0 "Người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('first_friend'))] của ta "
  friendship.0003.desc:0 "[friend_as_potential_lover.GetTitledFirstName] rất quan trọng với ta. Ta thường xuyên nghĩ về [friend_as_potential_lover.GetHerHim], và đôi khi gần như không chịu nổi khoảng cách giữa chúng ta.\n\nĐây chỉ là minh chứng cho Tình bạn sâu sắc của chúng ta, hay là điều gì đó hơn thế nữa?"
  friendship.0003.a:0 "Ta nên viết thư cho [friend_as_potential_lover.GetHerHim], [friend_as_potential_lover.GetSheHe] luôn đưa ra lời khuyên tốt."
  friendship.0003.goes_for_it_tooltip:1 "Ngài thổ lộ tình cảm của mình với [friend_as_potential_lover.GetTitledFirstName]"
  friendship.0003.b:0 "Không, chúng ta là Ngài, và chỉ là Ngài."
  friendship.0004.desc:1 "[first_friend.GetTitledFirstName] rất quan trọng với ta. Ta thường xuyên nghĩ về [first_friend.GetHerHim], và đôi khi gần như không chịu nổi khoảng cách giữa chúng ta.\nĐây chỉ là minh chứng cho Tình bạn sâu sắc của chúng ta, hay là điều gì đó hơn thế nữa?"
  friendship.0004.a:0 "Ôi, ta không thể chối bỏ nỗi khao khát này nữa!"
  friendship.0004.goes_for_it_tooltip:1 "Ngài quyết định thổ lộ tình cảm của mình"
  friendship.0004.b:0 "Không, chúng ta là những người Bạn Tốt, và chỉ vậy thôi."
  friendship.0005.t:0 "Lời Từ Chối Nhẹ Nhàng"
  friendship.0005.desc:0 "Dù ta cố nói một cách mơ hồ, [friend_as_potential_lover.GetTitledFirstName] vẫn hiểu chính xác điều ta muốn nói, như mọi khi. Câu trả lời của [friend_as_potential_lover.GetHerHis|U] được nói rất dịu dàng, đầy quan tâm, nhưng vẫn khiến ta đau đớn.\n\n[friend_as_potential_lover.GetSheHe|U] có tình cảm sâu sắc với ta, nhưng chỉ là Tình bạn."
  friendship.0005.a:0 "Ta cố không để nỗi đau lộ ra trên mặt. "Ồ, ngươi hiểu nhầm ta rồi.""
  friendship.0005.b:1 "Tại sao ngươi lại đẩy ta ra khi ta biết ngươi cũng cảm thấy như vậy, [friend_as_potential_lover.GetFirstNameNoTooltip]?"
  friendship.0005.c:0 "Trong đó cũng có một vẻ đẹp."
  friendship.0007.t:0 "Khi Sự Quan Tâm Trở Thành Đam Mê"
  friendship.0007.desc:0 "Tim ta đập dồn dập khi đưa tay chạm vào má của [friend_as_potential_lover.GetTitledFirstNamePossessive], dù ta biết [friend_as_potential_lover.GetSheHe] sẽ không né tránh.\n\nCái ôm của chúng ta tràn đầy tình yêu hơn bất cứ điều gì ta từng cảm nhận trước đây."
  friendship.0007.a:1 "Ôi, [friend_as_potential_lover.GetFirstNameNoTooltip]!"
  friendship.0008.t:0 "Khi Sự Quan Tâm Trở Thành Đam Mê"
  friendship.0008.desc:0 "Tim ta đập dồn dập khi đưa tay chạm vào má của [first_friend.GetTitledFirstNamePossessive], dù ta biết [first_friend.GetSheHe] sẽ không né tránh.\n\nCái ôm của chúng ta tràn đầy tình yêu hơn bất cứ điều gì ta từng cảm nhận trước đây."
  friendship.0008.a:1 "Ôi, [first_friend.GetFirstNameNoTooltip]!"
  friendship.0009.t:0 "Những Điều Đáng Lẽ Có Thể"
  friendship.0009.desc:0 "Sau khi [friend_as_potential_lover.GetHerHis] qua đời, ta đã trải qua nhiều buổi tối muộn một mình, nghĩ về [friend_as_potential_lover.GetFirstName]. Trung thành, thân thiện và ấm áp đến cuối cùng, ta không thể không nghĩ về những điều đáng lẽ đã có thể xảy ra, nếu [friend_as_potential_lover.GetSheHe] không rời xa ta quá sớm."
  friendship.0009.a:1 "Yên nghỉ nhé, [friend_as_potential_lover.GetFirstNameNoTooltip] thân yêu"
 
  friendship.0010.t:0 "Dần Xa Cách"
  friendship.0010.desc:0 "Ta chưa từng nghĩ sẽ thấy vẻ mặt bối rối ấy trên khuôn mặt của [best_friend.GetTitledFirstNamePossessive] khi ta kể cho [best_friend.GetHerHim] nghe về những giấc mơ của mình. Ta từng nghĩ [best_friend.GetSheHe] sẽ luôn hiểu ta, luôn đứng về phía ta.\n\nThế nhưng đôi khi khi gặp nhau, ta cảm thấy như đang nói chuyện với một người xa lạ."
  friendship.0010.a:0 "Chúng ta phải cố gắng hàn gắn lại Tình bạn!"
  friendship.0010.b:0 "Chuyện này không còn đáng để cố gắng nữa."
  friendship.0010.a.success:0 "Ta hàn gắn được mối quan hệ"
  friendship.0010.a.failure:0 "Nỗ lực của ta trở nên vô ích"
  friendship.0010.a.success.message:0 "[best_friend.GetTitledFirstName] và ta vẫn là những người Bạn Thân nhất."
  friendship.0010.a.failure.message:0 "Ta đã thất bại trong việc hàn gắn mối quan hệ với [best_friend.GetTitledFirstName]."

  friendship.0011.t:0 "Dần Xa Cách"
  friendship.0011.desc:0 "Kết thúc đến chậm rãi và không kịch tính, nhưng cũng không thể tránh khỏi như dòng chảy của thời gian. Ta từng nghĩ [other_best_friend.GetTitledFirstName] sẽ mãi là người Bạn Thân nhất của mình, nhưng hôm nay lời xin lỗi gượng gạo của [other_best_friend.GetHerHis] cũng không khiến ta ngạc nhiên."
  friendship.0011.a:0 "Chúng ta đã có những khoảng thời gian tốt đẹp, nhưng đã đến lúc buông bỏ."

  friendship.0014.t:0 "Sự Phản Bội"
  friendship.0014.desc:0 "Sau tất cả những gì chúng ta đã trải qua cùng nhau, ta vẫn không thể tin [friend_to_rival.GetTitledFirstName] lại làm những điều [friend_to_rival.GetSheHe] đã làm.\nĐó là sự phản bội đối với mọi cử chỉ thân thiện mà chúng ta đã chia sẻ. Thật vậy, là một sự phản bội đối với tình bạn của chúng ta! Chúng ta từng chia sẻ miếng cơm, nhưng giờ đây [friend_to_rival.GetSheHe] đã trở thành kẻ thù suốt đời."
  friendship.0014.a:0 "[friend_to_rival.GetFirstName] sẽ phải trả giá!"

  friendship.0015.opening:0 "[original_friend.Custom2('AppropriateGreeting', ROOT.Char)]"
  friendship.0015.desc:0 "Ta lên án Tình bạn mà ngươi đã khinh suất đem ra chế giễu!\nCho tất cả những lời hứa và cử chỉ của ngươi cuối cùng lại kết thúc trong ô nhục... Biết ngươi như ta bây giờ, lẽ ra ta không nên ngạc nhiên.\n\nChính ngươi đã tự mang nỗi đau này đến cho mình."
  friendship.0015.a:0 "Kẻ ngốc ở đây là ngươi, [original_friend.GetFirstNameNoTooltip]."

  friendship.0018.t:0 "Bạn Bè Nhiều Hơn Thời Gian"
  friendship.0018.desc:0 "Một [ROOT.GetCharacter.Custom('friendship_metaphor_with_tending')].\nVới quá nhiều Bạn Bè rải rác khắp nơi, ta hầu như chỉ có thời gian giữ liên lạc bằng thư, chứ chưa nói đến việc dành sự quan tâm mà họ xứng đáng nhận được.\nCó lẽ sẽ dễ dàng hơn nếu ta để một ai đó... dần xa cách."
  friendship.0018.a:0 ""Ta rất tiếc khi phải viết tin không vui này, [friend_1.GetTitledFirstNameNoTooltip]...""
  friendship.0018.b:0 ""Ngươi đã đối xử tốt với ta, [friend_2.GetFirstNameNoTooltip], nhưng...""
  friendship.0018.c:0 ""Không phải lỗi của ngươi, mà là của ta, [friend_3.GetFirstNameNoTooltip]...""
  friendship.0018.d:0 "Ta sẽ không phụ lòng bất kỳ người Ngài nào!"
  friendship.0018.e:0 "Ồ không, ta vẫn xoay xở được."
  friendship.0019.t:0 "Ngừng Liên Lạc"
  friendship.0019.desc:0 "Ta đã chờ lá thư mới nhất của [first_friend.GetTitledFirstNamePossessive] rất lâu, nhưng chẳng có gì đến cả. Ta cũng đã gửi thư của mình, nhưng không nhận được hồi đáp.\nKết luận hiển nhiên là [first_friend.GetSheHe] không còn xem ta là người Ngài đáng để dành thời gian và sự quan tâm nữa."
  friendship.0019.a_1:0 "Ta là một trong số ít người sẽ trả lời khi ngươi cần, [first_friend.GetFirstNameNoTooltip]."
  friendship.0019.a_2:0 "Có lẽ ta cũng không phải là người Bạn Tốt nhất, [first_friend.GetFirstNameNoTooltip]."
 
  friendship.1002.opening:0 "[sender.Custom2('AppropriateGreeting', ROOT.Char)]"
  friendship.1002.desc:0 "Xin hãy nhận món quà này như một cử chỉ trân trọng cho Tình bạn lâu dài của chúng ta."
  friendship.1002.a:0 "Mong tình  Bạn củachúng ta mãi nở rộ!"
  friendship.1003.desc:2 "Thợ săn của ta đã bắt được con hươu đực sống này, và sự uy nghi của nó khiến ta nhớ đến ngươi!\n\nXin hãy nhận nó như biểu tượng cho Tình bạn vĩnh cửu của chúng ta!"
  friendship.1003.a:2 "Hãy để nó tự do trong khu vườn!"
  friendship.1003.b:1 "Nó sẽ cho ra những miếng thịt thật tinh tế..."
  garden_stag_modifier:0 "Hươu Đực Trong Vườn"
  impromptu_venison_feast_modifier:0 "Yến Tiệc Thịt Nai Bất Ngờ"
  friendship.1004.desc:1 "Để bày tỏ sự trân trọng đối với Tình bạn lâu dài của chúng ta, ta muốn chia sẻ một điều mà ngươi có thể thấy thú vị.\n\nHãy sử dụng thông tin này tùy ý."
  friendship.1004.a:0 "Thật hào phóng!"
 
  friendship.1006.t:0 "Sự Hỗ Trợ"
  friendship.1006.desc:1 "Lo lắng cho cuộc chiến hiện tại của ta, bạn của ta [friend.GetTitledFirstName] đã trả tiền từ chính ngân khố [friend.GetHerHis] để hỗ trợ các nỗ lực của ta!"
  friendship.1006.desc_2:0 "\n\nDẫn đầu một đoàn xe chở đầy vàng [friend.GetHerHis], [friend.GetFirstNameNoTooltip] đã đến sớm sáng nay tại trại chính của ta, và giờ đang bận rộn trả lương cho binh lính của ta. [friend.GetSheHe|U] thực sự rất hào phóng."
  friendship.1006.a:0 "Ta không thể biết ơn hơn nữa."
  friendship.1006.b:0 "[friend.GetFirstNameNoTooltip], ta cần #EMP nhiều hơn nữa!#!"
 
  friendship.1007.t:0 "Sự Phản Trắc và Xảo Quyệt"
  friendship.1007.desc:0 "Không có khả năng giải quyết cuộc chiến [friend_at_war.GetHerHis] một mình, [friend_at_war.GetTitledFirstName] đã nhận được sự trợ giúp bằng một khoản tiền lớn từ [friend_providing_gift.GetTitledFirstName]!"
  friendship.1007.a:0 "Thật đáng hổ thẹn!"
  friendship.1008.t:0 "Một Nhân Vật Xuất Sắc"
  friendship.1008.desc:0 "[courtier_on_offer.GetTitledFirstName] đã phục vụ ta rất tốt từ lâu, và xuất sắc trong các nhiệm vụ [courtier_on_offer.GetHerHis]. Điều đó làm ta nghĩ rằng [courtier_on_offer.GetSheHe] chính là kiểu người mà [friend_receiving_gift.GetTitledFirstName] có thể cần quanh [friend_receiving_gift.GetHerHis] [friend_receiving_gift.Custom('GetCourt')]."
  friendship.1008.a:0 "[friend_receiving_gift.GetFirstNameNoTooltip] sẽ trân trọng sự phục vụ của [courtier_on_offer.GetHerHis]."
  friendship.1008.a.success:0 "[friend_receiving_gift.GetFirstName] chấp nhận đề nghị của Ngài"
  friendship.1008.a.failure:0 "[friend_receiving_gift.GetFirstName] từ chối đề nghị của Ngài"
  friendship.1008.b:0 "Không, ta cần [courtier_on_offer.GetTitledFirstNameNoTooltip] ở đây."
  friendship.1008.b.tt:0 "[courtier_on_offer.GetTitledFirstName] ở lại [THIS.Char.Custom('GetCourt')] của Ngài"
  friendship.1009.t:0 "Một Lời Khuyên"
  friendship.1009.desc:0 "Đây không phải là lần đầu tiên ta nghe nói về việc [courtier_on_offer.GetTitledFirstName] là một người phục vụ tuyệt vời như thế nào, và giờ [first_friend.GetTitledFirstName] đã gửi [courtier_on_offer.GetHerHim] đến [ROOT.Char.Custom('GetCourt')] của ta. [courtier_on_offer.GetSheHe|U] tự giới thiệu mình [courtier_on_offer.GetHerselfHimself] như một biểu tượng của tình bạn giữa [first_friend.GetFirstName] và ta."
  friendship.1009.a:1 "Chào mừng đến phục vụ ta, [courtier_on_offer.GetFirstNameNoTooltip]!"
  friendship.1009.b:1 "Ngươi không thể giỏi đến vậy nếu [first_friend.GetTitledFirstNameNoTooltip] có thể dễ dàng cho ngươi đi như thế."
  friendship.1009.rejection_tooltip:1 "[courtier_on_offer.GetTitledFirstNameNoTooltip] bị gửi trở lại"
 
  friendship.2001.t:0 "Nhu Cầu Phải Nói Ra"
  friendship.2001.desc:0 "Những bí mật của ta là gánh nặng khó chịu mà ta không thể đặt xuống, nhưng nếu chia sẻ chúng với ai đó, có lẽ chúng sẽ nhẹ hơn.\n\nTa tin chắc rằng [friend_receiving_confession.GetTitledFirstName] sẽ hiểu ta."
  friendship.2001.a:1 "Lại gần đây, [friend_receiving_confession.GetFirstNameNoTooltip], ta có điều cần thú nhận."
  friendship.2001.b:0 "Không... không ai được biết!"
  friendship.2002.t:0 "Một Bí Mật Được Thổ Lộ"
  friendship.2002.desc:0 "[confessor.GetTitledFirstName] đã tìm đến ta để chia sẻ điều gì đó đã đè nặng tâm trí của [confessor.GetHerHis].\n\nTa đã thể hiện sự thấu hiểu lớn nhất với [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('confessor'))] của mình. Nhưng trong lòng ta cũng không khỏi tò mò..."
  friendship.2002.a:0 "Ngươi đã đúng khi đặt niềm tin vào ta, [confessor.GetFirstNameNoTooltip]."
  friendship.2002.b:0 "[confessor.GetFirstNameNoTooltip], ta cũng có một điều cần thú nhận."
  friendship.2003.t:0 "Một Bí Mật Được Chia Sẻ"
  friendship.2003.desc:0 "Khi ta chia sẻ bí mật của mình với [friend_receiving_confession.GetTitledFirstName], đôi mắt [friend_receiving_confession.GetHerHis] mở to.\n "Tại sao [SCOPE.GetRootScope.GetCharacter.GetFirstName], tôi cũng có điều muốn nói với ngài!"\n\nChuyện là, [friend_receiving_confession.GetFirstName] cũng có một bí mật tương tự [friend_receiving_confession.GetHerHis]!"
  friendship.2003.a:0 "Thật tốt khi cả hai chúng ta đều biết."
  friendship.2004.t:0 "Một Gánh Nặng Khủng Khiếp"
  friendship.2004.desc:0 "Ta không thể giữ sự thật này trong lòng nữa, nó đang gặm nhấm linh hồn ta. Phải có ai đó biết.\n\n[friend_receiving_confession.GetTitledFirstName] sẽ hiểu và giúp ta vơi bớt gánh nặng."
  friendship.2004.a:0 "Ta phải nói với [friend_receiving_confession.GetHerHim]."
  friendship.2005.t:0 "Một Bí Mật Được Thổ Lộ"
  friendship.2005.desc:0 "[confessor.GetTitledFirstName] nói rằng đó là một bí mật đen tối mà [confessor.GetSheHe] cảm thấy cần chia sẻ với ta, nhưng ta chưa từng tưởng tượng ra điều này!\n\nÍt nhất thì người  Bạn củata cũng không còn phải mang gánh nặng của bí mật này một mình nữa."
  friendship.2005.a:0 "Ngươi đã đúng khi đặt niềm tin vào ta,  Bạn củata."
  friendship.2005.b:0 "[confessor.GetFirstNameNoTooltip], ta cũng có một điều cần thú nhận..."
  friendship.2006.t:0 "Một Bí Mật Được Chia Sẻ"
  friendship.2006.desc:0 "Ta lo rằng ngay cả [friend_receiving_confession.GetTitledFirstName] cũng sẽ không hiểu khi ta chia sẻ bí mật của mình, nhưng [friend_receiving_confession.GetSheHe] lại hiểu rõ hơn ta có thể tưởng tượng.\n\n"I know all to well how you feel, [ROOT.GetCharacter.GetFirstName]. Exactly how, actually...""
  friendship.2006.a:0 "Ta không thể tin chúng ta có nhiều điểm chung đến vậy, [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('friend_receiving_confession'))] của ta."
 
  friendship.2007.t:0 "Một Lời Tốt Đẹp"
  friendship.2007.desc:0 "Ta tình cờ gặp [talking_target.GetTitledFirstName], và thật bất ngờ khi [talking_target.GetSheHe] dường như không có ấn tượng tốt về người  Bạn củata, [friend_interceded_for.GetTitledFirstName]!\n\nCó lẽ ta nên nhân cơ hội này để thay đổi suy nghĩ của [talking_target.GetHerHis]."
  friendship.2007.a:1 "Để ta kể cho ngươi nghe một câu chuyện về [friend_interceded_for.GetFirstNameNoTooltip]..."
  friendship.2007.b:0 "Mọi người nên nói về #EMP ta#! thì hơn."
  friendship.2007.utter_failure_tt:0 "Ta làm tổn hại nghiêm trọng danh tiếng của [friend_interceded_for.GetFirstNamePossessive]"
  friendship.2007.failure_tt:0 "Ta khiến mọi thứ còn tệ hơn cho [friend_interceded_for.GetFirstName]"
  friendship.2007.success_tt:0 "Ta cải thiện ý kiến của [talking_target.GetFirstNamePossessive] về [friend_interceded_for.GetFirstName]"
 
  friendship.2009.t:0 "Một Sự Xấu Hổ"
  friendship.2009.desc:0 "Ồ không. Ta không biết chuyện gì đã xảy ra, nhưng càng nói với [talking_target.GetTitledFirstName] về [friend_interceded_for.GetFirstName], vẻ mặt [talking_target.GetHerHis] càng có vẻ chua chát.\n\nNó đã làm mọi việc tồi tệ hơn cho [friend_interceded_for.GetFirstName] đến mức [friend_interceded_for.GetSheHe] đang tự hỏi liệu ta có thể đã nói gì với [talking_target.GetFirstNameNoTooltip]!"
  friendship.2009.a:0 "Ta rất xin lỗi, [friend_interceded_for.GetFirstNameNoTooltip]."
 
  friendship.2010.t:0 "Một Sự Xấu Hổ"
  friendship.2010.desc:0 "Trong lúc trò chuyện với [talking_target.GetHerHim], người  Bạn củata, [friend_doing_interceding.GetTitledFirstName], phát hiện rằng [talking_target.GetTitledFirstName] và ta có một mối quan hệ... khá căng thẳng.\n\nTuy nhiên khi cố thuyết phục [talking_target.GetFirstName] về những đức tính của ta, [friend_doing_interceding.GetSheHe] dường như đã khiến mọi thứ tệ hơn nhiều!"
  friendship.2010.a:0 "Ôi không. [friend_doing_interceding.GetFirstNameNoTooltip]!"
 
  friendship.2012.t:0 "Nhiều Công Sức, Ít Kết Quả"
  friendship.2012.desc:0 "Ta đã cố gắng miêu tả [friend_interceded_for.GetTitledFirstName] theo cách tốt nhất có thể, nhưng [talking_target.GetTitledFirstName] chỉ quay đi mỗi khi ta nhắc đến tên [friend_interceded_for.GetHerHis].\n\nTa nghi rằng [talking_target.GetSheHe] không hề ấn tượng."
  friendship.2012.a:0 "Nhưng [friend_interceded_for.GetFirstNameNoTooltip] thật tuyệt vời mà!"
 
  friendship.2013.t:0 "Xem Xét Lại Mối Quan Hệ"
  friendship.2013.desc:0 "Trong một buổi tối cùng [friend_doing_interceding.GetTitledFirstName], [friend_doing_interceding.GetSheHe] đã kể nhiều câu chuyện về [friend_interceded_for.GetTitledFirstName]. Sau khi nghe về những việc làm của [friend_interceded_for.GetHerHis] suốt nhiều giờ, ta phải thừa nhận rằng có lẽ ta đã đánh giá [friend_interceded_for.GetHerHim] không công bằng."
  friendship.2013.a:0 "[friend_interceded_for.GetFirstNameNoTooltip] có lẽ không tệ như ta nghĩ."
 
  friendship.2014.t:0 "Những Lời Khen Ngợi"
  friendship.2014.desc:0 "Trong lúc trò chuyện với [talking_target.GetHerHim], người  Bạn củata, [friend_doing_interceding.GetTitledFirstName], phát hiện rằng [talking_target.GetTitledFirstName] và ta có một mối quan hệ... khá căng thẳng.\n\nTuy nhiên [friend_doing_interceding.GetFirstName] không để chuyện đó tiếp diễn và bằng cách nào đó đã thuyết phục [talking_target.GetFirstName] rằng ta không tệ như [talking_target.GetSheHe] nghĩ!"
  friendship.2014.a:0 "Ta mang ơn người  Bạn củamình rất nhiều!"
  friendship.2015.t:0 "Thay Đổi Niềm Tin"
  friendship.2015.desc:0 "Ta đã cố gắng vẽ [friend_interceded_for.GetTitledFirstName] dưới ánh sáng tốt nhất có thể, và [talking_target.GetTitledFirstName] dần dần bắt đầu lắng nghe với sự quan tâm ngày càng lớn.\n\nKhi [talking_target.GetSheHe] lầm bầm "Ta chưa bao giờ biết điều đó!" với chính mình [talking_target.GetHerselfHimself], ta biết rằng mình đã tạo được ấn tượng."
  friendship.2015.a:0 "Người  Bạn củata thật tuyệt vời, [friend_interceded_for.GetWomanMan]!"
  friendship.3001.t:0 "Những Người Bạn ta Chọn"
  friendship.3001.desc:1 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('spouse_benefitting') )] [spouse_benefitting.GetTitledFirstName] của ta bao quanh mình [spouse_benefitting.GetHerselfHimself] với những người tốt.\n\n[friend_being_approved.GetTitledFirstName] là một ví dụ về gu thẩm mỹ tuyệt vời [spouse_benefitting.GetWifeHusband] của ta đối với bạn bè."
  friendship.3001.a:0 "Cuộc sống ta thật may mắn khi có nhiều người tốt."
  friendship.3002.t:0 "Những Người Bạn ta Chọn"
  friendship.3002.desc:1 "Người [first_spouse.GetWifeHusband] của ta, [first_spouse.GetTitledFirstName], mỉm cười với ta khi [first_spouse.GetSheHe] nhận xét về những lựa chọn tốt của ta trong việc chọn những người xung quanh.\n\nChắc hẳn [first_spouse.GetSheHe|U] đang nhắc tới những người như Bạn ta, [friend_being_approved.GetTitledFirstName]."
  friendship.3002.a:0 "Cuộc sống ta thật may mắn khi có nhiều người tốt."
  friendship.3003.t:0 "Những Người Bạn ta Chọn"
  friendship.3003.desc:1 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('spouse_suffering') )] [spouse_suffering.GetTitledFirstName] của ta bao quanh mình [spouse_suffering.GetHerselfHimself] với những kẻ tồi tệ nhất định.\n\nNgười bạn đó [spouse_suffering.GetHersHis] của, [friend_being_disapproved.GetTitledFirstName] là một trong những kẻ tồi tệ nhất."
  friendship.3003.a:1 "Nếu [friend_being_disapproved.GetWomanMan] đó còn ghé thăm một lần nữa..."
  spouse_responds_tt:0 "[spouse_suffering.GetFirstName] có thể từ bỏ người  Bạn của[spouse_suffering.GetHerHis], hoặc không..."
  friendship.3004.t:0 "Những Người Bạn ta Chọn"
  friendship.3004.desc:1 "Sẽ dễ dàng hơn nhiều nếu những người trong đời ta có thể hòa hợp. Thật không may, [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('spouse'))] của ta, [spouse.GetTitledFirstName], đơn giản là không chịu được người Bạn Tốt của ta, [friend_being_disapproved.GetTitledFirstName]."
  friendship.3004.a:1 "Dù gì cũng không từ bỏ [friend_being_disapproved.GetHerHim]."
  friendship.3004.b:1 "[spouse.GetFirstNameNoTooltip] là ưu tiên hàng đầu."
  friendship.3005.t:0 "Lựa Chọn Bạn Bè"
  friendship.3005.desc:1 "Người Bạn Tốt — hay nên gọi là cựu Ngài — [spouse_suffering.GetTitledFirstName] thông báo rằng ta không còn được chào đón tại triều đình của [spouse_suffering.GetHerHis]!\n\nKhông có lý do được đưa ra, nhưng ta biết [spouse_suffering.GetHerHis] [spouse.GetWifeHusband], [spouse.GetTitledFirstName], đang để mắt tới ta..."
  friendship.3005.a:0 "Ngươi có thể làm vậy với ta sao, [spouse_suffering.GetFirstNameNoTooltip]?"
  friendship.3006.t:0 "Mối Quan Hệ Thuận Lợi"
  friendship.3006.desc:1 "Người Ngài và cố vấn tốt của ta, [friend_on_council.GetTitledFirstName], được [hooked_councillor.GetTitledFirstName] nợ một ân tình. [friend_on_council.GetSheHe|U] đã làm rõ với [hooked_councillor.GetFirstNameNoTooltip] rằng ân tình đó phải được trả lại dưới bất cứ hình thức nào mà ta yêu cầu."
  friendship.3006.a:0 "Cảm ơn ngươi,  Bạn củata!"
  friendship.3006.b:0 "Ta tin ngươi sẽ sử dụng ân tình này tốt hơn ta, [friend_on_council.GetFirstNameNoTooltip]."
  friendship.3007.t:0 "Niềm An Ủi Từ Người Ngài"
  friendship.3007.opening:1 "Hiếm có điều gì ta thích hơn là có [friend.GetTitledFirstNamePossessive] ở bên."
  friendship.3007.fallback:1 "\n\n[friend.GetSheHe|U] dường như biết chính xác phải làm gì để xoa dịu tâm trí ta. Điều đó giúp ta rất nhiều khi [friend.GetSheHe] mời ta đi cùng hôm nọ."
  friendship.3007.malicious:0 "\n\nChúng ta đã trải qua một buổi tối quấy rối Bạn Bè, chọc ghẹo từng lỗi nhỏ và phàn nàn về từng chi tiết. Ai ngờ rằng những trò trêu chọc nhỏ lại thực sự giúp xoa dịu tâm trí đầy lo lắng!"
  friendship.3007.benevolent:1 "\n\nChúng ta đi dạo quanh thị trấn, phát tiền cho người nghèo và tha thứ cho một tên móc túi liều lĩnh. Một vài hành động từ thiện và tha thứ thật sự giúp giảm căng thẳng."
  friendship.3007.dominant:1 "\n\n[friend.GetSheHe|U] kéo ta đi từ hoạt động này sang hoạt động khác, nhịp độ nhanh thực sự giúp ta quên đi những lo lắng."
  friendship.3007.submissive:1 "\n\nCó [friend.GetHerHis|U] đồng hành trên chuyến đi qua nông thôn thực sự giúp ta thư giãn, mặc dù chính ta là người phải chủ động trong các hoạt động."
  friendship.3007.extroverted:0 "\n\nMột đêm náo nhiệt ở thị trấn với nhiều người mới thực sự giúp ta quên đi những phiền muộn!"
  friendship.3007.introverted:0 "\n\nThật nhẹ nhõm khi có một buổi tối yên tĩnh ở nhà cùng nhau, uống rượu và trò chuyện về những vấn đề của mình."
  friendship.3007.emotional:2 "\n\n[friend.GetSheHe|U] khuyến khích ta ném đĩa và la hét vào gối, và sau cơn bão cảm xúc, ta thực sự cảm thấy tốt hơn."
  friendship.3007.levelheaded:0 "\n\n[friend.GetSheHe|U] lắng nghe tất cả phiền muộn của ta một cách lặng lẽ, giúp ta nhìn nhận lại, và sau một thời gian ta nhận ra rằng mọi chuyện không tệ như tưởng tượng."
  friendship.3007.end_chill:1 "\n\nSau khoảng nghỉ ngắn này, ta lại sẵn sàng đảm nhiệm nhiệm vụ. Ta thật may mắn khi có một người Ngài như [friend.GetTitledFirstName]!"
  friendship.3007.end_severe:1 "\n\nSau khoảng nghỉ ngắn này, ta cảm thấy nhẹ nhõm hơn rất lâu! Ta thật may mắn khi có một người Ngài như [friend.GetTitledFirstName]."
  friendship.3007.a:0 "Một khoảng nghỉ nhỏ thật dễ chịu."
  friendship.3007.b:2 "Dành thời gian với [friend.GetFirstNameNoTooltip] luôn tốt cho ta."
  friendship.3007.c:1 "Ta chưa nhận ra mình cần điều này đến thế."
  friendship.3007.d:0 "Ta hoàn toàn quên đi những phiền muộn của thế giới trong một thời gian."
