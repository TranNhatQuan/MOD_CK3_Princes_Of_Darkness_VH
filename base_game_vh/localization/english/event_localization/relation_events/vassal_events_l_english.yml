l_english:
  vassal.1001.t:0 "Theo Ý Chúa [ROOT.Char.GetFaith.HighGodName|U]"
  vassal.1001.desc:0 "Người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_liege'))] của Ta, [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('religious_liege'))] [religious_liege.GetTitledFirstName], đang đi qua các lãnh địa của Ta. Khi [religious_liege.GetSheHe] quan sát các tòa nhà, [religious_liege.GetSheHe] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('religious_liege'))] và nhăn mặt.\n\n\"Ngươi biết thiếu gì ở cảnh này không? Một [religious_liege.GetFaith.HouseOfWorship] – một đền thờ lộng lẫy để tôn vinh [religious_liege.GetFaith.HighGodName]!\""
  vassal.1001.a:0 "Ta hứa sẽ xây một [ROOT.Char.GetFaith.HouseOfWorship]!"
  vassal.1001.a.tt:0 "#F [religious_liege.GetFirstNameNoTooltip] sẽ ghi nhớ lời hứa này, và nợ ta một [favor|E] nếu được hoàn thành trong mười năm#!"
  vassal.1001.b_zealous:0 "Ngươi là ai mà dám nói thay [ROOT.Char.GetFaith.HighGodName]?!"
  vassal.1001.b:0 "Không cần việc đó đâu."

  vassal.1010.desc:0 "\"Ngươi lần này thật xuất sắc, [ROOT.Char.GetFirstNameNoTooltip]. Thật sự là một công trình tuyệt vời.\" Người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_liege'))] của Ta, [religious_liege.GetTitledFirstName], [religious_liege.Custom('quirk_pos_present')], và chỉ tay về phía [religious_liege.GetFaith.HouseOfWorship] mới xây dựng.\n\n\"Ta chắc rằng [religious_liege.GetFaith.HighGodName] cũng ấn tượng như ta!\""
  vassal.1010.a:0 "Ta sống để phụng sự [religious_liege.GetFaith.HighGodName]."

  vassal.1020.desc_religious:0 "\"Một [ROOT.Char.GetWomanMan] sùng đạo như ngươi mà lại hứa suông… Về việc xây dựng một [religious_liege.GetFaith.HouseOfWorship] để tôn vinh [religious_liege.GetFaith.HighGodName] nữa chứ!\""
  vassal.1020.desc_not_as_religious:0 "\"Ngươi đã nói dối ta, [ROOT.Char.GetFirstNameNoTooltip]… Về việc xây một [religious_liege.GetFaith.HouseOfWorship] cho [religious_liege.GetFaith.HighGodName] nữa chứ!\""
  vassal.1020.desc:0 "\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_liege'))] của ta, [religious_liege.GetTitledFirstName], không hề giấu giếm sự không hài lòng [religious_liege.GetHerHis] của mình khi [religious_liege.GetSheHe] [religious_liege.Custom('quirk_neg_present')]."
  vassal.1020.a:0 "Lỗi lầm là điều con người không tránh khỏi!"
  vassal.1020.a_religious:0 "Hy vọng [religious_liege.GetFaith.HighGodName] sẽ tha thứ cho ta…"
  vassal.1020.a.tt:0 "#F Lẽ ra ta nên giữ lời hứa và xây [THIS.Char.GetFaith.HouseOfWorship]…#!"

  vassal.1101.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ta nhận thấy lãnh địa của ngươi còn chỗ cho một [religious_vassal.GetFaith.HouseOfWorship].\"\n\nNgười [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_vassal'))] của Ta, [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('religious_vassal'))] [religious_vassal.GetTitledFirstName], [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('religious_vassal'))] trước khi tiếp tục, \"Nếu ngươi xây, chắc chắn sẽ có lòng biết ơn từ [religious_vassal.GetFaith.HighGodNameAlternatePossessive], cũng như từ ta.\""
  vassal.1101.a.tt:0 "#F [religious_vassal.GetFirstNameNoTooltip] sẽ ghi nhớ lời hứa này, và nợ ta một [favor|E] nếu được hoàn thành trong mười năm#!"

  vassal.1110.desc:0 "\"Ngươi lần này thật xuất sắc, [ROOT.Char.Custom('FormOfAddressForLiege')]. Thật sự là một công trình tuyệt vời.\" Người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_vassal'))], [religious_vassal.GetTitledFirstName], [religious_vassal.Custom('quirk_pos_present')] và chỉ tay về phía [religious_vassal.GetFaith.HouseOfWorship] mới xây dựng.\n\n\"Ta chắc rằng [religious_vassal.GetFaith.HighGodName] cũng ấn tượng như ta!\""
  vassal.1110.a:0 "Ta sống để phục vụ [religious_vassal.GetFaith.HighGodName]."

  vassal.1120.desc_religious:0 "\"Một [ROOT.Char.GetWomanMan] sùng đạo như ngươi mà lại hứa suông… Về việc xây dựng một [religious_vassal.GetFaith.HouseOfWorship] cho [religious_vassal.GetFaith.HighGodName] nữa chứ!\""
  vassal.1120.desc_not_as_religious:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ngươi đã nói dối ta… Về việc xây một [religious_vassal.GetFaith.HouseOfWorship] cho [religious_vassal.GetFaith.HighGodName] nữa chứ!\""
  vassal.1120.desc:0 "Người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_vassal'))] của Ta, [religious_vassal.GetTitledFirstName], [religious_vassal.Custom('quirk_neg_present')] và lắc đầu.\n\n\"Xin [religious_vassal.GetFaith.HighGodNameAlternate|U] tha thứ cho ngươi.\""
  vassal.1120.a:0 "Lỗi lầm là điều con người không tránh khỏi!"
  vassal.1120.a.tt:0 "#F Lẽ ra ta nên giữ lời hứa và xây [THIS.Char.GetFaith.HouseOfWorship]…#!"

  vassal.2001.t:0 "Dạy Dỗ Thiếu Nhi"
  vassal.2001.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ta nghĩ rằng trẻ [child_to_educate.GetFirstName] sẽ học hỏi nhiều nếu [child_to_educate.GetSheHe] có cơ hội học dưới sự dẫn dắt của ngươi.\"\n\n[vassal_proposing_education.GetTitledFirstNamePossessive] [vassal_proposing_education.Custom2('RelationToMe', SCOPE.sC('child_to_educate'))] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('child_to_educate'))], trước khi vẫy tay ra hiệu."
  vassal.2001.a:0 "Được, ta sẽ dạy dỗ [child_to_educate.Custom('GirlBoy')]."
  vassal.2001.b:0 "Trách nhiệm của con [child_to_educate.Custom('GetDaughterSon')] là của ngươi!"

  vassal.2101.t:0 "Người Yêu Thích Yến Tiệc"
  vassal.2101.desc:1 "\"Đã nhiều tháng trôi qua kể từ khi các Chúa và Quý Bà trong vương quốc tụ họp ăn tiệc, [ROOT.Char.GetTitleTierName] của ta.\"\n\n[party_vassal.GetTitledFirstName] [ROOT.Char.Custom2('QuirkAdverbPosOrNeg', party_vassal)] tiếp tục, \"Sẽ rất có lợi cho ngươi – chưa kể những ai yêu thích yến tiệc – nếu điều này được khắc phục sớm!\""
  vassal.2101.a:0 "Ta hứa sẽ tổ chức yến tiệc sớm!"
  vassal.2101.a_hyped:0 "Đương nhiên, chúng ta nên ăn mừng! Ta không hiểu sao lại chờ lâu đến vậy."
  vassal.2101.a.tt:0 "#F [party_vassal.GetFirstNameNoTooltip] sẽ ghi nhớ lời hứa của ta, và biết ơn nếu được thực hiện trong mười năm#!"
  vassal.2101.b:0 "Ta sẽ tổ chức khi cảm thấy muốn."
  vassal.2101.b_arrogant:0 "Ngươi là ai chứ?!"
  vassal.2101.b_greedy:0 "Ngươi có biết tốn bao nhiêu không?!"
  vassal.2101.b_lazy:0 "Chắc ta sẽ làm thôi…"
  vassal.2101.b_shy:0 "Một yến tiệc? Với mọi người? Ta không nghĩ vậy…"

  vassal.2110.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Lần này ngài thực sự đã vượt xa mong đợi của chính mình!"\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('party_vassal'))] của ta, [party_vassal.GetTitledFirstName], dường như vẫn đang hồi phục sau bữa tiệc ta đã hứa với [party_vassal.GetHerHim], nhưng dù sao [party_vassal.GetSheHe] vẫn đang có tâm trạng rất tốt."
  vassal.2110.a:0 "Chắc chắn đó là một bữa tiệc đáng nhớ!"

  vassal.2120.desc_party:0 "\"Một [ROOT.Char.GetWomanMan] tận hưởng vui vẻ như ngươi mà lại hứa suông… Ta thật sự thất vọng.\""
  vassal.2120.desc_regular:0 "\"Một [party_vassal.Custom2('DescriptorPositive', ROOT.Char)] [ROOT.Char.GetWomanMan] như ngươi mà lại hứa suông… Ta thật sự thất vọng.\""
  vassal.2120.desc:0 "\n\nNgười [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('party_vassal'))], [party_vassal.GetTitledFirstName], [party_vassal.Custom('quirk_neg_present')] và lắc đầu."
  vassal.2120.a:0 "Ta hẳn đã quên mất!"

  vassal.2201.t:0 "Hỗ Trợ Tài Chính"
  vassal.2201.desc:0 ""[ROOT.Char.GetTitleTierName] của ta, thần không thể không nhận thấy rằng ngài có thể hưởng lợi từ một số khoản viện trợ tiền bạc."\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_loan_holder'))] của ta, [vassal_loan_holder.GetTitledFirstName], [vassal_loan_holder.Custom('quirk_pos_present')] khi [vassal_loan_holder.GetSheHe] đề xuất một thỏa thuận: một khoản vay để giảm bớt gánh nặng cho ngân khố của ta."
  vassal.2201.a:0 "Sự giúp đỡ của ngươi được ghi nhận, [vassal_loan_holder.GetFirstNameNoTooltip]."
  vassal.2201.a.money_loan_tooltip:0 "Ta sẽ vay [gold_i] #bold [THIS.Var('amount_to_loan_root').GetValue]#! Vàng từ [vassal_loan_holder.GetFirstNameNoTooltip]."
  vassal.2201.a.repay_loan:0 "Ta sẽ cần dùng quyết định #bold Repay Loan#! để trả nợ."
  vassal.2201.b:0 "Ta không #EMP đến mức đó#! tuyệt vọng!"

  vassal.2205.desc_inherited:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], [vassal_loan_holder.Custom2('RelationToMe', SCOPE.sC('original_lender'))] quá cố của thần đã từng cấp cho ngài một khoản vay."\n\n[vassal_loan_holder.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('vassal_loan_holder'))] trước khi tiếp tục. "Với tư cách là người kế thừa [vassal_loan_holder.GetHerHis], nay thần đến để yêu cầu khoản vay đó phải được hoàn trả.""
  vassal.2205.desc_inherited_loan:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], thần đã từng cho [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('original_loaner'))] quá cố của ngài vay một khoản vàng."\n\n[vassal_loan_holder.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('vassal_loan_holder'))] trước khi tiếp tục. "Với tư cách là người kế thừa [vassal_loan_holder.GetHerHis], nghĩa vụ hoàn trả khoản vay đó giờ đây thuộc về ngài.""
  vassal.2205.desc_all_new_char:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], [vassal_loan_holder.Custom2('RelationToMe', SCOPE.sC('original_lender'))] quá cố của thần đã từng cho [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('original_loaner'))] của ngài vay một khoản vàng."\n\n[vassal_loan_holder.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('vassal_loan_holder'))] trước khi tiếp tục. "Với tư cách là người kế thừa [vassal_loan_holder.GetHerHis], nghĩa vụ hoàn trả khoản vay đó giờ đây thuộc về ngài.""
  vassal.2205.desc_first_time:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], thần tin rằng khoản vay đó hữu ích chứ?"\n\n[vassal_loan_holder.GetTitledFirstName] đã đến đòi, yêu cầu hoàn trả số vàng mà [vassal_loan_holder.GetSheHe] đã cung cấp cho ta."
  vassal.2205.desc_second_time:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ta không thích trò này. Ngươi nợ ta, và ta tin lời hứa trả nợ không phải là dối trá.\"\n\n[vassal_loan_holder.GetTitledFirstName] [vassal_loan_holder.Custom('quirk_neg_present')] khi đứng trước ta lần thứ hai."
  vassal.2205.desc_three_times:0 ""Thần đã chán ngấy chuyện này rồi, [ROOT.Char.Custom('FormOfAddressForLiege')]! Đây là lần cuối cùng ta hỏi ngài một cách lịch sự; số tiền ngài nợ ta đâu?"\n\n[vassal_loan_holder.Custom('quirk_neg_pp')|U], [vassal_loan_holder.GetTitledFirstName] toát ra vẻ khó chịu, sự kiên nhẫn [vassal_loan_holder.GetHerHis] đã cạn kiệt."
  vassal.2205.desc_more_times:0 "\"Giá mà ta biết ngươi thật [ROOT.Char.Custom2('InsultAdjectiveArticle', SCOPE.sC('vassal_loan_holder'))], gian dối, [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('vassal_loan_holder'))] ta sẽ không giúp gì cho ngươi.\"\n\nTiền trong kho bạc chẳng an ủi được gì khi [vassal_loan_holder.GetTitledFirstNamePossessive] [vassal_loan_holder.Custom('quirk_neg_present')] bước đi."
  vassal.2205.z:0 "Đây! Lấy đi và biến đi!"
  vassal.2205.a:0 "Dĩ nhiên ngươi sẽ nhận được vàng!"
  vassal.2205.a.tt:0 "#F Ta nên trả lại [vassal_loan_holder.GetHerHim] càng sớm càng tốt!#!"
  vassal.2205.b:0 "Đừng làm phiền ta với những chuyện vặt vãnh."
  vassal.2205.c_greedy:0 "Ta đang tự lừa mình? Vàng thật sự an ủi!"
  vassal.2205.c:0 "Dù sao thì cũng là một khoản tiền lớn…"

  vassal.2301.t:0 "Người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('skilled_vassal'))|U] Tài Năng Của Ta"
  vassal.2301.desc_opening:1 "[skilled_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã chứng tỏ [skilled_vassal.GetHerselfHimself] rất có năng lực,"
  vassal.2301.desc_diplomacy:0 "đặc biệt trong các vấn đề ngoại giao."
  vassal.2301.desc_martial:0 "đặc biệt trong các vấn đề quân sự."
  vassal.2301.desc_stewardship:0 "đặc biệt trong các vấn đề quản lý."
  vassal.2301.desc_intrigue:0 "đặc biệt trong các vấn đề #EMP bí mật#!"
  vassal.2301.desc_learning:0 "đặc biệt trong các vấn đề học thuật."
  vassal.2301.desc_ending:1 "\n\n\"Có vài dự án ta muốn thực hiện tại [develop_county.GetName], bệ hạ. Tất nhiên, với sự cho phép của ngài.\""
  vassal.2301.a:2 "Hãy nắm quyền đi, [skilled_vassal.GetFirstNameNoTooltip]!"
  vassal.2301.b_diplomacy:0 "Không, #EMP ngươi#! nên để ta phụ trách ngoại giao."
  vassal.2301.b_martial:0 "Khéo léo quân sự? Hah! Ta sẽ tự #EMP xử lý#!."
  vassal.2301.b_stewardship:0 "Ta có thể tự giải quyết vấn đề hành chính này."
  vassal.2301.b_intrigue:0 "Ta nghĩ #EMP ta#! nên lo liệu các việc tế nhị này."
  vassal.2301.b_learning:0 "Ta đủ năng lực để xử lý vấn đề này."
  vassal.2301.c:0 "Thừa tướng không nên tự tiện như vậy."

  vassal.2401.t:0 "Niềm Hy Vọng Lấp Lánh"
  vassal.2401.desc_family:0 ""[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_needs_gold'))|U], ta cần một khoản tài chính.""
  vassal.2401.desc_other:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] – [ROOT.Char.GetTitleTierName] của ta – ta cần một khoản tài chính.""
  vassal.2401.desc:0 "\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_needs_gold'))] của ta, [vassal_needs_gold.GetTitledFirstName], nhìn ta [ROOT.Char.Custom2('QuirkAdverbPosOrNeg', SCOPE.sC('vassal_needs_gold'))] trước khi tiếp tục, \"Ta sẵn sàng nhượng bộ… Xin ngài, ta biết rằng ngài có khả năng giúp ta!\""
  vassal.2401.a:0 "Vàng cho [possible_county.GetNameNoTierNoTooltip] là hợp lý, đúng không?"
  vassal.2401.b:0 "Ngươi đã hưởng một hợp đồng #EMP rất#! lợi…"
  vassal.2401.c:0 "Ngươi không tự quản lý vàng của mình sao?!"

  vassal.2451.t:0 "Một Hợp Đồng Tốt Hơn"
  vassal.2451.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('negotiating_vassal'))] của ta, [negotiating_vassal.GetTitledFirstName], tiến đến với nụ cười [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', SCOPE.sC('negotiating_vassal'))].\n\n\"Ta sẽ rất biết ơn nếu chúng ta có thể… thương lượng lại hợp đồng của ta, [ROOT.Char.GetTitleTierName]. Mọi cải thiện chắc chắn sẽ được đón nhận nhiệt tình từ kho bạc hoặc lãnh địa của ta.\""
  vassal.2451.a:0 "Ta #EMP đã#! quan tâm đến [possible_county.GetNameNoTierNoTooltip]…"
  vassal.2451.b:0 "Kho bạc của ta chắc chắn cần được bổ sung."
  vassal.2451.c:0 "Ở đây ngươi sẽ không tìm thấy thỏa thuận nào, [negotiating_vassal.GetFirstNameNoTooltip]."

  vassal.2501.t:0 "Lời Cầu Hòa"
  vassal.2501.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], cuộc chiến này..." [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('peaceful_vassal'))] của ta là [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peaceful_vassal'))] [peaceful_vassal.GetTitledFirstName] thở dài trước khi tiếp tục, "Nó thật khó khăn cho quân lính — khó khăn cho tất cả chúng ta. Thần phải thừa nhận rằng thần có những nghi ngờ."\n\nCó lẽ ta nên làm điều gì đó để xoa dịu nỗi nghi ngờ đang lớn dần [peaceful_vassal.GetHerHis] của người này?"
  vassal.2501.a:0 "Giảm áp lực lên [peaceful_vassal.GetHerHim] có thể giúp được."
  vassal.2501.b:0 "Ta có cần nhắc ngươi ai là [ROOT.Char.GetTitleTierName] không?!"
  vassal.2501.c:0 "Ngươi phải học cách kiềm chế nghi ngờ của mình."

  vassal.2601.t:0 "Khao Khát Chiến Tranh"
  vassal.2601.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], ngài có lý do để tấn công [holder_of_claim.GetTitledFirstName], nhưng ngài vẫn giữ tay..." [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('warmongering_vassal'))] của ta là [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('warmongering_vassal'))] [warmongering_vassal.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('warmongering_vassal'))] trước khi tiếp tục, "Tại sao? Chúng ta đã hòa bình quá lâu rồi, ngài nên nắm lấy cơ hội này!""
  vassal.2601.a:0 "Ngươi đúng, [warmongering_vassal.GetFirstNameNoTooltip]!"
  vassal.2601.a.tt:0 "#F [warmongering_vassal.GetFirstName] sẽ ghi nhớ lời hứa ta đã đưa ra#!"
  vassal.2601.b:0 "Ta sẽ không bị ép phải hành động vội vàng."

  vassal.2610.desc:0 ""Ngươi đã làm đúng, [ROOT.Char.Custom('FormOfAddressForLiege')]. Chúng ta sẽ cho [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('recipient'))] [recipient.GetTitledFirstName] thấy năng lực của chúng ta! Ngươi sẽ chiếm [claim_to_fight_for.GetNameNoTier]!""
  vassal.2610.a:0 "Chúng ta sẽ chiến thắng trong chiến tranh này!"

  vassal.2620.desc: "[ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('warmongering_vassal'))] của ta là [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('warmongering_vassal'))] [warmongering_vassal.GetTitledFirstName] [warmongering_vassal.Custom('quirk_neg_present')].\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], [holder_of_claim.GetTitledFirstName] vẫn chưa thấy sự giận dữ của ngài, cũng như chưa thấy quân đội của ngài. Tại sao ngài hứa với thần một cuộc chiến mà ngài chưa bao giờ định bắt đầu?""
  vassal.2620.a:0 "Có quá nhiều chuyện khác đang xảy ra…"

  vassal.2701.t:0 "[ROOT.Char.Custom('CommanderTraitBeingTaughtNoTooltip')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('teacher'))|U]"
  vassal.2701.desc: "[ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('teacher'))] của ta là [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('teacher'))] [teacher.GetTitledFirstName] nổi tiếng với năng lực quân sự [teacher.GetHerHis] của người — đặc biệt là trong những lĩnh vực mà ta cảm thấy mình còn thiếu sót."
  vassal.2701.a:0 "Ngươi sẽ dạy ta chứ, [teacher.GetFirstNameNoTooltip]?"
  vassal.2701.a.tt:0 "Ta không nhận được đặc tính [THIS.Char.Custom('CommanderTraitBeingTaught')]"
  vassal.2701.a.random_list.success:0 "Buổi huấn luyện thành công"
  vassal.2701.a.random_list.failure:0 "Buổi huấn luyện thất bại"
  vassal.2701.c:0 "Ta còn việc quan trọng hơn!"

  vassal.2702.desc_success_inclination:0 ""Ấn tượng, [ROOT.Char.Custom('FormOfAddressForLiege')]!"\n\nTa vốn có khuynh hướng theo học [teacher.GetTitledFirstName], nhưng vẫn thấy rất hài lòng."
  vassal.2702.desc_success_no_inclination:0 ""Ấn tượng, [ROOT.Char.Custom('FormOfAddressForLiege')]!"\n\nDù không tự nhiên về quân sự, ta thấy mình tiếp thu giáo lý của [teacher.GetTitledFirstNamePossessive] với niềm khát khao và kỹ năng khiến chính ta cũng ngạc nhiên."
  vassal.2702.desc_failure:0 "Dù [teacher.GetTitledFirstNamePossessive] đã cố gắng hết sức, những gì [teacher.GetSheHe] dạy vẫn không hiểu được. Đây là việc thất bại từ đầu."
  vassal.2702.a:0 "Cuối cùng ta cũng hiểu vì sao mọi người lại ồn ào như vậy!"
  vassal.2702.b:0 "[teacher.GetSheHe] là thầy dạy kém, hay ta không phù hợp?"

  vassal.2801.t:0 "Những Yêu Cầu Của Chúa"
  vassal.2801.desc:0 ""[ROOT.Char.GetTitledFirstNameNoTooltip], ta nhận thấy rằng không có cải tiến nào ở [develop_county.GetNameNoTier] trong một thời gian dài, dù rõ ràng ngươi có khả năng thực hiện.""
  vassal.2801.a:0 "Ta sẽ lo liệu ngay!"
  vassal.2801.b:0 "Nếu ngươi giảm bớt các trách nhiệm khác của ta…"

  vassal.2901.t:0 "[claim_to_propose.GetNameNoTier|U]"
  vassal.2901.desc: ""[ROOT.Char.GetTitleTierName] của ta, hiện ngài đang sở hữu thứ gì đó — một nơi nào đó — lẽ ra phải là của thần."\n\n[ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('claim_vassal'))] của ta là [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('claim_vassal'))] [claim_vassal.GetTitledFirstName] đã đến trước mặt ta, khăng khăng yêu cầu ta ban cho ông ta [claim_to_propose.GetName]."
  vassal.2901.a:0 "Ta sẽ xem có thể làm gì."
  vassal.2901.a.tt:0 "#F [claim_vassal.GetFirstNameNoTooltip] sẽ ghi nhớ lời hứa của ta và biết ơn nếu được giữ đúng lời!#!"
  vassal.2901.b:0 "[claim_to_propose.GetNameNoTierNoTooltip] là của ta!"
  vassal.2901.z:0 "Ngươi nên nhận những gì ngươi yêu cầu."

  vassal.2910.desc: ""Cảm ơn ngài, [ROOT.Char.GetTitleTierName] của ta!"\n\n[ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('recipient'))] của ta là [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetTitledFirstName] rất vui mừng với tước hiệu mà ta đã ban cho [recipient.GetHerHim], và ta rất vui lòng với ân huệ mà người này mắc nợ."
  vassal.2910.a:0 "Mọi thứ đều có giá trị của nó!"

  vassal.2911.desc: "[ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('claim_vassal'))] của ta là [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('claim_vassal'))] đang rất giận dữ. [claim_vassal.GetSheHe|U] cuối cùng đã nhận ra rằng lời hứa ban cho [claim_to_propose.GetName] của ta chỉ là những lời nói suông."
  vassal.2911.a:0 "Ta không có nghĩa vụ đáp ứng yêu cầu vô lý đó."

  vassal.3001.t:0 "Rắc Rối Con Cái"
  vassal.3001.desc_child: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_to_ask'))] của ta là [vassal_to_ask.GetTitledFirstName] đang đứng đó, bao quanh bởi tình yêu thương và [vassal_to_ask.GetHerHis] [vassal_to_ask.Custom('ChildChildrenGender')], và ta được nhắc nhở về sự lạnh lẽo khắc nghiệt đang bao trùm lấy chính ngôi nhà của mình — một cảm giác có thể tan biến nếu có thêm một đứa con nữa."
  vassal.3001.desc_no_child: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_to_ask'))] của ta là [vassal_to_ask.GetTitledFirstName] đang đứng đó, bao quanh bởi tình yêu thương và [vassal_to_ask.GetHerHis] [vassal_to_ask.Custom('ChildChildrenGender')], và ta được nhắc nhở về những căn phòng trống rỗng và những hành lang yên tĩnh trong chính ngôi nhà của mình."
  vassal.3001.desc:0 "\n\nDĩ nhiên ta và [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] [spouse.GetFirstName] đã thử, nhưng chắc ta còn làm sai chỗ nào đó…"
  vassal.3001.a:0 "Có lẽ [vassal_to_ask.GetFirstNameNoTooltip] có thể cho ta vài lời khuyên!"
  vassal.3001.b:0 "Đây là việc riêng tư."

  vassal.3002.desc:1 ""[ROOT.Char.GetFirstNameNoTooltip], ngài đã được ban phước với nhiều [ROOT.Char.Custom('ChildChildrenGender')], còn thần lại không có được may mắn tương tự. Ngài có lời khuyên nào về cách... khắc phục điều đó không?"\n\nTa không thể tin được! [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('liege_with_trouble'))] của ta là [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('liege_with_trouble'))] [liege_with_trouble.GetTitledFirstName] đang hỏi ta về bí quyết trong phòng ngủ!"
  vassal.3002.a:1 "Nghe thử hạt tinh hoàn heo khô với rượu sao?"
  vassal.3002.a.critical_success:0 "Lời khuyên của ta mang lại kết quả tuyệt vời"
  vassal.3002.a.success:0 "Lời khuyên của ta có kết quả tốt"
  vassal.3002.a.failure:0 "Lời khuyên của ta gây hại nhiều hơn lợi"
  vassal.3002.b:0 "Ta không muốn dính dáng gì tới chuyện đó!"
  vassal.3002.c:1 "Ta nghĩ [spouse.GetTitledFirstNameNoTooltip] cần vài bài học."
  vassal.3002.c.tt_success:0 "[liege_with_trouble.GetTitledFirstNameNoTooltip] đồng ý"
  vassal.3002.c.tt_failure:0 "[liege_with_trouble.GetSheHe|U] cảm thấy bị xúc phạm"
  vassal.3002.d:0 "Ta nghĩ một vài buổi #EMP hướng dẫn riêng tư#! sẽ có ích cho ngươi."
  vassal.3002.d.tt_success:0 "[liege_with_trouble.GetSheHe|U] quan tâm đến bài học riêng"
  vassal.3002.d.tt_failure:0 "[liege_with_trouble.GetSheHe|U] cảm thấy bị xúc phạm"

  vassal.3003.desc_good_counsel:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_to_ask'))] của ta, [vassal_to_ask.GetTitledFirstName], đã đưa cho ta một loại thuốc để uống, nói rằng: \"Ngươi sẽ nhận thấy sự khác biệt ngay lập tức, [ROOT.Char.Custom('FormOfAddressForLiege')]!\"\n\nSự mơ hồ của [vassal_to_ask.GetHerHis|U] về thành phần khiến ta hơi lo lắng, nhưng ta đã cảm nhận được sinh lực chảy mạnh trong huyết quản mình!"
  vassal.3003.desc_bad_counsel:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_to_ask'))] của ta, [vassal_to_ask.GetTitledFirstName], đã đưa cho ta một loại thuốc để uống, nói rằng: \"Ngươi sẽ nhận thấy sự khác biệt ngay lập tức, [ROOT.Char.Custom('FormOfAddressForLiege')]!\"\n\nSự mơ hồ của [vassal_to_ask.GetHerHis|U] về thành phần khiến ta lo lắng, và khi ta cảm thấy nhựa sống của mình giảm sút, ta nguyền rủa lời khuyên tồi tệ của [vassal_to_ask.GetHerHis]!"
  vassal.3003.desc_making_a_move_on_spouse:0 "\"Gửi [spouse.GetWifeHusband] đến với ta và ta sẽ chỉ cho [spouse.GetHerHim] cách làm ngươi hài lòng hơn, [ROOT.Char.Custom('FormOfAddressForLiege')]!\""
  vassal.3003.desc_making_a_move:0 "\"Nhưng, [ROOT.Char.Custom('FormOfAddressForLiege')], việc đưa lời khuyên thật khó khăn. Sẽ dễ dàng hơn nhiều nếu ta chỉ cho ngươi thấy…\""
  vassal.3003.desc_refusal:0 "Thật táo bạo làm sao, [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('vassal_to_ask'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_to_ask'))]! Ngay cả khi ta tiếp cận [vassal_to_ask.GetTitledFirstName] với câu hỏi tế nhị, [vassal_to_ask.GetSheHe] vẫn từ chối ta."
  vassal.3003.a:0 "[spouse.GetTitledFirstNameNoTooltip]! Gặp ta tại phòng riêng!"
  vassal.3003.b:0 "Liệu ta có bị nguyền sống cảnh vô sinh không?"
  vassal.3003.spouse:0 "Ta sẽ gửi [spouse.GetHerHim] ngay lập tức!"
  vassal.3003.spouse.tt:0 "Tăng khả năng sinh sản"
  vassal.3003.c:0 "Đúng, một vài buổi hướng dẫn riêng có thể giúp được."
  vassal.3003.d:0 "Thật táo bạo!"

  vassal.3004.desc_spouse:0 "Hiệu quả của buổi học riêng với [spouse.GetTitledFirstName] có thể bị nghi ngờ, nhưng [spouse.GetSheHe] chắc chắn không phàn nàn.\n\nNếu [spouse.GetHerHis] [spouse.Custom2('RelationToMe', SCOPE.sC('liege_with_trouble'))] may mắn, [spouse.GetSheHe] đã học được vài điều…!"
  vassal.3004.desc_refused:0 "[liege_with_trouble.GetTitledFirstName] từ chối ta!\n\nTa chỉ hy vọng rằng [liege_with_trouble.GetHerHis] [liege_with_trouble.Custom2('RelationToMe', SCOPE.sC('spouse'))] sẽ gặp may hơn trong phòng riêng…!"
  vassal.3004.desc:0 "Hiệu quả của buổi học riêng với [liege_with_trouble.GetTitledFirstName] có thể bị nghi ngờ, nhưng [liege_with_trouble.GetSheHe] chắc chắn không phàn nàn.\n\nNếu [liege_with_trouble.GetHerHis] [liege_with_trouble.Custom2('RelationToMe', SCOPE.sC('spouse'))] may mắn, [liege_with_trouble.GetSheHe] đã học được vài điều…!"
  vassal.3004.a:0 "Chính [liege_with_trouble.GetSheHe] là người bỏ lỡ cơ hội!"
  vassal.3004.b:0 "Chia sẻ kỹ năng của ta là điều ít nhất ta có thể làm!"
  vassal.3004.c:0 "[spouse.GetFirstNameNoTooltip] là học trò xuất sắc!"

  vassal.5010.opening:0 "[vassal.Custom2('AppropriateGreeting', ROOT.Char)]"
  vassal.5010.desc:0 "Có lẽ không phải việc của ta để chất vấn chiến lược của ngươi, nhưng ta thắc mắc tại sao ngươi để kẻ thù của đức tin chúng ta tự do làm điều xấu mà không can thiệp. Chúng ta có cả phương tiện lẫn quyền lực để thực thi công lý của [ROOT.Char.GetFaith.HighGodNamePossessive] với họ, vậy chắc chắn chúng ta phải làm điều đó!"
  vassal.5010.a:0 "Trong vòng sáu tháng, chúng ta sẽ tiến đánh họ!"
  vassal.5010.a.tt:0 "#F Ta thề sẽ tuyên chiến với kẻ ngoại đạo.#!"
  vassal.5010.b:0 "Khi thời điểm thích hợp…"
  vassal.5010.b.tt:0 "#F Ta đã hứa mọi thứ nhưng lại chẳng làm gì.#!"
  vassal.5010.c:0 "Đừng nói cho [ROOT.Char.GetTitleTierName] biết [ROOT.Char.GetSheHe] phải làm gì!"

  vassal.5020.t:0 "Lời Thề Đạo Đức Bị Phá"
  vassal.5020.desc:0 "Đã sáu tháng trôi qua kể từ khi ta thề sẽ sai quân chống lại kẻ thù của đức tin. [vassal.GetTitledFirstName] sẽ không vui với việc ta không thực hiện lời hứa."
  vassal.5020.a:0 "Có lẽ ta đã nói vội vàng."
  vassal.5020.b:0 "Lời nói chỉ là gió thoảng."
 
  vassal.5050.desc:1 "Ta muốn thỉnh cầu ngươi, trong sự khôn ngoan của ngươi, hãy xem xét yêu sách của ta về [claim.GetName]. Không đúng khi [claimed_title_holder.GetTitledFirstName] ngồi an toàn như kẻ chiếm đoạt trong lâu đài [vassal.GetHerHis], chế giễu quyền thừa kế của dòng họ ta. Xin ngươi, [ROOT.Char.Custom('FormOfAddressForLiege')], hãy ủng hộ chư hầu trung thành của ngươi bằng cách xuất quân nếu họ không tự nguyện công nhận yêu sách của ta!"
  vassal.5050.a:0 "Trong năm nay, ta sẽ hành động thay mặt ngươi!"
  vassal.5050.a.tt:0 "#F Ta thề sẽ thúc đẩy yêu sách của [vassal.GetTitledFirstNamePossessive].#!"
  vassal.5050.b:0 "Khi thời điểm thích hợp…"
  vassal.5050.b.tt:0 "#F Ta sẽ chỉ hành động nếu thấy lợi ích.#!"
  vassal.5050.c:0 "Ta còn nhiều việc quan trọng khác."

  vassal.5060.t:0 "Một Lời Hứa Bị Phá"
  vassal.5060.desc:0 "Đã một năm trôi qua kể từ khi ta cam kết với [vassal.GetTitledFirstName] về việc gây chiến giành lấy yêu sách của người này đối với [claim.GetName]. [vassal.GetTitledFirstName] sẽ không vui về sự thiếu hành động của ta thay mặt cho người này."
  vassal.5060.a:0 "Có lẽ ta không nên hứa điều đó."
  vassal.5060.b:0 "Nhưng thời điểm đơn giản là chưa thích hợp, ngươi thấy sao?"
