l_english:
 coming_of_age.0001.t:0 "Trưởng Thành"
 coming_of_age.0001.educator_university:0 "Với sự trợ giúp của [educator.GetTitledFirstName] và Đại học"
 coming_of_age.0001.educator_confucian_education: "Với sự trợ giúp của những giáo huấn Nho gia từ [educator.GetTitledFirstName]"
 coming_of_age.0001.educator:0 "Với sự trợ giúp của [educator.GetTitledFirstName]"
 coming_of_age.0001.desc1:0 "Ta đã hoàn thành việc học trong lĩnh vực [ROOT.Char.Custom('education_focus_child')]."
 coming_of_age.0001.desc1_good_trait:0 "Dù mọi người đặt nhiều kỳ vọng vào ta, ta lại không đạt được bao nhiêu và kết quả thật đáng thất vọng."
 coming_of_age.0001.desc1_bad_trait:0 "Ngay cả khi kết quả của ta khá tệ thì cũng chẳng ai ngạc nhiên. Ít nhất thì sự cực nhọc cuối cùng cũng đã kết thúc!"
 coming_of_age.0001.desc1_fallback_trait:0 "Dù ta không đạt được nhiều, thật nhẹ nhõm khi cuối cùng cũng thấy có kết quả."
 coming_of_age.0001.desc2:0 "Cuối cùng ta cũng hoàn tất việc học trong lĩnh vực [ROOT.Char.Custom('education_focus_child')]!"
 coming_of_age.0001.desc2_good_trait:0 "Ta thất vọng với kết quả của mình, vì thật sự ta nghĩ mình có thể làm tốt hơn."
 coming_of_age.0001.desc2_bad_trait:0 "Ta làm khá ổn, ít nhất là xét đến việc môn này vốn không phải sở trường của ta."
 coming_of_age.0001.desc2_fallback_trait:0 "Thành tựu của ta không lớn, nhưng cũng có thể đã tệ hơn."

 coming_of_age.0001.desc3:0 "Ta đã hoàn thành việc học về [ROOT.Char.Custom('education_focus_child')]!"
 coming_of_age.0001.desc3_good_trait:0 "Dù những khía cạnh cao siêu nhất của môn học vẫn vượt ngoài tầm với, ta vẫn đáp ứng được kỳ vọng của mọi người và học được nhiều hơn phần lớn!"
 coming_of_age.0001.desc3_bad_trait:0 "Dù những khía cạnh cao siêu nhất của môn học vẫn vượt ngoài tầm với, ta đã phá vỡ mọi kỳ vọng thấp của người khác và học được nhiều hơn phần lớn!"
 coming_of_age.0001.desc3_fallback_trait:0 "Dù những khía cạnh cao siêu nhất của môn học vẫn vượt ngoài tầm với, ta cũng đã làm khá tốt."

 coming_of_age.0001.desc4:0 "Ta đã đạt được sự hiểu biết về [ROOT.Char.Custom('education_focus_child')] vượt xa bất kỳ ai trong số bạn đồng lứa."
 coming_of_age.0001.desc4_good_trait:0 "Dù ta vốn có thiên hướng tự nhiên với lĩnh vực này, việc làm chủ nó vẫn là một thành tựu!"
 coming_of_age.0001.desc4_bad_trait:0 "Ta đã làm trái mọi kỳ vọng và đạt được điều từng bị cho là không thể đối với ta; sự tinh thông trong [ROOT.Char.Custom('education_focus_child')]!"
 coming_of_age.0001.desc4_fallback_trait:0 "Đạt đến mức này trong lĩnh vực ấy thật sự khiến ta mãn nguyện."

 coming_of_age.0001.patronaged_spouse_plus_1.desc:0 "[patronage_spouse_tutor.GetTitledFirstName] đã giám sát việc học của ta và đóng góp rất lớn vào kiến thức của ta về [ROOT.Char.Custom('education_focus_child')]."
 coming_of_age.0001.patronaged_spouse_plus_2_or_more.desc:0 "[patronage_spouse_tutor.GetTitledFirstName] đã giám sát việc học của ta và giúp ta đạt đến trình độ kiến thức mà trước đây ta chưa từng mơ tới."


 coming_of_age.0001.relationships:0 "\n\nKhi ta bước những bước đầu tiên vào tuổi trưởng thành, ta thấy mình đang hồi tưởng về một số người đã tạo ra tác động đến [ROOT.Char.GetWomanMan] mà ta đã trở thành..."
 coming_of_age.0001.friend:0 "\nTình bạn ta từng chia sẻ với [friend.GetFirstName] có ý nghĩa rất lớn khi chúng ta còn nhỏ, và việc [friend.GetHerHim] vẫn ở bên cạnh ta đến giờ vẫn rất đáng quý."
 coming_of_age.0001.crush:0 "\nTa đã có những kỷ niệm đáng nhớ với [crush.GetFirstName], [crush.GetSheHe] thực sự giúp ta hiểu bản thân mình và cả tình yêu."
 coming_of_age.0001.bully1:0 "\nNhững điều [bully.GetTitledFirstName] đã khiến ta chịu đựng khi còn nhỏ vẫn đè nặng trong lòng ta, và mỗi khi nhìn thấy [bully.GetHerHim] tâm trạng ta liền trở nên tồi tệ."
 coming_of_age.0001.bully2:0 "\nNhững điều [bully.GetTitledFirstName] đã khiến ta chịu đựng khi còn nhỏ vẫn đè nặng trong lòng ta. Đôi khi ta vẫn còn nghe thấy tiếng cười của [bully.GetHerHis] khi [bully.GetSheHe] giẫm nát [ROOT.Char.Custom('child_favorite_toy')] của ta."
 coming_of_age.0001.victim1:1 "\nTa tự hỏi liệu [victim.GetTitledFirstName] có còn nhớ những gì ta đã khiến [victim.GetHerHim] phải chịu đựng khi chúng ta còn nhỏ không."
 coming_of_age.0001.victim2:0 "\nTa vẫn còn nhớ rõ gương mặt kinh hoàng của [victim.GetTitledFirstNamePossessive] khi ta phá hủy [victim.GetHerHis] [victim.Custom('child_favorite_toy')]."
 coming_of_age.0001.relationships_end:0 "\n\nTuy nhiên, giờ ta đã trưởng thành, ta cần bỏ lại những trò trẻ con này phía sau và tập trung vào những điều sắp tới."
 coming_of_age.0001.no_relationships:0 "\n\nNhìn lại thời thơ ấu của mình, ta nhận ra mình chưa từng thật sự gắn bó với ai... Ngay cả khi thấy người khác chơi với bạn bè hay thì thầm về tình yêu, ta cũng chưa từng trải qua những điều ấy.\n\nTa tin chắc những năm tháng tới sẽ mang lại những người bạn mới và những cơ hội mới!"

 coming_of_age.0001.a:0 "[ROOT.Char.GetTitledFirstNameNoTooltip], giờ ngươi đã là một [ROOT.Char.GetWomanMan]!"
 coming_of_age.0001.tt.1:1 "Ngươi vẫn còn nhiều điều phải học trong lĩnh vực [THIS.Char.Custom('education_focus_child')]!\n"
 coming_of_age.0001.tt.2:1 "Ngươi vẫn còn vài điều cần học trong lĩnh vực [THIS.Char.Custom('education_focus_child')]\n"
 coming_of_age.0001.tt.3:1 "Ngươi đã làm khá tốt trong lĩnh vực [THIS.Char.Custom('education_focus_child')]!\n"
 coming_of_age.0001.tt.4:1 "Ngươi đã làm rất tốt trong lĩnh vực [THIS.Char.Custom('education_focus_child')]!\n"
 coming_of_age.0001.tt.5:2 "Ngươi sẽ không quên tình cảm dành cho [crush.GetFirstNameNoTooltip]: #P +20 thiện cảm#!"
 coming_of_age.0001.tt.7:1 "Ngươi sẽ không sớm quên [victim.GetTitledFirstNameNoTooltip]: #N -5 thiện cảm#!"
 coming_of_age.0001.tt.9:1 "Ngươi sẽ không sớm quên [bully.GetTitledFirstNameNoTooltip]: #N -10 thiện cảm#!"

 coming_of_age.1001.t:0 "[educated_child.GetFirstNameNoTooltip] Trưởng Thành"
 coming_of_age.1001.desc_university:0 "Khi [educated_child.GetHerHis] trưởng thành, khoảng thời gian [educated_child.GetFirstName] học tại Đại học cũng kết thúc.\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.0001.desc_confucian_education: "Khi [educated_child.GetHerHis] trưởng thành, [educated_child.GetFirstName] đã sẵn sàng truyền bá những giáo huấn Nho gia.\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.1001.desc:0 "Khi [educated_child.GetHerHis] trưởng thành, việc dạy dỗ [educated_child.GetFirstName] của ta cũng kết thúc.\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.1001.patronaged_spouse_plus_1.desc:0 "\n\nNhững đóng góp của [patronage_spouse_tutor.GetTitledFirstNamePossessive] cho việc giáo dục của [educated_child.GetFirstNamePossessive] không thể không nhắc đến. Sự chỉ dẫn của [patronage_spouse_tutor.GetHerHis|U] đã giúp đứa trẻ tiến xa hơn những gì một mình ta có thể làm."
 coming_of_age.1001.patronaged_spouse_plus_2_or_more.desc:0 "\n\n[patronage_spouse_tutor.GetTitledFirstName] cũng đã mang lại cho đứa trẻ sự hướng dẫn vô giá. [educated_child.GetFirstName] sẽ không bao giờ đạt được đến mức này nếu không có [patronage_spouse_tutor.GetHerHim]."
 coming_of_age.1001.a:0 "Chúng lớn nhanh thật."

 coming_of_age.1002.t:0 "[educated_child.GetFirstNameNoTooltip] Trưởng Thành"
 coming_of_age.1002.desc:0 "Ta tự hào khi thấy [educated_child.Custom('GetDaughterSon')] của mình không còn là đứa trẻ nữa, mà đã trở thành người trưởng thành.\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.1002.patronaged_spouse_plus_1.desc:0 "\n\nNhững đóng góp [patronage_spouse_tutor.GetTitledFirstNamePossessive] đối với nền giáo dục [educated_child.GetFirstNamePossessive] của con không thể không nhắc đến. Những bài học [patronage_spouse_tutor.GetHerHis|U] của ngài đã mang lại cho [educated_child.GetFirstName] kiến thức quý giá cho cuộc sống tương lai [educated_child.GetHerHis] của con."
 coming_of_age.1002.patronaged_spouse_plus_2_or_more.desc:0 "\n\n[patronage_spouse_tutor.GetTitledFirstName] đã mang lại cho đứa trẻ sự hướng dẫn vô giá. [educated_child.GetFirstName] sẽ không bao giờ đạt được đến mức này nếu không có [patronage_spouse_tutor.GetHerHim]."
 
 coming_of_age.1003.t:0 "Kết Thúc Giáo Dục"
 coming_of_age.1003.standard:0 "Học trò của ta, [educated_child.GetTitledFirstName], đã trưởng thành, và đã đến lúc [educated_child.GetSheHe] rời khỏi sự chăm sóc của ta.\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.1003.rank_1:0 "\n\nTa chắc rằng cha mẹ của [educated_child.GetHerHis] chỉ cần biết việc học của [educated_child.GetHerHis] đã hoàn tất là đủ."
 coming_of_age.1003.rank_2:0 "\n\nDù kết quả không xuất sắc, ta tin rằng cha mẹ của [educated_child.GetHerHis] sẽ không phàn nàn."
 coming_of_age.1003.rank_3:0 "\n\nTa tin rằng cha mẹ của [educated_child.GetHerHis] sẽ hài lòng với sự dạy dỗ của ta."
 coming_of_age.1003.rank_4:0 "\n\nCha mẹ của [educated_child.GetHerHis|U] chắc chắn sẽ tự hào khi gọi [educated_child.GetHerHim] là [educated_child.Custom('GetDaughterSon')] của họ!"
 coming_of_age.1003.a:0 "Hẹn gặp lại, [educated_child.GetFirstNameNoTooltip]."

 coming_of_age.0003.desc_child_start:1 " Việc huấn luyện $knight_culture_player_adjective_no_tooltip_lowercase$ của ta song song với điều này đã "
 coming_of_age.0003.desc_child_1:0 "diễn ra tệ hại, và ta học được rất ít từ các huấn luyện viên chiến đấu."
 coming_of_age.0003.desc_child_2:0 "diễn ra tạm ổn, và ta đã đánh bại được vài tên nông dân ngạo mạn."
 coming_of_age.0003.desc_child_3:0 "diễn ra thành công, và dù còn trẻ ta đã tiêu diệt được nhiều tên cướp."
 coming_of_age.0003.desc_child_4:1 "diễn ra xuất sắc, khiến ta trở thành một trong những $knight_culture_player_plural_no_tooltip_lowercase$ hàng đầu của vương quốc."

 coming_of_age.1004.t:0 "Kết Thúc Giáo Dục"
 coming_of_age.1004.desc:0 "Học trò của ta, [educated_child.GetTitledFirstName], đã trưởng thành, và đã đến lúc [educated_child.GetSheHe] rời khỏi sự chăm sóc của ta.\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.1004.a:0 "Hẹn gặp lại, [educated_child.GetFirstNameNoTooltip]."

 coming_of_age.1005.t:0 "Kết Thúc Giáo Dục"
 coming_of_age.1005.desc:0 "Học trò của ta, [educated_child.GetTitledFirstName], đã trưởng thành, và đã đến lúc [educated_child.GetSheHe] rời khỏi sự chăm sóc của ta.\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')] [educated_child.Custom('DescribingEducationOutcomeProwess')]"
 coming_of_age.1005.a:0 "Hẹn gặp lại, [educated_child.GetFirstNameNoTooltip]."

 coming_of_age.3011.t: "Không Chỉ Là Danh Nghĩa"
 coming_of_age.3011.desc: "Kể từ khi ta được bổ nhiệm làm [senior_emp.GetDiarchTitle] bởi [junior_emp.MakeScope.Var('co_emp_appointer').Char.Custom2('MyCharacterIntroduction', junior_emp)], ta đã biết ngày này rồi sẽ đến.\n\nGiờ ta đã là một [junior_emp.GetWomanMan], và điều đó có nghĩa quyền lực ta nắm giữ không còn chỉ là danh nghĩa. Khi ta nói, [senior_emp.GetPrimaryTitle.GetDefinitiveName] lắng nghe, và khi ta ra lệnh, nó tuân theo.\n\nĐây là bước đầu tiên thực sự của ta trên con đường đến ngai vàng."
 coming_of_age.3011.a: "Đây là số phận của ta!"
 coming_of_age.3011.b: "Một #EMP cả đời#! đang chờ phía trước..."
 coming_of_age.3011.c: "Ta hy vọng mình đã sẵn sàng cho điều này."
 coming_of_age.3011.tt.fake_diarchy_transition: "[senior_emp.GetShortUINamePossessive|U] [power_sharing|E] đã chuyển thành một [duumvirate|E]"
 coming_of_age.3011.tt.various_new_powers: "[CharWereWas(junior_emp)|U] được trao quyền tiếp cận nhiều [diarch_powers|E] mới"
 coming_of_age.3011.tt.convert_sop_swing: "Giữ lại ['50%'|P] dao động của [scales_of_power|E] mà [CharYouSheHe(junior_emp)] đạt được trong thời thơ ấu"
 coming_of_age.3011.tt.not_enough_sop_swing_to_buffs: "Không có đủ dao động [scales_of_power|E] để nhận thêm điểm [skill|E]"

 coming_of_age.3012.t: "$coming_of_age.3011.t$"
 coming_of_age.3012.desc.intro: "Ngày đó cuối cùng đã đến: [junior_emp.Custom2('MyCharacterIntroduction', senior_emp)] thực sự là một [junior_emp.GetWomanMan], sẵn sàng đảm nhận vị trí [junior_emp.GetHerHis] của mình là người quyền lực thứ hai trong toàn [senior_emp.GetPrimaryTitle.GetDefinitiveName].\n\nTất nhiên là sau ta.\n\nMặc dù một [senior_emp.GetDiarchTitle] trẻ tuổi có rất ít tiếng nói đối với tình trạng của lãnh địa, nhưng một khi họ đã phát triển vào vai trò của mình, có rất ít điều mà họ #EMP không thể#! lên tiếng.\n\n"
 coming_of_age.3012.desc.senior_emp_appointed_junior_emp: "Ta chỉ có thể hy vọng rằng mình đã lựa chọn đúng "
 coming_of_age.3012.desc.junior_emp_appointed_elsewhere: "Ta chỉ có thể hy vọng [junior_emp.MakeScope.Var('co_emp_appointer').Char.GetFirstName] đã lựa chọn đúng"
 coming_of_age.3012.desc.outro: "khi đưa [junior_emp.GetHerHim] lên vị trí cao quý này."
 coming_of_age.3012.a: "Màu tím hoàng gia đòi hỏi rất nhiều từ chúng ta..."
