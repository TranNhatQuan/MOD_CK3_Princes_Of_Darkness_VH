l_english:
 childhood.7000.t:0 "Chơi khăm [stolen_clothes.GetFirstNameNoTooltip]"
 childhood.7000.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('stolen_clothes'))] của ta là [stolen_clothes.GetFirstName] trông có vẻ hơi... #EMP gò bó,#! ta phải nói vậy! [stolen_clothes.GetSheHe|U] quá nghiêm túc, ngày nào cũng xử lý công việc triều đình. Có lẽ ta nên #EMP làm nhẹ bầu không khí#! một chút?\n\n"
 childhood.7000.desc_child:0 "Ta biết [child_helper.GetFirstName] chắc chắn sẽ giúp ta thực hiện #EMP kế hoạch quỷ quyệt#! nếu ta gọi [child_helper.GetHerHim].\n\n"
 childhood.7000.desc_end:0 "Không biết [stolen_clothes.GetFirstNameNoTooltip] sẽ phản ứng thế nào nếu quần áo của [stolen_clothes.GetHerHis]... 'biến mất'? #EMP *khúc khích*#!"
 childhood.7000.a:0 "Ta sẽ lẻn vào phòng của [stolen_clothes.GetHerHis] và chộp lấy quần áo của [stolen_clothes.GetHerHis]!"
 childhood.7000.b:0 "[child_helper.GetFirstNameNoTooltip], đánh lạc hướng [stolen_clothes.GetHerHim]. #EMP Đi thôi!#!"
 childhood.7000.c:0 "Không, ta nên tử tế. Nghỉ ngơi chút đi, [stolen_clothes.GetFirstNameNoTooltip]."
 childhood.7000.d:0 "Hm, lúc này chưa thích hợp..."
 childhood.7000.a.success:0 "Ngươi trộm được quần áo"
 childhood.7000.a.failure:0 "[stolen_clothes.GetSheHe|U] bắt gặp ngươi tại chỗ"
 childhood.7001.desc_helper:0 "Thành công! [child_helper.GetFirstName] đã đánh lạc hướng [stolen_clothes.GetFirstName] bằng cách thả [ROOT.Char.Custom('GetLivestockFowlIndef')] vào phòng ngủ của [stolen_clothes.GetHerHis] từ sáng sớm – trong lúc đó ta cuỗm mọi bộ quần áo có thể tìm thấy!"
 childhood.7001.desc_nohelper:0 "Thành công! Ta đã lẻn vào phòng ngủ của [stolen_clothes.GetFirstNamePossessiveNoTooltip] và lấy hết quần áo của [stolen_clothes.GetHerHis] trước khi [stolen_clothes.GetSheHe] tỉnh dậy! "
 childhood.7001.desc_angry:0 "[stolen_clothes.GetFirstNameNoTooltip] đứng bật dậy trong cơn thịnh nộ và đuổi theo dọc hành lang mà chẳng mảnh vải che thân!\n\n\"Đồ nhóc con phiền phức! Trả quần áo cho ta ngay lập tức, nếu không ta sẽ bẻ cổ ngươi!\" [stolen_clothes.GetSheHe|U] thét lên, mũi phì phò giận dữ.\n\n[stolen_clothes.GetFirstNameNoTooltip] có thể không thích trò đùa tinh quái của ta, nhưng tất cả những người khác đều nghĩ nó thật #EMP buồn cười!#!"
 childhood.7001.desc_funny:0 "[stolen_clothes.GetFirstNameNoTooltip] nhanh chóng đứng dậy và đuổi theo dọc hành lang mà chẳng mảnh vải che thân!\n\n\"Nhóc con! Trả quần áo cho ta, ta không có thời gian cho việc này!\" [stolen_clothes.GetSheHe|U] hét lên, chạy tuốt vào đại sảnh trước khi dừng lại và nhận ra mình vừa làm gì!\n\nTất cả mọi người, kể cả [stolen_clothes.GetFirstNameNoTooltip], đều thấy tình huống này thật #EMP rất#! buồn cười, và cười đến mức đỏ cả mặt."
 childhood.7001.a:0 "Ta sẽ làm lại! Lại nữa! Và #EMP lại nữa!#!"
 childhood.7001.b:0 "Không có ngươi thì ta không làm được đâu, [child_helper.GetFirstNameNoTooltip]!"
 childhood.7001.c:0 "Một trò đùa hay có thể đi rất xa!"
 childhood.7002.desc_helper:0 "Ôi không! [child_helper.GetFirstName] định thả [ROOT.Char.Custom('GetLivestockFowlIndef')] vào phòng ngủ của [stolen_clothes.GetFirstNamePossessiveNoTooltip], nhưng nó phản bội chúng ta! Nó kêu inh ỏi khi chúng ta bước vào, và [stolen_clothes.GetFirstNameNoTooltip] bật dậy khỏi giường và nhìn thấy chúng ta.\n\n"
 childhood.7002.desc_nohelper:0 "Chết tiệt! Khi ta lẻn vào, mắt [stolen_clothes.GetFirstNamePossessive] mở to, và [stolen_clothes.GetSheHe] bật khỏi giường!\n\n"
 childhood.7002.desc_angry:0 "[stolen_clothes.GetSheHe|U] nhanh tay chộp lấy chiếc bô đầy của [stolen_clothes.GetHerHis], ném nó với độ chính xác đáng kinh ngạc. Với một tiếng #flatulence splash#! lớn, ta bị phủ đầy thứ mà ta chỉ có thể đoán là #EMP chất thải của nhiều đêm#!!\n\n"Thế mới dạy cho ngươi biết đừng làm phiền ta! Cút khỏi đây, nếu không còn nhiều thứ nữa đấy!" [stolen_clothes.GetSheHe|U] hét lên."
 childhood.7002.desc_funny:0 ""Nào, nghe đây!" [stolen_clothes.GetFirstNameNoTooltip] nói, nắm chặt tai ta. "Ngươi không thể đi khắp nơi ăn trộm quần áo! Ta nghĩ đã đến lúc ngươi cần một bài học về lễ nghi..."\n\nÔi không, không phải #EMP lễ nghi!#!"
 childhood.7002.a:0 "#EMP Không! Ewwwww!#!"
 childhood.7002.b:0 "Chuyện này sẽ không bao giờ xảy ra nữa, ta hứa!"
 childhood.7002.c:0 "Đó là ý tưởng của #EMP TẤT CẢ#! [child_helper.GetFirstNamePossessiveNoTooltip]!"
 bully_stops:0 "[bully.GetFirstName] ngừng bắt nạt ngươi"
 skill_increased:0 "Kỹ năng tăng"
 funny_opinion:0 "Hài hước"
 
 childhood.7100.t:0 "Một cảnh tượng kinh hoàng"
 childhood.7100.desc:0 "Khi ta đang chơi trong sân, ta thấy [child_to_annihilate.GetFirstName] đang chơi với vài đứa trẻ khác.\n\n"
 childhood.7100.killed_by_sow:0 "Đột nhiên, khi [child_to_annihilate.GetFirstNameNoTooltip] chạy ngang chuồng lợn gần đó, một con lợn nái khổng lồ chộp lấy cánh tay của [child_to_annihilate.GetHerHis]. Nó không buông ra. Ta quay mặt đi khi tiếng hét ngày càng lớn, cho đến khi cuối cùng im bặt.\n\n"
 childhood.7100.kicked_by_horse:0 "Không báo trước, khi [child_to_annihilate.GetSheHe] đi ngang một con ngựa, nó đá tung. [child_to_annihilate.GetFirstNameNoTooltip] bị hất văng vài mét và nằm bất động, máu me đầy người trên mặt đất.\n\n"
 childhood.7100.kicked_by_camel:0 "Không báo trước, khi [child_to_annihilate.GetSheHe] đi ngang một con lạc đà, nó đá tung. [child_to_annihilate.GetFirstNameNoTooltip] bị hất văng vài mét và nằm bất động, máu me đầy người trên mặt đất.\n\n"
 childhood.7100.stomped_by_elephant:0 "Không báo trước, khi [child_to_annihilate.GetSheHe] đi ngang một con voi, nó dựng lên và rống vang. Con voi giẫm một chân khổng lồ xuống [child_to_annihilate.GetFirstNameNoTooltip], nghiền nát [child_to_annihilate.GetHerHim] xuống đất.\n\n"
 childhood.7100.smashed_by_roof_tile:0 "Khi [child_to_annihilate.GetSheHe] đi ngang dưới một tòa nhà gần đó, một viên ngói nặng bất ngờ rơi xuống. Với một tiếng #EMP rầm#! lớn, nó đập trúng đầu của [child_to_annihilate.GetFirstNamePossessiveNoTooltip], hạ gục [child_to_annihilate.GetHerHim] ngay lập tức.\n\n"
 childhood.7100.desc_end:0 "Sự im lặng đột ngột nhanh chóng bị thay thế bởi tiếng hét kinh hoàng của những người chứng kiến. Làm sao [ROOT.Char.GetFaith.HighGodName] có thể để chuyện này xảy ra!?"
 death_sow:0 "bị lợn nái cắn chết"
 death_horse:0 "bị ngựa đá chết"
 death_camel:0 "bị lạc đà đá chết"
 death_roof_tile:0 "đã bị một viên ngói rơi làm vỡ nát [CHARACTER.GetHerHis] đầu"
 childhood.7100.a:0 "C.. cái gì!? K.. không!"
 childhood.7100.b:0 "...#DIE1 ha#!haHA! Các ngươi thấy chưa!"
 childhood.7100.c:0 "Meh."
 childhood.7100.d:0 "C.. ngươi có thể ôm ta một lúc được không, [friend_to_comfort.GetFirstNameNoTooltip]?"
 childhood.7100.d.friend:0 "Người bạn [friend_to_comfort.GetFirstNameNoTooltip] của ngươi đang cố hết sức để an ủi ngươi"
 
 childhood.7200.t:0 "Rào cản ngôn ngữ"
 childhood.7200.desc:0 "Ta rất thích chơi với [language_friend.GetFirstName], nhưng đôi khi thật khó hiểu [language_friend.GetSheHe] đang nói gì...\n\nDù có thể giao tiếp bằng cử chỉ tay và nét mặt, ta nghĩ sẽ rất thú vị nếu ta có thể nói [language_friend.GetCulture.GetLanguage.GetNameNoTooltip] với [language_friend.GetHerHim]!\n\nCó lẽ ta nên học hành chăm chỉ vì [language_friend.GetFirstNamePossessiveNoTooltip]?"
 childhood.7200.a:0 "Ta sẽ học ngày học đêm!"
 childhood.7200.b:0 "Hm, ta sẽ bảo người hầu đọc vài truyện ngụ ngôn [language_friend.GetCulture.GetLanguage.GetNameNoTooltip] cho chúng ta."
 childhood.7200.c:0 "Không, quá nhiều việc. Còn phải #EMP chơi#! nữa!"
 entertained_opinion:0 "Giải trí"
 
 childhood.7300.t:0 "'Chuẩn bị' cho tương lai"
 childhood.7300.desc:0 "Sớm thôi ta sẽ thật sự cai trị – không còn bị giám sát bởi những người giám hộ thất thường và những thầy giáo tự cho mình biết tuốt... và khi điều đó xảy ra, ta phải chắc chắn rằng thần dân nằm gọn trong tay ta.\n\n[beating_target_1.GetTitledFirstName] yếu đuối và nhút nhát, ta chắc rằng sự hiện diện đáng sợ của ta sẽ khiến [beating_target_1.GetHerHim] trở nên... #EMP trung thành#! trong tương lai.\n\n"
 childhood.7100.beating_target_2:0 "Hoặc có lẽ [beating_target_2.GetTitledFirstName] đáng để ta chú ý hơn? [beating_target_1.GetSheHe|U] cũng yếu đuối.\n\n"
 childhood.7100.beating_target_3:0 "Và còn có [beating_target_3.GetTitledFirstName] yếu ớt kia, ta chỉ cần #EMP nhìn chằm chằm#! vào [beating_target_3.GetHerHim]! "
 childhood.7300.desc_end:0 "Thật nhiều lựa chọn..."
 childhood.7300.a:0 "[beating_target_1.GetFirstNameNoTooltip], để ta giới thiệu ngươi với nắm đấm của ta!"
 childhood.7300.b:0 "Lại đây, [beating_target_2.GetFirstNameNoTooltip]..."
 childhood.7300.c:0 "Không có gì cá nhân đâu, [beating_target_3.GetFirstNameNoTooltip], chỉ là công việc thôi."
 childhood.7300.d:0 "Chuyện này không xứng với ta..."
 childhood.7300.a.success:0 "Ngươi khiến [beating_target_1.GetFirstNameNoTooltip] khiếp sợ"
 childhood.7300.a.failure:0 "Ngươi không khiến [beating_target_1.GetFirstNameNoTooltip] khiếp sợ"
 childhood.7300.b.success:0 "Ngươi khiến [beating_target_2.GetFirstNameNoTooltip] khiếp sợ"
 childhood.7300.b.failure:0 "Ngươi không khiến [beating_target_2.GetFirstNameNoTooltip] khiếp sợ"
 childhood.7300.c.success:0 "Ngươi khiến [beating_target_3.GetFirstNameNoTooltip] khiếp sợ"
 childhood.7300.c.failure:0 "Ngươi không khiến [beating_target_3.GetFirstNameNoTooltip] khiếp sợ"
 
 childhood.7400.t:0 "Vệ sĩ chống bắt nạt"
 childhood.7400.desc:0 "Ôi không... [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('bully'))] của ta là [bully.GetFirstName] lại ở đây. Ta chỉ muốn chơi yên bình, sao [bully.GetSheHe] không để ta yên!\n\n"Ngươi đang làm gì vậy, đồ #EMP [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bully'))]!#!" [bully.GetFirstNameNoTooltip] hét vào mặt ta."
 childhood.7400.desc_2:0 "\n\nĐột nhiên, một cái chạm nhẹ vào vai ta. \"Có phải [bully.GetSheHe] đang làm phiền ngươi không?\" [bodyguard.GetFirstName], cận vệ của ta, nói bằng giọng bình tĩnh. \"Ta có nên dạy cho [bully.GetHerHim] một bài học về cách cư xử không?\""
 childhood.7400_father_dead:0 "\"Ngươi đúng là một [ROOT.Char.Custom2('InsultAdjective'), bully] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bully'))] bẩn thỉu! Ồ, và còn nữa... cha ngươi chết rồi! Ha-hah!\""
 childhood.7400_mother_dead:0 ""Ngươi đúng là đồ [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bully'))] ghê tởm! À mà... mẹ ngươi chết rồi! Ha-hah!""
 childhood.7400_none_dead:0 ""Ngươi đúng là đồ [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bully'))] thối tha, chẳng ai muốn chơi với ngươi!""
 childhood.7400.a:0 "Từ giờ ngươi sẽ làm mọi điều ta nói, hiểu chưa?"
 childhood.7400.b:0 "[bodyguard.GetFirstNameNoTooltip], dạy cho [bully.GetHerHim] một bài học!"
 childhood.7400.c:0 "Ngươi cần học cách tử tế."
 every_parent_of_bully:0 "Mọi phụ mẫu của [bully.GetFirstName]"
 
  childhood.7500.t:0 "Một Câu Chuyện Từ Quá Khứ"
  childhood.7500.desc:0 ""Lại gần đây, ta có một câu chuyện muốn kể cho ngươi nghe." [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] của ta, [guardian.GetTitledFirstName] nói, ra hiệu cho ta tiến lại gần đống lửa trại.\n\n"
  childhood.7500.participant:0 ""Đó là câu chuyện về khi [guardian_memory.GetDescription]. Phải, [guardian.Custom2('RelationToMe', SCOPE.sC('memory_participant'))] của ta...""
  childhood.7500.participant_dead:0 ""Đó là câu chuyện về khi [guardian_memory.GetDescription]. [memory_participant.GetSheHe|U] từng là [guardian.Custom2('RelationToMe', SCOPE.sC('memory_participant'))] của ta, người đã [memory_participant.GetDeathReason]...""
  childhood.7500.no_participant:0 ""Đó là câu chuyện về khi [guardian_memory.GetDescription]...""
  childhood.7500.midpoint:0 "[guardian.GetFirstNameNoTooltip] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('guardian'))] và tiếp tục kể câu chuyện khi những ngọn lửa từ đống lửa trại liếm lên bầu trời đêm."
  childhood.7500.family:0 "\n\n"...hãy nhớ tầm quan trọng của gia tộc ngươi, [ROOT.Char.GetFirstNameNoTooltip]. Hãy mang danh nhà [ROOT.Char.GetHouse.GetNameNoTooltip] với niềm kiêu hãnh. #EMP [ROOT.Char.GetHouse.GetMotto].#!"" 
  childhood.7500.martial:0 "\n\n"...hãy rèn luyện kỹ năng, dũng lực và trí tuệ của ngươi trong chiến trận. [ROOT.Char.GetFirstNameNoTooltip], kẻ thù của ngươi sẽ không có giới hạn — hãy luyện tập để có thể đánh bại chúng."" 
  childhood.7500.death:0 "\n\n"...[ROOT.Char.GetFirstNameNoTooltip] thân mến, hãy nhớ bài học từ câu chuyện của ta. Cái chết đến với tất cả chúng ta — hãy chắc rằng nó đến với kẻ thù của ngươi trước khi đến với ngươi."" 
  childhood.7500.war:0 "\n\n"...sự tàn khốc của chiến tranh sẽ thử thách bản lĩnh của mọi [ROOT.Char.GetWomanMan]. Hãy nhớ, chiến lược chân chính cần sự xảo quyệt, [ROOT.Char.GetFirstNameNoTooltip]."" 
  childhood.7500.relationships:0 "\n\n"...những người quanh ngươi — bằng hữu, cố vấn, thậm chí cả đối thủ — mới là những kẻ quan trọng. Hãy giữ họ thật gần, đặc biệt là kẻ thù của ngươi."" 
  childhood.7500.childhood:0 "\n\n"...một câu chuyện từ chính thời thơ ấu của ta! Ôi, ta cảm thấy mình thật già rồi."" 
  childhood.7500.a:0 "Thật là một câu chuyện hay, [guardian.GetFirstNameNoTooltip]."
  childhood.7500.b:0 "#DIE2 ...z#!#DIE1 z#!zZ"
  culture_tradition_events.2100.t:0 "Một Câu Chuyện Bên Đống Lửa"
  culture_tradition_events.2100.b:0 "Những câu chuyện của ngài luôn khiến ta cảm thấy dễ chịu hơn, thật đấy."
