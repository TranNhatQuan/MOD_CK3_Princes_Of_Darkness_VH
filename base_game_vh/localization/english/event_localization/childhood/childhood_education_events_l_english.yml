l_english:
 childhood_education.0004.t:0 "Sự Thay Đổi Thất Thường Của Tuổi Trẻ"
 childhood_education.0004.opening:0 "Người được ta giám hộ, [ward.GetTitledFirstName], đã thay đổi trọng tâm học tập của [ward.GetHerHis].\n\n"
 childhood_education.0004.desc1:0 "Không ngờ rằng giờ đây [ward.GetSheHe] lại mong muốn dấn thân vào nghệ thuật [ward.Custom('education_focus_child')], một lĩnh vực mà ta rất am hiểu... Điều đó khiến lòng ta ấm áp!"
 childhood_education.0004.desc2:0 "Không ngờ rằng [ward.GetSheHe] lại từ bỏ mối quan tâm chung của chúng ta đối với nghệ thuật [ROOT.Char.Custom('education_focus')]!"
 childhood_education.0004.desc_fallback:0 "[ward.GetSheHe|U] giờ theo đuổi tri thức trong nghệ thuật [ward.Custom('education_focus_child')]."
 childhood_education.0004.a:0 "[ward.GetTitledFirstNameNoTooltip] giờ đang học về [ward.Custom('education_focus_child')]!"

 childhood_education.1011.t:0 "Đó Là Con Người Ta"
 childhood_education.1011.desc:0 "[guardian.GetTitledFirstName] đã dạy ta rất nhiều về phong tục của dân tộc [guardian.GetHerHis] — của #EMP chúng ta#!, bởi vì không chỉ ta theo đức tin [guardian.GetFaith.GetAdjective], ta còn xem mình hoàn toàn là người [guardian.GetCulture.GetName]."
 childhood_education.1011.a:0 "Đó là cách sống duy nhất ta mong muốn."

 childhood_education.1012.t:0 "Một Ngày Được Ban Phúc"
 childhood_education.1012.desc:0 "Với quá trình giáo dục liên tục về đức tin và tập quán của dân tộc ta, [ward.GetTitledFirstName] đã nói với ta rằng [ward.GetSheHe] cảm thấy mình là một người [guardian.GetCulture.GetName] [guardian.GetFaith.GetAdjective] chân chính."
 childhood_education.1012.a:0 "Cuối cùng [ward.GetSheHe] cũng nhìn thấy ánh sáng!"

 child_culture_and_faith_converted.parent.title: "[ward.Custom('GetDaughterSon')|U] Bị Ảnh Hưởng Bởi Người Giám Hộ"
 child_culture_and_faith_converted.parent.message:1 "[ward.Custom('GetDaughterSon')] của ngươi, [ward.GetTitledFirstNamePossessive], đã thay đổi tín ngưỡng và văn hóa dưới sự dạy dỗ của [guardian.GetTitledFirstName]"

 childhood_education.1021.t:0 "Trong Đức Tin, Có Chân Lý"
 childhood_education.1021.desc:0 "Sự dạy dỗ của [guardian.GetTitledFirstNamePossessive] đã cho ta học được rất nhiều, và ta cảm thấy mình hiểu được bản chất thật sự của thế giới.\n\nSao ta từng có thể nghi ngờ rằng [guardian.GetFaith.GetName] nắm giữ mọi câu trả lời?"
 childhood_education.1021.a:0 "Ta đã tìm thấy đức tin chân chính của mình."

 childhood_education.1022.t:0 "Trong Đức Tin, Có Chân Lý"
 childhood_education.1022.desc:0 "Sau tất cả những bài giảng và mọi tri thức ta đã chia sẻ, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('ward'))] của ta, [ward.GetTitledFirstName], cuối cùng cũng đã đón nhận đức tin chân chính.\n\nTa luôn biết rằng một ngày nào đó [ward.GetSheHe] sẽ trở thành một người [ROOT.Char.GetFaith.GetAdjective] tốt."
 childhood_education.1022.a:1 "[ROOT.Char.GetFaith.KnowledgeGodName] đã dẫn dắt tay ta."

 child_faith_converted.parent.message:1 "[ward.Custom('GetDaughterSon')] của ngươi, [ward.GetTitledFirstNamePossessive], đã thay đổi tín ngưỡng dưới sự dạy dỗ của [guardian.GetTitledFirstName]"

 childhood_education.1031.t:0 "Bẩm Sinh Và Nuôi Dưỡng"
 childhood_education.1031.desc:0 "Ta có thể sinh ra là người [ward.GetCulture.GetName], nhưng ta không thể phủ nhận rằng giờ đây ta thậm chí không còn hiểu điều đó nghĩa là gì. Sau sự dạy dỗ của [guardian.GetTitledFirstNamePossessive], ta cảm thấy mình hoàn toàn là người [guardian.GetCulture.GetName]."
 childhood_education.1031.a:0 "Đó là con người ta."

 childhood_education.1032.t:0 "Bẩm Sinh Và Nuôi Dưỡng"
 childhood_education.1032.desc:0 "Sau thời gian dài dạy dỗ [ward.GetTitledFirstName], ta vô cùng vui mừng khi [ward.GetSheHe] nói rằng [ward.GetSheHe] xem [ward.GetHerselfHimself] là người [guardian.GetCulture.GetName]!"
 childhood_education.1032.a:0 "Và quả thật [ward.GetSheHe] là vậy!"

 child_culture_converted.parent.message:1 "[ward.Custom('GetDaughterSon')] của ngươi, [ward.GetTitledFirstNamePossessive], đã thay đổi văn hóa dưới sự dạy dỗ của [guardian.GetTitledFirstName]"

