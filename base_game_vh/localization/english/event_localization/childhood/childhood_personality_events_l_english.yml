  child_personality.4011.t:0 "Sự Hấp Dẫn Chớm Nở"
  child_personality.4011.desc_opening:0 "Nằm cuộn mình trên giường dưới tấm da [ROOT.Char.Custom('GetAnimalType')] của ta, ta dần chìm vào giấc ngủ trong một làn sương ấm áp.\n\n"
  child_personality.4011.desc_1:0 "Trước mặt ta là một con [ROOT.Char.Custom('GetAnimalType')] tuyệt đẹp đang thúc giục ta theo nó vào vùng [ROOT.Char.Custom('TerrainType')]. Khi chúng ta đến một khoảng rừng trống, tim ta bắt đầu đập mạnh, cơ thể run lên, tâm hồn #EMP khao khát#!. Khi ta quay lại, con [ROOT.Char.Custom('GetAnimalType')] đã biến mất, và thay vào đó là một..."
  child_personality.4011.desc_2:0 "Trước mặt ta là một người, được bao phủ trong màn sương, ra hiệu mời gọi. Khi ta đến gần họ, khi ta chạm vào họ, làn sương bắt đầu tan đi, và một màu hồng ấm áp lan trên làn da của chúng ta. Ta cúi xuống hôn họ. Khi ta ngẩng lên, ta được chào đón bởi nụ cười ấm áp của một..."
  child_personality.4011.desc_3:0 "Ta bật dậy giữa đêm — lồng ngực dồn dập và làn da run rẩy. Ta chưa từng cảm thấy như thế này trước đây; ta bị bệnh sao? Ta đã mơ thấy gì? Điều duy nhất ta nhớ là một..."
  child_personality.4011.a:0 "... chàng trai."
  child_personality.4011.b:0 "... cô gái."
  child_personality.4011.c:0 "... cô gái. Hay là một chàng trai? Ta không nhớ rõ."
  child_personality.4011.d:0 "... một người. Thành thật mà nói, ta chỉ mừng vì tất cả chỉ là giấc mơ."

  child_personality.4012.desc:0 "Ta đã được bảo rằng việc cảm thấy bị thu hút bởi một số người là điều tự nhiên — rằng theo thời gian ta sẽ muốn hiểu họ một cách thân mật.\n\nTa đã cố gắng tìm hiểu điều đó nghĩa là gì, nhưng tiến triển duy nhất của ta là nhận ra rằng việc khám phá bí ẩn này chỉ thú vị khi có những [ROOT.Char.Custom('GirlBoyPlural')] khác ở quanh."
  child_personality.4012.a:1 "[ROOT.Char.Custom('GirlBoyPlural')|U] thật sự là tuyệt nhất!"

  child_personality.4013.desc:0 "Khi chơi với những đứa trẻ khác, ta nhận ra rằng ta không phiền nếu được ghép cặp với một cô gái hay một chàng trai trong những trò chơi thân mật hơn của chúng ta. Nhiều đứa trẻ khác dường như có sở thích riêng, thậm chí còn làm ầm lên, nhưng ta không hiểu tại sao."
  child_personality.4013.a:0 "Cả con trai lẫn con gái đều thú vị!"

  child_personality.4014.desc:0 "Mọi người xung quanh ta dường như rất háo hức ghép đôi — mỉm cười và chơi những trò hôn hít, chạm chạm với những đứa trẻ khác. Khi ta không tỏ ra hứng thú, họ trông có vẻ bối rối, và [dummy_opposite_gender.Custom('GirlBoyPlural')] nói rằng ta nên thích họ hơn."
  child_personality.4014.a:0 "Ta thật sự không hiểu..."

  child_personality.4015.desc:0 "Khi ta nhìn thấy một [ROOT.Char.Custom('OppositeGenderedLowlyServantType')] trẻ tuổi đi ngang qua, đẫm mồ hôi vì lao động nhưng đôi má [dummy_opposite_gender.GetHerHis] ửng hồng, ta như bị mê hoặc. Cảm giác này là gì? Sự khao khát này là gì?"
  child_personality.4015.a:0 "[dummy_opposite_gender.Custom('GirlBoyPlural')|U] thật hấp dẫn!"
  child_personality.4015.b:0 "Ta biết [crush.GetSheHe] chỉ là một thường dân... nhưng ôi, trái tim ta!"


 #Reincarnation, by Mathilda Bjarnehed
 child_personality.9900.t:0 "Bản Sao Như Đúc"
 child_personality.9900.start.desc:1 "Mọi người cứ nói rằng ta là bản sao như đúc của [ROOT.Char.Custom2('RelationToMe', ancestor)] của ta, [ancestor.GetTitledFirstName]. Ta chưa từng gặp [ancestor.GetHerHim], nhưng họ mỉm cười khi nói điều đó, nên hẳn đó là một điều tốt.\n\n"
 child_personality.9900.start.sinful.desc:0 "Mọi người cứ nói rằng ta là bản sao như đúc của [ROOT.Char.Custom2('RelationToMe', ancestor)] của ta, [ancestor.GetTitledFirstName]. Ta chưa từng gặp [ancestor.GetHerHim], nhưng nghe nói [ancestor.GetSheHe] từng là một [ancestor.GetWomanMan] độc ác.\n\n"
 child_personality.9900.mother.desc:0 "Mẹ ta nói rằng ta"
 child_personality.9900.father.desc:0 "Cha ta nói rằng ta"
 child_personality.9900.nurse.desc:0 "Bảo mẫu của ta nói rằng ta"
 child_personality.9900.temperate.desc:0 "điềm đạm và luôn kiểm soát bản thân,"
 child_personality.9900.greedy.desc:0 "luôn tìm kiếm những cơ hội mới,"
 child_personality.9900.generous.desc:0 "không ích kỷ,"
 child_personality.9900.diligent.desc:0 "một học trò chăm chú và ham học,"
 child_personality.9900.calm.desc:0 "bình hòa và điềm tĩnh,"
 child_personality.9900.arrogant.desc:1 "một [child.Custom('GirlBoy')] cao quý và đầy kiêu hãnh,"
 child_personality.9900.humble.desc:0 "một tâm hồn khiêm nhường,"
 child_personality.9900.deceitful.desc:1 "một [child.Custom('GirlBoy')] xảo quyệt,"
 child_personality.9900.honest.desc:0 "luôn nói sự thật,"
 child_personality.9900.brave.desc:0 "không sợ hãi điều gì,"
 child_personality.9900.gregarious.desc:0 "rất giỏi kết bạn mới,"
 child_personality.9900.ambitious.desc:0 "được định sẵn cho những điều vĩ đại,"
 child_personality.9900.just.desc:0 "công bằng và vô tư,"
 child_personality.9900.zealous.desc:1 "một tín đồ trung thành của [child.GetFaith.GetNameNoTooltip],"
 child_personality.9900.compassionate.desc:0 "một tâm hồn nhân hậu và dịu dàng,"
 child_personality.9900.stubborn.desc:0 "không phải kiểu dễ dàng bỏ cuộc,"
 child_personality.9900.forgiving.desc:0 "không bao giờ ôm giữ thù hằn,"
 child_personality.9900.sinful.temperate.desc:0 "không mấy hứng thú với những thú vui của cuộc sống,"
 child_personality.9900.sinful.greedy.desc:0 "ích kỷ và không muốn chia sẻ,"
 child_personality.9900.sinful.generous.desc:1 "thường xuyên phung phí tiền bạc,"
 child_personality.9900.sinful.diligent.desc:0 "hiếu động đến mức khó chịu,"
 child_personality.9900.sinful.calm.desc:0 "lạnh lùng một cách kỳ lạ,"
 child_personality.9900.sinful.arrogant.desc:0 "kiêu căng và ngạo mạn,"
 child_personality.9900.sinful.humble.desc:0 "hoàn toàn thiếu tự tin,"
 child_personality.9900.sinful.deceitful.desc:0 "một kẻ nói dối mưu mô,"
 child_personality.9900.sinful.honest.desc:0 "thành thật đến mức khó chịu,"
 child_personality.9900.sinful.brave.desc:0 "đầy vẻ khoe khoang liều lĩnh,"
 child_personality.9900.sinful.gregarious.desc:0 "quá thân thiện,"
 child_personality.9900.sinful.ambitious.desc:0 "luôn đòi hỏi thêm đồ chơi mới để chơi,"
 child_personality.9900.sinful.just.desc:0 "một kẻ tự cao đạo đức giả,"
 child_personality.9900.sinful.zealous.desc:1 "một kẻ mù quáng theo [child.GetFaith.GetNameNoTooltip],"
 child_personality.9900.sinful.compassionate.desc:0 "bị lòng trắc ẩn làm mờ mắt,"
 child_personality.9900.sinful.stubborn.desc:0 "bướng bỉnh không lay chuyển,"
 child_personality.9900.sinful.forgiving.desc:0 "quá dễ dàng tha thứ cho những xúc phạm,"
 child_personality.9900.lunatic.desc:1 "đầy những ý tưởng \"kỳ lạ\""
 child_personality.9900.dull.desc:1 "một [child.Custom('GirlBoy')] \"trầm tư\","
 child_personality.9900.shrewd.desc:1 "một [child.Custom('GirlBoy')] lanh lợi,"
 child_personality.9900.strong.desc:0 "rất khỏe mạnh,"
 child_personality.9900.end.desc:2 "hệt như [child.Custom2('RelationToMe', ancestor)] của ta, [ancestor.GetFirstNameNoTooltip]!"
 child_personality.9900.sinful.postscript.desc:0 "Càng nhiều người nói về điều này, ta càng bị đối xử tệ hơn. Ta thậm chí còn bị đổ lỗi cho những việc mình chưa từng làm!"
 child_personality.9900.a.dull:0 "Ta đúng là dành rất nhiều thời gian để suy nghĩ..."
 child_personality.9900.a:0 "Ta sẽ khiến [ancestor.GetHerHim] tự hào!"
 child_personality.9900.a.sinful:0 "Thật không công bằng! Sao ta phải bị phán xét vì hành động của [ancestor.GetHerHis]?"

 child_personality.9901.t:0 "Tái Sinh"
 child_personality.9901.start.desc:1 "[child.Custom2('MyCharacterIntroduction', ROOT.Char)|U] là bản sao như đúc của [child.GetHerHis] [child.Custom2('RelationToMe', ancestor)], [ancestor.GetTitledFirstName]! Nhưng sự giống nhau này không chỉ ở bề ngoài — nó còn sâu sắc hơn nhiều.\n\n[child.GetFirstNameNoTooltip] là"
 child_personality.9901.dull.desc:0 "hơi chậm chạp một chút, có thể nói vậy,"
 child_personality.9901.end.desc:0 "cũng giống như [child.GetHerHis] [child.Custom2('RelationToMe', ancestor)] của con trước [child.GetHerHim]. Có lẽ thực sự là [ancestor.GetTitledFirstNameNoTooltip] đã trở lại để đi dạo trên trái đất này?"
 child_personality.9901.a:0 "Vũ trụ chứa đầy những bí ẩn thiêng liêng."

