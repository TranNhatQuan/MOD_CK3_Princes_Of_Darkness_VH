l_english:
  child_personality.0001.t:0 "Một Kẻ Đáng Sợ"
  child_personality.0001.opening:0 "Mỗi khi ta nhìn thấy [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('bully'))] của mình là [bully.GetTitledFirstName], [bully.GetSheHe] lại nghĩ ra một cách mới để hành hạ ta."
  child_personality.0001.bullying_1:0 "\n\nLần này [bully.GetSheHe] đe dọa nhét đầu ta ra ngoài cái lỗ trên tường nhà xí!"
  child_personality.0001.bullying_2:1 "\n\nLần này [bully.GetSheHe] theo ta suốt cả ngày, sủa như chó và gọi ta là đồ chó hoang!"
  child_personality.0001.bullying_3:1 "\n\nLần này [bully.GetSheHe] làm đổ một giá nến rồi đổ lỗi cho ta!"
  child_personality.0001.end:0 "\n\n[bully.GetSheHe|U] khiến ta sợ hãi, nhưng ta có thể làm gì đây?"
  child_personality.0001.no_bully_fallback:0 "Con gái của tên [ROOT.GetCharacter.Custom('lowly_servant_type')] là một kẻ bắt nạt khủng khiếp. Mỗi khi ta nhìn thấy nó, nó lại nghĩ ra cách mới để hành hạ ta. Nó to lớn và khỏe mạnh như vậy, ta còn có thể làm gì đây?"
  child_personality.0001.a:0 "Ít nhất ta đang trở nên rất, rất giỏi trong việc trốn tránh."
  child_personality.0001.b:0 "Dù sao thì ta cũng muốn ở trong phòng cả ngày."
  child_personality.0001.c:0 "Có lẽ ta có thể khiến [bully.GetHerHim] bị treo cổ vì chuyện này?"

  child_personality.0002.t:0 "Kẻ Phạm Tội"
  child_personality.0002.guardian:0 "Khi đi qua phố cùng [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] của ta là [guardian.GetTitledFirstName], chúng ta đi ngang qua cái cũi gông. Một người đàn ông bị nhốt trong đó, cầu xin nước hoặc bất kỳ sự thương xót nào cho số phận của hắn."
  child_personality.0002.no_guardian:0 "Khi đi qua phố, chúng ta đi ngang qua cái cũi gông. Một người đàn ông bị nhốt trong đó, cầu xin nước hoặc bất kỳ sự thương xót nào cho số phận của hắn."
  child_personality.0002.a:0 "Tên tội phạm đó thậm chí không nên dám nhìn ta!"
  child_personality.0002.b:0 "Ta sẽ lấy cho hắn ít nước từ giếng."
  child_personality.0002.c:0 "Nước à? Hy vọng bùn này đủ dùng!"

  child_personality.0003.t:0 "Bị Bắt!"
  child_personality.0003.guardian:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] của ta là [guardian.GetTitledFirstName] bắt gặp ta đang trộm từ rương hành lý của [robbed_guest.GetTitledFirstNamePossessive] khi [robbed_guest.GetSheHe] đến thăm lâu đài. Đe dọa trừng phạt, [guardian.GetFirstName] yêu cầu ta giải thích."
  child_personality.0003.no_guardian:0 "Ta bị bắt khi đang trộm từ rương hành lý của [robbed_guest.GetTitledFirstNamePossessive] khi [robbed_guest.GetSheHe] đến thăm lâu đài. Đe dọa trừng phạt, [robbed_guest.GetFirstName] yêu cầu ta giải thích."
  child_personality.0003.a:0 "Ta... bị một đứa trẻ khác thách đấu trong một trò chơi."
  child_personality.0003.b:0 "Ta nghĩ mình có thể thoát tội, nhưng ta sẽ không bao giờ làm vậy nữa."
  child_personality.0003.c:0 "Ta cũng không có quyền với bất cứ thứ gì hơn người khác."

  child_personality.0004.t:0 "Nguồn Cảm Hứng Triều Đình"
  child_personality.0004.desc:1 "Ta vô cùng ấn tượng với một trong những $knight_culture_player_plural_no_tooltip_lowercase$ của gia đình. Cuối cùng ta cũng được giới thiệu gặp ông ấy trực tiếp, và ta vẫn ấn tượng như vậy. Ta sẽ nhớ những lời ông nói suốt đời."
  child_personality.0004.desc_knight:0 "Ta vô cùng ấn tượng với một trong những $knight_culture_player_plural_no_tooltip_lowercase$ của gia đình. Cuối cùng ta cũng được giới thiệu gặp [knight.GetHerHim] trực tiếp, và ta vẫn ấn tượng như vậy. Ta sẽ nhớ những lời [knight.GetHerHis] suốt đời."
  child_personality.0004.a:0 ""Hãy cho người khác điều họ xứng đáng, rồi ngươi cũng sẽ nhận lại phần của mình.""
  child_personality.0004.b:0 ""Hãy chăm chỉ làm việc, và ngươi có thể làm chủ bất cứ điều gì.""
  child_personality.0004.c:0 ""Sự vĩ đại sẽ đến theo thời gian. Hãy ở đó để nắm lấy khi nó xuất hiện.""

  child_personality.0005.t:0 "Giờ Chơi"
  child_personality.0005.desc:1 "Ta đang chơi với mấy đứa trẻ khác thì [doing_push.GetFirstName] cố đẩy ngã ta!\n\n[doing_push.GetSheHe|U] luôn bám theo ta, tìm mọi cơ hội để đẩy ta... Việc này bắt đầu làm ta phát điên lên rồi, ta phải làm gì đó với nó mới được."
  child_personality.0005.a:0 "Ta sẽ cho ngươi biết chuyện gì xảy ra với kẻ dám đẩy ta!"
  child_personality.0005.b:0 "Sao ngươi lại đẩy ta? Ta chỉ muốn chơi với ngươi thôi."
  child_personality.0005.c:0 "À khoan, ta vừa nghĩ ra một trò chơi khác!"

  child_personality.0006.t:0 "Sự Từ Chối Đau Lòng"
  child_personality.0006.desc_crush:0 "Ôi, ta dành cả ngày lẫn đêm để nghĩ về [crush.GetTitledFirstName], và tim ta đập loạn nhịp mỗi khi thấy ngài trong các hành lang lâu đài! \n\nTuy nhiên, khi ta đến bày tỏ cảm xúc với ngài, [crush.GetSheHe] lại từ chối ta bằng một tràng cười, giẫm nát trái tim ta dưới chân [crush.GetHerHis] khi [crush.GetSheHe] bước đi."
  child_personality.0006.desc:0 "Một [child.Custom('servant_for_romance')] bình thường đã đánh cắp trái tim ta! Mỗi ánh nhìn về phía ta đều khiến tim ta rung động.\n\nNhưng khi ta bày tỏ tình cảm, [child.Custom('servant_for_romance')] đó chỉ cười và từ chối ta!"
  child_personality.0006.a_crush:0 "Ta sẽ cho [crush.GetHerHim] biết cảm giác bị hạ nhục là thế nào!"
  child_personality.0006.a:0 "Ta sẽ cho chúng biết cảm giác bị hạ nhục là thế nào!"
  child_personality.0006.b:0 "Nếu đây là tình yêu, ta chẳng muốn dính líu gì đến nó."
  child_personality.0006.c_crush:0 "[crush.GetSheHe] thật sự nghĩ ta dễ dàng bỏ cuộc vậy sao?"
  child_personality.0006.c:0 "Chúng thật sự nghĩ ta dễ dàng bỏ cuộc vậy sao?"

  child_personality.0007.t:0 "Một Phán Quyết"
  child_personality.0007.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] của ta là [guardian.GetTitledFirstName] nói với ta về bản án tử hình dành cho một tên trộm hèn mọn hai ngày trước.\n\n[guardian.GetSheHe|U] muốn biết ta nghĩ gì về hình phạt khắc nghiệt như vậy cho một tội nhỏ."
  child_personality.0007.a:0 "Như vậy là quá đáng. Hình phạt phải tương xứng với tội lỗi."
  child_personality.0007.b:0 "Đây không phải là luật pháp của một vương quốc thánh thiện."
  child_personality.0007.c:0 "Chúng ta nên hài lòng với những gì mình đã có."

  child_personality.0008.t:0 "Bữa Tiệc Của Mọi Giác Quan"
  child_personality.0008.desc:1 "Ở trong một bữa tiệc giống như bị ngập trong vô số ấn tượng. Mọi người nói chuyện, mùi của đủ loại thức ăn tràn ngập đầu óc ta. Khách khứa mặc những bộ quần áo đẹp đẽ, người hầu mang vô số đĩa thức ăn, và—\n"
  child_personality.0008.serving_wench:0 "\nCái nháy mắt vừa rồi của cô hầu gái đó có ý gì?"
  child_personality.0008.servant_boy:0 "\nCái nháy mắt vừa rồi của cậu hầu trai đó có ý gì?"
  child_personality.0008.desc_not_server:1 "\nTa không thể ngừng kinh ngạc trước tất cả những thứ này! Thật là một màn phô trương quyền lực tuyệt vời."
  child_personality.0008.a:0 "Mọi thứ thật lấp lánh!"
  child_personality.0008.b:0 "Người lớn nói chuyện thật thú vị!"
  child_personality.0008.c:0 "Ta không thể ngừng nghĩ về ánh mắt của người hầu đó!"

  child_personality.0009.t:0 "Đứa Trẻ Thuyết Giáo"
  child_personality.0009.desc:1 "Ta nhìn [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('child_preacher'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('child_preacher'))] của mình là [child_preacher.GetTitledFirstName] nói chuyện với vài đứa trẻ khác về [child_preacher.GetFaith.random_GoodGodNames]. Chúng cười nhạo và chế giễu [child_preacher.GetHerHim] một lúc trước khi bắt đầu xô đẩy. Dù bị chế giễu, [child_preacher.GetSheHe] vẫn cố tiếp tục bài giảng cho đến khi cú đấm đầu tiên giáng xuống."
  child_personality.0009.desc_fallback:1 "Ta nhìn bạn mình nói chuyện với vài đứa trẻ khác về [ROOT.Char.GetFaith.random_GoodGodNames]. Chúng cười nhạo một lúc trước khi bắt đầu xô đẩy. Dù bị chế giễu, bạn ta vẫn cố tiếp tục bài giảng cho đến khi cú đấm đầu tiên giáng xuống."
  child_personality.0009.a:0 "Ta sẽ bảo vệ ngươi!"
  child_personality.0009.a.tt:1 "Có khả năng bạn sẽ bị Thương."
  child_personality.0009.b:0 "Chúng ta hãy dừng lại và nói chuyện về chuyện này."
  child_personality.0009.c:0 "Đây là cách các ngươi đối xử với người rao giảng lời thần linh sao!?"
  child_personality.0009.d:0 "Chuyện này chắc sẽ vui đây!"

  child_personality.0010.t:0 "Sinh Mạng Trong Tay Ta"
  child_personality.0010.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] của ta là [guardian.GetTitledFirstName] đưa ta vào rừng để chơi với cung tên. Khi chạy đi một mình, không lâu sau ta bắt gặp một con nai cái bị thương đang cố khập khiễng rời xa ta."
  child_personality.0010.a:0 "Đây sẽ là con vật lớn nhất ta từng hạ gục!"
  child_personality.0010.b:0 "Nó chậm như vậy, ta có thể đâm nó và nhìn nó chảy máu đến chết."
  child_personality.0010.c:0 "Đây là thử thách do [guardian.GetFirstNameNoTooltip] đặt ra, phải không?"

  child_personality.0011.t:0 "Vật Ta Khao Khát"
  child_personality.0011.desc:0 "Ta đã muốn có [ROOT.GetCharacter.Custom('child_object_of_interest_indefinite')] từ lâu, và [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] của ta là [guardian.GetTitledFirstName] hứa sẽ mua cho ta một cái sau ba tháng nếu ta chăm chỉ học hành hơn."
  child_personality.0011.a:0 "Ta khá thích kiểu học hiện tại rồi."
  child_personality.0011.b:0 "Ồ, ta không còn muốn nó nữa."
  child_personality.0011.c:0 "Ta sẽ học thật chăm!"

  child_personality.0012.t:0 "Một Bữa Tiệc Lộn Xộn"
  child_personality.0012.desc:0 "Bữa tiệc này ồn ào quá, lũ người lớn thì tẻ nhạt và đồ ăn cũng chẳng ngon lành gì.\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] [guardian.GetFirstName] của ta dường như đang rất tận hưởng [guardian.GetHerselfHimself], nên ta không thể thu hút sự chú ý [guardian.GetHerHis] của ngài để nói rằng ta không muốn ở đây chút nào."
  child_personality.0012.a:0 "Ta sẽ lén ra ngoài. Có lẽ có những đứa trẻ khác quanh đây."
  child_personality.0012.b:0 "Ta không chịu nổi nhiều người như vậy! Đến lúc trốn dưới gầm bàn."
  child_personality.0012.c:0 "Ít nhất ta vẫn có thể tiếp tục ăn khi còn ở đây!"

  child_personality.0021.t:0 "Tính Cách Dần Hình Thành"
  child_personality.0021.desc:0 "Một trong số ít niềm an ủi trong cảnh giam cầm của ta là quan sát mọi người, dù chỉ qua song sắt."
  child_personality.0021.serving_wench:0 "– mỗi sáng ta hy vọng mình có thể nhìn thấy cô hầu gái xinh đẹp đó chỉ một lần."
  child_personality.0021.servant_boy:0 "– mỗi sáng ta hy vọng mình có thể nhìn thấy cậu hầu trai đẹp trai đó chỉ một lần."
  child_personality.0021.desc_no_gender:0 "– mỗi sáng ta hy vọng mình có thể nhìn thấy một trong những người hầu xinh xắn."
  child_personality.0021.a:0 "Rồi trí tưởng tượng của ta sẽ làm phần còn lại..."

  child_personality.0022.desc:0 "Ta đã quen với việc ở một mình. Không ai để trò chuyện, không ai để chơi cùng, không ai để học cùng. Chỉ riêng ý nghĩ có người chạm vào ta bây giờ thôi cũng..."
  child_personality.0022.a:0 "Khiến sống lưng ta lạnh toát!"

  child_personality.0023.desc:0 "Ta không bao giờ biết khi nào mình sẽ có bữa ăn tiếp theo, nên khi được đưa cho một cái đĩa ta sẽ nuốt sạch mọi thứ trên đó không chút do dự, bất kể nhiều hay ít.\n\nChỉ khi no bụng ta mới cảm thấy phần nào yên tâm."
  child_personality.0023.a:0 "Đó là một trong số ít niềm vui của ta!"

  child_personality.0024.desc:0 "Ta không bao giờ biết khi nào mình sẽ có bữa ăn tiếp theo, nên khi được đưa cho một cái đĩa ta buộc mình phải chia khẩu phần và hài lòng với những gì mình có.\n\nBan đầu thật khó khăn, nhưng giờ đã trở thành bản năng."
  child_personality.0024.a:0 "Tiết chế là điều cốt yếu."

  child_personality.0025.desc:0 "Một chiếc thìa bị vứt bỏ, một viên sỏi lấp lánh, một cái đĩa vỡ... Trước đây ta có lẽ đã khinh thường những món lặt vặt như vậy, nhưng giờ ta nhận ra rằng chẳng có gì thật sự vô giá trị!"
  child_personality.0025.a:0 "Ta thu thập mọi kho báu có thể tìm thấy."

  child_personality.0026.desc:0 "Khi ngươi không sở hữu gì, một hành động tử tế cũng có ý nghĩa vô cùng – ta đã học điều đó theo cách khó khăn. Thật khó tin khi nghĩ rằng chỉ một hành động hào phóng đơn giản cũng có thể tạo ra ảnh hưởng lớn đến người khác!"
  child_personality.0026.a:0 "Những gì của ta là... của mọi người!"

  child_personality.0027.desc:0 "Những ngày của ta trôi qua mờ nhạt phía sau song sắt này. Ta thức dậy, đi qua đi lại, rồi – hy vọng – được ăn...\n\nCó cố gắng lấp đầy thời gian bằng hoạt động hay không cũng chẳng khác gì. Dù ta có cố gắng hay không cũng vậy."
  child_personality.0027.a:0 "Ta sẽ ngủ tiếp vậy."

  child_personality.0028.desc:0 "Những ngày của ta trôi qua mờ nhạt phía sau song sắt này. Ta thức dậy, đi qua đi lại, rồi – hy vọng – được ăn...\n\nĐể lấp đầy thời gian, ta đã học cách tự đặt ra nhiệm vụ cho mình, và hoàn thành chúng thật tốt."
  child_personality.0028.a:0 "Chăm chỉ là chìa khóa!"

  child_personality.0029.desc:0 "Những tên lính canh nhăn nhó theo dõi từng bước của ta, tên [imprisoner.Custom2('InsultAdjective', ROOT.Char)] [imprisoner.Custom2('InsultNoun', ROOT.Char)] [imprisoner.GetTitledFirstName] giam cầm ta, lũ chuột chạy rầm rập trong góc tối... Có một cơn giận đang lớn dần trong ta, và nó mạnh lên theo từng ngày!"
  child_personality.0029.a:0 "Ta... chỉ... ARGH!"

  child_personality.0030.desc:0 "Ta chẳng thể làm gì để thay đổi tình cảnh của mình, cả trong từng ngày lẫn trong bức tranh lớn hơn. Không có nhiều việc để làm, cũng chẳng có nhiều điều để nói."
  child_personality.0030.a:0 "Ta đã học cách chấp nhận nó."

  child_personality.0031.desc:0 "Ta chẳng thể làm gì để thay đổi tình cảnh của mình, cả trong từng ngày lẫn trong bức tranh lớn hơn. Ta chỉ có thể chờ xem điều gì xảy ra."
  child_personality.0031.a:0 "Kiên nhẫn là điều cốt yếu."

  child_personality.0032.desc:0 "Nếu việc bị nhốt sau song sắt dạy ta điều gì, thì đó là mọi thứ không thể chờ đợi; ngươi không bao giờ biết điều gì sẽ xảy ra trong một ngày, một giờ, hay một phút! Liệu ta còn sống không?"
  child_personality.0032.a:0 "Ta không thể lãng phí thời gian mình có!"

  child_personality.0033.desc:0 "Khi họ ném ta vào đây, ta đã tự hỏi; tại sao họ phải giam ta sau song sắt?\n\nTheo thời gian ta nhận ra rằng họ sợ ta; họ sợ ta sẽ trở thành gì, và vì thế họ đã nhốt ta lại."
  child_personality.0033.a:0 "Ta thật sự đáng gờm như vậy!"

  child_personality.0034.desc:0 "Khi họ ném ta vào đây, ta đã tự hỏi; tại sao họ phải giam ta sau song sắt?\n\nTheo thời gian ta nhận ra rằng chắc hẳn ta đã làm điều gì đó đáng bị như vậy, và ta nên biết ơn những gì cuộc đời vẫn ban cho ta."
  child_personality.0034.a:0 "Ta không đòi hỏi nhiều."

  child_personality.0035.desc:0 "Nếu việc bị nhốt sau song sắt dạy ta điều gì, thì đó là trong cuộc đời này không có gì miễn phí; để có được điều mình muốn, ngươi phải gian lận và phải nói dối. May mắn thay lính canh của ta rất dễ bị lừa!"
  child_personality.0035.a:0 "Chỉ kẻ ngốc mới nói thật."

  child_personality.0036.desc:0 "Nếu việc bị nhốt sau song sắt dạy ta điều gì, thì đó là con người không ngần ngại trừng phạt, và điều tốt nhất ta có thể làm là đừng cho họ lý do. Ngoài ra, luôn có #EMP ai đó#! đang quan sát."
  child_personality.0036.a:0 "Dù sao nói dối cũng chỉ mang lại rắc rối."

  child_personality.0037.desc:0 "Lính canh bên ngoài nhà giam của ta vừa to lớn vừa cay nghiệt, và chúng theo dõi từng cử động của ta.\n\nNhưng khi ta cố trốn đi thì chỉ một lúc sau lũ chuột, hoặc thứ gì tệ hơn, lại lẻn đến!"
  child_personality.0037.a:0 "Mỗi ngày lại mang đến một nỗi sợ mới..."

  child_personality.0038.desc:0 "Lũ lính canh bên ngoài phòng giam của ta to con và cay nghiệt như chính những gì chúng đối xử với ta vậy, chúng theo dõi từng cử động của ta. Có lũ chuột trong bóng tối, và mỗi ngày đều mang đến một nỗi kinh hoàng mới.\n\n[imprisoner.GetTitledFirstName] sẽ phải nâng cấp trò chơi [imprisoner.GetHerHis] của mình nếu [imprisoner.GetSheHe] muốn khiến ta sợ hãi lúc này!"
  child_personality.0038.a:0 "Ta không sợ gì cả."

  child_personality.0039.desc:0 "Đã lâu lắm rồi ta không nhìn thấy ai khác, và ta không biết mình nên tuyệt vọng hay nhẹ nhõm.\n\nMột mặt ta khao khát #EMP bất kỳ#! sự tiếp xúc xã hội nào sau từng ấy thời gian sau song sắt, nhưng mặt khác ta không còn biết phải nói gì nữa..."
  child_personality.0039.a:0 "Con người thật đáng sợ!"

  child_personality.0040.desc:0 "Ở sau song sắt cả ngày thật #EMP chán ngắt#!!! Một trong số ít điều mang lại niềm vui cho ta là những cuộc trò chuyện với lính canh; chúng có thể thô lỗ, nhưng vài người trong số họ lại thú vị một cách bất ngờ!"
  child_personality.0040.a:0 "Làm ơn, kể thêm đi!"

  child_personality.0041.desc:0 "Nghĩ về tất cả những thứ đang trôi qua trong khi ta mục rữa sau song sắt khiến ta thức trắng đêm; bao cơ hội đã mất...\n\nKhi cuối cùng ta thoát khỏi cái hố nhà tù thối nát này, ta sẽ bù lại toàn bộ thời gian đã mất!"
  child_personality.0041.a:0 "Không gì có thể ngăn ta!"

  child_personality.0042.desc:0 "Bị mắc kẹt trong nhà tù này, ta đã học được rằng ta không cần nhiều để sống; sự xa hoa và giàu có vốn không có giá trị thực sự.\n\nKhi cuối cùng ta ra khỏi đây, ta sẽ trân trọng mọi thứ mình có!"
  child_personality.0042.a:0 "Dù giá trị của chúng ra sao."

  child_personality.0043.desc:0 "Sau song sắt này ta đã học được một bài học quý giá: người duy nhất ngươi có thể thật sự tin tưởng là chính mình. Cuối cùng thì ý kiến của người khác có ý nghĩa gì? Thậm chí, người khác có ý nghĩa gì?"
  child_personality.0043.a:0 "Chẳng có gì cả!"

  child_personality.0044.desc:0 "Sự bất công ta chứng kiến trong nhà tù này – từ cả lính canh lẫn tù nhân – đủ để khiến ta gặp ác mộng.\n\nNếu chúng ta không thể đối xử công bằng với nhau, thì còn ý nghĩa gì nữa?!"
  child_personality.0044.a:0 "Không có luật pháp chúng ta chẳng khác gì thú vật."

  child_personality.0045.desc:0 "Con người ích kỷ; nếu thời gian trong tù dạy ta điều gì thì đó là điều này.\n\nMột bữa ăn tử tế bất ngờ? Tù nhân sẽ làm mọi thứ để cướp của nhau. Một tên lính canh trêu chọc bảo họ từ bỏ [ROOT.Char.GetFaith.HighGodName] để đổi lấy phần thưởng? Không chút do dự."
  child_personality.0045.a:0 "Con người chỉ quan tâm đến bản thân."

  child_personality.0046.desc:0 "Điều duy nhất luôn tồn tại trong thời gian ta bị giam giữ là [ROOT.Char.GetFaith.HighGodNameAlternate]. Mỗi khi ta suy sụp, mỗi khi ta nghi ngờ, [ROOT.Char.GetFaith.HighGodNameSheHe] luôn ở đó trong những lời cầu nguyện của ta.\n\nNgày qua ngày ta càng chắc chắn rằng chẳng có gì thực sự quan trọng ngoài đức tin của mình."
  child_personality.0046.a:0 "Ngợi khen [ROOT.Char.GetFaith.HighGodName]!"

  child_personality.0047.desc:0 "Dù ta đi đâu lính canh cũng ở đó, quan sát. Ngay cả khi ta nghĩ mình ở một mình, sau đó chúng vẫn buông một lời bình khiến ta biết rằng chúng đã thấy tất cả; rằng luôn có ánh mắt dõi theo ta."
  child_personality.0047.a:0 "Luôn có ai đó đang quan sát..."

  child_personality.0048.desc:0 "[imprisoner.GetTitledFirstName] nói ta sẽ có quần áo và thức ăn, và đúng là ta có. Lính canh nói ta sẽ không bao giờ thấy ánh sáng ban ngày, và đúng là ta không.\n\nĐiều duy nhất ta chắc chắn sau song sắt này là con người thường nói thật."
  child_personality.0048.a:0 "Ta tin họ."

  child_personality.0049.desc:0 "Có rất ít niềm vui sau song sắt này, và một cử chỉ tử tế nhỏ cũng có ý nghĩa lớn. Nhìn thấy niềm vui trong mắt người khác, thấy tinh thần họ được nâng lên... Không gì khiến ta bình yên hơn."
  child_personality.0049.a:0 "Lòng tốt là tất cả."

  child_personality.0050.desc:0 "Sự bất công ta thấy trong nhà tù này – từ cả lính canh lẫn tù nhân – đủ để khiến ta gặp ác mộng. Hoặc... trước đây là vậy. Giờ chẳng còn gì có thể khiến ta ngạc nhiên nữa."
  child_personality.0050.a:0 "Ai cũng có thể tàn nhẫn."

  child_personality.0051.desc:0 "Niềm vui hiếm hoi sau song sắt này. Lính canh vừa thô lỗ vừa hung dữ, [imprisoner.GetTitledFirstName] thì cộc cằn hoặc thù địch, còn các tù nhân khác đau khổ quá mức để giải trí cho ta. Hoặc... ta từng nghĩ vậy. Mỗi khi một người trong số họ đau đớn, ta lại cảm thấy chút niềm vui trỗi dậy trong tâm hồn."
  child_personality.0051.a:0 "Cảm giác này... ta muốn nhiều hơn!"

  child_personality.0052.desc:0 "Người khác quyết định ta ăn gì, khi nào và ở đâu ta ngủ, ta đi đâu... Thứ duy nhất ta còn giữ sau song sắt này là niềm tin của mình, và ta sẽ không thỏa hiệp."
  child_personality.0052.a:0 "Ta là điều duy nhất không đổi ở nơi này."

  child_personality.0053.desc:0 "Đã quá lâu kể từ khi ta tự do đến mức ta không còn nhớ cảm giác nắm giữ cuộc đời mình; tự đưa ra quyết định. Giờ ngay cả câu hỏi đơn giản nhất cũng có thể khiến ta bối rối.\n\nDù đôi khi khó biết mình muốn gì, điều đó cũng mở ra vô số khả năng!"
  child_personality.0053.a:0 "Ai biết ta muốn làm gì?"

  child_personality.0054.desc:0 "Nếu ai đó xúc phạm ngươi, và ngươi nhanh chóng tha thứ rồi quên đi, họ chắc chắn sẽ xúc phạm ngươi lần nữa. Lính canh và tù nhân khác đã dạy ta điều đó.\n\nMay mắn thay, trong nhà tù này chẳng có gì để làm ngoài việc nhớ mãi."
  child_personality.0054.a:0 "[imprisoner.GetTitledFirstNameNoTooltip], ta sẽ trả thù."

  child_personality.0055.desc:0 "Khi bị kẹt với cùng một nhóm người ngày này qua ngày khác, ngươi nhận ra rằng chẳng có gì hoàn toàn trắng hay đen; con người luôn có lý do cho hành động của họ, và hầu hết mọi người đều đang cố gắng hết sức.\n\nTa sẽ có toàn kẻ thù quanh mình trong nhà tù này nếu ta không tha thứ."
  child_personality.0055.a:0 "Giữ mãi hận thù chỉ mang lại đau khổ."

  child_personality.0061.t:0 "Ảnh Hưởng Từ Người Giám Hộ"
  child_personality.0061.desc_opening:0 "Ta không thích sự cô độc, nhưng cũng khó mà tận hưởng sự bầu bạn của người khác. Luôn có cảm giác lo lắng rằng trong những lúc giao tiếp xã hội ta sẽ tự biến mình thành trò cười."
  child_personality.0061.desc_shy:0 "Vì vậy ta cảm thấy một sự đồng cảm sâu sắc với [guardian.GetTitledFirstNameNoTooltip], [ROOT.GetCharacter.Custom2('RelationToMe' , guardian)], người dường như cũng bị dằn vặt bởi những suy nghĩ tương tự."
  child_personality.0061.desc_gregarious:0 "[guardian.GetTitledFirstNameNoTooltip], [ROOT.GetCharacter.Custom2('RelationToMe' , guardian)], lại hoàn toàn trái ngược với ta về phương diện này."
  child_personality.0061.desc_fallback:0 "Ta không biết liệu mình có phải là người duy nhất có những suy nghĩ như vậy..."
  child_personality.0061.desc_ending:0 "Ta thoáng thấy [guardian.GetTitledFirstNameNoTooltip] trong một buổi giao tế, nơi tất cả mọi người đều cầm ly rượu trong tay và nở nụ cười rạng rỡ. Có lẽ câu nói rượu giúp con người thư giãn quả thật có phần đúng."
  child_personality.0061.a:0 "Có thể đó là cách chữa trị sự nhút nhát của ta chăng?"
  child_personality.0061.a.tt:0 "#EMP Có khả năng ngươi sẽ cải thiện ngoại giao và dần có khuynh hướng uống rượu.#!"
  child_personality.0061.b:0 "Không, sự nhút nhát của ta là thử thách từ [ROOT.Char.GetFaith.HighGodName]! Đây hẳn là [ROOT.Char.GetFaith.DevilName] đang cám dỗ ta!"

  my_ward_or_child:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] của Ta "
  child_personality.101.desc:0 "[child.GetTitledFirstName] đến gặp ta để than phiền rằng [bully.GetTitledFirstName] đang bắt nạt [child.GetHerHim]."
  child_personality.101.desc_no_bully:0 "[child.GetTitledFirstName] đến phàn nàn với ta về việc [child.Custom('GetDaughterSon')] của một [child.Custom('lowly_servant_type')] đang bắt nạt nó [child.GetHerHim]."
  child_personality.101.craven:1 "\n\n[child.GetSheHe|U] đã trốn khắp nơi trong lâu đài để tránh phải đối mặt với đứa trẻ kia."
  child_personality.101.lazy:1 "\n\n[child.GetSheHe|U] đã nằm lì trên giường nhiều ngày để tránh phải đối mặt với đứa trẻ kia."
  child_personality.101.arbitrary:0 "\n\n[child.GetSheHe|U] bắt đầu hỏi làm thế nào để treo cổ ai đó, nếu [child.GetSheHe] cảm thấy người đó đáng bị như vậy."
  child_personality.1011.t:1 "[child.GetFirstNameNoTooltip] Đang Lẩn Trốn"
  child_personality.1012.t:0 "Bị nhốt trong phòng của [child.GetHerHis]"
  child_personality.1013.t:0 "Những Câu Hỏi Về Hình Phạt"
  child_personality.101.confirm_craven:0 "Tốt. Đừng tìm đến rắc rối khi điều đó là không cần thiết."
  child_personality.101.confirm_lazy:0 "Ngươi không cần phải đối mặt với thế giới nếu không muốn."
  child_personality.1013.confirm_arbitrary:0 "Ý chí của ngươi mới là luật lệ duy nhất thực sự quan trọng."
  child_personality.101.lazy_change:0 "Sao ngươi không trốn trong phòng mình?"
  child_personality.101.arbitrary_change:0 "Kẻ bắt nạt đáng bị bất kỳ hình phạt nào ngươi có thể nghĩ ra."
  child_personality.101.craven_change:0 "Hãy chắc rằng ngươi luôn ẩn mình thật kỹ!"
  child_personality.1021.t:0 "Đám Nông Dân Hèn Mọn"
  child_personality.1022.t:0 "Xoa Dịu Nỗi Đau"
  child_personality.1023.t:0 "Muối Xát Vết Thương"
  child_personality.102.desc_court_location:2 "Khi ta đang ở [court_location.Custom('BaronyTownType')] cùng [child.GetTitledFirstName], sự chú ý của [child.GetHerHis] bị thu hút bởi một tên tội phạm bị xích vào cột bêu ngoài đường."
  child_personality.102.desc:1 "Khi ta đang ở chợ cùng [child.GetTitledFirstName], sự chú ý của [child.GetHerHis] bị thu hút bởi một tên tội phạm bị xích vào cột bêu."
  child_personality.102.arrogant:1 "\n\n[child.GetFirstNameNoTooltip] ngẩng cao đầu [child.GetHerHis] và cố tình phớt lờ những lời cầu xin nước uống của kẻ tội phạm."
  child_personality.102.compassionate:1 "\n\nKhi người đàn ông cầu xin nước, [child.GetFirstNameNoTooltip] lập tức hứa sẽ mang cho hắn, rồi nhanh chóng quay lại từ chiếc giếng gần đó, để hắn uống nước từ đôi tay chụm lại của [child.GetHerHis]."
  child_personality.102.callous:1 "\n\n[child.GetFirstNameNoTooltip] quan sát hắn một lúc. Khi hắn không làm gì khác ngoài việc ho sặc sụa và van xin nước, [child.GetFirstNameNoTooltip] đảo mắt [child.GetHerHis] chán nản và bước tiếp."
  child_personality.102.confirm_arrogant:0 "Tốt, hãy để hắn biết vị trí của mình."
  child_personality.102.confirm_compassionate:0 "Không có lòng nhân, thế gian sẽ sụp đổ."
  child_personality.102.confirm_callous:0 "Một kẻ tội phạm không đáng nhận gì ngoài sự khinh bỉ."
  child_personality.102.arrogant_change:0 "Tên tội phạm này thậm chí không đáng để ngươi chú ý."
  child_personality.102.compassionate_change:0 "Không, con à, hãy mang nước cho người tội nghiệp đó."
  child_personality.102.callous_change:0 "Khạc nhổ vào hắn. Đánh hắn. Hắn xứng đáng như vậy."

  child_personality.103.desc:1 "Ta vô cùng kinh ngạc khi bắt gặp [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] của ta, [child.GetTitledFirstName], đang cố trộm đồ từ rương hành lý của vị khách ghé thăm [robbed_guest.GetTitledFirstName]."
  child_personality.103.deceitful:0 "\n[child.GetSheHe|U] đổ lỗi cho một trò chơi do đứa trẻ khác nghĩ ra, nhưng ta biết [child.GetSheHe] đang nói dối."
  child_personality.103.honest:0 "\n[child.GetSheHe|U] thú nhận rằng [child.GetSheHe] đã nghĩ mình có thể thoát tội, nhưng giờ đã biết đó là sai trái."
  child_personality.103.humble:0 "\n[child.GetSheHe|U] đã dành cho ta một bài diễn thuyết ấn tượng về việc tại sao giờ đây [child.GetSheHe] hiểu được hành động của mình là sai trái."
  child_personality.1031.t:0 "Cái Giá Của Kẻ Nói Dối"
  child_personality.1032.t:0 "Người Phụng Sự Sự Trung Thực"
  child_personality.1033.t:0 "Phúc Cho Kẻ Khiêm Nhường"
  child_personality.103.confirm_deceitful:0 "Ngươi phải học cách thoát thân bằng lời nói dối của mình."
  child_personality.103.confirm_honest:0 "Sự trung thực sẽ phục vụ ngươi tốt nhất về lâu dài, con à."
  child_personality.103.confirm_humble:0 "Chúng ta chỉ là những mảnh nhỏ trong thế giới này."
  child_personality.103.deceitful_change:0 "Không, chúng ta phải che giấu lỗi lầm của ngươi!"
  child_personality.103.honest_change:0 "Hãy trung thực, và ngươi sẽ thấy người khác cởi mở với mình."
  child_personality.103.humble_change:0 "Chúng ta đều bị dẫn dắt bởi những quy tắc lớn hơn bản thân mình, con à."
  
  child_personality.1041.t:0 "Món Quà Của Lòng Hào Phóng"
  child_personality.1042.t:0 "Lao Động Và Gian Khổ"
  child_personality.1043.t:0 "Mọi Thứ Đều Có Thời"
  child_personality.104.desc:2 "[child.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã bị ấn tượng bởi một trong những $knight_culture_player_plural_no_tooltip$ của gia đình từ rất lâu. Sau khi cuối cùng được gặp mặt trực tiếp, [child.GetSheHe] cứ lặp đi lặp lại những lời của vị chiến binh đó với bản thân [child.GetHerselfHimself]."
  child_personality.104.generous:0 "\n\n"Hãy cho người khác những gì họ xứng đáng, và rồi ngươi cũng sẽ nhận lại phần của mình.""
  child_personality.104.diligent:0 "\n\n"Hãy làm việc chăm chỉ, và ngươi có thể làm chủ bất cứ điều gì.""
  child_personality.104.patient:0 "\n\n"Sự vĩ đại đến theo thời gian. Hãy sẵn sàng nắm lấy nó khi thời khắc tới.""
  child_personality.104.confirm_generous:0 "Khi những người xung quanh [child.GetHerHim] phát triển, [child.GetSheHe] cũng sẽ như vậy."
  child_personality.104.confirm_diligent:0 "Đúng vậy. Lao động chăm chỉ sẽ đưa [child.GetHerHim] đến nơi [child.GetSheHe] muốn."
  child_personality.104.confirm_patient:0 "Phải, cơ hội luôn đến khi thời điểm chín muồi."
  child_personality.104.generous_change:0 "[child.GetSheHe|U] không bao giờ được quên vai trò của người khác trong sự vĩ đại của chính mình [child.GetHerHis]."
  child_personality.104.diligent_change:0 "[child.GetSheHe|U] phải được dạy rằng chăm chỉ luôn mang lại kết quả."
  child_personality.104.patient_change:0 "Mọi thứ đều cần thời gian, [child.GetFirstNameNoTooltip] thân mến."

  child_personality.1051.t:0 "Nhanh Nổi Giận"
  child_personality.1052.t:0 "Điềm Tĩnh"
  child_personality.1053.t:0 "Sở Thích Thay Đổi"
  child_personality.105.desc:0 "Ta đang quan sát [child.GetTitledFirstName] chơi cùng những đứa trẻ khác thì [doing_push.GetTitledFirstName] cố xô ngã [child.GetHerHim]."
  child_personality.105.wrathful:0 "Chẳng mấy chốc một trận ẩu đả đã nổ ra giữa lũ trẻ!"
  child_personality.105.forgiving:0 "\n[child.GetFirstName] vẫn bình thản trước chuyện đó, rồi ngồi xuống nói chuyện với [doing_push.GetFirstName] thay vì nổi giận."
  child_personality.105.fickle:0 "Khoảnh khắc ấy không kéo dài lâu, vì [child.GetFirstName] nhanh chóng biến nó thành một trò chơi hoàn toàn mới và quên hẳn trò chơi trước đó."
  child_personality.105.confirm_wrathful:0 "[child.GetFirstNameNoTooltip] đáp trả không kém gì những gì [child.GetSheHe] phải chịu!"
  child_personality.105.confirm_forgiving:0 "[child.GetFirstNameNoTooltip] biết khi nào nên quay má bên kia."
  child_personality.105.confirm_fickle:0 "Đôi khi bỏ qua và tiếp tục tiến lên là cách tốt nhất."
  child_personality.105.wrathful_change:0 "[child.GetSheHe|U] không bao giờ được để người khác chà đạp lên mình [child.GetHerHim]!"
  child_personality.105.forgiving_change:1 "[child.GetFirstNameNoTooltip] phải được dạy cách quay má bên kia."
  child_personality.105.fickle_change:1 "[child.GetFirstNameNoTooltip] không nên bận tâm quá lâu về chuyện này."
  child_personality.1061.t:0 "Oán Hận Âm Ỉ"
  child_personality.1062.t:0 "Mất Hứng Thú"
  child_personality.1063.t:0 "Sự Kiên Quyết"
  child_personality.106.desc:0 "[child.GetTitledFirstName] đã ấp ủ tình cảm thầm kín với [crush.GetTitledFirstName] trong một thời gian. Tuy nhiên, khi [child.GetSheHe] cuối cùng cũng thú nhận cảm xúc [child.GetHerHis] của mình, [crush.GetFirstName] đã phản ứng một cách cay nghiệt."
  child_personality.106.vengeful:0 "\n\nGiờ đây [child.GetFirstName] lẩm bẩm khó chịu mỗi khi [crush.GetSheHe] đi ngang qua."
  child_personality.106.chaste:0 "\n\nSự từ chối ấy dường như khiến [child.GetFirstName] trở nên dè dặt với mọi dạng cảm xúc yêu đương."
  child_personality.106.stubborn:0 "\n\nTuy vậy [child.GetFirstName] vẫn kiên trì theo đuổi [crush.GetHerHim] như trước."
  child_personality.106.confirm_vengeful:0 "À, những thói xấu trẻ con."
  child_personality.106.confirm_chaste:0 "Tốt nhất đừng vướng vào chuyện dục vọng."
  child_personality.106.confirm_stubborn:0 "Nếu lần đầu thất bại, chỉ còn cách thử lại."
  child_personality.106.vengeful_change:0 "[child.GetFirstNameNoTooltip] không nên để bất cứ ai đối xử với mình như thế [child.GetHerHim]!"
  child_personality.106.chaste_change:0 "Có lẽ tình yêu không dành cho [child.GetFirstNameNoTooltip]..."
  child_personality.106.stubborn_change:0 "[child.GetFirstNameNoTooltip] không nên bỏ cuộc dễ dàng như vậy!"
  child_personality.1071.t:0 "Một Phán Quyết Khắc Nghiệt"
  child_personality.1072.t:0 "Nhân Danh Thần Linh"
  child_personality.1073.t:0 "Sự Tiết Chế Đáng Khen"
  child_personality.107.desc:0 "Sau khi một tên trộm hèn mọn bị tuyên án tử hình, ta hỏi [child.Custom2('MyCharacterIntroduction', ROOT.Char)] xem [child.GetSheHe] nghĩ gì."
  child_personality.107.just:0 "\n\n[child.GetSheHe|U] trả lời rằng bản án ấy quá nặng nề đối với một tội nhỏ như vậy."
  child_personality.107.cynical:0 "\n\n[child.GetSheHe|U] bày tỏ nghi ngờ rằng liệu có vị thần nào thực sự muốn một vương quốc được cai trị bằng luật pháp tàn khốc như thế."
  child_personality.107.temperate:0 "\n\n[child.GetSheHe|U] nói rằng [child.GetSheHe] đã học được một bài học về việc không nên với tới những thứ vượt quá khả năng của mình."
  child_personality.107.confirm_just:0 "Quả thật hình phạt ấy không tương xứng với tội lỗi."
  child_personality.107.confirm_cynical:0 "Đừng mong chờ công lý của [child.GetFaith.HighGodNamePossessive]."
  child_personality.107.confirm_temperate:0 "Vượt quá giới hạn có thể vô cùng nguy hiểm."
  child_personality.107.just_change:0 "[child.GetSheHe|U] phải được dạy cách thi hành luật pháp đúng đắn."
  child_personality.107.cynical_change:0 "Đã đến lúc cho [child.GetHerHim] thấy [ROOT.Char.GetFaith.HighGodName] quan tâm ít đến mức nào."
  child_personality.107.temperate_change:0 "Đây là bài học về sự tiết chế trong mọi việc."
  child_personality.1081.t:0 "Con Mắt Tinh Tường"
  child_personality.1082.t:0 "Kết Giao Bạn Bè"
  child_personality.1083.t:0 "Một Ánh Nhìn Không Đúng Mực"
  child_personality.108.desc:0 "[child.GetTitledFirstName] dường như vô cùng thích thú với yến tiệc gần đây của chúng ta!"
  child_personality.108.greedy:0 "\nTrong tất cả mọi thứ, [child.GetSheHe] chỉ không ngừng nói về những bộ y phục xa hoa và vàng bạc lấp lánh mà [child.GetSheHe] thấy."
  child_personality.108.gregarious:0 "\n[child.GetSheHe|U] hòa hợp rất tốt với tất cả những người [child.GetSheHe] trò chuyện, kể cả các vị khách trưởng thành."
  child_personality.108.lustful:1 "\nSau đó, [child.GetSheHe] không thể ngừng nói về những cảm xúc mà cái nhìn chằm chằm của một trong những người hầu trẻ tuổi đã gây ra trong lòng nó [child.GetHerHim]."
  child_personality.108.confirm_greedy:0 "Đó chính là những biểu tượng quyền lực chi phối thế giới của chúng ta."
  child_personality.108.confirm_gregarious:0 "Kết bạn chưa bao giờ là điều có hại."
  child_personality.108.confirm_lustful:0 "Ồ, đứa trẻ ranh mãnh này đang đến tuổi trưởng thành rồi sao, phải không [child.GetSheHe]?"
  child_personality.108.greedy_change:0 "Hãy thấy rằng giá trị thật nằm trong những biểu tượng quyền lực xa hoa!"
  child_personality.108.gregarious_change:0 "Ta sẽ dạy [child.GetHerHim] cách kết bạn trong yến tiệc!"
  child_personality.108.lustful_change:0 "Ta thấy ánh mắt ngươi nhìn người hầu đó, [child.GetFirstNameNoTooltip]."
  child_personality.1091.t:0 "Xông Vào Cuộc"
  child_personality.1092.t:0 "Người Hòa Giải Trẻ Tuổi"
  child_personality.1093.t:0 "Người Bảo Vệ Đức Tin"
  child_personality.109.desc:0 "Hôm nay đã có một sự náo loạn giữa đám trẻ. [child_preacher.GetTitledFirstName] đang cố gắng thuyết giáo giữa các bạn nhỏ đồng trang lứa [child_preacher.GetHerHis] của mình, và đã trở thành mục tiêu của một cuộc ẩu đả nhỏ."
  child_personality.109.desc_fallback:0 "Hôm nay giữa lũ trẻ xảy ra một vụ náo động. Một đứa trẻ cố giảng đạo cho những đứa khác và trở thành mục tiêu của một cuộc ẩu đả nhỏ."
  child_personality.109.brave:0 "\n\n[child.GetTitledFirstName] đã can thiệp và làm những gì [child.GetSheHe] có thể để bảo vệ [child_preacher.GetHerHim]."
  child_personality.109.brave_fallback:0 "\n\n[child.GetTitledFirstName] đã can thiệp và làm những gì [child.GetSheHe] có thể để bảo vệ vị thuyết giáo nhỏ tuổi đó."
  child_personality.109.calm:0 "\n\n[child.GetTitledFirstName] can thiệp và đã ngăn chặn cuộc ẩu đả trước khi có ai bị thương."
  child_personality.109.zealous:1 "\n\n[child.GetTitledFirstName] nổi giận vì có kẻ dám nhắm vào người đang nói thay cho [child.GetFaith.random_GoodGodNames], và đã đuổi những đứa trẻ khác đi."
  child_personality.109.confirm_brave:0 "Đừng bao giờ lùi bước trước thử thách, [child.GetFirstNameNoTooltip]."
  child_personality.109.confirm_calm:0 "Giữ bình tĩnh trước áp lực là điều vô cùng quan trọng."
  child_personality.109.confirm_zealous:0 "Con sẽ phụng sự thần linh rất tốt!"
  child_personality.109.brave_change:0 "Đừng sợ hãi. Hãy xông vào khi cần."
  child_personality.109.calm_change:0 "Để ta chỉ cho con cách hòa giải việc này..."
  child_personality.109.zealous_change:0 "Đừng bao giờ để ai xúc phạm thần linh như vậy."
  child_personality.1101.t:0 "Với Sự Chắc Chắn"
  child_personality.1102.t:0 "Với Niềm Hân Hoan"
  child_personality.1103.t:0 "Với Sự Nghi Ngờ"
 child_personality.110.desc:0 "Ta dẫn [child.GetFirstName] ra ngoài chơi bắn cung, và thật bất ngờ khi [child.GetSheHe] bắt gặp một con nai cái bị thương."
 child_personality.110.ambitious:1 "\n\n[child.GetSheHe|U] không hề do dự chút nào mà hạ gục nó."
 child_personality.110.sadistic:1 "\n\nKhi [child.GetSheHe] cho ta xem con vật, những vết thương của nó cho thấy nó đã chết một cách chậm chạp và đau đớn. [child.GetFirstNameNoTooltip] chỉ mỉm cười."
 child_personality.110.paranoid:0 "\n\nSau đó [child.GetSheHe|U] còn nổi giận với ta, cho rằng ta đã sắp đặt toàn bộ cuộc gặp gỡ này như một dạng thử thách."
 child_personality.110.confirm_ambitious:0 "Sự vĩ đại đang chờ con, [child.GetFirstNameNoTooltip]."
 child_personality.110.confirm_sadistic:0 "Nó chỉ là một con vật mà thôi."
 child_personality.110.confirm_paranoid:1 "Đúng vậy, đó quả thật là một bài kiểm tra. Làm tốt lắm, [child.GetFirstNameNoTooltip]."
 child_personality.110.ambitious_change:0 "Vậy hãy cho ta thấy rằng con cũng có thể tự mình hạ gục một con vật!"
 child_personality.110.sadistic_change:0 "Luôn có kẻ phải chịu đau khổ. Hãy chắc chắn đó không phải là con."
 child_personality.110.paranoid_change:0 "Đây là một bài kiểm tra. Ta hy vọng lần sau con sẽ làm tốt hơn."
 child_personality.1111.t:0 "Khá Hài Lòng"
 child_personality.1112.t:0 "Đổi Ý"
 child_personality.1113.t:0 "Tin Tưởng Ta"
 child_personality.111.desc:0 "[child.GetTitledFirstName] đã hỏi xin ta [child.Custom('child_object_of_interest_indefinite')] từ rất lâu rồi, và ta đã nói với [child.GetHerHim] rằng ta sẽ lấy một cái cho [child.GetHerHim] trong ba tháng nữa nếu [child.GetSheHe] thể hiện sự tập trung hơn vào việc học tập [child.GetHerHis] của mình."
 child_personality.111.content:0 "\n\n[child.GetSheHe|U] đã trả lời rằng [child.GetSheHe] cảm thấy ổn với sự tận tâm hiện tại [child.GetHerHis] của mình đối với việc học tập [child.GetHerHis] của mình, dù có phần thưởng hay không."
 child_personality.111.fickle:1 "\n\n[child.GetSheHe|U] chỉ đơn giản xua tay trước lời đề nghị của ta, nói rằng giờ [child.GetSheHe] cũng chẳng còn quan tâm đến thứ đó nữa."
 child_personality.111.trusting:0 "\n\nKể từ khi ta đưa ra lời hứa, [child.GetSheHe] đã nỗ lực gấp đôi trong việc học tập [child.GetHerHis] của mình."
 child_personality.111.confirm_content:0 "Tất cả chúng ta đều học cách chấp nhận hoàn cảnh của mình."
 child_personality.111.confirm_fickle:0 "Một tâm trí biết thay đổi là một tâm trí lành mạnh."
 child_personality.111.confirm_trusting:0 "Ta sẽ không bao giờ lừa dối con, [child.GetFirstNameNoTooltip]."
 child_personality.111.content_change:0 "[child.GetSheHe|U] phải tập trung vào những gì [child.GetSheHe] đã có."
 child_personality.111.fickle_change:0 "Ta nên dạy [child.GetHerHim] cách suy nghĩ linh hoạt hơn."
 child_personality.111.trusting_change:1 "[child.GetFirstNameNoTooltip] phải được dạy cách tin vào lời của ta."
 child_personality.1121.t:0 "Lẻn Đi"
 child_personality.1122.t:0 "Cô Độc Trong Đại Sảnh"
 child_personality.1123.t:0 "Kẻ Háu Ăn Nhỏ"
 child_personality.112.desc:0 "[child.GetTitledFirstName] dường như đã gặp khó khăn tại yến tiệc gần đây của chúng ta."
 child_personality.112.impatient:0 "[child.GetSheHe|U] đã lẻn ra ngoài sớm và không thấy đâu trong suốt phần còn lại của buổi tối."
 child_personality.112.shy:0 "[child.GetSheHe|U] chui xuống dưới một chiếc bàn và trốn khỏi mọi người suốt cả bữa tiệc."
 child_personality.112.gluttonous:0 "[child.GetSheHe|U] vùi mặt [child.GetHerHis] vào đĩa thức ăn [child.GetHerHis] của mình, và việc trò chuyện duy nhất [child.GetSheHe] làm là đòi hết lượt phục vụ này đến lượt phục vụ khác."
 child_personality.112.confirm_impatient:0 "Nếu con có việc tốt hơn để làm, thì hãy làm việc đó."
 child_personality.112.confirm_shy:0 "Điều quan trọng là các vị khách biết con đã có mặt."
 child_personality.112.confirm_gluttonous:0 "Thức ăn luôn là niềm vui!"
 child_personality.112.impatient_change:0 "Nếu đó là việc phiền phức, con nên rời đi."
 child_personality.112.shy_change:0 "Dù muốn hay không, con cũng có nghĩa vụ phải xuất hiện!"
 child_personality.112.gluttonous_change:0 "Nếu thấy khó chịu với mọi người, hãy tập trung vào thức ăn."

 child_personality.2001.t:0 "Mất Dấu"
 child_personality.2001.desc:0 "Ta thích chơi với [child.GetTitledFirstName], nói cho [child.GetHerHim] biết khi [child.GetSheHe] hành động kỳ quặc, thỉnh thoảng còn xô đẩy [child.GetHerHim] một chút."
 child_personality.2001.craven:0 "\n\nThật đấy, nếu ta không biết rõ thì ta đã nghĩ [child.GetSheHe] đang trốn ta."
 child_personality.2001.a:0 "[child.GetSheHe] là gì chứ, đồ hèn à?"

 child_personality.2002.t:0 "Bị Nhốt"
 child_personality.2002.lazy:0 "\n\nGiờ đây [child.GetSheHe] chỉ dành cả ngày bị nhốt trong phòng [child.GetHerHis] của mình, chẳng làm gì cả."
 child_personality.2002.a:0 "[child.GetSheHe|U] thật chán."

 child_personality.2003.t:0 "Yêu Cầu Vô Lý"
 child_personality.2003.arbitrary:0 "\n\nGiờ thì [child.GetSheHe] chịu hết nổi và chạy đi mách người lớn rằng ta nên bị treo cổ vì chuyện đó!"
 child_personality.2003.a:0 "Khắc nghiệt quá!"

 child_personality.2004.t:0 "Từ Đánh Nhau Đến Tình Bạn"
 child_personality.2004.desc:0 "Ta tưởng [child.GetTitledFirstName] sẽ đánh nhau với ta sau khi ta vô tình xô [child.GetHerHim] khi đang chơi, nhưng cơn giận của [child.GetHerHis] nhanh chóng qua đi.\n\nThay vào đó chúng ta bắt đầu nói chuyện rồi lại chơi tiếp. Thật vui, và giờ chúng ta chơi với nhau mỗi ngày!"
 child_personality.2004.a:0 "Ta rất vui khi có một người bạn như [child.GetFirstNameNoTooltip]."

 child_personality.2005.t:0 "Sự Kiên Trì"
 child_personality.2005.desc:0 "[child.GetTitledFirstName] đã hỏi ta chơi và đi dạo cùng [child.GetHerHim] rất nhiều lần, cuối cùng ta phải nói rõ rằng ta chỉ là không muốn.\n\nLúc đầu thì thất vọng, nhưng chẳng bao lâu sau đã thấy rõ là [child.GetSheHe] sẽ không bỏ cuộc trong việc cố gắng khiến ta thích [child.GetHerHim]."
 child_personality.2005.a:0 "[child.GetSheHe|U] nên dừng lại ngay!"
 child_personality.2005.b:0 "Cũng đáng yêu khi [child.GetSheHe] không chịu bỏ cuộc."
 child_personality.2005.c:0 "[child.GetFirstNameNoTooltip]? Ai vậy?"

 child_personality.2006.t:0 "Người Cứu Ta"
 child_personality.2006.opening:0 "Ta đang cố dạy những đứa trẻ khác về Chúa thì chúng bắt đầu chế nhạo và giơ nắm đấm về phía ta."
 child_personality.2006.bully:0 "Mặc cho cách [child.GetSheHe] từng đối xử với ta trước đây, [child.GetTitledFirstName] là người duy nhất dám can thiệp và đảm bảo ta được an toàn."
 child_personality.2006.victim:0 "Mặc cho cách ta từng đối xử với [child.GetHerHim] trước đây, [child.GetTitledFirstName] là người duy nhất dám can thiệp và đảm bảo ta được an toàn."
 child_personality.2006.desc:0 "Người duy nhất dám can thiệp là [child.GetTitledFirstName], người đã đảm bảo ta được an toàn."
 child_personality.2006.a:0 "Từ đó chúng ta trở nên rất thân thiết."

 child_personality.2007.t:0 "Một Cuộc Chạm Trán"
 child_personality.2007.desc:1 "[child_preacher.GetTitledFirstName] đang nói với nhiều đứa trẻ về [child_preacher.GetFaith.HighGodName], và bắt đầu khiến ta phát bực.\n\nTa chỉ đẩy [child_preacher.GetHerHim] một chút thì bất ngờ [child.GetTitledFirstName] lao vào đánh ta dữ dội, vừa đánh vừa bảo ta tránh xa [child_preacher.GetFirstName]."
 child_personality.2007.a:0 "Ta chỉ đùa chút thôi, đồ ngốc!"

 #Curious 
  child_personality.3001.t:1 "Cái gì? Tại sao? Như thế nào?"
  child_personality.3001.desc:0 "Có quá nhiều thứ để nhìn, để ngửi, để chạm vào! Ngài đến từ đâu? Tại sao bầu trời lại màu xanh? Bên kia ngọn đồi kia có gì? Làm ơn, làm ơn, tôi muốn đi và tự mình tìm hiểu!"
  child_personality.3001.a:1 "Có quá nhiều câu hỏi!"

  child_personality.3001.message:0 "[ROOT.Char.Custom2('RelationToMe', personality_child)] của ta, [personality_child.GetTitledFirstName], lúc nào cũng đầy ắp câu hỏi!"

  child_personality.3002.desc:1 "Chẳng bao giờ có một khoảnh khắc yên tĩnh! [ROOT.GetCharacter.Custom2('RelationToMe' , personality_child) ] [personality_child.GetTitledFirstName] của ta chứa đầy những câu hỏi! Ta cố gắng hết sức để khuyến khích sự tò mò [personality_child.GetHerHis] của con, nhưng đôi khi ta không thể không cảm thấy kiệt sức bởi dòng suy nghĩ và câu hỏi không ngớt."
  child_personality.3002.a:1 "Khi một người cha và một người mẹ yêu nhau rất nhiều..."

 #Rowdy
  child_personality.3003.t:0 "Ngọn Lửa Bốc Cháy"
  child_personality.3003.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guardian'))] của tôi, [guardian.GetFirstName], cứ ra lệnh cho tôi ngồi yên và giữ im lặng, dù tôi đã nói với [guardian.GetHerHim] rằng điều đó là không thể! Cứ như tay chân tôi tự chuyển động vậy, và nếu tôi không theo chúng, chúng sẽ rơi ra và chạy mất không chờ tôi!"
  child_personality.3003.a:0 "Tôi làm điều tôi muốn!"

  child_personality.3003.message:0 "[ROOT.Char.Custom2('RelationToMe',personality_child)] của ta, [personality_child.GetTitledFirstName], lúc nào cũng bày trò gì đó!"

  child_personality.3004.t:0 "Một Kẻ Gây Rối Đang Hình Thành"
  child_personality.3004.desc:0 "Mặc dù ta đã mong đợi sự nghịch ngợm từ [ROOT.GetCharacter.Custom2('RelationToMe' , personality_child) ] [personality_child.GetTitledFirstName] của mình, nhưng sự sáng tạo [personality_child.GetHerHis] của con luôn khiến ta phải cảnh giác. Khi không phải là một trò chơi khăm, thì đó là một vụ ẩu đả, một gia sư bất mãn hoặc những đầu gối trầy xước từ một cuộc phiêu lưu không thành."
  child_personality.3004.a:0 "Chẳng bao giờ có lúc nhàm chán!"

#Bossy
  child_personality.3005.t:0 "Một Nhà Lãnh Đạo Tương Lai"
  child_personality.3005.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guardian'))] của tôi, [guardian.GetFirstName], cứ bảo tôi thỉnh thoảng hãy để những đứa trẻ khác chọn trò chơi. Nhưng tại sao tôi phải làm vậy, khi tôi luôn biết trò nào là hay nhất? Tôi phát chán với [guardian.GetHerHim] và tất cả người lớn cứ ra lệnh cho tôi!"
  child_personality.3005.a:0 "Họ đâu phải sếp của tôi!"

  child_personality.3005.message:0 "[ROOT.Char.Custom2('RelationToMe',personality_child)] của ta, [personality_child.GetTitledFirstName], thật sự biết [personality_child.GetSheHe] muốn gì!"

  child_personality.3006.desc:0 "Những ý kiến và mong muốn [ROOT.GetCharacter.Custom2('RelationToMe' , personality_child) ] của [personality_child.GetTitledFirstName] là vô tận. Một nửa thời gian, [personality_child.GetSheHe] lại đang cố bảo ta phải làm gì, thay vì ngược lại!"
  child_personality.3006.a:0 "Uy nghiêm hay phiền toái — ranh giới thật mong manh."

 #Charming
  child_personality.3007.t:0 "Làm Việc Thông Minh Hơn, Không Phải Vất Vả Hơn"
  child_personality.3007.desc:0 ""Hãy tử tế và chăm chỉ," [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guardian'))] của tôi, [guardian.GetFirstName], luôn nói vậy. Tôi cố gắng hết sức, nhưng đôi khi mệt quá! Chẳng phải sẽ thông minh hơn nếu gian lận và nói dối một chút để đạt được điều mình muốn sao?!"
  child_personality.3007.a:0 "Mà mọi người cũng dễ bị lừa lắm!"

  child_personality.3007.message:0 "[ROOT.Char.Custom2('RelationToMe',personality_child)] của ta, [personality_child.GetTitledFirstName], vừa xảo quyệt vừa ranh mãnh!"

  child_personality.3008.t:0 "Nụ Cười Ngọt Ngào Và Những Lời Nói Dối Nhỏ"
  child_personality.3008.desc:1 "Cũng giống như những đứa trẻ khác ở độ tuổi [personality_child.GetHerHis] của con, [ROOT.GetCharacter.Custom2('RelationToMe' , personality_child)] [personality_child.GetTitledFirstName] của ta đôi khi nói dối và thử thách giới hạn. Tuy nhiên, [personality_child.GetSheHe] thường tránh được sự nghi ngờ với phong thái ngọt ngào [personality_child.GetHerHis] của mình, và mọi người luôn tha thứ cho [personality_child.GetHerHim] mỗi khi [personality_child.GetSheHe] bị bắt quả tang.\n\nTa tự hỏi liệu [personality_child.GetSheHe] đã thoát tội được bao nhiêu lần rồi..."
  child_personality.3008.a:0 "Ta sẽ để mắt đến đứa này."

 #Pensive
  child_personality.3009.t:1 "Chìm Trong Suy Nghĩ"
  child_personality.3009.desc:1 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guardian'))] của tôi, [guardian.GetFirstName], bảo tôi nên chơi với những đứa trẻ khác. Nhưng chúng ồn ào quá! Phải yên tĩnh thì tôi mới nghe được suy nghĩ của mình!"
  child_personality.3009.a:1 "Có quá nhiều thứ để suy ngẫm..."

  child_personality.3009.message:0 "[ROOT.Char.Custom2('RelationToMe',personality_child)] của ta, [personality_child.GetTitledFirstName], thường chìm trong suy nghĩ!"

  child_personality.3010.t:1 "Chìm Trong Suy Nghĩ"
  child_personality.3010.desc:1 "[ROOT.GetCharacter.Custom2('RelationToMe' , personality_child)] của ta, [personality_child.GetTitledFirstName], là một đứa trẻ hiếm khi thấy kích động. Khi những đứa trẻ khác chơi những trò náo nhiệt, [personality_child.GetFirstNameNoTooltip] thường lặng lẽ rút vào một góc yên tĩnh. [personality_child.GetSheHe|U] không nói nhiều, nhưng ta biết [personality_child.GetSheHe] luôn suy nghĩ về điều gì đó."
  child_personality.3010.a:1 "Không biết trong đầu [personality_child.GetHerHis] đang nghĩ gì?"


