l_english:
 childhood.0002.t:0 "Buổi Chơi Chung"
 childhood.0002.opening:0 "[crush.GetTitledFirstName] thật sự rất vui khi ở bên!\n\n"
 childhood.0002.loud:0 "[crush.GetSheHe|U] thường đòi hỏi rất nhiều sự chú ý, nhưng ta không bận tâm. Mỗi lần ta gặp [crush.GetHerHim], ngày của ta lại trở nên tốt đẹp hơn!"
 childhood.0002.quiet:0 "[crush.GetSheHe|U] phần lớn thời gian đều hơi nhút nhát, nhưng [crush.GetSheHe] vẫn khiến mọi khoảnh khắc ta nhìn thấy ngài trở nên thật đặc biệt!"
 childhood.0002.fallback:0 "Mỗi lần ta gặp [crush.GetHerHim], ngày của ta lại trở nên tốt đẹp hơn, và ta ước gì chúng ta có thể chơi cùng nhau mọi lúc."
 childhood.0002.end:1 "\n\nMỗi khi ánh mắt chúng ta chạm nhau, bụng ta lại rộn ràng như có bướm bay... Ôi, ta tự hỏi liệu [crush.GetSheHe] có thích bông [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')] này mà ta tìm thấy không?"
 childhood.0002.a:1 "Bông hoa này là dành cho ngươi, [crush.GetFirstNameNoTooltip]!"
 childhood.0002.b:0 "Không... chúng ta chỉ nên làm bạn thôi."
 crush_returned:0 "[crush.GetFirstNameNoTooltip] cũng thích ngươi!"
 crush_crushed:0 "[crush.GetFirstNameNoTooltip] chỉ muốn làm bạn..."

 childhood.0004.t:0 "Tình Bạn Nảy Nở"
 childhood.0004.desc1:0 "Dạo gần đây ta chơi với [friend.GetTitledFirstName] rất nhiều. Hôm nọ [friend.GetSheHe] thậm chí còn cho ta mượn [friend.GetHerHis] [friend.Custom('child_favorite_toy')] yêu thích! Chúng ta thật sự rất hợp nhau, và chơi với nhau rất vui!"
 childhood.0004.desc2:0 "[friend.GetTitledFirstName] và ta gần đây dành rất nhiều thời gian bên nhau, trò chuyện và vui đùa. Thật sự rất vui!"
 childhood.0004.desc3:0 "Gần đây ta dành rất nhiều thời gian với [friend.GetFirstName]."
 childhood_0004.desc3_rowdy:0 "[friend.GetSheHe|U] lúc nào cũng bày ra trò gì đó, và thời gian chúng ta ở bên nhau chưa bao giờ nhàm chán!"
 childhood_0004.desc3_curious:0 "[friend.GetSheHe|U] biết mọi chuyện xảy ra trong triều đình, nên những cuộc trò chuyện của chúng ta chẳng bao giờ nhàm chán!"
 childhood_0004.desc3_charming:0 "Không ai khiến ta cười nhiều như [friend.GetSheHe]!"
 childhood_0004.desc3_pensive:0 "[friend.GetSheHe|U] luôn đặt ra những câu hỏi đúng lúc, tìm ra sự thật trong mọi cuộc trò chuyện. Ta chưa bao giờ thấy chán khi ở bên [friend.GetHerHim]!"
 childhood_0004.desc3_bossy:0 "[friend.GetSheHe|U] luôn biết chính xác chúng ta nên làm gì khi gặp nhau, và ta chưa bao giờ thấy chán khi ở bên [friend.GetHerHim]!"
 childhood_0004.desc3_fallback:0 "Chúng ta luôn vui vẻ bên nhau, dù là chơi trò yêu thích hay chỉ đơn giản là trò chuyện!"
 childhood.0004.a:0 "[friend.GetSheHe|U] là một người bạn tuyệt vời!"
 childhood.0004.b:0 "Ta thật sự thích chơi với [friend.GetHerHim]!"
 childhood.0004.c:0 "Thật khó tìm được người bạn nào tốt hơn [friend.GetHerHim]!"
 childhood.0004.a_alt:0 "Hãy thề một lời thề — làm bạn #EMP mãi mãi!#!"
 childhood.0004.c_alt:0 "Ngươi đúng là #EMP đồ ngốc#! khi tin ta, #EMP [child.Custom2('InsultNoun', ROOT.Char)]!#!"
 childhood.0004.d:0 "...ngươi muốn lấy lại [friend.Custom('child_favorite_toy')] #EMP sao#!? Không đời nào!"

 childhood.0006.t:0 "Sự Quấy Rầy Không Mong Muốn"
 childhood.0006.opening:0 "[bully.GetTitledFirstName] đã làm phiền ta suốt một thời gian dài.\n\n"
 childhood.0006.mean:0 "[bully.GetSheHe|U] thật tàn nhẫn, chế giễu ta và xô đẩy ta khắp nơi."
 childhood.0006.loud:0 "Nhiều đứa trẻ khác đều lắng nghe [bully.GetHerHim], và [bully.GetSheHe] dùng ảnh hưởng của mình để xoay chuyển chúng chống lại ta."
 childhood.0006.quiet:0 "[bully.GetSheHe|U] thường không ai để ý, chỉ bắt nạt ta khi không có ai nhìn."
 childhood.0006.nice:0 "[bully.GetSheHe|U] khiến ai cũng tin rằng ngài là một vị thánh, nhưng lại không ngừng chế giễu ta vì mọi sai lầm nhỏ nhặt nhất."
 childhood.0006.fallback:0 "[bully.GetSheHe|U] luôn tìm mọi cơ hội để nhìn ta với ánh mắt khinh miệt và chế nhạo ta."
 childhood.0006.toy:0 "Không chỉ vậy... [bully.GetSheHe] còn làm hỏng [ROOT.Char.Custom('child_favorite_toy')] yêu thích của ta, cái #EMP [bully.Custom2('InsultNoun', ROOT.Char)]!#! đó!"
 childhood.0006.end:0 "Dù ta làm gì đi nữa, ta cũng không thể khiến [bully.GetHerHim] dừng lại!"
 childhood.0006.a:0 "[bully.GetSheHe|U] thật đáng ghét!"
 childhood.0006.b:0 "Grrr... ta sẽ đánh ngươi đến không còn biết trời đất!"
 childhood.0006.b.critical_success:0 "Ngươi đánh [bully.GetHerHim] đến chết"
 childhood.0006.b.success:0 "Ngươi đánh [bully.GetHerHim] và [bully.GetSheHe] để ngươi yên"
 childhood.0006.b.failure:0 "[bully.GetSheHe|U] đánh bại ngươi"
 childhood.0006.b.critical_failure:0 "[bully.GetSheHe|U] đánh ngươi rất nặng"
 childhood.0006.b.death:0 "[bully.GetSheHe|U] đánh ngươi #EMP đến chết#!"
 childhood.0006.c:0 "Này, ta trả ngươi năm vàng để ngươi biến đi."
 childhood.0006.c_leave:0 "[bully.GetSheHe|U] #EMP không#! chịu biến đi"

 childhood.0008.t:0 "Kiểm Soát Cơn Giận"
 childhood.0008.desc:0 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('victim'))] của ta, [victim.GetTitledFirstName], đang khiến ta phát bực.\n\n"
 childhood.0008.mean:0 "[victim.GetSheHe|U] luôn tìm cơ hội chọc tức ta, dường như thích thú với sự khó chịu và đau đớn mà [victim.GetSheHe] gây ra."
 childhood.0008.loud:0 "[victim.GetSheHe|U] cứ luyên thuyên mãi không thôi, chẳng cần biết chủ đề là gì hay ta đã nói với ngài rằng ta chẳng hề hứng thú. Chẳng bao giờ dứt được!"
 childhood.0008.quiet:0 "Ta đã cố khiến [victim.GetHerHim] nói chuyện, bày tỏ ý kiến, nói #EMP điều gì đó#!...! Nhưng dù ta làm gì, [victim.GetSheHe] chỉ càng thu mình lại. Có chuyện gì với [victim.GetHerHim] vậy?!"
 childhood.0008.nice:0 "[victim.GetSheHe|U] lúc nào cũng #EMP là người tốt#!, rao giảng hết đức hạnh này đến đức hạnh khác. Những bài giảng không ngừng của [victim.GetHerHis|U] đang gây ra tác dụng ngược với ta..."
 childhood.0008.fallback:0 "[victim.GetSheHe|U] luôn cản đường ta, ngài luôn nói về những điều tẻ nhạt nhất, và ngài luôn luôn thốt ra những lời sai trái trong mọi cuộc đối thoại..."
 childhood.0008.a:1 "Thế này sẽ dạy cho [victim.GetHerHim] một bài học vì đã quá phiền phức!"
 childhood.0008.b:1 "Lần tới gặp nhau, ta sẽ #EMP cố#! tử tế..."
 childhood.0008.c:0 "Ôi, ta #EMP ghét#! [victim.GetHerHim] biết bao! [victim.GetSheHe|U] tốt hơn hết là... chết đi."

 childhood.0009.t:0 "Những Trò Ác Trẻ Con"
 childhood.0009.opening:0 "Cuối cùng cũng có thể đặt [victim.GetFirstName] vào đúng vị trí của [victim.GetHerHis] khiến tâm trạng ta tốt hơn nhiều.\n\n"
 childhood.0009.desc1:0 "Một trong những trò ta thích nhất là xem ta có thể chọc [victim.GetHerHim] bao nhiêu lần trước khi [victim.GetSheHe] chịu hết nổi!"
 childhood.0009.desc2:0 "Ta bắt đầu đi theo [victim.GetHerHim] khắp nơi, chỉ trích từng hành động của [victim.GetHerHis] càng to càng tốt."
 childhood.0009.desc3:0 "Ta đã mượn [victim.Custom('child_favorite_toy')] yêu thích của ngài, và giờ [victim.GetSheHe] phải nghe theo những gì ta bảo ngài làm!"
 childhood.0009.fallback:0 "Ta tình cờ tìm thấy [victim.GetHerHis] [victim.Custom('child_favorite_toy')] yêu thích, và việc giấu nó đi rồi nhìn [victim.GetHerHim] tuyệt vọng tìm kiếm chính là niềm vui lớn nhất tuần này của ta!"
 childhood.0009.a:0 "Tất cả chỉ là cho vui thôi!"

 childhood.0012.t:0 "Sự Quan Tâm Nhận Được"
 childhood.0012.desc:0 "Hôm nọ khi ta chơi với [crush_holder.GetTitledFirstName], [crush_holder.GetSheHe] đối xử với ta đặc biệt chu đáo. Ta chưa từng cảm thấy như thế này với [crush_holder.GetHerHim] trước đây, nhưng có lẽ ta bắt đầu xem [crush_holder.GetHerHim] hơn cả một người bạn."
 childhood.0012.a:0 "[crush_holder.GetTitledFirstNameNoTooltip], ta nghĩ ta thích ngươi!"
 childhood.0012.b:0 "[crush_holder.GetTitledFirstNameNoTooltip] chỉ là bạn."

 childhood.0013.t:0 "Những Tương Tác Thân Thiện"
 childhood.0013.desc:0 "Gần đây ta và [child.GetTitledFirstName] dành rất nhiều thời gian bên nhau.\n\n"
 childhood.0013.desc1:0 "Hôm nọ ta thậm chí còn cho [child.GetHerHim] mượn [child.Custom('child_favorite_toy')] yêu thích của ta! Chúng ta thật sự rất hợp nhau và chơi rất vui!"
 childhood.0013.desc2:0 "[child.GetTitledFirstName] và ta gần đây dành rất nhiều thời gian trò chuyện và vui đùa cùng nhau. Thật sự rất vui!"
 childhood.0013.desc3:0 ""
 childhood.0013.desc3_rowdy:0 "[child.GetSheHe|U] luôn chịu đựng những trò nghịch của ta và theo ta trong mọi cuộc phiêu lưu, nên thời gian chúng ta bên nhau chưa bao giờ nhàm chán!"
 childhood.0013.desc3_curious:0 "[child.GetSheHe|U] rất giỏi lắng nghe mọi lời đồn và chuyện thì thầm ta nghe được trong triều đình, rồi đưa ra những nhận xét sâu sắc."
 childhood.0013.desc3_charming:0 "Không ai cười những trò đùa của ta nhiều như [child.GetSheHe]!"
 childhood.0013.desc3_pensive:0 "[child.GetSheHe|U] luôn trân trọng sự bầu bạn của ta, lắng nghe suy nghĩ của ta và trò chuyện với ta thật lâu."
 childhood.0013.desc3_bossy:0 "[child.GetSheHe|U] luôn làm theo sự dẫn dắt của ta, ta chưa bao giờ thấy chán khi ở bên [child.GetHerHim]!"
 childhood.0013.desc_fallback:0 "[child.GetSheHe|U] luôn là người vui vẻ khi ở cạnh, dù là chơi đùa hay bàn chuyện!"
 childhood.0013.desc_end:0 "Ta thật sự thích ở bên [child.GetHerHis], và ta nghĩ hai chúng ta sẽ thân thiết trong một thời gian rất dài."
 childhood.0013.a:0 "Ta thật vui vì chúng ta quen biết nhau!"

 childhood.0910.t:0 "Nỗi Dày Vò Không Dứt"
 childhood.0910.opening:0 "Những điều mà [bully.GetTitledFirstName] đã khiến ta phải chịu đựng khi còn nhỏ vẫn nặng nề đè lên tâm trí ta."
 childhood.0910.desc1:0 "Những ánh nhìn, những tràng cười nhạo, và cả nỗi đau... Mỗi khi ta nhìn thấy [bully.GetHerHim], tâm trạng ta lập tức trở nên u ám.\n\n[bully.GetSheHe|U] có thể đã trưởng thành, nhưng ta biết rằng [bully.GetSheHe] sẽ chẳng bao giờ trở thành một con người tử tế!"
 childhood.0910.desc2:0 "\n\nĐôi khi ta vẫn còn nghe thấy tiếng cười chế giễu của [bully.GetHerHis] khi [bully.GetSheHe] giẫm nát [ROOT.Char.Custom('child_favorite_toy')] yêu quý của ta xuống đất."
 childhood.0910.a:0 "Ta sẽ không bao giờ tha thứ cho [bully.GetHerHim]!"

 childhood.0911.t:0 "Những Trò Ngông Cuồng Thời Thơ Ấu"
 childhood.0911.desc_rival:0 "[victim.GetTitledFirstName] giờ đã trưởng thành, nhưng điều đó không có nghĩa là [victim.GetSheHe] đã tha thứ cho những gì ta đã làm với [victim.GetHerHim] khi cả hai còn là trẻ con.\n\nThật ra cũng chẳng sao, bởi lòng thù hận ta dành cho [victim.GetHerHim] cũng lớn lên theo năm tháng!"
 childhood.0911.opening:0 "Không biết [victim.GetTitledFirstName] còn nhớ những điều ta đã làm với [victim.GetHerHim] khi cả hai còn nhỏ hay không."
 childhood.0911.desc1:0 "\n\nNhưng giờ khi [victim.GetSheHe] đã lớn lên, ta cũng phải bỏ lại những trò trẻ con ấy phía sau và tập trung vào những việc khác."
 childhood.0911.desc2:0 "Ta sẽ luôn nhớ khuôn mặt kinh hoàng của ngài khi ta phá hủy [victim.GetHerHis] [victim.Custom('child_favorite_toy')], thật là buồn cười!\n\nTuy nhiên, giờ đây khi [victim.GetSheHe] đã lớn khôn, ta cần phải bỏ lại những thú vui trẻ con đó và tập trung vào những việc khác."
 childhood.0911.a:0 "Hẹn gặp lại, [victim.GetTitledFirstNameNoTooltip]."

 childhood.0998.t:0 "Những Cảm Xúc Trưởng Thành"
 childhood.0998.desc:0 "Ta vẫn nhớ rất rõ những khoảng thời gian vui vẻ mà ta đã chia sẻ cùng [crush.GetTitledFirstName] khi còn nhỏ.\n\n[crush.GetSheHe|U] sẽ luôn là người thân thiết với ta, dù khi chúng ta trưởng thành giữa chúng ta có xảy ra chuyện gì hay không!"
 childhood.0998.a:0 "Ta thật may mắn khi được quen biết [crush.GetHerHim]."

 childhood.0999.t:0 "Những Cảm Xúc Trưởng Thành"
 childhood.0999.desc:1 "Ta vẫn nhớ rất rõ những khoảng thời gian vui vẻ mà ta đã chia sẻ cùng [root_crush.GetTitledFirstName] khi cả hai còn nhỏ.\n\nDù giờ đây [root_crush.GetSheHe] đã bước vào thế giới của người lớn, [root_crush.GetSheHe] vẫn sẽ luôn là người thân thiết với ta!"
 childhood.0999.desc_unrequited:1 "Dù rằng [root_crush.GetSheHe] chưa bao giờ đáp lại tình cảm của ta..."
 childhood.0999.a:1 "Ta thật may mắn khi được quen biết [root_crush.GetHerHim]."

 childhood.1000.t:0 "Một Tình Bạn Sâu Sắc"
 childhood.1000.desc:0 "[friend_to_crush.GetTitledFirstName] là một người bạn thật sự rất tốt! \n\nMỗi khi chúng ta ở bên nhau, ta luôn cảm thấy vui vẻ, và [friend_to_crush.GetSheHe] hiểu ta hơn bất kỳ ai khác. \n\nDù chúng ta là những người bạn thân thiết như vậy, đôi khi ta tự hỏi liệu ta có muốn nhiều hơn từ mối quan hệ này..."
 childhood.1000.a:0 "Ta nghĩ mình thích [friend_to_crush.GetHerHim] hơn cả một người bạn!"
 childhood.1000.c:1 "[friend_to_crush.GetSheHe|U] chỉ là bạn, không hơn!"
 childhood.1000.b:0 "Ta mang cho ngươi [friend_to_crush.Custom('FavoriteTreatDemand')]... ngươi có muốn nắm tay không?"
 sweet_opinion:0 "Rất Ngọt Ngào"
 crush_crushed_hard:0 "[crush.GetFirstNameNoTooltip] không còn muốn làm bạn nữa..."
 risks_childhood.1000:0 "Không thể biết [friend_to_crush.GetFirstNameNoTooltip] sẽ phản ứng thế nào..."

 childhood.1001.t:0 "Trận Quyết Định"
 childhood.1001.opening:0 "Sự hành hạ không ngừng mà [bully.GetTitledFirstName] gây ra cho ta phải chấm dứt! [bully.GetSheHe|U] chế giễu ta không thương tiếc, xô đẩy ta và làm ta bẽ mặt.\n\n"
 childhood.1001.desc:0 "Chuyện này không thể tiếp tục nữa! Đã đến lúc ta cho [bully.GetHerHim] thấy [bully.GetSheHe] đang gây chuyện với ai."
 childhood.1001.fallback:0 "Dù điều này khiến ta nặng nề trong lòng, ta vẫn bất lực không thể ngăn [bully.GetHerHim]!"
 childhood.1001.a:1 "Về chuyện ngươi vô lễ..."
 childhood.1001.a.success:0 "Ta dạy cho [bully.GetTitledFirstNameNoTooltip] một bài học"
 childhood.1001.a.failure:0 "[bully.GetTitledFirstNameNoTooltip] đánh bại ta"
 childhood.1001.b:0 "Chúng ta cần nói chuyện về cách ngươi cư xử..."
 childhood.1001.b.success:0 "Ta thuyết phục được [bully.GetTitledFirstNameNoTooltip] ngừng bắt nạt ta"
 childhood.1001.c:0 "Khốn kiếp ngươi, [bully.GetTitledFirstNameNoTooltip]."
 childhood.1001.d:0 "[adult_friend.GetFirstNameNoTooltip], ngươi là người lớn – xin hãy giúp ta!"

 childhood.1002.t:0 "[guardian_parent.Custom('MotherFather')|U] Quan Tâm"
 childhood.1002.desc1:0 "Ái! Khi đang chơi trong vườn cùng [friend.GetTitledFirstName], ta trượt ngã và trầy đầu gối. [guardian_parent.Custom('MotherFather')] của ta đang ở phía bên kia sân tận hưởng thời tiết đẹp, và [friend.GetTitledFirstName] bảo ta đến gặp [guardian_parent.GetHerHim]."
 childhood.1002.desc2:0 "Ái! Khi đang chơi với [ROOT.Char.Custom('child_favorite_toy')] của mình, ta trượt ngã và trầy đầu gối. Vừa đứng dậy thì [guardian_parent.Custom('MotherFather')] của ta đi ngang qua con đường bên cạnh, hỏi ta có sao không."
 childhood.1002.desc2_add:0 "\n\n\"Hãy dũng cảm lên, [ROOT.Char.Custom('GetDaughterSon')].\" [guardian_parent.GetSheHe|U] nói. \"Sẽ ổn thôi, ta ở đây để giúp — chỉ cần nghe lời ta, ngươi sẽ biết cách tránh chuyện này lần sau.\""
 childhood.1002.desc3:0 "Khi ta đang cố đọc sâu hơn vào cuốn sách được giao để học, ta nhận ra mình không thể hiểu hết những ý nghĩa tinh tế của nó. \n\nChẳng bao lâu nữa ta phải trình bày nội dung với [guardian_parent.Custom('MotherFather')] của mình, nhưng nếu tiếp tục tự mình tìm hiểu, ta có thể mắc kẹt với cuốn sách này cả đêm."
 childhood.1002.a:0 "[guardian_parent.Custom('MotherFather')|U], xin hãy giúp ta!"
 childhood.1002.b:0 "Ta có thể tự xoay xở."
 childhood.1002.b_1:0 "Mọi chuyện không suôn sẻ"
 childhood.1002.b_2:1 "Ngươi làm rất tốt"

 childhood.1003.t:0 "Những Đau Đớn Khi Trưởng Thành"
 childhood.1003.desc1:0 "Ta đang tận hưởng thời tiết và lắng nghe tiếng cười của [child.Custom('GetDaughterSon')] [child.GetTitledFirstName] và người bạn [friend.GetTitledFirstName] của con, thì đột nhiên ta thấy [child.GetTitledFirstName] ngã và làm bị thương đầu gối. [child.GetSheHe|U] tiến lại phía ta sau khi được bạn mình thúc giục, và cầu xin sự giúp đỡ của ta để chữa trị vết thương."
 childhood.1003.desc2:0 "Ta đang dạo trong vườn, tận hưởng thời tiết, thì thấy [child.Custom('GetDaughterSon')] [child.GetTitledFirstName] ngã và trầy đầu gối khi đang chơi với [child.GetHerHis] [child.Custom('child_favorite_toy')]. Khi ta tiến lại gần hỏi xem có ổn không, con đã cầu xin ta giúp chữa trị vết thương."
 childhood.1003.desc3:0 "Ta đã đặt ra một nhiệm vụ khắt khe cho [child.Custom('GetDaughterSon')] [child.GetTitledFirstName], yêu cầu con đọc một cuốn sách phức tạp chỉ trong vài ngày. Vào buổi tối trước khi con phải trình bày với ta, con đã đến và cầu xin sự giúp đỡ."
 childhood.1003.a:0 "Ta rất vui vì [child.GetSheHe] có thể dựa vào ta!"

 childhood.1004.t:0 "Một Tâm Trí Mệt Mỏi"
 childhood.1004.desc:1 "\"Ngươi có ngủ đủ không?\"\n\nCâu hỏi lo lắng của [guardian_parent.Custom('MotherFatherPossessive')] khiến ta nhận ra rằng gần đây ta ngủ không ngon. Áp lực phải làm tốt mọi nhiệm vụ khiến ta quên cả việc nghỉ ngơi.\n\n[guardian_parent.GetSheHe|U] bảo ta nghỉ tối nay và đi ngủ sớm, và ta vui vẻ chấp nhận."
 childhood.1004.a:0 "Cảm ơn ngài, [guardian_parent.Custom('MotherFather')]."
 childhood.1004.b:0 "Cơ hội hoàn hảo để đọc sách trên giường!"
 childhood.1004.c:0 "Ta sẽ thức khuya làm quà cho [guardian_parent.Custom('MotherFather')]!"

 childhood.1005.t:0 "Một Tâm Trí Mệt Mỏi"
 childhood.1005.desc:1 "\"Ngươi đã làm gì với toàn bộ thời gian của mình?!\"\n\nLời trách móc của [guardian_parent.Custom('MotherFatherPossessive')] đè nặng trong tâm trí ta. Ta đã cố hoàn thành mọi nhiệm vụ được giao, nhưng dường như [guardian_parent.GetSheHe] chưa bao giờ hài lòng."
 childhood.1005.a:0 "Ta sẽ cố làm tốt hơn!"
 childhood.1005.b:0 "Ta đã cố hết sức rồi."
 childhood.1005.c:0 "#EMP Ngài không thể ra lệnh cho ta, [guardian_parent.Custom('MotherFather')]!#!"

 childhood.1006.t:0 "Khi Hai Thái Cực Va Chạm"
 childhood.1006.desc:0 "[guardian_parent.Custom('MotherFather')] của ta không bao giờ để ta được yên nữa. Kể từ khi ngài quyết định rằng ta không đủ siêng năng, ngài đã tự mình đảm nhận việc không bao giờ để ta được thư giãn nữa.\n\n[guardian_parent.GetSheHe|U] thậm chí còn phàn nàn ngay khi ta cố lẻn đi chợp mắt một lát!"
 childhood.1006.a:0 "[guardian_parent.Custom('MotherFather')|U] chẳng bao giờ hài lòng!"
 childhood.1006.b:0 "Ta đoán mình sẽ cố gắng..."
 childhood.1006.c:0 "ZZZzzz#DIE1 zzz#!#DIE2 zzz...#!"

 childhood.1007.t:0 "Bóng Đen Lớn Dần"
 childhood.1007.opening:0 "[bully.GetTitledFirstName] thật là phiền phức!\n\n"
 childhood.1007.young_malicious:0 "Ta đang chơi với [ROOT.Char.Custom('child_favorite_toy')] yêu quý của mình thì [bully.GetSheHe] xông vào phòng và giật lấy [ROOT.Char.Custom('child_favorite_toy')] khỏi tay ta."
 childhood.1007.young_extroverted:0 "[bully.GetSheHe|U] lúc nào cũng bịa chuyện về ta với những đứa trẻ khác, khiến chúng dần ghét ta."
 childhood.1007.young_dominant:0 "Khi ta đang chơi trong vườn cùng những đứa trẻ khác, [bully.GetSheHe] đột nhiên đến và ra lệnh cho tất cả ngừng chơi với ta."
 childhood.1007.young_emotional:0 "Ta chỉ vừa đi ngang qua [bully.GetHerHim] trong hành lang thì đột nhiên [bully.GetSheHe] khóc ầm lên, nói rằng ta đã đánh [bully.GetHerHim]."
 childhood.1007.malicious:0 "Ta đang đi dạo trong vườn thì đột nhiên [bully.GetSheHe] từ bụi cây bước ra và xô ta ngã xuống bùn. [bully.GetSheHe|U] thậm chí còn cười suốt lúc đó."
 childhood.1007.dominant:0 "[bully.GetSheHe|U] dường như đã ra lệnh cho những đứa trẻ khác tránh xa ta, và giờ mỗi khi ta đến gần chúng đều im bặt. Ta biết đó là lỗi của [bully.GetHerHis], và bọn trẻ khác không cố ý, nhưng vẫn khiến ta đau lòng."
 childhood.1007.extroverted:0 "Mỗi khi có cơ hội, [bully.GetSheHe] đều cố hết sức để thuyết phục những đứa trẻ khác rằng ta là một kẻ tồi tệ. [bully.GetSheHe|U] nói dối và thêu dệt những câu chuyện, và chỉ mình ta biết đó chẳng phải sự thật."
 childhood.1007.fallback:0 "Khi ta bước qua, [bully.GetSheHe] đột nhiên đưa chân ra và làm ta vấp ngã!"
 childhood.1007.end:0 "\n\n[bully.GetSheHe|U] không chịu để ta yên, ta không biết phải làm gì."
 childhood.1007.a:0 "[bully.GetSheHe|U] thật tệ hại!"
 childhood.1007.b:0 "[bully.GetFirstNameNoTooltip|U] #EMP hẳn#! phải hiểu lý lẽ!"
 childhood.1007.b.success:0 "[bully.GetSheHe|U] cuối cùng cũng biết lý lẽ"
 childhood.1007.b.failure:0 "[bully.GetSheHe|U] càng bắt nạt dữ hơn"
 childhood.1007.c:0 "*#DIE1 Lẩm bẩm#! #DIE2 lẩm bẩm*#! Ta sẽ trút giận lên [victim.GetFirstNameNoTooltip]..."
 childhood.1007.d:0 "Không. #EMP Chính ta sẽ là kẻ bắt nạt.#!"
 childhood.1007.d.success:0 "Ngươi lật ngược tình thế với [bully.GetFirstNameNoTooltip]"
 childhood.1007.d.failure:0 "[bully.GetFirstNameNoTooltip] không chịu nhượng bộ"
 childhood.1007.c.toast:0 "[child.GetFirstNameNoTooltip] bắt nạt ngươi"

 childhood.1008.t:0 "Cách Xả Stress Kỳ Lạ"
 childhood.1008.opening:0 "[victim.GetTitledFirstName] cuối cùng cũng có ích cho việc gì đó!\n\nDạo này cuộc sống khá căng thẳng, nhưng [victim.GetSheHe] đã giúp ta thư giãn phần nào.\n\n"
 childhood.1008.1:0 "Ta gặp [victim.GetHerHim] trong hành lang, và khi [victim.GetSheHe] đi ngang qua ta, ta thò chân ra làm [victim.GetHerHim] vấp ngã. Biểu cảm trên mặt [victim.GetHerHis] thật vô giá!"
 childhood.1008.2:0 "Mỗi khi chúng ta trò chuyện, ta cố ý chất vấn mọi điều [victim.GetSheHe] nói và chế giễu kết luận của [victim.GetSheHe]."
 childhood.1008.3:0 "Ngay khi [victim.GetSheHe] chuẩn bị cắn miếng bánh mì vào bữa sáng, ta đập mạnh vào lưng [victim.GetHerHim]. Bàn ăn trở nên bừa bộn thật ghê, nhưng âm thanh [victim.GetSheHe] phát ra thì cực kỳ buồn cười!"
 childhood.1008.a:0 "Xả giận như vậy thật dễ chịu!"
 childhood.1008.b:0 "Hay là tiếp theo đánh cho một trận!"
 childhood.1008.c:0 "[extra_bully.GetFirstNameNoTooltip]! Giúp ta trêu chọc cái [victim.Custom2('InsultAdjective', ROOT.Char)] [victim.Custom2('InsultNoun', ROOT.Char)] này!"

 childhood.1009.t:0 "Sự Quan Tâm Của Một Người Bạn"
 childhood.1009.opening:0 "[friend.GetTitledFirstName] là một người bạn tốt. [friend.GetSheHe|U] nhận ra rằng có điều gì đó đang khiến ta phiền lòng, và [friend.GetSheHe] thuyết phục ta chia sẻ suy nghĩ với [friend.GetHerHim].\n\n"
 childhood.1009.1:0 "\"Rốt cuộc chúng ta tồn tại để làm gì? Kế hoạch của [ROOT.Char.GetFaith.FateGodNamePossessive] dành cho tất cả chúng ta là gì?\""
 childhood.1009.2:0 "\"Khi lớn lên, rốt cuộc ta sẽ trở thành người như thế nào?\""
 childhood.1009.3:0 "\"Làm sao biết được tình cảm của ai đó dành cho mình là thật lòng?\""
 childhood.1009.end:0 "\n\nChỉ cần nói chuyện với [friend.GetHerHim] thôi cũng đã khiến ta cảm thấy khá hơn!"
 childhood.1009.a:0 "Ta thật may mắn khi có một người bạn tốt như vậy."
 childhood.1009.b:0 "Ngươi thật tốt bụng, ta muốn tặng ngươi [ROOT.Char.Custom('child_favorite_toy')] của ta!"
 gave_toy_opinion:0 "Được Tặng Đồ Chơi"
 childhood.1009.c:0 "Ngươi thật khôn ngoan, [friend.GetFirstNameNoTooltip]. Hãy nói thêm đi!"

 childhood.1010.t:0 "Luôn Ở Trong Tâm Trí Ta"
 childhood.1010.opening:0 "Ta không thể ngừng nghĩ về [crush.GetTitledFirstName], về nụ cười của [crush.GetSheHe] và cách [crush.GetSheHe] trò chuyện.\n\n"
 childhood.1010.returned:0 "Chỉ cần biết rằng tình cảm của ta được đáp lại cũng khiến ta vô cùng hạnh phúc và lòng ta trở nên nhẹ nhõm."
 childhood.1010.not_returned:0 "Việc [crush.GetSheHe] dường như không đáp lại tình cảm của ta khiến lòng ta nặng trĩu."
 childhood.1010.a:1 "Người yêu dấu của ta, [crush.GetTitledFirstNameNoTooltip]!"
 childhood.1010.b:0 "Ôi, thật đau khổ!"
 childhood.1010.c:0 "Tình yêu chỉ là dối trá... #EMP dối trá!#!"
 childhood.1010.d:0 "[crush.GetFirstNameNoTooltip], ta mang cho ngươi [ROOT.Char.Custom('SeductionGiftTypeIndefiniteSimple')]!"
 childhood.1010.d.effect:0 "Một món quà khác có thể làm tan chảy trái tim [crush.GetHerHis]... hoặc lại khiến trái tim ngươi tan vỡ"
 childhood.1010.e:0 "Ôi, trái tim ta rộn ràng vui sướng mỗi khi nhìn thấy ngươi!"
 hopeless_romantic_modifier:0 "Kẻ Lãng Mạn Tuyệt Vọng"
 hopeless_romantic_modifier_desc:0 "Nhân vật này tin tưởng mãnh liệt vào tình yêu và sự lãng mạn cung đình từ khi còn rất trẻ.\n[GetScheme('courting').GetTypeName] [success_chance|E]: #P +10%#!"

 childhood.1011.t:0 "Con Đường Của Trái Tim"
 childhood.1011.opening:0 "Ta nhận ra rằng gần đây [crush_returned.GetTitledFirstName] chú ý đến ta nhiều hơn, trân trọng cả những câu đùa và ý kiến của ta.\n\n"
 childhood.1011.returned:1 "Được trân trọng như vậy thật dễ chịu, và điều đó khiến ta nhận ra rằng [crush_returned.GetFirstNameNoTooltip] cũng thật đáng mến.\n\nTa nghĩ có lẽ ta cũng bắt đầu quan tâm đến [crush_returned.GetHerHim] giống như [crush_returned.GetSheHe] quan tâm đến ta!"
 childhood.1011.not_returned:0 "Dù sự quan tâm đó cũng dễ chịu, nhưng nó bắt đầu khiến ta khó chịu. Sao [crush_returned.GetSheHe] không để ta yên?"
 childhood.1011.a:1 "[crush_returned.GetFirstNameNoTooltip], ta nghĩ ta thích ngươi."
 childhood.1011.b:0 "[crush_returned.GetSheHe|U] đang khiến ta phát bực."
 childhood.1011.c:0 "Không, trái tim ta thuộc về [true_crush.GetFirstNameNoTooltip]!"
 heartbroken_opinion:0 "Tan Vỡ Trái Tim"

 childhood.1012.t:0 "Hình Phạt Khắc Nghiệt"
 childhood.1012.desc:0 "Ta biết dạo gần đây việc học của mình không tốt, và ta biết [guardian_parent.Custom('MotherFather')] thất vọng về ta. Nhưng ta chưa từng nghĩ rằng [guardian_parent.GetHerHim] lại đi xa đến mức lấy mất món đồ chơi yêu thích của ta, [ROOT.Char.Custom('child_favorite_toy')] thân yêu!\n\n"
 childhood.1012.desc_2:0 "\"Quẳng nó vào lò sưởi.\" [guardian_parent.Custom('MotherFather')|U] nói, ném nó vào ngọn lửa đang cháy. \"Có lẽ giờ con sẽ suy nghĩ lại việc làm một [ROOT.Char.Custom('GetDaughterSon')] vô dụng như vậy.\"\n\n"
 childhood.1012.desc2:0 "Điều tồi tệ nhất là [guardian_parent.GetSheHe] dường như chẳng hề quan tâm đến nỗi đau của ta."
 childhood.1012.desc3:0 "Điều tồi tệ nhất là [guardian_parent.GetSheHe] dường như còn thích thú trước nỗi đau của ta."
 childhood.1012.a:0 "[guardian_parent.GetSheHe|U] thật tàn nhẫn!"
 childhood.1012.b:0 "Làm... làm sao #EMP ngươi có thể!#! Ta ghét ngươi!"
 cruel_upbringing_modifier:0 "Tuổi Thơ Tàn Nhẫn"
 cruel_upbringing_modifier_desc:0 "Nhân vật này lớn lên trong sự nghi kỵ và tàn nhẫn."

 childhood.1013.t:0 "Sự Phá Hủy [victim.Custom('child_favorite_toy')|U]"
 childhood.1013.desc:0 "Ta thấy [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('victim'))] của ta, [victim.GetFirstName], đang chơi với [victim.Custom('child_favorite_toy')] của [victim.GetHerHis] trong vườn, vừa la hét vừa cười đùa.\n\n[victim.GetSheHe|U] đâu có quyền vui vẻ như vậy, và món [victim.Custom('child_favorite_toy')] ngu ngốc đó có gì đặc biệt chứ? Nó vỡ dễ như bao thứ khác khi ta giật nó khỏi tay [victim.GetHerHis] và đập nát."
 childhood.1013.a:0 "Phải nhìn thấy mặt [victim.GetHerHis] mới đáng giá!"
 childhood.1013.b:0 "Ta... ta không thể tin được mình đã làm gì... Ta đúng là một #EMP [ROOT.Char.Custom('GirlBoy')] hư hỏng#! mà!"

 childhood.1014.t:0 "Sự Phá Hủy [ROOT.Char.Custom('child_favorite_toy')|U]"
 childhood.1014.desc:0 "[bully.GetTitledFirstName], kẻ luôn hành hạ ta, đã phá hủy [ROOT.Char.Custom('child_favorite_toy')] quý giá của ta! Khi ta đang chơi, [bully.GetSheHe] bình thản bước đến, giật món đồ khỏi tay ta rồi giẫm nát nó dưới đất.\n\n\"Ai còn chơi [ROOT.Char.Custom('child_favorite_toy')] nữa chứ?\""
 childhood.1014.a:0 "[bully.GetSheHe|U] thật kinh khủng!"

 childhood.1015.t:0 "Giải Pháp Ngoại Giao"
 childhood.1015.desc:1 "Theo sự thúc ép của [educator.GetTitledFirstName], ta và [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('study_friend'))] của ta là [study_friend.GetFirstName] đã theo dõi các cuộc thương lượng đang diễn ra về việc vương quyền tham gia quản lý địa phương của [province.GetName].\n\nTrong lúc thảo luận, ta không khỏi nhận ra rằng [province_holder.GetTitledFirstName] chẳng hiểu gì về cách điều phối nỗ lực này, và vì ta đã nghiên cứu chủ đề này một thời gian nên có lẽ ta nên can thiệp."
 childhood.1015.a:0 "\"Nếu ngài chịu nghe ta một chút...\""
 childhood.1015.b:1 "Ta còn phải học nhiều – ta nên lắng nghe."
 childhood.1015.b.tt:2 "Điều này sẽ thúc đẩy việc học [diplomacy|E] của cả ngươi và [study_friend.GetFirstNamePossessiveNoTooltip]"
 childhood.1015.a.flavor:0 "Sao họ lại cười? Ý tưởng của ta #MP tuyệt vời#! mà!"

 childhood.1016.t:0 "Vấn Đề Quân Sự"
 childhood.1016.desc:0 "Ta và [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('study_friend'))] của ta là [study_friend.GetFirstName] đang quan sát binh lính diễn tập trận giả bên ngoài thị trấn như một phần việc học.\n\n\"Vòng ra và đánh vào sườn chúng!\" [commander.GetTitledFirstName] hét lên, và trước khi kịp nhận ra, ta đã bước lên một bước và thu hút sự chú ý của [commander.GetHerHis]."
 childhood.1016.a:0 "\"Thực ra ta nghĩ tấn công trực diện sẽ hiệu quả hơn.\""
 childhood.1016.b:1 "Ta xua tay với [commander.GetHerHim] – ta chỉ nên quan sát."
 childhood.1016.b.tt:1 "Điều này sẽ thúc đẩy việc học [martial|E] của cả ngươi và [study_friend.GetFirstNamePossessiveNoTooltip]"

 childhood.1017.t:0 "Vấn Đề Lúa Mì"
 childhood.1017.desc:2 "Cuộc thương lượng với [province_holder.GetTitledFirstName] của [province.GetName] về việc quản lý ngũ cốc của vùng đã kéo dài hàng giờ. [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('study_friend'))] của ta, [study_friend.GetFirstName], đã liếc nhìn ta suốt nửa giờ qua, như muốn nói ta không phải người duy nhất chịu khổ.\n\nKhi mọi người rời phòng nghỉ giải lao, ta thấy một cuốn sổ mở trên bàn của [province_holder.GetTitledFirstNamePossessive]. Những ghi chú về việc xử lý lúa mì viết kín trang, và chỉ cần thay đổi vài con số nhỏ thôi, ta có thể ảnh hưởng lớn đến sản lượng của vùng."
 childhood.1017.a:1 "Không biết thay đổi mấy con số này sẽ ra sao?"
 childhood.1017.a.tt:1 "Đôi khi người ta học từ sai lầm – điều này sẽ thúc đẩy việc học [stewardship|E] của cả ngươi và [study_friend.GetFirstNamePossessiveNoTooltip]"
 childhood.1017.b:0 "Tốt hơn nên để nguyên."

 childhood.1018.t:0 "Sự Việc Đáng Ngờ"
 childhood.1018.desc:0 "Nếu có một điều mà [educator.GetTitledFirstName] luôn cố nhồi vào đầu ta, thì đó là đôi khi lời nói dối là cần thiết.\n\nKhi ta và [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('study_friend'))] của ta là [study_friend.GetFirstName] nghe lén [province_holder.GetTitledFirstName] của [province.GetName] nói về việc sửa số liệu báo cáo thuế của [province_holder.GetHerHis] để vùng này có thể thịnh vượng hơn, ta chợt nhớ đến bài học của [educator.GetFirstNamePossessive]."
 childhood.1018.a:2 "Thông tin này cần đến tai [educator.GetFirstNameNoTooltip]!"
 childhood.1018.a.tt:2 "Điều này sẽ thúc đẩy việc học [intrigue|E] của cả ngươi và [study_friend.GetFirstNamePossessiveNoTooltip]"
 childhood.1018.b:0 "Họ #EMP thật sự#! cần số tiền đó."

 childhood.1019.t:0 "Đọc Hay Không Đọc"
 childhood.1019.desc:0 "Ta và [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('study_friend'))] của ta là [study_friend.GetFirstName] được giao nhiệm vụ mang một chồng sách đến cho các đại biểu từ [province.GetName]. Sự cám dỗ muốn dành vài phút — hay vài ngày — để nghiên cứu chúng gần như không thể cưỡng lại.\n\nViệc giao sách nhanh chóng được cho là cực kỳ quan trọng đối với năng suất của vùng chỉ càng làm tăng sự tò mò của chúng ta."
 childhood.1019.a:1 "Chúng ta sẽ đảm bảo những cuốn sách này được nghiên cứu #EMP thật kỹ#!."
 childhood.1019.a.tt1:1 "Điều này sẽ thúc đẩy việc học [learning|E] của cả ngươi và [study_friend.GetFirstNamePossessiveNoTooltip]"
 childhood.1019.a.tt2:1 "Điều này sẽ thúc đẩy việc học [stewardship|E] của cả ngươi và [study_friend.GetFirstNamePossessiveNoTooltip]"
 childhood.1019.b:1 "Những cuốn sách sẽ được giao đúng hạn!"


 childhood.2001.t:0 "Chú Mèo Con"
 childhood.2001.desc_educator:0 "Khi ta đang chơi dưới sự giám sát của [educator.GetTitledFirstNamePossessive], ta chợt nghe thấy một âm thanh. Nó nhỏ và yếu ớt, nhưng chắc chắn có!"
 childhood.2001.desc:0 "Khi ta đang chơi gần [ROOT.Char.Custom('TerrainType')] thì chợt nghe thấy một âm thanh. Nó nhỏ và yếu ớt, nhưng chắc chắn có!"
 childhood.2001.desc_ending:0 "\n\nTa tìm khắp mọi bụi cây, dưới mọi tảng đá, nhìn khắp mọi hướng và... đó rồi! Một chú mèo con bé xíu đang ngồi dưới bụi gai, hoàn toàn cô đơn."
 childhood.2001.a:0 "Giờ nó là mèo của ta!"
 childhood.2001.b:0 "[educator.GetTitledFirstNameNoTooltip] đôi khi trông thật cô đơn..."
 childhood.2001.c:0 "Không biết bên trong nó giấu gì...!"
 gift_of_cat_opinion:0 "Được Tặng Mèo"
 gift_of_dog_opinion:0 "Được Tặng Chó"

 childhood.2002.desc:1 "Ta đang ở bên ngoài với [ward.GetTitledFirstName] thì đột nhiên ngài biến mất. Nhưng trước khi ta kịp lo lắng, ngài đã chạy ùa trở lại, tay ôm chặt một chú mèo con!\n\n\"[educator.GetFirstNameNoTooltip], [educator.GetFirstNameNoTooltip]! Nhìn xem con tìm được gì này. Một món quà dành cho ngài!\""
 childhood.2002.a:0 "Cảm ơn con!"
 childhood.2002.b:0 "Ew, đặt nó lại chỗ con tìm thấy."
 childhood.2002.c:0 "Ồ, con tìm thấy #EMP món quà của ta#! dành cho #EMP con#! sao!! Và chúng ta giải quyết các khoản nợ như thế nào nhỉ?"
 childhood.2002.d:0 "Cuối cùng cũng có thứ để tra tấn!"

 childhood.2003.t:0 "Chú Chó Con"
 childhood.2003.desc_educator:0 "Ta đang đi dạo cùng [educator.GetTitledFirstName] thì nghe thấy nó. Một âm thanh rất nhỏ, yếu ớt và sợ hãi."
 childhood.2003.desc_friend:0 "Ta đang chơi với [friend.GetTitledFirstName] thì nghe thấy nó. Một âm thanh rất nhỏ, yếu ớt và sợ hãi."
 childhood.2003.desc:0 "Ta đang chơi thì nghe thấy nó. Một âm thanh rất nhỏ, yếu ớt và sợ hãi."
 childhood.2003.desc_ending:0 "\n\nTa tìm khắp nơi — dưới mọi tảng đá, quanh mọi góc, sau mọi bụi cây — và cuối cùng tìm thấy nó! Một chú chó con nhỏ bé, cô độc, đang ngồi giữa hai tảng đá."
 childhood.2003.a:0 "Giờ nó là chó của ta!"
 childhood.2003.b:1 "Này, [friend.GetFirstNameNoTooltip], cầm lấy đi."
 childhood.2003.c:0 "[educator.GetTitledFirstNameNoTooltip] đôi khi trông thật cô đơn..."
 childhood.2003.d:0 "Không biết bên trong nó giấu gì...!"

 childhood.2004.desc:1 "Ta đang ở bên ngoài với [ward.GetTitledFirstName] thì đột nhiên ngài biến mất. Nhưng trước khi ta kịp lo lắng, ngài đã chạy ùa trở lại, tay ôm chặt một chú chó con!\n\n\"[educator.GetFirstNameNoTooltip], [educator.GetFirstNameNoTooltip]! Nhìn xem con tìm được gì này. Một món quà dành cho ngài!\""

 childhood.2005.desc:0 "Ta đang chơi với [ward.GetTitledFirstName] thì [ward.GetSheHe] đột nhiên biến mất vào [ROOT.Char.Custom('TerrainType')]. [ward.getSheHe] đi đâu rồi? Ta quay vòng tìm kiếm thì bất ngờ [ward.GetSheHe] xuất hiện lại, đưa một chú chó con nhỏ về phía ta.\n\n\"[friend.GetFirstNameNoTooltip]! Cho ngươi đấy!\""
 childhood.2005.a:0 "Một chú chó con!!!"
 childhood.2005.b:0 "Ew, cất nó đi."

 childhood.2006.desc:0 "Ta đang chơi với [ward.GetTitledFirstName] thì [ward.GetSheHe] đột nhiên biến mất vào [ROOT.Char.Custom('TerrainType')]. [ward.getSheHe] đi đâu rồi? Ta quay vòng tìm kiếm thì bất ngờ [ward.GetSheHe] xuất hiện lại, đưa một chú mèo con nhỏ về phía ta.\n\n\"[friend.GetFirstNameNoTooltip]! Cho ngươi đấy!\""
 childhood.2006.a:0 "Một chú mèo!!!"
 childhood.2006.b:0 "Ew, cất nó đi."

 childhood.2010.t:0 "Kỳ Vọng"
 childhood.2010.desc_opening:0 ""Ngài luôn ở đó vì ta, và ta hy vọng ngài biết rằng ta rất biết ơn."\n\n"
 childhood.2010.desc_shy:0 "[ward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến đến gần ta trong một lần hiếm hoi thể hiện sự can đảm và cởi mở."
 childhood.2010.desc_mean:0 "[ward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến đến gần ta trong một lần hiếm hoi thể hiện sự thẳng thắn."
 childhood.2010.desc_proud:0 "[ward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến đến gần ta trong một lần hiếm hoi thể hiện sự trân trọng."
 childhood.2010.desc_fallback:0 "[ward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến đến gần ta trong một khoảnh khắc hiếm hoi suy tư."
 childhood.2010.a:0 "Khi ta cần, ta cũng mong ngươi sẽ ở đó vì ta."
 childhood.2010.b:0 "Đó chính là ý nghĩa của việc làm người giám hộ."

 childhood.2011.desc:0 "[guardian.Custom2('MyCharacterIntroduction', ROOT.Char)|U] gần đây đã nỗ lực hơn rất nhiều trong việc giáo dục ta. Ta rất biết ơn, nhưng [guardian.GetSheHe] cũng nói rõ rằng ta được kỳ vọng sẽ đền đáp công sức của [guardian.GetHerHis] trong tương lai; đó là lẽ thường. Ta chắc rằng [guardian.GetSheHe] nói đúng."
 childhood.2011.tt:0 "Việc học của ngươi được cải thiện đôi chút"
 childhood.2011.a:0 "Dù sao [guardian.GetSheHe|U] cũng là thầy của ta."

 childhood.2100.t:0 "L là cho Ngôn Ngữ"
 childhood.2100.desc:1 "Người giám hộ của ta, [educator.GetTitledFirstName], dạy ta rất tận tâm. Đôi khi ta nghe [educator.GetHerHim] nói bằng [educator.GetCulture.GetLanguage.GetNameNoTooltip] — có lẽ đó là ngôn ngữ [educator.GetSheHe] dùng ở nhà.\n\nDù [educator.GetSheHe] chủ yếu nói [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] với ta, [educator.GetSheHe] cũng đang cố dạy ta một chút tiếng mẹ đẻ của [educator.GetHerHis].\n\nGiữ hai ngôn ngữ trong đầu thật khó... nhưng có lẽ đáng để cố gắng?"
 childhood.2100.a:0 "Ta nên lắng nghe và tập trung, biết đâu ta sẽ học được?"
 childhood.2100.b_hash:0 "Không, ta muốn đi chơi hơn!"
 learn_language_ongoing.2100.a.success:0 "Ngươi học được ngôn ngữ của [educator.GetFirstNamePossessiveNoTooltip]"
 learn_language_ongoing.2100.a.success_parent:0 "[ward.Custom('GetDaughterSon')|U] học được Ngôn Ngữ!"
 learn_language_ongoing.2100.a.success_parent_desc:0 "[educator.GetFirstNamePossessiveNoTooltip] đã dạy [ward.GetFirstName] [language|E] [educator.GetCulture.GetLanguage.GetName]"
 learn_language_ongoing.2100.a.failure:0 "Ngươi không học được ngôn ngữ của [educator.GetFirstNamePossessiveNoTooltip]"

 childhood.2200.t:0 "Ngươi Có Hiểu Ta Nói Gì Không?"
 childhood.2200.desc:0 "Khi ta đi theo [educator.GetNameNoTooltip], ta thấy [educator.GetHerHim] nói bằng ngôn ngữ của triều đình xung quanh ta, và kỳ lạ thay ta bắt đầu hiểu được nó. Nếu ta chịu cố gắng, có lẽ ta sẽ thành thạo ngôn ngữ triều đình!"
 childhood.2200.a:0 "Ta có thể nói giống hệt người lớn!"
 childhood.2200.b:2 "Chán quá, cứ nói [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] đi!"

 childhood.2300.t:0 "Ngôn Ngữ Trong Gia Phả Của Ta"
 childhood.2300.desc:0 "[ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('parent'))] của ta đôi khi xen vài từ [parent.GetCulture.GetLanguage.GetName] vào câu nói, và ta nhận ra mình dần hiểu ngôn ngữ đó hơn. Nếu ta chịu cố gắng, có lẽ ta sẽ đủ giỏi để nói chuyện với [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('parent'))] theo một cách mới!"
 childhood.2300.a:0 "Ta có thể nói giống như [parent.Custom('GetMamaPapa')]!"
 childhood.2300.b:0 "Chán quá! Tại sao phải học [parent.GetCulture.GetLanguage.GetNameNoTooltip] chứ!?"
 childhood.2300.a.success_parent_desc:2 "[ward.GetFirstName] đã học [language|E] [parent.GetCulture.GetLanguage.GetName] thông qua quan sát."

 childhood.2400.t:0 "Tuổi Biết Suy Nghĩ"
 childhood.2400.desc:0 "Việc giáo dục [questioning_ward.GetFirstName] rất đáng quý, nhưng không phải lúc nào cũng dễ dàng. Chỉ hôm nay thôi, [questioning_ward.GetSheHe] muốn "hỏi vài câu đơn giản về [ROOT.Char.GetFaith.GetName]", nhưng rất nhanh những câu hỏi của [questioning_ward.GetHerHis] đã biến thành những nghi ngờ mạnh mẽ đối với đức tin của chúng ta.\n\nCó phải [questioning_ward.GetFirstNameNoTooltip] đang #EMP nghi ngờ#! [ROOT.Char.GetFaith.GetNameNoTooltip]?"
 childhood.2400.a.neutral:0 "Để ta xoa dịu những nghi ngờ của ngươi."
 childhood.2400.a.zealous:0 "Ta sẽ xóa bỏ những nghi ngờ này khỏi tâm trí ngươi."
 childhood.2400.a.toast.succ:0 "[questioning_ward.GetTitledFirstName] bị thuyết phục bởi đức tin của ngươi"
 childhood.2400.a.toast.fail:0 "[questioning_ward.GetTitledFirstName] vẫn giữ những nghi ngờ của [questioning_ward.GetHerHis]"
 childhood.2400.b:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('realm_priest'))|U] [realm_priest.GetFirstNameNoTooltip] có thể trả lời những câu hỏi này tốt hơn."
 childhood.2400.b.toast.succ:0 "[ROOT.Char.Custom('MyPriestTitle')|U] [realm_priest.GetFirstName] đã thuyết phục được [questioning_ward.GetTitledFirstName]"
 childhood.2400.b.toast.fail:0 "[ROOT.Char.Custom('MyPriestTitle')|U] [realm_priest.GetFirstName] không thể thuyết phục [questioning_ward.GetTitledFirstName]"
 childhood.2400.c:0 "Ngươi #EMP đúng#! là có lý..."
 childhood.2400.d:0 "Ngươi không nên nói điều này với ta, [questioning_ward.GetFirstNameNoTooltip]."

 childhood.2410.desc.intro:0 "[questioning_ward.GetFirstNameNoTooltip] thở phào nhẹ nhõm, và ta cũng vậy. Khi cả hai chúng ta chia sẻ sự không tin của mình, khoảng cách giữa "
 childhood.2410.desc.parentchild:0 "[ROOT.Char.Custom('MotherFather')] và [questioning_ward.Custom('GetDaughterSon')]"
 childhood.2410.desc.guardianward:0 "người giám hộ và học trò"
 childhood.2410.desc.outro:0 "dường như thu hẹp lại đôi chút."
 childhood.2410.a:0 "Chuyện này sẽ là bí mật của chúng ta."
