l_english:
  child_personality.7000.t:0 "Thùng Rượu Bị Đánh Cắp"
  child_personality.7000.desc:0 ""Nhìn xem ta tìm được gì này, [child.GetFirstNameNoTooltip] – cả một thùng [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')]! Ta lấy nó lúc đám đầu bếp không để ý." [other_child.GetFirstName] nói với ta, ánh lên vẻ tinh quái trong mắt [other_child.GetHerHis].\n\n"Ngươi còn chờ gì nữa? Mau uống hết trước khi có ai nhận ra nó biến mất!" [other_child.GetSheHe|U] kêu lên.\n\nMột lời đề nghị thật cám dỗ... nhưng làm vậy có đúng không?"
  child_personality.7000.a:0 "Đưa đây – ta sẽ tự mình đem mọi thứ trả lại như cũ."
  child_personality.7000.b:0 "Ngươi đúng là bằng hữu tốt, [other_child.GetFirstNameNoTooltip]. Cạn chén!"
  child_personality.7000.c:0 "À, thứ này không dành cho ta. Nhưng ngươi cứ uống đi."
  child_personality.7001.t:0 "$child_personality.7000.t$"
  child_personality.7001.desc:0 ""Ta bắt được hai đứa này đang trốn trong kho thực phẩm!" Một đầu bếp tức giận hét lên với ta, lôi theo [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] của ta là [child.GetFirstName] cùng [other_child.GetFirstName].\n\n"
  child_personality.diligent.desc:0 "\"[other_child.GetFirstNameNoTooltip] đã trộm cả #EMP một#! thùng [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')]! [child.GetFirstNameNoTooltip] đã cố tự mình cất lại trước khi ta phát hiện ra – nhưng chẳng may mắn gì cho [child.GetHerHim] cả!\" [cook.GetSheHe|U] nói đầy giận dữ.\n\nCó vẻ như đứa trẻ giám hộ của ta là một kẻ gây rối nhỏ, nhưng là đứa biết hối cải!"
  child_personality.gregarious.desc:0 ""Chúng đánh cắp cả #EMP một#! thùng [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')] và uống gần hết. Nhìn chúng xem – say như các lãnh chúa vậy, cả hai! Chúng còn đứng không vững..." [cook.GetSheHe|U] nói giận dữ.\n\nCó vẻ như người được ta giám hộ đã chịu áp lực từ bằng hữu, nhưng ít ra [child.GetSheHe] và [other_child.GetFirstNameNoTooltip] cũng thân thiết như đồng phạm."
  child_personality.temperate.desc:0 "\"[other_child.GetFirstNameNoTooltip] đã trộm cả #EMP một#! thùng [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')], và [child.GetFirstNameNoTooltip] chỉ ngồi đó khi [other_child.GetFirstNameNoTooltip] uống đến gần như bất tỉnh!\" [cook.GetSheHe|U] nói đầy giận dữ.\n\nCó vẻ như đứa trẻ giám hộ của ta đã bảo vệ đồng phạm, vừa canh chừng vừa tự mình không đụng đến một giọt rượu nào [child.GetHerselfHimself]."
  child_personality.7001.diligent:0 "Tự mình làm sao? Khá chăm chỉ đấy, [child.Custom('GirlBoy')] ngoan!"
  child_personality.7001.gregarious:0 "Ha! Ngươi đã có một khoảng thời gian #EMP thật#! vui nhỉ!"
  child_personality.7001.temperate:0 "Ngươi biết kiềm chế không uống, thật đáng khen."
  child_personality.7001.change.diligent:0 "Ta nghĩ có kẻ cần học bài học về trách nhiệm cá nhân."
  child_personality.7001.change.gregarious:0 "Nghe đây, rượu chính là chìa khóa của #EMP niềm vui#! và #EMP sự khoái lạc#!!"
  child_personality.7001.change.temperate:0 "Từ giờ tránh xa rượu mạnh, nghe rõ chưa?"
  spoilsport_opinion:0 "Kẻ Phá Hỏng Cuộc Vui"
 
  child_personality.7010.t:0 "Bài Giảng"
  child_personality.7010.desc:0 ""Hãy lắng nghe lời ta, các con. Hôm nay ta sẽ kể cho các con về [ROOT.Char.GetFaith.HighGodName], về [ROOT.Char.GetFaith.PositiveAfterLife], [ROOT.Char.GetFaith.NegativeAfterLife], và cả #EMP [ROOT.Char.GetFaith.DevilName]#! [ROOT.Char.GetFaith.DevilHerselfHimself] nữa!" [sermon_priest.GetFirstName] lớn tiếng nói, ngọn lửa nhiệt thành cháy lên trong mắt [sermon_priest.GetHerHis].\n\nTa cùng lũ trẻ khác bị cuốn hút bởi bài giảng của [sermon_priest.GetFirstNamePossessiveNoTooltip], ai mà ngờ được [ROOT.Char.GetFaith.ReligiousText] lại có thể #EMP hấp dẫn#! đến vậy!\n\nKhi bài giảng kết thúc, ta phải nói cho [sermon_priest.GetFirstNameNoTooltip] biết suy nghĩ của mình."
  child_personality.7010.a:0 ""Niềm tin của ta vào [ROOT.Char.GetFaith.HighGodName|U] sẽ #EMP không bao giờ#! lay chuyển, [sermon_priest.GetFirstNameNoTooltip]!"" 
  child_personality.7010.b:0 ""Còn chuyện về #EMP 'Quyền Thần Thánh của các [ROOT.Char.Custom('GetQueenKing')]'#! thì sao?"" 
  child_personality.7010.c:0 ""' [ROOT.Char.GetFaith.DevilName]' này nghe có vẻ #EMP đáng để noi theo!#!"" 
  child_personality.7011.t:0 "$child_personality.7010.t$"
  child_personality.7011.desc:0 "Hôm nay [sermon_priest.GetFirstName] đã giảng một bài đầy nhiệt huyết cho toàn bộ lũ trẻ trong triều, và dường như chúng bị mê hoặc khi ông đọc từ [sermon_priest.GetFaith.ReligiousText] với lòng nhiệt thành.\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] của ta là [child.GetFirstName] "
  child_personality.zealous.desc:0 "dường như đã ghi nhớ trong lòng, có lẽ là #EMP hơi quá#! mức. Từ đó đến giờ [child.GetSheHe|U] liên tục làm phiền bọn người hầu, chỉ ra họ có thể trở thành những [child.GetFaith.GetAdherentNamePlural] tốt hơn thế nào..."
  child_personality.ambitious.desc:0 "giờ đây tin chắc rằng [child.GetSheHe] sinh ra để làm nên đại nghiệp, cho rằng [child.GetFaith.HighGodName] hoàn toàn đứng về phía [child.GetHerHim]."
  child_personality.sadistic.desc:0 "liên tục kể với ta rằng [child.GetSheHe] thích thú ra sao với những đoạn nói về #EMP [child.GetFaith.DevilName]#!, và rằng [child.GetFaith.DevilSheHe] là kẻ có lý tưởng mà [child.GetSheHe] muốn noi theo..."
  child_personality.7011.zealous:0 "Một niềm tin vững chắc sẽ giúp ngươi tiến xa, [child.Custom('GirlBoy')]."
  child_personality.7011.ambitious:0 "Đúng vậy, đừng bao giờ quên rằng thần linh đứng về phía ngươi!"
  child_personality.7011.sadistic:0 "Cứ nói gì thì nói, không có lương tâm đôi khi lại có ích cho [child.GetHerHim]."
  child_personality.7011.change.zealous:0 "#EMP Đức tin#! của ngươi phải đứng trên tất cả, hài tử của ta."
  child_personality.7011.change.ambitious:0 "Đức tin chỉ là #EMP công cụ để đạt mục đích!#!"
  child_personality.7011.change.sadistic:0 "Hài tử, thế gian này tăm tối và đầy kinh hoàng. Hoặc giết, hoặc bị giết."
  clever_child_opinion:0 "Đứa Trẻ Thông Minh"
  delightfully_devilish_opinion:0 "Quỷ Quyệt Đáng Thích"
  worried_opinion:0 "Lo Lắng"
 
  child_personality.7020.t:0 "Trận Đòn"
  child_personality.7020.desc:0 ""Đồ [child.Custom2('InsultNoun', SCOPE.sC('evil_person'))] ngu ngốc! Sao ngươi lúc nào cũng cản đường ta!? Ta sẽ dạy ngươi một bài học..." [evil_person.GetFirstName] quát lên, với tay lấy cây gậy gần đó.\n\nTa đã làm gì sai chứ? Ta chỉ muốn xem [evil_person.GetFirstNameNoTooltip] đang làm gì thôi! [evil_person.GetSheHe|U] đang tiến lại rất nhanh, giơ cao cây gậy! Cứu với!\n\n"Nếu ngươi dám nói cho ai biết ai làm chuyện này, ta sẽ đảm bảo ngươi chết..." [evil_person.GetSheHe|U] cười nhếch mép."
  child_personality.7020.a:0 "Làm... làm sao con người có thể tàn nhẫn đến vậy..."
  child_personality.7020.b:0 "Nếu còn nhiều kẻ giống [evil_person.GetHerHim] thì sao!? Ta phải #EMP luôn#! cảnh giác..!"
  child_personality.7020.c:0 "Xin đừng! Đừng đánh ta, ta sẽ làm bất cứ điều gì!"
  child_personality.7021.t:0 "$child_personality.7020.t$"
  child_personality.7021.desc:0 "Chuyện quái gì đã xảy ra với [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] của ta thế này!? [child.GetSheHe|U] toàn những vết bầm tím và thương tích – và [child.GetSheHe] từ chối tiết lộ kẻ đã gây ra điều này cho [child.GetHerHim]! Có phải là một đứa trẻ lớn hơn? Hay nó đã chọc giận một quý tộc đến mức nổi trận lôi đình?\n\n\""
  child_personality.shy.desc:0 "Giờ đây [child.GetSheHe] gần như không còn nói chuyện nữa, và luôn trốn đi mỗi khi có người ở gần... tội nghiệp [child.Custom('GirlBoy')]..."
  child_personality.paranoid.desc:0 "Có vẻ như ngay cả những cái bóng chập chờn cũng làm [child.GetHerHim] giật mình sợ hãi, có lẽ đứa trẻ [child.Custom('GirlBoy')] tội nghiệp này nhìn thấy kẻ hành hung [child.GetHerHis] trong đó? [child.GetSheHe|U] luôn liếc nhìn qua vai [child.GetHerHis], lúc nào cũng cảnh giác..."
  child_personality.craven.desc:0 "Chỉ cần một chiếc ghim rơi xuống thôi, [child.GetFirstNameNoTooltip] cũng sẽ chạy đi tìm chỗ ẩn nấp. [child.Custom('GirlBoy')] tội nghiệp dường như sống trong nỗi sợ hãi thường trực..."
  child_personality.7021.shy:0 "[child.Custom('GirlBoy')] thân mến, ngươi không cần nói chuyện với ai nếu không muốn..."
  child_personality.7021.paranoid:0 "Hãy luôn cảnh giác, [child.Custom('GirlBoy')]. Đừng cho chúng cơ hội lần nữa."
  child_personality.7021.craven:0 "Chạy đi, trốn đi, và đừng bao giờ cho kẻ thù cơ hội làm hại ngươi."
  child_personality.7021.change.shy:0 "Tránh xa mọi người, và ngươi sẽ an toàn..."
  child_personality.7021.change.paranoid:0 "Kẻ thù ở #EMP khắp nơi#!. Ngươi phải hiểu điều đó."
  child_personality.7021.change.craven:0 "Ngươi nên chạy đi ngay từ đầu, hài tử!"
 
  child_personality.7030.t:0 "Một Mình Trong Nhà Bếp"
  child_personality.7030.desc:0 "Cuối cùng thì ta cũng có nhà bếp #EMP hoàn toàn#! cho riêng mình!\n\nTa đã thuyết phục đầu bếp [cook.GetFirstName] rằng ta sẽ rửa nồi. Với lời hứa đó, [cook.GetSheHe] đã rời đi để lấy [ROOT.Char.Custom('GetLivestockFowlIndef')] cho bữa tối – để lại căn bếp #EMP ngon lành#! không người trông coi.\n\nCó mật ong, [child.Custom('FavoriteTreatDemand')] và mứt, rồi [child.Custom('GetExpensiveDessert')] và táo và... và... #EMP TA KHÔNG CHỊU NỔI NỮA!#!\n\nĐã đến lúc..."
  child_personality.7030.a:0 "...ăn mỗi thứ một ít rồi ngủ trên bao bột!"
  child_personality.7030.b:0 "...ăn càng nhiều càng tốt, ta sẽ không để lại vụn nào!"
  child_personality.7030.c:0 "...rửa nồi, tất nhiên rồi!"
  child_personality.7031.t:0 "$child_personality.7030.t$"
  child_personality.7031.desc:0 ""Kính chào, m'[ROOT.Char.GetLadyLord]." [cook.GetFirstName], một trong các đầu bếp nói. "Ta đưa [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] của ngài là [child.GetFirstName] tới đây. [child.GetSheHe|U] hứa sẽ rửa nồi trong bếp..."\n\n[cook.GetSheHe|U] hít một hơi sâu.\n\n"
  child_personality.lazy.desc:0 "\"...nhưng [child.GetSheHe] đã gặm nhấm hết thức ăn như một con chuột nhỏ, rồi ngủ thiếp đi trên bao bột! [child.GetSheHe|U] đáng bị đòn roi nếu ngươi hỏi ta, nhưng ta sẽ để nó lại cho ngươi tự xử lý!\"\n\nĐứa trẻ này thật thiếu động lực và uể oải, ngươi có thể nhầm lẫn [child.GetHerHim] với một xác chết đấy!"
  child_personality.gluttonous.desc:0 "\"...nhưng [child.GetSheHe] đã ngấu nghiến mọi thứ đồ ngọt mà nó tìm được, như một con lợn nhỏ! Giờ thì [child.GetSheHe] đầy mồ hôi và đỏ mặt vì gắng sức ăn uống [child.GetHerselfHimself]...\"\n\n[child.GetFirstNameNoTooltip] không bao giờ cưỡng lại được đồ ngọt, nhưng thế này thì có lẽ hơi quá rồi..."
  child_personality.compassionate.desc:0 ""...và [child.GetSheHe] rửa #EMP sạch mọi#! cái nồi! Thậm chí còn cọ cả cái vạc lớn mà ta chưa hề yêu cầu! Ngài có một [child.Custom('GirlBoy')] thật tốt bụng."\n\nQuả thật rất vị tha, nhưng việc này có hợp với thân phận của [child.GetFirstNamePossessiveNoTooltip] không..?"
  child_personality.7031.lazy:0 "Tốt, đừng bao giờ phí sức khi không cần thiết!"
  child_personality.7031.gluttonous:0 "Hãy nhớ, không ai có quyền nói ngươi được hay không được ăn gì."
  child_personality.7031.compassionate:0 "Một hành động thật đáng yêu! Ngươi sẽ tiến xa."
  child_personality.7031.change.lazy:0 "Đừng phí sức vì những kẻ như thế, [child.Custom('GirlBoy')]."
  child_personality.7031.change.gluttonous:0 "Ngươi nên ăn hết đồ ngọt, đó là #EMP quyền của ngươi.#!"
  child_personality.7031.change.compassionate:0 "Ngươi nên đối xử tốt hơn với [cook.GetFirstNameNoTooltip]!"
  lazy_child_opinion:0 "Đứa Trẻ Lười Biếng"
  little_pig_opinion:0 "Heo Con"
  sweet_child_opinion:0 "Đứa Trẻ Dễ Thương"
  thankful_opinion:0 "Biết Ơn"
 
 child_personality.7040.t:0 "Trốn và Nhìn Lén"
 child_personality.7040.desc:0 "Cái tủ quần áo trong khu phòng của đám người hầu là chỗ trốn #EMP tuyệt nhất#!, ta đúng là thiên tài trò trốn tìm! Khi ta hé nhìn qua khe hở nhỏ giữa hai cánh cửa, ta thấy [lover_1.GetFirstName] và [lover_2.GetFirstName] bỗng dưng xông qua cửa.\n\n\"Ôi, [lover_2.Custom('RomanticComplimentAdjective')] [lover_2.Custom('RomanticComplimentNoun')] của ta, ta không thể #EMP chờ#! để lột ngươi ra khỏi đống quần áo kia!\" [lover_1.GetFirstNameNoTooltip] gầm khẽ, đôi tay [lover_1.GetHerHis] sờ soạng khắp thân thể của [lover_2.GetFirstNamePossessiveNoTooltip].\n\n\"Hãy chiếm lấy ta, chiếm lấy ta ngay bây giờ đi, đồ [lover_1.Custom('RaunchyComplimentNoun')]!\" [lover_2.GetFirstNameNoTooltip] rên rỉ lớn tiếng, quăng mình [lover_2.GetHerselfHimself] lên giường.\n\n"
 child_personality.7040.desc_motherfather:0 "Mẫu thân? Phụ thân? Họ... họ đang #EMP làm gì vậy!?#!"
 child_personality.7040.desc_father:0 "P... phụ thân? Ngài đang #EMP làm gì vậy!?#!"
 child_personality.7040.desc_mother:0 "M... mẫu thân? Ngài đang #EMP làm gì vậy!?#!"
 child_personality.7040.desc_default:0 "Họ đang... à... ta #EMP không#! nên thấy chuyện này!"
 child_personality.7040.a.crush_version:0 "[child_crush_target.GetFirstNameNoTooltip] thật... #EMP xinh đẹp#!, như [child_crush_target.Custom('GetBeautifulMetaphor')]."
 child_personality.7040.a:0 "Chuyện này xem ra #EMP VUI#! hơn trốn tìm nhiều!"
 child_personality.7040.b:0 "Ôi đôi mắt ngây thơ đáng thương của ta, dừng lại đi! #EMP Dừng lại đi!#!"
 child_personality.7041.t:0 "$child_personality.7040.t$"
 child_personality.7041.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] của ta là [child.GetFirstName] rốt cuộc đang làm gì trong cái tủ quần áo ở khu phòng người hầu vậy? Chơi trốn tìm, [child.GetSheHe] nói thế sao?\n\n"
 child_personality.lustful.desc:0 "[child.GetSheHe|U] trông như kẻ ngốc; cười ngây ngô, má đỏ bừng, nước dãi chực chảy, gần như chẳng nghe lọt lời ta nói...\n\nÔi không... ta biết chuyện gì đã xảy ra. [child.GetSheHe|U] hẳn đã thấy hai tên [ROOT.Char.Custom('lowly_servant_type')], khụm, #EMP nhổ lông [ROOT.Char.Custom('GetLivestockFowlIndef')]#! cùng nhau – ánh mắt của [child.GetFirstNamePossessiveNoTooltip] rõ ràng là dục vọng."
 child_personality.chaste.desc:0 "[child.GetSheHe|U] trông như một bóng ma; run rẩy, mắt mở to, nhìn trân trân vào các bức tường...\n\nỒ không... ta biết chuyện gì đã xảy ra. [child.GetSheHe|U] hẳn đã nhìn thấy hai [ROOT.Char.Custom('lowly_servant_type')], hừm, #EMP đang làm thịt [ROOT.Char.Custom('GetLivestockFowlIndef')]#! cùng nhau.\n\nĐứa trẻ [child.Custom('GirlBoy')] tội nghiệp trông thật sốc, ta sẽ không ngạc nhiên nếu sau này [child.GetSheHe] sẽ gặp khó khăn với chuyện chăn gối khi trưởng thành..."
 child_personality.7041.lustful:0 "Đồ nhóc dâm đãng! Để dành chuyện đó đến khi ngươi trưởng thành!"
 child_personality.7041.chaste:0 "Không thân mật quá mức cần thiết sẽ có lợi cho [child.GetHerHim]."
 child_personality.7041.change.lustful:0 "Đừng sợ, [child.Custom('GirlBoy')]! Khi trưởng thành rồi ngươi sẽ hiểu!"
 child_personality.7041.change.chaste:0 "Hãy kiềm chế bản thân! Một [child.GetLadyLord] không nên hành xử như vậy!"
 
 child_personality.7050.t:0 "Một Bài Học về Tiền Bạc"
 child_personality.7050.desc:0 "\"Nếu không có thuế, quốc khố hoàng gia chẳng mấy chốc sẽ cạn kiệt. Những chư hầu trung thành luôn sẵn lòng nộp.\" [teacher.GetFirstName], thầy của ta, nói và [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('teacher'))].\n\n\"Vì vậy điều tối quan trọng là phải giữ cho thần dân của ngươi hài lòng, đừng đánh thuế họ quá nhiều – cũng đừng quá ít, kẻo họ cho rằng ngươi nhu nhược.\" [teacher.GetFirstNameNoTooltip] tiếp tục, lật sang trang.\n\n\"Từ [ROOT.Char.GetTitleTierName] cao quý nhất đến kẻ [ROOT.Char.Custom('lowly_servant_type')] thấp hèn nhất, ai cũng có phần của mình.\" [teacher.GetSheHe|U] nói, khép cuốn sách lại. \"Bài học kết thúc, ngươi có thể đi.\""
 child_personality.7050.a:0 "Không có công bằng, lãnh địa sẽ suy yếu!"
 child_personality.7050.b:0 "Hừ! Khi ta cai trị, thuế sẽ #EMP cao#! và #EMP dồi dào!#!"
 child_personality.7050.c:0 "Muốn làm món trứng vàng, phải đập vỡ vài tên nông dân..."
 child_personality.7051.t:0 "$child_personality.7050.t$"
 child_personality.7051.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] của ta là [child.GetFirstName]"
 child_personality.7051.desc_1:0 "vừa mới hoàn thành một bài học của ta"
 child_personality.7051.desc_2:0 "vừa mới hoàn thành một bài học do [teacher.GetFirstName] giảng"
 child_personality.7051.desc_fin:0 " – về việc quản lý ngân khố và tiền bạc trong đó.\n\n"
 child_personality.just.desc:0 "[child.GetFirstNameNoTooltip] dường như đã ghi nhớ bài học vào lòng, với ý thức công bằng được củng cố.\n\n[child.GetSheHe|U] liên tục nói về việc mọi người 'Từ [ROOT.Char.GetTitleTierName] cao quý nhất đến kẻ [ROOT.Char.Custom('lowly_servant_type')]' đều góp phần vào nền kinh tế của lãnh địa."
 child_personality.greedy.desc:0 "Nhưng có vẻ chỉ những đoạn nhắc đến #EMP vàng#! là đọng lại...\n\nGiờ đây [child.GetSheHe] đang thu những khoản thuế nhỏ từ tất cả đám người hầu mà [child.GetSheHe] có thể đuổi bắt, khiến họ vô cùng khó chịu."
 child_personality.callous.desc:0 "[child.GetFirstNameNoTooltip] dường như đã tiếp thu bài học... theo một cách nào đó...\n\nDù [child.GetSheHe] hiểu vai trò của tầng lớp thấp kém, [child.GetSheHe] cũng khăng khăng rằng 'nếu một nông dân ngừng nộp thuế thì họ chẳng còn ích lợi gì, nên bị vứt bỏ' – một cái nhìn vô cùng lạnh lùng về sinh mạng con người..."
 child_personality.7051.just:0 "Ý thức công bằng mạnh mẽ sẽ giúp ích cho ngươi trong đời!"
 child_personality.7051.greedy:0 "Đúng vậy. Không gì quan trọng hơn #EMP của cải!#!"
 child_personality.7051.callous:0 "Tốt. Đừng để những #EMP cảm xúc#! tầm thường cản trở ngươi."
 child_personality.7051.change.just:0 "Ngươi chẳng học được gì sao!? Bài học là về #EMP công bằng!#!"
 child_personality.7051.change.greedy:0 "...bwahaha! Không, [child.Custom('GirlBoy')], điều ngươi cần làm là #EMP vắt kiệt chúng!#!"
 child_personality.7051.change.callous:0 "Cảm xúc sinh ra yếu đuối, hài tử. Hãy dập tắt chúng."
 
 child_personality.7060.t:0 "Những Bí Ẩn của [child.GetFaith.ReligiousText|U]"
 child_personality.7060.desc:0 "\"Nhìn trang này đi, [child.GetFirstNameNoTooltip]! Ta nghĩ nó đang nói về [child.GetFaith.random_GoodGodNames], thật thú vị.\" [other_child.GetFirstName] nói, một bản [child.GetFaith.ReligiousText] mở ra nằm trước mặt [other_child.GetHerHim] trên sàn.\n\n\"Có quá nhiều điều chúng ta chưa biết, quá nhiều thứ để học! Bao nhiêu bí ẩn, bao nhiêu tri thức – hãy thử suy ngẫm thêm chân lý, tưởng tượng xem chúng ta có thể trở thành gì!\" [other_child.GetFirstNameNoTooltip|U] nói, ánh mắt [other_child.GetHerHis] dần hướng lên cao."
 child_personality.7060.a:0 "Trong cuốn sách đó có quá nhiều trí tuệ!"
 child_personality.7060.b:0 "Xì, ngươi không muốn chơi với #EMP [child.Custom('child_favorite_toy')] của ta sao!?#!"
 child_personality.7060.c:0 "Ồ, ta hài lòng với những gì ta đã biết."
 child_personality.7061.t:0 "$child_personality.7060.t$"
 child_personality.7061.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] của ta và người bạn nhỏ [other_child.GetFirstName] của nó đã lấy một bản [child.GetFaith.ReligiousText] từ phòng làm việc và mang vào phòng chơi...\n\n\""
 child_personality.humble.desc:0 "Chúng đã dành hàng giờ cố hiểu những gì viết trong đó, nói về [child.GetFaith.random_GoodGodNames] và vô vàn bí ẩn của thần linh.\n\n[child.GetFirstNameNoTooltip] dường như đã phát triển sự kính trọng sâu sắc với lời dạy của đức tin [child.GetFaith.GetAdjective]."
 child_personality.cynical.desc:0 "...và phá hỏng hoàn toàn! Trang bị xé rách, dấu chân trên bìa – chẳng có chút tôn trọng nào!\n\nCó vẻ như [child.GetFirstNameNoTooltip] bé nhỏ chẳng mấy quan tâm đến lời dạy của thần linh..."
 child_personality.content.desc:0 "[child.GetFirstNameNoTooltip] đã thử đọc, nhưng nhanh chóng nhận ra rằng những lời trong đó tốt nhất nên để cho các [child.GetFaith.PriestNeuterPlural].\n\n[child.GetSheHe|U] dường như hoàn toàn hài lòng với việc hiện tại [child.GetHerHis] chưa thể hiểu ý nghĩa sâu xa của cuốn sách..."
 child_personality.7061.humble:0 "Ngươi làm đúng khi kính trọng lời thánh.."
 child_personality.7061.cynical:0 "Ha! Dù sao cũng chỉ là một đống nhảm nhí."
 child_personality.7061.content:0 "Không biết cũng tốt, ta nói vậy."
 child_personality.7061.change.humble:0 "Hãy tôn trọng những lời đó! Chúng chứa đựng #EMP trí tuệ#! và #EMP ý nghĩa!#!"
 child_personality.7061.change.cynical:0 "Toàn là nhảm nhí thôi, [child.Custom('GirlBoy')]. Bỏ qua đi."
 child_personality.7061.change.content:0 "Hài lòng với những gì ngươi đã biết, ngươi sẽ hạnh phúc."
 
 child_personality.7070.t:0 "Máu và Nước Bọt"
 child_personality.7070.desc:0 "Ah, [child.Custom('GetExpensiveMeal')], món #EMP ta thích nhất!#! Khi ta sắp ăn, niềm vui của ta bỗng bị cắt ngang bởi [other_child.GetFirstName]. [other_child.GetSheHe] muốn gì đây?\n\n\"Chào nhé, đồ #EMP [child.Custom2('InsultNoun', SCOPE.sC('other_child'))]!#! Ngươi đang ăn gì thế? Trông ghê tởm quá – để ta #EMP thêm chút gia vị!#!\" [other_child.GetFirstNameNoTooltip] kêu lên, tiến lại gần đĩa của ta.\n\n#flatulence *Ptooey!*#! Một bãi nước bọt kinh tởm rơi thẳng vào bữa ăn của ta.\n\n\"Đấy, ngon hơn nhiều rồi! Bwahaha!\" [other_child.GetSheHe|U] cười lớn và nhe răng."
 child_personality.7070.a:0 "Ngươi xong đời rồi, [other_child.Custom2('InsultNoun', ROOT.Char)]!"
 child_personality.7070.b:0 "Từ giờ ta sẽ bí mật nhổ nước bọt vào thức ăn của [other_child.GetHerHis]... #EMP chúc ngon miệng.#!"
 child_personality.7070.c:0 "Cắn răng mà chịu."
 child_personality.7070.c.flavor:0 "Ngậm đắng nuốt cay vậy."
 child_personality.7071.t:0 "$child_personality.7070.t$"
 child_personality.7071.desc:0 "Nghe nói [other_child.GetFirstName] đã nhổ nước bọt vào thức ăn của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] của ta là [child.GetFirstNamePossessive] trong bữa tối vài đêm trước.\n\n"
 child_personality.vengeful.desc:0 "\"Ngươi là đồ [other_child.Custom2('InsultNoun', SCOPE.sC('child'))]!\" [child.GetFirstNameNoTooltip] hét lên. \"Nhưng ngươi mới là đồ [child.Custom2('InsultNoun', SCOPE.sC('other_child'))]!\" [other_child.GetFirstNameNoTooltip] hét lại.\n\n[child.GetFirstNameNoTooltip] đã đánh nhau với [other_child.GetFirstNameNoTooltip] mỗi ngày kể từ đó! Không phút nào trôi qua mà [child.GetHerHim] không nghĩ ra một kiểu trả thù vặt vãnh..."
 child_personality.deceitful.desc:0 "Một đầu bếp đã bắt gặp [child.GetFirstNameNoTooltip] trả thù bằng cách bí mật nhổ nước bọt vào thức ăn của [other_child.GetFirstNamePossessiveNoTooltip]! Thảo nào [other_child.GetFirstNameNoTooltip] dạo này trông hơi... #EMP xanh xao#! trong bữa tối – [child.GetSheHe] hẳn đã nhổ nước bọt vào thức ăn của [other_child.GetFirstNamePossessiveNoTooltip] suốt mấy ngày, đồ nhóc ranh ranh ma..."
 child_personality.calm.desc:0 "Có vẻ như [child.GetFirstNameNoTooltip] đang cố làm [other_child.GetFirstNameNoTooltip] chán nản bằng cách không phản ứng trước sự bắt nạt của [other_child.GetHerHis]. Dù [other_child.GetFirstNameNoTooltip] có bao nhiêu lần gọi [child.GetHerHim] là [child.Custom2('InsultNoun', SCOPE.sC('other_child'))] hay tát vào má [child.GetHerHim]..."
 child_personality.7071.vengeful:0 "Ngươi sẽ có ngày trả thù."
 child_personality.7071.deceitful:0 "Đáng đời [other_child.GetFirstNameNoTooltip]!"
 child_personality.7071.calm:0 "Cứ mặc kệ [other_child.GetFirstNameNoTooltip], rồi [other_child.GetSheHe] sẽ chán thôi."
 child_personality.7071.change.vengeful:0 "Đừng nhu nhược vậy! #EMP Trả thù đi!#!"
 child_personality.7071.change.deceitful:0 "Trả thù là món ăn ngon nhất khi dọn ra... #EMP gián tiếp.#!"
 child_personality.7071.change.calm:0 "Hãy quay má kia đi, [child.Custom('GirlBoy')] của ta."
 
 child_personality.7080.t:0 "Một Bài Học về Lòng Bác Ái"
 child_personality.7080.desc_1:0 ""Hãy nhìn những kẻ nghèo khổ và cơ cực kia, [child.GetFirstNameNoTooltip]. Có rất nhiều người trong số họ, và vài người thật sự cần giúp đỡ – số khác chỉ là lũ lừa đảo đi xin bố thí." "
 child_personality.7080.desc_name_1:0 "[teacher.GetTitledFirstName] $child_personality.7080.desc_2$"
 child_personality.7080.desc_name_2:0 "[teacher.GetCouncilTitle] [teacher.GetFirstName] $child_personality.7080.desc_2$"
 child_personality.7080.desc_2:0 "giải thích cho ta, rồi lấy ra một túi nhỏ đầy vàng.\n\n"Ai trong số họ là người xứng đáng nhất với lòng bố thí của chúng ta hôm nay, hỡi [child.Custom('GirlBoy')] thân mến của ta?" [teacher.GetSheHe|U] nói, trao túi tiền cho ta.\n\nCó vẻ như [teacher.GetFirstNameNoTooltip] muốn ta trao vàng cho những người cần nó nhất..."
 child_personality.7080.a:0 "Tất cả họ đều xứng đáng! Chúng ta hẳn còn nhiều để cho chứ?"
 child_personality.7080.b:0 "Tên [ROOT.Char.Custom('lowly_servant_type')] kia! Không... người nông dân kia! Khoan, có lẽ..."
 child_personality.7080.c:0 "Không ai trong số họ cả. Tất cả chỉ là lũ cặn bã hạ tiện!"
 child_personality.7081.t:0 "$child_personality.7080.t$"
 child_personality.7081.desc:0 "[teacher.GetTitledFirstName] hôm nay đã đưa [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] của ta là [child.GetFirstName] ra chợ. [child.GetFirstNameNoTooltip] phải phát chẩn cho người nghèo và kẻ khốn khó, để học về lòng bác ái và trách nhiệm của một người cai trị đối với những kẻ kém may mắn.\n\n"
 child_personality.generous.desc:0 ""Đứa trẻ [child.Custom('ComplimentAdjective')] ấy đã cho mỗi người một chút." [teacher.GetFirstNameNoTooltip] nói. "Và khi túi tiền cạn, [child.GetSheHe] còn khăng khăng đòi đi lấy thêm. Thật vị tha, có lẽ thậm chí quá mức."\n\nCó vẻ như [child.GetFirstNameNoTooltip] bé nhỏ có một tấm lòng rất rộng lớn."
 child_personality.fickle.desc:0 "\"Đứa trẻ không có đầu óc này không thể quyết định trao số vàng cho ai.\" [teacher.GetFirstNameNoTooltip] nói, rõ ràng là rất khó chịu. \"Cuối cùng, [child.GetSheHe] đã đưa một đồng cho [ROOT.Char.Custom('lowly_servant_type')] què chân, một đồng cho một đứa trẻ ăn xin mù lòa, dùng một đồng khác để mua [child.Custom('FavoriteTreatDemand')], đưa một đồng cho #EMP ta#! - người mà nó chẳng thân thiết gì, và làm mất đồng cuối cùng dưới mương.\"\n\nCó vẻ như [child.GetFirstNameNoTooltip] bé nhỏ khá là không có khả năng quyết định [child.GetHerHis]..."
 child_personality.arrogant.desc:0 ""[child.GetSheHe|U] từ chối cho #EMP bất kỳ ai#! một đồng nào!" [teacher.GetFirstNameNoTooltip] kêu lên. "Ai chúng ta gặp cũng hoặc là 'không xứng đáng' hoặc 'dưới tầm [child.GetHerHim]'... cuối cùng, [child.GetSheHe] giữ lại hết số vàng."\n\n[child.GetFirstNameNoTooltip] dường như đã phát triển tính kiêu ngạo..."
 child_personality.7081.generous:0 "Bổn phận của chúng ta là cho đi nhiều nhất có thể!"
 child_personality.7081.fickle:0 "Sao phải chọn một con đường, khi ngươi có thể chọn #EMP tất cả?#!"
 child_personality.7081.arrogant:0 "Đúng vậy đấy, [child.Custom('GirlBoy')]. Ngươi #EMP cao quý#! hơn chúng."
 child_personality.7081.change.generous:0 "Không, ngươi #EMP phải#! quan tâm đến người nghèo!"
 child_personality.7081.change.fickle:0 "Ngươi phải luôn suy xét lựa chọn của mình. Cẩn thận. Không ngừng."
 child_personality.7081.change.arrogant:0 "Hừ! Lũ khốn nghèo hèn đó đều dưới chân ngươi!"
 
 child_personality.7090.t:0 "Những Tinh Tế của Ngoại Giao"
 child_personality.7090.desc:0 ""Chư hầu đôi khi sẽ vượt quá giới hạn của họ." Thầy của ta [teacher.GetFirstName] nói. "Sự tha thứ sẽ củng cố mối liên kết của ngươi với họ."\n\n"Đôi khi, hãy đặt niềm tin vào thần dân, bất chấp danh tiếng của họ. Nếu không ngươi sẽ bị quá tải." [teacher.GetSheHe|U] tiếp tục giảng.\n\n"Điều quan trọng là phải cho họ thời gian sửa chữa lỗi lầm của mình." [teacher.GetFirstNameNoTooltip] nói, cuộn lại tờ giấy da.\n\n"Giờ thì, hôm nay ngươi đã học được gì?" [teacher.GetSheHe|U] hỏi, nhìn chăm chú vào ta."
 child_personality.7090.a:0 "Ai cũng phạm sai lầm, ta không nên phán xét."
 child_personality.7090.b:0 "Rằng việc tin tưởng thần dân là rất quan trọng!"
 child_personality.7090.c:0 "Kiên nhẫn. Hãy để mọi chuyện diễn ra theo thời gian."
 child_personality.7091.t:0 "$child_personality.7090.t$"
 child_personality.7091.desc:0 "Hôm nay [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] của ta là [child.GetFirstName] đã được [teacher.GetFirstName] dạy một bài về quản lý chư hầu. Đó là một bài học khá phức tạp, cần thiết, nhưng có lẽ hơi vượt quá khả năng hiểu của [child.GetFirstNamePossessiveNoTooltip]?\n\n"
 child_personality.forgiving.desc:0 ""Ai cũng phạm sai lầm!" [child.GetFirstNameNoTooltip] kêu lên. "Khi ta cai trị, ta sẽ tha thứ và để họ sống – để lãnh địa của ta thịnh vượng!"\n\nCó lẽ [child.GetSheHe] sẽ trở thành một người cai trị #EMP quá#! khoan dung..?"
 child_personality.trusting.desc:0 ""Thần dân của ta luôn mong điều tốt cho ta!" [child.GetFirstNameNoTooltip] kêu lên. "Ta sẽ tin tưởng thần dân của mình mà không nghi ngờ – để chúng ta cùng xây dựng lãnh địa!"\n\nÔi đứa trẻ ngây thơ đáng yêu... mức độ tin tưởng đó có thể nguy hiểm..."
 child_personality.patient.desc:0 ""Ta phải để mọi chuyện diễn ra theo thời gian." [child.GetFirstNameNoTooltip] nói. "Chỉ bằng cách kiên nhẫn và để thần dân làm việc theo nhịp độ của họ, ta mới có thể cai trị khôn ngoan."\n\n[child.GetFirstNameNoTooltip] dường như chưa nhận ra rằng có những thần dân sẽ cố tình lãng phí thời gian của [child.GetHerHis]..."
 child_personality.7091.forgiving:0 "Chỉ bằng sự tha thứ chúng ta mới có thể tiến lên."
 child_personality.7091.trusting:0 "Tốt, hãy xua tan sự nghi ngờ khỏi tâm trí ngươi!"
 child_personality.7091.patient:0 "Kiên nhẫn sẽ giúp ích cho ngươi, hài tử."
 child_personality.7091.change.forgiving:0 "Tha thứ là đức hạnh cao quý nhất!"
 child_personality.7091.change.trusting:0 "Hãy tin tưởng thần dân của ngươi, họ sẽ không bao giờ hại ngươi!"
 child_personality.7091.change.patient:0 "Hãy kiên nhẫn, để mọi chuyện diễn ra, rồi hãy phán xét."
 
 child_personality.7100.t:0 "Đột Nhập Kho Vũ Khí"
 child_personality.7100.desc:0 "Cuối cùng thì chúng ta cũng vào được! Tất cả vũ khí trong kho vũ khí đều nằm trong tầm tay, ôi thật vui! Đáng đời bọn người lớn hôi hám, ngu ngốc cố ngăn cản chúng ta!\n\n\"Nhìn này! Ta tìm thấy [other_child.Custom('SignatureWeaponArticle')] [other_child.Custom('signature_weapon')]!\" Đồng bọn của ta là [other_child.GetFirstName] kêu lên, [other_child.Custom('SignatureWeaponActionPresentParticiple')] vũ khí đó.\n\nKhi ta vươn tay lấy [child.Custom('SignatureWeaponArticle')] [child.Custom('signature_weapon')], ta nghe thấy một tiếng #EMP 'Á!'#! lớn phía sau – [other_child.GetFirstNameNoTooltip] đã tự làm mình bị thương [other_child.GetHerselfHimself], và có máu!\n\nTa nên làm gì đây?!"
 child_personality.7100.a:0 "Chúng ta phải thú nhận mọi chuyện #EMP ngay bây giờ!#!"
 child_personality.7100.b:0 "Kệ đi, đừng để máu dính vào quần áo ta. *[child.Custom('SignatureWeaponFlourishThirdPersonPresentParticiple')|U] [child.Custom('signature_weapon')]*"
 child_personality.7100.c:0 "TA PHẢI TÌM BĂNG NGAY LẬP TỨC!"
 child_personality.7101.t:0 "$child_personality.7100.t$"
 child_personality.7101.desc:0 "[ROOT.Char.Custom('CulturalCurse')|U]! Lũ trẻ đáng nguyền rủa đó, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] của ta là [child.GetFirstName] và đồng bọn của [child.GetHerHis] là [other_child.GetFirstName,] đã bị bắt quả tang khi lẻn vào kho vũ khí, chúng không biết vũ khí rất nguy hiểm sao?!\n\n"
 child_personality.honest.desc:0 "[other_child.GetFirstNameNoTooltip] đã tự làm mình bị thương [other_child.GetHerselfHimself], nhưng may mắn là [child.GetFirstNameNoTooltip] đã chạy ra ngoài và kéo người lớn gần nhất lại, thừa nhận tất cả những gì chúng đã làm.\n\n[child.GetFirstNameNoTooltip] trông thực sự đau khổ, ta không nghĩ [child.GetSheHe] sẽ còn dám gian dối nữa đâu."
 child_personality.arbitrary.desc:0 "Một người hầu đã bắt gặp chúng ngay tại chỗ. [other_child.GetFirstNameNoTooltip] đang khóc và chảy máu trên sàn, trong khi [child.GetFirstNameNoTooltip] vẫn tiếp tục chơi với [child.GetHerHis] [child.Custom('signature_weapon')] bị đánh cắp...\n\nRõ ràng [child.GetFirstNameNoTooltip] không muốn #EMP 'ngừng vui chỉ vì [other_child.GetFirstNameNoTooltip] làm hỏng mọi thứ'#!, không biết đứa [child.Custom('GirlBoy')] đó rồi sẽ ra sao..."
 child_personality.impatient.desc:0 "[child.GetFirstNameNoTooltip] bị một người hầu bắt gặp sau khi [child.GetSheHe] làm đổ một bộ giáp trong lúc tìm băng gạc cho [other_child.GetFirstNameNoTooltip], người đã tự làm mình bị thương [other_child.GetHerselfHimself].\n\nCó vẻ như [child.GetFirstNameNoTooltip] thích những kế hoạch vội vàng và thiếu suy nghĩ..."
 child_personality.7101.honest:0 "Ngươi đã làm đúng khi thú nhận."
 child_personality.7101.arbitrary:0 "Cũng dễ hiểu. Ai quan tâm [other_child.GetFirstNameNoTooltip] chứ?"
 child_personality.7101.impatient:0 "Lập tức hành động để cứu bạn mình? Đáng khen!"
 child_personality.7101.change.honest:0 "Ngươi đáng lẽ phải thú nhận lỗi lầm, đồ nhóc!"
 child_personality.7101.change.arbitrary:0 "Ngươi nên tiếp tục chơi, [other_child.GetFirstNameNoTooltip] có chết cũng mặc."
 child_personality.7101.change.impatient:0 "Sao ngươi không giúp [other_child.GetHerHim] #EMP ngay lập tức?!#!"
 
 child_personality.7200.t:0 "Hang Tối"
 child_personality.7200.desc:0 ""Ngươi muốn [other_child.Custom('child_favorite_toy')] của ngươi à? Hả? #EMP Vậy thì tự vào mà lấy!#!" [other_child.GetFirstName] hét lên, ném món [other_child.Custom('child_favorite_toy')] của đứa [other_child.Custom('GirlBoy')] kia sâu vào trong hang tối u ám. Đứa [other_child.Custom('GirlBoy')] nhỏ bắt đầu khóc nức nở.\n\n"Giờ thì nó sẽ làm bạn với #EMP nhện#! và #EMP rắn#!! Mất rồi, mãi mãi!" [other_child.GetFirstNameNoTooltip] kêu lên, cười lớn.\n\nSao [other_child.GetFirstNameNoTooltip] có thể ác độc với đứa [other_child.Custom('GirlBoy')] tội nghiệp đó như vậy!? Cái hang đầy những thứ bò lúc nhúc đáng sợ... nhưng ta #EMP phải#! làm gì đó!"
 child_personality.7200.a:0 "Đừng sợ, ta sẽ lấy lại [other_child.Custom('child_favorite_toy')] cho ngươi!"
 child_personality.7200.b:0 "Lính đâu! #EMP Bắt#! [other_child.GetFirstNameNoTooltip] vào lấy lại."
 child_personality.7200.c:0 "Ta TỨC ĐIÊN! Ta sẽ đánh ngươi nhừ tử!"
 child_personality.7201.t:0 "$child_personality.7200.t$"
 child_personality.7201.desc:0 "Một trong những đứa trẻ ở triều đình, [other_child.GetFirstName], đã lấy [other_child.Custom('child_favorite_toy')] của một [other_child.Custom('GirlBoy')] nhỏ hơn rồi ném vào cái hang gần đó. [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] của ta đã ở đó và chứng kiến tất cả.\n\n"
 child_personality.brave.desc:0 "[child.GetSheHe|U] chạy vào hang và không bước ra trong gần nửa giờ! Nhưng khi [child.GetSheHe] quay lại, nó đã lấy lại được món đồ chơi, khiến [other_child.GetFirstNameNoTooltip] rất khó chịu.\n\nThật dũng cảm, mặc dù có lẽ hơi ngu ngốc."
 child_personality.stubborn.desc:0 "[child.GetFirstNameNoTooltip] đã bắt lấy đám lính canh trong nhà và ép [other_child.GetFirstNameNoTooltip] phải đi vào hang! Tiếng thét kinh hoàng của [other_child.GetFirstNamePossessiveNoTooltip] vang lên suốt vài phút trước khi [other_child.GetSheHe] xuất hiện cùng món đồ chơi.\n\nCó vẻ như khi [child.GetFirstName] cho rằng điều gì là đúng đắn, [child.GetSheHe] sẽ không dừng lại cho đến khi [child.GetSheHe] thực hiện được nó..."
 child_personality.wrathful.desc:0 "[child.GetFirstNameNoTooltip] nổi trận lôi đình và đánh [other_child.GetFirstNameNoTooltip] máu me bê bết! Điều này chẳng giúp ích gì cho đứa trẻ [other_child.Custom('GirlBoy')] nhỏ hơn, nó càng khóc to hơn...\n\nCó vẻ như [child.GetFirstNameNoTooltip] gặp khó khăn trong việc kiểm soát cơn giận [child.GetHerHis] của mình..."
 child_personality.7201.brave:0 "Lòng dũng cảm như vậy thật đáng khen!"
 child_personality.7201.stubborn:0 "Ý chí của ngươi đã được thực hiện."
 child_personality.7201.wrathful:0 "[other_child.GetFirstNameNoTooltip] cần phải trả giá cho những gì [other_child.GetSheHe] đã làm!"
 child_personality.7201.change.brave:0 "Ngươi đáng lẽ phải tự mình vào đó, không chút sợ hãi."
 child_personality.7201.change.stubborn:0 "Ngươi nên ép [other_child.GetFirstNameNoTooltip] vào lấy lại món đồ chơi."
 child_personality.7201.change.wrathful:0 "Sao ngươi không đấm thẳng vào mặt [other_child.GetFirstNameNoTooltip] ngay lúc đó!?"
 #XXX: "XXX"
