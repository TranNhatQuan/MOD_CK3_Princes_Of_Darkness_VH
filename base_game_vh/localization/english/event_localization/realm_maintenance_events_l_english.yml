l_english:
  realm_maintenance.1001.t:0 "Chủ Lãnh Mới"
  realm_maintenance.1001.t.ceremonial_regent: "Mới $game_concept_ceremonial_regent$"
  realm_maintenance.1001.conquest:0 "[new_liege.GetTitledFirstName] đã trở thành [liege|E] mới của Ngài thông qua quyền chinh phục"
  realm_maintenance.1001.conquest_holy_war:0 "[new_liege.GetTitledFirstName] đã trở thành [liege|E] mới của ngài sau khi giải phóng lãnh thổ của ngài khỏi sự cai trị [old_liege.Custom2('GetUnbelieverTermAdjective', ROOT.Char)] của [old_liege.GetTitledFirstNamePossessive]!"
  realm_maintenance.1001.conquest_claim:0 "$realm_maintenance.1001.conquest$"
  realm_maintenance.1001.conquest_populist:0 "[new_liege.GetTitledFirstName] đã trở thành [liege|E] mới của Ngài sau khi giải phóng đất đai khỏi [old_liege.Custom2('GetUnbelieverAndForeignerTerm', ROOT.Char)] [old_liege.GetTitledFirstName]!"
  realm_maintenance.1001.inheritance:0 "[new_liege.GetTitledFirstName] đã trở thành [liege|E] mới của Ngài sau khi thừa kế [titles|E] từ [old_liege.GetTitledFirstName]"
  realm_maintenance.1001.abdication:0 "[new_liege.GetTitledFirstName] đã trở thành [liege|E] mới của Ngài sau khi [old_liege.GetTitledFirstName] thoái vị khỏi ngai vàng của [old_liege.GetHerHis]"
  realm_maintenance.1001.destroyed:0 "[new_liege.GetTitledFirstName] đã trở thành [liege|E] mới của Ngài do [title|E] bị phá hủy"
  realm_maintenance.1001.created:0 "[new_liege.GetTitledFirstName] đã trở thành [liege|E] mới của Ngài do [title|E] được tạo ra"
  realm_maintenance.1001.usurped:0 "[new_liege.GetTitledFirstName] đã trở thành [liege|E] mới của Ngài sau khi chiếm đoạt [titles|E] từ [old_liege.GetTitledFirstName]"
  realm_maintenance.1001.granted:0 "[new_liege.GetTitledFirstName] đã trở thành [liege|E] mới của Ngài do được trao [titles|E] mới"
  realm_maintenance.1001.revoked:1 "[new_liege.GetTitledFirstName] đã trở thành [liege|E] mới của ngài kể từ khi [old_liege.GetTitledFirstName] bị thu hồi các tước hiệu của [old_liege.GetHerHis]"
  realm_maintenance.1001.election:0 "[new_liege.GetTitledFirstName] đã trở thành [liege|E] mới của Ngài sau khi thắng cử thay thế [old_liege.GetTitledFirstName]"
  realm_maintenance.1001.independency:0 "[new_liege.GetTitledFirstName] đã trở thành [liege|E] mới của Ngài do trở thành độc lập"
  realm_maintenance.1001.returned:0 "[new_liege.GetTitledFirstName] đã trở thành [liege|E] mới của ngài sau khi các tước hiệu của [new_liege.GetHerHis] được trả lại cho [new_liege.GetHerHim] từ [old_liege.GetTitledFirstName]"
  realm_maintenance.1001.leased_out:0 "[new_liege.GetTitledFirstName] đã trở thành [liege|E] mới của Ngài do thuê [title|E] từ [old_liege.GetTitledFirstName]"
  realm_maintenance.1001.lease_revoked:0 "[new_liege.GetTitledFirstName] đã trở thành [liege|E] mới của Ngài do thu hồi hợp đồng thuê của [old_liege.GetTitledFirstNamePossessive] trên [old_liege.GetHerHis] tước vị"
  realm_maintenance.1001.faction_demand:0 "[new_liege.GetTitledFirstName] đã thay thế [old_liege.GetTitledFirstName] làm [liege|E] của Ngài sau khi được cài đặt bởi [faction|E]"
  realm_maintenance.1001.swear_fealty:0 "Ngài đã tuyên thệ trung thành với [new_liege.GetTitledFirstName] và trở thành [vassal|E] của họ"
  realm_maintenance.1001.appointment: "[new_liege.GetTitledFirstName] đã thay thế [old_liege.GetTitledFirstName] làm [liege|E] của Ngài như ứng viên kế tiếp"
  realm_maintenance.1001.appointment_succession: "$realm_maintenance.1001.appointment$"
  realm_maintenance.1001.stepped_down: "[new_liege.GetTitledFirstName] đã trở thành [liege|E] mới của Ngài do [old_liege.GetTitledFirstName] từ chức"
  realm_maintenance.1001.error:1 "[new_liege.GetTitledFirstName] đã trở thành [liege|E] mới của Ngài, nhưng Ngài không biết lý do!"
 
  realm_maintenance.2001.t:0 "[ROOT.Char.GetTitleAsNameNoTooltip|U] Mới"
  realm_maintenance.2001.t_ceremonial_regent: "Quản Gia của [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]"
  realm_maintenance.2001.desc_murdered:0 "Sau cái chết thảm thương và #EMP đáng tiếc#! của [previous_holder.Custom2('MyCharacterIntroduction', ROOT.Char)], trách nhiệm dẫn dắt [title.GetTierAsNameNoTooltip] rộng lớn giờ đặt lên vai Ta."
  realm_maintenance.2001.desc_dead:0 "Với sự ra đi của [previous_holder.Custom2('MyCharacterIntroduction', ROOT.Char)], trách nhiệm dẫn dắt [title.GetTierAsNameNoTooltip|l] rộng lớn giờ đây đã đặt lên vai ta."
  realm_maintenance.2001.desc_alive:0 "Giờ đây trách nhiệm dẫn dắt cơ cấu mà người tiền nhiệm, [previous_holder.GetTitledFirstName], để lại thuộc về Ta."
  realm_maintenance.2001.desc:0 "\n\nTa rèn giũa bản thân mình vào một tư thế xứng đáng với một [ROOT.Char.GetTitleAsNameNoTooltip], đứng trước các chư hầu, và [ROOT.Char.Custom('quirk_pos_personal_present')]. Ồ, những điều mà ta sẽ đạt được!"
  realm_maintenance.2001.desc_ceremonial_regent: "Với nó là bổn phận nghiêm túc của Ta để dẫn dắt [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] nhân danh [ROOT.Char.GetPrimaryTitle.MakeScope.Var('administrative_ui_special_title').Title.GetHolder.GetTitledFirstName].\n\nTa ngồi trang nghiêm trước triều đình, tận hưởng khoảnh khắc, và [ROOT.Char.Custom('quirk_pos_personal_present')]. Ôi, những điều Ta sẽ thực hiện!"
  realm_maintenance.2001.a:0 "Chúc [ROOT.Char.GetTitleAsNameNoTooltip] trường thọ!"
  realm_maintenance.2001.a.ceremonial_regent: "Thật vinh dự lớn lao được giúp đỡ [ROOT.Char.GetPrimaryTitle.MakeScope.Var('administrative_ui_special_title').Title.GetHolder.GetTitleAsNameNoTooltip]!"
