l_english:
  tutorial.0001.t: "Một Diễn Biến Đáng Lo Ở Ennis"
  tutorial.0001.desc: "Đêm muộn, [potential_ally.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('potential_ally'))] của ta, đến gõ cửa phòng ta. Ta để [potential_ally.GetHerHim] vào, và [potential_ally.GetSheHe] thốt ra điều gì đó đầy rắc rối, biểu cảm của [potential_ally.GetHerHim] hoàn toàn nghiêm trọng. \n\n\"[GetPlayer.GetFirstNameNoTooltip], ngài đã nghe tin gì chưa? [bad_guy.GetTitledFirstName] đang ở giữa quá trình thiết lập một yêu sách giả mạo đối với lãnh thổ của ngài. Ta rất tiếc phải nói điều này, nhưng ta sợ [bad_guy.GetSheHe] đang chuẩn bị cho chiến tranh.\""
  tutorial.0001.a: "Ta sẽ nói chuyện với [bad_guy.GetTitledFirstNameNoTooltip]."
  tutorial.0001.a_flavor: "#TUT Khi chọn tùy chọn này, Ngài sẽ cố gắng kết bạn với [bad_guy.GetTitledFirstName], có thể tạo ra một [friend|e] mới và tránh hoàn toàn một [war|e].#!"

  tutorial.0001.b: "Ta không sợ những kẻ say rượu."
  tutorial.0001.b_flavor: "#TUT Khi chọn tùy chọn này, Ngài tuyên bố rằng Ngài không sợ một cuộc [war|e] tiềm tàng do [bad_guy.GetTitledFirstName] gây ra. Điều này mang lại cho Ngài một lượng [prestige|e] vừa phải."

  tutorial.0001.c: "Một khoản đóng góp nhỏ cho quỹ chiến tranh là cần thiết."
  tutorial.0001.c.tt.success: "Ngài thuyết phục được [potential_ally.GetTitledFirstNameNoTooltip]"
  tutorial.0001.c.tt.failure: "Ngài làm phật lòng [potential_ally.GetTitledFirstNameNoTooltip]"
  tutorial.0001.c_flavor: "#TUT Tùy chọn này cho phép Ngài cố gắng thuyết phục [potential_ally.GetTitledFirstName] giúp Ngài về tài chính. Nếu thuyết phục được [potential_ally.GetHerHim], khoản [gold|e] thêm có thể hữu ích trong việc ngăn chặn hoặc giành chiến thắng trong một [war|e].#!"


  tutorial.0002.t: "[bad_guy.GetTitledFirstNameNoTooltip] Chuẩn Bị Chiến Tranh"
  tutorial.0002.desc: "Ta một lần nữa được tiếp cận bởi [potential_ally.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('potential_ally'))] của ta, đôi môi [potential_ally.GetHerHis] cong lên một nụ cười ngượng nghịu. [potential_ally.GetSheHe|U] hắng giọng đầy khó chịu. \n\n\"[GetPlayer.GetFirstNameNoTooltip], bạn của ta! Có một diễn biến nhỏ liên quan đến [bad_guy.GetTitledFirstName]. Ngài thấy đấy, tuần trước chúng tôi đi uống rượu, và ta đã bắt gặp [bad_guy.GetHerHim] khoe khoang về các kế hoạch xâm lược của mình.\"\n\n\"Ta sợ ngài không còn nhiều thời gian trước khi [bad_guy.GetSheHe] thực hiện bước đi của [bad_guy.GetHerHis].\""
 
  tutorial.0002.a: "Phải có cách khác..."
  tutorial.0002.a_flavor: "#TUT Tùy chọn này cho phép Ngài cố gắng nói chuyện thỏa thuận với [bad_guy.GetTitledFirstName]. Có khả năng [bad_guy.GetSheHe] sẽ lắng nghe [diplomacy|e] của Ngài, nhưng cũng có rủi ro rằng [bad_guy.GetSheHe] sẽ tức giận.#!"
  tutorial.0002.a.tt: "Ngài lập một [alliance|e] với [bad_guy.GetTitledFirstName]"
  tutorial.0002.a.tt.crit_success: "Ngài đưa ra một lý lẽ #EMP rất#! thuyết phục"
  tutorial.0002.a.tt.success: "Ngài đưa ra một lập luận khá ổn"
  tutorial.0002.a.tt.failure: "Ngài làm phật lòng [bad_guy.GetTitledFirstNameNoTooltip]"

  tutorial.0002.b: "Hah! Một kẻ trêu chọc, [bad_guy.GetFirstNameNoTooltip]."
  tutorial.0002.b_flavor: "#TUT Vì Ngài là [friends|e] với [bad_guy.GetTitledFirstName], Ngài biết rằng dù [bad_guy.GetSheHe] nói to mồm, [bad_guy.GetSheHe] thực sự không âm mưu gì cả.#!"

  tutorial.0002.c: "Ta mệt với những trò chơi này. [bad_guy.GetFirstNameNoTooltip] sẽ phải khuất phục trước #EMP Ta. #!"
  tutorial.0002.c_flavor: "#TUT Tùy chọn này cho phép Ngài cố gắng biến [bad_guy.GetTitledFirstNameNoTooltip] thành một [vassal|e] dưới quyền cai trị của Ngài. Để làm điều này, Ngài sẽ phải chiến thắng một [war|e] với [bad_guy.GetHerHim]!#!"
