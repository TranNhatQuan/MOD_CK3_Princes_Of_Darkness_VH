l_english:
  title_event_francia_name_change.title:0 "Kết Thúc Một Thời Đại"
  title_event_francia_name_change.desc:0 "Triều đại Karling đã chính thức khép lại!\n\n[francia_title.GetName] cuối cùng đã tuột khỏi tay họ. Khi dòng Karlings bị loại bỏ, những vùng đất này thật sự không còn thuộc đế chế cũ của họ nữa.\n\nVới Ta là [ROOT.Char.GetTitleAsNameNoTooltip] tương lai, chúng ta đang bước vào một vận mệnh mới rực rỡ. Vì vậy, thật thích hợp khi loại bỏ #EMP tất cả những#! dấu vết ảnh hưởng của họ. Bao gồm cả #EMP tên gọi#! của họ!"
  title_event_francia_name_change.a:0 "Một kỷ nguyên mới bắt đầu!"
  title_event_francia_name_change.a_tt_1:0 "[francia_title.GetName] đổi tên thành #high $k_france$#!"
  title_event_francia_name_change.a_tt_2:0 "[francia_title.GetName] đổi tên thành #high $k_germany$#!"

  title_event.0012.t:0 "Chia Vương Miện"
  title_event.0012.desc:0 "Với sự thành lập của [castille.GetName], và ngai vàng cũ của [asturias.GetBaseNameNoTier] bỏ trống, Vương quốc Pelagius cuối cùng đã trở nên quá lớn. Phần còn lại sẽ mãi được gọi là [leon.GetBaseNameNoTier], ít nhất cho đến khi nó cũng bị lu mờ bởi sự trỗi dậy của [castille.GetBaseNameNoTierNoTooltip]."
  title_event.0012.a:0 "Đúng như lẽ phải."

  title_event.0013.t:0 "$title_event.0012.t$"
  title_event.0013.desc:0 "Giờ đây Ta nắm giữ cả ngai vàng của [asturias.GetBaseNameNoTier] và một [castille.GetBaseNameNoTier] riêng biệt, ý tưởng về một [asturias.GetNameNoTooltip] thống nhất được nhiều người xem là hơi rối rắm và phần nào thừa thãi.\n\nThay vào đó, quý tộc và dân thường đều bắt đầu gọi nửa phía tây của vùng đất Ta bằng cách nhắc đến phần nội địa chiếm ưu thế, [leon.GetBaseNameNoTier]."
  title_event.0013.a:0 "Hai vương miện vẫn tốt hơn một!"

  title_event.0014.t:0 "$title_event.0012.t$"
  title_event.0014.desc:0 "Việc thành lập gần đây một [castille.GetBaseName] độc lập, do [castille_char.Custom2('MyCharacterIntroduction' leon_char)] cai trị, đã phá vỡ tuyên bố của vương quốc Ta về việc là [asturias.GetBaseName].\n\nVới vùng đất phía đông chắc chắn đã mất, chúng Ta bị chi phối bởi nội địa [leon.GetBaseNameNoTier], và người dân mọi tầng lớp và tôn giáo đều để tên gọi cũ rơi vào lãng quên."
  title_event.0014.a:0 "Những kẻ chia rẽ!"
  title_event.0014.b:0 "Một ngày nào đó chúng ta sẽ lấy lại những vùng đất đó..."
  title_event.0014.c:0 "Hoan hô! Một #EMP vương quốc toàn Bạn Bè#!"

  title_event.0015.t:0 "$title_event.0012.t$"
  title_event.0015.desc:0 "Với việc thành lập gần đây của [castille.GetBaseName], [leon_char.Custom2('MyCharacterIntroduction', castille_char)] không còn thực sự cai trị một [asturias.GetBaseNameNoTier] thống nhất nữa.\n\nThiếu lực cân bằng từ vùng đất phía đông của Ta, vùng trước-[asturias.GetBaseNameNoTierNoTooltip] thực ra chỉ còn là [leon.GetBaseName]. Dân thường, giáo sĩ, và thậm chí cả quý tộc đều bắt đầu gọi như vậy, làm Ta không khỏi bực mình."
  title_event.0015.a:0 "Quyền lực đã trở lại đúng chỗ vốn có."
  title_event.0015.b:0 "Hôm nay, Castile. Ngày mai, #EMP Leon#!."
  title_event.0015.c:0 "Chúng ta có thể chia sẻ quyền lực, nhưng dòng máu vẫn là một!"
