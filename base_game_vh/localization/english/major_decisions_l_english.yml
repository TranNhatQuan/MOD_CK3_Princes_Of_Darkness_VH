l_english:
  major_decisions.1001.t:0 "Xác Thịt Thần Thánh"
  major_decisions.1001.desc:0 ""Chúng ta được đặt trên trần gian này để phục vụ đồng loại," giọng của [court_chaplain.GetCouncilTitle] [court_chaplain.GetNamePossessive] vang lên trong phòng ăn."
  major_decisions.1001.desc_landless: ""Phục vụ đồng loại; điều đó bao gồm những gì?" Ta hỏi tu từ khi ánh mắt sắc bén đi khắp khuôn mặt các thần dân quanh bàn tiệc đầy ắp. "Chẳng phải là yêu thương và chăm sóc mọi mặt của con người sao?""
  major_decisions.1001.desc_outro: "\n\n"Bằng việc nhận món quà thịt, ngươi cũng chấp nhận tình yêu của [ROOT.Char.GetFaith.HighGodHerHis|U]."\n\nNhững người hầu — những người còn ở lại — đã làm việc xuất sắc; chúng Ta ăn uống thịnh soạn suốt đêm, say sưa với [ROOT.Char.Custom('RegionalDrink')] và hương vị của thần tính con người.""
  major_decisions.1001.a:0 "Giúp ta một tay và đưa thêm [ROOT.Char.Custom('RegionalDrink')]!"

  major_decisions.1002.t: "Bữa Tiệc Ma Quái"
  major_decisions.1002.desc:0 "Ta không thể tin vào những gì mình nghe: toàn bộ triều đình của [cannibal.GetName] – thậm chí cả [cannibal.GetHerHis] [court_chaplain.GetCouncilTitle] – đã trở thành những kẻ ăn thịt người!\n\nCác con đường đỏ lửa máu khi nhóm địa ngục của [cannibal.GetHerHis] đang tiệc tùng."
  major_decisions.1002.desc_landless: "Ta không thể tin vào những gì mình nghe: toàn bộ [cannibal.Custom('GetCourt')|l] của [cannibal.GetName] đã trở thành kẻ ăn thịt người!\n\nVùng quê sẽ nhuộm đỏ máu khi nhóm địa ngục của [cannibal.GetHerHis] tiệc tùng."
  major_decisions.1002.desc_cannibal:0 "[cannibal.GetName] đã thuyết phục [cannibal.GetHerHis] [court_chaplain.GetCouncilTitle] công khai chấp nhận ăn thịt người.\n\nTa vui mừng khi biết sở thích thịt người đang lan rộng hơn bao giờ hết!"
  major_decisions.1002.desc_cannibal_landless: "[cannibal.GetName] và [cannibal.GetHerHis] [cannibal.Custom('GetCourt')|l] đã công khai hưởng ứng sự tuyệt vời của việc ăn thịt người.\n\nĐừng lạnh nhạt với [cannibal.GetHerHim] — Ta vui mừng khi biết sở thích thịt người lan rộng hơn bao giờ hết!"
  major_decisions.1002.a:0 "Ta nóng lòng được dùng bữa với [ROOT.Char.GetHerHim]!"
  major_decisions.1002.b:0 "Nguyện [ROOT.Char.GetFaith.HighGodName] thương xót linh hồn ác độc của họ!"

  major_decisions.1101.t:0 "Một Vương Quốc Tái Lập"
  major_decisions.1101.opening_duchies:0 "Ta đã làm được điều không ai khác có thể. Ta đã thống nhất các vùng đất của [duchy_1.GetNameNoTierNoTooltip] với [duchy_2.GetNameNoTierNoTooltip] và [duchy_3.GetNameNoTierNoTooltip]."
  major_decisions.1101.desc:0 "Cả đời Ta đã làm việc cho điều này. Gọi các chư hầu và khiến họ tuyên thệ trung thành lần nữa.\n\nGiờ đây và mãi mãi, họ sẽ tôn kính Ta không chỉ là bệ hạ, mà còn là [ROOT.Char.GetTitleAsNameNoTooltip]! [ROOT.Char.GetTitleAsNameNoTooltip] của [new_title.GetNameNoTier]!"
  major_decisions.1101.a:0 "Vương quốc của Ta sẽ tồn tại vĩnh viễn."
  major_decisions.1101.i_have_become_royal:0 "Ngươi đã trở thành [founder.GetTitleAsNameNoTooltip] của [new_title.GetNameNoTier]"

  major_decisions.1102.desc:0 "Chúa tể của chúng ta đã triệu tập các chư hầu của [founder.GetHerHis] cùng tất thảy bề tôi trong vương quốc đến trước mặt [founder.GetHerHim]. Chúng ta biết đã đến lúc, và sẽ chẳng có ai tranh cãi về yêu sách của [founder.GetHerHis].\n\n[founder.GetFirstName] sẽ cai trị với tư cách là [new_title.GetTierAsNameNoTooltip] của vương quốc [new_title.GetNameNoTier] vĩ đại!"
  major_decisions.1102.a:0 "Vạn tuế [founder.GetTitleAsNameNoTooltip]!"
  major_decisions.1102.a.dislike:0 "Vạn tuế [founder.GetTitleAsNameNoTooltip]..."
  major_decisions.1102.has_become_royal:0 "[founder.GetFirstName] đã trở thành [founder.GetTitleAsNameNoTooltip] của [new_title.GetNameNoTier]"

  major_decisions.1103.opening_kingdoms:0 "Ta đã làm được điều không ai khác có thể. Ta đã thống nhất các vùng đất của [kingdom_1.GetNameNoTierNoTooltip] với [kingdom_2.GetNameNoTierNoTooltip] và [kingdom_3.GetNameNoTierNoTooltip]."
  major_decisions.1103.opening:0 "Tất cả chư hầu và [ROOT.Char.GetFaith.PriestNeuterPlural] cuối cùng đã tập trung trước ngai vàng của Ta. Ta xứng đáng với khoảnh khắc này trong mắt họ và quan trọng hơn, trong mắt [ROOT.Char.GetFaith.PantheonTerm]."
  major_decisions.1103.i_am_religious_head:0 "\n\nĐúng ra là Ta phải đặt vương miện lên đầu mình, khi các thần dân, cả trần tục và tâm linh, cúi chào Ta."
  major_decisions.1103.blessed_by_religious_head:0 "\n\nKhi [religious_figure.GetTitledFirstName] đặt vương miện lên đầu Ta, Ta tuyên bố đế chế mới. Đây là điều các chư hầu chứng kiến, và khi lời tuyên bố rời khỏi môi Ta, tất cả quyền lực của vương quốc, cả tâm linh lẫn trần thế, đều quỳ trước Ta."
  major_decisions.1103.a:0 "[new_title.GetNameNoTierNoTooltip] trị vì tối cao!"

  major_decisions.1104.opening:0 "[founder.GetFirstName], [founder.GetLadyLord] và người cai trị, đã triệu tập tất cả chư hầu và [founder.GetFaith.PriestNeuterPlural] đến trước mặt [founder.GetHerHim]. Ta không thể phủ nhận rằng [founder.GetSheHe] xứng đáng với khoảnh khắc này trong mắt [ROOT.Char.GetFaith.PantheonTerm]."
  major_decisions.1104.i_am_religious_head:0 "\n\nKhi ta đặt chiếc vương miện mới của [founder.GetHerHis] lên đầu [founder.GetHerHis],"
  major_decisions.1104.religious_head_empire:0 "\n\nKhi [founder.GetSheHe] đặt chiếc vương miện mới của [founder.GetHerHis] lên đầu [founder.GetHerHis],"
  major_decisions.1104.blessed_by_religious_head:0 "\n\n\n\nKhi [religious_figure.GetTitledFirstName] đặt vương miện mới của [founder.GetTitledFirstNamePossessive] lên đầu [founder.GetHerHis],"
  major_decisions.1104.end:0 "[founder.GetFirstName] tuyên bố đây chính là khởi nguyên vương quốc mới của [founder.GetHerHis]. Các bề tôi của [founder.GetHerHis|U] cúi đầu tôn kính trước [founder.GetHerHim]."
  major_decisions.1104.a:0 "[new_title.GetNameNoTierNoTooltip] sẽ sống mãi!"

  major_decisions.1105.t:0 "Vương Quốc Xâm Lược"
  major_decisions.1105.desc:0 ""[founder.GetTitleAsNameNoTooltip]" [founder.GetFirstName] của [new_title.GetNameNoTierNoTooltip] đã tuyên bố một Vương quốc mới, và rằng một phần lãnh thổ #EMP của ta#! thuộc về nó!"
  major_decisions.1105.a:0 "Kẻ xâm lược đó sẽ không tồn tại lâu..."

 
  major_decisions.2001.t:0 "Đại Học"
  major_decisions.2001.desc_first:0 "Một kỷ nguyên tri thức mới đang đến! Ta đã gặp một dòng người xây dựng và các học giả liên tục, và các kế hoạch cho đại học tráng lệ đang dần hình thành.\n\n"
  major_decisions.2001.desc_more:0 "Người trưởng xây dựng thông báo với Ta rằng gạch để xây dựng đại học đã sẵn sàng — tất cả những gì còn lại là quyết định vị trí và tên gọi!"
  major_decisions.2001.desc:0 "Người trưởng xây dựng thông báo rằng gạch để xây đại học đã sẵn sàng — tất cả còn lại chỉ là quyết định tên gọi!"
  major_decisions.2001.b_fes:0 "Ta sẽ lập Đại học al-Qarawiyyin!"
  major_decisions.2001.b_cairo:0 "Ta sẽ lập Đại học Al-Azhar!"
  major_decisions.2001.b_bologna:0 "Ta sẽ lập Đại học Bologna!"
  major_decisions.2001.b_salamanca:0 "Ta sẽ lập Đại học Salamanca!"
  major_decisions.2001.b_madrid:0 "Ta sẽ lập Đại học Complutense Madrid!"
  major_decisions.2001.b_oxford:0 "Ta sẽ lập Đại học Oxford!"
  major_decisions.2001.b_cambridge:0 "Ta sẽ lập Đại học Cambridge!"
  major_decisions.2001.b_padua:0 "Ta sẽ lập Đại học Padua!"
  major_decisions.2001.b_siena:0 "Ta sẽ lập Đại học Siena!"
  major_decisions.2001.b_coimbra:0 "Ta sẽ lập Đại học Coimbra!"
  major_decisions.2001.b_napoli:0 "Ta sẽ lập Đại học Thánh La Mã Napoli!"
  major_decisions.2001.b_tirakka:0 "Ta sẽ lập Đại học Sankoré!"
  major_decisions.2001.fallback:0 "Hôm nay Ta sẽ lập… nhưng chưa có đại học nào."
  major_decisions.2001.fallback.tt:0 "Sự phát triển của hạt quá thấp, hoặc đã có một ô công trình đặc biệt"

  major_decisions.2002.desc:1 "Một kỷ nguyên tri thức mới đã đến; một đại học đã được lập tại vương quốc của [founder.GetName]. Nó nhanh chóng trở thành trung tâm cho các học giả và người thông thái, được coi là môi trường lý tưởng để thanh niên học Trivium và Quadrivium, cùng tất cả những gì cần thiết để hiểu thế giới."
  major_decisions.2002.a:1 "Nguyện tri thức của họ mang lợi cho tất cả chúng ta!"

  major_decisions.2011.t:0 "Người Khôn Ngoan [new_courtier.GetWomanMan|U]"
  major_decisions.2011.desc:0 "[new_courtier.GetName], một [new_courtier.GetWomanMan] vừa [ROOT.Char.Custom2('DescriptorPositive', SCOPE.sC('new_courtier') )] vừa khôn ngoan, chào đón Ta một cách lịch thiệp.\n\n"Ta đã nghe về Đại học mới của ngài! Một [ROOT.Char.GetTitleAsNameNoTooltip] ủng hộ tri thức đến mức này… Ta sẽ vinh dự được phục vụ ngài.""
  major_decisions.2011.a:0 "Chào mừng, chào mừng!"
  major_decisions.2011.b:0 "Ngươi sẽ không tìm thấy chỗ cho mình ở đây."

  major_decisions.3001.t:0 "Ngôi Nhà Xanh Tươi"
  major_decisions.3001.desc:0 "Xung quanh Ta, cây cối phát triển um tùm, nước đọng trên kính khi mặt trời chiếu qua và rọi lên khuôn mặt Ta. Ta xoay vòng — càng lúc càng nhanh — và tung áo khoác xuống đất vui sướng khi cười.\n\n"Mặt trời cũng ở đây với chúng ta; quả thật xứng đáng với số tiền đã bỏ ra!""
  major_decisions.3001.a:0 "Ta đã thuần hóa ánh nắng!"

  major_decisions.3002.desc:0 "[builder.GetName] thật điên rồ! [builder.GetSheHe|U] đã tiêu một gia tài để xây một công trình hoàn toàn bằng kính và tuyên bố mặt trời đã bị thuần phục.\n\nCác báo cáo về cây cối phát triển chắc chắn chỉ là sản phẩm của ảo tưởng [builder.GetHerHis]. Liệu trò hề của tên [builder.GetWomanMan] điên rồ đó có bao giờ kết thúc?!"
  major_decisions.3002.a:0 "Chuyện này thật nực cười!"

  major_decisions.3100.t:0 "Vấn Đề Thừa Kế"
  major_decisions.3100.desc:0 "Câu hỏi ai sẽ kế thừa Ta sau khi Ta qua đời đã liên tục ám ảnh Ta gần đây, mối đe dọa chia cắt vương quốc luôn hiện hữu trong tâm trí.\n\nDĩ nhiên, mặc dù thường khó thuyết phục vương quốc chấp nhận trật tự kế vị mới, nhưng có thể #EMP dễ dàng hơn#! để quay về những cách cũ..."
  major_decisions.3100.a:0 "Những tập tục cổ xưa của dân ta là tốt nhất!"
  major_decisions.3100.d:0 "Eh, nghĩ lại, chia phần có lẽ công bằng hơn."
  major_decisions.3100.tt_opinion_witengamot:1 "Các chư hầu của [cultures|E] theo $tradition_the_witenagemot_name$ [culture_tradition|E]"
  major_decisions.3100.tt_opinion_thing:1 "Các chư hầu của [cultures|E] thuộc $heritage_north_germanic_name$ [heritage|E]"
  major_decisions.3100.tt_opinion_tanistry:1 "Các chư hầu của [cultures|E] thuộc $heritage_goidelic_name$ [heritage|E]"
  major_decisions.3100.tt_opinion_jirga: "Các chư hầu của [cultures|E] theo $tradition_fp3_jirga_name$ [culture_tradition|E]"
