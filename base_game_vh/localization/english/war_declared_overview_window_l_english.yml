l_english:
  WAR_DECLARED_OVERVIEW_DISMISS:0 "Tập hợp binh sĩ!"
 #WAR_DECLARED_OVERVIEW_DISMISS_TOOLTIP:1 "" delete this
  WAR_DECLARED_OVERVIEW_FLAVOR:0 "[WAR.Custom('WarDeclaredOpening')][WAR.Custom('WarDeclaredFlavor')]"

  war_declared_opening.neutral:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateGreeting',ROOT.War.GetActiveCB.GetDefender)]\n\n"
  war_declared_opening.negative:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateGreetingNegative',ROOT.War.GetActiveCB.GetDefender)]\n\n"

  war_declared_flavor.zealous:0 "Những tội lỗi tà ác của ngươi đã không bị trừng phạt quá lâu. Hôm nay mọi sự sẽ đổi thay, bởi ta đến để giáng xuống ngươi sự báo ứng thiêng liêng! [ROOT.War.GetActiveCB.GetAttacker.Custom('ZealousDoW')]"
  war_declared_flavor.zealous.mercifulgod:2 "Cầu xin [ROOT.Char.GetFaith.HighGodName] rủ lòng thương xót ngươi, bởi ta sẽ chẳng ban cho ngươi chút nhân từ nào!"
  war_declared_flavor.zealous.reincarnation:0 "Cầu cho kiếp sau của ngươi bớt khốn khổ hơn kiếp này."
  war_declared_flavor.zealous.fallback:2 "Ta không thể thua, bởi [ROOT.Char.GetFaith.HighGodName] ở cùng ta!"
  war_declared_flavor.naughty:0 "Ngươi quả là một [ROOT.War.GetActiveCB.GetDefender.Custom('GirlBoy')] hư hỏng. Hành vi ấy không thể bỏ qua! Hãy chuẩn bị tinh thần, bởi trên chiến trường ta sẽ giáng xuống ngươi hình phạt xứng đáng!"
  war_declared_flavor.holy_war:1 "Tôn giáo giả dối của ngươi đã khiến thần dân chìm trong bóng tối quá lâu. Nhân danh [ROOT.War.GetActiveCB.GetAttacker.GetFaith.HighGodName], ta sẽ mang đức tin chân chính đến cho họ và giải phóng họ khỏi sự báng bổ của ngươi!"
  war_declared_flavor.greedy:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] Ta đã thèm khát lãnh địa của ngươi từ lâu, nhưng luôn bị khước từ quyền sở hữu. Thế là đủ rồi! Đã đến lúc ta giành lấy thứ vốn thuộc về ta!"
  war_declared_flavor.dejure:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] Việc ngươi chiếm giữ những vùng đất vốn thuộc về ta theo lẽ phải không thể tiếp tục dung thứ. Đã đến lúc chúng phải được hoàn trả!"
  war_declared_flavor.subjugation:0 "Ta đã quyết định sáp nhập lãnh địa của ngươi vào vương quốc của ta. Hãy quy phục ngay, ta sẽ ban cho ngươi lòng khoan dung... Chống cự, và ta sẽ buộc ngươi quỳ gối trước mặt ta!"
  war_declared_flavor.subjugation.tribal:0 "Ngươi yếu đuối, còn ta hùng mạnh. Chỉ thế thôi cũng đủ để ta đến và lấy bất cứ thứ gì ta muốn từ ngươi!"
  war_declared_flavor.subjugation.arrogant:0 "Thật ngạo mạn khi ngươi dám tự xưng ngang hàng với ta, trong khi ta vượt trội hơn ngươi về mọi mặt! Ta sẽ nghiền nát đội quân thảm hại của ngươi và buộc ngươi phải quỳ dưới chân ta!"
  war_declared_flavor.conquest:0 "Ngươi là một kẻ trị vì yếu kém và không xứng đáng với những vùng đất mình nắm giữ. Ta sẽ cho ngươi thấy một quân vương chân chính là thế nào — khi ta đoạt lấy chúng khỏi tay ngươi!"
  war_declared_flavor.peasant:0 "Sự ngạo mạn của ngươi không biết điểm dừng. Đừng lo, chẳng bao lâu nữa ngươi sẽ được dạy cho một bài học về khiêm nhường!"
  war_declared_flavor.populist:1 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('NegativeSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] Nếu ngươi muốn chiến tranh, thì ngươi sẽ có nó! Không ai có thể ngăn chúng ta dựng nên một vương quốc mới cho chính mình!"
  war_declared_flavor.independence:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('NegativeSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] Chúng ta đã sống dưới ách cai trị của ngươi quá lâu. Chúng ta không thể chịu đựng thêm nữa — bằng máu và thép, chúng ta sẽ giành lấy tự do!"
  war_declared_flavor.liberty:1 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('NegativeSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] Chúng ta không thể dung thứ những luật lệ hà khắc xâm phạm quyền cổ xưa của mình. Bằng lưỡi gươm, những luật lệ ấy sẽ bị chặt đứt!"
  war_declared_flavor.claimant:1 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('NegativeSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] Ngươi chỉ là kẻ tiếm quyền và bạo chúa. Đã đến lúc khôi phục vị quân vương chính danh lên ngai vàng!"
  war_declared_flavor.retraction_refused:0 "$char_interaction.0221.desc$"
  war_declared_flavor.revocation_refused:0 "$char_interaction.0201.desc$"
  war_declared_flavor.imprisonment_refused:0 "Ta gọi ngươi là bạo chúa và khước từ phục tùng quyền uy của ngươi! Lãnh địa sẽ vùng dậy chống lại ách thống trị tàn độc của ngươi!"
  war_declared_flavor.fallback:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] Có vẻ như không còn con đường nào khác để giải quyết tranh chấp ngoài việc phân định trên chiến trường."
  is_war_overview_tab_open_trigger:0 "Đang mở thẻ tổng quan chiến tranh"
