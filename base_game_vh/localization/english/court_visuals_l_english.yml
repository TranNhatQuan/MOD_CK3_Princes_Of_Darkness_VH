  COURT_VISUAL_BYZANTINE_1_G1_TITLE: "Chrysotriklinos"
  COURT_VISUAL_BYZANTINE_1_G1_DESC: "Một sảnh nghị triều hoàng gia có mái vòm bằng đá cẩm thạch và khảm đá quý, nơi Hoàng đế trị vì dưới ánh nhìn của các vị thánh."
  COURT_VISUAL_BYZANTINE_1_G2_TITLE: "Chrysotriklinos"
  COURT_VISUAL_BYZANTINE_1_G2_DESC: "Một sảnh nghị triều mái vòm rộng lớn bằng đá cẩm thạch và khảm đá quý, nơi Hoàng đế trị vì dưới ánh nhìn của các vị thánh."
  COURT_VISUAL_BYZANTINE_1_G3_TITLE: "Chrysotriklinos"
  COURT_VISUAL_BYZANTINE_1_G3_DESC: "Một sảnh nghị triều mái vòm tráng lệ bằng đá cẩm thạch và khảm đá quý, nơi Hoàng đế trị vì dưới ánh nhìn che chở của các vị thánh."
  COURT_VISUAL_CHINESE_1_G1_TITLE: "Thiên Điện"
  COURT_VISUAL_CHINESE_1_G1_DESC: "Một đại điện uy nghiêm với những cột trụ đỏ son và màn lụa rủ, nơi Thiên mệnh trị vì trên ngai vàng có lọng che."
  COURT_VISUAL_CHINESE_1_G2_TITLE: "Thiên Điện"
  COURT_VISUAL_CHINESE_1_G2_DESC: "Một tòa đại điện rộng lớn với những cột trụ đỏ son và màn lụa rủ, nơi Thiên mệnh trị vì trên ngai vàng có lọng che."
  COURT_VISUAL_CHINESE_1_G3_TITLE: "Thiên Điện"
  COURT_VISUAL_CHINESE_1_G3_DESC: "Một tòa đại điện lộng lẫy với những cột trụ đỏ son và màn lụa rủ, nơi Thiên mệnh trị vì trên ngai vàng có lọng che."  
  COURT_VISUAL_CHINESE_2_G1_TITLE: "Long Mệnh Điện"
  COURT_VISUAL_CHINESE_2_G1_DESC: "Một sảnh điện xa hoa, dù không mang tính lịch sử, nơi những hình rồng uốn lượn tôn vinh bậc quân chủ được trời cao chọn lựa."
  COURT_VISUAL_CHINESE_2_G2_TITLE: "Long Mệnh Điện"
  COURT_VISUAL_CHINESE_2_G2_DESC: "Một tòa đại điện xa hoa và rộng lớn, dù không mang tính lịch sử, nơi những hình rồng uốn lượn tôn vinh bậc quân chủ được trời cao chọn lựa."
  COURT_VISUAL_CHINESE_2_G3_TITLE: "Long Mệnh Điện"
  COURT_VISUAL_CHINESE_2_G3_DESC: "Một tòa đại điện xa hoa và tráng lệ, dù không mang tính lịch sử, nơi những hình rồng uốn lượn tôn vinh bậc quân chủ được trời cao chọn lựa."
  COURT_VISUAL_INDIAN_1_G1_TITLE: "Sabha Mandapa"
  COURT_VISUAL_INDIAN_1_G1_DESC: "Một sảnh triều nghị có cột trụ uy nghiêm bằng đá chạm khắc và họa tiết vẽ tay, nơi các quân chủ thiết triều."
  COURT_VISUAL_INDIAN_1_G2_TITLE: "Sabha Mandapa"
  COURT_VISUAL_INDIAN_1_G2_DESC: "Một sảnh triều nghị có cột trụ rộng lớn bằng đá chạm khắc và họa tiết vẽ tay, nơi các quân chủ thiết triều."
  COURT_VISUAL_INDIAN_1_G3_TITLE: "Sabha Mandapa"
  COURT_VISUAL_INDIAN_1_G3_DESC: "Một sảnh triều nghị có cột trụ tráng lệ bằng đá chạm khắc và họa tiết vẽ tay, nơi các quân chủ thiết triều."
  COURT_VISUAL_INDIAN_2_G1_TITLE: "Darbar của Raja"
  COURT_VISUAL_INDIAN_2_G1_DESC: "Một sảnh triều nghị trang nghiêm với những bức tường đỏ và cột trụ chạm trổ, nơi Raja thiết triều trên ngai gỗ đánh bóng."
