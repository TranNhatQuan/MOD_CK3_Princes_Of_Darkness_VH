  COURT_VISUAL_JAPANESE_1_G1_TITLE: "Thư Viện Ngự Uyển"
  COURT_VISUAL_JAPANESE_1_G1_DESC: "Một gian phòng Tatami thanh tịnh, nơi lãnh chúa tiếp khách bên cạnh những bức bình phong và khu vườn yên tĩnh."
