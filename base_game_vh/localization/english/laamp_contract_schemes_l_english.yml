  laamp_base_contract_schemes.0661.t.preface: "Người Hòa Giải Trả Trước"
  laamp_base_contract_schemes.0661.t: "$laamp_base_contract_schemes.0661.t.preface$: Nhiệm Vụ Không Đồng đều"
  laamp_base_contract_schemes.0661.desc: "Vấn đề ở khu vực này có vẻ đơn giản — người dân ở một bên của tranh chấp cho rằng họ phải gửi quá nhiều [dummy_soldier.GetWomenMen] phục vụ quân đội, trong khi bên kia nói ngược lại.\n\nViệc khai thác thêm thông tin từ họ chắc chắn sẽ dẫn đến la hét và cầm giáo. Cả hai bên đều sẵn sàng giết nhau tranh cãi xem bên nào phải đóng góp nhiều hơn cho phòng thủ chung."
  laamp_base_contract_schemes.0661.a: "Hãy bàn về chuyện này."
  laamp_base_contract_schemes.0661.b: "Vận hành, hả? Có vẻ có thể giải quyết."
  laamp_base_contract_schemes.0661.c: "Hmmm, kết quả xổ số nói gì đây..."

  laamp_base_contract_schemes.0662.t: "$laamp_base_contract_schemes.0661.t.preface$: Người Cáo Buộc & Bị Cáo Buộc"
  laamp_base_contract_schemes.0662.desc: "Rõ ràng tranh chấp ở [location.GetName] xoay quanh một nhóm tội phạm nhỏ địa phương, ẩn náu trong vùng hoang dã.\n\nNgười dân chia thành khoảng một tá phe phái đang mâu thuẫn, mỗi phe #EMP tin chắc#! rằng một hoặc nhiều phe khác bí mật liên minh với bọn cướp, giúp chúng.\n\nKhông ai sẵn sàng hợp tác về vấn đề này."
  laamp_base_contract_schemes.0662.a: "Tất cả chỉ có vẻ như tin đồn xấu..."
  laamp_base_contract_schemes.0662.b: "Cướp? Vấn đề dễ giải quyết!"
  laamp_base_contract_schemes.0662.c: "Ta chắc mình có thể phát hiện kẻ nói dối ở đây."
  laamp_base_contract_schemes.0662.d: "Ta dám nói Ta có thể giải quyết vấn đề của Ngài."

  laamp_base_contract_schemes.0663.t: "$laamp_base_contract_schemes.0661.t.preface$: Chuyện Thiêng Liêng"
  laamp_base_contract_schemes.0663.desc: "Theo Ta tìm hiểu, người dân [location.GetName] gần như #EMP sẵn sàng#! giết nhau vì một tranh cãi thần học nhỏ đến mức họ khó giải thích ý nghĩa với người ngoài.\n\nKhông có gì kích động con người bằng vấn đề tín ngưỡng, dù tốt hay xấu, nhưng Ta cần họ dừng lại, thở và bình tĩnh. Tốt nhất là không đổ máu."
  laamp_base_contract_schemes.0663.a: "Hãy bình tĩnh và nhớ lời thề, nhé?"
  laamp_base_contract_schemes.0663.b: "Nghe giống như bạo loạn, chúng ta có thể #EMP giải quyết#! điều đó."
  laamp_base_contract_schemes.0663.c: "Để Ta giải thích vài điều cho các Ngài..."

  laamp_base_contract_schemes.0664.t: "$laamp_base_contract_schemes.0661.t.preface$: Mối Thù Địa Phương"
  laamp_base_contract_schemes.0664.desc: "Ở [location.GetName], người dân chọn đi con đường máu me và báo thù.\n\nTa không rõ nguyên nhân ban đầu — tất cả các bên cáo buộc lẫn nhau #EMP về những#! vụ giết người, trộm cắp, và đôi khi là phóng hỏa — nhưng giờ đây chỉ còn máu xấu đang chực chờ đổ.\n\nĐiều này không tốt cho thu thuế địa phương."
  laamp_base_contract_schemes.0664.a: "Người dân! Các Ngài là hàng xóm, hãy cư xử văn minh!"
  laamp_base_contract_schemes.0664.b: "Nếu các Ngài không bình tĩnh, Ta sẽ buộc các Ngài bình tĩnh bằng sức mạnh."
  laamp_base_contract_schemes.0664.c: "Các Ngài sẽ bắt tay, hoặc mất tay. Chọn đi."

  laamp_base_contract_schemes.0665.t: "$laamp_base_contract_schemes.0661.t.preface$: Giải Quyết Trạm Thu Phí"
  laamp_base_contract_schemes.0665.desc: "Hình như một kẻ ngốc vừa cản trở vài quan chức quan trọng địa phương. Không ai bị thương nặng, nhưng kẻ đó đã chạy la hét về thuế trước khi bị bắt.\n\nTất nhiên, mọi bất mãn nhỏ nhặt đều #EMP nổi lên ngay lập tức#! khi Ta đến, khi người dân quay sang nhau trong nỗ lực tránh bị trừng phạt tập thể.\n\nTuy nhiên, một kẻ dũng cảm ít nhất đủ khôn ngoan để gợi ý rằng đây có thể là kết quả của việc tăng thuế gần đây."
  laamp_base_contract_schemes.0665.a: "Chấm dứt ngay, #EMP bây giờ#! — Ngài hiểu chưa?"
  laamp_base_contract_schemes.0665.b: "Có lẽ gánh nặng có thể giảm chút..."
  laamp_base_contract_schemes.0665.c: "Các Ngài sẽ nói cho Ta biết ai đã làm. Tự nguyện hay không."

  laamp_base_contract_schemes.0666.t: "$laamp_base_contract_schemes.0661.t.preface$: Rắc Rối Nợ Nần"
  laamp_base_contract_schemes.0666.desc: "Điều quan trọng nhất mà bất kỳ cộng đồng nào có thể đóng góp, theo quan điểm của các bậc chủ nhân, là khoản thuế định kỳ của họ.\n\nVấn đề là người dân [location.GetName] đã không nộp thuế đầy đủ.\n\nHọ có đủ loại lý do và biện minh, nhưng phần lớn chỉ là các khu định cư lớn đang hợp sức để bắt nạt một thị trấn giàu có đang lên."
  laamp_base_contract_schemes.0666.a: "Ta chắc đây chỉ là một hiểu lầm thôi."
  laamp_base_contract_schemes.0666.b: "À, Ta nghĩ Ta thấy vấn đề rồi..."
  laamp_base_contract_schemes.0666.c: "Những con số này không khớp nhau sao?"

  laamp_base_contract_schemes.0667.t: "$laamp_base_contract_schemes.0661.t.preface$: Trong Tầm Kiểm Soát"
  laamp_base_contract_schemes.0667.desc: "Một lượng máu nhất định được phép đổ ra trong bất kỳ cộng đồng nào trước khi quyền lực cao hơn can thiệp. Giết người vặt, cướp nhẹ, hoặc có thể là thú quý của đối thủ bị giết oan vào ban đêm — nếu thuế vẫn chảy, công lý địa phương thường xử lý được.\n\nQuyền hạn này dừng lại ngay khi một kẻ ngốc quyết định đưa quan chức bên ngoài vào những khiếu nại tầm thường của họ.\n\nNhững kẻ ngốc ở [location.GetName] đã mắc sai lầm này, cho rằng một người thu thuế địa phương nhận tiền từ kẻ thù đã tuyên thệ. Sự thật không quan trọng, nhưng việc thực thi thì có."
  laamp_base_contract_schemes.0667.a: "Các ngươi #EMP hãy#! để quan chức ra ngoài chuyện này."
  laamp_base_contract_schemes.0667.b: "Ngươi có biết phạt sẽ ra sao lần sau không?"
  laamp_base_contract_schemes.0667.c: "Ngươi dừng tự nguyện, nếu không ta #EMP sẽ buộc#! ngươi."

  laamp_base_contract_schemes.0668.t: "$laamp_base_contract_schemes.0661.t.preface$: Anh Hùng Hy Sinh Của Mọi Người"
  laamp_base_contract_schemes.0668.desc: "Cái chết của một nhân vật địa phương được kính trọng, một ẩn sĩ sùng đạo hay tương tự, đã gây ra nhiều tiếng khóc và nghiến răng ở [location.GetName], đến mức hoàn toàn làm đình trệ công việc hành chính hàng ngày.\n\nSự hoang mang xuất phát từ việc thiếu thi thể. Mặc dù một số nhân chứng khẳng định đã nhìn thấy hơi thở cuối cùng của ẩn sĩ, thi thể đã mất tích.\n\nMột số người địa phương đáng chú ý cáo buộc nhau về việc lấy trộm, người khác cho rằng đây là điềm thiêng, và những kẻ hoài nghi nhất hoàn toàn không tin chuyện đó."
  laamp_base_contract_schemes.0668.a: "Một [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdherentNameNoTooltip] thật sự được mọi người yêu mến!"
  laamp_base_contract_schemes.0668.b: "Chết? Hay bỏ đi lừa đảo nơi khác?"
  laamp_base_contract_schemes.0668.c: "Chuyện cãi vã của các ngươi thật bất kính."

  laamp_base_contract_schemes.0669.t: "$laamp_base_contract_schemes.0661.t.preface$: Dưới Áp Lực"
  laamp_base_contract_schemes.0669.desc: "Người dân [location.GetName] cho rằng họ không có vấn đề gì, không biết tại sao thuế trễ hay ai đã khiếu nại với lãnh chúa.\n\nPhải là kẻ ngốc mới không nhận ra nỗi sợ trong mắt họ hay mồ hôi trên trán. Những người này đang bị ai đó cưỡng ép và giữ im lặng vì sợ trả thù."
  laamp_base_contract_schemes.0669.a: "Đừng sợ một kẻ ngoài vòng pháp luật hơn pháp luật chính."
  laamp_base_contract_schemes.0669.b: "Ta sẽ cho ngươi thấy nỗi sợ là gì!"
  laamp_base_contract_schemes.0669.c: "Chỉ cho ta nơi ẩn náu của họ, ta sẽ giải quyết."

  laamp_base_contract_schemes.0670.t: "$laamp_base_contract_schemes.0661.t.preface$: Khủng Hoảng Tinh Thần"
  laamp_base_contract_schemes.0670.desc: "Ở [location.GetName], mọi người chỉ nói về một điều duy nhất: một vật phẩm kỳ lạ trong [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetName] dường như xuất phát từ những tranh luận thần học sơ khai.\n\nĐiều này vốn là vấn đề khô khan nhưng phù hợp để những người thấp hèn sùng đạo tham gia, nhưng những kẻ ngốc này dường như quá say mê tinh thần tranh luận.\n\nVới những lời lẽ xúc phạm bay ra dày đặc và nhanh hơn mỗi ngày, chỉ là vấn đề thời gian trước khi những lý thuyết bụi bặm đó dẫn đến dao trong phố."
  laamp_base_contract_schemes.0670.a: "Xin đừng, chúng ta chẳng phải đều là Ngài sao?"
  laamp_base_contract_schemes.0670.b: "Để ta giải thích..."
  laamp_base_contract_schemes.0670.c: "Dừng. Nói. Vớ vẩn."

  laamp_base_contract_schemes.0671.t: "$laamp_base_contract_schemes.0661.t.preface$: Công Việc Hầu Như Hoàn Thành"
  laamp_base_contract_schemes.0671.desc: "Chúng ta đã làm đủ công việc để nhận phần lớn số tiền mà [employer.GetTitledFirstName] hứa.\n\nNếu chúng ta giải quyết được vấn đề cuối cùng, sẽ nhận được thưởng, nhưng nếu chỉ làm mọi thứ tệ hơn, thì... #EMP toàn bộ#! tiền lương của chúng ta sẽ bay mất.\n\nLiệu chúng ta có gửi tin hay không?"
  laamp_base_contract_schemes.0671.a: "Đủ là đủ rồi!"
  laamp_base_contract_schemes.0671.a.tt: "Ngài nộp hợp đồng để nhận phần thưởng thường"
  laamp_base_contract_schemes.0671.b: "Công việc hoàn tất khi nó #EMP hoàn tất#!."
  laamp_base_contract_schemes.0671.b.tt: "Ngài mạo hiểm thử thách cuối, hy vọng nhận thưởng đầy đủ — #X nếu thất bại sẽ không nhận gì cả#!"

  laamp_base_contract_schemes.0781.t: "Cám Dỗ Của Chi Tiêu"
  laamp_base_contract_schemes.0781.desc: "Ta hiểu rằng — về lâu dài — kiếm được tiền từ những tay sẵn sàng còn hơn là từ những kẻ cẩu thả. Ta biết điều đó, Ta hiểu.\n\nNhưng khi Ta đi quanh triều đình [target.GetTitledFirstNamePossessive], nhìn khối tài sản [target.GetSheHe] cất giữ một cách hời hợt, chưa kể bảo quản tệ, Ta không thể không tự hỏi liệu chúng ta có thể #EMP lách tay chút ít#! vào những cách kiếm thêm khác."
  laamp_base_contract_schemes.0781.a: "Chắc chắn chúng ta có thể xin ứng trước một ít..."
  laamp_base_contract_schemes.0781.a.tt.success: "Ngài thuyết phục [target.GetFirstNameNoTooltip] tặng một khoản hào phóng"
  laamp_base_contract_schemes.0781.a.tt.failure: "Mưu kế thất bại"
  laamp_base_contract_schemes.0781.b: "[target.GetSheHe|U] không thể trông chừng #EMP mọi thứ#!."
