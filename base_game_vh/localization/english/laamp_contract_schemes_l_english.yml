  laamp_base_5051_contract_scheme: "Cướp Công Dân Giàu Có"
  laamp_base_5051_contract_scheme_action: "Tấn Công Công Dân Tại"
  laamp_base_5051_contract_scheme_desc: "[contractors|E] với những thủ đô đặc biệt giàu có tạo ra những [courtiers|E] giàu có. Một trận đòn vỉa hè giúp [adventurers|E] chuyển lượng tài sản đó đi nơi khác.$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_5051_contract_scheme_desc_general: "$laamp_base_5051_contract_scheme_desc$"
  laamp_base_5051_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_5051_desc_title: "Công dân tốt xứ [TaskContract.GetEmployer.GetCapitalLocation.GetTitle.GetBaseNameNoTier],"
  laamp_base_5051_desc: "Xin lưu ý rằng chúng ta đang gặp phải #EMP dịch bệnh#! trộm cắp vặt. Hãy mang theo gậy chắc khi đi trên phố và ở nhà sau khi trời tối — [TaskContract.GetEmployer.GetTitleAsName] sẽ xử lý những kẻ xấu này."

