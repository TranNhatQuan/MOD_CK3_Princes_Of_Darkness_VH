  laamp_base_contract_schemes.1302.t: "$laamp_base_contract_schemes.1004.t$: Thành công!"
  laamp_base_contract_schemes.1302.desc.intro: "Ta ném đầu [recidivist.GetFirstNameNicknamedPossessive] bị chặt cho tay sai của [employer.GetTitledFirstNamePossessive], miếng thịt đỏ tím rơi ướt sũng bên cạnh họ.\n\n"
  laamp_base_contract_schemes.1302.desc.method.prowess_sce: ""Ngươi đã giết [recidivist.GetHerHim] trong một trận đấu tay đôi? Chao ôi, thật #EMP dữ dội#!","
  laamp_base_contract_schemes.1302.desc.method.prowess_non_sce: ""Một nước đi hợp lý khi để vệ binh chém [recidivist.GetHerHim] xuống, [ROOT.Char.Custom('FormOfAddressForLiege')] — ai mà biết chuyện gì có thể xảy ra nếu [recidivist.GetSheHe] đến gần hơn?"" 
  laamp_base_contract_schemes.1302.desc.method.martial: ""Một cú đánh điêu luyện khi loại bỏ tên khốn này mà không chịu tổn thất lớn, [ROOT.Char.Custom('FormOfAddressForLiege')] — Ta không chắc nhiều người có thể nghĩ ra điều này","
  laamp_base_contract_schemes.1302.desc.method.meat: ""Rất khôn ngoan khi để quân lính giải quyết bọn cặn bã này, [ROOT.Char.GetLadyLord] — [recidivist.GetSheHe] quá tinh ranh để có cơ hội trốn thoát","
  laamp_base_contract_schemes.1302.desc.outro: "nhận xét người hầu của [employer.GetTitleAsNamePossessiveNoTooltip], đồng thời cẩn thận trao tiền thù lao cho chúng Ta.\n\nNhững lời này không quan trọng, nhưng trọng lượng ngon lành của túi tiền đầy bạc giúp cuộc săn nhỏ của chúng Ta trở nên hoàn toàn xứng đáng."
  laamp_base_contract_schemes.1302.a: "Hoàn thành tốt công việc."
  laamp_base_contract_schemes.1302.a.tt: "$laamp_base_contract_schemes.0000.f.contract_concluded$"

  laamp_base_contract_schemes.1303.t: "$laamp_base_contract_schemes.1004.t$: Thất bại!"
  laamp_base_contract_schemes.1303.desc.intro: "Với việc đó, [recidivist.GetFirstNameNicknamed] cuối cùng cũng lắc khỏi sự truy đuổi của chúng Ta,"
  laamp_base_contract_schemes.1303.desc.method.prowess_non_sce: "mặc cho những nỗ lực tốt nhất của vệ binh Ta nhằm bắt giữ [recidivist.GetHerHim]."
  laamp_base_contract_schemes.1303.desc.method.martial: "xông thẳng qua phục kích và trốn thoát nhanh chóng."
  laamp_base_contract_schemes.1303.desc.method.diplo_bandit: "lặng lẽ trốn thoát dưới danh nghĩa cân nhắc gia nhập băng nhóm [recidivist.GetHerHis] với [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] của chúng ta."
  laamp_base_contract_schemes.1303.desc.method.diplo_non_bandit: "lẻn đi dưới vỏ bọc giả vờ cân nhắc đề nghị hào phóng của Ta."
  laamp_base_contract_schemes.1303.desc.outro: "Các tay sai của [employer.GetTitledFirstNamePossessive] thất vọng khi bắt kịp chúng Ta, nhưng không ngạc nhiên. Dù hiểu, nhưng với việc không có đầu để giao cho [employer.Custom('MistressMaster')], họ không có ý định trả tiền thù lao."
  laamp_base_contract_schemes.1303.a: "Chết tiệt tên [recidivist.GetWomanMan] khối u đó!"
  laamp_base_contract_schemes.1303.a.tt: "$laamp_base_contract_schemes.0000.f.contract_concluded$"

  laamp_base_contract_schemes.1304.t: "$laamp_base_contract_schemes.1004.t$: Thất bại đặc biệt!"
  laamp_base_contract_schemes.1304.desc: "[recidivist.GetFirstNameNicknamed] đáp lại... một cách đáng kinh ngạc trước đề nghị của ta, và sau khi trò chuyện, ta đã có thể thuyết phục kẻ đó rằng ta không chỉ chân thành mà còn có thể mang đến một tương lai tươi sáng, tốt đẹp hơn cho cả hắn và toàn bộ băng đảng của hắn.\n\nHệ quả là, toàn bộ bọn chúng đã gia nhập [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l].\n\nTất nhiên, [employer.GetTitledFirstName] có thể sẽ không tha thứ cho việc ta phản bội lòng tin của kẻ đó, nhưng suy cho cùng, ta đã giải quyết vấn đề theo cách của mình, chẳng phải sao?"
  laamp_base_contract_schemes.1304.a: "[employer.GetFirstNameNoTooltip] có thể tự chịu trách nhiệm với Ta."
  laamp_base_contract_schemes.1304.a.tt: "$laamp_base_contract_schemes.0000.f.contract_concluded$"

  laamp_base_contract_schemes.1782.t: "$laamp_base_contract_schemes.1041.t$: [victim.GetTitledFirstNameNoTooltip]"
  laamp_base_contract_schemes.1782.desc.intro.1: "Sáng nay, chúng Ta nhìn thấy một đoàn người ở xa —"
  laamp_base_contract_schemes.1782.desc.intro.2: "Vài giờ trước hoàng hôn, chúng Ta tình cờ gặp một nhóm du khách —"
  laamp_base_contract_schemes.1782.desc.intro.3: "Khoảng giữa trưa, chúng Ta bắt kịp đoàn lữ hành đã theo dõi nhiều ngày —"
  laamp_base_contract_schemes.1782.desc.intro.4: "Ngay sau bình minh, một nhóm nhỏ du khách xuất hiện trên đường chân trời —"
  laamp_base_contract_schemes.1782.desc.intro.5: "Ngay trước khi ánh sáng kết thúc, chúng Ta bắt đầu tiếp cận cuối đoàn dài —"
  laamp_base_contract_schemes.1782.desc.connection.negative: "Hình như họ được dẫn dắt bởi [victim.GetTitledFirstName], một [victim.Custom2('RelationToMeShort',ROOT.Char)] của Ta."
  laamp_base_contract_schemes.1782.desc.connection.positive: "Dẫn đầu là [victim.GetTitledFirstName], [victim.Custom2('RelationToMeShort',ROOT.Char)] của Ta mà Ta không nỡ làm hại."
  laamp_base_contract_schemes.1782.desc.connection.family_or_consort: "Họ dường như được dẫn dắt bởi không ai khác ngoài [victim.GetTitledFirstName], [victim.Custom2('RelationToMeShort',ROOT.Char)] của Ta!"
  laamp_base_contract_schemes.1782.desc.connection.none: "Ở phía trước là [victim.GetTitledFirstName], ít nhất theo trinh sát của Ta, dẫn dắt phần còn lại trên đường quanh co."
  laamp_base_contract_schemes.1782.desc.victim_type.pool: "Nhìn bề ngoài, nhóm này chẳng là gì ngoài những người lang thang, tài sản duy nhất họ có là những gì mang theo và danh tiếng tốt có thể mang lại quà tặng."
  laamp_base_contract_schemes.1782.desc.victim_type.baron: "Với một [victim.GetTitleAsNameNoTooltip] dẫn đầu, nhóm rõ ràng có #EMP chút# tài sản nhưng không quá giàu. Dù sao cũng là mục tiêu đáng giá nếu chúng ta muốn."
  laamp_base_contract_schemes.1782.desc.victim_type.travelling_ruler: "Dẫn đầu bởi một [victim.GetTitleAsNameNoTooltip] lừng lẫy đi xa khỏi [victim.GetHerHis] [victim.Custom('FortifiedBuilding')], may thay ít vệ binh hơn bình thường cho địa vị của [victim.GetFirstNamePossessiveNoTooltip], nhóm này #EMP chắc chắn# có nhiều tài sản để lấy."
  laamp_base_contract_schemes.1782.desc.victim_type.travelling_nobody: "Thiếu những dấu hiệu quyền lực hay kinh nghiệm đường trường, nhóm này trông... không hợp với đường xa. Bao nhiêu bạc có thể lấy là một ẩn số."
  laamp_base_contract_schemes.1782.desc.victim_type.laamp: "Rõ ràng, giống như chúng ta, đây là một nhóm phiêu lưu đi tìm chỗ trú đêm. Họ có thể giàu hơn vua hoặc nghèo hơn dân thường, điều mà chúng ta biết rõ."
  laamp_base_contract_schemes.1782.desc.victim_type.fallback: "Mặc dù vị [victim.GetWomanMan] dẫn đầu của chúng khoác trên mình những bộ cánh tinh xảo hơn đa phần đám tùy tùng của hắn, rõ ràng suy cho cùng, kẻ đó cũng chỉ là một kẻ vô danh tiểu tốt. Bất kể đồng xu nào mà hắn mang theo bên mình có lẽ cũng là toàn bộ gia sản mà kẻ đó có trên đời."
  laamp_base_contract_schemes.1782.desc.outro: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] chỉ chờ tín hiệu của Ta để tấn công."
  laamp_base_contract_schemes.1782.tt.victim_escapes: "[victim.GetTitledFirstNameNoTooltip] trốn thoát giữa hỗn loạn"
  laamp_base_contract_schemes.1782.a: "Tấn công bọn ngu này!"
  laamp_base_contract_schemes.1782.a.tt.success: "Ngươi làm tan rã đoàn và cướp đồ họ"
  laamp_base_contract_schemes.1782.a.tt.failure: "$laamp_base_contract_schemes.1782.c.tt.failure$"
  laamp_base_contract_schemes.1782.b: "Bao vây chúng và xem họ trả bao nhiêu."
  laamp_base_contract_schemes.1782.b.tt.success: "Bị qua mặt, họ đầu hàng"
  laamp_base_contract_schemes.1782.b.tt.failure: "$laamp_base_contract_schemes.1782.c.tt.failure$"
  laamp_base_contract_schemes.1782.c: "Dừng — chúng ta sẽ tấn công sau khi màn đêm buông xuống..."
  laamp_base_contract_schemes.1782.c.tt.easier_against_most_but_less_rewards: "#TUT Nói chung dễ hơn, nhưng ít [gold|E]#!"
  laamp_base_contract_schemes.1782.c.tt.success: "Một cuộc phục kích thành công"
  laamp_base_contract_schemes.1782.c.tt.failure: "Quân lính của ngươi bất lực"
  laamp_base_contract_schemes.1782.d: "Bỏ qua nhóm này."
  laamp_base_contract_schemes.1782.d.tt: "Ngươi bỏ lỡ cơ hội trấn lột của cải của [victim.GetTitledFirstName]"

  laamp_base_contract_schemes.1783.t: "$laamp_base_contract_schemes.1041.t$: Thành công!"
  laamp_base_contract_schemes.1783.desc: "Ai nói đi đường là khắc nghiệt, khó khăn và nguy hiểm?\n\nTheo góc nhìn của [ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessive|l], nó khá dễ dàng và có lợi. Với túi yên đầy bạc, chúng Ta vui vẻ — dù cảnh giác — đến [destination_2.GetBaseNameNoTier], tinh thần cao và túi tiền đầy.\n\nChỉ hy vọng không ai trong số nạn nhân theo kịp trước khi chúng Ta đi."
  laamp_base_contract_schemes.1783.a: "Đường xá thật sự là nguồn giàu có..."

  laamp_base_contract_schemes.1784.t: "$laamp_base_contract_schemes.1041.t$: Thất bại!"
  laamp_base_contract_schemes.1784.desc: "Thật tiếc, đôi khi [ROOT.Char.GetFaith.FateGodName] mỉm cười với [ROOT.Char.GetWomanMan], đôi khi [ROOT.Char.GetFaith.FateGodSheHe] không.\n\nHôm nay, dường như chúng Ta chưa làm đủ để được Thần Tài ưu ái, vì [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] không kiếm được một đồng nào kể từ khi bắt đầu.\n\nĐến cuối con đường, có vẻ chúng Ta phải thừa nhận thất bại và tiếp tục."
  laamp_base_contract_schemes.1784.a: "Lúc đó mọi việc có vẻ dễ dàng..."

