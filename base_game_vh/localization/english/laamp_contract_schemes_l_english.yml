  laamp_base_1041_contract_scheme: "Mai Phục Lữ Khách"
  laamp_base_1041_contract_scheme_action: "Mai Phục Tại Lãnh Thổ Của"
  laamp_base_1041_contract_scheme_desc: "Lãnh địa của [contractors_possessive|E] nguy hiểm đến mức nào! Họ đưa ra yêu cầu trợ giúp, nhưng thay vào đó, một [adventurer|E] lanh lợi xuất hiện và bắt đầu mai phục tất cả thương nhân béo bở và đoàn lữ hành béo tốt mà họ có thể tìm thấy.$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_1041_contract_scheme_desc_general: "$laamp_base_1041_contract_scheme_desc$"
  laamp_base_1041_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_1041_desc_title: "Kiếm sĩ đánh thuê đáng tin cậy,"
  laamp_base_1041_desc: "[TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier|U] đang bị quấy rối bởi cướp bóc, kẻ ngoài vòng pháp luật và đủ loại lữ khách lang bạt. Chiến binh thành thạo được tìm kiếm #EMP khẩn trương#!. Mọi giao dịch xin liên hệ [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] xứ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier]."
  laamp_base_1041.tt.gold_rewards_depend_on_travellers: "#alert_trial [gold|E] Ngài có thể kiếm được phụ thuộc hoàn toàn vào những lữ khách Ngài gặp và cướp trên đường — Ngài có thể gặp [dukes|E] cực kỳ giàu có, hoặc [courtiers|E] hành hương nghèo khó"
  laamp_base_1041.tt.haul_actual: "Ngài đã kiếm được tổng cộng [gold_i][task_contract.MakeScope.Var('haul_actual').GetValue|P0]"

 #################################################
 # Base Stewardship Scheme Loc

  laamp_base_2001_contract_scheme: "Thu Thuế"
  laamp_base_2001_contract_scheme_action: "Thu Thuế Cho"
  laamp_base_2001_contract_scheme_desc: "Thuế là huyết mạch của bất kỳ [realm|E] nào. Khi việc thu thuế chậm chạp, [contractors|E] có thể đưa ra yêu cầu tìm thêm những #EMP người thu thuế giỏi#!.$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_2001_contract_scheme_desc_general: "$laamp_base_2001_contract_scheme_desc$"
  laamp_base_2001_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_2001_desc_title: "Những lữ khách ngoan ngoãn, có học thức,"
  laamp_base_2001_desc: "Cần những cá nhân kiên định để làm công việc trung thực trong việc thu thuế [TaskContract.GetEmployer.GetPrimaryTitle.GetTierAsNameNoTooltip|l] nhân danh [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] xứ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier]. Kỹ năng xử lý người hạ lưu ngoan cố là cần thiết."

  laamp_base_2011_contract_scheme: "Điều Tra Dân Số"
  laamp_base_2011_contract_scheme_action: "Điều Tra Dân Số Cho"
  laamp_base_2011_contract_scheme_desc: "Khó mà cai quản một [realm|E] khi Ngài không biết ai đang #EMP sinh sống#! trong đó. [contractors|E] gặp vấn đề này thường nhờ đến bên thứ ba trung lập để lập danh sách dân cư, đặc biệt là tài sản của họ.$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_2011_contract_scheme_desc_general: "$laamp_base_2011_contract_scheme_desc$"
  laamp_base_2011_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_2011_desc_title: "Các nhà khảo sát và quan chức chú ý:"
  laamp_base_2011_desc: "Các hồ sơ của [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] xứ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTierPossessive] còn nhiều thiếu sót. Những lữ khách có học thức, trí lực và sức khỏe tốt được tìm kiếm để thực hiện điều tra dân số, và sẽ được trả công từ kết quả khảo sát."

  laamp_base_2021_contract_scheme: "Xây Dựng Công Trình"
  laamp_base_2021_contract_scheme_action: "Xây Dựng Cho"
  laamp_base_2021_contract_scheme_desc: "Nhiều [contractors|E] thấy tham vọng kiến trúc vượt quá năng lực — đưa công trình ra đấu thầu là cách dễ dàng để bù đắp cho những... tham vọng quá mức đó.$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_2021_contract_scheme_desc_general: "$laamp_base_2021_contract_scheme_desc$"
  laamp_base_2021_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_2021_desc_title: "Cần người giám sát tinh mắt, chắc chắn,"
  laamp_base_2021_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] xứ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] cần những bàn tay và thợ lành nghề để giám sát dự án xây dựng. Vật liệu và trả công hợp lý sẽ được cung cấp."

  laamp_base_2031_contract_scheme: "Giải Quyết Tranh Chấp Biên Giới"
  laamp_base_2031_contract_scheme_action: "Trọng Tài Biên Giới Cho"
  laamp_base_2031_contract_scheme_desc: "Biên giới là quyền lực, thường gây tranh cãi — khi tranh chấp nhỏ giữa những người quan trọng vượt khỏi kiểm soát, việc thuê bên thứ ba trung lập để xác minh sự thật thường hiệu quả hơn.$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_2031_contract_scheme_desc_general: "$laamp_base_2031_contract_scheme_desc$"
  laamp_base_2031_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_2031_desc_title: "Những lữ khách có giáo dục tốt,"
  laamp_base_2031_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] xứ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] tìm trọng tài kinh nghiệm để giải quyết tranh chấp biên giới. Có kiến thức về luật [TaskContract.GetEmployer.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] sẽ... hữu ích. Nhưng dù chỉ hỗ trợ vừa đủ cũng sẽ được trả công."

  laamp_base_2041_contract_scheme: "Giả Mạo Người Thu Thuế"
  laamp_base_2041_contract_scheme_action: "Lấy Thuế Từ"
  laamp_base_2041_contract_scheme_desc: "Thuế khóa là nguồn lực của mọi [realm|E] — nhưng liệu có #EMP thực sự#! cần thiết? Khi một gã lãng tử xuất hiện cùng một tờ ấn tín giả mạo và vài tên tay sai cơ bắp, liệu có #EMP khác biệt gì#! so với một quan lại chính thống?$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_2041_contract_scheme_desc_general: "$laamp_base_2041_contract_scheme_desc$"
  laamp_base_2041_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_2041_desc_title: "Tất cả thần dân xứ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier]"
  laamp_base_2041_desc: "[TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] nghiêm khắc nhắc nhở mọi người về nghĩa vụ nộp thuế sắp tới — hãy trả đúng hạn ngay khi người thu thuế đến. Mọi thiếu hụt sẽ bị trừng phạt nghiêm khắc."

 #################################################
 # Base Intrigue Scheme Loc

  laamp_base_3001_contract_scheme: "Gián Điệp Tại Chỗ"
  laamp_base_3001_contract_scheme_action: "Báo Cáo Cho"
  laamp_base_3001_contract_scheme_desc: "Các báo cáo mới về sự kiện xa kinh đô thường vô giá đối với [contractors|E]: đủ để họ chi trả cho những lữ khách lành nghề.$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_3001_contract_scheme_desc_general: "$laamp_base_3001_contract_scheme_desc$"
  laamp_base_3001_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_3001_desc_title: "Những kẻ nghe trộm đáng tin cậy và lữ khách tháo vát,"
  laamp_base_3001_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] xứ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] thông báo [TaskContract.GetEmployer.GetSheHe] mời mọi tin tức hữu ích từ khắp [TaskContract.GetEmployer.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip], và xa hơn nữa."

  laamp_base_3011_contract_scheme: "Ám Sát Kẻ Thù"
  laamp_base_3011_contract_scheme_action: "Ám Sát"
  laamp_base_3011_contract_scheme_desc: "Có những lúc một [contractor|E] cần ai đó chết, nhưng không muốn mạo hiểm thực hiện hoặc quá bận rộn với việc khác. May mắn thay, việc ám sát dễ dàng thuê ngoài cho những người phù hợp.$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_3011_contract_scheme_desc_general: "$laamp_base_3011_contract_scheme_desc$"
  laamp_base_3011_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_3011_desc_title: "Các lính đánh thuê chính trực, ý chí kiên định,"
  laamp_base_3011_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] xứ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] hứa thưởng hậu hĩnh cho những tay chân đáng tin cậy và có kinh nghiệm để thực hiện công việc tế nhị, đòi hỏi khắt khe."

  laamp_base_3021_contract_scheme: "Bắt Cóc Kẻ Thù"
  laamp_base_3021_contract_scheme_action: "Bắt Cóc"
  laamp_base_3021_contract_scheme_desc: "Nhà tù có thể là trải nghiệm làm tỉnh táo, cung cấp thông tin cho kẻ bất mãn và đối thủ, đồng thời là lợi ích hoặc thỏa mãn cho người canh giữ. Đủ để đáng mạo hiểm thuê bên thứ ba sắp xếp một chuyến thăm, ít nhất.$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_3021_contract_scheme_desc_general: "$laamp_base_3021_contract_scheme_desc$"
  laamp_base_3021_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_3021_desc_title: "Những người dũng cảm, khéo léo xử lý thú dữ,"
  laamp_base_3021_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] xứ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] tìm kiếm những thợ săn kín đáo, lành nghề để bắt những con mồi hiếm, và đưa về sống. Thù lao hậu hĩnh được hứa."

  laamp_base_3031_contract_scheme: "Đốt Tài Sản"
  laamp_base_3031_contract_scheme_action: "Phóng Hỏa Cho"
  laamp_base_3031_contract_scheme_desc: "Điều tuyệt vời về một tòa nhà bỏ không là, với đủ nỗ lực, nó #EMP luôn#! cháy. Đây là công cụ hoàn hảo cho [contractors|E] muốn gửi thông điệp mà chỉ cần đốt và quên.$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_3031_contract_scheme_desc_general: "$laamp_base_3031_contract_scheme_desc$"
  laamp_base_3031_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_3031_desc_title: "Những lữ khách siêng năng, đạo đức thích hợp,"
  laamp_base_3031_desc: "Phần thưởng hậu hĩnh được trao cho việc dọn dẹp khẩn cấp. Bảo mật là điều cần thiết. Hãy nhanh chóng tới [TaskContract.GetEmployer.GetPrimaryTitle.GetAdjectiveNoTooltip] [TaskContract.GetEmployer.GetTitleAsNamePossessiveNoTooltip] [TaskContract.GetEmployer.Custom('ResidenceBuilding')|l]."

  laamp_base_3041_contract_scheme: "Cướp Kho Báu"
  laamp_base_3041_contract_scheme_action: "Đột Nhập Kho Báu Của"
  laamp_base_3041_contract_scheme_desc: "Một số [contractors|E] đơn giản là những kẻ ngốc khoe của cải — của cải mà dễ chiếm đoạt trực tiếp hơn là qua một công việc tầm thường #EMP nào đó#!.$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_3041_contract_scheme_desc_general: "$laamp_base_3041_contract_scheme_desc$"
  laamp_base_3041_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_3041_desc_title: "Tất cả lữ khách trong, & thần dân của, [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier]"
  laamp_base_3041_desc: "[TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] nhắc nhở #EMP tất cả#! về hình phạt đối với trộm cắp hoặc âm mưu trộm cắp, và tiền thưởng cho những ai bị nghi ngờ. Chỉ #EMP Ta#! mới được phép vào kho."
  laamp_base_3041.tt.chance_for_more: "Nếu muốn, Ngài có thể thử #P lấy thêm [gold|E]#!"

 #################################################
 # Base Learning Scheme Loc

  laamp_base_4001_contract_scheme: "Chép Văn Bản"
  laamp_base_4001_contract_scheme_action: "Chép Cho"
  laamp_base_4001_contract_scheme_desc: "Nghệ thuật sao chép và dịch các bản thảo đôi khi là công việc ít được cảm ơn, ngay cả ở [realms|E] học thức, khi khối lượng công việc vượt xa số lượng thư ký đủ trình độ. Vì vậy, một lữ khách có học thức mang đến cơ hội vàng cho [task_contracts|E] để thực hiện yêu cầu đặc biệt.$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_4001_contract_scheme_desc_general: "$laamp_base_4001_contract_scheme_desc$"
  laamp_base_4001_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_4001_desc_title: "Những người muốn lưu giữ tri thức"
  laamp_base_4001_desc: "Cần các thư ký có học thức để sao chép các văn bản [TaskContract.GetEmployer.GetCulture.GetNameNoTooltip]. [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] xứ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] hứa trả công công bằng cho công việc đúng hạn."

  laamp_base_4011_contract_scheme: "Giải Quyết Tranh Chấp Thần Học"
  laamp_base_4011_contract_scheme_action: "Trọng Tài Thần Học Cho"
  laamp_base_4011_contract_scheme_desc: "Tranh luận về giáo lý có thể cực kỳ cụ thể, đến mức giải thích chính xác từng từ, và đôi khi mơ hồ, như tranh cãi về sự không tương thích của các truyền thống cổ xưa chồng chéo nhau. Khi những tranh cãi thiêng liêng này bùng phát, nhiều [contractors|E] thích gửi bên thứ ba để trọng tài thay họ.$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_4011_contract_scheme_desc_general: "$laamp_base_4011_contract_scheme_desc$"
  laamp_base_4011_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_4011_desc_title: "Các môn đồ trung thành của [TaskContract.GetEmployer.GetFaith.KnowledgeGodName],"
  laamp_base_4011_desc: "Các nhà thần học có học thức sẽ được thưởng hậu hĩnh khi giải quyết tranh chấp tôn giáo địa phương liên quan đến giáo lý [TaskContract.GetEmployer.GetFaith.GetAdjective].\n\nHãy đến gặp [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] xứ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier], nhưng chỉ nếu Ngài là học giả có uy tín."

  laamp_base_4021_contract_scheme: "Sáng Tác Tác Phẩm Học Thuật"
  laamp_base_4021_contract_scheme_action: "Nghiên Cứu Cho"
  laamp_base_4021_contract_scheme_desc: "Những lữ khách có học thức mang theo một vẻ bí ẩn, đôi khi thậm chí một chút kỳ lạ — những [contractors|E] tháo vát thường cố gắng lưu giữ những trí tuệ thoáng qua đó bằng cách ủy thác các cuốn sách nhỏ về châm ngôn và truyện đạo đức.$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_4021_contract_scheme_desc_general: "$laamp_base_4021_contract_scheme_desc$"
  laamp_base_4021_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_4021_desc_title: "Các học giả am hiểu văn tự,"
  laamp_base_4021_desc: "Những người viết khắp đất nước được chỉ dẫn tới [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] xứ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTierPossessive] [TaskContract.GetEmployer.Custom('ResidenceBuilding')|l] để nhận công việc sao chép sinh lợi."

  laamp_base_4031_contract_scheme: "Xin Phép Từ Thiện"
  laamp_base_4031_contract_scheme_action: "Lạy Lòng Từ"
  laamp_base_4031_contract_scheme_desc: "Tặng quà và tiền cho các học giả đi qua khiến [contractors|E] trông hào phóng và học thức — ngay cả khi học giả đó cần một chút #EMP nhắc nhở#! trước.$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_4031_contract_scheme_desc_general: "$laamp_base_4031_contract_scheme_desc$"
  laamp_base_4031_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_4031_desc_title: "Những người thánh thiện & kẻ ăn xin đáng thương,"
  laamp_base_4031_desc: "Xin thông báo: [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] xứ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] ban ơn [TaskContract.GetEmployer.GetFaith.GetAdjectiveNoTooltip] cho những ai đạo hạnh, có học thức hoặc đủ học vấn để xứng đáng. Hỏi tại [TaskContract.GetEmployer.Custom('ResidenceBuilding')|l]."

  laamp_base_4041_contract_scheme: "Bán Bùa Chú"
  laamp_base_4041_contract_scheme_action: "Móc Túi Đồ Tâm Linh Cho"
  laamp_base_4041_contract_scheme_desc: "Ai mà nói được đâu là ma thuật, là thiêng liêng, là kỳ lạ? Nếu một [contractor|E] đủ ngu để tin, và #EMP trả tiền#! cho nó, vậy là đủ. Có lẽ.$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_4041_contract_scheme_desc_general: "$laamp_base_4041_contract_scheme_desc$"
  laamp_base_4041_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_4041_desc_title: "Những [TaskContract.GetEmployer.GetWomenMen] học thức,"
  laamp_base_4041_desc: "Ngài có mắt nhìn giá trị thực của những vật phẩm [TaskContract.GetEmployer.GetFaith.GetAdjectiveNoTooltip] không? [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] xứ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] hứa trả công công bằng — #EMP nếu#! hàng hóa là thật."

