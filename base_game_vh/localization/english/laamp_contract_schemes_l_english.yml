  laamp_base_contract_schemes.0791.t: "Nghệ Thuật Ủy Quyền"
  laamp_base_contract_schemes.0791.desc: "[target.GetTitledFirstName] có triều đình của [target.GetHerHis], và Ta có của riêng Ta.\n\nKhác biệt là, nơi những tùy tùng [target.GetFirstNamePossessiveNoTooltip] chỉ sống dựa vào của cải của [target.GetHerHis], #EMP những#! thuộc hạ của Ta quyết tâm giúp Ta hưởng một phần tài sản ấy.\n\nTa dành thời gian cho ngày nhận lương cuối cùng, và họ, ngược lại, có thể trộm [target.GetFirstNameNoTooltip] khi [target.GetSheHe] bận rộn. Thật vui khi biết mình có người đáng tin cậy."
  laamp_base_contract_schemes.0791.tt.success: "Thuộc hạ thành công"
  laamp_base_contract_schemes.0791.tt.failure: "Thuộc hạ thất bại"
  laamp_base_contract_schemes.0791.a: "Cùng Ta [second.GetFirstNameNoTooltip], hãy giữ [target.GetHerHim] bận rộn."
  laamp_base_contract_schemes.0791.b: "Đến kho, [quartermaster.GetFirstNameNoTooltip]."
  laamp_base_contract_schemes.0791.c: "[armourer.GetFirstNameNoTooltip] có thể vào kho vũ khí!"
  laamp_base_contract_schemes.0791.d: "[chief_forager.GetFirstNameNoTooltip], đi lấy vườn của họ."
  laamp_base_contract_schemes.0791.e: "[master_thief.GetFirstNameNoTooltip] biết #EMP chính xác#! phải làm gì."
  laamp_base_contract_schemes.0791.f: "[head_groom.GetFirstNameNoTooltip], ra chuồng ngựa."
  laamp_base_contract_schemes.0791.g: "[huntperson.GetFirstNameNoTooltip] có thể đột kích nhà săn của họ."
  laamp_base_contract_schemes.0791.h: "[witness.GetFirstNameNoTooltip] có thể lan truyền danh tiếng tốt của Ta trong khi Ta..."
  laamp_base_contract_schemes.0791.i: "[camp_cook.GetFirstNameNoTooltip], đến kho thực phẩm, #EMP đi#!."
  laamp_base_contract_schemes.0791.j: "[master_bard.GetFirstNameNoTooltip] là sự phân tán hữu hiệu."
  laamp_base_contract_schemes.0791.k: "Miễn là [stooge.GetFirstNameNoTooltip] nhận tội..."
  laamp_base_contract_schemes.0791.l: "[master_of_spoils.GetFirstNameNoTooltip], cướp mọi thứ chưa đóng đinh."
  laamp_base_contract_schemes.0791.m: "Rủi ro quá, tốt hơn không làm."
  laamp_base_contract_schemes_0791_suspicious_officers_modifier: "Quan Chức Đáng Ngờ"
  laamp_base_contract_schemes_0791_suspicious_officers_modifier_desc: "Những kẻ lảng vảng và nhân vật mờ ám hiếm khi tạo uy tín."
  laamp_base_contract_schemes_0791_plentiful_horses_modifier: "Ngựa Dư Thừa"
  laamp_base_contract_schemes_0791_plentiful_horses_modifier_desc: "Ôi, số lượng ngựa thừa thật lạ thường!"

  laamp_base_contract_schemes.0801.t: "Nịnh Hót Vì Lợi Nhuận"
  laamp_base_contract_schemes.0801.desc: "Mục tiêu cuối cùng của chúng ta chắc chắn là vơ vét từ [target.GetTitledFirstName] càng nhiều của cải mà chúng ta có thể lừa kẻ đó đưa cho mình, nhưng cho đến lúc đó, kẻ đó càng nghĩ tốt về chúng ta, cơ hội của chúng ta càng lớn.\n\nViệc này không đòi hỏi gì quá #EMP trắng trợn#!. Một vài lời khen chân thành, những tiếng cười đúng chỗ, những cái hít hà kinh ngạc một cách thích hợp, chỉ cần vừa đủ để khiến [target.GetFirstNameNoTooltip] cảm thấy mình đầy quyền lực khi ở bên chúng ta."
  laamp_base_contract_schemes.0801.a: "Chúng ta có thể làm nhiều hơn nếu [target.GetSheHe] thích chúng ta."
  laamp_base_contract_schemes.0801.a.tt.success: "Ngài lấy lòng thành công"
  laamp_base_contract_schemes.0801.a.tt.failure: "Ngài cần rời đi"
  laamp_base_contract_schemes.0801.b: "Một chút vốn xã hội không hại gì..."
  laamp_base_contract_schemes.0801.c: "[bard.GetFirstNameNoTooltip] có thể xử lý chuyện này!"
  laamp_base_contract_schemes.0801.c.tt.success: "[bard.GetFirstNameNoTooltip] làm [target.GetFirstName] xiêu lòng"
  laamp_base_contract_schemes.0801.c.tt.failure: "Một kẻ phiền phức"
  laamp_base_contract_schemes.0801.d: "Chuyện này dưới tầm Ta."
  laamp_base_contract_schemes_0801_target_good_graces_modifier: "Được Ưa Chuộng"
  laamp_base_contract_schemes_0801_target_good_graces_modifier_desc: "Khi người quan trọng thích Ngài, những người khác ít quan trọng hơn."
  laamp_base_contract_schemes_0801_target_irritated_modifier: "Khó Chịu"
  laamp_base_contract_schemes_0801_target_irritated_modifier_desc: "Một số người như ruồi, luôn vo ve quanh Ngài."

  laamp_base_contract_schemes.0811.t: "Việc Làm Thêm"
  laamp_base_contract_schemes.0811.desc: "Có vẻ như [agent.GetFirstName] đã hành động vì những mục đích #EMP khác#! ngoài mục tiêu của chúng ta với [target.GetTitledFirstName].\n\nKẻ đó đã lợi dụng thời gian tại triều đình để đặt nền móng cho việc lừa một khoản kha khá từ [target.GetFirstNameNoTooltip] — điều mà kẻ đó đã quên không nói với ta trước khi ta tình cờ nghe được hắn khoe khoang về nó với một trong đám tùy tùng trong trại."
  laamp_base_contract_schemes.0811.a: "Quả là táo bạo! Dĩ nhiên, chúng ta sẽ chia lợi nhuận."
  laamp_base_contract_schemes.0811.a.tt.success: "Cả hai kiếm được chút tiền"
  laamp_base_contract_schemes.0811.a.tt.failure: "Gian lận thất bại"
  laamp_base_contract_schemes.0811.b: "Tiếp tục đi, tiếp tục đi."
  laamp_base_contract_schemes.0811.c.tt.success: "[agent.GetFirstNameNoTooltip] kiếm được chút tiền"
  laamp_base_contract_schemes.0811.c.tt.failure: "Gian lận thất bại"
  laamp_base_contract_schemes.0811.c: "Dừng lại đi ngốc ạ! Ngươi làm hỏng việc của ta!"

