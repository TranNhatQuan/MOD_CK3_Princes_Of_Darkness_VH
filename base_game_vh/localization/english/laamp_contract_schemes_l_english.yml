 # Base Justicar Scheme Loc

  laamp_base_6001_contract_scheme: "Bảo Vệ Người Vô Tội"
  laamp_base_6001_contract_scheme_action: "Bảo Vệ Thần Dân Tại"
  laamp_base_6001_contract_scheme_desc: "Các con đường đầy rẫy nguy hiểm. Cướp, thú dữ và thời tiết xấu đã ảnh hưởng đến thần dân của [contractor_possessive|E], và họ đang cầu cứu.$laamp_contract_scheme_desc_general_boilerplate$"
