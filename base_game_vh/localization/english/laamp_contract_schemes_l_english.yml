  laamp_base_contract_schemes.1301.t: "$laamp_base_contract_schemes.1004.t$"
  laamp_base_contract_schemes.1301.desc.intro.preamble.first: "Lần đầu chúng ta gặp [recidivist.GetFirstNameNicknamed] tại"
  laamp_base_contract_schemes.1301.desc.intro.preamble: "Chúng ta gặp lại [recidivist.GetFirstNameNicknamed] tại"
  laamp_base_contract_schemes.1301.desc.intro.plains: "những đồng bằng trải dài của [current_county.GetBaseNameNoTier]."
  laamp_base_contract_schemes.1301.desc.intro.farmlands: "những cánh đồng trù phú của [current_county.GetBaseNameNoTier]."
  laamp_base_contract_schemes.1301.desc.intro.hills: "những ngọn đồi gồ ghề của [current_county.GetBaseNameNoTier]."
