  laamp_base_5031_contract_scheme: "Trộm Gia Súc"
  laamp_base_5031_contract_scheme_action: "Trộm Từ"
  laamp_base_5031_contract_scheme_desc: "Bầy ngựa, gia súc, thậm chí dê hay cừu: những con vật bị lấy trộm mang lại lợi nhuận khổng lồ cho những kẻ đủ gan dám lấy, và khi một số [contractors|E] làm cho việc này quá dễ dàng...$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_5031_contract_scheme_desc_general: "$laamp_base_5031_contract_scheme_desc$"
  laamp_base_5031_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_5031_desc_title: "Nhân dân xứ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier],"
  laamp_base_5031_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] một lần nữa nhắc nhở rằng việc trộm gia súc #EMP sẽ#! bị trừng phạt nghiêm khắc, bất kể số lượng hay lý do. Ngài đã được cảnh báo."

