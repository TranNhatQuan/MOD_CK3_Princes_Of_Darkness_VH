  laamp_extra_contract_schemes.0001.t_culture: "$ep3_contract_event.0020.t$"
  laamp_extra_contract_schemes.0001.t_faith: "$ep3_contract_event.0021.t$"
  laamp_extra_contract_schemes.0001.desc_culture: "Ta đạt đủ số lượng cùng đồng sự. Chúng Ta, những người của [ROOT.Char.GetPrimaryTitle.GetName], là phù hợp nhất để giúp [task_contract_employer.GetCulture.GetCollectiveNoun] thông qua [scheme.GetName].\n\n"
  laamp_extra_contract_schemes.0001.desc_faith: "Ta đạt đủ số lượng cùng đồng sự. Chúng Ta, những người của [ROOT.Char.GetPrimaryTitle.GetBaseName], là phù hợp nhất để giúp [task_contract_employer.GetFaith.GetAdherentNamePlural] thông qua [scheme.GetName].\n\n"
  laamp_extra_contract_schemes.0001.desc_diplomacy: "[task_contract_employer.GetTitledFirstName] bắt đầu sắp xếp một loạt buổi họp: kỹ năng hùng biện của Ta sẽ được kiểm nghiệm. Thương lượng tốt với đại diện [task_contract_target.GetTitledFirstNamePossessive] có thể giúp chủ Ta đạt được quyền lợi."
  laamp_extra_contract_schemes.0001.desc_martial: "[task_contract_target.GetTitledFirstName] dường như là một [task_contract_target.GetWomanMan] đủ lý trí. Khi các tay sai cứng cỏi của Ta bắt đầu đe dọa quan chức địa phương [task_contract_target.GetHerHis], liệu [task_contract_target.GetSheHe] có chống lại? Khi chúng Ta dẫn nông dân hò hét và đốt phá, liệu [task_contract_target.GetSheHe] có phản kháng? Không, tốt hơn là đồng ý với điều kiện của [task_contract_employer.GetTitledFirstNamePossessive]..."
  laamp_extra_contract_schemes.0001.desc_intrigue: "[task_contract_target.GetTitledFirstName] không thể nào miễn nhiễm với những thú vui trần thế, cũng chẳng đủ kiêu hãnh và quyền uy để không cảm thấy hổ thẹn nếu những sai lầm bị phơi bày... sự tống tiền khôn khéo thậm chí có thể đảm bảo tương lai cho dân chúng của [task_contract_target.GetTitledFirstNamePossessive]."
  laamp_extra_contract_schemes.0001.desc_learning: "Giống như mọi bộ luật, [task_contract_target.GetPrimaryTitle.GetBaseNameNoTier] có những quy định và ngoại lệ khó hiểu, một trong số đó có thể được dùng để bảo vệ dân [task_contract_employer.GetTitledFirstNamePossessive]. Ta chỉ cần tìm ra cách vận dụng."
  laamp_extra_contract_schemes.0001.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_extra_contract_schemes.0001.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_extra_contract_schemes.0001.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_extra_contract_schemes.0001.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_extra_contract_schemes.0001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
  laamp_extra_contract_schemes.0002.t_diplomacy: "Thành công: $protect_minority_vassal_contract_diplomacy_scheme$ Scheme"
  laamp_extra_contract_schemes.0002.t_martial: "Thành công: $protect_minority_vassal_contract_martial_scheme$ Scheme"
  laamp_extra_contract_schemes.0002.t_intrigue: "Thành công: $protect_minority_vassal_contract_intrigue_scheme$ Scheme"
  laamp_extra_contract_schemes.0002.t_learning: "Thành công: $protect_minority_vassal_contract_learning_scheme$ Scheme"
  laamp_extra_contract_schemes.0002.desc_diplomacy: "Vào tận đại sảnh của [task_contract_target.GetName], Ta trình bày lý do của [task_contract_employer.GetTitledFirstName]. Với tin tốt lành để báo cáo, với tiếng reo hò vẫn vang trong tai, Ta trở về gặp nhà tuyển dụng. \n\n"'Một việc nhỏ, dễ sửa', [task_contract_target.GetSheHe] gọi vậy!" [task_contract_employer.GetSheHe] cười. "Ngài đã đấu tranh cho 'việc nhỏ' tự do của nhân dân Ta! Các quyền bảo vệ của chúng ta sẽ sớm được công bố chính thức, và Ta khó mà vui hơn nữa.""
  laamp_extra_contract_schemes.0002.desc_martial: "Như dự đoán, những người theo Ta đầy kinh nghiệm gieo rắc nỗi sợ trong lãnh thổ của [task_contract_target.GetTitledFirstNamePossessive], buộc [task_contract_target.GetHerHim] cuối cùng — và từ vị thế yếu — phải đến bàn đàm phán.\n\n"Ngài đã gây ra hỗn loạn mà những kẻ áp bức [task_contract_employer.GetPrimaryTitle.GetNameNoTier] sẽ nhớ mãi!" [task_contract_employer.GetTitledFirstNameNoTooltip] ngưỡng mộ. "Họ đáng ra phải #EMP quỳ xin#! quyền bảo vệ! Dù sao đi nữa: nghĩa vụ mới của chúa Ta sẽ sớm được thực hiện. Một chiến thắng lớn!""
  laamp_extra_contract_schemes.0002.desc_intrigue: "[task_contract_target.GetName] là một [task_contract_target.GetWomanMan] khá phức tạp — xét về đạo đức, chứ không phải trí tuệ! Ta đã tích lũy được một kho tin đồn độc địa; chỉ vài từ được lên kế hoạch kỹ lưỡng, và vị [task_contract_target.GetTitleAsNameNoTooltip] sẽ nhận thức được tất cả phẩm giá mà kẻ đó sẽ đánh mất khi chống lại [task_contract_employer.GetTitledFirstName].\n\n"Triều đình của chúa tể ta thật dễ dàng trở thành một ổ rắn độc!" [task_contract_employer.GetTitledFirstName] reo lên. "Ta sẽ khoan dung, và cho hắn cơ hội ban phát quyền lợi cho dân chúng của ta... trước khi ta gửi [task_contract_employer.GetHerHis] công việc vào một vòng xoáy không lối thoát.""
  laamp_extra_contract_schemes.0002.desc_learning: "Ta nghiền ngẫm mọi thứ Ta có thể tìm về luật pháp [task_contract_target.GetPrimaryTitle.GetAdjectiveNoTooltip]: giáo luật [task_contract_target.GetFaith.GetName], nguyên tắc [task_contract_target.GetCulture.GetName]... ôi vâng, Ta đã tập hợp được một kho tàng tiền lệ và sắc thái.\n\n"Giải thích lại đi..." [task_contract_employer.GetTitledFirstName] hỏi. "Ta phải viện dẫn [task_contract_target.GetFaith.WarGodName] khi đề cập đến danh dự bất khả xâm phạm, đúng không? À, không sao — trường hợp của chúng ta mạnh hơn bao giờ hết! Sự đồng ý của [task_contract_target.GetTitledFirstNamePossessive] chỉ là hình thức."
  laamp_extra_contract_schemes.0002.a: "Nhân dân [task_contract_employer.GetCapitalLocation.GetNameNoTooltip] có thể vui mừng!"
  laamp_extra_contract_schemes.0003.t_diplomacy: "Thất bại: $protect_minority_vassal_contract_diplomacy_scheme$ Scheme"
  laamp_extra_contract_schemes.0003.t_martial: "Thất bại: $protect_minority_vassal_contract_martial_scheme$ Scheme"
  laamp_extra_contract_schemes.0003.t_intrigue: "Thất bại: $protect_minority_vassal_contract_intrigue_scheme$ Scheme"
  laamp_extra_contract_schemes.0003.t_learning: "Thất bại: $protect_minority_vassal_contract_learning_scheme$ Scheme"
  laamp_extra_contract_schemes.0003.desc_diplomacy: "[task_contract_target.GetNamePossessive] không cho Ta gì cả, không khoan nhượng hay cảm thông chút nào. Dù Ta nói gì, đại diện [task_contract_target.GetPrimaryTitle.GetAdjective] chỉ cười nhạo vào mặt Ta.\n\n"Ta được bảo rằng chúa Ta đã #EMP chán ngấy#! với sự càm ràm của Ngài!" [task_contract_employer.GetTitledFirstNameNoTooltip] hét lên. "Trái tim mềm yếu của Ngài — và nhân dân tội nghiệp của Ta — bị chế nhạo khắp [task_contract_employerr.GetPrimaryTitle.GetNameNoTierNoTooltip]! Đây là mưu kế rõ ràng... và giờ #EMP chúng ta#! phải gánh hậu quả."
  laamp_extra_contract_schemes.0003.desc_martial: "Khi những người theo Ta nổi loạn khắp [task_contract_target.GetPrimaryTitle.GetName], [task_contract_target.GetName] không hề chùn bước. Mọi quấy rối nhân dân [task_contract_target.GetHerHis] đều được đáp trả lại cho [task_contract_employer.GetTitledFirstNamePossessive].\n\n"Chúng ta đã chịu đủ rồi!" nhà tuyển dụng Ta nói. "Thời kỳ đen tối này sẽ hủy hoại chúng ta! Hãy gửi bọn côn đồ đi, hoặc [task_contract_employer.Custom('KnightCulturePluralNoTooltip')|l] của Ta và chúa Ta sẽ hợp lực chống lại Ngài!""
  laamp_extra_contract_schemes.0003.desc_intrigue: "[task_contract_target.GetName] hóa ra là một [task_contract_target.GetWomanMan] rất khôn ngoan, rất kín đáo. Không tìm được gì xấu thực sự, Ta cố gieo tin đồn trong triều [task_contract_target.GetHerHis], nhưng tất cả đều bị bác bỏ ngay lập tức.\n\n"Đặc vụ của Ngài lảm nhảm như trẻ con!" nhà tuyển dụng Ta mắng. "Ngài nói âm mưu của mình sẽ bảo vệ nhân dân Ta, nhưng Ngài chỉ bọc chúng bằng bóng tối và thì thầm — tan biến khi nói ra! Mưu kế này vốn vô ích...""
  laamp_extra_contract_schemes.0003.desc_learning: "Ta nghiền ngẫm mọi thứ Ta có thể tìm về luật pháp [task_contract_target.GetPrimaryTitle.GetAdjectiveNoTooltip]: giáo luật [task_contract_target.GetFaith.GetName], nguyên tắc [task_contract_target.GetCulture.GetName]... Ta gom được vài lập luận yếu ớt, nhưng biệt ngữ sáng tạo của Ta chẳng gây ấn tượng gì với [task_contract_employer.GetName].\n\n"#EMP Đây#! là những gì Ngài nghĩ ra? Ngài nghĩ nhân dân Ta nên được coi như #EMP trẻ con#! trong [task_contract_target.GetPrimaryTitle.GetName]?!?" [task_contract_employer.GetTitleAsNameNoTooltip] hét lên. "Một mưu kế nhỏ nhen, nhục nhã, và [task_contract_target.GetTitledFirstName] sẽ dễ dàng nhìn thấu! Không — chúng ta vô vọng.""
  laamp_extra_contract_schemes.0003.a: "Ta đã không làm mọi việc tốt hơn cho [task_contract_employer.GetTitledFirstNameNoTooltip]..."

  laamp_help_find_secrets_scheme: "Tìm bí mật"
  laamp_help_find_secrets_scheme_action: "Tìm bí mật về"
  laamp_help_find_secrets_scheme_desc: "Khám phá bí mật của [vassals|E] thuộc [contractor|E], cho phép Ngài tống tiền họ để lấy [hooks|E] hoặc báo cáo lại cho [contractor|E] của Ngài."
  laamp_help_find_secrets_scheme_desc_general: "$laamp_help_find_secrets_scheme_desc$"
  laamp_help_find_secrets_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_extra_contract_schemes.0022.t: "$ep3_contract_event.0100.t$"
  laamp_extra_contract_schemes.0022.a: "Ta sẽ giữ nghĩa vụ này cho riêng mình."
  laamp_extra_contract_schemes.0022.b: "Một mồi nhử hoàn hảo cho [councillor_liege.GetTitleAsNameNoTooltip]."
  laamp_extra_contract_schemes.0022.c: "Ta không thể hạ mình đến mức đó."
  laamp_extra_contract_schemes.0023.t: "$ep3_contract_event.0100.t$"
  laamp_extra_contract_schemes.0023.desc: ""Chúa Ta hài lòng với những thông tin Ngài thu thập. Ngài đã tìm thấy, gì cơ? [secrets_found_value]? Không hề đơn giản..." [task_contract_councillor.GetName] nghiêng người về phía ánh sáng, lộ ra rằng [task_contract_councillor.GetSheHe] somehow đang ở trong lều với Ta.\n\n"Làm sao Ngài đến đây mà không bị phát hiện?" Ta hỏi, bối rối, nhưng trước khi gọi lính canh — không còn ai cả. Chỉ còn một bao tiền khá lớn."
  laamp_extra_contract_schemes.0023.a: "Ta sẽ lấy vàng thôi. Cố đừng nghĩ nhiều."
  laamp_extra_contract_schemes.0024.t: "$ep3_contract_event.0100.t$"
  laamp_extra_contract_schemes.0024.desc: ""Ta đã chờ báo cáo của Ngài, nhưng chẳng thấy gì. Ta lo lắng... có lẽ Ngài đã quên thỏa thuận của chúng ta?" [task_contract_councillor.GetName] mắng Ta — khi Ta đến gần nhà vệ sinh! Thật táo bạo! Làm sao [task_contract_councillor.GetSheHe] đến đây mà không bị phát hiện?\n\n"Ta có đặc vụ giám sát mọi ngóc ngách ở [task_contract_target.GetCapitalLocation.GetName], nhưng vô ích," Ta giải thích. "Hoặc triều thần [task_contract_target.GetTitledFirstNamePossessive] trung thành, hoặc đơn giản chẳng có gì đáng tin." \n\n"Một lời bào chữa trẻ con... Ta nghĩ Ngài có thể làm tốt hơn. Ít nhất là một lời nói dối đẹp hơn. Hãy coi thỏa thuận kết thúc." Lắc đầu [task_contract_target.GetHerHis], [task_contract_councillor.GetFirstNameNoTooltip] biến mất nhanh như khi [task_contract_councillor.GetSheHe] đến."
  laamp_extra_contract_schemes.0024.a: "Thật phí thời gian!"
  laamp_extra_contract_schemes.0030.t: "$ep3_contract_event.0080.t$"
  laamp_extra_contract_schemes.0030.desc: "Tin về yêu sách mới của Ta nhanh chóng đến tai [task_contract_councillor.GetName].\n\n"Chúc mừng! Làm tốt lắm." [task_contract_councillor.GetSheHe|U] nói, như thể vỗ nhẹ vào lưng [task_contract_councillor.GetHerselfHimself].\n\n"[task_contract_councillor_liege.GetTitledFirstName] sẽ rất vui, và chắc chắn sẽ thưởng xứng đáng cho Ngài. Ta sẽ mang kịch bản quý giá của chúng ta từ đây... nếu Ngài đưa cho Ta?" [task_contract_councillor.GetFirstNameNoTooltip] nhanh chóng sốt ruột. "Nhanh nào! Đưa đây!" [task_contract_councillor.GetSheHe] nói, búng ngón tay [task_contract_councillor.GetHerHis]."
  laamp_extra_contract_schemes.0030.a: "Ta sẽ giữ một bản cho riêng mình."
  laamp_extra_contract_schemes.0030.b: "[target.GetNameNoTooltip] sẽ được chăm sóc tốt hơn!"
  laamp_extra_contract_schemes.0030.c: "Ta không còn tin Ngài nữa..."

  laamp_prison_break_scheme: "Đột nhập nhà tù"
  laamp_prison_break_scheme_action: "Giải cứu khỏi nhà tù của"
  laamp_prison_break_scheme_desc: "Lập kế hoạch và thực hiện vụ cướp [spouse|E], [family|E], [best_friend|E] hoặc [soulmate|E] của [contractor|E] từ một [prison|E]."
  laamp_prison_break_scheme_desc_general: "$laamp_prison_break_scheme_desc$"
  laamp_prison_break_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_extra_contract_schemes.0011.t: "$ep3_contract_event.0030.t$"
  laamp_extra_contract_schemes.0011.desc: "[task_contract_employer.GetTitledFirstName] khôn ngoan khi tìm đến Ta, một [ROOT.Char.GetLiege.Custom('KnightCultureNoTooltip')|l] tự do, ít rủi ro, cho một phi vụ táo bạo... có cách để lẻn qua tường [task_contract_target.GetCapitalLocation.GetName], nhưng không cách nào an toàn hoàn toàn. Bằng một lý do khéo léo, Ta cần có mắt thân thiện đến tận ô giam [task_contract_object.GetTitledFirstNamePossessive]...\n\n[task_contract_employer.Custom2('HerHisCharacterIntroduction', task_contract_object)|U] sẽ gây chú ý ngay cả với sự tham gia nhỏ nhất. Không, tự do của [task_contract_object.GetWomanMan] chỉ dựa vào [ROOT.Char.GetPrimaryTitle.GetBaseName]."
  laamp_extra_contract_schemes.0011.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_extra_contract_schemes.0011.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_extra_contract_schemes.0011.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_extra_contract_schemes.0011.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_extra_contract_schemes.0011.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
  laamp_extra_contract_schemes.0012.t: "Thành công: $laamp_prison_break_contract_contract$ Scheme"
  laamp_extra_contract_schemes.0012.desc_thief: "$laamp_extra_contract_schemes.0013.desc_intro$ [agent_thief.GetFirstName] thông minh nhanh chóng mở khóa ngăn chúng Ta tiếp cận [task_contract_object.GetTitledFirstName]."
  laamp_extra_contract_schemes.0012.desc_no_thief: "$laamp_extra_contract_schemes.0013.desc_intro$ Ngón tay Ta ướt mồ hôi căng thẳng, nhưng vẫn mở khóa chính xác."
  laamp_extra_contract_schemes.0012.desc_lookout: "[agent_lookout.GetFirstName] cảnh giác ra hiệu chúng ta an toàn."
  laamp_extra_contract_schemes.0012.desc_no_lookout: "Ta vội vàng nhìn quanh tìm lính canh, dường như chúng ta an toàn."
  laamp_extra_contract_schemes.0012.desc: "Ta ra hiệu im lặng với [task_contract_object.GetFirstNameNoTooltip], dẫn [task_contract_object.GetHerHim] ra bóng tối."
  laamp_extra_contract_schemes.0012.desc_infiltrator: "Quay trở lại chỗ vào — cửa sổ do [agent_infiltrator.GetFirstName] để lại mở — chúng Ta đi qua."
  laamp_extra_contract_schemes.0012.desc_no_infiltrator: "Quay lại chỗ vào — đại sảnh có vẻ không bị canh gác — chúng Ta đi qua."
  laamp_extra_contract_schemes.0012.desc_free: "Chúng Ta lẻn đến ngựa, nhảy lên yên, và thúc mạnh.\n\n"Ngài cứu mạng Ta, thật!" [task_contract_object.GetNameNoTooltip] nói, khi chúng Ta cuối cùng chậm lại. "Và thật hồi hộp!""
  laamp_extra_contract_schemes.0012.a: ""Ta thích thái độ đó... tham gia với chúng Ta!""  
  laamp_extra_contract_schemes.0012.b: ""[task_contract_employer.GetTitledFirstNameNoTooltip] đang nóng lòng đợi Ngài.""
  laamp_extra_contract_schemes.0013.t: "Thất bại: $laamp_prison_break_contract_contract$ Scheme"
  laamp_extra_contract_schemes.0013.desc_intro: "Trong đêm tối, Ta lẻn vào nơi [task_contract_object.GetTitledFirstName] bị giam."
  laamp_extra_contract_schemes.0013.desc_no_thief: "$laamp_extra_contract_schemes.0013.desc_intro$ Một lúc Ta loay hoay mở cửa bằng lockpick. Có thể một tên trộm làm được. Nhưng Ta không thể. Không còn cách nào, Ta đá cửa ầm ĩ. Và tiếng người vang gần đó — cai ngục!\n\n"Xin lỗi, nhưng Ta phải đi, [task_contract_object.GetLadyLord]. Điều này... vượt quá khả năng Ta," Ta thì thầm, chia tay.\n\n"#EMP Bah!#! Không cảm ơn gì cả!" một giọng chắc chắn là [task_contract_object.GetFirstNamePossessiveNoTooltip] trả lời.\n\n"Hả? Ai đó?" một lính canh hét lên. May mắn thay... Ta ẩn mình và lẻn đi trong bóng tối."
  laamp_extra_contract_schemes.0013.desc_no_lookout: "$laamp_extra_contract_schemes.0012.desc_no_thief$ Nhưng trên sàn, ánh đèn lập lòe — lính canh gần đó! Ta ước có mắt sau lưng! Ta nắm [task_contract_object.GetFirstNameNoTooltip] lao đi.\n\n"Ai đó?" cai ngục hét. "#EMP Cảnh báo! Cảnh báo!#!\n\nNhững kẻ truy đuổi vũ trang nhanh chóng đuổi theo và, lúc tệ nhất, [task_contract_object.GetFirstNameNoTooltip] vấp ngã. Ngay lập tức, [task_contract_object.GetSheHe] bị dồn vào; Ta buộc phải chạy một mình."
  laamp_extra_contract_schemes.0013.desc_no_infiltrator: "$laamp_extra_contract_schemes.0012.desc_no_thief$ $laamp_extra_contract_schemes.0012.desc$ Quay lại chỗ vào — đại sảnh có vẻ không bị canh gác — chúng Ta đi qua. Nhưng cửa giờ bị khóa!\n\nKhi Ta đẩy mở, một lính canh xuất hiện sau lưng!\n\n"Ta giữ hắn!" [task_contract_object.GetFirstNameNoTooltip] hét. "Đi đi!"\n\nVới những tiếng khác vang gần đó, Ta chọn phương án duy nhất — chạy. Nếu ai đó phải chết vì [task_contract_object.GetWomanMan]... sao lại không phải [task_contract_employer.GetTitledFirstName]...?"
  laamp_extra_contract_schemes.0013.desc: "$laamp_extra_contract_schemes.0012.desc_no_thief$ $laamp_extra_contract_schemes.0012.desc$ $laamp_extra_contract_schemes.0012.desc_no_infiltrator$\n\nNhưng lính canh [task_contract_object.GetHerHis] giăng bẫy: #EMP họ biết trước vụ giải cứu!#!\n\n"Nhờ [task_contract_object.GetFaith.HighGodName]! Ta biết quá dễ dàng!" [task_contract_object.GetFirstNameNoTooltip] hét. "Chạy đi, dũng cảm [ROOT.Char.GetLiege.Custom('KnightCultureNoTooltip')|l]!"\n\nLính canh lao tới, không còn thời gian, không còn hy vọng — Ta phải chạy! Bằng phép màu nào đó, Ta lắc kẻ truy đuổi và tới bức tường ngoài an toàn... nhưng [task_contract_object.GetFirstNameNoTooltip] không bao giờ đến."
  laamp_extra_contract_schemes.0013.a: "[task_contract_object.GetSheHe|U] chắc chắn sẽ bị giám sát liên tục..."

 #################################################
 # Contract Employer Consequence Loc

 # (all the assorted guff that employers get in the contract rewards)

  laamp_base_0001_success_employer_modifier: "Quan lại vui vẻ"
  laamp_base_0001_success_employer_modifier_desc: "Triều đình của nhân vật này rộn ràng với những câu chuyện kỳ lạ về xứ sở xa lạ và cuộc sống phiêu lưu trên đường."
  laamp_base_0001_failure_employer_modifier: "Kẻ phiền phức"
  laamp_base_0001_failure_employer_modifier_desc: "Những kẻ lang thang phiền toái và gian trá tụ tập trong triều, khiến nơi này trở nên nhàm chán để sống."

  laamp_base_0011.tt.success_standard.employer_reward.remove_potential_rivals: "Loại bỏ [THIS.Char.MakeScope.ScriptValue('laamp_base_0011_num_removable_potential_rivals_value')] [rivals|E] tiềm năng"

  laamp_base_0031_success_employer_modifier: "Chuyên gia hòa giải"
  laamp_base_0031_success_employer_modifier_desc: "Nhân vật này đã thu hút được nhiều tài năng để giải quyết những tranh cãi trong lãnh thổ của mình."
  laamp_base_0031_failure_employer_modifier: "Trốn tránh trách nhiệm"
  laamp_base_0031_failure_employer_modifier_desc: "Nhân vật này cố gắng đẩy lỗi cho người khác, nhưng chỉ làm mọi thứ trở nên tệ hơn."

  laamp_base_0041_success_employer_modifier: "Cả tin"
  laamp_base_0041_success_employer_modifier_desc: "Dù cố gắng hết sức, nhân vật này vẫn tin hơi quá vào những gì được nói."
  laamp_base_0041_failure_employer_modifier: "Cảnh giác với kẻ nói dối"
  laamp_base_0041_failure_employer_modifier_desc: "Nhân vật này hiểu rằng không ai đến triều đình nếu không muốn gì đó, và hành xử theo đó."

  laamp_base_1001_success_employer_modifier: "Tội phạm bị bắt"
  laamp_base_1001_success_employer_modifier_desc: "Quận này tạm thời không còn các phần tử tái phạm — ít nhất là hiện tại."

  laamp_base_1021_success_employer_modifier: "Binh lính thuần thục"
  laamp_base_1021_success_employer_modifier_desc: "Một huấn luyện viên chuyên nghiệp đã rèn luyện lính nhà nhân vật này thành một cỗ máy nhịp nhàng."
  laamp_base_1021_failure_employer_modifier: "Đám côn đồ lôi thôi"
  laamp_base_1021_failure_employer_modifier_desc: "#EMP Binh lính?#! Những lính nhà nhân vật này trông như những kẻ say rượu sinh ra ở bùn lầy hơn là chiến binh."

  laamp_base_1031_success_employer_modifier: "Vùng đất yên bình"
  laamp_base_1031_success_employer_modifier_desc: "Quận này hiện đang trải qua giai đoạn yên ả tương đối."
  laamp_base_1031_failure_employer_modifier: "Vùng đất hỗn loạn"
  laamp_base_1031_failure_employer_modifier_desc: "Tranh cãi và xung đột nhỏ là chuyện thường xuyên ở đây, và dân chúng biết phải đổ lỗi cho ai."

  laamp_base_1041_success_employer_modifier: "Khách lữ bị chặn đường"
  laamp_base_1041_success_employer_modifier_desc: "Dù là thu thuế, khách hành hương, hay thương nhân, đường xá quận này không an toàn cho ai cả."
  laamp_base_1041_failure_employer_modifier: "Đường xá an toàn"
  laamp_base_1041_failure_employer_modifier_desc: "Dù những tên tội phạm chuyên nghiệp có ra tay, các con đường quận này vẫn được canh gác kỹ lưỡng."

  laamp_base_2021_failure_employer_modifier: "Xây dựng tồi tệ"
  laamp_base_2021_failure_employer_modifier_desc: "Cơ sở hạ tầng quận này hoàn toàn hỗn loạn, khiến việc xây dựng trở nên cực kỳ tốn kém."

  laamp_base_2031_success_employer_modifier: "Tất cả yên bình"
  laamp_base_2031_success_employer_modifier_desc: "Dù vẫn có vấn đề về ranh giới nội bộ chính xác, dân cư quận này hiện khá hài lòng."
  laamp_base_2031_failure_employer_modifier: "Điểm sôi sục"
  laamp_base_2031_failure_employer_modifier_desc: "Xung đột ở đây đã nóng đến mức người dân dành nhiều thời gian tranh cãi hơn là làm việc."

  laamp_base_2041_success_employer_modifier: "Người đại diện giả"
  laamp_base_2041_success_employer_modifier_desc: "Ai cũng biết rằng các nhân viên thu thuế của nhân vật này từng bị giả mạo, gây khó khăn không ngừng cho công việc."
  laamp_base_2041_failure_employer_modifier: "Quan chức đáng tin"
  laamp_base_2041_failure_employer_modifier_desc: "Dân chúng biết rằng, nếu không có dấu hiệu thích hợp, không ai thực sự có chức vụ."

  laamp_base_3001_success_employer_modifier: "Tình báo vững chắc"
  laamp_base_3001_success_employer_modifier_desc: "Nhân vật này nhận được các báo cáo chi tiết về tình hình các lãnh thổ khác."

  laamp_base_3041_success_employer_modifier: "Kho bạc bị cướp"
  laamp_base_3041_success_employer_modifier_desc: "Lời đồn rằng nhân vật này không giữ nổi tiền bạc của mình."
  laamp_base_3041_failure_employer_modifier: "Kho bạc được bảo vệ"
  laamp_base_3041_failure_employer_modifier_desc: "Nhân vật này đã ngăn chặn thành công một vụ tấn công vào bạc tích lũy."

  laamp_base_4001_success_employer_modifier: "Hồ sơ gọn gàng"
  laamp_base_4001_success_employer_modifier_desc: "Giấy tờ có thể đắt, nhưng hồ sơ vẫn quan trọng, và nhân vật này có một kho hồ sơ đồ sộ."
  laamp_base_4001_failure_employer_modifier: "Hồ sơ lộn xộn"
  laamp_base_4001_failure_employer_modifier_desc: "Một kẻ bất tài đã can thiệp vào lưu trữ của nhân vật này, làm phức tạp việc quản lý."

  laamp_base_4021_success_employer_modifier: "Văn bản thời thượng"
  laamp_base_4021_success_employer_modifier_desc: "Một tác phẩm trang trí cầu kỳ do nhân vật này đặt hiện đang rất được ưa chuộng tại triều."
  laamp_base_4021_failure_employer_modifier: "Người bảo trợ lỗi mốt"
  laamp_base_4021_failure_employer_modifier_desc: "Nhân vật này nổi tiếng vì tiêu tiền vào những thứ rối rắm và khó hiểu nhất."

  laamp_base_4041_success_employer_modifier: "Thần thánh giả"
  laamp_base_4041_success_employer_modifier_desc: "Từ bùa chú đến thánh tích, ai cũng biết nếu muốn vật thiêng liêng nhỏ, có thể mua ở lãnh thổ của nhân vật này."
  laamp_base_4041_failure_employer_modifier: "Chuẩn mực linh thiêng"
  laamp_base_4041_failure_employer_modifier_desc: "Nhân vật này nổi tiếng vì cứng rắn với những thánh tích giả."

  laamp_base_5001_success_employer_modifier: "Loài thú kiểm soát"
  laamp_base_5001_success_employer_modifier_desc: "Dân số động vật trong quận này được kiểm soát hoàn toàn."
  laamp_base_5001_failure_employer_modifier: "Hoang dã tự do"
  laamp_base_5001_failure_employer_modifier_desc: "Thú hoang sinh sản quá nhiều và lang thang mạnh mẽ, đe dọa sinh mạng con người."

  laamp_base_5011_success_employer_modifier: "Thương nhân an tâm"
  laamp_base_5011_success_employer_modifier_desc: "Tầng lớp thương nhân biết rằng tài sản của họ được bảo vệ."
  laamp_base_5011_failure_employer_modifier: "Bốc hơi"
  laamp_base_5011_failure_employer_modifier_desc: "Các khoản đầu tư ở đây có nguy cơ trở thành củi đun."

  laamp_base_5021_success_employer_modifier: "Bảo vệ tốt"
  laamp_base_5021_success_employer_modifier_desc: "Nhân vật này được bảo vệ kỹ lưỡng trước mọi mối đe dọa."
  laamp_base_5021_failure_employer_modifier: "Thoát chết trong gang tấc"
  laamp_base_5021_failure_employer_modifier_desc: "Lần thoát chết gần nhất của nhân vật này thật #EMP sát nút#!, và lần tiếp theo có khả năng còn nguy hiểm hơn."

  laamp_base_5031_success_employer_modifier: "Gia súc mất"
  laamp_base_5031_success_employer_modifier_desc: "Người cai trị quận này không thể đảm bảo an toàn cho đàn gia súc."
  laamp_base_5031_failure_employer_modifier: "Gia súc được bảo vệ"
  laamp_base_5031_failure_employer_modifier_desc: "Đàn gia súc ở đây được bảo vệ khỏi những kẻ trộm mưu mô nhất."

  laamp_base_5041_success_employer_modifier: "Mất một chút"
  laamp_base_5041_success_employer_modifier_desc: "Động vật trong quận này... ít hơn dự kiến, vì lý do nào đó."
  laamp_base_5041_failure_employer_modifier: "Hoang dã được bảo vệ"
  laamp_base_5041_failure_employer_modifier_desc: "Kẻ săn trộm sẽ bị treo cổ."

 #################################################
 # On-Going Diplo Scheme Events

  laamp_base_contract_schemes.0301.t: "Truyện & Vinh Quang"
  laamp_base_contract_schemes.0301.desc: "Bữa tối tại triều đình của [target.GetTitledFirstNamePossessive] là thời điểm lý tưởng để gây ấn tượng với đám triều thần bằng những cuộc phiêu lưu hào hùng của ta.\n\nHọ càng vui vẻ, túi tiền của ta càng đầy ắp.\n\nTất nhiên, điều này cần ít đi sự hóm hỉnh tinh tế và cần nhiều hơn những câu chuyện về các nỗ lực lớn lao, đầy ắp chủ nghĩa anh hùng và sự đê tiện — dù có chính xác hay không."
  laamp_base_contract_schemes.0301.a: "Ta nghĩ mình biết vài chuyện như vậy..."
  laamp_base_contract_schemes.0301.a.tt.success: "Việc làm của Ngài thật quyến rũ"
  laamp_base_contract_schemes.0301.a.tt.failure: "Lời nói của Ngài nghe trống rỗng"
  laamp_base_contract_schemes.0301.b: "Danh tiếng Ta chẳng tự nói lên tất cả sao?"
  laamp_base_contract_schemes.0301.b.f: "Xác suất thành công được điều khiển bởi [prestige_level|E] của Ngài"
  laamp_base_contract_schemes.0301.b.tt.success: "Đúng vậy"
  laamp_base_contract_schemes.0301.b.tt.failure: "Không hẳn"
  laamp_base_contract_schemes.0301.c: "Mọi câu chuyện đều lớn lên khi được kể!"
  laamp_base_contract_schemes.0301.c.tt.success: "Chuyện thêu dệt luôn hấp dẫn"
  laamp_base_contract_schemes.0301.c.tt.failure: "Một sự lừa dối rõ ràng"
  laamp_base_contract_schemes.0301.d: "Ăn đồ miễn phí rồi thôi."
  laamp_base_contract_schemes.0301.e: "Nhét đầy túi bánh mì miễn phí."
  laamp_base_contract_schemes_0301_doubtful_stories_modifier: "Chuyện Nghi Ngờ"
  laamp_base_contract_schemes_0301_doubtful_stories_modifier_desc: "Có gì đó không đúng về những gì họ nói."

  laamp_base_contract_schemes.0311.t: "Bờ xa & Xứ lạ"

  laamp_base_contract_schemes.0311.desc.only_exotic_culture: "Đối với [target.GetCulture.GetCollectiveNoun] như [target.GetTitledFirstName], một [ROOT.Char.GetWomanMan] mang trong mình niềm kiêu hãnh [exotic_culture.GetName] như ta là một sự lạ lẫm đầy hiếu kỳ, thậm chí có thể là một thứ hiếm có: ai biết khi nào họ mới có cơ hội trò chuyện với người như ta và lắng nghe những câu chuyện về quê hương xa xôi của ta?"
  laamp_base_contract_schemes.0311.desc.only_exotic_faith: "Lời của [exotic_faith.HighGodName] — chắc chắn theo đúng dạng [exotic_faith.GetAdjective] — hầu như không có ở đất [target.GetTitledFirstNamePossessive].\n\nMột trạng thái đáng buồn, nhưng #EMP lại#! khiến các tập quán và nghi lễ của Ta trở nên kỳ lạ và hấp dẫn, thu hút nhiều người ở triều."
  laamp_base_contract_schemes.0311.desc.both_exotic: "Là cả [exotic_culture.GetName] lẫn [exotic_faith.GetAdherentName], cách sống kỳ lạ của Ta khiến các quan lại [target.GetTitledFirstNamePossessive] mê mẩn.\n\nNhiều người chưa từng thấy ai giống Ta. Có lẽ họ sẽ không bao giờ gặp lại, dù lịch sử sẽ diễn ra ra sao thì Ta không biết."
  laamp_base_contract_schemes.0311.desc.outro: "\n\nHọ không hẳn... #EMP lịch sự#! trong cách nhận xét, nhưng điều đó chỉ khiến họ dễ bị trêu chọc và giải trí hơn."
  laamp_base_contract_schemes.0311.a: "Để Ta kể cho Ngài nghe về cuộc sống [exotic_culture.GetNameNoTooltip]!"
  laamp_base_contract_schemes.0311.a.tt.success: "Một câu chuyện mê hoặc"
  laamp_base_contract_schemes.0311.a.tt.success.cultural_acceptance: "Những câu chuyện phiêu lưu kỳ thú của người ngoại quốc"
  laamp_base_contract_schemes.0311.a.tt.failure: "Một bài nói kinh hoàng"
  laamp_base_contract_schemes.0311.a.tt.failure.cultural_acceptance: "Chuyện lạ từ một người xa lạ"
  laamp_base_contract_schemes.0311.b: "Ahhhh, [exotic_faith.GetNameNoTooltip] thật bí ẩn..."
  laamp_base_contract_schemes.0311.b.tt.success: "Sự huyền bí lôi cuốn"
  laamp_base_contract_schemes.0311.b.tt.failure: "Sự hư hỏng rối rắm"
  laamp_base_contract_schemes.0311.c: "Ta sẽ vẽ cho Ngài... một #EMP bức tranh#!..."
  laamp_base_contract_schemes.0311.c.tt.success: "Những lời dối ngọt ngào"
  laamp_base_contract_schemes.0311.c.tt.failure: "Lời dối rõ ràng nhất"
  laamp_base_contract_schemes.0311.d: "Những tinh tế sẽ bị Ngài bỏ lỡ, e rằng vậy."
  laamp_base_contract_schemes_0311_likes_other_faiths_modifier: "Thích Tín Ngưỡng Lầm Lạc"
  laamp_base_contract_schemes_0311_likes_other_faiths_modifier_desc: "Nhân vật này đã có dịp thưởng thức những niềm vui đơn giản của người có tín ngưỡng lầm lạc."
  laamp_base_contract_schemes_0311_hates_other_faiths_modifier: "Ghét Tín Ngưỡng Xa Lạ"
  laamp_base_contract_schemes_0311_hates_other_faiths_modifier_desc: "Nhân vật này không hiểu sao nhiều người có thể sai đến vậy."

  laamp_base_contract_schemes.0321.t: "Một Người Tình Nguyện"
  laamp_base_contract_schemes.0321.desc.intro: "Trong thời gian ở triều đình [target.GetTitledFirstNamePossessive], chúng Ta đã cố gắng hết sức để giải trí và bận rộn các quan lại của [target.GetHerHis].\n\n"
  laamp_base_contract_schemes.0321.desc.three_courtiers: "Có vẻ như chúng ta đã hoàn thành công việc hơi #EMP quá#! xuất sắc, vì một vài triều thần của kẻ đó đã kín đáo tiếp cận ta, xin gia nhập trại của chúng ta!\n\n[courtier_1.GetFirstName] là kẻ hăng hái nhất, nhưng [courtier_2.GetFirstName] và [courtier_3.GetFirstName] cũng chẳng kém cạnh gì.\n\nChắc chắn [target.GetTitledFirstNameNoTooltip] sẽ không cho phép cả ba cùng rời đi với chúng ta, nhưng có lẽ ta có thể nhận một người."
  laamp_base_contract_schemes.0321.desc.two_courtiers: "Có vẻ như chúng ta đã hoàn thành công việc hơi #EMP quá#! xuất sắc, vì hai triều thần của kẻ đó đã kín đáo tiếp cận ta, xin gia nhập trại của chúng ta!\n\n[courtier_1.GetFirstName] là kẻ hăng hái nhất, nhưng [courtier_2.GetFirstName] cũng chẳng kém cạnh gì.\n\nChắc chắn [target.GetTitledFirstNameNoTooltip] sẽ không cho phép cả hai cùng rời đi với chúng ta, nhưng có lẽ ta có thể nhận một người."
  laamp_base_contract_schemes.0321.desc.one_courtier: "Có vẻ chúng Ta đã làm tốt công việc, khi quan lại [target.GetHerHis] [courtier_1.GetFirstName] bí mật tiếp cận Ta và xin theo đoàn.\n\n[target.GetTitledFirstNameNoTooltip] chắc chắn sẽ không tiếc một người trong số [target.GetHerHis] quan lại nếu Ta cho [courtier_1.GetFirstNameNoTooltip] gia nhập."
  laamp_base_contract_schemes.0321.a: "Chúng Ta sẽ nhận Ngài, [courtier_1.GetFirstNameNoTooltip]."
  laamp_base_contract_schemes.0321.b: "Có lẽ [courtier_2.GetFirstNameNoTooltip] cũng hứng thú..."
  laamp_base_contract_schemes.0321.c: "[courtier_3.GetFirstName] sẽ hữu dụng."
  laamp_base_contract_schemes.0321.d: "#EMP Ngài#!? Chắc chắn Ngài đùa đấy!"
  laamp_base_contract_schemes.0321.e: "Chẳng may, đoàn của chúng Ta đã đầy."

  laamp_base_contract_schemes.0331.t: "Điều Khiến Chúng Ta Tiến Tới"
  laamp_base_contract_schemes.0331.desc: "\"Ta thắc mắc, [ROOT.Char.GetFirstNameNoTooltip] thân mến\", [target.GetTitledFirstName] nói dài dòng một bữa tối lười biếng, \"Ngài kể những câu chuyện về đời và hành động của mình, nhưng Ngài sống dưới tấm bạt bùn, hầu như không được che chắn khỏi mưa rào hay nắng gắt\".\n\nTa gật đầu. Không thể phủ nhận điều đó.\n\n\"Khi nhiều tiện nghi cơ bản bị thiếu, điều gì khiến Ngài dậy mỗi sáng? Tại sao tiếp tục tiến bước khi ngày mai Ngài lại phải làm lại tất cả?\""
  laamp_base_contract_schemes.0331.a: "Phải có một lý do duy nhất sao?"
  laamp_base_contract_schemes.0331.a.tt.success: "Lời Ngài thật hùng biện"
  laamp_base_contract_schemes.0331.a.tt.failure: "Cách diễn đạt nhạt nhẽo"
  laamp_base_contract_schemes.0331.b: "Một con đường mở phải được bước đi."
  laamp_base_contract_schemes.0331.b.tt.success: "Tự do ngọt ngào"
  laamp_base_contract_schemes.0331.b.tt.failure: "Vô định hướng"
  laamp_base_contract_schemes.0331.c: "Vinh quang, cái chết, và Tình bạn được xây trên máu đổ."
  laamp_base_contract_schemes.0331.c.tt.success: "Khắc nghiệt nhưng công bằng"
  laamp_base_contract_schemes.0331.c.tt.failure: "Thường và tầm thường"
  laamp_base_contract_schemes.0331.d: "Cuộc tìm kiếm tri thức không có kết thúc, chỉ có sự hiểu biết."
  laamp_base_contract_schemes.0331.d.tt.success: "Học là phần thưởng riêng"
  laamp_base_contract_schemes.0331.d.tt.failure: "Vô nghĩa và phi thực tế"
  laamp_base_contract_schemes.0331.e: "Đơn giản: vẫn còn những cảnh chưa thấy."
  laamp_base_contract_schemes.0331.e.tt.success: "Lãng mạn biết bao"
  laamp_base_contract_schemes.0331.e.tt.failure: "Vâng, và chúng không đáng giá"
  laamp_base_contract_schemes.0331.f: "Cơ hội làm ăn và thỏa mãn #EMP tham vọng của Ta.#!"
  laamp_base_contract_schemes.0331.f.tt.success: "Tham vọng tàn nhẫn thật ấn tượng"
  laamp_base_contract_schemes.0331.f.tt.failure: "Một tên cướp đổi tên"
  laamp_base_contract_schemes.0331.g: "Ngài còn cần hỏi nữa không, [target.GetFirstNameNoTooltip]?"
  laamp_base_contract_schemes.0331.g.tt.success: "Tham vọng hấp dẫn"
  laamp_base_contract_schemes.0331.g.tt.failure: "Những giấc mơ thất bại"
  laamp_base_contract_schemes.0331.h: "Gặm đồ ăn và phớt lờ câu hỏi."

  laamp_base_contract_schemes.0541.t: "Khéo Tay"
  laamp_base_contract_schemes.0541.desc: "Gây ấn tượng với [target.GetTitledFirstName] đôi khi như một mùa làm việc đầy đủ.\n\nDù không phải quý tộc vĩ đại nhất thế giới, [target.GetSheHe] lại #EMP rất#! tò mò về tiêu chuẩn mà người khác nên tuân theo.\n\nTrong những tình huống như thế, an toàn nhất là dựa vào những gì Ta giỏi nhất, chọn một điều Ta làm tốt và để kỹ năng tỏa sáng.\n\nDù vậy, với người hay thất thường như [target.GetFirstNameNoTooltip], Ta cũng có thể thử tỏa sáng ở lĩnh vực ít quen thuộc hơn."
  laamp_base_contract_schemes.0541.duel.tt.success: "Ngài thật ấn tượng"
  laamp_base_contract_schemes.0541.duel.tt.failure: "Một màn trình diễn đáng xấu hổ"
  laamp_base_contract_schemes.0541.tt.highest_skill_weaker_results: "Thử [skill|E] tốt hơn sẽ ít phần thưởng hơn"
  laamp_base_contract_schemes.0541.tt.lowest_skill_stronger_results: "Thử [skill|E] yếu hơn sẽ có phần thưởng nhiều hơn"
  laamp_base_contract_schemes.0541.a: "Kỹ năng ngoại giao của Ta chắc chắn sẽ gây ấn tượng!"
  laamp_base_contract_schemes.0541.b: "Kỹ năng võ thuật của Ta chắc chắn sẽ gây ấn tượng!"
  laamp_base_contract_schemes.0541.c: "Kỹ năng quản lý tiền bạc của Ta chắc chắn sẽ gây ấn tượng!"
  laamp_base_contract_schemes.0541.d: "Kỹ năng trong việc bí mật mang lại sự hấp dẫn!"
  laamp_base_contract_schemes.0541.e: "Trí thức của Ta chắc chắn sẽ gây ấn tượng!"
  laamp_base_contract_schemes.0541.f: "Sức mạnh với lưỡi kiếm tự nói lên tất cả!"
  laamp_base_contract_schemes.0541.g: "Có lẽ Ta thử ngoại giao..."
  laamp_base_contract_schemes.0541.h: "Có lẽ Ta nên cho thấy khả năng chỉ huy thật sự..."
  laamp_base_contract_schemes.0541.i: "Ta không hẳn là #EMP tệ#! với tiền bạc..."
  laamp_base_contract_schemes.0541.j: "Ta có thể khoe sự tinh ranh..."
  laamp_base_contract_schemes.0541.k: "Ta có thể khoe học thức uyên thâm..."
  laamp_base_contract_schemes.0541.l: "Ta có thể khoe kỹ năng kiếm thuật..."
  laamp_base_contract_schemes.0541.m: "Giữ khoảng cách."

  laamp_base_contract_schemes.0551.t: "Người Vĩ Đại & Đáng Kính"
  laamp_base_contract_schemes.0551.desc: "Luôn có những người có ảnh hưởng hơn ở triều đình, và hội trường [target.GetTitledFirstNamePossessive] cũng không khác.\n\nMột số người bước đi uy nghi, số khác né tránh.\n\nNếu muốn gây ấn tượng, Ta có thể thu hút một thành viên xã hội ưu tú về phe mình, nhưng chọn ai..."
  laamp_base_contract_schemes.0551.duel.tt.success: "Ngài thật ấn tượng"
  laamp_base_contract_schemes.0551.duel.tt.failure: "Ngài nhàm chán hơn Ngài nghĩ"
  laamp_base_contract_schemes.0551.a: "[diplomacy_candidate.GetFirstNameNoTooltip] có vẻ dễ ảnh hưởng."
  laamp_base_contract_schemes.0551.b: "Ta có thể dễ dàng gây ấn tượng với [martial_candidate.GetFirstNameNoTooltip]."
  laamp_base_contract_schemes.0551.c: "[stewardship.GetFirstNameNoTooltip] và Ta có nhiều điểm chung."
  laamp_base_contract_schemes.0551.d: "Ta tự hỏi [intrigue_candidate.GetFirstNameNoTooltip] đang làm gì?"
  laamp_base_contract_schemes.0551.e: "[learning_candidate.GetFirstNameNoTooltip] có vẻ thú vị."
  laamp_base_contract_schemes.0551.f: "Chắc [prowess_candidate.GetFirstNameNoTooltip] sẽ đồng ý một trận đấu."
  laamp_base_contract_schemes.0551.g: "Điều này không khôn ngoan."
  laamp_base_contract_schemes_0551_impressive_at_court_modifier: "Gây ấn tượng tại triều"
  laamp_base_contract_schemes_0551_impressive_at_court_modifier_desc: "Ở mỗi triều đình đều có người gây ảnh hưởng — ở đây, họ nhìn vào Ngài."
  laamp_base_contract_schemes_0551_pathetic_at_court_modifier: "Hình ảnh thảm hại"
  laamp_base_contract_schemes_0551_pathetic_at_court_modifier_desc: "Trong chính trị, không gì tệ hơn bị bẽ mặt."

  laamp_base_contract_schemes.0561.t: "Mắt Xích Yếu Nhất"
 # ... obligatory "you are $laamp_base_contract_schemes.0561.t$, goodbye".
  laamp_base_contract_schemes.0561.desc: "[insider.GetTitledFirstName] rõ ràng là một trong những người thân cận nhất của [target.GetTitledFirstNamePossessive], đứng cao trong thứ bậc xã hội và có #EMP rất nhiều#! ảnh hưởng tới [target.GetTitleAsNameNoTooltip].\n\nViệc [insider.GetWomanMan] ca ngợi Ta, vì bất kỳ lý do gì, chắc chắn chỉ có lợi cho mục tiêu của Ta."
  laamp_base_contract_schemes.0561.a: "[insider.GetFirstNameNoTooltip] không thể cưỡng lại sức hút của Ta!"
  laamp_base_contract_schemes.0561.a.tt.success: "Lịch thiệp và điềm tĩnh"
  laamp_base_contract_schemes.0561.a.tt.failure: "Đẫm mồ hôi và lộn xộn"
  laamp_base_contract_schemes.0561.b: "Một chút vàng sẽ làm mềm tất cả Tình bạn."
  laamp_base_contract_schemes.0561.c: "Có thể là một ám chỉ #EMP tinh tế#!..."
  laamp_base_contract_schemes.0561.c.tt.success: "Ngài đã được hiểu"
  laamp_base_contract_schemes.0561.c.tt.failure: "Ngài thiếu tinh tế"
  laamp_base_contract_schemes.0561.d: "$laamp_base_contract_schemes.0561.c$"
  laamp_base_contract_schemes.0561.d.tt.success: "$laamp_base_contract_schemes.0561.c.tt.success$"
  laamp_base_contract_schemes.0561.d.tt.failure: "$laamp_base_contract_schemes.0561.c.tt.failure$"
  laamp_base_contract_schemes.0561.e: "Hãy để yên mọi chuyện."
  laamp_base_contract_schemes_0561_charmed_insider_modifier: "Insider Bị Thu Hút"
  laamp_base_contract_schemes_0561_charmed_insider_modifier_desc: "Một chút mê hoặc có tác dụng lớn."
  laamp_base_contract_schemes_0561_bored_insider_modifier: "Insider Chán Nản"
  laamp_base_contract_schemes_0561_bored_insider_modifier_desc: "Có những thứ còn tệ hơn việc trở nên chán ngắt. Nhưng không nhiều."
  laamp_base_contract_schemes_0561_bribed_insider_modifier: "Insider Hối Lộ"
  laamp_base_contract_schemes_0561_bribed_insider_modifier_desc: "Có thể không trung thực, nhưng #EMP hiệu quả#!"
  laamp_base_contract_schemes_0561_intimidated_insider_modifier: "Insider Bị Dọa"
  laamp_base_contract_schemes_0561_intimidated_insider_modifier_desc: "Không phải là điều gì đó sẽ xảy ra, nhưng nếu #EMP có thể#!?"
  laamp_base_contract_schemes_0561_spooked_insider_modifier: "Insider Hoảng Sợ"
  laamp_base_contract_schemes_0561_spooked_insider_modifier_desc: "Lời nói xấu từ người sai có thể tệ hơn cả thuốc độc."

  laamp_base_contract_schemes.0571.t: "Trả Trước"
  laamp_base_contract_schemes.0571.desc: "Không có gì đảm bảo rằng [target.GetTitledFirstName] cuối cùng sẽ trao cho Ta những món quà Ta khao khát, dù Ta có tỏ vẻ nịnh nọt dưới chân [target.GetHerHis] đến mức nào.\n\nRõ ràng Ta phải hành động, dùng mọi áp lực có thể để nhận trước một khoản vay. Sau đó, nếu [target.GetSheHe] ban thưởng thêm, Ta vui mừng, nếu không, nỗ lực của Ta đã được đền bù trước."
  laamp_base_contract_schemes.0571.duel.tt.success: "Ngài nài nỉ được một khoản quyên góp"
  laamp_base_contract_schemes.0571.duel.tt.failure: "Lời đề nghị của Ngài bị từ chối"
  laamp_base_contract_schemes.0571.a: "Theo [ROOT.Char.GetFaith.WealthGodName], Ta sẽ lấy tiền của mình!"
  laamp_base_contract_schemes.0571.b: "Một khoản quyên góp hào phóng là quá đủ."
  laamp_base_contract_schemes.0571.c: "Hốt sữa con dê còn hơn giết nó."
  laamp_base_contract_schemes.0571.d: "Chơi an toàn tuyệt đối."

