  laamp_base_6001_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_6001_desc_title: "Bảo vệ kẻ yếu!"
  laamp_base_6001_desc: "Những người dân chăm chỉ xứ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] đang cần giúp đỡ. [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] hứa sẽ thưởng hậu hĩnh cho những nhà phiêu lưu nhân hậu."

  laamp_base_contract_schemes.6001.t: "$laamp_base_6001_contract_scheme$"
  laamp_base_contract_schemes.6001.desc: ""Thú dữ, côn đồ và bọn lưu manh!"\n\nChỉ nghĩ đến thôi cũng đủ làm [employer.GetTitledFirstNamePossessive] bực mình.\n\n"Người dân bình thường của [employer.GetPrimaryTitle.GetTierAsNameNoTooltip|l] đang bất an đến mức Ta lo họ nổi dậy bất cứ lúc nào. Những ai có gia đình trẻ đã mắng các viên chức của Ta, hỏi tại sao chúng ta không bảo vệ họ.""
  laamp_base_contract_schemes.6001.a: "Chúng ta phải đảm bảo an toàn cho họ!"
  laamp_base_contract_schemes.6001.b: "Không có thời gian để lãng phí."
  laamp_base_contract_schemes.6001.c: "Không có lý do để thỏa hiệp."
 
  laamp_base_contract_schemes.6002.t: "$laamp_base_6001_contract_scheme$: Thành công!"
  laamp_base_contract_schemes.6002.desc: "Ba... bốn... và con [ROOT.Char.MakeScope.Var('animal_type').GetFlagName] thứ năm đã bị hạ sáng nay. Ta đặt xác lên xe, vừa kịp khi [employer.GetTitledFirstName] đến cùng một số Bạn Bè của [employer.GetHerHis].\n\n"Tuyệt vời!" [employer.GetSheHe] khen ngợi. "Không còn gia súc bị giết, không còn trẻ em mất tích. Đây, nhận tiền công của Ngài, và nếu dân thường than phiền lần nữa, Ta biết gọi ai.""
  laamp_base_contract_schemes.6002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 
  laamp_base_contract_schemes.6003.t: "$laamp_base_6001_contract_scheme$: Thất bại!"
  laamp_base_contract_schemes.6003.desc: ""Đủ rồi!" [employer.GetTitledFirstName] quát lớn, lắc đầu ngán ngẩm. "Ta chưa từng thấy màn phô diễn sức mạnh nào thảm hại đến thế kể từ khi chúng ta huấn luyện đám hầu cận bằng gươm gỗ."\n\n"Dân của ta đang lầm than, không được bảo vệ. Ngươi có mộng tưởng rằng chúng sẽ nộp thuế với thứ đó không?" Kẻ đó hỏi đầy mỉa mai.\n\n"Ngươi đã tiêu tốn của ta đủ vàng rồi. Đừng phí hoài thời giờ của ta thêm nữa.""
  laamp_base_contract_schemes.6003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 
  laamp_base_6011_contract: "$laamp_base_6011_contract_scheme$"
  laamp_base_6011_contract_scheme: "Giải Cứu Thần Dân Công Bằng"
  laamp_base_6011_contract_scheme_action: "Giải Cứu Thần Dân Công Bằng Của"
  laamp_base_6011_contract_scheme_desc: "Vùng hoang dã không biết thương xót. Tìm và cứu thần dân bất lực của [contractor_possessive|E].$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_6011_contract_scheme_desc_general: "$laamp_base_6011_contract_scheme_desc$"
  laamp_base_6011_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 
  laamp_base_6011_desc_title: "[TaskContract.GetEmployer.Custom('KnightCulturePluralNoTooltip')|U] Đích Thực!"
  laamp_base_6011_desc: "Một trong những thần dân công bằng nhất của [TaskContract.GetEmployer.GetTitledFirstNamePossessiveNoTooltip] chưa trở về sau khi đi vào rừng xứ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier]. Tòa án [TaskContract.GetEmployer.GetTitleAsNamePossessiveNoTooltip] hào hứng đưa ra phần thưởng."
  laamp_base_6011_request: "Nhiệm vụ [task_contract|E] này yêu cầu Ngài hoàn thành [GetScheme('laamp_base_6011_contract_scheme').GetTypeName] [scheme|E]"

  laamp_base_contract_schemes.6011.t: "$laamp_base_6011_contract_scheme$"
  laamp_base_contract_schemes.6011.desc: "Một [employer.GetTitledFirstName] mệt mỏi tiến về phía trại cùng với [employer.GetHerHis] [dummy_gender_soldier.GetWomenMen]. Đám ngựa dừng lại ngay trước lều của ta khi ta đứng dậy chào đón.\n\n"...cái tên [dummy_gender.GetWomanMan] chết tiệt kia," ta nghe thấy [employer.GetTitleAsNameNoTooltip|l] lầm bầm.\n\n"Chào buổi sáng, [ROOT.Char.GetFirstNameNoTooltip]," kẻ đó nói, lau mồ hôi trên trán. "Dường như một [dummy_gender.GetWomanMan] #EMP tuyệt sắc#! đã lạc trong rừng và đám triều thần của ta sẽ không thôi than vãn cho đến khi ta đưa được kẻ đó trở về.""
  laamp_base_contract_schemes.6011.a: "Một [dummy_gender.GetWomanMan] công bằng? Giải cứu ngay!"
  laamp_base_contract_schemes.6011.b: "Chúng ta phải nhanh chóng!"
  laamp_base_contract_schemes.6011.c: "Cách tiếp cận cân bằng là tốt nhất."
 
  laamp_base_contract_schemes.6012.t: "$laamp_base_6011_contract_scheme$: Thành công!"
  laamp_base_contract_schemes.6012.desc: ""Quay lại!" Một tiếng hét cao vút xuyên qua những tán cây dày đặc, và ta lần theo đó.\n\nĐứng giữa khoảng rừng trống là một trong những [beautiful_peasant.GetWomenMen] tuyệt mỹ nhất mà ta từng thấy. Kẻ đó cầm một cành cây như thể cầm thương, cố gắng giữ khoảng cách với một con [ROOT.Char.MakeScope.Var('animal_type').GetFlagName] hung dữ.\n\nVới một nhát chém nhanh gọn, ta bổ lưỡi gươm vào con thú, nó rú lên một tiếng rồi máu vọt ra, vấy bẩn thảm cỏ khi nó ngã gục.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" kẻ đó kêu lên, quỳ rạp xuống."
  laamp_base_contract_schemes.6012.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
  laamp_base_contract_schemes.6012.b: ""Chúng ta không #EMP cần phải chia tay#!.""
  laamp_base_contract_schemes.6012.b.tt.success: "[beautiful_peasant.GetShortUIName] cảm thấy vinh dự"
  laamp_base_contract_schemes.6012.b.tt.failure: "[beautiful_peasant.GetShortUIName] cảm thấy bị xúc phạm"
  laamp_base_6012_success_employer_modifier: "Người Vô Tội Được Giải Cứu"
  laamp_base_6012_success_employer_modifier_desc: "Nhân vật này đã trả công cho một nhà phiêu lưu hiệp sĩ để cứu một trong những thần dân công bằng của họ khỏi thú dữ."
 
  laamp_base_contract_schemes.6013.t: "$laamp_base_6011_contract_scheme$: Thất bại!"
  laamp_base_contract_schemes.6013.desc: ""Ngươi có định giải thích đây là thứ gì không?" [employer.GetTitledFirstName] xông vào lều của ta, ném chiếc khăn đẫm máu đỏ lòm lên mặt bàn.\n\n"Đám thị vệ tìm thấy nó khi đang tuần tra trong rừng, và nó có một huy hiệu mà ta cho là ngươi sẽ thấy rất quen thuộc." Kẻ đó xoa mi tâm. "Giờ ta phải đối mặt với đám triều thần náo loạn và đám quan lại đau lòng. Đừng mong nhận được toàn bộ tiền thù lao.""
  laamp_base_contract_schemes.6013.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 
  laamp_base_6021_contract: "$laamp_base_6021_contract_scheme$"
  laamp_base_6021_contract_scheme: "Tham Gia Vở Kịch"
  laamp_base_6021_contract_scheme_action: "Biểu Diễn Trong Vở Kịch Của"
  laamp_base_6021_contract_scheme_desc: "Người dân háo hức gặp một #EMP hiệp sĩ đích thực#! [contractor|E] đang cần một anh hùng thực sự.$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_6021_contract_scheme_desc_general: "$laamp_base_6021_contract_scheme_desc$"
  laamp_base_6021_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_6021_request: "Nhiệm vụ [task_contract|E] này yêu cầu Ngài hoàn thành [GetScheme('laamp_base_6021_contract_scheme').GetTypeName] [scheme|E]"
 
  laamp_base_6021_desc_title: "Một anh hùng được tìm kiếm,"
  laamp_base_6021_desc: "Người dân xứ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] đang tổ chức một vở kịch mô phỏng các câu chuyện anh hùng xưa. [TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] rất muốn tìm một hiệp sĩ dũng cảm để thỏa mãn mong muốn của họ."
  laamp_base_contract_schemes.6021.t: "$laamp_base_6021_contract_scheme$"
  laamp_base_contract_schemes.6021.desc.intro: "Quảng trường chợ [ROOT.Char.GetCurrentLocation.GetName] đông hơn bao giờ hết, đoàn ca sĩ đang chuẩn bị.\n\n"Một thanh kiếm #EMP gỗ#!?" một đứa trẻ nhìn qua bục, nhăn mặt ghê tởm.\n\n"
  laamp_base_contract_schemes.6021.desc.employer_child: ""[employer_child.GetFirstName], thế là đủ rồi." [employer.GetTitledFirstName] thúc giục kẻ đó quay về bên mình. "Ta đã bảo với ngươi rằng ta sẽ tìm một vị anh hùng thực thụ cho vở kịch và... hãy nhìn xem ai vừa mới xuất hiện kìa." [employer.GetFirstNameNoTooltip] nhìn thẳng vào ta."
  laamp_base_contract_schemes.6021.desc.random_child: "Đám nông dân được báo động nhanh chóng tập hợp lại cùng [dummy_gender.GetHerHim]: "Đây là thứ tốt nhất mà [employer.GetLadyLord] của chúng ta có thể mang đến sao?"\n\nNhưng tiếng lầm bầm dứt ngay khi [employer.GetTitledFirstName] tiến vào quảng trường, ghìm cương ngựa trước mặt ta:"
  laamp_base_contract_schemes.6021.desc.outro: ""Một khoản lợi dễ dàng, phải không? Chỉ cần làm dân làng ấn tượng.""
  laamp_base_contract_schemes.6021.a: "Hãy biến nó thành khoản lợi #EMP dễ nhất#!."
  laamp_base_contract_schemes.6021.b: "Càng sớm càng tốt."
  laamp_base_contract_schemes.6021.c: "Chắc chắn sẽ vui."
 
  laamp_base_contract_schemes.6022_6023.common_desc: ""...và rồi [ROOT.Char.GetSheHe] hạ con [ROOT.Char.MakeScope.Var('animal_type').GetFlagName] hung dữ!" trống dồn vang khi Ta bước qua sân khấu, cố nhớ từng vở kịch từng xem. Giơ vũ khí trên đầu, Ta tấn công con rối đầy màu sắc.\n\n"
 
  laamp_base_contract_schemes.6022.t: "$laamp_base_6021_contract_scheme$: Thành công!"
  laamp_base_contract_schemes.6022.desc: "$laamp_base_contract_schemes.6022_6023.common_desc$Đầu rớt khỏi sân khấu và khán giả vỡ òa cổ vũ. Ngồi trên bục cao, [employer.GetTitledFirstName] gật đầu."
  laamp_base_contract_schemes.6022.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
  laamp_base_6021_success_employer_modifier: "Vở Kịch Hiệp Sĩ"
  laamp_base_6021_success_employer_modifier_desc: "Nhân vật này đã tài trợ cho một nhà phiêu lưu lang thang biểu diễn trong vở kịch để làm hài lòng đám đông."
 
  laamp_base_contract_schemes.6023.t: "$laamp_base_6021_contract_scheme$: Thất bại!"
  laamp_base_contract_schemes.6023.desc: "$laamp_base_contract_schemes.6022_6023.common_desc$Ta trượt nhát đánh và thanh gươm kẹt chặt vào thân gỗ. Khán giả cười ồ lên, nhưng chẳng bao lâu sau sự thất vọng đã bao trùm lấy họ.\n\nTa liếc nhìn lên khán đài cao và thấy [employer.GetTitledFirstName] đang lắc đầu ngán ngẩm."
  laamp_base_contract_schemes.6023.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 
  laamp_base_6031_contract: "$laamp_base_6031_contract_scheme$"
  laamp_base_6031_contract_scheme: "Tham Gia Trận Đấu Kiếm"
  laamp_base_6031_contract_scheme_action: "Tham Gia Trận Đấu Kiếm Cho"
  laamp_base_6031_contract_scheme_desc: "Cần nhà phiêu lưu dũng cảm để bảo vệ trạm cầu. [contractor|E] hứa sẽ thưởng hậu hĩnh.$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_6031_contract_scheme_desc_general: "$laamp_base_6031_contract_scheme_desc$"
  laamp_base_6031_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_6031_request: "Nhiệm vụ [task_contract|E] này yêu cầu Ngài hoàn thành [GetScheme('laamp_base_6031_contract_scheme').GetTypeName] [scheme|E]"
 
  laamp_base_6031_desc_title: "Ai kiên cường: hãy chú ý!"
  laamp_base_6031_desc: "Cầu xứ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] vẫn chưa được bảo vệ. Một màn thể hiện sức mạnh là cần thiết để xua đuổi cướp. [TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] sẽ thưởng cho người ngăn chặn họ."
  laamp_base_contract_schemes.6031.t: "$laamp_base_6031_contract_scheme$"
  laamp_base_contract_schemes.6031.desc: "[employer.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('employer'))] khi kẻ đó tiến bước qua trại.\n\n"Một buổi sáng tuyệt vời," kẻ đó bắt đầu, "cơ hội hoàn hảo để cho đám vô lại đó thấy giá trị của một vị $knight_culture_player_no_tooltip$ thực thụ. Ngươi thấy đấy, có một cây cầu dẫn thẳng vào [ROOT.Char.GetCurrentLocation.GetName]. Đủ mọi hạng người xấu xa, kẻ khờ và phường ngu dốt đều lảng vảng ở đó."\n\n"Cần có ai đó dẹp loạn chỗ đó.""
  laamp_base_contract_schemes.6031.a: "Ta sẽ phá ba trăm giáo!"
  laamp_base_contract_schemes.6031.b: "Sẽ mất vài ngày."
  laamp_base_contract_schemes.6031.c: "Đến cầu!"
 
  laamp_base_contract_schemes.6032.t: "$laamp_base_6031_contract_scheme$: Thành công!"
  laamp_base_contract_schemes.6032.desc: "Thở hổn hển, Ta vỗ lưng ngựa. Dễ thôi, xong rồi.\n\nBảo vệ cầu này đã trở thành nhiệm vụ duy nhất của Ta trong hai tuần qua, áo giáp lấp lánh dưới ánh trăng. Biển giáo gãy xếp sang một bên là minh chứng cho thành tích của Ta.\n\n"[ROOT.Char.GetFirstNameNoTooltip]," [employer.GetTitledFirstName] chào Ta, gửi một số [employer.GetHerHis] [dummy_soldier.GetWomenMen] đi nhặt chiến lợi phẩm, "thật tuyệt vời.""
  laamp_base_contract_schemes.6032.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 
  laamp_base_contract_schemes.6033.t: "$laamp_base_6031_contract_scheme$: Thất bại!"
  laamp_base_contract_schemes.6033.desc: "#EMP "Áaaah!"#!\n\nTa quỵ xuống, máu chảy xuống khuỷu tay.\n\n"Để [ROOT.Char.GetHerHim] lại đó," Ta nghe một tên cướp lầm bầm trước khi bỏ đi, "không thể chống lại #EMP $knight_culture_player_no_tooltip$#!, sẽ có người đến đón [ROOT.Char.GetHerHim]."\n\nĐầu Ta... tất cả mờ dần, chậm rãi."
  laamp_base_contract_schemes.6033.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 #################################################
 # Base Diplo Scheme Events

  laamp_base_contract_schemes.0001.t: "Tại yến tại triều đình của [employer.GetTitledFirstNamePossessiveNoTooltip]"
  laamp_base_contract_schemes.0001.desc: "Không hiếm khi các vị quân chủ đã ổn định như [employer.GetFirstName] tiếp đón những du khách đáng chú ý như Ta — đổi lấy vài món quà và chỗ nghỉ ngơi tử tế, [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] như chúng Ta mang lại giải trí, thông tin và sự khuây khỏa thích hợp cho nhiều [employer.GetHerHis] quan lại.\n\nDĩ nhiên, đó là #EMP nếu#! [ROOT.Char.Custom('GetCourtierTypePlural')|l] của Ta và Ta có thể kiếm được phần công sức nhờ những câu chuyện của mình."
  laamp_base_contract_schemes.0001.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.0001.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.0001.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.0001.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.0001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.0002.t: "$laamp_base_contract_schemes.0001.t$: Thành công!"
  laamp_base_contract_schemes.0002.desc: "Quan lại của [employer.GetFirstNamePossessive] gần như đã mê mẩn bữa tiệc của Ta và Ta trong những tháng vừa qua.\n\nNgày này qua ngày khác, đêm này qua đêm khác, chúng Ta đã lấp đầy đầu họ bằng những câu chuyện kỳ thú và dạ dày họ bằng những món ăn thịnh soạn, khiến [employer.GetTitleAsNameNoTooltip] rất hài lòng với màn trình diễn của chúng Ta.\n\nDẫu vậy, tất cả mọi điều tốt đẹp đều phải kết thúc, và tốt nhất là chúng Ta ra đi khi ở đỉnh cao."
  laamp_base_contract_schemes.0002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.0003.t: "$laamp_base_contract_schemes.0001.t$: Thất bại!"
  laamp_base_contract_schemes.0003.desc: "Đám chó dại thiếu hiểu biết này! Chúng mời ta tới đây, chẳng cung phụng gì ngoài #EMP cám lợn#! để ăn, giường nằm làm từ đống rơm rạ đã cũ từ thuở ông bà ta còn trẻ, lại còn xỉa xói, châm chọc mọi câu chuyện dọc đường của ta.\n\nSự hiếu khách phô bày ra đây là... chà, hiếu khách chỗ nào chứ?\n\nCông cốc cả. [employer.GetTitledFirstName] đang giận dữ, và rõ ràng thứ duy nhất ngăn chúng ta khỏi ngục tối chính là cảm giác rằng việc đó còn rắc rối hơn cả lợi ích mang lại.\n\nThời gian của chúng ta tại [employer.GetCapitalLocation.GetTitle.GetNameNoTier] đã kết thúc."
  laamp_base_contract_schemes.0003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

  laamp_base_contract_schemes.0011.t: "Nâng cao danh tiếng của [employer.GetTitleAsNamePossessiveNoTooltip]"
  laamp_base_contract_schemes.0011.desc: "Không có gì bí mật khi danh tiếng của [employer.GetTitledFirstNamePossessive] chưa đạt mức tối đa. Các chư hầu không hài lòng, những lời xầm xì lo lắng về hành vi chuyên quyền, thiếu vắng uy tín vô hình — tất cả là dấu hiệu cho thấy quyền lực của [employer.Custom('LadiesLords')] có thể không chắc chắn như họ mong.\n\nTrả tiền cho ai đó để dọn dẹp những hiểu lầm này sẽ không rẻ, tất nhiên. Ít nhất là nếu Ta có quyền quyết định."
  laamp_base_contract_schemes.0011.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.0011.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.0011.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.0011.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.0011.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.0012.t: "$laamp_base_contract_schemes.0011.t$: Thành công!"
  laamp_base_contract_schemes.0012.desc: "Thật đáng ngạc nhiên khi vài lời nhỏ trong góc yên tĩnh có thể thay đổi tình huống. Một lời thì thầm đây, một bình luận kia, một hành động được bảo vệ trong bữa tối...\n\nTất nhiên, nó sẽ không có ý nghĩa tương tự nếu đến từ một địa chủ quyền lực, quá nhiều quyền lực, quá nhiều rủi ro — nhưng một [ROOT.Char.Custom('GetLaampDescribeTypeSelf')], ghé qua triều đình một thời gian khi [ROOT.Char.GetSheHe] và [ROOT.Char.GetHerHis] đi khắp thế giới, thì khác hẳn.\n\nĐó là một trò chơi hoàn toàn khác.\n\nKhông cần nói, [employer.GetTitledFirstName] rất hài lòng với nỗ lực của chúng Ta, và chúng Ta phải lên đường."
  laamp_base_contract_schemes.0012.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.0013.t: "$laamp_base_contract_schemes.0011.t$: Thất bại!"
  laamp_base_contract_schemes.0013.desc: "Làm sao ta #EMP có thể#! thành công trong việc này cơ chứ? Một [ROOT.Char.Custom('GetLaampDescribeTypeSelf')] nay đây mai đó, không chút uy tín với dân chúng hay tầng lớp quý tộc.\n\nĐây là một nhiệm vụ vô lý, vậy mà [employer.GetTitledFirstName] dường như quyết tâm bắt #EMP ta#! phải chịu trách nhiệm cho thất bại khi đám dân chúng của kẻ đó đổ lỗi cho chính chủ nhân vì những điều xúc phạm tưởng tượng và lạm quyền lý thuyết.\n\n[employer.GetCapitalLocation.GetTitle.GetNameNoTier] không còn là nơi an toàn cho hội của ta."
  laamp_base_contract_schemes.0013.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

  laamp_base_contract_schemes.0021.t: "Kẻ chi kỉ Với Giới Quyền Lực"
  laamp_base_contract_schemes.0021.desc: "[employer.GetTitledFirstName] là một [employer.GetWomanMan] cô độc ở vị trí quyền lực, khiến kẻ đó khó lòng gặp gỡ những người không #EMP muốn#! lợi dụng mình.\n\nHội của ta lẽ ra phải khác biệt, một cơ hội để kết nối thực sự. Tất nhiên là không phải rồi — ta cũng muốn nhiều thứ, thậm chí hơn cả những kẻ bám đuôi khác — nhưng đó là một ảo tưởng đẹp đẽ để tin vào trong chốc lát.\n\nĐám [ROOT.Char.Custom('GetCourtierTypePlural')|l] của ta và ta sẽ biến mất trước khi kẻ đó kịp nghi ngờ điều gì."
  laamp_base_contract_schemes.0021.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.0021.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.0021.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.0021.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.0021.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.0022.t: "$laamp_base_contract_schemes.0021.t$: Thành công!"
  laamp_base_contract_schemes.0022.desc: "Tất nhiên, [employer.GetTitledFirstName] đã bị quyến rũ bởi Ta, bởi bài ca hoang dã và cuộc sống lãng mạn của một [ROOT.Char.Custom('GetLaampDescribeTypeSelf')] du hành, đúng như Ta biết [employer.GetSheHe] sẽ như vậy.\n\nCuối cùng chúng Ta chuẩn bị rời đi, [employer.GetFirstNameNoTooltip] buồn khi thấy chúng Ta đi nhưng vui vì khoảng nghỉ ngắn mà công ty chúng Ta mang lại cho [employer.GetHerHim].\n\nTất nhiên, không phải tất cả đều một chiều. Ta đã kiếm được một khoản thanh toán phong phú bằng quà tặng và vật phẩm cho công ty, nhiều hơn đủ để bù đắp thời gian chúng Ta đã ở lại đây."
  laamp_base_contract_schemes.0022.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.0023.t: "$laamp_base_contract_schemes.0021.t$: Thất bại!"
  laamp_base_contract_schemes.0023.desc: "Có lẽ… có lẽ [employer.GetTitledFirstName] không cô đơn như tưởng? Chắc chắn [employer.GetSheHe] dường như không muốn #EMP công ty của Ta#!, một 'bọn [ROOT.Char.Custom('GetLaampDescribeTypeInsult')] bốc mùi bẩn thỉu với vóc dáng [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('employer'))] của kẻ tội phạm'.\n\nThật là liều lĩnh, mời Ta ở lại rồi lại đối xử với Ta như… như #EMP thế này#!. Thiếu lễ độ, ít nhất là vậy, và không xứng với một [employer.GetWomanMan] có tước hiệu quý tộc.\n\nKhông cần nói, khoản thanh toán của Ta sẽ không được thực hiện, và nhóm của Ta phải rời [employer.GetCapitalLocation.GetTitle.GetNameNoTier] trước hoàng hôn."
  laamp_base_contract_schemes.0023.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

  laamp_base_contract_schemes.0031.t: "Một Nhóm Trung Lập"
  laamp_base_contract_schemes.0031.desc: "Cuộc cãi vã vô tận của những người địa phương nhỏ nhen là một trong số ít trải nghiệm mà cả những người cai trị thế giới lẫn [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] như Ta đều trải qua.\n\nĐủ để làm một [employer.GetWomanMan] phát điên, hoặc ít nhất làm [employer.GetHerHim] bực bội đến mức [employer.GetSheHe] phải nhờ người ngoài giúp đỡ — và chính điều đó là những gì [employer.GetTitledFirstName] đã làm.\n\nNếu [ROOT.Char.Custom('GetCourtierTypePlural')|l] của Ta và Ta có thể làm dịu một số người dân nóng nảy nhất của [employer.GetHerHis], chúng Ta sẽ được trả công hậu hĩnh."
  laamp_base_contract_schemes.0031.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.0031.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.0031.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.0031.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.0031.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.0032.t: "$laamp_base_contract_schemes.0031.t$: Thành công!"
  laamp_base_contract_schemes.0032.desc: "Các vấn đề địa phương chỉ là những vấn đề nhỏ. Không phải với những người liên quan, tất nhiên, nhưng đối với một người ngoài không liên quan đến những cuộc cãi vã vô tận, chúng thường dễ giải quyết.\n\nTa không thể nói rằng Ta đã làm hài lòng #EMP mọi người#!, nhưng đó không phải việc của Ta. Chỉ cần làm họ dịu đi đủ để [employer.GetTitledFirstName] hài lòng, và [employer.GetSheHe] hài lòng — đủ để mở ví tiền của [employer.GetHerHis].\n\nMột công việc hoàn thành tốt."
  laamp_base_contract_schemes.0032.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.0033.t: "$laamp_base_contract_schemes.0031.t$: Thất bại!"
  laamp_base_contract_schemes.0033.desc: "Lũ quỷ ngu dốt này thật không thể chịu nổi!\n\nKhông một [ROOT.Char.GetWomanMan] nào còn sống có thể giải quyết danh sách vô tận các vấn đề, tranh chấp và ranh giới của chúng. Ta là [ROOT.Char.Custom('GetLaampDescribeTypeSelfArticle')] [ROOT.Char.Custom('GetLaampDescribeTypeSelf')], chết tiệt, không phải một quan chức nhỏ nhặt. Tất nhiên, [employer.GetTitledFirstName] không quan tâm nhiều đến tình cảnh của Ta. Theo [employer.GetSheHe] thì đây chỉ là thất bại kỹ năng và không gì khác.\n\n\"Có lẽ nếu Ngài giỏi hơn, Ngài đã được trả tiền. Nhưng Ngài không giỏi, nên Ngài không được trả. Giờ thì đi ra ngoài\"."
  laamp_base_contract_schemes.0033.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

  laamp_base_contract_schemes.0034.t: "$laamp_base_contract_schemes.0031.t$: Xuất Phát"
  laamp_base_contract_schemes.0034.desc: "Với giấy phép của [employer.GetTitledFirstNamePossessive] trong tay, chúng Ta bắt đầu hành trình.\n\nChuyến đi sẽ đưa chúng Ta đến [destination_3.GetNameNoTier], rồi đến [destination_2.GetNameNoTier], trước khi cuối cùng trở về [destination_1.GetNameNoTier].\n\nCâu hỏi còn lại là chúng Ta muốn đi nhẹ nhàng, hay đi đầy đủ."
  laamp_base_contract_schemes.0034.tt.explanation: "#TUT Để hoàn thành [task_contract|E]:\n$EFFECT_LIST_BULLET$Hoàn thành một thử thách [skill|E] tại mỗi điểm đến\n$EFFECT_LIST_BULLET$Ngài phải thắng hai thử thách để đạt $label_success_standard$\n$EFFECT_LIST_BULLET$Nếu thắng cả ba thử thách, Ngài nhận $label_success_critical$\n$EFFECT_LIST_BULLET$@warning_icon! #N Thất bại ở bất kỳ thử thách nào sẽ làm thất bại $game_concept_task_contract$#!\n$EFFECT_LIST_BULLET$@alert_icon! #alert_trial Ngài chỉ được thử mỗi [skill|E] một lần cho mỗi [task_contract|E]#!#!"
  laamp_base_contract_schemes.0034.tt.destination_list: "Ngài ngay lập tức bắt đầu [traveling|E] đến [destination_3.GetNameNoTier], rồi [destination_2.GetNameNoTier], rồi [destination_1.GetNameNoTier]"
  laamp_base_contract_schemes.0034.a: "$travel.stationary_domicile.option.t$"
  laamp_base_contract_schemes.0034.b: "$travel.mobile_domicile.option.t$"

  laamp_base_contract_schemes.0041.t: "Tin Ta"
  laamp_base_contract_schemes.0041.desc: "Đáng thương, ngây thơ [employer.GetFirstName]: [employer.GetSheHe] có thể là [employer.GetTitleAsNameNoTooltip], nhưng [employer.GetSheHe] không thông minh hơn tay say rượu bình thường ở quán nhỏ. Chỉ giàu hơn thôi.\n\nLời mời mở cho những khách du lịch nổi tiếng ở lại trong nhà [employer.GetHerHis] một thời gian là tất cả cơ hội mà [ROOT.Char.Custom('GetCourtierTypePlural')|l] của Ta và Ta cần, và trước khi [employer.GetSheHe] nhận ra, tài sản quý giá của [employer.GetTitleAsNamePossessiveNoTooltip] sẽ vào túi Ta, và chúng Ta sẽ đi."
  laamp_base_contract_schemes.0041.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.0041.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.0041.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.0041.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.0041.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.0042.t: "$laamp_base_contract_schemes.0041.t$: Thành công!"
  laamp_base_contract_schemes.0042.desc: "Những món quà tuyệt vời mà [employer.GetTitledFirstName] tặng, khi [employer.GetSheHe] có tâm trạng! Một khoản lợi đáng giá cho thời gian của Ta, mặc dù tiếc là #EMP có lẽ#! không phải đối với [employer.GetHerHis].\n\nÀ thì, không thể tránh được. Một kẻ ngốc và tiền bạc của [employer.GetHerHis] và tất cả.\n\nTất nhiên, [employer.GetSheHe] sẽ sớm nhận ra, hoặc cuối cùng ai đó sẽ giải thích những gì đã xảy ra cho [employer.GetTitleAsNameNoTooltip|l], nhưng không quan trọng. Chúng Ta đã lấy được phần của mình và sẽ đi trước bình minh."
  laamp_base_contract_schemes.0042.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.0043.t: "$laamp_base_contract_schemes.0041.t$: Thất bại!"
  laamp_base_contract_schemes.0043.desc: "[employer.GetTitledFirstName] không hề chậm chạp như vẻ bề ngoài! Ta chẳng biết thứ gì đã làm lộ tẩy cuộc chơi — một cái liếc mắt sai chỗ, một cụm từ nghi vấn, một nụ cười nhếch mép sai thời điểm — nhưng kẻ đó đã bắt bài ta.\n\nSẽ không có đồng xu nào từ người này, cũng chẳng còn chỗ trọ nào nữa.\n\nKhông giống [employer.GetFirstNameNoTooltip], ta không phải kẻ khờ, ta biết khi nào gió đã đổi chiều chống lại mình; đám [ROOT.Char.Custom('GetCourtierTypePlural')|l] và ta sẽ rời bỏ [employer.GetCapitalLocation.GetTitle.GetNameNoTier] trong vòng một canh giờ."
  laamp_base_contract_schemes.0043.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 #################################################
 # Base Martial Scheme Events

  laamp_base_contract_schemes.1001.t: "Săn Tội Phạm"
  laamp_base_contract_schemes.1001.desc: ""Bọn..." [employer.GetTitledFirstName] nhăn mũi đầy khinh bỉ, "đám #EMP phường bất mãn#! này đã quấy nhiễu các điền trang riêng của ta. Chúng đốt phá, giết chóc và trộm cướp mà gần như không hề hấn gì, chuồn mất trước khi đám gia nhân của ta kịp tống chúng vào gông xiềng mà chúng #EMP hoàn toàn xứng đáng#!."\n\nTa gật đầu. Băng đảng này chắc phải tinh ranh lắm mới đáng treo thưởng hậu hĩnh như vậy.\n\n"Hãy mang bọn cặn bã đó đến đây trước khi thêm một tài sản nào của ta hóa thành tro bụi, và ngươi sẽ nhận được thù lao.""
  laamp_base_contract_schemes.1001.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.1001.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.1001.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.1001.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.1001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.1002.t: "$laamp_base_contract_schemes.1001.t$: Thành công!"
  laamp_base_contract_schemes.1002.desc: ""Tốt, #EMP tốt lắm#!," [employer.GetFirstName] cười khì, tay thong dong xoay lưỡi dao. "Một công việc xuất sắc, [ROOT.Char.GetFirstNameNoTooltip], ngươi và băng của ngươi xứng đáng từng đồng trong túi đó."\n\nNhững hình hài bầm dập của đám cướp bị bắt giữ đang ngồi trong lồng sắt phía sau [employer.GetTitleAsNameNoTooltip] có chút điên loạn. Chắc hẳn việc đốt phá tài sản và cướp đoạt sự giàu có của kẻ đó khi chúng còn tự do, giễu cợt một nhân vật quyền thế như vậy thật phấn khích biết bao, nhưng mọi cuộc vui đều phải có hồi kết.\n\nTa rời đi, tiền đã cầm chắc trong tay. Những tên cướp bất hạnh đó sắp phải trả giá cho những tội lỗi của mình."
  laamp_base_contract_schemes.1002.a: "Nghe có vẻ [employer.GetTitleAsNameNoTooltip] nhận được giá trị đồng tiền của [employer.GetHerHis]."

  laamp_base_contract_schemes.1003.t: "$laamp_base_contract_schemes.1001.t$: Thất bại!"
  laamp_base_contract_schemes.1003.desc: ""#EMP Ngươi cũng thất bại sao?!#!" [employer.GetFirstName] thét lên, giận điên người. "Không ai có thể giúp ta tống khứ đám cướp gớm ghiếc này sao? Lẽ nào ta phải tự mình ra tay, một [employer.GetTitleAsNameNoTooltip] phải vấy bẩn [employer.GetHerHis] [employer.Custom('HandHands')] bằng máu của đám lâu la bất hảo?"\n\nTa mím chặt môi hết mức có thể, nhận thức sâu sắc rằng việc đáp trả bằng lời lẽ có thể chẳng mang lại lợi lộc gì, nhưng ít nhất không kết thúc bằng việc ta bị tống vào ngục tối. Có lẽ là vậy.\n\n"Sao? Ngươi còn chờ gì nữa? Cút khỏi tầm mắt ta, tên [ROOT.Char.Custom('GetLaampDescribeTypeInsult')]! Ta sẽ tìm #EMP kẻ khác#! để xử lý vấn đề của mình, một kẻ #EMP có năng lực#!.""
  laamp_base_contract_schemes.1003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

  laamp_base_contract_schemes.1004.t: "Mang Đầu [recidivist.GetHerHis|U] Cho Ta"
  laamp_base_contract_schemes.1004.desc: ""Bọn..." [employer.GetTitledFirstName] nhăn mũi đầy khinh bỉ, "đám #EMP phường bất mãn#! này đã quấy nhiễu các điền trang riêng của ta. Chúng đốt phá, giết chóc và trộm cướp mà gần như không hề hấn gì, chuồn mất trước khi đám gia nhân của ta kịp tống chúng vào gông xiềng mà chúng #EMP hoàn toàn xứng đáng#!."\n\nTa gật đầu. Băng đảng này chắc phải tinh ranh lắm mới đáng treo thưởng hậu hĩnh như vậy.\n\n"Thủ lĩnh của chúng là một kẻ tên [recidivist.GetFirstNameNicknamed] — hãy mang thủ cấp của kẻ đó đến cho ta trước khi hắn cao chạy xa bay, và ngươi sẽ nhận được thù lao.""
  laamp_base_contract_schemes.1004.tt.destination_list: "Ngài ngay lập tức bắt đầu di chuyển đến [destination_1.GetBaseNameNoTier], rồi [destination_2.GetBaseNameNoTier], rồi [destination_3.GetBaseNameNoTier]"
  laamp_base_contract_schemes.1004.tt.explanation: "#TUT Để hoàn thành [task_contract|E]:\n$EFFECT_LIST_BULLET$Tích lũy #P 2#! điểm chiến thắng chống lại [recidivist.GetFirstName]\n$EFFECT_LIST_BULLET$Điểm chiến thắng có thể đạt 1-2 mỗi lần bằng cách —\n$TAB$$EFFECT_LIST_BULLET$Một [single_combat_duel|E]\n$TAB$$EFFECT_LIST_BULLET$Một thử thách [prowess|E] (nếu Ngài không thể đấu tay đôi)\n$TAB$$EFFECT_LIST_BULLET$Một thử thách [martial|E]\n$TAB$$EFFECT_LIST_BULLET$Rủi ro với [men_at_arms|E] của Ngài (phải có ít nhất [EmptyScope.ScriptValue('laamp_base_contract_schemes_1301_min_troops_value')|0] và không được huy động thêm nếu không đủ điều kiện cho lựa chọn)\n$EFFECT_LIST_BULLET$Ngài nhận #P 3 cơ hội#! để giết mục tiêu, nếu không họ sẽ trốn thoát và Ngài nhận $label_failure_standard$#!"
  laamp_base_contract_schemes.1004.a: "$travel.stationary_domicile.option.t$"
  laamp_base_contract_schemes.1004.b: "$travel.mobile_domicile.option.t$"

  laamp_base_contract_schemes.1011.t: "Thuê Đấu Sĩ"
  laamp_base_contract_schemes.1011.desc: "\"Nhu cầu của Ta đơn giản thôi,\" [employer.GetFirstName] giải thích, \"Có vài kẻ gai trong vườn hoa của [employer.GetCapitalLocation.GetTitle.GetNameNoTier], và Ta muốn Ngài loại bỏ những kẻ... khó chịu này. Ta không thể trực tiếp dính líu, nên Ngài sẽ giải quyết chúng thay Ta.\"\n\nTa đưa ngón tay cái chạm ngang cổ một cách dò hỏi.\n\n\"Không, không,\" người thuê Ta làm rõ. \"Không được gây đổ máu nghiêm trọng, chỉ cần giữ chúng im lặng mà không giết, cho đến khi chúng hiểu thế nào là không tôn trọng [employer.GetTitleAsNameNoTooltip].\"\n\nNghe có vẻ đơn giản."
  laamp_base_contract_schemes.1011.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.1011.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.1011.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.1011.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.1011.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.1012.t: "$laamp_base_contract_schemes.1011.t$: Thành công!"
  laamp_base_contract_schemes.1012.desc: "\"Công việc tuyệt vời, [ROOT.Char.GetFirstNameNoTooltip]! Vườn của [employer.GetCapitalLocation.GetTitle.GetNameNoTier] thật yên tĩnh, và Ta có thể an tâm hơn vào ban đêm.\"\n\n[employer.GetSheHe|U] ném cho Ta một túi bạc.\n\n\"Lần tới khi Ngài đi qua đây, xin hãy ở lại! Ta chắc chắn sẽ tìm chỗ ở phù hợp — chưa kể công việc #EMP thích hợp#! — cho một [ROOT.Char.Custom2('GetYoungOld',employer)] [ROOT.Char.Custom('GetLaampDescribeTypeSelf')].\""
  laamp_base_contract_schemes.1012.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.1013.t: "$laamp_base_contract_schemes.1011.t$: Thất bại!"
  laamp_base_contract_schemes.1013.desc: ""Ngươi chỉ có một nhiệm vụ duy nhất, [ROOT.Char.GetFirstNameNoTooltip]", [employer.GetFirstNameNoTooltip] thở dài. "Làm câm miệng mấy gã lắm lời, giữ cho chúng im lặng vài tháng, rồi quay lại nhận bạc."\n\nĐám [ROOT.Char.Custom('MaskFace')] của ta vẫn giữ thái độ bình thản. Có thể thật khó chịu, nhưng tốt nhất cứ để [employer.GetTitleAsNameNoTooltip] trút bỏ sự thất vọng bằng lời nói kẻo kẻ đó dùng tới vũ lực.\n\n"Có lẽ ta thật khờ khạo khi mong đợi điều tốt đẹp hơn từ một [ROOT.Char.Custom('GetLaampDescribeTypeInsult')] như ngươi. Chắc không thể làm khác được rồi."\n\nCó một quãng nghỉ... khi ta chờ xem liệu vị [employer.GetWomanMan] này có còn điều gì để nói.\n\n"Ngươi có thể đi. #EMP Ngay bây giờ#!, nếu ngươi muốn.""
  laamp_base_contract_schemes.1013.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

  laamp_base_contract_schemes.1021.t: "Huấn Luyện [ROOT.Char.Custom('MistressMaster')]"
  laamp_base_contract_schemes.1021.desc: "Quân đội cá nhân của [employer.GetFirstNamePossessive] vốn đã đáng sợ, nhưng hiếm có [employer.GetTitleAsNameNoTooltip] nào hài lòng với chỉ #EMP đáng sợ#! thôi. Xương sống của [employer.GetPrimaryTitle.GetDefinitiveName] là binh lính, như hầu hết các vương quốc.\n\nKiểm tra trang bị và phỏng vấn những chiến binh xuất sắc nhất giúp Ta nhận thấy rằng vẫn còn nhiều việc phải làm."
  laamp_base_contract_schemes.1021.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.1021.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.1021.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.1021.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.1021.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.1022.t: "$laamp_base_contract_schemes.1021.t$: Thành công!"
  laamp_base_contract_schemes.1022.desc: "Nhìn hàng ngũ đều đặn của quân đội [employer.GetTitledFirstNamePossessive] mang lại cho Ta sự hài lòng cá nhân. Họ vốn đã là chiến binh trước khi Ta đến, nhưng với huấn luyện của Ta, họ chắc chắn đã trở thành anh hùng.\n\nChắc chắn người thuê Ta cũng hài lòng, khi [employer.GetSheHe] vỗ vai Ta với một tiếng cười hồn hậu.\n\n\"Công việc tuyệt vời, [ROOT.Char.Custom('GetLaampDescribeTypeSelf')] cao quý! Ngài đã biến sắt thô thành thép. Thanh toán của Ngài đang chờ tại cổng.\""
  laamp_base_contract_schemes.1022.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.1023.t: "$laamp_base_contract_schemes.1021.t$: Thất bại!"
  laamp_base_contract_schemes.1023.desc: "Ta khó lòng bị đổ lỗi cho... cho đám #EMP phường phản loạn#! và sự hỗn loạn của chúng!\n\nChúng là quân lính của [employer.GetTitledFirstNamePossessive], nhưng ngay khi chủ tướng của chúng khuất tầm mắt, mọi kỷ cương đều sụp đổ và chúng thoái hóa thành một đám đông nhốn nháo, cướp bóc như châu chấu, ăn sạch mọi miếng ăn và uống cạn mọi giọt rượu trong tầm tay.\n\nTất nhiên, các chỉ huy của chúng đổ hết lỗi lên đầu ta. Những phương pháp kỳ lạ của ta, những cách làm chiến tranh ngoại lai của ta, đã làm rối trí đám binh lính đơn giản của chúng.\n\nTa đã cố hết sức minh oan cho mình, nhưng [employer.GetFirstNameNoTooltip] không muốn lắng nghe. Sẽ chẳng có tiền lương nào cho việc này cả."
  laamp_base_contract_schemes.1023.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

  laamp_base_contract_schemes.1031.t: "Trực Lĩnh"
  laamp_base_contract_schemes.1031.desc: "Công việc… không phải kích thích nhất, bổ sung vài thanh gươm cho các tài sản của [employer.GetTitledFirstNamePossessive], nhưng ít nhất ổn định.\n\nHơn nữa, khi liên quan đến vũ khí, công việc #EMP kích thích#! không phải lúc nào cũng tốt. Trên chiến trường, lính đánh thuê dễ bị hy sinh đầu tiên, nhưng sau tường thành? Khó có thể hy sinh những chiến binh cứng cáp.\n\n\"…không mong gặp sự cố nghiêm trọng, nhưng Ngài ở đây phòng ngừa. Rõ chứ?\" kết thúc [employer.GetTitleAsNameNoTooltip]. Ta gật, trở lại cuộc trò chuyện."
  laamp_base_contract_schemes.1031.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.1031.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.1031.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.1031.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.1031.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.1032.t: "$laamp_base_contract_schemes.1031.t$: Thành công!"
  laamp_base_contract_schemes.1032.desc: "\"Công việc xuất sắc, [ROOT.Char.GetFirstNameNoTooltip]!\" [employer.GetFirstName] khen. \"Điệp viên của Ta báo cáo rằng phòng thủ của Ngài đã ngăn chặn những kẻ xâm nhập Ta lo ngại.\"\n\n[employer.GetTitleAsNameNoTooltip] vỗ vai Ta.\n\n\"Chúng chắc không dám đối đầu với chiến binh cường tráng như Ngài. Dịch vụ của Ngài được đánh giá cao, và thanh toán đang trên đường.\"\n\nTa gật đầu biết ơn, vui vì nghỉ ngơi dài, nhưng cũng mừng đã xong."
  laamp_base_contract_schemes.1032.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.1033.t: "$laamp_base_contract_schemes.1031.t$: Thất bại!"
  laamp_base_contract_schemes.1033.desc: ""Ngươi chỉ có nhiệm vụ bảo vệ nơi này thôi, đồ [ROOT.Char.Custom('GetLaampDescribeTypeInsult')] ngu ngốc! Hãy nhìn đi, khói bốc lên từ mọi ô cửa sổ chết tiệt, ngươi có #EMP thấy#! nơi này được bảo vệ không?" [employer.GetTitledFirstName] tru tréo.\n\nTa... ta không biết điều gì đã xảy ra. Chúng ta đã ở đây, đã làm nhiệm vụ, đã cảnh giác... chẳng phải sao? Liệu những kẻ xâm nhập đã lẻn qua tường hay qua cổng? Ngay cả thế, để gây ra những đám cháy đó, thật đáng xấu hổ.\n\nVị [employer.GetTitleAsNameNoTooltip] đang giận dữ dường như không quan tâm đến bất kỳ lời bào chữa hay phân bua nào của ta. Chúng ta bị tống cổ khỏi sân trong một cách không thương tiếc, mọi hy vọng về tiền công đã sớm lụi tàn từ lâu."
  laamp_base_contract_schemes.1033.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

  laamp_base_contract_schemes.1041.t: "Rình Rập Du Khách"
  laamp_base_contract_schemes.1041.desc: "[employer.GetFirstName|U] chắc chắn là một [employer.GetTitleAsNameNoTooltip] cực kỳ cẩu thả. Nghĩ mà xem gửi thông báo cầu cứu như vậy sao?\n\nMất của [employer.GetHerHis|U], lợi cho chúng Ta. Băng nhóm Ta đã bắt đầu khảo sát các con đường phụ đông đúc nhất để mai phục. Chúng Ta sẽ cướp sạch thương nhân và quay về nhanh như lúc đến.\n\nTa gần như ngửi thấy mùi tiền rồi."
  laamp_base_contract_schemes.1041.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.1041.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.1041.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.1041.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.1041.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.1042.t: "$laamp_base_contract_schemes.1041.t$: Thành Công!"
  laamp_base_contract_schemes.1042.desc: "Đúng như kế hoạch — [employer.GetTitledFirstName] không thể bảo vệ đám thương nhân hay của cải của họ.\n\nMỗi đồng xu chúng ta cướp được khiến băng đảng thêm bạo gan, và đám lữ hành của kẻ đó càng thêm thấp thỏm. Chúng ta đã ăn no nê vàng bạc của vùng đất này đến mức có thể thấy chúng đang chủ động đi chậm lại, tìm cách đổi lộ trình hoặc chuyển hướng buôn bán hoàn toàn sang nơi khác.\n\nĐáng buồn thay, điều này báo hiệu sự kết thúc cho hoạt động của chúng ta tại đây. Quan trọng là phải rút lui khi còn đang thuận lợi, và vị [employer.GetTitleAsName] vẫn đang chật vật truy bắt chúng ta."
  laamp_base_contract_schemes.1042.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.1043.t: "$laamp_base_contract_schemes.1041.t$: Thất Bại!"
  laamp_base_contract_schemes.1043.desc: "[employer.GetTitledFirstName] dường như có một sự kiểm soát #EMP chặt chẽ#! đối với các con đường ở những vùng đất này hơn chúng ta tưởng.\n\nTa và băng của mình đã thử hết cuộc phục kích này đến cuộc phục kích khác, mai phục hết lần này đến lần khác, nhưng các đoàn xe lữ hành hoặc là không hề xuất hiện, hoặc là được bảo vệ quá cẩn mật đến mức không đáng để ra tay.\n\nNhững trận đánh hiếm hoi mà chúng ta #EMP chọn#! ra tay đều đẫm máu và hoàn toàn không mang lại lợi nhuận.\n\nChúng ta rời khỏi vùng đất quái gở này càng sớm càng tốt — điều mà [employer.GetFirstNameNoTooltip] dường như hoàn toàn đồng tình."
  laamp_base_contract_schemes.1043.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

  laamp_base_contract_schemes.1044.t: "$laamp_base_contract_schemes.1041.t$"
  laamp_base_contract_schemes.1044.desc: "[employer.GetFirstName|U] chắc chắn là một [employer.GetTitleAsNameNoTooltip] cực kỳ cẩu thả. Nghĩ mà xem gửi thông báo cầu cứu như vậy mà không #EMP nghĩ#! sẽ thu hút rắc rối sao?\n\nMất của [employer.GetHerHis|U], lợi cho chúng Ta. Băng nhóm Ta đã khảo sát các con đường phụ đông đúc nhất để mai phục — tuyến đường tự nhiên nhất để quấy rối có vẻ là đường [destination_1.GetBaseNameNoTier]-[destination_2.GetBaseNameNoTier].\n\nChúng Ta sẽ cướp sạch thương nhân và du khách, rồi trốn vào bóng đêm nhanh như lúc đến.\n\nTa gần như ngửi thấy mùi tiền rồi."
  laamp_base_contract_schemes.1044.a: "$travel.stationary_domicile.option.t$"
  laamp_base_contract_schemes.1044.b: "$travel.mobile_domicile.option.t$"
  laamp_base_contract_schemes.1044.tt.destination_list: "Ngài lập tức bắt đầu di chuyển tới [destination_1.GetBaseNameNoTier], sau đó tiếp tục tới [destination_2.GetBaseNameNoTier]"
  laamp_base_contract_schemes.1044.tt.explanation: "#TUT Để hoàn thành [task_contract|E]:\n$EFFECT_LIST_BULLET$Di chuyển tới điểm đến cuối cùng\n$EFFECT_LIST_BULLET$Trên đường đi, hoàn thành các thử thách [prowess|E], [martial|E], hoặc [intrigue|E] [skill|E] với các du khách khác\n$EFFECT_LIST_BULLET$Kiếm bất kỳ lượng [gold|E] nào cho một $label_success_standard$#!"
  laamp_base_contract_schemes.1044.tt.number_of_encounters: "#TUT Ngài sẽ có [task_contract.MakeScope.Var('encounters_max').GetValue|0] nạn nhân tiềm năng#!"
  laamp_base_contract_schemes.1044.tt.path_warning: "#TUT Dù kéo dài đường đi sẽ không tăng số nạn nhân tiềm năng, rút ngắn có thể giảm số lượng nhận được#!"

#################################################
 # Base Stewardship Scheme Events
  laamp_base_contract_schemes.2001.t: "Thuế, Cống & Trạm Thu"
  laamp_base_contract_schemes.2001.desc: "\"... và tất nhiên, thuế đất thêm. Có rõ chưa?\" lẩm bẩm [employer.GetTitledFirstName]. Danh sách dài các khoản phí, nghĩa vụ, và các loại thuế khác, nhưng việc thu dường như đơn giản.\n\n\"Tốt, #EMP tốt#!! Bây giờ, Ta liều tin Ngài thay vì những nhân viên thu thuế thường lệ, nhưng hy vọng Ngài có thể cho bọn hư hỏng thấy cách làm và gieo nỗi sợ của [employer.GetFaith.WealthGodName] vào thần dân. Hãy làm việc trung thực, nhanh chóng và tốt, Ngài sẽ được đền bù xứng đáng.\"\n\nTrong giây lát có vẻ như còn hướng dẫn thêm, nhưng [employer.GetFirstNameNoTooltip] vẫy tay ra hiệu cho Ta ra khỏi phòng."
  laamp_base_contract_schemes.2001.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.2001.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.2001.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.2001.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.2001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.2002.t: "$laamp_base_contract_schemes.2001.t$: Thành Công!"
  laamp_base_contract_schemes.2002.desc: "\"Tuyệt vời, [ROOT.Char.GetFirstNameNoTooltip]!\" hò hét [employer.GetFirstName], huýt sáo nhẹ với [employer.GetHerselfHimself] khi băng nhóm Ta mang từng bao thuế quá hạn.\n\n\"Tiền và hàng hóa tuyệt vời, tất nhiên, nhưng hy vọng điều này dạy những người thu thuế của Ta biết #EMP trân trọng#! công việc trong tương lai.\"\n\nTa gật đầu, hài lòng khi biết sự biết ơn của [employer.GetTitleAsNamePossessiveNoTooltip] sẽ đảm bảo thanh toán nhanh chóng. Ta rất vui nhận túi tiền lớn vừa được trao."
  laamp_base_contract_schemes.2002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.2003.t: "$laamp_base_contract_schemes.2001.t$: Thất Bại!"
  laamp_base_contract_schemes.2003.desc: "\"Đồ ngốc! Đây còn chưa bằng một nửa số Ngài #EMP phải#! thu!\" gầm gừ [employer.GetTitledFirstName].\n\n\"Nếu Ta không lục soát trại tạm bợ của Ngài từ trên xuống dưới, Ta sẽ nghĩ Ngài ăn cắp, nhưng rõ ràng đây chỉ là bất tài,\" [employer.GetSheHe] vừa thở vừa nói, \"bây giờ [employer.Custom('Saying_1p_SightAway')] trước khi Ta lãng phí số tiền Ngài thực sự thu được trên bộ giá treo cổ tồi tệ nhất của [employer.GetPrimaryTitle.GetDefinitiveNamePossessiveNoTooltip|l]!\"\n\nCơn thịnh nộ làm Ta nổi da gà, hàm răng kêu lách cách khi Ta kìm nén cơn giận.\n\nBây giờ không phải lúc để chiến đấu, khi Ta vẫn có thể rời đi còn nguyên mạng."
  laamp_base_contract_schemes.2003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

  laamp_base_contract_schemes.2004.t: "Giao Cho [employer.GetFirstNameNoTooltip]"
  laamp_base_contract_schemes.2004.desc: "Đại diện của [employer.GetTitledFirstNamePossessive] rất nhanh chóng và đi thẳng vào vấn đề: thành phố [destination_1.GetBaseNameNoTier] dường như đã không nộp thêm khoản thuế bổ sung do vị [employer.GetTitleAsNameNoTooltip] nhân hậu áp đặt.\n\nCư dân đã chống lại các yêu cầu tiếp theo nhưng vẫn chưa #EMP hoàn toàn#! tiến tới cuộc nổi dậy công khai. [employer.GetFirstNameNoTooltip] muốn có khoản thu của mình, nhưng thận trọng trước cái giá có thể phải trả cho một cuộc nổi loạn thực sự.\n\nMột bên thứ ba trung lập là hư cấu tiện lợi để ép buộc thủ lĩnh của khu định cư ương ngạnh, một kẻ tên [person_a.GetTitledFirstName], phải khuất phục.\n\nTất cả những gì còn lại chỉ là chuyến hành trình đến [destination_1.GetBaseNameNoTierNoTooltip]."
  laamp_base_contract_schemes.2004.a: "$travel.stationary_domicile.option.t$"
  laamp_base_contract_schemes.2004.b: "$travel.mobile_domicile.option.t$"
  laamp_base_contract_schemes.2004.tt.destination_list: "Ngài lập tức bắt đầu di chuyển tới [destination_1.GetBaseNameNoTier]"
  laamp_base_contract_schemes.2004.tt.explanation: "#TUT Để hoàn thành [task_contract|E]:\n$EFFECT_LIST_BULLET$Hoàn thành 4 thử thách để tìm bằng chứng:\n$TAB$$EFFECT_LIST_BULLET$2 bằng chứng đảm bảo $label_success_standard$\n$TAB$$EFFECT_LIST_BULLET$4 bằng chứng mang lại $label_success_critical$\n$TAB$$EFFECT_LIST_BULLET$1 bằng chứng có thể dẫn đến $label_success_standard$, $label_success_qualified$, hoặc $label_failure_standard$\n$EFFECT_LIST_BULLET$Các thử thách có thể:\n$TAB$$EFFECT_LIST_BULLET$Kiểm tra [stewardship|E]\n$TAB$$EFFECT_LIST_BULLET$Kiểm tra [GetCourtPositionType('quartermaster_camp_officer').GetName()] [officer|E]'s [aptitude|E]\n$TAB$$EFFECT_LIST_BULLET$Kiểm tra một trong các kỹ năng [diplomacy|E], [intrigue|E], & [learning|E]#!"

  laamp_base_contract_schemes.2011.t: "Ghi Chép Dân Số"
  laamp_base_contract_schemes.2011.desc: "Có lẽ hơi kỳ cục khi thuê [ROOT.Char.Custom('GetLaampDescribeTypeSelfArticle')] [ROOT.Char.Custom('GetLaampDescribeTypeSelf')] cùng băng nhóm [ROOT.Char.GetHerHis] để tiến hành điều tra dân số, nhưng đôi khi cần thiết khi bị [ROOT.Char.GetFaith.random_EvilGodNames] thôi thúc, và Ta cũng chẳng thể than phiền về việc nhận công việc này.\n\nTiền nhận được tiêu xài ổn, và bất kỳ lý do nào [employer.GetTitledFirstName] không tin tưởng các thư ký của [employer.GetHerHis] rõ ràng không áp dụng cho chúng Ta, vậy nên đây sẽ là một công việc đơn giản và dễ dàng.\n\nPhải không?"
  laamp_base_contract_schemes.2011.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.2011.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.2011.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.2011.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.2011.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.2012.t: "$laamp_base_contract_schemes.2011.t$: Thành Công!"
  laamp_base_contract_schemes.2012.desc: "Tiến hành điều tra dân số không thiếu phần thú vị: có nông dân cố giấu gia súc và lương thực, thương nhân che giấu lợi nhuận, thậm chí là quý tộc nhỏ whose đất đai có vẻ nhỏ và nghèo đi khi Ngài lại gần ghi chép.\n\nMay mắn thay, chúng Ta không tìm thấy gì mà con dấu của [employer.GetTitledFirstNamePossessive] hay trí thông minh của chúng Ta không xử lý dễ dàng.\n\nKết quả có thể chưa đầy đủ, nhưng sẽ hữu dụng trong nhiều năm tới, và đó là tất cả những gì hợp đồng yêu cầu.\n\nĐã đến lúc nhận tiền."
  laamp_base_contract_schemes.2012.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.2013.t: "$laamp_base_contract_schemes.2011.t$: Thất Bại!"
  laamp_base_contract_schemes.2013.desc: "Tất nhiên đó không phải là một công việc đơn giản.\n\nNếu là vậy, [employer.GetTitledFirstName] đã để đám quan lại thường lệ của mình xử lý rồi: thay vào đó, ta và băng của mình vừa tiêu tốn khoảng thời gian quý báu của mình trên cõi đời này — chỉ có thần linh biết bao nhiêu — để đối phó với đám dân đen ngu đần, ương ngạnh, #EMP vô phương cứu chữa#! nhất mà sự thông tuệ vô biên của [ROOT.Char.GetFaith.CreatorName] từng tạo ra.\n\nVùng đất này và con người nơi đây chắc chắn là kết quả của sự cận huyết tột cùng, vì không gì khác ngoài điều đó mới tạo ra những kẻ đần độn như vậy.\n\nĐáng buồn thay, cuộc điều tra dân số kết quả thậm chí chẳng hề đáng tin, và tiền công của chúng ta sẽ không bao giờ được thanh toán."
  laamp_base_contract_schemes.2013.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

  laamp_base_contract_schemes.2021.t: "Kiến Trúc Gia Cư"
  laamp_base_contract_schemes.2021.desc: "Kế hoạch xây dựng của [employer.GetTitledFirstNamePossessive]... có vẻ thiếu suy nghĩ. Ít nhất, băng nhóm Ta thấy như vậy; không ngạc nhiên khi những người thiết kế của [employer.GetHerHis] gặp vấn đề.\n\nDù sao, điều đó cũng không phải là vấn đề với chúng Ta. Chúng Ta biết [employer.GetSheHe] muốn xây gì, chỉ cần tìm cách thực hiện #EMP đúng cách#!, và chúng Ta là những bán chuyên gia có kỹ năng.\n\nÍt nhất là theo kiểu đó."
  laamp_base_contract_schemes.2021.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.2021.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.2021.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.2021.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.2021.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.2022.t: "$laamp_base_contract_schemes.2021.t$: Thành Công!"
  laamp_base_contract_schemes.2022.desc: "Như mọi khi, ta và băng của mình là những bậc thầy về hiệu quả. Việc xây dựng diễn ra nhanh chóng, kết quả vững chãi và đáng nhớ, và mặc dù [employer.GetTitledFirstName] sẽ cần tiếp tục công việc tốt đẹp của chúng ta, chúng ta đã cung cấp cho kẻ đó mọi thứ cần thiết để làm điều đó.\n\nNặng trĩu với số tiền thù lao xứng đáng, chúng ta chuẩn bị rời đi."
  laamp_base_contract_schemes.2022.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.2023.t: "$laamp_base_contract_schemes.2021.t$: Thất Bại!"
  laamp_base_contract_schemes.2023.desc: "Có một số tòa nhà trang bị tinh xảo ở [employer.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTier].\n\nChỉ là không phải của chúng Ta.\n\nVới độ nghiêng, vật liệu kém, các thanh gỗ lòi ra — chưa kể hai vụ hỏa hoạn trong quá trình xây dựng — chúng Ta may mắn không bị truy cứu hình sự.\n\nDù vậy, tình hình có thể thay đổi cùng với những ý thích của [employer.GetTitledFirstNamePossessive] bất cứ lúc nào, nên tốt hơn hết chúng Ta nên rời đi."
  laamp_base_contract_schemes.2023.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

  laamp_base_contract_schemes.2031.t: "Trọng Tài"
  laamp_base_contract_schemes.2031.desc: "Bế tắc chính trị là hiện tượng thú vị: hai hoặc ba phe quyền lực địa phương trong [employer.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTier] tranh cãi lẫn nhau, nhưng không thể hoặc không muốn tiến hành theo ý riêng.\n\nTranh chấp về ranh giới nội bộ cần một người không thiên vị để nghe sự thật và khảo sát vùng đất. Nếu câu trả lời của chúng Ta đủ thuyết phục, chúng Ta sẽ được trả thù lao hậu hĩnh."
  laamp_base_contract_schemes.2031.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.2031.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.2031.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.2031.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.2031.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.2032.t: "$laamp_base_contract_schemes.2031.t$: Thành Công!"
  laamp_base_contract_schemes.2032.desc: "Chúng ta thực sự đã giải quyết xong tranh chấp ranh giới ở [employer.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTier] chứ?\n\nCó lẽ không hoàn toàn, nhưng phán quyết chúng Ta đưa ra #EMP đã#! khiến họ bớt phàn nàn ở mức chấp nhận được. Từ góc nhìn của [employer.GetTitledFirstNamePossessive], đó là tất cả những gì họ thuê chúng Ta làm, và công việc của chúng Ta đã hoàn thành đúng.\n\nTiền công được thanh toán nhanh chóng."
  laamp_base_contract_schemes.2032.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.2033.t: "$laamp_base_contract_schemes.2031.t$: Thất Bại!"
  laamp_base_contract_schemes.2033.desc: "La hét, gào thét, cáo buộc hối lộ và âm mưu... cố gắng kết thúc tranh chấp ranh giới ở [employer.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTier] một cách hòa bình là một #EMP trải nghiệm#!.\n\nChẳng cần nói, chúng Ta sẽ không được trả công cho vụ này, nhưng ít ra cũng không bị phạt.\n\nÍt nhất nếu chúng Ta rời đi nhanh chóng."
  laamp_base_contract_schemes.2033.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

  laamp_base_contract_schemes.2041.t: "Thuế Đặc Biệt"
  laamp_base_contract_schemes.2041.desc: "Ta chắc rằng dân chúng ở vùng đất của [employer.GetTitledFirstNamePossessive] đã quen với việc [employer.GetHerHim] thu thuế và cống nạp mà không báo trước, vậy một khoản phí nhỏ nữa — với thông báo trước từ [employer.GetTitleAsNameNoTooltip] — cũng chẳng làm ai giật mình.\n\nChúng Ta chuẩn bị con dấu giả và luyện lại câu chuyện của mình, sẵn sàng tiến đến cộng đồng đầu tiên với chiếc két mở rộng.\n\nĐiều này sẽ mang lại một #EMP lợi nhuận gọn gàng#!"
  laamp_base_contract_schemes.2041.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.2041.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.2041.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.2041.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.2041.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.2042.t: "$laamp_base_contract_schemes.2041.t$: Thành Công!"
  laamp_base_contract_schemes.2042.desc: "Thật đáng ngạc nhiên khi tách người ra khỏi tài sản của họ dễ đến thế khi họ nghĩ rằng Ngài có quyền làm điều đó, và lại còn có sự hậu thuẫn của [employer.GetTitleAsNameNoTooltip]. Một số nghi ngờ ban đầu, nhưng thái độ nghiêm túc và những lời đe dọa mơ hồ về cấp trên cũng dần khuất phục mọi người.\n\nTin tức về trò chơi của chúng Ta chắc chắn sẽ lan ra — quan trọng là chúng Ta không bị phát hiện trong khi nó #EMP diễn ra#!.\n\nTrong lúc này, tốt hơn là không nên chần chừ. Sẽ thật đáng tiếc nếu [employer.GetFirstName] biết rằng [employer.GetSheHe] có một số "thuế" ngoài kho bạc."
  laamp_base_contract_schemes.2042.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.2043.t: "$laamp_base_contract_schemes.2041.t$: Thất Bại!"
  laamp_base_contract_schemes.2043.desc: "Có lẽ… có lẽ có lý do người ta không thử việc này thường xuyên.\n\nLần này đến lần khác, dân địa phương đuổi chúng Ta khỏi khu vực, gọi chúng Ta là người lạ và ngoại bang, yêu cầu chứng minh danh tính, không tin rằng [employer.GetTitleAsNameNoTooltip] sẽ thu thuế thêm mà không báo trước.\n\nTốt nhất là chúng Ta nên rời đi, ngay cả khi không thu được lợi ích gì, trước khi [employer.GetFirstName] nghe chuyện ở đây."
  laamp_base_contract_schemes.2043.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

  laamp_base_contract_schemes.2044.t: "$laamp_base_contract_schemes.2041.t$"
  laamp_base_contract_schemes.2044.desc: "$laamp_base_contract_schemes.2041.desc$"
  laamp_base_contract_schemes.2044.tt.destination_list.6_destinations: "Ngài lập tức bắt đầu [traveling|E] tới [destination_1.GetNameNoTier], sau đó [destination_2.GetNameNoTier], rồi [destination_3.GetNameNoTier], [destination_4.GetNameNoTier], [destination_5.GetNameNoTier], và cuối cùng [destination_6.GetNameNoTier]"
  laamp_base_contract_schemes.2044.tt.destination_list.5_destinations: "Ngài lập tức bắt đầu [traveling|E] tới [destination_1.GetNameNoTier], sau đó [destination_2.GetNameNoTier], [destination_3.GetNameNoTier], [destination_4.GetNameNoTier], và cuối cùng [destination_5.GetNameNoTier]"
  laamp_base_contract_schemes.2044.tt.destination_list.4_destinations: "Ngài lập tức bắt đầu [traveling|E] tới [destination_1.GetNameNoTier], sau đó [destination_2.GetNameNoTier], [destination_3.GetNameNoTier], và cuối cùng [destination_4.GetNameNoTier]"
  laamp_base_contract_schemes.2044.tt.destination_list.3_destinations: "Ngài lập tức bắt đầu [traveling|E] tới [destination_1.GetNameNoTier], sau đó [destination_2.GetNameNoTier], và cuối cùng [destination_3.GetNameNoTier]"
  laamp_base_contract_schemes.2044.tt.explanation: "#TUT Để hoàn thành [task_contract|E]:\n$EFFECT_LIST_BULLET$Hoàn thành thử thách [stewardship|E], [intrigue|E], hoặc [GetCourtPositionType('master_bard_camp_officer').GetName()] [aptitude|E] tại mỗi điểm đến\n$EFFECT_LIST_BULLET$Thắng một phần ba thử thách để đạt $label_success_qualified$\n$EFFECT_LIST_BULLET$Thắng hai phần ba thử thách để đạt thành công thông thường\n$EFFECT_LIST_BULLET$Thắng tất cả thử thách để đạt $label_success_critical$\n$EFFECT_LIST_BULLET$@warning_icon! #N Thất bại #BOL hai#! hoặc nhiều thử thách bất kỳ sẽ thất bại $game_concept_task_contract$#!\n$EFFECT_LIST_BULLET$@alert_icon! #alert_trial Mỗi thử thách hoàn thành thành công sẽ tăng nhẹ độ khó của các thử thách tiếp theo — tăng nhiều hơn với [skill|E] hoặc $game_concept_aptitude$ được thử#!#!"
  laamp_base_contract_schemes.2044.a: "$travel.stationary_domicile.option.t$"
  laamp_base_contract_schemes.2044.b: "$travel.mobile_domicile.option.t$"

 #################################################
 # Base Intrigue Scheme Events

  laamp_base_contract_schemes.3001.t: "Trinh sát Chủ động"
  laamp_base_contract_schemes.3001.desc: "Lời kêu gọi báo cáo thông thái về các sự kiện diễn ra xung quanh thủ đô của [employer.GetTitledFirstName] thu hút đủ hạng người lừa đảo, háo hức kiếm tiền dễ dàng bằng những tin đồn ngớ ngẩn hoặc bịa đặt hiển nhiên.\n\nMay mắn thay cho kẻ đó, ta và băng của mình không phải là những kẻ khờ khạo tầm thường đang chen chúc trong đại sảnh của kẻ đó, và có thể trao đổi những câu chuyện #EMP thú vị#! hơn về các vùng đất lân cận — mặc dù chúng hữu ích tới đâu còn tùy thuộc vào vị [employer.GetTitleAsNameNoTooltip] nhân hậu..."
  laamp_base_contract_schemes.3001.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.3001.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.3001.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.3001.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.3001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.3002.t: "$laamp_base_contract_schemes.3001.t$: Thành công!"
  laamp_base_contract_schemes.3002.desc: "Một đôi mắt và đôi tai tinh tường sẽ phát hiện ra nhiều điều khi nhóm di chuyển, không cần nhiều nỗ lực ngoài sự quan sát và trí nhớ chi tiết.\n\nMột nguyên tắc đơn giản, nhưng dễ thất bại với kẻ nóng nảy và liều lĩnh. Như dự đoán, #EMP các#! báo cáo của chúng Ta đủ thông tin để không chỉ nhận lương, mà còn được hưởng một chút sự tiếp đãi mở rộng.\n\nGây bực bội cho những điệp viên còn lại muốn tham gia."
  laamp_base_contract_schemes.3002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.3003.t: "$laamp_base_contract_schemes.3001.t$: Thất bại!"
  laamp_base_contract_schemes.3003.desc: "Khi chúng Ta bước vào [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier], Ta chắc chắn rằng những câu chuyện của chúng Ta là đúng, chi tiết, hữu ích... phải không? Chúng Ta... chúng Ta đã quá tự tin.\n\nTuy nhiên, chuyến ở lại với [employer.GetTitledFirstName], mặc dù bắt đầu thân thiện, nhanh chóng trở nên rắc rối. Những điệp viên được gửi đi truy dấu manh mối chúng Ta đặt lại trở về cay đắng hoặc không về, dẫn đến cáo buộc phá hoại cố ý và ác ý, những cuộc tranh cãi kéo dài và ồn ào.\n\nNói ngắn gọn, nơi này không còn an toàn cho chúng Ta nữa."
  laamp_base_contract_schemes.3003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

  laamp_base_contract_schemes.3004.t: "$laamp_base_contract_schemes.3001.t$"
  laamp_base_contract_schemes.3004.desc: "$laamp_base_contract_schemes.3001.desc$\n\nTrước hết, chúng Ta sẽ cần lén lút ghé qua một vài nơi mà [employer.GetFirstNameNoTooltip] quan tâm muốn biết thêm."
  laamp_base_contract_schemes.3004.tt.destination_list: "Ngài ngay lập tức bắt đầu [traveling|E] tới [destination_1.GetNameNoTier], sau đó [destination_2.GetNameNoTier], rồi [destination_3.GetNameNoTier]"
  laamp_base_contract_schemes.3004.tt.explanation: "#TUT Để hoàn thành [task_contract|E]:\n$EFFECT_LIST_BULLET$Hoàn thành thử thách [intrigue|E] hoặc [diplomacy|E] tại mỗi điểm đến\n$TAB$$EFFECT_LIST_BULLET$Ngài sẽ bị thử thách bởi người giỏi hơn trong [ruler|E] địa phương hoặc [spymaster|E] của họ\n$EFFECT_LIST_BULLET$Hoặc Ngài có thể đảm bảo thành công bằng cách tiêu hao [prestige|E] và [opinion|E] với họ\n$TAB$$EFFECT_LIST_BULLET$Chi phí [prestige|E] tăng tỉ lệ với [title_tier|E] của [ruler|E]\n$EFFECT_LIST_BULLET$Không thành công nào sẽ dẫn đến $label_failure_standard$\n$EFFECT_LIST_BULLET$Một thành công dẫn đến $label_success_qualified$\n$EFFECT_LIST_BULLET$Hai thành công dẫn đến $label_success_standard$\n$EFFECT_LIST_BULLET$Ba thành công dẫn đến $label_success_critical$#!"
  laamp_base_contract_schemes.3004.a: "$travel.stationary_domicile.option.t$"
  laamp_base_contract_schemes.3004.b: "$travel.mobile_domicile.option.t$"

  laamp_base_contract_schemes.3011.t: "Giải Pháp Khó Khăn"
  laamp_base_contract_schemes.3011.desc: ""Ta không cần nó chậm, chỉ cần đưa [target.GetTitledFirstName] tới vòng tay của [employer.GetFaith.DeathDeityNamePossessive] để Ta không phải nghĩ về [target.GetHerHim], rõ chưa?" growls [employer.GetTitledFirstName].\n\nTa gật đầu. Có nhiều điều chưa nói — tại sao [employer.GetSheHe] muốn [target.GetWomanMan] này chết, những gì cản trở [employer.GetHerHis] dùng cách thông thường — nhưng đó không phải việc của Ta.\n\nMột mạng sống bị cắt ngắn và đó là ngày trả lương."
  laamp_base_contract_schemes.3011.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.3011.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.3011.c: "$laamp_base_contract_schemes.0000.generic_option.secrecy$"
  laamp_base_contract_schemes.3011.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.3011.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.3012.t: "$laamp_base_contract_schemes.3011.t$: Thành công!"
  laamp_base_contract_schemes.3012.desc: ""Biên nhận của ngài, [employer.GetTitleAsNameNoTooltip]," Ta nói, đặt túi ướt lên sàn của [employer.GetFirstNameNicknamedPossessive]. Vải ướt nghiêng sang một bên, lộ một lọn tóc mỏng của [target.GetTitledFirstNamePossessive].\n\n"Ngươi đã hiểu 'đem cho ta đầu của [target.GetHerHis]' quá đúng nghĩa," [employer.GetSheHe] càu nhàu, "chắc chắn là cực khó để lấy. Nhưng vẫn là một công việc làm tốt. Lương của ngươi ở với Bạn Bè ngoài kia."\n\nTa cúi đầu tôn trọng và rời đi."
  laamp_base_contract_schemes.3012.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.3013.t: "$laamp_base_contract_schemes.3011.t$: Thất bại!"
  laamp_base_contract_schemes.3013.desc: ""Vậy giờ [target.GetTitledFirstName] đã biết có kẻ đang nhắm vào cái đầu của mình rồi phải không? Đồ ngốc!" [employer.GetTitledFirstName] gầm lên, "tại sao ta lại #EMP tin tưởng#! ngươi cơ chứ? Á!"\n\nTa nhún vai, mở miệng định giải thích về... sai lầm khiến con mồi của chúng ta thoát khỏi cái chết, nhưng bàn tay của [employer.GetFirstNamePossessiveNoTooltip] đã vung ra, ngón tay chỉ thẳng vào khoảng sân bên ngoài.\n\n"Ngươi sẽ không nhận được xu nào cho một công việc không hoàn thành. Cút khỏi [employer.Custom('FortifiedBuilding')] của ta trước khi ta trút sự thất vọng của mình lên #EMP ngươi#!.""
  laamp_base_contract_schemes.3013.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

  laamp_base_contract_schemes.3021.t: "Bắt Cóc Thù Địch"
  laamp_base_contract_schemes.3021.desc: "Hướng dẫn từ [employer.GetTitledFirstName] rõ ràng: tìm thời điểm [target.GetTitledFirstName] sơ hở, loại bỏ vệ sĩ [target.GetSheHe] có thể có, và đưa [target.GetHerHim] trở về [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier] sống và trong xiềng.\n\nĐơn giản thôi. [employer.GetTitleAsNameNoTooltip] không nói rõ #EMP lý do#! [employer.GetSheHe] muốn [target.GetWomanMan] này bị bắt bởi những kẻ bí mật, nhưng không phải việc của chúng Ta để hỏi."
  laamp_base_contract_schemes.3021.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.3021.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.3021.c: "$laamp_base_contract_schemes.0000.generic_option.secrecy$"
  laamp_base_contract_schemes.3021.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.3021.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.3022.t: "$laamp_base_contract_schemes.3021.t$: Thành công!"
  laamp_base_contract_schemes.3022.desc: ""[employer.GetTitledFirstName]," [target.GetTitledFirstName] phun ra khi ta kéo chiếc túi ra khỏi đầu kẻ đó, "ta đã đoán ngay là #EMP ngươi#! mà."\n\n[employer.GetFirstNameNoTooltip] [employer.Custom('Saying_3p_SmilesSeems')] và ra hiệu cho tên tù nhân quỳ xuống. Không cần nghi thức, ta đá mạnh vào lưng kẻ đó, khiến gã [target.GetWomanMan] ngã lăn ra sàn.\n\n"Một công việc tuyệt vời, [ROOT.Char.GetFirstNameNoTooltip]," chủ nhân của ta reo lên khi ném cho ta một túi vàng nặng trịch, "đáng giá đến từng đồng.""
  laamp_base_contract_schemes.3022.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.3023.t: "$laamp_base_contract_schemes.3021.t$: Thất bại!"
  laamp_base_contract_schemes.3023.desc: ""Ta thấy thiếu vắng [target.GetFirstName] một cách rõ rệt, [ROOT.Char.GetFirstNameNoTooltip]," [employer.GetTitledFirstName] mỉa mai khi ra hiệu xung quanh văn phòng của kẻ đó. "Chúng ta có hợp đồng rằng ngươi sẽ mang tên ngốc đó đến cho ta, vậy mà ta không thấy tên ngốc nào ở đây cả, đúng không?"\n\nTa nghiến răng và lắc đầu.\n\n"Ngươi thật may mắn khi ta đang tập trung vào con mồi khác, tên [ROOT.Char.Custom('GetLaampDescribeTypeInsult')]. Giờ hãy rời đi, trước khi ngươi lãng phí thêm lòng tốt của ta.""
  laamp_base_contract_schemes.3023.a: "Rời khỏi văn phòng."

  laamp_base_contract_schemes.3031.t: "Cuộc Nói Chuyện Gây Cháy"
  laamp_base_contract_schemes.3031.desc: "Cuộc trò chuyện với [employer.GetTitledFirstName] thật... khai sáng. Kẻ đó dường như đang sôi sục vì giận dữ trước một sự xúc phạm nhỏ nhặt từ [target.GetFirstNameNoTooltip], dù là thật hay tưởng tượng, và háo hức muốn đặt tên [target.GetWomanMan] đó vào chỗ của hắn nhưng chưa sẵn sàng để đổ máu quá nhiều.\n\nKế hoạch của vị [employer.GetTitleAsNamePossessiveNoTooltip] là bắt chúng ta phóng hỏa một tài sản nhỏ hơn thuộc về [target.GetFirstNameNoTooltip]. Làm theo yêu cầu này chắc chắn sẽ làm bùng lên căng thẳng, nhưng công việc là công việc."
  laamp_base_contract_schemes.3031.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.3031.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.3031.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.3031.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.3031.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.3032.t: "$laamp_base_contract_schemes.3031.t$: Thành công!"
  laamp_base_contract_schemes.3032.desc: "Nhóm Ta rất vui được báo cáo vụ phóng hỏa thành công với [employer.GetTitledFirstName], người [employer.Custom('PartAglow_EyesFaceBody')] khi [employer.GetSheHe] nghe câu chuyện thủ đoạn và lửa của chúng Ta.\n\n"#EMP Tốt#!, tốt! Tuyệt vời, [ROOT.Char.GetFirstName]," [employer.GetTitleAsNameNoTooltip] cười, "[target.GetFirstName] sẽ cảm nhận việc này một thời gian dài."\n\nMột cử chỉ, Bạn Bè bước vào, mang theo khoản thanh toán bằng bạc."
  laamp_base_contract_schemes.3032.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.3033.t: "$laamp_base_contract_schemes.3031.t$: Thất bại!"
  laamp_base_contract_schemes.3033.desc: "Nỗ lực phóng hỏa của chúng Ta nhanh chóng biến thành hỗn loạn: một Bạn Bè bắt gặp và reo báo động trước khi chúng Ta có thể chạy trốn.\n\nTrong cuộc chiến xảy ra, dù chúng Ta nhúng kiếm vào máu họ nhiều hơn họ nhúng vào máu chúng Ta, ngọn lửa nhỏ yếu ớt chúng Ta khởi xướng cũng bị dập tắt.\n\n[employer.GetTitledFirstName] từ chối gặp chúng Ta để giải thích. Quá bận để trừng phạt, nhưng cũng không có cơ hội nhận lương."
  laamp_base_contract_schemes.3033.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

  laamp_base_contract_schemes.3034.t: "$laamp_base_contract_schemes.3031.t$"
  laamp_base_contract_schemes.3034.desc: "Bức thư từ [employer.GetTitledFirstName] thật... khai sáng. Kẻ đó dường như đang sôi sục vì giận dữ trước một sự xúc phạm nhỏ nhặt từ [target.GetFirstNameNoTooltip], dù là thật hay tưởng tượng, và háo hức muốn đặt tên [target.GetWomanMan] đó vào chỗ của hắn, nhưng chưa sẵn sàng để đổ máu quá nhiều.\n\nKế hoạch của vị [employer.GetTitleAsNamePossessiveNoTooltip] là bắt chúng ta phóng hỏa một tài sản nhỏ hơn mà [target.GetFirstNameNoTooltip] có liên quan, hoặc phá hủy nó theo bất kỳ cách nào cảm thấy phù hợp.\n\nLàm theo yêu cầu này chắc chắn sẽ làm bùng lên căng thẳng, nhưng công việc là công việc."
  laamp_base_contract_schemes.3034.tt.destination_list: "Ngài ngay lập tức bắt đầu [traveling|E] tới [destination_1.GetNameNoTier]"
  laamp_base_contract_schemes.3034.tt.explanation: "#TUT Để hoàn thành [task_contract|E]:\n$EFFECT_LIST_BULLET$Hoàn thành thử thách [intrigue|E], [martial|E] hoặc [prowess|E], hoặc nhiều loại thử thách [officer|E] [aptitude|E] tại điểm đến\n$EFFECT_LIST_BULLET$[intrigue|E] luôn sẵn có\n$EFFECT_LIST_BULLET$Ngài có thể thử [martial|E] hoặc [prowess|E] tùy thuộc vào mục tiêu\n$EFFECT_LIST_BULLET$Nhân viên [officer|E] tốt nhất của Ngài cũng sẽ có sẵn, tùy thuộc vào mục tiêu\n$EFFECT_LIST_BULLET$Ngài có thể rút lui với chỉ $label_failure_qualified$ khi tới nơi, nếu thấy thử thách quá khó#!"
  laamp_base_contract_schemes.3034.a: "$travel.stationary_domicile.option.t$"
  laamp_base_contract_schemes.3034.b: "$travel.mobile_domicile.option.t$"

  laamp_base_contract_schemes.3041.t: "Một Vụ Trộm Nhỏ"
  laamp_base_contract_schemes.3041.desc: "Việc trinh sát sơ bộ xung quanh [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier] cho thấy chúng ta #EMP có thể#! thực hiện trót lọt: đây không phải là nơi duy nhất [employer.GetTitledFirstName] cất giữ của cải, nhưng tài sản của kẻ đó ở đây chắc chắn có #EMP rất nhiều#!, và đám thị vệ dường như không mong đợi sự thù địch.\n\nNói cách khác, rủi ro, nhưng khả thi.\n\nTất cả những gì chúng ta cần là một kế hoạch xảo quyệt..."
  laamp_base_contract_schemes.3041.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.3041.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.3041.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.3041.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.3041.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.3042.t: "$laamp_base_contract_schemes.3041.t$: Thành công!"
  laamp_base_contract_schemes.3042.desc: "Một ổ khóa mở nhẹ nhàng, một lính canh bị vô hiệu hóa, và đột nhiên... tài sản của [employer.GetPrimaryTitle.GetNameNoTier] hiện ra trước mắt chúng Ta.\n\nTúi của chúng Ta nhanh chóng đầy, và chúng Ta rút đi. Không cần quan tâm hậu quả.\n\nChỉ hy vọng không phải là chúng Ta."
  laamp_base_contract_schemes.3042.a: "[employer.GetTitledFirstNameNoTooltip], thật là một kẻ ngốc!"
  laamp_base_contract_schemes.3042.b: "Ngươi biết không... vẫn còn rất nhiều phía sau..."
  laamp_base_contract_schemes.3042.b.tt.possible_haul: "[employer.GetTitledFirstName] còn lại tới [gold_i][varcheck.MakeScope.Var('haul_possible').GetValue|P0] [gold|E] và trang bị có thể cướp, có thể lấy theo từng phần [gold_i][varcheck.MakeScope.Var('haul_increment').GetValue|P0]"
  laamp_base_contract_schemes.3042.b.tt.explanation: "#TUT Khi quay trở lại, ngươi sẽ:\n$EFFECT_LIST_BULLET$Luôn có thể kiểm tra [intrigue|E] để trộm thêm\n$EFFECT_LIST_BULLET$Kiểm tra ngẫu nhiên một trong các chỉ số sau:\n$TAB$$EFFECT_LIST_BULLET$[martial|E], [prowess|E], hoặc [stewardship|E]\n$TAB$$EFFECT_LIST_BULLET$[prowess|E] hoặc [intrigue|E] của một trong các [agents|E]\n$TAB$$EFFECT_LIST_BULLET$Khả năng của [GetCourtPositionType('master_thief_camp_officer').GetName()] hoặc [GetCourtPositionType('master_of_spoils_camp_officer').GetName()]\n$EFFECT_LIST_BULLET$Chịu [stress|E] để tự động vượt qua kiểm tra\n$EFFECT_LIST_BULLET$Tẩu thoát với chiến lợi phẩm\n$EFFECT_LIST_BULLET$Nếu thất bại hai lần, ngươi sẽ bị tống giam và chiến lợi phẩm bị tịch thu#!\n$EFFECT_LIST_BULLET$Nhận thêm kinh nghiệm [GetTrait('gallowsbait').GetName( GetNullCharacter )] tỷ lệ thuận với số lượng trộm được"
  laamp_base_contract_schemes.3042.b.tt.current_earnings: "#TUT Thu nhập từ hợp đồng đã được bảo đảm và sẽ vẫn là của Ngài#!"
  laamp_base_contract_schemes.3042.b.tt.you_go_back_for_more: "Quay lại [employer.Custom('ResidenceBuilding')|l], sẵn sàng cướp thêm!"

  laamp_base_contract_schemes.3043.t: "$laamp_base_contract_schemes.3041.t$: Thất bại!"
  laamp_base_contract_schemes.3043.desc: "Chết tiệt!\n\nKho bạc của [employer.GetFirstNamePossessiveNoTooltip|U] có nhiều lính hơn chúng Ta nghĩ, tuần tra khác với dự đoán — thậm chí trăng cũng phản bội với một đêm sáng rực...\n\nCuộc xâm nhập biến thành hỗn loạn đẫm máu ngay sau khi chúng Ta trèo lên tường ngoài. Không có bạc nào, chỉ có những vệ sĩ truy đuổi và vết thương nhức nhối là phần thưởng."
  laamp_base_contract_schemes.3043.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 #################################################
 # Base Learning Scheme Events

  laamp_base_contract_schemes.4001.t: "Bút Lông Thuê"
  laamp_base_contract_schemes.4001.desc: ""Tất nhiên, nếu việc này không #EMP quá#! nặng nhọc với ngươi," [employer.GetTitledFirstName] mỉm cười, đặt một xấp [ROOT.Char.Custom('GetWritingMaterial')] đã đóng gáy lên bàn. "Chỉ những thứ đó thôi."\n\nSau một lúc, kẻ đó thêm một cặp cuộn [ROOT.Char.Custom('GetWritingMaterial')]. Rồi một xấp [ROOT.Char.Custom('GetWritingMaterial')] nữa. Và một cuốn sách nhỏ.\n\nTa nhướng mày, và vị [employer.GetTitleAsNameNoTooltip] lấy ra từ ngăn kéo một tập tài liệu dày cộp hơn, đặt nó lên trên đỉnh đống đó.\n\n"Chà, chỉ #EMP những thứ đó#! thôi.""
  laamp_base_contract_schemes.4001.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.4001.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.4001.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.4001.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.4001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.4002.t: "$laamp_base_contract_schemes.4001.t$: Thành công!"
  laamp_base_contract_schemes.4002.desc: "Ta trở lại sảnh của [employer.GetTitledFirstNamePossessive] với tinh thần phấn chấn, tay nhuốm mực và mắt mệt mỏi vì thiếu ngủ, nhưng công việc đã hoàn thành.\n\nMột thành viên trong nhóm mang theo đống bản đã hoàn tất, vật lộn dưới sức nặng của chồng giấy lộn xộn.\n\n"Xong rồi sao? Ta nghĩ lẽ ra có thể cho ngươi thêm một chút," [employer.GetTitleAsNameNoTooltip] nói đùa trước khi vẫy chúng Ta ra ngoài. "Đừng để chúng ở đây; Bạn Bè của ta sẽ tìm người đọc thành quả của ngươi và lo lương cho ngươi.""
  laamp_base_contract_schemes.4002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.4003.t: "$laamp_base_contract_schemes.4001.t$: Thất bại!"
  laamp_base_contract_schemes.4003.desc: ""Ngồi xuống," lệnh [employer.GetTitledFirstName] khó chịu, cầm tờ giấy lấm lem mực, đầy những nét ngoằn ngoèo không rõ nghĩa. "Ngươi có biết điều này viết gì không?"\n\nTa lắc đầu.\n\n"Ta cũng không biết, vì #EMP đây không phải là chữ#!. Nhóm ngươi đã viết lách bao lâu dưới sự chứng kiến của [employer.GetFaith.KnowledgeGodName] và #EMP đây#! là tất cả những gì ngươi có để trình bày? Ta sẽ không trả tiền cho mực đổ bừa bãi. Mang những 'bản sao' của ngươi và ra ngoài!""
  laamp_base_contract_schemes.4003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

  laamp_base_contract_schemes.4011.t: "Giải Quyết Thần Học"
  laamp_base_contract_schemes.4011.desc: ""... và đó là cốt lõi của vấn đề," [employer.GetTitledFirstName] kết thúc. "Ngươi có gì muốn bổ sung không, [chaplain.GetTitledFirstName]?"\n\nVị [chaplain.GetCouncilTitle] lắc đầu; "ngài đã tóm tắt rất tốt, thưa [employer.GetLadyLord] — nếu nhiệm vụ của thần không gọi thần đi nơi khác thì thần đã vui vẻ phân xử rồi, nhưng..."\n\nVị [employer.GetTitleAsNameNoTooltip] giơ một tay lên ra hiệu cho [chaplain.GetHerHim] dừng lại. "Đừng lo, ta tin chắc [ROOT.Char.GetFirstName] sẽ xử lý tốt đám [employer.GetFaith.PriestNeuterPlural] đầy tranh cãi của chúng ta.""
  laamp_base_contract_schemes.4011.a: "Họ tệ đến mức nào cơ chứ?"
  laamp_base_contract_schemes.4011.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.4011.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.4011.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.4011.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.4012.t: "$laamp_base_contract_schemes.4011.t$: Thành công!"
  laamp_base_contract_schemes.4012.desc: "Cuộc tranh luận cuối cùng hóa ra khá đơn giản để giải quyết: cả hai bên đều quá bận tấn công lẫn nhau nên chỉ cần một lời kêu gọi mơ hồ về tinh thần đoàn kết [ROOT.Char.GetFaith.GetReligion.GetName] đã thuyết phục được những người trung lập.\n\nCác [employer.GetFaith.PriestNeuterPlural] trung tâm cuộc thảo luận vẫn còn giận nhau, nhưng với quá ít người tham gia, nguy cơ leo thang thành xung đột lớn đã giảm.\n\n[employer.GetTitledFirstName] có vẻ hài lòng."
  laamp_base_contract_schemes.4012.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.4013.t: "$laamp_base_contract_schemes.4011.t$: Thất bại!"
  laamp_base_contract_schemes.4013.desc: "Đó là... nhiều máu hơn mức một cuộc tranh luận lời nói nên có.\n\nCuộc thảo luận leo thang thành la hét, la hét thành cuồng nhiệt, cuồng nhiệt thành xúc phạm, và chỉ là vấn đề thời gian trước khi ai đó tung nắm đấm. Ngay cả bây giờ, hỗn loạn vẫn tiếp tục vượt ngoài tầm kiểm soát.\n\nNói ngắn gọn, chúng Ta sẽ không nhận được lương cho việc này."
  laamp_base_contract_schemes.4013.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

  laamp_base_contract_schemes.4021.t: "Hoa Quả Của Trí Tuệ"
  laamp_base_contract_schemes.4021.desc: "Cuộc thảo luận với [employer.GetTitledFirstName] thật... khai sáng.\n\nHóa ra điều [employer.GetSheHe] muốn là một cuốn sách nhỏ dí dỏm về các châm ngôn và trí tuệ truyền thống [ROOT.Char.GetCulture.GetName], nhằm thể hiện [employer.GetHerHim] như một nhà bảo trợ nghệ thuật thực thụ.\n\nĐiều này khó đến mức nào cơ chứ?"
  laamp_base_contract_schemes.4021.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.4021.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.4021.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.4021.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.4021.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.4022.t: "$laamp_base_contract_schemes.4021.t$: Thành công!"
  laamp_base_contract_schemes.4022.desc: "Một triều đình khác, một nhà bảo trợ hài lòng!\n\nCuốn sách 'Về Nhiều Thủ Đoạn và Bí Ẩn của [ROOT.Char.GetCulture.GetName]' được viết ngắn gọn, #EMP vừa đủ dí dỏm#! để khiến triều đình xôn xao với các chủ đề truyền thống và tư duy thường thức.\n\nChắc chắn khó tồn tại lâu, chứ chưa nói đến in nhiều bản, nhưng đã đủ để chúng Ta nhận lương."
  laamp_base_contract_schemes.4022.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.4023.t: "$laamp_base_contract_schemes.4021.t$: Thất bại!"
  laamp_base_contract_schemes.4023.desc: ""Lãng phí! Đây là thứ #EMP vớ vẩn#! mà ngươi tạo ra, [ROOT.Char.GetFirstName]?" gào lên [employer.GetTitledFirstName], lật các trang chúng Ta chuẩn bị. "'Giá trị thật sự của trái tim con người không hơn mồ hôi trên trán'? Ý nghĩa #EMP gì cơ chứ#!?"\n\nTa mở miệng giải thích, nhưng [employer.GetTitleAsNameNoTooltip] ghét bỏ ném bản thảo vào Ta và ra hiệu cho Ta ra ngoài.\n\nHình như Ta đã nói quá đủ."
  laamp_base_contract_schemes.4023.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

  laamp_base_contract_schemes.4031.t: "Xin bố thí"
  laamp_base_contract_schemes.4031.desc: "Thuyết phục để được gặp [employer.GetTitledFirstName] thật may mắn là dễ hơn tưởng, với một chút bí ẩn hấp dẫn về mục đích của chúng ta để 'bôi trơn' mọi thứ.\n\nKhi được tiếp kiến, mục đích của chúng ta nhanh chóng trở nên rõ ràng. Như những [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] đã học được, chúng ta phụ thuộc vào lòng hào phóng của các #EMP nhà cai trị khai sáng#! để tiếp tục việc tốt, và vì vậy [employer.GetTitleAsNameNoTooltip] miễn cưỡng đồng ý cho chúng ta ở lại một thời gian — nhưng chỉ bấy nhiêu thôi!\n\n... ít nhất là bây giờ."
  laamp_base_contract_schemes.4031.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.4031.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.4031.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.4031.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.4031.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.4032.t: "$laamp_base_contract_schemes.4031.t$: Thành công!"
  laamp_base_contract_schemes.4032.desc: "Thời gian ở với [employer.GetTitledFirstName] cuối cùng rất thành công: sự duyên dáng và kiến thức từ từ làm tan bớt nghi ngờ của [employer.GetTitleAsNamePossessive], khiến [employer.GetHerHim] bị thu hút, và rồi những món quà bảo trợ thật sự bắt đầu chảy về.\n\nMột công việc đầy lợi ích, tất nhiên, nhưng thiện chí này sẽ không kéo dài mãi, nên tất nhiên chúng ta sẽ rời đi trước khi ở quá lâu.\n\n[employer.GetCapitalLocation.GetTitle.GetName] đã thật sự tốt với kho báu của chúng ta."
  laamp_base_contract_schemes.4032.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.4033.t: "$laamp_base_contract_schemes.4031.t$: Thất bại!"
  laamp_base_contract_schemes.4033.desc: "Trong suốt thời gian ở lại, thái độ của [employer.GetTitledFirstNamePossessive] đối với chúng ta chỉ ngày càng tệ — không được cải thiện bởi những nỗ lực của chúng ta để xin quà và hứa hẹn từ [employer.GetHerHim] vào bất kỳ cơ hội nào.\n\nNgày qua ngày, sự khó chịu của [employer.GetTitleAsNamePossessiveNoTooltip] tăng lên. Khi sai lầm của Ta trở nên rõ ràng, thì tội trạng về ăn xin đang chờ chúng ta nếu tiếp tục lãng phí thời gian ở đây cũng hiển hiện."
  laamp_base_contract_schemes.4033.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

  laamp_base_contract_schemes.4041.t: "Mỗi Vật Trang Sức là Kho Báu"
  laamp_base_contract_schemes.4041.desc: ""Còn cái này đây," [employer.GetTitledFirstName] nói, xem xét một viên đá nhỏ được chạm khắc màu xanh lục lam, "tốt cho bệnh gút sao? Ngươi có nhiều loại thật đấy, [ROOT.Char.GetFirstName]."\n\n"Nếu [employer.GetLadyLord] muốn, thần có thể cho người lấy thêm một số vật phẩm độc lạ hơn từ hành lý?" lời nói tuôn ra mượt mà và đầy tự tin, "như người thấy đấy, chúng ta có rất nhiều tài sản để phục vụ người và triều đình."\n\nVị [employer.GetTitleAsName] gật đầu, chấp thuận cho chúng ta lưu lại một thời gian."
  laamp_base_contract_schemes.4041.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.4041.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.4041.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.4041.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.4041.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.4042.t: "$laamp_base_contract_schemes.4041.t$: Thành công!"
  laamp_base_contract_schemes.4042.desc: "Thời gian ở [employer.GetCapitalLocation.GetTitle.GetName] đem lại lợi nhuận cực lớn! Giao dịch với sự chấp thuận ngầm của [employer.GetTitledFirstNamePossessive] mang đến uy tín cho hàng hóa của chúng Ta mà cả khả năng thuyết phục nhanh nhẹn nhất cũng không làm được.\n\nBùa chú, thuốc men, đồ trang sức và đồ chơi — triều thần và khách đều mua hết, không câu hỏi.\n\nÍt nhất thì bây giờ là vậy. Chúng Ta sẽ đi trước khi họ bắt đầu nghi ngờ."
  laamp_base_contract_schemes.4042.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.4043.t: "$laamp_base_contract_schemes.4041.t$: Thất bại!"
  laamp_base_contract_schemes.4043.desc: "Các triều thần của [employer.GetTitledFirstNamePossessive] tinh hơn vẻ bề ngoài... từng lời nói dối nhỏ của chúng ta bị nghi ngờ, rồi lần lượt bị lật tẩy, từ từ phá hủy uy tín của chúng ta như những người bán thuốc kỳ lạ.\n\nThậm chí, sự gian dối rõ ràng khiến [employer.GetTitleAsNameNoTooltip] trở nên kém sang: hoặc [employer.GetSheHe] cho phép chúng ta, hoặc bị lừa, và cả hai đều không làm tăng thiện cảm với triều đình.\n\nDù sao, tốt nhất là nên rời đi — dù không có lợi nhuận — trước khi cơn giận của [employer.GetFirstNamePossessiveNoTooltip] biến thành bạo lực."
  laamp_base_contract_schemes.4043.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 #################################################
 # Base Prowess Scheme Events

  laamp_base_contract_schemes.5001.t: "[employer.Custom('GetOutOfControlAnimalTypePlural')|U] để Xẻ thịt"
  laamp_base_contract_schemes.5001.desc: "Chỉ thị từ [employer.GetTitledFirstName] thật đơn giản: lấy đầu càng nhiều [employer.Custom('GetOutOfControlAnimalTypePlural')] càng tốt và, nếu thành tích ấn tượng, được quyền săn trên đất [employer.GetHerHis] trong một thời gian.\n\nTất cả vùng đất để rình rập… nghĩa là thịt để muối, da để thuộc, sừng và móng để chặt, kho báu ở khắp nơi.\n\nMột cuộc phiêu lưu vừa phấn khích vừa sinh lợi, tổng thể mà nói."
  laamp_base_contract_schemes.5001.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.5001.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.5001.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.5001.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.5001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.5002.t: "$laamp_base_contract_schemes.5001.t$: Thành công!"
  laamp_base_contract_schemes.5002.desc: "Nhóm của Ta và Ta đã khoác lên mình vinh quang nhờ cuộc săn này: nhiều [employer.Custom('GetOutOfControlAnimalTypePlural')] nằm chết dưới tay chúng Ta, khiến chúng Ta nổi tiếng với dân chúng và [employer.GetTitledFirstName], đồng thời thành quả từ miền hoang dã thật phong phú.\n\nHành lý chất đầy lông thú và thực phẩm, chúng Ta kiếm được đủ để bổ sung mũi tên mất và giáo gãy."
  laamp_base_contract_schemes.5002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.5003.t: "$laamp_base_contract_schemes.5001.t$: Thất bại!"
  laamp_base_contract_schemes.5003.desc: "Những [employer.Custom('GetOutOfControlAnimalTypePlural')], những #EMP [employer.Custom('GetOutOfControlAnimalTypePlural')]!#! Đêm này qua đêm khác, chúng ta nghe tiếng gầm của chúng, và đoàn săn của ta luôn mất vài người.\n\nDù giết bao nhiêu con đi nữa, luôn có nhiều sinh vật nguyền rủa này. Không lạ gì [employer.GetTitledFirstName] không xử lý nổi.\n\nRõ ràng chúng ta cần cắt lỗ, bỏ hợp đồng khốn nạn này trước khi miền hoang dã nuốt chửng tất cả."
  laamp_base_contract_schemes.5003.a: "Để quân của [employer.GetFirstNamePossessiveNoTooltip] bị xé xác thay thế!"

  laamp_base_contract_schemes.5011.t: "Người gác"
  laamp_base_contract_schemes.5011.desc: "Dù cuộc tấn công mà [employer.GetTitledFirstName] dự đoán vào tài sản của thương nhân là thật hay tưởng tượng, nhiệm vụ canh gác bên ngoài thật chán, ngay cả khi phần lớn do nhóm đảm nhận.\n\nChúng Ta được trả tiền để cảnh giác và hiện diện. Một màn thể hiện sức mạnh và bảo vệ từ người bảo vệ vùng đất.\n\nDù phải đứng giữa trời mưa nắng."
  laamp_base_contract_schemes.5011.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.5011.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.5011.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.5011.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.5011.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.5012.t: "$laamp_base_contract_schemes.5011.t$: Thành công!"
  laamp_base_contract_schemes.5012.desc: "#EMP Tấn công#!. Nghe có vẻ quá oai vệ cho vài kẻ côn đồ lấm lem lao vào lúc chạng vạng, tất cả xong trong vài phút. Thật ra chỉ là một vụ hỗn chiến hoặc ẩu đả trong ngõ.\n\nDù sao, [employer.GetTitledFirstName] có vẻ hài lòng.\n\nQuyền lực của [employer.GetHerHis|U] vẫn tuyệt đối, và điều đó là tất cả — nghĩa là chúng ta sẽ được trả hậu hĩnh."
  laamp_base_contract_schemes.5012.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.5013.t: "$laamp_base_contract_schemes.5011.t$: Thất bại!"
  laamp_base_contract_schemes.5013.desc: "\"Chúng Ta trả tiền để các ngươi gác, và giờ đây chỉ còn tro tàn và máu khô, [ROOT.Char.GetFirstName]!\" gầm [employer.GetTitledFirstName]. \"Sao lại để bọn côn đồ nhỏ nhặt bất ngờ tấn công? Ngươi chỉ có #EMP một#! nhiệm vụ thôi mà!\"\n\nTa định đáp, nhưng [employer.GetTitleAsNameNoTooltip] ngắt lời.\n\n\"Im lặng, ta không muốn nghe cớ. Cút đi.\""
  laamp_base_contract_schemes.5013.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

  laamp_base_contract_schemes.5021.t: "Người hộ vệ của [employer.GetTitleAsNamePossessiveNoTooltip]"
  laamp_base_contract_schemes.5021.desc: "\"Vì vậy, ngươi thấy tại sao ta cần vài… mắt thêm rải quanh [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier],\" nói [employer.GetTitledFirstName]. \"Ngươi sẽ cung cấp lớp bảo vệ thêm, để nếu điều gì đó lọt qua các thủ hạ thông thường — hoặc nếu họ phản bội — ta vẫn có thép tốt che lưng.\"\n\nTa gật đầu. Khó chịu khi không thể tin vào vệ sĩ, nhưng ít ra tốt cho kinh doanh.\n\n\"Tuyệt, ngươi bắt đầu ngay.\""
  laamp_base_contract_schemes.5021.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.5021.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.5021.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.5021.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.5021.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.5022.t: "$laamp_base_contract_schemes.5021.t$: Thành công!"
  laamp_base_contract_schemes.5022.desc: "\"Công việc tuyệt vời, [ROOT.Char.GetFirstName], thực sự,\" reo [employer.GetTitledFirstName], \"mọi con chó bị xử lý với sự duyên dáng và hiệu quả! Không một sợi lông nào trên ta bị hại bởi lũ phản bội.\"\n\n\"Duyên dáng có hơi quá lời, [employer.GetLadyLord] của Ta,\" Ta đáp. Một tớ phía sau chăm chỉ cọ máu dính trên tường.\n\n\"Bah, thà máu chúng trên thảm còn hơn của ta. Lương sẽ được trả ngay lập tức.\""
  laamp_base_contract_schemes.5022.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.5023.t: "$laamp_base_contract_schemes.5021.t$: Thất bại!"
  laamp_base_contract_schemes.5023.desc: "Ngay khi kẻ ám sát vượt qua chúng Ta, Ta biết phải chạy, và chạy thật nhanh.\n\nChúng Ta không thể đuổi kịp để tạo khác biệt, và dù thủ hạ của [employer.GetTitledFirstNamePossessive] có cứu [employer.GetHerHim] hay không, ai đó sẽ phải trả giá.\n\nCàng chần chừ ở đây, người đó càng có khả năng là Ta."
  laamp_base_contract_schemes.5023.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

  laamp_base_contract_schemes.5031.t: "Kẻ trộm gia súc"
  laamp_base_contract_schemes.5031.desc: "Trộm gia súc hàng loạt cũng có nghệ thuật riêng: Ngài phải biết sẽ đưa chúng đi đâu, không thể tinh vi nhưng #EMP phải#! trông như thuộc về nơi đó, và khi gặp kháng cự, sự tàn bạo cần nhanh chóng.\n\nNguy cơ gia súc hoảng loạn hoặc mất kiểm soát làm nguy hại toàn bộ, và khi thất bại, lợi nhuận chìm nhanh như tàu bị bão.\n\nHi vọng [employer.GetTitledFirstName] không bảo vệ tốt gia súc của [employer.GetHerHis]."
  laamp_base_contract_schemes.5031.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.5031.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.5031.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.5031.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.5031.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.5032.t: "$laamp_base_contract_schemes.5031.t$: Thành công!"
  laamp_base_contract_schemes.5032.desc: "Một chiến dịch hoàn hảo! Sau nhiều chuẩn bị — vạch đường đi, thiết lập người mua, trinh sát đồng cỏ — nhóm trộm gia súc tiến hành loạt đột kích ban đêm, đưa đàn vật đi xa trong một tuần.\n\n[employer.GetTitledFirstName] không cần lo, gia súc [employer.GetHerHis] chắc chắn sẽ đến tay chủ mới tốt. Chủ mới rủng rỉnh tiền và #EMP rất#! hào phóng."
  laamp_base_contract_schemes.5032.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.5033.t: "$laamp_base_contract_schemes.5031.t$: Thất bại!"
  laamp_base_contract_schemes.5033.desc: "Mọi thứ… dường như rất suôn sẻ.\n\nChúng Ta biết lộ trình, đã lên kế hoạch tấn công, nhưng mùi máu, tiếng ồn, hay thay đổi thói quen…\n\nNhóm Ta buộc phải tản ra, chó săn của [employer.GetTitledFirstNamePossessive] đuổi sát, và chỉ còn ít gia súc trộm được."
  laamp_base_contract_schemes.5033.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

  laamp_base_contract_schemes.5034.t: "Trộm gia súc (Rustling)"
  laamp_base_contract_schemes.5034.desc: "$laamp_base_contract_schemes.5031.desc$"
  laamp_base_contract_schemes.5034.a: "$travel.stationary_domicile.option.t$"
  laamp_base_contract_schemes.5034.b: "$travel.mobile_domicile.option.t$"
  laamp_base_contract_schemes.5034.tt.destination_list.5: "Ngài bắt đầu ngay [traveling|E] đến [destination_1.GetNameNoTier], rồi [destination_2.GetNameNoTier], [destination_3.GetNameNoTier], [destination_4.GetNameNoTier], và cuối cùng [destination_5.GetNameNoTier]"
  laamp_base_contract_schemes.5034.tt.destination_list.4: "Ngài bắt đầu ngay [traveling|E] đến [destination_1.GetNameNoTier], rồi [destination_2.GetNameNoTier], [destination_3.GetNameNoTier], và cuối cùng [destination_4.GetNameNoTier]"
  laamp_base_contract_schemes.5034.tt.destination_list.3: "Ngài bắt đầu ngay [traveling|E] đến [destination_1.GetNameNoTier], rồi [destination_2.GetNameNoTier], và cuối cùng [destination_3.GetNameNoTier]"
  laamp_base_contract_schemes.5034.tt.destination_list.2: "Ngài bắt đầu ngay [traveling|E] đến [destination_1.GetNameNoTier], rồi [destination_2.GetNameNoTier]"
  laamp_base_contract_schemes.5034.tt.explanation: "#TUT Để hoàn thành [task_contract|E]:\n$EFFECT_LIST_BULLET$Hoàn thành thử thách [prowess|E], [martial|E] hoặc [stewardship|E] tại mỗi điểm đến\n$EFFECT_LIST_BULLET$Nếu có, Ngài có thể kiểm tra năng lực tốt nhất của [GetCourtPositionType('head_groom_camp_officer').GetName()], [GetCourtPositionType('huntperson_camp_officer').GetName()], [GetCourtPositionType('kennelperson_camp_officer').GetName()], hoặc [GetCourtPositionType('master_of_spoils_camp_officer').GetName()] [officers|E]\n$EFFECT_LIST_BULLET$Để thành công —\n$TAB$$EFFECT_LIST_BULLET$Chiến thắng mọi thử thách cho $label_success_critical$\n$TAB$$EFFECT_LIST_BULLET$Chiến thắng hơn nửa thử thách cho $label_success_standard$\n$TAB$$EFFECT_LIST_BULLET$Chiến thắng ít nhất một thử thách cho $label_success_qualified$\n$TAB$$EFFECT_LIST_BULLET$Thua mọi thử thách cho $label_failure_standard$#!"

  laamp_base_contract_schemes.5041.t: "Kẻ săn trộm"
  laamp_base_contract_schemes.5041.desc: "Dường như đất của [employer.GetTitledFirstNamePossessive] đầy thú săn, đến mức [employer.GetSheHe] đã gặp rắc rối với những kẻ săn trộm.\n\nVới nhóm [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] vui nhộn của Ta, thật thô lỗ nếu để [employer.GetTitleAsNameNoTooltip] bị quá tải. Chúng Ta sẽ giúp bằng cách lấy chỉ #EMP vài#! con chim ngon, có thể lột chỉ #EMP vài#! con thú..."
  laamp_base_contract_schemes.5041.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.5041.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.5041.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
  laamp_base_contract_schemes.5041.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
  laamp_base_contract_schemes.5041.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"

  laamp_base_contract_schemes.5042.t: "$laamp_base_contract_schemes.5041.t$: Thành công!"
  laamp_base_contract_schemes.5042.desc: "Ahhh, một cuộc săn thú phấn khích tại [employer.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTier]! Dù thủ hạ của [employer.GetTitledFirstNamePossessive] gọi chúng Ta là kẻ săn trộm, họ có quá nhiều thịt hươu, và [ROOT.Char.GetFaith.WealthGodName] ghét lãng phí.\n\nChúng Ta ra đi no nê, bụng đầy và tay không bị trói."
  laamp_base_contract_schemes.5042.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.5043.t: "$laamp_base_contract_schemes.5041.t$: Thất bại!"
  laamp_base_contract_schemes.5043.desc: "Đáng ghét và nguyền rủa lũ chó lai của [employer.GetTitledFirstName]!\n\nChúng không #EMP cần#! nhiều thú, nhưng sự theo đuổi dai dẳng phá hỏng từng cuộc săn, và, ôi nhục nhã, nhốt vài người trong nhóm Ta vào cùm.\n\nTa biết khi nào nên cắt lỗ. Ở lại lâu hơn, càng có nguy cơ #EMP chúng Ta#! trở thành con mồi, không phải những con chim chết tiệt."
  laamp_base_contract_schemes.5043.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

  laamp_base_contract_schemes.5051.t: "Trộm phố hẻm"
  laamp_base_contract_schemes.5051.desc: "Thông báo mà [employer.GetTitledFirstName] treo ra đúng hơn dự đoán: dường như [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier] đang bị tấn công bởi hàng loạt tội phạm vặt.\n\nChỉ riêng khi chúng Ta đi vào thành phố, đã đếm được cả tá vụ móc túi và một vụ cướp công khai, quá nhiều việc đối với những hộ gia đình kiệt quệ của [employer.GetTitleAsNameNoTooltip].\n\nMôi trường hoàn hảo cho những [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] tinh ranh như chúng Ta kiếm một chút #EMP tiền#!."
  laamp_base_contract_schemes.5051.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
  laamp_base_contract_schemes.5051.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
  laamp_base_contract_schemes.5051.c: "$laamp_base_contract_schemes.0000.generic_option.secrecy$"
  laamp_base_contract_schemes.5051.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"

  laamp_base_contract_schemes.5052.t: "$laamp_base_contract_schemes.5051.t$: Thành công!"
  laamp_base_contract_schemes.5052.desc: "Nhờ [employer.GetTitledFirstNamePossessive] không thể duy trì trật tự trên đường phố [employer.GetHerHis] thủ đô, [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] đã có thể moi tiền toàn bộ dân chúng [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier].\n\nCó thể không phải cách kiếm sống danh giá, nhưng lợi nhuận thì cực kỳ.\n\nBài học đầu tiên của bất kỳ kẻ tội phạm nào là biết lúc nào nên dừng. Khi đã có tiền, đã đến lúc rút lui — trước khi [employer.GetTitleAsNameNoTooltip] phát hiện và tìm chúng ta."
  laamp_base_contract_schemes.5052.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

  laamp_base_contract_schemes.5053.t: "$laamp_base_contract_schemes.5051.t$: Thất bại!"
  laamp_base_contract_schemes.5053.desc: "Dù đã cố gắng hết sức, dường như [employer.GetTitledFirstName] nhanh nhạy hơn trong việc giải quyết các vấn đề với lũ tội phạm nhỏ lẻ so với việc [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] tận dụng chúng.\n\nVới đám thị vệ của [employer.GetTitleAsNamePossessiveNoTooltip] tràn ngập khắp các con phố và cơ hội của chúng ta đang dần khép lại bất chấp những chiến lợi phẩm thu được, ta buộc phải lẻn cùng băng của mình ra khỏi [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier] trước khi luật pháp kịp tóm cổ.\n\nCó vẻ như chúng ta sẽ không tìm thấy thêm món hời nào ở đây nữa."
  laamp_base_contract_schemes.5053.a: "Bah, chúng ta sẽ tìm nơi khác giàu hơn."

  protect_minority_vassal_contract_scheme_desc_success_boilerplate: "$laamp_contract_scheme_desc_success_boilerplate$ [contractor|E] sẽ khiến chúa tể của mình phải nhượng bộ và trao quyền lợi cho [vassal_contract|E]."
  protect_minority_vassal_contract_scheme_desc_generic: "Nhóm thiểu số mà [contractor|E] đại diện tìm kiếm quyền không thể chối cãi trước định kiến."
  protect_minority_vassal_contract_diplomacy_scheme: "Đối thoại mở"
  protect_minority_vassal_contract_diplomacy_scheme_action: "Dẫn dắt Đối thoại mở với"
  protect_minority_vassal_contract_diplomacy_scheme_desc: "$protect_minority_vassal_contract_scheme_desc_generic$ Một cuộc đối thoại thân thiện sẽ tạo sự thấu hiểu lẫn nhau và dẫn dắt chúng ta qua những vấn đề gai góc.$laamp_contract_scheme_desc_general_boilerplate$"
  protect_minority_vassal_contract_diplomacy_scheme_desc_general: "$protect_minority_vassal_contract_diplomacy_scheme_desc$"
  protect_minority_vassal_contract_diplomacy_scheme_desc_success: "$protect_minority_vassal_contract_scheme_desc_success_boilerplate$"
  protect_minority_vassal_contract_martial_scheme: "Chiến thuật đe dọa"
  protect_minority_vassal_contract_martial_scheme_action: "Dùng Chiến thuật đe dọa lên"
  protect_minority_vassal_contract_martial_scheme_desc: "$protect_minority_vassal_contract_scheme_desc_generic$ Một màn thể hiện sức mạnh đáng sợ sẽ khiến chúa tể của [contractor|E] phải nhượng bộ.$laamp_contract_scheme_desc_general_boilerplate$"
  protect_minority_vassal_contract_martial_scheme_desc_general: "$protect_minority_vassal_contract_martial_scheme_desc$"
  protect_minority_vassal_contract_martial_scheme_desc_success: "$protect_minority_vassal_contract_scheme_desc_success_boilerplate$"
  protect_minority_vassal_contract_intrigue_scheme: "Khai thác thông tin"
  protect_minority_vassal_contract_intrigue_scheme_action: "Khai thác thông tin về"
  protect_minority_vassal_contract_intrigue_scheme_desc: "$protect_minority_vassal_contract_scheme_desc_generic$ Không chỉ người yếu mới dễ tổn thương: những kẻ quyền lực #EMP luôn#! có điểm yếu để khai thác...$laamp_contract_scheme_desc_general_boilerplate$"
  protect_minority_vassal_contract_intrigue_scheme_desc_general: "$protect_minority_vassal_contract_intrigue_scheme_desc$"
  protect_minority_vassal_contract_intrigue_scheme_desc_success: "$protect_minority_vassal_contract_scheme_desc_success_boilerplate$"
  protect_minority_vassal_contract_learning_scheme: "Diễn giải pháp luật"
  protect_minority_vassal_contract_learning_scheme_action: "Dùng Diễn giải pháp luật lên"
  protect_minority_vassal_contract_learning_scheme_desc: "$protect_minority_vassal_contract_scheme_desc_generic$ [scheme|E] tìm kiếm các tiền lệ pháp lý có thể bảo vệ thần dân khỏi bạo chúa.$laamp_contract_scheme_desc_general_boilerplate$"
  protect_minority_vassal_contract_learning_scheme_desc_general: "$protect_minority_vassal_contract_learning_scheme_desc$"
