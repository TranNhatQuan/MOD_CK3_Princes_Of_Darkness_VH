 #################################################
 # Base Diplo Scheme Loc

  laamp_base_0001_contract_scheme: "Kể Chuyện Cho Triều Đình"
  laamp_base_0001_contract_scheme_action: "Kể Chuyện Cho Triều Đình Của"
  laamp_base_0001_contract_scheme_desc: "Trong [scheme|E] này, [court|E] của [contractor_possessive|E] trở nên khô cạn chuyện đàm tiếu và vì thế dần bất an. Để mang đến những tin tức mới mẻ, họ ban tặng quà cáp và chỗ ở cho những lữ khách lang bạt có đủ danh tiếng, nhằm khuyến khích họ ở lại một thời gian và kể lại những điều đã thấy.$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_0001_contract_scheme_desc_general: "$laamp_base_0001_contract_scheme_desc$"
  laamp_base_0001_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_0001_desc_title: "Tìm người kể chuyện thú vị!"
  laamp_base_0001_desc: "Hãy kể về [TaskContract.GetEmployer.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] cùng những chuyện thế sự và nhận thưởng! Mọi người có chuyện để kể đều được trân trọng mời đến tận hưởng sự hiếu khách của [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] xứ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier]."

  laamp_base_0011_contract_scheme: "Cải Thiện Danh Tiếng Lãnh Chúa"
  laamp_base_0011_contract_scheme_action: "Cải Thiện Danh Tiếng Cho"
  laamp_base_0011_contract_scheme_desc: "Một [contractor|E] nhận thấy địa vị của mình đang suy giảm: hoặc danh tiếng của họ đã bị bôi nhọ, quá nhiều [vassals|E] căm ghét họ, hoặc đơn giản là họ thiếu [prestige|E] để biện minh cho điều mình mong muốn. Điều họ cần là một bên thứ ba “trung lập” để giúp... #EMP củng cố#! danh tiếng của mình.$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_0011_contract_scheme_desc_general: "$laamp_base_0011_contract_scheme_desc$"
  laamp_base_0011_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_0011_desc_title: "Cần sứ giả ăn nói khéo léo,"
  laamp_base_0011_desc: "Gửi tới mọi người đáng kính và đáng tin cậy: cơ hội làm việc tốt đang chờ đợi trong sự phục vụ của [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] xứ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier]. Chỉ tiếp nhận những người nghiêm túc."

  laamp_base_0021_contract_scheme: "Giao Du Với Lãnh Chúa"
  laamp_base_0021_contract_scheme_action: "Giao Du Với"
  laamp_base_0021_contract_scheme_desc: "Khi một [contractor|E] rõ ràng đang khao khát sự chú ý, họ tự mở ra cơ hội cho những kẻ cơ hội. Những kẻ có thể ăn bánh của họ, vét sạch hầm rượu, vay mượn vài khoản “nợ”, rồi biến mất trước khi tiếng kêu của đám quan lại sổ sách kịp vang lên.$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_0021_contract_scheme_desc_general: "$laamp_base_0021_contract_scheme_desc$"
  laamp_base_0021_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_0021_desc_title: "Cần những người ngoại quốc thú vị,"
  laamp_base_0021_desc: "Xin cho hay rằng [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] hào phóng của xứ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] ban tặng lòng hiếu khách rộng rãi của [TaskContract.GetEmployer.GetHerHis] cho những lữ khách từng trải và xứng đáng."

  laamp_base_0031_contract_scheme: "Hòa Giải Thay Mặt"
  laamp_base_0031_contract_scheme_action: "Hòa Giải Cho"
  laamp_base_0031_contract_scheme_desc: "Khi những lời buộc tội cay nghiệt giữa dân địa phương vang lên khắp lãnh địa của một [contractor], và bản thân họ bị cho là quá bất tài hoặc quá thiên vị để giải quyết tranh chấp, họ có thể trao vai trò hòa giải viên trung lập cho những lữ khách phù hợp.$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_0031_contract_scheme_desc_general: "$laamp_base_0031_contract_scheme_desc$"
  laamp_base_0031_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_0031_desc_title: "Tìm lữ khách xuất thân cao quý,"
  laamp_base_0031_desc: "Các trọng tài trung lập đang được [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] xứ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] tìm kiếm để giải quyết công bằng một tranh chấp địa phương. Có thưởng thêm nếu giải quyết hoàn toàn."

  laamp_base_0041_contract_scheme: "Kẻ Lừa Đảo"
  laamp_base_0041_contract_scheme_action: "Lừa Gạt"
  laamp_base_0041_contract_scheme_desc: "Một kẻ ngốc và tài sản của hắn rất dễ bị tách rời. Không [contractor|E] nào chính thức #EMP yêu cầu#! điều này — không, họ chỉ mắc sai lầm khi trò chuyện với một kẻ lừa đảo, để rồi khi hợp đồng kết thúc mới phát hiện mình đã bị lừa (hoặc thậm chí bị cướp), còn kẻ lang bạt gian trá thì đã biến mất.$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_0041_contract_scheme_desc_general: "$laamp_base_0041_contract_scheme_desc$"
  laamp_base_0041_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_0041_desc_title: "Tìm người thú vị,"
  laamp_base_0041_desc: "[TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] thông thái và tinh tường của xứ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] mong muốn được giải trí trong một mùa. Chỗ ở #EMP có hạn#! sẽ được cung cấp, #EMP nếu#! Ngài đáp ứng được những tiêu chuẩn khắt khe của [TaskContract.GetEmployer.GetHerHis]."

 #################################################
 # Base Martial Scheme Loc

  laamp_base_1001_contract_scheme: "Săn Lùng Tội Phạm"
  laamp_base_1001_contract_scheme_action: "Săn Lùng Tội Phạm Cho"
  laamp_base_1001_contract_scheme_desc: "Một băng nhóm tội phạm liều lĩnh có thể gây ra rất nhiều thiệt hại cho tài sản, [prestige|E], thậm chí cả [legitimacy|E] nếu có đủ thời gian. Đủ lớn để gây lo ngại, nhưng cũng đủ nhỏ để khó bị bắt giữ, những kẻ coi thường pháp luật như vậy trở thành đối tượng hoàn hảo cho một [contract_scheme_contract|E].$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_1001_contract_scheme_desc_general: "$laamp_base_1001_contract_scheme_desc$"
  laamp_base_1001_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_1001_desc_title: "Những lữ khách gần [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier],"
  laamp_base_1001_desc: "Hãy để mắt đến những kẻ phản loạn và vô lại đang lẩn khuất trên các con đường hẻo lánh!\n\nNếu cánh tay cầm kiếm của Ngài đủ mạnh và ánh mắt đủ tinh tường, [TaskContract.GetEmployer.GetTitledFirstName] hứa ban thưởng hậu hĩnh để đổi lấy cái đầu của một tên côn đồ cụ thể."

  laamp_base_1011_contract_scheme: "Lính Đánh Thuê"
  laamp_base_1011_contract_scheme_action: "Thi Hành Cho"
  laamp_base_1011_contract_scheme_desc: "Khi một [contractor|E] cần áp dụng thêm chút vũ lực một cách kín đáo và trong thời gian ngắn, một kiếm sĩ đánh thuê có thể hành động kín kẽ hơn nhiều so với những cận vệ thông thường.$laamp_contract_scheme_desc_general_boilerplate$"
  laamp_base_1011_contract_scheme_desc_general: "$laamp_base_1011_contract_scheme_desc$"
  laamp_base_1011_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
  laamp_base_1011_desc_title: "Các lính đánh thuê danh tiếng,"
  laamp_base_1011_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] xứ [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] đang khẩn thiết tìm kiếm những kiếm sĩ đánh thuê kín đáo cho một nhiệm vụ ngắn hạn. Phần thưởng hậu hĩnh dành cho công việc nhanh gọn và sạch sẽ."

