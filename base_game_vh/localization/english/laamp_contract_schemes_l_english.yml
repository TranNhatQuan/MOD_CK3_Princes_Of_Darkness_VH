  laamp_base_contract_schemes.2301.t: "$laamp_base_contract_schemes.2004.t$: Cổng thành"
  laamp_base_contract_schemes.2301.desc.intro: ""[ROOT.Char.GetTitledFirstNameNoTooltip], chào mừng!" kêu lên [person_a.GetTitledFirstName] khi nhóm Ta bước vào thành phố của [person_a.GetHerHis]."
  laamp_base_contract_schemes.2301.desc.intro.has_quartermaster: "[GetCourtPositionType('quartermaster_camp_officer').GetName()] của Ta, [quartermaster.GetFirstName], lướt theo phía sau, luôn cảnh giác và sẵn sàng hỗ trợ."
  laamp_base_contract_schemes.2301.desc.midtro: "\n\nChẳng mấy chốc, Ta được giới thiệu với các đại gia khác trong thị trấn — [person_b.GetFirstName], [person_c.GetFirstName], và [person_d.GetFirstName].\n\n“Chúng Ta #EMP chắc chắn#! rằng Ngài sẽ đồng ý với chúng Ta"
  laamp_base_contract_schemes.2301.desc.liar.honest_or_good: "khi chúng Ta nói rằng chúng Ta hoàn toàn không thể chịu thêm các khoản phí mà chúa tể của chúng Ta [person_a.GetLadyLord] [person_a.GetTitledFirstName] sẽ áp đặt," lẩm bẩm [person_a.GetFirstNameNoTooltip].\n\n[person_a.GetHerHis|U] nói chuyện trôi chảy và đều đặn. Lời nói của một [person_a.GetWomanMan] trung thực hoặc một kẻ nói dối lão luyện."
  laamp_base_contract_schemes.2301.desc.liar.not_lying: "khi chúng Ta phản đối loại thuế bất công này. Chúng Ta chỉ là dân thành phố đơn giản, và lâu nay đã dâng hết những gì có thể cho [employer.GetTitledFirstName]."\n\nCó thể đúng, cũng có thể không. Chúng ta sẽ biết sớm thôi."
  laamp_base_contract_schemes.2301.desc.liar.poor_liar_lying: "k-khi chúng Ta nói rằng chúng Ta thực sự k-không thể, không, #EMP sẽ không#!, giấu bất cứ điều gì với [employer.GetTitledFirstName]!" lẩm bẩm [person_a.GetFirstNameNoTooltip]."
  laamp_base_contract_schemes.2301.desc.liar.other_liars_lying: "$laamp_base_contract_schemes.2301.desc.liar.not_lying$"
  laamp_base_contract_schemes.2301.a: "Ta sẽ bắt đầu với Ngài, [person_a.GetFirstNameNoTooltip]."
  laamp_base_contract_schemes.2301.a.tt: "Ngài ngay lập tức kiểm tra tài sản của [person_a.GetFirstNamePossessive]"
  laamp_base_contract_schemes.2301.b: "Có lẽ bắt đầu với doanh nghiệp của [person_b.GetFirstNamePossessiveNoTooltip]?"
  laamp_base_contract_schemes.2301.b.tt: "Ngài ngay lập tức kiểm tra tài sản của [person_b.GetFirstNamePossessive]"
  laamp_base_contract_schemes.2301.c: "Chúng ta sẽ kiểm tra [person_c.GetFirstNameNoTooltip] trước."
  laamp_base_contract_schemes.2301.c.tt: "Ngài ngay lập tức kiểm tra tài sản của [person_c.GetFirstNamePossessive]"
  laamp_base_contract_schemes.2301.d: "[person_d.GetFirstNameNoTooltip], xin dẫn đường."
  laamp_base_contract_schemes.2301.d.tt: "Ngài ngay lập tức kiểm tra tài sản của [person_d.GetFirstNamePossessive]"

  laamp_base_contract_schemes.2311.t: "$laamp_base_contract_schemes.2004.t$: [char_current.GetFirstNameNoTooltip]"
  laamp_base_contract_schemes.2311.desc.business.council_chamber: "Quarters của [char_current.GetFirstNamePossessive] với tư cách [char_current.GetTitleAsNameNoTooltip] của thành phố thật rộng rãi. [char_current.GetSheHe|U] dẫn Ta tới phòng họp dành cho những người quan trọng nhất trong thị trấn, đặt Ta ở đầu bàn."
  laamp_base_contract_schemes.2311.desc.business.armory: "[char_current.GetFirstName] dẫn chúng Ta đến nguồn tài sản của [char_current.GetHerHis]: một kho vũ khí đầy đủ — có xưởng rèn gắn kèm — cung cấp vũ khí và đạn dược cho dân quân và các đoàn lữ hành qua đường."
  laamp_base_contract_schemes.2311.desc.business.temple: "Có vẻ như [char_current.GetFirstName] kiếm phần lớn của cải của [char_current.GetHerHis] từ việc cho những người đến viếng đền thờ địa phương thuê nhà trọ và điều hành một hội từ thiện nhỏ — dĩ nhiên, chỉ trích lại một phần rất nhỏ cho chính [char_current.GetHerselfHimself]."
  laamp_base_contract_schemes.2311.desc.business.dungeon: "Có vẻ như [char_current.GetFirstName] kiểm soát một nhà ngục nhỏ, kiếm chác của cải của [char_current.GetHerHis] bằng cách giam giữ những con nợ, kẻ lang thang và tội phạm thay cho kẻ khác. Một khoản tiền khấm khá từ các lệ phí và tiền phạt của những kẻ bị giam cầm đã giúp duy trì hoạt động này."
  laamp_base_contract_schemes.2311.desc.business.docks: "Tiền của [char_current.GetFirstNamePossessive] rõ ràng đến từ bến cảng thành phố, nơi [char_current.GetSheHe] có một văn phòng nhỏ nhưng đầy đủ tiện nghi nhìn ra những cầu cảng đông đúc nhất. Hai cánh cửa sổ lớn cho phép [char_current.GetHerHim] nhô ra và la mắng những người khuân vác lười biếng."
  laamp_base_contract_schemes.2311.desc.business.study: "Cộng đồng học giả ở [destination_1.GetBaseNameNoTier] tuy nhỏ nhưng lại rất kiên cường. Hầu hết các thư lại địa phương dường như đều làm việc cho [char_current.GetFirstName] theo cách này hay cách khác, người duy trì một mối làm ăn khấm khá nhờ vào sự độc quyền gần như tuyệt đối của [char_current.GetHerHis] về thư tín trong thị trấn."
  laamp_base_contract_schemes.2311.desc.business.physicians_study: "Doanh nghiệp của [char_current.GetFirstNamePossessive] chủ yếu liên quan đến y dược, chữa bệnh và cung cấp nữ hộ sinh giỏi. Một nghề không phổ biến với đại gia, nhưng rất cần thiết."
  laamp_base_contract_schemes.2311.desc.business.tavern: "Như nhiều người khác, doanh thu của [char_current.GetFirstNamePossessive] đến trực tiếp từ những bàn tay khát nước của lao động khiêm tốn [destination_1.GetBaseNameNoTierPossessive]. Thức ăn ngon cho khách, âm nhạc cho dân địa phương và không khí thân thiện làm cho nơi này có lợi nhuận cao."
  laamp_base_contract_schemes.2311.desc.business.bp1_kitchen_western: "Doanh nghiệp của [char_current.GetFirstNamePossessive] xoay quanh việc lưu trữ và cung cấp thực phẩm, cả hiếm và phổ thông. Người dân có ngũ cốc rẻ khi cần, giới thượng lưu có người cung cấp thực phẩm hợp thời từ kinh đô xa xôi."
  laamp_base_contract_schemes.2311.desc.business.market: "[char_current.GetFirstName] quản lý chợ chính của [destination_1.GetBaseNameNoTierPossessive], đơn giản nhưng có lợi. [char_current.GetSheHe|U] quản lý quầy hàng, thu phí, thu thuế cho [person_a.GetTitleAsNameNoTooltip], cùng các thủ tục khác."
  laamp_base_contract_schemes.2311.desc.business.bath_house: "Một chỗ sang trọng, [char_current.GetFirstName] vận hành nhà tắm phát đạt trong tường thành [destination_1.GetBaseNameNoTierPossessive]. Không ai có thể không đánh giá cao một bồn tắm tốt, rửa sạch bụi bẩn của thế giới hiện đại, và vài đồng là xứng đáng."
  laamp_base_contract_schemes.2311.desc.personality.mayor: ""Kính thưa [ROOT.Char.GetTitleAsNameNoTooltip], chắc hẳn ngài cũng thấy tham lam của [employer.GetTitleAsNamePossessive] là... sai chỗ. [employer.GetSheHe|U] đã trao cho ngài quyền hạn của [employer.GetHerHis]. Hãy giúp chúng Ta trong việc này, và chúng Ta sẽ đảm bảo cả thế giới biết về lòng hào phóng của ngài.""
  laamp_base_contract_schemes.2311.desc.personality.ai_honor: ""Như ngài thấy, tài sản của Ta thành công nhưng không quá rộng lớn. Chúng Ta làm việc tốt, trung thực, nhưng không thể chịu nổi mức tăng cao như vậy của [employer.GetTitleAsNamePossessive].""
  laamp_base_contract_schemes.2311.desc.personality.ai_zeal: ""Chúng Ta làm việc cho [char_current.GetFaith.HealthGodNamePossessive] ở đây, [ROOT.Char.GetTitledFirstNameNoTooltip], thật sự vậy. Một khoản đóng góp thêm nữa sẽ làm chúng Ta kiệt quệ, điều đó quá rõ ràng.""
  laamp_base_contract_schemes.2311.desc.personality.ai_greed: ""Ta có đóng đủ phần của mình không? Có, tất nhiên. Nhưng đó chính là #EMP phần của Ta#!. Ta đóng thuế bắt buộc, nhưng đây không phải thuế chính thức, chỉ là một sự tùy hứng vô nghĩa từ [employer.GetTitleAsName] và ai cũng biết điều đó.""
  laamp_base_contract_schemes.2311.desc.personality.ai_compassion: ""Ngài có vẻ là một [ROOT.Char.GetWomanMan] hợp lý, [ROOT.Char.GetTitledFirstNameNoTooltip]. Xin hiểu rằng chúng Ta đang làm hết sức mình, nhưng chúng Ta luôn chỉ còn cách một năm xui rủi là rơi vào rắc rối, thậm chí là nạn đói.""
  laamp_base_contract_schemes.2311.desc.personality.ai_boldness: ""Ta tự coi mình là một [char_current.GetWomanMan] thẳng thắn, Ta nói thẳng và hy vọng người khác cũng nói thẳng với Ta. Thuế #EMP của [employer.GetTitleAsNamePossessive]#! là bất công và chúng Ta không thể trả. Chỉ có vậy thôi.""
  laamp_base_contract_schemes.2311.desc.personality.ai_rationality: ""Ta biết, Ta biết, có vẻ chúng Ta đang làm ăn tốt, nhưng đây không phải lần đầu [employer.GetTitleAsName] áp thêm #EMP nghĩa vụ#! cho chúng Ta trong năm nay, và Ta đoán sẽ không phải lần cuối. Ngài phải hiểu sự miễn cưỡng của chúng Ta.""
  laamp_base_contract_schemes.2311.desc.personality.ai_vengefulness: ""Ta thích chơi công bằng, [ROOT.Char.GetTitledFirstNameNoTooltip], cả trong kinh doanh, với người dưới quyền và với những người trên quyền. Nhưng công bằng chỉ có giá trị nếu mọi người cùng tham gia, nếu không, đó là cách #EMP một số#! người để lại ác cảm.""
  laamp_base_contract_schemes.2311.desc.personality.ai_energy: ""Ta là một [char_current.GetWomanMan] bận rộn, ngài cũng là một [ROOT.Char.GetWomanMan] bận rộn, nên ta sẽ nói thẳng. Nếu bọn ta có tiền, bọn ta đã vui vẻ trả rồi, nhưng bọn ta không có, nên sẽ không trả. Như vậy là đủ rõ ràng rồi chứ?""
  laamp_base_contract_schemes.2311.desc.personality.ai_sociability: ""Này, hãy bỏ qua tất cả chuyện rắc rối này và uống một chén đi. Sao không ở lại một chút! Chúng Ta hiếm khi có những vị khách thú vị như vậy ở thị trấn nhỏ này, chắc chắn ngài sẽ không phải châm lại chén của mình trong ít nhất một tuần.""
  laamp_base_contract_schemes.2311.desc.personality.ai_personality_fallback: ""Vậy... làm thế nào chúng ta tiến hành đây? Ta không ghi chép mọi thứ, biết không. Điều đó sẽ quá tốn kém. Nhiều chuyện chỉ là bắt tay, hợp đồng được giữ nơi khác, ngài hiểu kiểu đó...""
  laamp_base_contract_schemes.2311.desc.loot.gold: "Khi [char_current.GetSheHe] nói, tâm trí Ta bỗng nhớ lại một rương lớn dường như chứa bạc mà chúng Ta đã đi qua khi vào..."
  laamp_base_contract_schemes.2311.desc.loot.courtier_opinion: "[char_current.GetSheHe|U] nói chuyện khi chúng Ta đi, và Ta không thể không nhận thấy một kho chứa đầy đồ xa xỉ..."
  laamp_base_contract_schemes.2311.desc.loot.piety: "[char_current.GetSheHe|U] tán gẫu, nhưng Ta không thể không để ý một góc chứa đầy vật phẩm tín ngưỡng quý giá..."
  laamp_base_contract_schemes.2311.desc.loot.provisions: "[char_current.GetSheHe|U] tiếp tục trò chuyện, nhưng Ta không thể quên bếp đầy đủ thức ăn mà chúng Ta đã đi qua..."
  laamp_base_contract_schemes.2311.a: "Xem qua hồ sơ tài chính của [char_current.GetHerHis]."
  laamp_base_contract_schemes.2311.b: "Cố gắng bắt [char_current.GetHerHim] nói dối."
  laamp_base_contract_schemes.2311.c: "Tìm dấu hiệu của những hành vi sai trái."
  laamp_base_contract_schemes.2311.d: "Kiểm tra mọi thứ chi tiết tỉ mỉ."
  laamp_base_contract_schemes.2311.e.gold: "Đồng tiền đó — Ta tạm giữ nó vì #EMP nghi ngờ#!."
  laamp_base_contract_schemes.2311.e.courtier_opinion: "Những đồ xa xỉ đó — Ta sẽ lấy chúng để #EMP kiểm tra#!."
  laamp_base_contract_schemes.2311.e.piety: "Những bùa thần thánh đó — Ta #EMP tạm giữ#! chúng."
  laamp_base_contract_schemes.2311.e.provisions: "Những thực phẩm đó — Ta lấy làm tài sản thế chấp."
  laamp_base_contract_schemes.2311.f.quartermaster_exists: "[quartermaster.GetFirstNameNoTooltip|U], bắt đầu kiểm tra."
  laamp_base_contract_schemes.2311.f.quartermaster_dnae_exist: "Giá mà Ta mang theo một $quartermaster_camp_officer$..."
  laamp_base_contract_schemes.2311.tt.current_clues: "#TUT Ngài đã thu thập [task_contract.MakeScope.Var('clues_gathered').GetValue|0] bằng chứng trong tổng số 4#!"
  laamp_base_contract_schemes.2311.tt.chars_checked: "#TUT Ngài đã điều tra [task_contract.MakeScope.Var('chars_checked').GetValue|0] [characters|E] trong tổng số 4#!"
  laamp_base_contract_schemes.2311.tt.success_increases_score: "Ngài nhận được #P +1#! bằng chứng"
  laamp_base_contract_schemes.2311.tt.failure_gives_no_score: "Không nhận được bằng chứng nào"
  laamp_base_contract_schemes.2311.stewardship.tt.success: "Ngài tìm thấy thứ Ngài cần"
  laamp_base_contract_schemes.2311.stewardship.tt.failure: "Lộn xộn và vô giá trị"
  laamp_base_contract_schemes.2311.diplomacy.tt.success: "Một sai lầm ngớ ngẩn từ [char_current.GetHerHis]"
  laamp_base_contract_schemes.2311.diplomacy.tt.failure: "Mọi lời đều nhất quán"
  laamp_base_contract_schemes.2311.intrigue.tt.success: "Không thông minh như [char_current.GetSheHe] tự nghĩ về [char_current.GetSheHe] đâu"
  laamp_base_contract_schemes.2311.intrigue.tt.failure: "Thông minh hơn Ngài gấp rưỡi"
  laamp_base_contract_schemes.2311.learning.tt.success: "Ngài biết phải tìm đâu"
  laamp_base_contract_schemes.2311.learning.tt.failure: "Ngài tìm khắp nơi nhưng không thấy gì"

  laamp_base_contract_schemes.2312.t.success: "$laamp_base_contract_schemes.2004.t$: Thành công!"
  laamp_base_contract_schemes.2312.t.failure: "$laamp_base_contract_schemes.2004.t$: Thất bại!"
  laamp_base_contract_schemes.2312.t.ignored: "$laamp_base_contract_schemes.2004.t$: Nhiệm vụ bị bỏ qua"
  laamp_base_contract_schemes.2312.desc.method.stewardship: "Chúng Ta xem xét kỹ lưỡng các ghi chú, biên lai của [char_current.GetTitledFirstNamePossessive] và những gì nhân chứng [char_current.GetSheHe] có thể tìm được trong thời gian ngắn liên quan đến các giao dịch của [char_current.GetHerHis]."
  laamp_base_contract_schemes.2312.desc.method.diplomacy: "Cuộc trò chuyện của chúng Ta kéo dài hơn một giờ, đi qua từng chi tiết nhỏ nhất trong các giao dịch của [char_current.GetTitledFirstNamePossessive] ở [destination_1.GetBaseNameNoTier], nơi diễn ra, với ai, kiếm được bao nhiêu, và còn nhiều hơn nữa."
  laamp_base_contract_schemes.2312.desc.method.intrigue: "Ta dẫn dắt cuộc trò chuyện theo mọi hướng thông thường, đảm bảo có đủ khoảng nghỉ và những mạch suy nghĩ chập chờn để [char_current.GetTitledFirstName] có cơ hội sơ hở."
  laamp_base_contract_schemes.2312.desc.method.learning: "Chúng ta đàm đạo trong khoảng thời gian mà #EMP có cảm giác#! như là đã trôi qua gần hết cả ngày trời, bàn luận về mọi khía cạnh có thể nghĩ ra trong các công việc làm ăn của [char_current.GetTitledFirstNamePossessive] ở [destination_1.GetBaseNameNoTier]. Không một góc khuất nào bị bỏ sót, không một câu hỏi nào không được đặt ra."
  laamp_base_contract_schemes.2312.desc.method.quartermaster: "Với [quartermaster.GetFirstName] dẫn dắt buổi phỏng vấn, [char_current.GetTitledFirstName] ngồi xuống để trả lời hàng loạt câu hỏi dường như không hồi kết. Ban đầu kiên nhẫn, rồi ngày càng bớt kiên nhẫn theo thời gian."
  laamp_base_contract_schemes.2312.desc.method.thief.gold: "Tất nhiên, [char_current.GetTitledFirstName] rên rỉ và sùi bọt mép về số bạc bị mất của [char_current.GetHerHis], nhưng một khi thuộc hạ của ta đã nắm giữ nó thì [char_current.GetSheHe] chẳng thể làm được gì nhiều."
  laamp_base_contract_schemes.2312.desc.method.thief.courtier_opinion: "[char_current.GetTitledFirstName|U] tỏ ra không vui với việc Ta #EMP chiếm đoạt#!, nhưng đó là vấn đề của [char_current.GetHerHis]: những người theo Ta chắc chắn sẽ không dễ dàng trả lại đồ xa xỉ mới có."
  laamp_base_contract_schemes.2312.desc.method.thief.piety: "[char_current.GetTitledFirstName|U] có thể rên rỉ và lải nhải bao nhiêu tùy thích theo ý [char_current.GetSheHe] về những lời nguyền rủa của [char_current.GetFaith.FateGodName] giáng xuống phường trộm cắp và những thứ đại loại thế, nhưng ta nghĩ giờ thì ta đã biết ai trong hai ta mới là kẻ thánh thiện hơn."
  laamp_base_contract_schemes.2312.desc.method.thief.provisions: "[char_current.GetTitledFirstName|U] quát mắng, ném vài lời chửi, nhưng cuối cùng đủ khôn ngoan để không cản đường nhóm [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] đói và bữa ăn mới có của họ."
  laamp_base_contract_schemes.2312.desc.result.outro.all_done: "Và với điều đó, chúng Ta đã theo dõi mọi manh mối. Chỉ còn một việc phải làm."
  laamp_base_contract_schemes.2312.desc.result.success: "Không mất nhiều công sức để khai thác sự thật từ [char_current.GetHerHim] — điều mà [char_current.GetSheHe] dường như hết sức ngạc nhiên."
  laamp_base_contract_schemes.2312.desc.result.failure: "Dù chúng Ta cố gắng hết sức, [char_current.GetSheHe] vẫn hoàn toàn vô tội — thái độ mà [char_current.GetSheHe] tỏ ra quá tự mãn."
  laamp_base_contract_schemes.2312.desc.result.ignored: "Con chim trong tay hơn con chim trên cây, và lợi ích nhiều khả năng sai trái của [char_current.GetWomanMan] này nằm gọn trong tay Ta — dù việc lấy chúng làm giảm khả năng điều tra [char_current.GetHerHim]."
  laamp_base_contract_schemes.2312.desc.result.outro.success: "Hi vọng may mắn sẽ theo chúng Ta cho người tiếp theo."
  laamp_base_contract_schemes.2312.desc.result.outro.failure: "Hi vọng lần sau chúng ta sẽ tốt hơn."
  laamp_base_contract_schemes.2312.desc.result.outro.ignored: "Hi vọng lần sau cũng mang lại lợi nhuận."
  laamp_base_contract_schemes.2312.a: "[person_a.GetFirstNameNoTooltip] tiếp theo."
  laamp_base_contract_schemes.2312.b: "Tiếp tục, đến tài sản của [person_b.GetFirstNamePossessiveNoTooltip]."
  laamp_base_contract_schemes.2312.c: "Vẫn còn [person_c.GetFirstNameNoTooltip]..."
  laamp_base_contract_schemes.2312.d: "Chúng ta sẽ xem [person_d.GetFirstNameNoTooltip] có giấu điều gì không."
  laamp_base_contract_schemes.2312.e: "Ta đã đưa ra quyết định của mình."
  laamp_base_contract_schemes.2312.tt.boilerplate.continue_investigation: "Ngài tiếp tục thu thập các bằng chứng"
  laamp_base_contract_schemes.2312.tt.boilerplate.end_investigation: "Ngài quyết định phán quyết cuối cùng của mình"

  laamp_base_contract_schemes.2321.t: "$laamp_base_contract_schemes.2004.t$: Tuyên bố"
  laamp_base_contract_schemes.2321.desc.intro: "Chúng Ta tập trung trong phòng của [person_a.GetTitledFirstNamePossessive], nơi thích hợp để đưa ra phán quyết của Ta. Với lời của [employer.GetTitleAsNamePossessive] đứng sau, điều này sẽ có hiệu lực. Dù thế nào đi nữa.\n\n[person_b.GetFirstName], [person_c.GetFirstName], và [person_d.GetFirstName] đều hồi hộp chờ đợi phán quyết về số phận của họ, trong khi [person_a.GetFirstNameNoTooltip] dường như lo lắng lần đầu tiên kể từ khi Ta đến.\n\nLinh cảm Ta bảo rằng"
  laamp_base_contract_schemes.2321.desc.tax_status.has_cash: "họ có thể trả, nhưng họ đơn giản là không muốn,"
  laamp_base_contract_schemes.2321.desc.tax_status.partial_cash: "họ có thể trả ít nhất một phần,"
  laamp_base_contract_schemes.2321.desc.tax_status.no_cash: "họ thực sự không có tiền để trả,"
  laamp_base_contract_schemes.2321.desc.clues_gathered.four: "và cuộc điều tra của Ta chứng minh điều đó hoàn toàn đúng."
  laamp_base_contract_schemes.2321.desc.clues_gathered.two_to_three: "và cuộc điều tra của Ta phần lớn chứng thực điều đó."
  laamp_base_contract_schemes.2321.desc.clues_gathered.one_or_less: "nhưng Ta thiếu bằng chứng để chứng minh."
  laamp_base_contract_schemes.2321.tt.clue_total.exceptional_achievable: "Sau khi thu thập tất cả các bằng chứng có thể, cuộc điều tra của Ngài đủ kỹ lưỡng để ép buộc $label_success_critical$ nếu Ngài bắt họ trả"
  laamp_base_contract_schemes.2321.tt.clue_total.normal_achievable: "Với đủ bằng chứng thu thập được, cuộc điều tra của Ngài có khả năng kết thúc với $label_success_standard$ nếu Ngài buộc họ trả toàn bộ số tiền"
  laamp_base_contract_schemes.2321.tt.clue_total.failure_possible: "Vì Ngài thu thập chưa đủ bằng chứng, cuộc điều tra thiếu sót của Ngài có thể gặp phản kháng từ dân địa phương nếu Ngài buộc họ trả toàn bộ số tiền"
  laamp_base_contract_schemes.2321.a: "Ngài sẽ trả đầy đủ."
  laamp_base_contract_schemes.2321.a.tt: "Ngài đứng về phía [employer.GetTitledFirstName], chống lại [person_a.GetTitledFirstName]"
  laamp_base_contract_schemes.2321.a.tt.success_standard: "Nếu Ngài đã thu thập đủ bằng chứng"
  laamp_base_contract_schemes.2321.a.tt.success_qualified: "Nếu Ngài thiếu bằng chứng, nhưng dân địa phương chịu thua"
  laamp_base_contract_schemes.2321.a.tt.failure_standard: "Nếu Ngài thiếu bằng chứng, và dân địa phương nổi dậy"
  laamp_base_contract_schemes.2321.b: "Ngài chỉ trả — một nửa."
  laamp_base_contract_schemes.2321.b.tt: "Ngài đứng về phía [employer.GetTitledFirstName], nhưng giảm bớt gánh nặng thuế cho [person_a.GetTitledFirstName]"
  laamp_base_contract_schemes.2321.c: "Rõ ràng [destination_1.GetBaseNameNoTierNoTooltip] thực sự không thể chịu nổi."
  laamp_base_contract_schemes.2321.c.tt: "Ngài đứng về phía [person_a.GetTitledFirstName], chống lại [employer.GetTitledFirstName]"

  laamp_base_contract_schemes.2322.t.success_critical: "$laamp_base_contract_schemes.2004.t$: Trả đầy đủ"
  laamp_base_contract_schemes.2322.t.success_standard: "$laamp_base_contract_schemes.2004.t$: Đã trả"
  laamp_base_contract_schemes.2322.t.success_qualified_insufficient_evidence: "$laamp_base_contract_schemes.2004.t$: Trả đầy nhưng cay đắng"
  laamp_base_contract_schemes.2322.t.violence: "$laamp_base_contract_schemes.2004.t$: Bạo lực bùng phát"
  laamp_base_contract_schemes.2322.desc.violence: "Sự tĩnh lặng bao trùm khắp căn phòng.\n\nMột sự tĩnh lặng căng thẳng, gượng gạo, khi những người dân địa phương đưa mắt nhìn nhau, sự bất mãn làm miệng họ cong lên gần như thành những tiếng gầm gừ.\n\nCùng một âm thanh chói tai bất thần của gỗ cọ sát trên nền đá, [aggressor.GetTitledFirstName] đẩy mạnh chiếc ghế của [aggressor.GetHerHis] ra sau: "Nếu ngươi định thực thi công lý một cách tồi tệ như thế này, ác quỷ ạ, vậy thì hãy chuẩn bị nếm thử công lý của bọn ta đi!"\n\nVài phút tiếp theo chỉ là một mớ hỗn độn mờ ảo khi hai tên thuộc hạ của ta lao vào phòng, theo sát là một nhóm binh lính của chính [person_a.GetTitledFirstNamePossessive]. Những lưỡi gươm được rút ra, những lời đe dọa gào thét, và thị trấn nhanh chóng rơi vào một cuộc bạo loạn toàn diện."
  laamp_base_contract_schemes.2322.desc.success_critical: "Với cuộc điều tra rõ ràng và không thể chối cãi, cả [person_a.GetTitledFirstName] lẫn bọn thuộc hạ của [person_a.GetHerHis] không thể phản bác kết quả.\n\nNgay cả khi kết quả hoàn toàn #EMP thuận lợi#! cho những gì [employer.GetTitledFirstName] thấy tiện, thì cũng đáng để thưởng thêm."
  laamp_base_contract_schemes.2322.desc.success_standard: "Ta có đủ bằng chứng để chứng minh dân địa phương #EMP có thể#! trả hóa đơn gần đây nhất, và khi trình bày, những tiếng thở dài mệt mỏi từ mọi nơi cho Ta biết rằng [person_a.GetTitleAsNameNoTooltip] và bọn thuộc hạ của [person_a.GetHerHis] hiểu điều đó.\n\n\"Dừng lại, dừng lại, làm ơn\", [person_a.GetFirstName] vẫy tay ngán ngẩm, \"ông đã chứng minh rõ ràng. Chúng Ta sẽ trả cho [employer.GetTitleAsName] số tiền [employer.GetHerHis] xứng đáng.\""
  laamp_base_contract_schemes.2322.desc.success_qualified_insufficient_evidence: "Trong một khoảnh khắc ngắn ngủi, căng thẳng, có vẻ như [person_a.GetFirstNameNoTooltip] cùng lũ tay sai của [person_a.GetHerHis] định phản đối tuyên bố của ta — bằng vũ lực nếu cần thiết — nhưng khi không có ai đứng ra dẫn đầu, khoảnh khắc ấy trôi qua.\n\n"Thôi... được... ngài có thể cho [employer.GetTitleAsName] hay rằng khoản #EMP 'thuế'#! của [employer.GetHerHis] sẽ được nộp đủ. Bọn ta sẽ không chống cự gì thêm nữa. Mong rằng ngài sẽ không ở đây để chứng kiến những hậu quả đổ lên đầu bọn ta vào năm tới.""
  laamp_base_contract_schemes.2322.desc.tax_status.has_cash: "Dù họ nói gì, [destination_1.GetBaseNameNoTier] chắc chắn có đủ của cải, bất chấp sự phủ nhận của các đại nhân."
  laamp_base_contract_schemes.2322.desc.tax_status.partial_cash: "Thời gian tới sẽ khó khăn với họ một thời gian, nhưng họ là dân thị trấn, sẽ tìm cách xoay xở."
  laamp_base_contract_schemes.2322.desc.tax_status.no_cash: "Dĩ nhiên, thị trấn sẽ chịu thiệt hại. Có lẽ nặng, nhưng đó là cuộc sống."
  laamp_base_contract_schemes.2322.a: "[employer.GetTitledFirstNameNoTooltip] sẽ vui sướng!"
  laamp_base_contract_schemes.2322.b: "Ta đã hoàn thành nhiệm vụ tốt."
  laamp_base_contract_schemes.2322.c: "Chà, cũng dễ dàng đấy chứ."
  laamp_base_contract_schemes.2322.d: "Những kẻ ngu ngốc, ra tay!"
  laamp_base_contract_schemes.2322.d.tt.need_troops: "Ngài cần ít nhất #V 500#! quân để dẹp loạn"
  laamp_base_contract_schemes.2322.d.tt.success: "Quân Ngài ở thành phố đã dẹp loạn"
  laamp_base_contract_schemes.2322.d.tt.failure: "Xảy ra thảm sát"
  laamp_base_contract_schemes.2322.e: "Chạy đi!"

  laamp_base_contract_schemes.2323.t: "$laamp_base_contract_schemes.2004.t$: Trả một phần"
  laamp_base_contract_schemes.2323.desc: "Dân địa phương không hoàn toàn hài lòng với phán quyết của ta, điều đó được thể hiện đủ rõ qua những tiếng xầm xì bất chợt của họ — song ta cũng nghi ngờ rằng [employer.GetTitledFirstName] có thể vui sướng cho nổi.\n\nDẫu vậy, sự thỏa hiệp thường khiến một ai đó (đôi khi là tất cả) phật ý, và [person_a.GetTitledFirstName] cùng những bè đảng của [person_a.GetHerHis] hiểu rằng đây là cách giải quyết tốt nhất mà họ có thể nhận được.\n\n"Ta... cho rằng mọi chuyện đành vậy. Tạ ơn ngài đã dành thời gian, [ROOT.Char.GetTitledFirstNameNoTooltip]", [person_a.GetFirstNameNoTooltip] càu nhàu.\n\nBàn tay của [person_a.GetHerHis|U] vươn ra để nắm lấy tay ta."
  laamp_base_contract_schemes.2323.a: "Kết luận công bằng, Ta nghĩ vậy."
  laamp_base_contract_schemes.2323.b: "Chạm vào tay Ta mà mất tay ngươi, kẻ hèn."
  laamp_base_contract_schemes.2323.a.tt.success: "[person_a.GetFirstNameNoTooltip] đón nhận tốt"
  laamp_base_contract_schemes.2323.a.tt.failure: "[person_a.GetFirstNameNoTooltip] thiếu lòng biết ơn"
  laamp_base_contract_schemes.2323.a.tt.failure.filler: "Ngài không nhận thêm phần thưởng nào"

  laamp_base_contract_schemes.2324.t: "$laamp_base_contract_schemes.2004.t$: Vô hiệu & Hủy bỏ"
  laamp_base_contract_schemes.2324.desc: "Một tràng pháo tay reo hò bùng lên từ [person_a.GetTitledFirstName], những kẻ xu nịnh của [person_a.GetHerHis], và cả những tên gia nhân hiển nhiên là đã nghe lén ngoài lỗ khóa khi ta thông báo rằng họ được miễn nộp tiền.\n\nLẽ dĩ nhiên, [employer.GetTitledFirstName|U] chẳng đời nào thích thú gì chuyện này, đồng nghĩa với việc có lẽ ta sẽ chẳng nhận được đồng xu cắc bạc nào cho toàn bộ việc này — nhưng dẫu sao thì, ngài có thể định giá sự tâng bốc bằng mức giá nào đây?"
  laamp_base_contract_schemes.2324.desc.second_option: "\n\nMột buổi tối thân mật theo sau, cho đến khi [person_a.GetFirstNameNoTooltip] kéo Ta ra để trò chuyện riêng.\n\n\"Ngươi đã làm đúng với chúng Ta, [ROOT.Char.GetTitledFirstNameNoTooltip], như Ta biết ngươi sẽ làm. Ta tôn trọng điều đó nơi một lãnh đạo. Nếu muốn, Ta có mối quan hệ ở nơi khác có thể giúp... #EMP củng cố#! danh tiếng của ngươi ở [claim_duchy.GetDefinitiveName]?\""
  laamp_base_contract_schemes.2324.a: "Hy vọng ngươi sẽ nhớ điều này, [person_a.GetFirstNameNoTooltip]."
  laamp_base_contract_schemes.2324.b: "Mong dân chúng mỉm cười với tên Ta!"

  laamp_base_contract_schemes.2331.t: "$laamp_base_contract_schemes.2004.t$: Lãnh đạo xứng đáng"
  laamp_base_contract_schemes.2331.desc: "\"[ROOT.Char.GetTitledFirstNameNoTooltip]?\"\n\nTa ngẩng đầu từ bữa tối để thấy hai lính canh đưa đến... một [hopeful.GetCulture.GetName] [hopeful.GetWomanMan] có phần quen thuộc? Ta biết [hopeful.GetHerHim] từ đâu nhỉ...\n\n\"Ta là [hopeful.GetTitledFirstName], [ROOT.Char.Custom('MistressMaster')]. Ngài từng xét xử một vụ ở thị trấn của Ta, [destination_1.GetBaseNameNoTier], vài năm trước, và Ta thấy ngài làm với phẩm cách và sự điềm tĩnh.\"\n\n\"Dù sao, doanh nghiệp của Ta sụp đổ từ lâu, và Ta tìm việc khác. Ta nghĩ ngài có thể... nhận chúng Ta...\""
  laamp_base_contract_schemes.2331.a: "Ta đồng ý. Hãy tìm cho [hopeful.GetHerHim] một cái lều!"
  laamp_base_contract_schemes.2331.b: "Ngươi thật phí công."

  laamp_base_contract_schemes.2332.t: "$laamp_base_contract_schemes.2004.t$: Máu & Xác"
  laamp_base_contract_schemes.2332.desc.quelled: "Bất chấp ý đồ bất lương của [person_a.GetTitledFirstName] cùng lũ tay sai và đám dân quân được trả tiền của [person_a.GetHerHis], binh lính của ta đến từ [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] dư sức áp đảo bất kỳ đám ô hợp [destination_1.GetAdjective] thiếu thốn trang bị nào.\n\nTrong thời gian ngắn, cuộc bạo loạn đã bị dập tắt. Có những cái chết, dĩ nhiên rồi, và thậm chí là một chút cướp bóc nhẹ, nhưng họ đã tự chuốc lấy điều này khi dám tuốt gươm nhắm vào ta. Cái xác của [aggressor.GetTitledFirstName|U] đã chứng minh điều đó.\n\nKhi tình hình giờ đây đã có phần được #EMP kiểm soát#! hơn, ta lịch sự đưa ra một lời đề nghị cứng rắn với [person_a.GetFirstNameNoTooltip] rằng hãy nộp tiền. Khoản. Thuế. Của [person_a.GetHerHis|U].\n\n#BOL Ngay lập tức#!."
  laamp_base_contract_schemes.2332.desc.massacre: "Điều xảy ra không gì khác ngoài một vụ thảm sát.\n\nDân [destination_1.GetBaseNameNoTierPossessive] gan dạ và giận dữ, nhưng không phải đối thủ của những Xóa Bạn người lang thang từ [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] khi máu sôi.\n\nKhông lâu sau, xảy ra cướp bóc. Tiếng thét vang trời, xác chất đầy, và [person_a.GetTitledFirstName], [person_b.GetTitledFirstName], [person_c.GetTitledFirstName], [person_d.GetTitledFirstName] đều bị giết.\n\nĐây không phải lệnh của [employer.GetTitledFirstName], và Ta nghi ngờ [employer.GetSheHe] sẽ trả tiền cho việc này."
  laamp_base_contract_schemes.2332.a: "Đôi khi phải làm thế."
  laamp_base_contract_schemes.2332.b: "Cái này... mất kiểm soát rồi."
  laamp_base_contract_schemes.2332.c: "#EMP Chà.#!"
  laamp_base_contract_schemes.2332.d: "Bỏ tiền sang một bên, kết thúc tuyệt vời cho vụ việc!"

  laamp_base_contract_schemes.2541.t: "$laamp_base_contract_schemes.2011.t$: [location.GetBaseNameNoTierNoTooltip]"
  laamp_base_contract_schemes.2541.desc.fluff_type.boredom: "Người dân nơi đây tỏ ra thờ ơ với nhiệm vụ của chúng Ta, mặc kệ nó đến từ [employer.GetTitleAsNameNoTooltip], với tên và biểu tượng của [employer.GetFirstNamePossessive] chỉ vừa đủ để khơi dậy sự quan tâm theo luật pháp và đạo đức.\n\nMột nơi chậm chạp, khó chịu để ghi chép, nhưng quyết tâm đòi hỏi kiên trì, và chúng Ta #EMP quyết tâm#! kiếm bạc."
  laamp_base_contract_schemes.2541.desc.fluff_type.paranoia: "Người dân [location.GetNameNoTier] phản ứng với sự xuất hiện của chúng Ta bằng sự thù địch kìm nén.\n\nHọ rõ ràng coi việc cập nhật hồ sơ [employer.GetTitledFirstNamePossessive] là #EMP dấu hiệu chắc chắn#! của điều gì đó xấu sắp tới, dù là xung đột hay thuế đầu người, và các thẩm tra của chúng Ta thường bị từ chối.\n\nDù sao, chúng Ta có việc phải làm và không một tên nông dân sợ sệt nào có thể cản đường chúng Ta."
  laamp_base_contract_schemes.2541.desc.fluff_type.happiness: "Tại [location.GetNameNoTier], cư dân chào đón chúng ta bằng những tiếng hò reo, những giỏ thức ăn, và cả sự hân hoan của một gia đình đang nghênh đón người thân trở về từ một cuộc chiến tranh xa xôi nào đó.\n\nCó vẻ như, tại những vùng đất này, danh xưng của [employer.GetTitledFirstName] đã trở thành huyền thoại trong số các thần dân của [employer.GetHerHis], đủ để bất kỳ thông điệp nào từ [employer.GetTitleAsNameNoTooltip] kính yêu của họ cũng là lý do để ăn mừng.\n\nKhông cần phải nói, họ cực kỳ hăng hái cung cấp cho phái đoàn của ta bất cứ sự trợ giúp và cứu trợ nào trong khả năng."
  laamp_base_contract_schemes.2541.desc.fluff_type.disgust: "Có vẻ [location.GetNameNoTier] không tốt với những người phục vụ [employer.GetTitledFirstName].\n\nSự xuất hiện của chúng Ta bị khinh miệt, thẩm tra bị phớt lờ hoặc chế nhạo. Dù phiền phức, nếu không khuất phục họ, chúng Ta sẽ mất bạc quý, và điều đó không thể chấp nhận."
  laamp_base_contract_schemes.2541.desc.fluff_type.admiration: "Dân chúng của [location.GetBaseNameNoTierPossessive|U] có vẻ khá ngoan ngoãn.\n\nChẳng có nỗi bận tâm nào về các khoản thuế sắp tới hay một cuộc chiến tranh mới nào ở đây, chỉ có những con người đang tiếp tục cuộc sống của họ và cam chịu số phận. Khi một vị đại diện của lãnh chúa đến gõ cửa, họ dành cho [ROOT.Char.GetHerHim] sự chú ý đúng mực.\n\nCon dấu của [employer.GetTitledFirstNamePossessive] giúp ta vượt qua hầu hết những trở ngại tủn mủn của địa phương, nhưng người dân mãn nguyện tới mức ta hầu như chẳng cần phải dùng đến nó."
  laamp_base_contract_schemes.2541.desc.fluff_type.worry: "Vì lý do nào đó, [location.GetNameNoTier] nghi ngờ ý định của [employer.GetTitledFirstName] — ít nhất đủ để hợp tác #EMP miễn cưỡng#! với chúng Ta.\n\nMệt mỏi, nhưng khả thi. Chỉ có nghĩa là lấy thông tin từ từng hộ là việc vất vả, nếu không khó chịu."
  laamp_base_contract_schemes.2541.a: "Được rồi, hãy làm cho xong."
  laamp_base_contract_schemes.2541.a.tt.success: "Cuộc khảo sát toàn diện"
  laamp_base_contract_schemes.2541.a.tt.success.tt: "+1 #P khảo sát thành công#!"
  laamp_base_contract_schemes.2541.a.tt.easier.happiness: "#WEAK Dễ hơn nhờ thái độ của dân với [liege|E]#!"
  laamp_base_contract_schemes.2541.a.tt.easier.easier_admiration: "#WEAK Dễ hơn nhờ dân tôn trọng [liege|E]#!"
  laamp_base_contract_schemes.2541.a.tt.failure: "Số liệu không chính xác"
  laamp_base_contract_schemes.2541.a.tt.failure.tt: "+1 #N khảo sát thất bại#!"
  laamp_base_contract_schemes.2541.b: "Có vẻ đây là một thành phố dễ làm giả..."
  laamp_base_contract_schemes.2541.b.tt: "$laamp_base_contract_schemes.2541.a.tt.success.tt$ #WEAK (nói dối có thể dẫn tới $label_failure_critical$)#!"
  laamp_base_contract_schemes.2541.c: "Ta nghĩ không cần nỗ lực nhiều..."
  laamp_base_contract_schemes.2541.c.tt.explicit_odds_note: "#WEAK Thử thách này tổng thể dễ hơn so với [stewardship|E]#!"
  laamp_base_contract_schemes.2541.c.tt.success: "Ngài làm giả hồ sơ dân cư thành công"
  laamp_base_contract_schemes.2541.c.tt.success.tt: "$laamp_base_contract_schemes.2541.b.tt$"
  laamp_base_contract_schemes.2541.c.tt.failure: "Lời bịa bị lộ"
  laamp_base_contract_schemes.2541.c.tt.failure.tt: "$laamp_base_contract_schemes.2541.a.tt.failure.tt$ #WEAK (nói dối có thể dẫn tới $label_failure_critical$)#!"
  laamp_base_contract_schemes.2541.d.officer_exists: "[officer.GetFirstNameNoTooltip], ngươi có thể bắt đầu."
  laamp_base_contract_schemes.2541.d.officer_unexists: "Giá mà Ta có một thủ quỹ..."
  laamp_base_contract_schemes.2541.e: "Chỉ viết linh tinh cũng được, ai quan tâm?"
  laamp_base_contract_schemes.2541.e.success: "Lời vô nghĩa có vẻ thuyết phục"
  laamp_base_contract_schemes.2541.e.success.tt: "$laamp_base_contract_schemes.2541.b.tt$"
  laamp_base_contract_schemes.2541.e.tt.employer_has_trait.trusting: "#WEAK Có lẽ vì [employer.GetTitledFirstName] là [GetTrait('trusting').GetName( GetNullCharacter )]#!"
  laamp_base_contract_schemes.2541.e.tt.employer_has_trait.lazy: "#WEAK Có lẽ vì [employer.GetTitledFirstName] là [GetTrait('lazy').GetName( GetNullCharacter )]#!"
  laamp_base_contract_schemes.2541.e.failure: "Lời nói dối bị lộ"
  laamp_base_contract_schemes.2541.e.failure.tt: "$laamp_base_contract_schemes.2541.c.tt.failure.tt$"
  laamp_base_contract_schemes.2541.e.tt.employer_has_trait.paranoid: "#WEAK Có lẽ vì [employer.GetTitledFirstName] là [GetTrait('paranoid').GetName( GetNullCharacter )]#!"
  laamp_base_contract_schemes.2541.e.tt.employer_has_trait.diligent: "#WEAK Có lẽ vì [employer.GetTitledFirstName] là [GetTrait('diligent').GetName( GetNullCharacter )]#!"

  laamp_base_contract_schemes.2542.t.crit_win: "$laamp_base_contract_schemes.2011.t$: Thành công xuất sắc"
  laamp_base_contract_schemes.2542.t.win: "$laamp_base_contract_schemes.2011.t$: Thành công!"
  laamp_base_contract_schemes.2542.t.fail: "$laamp_base_contract_schemes.2011.t$: Thất bại!"
  laamp_base_contract_schemes.2542.t.crit_fail: "$laamp_base_contract_schemes.2011.t$: Thất bại thảm hại"
  laamp_base_contract_schemes.2542.desc.intro: "Một đại diện của [employer.GetTitledFirstName] gặp chúng Ta tại [location.GetBaseNameNoTier] khi chúng Ta hoàn tất, chăm chú xem bó giấy ghi chú dày cộp mà chúng Ta thu thập được.\n\n"
  laamp_base_contract_schemes.2542.desc.method.own_skill.honest.win: ""Công việc tuyệt vời, [ROOT.Char.GetTitledFirstNameNoTooltip]! Ngay cả cái nhìn sơ sài cũng thấy sự cẩn thận và tỉ mỉ — [employer.GetTitleAsNameNoTooltip] sẽ cực kỳ vui mừng!" Ta lịch sự nghiêng đầu cảm ơn lời khen, và người hầu ra hiệu đưa phần thưởng ra."
  laamp_base_contract_schemes.2542.desc.method.quartermasters_stressed_and_wreckt.win: ""Bất kể ngài đã sai bảo kẻ nào làm việc này cho ngài, [ROOT.Char.GetTitledFirstNameNoTooltip], kẻ đó đã hoàn thành một công việc #EMP xuất sắc#!", tên gia nhân huýt sáo, "[employer.GetTitleAsNameNoTooltip] sẽ phải ngất ngây cho xem". Phía sau lưng ta, [officer.GetTitledFirstName] đang xoa xoa thái dương của [officer.GetHerHis], hiển nhiên đã kiệt sức vì công lao của [officer.GetHerHis] ngay cả khi phần thưởng của chúng ta đã được mang tới."
  laamp_base_contract_schemes.2542.desc.method.quartermasters_skill_sans_stress.win: ""Người nào ngươi nhờ làm việc này, [ROOT.Char.GetTitledFirstNameNoTooltip], họ đã làm một công việc #EMP xuất sắc#!", huýt sáo người hầu, " [employer.GetTitleAsNameNoTooltip] sẽ rất hài lòng". Bên vai Ta, [officer.GetTitledFirstName] đứng thẳng hơn, đầy tự hào im lặng khi phần thưởng được mang ra."
  laamp_base_contract_schemes.2542.desc.method.combi_own_skill_and_quartermasters.win: ""Các ngươi thật là những Bạn Bè siêng năng!" người hầu cười với [officer.GetTitledFirstName] và Ta, "hồ sơ này rất đầy đủ cho [employer.GetTitleAsNamePossessiveNoTooltip], chữ viết của các ngươi cũng tuyệt. Ta sẽ lấy phần thưởng xứng đáng ngay lập tức.""
  laamp_base_contract_schemes.2542.desc.method.own_skill.dishonest.win: ""Theo [employer.GetFaith.KnowledgeGodName], kho tàng thông tin mà ngươi khai thác thật phong phú! Và #EMP quá nhiều#! điều thật sự bất ngờ… nếu Ta không nhìn tận mắt, hẳn Ta sẽ khó tin. [employer.GetTitleAsNameNoTooltip] sẽ cực kỳ hài lòng với nỗ lực của ngươi!""
  laamp_base_contract_schemes.2542.desc.method.own_skill.guessed.win: ""Ôi trời, nếu những hồ sơ này của ngươi #EMP có gì đó#! chính xác, thì rõ ràng hiểu biết của chúng ta về vùng đất của [employer.GetTitleAsNamePossessiveNoTooltip] còn thiếu sót trầm trọng đến mức chúng ta có lẽ phải tiến hành một cuộc điều tra chi tiết hơn ngay lập tức. Việc tuyệt vời!""
  laamp_base_contract_schemes.2542.desc.method.combi_own_skill_dishonest_and_guessed.win: ""Chà, đây là những sự thật #EMP đáng kinh ngạc#! mà ngươi đã tập hợp… Ta phải thừa nhận rằng Ta không biết nhiều về điều này. Rõ ràng vùng đất của [employer.GetTitleAsNamePossessiveNoTooltip] đa dạng hơn chúng ta tưởng. Dù sao, công việc của ngươi vẫn tốt, [employer.GetTitleAsNameNoTierNoTooltip] sẽ hài lòng!""
  laamp_base_contract_schemes.2542.desc.method.mixed.win: ""Uhm, Ta thấy hồ sơ của các ngươi… có vẻ ổn. Chúng hơi rời rạc — các ngươi đã làm thế nào để tạo ra chúng? Hoặc thôi, không cần biết. [employer.GetTitleAsNameNoTooltip] sẽ vui, vậy là đủ.""
  laamp_base_contract_schemes.2542.desc.method.own_skill.honest.loss: ""Ta thấy ngươi #EMP đã cố gắng#! ít nhất cũng là vậy, nhưng có quá nhiều lỗi hiển nhiên ngay cả khi nhìn lướt cũng đủ để [employer.GetTitleAsName] không thể dùng được. Xin lỗi, ngươi sẽ không nhận được đồng nào cho công việc cẩu thả này, bất kể đã nỗ lực bao nhiêu.""
  laamp_base_contract_schemes.2542.desc.method.quartermasters_stressed_and_wreckt.loss: ""Ta… không chắc ai đã ghi chép hay hỏi cung cho ngươi, nhưng Ta phải hỏi: họ là con lai hay chỉ đơn giản là kẻ ngốc?"\n\nĐằng sau Ta, [officer.GetTitledFirstName] bật khóc."
  laamp_base_contract_schemes.2542.desc.method.quartermasters_skill_sans_stress.loss: ""Nghe này, Ta thấy ngươi đã cố gắng, nhưng bất cứ ai ngươi trả tiền để ghi chép… ngươi đã trả quá nhiều".\n\nBên vai Ta, [officer.GetTitledFirstName] khịt mũi một cách chế giễu."
  laamp_base_contract_schemes.2542.desc.method.combi_own_skill_and_quartermasters.loss: "Với vẻ nghi ngờ, quan chức xem qua hồ sơ mà [officer.GetTitledFirstName] và Ta tỉ mỉ biên soạn. Lật từng trang với sự khinh miệt tăng dần, [dummy_gender.GetSheHe] cuối cùng làm ra vẻ vứt [ROOT.Char.Custom('GetWritingMaterial')] đắt tiền xuống sàn trước khi rời đi không nói gì."
  laamp_base_contract_schemes.2542.desc.method.own_skill.dishonest.loss: "Sau khi xem qua, [dummy_gender.GetSheHe] nhìn lên: "ngươi nghĩ chúng ta là #EMP những kẻ ngu ngốc#! ở [employer.GetCapitalLocation.GetTitle.GetNameNoTier]? Những kẻ ngu mà ngươi có thể nói dối mà chúng Ta không nhận ra, dù các bản giả mạo ngu ngốc đến đâu? Ngươi sẽ không nhận được đồng nào cho trò lừa này!""
  laamp_base_contract_schemes.2542.desc.method.own_skill.guessed.loss: ""Cái gì… ngươi… ngươi #EMP rất#! rõ ràng chỉ bịa ra vô nghĩa. Cái gì đã khiến ngươi nghĩ rằng có thể lấy tiền cho việc này, ngươi điên [ROOT.Char.GetWomanMan]?"\n\n[employer.GetTitleAsNamePossessiveNoTooltip] [dummy_gender.GetWomanMan] đã đi trước khi chúng Ta kịp phản đối."
  laamp_base_contract_schemes.2542.desc.method.combi_own_skill_dishonest_and_guessed.loss: "Không mất nhiều thời gian, [dummy_gender.GetHerHim] nhận ra những #EMP sáng tạo#! của chúng Ta trong hoàn cảnh khó khăn. Sau một trận quở trách ngắn cho sự táo bạo, [employer.GetTitleAsNamePossessiveNoTooltip] [dummy_gender.GetWomanMan] rời đi."
  laamp_base_contract_schemes.2542.desc.method.mixed.loss: ""Nghe này, thật lòng mà nói, đây… một mớ hỗn độn. Ta không hiểu ngươi #EMP đã cố gắng#! làm gì ở đây, và Ta nghĩ cả hai biết ngươi không đáng nhận một đồng nào cho việc #EMP này#!", [dummy_gender.GetSheHe] ra hiệu coi thường.""
  laamp_base_contract_schemes.2542.desc.outro.win: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] nhận phần xứng đáng: một rương bạc lớn cho công sức của chúng Ta."
  laamp_base_contract_schemes.2542.desc.outro.loss: "\n\nHôm nay, [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] ra về tay trắng."
  laamp_base_contract_schemes.2542.a.crit_win: "Một chiến thắng rực rỡ!"
  laamp_base_contract_schemes.2542.a.win: "Một công việc xuất sắc."
  laamp_base_contract_schemes.2542.a.fail: "Chà, hãy để những kẻ vô ơn này đi."
  laamp_base_contract_schemes.2542.a.crit_fail: "Thật sự, đây là lãng phí thời gian của chúng ta."

  laamp_base_contract_schemes.2661.t: "$laamp_base_contract_schemes.2031.t$: Mốc địa phương"
  laamp_base_contract_schemes.2661.desc: "Tranh chấp ở [employer.GetPrimaryTitle.GetBaseNameNoTier] bắt nguồn từ một vụ kiện địa phương nhỏ: chủ nhân của chúng ta đã ngu ngốc ra phán quyết rằng một mốc tự nhiên cụ thể có ranh giới hơi khác so với truyền thống.\n\nNgay lập tức, hàng chục vụ kiện được khởi kiện bởi các địa chủ nhỏ lẻ và nông dân đặc quyền, tất cả đều có mối bất bình liên quan đến thay đổi định nghĩa này."
  laamp_base_contract_schemes.2661.desc.outro: "\n\n[employer.GetTitledFirstName|U] cố gắng nhấn mạnh rằng phần tiền công của chúng ta phụ thuộc vào việc xoa dịu tình hình một cách nhanh chóng và kín đáo."
  laamp_base_contract_schemes.2661.a: "Vấn đề này có vẻ đơn giản..."
  laamp_base_contract_schemes.2661.b: "Ta nghĩ Ta có thể giải quyết được..."
  laamp_base_contract_schemes.2661.b.tt.success: "Ngươi tìm ra một thỏa hiệp thích hợp"
  laamp_base_contract_schemes.2661.b.tt.failure: "Cuộc thảo luận đổ vỡ"
  laamp_base_contract_schemes.2661.c: "Ta nghi ngờ độ chính xác không quan trọng bằng sự rõ ràng."
  laamp_base_contract_schemes.2661.d.sacrifice_exists: "[sacrifice.GetFirstNameNoTooltip|U] sẽ ở lại giải quyết tranh chấp này."
  laamp_base_contract_schemes.2661.d.sacrifice_unexists: "Tiếc thay, Ta không có Bạn Bè nào đủ kỹ năng để đi cùng ngươi."
  laamp_base_contract_schemes.2661.d.no_valid_char: "Ngươi không có [follower|E] nào sẵn sàng với ít nhất [EmptyScope.ScriptValue('laamp_base_contract_schemes_2661_other_skill_threshold_value')|0] [intrigue|E] để tạm thời phân công cho [employer.GetFirstNamePossessive] [court|E]"
  laamp_base_contract_schemes.2661.d.tt.courtier_stays_here: "[sacrifice.GetFirstName|U] sẽ được cho [employer.GetTitledFirstNamePossessive] [court|E] mượn — [sacrifice.GetSheHe] sẽ trở về với ngươi sau khoảng từ [EmptyScope.ScriptValue('laamp_base_contract_schemes_2661_sacrifice_loan_length_min_value')|0] đến [EmptyScope.ScriptValue('laamp_base_contract_schemes_2661_sacrifice_loan_length_max_value')|0] năm"
  laamp_base_contract_schemes.2661.e.officer_exists: "[officer.GetTitledFirstNameNoTooltip|U], khu vực này có vẻ thuộc về ngươi?"
  laamp_base_contract_schemes.2661.e.officer_unexists: "Hrmph, Ta không có viên sĩ quan phù hợp để phân công."
  laamp_base_contract_schemes.2661.f: "Một cơ hội cho cuộc tranh luận sáng suốt, ngươi nói!"
  laamp_base_contract_schemes.2661.g: "Ta có thể giải quyết mọi việc nếu Ta tập trung!"

  laamp_base_contract_schemes.2662.t: "$laamp_base_contract_schemes.2031.t$: Thành công!"
  laamp_base_contract_schemes.2662.desc.resolution_type.stewardship: "Người dân tốt bụng ở [employer.GetPrimaryTitle.GetBaseNameNoTier] có nhiều điểm, một số hợp lý, một số không, nhưng #EMP không#! mạch lạc.\n\nTa không mất nhiều thời gian để xoay sở quanh các lập luận của họ, chỉ ra từng điểm một là giễu cợt, ngớ ngẩn, hoặc cả hai.\n\nChỉ với vài giờ làm việc, Ta có thể xoay chuyển tình hình cho chủ nhân, cho đến khi phán quyết mới của [employer.GetHerHis] — khiến thần dân [employer.GetHerHis] bực dọc và phiền lòng — hoàn toàn phù hợp với truyền thống."
  laamp_base_contract_schemes.2662.desc.resolution_type.secondary_skill: "Chỉ cần một chút khéo léo bằng lời nói là đủ để gieo rắc nghi ngờ trong lòng người dân tức giận ở [employer.GetPrimaryTitle.GetBaseNameNoTier].\n\nGợi ý rằng điều này được nói thay cho điều kia, câu này thực sự có nghĩa khác, đặt người này chống lại người kia, và #EMP voilà#!: mọi người đều quá mơ hồ về ai đúng và điều gì là thật để phản kháng một cách có ý nghĩa.\n\nVấn đề chưa được giải quyết hoàn toàn, nhưng đã bị pha loãng đủ để cơn giận lắng xuống và những phản đối tan biến."
  laamp_base_contract_schemes.2662.desc.resolution_type.left_sacrifice: "Bỏ lại [sacrifice.GetTitledFirstName] lo liệu công việc của [sacrifice.GetHerHis] với đám dân địa phương đang giận dữ, [employer.GetTitledFirstName] và ta đi dạo một vòng.\n\nNhững tiếng la hét và gào thét về sự bất công dần lùi lại phía sau, và khi chúng ta tiến đến một ban công nhỏ để hít thở bầu không khí về đêm, [employer.GetFirstNameNoTooltip] mỉm cười lần đầu tiên kể từ khi chúng ta tới nơi.\n\n"Thật tử tế khi ngài cho chúng ta mượn một nhà hùng biện tài ba đến thế, [ROOT.Char.GetFirstNameNoTooltip], thực sự rất tử tế. Ta sẽ đảm bảo chuyến đi trở về của [sacrifice.GetHerHis] được nhanh chóng và bình an. Thù lao của ngài đang đợi ở ngoài cổng.""
  laamp_base_contract_schemes.2662.desc.resolution_type.officer: "Một thợ săn bẩm sinh, đánh giá của [officer.GetTitledFirstNamePossessive] về vị trí mốc là nhanh, chính xác và không thể chối cãi.\n\nĐiều đó không ngăn được người dân [employer.GetPrimaryTitle.GetBaseNameNoTier] cố gắng, nhưng [officer.GetFirstNameNoTooltip] có câu trả lời cho từng người, phá vỡ các lập luận khi chúng tiếp cận [officer.GetHerHim].\n\nĐã quá trưa khi họ xong, nhưng đám đông các nguyên đơn tiềm năng cuối cùng tan biến."
  laamp_base_contract_schemes.2662.desc.resolution_type.camp_purpose: "Người dân tốt bụng ở [employer.GetPrimaryTitle.GetBaseNameNoTier] có thể là những người ủng hộ chính mình nhiệt thành, nhưng họ chưa đối mặt với toàn bộ cơn giận học thuật của [ROOT.Char.GetPrimaryTitle.GetDefinitiveName].\n\nCác cuộc thảo luận kéo dài cả ngày, điều mà Ta thấy thú vị nhưng họ dường như càng ngày càng e ngại khi giờ giấc trôi về chiều tối.\n\nChúng Ta không đi đến kết luận thực sự, nhưng cuối cùng người dân địa phương đơn giản bỏ cuộc. Câu hỏi đáp lại câu hỏi, mọi chủ đề được xem xét nhiều lần, các điểm kéo dài mãi và mãi…"
  laamp_base_contract_schemes.2662.desc.resolution_type.stress: "Sự bướng bỉnh tuyệt đối có thể không phải cách hiệu quả để giải quyết mọi vấn đề, chắc chắn Ta cảm thấy mệt mỏi khi phải hét lên với nhiều người giận dữ, nhưng nó hiệu quả.\n\nSau vài giờ la hét và áp lực, người dân [employer.GetPrimaryTitle.GetBaseNameNoTier] cuối cùng, e dè, chịu lùi lại.\n\nNhư Ta đã biết họ sẽ làm, nếu Ta thể hiện ý chí."
  laamp_base_contract_schemes.2662.desc.outro: "\n\n[employer.GetTitledFirstName] dường như chỉ biết ơn rằng mọi rắc rối đã kết thúc."
  laamp_base_contract_schemes.2662.a: "Một $game_concept_contact_list_contact$ nữa hài lòng."

  laamp_base_contract_schemes.2663.t: "$laamp_base_contract_schemes.2031.t$: Thất bại!"
  laamp_base_contract_schemes.2663.desc.stewardship: "Dường như kỹ năng hành chính của Ta… không #EMP hoàn toàn#! như Ta tưởng.\n\nTa nghĩ rằng ý kiến thông thái từ một [ROOT.Char.GetWomanMan] có uy tín sẽ giúp làm sáng tỏ mọi thứ. Thay vào đó, nỗ lực của Ta chỉ tạo ra một tiêu chuẩn #EMP thứ ba#! để tranh luận với hai tiêu chuẩn trước, khiến các bên tranh cãi phát điên."
  laamp_base_contract_schemes.2663.desc.officer: "Bất chấp nỗ lực của [officer.GetTitledFirstNamePossessive], người dân [employer.GetPrimaryTitle.GetBaseNameNoTier] nổi loạn.\n\nDường như nỗ lực của thợ săn để làm sáng tỏ ranh giới mốc chỉ tạo ra một tập hợp định nghĩa #EMP thứ ba#! để tranh luận với hai tập hợp trước."
  laamp_base_contract_schemes.2663.desc.outro: "\n\nTừ đó, có vẻ như mọi mối hận cũ ở [employer.GetPrimaryTitle.GetDeJureLiege.GetBaseNameNoTier] bị khai quật, máu xấu và yêu cầu đáng ngờ lan truyền trong dân chúng, khiến toàn bộ [employer.GetPrimaryTitle.GetDeJureLiege.GetTierAsNameNoTooltip] gần như bùng nổ.\n\nGiận dữ, [employer.GetTitledFirstName] trục xuất chúng Ta khỏi khu định cư, không một đồng cho công sức."
  laamp_base_contract_schemes.2663.a: "Chúng Ta đã cố gắng hết sức…"

  laamp_base_contract_schemes.2666.t: "$laamp_base_contract_schemes.2031.t$: Thuế kép"
  laamp_base_contract_schemes.2666.desc: "[employer.GetPrimaryTitle.GetBaseNameNoTier] đã nổi loạn từ trước khi chúng Ta đến — rõ ràng nhiều năm sai lầm từ phía chủ nhân và những người như [employer.GetHerHis] đã khiến nhiều điền trang và doanh nghiệp địa phương bị đánh thuế #EMP hai lần hoặc hơn#!, chỉ bởi các người thu khác nhau với nhiệm vụ khác nhau.\n\nSau nhiều lời phàn nàn và cố gắng giải quyết lịch sự, mọi việc cuối cùng đe dọa bùng nổ thành điều gì đó đẫm máu hơn."
  laamp_base_contract_schemes.2666.desc.outro: "$laamp_base_contract_schemes.2661.desc.outro$"
  laamp_base_contract_schemes.2666.a: "$laamp_base_contract_schemes.2661.a$"
  laamp_base_contract_schemes.2666.b: "$laamp_base_contract_schemes.2661.b$"
  laamp_base_contract_schemes.2666.b.tt.success: "$laamp_base_contract_schemes.2661.b.tt.success$"
  laamp_base_contract_schemes.2666.b.tt.failure: "$laamp_base_contract_schemes.2661.b.tt.failure$"
  laamp_base_contract_schemes.2666.c: "Nghe có vẻ đây là vấn đề về giao tiếp."
  laamp_base_contract_schemes.2666.d.sacrifice_exists: "$laamp_base_contract_schemes.2661.d.sacrifice_exists$"
  laamp_base_contract_schemes.2666.d.sacrifice_unexists: "$laamp_base_contract_schemes.2661.d.sacrifice_unexists$"
  laamp_base_contract_schemes.2666.d.no_valid_char: "Ngươi không có [follower|E] nào sẵn sàng với ít nhất [EmptyScope.ScriptValue('laamp_base_contract_schemes_2661_other_skill_threshold_value')|0] [diplomacy|E] để tạm thời phân công cho [employer.GetTitledFirstNamePossessive] [court|E]"
  laamp_base_contract_schemes.2666.d.tt.courtier_stays_here: "$laamp_base_contract_schemes.2661.d.tt.courtier_stays_here$"
  laamp_base_contract_schemes.2666.e.officer_exists: "$laamp_base_contract_schemes.2661.e.officer_exists$"
  laamp_base_contract_schemes.2666.e.officer_unexists: "$laamp_base_contract_schemes.2661.e.officer_unexists$"
  laamp_base_contract_schemes.2666.f: "Chúng ta chỉ cần vẽ lại ranh giới!"
  laamp_base_contract_schemes.2666.g: "$laamp_base_contract_schemes.2661.g$"

  laamp_base_contract_schemes.2667.t: "$laamp_base_contract_schemes.2031.t$: Thành công!"
  laamp_base_contract_schemes.2667.desc.resolution_type.stewardship: "Thuế là kế toán, và kế toán ngày nay là một nghệ thuật ít được trân trọng.\n\nVới danh sách các khoản thu địa phương được cung cấp, Ta mất hầu hết ngày để xem xét từng cáo buộc #EMP về#! đánh thuế quá mức và chứng minh rằng đây chỉ là khoản chưa nộp ở nơi khác. Người dân [employer.GetPrimaryTitle.GetBaseNameNoTier] tất nhiên càu nhàu, nhưng hầu hết cuối cùng đều chấp hành.\n\nVới những người có lý do hợp lý, việc miễn một vài khoản thuế cho năm sau khiến họ im lặng — mặc dù có những phàn nàn thầm thì từ [employer.GetTitledFirstName]."
  laamp_base_contract_schemes.2667.desc.resolution_type.secondary_skill: "Người dân [employer.GetPrimaryTitle.GetBaseNameNoTier] rõ ràng tự cho mình tinh tế, nhưng họ chưa tính đến khả năng hùng biện của một [ROOT.Char.GetHouse.GetName] [ROOT.Char.GetWomanMan].\n\nKhéo léo, Ta làm rối những phản đối nhỏ nhặt của họ, gieo rắc nghi ngờ, nhắc họ nhớ tất cả những việc tốt mà [employer.GetTitledFirstName] đã làm để giữ an toàn cho họ, đồng thời #EMP tinh tế#! nhắc họ ai nắm độc quyền sức mạnh địa phương.\n\nCuối cùng, Ta có lẽ đã tô điểm hơi quá, nhưng… khi đang vui thì…"
  laamp_base_contract_schemes.2667.desc.resolution_type.left_sacrifice: "Dẫu có chút bàng hoàng trước viễn cảnh bị bỏ lại phía sau, [sacrifice.GetTitledFirstName] vẫn an vị để bắt đầu lắng nghe một ngàn lẻ một lời phản đối của người dân [employer.GetPrimaryTitle.GetBaseNameNoTier].\n\n[employer.GetTitledFirstName|U] hàm ơn cùng ta bước đi, để mặc bọn thuộc hạ lo liệu công việc nhọc nhằn của chúng.\n\n"Thật tử tế khi ngài để lại cho chúng ta một đầy tớ đầy triển vọng như vậy — ta cam đoan với ngài rằng [sacrifice.GetSheHe] sẽ được chăm sóc chu đáo trong suốt thời gian lưu trú của [sacrifice.GetHerHis]! Giờ thì, ta tin rằng còn một vấn đề về tiền thù lao của ngài...""
  laamp_base_contract_schemes.2667.desc.resolution_type.officer: "Đội ơn trời, kỹ năng quản lý của Quân nhu quan [officer.GetFirstNamePossessive] đã chứng tỏ là đủ để giành thắng lợi hôm nay.\n\nPhải mất hàng giờ đồng hồ tranh luận gay gắt và đối chiếu sổ sách bằng miệng, nhưng [officer.GetSheHe] đã có thể tìm ra đủ các khoản nợ cũ, lệ phí chưa thanh toán, ân huệ chưa được đòi, và những thứ đại loại thế để khiến cho hầu hết các khoản phụ thu dường như chỉ là do bị ghi chép sai.\n\nNó không giải quyết được thói quen thu thuế vượt mức tồi tệ của [employer.GetTitledFirstNamePossessive] về lâu về dài, nhưng nó đã đủ để làm vừa lòng chủ nhân của chúng ta lúc này."
  laamp_base_contract_schemes.2667.desc.resolution_type.camp_purpose: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveName|U] có kinh nghiệm về bản đồ, và giữa những câu chuyện nửa hư cấu và cách phát ngôn táo bạo về #EMP phương pháp mới#!, họ hoàn toàn nhường bước cho chúng Ta.\n\nNgười dân [employer.GetPrimaryTitle.GetBaseNameNoTier] vui mừng trước khả năng chấm dứt thuế kép đến mức họ dường như sẵn sàng bỏ qua các khoản phí đã thu — điều mà Ta nhấn mạnh rõ với [employer.GetTitledFirstName] là chiến thắng mà [employer.GetSheHe] nên chấp nhận."
  laamp_base_contract_schemes.2667.desc.resolution_type.stress: "Nói chuyện với các đại địa chủ nhỏ nhặt của [employer.GetPrimaryTitle.GetBaseNameNoTier] thật sự, thật sự mệt mỏi.\n\nMệt mỏi nhưng không phải không thể, và nhờ kiên trì và quyết tâm Ta cuối cùng có thể làm phần lớn #EMP họ#! im lặng. Không phải giải pháp vĩnh viễn, nhưng khiến đa số im lặng đủ để làm hài lòng [employer.GetTitledFirstName], và cuối cùng đó là mục đích chính của chúng Ta."
  laamp_base_contract_schemes.2667.desc.outro: "\n\nChúng Ta rời thành phố vào cuối ngày, túi đầy tiền mới."
  laamp_base_contract_schemes.2667.a: "$laamp_base_contract_schemes.2662.a$"
 
  laamp_base_contract_schemes.2668.t: "$laamp_base_contract_schemes.2031.t$: Thất bại!"
  laamp_base_contract_schemes.2668.desc.stewardship: "Hóa ra, vấn đề không đơn giản như tưởng.\n\nNỗ lực giải quyết tình hình, làm dịu dân chúng và hứa hẹn bồi thường, lập tức bị phá vỡ bởi sự phủ nhận cứng rắn của [employer.GetTitledFirstNamePossessive].\n\nTừ đó, tình hình nhanh chóng vượt khỏi tầm kiểm soát của Ta, tất cả các bên hét lẫn nhau và thành phố đứng trước bờ vực hỗn loạn hoàn toàn."
  laamp_base_contract_schemes.2668.desc.officer: "Các phương pháp của Quản quân [officer.GetFirstNamePossessive] tỏ ra… không đủ.\n\n[officer.GetSheHe|U] cố gắng lập bảng kê thuế đầy đủ — đã nộp, chưa nộp và nộp thừa — nhưng bị gián đoạn từng bước bởi [employer.GetTitledFirstName] nổi giận và dân chúng thành phố thất vọng, lo lắng.\n\nChẳng bao lâu, mọi thứ chỉ còn là một trận la hét hỗn loạn, mọi dấu hiệu kiểm soát mất hết."
  laamp_base_contract_schemes.2668.desc.outro: "\n\nChúng Ta buộc phải rời [employer.GetPrimaryTitle.GetBaseNameNoTier] tay trắng."
  laamp_base_contract_schemes.2668.a: "$laamp_base_contract_schemes.2663.a$"

  laamp_base_contract_schemes.2671.t: "$laamp_base_contract_schemes.2031.t$: Tường Bị Sụp"
  laamp_base_contract_schemes.2671.desc: "Vấn đề cơ bản ở [employer.GetPrimaryTitle.GetBaseNameNoTier] hiển nhiên ngay cả từ bên ngoài cổng mục nát — tường thành trong tình trạng tệ hại.\n\nVấn đề chính dường như không phải là nhận ra điều này, mà là tìm ai thực sự sẽ #EMP trả#! để sửa chữa. Một khoản chi tốn kém mà mọi người đồng ý cần thiết, và đồng thời, là vấn đề của #EMP người khác#!."
  laamp_base_contract_schemes.2671.desc.outro: "$laamp_base_contract_schemes.2661.desc.outro$"
  laamp_base_contract_schemes.2671.a: "$laamp_base_contract_schemes.2661.a$"
  laamp_base_contract_schemes.2671.b: "$laamp_base_contract_schemes.2661.b$"
  laamp_base_contract_schemes.2671.b.tt.success: "$laamp_base_contract_schemes.2661.b.tt.success$"
  laamp_base_contract_schemes.2671.b.tt.failure: "$laamp_base_contract_schemes.2661.b.tt.failure$"
  laamp_base_contract_schemes.2671.c: "À, chỉ cần vài cánh tay khỏe thôi!"
  laamp_base_contract_schemes.2671.d.sacrifice_exists: "$laamp_base_contract_schemes.2661.d.sacrifice_exists$"
  laamp_base_contract_schemes.2671.d.sacrifice_unexists: "$laamp_base_contract_schemes.2661.d.sacrifice_unexists$"
  laamp_base_contract_schemes.2671.d.no_valid_char: "Ngươi không có [follower|E] nào sẵn sàng với ít nhất [EmptyScope.ScriptValue('laamp_base_contract_schemes_2661_other_skill_threshold_value')|0] [prowess|E] để tạm thời phân công cho [employer.GetFirstNamePossessive] [court|E]"
  laamp_base_contract_schemes.2671.d.tt.courtier_stays_here: "$laamp_base_contract_schemes.2661.d.tt.courtier_stays_here$"
  laamp_base_contract_schemes.2671.e.officer_exists: "$laamp_base_contract_schemes.2661.e.officer_exists$"
  laamp_base_contract_schemes.2671.e.officer_unexists: "$laamp_base_contract_schemes.2661.e.officer_unexists$"
  laamp_base_contract_schemes.2671.f: "Ngươi nói tường ở đâu… #EMP yếu nhất#!…"
  laamp_base_contract_schemes.2671.g: "$laamp_base_contract_schemes.2661.g$"
  laamp_base_2071_success_employer_modifier: "Tường được củng cố"
  laamp_base_2071_success_employer_modifier_desc: "Một khu định cư quan trọng gần đây đã dành thời gian củng cố tường thành."
  laamp_base_2071_failure_employer_modifier: "Sửa Chữa Hỏng"
  laamp_base_2071_failure_employer_modifier_desc: "Tường của một khu định cư quan trọng trong hạt này đã đổ nát và, tệ hơn, bị hư hại trong quá trình sửa chữa."

  laamp_base_contract_schemes.2672.t: "$laamp_base_contract_schemes.2031.t$: Thành công!"
  laamp_base_contract_schemes.2672.desc.resolution_type.stewardship: "Một vài miễn giảm nhỏ, miễn cho việc này hay việc khác, dấu [employer.GetTitleAsNamePossessiveNoTooltip] cho một số dự án, và bỗng nhiên mọi người #EMP dễ dàng hơn#! chấp nhận thêm một khoản phụ thu nhẹ để trả cho tường.\n\nKhông cần bận tâm rằng việc di chuyển thuế và gánh nặng của họ nghĩa là họ vẫn trả số tiền ban đầu, không, bây giờ quan trọng nhất là người dân [employer.GetPrimaryTitle.GetBaseNameNoTier] cảm thấy họ chơi đẹp."
  laamp_base_contract_schemes.2672.desc.resolution_type.secondary_skill: "Bị hổ thẹn và bị kích thích hành động nhờ ví dụ của Ta — cùng sự trợ giúp của vài người theo [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] — người dân tốt bụng [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] và Ta bắt tay vào sửa chữa phòng thủ.\n\nMay mắn thay, tường trông tệ hơn thực tế. Tiến triển tốt, chỉ mất vài ngày lao động dễ dàng bù đắp bằng một khoản nhỏ."
  laamp_base_contract_schemes.2672.desc.resolution_type.left_sacrifice: "Dường như đã mệt, [sacrifice.GetTitledFirstName] đang cố chỉ đạo người dân [employer.GetPrimaryTitle.GetBaseNameNoTier] khi [employer.GetTitledFirstName] và Ta rời phòng.\n\n"Đừng lo, [ROOT.Char.GetTitledFirstNameNoTooltip], chúng Ta sẽ chăm sóc tốt [sacrifice.GetWomanMan] của ngươi và gửi [sacrifice.GetHerHim] về nguyên vẹn."\n\nÀ, chỉ đặt vài viên đá lên nhau. Khó gì đâu? Ta vui vẻ nhận tiền công và chuẩn bị rời đi."
  laamp_base_contract_schemes.2672.desc.resolution_type.officer: "[officer.GetTiledFirstNamePossessive|U] vị trí như $head_porter_camp_officer$ của Ta"
  laamp_base_contract_schemes.2672.desc.resolution_type.camp_purpose: "Thành phố [employer.GetPrimaryTitle.GetBaseNameNoTier] cháy.\n\nÀ, hầu hết thôi. Những phần mà người theo Ta chở về trại [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] thì #EMP an toàn#! dưới sự quản lý của Ta.\n\nCó phải Ta làm điều không chính đáng khi cướp một khu định cư tìm đến Ta nhờ giúp đỡ chỉ vì Ta có thể? Có lẽ không.\n\nNhưng ai dại dột thì kệ họ, trả tiền cho người không quen biết hoàn toàn…"
  laamp_base_contract_schemes.2672.desc.resolution_type.stress: "Ép người dân [employer.GetPrimaryTitle.GetBaseNameNoTier] tuân theo đòi hỏi phải kết hợp la hét, khích lệ và làm họ hổ thẹn.\n\nCông việc mệt mỏi, nhưng từng đại địa chủ dần theo luật và cam chịu trả phần của mình. Có thể không phải giải pháp thanh lịch, nhưng nếu hiệu quả thì ổn."
  laamp_base_contract_schemes.2672.desc.outro: "\n\n[employer.GetTitledFirstName] hài lòng với giải pháp, vui vẻ trao [employer.GetHerHis] tiền."
  laamp_base_contract_schemes.2672.a: "$laamp_base_contract_schemes.2662.a$"
  laamp_base_contract_schemes.2672.a.city_sacked: "Người mua cẩn thận."
 
  laamp_base_contract_schemes.2673.t: "$laamp_base_contract_schemes.2031.t$: Thất bại!"
  laamp_base_contract_schemes.2673.desc.stewardship: "Kế hoạch của Ta có vẻ hợp lý, chia đều chi phí cho dân rồi điều chỉnh theo giàu nghèo, nhưng các đại địa chủ phản ứng kinh hoàng.\n\nMỗi người đều tin rằng họ trả quá nhiều, dù cho đó là lợi ích chung, bất kể giàu nghèo hay địa vị."
  laamp_base_contract_schemes.2673.desc.officer: "Có lẽ [officer.GetTitledFirstName] không phải là một $head_porter_camp_officer$ quá đỗi xuất sắc như ta hằng tưởng tượng.\n\nChưa đầy nửa giờ trôi qua kể từ khi [officer.GetHerHis] đề xuất các kế hoạch xây lại những bức tường thì người dân [employer.GetPrimaryTitle.GetBaseNameNoTier] đã lao vào cắn xé lẫn nhau, la ó, gào thét, đá đấm, cắn xé, hoàn toàn #EMP tuyệt vọng#! để trốn tránh nhiệm vụ đang đợi trước mắt."
  laamp_base_contract_schemes.2673.desc.outro: "\n\n[employer.GetTitledFirstName] tức giận không thèm nói với Ta sau vụ thất bại này.\n\nChúng Ta bị đuổi khỏi thành phố, không một đồng tiền công."
  laamp_base_contract_schemes.2673.a: "$laamp_base_contract_schemes.2663.a$"

  laamp_base_contract_schemes.2676.t: "$laamp_base_contract_schemes.2031.t$: Đồng Cỏ Thuận Lợi"
  laamp_base_contract_schemes.2676.desc: "Các con phố [employer.GetPrimaryTitle.GetBaseNameNoTierPossessive] sôi sục với tin đồn và bê bối — một vấn đề phức tạp liên quan hôn nhân, thừa kế và kinh doanh sai lầm đã khiến một phần lớn đất cỏ tốt nhất cho chăn ngựa rơi vào tay kẻ ngốc không tiền, không kỹ năng.\n\nDo đó, các đại địa chủ địa phương đe dọa sẽ xé xác lẫn nhau về cách chia đất (và ai được chia)."
  laamp_base_contract_schemes.2676.desc.outro: "$laamp_base_contract_schemes.2661.desc.outro$"
  laamp_base_contract_schemes.2676.a: "$laamp_base_contract_schemes.2661.a$"
  laamp_base_contract_schemes.2676.b: "$laamp_base_contract_schemes.2661.b$"
  laamp_base_contract_schemes.2676.b.tt.success: "$laamp_base_contract_schemes.2661.b.tt.success$"
  laamp_base_contract_schemes.2676.b.tt.failure: "$laamp_base_contract_schemes.2661.b.tt.failure$"
  laamp_base_contract_schemes.2676.c: "Đồng cỏ, à? Đây là lĩnh vực của Ta."
  laamp_base_contract_schemes.2676.d.sacrifice_exists: "$laamp_base_contract_schemes.2661.d.sacrifice_exists$"
  laamp_base_contract_schemes.2676.d.sacrifice_unexists: "$laamp_base_contract_schemes.2661.d.sacrifice_unexists$"
  laamp_base_contract_schemes.2676.d.no_valid_char: "Ngươi không có [follower|E] nào sẵn sàng với ít nhất [EmptyScope.ScriptValue('laamp_base_contract_schemes_2661_other_skill_threshold_value')|0] [martial|E] để tạm thời phân công cho [employer.GetFirstNamePossessive] [court|E]"
  laamp_base_contract_schemes.2676.d.tt.courtier_stays_here: "$laamp_base_contract_schemes.2661.d.tt.courtier_stays_here$"
  laamp_base_contract_schemes.2676.e.officer_exists: "$laamp_base_contract_schemes.2661.e.officer_exists$"
  laamp_base_contract_schemes.2676.e.officer_unexists: "$laamp_base_contract_schemes.2661.e.officer_unexists$"
  laamp_base_contract_schemes.2676.f: "À, chúng Ta biết một chút về ngựa."
  laamp_base_contract_schemes.2676.g: "$laamp_base_contract_schemes.2661.g$"
  laamp_base_2076_success_employer_modifier: "Ngựa Tốt"
  laamp_base_2076_success_employer_modifier_desc: "Ngựa trong hạt này khiến mọi người ghen tị."
  laamp_base_2076_failure_employer_modifier: "Ngựa Yếu"
  laamp_base_2076_failure_employer_modifier_desc: "Hạt này, vì lý do nào đó, sản xuất ngựa cực tệ."

  laamp_base_contract_schemes.2677.t: "$laamp_base_contract_schemes.2031.t$: Thành công!"
  laamp_base_contract_schemes.2677.desc.resolution_type.stewardship: "Một lần nữa, kỹ năng gia đình nhà [ROOT.Char.GetHouse.GetName] chiến thắng!\n\nDù khoe mẽ, các đại địa chủ chỉ muốn phần của họ, và trong buổi chiều Ta chia đất công bằng đến mức họ chỉ #EMP hơi#! thất vọng.\n\nNgười chủ ngốc cũng được bồi thường, khiến cãi vã lắng xuống."
  laamp_base_contract_schemes.2677.desc.resolution_type.secondary_skill: "Ta đủ kinh nghiệm chiến tranh để biết đất tốt không luôn nuôi ngựa tốt, và ngựa tốt không cần đất tốt.\n\nBình tĩnh, cẩn thận và #EMP hơi#! khinh khỉnh, Ta giải thích sai lầm cho các đại địa chủ [employer.GetPrimaryTitle.GetBaseNameNoTierPossessive]. Họ… miễn cưỡng lắng nghe, nhưng lập luận tốt luôn thắng."
  laamp_base_contract_schemes.2677.desc.resolution_type.left_sacrifice: "[employer.GetTitledFirstName|U] và Ta để [sacrifice.GetTitledFirstName] cho các đại địa chủ chăm sóc. Khi chúng Ta rời đi, tiếng la hét bắt đầu — lớn nhanh hơn chúng Ta đi.\n\n"Không như Ta tưởng", [employer.GetFirstNameNoTooltip] gật, "nhưng không thể trách sự kỹ lưỡng của ngươi. Ngươi có chắc [sacrifice.GetSheHe] ổn không?"\n\nTa nhướng mày.\n\n"À, tất nhiên, Ta nói gì nhỉ", [employer.GetTitleAsNameNoTooltip] lắp bắp, "Ta lại tự rơi vào rắc rối. Đây, tiền công cho việc cho mượn [sacrifice.GetWomanMan] khéo léo.""
  laamp_base_contract_schemes.2677.desc.resolution_type.officer: "Sự am tường về loài ngựa của [officer.GetTitledFirstNamePossessive|U] đã phục vụ chúng ta vô cùng đắc lực trong hôm nay.\n\nĐược thỏa sức phô diễn trước đám dân địa phương và được yêu cầu đàm đạo về một trong những niềm đam mê to lớn của [officer.GetHerHis], [officer.GetWomanMan] đó đã có thể từ từ áp đảo họ bằng sự thẹn thùng về cách họ nuôi dưỡng thú cưỡi và súc vật thồ hàng, đi sâu vào từng chi tiết tỉ mỉ về các phương pháp nuôi dưỡng những con vật tốt hơn, khỏe mạnh hơn thay vì chỉ đơn thuần cãi vã nhau để giành bãi chăn thả tốt nhất.\n\nĐến cuối cùng, bọn họ chỉ còn biết hổ thẹn gật gù hùa theo từng nhịp điệu và những lời phê bình sắc sảo, mọi cuộc tranh cãi đều chìm vào dĩ vãng."
  laamp_base_contract_schemes.2677.desc.resolution_type.camp_purpose: "Dĩ nhiên, trong công việc [ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessive], ta học về đồng cỏ tốt.\n\nVới kỹ năng, chúng Ta gạt bỏ lo lắng của dân địa phương và chia đất công bằng.\n\nNhắc đến nhóm lính đánh thuê gần đó phục vụ thành phố của [employer.Custom('MistressMaster')] cũng không hại gì."
  laamp_base_contract_schemes.2677.desc.resolution_type.stress: "Với tư duy công bằng, lao động chăm chỉ và tất cả sự kiên trì mà [ROOT.Char.GetWomanMan] nhà [ROOT.Char.GetHouse.GetName] có thể, mọi thứ khả thi.\n\nPhải mất nhiều giờ tranh luận căng thẳng để chia đất công bằng. Công bằng với mọi người trừ kẻ ngốc, nhưng kẻ ngốc được bồi thường nhiều hơn nếu Ta không ở đây.\n\nQuan trọng là các đại địa chủ đủ hài lòng — hoặc chỉ hơi bực mình — với đề xuất của Ta."
  laamp_base_contract_schemes.2677.desc.outro: "\n\n[employer.GetTitledFirstName|U] dường như rất hài lòng với giải pháp, vui vẻ trao [employer.GetHerHis] tiền."
  laamp_base_contract_schemes.2677.a: "$laamp_base_contract_schemes.2662.a$"
 
  laamp_base_contract_schemes.2678.t: "$laamp_base_contract_schemes.2031.t$: Thất bại!"
  laamp_base_contract_schemes.2678.desc.stewardship: "Sau nhiều giờ thương lượng, dường như chúng Ta còn xa thỏa thuận hơn lúc bắt đầu.\n\nMỗi đại địa chủ nhỏ nhặt, tham quyền ở [employer.GetPrimaryTitle.GetBaseNameNoTier] đều muốn #EMP phần#! đất giá trị hơi trên trung bình và sẵn sàng la hét để lấy."
  laamp_base_contract_schemes.2678.desc.officer: "Ta đã ngỡ rằng [officer.GetTitledFirstName] nhẽ ra phải #EMP giỏi#! về những vấn đề như thế này.\n\nThan ôi, hoặc là [officer.GetSheHe] biết quá nhiều còn người dân [employer.GetPrimaryTitle.GetBaseNameNoTier] lại quan tâm quá ít, hoặc là [officer.GetFirstNameNoTooltip] biết quá ít mà lũ dân địa phương lại bận tâm quá nhiều.\n\nNhững cuộc cãi vã, những lời buộc tội, và những cú đập bàn giận dữ theo sau đó."
  laamp_base_contract_schemes.2678.desc.outro: "Đến tối, [employer.GetTitledFirstName] rất bực, thẳng tay đuổi chúng Ta, hoàn toàn thất vọng vì tiến triển kém.\n\nHôm nay sẽ không có lương cho chúng Ta."
  laamp_base_contract_schemes.2678.a: "$laamp_base_contract_schemes.2663.a$"

 # Something something "everyone's favourite part of the video"...
  laamp_base_contract_schemes.2681.t: "$laamp_base_contract_schemes.2031.t$: Những Đường Trên Bản Đồ"
  laamp_base_contract_schemes.2681.desc: "Chúng Ta đến [employer.GetPrimaryTitle.GetBaseNameNoTier] mà không có lễ nghi nào — người dân địa phương đang khủng hoảng vì một bản đồ cổ được khai quật, và nó #EMP hoàn toàn#! vẽ lại ranh giới giữa hai khu định cư vệ tinh của thành phố.\n\nNếu không sớm tìm ra giải pháp, tình huống tốt nhất là thuế bị gián đoạn, còn tệ nhất có thể là một cuộc xung đột nhỏ trong vùng.$laamp_base_contract_schemes.2661.desc.outro$"
  laamp_base_contract_schemes.2681.a: "$laamp_base_contract_schemes.2661.a$"
  laamp_base_contract_schemes.2681.b: "$laamp_base_contract_schemes.2661.b$"
  laamp_base_contract_schemes.2681.b.tt.success: "$laamp_base_contract_schemes.2661.b.tt.success$"
  laamp_base_contract_schemes.2681.b.tt.failure: "$laamp_base_contract_schemes.2661.b.tt.failure$"
  laamp_base_contract_schemes.2681.c: "Để Ta xem xét bản đồ này của ngươi."
  laamp_base_contract_schemes.2681.d.sacrifice_exists: "$laamp_base_contract_schemes.2661.d.sacrifice_exists$"
  laamp_base_contract_schemes.2681.d.sacrifice_unexists: "$laamp_base_contract_schemes.2661.d.sacrifice_unexists$"
  laamp_base_contract_schemes.2681.d.no_valid_char: "Ngươi không có [follower|E] nào sẵn sàng với ít nhất [EmptyScope.ScriptValue('laamp_base_contract_schemes_2661_other_skill_threshold_value')|0] [learning|E] để tạm thời phân công cho [employer.GetFirstNamePossessive] [court|E]"
  laamp_base_contract_schemes.2681.d.tt.courtier_stays_here: "$laamp_base_contract_schemes.2661.d.tt.courtier_stays_here$"
  laamp_base_contract_schemes.2681.e.officer_exists: "$laamp_base_contract_schemes.2661.e.officer_exists$"
  laamp_base_contract_schemes.2681.e.officer_unexists: "$laamp_base_contract_schemes.2661.e.officer_unexists$"
  laamp_base_contract_schemes.2681.f: "Chỉ là một #EMP bản đồ?!#! Chỉ có vậy thôi sao?"
  laamp_base_contract_schemes.2681.g: "$laamp_base_contract_schemes.2661.g$"

  laamp_base_contract_schemes.2682.t: "$laamp_base_contract_schemes.2031.t$: Thành Công!"
  laamp_base_contract_schemes.2682.desc.resolution_type.stewardship: "May mắn thay, Ta có con mắt tinh tường [ROOT.Char.Custom('SenseObserve_SenseEye')], và không mất nhiều thời gian để chỉ ra một tá cách mà bản đồ này rõ ràng là giả mạo."
  laamp_base_contract_schemes.2682.desc.resolution_type.secondary_skill: "Bản đồ trông khá thật — nếu ngươi là một #EMP kẻ ngốc#!! Ta, tuy nhiên, là một [ROOT.Char.GetWomanMan] uyên bác, và chứng minh nguồn gốc giả mạo của nó đơn giản như kéo một chiếc áo choàng."
  laamp_base_contract_schemes.2682.desc.resolution_type.left_sacrifice: "Khi [sacrifice.GetTitledFirstName] mệt mỏi bắt đầu quá trình dài #EMP mệt mỏi#! lắng nghe mọi bên tranh luận để tìm ra sự thật, [employer.GetTitledFirstName] kéo Ta sang một bên.\n\n"Xuất sắc, [ROOT.Char.GetTitledFirstNameNoTooltip], thật khó tin là ngươi có một [sacrifice.GetWomanMan] uyên bác để cho mượn cho thành phố khiêm tốn của ta!"\n\nỞ phía sau, [sacrifice.GetFirstNameNoTooltip] làm im một giọng hét lên về quyền thừa kế.\n\n"Ta không nghi ngờ gì rằng cuối cùng chúng ta sẽ giải quyết được chuyện này. Lương của ngươi đang chờ ngoài cửa.""
  laamp_base_contract_schemes.2682.desc.resolution_type.officer: "Kỹ năng nói của [officer.GetTitledFirstNamePossessive|U] giúp [officer.GetSheHe] kích thích người dân #EMP vừa đủ#! về tính xác thực tiềm năng của bản đồ. [officer.GetSheHe|U] hướng dẫn họ lần lượt sang chủ đề này, chủ đề khác, cho đến khi cả phòng đều lên án đây là bản giả mạo rõ ràng và giải thích lý do."
  laamp_base_contract_schemes.2682.desc.resolution_type.camp_purpose: "Ta… có lẽ hơi quá lời khi giải thích mảnh giấy mỏng manh kia liên quan đến quyền thừa kế đất thật đến mức quan trọng.\n\nSau khoảng một giờ, người dân nhìn Ta ngây ra, mặt đầy xấu hổ, bối rối, và đôi lúc kinh ngạc.\n\nVấn đề nhỏ nhặt về 'tài liệu cổ' của họ bị bỏ qua, và một sự im lặng khó xử bao trùm căn phòng.\n\n[employer.GetTitledFirstName|U] lặng lẽ đưa Ta ra ngoài và, có vẻ hài lòng, trao tiền thưởng."
  laamp_base_contract_schemes.2682.desc.resolution_type.stress: "Sau nhiều giờ tranh luận, buộc tội, và thỉnh thoảng đe dọa, Ta cuối cùng nhận diện một số dấu hiệu quan trọng cho thấy bản đồ có khả năng là giả mạo — và vì thế vô giá trị."
  laamp_base_contract_schemes.2682.desc.outro: "\n\nChắc chắn, ban đầu có tranh luận, nhưng khi bằng chứng dồn dập, cuối cùng một kẻ đồng lõa #EMP gục ngã#! dưới áp lực và chỉ tay vào một đại địa chủ địa phương là thủ phạm.\n\nChỉ cần bắt giữ đơn giản, [employer.GetPrimaryTitle.GetBaseNameNoTier] có chuyện mới để bàn tán, trong khi các khu định cư vệ tinh phải lùi lại.\n\nKhi căng thẳng được hạ nhiệt và mọi thứ dần trở lại bình thường, [employer.GetTitledFirstName] vui vẻ trao tiền cho chúng Ta."
  laamp_base_contract_schemes.2682.a: "$laamp_base_contract_schemes.2662.a$"
 
  laamp_base_contract_schemes.2683.t: "$laamp_base_contract_schemes.2031.t$: Thất Bại!"
  laamp_base_contract_schemes.2683.desc.stewardship: "Ta tưởng việc nghi ngờ tính xác thực của bản đồ là quyết định đúng, nhưng tiếc thay, điều đó chỉ gây thêm rắc rối: người dân [employer.GetPrimaryTitle.GetBaseNameNoTier] bắt đầu chia phe trong tranh chấp vốn nhỏ nhặt trước đây.\n\nMột nửa tin lời Ta thuyết phục, cho rằng #EMP ai đó#! phạm sai lầm nghiêm trọng, nửa còn lại cho rằng lập luận của Ta hoàn toàn vô lý. Đêm xuống, cả thị trấn hỗn loạn."
  laamp_base_contract_schemes.2683.desc.officer: "Ta hy vọng tài năng ăn nói của [officer.GetTitledFirstNamePossessive] đủ làm người dân bình tĩnh hơn, để lý trí chiếm ưu thế.\n\nThay vào đó, người dân [employer.GetPrimaryTitle.GetBaseNameNoTier] chia rẽ vì nỗ lực giảm căng thẳng của [officer.GetHerHis], ngay cả các đại địa chủ giàu có cũng chia phe theo các thị trấn phụ thuộc."
  laamp_base_contract_schemes.2683.desc.outro: "\n\nBản đồ chắc chắn bị quên đi, nhưng người dân tranh cãi #EMP nhiều hơn#! chứ không ít đi.\n\n[employer.GetTitledFirstName] lạnh lùng thông báo rằng lương của chúng Ta sẽ không được trả."
  laamp_base_contract_schemes.2683.a: "$laamp_base_contract_schemes.2663.a$"

  laamp_base_contract_schemes.2781.t: "$laamp_base_contract_schemes.2044.t$: [ROOT.Char.GetCurrentLocation.GetTitle.GetBaseNameNoTierNoTooltip]"
  laamp_base_contract_schemes.2781.desc.surroundings.alley_day: "Dạo quanh các con phố của khu định cư — tỏ vẻ bận rộn và tự phụ vì thất vọng, tất nhiên — chúng Ta cuối cùng gặp người dân bất hạnh [local_char.GetWomanMan] được bầu quản lý thuế."
  laamp_base_contract_schemes.2781.desc.surroundings.alley_night: "Trời đã khuya khi chúng ta vào đến khu định cư, nhưng ta chẳng muốn nán lại đây lâu hơn mức cần thiết. Bọn ta tìm thấy [local_char.GetWomanMan] địa phương xui xẻo được bầu ra để quản lý đồ cống nạp ngay lúc [local_char.GetSheHe] đang đóng cửa hiệu để nghỉ ngơi trong đêm."
  laamp_base_contract_schemes.2781.desc.surroundings.tavern: "Có lẽ chẳng có gì đáng ngạc nhiên, bọn ta tìm thấy [local_char.GetWomanMan] địa phương xui xẻo được bầu ra để quản lý đồ cống nạp trong một quán rượu, đang uống để mượn rượu giải sầu nhằm quên đi những muộn phiền của [local_char.GetHerHis] trước sự xuất hiện của chúng ta."
  laamp_base_contract_schemes.2781.desc.surroundings.docks: "Diện mạo nghiêm trang, chúng Ta đi về phía bến cảng. Như dự đoán, chúng Ta tìm thấy người dân bất hạnh [local_char.GetWomanMan] đang la hét thủy thủ và chỉ đạo hàng ngày."
  laamp_base_contract_schemes.2781.desc.surroundings.condemned_village: "Dịch bệnh hoành hành, khu định cư tồi tệ. Bịt mũi, chúng Ta vẫn tìm thấy người dân bất hạnh được bầu quản lý thuế."
  laamp_base_contract_schemes.2781.desc.local_mood.disapproval: "\"Hrmph,\" [local_char.GetSheHe] càu nhàu, \"có vẻ ngươi tưởng mình thông minh, đến sớm thế này. Chúng Ta không ấn tượng và sẽ không trả phí cho sự chậm trễ của ngươi.\""
  laamp_base_contract_schemes.2781.desc.local_mood.anger: "\"Ngươi thật trơ trẽn!\" [local_char.GetSheHe] gầm gừ, \"đến sớm thế này! Chúng Ta trả thuế như mọi nơi, nhưng cần thông báo hợp lý trước khi ngươi đến bòn rút.\""
  laamp_base_contract_schemes.2781.desc.local_mood.admiration: "\"Ah! Chắc chắn là [task_contract.GetEmployer.GetTitleAsNamePossessiveNoTooltip] [ROOT.Char.GetWomanMan]\", [local_char.GetSheHe] thốt, \"ta nhận ra từ cử chỉ trung thực! Ngươi đến #EMP sớm#! hơn dự kiến, nhưng không sao, chúng Ta đã sẵn sàng.\""
  laamp_base_contract_schemes.2781.desc.local_mood.dismissal: "\"Ồ, ngươi đến sớm thế?\" [local_char.GetSheHe] nhếch mép, \"tốt, theo ta. Chúng Ta đã chuẩn bị #EMP thuế#! của ngươi, đúng như hướng dẫn, không thêm một đồng nào.\""
  laamp_base_contract_schemes.2781.desc.local_mood.thinking: "\"Ngươi… là [task_contract.GetEmployer.GetTitleAsNamePossessiveNoTooltip] [ROOT.Char.GetWomanMan]? Sớm thế sao?\" [local_char.GetSheHe] thắc mắc, \"Ta không nghĩ chúng Ta đợi ngươi sớm như vậy… nhưng hình như ngươi đáng tin…\""
  laamp_base_contract_schemes.2781.desc.outro: "\n\nThêm một kẻ ngốc nữa giữa chúng ta và tiền công."
  laamp_base_contract_schemes.2781.a: "Lừa [local_char.GetHerHim] bằng con số."
  laamp_base_contract_schemes.2781.stewardship.tt.success: "Dĩ nhiên, tất cả đều hợp lệ"
  laamp_base_contract_schemes.2781.stewardship.tt.failure: "Ngươi đang nói cái quái gì?"
  laamp_base_contract_schemes.2781.b: "Ta trình bày con dấu '[task_contract.GetEmployer.GetTitledFirstNamePossessiveNoTooltip]'."
  laamp_base_contract_schemes.2781.intrigue.tt.success: "Trông có vẻ thật"
  laamp_base_contract_schemes.2781.intrigue.tt.failure: "Rõ ràng đây là giả mạo!"
  laamp_base_contract_schemes.2781.c.bard_exists: "[bard.GetTitledFirstNameNoTooltip], dùng tài hùng biện của ngươi!"
  laamp_base_contract_schemes.2781.c.bard_dnae_exist: "Giá mà có kẻ mồm vàng…"
  laamp_base_contract_schemes.2781.d: "Thoát khỏi cuộc gặp càng nhanh càng tốt."
  laamp_base_contract_schemes.2781.tt.boost_difficulty.stewardship: "Thử thách [stewardship|E] tiếp theo sẽ khó hơn"
  laamp_base_contract_schemes.2781.tt.boost_difficulty.intrigue: "Thử thách [intrigue|E] tiếp theo sẽ khó hơn"
  laamp_base_contract_schemes.2781.tt.boost_difficulty.bard: "Thử thách năng lực tiếp theo của [bard.GetFirstNamePossessive] sẽ khó hơn"
  laamp_base_contract_schemes.2781.tt.boost_difficulty.stress: "Lựa chọn này sẽ tốn nhiều [stress|E] hơn lần sau"
  laamp_base_contract_schemes.2781.tt.progress_towards_success: "#P +1#! điểm tiến tới hoàn thành [task_contract|E]"
  laamp_base_contract_schemes.2781.tt.current_total.sub_t1: "#TUT Ngươi có [task_contract.MakeScope.Var('wins_tally').GetValue] điểm, trong tổng số [task_contract.MakeScope.Var('win_t1_threshold').GetValue] để đạt $label_success_qualified$#!"
  laamp_base_contract_schemes.2781.tt.current_total.sub_t2: "#TUT Ngươi có [task_contract.MakeScope.Var('wins_tally').GetValue] điểm, trong tổng số [task_contract.MakeScope.Var('win_t2_threshold').GetValue] để đạt $label_success_standard$ #WEAK (hiện đã đạt $label_success_qualified$)#!#!"
  laamp_base_contract_schemes.2781.tt.current_total.sub_t3: "#TUT Ngươi có [task_contract.MakeScope.Var('wins_tally').GetValue] điểm, trong tổng số [task_contract.MakeScope.Var('win_t3_threshold').GetValue] để đạt $label_success_critical$ #WEAK (hiện đã đạt Thành Công)#!#!"
  laamp_base_contract_schemes.2781.tt.progress_towards_failure: "#N +1#! điểm tiến tới thất bại [task_contract|E]"
  laamp_base_contract_schemes.2781.tt.contract_failed: "#N Hợp đồng thất bại#!"

  laamp_base_contract_schemes.2782.t: "$laamp_base_contract_schemes.2044.t$: Thành Công!"
  laamp_base_contract_schemes.2782.desc.success_critical: "Ha! Một cuộc phiêu lưu tuyệt vời — một [task_contract.GetEmployer.GetTitleAsNameNoTooltip] tham lam, một [ROOT.Char.GetWomanMan] lịch lãm với con mắt cơ hội, và hàng chục người đóng thuế ngây thơ có lẽ ước gì họ học chữ tốt hơn.\n\nVới kho bạc trại đầy ắp, chúng Ta suy nghĩ về công việc tiếp theo."
  laamp_base_contract_schemes.2782.desc.success_standard: "Đến giờ, chúng Ta #EMP đã kiếm#! khá ổn từ chuyến phiêu lưu nhỏ trong thế giới hành chính.\n\nĐủ tiền của [task_contract.GetEmployer.GetTitledFirstNamePossessive] trong xe thuế giả mạo (có phù hiệu vẽ vụng về hai bên) để thỏa lòng tham của hầu hết [ROOT.Char.GetWomenMen].\n\nNhưng… Ta vẫn tự hỏi liệu còn chút máu nào có thể vắt ra từ đá này không…"
  laamp_base_contract_schemes.2782.desc.success_qualified: "Chúng Ta đã thu được một khoản kha khá, nhưng vẫn còn nhiều tiền từ người dân ngớ ngẩn của [task_contract.GetEmployer.GetTitledFirstNamePossessive].\n\nNếu khởi hành ngay, chúng Ta có thể đi trước người thu thuế — nhưng nếu bị bắt, chúng Ta sẽ phải bỏ chạy và mất hết."
  laamp_base_contract_schemes.2782.desc.nothing_yet: "Chà, chúng ta đã có một khởi đầu suôn sẻ nhưng chừng này chỉ là một phần mọn so với những gì chúng ta hy vọng có thể thu về.\n\nNếu chúng ta thực sự muốn chiếm đoạt phần của cải bất chính của chúng ta từ tài sản của [task_contract.GetEmployer.GetTitledFirstNamePossessive], chúng ta phải tiếp tục tiến bước và thuyết phục thêm nhiều thần dân của [task_contract.GetEmployer.GetHerHis] tin vào... uy tín của chúng ta."
  laamp_base_contract_schemes.2782.a: "Ai nói [ROOT.Char.Custom('GetLaampDescribeTypeSelfArticle')] [ROOT.Char.Custom('GetLaampDescribeTypeSelf')] cần đất mới kiếm tiền!"
  laamp_base_contract_schemes.2782.b: "Không gan, không vinh quang, không vàng! Tiến lên!"
  laamp_base_contract_schemes.2782.b.tt.travel_onwards: "Ngươi tiếp tục cố gắng cho kết quả tốt hơn cho [task_contract|E]"
  laamp_base_contract_schemes.2782.c: "An toàn thôi, tạm dừng ở đây."
  laamp_base_contract_schemes.2782.d: "Được rồi, đây là tốt nhất hiện nay."
  laamp_base_contract_schemes.2782.d.tt: "@alert_icon! #alert_trial Lựa chọn này buộc phải thực hiện vì ngươi đã đạt kết quả tốt nhất với số lần thất bại hiện có#!"

  laamp_base_contract_schemes.2783.t: "$laamp_base_contract_schemes.2044.t$: Thất Bại!"
  laamp_base_contract_schemes.2783.desc.lost: "Chết tiệt, nguyền rủa toàn bộ dân cư [ROOT.Char.GetCurrentLocation.GetTitle.GetBaseNameNoTier]! Sự nghi ngờ vô lý và sự khó chịu của họ với người lạ đã phá hỏng mọi thứ.\n\nTa chỉ muốn kiếm #EMP một chút#! tiền thêm, nhưng bọn ngốc bắt đầu nghi ngờ, rồi hoảng loạn, và cuối cùng tóm lấy xe của chúng Ta trong cơn cuồng nộ của dân làng.\n\nTa còn lại chẳng có gì."
  laamp_base_contract_schemes.2783.desc.losing: "Suýt nữa thôi — có lẽ là quá gần.\n\nTa không ngờ người dân [ROOT.Char.GetCurrentLocation.GetTitle.GetBaseNameNoTier] lại thiếu lòng tin đến thế. Ta cũng không chắc họ nghe được điều gì khiến họ nghi ngờ, nhưng họ bắt đầu đặt câu hỏi, và chẳng mấy chốc Ta hết lời giải thích.\n\nDù sao, ít nhất chúng Ta cũng tránh bị bắt với số chiến lợi phẩm hiện có, dù không kiếm thêm được gì từ họ."
  laamp_base_contract_schemes.2783.a: "Nhưng kế hoạch của Ta hoàn hảo mà!"
  laamp_base_contract_schemes.2783.b: "Chỉ là một thất bại nhỏ, tiến lên!"
  laamp_base_contract_schemes.2783.b.tt.travel_onwards: "$laamp_base_contract_schemes.2782.b.tt.travel_onwards$"
  laamp_base_contract_schemes.2783.c: "Đồng bạc tốt hơn là vàng chết."
  laamp_base_contract_schemes.2783.d: "Thôi… dừng ở đây đi…"
  laamp_base_contract_schemes.2783.d.tt: "$laamp_base_contract_schemes.2782.d.tt$"

  laamp_base_contract_schemes.3301.t: "$laamp_base_contract_schemes.3004.t$: [current_barony.GetNameNoTierNoTooltip]"
  laamp_base_contract_schemes.3301.desc.scandal_affair: "Có lẽ chúng Ta không cần bước vào triều đình [current_char.GetTitledFirstNamePossessive] mà làm ai đó ngạc nhiên, vì có vẻ không cần: dân địa phương đang xôn xao với tin đồn ngoại tình.\n\nChẳng ai #EMP quá#! để ý, nhưng một cuộc tình ngoài ý muốn cũng đủ thêm chút gia vị vào đời sống nhạt nhẽo của [current_barony.GetNameNoTier].\n\nMay mắn thay, với bao lời đồn thổi, việc khai thác thông tin từ Bạn Bè và quan nhỏ trở nên khá dễ dàng."
  laamp_base_contract_schemes.3301.desc.scandal_torture: "Ngay cả khi không vào được triều đình [current_char.GetTitledFirstNamePossessive], mọi chuyện ồn ào bên trong vẫn là chủ đề bàn tán ở [current_barony.GetNameNoTier].\n\nCó vẻ một đại địa chủ địa phương, muốn thu hồi nợ hay trả thù, đã lạm dụng tra tấn kẻ thù và để lại chỉ một xác người tàn tật.\n\n[current_char.GetTitleAsNameNoTooltip] được yêu cầu can thiệp và trừng phạt, nhưng vì lý do nào đó lại miễn cưỡng.\n\nĐáng tiếc cho nạn nhân, nhưng là bầu không khí #EMP hoàn hảo#! để khai thác tin đồn mà không bị nghi ngờ."
  laamp_base_contract_schemes.3301.desc.scandal_manslaughter: "Có máu trên đường phố [current_barony.GetNameNoTier], và dù [current_char.GetTitledFirstName] không cầm dao, lời nói của [current_char.GetHerHis] đã khởi sự mọi chuyện.\n\nMột viên quan địa phương — thực hiện theo đúng chỉ định của [current_char.GetTitleAsNameNoTooltip] — đã rất bị ghét. Một quan lại nhỏ khi thi hành luật, vốn được đánh giá công minh, đã bị giết không lâu trước đây trong một tội ác bốc đồng.\n\nVới bao lời buộc tội và đồn thổi, việc moi ra bí mật từ dân làng trở nên dễ dàng."
  laamp_base_contract_schemes.3301.desc.scandal_loan: "Những tiếng lầm bầm và than vãn tràn ngập [current_barony.GetNameNoTier], lời phàn nàn của những người bị ảnh hưởng nhẹ.\n\nMột chủ nợ địa phương đang đòi các khoản nợ khắp thị trấn, khiến dân địa phương khó chịu hơn cả thuế bất ngờ. Tệ hơn, việc này được [current_char.GetTitledFirstName] ngầm chấp thuận — với nhiều người, đó là sự phản bội không thể tha thứ.\n\nKhông phải môi trường tốt nhất để hỏi dò, nhưng cũng không tệ để khai thác Bạn Bè hay dân làng bất mãn."
  laamp_base_contract_schemes.3301.desc.scandal_bribery: "Mọi lời bàn tán ở [current_barony.GetNameNoTier] đều về một quan chức trong triều [current_char.GetTitledFirstNamePossessive] nhận #EMP một khoản hối lộ khổng lồ#! trái ngược.\n\nMột chút tham nhũng ở đây đó không hiếm, nhiều viên chức coi đó là phần lương phụ, nhưng có giới hạn.\n\nỞ đây, giới hạn ấy đã bị phá vỡ.\n\nTin xấu cho [current_char.GetTitleAsNameNoTooltip], nhưng tuyệt vời cho những ai muốn khai thác dân làng để lấy thông tin."
  laamp_base_contract_schemes.3301.desc.rumblings_war: "Khắp các ngõ ngách ở [current_barony.GetNameNoTier] đang ồn ào với những lời thì thầm về chiến tranh và máu chảy, với rất nhiều người dân địa phương hoàn toàn #EMP đinh ninh#! rằng [current_char.GetTitledFirstName] đang mưu tính một cuộc xung đột — chẳng bao lâu nữa.\n\nLẽ dĩ nhiên, chiến tranh chẳng phải chuyện hiếm hoi gì, điều này lại càng khiến cho những kẻ đưa chuyện và bọn phao tin đồn nhảm dễ dàng gieo rắc nỗi sợ hãi khi chẳng có mấy thú vui nào khác để giết thời gian trong những đêm dài.\n\nDù là thật hay không, nó cũng tạo ra vô số những con người lắm mồm #EMP háo hức#! ra mặt để chia sẻ quan điểm của họ cùng những gì họ nghe được với một kẻ xa lạ tháo vát."
  laamp_base_contract_schemes.3301.desc.rumblings_murder: "Dẫu chẳng một ai có thể nói một cách chắc nịch, từ ngữ luôn chực chờ trên đầu môi của mọi người ở [current_barony.GetNameNoTier] lúc này là #EMP mưu sát#!.\n\nMột số kẻ đồn rằng đó chính là [current_char.GetTitledFirstName] [current_char.GetHerselfHimself], sự kiên nhẫn đã cạn kiệt khiến cho [current_char.GetHerHim] thèm khát cái kết yểu mệnh của một kẻ ngốc nghếch đáng thương nào đó. Những kẻ khác lại kháo nhau rằng âm mưu bị đồn đại kia thực chất là nhằm #EMP chống lại#! [current_char.GetTitleAsNameNoTooltip], hoặc đơn thuần chỉ là màn đấu đá chính trị của vài gã cận thần tàn nhẫn hơn của [current_char.GetHerHis] với nhau.\n\nBất luận sự thật là gì, hiện tại thì tất cả mọi người đều là những kẻ hóng hớt say sưa.\n\nQuả là tiện lợi."
  laamp_base_contract_schemes.3301.desc.rumblings_affair: "Tin đồn lan nhanh như lửa cháy qua thành phố cổ, và chẳng gì lan nhanh hơn tin đồn [current_char.GetLadyLord|U] của [current_barony.GetNameNoTier] ngoại tình.\n\nTất nhiên, chẳng ai dám nói công khai — nhưng sau vài ly rượu, và sau những bóng dáng bí ẩn quanh triều đình…\n\nDân làng đề phòng, nhưng vẫn dễ bị khai thác bằng câu hỏi chiến thuật."
  laamp_base_contract_schemes.3301.desc.mundane_feast: "Mọi sự náo nhiệt ở [current_barony.GetNameNoTier], vào lúc này, chỉ hướng tới duy nhất một yến tiệc nhỏ sắp tới mà [current_char.GetTitledFirstName] đang dự định tổ chức.\n\nĐáng buồn thay, sự kiện này có vẻ #EMP chỉ#! đủ long trọng để thu hút sự tò mò của mọi tên phao tin nhảm rẻ tiền, những kẻ lê la hóng hớt, cùng lũ vô lại thích nghe trộm khắp thành phố.\n\nMọi câu chuyện đều tập trung vào việc ai có khả năng được mời và ai thì không, những món ngon nào sẽ được dọn lên, những trò giải trí nào sẽ được [current_char.GetTitleAsNameNoTooltip] bày ra... không hoàn toàn là một môi trường lý tưởng nhất để thăm dò những thông tin #EMP mang tính chiến lược#! hơn."
  laamp_base_contract_schemes.3301.desc.mundane_nothing: "Đáng tiếc, hiện có ít tin tức quan trọng ở [current_barony.GetNameNoTier].\n\nDĩ nhiên, có vài drama nhỏ của dân thường, nhưng không có gì đặc biệt hấp dẫn — điều này khiến người lạ hỏi han trở nên hiếm hoi.\n\nDù sao, chúng ta phải kiếm bất cứ thông tin nào có thể."
  laamp_base_contract_schemes.3301.tt.plus_one_success: "#P +1#! thông tin thu thập"
  laamp_base_contract_schemes.3301.a: "Lắng nghe xem…"
  laamp_base_contract_schemes.3301.a.tt.success: "Một số thông tin hữu ích"
  laamp_base_contract_schemes.3301.a.tt.failure: "[intrigue_duellist.GetFirstNameNoTooltip] ngăn cản Ngài"
  laamp_base_contract_schemes.3301.b: "Đến lúc dùng sức quyến rũ!"
  laamp_base_contract_schemes.3301.b.tt.success: "Những điều họ không nên nói"
  laamp_base_contract_schemes.3301.b.tt.failure: "[diplomacy_duellist.GetFirstNameNoTooltip] giữ im lặng triều đình"
  laamp_base_contract_schemes.3301.c: "Hỏi bất cứ ai có thể và rời đi."
  laamp_base_contract_schemes.3301.d: "Đừng đùa với [current_char.GetFirstNameNoTooltip]."
  laamp_base_contract_schemes.3301.d.tt.skip_the_attempt: "Ngươi không thu thập được #N thông tin#!"

  laamp_base_contract_schemes.3302.t: "$laamp_base_contract_schemes.3004.t$: Thành Công!"
  laamp_base_contract_schemes.3302.desc.intro: "Đặc vụ [employer.GetTitledFirstNamePossessive] gặp chúng Ta ở [current_barony.GetNameNoTier], háo hức mang báo cáo về cho [employer.GetLadyLord].\n\n"
  laamp_base_contract_schemes.3302.desc.win.critical: "Và chúng Ta có #EMP một bản báo cáo cực kỳ chi tiết#!, tổng hợp mọi giao dịch, tin đồn và bí mật từ [destination_1.GetNameNoTier] đến [destination_2.GetNameNoTier] — đủ để [employer.GetFirstNamePossessiveNoTooltip] spymaster bận rộn nhiều tháng.\n\nHọ biết ơn công sức của chúng Ta,"
  laamp_base_contract_schemes.3302.desc.win.standard: "May mắn, chúng Ta thu thập đủ thông tin để thuyết phục họ. Có thể chưa toàn bộ, nhưng đủ để [employer.GetFirstNamePossessiveNoTooltip] spymaster có việc làm, và nhận được sự hài lòng từ liên lạc.\n\nHọ biết ơn công sức của chúng Ta,"
  laamp_base_contract_schemes.3302.desc.win.qualified: "Chỉ… không nhiều. Tin đồn và lời nghe được còn ít, [employer.GetFirstNamePossessiveNoTooltip] spymaster có ít dữ liệu để sử dụng. Ít, nhưng không #EMP hoàn toàn không có#!.\n\nMột cuộc trò chuyện ngắn sau đó,"
  laamp_base_contract_schemes.3302.desc.outro: "các gián điệp [employer.GetTitleAsNamePossessiveNoTooltip] mang trả tiền thỏa thuận.\n\nTất nhiên, một cách kín đáo."
  laamp_base_contract_schemes.3302.a: "Đổi lấy vài lời thì quá hời!"
 
  laamp_base_contract_schemes.3303.t: "$laamp_base_contract_schemes.3004.t$: Thất Bại!"
  laamp_base_contract_schemes.3303.desc: "Các mật thám của [employer.GetTitledFirstNamePossessive] gặp chúng ta tại [current_barony.GetNameNoTier], nhưng chỉ trong chốc lát — ngay khi những lời bào chữa của bọn ta về việc hoàn toàn chẳng có thông tin đáng tin cậy nào để chia sẻ bắt đầu được thốt ra, những tên gián điệp đã nhận ra rằng chúng ta đã thất bại.\n\nBọn ta nhanh chóng bị cảnh cáo rằng đừng làm lãng phí thời gian của [employer.GetTitleAsNamePossessiveNoTooltip] bằng những trò hề của chúng ta, cũng đừng tìm kiếm sự trợ giúp của [employer.GetHerHis] trong tương lai nữa, trước khi chúng biến mất một cách mau lẹ.\n\nCó lẽ hoạt động do thám không phải là một trò chơi thích hợp cho những [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] như chúng ta..."
  laamp_base_contract_schemes.3303.a: "[employer.GetSheHe|U] giao dịch tin đồn nhưng có kho trống."
 
  laamp_base_contract_schemes.3661.t: "$laamp_base_contract_schemes.3031.t$: [destination_1.GetBaseNameNoTierNoTooltip]"
  laamp_base_contract_schemes.3661.desc.intro: "[destination_1.GetBaseNameNoTier] có vẻ dễ chịu — tiếc phải đến trong hoàn cảnh này.\n\nGần chạng vạng, Ta và vài người theo dõi đợi trong bóng tối gần mục tiêu:"
  laamp_base_contract_schemes.3661.desc.business.fallback: "một xưởng nhỏ nhưng phát đạt, bảng hiệu sơn mới treo ngoài cửa báo hiệu bảo trợ."
  laamp_base_contract_schemes.3661.desc.business.inn_exterior: "một quán trọ ven đường, ngay ngoài thị trấn, rõ ràng là địa phương ưa thích. Hiện tại."
  laamp_base_contract_schemes.3661.desc.business.relaxing_room: "một nhà phố khá giả, có lẽ là nơi ở thứ hai của một quý tộc."
  laamp_base_contract_schemes.3661.desc.business.winery: "một hầm rượu đầy thùng vang ngon. Chúng Ta đến đây để phá thùng và rượu."
  laamp_base_contract_schemes.3661.desc.business.tavern: "một quán rượu nhộn nhịp, khách cười nói đông. Một quán rượu cần phải thiêu."
  laamp_base_contract_schemes.3661.desc.business.docks: "một kho lớn bên bến cảng, chất đầy củi."
  laamp_base_contract_schemes.3661.desc.business.kennels: "một chuồng chó hôi hám, đầy chó sủa."
  laamp_base_contract_schemes.3661.desc.business.shrine: "một [target.GetFaith.HouseOfWorship] nhỏ ven đường, thuộc tín ngưỡng [target.GetFaith.GetAdjective], rõ ràng vừa được xây dựng cẩn thận."
  laamp_base_contract_schemes.3661.desc.business.mews: "một khu nuôi chim săn đã an toàn cho buổi tối."
  laamp_base_contract_schemes.3661.desc.business.bridge: "một cầu thu phí, tháp đá nhìn ra khắp dòng sông."
  laamp_base_contract_schemes.3661.desc.business.market: "một quảng trường nhỏ, bao quanh bởi nhà cửa san sát."
  laamp_base_contract_schemes.3661.desc.outro: "\n\n[employer.GetTitledFirstName] chẳng thấy cần thiết phải giải thích liệu nạn nhân của [employer.GetHerHis], [target.GetTitledFirstName], là chủ sở hữu của nơi này, có lợi ích ở đó, hay đơn thuần chỉ là có đôi chút tình cảm với nó.\n\nNhưng cũng sẽ sớm thôi, điều đó cũng chẳng còn quan trọng nữa."
  laamp_base_contract_schemes.3661.tt.duel_success: "Hoàn thành nhiệm vụ"
  laamp_base_contract_schemes.3661.tt.duel_failure: "Hợp đồng thất bại"
  laamp_base_contract_schemes.3661.tt.stealth_maintained_no_gallowsbait: "#TUT Phương pháp này sẽ #P giữ ẩn danh#!, giảm [GetTrait('gallowsbait').GetName( GetNullCharacter )]#!"
  laamp_base_contract_schemes.3661.tt.stealth_foregone_extra_gallowsbait: "#TUT Phương pháp này sẽ #N lộ danh tính#!, tăng [GetTrait('gallowsbait').GetName( GetNullCharacter )] — nhưng #P tổng thể dễ hơn#!#!"
  laamp_base_contract_schemes.3661.a: "Im lặng: rời đi khi lửa bùng."
  laamp_base_contract_schemes.3661.b: "Tất cả theo cặp. Bao phủ lối ra, giữ bình tĩnh."
  laamp_base_contract_schemes.3661.c: "Hai người phía sau, bốn hai bên, tiến."
  laamp_base_contract_schemes.3661.d: "Rìu sẵn sàng, chuẩn bị #EMP đẫm máu!#!"
  laamp_base_contract_schemes.3661.e: "Hi vọng tất cả sẵn sàng cho #EMP tấn công!#!"
  laamp_base_contract_schemes.3661.f: "[officer.GetFirstNameNoTooltip], có gì độc không?"
  laamp_base_contract_schemes.3661.g: "[officer.GetFirstNameNoTooltip], có thể lẻn vào mà không bị phát hiện không?"
  laamp_base_contract_schemes.3661.h: "[officer.GetFirstNameNoTooltip], bắn mũi tên lửa cháy chỗ đó được không?"
  laamp_base_contract_schemes.3661.i.steal_dogs: "[officer.GetFirstNameNoTooltip], mang mấy con chó đến đây!"
  laamp_base_contract_schemes.3661.i.dog_on_birds: "[officer.GetFirstNameNoTooltip], thả chó săn vào."
  laamp_base_contract_schemes.3661.i.poison_barrels: "[officer.GetFirstNameNoTooltip], có gì để… #EMP làm hỏng#! thùng rượu không?"
  laamp_base_contract_schemes.3661.j: "[officer.GetFirstNameNoTooltip], chỗ nào dễ cháy nhất?"
  laamp_base_contract_schemes.3661.k: "[officer.GetFirstNameNoTooltip], dẫn đội bên kia vào."
  laamp_base_contract_schemes.3661.l: "[officer.GetFirstNameNoTooltip], chuẩn bị đội."
  laamp_base_contract_schemes.3661.m: "[officer.GetFirstNameNoTooltip], đi đường kia — chúng
  laamp_base_contract_schemes.3661.n: "[officer.GetFirstNameNoTooltip], chúng ta có nghĩ là có thể đầu độc tất cả không?"
  laamp_base_contract_schemes.3661.o: "Giá mà Ta có một sĩ quan phù hợp cho việc này..."
  laamp_base_contract_schemes.3661.o.lacking_officers.forager_kenneler_cook: "Ngài không có cả [GetCourtPositionType('chief_forager_camp_officer').GetName()], [GetCourtPositionType('kennelperson_camp_officer').GetName()] hay [GetCourtPositionType('camp_cook_camp_officer').GetName()]"
  laamp_base_contract_schemes.3661.o.lacking_officers.thief_huntsman_engineer: "Ngài không có cả [GetCourtPositionType('master_thief_camp_officer').GetName()], [GetCourtPositionType('huntperson_camp_officer').GetName()] hay [GetCourtPositionType('chief_engineer_camp_officer').GetName()]"
  laamp_base_contract_schemes.3661.o.lacking_officers.moa_mos_man_haggler: "Ngài không có cả [GetCourtPositionType('master_of_arms_camp_officer').GetName()], [GetCourtPositionType('master_of_spoils_camp_officer').GetName()] hay [GetCourtPositionType('person_haggler_camp_officer').GetName()]"
  laamp_base_contract_schemes.3661.p: "Ta... không nghĩ mình muốn làm việc này..."
  laamp_base_3661_stole_dogs_modifier: "Đẳng cấp hàng đầu"
  laamp_base_3661_stole_dogs_modifier_desc: "Nhân vật này có quá, quá, #EMP quá nhiều#! những con chó săn tuyệt hảo trong tay."

  laamp_base_contract_schemes.3662.t: "$laamp_base_contract_schemes.3031.t$: Thành công!"
  laamp_base_contract_schemes.3662.desc.intro: "Một kế hoạch tốt đem lại chiến thắng nhanh chóng, và"
  laamp_base_contract_schemes.3662.desc.business.fallback: "xác cháy của xưởng nhỏ là minh chứng rõ ràng cho điều đó."
  laamp_base_contract_schemes.3662.desc.business.inn_exterior: "xác cháy của quán trọ chứng minh rõ ràng điều này."
  laamp_base_contract_schemes.3662.desc.business.relaxing_room: "tàn tích khói của nhà phố chứng minh sự đúng đắn của câu ngạn ngữ cũ."
  laamp_base_contract_schemes.3662.desc.business.winery: "nhà máy rượu bị phá hoại là minh chứng rõ ràng."
  laamp_base_contract_schemes.3662.desc.business.tavern: "tàn tích cháy của quán rượu là minh chứng đơn giản cho điều đó."
  laamp_base_contract_schemes.3662.desc.business.docks: "mặt tiền kho hàng vẫn cháy, từ từ đổ xuống nước, chỉ chứng minh thêm điều đó."
  laamp_base_contract_schemes.3662.desc.business.kennels: "sự im lặng hoàn toàn của trại chó cũ là xác nhận cho điều đó."
  laamp_base_contract_schemes.3662.desc.business.shrine: "ngôi [target.GetFaith.HouseOfWorship] bị tàn phá cháy lười biếng ven đường cung cấp minh chứng rõ ràng."
  laamp_base_contract_schemes.3662.desc.business.mews: "mews giờ yên tĩnh là minh chứng im lặng cho điều đó."
  laamp_base_contract_schemes.3662.desc.business.bridge: "tháp cầu thu phí đang cháy là minh chứng không thể chối cãi."
  laamp_base_contract_schemes.3662.desc.business.market: "cảnh lặng lẽ trong chợ chứng minh điều đó một cách không thể tranh cãi."
  laamp_base_contract_schemes.3662.desc.method.intrigue: "Nhanh chóng và lén lút — chưa kể không có sự chống đối tỉnh táo — Ta và các thuộc hạ nhanh chóng châm nhiều đám cháy và rút lui. Ngọn lửa làm việc của nó, và chúng Ta chỉ phải quay lại vào sáng hôm sau để kiểm tra kết quả.\n\nNhìn vào mọi thứ,"
  laamp_base_contract_schemes.3662.desc.method.martial: "Cần dạ dày mạnh để tàn sát trong máu lạnh, nhưng lời hứa bạc khiến nhiều việc trở nên dễ chịu. Sau khi dọn sạch bên trong, chúng Ta chất xác lên, châm lửa và chạy vào đêm.\n\nKhông có nhân chứng dám can thiệp, và"
  laamp_base_contract_schemes.3662.desc.method.prowess: "Dẫn đầu trận chiến, Ta và các thuộc hạ nhanh chóng xử lý những kẻ không may bên trong, chém không thương xót. Chúng Ta để xác ngay chỗ ngã, quăng những cây đuốc vào những điểm khả nghi và chất vật liệu dễ cháy lên đám lửa.\n\nCông việc bẩn thỉu, nhưng hiệu quả.\n\n"
  laamp_base_contract_schemes.3662.desc.method.forager: "Một khi đã vào được bên trong, [officer.GetTitledFirstName] không mất nhiều thời gian để hoàn tất công việc bẩn thỉu của [officer.GetHerHis] — một lượng nhỏ chất độc cũng đủ gây hậu quả nghiêm trọng, và có vẻ như [officer.GetSheHe] đã mang theo khá nhiều thứ đó. Có lẽ, ta nên lo ngại về điều này, nhưng đó là vấn đề cho một ngày khác.\n\nDẫu sao, nếu [target.GetTitledFirstName] đang trông mong thu thập được thứ gì đó ở đây, thì [target.GetSheHe] sẽ phải đón nhận một sự kinh ngạc chẳng mấy tốt đẹp, mặc dù"
  laamp_base_contract_schemes.3662.desc.method.thief: "Nhanh nhẹn tựa một con mèo, [officer.GetTitledFirstName] len lỏi đường vào qua một cặp cửa chớp lỏng lẻo ở tầng trên. Trong vài phút, mọi thứ bên trong đều yên ắng — cho đến khi một cánh cửa mở ra đón chúng ta và [officer.GetFirstNameNoTooltip] bước ra, một tay nắm chặt con dao vấy máu. Có vẻ như [officer.GetSheHe] không gặp #EMP quá#! nhiều rắc rối bên trong tòa nhà.\n\nViệc phóng hỏa sau đó chỉ là trò trẻ con, đồng nghĩa với việc"
  laamp_base_contract_schemes.3662.desc.method.huntperson: "Đường ngắm của [officer.GetTitledFirstNamePossessive] cực kỳ chuẩn xác và mũi tên của [officer.GetHerHis] cắm phập vào một xà gồ bằng gỗ khô nứt nẻ tít trên cao của hệ kèo mái, tránh xa bất kỳ nơi nào dễ bị dập tắt. Bọn ta lẳng lặng chờ đợi, và quan sát, cầu mong ngọn lửa từ từ bốc lên cho đến khi mùi khói bắt đầu cuộn sâu vào khoang mũi.\n\nĐã đủ tốt để rút lui, chắc mẩm với nhận thức rằng"
  laamp_base_contract_schemes.3662.desc.method.kenneler.poison_barrels: "[officer.GetTitledFirstName] dường như chẳng gặp khó khăn gì trong việc #EMP vấy bẩn#! hết thùng rượu hảo hạng này đến thùng rượu hảo hạng khác, trong khi những người còn lại trong bọn ta lo việc cảnh giới hoặc khuân vác thứ này thứ nọ theo chỉ đạo của [officer.GetHerHis]. Công việc này... nói chung là cực kỳ vui vẻ, đến cuối cùng, vài tên thuộc hạ của ta đã tự thưởng cho mình một thùng rượu trước khi chúng ta phá hỏng nó. Vậy cũng tốt.\n\nLẽ dĩ nhiên, ban đầu điều này sẽ không quá rõ ràng — vì vậy chúng ta đã để lại một chiếc cốc mới toanh bên ngoài với một chút bất ngờ nổi lềnh bềnh trong đó cùng một vệt tích dẫn ngược lại nguồn gốc của nó.\n\n"
  laamp_base_contract_schemes.3662.desc.method.kenneler.steal_dogs: "[officer.GetTitledFirstName] lẻn vào trại chó, mọi thứ... gần như im lặng hoàn toàn. Hơn mười phút sau, khi chúng Ta bắt đầu mất hy vọng và định châm lửa, [officer.GetWomanMan] xuất hiện với #EMP hàng tá#! chó săn trên dây xích.\n\nViệc [officer.GetSheHe] khiến chúng im lặng, thở hổn hển như trò chơi lớn, thật kỳ diệu. Mỗi người chúng Ta cầm càng nhiều dây xích càng tốt và chạy vào đêm —"
  laamp_base_contract_schemes.3662.desc.method.kenneler.dog_on_birds: "Các phương pháp của [officer.GetTitledFirstNamePossessive] tuy ồn ào, nhưng lại hiệu quả. Giữ chặt vài con chó săn đang gầm gừ, cắn xé, [officer.GetSheHe] biến mất vào trong chuồng chim. Trong một hai phút, không gian bừng tỉnh bởi những tiếng sủa, tiếng cắn và xé xác, những con chim ưng chết hàng loạt bên trong, trong khi một vài con may mắn chạy thoát ra ngoài qua cánh cửa đang mở.\n\nVào lúc $kennelperson_camp_officer$ của ta xuất hiện, bọn ta cũng vừa chuẩn bị sẵn sàng để đưa [officer.GetHerHim] rời đi, khi mà đám dân địa phương bị kinh động đang #EMP ào ạt#! lao về phía chúng ta. Vài mũi tên được bắn ra chuẩn xác đã tiễn bọn chúng, và chúng ta trốn chạy vào màn đêm.\n\n"
  laamp_base_contract_schemes.3662.desc.method.engineer: "[officer.GetTitledFirstName] nhanh chóng nhận ra nhiều điểm yếu trong cấu trúc, ra lệnh chúng Ta châm nhựa và đốt từng chỗ [officer.GetHerHis] chọn. Tòa nhà cháy trong vài phút, và chúng Ta rút lui trước tiếng la hét đầu tiên.\n\n"
  laamp_base_contract_schemes.3662.desc.method.haggler: "Giữa cuộc tấn công bất ngờ từ cả binh lính Ta và nhóm [officer.GetTitledFirstNamePossessive], mỗi bên đánh từ hướng khác nhau, những người phòng thủ ngạc nhiên không có cơ hội. Chúng Ta chém hết, xong đốt nơi họ đang đứng.\n\n"
  laamp_base_contract_schemes.3662.desc.method.armsman: "$laamp_base_contract_schemes.3662.desc.method.haggler$"
  laamp_base_contract_schemes.3662.desc.method.spoiler: "$laamp_base_contract_schemes.3662.desc.method.haggler$"
  laamp_base_contract_schemes.3662.desc.method.cook: "$laamp_base_contract_schemes.3662.desc.method.forager$"
  laamp_base_contract_schemes.3662.desc.outro: "[employer.GetTitledFirstName] chắc chắn sẽ vui vẻ trao trả tiền công."
  laamp_base_contract_schemes.3662.a: "Chiến thắng xứng đáng, túi đầy!"
  laamp_base_contract_schemes.3662.b: "Hah, dù sao cũng để họ biết là Ta làm!"

  laamp_base_contract_schemes.3663.t: "$laamp_base_contract_schemes.3031.t$: Thất bại!"
  laamp_base_contract_schemes.3663.desc.intro: "Người ta nói không kế hoạch nào sống sót khi gặp kẻ thù. Của chúng ta chắc chắn không: hiện tại,"
  laamp_base_contract_schemes.3663.desc.business.fallback: "xưởng nhỏ vẫn đứng đó."
  laamp_base_contract_schemes.3663.desc.business.inn_exterior: "quán trọ vẫn còn nguyên vẹn."
  laamp_base_contract_schemes.3663.desc.business.relaxing_room: "nhà phố vẫn sừng sững."
  laamp_base_contract_schemes.3663.desc.business.winery: "kho rượu vẫn nguyên vẹn."
  laamp_base_contract_schemes.3663.desc.business.tavern: "quán rượu vẫn hoạt động tốt."
  laamp_base_contract_schemes.3663.desc.business.docks: "kho bên bến cảng vẫn chưa cháy."
  laamp_base_contract_schemes.3663.desc.business.kennels: "trại chó vẫn đầy tiếng sủa như thường."
  laamp_base_contract_schemes.3663.desc.business.shrine: "ngôi [target.GetFaith.HouseOfWorship] vẫn nằm yên ven đường."
  laamp_base_contract_schemes.3663.desc.business.mews: "không khí vẫn vang vọng tiếng kêu của chim săn trong mews."
  laamp_base_contract_schemes.3663.desc.business.bridge: "cầu thu phí vẫn thu tiền khách qua lại đều đặn."
  laamp_base_contract_schemes.3663.desc.business.market: "chợ vẫn tấp nập, nhộn nhịp."
  laamp_base_contract_schemes.3663.desc.method.intrigue: "Cố gắng châm lửa lén bị nhóm say rượu đi qua phát hiện, họ nổi khùng, gây ồn ào đến mức Ta và thuộc hạ phải bỏ chạy.\n\n"
  laamp_base_contract_schemes.3663.desc.method.martial: "Giữ bình tĩnh, Ta nói với thuộc hạ. Khi vũ khí lấp lánh khiến chúng Ta bị phát hiện sớm hơn, lẽ ra không phải vấn đề. Tiếng hô hoảng loạn vang lên, và dân địa phương xuất hiện với vũ khí tạm thời.\n\nSố lượng quan trọng, nhưng chuẩn bị cũng vậy — hoặc lẽ ra nên thế. Khi nhận ra chỉ còn một nửa nhóm vẫn theo Ta, Ta buộc phải rút lui."
  laamp_base_contract_schemes.3663.desc.method.prowess: "Dù cố gắng phá hủy nơi này, chúng Ta không thể vào cửa mà không gây ồn ào. Khi tiếp cận, tiếng hô hoảng loạn vang lên từ xung quanh — với số lượng ít, chúng Ta chọn rút lui thay vì ở lại và bị treo cổ như bọn cướp.\n\n"
 #
  laamp_base_contract_schemes.3663.desc.method.forager: "[officer.GetTitledFirstName] chẳng nán lại quá lâu bên trong nơi đó, [officer.GetSheHe] chỉ đơn thuần rải độc của [officer.GetHerHis] một cách phóng khoáng vào các khu vực trọng điểm rồi rời đi. Tự tin vào sự thành công của mình, chúng ta rút lui, chỉ để quay lại hiện trường vụ án vào sáng hôm sau nhằm kiểm chứng tác phẩm của mình.\n\nThật xui xẻo, dẫu cho vụ đột nhập đã bị phát giác, [officer.GetFirstNameNoTooltip] #EMP dường như#! đã dùng sai loại thảo mộc! Giờ thì chúng đã đề cao cảnh giác mà ta lại xôi hỏng bỏng không."
  laamp_base_contract_schemes.3663.desc.method.thief: "Việc xâm nhập vào bên trong không phải là vấn đề đối với [officer.GetTitledFirstName] — nhưng làm sao để không bị phát hiện thì lại khó hơn. Chỉ vài khoảnh khắc sau khi [officer.GetHerHis] vào bên trong, một tiếng hô hoảng loạn vang lên, rồi tiếng vật lộn.\n\nChẳng mấy chốc, một cánh cửa bật mở và [officer.GetFirstNameNoTooltip] lao ra ngoài. Kéo [officer.GetWomanMan] lên bằng một tay, chúng Ta chạy trước khi sự ồn ào và tiếng hô #EMP DỪNG LẠI! KẺ TRỘM#! kêu cứu tới."
  laamp_base_contract_schemes.3663.desc.method.huntperson: "Không những mũi tên của [officer.GetTitledFirstNamePossessive] đi chệch mục tiêu, thứ chết tiệt đó lại va vào một cánh cửa chớp đang đóng và nảy bật ra với một tiếng #EMP kịch#! nặng nề. Vài giây sau, những thanh gỗ lật mở ra và một khuôn mặt ngái ngủ đang không chắc chắn thò ra nhòm ngó từ trong bóng tối.\n\nKhung cảnh của bọn ta, trong những bộ trang phục được ngụy trang tối màu, [officer.GetFirstNameNoTooltip] vẫn đang cầm chặt cây cung của [officer.GetHerHis], cùng với mũi tên rơi xuống đang leo lét cháy lập lòe dưới chân chúng ta đã làm cho mọi thứ trở nên cực kỳ rõ ràng rằng chúng ta chẳng phải phường tốt đẹp gì. Khi tiếng tri hô báo động vang lên, chúng ta chạy trốn —"
  laamp_base_contract_schemes.3663.desc.method.kenneler.poison_barrels: "[officer.GetTitledFirstName] có công việc đơn giản — dẫn [officer.GetHerHim] vào, [officer.GetSheHe] #EMP làm hỏng#! các thùng, chúng Ta lấy vài vật giá trị nhỏ để giống như trộm cắp thông thường.\n\nThật không may, tên ngốc làm đổ hẳn thùng đầu tiên khi cố mở, làm nứt và rơi sập xuống sàn. Tiếng hô hoảng xung quanh báo hiệu kế hoạch bị phát hiện, và chúng Ta chạy."
  laamp_base_contract_schemes.3663.desc.method.kenneler.steal_dogs: "Chỉ một khoảnh khắc sau khi [officer.GetTitledFirstName] vào chuồng chó, tiếng sủa giảm bớt. Rồi có... tiếng nói nghẹt? Một tiếng gầm — nhiều tiếng gầm — cắn, sủa và hỗn loạn!\n\n[officer.GetFirstNameNoTooltip] chạy ra khỏi tòa nhà nhỏ, bị hai con chó khổng lồ rượt, tiếng hô hoảng gần đó báo hiệu tiếng cảnh báo của chó đã được nghe. Giống như [officer.GetFirstNameNoTooltip], chúng Ta chạy trốn, nhưng"
  laamp_base_contract_schemes.3663.desc.method.kenneler.dog_on_birds: "Chắc chắn, [officer.GetTitledFirstName] đã vào bên trong — hai con chó bị xích ở mỗi tay cố gắng thoát — nhưng lũ chó khốn khi thấy chim thì sủa ầm lên. Tiếng sủa vang từ chuồng chim quý, một tiếng hô vang gần đó và rõ ràng chúng Ta phải chạy."
  laamp_base_contract_schemes.3663.desc.method.engineer: "[officer.GetTitledFirstName] mất quá nhiều thời gian lưỡng lự, cố tìm #EMP đúng#! vị trí tốt nhất để châm lửa, khiến ai đó để ý thấy chúng Ta lảng vảng! Ngay khi bị phát hiện, Ta biết mọi chuyện kết thúc. Một tiếng hô nhầm đánh thức tiếng khác, và chạy trốn là lựa chọn duy nhất.\n\n"
  laamp_base_contract_schemes.3663.desc.method.haggler: "Nhóm Ta và [officer.GetTitledFirstNamePossessive] tiếp cận từ hai hướng, nhưng dường như chúng Ta đã... đánh giá thấp quyết tâm của người dân địa phương. Cuộc tấn công bị phát hiện và, thay vì hoảng loạn, những người phòng thủ nhặt vũ khí tự chế và lao về phía chúng Ta, đầy tức giận và hô #EMP CƯỚP Ngài!#! lên trời.\n\nXa rời thảm sát, số lượng vượt trội của họ đe dọa áp đảo chúng Ta, buộc phải chạy —"
  laamp_base_contract_schemes.3663.desc.method.armsman: "$laamp_base_contract_schemes.3663.desc.method.haggler$"
  laamp_base_contract_schemes.3663.desc.method.spoiler: "$laamp_base_contract_schemes.3663.desc.method.haggler$"
  laamp_base_contract_schemes.3663.desc.method.cook: "$laamp_base_contract_schemes.3663.desc.method.forager$"
  laamp_base_contract_schemes.3663.desc.outro: "[employer.GetTitledFirstName] sẽ không trả đồng nào cho sự thất bại này."
  laamp_base_contract_schemes.3663.a: "Chúng ta nên rút đi..."
  laamp_base_contract_schemes.3663.b: "Bah, cứ để [target.GetFirstNameNoTooltip] biết rằng là Ta cũng được."

  laamp_base_contract_schemes.3781.t: "$laamp_base_contract_schemes.3041.t$: Chỉ Thêm Một Chút Nữa"
  laamp_base_contract_schemes.3781.desc.intro.yes: "Chúng Ta đã nhét đầy túi bạc lấy trộm từ kho bạc [employer.GetTitledFirstNamePossessive], nhưng còn nhiều giá trị khác trong [employer.GetHerHis] [employer.Custom('FortifiedBuilding')]: chân nến vàng, thảm trang trí tinh xảo, quần áo linen tốt nhất, sách thánh và nhiều thứ khác.\n\nTất cả những đồ vật mà [employer.GetTitleAsNameNoTooltip] coi là đương nhiên, nhưng với một [ROOT.Char.Custom('GetLaampDescribeTypeSelf')] khiêm tốn, đều mang #EMP lợi ích#!.\n\nChúng Ta chỉ cần cướp phá [employer.GetWomanMan] trước khi bị phát hiện và chạy thoát vào đêm."
  laamp_base_contract_schemes.3781.desc.ending: "Và đó là... tất cả?\n\nNhân danh [ROOT.Char.GetFaith.WealthGodName], chúng Ta đã lấy gần như #EMP mọi thứ#! có thể cướp được trong [employer.GetTitledFirstNamePossessive] [employer.Custom('FortifiedBuilding')], gom vào các túi và đóng gói sơ sài để tạo ít tiếng động nhất, chỉ giữ lại những vật quý giá nhất.\n\n[employer.GetTitleAsNameNoTooltip] sẽ có một buổi sáng #EMP rất#! tồi tệ khi [employer.GetSheHe] tỉnh dậy.\n\nChẳng còn việc gì khác ngoài rút đi."
  laamp_base_contract_schemes.3781.desc.success.method.intrigue: "Cắt cổ lính gác thức muộn, Ta nhẹ nhàng hạ thi thể xuống sàn — trước khi đá nó vào bóng tối sâu nhất mà Ta có thể tìm thấy.\n\nLau sạch máu trên lưỡi dao, Ta hất bỏ vị ngốc tội nghiệp khỏi vị trí gác. Thêu thùa tinh xảo ở đây, chút bạc ở đó, tất cả cộng lại. Cái chết vì mục đích chính đáng.\n\nNếu những người bảo vệ còn lại may mắn, họ sẽ ở nơi ít thuận lợi hơn, vì Ta đoán rằng"
  laamp_base_contract_schemes.3781.desc.success.method.prowess: "Ta phải thử vài lần để đập cửa đủ mạnh #EMP và#! không gây quá nhiều tiếng động, nhưng cuối cùng cũng thành công, đẩy cánh cửa khỏi bản lề mòn để lộ một căn phòng nhỏ chủ yếu dùng để... chứa đồ lặt vặt.\n\nHmmm. Không lý tưởng, nhưng giờ đã ở đây, Ta vẫn lục lọi và tìm đủ để thấy rằng công sức cũng xứng đáng.\n\nDẫu sao,"
  laamp_base_contract_schemes.3781.desc.success.method.martial: "Những lính gác bất lực của [employer.GetTitledFirstNamePossessive] bị hạ nhanh chóng và lặng lẽ, chỉ còn lại #EMP tối thiểu#! âm thanh khàn khàn cuối cùng. Một góc tường tiện lợi trở thành nơi tạm dừng trước khi chôn cất họ, và chúng Ta tự do tiếp tục cướp bóc.\n\nDĩ nhiên, để thi thể ở đó buộc chúng Ta phải lấy đi trang trí và nội thất xa hoa, nhưng đó chỉ là phép lịch sự.\n\nTiếp tục, rõ ràng rằng"
  laamp_base_contract_schemes.3781.desc.success.method.stewardship: "Chỉ với một lực vừa đủ, bản lề hộp khóa bật ra và nội dung sáng loáng tràn ra ầm ỹ.\n\nTrong khoảnh khắc, Ta đứng im, chờ xem tiếng động có thu hút ai không và... không có gì cả. Cười thầm, Ta cúi xuống nhặt phần thưởng, nhặt từng đồng như gà nhặt hạt.\n\nHài lòng khi có hầu hết số bạc, Ta chuyển chú ý ra ngoài —"
  laamp_base_contract_schemes.3781.desc.success.method.agent_intrigue: "Hóa ra là, [old_rollee.GetTitledFirstName] đã kiếm chác được kha khá, đang hớn hở thì thầm liệt kê một danh sách ngắn gọn những món đồ mà [old_rollee.GetSheHe] đã vội vã đánh cắp trong lúc [old_rollee.GetHerHis] hối hả lục lọi nơi này.\n\nMột chiến lợi phẩm không tồi, khá dồi dào cho một mẻ lưới, và sự phấn khích của vụ trộm hẳn sẽ giúp chúng ta vượt qua buổi tối. Ta bình thản nhấc một tấm rèm treo tường trông có vẻ đắt tiền và cuộn nó vào chiếc bao của riêng ta. Suy cho cùng, sẽ chẳng hay ho gì nếu để đám thuộc hạ làm xuất sắc hơn ta #EMP quá#! nhiều.\n\nCó lẽ"
  laamp_base_contract_schemes.3781.desc.success.method.agent_prowess: "Một cái đẩy chắc chắn khiến [old_rollee.GetTitledFirstName] bung cửa phòng kho hoàn toàn khỏi bản lề. Từ đó, chúng Ta chạy tới giữ cửa trước khi nó rơi và gây thêm tiếng động, nhưng thành công.\n\nChiến lợi phẩm bên trong xứng đáng với rủi ro — kho bạc tiền xu và cống vật từ dân chúng mến mộ của [employer.GetTitleAsNamePossessive] giờ được chuyển gọn gàng cho chúng Ta nhờ nỗ lực của [old_rollee.GetFirstNamePossessiveNoTooltip].\n\nTất cả và hơn thế nữa thuộc về chúng Ta, và"
  laamp_base_contract_schemes.3781.desc.success.method.master_thief: "[old_rollee.GetTitledFirstName] chẳng nói một lời, [old_rollee.GetSheHe] chỉ đơn thuần cười toe toét và giơ [old_rollee.Custom('Hand_ArticleTwo')] [old_rollee.Custom('HandHands')] đeo đầy những chiếc nhẫn mới toanh, lấp lánh, có lẽ là ba hoặc bốn chiếc trên mỗi ngón tay.\n\nMãn nguyện, ta gật gù và vẫy tay ra hiệu cho $master_thief_camp_officer$ của ta tiếp tục công việc nẫng đồ của [old_rollee.GetHerHis] ở chỗ khác. Có lẽ [old_rollee.GetSheHe|U] nên tháo chúng ra, ta chẳng dám nghĩ chúng sẽ giúp ích gì cho sự khéo léo của [old_rollee.GetHerHis], nhưng lúc này ta sẽ không dừng lại để thuyết giáo đâu.\n\nKhông phải trong lúc"
  laamp_base_contract_schemes.3781.desc.success.method.mos: "Nở nụ cười xảo quyệt, [old_rollee.GetTitledFirstName] mở chiếc bao tải được dệt thô kệch của [old_rollee.GetHerHis] để lộ ra một #EMP kho tàng#! tiền xu chất đống, được bọc vụng về bằng vài tấm nệm đắt tiền.\n\n$master_of_spoils_camp_officer$ của ta gõ vào [old_rollee.Custom('ActionTaps_ForeheadNose')] của [old_rollee.GetHerHis] đầy ẩn ý: "Mấu chốt không phải là phát hiện ra những chiến lợi phẩm lồ lộ rành rành, mà là phát hiện ra những chỗ hiển nhiên để #EMP cất giấu#! mọi thứ".\n\nKhá đúng đấy, và"
  laamp_base_contract_schemes.3781.desc.success.method.stress: "Tập trung, tập trung, #EMP tập trung#!, Ta phải tập trung.\n\nNếu bị bắt, chắc chắn Ta sẽ treo cổ trước — và còn tệ hơn, lâu nhất. Không có chỗ cho sai sót, cả nghĩa đen lẫn bóng. Chúng Ta phải nhanh nhẹn, khôn ngoan và tàn nhẫn khi đi từ phòng này sang phòng khác, lấy mọi thứ có giá trị dù nhỏ nhất.\n\nNhưng vẫn, tiếng gọi của đồng tiền tiếp tục dẫn dắt chúng Ta. Dù sao,"
  laamp_base_contract_schemes.3781.desc.failure.method.intrigue: "Rút dao ra chứng tỏ là biện pháp phòng ngừa tuyệt vời, vì chúng Ta gặp quá nhiều lính gác phiền phức rải rác khắp nơi.\n\nMột số ở đó cả thời gian, số khác bị thu hút bởi tiếng động khi chúng Ta vào, nhưng dù sao đi nữa, sự hiện diện của họ báo hiệu rằng chúng Ta bắt đầu bị chú ý. Quá nhiều chú ý.\n\nLắc đầu, Ta tập trung lại vào những gì quan trọng trước mắt:"
  laamp_base_contract_schemes.3781.desc.failure.method.prowess: "Dù cố gắng hết sức để phá cửa vào kho có vẻ #EMP như#! một kho lưu trữ, cánh cửa đáng ghét ấy không chịu nhúc nhích.\n\nCú đánh mạnh nhất cũng chỉ tạo ra tiếng kêu gỗ lèo xèo, kèm tiếng ai đó ngủ gần đó trở mình.\n\nĐồ trong đó không đáng mạo hiểm, nhưng"
  laamp_base_contract_schemes.3781.desc.failure.method.martial: "Tuần tra bị hạ — và quan trọng hơn, họ hạ #EMP lặng lẽ#!.\n\nChỉ là... không đủ lặng lẽ. Tiếng đập loạn xạ và tiếng gurgle của những kẻ đang chết khá lớn, và dù lần này không ai nghe thấy, chắc chắn lần sau sẽ không may mắn như vậy.\n\nNhưng lòng tham vẫn dẫn đường. Rõ ràng"
  laamp_base_contract_schemes.3781.desc.failure.method.stewardship: "Cái thứ trong thiết bị khốn nạn này quá nặng — nặng quá để di chuyển bằng tay — và khóa #EMP khó chịu#! chắc chắn.\n\nMở ra có thể mất hàng giờ, và một lần thử dùng sức tạo ra tiếng #EMP kim loại chát chúa#!, thật kỳ lạ mà chúng Ta không bị bắt ngay lập tức. Tiếng động lớn tiếp theo chắc chắn sẽ là lần cuối cùng.\n\nDù thất bại,"
  laamp_base_contract_schemes.3781.desc.failure.method.agent_intrigue: "Hóa ra là, [old_rollee.GetTitledFirstName] không những chẳng mót được gì cho chúng ta — [old_rollee.GetSheHe] còn kịp đánh thức một toán lính gác khỏi sới súc xắc của bọn chúng\n\nTát gã ngốc đó một bạt tai, ta lầm bầm ra lệnh lần sau phải #EMP cẩn trọng#! hơn, e rằng [old_rollee.GetSheHe] sẽ giáng toàn bộ cơn thịnh nộ của [employer.GetPrimaryTitle.GetBaseNameNoTier] xuống đầu chúng ta mất.\n\nThất bại hay không,"
  laamp_base_contract_schemes.3781.desc.failure.method.agent_prowess: "Bất chấp mọi sức mạnh của [old_rollee.GetHerHis], [old_rollee.GetTitledFirstName] dường như vẫn không thể phá vỡ được cánh cửa đang cản bước chúng ta tới một căn phòng đầy ắp những món đồ xa xỉ đắt tiền.\n\nBực dọc, ta ra hiệu bỏ qua nó. Còn có những món bở hơn để vơ vét ở nơi khác, ta tin chắc như vậy, và chúng ta càng trở nên điên tiết vì vấn đề này hay vấn đề nọ, chúng ta càng có nguy cơ mắc sai lầm.\n\nChúng ta đã gây quá nhiều tiếng ồn với thứ này rồi — đặc biệt là khi "
  laamp_base_contract_schemes.3781.desc.failure.method.master_thief: "[old_rollee.GetTitledFirstName] đã xoay xở để dò la một cách nhanh chóng và lặng lẽ qua một khu vực rộng lớn đến bất ngờ của [employer.Custom('FortifiedBuilding')] — thật không may, theo lời [old_rollee.GetHerHim], có rất ít thứ có thể đánh cắp được mà không có nguy cơ đánh động lính gác.\n\nTồi tệ hơn, biểu cảm đầy tội lỗi của [old_rollee.GetHerHis] báo hiệu rằng #EMP rất có thể#! [old_rollee.GetSheHe] đã đánh liều làm điều đó mà không có sự hay biết của ta. Chúng ta sẽ phải luôn cảnh giác cao độ.\n\nBất luận những thất bại của [old_rollee.GetFirstNamePossessiveNoTooltip] hay không,"
  laamp_base_contract_schemes.3781.desc.failure.method.mos: "Rõ ràng khẩu phần muối của [old_rollee.GetTitledFirstNamePossessive] chuẩn bị bị cắt giảm rồi, vì [old_rollee.GetWomanMan] đó đã trở lại vài phút sau với hai bàn tay trắng trơn.\n\nTa từng tưởng rằng $master_of_spoils_camp_officer$ của ta sẽ chứng minh được năng lực vơ vét chí ít là được thêm một chút bằng chính sức lực của [old_rollee.GetHerselfHimself], nhưng thay vào đó ta lại bị buộc phải lắng nghe với một sự kinh hoàng bủa vây khi tên ngốc đó kể lại việc suýt đụng độ một toán tuần tra.\n\nMột sai lầm nữa như thế sẽ khiến tất cả bọn ta bị treo cổ, cơ mà,"
  laamp_base_contract_schemes.3781.desc.cta: "vẫn còn đồ giá trị để cướp ở cuối hành lang..."
  laamp_base_contract_schemes.3781.tt.haul_details: "#TUT [gold_i][varcheck.MakeScope.Var('haul_actual').GetValue|P0] [gold|E] trong tổng số [gold_i][varcheck.MakeScope.Var('haul_possible').GetValue|V0] hiện có trong kho#!"
  laamp_base_contract_schemes.3781.tt.fouls_remaining: "#TUT Còn [varcheck.MakeScope.Var('heist_failures').GetValue] lần vi phạm trước khi bị bắt#!"
  laamp_base_contract_schemes.3781.tt.increment_haul: "Thêm [gold_i][varcheck.MakeScope.Var('haul_increment').GetValue|P0] vào kho"
  laamp_base_contract_schemes.3781.tt.foul_warning.increment: "Nhận #N +1#! lần vi phạm"
  laamp_base_contract_schemes.3781.tt.foul_warning.pot_lost: "Thu nhập của Ngài đến giờ sẽ mất"
  laamp_base_contract_schemes.3781.tt.duel_success.skill: "Kỹ năng của Ngài đáng khen"
  laamp_base_contract_schemes.3781.tt.duel_failure.skill: "Ngài thu hút quá nhiều sự chú ý"
  laamp_base_contract_schemes.3781.tt.duel_success.agent: "[rollee.GetFirstNameNoTooltip] chiến thắng"
  laamp_base_contract_schemes.3781.tt.duel_failure.agent: "Đặc vụ của Ngài thất bại"
  laamp_base_contract_schemes.3781.a: "Nấp thấp, #EMP rút dao#!."
  laamp_base_contract_schemes.3781.b: "Cánh cửa này quan trọng, phá nó!"
  laamp_base_contract_schemes.3781.c: "Tuần tra tới — tấn công từ cả hai phía."
  laamp_base_contract_schemes.3781.d: "Ta thấy một hộp khóa..."
  laamp_base_contract_schemes.3781.e: "[rollee.GetFirstNameNoTooltip], cậu tìm thấy gì?"
  laamp_base_contract_schemes.3781.f: "[rollee.GetFirstNameNoTooltip], dồn vai vào!"
  laamp_base_contract_schemes.3781.g: "Có tìm được gì không, [rollee.GetFirstNameNoTooltip]?"
  laamp_base_contract_schemes.3781.h: "Được rồi [rollee.GetFirstNameNoTooltip], chứng tỏ giá trị của cậu."
  laamp_base_contract_schemes.3781.i: "Chỉ... một chút nữa..."
  laamp_base_contract_schemes.3781.j: "Đủ rồi, chạy đi!"
  laamp_base_contract_schemes.3781.j.stole_everything: "Chú ý túi và di chuyển!"
  laamp_base_contract_schemes.3781.j.tt.flee_with_earnings: "Mang theo kho báu hiện tại và chạy đi"

  laamp_base_contract_schemes.3782.t: "$laamp_base_contract_schemes.3041.t$: Thành công!"
  laamp_base_contract_schemes.3782.desc.intro: "Như những bóng ma trong đêm, chúng Ta đã rút đi.\n\nNhững tiếng báo động và giận dữ đầu tiên chỉ là vọng âm xa xôi khi tới tai chúng Ta, âm vang nhạt nhẽo của hậu quả từ xa."
  laamp_base_contract_schemes.3782.desc.haul_amount.grabbed_everything: "chỉ là nhỏ bé so với kho báu tuyệt đối #EMP mà chúng Ta tìm được ngồi trong tay, một kho tàng thực sự đầy những chiến lợi phẩm và kim loại quý có thể bán được."
  laamp_base_contract_schemes.3782.desc.haul_amount.grabbed_most: "dễ dàng bị bỏ qua khi chúng Ta nhìn vào kho báu rực rỡ, toàn bộ tài sản của [employer.GetPrimaryTitle.GetBaseNameNoTier] bị lấy sạch từ các đại sảnh của [employer.GetLadyLord] và bừa bộn xếp trước chân chúng Ta."
  laamp_base_contract_schemes.3782.desc.haul_amount.grabbed_lots: "không đáng kể khi chúng Ta bỗng dưng có một khối tài sản phong phú như vậy trong tay. Dĩ nhiên, [employer.GetTitledFirstName] chắc chắn còn nhiều vật quý để lấy, nhưng tham lam quá mức là sai lầm đầu tiên — và thường là cuối cùng — của kẻ trộm nghiệp dư.\n\nTrọng lượng dễ chịu của chiến lợi phẩm đủ để làm chúng Ta chậm bước khi quay về nhà trong niềm vui."
  laamp_base_contract_schemes.3782.desc.haul_amount.grabbed_nothing: "vang vọng trong tai khi chúng Ta mồ hôi nhễ nhại quay về điểm hẹn.\n\nDù Ta đã hô hào về việc kiếm thêm bạc, chúng Ta rời các đại sảnh của [employer.GetTitledFirstNamePossessive] mà chẳng có nổi một đồng xu cho rủi ro thêm.\n\nĐêm nay, có vẻ chúng Ta sẽ phải hài lòng với kho báu ban đầu."
  laamp_base_contract_schemes.3782.desc.haul_amount.grabbed_some: "cảnh báo rằng có lẽ khoản kiếm thêm của chúng Ta đi kèm cái giá cao hơn.\n\nDẫu vậy, việc đã rồi là đã rồi, và chúng Ta có một kho bạc vừa phải gồm bạc, vàng và đá quý để chứng minh nỗ lực. Chắc chắn sẽ bán được một khoản kha khá."
  laamp_base_contract_schemes.3782.desc.outro: "\n\nKhông tệ cho một đêm làm việc."
  laamp_base_contract_schemes.3782.a: "Heh, giờ hãy bán số chiến lợi phẩm này..."

  laamp_base_contract_schemes.3783.t: "$laamp_base_contract_schemes.3041.t$: Thất bại!"
  laamp_base_contract_schemes.3783.desc.intro: "Thế giới đêm sống dậy với loạt tiếng la hét, kêu gào. Ai đã báo động thì không ai biết, nhưng khi [employer.GetTitledFirstNamePossessive] lính vệ tỉnh dậy, họ quá đông so với chúng Ta.\n\n"
  laamp_base_contract_schemes.3783.desc.haul_amount.grabbed_everything: "Chúng Ta đã lấy hết — #EMP tất cả#! — mọi thứ có giá trị trong toàn bộ [employer.Custom('FortifiedBuilding')], từng đĩa bạc, từng đồng vàng, từng quyển sách mạ vàng, và giờ tất cả... đã mất..."
  laamp_base_contract_schemes.3783.desc.haul_amount.grabbed_most: "Quá nhiều tiền, quá nhiều #EMP chiến lợi phẩm#!, mất sạch. Chúng Ta đã có toàn bộ tài sản của [employer.GetPrimaryTitle.GetBaseNameNoTier] trong tay và để nó trôi đi..."
  laamp_base_contract_schemes.3783.desc.haul_amount.grabbed_lots: "Chúng Ta đã gom được một kho báu đáng kể trước khi bị bắt. Thật tiếc... toàn bộ bạc ấy có thể bán được rất tốt vài thị trấn xa..."
  laamp_base_contract_schemes.3783.desc.haul_amount.grabbed_nothing: "Chúng Ta thậm chí còn chưa lấy được gì."
  laamp_base_contract_schemes.3783.desc.haul_amount.grabbed_some: "Chúng Ta chưa lấy nhiều, nhưng dĩ nhiên, ít chủ nhà nào quan tâm #EMP số lượng#! khi đối mặt với trộm — họ chỉ băn khoăn nên chặt tay trái, tay phải hay cả hai."
  laamp_base_contract_schemes.3783.desc.outro: "\n\nChúng Ta bị kéo thẳng xuống ngục, theo tiếng la hét giận dữ của [employer.GetTitleAsNameNoTooltip]."
  laamp_base_contract_schemes.3783.tt.haul_lost: "Toàn bộ kho báu thêm của Ngài bị mất, trả lại cho [employer.GetTitledFirstName]"
  laamp_base_contract_schemes.3783.a: "Chết tiệt và nguyền rủa những bức tường quỷ này!"
  laamp_base_contract_schemes.3783.a.tt.a_cold_cell_awaits: "Một phòng giam lạnh lẽo đang chờ..."

  laamp_base_contract_schemes.5661.t: "$laamp_base_contract_schemes.5034.t$: [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
  laamp_base_contract_schemes.5661.desc.intro.constantinople: "Chúng Ta thấy mình ngoài những bức tường hùng vĩ của [ROOT.Char.GetCurrentLocation.GetName],"
  laamp_base_contract_schemes.5661.desc.intro.plains: "Cuộc đột kích ban đêm đưa chúng Ta sâu vào các đồng bằng của [ROOT.Char.GetCurrentLocation.GetName],"
  laamp_base_contract_schemes.5661.desc.intro.farmlands: "Nhóm của Ta và Ta len lỏi qua các cánh đồng nông trại dày đặc của [ROOT.Char.GetCurrentLocation.GetName],"
  laamp_base_contract_schemes.5661.desc.intro.hills: "Dễ dàng, lực lượng của Ta trườn qua các ngọn đồi của [ROOT.Char.GetCurrentLocation.GetName],"
  laamp_base_contract_schemes.5661.desc.intro.mountains: "Tối nay chúng Ta trèo lên các sườn thấp và chân núi giữa các ngọn núi của [ROOT.Char.GetCurrentLocation.GetName],"
  laamp_base_contract_schemes.5661.desc.intro.desert: "Sáng nay chúng Ta tiến vào sa mạc của [ROOT.Char.GetCurrentLocation.GetName],"
  laamp_base_contract_schemes.5661.desc.intro.desert_mountains: "Quyết tìm #EMP thứ gì đó#!, nhóm cướp và Ta khám phá các ngọn núi khô cằn của [ROOT.Char.GetCurrentLocation.GetName],"
  laamp_base_contract_schemes.5661.desc.intro.oasis: "Dưới ánh bình minh cháy rực, quân Ta tỏa ra khu oases xanh tươi của [ROOT.Char.GetCurrentLocation.GetName],"
  laamp_base_contract_schemes.5661.desc.intro.jungle: "Ẩn dưới tán cây râm mát, chúng Ta xông ra các khu rừng rậm của [ROOT.Char.GetCurrentLocation.GetName],"
  laamp_base_contract_schemes.5661.desc.intro.forest: "Dưới tán cây rợp bóng của [ROOT.Char.GetCurrentLocation.GetName], chúng Ta tiến lên,"
  laamp_base_contract_schemes.5661.desc.intro.taiga: "Giữa những cây thông gồ ghề của [ROOT.Char.GetCurrentLocation.GetName], lực lượng Ta tỏa ra,"
  laamp_base_contract_schemes.5661.desc.intro.wetlands: "Vào giữa trưa, những binh sĩ tinh mắt nhất tiến vào vùng đầm lầy của [ROOT.Char.GetCurrentLocation.GetName],"
  laamp_base_contract_schemes.5661.desc.intro.steppe: "Như mấy ngày qua, quân Ta lang thang khắp thảo nguyên vô tận của [ROOT.Char.GetCurrentLocation.GetName],"
  laamp_base_contract_schemes.5661.desc.intro.floodplains: "Không còn lựa chọn nào khác, nhóm Ta buộc phải vào các vùng đất ngập lụt oi ả của [ROOT.Char.GetCurrentLocation.GetName],"
  laamp_base_contract_schemes.5661.desc.intro.drylands: "Khuấy bụi mịt mù, nhóm của Ta lan tỏa khắp vùng đất khô cằn của [ROOT.Char.GetCurrentLocation.GetName],"
  laamp_base_contract_schemes.5661.desc.intro.postamble: "tìm những đàn [ROOT.Char.Custom('RegionalFarmAnimalPlural')] dễ bị tổn thương để đưa về trại cắm trại di động của chúng Ta."
  laamp_base_contract_schemes.5661.desc.opportunity.01: "Một số mục tiêu khả dĩ đã lọt vào tầm mắt Ta trong những lần khảo sát khu vực gần đây, nhưng cho đến giờ chúng Ta chỉ mới thăm dò nhẹ."
  laamp_base_contract_schemes.5661.desc.opportunity.02: "Cho đến giờ, vùng này khá khan hiếm con mồi, kháng cự quá mạnh khiến không thể lấy được nhiều gia súc. Nhưng cuối cùng, chúng Ta cũng tìm thấy những nông trang phòng thủ yếu với đàn gia súc dồi dào."
  laamp_base_contract_schemes.5661.desc.opportunity.03: "Dù khu vực này trông có vẻ dễ khai thác cho tới nay, chúng Ta đã kiềm chế — chờ đợi mục tiêu hoàn hảo trước khi tung hết sức tàn bạo. Tối nay, với phát hiện một điền trang tràn đầy gia súc béo tốt, chúng Ta đã tìm thấy mục tiêu."
  laamp_base_contract_schemes.5661.desc.opportunity.04: "Dù có ít điền trang lớn ở đây, các nông trại nhỏ hơn trông khá thịnh vượng. Cướp bóc chúng sẽ tốn công hơn, nhưng thành quả cuối cùng vẫn đáng công sức."
  laamp_base_contract_schemes.5661.desc.opportunity.05: "Người dân địa phương — ít nhất là những ai dám xuất hiện trước chúng Ta — than nghèo, nhưng nếu Ta ở vị trí họ và [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] gõ cửa, Ta cũng vậy. Ít nhất họ có đàn gia súc đủ cho nhu cầu của chúng Ta."
  laamp_base_contract_schemes.5661.desc.opportunity.06: "Không còn chỗ cho lòng thương, không gian để nhận ra hại chúng Ta gây ra cho những nông dân nghèo. Gia súc của họ sẽ thuộc về chúng Ta, hoặc chúng Ta sẽ chém chết — chỉ đơn giản vậy thôi."
  laamp_base_contract_schemes.5661.desc.outro: "\n\nGiờ là lúc bạo lực lên ngôi."
  laamp_base_contract_schemes.5661.tt.encounter_tally: "#TUT Đây là cuộc gặp [task_contract.MakeScope.Var('encounter_tally').GetValue|0] trong tổng số [task_contract.MakeScope.Var('encounter_max').GetValue|0]#!"
  laamp_base_contract_schemes.5661.tt.current_successes: "#TUT Ngài hiện có [task_contract.MakeScope.Var('wins_tally').GetValue|0] vụ lấy trộm thành công#!"
  laamp_base_contract_schemes.5661.tt.score_gained: "#P +1#! vụ lấy trộm thành công"
  laamp_base_contract_schemes.5661.tt.no_score_gain: "Ngài không lấy được lượng gia súc đáng kể nào"
  laamp_base_contract_schemes.5661.a: "Chém bất cứ kẻ nào chống đối chúng ta!"
  laamp_base_contract_schemes.5661.a.tt.success: "Sự tàn nhẫn của Ngài được đền đáp"
  laamp_base_contract_schemes.5661.a.tt.failure: "Người dân địa phương phản kháng thành công"
  laamp_base_contract_schemes.5661.b: "Nhớ, đoàn kết, tập trung vào đàn thú."
  laamp_base_contract_schemes.5661.b.tt.success: "Kỷ luật của Ngài giữ vững"
  laamp_base_contract_schemes.5661.b.tt.failure: "Quân của Ngài quá phân tán"
  laamp_base_contract_schemes.5661.c: "Chỉ lấy những con tốt nhất, để những con tạm cho lũ chó này."
  laamp_base_contract_schemes.5661.c.tt.success: "Ngài lấy được những con thú chọn lọc"
  laamp_base_contract_schemes.5661.c.tt.failure: "Nhóm cướp của Ngài quá kén chọn"
