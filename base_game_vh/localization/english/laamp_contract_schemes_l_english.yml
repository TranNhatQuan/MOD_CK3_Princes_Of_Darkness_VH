  laamp_base_contract_schemes.5661.h: "Giá như Ta có một viên sĩ quan thích hợp..."
  laamp_base_contract_schemes.5661.h.tt.need_groom_hunter_kenneler_or_spoiler: "Ngài không có [GetCourtPositionType('head_groom_camp_officer').GetName()], [GetCourtPositionType('huntperson_camp_officer').GetName()], [GetCourtPositionType('kennelperson_camp_officer').GetName()], hay [GetCourtPositionType('master_of_spoils_camp_officer').GetName()]"
  laamp_base_contract_schemes.5661.i: "Sẽ không có #EMP sai lầm#! từ #EMP bất kỳ ai#!."

  laamp_base_contract_schemes.5662.t: "$laamp_base_contract_schemes.5034.t$: Thành công!"
  laamp_base_contract_schemes.5662.desc: "Dù nhiều thuộc hạ của [employer.GetTitledFirstNamePossessive] cố gắng, [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] đã thu lại một bầy thú thực sự từ tay [employer.GetHerHis] một cách nhục nhã.\n\nCó thể chúng không phải tự nhiên thuộc về chúng ta, nhưng điều đó có gì quan trọng? Với kiếm và rìu, chúng Ta lấy những gì muốn, và bất cứ ai chống lại đều nằm chết trong đồng cỏ.\n\nCầu mong xác họ trở thành trò vui cho quạ."
  laamp_base_contract_schemes.5662.a: "Đêm nay chúng ta ăn như vua!"

  laamp_base_contract_schemes.5663.t: "$laamp_base_contract_schemes.5034.t$: Thất bại!"
  laamp_base_contract_schemes.5663.desc: "Dù đã cố hết sức, quân của [employer.GetTitledFirstNamePossessive] dường như ngăn cản chúng Ta ở mọi bước. Cảnh báo gửi tới các làng xa, đàn gia súc phong phú được chuyển đi nơi khác, lính mới và tháp canh được xây dựng lại ở mọi nơi chúng Ta đến...\n\nHôm nay, chiến thắng thuộc về [employer.GetTitleAsNameNoTooltip]."
  laamp_base_contract_schemes.5663.a: "Bah, lão già lẩm cẩm..."

  laamp_base_contract_schemes.5901.t: "$laamp_base_contract_schemes.5051.t$: [victim.GetTitledFirstNameNoTooltip]"
  laamp_base_contract_schemes.5901.desc.intro.1: "Khi công việc buổi tối gần xong, Ta và các thuộc hạ cân nhắc có nên về sớm một chút — quyết định được đưa ra khi một mục tiêu trông hứa hẹn xuất hiện..."
  laamp_base_contract_schemes.5901.desc.intro.2: "Khi chiều trôi dần sang tối, Ta kìm một cái ngáp. Trộm cắp có thể kiếm được nhiều, nhưng phần lớn chỉ là #EMP chờ đợi#! — mặc dù khoan đã, [victim.GetWomanMan] này trông có vẻ tiềm năng..."
  laamp_base_contract_schemes.5901.desc.intro.3: "Công việc hôm nay khá lộn xộn, với nhiều túi bạc thu được nhưng ít túi thực sự #EMP lớn#!. Tuy nhiên, nhìn [victim.GetWomanMan] này, có lẽ điều đó sắp thay đổi..."
  laamp_base_contract_schemes.5901.desc.intro.4: "Công việc hôm nay đã khá có lợi, vài công dân tốt bụng đã hào phóng góp bạc cho #EMP hoạt động#! của chúng Ta. [victim.GetWomanMan] này có thể là người giàu nhất cho tới giờ..."
  laamp_base_contract_schemes.5901.desc.intro.5: "Sau một ngày phần lớn vô ích, không có lấy một nông dân giàu nào đi qua khu vực của chúng Ta, cuối cùng chúng Ta cũng gặp may với [victim.GetWomanMan] rõ ràng có tài sản."
  laamp_base_contract_schemes.5901.desc.victim_type.good_relation: "Đó là... [victim.Custom2('RelationToMeShort',ROOT.Char)] của ta [victim.GetTitledFirstName]? [victim.GetSheHe] đang nghĩ cái quái gì vậy, đi lang thang qua những con phố nguy hiểm này mà không có người hộ tống! Dĩ nhiên là [victim.GetSheHe] có khả năng bị cướp, sao [victim.GetSheHe] có thể cẩu thả đến thế cơ chứ?"
  laamp_base_contract_schemes.5901.desc.victim_type.bad_relation: "À này, nếu không phải là [victim.Custom2('RelationToMeShort',ROOT.Char)] cũ của Ta, [victim.GetTitledFirstName]. Và không có hộ tống nữa. Thật… #EMP may mắn#!."
  laamp_base_contract_schemes.5901.desc.victim_type.consort: "Đó là [victim.GetFirstName], #EMP [victim.Custom2('RelationToMeShort',ROOT.Char)]# của Ta!! Dù giờ chúng ta xa nhau, sao Ta có thể làm điều này với [victim.GetHerHim], với người mà Ta vốn coi trọng?"
  laamp_base_contract_schemes.5901.desc.victim_type.family: "Không thể nào… [victim.GetFirstName|U], [victim.Custom2('RelationToMeShort',ROOT.Char)] của Ta. Không có hộ tống, nhảy múa vào nguy hiểm, vui vẻ thoải mái. Sự liều lĩnh của [victim.GetHerHis|U] làm nhơ bẩn danh tiếng [ROOT.Char.GetHouse.GetName]."
  laamp_base_contract_schemes.5901.desc.victim_type.courtier: "Hmmm, #EMP trông# giống là [victim.GetTitledFirstName] — một triều thần của [target.GetTitledFirstName]. Dù có lợi gì đâu cho [victim.GetHerHim] ở đây và giờ này, vô tình bị bao quanh bởi [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]."
  laamp_base_contract_schemes.5901.desc.victim_type.baron: "Đó… vâng, [victim.GetFirstName], [victim.GetTitleAsNameNoTooltip] của [victim.GetPrimaryTitle.GetBaseNameNoTier]! [victim.GetSheHe|U] chắc đang thăm thủ đô vì việc riêng. Rất riêng, khi đi không hộ tống và chọn những đường #EMP đáng xấu hổ#!."
  laamp_base_contract_schemes.5901.desc.victim_type.baron_courtier: "Ta không thể nói là ta nhận ra [victim.GetHerHim], nhưng nhìn từ y phục của [victim.GetHerHis], [victim.GetSheHe] dường như khá dư dả nhưng lại không có tiếng tăm. Có lẽ là một cận thần của một tiểu lãnh chúa địa phương nào đó."
  laamp_base_contract_schemes.5901.desc.victim_type.traveller: "Y phục và dáng vẻ bất định của [victim.GetHerHis] đã tố cáo [victim.GetHerHim] đích thị là một người ngoại quốc, ít nhất là đối với thành phố này. Có lẽ là một vị khách ghé thăm ngắn ngày, hoặc chỉ là một người lữ hành tình cờ đi ngang qua."
  laamp_base_contract_schemes.5901.desc.victim_type.fallback: "Ta nhận ra [victim.GetHerHim] là [victim.GetFirstName], một đại diện giàu có nhỏ địa phương và #EMP hoàn toàn#! là mục tiêu phù hợp, dù có lẽ không giàu nhất."
  laamp_base_contract_schemes.5901.desc.outro.1: "Các thuộc hạ của Ta bắt đầu lộ ra từ chỗ ẩn nấp, nôn nóng muốn lao vào con mồi mới."
  laamp_base_contract_schemes.5901.desc.outro.2: "Bóng tối nhúc nhích, những bóng người trùm mũ dưới quyền Ta chuẩn bị lao lên bất cứ lúc nào."
  laamp_base_contract_schemes.5901.desc.outro.3: "Gần như không nghe thấy, Ta vẫn nghe tiếng dao được mài bén rút ra quanh hẻm nhỏ."
  laamp_base_contract_schemes.5901.desc.outro.4: "Với mặt nạ che gần hết mặt, chỉ lộ mắt, các thuộc hạ nhìn Ta chờ tín hiệu bắt đầu."
  laamp_base_contract_schemes.5901.desc.outro.5: "Ta chỉ cần ra lệnh, và Bạn Nhỏ sẽ học được ý nghĩa của hối tiếc."
  laamp_base_contract_schemes.5901.tt.muggings_tally_and_max: "#TUT Ngài đã thực hiện [scheme.MakeScope.Var('special_muggings_tally').GetValue|0] vụ cướp đặc biệt trong tổng số [scheme.MakeScope.Var('special_muggings_max').GetValue|0]#!"
  laamp_base_contract_schemes.5901.tt.victim_escapes: "[victim.GetTitledFirstName] thoát được"
  laamp_base_contract_schemes.5901.a: "Rút dao, làm việc này âm thầm nhưng rõ ràng."
  laamp_base_contract_schemes.5901.a.tt.success: "Ngài dọa được [victim.GetFirstNameNoTooltip]"
