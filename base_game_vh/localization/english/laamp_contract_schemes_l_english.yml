  laamp_base_contract_schemes.1301.desc.intro.desert: "những sa mạc cháy bỏng của [current_county.GetBaseNameNoTier]."
  laamp_base_contract_schemes.1301.desc.intro.desert_mountains: "những ngọn núi khô cằn không tha thứ của [current_county.GetBaseNameNoTier]."
  laamp_base_contract_schemes.1301.desc.intro.oasis: "ốc đảo tươi tốt tại [current_county.GetBaseNameNoTier]."
  laamp_base_contract_schemes.1301.desc.intro.jungle: "những khu rừng rậm rạp của [current_county.GetBaseNameNoTier]."
  laamp_base_contract_schemes.1301.desc.intro.forest: "những khu rừng u tối của [current_county.GetBaseNameNoTier]."
  laamp_base_contract_schemes.1301.desc.intro.taiga: "những khu rừng thông bạt ngàn của [current_county.GetBaseNameNoTier]."
  laamp_base_contract_schemes.1301.desc.intro.wetlands: "những đầm lầy hôi thối của [current_county.GetBaseNameNoTier]."
  laamp_base_contract_schemes.1301.desc.intro.steppe: "thảo nguyên vô tận của [current_county.GetBaseNameNoTier]."
  laamp_base_contract_schemes.1301.desc.intro.floodplains: "những đồng bằng lũ ẩm ướt của [current_county.GetBaseNameNoTier]."
  laamp_base_contract_schemes.1301.desc.intro.drylands: "những vùng đất khô bụi của [current_county.GetBaseNameNoTier]."
  laamp_base_contract_schemes.1301.desc.intro.postamble: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] mở rộng ra quanh nhóm nhỏ tội phạm của [recidivist.GetHerHis], tất cả chúng Ta căng thẳng và sẵn sàng cho máu đổ."
  laamp_base_contract_schemes.1301.desc.encounters.first.relation.good: ""[ROOT.Char.GetFirstNameNoTooltip], [recidivist.Custom2('RelationToMeShort',ROOT.Char)] của Ta", mở lời [recidivist.GetFirstNameNoTooltip], phá vỡ sự im lặng. "Ta... không ngờ gặp được ngươi. Trong tất cả mọi người đến tìm Ta, lại là người thân quý như ngươi...""
  laamp_base_contract_schemes.1301.desc.encounters.first.relation.bad: ""Ahhhh [ROOT.Char.GetFirstNameNoTooltip], còn thằng ngốc nào ngu dốt hơn mà lại sốt sắng theo đuổi ta?" mở lời [recidivist.GetFirstNameNoTooltip], tiến tới. "Thật ra, Ta mừng. Giết phần lớn [ROOT.Char.GetWomenMen] thì chán ngắt, nhưng xẻ thịt ngươi sẽ là #EMP một niềm vui#!.""
  laamp_base_contract_schemes.1301.desc.encounters.first.family: ""[ROOT.Char.GetFirstNameNoTooltip], [recidivist.Custom2('RelationToMeShort',ROOT.Char)] của Ta, máu mủ của Ta — sao ngươi lại truy đuổi ta ở đây? Hy vọng trả thù những sỉ nhục mà ta gây ra với dòng họ [ROOT.Char.GetHouse.GetName] sao?"" 
  laamp_base_contract_schemes.1301.desc.encounters.first.general_reaction.angry: ""Hừ! Ngươi, con chó nhỏ hèn mọn và ngu dốt!" gầm lên [recidivist.GetFirstNameNoTooltip], "ra đây để làm theo ý muốn của [employer.GetTitledFirstNamePossessive] sao? Vậy thì, tới đây, kẻ hầu rên rỉ, đối mặt ta và chứng minh ngươi chẳng hơn gì một con chó nhỏ sủa!""
  laamp_base_contract_schemes.1301.desc.encounters.first.general_reaction.haughty: ""Nào, hãy để ta xem — à, #EMP kìa [ROOT.Char.GetSheHe] đó rồi#!," [recidivist.GetFirstNameNoTooltip] gầm lên khi kẻ đó chen lấn lên phía trước đám đông, "cái vị [ROOT.Char.GetLadyLord] bé nhỏ bị lạc đường, kẻ nghĩ rằng mình sẽ hạ bệ được ta! Được thôi, tới đây, [ROOT.Char.GetFirstNameNoTooltip]! Ta ở đây này!""
  laamp_base_contract_schemes.1301.desc.encounters.first.general_reaction.doleful: ""Giá mà chúng ta không gặp nhau dưới hoàn cảnh bất lợi thế này, [ROOT.Char.GetFirstNameNoTooltip], bởi ta không có oán hận gì với ngươi", nhận xét [recidivist.GetFirstNameNoTooltip], "nhưng e rằng ngươi định hoàn thành nghĩa vụ đến cùng.""
  laamp_base_contract_schemes.1301.desc.encounters.first.general_reaction.merry: ""Ha!" cười [recidivist.GetFirstNameNoTooltip], "đây có phải tất cả mọi người ngươi mang tới không? Tuyệt, #EMP tuyệt vời#!, một chút trò chơi vui cuối cùng! Và ngươi cũng tới trực tiếp — ta sẽ rất thích thú khi hạ ngươi xuống đất, [ROOT.Char.GetFirstNameNoTooltip]""
  laamp_base_contract_schemes.1301.desc.encounters.first.general_reaction.taciturn: ""Hừm", [recidivist.GetFirstNameNoTooltip] lầm bầm, vuốt cằm. "Ta... đã kỳ vọng nhiều hơn thế, nếu nói thật lòng. Rõ ràng ngân sách của vị [employer.GetTitleAsNamePossessive] đang gặp khó khăn. Vậy, chúng ta bắt đầu chứ?""
  laamp_base_contract_schemes.1301.desc.encounters.second: ""Lại trở lại nhanh vậy, [ROOT.Char.GetFirstNameNoTooltip]? Lần trước ta tưởng ngươi đã học bài, nhưng có vẻ phải dạy ngươi theo cách khó khăn.""
  laamp_base_contract_schemes.1301.desc.encounters.third: ""Chết tiệt, sự bền bỉ quái ác của ngươi, [ROOT.Char.GetFirstNameNoTooltip], ngươi không ngừng quấy rầy ta sao? Đi làm việc khác đi, bởi ngươi sẽ không có đồng bạc nào từ máu của chúng ta!""
  laamp_base_contract_schemes.1301.desc.outro.1: "Khoảnh khắc căng như lưỡi dao. Nếu ta không hành động, sẽ có người khác làm, và mọi thứ sẽ hoàn toàn ngoài tầm kiểm soát."
  laamp_base_contract_schemes.1301.desc.outro.2: "Nhóm của [recidivist.GetFirstNamePossessiveNoTooltip] rõ ràng bị áp đảo về số lượng, nhưng họ vẫn quyết tâm — sẵn sàng bảo vệ thủ lĩnh, hoặc chết trong nỗ lực."
  laamp_base_contract_schemes.1301.desc.outro.3: "Một sự im lặng kinh khủng bao trùm lực lượng chúng ta. Không ai dám phá vỡ, e sợ hậu quả tiếp theo."
  laamp_base_contract_schemes.1301.desc.outro.4: "Cả hai phe nín thở chờ đợi, không chắc ta sẽ nói gì tiếp theo, hy vọng đó không phải là mệnh lệnh giết chóc."
  laamp_base_contract_schemes.1301.desc.outro.5: "[recidivist.GetFirstNameNoTooltip] không thể thắng ở đây, và [recidivist.GetSheHe] biết điều đó, ít nhất là không công khai. Nhưng nếu họ chỉ chạy thoát khỏi tầm tay ta..."
  laamp_base_contract_schemes.1301.tt.insta_win: "#P +2#! điểm chiến thắng, thắng $label_success_standard$ ngay lập tức"
  laamp_base_contract_schemes.1301.tt.score_increased: "#P +1#! điểm chiến thắng"
