  building_type_taghaza_mines_01:0 "Các ruộng muối Taghaza"
  building_type_taghaza_mines_01_desc:0 "Các mỏ muối Taghaza là điểm khởi nguồn của phần lớn lượng muối cung cấp cho Maghreb và Tây Phi."
  building_taghaza_mines_01:0 "Các hố khai thác Taghaza"
  building_taghaza_mines_01_desc:0 "$building_type_taghaza_mines_01_desc$"
  building_taghaza_mines_02:0 "Mỏ Taghaza"
  building_taghaza_mines_02_desc:1 "Khi khu định cư phát triển, ngày càng nhiều muối được khai thác. Làn sóng kỹ sư lành nghề cho phép xây dựng một mỏ thực thụ."
  building_taghaza_mines_03:0 "Mỏ Taghaza Lớn"
  building_taghaza_mines_03_desc:0 "Khi hoạt động khai mỏ mở rộng, bản thân các mỏ cũng lớn dần. Nhiều cửa vào mới được mở, cùng các giếng khai thác sâu để tăng sản lượng muối."
  building_taghaza_mines_04:0 "Tổ hợp khai mỏ Taghaza"
  building_taghaza_mines_04_desc:0 "Khi sản lượng muối gia tăng, nơi đây bắt đầu thu hút thương nhân và thợ thủ công từ khắp nơi trên thế giới."

  building_type_ijil_mines_01:0 "Các mỏ muối Ijil"
  building_type_ijil_mines_01_desc:0 "Ijil là một trong những mỏ muối lâu đời nhất châu Phi và trên nhiều phương diện còn là một trong những trung tâm trung chuyển sớm nhất của mạng lưới thương mại xuyên Sahara."
