  building_type_konasamudram_mines_01:0 "Các mỏ Konasamudram"
  building_type_konasamudram_mines_01_desc:0 "Tại Bắc Telingana, sắt thường xuất hiện thành các khối rất gần bề mặt và có thể dễ dàng khai thác với số lượng lớn. Tuy nhiên, điều đặc biệt là chất lượng sắt ở đây vượt trội, vô song trên tiểu lục địa và được công nhận rộng rãi vượt xa biên giới Ấn Độ."
