  building_type_pastures_01:3 "Đồng chăn nuôi"
  building_type_pastures_01_desc:1 "Một phần đáng kể của tỉnh này được dành cho chăn nuôi gia súc và sử dụng làm bãi chăn thả cho các đàn vật nuôi."
  building_pastures_01:1 "Bãi chăn đơn sơ"
  building_pastures_01_desc:1 "Các bãi chăn được nông dân địa phương sử dụng để nuôi những loài vật nhỏ như cừu hoặc dê."
  building_pastures_02:1 "Trang trại Nông dân"
  building_pastures_02_desc:1 "Các trang trại này là nơi sinh sống của nông dân, những người trồng ngũ cốc và nuôi gia súc phục vụ nhu cầu của chính họ."
  building_pastures_03:1 "Đồng cỏ"
  building_pastures_03_desc:1 "Đồng cỏ vừa được dùng để chăn thả, vừa để thu hoạch cỏ khô dự trữ cho những thời kỳ khó khăn."
  building_pastures_04:1 "Chuồng gia cầm"
  building_pastures_04_desc:1 "Chuồng nuôi các loài gia cầm dễ chăm sóc, được ưa chuộng nhờ cả trứng lẫn thịt."
  building_pastures_05:1 "Chuồng gia súc"
  building_pastures_05_desc:1 "Những chuồng gia súc này đủ kiên cố để giữ an toàn cho các loài vật lớn hơn."
  building_pastures_06:1 "Trại ong"
  building_pastures_06_desc:1 "Giữa rừng và ruộng, những đàn ong được nuôi trong các trại ong cho ra loại mật ong rất được săn đón."
  building_pastures_07:1 "Bãi quây"
  building_pastures_07_desc:2 "Những bãi quây lớn là nơi nuôi ngựa và các loài súc vật thồ, giữ chúng an toàn và khỏe mạnh."
  building_pastures_08:1 "Trang trại Bò"
  building_pastures_08_desc:2 "Các trang trại này lý tưởng để nuôi những đàn gia súc lớn, nhờ có bãi chăn rộng rãi và không gian di chuyển dồi dào."
 
  building_type_orchards_01:0 "Vườn cây ăn quả"
  building_type_orchards_01_desc:1 "Nhờ đặc tính độc đáo của thổ nhưỡng, những vườn cây này cho ra trái cây và quả mọng đặc biệt ngọt và thơm."
  building_orchards_01:1 "Vườn trái cây"
  building_orchards_01_desc:2 "Những vườn trái cây chuyên canh, dù có quy mô nhỏ, nhưng cho sản lượng cao hơn và chất lượng vượt trội."
  building_orchards_02:1 "Lùm cây mọng"
  building_orchards_02_desc:1 "Những hàng cây bụi cho quả mọng phá vỡ sự đơn điệu của các cây ăn quả thân gỗ."
  building_orchards_03:1 "Đồn điền Cây ăn quả"
  building_orchards_03_desc:1 "Một khu vực rộng lớn, được bố trí gọn gàng với những hàng cây được cắt tỉa kỹ lưỡng, tất cả đều cho quả hoặc hạt."
  building_orchards_04:1 "Người nuôi ong"
  building_orchards_04_desc:2 "Việc xen kẽ các trại ong giữa những hàng cây tạo ra nguồn mật ong dồi dào và giúp toàn bộ khu vườn trở nên năng suất hơn."
  building_orchards_05:1 "Hàng cây lấy hạt"
  building_orchards_05_desc:1 "Bên cạnh các cây ăn quả, những hàng cây cho hạt cũng kéo dài tít tắp."
  building_orchards_06:1 "Vườn hỗn hợp"
  building_orchards_06_desc:1 "Mọi loại cây, cả bản địa lẫn nhập khẩu, được trồng xen kẽ trong vườn — đảm bảo thu hoạch dồi dào trong mọi hoàn cảnh."
  building_orchards_07:1 "Đại vườn cây"
  building_orchards_07_desc:1 "Xa đến tận tầm mắt là hết hàng này đến hàng khác những cây ăn quả."
  building_orchards_08:1 "Cây ghép"
  building_orchards_08_desc:1 "Bằng cách ghép các giống cây nhất định lại với nhau, việc nhân giống các loại quả và hạt sinh trưởng chậm được cải thiện đáng kể."
 
  building_type_farm_estates_01:1 "Trang viên"
  building_type_farm_estates_01_desc:2 "Lãnh chúa của trang viên thuê hàng trăm nông dân để cày cấy ruộng đất và chăm sóc gia súc. Quyền lực càng lớn, họ càng kiểm soát nhiều đất đai, và quan trọng hơn hết, thu được càng nhiều thuế."
  building_farm_estates_01:1 "Dinh thự"
  building_farm_estates_01_desc:1 "Các dinh thự là nơi ở của những gia đình sở hữu đất đai, cùng gia nhân và nông dân canh tác ruộng đất của họ."
  building_farm_estates_02:1 "Vườn & Ruộng rau"
  building_farm_estates_02_desc:1 "Gắn liền với các trang viên là những khu vườn rộng lớn và ruộng rau trù phú, khiến chúng gần như có thể tự cung tự cấp."
  building_farm_estates_03:1 "Điền trang"
  building_farm_estates_03_desc:1 "Các điền trang nắm quyền quản lý ruộng đồng, rừng rậm và các công trình phụ trợ xung quanh."
  building_farm_estates_04:1 "Cánh đồng Trăm mẫu"
  building_farm_estates_04_desc:1 "Những cánh đồng rộng lớn hàng trăm mẫu sử dụng vô số nông dân, mang lại khối tài sản khổng lồ cho gia đình sở hữu."
  building_farm_estates_05:1 "Điền địa Tự do"
  building_farm_estates_05_desc:1 "Các điền địa tự do có quy mô đồ sộ với đất đai bao la; được truyền thừa qua nhiều thế hệ, các gia đình nơi đây có đủ thời gian để tối ưu hóa sản lượng từ ruộng đất."
  building_farm_estates_06:1 "Cối xay gió"
  building_farm_estates_06_desc:1 "Cối xay gió giảm đáng kể sức lao động cần thiết để xay bột, qua đó gia tăng hiệu suất một cách vượt bậc."
  building_farm_estates_07:1 "Điền sản Hợp nhất"
  building_farm_estates_07_desc:2 "Những gia đình giàu có mua lại đất đai của các hộ nghèo hơn, hợp nhất tài sản thành những điền trang rộng lớn hoạt động dưới cùng một sự quản lý và, quan trọng hơn, cùng nộp thuế."
  building_farm_estates_08:1 "Đại điền trang"
  building_farm_estates_08_desc:1 "Những điền trang đồ sộ hiếm thấy, các quần thể khổng lồ này có thể duy trì một hộ gia cư lên tới hàng nghìn người."
  farm_estates_3_4_trigger: "Yêu cầu một trong những điều sau đây:\n$EFFECT_LIST_BULLET$[holder_possessive|E] [culture|E] có #V $innovation_manorialism$#! [innovation|E], và [province|E] này là [GetTerrain( 'farmlands' ).GetName] và sở hữu [holding|E] Cấp 2\n$EFFECT_LIST_BULLET$[holder_possessive|E] [culture|E] có [GetCultureTradition('tradition_pastoralists').GetName|V] [tradition|E], và [province|E] này sở hữu [building|E] [GetBuilding('pastures_04').GetName]\n$EFFECT_LIST_BULLET$[holder_possessive|E] [culture|E] có #V $innovation_manorialism$#! và #V $innovation_champa_rice$#! [innovations|E], [province|E] này có [holding|E] Cấp 2 và quyền truy cập vào dòng [buildings|E] [GetBuilding('paddy_fields_01').GetName]"

  building_type_regimental_grounds_01:0 "Doanh trại Trung đoàn"
  building_type_regimental_grounds_01_desc:1 "Khu doanh trại này không chỉ bao gồm nhiều công trình để chứa một lượng lớn quân động viên, mà còn gắn liền với những vùng đất rộng lớn phục vụ việc huấn luyện chiến tranh."
  building_regimental_grounds_01:1 "Bãi tập Trung đoàn"
  building_regimental_grounds_01_desc:1 "Những khoảng đất rộng được chuẩn bị sẵn sàng để đón quân động viên, cung cấp không gian dồi dào cho lều trại và luyện tập."
  building_regimental_grounds_02:1 "Văn phòng Quản nhu"
  building_regimental_grounds_02_desc:1 "Văn phòng quản nhu là nơi làm việc của các viên chức đảm bảo mỗi binh lính được động viên đều có chỗ ở, nơi ngủ và vũ khí để hướng về phía kẻ thù."
  building_regimental_grounds_03:1 "Khu nhà bán kiên cố"
  building_regimental_grounds_03_desc: "Những dãy doanh trại gỗ không quá bền chắc nhưng vẫn giúp quân địa phương tránh mưa gió và giữ ấm — phần lớn là vậy."
  building_regimental_grounds_04:1 "Doanh trại Trung đoàn"
  building_regimental_grounds_04_desc:2 "Những dãy doanh trại đá kiên cố chạy dọc theo các bãi huấn luyện quân sự chuyên dụng. Một lượng quân động viên khổng lồ có thể được chuẩn bị tại đây."
  building_regimental_grounds_05:1 "Kho lương Quân sự"
  building_regimental_grounds_05_desc:1 "Các kho lương chuyên phục vụ quân động viên luôn sẵn sàng quanh năm, khiến việc triệu tập binh lính trở nên gần như không tốn công sức."
  building_regimental_grounds_06:1 "Lò rèn"
  building_regimental_grounds_06_desc:2 "Nhiều lò rèn được xây dựng xung quanh khu doanh trại, cung cấp vũ khí và sửa chữa trang bị cho quân động viên."
  building_regimental_grounds_07:2 "Khu nhà Sĩ quan"
  building_regimental_grounds_07_desc: "Khu nhà sĩ quan được xây dựng theo tiêu chuẩn cao hơn doanh trại thường, vừa để ghi nhận dũng khí của sĩ quan, vừa là mục tiêu mà binh lính nên phấn đấu đạt tới."
  building_regimental_grounds_08:1 "Doanh trại Mở rộng"
  building_regimental_grounds_08_desc:0 "$building_type_regimental_grounds_01_desc$"
 
  building_type_curtain_walls_01:1 "Tường thành & Tháp canh"
  building_type_curtain_walls_01_desc:1 "Những bức tường đá và các tháp pháo uy hiếp mang lại khả năng bảo vệ tuyệt vời trước cả cướp bóc lẫn công thành. Càng xây dựng nhiều công sự, lâu đài được bảo vệ bởi chúng càng trở nên bất khả xâm phạm."
  building_curtain_walls_01:1 "Tháp pháo & Tường bao"
  building_curtain_walls_01_desc:1 "Bước đầu tiên của bất kỳ công trình phòng thủ tử tế nào là dựng lên các tháp pháo và tường bao. Chúng làm khá tốt việc ngăn chặn kẻ địch — cũng như nông dân nổi loạn."
  building_curtain_walls_02:1 "Bailey"
  building_curtain_walls_02_desc:2 "Bailey là nơi phòng thủ tốt nhất để cất giữ các vật tư sống còn khi bị vây hãm: vũ khí, giáp trụ, và cả đầu lợn rừng muối chua."
  building_curtain_walls_03:1 "Tháp tường"
  building_curtain_walls_03_desc:1 "Các tháp tường là điểm quan sát lý tưởng, cho phép binh sĩ của ta bắn tỉa quân địch đang tiến đến một cách an toàn. Khi không có chiến tranh, chúng cũng rất thích hợp để đứng nhìn nông dân từ trên cao."
  building_curtain_walls_04:1 "Tường bao Thứ hai"
  building_curtain_walls_04_desc:1 "Việc bổ sung thêm một lớp tường bao nữa tạo nên một vị thế phòng thủ vô song. Nếu quân địch phá được lớp tường đầu tiên, chúng sẽ lập tức phải đối mặt với một lớp khác — đủ để làm nản chí bất kỳ kẻ tấn công nào!"
  building_curtain_walls_05:1 "Zwinger"
  building_curtain_walls_05_desc:1 "Khi quân địch phá được tường ngoài, chúng sẽ vô tình bị dồn vào khu vực gọi là “Zwinger” — hay còn được biết đến với cái tên #emphasis bãi giết chóc#!. Quả là một thiết kế quỷ quyệt!"
  building_curtain_walls_06:1 "Bailey Ngoại vi"
  building_curtain_walls_06_desc:1 "Nhiều tường hơn đồng nghĩa với nhiều bailey hơn, và theo đó là nhiều không gian an toàn để dự trữ vật tư hơn. Với số lượng bailey này, ta thậm chí có thể nhốt cả một chuồng ngựa chiến bên trong tường thành — rất hữu ích nếu lỡ hết đầu lợn muối chua..."
  building_curtain_walls_07:1 "Trace Italienne"
  building_curtain_walls_07_desc:1 "Trace Italienne, hay pháo đài kiểu bastion, là một dạng công sự có thể chịu được cả hỏa lực đại bác dữ dội. Dĩ nhiên là không lâu lắm, nhưng cũng đủ để cho phép rút lui an toàn qua các đường hầm bí mật."
  building_curtain_walls_08:1 "Ravelin & Cavalier"
  building_curtain_walls_08_desc:1 "Cavalier là một bệ cao cho phép binh sĩ bắn vượt qua parapet chính, thẳng vào quân địch. Đáng tiếc là điều này cũng khiến kẻ thù biết chính xác nên nhắm bắn vào đâu... May thay, binh sĩ bố trí trên các ravelin — những công trình ngoại vi hình tam giác nhằm chia cắt quân vây hãm — có thể cố gắng ngăn điều đó xảy ra."
 
  building_type_cereal_fields_01:1 "Nông trại & Ruộng đồng"
  building_type_cereal_fields_01_desc:1 "Nông trại và ruộng đồng là xương sống của mọi nền kinh tế. Nuôi sống con người, gia súc, quân đội và cả yến tiệc — không thể xem nhẹ sức mạnh của những hạt ngũ cốc giản dị."
  building_cereal_fields_01:1 "Ruộng trồng trọt"
  building_cereal_fields_01_desc:1 "Ruộng trồng trọt — trụ cột của nền kinh tế phong kiến — mỗi ruộng được canh tác bởi một gia đình nông dân nhỏ nhưng sung túc, sẵn sàng nộp phần lớn sản lượng của mình cho vương quyền!"
  building_cereal_fields_02:1 "Thôn xóm"
  building_cereal_fields_02_desc:2 "Việc xây dựng thêm nhiều thôn xóm cho phép huy động thêm nông dân làm việc trên đồng ruộng, gia tăng sản lượng và nguồn thu thuế địa phương."
  building_cereal_fields_03:1 "Nhà kho & Kho chứa"
  building_cereal_fields_03_desc:2 "Việc dựng lên các nhà kho và kho chứa lớn giúp nông dân bảo quản cỏ khô và rơm rạ, cất giữ công cụ, đồng thời cung cấp chỗ trú tạm cho các đạo quân hành quân hay kẻ lang thang."
  building_cereal_fields_04:1 "Nông trại Gia đình"
  building_cereal_fields_04_desc:2 "Những nông trại lớn hơn hỗ trợ các gia đình nông dân đông người hơn. Khi có không gian và điều kiện phát triển, họ sẽ sinh thêm con cái để tiếp tục lao động trên đồng ruộng."
  building_cereal_fields_05:1 "Kho lúa"
  building_cereal_fields_05_desc:2 "Kho lúa cho phép nông dân dự trữ ngũ cốc, thịt khô và các loại thực phẩm khác suốt mùa đông. Dù không hoàn toàn miễn nhiễm với chuột bọ, ít nhất chúng vẫn giữ được đồ bên trong khô ráo."
  building_cereal_fields_06:1 "Nhà thóc & Kho thu thuế Thập phân"
  building_cereal_fields_06_desc:2 "Nông dân tập trung phần sản lượng phải nộp cho giáo hội vào các kho thập phân — dĩ nhiên, điều này cũng giúp ta thu thuế họ dễ dàng hơn."
  building_cereal_fields_07:1 "Cánh đồng Rộng lớn"
  building_cereal_fields_07_desc:2 "Khuyến khích nông dân cày cấy những cánh đồng ngày càng lớn và gần nhau giúp tăng năng suất, dù việc lấn đất có thể gây ra mâu thuẫn giữa các hộ."
  building_cereal_fields_08:1 "Silo Ngũ cốc"
  building_cereal_fields_08_desc:2 "Những silo khổng lồ này lưu trữ lượng lớn ngũ cốc suốt cả năm, thậm chí qua nhiều năm liền, đủ sức nuôi sống một dân số cực kỳ đông đảo."

  building_type_paddy_fields_01: "Ruộng lúa nước"
  building_type_paddy_fields_01_desc: "Thế giới vận hành nhờ cái bụng no. Hạt gạo khiêm tốn có vẻ nhỏ bé, nhưng đã nuôi sống cả các quốc gia từ thuở xa xưa."
  building_paddy_fields_01: "Ruộng ngập nước"
  building_paddy_fields_01_desc: "Canh tác lúa nước phổ biến ở những vùng ẩm ướt. Hạt giống thường được gieo rồi tưới và chăm sóc, nhưng trồng lúa hiệu quả nhất chính là khi chúng được ngập nước hoàn toàn."
  building_paddy_fields_02: "Cày bừa Ruộng lúa"
  building_paddy_fields_02_desc: "Chỉ nước và đất thôi là chưa đủ để trồng lúa hiệu quả. Đất, kể cả khi ngập nước, vẫn cần được cày xới và bừa kỹ lưỡng."
  building_paddy_fields_03: "Ruộng bậc thang Tưới tiêu"
  building_paddy_fields_03_desc: "Nước rất thất thường. Nó cần được kiểm soát để duy trì sự ổn định — và khi trồng lúa, nước #italic bắt buộc#! phải ổn định."
  building_paddy_fields_04: "Kho lúa gạo"
  building_paddy_fields_04_desc: "Canh tác tốt hơn đòi hỏi bảo quản tốt hơn. Lúa gạo sẽ vô ích nếu chỉ chất đống và để hư hỏng. Những nhà kho chuyên dụng, được dựng trên cọc cao để sàn không chạm đất, giúp phơi khô và lưu trữ lúa hiệu quả."
  building_paddy_fields_05: "Ươm mạ"
  building_paddy_fields_05_desc: "Không phải toàn bộ lúa gieo trồng đều để làm lương thực. Một phần mạ non được thu hoạch sớm nhằm bảo tồn giống lúa và gia tăng lượng hạt giống cho mùa sau."
  building_paddy_fields_06: "Đa dạng Giống lúa"
  building_paddy_fields_06_desc: "'Quá nhiều điều tốt đẹp' cũng đúng với nông nghiệp như với mọi thứ khác. Chỉ trồng một loại lúa duy nhất có thể dẫn đến tổn thất nghiêm trọng nếu một năm quá khô hạn hoặc quá mưa, hơi nhiều mây, hoặc có quá nhiều #italic điều gì đó#! khác theo vô số cách. An toàn hơn nhiều nếu duy trì sự đa dạng của các giống lúa và phòng bị cho tương lai."
  building_paddy_fields_07: "Thu hoạch Tái sinh"
  building_paddy_fields_07_desc: "Những gốc lúa sau khi thu hoạch có thể được kích thích mọc chồi mới, tạo ra vụ lúa thứ hai trong cùng một mùa. Không phải giống lúa nào cũng phù hợp, nhưng khi thành công thì lợi ích là rất lớn."
  building_paddy_fields_08: "Nhà xay lúa Công nghiệp"
  building_paddy_fields_08_desc: "Lúa gạo không thể chỉ gặt về là ăn ngay. Cả một chuỗi xử lý từ làm sạch, phơi khô đến xay xát là cần thiết. Lò sấy và guồng nước giúp cơ giới hóa quá trình này."

  building_type_barracks_01:0 "Doanh trại"
  building_type_barracks_01_desc:1 "Doanh trại là những công trình kiên cố với mục đích duy nhất là chứa và chuẩn bị quân động viên cho chiến tranh."
  building_barracks_01:1 "Doanh trại Gỗ"
  building_barracks_01_desc:2 "Những doanh trại gỗ đơn sơ này cung cấp sự che chắn cơ bản khỏi thời tiết cho quân động viên trong quá trình huấn luyện."
  building_barracks_02:1 "Bãi Tập hợp Quân"
  building_barracks_02_desc:1 "Bằng cách dọn sạch một khu đất rộng, ta có thể tập hợp binh lính tại một nơi để chia đơn vị. Tầm nhìn thông thoáng cũng giúp dễ phát hiện kẻ đào ngũ."
  building_barracks_03:1 "Doanh trại Đá"
  building_barracks_03_desc:2 "Những doanh trại đá kiên cố mang lại khả năng chống chịu thời tiết vượt trội — và việc khuân đá cũng là một bài tập rèn luyện tuyệt vời."
  building_barracks_04:1 "Trại Dã chiến"
  building_barracks_04_desc:2 "Dù doanh trại cố định rất hữu ích cho huấn luyện, các trại di động bằng lều bạt giúp quân đội linh hoạt hơn trong thời chiến."
  building_barracks_05:1 "Lò rèn Quân dụng"
  building_barracks_05_desc:2 "Những thợ rèn trong trại giúp sửa chữa giáo mác rỉ sét và dụng cụ cong vênh, khiến binh sĩ của ta hiệu quả — và nguy hiểm — hơn."
  building_barracks_06:1 "Bãi Huấn luyện"
  building_barracks_06_desc:1 "Dựng bia tập và chướng ngại vật giúp ta phân loại binh lính — biết rõ ai nên đứng hàng đầu đội hình."
  building_barracks_07:1 "Trung tâm Tuyển quân"
  building_barracks_07_desc:1 "Việc xây dựng các trung tâm tuyển quân chuyên biệt ở các làng xung quanh đảm bảo nguồn binh lính dồi dào — dù phần lớn đều là những kẻ bất mãn và nát rượu."
  building_barracks_08:1 "Doanh trại Thường trực"
  building_barracks_08_desc:2 "Dù quân động viên thường phải di chuyển gấp, các doanh trại thường trực và kiên cố cho phép ta bố trí binh lính tinh nhuệ và sĩ quan."
 
  building_type_camel_farms_01:1 "Trại Lạc đà"
  building_type_camel_farms_01_desc:1 "Những trại này chuyên nuôi và nhân giống lạc đà phục vụ quân đội cũng như lao động thường nhật. Lạc đà là loài chiến mã bền bỉ, đặc biệt phù hợp với khí hậu sa mạc khắc nghiệt."
  building_camel_farms_01:1 "Người nuôi Lạc đà"
  building_camel_farms_01_desc:0 "$building_type_camel_farms_01_desc$"
  building_camel_farms_02:1 "Trạm Trinh sát"
  building_camel_farms_02_desc:1 "Kỵ sĩ lạc đà thường xuyên di chuyển giữa các trạm trinh sát, mang theo vật tư và tin tức thời cuộc."
  building_camel_farms_03:2 "Thợ làm Cung"
  building_camel_farms_03_desc:2 "Kỵ binh lạc đà phát huy hiệu quả tối đa khi được trang bị cung tên, và các thợ làm cung địa phương đảm bảo nguồn cung ổn định."
  building_camel_farms_04:1 "Chợ Lạc đà"
  building_camel_farms_04_desc:1 "Khu chợ luôn nhộn nhịp với hàng trăm con lạc đà được mua bán mỗi ngày, giúp các trại giống tiếp cận những cá thể bền bỉ nhất."
  building_camel_farms_05:1 "Bãi Tuyển mộ Du mục"
  building_camel_farms_05_desc:1 "Những du mục sa mạc hung mãnh là binh sĩ tuyệt vời — miễn là được trả công. Cung cấp chiến mã ưu việt đảm bảo lòng trung thành của họ."
  building_camel_farms_06:1 "Chuồng Quân sự"
  building_camel_farms_06_desc:1 "Những chuồng lớn và kiên cố bảo vệ các chiến lạc đà quý giá khỏi trộm cắp và cái khắc nghiệt của sa mạc."
  building_camel_farms_07:1 "Thợ giáp"
  building_camel_farms_07_desc:1 "Chế tạo giáp cho lạc đà không hề dễ, nhưng một đợt xung phong của lạc đà bọc giáp có thể khiến bất kỳ đạo quân kỵ mã nào cũng hoảng loạn tháo chạy."
  building_camel_farms_08:1 "Trại giống Cao cấp"
  building_camel_farms_08_desc:2 "Những bậc thầy thực thụ về chăn nuôi lạc đà lai tạo ra những giống lạc đà khỏe mạnh và hung hãn nhất trong vùng."
 
  building_type_logging_camps_01:1 "Lâm nghiệp"
  building_type_logging_camps_01_desc:1 "Lượng lớn gỗ, nhựa cây, than củi và tài nguyên khác được khai thác từ những khu rừng này, cung cấp nguồn vật liệu xây dựng dồi dào cho các đô thị xung quanh."
  building_logging_camps_01:1 "Trại đốn gỗ"
  building_logging_camps_01_desc:2 "Những người tiều phu dựng trại ven rừng, đảm bảo nguồn cung gỗ ổn định."
  building_logging_camps_02:1 "Người thu Nhựa cây"
  building_logging_camps_02_desc:1 "Khắp khu rừng, nhựa cây được thu gom để làm chất kết dính hoặc bán cho giáo hội dùng trong các nghi lễ."
  building_logging_camps_03:1 "Lò đốt Than"
  building_logging_camps_03_desc:2 "Những người đốt than làm việc không ngừng trong khói bụi để tạo ra vật liệu quý cho các thợ rèn."
  building_logging_camps_04:1 "Bãi chăn Rừng"
  building_logging_camps_04_desc:2 "Một số khu rừng được dành làm bãi chăn thả, cho gia súc ăn các loại hạt, quả và lá cây."
  building_logging_camps_05:1 "Ruộng Khai phá"
  building_logging_camps_05_desc:1 "Nơi từng là rừng rậm nay trở thành ruộng đồng màu mỡ."
  building_logging_camps_06:1 "Bãi ong Rừng"
  building_logging_camps_06_desc:1 "Các trại ong được đặt ven rừng để tận dụng nguồn hoa dại phong phú."
  building_logging_camps_07:1 "Xưởng Thủy tinh Rừng"
  building_logging_camps_07_desc:1 "Rừng là địa điểm lý tưởng cho thợ thổi thủy tinh, nhờ nguồn nguyên liệu sẵn có."
  building_logging_camps_08:1 "Xưởng cưa"
  building_logging_camps_08_desc:2 "Xưởng cưa là một bước tiến lớn so với rìu. Rừng có thể bị khai thác cực nhanh, cung cấp gỗ cho các thành thị."
 
  building_type_peat_quarries_01:1 "Nông trại Đất ngập nước"
  building_type_peat_quarries_01_desc:1 "Dù đất ngập nước không màu mỡ như đồng bằng, thảm thực vật phong phú vẫn hỗ trợ tốt chăn nuôi và cho phép khai thác than bùn cùng muối."
  building_peat_quarries_01:1 "Đất chăn thả Gia súc"
  building_peat_quarries_01_desc:2 "Độ phì nhiêu của vùng đầm lầy tạo nên bãi chăn lý tưởng cho mọi loại gia súc."
  building_peat_quarries_02:1 "Mỏ Than bùn"
  building_peat_quarries_02_desc:1 "Một lượng lớn than bùn được khai thác tại đây, hỗ trợ phát triển nông nghiệp."
  building_peat_quarries_03:1 "Đồng cỏ Khô"
  building_peat_quarries_03_desc:2 "Cỏ mọc dày quanh vùng đất ngập nước, được thu hoạch làm thức ăn gia súc mùa đông."
  building_peat_quarries_04:1 "Giếng Muối"
  building_peat_quarries_04_desc:1 "Công nhân đun nước trong chảo lớn để chiết xuất muối, dùng để ướp thịt và buôn bán."
  building_peat_quarries_05:1 "Đầm lầy có Tường bao"
  building_peat_quarries_05_desc:1 "Việc xây tường giúp kiểm soát cây trồng và bảo vệ mùa màng giá trị."
  building_peat_quarries_06:1 "Ruộng Đất ngập nước"
  building_peat_quarries_06_desc:1 "Tính chất đặc biệt của vùng đất này cho phép trồng các loại cây như gai dầu hay lanh."
  building_peat_quarries_07:1 "Mỏ Than bùn Lớn"
  building_peat_quarries_07_desc:1 "Than bùn được khai thác ngày càng nhiều và xuất khẩu rộng rãi làm phân bón."
  building_peat_quarries_08:1 "Trang trại Đầm lầy Lớn"
  building_peat_quarries_08_desc:1 "Những đàn gia súc lớn ăn no trên thảm thực vật phong phú của vùng đất ngập nước."
 
  building_type_hill_farms_01:0 "Nông trại Đồi núi"
  building_type_hill_farms_01_desc:1 "Những ngọn đồi uốn lượn phủ đầy ruộng nương. Canh tác trên sườn dốc giúp thoát nước tốt, nhưng diện tích hạn chế khiến sản lượng thấp."
  building_hill_farms_01:1 "Ruộng sườn đồi"
  building_hill_farms_01_desc:1 "Dọc các sườn đồi là nhiều thửa ruộng nhỏ nuôi sống một cộng đồng nông dân thưa thớt."
  building_hill_farms_02:1 "Bãi chăn Cao nguyên"
  building_hill_farms_02_desc:2 "Gia súc được đưa lên vùng cao nguyên hoang hóa để gặm cỏ dồi dào."
  building_hill_farms_03:1 "Hầm chứa Củ"
  building_hill_farms_03_desc:1 "Các hầm chứa cho phép bảo quản rau củ quanh năm — điều sống còn ở vùng đồi kém màu mỡ."
  building_hill_farms_04:1 "Ruộng Rau"
  building_hill_farms_04_desc:1 "Những cánh đồng rau lớn cung cấp lương thực cần thiết cho các nông trại thưa thớt."
  building_hill_farms_05:1 "Lynchet"
  building_hill_farms_05_desc:2 "Dẫn nước từ suối vào các bậc thềm giúp tăng mạnh độ phì nhiêu của ruộng sườn đồi."
  building_hill_farms_06:1 "Đường & Bậc thang"
  building_hill_farms_06_desc:2 "Đường sá và bậc thang kết nối các nông trại rải rác, giúp việc di chuyển, liên lạc và vận chuyển hàng hóa nhanh hơn."
  building_hill_farms_07:1 "Kho lương Mùa đông"
  building_hill_farms_07_desc:2 "Lượng lớn gia súc và con người được nuôi sống suốt mùa đông nhờ thực phẩm dự trữ trong các kho này."
  building_hill_farms_08:1 "Vườn Táo"
  building_hill_farms_08_desc:1 "Những ngọn đồi uốn lượn tạo điều kiện lý tưởng cho vườn cây ăn quả, đặc biệt là táo."
 
  building_type_hill_forts_01:0 "Pháo đài đồi"
  building_type_hill_forts_01_desc:1 "Được xây dựng trên các ngọn đồi dốc hoặc vách đá, những công trình phòng thủ đồ sộ này đứng vững trước mọi đạo quân vây hãm — trừ khi chúng có khả năng bay lượn!"
  building_hill_forts_01:1 "Pháo đài đồi nhỏ"
  building_hill_forts_01_desc:1 "Pháo đài đồi hiên ngang trên đỉnh cao, buộc mọi kẻ vây hãm phải chiến đấu trong thế bất lợi khi tấn công lên dốc."
  building_hill_forts_02:1 "Công sự đất đơn giản"
  building_hill_forts_02_desc:1 "Pháo đài được bao quanh bởi các công sự đất, tạo thành những bức tường đất gần như không thể xuyên phá, đủ làm nản chí cả những binh sĩ gan lì nhất."
  building_hill_forts_03:1 "Hào phòng thủ"
  building_hill_forts_03_desc:2 "Những con hào lớn được đào quanh đỉnh đồi phòng thủ. Do vách hào lầy lội và trơn trượt, những kẻ tấn công liều lĩnh có thể bị mắc kẹt dưới đáy, rồi bị chôn vùi trong bùn khi đồng đội phía sau tràn lên."
  building_hill_forts_04:1 "Hàng rào gỗ nhọn"
  building_hill_forts_04_desc:1 "Những bức tường lớn làm từ thân gỗ vót nhọn bao quanh pháo đài, tạo thêm một chướng ngại nguy hiểm trước khi chạm tới kho báu bên trong."
  building_hill_forts_05:1 "Nhà gác"
  building_hill_forts_05_desc:1 "Các nhà gác được bố trí quanh pháo đài, với lính canh luôn cảnh giác, sẵn sàng ứng phó ngay khi cuộc tấn công bắt đầu."
  building_hill_forts_06:1 "Tường ngoài"
  building_hill_forts_06_desc:1 "Những bức tường đá lớn nay bao quanh pháo đài đồi, dứt khoát khẳng định bản chất bất khả xâm phạm của nó."
  building_hill_forts_07:1 "Pháo đài đồi lớn"
  building_hill_forts_07_desc:1 "Pháo đài trung tâm đã được mở rộng và cải tiến đáng kể, nay vươn cao uy nghi, sừng sững hướng lên bầu trời."
  building_hill_forts_08:1 "Công sự đất phức hợp"
  building_hill_forts_08_desc:1 "Hệ thống công sự đất bao quanh pháo đài đồi phức tạp và rối rắm đến mức quân địch hầu như không biết nên tấn công lối nào — điều này mang lại lợi thế lớn cho chúng ta, nhất là khi một nửa số lối đó dẫn thẳng tới những cái bẫy chết người..."
 
  building_type_plantations_01:1 "Nông nghiệp sa mạc"
  building_type_plantations_01_desc:1 "Những đồn điền này tập trung trồng các loại trái cây và rau củ đủ sức chịu đựng khí hậu khắc nghiệt."
  building_plantations_01:1 "Đồn điền nhỏ"
  building_plantations_01_desc:1 "Bất chấp sự thiếu nước, các đồn điền nhỏ này vẫn thành công trong việc trồng những loại trái cây đặc biệt bền bỉ."
  building_plantations_02:1 "Trạm giao thương"
  building_plantations_02_desc:1 "Những du mục sa mạc dẻo dai di chuyển giữa các trạm giao thương, mang theo lương thực đến những nơi cần thiết nhất."
  building_plantations_03:1 "Thợ dệt"
  building_plantations_03_desc:1 "Các thợ dệt kéo sợi trong xưởng của mình, sau đó trao đổi vải vóc với các du mục sa mạc."
  building_plantations_04:1 "Mạch nước ngầm"
  building_plantations_04_desc:1 "Trong điều kiện nước khan hiếm, một giếng mới chắc chắn giúp khu vực thịnh vượng. Nhiều mạch nước như vậy đã được phát hiện và các giếng kiên cố đã được xây dựng."
  building_plantations_05:1 "Caravanserai"
  building_plantations_05_desc:1 "Các đoàn lữ hành lớn cần nơi nghỉ chân để thú vật được hồi sức. Caravanserai cung cấp không gian cần thiết và cũng là nơi lý tưởng để đánh thuế hàng hóa."
  building_plantations_06:1 "Vườn chà là"
  building_plantations_06_desc:1 "Khi nhiều đất đai trở nên phù hợp cho đồn điền, các vườn chà là được canh tác. Chà là ngọt có thể bảo quản lâu và là mặt hàng quý giá với giới thương nhân."
  building_plantations_07:1 "Thủy lợi"
  building_plantations_07_desc:1 "Bằng cách dẫn nước từ giếng để làm ngập ruộng, đất đai có thể nuôi sống nhiều hơn mức canh tác tự cung tự cấp. Tuy nhiên, đây là công việc lớn — khiến sa mạc nở hoa chưa bao giờ dễ dàng."
  building_plantations_08:1 "Đồn điền lớn"
  building_plantations_08_desc:1 "Các đồn điền này nay tạo ra lượng dư thừa rõ rệt, có thể đem trao đổi và buôn bán để thu lợi."
 
  building_type_outposts_01:0 "Tiền đồn"
  building_type_outposts_01_desc:1 "Một chuỗi tiền đồn bao quanh mọi khu định cư quan trọng trong tỉnh, tạo thành hệ thống cảnh báo sớm trước các cuộc cướp phá hay thú dữ tấn công."
  building_outposts_01:1 "Tháp canh"
  building_outposts_01_desc:1 "Để theo dõi thú dữ (và các cuộc tập kích), một loạt điểm quan sát được canh giữ bởi lính gác cảnh giác. Khi phát hiện mối nguy hiểm, tin tức lan truyền rất nhanh để gia súc dễ tổn thương kịp thời được đưa đến nơi an toàn."
  building_outposts_02:1 "Tiền đồn quân sự"
  building_outposts_02_desc:1 "Dọc theo các con đường và lối mòn uốn khúc là nhiều tiền đồn do lính gác phục vụ cho thương nhân địa phương trấn giữ. Sự hiện diện của họ đảm bảo khu vực luôn yên bình và an toàn, không có thổ phỉ."
  building_outposts_03:2 "Kho vũ khí bí mật"
  building_outposts_03_desc:1 "Một lợi thế của việc sống ở địa hình hiểm trở là khả năng ngụy trang gần như mọi thứ. Khi bị tập kích, người dân địa phương có thể tự vũ trang từ vô số kho vũ khí được giấu kín."
  building_outposts_04:1 "Tiền đồn hàng rào gỗ"
  building_outposts_04_desc:1 "Những tiền đồn xiêu vẹo cũ kỹ nay được thay thế bằng các tháp gỗ palisade vững chắc. Hơn nữa, chúng gần như được ngụy trang hoàn hảo trong địa hình gồ ghề."
  building_outposts_05:1 "Trạm tập kết quân"
  building_outposts_05_desc:1 "Gần mỗi tháp nay có một trạm tập kết. Trong thời kỳ tổng động viên, nông dân bị trưng binh có thể an toàn tập hợp tại đây, nơi họ tìm thấy cả vũ khí lẫn sự bảo vệ."
  building_outposts_06:1 "Tiền đồn biên giới"
  building_outposts_06_desc:1 "Trái ngược với các tiền đồn ẩn mình, loại tiền đồn biên giới được xây dựng nhằm răn đe. Làm từ vật liệu bền chắc hơn, kích thước đồ sộ của những tháp này đủ khiến mọi kẻ cướp phải quay đầu bỏ chạy."
  building_outposts_07:1 "Trạm trinh sát"
  building_outposts_07_desc:1 "Để đảm bảo trinh sát của ta được tiếp tế đầy đủ và có thể di chuyển gọn nhẹ, chúng ta đã dựng nên một loạt trạm trinh sát bố trí chiến lược. Được che giấu kỹ khỏi ánh mắt dò xét của kẻ thù, những công trình này cho phép thu thập tình báo vượt trội trong thời kỳ xâm lược."
  building_outposts_08:1 "Tiền đồn kiên cố"
  building_outposts_08_desc:1 "Những tiền đồn bằng đá đồ sộ nay vươn cao lên bầu trời, khẳng định sự hiện diện của mình với binh sĩ và lính bảo vệ đoàn lữ hành trú đóng bên trong."
 
  building_type_watchtowers_01:0 "Tháp canh"
  building_type_watchtowers_01_desc:1 "Nhiều tháp canh lớn đứng gác cho tầng lớp nông dân lao động, cung cấp vị trí quan sát tuyệt vời cho cung thủ."
  building_watchtowers_01:1 "Tháp gạch bùn"
  building_watchtowers_01_desc:1 "Những tháp làm từ gạch bùn này mang lại khả năng phòng thủ đơn giản nhưng hiệu quả."
  building_watchtowers_02:1 "Nhà tháp"
  building_watchtowers_02_desc:1 "Những nhà tháp được xây dựng vừa để phòng thủ vừa để sinh sống, chiếm giữ các vị trí chiến lược."
  building_watchtowers_03:1 "Tháp canh gỗ"
  building_watchtowers_03_desc:1 "Nhiều tháp canh gỗ quan sát nông dân đang làm việc trên đồng ruộng. Từ vị trí cao, các cung thủ mang lại sự bảo vệ hiệu quả."
  building_watchtowers_04:1 "Tháp giữ gạch bùn nhỏ"
  building_watchtowers_04_desc:1 "Các tháp giữ bằng gạch bùn được cải tiến, tuy nhỏ nhưng mang lại khả năng phòng thủ vượt trội so với tháp canh thông thường. Trong thời chiến, chúng có thể bảo vệ nhiều nông dân khỏi bọn cướp, thậm chí còn chứa được một kho lương nhỏ cho những lúc khó khăn."
  building_watchtowers_05:1 "Tháp canh đá"
  building_watchtowers_05_desc:1 "Những tháp canh này cung cấp tầm quan sát tuyệt vời, không chỉ cho cung thủ mà còn cho các lãnh chúa khi thị sát nông dân."
  building_watchtowers_06:1 "Lỗ châu mai"
  building_watchtowers_06_desc:1 "Bằng cách xây dựng các lỗ bắn trên tháp, tầm bắn và khả năng bảo vệ của cung thủ được gia tăng đáng kể."
  building_watchtowers_07:1 "Tháp Peel"
  building_watchtowers_07_desc:1 "Những nhà tháp nhỏ này được gia cố kiên cố và thể hiện uy thế của chủ nhân. Khi bị cướp bóc, cả đàn gia súc có thể được đưa vào trong tháp để bảo vệ."
  building_watchtowers_08:1 "Tháp mái vòm"
  building_watchtowers_08_desc:1 "Những tháp uy nghi này được xây hoàn toàn bằng đá và chóp bằng mái vòm. Kỹ thuật xây dựng khiến chúng gần như không thể bị bọn cướp công phá."
 
  building_type_quarries_01:1 "Mỏ đá"
  building_type_quarries_01_desc:1 "Các dãy núi của tỉnh này cung cấp nguồn vật liệu xây dựng dồi dào cho các công trình địa phương."
  building_quarries_01:1 "Mỏ đá đơn giản"
  building_quarries_01_desc:2 "Đá khai thác dễ tiếp cận cung cấp vật liệu xây dựng cho các công trình lân cận."
  building_quarries_02:1 "Mỏ quặng nông"
  building_quarries_02_desc:1 "Những mỏ đơn giản nằm dọc chân núi, thu thập quặng từ các mạch quặng lộ thiên dễ khai thác."
  building_quarries_03:1 "Cối xay nước"
  building_quarries_03_desc:1 "Bằng cách dẫn nước đến khu khai thác, năng lượng của nó được khai thác thông qua cối xay nước để vận hành công cụ hỗ trợ đào bới."
  building_quarries_04:1 "Mỏ đá lớn"
  building_quarries_04_desc:1 "Khi nhu cầu vật liệu xây dựng tăng cao, các mỏ đá thu hút ngày càng nhiều lao động. Mỗi năm trôi qua, mỏ ngày càng mở rộng và đào sâu hơn."
  building_quarries_05:1 "Mỏ lớn"
  building_quarries_05_desc:1 "Nhu cầu kim loại không ngừng tăng, và chỉ kỹ thuật mới là chưa đủ — sản lượng phải được mở rộng, và nhiều mỏ mới được khai trương!"
  building_quarries_06:1 "Mỏ đá khổng lồ"
  building_quarries_06_desc:1 "Nhiều mỏ lộ thiên khổng lồ cho thấy công nhân đục đẽo các khối đá ở quy mô gần như công nghiệp. Những mỏ cạn kiệt nằm há miệng khắp tỉnh, vật liệu của chúng nay tạo nên vô số lâu đài và tường thành."
  building_quarries_07:1 "Mỏ giếng đứng"
  building_quarries_07_desc:1 "Với sự ra đời của kỹ thuật mới, công nhân có thể tiếp cận các mạch kim loại sâu hơn dưới bề mặt, quan trọng nhất là phương pháp mới để thoát nước khỏi các giếng bị ngập."
  building_quarries_08:2 "Bơm nước cơ giới"
  building_quarries_08_desc:2 "Các máy bơm nước bằng gỗ, vận hành bằng cối xay gió hoặc ngựa phía trên, có thể hút nước khỏi các giếng mỏ nhanh hơn rất nhiều so với vài chiếc xô da."
 
  building_type_military_camps_01:1 "Trại dân binh"
  building_type_military_camps_01_desc:2 "Một bãi huấn luyện đơn giản, nơi bộ binh trang bị nhẹ được chuẩn bị cho chiến tranh."
  building_military_camps_01:1 "Lều da"
  building_military_camps_01_desc:1 "Khi triệu tập quân, họ được tập trung trong những trại tạm bợ với các lều đơn giản để ngủ. Dù không mấy thoải mái, đây là loại trại rẻ và dễ di chuyển."
  building_military_camps_02:1 "Bếp trại"
  building_military_camps_02_desc:1 "Bằng cách phân công một phần dân binh thu thập và chuẩn bị thức ăn cho số còn lại, nhiều người hơn từ vùng quê bị thu hút — bị hấp dẫn bởi mùi thức ăn."
  building_military_camps_03:1 "Bãi huấn luyện"
  building_military_camps_03_desc:1 "Bia bắn và hình nộm mang lại cho dân binh vừa sự giải trí vừa một chút huấn luyện, trước khi họ bị ném vào khói lửa chiến trường."
  building_military_camps_04:1 "Trạm gác"
  building_military_camps_04_desc:1 "Các trạm gác đóng vai trò là đèn hiệu, điểm quan sát và nơi tập kết tự nhiên. Ngay cả khi không trong thời kỳ tổng động viên, lính gác vẫn luôn túc trực tại đây."
  building_military_camps_05:1 "Thợ rèn trại"
  building_military_camps_05_desc:1 "Các thợ rèn trong trại thực hiện sửa chữa đơn giản và đóng móng ngựa."
  building_military_camps_06:1 "Nhà tập kết"
  building_military_camps_06_desc:1 "Những nhà tập kết chuyên dụng được đặt tại mỗi làng giúp việc trưng binh trở nên dễ dàng hơn nhiều."
  building_military_camps_07:1 "Doanh trại dân binh"
  building_military_camps_07_desc:1 "Mỗi thị trấn nay đều có doanh trại dân binh riêng, nơi cất giữ vũ khí khi cần thiết. Doanh trại cũng là nơi họp mặt của các sĩ quan phụ trách việc tập kết."
  building_military_camps_08:1 "Quảng trường tập kết"
  building_military_camps_08_desc:1 "Những quảng trường tập kết lớn không chỉ là nơi binh sĩ hội tụ mà còn là nơi huấn luyện cho các trận chiến sắp tới."
 
  building_type_ramparts_01:1 "Pháo đài rừng"
  building_type_ramparts_01_desc:1 "Những công sự này được xây dựng sao cho trở thành một phần của khu rừng mà chúng bảo vệ. Đạo quân tiến công không chỉ bị cản trở bởi công sự mà còn bị vướng víu trong thảm thực vật rậm rạp."
  building_ramparts_01:1 "Pháo đài gỗ"
  building_ramparts_01_desc:1 "Những pháo đài gỗ nhỏ hòa vào rừng, tận dụng cây cối làm hàng rào tự nhiên."
  building_ramparts_02:1 "Lũy đất"
  building_ramparts_02_desc:1 "Những bờ đất dài tạo thành ranh giới phòng thủ quanh pháo đài, cản trở bước tiến của kẻ thù."
  building_ramparts_03:1 "Bẫy & hào"
  building_ramparts_03_desc:1 "Khi kẻ địch tưởng rằng có thể tiếp cận công sự an toàn, chúng sẽ sớm nhận ra mình bị mắc kẹt hoặc bị xiên bởi vô số cạm bẫy ẩn giấu khắp khu rừng."
  building_ramparts_04:1 "Tường lũy"
  building_ramparts_04_desc:1 "Tường đá và hàng rào gỗ nay bảo vệ các pháo đài khỏi quân địch đang tiến tới, làm chậm đáng kể mọi nỗ lực xuyên qua khu rừng."
  building_ramparts_05:1 "Khe bắn"
  building_ramparts_05_desc:1 "Bằng cách xây dựng các khe bắn trên tường, chúng ta có thể dễ dàng quan sát và bắn tên vào kẻ thù đang tiến đến."
  building_ramparts_06:1 "Công sự dã chiến"
  building_ramparts_06_desc:1 "Bằng cách nhanh chóng dựng công sự đất tại những nơi dự đoán kẻ địch sẽ đi qua, chúng ta có thể đánh lừa và bao vây chúng khi chúng tìm cách vòng qua rừng."
  building_ramparts_07:2 "Tường lũy có răng cưa"
  building_ramparts_07_desc:1 "Việc cải tiến thành lũy bằng các răng cưa giúp ta có lợi thế rõ rệt trong mọi cuộc vây hãm, cho phép binh sĩ di chuyển tương đối an toàn và đáp trả mọi cuộc tấn công."
  building_ramparts_08:1 "Pháo đài rừng lớn"
  building_ramparts_08_desc:1 "Những pháo đài đá lớn này vươn lên khỏi rừng như những ngọn núi, bảo vệ một vùng đất rộng lớn."
 
  building_type_elephant_pens_01:1 "Trại voi"
  building_type_elephant_pens_01_desc:1 "Voi được nuôi giữ và huấn luyện tại đây. Chúng là những con vật thồ tuyệt vời, hữu ích cho cả lao động lẫn chiến tranh."
  building_elephant_pens_01:1 "Chuồng voi"
  building_elephant_pens_01_desc:1 "Những chuồng trại kiên cố này có thể giữ an toàn ngay cả những con voi hung dữ nhất."
  building_elephant_pens_02:1 "Bẫy voi"
  building_elephant_pens_02_desc:1 "Những con voi mới được thu thập bằng nhiều phương pháp khác nhau, như hố bẫy hoặc thòng lọng. Đôi khi, một con voi cái còn được dùng làm mồi nhử."
  building_elephant_pens_03:1 "Bãi huấn luyện voi"
  building_elephant_pens_03_desc:1 "Voi không phải loài dễ huấn luyện, nhưng tại các bãi huấn luyện, những người thuần dưỡng dày dạn kinh nghiệm làm mọi cách để cung cấp cho vương triều những mãnh thú chiến tranh."
  building_elephant_pens_04:1 "Bãi cưỡi voi"
  building_elephant_pens_04_desc:1 "Tại bãi cưỡi, voi được đưa vào thử nghiệm, mang theo kíp điều khiển, giáp trụ và trang bị."
  building_elephant_pens_05:1 "Văn phòng giám sát"
  building_elephant_pens_05_desc:1 "Các giám sát viên chịu trách nhiệm cho phúc lợi của voi, và việc xây dựng văn phòng phù hợp giúp đảm bảo hiệu quả công việc của họ."
  building_elephant_pens_06:1 "Bệnh viện voi"
  building_elephant_pens_06_desc:1 "Những bệnh viện voi chuyên dụng đủ lớn để tiếp nhận cả con đực to lớn nhất, cứu sống những con vật vốn chắc chắn sẽ bị mất đi."
  building_elephant_pens_07:1 "Khu bảo tồn voi"
  building_elephant_pens_07_desc:1 "Bằng cách chỉ định những khu vực rừng lớn làm khu bảo tồn cho voi, chúng ta đảm bảo ít voi bị săn trộm hơn và quần thể được duy trì ổn định."
  building_elephant_pens_08:1 "Trại nhân giống voi"
  building_elephant_pens_08_desc:1 "Những người nhân giống voi đảm bảo rằng các voi con mới sinh ra và được nuôi dưỡng chỉ đến từ những cá thể khỏe mạnh và ưu tú nhất."
 
  building_type_guild_halls_01:1 "Phường hội"
  building_type_guild_halls_01_desc:1 "Thành phố cung cấp không gian rộng rãi cho tất cả các phường hội lớn và những gia tộc thị dân để tổ chức và thực hành nghề thủ công của họ."
  building_guild_halls_01:0 "Hội quán Phường hội"
  building_guild_halls_01_desc:0 "$building_type_guild_halls_01_desc$"
  building_guild_halls_02:1 "Phường hội Thợ chạm khắc"
  building_guild_halls_02_desc:1 "Thợ chạm khắc tạo ra các vật phẩm từ gỗ hoặc xương như khung, đồ trang trí hoặc công cụ. Họ cũng chạm khắc khiên huy hiệu, khiến phường hội này rất được giới quý tộc ưa chuộng."
  building_guild_halls_03:1 "Phường hội Thợ mộc"
  building_guild_halls_03_desc:1 "Thợ mộc làm việc trong lĩnh vực xây dựng, chủ yếu sử dụng gỗ làm vật liệu chính. Dịch vụ của họ được cả quý tộc lẫn giáo sĩ săn đón, đặc biệt là các chi tiết mộc trang trí tinh xảo cho nhà thờ và điền trang."
  building_guild_halls_04:1 "Phường hội Thợ săn"
  building_guild_halls_04_desc:1 "Thợ săn buôn bán thịt và da thú, dịch vụ của họ giúp cả thợ mổ lẫn thợ thuộc da thực hiện nghề nghiệp của mình. Những tấm da tốt nhất tự nhiên sẽ thuộc về các gia tộc quý tộc danh giá nhất."
  building_guild_halls_05:1 "Phường hội Thợ xây"
  building_guild_halls_05_desc:1 "Thợ xây làm việc với đá, vừa trong xây dựng vừa trong điêu khắc. Tay nghề của họ được săn đón rộng rãi, bởi chuyên môn của họ là vô giá khi xây dựng các công trình phòng thủ."
  building_guild_halls_06:1 "Phường hội Thợ may"
  building_guild_halls_06_desc:1 "Kim, chỉ và vải là vũ khí mà thợ may sử dụng. Với kỹ năng vượt trội, họ tạo ra những bộ y phục tuyệt đẹp dành cho giới quý tộc."
  building_guild_halls_07:1 "Phường hội Thợ thủy tinh"
  building_guild_halls_07_desc:1 "Thợ thủy tinh tạo ra những vật phẩm hấp dẫn từ thủy tinh, từ ly chén cho đến ô cửa sổ. Sở hữu các vật dụng bằng thủy tinh là biểu tượng của uy tín, khiến dịch vụ của họ cực kỳ được săn đón."
  building_guild_halls_08:1 "Phường hội Nghệ nhân"
  building_guild_halls_08_desc:1 "Nghệ nhân sử dụng nhiều loại vật liệu khác nhau không chỉ để tạo ra tác phẩm nghệ thuật mà còn để sáng chế ra những cải tiến hoàn toàn mới. Sự khéo léo và tinh xảo của họ đang thu hút sự chú ý của các đại quý tộc khắp nơi."
 
  building_type_monastic_schools_01:1 "Tu viện"
  building_type_monastic_schools_01_desc:1 "Ngôi trường này giảng dạy nhiều môn học và là một trung tâm học thuật hiếm hoi, nhưng các học viên theo học chủ yếu để chuẩn bị cho sự nghiệp tương lai trong hàng ngũ giáo sĩ."
  building_monastic_schools_01:1 "Nhà nguyện"
  building_monastic_schools_01_desc:1 "Một nơi thờ phụng khiêm nhường và tĩnh lặng để các tín đồ cầu nguyện và suy ngẫm."
  building_monastic_schools_02:1 "Sảnh cầu nguyện"
  building_monastic_schools_02_desc:1 "Các sảnh cầu nguyện tổ chức các buổi giảng đạo và cung cấp không gian để tĩnh tâm suy niệm."
  building_monastic_schools_03:2 "Trường Tu viện"
  building_monastic_schools_03_desc:2 "$building_type_monastic_schools_01_desc$"
  building_monastic_schools_04:2 "Vườn Tu viện"
  building_monastic_schools_04_desc:2 "Những khu vườn của tu viện mang đến một không gian tĩnh lặng để các tín đồ suy ngẫm và đắm mình trong vẻ đẹp của tạo hóa."
  building_monastic_schools_05:2 "Đại học Tu viện"
  building_monastic_schools_05_desc:2 "Trường đại học cung cấp nền giáo dục sâu rộng trong nhiều lĩnh vực thiêng liêng như thần học, dịch thuật và luật giáo hội."
  building_monastic_schools_06:2 "Khoa Triết học"
  building_monastic_schools_06_desc:2 "Tại đây giảng dạy triết học cổ đại, và các tu sĩ thường áp dụng những tư tưởng này vào đời sống hằng ngày."
  building_monastic_schools_07:2 "Đài thiên văn"
  building_monastic_schools_07_desc:2 "Các tu sĩ quan sát các vì sao để xác định thời điểm chính xác cho những ngày lễ quan trọng trong lịch tôn giáo và mở rộng hiểu biết về tạo hóa."
  building_monastic_schools_08:1 "Hành lang Tu viện"
  building_monastic_schools_08_desc:1 "Hành lang tu viện tạo thành một rào chắn vững chắc ngăn cách với thế giới bên ngoài, tách biệt đời sống bên trong khỏi dân thường bên ngoài."

  building_type_megalith_01:0 "Cự thạch"
  building_type_megalith_01_desc:0 "Công trình này là một quần thể đá ngoài trời, thường được sắp xếp theo các vì sao và chòm sao. Những đức tin tôn sùng cự thạch cung cấp nơi thờ phụng thường xuyên và ít tốn kém cho tín đồ, thu hút lữ khách và người hành hương."
  building_megalith_01:0 "Cự thạch Nhỏ"
  building_megalith_01_desc:0 "Quần thể đá ngoài trời này hoạt động như một nơi thờ phụng công cộng cố định. Công trình khiêm tốn được dựng từ những tảng đá phổ thông theo bố cục đơn giản, chỉ phục vụ được một số ít tín đồ."
  building_megalith_02:0 "Lăng mộ Cự thạch"
  building_megalith_02_desc:0 "Khu vực này đã được mở rộng với nhiều quần thể đá hơn để phục vụ đông đảo tín đồ. Bên cạnh việc mở rộng Cự thạch, một lăng mộ ngầm cũng được xây dựng để chôn cất những nhân vật quan trọng."
  building_megalith_03:0 "Bàn thờ Cự thạch"
  building_megalith_03_desc:0 "Quần thể đá ngoài trời này hoạt động như một nơi thờ phụng công cộng cố định. Cự thạch này được xây dựng từ những loại đá đắt giá và kỳ lạ từ khắp khu vực, đồng thời được trang bị các bàn thờ phục vụ nghi lễ."
  building_megalith_04:0 "Cự thạch Lớn"
  building_megalith_04_desc:1 "Cùng với vô số bàn thờ và vật phẩm nghi lễ, Cự thạch này đã được mở rộng với những khối đá nguyên khối khổng lồ và đầy choáng ngợp, được chạm khắc tinh xảo bằng các biểu tượng linh thiêng."
  building_megalith_05:1 "Đền thờ Địa phương"
  building_megalith_05_desc:1 "Những ngôi đền nhỏ và nơi thờ phụng được dựng xen giữa các Cự thạch, mang lại không gian yên tĩnh để người hành hương suy niệm."
  building_megalith_06:1 "Mộ Cự thạch"
  building_megalith_06_desc:1 "Các vị lãnh tụ vĩ đại, chiến binh và nhân vật thánh thiện được an táng trong những bàn thờ trên mặt đất này. Đây là nơi để người hành hương và tín đồ tôn kính tổ tiên đã khuất."
  building_megalith_07:1 "Đống đá Hành hương"
  building_megalith_07_desc:1 "Những đống đá nhỏ được dựng rải rác trong vùng hoang dã quanh khu cự thạch, dẫn đường cho người hành hương và lữ khách đến các bàn thờ để cầu nguyện."
  building_megalith_08:1 "Cự thạch Huyền thoại"
  building_megalith_08_desc:1 "Cự thạch này đã phát triển đến mức trở thành một huyền thoại địa phương. Các tín đồ khẳng định họ cảm nhận được sự gắn kết sâu sắc với đức tin của mình khi đứng tại nơi này."
  building_type_great_megalith_01:0 "Đại Cự thạch"
  building_type_great_megalith_01_desc:0 "Một phiên bản cực kỳ tham vọng của Cự thạch, dự án Đại Cự thạch bao phủ cả vùng nông thôn bằng những công trình cự thạch nhỏ xoay quanh một công trình trung tâm khổng lồ."
  building_great_megalith_01:0 "Đại Cự thạch"
  building_great_megalith_01_desc:0 "Đại Cự thạch là một vòng tròn đá rộng lớn và ngoạn mục trải dài khắp cảnh quan, với vô số địa điểm nhỏ hơn rải rác khắp vùng. Mở cửa cho tất cả mọi người, nó đưa tín đồ và người hành hương từ khắp thế giới đến gần hơn với thần linh."
  building_type_hospices_01: "Nhà Tế bần"
  building_type_hospices_01_desc: "Nhà tế bần cung cấp nơi nghỉ ngơi cho người bệnh và kiệt sức, nơi họ được chăm sóc bởi những người thánh thiện tận tâm."
  building_hospices_01: "Khu Lưu trú Hành hương"
  building_hospices_01_desc: "Nhiều người hành hương được phép lưu trú và nghỉ ngơi tại đây khi cần trú ẩn trong những chuyến đi dài. Tại đây họ còn được cung cấp thức ăn, đồ uống và đôi khi cả việc tắm rửa."
  building_hospices_02: "Nhà Điều dưỡng"
  building_hospices_02_desc: "Một khu điều dưỡng khiêm tốn được xây dựng nhằm cách ly luồng khí ô uế của người bệnh khỏi người khỏe mạnh và mang lại không gian yên tĩnh để chữa trị."
  building_hospices_03: "Khu Chăm sóc"
  building_hospices_03_desc: "Trong thời chiến hoặc dịch bệnh, các khu chăm sóc mang đến cơ hội sống sót thứ hai cho những nạn nhân khốn khổ, nếu họ đến kịp thời."
  building_hospices_04: "Nhà Tế bần"
  building_hospices_04_desc: "Nhà tế bần cung cấp sự chăm sóc lâu dài cho những người khó có thể sống sót nếu không có nó. Người bệnh mãn tính, người tàn tật và thậm chí cả những kẻ bị quỷ ám đều được tiếp nhận."
  building_hospices_05: "Vườn Bệnh viện"
  building_hospices_05_desc: "Một khu vườn hoa được trồng xung quanh các nhà tế bần. Mỗi loài hoa tỏa ra hương thơm dễ chịu và mạnh mẽ để át đi khí độc do người bệnh tạo ra."
  building_hospices_06: "Bệnh viện"
  building_hospices_06_desc: "Một tòa nhà bệnh viện trung tâm tồn tại để cung cấp chăm sóc và là điểm kết nối cho tất cả các nhà tế bần. Y tá và những người thánh thiện cư trú tại đây để bố thí và chăm sóc cho dân địa phương cùng lữ khách bị bệnh."
  building_hospices_07: "Khu Phong cùi"
  building_hospices_07_desc: "Trong vùng hoang dã gần nhà tế bần, một cộng đồng nhỏ được xây dựng để họ tự trồng trọt và sống những ngày cuối đời bên nhau, không gây nguy hiểm cho xã hội khỏe mạnh."
  building_hospices_08: "Đại Bệnh viện"
  building_hospices_08_desc: "Bệnh viện cung cấp bố thí và điều dưỡng cho người già yếu và tàn tật, cũng như chữa trị cho người bệnh và kiệt sức. Tại đây, họ được tách khỏi xã hội và được chăm sóc bởi những người thánh thiện tận tâm."
  building_type_scriptorium_01: "Phòng Chép sách"
  building_type_scriptorium_01_desc: "Phòng chép sách cung cấp nơi học tập để người thánh thiện và trí thức ghi chép trí tuệ của mình lên giấy cho muôn đời sau."
  building_scriptorium_01: "Thư viện"
  building_scriptorium_01_desc: "Thư viện tu viện chứa đầy sách, từ những luận thuyết nhỏ đến các bộ kinh điển đồ sộ về thần học. Quả thực là một kho tàng tri thức được gìn giữ trong những bức tường này."
  building_scriptorium_02: "Phòng Sao chép"
  building_scriptorium_02_desc: "Những người chép sách tận tụy làm việc cả ngày trong các phòng sao chép để chép lại kinh văn thiêng liêng. Ngay cả ban đêm, họ vẫn làm việc dưới ánh nến và trăng, trong hành trình tìm kiếm tri thức."
  building_scriptorium_03: "Nhà Dịch thuật"
  building_scriptorium_03_desc: "Các dịch giả tận tâm đổ về phòng chép sách này để chuyển đổi các tác phẩm viết bằng ngôn ngữ cổ hoặc ngoại lai sang ngôn ngữ phụng vụ của đền thờ, mở rộng khả năng tiếp cận cho vô số tác phẩm."
  building_scriptorium_04: "Nhà Ký lục"
  building_scriptorium_04_desc: "Một số lượng lớn ký lục cư trú tại đây để các tác giả tiềm năng có thể đọc tác phẩm của mình mà không cần tự tay ghi chép."
  building_scriptorium_05: "Hệ thống Phân loại Lục địa"
  building_scriptorium_05_desc: "Các tác phẩm nay được tổ chức nghiêm ngặt theo châu lục xuất xứ, gia tăng đáng kể khả năng tìm kiếm tri thức của học giả."
  building_scriptorium_06: "Đại Lưu trữ"
  building_scriptorium_06_desc: "Các tác phẩm văn học từ khắp nơi trên thế giới được dịch và lưu giữ tại đây, bảo tồn trí tuệ của nhân loại cho muôn đời."
  building_scriptorium_07: "Trường Dịch thuật"
  building_scriptorium_07_desc: "Các tín đồ được giáo dục về cả ngôn ngữ cổ lẫn ngoại lai, mở rộng khả năng bảo tồn tri thức của phòng chép sách."
  building_scriptorium_08: "Mật khố"
  building_scriptorium_08_desc: "Ngôi đền này hiện là nơi đặt một mạng lưới lưu trữ ngầm khổng lồ, chứa không chỉ các tác phẩm của đền mà còn nhiều tài liệu thu thập từ phương xa."
  building_type_burial_site_01: "Khu Chôn cất"
  building_type_burial_site_01_desc: "Bằng việc tạo ra một khu chôn cất rộng lớn cho người chết, chúng ta vừa ngăn khí độc lan vào dân cư vừa tạo nơi tưởng niệm và tôn kính tổ tiên."
  building_burial_site_01: "Khu Chôn cất Lớn"
  building_burial_site_01_desc: "Khu chôn cất rộng lớn này có nhiều phần mộ thường và một vài lăng mộ nhỏ dành cho những nhân vật quan trọng."
  building_burial_site_02: "Lăng mộ"
  building_burial_site_02_desc: "Một lăng mộ lớn đã được xây dựng, chứa các phần mộ thường và một số nơi an táng dành cho các thánh nhân và chiến binh được tôn kính."
  building_burial_site_03: "Đại Lăng mộ"
  building_burial_site_03_desc: "Lăng mộ được mở rộng thành một tượng đài đồ sộ của người chết. Bên trong chứa đầy mộ phần và sảnh cầu nguyện để tôn kính người đã khuất."
 
  building_type_hunting_grounds_01:0 "Khu Săn bắn"
  building_type_hunting_grounds_01_desc:1 "Rải rác khắp vùng đất này là nhiều khu nhà lớn nơi thợ săn thú rừng tụ họp và lên kế hoạch cho các chuyến đi săn."
  building_hunting_grounds_01:1 "Nhà Săn"
  building_hunting_grounds_01_desc:1 "Thợ săn tụ họp tại các nhà săn để lên kế hoạch cho chuyến đi vào hoang dã, đồng thời lưu giữ chiến lợi phẩm và gặp gỡ sau những cuộc săn thành công."
  building_hunting_grounds_02:1 "Chuồng Chó săn"
  building_hunting_grounds_02_desc:1 "Chuồng chó săn lai tạo những con chó nhanh nhẹn, là Ngài đồng hành tuyệt vời trong săn bắn. Một đàn chó lớn thường được mang theo trong mỗi chuyến đi săn."
  building_hunting_grounds_03:1 "Chuồng Chim săn"
  building_hunting_grounds_03_desc:1 "Người Ngài đồng hành quan trọng thứ hai của thợ săn là chim săn mồi, nhiều con được nuôi giữ trong các chuồng chim."
  building_hunting_grounds_04:1 "Tháp Săn"
  building_hunting_grounds_04_desc:1 "Để theo dõi và phát hiện con mồi, lính gác quan sát từ các tòa tháp khắp vùng đất và báo cáo lại cho thợ săn."
  building_hunting_grounds_05:1 "Chuồng Ngựa Thợ săn"
  building_hunting_grounds_05_desc:2 "Một thợ săn thành công luôn cần một chiến mã nhanh, bền bỉ và không sợ hãi. Chuồng ngựa thợ săn cung cấp những giống ngựa chuyên biệt, thích hợp cho các chuyến đi dài."
  building_hunting_grounds_06:1 "Lều Kiểm lâm"
  building_hunting_grounds_06_desc:2 "Kiểm lâm tuần tra khu săn bắn để tìm kiếm con mồi. Dù làm việc đơn lẻ, họ vẫn đủ khả năng hạ gục con mồi nhỏ một mình."
  building_hunting_grounds_07:1 "Khu Bảo tồn Săn bắn"
  building_hunting_grounds_07_desc:1 "Một vùng đất rộng lớn được chỉ định làm khu bảo tồn, ngăn cản những thợ săn không được phép xâm nhập. Điều này đảm bảo luôn có đủ con mồi cho thợ săn chính thức, dù đôi lúc vẫn có kẻ săn trộm lọt qua..."
  building_hunting_grounds_08:1 "Nhà Quản thú"
  building_hunting_grounds_08_desc:1 "Những người quản thú chịu trách nhiệm cho sự an lành của vùng đất và mọi loài động vật trong đó. Khi quý tộc quyết định đi săn, họ biết chính xác phải dẫn họ đến đâu để đảm bảo có con mồi."
 
  building_type_stables_01:0 "Chuồng Ngựa"
  building_type_stables_01_desc:1 "Ngựa cưỡi, ngựa thồ và các súc vật kéo khác cần có công trình chuyên dụng. Chuồng ngựa cũng đảm bảo luôn có ngựa mới cho bất kỳ ai đủ khả năng chi trả."
  building_stables_01:0 "Chuồng Ngựa Nhỏ"
  building_stables_01_desc:0 "Một công trình nhỏ đủ chỗ cho vài con ngựa, vừa là trung tâm tự nhiên của mọi lãnh địa, vừa là điểm dừng chân đầu tiên và cuối cùng của khách cưỡi ngựa."
  building_stables_02:1 "Bãi Nhốt Ngựa"
  building_stables_02_desc:1 "Bãi ngoài trời cho phép ngựa vận động, gặm cỏ và tận hưởng không khí trong lành."
  building_stables_03:0 "Kho Rơm"
  building_stables_03_desc:0 "Các kho chứa rơm đơn giản đảm bảo nguồn thức ăn ổn định cho ngựa ngoài mùa chăn thả."
  building_stables_04:0 "Trạm Chuyển Thư"
  building_stables_04_desc:0 "Với đủ ngựa trạm và xe ngựa bố trí khắp khu vực, việc di chuyển ngày đêm để chuyển thư khẩn, hàng dễ hỏng và các nhu cầu cấp bách trở nên khả thi."
  building_stables_05:0 "Khu Ở Người Chăm Ngựa"
  building_stables_05_desc:0 "Khu nhà ngủ cho công nhân giúp họ không phải ở trong chuồng ngựa, khiến cuộc sống dễ chịu hơn cho cả người lẫn vật."
  building_stables_06:0 "Kênh Thoát Nước"
  building_stables_06_desc:0 "Các rãnh thoát nước được đào trong nền chuồng giúp giữ cho ngựa luôn khô ráo và thoải mái."
  building_stables_07:0 "Nghiệp Đoàn Thợ Đóng Móng"
  building_stables_07_desc:0 "Khối lượng công việc và kỹ năng cần thiết để chăm sóc móng ngựa đúng cách đã thúc đẩy sự hình thành các nghiệp đoàn thợ đóng móng, chuyên rèn, chỉnh sửa và sửa chữa móng sắt."
  building_stables_08:0 "Trang Trại Ngựa Giống"
  building_stables_08_desc:0 "Các cơ sở chuyên chải chuốt và chăm sóc những cá thể ngựa ưu tú nhất hỗ trợ việc lai tạo các chiến mã mới lộng lẫy và khiến những con hiện có càng thêm nổi bật."
 
  building_type_smiths_01:0 "Lò Rèn"
  building_type_smiths_01_desc:0 "Nung quặng trong lò và rèn kim loại thành hình dạng mong muốn, các lò rèn cung cấp công cụ và vũ khí thiết yếu cho cộng đồng xung quanh."
  building_smiths_01:0 "Lò Luyện Thô"
  building_smiths_01_desc:0 "Khắp vùng nông thôn, khói bốc lên từ các lò luyện thô — những công trình đơn giản bằng đất sét chịu nhiệt và đá, nơi than củi và quặng sắt nghiền được đổ từ trên xuống để tạo ra sắt xốp."
  building_smiths_02:0 "Ống Bễ"
  building_smiths_02_desc:0 "Được làm từ da động vật dày, ống bễ thường do học việc vận hành, liên tục thổi luồng không khí mạnh vào lò."
  building_smiths_03:0 "Bàn Kéo Dây"
  building_smiths_03_desc:0 "Thiết bị hỗ trợ thợ rèn chế tạo dây kim loại cho áo giáp xích bằng cách kéo sắt nung qua các lỗ ngày càng nhỏ."
  building_smiths_04:0 "Khu Lò Rèn"
  building_smiths_04_desc:0 "Thợ rèn được khuyến khích làm việc ngoài khu dân cư đông đúc. Khi họ có thể làm việc gần như liên tục, sự bất mãn của dân cư xung quanh tăng lên theo từng tiếng búa và lửa lò ban đêm."
  building_smiths_05:0 "Búa Đập"
  building_smiths_05_desc:0 "Được vận hành bằng bánh xe nước hoặc học việc kém may mắn, trục cam quay nâng búa lên rồi thả xuống theo nhịp đều đặn."
  building_smiths_06:0 "Xưởng Kim Hoàn"
  building_smiths_06_desc:0 "Các phòng chuyên đúc và gia công vàng bạc giúp việc chế tác trang sức và mạ kim loại quý trở nên dễ dàng hơn."
  building_smiths_07:0 "Lò Cao"
  building_smiths_07_desc:0 "Lò cao hoạt động nóng đỏ quanh năm, luyện sắt, chì và đồng với chất lượng vượt trội."
  building_smiths_08:0 "Gang Đúc"
  building_smiths_08_desc:0 "Yếu hơn đôi chút nhưng rẻ hơn nhiều, gang đúc được dùng để sản xuất hàng loạt công cụ như lưỡi cày, đinh hoặc bừa."
 
  building_type_horse_pastures_01:0 "Đàn Ngựa"
  building_type_horse_pastures_01_desc:0 "Ai cũng có thể cầm vũ khí thô sơ và tập hợp một đám nông dân. Nhưng chỉ sự hòa hợp giữa ngựa được nuôi dưỡng tốt, chiến binh lành nghề và vũ khí phù hợp dưới sự chỉ huy xuất sắc mới tạo nên lực lượng vô song."
  building_horse_pastures_01:0 "Thuần Hóa Ngựa Hoang"
  building_horse_pastures_01_desc:0 "Những con ngựa sống sót trong địa hình khắc nghiệt sở hữu bản năng tuyệt vời, và chúng ta sẽ tận dụng điều đó thay vì bẻ gãy chúng."
  building_horse_pastures_02:0 "Roi Da Cho Ngựa"
  building_horse_pastures_02_desc:0 "Thay vì dùng cựa thô bạo, chiến binh sử dụng roi da buộc vào cổ tay, sau khi dùng có thể thả lỏng để rảnh tay."
  building_horse_pastures_03:0 "Yên Cung Thủ Kỵ Mã"
  building_horse_pastures_03_desc:0 "Yên ngựa với bàn đạp cao và chỗ ngồi sâu cho phép chiến binh tập trung hoàn toàn vào việc bắn tên khi đang cưỡi ngựa."
  building_horse_pastures_04:0 "Mũi Tên Xuyên"
  building_horse_pastures_04_desc:0 "Hạ gục những con ngựa thường không được bọc giáp dễ hơn nhiều so với việc nhắm vào kỵ binh đối phương."
  building_horse_pastures_05:0 "Giáp Da Cho Ngựa"
  building_horse_pastures_05_desc:0 "Giáp nhẹ bảo vệ toàn bộ con ngựa mà không hạn chế khả năng di chuyển hay sức bền."
  building_horse_pastures_06:0 "Cung Phản Hợp"
  building_horse_pastures_06_desc:0 "Cung phản hợp làm từ gỗ, sừng và gân là vũ khí hoàn hảo cho các cung thủ kỵ mã tinh nhuệ."
  building_horse_pastures_07:0 "Ngựa Dự Phòng"
  building_horse_pastures_07_desc:0 "Khi chiến mã mệt mỏi, kỵ binh đổi sang ngựa khác, cho phép quân đội di chuyển quãng đường cực xa và luôn trinh sát phía trước."
  building_horse_pastures_08:0 "Quy Tắc Chiến Tranh Kỵ Mã"
  building_horse_pastures_08_desc:0 "\"Hãy đảm bảo binh sĩ giữ dây đuôi ngựa lỏng và tháo hàm thiếc khỏi miệng, trừ khi được phép săn bắn. Kẻ vi phạm sẽ bị bắt và đánh đập; kẻ coi thường mệnh lệnh này sẽ bị chém đầu ngay tại chỗ.\""
 
  building_type_warrior_lodges_01:0 "Hội Quán Chiến Binh"
  building_type_warrior_lodges_01_desc:0 "Những mối liên kết hình thành trên chiến trường xứng đáng có nơi tưởng niệm, nơi các chiến binh lão luyện kể lại chiến tích cho lớp trẻ mơ mộng."
  building_warrior_lodges_01:0 "Đại Sảnh Chiến Lợi Phẩm"
  building_warrior_lodges_01_desc:0 "Chiến trường và ký ức con người đều mong manh, nhưng những bức tường treo chiến lợi phẩm sẽ tồn tại rất lâu."
  building_warrior_lodges_02:0 "Khu Ở Hộ Vệ"
  building_warrior_lodges_02_desc:0 "Kho trang bị đơn giản cùng lịch huấn luyện nghiêm ngặt là đủ để lớp trẻ học hỏi từ các cựu binh."
  building_warrior_lodges_03:0 "Đại Sảnh Yến Tiệc"
  building_warrior_lodges_03_desc:0 "Các đại sảnh luôn ngập tràn thức ăn và tiếng cười để vinh danh những chiến thắng ngày càng nhiều."
  building_warrior_lodges_04:0 "Bãi Huấn Luyện Đội Hình"
  building_warrior_lodges_04_desc:0 "Trên những bãi tập mô phỏng địa hình thực tế, chiến binh học cách chiến đấu và cơ động như một thể thống nhất."
  building_warrior_lodges_05:1 "Mộ Phần Chiến Binh"
  building_warrior_lodges_05_desc:0 "Những khu đất linh thiêng cho phép các chiến binh được tôn kính an nghỉ vĩnh viễn, đồng thời truyền cảm hứng cho các thế hệ sau."
  building_warrior_lodges_06:0 "Đại Sảnh Tưởng Niệm"
  building_warrior_lodges_06_desc:0 "Những thi sĩ và nhạc công được trả công hậu hĩnh ca ngợi chiến công, thậm chí tái hiện các trận đánh vang dội."
  building_warrior_lodges_07:1 "Thư Viện Chiến Binh"
  building_warrior_lodges_07_desc:0 "Kho tri thức tích lũy qua nhiều thế hệ nay có thể được tiếp cận bởi hầu như bất kỳ ai với một khoản phí nhỏ."
  building_warrior_lodges_08:0 "Khu Ở Khách Viếng"
  building_warrior_lodges_08_desc:0 "Những hội quán này đã trở thành điểm hành hương thế tục nổi tiếng với cả chiến binh trẻ lẫn lão luyện."
 
  building_type_hillside_grazing_01:0 "Đồng Cỏ Sườn Đồi"
  building_type_hillside_grazing_01_desc:0 "Không thích hợp cho canh tác, các sườn đồi phủ đầy cỏ chủ yếu được dùng làm bãi chăn thả ngựa."
  building_hillside_grazing_01:0 "Đồng Cỏ Đồi"
  building_hillside_grazing_01_desc:0 "Những khu đất rộng ngoài trời rất phù hợp để chăn thả ngựa mọi kích cỡ."
  building_hillside_grazing_02:0 "Người Chăn Ngựa"
  building_hillside_grazing_02_desc:0 "Khi việc nuôi ngựa trở nên quan trọng hơn, các đồng cỏ này hỗ trợ ngày càng nhiều người chuyên chăn dắt."
  building_hillside_grazing_03:0 "Mở Rộng Đồng Cỏ"
  building_hillside_grazing_03_desc:0 "Cây cối bị đốn hạ và đá bị dọn bỏ để mở rộng diện tích chăn thả."
  building_hillside_grazing_04:0 "Nông Trại Ngựa"
  building_hillside_grazing_04_desc:0 "Đất nông nghiệp dần được mua lại để phục vụ các nông trại nuôi ngựa."
  building_hillside_grazing_05:0 "Trang Trại Ngựa Nhỏ"
  building_hillside_grazing_05_desc:0 "Những trang trại chuyên nuôi, cho ăn và huấn luyện ngựa trở thành phần không thể thiếu của kinh tế địa phương."
  building_hillside_grazing_06:0 "Chợ Ngựa"
  building_hillside_grazing_06_desc:0 "Buôn bán ngựa phát triển khiến các thị trấn chợ ngựa hình thành theo mùa."
  building_hillside_grazing_07:0 "Quan Giám Mã"
  building_hillside_grazing_07_desc:0 "Quan giám mã chăm sóc, đánh giá và điều trị cho những chiến mã chất lượng cao."
  building_hillside_grazing_08:0 "Trang Trại Ngựa Lớn"
  building_hillside_grazing_08_desc:0 "Đồng cỏ được hợp nhất thành những trang trại lớn chuyên nuôi và huấn luyện số lượng lớn chiến mã."
 
  building_type_windmills_01:0 "Cối Xay Gió"
  building_type_windmills_01_desc:0 "Cối xay gió được xây ở nơi có gió mạnh như sườn đồi hoặc ven biển và có thể hoạt động quanh năm."
  building_windmills_01:0 "Cối Xay Gió Đơn Giản"
  building_windmills_01_desc:0 "Các cánh gió thẳng đứng bổ sung cho cối quay bằng sức kéo, giúp tăng công suất và giảm hao mòn."
  building_windmills_02:0 "Panemone"
  building_windmills_02_desc:0 "Cối gió trục đứng với một nửa được che chắn, đảm bảo cánh gió thuận chiều quay."
  building_windmills_03:0 "Cánh Gió Quay"
  building_windmills_03_desc:0 "Thiết kế cải tiến giúp cánh gió quay ngược chiều gió nhanh hơn."
  building_windmills_04:0 "Bánh Xe Nước Cối Gió"
  building_windmills_04_desc:0 "Sức gió được dùng để quay bánh xe nước, cho phép đặt cối xay ở vị trí thuận tiện hơn."
  building_windmills_05:0 "Cối Xay Gió Ngang"
  building_windmills_05_desc:0 "Tất cả cánh gió đẩy cùng hướng, tăng công suất nhưng cần điều chỉnh khi đổi gió."
  building_windmills_06:0 "Cối Gió Trụ"
  building_windmills_06_desc:0 "Toàn bộ cối có thể xoay theo hướng gió nhờ đặt trên trụ vững chắc."
  building_windmills_07:0 "Hộp Số"
  building_windmills_07_desc:0 "Bánh răng gỗ giúp tăng tốc độ quay, phù hợp hơn cho việc chế biến nguyên liệu."
  building_windmills_08:0 "Cối Xay Gió Tháp"
  building_windmills_08_desc:0 "Thân cối bằng đá vững chắc, chỉ phần trên bằng gỗ có thể xoay theo gió, không cơn bão nào dễ dàng làm gián đoạn hoạt động."
 
  building_type_watermills_01:0 "Cối xay nước"
  building_type_watermills_01_desc:0 "Cối xay nước biến mọi dạng chuyển động của nước, từ thủy triều đến thác nước, thành chuyển động quay dùng để xay, cưa, nghiền và dập vải. Giấy phép vận hành cối xay nước là nguồn thuế bổ sung dễ dàng và ổn định cho chủ sở hữu thái ấp."
  building_watermills_01:0 "Bánh xe nước hạ lưu"
  building_watermills_01_desc:0 "Một bánh xe đơn giản đặt trong dòng sông chảy xiết có thể làm được nhiều việc hơn cả cối xay quay bằng người hay ngựa, và quan trọng nhất là nó không bao giờ mệt mỏi hay đòi tiền công."
  building_watermills_02:0 "Tay quay và thanh truyền"
  building_watermills_02_desc:0 "Với hệ bánh răng gỗ đơn giản, tốc độ quay của đá xay không còn phụ thuộc trực tiếp vào sự thất thường của thời tiết."
  building_watermills_03:0 "Bánh xe nước thượng lưu"
  building_watermills_03_desc:0 "Khai thác sự chênh lệch mực nước, dù do tự nhiên hay nhờ sự khéo léo của con người, là cách tạo mô-men xoắn hiệu quả và đáng tin cậy hơn nhiều."
  building_watermills_04:0 "Xưởng xay công nghiệp"
  building_watermills_04_desc:0 "Khởi đầu chỉ là một cối xay mạch nha đơn giản xử lý chủ yếu nông sản, nay nơi đây đã thu hút nhiều ngành nghề khác. Phu khuân vác của các phường hội chờ đến lượt xay mù tạt, dập vải hoặc nghiền quặng."
  building_watermills_05:0 "Hệ thống đường sá quy củ"
  building_watermills_05_desc:0 "Lính canh thuê, nơi trú ẩn, trạm thu phí và cả quán trọ được bố trí dọc theo các con đường dẫn đến cối xay, phục vụ những người xếp hàng chờ đợi. Xe kéo do người hoặc ngựa điều khiển, chở đầy gỗ, gai dầu hay da thú, nối đuôi nhau ngày đêm."
  building_watermills_06:0 "Cối xay thuyền"
  building_watermills_06_desc:0 "Những sà lan được neo cố định giữa lòng sông khai thác dòng chảy mạnh nhất. Trên các con sông uốn khúc, chúng có thể dễ dàng được neo lại ở khúc cong ngoài."
  building_watermills_07:0 "Đê điều và đập nước"
  building_watermills_07_desc:0 "Hệ thống đê, đập và kênh đào nhân tạo phục vụ cả bánh xe hạ lưu lẫn thượng lưu đáp ứng nhu cầu xay xát ngày càng tăng. Khi gần như mọi vị trí tự nhiên phù hợp đều đã bị chiếm dụng, các dòng kênh mới bắt đầu cắt ngang vùng nông thôn."
  building_watermills_08:0 "Xưởng nghiền thuốc súng"
  building_watermills_08_desc:0 "Một cối xay riêng biệt, đặt cách xa các ngành nghề khác, hoàn toàn chuyên dùng để nghiền than củi và lưu huỳnh một cách hiệu quả và #EMP tương đối#! an toàn."
 
  building_type_caravanserai_01:0 "Caravanserai"
  building_type_caravanserai_01_desc:0 "Một nơi trú ẩn nằm giữa vùng đất khắc nghiệt, chào đón lữ khách mệt mỏi trong khi cố gắng ngăn chặn những kẻ không mong muốn."
  building_caravanserai_01:0 "Caravanserai nhỏ"
  building_caravanserai_01_desc:0 "Một công trình hình chữ nhật đơn giản cung cấp các tiện nghi cơ bản cho lữ khách và thương nhân nghỉ ngơi, hồi phục trong những chuyến hành trình dài."
  building_caravanserai_02:0 "Quầy hàng thương nhân"
  building_caravanserai_02_desc:0 "Những quầy nhỏ bán vật tư thiết yếu cho đường xa. Với điểm tiếp tế bảo đảm, các đoàn lữ hành có thể chở nhiều hàng hóa hơn."
  building_caravanserai_03:0 "Doanh trại lính gác"
  building_caravanserai_03_desc:0 "Việc bổ sung doanh trại lính gác thường trực và các tháp canh do lính cảnh giới điều hành giúp chủ động bảo vệ khỏi những hiểm họa rình rập trong đêm tối."
  building_caravanserai_04:0 "Đại sảnh thương nhân"
  building_caravanserai_04_desc:0 "Trong những đại sảnh này, thương nhân từ khắp nơi trên thế giới trao đổi hàng hóa và chia sẻ những câu chuyện về các vùng đất họ đã đi qua."
  building_caravanserai_05:0 "Cơ quan thuế quan"
  building_caravanserai_05_desc: "Dưới cái nắng gay gắt, các quan chức mặt lạnh cân đo, ghi chép và đánh thuế thích đáng mọi hàng hóa đi qua caravanserai này. Trong bóng tối, những kẻ mặt mày thân thiện gợi ý cách vận chuyển hàng với mức phí còn… #EMP hợp lý hơn#!."
  building_caravanserai_06:0 "Xưởng thủ công"
  building_caravanserai_06_desc:0 "Với nguồn nguyên liệu dồi dào và các nhà bảo trợ giàu có, các nghệ nhân có thể chế tác và buôn bán những hiện vật tráng lệ."
  building_caravanserai_07:0 "Nhà tắm công cộng"
  building_caravanserai_07_desc: "Những nhà tắm rộng rãi thỏa mãn cả những nhu cầu xa hoa nhất. Với người có túi tiền eo hẹp, chúng vẫn mang lại sự thư giãn đơn giản nhưng đáng quý."
  building_caravanserai_08:0 "Phòng ngự giá hoàng gia"
  building_caravanserai_08_desc:0 "Việc bổ sung những gian phòng phù hợp giúp tiếp đón chu đáo các nhân vật quan trọng và đáng kính thường xuyên ghé thăm, từ trong lãnh thổ lẫn bên ngoài."
 
  building_type_workshops_01:0 "Xưởng chế tác"
  building_type_workshops_01_desc:0 "Thợ làm tên, thợ cung và thợ mộc làm việc tại đây để chế tạo vũ khí công thành và cung cấp vật tư cho quân đội trong các chiến dịch kéo dài."
  building_workshops_01:0 "Bãi tập bắn"
  building_workshops_01_desc:0 "Một khu vực rộng lớn được dọn sạch chướng ngại, cho phép cung thủ và kỹ sư công thành thử nghiệm sản phẩm và rèn luyện kỹ năng."
  building_workshops_02:0 "Xưởng bện dây"
  building_workshops_02_desc:0 "Ngày đêm, trong những rãnh dài hẹp được che chắn một phần, công nhân bện và xoắn dây thừng từ sợi thực vật hoặc động vật."
  building_workshops_03:0 "Kho dây cung"
  building_workshops_03_desc:0 "Kho lưu trữ chuyên dụng duy trì nguồn dây sẵn sàng cho cung, nỏ và vũ khí công thành dùng lực xoắn."
  building_workshops_04:0 "Phường hội thợ đào hầm"
  building_workshops_04_desc:0 "Dù trông có vẻ đơn giản, đào hầm trong công thành là công việc đòi hỏi sự tận tâm và tay nghề cao. Những người sống sót sau lần vây hãm đầu tiên sẽ truyền lại kiến thức và kỹ năng cho các tình nguyện viên."
  building_workshops_05:0 "Phường hội thợ làm tên"
  building_workshops_05_desc:0 "Do nhu cầu ngày càng tăng về cả vũ khí lẫn đạn dược, một phường hội thợ làm tên độc lập đã hình thành, không ngừng cung cấp mũi tên cho quân đội ngoài chiến trường."
  building_workshops_06:0 "Đại sảnh toán học"
  building_workshops_06_desc:0 "Việc liên tục thử nghiệm và điều chỉnh thông số máy bắn đã khiến các kỹ sư công thành bắt đầu ghi chép lại phương pháp thành công. Những ghi chép này nay lấp đầy các đại sảnh, rộn ràng tranh luận."
  building_workshops_07:0 "Chuẩn hóa kích thước vũ khí"
  building_workshops_07_desc:0 "Nhờ sổ sách ghi rõ chiều dài mong muốn của các dầm gỗ khác nhau, ta có thể đảm bảo một viên đạn nặng 90 cân được bắn đúng 300 mét. Trong điều kiện thời tiết lý tưởng. Phần lớn là vậy."
  building_workshops_08:0 "Kho thuốc súng"
  building_workshops_08_desc:0 "Một tòa nhà kiên cố, tách biệt với quy định ra vào nghiêm ngặt, dùng để lưu trữ lượng thuốc súng khổng lồ cho các khối phá tường trong chiến tranh đào hầm hoặc làm thuốc phóng cho đại bác."
 
  building_type_wind_furnace_01:0 "Lò luyện gió"
  building_type_wind_furnace_01_desc:0 "Được xây trên vùng đồi ven biển, nơi gió mùa đầu tiên thổi vào đất liền, các lò luyện gió này luyện ra loại thép trứ danh với chất lượng hoàn hảo."
  building_wind_furnace_01:0 "Lò luyện gió nhỏ"
  building_wind_furnace_01_desc:0 "Các lò được xoay thẳng về hướng tây để hứng và tận dụng tối đa luồng gió thổi tới."
  building_wind_furnace_02:0 "Ống gió tái sử dụng"
  building_wind_furnace_02_desc: "Ống gió kim loại dẫn không khí vào lò được lắp đặt cẩn thận nhằm ổn định luồng gió bên trong, triệt tiêu tác động của gió giật. Sau mỗi mẻ luyện, chúng được tái sử dụng bằng cách đặt ở chân tường trước, cho phép xỉ chảy ra ngoài."
  building_wind_furnace_03:0 "Tường trước bằng đất sét"
  building_wind_furnace_03_desc:0 "Tường trước bằng đất sét của các lò được thiết kế gọn gàng để chịu được nhiệt độ cao và sự hình thành xỉ trong quá trình luyện, đồng thời dễ dàng phá bỏ sau mỗi mẻ."
  building_wind_furnace_04:0 "Quy trình nung sơ bộ"
  building_wind_furnace_04_desc:0 "Quá trình nung sơ bộ kéo dài giúp than cháy hoàn toàn, sau đó quặng và than được thêm vào dần dần, kết thúc bằng việc bổ sung thêm than."
  building_wind_furnace_05:0 "Tường sau cong"
  building_wind_furnace_05_desc:0 "Được chống đỡ bởi hai trụ đá đứng, độ cong của tường sau cố định hạn chế tiếp xúc với xỉ nóng và ăn mòn, cho phép lò hoạt động lâu hơn mà không cần xây lại."
  building_wind_furnace_06:0 "Tường trước kéo dài"
  building_wind_furnace_06_desc:0 "Tường trước được kéo dài giúp tăng lượng thép tạo ra trong mỗi mẻ luyện, trong khi vẫn giữ nguyên các kích thước khác và do đó duy trì chất lượng vượt trội của lò và thép."
  building_wind_furnace_07:0 "Lò đốt than"
  building_wind_furnace_07_desc:0 "Cách xa bờ biển hơn so với các lò luyện, một dãy lò đốt than liên tục nung gỗ để cung cấp cho ngành công nghiệp đang mở rộng."
  building_wind_furnace_08:0 "Xử lý quặng sắt"
  building_wind_furnace_08_desc:0 "Bằng cách nghiền quặng kỹ hơn và nung sơ trước khi đưa vào lò, có thể đạt được sản lượng lớn hơn với chất lượng còn cao hơn nữa."
 
  building_type_theodosian_walls_01:0 "Tường thành Theodosius"
  building_type_theodosian_walls_01_desc:1 "Tường thành Theodosius được xây dựng dưới triều đại Hoàng đế Theodosius II vào đầu thế kỷ V, và cho đến nay vẫn là một trong những hệ thống phòng thủ kiên cố nhất từng được con người xây dựng."
  building_theodosian_walls_01:0 "Tường thành Theodosius"
  building_theodosian_walls_01_desc:0 "$building_type_theodosian_walls_01_desc$"
 
  building_type_aurelian_walls_01:0 "Tường thành Aurelian"
  building_type_aurelian_walls_01_desc:1 "Tường thành Aurelian được xây dựng dưới thời các Hoàng đế La Mã Aurelian và Probus. Cho đến ngày nay, chúng vẫn cung cấp khả năng phòng thủ đáng gờm, bao quanh toàn bộ bảy ngọn đồi của thành Rome."
  building_aurelian_walls_01:0 "Tường thành Aurelian"
  building_aurelian_walls_01_desc:0 "$building_type_aurelian_walls_01_desc$"
 
  building_type_the_colosseum_01:0 "Đấu trường Colosseum"
  building_type_the_colosseum_01_desc:0 "Đấu trường Colosseum là một trong những nhà hát vòng tròn lớn nhất từng được xây dựng, từng tổ chức vô số màn trình diễn như đấu sĩ, săn thú và thậm chí cả các trận thủy chiến giả lập. Việc xây dựng bắt đầu dưới triều Hoàng đế Vespasian năm 72 SCN và hoàn thành năm 80 dưới thời Titus.\n\nMặc dù có lịch sử huy hoàng, ngày nay công trình chủ yếu được sử dụng để khai thác đá cẩm thạch và đồng cho các công trình khác."
  building_the_colosseum_01:0 "$building_type_the_colosseum_01$"
  building_the_colosseum_01_desc:0 "$building_type_the_colosseum_01_desc$"
 
  building_type_hadrians_wall_01:0 "Tường thành Hadrian"
  building_type_hadrians_wall_01_desc:0 "Tường thành Hadrian được xây dựng vào thời La Mã nhằm ngăn chặn người Pict phương Bắc xâm nhập tỉnh Britannia. Ngày nay, nó không còn giá trị phòng thủ, nhưng những khối đá của nó là nguồn vật liệu xây dựng rẻ và tiện lợi!"
  building_hadrians_wall_01:0 "$building_type_hadrians_wall_01$"
  building_hadrians_wall_01_desc:0 "$building_type_hadrians_wall_01_desc$"
 
  building_type_offas_dyke_01:0 "Đê Offa"
  building_type_offas_dyke_01_desc:0 "Đê Offa là một con hào dài kèm theo bờ đất cao, được xây dựng bởi vua Anglo-Saxon của Mercia để bảo vệ biên giới với xứ Wales. Công trình này mang lại lợi thế cho bên đứng trên tường, khi kẻ tấn công buộc phải giao chiến từ dưới hào lên dốc."
  building_offas_dyke_01:0 "$building_type_offas_dyke_01$"
  building_offas_dyke_01_desc:0 "$building_type_offas_dyke_01_desc$"
 
  building_type_buddhas_of_bamian_01:1 "Tượng Phật Bamian của $c_bamian$"
  building_type_buddhas_of_bamian_01_desc:0 "Được tạc trực tiếp vào sườn núi, những bức tượng Phật khổng lồ ở Bamian sừng sững trước mọi du khách. Dù khu vực xung quanh không còn là trung tâm học thuật Phật giáo sầm uất như xưa, vẫn có rất nhiều tăng lữ và học giả đến chiêm bái. Một vị ruler thuộc $rf_eastern$ khôn ngoan thậm chí có thể kiếm lợi từ các đoàn hành hương, đồng thời thu nhận thêm những hiểu biết tâm linh."
  building_buddhas_of_bamian_01:0 "$building_type_buddhas_of_bamian_01$"
  building_buddhas_of_bamian_01_desc:0 "$building_type_buddhas_of_bamian_01_desc$"
  NOT_BUDDHAS_OF_BAMIAN_ENABLED:1 "Người nắm giữ phải thuộc [religious_family|E] $rf_eastern$"
 
  building_type_petra_01:0 "Petra"
  building_type_petra_01_desc:0 "Thành phố Petra là một kỳ quan thực sự của thế giới cổ đại. Được đục khắc trực tiếp từ đá hồng tự nhiên, thành phố này là một điều kỳ lạ khiến ngay cả những vị sultan hùng mạnh nhất cũng phải tò mò."
  building_petra_01:0 "$building_type_petra_01$"
  building_petra_01_desc:0 "$building_type_petra_01_desc$"
 
  building_type_house_of_wisdom_01:0 "Nhà Thông Thái"
  building_type_house_of_wisdom_01_desc:0 "Nhà Thông Thái lưu trữ một kho tàng sách khổng lồ, nơi các thư lại làm việc không ngừng ngày đêm để dịch thêm nhiều kiệt tác văn học. Nguồn sách đến từ Hy Lạp, Ba Tư, Ấn Độ và nhiều nền văn minh khác — thực sự là nơi chứa đựng tri thức của toàn thế giới! Một ngọn hải đăng rực rỡ của tri thức nhân loại, và lại ở rất xa những kỵ sĩ mù chữ của thảo nguyên..."
  building_house_of_wisdom_01:0 "$building_type_house_of_wisdom_01$"
  building_house_of_wisdom_01_desc:0 "$building_type_house_of_wisdom_01_desc$"
 
  building_type_palace_of_aachen_01:1 "$building_palace_of_aachen_01$"
  building_type_palace_of_aachen_01_desc:0 "Cung điện Aachen được Charlemagne chọn làm trung tâm quyền lực của Đế quốc Carolingian. Nó vừa mang chức năng chính trị vừa tôn giáo, và đến nay vẫn là địa điểm lý tưởng để tổ chức các cuộc hội họp quan trọng."
  building_palace_of_aachen_01:0 "Cung điện Aachen"
  building_palace_of_aachen_01_desc:0 "$building_type_palace_of_aachen_01_desc$"
 
  building_type_notre_dame_01:1 "$building_notre_dame_01$"
  building_type_notre_dame_01_desc:0 "Còn được gọi là 'Đức Bà Paris', nhà thờ tráng lệ này được hiến dâng cho Đức Trinh Nữ Maria. Được xây dựng theo phong cách Gothic, công trình gây ấn tượng với vô số tượng điêu khắc và các cửa sổ hoa hồng rực rỡ sắc màu.\n\nBên ngoài nhà thờ được phủ kín bởi những bức phù điêu kể lại các câu chuyện Kinh Thánh một cách sinh động, giúp ngay cả những nông dân mù chữ cũng hiểu được vinh quang của Chúa!"
  building_notre_dame_01:0 "Nhà thờ Đức Bà Paris"
  building_notre_dame_01_desc:0 "$building_type_notre_dame_01_desc$"
 
  building_type_hagia_sophia_01:1 "Hagia Sophia"
  building_type_hagia_sophia_01_desc:0 "Hagia Sophia là một kỳ tích kỹ thuật, với mái vòm khổng lồ là điểm nhấn ấn tượng nhất. Hoàn thành năm 537 dưới triều Hoàng đế Justinian I, nơi đây hiện là trụ sở của Thượng phụ Đại kết và là tượng đài của Kitô giáo.\n\nVà nó sẽ trường tồn mãi mãi, bởi chắc chắn không điều gì có thể làm lung lay sức mạnh của Rome."
  building_hagia_sophia_01:0 "Nhà thờ Hagia Sophia"
  building_hagia_sophia_01_desc:0 "$building_type_hagia_sophia_01_desc$"
  building_hagia_sophia_02:0 "Đại giáo đường Hồi giáo Hagia Sophia"
  building_hagia_sophia_02_desc:0 "Hagia Sophia là một kỳ tích kỹ thuật, với mái vòm khổng lồ cùng bốn ngọn tháp minaret uy nghi. Được khởi công năm 537 dưới thời Justinian I, công trình sau này đã được chuyển đổi thành một thánh đường Hồi giáo tráng lệ.\n\nVà nó sẽ trường tồn mãi mãi, bởi chắc chắn không điều gì có thể làm lung lay sức mạnh của Rum."
 
  building_type_dome_of_the_rock_01:0 "Đền thờ tại Jerusalem"
  building_type_dome_of_the_rock_01_desc:0 "Mái Vòm Đá tọa lạc tại trung tâm Núi Đền, nơi từng là vị trí của Đền Solomon và Đền Thứ Hai của người Do Thái. Viên đá nền móng của ngôi đền được cho là nơi Thiên Chúa tạo ra thế giới và con người đầu tiên, Adam. Mái Vòm Đá cùng với Nhà thờ Mộ Thánh gần đó thu hút các tín đồ thuộc các tôn giáo Abraham từ khắp nơi trên thế giới."
  building_dome_of_the_rock_01:0 "Mái Vòm Đá"
  building_dome_of_the_rock_01_desc:0 "$building_type_dome_of_the_rock_01_desc$"
  building_temple_in_jerusalem_01:0 "Đền thờ Thứ Ba"
  building_temple_in_jerusalem_01_desc:0 "Hàng trăm năm sau khi Đền Thứ Hai bị phá hủy, cuối cùng thời khắc khôi phục Đền thờ tại Jerusalem cũng đã đến! Đền Thứ Ba này sẽ trường tồn cùng thời gian, được canh phòng nghiêm ngặt trước mọi kẻ muốn phá hủy nó."
 
  building_type_stonehenge_01:0 "Stonehenge"
  building_type_stonehenge_01_desc:0 "Stonehenge là một công trình cổ đại đầy huyền bí, đã truyền cảm hứng cho vô số học giả. Ngay cả trong thời đại khai sáng ngày nay, các học giả từ khắp nước Anh vẫn đổ về để nghiên cứu nó. Mục đích thực sự của công trình này là gì?"
  building_stonehenge_01:0 "$building_type_stonehenge_01$"
  building_stonehenge_01_desc:0 "$building_type_stonehenge_01_desc$"
 
  building_type_iron_pillar_of_dhar_01:0 "Cột Sắt Dhar"
  building_type_iron_pillar_of_dhar_01_desc:0 "Cột Sắt Dhar được rèn từ vũ khí nấu chảy của cả một đạo quân. Tay nghề chế tác thật sự đáng kinh ngạc, mang lại vinh quang cho triều đại đang sở hữu nó."
  building_iron_pillar_of_dhar_01:0 "$building_type_iron_pillar_of_dhar_01$"
  building_iron_pillar_of_dhar_01_desc:0 "$building_type_iron_pillar_of_dhar_01_desc$"
 
  building_type_iron_pillar_of_delhi_01:0 "Cột Sắt Delhi"
  building_type_iron_pillar_of_delhi_01_desc:0 "Cột Sắt hùng vĩ của Delhi là biểu tượng cho vinh quang của Vua Chandragupta II, dù các vị vua kế tục cũng đã khắc tên mình lên đó. Dù đã tồn tại qua thời gian dài, cột vẫn không hề bị gỉ — minh chứng cho kỹ nghệ luyện kim bậc thầy của Ấn Độ!"
  building_iron_pillar_of_delhi_01:0 "$building_type_iron_pillar_of_delhi_01$"
  building_iron_pillar_of_delhi_01_desc:0 "$building_type_iron_pillar_of_delhi_01_desc$"
 
  building_type_the_pyramids_01:0 "Kim Tự Tháp"
  building_type_the_pyramids_01_desc:0 "Những Kim Tự Tháp, đặc biệt là Kim Tự Tháp Cheops, sừng sững như những kỳ quan của thế giới cổ đại. Hùng vĩ và ấn tượng, chúng nâng cao hình ảnh của bất kỳ vị quân chủ nào đang kiểm soát chúng."
  building_the_pyramids_01:0 "$building_type_the_pyramids_01$"
  building_the_pyramids_01_desc:0 "$building_type_the_pyramids_01_desc$"
 
  building_type_alhambra_01:0 "Alhambra"
  building_type_alhambra_01_desc:0 "Alhambra là một pháo đài được xây dựng trên tàn tích của một công trình phòng thủ La Mã cổ đại. Dù hiện tại vẫn đủ dùng cho mục đích quân sự, nhưng với những khoản đầu tư phù hợp, nơi này có thể trở thành một điều gì đó vĩ đại hơn..."
  building_alhambra_01:0 "Tàn tích Pháo đài $building_type_alhambra_01$"
  building_alhambra_01_desc:0 "$building_type_alhambra_01_desc$"
  building_alhambra_02:0 "Hoàng cung $building_type_alhambra_01$"
  building_alhambra_02_desc:1 "Từ một tàn tích La Mã đơn sơ, Alhambra đã được nâng cấp thành một hoàng cung xứng tầm đế vương! Một kiệt tác kiến trúc địa phương, sắc màu của các tòa nhà tương phản với rừng cây xung quanh khiến các thi sĩ ví nó như “viên ngọc trai đặt giữa lục bảo.”"
 
  building_type_shwedagon_pagoda_01:0 "Chùa Shwedagon"
  building_type_shwedagon_pagoda_01_desc:0 "Chùa Shwedagon là một bảo tháp Phật giáo linh thiêng do người Mon xây dựng vào khoảng năm 500. Nơi đây lưu giữ nhiều thánh tích nổi tiếng, như cây gậy của Kakusandha, bộ lọc nước của Koṇāgamana, một mảnh áo cà sa của Kassapa, và tám sợi tóc của Đức Phật Gautama."
  building_shwedagon_pagoda_01:0 "Chùa Shwedagon"
  building_shwedagon_pagoda_01_desc:0 "$building_type_shwedagon_pagoda_01_desc$"
 
  building_type_khajuraho_01:0 "Thành phố Đền thờ"
  building_type_khajuraho_01_desc:0 "Các đền thờ Khajuraho được xây dựng để tôn vinh sự chung sống giữa Ấn Độ giáo và Kỳ Na giáo, nơi những quan điểm tôn giáo đa dạng được trân trọng. Tường đền phủ kín các tác phẩm điêu khắc và nghệ thuật tinh xảo, khiến nơi đây trở nên lộng lẫy và hấp dẫn cả khách hành hương lẫn học giả."
  building_khajuraho_01:0 "Khajuraho"
  building_khajuraho_01_desc:0 "$building_type_khajuraho_01_desc$"
 
  building_type_the_tower_of_london_01:0 "Tháp London"
  building_type_the_tower_of_london_01_desc:0 "Tháp London là một tòa thành vừa đóng vai trò là công trình phòng thủ trọng yếu, vừa là nhà ngục. Tháp trung tâm được gọi là 'Tháp Trắng', nơi ở của tầng lớp thống trị. Vị trí của Tháp London khiến nó giữ vai trò then chốt trong việc phòng thủ toàn bộ hạt."
  building_the_tower_of_london_01:0 "Tháp London"
  building_the_tower_of_london_01_desc:0 "$building_type_the_tower_of_london_01_desc$"

  building_type_london_bridge_01:0 "Cầu London"
  building_type_london_bridge_01_desc:0 "Từ thuở xa xưa đã có những cây cầu bắc qua sông Thames, nhưng cây cầu bằng đá hùng vĩ này vượt trội hơn tất cả. Dòng nước xiết bên dưới đã dẫn đến quan niệm phổ biến rằng cây cầu dành cho người khôn ngoan đi qua phía trên, và cho kẻ ngu dại đi phía dưới."
  building_london_bridge_01:0 "Cầu London"
  building_london_bridge_01_desc:0 "Mở rộng $building_type_london_bridge_01_desc$"

  building_type_citadel_of_aleppo_01:1 "$building_citadel_of_aleppo_01$"
  building_type_citadel_of_aleppo_01_desc:0 "Thành lũy Aleppo là một công trình phòng thủ cổ đại, đã được nhiều thế lực sử dụng kể từ khi được xây dựng. Thành lũy này vừa là nơi ở của hoàng gia, nơi trú ẩn kiên cố, đền thờ và nhà ngục."
  building_citadel_of_aleppo_01:0 "Thành lũy Aleppo"
  building_citadel_of_aleppo_01_desc:0 "$building_type_citadel_of_aleppo_01_desc$"
  building_citadel_of_aleppo_02:0 "Thành lũy Aleppo được Tái thiết"
  building_citadel_of_aleppo_02_desc:1 "Sau quá trình tái thiết quy mô lớn, Thành lũy Aleppo đã được gia cố đáng kể và biến thành một thành phố cung điện thực thụ!"
 
  building_type_holy_site_cathedral_01:1 "Đại Thánh đường"
  building_type_holy_site_cathedral_01_desc:1 "[holy_site|E] tại khu vực này thu hút các tín đồ Kitô giáo từ khắp thế giới đã biết. Đại thánh đường không chỉ là một kỳ tích về kỹ thuật và vẻ đẹp, mà còn là nơi trú ẩn an toàn cho lữ khách và là biểu tượng danh giá cho người bảo trợ."
  building_holy_site_cathedral_01:1 "Đại Thánh đường"
  building_holy_site_cathedral_01_desc:1 "$building_type_holy_site_cathedral_01_desc$"
 
  building_type_holy_site_mosque_01:0 "Đại Thánh đường Hồi giáo"
  building_type_holy_site_mosque_01_desc:0 "[holy_site|E] tại khu vực này là điểm đến phổ biến của các tín đồ mộ đạo. Đại thánh đường Hồi giáo mang đến nơi cầu nguyện, nghỉ ngơi và hành hương trước khi họ tiếp tục chuyến đi. Những mái vòm tuyệt đẹp và các tháp cao tinh xảo thể hiện sự vĩ đại của Thượng Đế cho tất cả mọi người chiêm ngưỡng."
  building_holy_site_mosque_01:0 "Đại Thánh đường Hồi giáo"
  building_holy_site_mosque_01_desc:0 "$building_type_holy_site_mosque_01_desc$"
 
  building_type_holy_site_pagan_grand_temple_01:0 "Đại Đền thờ"
  building_type_holy_site_pagan_grand_temple_01_desc:0 "[holy_site|E] tại khu vực này thu hút tín đồ đổ về đông đảo. Đại đền thờ được bao phủ bởi những chạm khắc tinh xảo mô tả các chiến công anh hùng của thần linh và bán thần. Những đống lửa lớn bốc khói nghi ngút hướng lên trời, trong khi các thầy tế ban phước cho mọi người tôn kính các linh hồn."
  building_holy_site_pagan_grand_temple_01:0 "Đại Đền thờ"
  building_holy_site_pagan_grand_temple_01_desc:0 "$building_type_holy_site_pagan_grand_temple_01_desc$"
 
  building_type_holy_site_indian_grand_temple_01:0 "Đại Đền thờ"
  building_type_holy_site_indian_grand_temple_01_desc:0 "[holy_site|E] tại khu vực này thu hút đông đảo khách hành hương khiêm nhường tìm cách thanh tẩy tâm hồn. Đại đền thờ được bao phủ từ móng đến đỉnh bởi các bức tượng và thần tượng, kể lại những huyền thoại cổ xưa và cuộc đời của các bậc tiên tri cao quý."
  building_holy_site_indian_grand_temple_01:0 "Đại Đền thờ"
  building_holy_site_indian_grand_temple_01_desc:0 "$building_type_holy_site_indian_grand_temple_01_desc$"

  building_type_holy_site_buddhist_grand_temple_01:0 "Đại Đền thờ"
  building_type_holy_site_buddhist_grand_temple_01_desc:0 "[holy_site|E] tại khu vực này thu hút đông đảo khách hành hương khiêm nhường tìm cách thanh tẩy tâm hồn. Ở trung tâm quần thể là một Bảo tháp lớn, nơi lưu giữ nhiều thánh tích của chính Đức Phật."
  building_holy_site_buddhist_grand_temple_01:0 "Đại Đền thờ"
  building_holy_site_buddhist_grand_temple_01_desc:0 "$building_type_holy_site_buddhist_grand_temple_01_desc$"
 
  building_type_holy_site_other_grand_temple_01:0 "Đại Đền thờ"
  building_type_holy_site_other_grand_temple_01_desc:0 "[holy_site|E] tại khu vực này là điểm gặp gỡ của những người mộ đạo và tận hiến. Đại đền thờ đứng như một cống hiến cao quý cho các quyền năng tối thượng, với tường và mái vòm được mài nhẵn và sơn phủ bằng những gam màu rực rỡ tôn vinh thần linh."
  building_holy_site_other_grand_temple_01:0 "Đại Đền thờ"
  building_holy_site_other_grand_temple_01_desc:0 "$building_type_holy_site_other_grand_temple_01_desc$"

  building_holy_site_chinese_temple_01: "$building_type_holy_site_buddhist_grand_temple_01$"
  building_holy_site_chinese_temple_01_desc: "Thánh địa [holy_site|E] tại khu vực này là điểm tụ hội của các tín đồ. Những công trình đền đài nguy nga và các bảo tháp với màu sắc mang tính biểu tượng được sắp xếp hài hòa quanh một sân trong đối xứng. Bố cục cân bằng của quần thể này tỏa ra sự tôn nghiêm thanh tịnh."
  building_holy_site_japanese_temple_01: "Đại Thần Xã"
  building_holy_site_japanese_temple_01_desc: "Thánh địa [holy_site|E] tại khu vực này là nơi gặp gỡ của những người mộ đạo và tận hiến. Phần mái ấn tượng chiếm tới một nửa công trình chính và có thể nhìn thấy từ rất xa. Bên trong, một đại sảnh duy nhất có thể tiếp đón số lượng lớn các tín đồ hành hương khi cần."
  building_holy_site_se_asia_pagan_temple_01: "$building_holy_site_other_grand_temple_01$"
  building_holy_site_se_asia_pagan_temple_01_desc: "$building_type_holy_site_other_grand_temple_01_desc$"
  building_type_holy_site_chinese_temple_01: "$building_holy_site_chinese_temple_01$"
  building_type_holy_site_chinese_temple_01_desc: "$building_holy_site_chinese_temple_01_desc$"
  building_type_holy_site_japanese_temple_01: "$building_holy_site_japanese_temple_01$"
  building_type_holy_site_japanese_temple_01_desc: "$building_holy_site_japanese_temple_01_desc$"
  building_type_holy_site_se_asia_pagan_temple_01: "$building_holy_site_other_grand_temple_01$"
  building_type_holy_site_se_asia_pagan_temple_01_desc: "$building_type_holy_site_other_grand_temple_01_desc$"
 
  HOLY_SITE_BUILDING_ENABLED:1 "[faith|E] của người nắm giữ coi nơi này là một [holy_site|E]"
  NOT_HOLY_SITE_BUILDING_ENABLED:1 "[faith|E] của người nắm giữ phải coi nơi này là một [holy_site|E]"
 
  NOT_holy_site_muslim_or_holy_site_trigger:0 "Người nắm giữ phải theo Hồi giáo hoặc coi nơi này là một [holy_site|E]"
  NOT_holy_site_christian_or_holy_site_trigger:0 "Người nắm giữ phải theo Kitô giáo hoặc coi nơi này là một [holy_site|E]"
  NOT_holy_site_muslim_christian_or_holy_site_trigger:0 "Người nắm giữ phải theo Hồi giáo, Kitô giáo, hoặc coi nơi này là một [holy_site|E]"
  NOT_holy_site_muslim_or_zoroastrian_or_holy_site_trigger:0 "Người nắm giữ phải theo Hồi giáo, Bái Hỏa giáo, hoặc coi nơi này là một [holy_site|E]"
  NOT_holy_site_jewish_or_holy_site_trigger:0 "Người nắm giữ phải theo Do Thái giáo hoặc coi nơi này là một [holy_site|E]"
  NOT_holy_site_shinto_or_holy_site_trigger: "Người nắm giữ phải theo $shintoism_religion$ hoặc coi nơi này là một [holy_site|E]"
 
  building_type_holy_site_imam_ali_mosque_01:0 "Imam Ali Mosque"
  building_type_holy_site_imam_ali_mosque_01_desc:0 "Nhà thờ Hồi giáo Imam Ali là nơi an táng Ali, em họ của Muhammad và là Imam Shia đầu tiên kế nhiệm ông. Mỗi năm có hàng nghìn người hành hương đến dâng lễ, được chào đón bởi mái vòm xanh lục uy nghi của giáo đường."
  building_holy_site_imam_ali_mosque_01:0 "$building_type_holy_site_imam_ali_mosque_01$"
  building_holy_site_imam_ali_mosque_01_desc:0 "$building_type_holy_site_imam_ali_mosque_01_desc$"
 
  building_type_holy_site_great_mosque_of_mecca_01:0 "Great Mosque of Mecca"
  building_type_holy_site_great_mosque_of_mecca_01_desc:0 "Đại Thánh đường Mecca là một công trình đồ sộ và cổ xưa, với những bức tường bao quanh thánh địa Kaaba linh thiêng. Nhiều vị Sultan vĩ đại đã mở rộng giáo đường và khu vực xung quanh kể từ khi được xây dựng. Mỗi tín đồ Hồi giáo đều được kỳ vọng sẽ viếng thăm nơi này khi thực hiện Hajj."
  building_holy_site_great_mosque_of_mecca_01:0 "$building_type_holy_site_great_mosque_of_mecca_01$"
  building_holy_site_great_mosque_of_mecca_01_desc:0 "$building_type_holy_site_great_mosque_of_mecca_01_desc$"
 
  building_type_holy_site_cologne_cathedral_01:0 "Cologne Cathedral"
  building_type_holy_site_cologne_cathedral_01_desc:0 "Nhà thờ chính tòa Cologne lưu giữ thánh tích của Ba Vua, thu hút các đoàn hành hương từ khắp thế giới Kitô giáo. Nhà thờ được xây dựng theo phong cách Gothic và được trang trí lộng lẫy với các tháp nhọn cùng những chi tiết tinh xảo."
  building_holy_site_cologne_cathedral_01:0 "$building_type_holy_site_cologne_cathedral_01$"
  building_holy_site_cologne_cathedral_01_desc:0 "$building_type_holy_site_cologne_cathedral_01_desc$"
 
  building_type_holy_site_canterbury_cathedral_01:1 "$building_type_holy_site_canterbury_cathedral_03$"
  building_type_holy_site_canterbury_cathedral_01_desc:1 "Augustine, nhà truyền giáo La Mã và sau này là tổng giám mục, đã xây dựng Nhà thờ Canterbury sau khi chọn thị trấn này làm trung tâm giáo phận tại Kent. Nhà thờ mới đã khôi phục tầm quan trọng của thành phố, trao cho nó quyền uy đối với Giáo hội Anh."
  building_holy_site_canterbury_cathedral_01:1 "Canterbury Basilica"
  building_holy_site_canterbury_cathedral_01_desc:0 "$building_type_holy_site_canterbury_cathedral_01_desc$"
 
  building_type_holy_site_canterbury_cathedral_02:0 "$building_type_holy_site_canterbury_cathedral_03$"
  building_type_holy_site_canterbury_cathedral_02_desc:0 "Nhà thờ không tránh khỏi sự tàn phá của thời gian và hoàn cảnh khắc nghiệt. Phong cách Norman được lựa chọn để tu sửa những thiệt hại do hỏa hoạn gây ra. Gian giữa hình thánh giá mới thay thế cho vương cung thánh đường cũ, và một tháp chuông độc lập được xây dựng sau đó."
  building_holy_site_canterbury_cathedral_02:0 "Temple of Canterbury"
  building_holy_site_canterbury_cathedral_02_desc:0 "$building_type_holy_site_canterbury_cathedral_02_desc$"
 
  building_type_holy_site_canterbury_cathedral_03:0 "Canterbury Cathedral"
  building_type_holy_site_canterbury_cathedral_03_desc:0 "Thiệt hại nghiêm trọng buộc nhà thờ phải trải qua một dự án tái thiết mới. Dù kết cấu Norman vẫn được giữ lại ở một số phần, phong cách Gothic rực rỡ đã được lựa chọn để nâng tầm công trình."
  building_holy_site_canterbury_cathedral_03:0 "$building_type_holy_site_canterbury_cathedral_02$"
  building_holy_site_canterbury_cathedral_03_desc:0 "$building_type_holy_site_canterbury_cathedral_02_desc$"
 
  building_type_doges_palace_01:0 "Doge's Palace"
  building_type_doges_palace_01_desc:0 "Dinh thự Doge là nơi đặt trụ sở chính quyền của Cộng hòa Venice. Một công trình ấn tượng, bao gồm nhiều gian phòng dành cho các cơ quan như Hội đồng, Thượng viện, bộ máy hành chính và tư pháp."
  building_doges_palace_01:0 "$building_type_doges_palace_01$"
  building_doges_palace_01_desc:0 "$building_type_doges_palace_01_desc$"
 
  building_type_visby_ringmur_01:0 "Visby Ringmur"
  building_type_visby_ringmur_01_desc:0 "Tường thành Visby bảo vệ thành phố khỏi các mối đe dọa bên ngoài như cướp bóc hay người Đan Mạch. Nó cũng ngăn chặn hiệu quả các viên thu thuế do Hội đồng Gotland cử đến! Để tiếp cận của cải bên trong, kẻ tấn công trước hết phải đối mặt với vô số tháp canh, tất cả đều có cung thủ túc trực."
  building_visby_ringmur_01:0 "$building_type_visby_ringmur_01$"
  building_visby_ringmur_01_desc:0 "$building_type_visby_ringmur_01_desc$"
 
  building_type_walls_of_benin_01:0 "Walls of Benin"
  building_type_walls_of_benin_01_desc:0 "Tường thành Benin là một hệ thống công trình đất khổng lồ #low (Iya trong ngôn ngữ Edo)#!, bao quanh toàn bộ Benin. Tường thành được xây dựng theo cấu trúc hào và đê, với hào nước bên trong và lũy đất bên ngoài."
  building_walls_of_benin_01:0 "$building_type_walls_of_benin_01$"
  building_walls_of_benin_01_desc:0 "$building_type_walls_of_benin_01_desc$"
 
  building_type_the_friday_mosque_01:0 "The Friday Mosque"
  building_type_the_friday_mosque_01_desc:0 "Nhà thờ Thứ Sáu, hay còn gọi là Thánh đường Jameh của Esfahan, được xây dựng dưới triều đại Umayyad. Tương truyền rằng vị Caliph đã tự tay dựng nên một trong những cột trụ của giáo đường. Trước khi trở thành nhà thờ Hồi giáo, nơi đây từng là địa điểm thờ phụng của người Bái Hỏa."
  building_the_friday_mosque_01:0 "$building_type_the_friday_mosque_01$"
  building_the_friday_mosque_01_desc:0 "$building_type_the_friday_mosque_01_desc$"
 
  building_type_brihadeeswarar_temple_01:0 "Brihadeeswarar Temple"
  building_type_brihadeeswarar_temple_01_desc:0 "Đền Brihadeeswarar được посвящ посвящ thờ thần Shiva của Ấn Độ giáo và là một trong những ngôi đền lớn nhất Nam Ấn, được xây dựng theo phong cách kiến trúc Dravidian tinh xảo. Tên của ngôi đền là một từ ghép tiếng Phạn, tạm dịch là \"Ngôi đền của Đại Thần Shiva.\""
  building_brihadeeswarar_temple_01:0 "$building_type_brihadeeswarar_temple_01$"
  building_brihadeeswarar_temple_01_desc:0 "$building_type_brihadeeswarar_temple_01_desc$"
 
  building_type_holy_site_mahabodhi_temple_01:0 "Mahabodhi Temple"
  building_type_holy_site_mahabodhi_temple_01_desc:0 "Đền Mahabodhi đánh dấu địa điểm nơi Đức Phật được cho là đã đạt đến giác ngộ. Đây là điểm hành hương quan trọng đối với cả Phật tử và tín đồ Ấn Độ giáo. Việc xây dựng ngôi đền bắt đầu vào khoảng năm 200 dưới triều đại Hoàng đế Ashoka và đã được trùng tu, mở rộng nhiều lần kể từ đó."
  building_holy_site_mahabodhi_temple_01:0 "$building_type_holy_site_mahabodhi_temple_01$"
  building_holy_site_mahabodhi_temple_01_desc:0 "$building_type_holy_site_mahabodhi_temple_01_desc$"
 
  building_type_holy_site_great_mosque_of_cordoba_01:0 "The Great Mosque of Cordoba"
  building_type_holy_site_great_mosque_of_cordoba_01_desc:0 "Đại Thánh đường Cordoba được xây dựng sau cuộc chinh phục Hồi giáo Vương quốc Visigoth, trên nền móng của một nhà thờ Kitô giáo. Ban đầu, địa điểm này được cả người Hồi giáo và Kitô giáo cùng sử dụng, nhưng phần dành cho Kitô giáo cuối cùng đã được mua lại và phá bỏ để nhường chỗ cho Thánh đường Lớn."
  building_holy_site_great_mosque_of_cordoba_01:0 "$building_type_holy_site_great_mosque_of_cordoba_01$"
  building_holy_site_great_mosque_of_cordoba_01_desc:0 "$building_type_holy_site_great_mosque_of_cordoba_01_desc$"
 
  building_type_walls_of_genoa_01:0 "Walls of Genoa"
  building_type_walls_of_genoa_01_desc:0 "Tường thành Genoa được xây dựng vào thế kỷ thứ 9 sau khi thành phố được trao quyền tự trị đáng kể. Các bức tường, cùng với sự bảo vệ của đường bờ biển, cho phép khu vực này phát triển và thịnh vượng."
  building_walls_of_genoa_01:0 "$building_type_walls_of_genoa_01$"
  building_walls_of_genoa_01_desc:0 "$building_type_walls_of_genoa_01_desc$"
 
  building_type_holy_site_great_mosque_of_djenne_01:0 "Đại Thánh đường Djenne"
  building_type_holy_site_great_mosque_of_djenne_01_desc:0 "Đại Thánh đường Djenne tọa lạc bên bờ sông Bani. Được xây dựng hoàn toàn bằng gạch bùn, công trình này cần được chăm sóc rất nhiều, điều mà các tín đồ luôn sẵn sàng thực hiện. Hằng năm, những đám đông lớn tụ họp để tu sửa và cải thiện nhà thờ Hồi giáo."
  building_holy_site_great_mosque_of_djenne_01:0 "$building_type_holy_site_great_mosque_of_djenne_01$"
  building_holy_site_great_mosque_of_djenne_01_desc:0 "$building_type_holy_site_great_mosque_of_djenne_01_desc$"
 
  building_type_holy_site_great_mosque_of_samarra_01:0 "Đại Thánh đường Samarra"
  building_type_holy_site_great_mosque_of_samarra_01_desc:0 "Đại Thánh đường Samarra được hoàn thành vào năm 851 sau Công nguyên bởi Khalip Abbasid Al-Mutawakkil, người trị vì tại Samarra. Đặc điểm nổi bật nhất của công trình là Tháp Malwiya, một tháp minaret xoắn ốc tráng lệ, vươn cao lên bầu trời với chiều cao ấn tượng."
  building_holy_site_great_mosque_of_samarra_01:0 "$building_type_holy_site_great_mosque_of_samarra_01$"
  building_holy_site_great_mosque_of_samarra_01_desc:0 "$building_type_holy_site_great_mosque_of_samarra_01_desc$"
 
  building_type_holy_site_prophetic_mosque_01:0 "Thánh đường Tiên tri"
  building_type_holy_site_prophetic_mosque_01_desc:0 "Thánh đường Tiên tri, hay Al-Masjid an-Nabawi, là một thánh đường kiểu ngoài trời do chính Nhà Tiên tri Muhammad thành lập. Đây là một trong những thánh đường đầu tiên mà ông xây dựng, và địa điểm này nằm gần nơi cư trú của ông."
  building_holy_site_prophetic_mosque_01:0 "$building_type_holy_site_prophetic_mosque_01$"
  building_holy_site_prophetic_mosque_01_desc:0 "$building_type_holy_site_prophetic_mosque_01_desc$"
 
  building_type_generic_university:0 "Đại học"
  building_type_generic_university_desc:0 "Một trường đại học là nơi học vấn cao cấp, chỉ dành cho những người có địa vị và tài sản được xem là xứng đáng. Nó thu hút các học giả và nhà khoa học đến tranh luận, nghiên cứu, chép sách và cuối cùng là tập hợp tri thức của họ trong những bức tường này."
  building_generic_university:0 "$building_type_generic_university$"
  building_generic_university_desc:0 "$building_type_generic_university_desc$"
  university_effect_desc:1 "Mở khóa Tùy chọn [education|E] #V $EDUCATION_UNIVERSITY$#! cho các [rulers|E] trong cùng một [realm|E]"
  university_toto_effect_desc:0 "$tournament_cost_discount_effect_desc$$tournament_phase_board_game$ và $tournament_phase_recital$$tournament_contest_cost_discount_effect_desc$\n"
