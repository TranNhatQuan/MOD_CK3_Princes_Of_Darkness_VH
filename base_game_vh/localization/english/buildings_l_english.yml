  building_type_fengtian_mines_01: "Các mỏ ngọc Fengtian"
  building_type_fengtian_mines_01_desc: "Nằm dọc theo vùng cao trung tâm của hòn đảo, các mỏ ngọc Fengtian tạo điều kiện cho thương mại đường biển về đá quý. Được giới chức, dân địa phương và thương nhân từ những miền xa xôi ưa chuộng, loại ngọc xanh lục rực rỡ này giữ vị trí đặc biệt trong nguồn thu của quận."
