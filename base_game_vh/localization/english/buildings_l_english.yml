  building_type_siena_university:0 "Đại học Siena"
  building_type_siena_university_desc:0 "$building_type_generic_university_desc$\n\nĐại học Siena cùng các maestri phục vụ tại đây được tài trợ hoàn toàn bằng thuế thu từ chính thành phố Siena, cụ thể hơn là một loại thuế đánh vào những người cho sinh viên thuê phòng."
  building_siena_university:0 "$building_type_siena_university$"
