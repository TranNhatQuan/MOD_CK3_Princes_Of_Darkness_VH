  building_type_rammelsberg_mines_01:0 "Mỏ Rammelsberg"
  building_type_rammelsberg_mines_01_desc:1 "Dưới chân núi Rammelsberg là một mỏ bạc sinh lợi và luôn được săn đón."
  building_rammelsberg_mines_01:1 "Khu định cư khai mỏ Rammelsberg"
  building_rammelsberg_mines_01_desc:1 "Một khu định cư khai mỏ nhỏ đã hình thành gần nơi các mạch quặng nằm. Những người định cư đã bắt đầu khai mở các mạch và khai thác quặng, nhưng cho đến nay họ mới chỉ chạm tới bề mặt."
  building_rammelsberg_mines_02:1 "Mỏ Rammelsberg"
  building_rammelsberg_mines_02_desc:1 "Khi khu định cư phát triển, ngày càng nhiều quặng được khai thác. Dòng người kỹ sư lành nghề đổ về cho phép xây dựng một mỏ thực thụ."
  building_rammelsberg_mines_03:1 "Mỏ Rammelsberg Lớn"
  building_rammelsberg_mines_03_desc:1 "Khi hoạt động khai mỏ mở rộng, bản thân các mỏ cũng phát triển theo. Nhiều lối vào mới được xây dựng và các trục lớn được đào để cho phép khai thác quặng ở tầng sâu."
  building_rammelsberg_mines_04:1 "Tổ hợp khai mỏ Rammelsberg"
  building_rammelsberg_mines_04_desc:1 "Khi sản lượng quặng tăng lên, nhiều xưởng đúc và lò luyện được dựng quanh khu định cư. Việc chế biến kim loại đã trở thành bản năng thứ hai của cư dân nơi đây, và tay nghề của họ được biết đến khắp thế giới đã biết."
