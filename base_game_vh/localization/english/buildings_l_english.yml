  building_type_nalanda_university:0 "Đại học Nalanda"
  building_type_nalanda_university_desc:0 "$building_type_generic_university_desc$\n\nĐại học Nalanda là một trung tâm quan trọng của học thuật Vệ Đà và thu hút sinh viên từ những vùng xa xôi như Tây Tạng và Trung Hoa."
