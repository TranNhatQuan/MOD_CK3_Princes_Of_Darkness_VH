  building_type_hetian_mines_01: "Các mỏ Khotan"
  building_type_hetian_mines_01_desc: "Khotan là nguồn cung ngọc Hetian từ thuở khai thiên lập địa. Loại đá trắng quý hiếm này là loại ngọc được trân quý nhất trong tất cả các loại ngọc, với nhiều người còn coi nó có giá trị cao hơn cả vàng hay bạc. Ngọc được khai thác trực tiếp từ sườn núi cũng như thu nhặt từ các hố lộ thiên và lòng sông."
  building_hetian_mines_01: "Khu định cư khai mỏ Khotan"
  building_hetian_mines_01_desc: "$building_type_hetian_mines_01_desc$"
  building_hetian_mines_02: "Mỏ Khotan"
  building_hetian_mines_02_desc: "Khi khu định cư khai mỏ mở rộng, ngày càng nhiều ngọc được khai thác. Cùng với danh tiếng lan xa của những viên đá quý, làn sóng kỹ sư và thương nhân lành nghề đổ về đã giúp nâng cao đáng kể lợi nhuận của hoạt động này."
  building_hetian_mines_03: "Mỏ Khotan Lớn"
  building_hetian_mines_03_desc: "Khi hoạt động khai mỏ phát triển, bản thân các mỏ cũng mở rộng theo. Nhiều người hơn được tuyển dụng, và lưu lượng di chuyển đến và đi từ các điểm khai thác ngọc đã trở thành một đặc trưng thường trực của cảnh quan."
  building_hetian_mines_04: "Tổ hợp khai mỏ Khotan"
  building_hetian_mines_04_desc: "Theo thời gian, ngọc không chỉ trở thành mặt hàng xuất khẩu chủ lực của vùng mà còn là sinh kế của vô số nghệ nhân và thợ thủ công. Một ngành công nghiệp thực thụ gồm các xưởng chế tác và thương nhân trung gian nay đã mọc lên dọc các con phố."

  building_type_dushan_mines_01:0 "Các mỏ Dushan"
  building_type_dushan_mines_01_desc:0 "Là một trong bốn loại ngọc lớn của Trung Hoa, Dushan đã là địa điểm khai thác ngọc kể từ thời nhà Hán. Loại ngọc này khác biệt so với các loại khác ở chỗ màu sắc đậm hơn và thường pha trộn hơn."
  building_dushan_mines_01:0 "Khu định cư khai mỏ Dushan"
  building_dushan_mines_01_desc: "$building_type_dushan_mines_01_desc$"
