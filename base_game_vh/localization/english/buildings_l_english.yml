  building_type_zijinshan_mines_01:0 "Mỏ Zijinshan"
  building_type_zijinshan_mines_01_desc:0 "Ban đầu vùng núi này còn hẻo lánh và hoang sơ, nhưng lại chứa kho báu khổng lồ bằng vàng và đồng. Với quản lý thích hợp, việc khai thác nhỏ lẻ tại địa phương có thể trở thành nguồn kim loại quý lớn."
