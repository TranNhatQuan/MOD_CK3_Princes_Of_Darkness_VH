  building_type_sankore_university_desc:0 "$building_type_generic_university_desc$\n\nĐại học Sankoré, khởi đầu là một thánh đường Hồi giáo, đã chuyển mình thành trung tâm học thuật sau khi tích lũy được một lượng lớn sách từ các thương nhân du hành."
