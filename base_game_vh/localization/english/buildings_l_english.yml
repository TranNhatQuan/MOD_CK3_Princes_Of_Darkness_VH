  building_type_nishapur_mines_01:0 "Các mỏ Nishapur"
  building_type_nishapur_mines_01_desc:0 "Ngọc lam có thể được tìm thấy ở nhiều nơi, nhưng không đâu phong phú và có chất lượng cao như tại các dãy núi gần Nishapur. Các viên đá cũng rất dễ tiếp cận ngay cả khi không cần đào những hố quá sâu."
