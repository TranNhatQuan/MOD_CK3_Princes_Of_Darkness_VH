  building_type_guiyang_mines_01:0 "Mỏ Guiyang"
  building_type_guiyang_mines_01_desc:0 "Guiyang đã là nơi đặt xưởng đúc Hoàng triều hơn một ngàn năm. Triều đại này nối tiếp triều đại khác đã bảo vệ các mỏ bạc địa phương và phát hành tiền tệ với sản phẩm của chúng làm chuẩn mực."
