  building_type_ratnapura_mines_01:0 "Các mỏ Ratnapura"
  building_type_ratnapura_mines_01_desc:0 "Ratnapura, Thành phố Ngọc quý, là một trong những nguồn cung ruby và sapphire quan trọng nhất thế giới. Trong hàng trăm năm, những kho báu này đã được khai thác và buôn bán với các thương nhân từ tiểu lục địa Ấn Độ, Đông Nam Á và Trung Hoa."
  building_ratnapura_mines_01:0 "Hố khai mỏ Ratnapura"
  building_ratnapura_mines_01_desc:0 "$building_type_ratnapura_mines_01_desc$"
  building_ratnapura_mines_02:0 "Mỏ Ratnapura"
  building_ratnapura_mines_02_desc:1 "Các hố khai mỏ đã được mở rộng, và các kỹ sư được điều đến nhằm thực sự tăng mạnh sản lượng khai thác đá quý."
  building_ratnapura_mines_03:0 "Mỏ Ratnapura Lớn"
  building_ratnapura_mines_03_desc:0 "Một ngôi làng đã hình thành quanh các hố khai mỏ, và những người thợ thường xuyên tìm thấy các viên đá quý khổng lồ."
  building_ratnapura_mines_04:0 "Tổ hợp khai mỏ Ratnapura"
  building_ratnapura_mines_04_desc:0 "Việc khai thác đá quý đã đạt đến quy mô gần như công nghiệp, với số lượng công nhân lên tới hàng nghìn người. Của cải vô tận dường như tuôn trào từ các mỏ."

  building_type_mogok_mines_01:0 "Các mỏ Thung lũng Mogok"
  building_type_mogok_mines_01_desc:0 "Thung lũng Mogok nổi tiếng với ruby và sapphire, cũng như các loại đá kém giá trị hơn như spinel hay garnet.\nĐiều khiến “thung lũng ruby” nổi bật hơn cả về số lượng chính là chất lượng của các viên đá. Khi những viên đá đỏ sẫm được khai quật từ lòng đất, chúng lấp lánh dưới ánh mặt trời gay gắt theo một cách không nơi nào khác sánh được."
  building_mogok_mines_01:0 "Hố khai mỏ Mogok"
  building_mogok_mines_01_desc:0 "$building_type_mogok_mines_01_desc$"
  building_mogok_mines_02:0 "Mỏ Mogok"
  building_mogok_mines_02_desc:1 "Các hố khai mỏ đã được mở rộng, và các kỹ sư được điều đến nhằm thực sự tăng mạnh sản lượng khai thác đá quý."
  building_mogok_mines_03:0 "Mỏ Mogok Lớn"
  building_mogok_mines_03_desc:0 "Một ngôi làng đã hình thành quanh các hố khai mỏ, và những người thợ thường xuyên tìm thấy các viên đá quý khổng lồ."
  building_mogok_mines_04:0 "Tổ hợp khai mỏ Mogok"
  building_mogok_mines_04_desc:0 "Việc khai thác đá quý đã đạt đến quy mô gần như công nghiệp, với số lượng công nhân lên tới hàng nghìn người. Của cải vô tận dường như tuôn trào từ các mỏ."


  building_type_zawar_mines_01:0 "Các mỏ Zawar"
  building_type_zawar_mines_01_desc:0 "Trong hàng nghìn năm, các mỏ Zawar là nguồn cung dồi dào chì, kẽm và bạc. Các trữ lượng tại Zawar không chỉ độc đáo về mức độ phong phú mà còn ở chỗ chúng được phân tách rõ ràng, cho phép tách quặng thủ công mà không cần đến các quy trình luyện kim tiên tiến."
