  building_type_lantian_mines_01: "Các mỏ ngọc Lantian"
  building_type_lantian_mines_01_desc: "Những ngọn đồi Lantian đã là nguồn cung ngọc chất lượng cao trong hàng nghìn năm. Loại đá nhạt màu này, từng được chạm khắc thành ngọc tỷ hoàng gia và được các thi nhân thời Đường ca tụng, được trân trọng không phải vì số lượng mà vì vẻ đẹp và địa vị độc đáo của nó."
