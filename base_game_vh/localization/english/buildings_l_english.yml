  oath_faithful_building_02_tooltip_high_medieval: "Ít nhất #V 4#! [close_family|E] của Ngài (hiện tại: #P [GetPlayer.MakeScope.ScriptValue('oath_faithful_building_02_tooltip_value')|0]#!):\n Có đặc điểm [trait|E] [GetTrait('devoted').GetName(GetNullCharacter)]"
