  building_type_srebrenica_mines_01_desc:0 "Được khai thác từ thời cổ đại nhờ trữ lượng bạc khổng lồ, Srebrenica — Thành phố Bạc — nay đã chín muồi để được khai thác trở lại bằng các kỹ thuật khai mỏ hiện đại."
