 #Ziliujing and Gongjing
  building_type_zigong_mines_01: "Giếng Muối Ziliujing & Gongjing"
  building_type_zigong_mines_01_desc: "Với những lợi thế đặc biệt cho khai thác muối, vùng này đã trở thành nơi lấy muối từ lòng đất từ thời nhà Thương, cách đây hàng ngàn năm. Ngày nay và trong tương lai gần, nơi này vẫn là yếu tố quan trọng trong nền kinh tế khu vực."
  building_zigong_mines_01: "Khu Mỏ Ziliujing & Gongjing"
  building_zigong_mines_01_desc: "$building_type_zigong_mines_01_desc$"
  building_zigong_mines_02: "Mỏ Ziliujing & Gongjing"
  building_zigong_mines_02_desc: "$building_turda_mines_02_desc$"
  building_zigong_mines_03: "Mỏ Ziliujing & Gongjing Lớn"
  building_zigong_mines_03_desc: "$building_turda_mines_03_desc$"
  building_zigong_mines_04: "Khu Mỏ Ziliujing & Gongjing Phức Hợp"
  building_zigong_mines_04_desc: "$building_turda_mines_04_desc$"

  building_type_allaq_mines_01:0 "Các mỏ Wadi al-Allaq"
  building_type_allaq_mines_01_desc:0 "Được các biên niên sử gia gọi đơn giản là xứ sở khai mỏ, dãy núi ở sa mạc Đông Ai Cập ẩn chứa những trữ lượng vàng sâu trong lòng đất. Trung tâm chính của khu vực này là Wadi al-Allaq và các mỏ của nó."
  building_allaq_mines_01:0 "Khu định cư khai mỏ Wadi al-Allaq"
  building_allaq_mines_01_desc:0 "$building_type_allaq_mines_01_desc$"
  building_allaq_mines_02:0 "Mỏ Wadi al-Allaq"
  building_allaq_mines_02_desc:1 "$building_rammelsberg_mines_02_desc$"
  building_allaq_mines_03:0 "Mỏ Wadi al-Allaq Lớn"
  building_allaq_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
  building_allaq_mines_04:0 "Tổ hợp khai mỏ Wadi al-Allaq"
  building_allaq_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"
 
  building_type_takkeda_mines_01:0 "Các mỏ Takkeda"
  building_type_takkeda_mines_01_desc:0 "Dãy núi Aïr sở hữu những trữ lượng đồng phong phú và đã được khai thác tại Takkeda từ thời tiền sử."
  building_takkeda_mines_01:0 "Khu định cư khai mỏ Takkeda"
  building_takkeda_mines_01_desc:0 "$building_type_takkeda_mines_01_desc$"
  building_takkeda_mines_02:0 "Mỏ Takkeda"
  building_takkeda_mines_02_desc:1 "$building_rammelsberg_mines_02_desc$"
  building_takkeda_mines_03:0 "Mỏ Takkeda Lớn"
  building_takkeda_mines_03_desc:0 "$building_rammelsberg_mines_03_desc$"
  building_takkeda_mines_04:0 "Tổ hợp khai mỏ Takkeda"
  building_takkeda_mines_04_desc:0 "$building_rammelsberg_mines_04_desc$"

  building_type_kollur_mines_01:0 "Các mỏ Kollur"
  building_type_kollur_mines_01_desc:0 "Các mỏ Kollur khai thác mạch kim cương lớn nhất trên toàn tiểu lục địa Ấn Độ. Công việc cực kỳ nguy hiểm, nhưng sự giàu có thu được thì không thể tưởng tượng nổi."
  building_kollur_mines_01:0 "Các hố khai thác Kollur"
  building_kollur_mines_01_desc:0 "Chỉ là những hố đất sét và sỏi đá, nơi đây chứng kiến những công nhân mặc khố lao động ngày đêm để khai thác kim cương."
  building_kollur_mines_02:0 "Mỏ Kollur"
  building_kollur_mines_02_desc:1 "Các hố khai thác đã được mở rộng, và các kỹ sư được đưa tới để thực sự đẩy mạnh việc khai thác kim cương."
  building_kollur_mines_03:0 "Mỏ Kollur Lớn"
  building_kollur_mines_03_desc:0 "Một ngôi làng đã hình thành quanh vô số hố khai thác, và các công nhân thường xuyên tìm thấy những viên kim cương khổng lồ."
  building_kollur_mines_04:0 "Tổ hợp khai mỏ Kollur"
  building_kollur_mines_04_desc:0 "Việc khai thác kim cương đã đạt tới quy mô gần như công nghiệp, với số lượng công nhân lên tới hàng nghìn người. Của cải dường như tuôn chảy bất tận từ các mỏ."
 
  building_type_tribe_01:1 "Cứ điểm bộ lạc"
  building_type_tribe_01_desc:1 "Một cứ điểm bộ lạc đơn giản nhưng hiệu quả, đứng gác bảo vệ cho một ngôi làng bộ lạc."
  building_tribe_01:1 "Cứ điểm bộ lạc"
  building_tribe_01_desc:1 "Được xây dựng từ thân gỗ và đá đẽo thô, cứ điểm này vẫn toát lên vẻ uy nghi dù có quy mô nhỏ."
  building_tribe_02:1 "Cứ điểm bộ lạc kiên cố"
  building_tribe_02_desc:1 "Cứ điểm kiên cố lấy cảm hứng từ các lâu đài phong kiến, bổ sung nhiều yếu tố phòng thủ mới."
 
  building_type_longhouses_01:1 "Nhà hội họp"
  building_type_longhouses_01_desc:1 "Các thủ lĩnh bộ lạc, bô lão và lãnh chúa chiến tranh cùng hội họp trong nhà dài khi đưa ra quyết định. Những đại sảnh uy nghi này mang lại thanh danh cho người tổ chức."
  building_longhouses_01:1 "Nhà dài"
  building_longhouses_01_desc:1 "Nhà dài đủ rộng để tổ chức các cuộc họp quan trọng giữa các bô lão. Luật lệ và chính sách được quyết định tại đây."
  building_longhouses_02:1 "Đại sảnh"
  building_longhouses_02_desc:1 "Các đại sảnh có một sân khấu trung tâm, nơi thủ lĩnh hoặc lãnh chúa chiến tranh có thể đưa ra những bài diễn thuyết hùng hồn."
 
  building_type_war_camps_01:0 "Doanh trại chiến tranh"
  building_type_war_camps_01_desc:1 "Những chiến binh bộ lạc hung mãnh tập hợp tại doanh trại khi tiếng kèn chiến tranh vang lên. Ngay cả trong thời bình, họ vẫn luyện tập và so tài, chuẩn bị cho điều không thể tránh khỏi là xung đột."
  building_war_camps_01:1 "Bãi luyện chiến"
  building_war_camps_01_desc:2 "Trang thiết bị huấn luyện, đấu trường và tường gỗ tạo nên bãi luyện chiến. Các chiến binh đến đây để mài giũa kỹ năng."
  building_war_camps_02:1 "Nhà chiến binh"
  building_war_camps_02_desc:1 "Chỉ những chiến binh vĩ đại nhất mới được phép bước vào nhà chiến binh, và sự hiện diện của họ thôi cũng đã truyền cảm hứng."
 
  building_type_palisades_01:0 "Hàng rào cọc"
  building_type_palisades_01_desc:2 "Nhiều lớp hàng rào cọc gỗ bảo vệ các khu định cư bộ lạc rải rác, che chở họ khỏi những mối đe dọa đơn giản như thú hoang hay các cuộc tập kích nhỏ."
  building_palisades_01:1 "Hàng rào cọc đơn giản"
  building_palisades_01_desc:1 "Hàng rào cọc đơn giản chỉ cung cấp sự bảo vệ hạn chế; hiệu quả trước các cuộc đụng độ nhỏ nhưng kém tin cậy trước những nhóm địch lớn."
  building_palisades_02:1 "Tường & hào"
  building_palisades_02_desc:1 "Các con hào bên ngoài kết hợp với tường cọc gia cố bằng đá mang lại khả năng phòng thủ khá tốt trước các cuộc vây hãm."
 
  building_type_market_villages_01:1 "Chợ"
  building_type_market_villages_01_desc:1 "Nhiều ngôi làng chợ nhỏ đã mọc lên quanh những tuyến đường đông đúc hơn của vùng đất này. Tại đây, dân bộ lạc trao đổi và mặc cả với các thương nhân du hành."
  building_market_villages_01:1 "Tiền đồn thương mại"
  building_market_villages_01_desc:1 "Các tiền đồn thương mại tạo cơ hội cho dân bộ lạc và thương nhân gặp gỡ và trao đổi."
  building_market_villages_02:1 "Làng chợ"
  building_market_villages_02_desc:2 "Vào những thời điểm nhất định, các ngôi làng này tổ chức những phiên chợ công cộng, thu hút thương nhân từ khắp khu vực và gia tăng sự giàu có tại địa phương."
 
  building_type_water_temples_01: "Đền Nước Subak"
  building_type_water_temples_01_desc: "Các hợp tác xã thủy lợi nội địa gắn với miếu và đền nước; lịch nghi lễ điều phối việc gieo trồng và bảo trì kênh mương."
  building_water_temples_01: "Đập Subak & Miếu Đồng Ruộng"
  building_water_temples_01_desc: "Những con đập nhỏ và kênh đất nối liền các thửa ruộng lúa; một ngôi miếu giám sát lễ vật và lịch lao động. Thặng dư ổn định bắt đầu tuôn chảy, kéo theo các nghi lễ."
  building_water_temples_02: "Miếu Hội đồng Subak"
  building_water_temples_02_desc: "Nhiều miếu phối hợp một hệ thống subak rộng lớn với lịch phân phối nước định kỳ; tranh chấp và sửa chữa được xử lý tập thể, nâng cao khả năng kiểm soát và sản lượng."
  building_water_temples_03: "Mạng lưới Đền Nước"
  building_water_temples_03_desc: "Một hệ thống đền nước hoàn chỉnh giám sát việc gieo trồng đồng bộ và chu kỳ để đất nghỉ; sâu bệnh giảm, sản lượng tăng, và lòng sùng kính lan rộng."
  building_water_temples_04: "Cảnh quan Đền Nước Đại Quy Mô"
  building_water_temples_04_desc: "Toàn bộ lưu vực được tổ chức thông qua các hội đồng do đền dẫn dắt; ruộng bậc thang, cống nước và lễ hội biến tỉnh này thành vựa lúa linh thiêng."
 
  building_type_stilted_granaries_01: "Kho Lương Trên Cọc"
  building_type_stilted_granaries_01_desc: "Những kho thóc dựng trên cột cao chống chuột, lý tưởng để tích trữ cống nạp và tiếp tế cho các đội chiến binh."
  building_stilted_granaries_01: "Kho Lương Trên Cột"
  building_stilted_granaries_01_desc: "Một kho đơn giản bốn cột giữ hạt giống và cống nạp luôn khô ráo; quân canh làng ăn uống đầy đủ hơn khi ra chiến dịch."
  building_stilted_granaries_02: "Dãy Kho Lương"
  building_stilted_granaries_02_desc: "Một hàng kho dựng trên cọc với bẫy chuột và bậc thang có mái che. Thuế lương thực ổn định hơn và khả năng hồi phục quân dịch được cải thiện."
  building_stilted_granaries_03: "Kho Lương Chạm Khắc"
  building_stilted_granaries_03_desc: "Những hoa văn chạm khắc biểu trưng cho thặng dư; quản lý kho luân chuyển lương thực để phục vụ các cuộc hành quân dài ngày."
  building_stilted_granaries_04: "Khu Kho Lương"
  building_stilted_granaries_04_desc: "Một cụm kho có hàng rào, chòi gác và nhà ghi chép; an ninh lương thực giúp toàn bộ quận ổn định."
 
  building_type_kora_kora_yards_01: "Xưởng Thuyền Kora-Kora"
  building_type_kora_kora_yards_01_desc: "Nhà thuyền của các thị tộc và ụ hạ thủy cho thuyền chiến độc mộc có càng chống."
  building_kora_kora_yards_01: "Nhà Thuyền"
  building_kora_kora_yards_01_desc: "Ụ có mái che cho thuyền chèo có càng; thủy thủ luyện tập đột kích ven bờ và hành trình liên đảo."
  building_kora_kora_yards_02: "Xưởng Thuyền Thị Tộc"
  building_kora_kora_yards_02_desc: "Kho gỗ, dây sợi buộc và càng dự phòng giúp quay vòng nhanh; các toán cướp mang về chiến lợi phẩm và hàng trao đổi."
  building_kora_kora_yards_03: "Xưởng Kora-Kora"
  building_kora_kora_yards_03_desc: "Thân thuyền lớn hơn, sàn chiến đấu và trống hiệu lệnh; tuần tra bờ biển và viễn chinh theo mùa trở thành nhịp sống (và nguồn thu)."
  building_kora_kora_yards_04: "Kho Thuyền Chiến Đại Quy Mô"
  building_kora_kora_yards_04_desc: "Thợ cả trang bị cho cả hạm đội; đường trượt hạ thủy, xưởng buồm và bãi tập kết gieo rắc nỗi sợ cho láng giềng ."
 
  building_type_idjang_forts_01: "Pháo đài Idjang"
  building_type_idjang_forts_01_desc: "Thành lũy bộ lạc nhiều tầng, là các điểm tựa phòng thủ trên mỏm núi hoặc gò cao."
  building_idjang_forts_01: "Idjang Rào Gỗ"
  building_idjang_forts_01_desc: "Hàng rào gỗ dựng trên cao điểm dễ phòng thủ; lửa canh và hào khô ngăn cản các toán cướp."
  building_idjang_forts_02: "Idjang Tường Đá"
  building_idjang_forts_02_desc: "Các mặt tường then chốt được gia cố bằng đá vụn; lối đi có mái che giúp quân phòng thủ di chuyển an toàn."
  building_idjang_forts_03: "Idjang Bậc Thềm"
  building_idjang_forts_03_desc: "Lối tiếp cận bậc thang, cầu thang xuất kích và sàn bắn tạo ra những góc chết chết chóc cho cung tên và lao."
  building_idjang_forts_04: "Thành Trì Idjang"
  building_idjang_forts_04_desc: "Nhà cổng, nội thành và bể chứa nước; đồn trú có thể cầm cự qua nhiều mùa."
 
  building_type_wantilan_01: "Wantilan"
  building_type_wantilan_01_desc: "Những đại sảnh mở không tường, là nhà cộng đồng cho hội họp, nghi lễ và trình diễn."
  building_wantilan_01: "Wantilan Nhỏ"
  building_wantilan_01_desc: "Nhà hội làng tổ chức tập hợp, tuyên thệ và diễn tập; các bô lão hòa giải xung đột trước khi bùng phát."
  building_wantilan_02: "Đình Wantilan"
  building_wantilan_02_desc: "Một đại sảnh mái tầng rộng lớn phục vụ lễ hội và nghi thức trưởng thành, nơi nghi lễ chung nâng cao tinh thần và uy tín."
  building_wantilan_03: "Wantilan Đền Thờ"
  building_wantilan_03_desc: "Không gian nghi lễ gắn với thánh điện địa phương, đủ rộng cho lễ vật và đoàn rước."
  building_wantilan_04: "Wantilan Đại Quy Mô"
  building_wantilan_04_desc: "Một công trình biểu tượng, nơi trống, vũ công và các thủ lĩnh cùng hội tụ dưới một mái nhà."
 
  building_type_military_academy_01:0 "Học viện Quân sự"
  building_type_military_academy_01_desc:0 "Các cơ sở chuyên dụng để huấn luyện sĩ quan và kỵ sĩ, nâng cao hiệu quả chiến đấu."
  building_military_academy_01:0 "Trường Quân sự"
  building_military_academy_01_desc:0 "Các sĩ quan tương lai được tuyển chọn dựa trên năng lực quân sự. Dĩ nhiên, trường chỉ nhận học viên có xuất thân quý tộc."
  building_military_academy_02:0 "Học viện Sĩ quan"
  building_military_academy_02_desc:1 "Các sĩ quan cấp trung đến cao được đào tạo tại đây, nơi họ nắm vững điều động binh lực, chuẩn bị chiến trường và điều kiện tác chiến."
  building_military_academy_03:0 "Đại Học viện Quân sự"
  building_military_academy_03_desc:2 "Đại Học viện Quân sự là trái tim của một bộ máy quân sự tiên tiến. Sĩ quan tốt nghiệp tại đây am hiểu chiến lược, tổ chức quân đội và các tiến bộ công nghệ chiến tranh mới nhất."
 
  building_type_march_01:0 "Biên trấn"
  building_type_march_01_desc:0 "Các lãnh chúa biên trấn bảo vệ biên giới bằng công sự và đồn trú địa phương."
  marches_effect_desc: "Giảm khả năng xuất hiện các [raid_intents|E] đặc biệt"
  marches_effect_2_desc: "Chặn các [raid_intents|E] đặc biệt"
  building_march_01:0 "Biên trấn Chiến lược"
  building_march_01_desc:0 "Các biên trấn được xây dựng tại những vùng xa xôi và dễ bị tấn công nhất của công quốc, vừa phòng thủ vừa đóng vai trò hệ thống cảnh báo sớm."
  building_march_02:0 "Biên trấn Biên giới"
  building_march_02_desc:1 "Hệ thống lãnh chúa biên trấn được mở rộng dọc toàn bộ biên giới, tạo nên một tuyến phòng thủ vững chắc."
  building_march_03:0 "Đại Biên trấn"
  building_march_03_desc:0 "Những công sự biên trấn quy mô lớn được xây dựng khắp công quốc, làm suy yếu nghiêm trọng mọi lực lượng tấn công."
 
  building_type_siege_works_01:0 "Công xưởng Công thành"
  building_type_siege_works_01_desc:0 "Các công trình công thành chuyên dụng cho phép nhà cai trị triển khai và duy trì vũ khí vây hãm chất lượng cao."
  building_siege_works_01:0 "Xưởng Công thành"
  building_siege_works_01_desc:1 "Xưởng công thành cung cấp dòng vũ khí vây hãm ổn định và nhanh chóng nhờ quy trình xây dựng chuyên biệt và tiêu chuẩn hóa."
  building_siege_works_02:0 "Kỹ sư Máy Bắn Đá"
  building_siege_works_02_desc:1 "Các kỹ sư chuyên môn cao cần thiết để triển khai những vũ khí vây hãm tiên tiến nhất: máy bắn đối trọng."
  building_siege_works_03:0 "Xưởng Đúc Pháo"
  building_siege_works_03_desc:1 "Pháo là vũ khí mới nhất xuất hiện trên chiến trường. Ồn ào, nặng nề và khó cơ động, nhưng cực kỳ hiệu quả trước tường thành đá. Có khả năng sản xuất và triển khai pháo mang lại lợi thế không thể chối cãi trước kẻ thù."
 
  building_type_royal_armory_01:0 "Kho Vũ khí Hoàng gia"
  building_type_royal_armory_01_desc:2 "Các kho vũ khí do vương quyền tài trợ đảm bảo nguồn cung và bảo trì vũ khí ổn định cho quân đội."
  building_royal_armory_01:0 "Kho Vũ khí"
  building_royal_armory_01_desc:1 "Trong thời chiến, quân dịch nông dân có thể được trang bị vũ khí từ kho. Phần lớn là rìu gỉ, giáo sứt và lưỡi kiếm cùn, nhưng chỉ cần bảo dưỡng nhẹ cũng hiệu quả hơn nhiều so với nông cụ."
  building_royal_armory_02:0 "Kho Vũ khí Hoàng triều"
  building_royal_armory_02_desc:1 "Các kho do triều đình quản lý thu gom và bảo trì vũ khí, áo giáp phục vụ chiến tranh. Chất lượng khá tốt, đủ để biến một kẻ bê tha thành lính tráng ra hồn."
  building_royal_armory_03:0 "Xưởng Quân khí Hoàng gia"
  building_royal_armory_03_desc:1 "Xưởng Quân khí Hoàng gia lưu trữ và bảo dưỡng lượng vũ khí khổng lồ, đủ để huy động vô số quân dịch trong thời gian ngắn và thu hút lính đánh thuê giỏi nhất."
 
  building_type_jousting_lists_01:0 "Bãi đấu thương"
  building_type_jousting_lists_01_desc:0 "Việc có những bãi đấu thương chuyên dụng khuyến khích nhiều kỵ sĩ và hiệp sĩ hơn luyện tập và gia nhập quân kỳ."
  building_jousting_lists_01:0 "Bãi luyện đấu thương"
  building_jousting_lists_01_desc:0 "Một khoảng đất trống được giữ mở quanh năm để phục vụ việc huấn luyện kỵ sĩ và hiệp sĩ."
  building_jousting_lists_02:0 "Trường đấu giải"
  building_jousting_lists_02_desc:0 "Với danh sách đấu thương và khán đài cho công chúng, trường đấu này thu hút một lượng lớn đấu thủ."
  building_jousting_lists_03:0 "Đấu trường Hoàng gia"
  building_jousting_lists_03_desc:0 "Được nâng cấp với chỗ ngồi cho khách hoàng gia và khu hội chợ rộng lớn hơn, đấu trường này thực sự tráng lệ."
 
  building_type_blacksmiths_01:1 "Xưởng rèn Hoàng gia"
  building_type_blacksmiths_01_desc:0 "Các thợ rèn phục vụ cho vương quyền rèn vũ khí và áo giáp cho cận vệ hoàng gia, bảo đảm nguồn cung ổn định các trang bị vượt trội."
  building_blacksmiths_01:1 "Thợ rèn Hoàng gia"
  building_blacksmiths_01_desc:1 "Những thợ rèn giỏi và năng suất nhất được triều đình thuê để sản xuất kiếm, áo giáp xích và giáo cho cận vệ hoàng gia."
  building_blacksmiths_02:0 "Nghiệp đoàn thợ rèn"
  building_blacksmiths_02_desc:0 "Thông qua hợp tác với các nghiệp đoàn, lượng lớn trang bị có thể được sản xuất theo đơn với chi phí thấp."
  building_blacksmiths_03:0 "Lò rèn Hoàng gia"
  building_blacksmiths_03_desc:0 "Những lò rèn lớn được xây dựng với mục đích duy nhất là cung cấp vũ khí cho triều đình; chỉ những thợ rèn giỏi nhất mới được làm việc tại đây."
 
  building_type_archery_ranges_01:0 "Bãi bắn cung"
  building_type_archery_ranges_01_desc:0 "Các trường bắn cung chuyên dụng cho phép dân thường luyện tập cung tên, còn cung thủ lão luyện thì mài giũa kỹ năng."
  building_archery_ranges_01:0 "Trường bắn cung"
  building_archery_ranges_01_desc:0 "Mọi người đều được chào đón tại trường bắn cung, bất kể giàu hay nghèo. Lý do có hai: nông dân biết bắn cung hữu ích hơn trong chiến tranh, và các xạ thủ dày dạn giữ được phong độ nhờ thi đấu."
  building_archery_ranges_02:0 "Thợ làm cung Hoàng gia"
  building_archery_ranges_02_desc:1 "Những thợ làm cung giỏi nhất được triều đình tuyển dụng để chế tác các cây cung chất lượng cao nhất trong những cơ sở chuyên biệt."
  building_archery_ranges_03:0 "Trường xạ thủ"
  building_archery_ranges_03_desc:0 "Để khích lệ nông dân và tạo thử thách xứng đáng cho các xạ thủ, những trường bắn đặc biệt này được thiết kế để huấn luyện bắn tầm xa."
 
  building_type_tax_assessor_01:0 "Văn phòng thuế"
  building_type_tax_assessor_01_desc:0 "Thu tiền thuế từ nông dân quả là một việc ‘nặng thuế’. Bằng cách lập văn phòng cho đội ngũ quan thu thuế, chúng ta chắc chắn sẽ thu đủ phần phải có!"
  building_tax_assessor_01:0 "Quan thu thuế"
  building_tax_assessor_01_desc:0 "Nghĩa vụ của mọi nông dân là nộp cho triều đình một phần thuế tương xứng bằng tiền hoặc sản vật. Các quan thu thuế của chúng ta bảo đảm rằng mức ‘tương xứng’ ấy phù hợp với nhu cầu của triều đình, và may mắn thay cho ta, đa số nông dân đều mù chữ."
  building_tax_assessor_02:0 "Văn phòng chấp hành"
  building_tax_assessor_02_desc:0 "Một cách tuyệt vời để bảo đảm nông dân nộp thuế là đe dọa tống họ vào ngục nếu không tuân theo. Đó là nhiệm vụ của viên chấp hành, luôn đứng về phía #emphasis chúng ta#!."
  building_tax_assessor_03:0 "Tòa án pháp quan"
  building_tax_assessor_03_desc:0 "Nông dân có thể dễ ép thu thuế, nhưng các địa chủ giàu có thì khó hơn. Bằng cách thiết lập một mạng lưới hành chính phức tạp do các pháp quan trung thành điều hành, chúng ta có thể bảo đảm ngay cả những thần dân giàu nhất cũng nộp đủ nghĩa vụ."
 
  building_type_leisure_palace_01:0 "Cung điện nghỉ dưỡng"
  building_type_leisure_palace_01_desc:0 "Ở trong một lâu đài xa hoa thì cũng tốt, nhưng có thêm vài nơi để lựa chọn thì chẳng bao giờ thừa."
  building_leisure_palace_01:0 "Lâu đài đồng quê"
  building_leisure_palace_01_desc:0 "Khi gánh nặng trách nhiệm trở nên quá sức (hoặc khi đám đông nông dân phẫn nộ đang tràn cổng), không nơi nào bằng lâu đài đồng quê xa xôi để nghỉ ngơi tức thời!"
  building_leisure_palace_02:0 "Cung điện mùa hè"
  building_leisure_palace_02_desc:0 "Cung điện mùa hè nằm ở một vùng phong cảnh đẹp trong công quốc, tách xa cuộc sống tầm thường của thần dân lam lũ. Không có cách nào tốt hơn để phô bày quyền lực và uy thế hoàng gia, cùng thực tế đơn giản rằng chúng ta #emphasis cao quý hơn#! tất cả mọi người."
  building_leisure_palace_03:0 "Cung điện mùa đông"
  building_leisure_palace_03_desc:0 "Cung điện mùa đông được thiết kế để hoàng gia cư trú trong những tháng khắc nghiệt. Với kho lương thực đầy đủ và vị trí dễ phòng thủ, nó sừng sững trên đầu những thần dân run rẩy có vinh dự làm việc gần đó."
 
  building_type_royal_forest_01:0 "Khu bảo tồn Hoàng gia"
  building_type_royal_forest_01_desc:0 "Rừng hoàng gia là nguồn lợi to lớn, cho phép Ngài vượt quyền luật địa phương, tước bỏ quyền lợi của dân bản xứ rồi bán lại cho họ. Chưa kể săn bắn ở đây cũng tuyệt vời."
  building_royal_forest_01:0 "Rừng Hoàng gia"
  building_royal_forest_01_desc:0 "Những khu rừng rộng lớn trong công quốc này được dành riêng cho hoàng gia. Nông dân bị cấm sinh sống trong rừng, săn bắn hay khai phá cây cối để canh tác. Đặc biệt cấm tấn công các quan thu thuế của triều đình khi họ đi ngang."
  building_royal_forest_02:0 "Rừng Hoàng gia rộng lớn"
  building_royal_forest_02_desc:0 "Toàn bộ thị trấn giờ đây bị sáp nhập vào rừng hoàng gia, và các khu định cư lân cận thường phát hiện rằng người của quốc vương đã ‘tìm ra’ bản đồ đặt nhà họ vững chắc trong đất rừng triều đình."
  building_royal_forest_03:0 "Tòa án Rừng Hoàng gia"
  building_royal_forest_03_desc:0 "Luật pháp chỉ hiệu quả khi có hệ thống thực thi phía sau, và giờ đây khu rừng này có cả một hệ thống tòa án, kiểm lâm và thư lại, được hậu thuẫn bởi các pháp quan được huấn luyện để thi hành mệnh lệnh của triều đình."
 
  building_type_royal_garden_01:0 "Vườn Hoàng gia"
  building_type_royal_garden_01_desc:0 "Ít nơi nào giúp con người thư giãn và giao lưu tốt như một khu vườn đẹp. Với giới giàu có và quyền lực, chỉ những công trình ngoạn mục nhất mới là đủ."
  building_royal_garden_01:0 "Vườn khép kín"
  building_royal_garden_01_desc:0 "Một khu vườn nhỏ được bao bọc bởi tường đá, tạo ra chốn bình yên và tiện nghi tách biệt khỏi thế giới ồn ào bên ngoài."
  building_royal_garden_02:0 "Quần thể vườn"
  building_royal_garden_02_desc:0 "Một khu vườn rộng lớn và ấn tượng với hoa, thảo mộc, cây ăn quả và đủ thứ khác. Được duy trì bởi nhiều người làm vườn, nơi này luôn được chăm sóc liên tục."
  building_royal_garden_03:0 "Công viên Hoàng gia"
  building_royal_garden_03_desc:0 "Công viên hoàng gia là một cảnh quan rộng lớn, tráng lệ, được kiến tạo hài hòa với địa hình và kiến trúc xung quanh. Mở cửa cho mọi người, nó khiến du khách khắp nơi phải kinh ngạc."
 
  building_type_ananda_temple_01:0 "Đền Ananda"
  building_type_ananda_temple_01_desc:0 "Dù Pagan có hàng nghìn tháp, đền và miếu rải khắp thành phố và đồng bằng xung quanh, Đền Ananda vẫn là đỉnh cao vượt trội. Công trình cân đối hoàn hảo này chứa nhiều phù điêu và tượng đá độc đáo. Đây vừa là nơi thờ tự vừa là trung tâm học tập để giáo dục người dân về giáo lý tôn giáo."
  building_ananda_temple_01:0 "$building_type_ananda_temple_01$"
  building_ananda_temple_01_desc:0 "$building_type_ananda_temple_01_desc$"
 
  building_type_hotin_fort_01:0 "Công sự Hotin"
  building_type_hotin_fort_01_desc:0 "Pháo đài Hotin là một công sự nhỏ nằm bên bờ sông Dniester. Vị trí này cho phép nó bảo vệ các tuyến thương mại địa phương và trao cho chủ sở hữu quyền kiểm soát dòng sông."
  building_hotin_fort_01:0 "Pháo đài Hotin"
  building_hotin_fort_01_desc:0 "$building_type_hotin_fort_01_desc$"
  building_hotin_fort_02:0 "Thành lũy Hotin"
  building_hotin_fort_02_desc:0 "Một thành lũy đồ sộ khiến công sự cũ trở nên nhỏ bé. Các tuyến phòng thủ đã được mở rộng qua nhiều thế kỷ với tường đá cao, hào rộng và nhiều tháp lớn. Công trình này có thể dễ dàng cầm chân hầu hết các đạo quân vây hãm."
 
  building_type_golden_gate_of_kiev_01:1 "Cổng Vàng Kyiv"
  building_type_golden_gate_of_kiev_01_desc:1 "Được mô phỏng và đặt tên theo một cổng ở Constantinople, Cổng Vàng Kyiv vừa là lối vào thành phố vừa là khải hoàn môn. Mái vòm vàng của nhà thờ xây trên cổng có thể nhìn thấy từ xa và trở thành biểu tượng nổi bật của Kyiv."
  building_golden_gate_of_kiev_01:0 "$building_type_golden_gate_of_kiev_01$"
  building_golden_gate_of_kiev_01_desc:0 "$building_type_golden_gate_of_kiev_01_desc$"
 
  building_type_heddal_stave_church_01:0 "Nhà thờ gỗ Heddal"
  building_type_heddal_stave_church_01_desc:0 "Nhà thờ gỗ Heddal là nhà thờ stave lớn nhất Na Uy với nội thất gỗ tuyệt đẹp. Truyền thuyết kể rằng nhà thờ được một người khổng lồ núi xây dựng chỉ trong ba ngày."
  building_heddal_stave_church_01:0 "$building_type_heddal_stave_church_01$"
  building_heddal_stave_church_01_desc:0 "$building_type_heddal_stave_church_01_desc$"
 
  building_type_temple_of_uppsala_01:0 "Đền Uppsala"
  building_type_temple_of_uppsala_01_desc:0 "Ngôi đền tại Uppsala là trung tâm tôn giáo của phần lớn Scandinavia. Một cây thiêng đứng gần đền, bên cạnh một giếng nước, tương tự cây Yggdrasil huyền thoại."
  building_temple_of_uppsala_01:0 "$building_type_temple_of_uppsala_01$"
  building_temple_of_uppsala_01_desc:0 "$building_type_temple_of_uppsala_01_desc$"
  building_temple_of_uppsala_02:0 "Nhà thờ chính tòa Uppsala"
  building_temple_of_uppsala_02_desc:0 "Một nhà thờ cao lớn được xây dựng để sánh ngang các công trình tráng lệ nhất Nam Âu, Nhà thờ chính tòa Uppsala là nơi an táng của nhiều quân vương nổi bật của Thụy Điển và lưu giữ nhiều thánh tích."
 
  building_type_lund_cathedral_01:0 "Nhà thờ chính tòa Lund"
  building_type_lund_cathedral_01_desc:0 "Nhà thờ chính tòa Lund là một công trình nguy nga, được trang trí phong phú bằng các tác phẩm điêu khắc đá. Xây dựng chịu ảnh hưởng kiến trúc Romanesque, nhà thờ có nhiều nét tương đồng với các nhà thờ ở Đức. Công trình được hiến dâng cho Thánh Lawrence, vị thánh bảo trợ của Lund."
  building_lund_cathedral_01:0 "$building_type_lund_cathedral_01$"
  building_lund_cathedral_01_desc:0 "$building_type_lund_cathedral_01_desc$"
 
  building_type_danevirke_01:0 "Danevirke"
  building_type_danevirke_01_desc:1 "Danevirke là một hệ thống công sự đất rộng lớn được xây dựng nhằm ngăn chặn các cuộc xâm nhập từ lục địa vào lãnh thổ Đan Mạch và đã nhiều lần được mở rộng kể từ khi khởi công ban đầu."
  building_danevirke_01:0 "$building_type_danevirke_01$"
  building_danevirke_01_desc:0 "$building_type_danevirke_01_desc$"

  building_type_aljaferia_palace_01:0 "Aljafería"
  building_type_aljaferia_palace_01_desc:0 "Một cung điện–pháo đài vĩ đại được xây trên đồng bằng Saría, Aljafería là minh chứng cho quyền lực và sự giàu có của Zaragoza. Vừa uy nghi vừa lộng lẫy; nơi đây đồng thời là một công sự đáng sợ và đỉnh cao của kiến trúc Iberia."
  building_aljaferia_palace_01:0 "$building_type_aljaferia_palace_01$"
  building_aljaferia_palace_01_desc:0 "$building_type_aljaferia_palace_01_desc$"

  building_type_roman_wall_of_lugo_01:0 "Tường thành La Mã Lugo"
  building_type_roman_wall_of_lugo_01_desc:0 "Được người La Mã xây dựng từ rất lâu trước đây, những bức Tường thành Lugo đồ sộ vẫn là một cảnh tượng ấn tượng. Các đoàn hành hương đi qua năm cổng thành trên con đường tới Santiago de Compostela, khiến chuyến hành trình trở nên càng thêm thiêng liêng."
  building_roman_wall_of_lugo_01:0 "$building_type_roman_wall_of_lugo_01$"
  building_roman_wall_of_lugo_01_desc:0 "$building_type_roman_wall_of_lugo_01_desc$"

  building_type_rock_of_gibraltar_01:0 "Mỏm đá Gibraltar"
  building_type_rock_of_gibraltar_01_desc:0 "Khối đá nguyên khối Gibraltar nhìn xuống eo biển hẹp – cánh cổng dẫn vào Địa Trung Hải. Trong thời cổ đại, nó là một trong những Trụ cột của Hercules, được cho là đánh dấu ranh giới của thế giới đã biết. Ngắm nhìn nó hôm nay, Ngài khó có thể không tự hỏi điều gì nằm ở phía bên kia."
  building_rock_of_gibraltar_01:0 "$building_type_rock_of_gibraltar_01$"
  building_rock_of_gibraltar_01_desc:0 "$building_type_rock_of_gibraltar_01_desc$"

  building_type_tower_of_hercules_01:0 "Farum Brigantium"
  building_type_tower_of_hercules_01_desc:0 "Ngọn hải đăng cổ đại này được cho là lấy cảm hứng từ người chị em nổi tiếng hơn ở Alexandria. Đã dẫn lối cho thủy thủ suốt vô số thế kỷ, nó vẫn giữ vai trò quan trọng đối với thương mại ven biển Galicia. Có người khẳng định có thể thấy bờ biển xanh của Ireland từ đỉnh tháp cô độc này, nhưng khi phóng tầm mắt ra xa, chỉ còn lại biển cả vô tận."
  building_tower_of_hercules_01:0 "$building_type_tower_of_hercules_01$"
  building_tower_of_hercules_01_desc:0 "$building_type_tower_of_hercules_01_desc$"

  building_type_city_wall_of_toledo_01:0 "Tường thành Toledo"
  building_type_city_wall_of_toledo_01_desc:0 "Ban đầu được người La Mã xây dựng từ thời xa xưa, những bức tường đồ sộ này đã được mở rộng đáng kể dưới triều vua Wamba của người Visigoth. Các nhà cai trị Ả Rập thời kỳ đầu còn tiếp tục nới rộng chúng, tạo nên một hệ thống phòng thủ xứng đáng với Thành phố của các Quốc vương."
  building_city_wall_of_toledo_01:0 "$building_type_city_wall_of_toledo_01$"
  building_city_wall_of_toledo_01_desc:0 "$building_type_city_wall_of_toledo_01_desc$"

  building_type_alcazar_of_segovia_01:0 "Alcázar Segovia"
  building_type_alcazar_of_segovia_01_desc:0 "Vươn lên như mũi thuyền từ mỏm đá cheo leo, pháo đài này là một cảnh tượng khiến người ta phải kinh ngạc. Vừa uy nghi vừa bất khả xâm phạm, đây là lâu đài vĩ đại nhất trong vương quốc của những lâu đài — Castile."
  building_alcazar_of_segovia_01:0 "$building_type_alcazar_of_segovia_01$"
  building_alcazar_of_segovia_01_desc:0 "$building_type_alcazar_of_segovia_01_desc$"

  building_type_holy_site_basilica_santiago_01:0 "Nhà thờ chính tòa Santiago de Compostela"
  building_type_holy_site_basilica_santiago_01_desc:0 "Được xây dựng trên ngôi mộ của Thánh Giacôbê Cả, công trình lộng lẫy này là điểm kết thúc của Con đường Thánh Giacôbê và là vương miện của một trong những thánh địa lớn của Kitô giáo. Các đoàn hành hương từ khắp Tây và Bắc Âu đổ về đông đảo, nói hàng chục thứ tiếng — dù nhiều người trở nên câm lặng trước sự tráng lệ."
  building_holy_site_basilica_santiago_01:0 "$building_type_holy_site_basilica_santiago_01$"
  building_holy_site_basilica_santiago_01_desc:0 "$building_type_holy_site_basilica_santiago_01_desc$"

  building_type_charnel_grounds_01: "Bãi phơi xác"
  building_type_charnel_grounds_01_desc: "Vừa là nơi thanh tẩy tinh thần, vừa là chốn an nghỉ cho người chết, những bãi ngoài trời này cho phép thi thể phân hủy tự nhiên."

  building_charnel_grounds_01: "Kho chứa thi thể"
  building_charnel_grounds_01_desc: "Bị mặt trời tẩy trắng và chim săn mồi rỉa xác, các thi thể phân hủy trên đỉnh đồi."

  building_charnel_grounds_02: "Cánh đồng thoát xác"
  building_charnel_grounds_02_desc: "Vừa là địa điểm tôn giáo, vừa là nghĩa địa, những thi thể đang phân rữa được giữ cách xa người sống."

  building_charnel_grounds_03: "Vách đá nghi lễ"
  building_charnel_grounds_03_desc: "Thi thể rải khắp cảnh quan, các túi hương chỉ phần nào che lấp mùi hôi dọc theo lối đi nơi người sống chuẩn bị những lễ vật mới cho các nguyên tố tự nhiên."
 
  building_type_imam_reza_shrine_01: "Thánh địa Imam Reza"
  building_type_imam_reza_shrine_01_desc: "Thánh địa này lưu giữ hài cốt của Ali ar-Rida, được một số tín đồ Shi'a tôn vinh là vị imam thứ tám, người đã tử vì đạo trên mảnh đất này. Quần thể không ngừng mở rộng bao gồm lăng mộ, phòng cầu nguyện, thư viện và khu chợ, phát triển theo cách đa dạng nhưng huy hoàng cùng dòng chảy hành hương và đoàn lữ hành."
  building_imam_reza_shrine_01: "$building_type_imam_reza_shrine_01$"
  building_imam_reza_shrine_01_desc: "$building_type_imam_reza_shrine_01_desc$"

  building_type_soltaniyeh_01: "Mái vòm Soltaniyeh"
  building_type_soltaniyeh_01_desc: "Vừa là đền thờ vừa là lăng mộ, quy mô đồ sộ và sự đối xứng tinh xảo của công trình này chắc chắn sẽ truyền cảm hứng cho nhiều kiệt tác trong tương lai. Mái vòm hai lớp khổng lồ được phủ gạch lam ngọc, lớn đến mức dường như thách thức cả bầu trời."
  building_soltaniyeh_01: "$building_type_soltaniyeh_01$"
  building_soltaniyeh_01_desc: "$building_type_soltaniyeh_01_desc$"

  building_type_palace_of_ctesiphon_01: "Tàn tích Cung điện Ctesiphon"
  building_type_palace_of_ctesiphon_01_desc: "Công trình cổ xưa này từng là ngai lễ nghi của các Đại vương Sasanian, nhưng sự tĩnh lặng đã bao trùm những đại sảnh từng huy hoàng, và hoa trong vườn không còn nở. Nhiều vật liệu đã bị lấy đi để xây dựng Baghdad, dân cư thì tản mác bốn phương. Dẫu vậy, một vẻ huy hoàng rờn rợn vẫn còn, vinh quang lưu luyến của thời xưa."
  building_palace_of_ctesiphon_01: "$building_type_palace_of_ctesiphon_01$"
  building_palace_of_ctesiphon_01_desc: "$building_type_palace_of_ctesiphon_01_desc$"

  building_type_palace_of_ctesiphon_02: "Đại cung điện Ctesiphon"
  building_type_palace_of_ctesiphon_02_desc: "Nay đã được tái thiết, ngai vàng của các vị vua cổ đại được khôi phục trọn vẹn huy hoàng. Vườn tược lại nở rộ, đại sảnh tràn ngập âm nhạc và ánh lệ. Du khách từ khắp nơi đổ về chiêm ngưỡng mái vòm khổng lồ của đại sảnh ngai mở — một kỳ quan bị lãng quên của thế giới cổ đại, nay cuối cùng đã tìm lại vị trí trong những khúc ca."
  building_palace_of_ctesiphon_02: "$building_type_palace_of_ctesiphon_02$"
  building_palace_of_ctesiphon_02_desc: "$building_type_palace_of_ctesiphon_02_desc$"

  building_type_falak_ol_aflak_citadel_01: "Falak-ol-Aflak"
  building_type_falak_ol_aflak_citadel_01_desc: "Nằm vững trên đỉnh đồi phía trên thị trấn Khorramabad, pháo đài gạch bùn Sasanian này vẫn là một cảnh tượng ấn tượng. Cư dân thung lũng gọi nó là #italic Falak-ol-Aflak#!, “Thiên đường của các tầng trời”, bởi trong mắt họ, nó như nằm trên đỉnh thế giới, và bên trong những bức tường kiên cố ấy, họ thường tìm được nơi trú ẩn."
  building_falak_ol_aflak_citadel_01: "$building_type_falak_ol_aflak_citadel_01$"
  building_falak_ol_aflak_citadel_01_desc: "$building_type_falak_ol_aflak_citadel_01_desc$"

  building_type_minarets_and_remains_of_jam_01: "Tháp Jam"
  building_type_minarets_and_remains_of_jam_01_desc: "Công trình này vươn cao trên thung lũng sông Hari, phủ đầy vữa chạm khắc, gạch men và những dải thư pháp xen kẽ — một tượng đài tinh mỹ cho thấy đức tin và của cải có thể đạt tới điều gì, ngay cả ở vùng đất xa xôi, hiểm trở này."
  building_minarets_and_remains_of_jam_01: "$building_type_minarets_and_remains_of_jam_01$"
  building_minarets_and_remains_of_jam_01_desc: "$building_type_minarets_and_remains_of_jam_01_desc$"

  building_type_great_wall_of_gorgan_01: "Vạn Lý Trường Thành Gorgan"
  building_type_great_wall_of_gorgan_01_desc: "Một hệ thống công sự khổng lồ do các vị vua cổ đại xây dựng để làm lá chắn chống lại người Hung Hephthalite, Vạn Lý Trường Thành Gorgan bao phủ bởi huyền thoại. Người ta nói rằng chính Alexander Đại đế đã từng đi qua các cổng của nó trong cuộc chinh phạt phương Đông."
  building_great_wall_of_gorgan_01: "$building_type_great_wall_of_gorgan_01$"
  building_great_wall_of_gorgan_01_desc: "$building_type_great_wall_of_gorgan_01_desc$"

  building_type_maharloo_lake_01: "Hồ Maharloo"
  building_type_maharloo_lake_01_desc: "Dù là hồ theo mùa đôi khi chỉ còn lại đồng muối khô cạn, vào giữa mùa hè, mặt nước lại mang sắc đỏ nhạt tuyệt mỹ. Các thi sĩ trẻ tụ họp bên bờ, ngắm nhìn làn nước kỳ lạ và suy ngẫm về vẻ đẹp cùng những bí ẩn của trái đất."
  building_maharloo_lake_01: "$building_type_maharloo_lake_01$"
  building_maharloo_lake_01_desc: "$building_type_maharloo_lake_01_desc$"

  building_type_tomb_of_cyrus_01: "Lăng mộ Batsheba"
  building_type_tomb_of_cyrus_01_desc: "Ngôi mộ đá vôi trắng cổ xưa này được cho là nơi an nghỉ của Batsheba, mẹ của vua Solomon, được nhiều tôn giáo tôn kính. Phụ nữ chăm nom địa điểm này, và chỉ phụ nữ mới được phép bước vào nội thất tối tăm của lăng mộ. Họ hiếm khi nói về những gì đã thấy bên trong. Nước ở gần đó được cho là linh thiêng, có thể chữa lành cho những người bị chó dại cắn."
  building_tomb_of_cyrus_01: "$building_type_tomb_of_cyrus_01$"
  building_tomb_of_cyrus_01_desc: "$building_type_tomb_of_cyrus_01_desc$"

  building_type_rainbow_mountains_01: "Núi Cầu Vồng"
  building_type_rainbow_mountains_01_desc: "Dường như chính Đấng Tạo Hóa đã tô vẽ những dãy núi này bằng muôn sắc cầu vồng. Những dải đỏ, trắng, vàng, xám, cam và các màu kỳ lạ khác nhuộm lên cảnh quan đá núi tĩnh lặng. Các lãnh chúa địa phương thường đưa khách quý tới đây săn bắn, để chiêm ngưỡng kỳ quan siêu phàm này."
  building_rainbow_mountains_01: "$building_type_rainbow_mountains_01$"
  building_rainbow_mountains_01_desc: "$building_type_rainbow_mountains_01_desc$"

  building_type_mount_damavand_01: "Núi Damavand"
  building_type_mount_damavand_01_desc: "Một đỉnh núi vĩ đại phủ tuyết, thấm đẫm truyền thuyết cổ xưa. Núi Damavand được cho là nhà tù giam giữ bạo chúa quái vật Zahhāk, kẻ sẽ bị giam cầm tại đây cho đến ngày tận thế. Nhiều anh hùng thời cổ đã lập nên những chiến công hiển hách trên ngọn núi này, và với những người đặt chân tới đây ngày nay, sự hiện diện hùng vĩ của nó dường như chạm tới tận linh hồn họ. Là một ngọn núi lửa đang ngủ yên, sườn núi rải rác những suối nước nóng nơi các lữ khách mệt mỏi có thể dừng chân nghỉ ngơi, suy ngẫm về chiến tích của người xưa."
  building_mount_damavand_01: "$building_type_mount_damavand_01$"
  building_mount_damavand_01_desc: "$building_type_mount_damavand_01_desc$"

  building_type_holy_site_fire_temple_01: "Đại Hỏa Tự"
  building_type_holy_site_fire_temple_01_desc: "Bên trong công trình nguy nga này cháy rực một #italic Atash Behram#!, Ngọn Lửa Chiến Thắng — vĩ đại và tinh khiết nhất trong mọi ngọn lửa, được gom từ sét trời, nến hoàng gia, giàn hỏa táng, lò rèn kim hoàn và bếp lửa của các ẩn sĩ. Người hành hương từ những vùng đất xa xôi kéo đến để chiêm ngưỡng kỳ quan này, trong khi các pháp sư thực hiện những nghi lễ thanh tẩy dường như bất tận."
  building_holy_site_fire_temple_01: "Đại Hỏa Tự"
  building_holy_site_fire_temple_01_desc:1 "$building_type_holy_site_fire_temple_01_desc$"

  building_type_ark_of_bukhara_01: "Pháo đài Ark của Bukhara"
  building_type_ark_of_bukhara_01_desc: "Người ta kể rằng hoàng tử Siyavusha đã xây dựng pháo đài đồ sộ này khi thế giới còn non trẻ. Ba nghìn năm sau, nó được trùng tu bởi các Khuda của Bukhara, những vị thống trị cổ xưa của vùng đất này, và từ đó luôn được sử dụng liên tục. Du khách từ gần xa đổ về chiêm ngưỡng công trình, với bảy cột trụ lớn phản chiếu bảy ngôi sao của chòm Bắc Đẩu, nhưng trên hết, đây trước tiên vẫn là một công sự — lộng lẫy nhưng đầy uy hiếp."
  building_ark_of_bukhara_01: "$building_type_ark_of_bukhara_01$"
  building_ark_of_bukhara_01_desc: "$building_type_ark_of_bukhara_01_desc$"

  building_type_shah_i_zinda_01: "Shah-i-Zinda"
  building_type_shah_i_zinda_01_desc: "Tên của quần thể lăng mộ này có nghĩa là #italic Vị Vua Sống#!, ám chỉ Quham ibn Abbas, anh em họ của Muhammad, được cho là an táng tại đây. Các lăng mộ khá nhỏ và khiêm nhường, nhưng mang vẻ đẹp trang nghiêm khiến nhiều người nán lại giữa những ngôi mộ tĩnh lặng để suy ngẫm về sự vô thường của kiếp người."
  building_shah_i_zinda_01: "$building_type_shah_i_zinda_01$"
  building_shah_i_zinda_01_desc: "$building_type_shah_i_zinda_01_desc$"
  building_shah_i_zinda_02: "Nghĩa địa Shah-i-Zinda"
  building_shah_i_zinda_02_desc: "Một nghĩa địa rộng lớn với các lăng mộ, cổng cao và hành lang mái vòm phủ gạch men xanh ngọc. #italic Vị Vua Sống#! là nơi an táng người anh em họ của Nhà Tiên Tri cùng nhiều lãnh chúa vĩ đại thời cổ. Quần thể này không ngừng mở rộng, vừa siêu thực vừa tráng lệ, vừa rờn rợn vừa uy nghi."

  building_type_alamut_castle_01: "Lâu đài Alamut"
  building_type_alamut_castle_01_desc: "Tổ đại bàng này, chễm chệ trên một mỏm đá cao, được triều đại Justanid xây dựng làm thành lũy phòng thủ cho vương quốc đang lâm nguy của họ. Với vị thế choáng ngợp và tường thành kiên cố, theo mọi lẽ thường, nó gần như bất khả xâm phạm, và có thể trở thành căn cứ lý tưởng cho bất kỳ thế lực hay giáo phái hiếu chiến nào đủ sức tồn tại tại nơi biệt lập này."
  building_alamut_castle_01: "$building_type_alamut_castle_01$"
  building_alamut_castle_01_desc: "$building_type_alamut_castle_01_desc$"
  building_type_alamut_castle_02: "Pháo đài Alamut"
  building_type_alamut_castle_02_desc: "Nằm trên một mỏm đá cao, lâu đài này từ lâu đã là thành lũy miền núi hẻo lánh. Nay nó được tái thiết thành một pháo đài #italic fedayeen#! đáng gờm, với thư viện, phòng thí nghiệm và những khu vườn yên tĩnh nằm giữa các công sự đồ sộ. Với người này, đây là nơi của máu và chiến tranh; với kẻ khác, là chốn tĩnh tu tinh thần — hoặc có lẽ là cả hai."
  building_alamut_castle_02: "$building_type_alamut_castle_02$"
  building_alamut_castle_02_desc: "$building_type_alamut_castle_02_desc$"
  building_type_assassin_castle_01: "$holy_order_hashshashin$ $building_castle_04$"
  building_type_assassin_castle_01_desc: "$building_type_alamut_castle_02_desc$"
  building_assassin_castle_01: "$building_type_assassin_castle_01$"
  building_assassin_castle_01_desc: "$building_type_assassin_castle_01_desc$"
 
  building_type_qanats_01: "$building_qanats_06$"
  building_type_qanats_01_desc: "$building_qanats_05_desc$"
  building_qanats_01: "Yakchāl"
  building_qanats_01_desc: "Những nhà băng hình mái vòm này kết hợp khu lưu trữ ngầm với vật liệu xây dựng chịu nhiệt để tạo ra một không gian cách nhiệt, hoạt động như một hệ thống làm mát bay hơi."
  building_qanats_02: "Bể chứa nước"
  building_qanats_02_desc: "Được gọi là #italic Ab anbar#! trong tiếng Ba Tư, những công trình mái vòm này, nửa chìm dưới lòng đất, dùng để trữ lượng lớn nước."
  building_qanats_03: "Tháp bắt gió"
  building_qanats_03_desc: "Một phát minh của Ba Tư, những tòa tháp cao này được nối với bể chứa và các công trình khác. Thông qua các khe mở hướng về chiều gió chủ đạo, chúng bắt luồng không khí rồi lưu chuyển bên trong để làm mát."
  building_qanats_04: "Kārīz"
  building_qanats_04_desc: "Giai đoạn đầu của hệ thống dẫn nước ngầm, kārīz là chuỗi các giếng đứng nối với nhau bằng một đường hầm thoai thoải, khai thác nguồn nước ngầm và dẫn nó lên mặt đất."
  building_qanats_05: "Qanat Nhỏ"
  building_qanats_05_desc: "Qanat là các kênh dẫn nước ngầm nhằm giảm thất thoát nước do bay hơi. Dù còn khá nhỏ ở giai đoạn này, hệ thống vẫn mang lại lợi ích đáng kể cho nông nghiệp."
  building_qanats_06: "Qanat"
  building_qanats_06_desc: "Các kênh dẫn nước ngầm đã được mở rộng, kết nối với bể chứa, nhà băng và hệ thống tưới tiêu địa phương."
  building_qanats_07: "Qanat Lớn"
  building_qanats_07_desc: "Hệ thống kênh dẫn nước ngầm quy mô lớn này kéo dài hàng #italic parasang#!, cung cấp nguồn nước dồi dào cho cả nông dân lẫn cư dân đô thị."
  building_qanats_08: "Hệ thống Qanat Khổng lồ"
  building_qanats_08_desc: "Chảy vào vô số bể chứa ngầm, kênh tưới, nhà băng, nhà tắm, đài phun và giếng nước uống, hệ thống dẫn nước dưới lòng đất đồ sộ này là minh chứng hùng hồn cho sự khéo léo và vinh quang của Ba Tư."

  building_type_tower_of_silence_01: "Đại Tháp Tĩnh Mặc"
  building_type_tower_of_silence_01_desc: "Đức tin của chúng ta dạy rằng thi thể của các tín đồ chính trực phải được phó mặc cho muông thú và bầu trời rộng mở. Nhờ đó linh hồn được giữ thanh khiết, còn cộng đồng tránh khỏi sự ô uế của xác thịt phân hủy.\n\nKhi người ngoài không cho phép chúng ta thực hành nghi lễ, chúng ta buộc phải xây dựng những ngọn tháp này để bảo vệ hài cốt phàm trần và biểu trưng cho niềm tin trường tồn."
  building_tower_of_silence_01: "Đại Tháp Tĩnh Mặc"
  building_tower_of_silence_01_desc: "Được xây dựng ở một góc yên tĩnh của công quốc, ngọn tháp bằng phẳng, không mái này là nơi người dân đặt người chết an nghỉ. Thi thể bên trong bị phơi bày trước chim ăn xác và cái nắng khắc nghiệt, đưa linh hồn người đã khuất an toàn sang thế giới bên kia và giữ cho người sống khỏi ô uế. Những giáo điều tôn giáo khiến tháp này thay thế cho thiên nhiên hoang dã truyền thống, nhưng sự hiện diện của nó gắn kết cộng đồng chặt chẽ."
  tower_of_silence_01.tt.liege_not_approve_of_burial: "[liege_possessive|E] [faith|E] cho phép dân chúng của Ngài thực hành mai táng truyền thống mà không cần tới $building_type_event_tower_of_silence_01$"
  tower_of_silence_01.tt.county_not_tos_users: "[county|E] [faith|E] không xử lý người chết theo cách này"

  building_type_event_tower_of_silence_01: "Tháp Tĩnh Mặc"
  building_type_event_tower_of_silence_01_desc: "$building_tower_of_silence_01_desc$"
  building_event_tower_of_silence_01: "Tháp Tĩnh Mặc"
  building_event_tower_of_silence_01_desc: "$building_type_tower_of_silence_01_desc$"

  building_church_of_the_theotokos: "Đền thờ Theotokos"
  building_church_of_the_theotokos_desc: "Thánh Giá từ lâu đã chinh phục công trình tráng lệ này, đánh bại giáo phái ngoại giáo thờ nữ thần trinh khiết Athena.\nNgày nay, nơi đây lưu giữ các thánh điện tôn vinh Maria Parthenos, Mẹ Thiên Chúa và là Trinh Nữ duy nhất xứng đáng với danh hiệu #EMP Thánh#!."
  building_type_church_of_the_theotokos: "$building_church_of_the_theotokos$"
  building_type_church_of_the_theotokos_desc: "$building_church_of_the_theotokos_desc$"
  building_parthenon: "Parthenon"
  building_parthenon_desc: "Ngôi đền thiêng liêng của Athena hùng mạnh một lần nữa hiên ngang đứng vững, không còn bị vấy bẩn bởi những mê tín nực cười.\nNhững hàng cột và bức tường uy nghi này, được dựng lên hơn một nghìn năm trước, đã trường tồn cùng thời gian và vẫn che chở cho mái nhà của các tín đồ từ trên cao, như một biểu tượng thầm lặng cho phúc lành của Nữ Thần Trinh Khiết đã đặt tên cho thành phố."
  building_type_parthenon: "$building_parthenon$"
  building_type_parthenon_desc: "$building_parthenon_desc$"

  building_hagios_demetrios: "Hagios Demetrios"
  building_hagios_demetrios_desc: "Nhà thờ Thánh Demetrios là thánh địa quan trọng nhất của thành phố.\nĐược dựng lên từ khi đức tin vào Chúa Kitô còn non trẻ, công trình này kết hợp nhà tắm La Mã nơi vị Thánh, cùng nhiều tín đồ thời sơ khai khác, từng bị giam giữ, chịu tử đạo và an táng."
  building_type_hagios_demetrios: "$building_hagios_demetrios$"
  building_type_hagios_demetrios_desc: "$building_hagios_demetrios_desc$"

  building_kassiopi_castle: "Lâu đài Kassiopi"
  building_kassiopi_castle_desc: "Một công sự hùng vĩ trên bờ biển. Vị trí chiến lược của nó, kiểm soát eo biển ngăn cách hòn đảo với đất liền, khiến nơi đây trở thành điểm khống chế trọng yếu trong khu vực Ionian."
  building_type_kassiopi_castle: "$building_kassiopi_castle$"
  building_type_kassiopi_castle_desc: "$building_kassiopi_castle_desc$"

  building_saint_lazarus: "Nhà thờ Thánh Lazarus"
  building_saint_lazarus_desc: "Theo truyền thống, Lazarus xứ Bethany, người từng được Chúa Kitô hồi sinh từ cõi chết, đã được an táng tại thị trấn Larnaca sau cái chết thứ hai của mình.\nNgôi mộ bị thất lạc suốt nhiều thế kỷ, nhưng khi được tìm lại, Hoàng đế Leo VI đã cho di dời thánh tích của ngài về Constantinople và xây dựng nhà thờ đồ sộ này ngay trên phần mộ."
  building_type_saint_lazarus: "$building_saint_lazarus$"
  building_type_saint_lazarus_desc: "$building_saint_lazarus_desc$"

  building_type_sumela_monastery_01: "Tu viện Sumela"
  building_type_sumela_monastery_01_desc: "Nguồn gốc của tu viện này, được xây dựng trên một vách đá dựng đứng của Núi Đen, xa xưa đến mức gần như bị bao phủ bởi màn sương huyền bí; theo một số ghi chép, nó được dựng lên theo lệnh của Hoàng đế Theodosius vào thế kỷ IV, nhưng suối thiêng và những bích họa cổ có thể còn lâu đời hơn nữa.\nViên ngọc quý của tu viện là bức bích họa Mẹ Thiên Chúa, được cho là do chính Thánh Tông đồ Luca vẽ."
  building_sumela_monastery_01: "$building_type_sumela_monastery_01$"
  building_sumela_monastery_01_desc: "Tu viện từng rơi vào hoang phế trước khi được nhiều hoàng đế trùng tu và mở rộng; người có đóng góp lớn nhất cho diện mạo hiện tại là Hoàng đế Justinian thông qua sự can thiệp của tướng Belisarius."
  building_sumela_monastery_02: "$building_type_sumela_monastery_01$ Đã Tu Sửa"
  building_sumela_monastery_02_desc: "Đã nhiều thế kỷ trôi qua kể từ lần cuối tu viện được trùng tu. Đợt can thiệp gần đây nhất đã ban cho nó thêm đất đai thế tập và thuộc dân, miễn thuế, cùng nguồn tài trợ hoàng gia để xây dựng các công trình mới. Nhà thờ Đá là nơi hưởng lợi nhiều nhất khi được ban tặng một chu kỳ bích họa hoàn toàn mới."

  building_patras_castle: "Lâu đài Patras"
  building_patras_castle_desc: "Acropolis cổ xưa của thành phố Patras, tọa lạc trên một ngọn đồi thuộc dãy Vodias, đã được thay thế bằng một công sự dưới triều đại Hoàng đế Justinian.\nTừ đó đến nay, lâu đài luôn được sử dụng liên tục, luôn dưới sự bảo hộ của vị thánh bản địa, Thánh Andrew, và của #EMP genius loci#! Patrinella, bức tượng La Mã hình thiếu nữ."
  building_type_patras_castle: "$building_patras_castle$"
  building_type_patras_castle_desc: "$building_patras_castle_desc$"

  building_maiden_tower: "Tháp Trinh Nữ"
  building_maiden_tower_desc: "Mỏm đá trước bờ biển này đã từng là trạm thu thuế từ thời Alcibiades xứ Athens, nhờ vị trí lý tưởng ngay lối vào eo biển Bosphorus.\nNgày nay, một ngọn tháp kiên cố trên hòn đảo nhỏ này có thể kiểm soát toàn bộ tàu thuyền ra vào Biển Đen; ngoài ra, một sợi xích lớn có thể được kéo lên ngang mực nước giữa tháp và Constantinople, chặn đứng hiệu quả mọi con tàu nguy hiểm hoặc không mong muốn."
  building_type_maiden_tower: "$building_maiden_tower$"
  building_type_maiden_tower_desc: "$building_maiden_tower_desc$"

  building_despot_palace: "Cung điện của Despot"
  building_despot_palace_desc: "Một cung điện nguy nga ở vị trí an toàn trên núi Taygetos, ngay phía trên thành trì Mystras.\nCung điện sở hữu mọi xa hoa để sánh ngang với sự tráng lệ của các đại sảnh Constantinople, và chỉ xứng đáng với những thống đốc giàu có và quyền thế bậc nhất."
  building_type_despot_palace: "$building_despot_palace$"
  building_type_despot_palace_desc: "$building_despot_palace_desc$"

  building_type_meteora_01: "Meteora"
  building_type_meteora_01_desc: "Meteora là tên gọi do người dân địa phương đặt cho quần thể đá ngoạn mục gồm những cột đá tự nhiên vươn cao ngay bên sườn núi Pidnos."
  building_meteora_01: "$building_type_meteora_01$"
  building_meteora_01_desc: "Những hang động và hốc đá tự nhiên của Meteora đã được các ẩn sĩ khổ tu cư ngụ từ đầu thế kỷ IX, nhưng chưa từng có công trình nhân tạo nào làm biến đổi cảnh quan."
  building_meteora_02: "$building_type_meteora_01$"
  building_meteora_02_desc: "Khi ngày càng nhiều tu sĩ ẩn tu tìm đến những đỉnh đá rỗng của Meteora để lánh đời, các tu viện cũng dần mọc lên.\nTuy nhiên, quyền lực của con người trước thiên nhiên khắc nghiệt nơi đây vẫn hết sức mong manh; các tu viện cực kỳ khó tiếp cận, phần lớn chỉ dựa vào thang, dây thừng, kéo tay và #EMP lời cầu nguyện#!, bởi chỉ một sai sót nhỏ cũng có thể dẫn đến cái chết."

  building_type_mount_athos_01: "Núi Athos"
  building_type_mount_athos_01_desc: "Theo truyền thống, Đức Trinh Nữ Maria đang trên đường từ Palestine tới Cyprus để thăm Lazarus,  Bạn củacon trai bà, khi con tàu bị gió thổi lệch hướng và buộc phải cập bến tại đây, bên Núi Athos. Khi đặt chân lên bờ, Maria choáng ngợp trước vẻ đẹp thiên nhiên nơi này, nên đã ban phúc và xin nhận vùng đất làm khu vườn riêng của mình. Một tiếng nói từ Thiên Đàng đã chấp thuận điều đó; từ ấy, nơi đây được coi là thánh địa và bị cấm tuyệt đối với mọi phụ nữ khác."
  building_mount_athos_01: "$building_type_mount_athos_01$"
  building_mount_athos_01_desc: "Các cộng đồng Kitô giáo đã sinh sống trên mũi đất này ít nhất từ thời Hoàng đế Constantine I, và các tu sĩ từ Núi Athos từng tham gia Công đồng Nicaea lần thứ bảy. Tuy nhiên, cho tới nay vẫn chưa tồn tại cộng đồng tu viện đúng nghĩa hay các công trình kiên cố lâu dài."
  building_mount_athos_02: "$building_type_mount_athos_01$"
  building_mount_athos_02_desc: "Sự xuất hiện của một tu sĩ tên Athanasios tại Núi Athos đã khởi đầu cho việc thành lập nhiều tu viện khắp bán đảo: trước hết là Đại Lavra và Vatopedi, cả hai đều dâng hiến cho Lễ Truyền Tin. Với các tu viện đúng nghĩa, đời sống tu hành địa phương được thiết lập trật tự và luật lệ."
  building_mount_athos_03: "$building_type_mount_athos_01$"
  building_mount_athos_03_desc: "Danh tiếng của Núi Athos như một trung tâm tu viện — dựa trên vô số đặc quyền thế tục ban cho nó, quy chế tự trị, lối sống thực sự biệt lập và nền sản xuất thánh tượng hưng thịnh — đã bảo đảm dòng tu sĩ gia nhập không ngừng suốt nhiều thế kỷ.\nKhi số lượng tu sĩ tăng lên, số lượng tu viện cũng tăng theo. Hiện có hai mươi tu viện tồn tại trên Núi Athos, khiến nơi đây trở thành một trong những cộng đồng tu hành lớn và có ảnh hưởng nhất khu vực."

  building_apollinare_nuovo: "Sant'Apollinare Nuovo"
  building_apollinare_nuovo_desc: "Vương cung thánh đường Sant'Apollinare Nuovo chỉ mới mang tên hiện tại trong thời gian gần đây, khi thánh tích của Thánh Apollinaris được chuyển từ vương cung thánh đường lân cận tại Classe. Tuy nhiên, lịch sử của nó lâu đời hơn rất nhiều.\nĐược thánh hiến lần đầu vào đầu thế kỷ VI bởi Vua Theodoric của người Ostrogoth như một nhà thờ Arian, công trình đã trải qua nhiều lần trùng tu về cả kết cấu lẫn trang trí, trong khi vẫn giữ được phong cách độc đáo — sự hòa trộn thanh nhã giữa nghệ thuật phương Tây và phương Đông — cùng những bức khảm Byzantine tuyệt mỹ."
  building_type_apollinare_nuovo: "$building_apollinare_nuovo$"
  building_type_apollinare_nuovo_desc: "$building_apollinare_nuovo_desc$"

  building_saint_catherine: "Tu viện Thánh Catherine"
  building_saint_catherine_desc: "Một tu viện khiêm nhường giữa sa mạc, nhưng mang lịch sử nặng nề. Công trình tu viện đầu tiên thực chất được lệnh xây dựng bởi mẹ của Hoàng đế Constantine tại nơi Môi-se chứng kiến sự hiển linh của Bụi Gai Cháy. Hoàng đế Justinian đã tài trợ mở rộng nó thành tu viện kiên cố như ngày nay, đồng thời bao quanh cả Giếng của Môi-se. Chỉ nhiều thế kỷ sau khi được thành lập, thánh tích của Thánh Catherine mới được đưa tới tu viện, qua đó đổi tên nơi này.\nTu viện này từ lâu đã là một trong những trung tâm sao chép kinh sách và sáng tác thánh tượng cổ xưa và trù phú nhất."
  building_type_saint_catherine: "$building_saint_catherine$"
  building_type_saint_catherine_desc: "$building_saint_catherine_desc$"

  building_jvari_monastery: "Tu viện Jvari"
  building_jvari_monastery_desc: "Một tu viện cổ được dựng lên đúng tại nơi Thánh Nino đã cắm cây thánh giá kỳ diệu khi truyền bá Kitô giáo tại Georgia.\nCông trình linh thiêng này thu hút các đoàn hành hương từ khắp vùng Kavkaz."
  building_type_jvari_monastery: "$building_jvari_monastery$"
  building_type_jvari_monastery_desc: "$building_jvari_monastery_desc$"

  building_etchmiadzin_cathedral: "Nhà thờ chính tòa Vagarshapat"
  building_etchmiadzin_cathedral_desc: "Nhà thờ cổ kính này là trung tâm lịch sử của Giáo hội Tông truyền Armenia. Ban đầu được Thánh Gregory Kẻ Khai Sáng xây dựng trên nền một đền thờ ngoại giáo nhằm tượng trưng cho chiến thắng của tôn giáo mới được Vương quốc Armenia chấp nhận, nhà thờ gần như bị phá hủy hoàn toàn trong cuộc xâm lược của đế quốc Sasanid và được xây dựng lại từ đầu vài năm sau đó.\nTuy nhiên, kể từ thế kỷ thứ 7, nhà thờ liên tục bị cướp phá và bỏ hoang, rơi vào tình trạng xuống cấp nghiêm trọng. Chỉ một sự can thiệp triệt để và tốn kém mới có thể khôi phục lại vinh quang xưa kia của nó."
  building_type_etchmiadzin_cathedral: "$building_etchmiadzin_cathedral$"
  building_type_etchmiadzin_cathedral_desc: "$building_etchmiadzin_cathedral_desc$"

  building_cattolica_stilo: "Cattolica di Stilo"
  building_cattolica_stilo_desc: "Ảnh hưởng Byzantine thể hiện rất rõ trong công trình này: một nhà thờ nhỏ có nhà rửa tội, xây bằng gạch đỏ, nép mình trên những mỏm đá trần trụi, với mặt bằng hình \"thập giá nội tiếp\" và hệ thống bích họa phong phú, nhìn xuống thung lũng suối Stilaro.\nNhà thờ là một viên ngọc cô độc giữa thiên nhiên khắc nghiệt, nơi con người có thể cảm nhận sự gần gũi hơn với Thiên Chúa."
  building_type_cattolica_stilo: "$building_cattolica_stilo$"
  building_type_cattolica_stilo_desc: "$building_cattolica_stilo_desc$"

  building_hosios_loukas: "Hosios Loukas"
  building_hosios_loukas_desc: "Tu viện này được xây dựng để lưu giữ thánh tích của Chân phúc Luke xứ Steiris, một ẩn sĩ tu hành.\nTương truyền thánh tích tỏa ra một loại dầu kỳ diệu, thu hút vô số người hành hương ngủ bên ngôi mộ với hy vọng được chữa lành thông qua nghi thức nằm mộng. Trang trí nội thất của tu viện được ca ngợi khắp vùng Đông Địa Trung Hải nhờ chất lượng và sự xa hoa, khi những nghệ nhân xuất sắc nhất thời đại đã làm phong phú nơi đây bằng tranh ghép, biểu tượng thánh, đèn chùm, chạm khắc và vải vóc."
  building_type_hosios_loukas: "$building_hosios_loukas$"
  building_type_hosios_loukas_desc: "$building_hosios_loukas_desc$"

  building_sofia_ohrid: "Nhà thờ Thánh Sophia"
  building_sofia_ohrid_desc: "Nhà thờ chính tòa Ohrid từng bị phá hủy khi người Slav lần đầu tràn xuống vùng đất này và chỉ được xây dựng lại khi khu vực quay trở lại hoàn toàn với đức tin Kitô giáo.\nPhiên bản cuối cùng của công trình là một nhà thờ basilica có mái vòm, được trang trí phong phú bằng các chuỗi bích họa do những nghệ nhân xuất sắc nhất thời đại thực hiện."
  building_type_sofia_ohrid: "$building_sofia_ohrid$"
  building_type_sofia_ohrid_desc: "$building_sofia_ohrid_desc$"

  building_fairy_chimneys: "Khu định cư Hang Đá"
  building_fairy_chimneys_desc: "Đá tại khu vực này cực kỳ dễ tạo hình, tự nhiên hình thành các cột đá, đỉnh nhọn và hang động.\nCon người đã tận dụng những cấu trúc này suốt nhiều thế kỷ, ban đầu làm chuồng trại, kho chứa và nơi trú ẩn, sau đó là nhà ở và công trình sản xuất, rồi cuối cùng là các nhà thờ khoét sâu vào trong các cột đá, từ đó hình thành nên cả những khu định cư hoàn chỉnh."
  building_type_fairy_chimneys: "$building_fairy_chimneys$"
  building_type_fairy_chimneys_desc: "$building_fairy_chimneys_desc$"

  building_cilician_gates: "Cổng Cilicia"
  building_cilician_gates_desc: "Cổng Cilicia là một con đèo xuyên qua dãy núi Taurus, nối liền đồng bằng Cilicia với cao nguyên Anatolia.\nTừ thuở xa xưa, con đèo này đã được củng cố phòng thủ, và việc kiểm soát nó đồng nghĩa với việc kiểm soát một trong những huyết mạch thương mại và quân sự quan trọng nhất của Tiểu Á và Trung Đông."
  building_type_cilician_gates: "$building_cilician_gates$"
  building_type_cilician_gates_desc: "$building_cilician_gates_desc$"

  building_swahili_port_pemba: "Cảng Thương mại Pemba"
  building_swahili_port_pemba_desc: "Các rạn san hô, bãi biển và rừng ngập mặn của đảo Pemba cung cấp vô số vịnh nhỏ và tài nguyên cho cư dân địa phương, khiến nơi đây trở thành một trung tâm trung chuyển tự nhiên của vùng Zanj."
  building_type_swahili_port_pembas: "$building_swahili_port_pemba$"
  building_type_swahili_port_pemba_desc: "$building_swahili_port_pemba_desc$"

  building_swahili_port_zanzibar: "Cảng Thương mại Zanzibar"
  building_swahili_port_zanzibar_desc: "Bờ cát mịn của đảo Unguja, được che chở bởi các đảo san hô, tạo nên một bến cảng lý tưởng cho tàu thuyền. Thương nhân từ khắp Ấn Độ Dương tụ hội về đây để tận dụng lợi thế tự nhiên của Unguja như một trung tâm thương mại hàng hải."
  building_type_swahili_port_zanzibar: "$building_swahili_port_zanzibar$"
  building_type_swahili_port_zanzibar_desc: "$building_type_swahili_port_zanzibar_desc$"

  building_swahili_port_mombasa: "Cảng Mombasa"
  building_swahili_port_mombasa_desc: "Tọa lạc trên một hòn đảo đá bao quanh bởi những vách đá dựng đứng, Mombasa sở hữu vị trí phòng thủ tự nhiên vững chắc nhưng vẫn đặc biệt thuận lợi cho giao thông đường biển."
  building_type_swahili_port_mombasa: "$building_swahili_port_mombasa$"
  building_type_swahili_port_mombasa_desc: "$building_swahili_port_mombasa_desc$"

  building_swahili_port_pate: "Cảng Thương mại đảo Pate"
  building_swahili_port_pate_desc: "Nằm ở rìa phía bắc của trung tâm Swahili, đảo Pate là một trong những vùng Swahili đầu tiên tiếp nhận Hồi giáo, từ đó kết nối với các mạng lưới thương mại Trung Đông."
  building_type_swahili_port_pate: "$building_swahili_port_pate$"
  building_type_swahili_port_pate_desc: "$building_swahili_port_pate_desc$"

  building_swahili_port_lamu: "Cảng Thương mại Lamu"
  building_swahili_port_lamu_desc: "Những bãi cát trắng ấm áp và làn nước xanh biếc vỗ nhẹ bờ biển che giấu nhịp sống thương mại sôi động, vốn là mạch sống của Lamu. Từ lâu đã gắn liền với thương mại xuyên đại dương, nơi đây cho phép mua bán hàng hóa từ cả hai đầu phía tây và phía đông của thế giới được biết đến."
  building_type_swahili_port_lamu: "$building_swahili_port_lamu$"
  building_type_swahili_port_lamu_desc: "$building_swahili_port_lamu_desc$"

  building_type_dragon_kiln_01: "Lò Rồng"
  building_type_dragon_kiln_01_desc: "Được xây dựng trên sườn dốc đứng, tổ hợp lò này có thể tạo ra nhiệt độ cực cao cần thiết để sản xuất các loại gốm sứ quý hiếm, rất được ưa chuộng như hàng hóa trao đổi và quà tặng."
  building_dragon_kiln_01: "Lò Leo Dốc"
  building_dragon_kiln_01_desc: "Lò dài này dẫn luồng gió lửa theo phương ngang, tạo ra nhiệt độ dữ dội cần thiết để thợ gốm chế tác những chiếc bát, bình và đồ gốm giá trị cao."
  building_dragon_kiln_02: "Lò Saggar"
  building_dragon_kiln_02_desc: "Việc sản xuất gốm trở nên dễ dàng hơn nhờ sử dụng saggar — những hộp đơn giản giúp bảo vệ đồ gốm khi nung khỏi tạp chất và hư hại như khói, tro và mảnh vụn từ sản xuất quy mô lớn."
  building_dragon_kiln_03: "Lò Nhiều Buồng"
  building_dragon_kiln_03_desc: "Việc bao bọc ngọn lửa chính trong nhiều buồng vừa giúp điều hòa nhiệt độ vừa giúp công nhân dễ dàng đưa gốm vào và lấy ra, tạo ra sản phẩm chất lượng cao hơn ở quy mô lớn, sẵn sàng bán với giá cao hơn."
  dragon_kiln_terrain_requirement_tt: "[terrain|E] không phải là #V $terrain_mountains$#!, #V $terrain_desert_mountains$#! hoặc #V $terrain_hills$#!"
  dragon_kiln_quarry_requirement_tt: "Yêu cầu có [GetBuilding('quarries_01').GetName] hoặc cao hơn"

  TERRAIN_NOT_FARMLANDS: "Địa hình không phải là $farmlands$"
  building_type_burkhan_khaldun_01: "Burkhan Khaldun"
  building_type_burkhan_khaldun_01_desc: "Burkhan Khaldun là ngọn núi hùng vĩ nhất của dãy Khentii.\nĐược cho là nơi sinh ra của nhiều anh hùng Mông Cổ, các sườn núi phủ đầy ovoo và vô số lễ tế được tiến hành để cầu mong sự phù hộ của ngọn núi."
  building_burkhan_khaldun_01: "$building_type_burkhan_khaldun_01$"
  building_burkhan_khaldun_01_desc: "$building_type_burkhan_khaldun_01_desc$"

  building_pleasure_dome: "Cung Điện Hoan Lạc"
  building_pleasure_dome_desc: "Một cung điện Mông Cổ, vừa đóng vai trò trung tâm quân sự vừa là trung tâm văn hóa. Điểm nhấn lớn nhất là đài phun nước hình cây bạc, nơi các loại rượu khác nhau chảy ra từ những con rắn quấn quanh bức tượng."
  building_type_pleasure_dome: "$building_pleasure_dome$"
  building_type_pleasure_dome_desc: "$building_pleasure_dome_desc$"

  building_type_murex_farm_01: "Ngư Trại Ốc Murex"
  building_type_murex_farm_01_desc: "Màu tím hoàng gia luôn có nhu cầu rất cao. Những con ốc dùng để tạo ra loại thuốc nhuộm xa xỉ này được thu hoạch và chế biến tại đây."
  building_murex_farm_01: "Người Khai Thác Ốc Murex"
  building_murex_farm_01_desc: "Một ngành đánh bắt ốc Murex phát triển mạnh đã hình thành dọc theo bờ biển Địa Trung Hải, mang lại nguồn thu nhập khiêm tốn nhưng ổn định từ việc bán ốc thu hoạch được."
  building_murex_farm_02: "Trung Tâm Chế Biến Murex"
  building_murex_farm_02_desc: "Trung tâm này xử lý ốc Murex một cách hiệu quả, tăng cường khả năng chiết xuất dịch tiết quý giá của chúng, tạo ra thuốc nhuộm tím chất lượng cao hơn."
  building_murex_farm_03: "Xưởng Chưng Cất Thuốc Nhuộm"
  building_murex_farm_03_desc: "Xưởng chưng cất chuyên dụng tinh luyện dịch tiết Murex thành thuốc nhuộm tím đậm đặc, giúp tăng đáng kể độ rực và giá trị của thuốc nhuộm."
  building_murex_farm_04: "Sân Phơi"
  building_murex_farm_04_desc: "Sân phơi ngoài trời đẩy nhanh quá trình oxy hóa của thuốc nhuộm, rút ngắn thời gian sản xuất và đảm bảo quy trình làm việc hiệu quả hơn."
  building_murex_farm_05: "Nghiệp Đoàn Thợ Nhuộm Bậc Thầy"
  building_murex_farm_05_desc: "Nghiệp đoàn thợ nhuộm bậc thầy, nổi tiếng với việc tạo ra sắc tím Tyre hoàn hảo, nâng cao độ chính xác trong nhuộm vải, cho ra những trang phục tím có chất lượng cao và đồng đều."
  building_murex_farm_06: "Xưởng Dệt Lụa"
  building_murex_farm_06_desc: "Xưởng này chuyên dệt các loại vải xa xỉ như lụa để nhuộm, cho phép sản xuất những trang phục có chất lượng vượt trội và giá trị thương mại cao hơn."
  building_murex_farm_07: "Xưởng Dệt Hoàng Gia"
  building_murex_farm_07_desc: "Xưởng hoàng gia tập trung vào sản xuất hàng loạt vải nhuộm tím Tyre, làm tăng đáng kể thu nhập từ việc bán các trang phục danh giá này."
  building_murex_farm_08: "Cung Điện Tím Hoàng Gia"
  building_murex_farm_08_desc: "Một cung điện nguy nga được trang trí bằng các họa tiết mang chủ đề tím Tyre, biểu trưng cho sự giàu có và quyền lực, đồng thời phô diễn trình độ bậc thầy trong sản xuất màu tím hoàng gia tại địa phương."

  building_type_generic_copper_mines_01: "Mỏ Đồng"
  building_type_generic_copper_mines_01_desc: "Một mỏ đồng quan trọng, cung cấp quặng đồng cực kỳ sinh lợi cho bất kỳ ai may mắn sở hữu nó."
  building_generic_copper_mines_01: "Khu Khai Thác Đồng"
  building_generic_copper_mines_01_desc: "$building_rammelsberg_mines_01_desc$"
  building_generic_copper_mines_02: "Mỏ Đồng"
  building_generic_copper_mines_02_desc: "$building_rammelsberg_mines_02_desc$"
  building_generic_copper_mines_03: "Mỏ Đồng Lớn"
  building_generic_copper_mines_03_desc: "$building_rammelsberg_mines_03_desc$"
  building_generic_copper_mines_04: "Tổ Hợp Khai Thác Đồng"
  building_generic_copper_mines_04_desc: "$building_rammelsberg_mines_04_desc$"

  building_type_generic_silver_mines_01: "Mỏ Bạc"
  building_type_generic_silver_mines_01_desc: "Một mỏ bạc giàu trữ lượng, cung cấp dòng bạc quý giá liên tục."
  building_generic_silver_mines_01: "Khu Khai Thác Bạc"
  building_generic_silver_mines_01_desc: "$building_rammelsberg_mines_01_desc$"
  building_generic_silver_mines_02: "Mỏ Bạc"
  building_generic_silver_mines_02_desc: "$building_rammelsberg_mines_02_desc$"
  building_generic_silver_mines_03: "Mỏ Bạc Lớn"
  building_generic_silver_mines_03_desc: "$building_rammelsberg_mines_03_desc$"
  building_generic_silver_mines_04: "Tổ Hợp Khai Thác Bạc"
  building_generic_silver_mines_04_desc: "$building_rammelsberg_mines_04_desc$"

  building_type_generic_gold_mines_01: "Mỏ Vàng"
  building_type_generic_gold_mines_01_desc: "Một mỏ vàng cực kỳ giá trị và hiếm có, được mọi quý tộc trong vùng thèm khát."
  building_generic_gold_mines_01: "Khu Khai Thác Vàng"
  building_generic_gold_mines_01_desc: "$building_rammelsberg_mines_01_desc$"
  building_generic_gold_mines_02: "Mỏ Vàng"
  building_generic_gold_mines_02_desc: "$building_rammelsberg_mines_02_desc$"
  building_generic_gold_mines_03: "Mỏ Vàng Lớn"
  building_generic_gold_mines_03_desc: "$building_rammelsberg_mines_03_desc$"
  building_generic_gold_mines_04: "Tổ Hợp Khai Thác Vàng"
  building_generic_gold_mines_04_desc: "$building_rammelsberg_mines_04_desc$"
 
  building_type_capital_bureau_01: "Nha Quản Lý Thủ Đô"
  building_type_capital_bureau_01_desc: "Một cơ quan chính quyền chuyên trách, dồn toàn bộ nguồn lực để quản lý thủ đô. Hàng loạt thư lại và viên chức sinh sống trong những bức tường này, sẵn sàng phục vụ theo mệnh lệnh của quan trưởng eparch."
  building_capital_bureau_01: "Tòa Án"
  building_capital_bureau_01_desc: "Pháp luật là nền tảng giúp một thành phố phát triển và thịnh vượng, và pháp luật chỉ có thể được duy trì thông qua tòa án."
  building_capital_bureau_02: "Nha An Ninh"
  building_capital_bureau_02_desc: "Cơ quan này sử dụng một lực lượng cảnh vệ đông đảo, giữ cho thành phố an toàn trước tội phạm và bắt giữ những kẻ vi phạm pháp luật."
  building_capital_bureau_03: "Trụ Sở Lính Cứu Hỏa"
  building_capital_bureau_03_desc: "Hỏa hoạn luôn là mối đe dọa thường trực đối với các khu dân cư đông đúc. Một đội cứu hỏa được huấn luyện bài bản sẽ dập tắt đám cháy trước khi nó lan rộng."
  building_capital_bureau_04: "Nha Quản Lý Nghiệp Đoàn"
  building_capital_bureau_04_desc: "Bổ nhiệm quan chức giám sát các nghiệp đoàn trong thành phố sẽ đảm bảo mỗi nghiệp đoàn hoạt động hiệu quả, duy trì chất lượng và tuân thủ đầy đủ các quy định cần thiết."
  building_capital_bureau_05: "Bộ Pháp Chế"
  building_capital_bureau_05_desc: "Một bộ phận mở rộng chuyên trách các vấn đề tư pháp là điều không thể thiếu đối với một thành phố lớn và đang phát triển. Một đội ngũ đông đảo quan chức, thư lại và thẩm phán làm việc không ngừng để duy trì luật pháp và trật tự."
  building_capital_bureau_06: "Ngục Thành Phố"
  building_capital_bureau_06_desc: "Dù có thể tồn tại nhiều nhà giam nhỏ rải rác khắp thành phố, một ngục lớn sẽ đảm bảo rằng bất kỳ kẻ vi phạm pháp luật nào cũng có sẵn một phòng giam dành cho họ."
  building_capital_bureau_07: "Học Viện Thương Mại"
  building_capital_bureau_07_desc: "Thương mại là lĩnh vực quá béo bở để không được quản lý chặt chẽ bằng luật pháp. Bằng cách giám sát thuế quan và hàng hóa ra vào thành phố, chúng ta có thể điều hành nguồn cung của thủ đô hiệu quả hơn, và thậm chí còn thu thêm được vàng."
  building_capital_bureau_08: "Cung Điện Đô Thị"
  building_capital_bureau_08_desc: "Một dinh thự đồ sộ và nguy nga, tráng lệ đến mức khiến hầu hết các cung điện khác phải lu mờ, đảm bảo vị tổng quản có thể luôn ở gần và sẵn sàng điều hành. Bởi vì một thành phố không bao giờ thực sự ngủ, nhưng người quản lý của nó thì có."
  capital_bureau_custom_effect_desc: "#low Mở khóa:#!\nTăng [aptitude|E] cho [court_position|E] [GetCourtPositionType('eparch_court_position').GetName()]"

  building_type_breweries_01: "Xưởng Nấu Bia"
  building_type_breweries_01_desc: "Công trình này dành cho việc nấu, lên men và bảo quản nhiều loại bia, ale và các thức uống lên men khác. Nó đóng vai trò quan trọng trong văn hóa và kinh tế địa phương."
  building_breweries_01: "Nhà Nấu Bia"
  building_breweries_01_desc: "Trái tim của mọi xưởng nấu bia, nơi quá trình nấu bắt đầu. Tại đây, các nguyên liệu được trộn, đun sôi và chuẩn bị cho quá trình lên men."
  building_breweries_02: "Hầm Lưu Trữ"
  building_breweries_02_desc: "Một không gian mát mẻ và tối, nơi đồ uống đã nấu được bảo quản và ủ, giúp phát triển hương vị và chất lượng mong muốn."
  building_breweries_03: "Bể Nấu"
  building_breweries_03_desc: "Những bể lớn nơi dịch nha được đun sôi và thảo mộc hoặc hoa bia được thêm vào — một bước then chốt để tạo vị đắng và hương thơm cho bia."
  building_breweries_04: "Kho Ngũ Cốc"
  building_breweries_04_desc: "Kho chứa giúp bảo quản số lượng lớn ngũ cốc khô ráo và tránh sâu bọ, đảm bảo nguồn nguyên liệu ổn định cho việc nấu bia."
  building_breweries_05: "Nhà Giếng"
  building_breweries_05_desc: "Một giếng nước được xây dựng để đảm bảo nguồn nước sạch và ổn định, yếu tố thiết yếu để tạo ra bia chất lượng cao."
  building_breweries_06: "Phòng Thùng Gỗ"
  building_breweries_06_desc: "Khu vực nơi bia đã lên men được lưu trữ cẩn thận trong các thùng gỗ, được niêm kín đúng cách và sẵn sàng phân phối."
  building_breweries_07: "Phòng Đóng Thùng"
  building_breweries_07_desc: "Không gian chuyên dụng để chiết bia vào thùng. Các thùng này thường dùng cho số lượng lớn và được các quán trọ, tửu quán ưa chuộng."
  building_breweries_08: "Sảnh Thử Bia"
  building_breweries_08_desc: "Một đại sảnh nơi các thợ nấu bia và khách mời có thể nếm thử những mẻ bia khác nhau, tạo cơ hội thưởng thức các loại bia mới nhất."

  brewery_effect_desc: "#low Mở khóa:#!\n[court_position|E]: [GetCourtPositionType('court_brewmaster_court_position').GetName()]"

 #ACH
  building_type_oath_warriors_building_01: "Đặc Quyền Quân Sự"
  building_type_oath_warriors_building_01_desc: "Quân chủ của vùng đất này đã tuyên thệ trong lễ đăng quang rằng sẽ chu cấp cho các chiến binh."
  building_oath_warriors_building_01: "Điền Trang Cựu Binh"
  building_oath_warriors_building_01_desc: "Những chiến binh quý tộc có thâm niên phục vụ lâu dài được ban cho các mảnh đất rộng rãi tại địa phương, từ đó làm gia tăng mong muốn phục vụ trung thành."
  building_oath_warriors_building_02: "Điền Trang Quân Nhân"
  building_oath_warriors_building_02_desc: "Những thành viên của tầng lớp quý tộc chiến binh sống sót sau chiến trường được hưởng cuộc sống sung túc, các lãnh địa được ban cho phép họ tự tuyển mộ và trang bị lực lượng hùng hậu."
  building_oath_warriors_building_03: "Lãnh Địa Làng Xã"
  building_oath_warriors_building_03_desc: "Nhiều làng mạc địa phương được trao cho các sĩ quan hiệp sĩ làm lãnh địa cá nhân, cho phép họ tích lũy sức mạnh và của cải, thường là gây thiệt thòi cho các tầng lớp khác."
  building_oath_warriors_building_04: "Lãnh Địa Quân Sự Rộng Lớn"
  building_oath_warriors_building_04_desc: "Một phần đáng kể thuế địa phương được chuyển giao cho các quý tộc chiến binh cấp thấp, những người nắm giữ cả đất đai lẫn cư dân. Tuy vậy, các đội tùy tùng hùng mạnh của họ vẫn tiếp tục phục vụ."

  building_type_oath_faithful_building_01: "Công Trình Tôn Giáo"
  building_type_oath_faithful_building_01_desc: "Quân chủ của vùng đất này đã tuyên thệ trong lễ đăng quang rằng sẽ chu cấp cho những tín đồ."
  building_oath_faithful_building_01: "Miếu Thờ Ven Đường"
  building_oath_faithful_building_01_desc: "Những mái che nhỏ ven đường lưu giữ các biểu tượng linh thiêng giản dị."
  building_oath_faithful_building_02: "Cổng Thánh"
  building_oath_faithful_building_02_desc: "Phía trên các cổng vào và khắp khu định cư, những tác phẩm nghệ thuật tôn giáo tinh xảo khơi gợi lòng tôn kính và hứa hẹn sự an toàn cho người qua lại."
  building_oath_faithful_building_03: "Thánh Địa Đền Thờ"
  building_oath_faithful_building_03_desc: "Các quần thể đền thờ địa phương được mở rộng với những khu vườn có mái vòm, những nơi yên bình bao quanh các giếng nước ngọt."
  building_oath_faithful_building_04: "Quảng Trường Tưởng Niệm"
  building_oath_faithful_building_04_desc: "Nguồn đầu tư lớn được dồn vào các quảng trường trung tâm đồ sộ, tràn ngập nghệ thuật tôn giáo, được giữ sạch sẽ khỏi sự ô uế và cho vay nặng lãi, đồng thời cung cấp nước cho dân cư."

  building_type_oath_poor_building_01: "Nhà Tế Bần Chính Thức"
  building_type_oath_poor_building_01_desc: "Quân chủ của vùng đất này đã tuyên thệ trong lễ đăng quang rằng sẽ chu cấp cho người nghèo."
  building_oath_poor_building_01: "Phong Tục Bố Thí"
  building_oath_poor_building_01_desc: "Những người có của cải được chính quyền khuyến khích chia sẻ lương thực và tài sản dư thừa cho người kém may mắn, thường là vào các ngày lễ thánh."
  building_oath_poor_building_02: "Nhà Cứu Tế"
  building_oath_poor_building_02_desc: "Người nghèo khổ nhất, góa phụ và người cao tuổi được cung cấp chỗ ở khiêm tốn cùng một mức độ chăm sóc nhất định."
  building_oath_poor_building_03: "Cơ Quan Nhân Ái"
  building_oath_poor_building_03_desc: "Các nhà tế bần và những nhu cầu dân sự khác phục vụ người khốn khổ được điều hành chu đáo bởi các quan chức có tiềm lực."
  building_oath_poor_building_04: "Thiết Chế Từ Thiện"
  building_oath_poor_building_04_desc: "Khắp vùng đất, người nghèo không còn thiếu thốn. Chỗ ở rộng rãi tiếp nhận những kẻ lang thang tiềm tàng, bệnh viện chăm sóc người bệnh và người già, cùng các khoản trợ cấp hào phóng dành cho nông dân nghèo."

  oath_warriors_building_01_tooltip_high_medieval: "Ít nhất #V 3#! [knights|E] của Ngài (hiện tại: #P [GetPlayer.MakeScope.ScriptValue('oath_warriors_building_01_high_medieval_value')|0]#!):\n Có ít nhất #V 14#! [prowess|E] và ít nhất một [commander_trait|E]"
  oath_warriors_building_01_tooltip_early_medieval: "Ít nhất #V 2#! [knights|E] của Ngài (hiện tại: #P [GetPlayer.MakeScope.ScriptValue('oath_warriors_building_01_early_medieval_value')|0]#!):\n Có ít nhất #V 10#! [prowess|E] và ít nhất một [commander_trait|E]"
