  oath_warriors_building_03_tooltip_late_medieval: "Ít nhất #V 8#! [knights|E] của Ngài (hiện tại: #P [GetPlayer.MakeScope.ScriptValue('oath_warriors_building_03_late_medieval_value')|0]#!):\n Có ít nhất #V 16#! [prowess|E] và [martial|E] [skills|E]"
