  building_type_itoigawa_mines_01: "Các mỏ ngọc Itoigawa"
  building_type_itoigawa_mines_01_desc: "Sông Kotakigawa chảy qua khe núi dưới chân núi Myojo và giàu các trữ lượng ngọc lớn. Những trữ lượng này cho ra một trong những loại ngọc tinh mỹ nhất trong khu vực và xa hơn nữa, mê hoặc ánh nhìn với sắc xanh lục rực rỡ."
