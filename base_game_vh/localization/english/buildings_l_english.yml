  building_type_liangzhe_mines_01:0 "Mỏ Liangzhe"
  building_type_liangzhe_mines_01_desc:0 "Là một vùng khai thác bạc quan trọng trong nhiều thế kỷ, các mỏ ở Liangzhe vẫn còn nhiều mạch chưa khai thác."
