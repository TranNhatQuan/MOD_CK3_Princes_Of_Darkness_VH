  building_type_xiuyan_mines_01: "Các mỏ ngọc Xiuyan"
  building_type_xiuyan_mines_01_desc: "Mỏ đá cổ xưa này đã cung cấp ngọc chất lượng cao cho cộng đồng địa phương suốt hàng thiên niên kỷ. Người Hồng Sơn đã khám phá và phát triển nhiều hình thức thủ công từ nơi đây, như vòng tay, công cụ và các hiện vật mang tính biểu tượng, góp phần làm phong phú đời sống xã hội và danh tiếng gia tộc."
