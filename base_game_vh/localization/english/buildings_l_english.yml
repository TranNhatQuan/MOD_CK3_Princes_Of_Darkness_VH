  building_type_trepca_mines_01:0 "Các mỏ Trepča"
  building_type_trepca_mines_01_desc:0 "Nằm trên sườn núi Kopaonik, Trepča là khu vực đã được khai thác bạc từ thời La Mã. Dù bị đóng cửa vào đầu thời Trung Cổ, nơi đây vẫn còn lưu giữ những trữ lượng kim loại quý vô cùng dồi dào."
