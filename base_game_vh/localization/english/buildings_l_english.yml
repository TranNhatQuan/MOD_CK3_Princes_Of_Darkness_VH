l_english: 
  BUILDING_DEBUG_KEY: "#D KHÓA DEBUG:#! [BUILDING.GetKey]"
  BUILDING_DEBUG_FULL: "#D KHÓA & MÔ TẢ DEBUG:#!\n[Building.GetKey]\n[Building.GetDescKey]"
  BUILDING_TOOLTIP_TEXT:1 "[Building.GetDescription]\n\n[Building.GetEffectDescription( GetPlayer )]"
  building_type_castle_01:0 "Lâu đài"
  building_type_castle_01_desc:1 "Một thành lũy được thiết kế không chỉ để làm nơi ở cho một gia tộc quý tộc danh giá, mà còn để bảo vệ thị trấn và vùng đất canh tác xung quanh."
  building_castle_01:1 "Motte"
  building_castle_01_desc:1 "Công sự nhỏ nhưng kiên cố này được xây dựng trên một gò đất nhân tạo cao."
  building_castle_02:1 "Tháp chính"
  building_castle_02_desc:1 "Tháp chính #weak (hay Donjon)#! là một tòa tháp lớn, vừa đóng vai trò là nơi cư trú kiên cố vừa là tuyến phòng thủ cuối cùng."
  building_castle_03:1 "Lâu đài Đồng tâm"
  building_castle_03_desc:1 "Lâu đài Đồng tâm được bao bọc bởi hai hoặc nhiều lớp tường, trong đó tường bên trong cao hơn tường bên ngoài."
  building_castle_04:1 "Pháo đài"
  building_castle_04_desc:1 "Pháo đài là đỉnh cao của nghệ thuật phòng thủ, vừa có thể đẩy lùi các đợt tấn công của kẻ địch, vừa đủ sức chứa một lực lượng quân sự lớn."
  building_type_temple_01:0 "Đền thờ"
  building_type_temple_01_desc:1 "Một nơi thờ phụng do giáo sĩ cai quản, được bao quanh bởi một thị trấn của những nông dân sùng đạo."
  building_temple_01:1 "Miếu thờ"
  building_temple_01_desc:0 "$building_type_temple_01_desc$"
  building_temple_02:1 "Khuôn viên Đền thờ"
  building_temple_02_desc:1 "Ngôi đền nằm ở trung tâm ngôi làng, được các thợ thủ công địa phương xây dựng cẩn thận để thể hiện lòng tận hiến với đức tin."
  building_temple_03:1 "Thánh đường"
  building_temple_03_desc:1 "Dù có thể tiếp đón rất nhiều tín đồ, đền thờ không chỉ phục vụ việc hành lễ — nó còn phải là nơi cư trú của giáo sĩ, hỗ trợ một thư viện lớn và bảo vệ các thánh tích. Với việc xây dựng thánh đường, luôn có đủ không gian cho các tín đồ đến cầu nguyện."
  building_temple_04:1 "Đại Thánh đường"
  building_temple_04_desc:1 "Không hài lòng với một ngôi đền nhỏ bé và khiêm tốn, các nghệ nhân và kiến trúc sư địa phương đã cùng nhau tạo nên một tuyệt tác thực sự. Đại thánh đường này dường như triệu hồi chính quyền năng của thiên giới đến với bất kỳ tín đồ nào bước vào những sảnh đường huy hoàng của nó."
  building_type_city_01:0 "Thành thị"
  building_type_city_01_desc:1 "Một thành phố đông dân, nơi sinh sống của nhiều thị dân, thương nhân và tầng lớp lao động cần mẫn."
  building_city_01:1 "Trung tâm Làng"
  building_city_01_desc:0 "$building_type_city_01_desc$"
  building_city_02:1 "Thành phố Lớn"
  building_city_02_desc:1 "Thành phố này đã thu hút sự chú ý của thương nhân và thợ thủ công từ khắp nơi, với các thương gia giàu có mở cửa hàng và những người thợ chăm chỉ dựng lên các ngôi nhà mới gần như mỗi ngày."
  building_city_03:1 "Trung tâm Thành phố"
  building_city_03_desc:1 "Không còn chỉ gói gọn trong khu vực ban đầu, thành phố nay đã mở rộng và hấp thụ cả các vùng đất canh tác lân cận vào trung tâm thịnh vượng của mình. Thành phố rộng lớn, giàu có và tràn đầy cơ hội."
  building_city_04:1 "Đại Đô thị Sầm uất"
  building_city_04_desc:1 "Thành phố này nổi danh khắp nơi nhờ vô số cơ hội bên trong — người ta nói rằng ngay cả kẻ nông dân thấp kém nhất cũng có thể tìm thấy vận may tại đây. Nhà cửa san sát dọc theo các con phố đến tận chân trời, với xe kéo và súc vật tất bật vận chuyển hàng hóa khắp mọi nơi."

  building_type_temple_citadel_01: "Thành lũy Đền thờ"
  building_type_temple_citadel_01_desc: "Một nơi vừa để thờ phụng vừa để phòng thủ; những bức tường đồ sộ bao bọc toàn bộ khu thánh địa này."
  building_temple_citadel_01: "Tháp đền"
  building_temple_citadel_01_desc: "$building_type_temple_citadel_01_desc$"
  building_temple_citadel_02: "Tu viện có tường bao"
  building_temple_citadel_02_desc: "Thành lũy được mở rộng về sức chứa và tổ chức, vừa che chở cho các tín đồ địa phương vừa cung cấp nơi đóng quân phù hợp để kịp thời ứng phó với mọi cuộc tấn công."
  building_temple_citadel_03: "Quần thể Đền thờ"
  building_temple_citadel_03_desc: "Các công trình bổ sung mang lại sự tiện nghi và hiệu quả; nơi thờ phụng này đã sẵn sàng cho hầu hết mọi tình huống. Cư dân nơi đây có nghĩa vụ vừa canh gác trên tường thành vừa cầu nguyện tại các điện thờ địa phương."
  building_temple_citadel_04: "Pháo đài Thánh địa"
  building_temple_citadel_04_desc: "Thánh điện này được bảo vệ nghiêm ngặt bằng tháp canh, tường thành, hào lũy và các tiền đồn quân sự, dường như còn nhận được sự che chở thiêng liêng từ thiên giới, khiến cư dân và lượng lớn tín đồ hành hương cảm thấy an toàn."

  building_type_common_tradeport_01:0 "Cảng Thương mại"
  building_type_common_tradeport_01_desc:1 "Các thuyền buôn chở hàng cập bến và bốc dỡ hàng hóa tại cảng này."
  building_common_tradeport_01:1 "Bến cảng Nhỏ"
  building_common_tradeport_01_desc:1 "Một bến cảng khiêm tốn nằm ven bờ, cho phép tàu thuyền bốc dỡ hàng hóa mà không tốn nhiều công sức."
  building_common_tradeport_02:1 "Xưởng đan Lưới cá"
  building_common_tradeport_02_desc:1 "Một xưởng chuyên đan và sửa chữa lưới đánh cá được dựng lên tại đây. Ngày qua ngày, lưới cá được làm mới và tu bổ không ngừng."
  building_common_tradeport_03:1 "Cảng Thương mại"
  building_common_tradeport_03_desc:1 "Bến cảng đã trở thành trung tâm giao thương và đi lại của khu vực. Tàu thuyền từ khắp dọc bờ biển đều đổ về đây buôn bán."
  building_common_tradeport_04:1 "Thợ đóng tàu"
  building_common_tradeport_04_desc:1 "Những thợ đóng tàu lành nghề tụ hội tại cảng này để đóng mới và sửa chữa tàu thuyền cho người trả giá cao nhất."
  building_common_tradeport_05:1 "Cầu cảng Mở rộng"
  building_common_tradeport_05_desc:2 "Nhiều cầu cảng hơn và lớn hơn hỗ trợ số lượng ngày càng tăng của các tàu buôn."
  building_common_tradeport_06:1 "Xưởng tàu"
  building_common_tradeport_06_desc: "Sự xuất hiện của các công trình chuyên biệt dành cho bảo trì tàu thuyền đánh dấu một bước ngoặt quan trọng, biến một bến cảng đơn sơ thành trung tâm quyền lực hàng hải sầm uất."
  building_common_tradeport_07:1 "Đại Cảng"
  building_common_tradeport_07_desc:2 "Đại cảng này cung cấp dồi dào cầu cảng, xưởng tàu và những thủy thủ giỏi nhất trong vùng. Mọi loại hàng hóa cần thiết cho các chuyến hải trình dài ngày đều có mặt tại đây, còn thương nhân, ngư dân và quân đội đều nhận được sự hỗ trợ đầy đủ."
  building_common_tradeport_08:1 "Ụ tàu khô"
  building_common_tradeport_08_desc:2 "Tại các ụ tàu khô, tàu được đưa vào một lối hẹp rồi rút cạn nước. Con tàu sau đó được kê trên các khối đá, cho phép việc sửa chữa và bảo trì diễn ra dễ dàng hơn nhiều."
  building_type_hall_of_heroes_01:0 "Đại sảnh Anh hùng"
  building_type_hall_of_heroes_01_desc:2 "Một đại sảnh uy nghi nơi các chiến binh anh hùng có thể tụ họp và tổ chức những cuộc phiêu lưu kế tiếp."
  building_hall_of_heroes_01:0 "Đại sảnh Anh hùng I"
  building_hall_of_heroes_01_desc:0 "$building_type_hall_of_heroes_01_desc$"
  building_hall_of_heroes_02:0 "Đại sảnh Anh hùng II"
  building_hall_of_heroes_02_desc:0 "$building_type_hall_of_heroes_01_desc$"
