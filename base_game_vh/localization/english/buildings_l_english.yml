  building_type_mali_mines_01:0 "Các mỏ vàng Mali"
  building_type_mali_mines_01_desc:0 "Các mỏ ở Mali thực sự tràn ngập vàng. Của cải vô tận tuôn chảy từ lòng đất vào kho bạc của các lãnh chúa địa phương, những người khoác lên mình thứ kim loại quý giá ấy."
