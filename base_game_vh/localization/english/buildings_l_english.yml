  building_type_special_sicilian_parliament_01:0 "Nghị viện"
  building_type_special_sicilian_parliament_01_desc:0 "$building_special_sicilian_parliament_01_desc$"
  building_special_sicilian_parliament_01:0 "Nghị viện"
  building_special_sicilian_parliament_01_desc:1 "Đại diện của Ba Đẳng cấp thường xuyên họp mặt tại tòa nhà này để bàn luận các vấn đề của vương quốc và đưa ra lời khuyên cho vị quân chủ đương nhiệm."
  building_special_greenhouse_01:0 "Công trình Kính"
  building_special_greenhouse_01_desc:0 "Công trình này tỏ ra đặc biệt thích hợp cho việc trồng trọt rau củ."
  building_type_special_greenhouse_01:0 "Công trình Kính"
  building_type_special_greenhouse_01_desc:1 "Công trình này tỏ ra đặc biệt thích hợp cho việc trồng trọt rau củ."
  building_type_university_01:0 "Đại học"
  building_type_university_01_desc:2 "Một nơi học vấn bậc cao dành cho những người có đủ ảnh hưởng và vàng bạc để được nhập học."
  building_university_01:0 "Đại học I"
  building_university_01_desc:0 "$building_type_university_01_desc$"
  building_university_02:0 "Đại học II"
  building_university_02_desc:0 "$building_type_university_01_desc$"
