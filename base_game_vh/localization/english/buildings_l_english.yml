  building_nishapur_mines_04_desc:0 "Việc khai thác ngọc lam đã đạt đến quy mô gần như công nghiệp, với số lượng công nhân lên tới hàng nghìn người. Của cải vô tận dường như tuôn trào từ các mỏ."
 
  building_type_verespatak_mines_01:0 "Các mỏ Verespatak"
  building_type_verespatak_mines_01_desc:0 "Transylvania đã được khai thác vàng từ trước thời La Mã và cho đến nay vẫn sẵn sàng để được tái khai thác bằng các phương pháp đương thời."
