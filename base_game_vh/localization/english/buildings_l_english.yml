  building_type_kaibao_mines_01:0 "Mỏ Kaibao"
  building_type_kaibao_mines_01_desc:0 "Trong một vùng đất luôn khát khao tiền tệ, nhu cầu về mỏ bạc chưa bao giờ ngừng. Vùng này đã cung cấp nguyên liệu cho xưởng đúc Hoàng triều qua nhiều thế hệ."
