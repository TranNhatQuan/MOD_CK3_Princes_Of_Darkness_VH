  building_type_hpakant_mines_01: "Các mỏ ngọc Hpakant"
  building_type_hpakant_mines_01_desc: "Ẩn sâu dưới những ngọn đồi rừng rậm, các mạch ngọc jadeite rực sáng lấp lánh giữa những con sông chằng chịt và các dãy đá vôi. Trong nhiều năm, những trữ lượng này bị che giấu khỏi người qua đường và thương nhân ngoại quốc, mang lại cho dân địa phương vô số khối đá xanh quý giá."
