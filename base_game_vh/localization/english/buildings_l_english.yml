  building_nishapur_mines_02:0 "Mỏ Nishapur"
  building_nishapur_mines_02_desc:1 "Các hố khai mỏ đã được mở rộng, và các kỹ sư được điều đến nhằm thực sự tăng mạnh sản lượng khai thác ngọc lam."
  building_nishapur_mines_03:0 "Mỏ Nishapur Lớn"
  building_nishapur_mines_03_desc:0 "Một ngôi làng đã hình thành quanh các hố khai mỏ, và những người thợ thường xuyên tìm thấy ngọc lam chất lượng cao."
