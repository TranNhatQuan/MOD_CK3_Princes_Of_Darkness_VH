  building_type_turda_mines_01:0 "Các mỏ muối Torda"
  building_type_turda_mines_01_desc:0 "Những khối muối khổng lồ của Torda đã là trụ cột của nền kinh tế Transylvania suốt nhiều thế kỷ. Các mỏ và thị trường muối vẫn là nguồn thu lớn của khu vực."
