  building_type_al_azhar_university_desc:0 "$building_type_generic_university_desc$\n\nĐại học Al-Azhar được đặt tên để tôn vinh Fatimah, con gái của Muhammad, người thường được gọi là 'al-Zahra' (Người Rực Sáng)."
