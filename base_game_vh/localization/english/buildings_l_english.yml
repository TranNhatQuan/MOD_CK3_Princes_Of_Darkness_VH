  building_type_phocaea_mines_01:0 "Các mỏ phèn Phocaea"
  building_type_phocaea_mines_01_desc:0 "Các trữ lượng phèn tại Phocaea thuộc hàng phong phú nhất trong thế giới đã biết. Loại khoáng vật hiếm này có nhu cầu rất cao đối với thợ nhuộm và các xưởng dệt khắp châu Âu."
