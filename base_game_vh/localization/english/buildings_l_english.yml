  building_type_powder_magazine_01: "Xưởng Sản Xuất Thuốc Súng"
  building_type_powder_magazine_01_desc: "Thuốc súng đòi hỏi quy trình sản xuất, lưu trữ và bảo trì chuyên biệt để hoạt động ổn định. Để có thể tuyển mộ [GetMaA('handgunners').GetName] và các đơn vị khác cần sức mạnh này, phải xây dựng các công trình chuyên dụng."
  building_powder_magazine_01: "Kho Thuốc Súng"
  building_powder_magazine_01_desc: "Những nhà kho nơi thuốc súng được bảo quản an toàn khỏi tác động của thời tiết nhằm giảm thiểu nguy cơ tai nạn."
  building_powder_magazine_02: "Nha Hậu Cần Thuốc Súng"
  building_powder_magazine_02_desc: "Tuyển dụng các quan chức giám sát lực lượng lao động chuyên xử lý hệ thống hậu cần phức tạp của thuốc súng sẽ đảm bảo việc lưu trữ đúng cách và vận chuyển an toàn khắp lãnh thổ."
  building_powder_magazine_03: "Mỏ Lưu Huỳnh"
  building_powder_magazine_03_desc: "Lưu huỳnh, đôi khi được gọi là đá lửa, tồn tại khá nhiều nhưng khó khai thác với số lượng lớn. Một mỏ chuyên dụng sẽ đảm bảo nguồn cung ổn định cho khoáng vật quý giá này."
  building_powder_magazine_04: "Xưởng Diêm Tiêu"
  building_powder_magazine_04_desc: "Là thành phần then chốt trong việc chế tạo thuốc súng, diêm tiêu đòi hỏi bàn tay lành nghề và môi trường kiểm soát chặt chẽ để có thể sản xuất với số lượng lớn mà không thiêu rụi toàn bộ công trình."
  building_powder_magazine_05: "Kho Đạn Dược"
  building_powder_magazine_05_desc: "Việc lưu trữ thuốc súng yêu cầu các công trình chuyên biệt với tường gia cố chắc chắn, được đặt cách xa khu dân cư và những địa điểm giá trị."
  building_powder_magazine_06: "Nhà Gác"
  building_powder_magazine_06_desc: "Thuốc súng vốn đã nguy hiểm, nhưng sẽ càng nguy hiểm hơn nếu rơi vào tay kẻ xấu. Một lực lượng lính canh đông đảo được triển khai để bảo vệ kho khỏi những con mắt tò mò."
  building_powder_magazine_07: "Xưởng Tinh Luyện Thuốc Súng"
  building_powder_magazine_07_desc: "Một công trình riêng biệt nơi các thành phần khác nhau được pha trộn để tạo ra thuốc súng. Nếu xảy ra tai nạn, hy vọng nó sẽ không phá hủy toàn bộ khu phức hợp."
  building_powder_magazine_08: "Xưởng Pháo Cầm Tay"
  building_powder_magazine_08_desc: "Pháo cầm tay có thể kém ổn định và dễ nứt vỡ khi sử dụng. Vì vậy, chúng ta phải trang bị công cụ tốt nhất và thuê những thợ thủ công lành nghề nhất để sản xuất vũ khí chất lượng cao."
  powder_magazine_1_effect_desc: "$unlocks_building_desc$Giới hạn tuyển mộ [men_at_arms|E] [gunpowder|E]: #P +[EmptyScope.ScriptValue('gunpowder_building_limit_bonus_1')|0]#!"
  powder_magazine_2_effect_desc: "$unlocks_building_desc$Giới hạn tuyển mộ [men_at_arms|E] [gunpowder|E]: #P +[EmptyScope.ScriptValue('gunpowder_building_limit_bonus_2')|0]#!"
  powder_magazine_3_effect_desc: "$unlocks_building_desc$Giới hạn tuyển mộ [men_at_arms|E] [gunpowder|E]: #P +[EmptyScope.ScriptValue('gunpowder_building_limit_bonus_3')|0]#!"
 
  building_type_mandala_capital_01: "Quần thể Đền Thủ đô"
  building_type_mandala_capital_01_desc: "Công trình [great_project|E] này không chỉ là một ngôi đền. Nó là minh chứng cho bản lĩnh, thành tựu và #EMP sự huy hoàng#! của chúng ta. Một ngôi đền như thế này tượng trưng cho quyền lực và lòng nhân từ của vị Devaraja thần thánh và hùng mạnh."
  building_mandala_capital_01: "Ngôi đền Trang trí Công phu"
  building_mandala_capital_01_desc: "Khởi đầu khiêm tốn cho một di sản vĩ đại, ngôi đền này là nơi thờ phụng và cầu nguyện Devaraja trị vì."
  building_mandala_capital_02: "Ngôi đền Uy nghi"
  building_mandala_capital_02_desc: "Ngôi đền thủ đô được mở rộng với nhiều điện thờ, trang trí và vật dụng hơn."
  building_mandala_capital_03: "Khuôn viên Đền"
  building_mandala_capital_03_desc: "Nhiều khu lưu trú được xây thêm, biến ngôi đền thành một quần thể đang phát triển.\nGiờ đây nơi này có nhiều điện thờ cùng chỗ ở cho tín đồ, tu sĩ và giáo sĩ."
  building_mandala_capital_04: "Quần thể Đền Vĩ đại"
  building_mandala_capital_04_desc: "Quần thể đền nay rộng bằng một ngôi làng nhỏ và gần như tự cung tự cấp.\nMột khu lưu giữ thánh tích và các hồ thiền trải dài đông–tây được bổ sung, tăng cường mối liên kết với cõi linh giới."
  building_mandala_capital_05: "Cung điện Đền Thần thánh"
  building_mandala_capital_05_desc: "Một kiệt tác kiến trúc hiếm thấy, cung điện đền được mở rộng với nơi ở lộng lẫy dành cho Devaraja thần thánh.\nĐài tưởng niệm, thánh tích, bảo vật — du khách từ khắp nơi đổ về chiêm ngưỡng sự xa hoa của cung điện đền này."

  building_type_wulingyuan_01: "$building_wulingyuan_01$"
  building_type_wulingyuan_01_desc: "$building_wulingyuan_01_desc$"
  building_wulingyuan_01: "Vũ Lăng Nguyên"
  building_wulingyuan_01_desc: "Dãy núi này có hàng nghìn cột đá sa thạch sừng sững vươn cao. Ngoài các trụ đá nổi bật, khu vực còn có khe núi, suối, hồ nhỏ và hang động."

  building_type_leshan_giant_buddha_01: "$building_leshan_giant_buddha_01$"
  building_type_leshan_giant_buddha_01_desc: "$building_leshan_giant_buddha_01_desc$"
  building_leshan_giant_buddha_01: "Đại Phật Lạc Sơn"
  building_leshan_giant_buddha_01_desc: "Được tạc vào vách đá, bức tượng Phật này nhìn ra nơi hợp lưu của sông Mân và Đại Độ, chào đón những lữ khách mệt mỏi."

  building_type_yungang_grottoes_01: "$building_yungang_grottoes_01$"
  building_type_yungang_grottoes_01_desc: "$building_yungang_grottoes_01_desc$"
  building_yungang_grottoes_01: "Hang đá Vân Cương"
  building_yungang_grottoes_01_desc: "Một quần thể hang động đền thờ lớn với hàng chục hang lớn và hàng trăm hang nhỏ, chứa vô số tượng Phật."

  building_type_wudang_mountain_temples_01: "$building_wudang_mountain_temples_01$"
  building_type_wudang_mountain_temples_01_desc: "$building_wudang_mountain_temples_01_desc$"
  building_wudang_mountain_temples_01: "Đền núi Võ Đang"
  building_wudang_mountain_temples_01_desc: "Núi Võ Đang là một trong những ngọn núi linh thiêng của Đạo giáo, đồng thời là nơi có quần thể đền nổi tiếng với việc luyện thái cực quyền."

  building_type_shaolin_monastery_01: "$building_shaolin_monastery_01$"
  building_type_shaolin_monastery_01_desc: "$building_shaolin_monastery_01_desc$"
  building_shaolin_monastery_01: "Thiếu Lâm Tự"
  building_shaolin_monastery_01_desc: "Thiếu Lâm Tự nổi tiếng là cái nôi của võ công Thiếu Lâm và các tăng nhân tinh thông võ thuật. Đây cũng là trung tâm học thuật và dịch kinh Phật."

  building_type_lingyin_temple_01: "$building_lingyin_temple_01$"
  building_type_lingyin_temple_01_desc: "$building_lingyin_temple_01_desc$"
  building_lingyin_temple_01: "Chùa Linh Ẩn"
  building_lingyin_temple_01_desc: "Được thành lập năm 328 bởi một nhà sư Ấn Độ, chùa Linh Ẩn phát triển mạnh mẽ với nhiều đình, hang động, tháp và đủ chỗ ở cho hàng nghìn tăng nhân."

  building_type_giant_wild_goose_pagoda_01: "$building_giant_wild_goose_pagoda_01$"
  building_type_giant_wild_goose_pagoda_01_desc: "$building_giant_wild_goose_pagoda_01_desc$"
  building_giant_wild_goose_pagoda_01: "Đại Nhạn Tháp"
  building_giant_wild_goose_pagoda_01_desc: "Ban đầu được xây năm 652 để lưu giữ kinh văn và thánh tích, ngôi tháp từng cao mười tầng trước khi được trùng tu xuống còn bảy tầng."

  building_type_kaifeng_palace_01: "$building_kaifeng_palace_01$"
  building_type_kaifeng_palace_01_desc: "$building_kaifeng_palace_01_desc$"
  building_kaifeng_palace_01: "Hoàng cung Khai Phong"
  building_kaifeng_palace_01_desc: "Hoàng cung Khai Phong được xây khi nhà Tống chọn nơi đây làm kinh đô, bảo đảm nền cai trị vững mạnh và hiệu quả."
  kaifeng_examination_cost_bonus_desc: "Chi phí cho [activity|E] [GetActivityType('activity_imperial_examination').GetTextIcon][GetActivityType( 'activity_imperial_examination').GetName] khi [barony|E] này là [realm_capital|E]: #P -[EmptyScope.ScriptValue('kaifeng_examination_cost_value')|%0]#!"
  kaifeng_palace_name_desc: "[GetBuilding('kaifeng_palace_01').GetName]"

  building_type_forbidden_city_01: "$building_forbidden_city_01$"
  building_type_forbidden_city_01_desc: "$building_forbidden_city_01_desc$"
  building_forbidden_city_01: "Tử Cấm Thành"
  building_forbidden_city_01_desc: "Tử Cấm Thành là một hoàng cung rộng lớn với gần một nghìn công trình, được bao bọc bởi tường cao và hào sâu bảo vệ triều đình."
  beijing_palace_bonus_desc: "[governor_efficiency|E] của [governors|E] khi [barony|E] này là [realm_capital|E]: @governor_efficiency!#P +[EmptyScope.ScriptValue('forbidden_city_bonus_value')]%#!"

  building_type_qianling_mausoleum_01: "$building_qianling_mausoleum_01$"
  building_type_qianling_mausoleum_01_desc: "$building_qianling_mausoleum_01_desc$"
  building_qianling_mausoleum_01: "Lăng Càn Lăng"
  building_qianling_mausoleum_01_desc: "Lăng Càn Lăng chủ yếu là nơi an táng Hoàng đế Cao Tông và Nữ hoàng Võ Tắc Thiên, ngoài ra còn có nhiều thành viên khác của họ Lý được chôn cất tại đây. Gò mộ được bao quanh bởi tường hình chữ nhật, cùng vô số tượng đá trang trí khắp cảnh quan, tạo nên những nét đặc trưng dễ nhận biết nhất của quần thể lăng mộ."

  building_type_quanzhou_seaport_01: "$building_quanzhou_seaport_01$"
  building_type_quanzhou_seaport_01_desc: "$building_quanzhou_seaport_01_desc$"
  building_quanzhou_seaport_01: "Cảng biển Tuyền Châu"
  building_quanzhou_seaport_01_desc: "Cảng Tuyền Châu thu hút thương nhân ngoại quốc từ khắp nơi trên thế giới. Các thương gia được biết đến là đến từ Ả Rập, Anatolia, Nhật Bản, Triều Tiên và nhiều vùng đất khác. Dòng tàu buôn tấp nập này giúp các ngành thủ công địa phương phát triển mạnh mẽ và đưa Tuyền Châu trở thành trung tâm đóng tàu hàng đầu của khu vực."

  building_type_angkor_wat_01: "$building_angkor_wat_01$"
  building_type_angkor_wat_01_desc: "$building_angkor_wat_01_desc$"
  building_angkor_wat_01: "Angkor Wat"
  building_angkor_wat_01_desc: "Angkor Wat là một quần thể đền đài khổng lồ thờ thần Vishnu. Công trình được thiết kế như hình ảnh thu nhỏ của núi Meru – nơi cư ngụ của các vị thần trong thần thoại Hindu. Toàn bộ quần thể được bao quanh bởi hào nước đồ sộ, cùng nhiều đền tháp hành lang tràn ngập nghệ thuật tôn giáo, điêu khắc và phù điêu."

  building_type_citadel_thang_long_01: "Thành Thăng Long"
  building_type_citadel_thang_long_01_desc: "$building_citadel_thang_long_01_desc$"
  building_citadel_thang_long_01: "Thành Đại La"
  building_citadel_thang_long_01_desc: "Một tòa thành đóng vai trò căn cứ quân sự cho lực lượng địa phương, được gia cố kiên cố nhằm ngăn chặn các cuộc xâm lược."
  building_citadel_thang_long_02: "Hoàng thành Thăng Long"
  building_citadel_thang_long_02_desc: "Hoàng thành vừa là pháo đài vừa là nơi ở của hoàng gia. Quần thể thành gồm ba khu vực: thành lũy chính, kinh thành và Cấm thành."

  building_type_po_klong_garai_01: "$building_po_klong_garai_01$"
  building_type_po_klong_garai_01_desc: "$building_po_klong_garai_01_desc$"
  building_po_klong_garai_01: "Đền Po Klong Garai"
  building_po_klong_garai_01_desc: "Đỉnh cao của kiến trúc Chăm Pa, đền Po Klong Garai được cho là xây dựng để tôn vinh vị vua huyền thoại cùng tên. Công trình gồm ba tháp gạch riêng biệt và nổi bật với tượng thần Shiva đồ sộ làm tác phẩm nghệ thuật trung tâm."

  building_type_dau_temple_01: "$building_dau_temple_01$"
  building_type_dau_temple_01_desc: "$building_dau_temple_01_desc$"
  building_dau_temple_01: "Chùa Dâu"
  building_dau_temple_01_desc: "Ngôi chùa linh thiêng tại Luy Lâu, đánh dấu nơi các nhà sư từ phương xa lần đầu hội tụ. Tháp gạch, xá lợi và các nhục thân còn lại tại đây là minh chứng cho nhiều thế kỷ sùng kính Phật giáo."

  building_type_liuhe_pagoda_01: "$building_liuhe_pagoda_01$"
  building_type_liuhe_pagoda_01_desc: "$building_liuhe_pagoda_01_desc$"
  building_liuhe_pagoda_01: "Chùa Lục Hợp"
  building_liuhe_pagoda_01_desc: "Một ngôi chùa tháp cao lớn được các vị vua xây dựng nhằm trấn an thủy triều và tôn vinh Đức Phật. Ánh đèn từ tháp soi rọi khắp vùng đất, tượng trưng cho sự hài hòa giữa con người và Thiên giới."

  building_type_muaro_jambi_01: "$building_muaro_jambi_01$"
  building_type_muaro_jambi_01_desc: "$building_muaro_jambi_01_desc$"
  building_muaro_jambi_01: "Quần thể Muaro Jambi"
  building_muaro_jambi_01_desc: "Nằm dọc theo sông Batang Hari, các quần thể gạch rộng lớn của Muaro Jambi bảo vệ cả thương mại lẫn tín ngưỡng. Là một thành trì của Srivijaya, nơi đây từng che chở cho các vị vua và huy động quân đội trong vùng trung tâm Sumatra."

  building_type_hanging_temple_01: "$building_hanging_temple_01$"
  building_type_hanging_temple_01_desc: "$building_hanging_temple_01_desc$"
  building_hanging_temple_01: "Chùa Treo"
  building_hanging_temple_01_desc: "Chùa Treo là một tu viện bám vào vách đá núi Hằng Sơn. Theo truyền thuyết, công trình được khởi dựng bởi nhà sư Liễu Nhiên. Các điện gỗ dựng trên cột chống thờ Phật, Đạo và Nho, hòa trộn tín ngưỡng và thách thức trọng lực bằng vẻ thanh tao."

  building_type_pagoda_of_fogong_temple_01: "$building_pagoda_of_fogong_temple_01$"
  building_type_pagoda_of_fogong_temple_01_desc: "$building_pagoda_of_fogong_temple_01_desc$"
  building_pagoda_of_fogong_temple_01: "Tháp chùa Phật Cung"
  building_pagoda_of_fogong_temple_01_desc: "Tháp chùa Phật Cung là một bảo tháp gỗ cao lớn được xây dựng không dùng đinh. Cao chín tầng, tháp lưu giữ thánh tích và tượng linh thiêng, với thiết kế tinh xảo vẫn được xem là kỳ tích kỹ thuật và biểu tượng của đức tin."

  building_type_plain_of_jars_01: "$building_plain_of_jars_01$"
  building_type_plain_of_jars_01_desc: "$building_plain_of_jars_01_desc$"
  building_plain_of_jars_01: "Cánh đồng Chum Đá"
  building_plain_of_jars_01_desc: "Cánh đồng Chum Đá là một cao nguyên rộng lớn rải rác những chum đá khổng lồ, mục đích sử dụng vẫn còn là điều bí ẩn. Từng phục vụ các nghi lễ cổ xưa, chúng tồn tại như di tích của một dân tộc đã mất, khơi gợi sự kính sợ và tôn nghiêm địa phương."

  building_type_dieng_plateau_01: "$building_dieng_plateau_01$"
  building_type_dieng_plateau_01_desc: "$building_dieng_plateau_01_desc$"
  building_dieng_plateau_01: "Cao nguyên Dieng"
  building_dieng_plateau_01_desc: "Cao nguyên Dieng là một lòng chảo núi lửa phủ sương mù, nơi các hồ lưu huỳnh và miệng phun khí nằm rải rác. Những ngôi đền cổ và truyền thuyết nghi lễ khiến nơi đây vừa đáng sợ vừa linh thiêng – một vùng cao thánh địa nơi các vị thần cổ đại từng ngự trị."

  building_type_mount_apo_01: "$building_mount_apo_01$"
  building_type_mount_apo_01_desc: "$building_mount_apo_01_desc$"
  building_mount_apo_01: "Núi Apo"
  building_mount_apo_01_desc: "Vươn cao trên hồ Venado, tên gọi Apo có nghĩa là “bậc trưởng lão được tôn kính” trong các ngôn ngữ Lumad. Đây là dạng rút gọn của Apo Sandawa – linh hồn của ngọn núi thiêng, còn được gọi là “Cụ Sandawa”. Các nghi lễ dành cho Apo Sandawa do pháp sư bộ tộc thực hiện, như cầu nối với linh hồn tổ tiên."

  building_type_besakih_temple_01: "$building_besakih_temple_01$"
  building_type_besakih_temple_01_desc: "$building_besakih_temple_01_desc$"
  building_besakih_temple_01: "Đền Besakih"
  building_besakih_temple_01_desc: "Được mệnh danh là “Đền Mẹ của Bali”, Besakih là quần thể đền Hindu linh thiêng và quan trọng nhất của hòn đảo. Nằm trên sườn núi Agung – ngọn núi lửa cao và thiêng nhất Bali – nơi đây là trung tâm tôn giáo và văn hóa, tổ chức các nghi lễ trọng đại cho toàn đảo."

  building_type_gongsanseong_fortress_01: "$building_gongsanseong_fortress_01$"
  building_type_gongsanseong_fortress_01_desc: "$building_gongsanseong_fortress_01_desc$"
  building_gongsanseong_fortress_01: "Pháo thành Gongsanseong"
  building_gongsanseong_fortress_01_desc: "Pháo thành Gongsanseong ngự trên đồi cao phía trên sông Geum. Được xây dựng làm hoàng thành của vương quốc Baekje, những bức tường dài và cổng đá kiên cố đã bảo vệ cả vua lẫn thần dân – một thành trì núi non của quyền lực và phòng thủ."

  building_type_krakatoa_01: "$building_krakatoa_01$"
  building_type_krakatoa_01_desc: "$building_krakatoa_01_desc$"
  building_krakatoa_01: "Krakatoa"
  building_krakatoa_01_desc: "Krakatoa là một ngọn núi lửa hùng vĩ nằm trên quần đảo nhỏ ngoài khơi bờ biển."

  building_type_borobudur_01: "$building_borobudur_01$"
  building_type_borobudur_01_desc: "$building_borobudur_01_desc$"
  building_borobudur_01: "Borobudur"
  building_borobudur_01_desc: "Borobudur là một ngôi đền Phật giáo khổng lồ gồm chín tầng đá xếp chồng lên nhau, trên cùng là một bảo tháp trung tâm. Công trình được trang trí bằng hàng nghìn phù điêu và hàng trăm tượng Phật."

  building_type_hoshi_ryokan_01: "$building_hoshi_ryokan_01$"
  building_type_hoshi_ryokan_01_desc: "$building_hoshi_ryokan_01_desc$"
  building_hoshi_ryokan_01: "Hōshi Ryokan"
  building_hoshi_ryokan_01_desc: "Hōshi Ryokan là một lữ quán truyền thống lâu đời, được vận hành như một gia nghiệp. Nơi đây mang đến cho lữ khách chốn nghỉ ngơi, ẩm thực và cơ hội tắm suối nước nóng trên hành trình của mình."
 
  building_type_celestial_great_barracks_01: "$building_celestial_great_barracks_01$"
  building_type_celestial_great_barracks_01_desc: "$building_celestial_great_barracks_01_desc$"
  building_celestial_great_barracks_01: "Đại Doanh Trại"
  building_celestial_great_barracks_01_desc: "Doanh trại và pháo đài khổng lồ này cung cấp binh lính cho tổng trấn địa phương nhằm tăng cường quân đội, đồng thời cải thiện đáng kể khả năng phòng thủ của khu vực."
  celestial_great_barracks_enabled_desc: "[holder.GetShortUIName|U] không phải là một [governor|E] quân sự"
  celestial_great_barracks_effect_desc: "[governor_efficiency|E]: @governor_efficiency!#P +[EmptyScope.ScriptValue('great_barracks_bonus_value')]%#!"
 
  building_type_the_great_wall_01: "$building_the_great_wall_01$"
  building_type_the_great_wall_01_desc: "$building_the_great_wall_01_desc$"
  building_the_great_wall_01: "Vạn Lý Trường Thành"
  building_the_great_wall_01_desc: "Đây là phần cổ xưa nhất của Vạn Lý Trường Thành, chủ yếu được xây dựng dưới triều Tần. Dù cát bụi thời gian đã bào mòn đá, gạch và vữa, công trình này vẫn là một tuyến phòng thủ vô cùng đáng gờm."
  building_type_the_great_wall_02: "$building_the_great_wall_01$"
  building_type_the_great_wall_02_desc: "$building_the_great_wall_02_desc$"
  building_the_great_wall_02: "Vạn Lý Trường Thành"
  building_the_great_wall_02_desc: "Nhà Hán đã mở rộng đáng kể các đoạn tường thành do tiền triều xây dựng. Họ kiến tạo nên nhiều đoạn trường thành quy mô lớn, kéo dài hàng trăm dặm xuyên qua sa mạc và núi non."
  building_type_the_great_wall_03: "$building_the_great_wall_01$"
  building_type_the_great_wall_03_desc: "$building_the_great_wall_03_desc$"
  building_the_great_wall_03: "Vạn Lý Trường Thành"
  building_the_great_wall_03_desc: "Trong thế kỷ V và VI, các triều đại Ngụy, Tề và Tùy đều tiếp tục gia cố trường thành, nâng cấp nhiều đoạn bằng các công sự phòng thủ kiên cố hơn."
  building_type_the_great_wall_04: "$building_the_great_wall_01$"
  building_type_the_great_wall_04_desc: "$building_the_great_wall_04_desc$"
  building_the_great_wall_04: "Vạn Lý Trường Thành"
  building_the_great_wall_04_desc: "Một kỳ tích kỹ thuật vĩ đại, bức tường khổng lồ này đã được mở rộng nhiều lần kể từ khi khởi công vào thế kỷ VII TCN. Nay nó trải dài hàng nghìn dặm, bao gồm vô số tháp canh, doanh trại và đồn trú. Chắc hẳn không một kẻ xâm lăng man di nào có thể vượt qua được chướng ngại hùng vĩ này?"
  building_type_the_great_wall_shanhai_pass: "$building_the_great_wall_01$"
  building_type_the_great_wall_shanhai_pass_desc: "$building_the_great_wall_04_desc$"
  building_the_great_wall_shanhai_pass: "$building_the_great_wall_04$"
  building_the_great_wall_shanhai_pass_desc: "$building_the_great_wall_04_desc$"
  building_type_the_great_wall_liaodong: "$building_the_great_wall_01$"
  building_type_the_great_wall_liaodong_desc: "$building_the_great_wall_04_desc$"
  building_the_great_wall_liaodong: "$building_the_great_wall_04$"
  building_the_great_wall_liaodong_desc: "$building_the_great_wall_04_desc$"

  special_building_improve_silk_road: "Khi [special_building|E] này được hoàn thành, nó sẽ đưa [situation_sub_region|E] [sub_region_temp.GetName] tiến gần hơn tới [situation_phase|E] [silk_road|E] [situation_silk_road_phase_exceptional_bounty|E] #weak (nếu chưa đạt tới)#!"

  building_type_herat_bazaar_01: "$building_herat_bazaar_01$"
  building_type_herat_bazaar_01_desc: "$building_herat_bazaar_01_desc$"
  building_herat_bazaar_01: "Chợ Herat"
  building_herat_bazaar_01_desc: "Những khu chợ sầm uất của Herat đã nổi danh từ thời Achaemenid cổ đại, khi nơi này được gọi là #italic Haraiva#!. Những đoàn lữ hành ra vào thành phố mỗi ngày đã khiến chợ Herat được mệnh danh là Viên Ngọc của Khorasan."
  building_herat_bazaar_02: "Chợ Herat Mở Rộng"
  building_herat_bazaar_02_desc: "Các khu chợ Herat tràn ngập giao thương và buôn bán. Viên Ngọc của Khorasan nay tỏa sáng còn rực rỡ hơn cả viên bảo thạch được mài giũa kỹ nhất trên vương miện."

  building_type_dvin_shuka_01: "$building_dvin_shuka_01$"
  building_type_dvin_shuka_01_desc: "$building_dvin_shuka_01_desc$"
  building_dvin_shuka_01: "Chợ Shuka của Dvin"
  building_dvin_shuka_01_desc: "Khu chợ cổ kính của Dvin từ lâu đã là trung tâm thương mại lớn của Armenia. Những bức tường được trang trí bằng gạch men sặc sỡ và lớp trát nhuộm màu, phản chiếu sự giàu có và uy danh của khu chợ cổ này."
  building_dvin_shuka_02: "Chợ Shuka Dvin Mở Rộng"
  building_dvin_shuka_02_desc: "Thời gian không hề làm suy giảm sức sống của khu chợ cổ kính Dvin — trái lại, chợ shuka venerable này dường như còn sôi động hơn bao giờ hết."

  building_type_khiva_bazaar_01: "$building_khiva_bazaar_01$"
  building_type_khiva_bazaar_01_desc: "$building_khiva_bazaar_01_desc$"
  building_khiva_bazaar_01: "Chợ Khiva"
  building_khiva_bazaar_01_desc: "Là cửa ngõ tiến vào thảo nguyên, thành phố nhỏ Khiva nổi bật với số lượng thương nhân và lữ khách đông đảo, những người tìm kiếm lợi nhuận hoặc vận may nơi biên cương."
  building_khiva_bazaar_02: "Chợ Khiva Mở Rộng"
  building_khiva_bazaar_02_desc: "Dưới ánh mặt trời cháy bỏng, dân du mục, thương nhân và kẻ phiêu lưu tìm kiếm vận may, trao đổi những lời thì thầm về sự giàu có của phương Đông xa xôi cùng những đồng tiền ngoại lai của Hoàng Đế."

  building_type_lhasa_market_01: "$building_lhasa_market_01$"
  building_type_lhasa_market_01_desc: "$building_lhasa_market_01_desc$"
  building_lhasa_market_01: "Chợ Khrom của Lhasa"
  building_lhasa_market_01_desc: "Tọa lạc tại giao lộ trọng yếu giữa Ấn Độ và Trung Hoa, các thương nhân Lhasa chen chúc mời chào lữ khách dưới bóng cung điện Potala sừng sững."
  building_lhasa_market_02: "Chợ Khrom Lhasa Mở Rộng"
  building_lhasa_market_02_desc: "Theo lời các thương nhân Lhasa, chẳng còn thứ gì mới mẻ dưới ánh mặt trời — bởi không có món trang sức hay bảo vật nào mà chúng chưa từng đi dọc theo Con Đường Tơ Lụa này."

  building_type_changan_market_01: "$building_changan_market_01$"
  building_type_changan_market_01_desc: "$building_changan_market_01_desc$"
  building_changan_market_01: "Chợ Trường An"
  building_changan_market_01_desc: "Các khu chợ của đại đô thị Trường An, #EMP Trường Trị Cửu An#!, nhộn nhịp với đủ mọi loại hàng hóa và là điểm dừng thiết yếu của gần như mọi tuyến thương mại ra vào Trung Hoa."
  building_changan_market_02: "Chợ Trường An Mở Rộng"
  building_changan_market_02_desc: "Những thương nhân giàu có của Trường An không còn ngạc nhiên trước các bảo vật vĩ đại nhất nhân gian — bởi họ đã thấy tất cả, và có lẽ còn sở hữu không ít."

  building_type_dunhuang_market_01: "$building_dunhuang_market_01$"
  building_type_dunhuang_market_01_desc: "$building_dunhuang_market_01_desc$"
  building_dunhuang_market_01: "Chợ Đôn Hoàng"
  building_dunhuang_market_01_desc: "Nằm bên bờ lấp lánh của sông Shule, thành Đôn Hoàng đánh dấu cửa ngõ giữa Hành Lang Hà Tây và lưu vực Tarim, là điểm dừng chân trọng yếu của mọi lữ khách qua lại."
  building_dunhuang_market_02: "Chợ Đôn Hoàng Mở Rộng"
  building_dunhuang_market_02_desc: "Những con phố cháy nắng của Đôn Hoàng chỉ quen với bước chân chậm rãi bất tận của lạc đà, la và con người, lặng lẽ băng qua nhau trên hành trình đông – tây."

  building_type_lahur_bazaar_01: "$building_lahur_bazaar_01$"
  building_type_lahur_bazaar_01_desc: "$building_lahur_bazaar_01_desc$"
  building_lahur_bazaar_01: "Chợ Lahur"
  building_lahur_bazaar_01_desc: "Khu phố cổ Lahur được hình thành quanh hai khu chợ lớn, bao bọc bởi nhà cửa và tường đất dài. Cụm chợ sôi động này đã nhộn nhịp suốt bao đời và hẳn sẽ còn tiếp tục như vậy trong nhiều thế hệ."
  building_lahur_bazaar_02: "Chợ Lahur Mở Rộng"
  building_lahur_bazaar_02_desc: "Thương mại chảy qua Lahur tự nhiên như dòng nước theo lòng sông. Các khu chợ chen chúc hàng hóa, còn ánh mắt sắc sảo của thương nhân dường như ẩn chứa toàn bộ trí tuệ của lịch sử thành phố."

  building_type_hamadan_bazaar_01: "Chợ Hamadan"
  building_type_hamadan_bazaar_01_desc: "$building_hamadan_bazaar_01_desc$"
  building_hamadan_bazaar_01: "Chợ Hamadan"
  building_hamadan_bazaar_01_desc: "Là trung tâm của người Media cổ đại, Hamadan đã là đầu mối thương mại từ thời bảng đất sét và chữ hình nêm. Hàng trăm thế hệ thương nhân đã buôn bán và rèn nghề giữa các quầy sạp của chợ chính Hamadan."
  building_hamadan_bazaar_02: "Chợ Hamadan Mở Rộng"
  building_hamadan_bazaar_02_desc: "Khu chợ lớn của Hamadan chưa bao giờ thịnh vượng đến thế, đạt tới đỉnh cao giàu có và sôi động chưa từng có trong lịch sử lâu đời và trang nghiêm của nó."

  building_type_sunday_bazaar_01: "Chợ Chủ Nhật"
  building_type_sunday_bazaar_01_desc: "$building_sunday_bazaar_01_desc$"
  building_sunday_bazaar_01: "Chợ Chủ Nhật"
  building_sunday_bazaar_01_desc: "Một số người địa phương nói rằng ngay cả trước khi có tiền tệ, Kashgar đã có Chợ Chủ Nhật. Dạo bước giữa các quầy sạp, người ta khó mà tưởng tượng được một thời đại không có nơi này."
  building_sunday_bazaar_02: "Chợ Chủ Nhật Mở Rộng"
  building_sunday_bazaar_02_desc: "Dù Chợ Chủ Nhật của Kashgar đã tồn tại từ thuở hồng hoang, sự phồn thịnh hiện tại chắc chắn sẽ còn được nhắc đến trong nhiều thế hệ."
 
  building_type_mount_fuji_01: "Núi Phú Sĩ"
  building_type_mount_fuji_01_desc: "Đỉnh Phú Sĩ đơn độc, cao vút và phủ tuyết trắng đánh dấu lối vào miền đông Nhật Bản, là cảnh tượng lừng danh khắp quần đảo, thu hút lữ khách và tín đồ hành hương, mang lại sự an nhiên cho mọi ánh nhìn. Là một trong những ngọn núi Thần đạo linh thiêng nhất, Phú Sĩ là nơi ngự trị của #EMP Konohanasakuya-hime#! — nữ thần núi lửa, hoa anh đào và vẻ mong manh của sự sống."
  building_mount_fuji_01: "$building_type_mount_fuji_01$"
  building_mount_fuji_01_desc: "$building_type_mount_fuji_01_desc$"

  building_type_waterworks_01: "Quản Lý Thủy Lợi"
  building_type_waterworks_01_desc: "Nước là nền tảng của mọi sự sống. Duy trì nguồn nước ổn định và sử dụng hiệu quả là yếu tố cốt lõi để bảo vệ một lãnh thổ vững mạnh và một triều đại bền lâu."
  building_waterworks_01: "Ao Nhân Tạo"
  building_waterworks_01_desc: "Bước đầu của quản lý nước là phải có nước để quản lý. Một hố đất đơn giản, được trát đất sét để giữ nước, sẽ tạo thành nơi tích trữ nước tự nhiên cho sử dụng về sau."
  building_waterworks_02: "Bể Chứa Nước"
  building_waterworks_02_desc: "Những hố sâu hơn, lớp lót kín hơn và mái che đơn giản giúp tích trữ nhiều nước hơn trong thời gian dài, giảm thất thoát do ô nhiễm hoặc bay hơi."
  building_waterworks_03: "Kênh Dẫn Cân Bằng"
  building_waterworks_03_desc: "Đào kênh nối các khu chứa nước giúp nước được phân phối dễ dàng đến nhiều người hơn. Điều này giảm áp lực lũ lụt khi nước dư thừa, đồng thời vẫn cung cấp nước cho dân cư, gia súc và mùa màng trong hạn hán. Nếu được quy hoạch hợp lý, kênh còn có thể phục vụ giao thông đường thủy nhẹ."
  building_waterworks_04: "Hồ Chứa Thủy Lợi"
  building_waterworks_04_desc: "Bất kỳ đồi dốc hay sự chênh lệch địa hình nào cũng có thể trở thành nơi trữ nước nếu được đắp bờ đúng cách. Được nối bằng kênh, các hồ chứa lộ thiên này cho phép kiểm soát lượng nước trữ và sử dụng hiệu quả hơn."
  building_waterworks_05: "Giếng Bậc Thang"
  building_waterworks_05_desc: "Quản lý nước kết hợp với kỹ thuật đào giếng tạo nên những công trình đồ sộ dưới lòng đất, luôn có nguồn nước tự nhiên. Các công trình này vẫn có thể nối với cống và kênh trên mặt đất để dẫn nước vào hoặc thoát nước đi khi cần."
  building_waterworks_06: "Cống Điều Tiết"
  building_waterworks_06_desc: "Độ sâu của dòng nước có thể được kiểm soát bằng cửa chắn và hệ thống thoát. Nước tích trữ phía sau các cống này giúp kênh đào trở thành tuyến giao thông cho xà lan và thuyền nhỏ."
  building_waterworks_07: "Hồ Nhân Tạo"
  building_waterworks_07_desc: "Một hồ chứa khổng lồ có thể tích trữ lượng nước khổng lồ. Được cấp nước từ sông và kênh, hồ nhân tạo nuôi sống cánh đồng rộng lớn và vô số làng mạc, đồng thời trở thành công trình uy nghi phục vụ tín ngưỡng và quyền lực."
  building_waterworks_08: "Hệ Thống Cấp Nước và Thoát Thải"
  building_waterworks_08_desc: "Với ống dẫn và máy bơm, nước có thể chảy lên cao hoặc xuống thấp, cấp nước cho tháp cao nhất và cuốn trôi chất thải ra xa. Không nơi nào thiếu nước, và nước dư thừa sẽ được tiêu thoát trước khi trở thành lũ lụt nguy hiểm."

  building_type_spice_plantation_01: "Đồn Điền Gia Vị"
  building_type_spice_plantation_01_desc: "Những hương thơm tinh tế và hương vị đặc biệt nhất chỉ có thể chiết xuất từ các loài cây mọc ở những vùng rất đặc thù. Sự khan hiếm và chất lượng cao khiến chúng trở thành mặt hàng sinh lợi vượt trội, nếu thổ nhưỡng có thể nuôi dưỡng."
  building_spice_plantation_01: "Thu Hái Gia Vị"
  building_spice_plantation_01_desc: "Gia vị được tạo ra tự nhiên từ nhiều loại cây, bụi và hoa. Vấn đề then chốt là #italic tìm#! ra chúng."
  building_spice_plantation_02: "Vườn Gia Vị Canh Tác"
  building_spice_plantation_02_desc: "Những loại gia vị được săn đón nhất có thể được trồng trọt nếu hội đủ điều kiện, nhân lực và sự giám sát thích hợp."
  building_spice_plantation_03: "Trang Trại Gia Vị"
  building_spice_plantation_03_desc: "Trồng trọt theo quy hoạch hình học trên diện tích lớn giúp sản lượng gia vị ổn định, năm này qua năm khác."
  building_spice_plantation_04: "Sấy Gia Vị"
  building_spice_plantation_04_desc: "Dành không gian gần ruộng trồng để sấy gia vị trước khi vận chuyển giúp xử lý được nhiều sản phẩm hơn trước khi hư hỏng, giảm chi phí tổng thể."
  building_spice_plantation_05: "Cối Xay Gia Vị"
  building_spice_plantation_05_desc: "Xay nghiền có thể khiến gia vị dễ hỏng hơn, nhưng lại giúp lưu trữ hiệu quả hơn. Các cối xay cũng hỗ trợ sàng lọc, cho ra sản phẩm tinh khiết hơn."
  building_spice_plantation_06: "Điền Trang Gia Vị"
  building_spice_plantation_06_desc: "Tập trung khu ở công nhân, chế biến và kho trữ gần vùng trồng giúp sản xuất và tiêu thụ gia vị hiệu quả hơn với chi phí thấp hơn."
  building_spice_plantation_07: "Quản Lý Đất Đồn Điền"
  building_spice_plantation_07_desc: "Bản thân đất đai có thể được cải tạo để mở rộng diện tích canh tác. Ruộng bậc thang và kênh dẫn tạo cơ hội cho nhiều vụ mùa hơn."
  building_spice_plantation_08: "Sản Xuất Gia Vị Công Nghiệp"
  building_spice_plantation_08_desc: "Với định hướng đúng đắn, toàn bộ vùng đất có thể dồn cho việc sản xuất các loại gia vị sinh lợi nhất. Mỗi cây trồng, mỗi lá hái, mỗi hạt sấy khô đều biến thành vàng bạc trong quốc khố."

  building_type_examination_hall_01: "Sảnh Khảo Thí"
  building_type_examination_hall_01_desc: "Các kỳ khoa cử của triều đình không thể được tổ chức nếu không có địa điểm thích hợp. Quan trấn địa phương có trách nhiệm bảo đảm các quan chức có đầy đủ nguồn lực để tiến hành khảo thí một cách nghiêm chỉnh, đồng thời bảo đảm sĩ tử được hỗ trợ cần thiết trong khi giảm thiểu tối đa cơ hội gian lận."
  building_examination_hall_01: "Phòng Khảo Thí"
  building_examination_hall_01_desc: "Để khảo hạch ứng viên cho các chức vụ quan lại, cần có nơi tiến hành thi cử. Một căn phòng chuyên dụng cho việc dự thi là yêu cầu tối thiểu, nhưng đó là bước khởi đầu cần thiết."
  building_examination_hall_02: "Văn Võ Miếu"
  building_examination_hall_02_desc: "Đôi khi chỉ một lời cầu nguyện cũng có thể mang lại cho sĩ tử nhiều sự tự tin hơn cả quá trình học tập và chuẩn bị gian khổ."
  building_examination_hall_03: "Quốc Tử Giám"
  building_examination_hall_03_desc: "Một quần thể gồm giảng đường, cơ sở khảo thí, phòng làm việc của học quan và kho lưu trữ, cung cấp sự hỗ trợ toàn diện cần thiết để tổ chức mọi khâu của khoa cử triều đình với hiệu quả và chất lượng cao nhất."
  examination_hall_effects_desc: "[SelectLocalization( HasDlcFeature( 'all_under_heaven' ), 'examination_hall_effect_desc', 'examination_hall_cost_discount_max_desc' )]"
  examination_hall_effect_desc: "Giảm chi phí cho [GetActivityType('activity_imperial_examination').GetTextIcon][GetActivityType('activity_imperial_examination').GetName] và [GetActivityType('activity_local_examination').GetTextIcon][GetActivityType('activity_local_examination').GetName] [activities|E] được tổ chức tại [holding|E] này: [EmptyScope.ScriptValue('imperial_examination_cost_discount_max_value')|P0%]"
  examination_hall_cost_discount_max_desc: "$examination_hall_effect_desc$[EmptyScope.ScriptValue('imperial_examination_cost_discount_max_value')|P0%]"
  imperial_examination_cost_discount_examination_hall: "Địa điểm có $building_type_examination_hall_01$"

  building_can_benefit_requirements: "#S Nếu đáp ứng các yêu cầu:#!\n"
  rebuilding_grants_full_benefits: "#S Sau khi [rebuilding|El]:#!\n"
  building_requirements_header: "#S Yêu cầu:#!\n"
  building_fallback: "#S Nếu không đáp ứng các yêu cầu:#!\n"
  building_effects_header: "#S Hiệu ứng:#!\n"

  building_type_citadel_shrine_01: "Đền Thánh Thành Lũy"
  building_type_citadel_shrine_01_desc: "Một $building_type_temple_citadel_01$ sẽ không trọn vẹn nếu thiếu nơi thờ phụng các vị thần hộ mệnh. Dù là dân thường hay binh lính đồn trú, sự linh thiêng tỏa ra từ những bức tường này đều có thể xoa dịu mọi tâm hồn bất an."
  building_citadel_shrine_01: "Tháp Prasada"
  building_citadel_shrine_01_desc: "Tháp Prasada vươn cao trên $building_type_temple_citadel_01$, khắc họa một dáng hình uy nghi từ xa, cho phép các tín đồ chiêm bái ngôi đền ngay cả từ khoảng cách xa."
  building_citadel_shrine_02: "Tháp Prang"
  building_citadel_shrine_02_desc: "Ngập tràn những hoa văn chạm khắc tinh xảo, tháp Prang vươn lên theo những tầng kết cấu liên tiếp, gia tăng ấn tượng về chiều cao. Đây là cảnh tượng làm dịu mắt trong lúc những lời cầu nguyện được cất lên, dù thành tiếng hay trong tĩnh lặng chiêm niệm."
  building_citadel_shrine_03: "Tượng Thánh"
  building_citadel_shrine_03_desc: "Những bức tượng này vĩnh viễn hướng ánh nhìn vào cõi hư vô, suy tư về vĩnh hằng và thường khơi dậy nhiều cảm xúc sâu sắc trong lòng các tín đồ."
  building_citadel_shrine_04: "Tượng Sư Tử Singha"
  building_citadel_shrine_04_desc: "Với nụ cười nhe nanh và ánh mắt dữ tợn, những sư tử hộ vệ hung mãnh này ban phúc lành bảo hộ cho cư dân của $building_type_temple_citadel_01$."
  building_citadel_shrine_05: "Hộ Vệ Nāga"
  building_citadel_shrine_05_desc: "Được chế tác cẩn thận từ sa thạch, với mandala chạm khắc tinh xảo trên ngực, những linh xà bảy đầu này mang đến hòa bình và thịnh vượng cho cư dân của ngôi đền."
  building_citadel_shrine_06: "Phù Điêu"
  building_citadel_shrine_06_desc: "Người dân thường dừng chân để chiêm ngưỡng những chi tiết tinh vi của các bức phù điêu, khi chúng khắc họa những thời kỳ chiến tranh khốc liệt cũng như các tầng cõi thần linh và thần thoại khai thiên lập địa."
  building_citadel_shrine_07: "Thánh Tích Thất"
  building_citadel_shrine_07_desc: "Là kho tàng chứa vô số tượng thánh và pháp khí nghi lễ, $building_type_temple_citadel_01$ này sở hữu bộ sưu tập đồ sộ hơn bất kỳ nơi nào khác."
  building_citadel_shrine_08: "Thánh Tượng Devaraja"
  building_citadel_shrine_08_desc: "Đấng Thần Linh được khắc họa trong tư thế uy nghi, bất động cùng thời gian, cho phép các tín đồ cầu nguyện và dâng lễ để nhận được phúc lành."

  building_type_sacred_pool_01: "Hồ Linh Thiêng"
  building_type_sacred_pool_01_desc: "Một vùng nước rộng lớn như vậy có thể phục vụ nhiều mục đích khác nhau; nhưng theo thời gian và sự chuyển mùa, những hiện tượng thị giác phản chiếu trên mặt hồ đôi lúc trở nên siêu phàm. Vừa là nguồn phòng thủ vừa cung cấp nước, những hồ này đóng vai trò quan trọng trong đời sống thường nhật của cư dân."
  building_sacred_pool_01: "Ao Sen"
  building_sacred_pool_01_desc: "Một ao nước hài hòa, làm say lòng người chiêm ngưỡng bởi vẻ đẹp và sự tĩnh lặng, được cho là nơi diễn ra những sự kiện tâm linh trọng đại."
  building_sacred_pool_02: "Hồ Chứa Thánh"
  building_sacred_pool_02_desc: "Với quy mô ngày càng mở rộng, $building_sacred_pool_02$ này còn thu hút nhiều sinh vật hoang dã; hệ thực vật và động vật hòa quyện, khơi gợi cho khách viếng thăm cảm nhận về vòng tuần hoàn của sự sống."
  building_sacred_pool_03: "Bồn Nước Nghi Lễ"
  building_sacred_pool_03_desc: "Là nơi diễn ra những nghi thức và lễ nghi đặc biệt, vùng nước này phản ánh sự huy hoàng ngày càng tăng của vị quân chủ."
  building_sacred_pool_04: "Hào Nước"
  building_sacred_pool_04_desc: "Bao quanh nơi thờ tự, cư dân cảm thấy an tâm hơn khi $building_type_sacred_pool_01$ tạo ra một lớp phòng thủ giữa họ và các thế lực thù địch tiềm tàng."
  building_sacred_pool_05: "Baray Nhỏ"
  building_sacred_pool_05_desc: "Những tượng sư tử hộ vệ canh giữ Baray, khiến bất kỳ kẻ xâm nhập nào cũng phải chùn bước trước khi vượt qua làn nước tĩnh lặng."
  building_sacred_pool_06: "Baray"
  building_sacred_pool_06_desc: "Trải dài từ đông sang tây, $building_sacred_pool_06$ là cảnh tượng hùng vĩ đáng chiêm ngưỡng. Những tượng linh xà canh giữ chu vi bên ngoài."
  building_sacred_pool_07: "Đại Baray"
  building_sacred_pool_07_desc: "Tượng thánh, thảm thực vật nở rộ và phong cảnh tráng lệ làm nổi bật vùng nước hùng vĩ này, mang lại sự mát lành và nguồn nước trong những đợt nóng khắc nghiệt."
  building_sacred_pool_08: "Baray Linh Thiêng"
  building_sacred_pool_08_desc: "Khách lữ hành và du khách thường đứng sững trước công trình nước nhân tạo này — bề ngang rộng đến mức khó có thể nhìn thấy bờ bên kia. Đây là minh chứng chân thực cho mối liên kết thiêng liêng của vùng đất này."

  building_type_vihara_halls_01: "Giảng Đường Tăng Viện"
  building_type_vihara_halls_01_desc: "Là công trình tu viện được xây dựng để che chở các tăng lữ trong mùa mưa, đây là nơi thiền định, cầu nguyện và tĩnh dưỡng. Việc mở rộng các giảng đường góp phần gia tăng sinh lực và lòng mộ đạo của các tín đồ cư trú tại đây."
  building_vihara_halls_01: "Điện Cầu Nguyện"
  building_vihara_halls_01_desc: "Việc xây dựng thêm $building_vihara_halls_01$ mang đến cho khách viếng thăm một không gian thờ phụng và chiêm niệm."
  building_vihara_halls_02: "Thư Viện Kinh Điển"
  building_vihara_halls_02_desc: "Các kinh điển cổ xưa lẫn mới mẻ đều được lưu giữ trong Hor Trai. Các tín đồ có thể đọc và bồi đắp sự giác ngộ của mình một cách thong thả."
  building_vihara_halls_03: "Nhà Nguyện Hành Lang"
  building_vihara_halls_03_desc: "Những hàng cột uy nghi vươn cao trên các nhà nguyện này, trưng bày các phù văn tinh xảo và hình tượng tôn giáo đa dạng cho các tín đồ chiêm bái."
  building_vihara_halls_04: "Mandapa"
  building_vihara_halls_04_desc: "Với quy mô đồ sộ và kết cấu cột trụ, đại sảnh này đặc biệt thích hợp để tổ chức các nghi lễ công cộng và nghi thức tôn giáo."
  building_vihara_halls_05: "Đình Shala"
  building_vihara_halls_05_desc: "Một đình các nằm giữa thảm xanh thiên nhiên, vẻ đẹp của công trình này chỉ có thể sánh với bầu không khí linh thiêng mà nó toát ra."
  building_vihara_halls_06: "Đá Sima"
  building_vihara_halls_06_desc: "Những tảng đá ranh giới này giúp các tăng lữ của $building_type_vihara_halls_01$ xác định chính xác diện tích và khoảng cách cần thiết để thực hành nghi lễ đúng chuẩn mực."
  building_vihara_halls_07: "Tháp Chuông"
  building_vihara_halls_07_desc: "Một $building_vihara_halls_07$ uy nghi vươn cao trên các $building_type_vihara_halls_01$, phản chiếu ánh mặt trời ban ngày và sừng sững trong đêm tối."
  building_vihara_halls_08: "Đại Giảng Đường"
  building_vihara_halls_08_desc: "Sự tiện nghi và đầy đủ của các giảng đường này thu hút tăng lữ từ những vùng đất xa xôi, góp phần củng cố và lan tỏa giáo lý cũng như tư tưởng thông qua một mạng lưới tri thức vô giá, mang lại hòa hợp cho các lãnh thổ lân cận."

  building_type_itsukushima_jinja_01: "$building_itsukushima_jinja_01$"
  building_type_itsukushima_jinja_01_desc: "$building_itsukushima_jinja_01_desc$"
  building_itsukushima_jinja_01: "Đền Itsukushima"
  building_itsukushima_jinja_01_desc: "Được thành lập từ thế kỷ VI và thờ các nữ thần Thần đạo cai quản biển cả và bão tố, các hành lang của đền Itsukushima-jinja vươn mình trên mặt nước, hướng về cổng torii nổi tiếng trông như đang trôi giữa vịnh Matsushima."
  building_itsukushima_jinja_02: "$building_itsukushima_jinja_01$"
  building_itsukushima_jinja_02_desc: "$building_itsukushima_jinja_01_desc$"

  building_type_heian_palace_01: "$building_heian_palace_01$"
  building_type_heian_palace_01_desc: "$building_heian_palace_01_desc$"
  building_heian_palace_01: "Cung điện Heian"
  building_heian_palace_01_desc: "Được Hoàng đế Kanmu xây dựng làm trung tâm của đại đô thị Heian-kyō, hay “Kinh đô Hòa Bình”, quần thể cung điện rộng lớn này là nơi đặt triều đình, hoàng cung và các cơ quan hành chính trung ương của Nhật Bản. Những hành lang nơi đây luôn nhộn nhịp nghi lễ, chính trị và âm mưu, khi các gia tộc quý tộc cổ xưa tranh giành ảnh hưởng."

  building_type_ise_jingu_01: "$building_ise_jingu_01$"
  building_type_ise_jingu_01_desc: "$building_ise_jingu_01_desc$"
  building_ise_jingu_01: "Đền Ise"
  building_ise_jingu_01_desc: "Ise-jingū là thánh địa linh thiêng thờ nữ thần Mặt Trời #EMP Amaterasu#! và là một trong những địa điểm Thần đạo được tôn kính bậc nhất. Ngôi đền lưu giữ bảo vật hoàng gia Yamato và được trông coi bởi một nữ tư tế Saigū, được tuyển chọn từ hoàng tộc."

  building_type_kofuku_ji_01: "$building_kofuku_ji_01$"
  building_type_kofuku_ji_01_desc: "$building_kofuku_ji_01_desc$"
  building_kofuku_ji_01: "Chùa Kōfuku"
  building_kofuku_ji_01_desc: "Có niên đại từ thế kỷ VII, Kōfuku-ji là một trong Thất Đại Tự của Nara, đồng thời là một trong những trung tâm Phật giáo cổ xưa và quan trọng nhất tại Nhật Bản."

  building_type_enryaku_ji_01: "$building_enryaku_ji_01$"
  building_type_enryaku_ji_01_desc: "$building_enryaku_ji_01_desc$"
  building_enryaku_ji_01: "Chùa Enryaku"
  building_enryaku_ji_01_desc: "Được $SaichO_$ sáng lập vào cuối thế kỷ VIII, Enryaku-ji tọa lạc trên núi Hiei, nhìn xuống kinh đô Heian-kyō của Hoàng đế Kanmu, và là trung tâm của Phật giáo Thiên Thai (Tendai) tại Nhật Bản."

  building_type_dazaifu_01: "$building_dazaifu_01$"
  building_type_dazaifu_01_desc: "$building_dazaifu_01_desc$"
  building_dazaifu_01: "Nha Dazaifu"
  building_dazaifu_01_desc: "Thị trấn Dazaifu là trung tâm hành chính của triều đình tại vùng Kyūshū xa xôi. Được thành lập để giám sát phòng thủ hòn đảo, thúc đẩy ngoại thương và tiếp đón sứ thần ngoại quốc, chức Tổng quản Dazaifu thường là bệ phóng sự nghiệp cho các quan lại đầy tham vọng."

  building_type_chinjufu_01: "$building_chinjufu_01$"
  building_type_chinjufu_01_desc: "$building_chinjufu_01_desc$"
  building_chinjufu_01: "Trấn thủ phủ Chinjufu"
  building_chinjufu_01_desc: "Ban đầu đặt tại Taga, Chinjufu là trung tâm quân sự kiên cố phục vụ các chiến dịch bình định miền bắc Nhật Bản của triều đình, do một vị chỉ huy đặc biệt phụ trách phòng thủ và thu thuế khu vực."

  building_type_hakata_port_01: "$building_hakata_port_01$"
  building_type_hakata_port_01_desc: "$building_hakata_port_01_desc$"
  building_hakata_port_01: "Cảng Hakata"
  building_hakata_port_01_desc: "Từ buổi đầu của triều Yamato, thành cảng Hakata ở bờ bắc Kyūshū đã là cửa ngõ hải quân trọng yếu, một trung tâm giao thương sầm uất do Dazaifu lân cận quản lý, nơi thương nhân buôn bán hàng hóa từ các vùng đất xa xôi và các phái đoàn ngoại giao đặt chân lên Nhật Bản."
  building_hakata_port_02: "$building_hakata_port_01$"
  building_hakata_port_02_desc: "$building_hakata_port_01_desc$"

  building_type_hwangnyongsa_01: "$building_hwangnyongsa_01$"
  building_type_hwangnyongsa_01_desc: "$building_hwangnyongsa_01_desc$"
  building_hwangnyongsa_01: "Chùa Hwangnyong"
  building_hwangnyongsa_01_desc: "Hoàn thành vào thế kỷ VII, Hwangnyongsa, hay “Hoàng Long Tự”, là quần thể đồ sộ do vua Jinheung của Tân La xây dựng làm trung tâm giảng dạy và quyền lực Phật giáo, nổi tiếng với một trong những ngôi tháp cao nhất thế giới."

  building_type_white_deer_grotto_academy_01: "$building_white_deer_grotto_academy_01$"
  building_type_white_deer_grotto_academy_01_desc: "$building_white_deer_grotto_academy_01_desc$"
  building_white_deer_grotto_academy_01: "Bạch Lộc Động Thư Viện"
  building_white_deer_grotto_academy_01_desc: "Do ẩn sĩ Lý Bạch sáng lập tại nơi bạch lộc từng tự do rong ruổi, học viện này hưng thịnh như một trung tâm của Tân Nho học."

  building_type_shigu_academy_01: "$building_shigu_academy_01$"
  building_type_shigu_academy_01_desc: "$building_shigu_academy_01_desc$"
  building_shigu_academy_01: "Thạch Cổ Thư Viện"
  building_shigu_academy_01_desc: "Học viện này thu hút các học giả nghiên cứu Kinh điển giữa vùng núi yên tĩnh của Hồ Nam. Là trung tâm thi ca và triết học, nơi đây kế thừa truyền thống nhà Đường sang thời Tống."

  building_type_culai_academy_01: "$building_culai_academy_01$"
  building_type_culai_academy_01_desc: "$building_culai_academy_01_desc$"
  building_culai_academy_01: "Thư Viện Cù Lai"
  building_culai_academy_01_desc: "Các học giả xây dựng thư viện giữa núi non Cù Lai để nghiên cứu Nho học trong ẩn cư. Những giảng đường nơi đây vang vọng các cuộc tranh luận về sự hòa hợp giữa thiên nhiên và trị quốc."

  building_type_lize_academy_01: "$building_lize_academy_01$"
  building_type_lize_academy_01_desc: "$building_lize_academy_01_desc$"
  building_lize_academy_01: "Thư Viện Lý Trạch"
  building_lize_academy_01_desc: "Thư viện Lý Trạch khuyến khích học thuật giữa vùng sông nước và lau sậy của Hà Bắc, đóng vai trò là tiền đồn phương bắc của trật tự Nho giáo giữa những biên cương biến động."

  building_type_maoshan_academy_01: "$building_maoshan_academy_01$"
  building_type_maoshan_academy_01_desc: "$building_maoshan_academy_01_desc$"
  building_maoshan_academy_01: "Thư Viện Mao Sơn"
  building_maoshan_academy_01_desc: "Một học viện chuyên đào tạo nghi lễ, thiền định và kinh văn linh thiêng, đóng vai trò đối trọng tâm linh với các thư viện Nho giáo thời Tống."

  building_type_tiantai_monasteries_01: "$building_tiantai_monasteries_01$"
  building_type_tiantai_monasteries_01_desc: "$building_tiantai_monasteries_01_desc$"
  building_tiantai_monasteries_01: "Tu Viện Thiên Thai"
  building_tiantai_monasteries_01_desc: "Là cơ sở học thuật của tông phái Thiên Thai, học viện này chuyên giảng dạy triết học và thiền định."

  building_type_jizu_shan_temples_01: "$building_jizu_shan_temples_01$"
  building_type_jizu_shan_temples_01_desc: "$building_jizu_shan_temples_01_desc$"
  building_jizu_shan_temples_01: "Chùa núi Kê Túc"
  building_jizu_shan_temples_01_desc: "Quần thể tu viện Phật giáo trên núi này từng là thành trì của Mật tông. Khách hành hương ví nơi đây với Linh Thứu Sơn của Ấn Độ."

  building_type_nanhua_temple_01: "$building_nanhua_temple_01$"
  building_type_nanhua_temple_01_desc: "$building_nanhua_temple_01_desc$"
  building_nanhua_temple_01: "Chùa Nam Hoa"
  building_nanhua_temple_01_desc: "Trụ xứ của Lục Tổ Huệ Năng của Thiền tông. Ngôi chùa vẫn là trung tâm sinh hoạt sôi nổi của giáo lý Thiền."

  building_type_byeokran_port_01: "$building_byeokran_port_01$"
  building_type_byeokran_port_01_desc: "$building_byeokran_port_01_desc$"
  building_byeokran_port_01: "Cảng Byeokran"
  building_byeokran_port_01_desc: "Nằm ở phía tây thành Gaeseong, tại cửa sông Ryeseong, cảng Byeokran là tuyến đường trực tiếp nhất để hàng hóa và lữ khách ngoại quốc tiến vào bán đảo Triều Tiên, tránh các biên giới phía bắc và dãy núi hiểm trở."

  building_type_sado_mines_01: "$building_sado_mines_02$"
  building_type_sado_mines_01_desc: "$building_sado_mines_01_desc$"
  building_sado_mines_01: "Mỏ Vàng Sado"
  building_sado_mines_01_desc: "Từng là nơi lưu đày hẻo lánh, ít ai ngờ hòn đảo xa xôi Sado lại âm thầm cất giấu một trữ lượng vàng khổng lồ dưới lòng đất."
  building_sado_mines_02: "Mỏ Vàng Sado Mở Rộng"
  building_sado_mines_02_desc: "Các hầm mỏ được mở rộng và kỹ sư được điều đến, cho phép đẩy mạnh đáng kể tốc độ khai thác vàng."
  building_sado_mines_03: "Đại Mỏ Vàng Sado"
  building_sado_mines_03_desc: "Một ngôi làng đã hình thành quanh các hầm mỏ, và công nhân thường xuyên phát hiện những mạch vàng mới."
  building_sado_mines_04: "Quần Thể Khai Thác Vàng Sado"
  building_sado_mines_04_desc: "Hoạt động khai thác vàng đã đạt tới quy mô gần như công nghiệp, với lực lượng lao động lên đến hàng nghìn người. Của cải dường như tuôn chảy vô tận từ các hầm mỏ."

  building_type_tada_mines_01: "$building_tada_mines_02$" # Di chỉ mỏ bạc–đồng Tada
  building_type_tada_mines_01_desc: "$building_tada_mines_01_desc$"
  building_tada_mines_01: "Hầm Mỏ Đồng Tada"
  building_tada_mines_01_desc: "Bên dưới ngôi làng Tada, nép mình trong dãy núi Hokusetsu, là một kho tàng kim loại quý đang chờ được khai thác. Tương truyền rằng lớp mạ của Đại Phật tại chùa Tōdai-ji được lấy từ chính nơi này."
  building_tada_mines_02: "Mỏ Đồng Tada"
  building_tada_mines_02_desc: "Các hầm mỏ đã được mở rộng, và các kỹ sư được điều đến để thực sự gia tăng quy mô khai thác đồng."
  building_tada_mines_03: "Đại Mỏ Đồng Tada"
  building_tada_mines_03_desc: "Một ngôi làng đã hình thành xung quanh vô số hầm mỏ, và thợ mỏ thường xuyên phát hiện các mạch đồng mới."
  building_tada_mines_04: "Khu Liên Hợp Khai Thác Đồng Tada"
  building_tada_mines_04_desc: "Việc khai thác đồng đã đạt đến quy mô gần như công nghiệp, với số lượng lao động lên tới hàng nghìn người. Của cải dường như tuôn chảy vô tận từ các hầm mỏ."

  building_type_tsushima_mines_01: "$building_tsushima_mines_02$" # Mỏ bạc Tsushima
  building_type_tsushima_mines_01_desc: "$building_tsushima_mines_01_desc$"
  building_tsushima_mines_01: "Hầm Mỏ Bạc Tsushima"
  building_tsushima_mines_01_desc: "Đảo Tsushima nổi tiếng với các mỏ bạc, được phát hiện vào cuối thế kỷ VII dưới triều Thiên hoàng Tenmu. Giàu galen, những quặng đen của Biển Nhật Bản mang lại vô vàn của cải."
  building_tsushima_mines_02: "Mỏ Bạc Tsushima"
  building_tsushima_mines_02_desc: "Các hầm mỏ đã được mở rộng, và các kỹ sư được điều đến để thực sự gia tăng quy mô khai thác bạc."
  building_tsushima_mines_03: "Đại Mỏ Bạc Tsushima"
  building_tsushima_mines_03_desc: "Một ngôi làng đã hình thành xung quanh các hầm mỏ, và thợ mỏ thường xuyên phát hiện những mạch bạc mới."
  building_tsushima_mines_04: "Khu Liên Hợp Khai Thác Bạc Tsushima"
  building_tsushima_mines_04_desc: "Việc khai thác bạc đã đạt đến quy mô gần như công nghiệp, với số lượng lao động lên tới hàng nghìn người. Của cải dường như tuôn chảy vô tận từ các hầm mỏ."

  building_type_koganeyama_mines_01: "$building_koganeyama_mines_02$"
  building_type_koganeyama_mines_01_desc: "$building_koganeyama_mines_01_desc$"
  building_koganeyama_mines_01: "Hầm Mỏ Vàng Kinka"
  building_koganeyama_mines_01_desc: "Đảo Kinka cùng đền Koganeyama gắn liền với nơi phát hiện sớm nhất các mỏ vàng tại Nhật Bản, dưới dạng bụi vàng. Được Thiên hoàng Shōmu lập nên vào thế kỷ VIII, ngôi đền thờ phụng #EMP Kanayama#!, vị thần bảo hộ ngành khai khoáng."
  building_koganeyama_mines_02: "Mỏ Vàng Kinka"
  building_koganeyama_mines_02_desc: "Các hầm mỏ đã được mở rộng, và các kỹ sư được điều đến để thực sự gia tăng quy mô khai thác vàng."
  building_koganeyama_mines_03: "Đại Mỏ Vàng Kinka"
  building_koganeyama_mines_03_desc: "Một ngôi làng đã hình thành xung quanh các hầm mỏ, và thợ mỏ thường xuyên phát hiện những mạch vàng mới."
  building_koganeyama_mines_04: "Khu Liên Hợp Khai Thác Vàng Kinka"
  building_koganeyama_mines_04_desc: "Việc khai thác vàng đã đạt đến quy mô gần như công nghiệp, với số lượng lao động lên tới hàng nghìn người. Của cải dường như tuôn chảy vô tận từ các hầm mỏ."
 
  building_type_mount_baekdu_01: "Núi Baekdu"
  building_type_mount_baekdu_01_desc: "Đỉnh cao sừng sững của núi Baekdu được cho là cội nguồn của mọi dãy núi trên bán đảo Triều Tiên, và độ cao linh thiêng của nó là nơi thờ phụng quan trọng đối với nhiều tín ngưỡng và dân tộc trong khu vực."
  building_mount_baekdu_01: "$building_type_mount_baekdu_01$"
  building_mount_baekdu_01_desc: "$building_type_mount_baekdu_01_desc$"

  building_type_mozu_tombs: "$building_mozu_tombs$"
  building_type_mozu_tombs_desc: "$building_mozu_tombs_desc$"
  building_mozu_tombs: "Lăng mộ Mozu"
  building_mozu_tombs_desc: "Những ngọn đồi hình ổ khóa tại Mozu được đồn rằng lưu giữ các hoàng đế xưa kia. Đối với các thuyền bè nơi vịnh gần đó, chúng là cột mốc đáng chú ý, đồng thời là lời nhắc nhở về những thời khắc đã qua."

  building_type_trosky_castle_01: "$building_trosky_castle_01$"
  building_type_trosky_castle_01_desc: "$building_trosky_castle_01_desc$"
  building_trosky_castle_01: "Lâu đài Trosky"
  building_trosky_castle_01_desc: "Lâu đài Trosky được xây dựng giữa hai khối đá bazan của một ngọn núi lửa đã tắt từ lâu. Tòa lâu đài này lấy tên từ chính hình dáng của các vách đá, vốn trông giống như tàn tích của một pháo đài đã sụp đổ."
