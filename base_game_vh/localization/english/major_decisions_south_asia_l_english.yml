l_english:
 #Become Chakravarti
  become_chakravarti_decision:0 "Trở thành Chakravarti"
  become_chakravarti_decision_desc:0 "#F Với những nghi lễ và buổi lễ cần thiết, Ta sẽ chính thức hóa địa vị thần thánh của mình như vị vua hợp pháp của toàn thế giới.#!"
  become_chakravarti_decision_tooltip:0 "Thống nhất Ấn Độ như vị vua hợp pháp của thế giới"
  become_chakravarti_decision_indian_empires_unite_effect:0 "Ngài hợp nhất các Đế chế Ấn Độ"
  become_chakravarti_decision_new_primary_title_effect:0 "Đế chế Ấn Độ trở thành [primary_title|E] mới của Ngài"
  become_chakravarti_decision_confirm:0 "Tham dự các nghi lễ"

 #Become Lady/Lord of the Ganges
  take_stewardship_of_the_sacred_river_decision:0 "Nhận Quyền Quản Lý Sông Thánh"
  take_stewardship_of_the_sacred_river_decision_desc:0 "#F Với quyền kiểm soát tất cả các vùng đất dọc theo dòng sông Hằng, Ta có quyền quyết định các vị vua nào được phép tiếp cận dòng nước thánh và các nghi lễ của nó. Đã đến lúc nhờ [ROOT.Char.GetFaith.PriestNeuterPlural] chính thức hóa quyền lực này như người bảo vệ sự linh thiêng.#!"
  take_stewardship_of_the_sacred_river_decision_tooltip:0 "Chính thức hóa quyền kiểm soát sông Hằng như một bổ nhiệm thần thánh"
  take_stewardship_of_the_sacred_river_decision_confirm:0 "Triệu tập [ROOT.Char.GetFaith.AltPriestTermPlural] đến bờ sông"
  capital_province_in_ganges_region:1 "[realm_capital|E] của Ngài nằm ở [GetGeographicalRegion('custom_ganges_plain').GetName] [region|E]"
  MY_VASSAL_OR_LIEGE_MUST_NOT_BE_RULER_OF_GANGES:0 "Quyền quản lý sông thánh không thể bị chiếm đoạt từ chư hầu hoặc chúa tể"

  form_bene_israel_decision:0 "Hợp nhất $k_bene_israel$"
  form_bene_israel_decision_desc:0 "Cộng đồng của chúng ta xa rời các bộ tộc gốc của Israel, và cơ hội trở về đất thánh rất mong manh. Chúng ta phải tạo dựng một quê hương mới cho người Do Thái, ngay tại Deccan."
  form_bene_israel_decision_tooltip:0 "Chính thức hóa Vương quốc $k_bene_israel$."
  form_bene_israel_decision_confirm:0 "[ROOT.Char.Custom('GetQueenKing')|U] của $k_bene_israel$!"
  malabarism_religious_head_exists_tt:0 "$d_malabarism$ tồn tại"

 #Spread Theravada Faith
  spread_theravada_faith_decision:0 "Lan truyền đạo [ROOT.Char.GetFaith.GetNameNoTooltip]"
  spread_theravada_faith_decision_desc:0 "Đạo [ROOT.Char.GetFaith.GetName] đang suy giảm, và giờ đây Ta phải đảm bảo sự tồn tại liên tục của nó. Bước đầu tiên là tìm cách hòa giải sự khác biệt tôn giáo tại thung lũng Irrawaddy."
  spread_theravada_faith_decision_tooltip:0 "Quyết định cách giải quyết xung đột tôn giáo."
  spread_theravada_faith_decision_confirm:0 "Tham khảo [ROOT.Char.GetFaith.PriestNeuter|U]"
  spread_theravada_faith_decision_cus_tt:0 "Ngài suy nghĩ cách tốt nhất để chuyển hóa dân chúng..."
