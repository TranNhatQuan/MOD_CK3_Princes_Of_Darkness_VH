  SUCCESSION_EVENT_WINDOW_END_DATE_UNIFICATION_AFRICA_DESC:0 " Chính nhờ công lao, sự cần mẫn và sự cai trị anh minh của ngài mà lục địa châu Phi được thống nhất dưới một quyền lực."
  SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_PORTUGAL_DESC:0 " Nhưng liệu ngài thực sự đã chết, khi vương quốc $k_portugal$ do ngài khai lập sẽ được ghi nhớ muôn đời?"
  SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_CANARIAS_DESC:0 " Khắp các hòn đảo, ai ai cũng biết tên ngài với tư cách là người khai lập Vương quốc $k_canarias$."
  SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_BOSNIA_DESC:0 " Ở Bosnia, chẳng có con ngựa nào không biết tên ngài sau khi Vương quốc $k_bosnia$ được thành lập."
  SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_ARMENIA_DESC:0 " Danh xưng của ngài sẽ trường tồn vĩnh cửu với tư cách là người khai lập Đế chế $e_armenia$."
  SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_RUM_DESC:0 " Vương quốc $k_rum$ do ngài tạo dựng, và với tư cách người sáng lập, theo một cách nào đó nó mãi thuộc về ngài."
  SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_VIET_DESC: " Con dân của ngài sẽ mãi tưởng nhớ danh ngài như linh hồn mẫu mực đã biến Đế chế $e_viet$ thành hiện thực."
  SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_MAJAPAHIT_DESC: " Danh ngài được khắc ghi vĩnh viễn trên đỉnh Semeru với tư cách người khai lập Đế chế $e_majapahit$"
  SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_RYUKYU_DESC: " Ngài sẽ được ghi nhớ là người thống nhất các thị tộc quần đảo, và là người sáng lập một đế quốc $e_ruucuu_adj$"
  SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_SIAM_DESC: " Ngài đã khắc tên mình vĩnh viễn vào lịch sử nhân loại, với tư cách người sáng lập Vương quốc $k_siam$"
  SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_BRUNEI_KINGDOM_DESC: " Ngài đã truyền cảm hứng và thống nhất con dân dưới bầu trời của Allah, với tư cách người sáng lập Vương quốc $k_brunei$"
  SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_BRUNEI_EMPIRE_DESC: " Tín đồ Borneo sẽ nhớ đến ngài như người chăn dắt bảo vệ họ khỏi tà ác, với tư cách người sáng lập Đế chế $e_brunei$"
  SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_ISRAEL_DESC:0 " Chính nhờ công lao và sự cần mẫn của ngài mà Vương quốc $k_israel$ được thành lập."
  SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_OUTREMER_DESC:0 " Không ai nghĩ điều đó có thể xảy ra, nhưng ngài đã thống trị vùng thánh địa tranh chấp nhất thế giới với tư cách Đế chế $e_outremer$."
  SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_SWITZERLAND_DESC:0 " Dẫu trèo qua dãy Alps cũng không thể thấy hết những gì thuộc về ngài sau khi ngài lập nên Vương quốc $k_switzerland$."
  SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_AUSTRIA_DESC:0 " Dưới sự cai trị của ngài, Đại Công quốc trở thành một trong những thế lực được kính trọng nhất châu Âu."
  SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_ARAGON_DESC:0 " Vương quốc $k_aragon$ ra đời bên những khúc quanh của sông Aragón, mãi là minh chứng cho sự cai trị huy hoàng của ngài."
  SUCCESSION_EVENT_WINDOW_END_DATE_RESTORED_ROMAN_EMPIRE_DESC:0 " Nhờ ngài, vũ trụ biết rằng dù thiên niên kỷ trôi qua với La Mã trong tro tàn, $h_roman_empire$ vẫn sẽ trở lại."
  SUCCESSION_EVENT_WINDOW_END_DATE_RESTORED_DUMNONIA_DESC:0 " Chính nhờ ngài mà người Cornwall một lần nữa vươn lên trở thành Vương quốc $k_cornwall$."
  SUCCESSION_EVENT_WINDOW_END_DATE_RESTORED_CAROLINGIAN_DESC:0 " Điều từng chỉ là giấc mơ của Charlemagne đã thành hiện thực với ngài, người phục hưng Đế chế $e_france$."
  SUCCESSION_EVENT_WINDOW_END_DATE_RESTORED_HOLY_ROMAN_EMPIRE_DESC:0 " Ngài chính là hiện thân của vinh quang đã mất của $e_hre$, và nhờ ngài, nó được tái lập một lần nữa."
  SUCCESSION_EVENT_WINDOW_END_DATE_RESTORED_OLD_VASCONIA_DESC: " Theo ý chí của ngài, người Basque đã giành lại đất tổ tại Iberia dưới lá cờ Vương quốc Vasconia."

