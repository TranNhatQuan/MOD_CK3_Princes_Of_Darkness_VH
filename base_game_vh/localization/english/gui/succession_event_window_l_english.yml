 #Death Intro messages:
  SUCCESSION_EVENT_WINDOW_DEAD_INTRO_DEFAULT_1:0 "[ROOT.Char.GetFullNameNoTooltip] đã trút hơi thở cuối cùng ở tuổi [ROOT.Char.GetAge]."
  SUCCESSION_EVENT_WINDOW_DEAD_INTRO_DEFAULT_2:0 "[ROOT.Char.GetFullNameNoTooltip] đã từ bỏ xác phàm của [ROOT.Char.GetHerHis] ở tuổi [ROOT.Char.GetAge]."
  SUCCESSION_EVENT_WINDOW_DEAD_INTRO_DEFAULT_3:0 "[ROOT.Char.GetFullNameNoTooltip] đã qua đời ở tuổi [ROOT.Char.GetAge]."
  SUCCESSION_EVENT_WINDOW_DEAD_INTRO_DEFAULT_4:0 "[ROOT.Char.GetFullNameNoTooltip] đã rời khỏi thế gian này ở tuổi [ROOT.Char.GetAge]."
  SUCCESSION_EVENT_WINDOW_DEAD_INTRO_DEFAULT_5:0 "[ROOT.Char.GetFullNameNoTooltip] đã qua đời ở tuổi [ROOT.Char.GetAge] và [ROOT.Char.Custom('GetAfterLifeDestination')]."
  SUCCESSION_EVENT_WINDOW_DEAD_INTRO_PIOUS:1 "Linh hồn của [ROOT.Char.GetFullNamePossessiveNoTooltip] đã bay về [ROOT.Char.GetFaith.PositiveAfterLife] ở tuổi [ROOT.Char.GetAge]."
  SUCCESSION_EVENT_WINDOW_DEAD_INTRO_WICKED:1 "Linh hồn của [ROOT.Char.GetFullNamePossessiveNoTooltip] cuối cùng đã bị đày xuống [ROOT.Char.GetFaith.NegativeAfterLife] ở tuổi [ROOT.Char.GetAge]."
  SUCCESSION_EVENT_WINDOW_DEAD_INTRO_WOUNDED:0 "[ROOT.Char.GetFullNameNoTooltip] cuối cùng đã tìm được sự yên nghỉ ở tuổi [ROOT.Char.GetAge]."
  SUCCESSION_EVENT_WINDOW_DEAD_INTRO_CHRISTIANITY_1:0 "[ROOT.Char.GetFullNameNoTooltip] đã tìm thấy sự bình yên trong vòng tay của Chúa Kitô ở tuổi [ROOT.Char.GetAge]."
  SUCCESSION_EVENT_WINDOW_DEAD_INTRO_CHRISTIANITY_2:0 "[ROOT.Char.GetFullNameNoTooltip] an nghỉ trong vòng tay của Chúa ở tuổi [ROOT.Char.GetAge]."
  SUCCESSION_EVENT_WINDOW_DEAD_INTRO_ISLAM_1:0 "[ROOT.Char.GetFullNameNoTooltip] đã rời khỏi ngôi nhà trần thế theo lời gọi của Đấng Chân Thực ở tuổi [ROOT.Char.GetAge]."
  SUCCESSION_EVENT_WINDOW_DEAD_INTRO_ISLAM_2:0 "[ROOT.Char.GetFullNameNoTooltip] đã rời bỏ thế giới phù du này và bay về [ROOT.Char.GetFaith.PositiveAfterLife] ở tuổi [ROOT.Char.GetAge]."
  SUCCESSION_EVENT_WINDOW_DEAD_INTRO_ISLAM_3:0 "[ROOT.Char.GetFullNameNoTooltip] đã bước sang cõi vĩnh hằng ở tuổi [ROOT.Char.GetAge]."
  SUCCESSION_EVENT_WINDOW_DEAD_INTRO_NORSE_1:0 "[ROOT.Char.GetFullNameNoTooltip] đã tham gia bữa tiệc tại [ROOT.Char.GetFaith.PositiveAfterLife] ở tuổi [ROOT.Char.GetAge]."
  SUCCESSION_EVENT_WINDOW_DEAD_INTRO_HELLENIC_1:0 "[ROOT.Char.GetFullNameNoTooltip] đã băng qua dòng sông Styx ở tuổi [ROOT.Char.GetAge]."
  SUCCESSION_EVENT_WINDOW_DEAD_INTRO_EASTERN_1:0 "[ROOT.Char.GetFullNameNoTooltip] đã siêu thoát khỏi hình hài vật chất của [ROOT.Char.GetHerHis] ở tuổi [ROOT.Char.GetAge]."
  SUCCESSION_EVENT_WINDOW_DEAD_INTRO_TRIBAL_1:0 "[ROOT.Char.GetFullNameNoTooltip] đã bước qua cánh cửa dẫn đến thế giới linh hồn ở tuổi [ROOT.Char.GetAge]."

