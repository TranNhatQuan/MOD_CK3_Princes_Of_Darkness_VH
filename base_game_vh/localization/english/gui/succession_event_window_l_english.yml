  SUCCESSION_EVENT_WINDOW_DEAD_REASON_1:0 "[ROOT.Char.GetSheHe|U] [ROOT.Char.GetDeathReason]."

#Death Outro messages:
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_AGE_CHILD:0 "Với cuộc đời của [ROOT.Char.GetHerHis] bị cắt đứt quá sớm, thật khó để nói [ROOT.Char.GetSheHe] sẽ trở thành bậc Cầm quyền như thế nào."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_AGE_OLD:0 "Một [ROOT.Char.GetWomanMan] già cả, [ROOT.Char.GetSheHe] đã sống một cuộc đời dài lâu và trọn vẹn."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_AGE_IMMORTAL:0 "Tưởng chừng như bất tử, [ROOT.Char.GetSheHe] đã khiến bao người kinh ngạc trước sự ra đi bất ngờ của [ROOT.Char.GetHerHis]."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_AGE_PREGNANT:0 "Ra đi trước khi hạ sinh hài nhi của [ROOT.Char.GetHerHis], [ROOT.Char.GetSheHe] sẽ không phải đơn độc bước đi ở thế giới bên kia."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_LEPER:0 "Thân thể mục rữa của [ROOT.Char.GetHerHis|U] cuối cùng đã khuất phục trước tai ương của bệnh phong."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_DISFIGURED:0 "Bị biến dạng kinh hoàng, [ROOT.Char.GetSheHe] đã dành những năm cuối đời không thể phô bày khuôn mặt của [ROOT.Char.GetHerHis] trước công chúng."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_MANGLED:0 "Thân thể bị băm vằm trong một tai nạn khủng khiếp, [ROOT.Char.GetSheHe] đã dành những năm cuối đời chật vật khó lòng bước đi."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_HUNCHBACK:0 "Chào đời dưới những hoàn cảnh bất hạnh, [ROOT.Char.GetSheHe] thường bị chế giễu vì cái lưng vẹo của [ROOT.Char.GetHerHis]."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_GIANT:0 "Chào đời dưới những hoàn cảnh bất hạnh, [ROOT.Char.GetSheHe] thường bị chế giễu vì vóc dáng khổng lồ của [ROOT.Char.GetHerHis]."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_DWARF:0 "Chào đời dưới những hoàn cảnh bất hạnh, [ROOT.Char.GetSheHe] thường bị chế giễu vì vóc dáng nhỏ bé của [ROOT.Char.GetHerHis]."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_STRONG:0 "Một [ROOT.Char.GetWomanMan|U] với năng lực vô song, [ROOT.Char.GetSheHe] cuối cùng đã tìm thấy một đối thủ mà [ROOT.Char.GetSheHe] không thể áp đảo."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_PRETTY_YOUNG:0 "Ra đi khi đang ở độ tuổi rực rỡ nhất của [ROOT.Char.GetHerHis], [ROOT.Char.GetSheHe] sẽ mãi được ghi nhớ vì vẻ đẹp tuyệt trần của [ROOT.Char.GetHerHis]."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_PRETTY_OLD:0 "Từng nổi tiếng với vẻ ngoài của [ROOT.Char.GetHerHis], Định mệnh đã nguyền rủa [ROOT.Char.GetHerHim] với một cuộc đời đủ dài để chứng kiến vẻ đẹp của [ROOT.Char.GetHerHis] dần tàn phai."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_WEAK:0 "Một [ROOT.Char.GetWomanMan] với thể trạng ốm yếu, [ROOT.Char.GetSheHe] thường bị các đồng trang lứa chế giễu."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_UGLY:1 "Nổi tiếng với vẻ ngoài xấu xí của [ROOT.Char.GetHerHis], có lời đồn rằng chỉ cần nhìn vào [ROOT.Char.GetHerHim] cũng có thể khiến người ta gặp ác mộng suốt nhiều ngày."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_INCAPABLE:0 "Chỉ còn là cái vỏ rỗng của [ROOT.Char.GetHerHis] trước kia, không thể nói hay di chuyển, [ROOT.Char.GetSheHe] cuối cùng đã rời bỏ thân xác tàn tạ của [ROOT.Char.GetHerHis]."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_LUNATIC:0 "Bị nguyền rủa với một tâm trí bất ổn, [ROOT.Char.GetSheHe] được biết đến khắp lãnh địa của [ROOT.Char.GetHerHis] như một kẻ điên cuồng."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_POSSESSED_POSITIVE:0 "Sau nhiều năm nói thông qua [ROOT.Char.GetHerHim], [ROOT.Char.GetFaith.HighGodName] cuối cùng cũng gọi [ROOT.Char.GetHerHim] trở về."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_POSSESSED_NEGATIVE:0 "Bị quỷ dữ hành hạ, [ROOT.Char.GetSheHe] thường sảng ngôn về sự diệt vong sắp tới của [ROOT.Char.GetHerHis]."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_DEPRESSED:1 "Một [ROOT.Char.GetWomanMan] bị dày vò bởi nỗi thống khổ, [ROOT.Char.GetSheHe] từ lâu đã khao khát vòng tay ngọt ngào của cái chết."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_GENIUS:0 "Mặc dù rất nổi tiếng với trí tuệ sắc bén của [ROOT.Char.GetHerHis], [ROOT.Char.GetSheHe] vẫn không thể vượt qua [ROOT.Char.GetFaith.DeathDeityName]."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_DUMB:0 "Được biết đến là kẻ chậm chạp về trí tuệ, [ROOT.Char.GetSheHe] thường phải dựa vào Hội đồng của [ROOT.Char.GetHerHis] để đưa ra các quyết định quan trọng."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_INFIRM:0 "Cái vỏ rỗng của [ROOT.Char.GetHerHis] trước kia, [ROOT.Char.GetSheHe] đã mất đi sự minh mẫn từ lâu trước khi trút hơi thở cuối cùng."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_EXCOMMUNICATED:0 "Bị Giáo hội đóng dấu Kẻ dị giáo, [ROOT.Char.GetSheHe] chắc chắn sẽ phải chịu tội vì những tội lỗi của [ROOT.Char.GetHerHis]."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_KINSLAYER:0 "Được biết đến là kẻ đã vấy bẩn đôi bàn tay [ROOT.Char.GetHerHis] bằng máu của chính người thân, [ROOT.Char.GetSheHe] chắc chắn đang trả giá cho những tội ác khủng khiếp của [ROOT.Char.GetHerHis] tại [ROOT.Char.GetFaith.NegativeAfterLife]."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_DEVIANT:0 "Một kẻ thoái hóa với những sở thích ghê tởm, [ROOT.Char.GetSheHe] chắc chắn sẽ không tìm thấy sự an ủi hay niềm vui nơi [ROOT.Char.GetSheHe] đang đến."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_CANNIBAL:0 "Có lời đồn rằng [ROOT.Char.GetSheHe] ăn thịt người để duy trì sự sống, không còn nghi ngờ gì nữa, [ROOT.Char.GetSheHe] đang bị trừng phạt vì sự gian ác của [ROOT.Char.GetHerHis] khi còn sống."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_SODOMITE:1 "Một kẻ loạn dâm khét tiếng, [ROOT.Char.GetSheHe] nay nằm trong sự chăm sóc dịu dàng của [ROOT.Char.GetFaith.DevilName] [ROOT.Char.GetFaith.DevilHerselfHimself]."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_INCESTUOUS:0 "Vì đã nếm trải trái cấm của mối tình loạn luân, [ROOT.Char.GetSheHe] chắc chắn sẽ chịu khổ hình ở kiếp sau."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_ADULTERER:0 "Một kẻ ngoại tình không biết xấu hổ, [ROOT.Char.GetSheHe] sẽ được ghi nhớ vì sự phản bội và bản tính ham muốn của [ROOT.Char.GetHerHis]."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_FORNICATOR:0 "Một kẻ gian dâm không biết xấu hổ, [ROOT.Char.GetSheHe] sẽ được ghi nhớ vì sự dâm dục không thể kiểm soát và đầy hiểm độc của [ROOT.Char.GetHerHis]."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_MURDERER:0 "Một kẻ sát nhân khét tiếng, [ROOT.Char.GetSheHe] sẽ phải chuộc lại những tội ác không thể kể xiết của [ROOT.Char.GetHerHis] ở kiếp sau."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_WITCH:0 "Được biết đến là kẻ pha chế thảo dược ma thuật và tư thông với [ROOT.Char.GetFaith.DevilName], [ROOT.Char.GetSheHe] chắc chắn sẽ bị thiêu rụi ở thế giới bên kia vì những tội lỗi của [ROOT.Char.GetHerHis]."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_ACCOMPLISHMENT_SAOSHYANT:0 "Vị thánh quân khôi phục Đế chế Ba Tư, con đường vươn tới vinh quang của [ROOT.Char.GetHerHis] sẽ được lưu danh bất tử trong các bài giảng của toàn thể [ROOT.Char.GetFaith.PriestMalePlural]. Quả thật, giờ đây [ROOT.Char.GetSheHe] hẳn đang ngự bên cạnh [ROOT.Char.GetFaith.HighGodName]."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_ACCOMPLISHMENT_RESTORER_ROME:0 "Bằng cách khôi phục sức mạnh cổ xưa của Đế chế, [ROOT.Char.GetSheHe] đã đảm bảo rằng danh tiếng của [ROOT.Char.GetHerHis] sẽ sống mãi trong vinh quang đến tận cùng thời đại."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_ACCOMPLISHMENT_CRUSADER:0 "Một [ROOT.Char.GetWomanMan] cuồng tín, [ROOT.Char.GetSheHe] đã chiến đấu vì vinh quang của [ROOT.Char.GetFaith.HighGodName] chống lại bọn [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] trong một trong những cuộc thánh chiến vĩ đại nhất của thời đại gần đây."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_DIPLOMAT:0 "Một nhà ngoại giao lão luyện, không có tranh chấp nào mà [ROOT.Char.GetSheHe] không thể giải quyết bằng con đường hòa bình."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_REVELER:0 "Một [ROOT.Char.GetWomanMan] quyến rũ, [ROOT.Char.GetSheHe] trở nên nổi tiếng với những bữa tiệc xa hoa và những vũ hội hoành tráng của [ROOT.Char.GetHerHis]."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_BLADEMASTER:0 "Là một trong những võ sĩ xuất sắc nhất thời đại của [ROOT.Char.GetHerHis], [ROOT.Char.GetSheHe] không có đối thủ trong các trận cận chiến."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_HUNTER:0 "Một thợ săn sắc sảo và tận tụy, [ROOT.Char.GetSheHe] yêu thích việc dành trọn nhiều tuần lễ trong hoang dã để truy tìm những con mồi khó nắm bắt nhất."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_GENERAL:0 "Được biết đến là một chiến lược gia xuất chúng, [ROOT.Char.GetSheHe] đã dành phần lớn thời gian của [ROOT.Char.GetHerHis] để khảo sát chiến trường và huấn luyện quân đội của [ROOT.Char.GetHerHis]."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_ADMINISTRATOR:1 "Một [ROOT.Char.GetWomanMan] tận tụy, [ROOT.Char.GetSheHe] nổi tiếng với kỹ năng xuất sắc của một quản gia và bậc Cầm quyền của [ROOT.Char.GetHerHis]."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_SCHEMER:0 "Được biết đến với bộ óc xoắn xuýt và đầy âm mưu, [ROOT.Char.GetSheHe] không bao giờ tiết lộ ý định thực sự của [ROOT.Char.GetHerHis] với bất kỳ ai, thậm chí cả những người bạn thân nhất của [ROOT.Char.GetHerHis]."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_SEDUCER:0 "Được biết đến như một kẻ phóng đãng, [ROOT.Char.GetSheHe] được ban cho tài ăn nói sắc bén, có thể quyến rũ bất cứ ai chia sẻ giường chiếu của [ROOT.Char.GetHerHis]."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_SCHOLAR:1 "Được biết đến là một học giả đáng kính, [ROOT.Char.GetSheHe] dành phần lớn thời gian của [ROOT.Char.GetHerHis] để nghiên cứu trong thư viện của [ROOT.Char.GetHerHis], hiếm khi rời khỏi [ROOT.Char.Custom('ResidenceBuilding')] của [ROOT.Char.GetHerHis]."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_TORTURER:0 "Được biết đến với bản tính bạo dâm, [ROOT.Char.GetSheHe] đã biến sự tra tấn và cắt xẻ thành một loại nghệ thuật."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_FAMILY_FIRST:0 "Một [ROOT.Char.GetWomanMan] luôn đặt lợi ích của gia đình [ROOT.Char.GetHerHis] lên trên hết, [ROOT.Char.GetSheHe] đã dành cuộc đời mình để đảm bảo một tương lai huy hoàng cho tất cả hậu duệ của [ROOT.Char.GetHerHis]."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_MYSTIC:1 "Được biết đến vì dành phần lớn các đêm trong phòng thí nghiệm của [ROOT.Char.GetHerHis], [ROOT.Char.GetSheHe] bị nhiều người coi là một phù thủy, chuyên pha chế những phép thuật tà ác trong sự bí mật của [ROOT.Char.Custom('ResidenceBuilding')] của [ROOT.Char.GetHerHis]."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_PHYSICIAN:0 "Tận tụy với việc tìm hiểu cơ thể và tâm trí con người, [ROOT.Char.GetSheHe] là một ngự y đáng kính, được nhiều học giả trẻ tìm kiếm vì kiến thức bách khoa của [ROOT.Char.GetHerHis] về tự nhiên và cơ thể."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_GALLANT:0 "Một tấm gương về lòng dũng cảm và sự hào hiệp, [ROOT.Char.GetSheHe] sẽ luôn được ghi nhớ vì bản tính chính trực và hòa nhã của [ROOT.Char.GetHerHis] trước mọi nghịch cảnh."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_HERBALIST:1 "Một thầy thuốc thảo dược trứ danh, người ta truyền tai rằng [ROOT.Char.GetSheHe] có thể chữa khỏi mọi bệnh tật nếu có đúng phương thuốc."
  SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_MALICIOUS:0 "Một [ROOT.Char.GetWomanMan] đầy âm mưu, [ROOT.Char.GetSheHe] sẽ được nhớ mãi vì sự nhỏ nhen và thâm độc của [ROOT.Char.GetHerHis]."
