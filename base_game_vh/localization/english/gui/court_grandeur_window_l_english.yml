l_english:
  COURT_GRANDEUR_LABEL:1 "[court_grandeur|E]:"
  COURT_AMENITIES_LABEL:0 "[court_amenities|E]"
  MODIFIER_PREVIOUS_LEVELS_APPLY:0 "#weak $EFFECT_LIST_BULLET$Tất cả các cấp trước đó cũng được áp dụng#!"
  MODIFIER_PREVIOUS_LEVELS_APPLY_NEWLINE:0 "\n$MODIFIER_PREVIOUS_LEVELS_APPLY$"
  COURT_GRANDEUR_LEVEL_TOOLTIP:4 "#S Hiệu ứng#!\n[CourtGrandeurWindow.GetModifierDescForLevel(CourtGrandeurLevel.GetValue)]\n[AddLocalizationIf( GreaterThan_int32( CourtGrandeurLevel.GetValue, '(int32)1' ), 'MODIFIER_PREVIOUS_LEVELS_APPLY' )]"
  COURT_GRANDEUR_PROGRESS_TOOLTIP_HEADER:1 "#T [court_grandeur|E]: [CourtGrandeurData.GetCurrent|2]#!"
  COURT_GRANDEUR_PROGRESS_TOOLTIP_BASELINE:2 "#S Mốc cơ sở:#! #underline [CourtGrandeurData.GetBase|V0]#!"
  COURT_GRANDEUR_PROGRESS_TOOLTIP_BASELINE_SIMPLE:0 "#weak (Mốc cơ sở #underline [CourtGrandeurData.GetBase|0]#!)#!"
  COURT_GRANDEUR_PROGRESS_TOOLTIP_BASELINE_TIME:0 "#weak Mốc cơ sở sẽ đạt được sau [GetTimeDifferenceWithDays( CourtGrandeurData.GetDaysUntilAtBase )]#!"
  COURT_GRANDEUR_CHANGE_TOWARDS_BASE:1 "Thay đổi hướng về mốc cơ sở"
  COURT_GRANDEUR_PROGRESS_TOOLTIP_BASELINE_CHANGE:2 "#S $COURT_GRANDEUR_CHANGE_TOWARDS_BASE$:#! #underline [CourtGrandeurData.GetChangeTowardsBase|+=]#!/tháng"
  EXPECTED_LEVEL_MARKER_DIFFERENCE:0 "[CourtGrandeurData.GetDifferenceFromExpectedLevel]"
  EXPECTED_LEVEL_MARKER_DIFFERENCE_ABS:0 "[Abs_int32( CourtGrandeurData.GetDifferenceFromExpectedLevel )]"
  EXPECTED_LEVEL_MARKER_EQUAL:0 "Đúng kỳ vọng"
  EXPECTED_LEVEL_MARKER_ABOVE:0 "$EXPECTED_LEVEL_MARKER_DIFFERENCE_ABS$ trên kỳ vọng"
  EXPECTED_LEVEL_MARKER_BELOW:0 "$EXPECTED_LEVEL_MARKER_DIFFERENCE_ABS$ dưới kỳ vọng"
  COURT_GRANDEUR_EXPECTATIONS_TOOLTIP:0 "[royal_court|E] của bạn ở mức [court_grandeur_level|E] #V $EXPECTED_LEVEL_MARKER_DIFFERENCE_ABS$#! [Select_CString( LessThan_int32( CourtGrandeurData.GetDifferenceFromExpectedLevel, '(int32)0' ), 'below', 'above' )] so với mức kỳ vọng dành cho [realm_size|E] và [rank|E] của bạn.\n\n#S Hiệu ứng#!\n[Character.GetCourtGrandeurDiffFromExpectedLevelModifierCombinedDescription]"
  COURT_GRANDEUR_GRACE_PERIOD_LEVEL_EFFECT_TOOLTIP:0 "hiệu ứng của [GetCourtGrandeurLevelModifier( CourtGrandeurData.GetCurrentLevelIgnoreGrace ).GetNameWithTooltip] được áp dụng"
  COURT_GRANDEUR_GRACE_PERIOD_NO_LEVEL_EFFECT_TOOLTIP:0 "mất toàn bộ hiệu ứng"
  COURT_GRANDEUR_GRACE_PERIOD_TOOLTIP:0 "Do vừa mất một [court_grandeur_level|E], Ngài sẽ có [CourtGrandeurData.GetGracePeriodEndDate.GetTimeToDate|V] để đạt lại [GetCourtGrandeurLevelModifier( CourtGrandeurData.GetCurrentLevel ).GetNameWithTooltip] trước khi [SelectLocalization( EqualTo_int32( CourtGrandeurData.GetCurrentLevelIgnoreGrace, '(int32)0' ), 'COURT_GRANDEUR_GRACE_PERIOD_NO_LEVEL_EFFECT_TOOLTIP', 'COURT_GRANDEUR_GRACE_PERIOD_LEVEL_EFFECT_TOOLTIP' )]."
  TOP_ROYAL_COURTS_HEADER:0 "#T [royal_court|E] này xếp hạng $RANK|O$ trong tổng số $COURTS$ trên toàn thế giới#!"
  TOP_ROYAL_COURT_ENTRY:0 "$POSITION$. [CHARACTER.GetUINameNotMe]"
  TOP_ROYAL_COURT_ENTRY_DISPLAYED_COURT:0 "#bold $POSITION$. [CHARACTER.GetUINameNotMe] #weak (triều đình này)#!#!"
  ELLIPSIS:0 "..."
 
  COURT_GRANDEUR_TOAST_GRANDEUR_INCREASED_TITLE:0 "Độ huy hoàng Triều đình tăng"
  COURT_GRANDEUR_TOAST_GRANDEUR_RANK_INCREASED_TITLE:0 "Độ huy hoàng Triều đình tăng"
  COURT_GRANDEUR_TOAST_GRANDEUR_DECREASED_TITLE:0 "Độ huy hoàng Triều đình giảm"
  COURT_GRANDEUR_TOAST_GRANDEUR_INCREASED_DESCRIPTION:0 "[royal_court|E] của Ngài hiện đạt [court_grandeur_level|E] [court_character.GetCourtGrandeurData.GetCurrentLevel]"
  COURT_GRANDEUR_TOAST_GRANDEUR_DECREASED_DESCRIPTION:0 "[royal_court|E] của Ngài hiện đạt [court_grandeur_level|E] [court_character.GetCourtGrandeurData.GetCurrentLevel]"
  COURT_GRANDEUR_EXPECTATION_EFFECTS:0 "[Character.GetCourtGrandeurDiffFromExpectedLevelModifierCombinedDescription]"
  COURT_GRANDEUR_TOOLTIP_BELOW_EXPECTATION:1 "@warning_icon! #X Triều đình này thấp hơn [court_grandeur_level|E] kỳ vọng là [Subtract_int32( CourtGrandeurData.GetMinimumExpectedLevel, CourtGrandeurData.GetCurrentLevel )] [Select_CString( EqualTo_int32( Subtract_int32( CourtGrandeurData.GetMinimumExpectedLevel, CourtGrandeurData.GetCurrentLevel ), '(int32)1' ), 'level', 'levels' )], gây ra các hiệu ứng sau:\n#!$COURT_GRANDEUR_EXPECTATION_EFFECTS$"
  COURT_GRANDEUR_TOOLTIP_AT_EXPECTATION:0 "Triều đình này đang đúng [court_grandeur_level|E] kỳ vọng, không tạo thêm hiệu ứng tích cực hay tiêu cực"
  COURT_GRANDEUR_TOOLTIP_ABOVE_EXPECTATION:1 "Triều đình này cao hơn [court_grandeur_level|E] kỳ vọng là [Subtract_int32( CourtGrandeurData.GetCurrentLevel, CourtGrandeurData.GetMinimumExpectedLevel )] [Select_CString( EqualTo_int32( Subtract_int32( CourtGrandeurData.GetCurrentLevel, CourtGrandeurData.GetMinimumExpectedLevel ), '(int32)1' ), 'level', 'levels' )], gây ra các hiệu ứng sau:\n$COURT_GRANDEUR_EXPECTATION_EFFECTS$"
  COURT_GRANDEUR_EXPECTATION_EFFECTS_IGNORE_GRACE:0 "[Character.GetCourtGrandeurDiffFromExpectedLevelWithoutGraceModifierCombinedDescription]"
  COURT_GRANDEUR_TOOLTIP_BELOW_EXPECTATION_IGNORE_GRACE:1 "@warning_icon! #X Trong [CourtGrandeurData.GetGracePeriodEndDate.GetTimeDiffFromNow], Triều đình này sẽ giảm xuống thấp hơn [court_grandeur_level|E] kỳ vọng là [Subtract_int32( CourtGrandeurData.GetMinimumExpectedLevel, CourtGrandeurData.GetCurrentLevelIgnoreGrace )] [Select_CString( EqualTo_int32( Subtract_int32( CourtGrandeurData.GetMinimumExpectedLevel, CourtGrandeurData.GetCurrentLevelIgnoreGrace ), '(int32)1' ), 'level', 'levels' )], thay vào đó sẽ gây ra các hiệu ứng sau:\n#!$COURT_GRANDEUR_EXPECTATION_EFFECTS_IGNORE_GRACE$"
  COURT_GRANDEUR_TOOLTIP_AT_EXPECTATION_IGNORE_GRACE:1 "Sau [CourtGrandeurData.GetGracePeriodEndDate.GetTimeDiffFromNow], triều đình này sẽ trở về [court_grandeur_level|E] kỳ vọng, loại bỏ các hiệu ứng tích cực do vượt kỳ vọng"
  COURT_GRANDEUR_TOOLTIP_ABOVE_EXPECTATION_IGNORE_GRACE:1 "Trong [CourtGrandeurData.GetGracePeriodEndDate.GetTimeDiffFromNow], Triều đình này sẽ giảm xuống cao hơn [court_grandeur_level|E] kỳ vọng là [Subtract_int32( CourtGrandeurData.GetCurrentLevelIgnoreGrace, CourtGrandeurData.GetMinimumExpectedLevel )] [Select_CString( EqualTo_int32( Subtract_int32( CourtGrandeurData.GetCurrentLevelIgnoreGrace, CourtGrandeurData.GetMinimumExpectedLevel ), '(int32)1' ), 'level', 'levels' )], thay vào đó sẽ gây ra các hiệu ứng sau:\n$COURT_GRANDEUR_EXPECTATION_EFFECTS_IGNORE_GRACE$"
  COURT_GRANDEUR_EXPECTED_LEVEL:1 "Đây là [court_grandeur_expectation|E] hiện tại của Ngài"
  COURT_GRANDEUR_PENDING_LEVEL:1 "Sẽ trở thành cấp hiện tại sau [CourtGrandeurData.GetGracePeriodEndDate.GetTimeDiffFromNow]"
  COURT_GRANDEUR_LEVEL_REQUIREMENT:0 "#weak (yêu cầu [CourtGrandeurLevel.GetGrandeurForLevel|V0]+ [court_grandeur|E])#!"
  COURT_GRANDEUR_ACTIVE_LEVEL:0 "#bold Cấp đang hiệu lực#! $COURT_GRANDEUR_LEVEL_REQUIREMENT$"
  COURT_GRANDEUR_CURRENT_LEVEL:0 "#bold Cấp hiện tại#! $COURT_GRANDEUR_LEVEL_REQUIREMENT$"
  COURT_GRANDEUR_INACTIVE_LEVEL:0 "#bold #X Cấp không hiệu lực#!#! $COURT_GRANDEUR_LEVEL_REQUIREMENT$"
  COURT_GRANDEUR_CURRENT_LEVEL_GRACE_PERIOD:2 "@warning_icon! #X Không đủ [grandeur|E] để duy trì cấp này, sẽ trở nên không hiệu lực sau [CourtGrandeurData.GetGracePeriodEndDate.GetTimeDiffFromNow] trừ khi Độ huy hoàng Triều đình tăng lên ít nhất [CourtGrandeurLevel.GetGrandeurForLevel|V0]#!"
