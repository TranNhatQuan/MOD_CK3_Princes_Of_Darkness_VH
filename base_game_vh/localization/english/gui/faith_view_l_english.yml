  FAITH_CREATION_BASIC_UI_DESC:0 "#weak Ta có một cơ hội duy nhất để tái định hình Đức Tin của mình mãi mãi. Ta phải tính toán cẩn thận, vì giáo điều mới sẽ không thể thay đổi một khi đã được thiết lập.\n\nCác giáo sĩ và học giả đã đến triều đình của ta để thảo luận mọi khía cạnh thần học, cố gắng hệ thống hóa một cách diễn giải hoàn chỉnh và vững chắc cho các truyền thống truyền khẩu cũ — nhưng chính ta là người khiến cuộc cải cách này trở thành hiện thực.#!\n\nTa là người có tiếng nói cuối cùng đối với [core_tenets|E] và [doctrines|E] của [faith|E] mới."
