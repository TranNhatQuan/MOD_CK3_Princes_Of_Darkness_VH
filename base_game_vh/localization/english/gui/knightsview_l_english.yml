  KNIGHTS_VIEW_FORCE:0 "Ép buộc"
  KNIGHTS_VIEW_ALLOW:0 "Cho phép"
  KNIGHTS_VIEW_FORBID:0 "Cấm"
  KNIGHTS_VIEW_TITLE:1 "$knight_culture_player_plural_no_tooltip$"
  MAX_KNIGHT_COUNT:2 "$knight_culture_player_plural_no_tooltip$: #high [GetKnightCount( GetPlayer.Self )]/[GetKnightLimit( GetPlayer.Self )]#!"
  MAX_KNIGHT_TOOLTIP:1 "#T Số lượng tối đa $knight_culture_player_plural_no_tooltip$: [knight_i][GetKnightLimit( GetPlayer.Self )|V]#!\n[GetKnightLimitBreakdown( GetPlayer.Self )]"
  KNIGHT_EFFECTIVENESS:1 "Hiệu quả của $knight_culture_player_no_tooltip$: #high [GetPlayer.GetKnightEffectiveness|%0]#!"
  KNIGHT_EFFECTIVENESS_TOOLTIP:2 "#T [knight_effectiveness|E]: [GetPlayer.GetKnightEffectiveness|V%0]#!\nCơ bản: #V 100%#!\n[GetPlayer.GetKnightEffectivenessBreakdown]"
  KNIGHTS_VIEW_TITLE_FORBID_TT:2 "#T Cấm [Character.GetShortUIName] trở thành $knight_culture_player$#!\n\n[Character.GetShortUIName] sẽ #emphasis không bao giờ#! tham gia [armies|E] của Ngài với tư cách là $knight_culture_player_no_tooltip$. Điều này giúp [Character.GetHerHim] an toàn, tránh tử trận trong [battle|E]."
  CREATE_ACCOLADE_FORBID_TT: "#T Cấm [CreateAccoladeView.GetSelectedKnight.GetShortUIName] trở thành $knight_culture_player$#!\n\n[CreateAccoladeView.GetSelectedKnight.GetShortUIName] sẽ #emphasis không bao giờ#! tham gia vào [armies|E] của Ngài với tư cách là một $knight_culture_player_no_tooltip$. Điều này giúp giữ cho [CreateAccoladeView.GetSelectedKnight.GetHerHim] an toàn, tránh khỏi cái chết trong [battle|E]."
  KNIGHTS_VIEW_TITLE_BY_PROWESS_TT:2 "#T Cho phép [Character.GetShortUIName] trở thành $knight_culture_player$#!\n\n[Character.GetShortUIName] có thể tham gia [armies|E] của Ngài với tư cách là $knight_culture_player_no_tooltip$ nếu [prowess|E] của [Character.GetHerHis] nằm trong số những người cao nhất trong [realm|E]"
  CREATE_ACCOLADE_BY_PROWESS_TT:2 "#T Cho phép [CreateAccoladeView.GetSelectedKnight.GetShortUIName] trở thành $knight_culture_player$#!\n\n[CreateAccoladeView.GetSelectedKnight.GetShortUIName] có thể tham gia [armies|E] của Ngài với tư cách là $knight_culture_player_no_tooltip$ nếu [prowess|E] của [CreateAccoladeView.GetSelectedKnight.GetHerHis] nằm trong số những người cao nhất trong [realm|E]"
  KNIGHTS_VIEW_TITLE_FORCE_TT:2 "#T Ép buộc [Character.GetShortUIName] trở thành $knight_culture_player$#!\n\n[Character.GetShortUIName] #emphasis bắt buộc#! phải tham gia [armies|E] của Ngài với tư cách là $knight_culture_player_no_tooltip$, bất kể [prowess|E] của [Character.GetHerHis]. [Character.GetSheHe|U] có thể thay thế một $knight_culture_player_no_tooltip$ có Prowess cao hơn."
  CREATE_ACCOLADE_FORCE_TT: "#T Ép buộc [CreateAccoladeView.GetSelectedKnight.GetShortUIName] trở thành $knight_culture_player$#!\n\n[CreateAccoladeView.GetSelectedKnight.GetShortUIName] #emphasis bắt buộc#! phải tham gia [armies|E] của Ngài với tư cách là $knight_culture_player_no_tooltip$, bất kể [prowess|E] của [CreateAccoladeView.GetSelectedKnight.GetHerHis]. [CreateAccoladeView.GetSelectedKnight.GetSheHe|U] có thể thay thế một $knight_culture_player_no_tooltip$ có Prowess cao hơn."
  KNIGHTS_CURRENT_MAX:0 "[GetKnightCount( GetPlayer.Self )|V]/[GetKnightLimit( GetPlayer.Self )|V]"
