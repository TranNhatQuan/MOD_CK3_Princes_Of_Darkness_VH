  KNIGHT_RESTRICTIONS: "Các hạn chế khác được áp dụng"
 
 # this is can_be_knight_trigger in 00_war_and_peace_triggers.txt
  KNIGHT_RESTRICTIONS_TT: "#T Hạn chế Hiệp sĩ#!\nChỉ những [vassals|e], [courtiers|e] hoặc [followers|e] trực thuộc mới có thể làm [knights|e].\n[culture|e] hoặc [faith|e] của Ngài quyết định giới tính nào có thể trở thành [knights|e].\n\nMột Hiệp sĩ không thể là:\n - Người chơi, [child|e], [prisoner|e] hoặc người bị [GetTrait('incapable').GetName(GetPlayer.Self)]\n - Thành viên [clergy|e] (trừ khi [faith|e] hoặc [culture|e] cho phép)\n - [master_assassin|e] hoặc bị [GetTrait('blind').GetName(GetPlayer.Self)] (trừ khi [culture|e] cho phép hoặc họ là một [GetTrait('order_member').GetName(GetPlayer.Self)])\n - [diarch|e] hoặc [ceremonial_liege|e]\n - [governor|e] của một [duchy|e] (hoặc [title|e] cao hơn) hoặc [house_head|e] của một [noble_family|e]\n\nCác [traditions|e] văn hóa và sự kiện có thể bãi bỏ một số hạn chế này"
 
  KP_CULTURE_MINIMUM_PROWESS: "@alert_icon! [culture|e] của Ngài yêu cầu ít nhất 12 [prowess|e]"
  KP_CULTURE_ADMIN_FAMILY_KNIGHTS: "@check_icon! [culture|e] của Ngài bãi bỏ một số hạn chế về giới tính trong các cuộc [wars|e] phòng thủ"
  KP_CULTURE_HIGH_PROWESS: "@check_icon! [culture|e] của Ngài bãi bỏ hầu hết các hạn chế đối với những [knights|e] có ít nhất 10 [prowess|e]"
