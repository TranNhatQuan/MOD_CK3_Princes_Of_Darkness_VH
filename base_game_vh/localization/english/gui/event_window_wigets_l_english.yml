  event_window_widget_harrying: "Mức [harrying_resistance|E] hiện tại: [Character.MakeScope.Var('resistance_gui').GetValue|1V]\nMức [harrying_pacification|E] hiện tại: [Character.MakeScope.Var('pacification_gui').GetValue|1V]"
  event_window_widget_harrying_tooltip: "Cuộc đối đầu dai dẳng giữa cái mới và cái cũ đã dẫn đến một cuộc chiến không tuyên bố lan rộng khắp nước Anh, khi các thống trị Norman mới phản ứng bằng những biện pháp trừng phạt khắc nghiệt trước các hành động khiêu khích của giới quý tộc Anglo-Saxon bị phế truất.\n\nKhi tình hình tiếp diễn, các hành động của họ và những nhân vật khác sẽ chi phối mức [harrying_resistance|E] và [harrying_pacification|E] của khu vực.\n\n#TS #EMP [resistance|E]#! cao hơn sẽ dẫn đến:#!\n$EFFECT_LIST_BULLET$Giảm [cultural_acceptance|E]\n$EFFECT_LIST_BULLET$Giảm [county_control|E]\n$EFFECT_LIST_BULLET$Tăng khả năng xuất hiện [claimant_factions|E] hoặc thậm chí là [civil_war|E].\n\n#TS #EMP [harrying_pacification|E]#! cao hơn sẽ dẫn đến:#!\n$EFFECT_LIST_BULLET$Tăng [cultural_acceptance|E]\n$EFFECT_LIST_BULLET$Tăng [county_control|E]\n$EFFECT_LIST_BULLET$Giảm khả năng xuất hiện [claimant_factions|E]."
  event_window_widget_harrying_tooltip_widget: "Chỉ báo [harrying_widget_i]Cuộc tàn phá miền Bắc theo dõi các giá trị [harrying_resistance|E] và [harrying_pacification|E]. Chúng ảnh hưởng đến hai nhóm chính trong khu vực: người cai trị Norman của nước Anh và bất kỳ chư hầu Anglo-Saxon cấp [duke|E] nào mà họ có.\n\n[harrying_resistance|E] cao hơn thể hiện sự kháng cự của người Anglo-Saxon trước sự chiếm đóng của Norman, và các mức cao có thể dẫn đến giảm [cultural_acceptance|E] Anglo-Saxon/Norman, giảm [county_control|E], tăng khả năng xuất hiện [claimant_factions|E] hoặc thậm chí là [civil_war|E].\n\n[harrying_pacification|E] cao hơn có thể dẫn đến tăng [cultural_acceptance|E] Anglo-Saxon/Norman, tăng [county_control|E] và giảm khả năng xuất hiện [claimant_factions|E]."
  event_window_widget_peasant_leader_support: "Các hạt bất ổn mà Ngài ủng hộ"
  event_window_widget_peasant_leader_control: "Các hạt dưới sự kiểm soát của Thống chế"
  event_window_widget_peasant_leader: "$event_window_widget_peasant_leader_support$: [Character.MakeScope.Var('support_gui').GetValue|0]/[Character.MakeScope.Var('num_of_corrupt_counties_gui').GetValue|0]\n$event_window_widget_peasant_leader_control$: [Character.MakeScope.Var('control_gui').GetValue|0]/[Character.MakeScope.Var('num_of_corrupt_counties_gui').GetValue|0]"
  event_window_widget_peasant_leader_tooltip: "Nông dân địa phương luôn trong cuộc đấu tranh không ngừng với các lãnh chúa của họ. Với tư cách là một [adventurer|E], Ngài chỉ là người ngoài cuộc. Tuy nhiên, nếu muốn, Ngài có thể tự mình hành động. Hãy quyết định ai đúng ai sai, chọn phe và ủng hộ nó."
  event_window_widget_peasant_leader_tooltip_widget: "Nhắc nhở về số lượng [counties|E] mà Ngài đã quyết định ủng hộ hoặc kiểm soát. Nếu dẫn đến chiến tranh, nông dân từ tất cả các hạt được Ngài ủng hộ sẽ gia nhập quân kỳ của Ngài!"
