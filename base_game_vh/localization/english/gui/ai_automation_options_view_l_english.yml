l_english:
  ARMY_AUTOMATION_FEATURE_NAME: "Quân đội Tự động"
  AOV_HEADING: "Cài đặt $ARMY_AUTOMATION_FEATURE_NAME$"
  AOV_APPLY: "$BARBERSHOP_APPLY$"
  AOV_SET_TO_DEFAULT: "$CHARACTER_RESET_FILTERS$"
  AOV_SET_TO_DEFAULT_TT: "[AddLocalizationIf( ArmyAutomationOptionsView.AreDisplayedSettingsDefault, 'AOV_SET_TO_DEFAULT_TT_CONTENT' )]"
  AOV_SET_TO_DEFAULT_TT_CONTENT: "@warning_icon! #X Các cài đặt đã ở trạng thái mặc định#!"
  AOV_COMPANION_OFF_WARNING: "@alert_icon! Các cài đặt này sẽ không có hiệu lực khi $ARMY_AUTOMATION_FEATURE_NAME$ bị tắt"
  AOV_AUTOMATED: "Tự động"
  AOV_MANUAL: "Thủ công"
  AOV_OPT_COMMANDERS: "Chỉ định Chỉ huy"
  AOV_OPT_COMMANDERS_NOT_PLAYERS: "Giới hạn"
  AOV_OPT_COMMANDERS_NOT_PLAYERS_TT: "#T Chỉ định $game_concept_commander$ (Giới hạn)\n#![commanders|E] được tự động chỉ định cho [armies|E] của Ngài, nhưng Ngài sẽ không bao giờ được chỉ định làm $game_concept_commander$"
  AOV_OPT_COMMANDERS_AUTOMATED_TT: "#T Chỉ định $game_concept_commander$ Tự động\n#![commanders|E] được tự động chỉ định cho [armies|E] của Ngài"
  AOV_OPT_COMMANDERS_MANUAL_TT: "#T Chỉ định $game_concept_commander$ Thủ công\n#!Ngài phải tự tay chỉ định [commanders|E] cho [armies|E] của mình"
  AOV_OPT_WAR_STANCE: "Tư thế Chiến tranh"
  AOV_OPT_WAR_STANCE_DEFAULT: "Thích ứng"
  AOV_OPT_WAR_STANCE_DEFAULT_TT: "#T Tư thế Thích ứng\n#![armies|E] của Ngài sẽ hành động tấn công hoặc phòng thủ tùy theo tình huống"
  AOV_OPT_WAR_STANCE_OFFENSIVE: "Tấn công"
  AOV_OPT_WAR_STANCE_OFFENSIVE_TT: "#T Tư thế Tấn công\n#![armies|E] của Ngài sẽ luôn hành động theo hướng tấn công"
  AOV_OPT_WAR_STANCE_DEFENSIVE: "Phòng thủ"
  AOV_OPT_WAR_STANCE_DEFENSIVE_TT: "#T Tư thế Phòng thủ\n#![armies|E] của Ngài sẽ luôn hành động theo hướng phòng thủ"
  AOV_OPT_RAIDING: "Cướp phá"
  AOV_OPT_RAIDING_AUTOMATED_TT: "#T Cướp phá Tự động\n#![armies|E] [raider|E] của Ngài sẽ tự động tập hợp và tiến hành $game_concept_raids$"
  AOV_OPT_RAIDING_MANUAL_TT: "#T Cướp phá Thủ công\n#!Ngài tự điều khiển và tập hợp [armies|E] [raider|E] của mình"
  AOV_OPT_BARTERING: "Trao đổi"
  AOV_OPT_BARTERING_AUTOMATED_TT: "#T Trao đổi Tự động\n#![armies|E] [barterer|E] của Ngài sẽ tự động tập hợp và thực hiện các nhiệm vụ $game_concept_barter$"
  AOV_OPT_BARTERING_MANUAL_TT: "#T Trao đổi Thủ công\n#!Ngài tự điều khiển và tập hợp [armies|E] [barterer|E] của mình"
  AOV_OPT_HIRING: "Thuê Quân"
  AOV_OPT_HIRING_FULL: "Thuê và Gia hạn"
  AOV_OPT_HIRING_FULL_TT: "#T Thuê Quân Tự động\n#![mercenaries|E], [holy_orders|E] và [provincial_armies|E] sẽ được trả phí tự động, và [mercenary_contracts|E] sẽ được gia hạn nếu cần cho nỗ lực chiến tranh"
  AOV_OPT_HIRING_EXTEND: "Chỉ Gia hạn"
  AOV_OPT_HIRING_EXTEND_TT: "#T Tự động Gia hạn Hợp đồng Đánh thuê\n#![mercenary_contracts|E] sẽ được gia hạn nếu cần cho nỗ lực chiến tranh"
  AOV_OPT_HIRING_MANUAL_TT: "#T Thuê Quân Thủ công\n#!Ngài phải tự trả phí cho [mercenaries|E], [holy_orders|E] và [provincial_armies|E]"

  MV_AUTOMATION_TOGGLE_TT: "[SelectLocalization( GetPlayer.HasCompanionAI, 'MV_AUTOMATION_TOGGLE_TT_ON', 'MV_AUTOMATION_TOGGLE_TT_OFF' )]"
  MV_AUTOMATION_TOGGLE_TT_ON: "#T $ARMY_AUTOMATION_FEATURE_NAME$: #V Bật#!\n#!$MV_AUTOMATION_TOGGLE_TT_DESC$\n\n#I Nhấp để tắt tự động hóa#!"
  MV_AUTOMATION_TOGGLE_TT_OFF: "#T $ARMY_AUTOMATION_FEATURE_NAME$: #V Tắt#!\n#!$MV_AUTOMATION_TOGGLE_TT_DESC$\n\n#I Nhấp để bật tự động hóa#!"
  MV_AUTOMATION_TOGGLE_TT_DESC: "[SelectLocalization(GetPlayer.HasDefaultCompanionAISettings, 'MV_AUTOMATION_TOGGLE_TT_DEFAULT_DESC' , 'MV_AUTOMATION_TOGGLE_TT_CUSTOM_DESC')]"
  MV_AUTOMATION_TOGGLE_TT_DEFAULT_DESC: "Khi bật, [armies|E] của Ngài sẽ tự động được tập hợp và chiến đấu với kẻ thù, đồng thời tự chỉ định [commanders|E].\n\nNgài vẫn phải tự mua [men_at_arms|E], thuê [mercenaries|E] và tiến hành [raids|E].\n\n#help Quân đội Tự động được thiết kế cho người chơi chưa quen với chiến tranh, hoặc muốn tập trung vào các khía cạnh khác. Nếu Ngài là người chơi có kinh nghiệm, chúng Ta khuyến nghị Ngài tự điều khiển quân đội.#!"
  MV_AUTOMATION_TOGGLE_TT_CUSTOM_DESC: "Khi bật, [armies|E] của Ngài sẽ tự hành động, nhưng bị giới hạn bởi các cài đặt Ngài đã chọn."

  MV_AUTOMATION_SETTINGS_TT: "#T Mở $AOV_HEADING$\n#!Thay đổi hành vi mặc định của $ARMY_AUTOMATION_FEATURE_NAME$"
