l_english:
  SELECT_CHARACTER_ON_MAP:0 "Chọn một nhân vật trên bản đồ."
  PICK_ANY_CHARACTER:5 "Chơi với bất kỳ người cai trị nào vào năm #bold [GameSetup.GetSelectedBookmark.GetDate.GetYear]#!, hoặc #bold tự tạo nhân vật của riêng Ngài!#!"
  BOOKMARK_DISABLED:0 "Mốc thời gian này đã bị vô hiệu hóa"
  BOOKMARK_NOT_PICKED_CHARACTER:0 "Hãy chọn một nhân vật trong mốc thời gian trước khi bắt đầu trò chơi. Hoặc, chọn tự do bằng cách nhấn 'Chọn bất kỳ nhân vật nào'."
  SINGLEPLAYER:0 "Chơi đơn"

  GAMESETUP_TUTORIAL_PROMPT_HEADER:1 "Chào mừng đến với Crusader Kings III"
  GAMESETUP_TUTORIAL_PROMPT_INTRO:0 "Crusader Kings III là một trò chơi chiến thuật chiều sâu về triều đại và âm mưu!"
  GAMESETUP_TUTORIAL_PROMPT_RECOMMEND:0 "Nếu Ngài mới đến với thế giới Crusader Kings, chúng Ta đặc biệt khuyên Ngài nên chơi phần hướng dẫn."
  GAMESETUP_TUTORIAL_PROMPT_ABOUT_RULER: "$GAMESETUP_TUTORIAL_PROMPT_ABOUT_RULER_EXTRA$"
  GAMESETUP_TUTORIAL_PROMPT_ABOUT_IRISH_CHARACTER:0 "Ireland bị chia cắt giữa nhiều tiểu vương và lãnh chúa phong kiến.\n\nTrong vai [BookmarkCharacter.GetName|V], [BookmarkCharacter.GetTitleName], hãy dẫn dắt Triều đại của Ngài, thống nhất các vùng đất và trở thành Vua của Ireland!"
  GAMESETUP_TUTORIAL_PROMPT_ABOUT_CHINESE_RULER:0 "Trong bộ máy quan liêu của đế quốc Trung Hoa, chỉ những người xuất sắc nhất mới được chọn làm quan cai trị.\n\n[BookmarkCharacter.GetName|V] có tiềm năng trở thành một thi nhân và quan lại kiệt xuất. Biết đâu một ngày nào đó, hậu duệ của ông sẽ thống trị toàn cõi Trung Hoa?"
  GAMESETUP_TUTORIAL_PROMPT_ABOUT_RULER_EXTRA:0 "[SelectLocalization( BookmarkCharacter.GetGovernmentType.IsType( 'celestial_government' ), 'GAMESETUP_TUTORIAL_PROMPT_ABOUT_CHINESE_RULER', 'GAMESETUP_TUTORIAL_PROMPT_ABOUT_IRISH_CHARACTER' )]"
  GAMESETUP_TUTORIAL_PROMPT_ASK:0 "Học cách chơi với [BookmarkCharacter.GetName]"

