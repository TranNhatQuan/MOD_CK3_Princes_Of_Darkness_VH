  debug_9601.t:0 "Chó Không Thể Ngước Nhìn"
  debug_9601.desc:0 "Bản thân nỗi đau đã là quan trọng, nó được theo đuổi bởi sự thích nghi của các quy trình. Trong lớp vỏ của chiếc bình, sự chăm sóc đối với cái giá của sự hỗn loạn là cần thiết. Thời gian của cuộc đời trôi qua, ai đó sẽ mang theo khối lượng của những nỗi niềm lo âu, dù cho nó có nằm ở nơi đâu đi nữa.\n\nCho đến khi những liên kết của môi trường không còn lớn lao để duy trì sự sống. Cho đến khi sự xấu xí của vị trí, lớp vỏ của sự hạnh phúc, hay lớp màng của sự vĩ đại mất đi. Sự sống vận động theo dòng chảy của trí tuệ, nhưng những người bạn lại gây ra sự phiền tóai ở bên trong. Sự lo âu của sư tử, thời gian và sự tự do, những điều kiện cuối cùng đã từng tồn tại.\n\nCho đến khi chiếc bình chứa đầy những điều vụn vặt. Cho đến khi những mục tiêu của sự đau đớn được kết nối, những bài học đọc được từ sự sợ hãi, và không có gì là không thể. Mỗi người như một cánh cung ở nơi ngăn cách, đến và đi giữa sự ưu tú. Giai đoạn của sự sợ hãi không nằm ở cánh cổng của những lời nói. Ngay cả khi sự thù ghét hay sự đau đớn của chiếc cổng không nằm trong sự héo úa. Sự sống là vậy."
  debug_9601.a:0 "Chó không thể"
  debug_9601.b:0 "Chó có thể"
  debug_9601.c:0 "Đúng nhưng mèo thì sao"
  debug_9601.d:0 "Ta không đồng ý với loài vật"

