   test.4.title:0 "Dữ liệu bệnh tật"
   test.4.desc:0 "Tổng số nhân vật: [ROOT.Var('local_copy_disease_data_global_character_amount').GetValue]\nSố ca tử vong sớm do bệnh (tuổi < 60): [ROOT.Var('local_copy_disease_data_global_premature_death_amount').GetValue]\nTỷ lệ tử vong sớm do bệnh: [ROOT.Var('disease_data_calc_premature_disease_death_percentage').GetValue]%\n\nBỆNH THÔNG THƯỜNG:\nTỷ lệ mắc bệnh thông thường: [ROOT.Var('disease_data_calc_common_disease_percentage').GetValue]%\nTỷ lệ mắc bệnh ốm (ill): [ROOT.Var('disease_data_calc_ill_percentage').GetValue]%\nTỷ lệ tử vong sớm do ốm (ill): [ROOT.Var('disease_data_calc_ill_premature_death_chance').GetValue]%\nTỷ lệ mắc viêm phổi (pneumonic): [ROOT.Var('disease_data_calc_pneumonic_percentage').GetValue]%\nTỷ lệ tử vong sớm do viêm phổi (pneumonic): [ROOT.Var('disease_data_calc_pneumonic_premature_death_chance').GetValue]%\n\nBỆNH NGHIÊM TRỌNG:\nTỷ lệ mắc bệnh nghiêm trọng: [ROOT.Var('disease_data_calc_serious_disease_percentage').GetValue]%\nTỷ lệ mắc bệnh gout (gout_ridden): [ROOT.Var('disease_data_calc_gout_ridden_percentage').GetValue]%\nTỷ lệ tử vong sớm do gout (gout_ridden): [ROOT.Var('disease_data_calc_gout_ridden_premature_death_chance').GetValue]%\nTỷ lệ mắc bệnh phong (leper): [ROOT.Var('disease_data_calc_leper_percentage').GetValue]%\nTỷ lệ tử vong sớm do bệnh phong (leper): [ROOT.Var('disease_data_calc_leper_premature_death_chance').GetValue]%\nTỷ lệ mắc thương hàn (typhus): [ROOT.Var('disease_data_calc_typhus_percentage').GetValue]%\nTỷ lệ tử vong sớm do thương hàn (typhus): [ROOT.Var('disease_data_calc_typhus_premature_death_chance').GetValue]%\nTỷ lệ mắc lao phổi (consumption): [ROOT.Var('disease_data_calc_consumption_percentage').GetValue]%\nTỷ lệ tử vong sớm do lao phổi (consumption): [ROOT.Var('disease_data_calc_consumption_premature_death_chance').GetValue]%\nTỷ lệ mắc ung thư (cancer): [ROOT.Var('disease_data_calc_cancer_percentage').GetValue]%\nTỷ lệ tử vong sớm do ung thư (cancer): [ROOT.Var('disease_data_calc_cancer_premature_death_chance').GetValue]%\nTỷ lệ mắc giang mai (lovers_pox): [ROOT.Var('disease_data_calc_lovers_pox_percentage').GetValue]%\nTỷ lệ tử vong sớm do giang mai (lovers_pox): [ROOT.Var('disease_data_calc_lovers_pox_premature_death_chance').GetValue]%\nTỷ lệ mắc đại giang mai (great_pox): [ROOT.Var('disease_data_calc_great_pox_percentage').GetValue]%\nTỷ lệ tử vong sớm do đại giang mai (great_pox): [ROOT.Var('disease_data_calc_great_pox_premature_death_chance').GetValue]%\nTỷ lệ mắc đậu mùa (smallpox): [ROOT.Var('disease_data_calc_smallpox_percentage').GetValue]%\nTỷ lệ tử vong sớm do đậu mùa (smallpox): [ROOT.Var('disease_data_calc_smallpox_premature_death_chance').GetValue]%\nTỷ lệ mắc dịch hạch (bubonic_plague): [ROOT.Var('disease_data_calc_bubonic_plague_percentage').GetValue]%\nTỷ lệ tử vong sớm do dịch hạch (bubonic_plague): [ROOT.Var('disease_data_calc_bubonic_plague_premature_death_chance').GetValue]%\n\nhej[a_value.GetName]hey"

