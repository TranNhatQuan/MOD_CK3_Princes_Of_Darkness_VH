 ##################################################
 # Misc Loc
 ## Titles
  single_combat.0000.t:0 "Đấu tay đôi:"
  single_combat.0001.t:0 "$single_combat.0000.t$ [sc_attacker.GetTitledFirstNameNoTooltip]"
  single_combat.0011.t:0 "$single_combat.0000.t$ [sc_defender.GetTitledFirstNameNoTooltip]"
  single_combat.0031.t:0 "$single_combat.0000.t$ Thua!"
  single_combat.0041.t:0 "$single_combat.0000.t$ Thắng!"

 ## Intro Spiels
  single_combat.0001.desc.sc_defender.intro:1 "[sc_attacker.GetTitledFirstName] và Ta đi vòng quanh nhau, cân nhắc các phương án. [sc_attacker.GetSheHe|U] [sc_attacker.Custom('SignatureWeaponActionThirdPerson')] một [sc_attacker.Custom('SignatureWeaponNameOrType')] đáng sợ, trong khi Ta nắm chặt [sc_defender.Custom('SignatureWeaponNameOrType')] của mình. Vũ khí chết người cảm giác mát lạnh và nặng tay trong tay Ta.\n\n"
  single_combat.0001.desc.capstone.intro.first_blood:0 "Cuộc chiến này có thể chỉ tới vết máu đầu tiên, nhưng điều đó không làm Ta bớt căng thẳng."
  single_combat.0001.desc.capstone.intro.deadly:0 "Chỉ có một người rời khỏi đây hôm nay, và Ta muốn đó là Ta."
  single_combat.0001.desc.sc_attacker.intro:1 "Trong vài khoảnh khắc ngắn ngủi, [sc_defender.GetTitledFirstName] và Ta đi những vòng vòng lười biếng, mỗi người tìm cơ hội. Ta [sc_attacker.Custom('SignatureWeaponAction')] [sc_attacker.Custom('SignatureWeaponNameOrType')] của mình, sẵn sàng phòng thủ, trong khi [sc_defender.GetSheHe] nắm chặt [sc_defender.GetHerHis] [sc_defender.Custom('SignatureWeaponNameOrType')] trong tay."
  single_combat.0001.desc.sc_attacker.intro.epilogue:1 "\n\nVới một cử động bất ngờ, cuộc đấu bắt đầu.\n\n"
