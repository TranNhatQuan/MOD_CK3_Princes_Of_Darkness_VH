  single_combat.0031.a.best_friend:0 "[sc_loser_best_friend.GetFirstNameNoTooltip], #DIE1 trả thù giúp Ta#! #DIE2 nhé#!..."
  single_combat.0031.a.killed_by_rival:0 "Ta luôn... #DIE1 ghét ngươi#! #DIE2 [sc_victor.GetFirstNameNoTooltip]#!..."
  single_combat.0031.a.killed_by_nemesis:0 "Ta nguyền rủa ngươi, [sc_victor.GetFirstNameNoTooltip]. Ngươi #DIE1 và cả nhà ngươi#! #DIE2 toàn bộ nhà ngươi#!..."
  single_combat.0031.a.killed_by_spouse:0 "Cái chết... #DIE1 sẽ chia lìa chúng ta,#! #DIE2 phải không?#!"
  single_combat.0031.a.killed_by_your_head_of_faith:0 "Đây có phải là #DIE1 ý muốn của [sc_victor.GetFaith.HighGodNamePossessive]#! #DIE2 không?#!"
  single_combat.0031.a.killed_by_another_head_of_faith:0 "[sc_loser.GetFaith.HighGodName] #DIE1 mỉm cười với Ta,#! #DIE2 [sc_victor.GetTitleAsNameNoTooltip], ngươi có thể nói như vậy không#!..."
  single_combat.0031.a.killed_by_cultural_head:0 "Ngươi không phải là #DIE1 người thật sự#! #DIE2 [sc_loser.GetCulture.GetNameNoTooltip]#!..."
  single_combat.0031.a.killed_by_house_head:0 "Ngươi sẽ dẫn #DIE1 Nhà [sc_loser.GetHouse.GetName]#! #DIE2 đến diệt vong#!..."
  single_combat.0031.a.killed_by_dynasty_head:0 "Tốt hơn #DIE1 [sc_loser.GetHouse.GetName]#! #DIE1 còn hơn [sc_loser.GetDynasty.GetBaseNameNoTooltip]#!..."
  single_combat.0031.a.killed_by_close_or_extended_family:0 "Ngươi không phải là #DIE1 [sc_loser.Custom2('RelationToMeShort', sc_victor)]#! #DIE2 của Ta#!..."
  single_combat.0031.a.killed_by_friend_or_lover:0 "Nhưng, #DIE1 [sc_victor.GetFirstNameNoTooltip]#!... #DIE2 tại sao#!..."
  single_combat.0031.a.killed_by_soulmate:0 "Tình yêu của chúng ta... #DIE1 lẽ ra phải tồn tại#!... #DIE2 mãi mãi#!..."
  single_combat.0031.a.killed_by_best_friend:0 "Ngươi đã từng là... #DIE1 [Select_CString(sc_victor.IsFemale,'chị gái','anh trai')] của ta, [sc_victor.GetFirstNameNoTooltip]#!... #DIE2 ta yêu ngươi#!..."
  single_combat.0031.b:0 "Đầu hàng! Đầu hàng!"
  single_combat.0031.c:0 "Ngươi sẽ hối hận ngày đánh bại [sc_loser.GetTitledFirstNameNoTooltip]!"

