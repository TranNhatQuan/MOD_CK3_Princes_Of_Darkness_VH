 ##################################################
 # Status Update Fragments
 ## Own Duel Success Fragments
  single_combat.0001.desc.injury_check.personal.very_unlikely:0 "\n\nPhong độ của Ta tuyệt vời, gần như không có lỗi,"
  single_combat.0001.desc.injury_check.personal.unlikely:0 "\n\nPhong độ của Ta tốt, chỉ vài lỗi nhỏ,"
  single_combat.0001.desc.injury_check.personal.moderate:0 "\n\nPhong độ của Ta tạm ổn, có vài sơ hở,"
  single_combat.0001.desc.injury_check.personal.likely:0 "\n\nPhong độ của Ta đang xấu đi nhanh, có nhiều khoảng hở để khai thác,"
  single_combat.0001.desc.injury_check.personal.very_likely:0 "\n\nPhong độ của Ta gần như không còn, bước sai tiếp theo có thể dẫn đến thất bại,"

 ## Opponent Duel Success Fragments
  single_combat.0001.desc.injury_check.opponent.very_unlikely:0 "và tư thế của [my_foe.GetFirstNamePossessiveNoTooltip] tuyệt vời."
  single_combat.0001.desc.injury_check.opponent.unlikely:0 "và tư thế của [my_foe.GetFirstNamePossessiveNoTooltip] đáng gờm."
  single_combat.0001.desc.injury_check.opponent.moderate:0 "và tư thế của [my_foe.GetFirstNamePossessiveNoTooltip] tạm ổn."
  single_combat.0001.desc.injury_check.opponent.likely:0 "và tư thế của [my_foe.GetFirstNamePossessiveNoTooltip] đang thất bại."
  single_combat.0001.desc.injury_check.opponent.very_likely:0 "và tư thế của [my_foe.GetFirstNamePossessiveNoTooltip] thảm họa."

 ## Duel Success Each-Way Fragments
  single_combat.0001.desc.success_check.almost_impossible:0 "\n\nTa vẫn chưa tìm cách phá phòng thủ của đối thủ, chưa thấy cách để giành chiến thắng."
  single_combat.0001.desc.success_check.very_unlikely:0 "\n\nPhòng thủ của đối thủ rất chắc, Ta còn xa mới tới chiến thắng."
  single_combat.0001.desc.success_check.unlikely:0 "\n\nĐối thủ vẫn chống trả tốt, nhưng [my_foe.GetSheHe] có vẻ sắp sai lầm."
  single_combat.0001.desc.success_check.moderate:0 "\n\nChúng Ta cân sức, chiến thắng nằm trên lưỡi dao."
  single_combat.0001.desc.success_check.likely:0 "\n\nTa đang chiếm ưu thế, nhưng vẫn cần củng cố chiến thắng."
  single_combat.0001.desc.success_check.very_likely:0 "\n\nĐối thủ đang loạng choạng, chiến thắng gần đến mức Ta có thể nếm vị nó."
  single_combat.0001.desc.success_check.almost_certain:0 "\n\nChỉ một đòn chuẩn mực nữa là Ta chiến thắng."

