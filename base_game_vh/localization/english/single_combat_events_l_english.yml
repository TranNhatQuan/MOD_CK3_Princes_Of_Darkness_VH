 # Outcome Event: Victor
 ## Defender Won, Own Combat Move Feedback
  single_combat.0041.desc.sc_defender.wait_and_hope:0 "Chờ đối thủ ra đòn trước hóa ra lại hiệu quả bất ngờ."
  single_combat.0041.desc.sc_defender.unsure_attack:0 "Những đòn tấn công e dè của Ta cuối cùng hóa ra không cần thiết."
  single_combat.0041.desc.sc_defender.enthusiastic_onslaught:0 "Đòn [sc_victor.Custom('SignatureWeaponFlourishPresentParticiple')] đầy nhiệt huyết của ta dường như đã phát huy tác dụng."
  single_combat.0041.desc.sc_defender.hail_mary:0 "Rõ ràng, đòn tấn công toàn lực của Ta vừa đủ để thành công."
  single_combat.0041.desc.sc_defender.pocket_sand:0 "Việc ném [sc_defender.Custom('GritType')] hóa ra chỉ đủ để phân tâm đối thủ."
  single_combat.0041.desc.sc_defender.nut_em:0 "Húc đầu vào đối thủ dường như làm [sc_loser.GetHerHim] lúng túng."
  single_combat.0041.desc.sc_defender.guard:0 "Hàng phòng thủ của Ta vững chắc, giữ Ta an toàn trước đối thủ."
  single_combat.0041.desc.sc_defender.probing_attack:0 "Những đòn tấn công thăm dò của Ta đã mở ra vài điểm yếu."
  single_combat.0041.desc.sc_defender.onslaught:0 "Loạt [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] liên tiếp của ta chứng minh được hiệu quả."
  single_combat.0041.desc.sc_defender.surprise_attack:0 "Trong chiến đấu, bất ngờ thường thắng thế, và điều đó đúng trong tình huống này."
  single_combat.0041.desc.sc_defender.taunt:0 "Có vẻ như lời khiêu khích của Ta đã lấn át đối thủ."
  single_combat.0041.desc.sc_defender.put_the_boot_in:0 "Đòn đá thấp có vẻ hèn, nhưng lại hiệu quả."
  single_combat.0041.desc.sc_defender.strict_guard:0 "Chưa gì phá được hàng phòng thủ của Ta trước đây, và hôm nay cũng vậy."
  single_combat.0041.desc.sc_defender.confident_attack:0 "Sự tự tin mang lại năng lực, và những cú ra đòn của Ta chứng minh điều đó."
  single_combat.0041.desc.sc_defender.expert_onslaught:0 "Rất ít [sc_loser.GetWomenMen] có thể chịu đựng được loạt [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] của ta, và đối thủ của ta cũng không phải ngoại lệ."
  single_combat.0041.desc.sc_defender.attempt_disarm:0 "Ta hy vọng đánh lừa đối thủ, nhưng nỗ lực tước vũ khí của Ta lại thành công ngoài mong đợi."
 ### No need for a lightning_assault, as you can't end the duel in the first round.
  single_combat.0041.desc.sc_defender.tire_opponent:0 "Đánh lừa đối thủ khiến [sc_loser.GetHerselfHimself] kiệt sức hóa ra rất hiệu quả."
  single_combat.0041.desc.sc_defender.reason_you_suck_speech:0 "Sự tức giận của đối thủ dường như bị khơi dậy bởi lời nói của ta nhiều hơn là bởi [sc_victor.Custom('signature_weapon')] của ta."
  single_combat.0041.desc.sc_defender.technique_from_legend:0 "Đánh bại đối thủ dễ như kể lại một câu chuyện."
  single_combat.0041.desc.sc_defender.like_a_viper:0 "Ta lao tới tim đối thủ, suýt kết thúc trận đấu chỉ với một đòn."
  single_combat.0041.desc.sc_defender.pocket_silver:0 "Một lượng lớn bạc nện thẳng vào [sc_loser.Custom('MaskFace')] dường như mang lại hiệu quả kỳ diệu."
  single_combat.0041.desc.sc_defender.martial_voice:0 "Đối thủ của Ta hoàn toàn #EMP kinh hoàng#! trước những lời chửi thề của Ta."
  single_combat.0041.desc.sc_defender.mocking_boast:0 "Đối thủ của ta nghiến răng #EMP dữ dội#! trước những lời chế nhạo của ta."
  single_combat.0041.desc.sc_defender.is_that_a_crocodile:0 "Đối thủ chỉ vừa đủ để phòng thủ trước kẻ tấn công như loài bò sát của [sc_loser.GetHerHis]."
  single_combat.0041.desc.sc_defender.desert_warrior:0 "Cái nóng dường như làm đối thủ mệt mỏi nặng nề."
  single_combat.0041.desc.sc_defender.jungle_stalker:0 "Rừng rậm nhiều lần làm khó đối thủ của Ta."
  single_combat.0041.desc.sc_defender.open_terrain_expert:0 "Khoảng không rộng nơi chúng Ta chiến đấu giúp Ta dễ kiểm soát trận đấu."
  single_combat.0041.desc.sc_defender.rough_terrain_expert:0 "Địa hình gồ ghề này gây nhiều khó khăn cho đối thủ khi chiến đấu."
  single_combat.0041.desc.sc_defender.forest_fighter:0 "Khu rừng làm đối thủ chậm lại vừa đủ."
  single_combat.0041.desc.sc_defender.raaargh:0 "Ít người chịu nổi cơn thịnh nộ của Ta, và đối thủ cũng không ngoại lệ."
  single_combat.0041.desc.sc_defender.hard_grit:0 "Kinh nghiệm trả giá bằng mồ hôi máu mang lại kết quả khi được sử dụng khôn ngoan, và Ta sử dụng nó một cách đúng đắn."
  single_combat.0041.desc.sc_defender.feint_and_stab:0 "Mặc dù họ rút lui kịp lúc, cú đâm tay phụ của Ta suýt kết thúc trận đấu."
  single_combat.0041.desc.sc_defender.butchery:0 "Những đòn tấn công tàn nhẫn của Ta gây thiệt hại kinh khủng."
  single_combat.0041.desc.sc_defender.stoic_veteran:0 "Hàng phòng thủ không hề bị phá vỡ, không nơi này, không bao giờ."
  single_combat.0041.desc.sc_defender.blade_dance:0 "Ta chiến đấu như dòng nước chảy: linh hoạt, nhưng không thể tránh khỏi."
  single_combat.0041.desc.sc_defender.wrath_of_highgod:0 "Rõ ràng [sc_victor.GetFaith.HighGodName] đang mỉm cười với Ta."
  single_combat.0041.desc.sc_defender.hurt_me_better:0 "Đau đớn là đồng minh tốt nhất trong trận chiến, và nó đứng về phía #EMP Ta#!."
  single_combat.0041.desc.sc_defender.special_fallback:0 "Ít đối thủ nào ngờ đến cú đá gối chiến thuật."
  single_combat.0041.desc.sc_defender.something_to_hide:0 "Đối thủ dường như khiếp sợ trước những ám chỉ của Ta."

 ## Defender Won, Opponent Finishing Move Feedback
  single_combat.0041.desc.opponent_response.wait_and_hope:0 "Khi [sc_loser.GetFirstNameNoTooltip] chỉ đứng chết lặng tại chỗ, chính ta cũng gần như sững sờ! Nhưng nếu [sc_loser.GetSheHe] không định chiến đấu, điều đó cũng không thể ngăn ta lại, và ta lao tới với một [sc_victor.Custom('SignatureWeaponAttemptedHeavy')].\n\n"
  single_combat.0041.desc.opponent_response.unsure_attack:0 "[sc_loser.GetFirstNameNoTooltip] thử vài đòn [sc_loser.Custom('SignatureWeaponAttemptedLightPlural')] chiếu lệ, nhưng chẳng có gì mà ta không thể dễ dàng né tránh.\n\n"
  single_combat.0041.desc.opponent_response.enthusiastic_onslaught:0 "[sc_loser.GetFirstNameNoTooltip] lao thẳng về phía ta, hét lên những âm thanh vô nghĩa và [sc_loser.Custom('SignatureWeaponFlourishPresentParticiple')] [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')] với tất cả sự nhiệt huyết của một kẻ nghiệp dư tuyệt vọng.\n\n"
  single_combat.0041.desc.opponent_response.hail_mary:0 "[sc_loser.GetFirstNameNoTooltip] dồn toàn bộ bản thân vào một đòn tấn công được ăn cả ngã về không, [sc_loser.Custom('signature_weapon')] sẵn sàng giành chiến thắng hoặc chết cùng một loạt [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')].\n\nThật không may cho [sc_loser.GetHerHim],"
  single_combat.0041.desc.opponent_response.pocket_sand:0 "[sc_loser.GetFirstNameNoTooltip] cúi xuống nhặt một nắm [sc_defender.Custom('GritType')] từ mặt đất, nhưng khi [sc_loser.GetSheHe] định ném nó vào ta, một cơn gió thổi ngược nó trở lại thẳng vào [sc_loser.Custom('MaskFace')] của [sc_loser.GetHerHis].\n\n"
  single_combat.0041.desc.opponent_response.nut_em:0 "Táo bạo, [sc_loser.GetFirstNameNoTooltip] lao về phía Ta, [sc_loser.Custom('signature_weapon')] buông lỏng, rõ ràng định húc mạnh vào đầu Ta.\n\n"
  single_combat.0041.desc.opponent_response.guard:0 "[sc_loser.GetFirstNameNoTooltip] giữ phòng thủ khá tốt, nhưng không phải bất khả xâm. Cần chút nỗ lực, nhưng cuối cùng Ta cũng có thể"
  single_combat.0041.desc.opponent_response.probing_attack:0 "[sc_loser.GetFirstNameNoTooltip] cố giữ khoảng cách với ta bằng những đòn [sc_loser.Custom('SignatureWeaponAttemptedLightPlural')] cẩn thận. Khôn ngoan trong chốc lát, nhưng ngu ngốc về lâu dài, bởi điều đó trao cho ta quyền kiểm soát nhịp độ trận đấu.\n\nCuối cùng, ta có thể đỡ được một đòn đủ mạnh để"
  single_combat.0041.desc.opponent_response.onslaught:0 "[sc_loser.GetFirstNameNoTooltip] dồn toàn lực tấn công, trút xuống ta những [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')], khiến việc đỡ từng đòn trở thành một cơn ác mộng.\n\nChỉ nhờ bước sang bên đúng lúc trong khoảnh khắc chớp mắt, ta mới thoát khỏi cơn mưa đòn đánh,"
  single_combat.0041.desc.opponent_response.surprise_attack:0 "[sc_loser.GetFirstNameNoTooltip] cố thay đổi quỹ đạo cú vung tiếp theo giữa chừng, rõ ràng hy vọng khiến ta bất ngờ, nhưng ta kịp tung một cú đỡ chắc chắn khiến [sc_loser.GetHerHim] loạng choạng."
  single_combat.0041.desc.opponent_response.taunt:0 "[sc_loser.GetFirstNameNoTooltip] lùi lại, một nụ cười độc ác chắc hẳn sắp hiện lên trên khuôn mặt [sc_loser.GetHerHis]. Dù [sc_loser.GetSheHe] định buông lời chế nhạo gì, ta không muốn nghe, và theo phản xạ ta tung ra một đòn [sc_victor.Custom('SignatureWeaponAttemptedHeavy')].\n\n"
  single_combat.0041.desc.opponent_response.put_the_boot_in.peg_leg:0 "[sc_loser.GetFirstNameNoTooltip] đánh ta bằng một [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] dữ dội, tiếp nối cú đánh thành công bằng cách cố đá ta bằng chiếc chân giả của [sc_loser.GetHerHis].\n\nKhông suy nghĩ, ta giáng [sc_victor.Custom('SignatureWeaponEndType')] của [sc_victor.Custom('signature_weapon')] xuống mạnh đến mức chiếc chân giả bật ra, khiến đối thủ của ta ngã nhào xuống đất."
  single_combat.0041.desc.opponent_response.put_the_boot_in.fallback:0 "[sc_loser.GetFirstNameNoTooltip] đánh ta bằng một [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] dữ dội, tiếp nối cú đánh thành công bằng một cú đá. Ta né sang bên, tung một đòn [sc_victor.Custom('SignatureWeaponAttemptedLight')] vào lưng [sc_loser.GetHerHis] khi [sc_loser.GetSheHe] lướt qua, khiến đối thủ của ta ngã xuống đất.\n\n"
  single_combat.0041.desc.opponent_response.strict_guard:0 "Dù [sc_loser.GetFirstNameNoTooltip] còn có những điểm gì khác, [sc_loser.GetSheHe] cực kỳ giỏi trong việc giữ thế phòng thủ. Ta gần như chỉ nhờ may mắn mới có thể cuối cùng"
  single_combat.0041.desc.opponent_response.confident_attack:0 "[sc_loser.GetFirstNameNoTooltip] là một người sử dụng [sc_loser.Custom('signature_weapon')] thành thạo, nhưng mọi chiến binh đều phải chấp nhận rủi ro để chiến thắng, và chính giữa một trong những đòn [sc_loser.Custom('SignatureWeaponAttemptedLight')] nguy hiểm nhất ấy, ta"
  single_combat.0041.desc.opponent_response.expert_onslaught:0 "[sc_loser.GetFirstNameNoTooltip] chiến đấu như một [sc_loser.GetWomanMan] bị ám ảnh, liên tục tung ra cơn bão [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] không bao giờ dứt, ép ta phải lùi lại, rồi lại lùi lại.\n\nChỉ đến khi [sc_loser.GetSheHe] dừng lại một thoáng để tận hưởng chiến thắng sắp đến của [sc_loser.GetHerHis], thì"
  single_combat.0041.desc.opponent_response.attempt_disarm:0 "[sc_loser.GetFirstNameNoTooltip] lao vào ta, một cú [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] khủng khiếp suýt giật [sc_victor.Custom('signature_weapon')] khỏi tay ta, nhưng ta vẫn giữ vững và nghiêng người đón lấy đòn đánh.\n\nRõ ràng ta đã chặn vũ khí của [sc_loser.GetHerHis] ở một góc sai, bởi vì"
 ### No need for a lightning_assault, as you can't end the duel in the first round.
  single_combat.0041.desc.opponent_response.tire_opponent:0 "[sc_loser.GetFirstNameNoTooltip] liên tục giả vờ lao tới, dường như trao cho ta cơ hội tấn công, rồi lại nhanh chóng né tránh. Cảm nhận được cơ hội, ta càng tiến công mạnh mẽ hơn với từng [sc_victor.Custom('SignatureWeaponAttemptedLight')], cuối cùng đánh trúng [sc_loser.GetHerHim] nhiều lần.\n\n"
  single_combat.0041.desc.opponent_response.reason_you_suck_speech:0 "Ai cũng biết [sc_loser.GetFirstNameNoTooltip] là một nhà hùng biện, và nhìn vào thế đứng của [sc_loser.GetHerHis], rõ ràng [sc_loser.GetSheHe] sắp lợi dụng cơ hội này để giảng cho ta một bài học. Được thôi, đã đến lúc cho [sc_loser.GetHerHim] thấy một cái lưỡi khéo léo chống lại một [sc_victor.Custom('signature_weapon')] bằng thép sẽ ra sao.\n\n"
  single_combat.0041.desc.opponent_response.technique_from_legend:0 "[sc_loser.GetFirstNameNoTooltip] tạo dáng kịch tính một cách hơi gượng ép."
  single_combat.0041.desc.opponent_response.like_a_viper:0 "Nhanh đến mức ta gần như không kịp nhận ra kế hoạch của [sc_loser.GetHerHis], [sc_loser.GetFirstNameNoTooltip] lao #EMP vào bên trong#! thế phòng thủ của ta, [sc_loser.Custom('signature_weapon')] bay thẳng về phía tim ta. Ta chỉ có một khoảnh khắc ngắn ngủi để phản ứng trước cái chết chắc chắn.\n\n"
  single_combat.0041.desc.opponent_response.pocket_silver:0 "[sc_loser.GetFirstNameNoTooltip] chộp lấy thứ gì đó từ quanh eo [sc_loser.GetHerHis] rồi ném về phía ta. Trước khi ta kịp nhận ra đó là gì, ta theo phản xạ phá hủy nó bằng một [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], khiến một cơn mưa những đồng bạc nặng trút xuống kẻ thù.\n\nKhi đối thủ của ta tạm thời bị che mắt,"
  single_combat.0041.desc.opponent_response.martial_voice:0 "[sc_loser.GetFirstNameNoTooltip], dù vì giận dữ hay kiêu ngạo, quát mắng Ta như thể Ta là kẻ bình dân đầy bụi bẩn. Lông gáy Ta dựng đứng, nhưng Ta kiềm chế cho đến khi [sc_loser.GetSheHe] dừng lại hít một hơi sâu.\n\n"
  single_combat.0041.desc.opponent_response.mocking_boast:0 "[sc_loser.GetFirstNameNoTooltip] giữ khoảng cách, rút lui trước mọi đòn đánh của ta. Thay vào đó, [sc_loser.GetSheHe] liên tục buông những lời chế giễu về danh tiếng của ta cho đến khi sự kiên nhẫn của ta hoàn toàn cạn kiệt.\n\n\"Ngươi biết cách tốt để tạo dựng danh tiếng là gì không?\" ta hỏi, nhưng không nhận được câu trả lời. \"Giết một kẻ nổi tiếng.\"\n\nSự sửng sốt thoáng qua của [sc_loser.GetFirstNamePossessiveNoTooltip] là tất cả những gì ta cần để"
  single_combat.0041.desc.opponent_response.is_that_a_crocodile:0 "Không báo trước, [sc_loser.GetFirstNameNoTooltip] bắt đầu vội vã rút lui, trông như thể [sc_loser.GetSheHe] vừa nhìn thấy ma. Nghi ngờ đây là một âm mưu, ta không do dự nắm lấy cơ hội."
  single_combat.0041.desc.opponent_response.desert_warrior:0 "Cái nóng này, cái #EMP hao mòn#!, #EMP tiêu tốn#! nhiệt! Nó giết Ta từ từ, nhưng Ta vẫn kiên trì bằng ý chí thuần túy. [sc_loser.GetFirstNameNoTooltip] dường như hầu như không bị ảnh hưởng, nhưng vẫn tỏ ra ngạc nhiên trước sự kiên cường của Ta.\n\nKhi phòng thủ [sc_loser.GetHerHis] lơi ra một chút,"
  single_combat.0041.desc.opponent_response.jungle_stalker:0 "Dù khu rừng có thể là một nơi hỗn loạn để chiến đấu, [sc_loser.GetFirstNameNoTooltip] khiến mọi thứ trông #EMP dễ dàng#!. Ít nhất là cho đến khi [sc_loser.GetSheHe] bị chân mắc vào một dây leo.\n\n"
  single_combat.0041.desc.opponent_response.open_terrain_expert:0 "[sc_loser.GetFirstNameNoTooltip] chiến đấu tốt nhất ở nơi trống trải, và [sc_loser.GetSheHe] biết rõ điều đó, liên tục lùi bước khi có lợi cho [sc_loser.GetHerHim]. Điều này khiến trận đấu trở nên vô cùng khó chịu, cho đến khi ta nhìn thấy một tảng đá lớn, sắc nhọn gần đó, nằm ở độ cao #EMP vừa#! ngang với ống chân.\n\nKiên nhẫn, ta dẫn dụ kẻ thù của mình về phía chướng ngại nhỏ đó, đặt cược vào việc [sc_loser.GetHerHis] tái định vị đầy kiêu ngạo."
  single_combat.0041.desc.opponent_response.rough_terrain_expert.rocky:0 "[sc_loser.GetFirstNameNoTooltip] là chiến binh lão luyện trên đồi núi, thành thạo đánh nhau trên dốc, và [sc_loser.GetSheHe] không ngại khoe kỹ năng này. Nhiều lần Ta phải chuẩn bị cho cú đẩy mạnh nhằm hất Ta ngã xuống,\n\n"
  single_combat.0041.desc.opponent_response.rough_terrain_expert.boggy:0 "Ở vùng đầm lầy, [sc_loser.GetFirstNameNoTooltip] chiến đấu như chính [sc_victor.GetFaith.DevilName] [sc_victor.GetFaith.DevilHerselfHimself], liên tục đẩy ta xuống những vùng nước hôi thối của nơi này. May mắn cho ta, không có vũng nước nào quá sâu.\n\nThật trớ trêu, khi vũng nước đầm lầy đầu tiên mà [sc_loser.GetSheHe] dám bước vào lại nuốt chửng chân [sc_loser.GetHerHis] đến tận đầu gối.\n\n"
  single_combat.0041.desc.opponent_response.forest_fighter:0 "Dù [sc_loser.GetFirstNameNoTooltip] nổi tiếng là một [sc_loser.GetWomanMan] rừng thành thạo, không phải khu rừng nào cũng đem lại nhiều lợi thế.\n\nKhu rừng hiện tại nơi chúng ta đang giao chiến trông gần như thanh bình, và việc cố tìm cách tận dụng kinh nghiệm của [sc_loser.GetHerHis] rõ ràng trở thành một sự xao nhãng lớn đối với [sc_loser.GetFirstNameNoTooltip]."
  single_combat.0041.desc.opponent_response.raaargh:0 "[sc_loser.GetFirstNameNoTooltip] run rẩy, đứng yên trong vài giây căng thẳng, trước khi #EMP bùng nổ#! trong cơn thịnh nộ.\n\nMọi nỗi sợ hãi về sự an toàn của bản thân đều biến mất, kẻ cuồng chiến lao vào ta, xoáy thành một cơn lốc [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')], những cú đấm, cú đá và tiếng nghiến răng không thể kiểm soát.\n\n"
  single_combat.0041.desc.opponent_response.hard_grit:0 "[sc_loser.GetFirstNameNoTooltip] chiến đấu rất tốt, không nhường bước và không cho phép bất kỳ sai lầm nào. Mọi sơ hở đều bị khai thác, mọi điểm yếu đều phải trả giá bằng đau đớn và nỗ lực.\n\nChỉ bằng cách chơi thận trọng, đáp trả [sc_loser.GetHerHim] từng đòn một và không hơn, ta mới có thể theo kịp, chờ đến khi #EMP [sc_loser.GetSheHe]#! phạm sai lầm trước khi ta"
  single_combat.0041.desc.opponent_response.feint_and_stab:0 "[sc_loser.GetFirstNameNoTooltip] tung một đòn [sc_loser.Custom('SignatureWeaponAttemptedLight')] vào ta bằng [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')], nhưng có vẻ thiếu tập trung.\n\nKhông mất quá nhiều công sức để đánh bật vũ khí khỏi tay đối thủ, và chỉ đến lúc đó ta mới nhận ra ánh sáng của một con dao găm tay trái trong nắm tay còn lại của [sc_loser.GetHerHis]."
  single_combat.0041.desc.opponent_response.butchery:1 "Dù danh tiếng đáng sợ của [sc_loser.GetFirstNamePossessiveNoTooltip] là như thế nào, những [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] hung bạo của [sc_loser.GetHerHis] dường như... vụng về, nếu phải dùng một từ để mô tả. Chúng dễ dàng bị đỡ, và dù mỗi cú đánh đều đau đớn như [sc_victor.GetFaith.NegativeAfterLife], việc có vũ khí trong tay khiến kẻ cướp bóc đáng sợ này trở nên dễ đối phó hơn nhiều.\n\n"
  single_combat.0041.desc.opponent_response.stoic_veteran:0 "[sc_loser.GetFirstNameNoTooltip] sử dụng [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')] với tất cả sự thành thạo đặc trưng của một người Varangian, bổ xuống ta bằng những đòn dài và ổn định từ vũ khí của [sc_loser.GetHerHis]. Khó khăn, nhưng không phải điều mà ta không thể đỡ đủ tốt.\n\n"
  single_combat.0041.desc.opponent_response.blade_dance:0 "[sc_loser.GetFirstNameNoTooltip] có thể nổi tiếng vì kỹ năng với [sc_loser.Custom('SignatureWeaponArticle')] [sc_loser.Custom('signature_weapon')], nhưng rõ ràng [sc_loser.GetSheHe] quá say mê với chính khả năng của mình.\n\nChỉ một đòn [sc_victor.Custom('SignatureWeaponAttemptedLight')] đầy cơ hội vào tay cầm [sc_loser.Custom('signature_weapon')] của [sc_loser.GetHerHis] sau đó, thế đứng của [sc_loser.GetHerHis] đã hoàn toàn tan vỡ,"
  single_combat.0041.desc.opponent_response.wrath_of_highgod:0 "Vừa gào thét sự tận tâm của [sc_loser.GetHerHis] dành cho [sc_loser.GetFaith.HighGodName], [sc_loser.GetFirstNameNoTooltip] để tâm trí [sc_loser.GetHerHis] hoàn toàn rời khỏi trận đấu.\n\nVới một cái nhún vai nhanh chóng để thừa nhận sự kiêu ngạo nực cười của kẻ thù, ta bước tới và"
  single_combat.0041.desc.opponent_response.hurt_me_better:0 "Chỉ có [sc_victor.GetFaith.HealthGodName] mới biết chính xác biểu cảm trên khuôn mặt [sc_loser.GetFirstNameNoTooltip] lúc này là gì. Sợ hãi? Đau đớn? Ham muốn? Bối rối? Có lẽ ta sẽ chẳng bao giờ biết.\n\nDù là gì đi nữa, nó biến thành một chuỗi những [sc_loser.Custom('SignatureWeaponAttemptedLightPlural')] yếu ớt và vô hại,"
  single_combat.0041.desc.opponent_response.special_fallback:0 "Bất ngờ, [sc_loser.GetFirstNameNoTooltip] lao tới, đá mạnh ngay vào chỗ ống chân Ta #EMP vừa lúc# đứng. Ngạc nhiên vì phản ứng bất ngờ của Ta, đối thủ bay qua, hoàn toàn mất cân bằng.\n\n"
  single_combat.0041.desc.opponent_response.something_to_hide:0 "[sc_loser.GetFirstNameNoTooltip] đang nói dở một màn cố gắng đáng thương để khiến ta bất an, với giọng nói rùng rợn và những lời đe dọa hoa mỹ, thì ta mất kiên nhẫn và đập [sc_loser.GetHerHim] vào hàm bằng [sc_victor.Custom('SignatureWeaponEndType')] của [sc_victor.Custom('signature_weapon')].\n\n[sc_loser.GetSheHe|U] lập tức loạng choạng lùi lại,"

 ## Defender Won, Opponent Finishing Move Injury
  single_combat.0041.desc.opponent_response.wait_and_hope.injury:0 "Không có cú đỡ nào ngăn cản ta, không có cú né tránh nào thoát khỏi ta, và ta phải tự kéo mình lại vào khoảnh khắc cuối cùng để tránh [sc_victor.Custom2('SignatureWeaponKillTypeHeadThirdPersonPresentGendered',SCOPE.sC('sc_loser'))].\n\nThay vào đó, ta chỉ đặt [sc_victor.Custom('signature_weapon')] của mình lên đó. Một lần nữa, [sc_loser.GetFirstNameNoTooltip] đứng chết lặng, nhưng rõ ràng ta đã chiến thắng."
  single_combat.0041.desc.opponent_response.unsure_attack.injury:0 "Đánh cược vào sự rụt rè của [sc_loser.GetFirstNamePossessiveNoTooltip], ta lao tới bằng một đòn [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] khiến [sc_loser.GetHerHim] hoàn toàn mất thăng bằng. Không dừng lại để thở, ta đá mạnh vào đầu gối của [sc_loser.GetHerHim], và [sc_loser.GetFirstNameNoTooltip] ngã xuống với một tiếng #EMP rầm#! nặng nề.\n\nĐiều này cho ta đủ thời gian để chuẩn bị cho một đòn kết liễu khủng khiếp. [sc_loser.GetSheHe|U] đầu hàng chỉ trong vài giây."
  single_combat.0041.desc.opponent_response.enthusiastic_onslaught.injury:0 "Chọn đúng thời điểm, ta tung một cú đánh mạnh bằng [sc_victor.Custom('SignatureWeaponEndType')] của [sc_victor.Custom('signature_weapon')] vào thái dương [sc_loser.GetHerHis], khiến [sc_loser.GetSheHe] đổ xuống như một con cừu bị đánh vỡ sọ.\n\nTa dành một hai giây để nhìn cảnh tượng đáng thương của [sc_loser.GetWomanMan] đang rên rỉ trên [sc_defender.Custom('GroundType')] trước mặt, rồi chuẩn bị cho đòn kết liễu.\n\n[sc_loser.GetFirstNameNoTooltip] khàn giọng xin đầu hàng ngay trước khi quá muộn."
  single_combat.0041.desc.opponent_response.hail_mary.injury:0 "Sự tuyệt vọng và sự vụng về quả thực là một sự kết hợp tồi tệ. Hầu hết các đòn đánh của [sc_loser.GetHerHis|U] đều trượt, còn những đòn trúng đích thì dễ dàng bị đỡ hoặc bật khỏi [sc_victor.Custom('signature_weapon')] của ta, khiến [sc_loser.GetFirstNameNoTooltip] nhanh chóng mất thế đứng.\n\nKhi [sc_loser.GetSheHe] vô tình tự đập tay đang vung loạn vào [sc_loser.Custom('MaskFace')] của chính mình, ta động lòng thương và đánh bay vũ khí khỏi tay [sc_loser.GetHerHis].\n\nLời đầu hàng nhanh chóng vang lên."
  single_combat.0041.desc.opponent_response.pocket_sand.injury:0 "[sc_loser.GetSheHe|U] quá bận ho sặc sụa nên không nhận ra hoặc né được [sc_victor.Custom('SignatureWeaponEndType')] của [sc_victor.Custom('signature_weapon')] khi ta đâm nó vào cổ [sc_loser.GetHerHis], khiến [sc_loser.GetSheHe] lập tức ngã xuống [sc_defender.Custom('GroundType')].\n\nTa để vũ khí của mình nhẹ nhàng trên bụng [sc_loser.GetFirstNamePossessiveNoTooltip], kiên nhẫn chờ [sc_loser.GetHerHim] nhận ra và đầu hàng. Không mất nhiều thời gian."
  single_combat.0041.desc.opponent_response.nut_em.injury:0 "Không chút do dự, ta thúc đầu gối vào bụng [sc_loser.GetHerHis], và kẻ ngốc ấy gục xuống.\n\nCông bằng mà nói, [sc_loser.GetFirstNameNoTooltip] ngã xuống tốt nhất có thể, và đã đang cố gắng đứng dậy khi ta xoay người đuổi theo [sc_loser.GetHerHim].\n\nMột vài cú đá tàn nhẫn cùng [sc_victor.Custom('signature_weapon')] ép sát vào cột sống [sc_loser.GetHerHis] đủ để buộc [sc_loser.GetHerHim] đứng yên và đầu hàng."
  single_combat.0041.desc.opponent_response.guard.injury:0 "tạo ra một khoảng trống lớn trong thế phòng thủ của [sc_loser.GetHerHis].\n\nTừ đó, chỉ cần một loạt [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] nhanh chóng trước khi ta có thể đánh bật [sc_loser.Custom('signature_weapon')] khỏi tay [sc_loser.GetHerHis].\n\nTa chuẩn bị cho đòn kết liễu, nhưng [sc_loser.GetFirstNameNoTooltip] đầu hàng trước khi điều đó cần thiết."
  single_combat.0041.desc.opponent_response.probing_attack.injury:0 "xé [sc_loser.Custom('signature_weapon')] khỏi tay [sc_loser.GetHerHis]. Vũ khí bay tuyệt đẹp trong không trung, chỉ còn lại ta, [sc_loser.GetFirstNameNoTooltip], và #EMP vũ khí#! [sc_victor.Custom('signature_weapon')] của ta.\n\nLời đầu hàng vang lên ngay khi ta nhấc tay."
  single_combat.0041.desc.opponent_response.onslaught.injury:0 "khiến [sc_loser.Custom('signature_weapon')] của đối thủ chỉ còn chém vào không khí vô hại. Ta đạp vào phía sau đầu gối của [sc_loser.GetFirstNamePossessiveNoTooltip] rồi đẩy mạnh, đấm thẳng vào hàm [sc_loser.GetHerHim] khi [sc_loser.GetSheHe] vụng về xoay người đối diện ta.\n\nKhi [sc_loser.GetFirstNameNoTooltip] đang choáng váng, chỉ cần một đòn [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] là đủ khiến vũ khí của [sc_loser.GetHerHis] bay đi. Ta rộng lượng cho [sc_loser.GetWomanMan] vài giây để lấy lại bình tĩnh trước khi [sc_loser.GetSheHe] đầu hàng."
  single_combat.0041.desc.opponent_response.surprise_attack.injury:0 "Thay vì tiếp tục bằng một đòn phản công, ta thúc đầu gối vào bụng [sc_loser.GetFirstNamePossessiveNoTooltip], khiến [sc_loser.GetHerHim] gập người khi toàn bộ không khí bị ép khỏi phổi.\n\nĐiều này để lộ phía sau đầu của đối thủ, và ta kết hợp cú đánh bụng với một cú thúc cùi chỏ tàn nhẫn vào sau đầu.\n\n[sc_loser.GetFirstNameNoTooltip] đổ gục xuống [sc_defender.Custom('GroundType')]. Ta gần như ngạc nhiên khi [sc_loser.GetSheHe] vẫn có thể thốt ra lời đầu hàng mà không nôn mửa."
  single_combat.0041.desc.opponent_response.taunt.injury:0 "Hiệu quả như cần, khiến đối thủ choáng ngợp trên mặt đất.\n\nMột cú đầu hàng hơi lảo đảo ngay sau đó."
  single_combat.0041.desc.opponent_response.put_the_boot_in.injury:0 "\n\n[sc_loser.GetWomanMan] cố gắng loạng choạng đứng dậy, nhưng một cú đánh nhanh từ [sc_victor.Custom('signature_weapon')] của ta giữ [sc_loser.GetHerHim] nằm yên. Ta bật ra một tiếng cười khinh bỉ rõ ràng để cho [sc_loser.GetHerHim] biết thời khắc của [sc_loser.GetHerHis] đã hết, và nhận được một lời đầu hàng nghẹn ngào."
  single_combat.0041.desc.opponent_response.strict_guard.injury:0 "phá vỡ thế phòng thủ bằng một đòn [sc_victor.Custom('SignatureWeaponAttemptedLight')], đẩy [sc_victor.Custom('SignatureWeaponTipType')] của [sc_victor.Custom('signature_weapon')] lên sát cổ [sc_loser.GetHerHis].\n\nCả hai chúng ta đứng bất động quá lâu trong khi [sc_loser.GetFirstNameNoTooltip] cân nhắc lựa chọn của mình. Chỉ một ánh mắt hoảng loạn và một cái giật mình bất ngờ mới buộc [sc_loser.GetWomanMan] cứng đầu kia phải đầu hàng."
  single_combat.0041.desc.opponent_response.confident_attack.injury:0 "đỡ đủ mạnh để hất chính vũ khí của [sc_loser.GetHerHis] quay ngược trở lại về phía [sc_loser.GetHerHim].\n\nĐể né khỏi [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')] của chính mình, [sc_loser.GetFirstNameNoTooltip] buộc phải lao thẳng vào đường đi của [sc_victor.Custom('signature_weapon')] ta. Đây khó có thể là một đòn chí mạng, nhưng nó vẫn khiến [sc_loser.GetHerHim] ngã xuống.\n\nKhi vũ khí của [sc_loser.GetHerHis] bị rơi mất trong cú ngã, [sc_loser.GetFirstNameNoTooltip] không còn lựa chọn nào khác ngoài đầu hàng."
  single_combat.0041.desc.opponent_response.expert_onslaught.injury:0 "Ta có thể tung một đòn tuyệt vọng vào thái dương [sc_loser.GetHerHis] bằng [sc_victor.Custom('SignatureWeaponEndType')] của [sc_victor.Custom('signature_weapon')].\n\n[sc_loser.GetFirstNameNoTooltip] loạng choạng lùi lại, bị đánh úp, cho ta cơ hội chắc chắn để đánh bay [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')] bằng một đòn [sc_victor.Custom('SignatureWeaponAttemptedHeavy')].\n\nKhông còn vũ khí, đối thủ nằm trong tay ta, và [sc_loser.GetSheHe] biết rõ điều đó. Một lời đầu hàng cay đắng thuộc về ta chỉ trong chốc lát."
  single_combat.0041.desc.opponent_response.attempt_disarm.injury:0 "chỉ cần một cú giật nhẹ từ ta cũng đủ khiến [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')] bay đi như một mũi tên khổng lồ một cách nực cười.\n\nLời đầu hàng đầy xấu hổ vang lên ngay khi [sc_loser.GetFirstNameNoTooltip] hiểu được chuyện vừa xảy ra."
 ### No need for a lightning_assault, as you can't end the duel in the first round.
  single_combat.0041.desc.opponent_response.tire_opponent.injury:0 "Mất thăng bằng, [sc_loser.GetFirstNameNoTooltip] vấp và xoay người vụng về xuống [sc_defender.Custom('GroundType')].\n\nĐứng trên đối thủ, Ta tung một loạt [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] [sc_victor.Custom('signature_weapon')].\n\nĐối thủ ban đầu vẫn kiên định, chỉ đầu hàng khi rõ ràng Ta sắp [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]."
  single_combat.0041.desc.opponent_response.reason_you_suck_speech.injury:0 "Tiến lên, Ta đánh vào cổ [sc_loser.GetHerHim] bằng [sc_victor.Custom('SignatureWeaponEndType')] của vũ khí. [sc_loser.GetFirstNameNoTooltip] ngay lập tức nghẹt thở, cố gắng ép không khí qua đường thở vừa bị Ta chặn.\n\nSau đó, thật dễ dàng để tung cú đánh sẽ rõ ràng [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))] và buộc đối thủ đầu hàng."
  single_combat.0041.desc.opponent_response.technique_from_legend.injury:0 "Một khoảnh khắc, Ta đứng bối rối, không rõ chuyện gì xảy ra, cho tới khi nghe tiếng rơi phía sau và nhận ra.\n\n[sc_loser.GetFirstNameNoTooltip] thay đổi tư thế quá mạnh, quá #EMP vụng về#! đến mức [sc_loser.GetSheHe] thực sự #EMP mất#! [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')] trong quá trình đó.\n\nGần như không thể kìm cười, Ta chỉ lắc nhẹ vũ khí của mình để thúc đối thủ đầu hàng."
  single_combat.0041.desc.opponent_response.like_a_viper.injury:0 "Theo bản năng, Ta lao vào cú đánh với toàn lực, vừa #EMP đủ#! để chuyển hướng cú đánh chạm qua vai, rồi kết thúc với một cú gối nhanh vào bụng.\n\n[sc_loser.GetFirstNameNoTooltip] gập người. Hơi thở Ta ngắn và gấp, não vẫn đang xử lý khoảnh khắc suýt chết, nhưng Ta vẫn kịp ép [sc_victor.Custom('signature_weapon')] vào cổ họng [sc_loser.GetHerHis] trước khi [sc_loser.GetSheHe] hồi phục.\n\nTrận đấu này thuộc về Ta."
  single_combat.0041.desc.opponent_response.pocket_silver.injury:0 "Ta lao thẳng vào tấn công, tung một cú [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] làm rơi [sc_loser.Custom('signature_weapon')] khỏi tay [sc_loser.GetHerHis].\n\n[sc_loser.GetFirstNameNoTooltip] đứng sững. Nhẹ nhàng, [sc_loser.GetSheHe] nhả ra một đồng bạc và đầu hàng."
  single_combat.0041.desc.opponent_response.martial_voice.injury:0 "Chỉ đến lúc đó, ta mới lao tới với một đòn [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] đánh bật [sc_loser.GetHerHim] ngã chổng vó xuống đất.\n\nTuy choáng váng, [sc_loser.GetFirstNameNoTooltip] ban đầu vẫn tỏ ý muốn tiếp tục giao đấu. Nhưng khi nhận ra ta chuẩn bị kết liễu [sc_loser.GetHerHim] bằng một chiêu [sc_victor.Custom2('SignatureWeaponKillTypeHeadThirdPersonFutureGendered',SCOPE.sC('sc_loser'))], [sc_loser.GetSheHe] liền quy hàng."
  single_combat.0041.desc.opponent_response.mocking_boast.injury:0 "tấn công bằng một cú [sc_victor.Custom('SignatureWeaponAttemptedLight')] thẳng vào ngực [sc_loser.GetHerHis].\n\nKhi [sc_loser.GetHerHim] mất hơi, [sc_loser.GetFirstNameNoTooltip] không thể chống cự nhiều khi Ta đánh bay [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')] với cú đánh tiếp theo.\n\nKết quả là đối thủ đầu hàng, vừa bẽ mặt vừa cay cú."
 ### No need for an is_that_a_crocodile, as it's never just an injury.
  single_combat.0041.desc.opponent_response.desert_warrior.injury:0 "Ta tung một loạt [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')], làm đối thủ bất ngờ tới mức [sc_loser.GetSheHe] vấp ngã sấp mặt xuống [sc_defender.Custom('GroundType')].\n\nĐặt [sc_victor.Custom('signature_weapon')] vào cổ [sc_loser.GetHerHis], Ta nhanh chóng nhận được một tiếng đầu hàng ngậm miệng."
  single_combat.0041.desc.opponent_response.jungle_stalker.injury:0 "Nhân cơ hội, Ta làm rơi [sc_loser.Custom('signature_weapon')] của đối thủ vào bụi rậm bằng một cú [sc_victor.Custom('SignatureWeaponAttemptedLight')] mạo hiểm, rồi lao vào vị trí để [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))].\n\n[sc_loser.GetFirstNameNoTooltip] ngay lập tức đầu hàng."
  single_combat.0041.desc.opponent_response.open_terrain_expert.injury:0 "[sc_loser.GetSheHe|U] không nghi ngờ gì, và vấp đúng như Ta mong.\n\nMột cú [sc_victor.Custom('SignatureWeaponAttemptedLight')] đặt chính xác biến cú vấp thành một cú ngã hoàn toàn, [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')] bay ra khi [sc_loser.GetSheHe] ngã.\n\nĐặt chân lên cổ [sc_loser.GetHerHis] biến cú ngã thành đầu hàng."
  single_combat.0041.desc.opponent_response.rough_terrain_expert.injury.rocky:0 "nhưng Ta vừa đủ giữ vững vị trí.\n\nKhi có cơ hội phản công, Ta tận dụng, đánh [sc_loser.GetFirstNameNoTooltip] ngược lên dốc bằng một cú [sc_victor.Custom('SignatureWeaponAttemptedLight')].\n\nKhông phải cú ngã mạnh, nhưng [sc_loser.GetSheHe] nằm đủ sấp để Ta có thể [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))] dễ dàng.\n\nTa nhận được tiếng đầu hàng."
  single_combat.0041.desc.opponent_response.rough_terrain_expert.injury.boggy:0 "May mắn thay, cả sự phân tâm lẫn tình huống khiến việc tước vũ khí [sc_loser.GetHerHim] trở nên gần như hài hước dễ, đặc biệt so với trận hỗn chiến trước đó.\n\nTiếng đầu hàng hiếm khi ngọt ngào đến thế."
  single_combat.0041.desc.opponent_response.forest_fighter.injury:0 "Dành thêm vài giây quan trọng để nhắm, Ta tung một cú [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] gần như hạ gục đối thủ.\n\nKhi đối thủ ngã, dễ dàng đá [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')] vào bụi rậm. Nhận thức dần trở lại trong [sc_loser.GetFirstNamePossessiveNoTooltip] [my_foe.Custom('EyeEyes')] ngay sau khi Ta đặt [sc_victor.Custom('SignatureWeaponTipAdjective')] [sc_victor.Custom('SignatureWeaponTipType')] của vũ khí lên cổ [sc_loser.GetHerHis], và tiếng đầu hàng đến nhanh chóng."
  single_combat.0041.desc.opponent_response.raaargh.injury:0 "Bất chấp cơn thịnh nộ của [sc_loser.GetHerHis], thực ra [sc_loser.GetSheHe] không hề #EMP khó#! né tránh: quá nhiều giận dữ sẽ làm giảm đi sự tinh tế, và việc giữ khoảng cách trong một trận quyết đấu là lựa chọn khả thi, điều mà trong một cuộc hỗn chiến không thể làm được.\n\nKhi [sc_loser.GetFirstNameNoTooltip] tỉnh lại sau cơn cuồng nộ, kết cục lại khá tẻ nhạt. Trong cơn giận dữ, dường như [sc_loser.GetSheHe] đã làm [sc_loser.Custom('SignatureWeaponBreaksVerbPastTense2')] cái [sc_loser.Custom('SignatureWeaponTipType')] của [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')]. Lời quy hàng được thốt ra qua kẽ răng nghiến chặt."
  single_combat.0041.desc.opponent_response.hard_grit.injury:0 "tiếp tục tấn công.\n\nĐây là một trận chiến mệt mỏi, kiệt quệ về ý chí và chi tiết nhỏ, nhưng cuối cùng Ta có thể đánh [sc_loser.Custom('ShieldPersonFemaleMale')] xuống đất và tước vũ khí [sc_loser.GetHerHim] cùng lúc.\n\nTiếng đầu hàng miễn cưỡng nhưng đầy tôn trọng."
  single_combat.0041.desc.opponent_response.feint_and_stab.injury:0 "Nghĩ nhanh, Ta đập [sc_victor.Custom('signature_weapon')]'s [sc_victor.Custom('SignatureWeaponEndType')] vào tay còn lại của [sc_victor.GetHerHis] khi vung ngược, làm lưỡi dao ẩn bay ra.\n\nKhông muốn mạo hiểm thêm trò lừa, Ta tiến tới [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]. [sc_loser.GetFirstNameNoTooltip] chỉ vừa kịp tránh cái chết lộn xộn với một trong những cú đầu hàng nhanh nhất Ta từng thấy."
  single_combat.0041.desc.opponent_response.butchery.injury:0 "Giữa một đòn [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] đầy phô trương, ta dễ dàng áp sát vào sơ hở của [sc_loser.GetFirstNamePossessiveNoTooltip] và giật lấy [sc_loser.Custom('signature_weapon')] khỏi tay đối phương chỉ bằng một chiêu [sc_victor.Custom('SignatureWeaponAttemptedLight')].\n\n[sc_loser.GetSheHe|U] cố gắng duy trì vẻ uy nghiêm đầy đe dọa, nhưng thật vô ích khi trong tay ta vẫn còn [sc_victor.Custom('signature_weapon')].\n\nKhi [sc_loser.GetSheHe] quy hàng, ta không hề hổ thẹn khi thấy điều đó #EMP thật thỏa mãn#!."
  single_combat.0041.desc.opponent_response.stoic_veteran.injury:0 "Cuộc so tài của chúng ta trở thành một cuộc đua sức bền, xem ai sẽ gục ngã trước. May mắn thay cho ta, [sc_loser.GetFirstNameNoTooltip] sơ hở trước, tạo cơ hội cho ta tung đòn phản công khiến [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')] văng ra xa.\n\nVẫn giữ vẻ bình thản ngay cả khi thất bại, cơ bắp của [sc_loser.GetHerHis] thư giãn và [sc_loser.GetSheHe] lập tức quy hàng."
  single_combat.0041.desc.opponent_response.blade_dance.injury: "[sc_loser.GetHerHis] vũ khí văng ra xa tầm tay.\n\nDù có là bậc thầy [sc_loser.Custom('signature_weapon')] hay không, sự hoảng loạn vẫn hiện rõ trên nét mặt của [sc_loser.GetFirstNamePossessiveNoTooltip] khi nhận ra [sc_loser.GetSheHe] không còn vũ khí.\n\nCho đối thủ một chút thời gian để định thần, ta thản nhiên đứng tạo dáng với [sc_victor.Custom('signature_weapon')] trên tay. Lời quy hàng sau đó được thốt ra đầy vẻ kinh ngạc."
  single_combat.0041.desc.opponent_response.wrath_of_highgod.injury:0 "đá thẳng vào háng [sc_loser.GetHerHim].\n\nLời cầu nguyện của [sc_loser.GetFirstNamePossessiveNoTooltip] biến thành tiếng hét chói tai, và [sc_loser.GetSheHe] sụp xuống trong đống tay chân vung vãi. Đống [sc_loser.GetWomanMan] giận dữ nửa rít nửa thét trách Ta phạm blasphemy, nhưng Ta chỉ đặt [sc_victor.Custom('signature_weapon')] bên cạnh [sc_loser.GetHerHis] [sc_loser.Custom('MaskFace')] và chờ [sc_loser.GetFaith.HighGodName] trừng phạt.\n\nCông lý thần thánh không xuất hiện, nhưng một tiếng đầu hàng giận dữ thì có."
  single_combat.0041.desc.opponent_response.hurt_me_better.injury:0 "và Ta gần như cảm thấy một làn thương hại khi đánh rơi [sc_loser.Custom('signature_weapon')] khỏi tay [sc_loser.GetHerHis].\n\nCần khá nhiều sự thúc giục để [sc_loser.GetFirstNameNoTooltip] tập trung cho một tiếng đầu hàng chính thức, nhưng cuối cùng cũng thành công."
  single_combat.0041.desc.opponent_response.special_fallback.injury:0 "Nhìn thấy vị trí tốt để kết thúc trận đấu, Ta giậm mạnh vào đống đối thủ, đá dữ dội cho tới khi nghe tiếng đầu hàng nghẹt thở."
  single_combat.0041.desc.opponent_response.something_to_hide.injury: "gục xuống đất, nôn mửa liên tục.\n\nTa đá văng [sc_loser.Custom('signature_weapon')] khỏi tay [sc_loser.GetHerHis], và [sc_loser.GetSheHe] nghẹn ngào quy hàng #EMP ngay lập tức#!."

 ## Defender Lost, Opponent Finishing Move Fatality
  single_combat.0041.desc.opponent_response.wait_and_hope.fatality:1 "Đòn đánh trúng cổ đối thủ, xé toạc một vết thương máu me, bầm tím trên họng [sc_loser.GetHerHis]. Máu đỏ bắt đầu tuôn trào từ vết thương, khuôn mặt [sc_loser.GetFirstNamePossessiveNoTooltip] cúi xuống kinh hãi nhìn sinh mạng của chính mình đang cạn dần từ cổ chảy dọc xuống lồng ngực.\n\n[sc_loser.GetFirstNameNoTooltip] quỵ xuống [sc_loser.GetHerHis] đầu gối. Chẳng bao lâu sau, [sc_loser.GetSheHe] đã nằm bất động."
  single_combat.0041.desc.opponent_response.unsure_attack.fatality:0 "Vì [sc_loser.GetSheHe] vẫn còn bỡ ngỡ, Ta liều lao tới nhanh. [sc_victor.Custom('SignatureWeaponAttemptedLight')] trúng vào điểm mềm ở ngực [sc_loser.GetHerHis], [sc_victor.Custom2('SignatureWeaponKillTypeTorso2ThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))] theo một góc sâu vào khoang ngực của [sc_loser.GetWomanMan]. [sc_loser.GetFirstNameNoTooltip] lập tức đứng chết trân, mọi cử động biến mất dưới cơn đau dữ dội đang bao trùm [sc_loser.GetHerHim]. Khi Ta rút [sc_victor.Custom('signature_weapon')] ra, [sc_loser.GetSheHe] đã tắt thở, và xác [sc_loser.GetHerHis] đổ nhào xuống [sc_defender.Custom('GroundType')]."
  single_combat.0041.desc.opponent_response.enthusiastic_onslaught.fatality:0 "Ta đáp đòn bằng một [sc_victor.Custom('SignatureWeaponAttemptedLight')] chuẩn xác trúng ngực đối thủ, [sc_victor.Custom2('SignatureWeaponKillTypeTorsoThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))] trước khi rút ra, bắn ra mảnh xương và thịt. [sc_loser.GetFirstNameNoTooltip] xoay người, chủ yếu do quán tính, rơi xuống thành một đống rối. Sốc lẫn đau vẫn còn trong những cơn co thắt tuyệt vọng của [sc_loser.GetHerHis], mỗi cử động giật giật như cố tìm lối thoát, tim [sc_loser.GetHerHis] đập những nhịp cuối."
  single_combat.0041.desc.opponent_response.hail_mary.fatality:0 "Ta không hề mạo hiểm, xoay người né đòn đánh đầu tiên và vung [sc_victor.Custom('signature_weapon')] của mình để [sc_victor.Custom2('SignatureWeaponKillTypeRearTorsoThirdPersonFutureGendered',SCOPE.sC('sc_loser'))] bằng một chiêu [sc_victor.Custom('SignatureWeaponAttemptedHeavy')].\n\nSự tê liệt đến tức thì, đối thủ ngã nhào xuống [sc_defender.Custom('GroundType')] khi đôi chân [sc_loser.GetHerHis] mất đi khả năng vận động. Ta đá [sc_loser.GetHerHim] lật lại, gật đầu tiễn biệt [sc_loser.GetWomanMan] một lần cuối trước khi [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))]."
  single_combat.0041.desc.opponent_response.pocket_sand.fatality:0 "Không bỏ lỡ cơ hội, ta đâm thẳng [sc_victor.Custom('signature_weapon')] của mình vào ngực [sc_loser.GetHerHis], [sc_victor.Custom2('SignatureWeaponKillTypeTorsoThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))] trong một động tác nhanh gọn.\n\nĐối thủ lảo đảo lùi lại, máu phun ra từ vùng thân trên bị tàn phá.\n\nTa rút vũ khí ra khỏi cơ thể [sc_loser.GetFirstNamePossessiveNoTooltip] để kết thúc: [sc_loser.GetSheHe] đã chết, không cần phải dây dưa thêm nữa."
  single_combat.0041.desc.opponent_response.nut_em.fatality:0 "Táo bạo, nhưng [sc_victor.GetFaith.WarGodName] thưởng cho sự thận trọng. Ta đưa [sc_victor.Custom('signature_weapon')] lên cho một [sc_victor.Custom('SignatureWeaponAttemptedLight')] [sc_victor.Custom2('SignatureWeaponKillTypeHead2ThirdPersonActiveGendered',SCOPE.sC('sc_loser'))]. Vụ nổ #EMP của máu gặp tiếng la kinh hoàng nửa hét nửa khịt của [sc_loser.GetFirstNameNoTooltip], người vẫn loạng choạng tiến về phía trước. Khi [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')] trong tay, Ta không dám tiến tới kết liễu. Thay vào đó, [sc_loser.GetFirstNameNoTooltip] và Ta chỉ nhìn nhau cho đến khi máu tràn lấy đi ánh sáng từ mắt [sc_loser.GetHerHis] [my_foe.Custom('EyeEyes')]."
  single_combat.0041.desc.opponent_response.guard.fatality:0 "tung một chiêu [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] xé toạc đùi trong, cắt đứt động mạch của [sc_loser.GetHerHis].\n\nNhờ vào adrenaline, [sc_loser.GetFirstNameNoTooltip] vẫn chiến đấu thêm hai ba mươi giây trước khi mất máu quá nhiều.\n\n[sc_loser.GetSheHe|U] ban đầu không nhìn thấy chuyện gì đã xảy ra, cúi xuống nhìn mới bàng hoàng thấy mình đẫm máu. Sự hoài nghi chuyển dần sang cơn buồn ngủ, và đối thủ của ta gục ngã xuống đất. Kết liễu [sc_loser.GetHerHim] thật nhanh chóng và không đau đớn."
  single_combat.0041.desc.opponent_response.probing_attack.fatality:0 "[sc_loser.Custom('SignatureWeaponBreaksVerbPastTense')] của [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')]. Từ đó, chỉ còn là loạt [sc_loser.Custom('SignatureWeaponAttemptedLightPlural')] cho tới khi Ta có thể [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]. Đây không phải cái chết nhanh."
  single_combat.0041.desc.opponent_response.onslaught.fatality:0 "phản xạ bồi thêm một chiêu [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] vào phía sau đầu gối của [sc_loser.GetHerHis] khiến kẻ đó quỵ xuống.\n\nBộ pháp khéo léo giúp ta giữ vị trí phía sau đối thủ khi [sc_loser.GetSheHe] loạng choạng đứng dậy, và với một đòn đánh chuẩn xác, ta [sc_victor.Custom2('SignatureWeaponKillTypeRearHeadThirdPersonPresentGendered',SCOPE.sC('sc_loser'))].\n\n[sc_loser.GetFirstNameNoTooltip] chết ngay lập tức."
  single_combat.0041.desc.opponent_response.surprise_attack.fatality:0 "\n\nĐòn phản công của ta giật văng [sc_loser.Custom('signature_weapon')] khỏi tay [sc_loser.GetHerHis], và [sc_loser.GetFirstNameNoTooltip] chết lặng vì hoảng sợ.\n\nĐiều đó đã định đoạt số phận của [sc_loser.GetWomanMan], khi ta [sc_victor.Custom('SignatureWeaponWoundVerb5')] [sc_loser.Custom('signature_weapon')] vào vai [sc_loser.GetHerHis]. Một cơ quan trọng yếu bị xé rách, và [sc_loser.GetFirstNameNoTooltip] đổ gục tức thì.\n\n[sc_loser.GetSheHe|U] đã chết trước khi chạm xuống [sc_defender.Custom('GroundType')]."
  single_combat.0041.desc.opponent_response.taunt.fatality:0 "Trúng vào thân mình, mạnh hơn dự kiến, Ta bị phủ đầy ruột và xương vỡ. [sc_loser.GetFirstNameNoTooltip] chưa kịp thực hiện trò trêu chọc. [sc_loser.GetSheHe|U] chỉ đổi trọng tâm và loạng choạng vài bước trước khi ngã chết."
  single_combat.0041.desc.opponent_response.put_the_boot_in.fatality:0 "Tiếp tục thế công, ta [sc_victor.Custom2('SignatureWeaponKillTypeTorso2ThirdPersonSimplePresentGendered',SCOPE.sC('sc_loser'))] bằng một cú đâm mạnh mẽ của [sc_victor.Custom('signature_weapon')].\n\n[sc_loser.GetFirstNameNoTooltip] ngay lập tức nôn ra một búng máu đặc và dịch vị, nghẹn ngào thốt ra hơi thở cuối cùng khi hỗn hợp đó đổ lên người [sc_loser.GetHerHim], trào ngược vào miệng và mũi. Chẳng bao lâu sau, tiếng nghẹn tắt hẳn."
  single_combat.0041.desc.opponent_response.strict_guard.fatality:0 "lách một đường [sc_victor.Custom('SignatureWeaponAttemptedLight')] qua bức tường phòng thủ.\n\nChỉ một đòn là đủ, [sc_victor.Custom('signature_weapon')] của ta [sc_victor.Custom2('SignatureWeaponKillTypeHead2ThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))].\n\n[sc_loser.GetFirstNameNoTooltip] dường như không thể tin vào lượng máu đang vọt ra từ động mạch cảnh bị xé rách, thậm chí [sc_loser.GetSheHe] vẫn phản xạ gạt đỡ đòn tiếp theo của ta.\n\nTa chỉ kịp ngạc nhiên trước sự #EMP ngoan cường#! tuyệt đối đó trước khi ánh sáng vụt tắt trong đôi [my_foe.Custom('EyeEyes')] của [sc_loser.GetHerHis] mãi mãi."
  single_combat.0041.desc.opponent_response.confident_attack.fatality:0 "Gây một cú đánh chắc vào bụng [sc_loser.GetHerHis]. Cú đánh xé da, mỡ và cơ, ruột tuôn ra trên mặt đất đầy máu [sc_defender.Custom('GroundType')], [sc_loser.GetFirstNameNoTooltip] trượt ngã ra sau với tiếng thét. Ta bước tới, [sc_victor.Custom('signature_weapon')] giơ lên kết thúc số phận đối thủ."
  single_combat.0041.desc.opponent_response.expert_onslaught.fatality:0 "Ta thực hiện một pha chắn bất ngờ chắc. Cú chắn đẩy [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')] trở lại mặt [sc_loser.GetHerHis] [sc_loser.Custom('MaskFace')], [sc_loser.Custom('SignatureWeaponWoundVerb6PresentParticiple')] tới tận xương. Ta không lãng phí thời gian, quét chân [sc_loser.GetFirstNamePossessiveNoTooltip] bằng chân móc và vung thẳng vào [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))], [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonPresentParticipleGendered_Aftermath',SCOPE.sC('sc_loser'))]. Tiếng hét của [sc_loser.GetWomanMan] kéo dài hơn dự kiến."
  single_combat.0041.desc.opponent_response.attempt_disarm.fatality:0 "[sc_loser.Custom('SignatureWeaponBreaksThirdPersonSingularPresent')]. Vũ khí [sc_loser.GetHerHis|U] vô dụng, [sc_loser.GetFirstNameNoTooltip] dễ dàng bị [sc_victor.Custom('SignatureWeaponKillTypePastTense')]."
 ### No need for a lightning_assault, as you can't end the duel in the first round.
  single_combat.0041.desc.opponent_response.tire_opponent.fatality:0 "Khi [sc_loser.GetFirstNameNoTooltip] bắt đầu mất trụ, ta tung ra một chiêu [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] đánh gục hoàn toàn [sc_loser.GetHerHim].\n\nPhải công nhận là [sc_loser.GetSheHe] vẫn gạt được đòn tiếp theo. Nhưng đòn sau đó thì [sc_victor.Custom2('SignatureWeaponKillTypeHead2ThirdPersonActiveGendered',SCOPE.sC('sc_loser'))]: tiếng hét nghẹn ngào nhanh chóng chìm vào cõi lặng."
  single_combat.0041.desc.opponent_response.reason_you_suck_speech.fatality:0 "Bước tới trước, ta tung một đòn [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] [sc_victor.Custom2('SignatureWeaponKillTypeHead2ThirdPersonActiveGendered',SCOPE.sC('sc_loser'))].\n\n[sc_loser.GetFirstNameNoTooltip] văng ngược lại, máu phun ra từ cổ họng bị hủy hoại. Trong khoảnh khắc, dường như [sc_loser.GetSheHe] có thể gượng dậy, thậm chí bằng cách nào đó vẫn tiếp tục chiến đấu.\n\nRồi [sc_loser.GetSheHe] đổ gục."
  single_combat.0041.desc.opponent_response.technique_from_legend.fatality:0 "\n\nTa không chắc #EMP tại sao#! [sc_loser.GetSheHe] lại đứng như vậy, nhưng ta đáp lễ sự kỳ lạ đó bằng một cú ngáng chân nhanh gọn, theo sau là [sc_victor.Custom('signature_weapon')] của ta [sc_victor.Custom2('SignatureWeaponKillTypeRearTorsoThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))].\n\nKhông có chiêu độc hay bẫy ngầm nào cả, nên ta đoán tư thế kỳ lạ đó chỉ là... lạ đời thôi.\n\nNhún vai, ta đá [sc_loser.GetFirstNameNoTooltip] nằm ngửa ra để tung đòn kết liễu."
  single_combat.0041.desc.opponent_response.like_a_viper.fatality:0 "Nhanh tựa chớp mắt, ta vung [sc_victor.Custom('signature_weapon')] ra sau rồi đánh thẳng vào [sc_loser.GetFirstNameNoTooltip]. Vũ khí [sc_victor.Custom2('SignatureWeaponKillTypeTorsoThirdPersonActiveGendered',SCOPE.sC('sc_loser'))] chỉ trong một nhát, hất văng [sc_loser.GetHerHim] xuống [sc_defender.Custom('GroundType')].\n\nĐối thủ ban đầu còn giãy giụa, cố gắng đứng dậy, di chuyển, kháng cự. [sc_loser.GetSheHe|U] không thể làm gì hơn ngoài việc lật ngửa mình ra trước khi sự mất máu tước đi sinh mạng."
  single_combat.0041.desc.opponent_response.pocket_silver.fatality:0 "Ta hành động nhanh, đẩy [sc_loser.GetHerHim] xuống đất. Trước khi [sc_loser.GetSheHe] kịp hồi phục, Ta chuẩn bị cho sự tàn bạo và bắt đầu [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))]. Tiếng thét tắt hẳn trước khi [sc_loser.GetFirstNameNoTooltip] chết."
  single_combat.0041.desc.opponent_response.martial_voice.fatality:0 "Sau đó, ta chỉ việc bước tới và [sc_victor.Custom('SignatureWeaponWoundVerb4')] cổ họng [sc_loser.GetHerHis] bằng một đòn từ [sc_victor.Custom('signature_weapon')].\n\n[sc_loser.GetFirstNameNoTooltip] dường như... bối rối. Sợ hãi. Phẫn nộ. Thật khó để biểu lộ cảm xúc khi cổ họng chỉ còn là một đống đổ nát máu me.\n\nTa chỉ lặng lẽ nhìn [sc_loser.GetHerHim] từ từ nghẹt thở trong chính dòng máu của mình."
  single_combat.0041.desc.opponent_response.mocking_boast.fatality:0 "giả chiêu, khiến [sc_loser.GetHerHim] xoay lưng về phía ta, rồi [sc_victor.Custom2('SignatureWeaponKillTypeRearTorsoThirdPersonFutureGendered',SCOPE.sC('sc_loser'))].\n\nĐối thủ gục ngã tức thì, và sự bàng hoàng đã tiễn [sc_loser.GetHerHim] không lâu sau đó."
  single_combat.0041.desc.opponent_response.is_that_a_crocodile.fatality:0 "\n\nChiêu [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] của ta xuyên thủng lớp phòng thủ của [sc_loser.GetFirstNamePossessiveNoTooltip] và găm vào ngực trên của [sc_loser.GetHerHis]. Với sức mạnh, sự may mắn và sự mất tập trung của đối thủ, đòn đánh đó #EMP thật tàn khốc#!, khiến máu và xương thịt bay tung tóe.\n\n[sc_loser.GetFirstNameNoTooltip] đổ gục về sau, co giật, run rẩy, trông thật thảm hại. Phải rất lâu sau [sc_loser.GetSheHe] mới thực sự chết."
  single_combat.0041.desc.opponent_response.desert_warrior.fatality:0 "Ta lao vào một [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] hạ [sc_loser.GetHerHim] xuống thẳng. Cú đánh tiếp theo [sc_victor.Custom('SignatureWeaponWoundVerb5ThirdPersonPresent')] vào cổ [sc_loser.GetHerHis] một cách lộn xộn. Chết không đẹp hay oai phong, nhưng ít ra nhanh."
  single_combat.0041.desc.opponent_response.jungle_stalker.fatality:0 "Sự phân tâm đủ để Ta tung một [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] thẳng vào bụng trống của [sc_loser.GetHerHis], khiến [sc_loser.GetHerHim] la hét ngã xuống đất. Cuộc vật lộn ngắn nhưng đầy máu. Ít nhất là với [sc_loser.GetFirstNameNoTooltip]."
  single_combat.0041.desc.opponent_response.open_terrain_expert.fatality:0 "Khi [sc_loser.GetSheHe] vấp ngã, đó là một cú ngã nặng nề, và ta áp sát ngay tức thì.\n\nMột cú đá mạnh vào hạ bộ khiến [sc_loser.GetFirstNameNoTooltip] nằm bất động đủ lâu để ta [sc_victor.Custom2('SignatureWeaponKillTypeTorso2ThirdPersonSimplePresentGendered',SCOPE.sC('sc_loser'))] bằng [sc_victor.Custom('signature_weapon')].\n\n[sc_loser.GetSheHe|U] giãy giụa một lúc, nhưng cuối cùng cũng buông xuôi để tử thần đến đón."
  single_combat.0041.desc.opponent_response.rough_terrain_expert.fatality.rocky:0 "nhưng ta vẫn đứng vững.\n\nKhi [sc_loser.GetFirstNameNoTooltip] không nhận ra một mỏm đá nhỏ phía sau [sc_loser.GetHerHis], ta phản đòn đẩy mạnh, khiến gã chiến binh đồi núi gục ngã ra sau.\n\nTa nghe tiếng xương gãy và tiếng hét khi [sc_loser.GetSheHe] rơi qua mép vực, và khi chạy xuống, ta thấy [sc_loser.GetHerHim] bị xiên một nửa vào chính xương đùi bị vỡ của mình. Đòn kết liễu từ bi không mất nhiều thời gian."
  single_combat.0041.desc.opponent_response.rough_terrain_expert.fatality.boggy:0 "Ta đi vòng, tìm vị trí tốt để tấn công. [sc_loser.GetFirstNameNoTooltip] thoát ra nhưng lại ngã mặt xuống một vũng bùn sâu hơn, và Ta thấy cơ hội: một cú đánh nhanh vào [sc_victor.Custom2('SignatureWeaponKillTypeRearTorsoThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]. Liệt ngay lập tức, [sc_loser.GetFirstNameNoTooltip] trượt sâu thêm vào bùn hôi. Phải lâu lắm bọt khí mới ngừng."
  single_combat.0041.desc.opponent_response.forest_fighter.fatality:0 "\n\nTa lao vào [sc_loser.GetHerHim] với một loạt [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')]. Ban đầu, đối thủ chống đỡ khá tốt, cho đến khi [sc_loser.GetSheHe] bắt đầu chậm lại, máu chảy ra từ... nơi nào đó. Chắc ta đã cắt trúng động mạch.\n\nTrong vòng một phút, [sc_loser.GetFirstNameNoTooltip] đã ngất đi. Ta dứt điểm [sc_loser.GetHerHim] nhanh chóng."
  single_combat.0041.desc.opponent_response.raaargh.fatality:0 "Ta giữ khoảng cách, chỉ lao lên khi [sc_loser.GetFirstNameNoTooltip] lơ là để xé toạc từng mảng thịt, và chúng ta cứ khiêu vũ như thế một lúc.\n\nTuy nhiên, cuối cùng, cơn cuồng nộ của [sc_loser.GetHerHis] cũng tan biến, và [sc_loser.GetWomanMan] đứng trước mặt ta bắt đầu lảo đảo, những vết thương tích tụ chồng chất lên [sc_loser.GetHerHim] cho đến khi..."
  single_combat.0041.desc.opponent_response.hard_grit.fatality:0 "Lén một [sc_victor.Custom('SignatureWeaponAttemptedLight')] cắm sâu vào bụng [sc_victor.GetHerHis]. Chết đau, [sc_loser.GetFirstNameNoTooltip] chấp nhận với phẩm giá, chiến đấu đến cuối cùng."
  single_combat.0041.desc.opponent_response.feint_and_stab.fatality:0 "\n\nTrước khi [sc_loser.GetFirstNameNoTooltip] kịp sử dụng vũ khí phụ, ta vung [sc_victor.Custom('signature_weapon')] của mình ra để [sc_victor.Custom2('SignatureWeaponKillTypeTorso2ThirdPersonSimplePresentGendered',SCOPE.sC('sc_loser'))]. Cơ thể bầm dập của [sc_loser.GetHerHis|U] bị hất văng ngược lại, co giật và đổ máu xuống [sc_defender.Custom('GroundType')].\n\nChỉ trong chưa đầy một phút, mọi cử động dừng hẳn."
  single_combat.0041.desc.opponent_response.butchery.fatality:0 "Thận trọng đề phòng bẫy, ta bước vào một khoảng trống lộ liễu trong lớp phòng thủ của [sc_loser.GetHerHis] và tung ra một chiêu [sc_victor.Custom('SignatureWeaponAttemptedLight')] đầy ghê rợn [sc_victor.Custom2('SignatureWeaponKillTypeHead2ThirdPersonActiveGendered',SCOPE.sC('sc_loser'))].\n\n[sc_loser.GetFirstNameNoTooltip] lập tức bắt đầu nôn ra máu, rơi [sc_loser.Custom('signature_weapon')] để ôm lấy vết thương.\n\n[sc_loser.GetSheHe|U] vẫn đang ôm lấy nó khi [sc_loser.GetSheHe] tắt thở, một phút sau đó."
  single_combat.0041.desc.opponent_response.stoic_veteran.fatality:0 "Chúng ta rơi vào nhịp điệu căng thẳng: đánh-đỡ-phản công, với việc ta dần chiếm thế thượng phong, bào mòn [sc_loser.GetFirstNameNoTooltip] qua từng đòn, cho đến khi [sc_loser.GetSheHe] hứng chịu đủ vết thương để giết chết hầu hết [sc_loser.GetWomenMen] hai lần.\n\nNgay cả [sc_loser.GetSheHe] cũng có giới hạn. Và khi tên chiến binh Varangian quỵ xuống đầu gối, chờ đợi đòn kết liễu, rõ ràng là cả hai chúng ta đều biết kết cục đã định."
  single_combat.0041.desc.opponent_response.blade_dance.fatality:0 "Trong khi Ta đang vung ngược. Sự giận dữ lan ra trên khuôn mặt [sc_loser.GetFirstNameNoTooltip], có lẽ vì sự hỗn xược của Ta, nhưng Ta không muốn kéo dài. [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponWoundVerb1ThirdPersonPresent')] sâu vào ngực kiếm thủ, gây tử vong."
  single_combat.0041.desc.opponent_response.wrath_of_highgod.fatality:1 "găm [sc_victor.Custom('SignatureWeaponEndType')] của [sc_victor.Custom('signature_weapon')] vào [sc_loser.Custom('MaskFace')] của [sc_loser.GetHerHis].\n\nGào thét trong giận dữ vì sự báng bổ này, [sc_loser.GetFirstNameNoTooltip] lảo đảo lùi lại, buông những lời nguyền rủa cho đến giây phút ta [sc_victor.Custom('SignatureWeaponWoundVerb5')] vũ khí vào phổi [sc_loser.GetHerHis].\n\nSau đó, mọi thứ chỉ còn là tiếng sặc sụa, nghẹn ngào, rồi im lặng."
  single_combat.0041.desc.opponent_response.hurt_me_better.fatality:0 "Và Ta nghĩ cả hai đều biết [sc_loser.GetSheHe] không còn khả năng gây nguy hiểm hay ngăn Ta phản công. Một cú đánh chắc và Ta [sc_victor.Custom2('SignatureWeaponKillTypeHeadThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]."
  single_combat.0041.desc.opponent_response.special_fallback.fatality:0 "Với một sơ hở hoàn toàn lộ ra ở lưng [sc_loser.GetHerHis], ta trút một cơn mưa [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] lên [sc_loser.GetFirstNameNoTooltip], đánh gục [sc_loser.GetHerHim] xuống đất.\n\n[sc_loser.GetSheHe|U] ngã mạnh xuống đất, ho ra từng búng máu một lúc cho đến khi [sc_loser.GetSheHe] thốt ra hơi thở cuối cùng đầy mệt mỏi."
 ### No need for a something_to_hide, as it's never fatal.

 ## Aggressor Won, Own Combat Move Feedback
  single_combat.0041.desc.sc_attacker.wait_and_hope:0 "Ta chờ đợi, kiên nhẫn hy vọng một khoảnh khắc hoàn hảo sẽ xuất hiện.\n\nKhi không có, Ta thử một cú [sc_victor.Custom('SignatureWeaponAttemptedLight')] #EMP nhạt nhẽo#!"
  single_combat.0041.desc.sc_attacker.unsure_attack:0 "Phòng thủ tốt nhất là một đòn tấn công chắc chắn, nhưng ngay cả một cú nửa vời cũng có ích. Với suy nghĩ đó, Ta thử một [sc_victor.Custom('SignatureWeaponAttemptedLight')] thăm dò.\n\n"
  single_combat.0041.desc.sc_attacker.enthusiastic_onslaught:0 "Gầm gừ thách thức, Ta lao mình hết mình vào loạt [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')], mưa đòn liên tiếp xuống đối thủ.\n\n"
  single_combat.0041.desc.sc_attacker.hail_mary:0 "Trận đấu này Ta không kỳ vọng sẽ thắng. Biết vậy, Ta không giữ an toàn, lao mình về phía trước với [sc_victor.Custom('signature_weapon')]-trước.\n\n"
  single_combat.0041.desc.sc_attacker.pocket_sand:0 "Cúi thấp, Ta nắm một nắm [sc_defender.Custom('GritType')] và ném thẳng vào [sc_loser.Custom('MaskFace')] của đối thủ. [sc_loser.GetSheHe|U] hoàn toàn bất ngờ,"
  single_combat.0041.desc.sc_attacker.nut_em:1 "Nhìn thấy một khe hở #EMP hoàn hảo#! trong phòng thủ đối thủ, Ta bước lên và hạ [sc_victor.Custom('MaskFace')] xuống [sc_loser.GetHerHim] #EMP mạnh mẽ#!."
  single_combat.0041.desc.sc_attacker.guard:0 "[sc_victor.Custom('signature_weapon')|U] giơ trước mặt cẩn trọng, Ta tiến lên, chặn từng đòn của đối thủ,"
  single_combat.0041.desc.sc_attacker.probing_attack:0 "Chiến đấu có chiến thuật, Ta giữ hầu hết đòn tấn công như giả vờ, chỉ lao vào những cú đánh sẽ gây sát thương mạnh nhất."
  single_combat.0041.desc.sc_attacker.onslaught:0 "[sc_victor.Custom('signature_weapon')|U] vung lên, Ta tung một mưa [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] về phía đối thủ."
  single_combat.0041.desc.sc_attacker.surprise_attack:0 "Một cú quét ấn tượng với [sc_victor.Custom('signature_weapon')] theo một hướng chuyển thành thay đổi cung, và một [sc_victor.Custom('SignatureWeaponAttemptedLight')] khiến đối thủ bất ngờ.\n\n"
  single_combat.0041.desc.sc_attacker.taunt:0 "Với sự thờ ơ, Ta ném những lời xúc phạm, chế giễu và khinh bỉ về phía đối thủ.\n\nKhông có gì ngạc nhiên,"
  single_combat.0041.desc.sc_attacker.put_the_boot_in.peg_leg:0 "Quyết tâm hạ gục đối thủ bất chấp rủi ro, Ta dồn toàn bộ trọng lượng vào một [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] khiến [sc_loser.GetHerHim] lảo đảo, tiếp theo là cú đá hiểm từ chân giả.\n\n"
  single_combat.0041.desc.sc_attacker.put_the_boot_in.fallback:0 "Quyết tâm hạ gục đối thủ, Ta dồn toàn bộ trọng lượng vào một [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] khiến [sc_loser.GetHerHim] lảo đảo, tiếp theo là cú đá hiểm.\n\n"
  single_combat.0041.desc.sc_attacker.strict_guard:0 "Không đối thủ nào phá được phòng thủ của Ta, hôm nay cũng không ngoại lệ. Ta ép [sc_loser.GetHerHim] lùi lại nhiều lần với chuỗi chắn hoàn hảo, chỉ tung một [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] tàn khốc khi [sc_loser.GetSheHe] hoàn toàn kiệt sức.\n\n"
  single_combat.0041.desc.sc_attacker.confident_attack:0 "Tự tin là một nửa trận đấu, Ta tung [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] một cách mượt mà với tất cả sự tự tin của một cao thủ kinh nghiệm."
  single_combat.0041.desc.sc_attacker.expert_onslaught:0 "Cánh tay cầm [sc_victor.Custom('signature_weapon')] của Ta nhanh như chớp, và đòn đánh mạnh như đá bị đập nát."
  single_combat.0041.desc.sc_attacker.attempt_disarm:0 "Nhìn thấy cơ hội hoàn hảo để tước vũ khí, ta vung [sc_victor.Custom('signature_weapon')] xuống với một chiêu [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] giật văng [sc_loser.Custom('signature_weapon')] khỏi tay [sc_loser.GetHerHis].\n\n"
 ### No need for a lightning_assault, as you can't end the duel in the first round.
  single_combat.0041.desc.sc_attacker.tire_opponent:0 "Từ tốn, giữ bình tĩnh, kết hợp chắn liên tục với né tránh khó chịu, Ta từ từ bào mòn năng lượng của đối thủ.\n\n"
  single_combat.0041.desc.sc_attacker.reason_you_suck_speech:0 "Ta đón từng cú đánh từ [sc_loser.Custom('signature_weapon')] của đối thủ bằng những lời châm biếm sắc bén và nhảy lùi.\n\n"
  single_combat.0041.desc.sc_attacker.technique_from_legend:0 "Ta bắt cơ thể mình hoà theo hình ảnh sống động trong huyền thoại, chuyển sang tư thế vụng về trong khi [sc_victor.Custom('SignatureWeaponFlourishPresentParticiple')] [sc_victor.Custom('signature_weapon')].\n\n"
  single_combat.0041.desc.sc_attacker.like_a_viper:0 "Với độ chính xác không sai sót, Ta lao mình với [sc_victor.Custom('signature_weapon')]-trước vào một điểm mù trong phòng thủ đối thủ."
  single_combat.0041.desc.sc_attacker.pocket_silver:0 "Nắm lấy một túi bạc nặng trên thắt lưng, Ta ném thẳng vào [sc_loser.Custom('MaskFace')] của đối thủ."
  single_combat.0041.desc.sc_attacker.martial_voice:0 "Ra lệnh cho kẻ tầm thường khác với những người quý tộc, nhưng công cụ Ta có vẫn tỏ ra hiệu quả, khi Ta hét to những lời sỉ nhục và đe dọa."
  single_combat.0041.desc.sc_attacker.mocking_boast:0 "Thật tuyệt vời, thực sự, khi dùng sự xấu hổ về sự bất tài của ai đó để"
  single_combat.0041.desc.sc_attacker.is_that_a_crocodile:0 "Ta lùi bước, đối thủ bám sát gót chân, liên tục dồn ép. Phía sau [sc_loser.GetHerHim], con quái thú bò sát"
  single_combat.0041.desc.sc_attacker.desert_warrior:0 "Ta hiểu rõ trò chơi này, và chỉ đơn giản né tránh đối thủ khi [sc_loser.GetSheHe] tiến lại gần, vừa đủ gần để tấn công nhưng không đủ để trúng đòn. Không lâu sau, sa mạc giúp Ta,"
  single_combat.0041.desc.sc_attacker.jungle_stalker:0 "Rừng rậm là đồng minh đắc lực trong mọi cuộc chiến, và ta chỉ cần chờ nó giăng bẫy đối phương. Khi [sc_loser.GetSheHe] vướng chân vào dây leo, ta ra đòn.\n\n"
  single_combat.0041.desc.sc_attacker.open_terrain_expert:0 "Không gian luôn là thứ quý giá trong một cuộc đấu, nhưng Ta nhường chỗ cho đối thủ như nước chảy trên đá. Và, như nước trên đá, Ta bào mòn [sc_loser.GetHerHim] với đòn đánh này đến đòn khác.\n\n"
  single_combat.0041.desc.sc_attacker.rough_terrain_expert.rocky:0 "Đồi núi vốn khó chiến đấu, nhưng kinh nghiệm của Ta biến trận đấu này thành cực hình cho đối thủ.\n\n"
  single_combat.0041.desc.sc_attacker.rough_terrain_expert.boggy:0 "Đầm lầy vốn khó chiến đấu, nhưng kinh nghiệm của Ta biến trận đấu này thành cực hình cho đối thủ.\n\n"
  single_combat.0041.desc.sc_attacker.forest_fighter:0 "Chiến đấu trong rừng là một nghệ thuật, kết hợp tinh tế và tàn nhẫn chỉ có được qua kinh nghiệm cay đắng. Ta sẵn sàng giúp đối thủ tích lũy kinh nghiệm đó,"
  single_combat.0041.desc.sc_attacker.raaargh:0 "Sự cuồng nộ, giận dữ và khao khát #BER giết chóc#! dâng trào trong lòng, xé toạc một #BER hố máu#! trong tâm trí ta. Ta cảm nhận được cơn #EMP cuồng nộ#! #BER xâm chiếm#!, #EMP nhưng đó là một#! #BER nỗi đau tuyệt vời! RAAARGH!#!\n\n"
  single_combat.0041.desc.sc_attacker.hard_grit:0 "Trong cơn chiến, không có sự tha thứ. Mỗi sai lầm của đối thủ bị trừng phạt gấp mười, mọi lỗi cẩu thả phải trả giá. Những [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] của Ta khoét sâu vào đối thủ, từng đòn đưa [sc_loser.GetHerHim] gần tới bờ vực thất bại.\n\n"
  single_combat.0041.desc.sc_attacker.feint_and_stab:0 "Ta vung [sc_victor.Custom('signature_weapon')] như một pha giả vờ lười biếng. Đối thủ không thấy dao phụ của Ta cho tới khi quá muộn, khi nó đã"
  single_combat.0041.desc.sc_attacker.butchery:0 "Một nụ cười nghiêm nghị nở trên môi khi Ta tung ra chuỗi [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] liên tiếp, mỗi đòn nhấn mạnh nỗi đau hơn chiến thắng.\n\n"
  single_combat.0041.desc.sc_attacker.stoic_veteran:0 "[sc_victor.Custom('signature_weapon')|U] trong tay, Ta chém vào đối thủ, những đòn dài, đều đặn ép [sc_loser.GetHerHim] lùi lại liên tục."
  single_combat.0041.desc.sc_attacker.blade_dance:0 "Ta xoay [sc_victor.Custom('signature_weapon')] với một điệu múa chết chóc, dệt nên bản nhạc đau đớn trên đối thủ với từng đòn."
  single_combat.0041.desc.sc_attacker.wrath_of_highgod:0 "Ta gầm lên tỏ lòng sùng kính [sc_victor.GetFaith.HighGodName], [sc_victor.Custom('signature_weapon')] giơ cao như cúng dường."
  single_combat.0041.desc.sc_attacker.hurt_me_better:0 "Đối thủ dường như nghĩ rằng [sc_loser.GetSheHe] đang làm ta đau với những đòn đánh nhỏ nhặt, nhưng mỗi cơn đau chỉ thúc đẩy ta chiến đấu mạnh mẽ hơn, nhanh hơn.\n\n"
  single_combat.0041.desc.sc_attacker.special_fallback:0 "Nhìn thấy khoảnh khắc sơ hở trong phòng thủ đối thủ, Ta nhắm cú đá hiểm vào cẳng chân [sc_loser.GetHerHis]."
  single_combat.0041.desc.sc_attacker.something_to_hide:0 "Giọng chỉ vừa trên thì thầm, Ta rít ra lời nhắc rõ ràng về quyền kiểm soát đối thủ, khiến [sc_loser.GetHerHim] lập tức đứng sững.\n\n"

 ## Aggressor Won, Own Combat Move Injury
  single_combat.0041.desc.sc_attacker.wait_and_hope.injury:0 "tuy nhiên vẫn trúng vào khớp xương bàn tay [sc_loser.GetHerHis] cầm [sc_loser.Custom('signature_weapon')] của [sc_loser.GetFirstNameNoTooltip]. Phản xạ, bàn tay mở ra, và vũ khí của [sc_loser.GetHerHis] rơi xuống đất.\n\n[sc_loser.GetFirstNameNoTooltip] và Ta nhìn nhau tròn mắt; rõ ràng [sc_loser.GetSheHe] cũng ngạc nhiên như Ta.\n\nCảm giác như một thời gian dài trước khi Ta nhớ ra phải ra lệnh đầu hàng."
  single_combat.0041.desc.sc_attacker.unsure_attack.injury:0 "Phép màu xuất hiện, đòn đánh tình cờ trúng [sc_loser.GetFirstNameNoTooltip] ở một góc khó xử, hất văng [sc_loser.GetHerHim] xuống đất!\n\nĐến khi [sc_loser.GetWomanMan] loay hoay đứng dậy, ta đã thủ sẵn [sc_victor.Custom('signature_weapon')] để [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]. Lời quy hàng đến ngay sau đó."
  single_combat.0041.desc.sc_attacker.enthusiastic_onslaught.injury:0 "Dễ đoán được, chẳng lâu sau ta ép [sc_loser.GetFirstNameNoTooltip] quỵ xuống, và từ đó chỉ cần một động tác vung [sc_victor.Custom('signature_weapon')] nhẹ nhàng để đưa [sc_victor.Custom('SignatureWeaponTipType')] vào cổ họng [sc_loser.GetHerHis].\n\nLời quy hàng thốt ra ngay khi kim loại lạnh chạm vào cổ [sc_loser.GetHerHis]."
  single_combat.0041.desc.sc_attacker.hail_mary.injury:0 "[sc_loser.GetFirstNameNoTooltip] nhìn Ta, vẻ chế nhạo trong [sc_loser.GetHerHis] [my_foe.Custom('EyeEyes')], không né tránh nhưng dễ dàng dùng [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')] chắn đòn.\n\nGần như theo bản năng, Ta quét chân quanh một đầu gối [sc_loser.GetHerHis] và kéo, nhưng thực sự hiệu quả! Đối thủ ngã, và Ta chuẩn bị cho cú giết quyết định.\n\nLệnh đầu hàng hoảng sợ và bất ngờ xuất hiện ngay khi Ta bắt đầu vung [sc_victor.Custom('signature_weapon')]."
  single_combat.0041.desc.sc_attacker.pocket_sand.injury:0 "ho khạc và sặc khi nửa chừng xuống thanh quản [sc_loser.GetHerHis].\n\nTa không mất thời gian, đánh gối [sc_loser.GetFirstNamePossessiveNoTooltip] khỏi dưới chân bằng một [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], và [sc_loser.GetWomanMan] ngã xuống, vẫn quằn quại và cố gạt [sc_defender.Custom('GritType')] ra khỏi [sc_loser.GetHerHis] [sc_defender.Custom('EyeEyes')].\n\nKhi [sc_loser.GetSheHe] thành công, Ta đã chuẩn bị sẵn sàng để [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonFutureGendered',SCOPE.sC('sc_loser'))].\n\nLệnh đầu hàng xảy ra khá nhanh."
  single_combat.0041.desc.sc_attacker.nut_em.injury:0 "Một số người sẽ gọi đó là mạo hiểm hay ngu ngốc, nhưng một cú đầu vào mặt khiến hầu hết đối thủ mất lời biện hộ tốt nhất, dù Ta cũng bị đau.\n\nDù cảm giác tệ ra sao, [sc_loser.GetFirstNameNoTooltip] rõ ràng còn tệ hơn, quằn quại trên đất, thở gấp và ôm [sc_loser.GetHerHis] [sc_loser.Custom('MaskFace')].\n\nTa phải ổn định bản thân một chút, nhưng vẫn có thể chuẩn bị [sc_victor.Custom('signature_weapon')] để [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))] kịp thời buộc đối thủ đầu hàng."
  single_combat.0041.desc.sc_attacker.guard.injury:0 "cho đến khi ta chớp được cơ hội #EMP hoàn hảo#!.\n\nVới một cú đỡ và phản đòn nhanh tựa chớp, ta xoay [sc_loser.Custom('signature_weapon')] văng khỏi tay [sc_loser.GetFirstNamePossessiveNoTooltip].\n\nĐối thủ kinh hãi khi ta chuẩn bị đòn thứ hai để kết liễu. Nhưng bạo lực thêm nữa trở nên thừa thãi, khi ta nhận được lời quy hàng ngay khi [sc_loser.GetFirstNameNoTooltip] nhận ra [sc_loser.GetSheHe] không còn bao nhiêu cơ hội."
  single_combat.0041.desc.sc_attacker.probing_attack.injury:0 "\n\nKết quả là một cuộc chiến tiêu hao đáng sợ, ít nhất là từ góc nhìn của [sc_loser.GetFirstNamePossessiveNoTooltip], kết thúc bằng việc ta đánh văng [sc_loser.Custom('signature_weapon')] khỏi tay [sc_loser.GetHerHis] mỏi mệt.\n\nMay mắn cho [sc_loser.GetFirstNameNoTooltip], cả hai ta đều thấy rõ trận này sẽ kết thúc thế nào từ lâu, và [sc_loser.GetSheHe] nhanh chóng quy hàng sau khi bị tước vũ khí."
  single_combat.0041.desc.sc_attacker.onslaught.injury:0 "Mỗi đòn đánh đều gây tổn thất nặng nề, đòi hỏi những pha đỡ đòn vất vả đến mức mồ hôi bắt đầu chảy xuống [sc_loser.Custom('MaskFace')] của [sc_loser.GetWomanMan] chỉ vì việc tự vệ.\n\nKhông ai có thể duy trì nỗ lực đó lâu, và cuối cùng, [sc_loser.GetFirstNameNoTooltip] đổ gục xuống [sc_defender.Custom('GroundType')].\n\nTa [sc_victor.Custom('SignatureWeaponAction')] [sc_victor.Custom('signature_weapon')] của mình và nhận được một lời quy hàng kiệt quệ."
  single_combat.0041.desc.sc_attacker.surprise_attack.injury:0 "Đòn đánh trúng mạnh hơn ta dự kiến, khiến [sc_loser.GetFirstNameNoTooltip] xoay người, #EMP suýt chút nữa#! quỵ xuống hoàn toàn.\n\n[sc_loser.GetSheHe|U] lấy lại thăng bằng vào giây phút cuối, nhưng ta đã thủ sẵn [sc_victor.Custom('signature_weapon')] để [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))] [sc_loser.GetHerHim].\n\nMột thế bế tắc căng thẳng diễn ra khi [sc_loser.GetFirstNameNoTooltip] cân nhắc lựa chọn của mình, nhưng cuối cùng [sc_loser.GetSheHe] cũng thốt ra lời quy hàng cay đắng."
  single_combat.0041.desc.sc_attacker.taunt.injury:0 "khiến [sc_loser.GetSheHe] trở nên giận dữ đến mức bỏ mặc các nguyên tắc chiến đấu thông thường và ném [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')] xuống đất, quyết tâm giết ta bằng [sc_loser.Custom('HandHands')] không.\n\nChỉ cần một động tác vung nhẹ [sc_victor.Custom('signature_weapon')] là đủ để nhắc nhở [sc_loser.GetFirstNameNoTooltip] vị thế của mình, và ta nhanh chóng nhận được lời quy hàng thốt ra từ kẽ răng."
  single_combat.0041.desc.sc_attacker.put_the_boot_in.injury: "[sc_loser.GetFirstNameNoTooltip] loạng choạng lùi lại, và ta không lãng phí cơ hội, lao vào như một cơn bão [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] đánh [sc_loser.GetHerHim] ngã nhào xuống [sc_defender.Custom('GroundType')].\n\nYếu ớt, đối thủ co giật bàn tay cầm [sc_loser.Custom('signature_weapon')], cố gắng tập hợp ý chí để chống lại ta.\n\nTa chỉ đơn giản thủ sẵn vũ khí để [sc_victor.Custom2('SignatureWeaponKillTypeHeadThirdPersonFutureGendered',SCOPE.sC('sc_loser'))], ít nhất cho đến khi nghe thấy tiếng quy hàng run rẩy."
  single_combat.0041.desc.sc_attacker.strict_guard.injury: "Khi [sc_loser.GetFirstNameNoTooltip] văng ngược lại, ta lao theo, nện [sc_victor.Custom('SignatureWeaponEndType')] của [sc_victor.Custom('signature_weapon')] xuống [sc_loser.GetHerHis] [sc_loser.Custom('MaskFace')]. Có ít tiếng #EMP rắc#! nào nghe thỏa mãn đến thế.\n\nChoáng váng và kiệt sức, đối thủ gục xuống đất, mất luôn vũ khí. [sc_loser.GetSheHe] quá mệt mỏi đến nỗi phải cần thêm vài cú đá mới có được lời quy hàng chính thức."
  single_combat.0041.desc.sc_attacker.confident_attack.injury: "[sc_loser.GetFirstNameNoTooltip] cố gắng hết sức để chống đỡ, nhưng [sc_loser.GetSheHe] hoàn toàn ở thế phòng thủ, và lớp phòng thủ đó ngày càng yếu đi sau mỗi đòn đánh.\n\nKhi cơ hội đến, ta đánh văng [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')] đi chỉ với một chiêu [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]. Và cứ thế, cuộc so tài đã định.\n\nTa nhận được lời quy hàng trước cả khi kịp lấy đà cho đòn đánh tiếp theo."
  single_combat.0041.desc.sc_attacker.expert_onslaught.injury:0 "Đòn này nối tiếp đòn kia, ta đánh đối thủ đến mức bị thương và choáng váng, nện [sc_loser.GetHerHim] xuống đất bằng tất cả sự cuồng nộ mà [sc_victor.GetFaith.WarGodName] có thể ban cho ta.\n\nKhi tất cả những gì còn lại chỉ là một [sc_loser.GetWomanMan] đang chảy máu và co giật, ta tự hỏi liệu mình có đi quá xa không. Sau đó [sc_loser.GetFirstNameNoTooltip] ho sặc sụa đến mức tuột tay khỏi [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')], và ta thở phào nhẹ nhõm.\n\nKhi nỗi lo đã qua, ta đá văng vũ khí của đối thủ ra xa, và đặt vũ khí của mình lên cổ [sc_loser.GetHerHis]. Phải mất vài lần, nhưng cuối cùng [sc_loser.GetFirstNameNoTooltip] cũng chịu quy hàng."
  single_combat.0041.desc.sc_attacker.attempt_disarm.injury:0 "Cú này... diễn ra suôn sẻ hơn dự đoán. [sc_loser.GetFirstNameNoTooltip] và Ta chỉ nhìn nhau bối rối: [sc_loser.GetSheHe] không chắc có nên chạy theo vũ khí hay đầu hàng, Ta thì không chuẩn bị cho một pha hoàn hảo như vậy.\n\nNói về điều đó, Ta dập tắt mọi ý định [sc_loser.GetFirstNameNoTooltip] tiếp tục chiến đấu với một nhướn mày và một [sc_victor.Custom('SignatureWeaponAction')] của [sc_victor.Custom('signature_weapon')].\n\nLệnh đầu hàng xấu hổ nhưng đến rất nhanh."
 ### No need for a lightning_assault, as you can't end the duel in the first round.
  single_combat.0041.desc.sc_attacker.tire_opponent.injury:0 "Phải công nhận với [sc_loser.GetFirstNamePossessiveNoTooltip], trận đấu kéo dài lâu hơn Ta tưởng, nhưng cuối cùng, thời gian kéo dài của cuộc đấu bắt đầu tỏ ra rõ ràng trên [sc_loser.GetHerHim].\n\nTa chờ thêm một lúc để chắc chắn, khích tướng đối thủ tiếp tục tấn công bằng vài [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')], rồi đánh bay [sc_loser.Custom('signature_weapon')] khỏi tay [sc_loser.GetHerHis] bằng một cú [sc_victor.Custom('SignatureWeaponAttemptedHeavy')].\n\nKiệt sức, [sc_loser.GetFirstNameNoTooltip] đầu hàng, rồi lao đầu [sc_loser.Custom('MaskFace')] xuống [sc_defender.Custom('GroundType')]."
  single_combat.0041.desc.sc_attacker.reason_you_suck_speech.injury:1 "Từng câu từng câu, Ta luồn vào cái Ta của [sc_loser.GetHerHis] và tận dụng những bất an của [sc_loser.GetHerHis], khiến phòng thủ của [sc_loser.GetHerHis] trở nên cẩu thả chỉ vì bực mình.\n\nChỉ khi sự khó chịu của [sc_loser.GetFirstNamePossessiveNoTooltip] lên đến đỉnh điểm, Ta mới lao tới, giật [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')] bằng một cú [sc_victor.Custom('SignatureWeaponAttemptedLight')].\n\nMột lời nhận xét cuối về sự kiên định của [sc_loser.GetHerHis] dưới áp lực, rồi Ta chờ lệnh đầu hàng đắng cay. Nước mắt mặn chưa bao giờ ngọt ngào đến thế."
  single_combat.0041.desc.sc_attacker.technique_from_legend.injury:0 "Rồi, bằng cách nào đó, mọi thứ chỉ... diễn ra hoàn hảo. Ta dễ dàng hạ phòng thủ [sc_loser.GetFirstNamePossessiveNoTooltip], đánh rơi [sc_loser.Custom('signature_weapon')] khỏi tay [sc_loser.GetHerHis], và hất [sc_loser.GetHerHim] xuống đất.\n\nTrước khi Ta kịp nhận ra, Ta đã chuẩn bị sẵn sàng để [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]. Bối rối, hoảng sợ, [sc_loser.GetFirstNameNoTooltip] chỉ kịp cà lăm ra lệnh đầu hàng."
  single_combat.0041.desc.sc_attacker.like_a_viper.injury:0 "[sc_loser.GetFirstNameNoTooltip], có lẽ nhìn thấy cuộc đời mình thoáng qua trước mắt khi vũ khí của ta lao về phía tim [sc_loser.GetHerHis], vội vã đỡ đòn.\n\nTa khẽ nở một nụ cười nhếch mép, móc vũ khí của mình vào đối thủ một cách khó xử, và bằng một cú hất mạnh, biến cú đánh chí mạng thành một đòn tước vũ khí. [sc_loser.GetFirstNamePossessiveNoTooltip] [sc_loser.Custom('signature_weapon')] bay vút vào không trung.\n\nKhi trận đấu đã thắng, ta cố tình tạo dáng một cách phô trương bằng cách đặt [sc_victor.Custom('SignatureWeaponTipType')] của vũ khí lên tim đối thủ. Lời quy hàng gần như nhanh tương đương với cú vung [sc_victor.Custom('signature_weapon')] ban đầu của ta."
  single_combat.0041.desc.sc_attacker.pocket_silver.injury:0 "\n\nMặc dù [sc_loser.GetFirstNameNoTooltip] cố né được vật thể phóng tới, ta tận dụng thời gian đó để đưa [sc_victor.Custom('signature_weapon')] của mình áp sát #EMP bên trong#! lớp phòng thủ của [sc_loser.GetHerHis], thúc mạnh [sc_victor.Custom('SignatureWeaponTipAdjective')] [sc_victor.Custom('SignatureWeaponTipType')] vào cổ họng của [sc_loser.GetWomanMan].\n\n[sc_loser.GetFirstNameNoTooltip] không quy hàng ngay lập tức. Trong một khoảnh khắc, dường như [sc_loser.GetSheHe] thậm chí còn định làm gì đó với vũ khí của chính mình, nhưng một cái nhìn hung dữ và sự chuyển dịch trọng tâm của ta khiến rõ ràng là chuyện đó chỉ có thể kết thúc theo một cách duy nhất.\n\nTa nhận được lời quy hàng."
  single_combat.0041.desc.sc_attacker.martial_voice.injury:0 "[sc_loser.GetFirstNameNoTooltip] hoàn toàn bất ngờ khi Ta chuyển từ gầm thét dữ dội sang [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], nhảy lùi trong sợ hãi phản xạ.\n\nBản năng nhanh nhưng thiếu tinh tế, và đối thủ thể hiện điều này bằng việc đánh rơi [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')] khi [sc_loser.GetSheHe] lùi lại.\n\nTa đã nửa chừng chuẩn bị cú giết khi [sc_loser.GetFirstNameNoTooltip] vội vàng đầu hàng."
  single_combat.0041.desc.sc_attacker.mocking_boast.injury:0 "mở ra một sơ hở trong lớp phòng thủ của chúng. Đúng là định mệnh tự mình sắp đặt, mặc dù có thêm một chút trợ giúp.\n\nTừ đó, một đòn đánh chắc nịch vào tay cầm [sc_loser.Custom('signature_weapon')] của [sc_loser.GetFirstNamePossessiveNoTooltip] khiến vũ khí của [sc_loser.GetHerHis] văng ra. Ta xoay [sc_victor.Custom('signature_weapon')] của mình một cách điệu nghệ, chuẩn bị [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]. Ta không thể cưỡng lại việc buông một lời châm chọc cuối cùng.\n\n\"Giờ thì, kẻ thua cuộc nói gì nhỉ?\"\n\nQuy hàng, hóa ra là vậy. Quy hàng, quy hàng, quy hàng."
 ### No need for an is_that_a_crocodile, as it's never just an injury.
  single_combat.0041.desc.sc_attacker.desert_warrior.injury:0 "khiến [sc_loser.GetFirstNameNoTooltip] chao đảo trên bờ vực kiệt sức.\n\nTa chỉ tấn công khi cái nóng bức bối đã đánh gục hoàn toàn đối thủ, lao vào với một loạt [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] khiến đối thủ văng vào [sc_defender.Custom('GroundType')].\n\nĐến khi [sc_loser.GetFirstNameNoTooltip] kịp lộn người nằm ngửa, ta đã thủ sẵn [sc_victor.Custom('signature_weapon')] để [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]. [sc_loser.GetSheHe|U] nhổ ra một ngụm [sc_defender.Custom('GroundType')] và quy hàng."
  single_combat.0041.desc.sc_attacker.jungle_stalker.injury:0 "Một cú đá nhanh vào hạ bộ hạ gục đối thủ, hét lên, lao vào bụi rậm. [sc_loser.GetFirstNameNoTooltip] vùng vẫy lúc đầu, nhưng nhanh chóng bất động khi Ta áp [sc_victor.Custom('signature_weapon')] với [sc_victor.Custom('SignatureWeaponTipType')] vào [sc_loser.GetHerHis] [sc_loser.Custom('MaskFace')].\n\nLệnh đầu hàng xảy ra ngay lập tức."
  single_combat.0041.desc.sc_attacker.open_terrain_expert.injury:0 "Cuối cùng, [sc_loser.GetFirstNameNoTooltip] vấp ngã vì kiệt sức, và ta chớp lấy hành động bằng một chiêu [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] hất văng [sc_loser.GetHerHim] xuống đất.\n\nĐối thủ cố gắng lảo đảo đứng dậy, nhưng cuộc giãy giụa chuyển thành hoảng loạn khi ta đặt gót chân lên đầu [sc_loser.GetHerHis].\n\nTa nâng [sc_victor.Custom('signature_weapon')] lên để [sc_victor.Custom2('SignatureWeaponKillTypeHeadThirdPersonFutureGendered',SCOPE.sC('sc_loser'))], và nhận được một lời quy hàng đầy mê sảng cho những rắc rối của mình."
  single_combat.0041.desc.sc_attacker.rough_terrain_expert.injury.rocky:0 "Hết lần này đến lần khác, ta đánh [sc_loser.GetFirstNameNoTooltip] văng ngược lại, và hết lần này đến lần khác, [sc_loser.GetSheHe] lại phục hồi vào giây cuối cùng. Ít nhất là cho đến khi [sc_loser.GetSheHe] thất bại, và bị hất văng ngược lại qua một con dốc nhỏ.\n\nTa lao theo đối thủ, và đã dí [sc_victor.Custom('signature_weapon')] của mình vào sau gáy [sc_loser.GetHerHis] trước khi [sc_loser.GetSheHe] kịp trấn tĩnh [sc_loser.GetHerselfHimself]. Một lời quy hàng đầy bầm dập được đưa ra không chút do dự."
  single_combat.0041.desc.sc_attacker.rough_terrain_expert.injury.boggy:0 "Phải mất khá nhiều lần, nhưng cuối cùng ta cũng đẩy được [sc_loser.GetFirstNameNoTooltip] vào vũng nước đầm lầy hôi hám sâu đến đầu gối. [sc_loser.GetSheHe|U] trượt chân, làm mất [sc_loser.Custom('signature_weapon')] khi ngã xuống, và chìm xuống dưới mặt nước cùng một tiếng ùm đầy mùi hôi thối.\n\nKhá dễ dàng để ta dí gót giày lên [sc_loser.GetHerHis] [sc_loser.Custom('MaskFace')] từ chỗ đứng vững chãi, và sự đe dọa về việc chết đuối trong vùng đầm lầy hôi hám đó đã mang lại cho ta một lời quy hàng nhanh chóng, dù nghe hơi ùng ục."
  single_combat.0041.desc.sc_attacker.forest_fighter.injury:0 "Len lỏi qua bụi rậm và cây cối với sự hoang dã.\n\n[sc_loser.GetFirstNameNoTooltip] không hề thấy gốc cây mục Ta dẫn [sc_loser.GetHerHim] tới, vấp ngã ra sau với tiếng la, đánh rơi [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')] trượt đi trong bụi rậm.\n\nMột cú đá chắc vào ngực và một [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] cuối cùng là đủ để đối thủ đầu hàng."
  single_combat.0041.desc.sc_attacker.raaargh.injury:0 "Lao tới trước như một [sc_victor.GetWomanMan] bị quỷ ám, ta phá vỡ lớp phòng thủ của đối thủ và xé [sc_loser.Custom('signature_weapon')] khỏi tay [sc_loser.GetHerHis] bằng một chiêu [sc_victor.Custom('SignatureWeaponAttemptedHeavy')].\n\nNhanh đến mức mắt không theo kịp, mạnh đến mức #EMP xương cốt ta#! cũng phải rung lên, ta dội xuống một trận mưa đòn đầy thù hận, dễ dàng hất văng [sc_loser.GetHerHim] xuống đất.\n\nCơn cuồng nộ tan biến nhanh như lúc ập đến, để lại ta run rẩy nhưng vẫn giữ được sự tỉnh táo. [sc_loser.GetFirstNameNoTooltip] gần như hét lên lời quy hàng khi [sc_loser.GetSheHe] vẫn còn có thể."
  single_combat.0041.desc.sc_attacker.hard_grit.injury:0 "Chẳng bao lâu, ta có thể đánh văng [sc_loser.Custom('signature_weapon')] khỏi tay [sc_loser.GetHerHis] bằng một chiêu [sc_victor.Custom('SignatureWeaponAttemptedLight')] chuẩn xác.\n\n[sc_loser.GetFirstNameNoTooltip] thoáng chút choáng váng, nhưng đã lắp bắp thốt ra lời quy hàng trước khi ta [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]."
  single_combat.0041.desc.sc_attacker.feint_and_stab.injury: "lao tới với chuôi kiếm hướng về phía [sc_loser.GetHerHis] [sc_loser.Custom('MaskFace')].\n\nĐòn đánh tác động #EMP mạnh#! vào [sc_loser.GetFirstNameNoTooltip], mạnh đến mức ta thề là mình có thể cảm nhận được vết bầm trên xương, và [sc_loser.GetSheHe] lảo đảo lùi lại trong trạng thái choáng váng.\n\nKhi [sc_loser.Custom('signature_weapon')] tuột khỏi tay [sc_loser.GetHerHis], đối thủ của ta lắp bắp lời quy hàng mà không cần ta phải làm gì thêm."
  single_combat.0041.desc.sc_attacker.butchery.injury: "[sc_loser.GetFirstNameNoTooltip] lảo đảo và khuỵu xuống sau mỗi đòn đánh, nhưng mỗi cơn đau khoái lạc chạy dọc cơ thể [sc_loser.GetHerHim] chỉ thúc giục ta chiến đấu hăng hơn.\n\nĐến khi [sc_loser.GetSheHe] gục ngã, [sc_loser.GetSheHe] đang thở hổn hển và nhổ ra những dây máu đặc quánh.\n\nTa chuẩn bị lười biếng [sc_victor.Custom2('SignatureWeaponKillTypeRearHeadThirdPersonPresentGendered',SCOPE.sC('sc_loser'))]. Ta gần như thất vọng khi nghe thấy một lời quy hàng đau đớn trước khi [sc_victor.Custom('signature_weapon')] của mình kịp hạ xuống."
  single_combat.0041.desc.sc_attacker.stoic_veteran.injury:0 "Tất cả những gì [sc_loser.GetFirstNameNoTooltip] làm được là cố gắng theo kịp Ta, cho đến khi một cú đánh trúng [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')] mạnh đến mức [sc_loser.Custom('SignatureWeaponBreaksThirdPersonSingularPresent2')] thật.\n\nLúng túng, không vũ khí, đối thủ lùi lại vài bước khi nhận ra thực tại.\n\nLệnh đầu hàng nhanh chóng."
  single_combat.0041.desc.sc_attacker.blade_dance.injury:0 "Chiến đấu thực sự là nghệ thuật, và Ta chẳng thiếu phần nghệ thuật.\n\nChỉ khi [sc_loser.GetFirstNameNoTooltip] gần như hôn mê, Ta tung cú đánh cuối, tước vũ khí [sc_loser.GetHerHim] bằng một [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] mượt mà khiến [sc_loser.GetWomanMan] [sc_loser.Custom('signature_weapon')] bay ra.\n\nTa chuẩn bị tinh thần và thể chất để [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))], dừng lại đúng lúc đối thủ đầu hàng."
  single_combat.0041.desc.sc_attacker.wrath_of_highgod.injury:0 "Đối thủ có vẻ nghĩ rằng lời cầu nguyện sẽ kéo dài hơn thực tế, vì [sc_loser.GetSheHe] hoàn toàn bị bất ngờ khi ta chuyển thế đột ngột sang một chiêu [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] gần như hất [sc_loser.GetHerHim] xuống đất.\n\nTrong khi [sc_loser.GetFirstNameNoTooltip] gượng dậy, ta lao tới, trượt [sc_victor.Custom('SignatureWeaponTipType')] của [sc_victor.Custom('signature_weapon')] vào cách [sc_loser.GetHerHis] [sc_loser.Custom('MaskFace')] chỉ vài tấc.\n\nMột lời quy hàng chưa bao giờ cảm thấy thỏa mãn hơn khi nó được dâng hiến cho [sc_victor.GetFaith.HighGodName]."
  single_combat.0041.desc.sc_attacker.hurt_me_better.injury:0 "Chậm rãi, nỗi đau và adrenaline cuộn trào lên đến cao trào, ta hét lên một tiếng đại hùng rồi lao vào một làn sóng [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] đẩy [sc_loser.GetFirstNameNoTooltip] quỵ xuống đầu gối.\n\nĐối thủ cố gắng đỡ đòn, hoàn toàn không để ý đến đầu gối của ta đang lao thẳng vào [sc_loser.GetHerHis] [sc_loser.Custom('MaskFace')]. [sc_loser.GetSheHe|U] ngã ngửa ra sau, thở hổn hển.\n\n[sc_loser.GetFirstNameNoTooltip] vẫn đang thở hổn hển khi [sc_loser.GetSheHe] thốt ra lời quy hàng vài giây sau đó, đôi mắt khóa chặt vào [sc_victor.Custom('signature_weapon')] đang lao tới của ta."
  single_combat.0041.desc.sc_attacker.special_fallback.injury:0 "Nó dường như khiến [sc_loser.GetHerHim] mất cảnh giác, và [sc_loser.GetSheHe] vấp ngã, rất mạnh.\n\nTa tận dụng cơ hội nhẹ nhàng đặt [sc_victor.Custom('SignatureWeaponTipType')] của [sc_victor.Custom('signature_weapon')] lên mặt [sc_loser.GetFirstNamePossessiveNoTooltip].\n\nTa nhận được lời quy hàng ngay khi sự bàng hoàng qua đi."
  single_combat.0041.desc.sc_attacker.something_to_hide.injury:0 "Trong khi [sc_loser.GetFirstNameNoTooltip] đứng ngẩn ngơ trong suy nghĩ, ta tung một đòn [sc_victor.Custom('SignatureWeaponAttemptedLight')] hất [sc_loser.GetHerHim] ra sau, rồi một đòn thứ hai giật [sc_loser.Custom('signature_weapon')] khỏi tay [sc_loser.GetHerHis].\n\nKhông vũ khí, nằm trong tầm [sc_victor.Custom('SignatureWeaponWoundVerb1PresentParticiple')] dễ dàng, và chỉ còn vài giây trước khi chết dưới tay ta, [sc_loser.GetFirstNameNoTooltip] quy hàng."

 ## Aggressor Won, Own Combat Move Fatality
  single_combat.0041.desc.sc_attacker.wait_and_hope.fatality:0 "vẫn xuyên thẳng qua phòng thủ của [sc_loser.GetFirstNamePossessiveNoTooltip] và [sc_victor.Custom2('SignatureWeaponKillTypeTorsoThirdPersonActiveGendered',SCOPE.sC('sc_loser'))].\n\nĐối thủ lảo đảo ngửa ra sau, kéo [sc_victor.Custom('signature_weapon')] của Ta ra với một tiếng schlurp kinh tởm. Máu trào ra, rồi tuôn ra, ngập quanh [sc_loser.GetHerHim]. Miệng [sc_loser.GetWomanMan] co giật và thõng xuống, co giật như cố nói gì đó qua nỗi đau.\n\n[sc_loser.GetFirstNameNoTooltip] trông sửng sốt y hệt Ta."
  single_combat.0041.desc.sc_attacker.unsure_attack.fatality:0 "Ta không thể chỉ ra chính xác #EMP nơi#! nó đánh trúng [sc_loser.GetFirstNameNoTooltip], nhưng chắc chắn trúng, vì [sc_loser.GetSheHe] loạng choạng lùi lại. Máu chảy ra từ đâu đó trên ngực [sc_loser.GetHerHis], khiến [sc_loser.GetSheHe] ngẩn ra nhìn không tin.\n\nTa biết kết cục ra sao và không muốn đối thủ kéo Ta xuống mồ cùng [sc_loser.GetHerHim]. Giơ cao [sc_victor.Custom('signature_weapon')|U], Ta lao tới để tung đòn quyết định."
  single_combat.0041.desc.sc_attacker.enthusiastic_onslaught.fatality:0 "Sự nhiệt tình có thể bù đắp cho nhiều thứ, và ở đây nó quản lý để thay thế hoàn toàn kỹ năng, xé toạc [sc_loser.Custom('signature_weapon')] khỏi tay [sc_loser.GetFirstNamePossessiveNoTooltip] chỉ bằng sức mạnh thuần túy.\n\nTa không lãng phí thời gian tiến tới đối thủ đã bị tước vũ khí, người vốn đang cố tự che chắn bằng [sc_loser.GetHerHis] [sc_loser.Custom('HandHands')], và với sự hiệu quả tàn nhẫn, [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonFutureGendered',SCOPE.sC('sc_loser'))].\n\nTiếng thét ngừng lại từ lâu trước khi dòng máu ngừng chảy."
  single_combat.0041.desc.sc_attacker.hail_mary.fatality:0 "Mãi khi lao tới Ta mới nhận ra đánh quá cao. Hoảng loạn, Ta vung vũ khí xuống, và cú giật bất ngờ xuyên qua phòng thủ [sc_loser.GetFirstNamePossessiveNoTooltip] thẳng vào hộp sọ [sc_loser.GetHerHis].\n\nCú đánh [sc_victor.Custom('SignatureWeaponWoundVerb1ThirdPersonPresent')] xuyên thẳng vào xương và não, giết [sc_loser.GetHerHim] ngay lập tức.\n\nMột lát, xác [sc_loser.GetFirstNamePossessiveNoTooltip] lảo đảo, treo trên cánh tay Ta giữ [sc_victor.Custom('signature_weapon')], trước khi đổ ụp xuống [sc_defender.Custom('GroundType')]."
  single_combat.0041.desc.sc_attacker.pocket_sand.fatality:0 "Ta tận dụng khoảnh khắc đối thủ sơ hở để húc [sc_victor.Custom('signature_weapon')] vào bụng [sc_loser.GetWomanMan] hết sức có thể.\n\nKhi [sc_loser.GetFirstNameNoTooltip] ngã ngửa, mù lòa và chảy máu, Ta lao vào cú đánh chí mạng vào cổ họng [sc_loser.GetHerHis]. Thịt rách như thịt heo, bắn máu cả hai chúng Ta.\n\n[sc_loser.GetSheHe|U] chết trong vòng một phút sau khi ngã xuống đất."
  single_combat.0041.desc.sc_attacker.nut_em.fatality:0 "Như với mọi cú húc đầu, nó gần như đau đớn với ta cũng như với [sc_loser.GetHerHim], nhưng [sc_loser.GetFirstNameNoTooltip] có vẻ... lạ, sau đó. Như thể cú đánh đã làm xáo trộn tâm trí [sc_loser.GetHerHis].\n\nSau một vài [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] để thăm dò lớp phòng thủ của đối thủ, ta mạo hiểm tung một chiêu [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]. Đòn đánh [sc_victor.Custom('SignatureWeaponWoundVerb1ThirdPersonPresent')] sâu vào vai [sc_loser.GetHerHis], đâm xuyên đến các cơ quan trọng yếu của khoang ngực.\n\nMáu và mảnh xương vụn bắn ra từ vết thương khi ta rút [sc_victor.Custom('signature_weapon')] ra. [sc_loser.GetFirstNameNoTooltip] lảo đảo, chao nghiêng, đổ gục, và nằm bất động."
  single_combat.0041.desc.sc_attacker.guard.fatality:0 "cho đến khi một cú đánh thiếu tính toán để ta hất [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')] đi.\n\nTrước khi [sc_loser.GetFirstNameNoTooltip] kịp phản đối, ta lao vào một loạt [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')], trích xuất khoản phí bằng máu và nỗi đau cho sự thiếu tính toán của [sc_loser.GetHerHis].\n\nKhông lâu sau đối thủ của ta bị dồn quỵ xuống đầu gối, [sc_loser.Custom('MaskFace')] phủ đầy những dây nước bọt máu. Với tất cả sự điềm tĩnh của một đao phủ, cuối cùng ta [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]."
  single_combat.0041.desc.sc_attacker.probing_attack.fatality:0 "Dần dần, Ta bào mòn hình thể [sc_loser.GetFirstNamePossessiveNoTooltip] cho đến khi hất [sc_loser.GetHerHim] bay bằng một cú [sc_victor.Custom('SignatureWeaponAttemptedLight')].\n\nNgay khi đối thủ trên không, Ta dồn toàn lực vào một cú [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] trúng ngay khi [sc_loser.GetSheHe] chạm đất, [sc_victor.Custom2('SignatureWeaponKillTypeRearTorsoThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))] bằng một đòn mạnh.\n\n[sc_loser.GetFirstNameNoTooltip] nhanh chóng tắt thở."
  single_combat.0041.desc.sc_attacker.onslaught.fatality:0 "Mỗi đòn đánh cướp đi của [sc_loser.GetHerHim] một thứ gì đó: tư thế, không khí trong phổi, [sc_loser.Custom('signature_weapon')], và những mảng thịt của [sc_loser.GetHerHis].\n\nChỉ khi [sc_loser.GetSheHe] gần như hoàn toàn bất lực, ta mới để vũ khí của mình [sc_victor.Custom('SignatureWeaponWoundVerb2')] một cách chết chóc vào ngực [sc_loser.GetFirstNamePossessiveNoTooltip].\n\n[sc_loser.GetSheHe|U] dường như không hoàn toàn đánh giá cao sự khoan hồng đó, co giật trong những cơn co thắt yếu ớt khi [sc_loser.GetSheHe] ngã ngửa vào vũng máu cuộc đời đang lan rộng."
  single_combat.0041.desc.sc_attacker.surprise_attack.fatality:0 "Đến mức dường như [sc_loser.GetSheHe] mất tay cầm [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')], thứ đã trượt xa vào [sc_defender.Custom('GroundType')]. Không phải kẻ lãng phí lợi thế, ta lao tới, [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))] trong một động tác mượt mà.\n\n[sc_loser.GetFirstNameNoTooltip] đổ gục xuống sàn, sự sống rút cạn nhanh chóng. [sc_loser.GetSheHe|U] duy trì cái nhìn thẳng vào [sc_victor.Custom('EyeEyes')] của ta cho đến tận cuối cùng."
  single_combat.0041.desc.sc_attacker.taunt.fatality:0 "khiến [sc_loser.GetFirstNameNoTooltip] trở nên tức giận đến mức lớp phòng thủ của [sc_loser.GetHerHis] hoàn toàn tan vỡ trong một cơn giận dỗi.\n\nĐược mở đường đến bụng, ta đền đáp sự thiếu kiên nhẫn của [sc_loser.GetHerHis] bằng một cái chết chậm chạp."
  single_combat.0041.desc.sc_attacker.put_the_boot_in.fatality:0 "Cú đánh kép xé nát lớp phòng thủ [sc_loser.GetFirstNamePossessiveNoTooltip], và ta có thể tước vũ khí của [sc_loser.GetHerHim] trước bằng một chiêu [sc_victor.Custom('SignatureWeaponAttemptedLight')], sau đó chuyển tiếp nhanh chóng sang một cú bắn vào ngực chí mạng găm một vết nêm máu thẳng vào tim [sc_loser.GetHerHis].\n\nCó những cái chết chậm hơn."
  single_combat.0041.desc.sc_attacker.strict_guard.fatality:0 "Đòn đánh đầu tiên đập vỡ một lỗ hổng trong lớp phòng thủ [sc_loser.GetFirstNamePossessiveNoTooltip], đòn thứ hai cướp đi của [sc_loser.GetHerHim] khả năng sử dụng cánh tay [sc_loser.Custom('signature_weapon')]. Đối thủ của ta lảo đảo, sự sáng suốt phai nhạt giữa cơn bão nỗi đau.\n\nTa dành thời gian căn chỉnh đòn đánh tiếp theo, [sc_victor.Custom('SignatureWeaponWoundVerb1PresentParticiple')] sâu vào ngực của [sc_loser.GetWomanMan] bằng [sc_victor.Custom('signature_weapon')] của mình.\n\nĐòn tấn công tiếp theo đơn giản là chấm dứt nỗi đau."
  single_combat.0041.desc.sc_attacker.confident_attack.fatality:0 "Khi ta đánh giá thời điểm đã đúng, ta thay đổi mô hình của mình bằng một cú quẹt ngang bất ngờ trúng ngay bụng [sc_loser.GetFirstNameNoTooltip].\n\nĐòn đánh hất đối thủ của ta lùi lại, thứ gì đó màu đỏ và quan trọng trông như đang trượt ra một cách yếu ớt khỏi lỗ thủng mới khi [sc_loser.GetSheHe] đổ gục xuống đất.\n\nTa tiếp cận với chút thận trọng, nhưng sớm trở nên rõ ràng là sự sốc đang diễn ra. Dành một khoảnh khắc để đá văng [sc_loser.Custom('signature_weapon')] của [sc_loser.GetHerHis] phòng hờ, ta chuẩn bị chấm dứt nỗi thống khổ cho [sc_loser.GetFirstNameNoTooltip]."
  single_combat.0041.desc.sc_attacker.expert_onslaught.fatality:0 "Thành thật mà nói, thật đáng khâm phục khi [sc_loser.GetFirstNameNoTooltip] có thể chịu đựng bao nhiêu đòn [sc_victor.Custom('signature_weapon')] như [sc_loser.GetSheHe] đã làm, khi ta dội xuống [sc_loser.GetHerHim] với tất cả sự cuồng nộ của một cơn bão sấm sét.\n\nPhải mất một hoặc hai phút, nhưng cuối cùng ta cũng đánh [sc_loser.GetHerHim] thành một đống máu me, vặn vẹo, #EMP đang gào thét#!.\n\nChỉ khi ta thỏa mãn rằng sẽ không có cơ hội trả thù vào phút cuối, ta mới thực hiện đòn kết liễu."
  single_combat.0041.desc.sc_attacker.attempt_disarm.fatality:0 "Không khoan nhượng, Ta lao vào một cú [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] [sc_victor.Custom('SignatureWeaponWoundVerb4ThirdPersonPresent')] xuyên qua lồng ngực [sc_loser.GetHerHis].\n\nTa tiếp tục tấn công [sc_loser.GetFirstNameNoTooltip] khi [sc_loser.GetSheHe] loạng choạng xuống đất, chậm chạp và thiếu sức sống, dừng lại chỉ khi xác không còn cử động ngoài những cú đánh của Ta."
 ### No need for a lightning_assault, as you can't end the duel in the first round.
  single_combat.0041.desc.sc_attacker.tire_opponent.fatality:0 "Phải mất khá lâu trước khi một khoảng trống phù hợp mở ra trong lớp phòng thủ [sc_loser.GetFirstNamePossessiveNoTooltip], nhưng khi nó mở ra, đó là tất cả những gì ta cần. Với một chiêu [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] duy nhất từ [sc_victor.Custom('signature_weapon')] của mình, ta xé toạc bụng và dạ dày [sc_loser.GetHerHis].\n\nMáu me, mật, và bữa ăn cuối cùng của đối thủ tuôn ra, văng tung tóe lên phần dưới của ta, và [sc_loser.GetSheHe] hét lên một tiếng xé lòng.\n\nCó lẽ, đó là một sự tử tế khi ta kết thúc sự thống khổ của [sc_loser.GetFirstNamePossessiveNoTooltip] sớm."
  single_combat.0041.desc.sc_attacker.reason_you_suck_speech.fatality:0 "Các đòn đánh của [sc_loser.GetHerHis|U] ngày càng trở nên vội vàng, sự thất vọng thể hiện rõ ràng trong sự cẩu thả của các đòn đánh [sc_loser.GetHerHis], cho đến khi [sc_loser.GetFirstNameNoTooltip] hét lên vì thất vọng.\n\nNgay tại thời điểm đó, ta lướt qua lớp phòng thủ của [sc_loser.GetHerHis], [sc_victor.Custom('SignatureWeaponWoundVerb5PresentParticiple')] [sc_victor.Custom('signature_weapon')] của mình sâu vào cổ họng [sc_loser.GetHerHis].\n\nĐống máu me, rách nát còn lại sau đó nhìn thôi đã thấy đau đớn. Thật may, [sc_loser.GetFirstNameNoTooltip] ngã chết úp mặt, tha cho cả hai chúng ta khỏi sự thống khổ."
  single_combat.0041.desc.sc_attacker.technique_from_legend.fatality:0 "Với nhiều hy vọng hơn niềm tin, Ta lao vào [sc_loser.GetFirstNameNoTooltip], [sc_victor.Custom('signature_weapon')] giơ ra hoàn hảo theo những câu chuyện, mắt nhắm chặt theo phản xạ.\n\nCó một lực cứng như đá bất ngờ trong [sc_victor.Custom('signature_weapon')], âm thanh thịt ướt bị xé đôi, và một cơn co giật chạy dọc cánh tay Ta. Ta mở mắt, gần như chắc chắn sẽ thấy chính cái chết của mình, chỉ để đối mặt với cổ [sc_loser.GetFirstNameNoTooltip] #EMP bị tiêu diệt#!, máu phun lên không trung không kiêng nể.\n\nKhi Ta tìm thấy đầu [sc_loser.GetHerHis], ánh sáng đã rời khỏi [sc_loser.GetWomanMan] [sc_loser.Custom('EyeEyes')] từ lâu."
  single_combat.0041.desc.sc_attacker.like_a_viper.fatality:0 "[sc_loser.GetFirstNameNoTooltip] lao tới để chặn, nhưng không hề gần việc ngăn Ta.\n\nTa lao thẳng qua cú chắn yếu ớt của [sc_loser.GetHerHis], [sc_victor.Custom('signature_weapon')]-[sc_victor.Custom('SignatureWeaponTipType')] xuyên thẳng vào ngực [sc_loser.GetWomanMan].\n\nTiếng nứt cứng và tiếng ẩm ướt đánh dấu xương gãy và cơ quan bị thủng dường như kéo dài vô tận, cho đến khi vũ khí Ta xuyên thẳng qua bên kia.\n\nGần như không thể biết được chính xác lúc nào [sc_loser.GetFirstNameNoTooltip] chết."
  single_combat.0041.desc.sc_attacker.pocket_silver.fatality:0 "[sc_loser.GetFirstNameNoTooltip] né được cái túi, nhưng không thấy được đòn đánh tiếp theo của ta.\n\nChiêu [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] trúng ngay vào hàm của [sc_loser.GetHerHim], xé toạc thịt, răng và xương. [sc_loser.GetSheHe|U] cố gắng hét lên, nhưng không thể qua cái miệng nát bét [sc_loser.GetHerHis].\n\nCó thể coi là một sự tử tế khi ta chấm dứt nỗi thống khổ cho [sc_loser.GetHerHim]."
  single_combat.0041.desc.sc_attacker.martial_voice.fatality:0 "\n\nKhông có bất kỳ cảnh báo nào, những lời tục tĩu ta thét lên chuyển thành một chiêu [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]. [sc_loser.GetFirstNameNoTooltip] vẫn đang chìm đắm trong nỗi kinh hoàng trước lời nói của ta đến mức [sc_loser.GetSheHe] thậm chí không cố đỡ đòn.\n\nKim loại gặp thịt và xương, [sc_victor.Custom('SignatureWeaponWoundVerb2PresentParticiple')] sâu vào vai đối thủ của ta. Cả hai chúng ta đều biết dòng máu chảy ra từ đó quá lớn để có thể sống sót."
  single_combat.0041.desc.sc_attacker.mocking_boast.fatality:0 "giết chúng. [sc_loser.GetFirstNameNoTooltip] quá choáng váng trước những lời nhận xét của ta đến mức [sc_loser.GetSheHe] thất bại trong việc ngăn cản ta giật [sc_loser.Custom('signature_weapon')] khỏi tay [sc_loser.GetHerHis].\n\nĐối thủ của ta chỉ có đủ thời gian để nhận ra chính xác mọi thứ sẽ kết thúc như thế nào trước khi ta [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]."
  single_combat.0041.desc.sc_attacker.is_that_a_crocodile.fatality:0 "Tiến lên đến khi vật hạ [sc_loser.GetHerHim] xuống đất, làm [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')] trượt ra xa.\n\nThời gian như giãn ra chậm và rộng như hàm cá sấu, [sc_loser.GetFirstNameNoTooltip] nhìn vào miệng hôi thối gần như vô tận.\n\nRồi thời gian, và miệng cá sấu, cùng búng lại.\n\nTa tưởng nghe thấy tiếng hét hoảng loạn của [sc_loser.GetFirstNamePossessiveNoTooltip] từ trong quái vật, dù các chi của [sc_loser.GetHerHis] đã bị răng nó cắt đứt."
  single_combat.0041.desc.sc_attacker.desert_warrior.fatality:0 "Và tất cả những gì Ta phải làm là đá gối [sc_loser.GetFirstNameNoTooltip] ra khỏi mặt đất.\n\nNgay khi [sc_loser.GetSheHe] nằm trên [sc_defender.Custom('GroundType')], mọi chuyện kết thúc. Một [sc_victor.Custom('SignatureWeaponAttemptedLight')] [sc_victor.Custom2('SignatureWeaponKillTypeTorsoThirdPersonActiveGendered',SCOPE.sC('sc_loser'))].\n\nSau đó, [sc_loser.GetFirstNameNoTooltip] không còn gì để làm ngoài chết."
  single_combat.0041.desc.sc_attacker.jungle_stalker.fatality:0 "Ném [sc_victor.Custom('SignatureWeaponEndType')] của [sc_victor.Custom('signature_weapon')] vào mắt [sc_loser.GetFirstNamePossessiveNoTooltip], việc đánh văng [sc_loser.Custom('signature_weapon')] của [sc_loser.GetHerHis] gần như quá dễ dàng.\n\nKhông có cách nào để chống trả, ta nhanh chóng giải quyết [sc_loser.GetFirstNameNoTooltip]."
  single_combat.0041.desc.sc_attacker.open_terrain_expert.fatality:0 "Không thể tránh khỏi, [sc_loser.GetFirstNameNoTooltip] vươn quá đà [sc_loser.GetHerselfHimself], và, khi [sc_loser.GetSheHe] làm vậy, ta nhanh chóng tận dụng lợi thế bằng một chiêu [sc_victor.Custom('SignatureWeaponAttemptedLight')] nhanh như chớp vào bên sườn [sc_loser.GetHerHis].\n\n[sc_victor.Custom('SignatureWeaponTipType')] của [sc_victor.Custom('signature_weapon')] rút ra đầy máu và dính cả nội tạng. Đối thủ của ta đổ gục trong vài giây, bị choáng ngợp bởi nỗi đau dữ dội.\n\nTa giơ vũ khí lên cho đòn ân huệ."
  single_combat.0041.desc.sc_attacker.rough_terrain_expert.fatality.rocky:0 "Phải tốn nhiều nỗ lực hơn ta muốn, nhưng cuối cùng ta cũng có thể ép [sc_loser.GetFirstNameNoTooltip] lùi lại qua một chỗ dốc nhỏ, khiến [sc_loser.GetHerHim] lăn xuống dốc trong một âm thanh hỗn độn của những chi bị gãy bất ngờ.\n\nĐến khi ta đuổi kịp [sc_loser.GetHerHim], nhát chém từ [sc_victor.Custom('signature_weapon')] của ta là một sự giải thoát đáng hoan nghênh hơn bất cứ điều gì khác."
  single_combat.0041.desc.sc_attacker.rough_terrain_expert.fatality.boggy:0 "Với việc xô đẩy đủ mạnh, cuối cùng ta cũng có thể gửi [sc_loser.GetFirstNameNoTooltip] úp mặt xuống một vũng nước hôi hám sâu.\n\nVũ khí của [sc_loser.GetHerHis|U] bị mất ngay lập tức, và với sự thành thạo có chủ ý, ta đặt một chiếc ủng lên gáy của [sc_loser.GetWomanMan].\n\nDù [sc_loser.GetSheHe] có giãy giụa thế nào, giữa [sc_victor.Custom('signature_weapon')] và bàn chân ta, [sc_loser.GetFirstNameNoTooltip] không thể đưa đầu [sc_loser.GetHerHis] lên khỏi mặt nước. Không mất quá lâu trước khi những nỗ lực của [sc_loser.GetHerHis] ngừng hẳn."
  single_combat.0041.desc.sc_attacker.forest_fighter.fatality:0 "đuổi theo [sc_loser.GetHerHim] qua hàng cây như một con quỷ.\n\nKhi [sc_loser.GetFirstNameNoTooltip] vấp ngã, ta có cơ hội tốt nhất để thắng, và lao tới. [sc_victor.Custom('signature_weapon')] của ta [sc_victor.Custom('SignatureWeaponWoundVerb5ThirdPersonPresent')] xuống, [sc_victor.Custom2('SignatureWeaponKillTypeRearTorsoThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))] với một chiêu [sc_victor.Custom('SignatureWeaponAttemptedHeavy')].\n\nTa đá [sc_loser.GetHerHim] nằm ngửa. [sc_loser.GetFirstNameNoTooltip] chỉ vừa đủ sống để nhìn vào [sc_victor.Custom('EyeEyes')] của ta khi ta giết [sc_loser.GetHerHim]."
  single_combat.0041.desc.sc_attacker.raaargh.fatality:0 "Sương đỏ che khuất tầm nhìn, đến mức Ta thấy cảnh gần như đứng yên nhiều hơn hành động thực sự. Vũ khí của [sc_loser.GetFirstNamePossessiveNoTooltip] vô dụng khi [sc_victor.Custom('SignatureWeaponBreaksThirdPersonSingularPresent')]. [sc_loser.GetHerHis|U] [sc_loser.Custom('ArmArms')] gần như gãy đôi khi Ta đập sang một bên. Mặt [sc_loser.GetHerHis|U] lấm lem máu, răng vỡ và nướu rách khi Ta rút tay ra chuẩn bị đấm tiếp.\n\nKhi Ta tỉnh lại, dưới gót chân là thứ dính ướt. Nhìn qua, xác nhận đó là phần còn lại của hộp sọ [sc_loser.GetFirstNamePossessiveNoTooltip]."
  single_combat.0041.desc.sc_attacker.hard_grit.fatality:0 "Không còn cơ hội giành lại quyền kiểm soát trận đấu, sự diệt vong của [sc_loser.GetFirstNamePossessiveNoTooltip] chỉ là vấn đề thời gian, không phải là nếu.\n\nCuối cùng, [sc_loser.GetSheHe] mắc một sai lầm quan trọng, và lớp phòng thủ của [sc_loser.GetHerHis] mở ra trong một giây. Đó là tất cả những gì ta cần, khi thêm một đòn tấn công chí mạng [sc_victor.Custom('SignatureWeaponWoundVerb4ThirdPersonPresent')] cổ [sc_loser.GetHerHis].\n\n[sc_loser.GetFirstNameNoTooltip] chết ngạt trong thời gian ngắn."
  single_combat.0041.desc.sc_attacker.feint_and_stab.fatality:1 "Bay qua phòng thủ [sc_loser.GetHerHis] và thẳng vào ngực [sc_loser.GetHerHis].\n\n[sc_loser.GetFirstNameNoTooltip] lảo đảo, dao tay trái Ta rút ra cùng lúc với [sc_loser.GetSheHe], máu và mảnh xương tung tóe khắp sàn.\n\n[sc_loser.GetSheHe|U] chảy máu nhanh, dù không hoàn toàn dễ chịu."
  single_combat.0041.desc.sc_attacker.butchery.fatality:1 "Từng chút một, tinh thần [sc_loser.GetFirstNameNoTooltip] vỡ vụn, mỗi cơn đau xé đi bất cứ ý chí kiên cường nào [sc_loser.GetSheHe] còn cố giữ. Ta phá [sc_loser.GetHerHim] thành đống run rẩy, la hét và máu chảy tràn [sc_defender.Custom('GroundType')].\n\nNgay cả với Ta, cuối cùng, đủ là đủ. Một cú [sc_victor.Custom('SignatureWeaponAttemptedLight')] cuối cùng đẩy nhanh cái chết của [sc_loser.GetFirstNamePossessiveNoTooltip], nhưng không #EMP quá#! nhanh."
  single_combat.0041.desc.sc_attacker.stoic_veteran.fatality:1 "\n\nĐôi mắt tinh tường nhìn ra cơ hội trong chiến đấu, và của Ta cho Ta cơ hội [sc_loser.Custom('SignatureWeaponBreaksVerbPastTense')] [sc_loser.GetFirstNamePossessiveNoTooltip] [sc_loser.Custom('signature_weapon')]. Bị tước vũ khí, đối thủ gần như vô hại, và cú đánh tiếp theo của Ta tự do [sc_victor.Custom2('SignatureWeaponKillTypeTorsoThirdPersonFutureGendered',SCOPE.sC('sc_loser'))].\n\nVới cú đó, [sc_loser.GetFirstNameNoTooltip] chết, [sc_loser.GetSheHe] chưa hoàn toàn ngã.\n\nTa để xác sắp thành [sc_loser.GetHerHis] ngã ra sau, [sc_victor.Custom('signature_weapon')] vẫn cắm trong ngực [sc_loser.GetHerHis]."
  single_combat.0041.desc.sc_attacker.blade_dance.fatality:0 "Từng nhát một, bản giao hưởng đau đớn của ta hình thành trên từng dây thần kinh của [sc_loser.GetFirstNamePossessiveNoTooltip], kéo theo những tiếng thét như bài hát hợp xướng được chấm phá bằng tiếng thép va chạm.\n\nKhi cảm hứng bắt đầu cạn kiệt, ta cắt ngắn điệu nhảy của mình, cho phép đối thủ đổ gục xuống đầu gối. Máu đổ ra từ [sc_loser.GetHerHim], nhiều đến nỗi [sc_loser.GetFirstNameNoTooltip] hầu như không thể dồn sức để nhìn lên ta.\n\nTa dành cho [sc_loser.GetHerHim] sự lịch sự khi đáp lại ánh mắt [sc_loser.GetHerHis], rồi sẵn sàng [sc_victor.Custom('signature_weapon')] của mình cho nốt cuối của bản giao hưởng."
  single_combat.0041.desc.sc_attacker.wrath_of_highgod.fatality:0 "Trước khi [sc_loser.GetFirstNameNoTooltip] kịp tận dụng khoảnh khắc thần thánh của Ta, Ta lao vào một [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], [sc_loser.Custom('SignatureWeaponBreaksVerbPresentParticiple')] [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')].\n\nĐối thủ choáng váng trước sự bảo hộ của [sc_victor.GetFaith.WarGodNamePossessive]. Chỉ trong giây lát, nhưng đủ để Ta [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]."
  single_combat.0041.desc.sc_attacker.hurt_me_better.fatality:0 "Khi cơn trăng chiến đấu chiếm lấy Ta, Ta lao vào loạt [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')], chuyển đổi hoàn hảo giữa phòng thủ tàn nhẫn và các cú đánh sát thương gần như chết người, khả năng chịu đau của Ta phá vỡ mọi tính toán của [sc_loser.GetFirstNamePossessiveNoTooltip].\n\nChẳng bao lâu, Ta tung đòn chí mạng, khoét một lỗ kinh khủng vào sườn đối thủ.\n\n[sc_loser.GetSheHe|U] chảy máu nhanh trong vòng một phút."
  single_combat.0041.desc.sc_attacker.special_fallback.fatality:0 "[sc_loser.GetFirstNameNoTooltip] vấp ngã, đủ lâu để ta đưa [sc_victor.Custom('SignatureWeaponEndType')] của [sc_victor.Custom('signature_weapon')] đến để giáng một đòn vào mặt [sc_loser.GetHerHis].\n\nCú vấp của [sc_loser.GetHerHis|U] trở thành một cú đổ nhào hoàn toàn, vũ khí rơi ra xa khi [sc_loser.GetSheHe] ngã xuống. Ta đá [sc_loser.GetWomanMan] đang choáng váng nằm ngửa và, với một đòn tàn nhẫn, [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]."
