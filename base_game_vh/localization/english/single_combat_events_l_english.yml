  single_combat.0001.tt.attempt_disarm:0 "#BOL Cố gắng tước vũ khí:#! với một đòn mạnh, Ngài cố gắng lấy vũ khí của [my_foe.GetFirstNamePossessiveNoTooltip]"
  single_combat.0001.tt.lightning_assault:0 "#BOL Tấn công chớp nhoáng:#! Ngài cố gắng áp đảo [my_foe.GetFirstNameNoTooltip] ngay từ đầu trận"
  single_combat.0001.tt.tire_opponent:0 "#BOL Làm đối thủ kiệt sức:#! phòng thủ để kéo dài thời gian, ngươi cho phép [my_foe.GetFirstNameNoTooltip] tự làm [my_foe.GetHerselfHimself] kiệt quệ trong khi ngươi vẫn còn sung sức"
  single_combat.0001.tt.reason_you_suck_speech:0 "#BOL Bài diễn thuyết nhụt chí:#! Ngài chỉ trích thẳng thắn về những thất bại của [my_foe.GetFirstNamePossessiveNoTooltip]"
  single_combat.0001.tt.technique_from_legend:0 "#BOL Kỹ thuật huyền thoại:#! Ngài cố gắng sao chép một chiêu nổi tiếng từ cuốn sách yêu thích"
  single_combat.0001.tt.like_a_viper:0 "#BOL Như rắn độc:#! với tốc độ cực nhanh, Ngài tấn công vào điểm yếu tạm thời của phòng thủ [my_foe.GetFirstNamePossessiveNoTooltip]"
  single_combat.0001.tt.pocket_silver:0 "#BOL Mắt bạc:#! Ngài ném một túi bạc nặng vào [my_foe.GetFirstNamePossessiveNoTooltip] [my_foe.Custom('MaskFace')]"
  single_combat.0001.tt.martial_voice:0 "#BOL Thống lĩnh:#! Ngài cố gắng dọa nạt [my_foe.GetFirstNameNoTooltip] như thể [my_foe.GetSheHe] là lính dưới quyền Ngài"
  single_combat.0001.tt.mocking_boast:0 "#BOL Chế nhạo:#! Ngài chế nhạo [my_foe.GetFirstNamePossessiveNoTooltip] về [prestige_level|E] thấp kém"
  single_combat.0001.tt.is_that_a_crocodile:0 "#BOL Đồng minh bất ngờ:#! một sinh vật vảy trồi lên từ nước sau lưng [my_foe.GetFirstNameNoTooltip], cố kéo [my_foe.GetHerHim] đi"
  single_combat.0001.tt.terrain_expert:0 "#BOL Bậc thầy địa hình:#! kiến thức chuyên sâu về địa hình giúp Ngài có lợi"
  single_combat.0001.tt.desert_warrior:0 "$single_combat.0001.tt.terrain_expert$"
  single_combat.0001.tt.jungle_stalker:0 "$single_combat.0001.tt.terrain_expert$"
  single_combat.0001.tt.open_terrain_expert:0 "$single_combat.0001.tt.terrain_expert$"
  single_combat.0001.tt.rough_terrain_expert:0 "$single_combat.0001.tt.terrain_expert$"
  single_combat.0001.tt.forest_fighter:0 "$single_combat.0001.tt.terrain_expert$"
  single_combat.0001.tt.raaargh:0 "#BOL Cuồng nộ:#! xé nát và tàn phá! XÉ NÁT VÀ TÀN PHÁ! #BER XÉ NÁT VÀ TÀN PHÁ!#!"
  single_combat.0001.tt.hard_grit:0 "#BOL Quyết tâm:#! dùng kinh nghiệm của mình, Ngài thực hiện loạt đòn tấn công kiên định"
  single_combat.0001.tt.feint_and_stab:0 "#BOL Lừa & Đâm:#! giả vờ tấn công bên trái bằng [myself.Custom('signature_weapon')], Ngài đâm bên phải bằng dao phụ"
  single_combat.0001.tt.butchery:0 "#BOL Thảm sát:#! Ngài khoe kỹ năng tàn bạo như một kẻ cướp"
  single_combat.0001.tt.stoic_veteran:0 "#BOL Cựu binh kiên định:#! dùng kinh nghiệm Varangian, Ngài chém vào [my_foe.GetFirstNameNoTooltip]"
  single_combat.0001.tt.blade_dance:0 "#BOL Múa kiếm:#! loạt chiêu điêu luyện đảm bảo kỹ năng đấu tay đôi của Ngài được nhắc tới nhiều năm"
  single_combat.0001.tt.wrath_of_highgod:0 "#BOL Thịnh nộ thần thánh:#! với lời cầu nguyện, Ngài khiêm nhường trước [myself.GetFaith.HighGodName]"
  single_combat.0001.tt.hurt_me_better:0 "#BOL Thăng hoa nhờ đau đớn:#! tận hưởng cơn đau, Ngài lao vào các đòn của [my_foe.GetFirstNamePossessiveNoTooltip] để có lợi"
  single_combat.0001.tt.special_fallback:0 "#BOL Nền tảng lung lay:#! Ngài đá vào ống đồng [my_foe.GetFirstNameNoTooltip]"
  single_combat.0001.tt.something_to_hide:0 "#BOL Có điều giấu giếm:#! Ngài nhắc đối thủ về [hook|E] mà Ngài nắm giữ trên [my_foe.GetHerHim]"

 ##################################################
 # Combat Descs
 ## Own Combat Move Feedback
  single_combat.0001.desc.my_feedback.wait_and_hope.will_die:0 "Ta đông cứng. Ta có thể chết ở đây. Nếu Ta không làm gì, Ta #EMP sẽ#! chết ở đây. Ta không thể cử động, run rẩy cầu nguyện cho [my_foe.GetFirstNameNoTooltip] vấp ngã để Ta có cơ hội."
  single_combat.0001.desc.my_feedback.wait_and_hope.will_live:0 "Ta chờ đợi thời cơ. Ta có thể không phải là chiến binh giỏi nhất, nhưng có lẽ, nếu đủ thời gian, [my_foe.GetFirstNameNoTooltip] sẽ treo [my_foe.GetHerselfHimself]."
  single_combat.0001.desc.my_feedback.unsure_attack:0 "Ta thử vài [myself.Custom('SignatureWeaponAttemptedLightPlural')] qua loa, chủ yếu tập trung không làm mất [myself.Custom('signature_weapon')], nhưng chẳng thứ gì tiếp cận được kẻ địch."
  single_combat.0001.desc.my_feedback.enthusiastic_onslaught:0 "Ta có [myself.Custom('SignatureWeaponArticle')] [myself.Custom('signature_weapon')], Ta có kẻ thù, và Ta quyết tâm ghép hai thứ này bằng bất cứ cách nào. Những cú vung điên cuồng, đánh tay sau, đập loạn xạ từ [myself.Custom('SignatureWeaponEndType')] của vũ khí, bất cứ gì để nghiền nát kẻ địch."
  single_combat.0001.desc.my_feedback.hail_mary:0 "[myself.Custom('SignatureWeaponFlourishPresentParticiple')|U] [myself.Custom('signature_weapon')] của Ta điên cuồng, Ta lao thẳng vào [my_foe.GetFirstNameNoTooltip]. Nếu Ta phải chết, sẽ là một trận chiến khó nhằn, và [my_foe.GetFirstNameNoTooltip] bị đẩy lùi bởi sự nhiệt tình tuyệt vọng của Ta."
  single_combat.0001.desc.my_feedback.pocket_sand:0 "Nắm một nắm [sc_defender.Custom('GritType')], Ta ném thẳng vào [my_foe.GetFirstNamePossessiveNoTooltip] [my_foe.Custom('MaskFace')], khiến [my_foe.GetHerHim] sặc sụa lùi lại."
  single_combat.0001.desc.my_feedback.nut_em:0 "Đẩy [my_foe.GetFirstNamePossessiveNoTooltip] [my_foe.Custom('signature_weapon')] sang một khoảnh khắc quan trọng, Ta tiến vào phòng thủ của [my_foe.GetHerHis] và hạ sọ Ta xuống [my_foe.GetHersHis] với một tiếng răng rắc ghê rợn."
  single_combat.0001.desc.my_feedback.guard:0 "Với những cú vung khéo léo của [myself.Custom('signature_weapon')], Ta đẩy lùi nhiều đòn tấn công, giữ [my_foe.GetFirstNameNoTooltip] ở tầm tay."
  single_combat.0001.desc.my_feedback.probing_attack:0 "Chọn thời điểm cẩn thận, Ta tung vài đòn nhanh, đẩy [my_foe.GetFirstNameNoTooltip] qua lại, từ từ mở rộng phòng thủ của [my_foe.GetHerHis]."
  single_combat.0001.desc.my_feedback.onslaught:0 "[myself.Custom('signature_weapon')|U] trong tay, Ta trút [myself.Custom('SignatureWeaponAttemptedLightPlural')] xuống [my_foe.GetFirstNameNoTooltip], không cho [my_foe.GetHerHim] cơ hội phản kháng."
  single_combat.0001.desc.my_feedback.surprise_attack:0 "Nhìn thấy điểm yếu, Ta lao vào [my_foe.GetFirstNameNoTooltip], [myself.Custom('SignatureWeaponActionPresentParticiple')] [myself.Custom('signature_weapon')] và đẩy lùi [my_foe.GetHerHim] với một [my_foe.Custom('SignatureWeaponAttemptedHeavy')]."
  single_combat.0001.desc.my_feedback.taunt:1 ""Hơn nữa", Ta hét, "ngươi là [my_foe.Custom2('InsultAdjectiveArticle', ROOT.Char)], [my_foe.Custom2('InsultAdjective', ROOT.Char)] [my_foe.Custom2('InsultNoun', ROOT.Char)] mà [my_foe.Custom2('PointOfRidicule', ROOT.Char)] là trò cười của đất nước!".
  single_combat.0001.desc.my_feedback.put_the_boot_in:0 "Với một [myself.Custom('SignatureWeaponAttemptedHeavy')] từ [myself.Custom('signature_weapon')], Ta làm [my_foe.GetFirstNameNoTooltip] choáng ngã, sau đó tiến vào cú đánh và đá thẳng [my_foe.GetHerHim] vào ngực."
  single_combat.0001.desc.my_feedback.strict_guard:0 "[myself.Custom('signature_weapon')] của Ta là bảo vệ tốt hơn bất kỳ khiên nào, chặn, phản công và giữ mọi động tác của [my_foe.GetFirstNamePossessiveNoTooltip]. Bất cứ nơi nào [my_foe.GetSheHe] di chuyển [my_foe.GetHerHis] [my_foe.Custom('signature_weapon')], [myself.Custom('signature_weapon')] của Ta luôn sẵn sàng."
  single_combat.0001.desc.my_feedback.confident_attack:0 "[myself.Custom('signature_weapon')] của Ta chảy quanh [my_foe.GetFirstNameNoTooltip] như nước, mỗi đòn nối tiếp liền mạch, một chuỗi tấn công đúng thời điểm hoàn hảo."
  single_combat.0001.desc.my_feedback.expert_onslaught:0 "Ta lao vào hành động, tung một loạt [myself.Custom('SignatureWeaponAttemptedLightPlural')], tấn công mạnh vào phòng thủ của [my_foe.GetFirstNamePossessiveNoTooltip], làm [my_foe.GetHerHim] kiệt sức với mỗi cú đánh đúng thời điểm."
  single_combat.0001.desc.my_feedback.attempt_disarm:0 "Một [myself.Custom('SignatureWeaponAttemptedHeavy')] khổng lồ từ [myself.Custom('signature_weapon')] của Ta gần đủ để giật [my_foe.GetFirstNamePossessiveNoTooltip] [my_foe.Custom('signature_weapon')] ra khỏi [my_foe.GetHerHim], nhưng [my_foe.GetSheHe] #EMP vừa#! kịp hồi phục."
  single_combat.0001.desc.my_feedback.lightning_assault:0 "Dồn toàn lực vào cú đánh đầu, Ta lao thẳng tới [my_foe.GetFirstNameNoTooltip], [myself.Custom('SignatureWeaponActionPresentParticiple')] [myself.Custom('signature_weapon')] cao vào một [myself.Custom('SignatureWeaponAttemptedHeavy')] làm [my_foe.GetHerHim] choáng váng."
  single_combat.0001.desc.my_feedback.tire_opponent:0 "Lần này đến lần khác, Ta lùi, né và lách, luôn giữ khoảng cách hấp dẫn: sớm thôi, [my_foe.GetFirstNamePossessiveNoTooltip] tỏ dấu mệt mỏi."
 #^possessive used here in lieu of a contracted "it's".
  single_combat.0001.desc.my_feedback.reason_you_suck_speech:0 "Một số người có thể gọi Ta điên khi phân tích chi tiết mọi khía cạnh đời sống [my_foe.GetFirstNamePossessiveNoTooltip] trong khi [my_foe.GetSheHe] tấn công Ta. Họ không biết #EMP sự thỏa mãn#! của một khán giả bị bắt giữ."
  single_combat.0001.desc.my_feedback.technique_from_legend:0 "Ta cố gắng nhớ lại những truyền thuyết trong khoảnh khắc, và thử [myself.Custom('SignatureWeaponAction')] [myself.Custom('signature_weapon')] như các anh hùng xưa. Đủ để một cú đánh chắc chắn vào kẻ địch bất ngờ."
  single_combat.0001.desc.my_feedback.like_a_viper:0 "Với tất cả sức mạnh, Ta lao qua phòng thủ của [my_foe.GetFirstNamePossessiveNoTooltip] và tung một cú đánh dữ dội bằng [myself.Custom('signature_weapon')], nhắm tới [myself.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('my_foe'))]. Chỉ một khe hở hẹp ngăn Ta giành chiến thắng đẫm máu."
  single_combat.0001.desc.my_feedback.pocket_silver:0 "Nắm một túi tiền nặng ở eo, Ta ném vào [my_foe.GetFirstNameNoTooltip]. Nó trúng ngay [my_foe.GetHerHim] vào [my_foe.Custom('MaskFace')], tạo khoảng trống để thực hiện [myself.Custom('SignatureWeaponAttemptedLight')] với [myself.Custom('signature_weapon')]."
  single_combat.0001.desc.my_feedback.martial_voice:0 "Chỉ huy đám đông trong chiến trận là việc hò hét và dọa nạt, và Ta chứng minh điều này với [my_foe.GetFirstNameNoTooltip] bằng cách la hét tục tĩu với toàn bộ sức lực của phổi."
  single_combat.0001.desc.my_feedback.mocking_boast:0 "Lời nói của Ta cắt sâu vào cái Ta của [my_foe.GetFirstNamePossessiveNoTooltip]. #EMP Mọi người#! đều biết danh tiếng, uy tín của Ta, và danh tiếng [my_foe.GetHerHis] #EMP nhạt#! đi so với Ta."
  single_combat.0001.desc.my_feedback.is_that_a_crocodile:0 "Với một tiếng gầm, quái vật lao ra khỏi nước, tiến về chúng Ta. Ta lùi lại, để [my_foe.GetFirstNameNoTooltip] [myself.Custom('SignatureWeaponFlourishPresentParticiple')] vào nó với [my_foe.GetHerHis] [my_foe.Custom('signature_weapon')] trong hoảng loạn. Khi cá sấu rút lui, Ta áp sát lưng [my_foe.GetHerHis]."
  single_combat.0001.desc.my_feedback.desert_warrior:0 "Ở ngoài cái nóng này, cần một [myself.GetWomanMan] cứng cỏi để chiến đấu. [my_foe.GetFirstNameNoTooltip] #EMP đẫm#! mồ hôi, và [my_foe.GetHerHis] thở hổn hển; việc làm [my_foe.GetHerHim] mệt mỏi bằng vài [myself.Custom('SignatureWeaponAttemptedLightPlural')] thật dễ dàng."
  single_combat.0001.desc.my_feedback.jungle_stalker:0 "Lá rừng rậm làm việc di chuyển chậm nhất là khó, tệ nhất là không thể, và bóng hiếm khi cách chỉ một bước chân. Nơi [my_foe.GetFirstNameNoTooltip] vật lộn, Ta xuất sắc, biến mất chỉ để xuất hiện lại với một [myself.Custom('SignatureWeaponAttemptedHeavy')]."
  single_combat.0001.desc.my_feedback.open_terrain_expert:0 "Với tất cả không gian để chiến đấu, Ta chạy vòng quanh [my_foe.GetFirstNameNoTooltip], nhường đất vô ích với mỗi đòn [my_foe.GetSheHe] tung ra và lùi lại dễ dàng sau mỗi đòn tấn công của Ta."
  single_combat.0001.desc.my_feedback.rough_terrain_expert.rocky:0 "Địa hình đá nơi chúng Ta chiến đấu nguy hiểm. Bất cứ ai cũng có thể vấp và rơi chết, và một cú đẩy dữ dội cũng nguy hiểm như lưỡi gươm. Ta thích thú chứng minh điều này với [my_foe.GetFirstNameNoTooltip] nhiều lần."
  single_combat.0001.desc.my_feedback.rough_terrain_expert.boggy:0 "Đầm lầy vốn dĩ nguy hiểm, và nơi này không ngoại lệ. Dù Ta chưa đẩy [my_foe.GetFirstNameNoTooltip] xuống nước mặn, [my_foe.GetSheHe] #EMP đã#! đến rất gần."
  single_combat.0001.desc.my_feedback.forest_fighter:0 "Rừng cung cấp nhiều cơ hội. Ta lùi lại, đặt bụi gai giữa Ta và [my_foe.GetFirstNameNoTooltip], sau đó quay lại tung một [myself.Custom('SignatureWeaponAttemptedLight')] dữ dội vào [my_foe.GetHerHim]."
  single_combat.0001.desc.my_feedback.raaargh:0 "Nước bọt bay, [myself.Custom('signature_weapon')] [myself.Custom('SignatureWeaponFlourishPresentParticiple')] điên cuồng, Ta lao vào kẻ địch. Một màn sương đỏ xé qua tâm trí Ta, và tất cả là cơn thịnh nộ, máu, và sự giải tỏa tuyệt vời."
  single_combat.0001.desc.my_feedback.hard_grit:0 "Với kỹ năng luyện tập, Ta né một đòn từ [my_foe.GetFirstNameNoTooltip], bước vào cú đánh và nâng [myself.Custom('signature_weapon')] lên để [myself.Custom('SignatureWeaponAttemptedHeavy')], trước khi lùi ra khoảng an toàn."
  single_combat.0001.desc.my_feedback.feint_and_stab:0 "[myself.Custom('signature_weapon')] của Ta tung một [myself.Custom('SignatureWeaponAttemptedLight')] theo một hướng, chỉ để Ta rút dao mới tay trái và lao vào [my_foe.GetFirstNameNoTooltip] khi [my_foe.GetSheHe] cố gắng chặn."
  single_combat.0001.desc.my_feedback.butchery:0 "Ta không đếm nổi bao nhiêu người Ta đã [myself.Custom('SignatureWeaponKillTypePastParticiple')] với [myself.Custom('signature_weapon')]. Có thể [my_foe.GetFirstName] là tiếp theo, hoặc không, nhưng mưa đòn tàn bạo của Ta chắc chắn khiến [my_foe.GetHerHim] lo lắng."
  single_combat.0001.desc.my_feedback.stoic_veteran:0 "Biệt đội Varangian không khuyến khích sự lơi lỏng. Cần đôi mắt cảnh giác và cánh tay vững để xuất sắc như một vệ sĩ Hoàng đế, và với mỗi cú đánh, Ta cho [my_foe.GetFirstNameNoTooltip] thấy cách các Người Mang Rìu chiến đấu."
  single_combat.0001.desc.my_feedback.blade_dance:0 "Trong chiến trận, Ta là một nghệ sĩ. Mỗi cú đánh là một nét cọ, mỗi kẻ địch ngã hay vệt máu là một vệt sơn. Khi Ta vung [myself.Custom('signature_weapon')], chuyển đổi liền mạch giữa hoa văn và đòn đánh, Ta vẽ nên bức tranh đau đớn trên kẻ địch."
  single_combat.0001.desc.my_feedback.wrath_of_highgod:0 "[myself.GetFaith.HighGodName] khôn ngoan, và [myself.GetFaith.HighGodHerHis|U] tức giận bên #EMP Ta#!. Ta hét lên sự tận tụy với trời, để [my_foe.GetFirstNameNoTooltip] run sợ trước đức tin của Ta."
  single_combat.0001.desc.my_feedback.hurt_me_better:0 "Không gì làm máu dồn như vết đau ngọt ngào, và không ai hiểu nỗi đau như Ta. Được tiếp thêm sức mạnh từ vết thương, Ta lao vào [my_foe.GetFirstNameNoTooltip], tung một loạt [myself.Custom('SignatureWeaponAttemptedLightPlural')] dữ dội với [myself.Custom('signature_weapon')]."
  single_combat.0001.desc.my_feedback.special_fallback:0 "Nhìn thấy cơ hội, Ta đá mạnh vào ống chân [my_foe.GetFirstNamePossessiveNoTooltip], gần như làm [my_foe.GetHerHim] tê liệt."
  single_combat.0001.desc.my_feedback.something_to_hide:0 "Một khoảnh khắc, [my_foe.GetFirstNameNoTooltip] đứng yên. Rồi, điều gì đó như bật ra trong đầu [my_foe.GetHerHis], và cơ thể [my_foe.GetHerHis] tỏ ra yếu đi khi nhớ đến sự kiểm soát của Ta trên [my_foe.GetHerHim]."

 ## Opponent Combat Move Feedback
  single_combat.0001.desc.opponent_response.wait_and_hope:1 "[my_foe.GetFirstNameNoTooltip] đứng yên, dường như hy vọng Ta sẽ chỉ buông [myself.Custom('signature_weapon')] xuống."
  single_combat.0001.desc.opponent_response.unsure_attack:0 "[my_foe.GetFirstNameNoTooltip] cố gắng, e dè, để tung một [myself.Custom('SignatureWeaponAttemptedLight')] vào Ta, nhưng đòn đánh bị dễ dàng đẩy ra."
  single_combat.0001.desc.opponent_response.enthusiastic_onslaught.banned_house:0 ""#EMP [my_foe.GetFullNameNoTooltip]!#!" $single_combat.0001.desc.opponent_response.enthusiastic_onslaught.epilogue$"
  single_combat.0001.desc.opponent_response.enthusiastic_onslaught.own_house:0 ""Ngươi thật nhục nhã cho dòng họ [my_foe.GetHouse.GetNameNoTooltip]!" $single_combat.0001.desc.opponent_response.enthusiastic_onslaught.epilogue$"
  single_combat.0001.desc.opponent_response.enthusiastic_onslaught.motto:0 ""#EMP [my_foe.GetHouse.GetMotto]#!, cặn bã!" $single_combat.0001.desc.opponent_response.enthusiastic_onslaught.epilogue$"
  single_combat.0001.desc.opponent_response.enthusiastic_onslaught.epilogue:0 "gào lên đối thủ của Ta, [my_foe.Custom('SignatureWeaponFlourishPresentParticiple')] [my_foe.GetHerHis] [my_foe.Custom('signature_weapon')] điên cuồng quanh, gần và hướng về Ta."
  single_combat.0001.desc.opponent_response.hail_mary:0 "Biết rõ rằng [my_foe.GetSheHe] hoàn toàn bị áp đảo, [my_foe.GetFirstNameNoTooltip] liều mạng lao cả thân mình về phía ta, ép ta phải lùi lại với tất cả sự tuyệt vọng của kẻ đã định sẵn diệt vong."
  single_combat.0001.desc.opponent_response.pocket_sand:0 "Chúng Ta vừa chiến đấu, bỗng có tiếng hô "#EMP Huyah!#!" Đôi mắt [myself.Custom('EyeEyes')] của Ta cay xè, tầm nhìn mờ đi, và miệng nếm mùi [sc_defender.Custom('GritType')] bị ném."
  single_combat.0001.desc.opponent_response.nut_em:0 "Nhìn thấy cơ hội, [my_foe.GetFirstNameNoTooltip] lao tới và húc vào Ta, mạnh, vào [myself.Custom('MaskFace')]. Ta lùi lại, mất thăng bằng."
  single_combat.0001.desc.opponent_response.guard:0 "[my_foe.GetFirstNameNoTooltip] vào thế thủ, cố gắng hết sức để đẩy lùi ta. Đôi [my_foe.Custom('EyeEyes')] của [my_foe.GetWomanMan] dõi theo từng chuyển động của ta."
  single_combat.0001.desc.opponent_response.probing_attack:0 "Phản ứng của [my_foe.GetFirstNamePossessiveNoTooltip] được tính toán cẩn thận, chờ đúng thời điểm để đáp trả bằng một loạt [my_foe.Custom('SignatureWeaponAttemptedLightPlural')] từ [my_foe.GetHerHis] [my_foe.Custom('signature_weapon')]."
  single_combat.0001.desc.opponent_response.onslaught:0 "[my_foe.GetFirstNameNoTooltip] bẻ cổ, rồi bắt đầu trút những đòn đánh xuống thế phòng thủ của ta, một cơn mưa dài bất tận của những cú [my_foe.Custom('SignatureWeaponAttemptedHeavyPlural')] gần như đánh gục ta bởi sự hung bạo không ngừng nghỉ."
  single_combat.0001.desc.opponent_response.surprise_attack:0 "[my_foe.GetFirstNameNoTooltip] đột ngột đổi hướng, quăng [my_foe.GetHerselfHimself] sang bên và tung một [my_foe.Custom('SignatureWeaponAttemptedHeavy')] mà Ta vừa kịp né."
  single_combat.0001.desc.opponent_response.taunt:0 "[my_foe.GetFirstNameNoTooltip], dường như khinh bỉ chiến đấu thật, chọn cách nói những lời tổn thương, cá nhân về Ta, gia đình Ta, và cách Ta ăn măng tây."
  single_combat.0001.desc.opponent_response.put_the_boot_in:0 "[my_foe.GetFirstNameNoTooltip] lao tới, ép Ta lùi lại bằng một [my_foe.Custom('SignatureWeaponAttemptedLight')] trước khi tung cú đá cao vào ngực Ta. Ta suýt ngã."
  single_combat.0001.desc.opponent_response.strict_guard:0 "[my_foe.GetFirstNameNoTooltip] chuyển sang tư thế phòng thủ, [my_foe.GetHerHis] [my_foe.Custom('signature_weapon')] tạo thành một bức tường gần như không thể xuyên thủng, chắn giữa Ta và [my_foe.GetHerHim]."
  single_combat.0001.desc.opponent_response.confident_attack:0 "[my_foe.GetFirstNameNoTooltip] phản công với chuỗi [my_foe.Custom('SignatureWeaponAttemptedLightPlural')] và [my_foe.Custom('SignatureWeaponAttemptedHeavyPlural')] mượt mà, mỗi đòn buộc Ta lùi thêm một chút."
  single_combat.0001.desc.opponent_response.expert_onslaught:0 "[my_foe.GetFirstNameNoTooltip] phản đòn bằng cơn mưa [my_foe.Custom('SignatureWeaponAttemptedLightPlural')], gần như [my_foe.Custom('SignatureWeaponKillTypeFirstPersonPresentParticiple')] liên tục."
  single_combat.0001.desc.opponent_response.attempt_disarm:0 "Với tốc độ đáng ngạc nhiên, [my_foe.GetFirstNameNoTooltip] tung một [my_foe.Custom('SignatureWeaponAttemptedHeavy')] từ [my_foe.GetHerHis] [my_foe.Custom('signature_weapon')], gần như làm rơi [myself.Custom('signature_weapon')] của Ta."
  single_combat.0001.desc.opponent_response.lightning_assault:0 "[my_foe.GetFirstNameNoTooltip] không lãng phí thời gian, đáp trả Ta bằng chuỗi [my_foe.Custom('SignatureWeaponAttemptedHeavyPlural')] dữ dội, buộc Ta lùi từng bước."
  single_combat.0001.desc.opponent_response.tire_opponent:0 "[my_foe.GetFirstNameNoTooltip] rút lui khỏi mọi đòn tấn công của Ta, cho Ta tấn công mà không bị đòn nào thật sự trúng. Không lâu sau, Ta cảm thấy mệt dần."
  single_combat.0001.desc.opponent_response.reason_you_suck_speech:0 "Trong nỗ lực làm nhục Ta, [my_foe.GetFirstNameNoTooltip] chỉ lùi lại mỗi khi Ta đến gần, chế giễu Ta tỉ mỉ, #EMP biết rõ#! rằng Ta không thể phớt lờ [my_foe.GetHerHim]."
  single_combat.0001.desc.opponent_response.technique_from_legend:0 "[my_foe.GetFirstNameNoTooltip] [my_foe.Custom('SignatureWeaponActionThirdPerson')] [my_foe.GetHerHis] [my_foe.Custom('signature_weapon')] theo cách quen thuộc kỳ lạ, rồi thực hiện một [my_foe.Custom('SignatureWeaponAttemptedHeavy')] gần như hoàn hảo mà Ta chắc chắn từng thấy."
  single_combat.0001.desc.opponent_response.like_a_viper:0 "Trước khi Ta kịp nhận ra, [my_foe.GetFirstNameNoTooltip] somehow #EMP lọt vào#! tầm phòng thủ của Ta, [my_foe.GetHerHis] [my_foe.Custom('signature_weapon')] lao thẳng vào tim Ta. Chỉ với khe hở hẹp Ta mới né được."
  single_combat.0001.desc.opponent_response.pocket_silver:0 "Bất ngờ, [my_foe.GetFirstNameNoTooltip] ném một túi tiền nặng vào [myself.Custom('MaskFace')] của ta, va chạm tạo ra tiếng #EMP rắc#!. Khi ta kịp hồi phục, [my_foe.GetSheHe] đã tiếp tục tận dụng lợi thế trước ta."
  single_combat.0001.desc.opponent_response.martial_voice:0 "[my_foe.GetFirstNamePossessiveNoTooltip] [my_foe.Custom('signature_weapon')] chuyển sang thế phòng thủ lười nhác, và [my_foe.GetSheHe] bắt đầu quát tháo áp đảo ta, giọng điệu giống như dành cho một nông nô ngỗ nghịch chứ không phải một [myself.GetTitleAsNameNoTooltip]."
  single_combat.0001.desc.opponent_response.mocking_boast:0 "[my_foe.GetFirstNameNoTooltip] lùi lại, tạo ra khoảng lặng nhỏ. Sự tĩnh lặng tạm thời chứa đầy khoe khoang về danh tiếng của [my_foe.GetHerHis], và những đòn công kích giá trị của Ta, đủ làm Ta tức giận."
  single_combat.0001.desc.opponent_response.is_that_a_crocodile:0 "Một tiếng rít bất ngờ báo hiệu cá sấu giận dữ, vừa vọt ra từ con nước gần đó, và chỉ với vài [my_foe.Custom('SignatureWeaponAttemptedHeavyPlural')] Ta mới đẩy lùi được."
  single_combat.0001.desc.opponent_response.desert_warrior:0 "Trong khi Ta mệt mỏi chiến đấu giữa cái nóng này, [my_foe.GetFirstNameNoTooltip] vẫn dẻo dai, chỉ thỉnh thoảng tung một [my_foe.Custom('SignatureWeaponAttemptedLight')]."
  single_combat.0001.desc.opponent_response.jungle_stalker:0 "[my_foe.GetFirstNameNoTooltip] là đối thủ lắt léo, tránh khỏi các đòn tấn công của Ta và di chuyển qua bụi rậm dày một cách dễ dàng mà Ta không thể."
  single_combat.0001.desc.opponent_response.open_terrain_expert:0 "[my_foe.GetFirstNameNoTooltip] tận dụng tuyệt vời không gian rộng, tung [my_foe.Custom('SignatureWeaponAttemptedLightPlural')] trước khi rút lui vào khoảng trống rộng lớn."
  single_combat.0001.desc.opponent_response.rough_terrain_expert.rocky:0 "Là chuyên gia chiến đấu trên địa hình đá, [my_foe.GetFirstNameNoTooltip] nhanh chóng chiếm cao điểm, một lợi thế mà [my_foe.GetSheHe] #EMP gần như#! cắt lìa nhiều chi của Ta."
  single_combat.0001.desc.opponent_response.rough_terrain_expert.boggy:0 "Quen với chiến đấu ở đầm lầy hơn Ta, [my_foe.GetFirstNameNoTooltip] liên tục cố gắng ép Ta xuống nước lợ, gần như thành công."
  single_combat.0001.desc.opponent_response.forest_fighter:0 "Là một [my_foe.GetWomanMan] rừng rậm lão luyện, [my_foe.GetFirstNameNoTooltip] dường như xuyên qua bụi gai và cây cối mà không gặp chút khó khăn nào, để ta phải tự mình vượt qua những hiểm trở sau [my_foe.GetHerHim]."
  single_combat.0001.desc.opponent_response.raaargh:0 "[my_foe.GetFirstNameNoTooltip] dường như rung lên trong giây lát, rồi [my_foe.GetSheHe] bùng nổ trong cơn thịnh nộ, hét lớn đến mức làm rung chuyển mặt đất, lao vào ta với sự #EMP hung tợn#! hiếm thấy."
  single_combat.0001.desc.opponent_response.hard_grit:0 "[my_foe.GetFirstNameNoTooltip] là một chiến binh tài giỏi đáng lo ngại, hết lần này đến lần khác [my_foe.GetSheHe] né tránh hoặc đỡ được ngay cả những đòn đánh mạnh mẽ, rồi phản công ngược lại ta."
  single_combat.0001.desc.opponent_response.feint_and_stab:0 "[my_foe.GetFirstNameNoTooltip] giả vờ đánh sang trái bằng [my_foe.GetHerHis] [my_foe.Custom('signature_weapon')], chỉ để rồi đâm thẳng vào tim ta bằng một con dao giấu trong tay còn lại."
  single_combat.0001.desc.opponent_response.butchery:0 "Một nụ cười tàn nhẫn lan trên môi [my_foe.GetFirstNamePossessiveNoTooltip], trước khi Ta kịp điều chỉnh phòng thủ, gần như gục dưới cơn mưa [my_foe.Custom('SignatureWeaponAttemptedLightPlural')]."
  single_combat.0001.desc.opponent_response.stoic_veteran:0 "Thời gian của [my_foe.GetFirstNamePossessiveNoTooltip] trong Đội Vệ binh Varangian đã khiến [my_foe.GetHerHim] trở nên lạnh lùng, tàn bạo và chết chóc với [my_foe.Custom('SignatureWeaponArticle')] [my_foe.Custom('signature_weapon')], liên tiếp giáng những cú [my_foe.Custom('SignatureWeaponAttemptedHeavy')] vào thân mình ta."
  single_combat.0001.desc.opponent_response.blade_dance:0 "[my_foe.GetFirstNameNoTooltip] nổi danh bởi khả năng sử dụng [my_foe.Custom('SignatureWeaponArticle')] [my_foe.Custom('signature_weapon')], và [my_foe.GetSheHe] nhắc ta nhớ đến điều đó bằng một chuỗi [my_foe.Custom('SignatureWeaponAttemptedLightPlural')] uyển chuyển hoàn hảo, xen kẽ với những cú [my_foe.Custom('SignatureWeaponAttemptedHeavy')] đáng sợ."
  single_combat.0001.desc.opponent_response.wrath_of_highgod:0 ""Vì [my_foe.GetFaith.HighGodNameAlternate] và [my_foe.GetFaith.WarGodName], kẻ báng bổ hãy chịu!" gào lên [my_foe.GetFirstNameNoTooltip], [my_foe.Custom('SignatureWeaponActionPresentParticiple')] [my_foe.GetHerHis] [my_foe.Custom('signature_weapon')] hướng lên trời."
  single_combat.0001.desc.opponent_response.hurt_me_better:0 "Một dòng máu nhỏ chảy xuống từ da đầu của [my_foe.GetFirstNamePossessiveNoTooltip]; khi chạm đến môi trên của [my_foe.GetHerHis], [my_foe.GetSheHe] liếm nó đi với nụ cười hiểm độc."
  single_combat.0001.desc.opponent_response.special_fallback:0 "Bất ngờ, [my_foe.GetFirstNameNoTooltip] tung một cú đá dữ dội vào ống chân Ta, làm Ta tạm thời khó chịu."
  single_combat.0001.desc.opponent_response.something_to_hide:0 ""Ngươi đã quên #EMP món nợ#! của mình với ta, [myself.GetFirstNameNoTooltip]?" mỉm cười [my_foe.GetFirstNameNoTooltip]. Khi Ta nhận ra [my_foe.GetSheHe] nói gì, vai Ta rũ xuống."

 ##################################################
 # Outcome Event: Loser
 ## Defender Lost, Own Combat Move Feedback
  single_combat.0031.desc.sc_defender.wait_and_hope:0 "Chờ đối thủ ra đòn trước chẳng giúp gì cho Ta, chỉ đơn giản là trao cho [sc_victor.GetHerHim] lợi thế."
  single_combat.0031.desc.sc_defender.unsure_attack:0 "Những đòn tấn công yếu ớt của Ta chẳng làm được gì cả."
  single_combat.0031.desc.sc_defender.enthusiastic_onslaught:0 "Những [sc_loser.Custom('SignatureWeaponFlourishPresentParticiple')] hoang dại của Ta vô dụng, chỉ khiến Ta mệt mỏi."
  single_combat.0031.desc.sc_defender.hail_mary:0 "Đòn tấn công liều lĩnh toàn lực của Ta không đi đến đâu."
  single_combat.0031.desc.sc_defender.pocket_sand:0 "Đối thủ dễ dàng tránh [sc_defender.Custom('GritType')] Ta ném."
  single_combat.0031.desc.sc_defender.nut_em:0 "Đòn húc đầu thất bại của Ta chỉ mở ra một khe hở lớn cho đối thủ."
  single_combat.0031.desc.sc_defender.guard:0 "Đối thủ buộc [sc_victor.GetHerHis] xuyên qua phòng thủ của Ta."
  single_combat.0031.desc.sc_defender.probing_attack:0 "Đối thủ hất ra ngoài các đòn đánh có tính toán của Ta."
  single_combat.0031.desc.sc_defender.onslaught:0 "Những [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] của Ta hầu như không có tác dụng gì."
  single_combat.0031.desc.sc_defender.surprise_attack:0 "Đối thủ nhìn thấu đòn tấn công bất ngờ của Ta."
  single_combat.0031.desc.sc_defender.taunt:0 "Những lời chế giễu của Ta rơi vào tai điếc."
  single_combat.0031.desc.sc_defender.put_the_boot_in:0 "Đòn [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] ban đầu trúng mục tiêu, nhưng cú đá khiến Ta mất thăng bằng."
  single_combat.0031.desc.sc_defender.strict_guard:0 "Dù cố gắng hết sức, đối thủ vẫn phá vỡ phòng thủ của Ta."
  single_combat.0031.desc.sc_defender.confident_attack:0 "Đối thủ có thể chặn các đòn đánh của Ta một cách dễ dàng."
  single_combat.0031.desc.sc_defender.expert_onslaught:0 "Ngay cả những [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] tốt nhất của Ta cũng dường như vô dụng."
  single_combat.0031.desc.sc_defender.attempt_disarm:0 "Cố gắng tước vũ khí gần như khiến #EMP [sc_loser.Custom('signature_weapon')] của Ta bay ra."
 ### No need for a lightning_assault, as you can't end the duel in the first round.
  single_combat.0031.desc.sc_defender.tire_opponent:0 "Cố gắng dụ đối thủ thất bại, vì [sc_victor.GetSheHe] phớt lờ các động tác né đòn kịch tính của Ta."
  single_combat.0031.desc.sc_defender.reason_you_suck_speech:0 "Đối thủ của ta nghiến răng và phớt lờ lời nói của ta."
  single_combat.0031.desc.sc_defender.technique_from_legend:0 "Thực tế, những chiến công trong truyền thuyết rất khó thực hiện, và Ta chẳng làm được gì nhiều."
  single_combat.0031.desc.sc_defender.like_a_viper:0 "Ta lao tới khoảng trống tưởng có, nhưng chỉ đánh trúng không khí."
  single_combat.0031.desc.sc_defender.pocket_silver:0 "Đối thủ dễ dàng né túi tiền Ta ném, không chút cảm xúc."
  single_combat.0031.desc.sc_defender.martial_voice:0 "Cố gắng hăm dọa đối thủ của Ta thất bại ngay lập tức."
  single_combat.0031.desc.sc_defender.mocking_boast:0 "Những lời khoe khoang của Ta rơi vào tai điếc, đối thủ hoàn toàn phớt lờ."
  single_combat.0031.desc.sc_defender.is_that_a_crocodile:0 "Con cá sấu dừng nửa đường lao tới, suy nghĩ lại đòn tấn công."
  single_combat.0031.desc.sc_defender.desert_warrior:0 "Dù [sc_victor.GetSheHe] đẫm mồ hôi, đối thủ dường như không mệt mỏi."
  single_combat.0031.desc.sc_defender.jungle_stalker:0 "Rừng thường khó chiến đấu, nhưng đối thủ vẫn kiên trì."
  single_combat.0031.desc.sc_defender.open_terrain_expert:0 "Dù có không gian thoải mái, đối thủ vẫn tỏ ra không khoan nhượng."
  single_combat.0031.desc.sc_defender.rough_terrain_expert:0 "Dù địa hình khó chịu, đối thủ vẫn bám sát các đòn tấn công của Ta."
  single_combat.0031.desc.sc_defender.forest_fighter:0 "Không phải ai cũng chiến đấu tốt trong rừng, nhưng đối thủ vẫn theo kịp, từng đòn một."
  single_combat.0031.desc.sc_defender.raaargh:0 "Khoảnh khắc mất bình tĩnh khiến Ta gần như bất động; đối thủ không hề hấn, nhưng Ta cảm thấy rệu rã."
  single_combat.0031.desc.sc_defender.hard_grit:0 "Dù có nhiều kinh nghiệm, đối thủ vẫn ngăn chặn mọi đòn của Ta."
  single_combat.0031.desc.sc_defender.feint_and_stab:0 "Đối thủ nhìn thấu chiêu giả của Ta, khiến đòn đâm bổ trợ trở nên vô nghĩa."
  single_combat.0031.desc.sc_defender.butchery:0 "Ta có thể là kẻ sát thủ giỏi, nhưng điều đó vô dụng ở đây."
  single_combat.0031.desc.sc_defender.stoic_veteran:0 "Những gì Ta học ở Miklagarðr không đủ, đối thủ liên tục chặn các đòn của Ta."
  single_combat.0031.desc.sc_defender.blade_dance:0 "Cố gắng múa kiếm của Ta thất bại, đối thủ phản đòn từng chiêu một."
  single_combat.0031.desc.sc_defender.wrath_of_highgod:0 "Tiếng thét cầu nguyện của Ta chỉ mở ra cơ hội cho đối thủ."
  single_combat.0031.desc.sc_defender.hurt_me_better:0 "Đau đớn thường là đồng minh của Ta, nhưng hôm nay nó rời bỏ Ta."
  single_combat.0031.desc.sc_defender.special_fallback:0 "Đối thủ không gặp vấn đề gì khi tránh cú đá của Ta."
  single_combat.0031.desc.sc_defender.something_to_hide:0 "Đối thủ có lẽ không nghe hoặc không quan tâm đến những lời đe dọa ẩn ý của Ta."

