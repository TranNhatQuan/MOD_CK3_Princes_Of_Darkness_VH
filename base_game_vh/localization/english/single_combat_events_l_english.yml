 ## Defender Lost, Opponent Finishing Move Injury
  single_combat.0031.desc.opponent_response.wait_and_hope.injury:0 "cú đánh trúng ngay khớp ngón tay cầm [sc_loser.Custom('signature_weapon')]-của Ta.\n\nBản năng, các ngón tay Ta mở ra, để vũ khí rơi lộp cộp xuống sàn.\n\nChúng Ta nhìn nhau #EMP không tin nổi#! vài giây cho đến khi [sc_victor.GetFirstNameNoTooltip] nâng [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] một cách do dự.\n\n"Đ-đầu hàng hoặc chết!""
  single_combat.0031.desc.opponent_response.unsure_attack.injury:0 "và mặc dù cú đánh nhút nhát, nó vẫn trúng sai cách khiến Ta ngã nghiêng.\n\nDù Ta vùng vẫy đứng dậy, một [sc_victor.GetFirstNameNoTooltip] hớn hở đã sẵn sàng với [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')], chuẩn bị để [sc_victor.Custom('SignatureWeaponKillTypeGroinFirstPersonFuture')] chỉ với một cử động nhẹ."
  single_combat.0031.desc.opponent_response.enthusiastic_onslaught.injury:0 "cú đánh gần như cắt đứt tay cầm [sc_loser.Custom('signature_weapon')] của Ta tại cổ tay.\n\nMột cú đánh cuối cùng là tất cả những gì [sc_victor.GetSheHe] cần để đưa Ta xuống gối. Trước khi Ta kịp giơ tay chắn, [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')]-[sc_victor.Custom('SignatureWeaponTipType')] đang đẩy mạnh vào cổ Ta."
  single_combat.0031.desc.opponent_response.hail_mary.injury:0 "Chốc lát, Ta thấy thích thú với sự táo bạo của [sc_victor.GetHerHis], cho đến khi cảm thấy vật gì móc vào phía sau chân Ta.\n\nTrong chớp mắt, Ta nằm xuống đất, và [sc_victor.GetFirstNameNoTooltip] đứng trên Ta, cũng ngạc nhiên như Ta. Tuy nhiên, cánh tay cầm [sc_victor.GetHerHis|U] [sc_victor.Custom('signature_weapon')] vẫn vững và đầy uy hiếp."
  single_combat.0031.desc.opponent_response.pocket_sand.injury:0 "vật nặng đánh gối Ta ngã xuống.\n\nTa chớp mắt liên tục, cố gắng làm rõ tầm nhìn, và hình ảnh mờ ảo hiện ra là [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')] chuẩn bị để [sc_victor.Custom('SignatureWeaponKillTypeGroinFirstPersonFuture')]."
  single_combat.0031.desc.opponent_response.nut_em.injury:0 "và Ta ngã xuống như bao cát.\n\nNhân danh #EMP [sc_loser.GetFaith.HighGodName]#!, [sc_victor.GetWomanMan] đó có cái đầu cứng #EMP vô lý#!.\n\nThế giới Ta vẫn quay cuồng, những vệt trắng đau đớn xé nhỏ tầm nhìn, khi Ta nhìn lên thì thấy [sc_victor.GetFirstNameNoTooltip] chuẩn bị [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] để [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] chỉ với một cú đánh nhanh."
  single_combat.0031.desc.opponent_response.guard.injury:0 "rồi, với một cú #EMP chớp mắt#!-parry-riposte, xoay [sc_loser.Custom('signature_weapon')] khỏi tay Ta.\n\nTa hầu như không kịp chớp mắt.\n\nĐầy tự tin, đối thủ chuyển sang tư thế tấn công, chuẩn bị để [sc_loser.Custom('SignatureWeaponKillTypeFirstPersonFuture')]."
  single_combat.0031.desc.opponent_response.probing_attack.injury:0 "mỗi lần mài mòn quyết tâm của Ta bằng một cú đánh tính toán-[sc_victor.Custom('SignatureWeaponAttemptedHeavy')].\n\nTa cố gắng đẩy lùi [sc_victor.GetHerHim], nhưng cuối cùng [sc_victor.GetSheHe] vẫn đánh [sc_loser.Custom('signature_weapon')] rơi khỏi tay Ta.\n\nTa chỉ còn vài giây trước khi bị [sc_loser.Custom('SignatureWeaponKillTypePastParticiple')]."
  single_combat.0031.desc.opponent_response.onslaught.injury:0 "dồn Ta lùi lại liên tục.\n\nKhông lâu sau, Ta gục xuống, ngã lộn ngược kêu lộp cộp. [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('SignatureWeaponActionThirdPerson')] [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] lần cuối qua cơ thể Ta, sẵn sàng kết thúc Ta ngay lập tức."
  single_combat.0031.desc.opponent_response.surprise_attack.injury:0 "làm Ta bất ngờ. Cú đánh xoay Ta nửa vòng mạnh đến mức Ta suýt ngã.\n\nTrước khi Ta kịp hồi phục, [sc_victor.GetSheHe] đã định vị lại [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] sẵn sàng cho cú kết liễu. Chúng Ta cùng đông cứng, cân nhắc bước đi, và rõ ràng rằng cú đánh của [sc_victor.GetFirstNamePossessiveNoTooltip] sẽ [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] trước khi Ta kịp né hoặc chặn."
  single_combat.0031.desc.opponent_response.taunt.injury:0 "ném [sc_loser.Custom('signature_weapon')] xuống và cố siết [sc_victor.GetHerHim] bằng tay Ta.\n\nChỉ khi [sc_victor.GetFirstNameNoTooltip] vung [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] Ta mới nhận ra mình đã làm gì."
  single_combat.0031.desc.opponent_response.put_the_boot_in.injury:0 "Ta cố gắng hết sức, nhưng đối thủ lao vào một loạt [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')], và không lâu sau Ta ngã xuống đất, choáng váng và thở dốc.\n\nDù vẫn cầm [sc_loser.Custom('signature_weapon')], [sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('signature_weapon')] sẵn sàng để [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')]."
  single_combat.0031.desc.opponent_response.strict_guard.injury:0 "khiến Ta choáng váng.\n\nTrước khi Ta kịp chỉnh mình, [sc_victor.GetFirstNameNoTooltip] lại tấn công, [sc_victor.Custom('signature_weapon')] bay tới đầu Ta theo kiểu [sc_victor.Custom('SignatureWeaponEndType')]-trước cho đến khi Ta nhận đầy [sc_loser.Custom('MaskFace')] vật liệu cùn [sc_victor.Custom('SignatureWeaponEndMaterial')].\n\nTa hầu như không để ý [sc_loser.Custom('signature_weapon')] trượt khỏi tay."
  single_combat.0031.desc.opponent_response.confident_attack.injury:0 "tấn công liên tục cho đến khi phòng thủ Ta yếu đi đủ để [sc_victor.GetSheHe] có #EMP cơ hội hoàn hảo#!.\n\nVới một cú đánh mạnh, [sc_victor.GetWomanMan] đẩy Ta ngã lùi, làm [sc_loser.Custom('signature_weapon')] bay đi.\n\nChỉ một bước sai bây giờ cũng có thể chết."
  single_combat.0031.desc.opponent_response.expert_onslaught.injury:0 "đánh Ta mỗi cú, bầm xương qua mỗi lần chặn, cho đến khi Ta gục xuống đất, gần như tan nát.\n\nTa thấy lạnh, chóng mặt, đầu như bùng lên nhưng tâm trí lại lạc vào nơi khác. Chúng ta... đang quay? Ta đang quay?\n\nMột miếng đờm máu thoát ra khỏi miệng Ta trong cơn ho khàn; co giật làm [sc_loser.Custom('signature_weapon')] trượt khỏi tay. [sc_victor.GetFirstNameNoTooltip] đá nó ra xa, rồi đặt kim loại lạnh của [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] lên cổ Ta."
  single_combat.0031.desc.opponent_response.attempt_disarm.injury:0 "Chúng Ta nhìn nhau một lúc. Không khí căng thẳng, khó xử, cả hai chờ đợi đối phương hành động.\n\n[sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('SignatureWeaponFlourishThirdPersonPresentParticiple')] [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] một cách đe dọa và nhướng mày."
 ### No need for a lightning_assault, as you can't end the duel in the first round.
  single_combat.0031.desc.opponent_response.tire_opponent.injury:0 "Ta cảm thấy tay mình nắm [sc_loser.Custom('signature_weapon')] yếu đi.\n\nĐối thủ hẳn đã đọc được gì đó trong tư thế của Ta, vì một cú quét chắc chắn của [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] làm vũ khí Ta bay đi.\n\nTa hoàn toàn chịu sự làm chủ của [sc_victor.GetHerHis]."
  single_combat.0031.desc.opponent_response.reason_you_suck_speech.injury:0 "Phòng thủ của Ta nứt ra vì cơn tức giận.\n\nVào đúng #EMP khoảnh khắc#! đó [sc_victor.GetSheHe] tung cú đánh, một [sc_victor.Custom('SignatureWeaponAttemptedLight')] kéo [sc_loser.Custom('signature_weapon')] khỏi tay Ta một cách điêu luyện.\n\n\"Đừng lo, [sc_victor.GetFirstNameNoTooltip]; Ngài vẫn nắm vững [sc_loser.Custom('signature_weapon')] hơn cả [sc_loser.GetPrimaryTitle.GetTierAsNameNoTooltip] của Ngài.\""
  single_combat.0031.desc.opponent_response.technique_from_legend.injury:0 "Trong một cảnh tượng đẹp như trong truyền thuyết, đối thủ quét qua phòng thủ của Ta, giật [sc_loser.Custom('signature_weapon')] khỏi tay Ta trước khi tung một cú [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] kinh hoàng làm Ta ngã xuống sàn.\n\n[sc_victor.Custom('signature_weapon')|U] giơ cao, bất chấp hàm rơi của Ta, [sc_victor.GetSheHe] chuẩn bị để [sc_victor.Custom('SignatureWeaponKillTypeGroinFirstPersonFuture')]."
  single_combat.0031.desc.opponent_response.like_a_viper.injury:0 "Ta cố gắng chặn cú đánh của kẻ như rắn độc này, nhưng vô ích. Đối thủ tận dụng cơ hội móc [sc_loser.Custom('signature_weapon')] và uốn sai chiều, làm vũ khí bay xa ngoài tầm với một cách thảm hại.\n\n[sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('signature_weapon')] đặt lên ngực Ta, ngay trước trái tim đập nhanh."
  single_combat.0031.desc.opponent_response.pocket_silver.injury:0 "[sc_victor.GetSheHe] đưa [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] vào #EMP bên trong#! thế phòng thủ của ta, ngay dưới cổ họng ta.\n\nTa giật nhẹ [sc_loser.Custom('signature_weapon')] theo phản xạ, cân nhắc những lựa chọn của mình trong sự im lặng khó xử.\n\n[sc_victor.GetFirstNameNoTooltip] cau mày nhìn ta, và cơ bắp của [sc_victor.GetHerHis] căng lên, sẵn sàng tung đòn."
  single_combat.0031.desc.opponent_response.martial_voice.injury:0 "Nhảy lùi nhanh đến nỗi suýt để lại da, chỉ một phần nhỏ giây sau Ta mới nhận ra [sc_loser.Custom('signature_weapon')] không nhảy theo, quay vòng trong không khí nơi Ta đánh rơi, khiến Ta bất lực khi [sc_victor.GetFirstNameNoTooltip] chuẩn bị cú thứ hai."
  single_combat.0031.desc.opponent_response.mocking_boast.injury:0 "Đánh thẳng vào tay cầm [sc_loser.Custom('signature_weapon')] với [sc_victor.Custom('SignatureWeaponEndType')] của chính [sc_victor.GetHerHis] [sc_loser.Custom('signature_weapon')], làm vũ khí rơi khỏi tay Ta.\n\nĐối thủ chuẩn bị [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] với điệu bộ kiêu hãnh và nụ cười.\n\n\"Bây giờ, kẻ thua nói gì?\""
 ### No need for an is_that_a_crocodile, as it's never just an injury.
  single_combat.0031.desc.opponent_response.desert_warrior.injury:0 "Tạo ra một loạt [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] chính xác làm Ta kiệt sức, ngã xuống [sc_defender.Custom('GroundType')].\n\nTa lật người để thấy [sc_victor.GetFirstNameNoTooltip] chuẩn bị [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')], [sc_victor.Custom('signature_weapon')] đã giơ cao."
  single_combat.0031.desc.opponent_response.jungle_stalker.injury:0 "Đá #EMP mạnh#! vào háng Ta, làm Ta ngã nhào kèm tiếng thét.\n\nTrên mặt đất, Ta vùng vẫy vài giây, cố thoát khỏi cây quái ác này, nguyền rủa cơn đau ở hông, chỉ dừng lại khi cảm nhận kim loại lạnh của [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')]-[sc_victor.Custom('SignatureWeaponTipType')] áp vào trán."
  single_combat.0031.desc.opponent_response.open_terrain_expert.injury:0 "Không lâu sau Ta loạng choạng, kiệt sức, và đối thủ khiến Ta ngã với một cú [sc_victor.Custom('SignatureWeaponAttemptedHeavy')].\n\nTa cố đứng dậy, nhưng chân [sc_victor.GetFirstNamePossessiveNoTooltip] đè lên ngực, và [sc_victor.GetSheHe] giơ [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] để [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')]."
  single_combat.0031.desc.opponent_response.rough_terrain_expert.injury.rocky:0 "Ta ngã lùi qua một dốc nhỏ, hạ cứng giữa đống đá, suýt trúng [sc_loser.Custom('signature_weapon')] của mình.\n\nTa vùng dậy càng tốt có thể, nhưng kim loại lạnh của [sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('signature_weapon')] đã áp vào gáy Ta."
  single_combat.0031.desc.opponent_response.rough_terrain_expert.injury.boggy:0 "Ta ngã lùi thẳng vào bãi nước lầy.\n\n[sc_loser.Custom('signature_weapon')] rơi khỏi tay ngay lập tức, Ta vùng vẫy để nổi lên, hít không khí và nhổ ra nước bùn thối.\n\nMột chiếc giày đặt nhẹ lên [sc_loser.Custom('MaskFace')], giữ Ta vừa nổi, đe dọa đẩy Ta xuống."
  single_combat.0031.desc.opponent_response.forest_fighter.injury:0 "Cái gốc cây mà [sc_victor.GetSheHe] đẩy Ta vào lưng.\n\nTa vấp ngã, [sc_loser.Custom('signature_weapon')] bay vào bụi rậm. Trước khi Ta kịp đứng lại, một cú đá mạnh đánh Ta nằm giữa lá, và kim loại lạnh [sc_victor.Custom('signature_weapon')] ép mạnh vào cổ."
  single_combat.0031.desc.opponent_response.raaargh.injury:0 "ném ta xung quanh như một con búp bê vải rách.\n\nTa ngã ngửa về phía sau, đánh mất [sc_victor.Custom('signature_weapon')], và [sc_victor.GetSheHe] đứng sừng sững phía trên ta, sự #EMP căm hận#! hung bạo, khát máu như thú vật hiện rõ trong [sc_victor.GetHerHis] [sc_victor.Custom('EyeEyes')]. Đây... đây là cách ta chết.\n\nNhanh chóng như khi xuất hiện, cơn giận dữ biến mất, để lại [sc_victor.GetFirstNameNoTooltip] nhẹ nhàng đung đưa, vẫn gần như sẵn sàng [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] dù khoảnh khắc bình yên tạm thời đang diễn ra."
  single_combat.0031.desc.opponent_response.hard_grit.injury:0 "Với kỹ năng chuyên nghiệp, [sc_victor.GetFirstNameNoTooltip] đẩy Ta qua lại, mỗi cú đánh làm Ta chao đảo cho đến khi [sc_victor.GetSheHe] xoay [sc_loser.Custom('signature_weapon')] khỏi [sc_loser.Custom('HandHands')].\n\nChốc lát, Ta hoàn toàn choáng váng."
  single_combat.0031.desc.opponent_response.feint_and_stab.injury:0 "Ta cố chuyển sang chặn phù hợp, nhưng quá muộn, chuôi dao đánh mạnh vào má Ta.\n\nTay cầm vũ khí lỏng ra, Ta cảm thấy nó rơi khỏi tay, tầm nhìn chao đảo vì cú đánh."
  single_combat.0031.desc.opponent_response.butchery.injury:0 "Ta cảm nhận xương nhỏ vỡ, máu chảy qua động mạch bầm, đẩy trở lại da thịt tả tơi. Tầm nhìn mờ đi, quay cuồng. Chúng ta đã chiến đấu bao lâu? Khi nào Ta ngã xuống?\n\n[sc_victor.GetFirstNameNoTooltip] đứng trên Ta, [sc_victor.Custom('signature_weapon')] giơ cao, sẵn sàng [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')]."
  single_combat.0031.desc.opponent_response.stoic_veteran.injury:0 "mỗi đòn đều xé toạc [sc_loser.Custom('SignatureWeaponEndMaterial')] của [sc_loser.Custom('signature_weapon')] cho đến khi vũ khí [sc_loser.Custom('SignatureWeaponBreaksThirdPersonSingularPresent')].\n\nSau đó, việc [sc_victor.GetFirstNameNoTooltip] tước bỏ [sc_loser.Custom('signature_weapon')] đã gãy khỏi tay ta dễ dàng như trò trẻ con, để ta trần trụi và yếu thế trước bất kỳ đòn đánh nào tiếp theo."
  single_combat.0031.desc.opponent_response.blade_dance.injury:0 "Nhảy tới các cú đánh của Ta nhưng rút lại vào phút chót.\n\nTa gần như mê hoặc, rồi [sc_loser.Custom('signature_weapon')] biến mất trong chớp mắt. Vũ khí rơi ra, Ta bất lực khi [sc_victor.GetFirstNameNoTooltip] chuẩn bị [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')]."
  single_combat.0031.desc.opponent_response.wrath_of_highgod.injury:0 "Một cú [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] bất ngờ làm Ta mất thăng bằng.\n\n[sc_victor.GetFirstNameNoTooltip] quét tới, đưa [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] sát [sc_loser.Custom('MaskFace')].\n\n\"Đầu hàng, nhân danh [sc_victor.GetFaith.WarGodName], hoặc chết!\""
  single_combat.0031.desc.opponent_response.hurt_me_better.injury:0 "Kết thúc bằng tiếng gầm khàn và loạt [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] khiến Ta phải quỳ.\n\nTa cố vung [sc_loser.Custom('signature_weapon')] lên để chặn một cú đánh khác, nhưng ngay lập tức nhận một cú gối vào [sc_loser.Custom('MaskFace')].\n\nTa ngã ra [sc_defender.Custom('GroundType')], tầm nhìn chao đảo, ngay khi ánh sáng từ [sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('signature_weapon')]-[sc_victor.Custom('SignatureWeaponTipType')] hiện ra."
  single_combat.0031.desc.opponent_response.special_fallback.injury:0 "Đầu [sc_victor.Custom('SignatureWeaponTipType')] của [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] áp vào [sc_loser.Custom('MaskFace')], không thể tránh."
  single_combat.0031.desc.opponent_response.something_to_hide.injury:0 "Kéo Ta trở lại thực tại đau đớn.\n\nTrước khi Ta kịp giơ tay chắn, cú đánh tiếp theo của [sc_victor.GetFirstNamePossessiveNoTooltip] giật [sc_loser.Custom('signature_weapon')] khỏi tay, để Ta hở ra và dễ bị tấn công."

 ## Defender Lost, Opponent Finishing Move Fatality
  single_combat.0031.desc.opponent_response.wait_and_hope.fatality:0 "cú đánh lọt qua phòng thủ của Ta và [sc_victor.Custom('SignatureWeaponKillTypeTorsoThirdPersonActive')].\n\nTa lảo đảo lùi lại, vũ khí [sc_victor.Custom('signature_weapon')] của đối thủ rút ra với tiếng lách cách ướt át khi Ta ngã. Máu bắt đầu trào ra từ vết thương, thấm ướt mặt đất dưới chân Ta, miệng Ta mở ra nhưng không nói được gì.\n\n[sc_victor.GetFirstNameNoTooltip] trông cũng sốc như Ta."
  single_combat.0031.desc.opponent_response.unsure_attack.fatality:0 "và Ta lảo đảo lùi lại.\n\n[sc_victor.GetSheHe|U] chắc đã trúng Ta ở đâu đó, nhưng cơn đau đột ngột quá dữ dội khiến Ta không thể xác định chính xác. Ta cảm thấy máu nóng và ướt trào ra từ ngực, đau nhói lan tỏa qua thân trên.\n\n[sc_victor.GetFirstNameNoTooltip] phô diễn [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')], lao tới để [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')]."
  single_combat.0031.desc.opponent_response.enthusiastic_onslaught.fatality:0 "có vẻ buồn cười. Ít nhất là cho đến khi một cú đánh chạm tay Ta [sc_loser.Custom('signature_weapon')], làm vũ khí của Ta rơi ra.\n\nTa vừa kịp giơ tay che chắn khi [sc_victor.GetFirstNameNoTooltip] tiến tới và [sc_victor.Custom('SignatureWeaponKillTypeGroinThirdPersonActive')] bằng [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')], [sc_victor.Custom('SignatureWeaponKillTypeGroinThirdPersonActive_Aftermath')].\n\nMiệng Ta há ra không nói được gì, cơn đau quá dữ dội chỉ kịp nghẹn thở."
  single_combat.0031.desc.opponent_response.hail_mary.fatality:0 "mục tiêu của [sc_victor.GetHerHis|U] quá cao cho chiến thuật này, tay mơ! Ta thật sự thương hại [sc_victor.GetHerHim]. Nếu có gì, một cú đánh như thế sẽ trúng trán Ta-"
  single_combat.0031.desc.opponent_response.pocket_sand.fatality:0 "một làn đau dữ dội thẳng vào bụng Ta.\n\nTa ngã lùi, và một thứ gì đó chạm vào cằm, cắt sâu vào xương hàm. Máu động mạch trào ra từ vết thương, mạng sống Ta rỉ ra xuống [sc_defender.Custom('GroundType')] khi Ta sụp xuống đất."
  single_combat.0031.desc.opponent_response.nut_em.fatality:0 "mọi thứ tối đen. [sc_loser.Custom('EyeEyes')] của Ta chỉ… ngừng hoạt động. Ta vẫy vũ khí [sc_loser.Custom('signature_weapon')] một cách tuyệt vọng, cố ngăn [sc_victor.GetWomanMan] đang cố giết Ta.\n\nKhông ích gì, khi Ta cảm nhận có gì đó [sc_victor.Custom('SignatureWeaponWoundVerb1')] sâu vào vai, khắc một đường máu qua cơ thể.\n\nTa lảo đảo, ho ra hỗn hợp đờm đỏ đồng: chắc [sc_victor.GetFirstNameNoTooltip] trúng phổi Ta."
  single_combat.0031.desc.opponent_response.guard.fatality:0 "cho đến khi một cú đánh sai từ [sc_loser.Custom('signature_weapon')] của Ta làm vũ khí tuột khỏi tay.\n\n[sc_victor.GetFirstNameNoTooltip] không mất thời gian tung ra một loạt [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')], mỗi cú xé toạc thịt Ta.\n\nTa quỵ xuống, thở hổn hển, ho ra dây nước bọt đỏ đặc. [sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('MaskFace')] lạnh lùng khi [sc_victor.GetSheHe] chuẩn bị cú kết liễu."
  single_combat.0031.desc.opponent_response.probing_attack.fatality:0 "đẩy Ta dần dần mất thăng bằng cho đến khi một cú đánh sai khiến Ta ngã.\n\nTa không kịp đứng dậy, [sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponKillTypeRearTorsoPresentParticiple')] với một [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]."
  single_combat.0031.desc.opponent_response.onslaught.fatality:0 "quá nhiều để đỡ. Ta chặn được hai ba cú đầu, nhưng cú thứ tư của [sc_victor.GetHerHis] đánh bay [sc_loser.Custom('signature_weapon')] khỏi [sc_loser.Custom('HandHands')], và cú thứ năm lấy đi hơi thở của Ta.\n\nTa gần như không kịp nhận ra gì trước khi [sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponWoundVerb2ThirdPersonPresent')] sâu vào lồng ngực, làm vỡ xương và xé nát thịt.\n\nTa ngã lùi, thở hổn hển, chết dần. Ngực Ta nóng rực, tay chân lạnh ngắt, ý thức dường như rút ra khỏi vết thương hổng kia."
  single_combat.0031.desc.opponent_response.surprise_attack.fatality:0 "đánh văng [sc_loser.Custom('signature_weapon')] khỏi tay Ta.\n\nTa lùi lại nhanh, nhưng không nhanh bằng [sc_victor.GetFirstNameNoTooltip] lao tới, [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonPresentParticiple')] trong một động tác.\n\nMáu rút khỏi Ta, Ta quỵ xuống, còn đủ tỉnh táo để nhìn thẳng vào mắt Xóa Bạn mình."
  single_combat.0031.desc.opponent_response.taunt.fatality:0 "bỏ phòng thủ và lao thẳng vào [sc_victor.GetHerHim].\n\nKhông ngạc nhiên khi đòn tấn công liều lĩnh của Ta tạo cơ hội cho [sc_victor.GetFirstNameNoTooltip] đánh vào bụng Ta."
  single_combat.0031.desc.opponent_response.put_the_boot_in.fatality:0 "Tận dụng tốt sơ hở, [sc_victor.GetFirstNameNoTooltip] di chuyển mượt mà thành một đòn [sc_victor.Custom('SignatureWeaponAttemptedLight')] xé [sc_loser.Custom('signature_weapon')] khỏi tay ta.\n\n[sc_victor.GetSheHe|U] đã vung ngược đòn tiếp theo trước khi ta kịp né tránh, [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponWoundVerb1PresentParticiple')] chí mạng vào ngực ta."
  single_combat.0031.desc.opponent_response.strict_guard.fatality:0 "xé toạc phòng thủ của Ta. Một cú khác truyền cơn đau lạnh buốt qua ngực, cánh tay cầm [sc_loser.Custom('signature_weapon')] rũ xuống vô dụng.\n\nTa không cảm nhận được tay, không điều khiển được chân, chẳng thể làm gì.\n\nMột [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] khác [sc_victor.Custom('SignatureWeaponCriticalPresent')] vào ngực, Ta lảo đảo tại chỗ.\n\n[sc_victor.GetFirstNameNoTooltip] chuẩn bị [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] cho cú kết liễu."
  single_combat.0031.desc.opponent_response.confident_attack.fatality:0 "cho đến khi một cú đánh ngang bất ngờ rạch toạc bụng ta.\n\nCú đánh hất ta ngã về phía sau, một thứ gì đó mềm nhũn và đỏ sẫm trượt ra khỏi vết thương khi ta đổ xuống [sc_defender.Custom('GroundType')].\n\nNỗi đau nhấn chìm ta. Ta đã từng mất nhiều máu đến thế này chưa? [sc_loser.Custom('signature_weapon')] của ta bị đá văng đi, nhưng ta không thể quan tâm nổi.\n\nPhía trên ta, [sc_victor.GetFirstNameNoTooltip] chuẩn bị đòn đánh cuối cùng bằng [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')]."
  single_combat.0031.desc.opponent_response.expert_onslaught.fatality:0 "đánh Ta ngã, ép Ta xuống đất trong tiếng thét, cơ thể tan nát.\n\nTầm nhìn mờ, mắt lùi khỏi đau đớn, nhưng Ta vẫn thấy mảng thịt dính vào [sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('signature_weapon')].\n\nCú tiếp theo đánh vào cổ họng, cắt ngắn tiếng thét của Ta với sự 'từ bi' đầy máu."
  single_combat.0031.desc.opponent_response.attempt_disarm.fatality:0 "Trước khi Ta phản đối, [sc_victor.GetFirstNameNoTooltip] tung một [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] vào lồng ngực, mọi thứ trở nên đau đớn cháy rát.\n\nTa cảm nhận vài cú tiếp theo mờ mịt, như qua màn sương dày. Thị giác mờ dần."
 ### No need for a lightning_assault, as you can't end the duel in the first round.
  single_combat.0031.desc.opponent_response.tire_opponent.fatality:0 "một khoảng trống xuất hiện trong phòng thủ của Ta.\n\nCú đánh tiếp theo xé toang bụng Ta, máu, mật và thức ăn chưa tiêu trào ra khắp đôi ủng.\n\nTa hét lên, đau đớn không thể tưởng tượng, ôm chặt ruột lòi ra. Có lẽ chỉ là trong đầu Ta, nhưng Ta cảm giác một thoáng thương hại xuất hiện trên [sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('MaskFace')] khi [sc_victor.GetSheHe] giơ [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] để kết liễu Ta."
  single_combat.0031.desc.opponent_response.reason_you_suck_speech.fatality:0 "Ta hét lên trong thất vọng.\n\nDường như đây chính là #EMP khoảnh khắc mà [sc_victor.GetFirstNameNoTooltip] chờ đợi#!, khi [sc_victor.GetSheHe] lợi dụng sự mất tập trung tạm thời này để xuyên qua phòng thủ của Ta và [sc_victor.Custom('SignatureWeaponWoundVerb5')] [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] vào cổ Ta.\n\nTa bắt đầu nghẹn thở gần như ngay lập tức, nhưng không khí không tới. Chỉ có máu. Cục máu dày lẫn nước bọt trào lên cổ họng và ra miệng."
  single_combat.0031.desc.opponent_response.technique_from_legend.fatality:0 "Ta cố gắng chặn, nhưng tính sai… thứ gì đó. Thế giới quay cuồng, cơn chóng mặt và buồn nôn chiếm lấy Ta cho đến khi đầu Ta đập vào vật gì đó với tiếng #EMP thịch#!.\n\nTa không cảm nhận gì cả. Ta không thể nói. Ta… Ta nhìn thấy cơ thể mình nằm cách đó vài bước, máu phun ra từ cổ bị cắt."
  single_combat.0031.desc.opponent_response.like_a_viper.fatality:0 "Thời gian như chậm lại. Ta cảm nhận cánh tay cầm [sc_loser.Custom('signature_weapon')] của mình chuyển động, chậm chạp không kịp can thiệp, nhưng mắt Ta khóa vào vũ khí chết người chuẩn bị [sc_victor.Custom('SignatureWeaponWoundVerb3')] vào ngực Ta.\n\nRồi nó trúng.\n\nThịt rách. Xương nứt, rồi vỡ vụn. Ta cảm thấy gì đó đâm qua lưng, nhưng không biết là mình hay kim loại. Ta không thể… không thể thở. Không cảm nhận được gì. Không."
  single_combat.0031.desc.opponent_response.pocket_silver.fatality:0 "có [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')]-[sc_victor.Custom('SignatureWeaponTipType')] bay tới gặp Ta.\n\nVũ khí trúng thẳng miệng Ta, nổ tung răng và mảng thịt đầy máu. Hàm Ta rũ xuống vô dụng. Ta lảo đảo, cố gắng hét lên, nhưng chỉ nghe tiếng nấc nghẹn.\n\nTa không hề thấy cú đánh nhân từ của [sc_victor.GetFirstNamePossessiveNoTooltip]."
  single_combat.0031.desc.opponent_response.martial_voice.fatality:0 "Có điều gì đó về giọng nói khiến Ta đứng chết trân, như con nai nghe tiếng kèn săn. Cú đánh đáng lẽ dễ dàng chặn hay né, hay… bất cứ gì.\n\nNhưng Ta không làm được.\n\nThay vào đó, nó [sc_victor.Custom('SignatureWeaponWoundVerb2ThirdPersonPresent')] sâu vào vai Ta, tách xương và phun máu động mạch lên cả hai chúng Ta."
  single_combat.0031.desc.opponent_response.mocking_boast.fatality:0 "hất văng [sc_loser.Custom('signature_weapon')] khỏi tay ta nhẹ tựa món đồ chơi trẻ nhỏ.\n\n[sc_loser.Custom('EyeEyes')|U] mở to vì kinh hãi, ta hoảng loạn, nhưng đã quá muộn. [sc_victor.GetHerHis|U] [sc_victor.Custom('signature_weapon')] đang vung tới, sẵn sàng [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] chỉ bằng một đòn chí mạng."
  single_combat.0031.desc.opponent_response.is_that_a_crocodile.fatality:0 "xông vào Ta, làm Ta ngã nhào xuống đất.\n\n[sc_loser.Custom('signature_weapon')] của Ta bay đi. Chớp mắt, Ta nhìn thẳng vào họng mở to của con quái vật.\n\nRồi mọi thứ tối đen, ướt và đau đớn: Ta vùng vẫy, nghẹn thở, cố gắng hét, nhưng không âm thanh nào thoát ra khỏi miệng nó, chỉ có tiếng xương vỡ và tủy bắn ra."
  single_combat.0031.desc.opponent_response.desert_warrior.fatality:0 "đá khéo đầu gối Ta ra khỏi chỗ.\n\nBị quăng xuống [sc_defender.Custom('GroundType')], Ta cố gắng đứng lên, hoàn toàn mất hơi.\n\n[sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponWoundVerb2ThirdPersonPresent')] vào ngực Ta từ trên xuống, và, chỉ thế thôi, mọi thứ kết thúc. Tay chân Ta run rẩy thảm hại, nhưng trận đấu đã rút kiệt cơ thể Ta."
  single_combat.0031.desc.opponent_response.jungle_stalker.fatality:0 "đánh thẳng vào mắt Ta bằng [sc_victor.Custom('SignatureWeaponEndType')] của [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')].\n\nNgạc nhiên và đã chật vật với cành lá, [sc_loser.Custom('signature_weapon')] của Ta tuột khỏi tay.\n\nKhông phòng thủ, Ta là con mồi dễ dàng cho [sc_victor.GetFirstNameNoTooltip], và một loạt [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] xé nát Ta từng đòn."
  single_combat.0031.desc.opponent_response.open_terrain_expert.fatality:0 "Chỉ khi Ta vươn quá xa mới nhận ra [sc_victor.GetSheHe] đang làm gì. [sc_loser.Custom('signature_weapon')] của Ta bị quăng quá xa, [sc_victor.GetFirstNameNoTooltip] quay [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] lại, và cơn đau như lửa bùng lên bên sườn.\n\nTa quỵ xuống, thở hổn và ho, nuốt từng hơi thở gấp gáp. Tất cả vô ích.\n\n[sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('SignatureWeaponActionThirdPerson')] [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] cho cú kết liễu."
  single_combat.0031.desc.opponent_response.rough_terrain_expert.fatality.rocky:0 "Ta vấp, trượt và ngã xuống dốc, tay chân dang ra.\n\nMột thứ sắc nhọn, đá hay vũ khí, chạm vào cột sống, nửa dưới tê liệt trong khi nửa trên rên la. Thế giới đột ngột đứng yên. Tay Ta uốn ngược, máu tràn vào mắt, và Ta lạnh ngắt.\n\n[sc_victor.GetFirstNameNoTooltip] đứng trên Ta, chuẩn bị kết thúc đau khổ."
  single_combat.0031.desc.opponent_response.rough_terrain_expert.fatality.boggy:0 "Ta trượt chân và ngã xuống một vũng nước lợ sâu.\n\n[sc_loser.Custom('signature_weapon')] của ta lập tức biến mất, và khi ta vùng vẫy, một chiếc ủng nặng nề giẫm xuống sau cổ ta, giữ ta chìm dưới vũng nước hôi thối.\n\nMọi nỗ lực chống cự của ta đều bị đáp lại bằng những cú vung [sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('signature_weapon')] một cách thản nhiên, cho đến khi ta không còn sức để cố đẩy [sc_victor.GetHerHim] ra khỏi mình."
  single_combat.0031.desc.opponent_response.forest_fighter.fatality:0 "cành cây trước mặt Ta, rồi vấp ngã xuống bụi rậm.\n\nGai và cành cứng quệt vào [sc_loser.Custom('MaskFace')], thứ gì đó kéo gần như rút [sc_loser.Custom('signature_weapon')] khỏi tay. Ta cố giành lại, cúi xuống trên đất, khi thứ gì đó lạnh như cái chết [sc_victor.Custom('SignatureWeaponKillTypeRearTorsoThirdPersonActive')].\n\nTa ngã ngay lập tức, đất và cây mục lấp đầy miệng. Ta không cảm nhận được chân, tay mềm như bột.\n\n[sc_victor.GetFirstNameNoTooltip] đá Ta ra lưng để kết liễu."
  single_combat.0031.desc.opponent_response.raaargh.fatality:0 "[sc_loser.Custom('SignatureWeaponBreaksVerbPresentParticiple')] [sc_loser.Custom('signature_weapon')] của ta bằng một cú [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] duy nhất.\n\n[sc_victor.GetFirstNameNoTooltip] lao tới, đấm ta mạnh đến mức vào [sc_loser.Custom('MaskFace')] khiến ta nuốt phải vài chiếc răng và bay ngược ra sau, xoay vòng quanh đầu mình.\n\nTa đập mạnh xuống [sc_defender.Custom('GroundType')], hoàn toàn không thể hiểu chuyện gì đang xảy ra. Khi ta lấy lại được ý thức, một chiếc ủng đang lao xuống cực nhanh và hung bạo vào [sc_loser.Custom('MaskFace')].\n\nVà lần nữa, lần nữa, lần nữa..."
  single_combat.0031.desc.opponent_response.hard_grit.fatality:0 "Không lâu sau Ta phải đối mặt với thực tại. [sc_victor.GetSheHe|U] khiến Ta lùi, không còn khoảng trống để lấy lại, và Ta không thể chặn mãi.\n\nKhi cái chết đến, ít ra cũng nhanh, khi [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponWoundVerb4ThirdPersonPresent')] cổ Ta thành mảnh nát đầy máu."
  single_combat.0031.desc.opponent_response.feint_and_stab.fatality:0 "Cú đánh xẻ ngực Ta, máu phun như thác từ vết thương.\n\nCó lẽ thật ngu ngốc khi đối đầu với [sc_victor.GetWomanMan] giết người như trò chơi thường xuyên? Có thể vậy, có thể không. Dù sao, cảm giác tê lan nhanh khắp tay chân báo hiệu Ta không còn nhiều thời gian hối tiếc."
  single_combat.0031.desc.opponent_response.butchery.fatality:0 "Không lâu sau Ta trở thành đống rệu rã, [sc_loser.Custom('EyeEyes')] mở to vì đau. Ta ước gì cảm giác tê liệt, nhưng cơn đau chỉ tăng với mỗi cú đánh của [sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('signature_weapon')].\n\nThật là một loại 'nhân từ' khi [sc_victor.GetSheHe] túm lấy đầu Ta và [sc_victor.Custom('SignatureWeaponKillTypeHead2ThirdPersonActive')]; ít ra Ta chết nhanh hơn."
  single_combat.0031.desc.opponent_response.stoic_veteran.fatality:0 "cho đến khi cú cuối chống vào [sc_loser.Custom('signature_weapon')] Ta [sc_loser.Custom('SignatureWeaponBreaksThirdPersonSingularPresent2')].\n\nTa không còn thời gian để suy ngẫm, cú tiếp theo trúng thẳng ngực và [sc_victor.Custom('SignatureWeaponKillTypeTorsoThirdPersonActive')].\n\nTa ngã xuống đất, mạng sống rút dần, miệng cử động vô tình. [sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('signature_weapon')] vẫn còn cắm trong Ta."
  single_combat.0031.desc.opponent_response.blade_dance.fatality:0 "khắc những đường máu lên cánh tay [sc_loser.Custom('ArmArms')] phía trước và phần ngực trên của ta, rút máu ta như nước giếng.\n\nChỉ đến khi [sc_victor.GetSheHe] kết thúc trò chơi của mình, ta mới nhận ra mình chỉ là một món đồ chơi đối với [sc_victor.GetHerHim].\n\nKiệt sức, hấp hối, ta gục xuống đầu gối. Một vũng máu của chính mình sưởi ấm ta khi ta cố ngẩng lên nhìn kẻ giết mình.\n\n[sc_victor.GetFirstNameNoTooltip] đáp lại ánh mắt ta bằng sự thờ ơ lạnh lẽo. [sc_victor.GetHerHis|U] [sc_victor.Custom('signature_weapon')] bắt đầu rơi xuống một cách đáng sợ."
  single_combat.0031.desc.opponent_response.wrath_of_highgod.fatality:0 "một [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] trúng mạnh khiến [sc_loser.Custom('signature_weapon')]'s [sc_loser.Custom('SignatureWeaponBreaksThirdPersonSingularPresent')].\n\nChoáng váng, Ta đứng chết trân, rơi vũ khí vô dụng xuống [sc_defender.Custom('GroundType')]. Chỉ trong một giây, nhưng giây đó đủ để [sc_victor.GetFirstNameNoTooltip] [sc_loser.Custom('SignatureWeaponKillTypeFirstPersonFuture')]."
  single_combat.0031.desc.opponent_response.hurt_me_better.fatality:0 "kết thúc bằng loạt [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] đẩy Ta như con chó con.\n\nMỗi cú phản công dường như vô ích, đối thủ sẵn sàng chịu đòn nếu [sc_victor.GetSheHe] có thể trả lại với lãi.\n\nTa không thấy cú kết liễu, chỉ cảm nhận nó [sc_victor.Custom('SignatureWeaponWoundVerb2PresentParticiple')] vào hông. Máu nóng, ướt chảy dọc hông khi Ta ngã xuống [sc_defender.Custom('GroundType')]."
  single_combat.0031.desc.opponent_response.special_fallback.fatality:0 "[sc_victor.Custom('SignatureWeaponEndType')] của [sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('signature_weapon')] lao thẳng vào [sc_loser.Custom('MaskFace')]. Ta ngã sấp với tiếng thở hổn, [sc_loser.Custom('signature_weapon')] lăn ra khi Ta sụp xuống, và đối thủ đá Ta ngửa ra lưng.\n\nTrước khi Ta kịp phản đối, [sc_victor.GetSheHe] [sc_victor.Custom('SignatureWeaponKillTypeThirdPersonActive')] bằng [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')]. Bụng Ta #EMP rên lên#! trong đau đớn, tay chân tê liệt, mặt lạnh lùng.\n\nĐây… đây là kết thúc."
 ### No need for a something_to_hide, as it's never fatal.

 ## Aggressor Lost, Own Combat Move Feedback
  single_combat.0031.desc.sc_attacker.wait_and_hope:0 "Hy vọng đối thủ của Ta sẽ làm [sc_victor.GetHerselfHimself] hóa ra là một ý tưởng tồi.\n\nBị đóng băng trong sự do dự, Ta trở thành con mồi dễ dàng cho một [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] mà"
  single_combat.0031.desc.sc_attacker.unsure_attack:0 "Với nhiều hy vọng hơn là kỹ năng, Ta thử một [sc_loser.Custom('SignatureWeaponAttemptedLight')] thăm dò nhưng chẳng đi đến đâu. Đối thủ của Ta dễ dàng né tránh đòn tấn công của Ta, chỉ để"
  single_combat.0031.desc.sc_attacker.enthusiastic_onslaught:0 "Ta lao vào đối thủ, [sc_loser.Custom('signature_weapon')] [sc_loser.Custom('SignatureWeaponFlourishPresentParticiple')], quyết tâm hạ gục [sc_loser.GetHerHim] bằng càng nhiều đòn điên cuồng càng tốt.\n\n"
  single_combat.0031.desc.sc_attacker.hail_mary:0 "Đôi khi, khi chiến đấu, Ngài đơn giản biết rằng mình thua kém. Trường hợp này đúng như vậy, khi nước cờ tuyệt vọng của Ta biến từ một trận mưa [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] điên cuồng thành"
  single_combat.0031.desc.sc_attacker.pocket_sand:0 "Nhón lấy một nắm [sc_defender.Custom('GritType')], Ta ném về phía đối thủ, nhưng một cơn gió làm Ta mất thăng bằng và ném [sc_defender.Custom('GritType')] bay thẳng trở lại #EMP mặt của Ta#! [sc_loser.Custom('MaskFace')].\n\n"
  single_combat.0031.desc.sc_attacker.nut_em:0 "Ta chắc chắn rằng mình đã thấy một khe hở trong phòng thủ đối thủ, nhưng khi lao về phía trước để đập đầu vào [sc_victor.GetHerHis] [sc_loser.Custom('MaskFace')], một thứ gì đó đã chặn Ta lại"
  single_combat.0031.desc.sc_attacker.guard:0 "Ta làm hết sức để duy trì tư thế phòng thủ vững chắc, nhưng vô ích. Một khoảng trống rõ ràng trong các pha chặn của Ta khiến Ta lộ ra cho"
  single_combat.0031.desc.sc_attacker.probing_attack:0 "Cố gắng giữ sức nhanh chóng thất bại khi một trong những đòn thăm dò của Ta bị phản đòn quá mạnh đến mức"
  single_combat.0031.desc.sc_attacker.onslaught:0 "Ta ném [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] sau [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] vào đối thủ, một trận mưa đòn liên tục đầy sức mạnh. Cho đến khi nó không còn tác dụng.\n\n"
  single_combat.0031.desc.sc_attacker.surprise_attack:0 "Mặc dù Ta che giấu hành động tốt nhất có thể, đối thủ Ta vẫn nhìn thấu đòn bất ngờ, phản đòn bất ngờ và khiến Ta bị lùi lại.\n\n"
  single_combat.0031.desc.sc_attacker.taunt:0 "Ta lùi lại, sẵn sàng chế nhạo đối thủ đến tận xương tủy, nhưng cho phép bản thân bị phân tâm một thoáng.\n\nTa thậm chí không thấy [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]"
  single_combat.0031.desc.sc_attacker.put_the_boot_in.peg_leg:0 "Mặc dù [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] của Ta làm đối thủ choáng váng, [sc_victor.GetSheHe] phản công trước khi cú đá của Ta chạm đích: một [sc_victor.Custom('SignatureWeaponAttemptedLight')] tàn khốc đến mức đánh bật chân giả của Ta và khiến Ta ngã lăn xuống đất.\n\n"
  single_combat.0031.desc.sc_attacker.put_the_boot_in.fallback:0 "Mặc dù [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] của Ta làm đối thủ choáng váng, cú đá tiếp theo hoàn toàn trượt, và chỉ một [sc_victor.Custom('SignatureWeaponAttemptedLight')] trả đòn, Ta đã thở dốc trên mặt đất.\n\n"
  single_combat.0031.desc.sc_attacker.strict_guard:0 "Ít ai tranh cãi rằng phòng thủ của Ta gần như không thể phá vỡ, nhưng bằng cách nào đó đối thủ vẫn làm được, có thể là nhờ kỹ năng, có thể là nhờ may mắn.\n\n"
  single_combat.0031.desc.sc_attacker.confident_attack:0 "Ta vung [sc_loser.Custom('signature_weapon')] của mình với sự tinh thông và uyển chuyển, nhưng ngay cả chuyên gia cũng mắc sai lầm. Giữa một [sc_loser.Custom('SignatureWeaponAttemptedLight')] được tính toán rủi ro, đối thủ của Ta"
  single_combat.0031.desc.sc_attacker.expert_onslaught:0 "Với kỹ năng chết người, Ta tung một trận mưa [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] về phía đối thủ, buộc [sc_victor.GetHerHim] phải lùi từng bước. Chiến thắng gần đến mức Ta có thể nếm được!\n\n"
  single_combat.0031.desc.sc_attacker.attempt_disarm:0 "Tính toán rằng đây là cơ hội tốt nhất để chiến thắng dễ dàng, Ta cố gắng quét [sc_victor.Custom('signature_weapon')] khỏi tay đối thủ bằng một [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] mạnh mẽ. Gần như là một bất ngờ khi [sc_victor.GetSheHe] bắt được [sc_loser.Custom('signature_weapon')] của Ta ở góc sai,"
 ### No need for a lightning_assault, as you can't end the duel in the first round.
  single_combat.0031.desc.sc_attacker.tire_opponent:0 "Chơi để câu giờ, Ta lùi lại khỏi đối thủ, cố gắng luồn lách qua các đòn đánh của [sc_victor.GetHerHis] cho đến khi [sc_victor.GetSheHe] mệt. Một chiến lược nguy hiểm ngay cả trong thời điểm tốt nhất, Ta thấy mình bị mắc bẫy bởi vài [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] mà"
  single_combat.0031.desc.sc_attacker.reason_you_suck_speech:0 "Một số người có thể gọi Ta là kẻ ngốc khi phê bình lối sống của đối thủ trong khi cả hai đều cầm vũ khí chết người. Họ chắc chắn sẽ thấy thỏa đáng khi"
  single_combat.0031.desc.sc_attacker.technique_from_legend:0 "Ta thường tự hỏi liệu chữ viết hay thanh kiếm sắc bén của một [sc_loser.GetLadyLord] mạnh hơn. Đối với đối thủ của Ta, ít nhất, có vẻ là [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')], khi [sc_victor.GetSheHe] làm trò cười cho nỗ lực bắt chước huyền thoại của Ta.\n\n"
  single_combat.0031.desc.sc_attacker.like_a_viper:0 "Ta lao mạnh về phía khe hở trong phòng thủ đối thủ, [sc_loser.Custom('signature_weapon')]-[sc_loser.Custom('SignatureWeaponTipType')] lấp lánh, sẵn sàng kết thúc trận đấu. Điều Ta không tính trước là"
  single_combat.0031.desc.sc_attacker.pocket_silver:0 "Với tất cả sự khéo léo Ta có thể, Ta lấy một túi tiền từ thắt lưng và ném thẳng về phía đối thủ. Không may, [sc_victor.GetSheHe] phản xạ nhanh hơn Ta tưởng, phá hủy túi với một [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] phản xạ khiến Ta bị rải đầy những đồng bạc nặng.\n\nDù bị bất ngờ,"
  single_combat.0031.desc.sc_attacker.martial_voice:0 "Lãnh đạo đám đông và chỉ huy binh sĩ quý tộc chứng tỏ là hai kỹ năng hoàn toàn tách biệt. Bực tức hơn là ngạc nhiên vì tiếng la hét của Ta, đối thủ chờ Ta hết hơi rồi"
  single_combat.0031.desc.sc_attacker.mocking_boast:0 ""Ngài biết cách nào tốt để có danh tiếng không?" đối thủ hỏi, [my_foe.Custom('EyeEyes')] nheo lại trước những lời khoe khoang chế nhạo của Ta, "giết người nổi tiếng".\n\nTa… [sc_victor.GetSheHe] không sai. Sự chần chừ của Ta tạo cơ hội hoàn hảo cho [sc_victor.GetHerHim] #EMP đúng lúc#! để"
  single_combat.0031.desc.sc_attacker.is_that_a_crocodile:0 "Ta né về phía sau, nhường đất điên cuồng để ra khỏi tầm với của quái vật. Nhưng nó không di chuyển.\n\nNó là một tảng đá. Chỉ là một #EMP tảng đá chết tiệt#!, không phải cá sấu chết tiệt, và bây giờ đối thủ khiến Ta mất thăng bằng và chao đảo.\n\n"
  single_combat.0031.desc.sc_attacker.desert_warrior:0 "Ta đợi và đợi và đợi đối thủ mệt vì nắng sa mạc, nhưng [sc_victor.GetSheHe] dường như chỉ tiếp tục đổ mồ hôi, tiếp tục chiến đấu, và sự bối rối của Ta làm phòng thủ yếu đi.\n\n"
  single_combat.0031.desc.sc_attacker.jungle_stalker:0 "Khu rừng khiến nhiều khía cạnh của chiến đấu trở nên khó khăn, nhưng một kẻ nghiệp dư kiên nhẫn có thể vượt qua một số trở ngại tồi tệ nhất của nó chỉ bằng cách giữ bình tĩnh. Trong lúc chờ đợi tinh thần của đối thủ suy sụp, ta cảm thấy thứ gì đó bắt đầu quấn quanh chân mình, và cúi xuống nhìn thì thấy mình đã bị mắc kẹt trong một dây leo nặng nề.\n\n"
  single_combat.0031.desc.sc_attacker.open_terrain_expert:0 "Với nhiều không gian để chiến đấu, Ta lùi lại liên tục, đổi đất lấy sự bực bội của đối thủ. Cho đến khi Ta vấp, Ta mới nhận ra [sc_victor.GetSheHe] đã dẫn Ta về phía một vật gì đó. Ta thấy tảng đá lần đầu khi ngã ra sau.\n\n"
  single_combat.0031.desc.sc_attacker.rough_terrain_expert.rocky:0 "Mặc dù đối thủ của ta không quen chiến đấu trong môi trường đá gồ ghề, không bằng phẳng này như ta, [sc_victor.GetSheHe] vẫn giữ thế đứng cực kỳ vững chắc, khiến những cú xô đẩy của ta chẳng làm gì ngoài việc phá rối #EMP sự#! cân bằng của chính ta.\n\n"
  single_combat.0031.desc.sc_attacker.rough_terrain_expert.boggy:0 "Ngay cả với một cựu binh như Ta, đầm lầy và bãi bùn đem lại nhiều mối nguy khó đánh giá. Mỗi vũng Ta đẩy đối thủ đến đều nông đến mức vô hại, nhưng lần đầu tiên Ta mạo hiểm bước vào nước, Ta ngập tới đầu gối!\n\n"
  single_combat.0031.desc.sc_attacker.forest_fighter:0 "Đôi khi, rừng rậm dày đặc và u ám đến mức chỉ kẻ ngốc mới dám bước vào một mình. Đôi khi, chúng đẹp yên bình đến mức trẻ con chỉ nghĩ đến chơi cũng ngất xỉu.\n\nKhu rừng hiện tại của chúng Ta thuộc loại sau, và khi Ta tìm kiếm mối nguy môi trường để tận dụng, đối thủ của Ta"
  single_combat.0031.desc.sc_attacker.raaargh:0 "Hét lên kinh hoàng, Ta lao vào đối thủ, vung tay, đập, cắn, đá, một cơn bão giận dữ và bạo lực tưởng chừng không bao giờ kết thúc.\n\nKhi cơn thịnh nộ lắng xuống, Ta thấy"
  single_combat.0031.desc.sc_attacker.hard_grit:0 "Trong chiến đấu, Ta thường lợi dụng sự kiêu ngạo của đối thủ. Sự tự tin không chính đáng tốt nhất nên bị trừng phạt bằng thất bại nhanh. Tuy nhiên, đối thủ giờ dường như quyết tâm đối đầu từng đòn một, chỉ để lại khe hở để lôi Ta vào việc quá mức.\n\n"
  single_combat.0031.desc.sc_attacker.feint_and_stab:0 "Chia sự chú ý giữa hai đòn chứng tỏ là… quá tham vọng. Ta nhận ra [sc_loser.Custom('signature_weapon')] bị giật khỏi tay khi dao tay trái của Ta vô tình vung tới,"
  single_combat.0031.desc.sc_attacker.butchery:0 "Thực tế, giết những người nông dân khiếp sợ dẫn đầu một đội cướp chuyên nghiệp khác khá nhiều so với chiến đấu tay đôi với một đối thủ kiên định.\n\nCác kỹ thuật làm trẻ con, người ốm, và người già khiếp sợ đơn giản không có tác dụng với đối thủ, người lợi dụng sự tự tin dễ dàng của Ta để"
  single_combat.0031.desc.sc_attacker.stoic_veteran:0 "Trong Vệ binh, chúng Ta chủ yếu bảo vệ Hoàng đế trước ám sát, nhưng hầu hết kẻ ám sát bỏ chạy khi thấy Varangian trang bị nặng. Đối thủ của Ta, đáng khen cho [sc_victor.GetHerHis], dường như không bị ấn tượng bởi vẻ ngoài hăm dọa của Ta, và những cú chém kiên định của Ta bị phản đòn quyết tâm nối tiếp quyết tâm.\n\n"
  single_combat.0031.desc.sc_attacker.blade_dance:0 "Trong chiến đấu, ta là một nghệ sĩ. Mỗi đòn đánh là một nét cọ, mỗi kẻ ngã xuống là một bức- #EMP chết tiệt#!, ôi, chết tiệt, tay cầm [sc_loser.Custom('signature_weapon')] của ta, [sc_victor.GetSheHe] đánh trúng #EMP chính xác#! vào tay cầm [sc_loser.Custom('signature_weapon')] của ta, chuyện này đáng lẽ không thể xảy ra!\n\n"
  single_combat.0031.desc.sc_attacker.wrath_of_highgod:0 "Ta không nghi ngờ gì rằng [sc_loser.GetFaith.HighGodName] muốn Ta thắng trận đấu này, và Ta thốt lên trong lời cầu nguyện. Không may, đối thủ lợi dụng sự phân tâm của Ta để"
  single_combat.0031.desc.sc_attacker.hurt_me_better:0 "Ta không lạ gì với đau đớn, và cố gắng tận dụng những vết thương đối thủ gây ra cho mình. Tuy nhiên, ngay cả với Ta, những vết thương này vẫn quá sức, và tâm trí Ta ít tập trung vào nỗi đau ngọt ngào mà nhiều hơn vào cảm giác khó chịu của thịt bị xé.\n\nKhi sự tập trung tan đi, lẽ ra là một cú lao nhiệt huyết, giờ chỉ còn là một chuỗi [sc_loser.Custom('SignatureWeaponAttemptedLightPlural')] buồn bã.\n\n"
  single_combat.0031.desc.sc_attacker.special_fallback:0 "Với tất cả cơn thịnh nộ, Ta tung một cú đá dữ dội vào ống chân đối thủ, chỉ để cảm nhận thăng bằng hoàn toàn mất đi khi Ta #EMP hoàn toàn#! trượt, khiến cơ thể Ta bay theo cú đá lệch.\n\n"
  single_combat.0031.desc.sc_attacker.something_to_hide:0 "Ta mới chỉ nói đến một nửa về khoản nợ của đối thủ khi vũ khí của [sc_victor.GetHerHis] với [sc_victor.Custom('SignatureWeaponEndType')] tấn công thẳng vào hàm Ta. Ta lảo đảo lùi lại,"

 ## Aggressor Lost, Own Combat Move Injury
  single_combat.0031.desc.sc_attacker.wait_and_hope.injury:0 "ném Ta xuống [sc_defender.Custom('GroundType')]. Ta lồm cồm bò dậy, nhưng đến khi lấy lại thăng bằng, đã có một [sc_victor.Custom('SignatureWeaponTipAdjective')] [sc_victor.Custom('signature_weapon')]-[sc_victor.Custom('SignatureWeaponTipType')] áp mạnh vào cổ Ta.\n\nMột lần nữa, Ta lại đứng chết trân."
  single_combat.0031.desc.sc_attacker.unsure_attack.injury:0 "phóng tới với một [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] khiến Ta hoàn toàn mất thăng bằng.\n\nTrước khi kịp lấy lại tư thế, một cú đá theo sau hất Ta xuống đất, và Ta nhìn lên thấy [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')] sẵn sàng đâm vào cổ Ta."
  single_combat.0031.desc.sc_attacker.enthusiastic_onslaught.injury:0 "Ta không nhìn thấy cú đánh [sc_victor.Custom('SignatureWeaponEndType')] vào bên đầu mà chỉ cảm nhận nó, một cơn đau nóng rát ở thái dương kèm theo sự thay đổi đột ngột về góc nhìn khi Ta ngã nghiêng.\n\nChân của [sc_victor.GetFirstNamePossessiveNoTooltip] hiện ra trước mặt Ta, chuyển sang tư thế chiến đấu sau một khoảnh khắc thương hại.\n\nTa chỉ đủ sức thều thào được một câu."
  single_combat.0031.desc.sc_attacker.hail_mary.injury:0 "một chuỗi thất bại liên tiếp.\n\nCác đòn đánh trượt hoặc bật ra khỏi những pha parry của [sc_victor.GetFirstNamePossessiveNoTooltip] khiến Ta mất thăng bằng, và thậm chí tự đánh vào [sc_loser.Custom('MaskFace')] bằng tay vung loạn.\n\nThực sự là một ân huệ khi đối thủ gần như nhẹ nhàng đánh bật [sc_loser.Custom('signature_weapon')] khỏi tay Ta."
  single_combat.0031.desc.sc_attacker.pocket_sand.injury:0 "Ho khịt và sặc, Ta trở thành con mồi dễ dàng cho [sc_victor.GetFirstNameNoTooltip], người đập thẳng vào cổ Ta bằng [sc_victor.Custom('SignatureWeaponEndType')] của [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')], hất Ta vào [sc_defender.Custom('GroundType')].\n\nTa vừa kịp thở lại thì cảm nhận vũ khí của [sc_victor.GetHerHis] đặt lên bụng trần của mình."
  single_combat.0031.desc.sc_attacker.nut_em.injury:0 "cú đánh mạnh vào bụng, hất Ta qua không gian trống mặt úp xuống đất.\n\nTa vùng vẫy, cố đứng lên, nhưng vài cú đá dữ dội nhanh chóng chỉ ra sai lầm của Ta. [sc_victor.Custom('signature_weapon')] áp nhẹ vào gáy Ta cũng không đau chút nào."
  single_combat.0031.desc.sc_attacker.guard.injury:0 "vài [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] đặt đúng chỗ, đòn cuối đánh bật vũ khí Ta ra.\n\n[sc_victor.GetFirstNameNoTooltip] không mất thời gian chuẩn bị [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] cho một cú kết liễu."
  single_combat.0031.desc.sc_attacker.probing_attack.injury:0 "Ta tuột tay nắm.\n\n[sc_loser.Custom('signature_weapon')] của Ta vung ra, quay vòng, để Ta trần tay trong tầm gần.\n\n[sc_victor.GetFirstNameNoTooltip] chỉ cần [sc_victor.Custom('SignatureWeaponAction')] [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] là đủ để rõ ai thắng trận này."
  single_combat.0031.desc.sc_attacker.onslaught.injury:0 "Thay vào đó, [sc_loser.Custom('signature_weapon')] của ta chém vào khoảng không vô định, và ta cảm thấy một thứ nặng nề móc vào phía sau đầu gối rồi kéo mạnh. Ta vụng về xoay người nửa vòng, cố đưa vũ khí ra tấn công, nhưng lại nhận được một cú đấm thẳng vào [sc_loser.Custom('MaskFace')].\n\nKhi ta loạng choạng, một cú đánh mạnh giật [sc_loser.Custom('signature_weapon')] khỏi tay ta, và ngay lập tức ta hiểu rằng mình đã thua."
  single_combat.0031.desc.sc_attacker.surprise_attack.injury:0 "Trước khi kịp vung [sc_loser.Custom('signature_weapon')] để phòng thủ đòn phản công tất yếu, Ta nhận một cú gối bất ngờ vào bụng. Cú quặp người vì đau chỉ đem lại thêm một khuỷu tay vào gáy, và Ta ngã, gần như mù vì đau, xuống đất."
  single_combat.0031.desc.sc_attacker.taunt.injury:0 "húc vào Ta, và Ta ngã xuống với một #EMP tiếng rầm#! nặng nề.\n\nÚp mặt xuống [sc_defender.Custom('GroundType')], Ta chỉ kịp lầm bầm vài câu."
  single_combat.0031.desc.sc_attacker.put_the_boot_in.injury:0 "Ta lắc sang bên, cố bật dậy, nhưng một cú đánh tàn nhẫn từ [sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('signature_weapon')] trúng cột sống và đẩy Ta nằm sấp.\n\nỞ phía sau và trên đầu, Ta nghe [sc_victor.GetHerHim] chuẩn bị cú kết liễu với tiếng cười khinh bỉ."
  single_combat.0031.desc.sc_attacker.strict_guard.injury:0 "Điều quan trọng là, chỉ sau vài cú đánh [sc_victor.Custom('signature_weapon')], vũ khí của [sc_victor.GetFirstNamePossessiveNoTooltip] đã đặt lạnh lùng lên cổ Ta, đầu [sc_victor.Custom('SignatureWeaponTipAdjective')] [sc_victor.Custom('SignatureWeaponTipType')] áp vào tĩnh mạch cổ.\n\nKhi Ta cân nhắc các lựa chọn, [sc_victor.GetFirstNameNoTooltip] nhúc nhích sốt ruột."
  single_combat.0031.desc.sc_attacker.confident_attack.injury:0 "đẩy vũ khí của Ta trở lại bằng một cú parry chính xác.\n\nTránh [sc_loser.Custom('signature_weapon')] khiến Ta lọt thẳng vào đường đi của [sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('signature_weapon')], và mặc dù cú đánh chưa gây chết người, nó vẫn hất Ta xuống đất. Vũ khí của Ta bay ra khi Ta ngã."
  single_combat.0031.desc.sc_attacker.expert_onslaught.injury:0 "Nhưng khi Ta tận hưởng khoảnh khắc ngọt ngào, một [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] từ đâu xuất hiện, trúng mạnh thái dương Ta. Chóng mặt, Ta loạng choạng, và cú đánh tiếp theo khiến Ta mất vũ khí, hoàn toàn nằm trong tay [sc_victor.GetFirstNamePossessiveNoTooltip].\n\nMệt mỏi nhưng chiến thắng, đối thủ [sc_victor.Custom('SignatureWeaponActionThirdPerson')] [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] cho cú kết liễu."
  single_combat.0031.desc.sc_attacker.attempt_disarm.injury:0 "ném vũ khí bay đi.\n\nBất lực, Ta chỉ có khoảnh khắc để thừa nhận thất bại trước khi [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('SignatureWeaponKillTypeThirdPersonActive')]."
 ### No need for a lightning_assault, as you can't end the duel in the first round.
  single_combat.0031.desc.sc_attacker.tire_opponent.injury:0 "đập Ta mạnh đến mức mất thăng bằng và Ta chỉ biết ngã nhào.\n\n[sc_victor.GetFirstNameNoTooltip] không buông tha, và sớm đứng trên Ta, sẵn sàng [sc_victor.Custom('SignatureWeaponKillTypeGroinFirstPersonFuture')]."
  single_combat.0031.desc.sc_attacker.reason_you_suck_speech.injury:0 "[sc_victor.GetSheHe] trúng Ta vào cổ bằng một cú tát ngược [sc_victor.Custom('SignatureWeaponEndType')].\n\nKhi Ta nghẹn và sặc, cố hít không khí vào cổ họng bị bầm, [sc_victor.GetFirstNameNoTooltip] có toàn thời gian để chuẩn bị cú đánh hoàn hảo.\n\nChỉ trong một giây nữa, [sc_victor.GetSheHe] chắc chắn sẽ [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')]."
  single_combat.0031.desc.sc_attacker.technique_from_legend.injury:0 "Không phải là một tuyệt kỹ kết thúc trận đấu như ta tưởng, ta lại thấy mình tạo dáng đầy kịch tính rồi hoàn toàn mất tay cầm [sc_loser.Custom('signature_weapon')]! Vũ khí bay theo một đường cong đẹp mắt ra xa.\n\nBối rối nhưng vui vẻ, [sc_victor.GetFirstNameNoTooltip] chỉ vẫy nhẹ [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] của chính mình về phía ta."
  single_combat.0031.desc.sc_attacker.like_a_viper.injury:0 "[sc_victor.GetHerHis] #EMP kiên cường tuyệt đối#!.\n\nDựa vào cú đánh của Ta thay vì né, [sc_victor.GetFirstNameNoTooltip] điều hướng Ta vừa đủ để Ta #EMP chỉ thiếu chút nữa#! trượt, tạo cơ hội cho một cú gối nhanh vào bụng.\n\nTa ngã, và đã thấy [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')]-[sc_victor.Custom('SignatureWeaponTipType')] áp vào cổ trước khi kịp nghĩ đến việc phục hồi."
  single_combat.0031.desc.sc_attacker.pocket_silver.injury:0 "[sc_victor.GetFirstNameNoTooltip] tiếp tục ép lợi thế, giật [sc_loser.Custom('signature_weapon')] khỏi tay ta. Giờ đã bất lực, ta nhẹ nhàng nhổ ra một đồng bạc."
  single_combat.0031.desc.sc_attacker.martial_voice.injury:0 "phóng một [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] như bão táp.\n\nNgạc nhiên và hụt hơi, Ta ngã không kịp phản ứng. [sc_victor.GetFirstNameNoTooltip] bước qua Ta, chuẩn bị [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] để [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')]."
  single_combat.0031.desc.sc_attacker.mocking_boast.injury:0 "đánh vào ngực ta bằng một [sc_victor.Custom('SignatureWeaponAttemptedLight')]. Bị bất ngờ và hụt hơi, ta hầu như không thể chống cự trước đòn đánh tiếp theo, đòn đánh đã lấy đi [sc_loser.Custom('signature_weapon')] của ta, và [sc_victor.GetFirstNameNoTooltip] chuẩn bị [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] bằng đòn tấn công kế tiếp."
 ### No need for an is_that_a_crocodile, as it's never just an injury.
  single_combat.0031.desc.sc_attacker.desert_warrior.injury:0 "Một vài cú [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] bất ngờ từ [sc_victor.GetFirstNameNoTooltip] sau đó, Ta vấp ngã mặt úp xuống [sc_defender.Custom('GroundType')]. [sc_victor.GetHerHis|U] [sc_victor.Custom('signature_weapon')] lập tức áp vào gáy Ta."
  single_combat.0031.desc.sc_attacker.jungle_stalker.injury:0 "Ta cố gắng giải thoát bằng [sc_loser.Custom('signature_weapon')], nhưng không đủ nhanh, và [sc_victor.GetFirstNameNoTooltip] trúng Ta bằng một [sc_victor.Custom('SignatureWeaponAttemptedLight')] làm vũ khí của Ta cắm vào mặt đất rừng.\n\nChắc chỉ còn vài giây trước khi trận đấu kết thúc với Ta."
  single_combat.0031.desc.sc_attacker.open_terrain_expert.injury:0 "[sc_loser.Custom('signature_weapon')] bay khỏi tay Ta, và chân [sc_victor.GetFirstNamePossessiveNoTooltip] đè xuống cổ Ta trước khi Ta kịp thấy nơi nó hạ xuống."
  single_combat.0031.desc.sc_attacker.rough_terrain_expert.injury.rocky:0 "Một [sc_victor.Custom('SignatureWeaponAttemptedLight')] không may khiến Ta ngã lên dốc. Nhẹ nhàng theo tiêu chuẩn, nhưng đủ khoảng trống để [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] nếu được phép."
  single_combat.0031.desc.sc_attacker.rough_terrain_expert.injury.boggy:0 "Thật là dễ dàng cho [sc_victor.GetFirstNameNoTooltip] cướp vũ khí của Ta sau cú này, để Ta hoàn toàn phải chịu theo ý [sc_victor.GetHerHis]."
  single_combat.0031.desc.sc_attacker.forest_fighter.injury:0 "Trúng Ta bởi một [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] dữ dội, suýt làm Ta bất tỉnh.\n\nKhi tỉnh táo trở lại, [sc_loser.Custom('signature_weapon')] của Ta đã biến mất và một vũ khí được áp chặt vào cổ Ta."
  single_combat.0031.desc.sc_attacker.raaargh.injury:0 "mà Ta vừa [sc_loser.Custom('SignatureWeaponBreaksVerbPastTense')] vỡ [sc_loser.Custom('signature_weapon')]!\n\n[sc_victor.GetFirstNameNoTooltip] đứng cách Ta một chút, không tệ hơn nhiều so với khi Ta nổi điên, quan sát cẩn thận. Quan trọng là [sc_victor.GetSheHe] vẫn có vũ khí, và không xa để tấn công mạnh."
  single_combat.0031.desc.sc_attacker.hard_grit.injury:0 "Đó là một cuộc vật lộn căng thẳng, nhưng cuối cùng, Ta sa bẫy một chiêu giả quá nặng để hồi phục. Thay vào đó, Ta nằm dài trên mặt đất, không vũ khí."
  single_combat.0031.desc.sc_attacker.feint_and_stab.injury:0 "chỉ để #EMP vũ khí đó#! bị [sc_victor.GetFirstNamePossessiveNoTooltip] hất ra khỏi tay bằng cú vung ngược.\n\nBị tước vũ khí, không có vũ khí dự phòng, và đối thủ chuẩn bị [sc_victor.Custom('SignatureWeaponKillTypeGroinFirstPersonFuture')], Ta chỉ còn một lựa chọn duy nhất."
  single_combat.0031.desc.sc_attacker.butchery.injury:0 "cướp vũ khí của Ta một cách dễ dàng đáng kinh ngạc.\n\nCác tư thế uy hiếp và dọa nạt giờ trở nên vô nghĩa, bất kỳ dáng vẻ kịch tính nào cũng bị phản công dễ dàng bởi một vòng xoay của [sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('signature_weapon')]."
  single_combat.0031.desc.sc_attacker.stoic_veteran.injury:0 "Ta cố hết sức, nhưng chỉ là vấn đề thời gian trước khi xảy ra sai lầm, và [sc_victor.GetFirstNameNoTooltip] cuối cùng có thể phản công, xoay [sc_loser.Custom('signature_weapon')] ra khỏi tay Ta.\n\nVới cú đó, trận đấu đã được định đoạt."
  single_combat.0031.desc.sc_attacker.blade_dance.injury:0 "Ta phải tập trung, phải hồi phục, Ta có thể thắng, Ta chỉ cần, Ta chỉ, Ta- Ta đối mặt với một [sc_victor.GetFirstNameNoTooltip] khá tự mãn, người [sc_victor.Custom('SignatureWeaponActionThirdPerson')] [sc_victor.Custom('signature_weapon')] vẫn #EMP chắc chắn#! trong [sc_victor.GetHerHis] [sc_victor.Custom('HandHands')] với thái độ đe dọa rõ ràng."
  single_combat.0031.desc.sc_attacker.wrath_of_highgod.injury:0 "nhắm một cú đá mạnh vào háng, và Ta sụp xuống như một bao bắp cải.\n\nHít thở mệt mỏi vì cơn giận với sự báng bổ của [sc_victor.GetHerHis] chẳng ích gì, và trước khi kịp hồi phục Ta phải đối mặt với [sc_loser.Custom('MaskFace')] với [sc_victor.Custom('SignatureWeaponTipType')] của một [sc_victor.Custom('signature_weapon')]."
  single_combat.0031.desc.sc_attacker.hurt_me_better.injury:0 "Lúc này, khi tâm trí Ta bận rộn, chẳng cần nhiều sức lực để [sc_victor.GetFirstNameNoTooltip] phản công, cướp vũ khí và buộc Ta đầu hàng."
  single_combat.0031.desc.sc_attacker.special_fallback.injury:0 "[sc_victor.GetFirstNameNoTooltip] tận dụng dễ dàng, để Ta bay về phía trước trước khi đá chân còn lại của Ta ra. Ta ngã nhào và vài cú đá tàn nhẫn sau đó giữ Ta trong tình trạng đó."
  single_combat.0031.desc.sc_attacker.something_to_hide.injury:0 "nhổ máu từ môi nứt to tướng.\n\nCú đánh tiếp theo trúng bụng, làm Ta ngã nặng xuống đất. Hơi thở dồn dập, Ta lồm cồm thở và nôn, chỉ cảm nhận vũ khí [sc_loser.Custom('signature_weapon')] rời khỏi tay mình vào giây phút cuối cùng."

 ## Aggressor Lost, Own Combat Move Fatality
  single_combat.0031.desc.sc_attacker.wait_and_hope.fatality:0 "[sc_victor.Custom('SignatureWeaponWoundVerb1ThirdPersonPresent')] thẳng vào cổ Ta. Ta kinh hoàng nhìn vài giây khi máu cuộc đời Ta phun ra ướt sũng, trước khi nhịp đập yếu ớt dần trên ngực Ta.\n\nTa gục xuống đầu gối. Thế giới thật tối tăm. Nó luôn tối như thế này sao?\n\nCảm giác tê liệt."
  single_combat.0031.desc.sc_attacker.unsure_attack.fatality:0 "tấn công Ta bất ngờ.\n\nMột cú [sc_victor.Custom('SignatureWeaponAttemptedLight')] trúng chỗ mềm ở ngực Ta, [sc_victor.Custom('SignatureWeaponKillTypeTorso2PresentParticiple')] chéo. Ta cảm nhận đau đớn tê liệt và cơ thể dần suy sụp do hàng loạt cơ quan trúng đòn chết người.\n\nĐiều duy nhất giữ Ta ổn định là [sc_victor.Custom('signature_weapon')] cắm trong lồng ngực."
  single_combat.0031.desc.sc_attacker.enthusiastic_onslaught.fatality:0 "Chưa quá vài cú đánh thì một thứ gì đó [sc_victor.Custom('SignatureWeaponWoundVerb2ThirdPersonPresent')] sâu vào ngực Ta. Ta quay người, mất thăng bằng hoàn toàn, thấy [sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('signature_weapon')] rút ra khỏi cơ thể Ta kèm theo máu và mảnh xương.\n\nCơn đau ập đến ngay sau khoảnh khắc không tin. Một cơn đau dữ dội, trắng nóng, nhanh chóng chuyển thành tê liệt lan từ vết thương chí mạng."
  single_combat.0031.desc.sc_attacker.hail_mary.fatality:0 "Thất bại quá nhanh, Ta còn chưa chắc cú đánh đầu tiên có trúng.\n\nMột khoảnh khắc, Ta tấn công [sc_victor.GetFirstNameNoTooltip] hết sức, khoảnh khắc sau, Ta không cảm nhận được tay cầm [sc_loser.Custom('signature_weapon')]. Một thứ gì đó... lên cột sống? Ta không cử động được, ngã vào [sc_defender.Custom('GroundType')].\n\nTa bị đá ngửa ra, ít ra còn nhìn được Xóa Bạn mình.\n\nRồi [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] đâm xuống."
  single_combat.0031.desc.sc_attacker.pocket_sand.fatality:0 "Sự phân tâm cho phép [sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('signature_weapon')] đâm vào người Ta, [sc_victor.Custom('SignatureWeaponKillTypeTorsoPresentParticiple')] một cách tàn nhẫn.\n\nCơ thể Ta bùng nổ đau đớn, Ta lảo đảo. Cái gì? Sao lại thế? Ta...\n\nMáu bắn ra từ ngực theo tia nóng ướt. Ta khịt khịt, nói không rõ qua phổi hỏng; ngay cả #EMP Ta#! cũng không hiểu gì. Cú tấn công thương xót đến quá muộn."
  single_combat.0031.desc.sc_attacker.nut_em.fatality:0 "vào quanh cằm, [sc_victor.Custom('SignatureWeaponKillTypeHead2PresentParticiple')].\n\n[sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('signature_weapon')] rời khỏi người ta, nhuốm đầy máu của chính ta. Ta vừa hét lên, vừa phát ra tiếng ú ớ kinh hoàng, nhưng cánh tay ta vẫn còn hoạt động quá tốt khiến kẻ thù không thể nghĩ đến việc kết liễu nhân từ.\n\nThay vào đó, ta loạng choạng trong những khoảnh khắc đau đớn, vẫn theo phản xạ siết chặt [sc_loser.Custom('signature_weapon')] của mình để tự bảo vệ, cho đến khi không thể loạng choạng thêm được nữa."
  single_combat.0031.desc.sc_attacker.guard.fatality:0 "Một cú [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] từ đối thủ cắn sâu vào đùi Ta.\n\nChúng Ta trao thêm vài cú, cho đến khi Ta nhận ra cảm giác ướt ở thắt lưng. Nhìn xuống, chân Ta đã #EMP ướt sũng#! trong máu.\n\nTất cả cùng lúc, Ta hiểu, và ngã xuống đất, vẫn giật giật."
  single_combat.0031.desc.sc_attacker.probing_attack.fatality:0 "[sc_loser.Custom('signature_weapon')]'s [sc_loser.Custom('SignatureWeaponBreaksThirdPersonSingularPresent')].\n\nTa chỉ kịp nhận ra mọi thứ tệ hại ra sao trước khi [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('SignatureWeaponKillTypeThirdPersonActive')] với loạt [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')].\n\nThịt rách rưới, Ta loạng choạng. Ta níu lấy vết thương, nhưng tay chỉ còn dính máu mình.\n\nĐây... là kết thúc."
  single_combat.0031.desc.sc_attacker.onslaught.fatality:0 "Cái gì đó gãy qua đầu gối, Ta ngã xuống đất. Dù Ta lăn nhanh, vung [sc_loser.Custom('signature_weapon')] để chống [sc_victor.GetFirstNameNoTooltip], Ta không #EMP thấy#! [sc_victor.GetHerHim] đâu. [sc_victor.GetSheHe] đi đâu, [sc_victor.GetSheHe] phải ở đây chứ-"
  single_combat.0031.desc.sc_attacker.surprise_attack.fatality:0 "Ta cố lấy lại một chút kiểm soát, nhưng cú đánh tiếp theo của [sc_victor.GetHerHis] kéo vũ khí [sc_loser.Custom('signature_weapon')] khỏi tay Ta. Trong giây lát, mọi thứ là hoảng loạn, rồi trận đấu kết thúc.\n\n[sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponWoundVerb2ThirdPersonPresent')] sâu vào vai Ta, cắt qua xương đòn và làm rách thứ gì đó quan trọng. Cảm giác tê liệt ngay lập tức: hoảng loạn, đau đớn, mọi thứ... biến mất."
  single_combat.0031.desc.sc_attacker.taunt.fatality:0 "đánh Ta.\n\nTa chỉ cảm thấy nỗi đau vang khắp cơ thể, hàng nghìn đầu dây thần kinh gào thét khi Ta loạng choạng và chết."
  single_combat.0031.desc.sc_attacker.put_the_boot_in.fatality:0 "[sc_victor.GetFirstNameNoTooltip] không cho ta thời gian hồi phục, [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponKillTypeTorso2PresentParticiple')] bằng một [sc_victor.Custom('SignatureWeaponAttemptedLight')]. Máu trào ngược lên cổ họng rồi phun ra khỏi miệng ta, văng xuống [sc_loser.Custom('MaskFace')] tạo thành một vệt nhầy nhớp.\n\nẨn sâu dưới từng lớp đau đớn chồng chất, ta cảm nhận được tim mình vẫn đang đập, vẫn bơm máu qua những mạch máu bị xé rách và những động mạch đã vỡ nát. Không còn đường quay lại nữa."
  single_combat.0031.desc.sc_attacker.strict_guard.fatality:0 "Cuối cùng, điều đó cũng không quan trọng. Cổ họng tàn phá của Ta là minh chứng đủ rằng nó đã xảy ra, và cách thức không còn ý nghĩa.\n\nTa chao đảo, sinh lực rút hết. Khoảnh khắc trước Ta còn tồn tại, khoảnh khắc sau..."
  single_combat.0031.desc.sc_attacker.confident_attack.fatality:0 "gây một cú [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] chắc vào bụng Ta, xé toạc thịt yếu ớt và tràn nội tạng bừa bãi xuống đất.\n\nTa trượt trên đống ruột của chính mình, ngã ngửa kèm tiếng thét, cơ thể cháy rực đau đớn.\n\nCú đánh kết liễu không thể đến nhanh hơn."
  single_combat.0031.desc.sc_attacker.expert_onslaught.fatality:0 "Cho đến khi một phản đòn bất ngờ văng vào [sc_loser.Custom('MaskFace')], [sc_loser.Custom('SignatureWeaponWoundVerb6PresentParticiple')] một vết thương đến tận xương và làm Ta lảo đảo. Ta thét lên đau đớn, lùi lại tránh vũ khí chạm nhau, thì chân Ta bị quét khỏi dưới.\n\nChỉ kịp thét phản đối trước khi [sc_victor.GetSheHe] [sc_victor.Custom('SignatureWeaponKillTypeGroinThirdPersonActive')], [sc_victor.Custom('SignatureWeaponKillTypeGroinThirdPersonActive_Aftermath')].\n\nCái chết là sự giải thoát."
  single_combat.0031.desc.sc_attacker.attempt_disarm.fatality:0 "thực sự [sc_loser.Custom('SignatureWeaponBreaksVerbPresentParticiple')].\n\nĐối với [sc_victor.GetFirstNameNoTooltip], thật dễ dàng để [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] với [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] sau đó, và thế giới của Ta thu hẹp lại chỉ còn những tia sáng và nỗi đau nhỏ."
 ### No need for a lightning_assault, as you can't end the duel in the first round.
  single_combat.0031.desc.sc_attacker.tire_opponent.fatality:0 "ném Ta hoàn toàn mất thăng bằng.\n\nLoạng choạng và vấp ngã, một cú [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] mạnh ném Ta thẳng xuống [sc_defender.Custom('GroundType')]. Dù vũ khí bị gãy, Ta vẫn kịp chống đỡ cú đánh tiếp theo của [sc_victor.GetFirstNamePossessiveNoTooltip], nhưng cú kế tiếp thì [sc_victor.Custom('SignatureWeaponKillTypeHead2ThirdPersonActive')].\n\nTiếng la kinh hoàng của Ta không kéo dài, vì cơn đau lấy đi ý thức trước khi cái chết tới."
  single_combat.0031.desc.sc_attacker.reason_you_suck_speech.fatality:0 "[sc_victor.GetFirstNameNoTooltip] lợi dụng sự mất tập trung của Ta để tung một cú [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] chuẩn xác mà [sc_victor.Custom('SignatureWeaponKillTypeHead2ThirdPersonActive')].\n\nTa bị hất ngược, máu phun như một đài phun kinh dị. Không thể là vậy. Không thể kết thúc thế này. Ta có thể... Ta vẫn có thể... Ta có thể...\n\nTa chẳng thể làm gì. Ta loạng choạng xuống ngôi mộ đầy máu của mình."
  single_combat.0031.desc.sc_attacker.technique_from_legend.fatality:0 "Xa rời chiến thắng tức thì, Ta bị hất thẳng xuống sàn mặt úp. Ta chỉ kịp co rúm người trước khi [sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponKillTypeRearTorsoThirdPersonActive')].\n\nAdrenaline làm dịu phần nào cơn đau, nhưng không hoàn toàn, và Ta gào thét khi bị đá ngửa để đón cú đánh chí mạng không thể tránh khỏi."
  single_combat.0031.desc.sc_attacker.like_a_viper.fatality:0 "vòm cung của [sc_victor.GetFirstNamePossessiveNoTooltip] [sc_victor.Custom('signature_weapon')], cắt ngang ngực Ta từ bên, [sc_victor.Custom('SignatureWeaponKillTypeTorsoPresentParticiple')] chỉ với một cú [sc_victor.Custom('SignatureWeaponAttemptedHeavy')].\n\nBị hất đi bởi phản công và quán tính của chính mình, Ta lao vào [sc_defender.Custom('GroundType')]. Tay vẫn còn vận động, nhưng đã cảm thấy... quá yếu. Quá nặng. Ta chỉ có thể lật người, máu đỏ dính từ ngực tràn ra."
  single_combat.0031.desc.sc_attacker.pocket_silver.fatality:0 "[sc_victor.GetFirstNameNoTooltip] di chuyển nhanh, đẩy Ta xuống đất trước khi Ta kịp hiểu chuyện gì. Một khoảnh khắc kinh hoàng sau, [sc_victor.GetSheHe] [sc_victor.Custom('SignatureWeaponKillTypeGroinThirdPersonActive')], [sc_victor.Custom('SignatureWeaponKillTypeGroinThirdPersonActive_Aftermath')].\n\nTa la hét lúc đầu, nhưng phổi không còn hoạt động như mong đợi, và sớm thôi, tất cả những gì Ta làm chỉ là #EMP chịu đựng#!"
  single_combat.0031.desc.sc_attacker.martial_voice.fatality:0 "tiến lên và hoàn toàn bình tĩnh [sc_victor.Custom('SignatureWeaponWoundVerb4ThirdPersonPresent')] cổ họng ta chỉ bằng một động tác nhanh chóng.\n\nCái kết gần như... đáng thất vọng. Không có động tác phô trương, không có tiếng hét, không có dấu hiệu của một thế lực siêu nhiên nào đến đón ta.\n\nChỉ có nỗi đau lan rộng, tiếng thở khò khè ướt át của chính ta, và đôi [my_foe.Custom('EyeEyes')] lạnh lùng vô cảm của [sc_victor.GetFirstNamePossessiveNoTooltip] nhìn ta chết."
  single_combat.0031.desc.sc_attacker.mocking_boast.fatality:0 "tung ra một chiêu giả mạo tinh vi, quay lưng đối diện [sc_victor.GetFirstNameNoTooltip] khi Ta cố chắn sai hướng.\n\nChưa đầy một giây sau, [sc_victor.Custom('signature_weapon')] của đối thủ [sc_victor.Custom('SignatureWeaponKillTypeRearTorsoThirdPersonActive')] với một cú [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]. Ta gục xuống, uốn sai hướng qua chân, cơn đau lan tỏa qua những phần thịt và xương còn kết nối với dây thần kinh tan nát."
  single_combat.0031.desc.sc_attacker.is_that_a_crocodile.fatality:0 "Một cú lao cơ hội từ [sc_victor.GetFirstNameNoTooltip] xuyên thủng phòng thủ Ta, cho phép [sc_victor.GetHerHim] [sc_victor.Custom('SignatureWeaponWoundVerb3')] nửa thân trên của Ta với một cú [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] cực mạnh.\n\nTa gục ngửa ra sau, thịt nát và máu văng tung khi vũ khí rút ra khỏi người Ta. Cái gì. Ta không. Không thể. Cứu Ta.\n\n#EMP Cứu Ta.#!"
  single_combat.0031.desc.sc_attacker.desert_warrior.fatality:0 "Chỉ khi ta dừng lại để lau một giọt mồ hôi khỏi đôi [sc_loser.Custom('EyeEyes')] của #EMP chính ta#!, mọi chuyện mới bắt đầu trở nên tồi tệ: [sc_victor.GetFirstNameNoTooltip] chọn đúng #EMP khoảnh khắc đó#! để đánh ta bằng một [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]. Ta bị hạ gục trước khi kịp đứng vững, và đòn tiếp theo [sc_victor.Custom('SignatureWeaponWoundVerb5ThirdPersonPresent')] một cách hỗn loạn vào cổ ta.\n\nTa ú ớ qua cổ họng đã bị phá hủy, thổi ra những bong bóng máu lẫn nước bọt khi cố nói điều gì đó, bất cứ điều gì. Dù đang ở giữa cái nóng bỏng, ta lại cảm thấy lạnh lẽo đến tận xương."
  single_combat.0031.desc.sc_attacker.jungle_stalker.fatality:0 "Cái nhìn thoáng qua ấy chính là sai lầm chí mạng của ta. [sc_victor.GetFirstNameNoTooltip] vui sướng chớp lấy cơ hội, và khi ta vừa nhìn lại chỉ một tích tắc sau, đã có [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')]-[sc_victor.Custom('SignatureWeaponTipType')] chuẩn bị [sc_victor.Custom('SignatureWeaponWoundVerb1')] vào bụng ta.\n\nTa hét lên vì đau đớn, nhưng đã quá muộn. Ngay cả khi vết thương đầu tiên chưa đủ lấy mạng ta, [sc_victor.GetFirstNameNoTooltip] dường như sẽ tung ra một đòn chính xác hơn với cú đánh tiếp theo."
  single_combat.0031.desc.sc_attacker.open_terrain_expert.fatality:0 "Tiếp đất mềm, nhưng chân [sc_victor.GetFirstNamePossessiveNoTooltip] vào háng Ta thì không, và Ta vẫn choáng trong khoảnh khắc quan trọng. Chỉ cần vậy để [sc_victor.Custom('SignatureWeaponKillTypeTorsoFirstPersonFuture')] với [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')].\n\nMáu tim Ta bơm dồn dập ra khỏi ngực, chảy dọc sườn, đọng trên [sc_defender.Custom('GroundType')] xung quanh.\n\nÍt ra Ta chết nơi có thể nhìn thấy bầu trời rộng mở."
  single_combat.0031.desc.sc_attacker.rough_terrain_expert.fatality.rocky:0 "Cuối cùng, điều này chứng tỏ là kết thúc của Ta. Một cú đẩy quá nhiều khiến Ta rơi khỏi một vách nhỏ, tiếp đất nặng nề trên một chân và nghiền nát nó hoàn toàn.\n\nKhi [sc_victor.GetFirstNameNoTooltip] trèo xuống để gặp Ta, Ta gần như bất tỉnh vì đau. Không còn sức chiến đấu. Đối thủ giơ [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')]: ít nhất nỗi đau của Ta sẽ kết thúc nhanh chóng."
  single_combat.0031.desc.sc_attacker.rough_terrain_expert.fatality.boggy:0 "Chỉ với nỗ lực tuyệt vọng nhất, Ta mới thoát ra, nhưng may mắn ngắn ngủi. Khi Ta lảo đảo ra khỏi một vũng nước, Ta rơi vào vũng khác, úp mặt xuống. Một thứ gì đó từ trên [sc_victor.Custom('SignatureWeaponKillTypeRearTorsoThirdPersonActive')].\n\nTa không thể cử động. Ta không thể vùng vẫy. Ta cố hét, nhưng nước xanh tràn vào phổi, và Ta trượt sâu hơn vào hố đầm lầy."
  single_combat.0031.desc.sc_attacker.forest_fighter.fatality:0 "tung ra một loạt [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')].\n\nTa không biết chính xác cú nào chạm động mạch ở đâu, nhưng chẳng mấy chốc Ta chậm lại, ngập trong máu từ vai đến cổ tay. Không chút nghi thức, Ta ngã ngửa ra sau. Ta quá mệt. Ta không thể tiếp tục... Ta không thể tiếp tục..."
  single_combat.0031.desc.sc_attacker.raaargh.fatality:0 "[sc_victor.GetFirstNameNoTooltip] đứng gần Ta một cách đáng báo động.\n\nTa cố cử tay ra với [sc_victor.GetHerHim], chỉ nhận ra mình đã rơi [sc_loser.Custom('signature_weapon')], nhưng... không. Tất cả máu từ đâu ra? Miếng thịt đó là của Ta sao? Tại sao Ta cảm thấy... tê liệt?\n\nÔi."
  single_combat.0031.desc.sc_attacker.hard_grit.fatality:0 "Phải mất một lúc trước khi một trong hai mắc sai lầm mà đối phương có thể lợi dụng, nhưng cuối cùng cũng xảy ra. Ta quá dốc vào một [sc_loser.Custom('SignatureWeaponAttemptedLight')], và trước khi Ta kịp né, có [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')] cắm vào bụng Ta.\n\nVậy đó."
  single_combat.0031.desc.sc_attacker.feint_and_stab.fatality:0 "khiến Ta mất tập trung đủ lâu để không nhận ra cú [sc_victor.Custom('SignatureWeaponAttemptedLight')] tiếp theo trước khi nó [sc_victor.Custom('SignatureWeaponKillTypeTorso2PresentParticiple')].\n\nTa loạng choạng, rồi ngã ngửa vào [sc_defender.Custom('GroundType')], co giật, cố hét nhưng chỉ ra được tiếng khàn khàn. Làm sao sống sót qua nỗi đau #EMP này#!?\n\nKhông ai có thể."
  single_combat.0031.desc.sc_attacker.butchery.fatality:0 "bước vào phòng thủ Ta và [sc_victor.Custom('SignatureWeaponKillTypeHead2FirstPersonFuture')].\n\nTa loạng choạng về phía trước, lặng thinh, nghẹt thở với chính máu mình, thậm chí buông [sc_loser.Custom('signature_weapon')] để cố bịt vết thương phun máu lên [sc_defender.Custom('GroundType')].\n\nĐây- đây là thế sao? Quá... quá nhiều lần..."
  single_combat.0031.desc.sc_attacker.stoic_veteran.fatality:0 "Phải nhiều phản đòn thành công trước khi Ta cuối cùng gục ngã, máu rỉ ra từ nửa tá vết cắt và vết rách trên thân mình. Nếu không có gì khác, không ai có thể nói Ta xuống dễ dàng, nhưng mọi [sc_loser.GetWomanMan] đều có giới hạn của [sc_victor.GetHerHis].\n\nTa gục đầu gối, chờ cú đánh chí mạng của [sc_victor.GetFirstNamePossessiveNoTooltip]. Hình như Ta đã chạm giới hạn."
  single_combat.0031.desc.sc_attacker.blade_dance.fatality:0 "Thằng khờ kiêu ngạo này nghĩ [sc_victor.GetSheHe] đang làm gì, Ta-\n\nTa có [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')] cắm trong ngực. Sao lại. Ở đâu. Nhưng Ta... Ta là một nghệ sĩ."
  single_combat.0031.desc.sc_attacker.wrath_of_highgod.fatality:0 "đập mạnh vào [sc_loser.Custom('MaskFace')] của ta bằng [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')]'s [sc_victor.Custom('SignatureWeaponEndType')].\n\nTa loạng choạng lùi lại, gầm gừ trong cơn thịnh nộ mù quáng trước sự báng bổ đó, nhưng cơn giận của ta cũng lập tức bị cắt ngang khi [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('SignatureWeaponWoundVerb5ThirdPersonPresent')] vũ khí của [sc_victor.GetHerHis] vào phổi ta. Ta sặc sụa, nghẹn ngào, chỉ barely có thể phát ra âm thanh khi máu bắt đầu tràn đầy khoang ngực."
  single_combat.0031.desc.sc_attacker.hurt_me_better.fatality:0 "Dù ai đi nữa, bất kỳ [sc_loser.GetWomanMan] nào cũng chỉ có thể mất máu đến mức nhất định, và Ta dường như đã mất quá nhiều.\n\n[sc_victor.GetFirstNameNoTooltip] chuẩn bị [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] để [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')]."
  single_combat.0031.desc.sc_attacker.special_fallback.fatality:0 "Với việc tiếp cận lưng Ta không bị cản trở, [sc_victor.GetFirstNameNoTooltip] dễ dàng [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] với một loạt [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')].\n\nTa ngã vào [sc_defender.Custom('GroundType')], nằm nghiêng, khò khè qua xương gãy và nội tạng rách. Quá nhiều đau đớn. Quá nhiều đau đớn. Dần dần lạnh đi, tê liệt đi, mờ dần..."
