  knight_wounded_by_enemy_enemy:2 "$knight_culture_player_no_tooltip_lowercase$ của ta, [TARGET_CHARACTER.GetShortUINameNoTooltip], đã làm bị thương [CHARACTER.GetShortUINameNoTooltip]!"
  knight_maimed_no_enemy_friendly:2 "$knight_culture_player_no_tooltip_lowercase$ của ta, [CHARACTER.GetShortUINameNoTooltip], đã bị tàn phế bởi một binh sĩ địch!"
  knight_maimed_no_enemy_enemy:2 "Một trong những binh sĩ dũng cảm của chúng ta đã thành công khiến [CHARACTER.Custom('KnightCultureNoTooltipLowercase')] địch [CHARACTER.GetShortUINameNoTooltip] bị tàn phế!"
  knight_maimed_by_enemy_friendly:2 "$knight_culture_player_no_tooltip_lowercase$ của ta, [CHARACTER.GetShortUINameNoTooltip], đã bị [TARGET_CHARACTER.GetShortUINameNoTooltip] làm tàn phế!"
  knight_maimed_by_enemy_enemy:2 "$knight_culture_player_no_tooltip_lowercase$ của ta, [TARGET_CHARACTER.GetShortUINameNoTooltip], đã làm tàn phế [CHARACTER.GetShortUINameNoTooltip]!"
  knight_killed_no_enemy_friendly:2 "$knight_culture_player_no_tooltip_lowercase$ của ta, [CHARACTER.GetShortUINameNoTooltip], đã bị một binh sĩ địch giết chết!"
  knight_killed_no_enemy_enemy:2 "Một trong những binh sĩ dũng cảm của chúng ta đã thành công chém giết [CHARACTER.Custom('KnightCultureNoTooltipLowercase')] địch [CHARACTER.GetShortUINameNoTooltip]!"
  knight_killed_by_enemy_friendly:2 "$knight_culture_player_no_tooltip_lowercase$ của ta, [CHARACTER.GetShortUINameNoTooltip], đã bị [TARGET_CHARACTER.GetShortUINameNoTooltip] giết chết!"
  knight_killed_by_enemy_enemy:2 "$knight_culture_player_no_tooltip_lowercase$ của ta, [TARGET_CHARACTER.GetShortUINameNoTooltip], đã giết chết [CHARACTER.GetShortUINameNoTooltip]!"
 
