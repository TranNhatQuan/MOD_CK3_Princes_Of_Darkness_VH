 # Knight wounded/slain event strings for use in battle events. 
  knight_wounded_no_enemy_friendly:2 "$knight_culture_player_no_tooltip_lowercase$ của ta, [CHARACTER.GetShortUINameNoTooltip], đã bị một binh sĩ địch làm bị thương!"
  knight_wounded_no_enemy_enemy:2 "Một trong những binh sĩ dũng cảm của chúng ta đã thành công gây thương tích cho [CHARACTER.Custom('KnightCultureNoTooltipLowercase')] địch [CHARACTER.GetShortUINameNoTooltip]!"
