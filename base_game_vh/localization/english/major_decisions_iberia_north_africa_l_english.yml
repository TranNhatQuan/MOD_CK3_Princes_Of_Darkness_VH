l_english:
 
  iberia_north_africa.0005.t:0 "Một Tây Ban Nha Thống Nhất"
  iberia_north_africa.0005.desc:0 "Một lần nữa, các ngai vàng Tây Ban Nha đã được thống nhất dưới một [ROOT.Char.GetTitleAsNameNoTooltip]. Các vị quân vương giả đã bị truất ngôi, trong khi [ROOT.Char.GetPrimaryTitle.GetNameNoTier] hùng mạnh hơn bao giờ hết.\n\nMột ngày nào đó Ta sẽ rời khỏi thế giới này và đi đến [ROOT.Char.GetFaith.DivineRealm], nhưng di sản của Ta sẽ còn tồn tại mãi trên Trái Đất. Người ta sẽ gọi Ta là '[ROOT.Char.GetTitledFirstNameNoTooltip] — [ROOT.Char.GetMotherFather|U] của Tây Ban Nha.'"
  iberia_north_africa.0005.a:1 "Đây là bình minh của một kỷ nguyên mới."

  iberia_north_africa.0006.start.desc:0 "Từng vương quốc Tây Ban Nha một đã rơi dưới sự cai trị của [spain_uniter.GetPrimaryTitle.GetNameNoTier]."
  iberia_north_africa.0006.relation_former.desc:0 "Người [ROOT.Char.Custom2('RelationToMe', spain_uniter)] của Ta [spain_uniter.GetTitledFirstName]"
  iberia_north_africa.0006.former.desc:0 "[spain_uniter.GetTitledFirstName]"
  iberia_north_africa.0006.end.desc:0 "đã tuyên bố [spain_uniter.GetHerselfHimself] là 'the [spain_uniter.GetMotherFather|U] của Tây Ban Nha.'\n\nTên tuổi [spain_uniter.GetHerHis|U] chắc chắn sẽ sống mãi qua nhiều thế kỷ, nhưng liệu [spain_uniter.GetSheHe] sẽ được nhớ đến như một anh hùng hay một bạo chúa? Chỉ [ROOT.Char.GetFaith.FateGodName] mới biết."

  iberia_north_africa.0010.t:0 "Một Châu Phi"
  iberia_north_africa.0010.start.desc:0 "Không ai nghĩ điều đó có thể thực hiện, nhưng đây Ta đứng, [ROOT.Char.GetTitleAsNameNoTooltip] trên toàn bộ Châu Phi."
  iberia_north_africa.0010.vassals.desc:0 "Từ bờ Đại Tây Dương đến Đại Dương Phương Đông, mọi bộ tộc, [vassal_1.GetTitleAsNameNoTooltip], và [vassal_2.GetTitleAsNameNoTooltip] giờ đều cúi đầu trước Ta."
  iberia_north_africa.0010.spirits.desc:0 "\n\nCác [africa_uniter.Custom('DefaultPriestTitlePlural')] nói rằng các thần linh hài lòng. Cuối cùng, đất đai của chúng ta đã được giải phóng! Vẫn còn công việc phải làm, nhưng hôm nay, chúng ta sẽ ăn mừng!"
  iberia_north_africa.0010.ancestors.desc:0 "\n\nCác [africa_uniter.Custom('DefaultPriestTitlePlural')] nói rằng Tổ Tiên hài lòng. Cuối cùng, đất đai của chúng ta đã được giải phóng! Vẫn còn công việc phải làm, nhưng hôm nay, chúng ta sẽ ăn mừng!"
  iberia_north_africa.0010.generic.desc:0 "\n\nCác thần dân của Ta đến từ muôn ngả, nhưng Ta sẽ đoàn kết chúng ta và mở ra một con đường mới. Từ hôm nay, chúng ta là một dân tộc dưới [ROOT.Char.GetFaith.HighGodName]."
  iberia_north_africa.0010.a:0 "Vinh quang cho Châu Phi!"

  iberia_north_africa.0011.start.desc:0 "Tất cả các dân tộc Châu Phi, từ bộ tộc nhỏ nhất đến quân vương lớn nhất, giờ đều dưới sự cai trị của [africa_uniter.GetPrimaryTitle.GetNameNoTier]."
  iberia_north_africa.0011.relation_former.desc:0 "Người [ROOT.Char.Custom2('RelationToMe', africa_uniter)] của Ta [africa_uniter.GetTitledFirstName]"
  iberia_north_africa.0011.former.desc:0 "[africa_uniter.GetTitledFirstName]"
  iberia_north_africa.0011.end.desc:0 "đã thống nhất tất cả dưới lá cờ [africa_uniter.GetFaith.GetAdjective].\n\nLiệu một [africa_uniter.GetPrimaryTitle.GetTierAsNameNoTooltip] rộng lớn như vậy có thể đứng vững trước thử thách thời gian, hay liên minh này cuối cùng sẽ tan rã? Chỉ [ROOT.Char.GetFaith.FateGodName] mới biết."
  decision_unite_africa_confirm:0 "Thống Nhất Châu Phi"
  iberia_north_africa.0015.t:0 "Báo Thù Cho Các Tử Đạo"
  iberia_north_africa.0015.part1.desc:0 "Hàng nghìn và hàng nghìn tín đồ Hồi giáo dũng cảm đã ngã xuống trên đường tới Tours, trên Con Đường của các Tử Đạo. Họ chiến đấu vì một tương lai tốt đẹp hơn, một thời đại vàng mới cho các tín đồ chân chính. Ngày nay, tương lai đó cuối cùng đã đến."
  iberia_north_africa.0015.part2.desc:0 "\n\nVới một bàn đạp vững chắc ở châu Âu, cuộc chinh phục vinh quang của Ta mới chỉ bắt đầu..."
  iberia_north_africa.0015.a:0 "Allahu akbar."

  iberia_north_africa.0016.t:0 "Âm Vang Từ Quá Khứ"
  iberia_north_africa.0016.relation_former.desc:0 "\n\nNgười [ROOT.Char.Custom2('RelationToMe', avenger)] của Ta [avenger.GetTitledFirstName]"
  iberia_north_africa.0016.former.desc:0 "\n\n[avenger.GetTitledFirstName]"
  iberia_north_africa.0015.islam.desc:0 "đã dẫn dắt đội quân của [avenger.GetHerHis] tiến vào trung tâm vương quốc Frank cũ và nghiền nát mọi sự chống đối. Với chỗ đứng vững chắc của [avenger.GetHerHis] tại Châu Âu, tương lai của Hồi giáo trông xán lạn hơn bao giờ hết."
  iberia_north_africa.0016.christianity.a:0 "Xin Chúa thương xót linh hồn chúng ta."
  iberia_north_africa.0016.generic.desc:0 "Nhiều năm trước, trên đường tới Tours, lực lượng Frank Kitô đã chấm dứt cuộc xâm lược của Umayyad vào châu Âu. Charles Martel và binh sĩ của ông đã thay đổi lịch sử.\n\nNhưng không gì tồn tại mãi mãi. [avenger.GetName] đã dẫn quân sâu vào vương quốc Frank xưa và chiếm làm của riêng [avenger.GetHerHis]. Với bàn đạp vững chắc ở châu Âu, chỉ [ROOT.Char.GetFaith.FateGodName] mới biết [avenger.GetTitledFirstNameNoTooltip] sẽ làm gì tiếp theo..."

  iberia_north_africa.0001.t:0 "Vương Quốc Bồ Đào Nha"
  iberia_north_africa.0001.start.desc:0 "Ngày này sẽ được ghi nhớ mãi mãi là bình minh của Vương Quốc Bồ Đào Nha vĩ đại."
  iberia_north_africa.0001.christian.desc:0 "Nhân dân chúng ta đã chịu đựng sự cai trị của Hồi giáo trong nhiều thế kỷ, nhưng giờ thì không nữa. Cuối cùng, qua cuộc chinh phục vinh quang nhân danh [ROOT.Char.GetFaith.WarGodName], chúng ta là một quốc gia [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] tự do!\n\n"
  iberia_north_africa.0001.muslim.desc:0 "Nhờ sức mạnh của [ROOT.Char.GetFaith.WarGodName], chúng ta đã chinh phục những vùng đất này và giờ có thể tự hào gọi bờ biển phía Tây bán đảo Iberia là quê hương. Mong rằng [ROOT.Char.GetFaith.GetAdjective] sẽ thịnh vượng ở đây nhiều năm tới!\n\n"
  iberia_north_africa.0001.end.desc:0 "Qua hàng thiên niên kỷ, nhiều nền văn minh đã cai trị vùng đất này. Họ đều đóng góp vào mạng lưới phức tạp mà là di sản văn hóa của chúng ta. Ngày nay chúng ta có bản sắc riêng, và khi Ta thành lập vương quốc mới, chúng ta tự hào gọi mình là người Bồ Đào Nha!"
  iberia_north_africa.0001.a:0 "Giờ là thời của chúng ta!"
  iberia_north_africa.0002.start.desc:0 "Một kỷ nguyên mới đã đến với bán đảo Iberia!"
  iberia_north_africa.0002.relation_former.desc:0 "Người [ROOT.Char.Custom2('RelationToMe', portugal_former)] của Ta [portugal_former.GetTitledFirstName]"
  iberia_north_africa.0002.former.desc:0 "[portugal_former.GetTitledFirstName]"
  iberia_north_africa.0002.end.desc:0 "đã thành lập Vương Quốc Bồ Đào Nha trên bờ biển phía Tây. Sau nhiều thế kỷ di cư và chiến tranh, một dân tộc Bồ Đào Nha tự hào đã xuất hiện, với [portugal_former.GetTitledFirstNameNoTooltip] là lãnh tụ.\n\nLiệu quốc gia trẻ này sẽ vươn tới vinh quang hay lại bị nuốt chửng trong một cuộc chinh phục khác? Chỉ thời gian sẽ trả lời."
  iberia_north_africa.0002.a1:0 "Vinh quang cho [ROOT.Char.GetFaith.WarGodName]!"
  name_alas:0 "Than ôi."
  name_i_see:0 "Ta hiểu rồi."
  iberia_north_africa.0002.b:0 "Chúc [ROOT.Char.GetFaith.WarGodName] ban phước cho Bồ Đào Nha!"
  iberia_north_africa.0002.c:0 "Ta vẫn là [ROOT.Char.GetCulture.GetNameNoTooltip], bất kể người khác nghĩ gì."
 
  iberia_north_africa.9101.t:0 "Vương Quốc Canarias"
  iberia_north_africa.9101.desc.intro:0 "Từ thời xa xưa, từng hòn đảo tự xưng là 'vương quốc', nhưng giờ, với tất cả các hòn đảo dưới sự cai trị cần mẫn của [canarias_former.GetTitledFirstName], đã đến lúc thống nhất các vương miện thành một.\n\n"
  iberia_north_africa.9101.desc.iberian:1 "Với chiến thắng cuối cùng trước các Vua Guanche ngoại đạo, ít gì ngăn cản việc lan truyền [canarias_former.GetFaith.GetName] giữa cư dân các đảo và củng cố quyền cai trị của [canarias_former.GetTitledFirstNamePossessiveNoTooltip]. [title_k_canarias.GetNameNoTierNoTooltip] giờ đã được tuyên bố là một [title_k_canarias.GetTierAsNameNoTooltip], với [canarias_former.GetName] là [canarias_former.GetTitleAsNameNoTooltip] đầu tiên!"
  iberia_north_africa.9101.desc.guanche:1 "Với chân trời mở ra trước mắt, chúng ta thấy sự trỗi dậy của các Vương Quốc hùng mạnh hơn bất kỳ vương quốc nào của chúng ta, và nếu muốn chống lại kẻ xâm lược, chúng ta phải tạo ra vận mệnh và vương miện riêng. Với [canarias_former.GetName] đăng quang là [canarias_former.GetTitleAsNameNoTooltip] đầu tiên của [title_k_canarias.GetNameNoTierNoTooltip], cư dân các đảo cuối cùng có một biểu tượng thống nhất và mục tiêu chung để bảo vệ lối sống của chúng ta."
  iberia_north_africa.9101.desc.outro:0 "\n\nTương lai vẫn còn chưa chắc chắn cho [title_k_canarias.GetNameNoTierNoTooltip], nhưng việc tuyên bố một [title_k_canarias.GetTierAsNameNoTooltip] mới chắc chắn sẽ mở ra một kỷ nguyên mới cho các hòn đảo, và tương lai Bắc Phi."
  iberia_north_africa.9101.a:0 "Một Vương Quốc mới ra đời!"
  iberia_north_africa.9101.b:0 "Tương lai của [title_k_canarias.GetNameNoTierNoTooltip] nằm ở Iberia!"
 
  iberia_north_africa.0101.t:0 "Lòng trung thành với ngai vàng Thánh Peter"
  iberia_north_africa.0101.desc:0 "Đây không phải là việc nhỏ, nhưng gia đình Ta đã tập hợp đủ vùng đất [religious_leader.GetFaith.GetAdjective] và quyền lực tinh thần để triệu tập hội đồng các giáo sĩ cao nhất. Cuối cùng, máu, mồ hôi và công sức của chúng Ta đã được đền đáp trọn vẹn.\n\nCác [religious_leader.GetFaith.PriestNeuterPlural] tập trung tại [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier] tranh luận sôi nổi về chính sách, tràn ngập hành lang cung điện Ta với hàng chục đề xuất và đôi khi dẫn tới đánh nhau vì thần học. Chúng Ta biết muốn trung thành với Rome và [pope.GetTitledFirstName], nhưng đồng ý ít hơn nhiều ngoài điều đó.\n\nSau nhiều tuần bế tắc, trách nhiệm rơi lên Ta, với tư cách chủ nhà và [religious_leader.GetTitleAsNameNoTooltip] của họ, để trọng tài."
  iberia_north_africa.0101.a:0 "Một dân tộc, một đức tin!"
  iberia_north_africa.0101.a.tt:0 "Ngài ủng hộ con đường $doctrine_pluralism_righteous_name$ hơn"
  iberia_north_africa.0101.b:0 "Chúng ta #EMP cannot#! sợ hãi để nắm quyền nhằm bảo vệ chính mình."
  iberia_north_africa.0101.b.tt:0 "Ngài ủng hộ con đường $doctrine_pluralism_fundamentalist_name$ hơn"
  iberia_north_africa.0101.c:0 "Sách [religious_leader.GetFaith.ReligiousText] vẫn cần được giải thích..."
  iberia_north_africa.0101.c.tt:0 "Ngài ủng hộ con đường $doctrine_pluralism_pluralistic_name$ hơn"

  iberia_north_africa.0102.t:0 "[religious_leader.GetFaith.GetAdjectiveNoTooltip] $iberia_north_africa.0101.t$"
  iberia_north_africa.0102.desc.intro:0 "Sau cả đời tích lũy quyền lực tôn giáo và chính trị, [religious_leader.GetTitledFirstName] đã tập hợp được một đại hội lớn các bộ trưởng [religious_leader.GetFaith.GetAdjective] tại thủ đô [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier] của [religious_leader.GetHerHis] để bàn về tương lai của đức tin.\n\nSau nhiều tuần tranh luận nảy lửa, các giáo sĩ tập hợp đã quyết định khẳng định lòng trung thành với [pope.GetTitledFirstName], mặc dù có một số... #EMP tweaks#! đối với chính sách giáo hội.\n\nNhững cải thiện này tập trung chủ yếu vào"
  iberia_north_africa.0102.desc.fundamentalist:0 "những sai lầm được cho là gây hại cho tín đồ, và cách duy nhất để ngăn chặn điều này là thiết lập quyền lực thế tục bằng mọi phương tiện có thể."
  iberia_north_africa.0102.desc.righteous:0 "nhìn vào bên trong, đảm bảo sự đồng nhất tôn giáo giữa các nền văn hóa lớn theo Giáo hội."
  iberia_north_africa.0102.desc.pluralist:0 "thiết lập các nghi lễ và phương pháp nghiêm ngặt để nghiên cứu [religious_leader.GetFaith.ReligiousText], cùng các phương pháp chính thức để thách thức sự hiểu biết về chúng."
  iberia_north_africa.0102.a.same_faith:0 "Chúng ta phải tự bảo vệ mình!"
  iberia_north_africa.0102.a.same_religion:0 "Họ coi #EMP chúng ta#! là mối đe dọa sao?"
  iberia_north_africa.0102.a.misc:0 "Những fan cuồng đáng lo quá!"
  iberia_north_africa.0102.b.same_faith:0 "Một đức tin cho chính chúng ta!"
  iberia_north_africa.0102.b.same_religion:0 "Thật ích kỷ..."
  iberia_north_africa.0102.b.misc:0 "Miễn là họ giữ riêng cho mình."
  iberia_north_africa.0102.c.same_faith:0 "Nghiên cứu nghiêm túc [religious_leader.GetFaith.ReligiousText] mang lại lợi ích cho tất cả."
  iberia_north_africa.0102.c.same_religion:0 "Vô ích quá; học quá nhiều khi bản thân đã sai..."
  iberia_north_africa.0102.c.misc:0 "Giải pháp của họ với lệch giáo lý là soi mói giáo lý sao?"

  iberia_north_africa.0111.t:0 "Giải phóng khỏi xiềng xích của Roma"
  iberia_north_africa.0111.desc:0 "Phải mất nhiều năm để xây dựng sự thống nhất chính trị và tinh thần để tập hợp đại hội này, nhưng cuối cùng Ta đã tập hợp đủ cả dân thường lẫn giáo sĩ dưới lá cờ của mình để bác bỏ [pope.GetTitledFirstName] giả mạo.\n\nNgay cả bây giờ, các hành lang và phòng khách tại [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier] vẫn chật kín các giáo sĩ tranh luận và các giám mục đầy nhiệt huyết; mọi tu sĩ và [religious_leader.GetFaith.PriestNeuter] nhỏ mà Roma từng coi thường đều làm tắc nghẽn các sảnh của Ta.\n\nTất cả cuộc tranh luận này rất quan trọng cho tính hợp pháp, nhưng cuối cùng, với tư cách là vị lãnh đạo [religious_leader.GetFaith.GetAdjective] hàng đầu, #EMP lời Ta#! sẽ là quyết định cuối cùng."
  iberia_north_africa.0111.a:0 "Con Thiên Chúa dạy hòa bình, và chúng ta sẽ tuân theo."
  iberia_north_africa.0111.a.tt:0 "$iberia_north_africa.0101.a.tt$"
  iberia_north_africa.0111.b:0 "Dù không có Roma, chúng ta vẫn biết giá trị của việc bảo vệ chính mình!"
  iberia_north_africa.0111.b.tt:0 "$iberia_north_africa.0101.b.tt$"
  iberia_north_africa.0111.c:0 "Hồi giáo chẳng phải cũng là tôn giáo của Sách sao?"
  iberia_north_africa.0111.c.tt:0 "$iberia_north_africa.0101.c.tt$"
  mozarabic_break_with_rome_decision.tt.you_gain_a_hof:0 "Một [head_of_faith|E] cùng [faith|E] mới được tạo cho [religious_leader.GetFaith.GetName]"
  mozarabic_break_with_rome_decision.tt.new_hof_id:0 "[new_religious_head.GetTitledFirstName] là [head_of_faith|E] mới của Ngài"

  iberia_north_africa.0112.t:0 "Các Phân chia Giáo hội [religious_leader.GetFaith.GetAdjectiveNoTooltip] khỏi [pope.GetFaith.GetNameNoTooltip]"
  iberia_north_africa.0112.desc.intro:0 "Bằng một nỗ lực vĩ đại, [religious_leader.GetTitledFirstName] cuối cùng đã hoàn thành tâm nguyện cả đời của [religious_leader.GetHerHis] là tích lũy đủ uy quyền chính trị và tinh thần để tập hợp Giáo hội [religious_leader.GetFaith.GetAdjective] lại nhằm theo đuổi một mục tiêu: đoạn tuyệt với những chiếu chỉ của [pope.GetTitledFirstName].\n\nHội đồng giáo hội đi kèm đã nổ ra những cuộc thảo luận gay gắt về cách lấp đầy khoảng trống mà La Mã để lại, với một số giáo sĩ được báo cáo là đã ẩu đả công khai ngay trong các sảnh đường của [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier].\n\nSự can thiệp của [religious_leader.GetTitledFirstNamePossessiveNoTooltip] là điều duy nhất phá vỡ sự bế tắc, chọn cách tập trung vào"
  iberia_north_africa.0112.desc.fundamentalist:0 "nắm lấy vai trò bảo vệ các hành hương tới các thánh địa [religious_leader.GetFaith.GetAdjectiveNoTooltip] bằng vũ lực."
  iberia_north_africa.0112.desc.righteous:0 "Điều chỉnh lại những gì [religious_leader.GetSheHe] coi là bạo lực tội lỗi đã lan tràn trong phần lớn [religious_leader.GetFaith.GetReligion.GetName].\n\nTheo [religious_leader.GetHerHim], [religious_leader.GetFaith.GetAdherentNamePluralNoTooltip] nên tập trung vào sự sùng kính qua việc sống một cuộc sống tốt thay vì trải con đường tới [religious_leader.GetFaith.PositiveAfterLife] bằng máu của kẻ ngoại đạo."
  iberia_north_africa.0112.desc.pluralist:0 "Nới lỏng các hạn chế và cấm đoán ngăn cản việc dễ dàng hòa hợp với hàng xóm Hồi giáo, ủng hộ cách tiếp cận liên tôn giáo."
  iberia_north_africa.0112.a.same_faith:0 "Bởi [religious_leader.GetFaith.HighGodName] và quyền của chúng ta!"
  iberia_north_africa.0112.a.same_religion:0 "Họ tốt nhất không nên khóa #EMP các#! thánh địa của chúng ta."
  iberia_north_africa.0112.a.misc:0 "Có vẻ họ đang chấp nhặt từng chi tiết..."
  iberia_north_africa.0112.b.same_faith:0 "Sức mạnh qua hòa bình!"
 # ^Kane lives in Death!
  iberia_north_africa.0112.b.same_religion:0 "Ta đoán họ nghĩ họ hơn chúng ta..."
  iberia_north_africa.0112.b.misc:0 "Tự hỏi xem #EMP điều đó#! sẽ ra sao với họ..."
  iberia_north_africa.0112.c.same_faith:0 "Chúng ta chia sẻ nhiều hơn những gì không chung."
  iberia_north_africa.0112.c.same_religion:0 "Đáng quan ngại..."
  iberia_north_africa.0112.c.islam:0 "Hy vọng đây là bước đầu tiên tới việc chuyển đổi thật sự..."
  iberia_north_africa.0112.c.misc:0 "Vậy họ là tín ngưỡng lai sao?"

  iberia_north_africa.0121.t:0 "Trở về miền quê"
  iberia_north_africa.0121.desc.intro:0 "Không có gì bí mật rằng Ta đã từng... gặp vấn đề với đức tin [old_faith.GetAdjective] của mình."
  iberia_north_africa.0121.desc.excommunicated:0 "Bị khai trừ thật khó khăn, làm kiệt quệ linh hồn Ta và gây ra vô số mâu thuẫn với những [old_faith.GetAdherentNamePluralNoTooltip] khác trong đời Ta."
  iberia_north_africa.0121.desc.rivalry_with_hof:0 "Những cuộc tranh cãi liên tục với [old_faith.GetReligiousHead.GetTitledFirstName], một cuộc tranh chấp nhỏ nhặt về thế tục mà [old_faith.GetReligiousHead.GetSheHe] #EMP nên#! vượt qua, đã khiến Ta thất vọng."
  iberia_north_africa.0121.desc.negative_piety_level:0 "Hành động của Ta đã đánh dấu Ta là kẻ tội lỗi, một đức tin dường như để mặc Ta rơi vào lối đi tinh thần, và không thể phủ nhận sự cô lập."
  iberia_north_africa.0121.desc.lorgar:0 "Dù ngọn lửa niềm tin Ta cháy rực như Mặt Trời, Ta không thể loại bỏ cảm giác rằng phải có điều gì đó #EMP hơn#! trong vũ trụ ngoài [old_faith.HighGodName]. Một chân lý nguyên thủy hơn."
  iberia_north_africa.0121.desc.sinful_traits:0 "Dường như mọi hành động, suy nghĩ, cách sống của Ta đều bị đánh dấu là tội lỗi vốn có."
  iberia_north_africa.0121.desc.virtuous_basque_pagan_traits:0 "Đôi khi Ta tự hỏi sao mình từng yêu thích nó, khi cả tính cách Ta dường như #EMP được xây dựng#! cho điều gì đó khác."
  iberia_north_africa.0121.desc.naked_cynicism:0 "Ta thấy nó nhàm chán, và tệ hơn, hoàn toàn bị những quyền lực mà Ta hầu như không kiểm soát chi phối."
  iberia_north_africa.0121.desc.outro:0 "\n\nCuối cùng, Ta nghĩ mình đã tìm thấy sự an ủi với [basque_faith.GetName]. Các tín đồ đồng hóa nông thôn của giáo phái nhỏ này không xét đoán Ta, chỉ háo hức mong trở thành nhiều hơn những người giữ truyền thuyết địa phương.\n\nSự háo hức đó có lẽ khiến họ mở lòng với... gợi ý."
  iberia_north_africa.0121.a:0 "[basque_faith.GetNameNoTooltip] sẽ là đức tin của chiến binh một lần nữa!"
  iberia_north_africa.0121.a.tt:0 "Ngài ủng hộ con đường $doctrine_pluralism_fundamentalist_name$ hơn"
  iberia_north_africa.0121.b:0 "Hài hòa với thiên nhiên tốt hơn là hài hòa với hàng xóm."
  iberia_north_africa.0121.b.tt:0 "Ngài ủng hộ con đường $doctrine_pluralism_righteous_name$ hơn"
  iberia_north_africa.0121.c:0 "Có nhiều tôn giáo xứng đáng hơn để chia sẻ truyền thống."
  iberia_north_africa.0121.c.tt:0 "Ngài ủng hộ con đường $doctrine_pluralism_pluralistic_name$ khác"
  iberia_north_africa.0121.d:0 "Nếu Ta cố gắng ép thay đổi, liệu Ta có ít tham nhũng hơn [old_faith.GetNameNoTooltip] không?"
  iberia_north_africa.0121.d.tt:0 "Ngài để nguyên đức tin như Ngài tìm thấy"

  iberia_north_africa.0122.t:0 "$iberia_north_africa.0121.t$"
  iberia_north_africa.0122.desc.intro:0 "Dường như [religious_leader.GetTitledFirstNamePossessive]"
  iberia_north_africa.0122.desc.excommunicated:0 "việc bị khai trừ khỏi [old_faith.GetName] cuối cùng đã trở nên quá mệt mỏi đối với [religious_leader.GetHerHim]."
  iberia_north_africa.0122.desc.rivalry_with_hof:0 "sự tranh chấp với [old_faith.GetReligiousHead.GetTitledFirstName] cuối cùng đã đạt đến điểm sôi không thể tránh khỏi."
  iberia_north_africa.0122.desc.negative_piety_level:0 "những lỗi lầm trước đây chống lại [old_faith.GetName] sẽ bị lu mờ bởi [religious_leader.GetHerHis] lần tới."
  iberia_north_africa.0122.desc.lorgar:0 "ham muốn thứ gì đó... #EMP nguyên thủy#! để tin tưởng đã trở nên quá mạnh, dẫn [religious_leader.GetHerHim] đi vào con đường dị giáo."
  iberia_north_africa.0122.desc.sinful_traits:0 "Những cách sống tội lỗi cuối cùng đã hoàn toàn thắng thế trước đức tin [old_faith.GetAdjective] của [religious_leader.GetHerHis]."
  iberia_north_africa.0122.desc.virtuous_basque_pagan_traits:0 "Sự quyến rũ chậm rãi bởi những đức tính của đời sống nông thôn cuối cùng cũng hoàn tất."
  iberia_north_africa.0122.desc.naked_cynicism:0 "Ham muốn lộ liễu kiểm soát nhiều hơn đời sống tinh thần của [religious_leader.GetHerHis] lãnh thổ hoàn toàn vượt khỏi tầm kiểm soát."
  iberia_north_africa.0122.desc.midtro:0 "\n\nTrong một cơn điên rồ chắc chắn, [religious_leader.GetTitleAsNameNoTooltip|U] đã nâng một tín ngưỡng dân gian đồng hóa mơ hồ từ Pyrenees, [basque_faith.GetName], lên làm tôn giáo chủ đạo mới của [religious_leader.GetPrimaryTitle.GetNameNoTier].\n\n"
  iberia_north_africa.0122.desc.fundamentalist:0 "Dù ban đầu vốn ôn hòa, [religious_leader.GetTitledFirstNameNoTooltip] đã kích động giáo phái non trẻ này rơi vào một sự cuồng loạn tột độ, hứa hẹn với họ thù lao của chiến binh thông qua cướp bóc và vơ vét nếu họ ủng hộ chiến dịch bảo thủ của [religious_leader.GetHerHis]."
  iberia_north_africa.0122.desc.righteous:0 "Nhằm tách giáo phái nhỏ ra khỏi mối quan hệ gần gũi với Kitô giáo, [religious_leader.GetTitledFirstNameNoTooltip] đang thúc đẩy trở về những phần mà [religious_leader.GetSheHe] coi là còn rõ ràng mang tính ngoại giáo trong các huyền thoại của nó."
  iberia_north_africa.0122.desc.pluralist:0 "Dẫu cho giáo phái này đã trải qua nhiều thế kỷ tiếp thu các yếu tố của Cơ Đốc giáo, [religious_leader.GetTitledFirstNameNoTooltip] đang dùng sức ảnh hưởng to lớn của [religious_leader.GetHerHis] để đưa vào những yếu tố cạnh tranh của Hồi giáo, xóa bỏ, thay thế, và cập nhật những nghi lễ của người Nazarene ở những nơi mà [religious_leader.GetSheHe] có thể."
  iberia_north_africa.0122.desc.unchanged:0 "Về cơ bản vẫn giữ nguyên từ sự mờ nhạt mặc dù được chú ý thần học mới, giáo phái kết hợp giữa giáo lý Kitô giáo được chấp nhận và thần thoại truyền thống Vasconian."
  iberia_north_africa.0122.a:0 "Nghe này, Ta nghĩ [religious_leader.GetSheHe] có lý..."
  iberia_north_africa.0122.b.same_faith:0 "Đây là dị giáo khủng khiếp!"
  iberia_north_africa.0122.b.same_religion:0 "Điều này chỉ có thể kết thúc bằng sự hủy diệt của họ."
  iberia_north_africa.0122.b.respects_fellow_warmongers:0 "Ít nhất họ không sợ một trận chiến hay ho."
  iberia_north_africa.0122.b.misc:0 "Miễn là họ chiến đấu ở xa."
  iberia_north_africa.0122.c.same_faith:0 "[religious_leader.GetFirstNameNoTooltip] từ bỏ [old_faith.HighGodName] vì một khu rừng mục nát sao?!"
  iberia_north_africa.0122.c.same_religion:0 "[religious_leader.GetFirstNameNoTooltip] có nghĩ [religious_leader.GetSheHe] #EMP hơn#! chúng ta sao?"
  iberia_north_africa.0122.c.believes_in_harmony_with_nature:0 "Ít nhất họ hiểu sự kỳ diệu của thiên nhiên."
  iberia_north_africa.0122.c.misc:0 "Vậy họ đang nói thay cho cây cối sao?"
  iberia_north_africa.0122.d.muslim:0 "Ít nhất [basque_faith.GetAdherentNamePluralNoTooltip] lại gần với [islam_religion.GetNameNoTooltip]."
  iberia_north_africa.0122.d.same_faith:0 "Họ đã bỏ rơi chúng ta hai lần rồi!"
  iberia_north_africa.0122.d.same_religion:0 "Thật quá đáng!"
  iberia_north_africa.0122.d.syncretised_with_islam:0 "Ít nhất họ chưa hoàn toàn đánh mất lý trí."
  iberia_north_africa.0122.d.misc:0 "Eh, không phải lễ hội của Ta, không phải gấu nhảy của Ta."
  iberia_north_africa.0122.e.same_faith:0 "Vậy #EMP đây#! là thước đo của sự khoan dung."
  iberia_north_africa.0122.e.same_religion:0 "Đáng quan ngại..."
  iberia_north_africa.0122.e.syncretised_with_christianity:0 "$iberia_north_africa.0122.d.syncretised_with_islam$"
  iberia_north_africa.0122.e.misc:0 "Thật ra, đây là một thay đổi khá bình thường."

  iberia_north_africa.0131.t:0 "Con cháu Ebro"
  iberia_north_africa.0131.desc.intro:0 "Với việc tạo ra [k_aragon.GetDefinitiveName], Ta đã kích hoạt sự mở rộng thịnh vượng của văn hóa [aragonese_culture.GetName] trong các thị trấn và thành phố của lãnh thổ Ta. Không chỉ ở vùng trung tâm $d_aragon$, mà còn"
  iberia_north_africa.0131.desc.duchy.one:0 "[duchy_a.GetBaseNameNoTier]"
  iberia_north_africa.0131.desc.duchy.two:1 "[duchy_a.GetBaseNameNoTier] và [duchy_b.GetBaseNameNoTier]"
  iberia_north_africa.0131.desc.duchy.three:0 "[duchy_a.GetBaseNameNoTier], [duchy_b.GetBaseNameNoTier], và [duchy_c.GetBaseNameNoTier]"
  iberia_north_africa.0131.desc.outro:0 "cũng, lan tỏa ảnh hưởng của dân tộc mới của Ta rộng khắp.\n\nVà tuy vậy... Ta không thể không nhớ một số phong tục của [founder_culture.GetName]. Thời gian nó đứng ở trung tâm đời Ta có thể đã qua, nhưng với ảnh hưởng và vị trí của Ta, nó không cần biến mất hoàn toàn."
 # We can't use a script value here since we're using a while loop for the count, and they don't _currently_ support scripted values.
  form_the_kingdom_of_aragon_decision.tt.x_random_counties_in_d_aragon:0 "3 [counties|E] ngẫu nhiên trong $d_aragon$:"
  iberia_north_africa.0131.a:0 "Những người này là dân của Ta, và vậy là đủ."
  iberia_north_africa.0131.b:0 "Không phải tất cả trang trí văn hóa [founder_culture.GetNameNoTooltip] đều tệ..."
  iberia_north_africa.0131.c:0 "Những gì thực sự quan trọng đối với chúng ta không thay đổi."
  iberia_north_africa.0131.d:0 "Dù thế giới xoay ra sao, chúng ta không thể quên cội rễ của mình!"

  iberia_north_africa.2105.t:0 "Các Lãnh chúa Địa Trung Hải"
  iberia_north_africa.2105.desc:0 "Với việc chiếm được [mallorca.GetNameNoTier], [sardinas.GetNameNoTier] và [sicily.GetNameNoTier], chúng Ta tự tuyên bố là những người cai trị chính nghĩa của Biển Địa Trung Hải. Các sứ thần đã ra đi khắp mọi miền để thông báo thành tựu vinh quang này tới các lãnh chúa nhỏ hơn.\n\nBiển này, và mọi thứ nó chạm tới đều thuộc về chúng Ta!"
  iberia_north_africa.2105.a:0 "Không ai có thể chống lại chúng ta!"
 
  iberia_north_africa.fp2_golden_age_generic_title_intro:0 "Thời đại Vàng của Khoa học:"
  iberia_north_africa.2001.t:0 "$iberia_north_africa.fp2_golden_age_generic_title_intro$ Kiến thức bị mất"
  iberia_north_africa.2001.desc:0 "Một dịch giả nổi tiếng, [generated_actor.GetFullName], đã tới triều đình Ta sau khi nghe tin Ta bảo trợ khoa học. 'Nếu Ngài tìm kiếm kiến thức, điều tốt nhất có thể tìm thấy trong các sách cổ. Dù bị quên lãng, chúng vẫn không kém phần chân thực.' dịch giả nói.\n\n'Ta có nhiều sách chưa được dịch, nếu Ngài bảo trợ Ta, chắc chắn Ngài cũng sẽ hưởng lợi!'"
  iberia_north_africa.2001.a:0 "Ta sẽ không tiếc chi phí cho"
  iberia_north_africa.2001.a.learning:0 "triết học"
  iberia_north_africa.2001.a.martial:0 "quân sự"
  iberia_north_africa.2001.a.stewardship:0 "kinh tế"
  iberia_north_africa.2001.a.diplointrigue:0 "hùng biện"
  iberia_north_africa.2001.a.end:0 "xuất bản."
  iberia_north_africa.2001.a.a:0 "Ngài yêu cầu một cuốn sách giúp cải thiện kỹ năng thấp nhất của mình."
  iberia_north_africa.2001.b:0 "Ngài có sự bảo trợ của Ta, mang tới thứ gì đó hữu ích."
  iberia_north_africa.2001.b.a:0 "[generated_actor.GetFirstNameNoTooltip] sẽ đưa Ngài một cuốn sách cải thiện [skill|E] ngẫu nhiên."
  iberia_north_africa.2001.c:0 "Tại sao Ta lại muốn sách cổ? Lịch sử không có chỗ trong khoa học!"
  iberia_north_africa.2002.t:0 "$iberia_north_africa.fp2_golden_age_generic_title_intro$ Phẫu thuật gia mộng mơ"
  iberia_north_africa.2002.desc:0 ""Bệ hạ, xin hãy khiến kẻ ngốc này nghe lời! Vị phẫu thuật gia này đã mổ đục thủy tinh thể mắt phải của Ta nhưng giờ từ chối chữa mắt trái!" [patientzero.GetTitledFirstName] kêu lên. "Ca mổ chỉ thành công vì sự kết hợp của các vì sao hoàn hảo. Ngài #italic phải#! đợi thêm mười hai năm nữa để đảm bảo ca mổ tiếp theo thành công!" bác sĩ bực bội, [generated_actor.GetFirstName], trả lời.\n\nVới tư cách là người cai trị, nhiệm vụ của Ta là giải quyết những việc như thế này. Liệu Ta có nên can thiệp vào chiêm tinh học và mạo hiểm một ca mổ hỏng?"
  iberia_north_africa.2002.a:0 "Đây là cơ hội tuyệt vời để [child_offering.GetFirstNameNoTooltip] học y!"
  iberia_north_africa.2002.a.flavor:0 "Ngài đưa con của mình, [child_offering.GetFirstName], làm trợ lý giúp trong ca mổ đục thủy tinh thể bằng phương pháp hút của [patientzero.GetFirstName]."
  iberia_north_africa.2002.a.a:0 "[child_offering.GetFirstName] hỗ trợ ca mổ"
  iberia_north_africa.2002.a.b:0 "Kết quả Ca Mổ Đục Thủy Tinh Thể"
  iberia_north_africa.2002.b:0 "Các vì sao không ảnh hưởng đến khả năng của ngươi, hãy tiến hành ca mổ!"
  iberia_north_africa.2002.b.a:0 "Ngài yêu cầu ca mổ tiến hành, mặc kệ rủi ro."
  iberia_north_africa.2002.c:0 "Thật vậy, có lẽ tốt nhất là chờ điều kiện thuận lợi."
  iberia_north_africa.2002.d:0 "#italic Thực ra#!, nếu nhìn theo #italic cách này#! các vì sao đều vừa vặn!"
  iberia_north_africa.2003.t:0 "$iberia_north_africa.fp2_golden_age_generic_title_intro$ Bản Ngã Đối Lập"
  iberia_north_africa.2003.desc:0 "Nhiều học giả đã qua lại [playerprovince.GetNameNoTooltip] kể từ khi nhận bảo trợ của Ta, nhưng hai người trong số họ nổi bật trong mắt Ta. Có lẽ vì họ đều là những cá nhân có trí tuệ uyên thâm, hoặc vì họ #italic không chịu im lặng#! và cứ tranh cãi về những khác biệt nhỏ trong niềm tin ngay giữa triều đình Ta. 'Ta #italic từ chối#! làm việc với kẻ ngốc như [generated_actor_r.GetFirstName]!' [generated_actor_k.GetFirstName] kêu lên trước khi [generated_actor_r.GetFirstName] đáp: 'Tốt với Ta, Ta sẽ không bao giờ làm việc với người cứng đầu như #italic ngươi#!'\n\n'[ROOT.Char.GetTitledFirstName], ngươi tin gì? Vai trò của triết gia là giải thích thế giới tự nhiên hay nằm dưới quyền của nhà tiên tri?'"
  iberia_north_africa.2003.a:0 "Thực ra, điều đó thuộc quyền #ber của ta#!. Giờ thì bắt tay vào làm."
  iberia_north_africa.2003.a.flavor:0 "Ngài xúc phạm cả hai học giả, khiến họ tập trung sự khinh miệt vào Ngài thay vì vào nhau."
  iberia_north_africa.2003.b:0 "Dĩ nhiên là các triết gia, những người thông thái như Aristutalis phải làm."
  iberia_north_africa.2003.c:0 "Ngươi làm sao tin triết gia nếu không thể tin Ezekiel?"
  iberia_north_africa.fp2_pilgrim_roads_generic_title_intro:0 "Con Đường Hành Hương:"
  iberia_north_africa.2011.t:0 "$iberia_north_africa.fp2_pilgrim_roads_generic_title_intro$ Chiến binh lang thang"
  iberia_north_africa.2011.desc:0 "Khi lang thang qua [chosen_location_for_pilgrim_roads.GetName], Ta gặp một cây lớn lặng lẽ dụ Ta nghỉ dưới bóng nó. Ta ngồi dưới bóng mát cùng một [generated_actor.GetWomanMan]. 'Ngươi là một người hành hương sao?' Ta hỏi."
  iberia_north_africa.2011.desc_merge_into:0 "Người đang nghỉ trả lời,"
  iberia_north_africa.2011.desc_soldier:0 "$iberia_north_africa.2011.desc_merge_into$ 'Ta chỉ là một chiến binh lạc đường tên là [generated_actor.GetName]. Ta tới thăm [chosen_holy_site_for_pilgrim_roads.GetNameNoTier] để tìm hiểu tại sao [generated_actor.GetFaith.HighGodName] bỏ rơi Ta và biết nơi Ta phải giương kiếm tiếp theo.'"
  iberia_north_africa.2011.desc_captain:0 "$iberia_north_africa.2011.desc_merge_into$ 'Có lẽ, Ta là. Nhưng Ta nhận ra mình là một linh hồn lạc lối. Tên Ta là [generated_actor.GetName], cựu đội trưởng một lệnh thánh, giờ là kẻ lang thang tìm [generated_actor.GetFaith.HighGodName] và một lý tưởng lớn hơn để phục vụ.'"
  iberia_north_africa.2011.a:0 "[generated_actor.GetFaith.HighGodName] muốn ngươi gia nhập hàng ngũ của ta, [generated_actor.GetFirstNameNoTooltip]."
  iberia_north_africa.2011.b:0 "Ta chắc chắn [generated_actor.GetFaith.HighGodName] muốn ngươi tiếp tục lang thang tìm kẻ thù."
  iberia_north_africa.2011.b.flavor:0 "Ngài khích lệ chiến binh tiếp tục chiến đấu cho [generated_actor.GetFaith.HighGodName], một mình, lan tỏa lời về bản tính tốt của Ngài."
  iberia_north_africa.2011.c:0 "Ngươi chắc chắn sẽ tìm thấy [generated_actor.GetFaith.HighGodName] khi kết thúc cuộc hành hương."
  iberia_north_africa.2011.c.flavor:0 "Ngài để chiến binh hoàn thành nghĩa vụ đối với [generated_actor.GetFaith.HighGodName] mà không bị gián đoạn."
  iberia_north_africa.2012.t:0 "$iberia_north_africa.fp2_pilgrim_roads_generic_title_intro$ Sinh viên nghèo"
  iberia_north_africa.2012.desc:0 "Lang thang trên những con đường mới xây ở [chosen_location_for_pilgrim_roads.GetName], Ta gặp một [generated_actor.GetWomanMan] trẻ tuổi ngồi trên một tảng đá đánh dấu, mặt u ám và túi rỗng trên tay. [generated_actor.GetWomanMan] quay sang Ta và hỏi, '[ROOT.Char.Custom2('RelationToMeAddress', generated_actor)], xin ngài có thể cho một đồng tiền cho sinh viên hành hương không?'"
  iberia_north_africa.2012.desc_student:0 "Ta là sinh viên thần học, muốn hiểu rõ hơn thế giới mà [generated_actor.GetFaith.HighGodName] ban tặng. Ta sẵn sàng trao cho ngài những ghi chép hành trình như một biểu hiện cảm ơn với tư cách đồng đạo [generated_actor.GetFaith.GetAdjective]!"
  iberia_north_africa.2012.desc_architect:0 "Ta học kiến trúc, đã đến đây để quan sát và học hỏi từ những công trình được giữ gìn tốt ở [chosen_holy_site_for_pilgrim_roads.GetNameNoTier]. Ta hoàn toàn tận tâm với nghề. Nếu ngài cho Ta chút tiền, Ta sẽ trao cho ngài kinh sách về kiến trúc!"
  iberia_north_africa.2012.a:0 "Ta có thể dùng kiến thức đó. Được thôi, Ta đồng ý trao đổi."
  iberia_north_africa.2012.b:0 "Có lẽ ngươi nên thử kiếm một công việc."
  iberia_north_africa.2012.b.flavor:0 "Ngài đề nghị sinh viên một công việc tốt tại triều đình, khiến họ bất ngờ."
  iberia_north_africa.2012.c:0 "Không mặc cả. Với tư cách là [ROOT.Char.GetFaith.GetAdherentNameNoTooltip], nhiệm vụ Ta là giúp ngươi."
  iberia_north_africa.2013.t:0 "Gửi đến [ROOT.Char.GetSheHe] người đã mở đường cho hành hương."
  iberia_north_africa.2013.desc:0 "Ngài đã làm công việc xuất sắc, đặt nền móng cần thiết để tiếp cận địa điểm linh thiêng [chosen_holy_site_for_pilgrim_roads.GetNameNoTierNoTooltip]. Vì điều đó, Ta phải thưởng cho ngài.\n\nHãy nói, ngài có mong muốn gì không?"
  iberia_north_africa.2013.a:0 "Chỉ lời khen đã đủ rồi, [fp2_iberia_north_africa_2013_head_of_faith.GetFaith.ReligiousHeadName] của Ta."
  iberia_north_africa.2013.b:0 "Lan tỏa danh tiếng về việc làm của Ta nhân danh [ROOT.Char.GetFaith.HighGodName]."
  iberia_north_africa.2013.c:0 "Hãy để mọi chiến binh biết về sự tận tâm của Ta đối với [ROOT.Char.GetFaith.GetNameNoTooltip]."
  iberia_north_africa.2013.d:0 "Tặng Ta một vật phẩm xứng đáng trưng bày tại [chosen_holy_site_for_pilgrim_roads.GetNameNoTierNoTooltip]."
  iberia_north_africa.2013.d.tooltip:0 "[fp2_iberia_north_africa_2013_head_of_faith.GetTitledFirstName] sẽ tặng Ngài một [artifact|E] được ban phước."
  iberia_north_africa.2013.notif.t:0 "Con đường đạo đức"
  struggle_iberia_form_portugal_decision_correct_phase_tt:0 "Giai đoạn [struggle_phase|E] hiện tại là [struggle_phase_iberia_opportunity|E]"

  iberia_north_africa.2100.t: "Phục hồi Vasconia Cổ"
  iberia_north_africa.2100.desc: "Trong nhiều thế kỷ, chúng Ta, người Basque, kiên cường chịu đựng nghịch cảnh với nghị lực và quyết tâm. Như được tạc từ đá Pyrenees cổ xưa, chúng Ta đứng vững trước vô số cuộc xâm lăng, chờ thời cơ thích hợp để phản công.\n\nNhững ngày u tối ấy đã qua, và cuối cùng chúng Ta đã thành công trong việc chiếm lại đất tổ tiên, nay là trung tâm của một Vương quốc [GetTitleByKey('k_navarra').GetNameNoTier] mới, tự do.\n\nSau khi trải qua những bài học khắc nghiệt nhất của lịch sử, Ta thề rằng chúng Ta sẽ không bao giờ để mình bị xua đuổi khỏi quê hương nữa."
  iberia_north_africa.2100.a: "Dưới sự lãnh đạo của Ta, chúng ta có thể đạt mọi điều!"
  iberia_north_africa.2100.b: "Chúng ta sẽ không bị khuất phục lần nữa!"
  iberia_north_africa.2101.desc: "Trong nhiều thế kỷ, người Basque bị dồn về Pyrenees, bị quấy rầy từ hai bên bởi các kẻ xâm lấn.\n\nGiờ đây, với phần lớn đất tổ tiên [founder.GetHerHis] được phục hồi, [founder.GetTitledFirstNameRegnal] đã tuyên bố [founder.GetHerselfHimself] là '[founder.Custom('QueenKing')] của [GetTitleByKey('k_navarra').GetNameNoTier]', chiếm lại các mảnh đất đã mất làm một phần của vương quốc Basque mới.\n\nCác dân tộc láng giềng  coi sự thay đổi vận may này chỉ là một sự lệch lạc trong lịch sử khu vực, và chắc chắn tìm cơ hội sớm nhất để sửa lại điều này..."
  iberia_north_africa.2101.b: "Họ nên ở lại núi!"
  iberia_north_africa.2101.c: "Một bất ngờ, chắc chắn rồi."
