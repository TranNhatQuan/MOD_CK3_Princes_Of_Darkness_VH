  game_rule.1141.t: "Hội Witengamot bầu: [elect.GetFirstNameNoTooltip] của [elect.GetHouse.GetNameNoTooltip]"
  game_rule.1141.intro.battlefield: "[winner.GetTitledFirstName] đã hy sinh trên chiến trường, tử trận khi chiến đấu với kẻ định chiếm ngôi [loser.GetTitledFirstNameNicknamed].\n\n"
  game_rule.1141.intro.home: "[winner.GetTitledFirstName] đã chết bất ngờ, qua đời vì đau tim khi nhận tin chiến thắng của [loser.GetTitledFirstNameNicknamedPossessive].\n\n"
  game_rule.1141.choice.margaret: "Bằng một phép màu khó hiểu nào đó, Witengamot đã đồng ý chọn #EMP ta#! làm ứng cử viên thỏa hiệp, gạt bỏ người thừa kế dự kiến [jiltee.GetFullNameNoTooltip]. Các đại bá tước rõ ràng tin rằng họ có thể kiểm soát ta, nghĩ rằng ta chỉ là con rối cho tham vọng của họ.\n\nTa không hề như vậy, nhưng ta hoan nghênh việc bất ngờ được đẩy vào quyền lực này — xét cho cùng, ta là con đầu lòng của cha ta."
  game_rule.1141.choice.edgar: "Trong một khoảnh khắc tỉnh táo hiếm thấy trong chính trị Anh nhiều năm qua, Witengamot đã thấy rõ rằng #EMP ta#! là người thừa kế hợp pháp của [GetScriptedCharacterByHistoryID( '114' ).GetTitledFirstNameNicknamedPossessive] và chỉ định ta cai trị vương quốc, gạt bỏ người thừa kế dự kiến [jiltee.GetFullNameNoTooltip].\n\nTa không thể nói mình đã làm gì để có được sự ưu ái của [ROOT.Char.GetFaith.FateGodNamePossessive], nhưng ta vô cùng vui mừng khi nhận được điều đó."
  game_rule.1141.choice.svend: "Chán nản với cái chết và sự hủy diệt do mọi kẻ đòi quyền lợi khác gây ra, Witengamot — một lần hiếm hoi đầy tỉnh táo — đã tìm đến #EMP ta#! như ứng cử viên tự nhiên nhất để mang lại trật tự, gạt bỏ người thừa kế dự kiến [jiltee.GetFullNameNoTooltip].\n\nMột lần nữa, Đan Mạch sẽ trở lại vị thế tự nhiên của mình là cai trị nước Anh."
  game_rule.1141.choice.aelfwine: "Bị một sự điên rồ huyền bí nào đó ám ảnh, Witengamot đã cầu xin #EMP ta#! hãy trở về và cai trị vương quốc của cha và ông nội ta, gạt bỏ người thừa kế dự kiến [jiltee.GetFullNameNoTooltip].\n\nTa... ta không có tham vọng về điều này. Ta không muốn nó. Ta đã cố gắng tránh xa quyền lực hết sức có thể, nhưng rõ ràng không thể thoát khỏi ý muốn của [elect.GetFaith.HighGodNamePossessive] rằng ta phải trở về vùng đất mà ta đã vui vẻ bỏ lại mãi mãi."
  game_rule.1141.choice.cadoc: "Cãi nhau như thường lệ, Hội Witengamot đưa ra quyết định kỳ lạ. Không muốn chịu thêm một vị vua ngoại quốc và nghi kỵ lẫn nhau, họ đã chọn #EMP Ta#! cai trị Anh, rõ ràng nghĩ Ta là con rối yếu họ có thể uốn nắn.\n\nCó lẽ họ đúng, có lẽ không, Ta chỉ có thể hoan nghênh cơ hội bất ngờ này để chứng minh bản thân!"
  game_rule.1141.a.margaret: "Nữ hoàng đầu tiên của Anh!"
  game_rule.1141.a.edgar: "Quyền sinh ra của Ta, đã trở lại!"
  game_rule.1141.a.svend: "Ta luôn biết mọi chuyện sẽ kết thúc như vậy."
  game_rule.1141.a.aelfwine: "Ta chưa bao giờ xin điều này!"
 # Geddit geddit GEDDIT d'you geddit
  game_rule.1141.a.cadoc: "Ngay cả năm trăm năm nữa, họ sẽ biết tên Ta!"

  game_rule.1142.t: "$game_rule.1141.t$"
  game_rule.1142.intro.battlefield: "[winner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã hy sinh trên chiến trường, tử trận khi chiến đấu với kẻ định chiếm ngôi [loser.GetTitledFirstNameNicknamed].\n\n"
  game_rule.1142.intro.home: "[winner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã chết bất ngờ, qua đời vì đau tim khi nhận tin chiến thắng của [loser.GetTitledFirstNameNicknamedPossessive].\n\n"
  game_rule.1142.choice.preamble: "Ngược với mọi dự đoán, thay mặt [winner.GetHerHis], Hội Witengamot đã chọn bầu [elect.GetFirstName] của [elect.GetHouse.GetName] —"
  game_rule.1142.choice.margaret: "Cháu gái và là con gái của người lữ hành [GetScriptedCharacterByHistoryID( '110' ).GetTitledFirstNameNicknamed] của [GetScriptedCharacterByHistoryID( '114' ).GetTitledFirstNameNicknamedPossessive]"
  game_rule.1142.choice.edgar: "Cháu trai, người thừa kế đã được chọn trước khi [winner.GetFirstNameNoTooltip] nắm quyền, và là con trai của người lữ hành [GetScriptedCharacterByHistoryID( '110' ).GetTitledFirstNameNicknamed] của [GetScriptedCharacterByHistoryID( '114' ).GetTitledFirstNameNicknamedPossessive]"
  game_rule.1142.choice.svend: "Cháu trai của [GetScriptedCharacterByHistoryID( '101505' ).GetTitledFirstNameNicknamedPossessive] và [elect.GetTitleAsNameNoTooltip] của [elect.GetPrimaryTitle.GetBaseNameNoTier], người đã bỏ qua giai đoạn đầu của xung đột"
  game_rule.1142.choice.aelfwine: "Cháu trai của [GetScriptedCharacterByHistoryID( '101510' ).GetTitledFirstNameNicknamed], đã tự nguyện sống lưu vong như một tu sĩ nghèo ở Occitania"
  game_rule.1142.choice.cadoc: "Một quý tộc Cornwall từ một dòng họ khó nói thành lời"
  game_rule.1142.outro: "— như người cai trị mới của vương quốc thay vì #EMP Ta#!.\n\nCó vẻ như Anh quốc đã trượt khỏi tay Ta ngay lập tức."
  game_rule.1142.a: "Thật quá đáng, ngai vàng là của Ta!"
  game_rule.1142.b: "Ý muốn của hội đồng là quyết định."
  game_rule.1142.c: "Gần như lên ngôi, nhưng lại quá xa…"

  rule_historicity_frankokratia: "Xác suất Frankokratia"
  setting_historicity_frankokratia_default: "Cân bằng"
  setting_historicity_frankokratia_default_desc: "Cuộc Thập tự chinh Chia rẽ, chuyển hướng người Công giáo sang tấn công Byzantine, có thể xảy ra ngay lập tức từ ngày bắt đầu 1178. Nếu sử dụng thời điểm bắt đầu sớm hơn, điều này chỉ có thể xảy ra #EMP sau#! [crusade|E] Công giáo đầu tiên."
  setting_historicity_frankokratia_blocked: "Không"
  setting_historicity_frankokratia_blocked_desc: "Người Công giáo sẽ không bị chuyển hướng để tấn công Đế chế Byzantine."
  setting_historicity_frankokratia_fourth_crusade: "Cuộc Thập tự chinh thứ tư"
  setting_historicity_frankokratia_fourth_crusade_desc: "Từ các thời điểm bắt đầu sớm hơn, phải có ít nhất 3 [crusade|E] Công giáo diễn ra trước cuộc Thập tự chinh Chia rẽ. Từ năm 1178, người Công giáo chỉ có thể tấn công Byzantine #EMP sau#! 1 [crusade|E]."

  setting_historicity_frankokratia_high: "Cao"
  setting_historicity_frankokratia_high_desc: "Bất kỳ [crusade|E] Công giáo nào cũng có thể trở thành một cuộc Thập tự chinh Chia rẽ, tách ra để phát động chiến tranh chống lại Byzantine."

