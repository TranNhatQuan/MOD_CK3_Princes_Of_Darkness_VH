  game_rule.1101.desc.combat.locale.stamford_bridge: "Suốt buổi sáng, quân ta tiến lui qua cầu, từng nhóm nhỏ vượt sông Derwent để chiến đấu với kẻ thù bên kia bờ từng giờ.\n\nThật là... tàn sát. Chỉ còn tiếng hét và chết chóc, xen lẫn âm thanh va đập của những cơ thể rơi xuống nước. Derwent chảy đỏ, và chắc chắn sẽ còn đỏ hàng dặm. Tay cầm gươm cao, Ta lao vào một đợt tấn công cuối cùng để phá thế bế tắc, vượt cầu cùng quân hộ vệ của Ta và —"
  game_rule.1101.desc.combat.locale.hastings: "Cả thế giới bùng cháy với tiếng va chạm kim loại trên gỗ, khi khiên vỡ vụn, tiếng ngựa hí vang, và nhịp đều #EMP thwip#! của hàng nghìn mũi tên vút lên trời.\n\nMọi thứ trở thành la hét, máu và tàn tích. Tiếng kêu của người bị thương và chết chóc, lời nguyền của kẻ trả thù, tiếng cười hả hê của kẻ chiến thắng khi họ thừa adrenaline xông vào trận.\n\nĐịnh mệnh cân bằng trên lưỡi dao, và với tiếng hô #EMP RALLY!#! Ta thúc quân tiến lên."
  game_rule.1101.desc.combat.locale.dover: "Gần bờ vực nguy hiểm, cả hai quân đội chỉ di chuyển để đẩy kẻ thù xuống vực — nhưng hiệu quả hạn chế.\n\nMùi máu ô nhiễm không khí, âm thanh trận chiến chắc chắn vang xa. Người quan sát không may có thể thấy thi thoảng một cơ thể rơi xuống vách đá phấn.\n\nĐiều này không thể tiếp tục, #EMP will#! không thể tiếp tục, nếu không chúng ta sẽ kiệt sức. Với tiếng hô, Ta thúc quân tiến lên, tới chiến thắng, tới —"
  game_rule.1101.desc.combat.locale.isle_of_wight: "Xa đất liền, không còn nơi trốn, cả hai quân đều chiến đấu như những kẻ sống chết. Nếu Ngài không bị đẩy vào dòng triều Medina, thì đảo không đủ lớn để trốn lâu.\n\nBằng cách nào đó, Ta bị tách khỏi binh sĩ, chỉ còn vài vệ binh chiến đấu bên cạnh Ta. Nếu Ta có thể lợi dụng điều này, nếu Ta có thể xoay chuyển trận chiến chỉ một chút —"
  game_rule.1101.desc.combat.locale.forest_of_dean: "Dưới những cây rừng hoang dã, trong bụi rậm và lùm cây của khu rừng cổ này, máu ngấm đất nhanh chóng, và tầm nhìn kém khiến không ai biết trận chiến diễn ra ra sao.\n\nRừng dường như hút âm thanh và sinh mạng, khiến trận chiến của ta có vẻ lạ lùng dịu hơn so với sự hỗn loạn và cái chết lan rộng. Nhưng Ta nghĩ, có lẽ, tình hình đang xoay chiều có lợi cho ta —"
  game_rule.1101.desc.combat.locale.london: "Dù các phòng thủ cố gắng từ trên tường để chi phối trận đấu, cả hai bên đều mài mòn nhau trong bế tắc liên tục.\n\nKhông khí đầy mùi máu, tiếng chết chóc và giết chóc bao trùm, mùi bụi và mồ hôi làm không thể biết ai thắng.\n\nNhưng Ta không thể bỏ rơi quân ta trong #EMP anarchy#!, và với tiếng hô, Ta lao vào kẻ thù lần nữa. Đây là thời của chúng ta, chúng ta sẽ thắng, chúng ta sẽ nghiền nát họ, chúng ta sẽ —"
  game_rule.1101.desc.combat.locale.cirencester: "$game_rule.1101.desc.combat.locale.london$"
  game_rule.1101.desc.combat.locale.guildford: "Ngọn đồi quanh co, không bên nào nắm đỉnh, tạo nên trận chiến ngoạn mục. Dài và hẹp, cả hai quân thúc đẩy để đẩy đối phương xuống sườn đối diện, nơi lợi thế cao độ chắc chắn dẫn đến chiến thắng.\n\nNhưng Ta biết #EMP quân ta#! sẽ thắng, #EMP lực lượng ta#! sẽ nếm chiến thắng! Tiến lên, #EMP tiến lên các con chó!#! Tiến lên! Chỉ còn một đẩy nữa là thắng, một đẩy nữa —"
  game_rule.1101.desc.combat.locale.lindisfarne: "Sóng biển xát mắt, gió Bắc lạnh xé vải và khiên, tiếng chết và thương vọng ra tu viện, các nhà sư gào khóc xé áo trước cảnh tàn sát.\n\nNếu Ta ngã đây, hãy để đó là ý [ROOT.Char.GetFaith.HighGodName], vì nếu không [ROOT.Char.GetFaith.HighGodNameSheHe|U] chắc chắn ủng hộ quyền của Ta với Anh! Tiến lên, quân ta, tiến lên và mang vương miện về cho Ta! Chiến đấu đến cùng, nếu không—"
  game_rule.1101.desc.combat.locale.lands_end: "Địa hình đá vụn và vách đá ngắn nhô ra biển đóng băng, khiến trận chiến cực kỳ hỗn loạn, nhiều nhóm nhỏ chạm trán hơn là toàn lực.\n\nDù vậy, cờ hiệu của Ta thu hút binh sĩ, và Ta nỗ lực dẫn đầu vào đám đông. Tập hợp quanh Ta! #EMP Rally#! Tiếng hô của Ta vang dọc hàng, vang và vang cho đến khi—"
  game_rule.1101.desc.combat.locale.stonehenge: "Về lý thuyết, thảo nguyên rộng phẳng này là nơi lý tưởng để chiến tranh. Không gian dư dả cho quân đụng độ, nhưng... có điều gì đó #EMP rùng rợn#! nơi này. Có gì đó không ổn.\n\nChúng Ta chiến đấu, chết chóc, la hét lên trời cao, nhưng có điều gì đó trong không khí hút đi cơn thịnh nộ của chúng Ta. Tuy nhiên, Ta không thể chậm lại, Ta phải dẫn dắt, Ta phải—"
  game_rule.1101.desc.combat.locale.southwark: "Với thành phố giàu nhất Anh gần đó, có tất cả để chiến đấu. Dù là nhà hay chiến lợi phẩm, vinh quang hay đức hạnh, cả hai quân va chạm liên tục.\n\nBờ Nam Thames sủi bọt máu chúng Ta, nhưng Ta không bỏ cuộc, Ta sẽ #EMP không#! nhượng bộ.\n\nAnh quốc đã thuộc về Ta, trận này sẽ chứng minh, và chỉ cần một #EMP đẩy#! cuối cùng để chứng minh—"
  game_rule.1101.desc.combat.locale.riverside: "Không gian hẹp cho nửa tá lính đứng ngang, trận chiến không phải là kỹ năng, mà là hao mòn tàn bạo, thân người vừa giúp vừa cản việc kéo thương binh khỏi tiền tuyến.\n\nNhưng nếu chúng Ta chỉ cần phá tuyến, chỉ cần tán loạn quân địch, chúng Ta sẽ thành công! Quăng cảnh giác, Ta chiến đến tuyến đầu, gươm sẵn và—"
  game_rule.1101.desc.combat.random.present.1: "Quân đội lao vào nhau, cả thế giới trở thành khiên vỡ vụn, kim loại rít, và người cùng ngựa chết.\n\nChiến tranh có thể tàn nhẫn, nhưng đây không phải chiến tranh, mà là tàn sát thuần túy. Lính kỳ cựu và lính đánh thuê cả hai bên giết lính mới không thương tiếc.\n\nKhông muốn cơn ác mộng tiếp tục, Ta xông lên, lính hộ vệ sát Ta, và—"
  game_rule.1101.desc.combat.random.present.2: "Hai lực lượng va chạm và xoay quanh nhau, cả hai tìm điểm yếu. Chúng Ta skirmish, rồi rút, chỉ để lao tiếp về nhau dọc tuyến.\n\nHiện tại thương vong nhẹ, nhưng bầu không khí nặng nề. Chúng Ta biết điệu nhảy này không thể kéo dài mãi, trận thật phải bắt đầu sớm.\n\nThà kiểm soát chiến trường còn hơn đầu hàng. Nâng gươm cao và gào lên [ROOT.Char.GetFaith.WarGodName], Ta lao lên, toàn bộ quân [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] phía sau và—"
  game_rule.1101.desc.combat.random.present.3: "Ánh sáng ngày đang tàn, giết nhau từng giờ. Tay gươm nặng mệt, trí mờ mệt mỏi, khi mặt trời lặn, trận chiến có nguy cơ bế tắc.\n\nKhông.\n\nTa sẽ không để điều đó xảy ra. Đây kết thúc, ngay lúc này, với chiến thắng của Ta, và Ta sẽ thực hiện hoặc xin [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself|U] đánh Ta #EMP d—#!"

  game_rule.1101.desc.combat.random.absent.1: "Hầu hết ngày, quân lao vào nhau. Trước hàng chục chết, rồi hàng trăm, số liệu tử thần tăng dần khi lính hy sinh cho lý tưởng của Ta.\n\nChắc chắn, chắc chắn sẽ xứng đáng. Chắc chắn số chết này phải có đền bù, phần thưởng cho những sinh mạng rơi vào [ROOT.Char.GetFaith.DeathDeityNamePossessive] lạnh lùng."
  game_rule.1101.desc.combat.random.absent.2: "Xung đột tàn khốc. Tiếng khiên vỡ và tiếng kêu của kẻ chết vang lên, mọi tổ chức mất dưới hỗn loạn của vài lần tấn công thất bại và tuyến trận rối rắm.\n\nQuân vẫn tiến, chiến đấu cho [ROOT.Char.GetTitleAsNameNoTooltip], đảm bảo quyền và đặc quyền của [ROOT.Char.GetHerHis] không bị chà đạp, dù phải đánh đổi mạng sống."
  game_rule.1101.desc.combat.random.absent.3: "Hàng trăm sinh mạng bị cắt, rơi như lúa trước lưỡi hái, bao nhiêu sợi sống bị cắt ngắn dưới ánh mắt khó chịu của sát thủ thuê làm việc đẫm máu.\n\nHy sinh của họ chắc chắn, #EMP chắc chắn#! xứng đáng, điều kiện cần cho vinh quang sắp tới của Ta. Mỗi người là một viên đá trên con đường định mệnh, đặt xuống vì mục tiêu duy nhất."

  game_rule.1101.desc.outro.present: "Suy nghĩ rời khỏi Ta khi thế giới trở thành mờ nhạt của chém giết, hộ vệ chật cứng quanh Ta khi chúng Ta nghiền nát quân [loser.GetTitledFirstNamePossessive]. Dưới lưỡi gươm Ta, kẻ thù tan rã."
  game_rule.1101.desc.outro.absent: "Cuối cùng, tuyến của kẻ thù vỡ, lực lượng [loser.GetHerHis] bị xua tan: ngày này thuộc về [winner.GetTitledFirstNameNicknamedNoTooltip]!"
  game_rule.1101.a: "Anh quốc sẽ không còn chịu sự cai trị của Viking!"
 
  game_rule.1102.desc.outro.alive: "Cuối cùng, tất cả vô ích. Quân Ta vỡ, kẻ thù tràn vào khoảng trống, và với sự hủy diệt đó, tham vọng Ta hoàn toàn bị nghiền nát."
  game_rule.1102.desc.outro.dead: "Đau dâng lên ngực. Không, không, #BER không#!, ai có thể... đâu rồi... thế giới chao đảo khi Ta ngã, máu tung từ vết thương. Chậm rãi, cái chết đến."
  game_rule.1102.a: "Làm sao chuyện này xảy ra!?"
  game_rule.1102.b: "Ta #DIE1 là...#! #DIE2 tan vỡ...#!"
 
  game_rule.1103.desc.outro.present: "$game_rule.1101.desc.outro.present$"
  game_rule.1103.desc.outro.absent: "$game_rule.1101.desc.outro.absent$"
  game_rule.1103.a: "Chiến thắng trước kẻ giả mạo sinh ra từ đứa con hoang!"
 
  game_rule.1104.desc.outro.alive: "$game_rule.1102.desc.outro.alive$"
  game_rule.1104.desc.outro.dead: "$game_rule.1102.desc.outro.dead$"
  game_rule.1104.a: "Nhưng — Confessor đã hứa với Ta Anh quốc!"
  game_rule.1104.b: "Mong quyền lực mang... #DIE1 ngươi...#! #DIE2 khổ đau...#!"
 
  game_rule.1111.desc.outro.present: "$game_rule.1101.desc.outro.present$"
  game_rule.1111.desc.outro.absent: "$game_rule.1101.desc.outro.absent$"
  game_rule.1111.a: "Thêm một chiến thắng cho các sử thi!"
 
  game_rule.1112.desc.outro.alive: "$game_rule.1102.desc.outro.alive$"
  game_rule.1112.desc.outro.dead: "$game_rule.1102.desc.outro.dead$"
  game_rule.1112.a: "Không, không, không, KHÔNG, #BER KHÔNG#!"
  game_rule.1112.b: "Đồ chết tiệt... #DIE1 ngươi...#! #DIE2 Tostig...#!"
 
  game_rule.1113.desc.outro.present: "$game_rule.1101.desc.outro.present$"
  game_rule.1113.desc.outro.absent: "$game_rule.1101.desc.outro.absent$"
  game_rule.1113.a: "[loser.GetSheHe|U] không phải là một [loser.Custom('GetDaughterSon')] thuần chủng của phương Bắc!"
 
  game_rule.1114.desc.outro.alive: "$game_rule.1102.desc.outro.alive$"
  game_rule.1114.desc.outro.dead: "$game_rule.1102.desc.outro.dead$"
  game_rule.1114.a: "[winner.GetSheHe|U] thậm chí không có quyền, chết tiệt!"
  game_rule.1114.b: "Nguyền rủa... #DIE1 ngươi#!... #DIE2 Harald...#!"
 
  game_rule.1121.desc.outro.present: "$game_rule.1101.desc.outro.present$"
  game_rule.1121.desc.outro.absent: "$game_rule.1101.desc.outro.absent$"
  game_rule.1121.a: "Thay vị ngươi, kẻ chiếm ngôi."
 
  game_rule.1122.desc.outro.alive: "$game_rule.1102.desc.outro.alive$"
  game_rule.1122.desc.outro.dead: "Một vật gì đó rít từ trời xuống, nhắm, dường như không thể tránh, thẳng vào mắt Ta."
  game_rule.1122.a: "Chết tiệt tên cắp đó!"
  game_rule.1122.b: "Mũi tên! Nâng khiên, loạt bắn tới! Loạt bắn t—"
 
  game_rule.1123.desc.outro.present: "$game_rule.1101.desc.outro.present$"
  game_rule.1123.desc.outro.absent: "$game_rule.1101.desc.outro.absent$"
  game_rule.1123.a: "Trở về lạnh lẽo đi, những con chó phương Bắc!"
 
  game_rule.1124.desc.outro.alive: "$game_rule.1102.desc.outro.alive$"
  game_rule.1124.desc.outro.dead: "$game_rule.1102.desc.outro.dead$"
  game_rule.1124.a: "Những giấc mơ của Ta chỉ còn tro tàn..."
  game_rule.1124.b: "Ha, #DIE1 mạo hiểm vĩ đại nhất#! #DIE2 đang chờ…#!"
 
  game_rule.1131.desc.conquest_finished.die_battlefield: "$game_rule.1102.desc.outro.dead$"
  game_rule.1131.desc.conquest_finished.die_home: "Khi tin tức đến rằng chúng Ta đã thắng trận, Ta cảm thấy hân hoan! Trái tim Ta nhảy múa vì vui sướng, xoắn vặn, #EMP co giật#!, #BER la hét!#!\n\nCái gì đang… xảy ra… với Ta… không thể… #DIE1 thở… không thể…#!"
  game_rule.1131.a: "$game_rule.1101.a$"
  game_rule.1131.b: "Ta đã… #DIE1 gần…#! #DIE2 đến mức…#!"
 
