  rule_gender_equality:0 "Bình Đẳng Giới Tính"
  setting_default_gender_equality:0 "Mặc Định"
  setting_default_gender_equality_desc:0 "Luật giới được quyết định bởi Luật Giới và Giáo Lý Tín Ngưỡng."
  setting_full_gender_equality:1 "#high Bình Đẳng#!"
  setting_full_gender_equality_desc:0 "Tất cả Giáo Lý và Luật liên quan đến giới tính được đặt bằng nhau. Quyền lợi và luật lệ áp dụng cho tất cả nhân vật, không phân biệt giới tính."
  setting_inversed_gender_equality:1 "#high Ngược Lại#!"
  setting_inversed_gender_equality_desc:0 "Tất cả Giáo Lý và Luật liên quan đến giới tính bị đảo ngược. Quyền lợi áp dụng cho nam theo 'Mặc Định' giờ sẽ áp dụng cho nữ, và ngược lại."
  setting_lenient_gender_equality: "#high Khoan Dung#!"
  setting_lenient_gender_equality_desc: "Luật Vương Quốc và Chức Vị vốn đặt chỉ cho Nam sẽ được chuyển thành Ưu Tiên Nam."

