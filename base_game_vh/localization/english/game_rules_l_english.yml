  rule_difficulty:0 "Độ Khó"
  setting_easy_difficulty:1 "#high Dễ#!"
  setting_easy_difficulty_desc:0 "Ngài sẽ nhận được các lợi thế, như giảm tác động của dịch bệnh, âm mưu thù địch và căng thẳng. Cũng sẽ dễ dàng hơn để quản lý các Phái."
  setting_very_easy_difficulty:1 "#high Rất Dễ#!"
  setting_very_easy_difficulty_desc:0 "Ngài sẽ nhận được lợi thế lớn, giảm tác động của dịch bệnh, âm mưu thù địch và căng thẳng. Quản lý Phái sẽ dễ dàng hơn rất nhiều."
  setting_hard_difficulty: "#high Khó#!"
  setting_hard_difficulty_desc: "Những nhân vật AI sẽ nhận được lợi thế, như giảm căng thẳng và vương quốc ổn định hơn. @alert_icon! #alert_trial Điều này sẽ làm các vương quốc AI ổn định và giàu có hơn, khiến trò chơi kém cân bằng.#!"
  setting_very_hard_difficulty: "#high Rất Khó#!"
  setting_very_hard_difficulty_desc: "Những nhân vật AI sẽ nhận lợi thế lớn, như giảm căng thẳng và vương quốc cực kỳ ổn định. @warning_icon! #X Điều này sẽ làm các vương quốc AI cực kỳ ổn định và giàu có, khiến trò chơi kém cân bằng.#!"
  setting_normal_difficulty:0 "Bình Thường"
  setting_normal_difficulty_desc:0 "Ngài sẽ chơi trên một sân chơi cân bằng, không có lợi thế đáng kể."
 
  rule_culture_conversion_speed:0 "Tốc Độ Chuyển Đổi Văn Hóa"
  setting_default_culture_conversion_speed:0 "Mặc Định"
  setting_default_culture_conversion_speed_desc:0 "Tốc độ chuyển đổi không thay đổi."
  setting_faster_culture_conversion_speed:1 "#high Nhanh Hơn#!"
  setting_faster_culture_conversion_speed_desc:0 "Tốc độ tăng lên, chuyển đổi mất khoảng một nửa thời gian."
  setting_significantly_faster_culture_conversion_speed:0 "#high Nhanh Hơn Rất Nhiều#!"
  setting_significantly_faster_culture_conversion_speed_desc:0 "Tốc độ tăng đáng kể, chuyển đổi mất khoảng một phần tư thời gian."
  setting_significantly_slower_culture_conversion_speed:1 "#high Chậm Hơn Rất Nhiều#!"
  setting_significantly_slower_culture_conversion_speed_desc:0 "Tốc độ giảm đáng kể, chuyển đổi mất khoảng gấp bốn lần thời gian."
  setting_slower_culture_conversion_speed:1 "#high Chậm Hơn#!"
  setting_slower_culture_conversion_speed_desc:0 "Tốc độ giảm, chuyển đổi mất khoảng gấp đôi thời gian."
 
