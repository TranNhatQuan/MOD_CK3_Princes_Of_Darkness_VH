  setting_title_creation_imperial_power_projection_hard_power_only_strict_desc: "Việc tạo ra một [empire|E] đòi hỏi nhiều hơn 50% quân số so với #BER mọi#! $game_concept_empire$-[title_tier|E] [realm|E] giáp ranh với một [character|E] hoặc chia sẻ bất kỳ [de_jure|E] nào với họ."
