 court_diplomatic:0 "Triều Đình Ngoại Giao"
 court_diplomatic_desc:1 "#low Ngoại giao là chìa khóa để giành được sự tôn trọng từ các đồng cấp và giữ gìn hòa bình cho lãnh địa. Một chư hầu hài lòng là một chư hầu trung thành. \n\nCận thần nhận được đặc tính [GetTrait('diplomatic_court_1').GetName( GetNullCharacter )].#!"
 court_diplomatic_tooltip_desc:0 "Trong $court_diplomatic$, trọng tâm được đặt vào các mối quan hệ và giải quyết xung đột một cách hòa bình."
 court_warlike:0 "Triều Đình Thượng Võ"
 court_warlike_desc:1 "#low Phô trương sức mạnh là cách duy nhất để tạo nên sự kính sợ và tôn trọng! Các hiệp sĩ và binh lính của chúng ta nổi danh về võ nghệ. \n\nCận thần nhận được đặc tính [GetTrait('warlike_court_1').GetName( GetNullCharacter )].#!"
 court_warlike_tooltip_desc:0 "Trong $court_warlike$, thể lực cường tráng và đầu óc chiến lược được đề cao."
 court_administrative:0 "Triều Đình Hành Chính"
 court_administrative_desc:1 "#low Chỉ một triều đình vận hành hiệu quả và được duy trì tốt mới có thể khiến lãnh địa hưng thịnh. \n\nCận thần nhận được đặc tính [GetTrait('administrative_court_1').GetName( GetNullCharacter )].#!"
 court_administrative_tooltip_desc:0 "$court_administrative$ là triều đình tập trung vào phát triển lãnh địa."
 court_intrigue:0 "Triều Đình Mưu Lược"
 court_intrigue_desc:1 "#low Để mặc những người trong triều không bị kiểm soát là điều nguy hiểm; chúng ta phải đảm bảo không ai có thể làm điều mờ ám mà ta không hay biết. \n\nCận thần nhận được đặc tính [GetTrait('intrigue_court_1').GetName( GetNullCharacter )].#!"
 court_intrigue_tooltip_desc:0 "Trong $court_intrigue$, Ngài phải luôn cảnh giác; một bí mật có thể nguy hiểm chẳng kém gì lưỡi dao trong đêm tối, và ở triều đình này cả hai đều đầy rẫy."
 court_scholarly:0 "Triều Đình Học Thuật"
 court_scholarly_desc:1 "#low Một triều đình là nơi thu hút những trí tuệ uyên bác và những người có kỹ năng xuất chúng. \n\nCận thần nhận được đặc tính [GetTrait('scholarly_court_1').GetName( GetNullCharacter )].#!"
 court_scholarly_tooltip_desc:0 "Tri thức và sự học tập chuyên cần được đề cao trong $court_scholarly$."
 court_tribal:0 "Triều Đình Bộ Lạc"
 court_tribal_desc:0 "#low Tại triều đình, kẻ mạnh làm chủ – và đại sảnh sẽ được trang hoàng bằng chiến lợi phẩm và của cải cướp được! \n\nCận thần nhận được đặc tính [GetTrait('warlike_court_1').GetName( GetNullCharacter )].#!"
 court_tribal_tooltip_desc:0 "Võ nghệ và sức chịu đựng được đề cao trong $court_tribal$."
 court_nomadic: "Triều Đình Du Mục"
 court_nomadic_desc: "#low Triều đình của ta phi nước đại cùng sức mạnh của ngàn vó ngựa, nơi cung tên và lưỡi đao ngự trị tối cao. Vinh quang đạt được qua chinh phạt, và dân ta hưng thịnh nhờ chiến lợi phẩm. \n\nCận thần nhận được đặc tính [GetTrait('warlike_court_1').GetName( GetNullCharacter )].#!"
 court_nomadic_tooltip_desc:0 "Võ nghệ và sức bền được đề cao trong $court_nomadic$."

