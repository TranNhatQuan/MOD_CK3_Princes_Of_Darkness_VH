  event_target_desc:0 "Một scope có thể được lưu lại dưới dạng một \"event target\". Sau đó, nó sẽ có thể được truy cập từ bất kỳ trigger/effect nào có thể được \"truy vết ngược\" theo một đường thẳng liên tục tới điểm mà Ngài đã lưu event target (tức là các trigger được kiểm tra hoặc các effect được kích hoạt sau khi event target được lưu, nhưng chỉ trong một chuỗi liên tục, ví dụ như một chuỗi sự kiện). Khi chuỗi sự kiện kết thúc, event target sẽ bị mất.\nLưu ý rằng một số on_action được thiết lập bằng code, cũng như một số tương tác đặc biệt, có sẵn các event target được định nghĩa trước.\nCuối cùng, Ngài cũng có thể lưu giá trị và biến bool dưới dạng event target, điều này có thể rất hữu ích trong một số tình huống."
  parameter_desc:0 "Di sản còn sót lại từ Stellaris. Nếu Ngài đang cân nhắc sử dụng cái này, thì gần như chắc chắn Ngài nên dùng scope được lưu dưới dạng biến thì hơn. (Hãy thay đổi mô tả này nếu vì lý do nào đó chúng ta bắt đầu dùng \"parameter\"!)"
  variable_desc:0 "Biến script có thể được truy cập và chỉnh sửa bằng script. Hiện tại chúng tồn tại dưới các dạng sau:\n\nvariable:example_number = 1\nvariable:example_flag = flag:example\nvariable:example_scope = root\nvariable:example_bool = yes"
  flag_desc:0 "Flag là các dấu hiệu đơn giản dùng để theo dõi rằng một điều gì đó đã xảy ra trong trò chơi. Chúng có kiểu riêng tuỳ theo scope mà chúng được đặt (flag nhân vật, flag âm mưu, sC., v.v.). Scope cụ thể (ví dụ một nhân vật nhất định) sẽ giữ flag đó cho đến khi nó bị xoá bởi một effect, hoặc cho đến khi bộ đếm thời gian của nó kết thúc, nếu flag đó có timer."
