l_english: 
  situation_steppe_abundant_grazing_season: "Mùa Đồng cỏ Dồi dào"
  situation_steppe_abundant_grazing_season_desc: "$situation_steppe_abundant_grazing_season$ là một mùa mà đồng cỏ ổn định và gia súc có thể chăn thả tự do."
  situation_steppe_severe_drought_season: "Hạn hán Nghiêm trọng"
  situation_steppe_severe_drought_season_desc: "Một $situation_steppe_severe_drought_season$ khiến đồng cỏ khô cằn và nguồn dự trữ thức ăn gia súc dần cạn kiệt.\n\n#weak Trong thời gian này, chiến tranh xảy ra thường xuyên hơn.#!"
  situation_steppe_white_zud_season: "Bạch Zud"
  situation_steppe_white_zud_season_desc: "Trong thời kỳ $situation_steppe_white_zud_season$, tuyết phủ kín các bãi chăn thả, bao trùm hoàn toàn chúng dưới một lớp tuyết dày có thể cao đến hàng mét. Gia súc không thể tiếp cận cỏ và vì thế chết đói.#weak $situation_steppe_zud_effect$#!"
  situation_steppe_zud_effect: "\n\nTrong một kỳ Zud, các dân du mục buộc phải thề trung thành với những người cai trị mạnh hơn để sinh tồn."
  situation_steppe_cold_zud_season: "Hàn Zud"
  situation_steppe_cold_zud_season_desc: "Một $situation_steppe_cold_zud_season$ mang theo những cơn gió mạnh và bão tuyết. Nhiệt độ cực thấp buộc gia súc phải dùng hầu hết năng lượng để giữ ấm, khiến chúng không thể chăn thả.#weak $situation_steppe_zud_effect$#!"
  situation_steppe_warm_nights_season: "Mùa Hè Vĩnh cửu"
  situation_steppe_warm_nights_season_desc: "Một $situation_steppe_warm_nights_season$ là thời kỳ của niềm vui và sự sung túc. Nhiệt độ hoàn hảo cho gia súc và điều kiện thuận lợi giúp cỏ tái sinh dễ dàng."
  situation_steppe_sky_blessing_season: "Ân phúc của Bầu trời Xanh"
  situation_steppe_sky_blessing_season_desc: "Một lần trong đời, người ta có thể may mắn chứng kiến $situation_steppe_sky_blessing_season$. Một thời kỳ mà sự khan hiếm là điều không tồn tại và đất đai phồn thịnh."
  situation_steppe_havsarsan_zud_season: "Havsarsan Zud"
  situation_steppe_havsarsan_zud_season_desc: "Một $situation_steppe_havsarsan_zud_season$ là sự kết hợp của hai hoặc nhiều loại zud. Cỏ bị bao phủ bởi băng và tuyết, bão tố tàn phá vùng đất, nhiệt độ đóng băng khiến động vật thậm chí không thể di chuyển và cỏ thì đã chết.\n\n#weak Trong một $situation_steppe_havsarsan_zud_season$, con đường duy nhất là rời đi.#!"
  the_great_steppe_situation_steppe_abundant_grazing_season_situation_phase: "$situation_steppe_abundant_grazing_season$"
  the_great_steppe_situation_steppe_severe_drought_season_situation_phase: "$situation_steppe_severe_drought_season$"
  the_great_steppe_situation_steppe_white_zud_season_situation_phase: "$situation_steppe_white_zud_season$"
  the_great_steppe_situation_steppe_cold_zud_season_situation_phase: "$situation_steppe_cold_zud_season$"
  the_great_steppe_situation_steppe_warm_nights_season_situation_phase: "$situation_steppe_warm_nights_season$"
  the_great_steppe_situation_steppe_sky_blessing_season_situation_phase: "$situation_steppe_sky_blessing_season$"
  the_great_steppe_situation_steppe_havsarsan_zud_season_situation_phase: "$situation_steppe_havsarsan_zud_season$"

