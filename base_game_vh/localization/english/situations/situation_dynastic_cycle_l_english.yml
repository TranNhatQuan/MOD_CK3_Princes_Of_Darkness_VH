  cycle_history_key_rise_of_the_qin: "Lãnh thổ của bảy nước Chiến Quốc cũ được thống nhất dưới triều Tần, triều đại đế quốc thực sự đầu tiên"
  cycle_history_key_collapse_of_the_qin: "Bị tàn phá bởi các cuộc nổi dậy nội bộ, triều Tần nhanh chóng sụp đổ thành mười tám vương quốc tranh chấp"
  cycle_history_key_rise_of_the_han: "Trật tự được khôi phục khi triều Hán chiến thắng các đối thủ và thống nhất thiên hạ"
  cycle_history_key_yellow_turban_rebellion: "Quần chúng bất mãn, được thôi thúc bởi lời tiên tri cách mạng, nổi dậy chống lại triều Hán, mở ra hàng thập kỷ nội chiến"
  cycle_history_key_three_kingdoms_period: "Sau khi hoàng đế cuối cùng của triều Hán bị ép thoái vị, thời kỳ phân liệt giữa ba nước Ngụy, Thục và Ngô chính thức bắt đầu"
  cycle_history_key_rise_of_the_jin: "Thời Tam Quốc chấm dứt khi quyền thần nước Ngụy ép hoàng đế thoái vị và lập nên triều Tấn"
  cycle_history_key_war_of_the_eight_princes: "Triều đại của Tấn Huệ Đế đầy biến động khi các thân vương hoàng tộc giao tranh để kiểm soát triều đình"
  cycle_history_key_sixteen_kingdoms: "Việc lập nên một vương quốc ly khai tại Tứ Xuyên báo hiệu sự tan rã của miền bắc thành các quốc gia đối địch phân mảnh"
  cycle_history_key_northern_southern_dynasties: "Sự hỗn loạn của thời Thập Lục Quốc dần nhường chỗ cho Nam Bắc triều ổn định hơn, dù giấc mộng thống nhất vẫn xa vời"
  cycle_history_key_rise_of_the_sui: "Sau sự sụp đổ của Bắc Chu dưới thời Tuyên Đế bất ổn, nhạc phụ của ông đoạt quyền và lập nên triều Tùy"
  cycle_history_key_decline_of_the_sui: "Những công trình tốn kém và các chiến dịch quân sự thất bại đẩy triều Tùy đến bờ vực; hoàng đế bị sát hại và một đứa trẻ được đưa lên ngai"
  cycle_history_key_rise_of_the_tang: "Buộc vị hoàng đế nhỏ tuổi của triều Tùy thoái vị, quyền thần lên ngôi, trở thành hoàng đế đầu tiên của triều Đường"
  cycle_history_key_an_lushan_rebellion: "Tướng An Lộc Sơn lãnh đạo một cuộc nổi loạn thất bại chống lại triều Đường, gây hậu quả thảm khốc cho hàng triệu người"
  cycle_history_key_collapse_of_the_tang: "Cái chết của vị hoàng đế cuối cùng nhà Đường đánh dấu sự chấm dứt triều đại, khi hơn một tá quân phiệt tranh giành danh nghĩa kế vị"
  cycle_history_key_rise_of_the_song: "Một vị danh tướng thống nhất các vương quốc phân liệt, mở ra thời kỳ hòa bình và phồn vinh với tư cách người sáng lập triều Tống"
  cycle_history_key_sack_of_kaifeng_by_jin: "Triều Tống chịu thất bại nặng nề khi kinh đô Khai Phong bị triều Kim của người Nữ Chân cướp phá, bản thân hoàng đế bị bắt"

