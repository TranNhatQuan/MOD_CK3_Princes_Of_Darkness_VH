l_english: 
  the_great_steppe_sub_region_steppe_west: "Thảo nguyên Phía Tây"
  the_great_steppe_sub_region_steppe_west_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Thảo nguyên phía tây là nơi giao thoa giữa thảo nguyên và những con sông lớn như Don, Dnieper, Dniester và Volga. Xuyên suốt lịch sử, nơi đây từng là điểm xuất phát của vô số cuộc xâm lăng của các dân du mục vào các vùng đất định cư của châu Âu.#!"
  the_great_steppe_sub_region_steppe_central: "Thảo nguyên Trung tâm"
  the_great_steppe_sub_region_steppe_central_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Thảo nguyên trung tâm nằm giữa dãy Ural ở phía tây, dãy Altai ở phía đông và Khorasan ở phía nam. Qua nhiều thời đại, các dân du mục đã băng qua vùng đất này khi di chuyển cả về phía tây lẫn phía đông, để vươn tới những đế chế hùng mạnh ở hai đầu thảo nguyên.#!"
  the_great_steppe_sub_region_steppe_east: "Thảo nguyên Phía Đông"
  the_great_steppe_sub_region_steppe_east_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Ở phía đông dãy Altai và phía bắc sa mạc Gobi là thảo nguyên phía đông. Những thảo nguyên rộng lớn này nuôi dưỡng các chiến binh cường tráng, những người rồi sẽ tiến về phía tây hoặc tìm kiếm sự giàu có từ các láng giềng  phía đông nam của họ.#!"

  SITUATION_SUB_REGION_TOOLTIP_DESC: "[situation_sub_region|E] này thuộc về [SituationSubRegion.GetSituation.GetName]\n\nGiai đoạn hiện tại: [SituationSubRegion.GetCurrentPhase.GetName|V]"
