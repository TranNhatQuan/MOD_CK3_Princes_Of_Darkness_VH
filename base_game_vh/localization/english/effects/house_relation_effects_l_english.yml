l_english: 
  set_house_relation_third: "[house_relation|E] giữa [DYNASTY_HOUSE.GetName]-[DYNASTY_HOUSE_2.GetName] chuyển sang mức [HOUSE_RELATION_LEVEL.GetName|V]"
  set_house_relation_global: "$set_house_relation_third$"
  set_house_relation_third_past: "$set_house_relation_third$"
  set_house_relation_global_past: "$set_house_relation_third_past$"

 # Partial house relation change (less than a full step)
  change_house_relation_fraction_third: "[HOUSE_RELATION.GetName] [house_relation|E] [Select_CString( GreaterThan_CFixedPoint( '(CFixedPoint)$STEPS|q$', '(CFixedPoint)0.0'), '#P cải thiện#!', '#N tồi tệ đi#!' )] từ [HouseRelation.GetLevel.GetName] hướng tới [HOUSE_RELATION_LEVEL.GetName] ($STEPS|+=%^$)"
  change_house_relation_fraction_global: "$change_house_relation_fraction_third$"
  change_house_relation_fraction_third_past: "$change_house_relation_fraction_third$"
  change_house_relation_fraction_global_past: "$change_house_relation_fraction_third_past$"

 # Significant house relation change (full step or more)
  change_house_relation_third: "[HOUSE_RELATION.GetName] [house_relation|E] [Select_CString( GreaterThan_CFixedPoint( '(CFixedPoint)$STEPS|q$', '(CFixedPoint)0.0'), '#P cải thiện#!', '#N tồi tệ đi#!' )] từ [HouseRelation.GetLevel.GetName] thành [HOUSE_RELATION_LEVEL.GetName] ($STEPS|+=%^$)"
  change_house_relation_global: "$change_house_relation_third$"
  change_house_relation_third_past: "$change_house_relation_third$"
  change_house_relation_global_past: "$change_house_relation_third_past$"

 # Effect: impact_house_relation
  impact_house_relation_to_be_established_global: "Thiết lập [house_relation|E] giữa [DYNASTY_HOUSE.GetName] và [DYNASTY_HOUSE_2.GetName] ở mức khởi đầu là [HOUSE_RELATION_LEVEL.GetName]" 
  impact_house_relation_to_change_level_global: "[HOUSE_RELATION.GetName] [house_relation|E] [Select_CString( GreaterThan_CFixedPoint( '(CFixedPoint)$STEPS|q$', '(CFixedPoint)0.0'), '#P cải thiện#!', '#N tồi tệ đi#!' )] từ [OLD_HOUSE_RELATION_LEVEL.GetName] thành [NEW_HOUSE_RELATION_LEVEL.GetName] ($STEPS|+=%^$)"
  impact_house_relation_to_progress_towards_level_global: "[HOUSE_RELATION.GetName] [house_relation|E] [Select_CString( GreaterThan_CFixedPoint( '(CFixedPoint)$STEPS|q$', '(CFixedPoint)0.0'), '#P cải thiện#!', '#N tồi tệ đi#!' )] từ [HOUSE_RELATION.GetLevel.GetName] hướng tới [HOUSE_RELATION_LEVEL.GetName] ($STEPS|+=%^$)"
  impact_house_relation_to_be_established_third: "$impact_house_relation_to_be_established_global$"
  impact_house_relation_to_change_level_third: "$impact_house_relation_to_change_level_global$"
  impact_house_relation_to_progress_towards_level_third: "$impact_house_relation_to_progress_towards_level_global$"

  I_CLEAR_HOUSE_RELATION_EFFECT: "[house_relation|E] giữa [DYNASTY_HOUSE.GetName]-[DYNASTY_HOUSE_2.GetName] kết thúc"
  THEY_CLEAR_HOUSE_RELATION_EFFECT: "$I_CLEAR_HOUSE_RELATION_EFFECT$"
  CLEAR_HOUSE_RELATION_EFFECT: "$I_CLEAR_HOUSE_RELATION_EFFECT$"
  CLEARED_HOUSE_RELATION_EFFECT: "[house_relation|E] giữa [DYNASTY_HOUSE.GetName]-[DYNASTY_HOUSE_2.GetName] đã kết thúc"
