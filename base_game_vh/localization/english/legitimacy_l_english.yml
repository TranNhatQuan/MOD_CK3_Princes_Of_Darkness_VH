  LEGITIMACY_CHANGED_EFFECTS: "\n[LegitimacyLevel.GetOnLevelEnteredDesc( Character.Self )]"
  LEGITIMACY_EFFECTS: "$LEGITIMACY_CHANGED_EFFECTS$#S Hiệu ứng:#!\n[LegitimacyLevel.GetModifierDesc]"
  LEGITIMACY_AVERAGE_EXPECTATIONS: "#S [Character.GetShortUINamePossessive|U] Trung bình [expected_legitimacy|E]:#!\n$BULLET$[powerful_vassals|E]: [LegitimacyType.GetFlavorName( Character.GetAveragePowerfulVassalLegitimacyExpectation )|V] #weak ([Character.GetAveragePowerfulVassalLegitimacyExpectation.GetIndex]/[Subtract_int32( GetDataModelSize( LegitimacyType.GetLevels ), '(int32)1' )])#!\n$BULLET$[vassals|E]: [LegitimacyType.GetFlavorName( Character.GetAverageVassalLegitimacyExpectation )|V] #weak ([Character.GetAverageVassalLegitimacyExpectation.GetIndex]/[Subtract_int32( GetDataModelSize( LegitimacyType.GetLevels ), '(int32)1' )])#!"
  LEGITIMACY_AVERAGE_EXPECTATIONS_NO_POWERFUL_VASSALS: "#S [Character.GetShortUINamePossessive|U] Trung bình [expected_legitimacy|E]:#!\n$BULLET$[vassals|E]: [LegitimacyType.GetFlavorName( Character.GetAverageVassalLegitimacyExpectation )|V] #weak ([Character.GetAverageVassalLegitimacyExpectation.GetIndex]/[Subtract_int32( GetDataModelSize( LegitimacyType.GetLevels ), '(int32)1' )])#!"
  LEGITIMACY_BELOW_AVERAGE_EXPECTATIONS: "@warning_icon! #X Thấp hơn mức chính danh kỳ vọng của tất cả chư hầu#!"
  VASSAL_BELOW_EXPECTED_LEGITIMACY_TT: "\n@warning_icon! #X [legitimacy_levels|E] thấp hơn kỳ vọng của [Character.GetHerHis]: [Subtract_int32( Character.GetLegitimacyExpectationsOfLiege, GetPlayer.GetLegitimacyLevel.GetIndex )|V]#!"
  VASSAL_EXPECTED_LEGITIMACY_TT: "#T [expected_legitimacy|E]: [Character.GetLegitimacyExpectationsOfLiege]#![AddLocalizationIf( GreaterThan_int32( Character.GetLegitimacyExpectationsOfLiege, GetPlayer.GetLegitimacyLevel.GetIndex ), 'VASSAL_BELOW_EXPECTED_LEGITIMACY_TT' )]"
  legitimacy_swing_scales_cheaper_tt: "#weak Chi phí giảm do [legitimacy|E] thấp của [recipient.GetShortUINamePossessive] ([recipient.GetLegitimacyLevel.GetIndex|V])#!"
  legitimacy_swing_scales_dearer_tt: "#weak Chi phí tăng do [legitimacy|E] cao của [recipient.GetShortUINamePossessive] ([recipient.GetLegitimacyLevel.GetIndex|V])#!"
  legitimacy_hud_tt: "Nhà cai trị [LegitimacyType.GetFlavorName( LegitimacyLevel.Self )] [LegitimacyLevel.GetIndex|V]/[Subtract_int32( GetDataModelSize( LegitimacyType.GetLevels ), '(int32)1' )]"
  legitimacy_hud_tt_subheading: "[legitimacy_level|E] cho một [LegitimacyType.GetName]"
  legitmacy_flavor_and_level: "[LegitimacyType.GetFlavorName( LegitimacyLevel.Self )|V] #weak ([LegitimacyLevel.GetIndex]/[Subtract_int32( GetDataModelSize( LegitimacyType.GetLevels ), '(int32)1' )])#!"
  LEGITIMACY_TRACK_TITLE: "Chính danh [Character.GetLegitimacy|V^0]/[LegitimacyType.GetMaxLegitimacy( Character.Self )|V^0]"
  LEGITIMACY_TRACK_TOOLTIP: "#T [LegitimacyType.GetFlavorName( LegitimacyLevel.Self )]#!\nYêu cầu ít nhất [LegitimacyLevel.GetThreshold( Character.Self )|V^] Chính danh\n\n$LEGITIMACY_EFFECTS$"

  legitimacy_high_modifier_tt: "[legitimacy|E] cao"
  legitimacy_low_modifier_tt: "[legitimacy|E] thấp"

  legitimacy_on_level_entered: "#S Khi thay đổi cấp:#!\n"
  legitimacy_on_entered_lost_mandate: "$legitimacy_on_level_entered$@warning_icon! #X Kích hoạt "$catalyst_hegemon_lost_mandate_of_heaven$", điều này sẽ đưa [dynastic_cycle|E] vào giai đoạn [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_chaos').GetName] [situation_dynastic_cycle_phase|E]#!"
