 courtier_guest_management.0102.t:0 "Cơ Hội Cuối Cùng Của Ta"
 courtier_guest_management.0102.desc:0 "[courtier.GetTitledFirstName] đã quyết định rằng thời gian của [courtier.GetHerHis] tại [capital.GetNameNoTierNoTooltip] đã tới hồi kết. Bọn gia nhân đã đóng gói hành lý cho [courtier.GetHerHis] và [courtier.GetSheHe] đã nói lời cáo từ.\n\nCùng với sự ra đi của [courtier.GetTitledFirstNameNoTooltip], ta cũng mất đi quyền khiếu nại đối với [courtier_claim.GetName]. Nếu ta muốn thúc đẩy quyền đó và phong [courtier.GetHerHim] làm bồi thần của ta, đây là cơ hội cuối cùng để khiến [courtier.GetHerHim] ở lại."

