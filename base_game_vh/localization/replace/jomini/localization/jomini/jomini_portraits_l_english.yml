l_english:
 SETTING_ANIMATED_PORTRAITS:  "Hoạt ảnh Nhân vật"
 SETTING_ANIMATED_PORTRAITS_TOOLTIP:  "#T $SETTING_ANIMATED_PORTRAITS$\n#!Xác định xem các Nhân vật nổi bật có nên được hoạt ảnh hay không.\n\nTắt tính năng này có thể làm tăng hiệu suất."
 SETTING_PORTRAITS_SSAO:  "SSAO Nhân vật"
 SETTING_PORTRAITS_SSAO_TOOLTIP:  "#T $SETTING_PORTRAITS_SSAO$\n#!Xác định xem có nên áp dụng hiện tượng che kín không gian màn hình cho ảnh chân dung hay không.\n\nTắt tính năng này có thể làm tăng hiệu suất."
 SETTING_PORTRAITS_BLOOM:  "Characters Bloom"
 SETTING_PORTRAITS_BLOOM_TOOLTIP:  "#T $SETTING_PORTRAITS_BLOOM$\n#!Determines whether bloom should be applied to portraits.\n\nTurning it off may increase performance."
