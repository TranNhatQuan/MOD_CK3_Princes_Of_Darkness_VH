 SETTING_TEXTURE_QUALITY:  "Chất lượng Kết cấu"
 SETTING_TEXTURE_QUALITY_TOOLTIP:  "#T $SETTING_TEXTURE_QUALITY$#!\nKiểm soát độ phân giải của kết cấu được tải.\n\nCài đặt thấp hơn có thể làm tăng hiệu suất."
 SETTING_QUALITY:  "Chất lượng Định trước"
 SETTING_SFX:  "SFX"
 SETTING_UI:  "Giao diện"
 SETTING_QUALITY_TOOLTIP:  "#T $SETTING_QUALITY$\n#!Chọn một giá trị đặt trước trong số các tùy chọn đồ họa nâng cao bên dưới.\n\nGiá trị định trước thấp sẽ làm tăng hiệu suất."
 SETTING_BLOOM_TOOLTIP:  "#T $SETTING_BLOOM$\n#!Kích hoạt hiệu ứng "chói sáng", trong đó các ánh sáng cực sáng sẽ tràn sang các phần khác của hình ảnh.\n\nTắt tính năng này có thể làm tăng hiệu suất."
 SETTING_DOF_TOOLTIP:  "#T $SETTING_DOF$\n#!Kích hoạt độ sâu trường ảnh để mô phỏng ống kính camera, làm mờ các điểm ngoài tiêu điểm của hình ảnh.\n\nTắt tính năng này có thể làm tăng hiệu suất."
 SETTING_LENS_FLARE_TOOLTIP:  "#T $SETTING_LENS_FLARE$\n#!Kích hoạt hiệu ứng chói lóa ống kính xuất hiện ở những khu vực có nhiều "chói sáng". "Chói sáng" phải được kích hoạt để hiệu ứng xuất hiện. \n\nTắt tính năng này có thể làm tăng hiệu suất."
 SETTING_SECONDARY_LENS_FLARE_TOOLTIP:  "#T $SETTING_SECONDARY_LENS_FLARE$\n#!Kích hoạt hiệu ứng ống kính chói lóa phụ xuất hiện ở những khu vực có nhiều "chói sáng". "Chói sáng" phải được kích hoạt để hiệu ứng xuất hiện. \n\nTắt tính năng này có thể làm tăng hiệu suất."
 SETTING_MAP_SSAO_TOOLTIP:  "#T $SETTING_MAP_SSAO$\n#!Xác định xem có nên áp dụng đứt gãy xung quanh không gian màn hình cho bản đồ hay không.\n\nTắt tính năng này có thể làm tăng hiệu suất."
 SETTING_REFRACTION_TOOLTIP:  "Xác định xem liệu khúc xạ có xuất hiện trên nước hay không."
 SETTING_REFRACTION_QUALITY_TOOLTIP:  "#T $SETTING_REFRACTION_QUALITY$#!\nKiểm soát chất lượng của các khúc xạ nước nếu chúng được bật.\n\nCài đặt thấp hơn có thể làm tăng hiệu suất."
 SETTING_MAPOBJECT_QUALITY_TOOLTIP:  "#T $SETTING_MAPOBJECT_QUALITY$#!\nXác định mức chất lượng cao nhất của Đối tượng Bản đồ (chẳng hạn như công trình).\n\nCài đặt thấp hơn có thể làm tăng hiệu suất."
 SETTING_MESH_LOD_BIAS_TOOLTIP:  "#T $SETTING_MESH_LOD_BIAS$#!\nNXác định chất lượng của LOD (Mức độ chi tiết) trên các đối tượng bản đồ như Mô hình đơn vị.\n\nCài đặt thấp hơn có thể làm tăng hiệu suất."
 SETTING_MESH_LOD_FADE_TOOLTIP:  "#T $SETTING_MESH_LOD_FADE$\n#!Nếu được bật, các mô hình 3D sẽ chuyển đổi mượt mà giữa các mức chi tiết khác nhau (LOD) khi Ngài phóng to hoặc thu nhỏ.\n\nTắt tính năng này có thể làm tăng hiệu suất."
 SETTING_PROVINCE_NAMES_TOOLTIP:  "Xác định cách tên Thành phố và Tỉnh xuất hiện trên bản đồ."
 SETTING_FILL_IN_IMPASSABLE_TERRAIN_TOOLTIP:  "Xác định xem địa hình không thể vượt qua có được đưa vào biên giới của quốc gia trên bản đồ hay không."
 SETTING_LANGUAGE_TOOLTIP:  "#T $SETTING_LANGUAGE$#!\nXác định Ngôn ngữ của Giao diện Người dùng."
