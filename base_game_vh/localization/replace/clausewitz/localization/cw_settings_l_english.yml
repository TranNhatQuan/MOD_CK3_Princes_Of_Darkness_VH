 SETTING_MUSIC_DENSITY:  "Phân phối Âm nhạc"
 SETTING_MUSIC_DENSITY_TOOLTIP:  "Kiểm soát sự cân bằng giữa các bài hát đầy đủ, các đoạn nhạc im lặng và thư giãn.\n\nMãnh liệt = Hầu hết các bài hát phát lần lượt, tương tự như ‘đài phát thanh’.\nCân bằng = Sự cân bằng hoàn hảo giữa các bài hát, khoảng lặng và thư giãn\nThư giãn = Phần lớn là các phân đoạn nhạc thư giãn mang lại trải nghiệm tâm trạng tốt hơn và ít cảm giác lặp lại sau vài giờ chơi”"
