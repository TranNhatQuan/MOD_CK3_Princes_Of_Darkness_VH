 OPTION_UPSCALE_QUALITY_ULTRA_QUALITY:  "Chất lượng Cao"
 OPTION_UPSCALE_QUALITY_QUALITY:  "Chất lượng"
 OPTION_UPSCALE_QUALITY_BALANCED:  "Cân bằng"
 OPTION_UPSCALE_QUALITY_PERFORMANCE:  "Hiệu năng"
 OPTION_UPSCALE_QUALITY_ULTRA_PERFORMANCE:  "Hiệu năng Cao"
 SETTING_ANISOTROPIC_FILTERING:  "Bộ lọc Kết cấu"
 SETTING_ANISOTROPIC_FILTERING_TOOLTIP:  "#T $SETTING_ANISOTROPIC_FILTERING$\n#!Sử dụng tính năng lọc dị hướng sẽ làm cho các bề mặt có kết cấu trông đẹp hơn.\n\nCài đặt thấp hơn có thể làm tăng hiệu suất."
 SETTING_FULLSCREEN_RESOLUTION:  "Độ phân giải"
 SETTING_FULLSCREEN_RESOLUTION_TOOLTIP:  "#T $SETTING_FULLSCREEN_RESOLUTION$\n#!Đặt chất lượng hình ảnh của trò chơi.\n\nĐộ phân giải thấp hơn có thể tăng hiệu suất.\n\n#X Độ phân giải trò chơi với tỷ lệ khung hình không được hỗ trợ có thể khiến giao diện xuất hiện tràn ra bên ngoài màn hình#!"
 SETTING_WINDOWED_RESOLUTION:  "Độ phân giải Cửa sổ"
 SETTING_WINDOWED_RESOLUTION_TOOLTIP:  "#T $SETTING_WINDOWED_RESOLUTION$\n#!Đặt độ phân giải của cửa sổ trò chơi nếu trò chơi ở Chế độ Cửa sổ.\n\nPhải ở định dạng #b NUMBER#!x#b NUMBER#!.\n\n#X Độ phân giải trò chơi với tỷ lệ khung hình không được hỗ trợ có thể khiến giao diện xuất hiện tràn ra bên ngoài màn hình#!"
 SETTING_RENDER_SCALE:  "Tỷ lệ Kết xuất"
 SETTING_RENDER_SCALE_TOOLTIP:  "#T $SETTING_RENDER_SCALE$#!\nTỷ lệ độ phân giải hiển thị của trò chơi so với độ phân giải chính, ngoại trừ giao diện người dùng.\n\nCài đặt thấp hơn có thể tăng hiệu suất nhưng sẽ làm giảm độ trung thực tổng thể, trong khi tăng trên 100% có thể tăng độ trung thực nhưng sẽ làm giảm hiệu suất."
 SETTING_RENDER_SCALE_FORMAT:  "$VALUE|%0$"
 SETTING_DISPLAY:  "Màn hình"
 SETTING_DISPLAY_TOOLTIP:  "#T $SETTING_DISPLAY$\n#!Nếu máy tính của Ngài có nhiều màn hình, hãy chọn một màn hình để trò chơi sử dụng."
 SETTING_GRAPHICS_DEVICE:  "Card Đồ họa"
 SETTING_GRAPHICS_DEVICE_TOOLTIP:  "#T $SETTING_GRAPHICS_DEVICE$\n#!Chọn card đồ họa mà trò chơi sẽ sử dụng. \n\nSử dụng cạc đồ họa tích hợp hoặc trình kết xuất phần mềm có thể làm giảm hiệu suất."
 SETTING_SHADOW_MAP_RESOLUTION:  "Chất lượng Đổ bóng"
 SETTING_SHADOW_MAP_RESOLUTION_TOOLTIP:  "#T $SETTING_SHADOW_MAP_RESOLUTION$\n#!Xác định độ phân giải bản đồ bóng được hiển thị, nếu đổ bóng được bật.\n\nCài đặt thấp hơn có thể làm tăng hiệu suất."
 SETTING_DISPLAY_MODE:  "Chế độ Hiển thị"
 SETTING_DISPLAY_MODE_TOOLTIP:  "#T $SETTING_DISPLAY_MODE$\n#!Xác định cách hiển thị trò chơi trên màn hình của Ngài"
 SETTING_BLOOM:  "Chói sáng"
