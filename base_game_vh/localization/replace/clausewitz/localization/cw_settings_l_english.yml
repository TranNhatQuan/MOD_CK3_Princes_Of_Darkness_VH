 SETTING_RENDERER:  "Trình kết xuất"
 SETTING_RENDERER_TOOLTIP:  "Xác định trình kết xuất nào đang được sử dụng."
 SETTING_VSYNC:  "VSync"
 SETTING_VSYNC_TOOLTIP:  "#T $SETTING_VSYNC$\n#!Làm cho trò chơi và màn hình của Ngài có cùng tốc độ khung hình, giảm hiện tượng xé hình.\n\nTắt tính năng này có thể làm tăng hiệu suất."
 SETTING_PORTRAIT_MULTI_SAMPLING:  "Hình ảnh Đa lớp"
 SETTING_PORTRAIT_MULTI_SAMPLING_TOOLTIP:  "#T $SETTING_PORTRAIT_MULTI_SAMPLING$\n#!Sử dụng nhiều lớp cho Alpha-To-Coverage để giúp tóc trộn đều mượt hơn.\n\nCài đặt thấp hơn sẽ tăng hiệu suất."
 SETTING_MULTI_SAMPLING:  "Khử răng cưa (MSAA)"
 SETTING_MULTI_SAMPLING_TOOLTIP:  "#T $SETTING_MULTI_SAMPLING$\n#!Sử dụng khử răng cưa nhiều mẫu (MSAA) sẽ làm cho các cạnh của hình ảnh mịn hơn.\n\nCài đặt thấp hơn có thể làm tăng hiệu suất."
 SETTING_ANTI_ALIASING:  "Khử răng cưa"
 SETTING_ANTI_ALIASING_TOOLTIP:  "#T $SETTING_ANTI_ALIASING$\n#!Sử dụng tính năng khử răng cưa sẽ làm cho các cạnh của hình ảnh mịn hơn.\n\nFXAA được khuyến nghị."
