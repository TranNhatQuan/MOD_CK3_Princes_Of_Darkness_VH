 OPTION_FULLSCREEN_TOOLTIP:  "#T $OPTION_FULLSCREEN$\n#!Hiển thị trò chơi bằng toàn bộ màn hình. Cài đặt Độ phân giải sẽ thay đổi độ sắc nét của hình ảnh."
 OPTION_WINDOWED:  "Cửa sổ"
 OPTION_WINDOWED_TOOLTIP:  "#T $OPTION_WINDOWED$\n#!Hiển thị trò chơi trong một cửa sổ. Cài đặt Độ phân giải thay đổi kích thước của cửa sổ."
