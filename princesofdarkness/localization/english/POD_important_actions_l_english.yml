 lesson_fetters_and_passions: "Fetters, Đam Mê và [oblivion_pull|E]"
 lesson_fetters_and_passions_desc: "Điều đầu tiên cần biết là sự tồn tại của [oblivion_pull|E] mà bạn cần theo dõi sát sao để không rơi vào [GetTrait('shadow').GetName(GetNullCharacter)]. Để giảm nó bạn cần [Fetters|E], mỗi điểm [Fetter|E] chưa được chỉ định nghĩa là thêm một [stress|E] mỗi tháng."
 
 fetters_and_passions2: "Mất Stress"
 lesson_fetters_and_passions2: "Mất Stress"
 lesson_fetters_and_passions2_desc: "$POD_splat_wraith_plural$ không thể mất [stress|E] trừ khi kích hoạt một đam mê. Để kích hoạt một đam mê bạn cần thực hiện các hành động cụ thể được nêu chi tiết trong mô tả của bổ trợ [Fetter|E]. Mỗi loại [Fetter|E] có các yếu tố kích hoạt khác nhau, như 'HATRED' kích hoạt sau khi phạm tội giết người và 'LOVE' kích hoạt mỗi năm khi nhân vật được chọn còn sống.\n\nCấp độ của một [Fetter|E] là thước đo quan trọng cho các đam mê, vì nó là một yếu tố quyết định bạn sẽ mất được bao nhiêu stress khi sử dụng nó và bạn sẽ nhận được bao nhiêu Pathos."
 
 fetters_and_passions3: "Suy Sụp Tinh Thần"
 lesson_fetters_and_passions3: "Suy Sụp Tinh Thần"
 lesson_fetters_and_passions3_desc: "Đối với một [GetTrait('wraith').GetName(GetNullCharacter)], việc chịu một cơn suy sụp tinh thần là rất nguy hiểm vì mỗi lần suy sụp sẽ tiếp sức cho [GetTrait('shadow').GetName(GetNullCharacter)] bằng cách cho bạn ngẫu nhiên một [perk|E] [lifestyle|E] [thorn_lifestyle|E] khiến trò chơi khó khăn hơn.\nỞ #N cấp độ suy sụp tinh thần 2#!, [GetTrait('shadow').GetName(GetNullCharacter)] sẽ cố gắng lật đổ bạn để trở thành nhân cách chính. Nếu thành công trong nỗ lực này, bạn sẽ trở thành một [GetTrait('shadow').GetName(GetNullCharacter)] với tất cả những gì điều đó kéo theo.\nỞ #N cấp độ suy sụp tinh thần 3#!, [GetTrait('shadow').GetName(GetNullCharacter)] của bạn sẽ cố gắng xóa bỏ bạn khỏi sự tồn tại, nếu thành công bạn sẽ trở thành một [GetTrait('spectre').GetName(GetNullCharacter)] và trò chơi của bạn sẽ kết thúc"
 
 fetters_and_passions4: "Arcanoi"
 lesson_fetters_and_passions4: "Arcanoi"
 lesson_fetters_and_passions4_desc: "Dù không thoải mái trong thế giới của người sống, một [GetTrait('wraith').GetName(GetNullCharacter)] không hề vô phương tự vệ vì họ có quyền tiếp cận [arcanoi_lifestyle|E], sức mạnh của người chết.\n\nĐể sử dụng chúng bạn sẽ cần học chúng, có hai cách để làm điều đó: Cách thứ nhất là học nó từ một [friend|E] hoặc mối quan hệ tích cực khác. Cách thứ hai là, trong khi khám phá [umbra|E], gặp một [GetTrait('wraith').GetName(GetNullCharacter)] khác sẵn lòng dạy bạn một trong số chúng.\n\nMỗi arcanoi cần Pathos để sử dụng, và pathos có được thông qua đam mê như đã giải thích ở trên.\n\nMỗi arcanoi cũng mở khóa [domicile_building|E] mang lại thêm nhiều lợi ích."

