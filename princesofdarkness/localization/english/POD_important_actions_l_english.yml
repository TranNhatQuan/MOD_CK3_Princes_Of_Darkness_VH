 action_ghoul_can_drink_safety_from_vampire_alert_desc: "Một trong những [prisoner|E] $POD_splat_vampire$ của bạn đã hết hạn ràng buộc máu, giờ bạn có thể uống từ họ an toàn hơn. Hãy nhớ rằng nếu họ có một [Glossary('Discipline','game_concept_discipline_desc')] tinh thần thì nguy hiểm vẫn còn tồn tại!"
