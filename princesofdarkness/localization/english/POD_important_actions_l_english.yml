 lesson_gain_glamour_6: "Cướp Phá"
 lesson_gain_glamour_6_desc: "Bạn có thể dùng [character_interaction|E] Cướp Phá tại vị trí hiện tại của mình để nhận Glamour."

 reactive_advice_umbra: "Umbra"
 action_reactive_advice_umbra: "Lời Khuyên: Umbra"
 action_reactive_advice_umbra_desc: "Mở mục này để tìm hiểu thêm về Umbra."
 action_reactive_advice_umbra_click: "$click_to_open_lesson$"
 lesson_umbra_1: "Umbra"
 lesson_umbra_1_desc: "Umbra, còn gọi là [spirit_world|E], là hình ảnh phản chiếu tâm linh của thế giới vật chất. Nó được chia thành nhiều cõi phụ, mỗi cõi chứa đựng những điều kỳ diệu và nguy hiểm riêng.\nChỉ một số ít thực thể được chọn mới có thể xuyên qua chiều không gian này và một số cõi chỉ mở ra cho một loại cá thể nhất định (hoặc với sức mạnh phù hợp)."
 lesson_umbra_2: "Khám Phá"
 lesson_umbra_2_desc: "Các cõi Umbra mà bạn và triều đình của bạn có thể khám phá được hiển thị trong bảng Umbra. Bằng cách nhấn vào ô nhân vật trống dưới một cõi, bạn sẽ có thể chỉ định một nhà thám hiểm, năng khiếu của họ càng cao, họ sẽ khám phá càng nhanh.\nMột cuộc khám phá hoàn tất có thể dẫn đến việc tìm ra một cõi Umbra mới, khởi đầu của một khám phá hoặc một hiệu ứng khác tùy theo cõi."
 lesson_umbra_3: "Khám Phá Bí Ẩn"
 lesson_umbra_3_desc: "Nếu một nhà thám hiểm tìm thấy một sự kiện đặc biệt thú vị trong umbra, họ sẽ báo cho bạn bằng một khám phá bí ẩn. Bạn có thể xem tất cả các khám phá bí ẩn hiện tại của mình trong bảng umbra thứ hai. Các khám phá bí ẩn có thể dẫn đến các cuộc viễn chinh (nơi bạn tự mình đi điều tra điều gì đó thú vị) hoặc các cơ hội phiêu lưu khác."
 lesson_umbra_4: "Hiệu Ứng Thụ Động và Hành Động"
 lesson_umbra_4_desc: "Một số cõi Umbra có thể có hiệu ứng thụ động hoặc hành động đi kèm. Các hiệu ứng thụ động được mô tả dưới tên của cõi trong khi các hành động là các nút ở góc dưới bên phải của cõi."

 ### Custom alerts

 pod_alert_can_create_coterie: "#T Bạn có thể tạo một [GetPlayer.Custom('PODCoterieNoTooltip')]#!\nLà thành viên của một [GetPlayer.Custom('PODCoterie')] sẽ giúp bạn dễ dàng thành công hơn trong các [journeys|E] của mình.\n\n#I Nhấn để tạo một [GetPlayer.Custom('PODCoterieNoTooltip')] ngay bây giờ.#!\n$RIGHT_CLICK_DISMISS$"

 pod_alert_can_hunt_in_capital: "#T Bạn có thể lên một Hành Trình#!\nVì bạn là một $POD_splat_vampire$, bạn có thể #bold $hunt_in_capital_name$#! để giải tỏa [hunger_with_icon|E] và nhận [lifestyle_experience|E].\n\nSăn #bold Nông Dân#! là miễn phí.\n\n#I Nhấn để mở cửa sổ [journey|E].#!\n$RIGHT_CLICK_DISMISS$"

 pod_alert_can_train_with_pack: "#T Bạn có thể lên một Hành Trình#!\nVì bạn là một $glossary_fera$, bạn có thể #bold $fera_training_name$#! để cải thiện khả năng của cả bản thân lẫn [GetPlayer.Custom('PODCoterie')] của mình, hoặc các phần thưởng khác.\n\n#I Nhấn để mở cửa sổ [journey|E].#!\n$RIGHT_CLICK_DISMISS$"

 pod_alert_can_go_on_umbra_expedition: "#T Bạn có thể lên một [umbra_expedition|E]#!\nKhám phá những vùng sâu của [umbra|E] có thể vừa nguy hiểm vừa đem lại phần thưởng.\n\n#I Nhấn để mở cửa sổ [umbra|E].#!\n$RIGHT_CLICK_DISMISS$"

 pod_alert_has_umbra_crisis: "#T Bạn có một Khủng Hoảng Umbra chưa được giải quyết#!\nBạn phải giải quyết Khủng Hoảng Umbra nếu không muốn có điều xấu xảy ra vào cuối cùng.\n\n#I Nhấn để mở cửa sổ [umbra|E].#!\n$RIGHT_CLICK_DISMISS$"
 
