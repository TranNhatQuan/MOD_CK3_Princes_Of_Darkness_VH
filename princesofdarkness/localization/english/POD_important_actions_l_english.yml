 lesson_gain_glamour_1: "Điện Thánh"
 lesson_gain_glamour_1_desc: "33% cơ hội nhận Glamour hàng tháng tùy theo cấp độ của công trình Glade Freehold tại thủ đô của bạn."
 lesson_gain_glamour_2: "Xuất Thần"
 lesson_gain_glamour_2_desc: "Bạn có thể dùng [decision|E] Xuất Thần để nhận Glamour."
 lesson_gain_glamour_3: "Mộng Tưởng"
 lesson_gain_glamour_3_desc: "Bạn có thể nhận Glamour khi hoàn thành một âm mưu ngoại giao."
 lesson_gain_glamour_4: "Cướp Bóc"
 lesson_gain_glamour_4_desc: "Bạn có thể dùng [character_interaction|E] Cướp Bóc lên tù nhân có [inspiration|E] để nhận Glamour."
 lesson_gain_glamour_5: "Cuồng Ca"
