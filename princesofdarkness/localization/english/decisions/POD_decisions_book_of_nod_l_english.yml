l_english:
 POD_book_of_nod_decision: "Sách Nod"
 POD_book_of_nod_decision_tooltip: "Sách Nod là một hiện vật quan trọng trong truyền thuyết Cainite."
 POD_book_of_nod_decision_opening_desc: "Ngươi sẽ xem lại bộ sưu tập các truyện kể trong Sách Nod để lắp ghép hoặc đọc."
 POD_book_of_nod_decision_effect_tooltip: "Ngươi có thể lắp ghép các phần của Sách Nod hoặc đọc văn bản.\n\nMột tuyển tập văn bản cổ xưa, được xem là thiêng liêng đối với các Cainite theo phái Noddist. Nó gồm nhiều bản hiệu đính và mảnh vỡ đã được các học giả Kindred khác nhau ghép lại. Theo truyền thống, câu chuyện của Caine chủ yếu được truyền miệng, trong khi các văn bản chứa những sự kiện quan trọng nhất trong lịch sử Cainite được canh giữ nghiêm ngặt để bảo vệ các Cainite. Tác giả của nó không rõ, dù Malkav, Saulot, và thậm chí cả Caine thường được cho là đã viết một phần, nếu không muốn nói là toàn bộ. Một số cho rằng cả cuốn sách chỉ là thần thoại hoặc dối trá, một câu chuyện do ma cà rồng bịa ra để giải thích sự tồn tại của mình hoặc một công cụ dùng để đánh lừa kẻ khác suy nghĩ và hành động theo một cách nhất định. Mảnh cổ nhất của cuốn Sách có niên đại ngay trước thời Sumer, khoảng năm 4500 TCN."
 POD_book_of_nod_decision_confirm: "Suy ngẫm về Sách Nod"
 POD_book_of_nod_decision_custom_cain: "Ngươi phải sở hữu Biên Niên Sử của Caine"
