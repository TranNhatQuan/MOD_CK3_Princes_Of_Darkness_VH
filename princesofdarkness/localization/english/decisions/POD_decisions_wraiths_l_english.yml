l_english:
 POD_wraith_passion_gaining_passions_decision: "Đạt Được Đam Mê"
 POD_wraith_passion_gaining_passions_decision_desc: "Đam Mê của ngươi là cốt lõi của bản thể ngươi, và là một phần lý do giữ ngươi bám víu vào sự tồn tại. Ngươi không bao giờ ngừng tìm kiếm vì tình yêu mãnh liệt của mình, hay ngọn lửa báo thù vẫn tiếp tục cháy, và sẽ không dừng lại cho đến khi ngươi thực thi công lý. Bất kể chi tiết ra sao, chúng buộc ngươi phải tiếp tục tồn tại."
 POD_wraith_passion_gaining_passions_decision_tooltip: "Ngươi sẽ chọn những Đam Mê mới."
 POD_wraith_passion_gaining_passions_decision_confirm: "Để ta bắt đầu với..."

 POD_wraith_passion_find_killer_decision: "Đam Mê: Tìm Kẻ Giết Ta"
 POD_wraith_passion_find_killer_decision_desc: "Không gì bằng ngọn lửa báo thù để giữ đam mê của một kẻ cháy bỏng."
 POD_wraith_passion_find_killer_decision_tooltip: "Ngươi sẽ hoàn thành Đam Mê này."
 POD_wraith_passion_find_killer_decision_confirm: "Không ngờ ta lại quay về hả?"
 POD_wraith_passion_find_killer_decision_condition: "Kẻ giết ngươi, [TARGET_CHARACTER.GetFirstName], phải đã chết."

 POD_wraith_passion_amass_wealth_decision: "Đam Mê: Tích Lũy Của Cải"
 POD_wraith_passion_amass_wealth_decision_desc: "Tham lam là tốt và bản thân âm phủ vận hành theo nguyên tắc cốt lõi này. Cái chết sẽ không ngăn ngươi trở nên giàu có."
 POD_wraith_passion_amass_wealth_decision_tooltip: "Ngươi sẽ hoàn thành Đam Mê này."
 POD_wraith_passion_amass_wealth_decision_confirm: "Một thành phố người chết bằng vàng, có lẽ vậy?"

 POD_wraith_passion_become_exalted_decision: "Đam Mê: Trở Thành Bậc Được Tôn Sùng Giữa Người Chết"
 POD_wraith_passion_become_exalted_decision_desc: "Vinh quang và sự sùng bái thúc đẩy ngươi. Với cái chết của ngươi, đám đông đã thay đổi nhưng mục tiêu thì không."
 POD_wraith_passion_become_exalted_decision_tooltip: "Ngươi sẽ hoàn thành Đam Mê này."
 POD_wraith_passion_become_exalted_decision_confirm: "Suy cho cùng, vinh quang là vĩnh cửu."

 POD_wraith_passion_become_paragon_decision: "Đam Mê: Trở Thành Bậc Thánh Nhân Của Sự Siêu Thoát"
 POD_wraith_passion_become_paragon_decision_desc: "Nếu lòng nhiệt thành của ngươi không mang lại Thiên Đường như ngươi mong đợi, nó vẫn có thể là chìa khóa cho sự tồn tại tiếp diễn của ngươi."
 POD_wraith_passion_become_paragon_decision_tooltip: "Ngươi sẽ hoàn thành Đam Mê này."
 POD_wraith_passion_become_paragon_decision_confirm: "Một phép thử đức tin đã thành công?"

 POD_wraith_passion_create_a_treasury_decision: "Đam Mê: Xây Dựng Kho Báu"
 POD_wraith_passion_create_a_treasury_decision_desc: "Hiện vật và di vật là món hàng hiếm có trong âm phủ. Những kẻ tích trữ chúng có thể nhanh chóng gia tăng ảnh hưởng và quyền lực."
 POD_wraith_passion_create_a_treasury_decision_tooltip: "Ngươi sẽ hoàn thành Đam Mê này."
 POD_wraith_passion_create_a_treasury_decision_confirm: "Báu vật của ta!"
 POD_wraith_passion_create_a_treasury_decision_conditiona: "Ngươi phải sở hữu #V 3#! hiện vật độ hiếm Thường trở lên"
 POD_wraith_passion_create_a_treasury_decision_conditionb: "Ngươi phải sở hữu #V 3#! hiện vật độ hiếm Tinh xảo trở lên"
 POD_wraith_passion_create_a_treasury_decision_conditionc: "Ngươi phải sở hữu #V 3#! hiện vật độ hiếm Danh tiếng trở lên"
 POD_wraith_passion_create_a_treasury_decision_conditiond: "Ngươi phải sở hữu #V 3#! hiện vật Lừng lẫy"

 POD_wraith_passion_build_a_great_work_decision: "Đam Mê: Xây Kỳ Quan"
 POD_wraith_passion_build_a_great_work_decision_desc: "Vài kỳ quan kiến trúc tồn tại lâu hơn kiến trúc sư của chúng. Ngươi sẽ thử theo chiều ngược lại."
 POD_wraith_passion_build_a_great_work_decision_tooltip: "Ngươi sẽ hoàn thành Đam Mê này."
 POD_wraith_passion_build_a_great_work_decision_confirm: "Hoành tráng!"
 POD_wraith_passion_build_a_great_work_decision_condition: "Công trình đặc biệt, tại [TARGET_TITLE.GetNameNoTier], phải được xây dựng."

 POD_wraith_passion_make_a_friend_decision: "Đam Mê: Kết Bạn Thân Nhất"
 POD_wraith_passion_make_a_friend_decision_desc: "Suy cho cùng, khổ đau thích có bạn đồng hành."
