 transcendence_objective_decision: "Siêu Thoát"
 transcendence_objective_decision_desc: "Siêu Thoát là trạng thái mà oan hồn chấp nhận cái chết của mình và tiến lên từ Âm Phủ đến bất kỳ sự tồn tại khó tả nào đang chờ đợi phía sau. Siêu Thoát về căn bản là chấp nhận cái chết của bản thân. Những thứ giữ một oan hồn ràng buộc với âm phủ, Đam Mê và Fetter, phải được Hóa Giải. Một khi mọi thứ đã được hóa giải, oan hồn phải tìm kiếm một hình thức hòa hợp nào đó với Bóng của mình."
