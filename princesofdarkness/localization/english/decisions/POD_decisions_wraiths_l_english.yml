 POD_wraith_passion_kill_rival_decision_condition: "Kẻ địch của ngươi, [TARGET_CHARACTER.GetFirstName], phải đã chết."

 POD_wraith_fetter_adquire_fetters_decision: "Đạt Được [Fetters|E]"
