 struggle_seasons_ending_hostility_decision: "Trung Lập Chiến Thắng"
 struggle_seasons_ending_hostility_decision_desc: "Không Fae nào ngờ Triều đình Mùa Giao có thể thắng Chiến Tranh Mùa này, nhưng ngươi đã làm được, giờ đây họ sẽ lắng nghe ngươi khi ngươi quyết định Mùa nào nên cai trị."
 struggle_seasons_ending_hostility_decision_tooltip: "Kết thúc [struggle|E] Chiến Tranh Mùa"
 struggle_seasons_ending_hostility_decision_confirm: "Kết thúc Chiến Tranh Mùa"
 struggle_seasons_ending_winter_victory_decision: "Mùa Đông Vĩnh Cửu"
 struggle_seasons_ending_winter_victory_decision_desc: "Đã đến lúc một nhà lãnh đạo mạnh mẽ cuối cùng kéo các triều đình Fae ra khỏi vũng lầy và sự chia rẽ của Chiến Tranh Mùa. Mùa Đông đã đến, và nó sẽ không bao giờ kết thúc."
 struggle_seasons_ending_winter_victory_decision_confirm: "Mùa Đông Vĩnh Cửu"
 struggle_seasons_ending_spring_victory_decision: "Hy Vọng Trường Tồn"
 struggle_seasons_ending_spring_victory_decision_desc: "Đã đến lúc một nhà lãnh đạo mạnh mẽ cuối cùng kéo các triều đình Fae ra khỏi vũng lầy và sự chia rẽ của Chiến Tranh Mùa. Mùa Xuân đã tái sinh."
 struggle_seasons_ending_spring_victory_decision_confirm: "Hy Vọng Trường Tồn"
 struggle_seasons_ending_summer_victory_decision: "Mùa Hạ Trường Tồn"
 struggle_seasons_ending_summer_victory_decision_desc: "Đã đến lúc một nhà lãnh đạo mạnh mẽ cuối cùng kéo các triều đình Fae ra khỏi vũng lầy và sự chia rẽ của Chiến Tranh Mùa. Mùa Hạ này sẽ kéo dài mãi mãi."
 struggle_seasons_ending_summer_victory_decision_confirm: "Mùa Hạ Trường Tồn"
 struggle_seasons_ending_autumn_victory_decision: "Mùa Thu Tất Yếu"
 struggle_seasons_ending_autumn_victory_decision_desc: "Đã đến lúc một nhà lãnh đạo mạnh mẽ cuối cùng kéo các triều đình Fae ra khỏi vũng lầy và sự chia rẽ của Chiến Tranh Mùa. Mùa Thu là điều tất yếu."
 struggle_seasons_ending_autumn_victory_decision_confirm: "Mùa Thu Tất Yếu"
 struggle_seasons_ending_compromise_decision: "Giữ Nguyên Hiện Trạng"
 struggle_seasons_ending_compromise_decision_desc: "Những xung đột bất tận này về các mùa chỉ làm suy yếu tất cả chúng ta. Đã đến lúc chấp nhận rằng các triều đình Fae chưa bao giờ có ý định thống nhất."
 struggle_seasons_ending_compromise_decision_tooltip: "Kết thúc [struggle|E] Mùa"
 struggle_seasons_ending_compromise_decision_confirm: "Kết thúc Cuộc Chiến Mùa"
 struggle_seasons_ending_conciliation_decision: "Các Mùa Thống Nhất"
 struggle_seasons_ending_conciliation_decision_desc: "Vết thương của những thế kỷ trước sẽ không dễ dàng lành lại, nhưng chúng ta phải cố gắng nếu các triều đình Fae muốn tìm được hòa bình lâu dài. Thật vậy, các Mùa vốn được định sẵn để luân chuyển."
 struggle_seasons_ending_conciliation_decision_tooltip: "Kết thúc [struggle|E] Chiến Tranh Mùa"
 struggle_seasons_ending_conciliation_decision_confirm: "Kết thúc Chiến Tranh Mùa"
 struggle_seasons_ending_conciliation_decision_custom: "Kithain sẽ luôn chấp nhận lời đề nghị thần phục của ngươi"
 struggle_seasons_ending_outsider_decision: "Kết Thúc Chiến Tranh Mùa"
 struggle_seasons_ending_outsider_decision_desc: "Đã đến lúc diệt trừ những con sâu bọ phiền toái đó."
 struggle_seasons_ending_outsider_decision_friendly_desc: "Bạn bè, hãy ngừng chiến đấu."
 struggle_seasons_ending_outsider_decision_tooltip: "Kết thúc [struggle|E] Mùa"
 struggle_seasons_ending_outsider_decision_confirm: "Kết thúc Cuộc Chiến Mùa"

 pod_seasons_struggle.0501.t: "Chiến Tranh Mùa"
 pod_seasons_struggle.0501.desc: "$bm_1230_fae_desc$"
 pod_seasons_struggle.0501.a: "Nắm lấy vận mệnh!"

 pod_seasons_struggle.100.t: "Mùa nào sẽ cai trị Fae?"
 pod_seasons_struggle.100.desc: "Trái với mọi dự đoán, Triều đình Mùa Giao đã thắng Chiến Tranh Mùa. Fae sẽ lắng nghe lựa chọn của ngươi về việc Mùa nào nên cai trị thế giới của Fae.\n\n#EMP 'Chúng ta không có bài ca vĩ đại nào.\nKhông thơ ca.\nKhông lời nói.\nVậy mà, chúng ta không nợ ai cả;\nkhông làm nô lệ cho vòng xoay của các mùa\ncũng chẳng làm nô lệ cho bánh xe định mệnh.'#!"
 pod_seasons_struggle.100.a: "Mùa Đông nên cai trị!"
 pod_seasons_struggle.100.b: "Mùa Xuân nên cai trị!"
 pod_seasons_struggle.100.c: "Mùa Hạ nên cai trị!"
 pod_seasons_struggle.100.d: "Mùa Thu nên cai trị!"
 pod_seasons_struggle.101.t: "Mùa Đông Bất Tận"
 pod_seasons_struggle.101.desc: "Sự hỗn loạn mà các mùa phải chịu đựng trong những thế kỷ trước đã để lại một vết nhơ trong trái tim của mọi Fae. Hôm nay bắt đầu chương tiếp theo của thế giới này... Mùa Đông đã đến, và nó sẽ không bao giờ kết thúc.\n\n#EMP 'Mặt trời ẩn mình thấp trên bầu trời của nàng; sợ hãi cái bóng nàng tạo ra,\nKhi Đêm ngồi trong hốc ẩm thấp của mình và chờ đợi,\nĐể nàng chìm sâu xuống dưới những vùng đất băng giá cằn cỗi,\nCho phép sương giá ăn mòn hơi ấm từ những kẻ có máu,\nVà giải phóng những sinh vật săn mồi của khu rừng một lần nữa.'#!"
 pod_seasons_struggle.101.a: "Mùa Đông Vĩnh Cửu"
 pod_seasons_struggle.102.t: "Mùa Xuân Đâm Chồi"
 pod_seasons_struggle.102.desc: "Sự hỗn loạn mà các mùa phải chịu đựng trong những thế kỷ trước đã để lại một vết nhơ trong trái tim của mọi Fae. Hôm nay bắt đầu chương tiếp theo của thế giới này... Mùa Xuân đã tái sinh.\n\n#EMP 'Bình minh nứt vỡ lớp vỏ nguyên sơ của ngày, sự sống mới bắt đầu,\nVà bàn tay tê liệt của mùa đông rã rời tan vỡ,\nTuyết tan chảy xuôi theo hình hài đang lớn lên của Tự Nhiên,\nNhưng cùng với vẻ đẹp của một đóa hoa đang nở,\nKhông đến sức mạnh để bảo vệ nó khỏi Cơn Bão của Nàng.'#!"
 pod_seasons_struggle.102.a: "Mùa Xuân đã trở lại."
 pod_seasons_struggle.103.t: "Mùa Hạ Vĩnh Hằng"
 pod_seasons_struggle.103.desc: "Sự hỗn loạn mà các mùa phải chịu đựng trong những thế kỷ trước đã để lại một vết nhơ trong trái tim của mọi Fae. Hôm nay bắt đầu chương tiếp theo của thế giới này... Mùa Hạ này sẽ kéo dài mãi mãi.\n\n#EMP 'Đỉnh cao của những trái ngọt Tự Nhiên căng mọng trong hơi ấm giữa trưa,\nThời khắc sung mãn nhất của năm đang xoay vần và bóng tối xa nhất,\nMột sự bình yên gây mê chiếm lấy thú vật lẫn con người,\nKhi sự lười biếng của mùa hạ dệt nên tấm áo khủng khiếp của nó,\nBao trùm kẻ yếu trong sự thiếu ý chí, cho phép kẻ xảo quyệt phô bày răng nanh.'#!"
 pod_seasons_struggle.103.a: "Mùa Hạ đã kéo dài."
 pod_seasons_struggle.104.t: "Thế Giới Mùa Thu"
 pod_seasons_struggle.104.desc: "Sự hỗn loạn mà các mùa phải chịu đựng trong những thế kỷ trước đã để lại một vết nhơ trong trái tim của mọi Fae. Hôm nay bắt đầu chương tiếp theo của thế giới này... Mùa Thu là điều tất yếu.\n\n#EMP 'Những sắc màu rơi rụng của hoàng hôn hạ xuống cùng lá úa tàn,\nCũng như đôi cánh bướm là lời cảnh báo; vẻ đẹp của chúng đánh lừa,\nVì khi màu sắc của chúng loang như mực; chúng đang chết\nChắc chắn như sương mù của mùa thì thầm điều đó,\nSự rực rỡ chỉ là vỏ bọc, khi Mùa Thu vẫn tiếp tục dối trá.'#!"
 pod_seasons_struggle.104.a: "Mùa Thu là điều tất yếu."

 pod_seasons_struggle.110.t: "Phân Chia"
 pod_seasons_struggle.110.desc: "Giờ đây đã rõ ràng sẽ không có hồi kết cho vòng xoáy đổ máu này nếu mọi thứ tiếp diễn; các triều đình Fae sẽ không chịu đựng nổi sự thống nhất. Với tư cách nhà đàm phán, ngươi sẽ chọn vùng đất nào thuộc về triều đình nào."
 pod_seasons_struggle.110.a: "Ừm..."
