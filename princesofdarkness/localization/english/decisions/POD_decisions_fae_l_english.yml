 POD_fae_rapture_decision: "Xuất Thần"
 POD_fae_rapture_decision_desc: "Xuất Thần cho phép một kithain thu được Glamour từ chính trí tưởng tượng của mình. Khoảnh khắc Xuất Thần là một khoảnh khắc tột cùng và thuần khiết của cực lạc khi kithain kết nối trực tiếp với [UmbraGlossary('dreaming')]. Hai nửa bản chất của họ hợp làm một trong một khoảnh khắc ngắn ngủi và thoáng qua."
 POD_fae_rapture_decision_tooltip: "Ngươi sẽ sử dụng Xuất Thần."
 POD_fae_rapture_decision_confirm: "Đã thu hoạch!"

