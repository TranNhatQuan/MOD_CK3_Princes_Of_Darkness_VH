 pod_seasons_struggle.120.t: "Triều Đình Của Mọi Mùa"
 pod_seasons_struggle.120.desc: "Những cuộc chiến của quá khứ sẽ ở lại đó, và các triều đình Fae khác sẽ thấy được lợi ích của việc cùng tồn tại."
 pod_seasons_struggle.120.a: "Các Triều Đình Mùa đã được thống nhất."

 pod_seasons_struggle.1001.t: "Lời Chào Của Các Mùa"
 pod_seasons_struggle.1001.desc: "Là lãnh đạo của một triều đình Fae, ngươi nên tham gia Chiến Tranh Mùa."
 pod_seasons_struggle.1001.a: "Đặt kinh đô tại Ireland"
 pod_seasons_struggle.1001.b: "Lấy đất từ một chư hầu"
 pod_seasons_struggle.1001.c: "Gây chiến với một kẻ hoang đàng để lấy đất"
 pod_seasons_struggle.1001.d: "Ta chưa sẵn sàng làm điều này"
 run_away_from_season_war_tooltip: "Đây không phải lần đầu tiên ngươi khước từ Chiến Tranh Mùa."

 the_red_and_white_apple_of_avalon_decision: "Trái Táo Đỏ Và Trắng Của Avalon"
 the_red_and_white_apple_of_avalon_decision_desc: "Trên đỉnh Glastonbury Tor có hai con suối, Trắng và Đỏ, đại diện cho các lực lượng của sự sống và cái chết. Gần hai con suối là một cây táo nhỏ ra quả quanh năm, dù là mùa đông, mùa hạ hay mùa xuân. Một nửa số táo màu đỏ, nhưng nửa còn lại có vỏ trắng như tuyết."
 the_red_and_white_apple_of_avalon_decision_confirm: "Hái Một Trái Táo"
 the_red_and_white_apple_of_avalon_decision_tooltip: "Nhận một hiện vật trái táo."

 albion_pools_decision: "Các Hồ Nước Albion"
 albion_pools_decision_desc: "Ba Hồ Nước Albion huyền bí, ẩn giấu lần lượt tại Cymru, Alba và Breizh, nằm trong số những kho báu được các pháp sư khao khát nhất vì người ta nói rằng ai nắm quyền kiểm soát cả ba hồ nước sẽ cai trị toàn bộ nước Anh. Một hồ được đồn là ban tuổi trẻ vĩnh cửu, một hồ chữa lành mọi vết thương và hồ thứ ba được cho là ban quyền kiểm soát trái tim của người phàm."
 albion_pools_decision_confirm: "Albion nên thuộc về ta"
 albion_pools_decision_tooltip: "Tuyên nhận Albion."
 albion_pools_decision_custom: "[realm_capital|E] của ngươi nằm trong [region|E] [GetGeographicalRegion('ghw_region_britannia').GetName]"

