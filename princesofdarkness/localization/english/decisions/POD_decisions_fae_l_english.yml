 POD_fae_study_true_name_decision: "Học Hỏi Chân Danh"
 POD_fae_study_true_name_decision_desc: "Khám phá một [Glossary('True Name','podgloss.truename')] mới là một công việc đòi hỏi cao. Thường thì một người chép sử đã phát triển một số kỹ năng về Naming biết được vài [Glossary('True Names','podgloss.truename')]."
 POD_fae_study_true_name_decision_tooltip: "Ngươi sẽ cố gắng nâng cao kiến thức của mình về Naming."
 POD_fae_study_true_name_decision_confirm: "Hãy kiên nhẫn"

 POD_agenda_preference_decision: "Ưu Tiên Chương Trình Nghị Sự"
 POD_agenda_preference_decision_desc: "Là người đứng đầu triều đình, ngươi có thể muốn chọn chương trình nghị sự khác để ủng hộ."
 POD_agenda_preference_decision_tooltip: "​Ngươi sẽ thay đổi đức tin của mình."
