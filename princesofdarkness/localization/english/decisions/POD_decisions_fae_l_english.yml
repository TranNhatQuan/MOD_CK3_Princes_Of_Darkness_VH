 seasons_struggle: "Chiến Tranh Mùa"
 seasons_struggle_desc: "$bm_1230_fae_desc$"
 struggle_seasons_phase_opportunity: "Cơ Hội"
 struggle_seasons_phase_opportunity_desc: "Sau một thời gian dài cùng tồn tại tương đối hòa bình trong $struggle_seasons_phase_conciliation$, sự tự mãn bắt đầu hình thành. Cả nông dân lẫn quý tộc đều yên tâm rằng mọi thứ chỉ đơn giản #EMP vận hành#!, cho phép những [characters|E] khôn khéo hơn lợi dụng sự ngây thơ của họ.\n\nCuối cùng, những sự lạm dụng mới sẽ hoặc gây ra một sự leo thang vào $struggle_seasons_phase_hostility$, hoặc là những mưu mô chính trị tinh vi đạt đến một thế cân bằng bấp bênh thông qua $struggle_seasons_phase_conciliation$."
 struggle_seasons_phase_hostility: "Thù Địch"
 struggle_seasons_phase_hostility_desc: "Căng thẳng bùng phát và tính khí trở nên nóng nảy trong $game_concept_struggle_phase_phase$ này. Những hành vi ác ý lặp đi lặp lại và những hiểu lầm leo thang trong $struggle_seasons_phase_opportunity$ đã dẫn đến sự thù ghét ngày càng tăng đối với những [characters|E] có [cultures|E], [faiths|E] khác biệt, hoặc #EMP tệ hơn#!: cả hai.\n\nDù vậy, đổ máu như thế không thể kéo dài mãi mãi. Cuối cùng, hoặc những cái đầu lạnh hơn hoặc đơn giản là sự kiệt sức sẽ đưa hòn đảo đến $struggle_seasons_phase_compromise$."
 struggle_seasons_phase_compromise: "Thỏa Hiệp"
 struggle_seasons_phase_compromise_desc: "Dù là qua sự chán ngán với xung đột của $struggle_seasons_phase_hostility$ hay sự leo thang khéo léo trong $struggle_seasons_phase_conciliation$, $game_concept_struggle_phase_iberia_compromise$ đại diện cho một sự thích nghi ngày càng lớn giữa các dân tộc của Mùa. Những khác biệt bị gạt sang một bên và lịch sử cùng di sản chung gắn kết những kẻ thù cũ lại với nhau.\n\nHòn đảo đứng ở ngã ba đường: nếu xung đột tái xuất hiện, thì $struggle_seasons_phase_opportunity$ đang chờ đợi."
 struggle_seasons_phase_conciliation: "Hòa Giải"
 struggle_seasons_phase_conciliation_desc: "Là kết quả của một $struggle_seasons_phase_compromise$ đáng chú ý, trong $game_concept_struggle_phase_phase$ này, quan hệ giữa các dân tộc của Mùa trở nên thân thiện đến mức người ngoài khó mà lý giải được sự cởi mở của họ. Các [marriages|E] liên [faith|E] đặc biệt phổ biến.\n\nTuy nhiên, điều này không thể kéo dài mãi mãi, và sự lạm dụng lòng tin cuối cùng sẽ đưa $seasons_struggle$ quay trở lại $struggle_seasons_phase_compromise$."

