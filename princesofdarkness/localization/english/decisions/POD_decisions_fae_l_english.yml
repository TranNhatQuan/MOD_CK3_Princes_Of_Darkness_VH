 pod_seasons_struggle.1100.t: "Chương Trình Nghị Sự Ưa Thích"
 pod_seasons_struggle.1100.desc: "Chương trình nghị sự nào là chương trình nghị sự ưa thích của ngươi bây giờ?"
 pod_seasons_struggle.1110.t: "Mùa Ưa Thích"
 pod_seasons_struggle.1110.desc: "Mùa nào là mùa ưa thích của ngươi bây giờ?"

 foster_sprite_decision: "Tìm Kiếm Người Kế Vị"
 foster_sprite_decision_tooltip: "Đầy tớ của ngươi sẽ đề xuất một số ứng viên phù hợp"
 foster_sprite_decision_desc: "True fae không thể sinh sản, nhưng có thể nuôi dưỡng một sprite để tạo ra một true fae. Vì vậy, nếu ngươi không muốn công sức khó nhọc của mình đổ sông đổ bể trong trường hợp xảy ra tai nạn đáng tiếc, ngươi phải chuẩn bị sẵn sàng. Ngươi sẽ yêu cầu đầy tớ của mình đưa ra một số ứng viên phù hợp."
 foster_sprite_decision_effect_tooltip: "Ngươi sẽ được giới thiệu một nhóm ứng viên và có thể chấp nhận một người làm con của chính mình với một khoản phí uy vọng"
 foster_sprite_decision_confirm: "Bắt đầu tìm kiếm"

 a_way_back_to_heaven_objective_decision: "Con Đường Trở Về Thiên Giới"
 a_way_back_to_heaven_objective_decision_desc: "Ban đầu, hsien không có nhiều sự bảo vệ trước những kẻ thù hút chi cho đến khi Tề Thiên Đại Thánh tìm ra con đường trở về Thiên Giới và chia sẻ kiến thức của mình về sự cân bằng cho các vị thần nhỏ. Bằng cách nghiên cứu Nei Tan, và có được tổ rồng mạnh nhất, ngươi có thể trở thành Tao Te Hsien và tự mình trở về Thiên Giới."
 a_way_back_to_heaven_objective_decision_tooltip: "Ngươi sẽ trở thành Tao Te Hsien"
 a_way_back_to_heaven_objective_decision_confirm: "Thiên Giới trong tầm mắt"

 secure_seasons_foothold_decision_title: "Chỗ Đứng Trên Đảo"
 secure_seasons_foothold_decision_desc: "Sự chia rẽ giữa các mùa trên Đảo đang mở ra cơ hội. Họ sẽ không chuẩn bị sẵn sàng cho một mối đe dọa từ bên ngoài."
 secure_seasons_foothold_decision_tooltip: "Sáp nhập một phần của Đảo"
 secure_seasons_foothold_decision_confirm: "Về tay kẻ mạnh nhất"