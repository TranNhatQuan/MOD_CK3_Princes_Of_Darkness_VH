 new_theourgia_arts_objective_decision: "Mở Rộng Thuật Theourgia"
 new_theourgia_arts_objective_decision_desc: "Chúng ta, $POD_splat_mummy_plural$, mắc kẹt trong quá khứ. Chúng ta vẫn dùng phép thuật từ #ONCLICK:CULTURE,[GetCultureByKey('ancient_egyptian').GetID] #TOOLTIP:CULTURE,[GetCultureByKey('ancient_egyptian').GetID] #L Ai Cập Cổ Đại#!#!#!, nhưng từ đó đến nay đã có thứ gì đó mới (và có lẽ tốt hơn?) xuất hiện. Được tạo ra qua nhiều thế hệ #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Pháp Sư#!#!, đây là một bước phát triển rất thú vị có thể cho chúng ta lợi thế trong những năm sắp tới."
