 achieve_ra_hekau_objective_decision: "Đạt Được Ra-Hekau"
 achieve_ra_hekau_objective_decision_desc: "Các Shemsu-Heru thời xưa gọi Ra-Hekau là thuật pháp Hekau tối thượng, sự tinh thông thế giới bằng cách dùng [Glossary('True Names','podgloss.truename')] của vạn vật để bắt chúng phục tùng theo ý muốn. Theo truyền thuyết Ai Cập, Ra-Hekau lần đầu được tiết lộ khi Thần Mặt Trời Ra trao cho Isis [Glossary('True Name','podgloss.truename')] của mình để nàng có thể chữa lành cho hắn khỏi một vụ đầu độc chí mạng. Điều đó cho phép nàng trở thành Nữ Thần Phép Thuật và tạo ra Phép Thuật Sự Sống.\nRa-Hekau đã thất truyền từ lâu và được cho là bất khả học đối với Xác Ướp kể từ đó, nhưng những điều kỳ lạ hơn đã từng xảy ra..."
 achieve_ra_hekau_objective_decision_tooltip: "Quyền năng trên mọi cái tên"
 achieve_ra_hekau_objective_decision_confirm: "Vượt qua giới hạn của phép thuật"
 achieve_ra_hekau_objective_decision_custom1: "Ngươi biết [Glossary('True Names','podgloss.truename')] của #V 25#! [traits|E] #weak ([GetPlayer.MakeScope.ScriptValue('known_trait_true_names_number')])#!"

 POD_shih_summon_decision: "Kêu Gọi Đồng Minh Shih"
 POD_shih_summon_decision_desc: "Mục tiêu của [GetTrait('shih').GetName(GetNullCharacter)] là loại bỏ những sinh vật siêu nhiên đe dọa nhân loại, phù hợp với mục tiêu của chúng ta là chuẩn bị cho họ trước Thời Đại Thứ Sáu. Dù không thực sự là "đồng minh", chúng ta vẫn có thể kêu gọi họ theo thời gian và mong đợi nhận được câu trả lời tích cực."
