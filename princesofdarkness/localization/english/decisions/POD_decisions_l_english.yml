 protecting_knowledge_objective_decision: "Bảo Vệ Tri Thức"
 protecting_knowledge_objective_decision_desc: "Thế giới đang dần bước vào [Glossary('Kỷ Nguyên Thứ Sáu','game_concept_sixth_age_desc')]. Dù kịch bản lý tưởng là ngăn chặn nó, chúng ta phải suy nghĩ thực tế. Và điều đó có nghĩa là chúng ta phải chuẩn bị cho điều tồi tệ nhất, chúng ta phải bảo vệ mọi tri thức mà những người đến sau có thể sử dụng trong thời khắc gian nan sắp tới."
