 repentant_brujah_modifier: "False Brujah Hối Cải"
 repentant_brujah_modifier_desc: "Bị nhục nhã vì dòng dõi từ Troile, những False Brujah tìm kiếm sự cứu chuộc."
 repentant_brujah_tooltip: "Mọi Brujah, trừ True Brujah, sẽ nhận hiệu ứng Brujah Hối Cải. Chúng sẽ tự động chấp nhận trở thành chư hầu và cải đạo theo ngươi chừng nào chúng còn hiệu ứng này."
 end_false_brujah_tooltip: "Mọi Brujah, trừ True Brujah, sẽ nhận hiệu ứng Giết Ngay Khi Gặp, khiến kiếp sống-chết của chúng khó chịu hơn nhiều."


 ashirra_lands_victory_objective_decision: "Vùng Đất Của Đức Tin"
 ashirra_lands_victory_objective_decision_tooltip: "Vùng đất của Hồi giáo là vùng đất của Ashirra."
 ashirra_lands_victory_objective_decision_desc: "Nhiều thánh địa của Hồi giáo đang nằm dưới sự chiếm đóng của những kẻ ngoại đạo hoặc tín đồ giả dối. Chỉ khi hoàn toàn kiểm soát Vùng Đất Của Đức Tin thì [Glossary('Ashirra','game_concept_ashirra_desc')] mới thực sự chiến thắng."
 ashirra_lands_victory_objective_decision_confirm: "Theo ý muốn của Allah."
 ashirra_lands_victory_objective_decision_tooltip2: "Mọi tỉnh của [GetTitleByKey('e_ashirra').GetNameNoTier], [GetTitleByKey('k_egypt').GetNameNoTier], và [GetTitleByKey('k_persia').GetNameNoTier] phải theo đức tin [GetReligionByKey('ashirra_religion').GetName]"


 shepherds_islam_victory_objective_decision: "Chăn Dắt Những Tín Đồ"
 shepherds_islam_victory_objective_decision_tooltip: "Những tín đồ cần những người bảo hộ bất tử."
 shepherds_islam_victory_objective_decision_desc: "Chúng ta đã ở đó bên cạnh chính Nhà Tiên Tri, lời của người vẫn còn ở lại với chúng ta. Người phàm rồi sẽ chết, và thông điệp của Nhà Tiên Tri sẽ bị ghi nhớ sai lệch hoặc tệ hơn, bị bóp méo. Người phàm không thể dẫn dắt Hồi giáo, chỉ có chúng ta mới có thể."
 shepherds_islam_victory_objective_decision_confirm: "Chúng sẽ thấy."
 shepherds_islam_victory_objective_decision_tooltip2: "Hoặc ngươi kiểm soát [GetTitleByKey('e_ashirra').GetNameNoTier], hoặc không ai kiểm soát cả"

 ikhwan_al_safa_egypt_objective_decision: "Trợ Giúp Những Kẻ Mang Ánh Sáng"
 ikhwan_al_safa_egypt_objective_decision_desc: "Những thành viên thực tế hơn của Sayyadin nhận ra rằng các Mummy có nhiều kinh nghiệm và hiểu biết về những kẻ rình rập trong đêm hơn cả Ikhwan al-Safa, và vì thế đã trao cho họ sự trợ giúp."
 ikhwan_al_safa_egypt_objective_decision_tooltip: "Ngươi sẽ thanh tẩy cốt lõi của Vùng Đất Của Đức Tin, và hưởng lợi từ sự giúp đỡ của họ."
 ikhwan_al_safa_egypt_objective_decision_confirm: "Những người bạn bất tử?"
 ikwan_egypt_effect_tt: "Ngươi sẽ có một lựa chọn giữa việc trở thành một Mummy trọn vẹn hoặc hưởng thêm một mạng sống."

 ikhwan_al_safa_arabia_objective_decision: "Giải Phóng Tiếng Rền Rĩ"
 ikhwan_al_safa_arabia_objective_decision_desc: "Tiếng Rền Rĩ bắt đầu sau khi Nhà Tiên Tri chinh phục Mecca và thường được cho là biểu hiện của quyền năng Allah, tỏa ra từ Hòn Đá Đen bên trong Kaaba. Những sinh vật siêu nhiên bị nhiễm bẩn, như ma cà rồng, cảm nhận Tiếng Rền Rĩ như một mớ hỗn tạp than khóc và la hét chói tai. Tiếng Rền Rĩ chỉ ngừng lại một lần duy nhất trong lịch sử của nó, khi những người Qarmatian, thành viên của một giáo phái Hồi giáo, đánh cắp Hòn Đá Đen khỏi Kaaba vào năm 950. Điều này cho phép ma cà rồng Tarique dựng lên những lá bùa phù thủy có thể ngăn chặn một phần Tiếng Rền Rĩ, dù chúng không thể hoàn toàn làm nó câm lặng."
 ikhwan_al_safa_arabia_objective_decision_tooltip: "Ngươi sẽ giải phóng Tiếng Rền Rĩ khỏi tà thuật độc ác của Tarique."
 ikhwan_al_safa_arabia_objective_decision_confirm: "Allah sẽ lên tiếng"
 ikhwan_al_safa_arabia_objective_decision_effect_tooltip: "Tiếng Rền Rĩ sẽ giải phóng sức mạnh từng bị kìm nén của nó, khiến mọi ma cà rồng ở Arabia phải lùi bước trước đức tin.\nChúng sẽ mất tước hiệu và ngươi sẽ thừa hưởng chúng."

 ikhwan_al_safa_persia_objective_decision: "Liên Lạc Với Taftani"
 ikhwan_al_safa_persia_objective_decision_desc: "Những pháp sư Ba Tư khép kín được biết đến với tên Taftani từng là đồng minh thỉnh thoảng trong quá khứ. Việc chứng minh giá trị bản thân và rèn nên một liên minh bền vững với họ có thể mở ra những khả năng hợp tác mới cho đôi bên."
 ikhwan_al_safa_persia_objective_decision_tooltip: "Taftani sẽ dạy ngươi một dạng ma thuật yếu hơn của họ."
 ikhwan_al_safa_persia_objective_decision_confirm: "Ta sẽ tìm ra cách"
 ikhwan_al_safa_persia_objective_decision_effect_tooltip: "[ROOT.Char.GetFaith.GetName] sẽ nhận [trait|E] [GetTrait('sorcerer').GetName( GetPlayer )] khi thụ phong."

 akritai_mend_hunter_schism_decision: "Hàn Gắn Đại Ly Giáo Của Hunter"
 akritai_mend_hunter_schism_decision_desc: "Đại Ly Giáo đã chia rẽ Giáo hội Kitô giáo và Thập Tự Chinh lần thứ 4 đã khiến phe Chính Thống suy yếu quyền lực, nhưng nếu cả năm Tòa Giám mục của Ngũ Đầu Chế đều ủng hộ Akritai, Tòa Dị Giáo Bóng Tối của Công giáo sẽ phải quy phục chúng ta."
 akritai_mend_hunter_schism_decision_tooltip: "Ta sẽ thống nhất lại Kitô giáo"
 akritai_mend_hunter_schism_decision_confirm: "Một Chúa, một Giáo hội!"
 akritai_schism_tt: "Các nhân vật Tòa Dị Giáo Bóng Tối sẽ cải sang đức tin Akritai.\nCác nhân vật Akritai giờ sẽ có quyền tiếp cận Thánh Thuật."

 judge_sorcery_objective_decision: "Kabbalah"
 judge_sorcery_objective_decision_desc: "Ngươi sẽ nghiên cứu các văn bản thiêng liêng và thực hành của Talmud bí mật, một tuyển tập những lời dạy và tranh luận của các Judge thời trước, hy vọng tìm ra bí mật để rút ra sức mạnh của ma thuật dân gian cho riêng mình."
 judge_sorcery_objective_decision_tooltip: "Ngươi sẽ tìm ra sức mạnh chứa đựng trong huyền học Do Thái."
 judge_sorcery_objective_decision_confirm: "Ta sẽ tìm ra cách"

 #hunter_theurgist_ordination_objective_decision: "Theurgy"
 #hunter_theurgist_ordination_objective_decision_desc: "You will study the sacred texts and hopefully find the secret of how to invoke power from God."
 #hunter_theurgist_ordination_objective_decision_tooltip: "You will find the power contained from Theurgy."
 #hunter_theurgist_ordination_objective_decision_confirm: "I will find the way"

 POD_demon_unearthbound_decision: "Quét Sạch Ảnh Hưởng Quỷ Dữ"
 POD_demon_unearthbound_decision_tooltip: "Xử lý vùng đất bị nhiễm bẩn."
 POD_demon_unearthbound_decision_desc: "Một phần lãnh địa của ngươi đã bị nhiễm ảnh hưởng quỷ dữ. Đây sẽ là một quá trình tốn kém, nhưng có thể khắc phục được."
 POD_demon_unearthbound_decision_confirm: "Ta cần một thầy trừ tà!"

 POD_demon_maintenance.30.t: "Quét Sạch Ảnh Hưởng Quỷ Dữ"
 POD_demon_maintenance.30.desc: "Ảnh hưởng quỷ dữ hầu hết là một thứ dai dẳng khắp nơi. Nhưng có những trường hợp mà cư dân của Địa Ngục kém kín đáo hơn, và cố gắng làm sa đọa chính vùng đất đó với hy vọng ràng buộc bản thân chúng vào nơi ấy.\nNgươi không chắc chắn lắm về "tại sao" và "làm thế nào" nhưng kết quả cuối cùng là một cảnh tượng kinh hoàng, khi chính bản chất tự nhiên bị nhiễm bẩn bởi sự hiện diện địa ngục này. May thay, việc loại bỏ một sự hiện diện như vậy là khả thi nếu ngươi dốc tâm trí (và tài nguyên) vào đó. Ngươi đã tập hợp những thợ săn quỷ dữ vĩ đại nhất sẵn lòng gia nhập cùng ngươi trong khu vực này và đã sẵn sàng lên đường."
 POD_demon_maintenance.30.option.a: "Ta trục xuất ngươi!"

 POD_demon_earthbound_duchy_decision: "Gia Tăng Ảnh Hưởng Quỷ Dữ"
 POD_demon_earthbound_duchy_decision_tooltip: "Tăng cấp bậc [title|E] bị ràng buộc của ngươi."
 POD_demon_earthbound_duchy_decision_desc: "Ngươi kiểm soát một dải đất rộng lớn. Việc lan tỏa những xúc tu quỷ dữ của ngươi khắp khu vực này sẽ đòi hỏi ít nhiều nỗ lực nhưng sẽ củng cố vị thế của ngươi trong vùng."
 POD_demon_earthbound_duchy_decision_confirm: "Ta sẽ có mặt khắp nơi!"

 POD_demon_earthbound_kingdom_decision: "Gia Tăng Ảnh Hưởng Quỷ Dữ"
 POD_demon_earthbound_kingdom_decision_tooltip: "Tăng cấp bậc [title|E] bị ràng buộc của ngươi."
 POD_demon_earthbound_kingdom_decision_desc: "Ngươi kiểm soát một dải đất rộng lớn. Việc lan tỏa những xúc tu quỷ dữ của ngươi khắp khu vực này sẽ đòi hỏi ít nhiều nỗ lực nhưng sẽ củng cố vị thế của ngươi trong vùng."
 POD_demon_earthbound_kingdom_decision_confirm: "Ta sẽ có mặt khắp nơi!"

 POD_demon_earthbound_empire_decision: "Gia Tăng Ảnh Hưởng Quỷ Dữ"
 POD_demon_earthbound_empire_decision_tooltip: "Tăng cấp bậc [title|E] bị ràng buộc của ngươi."
 POD_demon_earthbound_empire_decision_desc: "Ngươi kiểm soát một dải đất rộng lớn. Việc lan tỏa những xúc tu quỷ dữ của ngươi khắp khu vực này sẽ đòi hỏi ít nhiều nỗ lực nhưng sẽ củng cố vị thế của ngươi trong vùng."
 POD_demon_earthbound_empire_decision_confirm: "Ta sẽ có mặt khắp nơi!"

 POD_demon_earthbound_kupala_decision: "Biên Niên Sử Transylvania"
 POD_demon_earthbound_kupala_decision_tooltip: "Đã đến lúc chiếm lấy Transylvania từ chủ nhân hiện tại của nó, Kupala."
 POD_demon_earthbound_kupala_decision_desc: "Có lẽ là con quỷ đầu tiên thoát khỏi Ngục Tù Vực Thẳm, Kupala đã tự ràng buộc chặt chẽ với Transylvania. Chừng nào nó còn chưa bị thách thức, nó sẽ là một đối thủ nguy hiểm cho sự thăng hoa của ngươi."
 kupala_victory_objective_decision_custom: "Ngươi cần một vũ khí được tạo ra chuyên biệt để tiêu diệt Kupala: hoặc [GetPODArtifactName('sword_of_dracula_link')] hoặc nguyên mẫu của nó, [GetPODArtifactName('ainkurn_link')]."
 kupala_victory_objective_decision_custom2: "Cách duy nhất để ràng buộc (hoặc giải phóng) Kupala khỏi vùng đất này có thể được tìm thấy trong Incunabulum Kupalam, được tạo ra bằng cách sở hữu năm cổ vật Hiệp Ước Về Kupala."
 POD_demon_earthbound_kupala_decision_confirm: "Transylvania là của ta!"

 sin_conversion_decision: "Cải Đạo Hàng Loạt"
 sin_conversion_decision_tooltip: "Cải đạo vương quốc của ngươi bằng Rồng Tội Lỗi của ngươi"
 sin_conversion_decision_desc: "Là một người huấn luyện rồng tội lỗi, ngươi có thể lan tỏa sức mạnh của nó lên dân chúng địa phương."
 sin_conversion_decision_confirm: "Đã đến lúc phạm tội!"
 sin_conversion_decision_effect_tooltip: "Các quận trong vương quốc của ngươi sẽ cải sang đức tin của ngươi."

 commit_suicide_decision_desc_mummy: "Một Mummy có sức mạnh để chấm dứt sự tồn tại bất tử của chính mình. Osiris không ép buộc sự sống vĩnh cửu lên bất kỳ ai. Một Mummy tự sát được xem như không còn ý chí sống, bất kể Ý Chí của hắn ra sao. Mummy đó phải có ý định chết thật sự và vĩnh viễn. Những hành động tự sát mà một Mummy thực hiện vì lý do khác sẽ không chấm dứt sự tồn tại của Mummy đó."

 POD_infernalist_study_demonology_1_decision: "Học Quỷ Học"
 POD_infernalist_study_demonology_1_decision_tooltip: "Nhận đặc điểm quỷ học."
 POD_infernalist_study_demonology_1_decision_desc: "Nếu sức hút của cái ác đã đầy mê hoặc, thì sức mạnh nó có thể ban tặng còn hấp dẫn hơn thế. Có những tri thức cấm kỵ mà ngươi có thể tìm hiểu..."
 POD_infernalist_study_demonology_1_decision_confirm: "Học vấn địa ngục"
 POD_infernalist_study_demonology_2_decision: "Nghiên Cứu Quỷ Học"
 POD_infernalist_study_demonology_2_decision_tooltip: "Đặc điểm quỷ học nâng cao."
 POD_infernalist_study_demonology_2_decision_desc: "Tri thức về quỷ dữ là một lĩnh vực rộng lớn. Còn rất nhiều điều để học, còn rất nhiều sức mạnh để đạt được."
 POD_infernalist_study_demonology_2_decision_confirm: "Nghiên cứu địa ngục"
 POD_infernalist_study_demonology_3_decision: "Tinh Thông Quỷ Học"
 POD_infernalist_study_demonology_3_decision_tooltip: "Hoàn thành nâng cấp đặc điểm quỷ học."
 POD_infernalist_study_demonology_3_decision_desc: "Những bí mật được khao khát nhất của lũ quỷ mang một cái giá khủng khiếp. Nhưng chúng có thể mở khóa những sức mạnh khủng khiếp không kém nào?"
 POD_infernalist_study_demonology_3_decision_confirm: "Tinh thông địa ngục"

 POD_infernalist_sacrifice_to_great_demon_decision: "Hiến Tế Cho Một Đại Công Tước Địa Ngục"
 POD_infernalist_sacrifice_to_great_demon_decision_tooltip: "Chọn con quỷ lớn hơn để dâng lễ hiến tế."
 POD_infernalist_sacrifice_to_great_demon_decision_desc: "Với sự tinh thông quỷ học của mình, ngươi có thể thực hiện một nghi lễ hiến tế vĩ đại dâng lên một trong các Đại Công Tước Địa Ngục."
 POD_infernalist_sacrifice_to_great_demon_decision_confirm: "Hãy ban phước cho ta!"
 POD_infernalist_sacrifice_to_great_demon_decision_custom: "Ngươi có thể thực hiện các lễ hiến tế như một [character_interaction|E] lên chính mình sau khi chọn con quỷ lớn hơn để dâng lễ."
 POD_demon_maintenance.40.t: "Lựa Chọn Địa Ngục"
 POD_demon_maintenance.40.desc: "Với sự tinh thông quỷ học của mình, ngươi có thể thực hiện một nghi lễ hiến tế vĩ đại dâng lên một trong các Đại Công Tước Địa Ngục.\nNăm phó tướng của Lucifer từ lâu đã là đỉnh cao của thứ bậc Địa Ngục, cạnh tranh lẫn nhau để làm sa đọa Tạo Vật và trả thù Chúa Trời. Chúng luôn tìm kiếm thêm tín đồ và có thể là những sinh vật hào phóng với những kẻ tôn vinh chúng... nhưng luôn có một cái giá phải trả ở cuối cùng."
