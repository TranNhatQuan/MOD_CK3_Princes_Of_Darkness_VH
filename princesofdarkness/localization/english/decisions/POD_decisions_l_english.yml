 restore_sisters_of_st_john: "Khôi Phục Các Nữ Tu Sĩ Thánh John"
 restore_sisters_of_st_john_tooltip: "Chừng nào còn một nữ tu sĩ sống sót, sứ mệnh của chúng ta sẽ còn tiếp tục."
 restore_sisters_of_st_john_desc: "Sự sụp đổ của nhánh chính của Dòng Tu không đồng nghĩa với sự hủy diệt của nó. Bất kỳ nữ tu sĩ nào cũng có thể khoác lên chiếc áo choàng và tiếp tục công việc thánh thiện."
 restore_sisters_of_st_john_confirm: "Chúng ta đã giành lại Quê Nhà."
 restore_sisters_of_st_john_effect_tooltip: "Ngươi sẽ tái tạo [title|E] Vương Quốc Các Nữ Tu Sĩ Thánh John." 
 restore_house_murnau: "Khôi Phục Lãnh Địa Của Nhà Murnau"
