 montano_decision: "Sóng Trên Biển"
 montano_decision_tooltip: "$pod_clan$ Lasombra cần một bàn tay dẫn dắt vững mạnh"
 montano_decision_desc: "Nếu ngươi muốn cứu vãn tình thế nguy khốn của Sea of Shadows, ngươi phải thể hiện sức mạnh của mình trong các vấn đề của Ý"
 montano_decision_effect_tooltip: "Việc khôi phục quyền lực của ngươi sẽ giúp ngươi dễ dàng chư hầu hóa các Vương Quốc Lasombra hơn"
 montano_decision_confirm: "Một $pod_clan$, một lãnh đạo"
 qawiyya_decision: "Cứu Lấy Damascus"
 qawiyya_decision_tooltip: "Thời gian đang cạn dần cho người láng giềng sa cơ của ngươi"
 qawiyya_decision_desc: "Ngươi đã thề sẽ cứu Damascus càng sớm càng tốt. Và cuộc chiến thông tin sai lệch của Baali nhắm vào ngươi càng khiến việc này trở nên cấp bách hơn..."
 qawiyya_decision_effect_tooltip: "Ngươi sẽ dập tắt những tin đồn xấu xa nhắm vào ngươi."
 qawiyya_decision_confirm: "Salubri vẫn chưa tuyệt diệt"
 petaniqua_decision: "Bước Vào Xoáy Ốc Đen"
 petaniqua_decision_tooltip: "Giải pháp duy nhất nằm sâu dưới lòng đất"
 petaniqua_decision_desc: "Ngươi có lẽ sẽ chẳng tìm thấy gì ngoài điên loạn và cái chết ở nơi này nhưng... dù sao ngươi cũng chẳng còn gì để mất"
 petaniqua_decision_effect_tooltip: "Ngươi sẽ cố gắng tìm một chút sự thật trong bóng tối bên dưới, nhưng rất có thể sẽ chỉ tìm thấy thêm điên loạn.\nRất có khả năng ngươi sẽ chỉ gặp phải căng thẳng và đau khổ. Có một cơ hội rất nhỏ rằng Petaniqua có thể tìm ra điều nàng đang tìm kiếm..."
 petaniqua_decision_confirm: "Nhìn chằm chằm vào vực thẳm..."
 poltzimi_objective_decision: "Một Trung Tâm Quyền Lực Mới"
 poltzimi_objective_decision_desc: "Đã quá lâu rồi các đồng tộc Carpathia của ngươi khinh miệt sự thô kệch bị cho là của ngươi. Trong khi lãnh địa của ngươi nằm ở rìa Voivodate và không cổ xưa bằng các thái ấp cấu thành nên nó, Vương Quốc Ba Lan và kinh đô của nó, Kraków, lại trù phú hơn và gần với các vấn đề của thế giới rộng lớn hơn bất kỳ phần nào của Carpathia. Việc chứng minh quyền bá chủ của ngươi ở đây sẽ tạo nên một sự dịch chuyển không thể phủ nhận của trung tâm quyền lực $pod_clan$ về phía ngươi."
 poltzimi_objective_decision_tooltip: "Cho $pod_clan$ thấy quyền lực thực sự nằm ở đâu."
 poltzimi_objective_decision_effect_tooltip: "Quyền cai trị của ngươi ở Kraków sẽ đánh dấu ngươi là người xứng đáng lãnh đạo các voivode."
 poltzimi_objective_decision_confirm: "Rồng Wawel gầm thét!"
 invite_ashen_prospect_decision: "Mời Ứng Viên Tro Tàn"
 invite_ashen_prospect_decision_desc: "Phương pháp đầu tiên để ước lượng trí tuệ của một lãnh chúa là nhìn vào những người vây quanh ông ta. Một Prince khôn ngoan giữ những kẻ sẽ phục vụ mình bằng lòng trung thành, sức mạnh và niềm tin ở gần bên và ban thưởng hậu hĩnh cho họ."
 invite_ashen_prospect_decision_confirm: "Triệu tập những ai sẽ phục vụ chính nghĩa của ngươi!"
 invite_ashen_prospect_decision_tooltip: "Có những người đàn ông và phụ nữ tài giỏi có thể phục vụ một Prince lừng danh..."
 invite_ashen_prospect_decision_effect_tooltip: "Ba kẻ tay sai tiềm năng đến triều đình ngươi, sẵn sàng lấy lòng."
 #join_web_of_knives_decision: "Join the Web of Knives"
 #join_web_of_knives_decision_tooltip: "Petition the Banu Haqim to join a deadly web of assassins"
 #join_web_of_knives_decision_confirm: "Get my knife"
 #join_web_of_knives_decision_desc: "The Banu Haqim assassin network known as the Web of Knives occasionally takes on outsider members. If you think you have what it takes to make it as an assassin , you can petition to the Banu Haqim to be included in the web, allowing you to hunt bounties and earn rewards.... for a price. To make it into the web, you must have skill, a good reputation with the Banu Haqim, a willingness to pay tribute to the owners of the web and pass a trial."
 #join_web_of_knives_decision_ct: "You will pass a trial. If you succeed, you will become a member of the Web of Knives, able to hunt targets with a price on their head. However, you must pay a monthly tribute and a part of your earnings to the Banu Haqim."
 #NEED_BANU_HAQIM_DYNAST_TO_LIKE_ME_LOC: "The Head of the Banu Haqim dynasty must approve of you"
 fellow_web_of_knives_member_loc: "Web of Knives không nhận hợp đồng nhắm vào đồng đạo Banu Haqim."
 #wok_outside_areas_tt: "This option is only available in areas with strong Web of Knives presence, like Western Europe, India, North Africa or the Middle East."
 #wok_core_areas_tt: "This option is only available in areas where the Web of Knives is at is strongest, meaning the Middle East, Asia Minor, Iberia and North Africa."
 #skilled_assassin: "Be a skilled killer (either more than 10 intrigue or more than 45 prowess)"
 #cant_fight_banu_haqim: "Not in war with any Banu Haqim"
 #leave_web_of_knives_decision: "Leave the Web of Knives"
 #leave_web_of_knives_decision_tooltip: "Part ways with the web and stop paying tribute."
 #leave_web_of_knives_decision_confirm: "Some rest is in order...."
 #leave_web_of_knives_decision_desc: "Being a member of the Web of Knives is grueling and expensive - the hard training, the risk to your life, the drain of time and resources.... And on top of all, you even had to pay a fee for each kill! No one would fault you if you can't cut it.... Well, almost no one."
 #leave_web_of_knives_decision_ct: "You will leave the Web of Knives, no longer able to accept bounties."
 become_vampire_decision: "Tìm Kiếm Sự Trao Truyền"
 become_vampire_decision_desc: "Có lẽ đã đến lúc ghé thăm một người bạn ngươi quen biết và cầu xin sự bất tử?"
 become_vampire_decision_tooltip: "Bằng cách sử dụng một [character_interaction|E] lên bất kỳ ma cà rồng còn sống nào khác là bạn của ngươi, ngươi sẽ có thể chọn một nhân vật để trở nên có liên hệ."
 become_vampire_decision_confirm: "Hãy làm điều đó"
