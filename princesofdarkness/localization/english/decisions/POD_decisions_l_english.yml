 reckoning_war_of_shame_objective_decision: "Đền Tội Cho Cuộc Chiến Ô Nhục"
 reckoning_war_of_shame_objective_decision_tooltip: "Ngươi sẽ báo thù cho [Glossary('Wan Xian','game_concept_kuei_jin_desc')] bị tha hóa và kết thân với người Garou."
 reckoning_war_of_shame_objective_decision_desc: "Trong lúc sa cơ, những $pod_kueijin$ đầu tiên đã phát động một cuộc chiến ô nhục chống lại $glossary_fera$, gần như tận diệt một số trong bọn họ. Để sửa chữa lỗi lầm này, các Ổ Rồng bị đánh cắp trong cuộc chiến đó phải được trả lại cho những người chăm sóc chúng, và linh hồn tổ tiên của họ phải được phục hồi."
 reckoning_war_of_shame_objective_decision_confirm: "Báo thù là của chúng ta"
 reckoning_war_of_shame_objective_decision_custom1: "[GetTitleByKey('c_beshbalik').GetName] phải do một $glossary_fera$ kiểm soát"
 reckoning_war_of_shame_objective_decision_custom2: "[GetTitleByKey('c_shazhou').GetName] phải do một $glossary_fera$ kiểm soát"
 reckoning_war_of_shame_objective_decision_custom3: "[GetTitleByKey('c_dunhuang').GetName] phải do một $glossary_fera$ kiểm soát"
 reckoning_war_of_shame_objective_decision_effect_tooltip: "Một Hakken sẽ gia nhập triều đình ngươi."
 wheel_ages_lose_dharma_prevented_tt: "#warning Nếu hoàn thành trước năm 1350, việc này sẽ vô hiệu hóa điểm trừ [Glossary('Dharma','podgloss.dharma')] mà thường sẽ xảy ra vào thời điểm đó.#!"

 unshameer_modifier: "Bạn Hữu Của Fera"

 reckoning_dragon_river_war_objective_decision: "Chín Mặt Trời Của Cuộc Chiến Sông Rồng"
 reckoning_dragon_river_war_objective_decision_tooltip: "Ngươi sẽ gỡ bỏ lời nguyền mặt trời áp lên [Glossary('Wan Kuei','game_concept_kuei_jin_desc')]."
 reckoning_dragon_river_war_objective_decision_desc: "Cuộc Chiến Sông Rồng là một cuộc chiến kinh hoàng thời xưa đã cuốn theo gần như mọi sinh vật siêu nhiên trong Trung Nguyên. Dù nguyên nhân và diễn biến của cuộc chiến bị màn sương thời gian che khuất, kết quả của nó thì rõ ràng: lời nguyền của Nghệ khiến ánh mặt trời trở nên chí mạng đối với $pod_kueijin$.\nNếu có ai nghiên cứu chuyện thực sự đã xảy ra và tìm ra cây cung huyền thoại mà Nghệ đã dùng để xuyên thủng mặt trời, một vài kết quả kỳ diệu có thể xảy ra."
 reckoning_dragon_river_war_objective_decision_confirm: "Xuyên thủng lời nguyền?"
 sunny_wankuei: "[GetTrait('kueijin').GetName( GetPlayer )] sẽ không còn chịu thương tổn từ các năng lực gây ra ánh nắng nữa."
 sun_curse_lifter_modifier: "Người Gỡ Bỏ Lời Nguyền Mặt Trời"
 wheel_ages_lose_godbodies_modifier_prevented_tt: "#warning Nếu hoàn thành trước năm 1350, việc này sẽ vô hiệu hóa việc mất hiệu ứng Godbodies mà lẽ ra sẽ xảy ra với $pod_kueijin$ vào thời điểm đó.#!"
 shih_curse_lifter_tt: "Khi được hoàn thành bởi một Shih, mục tiêu này sẽ khiến $pod_kueijin$ không theo phe Địa Ngục không còn xem đặc điểm Shih là một tội lỗi nữa."

 little_god_reinstatement_objective_decision: "Phục Hồi Các Tiểu Thần"
 little_god_reinstatement_objective_decision_tooltip: "Ngươi sẽ chấm dứt cuộc lưu đày của Hsien."
 little_god_reinstatement_objective_decision_desc: "Các quan lại của Thiên Đình đã bị phế truất trong những ngày tháng hỗn loạn sau sự sa cơ của $pod_kueijin$. Giờ đây bị buộc phải sống như người phàm, họ đã từ bỏ vị trí của mình trong trật tự vạn vật.\nThúc đẩy họ một lần nữa chấp nhận sứ mệnh do trời định, và buộc kẻ khác tuân theo quyền uy của họ khi cần thiết, sẽ giúp ích rất nhiều trong việc hàn gắn trật tự thiên giới đã suy yếu."
 little_god_reinstatement_objective_decision_confirm: "Một kỷ nguyên (tiểu) thần thánh mới."
 hsien_fae: "Mọi hsien sẽ mất đặc điểm [GetTrait('changeling').GetName( GetPlayer )] và có được đặc điểm [GetTrait('fae').GetName( GetPlayer )]."
 best_mediator_modifier: "Người Hòa Giải Thiên Giới"
 little_god_decision_custom: "Ngươi cần ít nhất 20 điểm ở mọi chỉ số (trừ võ lực). Các thành viên [GetPlayer.Custom('PODCoterie')] của ngươi cũng được tính."
 wheel_ages_political_instability_prevented_tt: "#warning Nếu hoàn thành trước năm 1350, việc này sẽ tránh được bất ổn chính trị mà lẽ ra sẽ xảy ra vào thời điểm đó.#!"

 #back_to_third_age_objective_decision: "Return to the Third Age"
 #back_to_third_age_objective_decision_tooltip: "You will push the wheel back to the [Glossary('Kỷ Nguyên Thứ Ba','game_concept_third_age_desc')]."
 #back_to_third_age_objective_decision_desc: "With the [Glossary('Kỷ Nguyên Thứ Tư','game_concept_fourth_age_desc')] secured, it is time to bring back the [Glossary('Kỷ Nguyên Thứ Ba','game_concept_third_age_desc')]."
 #back_to_third_age_objective_decision_confirm: "Even further back."
 #back_to_third_age: "The Middle Kingdom will return to the [Glossary('Kỷ Nguyên Thứ Ba','game_concept_third_age_desc')]"
 #back_to_third_age_objective_decision_custom1: "The war of shame must be avenged."
 #back_to_third_age_objective_decision_custom2: "The dragon river war must be healed."
 #back_to_third_age_objective_decision_custom3: "The Little Gods must be reinstated."
 #back_to_third_age_objective_decision_custom4: "The willworkers of the Middle Kingdom, the Chi'n Ta, must make peace."
 #reverser_of_wheel_modifier: "The Wheel Worker"

 #unsevering_objective_decision: "Mend the Severing"
 #unsevering_objective_decision_tooltip: "You will try to weaken the web containing the $glossary_wyrm$."
 #unsevering_objective_decision_desc: "[Glossary('San Yuan', 'glossary_triat_tt')], was brought into existence, and life as it is known today was formed. But the Severing happened, the Grand Spider imprisoned the Centipede, bringing him to madness. We will free and heal (or destroy all corrupted parts of) the Centipede... but first we must weaken him to make him more controllable."
 #unsevering_objective_decision_confirm: "Rebalancing the cosmic scales."
 #unsevering_objective_decision_custom: "There must be no wyrmish [independent_ruler|E] on the map."
 #unsevering_objective_decision_custom_ex: "$unsevering_objective_decision_custom$ #weak ([example.GetFirstName])#!"
 #unsevering_objective_decision_effect_tooltip: "All gauntlets and shrouds will be weakened to level #V 1#!."
 #wall_beaker_modifier: "Breaker of the Wall"

 unhell_objective_decision: "Quấy Nhiễu Ma Hoàng"
 unhell_objective_decision_tooltip: "Hắn sẽ phải chiến đấu cho từng bước lên ngai vàng của mình."
 unhell_objective_decision_desc: "Sự xuất hiện của [Glossary('Ma Hoàng','podgloss.demonemperor')] là một điều tất yếu ở Trung Nguyên. Nhưng hắn vẫn có thể bị làm chậm bước và suy yếu bởi những kẻ đủ can đảm và chuẩn bị kỹ càng để đối đầu với tay sai của hắn."
 unhell_objective_decision_confirm: "Chiến thắng... tạm thời."
 unhellish_modifier: "Khắc Tinh Của Yomi"
 wheel_ages_akuma_buff_prevented_tt: "#warning Nếu hoàn thành trước năm 1350, việc này sẽ tránh được đợt tăng sức mạnh cho [akuma|E] mà lẽ ra sẽ xảy ra vào thời điểm đó.#!"
 unhell_objective_decision_tt: "Ngươi cần một vũ khí #ILLUSTRIOUSPURPLE Lừng Danh#! và một áo giáp #ILLUSTRIOUSPURPLE Lừng Danh#!.\nNgươi cũng cần một chiếc mũ giáp thuộc bất kỳ độ hiếm nào."

 #unkuei_objective_decision: "Looking for a Second Era"
 #unkuei_objective_decision_tooltip: "Divine power engulfing the world again."
 #unkuei_objective_decision_desc: "The fire that sleeps within all, awakens again. The original Second Era ended because evil took root into our hearts. We shall prepare for the awakening of divine power in the mortals and them becoming imbued... and do better than the first Second Era."
 #unkuei_objective_decision_confirm: "Imbued with divinity."
 #unkuei_objective_decision_effect_tooltip: "[Glossary('Wan Kuei','game_concept_kuei_jin_desc')] will have a much easier time advancing their [Glossary('Dharma','podgloss.dharma')], and all powers can be unlocked regardless of [Glossary('Dharma','podgloss.dharma')] level."
 #imbued_teacher_modifier: "Imbued Bringer"

 #back_to_second_age_objective_decision: "Return to the Second Age"
 #back_to_second_age_objective_decision_tooltip: "You will push the wheel back to the [Glossary('Kỷ Nguyên Thứ Hai','game_concept_second_age_desc')]."
 #back_to_second_age_objective_decision_desc: "The moment has finally arrived, the cleansing of all evil and corruption from the world. It is our last battle, our last journey, our last war. We will undo the Severing and purify the Centipede. We will slay the [Glossary('Yama Kings','podgloss.yamaking')] and destroy the [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')]. We will find a way to heaven for all."
 #back_to_second_age_objective_decision_confirm: "The perfect ending."
 #back_to_second_age: "The Middle Kingdom will return to the [Glossary('Kỷ Nguyên Thứ Hai','game_concept_second_age_desc')]"
 #middle_kingdom_ending_tooltip: "With the [Glossary('Kỷ Nguyên Thứ Hai','game_concept_second_age_desc')] returning, your game will be over as the world you once knew will be forever changed."

 sacrifice_perk_from_obtenebration_decision: "Hy Sinh Obtenebration Để Lấy Abyss Mysticism"
 sacrifice_perk_from_obtenebration_decision_tooltip: "Tiến bước trên con đường này đòi hỏi sự hy sinh."
 sacrifice_perk_from_obtenebration_decision_desc: "Hy sinh một cấp Obtenebration để tăng cường sự tinh thông Abyssal Mysticism của ngươi, mở khóa [bs_rituals|E] mới."
 sacrifice_perk_from_obtenebration_decision_confirm: "Một sự hy sinh xứng đáng."

 daimyos_presence_decision: "Sự Hiện Diện Của Daimyo"
 daimyos_presence_decision_tooltip: "Tập Trung"
 daimyos_presence_decision_desc: "Ràng buộc danh dự binh lính vào sự nghiệp của ngươi"
 daimyos_presence_decision_confirm: "Chuẩn bị khơi dậy danh dự"
 daimyos_presence_decision_effect: "Ngươi sẽ có thể mở khóa một đội quân [men_at_arms|E] mới trong số các lựa chọn sau:\n$BULLET_WITH_TAB$[GetMaA('POD_ronin_hatamoto').GetName]\n$BULLET_WITH_TAB$[GetMaA('POD_ronin').GetName]\n$BULLET_WITH_TAB$[GetMaA('POD_yumihiki').GetName]\n$BULLET_WITH_TAB$[GetMaA('POD_yumihiki_riders').GetName]\n$BULLET_WITH_TAB$[GetMaA('POD_sojutsuka').GetName]\n$BULLET_WITH_TAB$[GetMaA('POD_sojutsuka_riders').GetName]\n"
 daimyos_presence_decision_effect_2: "Nếu ngươi đã đưa ra lựa chọn của mình, ngươi cũng có thể dùng quyết định này để thay đổi nó, miễn là ngươi không có đội quân nào thuộc các loại trên."

 vaulderie_decision: "Thực Hiện Vaulderie"
 vaulderie_decision_desc: "Bằng cách thực hiện một nghi lễ và uống từ một chiếc cốc chứa đầy $pod_vitae$ chung của mọi thành viên [GetPlayer.Custom('PODCoterie')], người ta có thể tạo ra một [Glossary('Khế Ước Máu','game_concept_bloodbond_desc')] tập thể với những đặc tính đặc biệt. Mối liên kết này, gọi là Vinculum, phá hủy mọi khế ước máu hiện có và không suy giảm theo thời gian. Những người tham gia sẽ cảm nhận được lòng trung thành mãnh liệt với nhau, mà không vướng phải sự ràng buộc cảm xúc thường đi kèm với khế ước máu."
 vaulderie_decision_tooltip: "Rèn nên mối liên kết bất khả phá vỡ với đồng đội ngươi"
 vaulderie_decision_confirm: "Không xiềng xích, không chủ nhân"
 vaulderie_decision_is_valid: "Ngươi có một thành viên [GetPlayer.Custom('PODCoterie')] mang dòng máu ma cà rồng #weak ($POD_splat_vampire$, $POD_splat_ghoul$, $POD_splat_revenant$)#! chưa từng tham gia nghi lễ này"
 vaulderie_decision_effect: "Mọi thành viên [GetPlayer.Custom('PODCoterie')] mang dòng máu ma cà rồng sẽ có được [perpetual_hooks|E] lẫn nhau. Những lợi ích này sẽ mất đi khi rời khỏi [GetPlayer.Custom('PODCoterieNoTooltip')]."
 POD_vaulderie_toast: "Mối Liên Kết Rèn Trong Máu"
 POD_vinculum_modifier: "Vinculum"
 POD_vinculum_modifier_desc: "Không thể bị [Glossary('Khế Ước Máu','game_concept_bloodbond_desc')]."

 overwork_capital_decision: "Vắt Kiệt Sức Kinh Đô"
 overwork_capital_decision_desc: "Thành phố vẫn còn ngủ say. Nó mơ màng một cách yếu ớt về tiềm năng chưa được khai phá.\nHãy đánh thức nó, hỡi Kẻ Tìm Kiếm. Đưa nó vào cuộc sống. Đường phố sẽ như những mạch máu, những công trình vĩ đại sẽ hóa cứng như xương cốt, và mỗi linh hồn trở thành một đầu dây thần kinh, chứng kiến cơ thể đói khát của guồng máy công nghiệp."
 overwork_capital_decision_tooltip: "Thúc ép người phàm trong lãnh địa ngươi hiện thực hóa tầm nhìn của ngươi"
 overwork_capital_decision_confirm: "Đám công nhân sẽ đổ máu vì ta"
 POD_county_overworked_modifier: "Kiệt Sức"
 POD_county_overworked_modifier_desc: "Người phàm trong thành phố này lao động đến kiệt quệ để hiện thực hóa tầm nhìn của bậc chủ nhân tàn nhẫn của nó."

 one_with_shadows_objective_decision: "Hòa Cùng Bóng Tối"
 one_with_shadows_objective_decision_tooltip: "Vào trong màn đêm..."
 one_with_shadows_objective_decision_desc: "Để thực sự thấu hiểu Vực Thẳm, ngươi phải tương tác với nó. Đây là một canh bạc mạo hiểm mà ngươi định làm cho an toàn hơn bằng cách dùng vài kẻ có thể hy sinh làm "vật thí nghiệm" trước. Ngay cả cái chết thê thảm gần như chắc chắn của chúng cũng sẽ soi tỏ cho ngươi về những hiểm nguy của Vực Thẳm."
 one_with_shadows_objective_decision_confirm: "...Rồi quay về"
 one_with_shadows_objective_decision_prisoner: "Có #color_white 5#! [prisoners|E] mang [GetTrait('shadow').GetName(GetNullCharacter)] hoặc [GetTrait('spectre').GetName(GetNullCharacter)]"

 demonization_objective_decision: "Thăng Hoa Tà Ác: Săn Lùng Decani"
 demonization_objective_decision_tooltip: "Quyền năng ma quỷ trong tầm tay ta!"
 demonization_objective_decision_desc: "Decani được mô tả là 36 con quỷ ôn dịch, kỳ thực chỉ là các diện mạo của Namtaru đang say ngủ, sinh vật quỷ dữ mà Shaitan từng cố hồi sinh. Thế nhưng Namtaru lại khuyến khích sự tranh đoạt và tham vọng, và người ta biết rằng những kẻ triệu hồi quỷ dữ tài ba có thể cướp lấy vị trí của chúng và trở thành quỷ dữ thực thụ."
 demonization_objective_decision_confirm: "Ta xứng đáng."
 demonization_objective_decision_effect: "Ngươi sẽ nhận được các sự kiện để bắt đầu cuộc săn lùng của mình.\n#X Việc này sẽ kết thúc tồi tệ nếu ngươi chưa chuẩn bị kỹ, và quá yếu để chống lại Decani.#!"

 quest_for_sargon_codex_objective_decision: "Truy Tìm Sargon Codex"
 quest_for_sargon_codex_objective_decision_tooltip: "Tri Thức Tối Thượng Đang Chờ Đợi"
 quest_for_sargon_codex_objective_decision_desc: "Sargon Codex là một phiến đất sét do Cappadocius viết ra khi còn là người phàm. Sau $pod_Embrace$ của hắn, việc mất đi Hóa Thân đã gây ra hỗn loạn và tàn phá trong ký ức của hắn. Hắn không còn nhớ mình đã viết gì hay để nó ở đâu. Qua hàng thiên niên kỷ, Sargon Codex đã bị phá hủy và các mảnh của nó rải rác khắp thế giới. Nếu ai đó khôi phục được nó, quyền năng vô song sẽ chờ đợi kẻ ấy."
 quest_for_sargon_codex_objective_decision_confirm: "Trí Tuệ của Người Xưa đang trong tầm với…"
 quest_for_sargon_codex_objective_decision_at_least_1_shard: "Ngươi phải có ít nhất 1 Mảnh Sargon Codex"
 quest_for_sargon_codex_objective_decision_at_effect1: "Mở khóa một [journey|E], để truy tìm các Mảnh Codex còn lại trên khắp thế giới"
 quest_for_sargon_codex_objective_decision_at_effect2: "Mở khóa một [character_interaction|E], để bắt đầu nghiên cứu các Mảnh Sargon Codex mà ngươi đã thu thập được."
 quest_for_sargon_codex_objective_decision_at_effect3: "Mở khóa một [decision|E], để trao lại các Mảnh Sargon Codex ngươi thu thập được cho Cappadocius."

 deliver_shards_to_cappadocius_objective_decision: "Trả Lại Các Mảnh Cho Cappadocius"
 deliver_shards_to_cappadocius_objective_decision_tooltip: "Trả chúng về nơi chúng thuộc về"
 deliver_shards_to_cappadocius_objective_decision_desc: "Sargon Codex là một phiến đất sét do Cappadocius viết ra khi còn là người phàm. Sau $pod_Embrace$ của hắn, việc mất đi Hóa Thân đã gây ra hỗn loạn và tàn phá trong ký ức của hắn. Hắn không còn nhớ mình đã viết gì hay để nó ở đâu. Qua hàng thiên niên kỷ, Sargon Codex đã bị phá hủy và các mảnh của nó rải rác khắp thế giới. Nếu ai đó khôi phục được nó, quyền năng vô song sẽ chờ đợi kẻ ấy.\n\nNhưng ngươi không tham lam thứ quyền năng ấy, nên thay vào đó ngươi sẽ trao nó lại cho chủ nhân của nó"
 deliver_shards_to_cappadocius_objective_decision_confirm: "Ta xin dâng lên người..."
 deliver_shards_to_cappadocius_objective_decision_effect: "Trao cho Cappadocius các Mảnh đã thu thập, Mỗi mảnh cho ngươi [GetModifier('cappadocius_boon_modifier').GetNameWithTooltip]"
 deliver_shards_to_cappadocius_objective_decision_effect2: "Ngươi mất [character_interaction|E] để nghiên cứu các mảnh đang sở hữu"

 deliver_shards_to_cappadocius_objective_decision_shard_custom: "Ngươi phải có ít nhất 1 Mảnh Sargon Codex $POD_understand_sargon_codex_shard_interaction_custom$"
 
 malkavian_aenigmatis_objective_decision: "Aenigmatis: Những Câu Đố và Bí Ẩn Trần Thế"
 malkavian_aenigmatis_objective_decision_tooltip: "Tìm ra bí mật vĩ đại nhất."
 malkavian_aenigmatis_objective_decision_desc: "Ordo Aenigmatis tìm cách xóa bỏ cơn điên loạn Malkavian bằng cách đối mặt với những gì không thể tưởng tượng nổi và vĩ đại, dù đó là Chúa Trời, thời gian, toàn thể Vũ Trụ hay chính Caine. Mọi bí ẩn đều đáng để tìm ra lời giải."
 malkavian_aenigmatis_objective_decision_confirm: "Ta sẽ giải hết tất cả!"
 malkavian_aenigmatis_objective_decision_effect: "Như một [character_interaction|E], ngươi có thể 'giải mã' sách (điều này sẽ phá hủy chúng) để nhận một hệ số. Sau khi đạt các ngưỡng nhất định, ngươi sẽ nhận thêm phần thưởng."
 malkavian_aenigmatis_objective_decision_has_5_book_artifact: "Có ít nhất #color_white 5#! sách [artifact|E]"
 
 malkavian_ecstasis_objective_decision: "Ecstasis: Đau Đớn và Khoái Lạc"
 malkavian_ecstasis_objective_decision_tooltip: "Thăng hoa qua cảm xúc."
 malkavian_ecstasis_objective_decision_desc: "Ordo Ecstasis cho rằng sự điên loạn thực sự nằm ở hình hài phàm tục. Theo quan điểm của họ, Dã Thú mới chính là tạo vật thần thánh thực sự, và vì thế phải được lắng nghe và xoa dịu. Thấu hiểu nó chính là chìa khóa để thấu hiểu cả Chúa Trời lẫn bản thân."
 malkavian_ecstasis_objective_decision_confirm: "Những cảm giác thần thánh."
 malkavian_ecstasis_objective_decision_effect: "Như một [character_interaction|E], ngươi có thể ép buộc một cơn cuồng loạn để nhận một hệ số dựa trên lượng Elysium ngươi đã tổ chức (sau khi thực hiện [decision|E] này).\nSau một lượng Elysium nhất định, ngươi sẽ nhận thêm phần thưởng."
 
 malkavian_maleficus_objective_decision: "Maleficus: Bóng Tối Bên Trong"
 malkavian_maleficus_objective_decision_tooltip: "Tìm ra câu trả lời bên dưới."
 malkavian_maleficus_objective_decision_desc: "Là Ordo bí mật nhất (và dị giáo nhất), Maleficus tin vào bóng tối vốn có trong bản chất Hậu duệ Cain. Vì vậy, không có giới hạn nào mà họ sẽ không sa vào để chữa trị cơn điên loạn của mình. Chủ nghĩa triệu hồi ma quỷ nghĩa lý gì với kẻ đã thực sự bị đọa đày?"
 malkavian_maleficus_objective_decision_confirm: "Chúa Trời phớt lờ ta, Địa Ngục lắng nghe."
 malkavian_maleficus_objective_decision_effect: "Như một [character_interaction|E], ngươi có thể hiến tế tù nhân để nhận một hệ số sẽ tăng theo tổng số lần hiến tế thực hiện bằng tương tác này."

