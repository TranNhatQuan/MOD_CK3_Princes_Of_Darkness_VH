 become_ghoul_decision: "Cơn Nghiện Chết Người"
 become_ghoul_decision_desc: "Bộc huyết vô chủ là loại bộc huyết ít phổ biến nhất, sống một cuộc đời tự do không có Hậu duệ Cain chủ nhân cai trị họ, nhưng cũng là một sự tồn tại đầy nguy hiểm trong cuộc tranh giành $pod_vitae$ không ngừng."
 become_ghoul_decision_tooltip: "Bằng cách xử tử một [GetTrait('vampire').GetName( GetPlayer )] trong nhà tù của ngươi, ngươi sẽ có thể trở thành một bộc huyết vô chủ."
 become_ghoul_decision_confirm: "Hãy làm điều đó"
