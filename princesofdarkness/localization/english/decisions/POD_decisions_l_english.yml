 contunuing_greek_tradition_decision_desc: "[GetScriptedCharacterByHistoryID('792600').GetFirstName] là [GetCultureByKey('mycenean').GetName], và vì thế, không tiếp xúc trực tiếp với Vùng Đất Đức Tin Ai Cập, một nguồn Pneuma mãnh liệt. Nếu chúng ta kiểm soát được khu vực này, ta có thể tái cấu trúc những nguồn năng lượng này để phục vụ mục đích của mình."
