 withering_blood_objective_decision: "Chữa Trị Dòng Máu Suy Tàn"
 withering_blood_objective_decision_tooltip: "Dòng dõi phàm nhân Bomkazi — những đối tác giao ước của chúng ta, nguồn sinh dưỡng của chúng ta — đang suy tàn. Mỗi thế hệ mang trong mình càng ít pháp thuật sự sống cổ xưa hơn. Chúng ta phải tìm cách cứu lấy họ hoặc vượt qua sự lệ thuộc của chúng ta vào họ."
 withering_blood_objective_decision_desc: "Qua hàng thế kỷ, giao ước giữa Impundulu và Bomkazi đã nuôi dưỡng chúng ta. Nhưng các nữ phù thủy phàm nhân ngày càng thưa thớt và suy yếu. Pháp thuật sự sống từng bùng cháy trong huyết quản họ nay mờ dần thành tro tàn.\n\nChúng ta đã đi xa, học hỏi từ cả người Cappadocian lẫn người Giovanni. Với tri thức thuật gọi hồn đã thu thập được, hai con đường mở ra trước mắt chúng ta: đổi mới giao ước cổ xưa qua nghi lễ, hoặc thoát ly hoàn toàn khỏi nó qua Nghi Thức Ishologu."
 withering_blood_objective_decision_confirm: "Thời khắc đã đến."

 withering_blood_extra_necromancy_tt: "Đã học ít nhất một con đường [GetTrait('necromancy').GetName(THIS.Char.Self)] khác ngoài Impundulu"
 #imp_guardian_necromancy_level_tt: "Has Necromancy level 2 or higher" # unused
 #imp_guardian_bomkazi_died_tt: "A Bomkazi courtier has died recently" # unused

 craft_shewstone_decision: "Chế Tạo Đá Tiên Tri"
 craft_shewstone_decision_tooltip: "Thánh hóa một viên đá đã mài nhẵn và vẽ lên đó bằng máu chim. Các linh hồn sẽ thì thầm bí mật của những kẻ được nêu tên trên đó."
 craft_shewstone_decision_desc: "Đá Tiên Tri là một truyền thống cổ xưa hơn cả chính dòng máu — một viên đá đã thánh hóa được vẽ lên một cái tên bằng máu chim. Khi cái tên được xướng lên, các linh hồn không yên nghỉ sẽ thì thầm về tung tích và bí mật của người được nêu tên.\n\nCon Đường Cenotaph cung cấp tri thức để ràng buộc linh hồn vào viên đá."
 craft_shewstone_decision_confirm: "Bắt đầu nghi lễ."

 craft_nightmare_drums_decision: "Chế Tạo Trống Ác Mộng"
 craft_nightmare_drums_decision_tooltip: "Tạo hình những chiếc trống từ da người. Không thể nghe thấy bởi người sống, chúng buộc các linh hồn phải hành hạ giấc mơ của kẻ địch."
 craft_nightmare_drums_decision_desc: "Trống Ác Mộng được tạo hình từ da người căng trên xương. Không tai người sống nào có thể nghe được nhịp điệu của chúng — nhưng người chết thì nghe thấy, và tuân theo.\n\nĐược gõ vào lúc nửa đêm, những chiếc trống ra lệnh cho các hồn ma xâm nhập giấc mơ của kẻ địch, lấp đầy giấc ngủ của họ bằng nỗi kinh hoàng và khiếp sợ."
 craft_nightmare_drums_decision_confirm: "Tạo ra những nhạc cụ của nỗi khiếp sợ."

 craft_witch_eye_decision: "Chế Tạo Mắt Phù Thủy"
 craft_witch_eye_decision_tooltip: "Cấy một con mắt đã phù phép từ một tử thi không yên nghỉ vào chính hốc mắt ngươi. Cái giá là ngoại hình của ngươi; phần thưởng là Thị Giác Tử Thần vĩnh viễn."
 craft_witch_eye_decision_desc: "Mắt Phù Thủy là nghi lễ cực đoan nhất của Impundulu. Một con mắt được lấy từ một tử thi không yên nghỉ, phù phép bằng năng lực gọi hồn, và cấy vào chính hốc mắt của thuật sĩ gọi hồn.\n\nCái giá phải trả rất khủng khiếp — con mắt đã phù phép đánh dấu người mang nó là một thứ phi nhân. Nhưng món quà Thị Giác Tử Thần vĩnh viễn, khả năng nhìn thấy linh hồn và xuyên thấu mọi sự dối trá, là vô giá."
 craft_witch_eye_decision_confirm: "Ta chấp nhận cái giá."
 
 ennamaru_victory_objective_decision: "La Grande Tragédie"
 ennamaru_victory_objective_decision_tooltip: "À, quả là một sân khấu tuyệt vời của tuyệt vọng!"
 ennamaru_victory_objective_decision_desc: "Chúng ta là những mảnh vỡ của Ennamaru, và khúc thánh ca duy nhất mà chúa tể bóng tối của chúng ta lắng nghe là tuyệt vọng thuần khiết. Bằng cách nhấn chìm Francia vào một sân khấu bi kịch được dàn dựng, đầy ác mộng, chúng ta sẽ ghép lại chủ nhân của mình và chuẩn bị cho thế giới đón nhận sự hủy diệt vinh quang của nó."
 ennamaru_victory_objective_decision_custom: "Ngươi có ít nhất #V 3#! Con Cái với #V 10#! [intrigue_i][intrigue|E] trở lên"
 ennamaru_victory_objective_decision_effect_tooltip: "Ennamaru chắc chắn sẽ tưởng thưởng cho nỗ lực của ngươi."
 ennamaru_victory_objective_decision_confirm: "Hãy cúi chào. Kiệt tác đã hoàn thành."
 
 volgirre_objective_decision: "Magnum Opus"
 volgirre_objective_decision_desc: "Phái Fiend yêu thích tạo hình huyết nhục của mình thành những hình dạng gớm ghiếc, quái dị mà không chút tinh tế thẩm mỹ. Bằng cách nghiên cứu sự tinh vi của huyết nhục và xương cốt, ta có thể biến bản thân thành một hình hài đẹp đẽ đến kinh hoàng, vượt xa những gì lũ man rợ đó có thể làm được."
 volgirre_objective_decision_custom: "Ngươi cần ít nhất #V 3#! [prisoners|E] mang bất kỳ đặc điểm sắc đẹp tích cực nào."
 volgirre_objective_decision_confirm: "Chuẩn bị tù nhân."
 volgirre_objective_decision_effect_tooltip: "Ngươi sẽ mở khóa tùy chọn biến hình [GetModifier('POD_shapeshift_form_dark_angel_modifier').GetNameWithTooltip]."
 volgirre_objective_decision_tooltip: "Một hình hài xứng tầm bậc thầy nghệ thuật."
 
 mnemachien_objective_decision: "Hoàn Thiện Humanitas"
 mnemachien_objective_decision_desc: "Kể từ những đêm tối của Lutetia cổ xưa, chúng ta đã cư ngụ tại Pháp, nhưng một sự thối rữa lớn lao đang lan tràn trên vùng đất này. Để bảo đảm tương lai cho dòng dõi chúng ta, ta phải diệt trừ bóng tối địa ngục đang lớn dần trong biên giới của chúng ta. Bằng cách tinh thông thuật pháp của mình và củng cố sự hài hòa với người phàm, chúng ta có thể tự cách ly bản thân khỏi cả ma quỷ lẫn [Glossary('Dã Thú','game_concept_beast_desc')] bên trong ta. Một khi bóng tối ma quỷ được thanh tẩy và chúng ta trở nên vững mạnh, cuối cùng ta có thể tập trung vào việc nâng cao lãnh địa và chăm lo cho thần dân của mình trong hòa bình."
 mnemachien_objective_decision_custom: "Ngươi phải có ít nhất #V 3#! [GetCourtPositionType('touchstones_court_position').GetName()] được lấp đầy bởi người phàm có [aptitude|E] tốt trở lên."
 mnemachien_objective_decision_customtwo: "Không được có Con Cái nào của Ennamaru sở hữu đất đai tại Francia."
 mnemachien_objective_decision_confirm: "Cuối cùng cũng an toàn."
 mnemachien_objective_decision_effect_tooltip: "Ngươi sẽ nhận [GetModifier('lutetian_roots_modifier').GetNameWithTooltip] và khả năng phát triển lãnh địa của mình bằng hành động hội đồng quản gia."
 mnemachien_objective_decision_tooltip: "Lãnh địa cần được thanh tẩy."
