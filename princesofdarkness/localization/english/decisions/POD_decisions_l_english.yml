l_english:
 oust_mithras_objective_decision: "Đặt Mặt Trời Lặn"
 oust_mithras_objective_decision_tooltip: "Nếu ngươi thành công, ngươi sẽ gặt hái phần thưởng to lớn và mãi mãi làm suy tàn Giáo Phái Mithras"
 oust_mithras_objective_decision_desc: "Mithras và con cháu hắn đã là một tai họa đè lên các hòn đảo này kể từ khi hắn chạy đến đây, trốn chạy khỏi những thất bại của mình trên lục địa. Đã quá lâu rồi, đã đến lúc Hậu duệ Cain của Albion đòi lại quê hương của họ từ tay vị 'Thần' Ba Tư tự xưng này."
 #oust_mithras_objective_decision_effect_tooltip: "Issue a proclamation to say that Britannia is free of Mithras' influence."
 oust_mithras_objective_decision_effect_tooltip2: "Điều này sẽ làm suy yếu Via Mithras, ban cho ngươi vinh quang lớn lao và thành lập một nhóm chiến binh mới tận tụy bảo vệ Albion." 
 oust_mithras_objective_decision_confirm: "Cuối cùng, đã đến lúc"
 oust_mithras_custom_decision: "Ngươi cần không có chư hầu nào theo đức tin [GetFaithByKey('viamithras').GetName]. Nam tước thì không tính"
 oust_mithras_custom_decision2: "[GetScriptedCharacterByHistoryID('505071').GetFirstName] phải chết hoặc rơi vào $pod_torpor$"
 mithras_victory_objective_decision: "Vương Trượng và Mặt Trời"
 mithras_victory_objective_decision_tooltip: "Khi Giáo Phái Mithras ngày càng lớn mạnh về tầm ảnh hưởng, $pod_clan$ Ventrue sẽ rơi vào tay nó"
 mithras_victory_objective_decision_desc: "Mithras đã từng gần như thống trị toàn bộ cục diện tôn giáo, tại La Mã Cổ Đại. Đêm nay, nhân loại dường như nằm ngoài tầm với, nhưng là một thành viên nổi bật của Ventrue, vẫn còn khả năng nắm quyền kiểm soát $pod_clan$ thông qua đức tin. Nếu một vài chuyện nhỏ được giải quyết trước..."
 mithras_victory_objective_decision_effect_tooltip2: "Giáo Phái Mithras sẽ được củng cố, và phần lớn Ventrue sẽ cải sang đức tin ấy, gắn kết mãi mãi $pod_clan$ và đức tin" 
 mithras_victory_objective_decision_confirm: "$pod_clan$ và đức tin, hợp làm một"
 mithras_victory_custom_decision: "[GetScriptedCharacterByHistoryID('505050').GetFirstName], [GetScriptedCharacterByHistoryID('505082').GetFirstName] và [GetScriptedCharacterByHistoryID('790101').GetFirstName], ba đối thủ chính tranh giành quyền thống trị gia tộc Ventrue, phải chết hoặc rơi vào $pod_torpor$"
 mithras_victory_custom_decision2: "Không có Ventrue nào khác ngoài chính ngươi hoặc [GetScriptedCharacterByHistoryID('505071').GetFirstName] có thể nắm giữ một [title|E] Đế Quốc. Trừ khi họ là thành viên của chính Giáo Phái Mithras"
 toreador_victory_objective_decision: "Giấc Mộng Trở Lại"
 toreador_victory_objective_decision_tooltip: "Một dịp trọng đại sẽ vang vọng khắp Lịch Sử $pod_cainite$."
 toreador_victory_objective_decision_desc: "Năm 1204, điều không tưởng đã xảy ra, Michael, Đại Thượng Phụ của Giấc Mộng Constantinople, đã chết khi thành phố của ông bốc cháy. Kể từ thời khắc định mệnh đó, vô số tín đồ của vị Đại Thiên Sứ đã khuất đã cố gắng tái tạo lại chốn không tưởng linh thiêng nhất này."
 toreador_victory_objective_decision_confirm: "Ta hy vọng Michael đang dõi theo"
 toreador_victory_objective_decision_effect_tooltip: "Ngươi sẽ được đưa ra một lựa chọn giữa việc phục hưng đức tin của Đại Thiên Sứ hoặc chỉ đơn giản hưởng thụ những phần thưởng vật chất." 
 shadow_reconquista_objective_decision: "Tái Chinh Phục Bóng Tối"
 shadow_reconquista_objective_decision_tooltip: "Điều này sẽ làm hài lòng các thủ lĩnh của $pod_clan$ Lasombra và, chà, mở đường cho ngươi đến những điều lớn lao hơn sắp tới."
 shadow_reconquista_objective_decision_desc: "Trong một nỗ lực sai lầm nhằm duy trì quyền lực chính trị của mình, các thành viên [Glossary('Ashirra','game_concept_ashirra_desc')] của $pod_clan$ Lasombra đã châm ngòi một cuộc nội chiến suýt chút nữa chấm dứt sự thống trị của Lasombra tại Iberia. Chúng phải bị chặn đứng càng sớm càng tốt."
 shadow_reconquista_objective_decision_confirm: "Cuộc nổi loạn của chúng đã kết thúc"
 shadow_reconquista_objective_decision_effect_tooltip: "Ngươi sẽ soán đoạt, hoặc tạo ra, tước hiệu Biển Bóng Tối (Italia) miễn là nó không thuộc về kẻ không phải Lasombra. Điều này có thể gây mất lòng dân trong một thời gian." 
 shadow_reconquista_objective_decision_custom: "Không được có tín đồ [Glossary('Ashirra','game_concept_ashirra_desc')] nào trong lãnh địa của ngươi. Nam tước thì không tính" 
 einherjar_victory_objective_decision: "Đánh Bại Ragnarok"
 einherjar_victory_objective_decision_tooltip: "Vượt qua Ragnarok là khả năng có một tương lai cho dân tộc ngươi."
 einherjar_victory_objective_decision_desc: "Con Cháu của Canarl đang chịu áp lực nặng nề trước sự trỗi dậy của Cơ Đốc Giáo. Odin đã biến mất và chính dân tộc của họ đang quay lưng chống lại họ bằng chĩa ba và lửa. Khi Ventrue người Đức đã chiếm được các thành phố ở nam Scandinavia, dường như thời đại của [Glossary('Einherjar','game_concept_einherjar_desc')] đã kết thúc."
 einherjar_victory_objective_decision_confirm: "Valhalla đã được bảo đảm"
 einherjar_victory_objective_decision_effect_tooltip: "Ngươi sẽ dùng những chiến thắng to lớn và bất ngờ của mình để hồi sinh đức tin [Glossary('Einherjar','game_concept_einherjar_desc')] và đưa nó bước vào kỷ nguyên mới này." 
 ashirra_deconquista_objective_decision: "Iberia Sau Nửa Đêm"
 ashirra_deconquista_objective_decision_tooltip: "Kết thúc cuộc nội chiến Iberia theo hướng có lợi cho [Glossary('Ashirra','game_concept_ashirra_desc')] là một kỳ công to lớn, nhưng phần thưởng rất xứng đáng."
 ashirra_deconquista_objective_decision_desc: "Các tín đồ [Glossary('Ashirra','game_concept_ashirra_desc')] đã hứng chịu hết thất bại này đến thất bại khác kể từ khi cuộc nội chiến Lasombra bắt đầu. Với sự hậu thuẫn của Biển Bóng Tối, chiến thắng của De Ruiz dường như đã chắc chắn. Nhưng có lẽ ngươi vẫn có thể xoay chuyển cục diện..."
 ashirra_deconquista_objective_decision_confirm: "Các Tín Đồ đã chiến thắng"
 ashirra_deconquista_objective_decision_effect_tooltip: "Chiến thắng của ngươi sẽ làm suy yếu quyền lực của Biển Bóng Tối, đưa ngươi vào vị thế để đạt được những điều lớn lao hơn sắp tới và cho phép ngươi tái thiết Iberia tan hoang vì chiến tranh." 
 ashirra_deconquista_objective_decision_custom: "Không được có nhân vật Via Noctis nào trong lãnh địa của ngươi. Nam tước thì không tính" 
 malkavian_victory_objective_decision: "Trò Đùa Nhỏ"
 malkavian_victory_objective_decision_tooltip: "Malkav đang nói chuyện với ngươi và bảo ngươi làm gì đó! Có lẽ vậy."
 malkavian_victory_objective_decision_desc: "Ngươi có một sự thôi thúc, hoặc một linh ảnh tiên tri, hoặc một cơn mê sảng do sốt... dù sao thì, ngươi gần như chắc chắn rằng mình cần tập hợp $pod_clan$ Malkavian để thực hiện một nghi lễ to lớn nào đó tại Bohemia. Hoặc Jerusalem."
 malkavian_victory_objective_decision_confirm: "Chuyện quan trọng sắp đến!"
 malkavian_victory_objective_decision_effect_tooltip: "Ngươi sẽ hoàn thành một nghi lễ với độ chính xác hoàn hảo và hiểu rõ mình đang làm gì. Có lẽ vậy." 
 senate_victory_objective_decision: "Cộng Hòa Vĩnh Cửu"
 senate_victory_objective_decision_tooltip: "La Mã đã sụp đổ, nhưng tinh thần cộng hòa của nó thì không. $pod_clan$ Ventrue đang chuyển hướng mới, nhưng nó có thể được khơi dậy hướng về những giá trị cũ kỹ, kiêu hãnh hơn."
 senate_victory_objective_decision_desc: "Trước khi bị tha hóa thành một hố sâu suy đồi của tội lỗi, La Mã Bất Tử từng là một chốn không tưởng của những $pod_cainites$ theo thể chế Cộng Hòa. Giấc mơ về một Viện Nguyên Lão nơi mọi, à, hầu hết các gia tộc đều có đại diện vẫn còn có thể đạt được. Nếu nỗ lực sai lầm của Ventrue người Đức nhằm xây dựng một đế chế mới bị chặn đứng trước..."
 senate_victory_objective_decision_confirm: "Chúng ta là Viện Nguyên Lão"
 senate_victory_objective_decision_effect_tooltip: "La Mã Cộng Hòa sẽ được tái thiết, và các chính sách mới sẽ được ban hành để thưởng phạt các Gia Tộc cho tương xứng." 
 senate_victory_objective_decision_custom: "Tước hiệu [GetTitleByKey('e_fiefs_of_the_black_cross').GetNameNoTier] phải thuộc về ngươi, hoặc không tồn tại chút nào" 
 brujah_victory_objective_decision: "Carthage"
 brujah_victory_objective_decision_tooltip: "Chúng ta sẽ không bao giờ quên Carthage, chốn không tưởng của Troile dành cho con người và $pod_cainites$. Bị người La Mã đố kỵ thiêu rụi, tinh thần của nó vẫn còn sống trong mỗi người chúng ta."
 brujah_victory_objective_decision_desc: "La Mã và Camilla đã hủy diệt Carthage yêu dấu của chúng ta, thành phố hoàn hảo. Nhưng nó sẽ không bao giờ thực sự biến mất chừng nào $pod_clan$ Brujah vẫn còn tồn tại. Có lẽ vào thời điểm này, khi chính La Mã đã sụp đổ, chốn không tưởng của chúng ta có thể được tái sinh."
 brujah_victory_objective_decision_confirm: "Troile hẳn sẽ tự hào"
 brujah_victory_objective_decision_effect_tooltip: "Ngươi sẽ có một lựa chọn về cách xử lý thời khắc quan trọng này. Hoặc là một công cụ chính trị hoặc một chốn không tưởng thực sự, gây chia rẽ." 
 brujah_victory_objective_decision_custom: "[GetScriptedCharacterByHistoryID('790101').GetFirstName], Hoàng Thân của La Mã lúc trước và bây giờ, kẻ từng hủy diệt thành phố của chúng ta, phải chết hoặc rơi vào $pod_torpor$" 
 babayaga_victory_objective_decision: "Người Bà Yêu Thương Của Ngươi"
 babayaga_victory_objective_decision_tooltip: "$pod_clan$ Nosferatu ắt diệt vong, trừ khi ngươi có thể lập liên minh với Nữ Phù Thủy Già."
 babayaga_victory_objective_decision_desc: "Absimilliard, thủy tổ của $pod_clan$ Nosferatu đang ở ngoài kia, mưu tính cái chết cho con cháu mình. Hy vọng duy nhất nằm ở Baba Yaga, Bà Ngoại Bé Nhỏ, người từng một lần ngăn cản được hắn. Hãy làm bà hài lòng, và có lẽ ngươi sẽ sống sót qua cơn bão sắp tới."
 babayaga_victory_objective_decision_confirm: "Bà ơi, xin hãy nghe lời cầu xin của chúng con!"
 babayaga_victory_objective_decision_effect_tooltip: "$pod_clan$ Nosferatu sẽ đoàn kết dưới trướng Baba Yaga và nhà vô địch do bà chọn, chính là ngươi.\nCho phép ngươi tuyển mộ [GetMaA('zmei').GetName] làm [men_at_arms|E]." 
 babayaga_victory_objective_decision_custom: "Kình địch cũ của Baba Yaga, [GetScriptedCharacterByHistoryID('790274').GetFirstName] của Bạch Nga, phải chết hoặc rơi vào $pod_torpor$" 
 nosferatu_victory_objective_decision: "Nỗi Kinh Hoàng Trong Bóng Tối"
 nosferatu_victory_objective_decision_tooltip: "Hiểm họa đang theo đúng nghĩa đen rình rập trong bóng tối. $pod_clan$ Nosferatu cần một người bảo hộ."
 nosferatu_victory_objective_decision_desc: "$pod_clan$ của ngươi bị chính thủy tổ của mình, Absimilliard, săn đuổi. Vì vậy, ngươi buộc phải lén lút trong bóng tối, chờ đợi cơn thịnh nộ của hắn nuốt chửng ngươi. Nhưng có lẽ ai đó có thể đoàn kết $pod_clan$ và phản công..."
 nosferatu_victory_objective_decision_confirm: "Chúng ta sẽ chịu đựng ngươi, kẻ sáng lập"
 nosferatu_victory_objective_decision_effect_tooltip: "Ngươi sẽ hợp nhất $pod_clan$ Nosferatu, một tài sản mạnh mẽ để sở hữu với một dòng dõi kiên cường và tinh khôn như vậy."  
 nosferatu_exclusive_decisions_tt: "Nỗi Kinh Hoàng Trong Bóng Tối và Người Bà Yêu Thương Của Ngươi loại trừ lẫn nhau."
 urshulgi_victory_objective_decision: "Một Vị Thần Mộng Mơ"
 urshulgi_victory_objective_decision_tooltip: "Chỉ có người con được sủng ái, Ur-Shulgi, mới biết ý chí của Haqim."
 urshulgi_victory_objective_decision_desc: "$pod_clan$ Assamite đang chối bỏ sự thật. Vận mệnh của chúng ta là thanh tẩy trái đất khỏi dòng máu ô uế của Con Cháu Khayyin và giành lại nó cho thủy tổ của chúng ta, Haqim. Chúng ta phải cho chúng thấy sự thật."
 urshulgi_victory_objective_decision_confirm: "Vị Mục Tử Đen thăng thiên"
 urshulgi_victory_objective_decision_effect_tooltip: "$pod_clan$ Assamite sẽ cải sang giáo phái của ngươi, và giấc mộng của Ur-Shulgi sẽ xé nát linh hồn của kẻ ô uế." 
 urshulgi_victory_objective_decision_custom: "Các kình địch chính tranh giành quyền kiểm soát Alamut, Jamal, Nakurtum và Al-Ashrad, phải chết hoặc rơi vào $pod_torpor$" 
 assamite_victory_objective_decision: "Một Gia Tộc Chia Rẽ"
 assamite_victory_objective_decision_tooltip: "Con Cháu Haqim cần một sự lãnh đạo mới, thống nhất."
 assamite_victory_objective_decision_desc: "$pod_clan$ Assamite bị chia rẽ giữa các đức tin cạnh tranh, các giáo phái bí mật và lợi ích cá nhân. Những chia rẽ này ăn sâu, và đe dọa hủy diệt $pod_clan$ chẳng bao lâu nữa. Chúng phải được hàn gắn."
 assamite_victory_objective_decision_confirm: "Anh em không còn chống lại anh em nữa"
 assamite_victory_objective_decision_effect_tooltip: "Ngươi sẽ hợp nhất $pod_clan$ Assamite và chọn một con đường cho vận mệnh của nó."  
 assamite_victory_objective_decision_custom: "Các giáo phái ly khai, [GetTitleByKey('k_webofknives').GetNameNoTier] và [GetTitleByKey('k_losttribe').GetNameNoTier], hoặc bị hủy diệt hoặc do chính ngươi trực tiếp nắm giữ"  
 sinner_victory_objective_decision: "Tội Lỗi Chính Trị"
 sinner_victory_objective_decision_tooltip: "Những Kẻ Tội Lỗi có thể biến kỷ nguyên khắt khe về đạo đức này thành nhiều hơn thế rất nhiều."
 sinner_victory_objective_decision_desc: "Đêm nay, những Kẻ Tội Lỗi là những sinh vật đáng thương, hầu như chẳng còn mạch lạc trong ham muốn suy đồi của mình. Nhưng đã có lúc, những Kẻ Tội Lỗi từng cai trị Đế Chế $pod_cainite$ hùng mạnh nhất, chính là La Mã. Điều đó có thể lặp lại."
 sinner_victory_objective_decision_confirm: "Bằng hữu, người La Mã, đồng bào, hãy lắng nghe ta"
 sinner_victory_objective_decision_effect_tooltip: "La Mã Bất Tử sẽ được khôi phục. Con Đường Tội Lỗi sẽ tái tạo quyền thống trị chính trị của nó." 
 ventrue_victory_objective_decision: "Vua Của Các Vua"
 ventrue_victory_objective_decision_tooltip: "Có quá nhiều vị vua trong số Hậu duệ Cain trên thế giới này."
 ventrue_victory_objective_decision_desc: "Ngươi xuất thân từ $pod_clan$ của Những Kẻ Cai Trị, nhưng nếu ngươi có thể trở thành kẻ cai trị của những kẻ cai trị thì sao? Xét cho cùng, $pod_clan$ Ventrue mạnh nhất khi được đoàn kết..."
 ventrue_victory_objective_decision_confirm: "Trước tiên là $pod_clan$ Ventrue, rồi đến cả thế giới"
 ventrue_victory_objective_decision_effect_tooltip: "Ngươi sẽ hợp nhất $pod_clan$ Ventrue, đảm bảo sự thống trị của nó đối với giống loài Hậu duệ Cain."  
 ventrue_victory_objective_decision_custom: "Không có Ventrue nào khác ngoài chính ngươi có thể nắm giữ một [title|E] Đế Quốc"  
 lasombra_victory_objective_decision: "Đức Tin Trong Bóng Tối"
 lasombra_victory_objective_decision_tooltip: "Cuộc nội chiến rối ren này phải chấm dứt. Ngươi cần hành động trước khi quá muộn."
 lasombra_victory_objective_decision_desc: "$pod_clan$ Lasombra đang giao chiến với chính mình kể từ khi phong trào [Glossary('Ashirra','game_concept_ashirra_desc')] ly khai. Điều này đã làm suy yếu thế nắm giữ của Biển Bóng Tối đối với Địa Trung Hải và cần phải chấm dứt ngay."
 lasombra_victory_objective_decision_confirm: "Đã đến lúc khép lại trang Lịch Sử này"
 lasombra_victory_objective_decision_effect_tooltip: "Phong trào [Glossary('Ashirra','game_concept_ashirra_desc')] còn lại sẽ bị làm suy yếu và quyền lực của ngươi đối với $pod_clan$ sẽ là tuyệt đối... trong một thời gian." 
 lasombra_victory_objective_decision_custom: "[titles|E] Đế Quốc [GetTitleByKey('k_midnight_crescent').GetNameNoTier] và [GetTitleByKey('e_ashirra').GetNameNoTier] phải do ngươi nắm giữ hoặc bị hủy diệt"  
 ashirra_victory_objective_decision: "Trăng Lưỡi Liềm Trên Bóng Tối"
 ashirra_victory_objective_decision_tooltip: "Phong trào [Glossary('Ashirra','game_concept_ashirra_desc')] phải chiến thắng trong cuộc nội chiến đang diễn ra."
 ashirra_victory_objective_decision_desc: "$pod_clan$ Lasombra đang trong chiến tranh, và phần theo Hồi Giáo của nó đã lập thành một liên minh mà ngươi là một phần, [Glossary('Ashirra','game_concept_ashirra_desc')]. Để các tín đồ được an toàn, giới lãnh đạo Lasombra cũ phải bị xử lý."
 ashirra_victory_objective_decision_confirm: "Đã đến lúc dọn dẹp những kẻ còn sót lại"
 ashirra_victory_objective_decision_effect_tooltip: "Những Lasombra theo Cơ Đốc Giáo còn lại sẽ được cho một cơ hội cuối cùng để cải đạo và quyền lực của ngươi với tư cách Giáo Chủ Vĩnh Hằng sẽ được đảm bảo."  
 ashirra_victory_objective_decision_custom: "Hoặc ngươi kiểm soát [GetTitleByKey('e_sea_of_shadows').GetNameNoTier], hoặc không ai kiểm soát cả"  
 heretic_victory_objective_decision: "Chân Lý Cho Đến Caine"
 heretic_victory_objective_decision_tooltip: "Nếu không có gì được thực hiện, Caine Đệ Tam sẽ trở về một thế giới mạt vận đầy những kẻ không tin."
 heretic_victory_objective_decision_desc: "Giáo Hội của Caine Đệ Tam, hay Dị Giáo $pod_cainite$ theo cách gọi của người ngoài, đang hấp hối. Bị săn đuổi ở hầu như mọi ngóc ngách của Châu Âu, giới lãnh đạo tan rã, nó đối mặt với sự diệt vong. Một cuộc trở lại là khó xảy ra, nhưng... đức tin dù sao cũng không cần lý lẽ."
 heretic_victory_objective_decision_confirm: "Đấng Sáng Tạo Giả bị giáng một đòn nặng nề đêm nay"
 heretic_victory_objective_decision_effect_tooltip: "Ngươi sẽ hồi sinh Giáo Hội, tìm ra những tín đồ mới và một kỷ nguyên bành trướng mới." 
 #anda_victory_objective_decision: "Thunder of the Steppes"
 #anda_victory_objective_decision_tooltip: "These new lands need a swift and decisive conquest if we are to endure the $pod_wan_kuei$ counterattack."
 #anda_victory_objective_decision_desc: "Traveling with our Mongol kin, the [Glossary('Anda','podgloss.anda')] have prospered. But the Chinese $pod_wan_kuei$ muster for war, and we must consolidate our position in the west before their attack."
 #anda_victory_objective_decision_confirm: "These steppes are ours now"
 #anda_victory_objective_decision_effect_tooltip: "You will remove the threat of the $pod_wan_kuei$ invasion that will otherwise happen in 1360 and inspire western Gangrel to join you."  
 gangrel_victory_objective_decision: "Tai Ương"
 gangrel_victory_objective_decision_tooltip: "Thế giới của ngươi đang chết dần, nhưng vẫn còn thời gian để phản công."
 gangrel_victory_objective_decision_desc: "Trong nhiều thế kỷ, Gangrel đã bị gạt ra khỏi chính trường Ma Cà Rồng. Tệ hơn nữa, đồng tộc của họ đã bị săn đuổi và cưỡng ép cải đạo. Điều này phải chấm dứt."
 gangrel_victory_objective_decision_confirm: "Kỷ Nguyên Của Sói bắt đầu"
 gangrel_victory_objective_decision_effect_tooltip: "Bằng cách hợp nhất $pod_clan$ Gangrel, ngươi sẽ làm suy yếu các gia tộc được gọi là văn minh." 
 tremere_victory_objective_decision: "Ý Chí Của Tremere"
 tremere_victory_objective_decision_tooltip: "$pod_clan$ Tremere còn non trẻ, và bị bao vây bởi kẻ thù. Chúng ta phải mạnh mẽ vươn lên và củng cố vị thế mới trước khi quá muộn."
 tremere_victory_objective_decision_desc: "$pod_clan$ Tremere được sinh ra trong chiến tranh và đau khổ. Tzimisce không hề nhân nhượng, và chiến dịch tuyên truyền của chúng ta chống lại Salubri vẫn có thể xoay chuyển được. Chúng ta không được dừng lại và phải nghiền nát tất cả những kẻ chống đối ý chí của Tremere."
 tremere_victory_objective_decision_confirm: "Một $pod_clan$ mới, cuối cùng cũng được an toàn"
 tremere_victory_objective_decision_effect_tooltip: "Ngươi sẽ trở thành Nghị Viên Tối Cao của $pod_clan$, và tung ra một lời nguyền lên những kẻ thù còn lại của ngươi."  
 tremere_victory_objective_decision_custom: "[GetTitleByKey('e_voivodate').GetNameNoTier] của Tzimisce phải bị hủy diệt"
 tremere_victory_objective_decision_customb: "Chúng ta phải đảm bảo rằng Salubri không nắm giữ một [title|E] đế quốc"
 tzimisce_victory_objective_decision: "Đại Chiến"
 tzimisce_victory_objective_decision_tooltip: "Việc chúng ta bất lực không thể trấn áp được lũ Kẻ Tiếm Quyền hỗn xược đã khiến chúng ta thành trò cười của chính trường $pod_cainite$ quá lâu rồi."
 tzimisce_victory_objective_decision_desc: "$pod_clan$ Tzimisce đang bị chia rẽ, không thể ứng phó đúng mức với mối đe dọa tầm thường lẽ ra chỉ là các cuộc xâm nhập của Tremere. Chúng ta cần một sự lãnh đạo mới, mạnh mẽ hơn."
 tzimisce_victory_objective_decision_confirm: "Đây là lời mời gọi cho một bữa tiệc..."
 tzimisce_victory_objective_decision_effect_tooltip: "Ngươi sẽ chọn con đường phía trước cho $pod_clan$ Tzimisce." 
 tzimisce_victory_objective_decision_custom: "Tước hiệu [GetTitleByKey('e_tremere').GetNameNoTier] phải bị hủy diệt"
 cappadocian_victory_objective_decision: "Sargon Codex"
 cappadocian_victory_objective_decision_tooltip: "Thánh vật linh thiêng nhất của $pod_clan$ Cappadocian phải được thu hồi."
 cappadocian_victory_objective_decision_desc: "Được cho là chứa đựng tất cả những lời tiên tri do Sargon -Cappadocius- lập ra trong những ngày còn là người phàm, cuốn codex đã bị thất lạc và chia thành nhiều mảnh khi Lazarus thua trận trước Constancia. Việc tái tạo nó sẽ là một sự kiện trọng đại."
 cappadocian_victory_objective_decision_confirm: "...Nó đang gọi ta"
 cappadocian_victory_objective_decision_effect_tooltip: "Ngươi sẽ chọn cách xử lý với nguồn tri thức tối thượng này."  
 giovanni_victory_objective_decision: "Âm Mưu"
 giovanni_victory_objective_decision_tooltip: "$pod_clan$ Cappadocian đang kìm hãm tiềm năng thực sự của chúng ta. Chúng ta có thể trở nên vĩ đại hơn thế nhiều."
 giovanni_victory_objective_decision_desc: "Chúng ta là thành viên mới gia nhập $pod_clan$ Cappadocian nhưng những 'ân nhân' của chúng ta đã trở nên thừa thãi. Đã đến lúc nghĩ đến tương lai của chúng ta như một $pod_clan$ độc lập..."
 giovanni_victory_objective_decision_confirm: "Hãy mời vị tổ phụ thân yêu của chúng ta dự một bữa tiệc..."
 giovanni_victory_objective_decision_effect_tooltip: "Ngươi sẽ khởi động sự ra đời của $pod_clan$ Giovanni." 
 giovanni_victory_objective_decision_custom: "Hoặc ngươi kiểm soát [GetTitleByKey('k_erciyes').GetNameNoTier], hoặc không ai kiểm soát cả"
 furores_victory_objective_decision: "Khởi Đầu Mới"
 furores_victory_objective_decision_tooltip: "Chúng ta đang từ từ chết dần trong những cuộc chiến vặt vãnh của các Trưởng Lão đồng loại, không có ý chí tự do gì để nói tới. Điều này phải chấm dứt."
 furores_victory_objective_decision_desc: "Hệ thống thứ bậc Ma Cà Rồng thối nát đang bóp nghẹt mọi hy vọng để những kẻ liếm máu trẻ tuổi có thể làm được điều gì đó. Nếu điều này phải thay đổi, phải có một cuộc cách mạng đủ mạnh để chịu đựng được cuộc phản công của chúng."
 furores_victory_objective_decision_confirm: "Một tương lai hoàn toàn mới đang chờ đợi"
 furores_victory_objective_decision_effect_tooltip: "Ngươi sẽ liên hiệp các Tự Do Bang thành một thực thể chính trị mới đầy quyền lực."  
 setite_victory_objective_decision: "Vòng Tay Của Rắn Thần"
 setite_victory_objective_decision_tooltip: "Vòng tay yêu thương của Set và khát khao tự do đạo đức tối thượng phải được truyền bá rộng khắp."
 setite_victory_objective_decision_desc: "Cái gọi là Con Cháu của Caine bị lầm đường lạc lối, tin vào một phiên bản méo mó của sự thật. Chúng ta đều là những kẻ theo Set, và bằng cách củng cố biên giới truyền thống của mình, chúng ta sẽ tiến bước đầu tiên hướng tới việc giúp chúng hiểu ra."
 setite_victory_objective_decision_confirm: "Hãy chào đón những anh em mới của chúng ta"
 setite_victory_objective_decision_effect_tooltip: "Sự thật sẽ được truyền bá rộng khắp, và ngươi sẽ đưa cuộc chiến đến những kẻ thù truyền thống của $pod_clan$ ngươi." 
 setite_victory_objective_decision_custom: "[title|E] [GetTitleByKey('e_ashirra').GetNameNoTier] phải bị hủy diệt"
 salubri_victory_objective_decision: "Sự Thanh Toán"
 salubri_victory_objective_decision_tooltip: "Nhiều người nghĩ rằng chúng ta đang sống những giờ phút cuối cùng của Salubri với tư cách một $pod_clan$, khi chúng ta nhanh chóng bị hủy diệt bởi vô số kẻ thù."
 salubri_victory_objective_decision_desc: "$pod_clan$ Salubri nằm rải rác, gần như bị đẩy đến bờ tuyệt chủng bởi cuộc tấn công tàn bạo của lũ Tremere Tiếm Quyền. Tệ hơn nữa, những kẻ thù cũ hơn như Baali đang lợi dụng sự suy yếu của chúng ta. Chúng ta phải phản công trước khi quá muộn."
 salubri_victory_objective_decision_confirm: "Trả thù có một vị ngọt đắng"
 salubri_victory_objective_decision_effect_tooltip: "Ngươi sẽ hợp nhất $pod_clan$, phơi bày những lời dối trá của Tremere và chọn một con đường cho chính mình." 
 salubri_victory_objective_decision_custom: "Các tước hiệu Baali, [GetTitleByKey('k_moloch').GetNameNoTier] và [GetTitleByKey('k_angellisater').GetNameNoTier], phải bị hủy diệt"
 baali_victory_objective_decision: "Tận Thế"
 baali_victory_objective_decision_tooltip: "Ảo tưởng thực tại đau đớn và thối nát này phải kết thúc bằng việc thiêu rụi toàn bộ Sáng Thế."
 baali_victory_objective_decision_desc: "Chủ nhân của chúng ta, Nergal, đã từng đến rất gần việc chấm dứt thế giới khốn khổ này trong các cuộc Chiến Tranh Baali trước đây. Dù lũ Molochim chống đối chúng ta hơn bao giờ hết, chúng ta có thể đủ sức áp đảo chúng và đẩy nhanh ngày tận thế của tất cả."
 baali_victory_objective_decision_confirm: "...Và như vậy, ngày tận thế bắt đầu"
 baali_victory_objective_decision_effect_tooltip: "Ngươi sẽ hợp nhất $pod_clan$ Baali, triệu hồi những con quỷ hùng mạnh từ hố sâu và khởi động cuộc chiến cuối cùng. Vương triều của ngươi sẽ có thể tuyển mộ [GetMaA('demons').GetName]" 
 baali_victory_objective_decision_custom: "Kình địch của ngươi, [GetTitleByKey('k_moloch').GetNameNoTier] phải bị hủy diệt. Cũng như những kẻ thù thường trực của $pod_clan$ ngươi, [GetTitleByKey('k_olives').GetNameNoTier] của Salubri và đế quốc Assamite [GetTitleByKey('e_assamites').GetNameNoTier]. Kiểm soát những tước hiệu đó cũng được tính."
 molochim_victory_objective_decision: "Trấn Áp Tà Ác"
 molochim_victory_objective_decision_tooltip: "Chúng ta là những kẻ duy nhất ngăn cản lũ Con Cháu trở lại. Nhiệm vụ của chúng ta không được biết ơn, nhưng thiêng liêng."
 molochim_victory_objective_decision_desc: "Nếu chúng ta muốn ngăn lũ Azaneali điên loạn đánh thức những nỗi kinh hoàng cổ xưa, chúng phải bị đánh bại một cách dứt khoát trong cuộc nội chiến đang diễn ra. Đáng buồn thay, chúng ta cũng phải đối phó với sự thù địch của Salubri và Assamite, những kẻ không phân biệt giữa chúng ta và các huynh đệ sa ngã của chúng ta."
 molochim_victory_objective_decision_confirm: "Và giờ, chúng ta phải cho chúng ăn"
 molochim_victory_objective_decision_effect_tooltip: "Ngươi sẽ củng cố các giáo lý Hyron và những tín đồ của nó." 
 molochim_victory_objective_decision_custom: "Kình địch của ngươi, [GetTitleByKey('k_angellisater').GetNameNoTier] phải bị hủy diệt. Cũng như những kẻ thù thường trực của $pod_clan$ ngươi, [GetTitleByKey('k_olives').GetNameNoTier] của Salubri và đế quốc Assamite [GetTitleByKey('e_assamites').GetNameNoTier]"
 ravnos_victory_objective_decision: "Tây và Đông"
 ravnos_victory_objective_decision_tooltip: "Xa quê hương, ngươi phải tự tạo dựng tên tuổi cho mình."
 ravnos_victory_objective_decision_desc: "Ngươi thuộc nhóm thiểu số của $pod_clan$ Ravnos không cư ngụ tại Ấn Độ. Cuộc di cư này đã gây ra nhiều rắc rối cho đồng tộc của ngươi khi ngươi hầu như không được công nhận là một $pod_cainite$. Nhưng có lẽ ngươi có thể trụ vững, và thậm chí phát triển mạnh trong hoàn cảnh này."
 ravnos_victory_objective_decision_confirm: "Một $pod_clan$ Ravnos mới xuất hiện"
 ravnos_victory_objective_decision_effect_tooltip: "Ngươi sẽ hợp nhất $pod_clan$ Ravnos phương Tây và chọn một lập trường để áp dụng đối với đồng tộc phương Đông của ngươi." 
 indian_victory_objective_decision: "Chấm Dứt Kẻ Vĩnh Hằng"
 indian_victory_objective_decision_tooltip: "Tiểu lục địa đang bị xâu xé bởi chiến tranh và xung đột. Ngươi phải đứng lên và hành động."
 indian_victory_objective_decision_desc: "Cuộc Chiến Vĩnh Hằng giữa các $pod_cainites$ Ấn Độ bản địa và [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] xâm lược đã kéo dài lâu hơn bất kỳ ai có thể nhớ nổi. Ấn Độ sẽ không bao giờ được tự do trừ khi có ai đó có thể đoàn kết những người bảo vệ khác biệt của nó."
 indian_victory_objective_decision_confirm: "Cuối cùng, chúng ta đã thắng"
 indian_victory_objective_decision_effect_tooltip: "Ngươi sẽ thống nhất Ấn Độ, giành lấy danh hiệu Chakravarti và bắt đầu thanh trừng những [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] còn lại." 
 kueijin_victory_objective_decision: "Sự Trỗi Dậy Của Mặt Trời Đỏ Thẫm"
 kueijin_victory_objective_decision_tooltip: "Cuộc Chiến Vĩnh Hằng là một chuyện đáng hổ thẹn, một điều mà dân tộc ngươi không thể chịu thua được."
 kueijin_victory_objective_decision_desc: "Cuộc xâm lược Ấn Độ của [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] đã bế tắc hàng thiên niên kỷ nay, với hàng ngàn kẻ chết đi mà lũ Kin-Jin ngoan cố không hề tỏ ra gần với việc đầu hàng hơn. Ngươi sẽ không mắc kẹt với số phận tương tự."
 kueijin_victory_objective_decision_confirm: "Gửi một thông điệp đến các Triều Đình Bản Xứ"
 kueijin_victory_objective_decision_effect_tooltip: "Ngươi sẽ thống nhất Ấn Độ. Sau đó ngươi sẽ chọn cách đối phó với các Triều Đình Bản Xứ." 
 laibon_victory_objective_decision: "Vương Quốc Hắc Ngà"
 laibon_victory_objective_decision_tooltip: "Con Cháu của Cagn luôn nội chiến với nhau, và điều này đã cho phép các mối đe dọa ngoại lai bám rễ vào Vương Quốc Hắc Ngà."
 laibon_victory_objective_decision_desc: "Châu Phi đang chia rẽ, với những $pod_cainites$ xâm lấn từ thế giới Hồi Giáo và xa hơn nữa đang tuyên bố vùng đất của chúng ta là của chúng. Đã đến lúc đẩy lùi chúng."
 laibon_victory_objective_decision_confirm: "Chúng ta đã bảo vệ Châu Phi"
 laibon_victory_objective_decision_effect_tooltip: "Ngươi sẽ thống nhất Vương Quốc Hắc Ngà và gặt hái vinh quang to lớn đi kèm với thành tựu như vậy." 
 restore_the_dream: "Khôi Phục Giấc Mộng"
 restore_the_dream_tooltip: "Chừng nào còn Ma Cà Rồng tin vào nó, Giấc Mộng vẫn có thể trỗi dậy từ đống tro tàn."
 restore_the_dream_desc: "Năm 1204 đã hủy diệt chốn không tưởng vô song từng là Giấc Mộng Constantinople. Bi kịch như vậy sẽ mở ra một kỷ nguyên bóng tối khủng khiếp cho thế giới $pod_cainite$, trừ khi ai đó một lần nữa khoác lên mình chiếc áo choàng của Michael."
 restore_the_dream_confirm: "Như nó đã từng, nó sẽ lại như vậy."
 restore_the_dream_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Đế Quốc Giấc Mộng." 
 witching_lands: "Sáng Lập Vùng Đất Phù Thủy"
 witching_lands_tooltip: "Thời của các Druid đã đến."
 witching_lands_desc: "Với sự trỗi dậy của các giáo phái Druid và ma-cà-rồng-phù-thủy, chính những khu rừng của Quần Đảo Anh dường như đã nổi loạn chống lại các lãnh địa Hậu duệ Cain cũ kỹ. Một bản đồng ca mới vang lên khắp Đảo Quyền Trượng và Đảo Ngọc Lục Bảo; các Druid - từng bị mọi Hậu duệ Cain khước từ - giờ đứng lên chiến thắng, và những khu rừng tăm tối của họ sẽ lan rộng mãi mãi."
 witching_lands_confirm: "Mãi mãi, và mãi mãi."
 witching_lands_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Vùng Đất Phù Thủy." 
 restore_the_black_cross: "Khôi Phục Thập Tự Đen"
 restore_the_black_cross_tooltip: "Nước Đức cần một sự lãnh đạo mạnh mẽ của Ventrue hơn bao giờ hết."
 restore_the_black_cross_desc: "Thập Tự Đen đầu tiên của Hardestadt có những sai sót, nhưng dù sao nó cũng là minh chứng cho sự lãnh đạo của Ventrue mà chúng ta có thể dùng để hợp thức hóa quyền cai trị của mình."
 restore_the_black_cross_confirm: "Dưới bóng Thập Tự một lần nữa."
 restore_the_black_cross_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Đế Quốc Thập Tự Đen." 
 restore_the_voivodate: "Khôi Phục Voivodate"
 restore_the_voivodate_tooltip: "Tzimisce là một đám hỗn loạn, và cần một sự lãnh đạo mạnh mẽ."
 restore_the_voivodate_desc: "Là một công cụ chính trị, Voivodate luôn bị tranh giành. Nhưng nó vẫn là một tước hiệu danh giá, và có thể được làm cho mạnh mẽ hơn bao giờ hết."
 restore_the_voivodate_confirm: "Chúng ta bước vào đây một lần nữa."
 restore_the_voivodate_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Đế Quốc Voivodate." 
 restore_the_sea_of_shadows: "Khôi Phục Biển Bóng Tối"
 restore_the_sea_of_shadows_tooltip: "Thủy tổ của chúng ta, Lasombra, cần một cánh tay phải mạnh mẽ để lãnh đạo $pod_clan$ của ngài."
 restore_the_sea_of_shadows_desc: "Lãnh địa Lasombra luôn được lãnh đạo bởi Montano, đứa con trung thành nhất của Lasombra. Nhưng thời thế đang thay đổi, và một kẻ được sủng ái mới có thể xuất hiện."
 restore_the_sea_of_shadows_confirm: "Thưa cha, hãy chứng kiến con thăng tiến!"
 restore_the_sea_of_shadows_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Đế Quốc Biển Bóng Tối." 
 restore_avalon: "Khôi Phục Avalon"
 restore_avalon_tooltip: "Lãnh địa của một vị Thần không bao giờ thực sự chết."
 restore_avalon_desc: "Như ngươi đã biết, Mithras giống một vị Thần hơn là Ma Cà Rồng. Dù hắn có quyết định một ngày nào đó trở về với các tín đồ của mình hay không, ngươi phải chuẩn bị một lãnh địa phàm trần cho các tín đồ của hắn."
 restore_avalon_confirm: "Chúng ta đã sẵn sàng."
 restore_avalon_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Đế Quốc Avalon." 
 restore_love: "Khôi Phục Triều Đình Tình Yêu"
 restore_love_tooltip: "Nước Pháp sẽ là của Toreador, hoặc sẽ chẳng là gì cả."
 restore_love_desc: "Triều Đình Tình Yêu là biểu hiện cho chiến thắng của Nữ Tộc Trưởng Toreador trước Ventrue tại Pháp. Cuộc phiêu lưu chính trị và nghệ thuật vĩ đại này không thể để mục nát thành lịch sử."
 restore_love_confirm: "Suy cho cùng, Tình Yêu là vĩnh cửu."
 restore_love_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Đế Quốc Triều Đình Tình Yêu." 
 restore_midgard: "Khôi Phục Midgard"
 restore_midgard_tooltip: "Odin vẫn đang dõi theo chúng ta."
 restore_midgard_desc: "Midgard đã hứng chịu hết thất bại này đến thất bại khác khi [Glossary('Einherjar','game_concept_einherjar_desc')] sụp đổ trước cuộc xâm lược của Ventrue. Để sống sót, họ sẽ cần một cuộc phản công mạnh mẽ và một Vị Tối Cao mới."
 restore_midgard_confirm: "Ragnarok có thể chờ đợi."
 restore_midgard_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Đế Quốc Midgard." 
 restore_ashirra: "Khôi Phục Bay't el-Awal"
 restore_ashirra_tooltip: "Các Tín Đồ cần một mái nhà."
 restore_ashirra_desc: "Bay't el-Awal là một sáng tạo còn non trẻ theo tiêu chuẩn Ma Cà Rồng. Nhưng nó đã được hậu thuẫn bởi đức tin của hàng triệu người, và như vậy, chỉ có thể trỗi dậy một lần nữa khi đến thời điểm thích hợp."
 restore_ashirra_confirm: "Allah quả thực vĩ đại."
 restore_ashirra_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Đế Quốc Bay't el-Awal." 
 restore_alamut: "Khôi Phục Alamut"
 restore_alamut_tooltip: "Con Cháu Haqim lạc lối khi không có mái nhà của họ."
 restore_alamut_desc: "Được cho là bất khả xâm phạm, Alamut không chỉ là một pháo đài đối với $pod_clan$ Haqimite. Là một biểu tượng chính trị cho ý chí và sự đoàn kết của Haqim, nó phải được khôi phục toàn vẹn nếu Con Cháu muốn thịnh vượng trở lại."
 restore_alamut_confirm: "Gió đã đổi chiều thuận lợi cho chúng ta."
 restore_alamut_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Đế Quốc Alamut." 
 restore_giovanni: "Khôi Phục Gia Đình"
 restore_giovanni_tooltip: "Khởi đầu của Gia Đình không được suôn sẻ như mong đợi."
 restore_giovanni_desc: "Giovanni đã hứng chịu những thất bại, nhưng giờ chúng ta có cả vĩnh hằng để vươn lên đỉnh cao. Hãy bắt đầu bằng việc đưa gia đình đoàn tụ trở lại."
 restore_giovanni_confirm: "Thỏa thuận hoàn hảo."
 restore_giovanni_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Vương Quốc Giovanni." 
 restore_ravnos: "Khôi Phục $pod_clan$"
 restore_ravnos_tooltip: "Cuộc Chiến Vĩnh Hằng không cho phép bất kỳ sự bất đồng nào."
 restore_ravnos_desc: "Chúng ta đã mất vùng đất trung tâm thống nhất của $pod_clan$ Ravnos. Đòn giáng nặng nề vào niềm kiêu hãnh và tinh thần của chúng ta này phải được trả thù càng sớm càng tốt."
 restore_ravnos_confirm: "Cuộc chiến vẫn tiếp diễn."
 restore_ravnos_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Đế Quốc Ravnos." 
 restore_setite: "Khôi Phục $pod_clan$"
 restore_setite_tooltip: "Vùng Đất Được Chọn phải do các Tín Đồ kiểm soát."
 restore_setite_desc: "Ai Cập luôn là vùng đất trung tâm của $pod_clan$ và đức tin của chúng ta. Nếu chúng ta muốn truyền bá lời của Set ra thế giới, trước tiên chúng ta phải củng cố quyền cai trị của mình ở đây."
 restore_setite_confirm: "Set được ca tụng!"
 restore_setite_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Đế Quốc Setite." 
 restore_talmahera: "Khôi Phục Tal'mahe'Ra"
 restore_talmahera_tooltip: "Ngay cả Enoch cũng phải có một chỗ đứng trên Trái Đất."
 restore_talmahera_desc: "Mặc dù chúng ta vẫn cai trị vững chắc tại [UmbraGlossaryLocalized('shadowlands','Âm Phủ')], việc mối liên kết với cõi phàm trần của chúng ta bị cắt đứt không phải là điều tốt. Tái chiếm những thành trì đã mất là ưu tiên hàng đầu."
 restore_talmahera_confirm: "Mở lại các cánh cổng một lần nữa."
 restore_talmahera_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Đế Quốc Tal'mahe'Ra." 
 restore_obertus: "Khôi Phục Dòng Tu Obertus"
 restore_obertus_tooltip: "Di sản của Constantinople vẫn còn sống mãi."
 restore_obertus_desc: "Là tín đồ của Via Caeli, chúng ta bị phần còn lại của $pod_clan$ Tzimisce nghi ngờ. Nhưng chúng ta có thể tái lập Dòng Tu Obertus xưa để mang lại cho chúng ta chút chính danh trong thời kỳ khó khăn này."
 restore_obertus_confirm: "Vì Con và Cha."
 restore_obertus_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Vương Quốc Obertus." 
 restore_moloch: "Khôi Phục Dòng Tu Moloch"
 restore_moloch_tooltip: "Lũ Con Cháu phải được cho ăn."
 restore_moloch_desc: "Cuộc chiến bóng tối vĩnh cửu của chúng ta để bảo vệ thế giới khỏi lũ quỷ đang diễn biến tồi tệ. Nếu chúng ta muốn sống sót, chúng ta phải đoàn kết dưới một Dòng Tu một lần nữa."
 restore_moloch_confirm: "Giờ thì, đến hố sâu thôi..."
 restore_moloch_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Vương Quốc Dòng Tu Moloch." 
 restore_azaneal: "Khôi Phục Dòng Tu Azaneal"
 restore_azaneal_tooltip: "Chúng ta vẫn có thể mở các hố sâu..."
 restore_azaneal_desc: "Azaneal từng có một tầm nhìn cho Baali. Bất chấp một vài trở ngại, chúng ta vẫn phải đoàn kết đồng tộc mình sau tầm nhìn này, nếu không ngày tận thế linh thiêng sẽ không bao giờ đến."
 restore_azaneal_confirm: "Khởi đầu của sự kết thúc."
 restore_azaneal_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Vương Quốc Dòng Tu Azaneal." 
 restore_web: "Khôi Phục Mạng Lưới Dao Găm"
 restore_web_tooltip: "Chúng ta vẫn còn rất nhiều tai mắt."
 restore_web_desc: "Sự trở lại của Ur-Shulgi phải được chuẩn bị. Mạng Lưới Dao Găm là tổ chức bù nhìn của chúng ta để giành quyền kiểm soát $pod_clan$ Haqimite cho mục đích này. Nó phải được tái thiết."
 restore_web_confirm: "Giờ thì, hãy tiếp quản Alamut."
 restore_web_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Vương Quốc Mạng Lưới Dao Găm." 
 restore_lost_tribe: "Khôi Phục Bộ Tộc Thất Lạc"
 restore_lost_tribe_tooltip: "Tầm nhìn của Anosh còn hơn cả một lãnh thổ."
 restore_lost_tribe_desc: "Nếu chúng ta muốn đẩy nhanh sự trả thù của Thế Hệ Thứ 2 cho đứa con lạc lối của họ, chúng ta cần một căn cứ hoạt động vững chắc. Bộ Tộc Thất Lạc của Dastur Anosh là một nơi hoàn hảo."
 restore_lost_tribe_confirm: "Trên con đường đến Enoch..."
 restore_lost_tribe_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Vương Quốc Bộ Tộc Thất Lạc." 
 restore_olives: "Khôi Phục Nghị Hội Ô Liu"
 restore_olives_tooltip: "$pod_clan$ Salubri chưa chết hẳn."
 restore_olives_desc: "Cuộc kháng cự cuối cùng của Qawiya quanh các Quốc Gia Thập Tự Chinh thật đáng khen ngợi. Nếu chúng ta muốn cứu $pod_clan$ Salubri, chúng ta có thể học theo phương pháp của bà."
 restore_olives_confirm: "Đến đây nào, Tremere."
 restore_olives_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Vương Quốc Nghị Hội Ô Liu." 
 restore_see_of_nod: "Khôi Phục Tòa Thánh Nod"
 restore_see_of_nod_tooltip: "Các Tín Đồ cần một Giáo Hội."
 restore_see_of_nod_desc: "Giáo Hội của Caine Đệ Tam đang trong những giờ phút cuối cùng, bị những kẻ không tin quấy nhiễu khắp nơi. Một sự thể hiện đức tin, và sức mạnh, phải được thực hiện bằng cách thu hồi Venice, tòa thánh của vị Tổng Giám Mục đầu tiên."
 restore_see_of_nod_confirm: "Giờ thì, hãy truyền bá lời răn."
 restore_see_of_nod_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Vương Quốc Tòa Thánh Nod." 
 restore_tremere: "Khôi Phục Tremere"
 restore_tremere_tooltip: "Mọi Pháp Sư đều cần một thư phòng."
 restore_tremere_desc: "Sự sống còn của chúng ta bấp bênh, với kẻ thù đang áp sát, nhưng Tremere không phải hạng vừa khi nói đến sự kiên cường. Chúng ta có thể tái thiết trụ sở quyền lực của $pod_clan$ ở khắp mọi nơi, nếu cần."
 restore_tremere_confirm: "Chuẩn bị Phòng Nghị Sự."
 restore_tremere_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Đế Quốc Nhà Tremere." 
 restore_curtain: "Khôi Phục Màn Bóng Tối"
 restore_curtain_tooltip: "Bà Ngoại cần những kẻ giúp việc của mình."
 restore_curtain_desc: "Các đặc vụ của Thủy Tổ đã giáng những đòn nặng nề vào chúng ta. Nhưng Bà Ngoại vẫn đang ngủ say và cần được bảo vệ. Chúng ta không được nao núng."
 restore_curtain_confirm: "Chúc một giấc ngủ yên bình."
 restore_curtain_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Đế Quốc Màn Bóng Tối." 
 restore_erciyes: "Khôi Phục Erciyes"
 restore_erciyes_tooltip: "Ngọn núi tiên tri thuộc về chúng ta theo lẽ đương nhiên."
 restore_erciyes_desc: "Chính Cappadocius đã ra sắc lệnh rằng Erciyes là căn cứ chính cho $pod_clan$. Chúng ta phải đoàn kết lại và chiếm lấy nó như đã từng làm lần đầu tiên."
 restore_erciyes_confirm: "Nó sẽ cần một ít dọn dẹp."
 restore_erciyes_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Vương Quốc Erciyes." 
 restore_crescent: "Khôi Phục Trăng Lưỡi Liềm Nửa Đêm"
 restore_crescent_tooltip: "Iberia chưa mất hẳn."
 restore_crescent_desc: "Nỗ lực của Badr nhằm ngăn chặn cuộc Tái Chinh Phục của Cơ Đốc Giáo đã không diễn ra suôn sẻ. Nhưng chúng ta có thể làm tốt hơn, và thống nhất miền nam Iberia cho các Tín Đồ một lần nữa."
 restore_crescent_confirm: "Giờ thì, hãy hướng về phía bắc..."
 restore_crescent_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Vương Quốc Trăng Lưỡi Liềm Nửa Đêm." 
 restore_feral: "Khôi Phục Bầy Hoang Dã"
 restore_feral_tooltip: "Chúng ta nên tụ họp lại một lần nữa!"
 restore_feral_desc: "Nhiều lãnh chúa Gangrel đã cố gắng đoàn kết $pod_clan$ bằng ngoại giao hoặc vũ lực. Chúng ta phải làm tốt hơn họ và thực sự thành công."
 restore_feral_confirm: "Cuộc Săn bắt đầu."
 restore_feral_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Vương Quốc Bầy Hoang Dã." 
 restore_eastern: "Khôi Phục Các Lãnh Chúa Phương Đông"
 restore_eastern_tooltip: "Ventrue mang phong cách Hungary."
 restore_eastern_desc: "Ventrue phía đông nước Đức là một giống loài hiếm, bị nhìn bằng ánh mắt nghi ngờ. Vì vậy, họ nên đoàn kết lại với nhau như Các Lãnh Chúa Phương Đông đã từng làm dưới trướng Bulscu."
 restore_eastern_confirm: "Vương quyền đích thực trở lại vùng đất này."
 restore_eastern_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Vương Quốc Các Lãnh Chúa Phương Đông." 
 restore_thunder: "Khôi Phục Vô Tận Lôi Đình"
 restore_thunder_tooltip: "Triều Đình phải được tái thiết nếu chu kỳ muốn tiếp tục."
 restore_thunder_desc: "Xa lạ với cả Kin-Jin lẫn các [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] khác, chúng ta luôn ở bên bờ tuyệt chủng. Nhưng đức tin của chúng ta mạnh mẽ, và Triều Đình có thể trỗi dậy một lần nữa."
 restore_thunder_confirm: "Phượng hoàng đã hồi sinh một lần nữa."
 restore_thunder_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Đế Quốc Vô Tận Lôi Đình." 
 #restore_scarlet: "Restoring the Scarlet Court"
 #restore_scarlet_tooltip: "The Scarlet Court holds [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] power for most of southeastern Asia."
 #restore_scarlet_desc: "A powerful, but somewhat outsider, member of the five august Courts of the [Glossary('Wan Kuei','game_concept_kuei_jin_desc')], the Scarlet Phoenix is a suitable trophy for any ambitious [Glossary('Hungry Dead','game_concept_kuei_jin_desc')]."
 #restore_scarlet_confirm: "A new phoenix is born."
 #restore_scarlet_effect_tooltip: "You will create the Scarlet Phoenix Empire [title|E]." 
 #restore_celestial: "Restoring the Celestial Tribe"
 #restore_celestial_tooltip: "Godhood is not an easy journey."
 #restore_celestial_desc: "Unrepentant Godlings aren't welcome by other [Glossary('Wan Kuei','game_concept_kuei_jin_desc')], and even less by Kin Jin. As such, the Celestial Tribe is always in danger, but is flexible enough to be rebuilt wherever needed."
 #restore_celestial_confirm: "Ants meddling with Gods."
 #restore_celestial_effect_tooltip: "You will create the Celestial Tribe Kingdom [title|E]." 
 restore_golden: "Khôi Phục Thập Tự Vàng"
 restore_golden_tooltip: "Occitania chưa phải là của Pháp."
 restore_golden_desc: "Nổi dậy chống lại sự bạo ngược của Triều Đình Tình Yêu tại Paris, Thập Tự Vàng là biểu tượng cho sự tinh thông và độc lập của Occitania. Một lời kêu gọi tập hợp đầy sức mạnh mà chúng ta có thể sử dụng."
 restore_golden_confirm: "Paris không định nghĩa được chúng ta."
 restore_golden_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Vương Quốc Thập Tự Vàng." 
 restore_grand: "Khôi Phục Đại Triều Đình"
 restore_grand_tooltip: "Nước Pháp vẫn có thể thuộc về chúng ta."
 restore_grand_desc: "Những sai lầm của Alexander đã khiến $pod_clan$ Ventrue mất nước Pháp. Nhưng mọi thứ có thể thay đổi, và chúng ta có thể trở lại với tư cách những kẻ cai trị hợp pháp của Vương Quốc hùng mạnh này."
 restore_grand_confirm: "Sự thống trị của Ventrue là không thể thương lượng."
 restore_grand_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Vương Quốc Đại Triều Đình." 
 restore_timisoara: "Khôi Phục Timisoara Banat"
 restore_timisoara_tooltip: "Carthage của Phương Đông."
 restore_timisoara_desc: "Những nỗ lực tạo ra một chốn không tưởng mới của Dominic đã bị cản trở bởi, một lần nữa, $pod_clan$ Ventrue đê tiện. Dù vậy, ý tưởng của ông vẫn có giá trị, và chúng ta có thể nhặt lại những mảnh vỡ và bắt đầu lại."
 restore_timisoara_confirm: "Một khởi đầu mới đầy hy vọng."
 restore_timisoara_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Vương Quốc Timisoara Banat." 
 restore_anda: "Khôi Phục Bộ Lạc [Glossary('Anda','podgloss.anda')]"
 restore_anda_tooltip: "Tiếng vó ngựa vẫn còn có thể nghe thấy."
 restore_anda_desc: "[Glossary('Anda','podgloss.anda')] đối mặt với nhiều kẻ thù, với [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] căm hận ở phía đông và Gangrel thù địch ở phía tây. Nhưng tinh thần Mông Cổ không dễ bị thuần hóa như vậy. Bộ Lạc sẽ trỗi dậy lần nữa."
 restore_anda_confirm: "Chúng ta cưỡi ngựa một lần nữa."
 restore_anda_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Đế Quốc Bộ Lạc [Glossary('Anda','podgloss.anda')]." 
 ruler_exit_torpor: "Tỉnh Dậy Từ Cơn Mê"
 ruler_exit_torpor_tooltip: "Cai trị từ giấc ngủ say không phải là điều dễ dàng nhất."
 ruler_exit_torpor_desc: "Bất kỳ Ma Cà Rồng nào đáng giá cũng có một kế hoạch dự phòng trong trường hợp hắn rơi vào $pod_torpor$ ngoài ý muốn. Vì ngươi giờ đây là kẻ cai trị danh nghĩa của những Ma Cà Rồng khác, đây có thể là thời điểm tốt để kích hoạt kế hoạch dự phòng đó."
 ruler_exit_torpor_confirm: "Ta đã trở lại."
 restore_golconda: "Khôi Phục Golconda"
 restore_golconda_tooltip: "Giấc mộng của Saulot sẽ không bao giờ thực sự chết."
 restore_golconda_desc: "Golconda là thành phố nơi Saulot tìm thấy trạng thái linh thiêng cùng tên. Đây là điều tối quan trọng đối với bất kỳ Salubri nào mong muốn được hòa hợp với thủy tổ của mình trong sự hiệp thông thánh thiện này."
 restore_golconda_confirm: "Thêm một bước nữa hướng tới giác ngộ."
 restore_golconda_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Vương Quốc Golconda." 
 restore_livonia: "Khôi Phục Livonia"
 restore_livonia_tooltip: "Thập Tự Giá sẽ không bao giờ hủy diệt được chúng ta."
 restore_livonia_desc: "Bị các $pod_cainites$ hiệp sĩ của Thập Tự Giá gây áp lực nặng nề trong nhiều thế kỷ, các tín đồ của Via Bestiae đã được thống nhất, trong một thời gian, dưới ngọn cờ của Qarakh người Gangrel. Tinh thần kháng cự này vẫn có thể là một tài sản mạnh mẽ cho chính nghĩa của chúng ta."
 restore_livonia_confirm: "Không lùi một bước."
 restore_livonia_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Vương Quốc Bầy Hoang Dã Livonia." 
 restore_reconquista: "Khôi Phục Lasombra Tây Ban Nha"
 restore_reconquista_tooltip: "Với Đức Tin và Bóng Tối, chúng ta sẽ trở lại."
 restore_reconquista_desc: "Cuộc nội chiến Lasombra tại Tây Ban Nha chủ yếu là một vụ việc chính trị, nhưng nó đã mang lại nhiều cơ hội cho các thành viên trẻ tuổi hơn của $pod_clan$. Bằng cách khai thác di sản của nó, hy vọng chúng ta sẽ có thể gặt hái được những phần thưởng tương tự."
 restore_reconquista_confirm: "Trở lại nhà của chúng ta."
 restore_reconquista_effect_tooltip: "Ngươi sẽ tạo ra [title|E] Vương Quốc Tái Chinh Phục Bóng Tối."
 occupy_san_michele_decision: "Chiếm Đóng Tu Viện San Michele"
 occupy_san_michele_decision_tooltip: "Tạo một trụ sở cho Tòa Án Dị Giáo"
 occupy_san_michele_decision_desc: "[st_peters_city|E] đang trong vòng nô lệ. Nếu chúng ta có thể giải phóng nàng, chúng ta sẽ cư ngụ tại một trong những tu viện của nàng, để nó có thể phục vụ như một trụ sở chống lại các thế lực bóng tối."
 occupy_san_michele_decision_confirm: "Giải Phóng Thánh Địa"
 occupy_san_michele_decision_effect_tooltip: "[grand_city|E] La Mã sẽ nhận được 5 [buildings|E] độc nhất.\nNgươi có thể nâng cấp chúng hoàn toàn một khi ngươi giúp đỡ các Dòng Tu Dị Giáo khác:\n$EFFECT_LIST_BULLET$[GetBuilding('rome_san_michele_library_03').GetName]\n$EFFECT_LIST_BULLET$[GetBuilding('rome_san_michele_aedificium_03').GetName]\n$EFFECT_LIST_BULLET$[GetBuilding('rome_san_michele_reliquary_03').GetName]\n$EFFECT_LIST_BULLET$[GetBuilding('rome_san_michele_basilica_03').GetName]\n$EFFECT_LIST_BULLET$[GetBuilding('rome_san_michele_cloisters_03').GetName]"
 restore_red_order: "Khôi Phục Dòng Tu Đỏ"
 restore_red_order_tooltip: "Chúng ta đã biết Địa Ngục. Chúng ta đã lấy tri thức bất khiết của nó, để bổ trợ cho lời răn của đấng thần thánh."
 restore_red_order_desc: "Sự sụp đổ của lãnh địa chính của chúng ta không ngăn cản được các nghiên cứu của chúng ta. Thông qua phước lành thánh thiện và bất khiết, chúng ta sẽ chiếm lại đất đai của mình."
 restore_red_order_confirm: "Hãy đào sâu hơn."
 restore_red_order_effect_tooltip: "Ngươi sẽ tái tạo [title|E] Vương Quốc Dòng Tu Đỏ." 
 restore_knights_of_acre: "Khôi Phục Các Hiệp Sĩ Acre"
 restore_knights_of_acre_tooltip: "Như thanh kiếm được tôi luyện lại, chúng ta sẽ tái rèn thanh kiếm của Chúa!"
 restore_knights_of_acre_desc: "Chừng nào còn một huynh đệ mang Thập Tự Giá, di sản của dòng tu sẽ còn tồn tại."
 restore_knights_of_acre_confirm: "Chúng ta đã giành lại Quê Nhà."
