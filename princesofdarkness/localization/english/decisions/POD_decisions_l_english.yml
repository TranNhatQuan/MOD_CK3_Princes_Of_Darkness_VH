 #ask_pope_decision: "Ask the Holy Father for funds"
 #ask_pope_decision_desc: "You will petition the Bishop of Rome for gold to support the cause."
 #ask_pope_decision_confirm: "Write the letter"
 #ask_pope_decision_tooltip: "The Pope will certainly hear my plea!"
 #ask_pope_decision_effect_tooltip: "It will take some finesse on your part to handle the byzantine politics of the Holy See"
 #ask_pope.1.t: "Funding Request"
 #ask_pope.1.desc: "Your choice is to either settle on the amount of monetary aid provided in the order's founding charter or persuade the pope to reach deeper into the coffers at the risk of upsetting him."
 #ask_pope.a: "Request additional funds, exaggerate the threat."
 #ask_pope.a.success: "You painted a terrifying picture of the looming threat."
 #ask_pope.a.failure: "The pope dismissed your report as fear-mongering."
 #ask_pope.b: "Request additional funds, underline the holiness of the cause."
 #ask_pope.b.success: "You succeeded in appealing to Holy Father's zealous side."
 #ask_pope.b.failure: "You failed to elevate your cause above the pope's other expenses."
 #ask_pope.c: "Request additional funds, flatter the Holy Father."
 #ask_pope.c.success: "You tickled the Holy Father's vanity to get on his good side."
 #ask_pope.c.failure: "The pope saw through your obvious attempts at flattery."
 #ask_pope.d: "Request additional funds, inflate your expenses." 
 #ask_pope.d.success: "You moved the numbers around in the ledgers to justify additional funding."
 #ask_pope.d.failure: "The pope wasn't fooled by your creative accounting."
 #ask_pope.e: "Simply request the agreed upon sum."
 #ask_pope.a.success.t: "The pope believes you."
 #ask_pope.a.success.desc: "The Holy Father is shaken to his very core by the mayhem and depravity you witnessed. He sends a double allowance."
 #ask_pope.a.failure.t: "The pope is skeptical."
 #ask_pope.a.failure.desc: "You embellished your report to such a fantastical degree, the Holy Father begins to doubt whether there is anything that you do besides fabricating stories."
 #ask_pope.b.success.t: "The pope is convinced."
 #ask_pope.b.success.desc: "The Holy Father agrees, there is no cause more just for a clergyman than protecting his flock. He sends a double allowance."
 #ask_pope.b.failure.t: "The pope reconsiders his expenses."
 #ask_pope.b.failure.desc: "Your inept description of the cause of your order reminded the Holy Father of more immediate expenses."
 #ask_pope.c.success.t: "The pope is flattered."
 #ask_pope.c.success.desc: "Your subtle and finely tailored flattery made you one of Holy Father's favorite persons to fund. He sends a double allowance."
 #ask_pope.c.failure.t: "The pope sees through your flattery."
 #ask_pope.c.failure.desc: "Your brutish attempts at flattering the Holy Father were received as nothing short of insulting."
 #ask_pope.d.success.t: "You managed to justify the budget."
 #ask_pope.d.success.desc: "The Holy Father conceded that your mission might be a more costly endeavor than initially anticipated."
 #ask_pope.d.failure.t: "Your books are suspect."
 #ask_pope.d.failure.desc: "Your inept attempt at inflating your expenses lead the papal accountants to conclude that you are, in fact, over-funded."
 #ask_pope.e.t: "You receive funding."
 #ask_pope.e.desc: "Just the amount provided in the designated fund, no more, no less." 
 conversion_decision: "Cải Đạo Hàng Loạt"
 conversion_decision_tooltip: "Cải đạo vương quốc của ngươi sang Chính Tín của ngươi"
 conversion_decision_desc: "Là một tín đồ chân chính, ngươi có thể tổ chức một chiến dịch truyền giáo sánh ngang với các Thánh xưa kia."
 conversion_decision_effect_tooltip: "Các quận trong vương quốc của ngươi sẽ cải sang tín ngưỡng của ngươi."
 conversion_decision_confirm: "Chúng ta sẽ cho họ thấy Ánh Sáng!"
 reclusion_decision: "Tập Trung Vào Đức Tin"
 reclusion_decision_tooltip: "Dành thời gian chiêm nghiệm để có thêm sự thấu hiểu về Chính Tín của ngươi"
 reclusion_decision_desc: "Bằng cách tự tách mình khỏi chốn chính trị nhơ nhớp của $pod_cainite$, ngươi có thể, hy vọng là vậy, đạt được sự bình an trong tâm trí và đức tin được đổi mới."
 reclusion_decision_effect_tooltip: "Ngươi sẽ được đưa ra một lựa chọn về cách nhận điểm kinh nghiệm lối sống Chính Tín"
 reclusion_decision_confirm: "Bình yên, cuối cùng"
 reclusive_leader_modifier: "Lãnh Chúa Ẩn Dật"
 reclusive_leader_modifier_desc: "Gần đây ngươi đã dành thời gian tránh xa mưu mô triều chính. Điều này bị các đối thủ của ngươi xem là một điểm yếu."
 PODinquisition.9999.t: "Con Đường của Đấng Thiêng Liêng"
 PODinquisition.9999.desc: "Ngươi đã chọn dành chút thời gian rời xa triều đình để tập trung vào ngọn lửa đức tin bừng cháy từ tận đáy tâm hồn ngươi. Không nghi ngờ gì, đó là một lựa chọn đức hạnh, nhưng chính trị ma cà rồng chẳng chờ đợi ai, và ngươi phải chọn xem mình muốn dành ra chính xác bao nhiêu thời gian để mặc cho các đối thủ âm mưu sau lưng mình..."
 PODinquisition.9999.a: "Ta sẽ dành ra khoảng thời gian tối thiểu"
 PODinquisition.9999.b: "Ta có thể cố gắng thêm một chút, ta sẽ giành lại quyền kiểm soát triều đình sau"
 PODinquisition.9999.c: "Ta có thể làm cả hai!"
 PODinquisition.9999.c.effect.success.desc: "Một thành công lớn sẽ cho phép ngươi tiến xa hơn dự kiến"
 PODinquisition.9999.cb.effect.success.desc: "Ngươi đã thành công trong việc tu tập"
 PODinquisition.9999.cc.effect.success.desc: "Một thất bại hoàn toàn, ngươi mất cả thời gian lẫn vốn liếng chính trị"
 PODinquisition.9999.c.success: "Một thành công hoàn toàn!"
 PODinquisition.9999.cb.success: "Một thành công vừa phải"
 PODinquisition.9999.cc.success: "Một thất bại toàn diện..."
 talmahera_victory_objective_decision: "Khởi Đầu của Ngày Tận Thế"
 talmahera_victory_objective_decision_tooltip: "Ngươi phải chuẩn bị cho sự cáo chung của giống loài $pod_cainite$"
 talmahera_victory_objective_decision_desc: "Tal'mahe'Ra đang chia rẽ giữa Đông và Tây, bị cắt đôi bởi Assamite của Ba Tư và Ravnos của Ấn Độ. Nếu ngươi muốn chuẩn bị cho sự trở lại của [Glossary('Antediluvians','game_concept_antediluvian_desc')], sự ly giáo này phải được hàn gắn."
 talmahera_victory_objective_decision_effect_tooltip2: "Ngươi sẽ tạo một mối liên kết đến Enoch tại kinh đô của ngươi, và các đặc vụ của ngươi sẽ bắt đầu miệt mài hướng tới mục tiêu vĩ đại"
 talmahera_victory_objective_decision_confirm: "Chúng ta được dẫn dắt bởi bổn phận"
 talmahera_victory_objective_decision_custom: "Hoặc ngươi hoặc không một ai kiểm soát [GetTitleByKey('k_losttribe').GetNameNoTier]"
 talmahera_victory_objective_decision_customb: "[GetScriptedCharacterByHistoryID('790219').GetFirstName], thủ lĩnh phản bội của Lost Tribe, phải chết hoặc đang trong $pod_torpor$"
 blackcross_victory_objective_decision: "Dưới Cây Thập Tự Đen"
 blackcross_victory_objective_decision_tooltip: "Phương Đông đang chờ được chiếm lấy"
 blackcross_victory_objective_decision_desc: "Bất chấp nỗ lực thất bại của Jürgen von Verden, các Ventrue người Đức vẫn đang nhòm ngó Phương Đông như một vùng đất hoang dã chưa được thuần hóa. Nhưng nhiều kẻ thù sẽ cần phải bị xử lý trước khi có thể đạt được sự lãnh đạo Ventrue đúng nghĩa."
 blackcross_victory_objective_decision_effect_tooltip2: "Ngươi sẽ có được yêu sách đối với các vương quốc Phương Tây. Một ứng viên mới sẽ đến triều đình ngươi."
 blackcross_victory_objective_decision_confirm: "Một kỷ nguyên mới của sự lãnh đạo Ventrue"
 blackcross_victory_objective_decision_custom: "Hoặc ngươi hoặc không một ai kiểm soát [GetTitleByKey('k_ferals_livonia').GetNameNoTier] và [GetTitleByKey('e_voivodate').GetNameNoTier]"
 enter_torpor_decision: "Vào Torpor"
 enter_torpor_decision_tooltip: "Tự nguyện đi vào $pod_torpor$ không phải là điều vinh dự nhất mà một lãnh chúa có thể làm"
 enter_torpor_decision_desc: "Bất kỳ kẻ bất tử nào cũng có thể chán ngán việc duy trì hoạt động trong thời gian dài. Và giờ ngươi đã xong việc với thời đại này, có lẽ đã đến lúc nghỉ ngơi và để những người thừa kế tự lo liệu mọi việc?"
 enter_torpor_decision_confirm: "Đã đến lúc nghỉ ngơi"
 enter_little_death_decision: "Vào Tiểu Tử"
 enter_little_death_decision_desc: "Bất kỳ Wan-Kuei nào cũng có thể chán ngán việc bất tử trong thời gian dài. Và giờ ngươi đã chán thời đại này, có lẽ đã đến lúc nghỉ ngơi trong Tiểu Tử?"
 enter_slumber_decision: "Vào Giấc Ngủ Dài"
 enter_slumber_decision_desc: "Thời đại này khiến ngươi chán chường. Có lẽ đã đến lúc bước vào một Giấc Ngủ Dài sâu thẳm và tỉnh dậy trong một thời đại mới thú vị hơn?"
 enter_coccon_decision: "Vào Kén"
 enter_coccon_decision_desc: "Nhân vật tự bọc mình trong một lớp vỏ cứng trong khi quá trình trao đổi chất chậm lại thành trạng thái ngủ đông."
 enter_long_sleep_decision: "Nghi Thức Giấc Ngủ Dài"
 enter_long_sleep_decision_desc: "Với việc thực hiện nghi thức, Gurahl có thể đưa một cá nhân vào trạng thái ngủ đông không khác gì khả năng ngủ đông tự nhiên của loài gấu. Trong khi ở trạng thái này, đối tượng không già đi; các chức năng cơ thể ngừng lại, và hô hấp giảm xuống mức tối thiểu tuyệt đối. Nghi thức này giúp có thể duy trì những cá nhân bị tàn phế trong một khoảng thời gian vô hạn định, giữ họ sống để có thể được chữa lành (bằng cách tự nhiên hoặc phép thuật) vào một ngày sau đó."
 enter_dragon_sleep_decision: "Giấc Ngủ của Rồng"
 enter_dragon_sleep_decision_desc: "Mokolé bước vào trạng thái trú đông. Mokolé không già đi khi ngủ, dù nàng có thể mơ. Thông thường Mokolé tự chôn mình trong bùn khi ngủ. Mokolé đang ngủ sẽ tỉnh giấc khi bị di chuyển hoặc chạm vào, nhưng không phải bởi tiếng động thông thường."
 revenant_victory_objective_decision: "Đánh Cắp Sức Mạnh của Vitae"
 revenant_victory_objective_decision_tooltip: "Hành trình đến nguồn cội của sức mạnh."
 revenant_victory_objective_decision_desc: "Hãy tự giải thoát mình khỏi ách chuyên chế của các chủ nhân Kindred của ngươi, sử dụng tri thức huyền bí và các nghi lễ ma quái để khống chế sức mạnh quý giá trong dòng máu của họ."
 revenant_victory_objective_decision_effect_tooltip: "Cuộc tấn công chưa từng có này vào những bí mật của $pod_vitae$ đòi hỏi việc tìm lại các bản thảo cổ xưa cũng như những nghiên cứu của riêng ngươi. Bản thân quy trình sẽ cần những nguyên liệu quý hiếm, đáng chú ý nhất là việc khai thác các dòng máu [Glossary('Antediluvian','game_concept_antediluvian_desc')]."
 revenant_victory_objective_decision_confirm: "Bắt đầu nghi lễ!"
 revenant_victory_objective_decision_custom: "Ngươi đã bắt được một Ma Cà Rồng #V 3#! [GetTrait('vampgeneration4').GetName( GetPlayer )]."
 #revenant_victory_followup_decision: "A Feast for the New Generation"
 #revenant_victory_followup_decision_tooltip: "You will use the obsolete bodies of the children born of imperfect blood to nourish those who come after them."
 #revenant_victory_followup_decision_desc: "On your long quest to transcend the inherent limitations of your $pod_vitae$, your loins gave life to many equally stunted children who have no way to follow your path to redemption. Taking those lives back will be an act of mercy... and frugality."
 #revenant_victory_followup_decision_effect_tooltip: "The old will perish, the new will flourish."
 #revenant_victory_followup_decision_confirm: "Let us leave our weakness behind!"
 #revenant_victory_followup_custom_decision: "You have at least five living descendants carrying your enhanced blood"
 custom_bloodline_objective_decision: "Sức Mạnh của Dòng Máu"
 custom_bloodline_objective_decision_desc: "Ngươi đã chán ngán việc bị xã hội $pod_cainite$ ruồng bỏ vì huyết thống caitiff của mình. Giờ đã đến lúc cuối cùng cũng khẳng định vị thế của ngươi trong thế giới này."
 custom_bloodline_custom_decision:  "Ngươi phải thuộc thế hệ thứ năm hoặc thấp hơn"
 custom_bloodline_objective_decision_effect_tooltip: "Ngươi sẽ tạo ra dòng máu ma cà rồng của riêng mình với các lựa chọn $pod_discipline$ riêng."
 custom_bloodline_objective_decision_confirm: "Thời khắc đã đến"
 custom_bloodline_objective_decision_tooltip: "Ngươi sẽ tạo ra dòng máu ma cà rồng của riêng mình với các lựa chọn $pod_discipline$ riêng."
 PODghw_decision: "Đẩy Mạnh Jyhad"
 PODghw_decision_desc: "Đẩy mạnh Jyhad bằng cách kêu gọi các cuộc thánh chiến lớn."
