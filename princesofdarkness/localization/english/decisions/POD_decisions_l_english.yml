 join_order_decision: "Gia Nhập Shadow Inquisition"
 join_order_decision_desc: "Là một tín đồ chân chính, ngươi muốn trở thành một phần của cuộc chiến chính nghĩa, có lẽ đã đến lúc ghé thăm một người bạn ngươi quen biết và cầu xin được huấn luyện."
 join_order_decision_tooltip: "Bằng cách sử dụng một [character_interaction|E] lên bất kỳ thành viên tổ chức còn sống nào khác (trừ von Murnau) là bạn của ngươi, ngươi sẽ có thể chọn một nhân vật để trở nên có liên hệ."
 join_order_decision_confirm: "Hãy làm điều đó"
 join_wu_decision: "Gia Nhập [Glossary('Wu','podgloss.wu')]"
 join_wu_decision_desc: "Ngươi không phải bước đi trên con đường của mình một mình. Ngươi đã kết nối với những linh hồn lạc lối khác giống như ngươi để hình thành một [Glossary('Wu','podgloss.wu')] — một "gia đình huyết thống" của kẻ bất tử."
 join_wu_decision_tooltip: "Bằng cách sử dụng một [character_interaction|E] lên bất kỳ [GetTrait('kueijin').GetName( GetNullCharacter )] còn sống nào khác là bạn của ngươi, ngươi sẽ có thể chọn một nhân vật để trở nên có liên hệ."
 join_wu_decision_confirm: "Hãy làm điều đó"
 join_ghoulbros_decision: "Gia Nhập Forsaken"
 join_ghoulbros_decision_desc: "Nếu ngươi là bạn với Calomena's Forsaken, ngươi có thể xin được nhập môn"
 join_ghoulbros_decision_tooltip: "Bằng cách sử dụng một [character_interaction|E] lên bất kỳ Calomena Forsaken còn sống nào khác là bạn của ngươi, ngươi sẽ có thể chọn một nhân vật để trở nên có liên hệ."
 join_ghoulbros_decision_confirm: "Hãy làm điều đó"
 join_shih_decision: "Gia Nhập [GetTrait('shih').GetName( GetPlayer )]"
 join_shih_decision_desc: "Tìm kiếm trong hoang dã, lần theo manh mối, vượt qua các thử thách, và trở thành một thành viên của Thợ Săn Phương Đông."
 join_shih_decision_tooltip: "Ngươi sẽ trở thành một [GetTrait('shih').GetName( GetPlayer )]"
 join_shih_decision_confirm: "Hãy làm điều đó"
 POD_convert_government_decision: "Thay Đổi Hình Thức Chính Quyền"
 POD_convert_government_decision_desc: "Ngươi đang sử dụng một loại hình chính quyền không dành cho nhân vật của ngươi. Quyết định này cho phép ngươi thay đổi nó."
 POD_convert_government_decision_tooltip: "Ngươi đang sử dụng một loại hình chính quyền không dành cho nhân vật của ngươi. Quyết định này cho phép ngươi thay đổi nó.\nThay đổi loại [government|E] bằng cách sử dụng một [government|E] phù hợp hơn với nhân vật của ngươi."
 POD_convert_government_decision_confirm: "Chọn Con Đường Đúng Đắn"
 restore_celestial_army_objective_decision: "Khôi Phục Đội Quân Thiên Giới"
 restore_celestial_army_objective_decision_desc: "Hàng trăm năm trước, nhiều [GetTrait('shih').GetName( GetPlayer )] đã chọn đi theo một con đường vĩ đại hơn: Tự gọi mình là 'Đội Quân Thiên Giới', những thợ săn quỷ này tìm cách tiêu diệt shen bất cứ nơi nào chúng trú ngụ, ngay cả khi không cần thiết phải hành động. Nhiều [GetTrait('shih').GetName( GetPlayer )] đã lên án Đội Quân Thiên Giới này, vì họ kinh hãi trước sự vi phạm một trong những mệnh lệnh chính của Yi. Cuối cùng, [GetTrait('shih').GetName( GetPlayer )] trở nên kiêu ngạo và trục xuất mọi thợ săn quỷ không thuộc về Đội Quân Thiên Giới. Chính lúc đó trụ sở của họ bị phá hủy trong một trận động đất, chỉ để lại những kẻ lang thang."
 restore_celestial_army_objective_decision_tooltip: "Ngôi trường vĩ đại nhất của Đội Quân Thiên Giới được xây dựng tại Dãy Núi Côn Lôn, hãy thu hồi nó rồi quyết định con đường ngươi muốn đi theo"
 restore_celestial_army_objective_decision_confirm: "Trụ Sở Mới?"
 shih_peace_decision: "Hành Động Thận Trọng"
 shih_peace_decision_desc: "[GetTrait('shih').GetName( GetPlayer )] lang thang chỉ hành động khi cần thiết, như giúp đỡ những kẻ chịu ách siêu nhiên. Giết một quái vật chỉ vì trông khác biệt là cách chắc chắn để đánh thức P'o của họ."
 shih_peace_decision_tooltip: "Ngươi sẽ dàn xếp một cuộc đình chiến với các lãnh chúa độc lập láng giềng của mình."
 shih_peace_decision_confirm: "Xoa dịu P'o của ta"
 learning_kaja_decision: "Học Kaja"
 learning_kaja_decision_desc: "Văn tự biểu ý cổ xưa, cực kỳ phức tạp của [Glossary('Wan Xian','game_concept_kuei_jin_desc')]. Học nó sẽ cho ngươi sự thấu hiểu với mọi người sử dụng kaja khác."
 learning_kaja_decision_tooltip: "Ngươi sẽ học Kaja, và nhận được lợi thế từ đó."
 learning_kaja_decision_confirm: "Phức tạp quá!"
 meng_huo_you_supply_decision: "Nguồn Cung Mãnh Hỏa Du"
 meng_huo_you_supply_decision_desc: "Mãnh Hỏa Du, đá sơn dầu, dầu đá hay đơn giản là dầu mỏ, được dùng làm vũ khí gây cháy trong chiến tranh từ thời nhà Hán. Từng là một phần cống phẩm mà một tiểu vương triều phàm nhân ở Việt Nam nộp cho hoàng đế Trung Hoa vào thời điểm này, ngươi có thể chiếm lấy vũ khí này cho riêng mình để trang bị cho các đồng đạo thợ săn."
 meng_huo_you_supply_decision_tooltip: "Ngươi sẽ lấy nguồn cung dầu mỏ từ Chiêm Thành."
 meng_huo_you_supply_decision_confirm: "Đốt lên nào!"
 
 toreador_grandeur_victory_objective_decision: "Uy Thế Chói Lọi"
 toreador_grandeur_victory_objective_decision_tooltip: "Triều đình của ngươi là hình ảnh phản chiếu quyền lực của ngươi, và vì thế, ngươi phải không ngừng nỗ lực để cải thiện nó."
 toreador_grandeur_victory_objective_decision_desc: "Những Toreador vĩ đại nhất là những kẻ dẫn dắt trào lưu, được kính trọng và ngưỡng mộ khắp nơi vì những công trình nghệ thuật và học thuật táo bạo của họ. Ngươi phải phấn đấu để trở thành nhà bảo trợ danh giá nhất của thế giới bất tử."
 toreador_grandeur_victory_objective_decision_effect_tooltip: "Ngươi sẽ được kính trọng trong hàng ngũ Toreador như kẻ dẫn đầu để noi theo, và những bậc trí giả vĩ đại nhất của thời đại này sẽ đổ về vương quốc của ngươi."
 toreador_grandeur_victory_objective_decision_confirm: "Một kiệt tác đang thành hình"
 toreador_grandeur_custom_decision: "Mọi vị trí triều đình [primogen|E] khả dụng của ngươi phải được lấp đầy bởi những kẻ có năng lực ít nhất ở mức Tốt"
 toreador_grandeur_custom_decision2: "Ngươi cần mức Uy thế triều đình đạt đến 10"

 library_victory_objective_decision: "Tri Thức Vĩnh Cửu"
 library_victory_objective_decision_tooltip: "Tri thức là sức mạnh, người ta vẫn thường nói vậy."
 library_victory_objective_decision_desc: "Ngươi thuộc về một thị tộc học thức, thấu hiểu giá trị và sức mạnh ẩn giấu sau con chữ. Ngươi phải đảm bảo sở hữu thư viện vĩ đại nhất thời đại này."
 library_victory_objective_decision_effect_tooltip: "Ngươi sẽ có thể học các lối sống mới nhanh hơn, và những cải cách của nền văn hóa ngươi cũng sẽ được hưởng lợi."
 library_victory_objective_decision_confirm: "Một thư viện sánh ngang Alexandria xưa"
 #library_victory_objective_decision_custom: "You must own the [GetPODArtifact('book_of_nod_link').GetName]"
 library_victory_objective_decision_custom: "Ngươi phải sở hữu [GetPODArtifactName('book_of_nod_link')]"
 library_victory_objective_decision_custom2: "Ngươi phải sở hữu một trong những thư viện vĩ đại của giới bất tử. [GetTitleByKey('c_barcelona').GetNameNoTier], [GetTitleByKey('c_toulouse').GetNameNoTier], [GetTitleByKey('c_malta').GetNameNoTier], [GetTitleByKey('c_vienna').GetNameNoTier] hoặc Erciyes ([GetTitleByKey('c_cappadocia').GetNameNoTier])"

 avenge_arikels_shame_objective_decision: "Báo Thù Cho Nỗi Nhục Của Arikel"
 avenge_arikels_shame_objective_decision_tooltip: "Tổ tiên của ngươi từng chịu nhục từ lâu, và những mối hận thù xưa chẳng bao giờ thực sự tan biến."
 avenge_arikels_shame_objective_decision_desc: "Người sáng lập ra $pod_clan$ Toreador, Arikel, từng cai trị như một Nữ Thần của Sumer. Kình địch cay đắng của bà, Ennoia của Gangrel, đã ép bà rời bỏ, tạo nên mối thù giữa hai bên còn tồn tại đến tận đêm nay."
 avenge_arikels_shame_objective_decision_effect_tooltip: "Danh tiếng của ngươi với tư cách là người bảo vệ hàng đầu của Arikel sẽ được củng cố, và thị tộc Gangrel sẽ phải chịu nhục."
 avenge_arikels_shame_objective_decision_confirm: "Một điều sai được sửa lại cho đúng"
 avenge_arikels_shame_custom_decision_gangrel: "[GetScriptedCharacterByHistoryID('792050').GetFirstName] và [GetScriptedCharacterByHistoryID('792051').GetFirstName], những phó tướng của Ennoia từng giúp bà ở Sumer, phải chết"
 avenge_arikels_shame_custom_decision_malks: "[GetScriptedCharacterByHistoryID('790319').GetFirstName], người bạn của Arikel từng che chở bà sau Sumer, phải ở trong triều đình của ngươi, hoặc ngươi phải có một [malkavian_primogen|E] với mức năng lực xuất sắc"

 toreador_unity_objective_decision: "Một Kỷ Nguyên Mới"
 toreador_unity_objective_decision_tooltip: "Đã đến lúc Toreador rời xa Constantinople."
 toreador_unity_objective_decision_desc: "$pod_clan$ Toreador đã chịu ảnh hưởng sâu đậm từ Michael quyền lực của Constantinople suốt nhiều thế kỷ nay. Với sự ra đi của ông, đã đến lúc cho một khởi đầu mới. Pháp quốc sẽ là quê hương mới của Toreador, nếu nó có thể cuối cùng được thống nhất..."
 toreador_unity_objective_decision_effect_tooltip: "Ngươi sẽ thống nhất Thị tộc Toreador dưới quyền lãnh đạo của mình, giành được [title|E] Thị tộc và phần thưởng liên quan đến các nền văn hóa của vùng đất Pháp."
 toreador_unity_objective_decision_confirm: "Một đất nước hoàn hảo cho một Thị tộc hoàn hảo"
 toreador_unity_objective_decision_alexander: "Người cai trị cũ của Pháp quốc, [GetScriptedCharacterByHistoryID('505082').GetFirstName] của thị tộc Ventrue, phải chết"
 toreador_unity_objective_decision_love: "Ngươi phải kiểm soát [title|E] [GetTitleByKey('e_love').GetNameNoTier], hoặc [title|E] đó không được tồn tại"
 toreador_unity_objective_decision_goldencross: "Ngươi phải kiểm soát [title|E] [GetTitleByKey('k_golden_cross').GetNameNoTier], hoặc [title|E] đó không được tồn tại"

 stealing_wistom_objective_decision: "Đánh Cắp Trí Tuệ"
 stealing_wistom_objective_decision_tooltip: "Ngươi sẽ đánh cắp tri thức của Ngọc Châu Rồng, theo lệnh của tổ tiên ngươi."
 stealing_wistom_objective_decision_desc: "Cái tên Saulot xa lạ với [Glossary('Wan Kuei','game_concept_kuei_jin_desc')], nhưng họ có biết đến Zao-Lat, một môn đồ của [GetScriptedCharacterByHistoryID('791111').GetFirstName], một tên trộm, một kẻ đáng khinh từng hưởng lợi từ lòng trắc ẩn của [GetScriptedCharacterByHistoryID('791111').GetFirstName], học được Ch'iuh Muh, ngồi dưới chân bậc thầy và đánh cắp trí tuệ của người.\nLiệu ngươi có thể làm được điều tương tự?"
#  stealing_wistom_objective_decision_custom: "You have captured #V 3#! [GetTrait('kueijin').GetName( GetPlayer )] [Glossary('Bodhisattva','podgloss.bodhisattva')] ([GetTrait('dharma9').GetName( GetPlayer )]) or who aspire to be one ([GetTrait('dharma8').GetName( GetPlayer )])"
 stealing_wistom_objective_decision_custom: "Ngươi đã bắt giữ #V 3#! [GetTrait('kueijin').GetName( GetPlayer )] [GetTrait('dharma4').GetName( GetPlayer )]+"
 stealing_wistom_objective_decision_confirm: "Phi Vụ Hoàn Hảo"
 saving_white_tiger_objective_decision: "Con Hổ Bị Thương"
 saving_white_tiger_objective_decision_tooltip: "Các người canh giữ núi Meru phải được thống nhất."
 saving_white_tiger_objective_decision_desc: "Triều đình Bạch Hổ đã chia rẽ thành các phe phái tranh giành nhau khi Nữ Hoàng Fan từ bỏ vị trí của mình. Người kế vị của bà, Hoàng Đế Da, thủ lĩnh phe trung thành với bà, Fu Hao, và các tăng lữ của Shigatze là những thế lực còn lại mạnh nhất và có khả năng thống nhất Triều đình cao nhất."
 saving_white_tiger_objective_decision_da: "Hoàng đế hiện tại, [GetScriptedCharacterByHistoryID('795038').GetFirstName], phải là chư hầu của ngươi nếu còn sống."
 saving_white_tiger_objective_decision_fu_hao: "Thủ lĩnh phe trung thành với Fan, [GetScriptedCharacterByHistoryID('793348').GetFirstName], phải là chư hầu của ngươi nếu còn sống."
 saving_white_tiger_objective_decision_tenzing: "Bậc thầy của các tăng lữ Shigatze, [GetScriptedCharacterByHistoryID('793347').GetFirstName], phải là chư hầu của ngươi nếu còn sống."
 #saving_white_tiger_objective_decision_time: "You must do it before the Quincunx' unification. #weak (1320 - 1355)#!"
 saving_white_tiger_objective_decision_confirm: "Con hổ gầm lên!"
 ending_the_empire_objective_decision: "Chấm Dứt Đế Chế"
 ending_the_empire_objective_decision_desc: ""Những kẻ theo Charon" tin rằng Charon, kẻ dẫn dắt Đế Chế Của Người Chết, và ác quỷ Charon, kẻ được cho là đã tạo ra Âm Phủ, thực chất là một. Nếu ngươi có thể chứng minh điều đó bằng sự tồn tại của lưỡi hái Siklos mà cả hai đều tuyên bố sở hữu, và nghiên cứu quỷ học để tìm ra mối liên hệ, ngươi có thể tìm ra sự thật và có lẽ gây nên biến động lớn tại Stygia."
 ending_the_empire_objective_decision_tooltip: "Ngươi sẽ cố gắng tìm ra sự thật."
 ending_the_empire_objective_decision_confirm: "Ta biết điều đó!"

 life_bring_life_objective_decision: "Sự Sống Sinh Ra Sự Sống"
 life_bring_life_objective_decision_desc: "Trong khi các shen giao chiến với nhau vì những món đồ trang sức bằng ngọc bích, các Diêm Ma Vương đầu độc trái tim ở mọi phía, xúi giục cả hai đầu chống lại nhau ở khoảng giữa để chỉ có địa ngục là kẻ chiến thắng.\nKhông chỉ dừng lại ở việc dàn xếp vài cuộc xung đột, các sứ giả của Wu Feng còn chiêu mộ những shen cao quý khác về phe mình, từ những hengeyokai hung tợn $glossary_fera$ cho đến những vị thần ẩn giấu của hsien. Sự sống là quý giá, quá quý giá để bị lãng phí trong những cuộc nội chiến vô nghĩa. Hòa bình mang đến hy vọng, hy vọng mang đến chữa lành, chữa lành mang đến sự sống. Trong tất cả những điều này, địa ngục bị đánh bại."
 life_bring_life_objective_decision_tooltip: "Ngươi sẽ thống nhất càng nhiều Shen càng tốt."
 life_bring_life_objective_decision_confirm: "Cuối cùng cũng đoàn kết"
 life_bring_life_kueijin_modifier_tooltip: "Nhận [GetModifier('life_bring_life_kueijin_modifier').GetNameWithTooltip], nếu ngươi đã đáp ứng yêu cầu về chư hầu [GetTrait('kueijin').GetName( GetPlayer )] hạnh phúc và quyền lực."
 life_bring_life_hengeyokai_modifier_tooltip: "Nhận [GetModifier('life_bring_life_hengeyokai_modifier').GetNameWithTooltip], nếu ngươi đã đáp ứng yêu cầu về chư hầu hengeyokai hạnh phúc và quyền lực"
 life_bring_life_chin_ta_modifier_tooltip: "Nhận [GetModifier('life_bring_life_chin_ta_modifier').GetNameWithTooltip], nếu ngươi đã đáp ứng yêu cầu về chư hầu pháp sư hạnh phúc và quyền lực."
 life_bring_life_jade_wraiths_modifier_tooltip: "Nhận [GetModifier('life_bring_life_jade_wraiths_modifier').GetNameWithTooltip], nếu ngươi đã đáp ứng yêu cầu về chư hầu wraith hạnh phúc và quyền lực."
 life_bring_life_hsien_modifier_tooltip: "Nhận [GetModifier('life_bring_life_hsien_modifier').GetNameWithTooltip], nếu ngươi đã đáp ứng yêu cầu về chư hầu hsien hạnh phúc và quyền lực."
 life_bring_life_shih_modifier_tooltip: "Nhận [GetModifier('life_bring_life_shih_modifier').GetNameWithTooltip], nếu ngươi đã đáp ứng yêu cầu về chư hầu [GetTrait('shih').GetName( GetPlayer )] hạnh phúc và quyền lực."
 life_bring_life_kueijin_modifier: "Thống Nhất Với [GetTrait('kueijin').GetName( GetNullCharacter )]"
 life_bring_life_kueijin_modifier_desc: "Có quyền tiếp cận các công trình chỉ dành riêng cho [GetTrait('kueijin').GetName( GetPlayer )], cho phép biến những kẻ cai trị [GetTrait('kueijin').GetName( GetPlayer )] thành chư hầu với [doctrine|E] [GetFaithDoctrine('under_wufeng_cause_doctrine').GetBaseName]."
 life_bring_life_hengeyokai_modifier: "Thống Nhất Với Hengeyokai"
 life_bring_life_chin_ta_modifier: "Thống Nhất Với Chi'n Ta"
 life_bring_life_jade_wraiths_modifier: "Thống Nhất Với Jade Wraiths"
 life_bring_life_hsien_modifier: "Thống Nhất Với Hsien"
 life_bring_life_shih_modifier: "Thống Nhất Với Shih"
 life_bring_life_shih_modifier_desc: "Có quyền tiếp cận các công trình chỉ dành riêng cho [GetTrait('shih').GetName( GetPlayer )], cho phép biến những kẻ cai trị [GetTrait('shih').GetName( GetPlayer )] thành chư hầu với [doctrine|E] [GetFaithDoctrine('under_wufeng_cause_doctrine').GetBaseName]."

 purifying_black_tortoise_objective_decision: "Thanh Tẩy Huyền Vũ"
 purifying_black_tortoise_objective_decision_tooltip: "Ngươi sẽ thống nhất Triều đình Huyền Vũ."
 purifying_black_tortoise_objective_decision_desc: "Triều đình Huyền Vũ đã bị [Glossary('Yama Kings','podgloss.yamaking')] làm cho sa đọa, các [akuma|E] đã giành lấy quyền lực và theo chân [Glossary('Anda','podgloss.anda')] trong cuộc xâm lược của chúng. Chúng phải bị ngăn chặn."
 purifying_black_tortoise_objective_decision_time: "Ngươi phải làm điều đó trước khi [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] chưa sa đọa cuối cùng còn sót lại từ bỏ. #weak (1372)#!"
 purifying_black_tortoise_objective_decision_custom: "Tước hiệu [GetTitleByKey('e_anda').GetNameNoTier] phải bị hủy diệt"
 purifying_black_tortoise_objective_decision_confirm: "Huyền Vũ đã trường tồn"

 true_brujah_victory_objective_decision: "Sự Thật Về Brujah"
 true_brujah_victory_objective_decision_tooltip: "Những kẻ tự xưng là "Brujah" chỉ là những đứa trẻ lầm lạc được tạo ra bởi Troile dối trá. Sự thật phải được đưa ra ánh sáng."
 true_brujah_victory_objective_decision_desc: "Để chứng minh sự thật về thị tộc Brujah, ngươi cần buộc con cái của Carthage ủng hộ tuyên bố của ngươi... hoặc không còn ở vị thế nào để chống lại ngươi nữa."
 true_brujah_victory_objective_decision_confirm: "Hãy để chúng nghe sự thật!"
 trujah_victory_objective_decision_effect_tooltip: "Ngươi sẽ có một lựa chọn trong cách xử lý với False Brujah. Hoặc thể hiện sự khoan dung, hoặc kêu gọi hủy diệt chúng hoàn toàn."
 trujah_objective_tt: "Con cái của Troile phải được đưa về phe ngươi, bằng thuyết phục hoặc vũ lực."
 trujah_victory_objective_decision_custom: "[GetScriptedCharacterByHistoryID('790303').GetFirstName] phải là [friend|E], thành viên [coterie|E], hoặc [soulmate|E] của ngươi. Hoặc phải chết"
