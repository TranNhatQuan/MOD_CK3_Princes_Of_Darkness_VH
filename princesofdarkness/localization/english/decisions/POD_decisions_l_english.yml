 test_of_faith_decision: "Thử Thách Đức Tin"
 test_of_faith_decision_tooltip: "Ngươi sẽ cố gắng thay đổi lối sống tội lỗi của mình."
 test_of_faith_decision_desc: "Là một tôi tớ của Chúa nghĩa là phải tận tụy với Người. Trên thực tế, ngươi chưa đủ tận tụy. Lối sống tội lỗi của ngươi có thể trở thành rào cản không cho phép ngươi hoàn thành chính nghĩa của mình. Một Thử Thách Đức Tin có thể giúp ngươi rũ bỏ tội lỗi của mình."
 test_of_faith_decision_confirm: "Đã đến lúc thay đổi"
 test_of_faith_custom_decision: "Nhân vật của ngươi có ít nhất một trong bảy tội lỗi Cơ Đốc thời trung cổ (háu ăn, đố kỵ/thù hận, kiêu ngạo, dục vọng, thịnh nộ, tham lam, lười biếng)"
 test_of_faith_decision_effect_tooltip: "Ngươi sẽ cố gắng rũ bỏ một trong các tội lỗi của mình và thay bằng một đức hạnh"
 helena_decision: "Troy Chống Lại Sparta"
 helena_decision_tooltip: "Menele phải chết!"
 helena_decision_desc: "Nếu ngươi muốn, cuối cùng, tự do di chuyển trở lại trong thế giới của $pod_cainites$, trước tiên ngươi phải xử lý kẻ đã săn đuổi ngươi bấy lâu nay."
 helena_decision_effect_tooltip: "Ngươi sẽ có được một [character_interaction|E] đặc biệt mới"
 helena_decision_confirm: "Cuối cùng..."
 helena_custom_decision: "[GetScriptedCharacterByHistoryID('790309').GetFirstName] phải chết"
 absalon_decision: "Nghi Lễ Svantevit"
 absalon_decision_tooltip: "Con đường đến thần tính?"
 absalon_decision_desc: "Mỗi bước đi là một thử thách hướng đến chiến thắng tối thượng của ngươi, một điều mà ngươi sẽ vui lòng đảm nhận.\nNghi lễ hoàn thành có lẽ sẽ mang lại cho ngươi sức mạnh to lớn nhưng cái giá phải trả có thể còn lớn hơn."
 absalon_decision_effect_tooltip: "Nghi lễ đã hoàn thành!"
 absalon_decision_confirm: "Hãy bắt tay vào việc"
 mithras_decision: "Giành Lại Quyền Kiểm Soát"
 mithras_decision_tooltip: "Đã đến lúc chứng minh cho đám chư hầu ngu ngốc đó thấy ngươi nghiêm túc"
 mithras_decision_desc: "Các chư hầu của ngươi nghĩ ngươi yếu đuối và mê muội vì tình. Hãy chứng minh cho họ thấy điều ngược lại trước khi tiếng đồn lan rộng."
 mithras_decision_effect_tooltip: "Ngươi sẽ dập tắt những tin đồn xấu xa nhắm vào ngươi."
 mithras_decision_confirm: "Hài lòng chưa?"
 mithras_custom_decision: "Quyết định này chỉ khả dụng trước năm 1300"
 greek_fire_objective_decision: "Thu Hồi Lửa Hy Lạp"
 greek_fire_objective_decision_desc: "Trong nhiều lần chạm trán với những kẻ hầu cận của Satan thuộc loại hút máu, lửa đã chứng tỏ là điểm yếu lớn nhất của chúng. Chưa lâu trước đây người La Mã từng thống trị các vùng biển bằng thứ vũ khí lửa đáng sợ của họ, nhưng bí mật của nó đã bị thất truyền. Đã đến lúc thu hồi lại nó và cải tiến nó cho mục đích của chúng ta."
 greek_fire_objective_decision_tooltip: "Sử dụng Lửa Hy Lạp chống lại kẻ thù của ngươi."
 greek_fire_objective_decision_effect_tooltip: "Ngươi sẽ có được khả năng trang bị cho các đồng đạo thợ săn vũ khí dùng lửa."
 greek_fire_objective_decision_custom1: "Việc lục soát thành phố để tìm công thức đòi hỏi #V 12#! [intrigue|E] và kiểm soát [GetTitleByKey('c_byzantion').GetNameNoTier]"
 greek_fire_objective_decision_custom2: "Việc lấy được bí mật từ một "người" đòi hỏi ngươi hoặc cận thần của ngươi có [trait|E] [GetTrait('torturer').GetName( GetPlayer )] và bắt được một trong những kẻ ác được đồn là biết công thức đó: [GetScriptedCharacterByHistoryID('790015').GetFirstName], [GetScriptedCharacterByHistoryID('790115').GetFirstName], [GetScriptedCharacterByHistoryID('790767').GetFirstName], [GetScriptedCharacterByHistoryID('790341').GetFirstName], [GetScriptedCharacterByHistoryID('790939').GetFirstName]"
 greek_fire_objective_decision_custom3: "Việc tự khám phá ra công thức đòi hỏi [learning|E] #V 20#! và văn hóa của ngươi khám phá ra [innovation|E] $innovation_development_04$"
 greek_fire_objective_decision_confirm: "Hãy để có ánh sáng!"
 ghoulbro_objective_decision: "Tiến Về Thành Phố"
 ghoulbro_objective_decision_desc: "Constantinople là nơi Basil và Bayezid bắt đầu rao giảng lần đầu tiên. Khi đó họ đang rao giảng những lời dối trá của chủ nhân mình, nhưng cùng với sự sụp đổ của họ và của Thành Phố, hai anh em đã mở mắt trước một chân lý mới. Chân lý cần được uốn nắn thành thứ phúc âm độc hại nhất và được các nhà truyền giáo trung thành mang đến càng nhiều linh hồn càng tốt. Và không nơi nào có nhiều linh hồn hơn nơi mọi thứ bắt đầu, Thành Phố Vĩ Đại Constantinople."
 ghoulbro_objective_decision_tooltip: "Trở về từ cuộc lưu đày và tập hợp đàn chiên."
 ghoulbro_objective_decision_effect_tooltip: "Ngươi sẽ đánh thức đám đông khốn khổ để đi theo chính nghĩa của ngươi."
 ghoulbro_custom_decision: "Ngươi có #V 20#! [knights|E] vừa là $POD_splat_ghoul_plural$ vừa là [GetFaithByKey('calomenasforsaken').GetName]"
 ghoulbro_custom_decision1: "Kẻ lừa dối, bá tước [GetScriptedCharacterByHistoryID('791424').GetFirstName] của Ohrid đã chết, mất đất hoặc đang trong $pod_torpor$"
 ghoulbro_custom_decision2: "Kẻ lừa dối, bá tước [GetScriptedCharacterByHistoryID('791418').GetFirstName] của Thyatria đã chết, mất đất hoặc đang trong $pod_torpor$"
 ghoulbro_custom_decision3: "Kẻ lừa dối, bá tước [GetScriptedCharacterByHistoryID('791419').GetFirstName] của Hadrianeia đã chết, mất đất hoặc đang trong $pod_torpor$"
 ghoulbro_objective_decision_confirm: "Hãy để chúng ta rao giảng!"
 tabitha_decision: "Lá Chắn của Andalusia"
 tabitha_decision_tooltip: "Màn trình diễn của ngươi đang được theo dõi"
 tabitha_decision_desc: "Trưởng Lão đã giao cho ngươi nhiệm vụ đảm bảo đánh bại nhanh chóng các $pod_cainites$ Cơ Đốc giáo. Kết quả được kỳ vọng sẽ đến nhanh chóng."
 tabitha_decision_effect_tooltip: "Alamut sẽ hài lòng và gửi phần thưởng"
