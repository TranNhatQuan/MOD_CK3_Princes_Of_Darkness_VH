 judges_landless_tt: "[GetTitleByKey('c_jerusalem').GetNameNoTier] phải do người cùng tín ngưỡng với ngươi nắm giữ"
 judges_landless_special_tt: "Ngươi phải nắm giữ một trong các trung tâm hoạt động của Quan Xét: [GetTitleByKey('c_jerusalem').GetNameNoTier], [GetTitleByKey('c_cordoba').GetNameNoTier], [GetTitleByKey('c_praha').GetNameNoTier], [GetTitleByKey('c_kufa').GetNameNoTier], [GetTitleByKey('c_tigre').GetNameNoTier], hoặc [GetTitleByKey('c_kerala').GetNameNoTier]"
