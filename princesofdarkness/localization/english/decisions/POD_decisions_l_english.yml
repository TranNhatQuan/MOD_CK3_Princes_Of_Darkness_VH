 new_yama_king_objective_decision: "Sự Ra Đời của Một [Glossary('Yama King','podgloss.yamaking')] Mới"
 new_yama_king_objective_decision_desc: "[Glossary('Yama Kings','podgloss.yamaking')] là những cai ngục tối cao của Yomi Wan, phần lớn là những kẻ hầu cận sa ngã của [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')], những kẻ khi khám phá ra rằng chi có thể được chiết xuất từ linh hồn con người qua tra tấn, đã áp dụng những kỹ thuật ấy để chiết xuất nguồn năng lượng đó. Ở phương Tây chúng được gọi là banes, còn những kẻ thuộc Yin thì được các hồn ma phương Tây gọi là Malfeans.\nThứ bậc của những sinh vật này thay đổi theo thời gian, khi những kẻ cũ bị đánh bại bởi những kẻ mới hơn, mà sự trỗi dậy của chúng thường gắn liền với một biến động lớn nào đó trong thế giới phàm trần."
 new_yama_king_objective_decision_tooltip: "Sao phải phục tùng khi ngươi có thể thống trị?"
 new_yama_king_objective_decision_confirm: "Thật tốt khi được làm (Yama) Vương."
 new_yama_king_objective_decision_custom1: "Tổng các kỹ năng của những $POD_splat_wraith$ mà ngươi ràng buộc phải vượt quá #V 200#!"
 new_yama_king_objective_decision_custom2: "[umbra_aptitude|E] của ngươi phải vượt quá [grace_i]#V 75#!"
 new_yama_king_objective_decision_effect: "Ngươi sẽ khởi động một trận đại chiến chống lại một [Glossary('Yama King','podgloss.yamaking')] hiện hữu để giành lấy lãnh địa của chúng. Hãy cẩn thận, chúng sẽ không chịu khuất phục mà không chiến đấu đến cùng."

 rediscover_kung_yis_training_style_objective_decision: "Tái Khám Phá Phong Cách Huấn Luyện của Wan Kung Yi"
 rediscover_kung_yis_training_style_objective_decision_desc: "Sư Phụ Yi là người ủng hộ việc huấn luyện tận tâm một-kèm-một. Phong cách của ông đã thất truyền trong thời kỳ trỗi dậy của Thiên Quân, nhưng vẫn còn vài manh mối có thể dẫn đến việc tái khám phá nó."
 rediscover_kung_yis_training_style_objective_decision_tooltip: "Trở về căn bản"
 rediscover_kung_yis_training_style_objective_decision_confirm: "Theo dấu chân của sư phụ"
 rediscover_kung_yis_training_style_objective_decision_custom1: "Tổng [skills|E] của ngươi bao gồm cả [prowess|E] phải vượt quá #V 95#!"
 rediscover_kung_yis_training_style_objective_decision_effect1: "Giới hạn [skill|E] khi huấn luyện tăng từ 15 lên 20 (25 lên 30 trong trường hợp [prowess|E])."
 rediscover_kung_yis_training_style_objective_decision_effect2: "Mở khóa mục tiêu 'Tiếp Nối Di Sản Wan Kung Yi'"

 continuing_kung_yi_legacy_objective_decision: "Tiếp Nối Di Sản Wan Kung Yi"
 continuing_kung_yi_legacy_objective_decision_desc: "Sư Phụ Yi có vài giáo huấn bí truyền nay đã thất lạc theo thời gian. Dù vậy, ngươi vẫn có thể cố gắng noi theo chút ít điều còn được biết đến để cải thiện phong cách huấn luyện của mình."
 continuing_kung_yi_legacy_objective_decision_tooltip: "Những giáo huấn bí truyền"
 continuing_kung_yi_legacy_objective_decision_confirm: "Theo dấu chân của sư phụ"
 continuing_kung_yi_legacy_objective_decision_custom1: "Tổng [skills|E] bao gồm cả [prowess|E] của ít nhất 3 người con (học trò) của ngươi phải vượt quá #V 60#!"
 continuing_kung_yi_legacy_objective_decision_effect1: "Shih giờ đây có thể huấn luyện bất kỳ shih nào khác, không còn giới hạn chỉ với con cái của mình"
 continuing_kung_yi_legacy_objective_decision_effect2: "Mở khóa mục tiêu 'Chính Nghĩa Công Minh'"

 restoring_shih_legacy_objective_decision: "Chính Nghĩa Công Minh"
 restoring_shih_legacy_objective_decision_desc: "Shih thời xưa đã lạc lối khi họ lập nên Thiên Quân dẫn đến sự diệt vong của chính mình. Nhưng liệu bản thân ý tưởng đó có phải là sai lầm, hay chỉ đơn giản là cách họ đã thực hiện nó?"
 restoring_shih_legacy_objective_decision_tooltip: "Lựa chọn của Thiên Quân"
 restoring_shih_legacy_objective_decision_confirm: "Lựa chọn của Thiên Quân"
 restoring_shih_legacy_objective_decision_effect1: "Shih sẽ đi theo con đường nguyên bản của Wan Kung Yi."
 restoring_shih_legacy_objective_decision_effect2: "Shih sẽ đi theo con đường Thiên Quân để tiêu diệt mọi shen (sinh vật siêu nhiên) thay vào đó."
 restoring_shih_legacy_objective_decision_effect3: "Ngươi sẽ 'phản bội' các Shih khác và chỉ tìm kiếm quyền lực cho riêng mình."

 keeping_the_roots_safe_objective_decision: "Giữ Gìn Cội Rễ An Toàn"
 keeping_the_roots_safe_objective_decision_desc: "Chúng ta khởi nguồn từ #ONCLICK:CULTURE,[GetCultureByKey('ancient_egyptian').GetID] #TOOLTIP:CULTURE,[GetCultureByKey('ancient_egyptian').GetID] #L Ai Cập Cổ Đại#!#!#!, và chúng ta không được quên cội rễ của mình. Nhưng qua từng năm tháng trôi qua, những gì từng là nền văn minh vĩ đại nhất đang dần bị cát bụi thời gian chôn vùi. Chúng ta không thể để điều đó xảy ra, vì ký ức chính là thứ khiến chúng ta là con người."
 keeping_the_roots_safe_objective_decision_tooltip: "Giữ trái tim ta sống mãi"
 keeping_the_roots_safe_objective_decision_confirm: "Cứu Lấy Cội Rễ"
 keeping_the_roots_safe_objective_decision_custom1: "Phải có ít nhất #V 10#! quận với [culture|E] [GetCultureByKey('ancient_egyptian').GetName]"
 keeping_the_roots_safe_objective_decision_effect1: "$POD_splat_mummy_plural$ [GetFaithByKey('ishmaelite').GetName] sẽ hồi sinh nhanh gấp đôi #weak (5 năm thay vì 10)#!"
 keeping_the_roots_safe_objective_decision_effect2: "Yêu cầu cho mọi mục tiêu $POD_splat_mummy$ khác sẽ được hạ thấp"

 ending_the_snake_objective_decision: "Chấm Dứt Con Rắn"
 ending_the_snake_objective_decision_desc: "Kể từ cuộc đụng độ đầu tiên giữa [GetScriptedCharacterByHistoryID('792593').GetFirstName] và [GetScriptedCharacterByHistoryID('505012').GetFirstName], phái Setite đã là kẻ thù của chúng ta. Chúng liên minh với $glossary_wyrm_apophis$ và làm băng hoại những gì từng vĩ đại. Chúng ta phải tiêu diệt chúng và cuối cùng khép lại cuộc chiến này."
 ending_the_snake_objective_decision_tooltip: "Thất bại tối hậu của những con rắn"
 ending_the_snake_objective_decision_confirm: "Cuộc chiến trường kỳ, cuối cùng cũng kết thúc"
 ending_the_snake_objective_decision_custom1: "Chủ nhân của [GetTitleByKey('c_cairo').GetBaseName] #weak ([GetTitleByKey('c_cairo').GetHolder.GetFirstName])#! phải là [GetTrait('shemsuheru').GetName(GetNullCharacter)] hoặc [GetFaithDoctrine('special_doctrine_osirian_league').GetBaseName]"
 ending_the_snake_objective_decision_custom2: "Không được có bất kỳ [landed|E] [GetReligionByKey('roadofset_religion').GetName] [GetTrait('vampgeneration5').GetName(GetPlayer)] [GetTrait('setite').GetName(GetPlayer)] độc lập nào"
 ending_the_snake_objective_decision_custom2_ex: "$ending_the_snake_objective_decision_custom2$ #weak ([example.GetFirstName])#!"
 ending_the_snake_objective_decision_effect1: "#TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L Setite#!#! sẽ không còn có thể $pod_Embrace$"
 ending_the_snake_objective_decision_effect2: "Mọi Setite còn lại sẽ bị phá vỡ quyền uy."

 land_of_faith_objective_decision: "Vùng Đất Đức Tin"
 land_of_faith_objective_decision_desc: "Vùng Đất Đức Tin theo truyền thống là chỉ những mạch quyền năng của Ai Cập Cổ Đại lan tỏa ra khắp các thời đại. Đây là nơi Sekhem dễ sử dụng và thu thập hơn. Nếu chúng ta kiểm soát được dòng năng lượng thuần khiết này, ta có thể đạt được điều bất khả."
 land_of_faith_objective_decision_tooltip: "Mạng Lưới Sự Sống"
 land_of_faith_objective_decision_confirm: "Từ Ai Cập và xa hơn nữa"
 land_of_faith_objective_decision_custom1: "Không được có bất kỳ nhân vật [landed|E] 'tà ác' độc lập nào, tức $POD_splat_vampire_plural$, $POD_splat_demon_plural$ v.v. trong [region|E] [GetGeographicalRegion('pod_lands_of_faith').GetName] #weak (trừ khi đức tin của họ là [GetFaithDoctrine('special_doctrine_against_to_apophis_hostility').GetBaseName])#!"
 land_of_faith_objective_decision_custom1_ex: "$land_of_faith_objective_decision_custom1$ #weak ([example.GetFirstName])#!"
 land_of_faith_objective_decision_custom2: "Không được có bất kỳ nhân vật [landed|E] nào, tức $POD_splat_vampire_plural$, $POD_splat_demon_plural$, $POD_splat_hunter_plural$ v.v. trong [region|E] [GetGeographicalRegion('pod_lands_of_faith').GetName] #weak (trừ khi đức tin của họ là [GetFaithDoctrine('special_doctrine_against_to_apophis_hostility').GetBaseName])#!"
 land_of_faith_objective_decision_custom2_ex: "$land_of_faith_objective_decision_custom2$ #weak ([example.GetFirstName])#!"

 ending_the_serpent_objective_decision: "Kẻ Phản Diện Chính: $glossary_wyrm_apophis$"
 ending_the_serpent_objective_decision_desc: "Mục tiêu căn bản nhất của chúng ta, khôi phục Ma'at (khái niệm Ai Cập Cổ Đại về sự cân bằng chính đáng), từng bị coi là bất khả thi do sự tồn tại của [UmbraGlossary('oblivion')] không ngừng làm băng hoại và nhiễu loạn vũ trụ. Với sinh lực gần như vô hạn từ Vùng Đất Đức Tin, chúng ta có thể cố gắng cuối cùng hủy diệt chính khái niệm [UmbraGlossary('oblivion')]."
 ending_the_serpent_objective_decision_tooltip: "Trận chiến cuối cùng của $glossary_wyrm_apophis$"
 ending_the_serpent_objective_decision_confirm: "Chiến thắng của Ma'at"
 ending_the_serpent_objective_decision_custom1: "Mọi #TOOLTIP:GAME_TRAIT,banemummy,[GetNullCharacter] #L Xác Ướp Tà Linh#!#! phải chết"
 ending_the_serpent_objective_decision_custom1_ex: "$ending_the_serpent_objective_decision_custom1$ #weak ([example.GetFirstName])#!"
 ending_the_serpent_objective_decision_effect1: "[UmbraGlossary('oblivion')] đã chết, và ngươi đã giết nó. Sự cân bằng được khôi phục và thế giới sẽ từ từ trôi về hướng chính đạo như lẽ ra phải vậy. #X Trò chơi kết thúc, khi thế giới ngươi từng biết đã thay đổi theo những cách không thể tái hiện trong Crusader Kings 3#!"


 serving_eagles_head_objective_decision: "Chặt Đầu Đại Bàng"
 serving_eagles_head_objective_decision_desc: "Thế giới đã bị định đoạt diệt vong, nhưng vẫn có kẻ cố cứu con thuyền đang chìm này. Điều đó thật vô ích, và chỉ kéo dài thêm sự tồn tại thảm hại của chúng. Đã đến lúc $glossary_wyrm_apophis$ được thỏa sức yến tiệc."
 serving_eagles_head_objective_decision_tooltip: "Yến tiệc của $glossary_wyrm_apophis$"
 serving_eagles_head_objective_decision_confirm: "Những kẻ bảo vệ cuối cùng của thế giới này sụp đổ."
 serving_eagles_head_objective_decision_custom1: "Không được có bất kỳ $POD_splat_mummy_plural$ [GetTrait('shemsuheru').GetName(GetNullCharacter)] [landed|E] nào"
 serving_eagles_head_objective_decision_custom1_ex: "$serving_eagles_head_objective_decision_custom1$ #weak ([example.GetFirstName])#!"

 last_meal_before_midnight_objective_decision: "Bữa Ăn Cuối Trước Nửa Đêm"
 last_meal_before_midnight_objective_decision_desc: "Sau khi loại bỏ những Xác Ướp lầm lạc ra khỏi phương trình, [UmbraGlossary('oblivion')] gần như đã sẵn sàng cho bữa ăn cuối cùng của nó. Nhưng như thế vẫn chưa đủ, những gì còn sót lại của lực lượng Horus khiến nhiệm vụ của chúng ta khó khăn. Giải pháp rất đơn giản, chúng ta chỉ cần giết hết chúng."
