 become_changeling_decision_desc: "Có lẽ đã đến lúc ghé thăm một người bạn ngươi quen biết và cầu xin được mê hoặc vĩnh viễn?"
 become_changeling_decision_tooltip: "Bằng cách sử dụng một [character_interaction|E] lên bất kỳ tiên tộc còn sống nào khác là bạn của ngươi, ngươi sẽ tự tách mình khỏi nhân tính và cuối cùng trở thành một Đứa Trẻ Bị Tráo."
 become_changeling_decision_confirm: "Hãy làm điều đó"
