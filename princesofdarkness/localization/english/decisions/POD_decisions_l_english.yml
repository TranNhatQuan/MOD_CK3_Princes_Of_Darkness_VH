 wealth_and_influence_multiple_points_tooltip: "Tiêu hết các điểm kỹ năng đang sở hữu."
 wealth_and_influence_single_point_name: "Nhận Một Ân Huệ"
 wealth_and_influence_single_point_tooltip: "Tiêu một điểm kỹ năng đang sở hữu."

 ravnos_jati_decision: "Jati Của Dòng Ravnos"
 ravnos_jati_decision_tooltip: "Một gia tộc chia rẽ, mỗi phe theo đuổi mục tiêu riêng."
 ravnos_jati_decision_desc: "Dòng máu Ravnos bị chia rẽ thành nhiều Jati (đẳng cấp), mỗi Jati theo đuổi mục tiêu riêng của mình. Nếu ngươi đạt được những mục tiêu đó, tinh thần của cả Jati ngươi sẽ được cải thiện."
 ravnos_jati_decision_confirm: "Đẳng cấp của chúng ta đã chiến thắng vẻ vang!"

 awake_hun_and_po_objective_decision: "Đánh Thức Hun và P'o của Ngươi"
 awake_hun_and_po_objective_decision_tooltip: "Ngươi sẽ đánh thức Hun và P'o của mình để trở thành một [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] trọn vẹn"
 awake_hun_and_po_objective_decision_desc: "Salubri nhận được sự chào đón lạnh nhạt nhưng về cơ bản là lịch sự từ [Glossary('Wan Kuei','game_concept_kuei_jin_desc')], những kẻ quan tâm đến việc nghiên cứu sự lan truyền tri thức của họ. Các Kỷ Luật của Salubri là những biến dạng (hay biến đổi) hấp dẫn từ di sản của [Glossary('Wan Kuei','game_concept_kuei_jin_desc')], nên những [Glossary('Hungry Dead','game_concept_kuei_jin_desc')] có thiên hướng học thuật thấy nhiều điều thú vị nơi đó. Có tin đồn rằng một hoặc nhiều Salubri thực sự đã đánh thức được Hun và P'o của mình, nhưng bản thân quá trình đó ít nhất cũng là điều bí ẩn."
 awake_hun_and_po_objective_decision_confirm: "Tin đồn đó là sự thật"
