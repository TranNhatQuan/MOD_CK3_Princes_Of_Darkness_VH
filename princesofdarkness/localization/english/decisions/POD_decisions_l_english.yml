 POD_demon_wealth_and_influence_decision: "Xoay Chuyển Vận Mệnh"
 POD_demon_wealth_and_influence_decision_tooltip: "Dùng năng lực huyền thuật để đạt được những ân huệ phàm trần khác thường."
 POD_demon_wealth_and_influence_decision_desc: "Vận mệnh dường như đang mỉm cười với ngươi, khi ngươi nhận được những ân huệ phàm trần khác thường, tưởng chừng ngẫu nhiên. Có phải Nữ Thần May Mắn đang mỉm cười, hay đó là điều gì khác?"
 POD_demon_wealth_and_influence_decision_confirm: "Ta thật may mắn!"
 POD_infernalist_wealth_and_influence_decision: "Cầu Xin Của Cải và Thế Lực"
 POD_infernalist_wealth_and_influence_decision_tooltip: "Dùng một khoản đầu tư quỷ dữ để đạt được của cải và thế lực."
 POD_infernalist_wealth_and_influence_decision_desc: "Của cải lớn, thế lực, hay bạn đồng hành. Gần như mọi thứ đều có thể đạt được hay gia tăng nhờ một khế ước với "người" phù hợp..."
 POD_infernalist_wealth_and_influence_decision_confirm: "Một cái giá xứng đáng"
 POD_fae_wealth_and_influence_decision: "Xấu Xa Chính Là Công Bằng"
 POD_fae_wealth_and_influence_decision_tooltip: "Dùng thuật bói toán để đạt được của cải và thế lực."
 POD_fae_wealth_and_influence_decision_desc: "Can thiệp đôi chút vào chuyện của vận mệnh, ban cho bản thân ngươi chút may mắn nho nhỏ."
 POD_fae_wealth_and_influence_decision_confirm: "Ta thật may mắn!"
 POD_yama_wealth_and_influence_decision: "Ân Sủng của [Glossary('Yama Kings','podgloss.yamaking')]"
 POD_yama_wealth_and_influence_decision_tooltip: "Dùng năng lực quỷ thuật để đạt được những ân huệ phàm trần khác thường."
 POD_yama_wealth_and_influence_decision_desc: "Một sự bẻ cong vận khí (joss) để đem lại vận may cho những kẻ thực thi ý chí tà ác của các vị Vua."
 POD_yama_wealth_and_influence_decision_confirm: "Một cái giá xứng đáng"
 POD_demon_longevity_decision: "Bất Tử Chăng?"
 POD_demon_longevity_decision_tooltip: "Dùng năng lực huyền thuật của ngươi để kéo dài tuổi thọ."
 POD_demon_longevity_decision_desc: "Với mỗi lần đầu tư vào Huyền Thuật này, kẻ nô lệ sẽ ngừng già đi trong vòng năm năm. Một bước nhỏ tiến tới phần thưởng vĩ đại nhất."
 POD_demon_longevity_decision_confirm: "Trẻ Lại Rồi!"
 POD_infernalist_longevity_decision: "Bất Tử Chăng?"
 POD_infernalist_longevity_decision_tooltip: "Dùng một khoản đầu tư quỷ dữ để kéo dài tuổi thọ."
 POD_infernalist_longevity_decision_desc: "Với khế ước này, kẻ cầu xin có thể thêm 5 năm nữa vào cuộc đời mình. Nhiều Tín Đồ Địa Ngục cứ mỗi 5 năm lại tiến hành nghi lễ, hiến tế hàng chục kẻ vô tội để mua thêm vài năm sống."
 POD_infernalist_longevity_decision_confirm: "Trẻ Lại Rồi!"
