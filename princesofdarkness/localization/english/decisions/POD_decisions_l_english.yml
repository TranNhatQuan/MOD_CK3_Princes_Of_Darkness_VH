 restore_oculi_dei_tooltip: "Chúng ta là Con Mắt của Chúa. Chúng ta đã thấy sự trở lại của mình với quê nhà"
 restore_oculi_dei_desc: "Để tập trung hóa mạng lưới của chúng ta, ngươi cần chiếm lại Flanders."
