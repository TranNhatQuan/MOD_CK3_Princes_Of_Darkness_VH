 POD_sabbat_regent_decision: "Một Nhiếp Chính Sabbat Mới"
 POD_sabbat_regent_decision_tooltip: "Sabbat sẽ bắt đầu cuộc bỏ phiếu cho ngôi vị Nhiếp Chính."
 POD_sabbat_regent_decision_desc: "Ngôi vị Nhiếp Chính Sabbat đang bỏ trống, và các Hồng Y có thể bắt đầu bỏ phiếu để tìm ra ai trong số họ sẽ là người kế tiếp."
 POD_sabbat_regent_decision_effect_tooltip: "Cuộc bỏ phiếu sẽ bắt đầu ngay lập tức."
 POD_sabbat_regent_decision_confirm: "Hãy để ta nghe các ứng viên"

 POD_sabbat_join_black_hand_decision: "Gia Nhập Bàn Tay Đen"
 POD_sabbat_join_black_hand_decision_tooltip: "Gia nhập Bàn Tay Đen để ngươi có thể săn lùng những kẻ tội phạm đe dọa Sabbat."
 POD_sabbat_join_black_hand_decision_confirm: "Một thế giới bị vấy đen"
 POD_sabbat_join_black_hand_decision_desc: "Bàn Tay Đen, hay đơn giản là Bàn Tay, là một phân bộ đặc biệt của Sabbat, một giáo phái trong lòng giáo phái. Họ là nhóm ma cà rồng tinh nhuệ được công nhận tách biệt khỏi mọi thành viên khác của giáo phái. Về bản chất, họ chính là quân đội của Sabbat."

 POD_sabbat_leave_black_hand_decision: "Rời Bàn Tay Đen"
 POD_sabbat_leave_black_hand_decision_tooltip: "Ta đã hoàn thành phần việc của mình cho Sabbat."
 POD_sabbat_leave_black_hand_decision_confirm: "Đời quân ngũ của ta đã kết thúc"
 POD_sabbat_leave_black_hand_decision_desc: "Rời khỏi Bàn Tay Đen, từ bỏ mọi đặc quyền và nghĩa vụ đi kèm."

 suicide_by_diablerie_decision: "Nghi Lễ Cuồng Ẩm"
 suicide_by_diablerie_decision_tooltip: "Đã đến lúc trao ngọn đuốc cho thế hệ kế tiếp chăng?"
 suicide_by_diablerie_decision_confirm: "Bằng cái chết, ta trở nên thực sự bất tử"
 suicide_by_diablerie_decision_desc: "Những tín đồ Jocasta có một tập tục, theo đó một bậc thầy có thể để bản thân bị một môn đồ Cuồng Ẩm nhằm gìn giữ tri thức mà y đã tích lũy. Có lẽ thời khắc của ngươi đã đến?"

 qorjin_victory_objective_decision: "Bí Sử Của Người Mông Cổ"
 qorjin_victory_objective_decision_tooltip: "Nhiều mối đe dọa vây quanh dân tộc Mông Cổ. Đại Hãn sẽ lo liệu chuyện phàm trần, còn ngươi sẽ lo liệu chuyện siêu nhiên."
 qorjin_victory_objective_decision_desc: "Thảo nguyên đầy rẫy những sinh vật siêu nhiên săn đuổi dân tộc Mông Cổ. Ngươi phải củng cố vị thế của mình trước khi tin đồn về một cuộc xâm lăng còn đáng sợ hơn đến từ phương Đông trở thành sự thật."
 qorjin_victory_objective_decision_confirm: "Chúng sẽ không dám đến nữa"
 qorjin_victory_objective_decision_effect_tooltip: "Ngươi sẽ loại bỏ mối đe dọa xâm lăng của [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] mà nếu không sẽ xảy ra vào năm 1360.\nNgươi sẽ chọn giữa việc chấp nhận vai trò người bảo hộ dân Mông Cổ để nhận được quân sự kiện Mông Cổ, hoặc nghiêng về tình bạn với người sói để có được Binh Đoàn của họ."

 dazbog_victory_objective_decision: "Di Sản Của Dazbog"
 dazbog_victory_objective_decision_tooltip: "Dazbog đang dõi theo những kẻ kế thừa mình bằng ánh mắt sắc bén. Liệu ngươi có xứng đáng?"
 dazbog_victory_objective_decision_desc: "Dazbog có lẽ là chiến binh vĩ đại nhất của vùng đất này. Còn cách nào tôn vinh di sản ấy tốt hơn là tiêu diệt kẻ thù truyền kiếp của tổ tiên ngươi, lũ Tzimisce đáng ghét?"
 dazbog_victory_objective_decision_confirm: "Lũ quái vật đã khiếp sợ!"
 dazbog_victory_objective_decision_effect_tooltip: "Ngươi sẽ giành được thanh gươm lừng danh Szczerbiec và [GetMaA('dazbog_hunters').GetName] như một phần thưởng."

 indep_victory_objective_decision: "Xây Dựng Một Di Sản"
 indep_victory_objective_decision_tooltip: "Ngươi sẽ không ở đây mãi mãi, nhưng đáng buồn thay kẻ thù có thể vẫn còn."
 indep_victory_objective_decision_desc: "Ngươi chỉ là một cá nhân đơn độc chống lại bóng tối. Nếu muốn tạo ra một ảnh hưởng lâu dài, ngươi phải chuẩn bị cho tương lai và những kẻ kế thừa mình."
 indep_victory_objective_decision_confirm: "Một di sản của những kẻ săn lùng"
 indep_victory_objective_decision_effect_tooltip: "Ngươi sẽ chọn giữa nhiều hiệu ứng gia tộc khác nhau."
 has_supernatural_race_trigger_tt: "là một sinh vật siêu nhiên"

 pet_dragon_decision: "[ROOT.Char.Custom('DragonStoryName')] Cưng"
 pet_dragon_decision_desc: "Đã đến lúc hít một hơi thật sâu và tìm đến người bạn đồng hành bốn chân đáng tin cậy của ta, [ROOT.Char.Custom('DragonStoryName')]. Có người bảo rồng là loài sinh vật khó chiều, nhưng dù cuộc sống có khắc nghiệt đến đâu, ta biết [ROOT.Char.Custom('DragonStorySheHe')] sẽ luôn ở bên ta!"
 pet_dragon_decision_tooltip: "Có vảy đấy!"
 pet_dragon_decision_confirm: "Ai là con rồng ngoan nào?! Là ngươi đó!"

 POD_sabbat_victory_objective_decision: "Khải Hoàn Của Sabbat"
 POD_sabbat_victory_objective_decision_tooltip: "Đoàn kết làm một, mở đường cho sự trở lại của Caine."
 POD_sabbat_victory_objective_decision_desc: "Sabbat và Camarilla đang trong một cuộc chiến toàn diện vì linh hồn của thế giới ma cà rồng. Chỉ khi các thị tộc thống nhất dưới một tầm nhìn thì một trong hai bên mới thực sự trở thành kẻ chiến thắng."
 POD_sabbat_victory_objective_decision_confirm: "Thế giới đã sẵn sàng cho Caine."
 POD_sabbat_victory_objective_decision_custom: "#weak Hồng Y là một nhân vật từng ít nhất một lần kiểm soát hơn 33% khu vực trong khi là thành viên Sabbat#!"
 cardinal_sabbat_region_tt: "[region|E] [GetGeographicalRegion(SCOPE.GetFlagName('region_loca')).GetName] có một Hồng Y Sabbat"
 sabbat_victory_modifier: "Sứ Giả Của Caine"

 POD_camarilla_victory_objective_decision: "Khải Hoàn Của Camarilla"
 POD_camarilla_victory_objective_decision_tooltip: "Một chủng tộc, một xã hội."
 POD_camarilla_victory_objective_decision_desc: "Sabbat và Camarilla đang trong một cuộc chiến toàn diện vì linh hồn của thế giới ma cà rồng. Chỉ khi các thị tộc thống nhất dưới một tầm nhìn thì một trong hai bên mới thực sự trở thành kẻ chiến thắng."
 POD_camarilla_victory_objective_decision_confirm: "Tháp Ngà bất khuất."
 POD_camarilla_victory_objective_decision_custom: "Mọi $pod_clan$ đều là thành viên Camarilla"
 camarilla_victory_modifier: "Người Bảo Vệ Ngà"

