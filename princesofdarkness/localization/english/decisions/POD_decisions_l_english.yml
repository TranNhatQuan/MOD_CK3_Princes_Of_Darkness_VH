 secure_hades_objective_decision: "Bảo Đảm Hades"
 secure_hades_objective_decision_desc: "Khi [GetScriptedCharacterByHistoryID('792600').GetFirstName] lần đầu sử dụng phiên bản Phép Thuật Sự Sống của mình, hắn đã chọn Hades làm vương quốc bóng tối mới của chúng ta. Nhưng nó không ổn định như Amenti của Ai Cập và gây ra vấn đề nghiêm trọng khi hồi sinh sau cái chết. Chúng ta phải ổn định nó."
