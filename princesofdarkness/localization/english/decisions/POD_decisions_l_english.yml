 protecting_people_objective_decision_desc: "Thế giới đang dần bước vào [Glossary('Kỷ Nguyên Thứ Sáu','game_concept_sixth_age_desc')]. Dù kịch bản lý tưởng là ngăn chặn nó, chúng ta phải suy nghĩ thực tế. Và điều đó có nghĩa là chúng ta phải chuẩn bị cho điều tồi tệ nhất, chúng ta phải bảo vệ những người phàm đức hạnh sẽ chiến đấu chống lại [Glossary('Ma Hoàng','podgloss.demonemperor')] trong thời khắc gian nan sắp tới."
