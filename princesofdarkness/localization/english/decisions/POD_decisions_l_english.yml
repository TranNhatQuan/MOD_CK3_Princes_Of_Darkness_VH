 prospect.desc: "Ứng viên đầy triển vọng đang chờ ngươi phỏng vấn."
 invite_prospect_decision_confirm: "Tìm cho ta ai đó xứng đáng!"
 pod1230inqui_prospect.2.desc: "Địa vị và ảnh hưởng của ngươi trong Giáo hội Công giáo và Shadow Inquisition cho phép ngươi kêu gọi các thành viên của những tổ chức sáng lập nên tổ chức quyền lực này. Họ vốn đã là những thợ săn theo cách riêng và có thể giúp đỡ trong cuộc chiến một cách trực tiếp hơn, nhưng ngươi sẽ không thể biến họ thành đệ tử của mình."
 pod1230inqui_prospect.2.a: "Ta cần một Hiệp Sĩ của Acre."
 pod1230inqui_prospect.2.b: "Ta cần một Nữ Tu của St. John."
 pod1230inqui_prospect.2.c: "Ta cần một thành viên của Oculi Dei."
 pod1230inqui_prospect.2.d: "Ta cần một người của Von Murnau."
 pod1230inqui_prospect.2.e: "Ta cần một thành viên của Red Order."
 pod1230inqui_prospect.2.z: "Ta cần một đệ tử tiềm năng."
 pod1230inqui_prospect.2.tooltip: "Ngươi sẽ nhận được một ứng viên phàm nhân phù hợp để tấn phong thay vào đó."

 contact_fellow_hunters_decision: "Liên Lạc Với Đồng Đạo Thợ Săn"
 contact_fellow_hunters_decision_tooltip: "Đoàn kết chống lại bóng tối?"
 contact_fellow_hunters_decision_desc: "Ngươi đã thu được chút ủng hộ từ các tổ chức thợ săn khác nhau. Sự ủng hộ đó có thể được tận dụng để nhờ giúp đỡ."
 contact_fellow_hunters_decision_confirm: "Thợ săn của thế gian, hãy đoàn kết!"
 contact_fellow_hunters_decision_tt: "Ngươi sẽ yêu cầu một thành viên tổ chức gia nhập hoặc dạy dỗ ngươi tùy theo các đặc ân gia tộc ngươi đã mở khóa."

 pod1230inqui_prospect.3.desc: "Nhờ những nỗ lực ngươi đã bỏ ra để giành được sự ủng hộ của các tổ chức thợ săn đồng đạo, ngươi có thể sử dụng sự giúp đỡ của họ vì lợi ích của mình. Mỗi người trong số họ đều có bộ kỹ năng độc đáo có thể giúp ích cho chính nghĩa của ngươi. Sau bao thời gian sống giữa đám dân chúng hoàn toàn không hay biết về mối hiểm họa (và thường vô tình cản trở nỗ lực của ngươi), thật dễ chịu khi được làm việc cùng những người hiểu rằng các mối bận tâm phàm tục nhỏ nhặt chẳng đáng là gì trước hiểm họa siêu nhiên."
 pod1230inqui_prospect.3.a: "Ta cần một Chiến Binh Thẩm Tra."
 pod1230inqui_prospect.3.b: "Ta cần một gián điệp trưởng Ikhwan Al-Safa."
 pod1230inqui_prospect.3.bis: "Ikhwan có thể dạy ta Sorcery."
 pod1230inqui_prospect.3.c: "Ta cần một Quan Xét uyên bác."
 pod1230inqui_prospect.3.cis: "Các Quan Xét có thể dạy ta Theurgy."
 pod1230inqui_prospect.3.d: "Ta cần một quan quản lý Akitrai."
 pod1230inqui_prospect.3.e: "Ta cần một lãnh chúa chiến tranh Qorjin."
 pod1230inqui_prospect.3.tt: "Một thành viên của tổ chức này sẽ gia nhập triều đình ngươi."
 
