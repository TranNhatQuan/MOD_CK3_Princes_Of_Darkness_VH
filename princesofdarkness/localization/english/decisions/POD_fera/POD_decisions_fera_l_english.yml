 fera_advance_rank_decision: "Thăng Cấp Bậc"
 fera_advance_rank_decision_desc: "Danh Vọng và Cấp Bậc là thước đo vị trí của một kẻ biến hình trong xã hội của họ. Danh Vọng càng cao, lời nói của họ càng có trọng lượng. Mỗi $glossary_fera$ khác nhau đều dùng một bộ ba loại danh vọng khác nhau.\n\nNgươi có được Danh Vọng từ:\n"
 fera_advance_rank_decision_tooltip: "Thăng tiến cấp bậc Fera cần thời gian và sự cam kết."
 fera_advance_rank_decision_confirm: "Danh tiếng của ta ngày một lớn!"

 fera_advance_rank_renown_glory: "#clickable $POD_fera_renown_glory$:#!\n#medium $BULLET_WITH_TAB$Thắng các cuộc chiến chống lại quân chủ theo phe Wyrm nếu ngươi theo đức tin Gaia.\n$BULLET_WITH_TAB$Thắng các cuộc chiến chống lại quân chủ theo phe Gaia nếu ngươi theo đức tin Wyrm.\n$BULLET_WITH_TAB$Giết các nhân vật theo phe Wyrm nếu ngươi theo đức tin Gaia.\n$BULLET_WITH_TAB$Giết các nhân vật theo phe Gaia nếu ngươi theo đức tin Wyrm.#!\n$BULLET_WITH_TAB$Hoàn thành [mercenary_task_contracts|E] với tư cách [adventurer|E].\n"

 fera_advance_rank_renown_honor: "#clickable $POD_fera_renown_honor$:#!\n#medium $BULLET_WITH_TAB$Từ bỏ một [grudge|E], chấm dứt một [rivalry|E], hoặc mất đi một [nemesis|E].\n$BULLET_WITH_TAB$Phong [duchies|E] hoặc tước vị cao hơn cho một $glossary_fera$ khác.\n$BULLET_WITH_TAB$Nâng cấp một Caern lên cấp tối đa.\n$BULLET_WITH_TAB$Tăng [piety_level|E] của ngươi.#!\n"

 fera_advance_rank_renown_wisdom: "#clickable $POD_fera_renown_wisdom$:#!\n#medium $BULLET_WITH_TAB$Hoàn thành các Cuộc Viễn Chinh Umbra.\n$BULLET_WITH_TAB$Đạt được [perk|E] cuối cùng của một nhánh lối sống $glossary_fera$.\n$BULLET_WITH_TAB$Hoàn thành một [journey|E] Truy Tìm Linh Hồn.#!\n"

 fera_advance_rank_renown_power: "#clickable $POD_fera_renown_power$:#!\n#medium $BULLET_WITH_TAB$Thắng các cuộc chiến.\n$BULLET_WITH_TAB$Thắng các cuộc đấu tay đôi.\n$BULLET_WITH_TAB$Tăng [prestige_level|E] của ngươi.#!\n$BULLET_WITH_TAB$Đạt được [urgetaints_lifestyle|E] Thể Chất.\n"

 fera_advance_rank_renown_cunning: "#clickable $POD_fera_renown_cunning$:#!\n#medium $BULLET_WITH_TAB$Thành công trong một [infiltration|E].\n$BULLET_WITH_TAB$[blackmailing|E] một nhân vật khác.\n$BULLET_WITH_TAB$Thành công trong [schemes|E] [GetScheme('abduct').GetTypeName].#!\n"

 fera_advance_rank_renown_ferocity: "#clickable $POD_fera_renown_ferocity$:#!\n#medium $BULLET_WITH_TAB$Trở về đất của ngươi với ít nhất #P 50#! [loot|E] [raid|E].\n$BULLET_WITH_TAB$Đạt được [trait_level_track_xp|E] trong bất kỳ [trait_level_track|E] [GetTrait('lifestyle_hunter').GetName(GetNullCharacter)] nào.\n$BULLET_WITH_TAB$Huấn luyện cùng [GetPlayer.Custom('PODCoterie')] của ngươi.#!\n"

 fera_advance_rank_renown_infamy: "#clickable $POD_fera_renown_infamy$:#!\n#medium $BULLET_WITH_TAB$Thành công trong [schemes|E] [GetScheme('fabricate_hook').GetTypeName].\n$BULLET_WITH_TAB$Xử tử chư hầu của chính ngươi từ [title_rank|E] Công Quốc trở lên mà không có [execute_reason|E].\n$BULLET_WITH_TAB$Cướp ngôi các tước vị từ [rank|E] Vương Quốc trở lên.\n$BULLET_WITH_TAB$Phá vỡ hiệp ước đình chiến.#!\n$BULLET_WITH_TAB$Đạt được [urgetaints_lifestyle|E] Tinh Thần.\n"


 fera_advance_rank_renown_bonuses: "\n#clickable [GetPlayer.Custom('PODFeraAuspiceType')] của ngươi mang lại một khoản thưởng cho [GetPlayer.Custom('PODFeraAuspiceRenownBoost')].#!"

 POD_fera_advance_to_next_rank_desc: "Ngươi thăng lên Cấp Bậc #bold $VALUE|0V$#! trong [trait|E] [TRAIT.GetName(GetPlayer)]"
 fera_advance_rank_decision_requirement_tributaries: "Ngươi có từ 2 [tributaries|E] trở lên với ít nhất [rank|E] Vương Quốc"


 fera_recruit_beastborn_decision: "Nuôi Dưỡng Kẻ Thân Tộc Loài Vật"
 fera_recruit_beastborn_decision_desc_werewolf: "Garou có mối quan hệ sâu sắc với thân tộc sói của họ. Mỗi bộ tộc, kể cả những tộc gắn bó với thành thị nhất như Warders of Men, đều cẩn thận trông chừng những người bạn bốn chân của mình và tìm kiếm dấu hiệu của một Lần Biến Đổi Đầu Tiên trong số chúng.\nNhững con sói cuối cùng trở thành Người Sói thường cần được chuẩn bị nhiều hơn trước khi trở thành thành viên đầy đủ của Bộ Tộc, vì những cạm bẫy của thế giới loài người còn mới mẻ với chúng. Là thủ lĩnh địa phương, việc của ngươi là chọn mức độ giám sát và lên kế hoạch cho sự trợ giúp tiềm năng này."

 fera_recruit_beastborn_decision_desc_bubasti: "Từ lâu, Bubasti đã sát cánh cùng Horus trong cuộc chiến vĩnh cửu chống lại người chú sa đọa của thần, Set. Dù chính nghĩa đứng về phía họ và Bubasti vẫn tự hào về đóng góp của mình, điều đó vẫn dẫn đến một thất bại thảm khốc. Những kẻ theo Set chiến thắng đã bắt giữ thân tộc mèo của Bubasti, những con mèo Kyphur, và hoặc giết chúng hoặc cho chúng uống máu để biến chúng thành quái vật dị dạng.\nTuy nhiên, với chiến thắng gần đây và cuộc giải cứu táo bạo những con mèo Kyphur cuối cùng, Bubasti giờ đây một lần nữa đang thịnh vượng và trông nom thân tộc mèo của mình, giúp chúng lấy lại sức mạnh và chữa lành khỏi chấn thương của thời gian dài phục dịch cho những kẻ theo Set."
 fera_recruit_beastborn_decision_desc_bastet: "Bastet có mối quan hệ sâu sắc với thân tộc mèo của họ. Mỗi bộ tộc đều cẩn thận trông chừng những người bạn bốn chân của mình và tìm kiếm dấu hiệu của một Lần Biến Đổi Đầu Tiên trong số chúng. Vì mèo có tính lãnh thổ rất cao, điều đó cũng có nghĩa là các bộ tộc thường ở yên tại vùng đất nơi thân tộc của họ sinh sống.\nNhững con mèo cuối cùng trở thành Bastet thường cần được chuẩn bị nhiều hơn trước khi trở thành thành viên đầy đủ của Bộ Tộc, vì những cạm bẫy của thế giới loài người còn mới mẻ với chúng. Là thủ lĩnh địa phương, việc của ngươi là chọn mức độ giám sát và lên kế hoạch cho sự trợ giúp tiềm năng này."
 fera_recruit_beastborn_decision_desc_mokole: "Là một trong số ít Fera Phi Động Vật Có Vú, Mokolé có thể khá thờ ơ với việc chăm sóc thân tộc động vật khép kín hơn của họ. Với vòng đời nhanh hơn của loài bò sát, việc có những ổ trứng chuyên biệt nơi Mokolé đẻ trứng là chuyện đơn giản, nơi Kinfolk loài người có thể trông chừng chúng và chờ đợi những con nở ra, thường trải qua Lần Biến Đổi Đầu Tiên trong vòng vài tuần. Là thủ lĩnh địa phương, việc đến chỗ những quả trứng và kiểm tra tiến triển hiện tại, để xem liệu có con nào vừa nở đã trải qua Lần Biến Đổi Đầu Tiên hay chưa, là chuyện đơn giản.\nNhững con bò sát cuối cùng trở thành Mokolé thường cần được chuẩn bị nhiều hơn trước khi trở thành thành viên đầy đủ của Ổ, vì những cạm bẫy của thế giới loài người còn mới mẻ với chúng. Là thủ lĩnh địa phương, việc của ngươi là chọn mức độ giám sát và lên kế hoạch cho sự trợ giúp tiềm năng này."

 fera_recruit_beastborn_decision_bubasti_requirement: "#bold Mèo Chống Rắn#! phải đã được hoàn thành"
 fera_recruit_beastborn_decision_effect: "Ngươi sẽ được đưa ra các lựa chọn để có $glossary_fera$ [GetTrait('beast_born').GetName( GetPlayer )] thuộc bộ tộc của ngươi đến triều đình của ngươi. Điều này có khả năng sẽ tốn thêm một số tài nguyên."
fera_recruit_beastborn_decision_tooltip: "Tìm $glossary_fera$ trong số các loài thú."
fera_recruit_beastborn_decision_confirm: "Bắt đầu tìm kiếm!"