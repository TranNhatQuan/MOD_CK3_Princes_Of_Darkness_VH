l_english:


 restore_per_bast_objective_decision: "Khôi Phục Per-Bast"
 restore_per_bast_objective_decision_desc: "Thành phố "Per-Bast" của Bastet từng là trung tâm thờ phụng của những người Ai Cập biết ơn dành cho các ân nhân mèo bóng tối của họ. Liệu nó có thể như vậy một lần nữa?"
 restore_per_bast_objective_decision_tooltip: "Kinh đô cổ xưa của chúng ta đang chờ đợi."
 restore_per_bast_objective_decision_confirm: "Ca tụng Loài Mèo."

 the_fleeing_scarab_objective_decision: "Bọ Hung Chạy Trốn"
 the_fleeing_scarab_objective_decision_desc: "Bí mật quý giá nhất của Bubasti, Bọ Hung Chạy Trốn là một nghi thức hắc ám cho phép một Bastet mua sự bất tử của mình bằng linh hồn của những sinh vật sống khác."
 the_fleeing_scarab_objective_decision_tooltip: "Sự sống vĩnh cửu, gần trong tầm tay đến vậy."
 the_fleeing_scarab_objective_decision_confirm: "Không cái giá nào là quá cao cho sức mạnh này."
 fleeing_scarab_decision_custom: "Một Xác Ướp phải là Bạn Thân Nhất hoặc Tri Kỷ của ngươi."
 fleeing_scarab_decision_custom2: "Ngươi phải có từ 15 tù nhân trở lên mang trait Người Phàm."

 royal_privilege_objective_decision: "Đặc Quyền Vương Giả"
 royal_privilege_objective_decision_desc: "Một bí mật hiếm có và quý giá của Simba, Đặc Quyền Vương Giả cho phép họ học các năng lực của những bộ tộc Bastet khác. Chỉ những Simba thành công nhất (và một số nói là tàn nhẫn nhất) mới được linh hồn Unmaker coi là xứng đáng để học nó."
 royal_privilege_objective_decision_tooltip: "Làm Vua có đặc quyền của nó."
 royal_privilege_objective_decision_confirm: "Cuối cùng cũng là Vua Mèo đích thực."