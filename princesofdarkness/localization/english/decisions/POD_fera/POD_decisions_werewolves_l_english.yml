l_english:
 judge_land_decision: "Thẩm Phán Của Xứ Sở"
 judge_land_decision_tooltip: "Ngươi có trách nhiệm với dân chúng."
 judge_land_decision_desc: "Là một Philodox, ngươi được kỳ vọng đại diện cho những luật lệ cổ xưa. Vì vậy, ngươi là thành trì của truyền thống và sự đáng kính đối với cả người sói lẫn người phàm."
 judge_land_decision_confirm: "Ta sẽ lắng nghe và cân nhắc"

 judge_land_modifier: "Thẩm Phán Của Xứ Sở"
 judge_land_modifier_desc: "Một Philodox gần đây đã xử lý các vấn đề pháp lý trong vùng này, đảm bảo một phiên xét xử công bằng cho kẻ vô tội và một cuộc hành quyết nhanh chóng cho kẻ có tội."

 prospering_populace_modifier: "Dân Chúng Thịnh Vượng"
 prospering_populace_modifier_desc: "Một Philodox đang đảm bảo rằng mọi người đều nhận được phần xứng đáng và cùng làm việc như một cộng đồng trong vùng này."

 auspice_renunciation_decision: "Từ Bỏ Thánh Triều"
 auspice_renunciation_decision_tooltip: "Ngươi sẽ thay đổi Thánh Triều của mình."
 auspice_renunciation_decision_desc: "Trong nghi lễ hiếm có này, một người sói từ chối Thánh Triều mà hắn đã sinh ra dưới đó và chọn một Thánh Triều mới. Garou phải thực hiện nghi lễ này trong pha trăng mà hắn muốn chuyển sang. Phổ biến nhất, nước từ một chậu bạc phơi dưới ánh sáng của Luna được đổ lên người cầu xin trần trụi, gột rửa sạch mọi thứ hắn từng là, bao gồm cả mọi cấp bậc. Giờ đây hắn được tự do bắt đầu lại như một thành viên của Thánh Triều mới được chọn."
 auspice_renunciation_decision_confirm: "Vầng Trăng Đổi Thay"

 force_duel_criminals_interaction.death.tt: "Cuộc đấu này là sinh tử."

