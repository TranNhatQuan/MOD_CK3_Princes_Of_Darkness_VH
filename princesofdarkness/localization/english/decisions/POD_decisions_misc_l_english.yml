 POD_change_predatortype.1.desc: "Ngươi có chắc muốn đổi loại hình săn mồi của mình không?\n\nLựa chọn này sẽ không khả dụng trở lại cho đến khi 50 năm trôi qua.\n\nTrong một số điều kiện nhất định, ngươi có thể bị buộc phải đổi loại hình săn mồi, chẳng hạn nếu loại hình săn mồi của ngươi không còn hợp lệ.\n\n #warning Nếu ngươi chọn lựa chọn thứ ba, nó sẽ loại bỏ quyết định này vĩnh viễn cho nhân vật hiện tại của ngươi#!"
