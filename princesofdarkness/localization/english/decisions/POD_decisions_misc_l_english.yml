 #Challenge House Head
 challenge_house_head_decision: "Thách Thức Quyền Lãnh Đạo Chi Tộc"
 challenge_house_head_decision_desc: "Thật sự không ai khác ngoài ngươi có thể dẫn dắt dòng dõi đáng kính của mình đến vinh quang. Chỉ là vấn đề khiến những người khác hiểu (hoặc ít nhất là chấp nhận) điều đó."
 challenge_house_head_decision_tooltip: "Dòng dõi của ta cần ta."
 challenge_house_head_decision_confirm: "Giờ ta là người nắm quyền!"
 challenge_house_head_decision_effect_tooltip: "Tùy thuộc vào nơi ở hiện tại của người đứng đầu chi tộc ngươi, ngươi sẽ được đưa ra vài lựa chọn để cướp lấy vị trí của họ."

 POD_diarchy_events.0005.desc: "Một số thị tộc ma cà rồng quan tâm đến dòng dõi của mình hơn những thị tộc khác, Ventrue là một ví dụ điển hình, nhưng tất cả bọn họ đều dành ít nhiều sự tôn trọng cho khái niệm này. Suy cho cùng điều này dễ dàng trở thành lẽ đương nhiên khi các bậc trưởng lão trong "gia tộc" của ngươi thường đã sống hàng thế kỷ (hoặc hơn) và mạnh mẽ hơn nhiều so với những tân sinh trẻ tuổi đang tranh giành ở tầng đáy.\nDù vậy, không phải chưa từng có chuyện những thành viên trẻ hơn nắm quyền điều khiển công việc của dòng dõi mình. Có lẽ các bậc trưởng lão của họ đã trở nên chán nản hoặc thay vào đó hoạt động trong một phạm vi ảnh hưởng hoàn toàn khác so với những mưu mô chính trị hàng đêm của những kẻ bị nguyền rủa. Tuy nhiên, hiếm khi có ai tự nguyện trao lại vị trí cao quý của người đứng đầu chi tộc mà không có ít nhất một hình thức thử thách hay đền bù nào đó.\nTro tàn của những kẻ mới nổi đã đánh giá thấp bậc trưởng lão của mình có thể phủ kín một vùng đất khá rộng lớn."
 POD_diarchy_events.0005.a: "Ta có năng lực hơn một người đẹp ngủ nào đó!"
 challenge_house_head_torpor: "Người đứng đầu chi tộc của ngươi đang trong Miên trạng. Trở ngại duy nhất khi ngươi tuyên nhận quyền lãnh đạo chi tộc sẽ là sự khinh miệt và ghen tị của các thành viên đồng chi tộc."
 POD_diarchy_events.0005.b: "Nghĩ lại thì..."
 POD_diarchy_events.0005.c: "Ngươi muốn một ân huệ? Được thôi..."
 POD_diarchy_events.0005.d: "Vào vị trí!"
 POD_diarchy_events.0005.duelwin: "Giờ ta là người nắm quyền!"
 POD_diarchy_events.0005.duelloss: "Việc đó diễn ra tệ hại..."
 POD_diarchy_events.0005.e: "Ta phải thuyết phục chi tộc của mình!"
 POD_diarchy_events.0005.f: "Ngươi định trao nó cho ta luôn sao?"
 challenge_house_head_content: "Người đứng đầu chi tộc mãn nguyện của ngươi vui vẻ để ngươi nắm quyền điều khiển. Tuy nhiên chi tộc của ngươi không mấy hài lòng với hành động cướp quyền trắng trợn này."

 challenged_house_head_modifier: "Kẻ Mới Nổi Thách Thức Người Đứng Đầu"
 challenged_house_head_modifier_desc: "Những tâm trí nhỏ nhen không hiểu được sự vĩ đại vốn có của ngươi."

