 POD_torture_all_prisoners_decision_desc: "$POD_torture_all_prisoners_decision_tooltip$.\n#weak Quyết định này có kết quả giống như [character_interaction|E] Tra Tấn. Do hạn chế kỹ thuật, không phải mọi hiệu ứng đều được hiển thị.#!"
