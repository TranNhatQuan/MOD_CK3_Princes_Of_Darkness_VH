 heal_chulorviosis_decision: "Chữa Khỏi Chulorviosis"
 heal_chulorviosis_decision_desc: "Chulorviosis là một căn bệnh khủng khiếp, rõ ràng mang tính siêu nhiên. Sinh vật ký sinh đang dần kiểm soát ngươi, để lại cho ngươi rất ít lựa chọn để sống sót.\nNgươi có thể chữa khỏi bằng cách trở thành beatific, một thrall, bị chiếm hữu bởi một linh hồn của $glossary_triat$ hoặc Gaia. Có một người bạn hoặc người tình beatific hay ác quỷ chữa lành cho ngươi cũng sẽ hiệu quả."
 heal_chulorviosis_decision_tooltip: "Thời gian đang cạn dần."
 heal_chulorviosis_decision_confirm: "Ra khỏi đầu ta!"
 heal_chulorviosis_decision_custom: "Có [friend|E] nào mang [GetTrait('beatific').GetName( GetPlayer )] hoặc [GetTrait('demon').GetName( GetPlayer )] không"
