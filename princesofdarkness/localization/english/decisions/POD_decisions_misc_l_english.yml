 POD_torture_all_prisoners_decision_effect_stress_sadistic: "Vì ngươi mang [GetTrait('sadistic').GetName(GetPlayer)], ngươi sẽ mất [stress|E]."
 POD_torture_all_prisoners_decision_effect_stress_zealous: "Vì ngươi mang [GetTrait('zealous').GetName(GetPlayer)], ngươi sẽ mất [stress|E] cho mỗi kẻ ngoại đạo ngươi tra tấn."
 POD_torture_all_prisoners_decision_effect_stress_gain: "Ngươi có thể nhận [stress|E] rất lớn vì ngươi có tính cách nhân hậu #weak (mang [traits|E] [GetTrait('compassionate').GetName(GetNullCharacter)], [GetTrait('craven').GetName(GetNullCharacter)], [GetTrait('just').GetName(GetNullCharacter)], [GetTrait('forgiving').GetName(GetNullCharacter)], [GetTrait('generous').GetName(GetNullCharacter)], [GetTrait('trusting').GetName(GetNullCharacter)], hoặc [GetTrait('content').GetName(GetNullCharacter)])#!"
 POD_torture_all_prisoners_decision_effect_piety: "[piety|E] của ngươi sẽ thay đổi [piety_i|E][GetPlayer.MakeScope.ScriptValue('mass_torture_piety_gain')|V0]"

