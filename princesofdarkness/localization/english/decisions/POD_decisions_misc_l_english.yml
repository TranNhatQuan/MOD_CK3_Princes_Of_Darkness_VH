 visceratika_tremere_decision: "Thí Nghiệm Gargoyle"
 visceratika_tremere_decision_desc: "Sau những thí nghiệm dài với gargoyle, ngươi đã khám phá ra tài năng ẩn giấu của đá và đất, và giờ đây có thể vận dụng Dị năng Visceratika theo mục đích riêng của mình. Ngươi là một pháp sư thật sự tài năng."
