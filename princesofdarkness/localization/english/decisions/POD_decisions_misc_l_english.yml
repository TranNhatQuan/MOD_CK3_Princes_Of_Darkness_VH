 visceratika_gargoyle_decision: "Tự Do Của Gargoyle"
 visceratika_gargoyle_decision_desc: "Với sự độc lập mới có được, ngươi thấy mình đã có thời gian để làm chủ bản chất đá và đất tự nhiên của mình, hé lộ Dị năng Visceratika từ bên trong bản thân."
