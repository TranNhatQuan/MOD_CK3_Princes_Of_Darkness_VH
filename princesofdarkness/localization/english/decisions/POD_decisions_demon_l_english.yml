l_english:
 POD_improve_ritual_of_sundered_soul_decision: "Cải Thiện Nghi Thức Linh Hồn Chia Cắt"
 POD_improve_ritual_of_sundered_soul_decision_tooltip: "Ta sẽ không bị giam cầm mãi mãi!"
 POD_improve_ritual_of_sundered_soul_decision_desc: "Nghi thức phức tạp và mới mẻ này là cách duy nhất để ngươi thực sự biểu hiện quyền năng của mình trên Trái Đất. Ngươi cần khám phá những bí mật của nó và cải thiện nó."
 POD_improve_ritual_of_sundered_soul_decision_confirm: "Chẳng bao lâu nữa, chúng sẽ thấy sức mạnh thật sự của ta."

 POD_demon_gather_the_faithful_objective_decision: "Tập Hợp Tín Đồ"
 POD_demon_gather_the_faithful_objective_decision_tooltip: "Quyền năng của ngươi gắn liền với đức tin của người phàm. Đã đến lúc tập hợp đàn chiên của ngươi."
 POD_demon_gather_the_faithful_objective_decision_desc: "Khi Cuộc Chiến Thiên Giới còn tiếp diễn, và các thiên thần nhận ra tiềm năng tội ác bao la chưa được khai thác trong Tạo Vật, sự hấp dẫn biến thành khát khao, và khả năng kiểm soát những khát khao đó suy yếu dần. Từng có lúc, chúng được nuôi dưỡng bởi đức tin của người phàm vào bản chất thần thánh của mình, nhưng sự tái sinh trong tội lỗi đã làm vẩn đục những dòng nước ấy. Giờ đây chúng là ác quỷ nhiều hơn là thiên thần, khai thác sự tha hóa như một sự nhại lại rỗng tuếch của thứ mà chúng từng là."
 POD_demon_gather_the_faithful_objective_decision_confirm: "Bản Giao Hưởng Tội Lỗi"
 POD_demon_gather_the_faithful_decision_more_xp: "Kinh nghiệm [arcana_lifestyle|E] từ các tín đồ của ngươi sẽ được #P;bold nhân đôi#!"
 POD_demon_gather_the_faithful_decision_next_objective: "Mở khóa [decision|E] $POD_demon_breakdown_the_abyss_objective_decision$"
 POD_demon_gather_the_faithful_decision_unlock_sin_trait_vassalization: "Cho phép ngươi biến các quân chủ có [trait|E] tội lỗi tương ứng với đức tin của ngươi thành chư hầu."

 POD_demon_breakdown_the_abyss_objective_decision: "Đột Phá Ngục Tù Vực Thẳm"
 POD_demon_breakdown_the_abyss_objective_decision_tooltip: "Ngươi sẽ phá vỡ nhà tù quan trọng nhất trong sự tồn tại."
 POD_demon_breakdown_the_abyss_objective_decision_desc: "[UmbraGlossary('abyss')], còn được gọi là Địa Ngục hay Hố Sâu, là chiều không gian tăm tối được Chúa tạo ra làm ngục tù vĩnh viễn cho Kẻ Sa Ngã. Ngươi là một trong số ít kẻ đã trốn thoát, nhưng điều gì sẽ xảy ra nếu tất cả anh em bị giam cầm của ngươi cũng làm như vậy? Nhiều kẻ đã bị bóp méo đến mức khó tin, nhưng liệu có ai thực sự đáng bị thối rữa trong Địa Ngục đích thực này không?\nNgươi đã một lần nổi loạn chống lại mệnh lệnh của Chúa, ngươi có thể làm điều đó lần thứ hai."
 POD_demon_breakdown_the_abyss_objective_decision_confirm: "Cuối cùng cũng được tự do!"
 POD_demon_breakdown_the_abyss_objective_decision_custom1: "Phải có ít nhất 45 [perks|E] trong [lifestyle|E] [arcana_lifestyle|E]."
 POD_demon_breakdown_the_abyss_objective_decision_free_lores: "Ác quỷ có quyền tiếp cận mọi [lore_lifestyle|E]."
 POD_demon_breakdown_the_abyss_objective_decision_no_more_abyss: "Ác quỷ sẽ được giải thoát khỏi [UmbraGlossary('abyss')], nghĩa là mọi ác quỷ có thể du hành [umbra|E] một lần nữa."
 POD_demon_breakdown_the_abyss_objective_decision_allow_create_demon: "Ngươi có thể tạo thân xác cho các $POD_splat_demon_plural$ khác, và chiêu mộ chúng làm khách trong triều đình của ngươi."

 POD_demon_final_war_objective_decision: "Cuộc Chiến Cuối Cùng"
 POD_demon_final_war_objective_decision_tooltip: "Ngươi sẽ khơi mào Cuộc Chiến Thịnh Nộ lần thứ hai."
 POD_demon_final_war_objective_decision_desc: "Chúa đã quay lưng lại với Tạo Vật, bỏ mặc ngươi trong thế giới khốn khổ này. Đã đến lúc phỉ nhổ vào mặt Kẻ Phản Bội Vĩ Đại bằng cách biến sự ghê tởm này thành tro bụi một lần và mãi mãi."
 POD_demon_final_war_objective_decision_confirm: "Sự Kết Thúc"
 POD_demon_final_war_objective_decision_custom1: "Ngươi phải có toàn bộ [perks|E] trong [lifestyle|E] [arcana_lifestyle|E]."
 POD_demon_final_war_objective_decision_end: "#X Cuộc chiến chấm dứt mọi cuộc chiến sẽ bắt đầu. Không có đường lui. Ngươi có muốn tiếp tục để dẫn Tạo Vật đến diệt vong không?#!"

 POD_demon_redemption_objective_decision: "Sự Tha Thứ Thần Thánh"
 POD_demon_redemption_objective_decision_tooltip: "Có lẽ, đâu đó ở phương xa, hy vọng vẫn còn le lói."
 POD_demon_redemption_objective_decision_desc: "Ký ức về quá khứ là một thiên thần nhắc ngươi nhớ về mọi thứ ngươi đã mất trong cuộc nổi loạn. Nếu Chúa thực sự khoan dung, có lẽ vẫn còn một chỗ cho ngươi trong Thành Bạc của Người?"
 POD_demon_redemption_objective_decision_confirm: "Cuối cùng, Ánh Sáng"
 POD_demon_redemption_objective_decision_custom: "Điều này sẽ kết thúc hành trình của ngươi, hy vọng là, trong sự cứu rỗi."
 POD_demon_redemption_objective_decision_tt1: "Giải phóng các tín đồ của ngươi. #weak (Số lượng tín đồ là #V 0#!)#!"
 POD_demon_redemption_objective_decision_tt2: "Từ bỏ đức tin tội lỗi của ngươi. #weak (Ngươi có #V 0#! lòng mộ đạo hoặc ít hơn)#!"

 POD_new_genesis_objective_decision: "Cuộc Sáng Thế Mới"
 POD_new_genesis_objective_decision_desc: "Chúa tạo ra loài người với một tia thần tính của Người trong họ. Nếu ngươi cải đạo đủ số người phàm để họ thờ phụng ngươi thay vì Người, thì sự khác biệt giữa ngươi và Người là gì? Và rồi, có lẽ đã đến lúc tái tạo thế giới này theo hình ảnh của ngươi?"
 POD_new_genesis_objective_decision_tooltip: "Họ sẽ cầu nguyện, sống và chết dưới danh nghĩa của ngươi."
 POD_new_genesis_objective_decision_confirm: "Hãy bắt đầu..."

 demonic_knowledge_objective_decsion: "Cây Tri Thức Của Ác Quỷ"
 demonic_knowledge_objective_decsion_desc: "Thời gian trong Ngục Tù Vực Thẳm khiến ngươi ý thức sâu sắc về giới hạn tri thức của mình. Kế hoạch của Chúa, có vẻ như, phức tạp hơn nhiều so với những gì ngươi từng dự đoán. Kể từ đó ngươi bị dày vò bởi một cơn khát muốn biết thêm. Đã đến lúc thỏa mãn cơn khát này."
 demonic_knowledge_objective_decsion_tooltip: "Ta có thể thực sự hiểu được Đấng Thần Thánh không?"
 demonic_knowledge_objective_decsion_confirm: "Trái cấm, đã được nếm."
 demonic_knowledge_objective_decsion_custom1: "Ngươi phải có toàn bộ [perks|E] trong [lifestyle|E] [lore_lifestyle|E]."

 restore_babylon_objective_decision: "Khôi Phục Babylon"
 restore_babylon_objective_decision_tooltip: "Treo những khu vườn của ngươi lên."
 restore_babylon_objective_decision_desc: "Đó là thời đại của những đế chế man rợ và các cuộc thánh chiến, của những anh hùng được ban phước (hay bị nguyền rủa) bởi các vị thần sống và những nghi lễ không thể nói thành lời được cử hành trước tượng thần bằng vàng, đá bazan và ngọc bích. Khi những Earthbound giao tranh, quân đội của tín đồ hành quân. Mặt đất rung chuyển và bầu trời đổ mưa máu, và toàn bộ thành phố bị đưa vào lưỡi kiếm.\nĐó là Babylon và đó là Địa Ngục trên Trần Gian."
 restore_babylon_objective_decision_confirm: "Những thời khắc huy hoàng"
 restore_babylon_objective_decision_effect_tooltip: "Các quân chủ mang [GetTrait('demon').GetName( GetPlayer )] và [GetTrait('witch').GetName( GetPlayer )] sẽ luôn chấp nhận lời đề nghị thần phục của ngươi."

 sin_dragon_objective_decision: "Rồng Tội Lỗi Nguyên Thủy"
 sin_dragon_objective_decision_tooltip: "Bắt giữ Tội Lỗi."
 sin_dragon_objective_decision_desc: "Được triệu hồi bởi hy vọng đang tàn lụi của những người phàm từng sùng đạo, bảy con rồng vĩ đại đang chờ đợi một hiện thân xứng đáng của tội lỗi chúng để tuyên nhận chúng. Ngươi có sẽ là bậc thánh nhân ô uế đó không?"
 sin_dragon_objective_decision_confirm: "Những đấng Nguyên Thủy, đã thức tỉnh trở lại"
 sin_dragon_objective_decision_effect_tooltip: "Mở khóa một [men_at_arms|E] Rồng Tội Lỗi tương ứng với [faith|E] của ngươi."
 unlock_sin_conversion_decision: "Mở khóa [decision|E] $sin_conversion_decision$"
 sin_dragon_trainer_modifier: "Người Huấn Luyện Rồng Tội Lỗi"

 landless_demon_objective_decision: "Bí Mật Của Kẻ Sa Ngã"
 landless_demon_objective_decision_tooltip: "Tàn tích của thế giới trước thế giới này."
 landless_demon_objective_decision_desc: "Biết bao kỳ quan đã mất đi trong Cuộc Nổi Loạn Thiên Giới. Dù ngươi chỉ còn ký ức mờ nhạt về chúng, có lẽ những cư dân của thời đại này còn mang những tàn tích tri thức rời rạc mà ngươi có thể sử dụng."
 landless_demon_objective_decision_confirm: "Đã mất nhưng chưa bị lãng quên..."
 landless_demon_objective_decision_valid_tt: "Mỗi lần ngươi công nhận một [cultist|E] mới khi không có đất, ngươi có cơ hội thu được tri thức mới về truyền thuyết đã mất của các Thiên Thần. [learning|E] càng cao càng tăng cơ hội đó.\n\nTri thức hiện tại của ngươi là [GetPlayer.MakeScope.ScriptValue('POD_landless_demon_clues')|V0]."
 landless_demon_objective_decision_effect_tt: "Ở mức [EmptyScope.ScriptValue('POD_landless_demon_clues_for_1st_unlock')|V0] tri thức, ngươi mở khóa [court_position|E] [GetCourtPositionType('fell_knight_court_position').GetName()].\n\nỞ mức [EmptyScope.ScriptValue('POD_landless_demon_clues_for_2nd_unlock')|V0] tri thức, ngươi có được khả năng triệu hồi $POD_splat_demon_plural$, và mọi Ác Quỷ được triệu hồi sẽ mạnh hơn.\n\nỞ mức [EmptyScope.ScriptValue('POD_landless_demon_clues_for_3rd_unlock')|V0] tri thức, ngươi có được Soultaker, một thanh kiếm vô cùng mạnh mẽ."

 podintroductions.2406.t: "Ác Quỷ Không Đất"
 podintroductions.2406.desc: "Những Ác Quỷ không trực tiếp cai quản đất đai phụ thuộc vào [cultists|E] của chúng nhiều hơn những đồng loại định cư, hoạt động như các giáo phái mạt thế thường đội lốt những cộng đồng tôn giáo vô hại hơn. Tuy nhiên, việc di chuyển mang lại cho chúng một lợi thế lớn: tri thức.\nCác thiên thần sa ngã đã mất phần lớn ký ức và những kỳ quan chúng tạo ra hoặc chứng kiến vào thuở khai sinh Tạo Vật. Dù vậy, vài thoáng ký ức vẫn còn sót lại, và bằng cách tập hợp tín đồ từ nhiều tầng lớp khác nhau, chúng có thể hy vọng lần ra dấu vết và sử dụng những hiện vật và kỹ thuật xưa cũ này để mưu lợi cho mình.\n\n#R Là một Ác Quỷ không đất, ngươi có thể thu thập một ít tri thức mỗi lần công nhận một [cultist|E] mới, tùy theo [learning|E] của ngươi. Tri thức đó sẽ mở khóa nhiều phần thưởng khác nhau. [decision|E] [GetDecision('landless_demon_objective_decision').GetName] cho phép ngươi theo dõi tri thức ngươi đã có được và các phần thưởng liên quan.#!"
 landless_demon_might_gain_clues_tt: "Ngươi có thể thu được tri thức (xem [decision|E] [GetDecision('landless_demon_objective_decision').GetName]) tùy theo [learning|E] của ngươi."
 landless_demon_gain_clues_tt: "Ngươi đã thu được [SCOPE.GetValue('landless_demon_clues_gained')|V0] Tri Thức"

 POD_demon_flavor.6.desc: "Được nâng lên nhờ kỹ năng và lòng dũng cảm phi thường trên chiến trường trong Cuộc Chiến Thiên Giới, các Fell Knight từng phục vụ như lãnh chúa và chư hầu cho những thành viên cấp cao hơn trong Quân Đoàn của họ. Fell Knight thường chỉ huy các toán chiến nhỏ của Ác Quỷ, phục vụ như Nhà Vô Địch cho những Ác Quỷ cấp cao hơn, hoặc canh giữ các Bastion và những nơi khác có hoạt động của Kẻ Sa Ngã.\n\nTục lệ này đã bị thất truyền kể từ khi phe nổi loạn thất bại, cùng với các nghi thức đằng sau việc thăng cấp một ai đó lên vị trí này, nhưng ngươi đã khôi phục đủ những mảnh ký ức rời rạc của tục lệ này mà nhân loại còn lưu giữ để có thể tái lập nó.\n\n #R Vị trí triều đình Fell Knight đã được mở khóa.#!"

 POD_demon_flavor.7.t: "Xây Dựng Crucianomicon"
 POD_demon_flavor.7.desc: "Cách duy nhất để xâm nhập đáng tin cậy vào Ngục Tù Vực Thẳm là biết được Chân Danh của một trong những cư dân của nó, rồi dùng nó cho một nghi thức triệu hồi. Đây là cách giống loài của ngươi đã có thể quay trở lại Trái Đất kể từ buổi bình minh của thuật thờ quỷ.\nDù vậy, đây là một quá trình chậm chạp và khó khăn. Bằng cách xây dựng một kho lưu trữ toàn bộ tri thức rời rạc mà nhân loại thu thập được về thế giới địa ngục, ngươi có thể tinh giản quá trình này và đưa thêm nhiều anh em của ngươi (hy vọng là) biết ơn trở về.\n\n#R Tương tác Triệu Hồi Ác Quỷ được mở khóa (nếu chưa sẵn có). Những ác quỷ được triệu hồi bởi tương tác đó sẽ khởi đầu mạnh mẽ hơn.#!"

 POD_demon_flavor.8.desc: "Nó luôn ở trong tâm trí ngươi. Dù sao thì nó cũng phải ở đâu đó. Một vũ khí ghê tởm như vậy không thể nào chỉ biến mất, nó chỉ cần được tìm ra. Và ngươi đã tìm thấy nó.\n\nDi vật khét tiếng nhất của các Thiên Thần Sa Ngã, thanh trường kiếm đồ sộ này được làm từ một loại kim loại đen xỉn, siyr, kim loại đầu tiên được cả Thiên Thần lẫn Nhân Loại làm chủ sau Sự Sa Ngã.\nĐược rèn ở đỉnh điểm đẫm máu của cuộc chiến, Soultaker là một vũ khí kinh tởm và khủng khiếp. Linh hồn tự nguyện của một ác quỷ — tên hắn đã bị lãng quên từ lâu — bị trói buộc vào khối kim loại đen ấy, nơi hắn có thể vận dụng sức mạnh này lên bất cứ ai bị lưỡi kiếm chạm vào. Vết chạm của thanh kiếm rút cạn năng lượng và sự sống của bất cứ ai nó gây thương tích — và nếu nó giết chết một nạn nhân, linh hồn của người đó sẽ bị kéo ra khỏi xác và giam cầm trong lưỡi kiếm, để rồi bị tra tấn và nuốt chửng bởi con ác quỷ nguyên thủy. Cả người phàm lẫn thiên thần đều gục ngã trước Soultaker, Đức Tin của họ bị xé toạc để nuôi sống hắn.\nRồi người mang kiếm dùng nó để giết một ác quỷ khác, và thanh kiếm thay đổi. Hai linh hồn ác quỷ tranh giành quyền thống trị bên trong lưỡi kiếm, không ai có thể chiếm ưu thế. Theo thời gian, linh hồn của chúng bắt đầu hòa lẫn vào nhau, tạo thành một nhân cách phân mảnh duy nhất. Khi nội chiến giữa các ác quỷ trở nên nghiêm trọng hơn trong cuộc chiến, càng nhiều ác quỷ gục ngã trước Soultaker, và linh hồn của chúng bị hấp thụ vào một thực thể điên loạn duy nhất — một sinh vật tự xưng là Legion. Soultaker bị thất lạc trong những ngày cuối cùng của cuộc chiến, giấu sâu trong một kho vũ khí bị lãng quên, và không có nạn nhân mới để nuốt lấy Đức Tin, Legion trở nên yếu ớt và mỏng manh. Giờ đây nó không thể nghĩ đến điều gì khác ngoài thức ăn — Đức Tin — và nó sẽ làm mọi thứ để nuốt chửng những linh hồn tươi mới một lần nữa."
 
 