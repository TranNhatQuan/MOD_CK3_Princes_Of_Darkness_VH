l_english:
 groom_successor_decision: "Tìm Kiếm Người Kế Vị"
 groom_successor_decision_tooltip: "Đầy tớ của ngươi sẽ đề xuất một số ứng viên phù hợp"
 groom_successor_decision_desc: "[Glossary('Wan Kuei','game_concept_kuei_jin_desc')] không thể $pod_Embrace$ hoặc, hầu hết thời gian, không thể có con một cách tự nhiên. Vì vậy, nếu ngươi không muốn công sức khó nhọc của mình đổ sông đổ bể trong trường hợp xảy ra tai nạn đáng tiếc, ngươi phải chuẩn bị sẵn sàng. Ngươi sẽ yêu cầu đầy tớ của mình đưa ra một số ứng viên phù hợp."
 groom_successor_decision_effect_tooltip: "Ngươi sẽ được giới thiệu một nhóm ứng viên và có thể chấp nhận một người làm con của chính mình với một khoản phí uy vọng"
 groom_successor_decision_confirm: "Bắt đầu tìm kiếm"

 POD_kueijin_become_enlightened_decision: "Đạt Được Giác Ngộ"
 POD_kueijin_become_enlightened_decision_tooltip: "Bước cuối cùng của hành trình Pháp Môn."
 POD_kueijin_become_enlightened_decision_desc: "Ngươi đã gần, rất gần được giải thoát khỏi mọi nghiệp chướng đang ngăn cản ngươi thăng hoa. Ngươi gần như hiểu được cách vận hành của thế giới, Âm và Dương gần như hòa làm một. Hồn và Phách của ngươi gần như ngừng đấu tranh. Thế giới linh hồn và thế giới vật chất gần như là một. Và đã đến lúc cuối cùng hợp nhất tất cả chúng lại với nhau..."
 POD_kueijin_become_enlightened_decision_confirm: "Ta sẽ được tự do"
 POD_kueijin_become_enlightened_decision_deviltigers_religion: "Ngươi phải tra tấn tù nhân 150 lần"
 POD_kueijin_become_enlightened_decision_thousandwhispers_religion: "Ngươi phải đã mất tổng cộng 50 mối quan hệ"
 POD_kueijin_become_enlightened_decision_thrashingdragons_religion: "Ngươi phải có 15 mối quan hệ còn sống"
 POD_kueijin_become_enlightened_decision_flameoftherisingphoenix: "Ngươi phải tổ chức 25 buổi tiệc"
 POD_kueijin_become_enlightened_decision_faceofthegods: "Ngươi phải thắng 25 cuộc chiến"
 POD_kueijin_become_enlightened_decision_inwardway: "Ngươi phải thiền định 50 lần"

 POD_kj_notime: "Ta không có thời gian."
 you_will_get_dharma_10_tt: "Nếu thành công, ngươi sẽ đạt tới đỉnh cao giác ngộ, [Glossary('Dharma','podgloss.dharma')] 10, cho ngươi cơ hội kết thúc ván chơi khi đạt tới [Glossary('Hundred Clouds','podgloss.hundredclouds')]."

 practicing_arts_decision: "Rèn Luyện Nghệ Thuật Của Ngươi"
 practicing_arts_decision_desc: "Giác ngộ không đến nếu thiếu kỷ luật. Như mọi triết lý phương Đông dạy, ngươi phải tôi luyện bản thân về thân, tâm và linh hồn trước khi sương mù có thể tan để mở đường cho ngươi. Rèn luyện khắc nghiệt đốt cháy những ảo tưởng phàm trần; trong trạng thái siêu thoát này, den (hy vọng) sẽ xuất hiện."
 practicing_arts_decision_tooltip: "Ngươi sẽ tập trung thời gian vào việc rèn luyện nghệ thuật."
 practicing_arts_decision_confirm: "Ta muốn rèn luyện nghệ thuật của mình"
 practicing_arts_decision_custom: "#bold Không#! có nghệ thuật [focus|E] tương ứng"

 treking_wilds_decision: "Du Hành Hoang Dã"
 treking_wilds_decision_desc: "Nhiều [Glossary('Wu','podgloss.wu')] thực hành các nghi lễ được truyền lại từ những đêm đầu tiên của [Glossary('Fourth Age','game_concept_fourth_age_desc')]. Một [Glossary('Wu','podgloss.wu')] có thể du hành vào vùng hoang dã bị hengeyokai ám ảnh để thiền định về Huyết Kinh."
 treking_wilds_decision_tooltip: "Ngươi tập trung thời gian để tìm kiếm phiêu lưu."
 treking_wilds_decision_confirm: "Ta muốn du hành vào vùng hoang dã"
 mortal_living_decision: "Sống Giữa Người Phàm"
 mortal_living_decision_desc: "Nhiều [Glossary('Wu','podgloss.wu')] thực hành các nghi lễ được truyền lại từ những đêm đầu tiên của [Glossary('Fourth Age','game_concept_fourth_age_desc')]. Một [Glossary('Wu','podgloss.wu')] có thể sống như người phàm một tháng mỗi năm."
 mortal_living_decision_tooltip: "Ngươi sẽ ghé thăm thế giới người phàm."
 mortal_living_decision_confirm: "Ta muốn sống cùng người phàm"

 POD_kueijin_dharma_lifestyle_spend_decision: "Truy Cầu Tri Thức"
 POD_kueijin_dharma_lifestyle_spend_decision_tooltip: "Tri thức là mục đích, không phải phương tiện"
 POD_kueijin_dharma_lifestyle_spend_decision_desc: "Để hiểu [Glossary('Dharma','podgloss.dharma')] của mình, ngươi cần phải #italic;bold biết#! và còn cách nào tốt hơn là tự cô lập bản thân và nghiên cứu cho đến khi cuối cùng ngươi hiểu hết mọi thứ?"
 POD_kueijin_dharma_lifestyle_spend_decision_confirm: "Đó chính là [Glossary('Dharma','podgloss.dharma')]"

 POD_kueijin_dharma_blood_spend_decision: "Hiến Tế Đẫm Máu"
 POD_kueijin_dharma_blood_spend_decision_tooltip: "Giác ngộ bằng máu"
 POD_kueijin_dharma_blood_spend_decision_desc: "Máu (hay $pod_vitae$ đối với máu đã được biến đổi bằng phép thuật) thực sự là nguồn gốc của mọi thứ. Như [Glossary('Dharma','podgloss.dharma')] của ngươi dạy, chất lỏng đỏ quý giá này là chìa khóa dẫn tới giác ngộ. Đã đến lúc đổ nó ra..."
 POD_kueijin_dharma_blood_spend_decision_confirm: "Một thiên đường đỏ"

 POD_kueijin_dharma_piety_spend_decision: "Hàn Gắn Hai Thế Giới"
 POD_kueijin_dharma_piety_spend_decision_tooltip: "Từ Golconda đến Niết Bàn"
 POD_kueijin_dharma_piety_spend_decision_desc: "Để thực sự hiểu [Glossary('Dharma','podgloss.dharma')] của mình, trước tiên ngươi phải hiểu chính mình và vị trí của mình trong thế giới này. Du hành, giảng dạy và lắng nghe cho đến khi cả Tây lẫn Đông không còn bí ẩn nào với ngươi."
 POD_kueijin_dharma_piety_spend_decision_confirm: "Đức Tin là như vậy"