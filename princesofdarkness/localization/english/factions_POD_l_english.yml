l_english:
 
 #Hunter
 hunter_faction: "Tiểu Trừ Tòa Dị Giáo"
 hunter_faction_desc: "Những lãnh chú siêu nhiên quá lộ liễu và quá ít thận trọng có nguy cơ thu hút sự chú ý của Tòa Dị Giáo."
 hunter_faction_short_effect_desc: "Muốn giải thoát dân chúng của người khỏi... á, khỏi chính người."
 hunter_faction_every_county: "Mọi quận trong liên minh"
 FACTION_DEMAND_HUNTER: "Gửi [ROOT.Char.Custom('InsultAdjective')] [ROOT.Char.GetTitledFirstName]"
 FACTION_DEMAND_HUNTER_DESC: "Hồn ma quỷ địa ngục kia, chúng ta đã phát hiện sự can thiệp của ngươi vào cuộc sống chúng ta. Từ nay ngươi sẽ thấy chúng ta chuẩn bị kỹ lưỡng hơn nhiều để đối phó với sự can thiệp của ngươi."
 FACTION_DEMAND_HUNTER_ACCEPT: "Điều này sẽ cản trở ảnh hưởng của ta tại địa phương."
 #FACTION_DEMAND_HUNTER_REFUSE: "Never! Let's crush these glorified mortals in battle!"
 FACTION_HUNTER_NAME: "Chi Nhánh Tòa Dị Giáo"
 FACTION_HUNTER_TITLE_NAME: "Chi Nhánh Tòa Dị Giáo"
 hunter_faction_event_troops: "Inquisitorium Militum"
 pod_factions.1103.t: "Ngươi đã thất bại!"
 pod_factions.1103.desc: "Dù ngươi đã kịch liệt phòng thủ, những thợ săn đã áp đảo phần lớn lãnh địa của ngươi, nhổ tận gốc mạng lưới ảnh hưởng ngươi dày công xây dựng khắp nơi. Uy danh của ngươi bị tổn hại nặng nề, quyền uy xuống ở mức thấp chưa từng có. Lũ kến đang dòm ngó... và những thợ săn có thể quay lại bất cứ lúc nào. Ngươi có thể bò dậy từ sự sụp đổ này, nhưng cái giá sẽ rất đắt đỏ. Bởi vậy, giấc ngủ vạn niên trở thành một viễn cảnh hấp dẫn khó cưỡng lại. Dù sao thì thời gian cũng đâu còn ý nghĩa gì..."
 pod_factions.1103.a: "Ta sẽ quay trở lại"
 pod_factions.1103.b: "Ta vẫn chưa xong chuyện!"
 POD_factions_county_loss_modifier: "Khởi Nghĩa Dân Chúng"
 POD_factions_county_loss_modifier_desc: "Dân chúng đang chống lại ảnh hưởng này trong khu vực một cách có tổ chức."
 
 
 