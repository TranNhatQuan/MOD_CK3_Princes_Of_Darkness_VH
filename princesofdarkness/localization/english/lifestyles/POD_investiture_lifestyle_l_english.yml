 TARGET_GAINS_INVESTITURE_LIFESTYLE_XP: "[CHARACTER.GetShortUIName] đạt được $VALUE|V0$ Kinh Nghiệm [investiture_lifestyle|E]"
 TARGET_GAINED_INVESTITURE_LIFESTYLE_XP: "[CHARACTER.GetShortUIName] đã đạt được $VALUE|V0$ Kinh Nghiệm [investiture_lifestyle|E]"

 GAINS_A_INVESTITURE_LIFESTYLE_PERKPOINT: "Đạt được $VALUE|V0$ [perk|E] [investiture_lifestyle|E]"
 GAINED_A_INVESTITURE_LIFESTYLE_PERKPOINT: "Đã đạt được $VALUE|V0$ [perk|E] [investiture_lifestyle|E]"
 I_GAIN_A_INVESTITURE_LIFESTYLE_PERKPOINT: "Bạn đạt được $VALUE|V0$ [perk|E] [investiture_lifestyle|E]"
 I_GAINED_A_INVESTITURE_LIFESTYLE_PERKPOINT: "Bạn đã đạt được $VALUE|V0$ [perk|E] [investiture_lifestyle|E]"
 TARGET_GAINS_A_INVESTITURE_LIFESTYLE_PERKPOINT: "[CHARACTER.GetShortUIName] đạt được $VALUE|V0$ [perk|E] [investiture_lifestyle|E]"
 TARGET_GAINED_A_INVESTITURE_LIFESTYLE_PERKPOINT: "[CHARACTER.GetShortUIName] đã đạt được $VALUE|V0$ [perk|E] [investiture_lifestyle|E]"

