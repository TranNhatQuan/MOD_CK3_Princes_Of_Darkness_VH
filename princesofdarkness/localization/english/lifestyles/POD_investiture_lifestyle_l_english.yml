 demonic_investment_visible: "Ân Tứ Ma Quỷ"

 INVESTITURE_COST_EFFECT: "#clickable [perk|E] này tốn $VALUE|V0$ [Select_CString( EqualTo_CFixedPoint( '(CFixedPoint)$VALUE|q$', '(CFixedPoint)1' ), 'điểm thiên phú', 'điểm thiên phú' )]#!"
 INVESTITURE_STACKING_EFFECT: "#clickable [perk|E] này có thể mua nhiều lần.#!"
 INVESTITURE_VISUAL_CHANGE_EFFECT: "#N [perk|E] này sẽ thay đổi ngoại hình của bạn vĩnh viễn!#!"

 investiture_armor_perk_name: "Áo Giáp #low ([ROOT.Char.MakeScope.ScriptValue('POD_investiture_armor_perk_modifier_stacks')])#!"
 investiture_backgrounds_perk_name: "Xuất Thân #low ([ROOT.Char.MakeScope.ScriptValue('POD_investiture_backgrounds_perk_modifier_stacks')])#!"
 investiture_demonic_strength_perk_name: "Sức Mạnh Ma Quỷ #low ([ROOT.Char.MakeScope.ScriptValue('POD_investiture_demonic_strength_perk_modifier_stacks')])#!"
 investiture_longevity_perk_name: "Trường Thọ #low ([ROOT.Char.MakeScope.ScriptValue('POD_investiture_longevity_perk_modifier_stacks')])#!"
 investiture_service_perk_name: "Phụng Sự #low ([ROOT.Char.MakeScope.ScriptValue('POD_investiture_service_perk_modifier_stacks')])#!"

 INVESTITURE_ARMOR_PERK_EFFECT: "#flavor Như một con quỷ, kẻ thờ ma này có làn da đầy vảy, những mụn cóc dày cộp, lớp da thuộc, hoặc một hình thức bảo vệ gớm ghiếc khác.#!"
 INVESTITURE_BACKGROUNDS_PERK_EFFECT: "#flavor Một số #TOOLTIP:GAME_TRAIT,witch,[GetNullCharacter] #L Tà Đạo Sĩ#!#! lại thích sự trợ giúp... tinh tế hơn từ chủ nhân của mình. Và những mối quan hệ phù hợp cho những nhu cầu như vậy.#!"
 INVESTITURE_DEMONIC_STRENGTH_PERK_EFFECT: "#flavor Sinh lực tà ác tràn vào tứ chi của kẻ khấn cầu. Từ khoảnh khắc này cho đến khi chết, nàng sở hữu sức mạnh thể chất của một tiểu quỷ.#!"
 INVESTITURE_LONGEVITY_PERK_EFFECT: "#flavor Hầu hết #TOOLTIP:GAME_TRAIT,witch,[GetNullCharacter] #L Tà Đạo Sĩ#!#! đều sợ chết. Và việc hiến tế một chút những kẻ vô tội để kéo dài mạng sống của bản thân rất phù hợp với mục đích đó.#!"
 INVESTITURE_SERVICE_PERK_EFFECT: "#flavor Trong một sự trớ trêu đáng để Địa Ngục ghi nhận, một nô lệ của Vực Sâu lại có thể 'mua' nô lệ từ Vực Sâu. Những sinh vật bị trói buộc này xuất hiện bên cạnh [GetTrait('witch').GetName(GetPlayer)] và hỏi, 'Chủ nhân, ngài muốn gì?' Chắc hẳn, hắn đã có sẵn vài nhiệm vụ....#!"
 INVESTITURE_SERVICE_PERK_IMPS_EFFECT: "Mở khóa [GetMaA('imps').GetName] như [men_at_arms|E]."
 INVESTITURE_SERVICE_PERK_MALEBRANCHE_EFFECT: "Mở khóa [GetMaA('malebranche').GetName] như [men_at_arms|E]."
 INVESTITURE_SERVICE_PERK_LUCIFERGIA_EFFECT: "Mở khóa [GetMaA('lucifergia').GetName] như [men_at_arms|E]."
 INVESTITURE_SERVICE_PERK_WAR_SERVITORS_EFFECT: "Mở khóa [GetMaA('war_servitors').GetName] như [men_at_arms|E]."
 INVESTITURE_SERVICE_PERK_HINT_EFFECT: "#italic (Có thể mở khóa thêm các loại quân bằng cách đầu tư thêm điểm [perk|E])#!"

 investiture_claws_and_horns_perk_name: "Vuốt và Sừng"
 investiture_goat_feet_perk_name: "Chân Dê"
 investiture_panpipe_voice_perk_name: "Giọng Sáo Thần"

 INVESTITURE_CLAWS_AND_HORNS_PERK_EFFECT: "Gây [GetPlayer.MakeScope.ScriptValue('POD_investiture_claws_and_horns_perk_damage')] [POD_superficial_damage_with_box|E] lên [knights|E] địch khi làm [commander|E] trong [combat_phase|E], hoặc lên đối thủ trong [single_combat_duel_plural|E].\n#flavor Vuốt hoặc sừng mọc ra từ thân thể kẻ khấn cầu, tạo nên một hình dạng phi nhân.#!"
 INVESTITURE_GOAT_FEET_PERK_EFFECT: "#flavor Sau khi hôn Chủ Nhân của mình (đừng hỏi ở đâu), một Tà Đạo Sĩ có được đôi chân móng chẻ của Ác Quỷ. Sau quá trình biến đổi đau đớn tận cùng này (kéo dài vài phút), Tà Đạo Sĩ có thể chạy nhanh hơn người thường; và đá hay giày xéo kẻ địch bằng móng guốc.#!"
 INVESTITURE_PANPIPE_VOICE_PERK_EFFECT: "Gây 25 [static_stress|E] lên [knights|E] địch khi làm [commander|E] trong [combat_phase|E], hoặc lên đối thủ trong [single_combat_duel_plural|E].\n#flavor Chỉ bằng lời nói hay tiếng hát đơn giản, một ả đàn bà đã bán linh hồn có thể mê hoặc khán giả của mình. Một khi đã bị mê hoặc, nạn nhân đánh mất bản tính tốt đẹp; họ trở nên dục vọng, gần như say sưa trong tính khí.#!"

 investiture_beast_form_perk_name: "Dạng Thú"
 investiture_hellfire_perk_name: "Lửa Địa Ngục"
 investiture_invulnerability_perk_name: "Bất Khả Xâm Phạm"
 investiture_serpent_skin_perk_name: "Da Rắn"
 investiture_wings_perk_name: "Cánh"

 INVESTITURE_BEAST_FORM_PERK_EFFECT: "Mở khóa nhiều dạng biến hình thú vật khác nhau.\n#flavor Bằng cách kêu gọi Bổn Mạng của mình, một kẻ thờ ma có thể biến thành một trong những loài thú nhỏ bé hơn (chuột, mèo, sói, v.v.).#!"
 INVESTITURE_HELLFIRE_PERK_EFFECT: "Gây [GetPlayer.MakeScope.ScriptValue('POD_investiture_hellfire_perk_damage')] [POD_aggravated_damage_with_box|E] hỏa lên [knights|E] địch khi làm [commander|E] trong [combat_phase|E], hoặc lên đối thủ trong [single_combat_duel_plural|E].\n#flavor Như một con rồng mang hình người, kẻ bán linh hồn này có thể phun ra những luồng lửa lên kẻ địch. Những đòn tấn công khác có thể bao gồm mật dịch ăn mòn, máu nóng, nội tạng bốc lửa, hoặc những chất kinh tởm khác.#!"
 INVESTITURE_INVULNERABILITY_PERK_EFFECT: "#flavor Vũ khí của người thường bật ra khỏi da của Tà Đạo Sĩ mà chẳng gây tác dụng gì đáng kể.#!"
 INVESTITURE_SERPENT_SKIN_PERK_EFFECT: "Như một [character_interaction|E], trốn khỏi [prison|E] với giá là [GetPlayer.MakeScope.ScriptValue('POD_investiture_serpent_skin_perk_damage')] [POD_superficial_damage_with_box|E].\n#flavor Bắt chước loài rắn một cách ghê rợn, Tà Đạo Sĩ có thể lột da của mình theo đúng nghĩa đen để thoát khỏi xiềng xích.#!"
 INVESTITURE_WINGS_PERK_EFFECT: "#flavor Khi thốt ra một câu lệnh phạm thượng, kẻ khấn cầu mọc ra những cánh quỷ dữ khủng khiếp từ giữa hai bả vai.#!"

 investiture_devils_eyes_perk_name: "Mắt Ác Quỷ"
 investiture_apportation_perk_name: "Thuật Di Vật"
 investiture_awareness_perk_name: "Tri Giác"
 investiture_luciferian_charm_perk_name: "Sức Hút Luciferian"
 investiture_master_of_the_domain_perk_name: "Chủ Nhân Lãnh Địa"

 INVESTITURE_DEVILS_EYES_PERK_EFFECT: "Như một [character_interaction|E], tạo ra một [epidemic|E] tại vị trí hiện tại của mục tiêu.\n#flavor Chỉ bằng một cái nhìn, một Tà Đạo Sĩ có thể làm hỏng sữa, làm mục ngũ cốc và khiến trẻ nhỏ đổ bệnh. Dù quyền năng của cặp Mắt này vô dụng trước người lớn (những người chỉ cảm thấy khó chịu dưới ảnh hưởng của nó, dù vậy), nó vẫn có thể tàn phá cả một ngôi làng bằng cách phá hủy lương thực dự trữ ngay trước mùa đông.#!"
 INVESTITURE_APPORTATION_PERK_EFFECT: "Như một [character_interaction|E], đánh cắp [artifact|E] của mục tiêu với giá 2 điểm [perk|E] [investiture_lifestyle|E].\n#flavor Với 'ân huệ' này, kẻ tìm kiếm địa ngục có thể phù chú lên một vật thể duy nhất, ràng buộc nó với bản thân. Từ lúc được phù chú, nàng có thể triệu hồi vật đó từ bất cứ nơi nào trong thế giới người thường (nhưng không thể xuyên qua Rào Chắn). Vật đó phải nhỏ và nhẹ đủ để cầm trong một tay, nhưng có thể là bất cứ thứ gì, có phép thuật hay không.#!"
 INVESTITURE_AWARENESS_PERK_EFFECT: "#flavor Với một cơn chấn động tâm trí khủng khiếp, con quỷ mở toang cánh cửa của nhận thức huyền bí, cho Tà Đạo Sĩ hiểu biết bản năng về những bí mật xung quanh họ.#!"
 INVESTITURE_LUCIFERIAN_CHARM_PERK_EFFECT: "#flavor Đúng nghĩa một ác quỷ mê hoặc, một Tà Đạo Sĩ với Sắc Phong này có thể thoát khỏi hầu như bất cứ điều gì. Bất kể hắn nói hay làm gì, hắn cũng khiến tất cả những ai gặp hắn phải kinh ngạc.#!"
 INVESTITURE_MASTER_OF_THE_DOMAIN_PERK_EFFECT: "#flavor Chủ Nhân của một Tà Đạo Sĩ trao cho họ một 'ân huệ' cho phép họ luôn biết được điều gì đang xảy ra trong phạm vi 500 feet trong lãnh địa của nàng, như thể họ đang quan sát từ trên cao.#!"

 investiture_sign_of_the_inferno_perk_name: "Dấu Ấn Địa Ngục"
 investiture_uncanny_beauty_perk_name: "Vẻ Đẹp Dị Thường"
 investiture_teleportation_perk_name: "Dịch Chuyển"
 investiture_invisibility_to_animals_perk_name: "Vô Hình Trước Thú Vật"

 INVESTITURE_SIGN_OF_THE_INFERNO_PERK_EFFECT: "Trở nên miễn nhiễm với lửa.\n#flavor Được Địa Ngục hôn lên, kẻ theo tà đạo này không cần sợ ngọn lửa nữa. Không sức nóng hay lửa nào có thể làm hại hắn dưới bất kỳ hình thức nào; nó có thể thiêu rụi trang phục và tài sản của hắn, nhưng không thể để lại vết sẹo trên da hắn.#!"
 INVESTITURE_UNCANNY_BEAUTY_PERK_EFFECT: "#flavor Cám dỗ thường mang một vẻ huy hoàng đáng sợ. Đổi lấy một hay hai tội lỗi, kẻ khấn cầu có được một vẻ đẹp phi trần, không thể cưỡng lại.#!"
 INVESTITURE_TELEPORTATION_PERK_EFFECT: "Như một [character_interaction|E], cho phép bạn dịch chuyển quân đội của mình đến vị trí của mục tiêu, hoặc dịch chuyển đến điểm đến kế tiếp khi đang di chuyển.\n#flavor Khi nhu cầu phải có mặt ở mọi nơi cùng lúc trở nên không thể chịu đựng được với một Tà Đạo Sĩ, Chủ Nhân địa ngục của họ có thể trao cho họ một quyền năng đáp ứng nhu cầu đó, nhưng hãy nhớ rằng không có ân huệ nào là miễn phí.#!"
 INVESTITURE_INVISIBILITY_TO_ANIMALS_PERK_EFFECT: "Gây [modifier|E] [GetModifier('POD_investiture_invisibility_to_animals_perk_modifier').GetNameWithTooltip] lên [ruler|E] địch khi làm [commander|E] trong [combat_phase|E].\n#flavor Khí chất của Tà Đạo Sĩ khủng khiếp đến mức mọi loài thú cảm nhận được họ đều lập tức xóa bỏ trí nhớ ấy.#!"

 investiture_bond_breaking_perk_name: "Phá Vỡ Ràng Buộc"
 investiture_shameful_sight_perk_name: "Cái Nhìn Xấu Hổ"
 investiture_journey_to_the_spirit_realm_perk_name: "Hành Trình Đến Cõi Linh Hồn"

 INVESTITURE_BOND_BREAKING_PERK_EFFECT: "Như một [character_interaction|E], khiến mục tiêu mất hết [hooks|E] mà họ sở hữu.\n#flavor Bàn tay của Surgat dẫn dắt Tà Đạo Sĩ này; những chiếc khóa, dây trói hay ràng buộc thông thường tự mở ra khi nàng vuốt lên chúng.#!"
 INVESTITURE_SHAMEFUL_SIGHT_PERK_EFFECT: "#flavor Nhìn thẳng vào mắt một người, một Tà Đạo Sĩ có thể nhận ra những tội lỗi gần với mặt nổi nhất. Trong 'con mắt nội tâm' của Tà Đạo Sĩ, một hình ảnh của hành vi đó hiện lên, rõ như ban ngày. Nàng có thể quyết định giữ hình ảnh đó cho riêng mình để dùng sau, cười nhạo nó công khai, hoặc hành hạ nạn nhân bằng một hình ảnh về nó.#!"
 INVESTITURE_JOURNEY_TO_THE_SPIRIT_REALM_PERK_EFFECT: "#flavor Bằng cách lột bỏ da và thịt như thể chúng chỉ là quần áo, một Tà Đạo Sĩ có thể từ bỏ thân xác trong một ngày, cho phép họ được tiếp cận bề mặt của Umbra.#!"

 investiture_mammons_gift_perk_name: "Ân Huệ Của Mammon"
 investiture_talons_of_the_plague_crow_perk_name: "Móng Vuốt Của Quạ Dịch Bệnh"
 investiture_army_of_the_damned_perk_name: "Đội Quân Của Những Kẻ Bị Đọa Đày"

 INVESTITURE_MAMMONS_GIFT_PERK_EFFECT: "Như một [character_interaction|E], biến một [artifact|E] thành [gold_i]250 [gold|E].\n#flavor Mỗi đêm một lần, Tà Đạo Sĩ có thể biến một vật thể vô tri nhỏ thành vàng. (Không, những sinh vật bất tử không được tính là 'vật thể vô tri'.)#!"
 INVESTITURE_TALONS_OF_THE_PLAGUE_CROW_PERK_EFFECT: "Như một [character_interaction|E], đạt được [GetModifier('POD_talons_of_the_plague_crow_modifier').GetNameWithTooltip] trong 4 năm.\n#flavor Một Tà Đạo Sĩ có thể theo lệnh kéo dài bàn tay thành móng vuốt chim, khiến mọi hành động phi chiến đấu trở nên khó khăn hơn nhiều nhưng lại tạo ra một vũ khí địa ngục hủy diệt hàng loạt.#!"
 INVESTITURE_ARMY_OF_THE_DAMNED_PERK_EFFECT: "Như một [character_interaction|E], triệu hồi một đội quân gồm 250 [GetMaA('demons').GetName] trong suốt thời gian của một [war|E].\n#flavor Từ hố sâu chúng đến và vào hố sâu chúng sẽ ném kẻ địch của mình.#!"

 investiture_relentless_perk_name: "Không Ngừng Nghỉ"
 investiture_regeneration_perk_name: "Tái Sinh"

 INVESTITURE_RELENTLESS_PERK_EFFECT: "#flavor Chính sức mạnh của Địa Ngục thúc đẩy Tà Đạo Sĩ hướng đến mục tiêu của họ, bất kể vết thương, bất kể trở ngại. Tà Đạo Sĩ sẽ đến được nơi họ muốn.#!"
 INVESTITURE_REGENERATION_PERK_EFFECT: "Hồi phục mỗi năm một lần thay vì mỗi 2 năm.\nCho phép khả năng tự lành tự nhiên với $POD_splat_vampire_plural$.\n#flavor Một trong những “ân huệ” vĩ đại nhất từng được trao cho người thường, Sắc Phong này cho phép một Tà Đạo Sĩ tự phục hồi sức khỏe chỉ bằng một nỗ lực ý chí đơn thuần!#!"

