l_english:
 game_concept_investiture_lifestyle: "Sắc Phong"
 game_concept_investiture_lifestyle_desc: "#bold Sắc Phong#! là những năng lực phạm thượng của #TOOLTIP:GAME_TRAIT,witch,[GetNullCharacter] #L Tà Đạo Sĩ#!#!: những kẻ thông đồng với $POD_splat_demon_plural$. Vẻ đẹp, quyền lực, trường thọ và còn nhiều hơn nữa đang chờ đợi những ai sẵn lòng làm ô uế linh hồn mình.\n\nCó hai cách để đạt được Sắc Phong: hoặc ký kết [demonic_pact|E] với một Quỷ để bước vào [thralldom|E], hoặc [diabolism_binding|E] một Quỷ để cướp lấy quyền năng của nó bằng vũ lực. Cả hai cách đều đòi hỏi trước tiên phải có kiến thức về [GetTrait('demonology').GetName(GetNullCharacter)], có thể học được qua [journey|E].\n\nTà Đạo Học bị xem là [crime|E] bởi tất cả trừ những [faiths|E] tàn ác nhất."

 investiture_lifestyle_name: "Sắc Phong"
 investiture_lifestyle_desc: "Tập trung vào những năng lực được Quỷ trao tặng."
 monthly_investiture_lifestyle_xp_gain_mult: "[lifestyle|E] [experience|E] Sắc Phong Hàng Tháng"

 demonic_investment_focus: "Chú Trọng Ân Tứ Ma Quỷ"
 demonic_investment_focus_modifier: "[GetFocus('demonic_investment_focus').GetName]"
 demonic_investment_focus_desc: "#X Điểm [perk|E] [lifestyle|E] [investiture_lifestyle|E] #bold CHỈ#! có thể đạt được qua [demonic_pacts|E] hoặc [diabolism|E].#!"
 demonic_investment_focus_effect_desc: "Không thể tập trung vào lối sống này."

 investments_of_soul_focus: "Chú Trọng Ân Tứ Của Linh Hồn"
 investments_of_soul_focus_modifier: "[GetFocus('investments_of_soul_focus').GetName]"
 investments_of_soul_focus_desc: "Ân huệ của [Glossary('Diêm Ma Vương','podgloss.yamaking')]."
 investments_of_soul_focus_effect_desc: "Chú trọng vào Ân Tứ Của Linh Hồn sẽ mang lại:"

 GAINS_INVESTITURE_LIFESTYLE_XP: "Đạt được $VALUE|V0$ Kinh Nghiệm [investiture_lifestyle|E]"
 GAINED_INVESTITURE_LIFESTYLE_XP: "Đã đạt được $VALUE|V0$ Kinh Nghiệm [investiture_lifestyle|E]"
