 investments_of_soul_visible: "Ân Tứ Của Linh Hồn"

 NEEDS_COMMUNE_WITH_THE_YAMA_KINGS_TEXT: "@warning_icon!#X Bạn cần thông linh với [Glossary('Diêm Ma Vương','podgloss.yamaking')] đang ở tại [umbra|E] - [UmbraGlossary('yomi_wan')] để mở khóa thiên phú này.#!"
 NEEDS_BE_CHI_USER_FOR_FOCUS_TEXT: "@warning_icon!#X Bạn cần phải là người sử dụng chi để chọn hướng chú trọng này#!\n"

 mask_of_yomi_perk_name: "Mặt Nạ Của Yomi"
 black_whispers_perk_name: "Lời Thì Thầm Đen Tối"
 ebon_fountain_perk_name: "Đài Phun Bóng Tối"
 luck_of_yomi_perk_name: "May Mắn Của Yomi"
 savage_kiss_perk_name: "Nụ Hôn Man Dại"
 union_of_oppositions_perk_name: "Hợp Nhất Đối Nghịch"
 iron_hands_perk_name: "Bàn Tay Sắt"
 breath_of_knowledge_perk_name: "Hơi Thở Của Tri Thức"
 touch_of_yama_kings_perk_name: "Cái Chạm Của [Glossary('Diêm Ma Vương','podgloss.yamaking')]"
 unfolding_scarlet_lotus_perk_name: "Hoa Sen Đỏ Hé Nở"

 MASK_OF_YOMI_PERK_EFFECT: "Trait [GetTrait('witch').GetName( GetPlayer )] sẽ tự động bị ẩn khi bị phát hiện\nHoàn lại mọi thay đổi ngoại hình cưỡng ép do Sắc Phong\n#F Ân Tứ của nhân vật không còn để lộ dấu hiệu nhận biết nữa. Không một sự dò xét tâm trí, nhìn thấu linh hồn hay cảm nhận sự thật nào có thể xác định được rằng nhân vật là [akuma|E] hay ép nàng phải phản bội những hoạt động bất chính của mình.#!"
 BLACK_WHISPERS_PERK_EFFECT: "Như một [character_interaction|E], cho phép bạn biết được mọi bí mật và âm mưu của mục tiêu.\n#F Gián điệp của [Glossary('Diêm Ma Vương','podgloss.yamaking')] có mặt ở mọi nơi, và những gì [akuma|E] của chúng không thấy không nghe được, thuộc hạ linh hồn của chúng sẽ biết.#!"
 EBON_FOUNTAIN_PERK_EFFECT: "Bạn giảm 10 [stress|E] mỗi tháng\n#F P'o của nhân vật được kết nối với một mạch nguồn quyền năng ma quỷ.#!"
 LUCK_OF_YOMI_PERK_EFFECT: "Như một [decision|E], cho phép bạn dùng điểm Sắc Phong để đạt được vàng và uy tín. Nếu bạn đã mở khóa quyết nghị này, nó sẽ thưởng nhiều vàng hơn.\n#F Các Yama-king thay đổi vận số của nhân vật, và vận may mỉm cười với [akuma|E] nhờ đó.#!"
 SAVAGE_KISS_PERK_EFFECT: "#F Linh hồn của nhân vật phải chịu sự vuốt ve của Mukade.#!"
 UNION_OF_OPPOSITIONS_PERK_EFFECT: "#F [Glossary('Diêm Ma Vương','podgloss.yamaking')] đặt tay lên nhân vật và hắn được tái tạo lại.#!"
 IRON_HANDS_PERK_EFFECT: "#F Giờ đây nhân vật di chuyển với sức mạnh của [Glossary('Diêm Ma Vương','podgloss.yamaking')] ở phía sau nàng.#!"
 BREATH_OF_KNOWLEDGE_PERK_EFFECT: "#F [Glossary('Diêm Ma Vương','podgloss.yamaking')] thì thầm tri thức của chúng vào tai nhân vật, và nó cháy trong tâm trí hắn như sắt nung trắng.#!"
 TOUCH_OF_YAMA_KINGS_PERK_EFFECT: "#F Cái chạm của [UmbraGlossaryLocalized('yomi_wan','Địa Ngục Yomi')] đang ở trên nhân vật.#!"
 UNFOLDING_SCARLET_LOTUS_PERK_EFFECT: "Bỏ qua yêu cầu cấp độ [Glossary('Pháp Môn','podgloss.dharma')] khi chọn thiên phú nghệ thuật.\n#F Tà Linh thì thầm với nhân vật những bí mật về trạng thái siêu thoát của chúng.#!"
