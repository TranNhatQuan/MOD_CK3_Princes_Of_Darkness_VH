 ANIMAL_CONTROL_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn trực tiếp nhận một con vật cưng.\nLà một [character_interaction|E], cho phép bạn gọi vật cưng của mình ra chiến trận.\nCó thể tuyển mộ nhiều loại động vật làm [men_at_arms|E].\n#F Điều Khiển Thú Vật cho phép người sử dụng khả năng gọi và điều khiển các con vật trong tầm khi Sức Mạnh được sử dụng.#!"
 AURA_OF_TRANQUILITY_PERK_EFFECT: "Áp [modifier|E] [GetModifier('aura_of_tranquility_perk_modifier').GetNameWithTooltip] lên [knights|E] địch khi đóng vai [commander|E] trong [combat_phase|E], hoặc lên đối thủ của bạn trong [single_combat_duel_plural|E].\n#F Nhân vật tỏa ra một hào quang bình yên (trong trường hợp Kami) hoặc hài hòa (trong trường hợp Drone) khiến bất kỳ ai trong khu vực đều dịu lại. #!"
 BERSEKER_PERK_EFFECT: "Giờ có thể thực hiện đòn tấn công cuồng chiến trong [combat_phase|E] với vai [knight|E].\n#F Vật chủ được truyền đầy Cuồng Nộ (Rage) giống như một werewolf, với đầy đủ ưu và nhược điểm kèm theo.#!"
 BESTIAL_MUTATION_PERK_EFFECT: "Mở khóa tùy chọn biến hình [GetModifier( 'POD_shapeshift_form_bestial_mutation_modifier' ).GetNameWithTooltip|L].\n#F Thân xác vật chủ không còn có thể nhận ra là người hay thú; nó đã méo mó và biến dạng thành một phiên bản thô kệch, nhái lại hình dạng cũ, hoàn toàn không thể giả làm gì khác ngoài một con quái vật siêu nhiên.#!"
 BULKY_PERK_EFFECT: "Mở khóa tùy chọn biến hình [GetModifier( 'POD_shapeshift_form_giant_modifier' ).GetNameWithTooltip|L].\n#F Thân xác vật chủ của nhân vật to lớn và chắc chắn bất thường, mang lại thêm một mức độ bền bỉ.#!"
 BODY_EXPANSION_PERK_EFFECT: "Mở khóa tùy chọn biến hình [GetModifier( 'POD_shapeshift_form_body_expansion_modifier' ).GetNameWithTooltip|L].\n#F Nhân vật có khả năng tăng kích thước lên tới ba lần chiều cao bình thường trong một thời gian ngắn.#!"
 BRAIN_EATING_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn hấp thụ đặc điểm thông minh của một tù nhân để nhận xp phong cách sống.\n#F Fomor có thể hấp thụ năng lực tinh thần của mục tiêu chỉ bằng một cái chạm, và dùng nó để học hỏi.#!"
 CHAOS_ENGINE_PERK_EFFECT: "Áp [modifier|E] [GetModifier('chaos_engine_perk_modifier').GetNameWithTooltip] lên [commanders|E] địch khi đóng vai [commander|E] trong [combat_phase|E].\n#F Một gorgon có khả năng này là hiện thân biết đi của hỗn loạn, thuần túy và đơn giản. Chỉ riêng sự hiện diện của hắn đã mang đến rối loạn và thay đổi cho những vật thể và sự kiện xung quanh.#!"
 STASIS_ENGINE_PERK_EFFECT: "Áp [modifier|E] [GetModifier('stasis_engine_perk_modifier').GetNameWithTooltip] lên [commanders|E] địch khi đóng vai [commander|E] trong [combat_phase|E].\n#F Các trục tự sắp lại, vật thể cố định vào chỗ, và những thứ có vẻ lệch pha được đưa vào hòa hợp với môi trường xung quanh.#!"
 COMMAND_THE_EARTH_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn tung ra các hiệu ứng thời tiết thù địch lên các vương quốc địch.\n#F Nhân vật có khả năng ép buộc chính mặt đất phải nghe lệnh, tạo ra các địa hình mới, hút kẻ địch xuống các vũng cát lún, và tương tự.#!"
 CURSE_OF_GAIA_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn áp lên địch [GetModifier( 'mild_curse_of_gaia_modifier' ).GetNameWithTooltip|L], [GetModifier( 'moderate_curse_of_gaia_modifier' ).GetNameWithTooltip|L], [GetModifier( 'severe_curse_of_gaia_modifier' ).GetNameWithTooltip|L] hoặc  [GetModifier( 'very_severe_curse_of_gaia_modifier' ).GetNameWithTooltip|L].\n#F Kami có thể giáng lời nguyền của chính Gaia lên kẻ phạm lỗi, trừng phạt những ai làm gián đoạn ý chí của Người hoặc sự cân bằng của thế giới tự nhiên. Những lời nguyền nhỏ có thể biểu hiện thành vận xui liên tục, các cơn trầm cảm hoặc các tình trạng thể chất đáng xấu hổ (như rụng tóc hay mùi hôi nồng nặc); những lời nguyền lớn có thể biến kẻ phạm lỗi thành đá, gây cho hắn một bệnh suy nhược hoặc thậm chí khiến mặt đất nuốt chửng hắn.#!"
 CYBERSENSES_PERK_EFFECT: "#F [Select_CString( GetScriptedGui('is_modern').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).End), 'Cho phép người dùng thay thế giác quan của chính mình bằng giác quan của máy — radar, quét hồng ngoại, hoặc tương tự.', '')]#!"
 DEVOUR_PERK_EFFECT: "Tăng thêm cơ hội gây một đòn tàn sát tàn bạo lên [knights|E] địch khi trong [combat_phase|E] với vai [knight|E].\n#F Nhân vật có thể banh rộng miệng và nuốt các vật thể lớn cỡ một con chó vừa hoặc một người nhỏ. Bất kỳ ai bị nuốt như vậy sẽ bị tiêu hóa như thức ăn, chỉ những vật liệu thực sự không thể tiêu hóa được thải ra (như xương, giày hoặc kính).#!"
 DISPERSION_PERK_EFFECT: "Mở khóa tùy chọn biến hình [GetModifier( 'POD_shapeshift_form_swarm_modifier' ).GetNameWithTooltip|L].\n#F Sức mạnh này, một trong những thay đổi lộ liễu nhất mà một linh hồn có thể tạo ra, cho phép vật chủ tách cơ thể mình thành nhiều phần nhỏ hơn, mỗi phần đều sống đầy đủ và có ý thức của "chủ nhân". Hầu hết trông giống các con vật nhỏ như chuột hoặc rắn, dù một số gorgon đặc biệt kỳ lạ được biết là đột nhiên phân tán thành nhiều thực thể khác nhau cùng lúc.#!"
 ELECTRICAL_FIELD_PERK_EFFECT: "Tăng thêm cơ hội gây một đòn tàn sát tàn bạo lên [knights|E] địch khi trong [combat_phase|E] với vai [knight|E].\n#F Nhân vật có thể tạo ra một trường điện mạnh gây điện giật cho bất kỳ ai tiếp xúc với cơ thể hắn. Dòng điện có thể là AC hoặc DC tùy loại, với hiệu ứng tương ứng (thổi bay mục tiêu ra xa nhân vật, hoặc khiến các cơ của họ cứng lại).#!"
 ENCHANTING_VOICE_PERK_EFFECT: "Áp [modifier|E] [GetModifier('enchanting_voice_perk_modifier').GetNameWithTooltip] lên [commanders|E] địch khi đóng vai [commander|E] trong [combat_phase|E].\n#F Nhân vật có thể mê hoặc người nghe bằng tiếng hát của mình (hoặc trong trường hợp Drone, bằng giọng nói êm dịu kỳ lạ).#!"
 ENTROPIC_TOUCH_PERK_EFFECT: "#F Chỉ bằng một cái chạm, nhân vật có thể tạm thời làm suy yếu cấu trúc vật lý của một vật thể, hoặc thậm chí của một sinh vật sống.#!"
 EXTENSIBLE_LIMB_PERK_EFFECT: "#F Một hoặc nhiều chi của nhân vật — tay, chân, đuôi, thậm chí lưỡi — có thể vươn dài ra để điều khiển vật thể hoặc tấn công đối thủ từ xa. Sức mạnh này thường biểu hiện ở fomori dưới dạng một cái lưỡi giống ếch mạnh mẽ, khiến chủ nhân nói giọng lè nhè kỳ lạ (và đôi khi thích ăn côn trùng).#!"
 EXTRA_LIMB_PERK_EFFECT: "#F Nhân vật vĩnh viễn mọc thêm một số chi thừa, có thể là tay thừa, xúc tu, hoặc thậm chí lưỡi hay ruột kéo dài, linh hoạt. Các chi này có thể mọc ở những vị trí kỳ lạ, hoặc thậm chí ẩn trong các túi da đến khi cần dùng.#!"
 EYES_OF_THE_WYRM_PERK_EFFECT: "#F Mắt của fomor có gì đó bất thường. Có thể là mắt ghép như côn trùng, hoặc có con ngươi và tròng mắt dịch chuyển kỳ lạ, hoặc thậm chí lấp lánh những gợn màu óng ánh, bẩn thỉu. Những ai chạm mắt fomor sẽ thấy một khuôn mẫu đáng sợ hơn ẩn giấu bên trong — những cái nhìn thoáng qua về sự đọa lạc điên loạn của $glossary_wyrm$.#!"
 FLIGHT_PERK_STATS_EFFECT: "#F Nhân vật có khả năng bay, thông qua cánh (dưới bất kỳ hình dạng nào) hoặc một dạng đẩy khác (như cưỡi gió cho một Kami mang thuộc tính bão). Cô ấy có thể lượn, trượt, vút cao hoặc bổ nhào, theo lựa chọn của người chơi.#!"
 FOOT_PADS_PERK_EFFECT: "#F Bàn chân của nhân vật có đệm như của thú vật, mang lại cho hắn thêm một mức độ ẩn nấp.#!"
 FUNGAL_TOUCH_PERK_EFFECT: "Áp [modifier|E] [GetModifier('fungal_touch_perk_modifier').GetNameWithTooltip] lên [knights|E] địch khi đóng vai [commander|E] trong [combat_phase|E], hoặc lên đối thủ của bạn trong [single_combat_duel_plural|E].\n#F Nhân vật đã bị một chất giống nấm kỳ lạ hấp thụ một phần, mà hắn có thể truyền qua bằng một cái chạm độc hại.#!"
 GASEOUS_FORM_PERK_EFFECT: "Mở khóa tùy chọn biến hình [GetModifier( 'POD_shapeshift_form_mist_modifier' ).GetNameWithTooltip|L].\n#F Nhân vật có thể hòa tan cơ thể mình thành trạng thái khí, có thể là sương mù, khói hoặc một luồng khí hôi thối.#!"
 HAZARDOUS_BREATH_PERK_EFFECT: "Tăng thêm cơ hội gây một đòn tàn sát tàn bạo lên [knights|E] địch khi trong [combat_phase|E] với vai [knight|E].\n#F Nhân vật có thể phun ra một loại chất nguy hiểm theo ý muốn — lửa, hơi độc, nước bọt có tính axit hoặc tương tự. Đòn tấn công không nhất thiết phải là vũ khí hơi thở thực sự; bất kỳ đòn tấn công tầm xa nào cũng được.#!"
 HEART_SENSE_PERK_EFFECT: "#F Kami có thể nhìn thấu tận đáy lòng một cá nhân, xác định phe phái tâm linh chung của cô ấy (Wyrm, Wyld, Weaver, Gaia hay khác), sự trong sạch hay có lỗi, hình dạng thật của cô ấy (nếu cô ấy đang mang một hình dạng khác), thậm chí cả những giấc mơ và mong muốn thầm kín nhất hoặc các liên kết của cô ấy với quá khứ.#!"
 HOMOGENEITY_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn loại bỏ [battle_modifier|E] của mục tiêu.\n#F Nhân vật có thể vô hiệu hóa mọi sức mạnh siêu nhiên trong bán kính năm yard quanh cô ấy, hoặc tập trung vào một đối thủ và ngăn hắn sử dụng các sức mạnh như vậy lâu hơn đáng kể. Đồng Hóa không có hiệu lực với các sức mạnh "bẩm sinh"; do đó, dù nó sẽ vô hiệu hóa các Món Quà (Gift) của một Garou, nó sẽ không ngăn họ biến hình.#!"
 HORROR_PERK_EFFECT: "Áp [modifier|E] [GetModifier('POD_delirium_modifier').GetNameWithTooltip] lên [knights|E] địch khi đóng vai [commander|E] trong [combat_phase|E], hoặc lên đối thủ của bạn trong [single_combat_duel_plural|E].\nBạn có thể vượt qua khả năng miễn nhiễm delirium.\n#F Sự hiện diện của nhân vật gây rối loạn đến mức nó gợi lên cùng cơn hoảng loạn siêu nhiên ở người thường như khi chứng kiến một Garou ở dạng Crinos. Những nhân vật mạnh hơn thậm chí có thể gây kinh hoàng và hoài nghi lên cả những sinh vật siêu nhiên. Sức mạnh này hầu như luôn xuất hiện ở những nhân vật có hình dạng thực sự thú tính, hoang dã hoặc hoàn toàn quái dị.#!"
 IMMUNITY_TO_THE_DELIRIUM_PERK_EFFECT: "Bạn sẽ không còn chịu #TOOLTIP:STATIC_MODIFIER,POD_delirium_modifier #N;L Delirium#!#! khi chiến đấu với $glossary_fera$ trong các cuộc chiến hoặc [single_combat_duel_plural|E] nữa.\n#F Nhân vật không chịu bất kỳ hiệu ứng nào của Delirium.#!"
 INFECTIOUS_BITE_TOUCH_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn gây bệnh.\n#F Nhân vật có thể lây lan một sự nhiễm trùng độc hại qua cắn hoặc chạm. Nếu vật chủ lây nhiễm được cho một mục tiêu, mục tiêu sẽ trở nên sốt và ốm yếu, và sẽ lây nhẹ cho đến khi vết nhiễm lành lại.#!"
 INVISIBILITY_PERK_STATS_EFFECT: "Mở khóa tùy chọn biến hình [GetModifier( 'POD_shapeshift_form_invisible_modifier' ).GetNameWithTooltip|L].\n#F Nhân vật biến mất khỏi tầm nhìn. Cô ấy không để lại dấu chân, nhưng vẫn gây tiếng động và vẫn tỏa ra mùi, và vẫn sẽ bị các Món Quà như Sense $glossary_wyrm$ phát hiện (nếu áp dụng).#!"
 INVULNERABILITY_PERK_STATS_EFFECT: "#F Cơ thể của nhân vật được tăng cường sức mạnh siêu nhiên mà không có hiệu ứng bên ngoài rõ rệt.#!"
 LIQUID_FORM_PERK_EFFECT: "Mở khóa tùy chọn biến hình [GetModifier( 'POD_shapeshift_form_blood_modifier' ).GetNameWithTooltip|L].\n#F Nhân vật có thể hóa lỏng cơ thể mình, tan thành một chất lỏng đặc (bùn, máu hoặc tương tự) có thể di chuyển tùy ý. Nhân vật ở hình dạng lỏng có thể chảy qua các khe hở nhỏ mà không khó khăn, dù nó gặp khó khi di chuyển lên dốc.#!"
 LONGEVITY_PERK_EFFECT: "#F Tuổi thọ của Kami được kéo dài thêm khoảng 50 năm với sự trợ giúp của sức mạnh này.#!"
 LORD_OF_THE_LAND_PERK_EFFECT: "#F Nhân vật gắn kết đến mức khó tin với lãnh thổ của mình, luôn nhận biết được bất cứ điều gì xảy ra trong ranh giới mà cô ấy đã tuyên bố là của riêng mình.#!"
 MAGNETOKINESIS_PERK_EFFECT: "#F Drone có thể tạo ra và điều khiển các từ trường khu vực, cho phép hắn di chuyển hoặc điều khiển các vật thể chứa sắt.#!"
 MALLEATE_PERK_EFFECT: "Tăng thêm cơ hội gây tàn tật lên [knights|E] địch khi trong [combat_phase|E] với vai [knight|E].\n#F Nhân vật có khả năng tiêm một loại nọc độc kỳ lạ khiến cơ thể nạn nhân trở nên dễ uốn, làm xương và các nhóm cơ mềm như đất sét. Sức mạnh này có thể ảnh hưởng cả thịt vô sinh và mô thực vật.#!"
 MASK_PRESENCE_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn chặn mọi âm mưu nhằm vào bạn.\n#F Nhân vật có thể che giấu sự hiện diện của hắn khỏi mọi người quan sát.#!"
 MATTER_WEAVE_PERK_EFFECT: "#F Nhân vật có khả năng tái tạo vật chất thành các hình dạng và chức năng mới. Drone thường dùng sức mạnh này để sửa chữa hư hại cho các công trình hoặc vá các khiếm khuyết; gorgon dùng nó gần như theo ý thích, tái tạo các vật thể thành các cấu hình kỳ lạ mới để làm suy yếu sự kiểm soát của $glossary_weaver$ lên một khu vực.#!"
 MEMORY_CARESS_PERK_EFFECT: "#F Nửa linh hồn của nhân vật can thiệp vào tâm trí của những người bình thường để giữ bí mật cho các hoạt động của nhân vật. Người xung quanh phản ứng với nhân vật theo cách họ vốn sẽ làm, nhưng ký ức của họ về nhân vật phai nhạt sau khi nhân vật rời đi. Sức mạnh này chắc chắn có nhược điểm — thật khó để giữ một công việc bình thường nếu ông chủ của bạn quên bạn tồn tại mỗi khi bạn ra khỏi phòng — nhưng đối với nhiều kẻ bị chiếm hữu, ẩn danh là sự phòng thủ tối thượng.#!"
 MIND_BLAST_PERK_EFFECT: "Bạn có thể [imprison|E] [characters|E] mà nếu không sẽ không thể bắt được trong [siege|E] hoặc [raid|E].\nKhả năng [imprison|E] [characters|E] cao hơn nhiều sau một [siege|E] hoặc [raid|E] thành công.\n#F Nhân vật có thể làm bất động một mục tiêu bằng một luồng năng lượng tâm linh. Nạn nhân sụp xuống đất, giãy giụa trong đau đớn, phó mặc cho kẻ tấn công.#!"
 FOMORI_MIND_RAPE_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn biết mọi bí mật và âm mưu của mục tiêu.\n#F Fomor có thể xâm nhập tâm trí một mục tiêu và cưỡng ép rút thông tin từ đó. Dù việc này không gây tổn hại thực sự, nạn nhân thường cảm thấy trần trụi và bị xâm phạm trong nhiều ngày sau đó (và thường bị đau đầu dữ dội).#!"
 NATURAL_WEAPONRY_PERK_EFFECT: "Mở khóa tùy chọn biến hình Vũ Khí Tự Nhiên.\n#F Nhân vật hiển thị vũ khí tự nhiên dưới dạng móng vuốt, răng nanh, sừng, hoặc chỉ là những phần xương nhô ra sắc nhọn.#!"
 NIGHTMARE_COMMAND_PERK_EFFECT: "Mở khóa [scheme|E] [GetScheme('PODsoul_bridge').GetTypeName].\n#F Fomor có thể khiến một mục tiêu chịu đựng những cơn ác mộng kinh hoàng, tước đi giấc ngủ ngon của nạn nhân. Fomor có thể chọn ảnh hưởng đến nội dung của các giấc mơ, hoặc chỉ đơn giản để tiềm thức của nạn nhân làm công việc bẩn thỉu.#!"
 PEACEFUL_FIGHTING_PERK_EFFECT: "Khả năng [imprison|E] [characters|E] cao hơn sau một [siege|E] hoặc [raid|E] thành công.\n#F Nhân vật có thể chiến đấu với toàn bộ sức mạnh mà không gây tổn hại vĩnh viễn cho đối thủ. Kami dùng sức mạnh này ra vì lòng nhân từ; Drone vì mong muốn tránh mọi sự gián đoạn lớn.#!"
 PIERCING_GAZE_PERK_EFFECT: "#F Kami có thể khiến bất kỳ ai bị nhìn cảm thấy khó chịu và bất an, như thể Kami đang nhìn thẳng vào tâm hồn cô ấy. Sức mạnh này thường được dùng để đuổi kẻ xâm nhập, dù nó cũng có thể là một trợ giúp tuyệt vời cho việc thẩm vấn.#!"
 PLANT_ANIMATION_PERK_EFFECT: "Có thể tuyển mộ [GetMaA('animated_tree').GetName] làm [men_at_arms|E]\n#F Nhân vật có thể hoạt hóa thực vật, khiến cây cối, dây leo, bụi rậm và tương tự di chuyển theo những cách thường bị cấm đoán. Một cây có thể đánh hoặc thậm chí siết chặt đối thủ bằng cành, dây leo có thể quấn lấy và thậm chí cỏ có thể bắt lấy chân kẻ địch.#!"
 PLANT_KINSHIP_PERK_EFFECT: "Tốc Độ Tiến Triển [espionage|E]: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F Sức mạnh này cho phép Kami giao tiếp với đời sống thực vật, dù chỉ rất ít thông tin có thể thu được từ một cái cây thông thường.#!"
 PLANT_KINSHIP_PERK_BONUS_VALUE: "[GetPerk('kami_plant_kinship_perk').GetName(GetPlayer)]"
 PLIANT_BONES_PERK_EFFECT: "Tăng cơ hội thành công cho [decision|E] Trốn Khỏi Nhà Tù.\n#F Xương của nhân vật có thể trở nên mềm và dễ uốn, cho phép cô ấy chui qua các khe hở nhỏ như một con chuột. Nhân vật cũng có thể vùng vẫy thoát khỏi dây trói và xích, nếu có thời gian.#!"
 POISON_PERK_EFFECT: "Tăng thêm cơ hội gây thương tích nặng lên [knights|E] địch khi trong [combat_phase|E] với vai [knight|E].\n#F Nhân vật có khả năng tiêm độc vào kẻ địch, thông qua tuyến độc hoặc dịch cơ thể có độc như nước bọt.#!"
 POISON_TUMORS_PERK_EFFECT: "Mở khóa tùy chọn biến hình [GetModifier( 'POD_shapeshift_form_poison_tumors_modifier' ).GetNameWithTooltip|L].\n#F Cơ thể của fomor được bao phủ bởi những u bướu kỳ lạ chứa đầy mủ có tính ăn mòn, thường có màu sắc và mùi hôi tanh gớm ghiếc.#!"
 REASSURING_PRESENCE_PERK_EFFECT: "#F Nhân vật có thể thay đổi ngoại hình để khớp với bất kỳ người mà số lượng người xem đông nhất tại một thời điểm sẽ tôn trọng và lắng nghe. Dù sức mạnh này có vẻ yếu, một fomor hoặc Drone khôn khéo có thể dùng nó để đi hầu như bất cứ đâu và nhận được sự hợp tác hạn chế từ gần như bất kỳ ai.#!"
 REGENERATION_PERK_STATS_EFFECT: "Loại bỏ mọi vết thương và tàn tật mỗi ba tháng.\n#F Nhân vật tái sinh tổn thương gần như ngay lập tức, theo cách giống một werewolf.#!"
 SANITY_RENDING_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn gán cho mục tiêu một đặc điểm căng thẳng.\n#F Nhân vật có khả năng bẻ cong tâm trí của những ai chạm mắt với nó — bẻ cong đến điểm giới hạn.#!"
 SEASONS_BLESSINGS_PERK_EFFECT: "#F Kami có thể mang hiệu ứng của một mùa cụ thể đến một khu vực: lá có thể rơi khỏi cây nếu Phước Lành Mùa Thu được gọi ra, còn một Kami gắn với mùa đông có thể gọi tuyết rơi.#!"
 SELF_IMMOLATION_PERK_EFFECT: "Mở khóa tùy chọn biến hình [GetModifier( 'POD_shapeshift_form_fire_modifier' ).GetNameWithTooltip|L].\n#F Nhân vật có thể tự thiêu, trở thành một đống lửa biết đi. Ngọn lửa không làm hại nhân vật, nhưng gây hại cho mọi thứ nhân vật chạm vào, với mọi rủi ro kèm theo.#!"
 SENSE_GAIA_PERK_EFFECT: "#F Nhân vật có thể cảm nhận các hiện thân của Gaia trong khu vực gần đó — Gaian fera, linh hồn và tương tự.#!"
 SHADOWPLAY_PERK_EFFECT: "Mở khóa tùy chọn biến hình [GetModifier( 'POD_shapeshift_form_shadow_modifier' ).GetNameWithTooltip|L].\n#F Nhân vật có thể điều khiển các bóng tối xung quanh, kéo chúng lại thành một khu vực tối tăm. Nhân vật luôn có thể nhìn thấy trong bóng tối của chính mình.#!"
 SILENT_SPEECH_PERK_EFFECT: "#F Nhân vật có thể giao tiếp mà không cần lời nói, nói chuyện với người khác từ tâm trí đến tâm trí. Sức mạnh này vượt qua mọi rào cản ngôn ngữ, dù nhân vật không thể giao tiếp theo cách này với các sinh vật không có ngôn ngữ trừ khi dùng một sức mạnh khác để làm vậy.#!"
 SIZE_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn trở thành [GetTrait('giant').GetName( GetPlayer )] hoặc [GetTrait('dwarf').GetName( GetPlayer )].\n#F Trong khi sức mạnh [GetPerk('fomori_bulky_perk').GetName( GetPlayer )] đại diện cho một mẫu vật đặc biệt to lớn của loại thân xác vật chủ, sức mạnh này đại diện cho những thay đổi mạnh mẽ và vĩnh viễn về kích thước của một nhân vật.#!"
 SKINCHANGER_KINSHIP_PERK_EFFECT: "#F Sức mạnh này đại diện cho một liên kết tâm linh và tình bạn sâu sắc với một trong các Changing Breed. Phiên bản phổ biến nhất của sức mạnh này là Thân Tộc Garou (vì các Breed khác đã suy tàn), nhưng một Kami có thể có Thân Tộc với bất kỳ chủng loài biến hình nào, thậm chí Ratkin hay Ananasi.#!"
 SKINSHIFT_PERK_EFFECT: "Tăng thêm cho [character_interaction|E] Biến Hình để thay đổi ngoại hình.\n#F Nhân vật bị chiếm hữu có thể thay đổi hình dạng thịt của hắn, nhanh chóng và linh hoạt mang đặc điểm và hình dáng cơ thể của một sinh vật hoàn toàn khác trong khoảnh khắc.#!"
 SPIRIT_AWAKENING_PERK_EFFECT: "#F Kami có khả năng đánh thức linh hồn của động vật, thực vật hoặc vật thể vô tri bằng cách hát hoặc chơi nhạc cho chúng.#!"
 SPIRIT_GIFT_PERK_EFFECT: "#F Nhân vật có thể học bất kỳ Món Quà (Gift) phù hợp và phát triển nó thành sức mạnh riêng của hắn.#!"
 SPIRIT_KINSHIP_PERK_EFFECT: "Có thể tuyển mộ [GetMaA('jagglings').GetName] làm [men_at_arms|E].\n$POD_can_weaken_fetter_trigger_loca$\n$POD_can_bind_wraith_trigger_loca$\n$POD_can_command_wraith_trigger_loca$\n#F Nhân vật có liên kết mạnh mẽ với các linh hồn cùng loại, và thậm chí có thể gọi họ đến trong thời khắc nguy hiểm. Fomori gắn với Tà Linh, Drone gọi linh hồn $glossary_weaver$, gorgon có thể gọi Wyldling và Kami thường gọi nguyên tố.#!"
 SPIRIT_RENDING_PERK_EFFECT: "Bạn có thể cầm tù, tra tấn, hành hình hoặc gây tổn hại vật lý cho linh hồn trong [single_combat_duel_plural|E].\n#F Fomori có sức mạnh này có thể dùng Cuồng Nộ (Rage) để tấn công các linh hồn qua Gauntlet và hút năng lượng của họ. Tất nhiên, một fomor đánh giá sai con mồi của mình có thể gặp một bất ngờ chết người.#!"
 SPIRIT_SENSE_PERK_EFFECT: "Mở khóa [decision|E] $seek_aid_of_the_spirits_decision$.\n#F Nhân vật có thể nhìn xuyên qua Gauntlet, quan sát các sự việc trong Penumbra địa phương.#!"
 SPIRIT_STATIC_PERK_STATS_EFFECT: "Mở khóa tùy chọn Điều Khiển Gauntlet trong bảng [umbra|E].\n#F Drone có thể tạm thời tăng Gauntlet trong khu vực lân cận, hạn chế sức mạnh của kẻ địch của $glossary_weaver$.#!"
 SPIRIT_TIES_PERK_EFFECT: "Có thể dùng [artifact|E] fetish.\n#F Nhân vật có liên kết bẩm sinh với [spirit_world|E] và có thể dùng fetish và talen.#!"
 STASIS_COCOON_PERK_EFFECT: "Mở khóa [decision|E] Vào Kén, cho phép vào [GetTrait('torpor').GetName( GetNullCharacter )], việc này sẽ lật đổ bạn.\n#F Nhân vật tự bọc mình trong một lớp vỏ cứng khi trao đổi chất của cô ấy chậm lại đến trạng thái ngủ đông. Các nhân vật trong kén không già đi và có thể sống mà không cần thức ăn, nước uống, hoặc thậm chí không khí gần như vô hạn.#!"
 STASIS_TOUCH_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn loại bỏ khả năng biến hình của mục tiêu.\n#F Chỉ bằng một cái chạm, nhân vật có thể tước đi khả năng thay đổi hình dạng của đối thủ.#!"
 STEP_SIDEWAYS_PERK_EFFECT: "Có quyền truy cập [UmbraGlossary('spirit_wilds')].\n#F Nhân vật có được khả năng bước vào [umbra|E], giống như Garou vẫn làm.#!"
 SUCCUBUS_VEIL_PERK_EFFECT: "Mở khóa [scheme|E] [GetScheme('PODenthrall').GetTypeName].\n#F Nhân vật có thể xuất hiện như người bạn đời lý tưởng của mục tiêu, và chỉ bằng một cử chỉ, vẫy gọi hắn đến bên cô ấy. Sử dụng thành công sức mạnh này cho thấy mục tiêu bị mê hoặc hoàn toàn bởi nhân vật đến mức hắn sẽ làm bất cứ điều gì hợp lý để làm cô ấy hài lòng. Ngoài ra, nhân vật có thể kích hoạt sức mạnh này để mê hoặc bất kỳ ai nhìn thấy cô ấy, dù "mê hoặc bao trùm" này kém uy lực hơn nhiều.#!"
 TAINT_SUPPRESSION_PERK_EFFECT: "#F Fomor có thể tạm thời phủ nhận hiệu ứng của bất kỳ Vết Nhiễm nào của hắn. Các dị dạng thể chất bị ức chế lành lại thành thịt lành lặn trong vài giây; các chứng loạn tâm biến mất trong một khoảnh khắc minh mẫn hoàn toàn, v.v.#!"
 TAR_BABY_PERK_EFFECT: "Tăng thêm cơ hội gây tàn tật lên [knights|E] địch khi trong [combat_phase|E] với vai [knight|E].\n#F Da hay "thịt" của nhân vật được làm từ một chất đặc, dính như mật đường hoặc nhựa đường. Bất cứ thứ gì tiếp xúc mạnh với da sẽ dính vào nó như ruồi dính bẫy dính; tiếp xúc chậm, có chủ ý như mặc quần áo không kích hoạt tính chất kết dính.#!"
 THICK_SKINNED_PERK_EFFECT: "Tăng thêm cơ hội gây tàn tật lên [knights|E] địch khi trong [combat_phase|E] với vai [knight|E].\n#F Nhân vật có thêm một hoặc nhiều lớp phủ bên ngoài mang lại bảo vệ siêu nhiên chống thương tổn. Kiểu bảo vệ khác nhau theo từng người bị chiếm hữu; Drone chỉ trải qua một sự cứng hóa da khó nhận thấy, còn gorgon thường thể hiện Sức Mạnh này qua nhiều cách khác nhau, từ thịt đặc dày đến một lớp vảy.#!"
 TRANSFORMATION_PERK_EFFECT: "Cho phép biến hình thành nhiều dạng động vật.\n#F Kami có khả năng biến hình hạn chế nhưng hoàn hảo.#!"
 TRIATIC_SCENT_PERK_EFFECT: "Cho phép tương tác thân thiện với [splat|E] $glossary_triat$ đối nghịch.\n#F Nhân vật có khả năng che giấu "mùi thật" của nó bằng cách khai thác sức mạnh của một thực thể Triat đối nghịch.#!"
 TRIATIC_SENSE_PERK_EFFECT: "#F Nhân vật có khả năng cảm nhận sức mạnh tương đối của bất kỳ $glossary_triat$ nào trong khu vực lân cận của cô ấy.#!"
 UNIVERSAL_TONGUE_PERK_EFFECT: "#F Nhân vật có thể nói và hiểu bất kỳ sinh vật sống nào.#!"
 UNNATURAL_STRENGTH_PERK_EFFECT: "#F Các bắp thịt của nhân vật cuộn lên với sự phát triển phi tự nhiên, khiến nhân vật trông gần như là sản phẩm của việc dùng steroid nặng.#!"
 VEIL_BREACH_PERK_EFFECT: "#F Các nhân vật có Sức Mạnh này có thể chạm vào tâm trí một con người và xé ra những mảnh ý thức dễ bị Delirium tác động. "Phẫu thuật tâm linh" xâm lấn như vậy làm cho nạn nhân dễ bị điên loạn, nhưng khiến những con người bình thường có thể tương tác (hoặc thậm chí chiến đấu) với Garou mà không rơi vào hoảng loạn ngay lập tức.#!"
 VOICE_OF_REASON_PERK_EFFECT: "#F Giọng nói của nhân vật trở thành một âm điệu đơn điệu, quyến rũ kỳ lạ, đưa người nghe vào trạng thái bình tĩnh thôi miên.#!"
 VOICE_OF_THE_WYRMCH_PERK_EFFECT: "#F Lưỡi của fomor đã bị biến đổi thành một hình dạng kỳ lạ: có thể dày và giống sên, có thể dài và chẻ đôi, có thể thậm chí biến thành một khối xúc tu. Fomor vẫn có thể nói chuyện bình thường, và cũng có thể nói bằng ngôn ngữ riêng của Wyrm.#!"
 WALL_WALKING_PERK_EFFECT: "#F Nhân vật có thể chạy lên các bề mặt dốc thẳng như một con nhện, dễ dàng như thể hắn đang đi trên mặt đất bằng.#!"
 WEBBING_PERK_EFFECT: "Tù nhân của bạn có ít cơ hội trốn khỏi nhà tù của bạn hơn.\n#F Cho phép tạo ra tơ để trói kẻ địch đã ngã, bịt kín các lỗ hở hoặc thậm chí hạ mình xuống từ độ cao lớn. Sức mạnh này có thể có nhiều hình thức tùy theo nhân vật. Fomori có thể nhả ra những dòng chất dính hôi thối từ các tuyến bẩn thỉu, còn Kami và gorgon có thể tạo ra tơ mượt "tự nhiên" hơn, và Drone dệt các sợi giống nhựa, có vẻ nhân tạo để trói kẻ địch.#!"
 ANIMATE_SELF_PERK_EFFECT: "#F Gorgon và Kami bị gắn vào các vật thể vô tri như cây hoặc tượng có thể sở hữu sức mạnh này, cho phép họ hoạt hóa thân xác vật chủ của mình. Không có sức mạnh này, một nhân vật có vật chủ là thực vật hoặc khoáng vật sẽ không thể di chuyển.#!"
 ARMORED_HIDE_PERK_EFFECT: "#F Da của vật chủ rõ ràng đã thay đổi, mang lại thêm sức chịu đựng chống lại các đòn tấn công. Nó có thể rõ ràng có vảy hoặc dày như da tê giác, hoặc thậm chí óng ánh chất nhờn khiến các đòn tấn công trượt đi mà không tiếp xúc mạnh.#!"
 BALEFIRE_FLUX_PERK_EFFECT: "#F Mỗi khi fomor bị phơi ra trước Balefire, chất thải phóng xạ của Wyrm, hắn có thể trải qua một sự biến đổi, nhận được một Sức Mạnh mới.#!"
 BLENDING_PERK_EFFECT: "#F Nhân vật có thể thay đổi màu da nhằm mục đích ẩn nấp; dù không thể sao chép các mẫu hay kết cấu cụ thể, nó có thể tạo ra các mẫu chung đủ để phá vỡ đường viền của nó.#!"
 COMPUTER_LINK_PERK_EFFECT: "#F [Select_CString( GetScriptedGui('is_modern').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).End), 'Drone có khả năng điều khiển máy tính chỉ bằng cách chạm vào.', '')]#!"
 CORRUPTED_VISIONS_PERK_EFFECT: "#F "Tôi phải làm vậy! Chúa đã bảo tôi!" Bằng cách khai thác món quà tha hóa này, một fomor gây ra ảo giác cho một nạn nhân bất lực. Những giọng nói từ Chúa, những cái nhìn thoáng qua thứ gì đó ngay ngoài tầm mắt, những lời quở trách, chế giễu và những món khoái khẩu hoang tưởng khác chỉ là một vài trong số các khả năng. Dù Sức Mạnh này hoạt động tốt nhất khi fomor trông bình thường đủ để qua mặt như người thường, một kẻ đặc biệt biến dạng vẫn có thể dùng nó khi đang ẩn náu. Biết về nạn nhân của bạn giúp ích khi dùng Ảo Ảnh Tha Hóa; một người có lý trí sẽ nghi ngờ nếu Chúa Jesus đột nhiên bảo cô ấy đi giết người, còn ai đó đã rối loạn từ trước có thể nghĩ đó là một ý tưởng hoàn toàn hợp lý. Tất nhiên, một người có vẻ có lý trí vẫn có thể bị đẩy đến điên loạn bởi những ảo ảnh tinh vi, được chọn lọc kỹ. Sau đó, mọi thứ đều có thể xảy ra...#!"
 DARKSIGHT_PERK_STATS_EFFECT: "#F Nhân vật có khả năng nhìn trong bóng tối tốt như thể đang ở giữa ban ngày.#!"
 DECEPTION_PERK_EFFECT: "#F Fomor có thể che giấu dấu vết tâm linh của vết nhiễm Wyrm của hắn khỏi người khác. Món Quà: Sense Wyrm sẽ không phát hiện fomor là bị nhiễm Wyrm. Fomor cũng có thể dùng Sức Mạnh này lên người khác, để che giấu vết nhiễm của họ. Ví dụ, fomor có thể che giấu dấu vết diablerie của một vampire hoặc thậm chí thay đổi khí sắc của một Garou bình thường để cô ấy có vẻ bị nhiễm Wyrm khi thực tế không phải vậy. Fomori dưới ảnh hưởng của Sức Mạnh này cũng miễn nhiễm với phép Hekau (Tên Thật) của mummy.#!"
 deception_perk_effect_1: "Đặc điểm [GetTrait('diablerist').GetName( GetPlayer )] sẽ tự động bị ẩn khi bị phát hiện"
 deception_perk_effect_2: "Cho phép tương tác thân thiện với werewolf Gaian như một kẻ bị nhiễm Wyrm"
 deception_perk_effect_3: "Bạn không thể bị nhắm mục tiêu bởi các mưu đồ [GetScheme('POD_discover_true_name').GetTypeName]"
 ECTOPLASMIC_EXTRUSION_PERK_EFFECT: "#F Nhân vật có thể tạo ra tới bốn xúc tu hoặc cánh tay bán rắn có thể vươn dài tới năm yard, điều khiển vật thể hoặc thậm chí giáng đòn. Các chi này có thể là ectoplasm thực sự, bóng tối bán rắn, sương mù đặc bất thường, hoặc bất cứ thứ gì phù hợp với loại nhân vật đang xét.#!"
 ELEMENTAL_RESISTANCE_PERK_EFFECT: "#F Sức chịu đựng của vật chủ đối với một loại năng lượng nhất định được tăng cường đến mức siêu nhiên. Nguồn được chọn có thể là thông thường, như lửa hoặc sét, hoặc thậm chí đến từ các nguồn huyền bí hơn như balefire.#!"
 ENHANCED_ATTRIBUTE_PERK_EFFECT: "#F Năng lực tự nhiên của vật chủ được khuếch đại lên mức siêu nhân. Sức mạnh này không chỉ giới hạn ở Thuộc Tính Thể Chất — một sinh vật bị Wyld chiếm hữu có thể có Trí Tuệ Tăng Cường, còn một fomor có thể phát triển Ngoại Hình phi thường, càng dễ dụ dỗ nạn nhân.#!"
 ENHANCEMENT_PERK_EFFECT: "#F Fomor có thể trở thành người bạn đời lý tưởng của bất kỳ sinh vật sống nào, bằng cách quét tâm trí của mục tiêu.#!"
 EXOSKELETON_PERK_EFFECT: "#F Fomor có một lớp mai cứng giống vỏ mọc trên toàn bộ cơ thể cô ấy. Nó thường rất giống xương, với nhiều u sần, ống dạng gân và hình dạng kỳ lạ trên đó. Màu sắc của nó dao động từ đỏ gỉ và nâu sẫm đến đen bóng dầu.#!"
 EXTRA_SPEED_PERK_EFFECT: "#F Fomor có thể vượt trội hơn một con người thường về khả năng di chuyển linh hoạt.#!"
 HAND_FROM_BEYOND_PERK_EFFECT: "#F Fomor có thể vào [umbra|E] rồi vươn ngược lại vào thế giới vật chất để kéo người khác vào [spirit_world|E] cùng hắn. Hắn có thể kéo nhiều hơn một người miễn là tất cả mục tiêu đang nắm tay nhau.#!"
 IMMUNITY_PERK_EFFECT: "#F Fomor có thể bỏ qua hiệu ứng của một số loại thứ có khả năng nguy hiểm.#!"
 NIMBLENESS_PERK_EFFECT: "#F Fomor đặc biệt nhanh nhẹn và có thể dễ dàng giữ thăng bằng khi thực hiện các động tác mà người khác sẽ ngã.#!"
 NOXIOUS_BREATH_PERK_EFFECT: "Áp [modifier|E] [GetModifier('noxious_breath_perk_modifier').GetNameWithTooltip] lên [knights|E] địch khi đóng vai [commander|E] trong [combat_phase|E], hoặc lên đối thủ của bạn trong [single_combat_duel_plural|E].\n#F Fomor có thể thải khí độc vào không khí khiến những ai trong bán kính hai mươi yard thèm thuốc lá. Khí trông và có mùi như khói thuốc lá. Ngoài ra, khí này làm suy yếu mô phổi của những ai hít phải. Việc phơi nhiễm lặp lại với hơi thở độc hại này trong vài tuần hoặc vài tháng dẫn đến phát triển ung thư phổi ở nạn nhân.#!"
 NUMBING_PERK_EFFECT: "#F Cơ thể của fomor có thể trở nên hoàn toàn tê liệt. Cô ấy không cảm thấy đau. Tuy nhiên, cô ấy tê với mọi cảm giác. Cô ấy không thể nói bình thường (lưỡi cô ấy cảm thấy như bị gây tê vĩnh viễn) và cô ấy có thể tự làm mình bị thương mà không cảm thấy gì, điều này có thể dẫn đến các vết thương nhiễm trùng hoặc hoại tử mà fomor không hề biết.#!"
 PROCREATION_PERK_EFFECT: "#F Fomor có thể truyền một Tà Linh qua máu và tinh dịch - bất kỳ cuộc tiếp xúc nào liên quan đến dịch cơ thể có thể lây lan Tà Linh. Tà Linh sau đó sẽ cố chiếm hữu người nhận dịch. Fomor chỉ có thể truyền một Tà Linh giống với loại đã chiếm hữu hắn.#!"
 PROLONGED_LIFE_PERK_EFFECT: "#F Tuổi thọ tự nhiên của fomor được kéo dài đáng kể. Đây không phải là bất tử thực sự, vì fomor cuối cùng sẽ chết vì nguyên nhân tự nhiên (chết tự nhiên ở fomori thực tế hầu như không được biết đến).#!"
 ROAR_OF_THE_WYRM_PERK_EFFECT: "#F Fomor có thể gieo rắc khủng khiếp vào tim mọi người gần đó bằng cách phát ra tiếng thét gầm gừ này.#!"
 SAVAGE_GENITALIA_PERK_EFFECT: "#F Nỗi ác mộng của John Bobbit; fomor (bất kể giới tính) có bộ phận sinh dục với một đặc điểm đáng sợ nào đó. Các biến thể nam bao gồm chiều dài quá mức (14 inch+) hoặc độ cứng, gai, kết cấu giấy nhám hoặc gai cong; các phiên bản nữ nổi tiếng với răng, lực hút xé rách và máy xay thịt bên trong. Điều này rõ ràng không tốt trong chiến đấu, nhưng tàn khốc trên giường.#!"
 SENSE_THE_UNNATURAL_PERK_EFFECT: "#F Tương tự Món Quà Garou cùng tên, Sức Mạnh này cho phép fomor đánh hơi bất kỳ sinh vật siêu nhiên nào có mặt, như vampire, werewolf, mage, wraith và các linh hồn khác.#!"
 SKITTERSIGHT_PERK_EFFECT: "#F Sức Mạnh kỳ lạ này cho phép fomor rút mắt của cô ấy ra, xoắn dây thần kinh thị giác thành chân, và cho mắt bò dọc theo hành lang và quanh các góc để nhìn thấy những thứ thường bị che khuất. Cô ấy phải cẩn thận -- nếu mắt bị đè bẹp, cô ấy sẽ bị mù vĩnh viễn.#!"
 SLITHER_SKIN_PERK_EFFECT: "#F Da của fomor là một thứ vũ khí và một trợ thủ hữu ích. Fomor có thể lột da mình, cho nó những chỉ dẫn đơn giản (không quá năm từ). Da tách ra ở hậu môn và lột ra qua đầu fomor. Nó có thể đi, cầm nắm đồ vật hoặc tấn công.#!"
 SLOBBER_SNOT_PERK_EFFECT: "#F Da của fomor được bao phủ bởi những mụn nhỏ tiết ra một chất nhờn cực trơn và chảy. Chất nhờn này khiến cơ thể fomor gần như không có ma sát, làm cho đối thủ hầu như không thể tóm được fomor. Chất gel nhờn cũng giúp fomor chui qua các khoảng hẹp. Nhớt Nhầy tan biến gần như ngay lập tức dưới ánh nắng trực tiếp.#!"
 STOMACH_PUMPER_PERK_EFFECT: "#F Fomor có thể nôn ra mọi thứ hắn vừa ăn, phủ trong dịch dạ dày nhờn có tính axit.#!"
 TOXIC_SECRETIONS_PERK_EFFECT: "#F Sức Mạnh này biến dịch cơ thể của fomor thành chất thải độc hại.#!"
 WATER_BREATHING_PERK_EFFECT: "#F Với Sức Mạnh đơn giản này, fomor có thể thở dưới nước hoặc không cần thở chút nào. Sức Mạnh này cũng mang lại một mức độ kháng cự nhất định với áp lực dưới nước và các vấn đề giảm áp.#!"
