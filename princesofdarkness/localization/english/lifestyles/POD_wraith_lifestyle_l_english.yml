 DARK_ETHER_PERK_EFFECT: "Trao [GetModifier('dark_ether_modifier').GetNameWithTooltip] [modifier|E] cho [knights|E] địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho đối thủ của ngươi trong [single_combat_duel_plural|E].\n#F Một Haunter có thể can thiệp vào ánh sáng hoặc điều kiện thời tiết trong một khu vực.#!"
 ESCHERS_STAIR_PERK_EFFECT: "Là một [character_interaction|E], cho phép ngươi dịch chuyển tức thời quân đội của mình đến vị trí mục tiêu, với nguy cơ bị lạc trong [UmbraGlossary('pod_realm_labyrinth')].\n#F Một Haunter có thể liên kết hai cánh cửa hoặc cổng dịch chuyển khác qua [UmbraGlossary('pod_realm_labyrinth')].#!"
 FOUL_HUMOUR_PERK_EFFECT: "Trao cho [knights|E] đồng minh khi đóng vai trò [commander|E] trong [combat_phase|E] hoặc chính ngươi trong [single_combat_duel_plural|E] [GetModifier('foul_humour_modifier').GetNameWithTooltip] [modifier|E] khi đóng vai trò [commander|E] trong [combat_phase|E].\n#F Một Haunter có thể tạo ra một hiệu ứng vật chất mạnh mẽ xuyên qua Shroud.#!"
 STIGMATA_PERK_EFFECT: "#F Một Haunter có thể tạo ra vẻ ngoài của những vết thương rỉ máu trên mục tiêu.#!"
 FORM_OF_CHAOS_PERK_EFFECT: "Cho phép chế tạo một nhân vật [GetTrait('automaton').GetName( GetPlayer )].\n#F Một Haunter có thể tạo ra một hình hài giống người thô sơ từ những thứ trông như vật thể kinh tởm (như máu, giòi bọ, côn trùng, v.v.)#!"
 TEMPUS_FUGIT_PERK_EFFECT: "Trao cho [commanders|E] đồng minh [GetModifier('tempus_fugit_modifier').GetNameWithTooltip] [modifier|E] khi đóng vai trò [commander|E] trong [combat_phase|E].\n#F Một Haunter có thể thao túng khoảng cách và thời gian ở mức độ giới hạn.#!"
 TESSERACT_BOMB_PERK_EFFECT: "Trao cho [commanders|E] địch [GetModifier('tesseract_bomb_modifier').GetNameWithTooltip] [modifier|E] khi đóng vai trò [commander|E] trong [combat_phase|E].\n#F Một Haunter có thể biến một công trình thành mê cung hình học ác mộng, khiến nó không thể ra vào được.#!"
 
