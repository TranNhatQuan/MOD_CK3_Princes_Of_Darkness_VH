 SPECTRE_PRESTIGE_PERK_EFFECT: "Trong Catharsis nhận [GetModifier('spectre_prestige_modifier').GetNameWithTooltip].\n#F Bóng được các Specter kính trọng và chúng sẽ đến trợ giúp oan hồn trong Catharsis.#!"
 DARK_ALLIES_PERK_EFFECT: "Trong Catharsis nhận [GetModifier('dark_allies_modifier').GetNameWithTooltip].\n#F Bóng của nhân vật thường xuyên liên lạc với những Specter cụ thể, và có thể gọi chúng đến trợ giúp.#!"
 TAINTED_RELIC_PERK_EFFECT: "Tăng chi phí [static_stress|E] khi giữ lại [Fetter|E] trong Catharsis.\n#F Bóng có một thánh vật quan trọng hiện ra khi nó nắm quyền kiểm soát: một vũ khí hoặc vật phẩm hữu ích khác.#!"
 INFAMY_PERK_EFFECT: "Trong Catharsis nhận [GetModifier('infamy_modifier').GetNameWithTooltip].\n#F Là ký ức của Bóng, Ô Danh là thước đo mức độ sợ hãi và ghê tởm mà oan hồn vẫn còn gieo rắc trong lòng người sống.#!"
 DEATHS_SIGIL_PERK_EFFECT: "Mỗi 5 năm, 25% cơ hội nhận [GetModifier('deaths_sigil_modifier').GetNameWithTooltip].\n#F Ấn Ký Tử Thần là một dấu hiệu rõ rệt cho thấy sự chạm tay của [UmbraGlossary('oblivion')] lên nhân vật, hiện ra bất kể nàng đi đến đâu.#!"
 SHADOW_TRAITS_PERK_EFFECT: "Giảm cơ hội giành lại quyền kiểm soát Bóng của ngươi.\n#F Bóng có thể mua Ability, nhưng những Ability thêm này chỉ khả dụng trong Catharsis.#!"
 NIGHTMARES_PERK_EFFECT: "Mỗi 5 năm, 50% cơ hội nhận [GetModifier('nightmares_modifier').GetNameWithTooltip].\n#F Khi Tâm Thức Slumber, một Bóng có Thorn này có thể khiến nàng gặp những cơn ác mộng dữ dội.#!"
 AURA_OF_CORRUPTION_PERK_EFFECT: "Mỗi 5 năm, 25% cơ hội nhận [GetModifier('aura_of_corruption_modifier').GetNameWithTooltip].\n#F Thông qua hiệu ứng của Thorn này, Bóng bằng cách nào đó làm ô uế cách oan hồn thể hiện bản thân, khiến sự hiện diện của nàng trở nên khó chịu với những oan hồn khác.#!"
 MIRROR_MIRROR_PERK_EFFECT: "Mỗi 5 năm, 25% cơ hội nhận [GetModifier('mirror_mirror_modifier').GetNameWithTooltip].\n#F Bất cứ khi nào Oan Hồn nhìn thấy chính mình trong một bề mặt phản chiếu, Bóng có thể khiến hình ảnh phản chiếu đó trông méo mó kinh khủng, theo bất kỳ cách nào Bóng mong muốn.#!"
 SHADOW_CALL_PERK_EFFECT: "Trong Catharsis nhận [GetModifier('shadow_call_modifier').GetNameWithTooltip].\n#F Lời Triệu Của Bóng cho phép Bóng của một oan hồn triệu tập những Specter gần đó.#!"
 PACT_OF_DOOM_PERK_EFFECT: "Là một [character_interaction|E], nhận 2 [perk|E] [arcanoi_lifestyle|E] với cái giá là tăng sức mạnh cho Bóng của ngươi.\n#F Nếu một oan hồn có Thorn này, nàng và Bóng của mình có thể thương lượng một khế ước, theo đó Bóng sẽ dạy nàng một số cấp độ định trước trong một Arcanos.#!"
 TRICK_OF_THE_LIGHT_PERK_EFFECT: "Mỗi 5 năm, 25% cơ hội nhận [GetModifier('trick_of_the_light_modifier').GetNameWithTooltip].\n#F Bằng cách sử dụng Thorn này, Bóng khéo léo làm thay đổi nhận thức của Tâm Thức.#!"
 BAD_LUCK_PERK_EFFECT: "Mỗi 5 năm, 25% cơ hội nhận [GetModifier('bad_luck_modifier').GetNameWithTooltip].\n#F Bóng có thể tiêu một điểm Angst để khiến Tâm Thức phải làm lại một phép thử.#!"
 SHADOWED_FACE_PERK_EFFECT: "Trong Catharsis nhận [GetModifier('shadowed_face_modifier').GetNameWithTooltip].\n#F Với Thorn này, Bóng thay đổi hoàn toàn diện mạo của Tâm Thức khi nó giành quyền kiểm soát.#!"
 HONEYED_TONGUE_PERK_EFFECT: "Tăng cơ hội mất quyền kiểm soát Bóng của ngươi.\n#F Bóng có sức thuyết phục gần như siêu nhiên, và nó thực sự có thể phát huy sức quyến rũ khi muốn.#!"
 TAINTED_TOUCH_PERK_EFFECT: "Mỗi 5 năm, 25% cơ hội nhận [GetModifier('tainted_touch_modifier').GetNameWithTooltip].\n#F Thorn này biến một oan hồn thành một dạng ả Typhoid Mary giữa những kẻ Restless.#!"
 THORN_SHADOWPLAY_PERK_EFFECT: "#F Bóng có thể đề nghị một hành động bổ sung cho Tâm Thức sau khi Oan Hồn đã dùng hết tất cả.#!"
 SHADOW_FAMILIAR_PERK_EFFECT: "Giảm cơ hội giành lại quyền kiểm soát Bóng của ngươi.\n#F Trong khi Bóng vẫn ở trong ý thức của một oan hồn, một Linh Thú Của Bóng có thể đóng vai trò như mắt, tai, và chân của nó.#!"
 FREUDIAN_SLIP_PERK_EFFECT: "Mỗi 5 năm, 25% cơ hội nhận [GetModifier('freudian_slip_modifier').GetNameWithTooltip].\n#F Với cái giá một điểm Angst, Bóng có thể buộc một oan hồn thực hiện một hành động đột ngột, không tự chủ, hoặc buông ra một câu nói bộc phát, chưa qua suy xét.#!"
 SHADOW_LIFE_PERK_EFFECT: "Tăng cơ hội mất quyền kiểm soát Bóng của ngươi.\n#F Bất cứ khi nào một oan hồn có Thorn này Slumber, Bóng của nàng sẽ giành quyền kiểm soát [Corpus|E] chung của họ và ra tay làm những điều tồi tệ nhất.#!"
 THORN_WHISPERS_PERK_EFFECT: "Tăng cơ hội mất quyền kiểm soát Bóng của ngươi.\nGiảm cơ hội giành lại quyền kiểm soát Bóng của ngươi.\n#F Bóng có Thorn này có thể trò chuyện với Bóng của những oan hồn khác mà Tâm Thức của chúng không hề hay biết.#!"
 THORN_MANIFESTATION_PERK_EFFECT: "Mỗi 5 năm, 25% cơ hội nhận [GetModifier('thorn_manifestation_modifier').GetNameWithTooltip].\n#F Bằng cách tiêu hao Angst, Bóng có thể hiện hình thành một thực thể tách biệt khỏi oan hồn.#!"
 DEVILS_DARE_PERK_EFFECT: "Số Đam Mê Đen Tối: #N +1#!\n#F Thách Thức Của Quỷ là phiên bản cảm xúc của trò chơi đối đầu ai chịu thua trước. Để dùng Thorn này, Bóng đầu tư một số Angst và viết ra điều mà nàng thách thức Tâm Thức phải làm.#!"
 VAMPIRIC_NATURE_PERK_EFFECT: "Mỗi 5 năm [perk|E] tăng cường Bóng của ngươi nhận thêm một cơ hội kích hoạt.\n#F Thorn này cho phép một Bóng hút Angst từ người khác để phục vụ mục đích riêng của nó.#!"

