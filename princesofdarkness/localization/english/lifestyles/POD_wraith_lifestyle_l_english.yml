 SLEEPSENSE_PERK_EFFECT: "#F Một Sandman có thể quan sát giấc mơ của một phàm nhân hoặc oan hồn đang Slumber, và có thể biết được một phàm nhân đã đạt đến giai đoạn giấc ngủ nào.#!"
 LINGUA_PERK_EFFECT: "#F Một Sandman có thể giao tiếp qua một giấc mơ, bất kể ngôn ngữ nào.#!"
 DREAM_SEQUENCE_PERK_EFFECT: "#F Một Sandman có thể làm mờ đi tâm trí của một phàm nhân đã nhìn xuyên qua Fog, khiến họ tin rằng đó chỉ là một giấc mơ. Những Sandman quyền năng có thể dùng năng lực này để thuyết phục một sinh vật siêu nhiên rằng họ đã không nhìn thấy điều họ thực sự đã thấy.#!"
 MORPHEAN_EMBRACE_PERK_EFFECT: "Là một [character_interaction|E], cho phép ngươi từ từ khuất phục mục tiêu, cuối cùng dẫn đến [GetTrait('torpor').GetName( GetPlayer )].\n#F Một Sandman có thể ban giấc ngủ và những giấc mơ lên một oan hồn.#!"
 INCUBUS_PERK_EFFECT: "Mở khóa Rút Cạn Năng Lượng [character_interaction|E], cho phép dùng tài nguyên của mục tiêu để nhận Pathos.\n#F Một Sandman có thể rút năng lượng từ một phàm nhân dưới dạng Pathos.#!"
 AGON_PERK_EFFECT: "$POD_can_covert_to_wraith_trigger_loca$\n#F Một Sandman có thể xé linh hồn của một phàm nhân ra khỏi thân xác họ.#!"
 ONEIRATAXIA_PERK_EFFECT: "Là một [character_interaction|E], cho phép ngươi khiến mục tiêu rời khỏi [GetTrait('torpor').GetName( GetPlayer )].\n#F Cho phép một Sandman ngăn một phàm nhân ngủ, ngăn một oan hồn Slumber, khiến một kẻ đang ngủ tỉnh dậy, hoặc ngăn một phàm nhân mơ.#!"
 
