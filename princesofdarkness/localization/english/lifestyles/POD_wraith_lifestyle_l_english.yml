 ENSHROUD_PERK_EFFECT: "Không còn cần hiến tế để tiếp cận [UmbraGlossary('tempest')].\n#F Một Sứ Giả có thể thao túng lớp màng ngăn giữa [UmbraGlossary('shadowlands')] và [UmbraGlossary('tempest')], cho phép họ bước vào [UmbraGlossary('tempest')] mà không cần mở [GetModifier('nihil_modifier').GetNameWithTooltip] hoặc dùng [UmbraGlossary('tempest')] để ẩn náu.#!"
 WEATHER_EYE_PERK_EFFECT: "Cho phép dự đoán các hiểm họa tự nhiên.\n#F Một Sứ Giả luôn nhận biết được tình trạng hiện tại của [UmbraGlossary('tempest')] gần đó, và có thể đi đường tắt giữa hai địa điểm trong [UmbraGlossary('shadowlands')].#!"
 PHANTOM_WINGS_PERK_EFFECT: "#F Một Sứ Giả có thể mọc cánh để lượn qua [UmbraGlossary('tempest')] và [UmbraGlossary('shadowlands')].#!"
 RETURN_PERK_EFFECT: "Là một [character_interaction|E], có thể dịch chuyển tức thời đến [UmbraGlossary('shadowlands')]\n#F Một Sứ Giả có thể di chuyển từ bất kỳ địa điểm nào trong [UmbraGlossary('tempest')] về nhà mình theo lộ trình nhanh nhất có thể.#!"
 FLICKER_PERK_EFFECT: "#F Một Sứ Giả có thể uốn cong [UmbraGlossary('tempest')] để dịch chuyển tức thời bản thân đến một địa điểm khác.#!"
 STORMREADER_PERK_EFFECT: "Bạn sẽ không còn bị lạc trong [UmbraGlossary('tempest')].\n#F Một Sứ Giả có được giác quan trực giác về [UmbraGlossary('tempest')], cho phép họ rút ngắn thời gian di chuyển khi đến hoặc rời khỏi một địa điểm trong [UmbraGlossary('tempest')], và định hướng để tránh một cơn Maelstrom hoặc giảm nhẹ tác động của nó.#!"
 TEMPEST_RIDERS_CANCELEER_PERK_EFFECT: "#F Một Sứ Giả có thể mọc đôi cánh đen ánh kim, cho phép họ lượn bay, tấn công, và bảo vệ người khác.#!"
 ARCANOI_OUBLIETTE_PERK_EFFECT: "Mở khóa tùy chọn [execution|E] $EXECUTION_BANISH_TO_TEMPEST$ cho tù nhân [GetTrait('wraith').GetName( GetNullCharacter )].\n#F Một Sứ Giả có thể đày một oan hồn khác thẳng vào [UmbraGlossary('tempest')].#!"
 
