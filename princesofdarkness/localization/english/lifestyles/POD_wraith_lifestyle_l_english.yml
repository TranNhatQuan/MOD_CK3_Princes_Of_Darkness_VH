 CONTROL_CREATURE_PERK_EFFECT: "Là một [character_interaction|E], cho phép ngươi nhận một thú cưng.\nLà một [character_interaction|E], cho phép ngươi gọi thú cưng của mình ra trận.\nCó thể chiêu mộ nhiều loại động vật làm [men_at_arms|E].\n#F Năng lực này tương tự Ghì Cương Tâm Trí, nhưng chỉ có thể dùng lên động vật.#!"
