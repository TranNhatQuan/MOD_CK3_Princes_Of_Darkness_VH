 game_concept_arcanoi_lifestyle: "Arcanoi"
 game_concept_arcanoi_lifestyle_desc: "$game_concept_arcanoi_lifestyle$ phù hợp với $POD_splat_wraith_plural$. Là nghệ thuật của người chết, Arcanoi là những khả năng tâm linh bí mật có thể được truyền dạy hoặc lĩnh hội qua trải nghiệm."
 
 game_concept_thorn_lifestyle: "Thorn"
 game_concept_thorn_lifestyle_desc: "$game_concept_arcanoi_lifestyle$ phù hợp với $POD_splat_wraith_plural$. Những năng lực đặc biệt, độc nhất mà Bóng có thể sử dụng."
 
 game_concept_jade_arcanoi: "Jade Arcanoi"
 game_concept_jade_arcanoi_lifestyle: "Jade Arcanoi"
 game_concept_jade_arcanoi_lifestyle_desc: "$game_concept_jade_arcanoi_lifestyle$ phù hợp với $POD_splat_wraith_plural$. Arcanoi của các oan hồn thuộc Suối Vàng."

 game_concept_true_jade: "True Jade"
 game_concept_true_jade_desc: "True Jade được cho là một phần linh hồn của Vũ Trụ ở dạng rắn. Khi True Jade đến Suối Vàng, chỉ có các Nghệ Nhân mới biết cách tạo ra những vật phẩm mới và uy lực từ nó."

 game_concept_dark_arcanoi: "Dark Arcanoi"
 game_concept_dark_arcanoi_lifestyle: "Dark Arcanoi"
 game_concept_dark_arcanoi_lifestyle_desc: "$game_concept_dark_arcanoi_lifestyle$ phù hợp với $POD_splat_wraith_plural$. Một Dark Arcanos là một Arcanos chuyên biệt được cấp năng lượng bởi Angst và [UmbraGlossary('oblivion')]. Những khả năng này chủ yếu được các Spectre sử dụng để phụng sự [UmbraGlossary('oblivion')] và hành hạ cả oan hồn lẫn Kẻ Sống."

 game_concept_misc_arcanoi: "Miscellaneous Arcanoi"
 game_concept_misc_arcanoi_lifestyle: "Miscellaneous Arcanoi"
 game_concept_misc_arcanoi_lifestyle_desc: "$game_concept_misc_arcanoi_lifestyle$ phù hợp với $POD_splat_wraith_plural$. Những khả năng được các Risen sử dụng, hay các oan hồn đã tìm cách trở lại thân xác cũ của mình, cùng Arcanos của các oan hồn thuộc những [Glossary('Dark Kingdom','game_concept_dark_kingdom_desc')] khác."

