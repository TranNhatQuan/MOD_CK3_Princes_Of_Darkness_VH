 BULWARK_PERK_EFFECT: "Giảm khả năng nhận [stress|E] khi thực hiện hành động Phiêu Lưu Vào Maelstrom [umbra|E].\n#F Một Người Xá Tội có thể tạm thời che chắn bản thân hoặc người khác khỏi một cơn Maelstrom.#!"
 TRANSFER_ANGST_PERK_EFFECT: "Là một [character_interaction|E], có thể lưu trữ 50 [static_stress|E] trong 5 năm, sau đó bạn sẽ nhận 80 [static_stress|E]\n#F Một Người Xá Tội có thể tạm thời giữ Angst trong chính mình cho đến khi có thể chuyển nó đến nơi lưu trữ thích hợp.#!"
 TRIMMING_THE_BLACK_ROSE_PERK_EFFECT: "Là một [character_interaction|E], loại bỏ 1 [perk|E] [thorn_lifestyle|E], hoặc mất 50 [static_stress|E]\n#F Một Người Xá Tội có thể ngăn một Bóng sử dụng Gai của nó.#!"
 COOLING_THE_BLOOD_PERK_EFFECT: "Số lượng đam mê đen tối: #P -1#!\n#F Một Người Xá Tội có thể làm suy yếu Đam Mê Đen Tối của một Bóng.#!"
 DEFIANCE_PERK_EFFECT: "Kháng cự Bóng có khả năng thành công cao hơn\nGiảm khả năng mất quyền kiểm soát vào tay bóng\n#F Một Người Xá Tội có thể đẩy lùi một Bóng mạnh mẽ đang cố chiếm quyền kiểm soát một oan hồn.#!"
 SHADOW_WRACK_PERK_EFFECT: "Giảm mạnh khả năng mất quyền kiểm soát vào tay bóng\n#F Một Người Xá Tội có thể dùng phép này để tước đoạt Angst của một [GetTrait('spectre').GetName( GetNullCharacter )] và kéo Tâm Thức của họ trở lại vị trí chủ đạo trong nhân cách.#!"
 
