 REIN_IN_THE_MIND_PERK_EFFECT: "Mở khóa cấp độ cao nhất của [GetPerk('twitch_perk').GetName(GetPlayer)] [character_interaction|E].\n#F Một Puppeteer có thể giành quyền kiểm soát gần như hoàn toàn lên một vật chủ.#!"
