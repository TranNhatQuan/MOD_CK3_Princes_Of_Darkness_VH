 BONTE_ABYSSALE_PERK_EFFECT: "Nhận quyền tiếp cận một hồi âm ngẫu nhiên của một cổ vật lịch sử mỗi #V 3#! năm.\n#F Một Serviteur lập một khế ước với Les Mysteres cho phép họ triệu hồi một Di Vật hay Cổ Vật từ Hòn Đảo Dưới Đáy Biển.#!"

