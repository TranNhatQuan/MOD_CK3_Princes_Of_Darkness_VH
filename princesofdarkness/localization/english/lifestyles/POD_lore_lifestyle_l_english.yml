 LORE_TRANSLATE_PERK_EFFECT: "#flavor Kẻ Sa Ngã có thể chuyển ngữ bất kỳ ngôn ngữ nói nào của người thường, cũng như biến đổi một trạng thái vật chất (nước) thành trạng thái khác (băng).#!"
 LORE_MANIPULATE_ADHESION_PERK_EFFECT: "Mở khóa một động tác [single_combat_duel|E].\nDưới dạng [character_interaction|E], củng cố một mối quan hệ ngẫu nhiên của mục tiêu.\n#flavor Kẻ Sa Ngã có thể điều khiển lực kết dính của vật thể và con người.#!"
 LORE_MANIPULATE_INERTIA_PERK_EFFECT: "Mở khóa một động tác [single_combat_duel|E].\nDưới dạng [character_interaction|E], phá vỡ một mối quan hệ ngẫu nhiên của mục tiêu.\n#flavor Kẻ Sa Ngã có thể điều khiển quán tính của vật thể và con người.#!"
 LORE_MANIPULATE_COHESION_PERK_EFFECT: "Mở khóa một động tác [single_combat_duel|E].\nDưới dạng [character_interaction|E], thay đổi tính cách hoặc xu hướng tính dục của mục tiêu.\nMở khóa một tùy chọn hành hình mới.\n#flavor Kẻ Sa Ngã có thể điều khiển sự liên kết của vật thể và con người.#!"
 LORE_FADE_PERK_EFFECT: "Dưới dạng [character_interaction|E], khiến mục tiêu mất toàn bộ [prestige|E] và [piety|E].\n#flavor Kẻ Sa Ngã có thể khiến bất cứ thứ gì phai mờ vào quên lãng, dù đó là một con người hay các định luật vật lý.#!"

 lore_reality_tremors_perk_name: "Chấn Động Thực Tại"
 lore_lash_of_corruption_perk_name: "Roi Suy Đồi"
 lore_wave_of_mutilation_perk_name: "Đợt Sóng Tàn Phá"
 lore_summon_outsider_perk_name: "Triệu Hồi Kẻ Ngoại Lai"
 lore_unspeakable_survivor_perk_name: "Kẻ Hầu Cận Khôn Tả"

 LORE_REALITY_TREMORS_PERK_EFFECT: "Gây cho mọi lãnh chủ ở phía đối địch [GetModifier('lore_reality_tremors_modifier').GetNameWithTooltip] khi bắt đầu một [war|E] với vai trò bên tấn công hoặc bên phòng thủ chính.\n#flavor The Earthbound có thể làm rung chuyển nền tảng của thực tại.#!"
 LORE_LASH_OF_CORRUPTION_PERK_EFFECT: "Cải thiện [modifier|E] từ [GetPerk('lore_reality_tremors_perk').GetName(GetPlayer)] thành [GetModifier('lore_lash_of_corruption_modifier').GetNameWithTooltip].\n#flavor The Earthbound có thể làm suy đồi thực tại đến khi nó rạn nứt từng đường nối.#!"
 LORE_WAVE_OF_MUTILATION_PERK_EFFECT: "Cải thiện [modifier|E] từ [GetPerk('lore_reality_tremors_perk').GetName(GetPlayer)] thành [GetModifier('lore_wave_of_mutilation_modifier').GetNameWithTooltip].\n#flavor The Earthbound có thể lột da thực tại đến khi nó sụp đổ hoàn toàn.#!"
 LORE_SUMMON_OUTSIDER_PERK_EFFECT: "Có thể tuyển mộ [GetMaA('the_unnamable').GetName] làm [men_at_arms|E].\nDưới dạng [character_interaction|E], phá hủy toàn bộ công trình tại vùng đất nơi bạn đang ở.\n#flavor The Earthbound có thể mở đường cho những thực thể không thuộc về thực tại này.#!"
 LORE_UNSPEAKABLE_SURVIVOR_PERK_EFFECT: "Có thể cải thiện Nghi Lễ Linh Hồn Ly Tán lên một cấp độ trước đây không thể tiếp cận.\n#flavor The Earthbound có thể tập trung quyền kiểm soát thực tại của mình vào một vật chứa hoàn hảo, vĩnh cửu.#!"

 lore_command_the_flame_perk_name: "Điều Khiển Ngọn Lửa"
 lore_aura_of_legend_perk_name: "Hào Quang Truyền Thuyết"
 lore_the_mark_of_the_celesitals_perk_name: "Dấu Ấn Của Các Thiên Thể"
 lore_hand_of_faith_perk_name: "Bàn Tay Đức Tin"
 lore_revelation_perk_name: "Khải Thị"

 LORE_COMMAND_THE_FLAME_PERK_EFFECT: "Gây cho mọi lãnh chủ ở phía đối địch [GetModifier('lore_command_the_flame_modifier').GetNameWithTooltip] khi bắt đầu một [war|E] với vai trò bên tấn công hoặc bên phòng thủ chính.\n#flavor Kẻ Sa Ngã có thể điều khiển ngọn lửa của thần thánh.#!"
 LORE_AURA_OF_LEGEND_PERK_EFFECT: "#flavor Kẻ Sa Ngã có thể xuất hiện như một truyền thuyết sống, hay thậm chí là một vị thần.#!"
 LORE_THE_MARK_OF_THE_CELESITALS_PERK_EFFECT: "Dưới dạng [character_interaction|E], ban cho mục tiêu (kể cả chính bạn) [GetModifier('lore_the_mark_of_the_celesitals_good_modifier').GetNameWithTooltip] hoặc [GetModifier('lore_the_mark_of_the_celesitals_bad_modifier').GetNameWithTooltip].\n#flavor Kẻ Sa Ngã có thể lưu lại một dấu ấn thần thánh trên người khác, ban cho họ vận may hoặc vận rủi.#!"
 LORE_HAND_OF_FAITH_PERK_EFFECT: "Có thể [POD_banish|E] $POD_splat_wraith_plural$, $POD_splat_fae_plural$ hoặc $POD_splat_demon_plural$ về lại cõi [umbra|E] nguyên bản của chúng.\n#flavor Kẻ Sa Ngã có thể buộc những thực thể không do Chúa tạo ra phải lưu vong.#!"
 LORE_REVELATION_PERK_EFFECT: "Dưới dạng [character_interaction|E], biết được toàn bộ bí mật và âm mưu của mục tiêu.\n#flavor Kẻ Sa Ngã có thể đọc những sinh vật trên Đất của Chúa như một cuốn sách mở.#!"

