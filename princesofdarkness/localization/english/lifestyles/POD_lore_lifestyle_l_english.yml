 LORE_CLEANSE_PERK_EFFECT: "Dưới dạng [character_interaction|E], loại bỏ toàn bộ chấn thương, bệnh tật và các chứng bệnh tâm thần.\n#flavor Kẻ Sa Ngã có thể thanh tẩy một sinh vật sống khỏi mọi gánh nặng đè lên họ.#!"
 LORE_COMMAND_THE_WIND_PERK_EFFECT: "#flavor Kẻ Sa Ngã có thể điều khiển những cơn gió bằng ý chí của mình.#!"
 LORE_MANY_PLACES_AT_ONCE_PERK_EFFECT: "$countermeasures_unlocks_t4_supernatural_high_alert$ \n #flavor Kẻ Sa Ngã có thể nhìn qua mắt của những sinh vật sống ở gần.#!"
 LORE_ANIMATE_PERK_EFFECT: "Có thể tuyển mộ [GetMaA('golems').GetName], [GetMaA('guardians').GetName] và [GetMaA('homunculus').GetName] làm [men_at_arms|E].\n#flavor Kẻ Sa Ngã có thể thổi sinh khí vào vật chất vô tri.#!"
 LORE_RESTORE_LIFE_PERK_EFFECT: "Dưới dạng [character_interaction|E], khiến một $POD_splat_wraith$ đã bị ràng buộc trở lại làm người thường, và nhận 10 Resolve trong quá trình đó.\n#flavor Kẻ Sa Ngã có thể trả lại hơi thở sự sống cho người đã chết.#!"

