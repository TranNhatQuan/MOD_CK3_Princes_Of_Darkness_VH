 LORE_EARTH_MELD_PERK_EFFECT: "#flavor Kẻ Sa Ngã có thể tạo hình đá và khoáng vật thành vũ khí.#!"
 LORE_CREATE_OBJECT_PERK_EFFECT: "$unlock_forging_node$ Thêm một [modifier|E] dựa trên loại [artifact|E] với chi phí 3 Resolve.\n#flavor Kẻ Sa Ngã có thể tạo ra vật thể từ không khí.#!"
 LORE_ENCHANT_OBJECT_PERK_EFFECT: "Cải thiện [GetPerk('lore_create_object_perk').GetName(GetPlayer)] bằng cách ban 2 [modifiers|E] thay vì 1.\n#flavor Kẻ Sa Ngã có thể phù chú các vật thể thông thường với quyền năng siêu nhiên.#!"
 LORE_MOLD_EARTH_PERK_EFFECT: "Cải thiện [GetPerk('lore_enchant_object_perk').GetName(GetPlayer)] bằng cách giảm chi phí từ 3 resolve xuống 2.\n#flavor Kẻ Sa Ngã có thể tạo hình kim loại và hợp kim như đất sét.#!"
 LORE_ALTER_PATH_PERK_EFFECT: "Gây cho mọi lãnh chủ ở phía đối địch [GetModifier('lore_alter_path_modifier').GetNameWithTooltip] khi bắt đầu một [war|E] với vai trò bên tấn công hoặc bên phòng thủ chính.\n#flavor Kẻ Sa Ngã có thể bẻ cong quan hệ không gian giữa các vật thể.#!"

