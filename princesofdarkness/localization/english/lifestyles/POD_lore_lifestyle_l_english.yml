 LORE_FORESEE_PERK_EFFECT: "$countermeasures_unlocks_t4_all_seeing_eye$ \n  Bạn sẽ nhận được thông báo nếu có ai đó có ý định giết bạn bè hoặc gia đình của bạn.\nBạn sẽ nhận được thông báo nếu có ai đó có ý định dụ dỗ người yêu hoặc tình nhân của bạn.\n#flavor Kẻ Sa Ngã có thể bắt gặp những thoáng nhìn về các sợi chỉ của số phận.#!"
 LORE_TELEPORT_PERK_EFFECT: "Dưới dạng [character_interaction|E], cho phép bạn dịch chuyển quân đội của mình đến vị trí của mục tiêu, hoặc dịch chuyển đến điểm đến kế tiếp khi đang di chuyển.\n#flavor Kẻ Sa Ngã có thể du hành theo những sợi chỉ của số phận.#!"
 LORE_ILLUSION_PERK_EFFECT: "#flavor Kẻ Sa Ngã có thể tạo ra những ảo ảnh sống động như thật.#!"
 LORE_CAUSAL_INFLUENCE_PERK_EFFECT: "#flavor Kẻ Sa Ngã có thể trực tiếp điều khiển các sợi chỉ của số phận.#!"
 LORE_COHERENT_LIGHT_PERK_EFFECT: "#flavor Kẻ Sa Ngã có thể tạo ra những ảo ảnh chân thực.#!"

 lore_manipulate_weather_perk_name: "Điều Khiển Thời Tiết"
 lore_inspire_perk_name: "Truyền Cảm Hứng"
 lore_alter_appearance_perk_name: "Thay Đổi Ngoại Hình"
 lore_command_the_storm_perk_name: "Điều Khiển Bão Tố"
 lore_shapechange_perk_name: "Biến Đổi Hình Dạng"

 LORE_MANIPULATE_WEATHER_PERK_EFFECT: "Dưới dạng [character_interaction|E], ban [GetModifier('lore_manipulate_weather_good_modifier').GetNameWithTooltip] hoặc [GetModifier('lore_manipulate_weather_bad_modifier').GetNameWithTooltip] cho [county|E] nơi bạn đang ở.\n#flavor Kẻ Sa Ngã có thể gợi lên nỗi kinh sợ bằng cách kiểm soát thời tiết.#!"
 LORE_INSPIRE_PERK_EFFECT: "Dưới dạng [character_interaction|E], ban nguồn cảm hứng cho người khác.\n#flavor Kẻ Sa Ngã có thể truyền cảm hứng cho những sinh vật khác để mang thêm vẻ đẹp vào thế giới.#!"
 LORE_ALTER_APPEARANCE_PERK_EFFECT: "Dưới dạng [character_interaction|E], khiến mục tiêu trở nên đẹp hơn hoặc xấu hơn.\n#flavor Kẻ Sa Ngã có thể ban vẻ đẹp cho những sinh vật khác, hoặc lấy đi nó.#!"
 LORE_COMMAND_THE_STORM_PERK_EFFECT: "Cải thiện [GetPerk('lore_manipulate_weather_perk').GetName(GetPlayer)] bằng cách cho phép nó ảnh hưởng đến toàn bộ một [duchy|E].\n#flavor Kẻ Sa Ngã có thể gợi lên sự uy nghiêm bằng cách kiểm soát những cơn bão khổng lồ.#!"
 LORE_SHAPECHANGE_PERK_EFFECT: "Dưới dạng [character_interaction|E], thay đổi các đặc điểm thể chất của mục tiêu, kể cả chính bạn.\n#flavor Kẻ Sa Ngã có thể tạo ra vẻ đẹp khác thường bằng cách nhồi nắn hình dạng của những sinh vật khác.#!"

 lore_command_animals_perk_name: "Điều Khiển Động Vật"
 lore_manipulate_flesh_perk_name: "Điều Khiển Thịt Da"
 lore_command_the_wild_perk_name: "Điều Khiển Hoang Dã"
 lore_mutate_plant_perk_name: "Biến Đổi Thực Vật"
 lore_create_chimera_perk_name: "Tạo Ra Chimera"

 LORE_COMMAND_ANIMALS_PERK_EFFECT: "Có thể tuyển mộ nhiều loại [men_at_arms|E] động vật.\n#flavor Kẻ Sa Ngã có thể kiểm soát các sinh vật của Trái Đất.#!"
 LORE_MANIPULATE_FLESH_PERK_EFFECT: "#flavor Kẻ Sa Ngã có thể điều khiển thịt da của các sinh vật sống.#!"
 LORE_COMMAND_THE_WILD_PERK_EFFECT: "Dưới dạng [character_interaction|E], ban [GetModifier('lore_command_the_wild_good_modifier').GetNameWithTooltip] hoặc [GetModifier('lore_command_the_wild_bad_modifier').GetNameWithTooltip] cho [county|E] nơi bạn đang ở.\n#flavor Kẻ Sa Ngã có thể điều khiển sinh lực của cây cối và hoa màu.#!"
 LORE_MUTATE_PLANT_PERK_EFFECT: "Cải thiện [GetPerk('lore_command_the_wild_perk').GetName(GetPlayer)] bằng cách cho phép nó ảnh hưởng đến toàn bộ một [duchy|E].\n#flavor Kẻ Sa Ngã có thể biến đổi thực vật thành những hình dạng mới.#!"
 LORE_CREATE_CHIMERA_PERK_EFFECT: "#flavor Kẻ Sa Ngã có thể tự do biến đổi và tạo ra các loài động vật mới.#!"

