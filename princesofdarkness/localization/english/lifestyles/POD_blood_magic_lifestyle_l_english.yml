 HIGH_NECTAR_PERK_EFFECT: "Tăng hiệu ứng của [bs_spell|E] [GetPerk('complex_nectar_perk').GetName(GetPlayer)] lên 4 chấm.\n#weak Bằng cách ủ một thứ dung dịch từ $pod_vitae$ của chính mình, rakta-sadhu có thể truyền cho người uống bốn cấp độ của một discipline hoặc path#!"
 UNGODLY_NECTAR_PERK_EFFECT: "Tăng hiệu ứng của [bs_spell|E] [GetPerk('high_nectar_perk').GetName(GetPlayer)] lên 5 chấm.\n#weak Bằng cách ủ một thứ dung dịch từ $pod_vitae$ của chính mình, rakta-sadhu có thể truyền cho người uống năm cấp độ của một discipline hoặc path#!"

