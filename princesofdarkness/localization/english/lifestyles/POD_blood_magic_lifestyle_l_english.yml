 TONGUE_OF_THE_TEMPTER_PERK_EFFECT: "Với vai trò [bs_spell|E], biết được một [secret|E] của mục tiêu.\n#weak Khiến một đối tượng tiết lộ một nỗi sợ hoặc khát khao thầm kín.#!"
 VOICE_OF_THE_PROPHET_PERK_EFFECT: "Với vai trò [bs_spell|E], khiến mục tiêu tăng thiện cảm với bạn và mất [piety|E] cùng [prestige|E].\n#weak Truyền đạt một thông điệp bí ẩn chạm đến khát khao sâu thẳm nhất của người nghe.#!"
 LORD_OF_STORMS_PERK_EFFECT: "Ban [GetModifier('lord_of_storms_modifier').GetNameWithTooltip] cho [knights|E] địch khi đang giữ vai [commander|E] trong [combat_phase|E], hoặc cho đối thủ của bạn trong [single_combat_duel_plural|E]\n#weak Triệu hồi một trận bão cát hoặc bão sấm sét.#!"
 DARK_INVOCATION_PERK_EFFECT: "#weak Đặt một lời nguyền bảo vệ lên một vật thể hoặc địa điểm.#!"

