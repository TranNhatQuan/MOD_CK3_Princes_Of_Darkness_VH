 MUTATE_PERK_EFFECT: "Là một [bs_spell|E], đổi 80 [gold|E][gold_i|E] lấy 120 [gold|E][gold_i|E].\n#weak Thay đổi nhỏ về số nguyên tử\nThay đổi lớn về thành phần cấu tạo#!"
 TRANSMUTATE_PERK_EFFECT: "Cải thiện [GetPerk('mutate_perk').GetName(GetPlayer)], cho phép đổi 40 [gold|E][gold_i|E] lấy 140 [gold|E][gold_i|E].\n#weak Thay đổi lớn về số nguyên tử\nThay đổi triệt để về thành phần cấu tạo#!"

