 temperance_perk_name: "Sự Điều Độ"

 FIRST_TASTE_PERK_EFFECT: "Với vai trò [bs_spell|E], ban cho mục tiêu [GetModifier('first_taste_modifier').GetNameWithTooltip] trong 20 năm.\n#weak Tạo ra một sự liên tưởng khoái lạc với một hành động nhỏ, lặp đi lặp lại.#!"
 CROSS_ADDICTION_PERK_EFFECT: "Tăng tỉ lệ thành công của [bs_spell|E] [GetPerk('first_taste_perk').GetName(GetPlayer)].\n#weak Tạm thời thay đổi thứ mà một người nghiện đang ám ảnh.#!"
 THE_JONES_PERK_EFFECT: "Với vai trò [bs_spell|E], khiến một mục tiêu chịu ảnh hưởng của [GetModifier('first_taste_modifier').GetNameWithTooltip] mất [piety|E] và [prestige|E].\n#weak Xóa bỏ sự kiềm chế của một đối tượng khỏi việc thỏa mãn cơn nghiện của mình.#!"
 FATAL_COMPULSION_PERK_EFFECT: "Với vai trò [bs_spell|E], khiến một mục tiêu chịu ảnh hưởng của [GetModifier('first_taste_modifier').GetNameWithTooltip] nhận [GetModifier('fatal_compulsion_modifier').GetNameWithTooltip] trong 5 năm thay vào đó.\n#weak Khiến một mục tiêu chịu tổn hại vì không thỏa mãn cơn nghiện của mình.#!"
 TEMPERANCE_PERK_EFFECT: "Với vai trò [bs_spell|E], khiến một mục tiêu chịu ảnh hưởng của [GetModifier('first_taste_modifier').GetNameWithTooltip] trở nên [GetTrait('depressed_1').GetName(GetPlayer)].\n#weak Khiến đối tượng không thể tìm thấy khoái lạc từ cơn nghiện của mình.#!"


##Koldunic
#Transylvanian Kraina
 burebistas_throne_perk_name: "Ngai Vàng Của Burebista"
 BUREBISTAS_THRONE_PERK_EFFECT: "#flavor Vua Burebista, người đã khủng bố người Hy Lạp qua nhiều thế kỷ, đã xây một ngai vàng vĩ đại trên đỉnh núi, từ đó ông có thể quan sát toàn bộ lãnh địa và kẻ thù của mình. Burebista không còn cần đến ngai vàng của mình nữa và đã truyền lại cho những con cái Koldun của ông.#!"
 pietrosus_hospitality_perk_name: "Sự Tiếp Đón Của Pietrosu"
 PIETROSUS_HOSPITALITY_PERK_EFFECT: "#flavor Những cơn gió cắn xé và cái lạnh buốt giá của núi Pietrosu có thể giết chết một người không được bảo vệ trong khoảnh khắc. Koldun triệu hồi những cơn gió mạnh mẽ và lạnh buốt này để bao trùm quanh mình, gây hại cho tất cả những ai ở gần. Điều này cũng khiến hắn miễn nhiễm với lạnh giá và sức mạnh của gió.#!"
 the_banks_of_the_basca_perk_name: "Bờ Sông Basca"
 THE_BANKS_OF_THE_BASCA_PERK_EFFECT: "Tăng đáng kể tỉ lệ [imprison|E] [characters|E] sau một [siege|E] hoặc [raid|E] thành công tại các tỉnh duyên hải.\n\n#flavor Khi những cơn mưa đổ về, sông Basca tràn qua bờ và cuốn trôi cả những ngôi làng, cùng với bất kỳ ai không đủ khôn ngoan để tìm nơi cao hơn. Koldun sở hữu năng lực này mang theo sức mạnh cuồn cuộn của Basca đến bất cứ nơi nào cô đi qua.#!"
 kupalas_exhalation_perk_name: "Hơi Thở Của Kupala"
 KUPALAS_EXHALATION_PERK_EFFECT: "[bs_spell|E]: Ban cho địa điểm của bạn [GetModifier('kupalas_exhalation_modifier').GetNameWithTooltip] trong 5 năm.\n[kraina|E]: Ban cho nó [GetModifier('kupalas_exhalation_modifier2').GetNameWithTooltip] thay vào đó.\n\n#flavor Koldun triệu hồi những luồng khí lạnh chết người từ dưới đất. Bất kỳ ngọn lửa nào cũng có thể kích nổ những luồng khí này thành một vụ nổ khủng khiếp. Những luồng khí này được cho là hơi thở của Kupala.#!"
 restless_medias_perk_name: "Medias Bất An"
 RESTLESS_MEDIAS_PERK_EFFECT: "[bs_spell|E]: Ban cho địa điểm của bạn [GetModifier('weather_magic_earthquake_modifier').GetNameWithTooltip] trong 10 năm.\n[kraina|E]: Ban cho tất cả các quận xung quanh luôn.\n\n#flavor Đôi lúc, mặt đất dưới làng Medias lại rung chuyển và quằn quại, xé toạc các công trình khỏi nền móng của chúng. Người dân đổ lỗi cho các vị thần, nhưng Koldun biết đó chính là Kupala, đang cựa mình bất an trong ngôi mộ đất của hắn. Những Koldun tài giỏi nhất biết cách khơi dậy sự kích động của hắn.#!"

#Black Sea Kraina
 danubian_voices_perk_name: "Tiếng Nói Sông Danube"
 DANUBIAN_VOICES_PERK_EFFECT: "#flavor Koldun biết giá trị thật sự của sông Danube. Các linh hồn của dòng sông trò chuyện với họ, truyền đạt những gì chúng biết hoặc chuyển giao thông điệp cho Koldun.#!"
 grave_of_the_marea_neagra_perk_name: "Mộ Phần Của Marea Neagra"
 GRAVE_OF_THE_MAREA_NEAGRA_PERK_EFFECT: "#flavor Koldun luôn có thể an toàn lặn xuống độ sâu thấp nhất của Biển Đen, nơi cô có thể nghỉ ngơi thoải mái, được bảo vệ khỏi ánh nắng và thế giới bên ngoài.#!"
 pontos_euxeinos_perk_name: "Pontos Euxeinos"
 PONTOS_EUXEINOS_PERK_EFFECT: "[bs_spell|E]: Hồi phục [POD_aggravated_damage|E] và các vết thương không vĩnh viễn.\n[kraina|E]: Ngoài ra còn nhận [GetModifier('pontos_euxeinos_modifier').GetNameWithTooltip] trong 10 năm.\n\n#flavor Người Hy Lạp từng gọi Biển Đen là Pontos Euxeinos, Biển Hiếu Khách. Đối với Koldun của Biển Đen, điều đó thực sự đúng, ôm họ vào lòng và chữa lành cho họ dù là những vết thương nặng nhất.#!"
 minions_of_deep_marmora_perk_name: "Thuộc Hạ Của Vực Sâu Marmora"
 MINIONS_OF_DEEP_MARMORA_PERK_EFFECT: "[bs_spell|E]: Triệu hồi một đội quân [GetMaA('water_spirits').GetName] để hỗ trợ bạn trong một cuộc chiến.\n[kraina|E]: Triệu hồi thêm một đội quân nữa.\n\n#flavor Truyền thuyết kể rằng Koldun Cyzicus phát hiện ra rằng nếu hắn đổ máu của mình vào biển Marmora, những sinh vật kỳ lạ từ vực sâu sẽ trồi lên để làm theo lệnh hắn. Các Koldun khác đã phát hiện ra rằng bất kỳ vùng nước nào cũng có tác dụng tương tự.#!"
 pontos_axeinos_perk_name: "Pontos Axeinos"
 PONTOS_AXEINOS_PERK_EFFECT: "[bs_spell|E]: Giảm [supplies|E] của một đội quân địch đã đổ bộ xuống #V 20%#!.\n[kraina|E]: Gây thêm thương vong cho đội quân đó.\n\n#flavor Trước khi người Hy Lạp định cư trên bờ biển phía nam của nó, họ gọi Biển Đen là Pontus Axeinos, Biển Khắc Nghiệt. Đối với kẻ thù của Koldun, nó thật sự có thể vô cùng khắc nghiệt.#!"


#Bialowieza Kraina
 domain_breach_perk_name: "Xâm Phạm Lãnh Địa"
 DOMAIN_BREACH_PERK_EFFECT: "#flavor Koldun hòa hợp với lãnh địa của mình đến mức có thể phát hiện khi có kẻ xâm nhập lọt vào trong biên giới của nó.#!"
 fingers_of_bialowieza_perk_name: "Những Ngón Tay Của Białowieża"
 FINGERS_OF_BIALOWIEZA_PERK_EFFECT: "Tỉ lệ [imprison|E]: #P +10%#!\nCó thể tuyển mộ [GetMaA('animated_tree').GetName] làm [men_at_arms|E].\n\n#flavor Koldun sở hữu năng lực này điều khiển cây cỏ xung quanh để bẫy và có thể làm bất động nạn nhân của họ.#!"
 grondrskas_impasse_perk_name: "Ngõ Cụt Của Grondrska"
 GRONDRSKAS_IMPASSE_PERK_EFFECT: "#flavor Câu chuyện kể về một kẻ săn trộm đã xâm nhập vào lãnh địa của Tzimisce. Không lâu sau đó, hắn đã bỏ chạy trong hoảng loạn tột độ. Hắn nghĩ mình biết rõ khu rừng, nhưng những hàng cây lại di chuyển quanh hắn, chặn hết đường thoát, dồn hắn thẳng đến chỗ Koldun đang chờ đợi.#!"
 mouth_of_djabalek_perk_name: "Miệng Của Djabalek"
 MOUTH_OF_DJABALEK_PERK_EFFECT: "Khi trận chiến bắt đầu, loại bỏ [knight|E] địch có [prowess|E] thấp nhất khỏi trận chiến và ăn thịt hắn.\n\n#flavor Djabelek là một Tzimisce đáng sợ bị chôn ở đâu đó trong Rừng Białowieza. Người ta nói rằng bằng cách nào đó hắn vẫn tiếp tục ăn dù đang trong trạng thái mê ngủ, mở miệng ra trong khi mơ, nuốt bất cứ thứ gì rơi vào. Koldun mở đất dưới chân nạn nhân của mình, đưa họ xuống để nuôi Djabelek.#!"
 the_white_tower_perk_name: "Tòa Tháp Trắng"
 THE_WHITE_TOWER_PERK_EFFECT: "#flavor Tòa Tháp Trắng là món quà do các ác thần của đất ban cho, những kẻ mà Djabelek từng lập giao ước với. Xương của tất cả nạn nhân của kraina Białowieza tự trồi lên khỏi mặt đất và bao bọc Koldun trong một tòa tháp bằng đất và xương.#!"

#Kraina of the Well
 call_the_children_perk_name: "Triệu Hồi Con Cái"
 CALL_THE_CHILDREN_PERK_EFFECT: "Có thể tuyển [GetMaA('demonhound').GetName] làm [men_at_arms|E].\n\n#flavor Để sai khiến một thứ, người ta phải tìm cách hiểu nó. Ác ma, chẳng khác gì chó săn, luôn sẵn lòng đến khi được chủ nhân gọi.#!"
 heed_the_hell_bound_heart_perk_name: "Lưu Tâm Trái Tim Buộc Chặt Địa Ngục"
 HEED_THE_HELL_BOUND_HEART_PERK_EFFECT: "[bs_spell|E]: Ban cho [GetTrait('demon').GetName(GetPlayer)] hoặc [GetTrait('witch').GetName(GetPlayer)] hiệu ứng [GetModifier('heed_the_hell_bound_heart_modifier').GetNameWithTooltip] trong 5 năm.\n[kraina|E]: Thay vào đó ban cho họ [GetModifier('heed_the_hell_bound_heart_modifier2').GetNameWithTooltip].\n\n#flavor Dù nhờ phước lành hay nhờ sự thân thuộc, một Koldun uống nước từ Giếng của mình sẽ có được giác quan siêu nhiên báo cho biết khi có ảnh hưởng của ác ma gần kề.#!"
 aegis_alighieri_perk_name: "Khiên Chắn Alighieri"
 AEGIS_ALIGHIERI_PERK_EFFECT: "Có được khả năng phòng thủ tinh thần mạnh mẽ chống lại [GetTrait('demon').GetName(GetPlayer)] và [GetTrait('witch').GetName(GetPlayer)].\nBan [GetModifier('aegis_alighieri_modifier').GetNameWithTooltip] cho [knights|E] của kẻ địch khi đóng vai [commander|E] trong [combat_phase|E], hoặc cho đối thủ trong [single_combat_duel_plural|E] nếu họ là [GetTrait('demon').GetName(GetPlayer)] hoặc [GetTrait('witch').GetName(GetPlayer)].\n\n#flavor Khiên Chắn Alighieri bảo vệ Koldun khỏi những cuộc tấn công hung tàn, sự săn đuổi và sự ô uế từ các thế lực ác ma.#!"
 heave_the_host_of_hell_perk_name: "Đẩy Lui Quân Đoàn Địa Ngục"
 HEAVE_THE_HOST_OF_HELL_PERK_EFFECT: "[bs_spell|E]: Gây #V [EmptyScope.ScriptValue('POD_base_fire_damage')|V0] sát thương Lửa#! lên [GetTrait('demon').GetName(GetPlayer)] hoặc [GetTrait('witch').GetName(GetPlayer)]\n[kraina|E]: Thay vào đó gây #V [EmptyScope.ScriptValue('POD_double_fire_damage')|V0] sát thương Lửa#!.\n\n#flavor Sau khi học được cách triệu hồi, cảm nhận, rồi phòng vệ trước sự tổn hại của địa ngục, Koldun có thể xóa sạch hoàn toàn những vết sẹo của nó.#!"
 reap_the_well_perk_name: "Gặt Hái Từ Giếng"
 REAP_THE_WELL_PERK_EFFECT: "Có thể tuyển [GetMaA('aughisky').GetName] làm [men_at_arms|E].\n\n#flavor Koldun triệu hồi những dây xích móc câu vương máu từ tay mình để trói buộc một ác ma vào sự phục dịch của hắn.#!"


#Kraina of Enoch
 shroud_of_oblivion_perk_name: "Màn Che Lãng Quên"
 SHROUD_OF_OBLIVION_PERK_EFFECT: "Có thể tương tác với các nhân vật ở phía bên kia của Bức Màn.\n\n#flavor Koldun xé một mảnh khỏi tấm vải của [UmbraGlossary('underworld')] để làm bão hòa khu vực xung quanh hắn bằng các thuộc tính của nó.#!"
 spectral_cloak_perk_name: "Áo Choàng U Hồn"
 SPECTRAL_CLOAK_PERK_EFFECT: "#flavor Bằng cách khai thác tầm nhìn của người chết, Koldun gieo rắc lên những kẻ ở gần một cái nhìn thoáng qua về thế giới của người chết. Áo choàng này che giấu Koldun và xua đuổi những kẻ quan sát trong kinh hoàng#!"
 pond_of_malevolent_dread_perk_name: "Ao Kinh Hãi Độc Địa"
 POND_OF_MALEVOLENT_DREAD_PERK_EFFECT: "[bs_spell|E]: Triệu hồi hai trung đoàn [GetMaA('spectres').GetName] để hỗ trợ bạn trong chiến tranh.\n[kraina|E]: Thay vào đó triệu hồi bốn trung đoàn.\n\n#flavor Nằm ngay phía trên vực thẳm trong Âm Phủ, không nơi nào lạnh lẽo, tối tăm, u ám hay hoang tàn hơn Biển Bóng Tối, một đại dương linh hồn trên bờ vực bị tiêu diệt hoàn toàn. Koldun tạo ra một trục để hút lấy từ định mệnh diệt vong của biển này và giải phóng dòng chảy của nó.#!"
 wrath_of_the_tempest_perk_name: "Cơn Thịnh Nộ Của Bão Tố"
 WRATH_OF_THE_TEMPEST_PERK_EFFECT: "[bs_spell|E]: Gây [stress|E] cho một nhân vật, tỉ lệ theo số nhân vật bạn đã giết.\n[kraina|E]: Ngoài ra còn gây #V [EmptyScope.ScriptValue('POD_base_lightning_damage')|V0] sát thương Sét#! lên họ.\n\n#flavor Koldun triệu hồi tiếng rên hấp hối của tất cả những ai nàng đã đánh bại, khoét một lỗ trên rào cản giữa các thế giới để cho cơn bão siêu hình rỉ máu qua.#!"
 hunger_of_the_void_perk_name: "Cơn Đói Của Hư Không"
 HUNGER_OF_THE_VOID_PERK_EFFECT: "[bs_spell|E]: Ban cho địa điểm của bạn [GetModifier('hunger_of_the_void_modifier').GetNameWithTooltip] trong 10 năm.\n[kraina|E]: Ngoài ra rút cạn máu tất cả [GetTrait('mortal').GetName(GetPlayer)] trong tỉnh đó.\n\n#flavor Koldun hiện thân cho những sự biến dạng của Bão Tố, tự hành hạ linh hồn mình để khoét một hố diệt vong hoàn hảo vào thực tại.#!"

#Genius Loci
 genius_loci_1_perk_name: "Genius Loci Sơ Cấp"
 GENIUS_LOCI_1_PERK_EFFECT: "Tăng tỉ lệ thành công của tất cả [krainas|E] lên #P +10%#!\n\n#flavor Koldun mở rộng nhận thức của mình qua vùng đất mà hắn đặt chân lên.#!\n@warning_icon!#warning Các đặc trưng từ nhánh này sẽ tự động có được khi hoàn thành các đường phái [kraina|E] khác.#!"
 genius_loci_2_perk_name: "Genius Loci Tiêu Chuẩn"
 GENIUS_LOCI_2_PERK_EFFECT: "Tăng tỉ lệ thành công của tất cả [krainas|E] lên #P +10%#!\nCó thể sử dụng [artifacts|E] loại [fetish|E].\n\n#flavor Koldun mở rộng thêm nhận thức của mình, cải thiện năng lực Koldun của hắn.#!"
 genius_loci_3_perk_name: "Genius Loci Bền Vững"
 GENIUS_LOCI_3_PERK_EFFECT: "[krainas|E] và các [bs_rituals|E] của chúng tốn ít hơn 1 @blood_icon! khi thi triển từ địa điểm được tăng cường của chúng.\n\n#flavor Loci của Koldun trở nên có thể tự duy trì bản thân.#!"
 genius_loci_4_perk_name: "Genius Loci Cao Cấp"
 GENIUS_LOCI_4_PERK_EFFECT: "Tăng tỉ lệ thành công của tất cả [krainas|E] lên #P +15%#!\n$countermeasures_unlocks_t3_all_seeing_eye$\n\n#flavor Loci của Koldun nhìn thấy tất cả.#!"
 genius_loci_5_perk_name: "Genius Loci Truyền Thuyết"
 GENIUS_LOCI_5_PERK_EFFECT: "[krainas|E] và các [bs_rituals|E] của chúng có thêm một hiệu ứng bổ sung khi thi triển từ địa điểm được tăng cường của chúng.\n\n#flavor Koldun và vùng đất hòa làm một.#!"

#Way of Earth
 grasping_soil_perk_name: "Đất Bấu Chặt"
 GRASPING_SOIL_PERK_EFFECT: "Ban cho [rulers|E] kẻ địch hiệu ứng [GetModifier('grasping_soil_modifier').GetNameWithTooltip] vào lúc bắt đầu [war|E].\n\n#flavor Koldun sai khiến đất trồi lên thành một vòi bụi và bò lên chân nạn nhân, khiến họ bất động.#!"
 endurance_of_stone_perk_name: "Sức Bền Của Đá"
 ENDURANCE_OF_STONE_PERK_EFFECT: "#flavor Rút lấy tinh chất của đất vào bản thân, Koldun có thể có được phần nào khả năng phục hồi siêu nhiên của nó#!"
 hungry_earth_perk_name: "Đất Đói Khát"
 HUNGRY_EARTH_PERK_EFFECT: "#flavor Koldun kéo nạn nhân của hắn xuống lòng đất và nghiền nát họ bằng sự kìm kẹp không thương xót của nó.#!"
 root_of_vitality_perk_name: "Rễ Sinh Lực"
 ROOT_OF_VITALITY_PERK_EFFECT: "#flavor Một cách sử dụng ít thù địch hơn nhiều so với Đất Đói Khát, thay vì đau đớn nghiền nát, cơ thể của mục tiêu được bồi bổ bởi tinh chất màu mỡ của đất.#!"
 kupalas_fury_perk_name: "Cơn Thịnh Nộ Của Kupala"
 KUPALAS_FURY_PERK_EFFECT: "[bs_spell|E]: Loại bỏ một [holding|E] tại địa điểm của bạn.\n\n#flavor Koldun khơi dậy vết nhiễm của Kupala bằng máu mình để thế lực kỳ dị ấy có thể gặm nhấm rễ núi và quẫy đạp dưới lòng đất như con rồng lớn trên huy hiệu của Tzimisce.#!"

#Way of Wind
 breath_of_whispers_perk_name: "Hơi Thở Của Lời Thì Thầm"
 BREATH_OF_WHISPERS_PERK_EFFECT: "#flavor Dù không có mặt, Koldun vẫn gieo rắc nỗi sợ sâu sắc trong lòng các boyar của họ. Năng lực này mang lời nói của ma cà rồng theo một làn gió nhẹ và trở về cùng câu trả lời của mục tiêu.#!"
 biting_gale_perk_name: "Cuồng Phong Cắt Da"
 BITING_GALE_PERK_EFFECT: "Gây #V [EmptyScope.ScriptValue('POD_base_wound_damage')|V0]#! [POD_superficial_damage|E] lên [knights|E] và [commanders|E] của kẻ địch khi đóng vai [commander|E] trong [combat_phase|E], hoặc lên đối thủ của bạn trong [single_combat_duel_plural|E].\n\n#flavor Những Koldun đầy oán hận triệu hồi một cơn gió sắc lẹm cắt xẻ một vùng theo ý họ chọn.#!"
 breeze_of_lethargy_perk_name: "Làn Gió Của Sự Rã Rời"
 BREEZE_OF_LETHARGY_PERK_EFFECT: "Ban [GetModifier('breeze_of_lethargy_modifier').GetNameWithTooltip] cho [knights|E] của kẻ địch khi đóng vai [commander|E] trong [combat_phase|E], hoặc cho đối thủ của bạn trong [single_combat_duel_plural|E].\n\n#flavor Tuy không thể gây ngủ ngay lập tức, những làn gió được năng lực này gợi lên mang đến sự mệt lả ngày càng tăng và cảm giác rã rời tê liệt qua từng bắp thịt.#!"
 ride_the_tempest_perk_name: "Cưỡi Trên Bão Tố"
 RIDE_THE_TEMPEST_PERK_EFFECT: "#flavor Một Koldun sử dụng năng lực này di chuyển với tốc độ kinh hoàng, cưỡi theo làn gió. Gieo rắc nỗi sợ khi họ bất ngờ xuất hiện tại các làng khác nhau trong lãnh địa của họ.#!"
 fury_of_the_night_sky_perk_name: "Cơn Cuồng Nộ Của Trời Đêm"
 FURY_OF_THE_NIGHT_SKY_PERK_EFFECT: "[bs_spell|E]: Triệu hồi [GetModifier('weather_magic_storm_modifier').GetNameWithTooltip] tại một địa điểm.\n\n#flavor Vận dụng cơn cuồng nộ được khuếch đại bởi máu và ý chí, một Koldun có thể phóng toàn bộ sự giận dữ của hắn lên trời đêm. Những đám mây xám vần vũ che khuất sao và trăng, giải phóng những cơn gió xoáy và trận mưa đá lạnh buốt cùng sấm sét.#!"

#Way of Water
 pool_of_lies_perk_name: "Vũng Nước Dối Trá"
 POOL_OF_LIES_PERK_EFFECT: "#flavor Năng lực đa dụng này tạo ra những hình ảnh ba chiều ảo giác trên mặt một nguồn nước. Cách nó được sử dụng tùy thuộc vào sự sáng tạo của Koldun.#!"
 watery_haven_perk_name: "Nơi Trú Ẩn Dưới Nước"
 WATERY_HAVEN_PERK_EFFECT: "$countermeasures_unlocks_t2_supernatural_high_alert$\n\n#flavor Koldun nhúng mục tiêu của hắn vào một vũng nước sâu để bảo vệ họ khỏi nguy hiểm.#!"
 fog_over_sea_perk_name: "Sương Mù Trên Biển"
 FOG_OVER_SEA_PERK_EFFECT: "#flavor Di chuyển với vẻ duyên dáng siêu nhiên của một hồn ma, Koldun bước đi trên mặt nước dễ dàng như trên đất liền, không để lại gợn sóng nào đánh dấu sự đi qua của hắn.#!"
 minions_of_the_deep_perk_name: "Thuộc Hạ Từ Vực Sâu"
 MINIONS_OF_THE_DEEP_PERK_EFFECT: "Có thể tuyển [GetMaA('water_elemental').GetName] làm [men_at_arms|E].\n\n#flavor Bằng cách nhỏ máu mình vào một vùng nước, Koldun có thể triệu hồi hoặc khơi dậy các nguyên tố nước hiện thân để phục dịch hắn.#!"
 doom_tide_perk_name: "Thủy Triều Diệt Vong"
 DOOM_TIDE_PERK_EFFECT: "[bs_spell|E]: Ban cho mục tiêu của bạn [GetModifier('doom_tide_modifier').GetNameWithTooltip].\n\n#flavor Nhiều con tàu nằm dưới đáy biển, bị đập tan bởi những xoáy nước của Koldun.#!"

#Way of Fire
 fiery_courage_perk_name: "Lòng Can Đảm Rực Lửa"
 FIERY_COURAGE_PERK_EFFECT: "#flavor Không ma cà rồng nào có thể làm chủ một nguyên tố mà hắn sợ hãi, vì vậy năng lực này làm dịu nỗi sợ đó thành chỉ còn là một tàn lửa nhỏ.#!"
 combust_perk_name: "Bốc Cháy"
 COMBUST_PERK_EFFECT: "#flavor Mắt của Koldun lóe lên màu cam sống động với sức mạnh phù thủy khi luồng khí siêu nhiệt cuộn quanh mục tiêu.#!"
 wall_of_magma_perk_name: "Tường Dung Nham"
 WALL_OF_MAGMA_PERK_EFFECT: "#flavor Koldun giơ tay lên và mặt đất nứt ra, phun trào một bức tường dung nham rực sáng nhanh chóng cứng lại thành bất kỳ hình dạng mong muốn.#!"
 bs_heat_wave_perk_name: "Sóng Nhiệt"
 BS_HEAT_WAVE_PERK_EFFECT: "Gây #V [EmptyScope.ScriptValue('POD_base_fire_damage')|V0] sát thương lửa#! lên [knights|E] và [commanders|E] của kẻ địch khi đóng vai [commander|E] trong [combat_phase|E], hoặc lên đối thủ của bạn trong [single_combat_duel_plural|E].\n\n#flavor Hoạt động như một vật dẫn cho các mạch phun hơi, Koldun dồn một luồng không khí khô nóng vào một nạn nhân trong tầm mắt.#!"
 volcanic_blast_perk_name: "Nổ Núi Lửa"
 VOLCANIC_BLAST_PERK_EFFECT: "#flavor Dung nham phun ra từ mặt đất thành một mạch phun khổng lồ theo lệnh của Koldun. Đá nóng chảy phun trào khắp một vùng rộng lớn trước khi đổ xuống đất và chảy tràn theo mọi hướng.#!"

#Way of Sorrow
 the_frustrations_of_nestrecha_perk_name: "Sự Bực Dọc Của Nestrecha"
 THE_FRUSTRATIONS_OF_NESTRECHA_PERK_EFFECT: "#flavor Được đặt theo tên nữ thần của sự đau khổ và thất bại, năng lực này cho phép Koldun tước đoạt quyết tâm của đối thủ.#!"
 the_insults_of_krivda_perk_name: "Lời Sỉ Nhục Của Krivda"
 THE_INSULTS_OF_KRIVDA_PERK_EFFECT: "[bs_spell|E]: Gây cho mục tiêu của bạn một [mental_break|E].\n\n#flavor Với sức mạnh của Krivda - nữ thần của sự thù hận và cay đắng - những lời sỉ nhục của Koldun khiến mục tiêu của hắn nổi giận điên cuồng.#!"
 the_weeping_of_kruchina_perk_name: "Tiếng Khóc Của Kruchina"
 THE_WEEPING_OF_KRUCHINA_PERK_EFFECT: "Ban 30[stress_i|E] cho [knights|E] của kẻ địch và [commander|E] của họ khi đóng vai [commander|E] trong [combat_phase|E], hoặc cho đối thủ của bạn trong [single_combat_duel_plural|E].\n\n#flavor Cái nhìn chằm chằm của một Koldun có thể khiến ai đó khốn khổ đến mức chỉ biết khóc lóc. Năng lực này không chỉ khiến rơi vài giọt nước mắt, nó gây ra tiếng nức nở cuồng loạn, gào khóc và nghiến răng.#!"
 the_misfortune_of_chernogolov_perk_name: "Vận Rủi Của Chernogolov"
