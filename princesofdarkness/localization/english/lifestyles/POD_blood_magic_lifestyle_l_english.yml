 THE_NARROW_HOUSE_PERK_EFFECT: "Ban [GetModifier('the_narrow_house_modifier').GetNameWithTooltip] cho [knights|E] địch khi đang giữ vai [commander|E] trong [combat_phase|E], hoặc cho đối thủ của bạn trong [single_combat_duel_plural|E]\n#weak Làm tê liệt một mục tiêu.#!"
 CONSIGNMENT_TO_DUAT_PERK_EFFECT: "Với vai trò [bs_spell|E], giết một nhân vật không phải bất tử, hoặc buộc một nhân vật bất tử rơi vào [GetTrait('torpor').GetName(GetPlayer)].\n#weak Sát hại một người thường hoặc đưa một ma cà rồng vào trạng thái mê ngủ.#!"

