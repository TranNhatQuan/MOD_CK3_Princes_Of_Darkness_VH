 BEAUTY_FADES_PERK_EFFECT: "Với vai trò [bs_spell|E], ban cho mục tiêu 50 [stress|E].\n#weak Khiến một tác phẩm nghệ thuật gây ghê tởm cho những ai nhìn vào nó.#!"
 TRUST_WITHERS_PERK_EFFECT: "Với vai trò [bs_spell|E], mục tiêu mất một quan hệ [friend|E] ngẫu nhiên, hoặc hạ cấp một [best_friend|E] xuống thành [friend|E].\n#weak Khiến mục tiêu bắt đầu tin rằng một người bạn hoặc đồng minh đang âm mưu phản bội mình.#!"
 LOVE_DIES_PERK_EFFECT: "Với vai trò [bs_spell|E], mục tiêu mất một quan hệ [lover|E] ngẫu nhiên, hoặc hạ cấp một [soulmate|E] xuống thành người tình khả dĩ.\n#weak Hủy hoại cảm xúc yêu thương của một đối tượng dành cho người khác.#!"
 HOPE_DISSOLVES_PERK_EFFECT: "Tăng lượng [stress|E] nhận được từ [bs_spell|E] [GetPerk('beauty_fades_perk').GetName(GetPlayer)] lên 100.\n#weak Khiến một đối tượng trở nên trầm cảm, tin rằng mục tiêu của mình không thể đạt được.#!"
