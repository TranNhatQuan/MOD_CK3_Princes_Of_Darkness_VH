 swallow_the_tail_perk_name: "Nuốt Lấy Đuôi Mình"
 cycle_of_the_midgard_serpent_perk_name: "Vòng Tuần Hoàn Của Rắn Thần Midgard"
 apeps_transformation_perk_name: "Biến Hình Của $glossary_wyrm_apep$"

 BESTOWMENT_OF_SCALES_PERK_EFFECT: "Là một [bs_spell|E], cho mục tiêu là thành viên [POD_herd|E] [GetModifier('bestowment_of_scales_modifier').GetNameWithTooltip] trong 20 năm\n#flavor Chữa lành một ghoul nhanh hơn bằng cách khiến da vảy mọc lên khắp vết thương của họ#!"
 SUFFER_FOR_JORMUNGANDR_PERK_EFFECT: "Là một [bs_spell|E], cho mục tiêu [GetTrait('scaly').GetName(GetNullCharacter)] cùng với [GetModifier('suffer_for_jormungandr_modifier').GetNameWithTooltip] đồng thời tăng một [skill|E] ngẫu nhiên lên 5\n#flavor Ban cho một ghoul đặc điểm giống bò sát#!"
 SWALLOW_THE_TAIL_PERK_EFFECT: "Là một [bs_spell|E], nhận một lượng máu ngẫu nhiên từ 1 đến 4 điểm trong khi làm bị thương toàn bộ [court|E] của bạn\n#flavor Rút máu đã đổ từ xung quanh bạn về phía bạn#!"
 CYCLE_OF_THE_MIDGARD_SERPENT_PERK_EFFECT: "Giảm chi phí [lifestyle_experience|E] khi dạy discipline #p -100%#!\n#flavor Ban cho một ghoul khả năng sử dụng các discipline của bạn#!"

 cycle_of_the_midgard_serpent_perk_tt: "Nhờ có [GetPerk('cycle_of_the_midgard_serpent_perk').GetName(GetPlayer)], việc dạy $pod_discipline$ là miễn phí!"
 APEPS_TRANSFORMATION_PERK_EFFECT: "Là một [bs_spell|E], hy sinh $POD_splat_ghoul$ của bạn để nhận được [GetModifier('apeps_transformation_modifier').GetNameWithTooltip] có thể dồn lại\n#flavor Biến một ghoul của bạn thành một con rắn khổng lồ có khả năng hiểu được ngôn ngữ loài người#!"


 saut_allah_perk_name: "Saut Allah"
 SAUT_ALLAH_PERK_EFFECT: "Là một [bs_spell|E], giảm căng thẳng của mục tiêu và cho họ [GetModifier('saut_allah_modifier').GetNameWithTooltip] trong 10 năm.\n\n#weak Người thi triển củng cố tinh thần cho đồng đạo Ashirra của mình trước những gian khổ sắp tới.#!"
 nuzra_allah_perk_name: "Nuzra Allah"
 NUZRA_ALLAH_PERK_EFFECT: "Cho đối thủ của bạn [GetModifier('nuzra_allah_modifier').GetNameWithTooltip] trong [single_combat_duel_plural|E].\n\n#weak Một quyền năng phòng thủ che chắn người thi triển khỏi thương tổn có thể thấy được.#!"
 ruh_allah_perk_name: "Ruh Allah"
 RUH_ALLAH_PERK_EFFECT: "[vassal|E] [faction_commitment|E]: #P -30#!\n\n#weak Ruh Allah giúp một Cainite giành lại quyền kiểm soát bản thân và những người quanh họ.#!"
 RUH_ALLAH_FACTION_REASON: "[GetPerk('ruh_allah_perk').GetName(GetPlayer)]: $VALUE|0+=$"
 ghadub_allah_perk_name: "Ghadub Allah"
 GHADUB_ALLAH_PERK_EFFECT: "Gây cho mọi quân chủ ở phía đối lập chịu [GetModifier('ghadub_allah_modifier').GetNameWithTooltip] khi bắt đầu một [war|E] với vai trò kẻ tấn công hoặc kẻ phòng thủ chính.\nLà một [bs_spell|E], buộc một [white_peace|E] giữa bạn và mục tiêu.\n\n#weak Cho phép ngăn chặn các cuộc tấn công mà không cần giao tiếp bằng mắt.#!"
 kubda_allah_perk_name: "Kubda Allah"
 KUBDA_ALLAH_PERK_EFFECT: "Là một [bs_spell|E], nhận được một [strong_hook|E] lên mục tiêu và làm họ bị thương nếu thất bại.\n\n#weak Nghiền nát sự bất tử của một đối thủ và buộc họ phải khuất phục. Người thi triển phải đủ tự kiềm chế để sử dụng quyền năng này vì mục đích tốt đẹp.#!"

 hikma_allah_perk_name: "Hikma min Allah"
 HIKMA_ALLAH_PERK_EFFECT: "#weak Bằng cách chiêm nghiệm nội tâm kéo dài, người Ashirra có thể tập trung tâm trí để giải quyết vấn đề.#!"
 idrak_allah_perk_name: "Idrak' min Allah"
 IDRAK_ALLAH_PERK_EFFECT: "Là một [bs_spell|E], học được toàn bộ [schemes|E] và [secrets|E] của một nhân vật.\n\n#weak Thông qua sức mạnh của lời cầu nguyện, có được cái nhìn thấu suốt về kẻ địch của bạn.#!"
 sultat_nabi_perk_name: "Sultat el-Nabi"
 SULTAT_NABI_PERK_EFFECT: "Là một [bs_spell|E], buộc một nhân vật ngẫu nhiên đưa cho bạn @gold_icon!, @prestige_icon!, một [inventory_artifact|E] Thường, hoặc một [inventory_artifact|E] Trứ Danh.\n\n#weak Buộc đối tượng phải tuân theo một câu ngắn không quá mười từ.#!"
 sawt_nabi_perk_name: "Sawt el-Nabi"
 SAWT_NABI_PERK_EFFECT: "#weak Người thi triển có thể giao tiếp với bất kỳ Cainite nào mà họ biết bất kể khoảng cách.#!"
 nar_iman_perk_name: "Nar el-Iman"
 NAR_IMAN_PERK_EFFECT: "Là một [bs_spell|E], làm một nhân vật bị thương 3 lần và cho họ [GetModifier('nar_iman_modifier').GetNameWithTooltip] trong 10 năm.\n\n#weak Khai thác điểm yếu cố hữu của ma cà rồng trong các vấn đề đức tin, làm suy yếu ý chí của mục tiêu và gây tổn thương cả về tinh thần và thể xác.#!"

 eyes_of_the_earth_perk_name: "Mắt Của Đất"
 EYES_OF_THE_EARTH_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$\n#flavor Ma cà rồng "thấy" được mọi thứ diễn ra quanh sào huyệt của mình bằng cách tận dụng linh hồn của cỏ cây, đá, và thú vật xung quanh.#!"
 roots_of_power_perk_name: "Rễ Của Quyền Năng"
 ROOTS_OF_POWER_PERK_EFFECT: "#flavor Người hành giả Sielanic khai thác quyền năng ẩn tàng trong lòng đất.#!"
 arbor_of_protection_perk_name: "Vòm Cây Che Chở"
 ARBOR_OF_PROTECTION_PERK_EFFECT: "#flavor Ma cà rồng tìm nơi trú ẩn trong gỗ sống của cây cối.#!"
 course_of_the_beast_perk_name: "Đường Đi Của Con Thú"
 COURSE_OF_THE_BEAST_PERK_EFFECT: "Mở khóa nhiều dạng biến hình thú vật khác nhau.\n#flavor Ma cà rồng có thể mang hình dạng của bất kỳ con vật nào tồn tại trong lãnh địa của mình.#!"
 way_of_the_stone_perk_name: "Đường Đi Của Đá"
 WAY_OF_THE_STONE_PERK_EFFECT: "Mở khóa tùy chọn biến hình [GetModifier('POD_shapeshift_form_stone_dolmen_modifier').GetNameWithTooltip].\n#flavor Ma cà rồng biến thành một cột đá dolmen khổng lồ. Truyền thuyết về những tảng đá biết đi và di chuyển vào ban đêm bắt nguồn từ việc thực hành nghệ thuật thâm sâu này.#!"

 see_the_dead_perk_name: "Thấy Kẻ Đã Chết"
 SEE_THE_DEAD_PERK_EFFECT: "$POD_can_summon_wraith_trigger_loca$\n#flavor Hồn ma của người đã chết có thể được thấy và nhận ra bởi người sử dụng.#!"
 repel_the_angry_dead_perk_name: "Đẩy Lùi Kẻ Chết Phẫn Nộ"
 REPEL_THE_ANGRY_DEAD_PERK_EFFECT: "Có thể [POD_banish|E] $POD_splat_wraith_plural$\nCho [knights|E] địch [GetModifier('repel_the_angry_dead_modifier').GetNameWithTooltip] khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho đối thủ của bạn trong [single_combat_duel_plural|E] nếu họ là một [GetTrait('wraith').GetName(GetPlayer)].\n#flavor Với quyền năng này, hồn ma và wraith thù địch có thể bị trục xuất khỏi khu vực.#!"
 command_the_freshly_dead_perk_name: "Sai Khiến Kẻ Vừa Chết"
 COMMAND_THE_FRESHLY_DEAD_PERK_EFFECT: "$POD_can_weaken_fetter_trigger_loca$\n$POD_can_bind_wraith_trigger_loca$\n$POD_can_command_wraith_trigger_loca$\n#flavor Người sử dụng có thể sai khiến bất kỳ hồn ma nào mà cô ấy có thể thấy phải tuân lệnh cô ấy.#!"
 army_of_souls_perk_name: "Đội Quân Linh Hồn"
 ARMY_OF_SOULS_PERK_EFFECT: "Có thể tuyển mộ [GetMaA('spectres').GetName] làm [men_at_arms|E].\n#flavor Người hành giả Sielanic sử dụng quyền năng này để triệu tập một đội quân linh ảnh làm lực lượng phòng thủ hoặc để chuyển lời cảnh báo đến kẻ địch của mình.#!"
 walk_the_road_of_shadows_perk_name: "Bước Trên Con Đường Bóng Tối"
 WALK_THE_ROAD_OF_SHADOWS_PERK_EFFECT: "#flavor Ma cà rồng có thể vượt vào [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] và xuất hiện như một wraith hữu hình.#!"