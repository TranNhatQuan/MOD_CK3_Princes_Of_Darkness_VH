 TARGET_GAINED_A_QIAO_LIFESTYLE_PERKPOINT: "[CHARACTER.GetShortUIName] đã nhận Mở khóa [perk|E] $VALUE|V0$ [qiao_lifestyle|E]"

 QIAO_LIFESTYLE_PERK_POINTS_TRIGGER: "Điểm thưởng lối sống Qiao: $NUM|V0$"

 POD_qiao_elder_penalty_effect: "#X Các sức mạnh tiến bộ của Qiao quá mạnh để phàm nhân sử dụng an toàn.#!"

 # Qiao #

 CELESTIAL_PUNISHMENT_PERK_EFFECT: "Gây Thiên Hình [GetModifier('celestial_punishment_modifier').GetNameWithTooltip] cho mọi lãnh chủ ở phía đối lập khi bắt đầu [war|E] với vai trò kẻ tấn công hoặc phòng thủ chính.\n#flavor Những lời cầu nguyện này hoạt động như một lời cảnh báo cho shen. Khi chúng đánh trúng mục tiêu, chúng bốc cháy, không gây tổn thương thể xác nhưng đốt cháy P'o của mục tiêu. Những lá bùa giấy này hiệu quả như dao ném và chống chịu được cả những cơn gió mạnh nhất trên đường đến mục tiêu.#!"
 DIVINE_BINDINGS_PERK_EFFECT: "Cải thiện [modifier|E] từ [GetPerk('celestial_punishment_perk').GetName(GetPlayer)] thành [GetModifier('divine_bindings_modifier').GetNameWithTooltip].\n#flavor Khi ném vào một mục tiêu shen, những tấm giấy vô hại này di chuyển ngược gió và thậm chí vòng qua vật cản để đánh trúng. Khi những lời cầu nguyện chạm mục tiêu, chúng phát sáng với năng lượng xanh kỳ dị và nở rộng, trở nên dày và dài hơn khi quấn quanh shen.#!"
 HEAVENLY_FLAMES_PERK_EFFECT: "Cải thiện [modifier|E] từ [GetPerk('celestial_punishment_perk').GetName(GetPlayer)] thành [GetModifier('heavenly_flames_modifier').GetNameWithTooltip].\n#flavor Khi lá bùa này đánh trúng một shen mục tiêu, nó ngay lập tức bùng lên thành ngọn lửa xanh sáng gây tổn thương nghiêm trọng. Như Thiên Trói, lá bùa di chuyển vòng qua vật cản để đến mục tiêu.#!"
 CELESTIAL_FIRES_PERK_EFFECT: "Cải thiện [modifier|E] từ [GetPerk('celestial_punishment_perk').GetName(GetPlayer)] thành [GetModifier('celestial_fires_modifier').GetNameWithTooltip].\n#flavor Hỏa Thiên Giới giống hệt Thiên Hỏa, với một ngoại lệ: tổn thương không thể được hấp thụ nếu không có phòng thủ đặc biệt.#!"
 HEAVENS_THUNDER_PERK_EFFECT: "Cải thiện [modifier|E] từ [GetPerk('celestial_punishment_perk').GetName(GetPlayer)] thành [GetModifier('heavens_thunder_modifier').GetNameWithTooltip].\n#flavor Đây, lời cầu nguyện mạnh nhất của [GetTrait('shih').GetName( GetNullCharacter )], gần như không thể ngăn cản một khi đã được thi triển. Khi các lá bùa rời khỏi tay [GetTrait('shih').GetName( GetNullCharacter )], chúng phát sáng dữ dội và di chuyển với tốc độ của tia chớp về đích. Khi chúng đánh trúng shen, chúng nổ thành những quả cầu cuồng nộ điện có thể gây tổn thương nặng cho gần như mọi con quỷ.#!"
 HEAVENS_JUDGMENT_PERK_EFFECT: "Cải thiện [modifier|E] từ [GetPerk('celestial_punishment_perk').GetName(GetPlayer)] thành [GetModifier('heavens_judgment_modifier').GetNameWithTooltip].\n#flavor Những lời cầu nguyện được Qiao này chuẩn bị đốt cháy Khí ra khỏi thân xác của shen, trả lại sinh lực bị đánh cắp đó cho môi trường để làm nó hồi sinh.#!"
 DIVINE_PROHIBITION_PERK_EFFECT: "Cải thiện [modifier|E] từ [GetPerk('celestial_punishment_perk').GetName(GetPlayer)] thành [GetModifier('divine_prohibition_modifier').GetNameWithTooltip].\n#flavor Kỹ thuật I Shen mạnh nhất này cắt đứt một mục tiêu khỏi các nguồn Khí bên ngoài.#!"

 STEEL_SKIN_PERK_EFFECT: "#flavor Bạn tăng Thể Chất nhờ sức mạnh này.#!"
 DRAGONS_SPEED_PERK_EFFECT: "#flavor Bạn tăng Nhanh Nhẹn nhờ việc sử dụng sức mạnh này.#!"
 TIGERS_STRENGTH_PERK_EFFECT: "#flavor Bạn dùng khả năng này để tăng Sức Mạnh khi chuẩn bị chiến đấu.#!"
 CELESTIAL_EYES_PERK_EFFECT: "#flavor Bạn tăng Nhận Thức bằng việc sử dụng cấp độ Mo Kung Qiao này.#!"
 BODY_OF_THE_DRAGON_PERK_EFFECT: "#flavor Bạn tăng toàn bộ Chỉ Số của mình lên mức siêu nhân.#!"
 TEN_OX_STRENGTH_PERK_EFFECT: "#flavor [GetTrait('shih').GetName( GetNullCharacter )] có khả năng thực hiện những kỳ công sức mạnh siêu nhân trong thời gian ngắn.#!"
 DIAMOND_BODY_PERK_EFFECT: "#flavor Một [GetTrait('shih').GetName( GetNullCharacter )] dùng ân huệ này thể hiện khả năng phi thường để rũ bỏ tổn thương.#!"

 OPENED_EYES_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$ \n Bạn sẽ không còn chịu #TOOLTIP:STATIC_MODIFIER,POD_delirium_modifier #N;L Delirium#!#! khi chiến đấu với $glossary_fera$ trong chiến tranh hay [single_combat_duel_plural|E] nữa.\n#flavor [GetTrait('shih').GetName( GetNullCharacter )] có thể thấy shen đúng như bản chất của chúng. [GetTrait('shih').GetName( GetNullCharacter )] cũng có thể bỏ qua hiệu ứng của Delirium.#!"
 DIVINE_PERCEPTIONS_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$ \n #flavor Sức mạnh này cho phép [GetTrait('shih').GetName( GetNullCharacter )] nhìn thấy linh hồn của một thực thể khác, nó hoạt động như máy phát hiện nói dối trong phần lớn trường hợp, nhưng [GetTrait('shih').GetName( GetNullCharacter )] cũng có thể thấy khi một phàm nhân hay thực thể khác bị một con quỷ chiếm hữu.#!"
 WIND_TALK_PERK_EFFECT: "$POD_can_summon_on_death_trigger_loca$\n$POD_can_summon_wraith_trigger_loca$\nMở khóa [decision|E] $seek_aid_of_the_spirits_decision$.\n#flavor [GetTrait('shih').GetName( GetNullCharacter )] sử dụng khả năng này có thể lắng nghe cư dân của các cõi linh hồn và giao tiếp với họ. Tuy nhiên shen không có nghĩa vụ phải trả lời bất kỳ câu hỏi hay yêu cầu nào [GetTrait('shih').GetName( GetNullCharacter )] đưa ra.#!"
 CELESTIAL_WINDOW_PERK_EFFECT: "$POD_can_weaken_fetter_trigger_loca$\n$POD_can_bind_wraith_trigger_loca$\n#flavor [GetTrait('shih').GetName( GetNullCharacter )] sử dụng khả năng này tương tác ở mọi cấp độ với một cư dân của Cõi Âm hoặc Cõi Dương. Về mọi mặt, linh hồn được chọn ở cùng cấp độ tồn tại với [GetTrait('shih').GetName( GetNullCharacter )]. Linh hồn đó có thể bị chạm, gây hại, giúp đỡ hoặc tham gia chiến đấu như thể cả [GetTrait('shih').GetName( GetNullCharacter )] và linh hồn đều ở cùng một nơi.#!"
 CELESTIAL_DOORWAY_PERK_EFFECT: "Cho phép bạn tương tác với các thực thể của [umbra|E] khi bạn ở trong thế giới vật chất.\n#flavor [GetTrait('shih').GetName( GetNullCharacter )] có thể chủ động tương tác với [spirit_worlds|E]; tuy nhiên, hướng hành động này không hẳn là khôn ngoan nhất để thực hiện. Trong khi nhân vật thực ra vẫn ở lại Trung Nguyên, anh ta có thể thấy và ảnh hưởng đến Cõi Âm và [Glossary('Dương Giới','game_concept_yang_world_desc')] xung quanh mình. Tuy vậy, cư dân của những cõi đó cũng có thể trả lại ân huệ ấy, và nhiều kẻ trong số họ không ưa gì [GetTrait('shih').GetName( GetNullCharacter )].#!"
 SIGHT_WITHOUT_EYES_PERK_EFFECT: "$countermeasures_unlocks_t3_all_seeing_eye$ \n #flavor Dùng kỹ thuật này, một [GetTrait('shih').GetName( GetNullCharacter )] có thể thấy và phát hiện mà không cần dùng các giác quan vật lý, chỉ cảm nhận bằng linh hồn.#!"
 THE_EYE_OF_HEAVEN_PERK_EFFECT: "$countermeasures_unlocks_t4_all_seeing_eye$ \n #flavor Một [GetTrait('shih').GetName( GetNullCharacter )] với cấp độ tinh thông này có thể nhìn bằng Mắt Trời Cao, cảm nhận mọi nơi.#!"

 BARRIER_OF_PAIN_PERK_EFFECT: "#flavor [GetTrait('shih').GetName( GetNullCharacter )] có thể buộc bản thân chặn đứng đau đớn ở cấp độ này.#!"
 THE_CLOSING_WOUND_PERK_EFFECT: "Là một [character_interaction|E], chữa lành mọi cấp độ [trait|E] [GetTrait('wounded_1').GetName(GetPlayer)].\n#flavor Ở cấp độ này, [GetTrait('shih').GetName( GetNullCharacter )] có thể chữa lành vết thương. Da thịt bị bầm tím mất đi sự nhạy cảm; vết thương tự khép lại và để lại sẹo mới.#!"
 SPIRITUAL_HEALING_PERK_EFFECT: "Cải thiện [GetPerk('the_closing_wound_perk').GetName(GetPlayer)] bằng cách cho phép chữa lành bất kỳ bệnh phi siêu nhiên nào.\n#flavor [GetTrait('shih').GetName( GetNullCharacter )] có thể ghép lại xương và tái tạo mô thần kinh bằng khả năng này. Quá trình này gây đau đớn và thường có rủi ro nếu dùng trong tình huống chiến đấu. Xương phải được đặt lại đúng cách nếu không [GetTrait('shih').GetName( GetNullCharacter )] có nguy cơ tự làm mình tàn tật vĩnh viễn.#!"
 ESCAPE_FROM_DEATH_PERK_EFFECT: "Cải thiện [GetPerk('the_closing_wound_perk').GetName(GetPlayer)] bằng cách cho phép chữa lành [GetTrait('maimed').GetName(GetPlayer)] và các vấn đề sức khỏe vĩnh viễn khác.\n#flavor [GetTrait('shih').GetName( GetNullCharacter )] sử dụng khả năng này có thể tái tạo cả các vết bỏng và tổn thương năng lượng khác. Dù rất hữu ích, Thoát Khỏi Cái Chết cũng rất tốn kém.#!"
 FLAMES_OF_THE_PHOENIX_PERK_EFFECT: "Cải thiện [GetPerk('the_closing_wound_perk').GetName(GetPlayer)] bằng cách cho phép chữa lành bất kỳ bệnh siêu nhiên nào với giá rất lớn.\nMiễn nhiễm với đau tim.\n#flavor Nhân vật sử dụng khả năng này tự tái tạo hoàn toàn ở cấp độ tế bào. Sức mạnh này không thể mang một nhân vật trở lại từ cái chết, nhưng nó đảo ngược hiệu ứng của nhiễm độc phóng xạ, ung thư, chấn thương nặng và cả tuổi già.#!"
 THE_LIZARDS_TAIL_PERK_EFFECT: "Tự động chữa lành mọi vấn đề sức khỏe mỗi năm một lần.\n#flavor [GetTrait('shih').GetName( GetNullCharacter )] có thể thực sự tái tạo chi hoặc nội tạng bị mất; cơ bản là bất kỳ tổn thương nào không dẫn đến tử vong.#!"
 ASHES_OF_THE_PHOENIX_PERK_EFFECT: "Phục sinh sau khi chết không tự nhiên với giá 200 [static_stress|E], miễn là bạn dưới 300 [stress|E].\n#flavor [GetTrait('shih').GetName( GetNullCharacter )] tinh thông thực sự Cây Cầu Phượng Hoàng có thể trở về từ cái chết.#!"

 THOUSAND_FISTS_PERK_EFFECT: "Cơ hội thưởng gây vết thương cho [knights|E] kẻ địch khi tham gia [combat_phase|E] với vai trò [knight|E].\n#flavor [GetTrait('shih').GetName( GetNullCharacter )] tập trung Dương Khí của mình và tung ra nhiều cú đấm liên tiếp. Các đòn đánh nhanh siêu nhân, thường mờ đi trong không khí.#!"
 SPEAR_HAND_PERK_EFFECT: "Cơ hội thưởng gây thương tích nặng cho [knights|E] kẻ địch khi tham gia [combat_phase|E] với vai trò [knight|E].\n#flavor [GetTrait('shih').GetName( GetNullCharacter )] tập trung Dương Khí của mình và đốt cháy năng lượng quanh một tay. Năng lượng này làm gợn không khí và bỏng rát dữ dội.#!"
 BURNING_GHOSTS_PERK_EFFECT: "Cơ hội thưởng gây thương tích nặng cho [knights|E] kẻ địch khi tham gia [combat_phase|E] với vai trò [knight|E].\n#flavor Hiệp sĩ [GetTrait('shih').GetName( GetNullCharacter )] tập trung Khí của mình, làm chậm anh ta lại để chiến đấu với oan hồn và linh hồn mọi loại. Da anh ta phát sáng vàng, và năng lượng Khí quấn quanh anh ta. Thân thể [GetTrait('shih').GetName( GetNullCharacter )] không thực sự đánh vào linh hồn nhưng luồng năng lượng bao quanh anh ta thì có.#!"
 STEEL_BODY_PERK_EFFECT: "Cơ hội thưởng đả thương nặng [knights|E] kẻ địch khi tham gia [combat_phase|E] với vai trò [knight|E].\n#flavor [GetTrait('shih').GetName( GetNullCharacter )] tập trung Âm Khí của mình, làm cứng cáp thân thể và tăng khả năng gây tổn thương. Mọi bắp thịt trên thân thể [GetTrait('shih').GetName( GetNullCharacter )] căng lên, và da anh ta trở nên dẻo dai hơn hẳn.#!"
 THOUSAND_SWORDS_PERK_EFFECT: "Cơ hội thưởng đả thương nặng [knights|E] kẻ địch khi tham gia [combat_phase|E] với vai trò [knight|E].\n#flavor [GetTrait('shih').GetName( GetNullCharacter )] tập trung Khí của mình, rồi tấn công kẻ địch trong một chuỗi hành động dữ dội. Mỗi đòn đánh mở ra vết thương trên kẻ địch, và âm thanh va chạm giống như kim loại chạm kim loại.#!"
 HUNDRED_WARRIORS_STRIKE_PERK_EFFECT: "Cơ hội thưởng giết chết [knights|E] kẻ địch khi tham gia [combat_phase|E] với vai trò [knight|E].\n#flavor Chan chứa Khí cuồng nộ, [GetTrait('shih').GetName( GetNullCharacter )] trở thành một cơn lốc tàn phá.#!"
 HEAVEN_THUNDER_STRIKE_PERK_EFFECT: "Cơ hội thưởng giết chết [knights|E] kẻ địch khi tham gia [combat_phase|E] với vai trò [knight|E].\n#flavor [GetTrait('shih').GetName( GetNullCharacter )] có thể tập trung Khí vào một đòn đánh có thể phá vỡ sắt thép hoặc làm rung chuyển mặt đất với lực của một cơn động đất.#!"

 FROZEN_RIVER_PERK_EFFECT: "Miễn nhiễm với mọi sức mạnh rút cạn, bao gồm cả $pod_Embrace$.\n#flavor [GetTrait('shih').GetName( GetNullCharacter )] dùng Dương Khí của mình để xây một rào chắn bảo vệ quanh sinh lực của chính mình, từ đó ngăn chặn việc đánh cắp Khí của bà.#!"
 STOLEN_SERPENT_PERK_EFFECT: "#flavor [GetTrait('shih').GetName( GetNullCharacter )] có thể bắt lấy bất kỳ đòn tấn công siêu nhiên tầm xa nào nhắm vào mình rồi ném ngược lại đối thủ đã thi triển nó. Đây là việc nguy hiểm, vì [GetTrait('shih').GetName( GetNullCharacter )] phải thể hiện thời điểm hoàn hảo để chiếm được năng lượng huyền bí ném vào mình.#!"
 CELESTIAL_BARRIER_PERK_EFFECT: "Gây [GetModifier('shih_celestial_barrier_modifier').GetNameWithTooltip] cho mọi lãnh chủ ở phía đối lập khi bắt đầu [war|E] với vai trò kẻ tấn công hoặc phòng thủ chính.\n#flavor Với sức mạnh này, [GetTrait('shih').GetName( GetNullCharacter )] tạm thời chặn khả năng lấy Khí từ các nguồn khác của shen.#!"
 CLUTCH_OF_THE_WAN_KUEI_PERK_EFFECT: "#flavor [GetTrait('shih').GetName( GetNullCharacter )] sử dụng khả năng này có thể đánh cắp Khí từ một shen. Trong khi Khí bị đánh cắp không còn khả dụng cho shen, [GetTrait('shih').GetName( GetNullCharacter )] cũng không thể dùng Khí bị đánh cắp đó.#!"
 BITE_OF_THE_MU_PERK_EFFECT: "Là một [character_interaction|E], dùng một $POD_splat_kueijin$ bị giam giữ để mất [stress|E].\n#flavor [GetTrait('shih').GetName( GetNullCharacter )] sử dụng khả năng này không chỉ đánh cắp Khí từ một shen mục tiêu, mà còn dùng Khí đó trong một đòn tấn công nhắm vào shen. Thủ tục này rất rủi ro, vì nó đánh thức P'o của [GetTrait('shih').GetName( GetNullCharacter )].#!"
 RIGHTEOUS_HUNGRY_SPIRIT_PERK_EFFECT: "Miễn nhiễm với các sức mạnh tâm trí thù địch.\n#flavor Linh hồn của [GetTrait('shih').GetName( GetNullCharacter )] mạnh mẽ đến mức bất kỳ mưu đồ rút cạn hay đánh cắp Khí của anh ta không chỉ tự động thất bại, mà kẻ săn còn có thể cướp lấy Khí từ kẻ tấn công.#!"
 DEMON_EATING_TECHNIQUET_PERK_EFFECT: "Mở khóa một tùy chọn hành hình cho phép bạn tăng [skills|E] cơ bản bằng cách nuốt chửng một $POD_splat_kueijin$.\n#flavor Các đòn đánh cận chiến của [GetTrait('shih').GetName( GetNullCharacter )] (có vũ khí hoặc không vũ khí) nhắm vào shen không chỉ gây tổn thương mà còn làm tiêu tán Khí của mục tiêu.#!"

 EYES_OF_THE_DRAGON_PERK_EFFECT: "#flavor [GetTrait('shih').GetName( GetNullCharacter )] nhìn chằm chằm vào đối thủ. Sự đe dọa là chìa khóa để tránh chiến đấu thành công.#!"
 DARK_REFLECTION_PERK_EFFECT: "#flavor Sức mạnh này buộc kẻ địch của [GetTrait('shih').GetName( GetNullCharacter )] phải nhận ra hậu quả của hành động của họ. [GetTrait('shih').GetName( GetNullCharacter )] dùng sức mạnh này khi tuyên án một shen.#!"
 HUNTED_EYES_PERK_EFFECT: "Là một [character_interaction|E], ban 100 [static_stress|E] cho một $POD_splat_kueijin$ ở cùng địa điểm với bạn.\n#flavor Sức mạnh này hoạt động trên cả [Glossary('Người Chết Đói Khát','game_concept_kuei_jin_desc')] và Restless Dead. Nhìn chằm chằm vào mắt đối thủ, [GetTrait('shih').GetName( GetNullCharacter )] buộc mục tiêu phải trải nghiệm lại bất kỳ khoảng thời gian nào đã trải qua tại [UmbraGlossaryLocalized('yomi_wan','Địa Ngục Yomi')].#!"
 VOICE_OF_THE_YAMA_KINGS_PERK_EFFECT: "Là một [character_interaction|E], thử lấy [strong_hook|E] trên một $POD_splat_kueijin$, khả năng dựa trên [dread|E] của bạn.\n$POD_can_command_wraith_trigger_loca$\n#flavor Một [GetTrait('shih').GetName( GetNullCharacter )] sử dụng sức mạnh này có thể ra lệnh cho một linh hồn thực hiện một nhiệm vụ đơn giản.#!"
 DIVINE_ORDINANCE_PERK_EFFECT: "#flavor [GetTrait('shih').GetName( GetNullCharacter )] gợi lên sự sợ hãi áp đảo trong mọi kẻ địch trong tầm mắt.#!"
 MANTLE_OF_HEAVEN_PERK_EFFECT: "#flavor Được che phủ trong sự bảo hộ thiêng liêng của Thiên Đình, một kẻ săn quỷ trở thành kẻ địch đáng gờm trong mắt shen.#!"
 DIVINE_MANDATE_PERK_EFFECT: "Cải thiện [GetPerk('voice_of_the_yama_kings_perk').GetName(GetPlayer)] bằng cách cho phép nó ảnh hưởng mọi [splats|E].\n#flavor Nói bằng tiếng nói của Thiên Đình, [GetTrait('shih').GetName( GetNullCharacter )] có thể ra lệnh cho bất kỳ shen nào và mong đợi sự tuân phục.#!"

 BALANCE_OF_THE_SPIRIT_PERK_EFFECT: "Là một [character_interaction|E], làm một mục tiêu mất 50 [static_stress|E] với giá 25 [static_stress|E].\n#flavor [GetTrait('shih').GetName( GetNullCharacter )] có thể nhận biết sự mất cân bằng linh hồn giữa Âm và Dương và cố gắng khôi phục trật tự đúng đắn bằng sức mạnh này.#!"
 FOCUS_OF_THE_MIND_PERK_EFFECT: "#flavor [GetTrait('shih').GetName( GetNullCharacter )] dùng rất nhiều Ý Chí của mình để chiến đấu chống lại shen. Sức mạnh này cho phép họ lấy lại quyết tâm để một lần nữa thực hiện nhiệm vụ thiêng liêng của mình.#!"
 NIGHTMARE_EXORCISM_PERK_EFFECT: "[GetPerk('balance_of_the_spirit_perk').GetName(GetPlayer)] giờ cũng cho phép bạn loại bỏ [traits|E] [stress|E] tiêu cực.\n#flavor Nhiều [GetTrait('shih').GetName( GetNullCharacter )] tìm đến ma túy và rượu để cố giảm nhẹ nỗi thống khổ tinh thần của mình. [GetTrait('shih').GetName( GetNullCharacter )] dùng sức mạnh này có cách tiếp cận trực tiếp hơn bằng cách xóa bỏ tác động cảm xúc của ký ức và, hy vọng là, loại bỏ những vết sẹo tinh thần mà ký ức đó tạo ra.#!"
 SELF_EXORCISM_PERK_EFFECT: "Bạn không còn có thể bị chiếm hữu bởi $POD_splat_wraith_plural$.\n#flavor [GetTrait('shih').GetName( GetNullCharacter )], như mọi phàm nhân, chịu rủi ro bị quỷ chiếm hữu. Với sức mạnh này, kẻ săn quỷ tham gia trận chiến tâm linh với một con quỷ đã thành công chiếm được lối vào thân thể cô ấy, có thêm cơ hội thứ hai để trục xuất con quỷ.#!"
 MENTAL_DOMINION_PERK_EFFECT: "[GetPerk('balance_of_the_spirit_perk').GetName(GetPlayer)] giờ cũng cho phép bạn loại bỏ hoàn toàn [stress|E] để đổi lấy [GetModifier('mental_dominion_modifier').GetNameWithTooltip].\n#flavor Một [GetTrait('shih').GetName( GetNullCharacter )] dùng sức mạnh này có thể phục hồi hoàn toàn Ý Chí và thực sự làm suy yếu P'o của bà.#!"
 MOUNTAIN_MEDITATION_PERK_EFFECT: "#flavor [GetTrait('shih').GetName( GetNullCharacter )] dùng thuật tối cao này đạt được một mức độ thanh thản khiến họ vững chãi như gốc rễ của một ngọn núi.#!"
 WALKING_IN_BALANCE_PERK_EFFECT: "#flavor [GetTrait('shih').GetName( GetNullCharacter )] cân bằng hoàn hảo giữa Âm và Dương đến mức bà vượt qua bất kỳ mưu đồ bên ngoài nào định phá vỡ sự cân bằng Khí nội tại của bà.#!"

 CLOUD_WALKING_PERK_EFFECT: "#flavor Sức mạnh này cho phép [GetTrait('shih').GetName( GetNullCharacter )] di chuyển im lặng và không để lại dấu vết, ngay cả khi chạy. [GetTrait('shih').GetName( GetNullCharacter )] không để lại mùi hương nào cho thấy anh ta đã từng ở khu vực đó.#!"
 WATER_TREADING_PERK_EFFECT: "#flavor Với sức mạnh này, [GetTrait('shih').GetName( GetNullCharacter )] có thể di chuyển trên các mặt bề không ổn định, như nước hay cát lún, và dùng gần như mọi bề mặt, ngay cả lá trên cây, để trèo lên.#!"
 WIND_STRIKE_PERK_EFFECT: "#flavor [GetTrait('shih').GetName( GetNullCharacter )] dùng chính động lượng của đối thủ để ném kẻ địch đi một khoảng cách đáng kinh ngạc.#!"
 MOUNTAIN_STANCE_PERK_EFFECT: "Là một [character_interaction|E], vào hoặc ra khỏi [GetModifier('mountain_stance_modifier').GetNameWithTooltip].\n#flavor [GetTrait('shih').GetName( GetNullCharacter )] hấp thụ lực va chạm của một đòn tấn công, chuyển hướng lực đó vào mặt đất.#!"
 CELESTIAL_WIND_PERK_EFFECT: "#flavor [GetTrait('shih').GetName( GetNullCharacter )] dùng sức mạnh này tập trung Khí của mình để ngăn một mục tiêu tiến lên và có thể khiến kẻ địch ngã lộn về sau.#!"
 ARROW_CUTTING_PERK_EFFECT: "#flavor Phản xạ của [GetTrait('shih').GetName( GetNullCharacter )] nhanh đến mức siêu nhân, có thể đỡ được bất kỳ đòn tấn công tầm xa nào, ngay cả một trận mưa đạn.#!"
 WIND_RACING_PRANA_PERK_EFFECT: "#flavor Dùng sức mạnh này, một [GetTrait('shih').GetName( GetNullCharacter )] có thể tạo ra một cơn bùng nổ tốc độ siêu nhân trong chớp mắt.#!"
