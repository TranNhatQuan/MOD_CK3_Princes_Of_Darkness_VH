 ns_blood_scourge_perk_name: "Tai Ương Máu"
 ns_cursed_eucharist_perk_name: "Thánh Thể Bị Nguyền Rủa"
 ns_purge_the_apostates_soul_perk_name: "Thanh Trừ Linh Hồn Kẻ Bội Giáo"

 ns_path_of_woe_rituals_perk_name: "$necro_magic_path_of_woe_visible$ [bs_rituals|E]"

 NS_FINDING_THE_LOCUS_PERK_EFFECT: "#flavor xác định xem một vật thể có phải là một fetter hay không#!"
 NS_EXPURGATE_THE_DAMNED_PERK_EFFECT: "#flavor Buộc một [GetTrait('wraith').GetName( GetNullCharacter )] phải xuất hiện tại một địa điểm mà thuật sĩ tử linh đã đánh dấu từ trước#!"
 NS_BLOOD_SCOURGE_PERK_EFFECT: "#flavor Dùng $pod_vitae$ của ngươi để gây cho một [GetTrait('wraith').GetName( GetNullCharacter )] nỗi đau đớn tột cùng#!"
 NS_CURSED_EUCHARIST_PERK_EFFECT: "Với vai trò một [bs_spell|E], sử dụng [GetTrait('wraith').GetName( GetNullCharacter )] bị trói buộc của ngươi để mất 25 [stress|E].\n#flavor Thuật sĩ tử linh có thể thử hút máu từ một [GetTrait('wraith').GetName( GetNullCharacter )] để hồi phục Willpower#!"
 NS_PURGE_THE_APOSTATES_SOUL_PERK_EFFECT: "#flavor Gây sát thương nghiêm trọng lên một [GetTrait('wraith').GetName( GetNullCharacter )], tạo ra một vũng plasm#!"

 NS_PATH_OF_WOE_RITUALS_PERK_EFFECT: "$necro_magic_shared_ritual_perk_effect$"
 