l_english:
 necro_magic_lifestyle_name: "Chú Thuật Tử Linh"
 necro_magic_lifestyle_desc: "Tập trung vào những quyền năng sử dụng phép thuật vốn có trong Vitae để chế ngự tử thần"
 monthly_necro_magic_lifestyle_xp_gain_mult: "[lifestyle|E] [experience|E] Chú Thuật Tử Linh hàng tháng"

 necro_magic_focus: "Chuyên Chú Chú Thuật Tử Linh"
 necro_magic_focus_modifier: "[GetFocus('necro_magic_focus').GetName]"
 necro_magic_focus_desc: "Pháp Thuật Tử Linh"
 necro_magic_focus_effect_desc: "Chuyên chú vào Chú Thuật Tử Linh mang lại:"

 necro_magic_sepulchre_path_visible: "Đạo Lăng Mộ"
 necro_magic_ash_path_visible: "Đạo Tro Tàn"
 necro_magic_bone_path_visible: "Đạo Hài Cốt"
 necro_magic_cenotaph_path_visible: "Đạo Bia Mộ"
 necro_magic_corpse_in_the_monster_visible: "Xác Chết Trong Quái Vật"
 necro_magic_graves_decay_visible: "Sự Mục Rữa Của Mộ Phần"
 necro_magic_vitreous_path_visible: "Đạo Thủy Tinh Thể"
 necro_magic_path_of_the_twilight_garden_visible: "Đạo Vườn Hoàng Hôn"
 necro_magic_skull_path_visible: "Đạo Đầu Lâu"
 necro_magic_nightshade_path_visible: "Đạo Cà Độc Dược"
 necro_magic_path_of_haunting_visible: "Đạo Ma Ám"
 necro_magic_path_of_woe_visible: "Đạo Bi Thương"

 necro_magic_shared_ritual_perk_effect: "Mở khóa [bs_rituals|E] đặc thù của [bs_path|E]"

 ns_peering_across_the_shroud_perk_name: "Nhìn Xuyên Màn Che"
 ns_summon_soul_perk_name: "Triệu Hồn"
 ns_compel_soul_perk_name: "Khống Chế Linh Hồn"
 ns_haunting_perk_name: "Ma Ám"
 ns_torment_perk_name: "Giày Vò"

 ns_sepulchre_path_rituals_perk_name: "$necro_magic_sepulchre_path_visible$ [bs_rituals|E]"

 NS_PEERING_ACROSS_THE_SHROUD_PERK_EFFECT: "Nếu bất kỳ người thân hay bạn bè nào của ngươi bị sát hại trong hoàn cảnh bí ẩn, ngươi sẽ biết được danh tính của kẻ sát nhân.\n#flavor Người chết bước đi giữa chúng ta, không ai thấy, không ai nghe. Muốn sai khiến họ, một thuật sĩ tử linh phải có khả năng cảm nhận được họ.#!"
 NS_SUMMON_SOUL_PERK_EFFECT: "$POD_can_summon_on_death_trigger_loca$\n#flavor Triệu Hồn cho phép một thuật sĩ tử linh gọi một hồn ma trở về từ [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] .#!"
 NS_COMPEL_SOUL_PERK_EFFECT: "$POD_can_weaken_fetter_trigger_loca$\n$POD_can_bind_wraith_trigger_loca$\n#flavor Dùng quyền năng này, một ma cà rồng có thể uốn ép một hồn ma theo ý muốn của mình trong một khoảng thời gian ngắn. Năng lực này đòi hỏi sự tự tin tuyệt đối, vì một khi ý chí lung lay có thể dẫn đến hậu quả tai hại cho thuật sĩ tử linh.#!"
 NS_HAUNTING_PERK_EFFECT: "Với vai trò một [bs_spell|E], ban cho địa điểm hiện tại của mục tiêu [GetModifier('spell_haunting_modifier').GetNameWithTooltip] trong 5 năm\n#flavor Một thuật sĩ tử linh dùng sức mạnh của huyết mạch mình để trói buộc một hồn ma vào một vật thể hay địa điểm.#!"
 NS_TORMENT_PERK_EFFECT: "#flavor Với việc sử dụng Giày Vò, một thuật sĩ tử linh có thể đánh vào thân xác vô hình của hồn ma như thể chính bản thân mình cũng là một hồn ma.#!"

 NS_SEPULCHRE_PATH_RITUALS_PERK_EFFECT: "$necro_magic_shared_ritual_perk_effect$"

 ns_shroudsight_perk_name: "Thấu Thị Màn Che"
 ns_tongue_of_the_dark_kingdoms_perk_name: "Ngôn Ngữ Của Vương Quốc Bóng Tối"
 ns_touch_of_the_nether_perk_name: "Chạm Vào Cõi Âm"
 ns_ex_nihilo_perk_name: "Ex Nihilo"
 ns_shroud_mastery_perk_name: "Tinh Thông Màn Che"

 ns_ash_path_rituals_perk_name: "$necro_magic_ash_path_visible$ [bs_rituals|E]"

 NS_SHROUDSIGHT_PERK_EFFECT: "$POD_can_summon_wraith_trigger_loca$\n#flavor Thấu Thị Màn Che cho phép ma cà rồng nhìn thẳng vào [UmbraGlossaryLocalized('shadowlands','Âm Phủ')].#!"
 NS_TONGUE_OF_THE_DARK_KINGDOMS_PERK_EFFECT: "$POD_can_command_wraith_trigger_loca$\n#flavor Khi thốt lên Ngôn Ngữ của [Glossary('Vương Quốc Bóng Tối','game_concept_dark_kingdom_desc')], một thuật sĩ tử linh có thể trò chuyện với các hồn ma trong [UmbraGlossaryLocalized('shadowlands','Âm Phủ')].#!"
 NS_TOUCH_OF_THE_NETHER_PERK_EFFECT: "Cho phép ngươi tương tác với các sinh thể của [umbra|E] khi ngươi đang ở trong thế giới vật chất.\n#flavor Khi thi triển Chạm Vào Cõi Âm, một thuật sĩ tử linh có thể đứng ở cả hai phía của Màn Che; nàng hiện diện hữu hình ở [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] trong khi vẫn giữ được thân xác ở thế giới của người sống.#!"
 NS_EX_NIHILO_PERK_EFFECT: "#flavor Ex Nihilo cho phép một thuật sĩ tử linh bước vào [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] bằng thân xác thật. Khi ở trong [UmbraGlossaryLocalized('shadowlands','Âm Phủ')], nàng xuất hiện như một hồn ma đặc biệt rắn chắc.#!"
 NS_SHROUD_MASTERY_PERK_EFFECT: "Mở khóa tùy chọn Điều Khiển Màn Che trong [umbra|E].\n#flavor Với quyền năng này, thuật sĩ tử linh có thể trợ giúp hoặc cản trở đáng kể khả năng hoạt động của các hồn ma trong thế giới người sống.#!"

 NS_ASH_PATH_RITUALS_PERK_EFFECT: "$necro_magic_shared_ritual_perk_effect$"

 ns_seal_of_abamixtra_perk_name: "Ấn Ký Abamixtra"
 ns_awaken_the_homuncular_servant_perk_name: "Đánh Thức Tiểu Nhân Đầy Tớ"
 ns_shambling_hordes_perk_name: "Đoàn Quân Lảo Đảo"
 ns_baleful_exorcism_perk_name: "Trừ Tà Độc Hại"
 ns_daemonic_possession_perk_name: "Ma Nhập"

 ns_bone_path_rituals_perk_name: "$necro_magic_bone_path_visible$ [bs_rituals|E]"

 NS_SEAL_OF_ABAMIXTRA_PERK_EFFECT: "Với vai trò một [bs_spell|E], triệu hồi một đội quân nhỏ [GetMaA('shambler').GetName] khi đang trong chiến tranh.\n#flavor Bằng cách viện đến Ấn Ký Abamixtra, một thuật sĩ tử linh có thể đánh thức một hoặc một nhóm xác chết để thực hiện một nhiệm vụ đơn giản.#!"
 NS_AWAKEN_THE_HOMUNCULAR_SERVANT_PERK_EFFECT: "Cải thiện [bs_spell|E] [GetPerk('ns_seal_of_abamixtra_perk').GetName(GetPlayer)] bằng cách tăng số lượng [GetMaA('shambler').GetName] được triệu hồi.\n#flavor Với quyền năng này, một thuật sĩ tử linh có thể lấy một mảnh nhỏ từ xác chết và biến nó thành một loại linh thú kỳ dị.#!"
 NS_SHAMBLING_HORDES_PERK_EFFECT: "Cải thiện [bs_spell|E] [GetPerk('ns_seal_of_abamixtra_perk').GetName(GetPlayer)] bằng cách tăng số lượng [GetMaA('shambler').GetName] được triệu hồi.\n#flavor Bằng việc sử dụng quyền năng này, một thuật sĩ tử linh có thể tạo ra một nhóm tay sai tử thi biết đi để tấn công kẻ thù của mình.#!"
 NS_BALEFUL_EXORCISM_PERK_EFFECT: "$POD_can_covert_to_wraith_trigger_loca$\n#flavor Chỉ với một lời nói và một cử chỉ mạnh mẽ, một thuật sĩ tử linh có thể trục xuất linh hồn của một người phàm ra khỏi thân xác của chính họ.#!"
 NS_DAEMONIC_POSSESSION_PERK_EFFECT: "Với vai trò một [bs_spell|E], biến một [GetTrait('wraith').GetName(GetNullCharacter)] Bị Trói Buộc thành một [GetTrait('zombu').GetName(GetNullCharacter)].\n#flavor Ma Nhập cho phép một thuật sĩ tử linh dẫn dắt một linh hồn vào một thân xác vừa mới chết.#!"

 NS_BONE_PATH_RITUALS_PERK_EFFECT: "$necro_magic_shared_ritual_perk_effect$"

 ns_a_touch_of_death_perk_name: "Một Chút Tử Khí"
 ns_reveal_the_catene_perk_name: "Hiển Lộ Catene"
 ns_tread_upon_the_grave_perk_name: "Bước Trên Mộ Phần"
 ns_death_knell_perk_name: "Chuông Báo Tử"
 ns_ephemeral_binding_perk_name: "Trói Buộc Phù Du"

 ns_cenotaph_path_rituals_perk_name: "$necro_magic_cenotaph_path_visible$ [bs_rituals|E]"

 NS_A_TOUCH_OF_DEATH_PERK_EFFECT: "#flavor Thuật sĩ tử linh hòa hợp với năng lượng còn sót lại từ sự đi qua hay sự đụng chạm của một hồn ma, cho phép nàng xác định liệu một vật thể, một người, hay một khu vực có bị một hồn ma chạm đến hoặc ảnh hưởng hay không.#!"
 NS_REVEAL_THE_CATENE_PERK_EFFECT: "Giảm chi phí [stress|E] của [GetTrait('wraith').GetName( GetNullCharacter )] bị trói buộc trong thế giới vật chất.\n#flavor Thuật sĩ tử linh nhận ra dấu vết tàn tro mà người chết để lại trên vật thể, cho phép nàng phân biệt giữa đồ chơi của hồn ma và [Fetters|E].#!"
 NS_TREAD_UPON_THE_GRAVE_PERK_EFFECT: "Giảm chi phí [stress|E] của [GetTrait('wraith').GetName( GetNullCharacter )] bị trói buộc trong thế giới vật chất.\n#flavor Thuật sĩ tử linh cảm nhận được khi nàng đang ở gần thế giới của người chết. Một thuật sĩ tử linh có thể dùng giác quan tự nhiên của mình, còn người khác có thể dùng thuật chiêm bốc, nhưng cả hai đều cảm nhận được nơi [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] chạm đến thế giới người sống.#!"
 NS_DEATH_KNELL_PERK_EFFECT: "Nếu bất kỳ [courtier|E] nào của ngươi bị sát hại trong hoàn cảnh bí ẩn, ngươi sẽ biết được danh tính của kẻ sát nhân.\n#flavor Thuật sĩ tử linh cảm nhận được khi nàng đang ở gần thế giới của người chết. Một thuật sĩ tử linh có thể dùng giác quan tự nhiên của mình, còn người khác có thể dùng thuật chiêm bốc, nhưng cả hai đều cảm nhận được nơi [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] chạm đến thế giới người sống.#!"
 NS_EPHEMERAL_BINDING_PERK_EFFECT: "[GetTrait('wraith').GetName( GetNullCharacter )] bị trói buộc trong thế giới vật chất sẽ không tốn [stress|E] nào để duy trì.\n#flavor Bằng cách truyền năng lượng tàn tro của chính mình vào một vật thể, một người, hay một địa điểm, thuật sĩ tử linh có thể tạo ra một [Fetters|E] nhân tạo thay vì phải trông chờ tìm được một cái ngẫu nhiên.#!"

 NS_CENOTAPH_PATH_RITUALS_PERK_EFFECT: "$necro_magic_shared_ritual_perk_effect$"

 ns_mortuus_in_vultus_perk_name: "Mortuus in Vultus"
 ns_algor_mortis_perk_name: "Algor Mortis"
 ns_intimations_of_mortality_perk_name: "Điềm Báo Về Cái Chết"
 ns_benedicto_mortem_perk_name: "Benedicto Mortem"
 ns_benedicto_vitae_perk_name: "Benedicto Vitae"

 ns_corpse_in_the_monster_rituals_perk_name: "$necro_magic_corpse_in_the_monster_visible$ [bs_rituals|E]"

 NS_MORTUUS_IN_VULTUS_PERK_EFFECT: "#flavor Một Cainite có thể khiến bản thân trông như một xác chết đã lâu ngày.#!"
 NS_ALGOR_MORTIS_PERK_EFFECT: "#flavor Với việc sử dụng Algor Mortis, một ma cà rồng có thể biến bản thân thành một sinh thể lạnh lùng, u buồn, không hề bị xao động bởi nỗi đau của người phàm hay sự lôi kéo tình cảm.#!"
 NS_INTIMATIONS_OF_MORTALITY_PERK_EFFECT: "Với vai trò một [bs_spell|E], ban cho mục tiêu [GetModifier('spell_intimations_of_mortality_modifier').GetNameWithTooltip] trong 5 năm.\n#flavor Điềm Báo Về Cái Chết áp đặt lên một ma cà rồng những khía cạnh khó chịu và phiền toái nhất của kiếp người.#!"
 NS_BENEDICTO_MORTEM_PERK_EFFECT: "Trở nên miễn nhiễm với ánh nắng trong các [schemes|E] sát hại.\n#flavor Với quyền năng này, một thuật sĩ tử linh hoàn toàn khoác lên mình dáng vẻ của một xác chết và có thể trút bỏ những nhược điểm của bản chất ma cà rồng nơi mình.#!"
 NS_BENEDICTO_VITAE_PERK_EFFECT: "Với vai trò một [bs_spell|E], ban cho mục tiêu [GetModifier('spell_benedicto_vitae_modifier').GetNameWithTooltip] trong 10 năm, và cũng nhận được [GetModifier('spell_benedicto_vitae_after_modifier').GetNameWithTooltip] trong 20 năm.\n#flavor Với Benedictio Vitae, một Cainite có thể tận hưởng nhiều khía cạnh tốt đẹp nhất của kiếp sống người phàm mà không phải từ bỏ sức mạnh của bản chất ma cà rồng nơi nàng.#!"

 NS_CORPSE_IN_THE_MONSTER_RITUALS_PERK_EFFECT: "$necro_magic_shared_ritual_perk_effect$"

 ns_ashes_to_ashes_perk_name: "Cát Bụi Trở Về Cát Bụi"
 ns_rigor_mortis_perk_name: "Rigor Mortis"
 ns_ashen_ladys_embrace_perk_name: "Cái Ôm Của Tro Tàn Nương Nương"
 ns_gift_of_melancholia_perk_name: "Tặng Vật U Sầu"
 ns_dust_to_dust_perk_name: "Bụi Trở Về Bụi"

 ns_graves_decay_rituals_perk_name: "$necro_magic_graves_decay_visible$ [bs_rituals|E]"

 NS_ASHES_TO_ASHES_PERK_EFFECT: "Giảm nguy cơ [masquerade_exposure_with_icon|E] và cải thiện [character_interaction|E] Che Đậy Masquerade.\n#flavor Trong khi một số Cainite tàn sát bừa bãi và không sợ hậu quả cho hành động của mình, những Cainite khác lại cảm thấy cần phải kín đáo hơn một chút. Sử dụng quyền năng này biến một xác người thành một đống tro tàn không đáng chú ý, nặng khoảng một phần năm trọng lượng cơ thể ban đầu.#!"
 NS_RIGOR_MORTIS_PERK_EFFECT: "Khi một cuộc chiến bắt đầu, nhà vô địch có prowess cao nhất của kẻ thù ngươi sẽ bị thương.\n#flavor Với quyền năng này, thuật sĩ tử linh có thể khiến bất kỳ mục tiêu nào trở nên cứng đờ và bất động như một xác chết.#!"
 NS_ASHEN_LADYS_EMBRACE_PERK_EFFECT: "Với vai trò một [bs_spell|E], khiến mục tiêu mất đi một chi ngẫu nhiên.\nMở khóa chiêu thức [single_combat_duel|E] Cái Ôm Của Tro Tàn Nương Nương\n#flavor Cái Ôm Của Tro Tàn Nương Nương khiến một chi của mục tiêu già đi, khô quắt lại, và héo tàn như những chùm nho còn sót trên dây.#!"
 NS_GIFT_OF_MELANCHOLIA_PERK_EFFECT: "Với vai trò một [bs_spell|E], lây nhiễm cho mục tiêu [GetTrait('gift_of_melancholia').GetName(GetPlayer)] hoặc phát sinh một [epidemic|E] của nó.\n#flavor Quyền năng này gây ra một chứng bệnh suy nhược độc hại cho cả người phàm và Cainite.#!"
 NS_DUST_TO_DUST_PERK_EFFECT: "Cải thiện [bs_spell|E] và chiêu thức [single_combat_duel|E] [GetPerk('ns_ashen_ladys_embrace_perk').GetName(GetPlayer)].\n#flavor Như Cát Bụi Trở Về Cát Bụi tác động lên xác chết, Bụi Trở Về Bụi tác động lên thân xác của ma cà rồng. Viện đến Bụi Trở Về Bụi cho phép một thuật sĩ tử linh biến một ma cà rồng khác thành một đống tro tàn như thể hắn đã bị mắc kẹt dưới ánh nắng hay bị thiêu trên cột hành hình.#!"

 NS_GRAVES_DECAY_RITUALS_PERK_EFFECT: "$necro_magic_shared_ritual_perk_effect$"

 ns_eyes_of_the_wraith_perk_name: "Mắt Của Wraith"
 ns_aura_of_decay_perk_name: "Hào Quang Mục Rữa"
 ns_pischachas_feast_perk_name: "Bữa Tiệc Của Pischacha"
 ns_curse_of_the_maelstrom_perk_name: "Lời Nguyền Của Xoáy Nước"
 ns_night_cry_perk_name: "Tiếng Khóc Đêm"

 ns_vitreous_path_rituals_perk_name: "$necro_magic_vitreous_path_visible$ [bs_rituals|E]"

 NS_EYES_OF_THE_WRAITH_PERK_EFFECT: "#flavor Bằng cách viện đến quyền năng này, thuật sĩ tử linh có thể nhìn thế giới theo cách mà những Hồn Ma Không Yên Nghỉ nhìn thấy.#!"
 NS_AURA_OF_DECAY_PERK_EFFECT: "Ban [GetModifier('aura_of_decay_modifier').GetNameWithTooltip] cho [knights|E] địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho đối thủ của ngươi trong [single_combat_duel_plural|E].\n#flavor Quyền năng này thúc đẩy số phận tất yếu của bất kỳ vật thể vô tri nào lọt vào hào quang đáng sợ của thuật sĩ tử linh, cho phép ma cà rồng khiến bất kỳ vật thể nào mục rữa thành một đống đổ nát.#!"
 NS_PISCHACHAS_FEAST_PERK_EFFECT: "Có thể ăn [GetTrait('wraith').GetName(GetNullCharacter)].\n#flavor Bữa Tiệc Của Pischacha cho phép một ma cà rồng sống nhờ vào năng lượng entropy lan tỏa trong không gian tại những nơi ma ám trên thế giới, hoặc ăn trực tiếp [Corpus|E] của một hồn ma.#!"
 NS_CURSE_OF_THE_MAELSTROM_PERK_EFFECT: "Với vai trò một [bs_spell|E], khiến địa điểm hiện tại của mục tiêu mất 3 [development|E] cũng như nhận [GetModifier('spell_curse_of_the_maelstrom_modifier').GetNameWithTooltip] trong 5 năm.\n#flavor Thuật sĩ tử linh có thể nguyền rủa khu vực xung quanh mình, triệu hồi các Yêu Tinh (Spectre) để gây ra hỗn loạn và tàn phá.#!"
 NS_NIGHT_CRY_PERK_EFFECT: "Ban [GetModifier('night_cry_enemy_modifier').GetNameWithTooltip] cho [knights|E] địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho đối thủ của ngươi trong [single_combat_duel_plural|E].\nBan [GetModifier('night_cry_ally_modifier').GetNameWithTooltip] cho [knights|E] đồng minh khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho chính ngươi trong [single_combat_duel_plural|E].\n#flavor Với việc sử dụng Tiếng Khóc Đêm, một thuật sĩ tử linh có thể thể hiện sự tinh thông của mình đối với các thế lực entropy. Nàng có thể hướng nó đi khỏi đồng minh để trợ giúp họ, hoặc nàng có thể truyền nó trực tiếp vào kẻ thù để cản trở chúng#!"

 NS_VITREOUS_PATH_RITUALS_PERK_EFFECT: "$necro_magic_shared_ritual_perk_effect$"

 ns_whispers_to_the_soul_perk_name: "Những Lời Thì Thầm Với Linh Hồn"
 ns_kiss_of_the_dark_mother_perk_name: "Nụ Hôn Của Mẹ Bóng Tối"
 ns_dark_humors_perk_name: "Thể Dịch Tăm Tối"
 ns_caul_of_the_neverborn_perk_name: "Màng Bọc Của Kẻ Chưa Từng Sinh Ra"
 ns_lament_of_dhainu_perk_name: "Khúc Bi Ca Của D'hainu"

 ns_path_of_the_twilight_garden_rituals_perk_name: "$necro_magic_path_of_the_twilight_garden_visible$ [bs_rituals|E]"

 NS_WHISPERS_TO_THE_SOUL_PERK_EFFECT: "Với vai trò một [bs_spell|E], ban cho mục tiêu 25 [stress|E].\n#flavor Chỉ cần nghe một lời thì thầm về danh xưng thật của Mẹ Bóng Tối cũng đủ khiến người phàm phát điên, và làm trái tim của các Cainite tràn ngập nỗi kinh hoàng#!"
 NS_KISS_OF_THE_DARK_MOTHER_PERK_EFFECT: "Chiêu thức [single_combat_duel|E] Cắn trở nên mạnh mẽ hơn.\n#flavor Lilin cắn vào lưỡi mình và làm đầy miệng mình bằng một hỗn hợp mật đen hôi thối cùng $pod_vitae$. Vết cắn của nàng trở nên đáng sợ hơn nữa, và nàng có thể ngốn lấy sinh mạng từ nạn nhân một cách dễ dàng#!"
 NS_DARK_HUMORS_PERK_EFFECT: "#flavor Lamiae được biết đến với thể lực và sự tinh thông đối với thân thể của họ. Không chỉ có thể thực hiện những kỳ công về sức mạnh thể chất đáng kinh ngạc, họ còn có thể điều khiển sự cân bằng thể dịch trong cơ thể mình bằng ý chí thuần túy.#!"
 NS_CAUL_OF_THE_NEVERBORN_PERK_EFFECT: "$POD_can_summon_wraith_trigger_loca$\n#flavor Với việc sử dụng quyền năng này, Lamia củng cố mối liên kết của mình với trái tim đen tối của Mẹ Bóng Tối. Ban cho nàng cả sự kiên cường tăng cường và khả năng nhìn vào [UmbraGlossary('shadowlands')].#!"
 NS_LAMENT_OF_DHAINU_PERK_EFFECT: "#flavor Lamia rú lên trong đau đớn, và mặt đất run rẩy. Một làn khí độc gồm bóng tối quằn quại trỗi lên từ mặt đất và bẫy lấy kẻ thù của nàng. Những kẻ bị bóng tối bắt giữ không bị trói buộc về thân thể, nhưng ngay lập tức bị dày vò bởi nỗi thống khổ tình cảm sâu sắc và trần trụi đến mức họ tìm cách kết liễu đời mình theo cách nhanh nhất có thể.#!"

 NS_PATH_OF_THE_TWILIGHT_GARDEN_RITUALS_PERK_EFFECT: "$necro_magic_shared_ritual_perk_effect$"

 ns_calvaria_emissicius_perk_name: "Calvaria Emissicius"
 ns_consilium_mortuus_perk_name: "Consilium Mortuus"
 ns_ammorsus_vicarius_perk_name: "Ammorsus Vicarius"
 ns_exedo_animus_perk_name: "Exedo Animus"
 ns_degulo_perk_name: "Degulo"

 NS_CALVARIA_EMISSICIUS_PERK_EFFECT: "#flavor Một trong những bí mật quý giá nhất của Clan Cappadocian là khả năng theo dõi qua hốc mắt của người chết.#!"
 NS_CONSILIUM_MORTUUS_PERK_EFFECT: "Tốc Độ Tiến Triển [espionage|E]: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#flavor Bằng cách trò chuyện với chiếc đầu bị chặt đứt của mục tiêu đã khuất, hóa ra việc khai thác một sự thật chắc chắn từ đôi môi đã mục rữa hoàn toàn khả thi.#!"
 NS_AMMORSUS_VICARIUS_PERK_EFFECT: "#flavor Sử dụng quyền năng này, thuật sĩ tử linh có thể nắm lấy hàm dưới và hàm trên của một chiếc đầu lâu để dùng như một vũ khí cận chiến kỳ dị, gắn đầu lâu vào mũi giáo để tấn công từ xa, hoặc thậm chí để đầu lâu ở đó một mình, hoạt động như một cái bẫy.#!"
 NS_EXEDO_ANIMUS_PERK_EFFECT: "Tốc Độ Tiến Triển [espionage|E]: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#flavor Bằng cách mang theo một chiếc đầu lâu — dù từ người phàm hay Cainite — thuật sĩ tử linh hình thành một liên kết đồng cảm với chủ nhân cũ của chiếc đầu lâu ấy.#!"
 NS_DEGULO_PERK_EFFECT: "Với vai trò một [character_interaction|E], có thể ăn đầu lâu của một [prisoner|E] để nhận [perks|E] trong $pod_discipline$ đã chọn.\n#flavor Degulo là phương pháp mà một thuật sĩ tử linh dùng để hấp thụ một mảnh linh hồn và giữ nó vĩnh viễn như một phần của bản thân#!"

 ns_tend_the_body_garden_perk_name: "Chăm Sóc Vườn Xác Thịt"
 ns_witchs_fruit_perk_name: "Quả Của Nữ Phù Thủy"
 ns_raise_the_green_one_perk_name: "Đánh Thức Kẻ Xanh"
 ns_wails_and_whispers_perk_name: "Tiếng Rên Rỉ Và Thì Thầm"
 ns_chthonic_womb_perk_name: "Tử Cung Địa Ngục"

 ns_nightshade_path_rituals_perk_name: "$necro_magic_nightshade_path_visible$ [bs_rituals|E]"

 NS_TEND_THE_BODY_GARDEN_PERK_EFFECT: "Giảm nguy cơ [masquerade_exposure_with_icon|E] và cải thiện [character_interaction|E] Che Đậy Masquerade.\n#flavor Một thuật sĩ tử linh với quyền năng này có thể tăng tốc hoặc làm chậm quá trình mục rữa, biến một người phàm đã chết thành một vật chủ phình to cho ruồi trong chớp mắt hoặc vô hiệu hóa sự mục rữa của Tử Vong Vĩnh Viễn.#!"
 NS_WITCHS_FRUIT_PERK_EFFECT: "#flavor Mọi loài cây đều nhờ vào cái chết để sinh trưởng. Những thứ mục rữa làm giàu cho đất, và cây cối, dây leo, cỏ dại hấp thụ tiếng vọng hoại tử cùng với các dưỡng chất sống. Một thuật sĩ tử linh có thể đánh thức hào quang tử khí này bằng cách để trái cây của họ tiếp xúc với máu của nàng.#!"
 NS_RAISE_THE_GREEN_ONE_PERK_EFFECT: "#flavor Các thuật sĩ tử linh dòng Cà Độc Dược có thể đánh thức một xác chết được trói buộc và tăng cường bởi thực vật. Lá cây che phủ da nó và những dây leo chắc khỏe bồi đắp cho các đường gân đã mục rữa của nó. Cái vỏ sống này mang lại tốc độ và bản năng tự bảo vệ không thấy được ở những xác chết hoạt động khác.#!"
 NS_WAILS_AND_WHISPERS_PERK_EFFECT: "#flavor Khi sự am hiểu của thuật sĩ tử linh ngày càng sâu sắc, nàng thăm dò lằn ranh mong manh giữa sự sống và cái chết. Khi nàng thét lên như một banshee, nàng có thể dẫn dụ một linh hồn đến cái chết của nó, làm tăng khả năng xảy ra một vết thương chí mạng.#!"
 NS_CHTHONIC_WOMB_PERK_EFFECT: "Rút cạn một người phàm trong lúc hút máu sẽ đánh thức họ thành một [GetTrait('wraith').GetName( GetNullCharacter )].\n#flavor Ở tuyệt đỉnh của Đạo này, một thuật sĩ tử linh kết hợp sát nhân và khả năng sinh sản để sinh ra hồn ma của một người phàm mà nàng đã giết.#!"

 NS_NIGHTSHADE_PATH_RITUALS_PERK_EFFECT: "$necro_magic_shared_ritual_perk_effect$"

 ns_song_of_the_dead_perk_name: "Bài Ca Của Người Chết"
 ns_summon_wisp_perk_name: "Triệu Hồi Đóm Lửa"
 ns_harrowing_perk_name: "Giày Vò Tâm Can"
 ns_phantasms_perk_name: "Ảo Ảnh"
 ns_h_torment_perk_name: "Giày Vò"

 ns_path_of_haunting_rituals_perk_name: "$necro_magic_path_of_haunting_visible$ [bs_rituals|E]"

 NS_SONG_OF_THE_DEAD_PERK_EFFECT: "Với vai trò một [bs_spell|E], ban cho mục tiêu 25 [static_stress|E] với giá phải trả là [static_stress|E] cho chính ngươi.\n#flavor Ma cà rồng ngâm nga, dệt những lời không ai nghe thấy vào bài ca và gieo vào người nghe một nỗi ám ảnh bệnh hoạn với cái chết.#!"
 NS_SUMMON_WISP_PERK_EFFECT: "#flavor Ma cà rồng truyền những giọt máu của mình bằng năng lượng phù du của [UmbraGlossaryLocalized('shadowlands','Âm Phủ')], triệu hồi một quả cầu ánh sáng chập chờn. Đóm lửa có thể dẫn dụ những người phàm không nghi ngờ vào một cái bẫy hoặc tạo ra một sự đánh lạc hướng khéo léo.#!"
 NS_HARROWING_PERK_EFFECT: "Cải thiện [GetPerk('ns_song_of_the_dead_perk').GetName(GetNullCharacter)] bằng cách tăng [static_stress|E] mục tiêu lên 50 và giảm giá phải trả xuống 13 [static_stress|E].\n#flavor Giày Vò Tâm Can kéo dài nỗi khủng khiếp gây ra bởi Bài Ca Của Người Chết bằng cách ám ảnh nàng trong lúc ngủ, biến những giấc mơ của nàng thành những cảnh tượng ác mộng về cái chết của chính mình#!"
 NS_PHANTASMS_PERK_EFFECT: "Cải thiện [GetPerk('ns_song_of_the_dead_perk').GetName(GetNullCharacter)] bằng cách tăng [static_stress|E] mục tiêu lên 75.\n#flavor Ma cà rồng nhào nặn năng lượng của [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] thành những ảo giác phức tạp khủng bố người sống.#!"
 NS_H_TORMENT_PERK_EFFECT: "Cải thiện [GetPerk('ns_song_of_the_dead_perk').GetName(GetNullCharacter)] bằng cách tăng [static_stress|E] mục tiêu lên 100.\n#flavor Ma cà rồng xé rách màn che giữa sự sống và [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] quanh nạn nhân của mình, gọi những hồn ma ác độc đến ám ảnh nàng.#!"

 NS_PATH_OF_HAUNTING_RITUALS_PERK_EFFECT: "$necro_magic_shared_ritual_perk_effect$"

 ns_finding_the_locus_perk_name: "Tìm Ra Trọng Tâm"
