 numina_healing_common_description: "#flavor Ở bất cứ nơi nào nhân loại sinh sống phát triển, luôn có nhu cầu về chữa lành. Từ khi nền văn minh khởi nguồn, các nhà chữa bệnh xuất hiện từ sự đồng cảm và nhu cầu cộng đồng, họ học cách phụng sự người dân mình qua truyền thống, giao tiếp với linh hồn, thử-sai, và vô số cách khác.#!"

