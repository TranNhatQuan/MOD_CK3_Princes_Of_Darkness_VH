 numina_quintessence_manipulation_common_description: "#flavor Hầu như mọi thuật sĩ đều đồng ý về một điều. Có một luồng năng lượng cung cấp sức mạnh cho những công trình của họ. Cái tên của năng lượng đó đã mang nhiều hình dạng và triết lý khác nhau: mana, khí, gnosis, shakti, sekhem, và nhiều tên khác. Mọi thuật sĩ đều có thể miêu tả luồng năng lượng khi họ áp đặt ý chí lên thực tại. Chảy qua họ như dòng điện qua đường dây, nó có thể được cảm nhận, và với một số người, nó có thể được khai thác trực tiếp.#!"

