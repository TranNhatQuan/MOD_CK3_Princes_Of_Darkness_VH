 numina_fortune_6_perk_name: "$numina_6_name$ Vận Số Thuật"
 numina_fortune_common_description: "#flavor Định mệnh vốn thất thường, ngay cả trước khi tính đến sự thao túng của các thuật sĩ. Con Đường Vận Số Thuật cho phép họ vận dụng may rủi như một thứ vũ khí, hạ gục kẻ thù bằng lời nguyền hoặc củng cố đồng minh bằng phước lành. Dù phương pháp và cách giải thích có khác nhau, từ Con Mắt Ác Độc, đến Tay của Chúa, đến thao túng xác suất, Con Đường Vận Số Thuật không bao giờ làm cho điều thực sự bất khả xảy ra, mà chỉ làm cho điều cực kỳ khó xảy ra. Đây cũng là một trong những Con Đường kém chính xác nhất: Trong khi thuật sĩ dân gian khởi động Vận Số và kiểm soát cường độ cùng phạm vi chung của các kết quả tiềm năng, hiệu ứng của Con Đường này thường gây bất ngờ cho họ hoặc biến mất vào sự ồn ào của đời thường.#!"

 NUMINA_FORTUNE_1_PERK_EFFECT: "$numina_fortune_common_description$"
 NUMINA_FORTUNE_2_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Nguyền một mục tiêu [splat|E] giống người phàm (ví dụ: [GetTrait('ghoul').GetName(GetNullCharacter)], [GetTrait('revenant').GetName(GetNullCharacter)], [GetTrait('kinfolk').GetName(GetNullCharacter)]) khiến họ bị thương.\n@sorcerer_icon![bs_spell|E]: Ban phước cho mục tiêu bằng cách cấp [GetModifier('numina_fortune_2_bless_modifier').GetNameWithTooltip].\n$numina_fortune_common_description$"
 NUMINA_FORTUNE_3_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Thực hiện một nghi lễ dò tìm để nhận [gold_i]#V 50#!.\nCải thiện @sorcerer_icon![bs_spell|E] #TOOLTIP:PERK,numina_fortune_2_perk #L Chú Thuật#!#! bằng cách làm nặng thêm vết thương gây ra.\nCải thiện @sorcerer_icon![bs_spell|E] #TOOLTIP:PERK,numina_fortune_2_perk #L Ban Phước#!#! bằng cách cấp [GetModifier('numina_fortune_3_bless_modifier').GetNameWithTooltip] thay vào đó.\n$numina_fortune_common_description$"
 NUMINA_FORTUNE_4_PERK_EFFECT: "Cải thiện @sorcerer_icon![bs_spell|E] #TOOLTIP:PERK,numina_fortune_2_perk #L Chú Thuật#!#! bằng cách gây tàn tật cho mục tiêu.\nCải thiện @sorcerer_icon![bs_spell|E] #TOOLTIP:PERK,numina_fortune_2_perk #L Ban Phước#!#! bằng cách cấp [GetModifier('numina_fortune_4_bless_modifier').GetNameWithTooltip] thay vào đó.\nCải thiện @sorcerer_icon![bs_spell|E] #TOOLTIP:PERK,numina_fortune_3_perk #L Thuật Dò Tìm#!#! bằng cách tăng sản lượng lên [gold_i]#V 100#!.\n$numina_fortune_common_description$"
 NUMINA_FORTUNE_5_PERK_EFFECT: "Cải thiện @sorcerer_icon![bs_spell|E] #TOOLTIP:PERK,numina_fortune_2_perk #L Chú Thuật#!#! bằng cách cho phép nhắm vào bất kỳ [splat|E] hữu hình nào dưới #V 500#! tuổi.\nCải thiện @sorcerer_icon![bs_spell|E] #TOOLTIP:PERK,numina_fortune_2_perk #L Ban Phước#!#! bằng cách cấp [GetModifier('numina_fortune_5_bless_modifier').GetNameWithTooltip] thay vào đó.\nCải thiện @sorcerer_icon![bs_spell|E] #TOOLTIP:PERK,numina_fortune_3_perk #L Thuật Dò Tìm#!#! bằng cách tăng sản lượng lên [gold_i]#V 150#!.\n$numina_fortune_common_description$"
 NUMINA_FORTUNE_6_PERK_EFFECT: "Cải thiện [bs_spell|E] #TOOLTIP:PERK,numina_fortune_2_perk #L Chú Thuật#!#! bằng cách cho phép nhắm vào bất kỳ [splat|E] nào.\nCải thiện @sorcerer_icon![bs_spell|E] #TOOLTIP:PERK,numina_fortune_2_perk #L Ban Phước#!#! bằng cách cấp [GetModifier('numina_fortune_6_bless_modifier').GetNameWithTooltip] thay vào đó.\nCải thiện @sorcerer_icon![bs_spell|E] #TOOLTIP:PERK,numina_fortune_3_perk #L Thuật Dò Tìm#!#! bằng cách tăng sản lượng lên [gold_i]#V 200#!.\n$numina_fortune_common_description$"

