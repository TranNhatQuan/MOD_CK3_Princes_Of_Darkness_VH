 numina_alchemy_1_perk_name: "$numina_1_name$ Giả Kim Thuật"
 numina_alchemy_2_perk_name: "$numina_2_name$ Giả Kim Thuật"
 numina_alchemy_3_perk_name: "$numina_3_name$ Giả Kim Thuật"
 numina_alchemy_4_perk_name: "$numina_4_name$ Giả Kim Thuật"
 numina_alchemy_5_perk_name: "$numina_5_name$ Giả Kim Thuật"
 numina_alchemy_6_perk_name: "$numina_6_name$ Giả Kim Thuật"
 numina_alchemy_common_description: "#flavor Nghiên cứu về biến đổi và tinh luyện, Giả Kim Thuật là một môn nghệ thuật và khoa học cổ xưa. Người hành nghề vận dụng nhiều tập tục khác nhau, cả huyền bí và khoa học, để hiểu được những đặc tính ẩn giấu của vật chất và linh hồn. Mục tiêu truyền thống nhất của giả kim thuật không phải là sự biến đổi nổi tiếng hơn của vật chất thô thành các đối tác 'cao quý' hơn — như biến chì thành vàng — mà là sự hoàn thiện của bản thân nhà giả kim.#!"

 NUMINA_ALCHEMY_1_PERK_EFFECT: "$unlock_brewing_node$ [GetModifier('alchemy_antidepresants_1_modifier').GetNameWithTooltip]\n$unlock_brewing_node$ [GetModifier('alchemy_aphrodisiac_1_modifier').GetNameWithTooltip]\n$unlock_brewing_node$ [GetModifier('alchemy_poison_1_modifier').GetNameWithTooltip]\n$unlock_brewing_node$ [GetModifier('alchemy_antibiotics_1_modifier').GetNameWithTooltip]\n$numina_alchemy_common_description$"
 NUMINA_ALCHEMY_2_PERK_EFFECT: "Cải thiện toàn bộ [crafting_nodes|E] của [GetPerk('numina_alchemy_1_perk').GetName(GetPlayer)]\n$unlock_brewing_node$ Thêm một [modifier|E] tăng ngẫu nhiên 1 [skill|E] ([GetModifier('alchemy_stimulant_diplomacy_modifier').GetNameWithTooltip])\n$numina_alchemy_common_description$"
 NUMINA_ALCHEMY_3_PERK_EFFECT: "Cải thiện toàn bộ [crafting_nodes|E] của [GetPerk('numina_alchemy_2_perk').GetName(GetPlayer)]\n$numina_alchemy_common_description$"
 NUMINA_ALCHEMY_4_PERK_EFFECT: "Cải thiện toàn bộ [crafting_nodes|E] của [GetPerk('numina_alchemy_3_perk').GetName(GetPlayer)]\n$unlock_brewing_node$ [GetModifier('alchemy_health_booster_1_modifier').GetNameWithTooltip]\n$numina_alchemy_common_description$"
 NUMINA_ALCHEMY_5_PERK_EFFECT: "Cải thiện toàn bộ [crafting_nodes|E] của [GetPerk('numina_alchemy_4_perk').GetName(GetPlayer)]\n$unlock_brewing_node$ #TOOLTIP:GAME_TRAIT,immortal,[GetNullCharacter] #L Bất Tử#!\n$unlock_brewing_node$ #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L Ma Cà Rồng#!\nThời gian hiệu lực thuốc: #P +1#!\n$numina_alchemy_common_description$"
 NUMINA_ALCHEMY_6_PERK_EFFECT: "Cải thiện toàn bộ [crafting_nodes|E] của [GetPerk('numina_alchemy_5_perk').GetName(GetPlayer)]\n$unlock_brewing_node$ Tăng một [skill|E] được chọn lên #P 1#! bằng cách hiến tế một [character|E] có [skill|E] đó trên #bold [EmptyScope.ScriptValue('POD_numina_sorcery_alchemy_skill_potion_requirement')]#!\nThời gian hiệu lực thuốc: #P +2#!\n$numina_alchemy_common_description$"

 NUMINA_ALCHEMY_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon! Bạn phải hoàn thành [journey|E] #v Nghiên Cứu Đại Tôn Sư Huyền Bí: Giả Kim Thuật#! trước tiên#!"

 numina_conjuration_1_perk_name: "$numina_1_name$ Triệu Hoán Thuật"
 numina_conjuration_2_perk_name: "$numina_2_name$ Triệu Hoán Thuật"
 numina_conjuration_3_perk_name: "$numina_3_name$ Triệu Hoán Thuật"
 numina_conjuration_4_perk_name: "$numina_4_name$ Triệu Hoán Thuật"
 numina_conjuration_5_perk_name: "$numina_5_name$ Triệu Hoán Thuật"
 numina_conjuration_6_perk_name: "$numina_6_name$ Triệu Hoán Thuật"
 numina_conjuration_common_description: "#flavor Triệu Hoán Thuật là con đường tiêu biểu của các nhà ảo thuật sân khấu: rút thỏ từ mũ và bài từ túi khán giả là những ví dụ phổ biến nhất về ứng dụng cơ bản nhất của nó. Các thuật sĩ muốn kiếm sống từ việc nghiên cứu của mình thường học Triệu Hoán Thuật. Vì mối liên hệ khó tách rời này với ảo thuật sân khấu, những Người Ngủ có xu hướng giải thích Triệu Hoán Thuật đơn giản chỉ là kỹ xảo tay nghề điêu luyện.#!"

 NUMINA_CONJURATION_1_PERK_EFFECT: "$numina_conjuration_common_description$"
 NUMINA_CONJURATION_2_PERK_EFFECT: "$numina_conjuration_common_description$"
 NUMINA_CONJURATION_3_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Triệu hồi một con vật nuôi ngẫu nhiên.\n$numina_conjuration_common_description$"
 NUMINA_CONJURATION_4_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Triệu hồi ngẫu nhiên một [artifact|E] #color_dark_green Kiệt Tác#!.\n$numina_conjuration_common_description$"
 NUMINA_CONJURATION_5_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Triệu hồi một [GetTrait('mortal').GetName(GetPlayer)] hoặc mục tiêu siêu nhiên tự nguyện.\nCải thiện @sorcerer_icon![bs_spell|E] của [GetPerk('numina_conjuration_4_perk').GetName(GetPlayer)] bằng cách triệu hồi một [artifact|E] #FAMEDBLUE Danh Tiếng#! thay vào đó.\n$numina_conjuration_common_description$"
 NUMINA_CONJURATION_6_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Triệu hồi một [GetTrait('demon').GetName(GetPlayer)] từ Vực Sâu. Chọn chính mình để triệu hồi một Ác Quỷ ngẫu nhiên, hoặc chọn một [GetTrait('demon').GetName(GetPlayer)] đang bị [GetModifier('trapped_in_abyss_modifier').GetNameWithTooltip] để triệu hồi đích danh họ.\nCải thiện @sorcerer_icon![bs_spell|E] của [GetPerk('numina_conjuration_4_perk').GetName(GetPlayer)] bằng cách triệu hồi một [artifact|E] #ILLUSTRIOUSPURPLE Lỗi Lạc#! thay vào đó.\nCải thiện @sorcerer_icon![bs_spell|E] của [GetPerk('numina_conjuration_5_perk').GetName(GetPlayer)] bằng cách loại bỏ yêu cầu về thiện cảm.\n$numina_conjuration_common_description$"

 NUMINA_CONJURATION_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon! Bạn phải hoàn thành [journey|E] #V Nghiên Cứu Đại Tôn Sư Huyền Bí: Triệu Hoán Thuật#! trước tiên#!"

 numina_conveyance_1_perk_name: "$numina_1_name$ Vận Chuyển Thuật"
 numina_conveyance_2_perk_name: "$numina_2_name$ Vận Chuyển Thuật"
 numina_conveyance_3_perk_name: "$numina_3_name$ Vận Chuyển Thuật"
 numina_conveyance_4_perk_name: "$numina_4_name$ Vận Chuyển Thuật"
 numina_conveyance_5_perk_name: "$numina_5_name$ Vận Chuyển Thuật"
 numina_conveyance_6_perk_name: "$numina_6_name$ Vận Chuyển Thuật"
 numina_conveyance_common_description: "#flavor Dù là mơ về dịch chuyển tức thời hay chổi bay, con người luôn muốn di chuyển nhanh chóng từ nơi này đến nơi khác. Cho dù họ có thể làm được điều đó nhanh đến đâu, thì vẫn không bao giờ là đủ nhanh, và nhiều người tìm đến ma thuật và các khoa học kỳ lạ để đến nơi mình muốn sớm hơn nữa. Cho đến khi đạt đến đỉnh cao của việc thông thạo Con Đường, một thuật sĩ dân gian sử dụng Vận Chuyển Thuật cần một loại phương tiện nào đó, được chuẩn bị cho một chuyến đi duy nhất bởi chính thuật sĩ.#!"

 NUMINA_CONVEYANCE_1_PERK_EFFECT: "$numina_conveyance_common_description$"
 NUMINA_CONVEYANCE_2_PERK_EFFECT: "$numina_conveyance_common_description$"
 NUMINA_CONVEYANCE_3_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Dịch chuyển tức thời đến điểm đến kế tiếp của bạn khi đang di chuyển.\n$numina_conveyance_common_description$
 NUMINA_CONVEYANCE_4_PERK_EFFECT: "$numina_conveyance_common_description$"
 NUMINA_CONVEYANCE_5_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Dịch chuyển tức thời một quân đội bạn đang chỉ huy đến vị trí của mục tiêu.\n$numina_conveyance_common_description$"
 NUMINA_CONVEYANCE_6_PERK_EFFECT: "Cải thiện @sorcerer_icon![bs_spell|E] của [GetPerk('numina_conveyance_5_perk').GetName(GetPlayer)] bằng cách dỡ bỏ giới hạn quy mô quân đội.\n$numina_conveyance_common_description$"

 NUMINA_CONVEYANCE_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon! Bạn phải hoàn thành [journey|E] #V Nghiên Cứu Đại Tôn Sư Huyền Bí: Vận Chuyển Thuật#! trước tiên#!"

 numina_divination_1_perk_name: "$numina_1_name$ Bói Toán Thuật"
 numina_divination_2_perk_name: "$numina_2_name$ Bói Toán Thuật"
 numina_divination_3_perk_name: "$numina_3_name$ Bói Toán Thuật"
 numina_divination_4_perk_name: "$numina_4_name$ Bói Toán Thuật"
 numina_divination_5_perk_name: "$numina_5_name$ Bói Toán Thuật"
 numina_divination_6_perk_name: "$numina_6_name$ Bói Toán Thuật"
 numina_divination_common_description: "#flavor Đọc lá trà, gieo đá rune hay xương, quan sát bầu trời đêm — tất cả đều là ví dụ về những tập tục truyền thống của Bói Toán Thuật, với nhiều biến thể trải rộng qua vô số nền văn hóa. Từ khi có khái niệm về tương lai, đã có người muốn biết tương lai dành gì cho họ. Một thuật sĩ dân gian thực hiện các hành động Bói Toán tìm cách dự đoán tương lai. Tuy nhiên, tương lai là một mớ hỗn độn luôn biến đổi và mờ mịt. Một thuật sĩ có thể dùng Bói Toán Thuật để tìm ra manh mối về những kết quả khả dĩ nhất, nhưng nhà tiên tri khôn ngoan hiểu giá trị của việc diễn giải chính xác thứ biểu tượng mơ hồ, mộng mị để đánh giá những khả năng thay đổi có thể xảy ra.#!"

 NUMINA_DIVINATION_1_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$\n$numina_divination_common_description$"
 NUMINA_DIVINATION_2_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Phát hiện một [secret|E] ngẫu nhiên của mục tiêu.\n$numina_divination_common_description$"
 NUMINA_DIVINATION_3_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$\n$numina_divination_common_description$"
 NUMINA_DIVINATION_4_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Phát hiện một [scheme|E] ngẫu nhiên của mục tiêu.\nBạn sẽ nhận được thông báo nếu có ai định giết bạn bè hoặc gia đình của bạn.\n$numina_divination_common_description$"
 NUMINA_DIVINATION_5_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Phát hiện một [scheme|E] ngẫu nhiên nhằm vào mục tiêu.\n$countermeasures_unlocks_t3_all_seeing_eye$\n$numina_divination_common_description$"
 NUMINA_DIVINATION_6_PERK_EFFECT: "Cải thiện @sorcerer_icon![bs_spell|E] của [GetPerk('numina_divination_5_perk').GetName(GetPlayer)] bằng cách ngăn chặn luôn [scheme|E] đã phát hiện.\n$countermeasures_unlocks_t4_all_seeing_eye$\n$numina_divination_common_description$"

 NUMINA_DIVINATION_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon! Bạn phải hoàn thành [journey|E] #V Nghiên Cứu Đại Tôn Sư Huyền Bí: Bói Toán Thuật#! trước tiên#!"

 numina_enchantment_1_perk_name: "$numina_1_name$ Phù Chú Thuật"
 numina_enchantment_2_perk_name: "$numina_2_name$ Phù Chú Thuật"
 numina_enchantment_3_perk_name: "$numina_3_name$ Phù Chú Thuật"
 numina_enchantment_4_perk_name: "$numina_4_name$ Phù Chú Thuật"
 numina_enchantment_5_perk_name: "$numina_5_name$ Phù Chú Thuật"
 numina_enchantment_6_perk_name: "$numina_6_name$ Phù Chú Thuật"
 numina_enchantment_common_description: "#flavor Con Đường Phù Chú Thuật đền đáp sự kiên nhẫn và tính toán trước hơn bất kỳ Con Đường nào khác. Không có phép thuật tức thời trên Con Đường này, chỉ có các nghi lễ, bao gồm những nghi lễ dài và khó khăn để tạo ra các vật thể ma thuật gọi là Hiện Vật. Mỗi Hiện Vật này phải được chế tác cẩn thận bởi Người Phù Chú Thuật. Bước đầu tiên là tạo ra vật phẩm cơ bản bình thường. Thường thì những thứ này được chế tác thủ công bởi Người Phù Chú Thuật, đẩy kỹ năng bình thường của họ đến giới hạn để tạo ra đúng vật chứa cho ma thuật của mình. Tuy nhiên, đôi khi vật chứa phù hợp lại được tìm thấy dưới dạng một vật thể hiếm hoặc cổ xưa. Sau khi vật chứa được tạo ra hoặc tìm thấy, Người Phù Chú Thuật có thể bắt đầu quá trình truyền năng lượng ma thuật vào vật thể để sử dụng sau này.#!"

 NUMINA_ENCHANTMENT_1_PERK_EFFECT: "Cải thiện các [crafting_nodes|E] cơ bản\n$numina_enchantment_common_description$"
 NUMINA_ENCHANTMENT_2_PERK_EFFECT: "Cải thiện các [crafting_nodes|E] cơ bản\nMở khóa các phiên bản yếu hơn của [crafting_nodes|E] cơ bản cho [crafting_enhancing|E]\n$numina_enchantment_common_description$"
 NUMINA_ENCHANTMENT_3_PERK_EFFECT: "Cải thiện các [crafting_nodes|E] cơ bản và các phiên bản [crafting_enhancing|E] của chúng\n$numina_enchantment_common_description$"
