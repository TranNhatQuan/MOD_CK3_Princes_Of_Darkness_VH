 NUMINA_HEALING_5_PERK_EFFECT: "Cải thiện @sorcerer_icon![bs_spell|E] #TOOLTIP:PERK,numina_healing_2_perk #L Hồi Phục#!#! bằng cách tăng lượng hồi phục lên [EmptyScope.ScriptValue('POD_numina_sorcery_healing_5_heal')|V0] [POD_superficial_damage_with_box|E] và [EmptyScope.ScriptValue('POD_numina_sorcery_healing_5_aggravated_heal')|V0] [POD_aggravated_damage_with_box|E]. Nó cũng chữa các [traits|E] tàn tật như [GetTrait('one_eyed').GetName(GetPlayer)], [GetTrait('maimed').GetName(GetPlayer)] v.v.\nCải thiện @sorcerer_icon![bs_spell|E] #TOOLTIP:PERK,numina_healing_2_perk #L Chữa Bệnh#!#! bằng cách chữa thêm các bệnh không thể chữa như [GetTrait('cancer').GetName(GetPlayer)] hoặc [GetTrait('infirm').GetName(GetPlayer)].\n$numina_healing_common_description$"
