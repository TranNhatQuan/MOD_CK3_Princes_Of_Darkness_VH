 numina_ephemera_common_description: "#flavor Một số thuật sĩ — những người tập trung vào Con Đường Chú Thuật Tử Linh — điều khiển linh hồn. Những ai theo Con Đường Linh Thể Thuật tìm kiếm một mối quan hệ gần gũi hơn với chúng. Đối với các thuật sĩ dùng Con Đường Linh Thể Thuật, quan hệ của họ với linh hồn giống như gia đình và bạn bè hơn là chủ và nô bộc. Khi họ gọi một linh hồn, đó là một lời mời, không phải một lệnh triệu. Thay vì trói buộc và điều khiển linh hồn, Con Đường Linh Thể Thuật cho phép thuật sĩ thương lượng với chúng.#!"

