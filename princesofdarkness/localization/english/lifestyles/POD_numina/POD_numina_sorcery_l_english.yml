 numina_illusion_common_description: "#flavor Một trong những ma thuật cơ bản nhất là năng lực đánh lừa người khác tin vào điều mà thuật sĩ muốn. Con Đường Ảo Ảnh Thuật làm rối loạn các giác quan, khiến mục tiêu nhận thức những thứ không có thật hoặc thay đổi nhận thức của họ về những thứ đang tồn tại. Hầu hết mọi người tin vào giác quan của mình. 'Thấy là tin', nhưng khi có một nhà ảo thuật gần đó, câu tục ngữ cũ này có thể giết chết bạn.#!"

