 numina_shadows_common_description: "#flavor Sức mạnh bóng tối là một khuôn mẫu mà một số thuật sĩ không ngại bám vào vì sự hào hứng mang tính mỉa mai hoặc niềm tin thực sự. Không ai sai khi cho rằng Con Đường Bóng Tối Thuật là nguồn gốc của quan niệm rằng các thế lực hắc ám tiếp sức cho nghệ thuật huyền bí, xét đến việc những kẻ lừa đảo thường đưa ra tuyên bố này. Bất kể tiếng tăm của nó, Con Đường này thực sự mang một không khí đáng sợ và đe dọa, khi nó tạo hình và biến đổi bản chất của nỗi sợ bản năng — bóng tối và u ám.#!"

