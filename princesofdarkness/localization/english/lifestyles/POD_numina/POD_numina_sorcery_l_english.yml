 NUMINA_FASCINATION_5_PERK_EFFECT: "Cải thiện @sorcerer_icon![bs_spell|E] của [GetPerk('numina_fascination_4_perk').GetName(GetPlayer)]  bằng cách nhận [strong_hook|E] thay vào đó.\n[lovers|E] của bạn đôi khi sẽ cố khởi xướng [scheme|E] [GetScheme('murder').GetTypeName] chống lại [rivals|E] của bạn.\nNhận khả năng phòng thủ tinh thần mạnh mẽ.\n$numina_fascination_common_description$"
