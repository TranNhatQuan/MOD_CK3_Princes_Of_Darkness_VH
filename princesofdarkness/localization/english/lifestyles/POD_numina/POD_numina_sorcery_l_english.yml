 numina_shapeshifting_6_perk_name: "$numina_6_name$ Biến Hình Thuật"
 numina_shapeshifting_common_description: "#flavor Ngay cả trong số các ma thuật nguyên sơ, khả năng biến thành động vật vẫn nổi bật như một điều đặc biệt. Nhiều quái vật rình rập trong màn đêm có năng lực biến hình, bao gồm cả những kẻ biến hình thực sự. Các thuật sĩ dân gian nghiên cứu Con Đường Biến Hình Thuật mô phỏng một phần sức mạnh của chúng, biến đổi trước tiên là các phần trên cơ thể mình và sau đó là toàn bộ cơ thể theo những cách ngoạn mục.#!"

 NUMINA_SHAPESHIFTING_1_PERK_EFFECT: "Tùy Chọn [shapeshift|EU]: Thay đổi các đặc điểm trên mặt của bạn.\nTùy Chọn [shapeshift|EU]: Thay đổi tuổi ngoại hình của bạn (nếu bất tử).\n$numina_shapeshifting_common_description$"
 NUMINA_SHAPESHIFTING_2_PERK_EFFECT: "Tùy Chọn [shapeshift|EU]: Biến hình thành #V Hình Dạng Thú Tính#! của bạn.\nTùy Chọn [shapeshift|EU]: Mua tối đa #V 2#! bộ phận động vật để đưa vào #V Hình Dạng Thú Tính#! của bạn, hoặc cải thiện một bộ phận đã có.\n$numina_shapeshifting_common_description$"
