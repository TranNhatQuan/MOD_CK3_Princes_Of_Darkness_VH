 NUMINA_ONEIROMANCY_2_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Gây [stress_i]#V 15#! [stress|E] cho mục tiêu. Mục tiêu cũng có #V 5%#! cơ hội nhận một cơ chế đối phó tiêu cực ngẫu nhiên và #V 2.5%#! cơ hội mắc một bệnh tâm lý ngẫu nhiên.\n$numina_oneiromancy_common_description$"
 NUMINA_ONEIROMANCY_3_PERK_EFFECT: "Cải thiện @sorcerer_icon![bs_spell|E] của [GetPerk('numina_oneiromancy_2_perk').GetName(GetPlayer)] bằng cách tăng [stress|E] lên [stress_i]#V 25#!, cơ hội cho cơ chế đối phó tiêu cực lên #V 10%#!, và cơ hội cho bệnh tâm lý lên #V 5%#!.\n$numina_oneiromancy_common_description$"
