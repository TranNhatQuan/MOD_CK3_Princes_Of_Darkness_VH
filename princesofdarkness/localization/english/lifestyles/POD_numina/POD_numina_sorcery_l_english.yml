 numina_weather_control_common_description: "#flavor Trong các xã hội phụ thuộc nặng vào nông nghiệp hoặc đi biển, những ai có thể khống chế thời tiết được coi trọng, thường là sự khác biệt giữa sống và chết trong cộng đồng của họ. Các nạn đói đã được ngăn chặn hoặc chấm dứt, và những thuật sĩ mạnh nhất được biết đến với khả năng xua tan hoặc chuyển hướng thiên tai. Thuật Khống Thời Tiết cho phép các thuật sĩ làm đúng như tên gọi của nó — họ có thể khống chế thời tiết.#!"

