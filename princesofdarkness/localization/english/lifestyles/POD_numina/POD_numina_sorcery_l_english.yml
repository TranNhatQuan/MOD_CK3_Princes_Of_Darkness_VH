 numina_oneiromancy_common_description: "#flavor Các thuật sĩ học Con Đường Thuật Nhập Mộng học cách bước vào những giấc mộng của người khác. Khi đã ở đó, họ tìm cách giành quyền kiểm soát, và có thể thu thập thông tin hoặc thay đổi giấc mộng để lợi hoặc hại cho người mộng. Ở đỉnh cao sức mạnh của mình, những người thi triển thuật nhập mộng còn có thể đưa nhiều người vào cùng một giấc mộng chung. Theo truyền thuyết, một số người còn có thể làm cho giấc mộng thành thật hoặc có khả năng bước vào giấc mộng bằng thể xác.#!"

