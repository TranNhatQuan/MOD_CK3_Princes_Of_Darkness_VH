 numina_fascination_common_description: "#flavor Những câu chuyện về thuật sĩ mê hoặc hay nhà ảo thuật quyến rũ xuất hiện trong truyện dân gian khắp thế giới. Những kẻ mê hoặc xảo trá đưa người vô tội vào tầm ảnh hưởng của mình, và những giao kèo đổi lấy quyền lực trói buộc trái tim và tâm trí của những ai dại dột ký kết bán linh hồn cho những thỏa thuận như vậy. Cái lõi sự thật của khuôn mẫu cũ này rắn như kim cương. Những thuật sĩ vô đạo đức bẻ cong tâm trí người khác theo ý mình đã thực hành Con Đường này từ lâu như bất kỳ ai từng mong người khác chỉ đơn giản hành động hoặc suy nghĩ theo cách dễ chịu hơn.#!"

