 numina_necromancy_common_description: "#flavor Có những thứ nên được để yên dưới đất. Đứng đầu trong số đó: người chết. Nhưng những ai theo Con Đường Chú Thuật Tử Linh lại có cách nhìn khác đi một chút. Giống như Hỏa Ngục Thuật, Chú Thuật Tử Linh có tiếng xấu là bẩn thỉu, chỉ được thực hành bởi những kẻ tồi tệ nhất. Không như Hỏa Ngục Thuật, tiếng xấu này ít nhất phần nào là đáng có.#!"

