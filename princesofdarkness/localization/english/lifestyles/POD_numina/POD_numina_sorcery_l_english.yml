 NUMINA_EPHEMERA_6_PERK_EFFECT: "Cải thiện @sorcerer_icon![bs_spell|E] của [GetPerk('numina_ephemera_5_perk').GetName(GetPlayer)] bằng cách gấp đôi hiệu ứng.\nLoại bỏ chi phí khi vào [UmbraGlossary('spirit_wilds')].\nBạn nhận [trait|E] #V [GetTrait('immortal').GetName(GetPlayer)]#!\n$numina_ephemera_common_description$"

