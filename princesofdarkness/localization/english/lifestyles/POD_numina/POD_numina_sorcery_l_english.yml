 numina_hellfire_common_description: "#flavor Được cho là kết quả của những giao kèo với địa ngục, Hỏa Ngục Thuật mang lại cho người thi triển năng lực phá hủy khủng khiếp. Trong khi thường triệu hồi lửa, các biến thể được quan sát thấy có thể gọi ra sấm sét, mưa đá, bão cát, động đất hoặc khói. Con Đường Hỏa Ngục Thuật không có năng lực riêng lẻ, việc tiến bộ thêm chỉ cho phép gọi ra những sức mạnh phá hủy lớn hơn.#!"

