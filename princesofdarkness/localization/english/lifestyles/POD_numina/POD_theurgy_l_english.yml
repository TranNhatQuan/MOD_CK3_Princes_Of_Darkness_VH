 NUMINA_VIA_GENIORUM_1_PERK_EFFECT: "Mở khóa [decision|E] #V $seek_aid_of_the_spirits_decision$#!.\nCho phép bạn tương tác với các thực thể của [umbra|E] khi bạn ở trong thế giới vật chất.\n#flavor Nhà Thần Thuật không nhìn vào [spirit_world|E] nhiều như ra lệnh cho các thực thể siêu nhiên gần đó tự lộ diện.#!"
 NUMINA_VIA_GENIORUM_2_PERK_EFFECT: "Cải thiện kết quả của [decision|E] #V $seek_aid_of_the_spirits_decision$#!.\nMở khóa [men_at_arms|E] Bygone Hạ Đẳng.\n#flavor Nhà Thần Thuật có thể vẽ các biểu tượng bảo vệ vào vật cầm tay hoặc thành một vòng tròn nhỏ quanh mình.#!"
 NUMINA_VIA_GENIORUM_3_PERK_EFFECT: "Cải thiện kết quả của [decision|E] #V $seek_aid_of_the_spirits_decision$#!.\nMở khóa [men_at_arms|E] Ma Quỷ.\n#flavor Nhà Thần Thuật có thể gửi một linh hồn trở lại cõi giới bản xứ của nó.#!"
 NUMINA_VIA_GENIORUM_4_PERK_EFFECT: "Cải thiện kết quả của [decision|E] #V $seek_aid_of_the_spirits_decision$#!.\nMở khóa [men_at_arms|E] Bygone Thượng Đẳng.\n#flavor Nhà Thần Thuật giờ có thể triệu hồi các thực thể linh hồn.#!"
 NUMINA_VIA_GENIORUM_5_PERK_EFFECT: "Cải thiện kết quả của [decision|E] #V $seek_aid_of_the_spirits_decision$#!.\nCó thể dùng [journey|E] 'Tìm Ra Chân Danh' lên $POD_splat_wraith_plural$, $POD_splat_fae_plural$ và $POD_splat_demon_plural$.\nCó thể [POD_banish|E] $POD_splat_wraith_plural$, $POD_splat_fae_plural$ hoặc $POD_splat_demon_plural$ về cõi [umbra|E] bản xứ của họ.\n#flavor Nhà Thần Thuật giờ có thể buộc một linh hồn phải phục dịch.#!"

 NUMINA_VIA_IGNIS_1_PERK_EFFECT: "Ban [GetModifier('numina_via_ignis_1_modifier').GetNameWithTooltip] cho [knights|E] của kẻ địch khi hành động như [commander|E] trong [combat_phase|E], hoặc cho đối thủ của bạn trong [single_combat_duel_plural|E].\n#flavor Nhà Thần Thuật có thể triệu hồi ngọn lửa nến của Lửa Thánh.#!"
 NUMINA_VIA_IGNIS_2_PERK_EFFECT: "Cải thiện hiệu ứng từ [GetPerk('numina_via_ignis_1_perk').GetName(GetPlayer)] thành [GetModifier('numina_via_ignis_2_modifier').GetNameWithTooltip].\n#flavor Nhà Thần Thuật có thể triệu hồi một đám Lửa Thánh nhỏ.#!"
 NUMINA_VIA_IGNIS_3_PERK_EFFECT: "Cải thiện hiệu ứng từ [GetPerk('numina_via_ignis_1_perk').GetName(GetPlayer)] thành [GetModifier('numina_via_ignis_3_modifier').GetNameWithTooltip].\n#flavor Nhà Thần Thuật có thể triệu hồi một đống lửa trại của Lửa Thánh.#!"
 NUMINA_VIA_IGNIS_4_PERK_EFFECT: "Cải thiện hiệu ứng từ [GetPerk('numina_via_ignis_1_perk').GetName(GetPlayer)] thành [GetModifier('numina_via_ignis_4_modifier').GetNameWithTooltip].\n#flavor Nhà Thần Thuật có thể triệu hồi một đống lửa lớn của Lửa Thánh.#!"
 NUMINA_VIA_IGNIS_5_PERK_EFFECT: "Vào đầu trận chiến khi hành động như [commander|E]: Gây [GetPlayer.MakeScope.ScriptValue('POD_numina_via_ignis_5_damage')] [POD_aggravated_damage_with_box|E] cho tất cả [splats|E] sợ ánh sáng mặt trời.\n#flavor Nhà Thần Thuật có thể triệu hồi một trận đại hỏa hoạn Lửa Thánh.#!"

 NUMINA_VIA_MEDICAMENTI_1_PERK_EFFECT: "Là một [character_interaction|E], ban cho mục tiêu của bạn [GetModifier('numina_via_medicamenti_1_modifier').GetNameWithTooltip].\n#flavor Bạn có thể làm dịu những cơn đau nhỏ.#!"
 NUMINA_VIA_MEDICAMENTI_2_PERK_EFFECT: "Cải thiện [character_interaction|E] [GetPerk('numina_via_medicamenti_1_perk').GetName(GetPlayer)] bằng cách cũng ban [GetModifier('numina_via_medicamenti_2_modifier').GetNameWithTooltip].\n#flavor Bong gân và nhiễm trùng nhỏ lành nhanh hơn dưới sự chăm sóc của bạn.#!"
 NUMINA_VIA_MEDICAMENTI_3_PERK_EFFECT: "Cải thiện [character_interaction|E] [GetPerk('numina_via_medicamenti_1_perk').GetName(GetPlayer)] bằng cách cũng chữa lành [GetPlayer.MakeScope.ScriptValue('POD_numina_via_medicamenti_3_heal')] ô [POD_superficial_damage_with_box|E]\n#flavor Mọi chấn thương đến mức Tàn Tật lành nhanh gấp đôi tốc độ bình thường, không có nguy cơ nhiễm trùng.#!"
 NUMINA_VIA_MEDICAMENTI_4_PERK_EFFECT: "Cải thiện [character_interaction|E] [GetPerk('numina_via_medicamenti_3_perk').GetName(GetPlayer)] bằng cách tăng lượng chữa lành lên [GetPlayer.MakeScope.ScriptValue('POD_numina_via_medicamenti_4_heal')].\nCải thiện [character_interaction|E] [GetPerk('numina_via_medicamenti_1_perk').GetName(GetPlayer)] bằng cách cũng chữa lành bất kỳ bệnh nhẹ nào.\n#flavor Bạn có thể chữa các bệnh mãn tính như hen suyễn hay viêm khớp, nhưng cần thời gian và công sức.#!"
 NUMINA_VIA_MEDICAMENTI_5_PERK_EFFECT: "Cải thiện [character_interaction|E] [GetPerk('numina_via_medicamenti_1_perk').GetName(GetPlayer)] bằng cách cũng chuyển đổi [GetPlayer.MakeScope.ScriptValue('POD_numina_via_medicamenti_5_convert')] ô [POD_aggravated_damage_with_box|E] thành ô [POD_superficial_damage_with_box|E].\nCải thiện [character_interaction|E] [GetPerk('numina_via_medicamenti_1_perk').GetName(GetPlayer)] bằng cách cũng chữa lành bất kỳ bệnh phi siêu nhiên nào.\n#flavor Bạn có thể chữa cả những tình trạng chết người, nhưng nó lấy đi rất nhiều sức lực và cần nhiều tuần điều trị.#!"

 NUMINA_VIA_NECROMANTIAE_1_PERK_EFFECT: "$POD_can_summon_on_death_trigger_loca$\n$POD_can_summon_wraith_trigger_loca$\n#flavor Nhà Thần Thuật có thể ra lệnh cho một tử thi vừa qua đời tỉnh dậy.#!"
 NUMINA_VIA_NECROMANTIAE_2_PERK_EFFECT: "$POD_can_bind_wraith_trigger_loca$\n#flavor Nhà Thần Thuật có thể bảo vệ một khu vực khỏi sự xâm nhập của ma quái.#!"
 NUMINA_VIA_NECROMANTIAE_3_PERK_EFFECT: "$POD_can_weaken_fetter_trigger_loca$\n#flavor Nhà Thần Thuật có thể liên lạc với người chết.#!"
 NUMINA_VIA_NECROMANTIAE_4_PERK_EFFECT: "Bạn có thể giam giữ, tra tấn, hành hình hoặc gây tổn hại thân thể cho các linh hồn trong [single_combat_duel_plural|E].\n$POD_can_command_wraith_trigger_loca$\n#flavor Nhà Thần Thuật có thể xua đuổi một hồn ma đang ám.#!"
 NUMINA_VIA_NECROMANTIAE_5_PERK_EFFECT: "Mở khóa [GetMaA('hidden').GetName], [GetMaA('walker').GetName], [GetMaA('shambler').GetName] và [GetMaA('skeletons').GetName] làm [men_at_arms|E].\n#flavor Nhà Thần Thuật giờ có thể thúc một tử thi trỗi dậy.#!"

 NUMINA_VIA_ORACULI_1_PERK_EFFECT: "#flavor Nhà Thần Thuật diễn giải các dấu hiệu hay điềm báo về tình trạng của hoàn cảnh trước mắt của mình.#!"
 NUMINA_VIA_ORACULI_2_PERK_EFFECT: "#flavor Nhà Thần Thuật loại bỏ các kết quả tiêu cực có thể xảy ra bằng cách so sánh chúng trước.#!"
 NUMINA_VIA_ORACULI_3_PERK_EFFECT: "#flavor Nhà Thần Thuật có thể cảm nhận các mẫu hình cơ may cho phép bà thu thập thông tin ngắn hạn theo sau các quyết định cụ thể.#!"
 NUMINA_VIA_ORACULI_4_PERK_EFFECT: "#flavor Nhà Thần Thuật có khả năng đoán biết các sự kiện cụ thể trong tương lai.#!"
 NUMINA_VIA_ORACULI_5_PERK_EFFECT: "Bạn sẽ nhận được thông báo nếu có ai định giết bạn bè hoặc gia đình của bạn.\n#flavor Nhà Thần Thuật đạt được khả năng cảm nhận các chi tiết rõ ràng và cụ thể về tương lai và khả năng đoán biết các sự kiện cụ thể với độ chắc chắn đáng tin cậy#!"