 cyberpathy_5_perk_name: "Đọc Dữ Liệu Điện Tử 5"

 CYBERPATHY_1_PERK_EFFECT: "#weak Nhà ngoại cảm có thể đọc dữ liệu được lưu trữ trên một thiết bị điện tử.\nNhà ngoại cảm có thể biết loại dữ liệu nào được lưu trữ trên thiết bị.#!"
 CYBERPATHY_2_PERK_EFFECT: "#weak Nhà ngoại cảm có thể đọc các tệp đơn giản được lưu trữ trên thiết bị.#!"
 CYBERPATHY_3_PERK_EFFECT: "#weak Nhà ngoại cảm có thể “sao chép” một tệp vào tâm trí mình và sau đó tái tạo lại nó.#!"
 CYBERPATHY_4_PERK_EFFECT: "#weak Nhà ngoại cảm có thể truy cập thêm các thiết bị điện tử khác bên cạnh thiết bị mà họ đã kết nối.#!"
 CYBERPATHY_5_PERK_EFFECT: "#weak Nhà ngoại cảm có thể giải mã các tài liệu đã được mã hóa.#!"

