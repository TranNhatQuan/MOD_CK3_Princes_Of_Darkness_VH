 SYNERGY_1_PERK_EFFECT: "Tăng cơ hội thành công của bất kỳ [character_interaction|E] [GetTrait('psychic').GetName( GetPlayer )] nhắm vào một [GetTrait('psychic').GetName( GetPlayer )] khác lên #P 10#!.\n#weak Một tài năng vô cùng hiếm có, Cộng Hưởng cho phép một nhà ngoại cảm liên kết bản thân với các nhà ngoại cảm khác để tạo thành một thực thể gestalt kết hợp nhiều năng lực của họ.\nNhà ngoại cảm có thể cảm nhận các nhà ngoại cảm khác.#!"
 SYNERGY_2_PERK_EFFECT: "Với mỗi [GetTrait('psychic').GetName( GetPlayer )] trong [coterie|E] của bạn, nhận [GetModifier('psi_synergy_coterie_stress_buff').GetNameWithTooltip].\n#weak Nhà ngoại cảm có thể thiết lập một liên kết ngoại cảm cơ bản để chia sẻ ý chí với một nhà ngoại cảm khác.#!"
 SYNERGY_3_PERK_EFFECT: "Với mỗi [GetTrait('psychic').GetName( GetPlayer )] trong [coterie|E] của bạn và ở cùng địa điểm, tăng cơ hội thành công của bất kỳ [character_interaction|E] [GetTrait('psychic').GetName( GetPlayer )] lên #P 10#!. Giới hạn ở #V 1#! thành viên [coterie|E].\n#weak Các nhà ngoại cảm trong một liên kết cộng hưởng có thể kết hợp tâm trí của họ khi thực hiện một hành động.#!"
 SYNERGY_4_PERK_EFFECT: "Tăng giới hạn của [GetPerk('synergy_3_perk').GetName( GetNullCharacter )] lên #V 2#!\n#weak Các nhà ngoại cảm trong một liên kết cộng hưởng có thể sử dụng nhiều năng lực ngoại cảm cùng lúc.#!"
 SYNERGY_5_PERK_EFFECT: "Loại bỏ giới hạn của [GetPerk('synergy_3_perk').GetName( GetNullCharacter )]\n#weak Các nhà ngoại cảm trong một liên kết cộng hưởng có thể kết hợp năng lực ngoại cảm của họ thành một năng lực chung duy nhất.#!"

