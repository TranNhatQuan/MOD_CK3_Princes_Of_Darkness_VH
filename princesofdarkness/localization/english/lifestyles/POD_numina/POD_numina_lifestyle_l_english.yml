 EMPATHIC_HEALING_1_PERK_EFFECT: "Với vai trò [character_interaction|E], cho phép loại bỏ các đặc điểm căng thẳng tiêu cực.\n#weak Nhà ngoại cảm có thể thiết lập một liên kết cảm thông cho phép họ ảnh hưởng đến quá trình trị liệu của người khác.\nNhà ngoại cảm có thể xoa dịu nỗi đau buồn và những chứng bệnh nhỏ tương tự.#!"
 EMPATHIC_HEALING_2_PERK_EFFECT: "Với vai trò [character_interaction|E], cho phép hấp thụ các đặc điểm sẹo.\n#weak Nhà ngoại cảm có thể hàn gắn các vết thương ngoài da.#!"
 EMPATHIC_HEALING_3_PERK_EFFECT: "Với vai trò [character_interaction|E], cho phép hấp thụ các đặc điểm bệnh tật.\n#weak Nhà ngoại cảm có thể trị các bệnh cấp tính hoặc hàn gắn xương gãy.#!"
 EMPATHIC_HEALING_4_PERK_EFFECT: "Với vai trò [character_interaction|E], cho phép hấp thụ các đặc điểm vết thương.\n#weak Nhà ngoại cảm có thể hàn gắn các chấn thương nội tạng.#!"
 EMPATHIC_HEALING_5_PERK_EFFECT: "Với vai trò [character_interaction|E], cho phép loại bỏ các đặc điểm tâm lý tiêu cực.\n#weak Nhà ngoại cảm có thể trị các tổn thương tâm lý nghiêm trọng, bao gồm loạn tâm và harano.#!"

