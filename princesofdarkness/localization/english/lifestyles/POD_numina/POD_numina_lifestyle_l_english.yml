 PSYCHOPORTATION_1_PERK_EFFECT: "#weak Bằng tâm trí của mình, nhà ngoại cảm có thể dịch chuyển trong một khoảng cách ngắn.\nNhà ngoại cảm có thể dịch chuyển một khoảng cách ngắn trong tầm mắt.#!"
 PSYCHOPORTATION_2_PERK_EFFECT: "Với vai trò [character_interaction|E], cho phép bạn dịch chuyển quân đội của mình đến địa điểm của mục tiêu, hoặc dịch chuyển đến điểm đến kế tiếp khi đang di chuyển. Khoảng cách tối đa tương đương với một vương quốc nhỏ (ví dụ: xứ Wales từ trên xuống dưới)\n#weak Nhà ngoại cảm có thể dịch chuyển qua những khoảng cách lớn hơn.#!"
 PSYCHOPORTATION_3_PERK_EFFECT: "Tăng khoảng cách tối đa của [GetPerk('psychoportation_2_perk').GetName( GetNullCharacter )] lên một vương quốc lớn (ví dụ: nước Pháp từ trên xuống dưới)\n#weak Nhà ngoại cảm có thể dịch chuyển qua những khoảng cách lớn hơn nữa.#!"
 PSYCHOPORTATION_4_PERK_EFFECT: "Tăng khoảng cách tối đa của [GetPerk('psychoportation_2_perk').GetName( GetNullCharacter )] lên một vương quốc khổng lồ (ví dụ: Đế Chế La Mã Thánh từ trái sang phải)\n#weak Nhà ngoại cảm có thể dịch chuyển qua những khoảng cách còn lớn hơn nữa.#!"
 PSYCHOPORTATION_5_PERK_EFFECT: "Loại bỏ giới hạn khoảng cách của [GetPerk('psychoportation_2_perk').GetName( GetNullCharacter )]\n#weak Nhà ngoại cảm không còn cần phải nhìn thấy điểm đến để dịch chuyển của họ.#!"

