 psychic_hypnosis_2_perk_name: "Gợi Ý Sân Khấu"
 psychic_hypnosis_3_perk_name: "Hành Động Trì Hoãn"
 psychic_hypnosis_4_perk_name: "Xuất Thần Nhanh"
