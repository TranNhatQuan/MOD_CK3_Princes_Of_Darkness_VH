 SOULSTEALING_1_PERK_EFFECT: "#weak Đánh Cắp Linh Hồn hút cạn tinh chất của mục tiêu để tăng cường sức mạnh cho nhà ngoại cảm.\nNhà ngoại cảm có thể tiến vào cảnh mộng của một mục tiêu.#!"
 SOULSTEALING_2_PERK_EFFECT: "Với vai trò [character_interaction|E], cho phép bạn giảm căng thẳng bằng cách hút cạn ý chí của một tù nhân.\n#weak Nhà ngoại cảm có thể đánh cắp Ý Chí tạm thời từ mục tiêu.#!"
 SOULSTEALING_3_PERK_EFFECT: "Với vai trò [character_interaction|E], cho phép bạn nhận máu từ một tù nhân.\n#weak Nhà ngoại cảm có thể đánh cắp sinh lực từ mục tiêu.#!"
 SOULSTEALING_4_PERK_EFFECT: "Với vai trò [character_interaction|E], cho phép bạn trị vết thương bằng cách hút cạn sinh lực của một tù nhân.\n#weak Nhà ngoại cảm có thể chuyển dời sinh lực đã đánh cắp sang một mục tiêu khác.#!"
 SOULSTEALING_5_PERK_EFFECT: "Với vai trò [character_interaction|E], cho phép bạn hút cạn bất kỳ dạng năng lượng nào từ một tù nhân.\n#weak Nhà ngoại cảm có thể đánh cắp Gnosis từ một mục tiêu.#!"

