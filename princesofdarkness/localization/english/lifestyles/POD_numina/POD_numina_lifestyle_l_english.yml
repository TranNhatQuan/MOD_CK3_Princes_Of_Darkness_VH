 TELEPATHY_1_PERK_EFFECT: "#weak Thần Giao Cách Cảm là tài năng khuất phục tâm trí của người khác bằng tâm trí của nhà ngoại cảm.\nNhà ngoại cảm có thể cảm nhận cảm xúc cơ bản của một mục tiêu, gửi một xung động nhỏ đến nó hoặc khiến nó co giật.#!"
 TELEPATHY_2_PERK_EFFECT: "#weak Nhà ngoại cảm có thể đọc những suy nghĩ trên bề mặt, truyền một ý tưởng duy nhất hoặc gây ra một hành động ngắn bất thường.#!"
 TELEPATHY_3_PERK_EFFECT: "Với vai trò [character_interaction|E], bắt đầu một cuộc đấu ngoại giao với mục tiêu để có được một móc câu yếu trên họ.\n#weak Nhà ngoại cảm có thể đọc những ký ức gần đây hoặc kế hoạch tương lai, truyền những cảm xúc hoặc ý tưởng phức tạp hoặc gây ra một hành động bất thường.#!"
 TELEPATHY_4_PERK_EFFECT: "Tùy chọn mới cho [character_interaction|E] Thần Giao Cách Cảm để có được một móc câu mạnh thay vì móc câu yếu.\n#weak Nhà ngoại cảm có thể đọc những suy nghĩ sâu kín, gửi vài câu nói hoặc tạm thời chiếm quyền kiểm soát thân thể của mục tiêu.#!"
 TELEPATHY_5_PERK_EFFECT: "Tùy chọn mới cho [character_interaction|E] Thần Giao Cách Cảm để có được một móc câu mạnh vĩnh viễn.\n#weak Nhà ngoại cảm có thể đọc những bí mật thầm kín, tiềm thức nhất của một mục tiêu, tiến hành một cuộc hội thoại với họ hoặc giành toàn quyền kiểm soát thân thể của họ, bao gồm cả việc viết lại ký ức.#!"
