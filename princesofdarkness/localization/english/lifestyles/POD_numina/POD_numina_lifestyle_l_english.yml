 psychic_healing_4_perk_name: "Phân Loại Ưu Tiên"
 psychic_healing_5_perk_name: "Phẫu Thuật Ngoại Cảm"

 PSYCHIC_HEALING_1_PERK_EFFECT: "#weak Nhà ngoại cảm có thể trị các vết thương và chấn thương khác bằng sức mạnh tâm trí.\nNhà ngoại cảm có thể cảm nhận điều bệnh nhân đang thiếu.#!"
 PSYCHIC_HEALING_2_PERK_EFFECT: "Cho phép tặng mục tiêu [GetModifier('psi_treatment').GetNameWithTooltip] với vai trò [character_interaction|E]\n#weak Nhà ngoại cảm có thể đẩy nhanh quá trình trị liệu tự nhiên của bệnh nhân, đưa họ vào giấc ngủ sau đó hầu hết các bệnh nhẹ sẽ được trị khỏi.#!"
 PSYCHIC_HEALING_3_PERK_EFFECT: "Cho phép trị sẹo và biến dạng với vai trò [character_interaction|E]\nCho phép tặng mục tiêu [GetModifier('psi_good_treatment').GetNameWithTooltip] với vai trò [character_interaction|E]\n#weak Nhà ngoại cảm có thể hàn gắn vết thương và xua tan các bệnh ngoan cố hơn.#!"
 PSYCHIC_HEALING_4_PERK_EFFECT: "Cho phép trị vết thương và bệnh tật với vai trò [character_interaction|E]\n#weak Nhà ngoại cảm có thể hàn gắn xương gãy và xua tan các bệnh nghiêm trọng hơn.#!"
 PSYCHIC_HEALING_5_PERK_EFFECT: "Cho phép trị bệnh tật và các đặc điểm thể chất tiêu cực với vai trò [character_interaction|E]\n#weak Nhà ngoại cảm có thể loại bỏ ung thư hoặc nhiễm trùng.#!"

