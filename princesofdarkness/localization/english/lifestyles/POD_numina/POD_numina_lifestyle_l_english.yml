 PYROKINESIS_1_PERK_EFFECT: "#weak Nhà ngoại cảm có thể triệu gọi lửa.\nNhà ngoại cảm có thể tạo ra một ngọn lửa nhỏ đủ để đốt một cây nến hoặc điếu thuốc.#!"
 PYROKINESIS_2_PERK_EFFECT: "#weak Nhà ngoại cảm có thể khiến các vật dễ cháy bốc cháy.#!"
 PYROKINESIS_3_PERK_EFFECT: "#weak Nhà ngoại cảm có thể tạo ra những đợt lửa nhỏ từ không khí.#!"
 PYROKINESIS_4_PERK_EFFECT: "#weak Nhà ngoại cảm có thể cho ngọn lửa được triệu gọi một hướng đi chung.#!"
 PYROKINESIS_5_PERK_EFFECT: "#weak Nhà ngoại cảm có thể gây ra những đợt lửa lớn hơn và điều hướng chúng theo ý muốn.#!"

