 ANIMAL_PSI_1_PERK_EFFECT: "Với vai trò [character_interaction|E], đẩy nhanh âm mưu (25% cơ hội).\n#weak Nhà ngoại cảm có thể đọc được ý định và mong muốn cơ bản của con vật trước mặt họ. Năng lực này tác động lên các loài động vật có vú cấp cao.\nNgoại Cảm Thú là khả năng tiếp xúc với động vật. Con vật càng thông minh hoặc được huấn luyện tốt, việc ra lệnh càng dễ dàng. #!"
 ANIMAL_PSI_2_PERK_EFFECT: "Tăng cơ hội thành công của [GetPerk('animal_psi_1_perk').GetName( GetNullCharacter )] từ 25% lên 50%\n#weak Nhà ngoại cảm có thể đưa ra cho con vật một lệnh đơn giản để nó thực hiện. Con vật không có nghĩa vụ phải làm theo.#!"
 ANIMAL_PSI_3_PERK_EFFECT: "Với vai trò [character_interaction|E], cho phép bạn nhận một con vật cưng.\nVới vai trò [character_interaction|E], cho phép bạn gọi vật cưng ra trận.\nTăng cơ hội thành công của [GetPerk('animal_psi_1_perk').GetName( GetNullCharacter )] từ 50% lên 75%\nMở khóa nhiều $POD_animals_maa$ [men_at_arms|E]\n#weak Nhà ngoại cảm có được sự hiểu biết theo bản năng về điều con vật muốn. Họ có thể giao tiếp với nhiều con vật cùng lúc hoặc đưa ra cho một con vật một lệnh phức tạp hơn.#!"
 ANIMAL_PSI_4_PERK_EFFECT: "Mở khóa [character_interaction|E] Biến Hình.\nMở khóa các tùy chọn biến hình thú.\nTăng cơ hội thành công của [GetPerk('animal_psi_1_perk').GetName( GetNullCharacter )] từ 75% lên 100%\n#weak Nhà ngoại cảm có thể kết nối tâm trí mình với một con vật, nhìn qua mắt nó và sử dụng các giác quan của nó như của chính mình.#!"
 ANIMAL_PSI_5_PERK_EFFECT: "Với vai trò [character_interaction|E], triệu hồi một trận dịch chuột lên thủ đô của mục tiêu với một cơ hội nhỏ gây ra dịch bệnh.\n#weak Nhà ngoại cảm có thể giành quyền kiểm soát hoàn toàn một con vật, khiến tâm trí nó vẫn đi theo họ trong khi nó thực hiện nhiệm vụ được giao.#!"

 anti_psi_1_perk_name: "Kháng Ngoại Cảm/Khiên Tâm Trí 1"
 anti_psi_2_perk_name: "Kháng Ngoại Cảm/Khiên Tâm Trí 2"
 anti_psi_3_perk_name: "Kháng Ngoại Cảm/Khiên Tâm Trí 3"
 anti_psi_4_perk_name: "Kháng Ngoại Cảm/Khiên Tâm Trí 4"
 anti_psi_5_perk_name: "Kháng Ngoại Cảm/Khiên Tâm Trí 5"

 ANTI_PSI_1_PERK_EFFECT: "#P +10#! cơ hội chống lại hiệu ứng thao túng tâm trí\nTăng chi phí của bất kỳ [character_interaction|E] [GetTrait('psychic').GetName( GetPlayer )] nhắm vào bạn lên 25%\n#weak Kháng Ngoại Cảm là năng lực hiếm có khả năng vô hiệu hóa các numina ngoại cảm khác.\nNhà ngoại cảm có thể dựng lên các lớp phòng thủ tâm trí chống lại sự xâm nhập siêu nhiên.\nNhà ngoại cảm ức chế các năng lực ngoại cảm khác trong bán kính năm mét quanh người dùng#!"
 ANTI_PSI_2_PERK_EFFECT: "#P +10#! cơ hội chống lại hiệu ứng thao túng tâm trí\nTăng chi phí của bất kỳ [character_interaction|E] [GetTrait('psychic').GetName( GetPlayer )] nhắm vào bạn lên 25%\n#weak Nhà ngoại cảm ức chế các năng lực ngoại cảm khác trong bán kính mười mét quanh người dùng#!"
 ANTI_PSI_3_PERK_EFFECT: "#P +10#! cơ hội chống lại hiệu ứng thao túng tâm trí\nTăng chi phí của bất kỳ [character_interaction|E] [GetTrait('psychic').GetName( GetPlayer )] nhắm vào bạn lên 25%\n#weak Nhà ngoại cảm ức chế các năng lực ngoại cảm khác trong bán kính mười lăm mét quanh người dùng#!"
 ANTI_PSI_4_PERK_EFFECT: "#P +10#! cơ hội chống lại hiệu ứng thao túng tâm trí\nMiễn nhiễm với bất kỳ [character_interaction|E] [GetTrait('psychic').GetName( GetPlayer )]\n#weak Nhà ngoại cảm ức chế các năng lực ngoại cảm khác trong bán kính hai mươi mét quanh người dùng#!"
 ANTI_PSI_5_PERK_EFFECT: "#P +10#! cơ hội chống lại hiệu ứng thao túng tâm trí\nPhòng Thủ Tâm Trí Mạnh Mẽ\n#weak Nhà ngoại cảm ức chế các năng lực ngoại cảm khác trong bán kính hai mươi lăm mét quanh người dùng#!"

 astral_projection_1_perk_name: "Xuất Hồn 1"
 astral_projection_2_perk_name: "Xuất Hồn 2"
 astral_projection_3_perk_name: "Xuất Hồn 3"
 astral_projection_4_perk_name: "Xuất Hồn 4"
 astral_projection_5_perk_name: "Xuất Hồn 5"

 ASTRAL_PROJECTION_1_PERK_EFFECT: "#weak Nhà ngoại cảm có thể tách linh hồn khỏi thể xác và du hành trong cõi tinh thần.\nNhà ngoại cảm có thể chuyển giác quan của mình vào không gian tinh thần, cảm nhận cõi này như đang chồng lấp lên thế giới trần tục.#!"
 ASTRAL_PROJECTION_2_PERK_EFFECT: "#weak Nhà ngoại cảm có thể rời khỏi thể xác trong vài phút. Trong cõi tinh thần, họ chỉ giới hạn ở thị giác.#!"
 ASTRAL_PROJECTION_3_PERK_EFFECT: "#weak Nhà ngoại cảm có thể rời khỏi thể xác trong nhiều phút. Trong cõi tinh thần, họ có thể nghe và nhìn, và di chuyển với tốc độ nhanh xa khỏi thể xác.#!"
 ASTRAL_PROJECTION_4_PERK_EFFECT: "#weak Nhà ngoại cảm có thể rời khỏi thể xác trong nhiều giờ, di chuyển với tốc độ cao xa khỏi nó. Họ cũng có thể hiện hình dưới dạng trong suốt trên thân xác vật lý, tuy không thể giao tiếp bằng lời.#!"
 ASTRAL_PROJECTION_5_PERK_EFFECT: "#weak Nhà ngoại cảm có thể du hành khắp thế giới trong khi ở không gian tinh thần, sử dụng toàn bộ giác quan và có thể nói khi hiện hình.#!"

 biocontrol_1_perk_name: "Tự Kiểm Soát"
 biocontrol_2_perk_name: "Tự Trị Liệu"
 biocontrol_3_perk_name: "Sức Mạnh Cuồng Loạn"
 biocontrol_4_perk_name: "Bỏ Qua Phản Ứng Đau"
 biocontrol_5_perk_name: "Tâm Thắng Vật"

 BIOCONTROL_1_PERK_EFFECT: "Mở khóa [character_interaction|E] Biến Hình.\nMở khóa các tùy chọn biến hình thẩm mỹ.\n#weak Nhà ngoại cảm có thể điều khiển thân thể của chính mình.\nNhà ngoại cảm có thể kiểm soát các chức năng nhỏ của thân thể, như nín thở, bằng cách nhập vào trạng thái xuất thần.#!"
 BIOCONTROL_2_PERK_EFFECT: "Với vai trò [character_interaction|E], có thể chữa khỏi ngay [GetTrait('ill').GetName( GetNullCharacter )].\n#weak Nhà ngoại cảm có thể đẩy nhanh quá trình tự trị liệu của mình thông qua thiền định.#!"
 BIOCONTROL_3_PERK_EFFECT: "Với vai trò [character_interaction|E], có thể chữa khỏi ngay các vết thương.\n#weak Bằng cách kiểm soát tuyến thượng thận, nhà ngoại cảm có thể bước vào giai đoạn sức mạnh và tốc độ được tăng cường.#!"
 BIOCONTROL_4_PERK_EFFECT: "Với vai trò [character_interaction|E], có thể chữa khỏi ngay các bệnh tật của phàm nhân.\n#weak Nhà ngoại cảm có thể xóa bỏ cảm giác đau khỏi ý thức của mình.#!"
 BIOCONTROL_5_PERK_EFFECT: "Với vai trò [character_interaction|E], có thể chữa khỏi ngay bất kỳ bệnh tật nào.\n#weak Nhà ngoại cảm có thể ra lệnh cho tim mình ngừng đập nếu cần thiết, trực tiếp điều chỉnh hệ miễn dịch và uốn cong thân thể vào những tư thế không tự nhiên.#!"

 necro_psi_1_perk_name: "Ngoại Cảm Tử Linh 1"
 necro_psi_2_perk_name: "Ngoại Cảm Tử Linh 2"
 necro_psi_3_perk_name: "Ngoại Cảm Tử Linh 3"
 necro_psi_4_perk_name: "Ngoại Cảm Tử Linh 4"
 necro_psi_5_perk_name: "Ngoại Cảm Tử Linh 5"

 NECRO_PSI_1_PERK_EFFECT: "Với vai trò [character_interaction|E], có thể triệu hồi một [GetTrait('wraith').GetName( GetNullCharacter )] đến triều đình của bạn.\n#weak Ngoại Cảm Tử Linh, còn gọi là Triệu Hồn, là năng lực cho phép nhà ngoại cảm tiếp xúc với hồn ma của người đã khuất.\nNhà ngoại cảm có thể nghe thấy bất kỳ hồn ma nào ở gần.#!"
 NECRO_PSI_2_PERK_EFFECT: "Cho phép bạn tương tác với các thực thể của [umbra|E] khi bạn đang ở thế giới vật chất.\n$POD_can_summon_on_death_trigger_loca$\n$POD_can_weaken_fetter_trigger_loca$\n$POD_can_bind_wraith_trigger_loca$\n#weak Nhà ngoại cảm có thể giao tiếp với các hồn ma trong khu vực.#!"
 NECRO_PSI_3_PERK_EFFECT: "$POD_can_command_wraith_trigger_loca$\nVới vai trò [character_interaction|E], có thể cho phép một hồn ma bị ràng buộc Triệu Hồn bạn, tăng mọi thuộc tính lên 2 đồng thời nhận [GetTrait('possessed_1').GetName( GetNullCharacter )]\n#weak Nhà ngoại cảm có thể nhìn vào [UmbraGlossary('shadowlands')].#!"
 NECRO_PSI_4_PERK_EFFECT: "Với vai trò [character_interaction|E], có thể cho phép một hồn ma bị ràng buộc Triệu Hồn bạn, tăng một thuộc tính duy nhất lên 2 mà không nhận [GetTrait('possessed_1').GetName( GetNullCharacter )]\n#weak Nhà ngoại cảm trở thành một ngọn hải đăng đối với các linh hồn, khiến chúng bị thu hút đến họ. Khi một hồn ma chiếm hồn họ, nó có thể tranh giành quyền kiểm soát với họ.#!"
 NECRO_PSI_5_PERK_EFFECT: "Có thể được hai hồn ma Triệu Hồn thay vì một thông qua [character_interaction|E] của [GetPerk('necro_psi_3_perk').GetName( GetNullCharacter )] và [GetPerk('necro_psi_4_perk').GetName( GetNullCharacter )]\n#weak Nhà ngoại cảm có thể giao tiếp tự do với hồn ma và Triệu Hồn hai hồn ma cùng lúc.#!"

 clairvoyance_1_perk_name: "Thiên Lý Nhãn 1"
 clairvoyance_2_perk_name: "Thiên Lý Nhãn 2"
 clairvoyance_3_perk_name: "Thiên Lý Nhãn 3"
 clairvoyance_4_perk_name: "Thiên Lý Nhãn 4"
 clairvoyance_5_perk_name: "Thiên Lý Nhãn 5"

 CLAIRVOYANCE_1_PERK_EFFECT: "#weak Nhà ngoại cảm có thể phóng giác quan của mình ra ngoài trong khi vẫn duy trì ý thức bên trong thân thể.\nNhà ngoại cảm nhìn thấy những thứ trong tòa nhà mà họ đang ở qua một lớp sương mờ như mộng.#!"
 CLAIRVOYANCE_2_PERK_EFFECT: "#weak Nhà ngoại cảm có thể nhìn thấy các sự kiện trong bán kính năm mươi dặm quanh họ, với âm thanh bị bóp nghẹt và biến dạng.#!"
 CLAIRVOYANCE_3_PERK_EFFECT: "#weak Nhà ngoại cảm có thể nhìn và nghe rõ ràng ở khoảng cách xa, đồng thời có được khả năng cảm nhận xúc giác. Bán kính mở rộng lên 250 dặm.#!"
 CLAIRVOYANCE_4_PERK_EFFECT: "#weak Nhà ngoại cảm có thể cảm nhận xúc giác, thị giác và thính giác, cùng với cảm giác khứu giác mơ hồ. Bán kính mở rộng lên 2000 dặm.#!"
 CLAIRVOYANCE_5_PERK_EFFECT: "#weak Nhà ngoại cảm có thể sử dụng cả năm giác quan trong khi về lý thuyết có thể phóng chiếu bản thân đi khắp thế giới.#!"

