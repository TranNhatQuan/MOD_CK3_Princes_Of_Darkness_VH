 PSYCHOMETRY_1_PERK_EFFECT: "Mở khóa [buy_artifact_claim_interaction|E].\nChi phí [buy_claim_interaction|E] và [buy_artifact_claim_interaction|E]: #P -10%#!\n#weak Qua sự chạm vào, nhà ngoại cảm có thể biết được điều gì đó về một vật thể và những người đã từng tương tác với nó trong quá khứ.\nNhà ngoại cảm có thể đọc dư âm ngoại cảm chung của một vật thể để có được hình ảnh xấp xỉ.#!"
 PSYCHOMETRY_2_PERK_EFFECT: "Chi phí [buy_claim_interaction|E] và [buy_artifact_claim_interaction|E]: #P -10%#!\n#weak Nhà ngoại cảm có thể thấy các sự kiện đã xảy ra gần vật thể trong 24 giờ qua.#!"
 PSYCHOMETRY_3_PERK_EFFECT: "Chi phí [buy_claim_interaction|E] và [buy_artifact_claim_interaction|E]: #P -10%#!\n#weak Nhà ngoại cảm có thể khám phá và hiểu toàn bộ lịch sử của vật thể hoặc địa điểm.#!"
 PSYCHOMETRY_4_PERK_EFFECT: "Chi phí [buy_claim_interaction|E] và [buy_artifact_claim_interaction|E]: #P -10%#!\n#weak Nhà ngoại cảm có thể hòa hợp bản thân với một vật thể, cho phép họ căn chỉnh tầm nhìn của mình đến địa điểm của chủ sở hữu vật thể đó.#!"
 PSYCHOMETRY_5_PERK_EFFECT: "Chi phí [buy_claim_interaction|E] và [buy_artifact_claim_interaction|E]: #P -10%#!\nVới vai trò [character_interaction|E], có thể triệu hồi/đánh cắp một [artifact|E] đã được xác nhận quyền sở hữu sau khi thắng một cuộc đấu quản trị.\n#weak Nhà ngoại cảm nhận được hình ảnh rõ ràng của bất kỳ sự kiện cộng hưởng nào diễn ra gần vật thể và có thể lần theo dấu vết ngoại cảm của nó.#!"

