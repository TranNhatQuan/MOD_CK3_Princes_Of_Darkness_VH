 ECTOPLASMIC_GENERATION_1_PERK_EFFECT: "#weak Nhà ngoại cảm có thể tạo ra linh khí dưới dạng một chất dính bốc hơi trở lại Địa Ngục sau vài phút.\nNhà ngoại cảm tạo ra vài sợi linh khí từ các lỗ trên cơ thể mà họ có thể áp dụng bằng tay.#!"
 ECTOPLASMIC_GENERATION_2_PERK_EFFECT: "#weak Nhà ngoại cảm có thể kéo linh khí thành dạng như sương mù.#!"
 ECTOPLASMIC_GENERATION_3_PERK_EFFECT: "$unlock_forging_node$ Cho phép chủ sở hữu artifact gây hại linh hồn\n#weak Nhà ngoại cảm có thể làm cứng sương linh khí theo ý muốn và tạo hình nó bằng tay.#!"
 ECTOPLASMIC_GENERATION_4_PERK_EFFECT: "Cải thiện [artifact|E] được tạo ra bởi [GetPerk('ectoplasmic_generation_3_perk').GetName( GetNullCharacter )] bằng cách thêm một [modifier|E] dựa trên loại [artifact|E]\n#weak Nhà ngoại cảm có thể tạo hình các cấu trúc linh khí của mình bằng tâm trí ngay tại thời điểm tạo ra chúng.#!"
 ECTOPLASMIC_GENERATION_5_PERK_EFFECT: "Cải thiện [artifact|E] được tạo ra bởi [GetPerk('ectoplasmic_generation_4_perk').GetName( GetNullCharacter )] bằng cách thêm một [modifier|E] dựa trên loại [artifact|E]\n$unlock_forging_node$ Hiến tế một [prisoner|E] $POD_splat_wraith$ để cải thiện một [artifact|E] dựa trên [traits|E] của vật hiến tế\nMở khóa phần lớn $POD_plasmic_maa$ [men_at_arms|E]\n#weak Nhà ngoại cảm có thể tạo ra một cấu trúc thông minh sơ khai từ linh khí, vâng theo ý chí của họ.#!"

