 PRECOGNITION_1_PERK_EFFECT: "#weak Nhà ngoại cảm có thể nhận được những cái nhìn thoáng qua về diễn biến khả dĩ nhất của sự kiện và đôi khi thậm chí thấy được tương lai.\nDự đoán của nhà ngoại cảm cho các sự kiện ngẫu nhiên, như đổ xúc xắc, trở nên chính xác hơn.#!"
 PRECOGNITION_2_PERK_EFFECT: "Tù nhân của bạn có ít cơ hội trốn thoát khỏi nhà tù của bạn hơn.\n#weak Nhà ngoại cảm có thể thiền định để nhận được những linh ảnh về một tương lai khả dĩ. Những linh ảnh này mơ hồ và mang tính ẩn dụ, cần nhiều diễn giải để trở nên hữu dụng.#!"
 PRECOGNITION_3_PERK_EFFECT: "Bạn sẽ nhận được thông báo nếu có ai định giết bạn bè hoặc gia đình bạn.\nBạn sẽ nhận được thông báo nếu có ai định dụ dỗ người tình hoặc bạn đời của bạn.\n#weak Nhà ngoại cảm có thể cảm nhận khi họ đang gặp nguy hiểm.#!"
 PRECOGNITION_4_PERK_EFFECT: "#weak Nhà ngoại cảm có thể thấy phản ứng ngay lập tức mà một hành động sẽ gây ra.#!"
 PRECOGNITION_5_PERK_EFFECT: "Với vai trò [character_interaction|E], có thể phát hiện mọi âm mưu thù địch nhắm vào bạn, và ngăn chặn những âm mưu đã bị phát hiện.\n#weak Nhà ngoại cảm có thể thấy tương lai khả dĩ nhất ở thời điểm hiện tại.#!"

