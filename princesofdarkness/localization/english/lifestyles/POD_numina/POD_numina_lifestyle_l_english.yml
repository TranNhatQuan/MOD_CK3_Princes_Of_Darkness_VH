 CYBERKINESIS_1_PERK_EFFECT: "#weak Cho phép nhà ngoại cảm giành quyền kiểm soát các thiết bị điện tử.\nNhà ngoại cảm có thể tắt và mở một thiết bị điện tử.#!"
 CYBERKINESIS_2_PERK_EFFECT: "#weak Nhà ngoại cảm có thể kích hoạt một chương trình trên máy vi tính, miễn là họ biết chương trình đó đã được cài đặt. Họ cũng có thể vận hành một máy vi tính mà không cần chạm vào bàn phím.#!"
 CYBERKINESIS_3_PERK_EFFECT: "#weak Nhà ngoại cảm có thể dùng thần giao để đọc, mã hóa và giải mã các liên lạc điện tử, đồng thời gây cho nạn nhân một cơn co giật kiểu động kinh.#!"
 CYBERKINESIS_4_PERK_EFFECT: "#weak Nhà ngoại cảm có thể ghi đè các chương trình bảo mật nội bộ và vận hành bất kỳ thiết bị điện tử nào trong tầm nhìn.#!"
 CYBERKINESIS_5_PERK_EFFECT: "#weak Nhà ngoại cảm có thể lập trình lại một máy vi tính để nó thực hiện điều gì đó mà nó có khả năng vật lý để xử lý.#!"

 cyberpathy_1_perk_name: "Đọc Dữ Liệu Điện Tử 1"
 cyberpathy_2_perk_name: "Đọc Dữ Liệu Điện Tử 2"
