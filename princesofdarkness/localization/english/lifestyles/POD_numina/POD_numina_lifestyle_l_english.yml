 PSYCHIC_VAMPIRISM_1_PERK_EFFECT: "Với vai trò [character_interaction|E], bạn có thể giảm căng thẳng bằng cách 'ăn' cảm xúc của ai đó. Yêu cầu mục tiêu ở cùng địa điểm với bạn, và có [stress|E] #V 0#! hoặc [stress_level|E] #V 3#!.\n#weak Nhà ngoại cảm có thể hút từ nhiều hơn một người.\nNhà ngoại cảm có thể hút cạn những cảm xúc mạnh để tự mình trải nghiệm chúng.#!"
 PSYCHIC_VAMPIRISM_2_PERK_EFFECT: "Cải thiện [character_interaction|E] của [GetPerk('psychic_vampirism_1_perk').GetName( GetNullCharacter )] bằng cách tăng lượng căng thẳng mất đi và thay đổi yêu cầu thành [stress|E] #V 0#! hoặc [stress_level|E] #V 2#!.\n#weak Nhà ngoại cảm có thể hút Ý Chí từ một mục tiêu để bổ sung cho ý chí của chính mình.#!"
 PSYCHIC_VAMPIRISM_3_PERK_EFFECT: "Cải thiện [character_interaction|E] của [GetPerk('psychic_vampirism_1_perk').GetName( GetNullCharacter )] bằng cách cũng nhận một lượt [GetModifier('psi_vampirism_health').GetNameWithTooltip] trong 20 năm.\n#weak Nhà ngoại cảm có thể hút sinh lực để trị các chấn thương nhỏ.#!"
 PSYCHIC_VAMPIRISM_4_PERK_EFFECT: "Cải thiện [character_interaction|E] của [GetPerk('psychic_vampirism_1_perk').GetName( GetNullCharacter )] bằng cách giảm thời gian hồi từ 5 xuống 2 năm\n#weak Nhà ngoại cảm có thể hút thậm chí nhiều sinh lực hơn để trị các chấn thương nặng.#!"
 PSYCHIC_VAMPIRISM_5_PERK_EFFECT: "Loại bỏ yêu cầu về địa điểm của [GetPerk('psychic_vampirism_1_perk').GetName( GetNullCharacter )] nếu bạn đã từng hút cạn sinh lực của mục tiêu trước đó.\n#weak Nhà ngoại cảm có thể hút từ nhiều hơn một người.#!"

