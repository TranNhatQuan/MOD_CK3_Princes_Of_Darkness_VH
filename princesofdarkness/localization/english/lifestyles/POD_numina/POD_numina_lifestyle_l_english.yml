 PSYCHIC_HYPNOSIS_1_PERK_EFFECT: "Với vai trò [character_interaction|E], tặng mục tiêu [GetModifier('psi_hypnosis_stress_buff').GetNameWithTooltip] trong 5 năm. Chỉ khả dụng nếu mục tiêu có thiện cảm #V 0+#! với nhà ngoại cảm và ở cùng địa điểm.\n#weak Nhà ngoại cảm có thể cài đặt lệnh và gợi ý vào mục tiêu của họ bằng cách đưa họ vào trạng thái xuất thần rồi thôi miên họ.\nNhà ngoại cảm có thể đưa một mục tiêu vào trạng thái xuất thần thôi miên.#!"
 PSYCHIC_HYPNOSIS_2_PERK_EFFECT: "[character_interaction|E] từ [GetPerk('psychic_hypnosis_1_perk').GetName( GetNullCharacter )] giờ cũng cho phép bạn tăng thiện cảm của mục tiêu với bạn qua một cuộc đấu ngoại giao.\n#weak Nhà ngoại cảm có thể đưa ra một gợi ý nhỏ khi mục tiêu đang trong trạng thái xuất thần.#!"
 PSYCHIC_HYPNOSIS_3_PERK_EFFECT: "[character_interaction|E] từ [GetPerk('psychic_hypnosis_1_perk').GetName( GetNullCharacter )] giờ cũng cho phép bạn trị các thói quen căng thẳng xấu hoặc nhận một móc câu yếu sau khi thắng một cuộc đấu ngoại giao.\n#weak Nhà ngoại cảm có thể đưa ra các gợi ý vẫn còn tồn tại ngay cả sau khi trạng thái xuất thần kết thúc.#!"
 PSYCHIC_HYPNOSIS_4_PERK_EFFECT: "[character_interaction|E] từ [GetPerk('psychic_hypnosis_1_perk').GetName( GetNullCharacter )] giờ cũng cho phép bạn trị hầu hết các vấn đề tâm lý.\nTăng cơ hội thôi miên thành công.\n#weak Nhà ngoại cảm có thể đưa một mục tiêu vào trạng thái xuất thần chỉ bằng một cái nhìn.#!"
 PSYCHIC_HYPNOSIS_5_PERK_EFFECT: "Có thể dùng [character_interaction|E] [GetPerk('psychic_hypnosis_1_perk').GetName( GetNullCharacter )] mà không cần mục tiêu có thiện cảm 0+ với bạn. Tăng cơ hội thành công và có thể nâng cấp móc câu nhận được từ thôi miên thành móc câu mạnh.\n#weak Nhà ngoại cảm có thể lập trình sâu một mục tiêu khi nó đang trong trạng thái xuất thần, thậm chí ảnh hưởng đến trí nhớ của họ.#!"

