 PSYCHIC_INVISIBILITY_1_PERK_EFFECT: "#weak Tương tự Bí Thuật Obfuscate của ma cà rồng, nhà ngoại cảm có thể che giấu sự hiện diện của mình, không hiện ra trong mắt người quan sát.\nNhà ngoại cảm không bị chú ý miễn là họ đứng hoàn toàn im lặng.#!"
 PSYCHIC_INVISIBILITY_2_PERK_EFFECT: "#weak Nhà ngoại cảm không bị chú ý miễn là họ di chuyển đủ chậm.#!"
 PSYCHIC_INVISIBILITY_3_PERK_EFFECT: "#weak Nhà ngoại cảm có thể tàng hình và di chuyển miễn là họ không bị nhìn vào lúc kích hoạt năng lực đó.#!"
 PSYCHIC_INVISIBILITY_4_PERK_EFFECT: "#weak Nhà ngoại cảm có thể khiến những người nhất định thấy họ trong khi đang ẩn mình.#!"
 PSYCHIC_INVISIBILITY_5_PERK_EFFECT: "Với vai trò [character_interaction|E], bạn có thể làm chậm bất kỳ âm mưu thù địch nhắm vào bạn 2 giai đoạn.\n#weak Nhà ngoại cảm có thể tàng hình ngay trước mặt ai đó.#!"

