 arcana_enthrall_perk_name: "Nô Dịch Hóa"
 arcana_hardened_flesh_perk_name: "Da Thịt Cứng Rắn"
 arcana_inviolate_soul_perk_name: "Linh Hồn Bất Khả Xâm Phạm"
 arcana_invocation_of_name_perk_name: "Triệu Hồi Danh Xưng"
 arcana_pattern_sense_perk_name: "Cảm Nhận Quy Luật"
 arcana_ravage_perk_name: "Cưỡng Đoạt"
 arcana_regeneration_perk_name: "Tái Sinh"
 arcana_revelation_perk_name: "Khải Thị"

 ARCANA_APOCALYPTIC_FORM_PERK_EFFECT: "Là một [character_interaction|E], biến hình thành [GetModifier('POD_shapeshift_form_apocalyptic_angelic_modifier').GetNameWithTooltip] hoặc [GetModifier('POD_shapeshift_form_apocalyptic_damned_modifier').GetNameWithTooltip]\n#flavor Mọi con quỷ, như một tàn tích của thần tính của chúng, có một trạng thái tồn tại mà chúng có thể chuyển sang trong chiến đấu, Hình Dạng Tận Thế đáng sợ của chúng. Tùy vào Torment của con quỷ, chúng có thể trông như thiên thần, như thể chưa từng sa ngã, hoặc thực sự xấu xa và hung tàn, phô bày cảnh tượng thật của sự giày vò nội tâm. Trong mọi trường hợp, hình dạng khủng khiếp và quyền năng này là vũ khí chủ lực của một con quỷ trong chiến tranh.#!"
 ARCANA_DEVOUR_SOUL_PERK_EFFECT: "Là một lựa chọn hành hình, nuốt linh hồn của một $POD_splat_demon$ đồng loại để nhận #V 10#! điểm perk [arcana_lifestyle|E].\n#flavor Khi ở ngoài giới hạn của Địa Ngục, một con quỷ có thể tàn sát một con khác, phá hủy linh hồn nó và rút cạn chính linh hồn của nó.#!"
 ARCANA_DIVINE_POTENTIAL_PERK_EFFECT: "Là một [character_interaction|E], đổi 10 điểm perk [arcana_lifestyle|E] để lấy #V 1#! điểm [skill|E] #italic vĩnh viễn#!.\n#flavor Với sự am hiểu như vậy về Arcana và Hình Dạng Phàm Nhân, một con quỷ có thể vượt qua những giới hạn từng là phàm nhân.#!"
 ARCANA_ENTHRALL_PERK_EFFECT: "Là một [character_interaction|E], biến mục tiêu của bạn thành Thrall của bạn. Họ nhận [investiture_lifestyle|E], và bạn có thể đưa ra yêu cầu từ họ để đổi lấy điểm perk [arcana_lifestyle|E].\n#flavor Chỉ với một cái chạm, một tín đồ phàm nhân của con quỷ có thể được 'ban tặng' bởi chủ nhân ác quỷ mới của mình.#!"
 ARCANA_HARDENED_FLESH_PERK_EFFECT: "#flavor Cơ thể vật chủ của con quỷ, ở trạng thái này, trở nên vô cùng bền vững, có thể chống chịu những đòn đánh thường gây chết người khi ở trạng thái sung mãn nhất. Nguồn năng lượng thô chảy vào cơ thể giữ nó mãi trẻ trung, cho đến khi con quỷ quyết định rằng nó đã xong việc với thân xác hiện tại.#!"
 ARCANA_INVIOLATE_SOUL_PERK_EFFECT: "Trở nên miễn nhiễm với các quyền năng tâm linh\n#flavor Là những sinh vật của sự chiếm hữu, không ai có thể cướp quyền kiểm soát cơ thể một con quỷ khỏi tay chúng.#!"
 ARCANA_INVOCATION_OF_NAME_PERK_EFFECT: "Mở khóa một [journey|E] cho phép bạn học [Glossary('Chân Danh','podgloss.truename')] của một $POD_splat_demon$.\n#flavor Mỗi khi được nói ra, Chân Danh của một con quỷ vang lên trong tai chúng, cho phép chúng có khả năng tìm ra kẻ đã dám nói tên đó.#!"
 ARCANA_PATTERN_SENSE_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$ \n #flavor Quỷ từng có một sự nhạy cảm bản năng với các quy luật của trật tự tự nhiên, vì đã thiết lập những quy luật đó từ thời khởi thủy. Với arcana này, một con quỷ đã học lại điều đó, và cách khai thác nó.#!"
 ARCANA_RAVAGE_PERK_EFFECT: "Là một [character_interaction|E], giết một trong các Thrall của bạn để khôi phục [CHARACTER.Custom('PODEnergySplat')].\n#flavor Trong lúc tuyệt vọng, một con quỷ có thể nuốt linh hồn của các thrall của mình để lấy sức mạnh, khiến chúng phải bỏ mạng vì các chủ nhân sa ngã của mình.#!"
 ARCANA_REGENERATION_PERK_EFFECT: "#flavor Với sự am hiểu về sức mạnh nội tại của mình, một con quỷ có thể hàn gắn các vết thương trên hình dạng của nó, để giữ vật chủ hiện tại của mình ở trạng thái sung mãn nhất.#!"
 ARCANA_REVELATION_PERK_EFFECT: "Là một [character_interaction|E], phơi bày bản thân trước phàm nhân, nhận [CHARACTER.Custom('PODEnergySplat')] để đổi lấy [piety|E] hoặc [prestige|E].\n#flavor Khi thiếu một nguồn quyết tâm ổn định, một con quỷ có thể rút cạn đức tin của một phàm nhân qua một cuộc khủng hoảng tôn giáo cực độ.#!"

 arcana_sharpen_senses_perk_name: "Mài Sắc Giác Quan"
 arcana_perfect_lie_perk_name: "Lời Dối Trá Hoàn Hảo"
 arcana_twist_of_fate_perk_name: "Bước Ngoặt Số Phận"
 arcana_read_the_heart_perk_name: "Đọc Trái Tim"

 ARCANA_SHARPEN_SENSES_PERK_EFFECT: "$countermeasures_unlocks_t1_supernatural_high_alert$ \n #flavor Từng là bàn tay của Yahweh trong công cuộc sáng thế, một con quỷ có thể tiếp tục dẫn dắt vũ trụ theo ý mình chọn.#!"
 ARCANA_PERFECT_LIE_PERK_EFFECT: "#flavor Bất kể lời nói dối có phi lý đến đâu, những con quỷ có quyền năng này có thể nói dối dễ dàng như hít thở.#!"
 ARCANA_TWIST_OF_FATE_PERK_EFFECT: "Là một [character_interaction|E], đổi một điểm [perk|E] [arcana_lifestyle|E] để lấy [gold|E], [prestige|E] hoặc [piety|E].\n#flavor Số phận có vẻ ưu ái con quỷ, khi chúng nhận được những món lợi phàm nhân bất thường, tưởng như hoàn toàn ngẫu nhiên.#!"
 ARCANA_READ_THE_HEART_PERK_EFFECT: "Mở khóa một [journey|E] để cám dỗ mục tiêu của bạn phạm tội. Họ nhận [trait|E] tội lỗi tương ứng với đức tin của bạn, hoặc nếu đã có, sẽ cải đạo sang đức tin của bạn.\n #flavor Giác quan tâm linh của một con quỷ trở nên nhạy bén đến mức, chúng có thể tìm ra tội lỗi và đức hạnh của bất kỳ ai, dù được che giấu sâu kín đến đâu.#!"

 arcana_gift_of_faith_perk_name: "Món Quà Đức Tin"
 arcana_increased_health_perk_name: "Tăng Cường Sức Khỏe"
 arcana_contagion_mastery_perk_name: "Tinh Thông Bệnh Dịch"
 arcana_spirit_sight_perk_name: "Nhãn Linh Hồn"
 arcana_read_the_sin_perk_name: "Đọc Tội Lỗi"
 arcana_shield_of_spite_perk_name: "Lá Chắn Hiềm Khích"

 ARCANA_GIFT_OF_FAITH_PERK_EFFECT: "Giảm chi phí của [interaction|E] #V $POD_set_cultist_interaction$#! đi #P -25%#!\nCải thiện [GetPerk('arcana_revelation_perk').GetName(GetPlayer)] bằng cách tăng lượng [CHARACTER.Custom('PODEnergySplat')] nhận được.\n#flavor Khi tràn ngập năng lượng thần thánh, một con Quỷ có thể trao tặng quyền năng của mình cho một thrall, để giảm nhẹ gánh nặng căng thẳng trên linh hồn họ.#!"
 ARCANA_SHIELD_OF_SPITE_PERK_EFFECT: "#flavor Tâm trí của một con quỷ bị giày vò đến mức, chỉ cần cố gắng dò xét vào nó cũng khiến kẻ tấn công ngu ngốc phải chịu đựng nỗi đau khủng khiếp từ sự tuyệt vọng và xấu xa bên trong.#!"
 ARCANA_CONTAGION_MASTERY_PERK_EFFECT: "Là một [character_interaction|E], lây nhiễm cho mục tiêu một căn bệnh do bạn chọn.\n#flavor Con quỷ, với quyền năng này, đạt được sự am hiểu về cả những sinh vật nhỏ nhất của chúa, có thể loại bỏ bệnh tật khỏi một vật chủ, hoặc tệ hơn, gieo rắc bệnh tật lên họ.#!"
 ARCANA_SPIRIT_SIGHT_PERK_EFFECT: "$POD_can_summon_on_death_trigger_loca$\n#flavor Là những sinh vật tâm linh, ngay cả những kẻ chết không yên nghỉ cũng không thể tránh khỏi con mắt của một con quỷ cảnh giác.#!"
 ARCANA_READ_THE_SIN_PERK_EFFECT: "Cải thiện [GetPerk('arcana_read_the_heart_perk').GetName(GetPlayer)] bằng cách tăng [planning_speed|E] và tỷ lệ thành công.\n#flavor Là những sinh vật của tội lỗi, một con quỷ có thể nhìn vào một phàm nhân, và tìm ra tội lỗi ngự trị trong tâm hồn họ.#!"
 ARCANA_INCREASED_HEALTH_PERK_EFFECT: "[GetPerk('arcana_regeneration_perk').GetName(GetPlayer)] giờ xảy ra #V hai lần#! một năm.\n#flavor Với sự am hiểu về thể chất của mình, một con quỷ có thể đẩy vật chủ của mình vượt xa giới hạn phàm nhân.#!"

 arcana_incorporeal_form_perk_name: "Hình Dạng Vô Hình Thể"
 arcana_compel_sin_perk_name: "Cưỡng Ép Tội Lỗi"
 arcana_ultimate_horror_perk_name: "Kinh Hoàng Tối Thượng"
 arcana_resilience_perk_name: "Sức Bền Bỉ"
 arcana_spirit_strike_perk_name: "Đòn Đánh Linh Hồn"
 arcana_healing_touch_perk_name: "Cái Chạm Chữa Lành"
 arcana_sin_eating_perk_name: "Ăn Tội Lỗi"
 arcana_preternatural_reflexes_perk_name: "Phản Xạ Siêu Nhiên"
 arcana_scry_perk_name: "Chiêm Bốc"
 arcana_relentless_soul_perk_name: "Linh Hồn Không Ngừng Nghỉ"

 ARCANA_INCORPOREAL_FORM_PERK_EFFECT: "Là một [character_interaction|E], biến hình thành [GetModifier('POD_shapeshift_form_incorporeal_modifier').GetNameWithTooltip].\nBạn không còn có thể bị cầm tù trong [sieges|E] hoặc [raids|E] nữa.\n#flavor Dùng hình dạng vật lý của mình như một cái mỏ neo, một con quỷ đã tìm ra cách đánh lừa các nhà tù của địa ngục, cho phép chúng phóng chiếu khỏi một vật chủ và trở thành một sinh vật tâm linh một lần nữa.#!"
 ARCANA_SIN_EATING_PERK_EFFECT: "Cải thiện [GetPerk('arcana_revelation_perk').GetName(GetPlayer)] bằng cách giảm chi phí của nó.\n#flavor Sự hiểu biết của con quỷ về tội lỗi trở nên sâu sắc đến mức, những phàm nhân trong cơn tuyệt vọng cung cấp dưỡng chất cho kẻ giày vò địa ngục của họ.#!"
 ARCANA_ULTIMATE_HORROR_PERK_EFFECT: "Gây [GetModifier('POD_ultimate_horror_modifier').GetNameWithTooltip] cho mọi lãnh chủ ở phe đối lập khi bắt đầu một [war|E] với vai trò là kẻ tấn công hoặc phòng thủ chính.\n#flavor Hình Dạng Tận Thế của con quỷ này đã trở nên khủng khiếp đến mức, sự điên loạn và khổ đau theo bước nó bất cứ nơi nào nó đi để gây chiến.#!"
 ARCANA_RESILIENCE_PERK_EFFECT: "#flavor Đã tinh thông khả năng chống chịu sát thương, một con quỷ với arcana này khó bị gây thương tích hơn rất nhiều, cơ thể chúng có sức chống chịu siêu nhiên trước tổn hại.#!"
 ARCANA_SPIRIT_STRIKE_PERK_EFFECT: "#flavor Với quyền năng này, con quỷ có thể triệu hồi hình dạng tâm linh của nó để gây tổn hại đến cả các linh hồn, không gì thoát khỏi cơn thịnh nộ của con quỷ.#!"
 ARCANA_HEALING_TOUCH_PERK_EFFECT: "Là một [character_interaction|E], chữa lành cho mục tiêu của bạn.\n#flavor Với quyền năng của đức tin phàm nhân, con quỷ có thể chữa lành cho người sống, hàn gắn những vết thương bị tàn phá của họ.#!"
 ARCANA_COMPEL_SIN_PERK_EFFECT: "Cải thiện [GetPerk('arcana_read_the_heart_perk').GetName(GetPlayer)] bằng cách tăng [planning_speed|E] và tỷ lệ thành công.\n#flavor Với quyền năng này, một con quỷ có thể truyền tội lỗi của mình vào một nạn nhân, khơi dậy tội lỗi từ sâu trong chính linh hồn họ.#!"
 ARCANA_PRETERNATURAL_REFLEXES_PERK_EFFECT: "$countermeasures_unlocks_t2_supernatural_high_alert$ \n #flavor Ở trạng thái quyền năng này, một con quỷ nhận được nhận thức siêu nhiên về môi trường xung quanh, luôn sẵn sàng bật vào chiến đấu, và luôn trong trạng thái sẵn sàng.#!"
 ARCANA_SCRY_PERK_EFFECT: "Kích hoạt [scheme|E] [GetScheme('abduct').GetTypeName]\n#flavor Với sự tập trung và một cái tên, một con quỷ có thể chiêm bốc thông tin về nơi đang được tập trung vào.#!"
 ARCANA_RELENTLESS_SOUL_PERK_EFFECT: "#flavor Khi một con quỷ sắp nhận một đòn chí mạng, quyền năng nội tại của nó có thể ngăn cánh cổng tử thần lại vì lớp vỏ của nó, 'chỉ' khiến nó bất tỉnh thay vì chết.#!"

 arcana_arsenal_of_the_beast_perk_name: "Vũ Khí Của Dã Thú"
 arcana_inhuman_strength_perk_name: "Sức Mạnh Phi Nhân"
 arcana_damage_immunity_perk_name: "Miễn Nhiễm Sát Thương"
 arcana_trait_aptitude_perk_name: "Năng Khiếu Đặc Tính"
 arcana_speed_of_thought_perk_name: "Tốc Độ Của Tư Duy"
 arcana_premonition_perk_name: "Linh Cảm"
 arcana_invinsibility_perk_name: "Vô Hình"
 arcana_read_the_mind_perk_name: "Đọc Tâm Trí"
 arcana_command_the_dead_perk_name: "Sai Khiến Kẻ Chết"
 arcana_fortunate_guess_perk_name: "Dự Đoán May Mắn"
 arcana_shrouded_soul_perk_name: "Linh Hồn Được Che Phủ"

 ARCANA_ARSENAL_OF_THE_BEAST_PERK_EFFECT: "Là một [character_interaction|E], bạn có thể thêm các vũ khí biến hình thú tính vào bộ trang bị của mình, hoặc biến hình thành tất cả chúng cùng một lúc.\n#flavor Con quỷ, ở trạng thái này, có thể hiện hóa một vũ khí trong Hình Dạng Tận Thế của nó, dưới hình dạng những lưỡi kiếm tuyệt mỹ, hay những móng vuốt hung tàn mà ngay cả những con thú tàn ác nhất cũng không dùng tới.#!"
 ARCANA_INHUMAN_STRENGTH_PERK_EFFECT: "#flavor Với quyền năng này, sức mạnh của một con quỷ được hiện hóa thành sức mạnh thô, như những bó cơ bắp cuộn trào, hoặc như một nguồn dự trữ ẩn giấu của quyền năng đáng sợ.#!"
 ARCANA_DAMAGE_IMMUNITY_PERK_EFFECT: "Sẽ không chịu sát thương từ việc đóng cọc hoặc lửa, và không thể trở thành [GetTrait('inappetetic').GetName(GetPlayer)].\n#flavor Với quyền năng này, một con quỷ trở nên hoàn toàn miễn nhiễm với một dạng hủy diệt vật lý, và hình dạng của nó trở nên thực sự, tận thế, bền vững.#!"
 ARCANA_TRAIT_APTITUDE_PERK_EFFECT: "#flavor Sự am hiểu của một con quỷ về một lĩnh vực trở nên thấu đáo đến mức, chúng trở nên vô song trong lĩnh vực đó, khi mọi điều chúng thực hiện với kỹ năng này đã trở thành một kiệt tác.#!"
 ARCANA_SPEED_OF_THOUGHT_PERK_EFFECT: "#flavor Tốc độ của con quỷ này chói lòa đến mức, nó có thể bắn một cây nỏ và bắt lấy mũi tên giữa không trung bằng quyền năng đáng sợ của mình#!"
 ARCANA_PREMONITION_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$ \n Bạn sẽ nhận được thông báo nếu ai đó có ý định sát hại bạn bè hoặc gia đình của bạn.\n#flavor Như một con nhện trong mạng lưới của mình, nhân vật cảm nhận được những rung động trong các sợi tơ số phận khi nguy hiểm đến gần, khiến họ sẵn sàng cho mọi tình huống.#!"
 ARCANA_INVINSIBILITY_PERK_EFFECT: "Là một [character_interaction|E], biến hình thành [GetModifier('POD_shapeshift_form_invisible_modifier').GetNameWithTooltip].\n#flavor Khi hình dạng của chúng ngày càng trở nên dễ uốn nắn theo ý muốn của con quỷ, chúng đạt được khả năng loại bản thân khỏi tầm nhìn của các sinh vật trong sáng thế.#!"
 ARCANA_COMMAND_THE_DEAD_PERK_EFFECT: "$POD_can_weaken_fetter_trigger_loca$\n$POD_can_bind_wraith_trigger_loca$\n$POD_can_command_wraith_trigger_loca$\nMở khóa [men_at_arms|E] Wraith và Undead.\n#flavor Ngay cả kẻ chết cũng không thể trốn khỏi quyền năng này, khi một con quỷ có thể cưỡng ép chúng phục vụ.#!"
 ARCANA_READ_THE_MIND_PERK_EFFECT: "Là một [character_interaction|E], học toàn bộ bí mật và âm mưu của mục tiêu của bạn. Nếu nhắm vào chính mình, khám phá toàn bộ âm mưu nhắm vào bạn.\n#flavor Cuốn sách của tâm trí được phơi bày, một con quỷ với quyền năng này có thể lật xem những ý nghĩ, như thể đó là một cuốn sách đang mở.#!"
 ARCANA_FORTUNATE_GUESS_PERK_EFFECT: "Kích hoạt [scheme|E] [GetScheme('fabricate_hook').GetTypeName]\n#flavor Con quỷ trở nên am hiểu các mối quan hệ phàm nhân đến mức, đôi khi nó có thể hiểu và biết được nếu có ai thể hiện ác ý với các tín đồ giáo phái được nó ưu ái.#!"
 ARCANA_SHROUDED_SOUL_PERK_EFFECT: "$countermeasures_unlocks_t1_obfuscated_court$ \n #flavor Với quyền năng này, một con quỷ có thể làm mờ nhận thức của những người xung quanh, trở nên vô danh trong một đám đông, bất kể nó nổi bật đến đâu.#!"

 arcana_conquering_will_perk_name: "Ý Chí Chinh Phục"
 arcana_inured_to_agony_perk_name: "Chai Sạn Với Đau Đớn"
 arcana_visage_of_glory_perk_name: "Dung Nhan Vinh Quang"
 arcana_reshape_flesh_perk_name: "Tái Tạo Da Thịt"
 arcana_excise_soul_perk_name: "Cắt Bỏ Linh Hồn"
 arcana_foretell_perk_name: "Tiên Đoán"
 arcana_shortened_path_perk_name: "Con Đường Rút Ngắn"
 arcana_reapers_hunger_perk_name: "Cơn Đói Của Tử Thần"
 arcana_touch_from_afar_perk_name: "Cái Chạm Từ Xa"

 ARCANA_CONQUERING_WILL_PERK_EFFECT: "#flavor Triệu hồi chính danh xưng của Yahweh, một con quỷ có thể tiếp sức cho các chiến binh của mình, bằng lời của vị chúa đã đày đọa chúng.#!"
 ARCANA_INURED_TO_AGONY_PERK_EFFECT: "#flavor Một con quỷ với quyền năng này chiến thắng những nỗi lo phàm nhân như 'đau đớn' hay 'tuổi tác', và thay vào đó, bất kể nó bị thương tật đến đâu, chỉ cần con quỷ còn đứng vững, nó sẽ chiến đấu như thể chưa từng bị chiến tranh hay bệnh tật đụng tới.#!"
 ARCANA_VISAGE_OF_GLORY_PERK_EFFECT: "#flavor Khơi lại những hồi ức về địa vị Elohim đã mất của mình, trong một thời gian ngắn, một con quỷ có thể trở nên thực sự thiên thần.#!"
 ARCANA_RESHAPE_FLESH_PERK_EFFECT: "Bạn có thể thay đổi [traits|E] thể chất của một mục tiêu tự nguyện.\n#flavor Con quỷ với quyền năng này có thể sai khiến vật chất sống động chuyển dịch và thậm chí chảy như sáp dưới cái chạm của nó, có thể được nắn theo ý muốn đọa lạc của chúng.#!"
 ARCANA_EXCISE_SOUL_PERK_EFFECT: "$POD_can_covert_to_wraith_trigger_loca$\n$POD_can_summon_wraith_trigger_loca$\nBạn phá hủy linh hồn của bất kỳ nhân vật nào bạn giết, vượt qua các khả năng phục sinh.\n#flavor Với quyền năng khủng khiếp này, một con quỷ triệu hồi một nghi lễ, xé toạc linh hồn của một nạn nhân và buộc nó phải phục vụ theo mong muốn của con quỷ.#!"
 ARCANA_FORETELL_PERK_EFFECT: "#flavor Sự am hiểu của một con quỷ về sáng thế sâu sắc đến mức, một con quỷ có thể dự đoán được điều chưa xảy ra.#!"
 ARCANA_SHORTENED_PATH_PERK_EFFECT: "#flavor Với sự am hiểu về những con đường cổ xưa của sáng thế, một con quỷ có thể rút ngắn thời gian di chuyển xuống chỉ còn một phần nhỏ so với trước đây.#!"
 ARCANA_REAPERS_HUNGER_PERK_EFFECT: "Mỗi lần hạ sát mang lại [GetModifier('POD_reapers_hunger_modifier').GetNameWithTooltip] trong 5 năm.\n#flavor Bất cứ khi nào một con quỷ với quyền năng này chấm dứt sinh mạng của một phàm nhân, nó có thể gặt lấy linh hồn đang chết đi của một quyền năng quý giá.#!"
 ARCANA_TOUCH_FROM_AFAR_PERK_EFFECT: "#flavor Khi sự am hiểu của con quỷ về thực tại không gian tăng lên, phạm vi của các arcana của nó cũng vậy.#!"

 arcana_unyielding_perk_name: "Bất Khuất"
 arcana_theft_of_faith_perk_name: "Trộm Đức Tin"
 arcana_behold_the_metatron_perk_name: "Chiêm Ngưỡng Metatron"
 arcana_command_the_eternal_soul_perk_name: "Sai Khiến Linh Hồn Vĩnh Cửu"
 arcana_implacable_vengeance_perk_name: "Báo Thù Không Khoan Nhượng"
 arcana_trait_enhancement_perk_name: "Tăng Cường Đặc Tính"
 arcana_certainties_of_chance_perk_name: "Sự Chắc Chắn Của Vận May"
 arcana_celestial_radience_perk_name: "Ánh Sáng Thiên Giới"
 arcana_shadow_mastery_perk_name: "Tinh Thông Bóng Tối"
 arcana_step_between_perk_name: "Bước Xuyên Không"

 ARCANA_UNYIELDING_PERK_EFFECT: "#flavor Ý chí của một con quỷ mạnh mẽ đến mức, chỉ cần chúng còn giữ được sức mạnh của niềm tin, những đòn đánh có thể bị đẩy lùi chỉ bằng ý chí.#!"
 ARCANA_THEFT_OF_FAITH_PERK_EFFECT: "Giảm chi phí của [interaction|E] #V $POD_set_cultist_interaction$#! đi #P 50%#!\nCải thiện [GetPerk('arcana_revelation_perk').GetName(GetPlayer)] bằng cách tăng lượng [CHARACTER.Custom('PODEnergySplat')] nhận được.\n#flavor Sự am hiểu của một con quỷ về các linh hồn trở nên trọn vẹn đến mức, không linh hồn nào có thể thoát khỏi khả năng bị chủ nhân địa ngục của nó nuốt chửng.#!"
 ARCANA_BEHOLD_THE_METATRON_PERK_EFFECT: "#flavor Trở thành một kiến trúc sư thực sự của sáng thế, con quỷ hé lộ hình dạng chân thực nhất của nó, trạng thái nguyên thủy nhất của nó, dù là sự hoàn hảo tuyệt mỹ hay sự xấu xa khủng khiếp.#!"
 ARCANA_COMMAND_THE_ETERNAL_SOUL_PERK_EFFECT: "Là một [character_interaction|E] lên một $POD_splat_demon$ trong nhà tù của bạn, bạn có 50% cơ hội biến chúng thành một con rối trung thành hoặc đưa chúng đến [UmbraGlossary('abyss')].\n#flavor Với quyền năng này, một con quỷ có thể triệu hồi Chân Danh của một con quỷ khác, cưỡng ép nó phải khuất phục.#!"
 ARCANA_IMPLACABLE_VENGEANCE_PERK_EFFECT: "#flavor Những con quái vật không khoan nhượng, một con quỷ có thể triệu hồi Chân Danh của mục tiêu để trở thành những kẻ báo hiệu điềm diệt vong không thể ngăn cản của nạn nhân, trở thành những kẻ báo hiệu tuyệt vọng bất khả chiến bại.#!"
 ARCANA_TRAIT_ENHANCEMENT_PERK_EFFECT: "#flavor Ở cấp độ tinh thông này, một con quỷ đã thực sự vượt qua giới hạn của loài người.#!"
 ARCANA_CERTAINTIES_OF_CHANCE_PERK_EFFECT: "#flavor Chỉ từ việc quan sát dòng chảy của vận may và định mệnh, một con quỷ có thể bẻ cong nó theo ý mình.#!"
 ARCANA_CELESTIAL_RADIENCE_PERK_EFFECT: "#flavor Con quỷ truyền dẫn quyền năng của nó thành ánh sáng chói lòa, trở thành một ngọn hải đăng ánh sáng rực cháy.#!"
 ARCANA_SHADOW_MASTERY_PERK_EFFECT: "Là một [character_interaction|E], biến hình thành [GetModifier('POD_shapeshift_form_shadow_modifier').GetNameWithTooltip].\n#flavor Ý chí của con quỷ đối với linh hồn của chính nó trở nên mạnh mẽ đến mức, một con quỷ có thể khoác lên linh hồn mình, trở thành một cột bóng tối sừng sững.#!"
 ARCANA_STEP_BETWEEN_PERK_EFFECT: "#flavor Với quyền năng này, một con quỷ có thể nhẹ nhàng bẻ cong không gian, biến mất và xuất hiện trở lại trong một luồng sáng chói hoặc bóng tối chập chờn.#!"

 arcana_ravage_sinner_perk_name: "Tàn Sát Kẻ Tội Lỗi"
 arcana_greater_invocation_perk_name: "Triệu Hồi Vĩ Đại"
 arcana_lash_of_anguish_perk_name: "Roi Quất Thống Khổ"
 arcana_raise_the_dead_perk_name: "Hồi Sinh Kẻ Chết"
 arcana_portal_mastery_perk_name: "Tinh Thông Cổng Không Gian"

 ARCANA_RAVAGE_SINNER_PERK_EFFECT: "Cải thiện [GetPerk('arcana_revelation_perk').GetName(GetPlayer)] bằng cách giảm chi phí của nó.\n#flavor Với quyền năng này, sự hiện diện của con quỷ khiến những mong muốn tồi tệ nhất của phàm nhân hiện ra rõ ràng.#!"
 ARCANA_GREATER_INVOCATION_PERK_EFFECT: "Cải thiện [GetPerk('arcana_command_the_eternal_soul_perk').GetName(GetPlayer)] bằng cách cho phép sử dụng lên những kẻ không phải quỷ.\n#flavor Với quyền năng này, một con quỷ bắt đầu có quyền năng lên chính các danh xưng, có thể cưỡng ép người khác phải khuất phục trước lời triệu hồi của nó.#!"
 ARCANA_PORTAL_MASTERY_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn dịch chuyển quân đội của mình đến vị trí của mục tiêu, hoặc dịch chuyển đến điểm đến tiếp theo khi đang di chuyển.\nVượt qua khả năng miễn nhiễm bắt giữ.\n#flavor Cũng như từng có thời sáng thế nằm dưới sự sai khiến của chúng, một con quỷ có thể vượt qua hoặc chặn lại các rào cản theo ý muốn của nó.#!"
 ARCANA_RAISE_THE_DEAD_PERK_EFFECT: "Là một [character_interaction|E], biến một $POD_splat_wraith$ bị trói buộc thành [GetTrait('risen').GetName(GetPlayer)].\n#flavor Ngay cả kẻ chết cũng không thể trốn khỏi sự phục dịch cho con quỷ, khi với quyền năng này, con quỷ có thể hồi sinh những binh đoàn kẻ chết, để phục vụ cho mong muốn địa ngục của nó.#!"
 ARCANA_LASH_OF_ANGUISH_PERK_EFFECT: "#flavor Một con quỷ trở nên nhạy cảm với nỗi đau của chính mình đến mức, nó có thể phóng chiếu sự thống khổ và nỗi đau nội tâm của mình thành một trận mưa năng lượng thần giao cách cảm.#!"

 arcana_open_gate_perk_name: "Mở Cổng"
 arcana_alter_fate_perk_name: "Biến Đổi Định Mệnh"

 ARCANA_OPEN_GATE_PERK_EFFECT: "Cải thiện [GetPerk('arcana_portal_mastery_perk').GetName(GetPlayer)] bằng cách loại bỏ giới hạn về quy mô quân đội.\n#flavor Quyền thống trị của Quỷ đối với không gian mở rộng đến mức không gian tự nó phải khuất phục dưới ý chí của Quỷ.#!"
 ARCANA_ALTER_FATE_PERK_EFFECT: "#flavor Đã từng chiêm bốc chính sáng thế, với quyền năng này, một con quỷ có thể triệu hồi tên của một nạn nhân để thao túng và bẻ cong chính định mệnh của họ.#!"

 arcana_beyond_now_perk_name: "Vượt Ngoài Hiện Tại"

 ARCANA_BEYOND_NOW_PERK_EFFECT: "Là một [character_interaction|E], nhận [GetModifier('POD_beyond_now_modifier').GetNameWithTooltip] trong 1 tuần với chi phí 300 [static_stress|E].\n#flavor Với quyền năng này, một con quỷ có thể bước ra ngoài chính thời gian, tấm thảm dệt của vũ trụ tạm thời nằm dưới sự sai khiến của nó.#!"
