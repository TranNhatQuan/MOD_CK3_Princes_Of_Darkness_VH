 game_concept_arcana_lifestyle: "Arcana"
 game_concept_arcana_lifestyle_desc: "Arcana là một kỳ tích “pháp thuật tâm linh” bắt nguồn từ đức tin và niềm tin của những tín đồ phàm nhân của một con quỷ."

 arcana_lifestyle_name: "Arcana"
 arcana_lifestyle_desc: "Tập trung vào những quyền năng bắt nguồn từ đức tin của phàm nhân, được biến thành những phép màu theo ý đồ tội lỗi của riêng bạn."
