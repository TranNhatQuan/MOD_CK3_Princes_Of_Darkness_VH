 EARTH_SENSE_PERK_EFFECT: "#F Garou có thể cảm nhận “linh khí” của một vùng đất và xác định nơi đó lành mạnh hay đã bị hủy hoại.#!"
 HERB_CALL_PERK_EFFECT: "#F Bằng cách ca hát hoặc tụng niệm, một Garou có thể tìm ra các loại thảo dược, rễ cây hay vỏ cây hữu ích hoặc có dược tính, ngay cả ở những vùng đất nghèo nàn như sa mạc.#!"
 OAKSONG_PERK_EFFECT: "#F Bằng cách sử dụng Ân Huệ này, một Garou có thể giao tiếp với các vật vô tri được làm từ gỗ hoặc chất hữu cơ khác.#!"
 LORE_OF_THE_LAND_PERK_EFFECT: "#F Bằng cách ăn, hút hoặc hấp thụ một phần của vùng đất, Garou có thể cảm nhận những điều đã xảy ra ở khu vực lân cận trong quá khứ.#!"
 EARTH_HEAL_PERK_EFFECT: "#F Ân Huệ này cho phép Garou giúp một vùng đất hồi phục khỏi sự hủy hoại, vết nhiễm $glossary_wyrm$, ô nhiễm hoặc các loại xáo trộn môi trường khác.#!"
 LAMBENT_SIGHT_PERK_EFFECT: "#F Ân Huệ này cho phép Garou khả năng nhìn thấy trong những hoàn cảnh mà bình thường thị giác không thể hoạt động, chẳng hạn như trong bóng tối hoàn toàn hoặc khi Garou bị bịt mắt.#!"
 MOONPOOL_OF_SOKHTA_PERK_EFFECT: "Bạn sẽ nhận được thông báo nếu có ai định sát hại bạn bè hoặc gia đình của bạn.\nBạn sẽ nhận được thông báo nếu có ai định dụ dỗ người tình hoặc bạn đời của bạn.\nTù nhân của bạn có ít cơ hội trốn thoát khỏi ngục hơn.\n#F Ân Huệ này cho phép một Garou biến nước trong, tĩnh lặng thành một ao hồ mang lại những khải tượng về các tương lai có thể xảy ra.#!"
 MOONRIVER_PERK_EFFECT: "#F Bằng cách sử dụng Ân Huệ này, Garou có thể di chuyển nhanh chóng trên mặt nước phản chiếu ánh trăng.#!"
 MOONCAT_PERK_EFFECT: "Mở khóa hình thức biến hình [GetModifier( 'POD_shapeshift_form_mooncat_modifier' ).GetNameWithTooltip|L].\n#F Ân Huệ này cho phép Garou hóa thân thành một con mèo trắng nhỏ. Khả năng này có thể hữu ích để chui vào những nơi chật hẹp (hoặc trốn khỏi đó) và giữ mình ẩn giấu.#!"
 MOONDREAM_PERK_EFFECT: "#F Garou khấn cầu Sokhta ban cho nàng một giấc mộng tiên tri trước khi nàng chìm vào giấc ngủ dưới ánh trăng.#!"
 FIND_THE_HEARTS_FLAME_PERK_EFFECT: "#F Với Ân Huệ này, Garou có thể nhận diện các nguồn năng lượng hoặc sức mạnh, ngay cả khi chúng bị che giấu hoặc xa lạ.#!"
 FLAME_OF_THE_WIND_RIDER_PERK_EFFECT: "#F Ân Huệ này khiến Garou khó bị gây thương tổn hơn bằng cách bao phủ nàng trong một ngọn lửa trắng-xanh như ma quái.#!"
 RIDE_THE_SOLAR_WINDS_PERK_EFFECT: "#F Ân Huệ này cho phép Garou cưỡi những cơn gió mặt trời quét qua [UmbraGlossary('aetherial_realm')] mà không phải lo lắng bị bão tố đẩy lệch hướng.#!"
 HAND_OF_THE_SUN_PERK_EFFECT: "#F Bàn tay của Garou bùng lên một sức nóng khủng khiếp và tỏa ra ánh sáng trắng rực, tương tự như một thanh sắt nung.#!"
 CLEANSING_FLAME_PERK_EFFECT: "#F Garou có thể xác định chính xác một khu vực (hoặc một cá nhân) và thiêu đốt mục tiêu bằng ngọn lửa mãnh liệt và thanh tẩy. Lửa này có thể đốt sạch mọi vết nhiễm $glossary_wyrm$ hoặc ô nhiễm do con người gây ra khỏi một vùng đất, hoặc thanh tẩy một cá nhân (miễn là nạn nhân sống sót) khỏi vết nhiễm Wyrm.#!"
 SPEED_OF_THE_MESSENGER_PERK_EFFECT: "#F Ân Huệ này tăng tốc độ di chuyển của Garou để anh có thể vượt qua những quãng đường dài trong thời gian ngắn.#!"
 PLANETARYGIFTS_STICKY_FINGERS_PERK_EFFECT: "#F Thủ thuật này phủ lên các ngón tay của Garou một lớp chất bạc bám dính vào mọi thứ, giúp việc leo lên các bề mặt dựng đứng trở nên dễ dàng.#!"
 PLANETARYGIFTS_DELIBERATE_MISINFORMATION_PERK_EFFECT: "#F Garou có thể chèn thông tin gây rối và mâu thuẫn vào cuộc trò chuyện của mục tiêu, khiến kế hoạch của họ đổ vỡ hoặc khiến họ gặp phải sự cố nghiêm trọng trong giao tiếp.#!"
 MERCURIAL_MESSENGER_PERK_EFFECT: "#F Ân Huệ này cho phép một Garou nghe được một cuộc trò chuyện hoặc được giao phó một thông điệp có thể ghi nhớ chính xác những gì nàng đã nghe.    #!"
 MADTHOUGHT_PERK_EFFECT: "#F Garou có thể làm cho các tiến trình suy nghĩ của kẻ địch tăng tốc đến mức chúng thực sự suy nghĩ quá nhanh để có thể đưa bất kỳ kế hoạch nào vào hành động.#!"
 UNCLOAK_THE_HIDDEN_PERK_EFFECT: "#F Bằng cách tập trung vào một người, vật thể hoặc khu vực, Garou có thể xác định liệu mục tiêu của nàng có đang che giấu điều gì hay không.#!"
 SHADOW_OF_THE_EBON_WHISPERER_PERK_EFFECT: "#F Ân Huệ này khiến Garou trở nên mờ ảo như một bóng ma và khó bị nhìn thấy.#!"
 HIDDEN_HEART_PERK_EFFECT: "#F Ân Huệ này cho phép Garou lấy một mảnh tri thức nguy hiểm mà nàng sở hữu và cất giấu nó trong tâm trí để nó trở nên không thể tiếp cận nếu không có chìa khóa.#!"
 WHISPER_IN_THE_DARK_PERK_EFFECT: "Tốc Độ Tiến Triển [espionage|E]: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F Ân Huệ này cho phép Garou xác định một sự thật bất lợi đối với một cá nhân.#!"
 WHISPER_IN_THE_DARK_PERK_BONUS_VALUE: "[GetPerk('whisper_in_the_dark_perk').GetName(GetPlayer)]"
 PLANETARYGIFTS_EBON_BINDING_PERK_EFFECT: "Tốc Độ Tiến Triển [espionage|E]: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\nLà một [character_interaction|E], cho phép bạn ban tính trạng [GetModifier('ebon_binding_modifier').GetNameWithTooltip] cho một mục tiêu có [secrets|E] mà bạn biết.\n#F Ân Huệ này cho phép Garou lấy tri thức của nàng về lỗi lầm, tật xấu hoặc thói hư của ai đó và ràng buộc một hình phạt thích đáng lên người đó.#!"
 PLANETARYGIFTS_EBON_BINDING_PERK_BONUS_VALUE: "[GetPerk('planetarygifts_ebon_binding_perk').GetName(GetPlayer)]"
 FIND_THE_CHILD_WITHIN_PERK_EFFECT: "#F Với Ân Huệ này, một Garou có thể tác động vào phản ứng bản năng của một cá nhân đối với quyền uy hoặc sự yêu thương của cha mẹ, và thuyết phục người đó tuân theo một mệnh lệnh hoặc đáp lại thuận lợi trước một gợi ý mà họ lẽ ra sẽ từ chối.#!"
 MANTLE_OF_THE_LAND_PERK_EFFECT: "#F Garou rút ra một lớp sương mù từ hơi nước trong khí quyển.#!"
 VEIL_OF_THE_MOTHER_PERK_EFFECT: "#F Ân Huệ này cho phép Garou mang một hình dạng khác trong một thời gian ngắn để đánh lạc hướng kẻ truy đuổi hoặc thoát khỏi sự phát hiện.#!"
 MOTHERLY_GUARDIAN_PERK_EFFECT: "#F Ân Huệ này cho phép Garou “đánh dấu” một cá nhân để nàng có thể theo dõi sức khỏe và sự an toàn của mục tiêu.#!"
 BRING_FORTH_THE_FUTURE_PERK_EFFECT: "#F Ân Huệ này cho phép Garou khấn cầu Tambiyah để thay đổi một khía cạnh của tương lai của một cá nhân.#!"
 PLANETARYGIFTS_BATTLESENSE_PERK_EFFECT: "#F Garou có thể cảm nhận hướng tấn công tốt nhất, tính đến địa hình chiến trường, số lượng và vị trí của kẻ địch cùng các lực lượng sẵn có dưới quyền chỉ huy của Garou hoặc liên minh với nàng.#!"
 SHARDS_OF_ICY_RAGE_PERK_EFFECT: "#F Garou triệu hồi Ân Huệ này khấn cầu sức mạnh lạnh lẽo của Cuồng Nộ trong nàng, biến sự tức giận của nàng thành băng đá vật chất.#!"
 NERIGALS_CALL_TO_ARMS_PERK_EFFECT: "#F Ân Huệ này cho phép Garou triệu tập đến bên nàng bất kỳ sinh vật hay linh hồn nào liên minh với Nerigal hoặc phù hợp với Chiến Binh Băng Giá.#!"
 CHALLENGE_OF_SINGLE_COMBAT_PERK_EFFECT: "Cho phép bạn sử dụng thách đấu kẻ địch để giao chiến [character_interaction|E] ngay cả trong thời chiến.\n#F Bằng cách khấn cầu danh xưng của Chiến Binh Băng Giá và đưa ra một lời thách đấu trực tiếp với kẻ địch, Garou có thể buộc đối thủ của nàng phải giao chiến một chọi một theo các luật lệ ngầm của công bằng đấu trường.#!"
 HEART_OF_THE_ICE_WARRIOR_PERK_EFFECT: "#F Thường chỉ được sử dụng trong những tình huống nguy cấp nhất, Ân Huệ này khiến Garou miễn nhiễm với thương tổn đủ lâu để giáng đòn kết liễu lên đối thủ của nàng.#!"
 ROUSE_TO_ANGER_PERK_EFFECT: "#F Ân Huệ này cho phép Garou nói hoặc làm điều gì đó khiến mục tiêu của nàng khơi lại Cuồng Nộ nội tâm.#!"
 FOETRACKER_PERK_EFFECT: "#F Bằng cách sử dụng Ân Huệ này, Garou có thể theo dõi con mồi của mình mà không sợ mất dấu.#!"
 SAVAGERY_OF_THE_TALONED_HUNTER_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn tiêu một điểm $POD_energy_gnosis$ và ý chí để nhận hai điểm $POD_energy_gnosis$.\n#F Ân Huệ này cho phép một Garou nhận gấp đôi lợi thế từ Cuồng Nộ của anh, từ đó tăng tính hung hãn và mật độ các đòn tấn công, hoặc cho phép anh hoàn thành nhiều hơn dưới áp lực so với bình thường.#!"
 HUNTERS_HORN_PERK_EFFECT: "#F Ân Huệ này cho phép Garou tạo ra một âm thanh khủng khiếp và rợn người đến mức khiến kẻ địch rơi vào hoảng loạn tuyệt đối và bỏ chạy khỏi khu vực mà không quan tâm đến hướng đi hay đích đến.#!"
 PACK_MIND_PERK_EFFECT: "Ban tính trạng [GetModifier('pack_mind_modifier').GetNameWithTooltip] [modifier|E] cho [knights|E] của kẻ địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho kẻ địch của bạn trong [single_combat_duel_plural|E].\n#F Ân Huệ này buộc một nhóm kẻ địch hành xử như một bầy đàn có cùng một tâm trí.#!"
 AURA_OF_LEADERSHIP_PERK_EFFECT: "#F Ân Huệ này bao phủ Garou trong một luồng uy nghi quyền lực cho phép nàng đảm nhận vị thế lãnh đạo trong một khoảng thời gian ngắn.#!"
 PROCLAMATION_OF_ACTION_PERK_EFFECT: "#F Ân Huệ này cho phép Garou buộc chấm dứt tranh luận và thực hiện hướng hành động mà nhân vật cho là tốt nhất.#!"
 PLANETARYGIFTS_UNDISPUTED_RULER_PERK_EFFECT: "#F Ân Huệ này cho phép một Garou giành quyền lãnh đạo một nhóm nhỏ người hoặc một nhóm linh hồn.#!"
 ENTHRONEMENT_PERK_EFFECT: "#F Garou có thể tạo ra các vật thể nhỏ hoặc đơn giản từ không khí – bao gồm sương mù, mây hoặc gió.#!"
 GRAND_GESTURE_PERK_EFFECT: "#F Bằng cách trao những món quà thích đáng cho một cá nhân hoặc một nhóm, Garou nâng cao sự trọng vọng và danh tiếng của nàng trong mắt những người nhận được sự hào hiệp của nàng.#!"
 SENSE_LIMITS_PERK_EFFECT: "#F Garou có thể xác định gần chính xác lượng Cuồng Nộ, Gnosis hoặc Ý Chí bên trong một cá nhân.#!"
 PEACE_OF_THE_COUNSELOR_PERK_EFFECT: "Mở khóa [interaction|E] $purchase_truce_interaction$.\n#F Ân Huệ này cho phép một Garou đưa ngay cả cuộc tranh luận gay gắt nhất đến một kết thúc hòa bình.#!"
 PALL_OF_DESPAIR_PERK_EFFECT: "Khi một cuộc chiến bắt đầu, nhà vô địch có sức mạnh cao nhất của kẻ địch của bạn sẽ bị thương.\n#F Ân Huệ này giáng một làn sóng tuyệt vọng lên một cá nhân bị nhắm đến, khiến nạn nhân không thể hành động do cảm giác u sầu sâu sắc.#!"
 HARMONIOUS_SLUMBER_PERK_EFFECT: "#F Ân Huệ này cho phép Garou tạo ra một môi trường hoàn hảo cho giấc ngủ ngay cả trong những hoàn cảnh khó khăn nhất.#!"
 BURDEN_OF_KNOWLEDGE_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn khiến nạn nhân nhận [GetModifier('murderous_frenzy_modifier').GetNameWithTooltip], [GetModifier('change_for_better_modifier').GetNameWithTooltip] hoặc tự sát.\n#F Garou tràn ngập một cá nhân bằng tri thức về mọi hạn chế của bản thân nàng, khiến nạn nhân nhận thức được từng khiếm khuyết hay lỗi lầm và nhắc nhở nàng về mọi điều sai trái mà nàng đã gây ra hoặc phạm phải.#!"
 FIND_THE_PORTENT_PERK_EFFECT: "#F Với Ân Huệ này, một Garou có thể khấn cầu và nhận được một điềm báo hoặc dấu hiệu có thể giúp nàng xác định hướng hành động tiếp theo.#!"
 HIDDEN_DEPTHS_PERK_EFFECT: "#F Ân Huệ này cho phép một Garou phát hiện một mảnh thông tin ẩn giấu, hoặc giải mã một đoạn văn bản bí ẩn.#!"
 UNRAVEL_PERK_EFFECT: "#F Ân Huệ này cho phép Garou ghép các mảnh thông tin dường như ngẫu nhiên lại với nhau để hình thành một phân tích sơ bộ về một tình huống và xây dựng hướng hành động.#!"
 BLANK_SLATE_PERK_EFFECT: "#F Garou có thể xóa bỏ hoàn toàn một mảnh thông tin duy nhất khỏi tâm trí của chính nàng hoặc của người khác.#!"
 DIPLOMATIC_IMMUNITY_PERK_EFFECT: "#F Ân Huệ này cho phép Garou đi lại giữa một nhóm thù địch mà không khơi lên xung đột.#!"
 THREADS_OF_THE_TAPESTRY_PERK_EFFECT: "#F Ân Huệ này cho phép Garou xác định các yếu tố cơ bản của một tình huống có vẻ hỗn loạn hoặc bị che đậy có chủ đích.#!"
 FIXIT_PERK_EFFECT: "#F Garou có thể tìm ra vấn đề của một thiết bị và thực hiện sửa chữa ngay tại chỗ để cho phép vật đó hoạt động trong một thời gian ngắn.#!"
 TANGLING_THE_SKEIN_PERK_EFFECT: "#F Ân Huệ này cho phép Garou gây rối loạn giữa các kẻ địch của nàng bằng cách xáo trộn nhận thức của chúng để chúng không thể quyết định phải theo ai hoặc phải làm gì tiếp theo.#!"
 SHANTARS_LOOM_PERK_EFFECT: "Có thể tuyển mộ [GetMaA('golems').GetName] làm [men_at_arms|E].\n#F Việc sử dụng Ân Huệ này cho phép Garou chế tạo một vật phẩm từ năng lượng do Gnosis, Cuồng Nộ hoặc Ý Chí cung cấp.#!"
 DROWN_PERK_EFFECT: "#F Ân Huệ này khiến phổi của đối thủ tràn đầy chất lỏng. Nạn nhân phải nhận được sự trợ giúp y tế hoặc huyền thuật ngay lập tức, nếu không sẽ chết trong vòng vài phút.#!"
 SENSE_OF_THE_TRANSFORMATION_PERK_EFFECT: "Nếu bất kỳ người thân hoặc bạn bè nào của bạn bị sát hại trong những hoàn cảnh bí ẩn, bạn sẽ biết được kẻ sát nhân của họ.\n#F Với Ân Huệ này, Garou có thể nhận diện các trạng thái biến đổi hoặc những thay đổi quan trọng trong sinh vật hoặc vật thể.#!"
 SHORTEN_THE_ROAD_PERK_EFFECT: "#F Ân Huệ này cho phép Garou giảm một phần ba thời gian di chuyển thông thường, ngay cả trong [umbra|E].#!"
 WYLD_SPIRITS_PERK_EFFECT: "Ban tính trạng [GetModifier('erratic_behavior_modifier').GetNameWithTooltip] [modifier|E] cho [knights|E] của kẻ địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho kẻ địch của bạn trong [single_combat_duel_plural|E].\n#F Garou có thể khấn cầu bản chất bất định của Meros và khiến một hoặc nhiều đối thủ của nàng rơi vào một trận hành vi thất thường, từ đó khiến các nạn nhân khó phối hợp tấn công hoặc hành động hợp lý trong bất kỳ tình huống nào.#!"
 SLEEPS_TRAVELS_PERK_EFFECT: "#F Thông qua Ân Huệ này, linh hồn của một Garou có thể du hành đến một nơi khác trong khi thân xác anh đang say ngủ.#!"
 ESSENTIAL_TRANSFORMATION_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn tăng thương tổn để nhận $POD_energy_gnosis$.\n#F Ân Huệ này cho phép Garou chuyển đổi một phần bản chất của nàng thành Gnosis để sử dụng trong các tình huống đòi hỏi phải tiêu hao một lượng lớn sức mạnh tâm linh.#!"