l_english:


 urgetaints_lifestyle_name: "Vết Nhiễm Dục Vọng"
 urgetaints_lifestyle_desc: "Những ân huệ tối tăm này được các Wyrm Dục Vọng ban cho những kẻ tìm kiếm quyền lực, nhưng luôn có một cái giá phải trả."
 urgetaints_lifestyle_highlight_desc: "Nhờ [GetModifier('POD_gnosis_5_modifier').GetNameWithTooltip], bạn nhận thêm #P [GetPlayer.Custom('GetEducationLifestylePercentageBoost')]#! [experience|E] trong Lối sống này."
 monthly_urgetaints_lifestyle_xp_gain_mult: "[experience|E] [lifestyle|E] Vết Nhiễm Dục Vọng Hàng tháng"


 urgetaints_physical_visible: "Thể Chất"
 urgetaints_mental_visible: "Tâm Trí"

 URGETAINTS_REQ: "@warning_icon!#X [lifestyle_experience|E] Vết Nhiễm Dục Vọng có được bằng cách thám hiểm một số cõi giới trong [UmbraGlossary('malfeas')]#!"


 ###Physical
 malformed_flesh_perk_name: "Thịt Biến Dạng"
 MALFORMED_FLESH_PERK_EFFECT: "#flavor Thịt khô lại và cứng lại, tạo thành một lớp mai bảo vệ.#!"
 malformed_muscle_perk_name: "Cơ Biến Dạng"
 MALFORMED_MUSCLE_PERK_EFFECT: "#flavor Cơ bắp phát triển to lớn và mạnh mẽ không cân đối, cho phép thực hiện những kỳ công sức mạnh vĩ đại.#!"
 malformed_bone_perk_name: "Xương Biến Dạng"
 MALFORMED_BONE_PERK_EFFECT: "#flavor Xương phát triển chắc khỏe và cứng cáp, một sự thách thức trước sự tàn phá của thời gian.#!"
 bestial_limbs_perk_name: "Tứ Chi Dã Thú"
 BESTIAL_LIMBS_PERK_EFFECT: "Biến hình vào các hình dạng thú tự nhiên của một $glossary_fera$ không còn tốn $POD_energy_gnosis$ nữa.\n#flavor Ngay cả ở hình dạng Homid, tứ chi của bạn vẫn giữ vẻ ngoài dã thú, ít phải thay đổi hơn khi biến hình.#!"
 forked_tongue_perk_name: "Lưỡi Chẻ"
 FORKED_TONGUE_PERK_EFFECT: "Có thể học thêm #V 1#! [language|E] mà không bị phạt.\n#flavor Nơi một lời nói dối kết thúc và một lời khác bắt đầu, không ai có thể biết được.#!"
 reversed_eye_perk_name: "Mắt Đảo Ngược"
 REVERSED_EYE_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$\n#flavor Với một con mắt ở sau đầu, không gì có thể lén lút tiếp cận bạn thêm lần nữa.#!"
 bane_stomach_perk_name: "Dạ Dày Tà Linh"
 BANE_STOMACH_PERK_EFFECT: "Mở khóa [execution|E] Ăn Thịt Người.\nĂn thịt một nhân vật sẽ ban [trait_level_track_xp|E] cho tất cả [spirit_companions|E] Tà Linh của bạn.\n#flavor Bản chất của kẻ bị ăn sẽ nuôi dưỡng nhiều hơn là chỉ thân xác của riêng bạn.#!"
 BANE_STOMACH_REASON: ""$bane_stomach_perk_name$: $VALUE|+=0$""
 thundering_throat_perk_name: "Cổ Họng Sấm Rền"
 THUNDERING_THROAT_PERK_EFFECT: "Chấp nhận [court|E]: #P +10#!\nBan [GetModifier('wyrm_thundering_throat_modifier').GetNameWithTooltip] và #V 30#! [stress|E] cho [knights|E] và [commanders|E] của kẻ địch khi hành động như [commander|E] trong [combat_phase|E], hoặc cho đối thủ của bạn trong [single_combat_duel_plural|E] nếu họ bị bạn [intimidated|E].\n#flavor Với một giọng nói làm rung chuyển đất, lòng trung thành của bạn được nghe thấy.#!"
 THUNDERING_THROAT_INVITE: "[GetPerk('thundering_throat_perk').GetName(GetPlayer)]: $VALUE|=+0$"
 profaned_lungs_perk_name: "Phổi Ô Uế"
 PROFANED_LUNGS_PERK_EFFECT: "Tốc độ [journey|E] khi huấn luyện với [GetPlayer.Custom('PODCoterieNoTooltip')]: #P +25%#!\n#flavor Với không khí ùa vào bộ phổi vĩ đại của bạn, một sự bền bỉ hoàn hảo đạt được, nhưng không phải cho bạn.#!"
 unholy_heart_perk_name: "Tim Bất Khiết"
 UNHOLY_HEART_PERK_EFFECT: "Ô [POD_health_track|E]: #P +1#!\nGiảm thời gian chuyển đổi [POD_aggravated_damage|E] thành [POD_superficial_damage|E] đi #V 1#! năm.\n#flavor Một vật chứa khác bị Wyrm chiếm giữ.#!"

 ###Mental
 dominance_perk_name: "Áp Chế"
 DOMINANCE_PERK_EFFECT: "#flavor Cho họ thấy tại sao bạn tốt hơn.#!"
 indulgence_perk_name: "Chiều Dục"
 INDULGENCE_PERK_EFFECT: "#flavor Cứ làm đi, bạn đáng được như vậy.#!"
 obsession_perk_name: "Ám Ảnh"
 OBSESSION_PERK_EFFECT: "Mở khóa [scheme|E] [GetScheme('abduct').GetTypeName]\n#flavor Bạn phải có được nó, bất kể giá nào.#!"
 warped_reflection_perk_name: "Ảnh Phản Chiếu Lệch Lạc"
 WARPED_REFLECTION_PERK_EFFECT: "#flavor Hình ảnh phản chiếu của bạn trở nên khó nhìn thấy, nhưng bạn chắc rằng mình vẫn trông tuyệt vời như thường.#!"
 dancing_shadows_perk_name: "Vũ Điệu Bóng Tối"
 DANCING_SHADOWS_PERK_EFFECT: "[character_interaction|E]: Gây #V 1-3#! [POD_superficial_damage|E] cho một nhân vật.\n#flavor Đôi khi bóng của bạn rời bỏ bạn để tấn công kẻ thù, ít nhất đó là điều bạn nghĩ.#!"
 fragmented_psyche_perk_name: "Tâm Trí Phân Mảnh"
 FRAGMENTED_PSYCHE_PERK_EFFECT: "#flavor Với một tâm thức bị chia tách, bạn sẽ hiệu quả hơn nhiều trong việc đạt được mục tiêu của mình, tất nhiên là mục tiêu của riêng bạn.#!"
 splintered_soul_perk_name: "Linh Hồn Vỡ Vụn"
 SPLINTERED_SOUL_PERK_EFFECT: "[character_interaction|E]: Tạo một bản sao [ancestor_spirit|E] của chính bạn.\n#flavor Linh Hồn tự khoác lấy một hình dạng riêng, để phục vụ chủ nhân của nó tốt hơn.#!"
 maniacal_mind_perk_name: "Tâm Trí Cuồng Loạn"
 MANIACAL_MIND_PERK_EFFECT: "[character_interaction|E]: Tăng [opinion|E] của một nhân vật về bạn trong khi tăng [stress|E] của họ.\n$countermeasures_unlocks_t3_mental_fortress$\n#flavor Tâm Trí an toàn trong chính những ảo tưởng của nó, bị khóa kín khỏi thực tế.#!"
 sanguine_spirit_perk_name: "Linh Hồn Đỏ Thẫm"
 SANGUINE_SPIRIT_PERK_EFFECT: "Việc tiếp năng lượng cho Tà Linh giờ chỉ gây #V 1#! [POD_aggravated_damage|E] cho chính bạn.\nCó thể tuyển [GetMaA('nexus_crawlers').GetName] làm [men_at_arms|E].\n#flavor Linh Hồn phát sáng với ánh sáng đen tối, thu hút những linh hồn đồng điệu.#!"
 embrace_oblivion_perk_name: "Ôm Lấy Diệt Vong"
 EMBRACE_OBLIVION_PERK_EFFECT: "[character_interaction|E]: Khiến một $glossary_fera$ [wyrm_tainted|E] hoàn toàn sa ngã theo $glossary_wyrm$.\nMở khóa [lifestyle|E] [investiture_lifestyle|E].\n#flavor Một linh hồn khác bị Wyrm chiếm giữ.#!"
 #\nUnlocks a unique level 4 [mental_break|E]. TODO Wyrm: add this back in once the stress stuff is done









