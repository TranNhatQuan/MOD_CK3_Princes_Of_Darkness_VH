#Black Spiral Dancers

 toxic_claws_perk_name: "Vuốt Độc"
 TOXIC_CLAWS_PERK_EFFECT: "Tăng khả năng gây thương tích hoặc tàn tật cho [knights|E] kẻ địch khi đóng vai [knight|E] trong [combat_phase|E].\n#flavor Dancer có thể khiến chất thải độc hại rỉ ra từ móng vuốt của cô, phủ lên chúng một lớp nhớt xám xanh độc hại. Vết thương do những móng vuốt này gây ra thường để lại sẹo trông bệnh hoạn.#!"
 spiral_shadow_dance_perk_name: "Vũ Điệu Xoắn-Bóng"
 SPIRAL_SHADOW_DANCE_PERK_EFFECT: "#flavor Black Spiral Dancer học cách tự quấn mình xuyên qua bóng tối, trở nên nhanh nhẹn như một tiếng thét. Nhiều loại Tà Linh khác nhau truyền dạy Ân Huệ này.#!"
 terrify_perk_name: "Khủng Bố"
 TERRIFY_PERK_EFFECT: "#flavor Dancer sở hữu Ân Huệ này đáng sợ và khủng khiếp hơn bình thường. Một cái nhếch mép khinh bỉ từ cô cũng hiệu quả như một tiếng gầm gào toáng lên từ kẻ khác.#!"
 unseelie_faerie_kin_perk_name: "Huyết Thống Faerie Unseelie"
 UNSEELIE_FAERIE_KIN_PERK_EFFECT: "Mở khóa nhiều [POD_faerie_maa|E] [men_at_arms|E].\n#flavor Dancer có thể kêu gọi các changeling Unseelie đến trợ giúp mình.#!"
 burning_scars_perk_name: "Sẹo Bỏng"
 BURNING_SCARS_PERK_EFFECT: "[character_interaction|E]: Gây [POD_aggravated_damage|E] thiệt hại lửa cho một nhân vật cũng như cho chính bạn.\n#flavor Black Spiral Dancer thường khắc những vết sẹo cách điệu thể hiện lòng tận trung với Wyrm lên thân thể mình. Ân Huệ này khiến các vết sẹo của Dancer rực sáng với một ánh sáng tối tăm gần như bò vào cơ thể nạn nhân, đốt cháy anh ta từ trong ra ngoài và để lại những vết bỏng khủng khiếp mô phỏng lại chính vết sẹo của Dancer.#!"
 summon_wyrm_elemental_perk_name: "Triệu Hồi Elemental $glossary_wyrm$"
 SUMMON_WYRM_ELEMENTAL_PERK_EFFECT: "#flavor Dancer thực hiện một vũ điệu ngắn quanh một mảnh nguyên tố thuần khiết. Vũ điệu làm tha hóa nguyên tố đó và triệu hồi ra một Elemental $glossary_wyrm$.#!"

 the_white_howl_perk_name: "Tiếng Gào Trắng"
 THE_WHITE_HOWL_PERK_EFFECT: "Áp [GetModifier('the_white_howl_modifier_enemy').GetNameWithTooltip] cho [knights|E] kẻ địch và [GetModifier('the_white_howl_modifier_ally').GetNameWithTooltip] cho [knights|E] đồng minh khi đóng vai [commander|E] trong [combat_phase|E], hoặc cho đối thủ của bạn trong [single_combat_duel_plural|E].\n#flavor Từng là phước lành thiêng liêng nhất của White Howler, Ân Huệ hùng mạnh này vẫn được truyền lại trong hàng ngũ Black Spiral Dancer như một lời nhắc nhở về quá khứ đối với kẻ địch Garou của họ. Âm thanh của Tiếng Gào Trắng đủ mạnh để xé toạc cả những công trình của Wyrm, và đôi tai của những Garou nghe thấy nó và nhận ra Gaia đã mất đi bao nhiều.#!"
 totem_form_perk_name: "Hình Dạng Totem"
 TOTEM_FORM_PERK_EFFECT: "Mở khóa một dạng biến hình Hình Dạng Totem tương ứng với [pack_totem|E] của bạn.\n #flavor Ân Huệ mạnh mẽ này cho phép một Black Spiral mang lấy hình dáng - và phần lớn sức mạnh - của totem Tà Linh thuộc bầy của cô.#!"
 prelude_to_apocalypse_perk_name: "Khúc Dạo Đầu Tận Thế"
 PRELUDE_TO_APOCALYPSE_PERK_EFFECT: "Mở khóa Xé Toạc Gauntlet trong hành động [umbra|E] Thao Túng Gauntlet.\n#flavor Dancer có thể xé rách hàng thiên niên kỷ công trình của $glossary_weaver$ trong một khoảng thời gian ngắn. Ân Huệ này xé toạc hoàn toàn Gauntlet, hợp nhất thế giới của thịt xương và linh hồn như thời còn trong truyền thuyết. Hơn nữa, vùng đất được hợp nhất này hoạt động như một ngọn hải đăng sáng rực thu hút linh hồn Wyrm, kéo theo một làn sóng bane đến trợ giúp Dancer.#!"
 PRELUDE_TO_APOCALYPSE_REQUIREMENT: "@warning_icon!#X Bạn cần hoàn thành một nhiệm vụ từ một Maeljin Incarna (cắm một nhà thám hiểm tại [UmbraGlossary('black_spiral_labyrinth')] và bắt đầu một [umbra_expedition|E] để đến đó rồi nhận nhiệm vụ) để mở khóa perk này.#!"


#Hakken
 dream_of_a_thousand_cranes_perk_name: "Mộng Ngàn Sếu"
 DREAM_OF_A_THOUSAND_CRANES_PERK_EFFECT: "#flavor Ân Huệ này ban cho người sử dụng may mắn trong một khoảng thời gian ngắn.#!"
 fair_path_perk_name: "Con Đường Ngay Chính"
 FAIR_PATH_PERK_EFFECT: "#flavor Xuất hiện trước thị tộc mình tại buổi họp hay trong nghi lễ với vẻ ngoài xộc xệch hay chưa tịnh hóa bị coi là vô cùng thất lễ. Ân Huệ này cho phép một Hakken xuất hiện với vẻ ngoài chải chuốt và ăn mặc hoàn hảo.#!"
 storm_winds_slash_perk_name: "Chém Gió Bão"
 STORM_WINDS_SLASH_PERK_EFFECT: "[character_interaction|E]: Gây [POD_superficial_damage|E] cho một nhân vật, mức độ tùy theo [rarity|E] của thanh katana bạn đang trang bị.\n#flavor Khi Hakken vươn tay chém bằng thanh katana của mình từ xa, một vết thương thực sự xuất hiện trên đối thủ, phản chiếu lại đường chém của Garou.#!"
 dark_of_night_perk_name: "Màn Đêm Tối"
 DARK_OF_NIGHT_PERK_EFFECT: "[character_interaction|E]: Gây [GetModifier('dark_of_night_perk_modifier').GetNameWithTooltip] cho một nhân vật.\n#flavor Gây mù tạm thời cho nạn nhân được chọn; họ không thể thấy gì ngoài một màn đen như mực. Sử dụng Ân Huệ này trong một cuộc đấu tay đôi chính thức bị coi là một sự xúc phạm nghiêm trọng.#!"
 living_treasure_perk_name: "Báu Vật Sống"
 LIVING_TREASURE_PERK_EFFECT: "Chi Phí [buy_claim_interaction|E] và [buy_artifact_claim_interaction|E]: #P -25%#!\n#flavor Hakken trân trọng các món đồ nghệ thuật cổ xưa và thường có những vật phẩm như vậy trong nhà mình. Ân Huệ này khiến linh hồn của các vật phẩm cất lời và kể lại câu chuyện của chúng.#!"
 divine_wind_perk_name: "Cuồng Phong Thần Thánh"
 DIVINE_WIND_PERK_EFFECT: "Mở khóa lựa chọn Weather Magic: #V Bão Tố#! ở cấp [duchy|E].\n#flavor Hakken triệu hồi một cơn bão khủng khiếp lên một vùng mục tiêu.#!"