 RENEW_THE_CYCLE_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn khiến kẻ chết-sống mục tiêu trở về trạng thái tự nhiên của nó (biến thành cát bụi hoặc đơn giản là mất khả năng cử động).\n#F Một trong những quyền năng mạnh mẽ nhất mà Garou có được, Ân Huệ này cho phép sửa chữa một sai lầm nghiêm trọng đối với vòng tuần hoàn tự nhiên của Gaia. Kẻ chết-sống, mà chính sự tồn tại của chúng đã là một sự sỉ nhục đối với trật tự tự nhiên của muôn vật, sẽ khô héo và vỡ tan thành cát bụi khi bị quyền năng của Ân Huệ này đánh trúng. Bất kể kẻ chết-sống đó là một xác chết lảo đảo mới hoạt động được một tháng hay một ma cà rồng cổ xưa, Fang đều có thể tiêu diệt nó chỉ bằng một cái nhìn.#!"
 RENEW_THE_CYCLE_REQUIREMENT: "@warning_icon!#X Bạn cần hoàn thành một nhiệm vụ từ chính Avatar của Gaia (cắm một nhà thám hiểm tại bất kỳ vương quốc nào của [umbra|E] để tìm ra đầu mối về địa điểm và bắt đầu một [umbra_expedition|E] để đến đó rồi nhận nhiệm vụ) để mở khóa perk này.#!"

