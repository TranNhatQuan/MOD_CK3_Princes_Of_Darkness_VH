 CALL_GREAT_FENRIS_PERK_EFFECT: "Cho phép bạn tuyển [GetMaA('war_avatar_of_great_fenris').GetName] làm [men_at_arms|E].\n#F Như biểu hiện tối cao của khế ước giữa bộ tộc và totem, những anh hùng vĩ đại nhất của Get có thể triệu hồi hóa thân chiến tranh của totem bộ tộc mình để trợ giúp trong giờ khắc nguy nan. Hóa thân này tham chiến, tàn sát tất cả những ai không phải Get of Fenris hay không được họ bảo hộ. Tuy nhiên, Đại Fenris đòi một sự hiến tế cho sự can thiệp của mình — thường là bàn tay trái của người triệu hồi. Người ta nói rằng nếu hóa thân chiến tranh bị gọi ra mà không có lý do chính đáng, nó sẽ nuốt chửng toàn bộ người triệu hồi trước khi rời đi.#!"
 CALL_GREAT_FENRIS_REQUIREMENT: "@warning_icon!#X Bạn cần hoàn thành một nhiệm vụ từ chính Đại Fenris (cắm một nhà thám hiểm tại bất kỳ vương quốc [umbra|E] để tìm ra đầu mối về địa điểm và bắt đầu một [umbra_expedition|E] để đến đó rồi nhận nhiệm vụ) để mở khóa perk này.#!"

