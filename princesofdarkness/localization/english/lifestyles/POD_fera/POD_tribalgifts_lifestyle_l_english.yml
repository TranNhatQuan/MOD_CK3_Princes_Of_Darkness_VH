 MERCIFUL_BLOW_PERK_EFFECT: "Nhiều khả năng hơn để [imprison|E] [characters|E] sau một [siege|E] hoặc [raid|E] thành công."
 LIBERATION_OF_FLESH_PERK_EFFECT: "Mở khóa lựa chọn biến hình [GetModifier( 'POD_shapeshift_form_incorporeal_modifier' ).GetNameWithTooltip|L]."
 THOUGHT_FORM_OF_THE_TWELVE_MINISTERS_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn nhận [GetModifier( 'POD_thought_form_of_the_twelve_ministers_modifier' ).GetNameWithTooltip|L]\n#F Câu chú được tụng cho Ân Huệ này là Aum-ka-la-rim-sa-ka-la-rim-ha-ka-la-rim. Ân Huệ này cho phép một Stargazer đạt được sự cân bằng tâm linh thực sự trong một khoảnh khắc duy nhất. Trong khoảnh khắc đó, mọi dục vọng cực đoan và cảm xúc bất tịnh đều bị thổi bay bởi một luồng năng lượng thuần khiết của Bản Ngã. Một tiếng lách tách năng lượng kinh ngạc lan như tia chớp đến từng điểm chakra của Stargazer. Nó chỉ kéo dài một giây, rồi biến mất. Nhưng để lại dấu tích, Stargazer được ban sức mạnh và rực cháy với một vòng hào quang xanh nhạt. Chỉ có một số ít Stargazer từng đủ xứng đáng để học Ân Huệ này, và nó chỉ có thể được truyền dạy bởi một avatar của Chimera.#!"
 THOUGHT_FORM_OF_THE_TWELVE_MINISTERS_REQUIREMENT: "@warning_icon!#X Bạn cần hoàn thành một nhiệm vụ từ Avatar của Chimera (cắm một nhà thám hiểm tại bất kỳ vương quốc nào của [umbra|E] để tìm ra đầu mối về địa điểm và bắt đầu một [umbra_expedition|E] để đến đó rồi nhận nhiệm vụ) để mở khóa perk này.#!"

