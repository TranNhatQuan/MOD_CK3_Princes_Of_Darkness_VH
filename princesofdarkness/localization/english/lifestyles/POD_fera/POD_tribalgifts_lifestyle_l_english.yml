 SLEEP_OF_THE_HERO_PERK_EFFECT: "Bạn sẽ nhận [GetTrait('torpor').GetName( GetPlayer )] và bị lật đổ nếu chết vì nguyên nhân phi tự nhiên.\n#F Ân Huệ mạnh mẽ này đã được viện đến nhiều lần trong lịch sử Fianna. Khi một anh hùng vĩ đại tử trận, người Fianna mang xác anh ta hiến cho đất mẹ. Ân Huệ này tạo nên mối liên kết giữa người Fianna, đất mẹ và linh hồn của anh hùng. Sinh mệnh của người chiến binh trở lại, nhưng anh ta vẫn chìm trong giấc ngủ sâu, không thức tỉnh cho đến ngày Tận Thế. Mục tiêu phải được đặt ở một nơi trong lòng đất, như hang động, hoặc trong một gò chôn cất. Trong giấc ngủ này, người anh hùng không bị ảnh hưởng bởi thời tiết và không cần hít thở.#!"
 SLEEP_OF_THE_HERO_REQUIREMENT: "@warning_icon!#X Bạn cần hoàn thành một nhiệm vụ từ các linh hồn tổ tiên Fianna (cắm một nhà thám hiểm tại bất kỳ vương quốc nào của [umbra|E] để tìm ra đầu mối về địa điểm và bắt đầu một [umbra_expedition|E] để đến đó rồi nhận nhiệm vụ) để mở khóa perk này.#!"

