 HOME_IN_ALL_LANDS_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn dịch chuyển quân đội của mình đến vị trí mục tiêu, hoặc dịch chuyển đến điểm đến kế tiếp khi đang di chuyển. Hành động này bỏ qua tầm ngoại giao, nhưng tỉnh mục tiêu cần có [development|E] thấp.\n#F Truyền thuyết trong Red Talon kể rằng những con sói có liên kết mạnh nhất với Sói Thủy Tổ không bị ràng buộc bởi khoảng cách, mà thực tế có thể xuất hiện ở bất cứ nơi nào có sói. Điều này từ lâu chỉ được coi là truyền thuyết, nhưng thực chất một trưởng lão Red Talon với dòng dõi đủ mạnh có thể học được cách biến mất từ một địa điểm và xuất hiện ở bất cứ nơi nào khác trong Vương Quốc hay [umbra|E], miễn là Thủy Tổ đã từng đến đó trước anh ta.#!"
