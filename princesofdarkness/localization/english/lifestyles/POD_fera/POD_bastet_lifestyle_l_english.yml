 RHINOS_FAVOR_PERK_EFFECT: "#flavor Bằng cách gọi về linh hồn tê giác, Khan có thể mọc một chiếc sừng trên đầu. Dù không đẹp mắt, chỗ nhô ra này lại là một vũ khí tuyệt vời. #!"
 SKIN_OF_JADE_PERK_EFFECT: "#flavor Dùng ý chí làm cứng bản thân, da của Khan đạt được độ cứng như bích ngọc.#!"
 RICEPAPER_WALK_PERK_EFFECT: "#flavor Bằng cách điều hòa năng lượng nội tại, Khan có thể bước qua một bề mặt nhẹ hoặc mong manh mà không làm nó xáo động, bất kể nó mang hình dạng nào. #!"
 MAKERS_CHARM_PERK_EFFECT: "Việc tài trợ cảm hứng cho các bảo vật hoặc đặt làm một bảo vật giờ ít tốn kém hơn.\n#flavor Bastet có thể tạo hình vật chất từng sống (nhưng không phải bất tử!) thành nhiều loại vật thể ngay lập tức. Cây cối có thể trở thành nơi trú ẩn, gạc hươu trở thành giáo mác, da thú trở thành áo giáp, và hoa trở thành nước hoa.#!"
 DRAGONROAR_PERK_EFFECT: "#flavor Gầm lên như sấm sét, Khan phun một quả cầu lửa vào kẻ địch. #!"
 THOUSAND_THUNDER_STRIKE_PERK_EFFECT: "#flavor Bằng cách đập hai chân trước lại với nhau và triệu hồi Rahjah hoặc một trong các hiện thân của thần (Shiva, Pan Cổ, v.v.), một con hổ giận dữ tạo ra một chấn động có thể làm sập nhà cửa hoặc phá vỡ các linh hồn ô uế. Vua Của Loài Mèo, trong những hình dạng cao quý hơn của mình, dạy Ân Huệ này cho những Khan xứng đáng. #!"
 PAWS_OF_THE_RAGING_SPIRIT_TIGER_PERK_EFFECT: "#flavor Bằng cách dẫn khí qua Ân Huệ này, Khan bao bọc móng vuốt hay tay mình trong luồng năng lượng linh hồn lấp lánh. Được tăng cường như vậy, weretiger có thể xé toạc kẻ địch trong [spirit_world|E] mà không cần bước sang ngang, miễn là hắn có thể nhìn thấy chúng. #!"
 CALL_TO_BATTLE_PERK_EFFECT: "Trao cho [knights|E] đồng minh khi hành động như một [commander|E] trong [combat_phase|E] hoặc cho chính bạn trong [single_combat_duel_plural|E] [GetModifier('call_to_battle_perk_modifier').GetNameWithTooltip].\n#flavor Khan với Ân Huệ này có thể dẫn đàn của mình đến tận cổng Địa Ngục nếu đó là điều cần thiết.#!"

