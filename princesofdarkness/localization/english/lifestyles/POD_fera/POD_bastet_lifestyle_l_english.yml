 chariot_of_lions_perk_name: "Cỗ Xe Của Sư Tử"
 the_madness_of_crowds_perk_name: "Sự Cuồng Loạn Của Đám Đông"

 SATYRS_WISDOM_PERK_EFFECT: "#flavor Ceilican có thể chơi bất kỳ nhạc cụ nào như thể đã được nuôi dạy với nó trong tay. #!"
 BANISH_BURNING_PERK_EFFECT: "#flavor Từ khi con người thuần hóa lửa để giữ ấm và xua đuổi thú dữ, họ đã có giao ước cổ xưa với các linh hồn lửa. Các linh hồn ngọn lửa đồng ý kiềm chế sự khát khao của mình khi Bastet chạm vào chúng.#!"
 PHANTASM_PERK_EFFECT: "#flavor Bastet tạo ra một ảo ảnh bất động chứa các yếu tố thị giác, thính giác, khứu giác và cả xúc giác. Một linh hồn hạt giống — cái gọi là "linh hồn của các linh hồn" — dạy ân huệ này.#!"
 CHARIOT_OF_LIONS_PERK_EFFECT: "#flavor Ân Huệ kém tinh tế này cho phép một Ceilican triệu ra một cỗ xe do những con mèo khổng lồ kéo. Giống như tác phẩm của nữ thần Freyja, cỗ xe này được làm từ gỗ đẽo thô và phủ các hoa văn Bắc Âu. Hai con mèo khổng lồ kéo xe chạy nhanh như một chiếc xe hơi trung bình, và trong tình huống cấp bách, có thể mang Ceilican và một hành khách lên không trong vài khoảnh khắc. Chỉ có Nữ Chủ Của Giống Mèo mới dạy Ân Huệ này; học nó mà không có phước lành của bà là một sự sỉ nhục nghiêm trọng.#!"
 MOTHERS_BLESSING_CURSE_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn trao [GetModifier( 'mothers_blessing_perk_modifier' ).GetNameWithTooltip|L] hoặc [GetModifier( 'mothers_curse_perk_modifier' ).GetNameWithTooltip|L] cho một mục tiêu đang mang thai.\n#flavor Dân gian tin rằng một con mèo có khả năng ban phước hoặc nguyền rủa một phụ nữ mang thai. Trong trường hợp của Ceilican, truyền thuyết này là sự thật. Một Bastet tốt bụng có thể ban cho người mẹ một điều tốt lành, còn một Bastet hiểm độc có thể làm hại nàng theo một cách nhỏ nhưng khó quên. #!"
 SORCERERS_BLADE_PERK_EFFECT: "$unlock_enhancing_node$ [GetModifier('sorcerers_blade_modifier').GetNameWithTooltip]\n#flavor Werecat có thể phù chú một vũ khí có cạnh sắc để nó trở nên mạnh mẽ một cách siêu nhiên.#!"
 SMALL_COUSIN_PERK_EFFECT: "Mở khóa tùy chọn biến hình [GetModifier( 'POD_shapeshift_form_cat_modifier' ).GetNameWithTooltip|L].\n#flavor Ceilican có được khả năng biến hình thành một con mèo nhà. Dù không hữu ích lắm về mặt thể chất, dạng này rất kín đáo. #!"
 THE_MADNESS_OF_CROWDS_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn khởi động một [GetModifier( 'lunatic_summon_modifier' ).GetNameWithTooltip|L].\nCó thể tuyển mộ [GetMaA('maniacs').GetName] làm [men_at_arms|E].\n#flavor Ân Huệ này triệu hồi một đám linh hồn hiểm ác để kích động cư dân của một thành phố nổi loạn hỗn loạn. Ân Huệ này khai thác sự thù hận và sợ hãi của những kẻ khốn cùng trong thành phố: người vô gia cư, người nghèo và cả những con vật hoang.#!"