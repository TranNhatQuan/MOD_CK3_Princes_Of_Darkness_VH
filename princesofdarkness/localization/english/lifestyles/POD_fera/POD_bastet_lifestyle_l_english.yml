 BASTET_MAJESTY_PERK_EFFECT: "#flavor Ân Huệ này cho phép Simba chỉ huy sự tôn trọng của người khác. Một linh hồn cá mập dạy nó. #!"
 SUBMIT_PERK_EFFECT: "#flavor Bằng cách chỉ một ngón tay hoặc vuốt vào mục tiêu, một Simba có thể buộc hắn quỳ gối. Chỉ những kẻ có ý chí mạnh nhất mới có thể làm gì khác ngoài gắng sức và chửi rủa đáp lại. Ân Huệ này được dạy bởi một trong những con của Pegasus. #!"
 RALLYING_CHALLENGE_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn tạm thời tăng một thuộc tính.\n#flavor Bằng cách gửi năng lượng nội tại ra bên ngoài, một Simba có thể hiệu triệu bản thân để hoàn thành những điều thường nằm ngoài khả năng. Với một tiếng thét vang dội, nàng nâng sức mạnh thể chất hoặc uy lực cá nhân lên tầm cao bất thường. #!"
 FIREROAR_PERK_EFFECT: "#flavor Gầm lên như sấm sét, Simba phun một quả cầu lửa vào kẻ địch. Hơi thở bùng cháy này tiếp tục thiêu đốt cho đến khi nó hoặc mục tiêu của nó bị tiêu hủy. #!"
 SHADOW_THE_MOONS_LIGHT_PERK_EFFECT: "#flavor Có một thời điểm cho mọi thứ, ngay cả cho sự ẩn mình. Là những kẻ săn mồi về đêm, các vua mèo đã hoàn thiện một bí quyết cho phép chúng làm mờ ánh sáng khi tiếp cận. Dù không thể thực sự dập tắt vầng trăng, Ân Huệ này chế ngự ánh sáng tự nhiên, huyền thuật và nhân tạo đều tốt như nhau. #!"
 COMMAND_THE_MULTITUDE_PERK_EFFECT: "#flavor Giống như Ân Huệ Cấp Một: Khuất Phục, ngoại trừ việc nó ảnh hưởng đến mọi người trong bán kính 200 foot và cần Gnosis. #!"
 KING_OF_BEASTS_PERK_EFFECT: "#flavor Uy quyền của Simba còn mở rộng đến cả cõi thú vật, đến mức hắn có thể chỉ huy sự trung thành của mọi loài động vật trong phạm vi 300 foot. Nếu thành công, những con vật ấy tuân theo lệnh của hắn một cách tự nguyện và vô điều kiện. A#!"
 RISING_SUN_PERK_EFFECT: "Gây thương tích cho [knights|E] và [commanders|E] địch khi hành động như một [commander|E] trong [combat_phase|E], hoặc cho đối thủ của bạn trong [single_combat_duel_plural|E], nếu chúng là ma cà rồng (hoặc các sinh vật siêu nhiên khác sợ ánh sáng mặt trời).\n#flavor Có lời truyền rằng con sư tử mang ánh dương trong tim; câu nói này có thể chứa nhiều sự thật hơn là chất thơ. Một số Simba mạnh mẽ có thể khiến vùng đất xung quanh họ rực sáng dưới ánh dương, ngay cả vào ban đêm.#!"
 ROYAL_PRIVILEGE_PERK_EFFECT: "Cho phép chọn lối sống Ân Huệ của một chủng và bộ tộc khác mà không cần [trait|E] chủng hay [faith|E] tương ứng.\n#F Mưu kế bị khinh ghét sâu sắc này cho phép một con sư tử cổ xưa và quyền năng đánh cắp Ân Huệ của một werecat khác, ngay cả những Ân Huệ theo truyền thống chỉ thuộc về bộ tộc hay chủng đó. Dù có thể có những Bastet biết Ân Huệ này, họ không có nhiều bạn bè.#!"
 ROYAL_PRIVILEGE_REQUIREMENT: "@warning_icon!#X Bạn cần hoàn thành một nhiệm vụ từ Kẻ Hủy Diệt (bố trí một nhà thám hiểm ở bất kỳ cõi giới nào của [umbra|E] để tìm ra manh mối về vị trí rồi bắt đầu một [umbra_expedition|E] để đến gặp họ và sau đó nhận nhiệm vụ) để mở khóa perk này.#!"

