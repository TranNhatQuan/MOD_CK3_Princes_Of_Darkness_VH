 humbabas_escape_perk_name: "Cuộc Trốn Chạy Của Humbaba"
 treeclimber_perk_name: "Kẻ Trèo Cây"
 ojas_surge_perk_name: "Dòng Ojas Trào Dâng"
 cobras_dance_perk_name: "Vũ Điệu Rắn Hổ Mang"
 travelers_tongues_perk_name: "Lưỡi Của Người Du Hành"
 the_paradox_of_time_perk_name: "Nghịch Lý Của Thời Gian"
 shivas_might_perk_name: "Sức Mạnh Của Shiva"
 part_the_curtain_perk_name: "Vạch Màn Che"

 TREECLIMBER_PERK_EFFECT: "#flavor Bằng cách vươn dài và mài sắc vuốt, rồi triệu hồi Ân Huệ này, một Bastet có thể di chuyển lên hoặc xuống bất kỳ bề mặt thẳng đứng nào, từ vỏ cây đến bê tông. Báo hoa mai vượt trội trong việc trèo leo, và hầu hết kuasha dạy bí quyết này đầu tiên. #!"
 TRAVELERS_TONGUES_PERK_EFFECT: "#flavor Bằng cách vận dụng quyền năng của Rahjah, một Bastet có thể dịch mọi ngôn ngữ loài người trong khu vực xung quanh nàng. Triệu hồi Kẻ Hủy Diệt sẽ biến mọi thứ thành lời vô nghĩa.#!"
 PART_THE_CURTAIN_PERK_EFFECT: "#flavor Giống như Ân Huệ Chung Cấp Bốn: Bước Giữa Các Thế Giới, phép thuật này cho phép một báo hoa mai vượt vào Cận Umbra. Tuy nhiên, biến thể này còn cho phép nàng đưa người khác vượt qua cùng.#!"
 HUMBABAS_ESCAPE_PERK_EFFECT: "Bạn không còn có thể bị giam giữ trong lúc [siege|E] hoặc [raid|E] nữa.\n#flavor Ân Huệ này cho phép một wereleopard trật khớp các chi và chui qua những khe hở nhỏ. #!"
 OJAS_SURGE_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn tạm thời tăng một thuộc tính.\n#flavor Bằng cách khai thông năng lượng tinh thần trong chính mình, Bagheera có thể nâng cao khả năng thể chất và nhận thức của mình lên mức không thể tưởng.#!"
 COBRAS_DANCE_PERK_EFFECT: "Nhiều khả năng [imprison|E] [characters|E] hơn sau một [siege|E] hoặc [raid|E] thành công.\n#flavor Từ lâu, một con báo tên Tola đã bước vào cuộc đàm phán với Vua Rắn. Sau nhiều tuần thảo luận và tranh biện, hai bên đã đạt được một sự hiểu biết nào đó. Không ai biết Tola đã trao cho Vua Rắn những bí mật gì, nhưng nó đã học được Ân Huệ này như một phần của cuộc trao đổi. Vũ Điệu cho phép một con mèo làm con mồi đông cứng chỉ bằng một cái nhìn. #!"
 THE_PARADOX_OF_TIME_PERK_EFFECT: "Trao [GetModifier('the_paradox_of_time_perk_modifier').GetNameWithTooltip] [modifier|E] cho [knights|E] địch khi hành động như một [commander|E] trong [combat_phase|E], hoặc cho đối thủ của bạn trong [single_combat_duel_plural|E].\n#flavor Werecat cho mục tiêu thấy một cảnh tượng chóng mặt và phi tuyến tính về dòng chảy bao la của thời gian, gây ra cảm giác buồn nôn và hoang mang hơn là khai sáng. #!"
 SHIVAS_MIGHT_PERK_EFFECT: "Mở khóa tùy chọn biến hình [GetModifier( 'POD_shapeshift_form_shiva_modifier' ).GetNameWithTooltip|L] hoặc [GetModifier( 'POD_shapeshift_form_kali_modifier' ).GetNameWithTooltip|L].\n#flavor Những wereleopard hùng mạnh nhất có thể biến thành một dạng Juddho gợi nhớ đến Shiva Đấng Hủy Diệt. Trong một luồng ánh sáng thần thánh, Bastet trở thành một werecat dạng Crinos cao 12 feet, sáu tay, mang vũ khí rực lửa huyền bí, tàn phá mọi thứ xung quanh cho đến khi không còn gì cử động. #!"

 alms_to_the_poor_perk_name: "Bố Thí Cho Người Nghèo"
 scholars_friend_perk_name: "Bạn Của Học Giả"
 mousemaze_perk_name: "Mê Cung Chuột"
 banish_cahlashs_brood_perk_name: "Trục Xuất Bầy Đàn Của [Glossary('Cahlash', 'glossary_wyrm_tt')]"
 the_many_tongues_of_ptah_perk_name: "Ngàn Lưỡi Của Ptah"
 the_scarabs_flight_perk_name: "Chuyến Bay Của Bọ Hung"
 shadow_brethren_perk_name: "Anh Em Bóng Tối"
 spirit_wall_perk_name: "Tường Linh Hồn"
 the_fleeing_scarab_perk_name: "Bọ Hung Đào Thoát"

 ALMS_TO_THE_POOR_PERK_EFFECT: "#flavor Werecat có thể triệu ra một chút tiền hoặc thức ăn, thường để cho một người ăn xin. Nếu con mèo dùng "của bố thí" ấy cho chính mình, nó sẽ cảm nhận vị đắng trong miệng và lòng bàn tay nhớp nháp.#!"
 SCHOLARS_FRIEND_PERK_EFFECT: "#flavor Bubasti có thể đọc bất kỳ cuộn giấy, tấm bảng hay cuốn sách nào đặt trước mặt, bất kể nó viết bằng ngôn ngữ gì. Các thông điệp mã hóa vẫn giữ nguyên dưới dạng mã. #!"
 BANISH_CAHLASHS_BROOD_PERK_EFFECT: "#flavor Bằng cách kêu gọi Cha của các Linh Hồn Hắc Ám, một Bubasti có thể ra lệnh cho các linh hồn thuộc Wyrm rút lui. Mỗi lần Bubasti làm vậy, lông của nó lại sẫm màu thêm và hành vi trở nên… bất thường hơn. Cảm Nhận $glossary_wyrm$ sẽ phát hiện một dấu vết mờ nhạt của sự nhiễm Wyrm trên Bastet trong một tuần sau đó. #!"
 THE_MANY_TONGUES_OF_PTAH_PERK_EFFECT: "#flavor Ân Huệ này cho phép các chiến binh của Gaia đọc và vận dụng linh hồn của lời nói, bỏ qua nhu cầu học các ngôn ngữ và phương ngữ khác nhau.#!"
 THE_SCARABS_FLIGHT_PERK_EFFECT: "#flavor Bằng cách gom lại các thành phần của linh hồn mình, một Bubasti có thể gửi chúng ra khỏi cơ thể trong một khoảng thời gian. Cơ thể ấy rơi vào trạng thái mê man như đã chết cho đến khi Bọ Hung trở về; dù nó không phân hủy, mọi dấu hiệu khác (huyền thuật và bình thường) đều cho thấy con mèo đã chết. Con Bọ Hung bay trông giống một loài côn trùng bình thường trừ khi bị xem xét bằng giác quan huyền thuật, khi đó nó phát sáng rực rỡ.#!"
 SHADOW_BRETHREN_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn tạo ra một bản sao của chính mình.\n#flavor Bubasti triệu hồi những bản sao mờ ảo của chính mình để đứng bên cạnh trong trận chiến. Những con mèo bóng tối này giống Bubasti và có một số khả năng tương tự. Một linh hồn đêm dạy Ân Huệ này.#!"
 SPIRIT_WALL_PERK_EFFECT: "#flavor Một trong những mánh khóe vĩ đại nhất mà một Bubasti học được là nghệ thuật gọi các linh hồn nhỏ từ khu vực xung quanh và tạo thành một bức tường Umbra than khóc. Loại huyền thuật này không khiến một con mèo được các linh hồn nói chung yêu thích, nhưng đến lúc đạt được Cấp Bậc này, một Bubasti nên có đủ hiểu biết để dùng quyền năng đó một cách khôn ngoan — và đủ sức mạnh để bảo vệ chính mình bất cứ khi nào sử dụng nó.#!"
 MOUSEMAZE_PERK_EFFECT: "Trao [GetModifier('mousemaze_perk_modifier').GetNameWithTooltip] [modifier|E] cho [knights|E] địch khi hành động như một [commander|E] trong [combat_phase|E], hoặc cho đối thủ của bạn trong [single_combat_duel_plural|E].\n#flavor Một phép thuật gây hoang mang đáng lo ngại, Ân Huệ này khiến mục tiêu mất phương hướng đến mức va vấp trong hoảng loạn. Các tường vách xoay chuyển và khép lại, bóng tối kéo dài, âm thanh dội đến tai từ mọi phía, và những nơi quen thuộc trở nên xa lạ và đáng sợ. Dù phép thuật không có tác động thực sự nào lên môi trường xung quanh người đó, nỗi kinh hoàng và hoang mang của anh ta đẩy anh vào cơn cuồng loạn, khiến anh trở thành mục tiêu dễ dàng cho werecat đang ẩn nấp gần đó.#!"
 THE_FLEEING_SCARAB_PERK_EFFECT: "Cho phép phục sinh nếu bạn chết vì nguyên nhân siêu nhiên.\n#F Một trong những bí mật bộ tộc bí hiểm nhất của Bubasti, Ân Huệ này cho phép một con mèo tách linh hồn ra, nhập thể nó, và đưa nó ra khỏi nguy hiểm trong khi thân xác chết đi. Linh hồn ấy, thường mang hình dạng một con bọ hung biết bay, tìm kiếm một cơ thể chủ mới thích hợp, chui vào miệng nó khi đang ngủ, và "gửi" linh hồn cũ vào cơ thể chủ mới. Bubasti nào biết bí mật cấm kỵ này (và có ít hơn tám con mèo như vậy tồn tại) về lý thuyết là bất tử, dù sự trường tồn đó phải trả giá bằng sinh mạng của những sinh vật khác.#!"
 THE_FLEEING_SCARAB_REQUIREMENT: "@warning_icon!#X Bạn cần hoàn thành một nhiệm vụ từ Whispers (bố trí một nhà thám hiểm ở bất kỳ cõi giới nào của [umbra|E] để tìm ra manh mối về vị trí và bắt đầu một [umbra_expedition|E] để đến gặp họ và nhận nhiệm vụ) để mở khóa perk này.#!"

 rhinos_favor_perk_name: "Sự Ưu Ái Của Tê Giác"
