l_english:

 tribalgifts_bastet_focus: "Trọng Tâm Ân Huệ Bộ Tộc"
 tribalgifts_bastet_focus_modifier: "[GetFocus('tribalgifts_bastet_focus').GetName]"
 tribalgifts_bastet_focus_desc: "Ân Huệ Bộ Tộc của Bastet."
 tribalgifts_bastet_focus_effect_desc: "Tập trung vào Ân Huệ Bộ Tộc sẽ mang lại:"

 pathfinders_pride_perk_name: "Niềm Tự Hào Của Người Dẫn Đường"
 silent_stalking_perk_name: "Rình Rập Vô Thanh"
 shriek_perk_name: "Tiếng Rít"
 cheshire_prank_perk_name: "Trò Đùa Cheshire"
 freyjas_blessing_perk_name: "Phước Lành Của Freyja"
 fortuna_perk_name: "Fortuna"
 jump_to_the_moon_perk_name: "Nhảy Lên Vầng Trăng"
 withering_stare_perk_name: "Ánh Nhìn Tàn Úa"

 PATHFINDERS_PRIDE_PERK_EFFECT: "#flavor Loài mèo có khả năng định hướng đáng nể. Với Ân Huệ này, một Bastet có thể nâng cao bản năng ấy để tìm đường ra khỏi hầu hết các loại mê cung, sa mạc hay rừng rậm. Những kẻ xứng đáng có thể học Ân Huệ này từ các linh hồn Chim, nhưng không werecat nào tự nguyện thừa nhận điều đó trước công chúng#!"
 SILENT_STALKING_PERK_EFFECT: "#flavor Mánh khóe phổ biến này cho phép một Bastet di chuyển mà không gây ra bất kỳ âm thanh nào. Ngay cả những bề mặt hay kêu hoặc lung lay, như sàn gỗ hay đám cành khô chất đống, cũng có thể vượt qua mà không gây tiếng động. #!"
 CHESHIRE_PRANK_PERK_EFFECT: "#flavor Những Bastet năng động đã khám phá ra bí quyết biến mất ngay trước mắt mọi người. Nó nhanh chóng trở thành một mánh khóe quý giá và được ưa chuộng. #!"
 FORTUNA_PERK_EFFECT: "#flavor Loài mèo yêu quý bạn bè của chúng, và chúng nổi danh vì sự may mắn. Ân Huệ này cho phép chúng chia sẻ một phần vận may đó cho người khác, hoặc thậm chí tự mình sử dụng một chút. #!"
 SHRIEK_PERK_EFFECT: "Trao [GetModifier('shriek_perk_modifier').GetNameWithTooltip] [modifier|E] cho [knights|E] địch khi hành động như một [commander|E] trong [combat_phase|E], hoặc cho đối thủ của bạn trong [single_combat_duel_plural|E].\n#flavor Với một tiếng thét xé tai, Bastet làm điếc tai tất cả những ai ở gần. #!"
 FREYJAS_BLESSING_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn khiến mục tiêu mang thai.\n#flavor Vị nữ thần cổ xưa của người Norse về sự sinh sôi và tình yêu từng du hành trên một cỗ xe do mèo kéo. Giờ đây bà ghi nhớ công lao ấy bằng cách ban cho một số cư dân loài mèo khả năng sinh sản phi thường, mà họ có thể trao lại cho người khác nếu muốn. Dù Ân Huệ này không đảm bảo rằng một cuộc giao phối nhất định sẽ sinh ra một Bastet con, nhiều người trong Tộc tuyên bố rằng nếu không có Phước Lành này, giống loài họ có thể đã gần như tuyệt chủng. #!"
 JUMP_TO_THE_MOON_PERK_EFFECT: "#flavor Những Bastet vĩ đại nhất có thể trở về với Seline trong những chuyến thăm ngắn. Bằng cách tạo ra một Cầu Trăng từ Cõi Hang Ổ của mình đến vầng trăng, werecat sẽ đến triều đình của Luna. Khi ở đó, nàng có thể thở và di chuyển bình thường; chỉ cần cẩn trọng, đó sẽ là một chuyến lưu trú huy hoàng. #!"
 WITHERING_STARE_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn gây cho mục tiêu một vết thương, mức độ nghiêm trọng tùy theo sức mạnh của bạn.\n#flavor Ân Huệ này cho phép một werecat giết chết chỉ bằng một cái nhìn, một mánh khóe ưa thích của các lãnh chúa Simba và những Pumonca lang bạt. Sử dụng Ân Huệ này chống lại các Bastet khác bị coi là vô cùng bất nghĩa, nhưng điều đó vẫn xảy ra.#!"

 sweet_hunters_smile_perk_name: "Nụ Cười Của Kẻ Săn Mồi Ngọt Ngào"
 cat_claws_perk_name: "Vuốt Mèo"
 eavesdroppers_ear_perk_name: "Tai Của Kẻ Nghe Trộm"
 craft_of_the_maker_perk_name: "Nghệ Thuật Của Đấng Tạo Hóa"
 babels_cure_perk_name: "Phương Thuốc Babel"
 monkeys_uncle_perk_name: "Chú Khỉ"
 deny_the_hungry_perk_name: "Cự Tuyệt Kẻ Đói Khát"
 madness_perk_name: "Điên Loạn"

 SWEET_HUNTERS_SMILE_PERK_EFFECT: "#flavor Ân Huệ này thấm nhuần lời nói của một homid với sự đáng tin và thuyết phục nội tại, khiến chúng vang lên chân thật bên tai và nặng trĩu trong lòng.#!"
 CAT_CLAWS_PERK_EFFECT: "#flavor Bằng cách gọi về dòng dõi của mình, một Bastet ở dạng Homid hoặc Sokto có thể tuốt vuốt và tấn công như thể đang ở dạng Crinos. #!"
 EAVESDROPPERS_EAR_PERK_EFFECT: "Cho phép bạn sử dụng [character_interaction|E] Tiết Lộ Âm Mưu.\n#flavor Bí mật là một loại hàng hóa quan trọng, và những kẻ cố giữ bí mật của mình rất có thể đang che giấu điều gì đó nguy hiểm. Ân Huệ này được phát triển để lôi ra những kẻ phản bội hoặc âm mưu tiềm tàng.#!"
 BABELS_CURE_PERK_EFFECT: "#flavor Bằng cách vận dụng quyền năng của Rahjah, một Bastet có thể dịch mọi ngôn ngữ loài người trong khu vực xung quanh nàng.#!"
 MONKEYS_UNCLE_PERK_EFFECT: "Tùy chọn thêm cho [character_interaction|E] Biến Hình cho phép bạn thay đổi ngoại hình.\n#flavor Bastet có thể mang hình dạng chính xác của bất kỳ người, đại miêu hay Bastet khác.#!"
 DENY_THE_HUNGRY_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn khiến hạt bị nhắm đến nhận [GetModifier( 'deny_the_hungry_perk_modifier' ).GetNameWithTooltip|L]. \n#flavor Truyền thuyết đặt Ân Huệ này vào tay các Bubasti, những người đã dùng nó để trừng phạt các cộng đồng vô lễ bằng đói kém và hạn hán ở Ai Cập Cổ Đại. #!"
 MADNESS_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn khiến mục tiêu nhận một đặc điểm tâm lý tiêu cực.\n#flavor Với Ân Huệ này, người triệu hồi có thể buộc kẻ khác đối mặt với ác quỷ nội tâm của họ, bao gồm sự điên loạn và mất trí. Bản chất của sự rối loạn thay đổi theo từng cá nhân, nhưng nó sẽ luôn nghiêm trọng, khiến nạn nhân không thể hoạt động bình thường.#!"
 CRAFT_OF_THE_MAKER_PERK_EFFECT: "Việc tài trợ cảm hứng cho các bảo vật hoặc đặt làm một bảo vật giờ ít tốn kém hơn.\n#flavor Người triệu hồi có thể tạo hình vật chất từng sống (nhưng không phải bất tử!) thành nhiều loại vật thể ngay lập tức.#!"

 kittens_cry_perk_name: "Tiếng Khóc Của Mèo Con"
 mark_as_mine_perk_name: "Đánh Dấu Chủ Quyền"
 killers_leap_perk_name: "Cú Nhảy Của Kẻ Sát Nhân"
 perfect_cover_perk_name: "Lớp Che Hoàn Hảo"
 underbelly_perk_name: "Điểm Yếu Bụng Dưới"
 hand_of_will_perk_name: "Bàn Tay Ý Chí"
 judgement_of_pestilence_perk_name: "Sự Phán Xét Của Ôn Dịch"
 revolt_of_the_land_perk_name: "Cuộc Nổi Dậy Của Đất"

 KITTENS_CRY_PERK_EFFECT: "#flavor Ân Huệ này thấm nhuần vào người sử dụng một âm điệu thảm thiết đến mức bất kỳ ai nghe thấy cũng phải tìm mọi cách để an ủi nàng. Hầu hết Bastet coi đây là một mánh khóe bẩn thỉu nhưng hữu dụng. #!"
 MARK_AS_MINE_PERK_EFFECT: "Mở khóa [buy_artifact_claim_interaction|E].\n#flavor Bằng cách phun xạ hương lên một khu vực hay vật thể, một Bastet có thể tuyên bố chủ quyền với nó. Bất kỳ sinh vật có khả năng cảm nhận huyền thuật nào cũng sẽ nhận ra đó là một dấu hiệu "Cấm Vào!"#!"
 KILLERS_LEAP_PERK_EFFECT: "#flavor Những truyền thuyết cổ xưa kể về Bastet nhảy qua kẻ địch và vượt sông mà không làm ướt chân; Ân Huệ này là một cách họ đã làm điều đó.#!"
 PERFECT_COVER_PERK_EFFECT: "#flavor Bằng cách cào xước xung quanh nơi, dấu vết hay vật thể cần che giấu, Bastet làm nó biến mất khỏi tầm nhìn thông thường và huyền thuật.#!"
 UNDERBELLY_PERK_EFFECT: "#flavor Bằng cách đánh giá kẻ địch hay trở ngại, một Bastet có thể cảm nhận được điểm yếu nhất của nó.#!"
 HAND_OF_WILL_PERK_EFFECT: "#flavor Bằng cách dùng ý chí điều khiển vật thể, Bastet có thể nhấc vật lên và mở các chướng ngại chỉ bằng cách nhìn vào chúng. #!"
 REVOLT_OF_THE_LAND_PERK_EFFECT: "#flavor Bastet kêu gọi các linh hồn của khu vực xung quanh tấn công kẻ xâm nhập. Địa hình đáp lại theo cách tốt nhất có thể: Đá lăn và va đập, dây leo vướng chân, nước hút nạn nhân xuống dưới. Một hiện thân của chính Gaia dạy Ân Huệ này.#!"
 JUDGEMENT_OF_PESTILENCE_PERK_EFFECT: "Là hai [character_interaction|E], cho phép bạn hấp thụ một dịch bệnh rồi giải phóng nó vào triều đình kẻ địch.\n#flavor Những cộng đồng biết tôn trọng giống mèo sẽ thấy ôn dịch bị đuổi khỏi nhà mình, trong khi những cộng đồng khác nhận lại dịch bệnh đó. Sự cân bằng phải được duy trì.#!"


