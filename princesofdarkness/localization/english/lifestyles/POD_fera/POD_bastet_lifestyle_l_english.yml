 all_beasts_under_the_sun_perk_name: "Muôn Thú Dưới Ánh Dương"

 DIAMOND_CLAWS_PERK_EFFECT: "#flavor Bằng cách cào vuốt lên đá, thép, hay một bề mặt cứng khác, Bastet mài chúng sắc như dao cạo. Một linh hồn mèo hoặc gấu dạy Ân Huệ này. #!"
 IMPALAS_FLIGHT_PERK_EFFECT: "#flavor Bastet tăng gấp đôi tốc độ chạy của mình. Một linh hồn chim chạy đường hoặc báo gêpa dạy Ân Huệ này. #!"
 RIVER_OF_BLOOD_PERK_EFFECT: "#flavor Đất đai của châu Phi đã được tắm trong máu suốt hàng chục ngàn năm. Với Ân Huệ này, một Swara gọi dòng máu đã đổ ấy hợp lại qua lớp đất và ban cho nó hình dạng, tạo ra một vũng nước, một dòng sông, một khối xúc tu, hay nhiều thứ khác.#!"
 WALKING_BETWEEN_WORLDS_PERK_EFFECT: "#flavor Một số truyền thuyết cho rằng Coyote đã dạy Bastet cách bước sang ngang; những truyền thuyết khác lại khẳng định mánh khóe này bị đánh cắp từ Garou. Dù thế nào, Ân Huệ này cho phép một werecat bước vào [umbra|E] như Garou vẫn làm.#!"
 DANCE_OF_THE_CHAYA_PERK_EFFECT: "Mở khóa $seek_aid_of_the_spirits_decision$ [decision|E]. \n#flavor Một trong những ân huệ lớn nhất mà một Bastet có thể trao cho một linh hồn là cơ hội được cưỡi trong lớp da của nó một thời gian. Dù hầu hết loài mèo không bao giờ nghĩ đến một "khoản vay" như vậy, nhiều Swara coi việc tự nguyện bị chiếm hữu là một sự phục vụ, không phải một gánh nặng. Ân Huệ này, bắt đầu bằng một điệu nhảy cuồng loạn, cho phép một chaya nhập vào werecat và "nắm quyền kiểm soát" trong một thời gian. Linh hồn có được một thân xác để cưỡi, và werecat nhận lại… một số lợi ích. Vũ Điệu được xem nhiều hơn như một hành động tình yêu hay quyến luyến hơn là sự nô dịch — một cảm xúc mà ít Bastet nào có thể hiểu được. #!"
 CLEARWATER_PASSAGE_PERK_EFFECT: "Mở khóa tùy chọn biến hình [GetModifier( 'POD_shapeshift_form_water_modifier' ).GetNameWithTooltip|L].\n#flavor Bằng cách biến mình thành chất lỏng, một Swara có thể xuyên qua các chướng ngại mà không cần hoàn toàn bước vào [umbra|E]. Như nước, nàng rỉ qua các khe nứt, len qua vật cản và ngấm qua các vật liệu.#!"
 GHOST_CARESS_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn gây cho mục tiêu một vết thương với mức độ nghiêm trọng tùy theo độ hiếm của bảo vật của người nhận bị nhắm đến.\n#flavor Swara có thể dùng phép thuật cảm ứng để gửi cảm giác qua một khoảng cách. Dù phép thuật không thể gây tổn hại vật lý cho mục tiêu, nó có thể làm hắn phát điên khi những cơn đau hay khoái cảm ma quái tràn qua hắn mà không có nguyên nhân rõ ràng. #!"
 ALL_BEASTS_UNDER_THE_SUN_PERK_EFFECT: "Cho phép biến hình thành nhiều dạng động vật khác nhau.\n#flavor Bastet với Ân Huệ này có thể biến mình thành bất kỳ loài động vật nào có kích thước từ một con chim nhỏ đến một con bò rừng bison. Bastet nhận được mọi năng lực đặc biệt (bay, mang, độc, khả năng cảm giác, v.v.) của loài động vật mà nàng mô phỏng.#!."
 not_kinfolk_tt: "#N Kinfolk không thể nhận perk này hoặc bất kỳ perk nào cao hơn.#! \n"

