 RELEASE_FROM_BONDAGE_PERK_STATS_EFFECT: "Có được khả năng phòng vệ tinh thần mạnh mẽ, giúp bạn miễn nhiễm với một số sức mạnh tâm linh.\nLà một [character_interaction|E], cho phép bạn dùng $POD_energy_gnosis$ để buộc mục tiêu phải tiêu một hook mà họ nắm giữ đối với bạn.\n#F Có nhiều cách để trói buộc ý chí của người khác bằng huyền thuật. Ân Huệ này phá vỡ mọi ràng buộc như vậy, từ sự khống chế bằng máu của ma cà rồng đến sự điều khiển tâm trí của một mage hay geas của một Half Moon. Những ai biết Ân Huệ này có thể dùng nó lên bất kỳ sinh vật nào, kể cả chính mình. Ân Huệ này chỉ được một Incarna hoặc linh hồn có sức mạnh tương đương ban tặng, thường là để tưởng thưởng cho một sự phụng sự vĩ đại nào đó.#!"
 RELEASE_FROM_BONDAGE_REQUIREMENT: "@warning_icon!#X Bạn cần hoàn thành một nhiệm vụ từ một Incarna (cắm một nhà thám hiểm tại bất kỳ cõi umbra nào để tìm manh mối về vị trí và bắt đầu một [umbra_expedition|E] để đến gặp họ rồi nhận nhiệm vụ) để mở khóa ân huệ này.#!"

