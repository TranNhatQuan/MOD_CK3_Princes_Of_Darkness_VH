 FIREBRINGER_PERK_STATS_EFFECT: "Có cơ hội nhận một điểm ân huệ phong cách sống ngẫu nhiên cho mỗi sinh vật siêu nhiên bị giết.\nNhận [prestige|E] và [dynasty_prestige|E] khi bạn thực hiện [interaction|E] huấn luyện phong cách sống.\n#F Ragabash thực hiện trò lừa tối thượng, đánh cắp một sức mạnh siêu nhiên và biến nó thành một Ân Huệ, để rồi có thể ban lại cho người khác như thể New Moon là một linh hồn thầy dạy. Tuy vậy, Ragabash trước tiên phải sống sót qua việc bị sức mạnh đó sử dụng lên chính mình. Coyote hoặc một Incarna lừa lọc khác truyền dạy Ân Huệ này.#!"
