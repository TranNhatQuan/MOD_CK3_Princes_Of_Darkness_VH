 PROPHETIC_VISION_PERK_STATS_EFFECT: "Mở khóa [decision|E] Chiêm Tinh Đoán Vận\nBạn sẽ nhận được thông báo nếu có ai định sát hại bạn bè hoặc gia đình của bạn.\nBạn sẽ nhận được thông báo nếu có ai định mê hoặc người yêu hoặc tình nhân của bạn.\nTù nhân của bạn sẽ có ít cơ hội trốn thoát khỏi nhà tù của bạn hơn."
 REBIRTHING_PERK_STATS_EFFECT: "Bạn sẽ được tái sinh thành một nhân vật #V 1#! tuổi nếu bạn chết.\n#F Ân Huệ linh thiêng và hiếm hoi nhất của Gaia này cho phép Garou khi chết được tái sinh ngay lập tức vào thân xác của một cún non mới sinh sống trong phạm vi 2.000 dặm từ nơi Garou đó chết. Sự tái sinh thường xảy ra ở cùng breed mà Garou đó có trong kiếp trước, nhưng cũng có thể sang một breed khác nếu con non duy nhất trong phạm vi không thuộc breed gốc. Nếu không có cún non nào trong phạm vi trong vòng một tuần trăng kể từ thời điểm chết, thì Garou đó sẽ không được tái sinh và đi đến nơi mọi Garou đều đến khi chết.#!"
 REBIRTHING_REQUIREMENT: "@warning_icon!#X Bạn cần hoàn thành một nhiệm vụ từ chính Gaia (cắm một nhà thám hiểm tại bất kỳ cõi umbra nào để tìm manh mối về vị trí và bắt đầu một [umbra_expedition|E] để đến gặp họ rồi nhận nhiệm vụ) để mở khóa ân huệ này.#!"