 SONG_SIREN_PERK_STATS_EFFECT: "Bạn mở khóa thêm một bài ca có thể trình diễn bằng hành động [character_interaction|E] 'Khúc Ca Nguyên Thủy'."
 STORYTELLER_PERK_STATS_EFFECT: "Là một [character_interaction|E], cho phép bạn dùng $POD_energy_gnosis$ để có cơ hội kích hoạt một sự kiện ngẫu nhiên.\n#F Không chỉ đơn thuần kể và kể lại những câu chuyện xưa cũ, hay chờ đợi cho đến khi các biến cố hôm nay trở thành chuyện kể mới, Galliard có thể thay đổi chính các biến cố của tấn tuồng đang diễn ra xung quanh nàng. Nàng có thể thêm vào những “nhân vật” mới, thay đổi chuỗi biến cố, và thậm chí thay đổi động cơ của những người tham gia chính. Tuy nhiên, vì Ân Huệ này có thể thực sự mang lại hậu quả làm thay đổi cả thế giới, số ít Garou trong lịch sử biết đến nó đều rất ngần ngại khi thực sự sử dụng nó. Không ai biết loại linh hồn nào truyền dạy Ân Huệ này; có lẽ là một hiện thân của Gaia, nhưng vì quá ít Garou biết đến sự tồn tại của Ân Huệ này, không ai có thể nói chắc.#!"
 STORYTELLER_REQUIREMENT: "@warning_icon!#X Bạn cần hoàn thành một nhiệm vụ từ một hiện thân của Gaia (cắm một nhà thám hiểm tại bất kỳ cõi umbra nào để tìm manh mối về vị trí và bắt đầu một [umbra_expedition|E] để đến gặp họ rồi nhận nhiệm vụ) để mở khóa ân huệ này.#!"



