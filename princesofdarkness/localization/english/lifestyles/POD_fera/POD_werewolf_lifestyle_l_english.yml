 AURA_LEADERSHIP_PERK_STATS_EFFECT: "Bạn mở khóa quyết định nhỏ 'Thẩm Phán Của Vùng Đất'. Nó sẽ mang lại lợi ích cho thủ phủ của bạn. Các lợi ích khác sẽ có sẵn ở phần còn lại của nhánh phong cách sống này."
