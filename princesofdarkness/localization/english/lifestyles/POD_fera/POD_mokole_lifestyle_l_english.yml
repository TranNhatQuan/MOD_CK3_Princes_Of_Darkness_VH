 mokole_pack_tactics_perk_name: "Chiến Thuật Bầy"
 MOKOLE_PACK_TACTICS_PERK_EFFECT: "#flavor Bằng cách dẫn đầu và điều phối các Mokolé khác, Decorated Sun ban cho toàn bộ bầy con của nàng khả năng chiến đấu xuất sắc trong lúc giao tranh ác liệt.#!"
 mothers_touch_perk_name: "Bàn Tay Của Mẹ"
 MOTHERS_TOUCH_PERK_EFFECT: "[character_interaction|E]: Hồi 1 [POD_superficial_damage_with_box|E] cho một nhân vật khác.\n#flavor Decorated Sun dẫn truyền năng lượng linh hồn qua tay mình, hàn gắn vết thương của bất kỳ sinh vật sống nào.#!"
 pilot_snake_perk_name: "Rắn Dẫn Đường"
 PILOT_SNAKE_PERK_EFFECT: "Có thể tuyển [GetMaA('snakes').GetName] làm [men_at_arms|E].\n#flavor Ân huệ này cho phép Mokolé triệu hồi con rắn dẫn đường hữu ích, một sinh vật biết cách tìm đường đến nơi cần đến.#!"
 wind_beneath_my_wings_perk_name: "Gió Dưới Cánh Ta"
 WIND_BENEATH_MY_WINGS_PERK_EFFECT: "#flavor Ân Huệ này giúp Mokolé di chuyển dễ dàng hơn bằng cách hành quân hoặc bay theo đội hình.#!"
 call_to_duty_perk_name: "Lời Gọi Bổn Phận"
 CALL_TO_DUTY_EFFECT: "#flavor Danh xưng mang sức mạnh trong thế giới linh hồn, và Decorated Sun có thể lợi dụng điều này để triệu hồi và chỉ huy bất kỳ linh hồn nào nàng biết tên.#!"
 dragon_drill_perk_name: "Huấn Luyện Rồng"
 DRAGON_DRILL_PERK_EFFECT: "Ban [GetModifier('POD_mokole_dragon_drill_modifier').GetNameWithTooltip] cho [knights|E] đồng minh khi hành động như [commander|E] trong [combat_phase|E], hoặc cho chính bạn trong [single_combat_duel_plural|E].\n#flavor Mokolé có thể tổ chức các đồng minh của hắn thành một lực lượng hùng mạnh, chia sẻ những khả năng đã học được cho mọi thành viên.#!"
 reshape_object_perk_name: "Tái Tạo Hình Vật Thể"
 RESHAPE_OBJECT_PERK_EFFECT: "Nhận [gold|E] khi phá hủy [artifacts|E]\n#flavor Mokolé có thể tạo hình vật liệu đã từng sống thành thứ khác ngay lập tức.#!"
 chaos_mechanics_perk_name: "Cơ Chế Hỗn Mang"
 CHAOS_MECHANICS_PERK_EFFECT: "$unlock_forging_node$ Thêm một trong bốn hiệu ứng ngẫu nhiên.\n#flavor Ân Huệ này cho phép kẻ mang dòng máu rồng-thú triệu hồi năng lượng nguyên thủy và hình dạng huyền bí cùng một lúc.#!"
 strength_of_the_dominator_perk_name: "Sức Mạnh Của Bá Chủ"
 STRENGTH_OF_THE_DOMINATOR_PERK_EFFECT: "[character_interaction|E]: Giảm tài nguyên [splat|E] của một nhân vật và nhận [prowess|E] bằng một phần ba [prowess|E] của họ.\n#flavor Kẻ mang dòng máu rồng-thú rút từ cơn giận của mục tiêu để nuôi lớn cơn giận của chính hắn.#!"




 mokole_aura_of_confidence_perk_name: "Hào Quang Tự Tin"
 MOKOLE_AURA_OF_CONFIDENCE_PERK_EFFECT: "$countermeasures_unlocks_t1_mental_fortress$\n#flavor Mokolé chiếu ra một hào quang ưu việt, ngăn chặn các nỗ lực tìm lỗi lầm hoặc đọc hào quang.#!"
 lambent_flame_perk_name: "Ngọn Lửa Chớp Rạng"
 LAMBENT_FLAME_PERK_EFFECT: "#flavor Kẻ mang dòng máu rồng-thú khiến thân thể nàng bùng lên ánh sáng bạc.#!"
 mokole_awe_perk_name: "Kinh Sợ"
 MOKOLE_AWE_PERK_EFFECT: "#flavor Mokolé trở thành hiện thân không thể nhầm lẫn của vinh quang và uy nghi nguyên thủy, đội vương miện mặt trời và khoác lên mình những năm tháng.#!"
 dazzle_perk_name: "Choáng Ngợp"
 DAZZLE_PERK_EFFECT: "#flavor Mokolé có thể tràn ngập tâm trí mục tiêu bằng vinh quang và tình yêu của Gaia.#!"
 dragon_kings_majesty_perk_name: "Uy Nghi Của Vua Rồng"
 DRAGON_KINGS_MAJESTY_PERK_EFFECT: "#flavor Eclipsed Sun dường như lớn lên và trở nên đáng sợ hơn, biến thành một phiên bản bóng tối khủng khiếp của chính nàng.#!"
 wrath_of_the_dragon_perk_name: "Cơn Thịnh Nộ Của Rồng"
 WRATH_OF_THE_DRAGON_PERK_EFFECT: "Gây 40 [stress|E] lên [knights|E] và [commanders|E] kẻ thù khi hành động như [commander|E] trong [combat_phase|E], hoặc lên kẻ thù của bạn trong [single_combat_duel_plural|E] nếu họ phục vụ $glossary_wyrm$.\n#flavor Mokolé phô diễn bản thân trọn vẹn trong vinh quang khủng khiếp như chiến binh được Gaia lựa chọn. Sự huy hoàng của hắn áp đảo tay sai của [Glossary('Kẻ Hòa Tan', 'glossary_wyrm_tt')].#!"
 mokole_mastery_perk_name: "Thông Thạo"
 MOKOLE_MASTERY_PERK_EFFECT: "[character_interaction|E]: Nhận [strong_hook|E] lên một [GetTrait('mokole').GetName(GetNullCharacter)] khác.\n#flavor Eclipsed Sun có thể chỉ huy các Mokolé khác, thậm chí cả những kẻ đã sa ngã vào [Glossary('Kẻ Hòa Tan', 'glossary_wyrm_tt')] để làm theo ý nàng.#!"
 army_of_the_ancestors_perk_name: "Đội Quân Của Tổ Tiên"
 ARMY_OF_THE_ANCESTORS_PERK_EFFECT: "Ba [ancestor_spirits|E] hùng mạnh được triệu hồi để trợ giúp bạn với vai trò [knights|E] trong chiến tranh.\n#flavor Mokolé có thể gọi đến các bậc tổ tiên đã trao cho hắn hình dạng hắn mang, đưa họ ra khỏi sương mù của Ký Ức để thử thách các đối thủ của hắn.#!"
 sun_enfleshed_perk_name: "Mặt Trời Hóa Thân"
 SUN_ENFLESHED_PERK_EFFECT: "Gây 1 [POD_aggravated_damage_with_box|E] lên [knights|E] và [commanders|E] kẻ thù khi hành động như [commander|E] trong [combat_phase|E], hoặc lên kẻ thù của bạn trong [single_combat_duel_plural|E] nếu họ yếu với mặt trời.\n$unlock_forging_node$ [GetModifier('sun_scales_modifier').GetNameWithTooltip].\n#flavor Mokolé trở thành hiện thân sống của lửa thánh mặt trời. Nàng bùng lên trong ngọn lửa mặt trời câm lặng, thiêu đốt đối thủ chỉ bằng một cái chạm.#!"
 dream_semblence_perk_name: "Hình Dạng Trong Mộng"
 DREAM_SEMBLENCE_PERK_EFFECT: "[character_interaction|E]: Nhận [GetModifier('POD_mokole_dream_semblence_modifier').GetNameWithTooltip] trong một năm và tối đa hóa [dread|E] của bạn.\n#flavor Ân Huệ hiếm có này cho phép Mokolé mơ mình thành hình dạng của một True Dragon. Khi cuộc đối đầu kết thúc, giấc mộng sẽ tan biến.#!"







