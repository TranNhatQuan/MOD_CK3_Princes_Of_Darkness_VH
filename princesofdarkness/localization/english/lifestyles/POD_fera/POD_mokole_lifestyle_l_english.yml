l_english:



####Common Gifts####

 razor_claws_perk_name: "Vuốt Sắc Như Dao"
 RAZOR_CLAWS_PERK_EFFECT: "#flavor Bằng cách cào vuốt lên đá, sắt hoặc mặt phẳng cứng khác, Mokolé mài chúng sắc lẹm như dao cạo.#!"
 talk_perk_name: "Ngôn Ngữ"
 TALK_PERK_EFFECT: "Có thể học thêm #V 1#! [language|E] mà không bị trừng phạt.\n#flavor Ân Huệ này cho phép Mokolé nói bất kỳ ngôn ngữ loài người nào mà hắn biết dù đang ở Suchid hay Archid Form.#!"
 blessings_of_the_nest_perk_name: "Phước Lành Của Tổ"
 BLESSINGS_OF_THE_NEST_PERK_EFFECT: "Có thể tuyển [GetMaA('crocodiles').GetName] làm [men_at_arms|E].\n#flavor Rít lên một lời chúc phúc bằng Ngôn Ngữ Rồng, Mokolé ban tặng ân huệ sinh sôi.#!"
 mokole_axis_mundi_perk_name: "Trục Vũ Trụ"
 MOKOLE_AXIS_MUNDI_PERK_EFFECT: "#flavor Mokolé vươn linh hồn ra để cảm nhận sự hiện diện của Gaia, tự định tâm mình trong quan hệ với Người Mẹ.#!"
 dragonfear_perk_name: "Nỗi Khiếp Sợ Rồng"
 DRAGONFEAR_PERK_EFFECT: "#flavor Mokolé phô diễn toàn bộ uy lực đáng sợ của mình - nhe răng hay giương vuốt, gầm rú, hoặc chỉ đơn giản sừng sững đe dọa trên kẻ thù.#!"
 mokole_walking_between_worlds_perk_name: "Bước Giữa Các Thế Giới"
 MOKOLE_WALKING_BETWEEN_WORLDS_PERK_EFFECT: "#flavor Mokolé có thể xuyên qua Gauntlet và bước vào Umbra. Dù hắn nên cẩn trọng với [innocents|E] khi băng qua đó.#!"
 dragons_breath_perk_name: "Hơi Thở Rồng"
 DRAGONS_BREATH_PERK_EFFECT: "Mở khóa một đòn thế mới trong [single_combat_duel|E].\n#flavor Mokolé phun lửa vào kẻ thù.#!"
 cocoon_perk_name: "Kén Bọc"
 COCOON_PERK_EFFECT: "$countermeasures_unlocks_t2_supernatural_high_alert$\n#flavor Mokolé tự bọc mình trong một lớp quách kitin dày, mờ đục, khiến bản thân bất động nhưng gần như miễn nhiễm với tổn hại.#!"
 serenity_perk_name: "Thanh Tĩnh"
 SERENITY_PERK_EFFECT: "#flavor Mokolé có thể lấp đầy một trái tim nóng nảy bằng sự an bình của Gaia, ngay cả giữa trận chiến.#!"
 grasp_the_beyond_perk_name: "Nắm Bắt Cõi Bên Kia"
 GRASP_THE_BEYOND_PERK_EFFECT: "Có thể biến hình và duy trì hình dạng biến hình khi ở trong [umbra|E].\n#flavor Mokolé có thể mang vật ra vào Umbra mà không cần phải hiến dâng chúng cho bản thân.#!"
 song_of_the_great_beast_perk_name: "Khúc Ca Đại Thú"
 SONG_OF_THE_GREAT_BEAST_PERK_EFFECT: "Gây cho [rulers|E] kẻ thù một [modifier|E] tiêu cực mạnh mẽ theo mỗi Cấp Bậc [GetTrait('mokole').GetName(GetNullCharacter)] khi bắt đầu [war|E] với vai trò kẻ tấn công hoặc phòng thủ chính.\n#flavor Mokolé du hành đến vùng hoang dã sâu thẳm và cất lên một tiếng gầm dài, thảm thiết. Một trong những Đại Thú của Thời Cổ Đại đáp lại lời gọi, xuất hiện trong cõi thực gần kẻ mang dòng máu rồng-thú.#!"



####Stream Gifts####
 streamgifts_lifestyle_name: "Ân Huệ Dòng Chảy"
 streamgifts_lifestyle_desc: "Bốn dòng chảy Mokolé đều được định hình bởi bản chất của vùng đất mà họ chọn và loài bò sát thân tộc sinh sống nơi đó."
 streamgifts_lifestyle_highlight_desc: "Nhờ $POD_energy_gnosis$ của bạn, bạn nhận thêm #P [GetPlayer.MakeScope.ScriptValue('gnosis_lifestyle_xp_mult')|%0]#! [experience|E] trong Lối Sống này."
 monthly_streamgifts_lifestyle_xp_gain_mult: "[experience|E] [lifestyle|E] Ân Huệ Dòng Chảy Hàng Tháng"
 streamgifts_mokole_mbembe_visible: "Ân Huệ Mokolé-mbembe"
 streamgifts_gumagan_visible: "Ân Huệ Gumagan"
 streamgifts_makara_visible: "Ân Huệ Makara"
 streamgifts_zhong_lung_visible: "Ân Huệ Zhong Lung"

 streamgifts_mokole_mbembe_focus: "Trọng Tâm Mokolé-mbembe"
 streamgifts_mokole_mbembe_focus_modifier: "[GetFocus('streamgifts_mokole_mbembe_focus').GetName]"
 streamgifts_mokole_mbembe_focus_desc: "Ân Huệ từ Dòng Chảy của Chiến Binh."
 streamgifts_mokole_mbembe_focus_effect_desc: "Tập trung vào Ân Huệ Mokolé-mbembe sẽ mang lại:"

 streamgifts_gumagan_focus: "Trọng Tâm Gumagan"
 streamgifts_gumagan_focus_modifier: "[GetFocus('streamgifts_gumagan_focus').GetName]"
 streamgifts_gumagan_focus_desc: "Ân Huệ từ Dòng Chảy của Người Tiên Phong."
 streamgifts_gumagan_focus_effect_desc: "Tập trung vào Ân Huệ Gumagan sẽ mang lại:"

 streamgifts_makara_focus: "Trọng Tâm Makara"
 streamgifts_makara_focus_modifier: "[GetFocus('streamgifts_makara_focus').GetName]"
 streamgifts_makara_focus_desc: "Ân Huệ từ Dòng Chảy của Dân Chúng."
 streamgifts_makara_focus_effect_desc: "Tập trung vào Ân Huệ Makara sẽ mang lại:"

 streamgifts_zhong_lung_focus: "Trọng Tâm Zhong Lung"
 streamgifts_zhong_lung_focus_modifier: "[GetFocus('streamgifts_zhong_lung_focus').GetName]"
 streamgifts_zhong_lung_focus_desc: "Ân Huệ từ Dòng Chảy của Nhà Triết Học."
 streamgifts_zhong_lung_focus_effect_desc: "Tập trung vào Ân Huệ Zhong Lung sẽ mang lại:"

 NEEDS_MOKOLE_MBEMBE_STREAM: "@warning_icon!#X Dòng chảy của bạn phải là Mokolé-mbembe#!"
 NEEDS_GUMAGAN_STREAM: "@warning_icon!#X Dòng chảy của bạn phải là Gumagan#!"
 NEEDS_MAKARA_STREAM: "@warning_icon!#X Dòng chảy của bạn phải là Makara#!"
 NEEDS_ZHONG_LUNG_STREAM: "@warning_icon!#X Dòng chảy của bạn phải là Zhong Lung#!"


 speed_of_thought_perk_name: "Tốc Độ Tư Tưởng"
 SPEED_OF_THOUGHT_PERK_EFFECT: "#flavor Mokolé tăng gấp đôi tốc độ chạy của mình.#!"
 sense_dissolver_perk_name: "Cảm Nhận [Glossary('Kẻ Hòa Tan', 'glossary_wyrm_tt')]"
 SENSE_DISSOLVER_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$\n#flavor Mokolé có thể cảm nhận những hiện thân gần đó của [Glossary('Kẻ Hòa Tan', 'glossary_wyrm_tt')].#!"
 silver_claws_perk_name: "Vuốt Bạc"
 SILVER_CLAWS_PERK_EFFECT: "[character_interaction|E]: Tự ban cho mình [GetModifier('POD_mokole_silver_claws_modifier').GetNameWithTooltip] trong 3 năm.\n#flavor Luna gửi các con của mình đến truyền dạy Ân Huệ mạnh mẽ nhưng đau đớn này cho những chiến binh giành được sự ưu ái của bà. Khi được khơi gợi, nó biến vuốt của Mokolé thành bạc.#!"
 bark_of_the_mudpuppy_perk_name: "Tiếng Sủa Của Sa Giông"
 BARK_OF_THE_MUDPUPPY_PERK_EFFECT: "Mở khóa một đòn thế mới trong [single_combat_duel|E].\n#flavor Ân Huệ này cho phép Mokolé sủa lớn vào một người hoặc vật thể, làm vỡ tan kính, gãy vụn gỗ mềm, hoặc thậm chí mở ra những vết thương trên một sinh vật sống.#!"
 beak_of_the_finch_perk_name: "Mỏ Chim Sẻ"
 BEAK_OF_THE_FINCH_PERK_EFFECT: "#flavor Mokolé thích nghi với hoàn cảnh mới để sinh tồn. Họ làm điều đó bằng cách tự tái tạo hình dạng thành một dạng có thể hoàn thành mục tiêu.#!"
 heat_wave_perk_name: "Sóng Nhiệt"
 HEAT_WAVE_PERK_EFFECT: "#flavor Mokolé có thể mang sức nóng của Thần Mặt Trời đến thiêu đốt kẻ thù.#!"
 walk_into_my_eyes_perk_name: "Bước Vào Mắt Ta"
 WALK_INTO_MY_EYES_PERK_EFFECT: "[character_interaction|E]: Ép buộc một [truce|E] với mục tiêu. Khi lệnh đình chiến hết hạn, một trong các [personality_traits|E] của họ đổi thành đặc điểm đối nghịch.\n#flavor Ân Huệ mạnh mẽ này ép mục tiêu nhìn thế giới theo góc nhìn của Mokolé. Trong thời gian này hắn sẽ không thể tấn công Mokolé. Sau khi trở lại là chính mình, mục tiêu thường thay đổi sâu sắc.#!"

 songlines_perk_name: "Đường Ca"
 SONGLINES_PERK_EFFECT: "#flavor Ân Huệ này bao phủ cảnh vật bằng những bài ca. Gumagan có thể định hướng từ đầu này đến đầu kia của Bandaiyan bằng cách dùng các huyền thoại.#!"
 dreamwalk_perk_name: "Bước Vào Mộng"
 DREAMWALK_PERK_EFFECT: "Có thể thao túng Gauntlet.\n#flavor Gumagan có thể dùng liên kết của mình với Dreamtime để hạ thấp Gauntlet.#!"
 bunyips_boom_perk_name: "Tiếng Vọng Bunyip"
 BUNYIPS_BOOM_PERK_EFFECT: "Ban [GetModifier('POD_mokole_bunyips_boom_modifier').GetNameWithTooltip] cho [knights|E] kẻ thù khi hành động như [commander|E] trong [combat_phase|E], hoặc cho kẻ thù của bạn trong [single_combat_duel_plural|E].\n#flavor Gumagan có thể vươn vào Mnesis và bắt chước tiếng gào thảm thiết của Bunyip.#!"
 landspeak_perk_name: "Ngôn Ngữ Đất"
 LANDSPEAK_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$\nCó cơ hội học được một cách bị động [secret|E] của một trong các [vassals|E] của bạn mỗi ba năm.\n#flavor Bằng cách lắng nghe kỹ càng, một Gumagan có thể nghe được những bài ca của Đất Mẹ.#!"
 nightmare_mnesis_perk_name: "Mnesis Ác Mộng"
 NIGHTMARE_MNESIS_PERK_EFFECT: "[character_interaction|E]: Ép buộc một nhân vật trải qua [mental_break|E].\n#flavor Gumagan có thể khuất phục bất kỳ kẻ thù nào bằng Mnesis, buộc họ phải nhớ lại những tội ác họ đã gây ra.#!"
 bilabong_walk_perk_name: "Bước Qua Bilabong"
 BILABONG_WALK_PERK_EFFECT: "#flavor Gumagan dùng Ân Huệ này để vượt qua thành công những vùng địa hình rộng lớn bằng cách dùng nước làm đường tắt.#!"
 bloody_mindedness_perk_name: "Tâm Trí Khát Máu"
 BLOODY_MINDEDNESS_PERK_EFFECT: "Nhận [GetModifier('POD_mokole_bloody_mindedness_nemesis_modifier').GetNameWithTooltip] khi bạn có [nemesis|E] hoặc [GetModifier('POD_mokole_bloody_mindedness_rival_modifier').GetNameWithTooltip] khi bạn có [rival|E].\n#flavor Gumagan có thể "tự hướng mình" vào một mục tiêu hoặc kẻ thù đã chọn. Nàng sẽ theo đuổi mục tiêu này đến chết và cả sau đó.#!"

 sense_prey_perk_name: "Cảm Nhận Con Mồi"
 SENSE_PREY_PERK_EFFECT: "Giảm chi phí của [activity|E] Săn Bắt đi #P -10%#!\n#flavor Ân Huệ này cho phép một kẻ mang dòng máu rồng-thú tìm đủ con mồi để nuôi bầy con của nàng.#!"
 SENSE_PREY_REASON: "$sense_prey_perk_name$: $VALUE|+=0$"
 scent_of_sweet_nectar_perk_name: "Hương Mật Ngọt"
 SCENT_OF_SWEET_NECTAR_PERK_EFFECT: "[character_interaction|E]: Ban cho một nhân vật [GetModifier('POD_mokole_scent_of_sweet_nectar_modifier').GetNameWithTooltip].\nCó thể tuyển [GetMaA('insects').GetName] làm [men_at_arms|E].\n#flavor Nạn nhân của Mokolé bắt đầu tỏa ra một hương thơm ngọt ngào kỳ diệu. Đủ loại sâu bọ nhanh chóng xuất hiện và bao phủ nạn nhân. Lớp áo muỗi, ruồi, ong và bọ cạp bò, chích, và nói chung làm suy giảm thị lực và thính lực.#!"
 shed_perk_name: "Lột Xác"
 SHED_PERK_EFFECT: "Tăng cơ hội thành công cho [decision|E] Vượt Ngục.\n#flavor Mokolé có thể lột một lớp da và/hoặc lông vũ, tuột khỏi tay đối phương hoặc trốn thoát khỏi trói buộc một cách dễ dàng.#!"
 waxwork_monster_perk_name: "Quái Vật Sáp"
 WAXWORK_MONSTER_PERK_EFFECT: "$countermeasures_unlocks_t3_supernatural_high_alert$\n#flavor Ân Huệ này cho phép một Mokolé lợi dụng sự thật rằng "khủng long đã tuyệt chủng" để ẩn mình ngay trước mắt mọi người.#!"
 view_the_seed_perk_name: "Nhìn Thấy Hạt Giống"
 VIEW_THE_SEED_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$\n[character_interaction|E]: Phát hiện một [scheme|E] hoặc [secret|E] ngẫu nhiên của một nhân vật.\n#flavor Ân Huệ này bắt nguồn từ niềm tin rằng mọi vật chỉ là giấc mộng của ý tưởng hay đối tượng đã sinh ra chúng. Nó cho phép người dùng thấy được "hạt giống" của bất cứ điều gì, từ cha mẹ của một đứa trẻ đến kẻ chủ mưu của một âm mưu.#!"
 the_thousand_arrows_perk_name: "Ngàn Mũi Tên"
 THE_THOUSAND_ARROWS_PERK_EFFECT: "#flavor Ân Huệ này cho phép một xạ thủ Makara nhân bội đáng kể số phi tiêu của mình khi đang bay.#!"
 great_as_a_white_hill_perk_name: "Vĩ Đại Như Ngọn Đồi Trắng"
 GREAT_AS_A_WHITE_HILL_PERK_EFFECT: "#flavor Makara lớn lên gấp ba lần kích thước bình thường hoặc co lại thành kích thước của một con cá sấu nhỏ.#!"


 dragon_milk_perk_name: "Sữa Rồng"
 DRAGON_MILK_PERK_EFFECT: "[character_interaction|E]: Hồi 1 [POD_aggravated_damage_with_box|E] cho một nhân vật khác.\n#flavor Zhong Lung dẫn truyền năng lượng linh hồn qua máu của mình, hàn gắn vết thương của bất kỳ sinh vật sống nào khác.#!"
 chiih_ming_perk_name: "Chi'ih Ming"
 CHIIH_MING_PERK_EFFECT: "#flavor Ân Huệ này cho phép Zhong Lung bước đi trên không khí.#!"
 clap_of_thunder_perk_name: "Tiếng Sấm Vang"
 CLAP_OF_THUNDER_PERK_EFFECT: "Mở khóa một đòn thế mới trong [single_combat_duel|E].\n#flavor Zhong Lung đập hai tay lại với nhau, tạo ra một tiếng sấm nổ mạnh khiến những ai nghe thấy phải choáng váng.#!"
 the_dragons_tongue_perk_name: "Lưỡi Rồng"
 THE_DRAGONS_TONGUE_PERK_EFFECT: "[character_interaction|E]: Gây tối đa 2 [POD_aggravated_damage_with_box|E] lên một nhân vật.\n#flavor Zhong Lung giáng sấm sét xuống kẻ thù của mình.#!"
 anger_of_the_wani_perk_name: "Cơn Giận Của Wani"
 ANGER_OF_THE_WANI_PERK_EFFECT: "Mở khóa lựa chọn Ma Thuật Thời Tiết: #V Bão Tố#! và #V Bão Tuyết#!\n#flavor Zhong Lung có thể triệu hồi hầu như bất kỳ hiệu ứng thời tiết nào nàng muốn: Sương mù, lốc xoáy, bão tuyết, và bão sấm sét đều chờ lệnh gọi của nàng.#!"
 sleep_of_hsi_wang_mu_perk_name: "Giấc Ngủ Của Hsi Wang Mu"
 SLEEP_OF_HSI_WANG_MU_PERK_EFFECT: "#flavor Ân Huệ này cho phép Zhong Lung ngủ đông, tập trung sinh lực của mình để kéo dài sự sống.#!"
 a_thousand_secret_faces_perk_name: "Ngàn Gương Mặt Bí Ẩn"
 A_THOUSAND_SECRET_FACES_PERK_EFFECT: "[character_interaction|E]: Cho phép bạn chỉnh sửa [personality_traits|E] của chính mình hoặc sao chép ngoại hình của một nhân vật khác.\n#flavor Ân Huệ này cho phép Zhong Lung mang lấy hình dáng hoàn hảo của bất kỳ con người nào, ở bất kỳ tuổi tác, chủng tộc, hay địa vị nào.#!"



####Solar Auspice Gifts####
 solar_auspicegifts_lifestyle_name: "Ân Huệ Mặt Trời"
 solar_auspicegifts_lifestyle_desc: "Tập trung vào các Ân Huệ đến từ Solar Auspice."
 solar_auspicegifts_lifestyle_highlight_desc: "Nhờ $POD_energy_gnosis$ của bạn, bạn nhận thêm #P [GetPlayer.MakeScope.ScriptValue('gnosis_lifestyle_xp_mult')|%0]#! [experience|E] trong Lối Sống này."
 monthly_solar_auspicegifts_lifestyle_xp_gain_mult: "[experience|E] [lifestyle|E] Ân Huệ Solar Auspice Hàng Tháng"
 solar_auspicegifts_rising_sun_visible: "Rising"
 solar_auspicegifts_noonday_sun_visible: "Noonday"
 solar_auspicegifts_setting_sun_visible: "Setting"
 solar_auspicegifts_midnight_sun_visible: "Midnight"
 solar_auspicegifts_shrouded_sun_visible: "Shrouded"
 solar_auspicegifts_decorated_sun_visible: "Decorated"
 solar_auspicegifts_eclipsed_sun_visible: "Eclipsed"


 solar_auspicegifts_focus: "Trọng Tâm Ân Huệ Solar Auspice"
 solar_auspicegifts_focus_modifier: "[GetFocus('solar_auspicegifts_focus').GetName]"
 solar_auspicegifts_focus_desc: "Thái Dương Vĩ Đại"
 solar_auspicegifts_focus_effect_desc: "Tập trung vào Ân Huệ Solar Auspice sẽ mang lại:"


 RISING_SUN_PERK_REQ: "@warning_icon!#warning Yêu cầu một trong các đặc điểm sau:\n$BULLET_WITH_TAB$[GetTrait('rising_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('vasanta').GetName(GetPlayer)]#!"
 NOONDAY_SUN_PERK_REQ: "@warning_icon!#warning Yêu cầu một trong các đặc điểm sau:\n$BULLET_WITH_TAB$[GetTrait('noonday_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('nam_hsia').GetName(GetPlayer)]#!"
 SETTING_SUN_PERK_REQ: "@warning_icon!#warning Yêu cầu một trong các đặc điểm sau:\n$BULLET_WITH_TAB$[GetTrait('setting_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('tung_chun').GetName(GetPlayer)]#!"
 MIDNIGHT_SUN_PERK_REQ: "@warning_icon!#warning Yêu cầu một trong các đặc điểm sau:\n$BULLET_WITH_TAB$[GetTrait('midnight_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('hemanta').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('pei_tung').GetName(GetPlayer)]#!"
 SHROUDED_SUN_PERK_REQ: "@warning_icon!#warning Yêu cầu một trong các đặc điểm sau:\n$BULLET_WITH_TAB$[GetTrait('shrouded_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('zarad').GetName(GetPlayer)]#!"
 DECORATED_SUN_PERK_REQ: "@warning_icon!#warning Yêu cầu một trong các đặc điểm sau:\n$BULLET_WITH_TAB$[GetTrait('decorated_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('grisma').GetName(GetPlayer)]#!"
 ECLIPSED_SUN_PERK_REQ: "@warning_icon!#warning Yêu cầu một trong các đặc điểm sau:\n$BULLET_WITH_TAB$[GetTrait('eclipsed_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('sai_chau').GetName(GetPlayer)]#!"



 bellow_perk_name: "Tiếng Rống"
 BELLOW_PERK_EFFECT: "Mokolé cất lên một tiếng rống bò sát mạnh mẽ và đáng sợ."
 master_of_fire_perk_name: "Chúa Tể Lửa"
 MASTER_OF_FIRE_PERK_EFFECT: "Nhận miễn nhiễm với sát thương lửa.\n#flavor Một Mokolé nhớ lại hiệp ước cổ xưa đã lập với các linh hồn lửa. Tự bảo vệ mình khi ngọn lửa cuối cùng của Ngày Tận Thế lấp lóe hiện ra.#!"
 eye_of_the_raptor_perk_name: "Mắt Chim Săn"
 EYE_OF_THE_RAPTOR_PERK_EFFECT: "#flavor Mokolé có thể nhìn rõ trong khoảng cách nhiều dặm.#!"
 paint_the_meadows_perk_name: "Tô Vẽ Đồng Cỏ"
 PAINT_THE_MEADOWS_PERK_EFFECT: "#flavor Mokolé có thể phát ra những tiếng rên rỉ, than vãn đáng thương để dụ con mồi đến gần hơn.#!"
 call_the_tides_perk_name: "Gọi Triều Cường"
 CALL_THE_TIDES_PERK_EFFECT: "Mở khóa lựa chọn Ma Thuật Thời Tiết: #V Lũ Lụt#!\nGiảm chi phí và tăng thời gian của #V Lũ Lụt#! nếu bạn có [GetPerk('flood_the_land_perk').GetName(GetPlayer)]\n#flavor Ân Huệ này cho phép Mokolé bẻ cong thủy triều theo ý muốn của hắn.#!"
 might_of_kings_perk_name: "Sức Mạnh Của Vương Giả"
 MIGHT_OF_KINGS_PERK_EFFECT: "Bạn nhận tăng cơ hội gây thương tích cho [knights|E] kẻ thù trong [combat_phase|E] với vai trò [knight|E].\n#flavor Mokolé có thể tăng sức mạnh của hắn lên rất nhiều, để dễ dàng hạ sát kẻ thù hơn.#!"
 lash_of_ages_perk_name: "Ngọn Roi Muôn Đời"
 LASH_OF_AGES_PERK_EFFECT: "#flavor Rising Sun có thể phá hủy bất kỳ vật liệu nhân tạo nào.#!"
 scream_of_gaia_perk_name: "Tiếng Thét Của Gaia"
 SCREAM_OF_GAIA_PERK_EFFECT: "[character_interaction|E]: Gây 1 [POD_superficial_damage_with_box|E] lên toàn bộ [knights|E] của mục tiêu.\n#flavor Mokolé phát ra một tiếng thét khủng khiếp, đứt đoạn, chứa đầy Cuồng Nộ và nỗi đau của Gaia.#!"
 jointsnakes_mojo_perk_name: "Bùa Chú Rắn Đốt"
 JOINTSNAKES_MOJO_PERK_EFFECT: "#flavor Mokolé có thể ghép lại các phần thân thể đứt rời mà không cần chạm vào chúng.#!"
 wall_of_granite_perk_name: "Tường Đá Granite"
 WALL_OF_GRANITE_PERK_EFFECT: "$unlock_forging_node$ [GetModifier('shards_of_granite_modifier').GetNameWithTooltip]\n#flavor Khi tiếp xúc với đất hoặc đá, Rising Sun có thể triệu hồi một bức tường để tự bảo vệ mình.#!"


 truth_of_olodumare_perk_name: "Sự Thật Của Olodumare"
 TRUTH_OF_OLODUMARE_PERK_EFFECT: "Tốc Độ Tiến Triển [espionage|E]: #P +25%#!\n#flavor Với vai trò thẩm phán của các Bổn Phận, Noonday Sun có thể dễ dàng phân biệt sự thật khỏi dối trá.#!"
 TRUTH_OF_OLODUMARE_REASON: "$truth_of_olodumare_perk_name$: $VALUE|+=0$"
 fangs_of_judgement_perk_name: "Nanh Vuốt Phán Xét"
 FANGS_OF_JUDGEMENT_PERK_EFFECT: "Cơ hội [imprison|E] với một [imprisonment_reason|E]: #P +20%#!\n[revoke|E] Sự Chấp Nhận Tước Vị: #P +10#!\n#flavor Trách nhiệm của Noonday Sun không chỉ là phán xét mà còn phải áp đặt hình phạt lên những kẻ đã sa ngã khỏi địa vị đúng đắn của mình.#!"
 strength_of_purpose_perk_name: "Sức Mạnh Của Mục Đích"
 STRENGTH_OF_PURPOSE_PERK_EFFECT: "#flavor Noonday Sun dùng Ân Huệ này để củng cố bản thân trước ngày tận thế, biến niềm đam mê nóng bỏng và Cuồng Nộ cháy rực thành quyết tâm lạnh lùng, sắt đá.#!"
 tame_sunbeam_perk_name: "Thuần Hóa Tia Nắng"
 TAME_SUNBEAM_PERK_EFFECT: "[character_interaction|E]: Gây 2 [POD_aggravated_damage_with_box|E] lên một nhân vật khác yếu với mặt trời và khiến họ không thể chữa lành trong 5 năm.\n#flavor Mặt trời từ lâu đã là đồng minh kiên trung nhất của Mokolé, và gửi ánh sáng của mình đến khi họ cần nhất.#!"
 clear_mind_perk_name: "Tâm Trí Sáng Suốt"
 CLEAR_MIND_PERK_EFFECT: "#flavor Ân Huệ này khuyến khích sự minh mẫn trong suy nghĩ, bất kể xao lãng nào.#!"
 weak_arm_perk_name: "Cánh Tay Yếu"
 WEAK_ARM_PERK_EFFECT: "#flavor Bằng cách quan sát phong cách chiến đấu của đối phương, Noonday Sun có thể nhanh chóng đánh giá điểm mạnh và điểm yếu của hắn.#!"
 eye_of_the_cobra_perk_name: "Mắt Rắn Hổ Mang"
 EYE_OF_THE_COBRA_PERK_EFFECT: "Ban [GetModifier('POD_mokole_eye_of_the_cobra_modifier').GetNameWithTooltip] cho [knights|E] kẻ thù khi hành động như [commander|E] trong [combat_phase|E], hoặc cho kẻ thù của bạn trong [single_combat_duel_plural|E].\n#flavor Với một ánh nhìn siêu nhiên, kẻ mang dòng máu rồng-thú có thể kéo bất kỳ ai vào trong tầm tấn công.#!"
 raptors_gaze_perk_name: "Ánh Nhìn Chim Săn"
 RAPTORS_GAZE_PERK_EFFECT: "#flavor Một trong hai mắt của Mokolé sáng rực màu đỏ dữ tợn, và mọi kẻ thù bị ánh nhìn của hắn bắt gặp sẽ chịu đựng nỗi đau đớn khủng khiếp.#!"
 wisdom_of_the_sun_perk_name: "Trí Tuệ Của Mặt Trời"
 WISDOM_OF_THE_SUN_PERK_EFFECT: "$unlock_forging_node$ [GetModifier('suns_wisdom_modifier').GetNameWithTooltip].\n#flavor Bằng cách thiền định dưới gương mặt Thần Mặt Trời, Noonday Sun trở thành một kênh dẫn cho trí tuệ của Tellurian, và có thể tìm ra câu trả lời cho hầu như bất kỳ câu hỏi nào.#!"
 sleep_of_the_dragon_perk_name: "Giấc Ngủ Của Rồng"
 SLEEP_OF_THE_DRAGON_PERK_EFFECT: "#flavor Mokolé đi vào trạng thái ngủ hè. Nàng không già đi khi ngủ, dù nàng có thể mơ.#!"


 resist_pain_perk_name: "Chịu Đựng Đau Đớn"
 RESIST_PAIN_PERK_EFFECT: "#flavor Củng cố bản thân bằng mục đích và ý chí, Mokolé khép chặt trước nỗi đau từ những vết thương của nàng.#!"
 rage_of_the_nest_mother_perk_name: "Cuồng Nộ Của Mẹ Tổ"
 RAGE_OF_THE_NEST_MOTHER_PERK_EFFECT: "Nhận một lượt cộng dồn [GetModifier('POD_mokole_rage_of_the_nest_mother_modifier').GetNameWithTooltip] cho mỗi con chưa trưởng thành của bạn.\n#flavor Khi đối mặt với một mối đe dọa nhằm vào thành viên yếu đuối trong gia đình hay bầy con của Mokolé, Setting Sun có thể vượt lên trên giới hạn thông thường của nàng để bảo vệ họ.#!"
 combat_healing_perk_name: "Hồi Phục Trong Chiến Đấu"
 COMBAT_HEALING_PERK_EFFECT: "#flavor Ân Huệ này cho phép kẻ mang dòng máu rồng-thú hàn gắn vết thương của hắn mà không cần nghỉ ngơi hay chần chừ, ngay cả giữa trận chiến.#!"
 warding_dance_perk_name: "Vũ Điệu Trấn Yểm"
 WARDING_DANCE_PERK_EFFECT: "#flavor Đẩy ngọn lửa trong tim vào tứ chi, Setting Sun tự lao mình an toàn xuyên qua hàng ngũ kẻ thù của Gaia.#!"
 clenched_jaw_perk_name: "Hàm Siết Chặt"
 CLENCHED_JAW_PERK_EFFECT: "Có khả năng cao hơn để [imprison|E] [characters|E] sau một [siege|E] hoặc [raid|E] thành công.\n#flavor Kẻ mang dòng máu rồng-thú cắn xuống với sức mạnh đến nỗi gọng kẹp của nàng sẽ không nới lơi cho đến khi nàng chọn buông ra; ngay cả khi chết hàm của nàng vẫn khép chặt.#!"
 armor_of_the_tortoise_perk_name: "Áo Giáp Rùa"
 ARMOR_OF_THE_TORTOISE_PERK_EFFECT: "#flavor Mokolé có thể hình thành một lớp mai cứng quanh da mình, tự bảo vệ khỏi tổn hại.#!"
 clarity_perk_name: "Minh Triệt"
 CLARITY_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$\n#flavor Ân Huệ này cho phép khả năng nhìn xuyên qua sương mù, tối đen như mực, tàng hình, và nhận ra ảo ảnh.#!"
 hand_of_the_earth_lords_perk_name: "Tay Của Các Chúa Đất"
 HAND_OF_THE_EARTH_LORDS_PERK_EFFECT: "Có thể tuyển [GetMaA('earth_elemental').GetName] làm [men_at_arms|E].\n#flavor Bằng cách rút năng lượng từ đất, Setting Sun có thể di chuyển bất kỳ vật thể nào chỉ bằng một cử chỉ hướng về nó.#!"
 halo_of_the_sun_perk_name: "Vành Sáng Mặt Trời"
 HALO_OF_THE_SUN_PERK_EFFECT: "$unlock_forging_node$ [GetModifier('cleansing_sun_modifier').GetNameWithTooltip].\n#flavor Nhân vật nói ra một từ cổ xưa linh thiêng dành cho Helios và ngay lập tức bị bao bọc bởi một quả cầu ánh nắng chói lòa.#!"
 fossilize_perk_name: "Hóa Thạch"
 FOSSILIZE_PERK_EFFECT: "[character_interaction|E]: Đưa một nhân vật vào [GetTrait('torpor').GetName(GetNullCharacter)].\n#flavor Mokolé gửi một kẻ thù vào ký ức bằng cách hóa thạch hắn để răn dạy các thế hệ sau.#!"


 brothers_scent_perk_name: "Hương Của Anh Em"
 BROTHERS_SCENT_PERK_EFFECT: "#flavor Rút ra từ tình huynh đệ chung của mọi sinh vật của Gaia, Mokolé dường như hòa hợp ở bất cứ nơi nào hắn đến.#!"
 spirits_of_laughter_perk_name: "Linh Hồn Của Tiếng Cười"
 SPIRITS_OF_LAUGHTER_PERK_EFFECT: "Ngưỡng [faction_military_power|E] cho [vassals|E]: #P +10%#!\n#flavor Midnight Sun triệu hồi các linh hồn hài hước tốt bụng, làm nhẹ tâm trạng của mọi người.#!"
 FACTION_POWER_SPIRITS_OF_LAUGHTER: "$spirits_of_laughter_perk_name$: $VALUE|+=0$"
 glib_tongue_perk_name: "Lưỡi Lẻo"
 GLIB_TONGUE_PERK_EFFECT: "#flavor Người nghe nghe thấy bất cứ điều gì Mokolé muốn họ nghe. Midnight Sun có thể nói bất cứ điều gì, thậm chí hoàn toàn vô nghĩa, nhưng bất kỳ ai đang nghe sẽ đồng tình hết lòng.#!"
 GLIB_TONGUE_ACCEPTANCE: "$glib_tongue_perk_name$: $VALUE|+=0$"
 dreamspeak_perk_name: "Lời Nói Trong Mộng"
 DREAMSPEAK_PERK_EFFECT: "Tốc Độ Tiến Triển [espionage|E]: #P +25%#!\n#flavor Midnight Sun có thể bước đi giữa những giấc mộng của người khác và vì thế ảnh hưởng đến diễn biến của chúng.#!"
 DREAMSPEAK_REASON: "$dreamspeak_perk_name$: $VALUE|+=0$"
 invisibility_perk_name: "Tàng Hình"
 INVISIBILITY_PERK_EFFECT: "Mở khóa lựa chọn biến hình [GetModifier('POD_shapeshift_form_invisible_modifier').GetNameWithTooltip].\n#flavor Mokolé có thể biến mất khỏi tầm nhìn, dù nàng phải tập trung để duy trì sự tàng hình của mình.#!"
 shadows_by_the_firelight_perk_name: "Bóng Tối Bên Ánh Lửa"
 SHADOWS_BY_THE_FIRELIGHT_PERK_EFFECT: "[character_interaction|E]: Giảm [stress|E] của chính bạn.\n#flavor Midnight Sun triệu hồi bóng tối và mộng mị để dựng sân khấu cho một vở diễn mà các Mokolé khác đóng vai.#!"
 open_sun_bridge_perk_name: "Mở Cầu Mặt Trời"
 OPEN_SUN_BRIDGE_PERK_EFFECT: "[character_interaction|E]: Dịch chuyển đến một Wallow hoặc Caern với vai trò [army_commander] hoặc trong khi [traveling|E].\n#flavor Kẻ mang dòng máu rồng-thú có khả năng mở một cầu mặt trời, có hoặc không có sự cho phép của vật totem của wallow đó.#!"
 take_the_true_form_perk_name: "Nắm Lấy Hình Dạng Thật"
 TAKE_THE_TRUE_FORM_PERK_EFFECT: "[character_interaction|E]: Loại bỏ khả năng biến hình của một nhân vật và khiến họ không thể biến hình trong 10 năm.\n#flavor Midnight Sun có thể ép một sinh thể trở về hình dạng thật của nó.#!"
 fools_luck_perk_name: "Vận May Của Kẻ Ngốc"
 FOOLS_LUCK_PERK_EFFECT: "Ân Huệ này ban cho miễn nhiễm tạm thời với vận rủi."
 thousand_forms_perk_name: "Ngàn Hình Dạng"
 THOUSAND_FORMS_PERK_EFFECT: "Mở khóa nhiều hình dạng biến hình động vật khác nhau.\n$unlock_forging_node$ [GetModifier('beast_rampage_modifier').GetNameWithTooltip].\n#flavor Kẻ mang dòng máu rồng-thú có Ân Huệ này có thể tự biến thành bất kỳ động vật nào có kích thước từ một con chim nhỏ đến một con bò rừng bison.#!"



 sense_magic_perk_name: "Cảm Nhận Ma Thuật"
 SENSE_MAGIC_PERK_EFFECT: "Bạn không còn có thể bị $POD_splat_wraith_plural$ ám nữa.\n#flavor Kẻ mang dòng máu rồng-thú có thể cảm nhận được nhịp đập và luồng chảy của năng lượng huyền bí, bất kể nguồn gốc của chúng.#!"
 mokole_spirit_speech_perk_name: "Lời Nói Linh Hồn"
 MOKOLE_SPIRIT_SPEECH_PERK_EFFECT: "#flavor Ân Huệ này ban cho khả năng hiểu ngôn ngữ của thế giới linh hồn, cho phép Mokolé hiểu rõ và nói chuyện với bất kỳ linh hồn nào hắn gặp.#!"
 command_spirit_perk_name: "Chỉ Huy Linh Hồn"
 COMMAND_SPIRIT_PERK_EFFECT: "Có thể tuyển [GetMaA('jagglings').GetName] làm [men_at_arms|E].\n#flavor Shrouded Sun có thể ra lệnh cho các linh hồn mà nàng gặp và mong đợi sự tuân phục.#!"
 COMMAND_SPIRIT_REASON: "$command_spirit_perk_name$: $VALUE|+=0$"
 umbral_shadow_wings_perk_name: "Cánh Bóng Tối Umbra"
 UMBRAL_SHADOW_WINGS_PERK_EFFECT: "#flavor Ân Huệ này cho phép một Mokolé bay xuyên qua "khoảng không" của Umbra, bỏ qua các con đường và lối đi khác nhau để chọn một tuyến đường trực tiếp hơn từ cõi này sang cõi khác.#!"
 breaking_the_tomorrow_wall_perk_name: "Đập Vỡ Tường Ngày Mai"
 BREAKING_THE_TOMORROW_WALL_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$\nBạn sẽ nhận được thông báo nếu ai đó có ý định sát hại bạn bè hoặc gia đình của bạn.\n#flavor Mokolé bơi ngược dòng sông Mnesis, bắt gặp những hình ảnh mơ hồ của tương lai.#!"
 call_water_spirit_perk_name: "Gọi Linh Hồn Nước"
 CALL_WATER_SPIRIT_PERK_EFFECT: "Có thể tuyển [GetMaA('water_elemental').GetName] làm [men_at_arms|E].\n#flavor Mokolé có khả năng gọi một linh hồn nước đến trợ giúp nàng.#!"
 walk_the_matres_mind_perk_name: "Bước Vào Tâm Trí Của Matre"
 WALK_THE_MATRES_MIND_PERK_EFFECT: "Có thể tự thân đi vào [umbra|E].\n#flavor Ân Huệ này cho phép Mokolé tự thân đi vào Umbra mà không cần bỏ lại một thân xác bất lực và không cần dây bạc.#!"
 gorgons_gaze_perk_name: "Ánh Nhìn Gorgon"
 GORGONS_GAZE_PERK_EFFECT: "[character_interaction|E]: Giảm [prowess|E] của một nhân vật và trao cho họ đặc điểm [GetTrait('scaly').GetName(GetNullCharacter)] [trait|E].\n#flavor Mắt Mokolé rực cháy đỏ, vàng và xanh khi sức mạnh huyền thoại đáng sợ này biến thịt sống thành đá chỉ bằng một cái nhìn.#!"
 mokole_living_treasure_perk_name: "Kho Báu Sống"
 MOKOLE_LIVING_TREASURE_PERK_EFFECT: "Chi phí [buy_claim_interaction|E] và [buy_artifact_claim_interaction|E]: #P -25%#!\n$unlock_forging_node$ [GetModifier('inscribed_legacy_modifier').GetNameWithTooltip].\n#flavor Một Shrouded Sun có thể thuyết phục linh hồn của một kho báu kể lại lịch sử và truyền thuyết của nó.#!"
 malleable_spirit_perk_name: "Linh Hồn Dẻo Dai"
 MALLEABLE_SPIRIT_PERK_EFFECT: "#flavor Mokolé có thể thay đổi hình dạng hoặc mục đích của một linh hồn.#!"



 mercy_perk_name: "Lòng Thương Xót"
