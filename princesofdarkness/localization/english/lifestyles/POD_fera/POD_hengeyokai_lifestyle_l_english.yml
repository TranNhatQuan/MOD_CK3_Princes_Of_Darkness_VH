l_english:

 hengeyokaigifts_lifestyle_name: "Hengeyokai"
 hengeyokaigifts_lifestyle_desc: "Tập trung vào các sức mạnh đến từ các Triều Đình Dã Thú."
 hengeyokaigifts_lifestyle_highlight_desc: "Nhờ [GetModifier('POD_gnosis_5_modifier').GetNameWithTooltip], bạn nhận thêm #P [GetPlayer.Custom('GetEducationLifestylePercentageBoost')]#! [experience|E] trong Lối sống này."
 monthly_hengeyokaigifts_lifestyle_xp_gain_mult: "[experience|E] [lifestyle|E] Ân Huệ Hengeyokai Hàng tháng"
 hengeyokaigifts_focus: "Trọng tâm Ân Huệ Hengeyokai"
 hengeyokaigifts_focus_modifier: "[GetFocus('hengeyokaigifts_focus').GetName]"
 hengeyokaigifts_focus_desc: "Sức Mạnh Trong Đoàn Kết."
 hengeyokaigifts_focus_effect_desc: "Tập trung vào Ân Huệ Hengeyokai mang lại:"
 hengeyokaigifts_court_visible: "Ân Huệ Triều Đình"


 mindspeak_perk_name: "Thần Giao"
 MINDSPEAK_PERK_EFFECT: "Có thể học thêm #V 2#! [languages|E] mà không bị phạt.\n#flavor Ân Huệ này thường được chia sẻ giữa những kẻ mới đến các Triều Đình, xem như hình thức giao tiếp phổ quát cơ bản nhất.#!"
 create_element_perk_name: "Tạo Nguyên Tố"
 CREATE_ELEMENT_PERK_EFFECT: "#flavor Hengeyokai hòa hợp với các nguyên tố phù hợp có thể triệu hồi "moon" (trăng) như một nguyên tố; nó hiện ra dưới dạng ánh trăng thuần khiết, mang lại sự chiếu sáng và thường có chút an ủi.#!"
 courtly_speech_perk_name: "Ngôn Ngữ Cung Đình"
 COURTLY_SPEECH_PERK_EFFECT: "#flavor Khi hành động như một sứ giả, hengeyokai thấy rằng lịch sự nhất là nói bằng ngôn ngữ của chủ nhà mình. Ân Huệ này cho phép một hengeyokai nói bất kỳ ngôn ngữ Dòng Sinh Biến Đổi nào như thể anh ta là người bản xứ.#!"
 blaze_talons_perk_name: "Bùng Móng Vuốt"
 BLAZE_TALONS_PERK_EFFECT: "#flavor Một trong những thuật chiến đấu của hengeyokai, Ân Huệ này cho phép kẻ biến hình đốt cháy tay, chân hoặc cánh của mình, khiến các cú đánh của anh ta mang theo sự hung tàn của lửa hoang.#!"
 sense_imbalance_perk_name: "Cảm Ứng Mất Cân Bằng"
 SENSE_IMBALANCE_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$\n[court_chaplain|E] của bạn nhanh hơn #P 25%#! khi thực hiện [councillor_task|E] [convert_county|E].\n#flavor Ân Huệ này cho phép hengeyokai tập trung nhận thức của mình vào sự cân bằng giữa Tam Vị, phát hiện bất kỳ sự mất cân bằng năng lượng nào tại địa phương - dù là của $glossary_triat$, hay của Âm, Dương và Yomi.#!"
 waking_dream_of_unity_perk_name: "Mộng Thức Tỉnh Hợp Nhất"
 WAKING_DREAM_OF_UNITY_PERK_EFFECT: "#flavor Ân huệ này đặt một nhóm Hengeyokai vào trạng thái giao tiếp im lặng bằng cách gửi những giấc mộng bước đi vào tâm trí họ. Nó được dùng để giao tiếp với cả triều đình cùng một lúc.#!"
 part_the_wall_perk_name: "Xuyên Vách Ngăn"
 PART_THE_WALL_PERK_EFFECT: "#flavor Ân huệ này được chia sẻ giữa các hengeyokai không thể bước sang ngang theo cách thông thường. Nó cho phép họ bước vào Vùng Đất Gương dễ dàng như những người anh em may mắn hơn của họ.#!"
 exorcism_perk_name: "Trừ Tà"
 EXORCISM_PERK_EFFECT: "Có thể [POD_banish|E] $POD_splat_wraith_plural$ về cõi [umbra|E] bản xứ của họ.\nBạn không còn có thể bị chiếm hữu bởi $POD_splat_wraith_plural$.\n#flavor Các Diêm Ma Vương thường gửi các thuộc hạ linh hồn của mình đến quấy nhiễu các triều đình hengeyokai; do đó, kiến thức trừ tà linh hồn quỷ dữ được chia sẻ rộng rãi giữa các dã thú nhân.#!"
 walking_the_bone_road_perk_name: "Đi Trên Đường Xương"
 WALKING_THE_BONE_ROAD_PERK_EFFECT: "#flavor Hengeyokai có thể bước sang ngang vào Thế Giới Âm dễ dàng như cô ấy thường làm với Thế Giới Dương.#!"
 way_of_ten_thousand_cities_perk_name: "Đạo Vạn Thành"
 WAY_OF_TEN_THOUSAND_CITIES_PERK_EFFECT: "Giảm chi phí cơ bản khi thiết lập [culture_traditions|E] mới #P 25%#!.\n#flavor Hengeyokai có thể hòa nhập nhuần nhuyễn vào bất kỳ văn hóa nào, bất kể văn hóa đó kỳ lạ hay xa lạ đến đâu.#!"














