l_english:

####Choleric

##Vicissitude

 malleable_visage_perk_name: "Dung Nhan Biến Ảo"
 MALLEABLE_VISAGE_PERK_EFFECT: "[character_interaction|E]: [fleshcrafting|E].\n\n#flavor Kẻ sử dụng có thể biến đổi cơ thể mình theo những cách đơn giản, mang tính thẩm mỹ. Hắn có thể trở nên cao hơn hoặc vạm vỡ hơn. Hắn có thể đổi giọng nói bằng cách tái tạo lại thanh quản. Hắn có thể mang làn da mới, màu mắt mới, và nhiều thứ khác nữa.#!"
 transmogrify_the_mortal_clay_perk_name: "Biến Hóa Đất Sét Trần Tục"
 TRANSMOGRIFY_THE_MORTAL_CLAY_PERK_EFFECT: "Có thể chỉnh sửa @flesh_icon!Thịt trong lúc [fleshcrafting|E].\n\n#flavor Giờ đây ma cà rồng có thể thực hiện những biến đổi kịch tính lên phần thịt, không chỉ trên bản thân hắn, mà còn trên bất kỳ đối tượng nào hắn có thể khống chế đủ lâu để truyền đạt ý tưởng của mình.#!"
 rend_the_osseous_frame_perk_name: "Xé Toạc Khung Xương"
 REND_THE_OSSEOUS_FRAME_PERK_EFFECT: "Có thể chỉnh sửa @bone_icon!Xương trong lúc [fleshcrafting|E].\nCó thể tuyển mộ [GetMaA('szlachta').GetName] làm [men_at_arms|E].\n\n#flavor Ở giai đoạn tinh thông này, ma cà rồng có thể điều khiển xương. Khi kết hợp với Biến Hóa Đất Sét Trần Tục, những cơn ác mộng trở thành hiện thực.#!"
 awaken_the_zulo_shape_perk_name: "Đánh Thức Hình Dạng Zulo"
 AWAKEN_THE_ZULO_SHAPE_PERK_EFFECT: "Mở khóa lựa chọn biến hình [GetModifier('POD_shapeshift_form_zulo_modifier').GetNameWithTooltip].\n\n#flavor Khi nghĩ về những khu rừng nguyên sơ của Transylvania, ý nghĩ về ác quỷ ám ảnh thường hiện lên trong tâm trí. Nguồn cảm hứng cho điều đó chính là hình dạng zulo. Một cơn ác mộng của vảy và lớp lông nhớp nháp cùng những hàng gai dọc theo cơ thể.#!"
 the_body_impolitic_perk_name: "Xác Thịt Phi Chính Trị"
 THE_BODY_IMPOLITIC_PERK_EFFECT: "#flavor Kẻ sử dụng có thể đầu tư một phần tri giác của mình vào chính xác thịt của hắn, rồi cắt lìa nó để làm theo ý mình.#!"
 bloodform_perk_name: "Hình Dạng Huyết"
 BLOODFORM_PERK_EFFECT: "Mở khóa lựa chọn biến hình [GetModifier('POD_shapeshift_form_blood_modifier').GetNameWithTooltip].\n\n#flavor Một ma cà rồng có năng lực này có thể biến đổi cơ thể mình về mặt vật lý thành huyết dịch có tri giác. Loại máu này về mọi mặt giống hệt với vitae bình thường của ma cà rồng, có thể dùng để tạo ghoul hoặc thiết lập ràng buộc máu.#!"
 inner_mastery_perk_name: "Tinh Thông Nội Thể"
 INNER_MASTERY_PERK_EFFECT: "#flavor Năng lực này cho phép ma cà rồng điều khiển các cơ quan và dịch thể của mình. Các cơ quan có thể dễ dàng tái tạo hình dạng và các dịch thể độc hại bị đẩy ra khỏi cơ thể.#!"
 vicissitudeadvanced_perk_name: "Vicissitude Cao Cấp"
 body_arsenal_perk_name: "Vũ Khí Xác Thịt"
 BODY_ARSENAL_PERK_EFFECT: "$unlock_forging_node$ Ngẫu nhiên thêm [GetModifier('body_arsenal_prowess_modifier').GetNameWithTooltip] hoặc [GetModifier('body_arsenal_ghoul_modifier').GetNameWithTooltip].\n\n#flavor Ma cà rồng có thể dùng chính cơ thể mình để tạo ra vũ khí. Điều này vượt xa việc tạo móng vuốt và những thứ tương tự, nó có thể tạo ra kiếm, chùy, và hầu hết các loại vũ khí cận chiến khác.#!"
 graft_life_to_life_perk_name: "Ghép Sinh Mệnh Vào Sinh Mệnh"
 GRAFT_LIFE_TO_LIFE_PERK_EFFECT: "Có thể tuyển mộ [GetMaA('vozhd').GetName] làm [men_at_arms|E].\n\n#flavor Người tạo hình xác thịt có thể lấy các bộ phận cơ thể từ sinh vật còn sống và ghép chúng lên người khác, còn sống hoặc đã chết, cho phép người nhận sử dụng chi thể mới. Những sinh vật quái dị và đáng sợ khác thường có thể được tạo ra với năng lực này.#!"
 sublimation_of_the_larval_flesh_perk_name: "Thăng Hoa Xác Thịt Ấu Trùng"
 SUBLIMATION_OF_THE_LARVAL_FLESH_PERK_EFFECT: "#flavor Ma cà rồng bao bọc nạn nhân của mình trong một cái kén làm từ chính xác thịt của họ. Sau đó ma cà rồng hình dung ra một hình dạng mới cho nạn nhân, hình dạng mà họ sẽ biến thành khi được giải thoát.#!"
 ##TODO Tzimisce: Unlock the #V Odious Chalice#! transmogrification option.\n\n

 the_last_dracul_perk_name: "Dracul Cuối Cùng"
 THE_LAST_DRACUL_PERK_EFFECT: "Mở khóa lựa chọn biến hình [GetModifier('POD_shapeshift_form_dracul_modifier').GetNameWithTooltip].\n\n#flavor Đáng sợ nhất trong các hình dạng quái dị của Tzimisce, năng lực này cho phép các Rồng mang lấy hình dạng mà biệt danh cổ xưa của họ bắt nguồn từ đó.#!"
 living_testudo_perk_name: "Rùa Sống"
 LIVING_TESTUDO_PERK_EFFECT: "Khi bắt đầu trận chiến, loại bỏ [knight|E] địch có [prowess|E] cao nhất khỏi trận chiến và gây #V [EmptyScope.ScriptValue('POD_base_wound_damage')|V0] [POD_aggravated_damage|E]#! lên họ khi đóng vai trò [commander|E].\n\n#flavor Ma cà rồng bắt lấy một nạn nhân và dùng thuật tạo hình xác thịt và xương phơi bày lưng nạn nhân theo cách khiến cột sống của họ lộ ra ngoài. Nạn nhân sau đó được dùng như một tấm chắn vừa bảo vệ trước các cuộc tấn công vừa có thể tiếp tục bị biến đổi thành những vũ khí kinh hoàng.#!"
 liquefy_the_mortal_coil_perk_name: "Hóa Lỏng Xác Thân Trần Tục"
 LIQUEFY_THE_MORTAL_COIL_PERK_EFFECT: "[character_interaction|E]: Cắt lìa một bộ phận cơ thể của một nhân vật, không thể lành lại trong 10 năm.\n\n#flavor Nạn nhân của năng lực khủng khiếp này bị chính cơ thể của họ phản bội, khi Tzimisce biến đổi thịt và xương của đối phương thành những vũng máu.#!"
 perfect_essence_perk_name: "Bản Chất Hoàn Hảo"
 PERFECT_ESSENCE_PERK_EFFECT: "[fleshcrafting|E] lên bản thân sẽ luôn thành công\nTăng [hunger_with_icon|E] được giải tỏa từ người thường\n$POD_blood_surge_interaction$#! tăng thêm một [skill|E] thêm #P +1#!\n\n#flavor Một Tzimisce có năng lực này gần như có toàn quyền kiểm soát máu và cơ thể của hắn. Hắn có thể biến đổi hoàn hảo hình dạng của chính mình theo ý muốn chỉ bằng một ý nghĩ.#!"
 sculpture_of_the_mind_perk_name: "Điêu Khắc Tâm Trí"
 SCULPTURE_OF_THE_MIND_PERK_EFFECT: "Giờ có thể [fleshcraft|E] bất kỳ ai không có khả năng phòng vệ tinh thần mạnh\n\n#flavor Ở cấp độ này ma cà rồng có khả năng biến đổi xác thịt từ xa. Tiếp xúc vật lý là công cụ của nghệ sĩ hạ đẳng, nghệ thuật thực sự đến từ tâm trí của một Tzimisce, không phải từ đôi tay hắn.#!"



