 LIVING_ROCK_PERK_EFFECT: "#F Tạo hình đất, thay đổi hình dạng hoặc cấu tạo của nó.#!"
 STONESKIN_PERK_EFFECT: "#F Bao phủ một vật thể bằng đá bảo hộ, giúp chúng tự vệ trước sát thương.#!"
 IRONARM_PERK_EFFECT: "Ban [GetModifier('ironarm_perk_modifier').GetNameWithTooltip] [modifier|E] cho [knights|E] đồng minh khi đang giữ vai [commander|E] trong [combat_phase|E] hoặc cho bản thân trong [single_combat_duel_plural|E].\n#F Ban thêm sức mạnh cho một đối tượng, cho họ khả năng di chuyển những tảng đá nặng.#!"
 ART_STASIS_PERK_EFFECT: "Ban [GetModifier('stasis_perk_modifier').GetNameWithTooltip] [modifier|E] cho [knights|E] địch khi đang giữ vai [commander|E] trong [combat_phase|E], hoặc cho đối thủ trong [single_combat_duel_plural|E].\n#F Làm chậm một mục tiêu, khiến họ hầu như không thể di chuyển.#!"
 QUAKE_PERK_EFFECT: "Gây [GetModifier('quake_perk_modifier').GetNameWithTooltip] lên mọi quân chủ phía đối phương khi tham gia [war|E].\n#F Xé toạc mặt đất, gây hại cho người và vật trong khu vực.#!"
 AURA_PERCEPTION_PERK_EFFECT: "#F Tìm hiểu nhiều đặc điểm của một người, như trạng thái cảm xúc và mức độ trung thực, thông qua aura của họ.#!"
 HOLD_PERK_EFFECT: "#F Chặn đứng chuyển động của một vật thể đang bay trước khi nó chạm tới người thi triển.#!"
 ART_TEMPUS_FUGIT_PERK_EFFECT: "#F Cho phép một vật thể di chuyển với tốc độ cực nhanh.#!"
 FRICTION_PERK_EFFECT: "Ban [GetModifier('friction_perk_knight_positive_modifier').GetNameWithTooltip] [modifier|E] cho [knights|E] đồng minh khi đang giữ vai [commander|E] trong [combat_phase|E] hoặc cho bản thân trong [single_combat_duel_plural|E].\nBan [GetModifier('friction_perk_knight_negative_modifier').GetNameWithTooltip] [modifier|E] cho [knights|E] địch khi đang giữ vai [commander|E] trong [combat_phase|E], hoặc cho đối thủ trong [single_combat_duel_plural|E].\n#F Làm nóng hoặc làm lạnh nước trong một vật thể, đến mức sôi lên hoặc đóng thành băng.#!"
 HEALING_WATERS_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn chữa trị cho mục tiêu, hoặc sửa chữa artifact mục tiêu.\n#F Sửa chữa một vật thể hoặc chữa lành cho một người bằng cách rót nước lên vết thương.#!"
 FLAME_PERK_EFFECT: "#F Tạo ra một ngọn lửa với kích cỡ dao động từ một cây nến nhỏ đến một đống lửa lớn.#!"
 TORTURED_HEART_PERK_EFFECT: "#F Tác động vào con tim để chỉnh sửa cường độ của một cảm xúc hiện có.#!"
 ARES_FIST_PERK_EFFECT: "Ban [GetModifier('ares_fist_perk_modifier').GetNameWithTooltip] [modifier|E] cho [knights|E] đồng minh khi đang giữ vai [commander|E] trong [combat_phase|E] hoặc cho bản thân trong [single_combat_duel_plural|E].\n#F Truyền sức mạnh thần thánh để cải thiện khả năng chiến đấu tay đôi.#!"
 STRINGS_OF_THE_SOUL_PERK_EFFECT: "Mở khóa [scheme|E] [GetScheme('PODsoul_bridge').GetTypeName].\n#F Tạo ra một cảm xúc từ không khí, và cấy nó vào mục tiêu.#!"
 INFERNO_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn ban [GetModifier('firebombs_modifier').GetNameWithTooltip] hoặc [GetModifier('firespewer_modifier').GetNameWithTooltip] cho mục tiêu.\n#F Cho phép kiểm soát hoàn toàn một ngọn lửa, tạo hình và uốn nó theo ý muốn của người dùng.#!"
 MARATHON_PERK_EFFECT: "#F Giảm thời gian di chuyển, nhưng nghịch lý là người dùng lại không có vẻ đi nhanh hơn.#!"
 CONCEAL_CONFUSE_PERK_EFFECT: "Ban [GetModifier('conceal_confuse_perk_knight_modifier').GetNameWithTooltip] [modifier|E] cho [knights|E] địch khi đang giữ vai [commander|E] trong [combat_phase|E], hoặc cho đối thủ trong [single_combat_duel_plural|E].\nBan [GetModifier('conceal_confuse_perk_commander_modifier').GetNameWithTooltip] [modifier|E] cho [commanders|E] địch khi đang giữ vai [commander|E] trong [combat_phase|E].\nGây [GetModifier('conceal_confuse_perk_ruler_modifier').GetNameWithTooltip] lên mọi quân chủ phía đối phương khi tham gia [war|E].\n#F Tạo ra một ảo ảnh đơn giản, tĩnh, đánh lừa một hoặc hai giác quan.#!"
 FLIGHT_PERK_EFFECT: "#F Cho phép mục tiêu bay, cất cánh lên không như thể có cánh.#!"
 ILLUSION_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn khiến nạn nhân nhận [GetTrait('blind').GetName( GetPlayer )], [GetModifier('sensory_deprivation_deaf_modifier').GetNameWithTooltip]...\n#F Tạo ra một ảo ảnh phức tạp hơn, có khả năng đánh lừa nhiều giác quan khác nhau.#!"
 ART_PHANTASM_PERK_EFFECT: "#F Tạo ra những ảo ảnh sống mạnh mẽ, hoạt động như những Chimerae thực thụ.#!"
 SOLARIUM_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn ban modifier cây cối cho lãnh địa mục tiêu.\n#F Tạo ra một sự thay đổi về kích thước, sức khỏe, hoặc hình dạng của một loài cây sống.#!"
 BABEL_PERK_EFFECT: "Chi phí [buy_claim_interaction|E] và [buy_artifact_claim_interaction|E]: #P -50%#!\n#F Cho phép người dùng nói chuyện với bất kỳ vật thể nào như thể nó có trí tuệ con người.#!"
 COALESCE_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn nhận vàng từ glamour.\n#F Biến vật chất cây cối thành bất kỳ vật thể nào mong muốn.#!"
 WEB_OF_LIFE_PERK_EFFECT: "#F Bằng cách xem xét một khía cạnh của một hệ sinh thái liên kết chặt chẽ, có thể xác định được các khía cạnh của tương lai của nó.#!"
 MOLD_PERK_EFFECT: "$unlock_forging_node$ Hy sinh một [prisoner|E] để cải thiện [artifact|E] dựa trên các [traits|E] của người bị hy sinh\n#F Biến một loại vật chất sống thành loại khác, mà không giết chết nó trong quá trình đó.#!"

 ### Wu Tan ###

 game_concept_wu_tan_lifestyle: "Wu Tan"
 game_concept_wu_tan_lifestyle_desc: "Wu Tan là các Thuật của những Fae kỳ lạ phương Đông: Hsien. Mỗi Thuật xoay quanh một trong các nguyên tố cổ điển của phương Đông."
 game_concept_metal_soul: "Kim Hồn"
 game_concept_metal_soul_desc: "Kim Hồn chứa đựng ý thức công lý, sự trung thực và tinh thần công bằng của một người. Các thẩm phán, người thi hành công lý tự phát, nhà hoạt động nhân quyền và người ủng hộ dân quyền thường có Kim Hồn mạnh."
 game_concept_wood_soul: "Mộc Hồn"
 game_concept_wood_soul_desc: "Mộc Hồn chịu trách nhiệm về đạo đức của một người. Nó chi phối dục vọng và lòng trắc ẩn. Mọi sinh vật sống đều có Mộc Hồn. Dù sự sống nuôi dưỡng bằng sự sống, nó cũng bao hàm lòng trắc ẩn. Các y tá, vận động viên, bác sĩ và hầu hết các bà mẹ đều có Mộc Hồn mạnh."
 game_concept_water_soul: "Thủy Hồn"
 game_concept_water_soul_desc: "Thủy Hồn bao hàm niềm tin của một người vào người khác và vào các quyền năng của vũ trụ. Nó cũng tương ứng với lòng trung thành và sự tự tin. Các nhà tư bản, trùm tội phạm, và những ai yêu thích trở thành đối tượng của lòng trung thành và quyền lực đều có Thủy Hồn mạnh, cũng như những người thực sự sùng đạo."
 game_concept_fire_soul: "Hỏa Hồn"
 game_concept_fire_soul_desc: "Hỏa Hồn điều chỉnh ý thức về sự đúng mực và hiểu biết về phép tắc, quy tắc ứng xử. Nó chi phối ý thức về bổn phận và sự sốt sắng trong việc thực thi luật lệ xã hội. Cảnh sát và cả các quan chức chính quyền đều có thể có Hỏa Hồn mạnh."
 game_concept_earth_soul: "Địa Hồn"
 game_concept_earth_soul_desc: "Địa Hồn của một sinh vật có tri giác chi phối sự khôn ngoan, sự thấu hiểu, sự lĩnh hội và lương tri. Nó chi phối khả năng đưa ra những lựa chọn sáng suốt. Các nhà lãnh đạo, tư tế và cố vấn thường có Địa Hồn mạnh mẽ."

