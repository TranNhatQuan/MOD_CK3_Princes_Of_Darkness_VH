 READ_METAL_SOUL_PERK_EFFECT: "#F Giao cảm với [Glossary('Kim Hồn','game_concept_metal_soul_desc')] của một người sẽ cho bạn biết người đó đã nói thật hay đang phớt lờ điều chính đáng.#!"
 COMMUNE_WITH_METAL_PERK_EFFECT: "#F Như các vật thể nguyên tố khác, những vật bằng kim loại có giác quan hạn chế và cách giao tiếp hạn chế.#!"
 TIEH_TAN_SPEAK_WITH_JIMU_TENNO_PERK_EFFECT: "#F Nhà Giả Kim có thể nói chuyện với các Kim Linh, miễn là có thể gặp được chúng.#!"
 NURTURE_DIMINISH_METAL_SOUL_PERK_EFFECT: "#F Làm lớn [Glossary('Kim Hồn','game_concept_metal_soul_desc')] có thể khiến một người nói thật. Làm suy giảm nó khiến việc nói dối dễ dàng hơn.#!"
 INCREASE_DECREASE_METAL_ATTRIBUTES_PERK_EFFECT: "#F Nhà Giả Kim có thể ảnh hưởng đến Nhận Thức hoặc Khéo Tay của mục tiêu.#!"
 TIEH_TAN_SUMMON_THE_DRAGON_BOAT_PERK_EFFECT: "#F Gọi một Thuyền Rồng liên quan đến Kim rất hữu ích khi Long Mạch mà nó đi theo đã bị đường sắt che phủ, hoặc nếu Ổ Rồng đến hay đi liên quan đến Kim hoặc Công Lý.#!"
 SUMMON_DISPEL_TIEH_SHEN_PERK_EFFECT: "Có thể tuyển [GetMaA('metal_elemental').GetName] làm [men_at_arms|E].\n#F Một Nhà Giả Kim Kim có thể triệu hồi hoặc xua tán một linh hồn kim loại.#!"
 TIEH_TAN_THE_ENFOLDED_OBJECT_PERK_EFFECT: "#F Kim loại có lẽ là vật dễ ẩn giấu thứ hai và cũng rất thực dụng.#!"
 METAL_FORM_PERK_EFFECT: "Mở khóa lựa chọn biến hình [GetModifier( 'POD_shapeshift_form_metal_modifier' ).GetNameWithTooltip|L].\n#F Đây là một I Chih phổ biến cho cả Chu-ih-yu và Tanuki, những kẻ có xu hướng thiên về võ thuật và việc phòng thủ bằng lớp da kim loại hay sức mạnh nghiền nát của nắm đấm kim loại đều rất hữu ích.#!"
 PATHS_OF_IRON_PERK_EFFECT: "#F Dây đồng, hệ thống ống dẫn kim loại, hay dầm thép của các tòa nhà... Đường Kim có rất nhiều, ít nhất là trong các thành phố.#!"
 TIEH_TAN_AWAKEN_TRUE_JADE_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn đánh thức [Glossary('Ngọc Thật','game_concept_true_jade_desc')] để lưu trữ Chi.\n#F Nhà Giả Kim có thể đánh thức Ngọc Trắng.#!"
 MOVE_METAL_PERK_EFFECT: "#F Một mẹo tiện lợi cho chiến binh bị đánh rơi vũ khí khỏi tay.#!"
 SHAPE_SUNDER_METAL_PERK_EFFECT: "#F Những đại sư của Giả Kim Thuật Kim loại là những nghệ nhân nổi tiếng, tạo ra những thanh kiếm và vũ khí tuyệt đẹp khác.#!"
 SUMMON_DISPEL_METAL_PERK_EFFECT: "#F Khi bạn cần một vũ khí và không quan tâm mình nhận được thứ gì, khả năng này có thể rất hữu ích.#!"
 TIEH_TAN_EXCHANGE_PROPERTIES_PERK_EFFECT: "#F Ở cấp độ quyền năng này, một Đại Sư có thể làm cho thép mềm như vàng hoặc vàng cứng như thép.#!"
 TRANSMUTE_METAL_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn tiêu Chi để nhận [gold|E].\n#F Với khả năng này, kim loại có thể được biến hoàn toàn thành một kim loại khác.#!"
 READ_WOOD_SOUL_PERK_EFFECT: "#F [Concept('wood_soul','Mộc Hồn')|E] truyền đạt trạng thái sức khỏe của một sinh vật, cùng nhiều điều khác.#!"
 COMMUNE_WITH_WOOD_PERK_EFFECT: "#F Như hầu hết các nguyên tố, gỗ và các sự tương ứng của nó chỉ có thể cung cấp thông tin hạn chế.#!"
 LIN_TAN_SPEAK_WITH_JIMU_TENNO_PERK_EFFECT: "#F Nhà Giả Kim có thể nói chuyện với Lâm Thần, miễn là chúng hiện diện hoặc hsien có khả năng xuyên qua Tường Ngăn.#!"
 NURTURE_DIMINISH_WOOD_SOUL_PERK_EFFECT: "#F Làm lớn Hồn có thể tạo ra dục vọng, còn làm suy giảm nó có thể gây ra sự bất lực.#!"
 INCREASE_DECREASE_WOOD_ATTRIBUTES_PERK_EFFECT: "#F Nhà Giả Kim có thể tăng hoặc giảm Thuộc Tính Ngoại Hình hoặc Sức Mạnh.#!"
 LIN_TAN_SUMMON_THE_DRAGON_BOAT_PERK_EFFECT: "#F Nhà Giả Kim có thể triệu hồi một thuyền rồng để đưa họ đi theo một long mạch từ ổ rồng này sang ổ rồng kế tiếp.#!"
 SUMMON_DISPEL_LIN_SHEN_PERK_EFFECT: "Có thể tuyển [GetMaA('wood_elemental').GetName] làm [men_at_arms|E].\n#F Nhà Giả Kim có thể triệu hồi và xua tán Mộc Linh, bao gồm linh hồn thực vật, nhưng không bao gồm động vật.#!"
 LIN_TAN_THE_ENFOLDED_OBJECT_PERK_EFFECT: "#F Nhà Giả Kim có thể giấu một vật thuộc Mộc bên trong cơ thể mình.#!"
 WOOD_FORM_PERK_EFFECT: "Mở khóa lựa chọn biến hình [GetModifier( 'POD_shapeshift_form_wood_modifier' ).GetNameWithTooltip|L].\n#F Nhà giả kim có thể biến toàn bộ hoặc một phần cơ thể thành gỗ, cho phép họ chịu hoặc gây thêm sát thương trong giao đấu tay đôi.#!"
 PATHS_OF_WOOD_PERK_EFFECT: "#F Những mạng lưới rễ cây, nấm và rêu tinh vi tạo thành một con đường lớn mà nhà giả kim có thể di chuyển qua.#!"
 LIN_TAN_AWAKEN_TRUE_JADE_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn đánh thức [Glossary('Ngọc Thật','game_concept_true_jade_desc')] để lưu trữ Chi.\n#F Nhà giả kim có thể đánh thức Ngọc Xanh Dương hoặc Ngọc Xanh Lục.#!"
 MOVE_WOOD_PERK_EFFECT: "#F I Chih này giúp di chuyển các vật thể bằng gỗ theo cách tương tự như thuật thần giao di vật.#!"
 SHAPE_SUNDER_WOOD_PERK_EFFECT: "#F Các nghệ nhân gỗ có thể dùng khả năng này để tạo ra những tác phẩm tuyệt đẹp hoặc phá hủy vật thể bằng gỗ.#!"
 SUMMON_DISPEL_WOOD_PERK_EFFECT: "#F Shinma có thể triệu hồi hoặc xua tán gỗ.#!"
 LIN_TAN_EXCHANGE_PROPERTIES_PERK_EFFECT: "#F Ở cấp độ này, gỗ sồi có thể được làm mềm như gỗ thông hoặc cánh hoa, hay cỏ có thể cứng như gỗ sồi mà vẫn mỏng manh như vậy.#!"
 TRANSMUTE_WOOD_PERK_EFFECT: "#F Biến một loại gỗ thành loại gỗ khác có thể có công dụng hạn chế, nhưng nếu cơ thể con người chịu sự chi phối của Nguyên Tố này, người ta có thể biến một cây thành người.#!"
 READ_WATER_SOUL_PERK_EFFECT: "#F Giao cảm với [water_soul|E] giúp đo lường lòng trung thành, sự tự tin, v.v... của một người.#!"
 COMMUNE_WITH_WATER_PERK_EFFECT: "#F Mọi nguyên tố vật lý đều có giới hạn khi giao tiếp. Nước có thể nói về hương vị của người đang tắm trong nó, mức độ tự tin của họ, hoặc liệu họ có bỏ rơi người khác chết đuối trong nước cùng họ vì người đó bất trung hay không.#!"
 SHUI_TAN_SPEAK_WITH_JIMU_TENNO_PERK_EFFECT: "#F Với I Chih này, nhà giả kim có thể nói chuyện với Thủy Thần.#!"
 NURTURE_DIMINISH_WATER_SOUL_PERK_EFFECT: "#F Những lãnh đạo khôn khéo dùng hiệu ứng này để gây dựng lòng trung thành ở người theo mình hoặc để đánh cắp người theo của kẻ khác về cho bản thân.#!"
 INCREASE_DECREASE_WATER_ATTRIBUTES_PERK_EFFECT: "#F Với các câu chú này, Nhà Giả Kim có thể ban phước hoặc nguyền rủa một mục tiêu bằng cách thay đổi Thuộc Tính Thủ Đoạn hoặc Thể Lực của họ.#!"
 SHUI_TAN_SUMMON_THE_DRAGON_BOAT_PERK_EFFECT: "#F Một nhà giả kim sẽ dùng Thủy Đàn để triệu hồi Thuyền Rồng nếu Long Mạch đi qua nước hoặc bầu trời.#!"
 SUMMON_DISPEL_SHUI_SHEN_PERK_EFFECT: "Có thể tuyển [GetMaA('water_elemental').GetName] làm [men_at_arms|E].\n#F Với khả năng này, nhà giả kim có thể thực hiện một số quyền kiểm soát đối với Thủy Thần.#!"
 SHUI_TAN_THE_ENFOLDED_OBJECT_PERK_EFFECT: "#F Đây có vẻ là một khả năng khá khó dùng với Nước, nhưng có thể rất hữu ích trong các hiệu ứng đoàn thể, chẳng hạn như giấu bình đựng nước.#!"
 WATER_FORM_PERK_EFFECT: "Mở khóa lựa chọn biến hình [GetModifier( 'POD_shapeshift_form_water_modifier' ).GetNameWithTooltip|L].\n#F Theo phần thảo luận về Wu Tan, các hình dạng nguyên tố vẫn tuân theo quy luật vật lý.#!"
 PATHS_OF_WATER_PERK_EFFECT: "#F Di chuyển qua nước rõ ràng là một điều tiện lợi, và với những ai chịu được sự khó chịu của nó, hệ thống cống rãnh có ở mọi nơi trong thành phố.#!"
 SHUI_TAN_AWAKEN_TRUE_JADE_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn đánh thức [Glossary('Ngọc Thật','game_concept_true_jade_desc')] để lưu trữ Chi.\n#F Nhà Giả Kim có thể đánh thức Ngọc Đen.#!"
 MOVE_WATER_PERK_EFFECT: "#F Với I Chih này, Nhà Giả Kim có thể gây ra lở đất, ngăn dòng máu chảy trong mục tiêu, hoặc nhấc nước ra khỏi một bể bơi để cứu nạn nhân đang chết đuối, và nếu đã quá muộn, họ có thể rút nước ra khỏi phổi của nạn nhân.#!"
 SHAPE_SUNDER_WATER_PERK_EFFECT: "#F Rẽ một vùng biển là điều dễ nghĩ đến. Người ta cũng có thể khiến nước vươn ra và túm lấy ai đó để dìm chết họ. Điêu khắc băng cũng dễ dàng với I Chih này.#!"
 SUMMON_DISPEL_WATER_PERK_EFFECT: "#F Xua tán không khí khỏi phổi của ai đó có thể gây tàn phá khủng khiếp, và loại bỏ nó khỏi không gian phía sau ai đó có thể tạo ra hiệu ứng chân không rất hữu ích.#!"
 SHUI_TAN_EXCHANGE_PROPERTIES_PERK_EFFECT: "#F Với hiệu ứng này, nước ngọt có thể được cho điểm đông băng như nước biển, hoặc một loại khí độc có thể trở nên không nguy hại hơn hơi nước.#!"
 TRANSMUTE_WATER_PERK_EFFECT: "#F Có thể biến nước hoặc nước muối thành máu rất tiện lợi khi không có vật tư cấp cứu gần đó.#!"
 READ_FIRE_SOUL_PERK_EFFECT: "#F Khi giao cảm với một [Glossary('Hỏa Hồn','game_concept_fire_soul_desc')], shinma có thể xác định những ý nghĩa ẩn giấu của phép tắc và các vi phạm của nó.#!"
 COMMUNE_WITH_FIRE_PERK_EFFECT: "#F Lửa tự thân là một nguyên tố khó giao cảm vì nó không ở một nơi lâu. Sét đánh, cháy rừng... chúng đều tồn tại ngắn ngủi.#!"
 HOU_TAN_SPEAK_WITH_JIMU_TENNO_PERK_EFFECT: "#F Nhà giả kim có thể nói chuyện với bất kỳ Hầu Thần nào họ gặp được.#!"
 NURTURE_DIMINISH_FIRE_SOUL_PERK_EFFECT: "#F Bằng cách làm suy giảm [Glossary('Hỏa Hồn','game_concept_fire_soul_desc')], Nyan có thể làm cho một người dễ bị lung lay trước sự quyến rũ của họ hơn, còn Chu Jung có thể làm lớn [Concept('fire_soul','Hỏa Hồn')|E] của cung đình mình để tạo ra hiệu ứng gần giống cấp độ đầu tiên của Sovereign.#!"
 INCREASE_DECREASE_FIRE_ATTRIBUTES_PERK_EFFECT: "#F Bằng cách tăng Sức Hút và Trí Xảo, Nhà Giả Kim có thể làm cho bản thân nổi tiếng và nhanh nhạy như các diễn viên võ thuật lớn, hoặc bằng cách giảm chúng, làm cho mục tiêu trở nên vô cùng vụng về về mặt xã hội đến mức không bao giờ phục hồi được vị thế của mình trong mắt cung đình.#!"
 HOU_TAN_SUMMON_THE_DRAGON_BOAT_PERK_EFFECT: "#F Với I Chih này, nhà giả kim có thể triệu hồi một Thuyền Rồng để di chuyển theo các Long Mạch của Ánh Sáng hoặc Dung Nham.#!"
 SUMMON_DISPEL_HOU_SHEN_PERK_EFFECT: "Có thể tuyển [GetMaA('fire_elemental').GetName] làm [men_at_arms|E].\n#F Như tên gọi của nó, Nhà Giả Kim có thể xua tán hoặc triệu hồi một nguyên tố lửa.#!"
 HOU_TAN_THE_ENFOLDED_OBJECT_PERK_EFFECT: "#F Đáng tiếc, gần như không thể để một Nhà Giả Kim Hỏa dùng khả năng này mà không gây ra hiệu ứng pha trộn. Thêm vào đó, không đoàn thể nào của Hỏa đặc biệt giỏi trong việc lưu trữ Hỏa. Công nghệ, như điện thoại di động, máy tính hay đèn pin, thường cần cả Giả Kim Thuật Hỏa và Kim để tác động, và điều này gây ra khó khăn riêng vì Hỏa Khắc Kim.#!"
 FIRE_FORM_PERK_EFFECT: "Mở khóa lựa chọn biến hình [GetModifier( 'POD_shapeshift_form_fire_modifier' ).GetNameWithTooltip|L].\n#F Quy tắc chung cho khả năng này nói rằng lửa phải tuân theo quy luật vật lý... nó cần nhiên liệu.#!"
 PATHS_OF_FIRE_PERK_EFFECT: "#F Mặc dù thoạt nhìn điều này có vẻ khá vô dụng (ai cần di chuyển qua lửa ngoại trừ trong một đám cháy?) nhưng khi điện và cáp quang lan rộng khắp Trung Nguyên, các đường Hỏa cũng lan rộng theo.#!"
 HOU_TAN_AWAKEN_TRUE_JADE_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn đánh thức [Glossary('Ngọc Thật','game_concept_true_jade_desc')] để lưu trữ Chi.\n#F Với khả năng này, Nhà Giả Kim Hỏa có thể đánh thức Ngọc Đỏ.#!"
 MOVE_FIRE_PERK_EFFECT: "Không còn nhận vết thương từ lửa.\n#F Mặc dù khả năng này thoạt nhìn có vẻ chỉ giới hạn ở khả năng điều khiển lửa, nhưng khả năng bẻ cong ánh sáng cũng được bao gồm ở cấp độ này, cho phép các hiệu ứng như tàng hình hoặc thậm chí tạo ra ảnh ba chiều và ảo ảnh chỉ liên quan đến thị giác.#!"
 SHAPE_SUNDER_FIRE_PERK_EFFECT: "#F Kết hợp với Giả Kim Thuật Kim, người ta có thể điều khiển các vật thể công nghệ.#!"
 SUMMON_DISPEL_FIRE_PERK_EFFECT: "Gây vết thương cho [knights|E] và [commanders|E] của kẻ địch khi hành động như một [commander|E] trong [combat_phase|E], hoặc lên kẻ địch của bạn trong [single_combat_duel_plural|E], nếu chúng là ma cà rồng (hoặc các sinh vật siêu nhiên khác sợ ánh nắng).\nBan [modifier|E] [GetModifier('summon_dispel_fire_perk_modifier').GetNameWithTooltip] cho [knights|E] của kẻ địch khi hành động như một [commander|E] trong [combat_phase|E], hoặc lên kẻ địch của bạn trong [single_combat_duel_plural|E].\n#F Mặc dù Nhà Giả Kim không thể kiểm soát lửa xuất phát từ đâu, khả năng gọi lửa từ trời hoặc mang ánh sáng, thậm chí ánh nắng đến nơi trước đó chưa có, có những lợi ích riêng.#!"
 HOU_TAN_EXCHANGE_PROPERTIES_PERK_EFFECT: "#F Một người có tư duy khoa học biết rằng Điện được chi phối bởi Hỏa và Điện Từ mới là lực thực sự.#!"
 TRANSMUTE_FIRE_PERK_EFFECT: "#F Ánh sáng thành Lửa. Điện thành Ánh sáng. Ánh sáng thành Nhiệt. Dung nham thành Ánh sáng. Tất cả đều có thể.#!"
 READ_EARTH_SOUL_PERK_EFFECT: "#F Người ta thường nói nhiều hơn hoặc ít hơn những gì họ biết về một chủ đề. Suy ngẫm về [Glossary('Địa Hồn','game_concept_earth_soul_desc')] của một người có thể tiết lộ điều này.#!"
 COMMUNE_WITH_EARTH_PERK_EFFECT: "#F Nhà giả kim có thể nói chuyện với các vật thể thuộc Đất hoặc Đá, v.v... nhưng các vật vô tri không có đầy đủ giác quan như con người.#!"
 DI_TAN_SPEAK_WITH_JIMU_TENNO_PERK_EFFECT: "#F Nhà Giả Kim có thể nói chuyện với Địa Thần.#!"
 NURTURE_DIMINISH_EARTH_SOUL_PERK_EFFECT: "#F Làm lớn [Glossary('Địa Hồn','game_concept_earth_soul_desc')] của một người sẽ giúp họ đưa ra những lựa chọn sáng suốt, còn làm suy giảm nó sẽ khiến việc đưa ra quyết định sáng suốt trở nên khó khăn hơn.#!"
 INCREASE_DECREASE_EARTH_ATTRIBUTES_PERK_EFFECT: "#F Nhà Giả Kim có thể tăng hoặc giảm Thuộc Tính Trí Tuệ của mục tiêu.#!"
 DI_TAN_SUMMON_THE_DRAGON_BOAT_PERK_EFFECT: "#F Nhà Giả Kim có thể triệu hồi phương tiện di chuyển theo một Long Mạch đi qua Đất hoặc núi.#!"
 SUMMON_DISPEL_DI_SHEN_PERK_EFFECT: "Có thể tuyển [GetMaA('earth_elemental').GetName] làm [men_at_arms|E].\n#F Nhà Giả Kim có thể triệu hồi và chỉ huy Địa Thần.#!"
 DI_TAN_THE_ENFOLDED_OBJECT_PERK_EFFECT: "#F Nhà Giả Kim có thể giấu vật thuộc đất bên trong cơ thể mình.#!"
 EARTH_FORM_PERK_EFFECT: "Mở khóa lựa chọn biến hình [GetModifier( 'POD_shapeshift_form_earth_modifier' ).GetNameWithTooltip|L].\n#F Nhà Giả Kim có thể tạm thời biến toàn bộ hoặc một phần cơ thể mình thành Đất.#!"
 PATHS_OF_EARTH_PERK_EFFECT: "#F Nhà Giả Kim có thể di chuyển qua bất kỳ nguyên tố nào liên quan đến Đất.#!"
 DI_TAN_AWAKEN_TRUE_JADE_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn đánh thức [Glossary('Ngọc Thật','game_concept_true_jade_desc')] để lưu trữ Chi.\n#F Nhà Giả Kim có thể đánh thức Ngọc Vàng.#!"
 MOVE_EARTH_PERK_EFFECT: "#F Nhà Giả Kim có thể di chuyển các vật thể bị Đất ràng buộc như bằng thuật thần giao di vật.#!"
 SHAPE_SUNDER_EARTH_PERK_EFFECT: "#F Mặc dù quyền năng này có thể có nhiều ứng dụng sáng tạo, nó cũng có thể được một Komuko đang tức giận dùng để gây động đất, trong khi những Komuko nhân từ có thể tạo ra những con đường mới qua núi.#!"
 SUMMON_DISPEL_EARTH_PERK_EFFECT: "#F Cho những lúc bạn cần viên kim cương lấp lánh trong hầm chứa.#!"
 DI_TAN_EXCHANGE_PROPERTIES_PERK_EFFECT: "#F Với I Chih này, đá có thể được làm mềm như đất sét và kim cương giòn như bột talc.#!"
 TRANSMUTE_EARTH_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn tiêu Chi để nhận [prestige|E].\n#F Với hiệu ứng này, một Hanuman tinh nghịch có thể biến một nắm sỏi thành đá quý... cho đến khi phép thuật hết hiệu lực và người nhận nhận ra mình đã bị lừa.#!"
 ART_SHAPECHANGE_PERK_EFFECT: "Cho phép biến hình thành nhiều dạng động vật khác nhau.\n#F Thay đổi khuôn mặt, giới tính, chủng tộc hoặc loài.#!"
 VISAGE_OF_DEAD_PERK_EFFECT: "#F Hiệu ứng Âm này cho phép hsien thực chất giết chết thân xác mình trong một khoảng thời gian.#!"
 AXIS_OF_TIME_PERK_EFFECT: "#F Hsien có thể làm giảm sự ràng buộc của thời gian lên họ, đẩy nhanh sự chuyển động của bản thân qua thời gian.#!"
 THE_MUTABLE_FURIES_PERK_EFFECT: "#F Hsien có thể điều khiển các giá trị Chi của mình.#!"
 THE_TYPHOONS_EYE_PERK_EFFECT: "#F T'ai Chi mang lại cho shinma quyền năng đi qua bão tố mà không hề hấn gì.#!"
 THE_BENEVOLENT_HAND_OF_JADE_PERK_EFFECT: "#F I Chih này khiến điều khó xảy ra trở nên có thể xảy ra...#!"
 BACKSIDE_OF_THE_MONKEY_KING_PERK_EFFECT: "#F I Chih này khiến điều dễ xảy ra trở nên khó xảy ra...#!"
 FORTIFY_THE_WALL_PERK_EFFECT: "Mở khóa lựa chọn Điều Khiển Tường Ngăn trong bảng [umbra|E].\n#F Người nắm giữ chìa khóa có thể tạm thời củng cố Tường Ngăn của một địa điểm.#!"
 UNLOCK_THE_JADE_PORTAL_PERK_EFFECT: "#F Để mở khóa Tường Ngăn và du hành ra ngoài nó.#!"