 FUDDLE_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn trao [GetModifier( 'fuddle_perk_positive_modifier' ).GetNameWithTooltip|L] hoặc [GetModifier( 'fuddle_perk_negative_modifier' ).GetNameWithTooltip|L] cho mục tiêu.\n#F Thay đổi nhẹ một nhận thức sẵn có, như đổi một âm thanh lớn này thành âm thanh khác, hay giả tạo sự tàng hình dưới một lớp bóng tối che phủ.#!"
 VEILED_EYES_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn nhận truce từ mục tiêu hoặc chặn mọi scheme nhằm vào nó.\n#F Khiến một vật thể bị bỏ qua; dù không thực sự tàng hình, người nhìn sẽ không nghĩ tới việc chú ý đến vật thể đó.#!"
 FUGUE_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn khiến một secret đã biết không thể bị mục tiêu tiết lộ, xóa bỏ claim của mục tiêu lên bạn, hoặc dùng một hook mà mục tiêu đang giữ với bạn.\nLà một [character_interaction|E], cho phép bạn khiến một trait phạm tội trở lại thành bí mật.\n#F Xóa bỏ một ký ức khỏi tâm trí một người, hoặc khiến một khoảnh khắc cụ thể trở nên nổi bật và che lấp những khoảnh khắc khác.#!"
 HAUNTED_HEART_PERK_EFFECT: "Mở khóa [scheme|E] [GetScheme('PODsoul_bridge').GetTypeName].\n#F Gợi lên một dạng cảm xúc ma quái nào đó trong một đối tượng, bằng cách đánh thức lại một cảm xúc từng cảm nhận trong quá khứ.#!"
 CAPTIVE_HEART_PERK_EFFECT: "Trao [modifier|E] [GetModifier('captive_heart_perk_commander_modifier').GetNameWithTooltip] cho [commanders|E] đồng minh khi đóng vai [commander|E] trong [combat_phase|E].\n Trao [modifier|E] [GetModifier('captive_heart_perk_knight_modifier').GetNameWithTooltip] cho [knights|E] đồng minh khi đóng vai [commander|E] trong [combat_phase|E] hoặc cho chính bạn trong [single_combat_duel_plural|E].\n#F Dùng cảm xúc như một sức mạnh chi phối, khiến một người tin vào những điều về bản thân họ mà có thể chưa từng là sự thật.#!"
 GIMMIX_PERK_EFFECT: "#F Tạo ra một chuyển động thần giao cách cảm đơn giản, cho phép di chuyển một vật thể từ xa, nhưng không thể điều khiển tinh vi.#!"
 ART_ENSNARE_PERK_EFFECT: "#F Di chuyển một vật thể quá nặng để Gimmix có thể xử lý, hoặc một vật thể mềm dẻo để trói buộc một cá nhân.#!"
 EFFIGY_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn sao chép artifact của mục tiêu.\n#F Tạo ra một bản sao giống hệt của một vật cho trước, tuy các đặc tính ẩn sâu bên trong vật đó không thể được sao chép.#!"
 MOOCH_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn đánh cắp artifact của mục tiêu.\n#F Một vật thể trong tầm nhìn của người thi triển sẽ ngay lập tức chuyển vào tay người sử dụng.#!"
 PHANTOM_SHADOWS_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn tạo ra một bản sao của mục tiêu.\n#F Tạo ra một chimera tạm thời hiện lên dưới hình dạng mà người sử dụng mong muốn, với một vài hạn chế.#!"
 WILLOW_WHISPER_PERK_EFFECT: "Mở khóa [decision|E] $seek_aid_of_the_spirits_decision$.\n#F Nói chuyện với vật thể, bất kể chúng có miệng để nói hay có tâm trí để suy nghĩ hay không.#!"
 ELDRITCH_PRIME_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn thi triển một cantrip thời tiết lên khu vực mục tiêu.\nCho phép ngăn chặn hoặc gia tăng sức mạnh thiên tai tự nhiên.\n#F Tạo ra một hiện thân thuần khiết của một trong những nguyên tố cơ bản nhất: lửa, nước, đất, khí, hoặc gỗ.#!"
 OAKENSHIELD_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn triệu hồi [GetModifier('oakenshield_modifier').GetNameWithTooltip] lên khu vực mục tiêu.\n#F Bao phủ một vật thể trong lớp vỏ cây bảo vệ, giúp chúng tự vệ trước sát thương.#!"
 HEATHE_BALM_HOLLY_STRIKE_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn chữa lành hoặc gây thương tổn cho mục tiêu, hoặc phá vỡ artifact mục tiêu thành từng mảnh.\n#F Sửa chữa một vật thể hoặc chữa lành một người (Heather Balm); gây hại cho một vật thể hoặc một người ở mức độ tương đương với mức có thể được chữa lành (Holly Strike).#!"
 ELDER_FORM_PERK_EFFECT: "Cho phép biến hình thành nguyên tố.\n#F Mang lấy hình dạng của một vật thể nguyên tố, nhận các đặc tính của nó nếu nó tồn tại, hoặc chỉ đơn thuần là hình dáng của nó nếu không.#!"
 OMEN_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn biết mọi secret và scheme của mục tiêu.\n#F Hình thức tiên tri cơ bản nhất, cantrip này mang lại một tia sáng thấu hiểu chớp nhoáng về số phận cuối cùng của một vật thể.#!"
 FAIR_IS_FOUL_FOUL_IS_FAIR_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn tiêu hao common art xp để khiến mục tiêu nhận/mất gold và prestige.\n#F Can thiệp nhẹ vào chuyện định mệnh, mang lại một chút may mắn cho đồng minh, hoặc một chút xui xẻo nhỏ cho kẻ địch.#!"
 TATTLETALE_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn trao [GetModifier('artifact_tattletale_modifier').GetNameWithTooltip] lên artifact mục tiêu.\n#F Nhìn thế giới từ góc nhìn của một vật thể mà người sử dụng đã từng gặp trong quá khứ, hoặc biết Chân Danh của nó.#!"
 AUGURY_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn có cơ hội khiến một sự kiện ngẫu nhiên xảy ra cho mục tiêu.\n#F Xác định một sự kiện sẽ xảy ra trong tương lai; bất kể điều gì xảy ra, sự kiện đó chắc chắn sẽ diễn ra, tuy sự thật về cách nó xảy ra có thể vô cùng bất ngờ.#!"
 FATE_FIRE_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn tăng tiến độ scheme.\n#F Một cantrip kỳ lạ và phức tạp, nó đẩy nhanh sự tàn khốc của nghiệp báo, khiến những gì đang chờ đợi một ai đó, tốt hay xấu, đến với họ nhanh hơn nhiều so với dự kiến.#!"
 HOPSCOTCH_PERK_EFFECT: "#F Tạo ra một cú nhảy bất khả thi, lên hoặc xuống, và không chịu bất kỳ thương tổn nào từ va chạm sau đó.#!"
 QUICKSILVER_PERK_EFFECT: "#F Cho phép một vật thể di chuyển với tốc độ cực nhanh.#!"
 PORTAL_PASSAGE_PERK_EFFECT: "#F Tạo ra một lối mở tạm thời xuyên qua bất kỳ rào cản nào, cho phép di chuyển xuyên qua nó.#!"
 WIND_RUNNER_PERK_EFFECT: "#F Cho phép mục tiêu bay lượn, cất cánh lên trời như thể họ có cánh.#!"
 FLICKER_FLASH_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn dịch chuyển quân đội của bạn đến vị trí của mục tiêu, hoặc dịch chuyển đến điểm đến kế tiếp khi đang di chuyển.\n#F Biến mất ngay lập tức, và xuất hiện lại ở một nơi khác trên thế giới, hoặc trong [UmbraGlossary('dreaming')].#!"

