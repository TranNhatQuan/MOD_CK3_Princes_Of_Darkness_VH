 WYRD_PERK_EFFECT: "Ban [GetModifier('wyrd_perk_commander_modifier').GetNameWithTooltip] [modifier|E] cho [commanders|E] địch khi đang giữ vai [commander|E] trong [combat_phase|E].\nBan [GetModifier('wyrd_perk_knight_modifier').GetNameWithTooltip] [modifier|E] cho [knights|E] địch khi đang giữ vai [commander|E] trong [combat_phase|E], hoặc cho đối thủ trong [single_combat_duel_plural|E].\n#F Khiến người khác mất khả năng nhận biết trật tự thời gian đúng đắn, không thể phân biệt việc gì xảy ra trước hay sau.#!"
 BACKWARD_GLANCE_PERK_EFFECT: "#F Nhìn lại một điều đã xảy ra trong quá khứ, giúp hồi tưởng những hình ảnh đã thấy trước đây, và cho thấy cả những hình ảnh chưa từng được nhìn thấy vào lúc đó.#!"
 DREAM_TIME_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn tăng hoặc giảm tốc độ thời gian cho nhân vật hoặc lãnh địa mục tiêu.\n#F Thay đổi tốc độ thời gian trong một khu vực hay đối với một người, khiến nó trôi nhanh hơn hẳn bình thường, hoặc chậm lại như bò.#!"
 PERMANENCE_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn gia hạn modifier cantrip của mục tiêu.\n#F Kéo dài thời gian hiệu lực của một Art do người khác thi triển, giúp nó tồn tại lâu hơn hẳn so với kết quả ban đầu quy định.#!"
 REVERSA_OF_FORTUNE_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn tự ban [GetModifier( 'reversa_of_fortune_perk_modifier' ).GetNameWithTooltip|L] cho bản thân trong #V 1#! ngày.\n#F Một Art vô cùng phức tạp và đắt giá, cho phép người dùng đảo ngược vài phút vừa qua, và đưa ra những lựa chọn mới.#!"
 FIND_SILVER_PATH_PERK_EFFECT: "#F Cho biết vị trí của Con Đường Bạc, con đường dẫn dắt fae xuyên qua [UmbraGlossary('dreaming')], và cung cấp thông tin về ai hoặc thứ gì hiện đang ở trên đó.#!"
 DETERMINISM_PERK_EFFECT: "Tỷ lệ tìm thấy sự kiện trong [umbra|E]: [grace_i]#P +100%#!\n#F Cho thấy điều gì ở đầu bên kia của một trod, một con đường bí ẩn của [UmbraGlossary('dreaming')] mà tại đó không gian và thời gian bị bóp méo nặng nề.#!"
 THE_MERRY_DANCE_PERK_EFFECT: "Tỷ lệ tìm thấy sự kiện trong [umbra|E]: [grace_i]#P +100%#!\n#F Firchlis là một sức mạnh to lớn trong các Cõi Huyền Thoại. Dreaming không ngừng biến đổi, và Firchlis chính là một nguồn cội then chốt của sự biến đổi đó. Những fae tài giỏi, với sự tập trung và chuẩn bị kỹ lưỡng, có thể tác động đến những biến đổi mà Firchlis mang lại.#!"
 HOMESTEAD_PERK_EFFECT: "Mở khóa công trình [GetBuilding('homestead_freehold_01').GetName].\n#F Cố định một điểm trong [UmbraGlossary('dreaming')] để, thay vì mãi biến đổi theo ý muốn của $glossary_wyld$, nó sẽ giữ nguyên như ý định của người thi triển.#!"
 ANCHOR_PERK_EFFECT: "Thời gian mở khóa [building|E] [UmbraGlossary('dreaming')]: #P -50%#!\n#F Với cantrip này, một changeling có thể "làm rắn lại" [UmbraGlossary('dreaming')] tới một mức độ nhất định, cho phép họ lập nên một pháo đài vững chắc trong Cõi Huyền Thoại.#!"
 ATTUNEMENT_PERK_EFFECT: "Bạn sẽ nhận được thông báo nếu có ai định sát hại bạn bè hay gia đình của bạn.\nBạn sẽ nhận được thông báo nếu có ai định quyến rũ người yêu hay tình nhân của bạn.\nTù nhân của bạn có tỷ lệ trốn thoát khỏi nhà tù thấp hơn.\n#F Kết nối một Kithain với một người, một nơi, hoặc một vật, khiến cho bất cứ điều gì xảy đến với nó, Kithain sẽ là người biết đầu tiên.#!"
 DREAM_RIDING_PERK_EFFECT: "Cho phép tương tác với các nhân vật trên [UmbraGlossary('earth')] trong khi vẫn ở lại [UmbraGlossary('dreaming')].\nLà một [character_interaction|E], cho phép bạn nhận thiện cảm từ mục tiêu.\n#F Cantrip này cho phép một changeling tương tác với giấc mộng của người thường trong khi Kithain đang ở trong [UmbraGlossary('dreaming')]. Đây không hẳn luôn là điều khôn ngoan để làm, vì sự tương tác của Kithain có thể gây ra những biến đổi kỳ dị cho giấc mộng đó. Tuy có thể tương tác, nhưng việc kiểm soát thật sự giấc mộng thì không.#!"
 DREAM_WEAVING_PERK_EFFECT: "#F Tạo ra một chimera, tương tự cantrip Phantom Shadows, nhưng, trong khi chimera đó chỉ tạm thời, chimera này lại tồn tại vĩnh viễn - miễn là nó không bao giờ rời khỏi [UmbraGlossary('dreaming')].#!"
 SEEK_N_SPELL_PERK_EFFECT: "#F Bất kể bạn có hiểu ngôn ngữ đó hay không, hay cho dù nội dung bị khóa bằng ma thuật, việc đọc được bất kỳ văn bản nào cũng trở nên khả thi.#!"
 RUNE_PERK_EFFECT: "$unlock_enhancing_node$ Thêm một [modifier|E] dựa trên loại [artifact|E]\n#F Khắc một từ quyền năng lên một vật thể, giúp nó trở nên hiệu quả hơn hẳn cho một nhiệm vụ cụ thể.#!"
 RUNIC_CIRCLE_PERK_EFFECT: "Ban modifier [GetModifier('runic_circle_perk_modifier').GetNameWithTooltip] cho mọi cận thần, cố vấn, bạn bè và người yêu.\n#F Tạo ra một vòng tròn từ ngữ bảo hộ, mang lại khả năng chống lại các thế lực siêu nhiên tìm cách xâm phạm vòng tròn đó.#!"
 SAINING_PERK_EFFECT: "Là một [character_interaction|E], bạn có thể khám phá ra danh thực của nhân vật khác.\n#F Gợi lại nghi lễ Danh Thực được thực hiện khi một Kithain lần đầu trải qua Chrysalis, cho người dùng thấy Danh Thực của cá nhân đó.#!"
 REWEAVING_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn chỉnh sửa các trait của mục tiêu.\n#F Khi đã biết được Danh Thực, cantrip này cho phép người thi triển chỉnh sửa Danh đó, và qua đó chỉnh sửa những đặc điểm cốt lõi của con người hay vật thể đó.#!"
 PROTOCOL_PERK_EFFECT: "#F Đưa một buổi Triều Đình được ma thuật bảo đảm vào phiên họp, ngăn không cho thường dân làm gián đoạn tiến trình.#!"
 DICTUM_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn nhận được một hook đối với mục tiêu.\n#F Đưa ra một yêu cầu đối với đối tượng của cantrip, mà họ phải thực hiện hết khả năng của mình, trừ khi điều đó quá nguy hiểm.#!"
 GRANDEUR_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn chiêu mộ hoặc [imprison|E] nhân vật không lãnh địa mục tiêu.\n#F Khoác lên mình một vẻ đẹp và phong thái thuần khiết, khiến người khác gần như không thể chống lại ý muốn của bạn.#!"
 WEAVER_WARD_PERK_EFFECT: "Có khả năng cao hơn để [imprison|E] [characters|E] sau một [siege|E] hay [raid|E] thành công.\nTrục xuất nhân vật không lãnh địa và ban artifact.\n#F Chặn một cửa ra vào hay một hành lang hẹp, khiến cho một nhóm vật thể được chỉ định không thể đi qua.#!"
 GEAS_BAN_PERK_EFFECT: "Mở khóa [character_interaction|E] Lời Thề, khiến mục tiêu nhận [GetTrait('oathbreaker').GetName( GetPlayer )] nếu họ phá vỡ nó.\n#F Tạo ra một Lời Thề, hoặc yêu cầu một người thực hiện một hành động (Geas), hoặc kiêng cữ không thực hiện một hành động nào đó (Ban); ai phá vỡ Lời Thề này sẽ chịu một lời nguyền như hậu quả.#!"
 HARDEN_PERK_EFFECT: "#F Chuẩn bị một chimera hoang dã bằng cách biến nó thành một chimera đã được chế tác, cho phép tiếp tục áp dụng Infusion lên nó.#!"
 TOUGHEN_PERK_EFFECT: "#F Tăng thêm độ bền cho vật chất chimerical, bao gồm cả các changeling khác, mang lại khả năng chống chịu cả sát thương và sự tan rã của Banality.#!"
 FUBAR_GENERATION_PERK_EFFECT: "Cho phép bạn tạo ra một bình chứa glamour.\n#F Tạo ra và khống chế một FUBAR, một sinh vật chimerical có thể đóng vai trò như một bình chứa Glamour.#!"
 ANIMANTIS_PERK_EFFECT: "Cho phép chế tạo một nhân vật [GetTrait('automaton').GetName( GetPlayer )].\nCó thể chiêu mộ [GetMaA('golems').GetName] làm [men_at_arms|E].\n#F Tạo ra một golem, một tôi bộc cơ khí sẽ phục vụ Nocker và giúp đỡ hắn trong công việc.#!"
 GILGUL_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn tự do chỉnh sửa các trait tinh thần và thể chất của mục tiêu [GetTrait('automaton').GetName( GetPlayer )].\n#F Một cantrip vô cùng nguy hiểm mà, nếu thành công, sẽ thêm tư duy có ý thức vào một chimera hay animantis, và thậm chí có thể cả một linh hồn thực sự.#!"
 AGEMOS_BLESSING_PERK_EFFECT: "#F Đọc được cảm xúc của cả một đám đông cùng lúc, để xác định cách tốt nhất nhằm giải trí cho họ.#!"
 FLICKERING_FIRELIGHT_PERK_EFFECT: "#F Tạo hình một ảo ảnh chimerical nhỏ thành thứ được nói đến trong câu chuyện, cung cấp bối cảnh để kể chuyện.#!"
 MURMUR_IN_THE_CROWD_PERK_EFFECT: "#F Gieo vào đám đông một cảm xúc, làm tăng sức hút của câu chuyện của Eshu, cũng như tạo ra lý do để họ kể lại nó.#!"
 STICKS_AND_STONES_PERK_EFFECT: "#F Biến lời nói thành một chỗ trú ẩn tạm thời, bảo vệ người kể chuyện khỏi sát thương, miễn là họ tiếp tục kể chuyện không ngừng nghỉ.#!"
 MOMENT_OF_TRUTH_PERK_EFFECT: "#F Tạo ra một chimera tạm thời xuất hiện dưới hình dạng mà người dùng mong muốn, với một số hạn chế.#!"

 ### Slivers ###

 game_concept_slivers_lifestyle: "Slivers"
 game_concept_slivers_lifestyle_desc: "Inanimae có một hệ thống Art hoàn toàn khác, mà họ gọi là Slivers. Những Sliver này chủ yếu liên quan đến việc điều khiển các nguyên tố, dù một số có hiệu ứng dựa trên những khái niệm gắn liền với các nguyên tố đó. Không như Art, mỗi Sliver ban thêm một sức mạnh phụ, nhỏ hơn một Cantrip, cho mọi Inanimae có ít nhất một cấp độ của nó."

