l_english:
 game_concept_realm_lifestyle: "Realm"
 game_concept_realm_lifestyle_desc: "Sáu phương diện của thế giới mà kithain có sự gắn kết, tác động trực tiếp đến việc bạn có thể ảnh hưởng lên ai hay điều gì. Không hiểu rõ realm phù hợp, một kithain sẽ không thể tác động lên bất cứ điều gì. Realm là phần thiết yếu khi thi triển một [cantrip|E]."
 
 realm_lifestyle_name: "Realm"
 realm_lifestyle_desc: "Tập trung vào các phương diện của thế giới mà kithain có sự gắn kết."
 realm_lifestyle_highlight_desc: "Nhờ Glamour của bạn, bạn nhận thêm #P [GetPlayer.MakeScope.ScriptValue('glamour_lifestyle_xp_mult')|%0]#! [experience|E] trong Lifestyle này."
 monthly_realm_lifestyle_xp_gain_mult: "[experience|E] Realm [lifestyle|E] hàng tháng"
 
 realm_actor_focus: "Actor Focus"
 realm_actor_focus_modifier: "[GetFocus('realm_actor_focus').GetName]"
 realm_actor_focus_desc: "Actor là realm gắn liền với mọi sinh linh trần thế, tương ứng trực tiếp với mức độ bạn hiểu biết về họ."
 realm_actor_focus_effect_desc: "Tập trung vào Actor mang lại:"
 
 realm_fae_focus: "Fae Focus"
 realm_fae_focus_modifier: "[GetFocus('realm_fae_focus').GetName]"
 realm_fae_focus_desc: "Fae liên quan đến những sinh thể khác của [UmbraGlossary('dreaming')]. Để tác động lên các Changeling khác, Noble Sidhe, Adhene, Chimera, hay ngay cả việc kiểm soát chính pháp thuật Changeling, tất cả đều thuộc phạm vi realm Fae."
 realm_fae_focus_effect_desc: "Tập trung vào Fae mang lại:"
 
 realm_prop_focus: "Prop Focus"
 realm_prop_focus_modifier: "[GetFocus('realm_prop_focus').GetName]"
 realm_prop_focus_desc: "Prop là sự kiểm soát và điều khiển mọi vật thể do con người tạo ra. Thiết bị càng phức tạp thì càng đòi hỏi khả năng tinh thông realm Prop cao hơn."
 realm_prop_focus_effect_desc: "Tập trung vào Prop mang lại:"
 
 realm_nature_focus: "Nature Focus"
 realm_nature_focus_modifier: "[GetFocus('realm_nature_focus').GetName]"
 realm_nature_focus_desc: "Nature là sự kiểm soát cây cỏ, đất đai và thú hoang. Bất cứ điều gì chưa bị con người chạm tới đều nằm trong tầm kiểm soát của realm Nature."
 realm_nature_focus_effect_desc: "Tập trung vào Nature mang lại:"
 
 realm_scene_focus: "Scene Focus"
 realm_scene_focus_modifier: "[GetFocus('realm_scene_focus').GetName]"
 realm_scene_focus_desc: "Scene là sự kiểm soát không gian. Càng tinh thông realm Scene, bạn càng có thể tác động lên khu vực rộng hơn hoặc nhiều mục tiêu hơn (khi kết hợp với các realm khác)."
 realm_scene_focus_effect_desc: "Tập trung vào Scene mang lại:"
 
 realm_time_focus: "Time Focus"
 realm_time_focus_modifier: "[GetFocus('realm_time_focus').GetName]"
 realm_time_focus_desc: "Time là sự kiểm soát thời điểm cantrip của bạn diễn ra hoặc thời gian nó kéo dài. Tinh thông Time quyết định thời gian pháp thuật của bạn tồn tại, hay việc bạn có thể đặt một "cơ chế kích hoạt" lên chúng trong bao lâu."
 realm_time_focus_effect_desc: "Tập trung vào Time mang lại:"
 
