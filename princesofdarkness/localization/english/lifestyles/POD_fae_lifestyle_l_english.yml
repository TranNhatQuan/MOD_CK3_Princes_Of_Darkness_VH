 FANCY_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn khiến mục tiêu có ấn tượng tốt về bạn.\n#F Tạo ấn tượng đầu tốt đẹp, khiến ai đó có cảm giác họ thích một vật thể cụ thể mà họ chưa từng thấy trước đây.#!"
 YEARN_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn khiến hàng xóm của mục tiêu tìm cách đánh cắp bảo vật của họ.\n#F Thay đổi luồng suy nghĩ của một người, dẫn họ đến kết luận rằng họ khao khát một người, một nơi, hoặc một vật nào đó vào một thời điểm trong tương lai.#!"
 COVET_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn khiến mục tiêu khát khao trở thành bạn hoặc người yêu của bạn.\n#F Gây ra sự si mê, khiến một người khắc khoải và cần đến ai đó hoặc điều gì đó mà trước đây họ có thể chưa từng quan tâm.#!"
 CRAVE_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn khiến hàng xóm của mục tiêu tìm cách chiếm đoạt tước vị của họ.\n#F Tạo ra một khát khao phi lý đối với đối tượng của tình cảm, khiến chủ thể làm gần như bất cứ điều gì để đạt được nó, miễn là không tự gây nguy hiểm cho bản thân.#!"
 NEED_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn khiến mục tiêu khởi động một [single_combat_duel|E] chống lại bất kỳ nhân vật nào đang giữ tước vị hoặc bảo vật họ tuyên nhận, hoặc một nhân vật có chung bạn, người yêu hay hôn phối với họ.\n#F Hình thái đáng sợ nhất và ít tinh vi nhất của Art này, ở cấp độ này một nhu cầu ngắn hạn được tạo ra, nhưng mạnh đến mức bất kỳ ai, thậm chí cả chủ thể hoặc đối tượng của khát khao, cũng có thể bị hy sinh để thỏa mãn nó.#!"
 COLD_SHOCK_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn khiến đình thần và khách khứa của mục tiêu có ấn tượng xấu về họ.\n#F Làm lạnh một căn phòng hoặc một người, hiếm khi gây tổn hại thực sự, nhưng khiến những ai cảm nhận được nó thấy khó chịu vì nhiệt độ.#!"
 GELID_RIME_PERK_EFFECT: "Trao [modifier|E] [GetModifier('gelid_rime_perk_commander_modifier').GetNameWithTooltip] cho [commanders|E] địch khi đóng vai [commander|E] trong [combat_phase|E].\nTrao [modifier|E] [GetModifier('gelid_rime_perk_knight_modifier').GetNameWithTooltip] cho [knights|E] địch khi đóng vai [commander|E] trong [combat_phase|E], hoặc cho đối thủ của bạn trong [single_combat_duel_plural|E].\n#F Phủ một lớp băng mỏng lên một vùng nhỏ, ngăn không cho bất kỳ ai bị tác động di chuyển phần thân thể đó.#!"
 FROST_FACSIMILE_PERK_EFFECT: "$unlock_forging_node$ Thêm [modifier|E] dựa trên loại [artifact|E], cũng như tăng [durability|E] tối đa\n#F Tạo ra một vật thể từ băng rắn, có thể yếu ớt như băng thường, hoặc, nếu được chế tác tốt, chắc như kim loại.#!"
 CRYSTA_PRISON_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn [imprison|E] mục tiêu.\n#F Bao bọc một thứ trong một khối băng rắn, làm lạnh nhanh chóng, và có thể gây nghẹt thở nếu đó là một sinh vật sống.#!"
 COLDHEART_PERK_EFFECT: "Là một [character_interaction|E], cho phép bạn khiến mục tiêu rơi vào [GetTrait('torpor').GetName( GetPlayer )].\n#F Đóng băng hoàn toàn một chủ thể, khiến họ trở nên lạnh lẽo, bất tỉnh, và dễ vỡ; tỉnh lại từ trạng thái này rất khó khăn, đặc biệt trước khi thời hạn của cantrip kết thúc.#!"
 HIDDEN_FORM_PERK_EFFECT: "Mở khóa tùy chọn shapeshift [GetModifier( 'POD_shapeshift_form_invisible_modifier' ).GetNameWithTooltip|L].\n#F Ngụy trang một chủ thể, khiến họ gần như không thể bị phát hiện bằng mắt.#!"
 IMPERSONATE_PERK_EFFECT: "Thêm bonus cho [character_interaction|E] Shapeshift để thay đổi ngoại hình.\nLà một [character_interaction|E], cho phép bạn sao chép ngoại hình của mục tiêu.\n#F Biến đổi hình dạng thành một người khác, kể cả che giấu kith của mình để giả làm kith khác.#!"
 GO_ASK_ALICE_PERK_EFFECT: "Mở khóa tùy chọn shapeshift [GetModifier( 'POD_shapeshift_form_giant_modifier' ).GetNameWithTooltip|L] và [GetModifier( 'POD_shapeshift_form_lilliputian_modifier' ).GetNameWithTooltip|L].\n#F Cho phép thay đổi kích thước, khiến người và vật thể to lớn phi thường, hoặc nhỏ bé kỳ diệu.#!"
 MERLINS_LESSONS_PERK_EFFECT: "Cho phép shapeshift sang nhiều hình dạng động vật.\n#F Một sự biến đổi hình dạng còn mạnh mẽ hơn Impersonate, cho phép biến thành động vật; khi kết hợp với Go Ask Alice, con vật đó có thể có kích thước bất kỳ.#!"
 MYTHIC_TRANSFORMATION_PERK_EFFECT: "Cho phép shapeshift sang nhiều hình dạng cổ xưa, chẳng hạn như [GetModifier( 'POD_shapeshift_form_celestial_dragon_modifier' ).GetNameWithTooltip|L].\n#F Biến fae thành một sinh vật không thuộc thế giới này, cùng với toàn bộ sức mạnh của nó, miễn là người sử dụng có thể chống lại gọng kìm nghiệt ngã của Banality đi kèm với sức mạnh đó.#!"
 WIL_O_THE_WISP_PERK_EFFECT: "#F Tạo ra một quả cầu lửa giả, dẫn đường cho người tạo ra nó theo một lối đi gián tiếp đến một vật thể hoặc người mong muốn.#!"
 WILLOW_LIGHT_PERK_EFFECT: "#F Tạo ra một luồng sáng rực rỡ trong vài giờ, khiến một vật thể phát sáng và khó bị bỏ qua.#!"
 PROMETHEUS_FIST_PERK_EFFECT: "Trao [modifier|E] [GetModifier('prometheus_fist_perk_commander_modifier').GetNameWithTooltip] cho [commanders|E] đồng minh khi đóng vai [commander|E] trong [combat_phase|E].\nTrao [modifier|E] [GetModifier('prometheus_fist_perk_knight_modifier').GetNameWithTooltip] cho [knights|E] đồng minh khi đóng vai [commander|E] trong [combat_phase|E] hoặc cho chính bạn trong [single_combat_duel_plural|E].\n#F Bao bọc một vật thể trong một ngọn lửa không tự thiêu đốt vật thể đó, nhưng bất cứ thứ gì vật thể chạm vào sẽ bốc cháy như bình thường.#!"
 BURN_AND_BOIL_PERK_EFFECT: "#F Đốt lửa một vật thể theo cách gây hại cho chính vật thể đó; ngọn lửa này sẽ thiêu rụi vật thể và không thể kiểm soát được, giống như lửa thông thường.#!"
 STAR_BODY_PERK_EFFECT: "#F Biến một vật thể thành lửa nguyên chất, không làm thay đổi tính chất nội tại của nó, nhưng mang lại cho nó ánh sáng và khả năng đốt cháy các vật thể khác bằng lửa.#!"

