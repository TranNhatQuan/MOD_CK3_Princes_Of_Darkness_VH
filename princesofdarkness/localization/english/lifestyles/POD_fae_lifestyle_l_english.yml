 REALM_ACTOR_1_PERK_EFFECT: "Giờ đây bạn có thể thi triển [cantrips|E] lên một [friend|E], [lover|E], [courtier|E], [direct_vassal|E], thành viên gia tộc, một nhân vật mà bạn có [title_claim|E] mạnh hoặc [strong_hook|E] lên họ, hoặc một nhân vật mà bạn biết [secret|E] phạm tội của họ.\nNgoài ra nhân vật đó không được có quan hệ xấu, [war|E], hay [truce|E] với bạn, hoặc bị bạn giam cầm."
 REALM_ACTOR_2_PERK_EFFECT: "Giờ đây bạn có thể thi triển [cantrips|E] lên một [friend|E], [lover|E], [courtier|E], [guest|E], [vassal|E], [liege|E], thành viên dòng họ, một nhân vật mà bạn có [title_claim|E] hoặc [hook|E] lên họ, hoặc một nhân vật mà bạn biết [secret|E] của họ.\nNgoài ra nhân vật đó không được có quan hệ xấu, [war|E], hay [truce|E] với bạn, hoặc bị bạn giam cầm."
 REALM_ACTOR_3_PERK_EFFECT: "Giờ đây bạn có thể thi triển [cantrips|E] lên một nhân vật có bất kỳ quan hệ tốt, [courtier|E], [guest|E], [vassal|E], [liege|E], thành viên dòng họ, [ally|E], một nhân vật mà bạn có claim hoặc [hook|E] lên họ, hoặc một nhân vật mà bạn biết [secret|E] của họ.\nNgoài ra nhân vật đó không được có quan hệ xấu hoặc [war|E] với bạn."
 REALM_ACTOR_4_PERK_EFFECT: "Giờ đây bạn có thể thi triển [cantrips|E] lên bất kỳ nhân vật nào, miễn là họ không phải [rival|E] hoặc đang trong [war|E]."
 REALM_ACTOR_5_PERK_EFFECT: "Giờ đây bạn có thể thi triển [cantrips|E] lên bất kỳ nhân vật nào, ngay cả [rival|E] hoặc trong lúc [war|E]."
 REALM_FAE_1_PERK_EFFECT: "Giờ đây bạn có thể thi triển [cantrips|E] lên các siêu nhiên yếu hơn hoặc người thường có năng lực yếu."
 REALM_FAE_2_PERK_EFFECT: "Giờ đây bạn có thể thi triển [cantrips|E] lên các Changeling."
 REALM_FAE_3_PERK_EFFECT: "Giờ đây bạn có thể thi triển [cantrips|E] lên các Fae."
 REALM_FAE_4_PERK_EFFECT: "Giờ đây bạn có thể thi triển [cantrips|E] lên hầu hết siêu nhiên hoặc người thường có năng lực mạnh."
 REALM_FAE_5_PERK_EFFECT: "Giờ đây bạn có thể thi triển [cantrips|E] lên cả những siêu nhiên hiếm có nhất."
 REALM_PROP_1_PERK_EFFECT: "Giờ đây bạn có thể thi triển [cantrips|E] lên các artifact linh tinh/triều đình loại thường/tuyệt tác."
 REALM_PROP_2_PERK_EFFECT: "Giờ đây bạn có thể thi triển [cantrips|E] lên các artifact loại thường/tuyệt tác."
 REALM_PROP_3_PERK_EFFECT: "Giờ đây bạn có thể thi triển [cantrips|E] lên các artifact danh tiếng/lỗi lạc không độc nhất."
 REALM_PROP_4_PERK_EFFECT: "Giờ đây bạn có thể thi triển [cantrips|E] lên các artifact danh tiếng độc nhất."
 REALM_PROP_5_PERK_EFFECT: "Giờ đây bạn có thể thi triển [cantrips|E] lên các artifact lỗi lạc độc nhất."
 REALM_NATURE_1_PERK_EFFECT: "Có thể thi triển [cantrips|E] lên vật liệu hữu cơ vô sinh."
 REALM_NATURE_2_PERK_EFFECT: "Có thể thi triển [cantrips|E] lên thực vật hữu cơ còn sống."
 REALM_NATURE_3_PERK_EFFECT: "Có thể thi triển [cantrips|E] lên động vật còn sống, không có tri giác."
 REALM_NATURE_4_PERK_EFFECT: "Có thể thi triển [cantrips|E] lên hiện tượng tự nhiên."
 REALM_NATURE_5_PERK_EFFECT: "Có thể thi triển [cantrips|E] lên nguyên tố tự nhiên ở dạng thuần khiết."
 REALM_SCENE_1_PERK_EFFECT: "Giờ đây bạn có thể thi triển [cantrips|E] lên một nhân vật cách xa khoảng một vùng nhỏ (ví dụ: Wales từ đầu đến cuối).\nCó thể thi triển [cantrips|E] diện rộng ở quy mô một county."
 REALM_SCENE_2_PERK_EFFECT: "Giờ đây bạn có thể thi triển [cantrips|E] lên một nhân vật cách xa khoảng một vùng trung bình (ví dụ: Ireland từ đầu đến cuối).\nCó thể thi triển [cantrips|E] diện rộng ở quy mô một duchy."
 REALM_SCENE_3_PERK_EFFECT: "Giờ đây bạn có thể thi triển [cantrips|E] lên một nhân vật cách xa khoảng một vùng lớn (ví dụ: France từ đầu đến cuối).\nCó thể thi triển [cantrips|E] diện rộng ở quy mô một kingdom."
 REALM_SCENE_4_PERK_EFFECT: "Giờ đây bạn có thể thi triển [cantrips|E] lên một nhân vật cách xa khoảng một vùng khổng lồ (ví dụ: Holy Roman Empire từ trái sang phải).\nCó thể thi triển [cantrips|E] diện rộng ở quy mô một empire."
 REALM_SCENE_5_PERK_EFFECT: "Giờ đây bạn có thể thi triển [cantrips|E] lên bất kỳ nhân vật nào trên bản đồ.\nCó thể thi triển [cantrips|E] diện rộng ở quy mô toàn cầu."
 REALM_TIME_1_PERK_EFFECT: "Hiệu ứng bổ trợ [cantrip|E] giờ kéo dài #V 1#! năm thay vì #V 4#! tháng.\nGiảm thời gian hồi [cantrip|E] xuống 3/4."
 REALM_TIME_2_PERK_EFFECT: "Hiệu ứng bổ trợ [cantrip|E] giờ kéo dài #V 2#! năm thay vì #V 1#! năm.\nGiảm thời gian hồi [cantrip|E] xuống một nửa."
 REALM_TIME_3_PERK_EFFECT: "Hiệu ứng bổ trợ [cantrip|E] giờ kéo dài #V 5#! năm thay vì #V 2#! năm.\nGiảm thời gian hồi [cantrip|E] xuống 1/4."
 REALM_TIME_4_PERK_EFFECT: "Hiệu ứng bổ trợ [cantrip|E] giờ kéo dài #V 10#! năm thay vì #V 5#! năm.\nGiảm thời gian hồi [cantrip|E] xuống một đơn vị."
 REALM_TIME_5_PERK_EFFECT: "Hiệu ứng bổ trợ [cantrip|E] giờ kéo dài vĩnh viễn.\nKhông còn thời gian hồi [cantrip|E]."
 
