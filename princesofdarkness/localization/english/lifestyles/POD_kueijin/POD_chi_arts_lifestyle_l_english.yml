l_english:
 chi_arts_lifestyle_name: "Pháp Nghệ Khí"
 chi_arts_lifestyle_desc: "Pháp Nghệ Khí khác biệt so với các pháp nghệ khác, mới được phát triển như một cách vận dụng cao cấp của Khí tinh khiết. Chúng cũng là thứ xa rời nhất khỏi bản chất của $pod_kueijin$; muốn tu luyện chúng cần có một sư phụ chỉ dạy. Tuy về lý thuyết mọi sinh vật siêu nhiên đều có thể học Pháp Nghệ Khí, Hungry Dead lại rất bảo vệ pháp nghệ mới nhất của mình."
 monthly_chi_arts_lifestyle_xp_gain_mult: "[experience|E] Pháp Nghệ Khí [lifestyle|E] Hàng Tháng"
 monthly_chi_arts_lifestyle_xp_gain_add: "[experience|E] Pháp Nghệ Khí [lifestyle|E] Hàng Tháng"

 chi_arts_focus: "Trọng Tâm Pháp Nghệ Khí"
 chi_arts_focus_modifier: "[GetFocus('chi_arts_focus').GetName]"
 chi_arts_focus_desc: "Sức mạnh của khí."
 chi_arts_focus_effect_desc: "Tập trung vào Pháp Nghệ Khí mang lại:"

 feng_shui_visible: "Feng Shui"
 obligation_visible: "Nghĩa Vụ"
 tapestry_visible: "Thiên Cơ"
 prana_visible: "Prana"
 kiai_visible: "Kiai"
 tzu_wei_visible: "Tzu Wei"

 chi_arts_harmonious_dwelling_perk_name: "Trạch Cư Hài Hòa"
 chi_arts_harmonious_travel_perk_name: "Hành Trình Hài Hòa"
 CHI_ARTS_HARMONIOUS_DWELLING_PERK_EFFECT: "#flavor Dùng kiến thức của mình, người tu luyện có thể thiết kế nơi cư trú theo cách đảm bảo việc xây dựng diễn ra yên bình.#!"
 CHI_ARTS_HARMONIOUS_TRAVEL_PERK_EFFECT: "#flavor Người tu luyện dò theo các mạch cát lành với hy vọng có những chuyến đi bình an.#!"

 chi_arts_harmonious_ward_perk_name: "Phòng Ngự Hài Hòa"
 CHI_ARTS_HARMONIOUS_WARD_PERK_EFFECT: "#flavor Nhờ kiến thức của mình, người tu luyện có thể thiết kế công trình phòng ngự theo cách siêu nhiên làm tăng thêm uy lực của chúng.#!"

 chi_arts_inwards_harmonious_aligment_perk_name: "Nội Hướng Hài Hòa Chi Đạo"
 chi_arts_outwards_harmonious_aligment_perk_name: "Ngoại Hướng Hài Hòa Chi Đạo"
 CHI_ARTS_INWARDS_HARMONIOUS_ALIGMENT_PERK_EFFECT: "#flavor Người tu luyện điều hòa nội khí của mình theo các mạch long mạch gần đó, mang lại những lợi ích nhỏ.#!"
 CHI_ARTS_OUTWARDS_HARMONIOUS_ALIGMENT_PERK_EFFECT: "Mở khóa [GetBuilding('feng_shui_harmonized_area_01').GetName].\n#flavor Người tu luyện điều hòa khí theo long mạch gần nhất, đảm bảo một luồng năng lượng bình yên.#!"

 chi_arts_chi_ward_perk_name: "Khí Chướng"
 CHI_ARTS_CHI_WARD_PERK_EFFECT: "Mở khóa [GetBuilding('feng_shui_harmonized_area_02').GetName].\n#flavor Người tu luyện điều hòa luồng khí của một thành phố theo một long huyệt.#!"

 chi_arts_demon_ward_perk_name: "Trừ Ma Chướng"
 chi_arts_dragon_flow_perk_name: "Long Khí Lưu Chuyển"
 CHI_ARTS_DEMON_WARD_PERK_EFFECT: "#flavor Người tu luyện điều hòa toàn bộ một thành phố theo một long huyệt để tẩy trừ khí ma quái khỏi nó.#!"
 CHI_ARTS_DRAGON_FLOW_PERK_EFFECT: "Mở khóa [GetBuilding('feng_shui_harmonized_area_03').GetName].\n#flavor Người tu luyện làm dịu luồng khí tại nơi mình đang đứng.#!"

 chi_arts_transcendend_aligment_perk_name: "Siêu Việt Chi Đạo"
 CHI_ARTS_TRANSCENDEND_ALIGMENT_PERK_EFFECT: "Mở khóa [GetBuilding('feng_shui_harmonized_area_04').GetName].\n#flavor Người tu luyện điều hòa toàn bộ một thành phố theo một long môn.#!"


 chi_arts_evaluate_yin_soul_perk_name: "Thấu Nhìn Âm Hồn"
 chi_arts_evaluate_yang_soul_perk_name: "Thấu Nhìn Dương Hồn"
 CHI_ARTS_EVALUATE_YIN_SOUL_PERK_EFFECT: "#flavor Người tu luyện thẩm định các âm linh tại chỗ, và cách sử dụng chúng.#!"
 CHI_ARTS_EVALUATE_YANG_SOUL_PERK_EFFECT: "#flavor Người tu luyện thẩm định các dương linh tại chỗ, và cách sử dụng chúng.#!"

 chi_arts_soul_bridge_perk_name: "Hồn Kiều"
 CHI_ARTS_SOUL_BRIDGE_PERK_EFFECT: "Khi thực hiện [character_interaction|E] này, nhận một [weak_hook|E] lên mục tiêu, đổi lại mục tiêu cũng nhận một [weak_hook|E] lên bạn.\n#flavor Người tu luyện liên kết khí của mình với một sinh thể khác để đạt được sự hiểu biết lẫn nhau.#!"

 chi_arts_corrupting_yin_soul_perk_name: "Hủ Hóa Âm Hồn"
 chi_arts_taming_yang_soul_perk_name: "Điều Phục Dương Hồn"
 CHI_ARTS_CORRUPTING_YIN_SOUL_PERK_EFFECT: "#flavor Người tu luyện có thể lợi dụng các âm linh tại chỗ để trợ giúp cho những mưu tính của mình.#!"
 CHI_ARTS_TAMING_YANG_SOUL_PERK_EFFECT: "#flavor Người tu luyện có thể thuần hóa các dương linh tại chỗ, mở rộng dương hồn của mình, từ đó cho phép duy trì nhiều mối quan hệ hơn.#!"

 chi_arts_authority_over_yin_soul_perk_name: "Quyền Uy Trên Âm Hồn"
 chi_arts_authority_over_yang_soul_perk_name: "Quyền Uy Trên Dương Hồn"
 CHI_ARTS_AUTHORITY_OVER_YIN_SOUL_PERK_EFFECT: "Cải tiến [GetPerk('chi_arts_soul_bridge_perk').GetName(GetPlayer)] bằng cách thay thế [weak_hook|E] bạn nhận được bằng một [strong_hook|E] #italic (chỉ với mục tiêu #bold nữ#!)#!.\n#flavor Khi người tu luyện liên kết hồn mình với âm khí của mục tiêu, họ đạt được quyền kiểm soát cao hơn đối với người đó.#!"
 CHI_ARTS_AUTHORITY_OVER_YANG_SOUL_PERK_EFFECT: "Cải tiến [GetPerk('chi_arts_soul_bridge_perk').GetName(GetPlayer)] bằng cách thay thế [weak_hook|E] bạn nhận được bằng một [strong_hook|E] #italic (chỉ với mục tiêu #bold nam#!)#!.\n#flavor Khi người tu luyện liên kết hồn mình với dương khí của mục tiêu, họ đạt được quyền kiểm soát cao hơn đối với người đó.#!"

 chi_arts_soul_shackles_perk_name: "Hồn Tỏa"
 CHI_ARTS_SOUL_SHACKLES_PERK_EFFECT: "Cải tiến [GetPerk('chi_arts_soul_bridge_perk').GetName(GetPlayer)] bằng cách loại bỏ [weak_hook|E] mà mục tiêu nhận được lên bạn.\n#flavor Khi người tu luyện liên kết khí mình với mục tiêu, họ có thể lật lọng phần thỏa thuận của mình.#!"

 chi_arts_voice_of_emperor_perk_name: "Thiên Tử Chi Thanh"
 CHI_ARTS_VOICE_OF_EMPEROR_PERK_EFFECT: "Cải tiến [GetPerk('chi_arts_soul_bridge_perk').GetName(GetPlayer)] bằng cách cho phép bạn bỏ qua yêu cầu [opinion|E] miễn là bạn đang ở cùng địa điểm với mục tiêu.\n#flavor Người tu luyện có thể liên kết khí của mình với mục tiêu chỉ bằng một lời nói.#!"


 chi_arts_dragon_call_perk_name: "Long Triệu"
 chi_arts_chi_nest_perk_name: "Khí Sào"
 CHI_ARTS_DRAGON_CALL_PERK_EFFECT: "#flavor Người tu luyện có thể chuyển hướng một phần long mạch về lãnh địa của mình.#!"
 CHI_ARTS_CHI_NEST_PERK_EFFECT: "#flavor Người tu luyện có thể chuyển hướng một phần nhỏ của long mạch về hang ổ của mình.#!"

 chi_arts_chi_shaping_perk_name: "Khí Tạo Hình"
 CHI_ARTS_CHI_SHAPING_PERK_EFFECT: "Mở khóa [GetBuilding('extended_dragon_nest_01').GetName].\n#flavor Người tu luyện có thể định hình cách khí lưu chuyển trong các long mạch.#!"

 chi_arts_yin_wall_perk_name: "Âm Tường"
 chi_arts_yang_wall_perk_name: "Dương Tường"
 CHI_ARTS_YIN_WALL_PERK_EFFECT: "Có thể tác động lên Shroud.\n#flavor Người tu luyện có thể tác động lên luồng khí ngăn cách Âm Giới với Trung Nguyên.#!"
 CHI_ARTS_YANG_WALL_PERK_EFFECT: "Có thể tác động lên Wall.\n#flavor Người tu luyện có thể tác động lên luồng khí ngăn cách Dương Giới với Trung Nguyên.#!"

 chi_arts_dragon_shaping_perk_name: "Long Mạch Tạo Hình"
 CHI_ARTS_DRAGON_SHAPING_PERK_EFFECT: "Mở khóa [GetBuilding('extended_dragon_nest_02').GetName].\n#flavor Người tu luyện có thể định hình cách một long mạch lưu chuyển.#!"

 chi_arts_open_dragon_gate_perk_name: "Khai Long Môn"
 chi_arts_expand_dragon_river_perk_name: "Mở Rộng Long Hà"
 CHI_ARTS_OPEN_DRAGON_GATE_PERK_EFFECT: "Giảm yêu cầu [development|E] của Long Huyệt đi #V 10#!.\n#flavor Người tu luyện có thể cưỡng ép mở một long huyệt.#!"
 CHI_ARTS_EXPAND_DRAGON_RIVER_PERK_EFFECT: "Giảm yêu cầu [development|E] của Long Huyệt đi #V 10#!.\n#flavor Người tu luyện có thể khiến kích thước một long hà phình to.#!"

 chi_arts_sapping_the_dragon_nest_perk_name: "Hút Tinh Long Huyệt"
 CHI_ARTS_SAPPING_THE_DRAGON_NEST_PERK_EFFECT: "Khi thực hiện [character_interaction|E] này, dùng một Long Huyệt đã xây dựng để nhận [GetModifier('chi_arts_sapping_the_dragon_nest_modifier').GetNameWithTooltip], quy mô tỷ lệ theo cấp độ của Long Huyệt được sử dụng.\n#flavor Người tu luyện có thể chuyển hướng một phần của long huyệt vào chính mình, từ đó tăng cường sức mạnh cho bản thân đáng kể.#!"


 chi_arts_yin_mantle_perk_name: "Âm Bào"
 chi_arts_yang_mantle_perk_name: "Dương Bào"
 CHI_ARTS_YIN_MANTLE_PERK_EFFECT: "#flavor Người tu luyện khoác lên mình một lớp áo âm khí, hiện ra đáng sợ và uy nghiêm hơn.#!"
 CHI_ARTS_YANG_MANTLE_PERK_EFFECT: "#flavor Người tu luyện khoác lên mình một lớp áo dương khí, hiện ra cuốn hút và uy lực hơn.#!"

 chi_arts_accentuate_chi_perk_name: "Khí Vận Trợ Lực"
 CHI_ARTS_ACCENTUATE_CHI_PERK_EFFECT: "Khi thực hiện [character_interaction|E] này, hồi phục [EmptyScope.ScriptValue('POD_base_heal_value')|V0] [POD_superficial_damage_with_box|E].\n#flavor Người tu luyện có thể thay đổi luồng khí trong cơ thể mục tiêu, chữa lành thương tích.#!"

 chi_arts_eightfold_yin_mantle_perk_name: "Bát Trọng Âm Bào"
 chi_arts_eightfold_yang_mantle_perk_name: "Bát Trọng Dương Bào"
 CHI_ARTS_EIGHTFOLD_YIN_MANTLE_PERK_EFFECT: "#flavor Người tu luyện khoác lên mình một lớp áo âm khí tinh khiết, hiện ra trước người khác như một đám mây lạnh lẽo thuần túy và những cơn ác mộng lặng lẽ.#!"
 CHI_ARTS_EIGHTFOLD_YANG_MANTLE_PERK_EFFECT: "#flavor Người tu luyện khoác lên mình một lớp áo dương khí tinh khiết, hiện ra trước người khác như một đám mây ấm áp thuần túy và sự chấp nhận.#!"

 chi_arts_soothing_soul_perk_name: "An Hồn"
 CHI_ARTS_SOOTHING_SOUL_PERK_EFFECT: "Cải tiến [GetPerk('chi_arts_accentuate_chi_perk').GetName(GetPlayer)] bằng cách hồi phục [Multiply_CFixedPoint(EmptyScope.ScriptValue('POD_base_heal_value'),'(CFixedPoint)2')|V0] [POD_superficial_damage_with_box|E] đồng thời giảm [stress|E] của mục tiêu đi 25.\n#flavor Người tu luyện an ủi tâm hồn mục tiêu, giảm đau đớn và giúp việc chữa trị dễ dàng hơn.#!"

 chi_arts_yin_nihilus_perk_name: "Âm Diệt"
 chi_arts_yang_phoenix_perk_name: "Dương Phượng"
 CHI_ARTS_YIN_NIHILUS_PERK_EFFECT: "Gán [GetModifier('chi_arts_yin_nihilus_modifier').GetNameWithTooltip] cho [knights|E] địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho kẻ địch của bạn trong [single_combat_duel_plural|E].\n#flavor Người tu luyện có thể cho nổ một 'quả bom' âm khí tinh khiết, khiến sinh vật xung quanh cứng đờ bất thường.#!"
 CHI_ARTS_YANG_PHOENIX_PERK_EFFECT: "Gán [GetModifier('chi_arts_yang_phoenix_modifier').GetNameWithTooltip] cho [knights|E] đồng minh khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho chính bạn trong [single_combat_duel_plural|E].\n#flavor Người tu luyện có thể cho nổ một 'quả bom' dương khí tinh khiết, khiến sinh vật xung quanh nhanh nhẹn bất thường.#!"

 chi_arts_chi_mastery_perk_name: "Khí Đại Thành"
 CHI_ARTS_CHI_MASTERY_PERK_EFFECT: "Khi thực hiện [character_interaction|E] này, hồi phục [Multiply_CFixedPoint(EmptyScope.ScriptValue('POD_base_heal_value'),'(CFixedPoint)3')|V0] [POD_superficial_damage_with_box|E].\n#flavor Người tu luyện có thể tự do điều khiển khí trong cơ thể mục tiêu để chữa lành mọi thương tích.#!"


 chi_arts_cry_of_yin_perk_name: "Âm Khí Nhập Thanh"
 chi_arts_cry_of_yang_perk_name: "Dương Khí Nhập Thanh"
 CHI_ARTS_CRY_OF_YIN_PERK_EFFECT: "Khi một cuộc chiến bắt đầu, gán [GetModifier('chi_arts_cry_of_yin_modifier').GetNameWithTooltip] cho toàn bộ [knights|E] địch trong 3 năm.\n#flavor Người tu luyện truyền âm khí vào tiếng nói của mình, khiến kẻ địch phân tâm bởi những suy nghĩ u uất.#!"
 CHI_ARTS_CRY_OF_YANG_PERK_EFFECT: "Khi một cuộc chiến bắt đầu, gán [GetModifier('chi_arts_cry_of_yang_modifier').GetNameWithTooltip] cho toàn bộ [knights|E] địch trong 3 năm.\n#flavor Người tu luyện truyền dương khí vào tiếng nói của mình, khiến kẻ địch phân tâm bởi những suy nghĩ hưng phấn thái quá.#!"

 chi_arts_battle_cry_perk_name: "Chiến Hô"
 CHI_ARTS_BATTLE_CRY_PERK_EFFECT: "#flavor Người tu luyện có thể xướng tên chiêu thức tiếp theo của mình, từ bỏ lợi thế bất ngờ nhưng làm tăng đáng kể uy lực của nó.#!"

 chi_arts_roar_of_dragon_perk_name: "Hắc Long Hống"
 chi_arts_roar_of_phoenix_perk_name: "Xích Phượng Hống"
 CHI_ARTS_ROAR_OF_DRAGON_PERK_EFFECT: "#flavor Người tu luyện bắt chước tiếng hống của Hắc Long, gây sát thương lớn cho mọi vật vô cơ ở gần.#!"
 CHI_ARTS_ROAR_OF_PHOENIX_PERK_EFFECT: "Tăng cơ hội đả thương [knights|E] địch khi ở trong [combat_phase|E] với vai trò [knight|E].\n#flavor Người tu luyện bắt chước tiếng hống của Xích Phượng, gây sát thương lớn cho mọi vật hữu cơ ở gần.#!"

 chi_arts_shout_of_inner_pain_perk_name: "Nội Thống Hô"
 CHI_ARTS_SHOUT_OF_INNER_PAIN_PERK_EFFECT: "Khi một cuộc chiến bắt đầu, gán 20 [stress|E] cho toàn bộ [knights|E] địch.\n#flavor Người tu luyện giải phóng nỗi đau nội tại của mình, gây đau đớn cho kẻ địch, đồng thời giải thoát cho chính mình.#!"

 chi_arts_scream_of_demon_perk_name: "Thiên Ma Chi Hống"
 chi_arts_silent_scream_perk_name: "Vô Thanh Hống"
 CHI_ARTS_SCREAM_OF_DEMON_PERK_EFFECT: "Khi một cuộc chiến bắt đầu, gán 30 [stress|E] cho toàn bộ [knights|E] địch có một dạng bóng tối nội tại nào đó như $POD_splat_vampire_plural$, $POD_splat_wraith_plural$ hoặc $POD_splat_kueijin$ mà không có [GetTrait('dharma10').GetName(GetPlayer)].\n#flavor Người tu luyện giải phóng P'o của mình trong một tiếng hét duy nhất, khiến những sinh vật gần đó rơi vào cuồng loạn.#!"
 CHI_ARTS_SILENT_SCREAM_PERK_EFFECT: "Tăng cơ hội đả thương [knights|E] địch khi ở trong [combat_phase|E] với vai trò [knight|E].\n#flavor Người tu luyện có thể sử dụng mọi pháp lực Kiai trước đó chỉ bằng một tiếng thì thầm.#!"

 chi_arts_divine_cry_perk_name: "Xuyên Thiên Hống"
 CHI_ARTS_DIVINE_CRY_PERK_EFFECT: "Khi một trận chiến bắt đầu, buộc mọi [knight|E] địch không có tinh thần vững vàng và có ít nhất #N 70#! [stress|E] phải rút khỏi trận chiến.\n#flavor Người tu luyện bắt chước tiếng gào của một vị thần giận dữ, buộc những kẻ có tâm trí yếu đuối phải bỏ chạy trong sợ hãi.#!"


 chi_arts_joss_weaving_perk_name: "Dệt Vận"
 chi_arts_fate_of_star_perk_name: "Sao Định Mệnh"
 CHI_ARTS_JOSS_WEAVING_PERK_EFFECT: "Mở khóa một tương tác nhân vật để trao cho mục tiêu một hiệu ứng may mắn.\n\n#flavor Người tu luyện dệt vận may thuần túy theo ý muốn của mình.#!"
 CHI_ARTS_FATE_OF_STAR_PERK_EFFECT: "#flavor Người tu luyện có thể dự đoán điều gì sẽ xảy đến với mục tiêu.#!"

 chi_arts_realigning_the_stars_perk_name: "Tái Chỉnh Tinh Tượng"
 CHI_ARTS_REALIGNING_THE_STARS_PERK_EFFECT: "Khi thực hiện [character_interaction|E] này, trao cho mục tiêu một trong 12 [modifiers|E] dựa theo một cung hoàng đạo.\n#flavor Người tu luyện có thể chọn một trong 12 lá số làm ngôi sao bản mệnh của mình, mang lại phước lành tương ứng.#!"

 chi_arts_cursing_the_star_perk_name: "Trù Ẻo Tinh Tượng"
 chi_arts_read_the_stars_perk_name: "Đọc Tinh Tượng"
 CHI_ARTS_CURSING_THE_STAR_PERK_EFFECT: "Khi thực hiện [character_interaction|E] này, gây [EmptyScope.ScriptValue('POD_base_wound_damage')|V0] [POD_superficial_damage_with_box|E].\n#flavor Người tu luyện có thể trù ẻo mục tiêu gặp xui xẻo, dẫn đến một dạng tai nạn nào đó.#!"
 CHI_ARTS_READ_THE_STARS_PERK_EFFECT: "#flavor Người tu luyện có thể đọc các vì tinh tú, dự đoán tương lai ở một mức độ nào đó.#!"

 chi_arts_reweaving_the_stars_perk_name: "Tái Dệt Tinh Tượng"
 CHI_ARTS_REWEAVING_THE_STARS_PERK_EFFECT: "Cải tiến [GetPerk('chi_arts_realigning_the_stars_perk').GetName(GetPlayer)] bằng cách cho phép bạn thay đổi [modifier|E] và tăng thời hạn lên 10 năm.\n#flavor Người tu luyện có thể tác động lên lá số của mình dễ dàng hơn và với sự linh hoạt cao hơn.#!"

 chi_arts_celestial_curse_perk_name: "Thiên Giới Chi Trù"
 chi_arts_read_the_twelve_perk_name: "Đọc Thập Nhị Cung"
 CHI_ARTS_CELESTIAL_CURSE_PERK_EFFECT: "Cải tiến [GetPerk('chi_arts_cursing_the_star_perk').GetName(GetPlayer)] bằng cách gây [Multiply_CFixedPoint(EmptyScope.ScriptValue('POD_base_wound_damage'),'(CFixedPoint)2')|V0] [POD_superficial_damage_with_box|E].\n#flavor Người tu luyện có thể giáng một lời trù ẻo từ thiên giới vào toàn bộ lá số của mục tiêu.#!"
 CHI_ARTS_READ_THE_TWELVE_PERK_EFFECT: "#flavor Người tu luyện có thể đọc tương lai của mục tiêu với độ chính xác cao bằng cách sử dụng toàn bộ lá số của họ trong việc bói toán.#!"

 chi_arts_substitution_of_the_twelve_perk_name: "Hoán Vị Thập Nhị Cung"
 CHI_ARTS_SUBSTITUTION_OF_THE_TWELVE_PERK_EFFECT: "Cải tiến [GetPerk('chi_arts_realigning_the_stars_perk').GetName(GetPlayer)] bằng cách khiến [modifier|E] tồn tại vĩnh viễn miễn là bạn không tự tay thay đổi nó.\n#flavor Người tu luyện có thể cố định vĩnh viễn một lá số duy nhất làm ngôi sao bản mệnh của mình trên bầu trời đêm.#!"
