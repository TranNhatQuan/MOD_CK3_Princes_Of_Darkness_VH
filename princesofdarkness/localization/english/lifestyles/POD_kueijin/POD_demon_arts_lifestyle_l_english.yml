l_english:
 demon_arts_lifestyle_name: "Ma Quyền Nghệ"
 demon_arts_lifestyle_desc: "Ma Quyền Nghệ là những biểu hiện bản năng, gần như tự nhiên của con thú nội tâm [Glossary('Kuei-Jin’s','game_concept_kuei_jin_desc')], P'o. Chúng dễ học, không tốn công sức hay Khí, và mức độ tinh thông của chúng là vô hạn, dù sức mạnh của chúng không phải không có hậu quả."
 monthly_demon_arts_lifestyle_xp_gain_mult: "[experience|E] [lifestyle|E] Ma Quyền Nghệ Hàng tháng"
 monthly_demon_arts_lifestyle_xp_gain_add: "[experience|E] [lifestyle|E] Ma Quyền Nghệ Hàng tháng"

 demon_arts_focus: "Trọng tâm Ma Quyền Nghệ"
 demon_arts_focus_modifier: "[GetFocus('demon_arts_focus').GetName]"
 demon_arts_focus_desc: "Giải phóng P'o của bạn."
 demon_arts_focus_effect_desc: "Tập trung vào Ma Quyền Nghệ mang lại:"

 devil_fist_visible: "Ma Quyền"
 black_wind_visible: "Hắc Phong"
 iron_mountain_visible: "Thiết Sơn"
 demon_regalia_visible: "Ma Bào"

 DEMON_ARTS_STACKING_EFFECT: "#clickable Điểm thưởng này có thể mua tổng cộng #V 9#! lần#! #weak (còn lại [Subtract_CFixedPoint('(CFixedPoint)9','(CFixedPoint)$VALUE|q$')|0])#!"

 demon_arts_infernal_might_perk_name: "Ma Lực Địa Ngục #low (Giá: [ROOT.Char.MakeScope.ScriptValue('demon_arts_infernal_might_perk_cost')])#!"
 demon_arts_devil_fist_perk_name: "Ma Quyền #low ([ROOT.Char.MakeScope.ScriptValue('demon_arts_devil_fist_modifier_stacks')]/9)#!"

 DEMON_ARTS_INFERNAL_MIGHT_PERK_EFFECT: "Là một [character_interaction|E], ban cho bản thân [GetModifier('demon_arts_infernal_might_modifier').GetNameWithTooltip] trong 10 năm để đổi lấy #V 10#! [Glossary('Dharma','podgloss.dharma')] [trait_level_track_xp|E].\n#flavor Đỉnh cao của Ma Quyền, thân thể bạn trở thành một vũ khí được nung bởi nỗi đau và khổ sở của bạn, đảm bảo không gì có thể cản đường bạn.#!"
 DEMON_ARTS_INFERNAL_MIGHT_PERK_COST_EFFECT: "#clickable Điểm thưởng này tốn [CHARACTER.MakeScope.ScriptValue('demon_arts_infernal_might_perk_cost')|V0] điểm thưởng. Mỗi #high [GetPerk('demon_arts_devil_fist_perk').GetName(CHARACTER.Self)]#! sẽ giảm chi phí này đi #V 1#!#!"
 DEMON_ARTS_INFERNAL_MIGHT_PERK_COST_WARNING_EFFECT: "#X @warning_icon! Bạn không có [CHARACTER.MakeScope.ScriptValue('demon_arts_infernal_might_perk_cost')] điểm [perk|E]!#!"
 DEMON_ARTS_DEVIL_FIST_PERK_EFFECT: "#flavor Cơ bắp bạn phồng lên; khớp tay bạn cứng như đá. Bạn sẽ đánh gục kẻ thù thành làn sương đỏ, bẻ gãy kẻ yếu dưới đầu gối như một cành cây khô.#!"

 demon_arts_infernal_speed_perk_name: "Tốc Độ Địa Ngục #low (Giá: [ROOT.Char.MakeScope.ScriptValue('demon_arts_infernal_speed_perk_cost')])#!"
 demon_arts_black_wind_perk_name: "Hắc Phong #low ([ROOT.Char.MakeScope.ScriptValue('demon_arts_black_wind_modifier_stacks')]/9)#!"

 DEMON_ARTS_INFERNAL_SPEED_PERK_EFFECT: "Là một [character_interaction|E], ban cho bản thân [GetModifier('demon_arts_infernal_speed_modifier').GetNameWithTooltip] trong 10 năm để đổi lấy #V 10#! [Glossary('Dharma','podgloss.dharma')] [trait_level_track_xp|E].\n#flavor Đỉnh cao của Hắc Phong, tốc độ của bạn giờ vượt qua tốc độ âm thanh, đảm bảo không ai có thể trốn thoát khỏi bạn.#!"
 DEMON_ARTS_INFERNAL_SPEED_PERK_COST_EFFECT: "#clickable Điểm thưởng này tốn [CHARACTER.MakeScope.ScriptValue('demon_arts_infernal_speed_perk_cost')|V0] điểm thưởng. Mỗi #high [GetPerk('demon_arts_black_wind_perk').GetName(CHARACTER.Self)]#! sẽ giảm chi phí này đi #V 1#!#!"
 DEMON_ARTS_INFERNAL_SPEED_PERK_COST_WARNING_EFFECT: "#X @warning_icon! Bạn không có [CHARACTER.MakeScope.ScriptValue('demon_arts_infernal_speed_perk_cost')] điểm [perk|E]!#!"
 DEMON_ARTS_BLACK_WIND_PERK_EFFECT: "#flavor Một vệt mờ, rồi một cột máu phun, bạn di chuyển như một sợi dây đứt, một con rắn lục sát thủ. Trong vũ điệu bạo lực của bạn, không một động tác nào bị lãng phí.#!"

 demon_arts_infernal_fortitude_perk_name: "Bền Bỉ Địa Ngục #low (Giá: [ROOT.Char.MakeScope.ScriptValue('demon_arts_infernal_fortitude_perk_cost')])#!"
 demon_arts_iron_mountain_perk_name: "Thiết Sơn #low ([ROOT.Char.MakeScope.ScriptValue('demon_arts_iron_mountain_modifier_stacks')]/9)#!"

 DEMON_ARTS_INFERNAL_FORTITUDE_PERK_EFFECT: "Là một [character_interaction|E], ban cho bản thân [GetModifier('demon_arts_infernal_fortitude_modifier').GetNameWithTooltip] trong 5 năm để đổi lấy #V 10#! [Glossary('Dharma','podgloss.dharma')] [trait_level_track_xp|E].\n#flavor Đỉnh cao của Thiết Sơn, thịt da bạn trở thành một bức tường sắt bất khả xâm phạm, đảm bảo không gì có thể vượt qua bạn.#!"
 DEMON_ARTS_INFERNAL_FORTITUDE_PERK_COST_EFFECT: "#clickable Điểm thưởng này tốn [CHARACTER.MakeScope.ScriptValue('demon_arts_infernal_fortitude_perk_cost')|V0] điểm thưởng. Mỗi #high [GetPerk('demon_arts_iron_mountain_perk').GetName(CHARACTER.Self)]#! sẽ giảm chi phí này đi #V 1#!#!"
 DEMON_ARTS_INFERNAL_FORTITUDE_PERK_COST_WARNING_EFFECT: "#X @warning_icon! Bạn không có [CHARACTER.MakeScope.ScriptValue('demon_arts_infernal_fortitude_perk_cost')] điểm [perk|E]!#!"
 DEMON_ARTS_IRON_MOUNTAIN_PERK_EFFECT: "#flavor Bạn chịu đựng ngọn lửa, cú đấm, thanh kiếm, với làn da bất khuất như thép. Khi trận mưa các đòn tấn công cuối cùng ngừng lại, bạn mỉm cười; giờ là lượt của bạn.#!"

 demon_arts_infernal_glory_perk_name: "Vinh Quang Địa Ngục #low (Giá: [ROOT.Char.MakeScope.ScriptValue('demon_arts_infernal_glory_perk_cost')])#!"
 demon_arts_demon_regalia_perk_name: "Ma Bào #low ([ROOT.Char.MakeScope.ScriptValue('demon_arts_demon_regalia_modifier_stacks')]/9)#!"

 DEMON_ARTS_INFERNAL_GLORY_PERK_EFFECT: "Là một [character_interaction|E], ban cho bản thân [GetModifier('demon_arts_infernal_glory_modifier').GetNameWithTooltip] trong 5 năm để đổi lấy #V 10#! [Glossary('Dharma','podgloss.dharma')] [trait_level_track_xp|E].\n#flavor Đỉnh cao của Ma Bào, bạn trở thành hậu duệ đích thực của Vạn Chiến Binh, đảm bảo rằng chỉ một cái chạm của bạn cũng gây ra đau đớn.#!"
 DEMON_ARTS_INFERNAL_GLORY_PERK_COST_EFFECT: "#clickable Điểm thưởng này tốn [CHARACTER.MakeScope.ScriptValue('demon_arts_infernal_glory_perk_cost')|V0] điểm thưởng. Mỗi #high [GetPerk('demon_arts_demon_regalia_perk').GetName(CHARACTER.Self)]#! sẽ giảm chi phí này đi #V 1#!#!"
 DEMON_ARTS_INFERNAL_GLORY_PERK_COST_WARNING_EFFECT: "#X @warning_icon! Bạn không có [CHARACTER.MakeScope.ScriptValue('demon_arts_infernal_glory_perk_cost')] điểm [perk|E]!#!"
 DEMON_ARTS_DEMON_REGALIA_PERK_EFFECT: "Là một [character_interaction|E], biến hình thành bất kỳ ma bào nào bạn đã thu thập.\nKích hoạt một sự kiện để chọn ma bào mới.\n#flavor Ghê tởm nhưng đẹp đẽ; chết chóc nhưng vinh quang. Kẻ tàn ác, hãy đội vương miện và mang kiếm của mình với niềm tự hào.#!"
 