l_english:
 shintai_lifestyle_name: "Shintai"
 shintai_lifestyle_desc: "Shintai, hay Nghệ Thuật Shintai, là những biểu tượng của sự giác ngộ, chỉ có thể phát triển được bằng cách trưởng thành trong [Glossary('Pháp Môn','podgloss.dharma')]. Cấp bậc Shintai tối đa mà một nhân vật $pod_kueijin$ có thể đạt được bị giới hạn bởi cấp bậc [Glossary('Pháp Môn','podgloss.dharma')] của họ; hơn nữa, họ chỉ có thể tinh thông một Shintai ở [GetTrait('dharma5').GetName(GetNullCharacter)], hai Shintai ở [GetTrait('dharma6').GetName(GetNullCharacter)], và tiếp tục như vậy."
 shintai_lifestyle_highlight_desc: "Nhờ [Glossary('Pháp Môn','podgloss.dharma')] của mình, ngươi nhận thêm #P [GetPlayer.MakeScope.ScriptValue('dharma_lifestyle_xp_mult')|%0]#! [experience|E] trong Lối Sống này."
 monthly_shintai_lifestyle_xp_gain_mult: "[experience|E] Shintai [lifestyle|E] hàng tháng"
 monthly_shintai_lifestyle_xp_gain_add: "[experience|E] Shintai [lifestyle|E] hàng tháng"

 shintai_focus: "Trọng Tâm Shintai"
 shintai_focus_modifier: "[GetFocus('shintai_focus').GetName]"
 shintai_focus_desc: "Những biểu hiện của sự giác ngộ."
 shintai_focus_effect_desc: "Tập trung vào Shintai sẽ mang lại:"

 shintai_ash_and_flames_visible: "Shintai của Tro Tàn và Lửa"
 shintai_blood_visible: "Shintai của Máu"
 shintai_bone_visible: "Shintai của Xương"
 shintai_devotion_visible: "Shintai của Sự Sùng Kính"
 shintai_flesh_visible: "Shintai của Da Thịt"
 shintai_illusion_visible: "Shintai của Huyễn Ảnh"
 shintai_jade_visible: "Shintai của Ngọc Bích"
 shintai_poxes_visible: "Shintai của Ôn Dịch"
 shintai_storms_visible: "Shintai của Bão Tố"
 shintai_smoke_visible: "Shintai của Khói"

 shintai_fearless_fire_perk_name: "Lửa Vô Úy"
 shintai_dance_of_embers_perk_name: "Vũ Điệu Tàn Lửa"
 shintai_beautiful_spark_perk_name: "Tia Lửa Diễm Lệ"
 shintai_fire_tempered_soul_perk_name: "Linh Hồn Được Lửa Tôi Luyện"
 shintai_the_shintai_of_ash_and_fire_perk_name: "Shintai của Tro Tàn và Lửa"
 SHINTAI_FEARLESS_FIRE_PERK_EFFECT: "#flavor Những kẻ truyền dạy môn Tro Tàn và Lửa sử dụng một loại binh khí đặc biệt, một cây trượng dài với đầu đuốc lửa ở cả hai đầu. Học trò của Tro Tàn chế ngự nỗi sợ lửa bằng cách học cách lướt qua những cú đâm và vung trượng của thầy; học trò của Lửa thì lấy lửa chọi lửa, sử dụng chính trượng lửa của mình trong những cuộc đấu tập chết người.#!"
 SHINTAI_DANCE_OF_EMBERS_PERK_EFFECT: "Trở nên miễn nhiễm với lửa.\n#flavor Những kẻ mới nhập môn Tro Tàn và Lửa phải đi qua một mê cung dựng từ vô số đống lửa và bó đuốc. Bất cứ lúc nào, ngọn lửa có thể hóa thành hình người và ôm lấy Kẻ Đói Khát (hay thậm chí tấn công thẳng, trong trường hợp của Lửa), được điều khiển bởi một đạo sư hay bậc thầy đang theo dõi. Thuật Ma Quái của Núi Sắt bị cấm ở đây; nếu ngươi bị bỏng, ngươi cứ bỏng.#!"
 SHINTAI_BEAUTIFUL_SPARK_PERK_EFFECT: "#flavor Học trò không còn phải trải qua những buổi thiền định dài trong Vương Quốc Đêm Tối, cố gắng gọi lửa ấm với những ngón tay đông cứng - Đại nhân [Glossary('Emma-O','podgloss.emmao')], có vẻ như, sẽ không còn khoan dung với khách viếng nữa. Cách khác từng là những hang động và băng hà lạnh giá, nhưng sự ra đời của tủ lạnh công nghiệp thời hiện đại đã trở thành một phước lành.#!"
 SHINTAI_FIRE_TEMPERED_SOUL_PERK_EFFECT: "Mọi [POD_aggravated_damage_with_box|E] liên quan đến ánh dương sẽ bị giới hạn ở mức 1 [POD_damage|E].\n#flavor 'Thiền Định Ánh Ngày' đúng như tên gọi của nó: Học trò của Tro Tàn ngồi trước đường chân trời, ở lại lâu nhất mà y dám. Trong số học trò của Lửa, Thiền Định là một trận đấu kiếm lúc rạng đông, trong đó không ai được phép ngừng cho đến khi một trong hai tự làm nhục bản thân bằng cách cầu xin khoan hồng.#!"
 SHINTAI_THE_SHINTAI_OF_ASH_AND_FIRE_PERK_EFFECT: "Giờ đây ánh dương gây [POD_superficial_damage_with_box|E]. Trở nên miễn nhiễm với các phương thức sát hại bằng ánh dương.\n#flavor Bậc thầy là một vị thần bừng cháy, tức khắc bao trùm trong nhiệt lượng và uy lực tàn phá... Hoặc bậc thầy trở nên gần với con người nhất mà một Xác Chết Đói Khát có thể đạt tới, có thể bước đi dưới ánh dương mà không hề sợ hãi.#!"

 shintai_eyes_in_the_blood_perk_name: "Mắt Trong Máu"
 shintai_flow_like_blood_perk_name: "Chảy Như Máu"
 shintai_lash_of_blood_perk_name: "Roi Máu"
 shintai_bloodwalk_perk_name: "Bước Đi Trong Máu"
 shintai_the_shintai_of_blood_perk_name: "Shintai của Máu"
 SHINTAI_EYES_IN_THE_BLOOD_PERK_EFFECT: "Mỗi năm, chữa lành sự mù lòa của ngươi, dù nó vốn là vĩnh viễn.\n#flavor Một học trò thường của Máu sẽ bị moi mắt, mũi và lưỡi cho đến khi y nhận ra sự thật - rằng y thực ra không còn cần đến chúng nữa. Mọi giác quan, mọi cảm nghiệm của sự tồn tại đều có thể trải nghiệm hoàn toàn qua máu của y.#!"
 SHINTAI_FLOW_LIKE_BLOOD_PERK_EFFECT: "Như một [character_interaction|E], trốn khỏi [imprisonment|E].\nNgươi không còn có thể bị giam cầm trong [sieges|E] hay [raids|E] nữa.\n#flavor Một kẻ nhập môn Máu sẽ ngồi, bị trói và bọc như xác khô, đối diện với một chiếc bình cao chứa đầy chính chất dịch của mình, cho đến khi y có thể rút từng giọt cuối cùng trở lại vào cơ thể. Từ đó, y bắt đầu phá vỡ ảo tưởng về thân xác vật lý của mình, thấu hiểu rằng sự tồn tại thật của y linh động hơn nhiều.#!"
 SHINTAI_LASH_OF_BLOOD_PERK_EFFECT: "#flavor Một đệ tử của những huyền nhiệm cao hơn về Máu phải thiền định giữa một đống các phần thân thể đã bị cắt lìa của chính mình, tháo ra và ráp lại với sự tập trung mãnh liệt, cho đến khi cuối cùng đạt được ngộ tính.#!"
 SHINTAI_BLOODWALK_PERK_EFFECT: "#flavor Trong những đêm xưa, học trò của Máu thử thách bản lĩnh của mình bằng cách tháo cạn huyết mạch xuống các dòng sông và vào đường đi của những cơn cuồng phong. Nước dẫn họ đến đâu, họ sẽ đi đến đó, bất kể đích đến xa xôi và đau đớn thế nào.#!"
 SHINTAI_THE_SHINTAI_OF_BLOOD_PERK_EFFECT: "Như một [character_interaction|E], biến hình thành [GetModifier('POD_shapeshift_form_blood_modifier').GetNameWithTooltip].\n#flavor Một bậc thầy của Shintai Máu hiểu rằng chẳng có 'thân xác' thật sự nào cả, chẳng có 'bản ngã'; chỉ có máu. Y tan rã thành một vũng máu sóng sánh, hay nổ bung dữ dội và tưới đỏ cả căn phòng, và y giữ nguyên trạng thái ấy suốt phần còn lại của cảnh diễn.#!"

 shintai_relentless_bone_perk_name: "Xương Bất Khuất"
 shintai_punishing_bone_perk_name: "Xương Trừng Phạt"
 shintai_bone_obiedience_perk_name: "Sự Tuân Phục Của Xương"
 shintai_garden_of_bones_perk_name: "Khu Vườn Xương"
 shintai_the_shintai_of_bone_perk_name: "Shintai của Xương"
 SHINTAI_RELENTLESS_BONE_PERK_EFFECT: "[POD_aggravated_damage|E] cần để giết ngươi: #P +25%#!.\n#flavor Thời xưa, những học trò thường của Xương từng được phép viếng các địa ngục khác nhau như những khách quý, để bị lột da khỏi xương khi họ kéo đá tảng và trèo lên những ngọn núi gào thét. Xác Chết Đói Khát ngày nay có xu hướng thích các mô phỏng hơn là cách cũ, nhưng kết quả vẫn như nhau.#!"
 SHINTAI_PUNISHING_BONE_PERK_EFFECT: "#flavor Một khoảnh khắc đáng sợ đối với học trò của Xương, tập tục thường thấy là chôn sống học trò, tốt nhất là bằng cách gây ra lở đá hoặc dưới một lượng quặng sắt đã chuẩn bị sẵn. Ở đó học trò của Xương sẽ ở lại, cho đến khi cô đạt được ngộ tính và sức mạnh để phá vỡ đường ra, hoặc cô tìm được sự an nghỉ cuối cùng trong bóng tối của kim loại.#!"
 SHINTAI_BONE_OBIEDIENCE_PERK_EFFECT: "#flavor Để trở thành một đệ tử của những huyền nhiệm cao hơn về Xương, học trò phải để bản thân chịu sự can thiệp của một bậc thầy, cho phép xương của mình bị vặn xoắn thành những hình dạng đau đớn và khó hiểu. Sau đó chỉ còn việc ngồi thiền định cho đến khi cô đạt đủ ngộ tính để tự phá vỡ trở lại hình dạng đúng đắn, và từ đó vượt xa hơn nữa. Ở miền đông Nhật Bản, họ liên hệ việc rèn luyện này với Ebisu, đứa trẻ đỉa không xương trong huyền thoại và là một trong bảy vị thần tài lộc.#!"
 SHINTAI_GARDEN_OF_BONES_PERK_EFFECT: "[POD_aggravated_damage|E] cần để giết ngươi: #P +25%#!.\n#flavor Đến ngưỡng cửa của sự tinh thông, một đạo sư của Xương hướng kiến thức của mình ra ngoài, thí nghiệm trên cả xương sống của kẻ sống và kẻ chết. Khác với việc rèn luyện trước đó, để đạt được kỹ thuật này cần một loại bất khuất khác: một nhiệt tâm lặng lẽ và cần cù để vặn, bẻ, chữa lành, rồi lặp lại, mãi mãi, qua những tiếng thét của các đối tượng thí nghiệm khác nhau của Kẻ Đói Khát - cho đến khi, cuối cùng, sự thấu hiểu đến.#!"
 SHINTAI_THE_SHINTAI_OF_BONE_PERK_EFFECT: "Ô [POD_health_track|E]: #P +1#!.\n#flavor Bậc thầy của Xương không khuất phục trước thế gian; cô cắt xuyên qua nó như dao xuyên qua gân và mỡ. Khi được kích hoạt, Shintai khiến Kẻ Đói Khát mang một vẻ sáng nhạt và bóng loáng, như thể toàn thân cô đã hóa thành xương cứng. [Glossary('Bồ Tát','podgloss.bodhisattva')] của Hoa Xương và các Xác Chết Đói Khát cổ xưa khác có thể thay vào đó mang thân thể bằng kim loại đen tuyền, tối đến mức hút hết ánh sáng xung quanh.#!"

 shintai_the_flow_of_worship_perk_name: "Dòng Chảy Của Sự Sùng Bái"
 shintai_your_god_beckons_perk_name: "Thần Của Ngươi Vẫy Gọi"
 shintai_touch_of_the_asura_perk_name: "Cái Chạm Của A-Tu-La"
 shintai_festival_night_perk_name: "Đêm Lễ Hội"
 shintai_the_shintai_of_devotion_perk_name: "Shintai của Sự Sùng Kính"
 SHINTAI_THE_FLOW_OF_WORSHIP_PERK_EFFECT: "Mỗi năm, khám phá mọi [secrets|E] mà [CHARACTER.Custom('PODCoterie')] của ngươi biết.\n#flavor Khác với các Thân Thần khác, giai đoạn đầu của Shintai Sùng Kính tự nhiên như mở một cánh cửa. Một Thần Linh non trẻ hiếm khi tin vào chính thần tính của mình ngay từ đầu; họ phải được thuyết phục qua trải nghiệm. Nhưng khi Thần Linh biết được sự thật và có được tín đồ đầu tiên của mình, những lời thì thầm sẽ nhanh chóng bắt đầu.#!"
 SHINTAI_YOUR_GOD_BECKONS_PERK_EFFECT: "Như một [character_interaction|E], gọi một thành viên vô lãnh địa của [CHARACTER.Custom('PODCoterie')] về [court|E] của ngươi.\n#flavor Khác với các vị thần trên trời, các Thần Linh không thể ở mọi nơi hay thấy mọi việc tín đồ của mình làm. Tuy nhiên, không cần lâu để rong ruổi qua các Cõi Trời Thấp, thưởng phạt tín đồ theo ý mình, trước khi định mệnh và không gian bắt đầu khuất phục trước Thần Linh - như lẽ ra phải vậy.#!"
 SHINTAI_TOUCH_OF_THE_ASURA_PERK_EFFECT: "Mọi thành viên [CHARACTER.Custom('PODCoterie')] nhận [GetModifier('shintai_touch_of_the_asura_modifier').GetNameWithTooltip].\n#flavor Về lý thuyết, một vị thần không bao giờ bị buộc phải đáp lại lời cầu nguyện; chỉ có ý chí và thiên nhãn của thần dẫn dắt một Thần Linh thực hiện ước vọng của tín đồ. Nhưng trong thực tế, các Thần Linh lại có xu hướng thích có những đoàn tín đồ đông đảo, và họ nhanh chóng học được cách giữ cho người thường vui vẻ và phục tùng.#!"
 SHINTAI_FESTIVAL_NIGHT_PERK_EFFECT: "Mỗi năm, mất @stress_icon![static_stress|E] dựa trên số thành viên trong [CHARACTER.Custom('PODCoterie')] của ngươi.\n#flavor Năng lực đặc trưng của các Thần Linh, và nguồn gốc của cái tên xúc phạm 'Kẻ Ăn Lời Cầu Nguyện,' một Kẻ Đói Khát đến hiểu được sự kết nối trực tiếp của mình với dòng chảy tâm linh và sự sùng bái trong thế giới người thường. Điều này thường đến sau khi Thần Linh được hưởng lễ hội thật sự đầu tiên tôn vinh mình.#!"
 SHINTAI_THE_SHINTAI_OF_DEVOTION_PERK_EFFECT: "Nhận [strong_hook|E] lên mọi thành viên [CHARACTER.Custom('PODCoterie')].\n#flavor Shintai của Sự Sùng Kính, khi được kích hoạt ở mức tinh thông tối đa, đưa các tín đồ người thường của Thần Linh vào sự hiệp thông hoàn toàn với nàng, cả thân xác và linh hồn.#!"

 shintai_excellent_corpse_perk_name: "Xác Chết Tuyệt Diệu"
 shintai_flowers_of_flesh_perk_name: "Hoa Của Da Thịt"
 shintai_human_sculpture_perk_name: "Tượng Người"
 shintai_a_thousand_forms_of_flesh_perk_name: "Ngàn Hình Dạng Của Da Thịt"
 shintai_the_shintai_of_flesh_perk_name: "Shintai của Da Thịt"
 SHINTAI_EXCELLENT_CORPSE_PERK_EFFECT: "Như một [character_interaction|E], thao túng [trait|E] [GetTrait('scarred').GetName(GetPlayer)] của ngươi.\n#flavor Nhiều cái chết sáng tạo chờ đợi học trò thường của Da Thịt: treo cổ, cưa làm đôi, nghiền nát... Cuối cùng, Kẻ Đói Khát đến hiểu rằng có một nghệ thuật trong việc chết, rằng ngay cả một xác chết cũng chứa vô số khả năng biểu đạt. Ở vài nơi Đông Nam Á, việc rèn luyện này tạo điều kiện cho tập tục lâu đời là tách phần trên và phần dưới cơ thể khi ra ngoài đi săn - một lời nhắc nhở cho Xác Chết Đói Khát, cùng những điều khác, rằng có lúc để hành xử như người và có lúc để trung thực.#!"
 SHINTAI_FLOWERS_OF_FLESH_PERK_EFFECT: "Như một [character_interaction|E], thay đổi một [trait|E] thể chất của ngươi với thời gian hồi 10 năm.\n#flavor Tập tục truyền thống nghi thức chặt đầu một học trò và chôn đầu y trong một khu vườn, để y có thể tự tái tạo bản thân từ tàn tích của các xác chết chôn khác và học được bản chất chuyển hóa của da thịt, đã trở nên ít phổ biến hơn theo thời gian - Trong số một số Xác Chết Đói Khát, nó thậm chí còn bị coi là hơi lỗi thời.#!"
 SHINTAI_HUMAN_SCULPTURE_PERK_EFFECT: "Cải thiện [GetPerk('shintai_flowers_of_flesh_perk').GetName(GetPlayer)] bằng cách tăng số [traits|E] ngươi có thể thay đổi lên 2 mỗi lượt.\n#flavor Tìm khoái lạc trong da thịt của chính mình là một việc; tỉ mỉ bắt chước từng cái nháy mắt và co giật của một người sống lại là chuyện khác hẳn. Như một học trò của nghệ thuật thị giác, đệ tử của những huyền nhiệm cao hơn về Da Thịt nghiên cứu hình dạng, tướng mạo và cử động với sự tập trung chuyên chú, chỉ tốt nghiệp khi y đã chọn một mục tiêu và sao chép họ đến hoàn hảo - đôi khi đến mức bản gốc bị chỉ ra là 'kẻ mạo danh' và bị xử lý ngay bởi những người từng yêu thương và tin tưởng y.#!"
 SHINTAI_A_THOUSAND_FORMS_OF_FLESH_PERK_EFFECT: "Cải thiện [GetPerk('shintai_flowers_of_flesh_perk').GetName(GetPlayer)] bằng cách giảm thời gian hồi xuống 5 năm.\nNhư một [character_interaction|E], biến hình thành nhiều hình dạng thú vật khác nhau kể cả những thú vật thần thoại như rồng.\n#flavor Có những truyền thuyết kể về các tiên nhân trên trời dành thời gian làm những con ngựa thanh tú, hay làm khỉ trên núi. Trong những đêm hiện đại, một học trò của Da Thịt đạt đến giác ngộ này khi một bậc thầy biến y thành chim sẻ hay một sinh vật nhỏ khác, và tự biến mình thành một kẻ săn mồi đỉnh cao. Học trò không được phép trở lại hình người cho đến khi y linh động và biến ảo như các tiên nhân trong truyền thuyết - hoặc cho đến khi bậc thầy, trong thất vọng, biến học trò thành một con quái vật và giam y lại để thiền định về những thất bại của mình.#!"
 SHINTAI_THE_SHINTAI_OF_FLESH_PERK_EFFECT: "Cải thiện [GetPerk('shintai_flowers_of_flesh_perk').GetName(GetPlayer)] bằng cách bỏ giới hạn [trait|E] và thời gian hồi, cũng như cho phép nó thay đổi [traits|E] của các nhân vật khác sau khi vượt qua một lần kiểm tra [prowess|E].\n#flavor Khác với các cột-xác-chết khác của các Ma Thần Bất Tử, Shintai của Da Thịt khó mà mô tả như một hình dạng cụ thể: Bậc thầy, ở trạng thái hoàn thiện của mình, trở thành một vector của sự biến đổi thuần túy. Mọi hình dạng đều sẵn có với y, và mọi da thịt y chạm vào đều như đất sét thô để nhồi nắn.#!"

 shintai_the_root_of_illusion_perk_name: "Cội Rễ Của Huyễn Ảnh"
 shintai_non_self_perk_name: "Vô Ngã"
 shintai_glittering_paradise_perk_name: "Thiên Đường Lấp Lánh"
 shintai_rakshasa_blade_perk_name: "Lưỡi Kiếm La Sát"
 shintai_the_shintai_of_illusion_perk_name: "Shintai của Huyễn Ảnh"
 SHINTAI_THE_ROOT_OF_ILLUSION_PERK_EFFECT: "Như một [character_interaction|E], buộc một $POD_splat_vampire$ phát cuồng hoặc gây cho họ @stress_icon!50 [static_stress|E].\n#flavor Dục vọng là cội rễ của huyễn ảnh; đây là bài học đầu tiên mọi tín đồ học được. Một bậc thầy buộc học trò thường của Huyễn Ảnh phải nhận ra sự trống rỗng trong những vướng bận của mình, ngay cả những tình yêu sâu sắc và cốt lõi nhất - Nhưng không phải việc của bậc thầy để vặn xoắn và phá hủy những liên kết này; học trò phải tự làm những việc đó.#!"
 SHINTAI_NON_SELF_PERK_EFFECT: "#flavor Một bậc thầy của Huyễn Ảnh có thể dệt nên một ảo cảnh hoàn chỉnh đến mức những người bên trong nó tin rằng họ là những gì bậc thầy nói họ là: một người đưa thư khiêm nhường, một người tình mê hoặc, một kẻ giết người hàng loạt, một kẻ ăn xin. Và khi cơn mộng tan biến, và học trò của Huyễn Ảnh tỉnh dậy nhận ra bản chất thật của mình, điều đó còn có thể dẫn đến đâu ngoài giác ngộ?#!"
 SHINTAI_GLITTERING_PARADISE_PERK_EFFECT: "#flavor Khi học trò của Huyễn Ảnh đã hiểu những điều cơ bản, họ thường theo đuổi thuật huyễn ảnh với sự buông thả cuồng nhiệt. Bước nhảy từ kẻ nhập môn lên đệ tử xảy ra khi học trò trải qua một thất bại to lớn, chịu đựng hậu quả của một huyễn ảnh sụp đổ. Sau đó họ phải ngồi giữa đổ nát, bất kể nó là gì, và xây dựng lại.#!"
 SHINTAI_RAKSHASA_BLADE_PERK_EFFECT: "Như một [character_interaction|E], tạo ra một [artifact|E] ngẫu nhiên với [rarity|E] #FAMEDBLUE Danh Tiếng#!.\n#flavor Lần này rồi lần khác, bậc thầy nhắc nhở học trò: Họ không áp đặt huyễn ảnh lên thế giới thực - Không có thế giới thực nào cả. Một thứ gọi là huyễn ảnh không khác gì một thứ gọi là sự thật. Kỹ thuật này đi một chặng đường dài để chứng minh nguyên lý Pháp Môn này, nhưng đôi khi một đạo sư phải mất một ngón tay hay một bàn chân trước khi nó thấm nhuần.#!"
 SHINTAI_THE_SHINTAI_OF_ILLUSION_PERK_EFFECT: "#flavor Shintai của Huyễn Ảnh là một thế-giới-huyễn-ảnh hoàn chỉnh đến mức thế giới 'thực' hoàn toàn khuất phục theo ý nó, dù chỉ trong một khoảnh khắc ngắn ngủi.#!"

 shintai_smiling_at_thunder_perk_name: "Mỉm Cười Trước Sấm Sét"
 shintai_tread_the_dragons_tail_perk_name: "Bước Trên Đuôi Rồng"
 shintai_earths_embrace_perk_name: "Vòng Tay Của Đất"
 shintai_catching_the_wind_perk_name: "Bắt Lấy Gió"
 shintai_the_shintai_of_jade_perk_name: "Shintai của Ngọc Bích"
 SHINTAI_SMILING_AT_THUNDER_PERK_EFFECT: "#flavor Bài rèn luyện đầu tiên điển hình của Ngọc Bích là một màn kịch tính: một cơn bão sấm, một sườn núi lởm chởm với vực sâu và sóng dữ dập vào dưới chân, cả bậc thầy và học trò đi chân trần trên con đường trơn trượt, chỉ với nắm đấm hay dao. Trận đấu không kết thúc cho đến khi bậc thầy nói là xong.#!"
 SHINTAI_TREAD_THE_DRAGONS_TAIL_PERK_EFFECT: "#flavor Nhiều luận thuyết đã được viết về những chuyển động và tư thế cần thiết để đạt được sự thấu hiểu về Ngọc Bích. Chúng không hoàn toàn vô ích, nhưng không có gì thay thế được trải nghiệm trực tiếp - Kẻ nhập môn muốn tinh thông kỹ thuật này cuối cùng phải thực hiện một bước nhảy đức tin theo đúng nghĩa đen.#!"
 SHINTAI_EARTHS_EMBRACE_PERK_EFFECT: "#flavor Địa Ngục Chôn Sống là một cõi địa ngục nhỏ, dành cho những kẻ đã giết người khác theo đúng cách này. Đó là một đồng cỏ yên tĩnh, rải rác vài cây non và không có gì khác - Nhưng nếu ngươi lắng nghe gió thật kỹ, ngươi có thể nghe được những tiếng thét nghẹn của những học trò đầy hứa hẹn.#!"
 SHINTAI_CATCHING_THE_WIND_PERK_EFFECT: "#flavor Để bay như một tiên nữ trên trời, người ta có thể học trong nhiều năm hay nhiều thập kỷ, hoặc người ta có thể hành trình đến cổng của các Cõi Trời cao hơn, thỉnh cầu các linh thần vinh quang dạy cho một Kẻ Đói Khát hèn mọn cách thức của họ... Hoặc người ta có thể tìm một tiên nữ bị đày xuống trần, hút máu thần của nàng, và thiền định về vẻ đẹp đã mất đi vĩnh viễn.#!"
 SHINTAI_THE_SHINTAI_OF_JADE_PERK_EFFECT: "Như một [character_interaction|E], biến hình thành [GetModifier('POD_shapeshift_form_the_shintai_of_jade_modifier').GetNameWithTooltip].\n#flavor Shintai của Ngọc Bích biến Xác Chết Đói Khát thành những vị thần của đất đai. Đất, trời, và thân xác đã chết như hòa làm một, kéo dài chừng nào bậc thầy có thể duy trì được.#!"

 shintai_touch_of_the_stranger_perk_name: "Cái Chạm Của Người Lạ"
 shintai_hemorrhagic_strike_perk_name: "Cú Đánh Xuất Huyết"
 shintai_fevers_purity_perk_name: "Sự Thanh Khiết Của Cơn Sốt"
 shintai_wild_eyed_bulwark_perk_name: "Thành Trì Mắt Dại"
 shintai_the_shintai_of_poxes_perk_name: "Shintai của Ôn Dịch"
 SHINTAI_TOUCH_OF_THE_STRANGER_PERK_EFFECT: "Như một [character_interaction|E], gây bệnh hoặc chữa bệnh cho mục tiêu của ngươi.\n#flavor Không thiếu những kẻ bệnh tật và hấp hối trên thế gian này. Học trò từ tâm sống giữa họ, học cách ban phát một cái chạm chữa lành - hoặc, đôi khi, để cho điều tất yếu diễn ra mà không chậm trễ. Nhưng không phải mọi học trò của Ôn Dịch đều tử tế như vậy.#!"
 SHINTAI_HEMORRHAGIC_STRIKE_PERK_EFFECT: "#flavor Kẻ nhập môn Ôn Dịch phải nuốt một con ma quỷ ký sinh, theo truyền thống được lấy từ Địa Ngục Giòi Bọ Đào Hang. Sinh vật này cuộn quanh nội tạng đã chết của Kẻ Đói Khát và hút lấy máu bị đánh cắp của nàng, khi học trò thiền định trong cơn đau đớn lặng câm. Cuối cùng, cơ thể hấp thụ và tiêu diệt con ma quỷ - Nhưng ký ức về nỗi đau đã dạy bài học của nó.#!"
 SHINTAI_FEVERS_PURITY_PERK_EFFECT: "Như một [character_interaction|E], mất @stress_icon!100 [static_stress|E] với giá phải nhận [GetTrait('crimson_fever').GetName(GetPlayer)].\n#flavor Đệ tử của Ôn Dịch chấp nhận một cơn sốt nghiền nát, được trao bởi một bậc thầy hay một linh thần quyền năng - có lẽ một trong những vị thần ôn dịch còn lang thang trên bán đảo Triều Tiên, hay một viên chức bệnh hoạn của Thành Phố Xấu Xa mang theo một túi thuốc đáng ngờ. Đáng tiếc, cần nhiều hơn một cơn sốt để hiểu được năng lực tẩy tịnh của nó.#!"
 SHINTAI_WILD_EYED_BULWARK_PERK_EFFECT: "Như một [character_interaction|E], chữa [EmptyScope.ScriptValue('POD_wild_eyed_bulwark_heal_value')|V0] [POD_aggravated_damage_with_box|E] với giá phải nhận [GetTrait('crimson_fever').GetName(GetPlayer)].\n#flavor Có lời kể rằng những huyền nhiệm cao hơn của Shintai Ôn Dịch nằm trong một văn bản bị đánh cắp từ chính Nữ Chủ Ôn Dịch, được đưa lậu ra khỏi Ngàn Địa Ngục bằng cách biến mỗi từ thành một căn bệnh. Những căn bệnh ấy vẫn xuất hiện trên thế gian, chờ đợi những đạo sư cẩn trọng và tinh tường tìm ra, thu thập và giải mã chúng.#!"
 SHINTAI_THE_SHINTAI_OF_POXES_PERK_EFFECT: "Như một [character_interaction|E], gieo một [epidemic|E] lớn theo ý ngươi chọn tại địa điểm của mục tiêu ngươi.\n#flavor Shintai của Ôn Dịch, khi được kích hoạt ở mức tinh thông tối đa, là uy lực thô của bệnh tật - và ngộ tính nóng bỏng - được ban hình dạng.#!"

 shintai_breath_of_the_sky_perk_name: "Hơi Thở Của Bầu Trời"
 shintai_arms_of_the_sea_perk_name: "Cánh Tay Của Biển Khơi"
 shintai_thunderbolts_kiss_perk_name: "Nụ Hôn Của Tia Chớp"
 shintai_chamber_bed_of_clouds_perk_name: "Khuê Phòng Trên Mây"
 shintai_the_shintai_of_storms_perk_name: "Shintai của Bão Tố"
 SHINTAI_BREATH_OF_THE_SKY_PERK_EFFECT: "#flavor Một học trò thường của Bão Tố quan sát không khí trên cao và nghiên cứu sự chuyển động của nó, thiền định dưới mưa đá và mưa cũng như dưới bầu trời đầy sao. Những học trò thú tính hay kém kiên nhẫn hơn sẽ uống linh khí của các tiên gió, hay tự trói mình vào diều lụa để thiền định trực tiếp hơn về uy lực của gió.#!"
 SHINTAI_ARMS_OF_THE_SEA_PERK_EFFECT: "Như một [character_interaction|E], thao túng thời tiết trên một [duchy|E] mà mục tiêu của ngươi đang ở.\nMở khóa tùy chọn #V Hạn Hán#! trong [character_interaction|E] [GetPerk('shintai_arms_of_the_sea_perk').GetName(GetPlayer)].\nMở khóa tùy chọn #V Đất Đai Màu Mỡ#! trong [character_interaction|E] [GetPerk('shintai_arms_of_the_sea_perk').GetName(GetPlayer)].\n#flavor Có những tiên cá và thần biển - không chỉ Mẫu Thần Vực Sâu và những đứa con vảy bạc của bà, mà những sinh thể thật sự của nguồn nước trên đất, sở hữu trí tuệ thánh hiền The Shintai of Storms và pháp lực vĩ đại. Một học trò của Bão Tố, có hoặc không có bậc thầy, tìm đến những sinh thể này và thỉnh cầu họ trí tuệ.#!"
 SHINTAI_THUNDERBOLTS_KISS_PERK_EFFECT: "#flavor Tìm được một tia sét để bị đánh trúng là rất khó khăn. Nó phải là một tia chớp tự nhiên, thật sự từ trên trời, không được gọi ra hay tạo ra, mà được hút trực tiếp về tay - và tất nhiên, sau đó phải sống sót qua được.#!"
 SHINTAI_CHAMBER_BED_OF_CLOUDS_PERK_EFFECT: "Cải thiện [GetPerk('shintai_arms_of_the_sea_perk').GetName(GetPlayer)] bằng cách cho phép nó nhắm vào toàn bộ một [kingdom|E].\nMở khóa tùy chọn #V Bão Tố#! trong [character_interaction|E] [GetPerk('shintai_arms_of_the_sea_perk').GetName(GetPlayer)].#flavor Nước, không khí, dòng điện vô hình của uy lực: Mọi thành phần cần thiết đều đã có sẵn, và đạo sư của Bão Tố theo truyền thống dành nhiều năm để hiểu được kỹ thuật cần thiết để rèn chúng thành pháp thuật thời tiết. Tuy nhiên, trong thời đại của những kỳ tài ma quái này, một Kẻ Đói Khát có thể học cách điều khiển mưa trong thời gian ngắn hơn nhiều so với trước kia.#!"
 SHINTAI_THE_SHINTAI_OF_STORMS_PERK_EFFECT: "Cải thiện [GetPerk('shintai_arms_of_the_sea_perk').GetName(GetPlayer)] bằng cách cho phép nó nhắm vào toàn bộ một [empire|E].\n#flavor Toàn bộ uy lực của Shintai Bão Tố là sự hủy diệt thô sơ, thuần khiết của thiên nhiên - Nhưng nó có thể được kiểm soát, nếu người ta thật cẩn trọng.#!"

 shintai_smokeshow_perk_name: "Trình Diễn Khói"
 shintai_a_smoker_has_eyes_in_the_back_of_the_head_perk_name: "Kẻ Hút Khói Có Mắt Sau Đầu"
 shintai_reach_of_smoke_perk_name: "Tầm Với Của Khói"
 shintai_a_body_of_smoke_perk_name: "Một Thân Thể Bằng Khói"
 shintai_the_shintai_of_smoke_perk_name: "Shintai của Khói"
 SHINTAI_SMOKESHOW_PERK_EFFECT: "#flavor Kẻ Đói Khát có thể thao túng khói đã có sẵn, mở rộng thể tích của nó lên đến diện tích của một trang viên lớn, cũng như tạo hình nó thành mọi loại hình dạng thú vị hay đáng sợ.#!"
 SHINTAI_A_SMOKER_HAS_EYES_IN_THE_BACK_OF_THE_HEAD_PERK_EFFECT: "#flavor Xác Chết Đói Khát có thể theo phản xạ biến một phần cơ thể mình thành khói, thành công thoát khỏi đòn tấn công sắp tới.#!"
 SHINTAI_REACH_OF_SMOKE_PERK_EFFECT: "#flavor Bằng cách tập trung và không thực hiện hành động khác, Kẻ Đói Khát có thể ban cho một cột khói duy nhất độ rắn và tầm với của một xúc tu dài, cho họ khả năng thực hiện các hành động vật lý từ khoảng cách trong tầm mắt (kể cả giao chiến) như thể đang có mặt trực tiếp.#!"
 SHINTAI_A_BODY_OF_SMOKE_PERK_EFFECT: "Như một [character_interaction|E], biến hình thành [GetModifier('POD_shapeshift_form_incorporeal_modifier').GetNameWithTooltip].\n#flavor Xác Chết Đói Khát biến thành khói, vẫn giữ hình dạng người nhưng hoàn toàn miễn nhiễm với hầu hết các nguồn gây thương tổn tự nhiên.#!"
 SHINTAI_THE_SHINTAI_OF_SMOKE_PERK_EFFECT: "#flavor Với sự thấu hiểu hoàn toàn về khói, người ta có thể biến thành nó, không còn bị ràng buộc bởi hình dạng cố định nào.#!"
