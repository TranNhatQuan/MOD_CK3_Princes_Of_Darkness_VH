l_english:
 soul_arts_lifestyle_name: "Pháp Nghệ Linh Hồn"
 soul_arts_lifestyle_desc: "Pháp Nghệ Linh Hồn là sự tu luyện mở rộng từ các Đức Hạnh (Virtue) cốt lõi và sự dẫn dắt Khí. Tiềm năng của chúng vô cùng lớn, nhưng để đạt tới đó lại khó khăn và chậm chạp."
 soul_arts_lifestyle_highlight_desc: "Nhờ [Glossary('Pháp Môn','podgloss.dharma')] của bạn, bạn nhận thêm #P [GetPlayer.MakeScope.ScriptValue('dharma_lifestyle_xp_mult')|%0]#! [experience|E] trong Lối Sống này."
 monthly_soul_arts_lifestyle_xp_gain_mult: "[experience|E] Pháp Nghệ Linh Hồn [lifestyle|E] hàng tháng"
 monthly_soul_arts_lifestyle_xp_gain_add: "[experience|E] Pháp Nghệ Linh Hồn [lifestyle|E] hàng tháng"

 soul_arts_focus: "Trọng Tâm Pháp Nghệ Linh Hồn"
 soul_arts_focus_modifier: "[GetFocus('soul_arts_focus').GetName]"
 soul_arts_focus_desc: "Tu luyện linh hồn của bạn."
 soul_arts_focus_effect_desc: "Tập trung vào Pháp Nghệ Linh Hồn mang lại:"

 the_ghost_arts_visible: "Quỷ Nghệ"
 the_heavenly_arts_visible: "Thiên Nghệ"
 the_beast_arts_visible: "Thú Nghệ"
 the_devil_arts_visible: "Ma Nghệ"
 the_dragon_tear_visible: "Long Lệ"
 the_hell_weaving_visible: "Địa Ngục Chức Pháp"

 soul_arts_ghost_mask_perk_name: "Quỷ Diện"
 soul_arts_crippling_sorrows_perk_name: "Nỗi Đau Tê Liệt"
 soul_arts_death_lines_perk_name: "Tử Tuyến"
 SOUL_ARTS_GHOST_MASK_PERK_EFFECT: "Cho phép bạn tương tác với những sinh vật của [umbra|E] khi bạn đang ở thế giới vật chất.\n#flavor Người Chết Đói Khát dẫn Khí u linh chảy qua mặt và thân thể mình, cho phép nàng nhìn sâu hơn vào Âm Phủ và nói chuyện với các cư dân ở đó như thể nàng đang đứng cùng họ.#!"
 SOUL_ARTS_CRIPPLING_SORROWS_PERK_PERK_EFFECT: "Là một [character_interaction|E], trao [GetModifier('soul_arts_crippling_sorrows_modifier').GetNameWithTooltip] cho mục tiêu của bạn trong 5 năm.\n#flavor Kẻ nhìn vào người tu luyện bỗng nhớ lại, ngay lập tức, tất cả những gì họ đã mất.#!"
 SOUL_ARTS_DEATH_LINES_PERK_EFFECT: "#flavor Người tu luyện có thể vạch trần sự mong manh của tồn tại, cho thấy vạn vật có thể tan vỡ và chết đi dễ dàng thế nào.#!"

 soul_arts_like_a_whisp_perk_name: "Như Làn Khói"
 soul_arts_beacon_of_longing_perk_name: "Hải Đăng Khát Vọng"
 soul_arts_the_touch_of_ghost_metal_perk_name: "Chạm Vào Quỷ Kim"
 SOUL_ARTS_LIKE_A_WHISP_PERK_EFFECT: "Là một [character_interaction|E], chặn mọi [schemes|E] nhắm vào bạn.\n#flavor Người tu luyện trải một lớp Khí đen như mực lên toàn thân, trở nên vô hình thực sự trước mắt người trần.#!"
 SOUL_ARTS_BEACON_OF_LONGING_PERK_EFFECT: "$POD_can_summon_wraith_trigger_loca$\n$POD_can_summon_on_death_trigger_loca$\n#flavor Khí của Người Chết Đói Khát rực sáng như một đống lửa trắng- vô hình với kẻ sống, nhưng mê hoặc kẻ chết.#!"
 SOUL_ARTS_THE_TOUCH_OF_GHOST_METAL_PERK_EFFECT: "#flavor Kim loại của âm giới bị nguyền rủa, gây thương tích nghiêm trọng cho cư dân bản địa của nó. Kỹ thuật này biến bất kỳ kim loại trần thế nào thành cùng một chất liệu ấy.#!"

 soul_arts_world_of_quiet_perk_name: "Thế Giới Tịch Lặng"
 soul_arts_through_the_spider_lily_gate_perk_name: "Qua Cổng Hoa Loa Kèn Nhện"
 soul_arts_making_love_to_ghosts_perk_name: "Ân Ái Với Hồn Ma"
 SOUL_ARTS_WORLD_OF_QUIET_PERK_EFFECT: "Là một [character_interaction|E], trao [GetModifier('soul_arts_world_of_quiet_modifier').GetNameWithTooltip] cho mục tiêu của bạn trong 10 năm.\n#flavor Khi người tu luyện cần gặp mặt trong riêng tư, kỹ thuật này phủ một lớp màn che lên nàng và đồng bọn của nàng- hoặc lên những nạn nhân không hề hay biết.#!"
 SOUL_ARTS_THROUGH_THE_SPIDER_LILY_GATE_PERK_EFFECT: "#flavor Với kỹ thuật này, toàn bộ âm giới mở ra cho người tu luyện, nếu ai đó sẵn lòng bước vào.#!"
 SOUL_ARTS_MAKING_LOVE_TO_GHOSTS_PERK_EFFECT: "$POD_can_bind_wraith_trigger_loca$\n$POD_can_command_wraith_trigger_loca$\n#flavor Truyện dân gian là sự thật: Thân mật với kẻ chết rồi sẽ có ngày nhập vào cùng họ. Người Chết Đói Khát phóng ra một chất độc đen u linh, phun trực tiếp từ miệng hoặc như một lớp sương từ lỗ chân lông.#!"

 soul_arts_haunters_rage_perk_name: "Cơn Cuồng Nộ Của Kẻ Ám Ảnh"
 soul_arts_curse_of_ashes_perk_name: "Lời Nguyền Tro Tàn"
 SOUL_ARTS_HAUNTERS_RAGE_PERK_EFFECT: "$POD_can_weaken_fetter_trigger_loca$\n#flavor Hồn ma là những sinh vật của cực đoan đầy đam mê, và người tu luyện mô phỏng điều đó bằng cách dẫn dắt sự hỗn loạn u linh.#!"
 SOUL_ARTS_CURSE_OF_ASHES_PERK_EFFECT: "Trao một [GetModifier('soul_arts_curse_of_ashes_modifier').GetNameWithTooltip] cho [knights|E] của kẻ địch khi đóng vai [commander|E] trong [combat_phase|E], hoặc cho đối thủ của bạn trong [single_combat_duel_plural|E].\n#flavor Người Chết Đói Khát chạm vào mục tiêu đã chọn, khiến họ hoàn toàn không thể thỏa mãn bản thân. Đói, khát và dục vọng đều trở nên không thể chịu đựng, nhưng không lượng thức ăn hay khoái lạc nào có thể giúp được.#!"

 soul_arts_graveyard_song_perk_name: "Khúc Ca Nghĩa Trang"
 soul_arts_death_punch_perk_name: "Cú Đấm Tử Thần"
 SOUL_ARTS_GRAVEYARD_SONG_PERK_EFFECT: "Là một [character_interaction|E], trao [GetModifier('soul_arts_graveyard_song_modifier').GetNameWithTooltip] cho [duchy|E] mà mục tiêu của bạn đang ở.\n#flavor Người tu luyện tìm một nơi tĩnh lặng vang vọng cùng người chết và ngân lên một điệu nhạc du dương, vọng vang- một khúc bi ca hay một bản tình ca buồn, khó mà phân biệt. Những người yêu cũ tái hợp, thành viên gia đình đã khuất chia sẻ bí mật của họ, và trong một khoảnh khắc thoáng qua, kẻ sống và kẻ chết như hòa làm một.#!"
 SOUL_ARTS_DEATH_PUNCH_PERK_EFFECT: "Nếu một nhân vật bạn đã giết hồi sinh, họ sẽ nhận [GetModifier('soul_arts_death_punch_modifier').GetNameWithTooltip] trong 10 năm.\n#flavor Chỉ với một cú đánh, người tu luyện chia tách xác thịt và linh hồn, có thể là vĩnh viễn.#!"


 soul_arts_mortal_perfection_perk_name: "Hoàn Hảo Của Người Trần"
 soul_arts_the_scent_of_heavens_favor_perk_name: "Hương Thơm Của Thiên Ân"
 SOUL_ARTS_MORTAL_PERFECTION_PERK_EFFECT: "Là một [character_interaction|E], trao [GetModifier('soul_arts_mortal_perfection_modifier').GetNameWithTooltip] cho mục tiêu của bạn.\n#flavor Người Chết Đói Khát toát ra Khí thần thánh, hiện lên với những kẻ nhạy cảm về tâm linh như những làn phấn hoa lấp lánh từ da nàng. Nàng luôn sẵn sàng và luôn thanh lịch.#!"
 SOUL_ARTS_THE_SCENT_OF_HEAVENS_FAVOR_PERK_EFFECT: "Là một [character_interaction|E], gọi một [GetTrait('mortal').GetName(GetNullCharacter)] với [skills|E] theo ý bạn chọn đến [court|E] của bạn.\n#flavor Người Chết Đói Khát toát ra Khí thần thánh, hiện lên với những kẻ nhạy cảm về tâm linh như những làn phấn hoa lấp lánh từ da nàng. Nàng luôn sẵn sàng và luôn thanh lịch.#!"

 soul_arts_waywards_brand_perk_name: "Dấu Ấn Kẻ Lạc Lối"
 soul_arts_read_destiny_perk_name: "Đọc Vận Số"
 soul_arts_throat_cage_of_heaven_perk_name: "Lồng Cổ Của Thiên Đường"
 SOUL_ARTS_WAYWARDS_BRAND_PERK_EFFECT: "Là một [character_interaction|E], trao [GetModifier('soul_arts_waywards_brand_modifier').GetNameWithTooltip] cho mục tiêu của bạn.\n#flavor Người Chết Đói Khát chạm vào ai đó, đánh dấu họ là kẻ bị các vị thần khinh miệt. Người ta theo bản năng lùi tránh và xa lánh họ, khiến họ hoang mang và tuyệt vọng.#!"
 SOUL_ARTS_READ_DESTINY_PERK_EFFECT: "Bạn sẽ nhận thông báo nếu ai đó có ý định giết bạn bè hoặc gia đình bạn.\nBạn sẽ nhận thông báo nếu ai đó có ý định dụ dỗ người yêu hoặc tình nhân của bạn.\n#flavor Người tu luyện nhìn vào dòng chảy năng lượng của Hạ Thiên Đường, quan sát cẩn thận nơi nó xoáy tụ và đọng lại.#!"
 SOUL_ARTS_THROAT_CAGE_OF_HEAVEN_PERK_EFFECT: "Có khả năng cao hơn để [imprison|E] [characters|E] sau một [siege|E] hoặc [raid|E] thành công.\n#flavor Người tu luyện phát ra một tiếng ngâm trầm sâu, hoặc ca hát khi dẫn dắt các luân xa trên của mình. Những ai nghe được khúc ca sẽ đông cứng tại chỗ, bị trói buộc bởi những dây xích vàng tâm linh.#!"

 soul_arts_mantle_of_living_prayer_perk_name: "Áo Choàng Lời Cầu Nguyện Sống"
 soul_arts_beloved_champion_perk_name: "Chiến Sĩ Được Yêu Mến"
 soul_arts_fate_of_one_perk_name: "Số Phận Của Một Người"
 soul_arts_the_gods_are_correct_perk_name: "Thần Linh Luôn Đúng"
 SOUL_ARTS_MANTLE_OF_LIVING_PRAYER_PERK_EFFECT: "#flavor Bạn có thể vượt vào Hạ Thiên Đường, nhưng những sinh vật ở đó chỉ tin tưởng đồng loại của mình- và với kỹ thuật này, bạn có thể lừa được chúng khá tốt.#!"
 SOUL_ARTS_BELOVED_CHAMPION_PERK_EFFECT: "Khi một cuộc chiến bắt đầu, chiến sĩ có sức mạnh cao nhất của bạn sẽ nhận [GetModifier('soul_arts_beloved_champion_modifier').GetNameWithTooltip] trong 2 năm.\n#flavor Người tu luyện chỉ định ai đó làm chiến sĩ riêng của mình, chạm vào trán họ bằng một vết máu tỏa ánh vàng rực rỡ, không thể nhầm lẫn trong thế giới tâm linh.#!"
 SOUL_ARTS_FATE_OF_ONE_PERK_EFFECT: "#flavor Người tu luyện tạo ra một dấu hiệu may mắn, ban phước- hoặc gieo nguyền- cho những ai ở gần.#!"
 SOUL_ARTS_THE_GODS_ARE_CORRECT_PERK_EFFECT: "Những nhân vật không có khả năng phòng vệ tinh thần mạnh dễ chấp nhận lời đề nghị thần phục của bạn hơn.\n#flavor Đội một vòng hào quang vàng chỉ những kẻ nhạy cảm về tâm linh mới thấy được, người tu luyện khẳng định quyền uy của mình và tuyên bố một sự thật mà chính nàng cũng tin- và thế gian nghe theo.#!"

 soul_arts_dance_of_the_kinnara_perk_name: "Vũ Điệu Kinnara"
 soul_arts_i_am_your_doom_perk_name: "Ta Là Diệt Vong Của Ngươi"
 SOUL_ARTS_DANCE_OF_THE_KINNARA_PERK_EFFECT: "Là một [character_interaction|E], biến hình thành [GetModifier('POD_shapeshift_form_divine_bird_modifier').GetNameWithTooltip].\n#flavor Một Người Chết Đói Khát biến đổi bản thân trong khoảnh khắc thành một sinh vật lai đẹp đẽ, nửa chim nửa người với đôi cánh vàng óng. Hình dạng này thuộc về tâm linh, nhưng lại tràn ngập năng lực rực sáng đến mức ngay cả người trần bình thường cũng có thể bắt gặp những tia chớp sự thật.#!"
 SOUL_ARTS_I_AM_YOUR_DOOM_PERK_EFFECT: "Là một [character_interaction|E], trao một [modifier|E] làm giảm một [skill|E] đã chọn đi #N 5#! #weak (ví dụ [GetModifier('soul_arts_i_am_your_doom_diplomacy_modifier').GetNameWithTooltip])#! cho mục tiêu của bạn.\n#flavor Kẻ thù của thần linh không sống được lâu- Họ bị người tu luyện gọi tên, và vận số vận hành theo đó.#!"

 soul_arts_divinity_key_perk_name: "Chìa Khóa Thần Thánh"
 soul_arts_fate_of_houses_perk_name: "Vận Số Của Các Gia Tộc"
 SOUL_ARTS_DIVINITY_KEY_PERK_EFFECT: "Loại bỏ chi phí khi vào [umbra|E].\n#flavor Các cõi của Đại Luân Xa mở ra cho bậc thầy. Điều khiến hầu hết những ai đạt được kỹ thuật này ngạc nhiên là nó thực sự hiện ra như một chiếc chìa khóa vàng, tỏa ra ánh sáng nội tại.#!"
 SOUL_ARTS_FATE_OF_HOUSES_PERK_EFFECT: "Là một [character_interaction|E], trao [GetModifier('joss_modifier').GetNameWithTooltip] cho mục tiêu của bạn và toàn bộ [court|E] của họ cũng như tất cả [vassals|E] của họ.\n#flavor Bậc thầy của Thiên Nghệ kéo vận số theo một hướng nhất định, định hình tương lai của một địa điểm cụ thể.#!"




 soul_arts_tea_with_beasts_perk_name: "Trà Cùng Dã Thú"
 soul_arts_at_the_gates_of_wind_and_water_perk_name: "Tại Cổng Gió Và Nước"
 SOUL_ARTS_TEA_WITH_BEASTS_PERK_EFFECT: "#flavor Ngôn ngữ của muôn thú, từ con kiến bé nhỏ nhất đến con cá voi vĩ đại nhất, chẳng là gì với Người Chết Đói Khát.#!"
 SOUL_ARTS_AT_THE_GATES_OF_WIND_AND_WATER_PERK_EFFECT: "Có thể tuyển mộ một số loài động vật làm [men_at_arms|E].\n#flavor Mắt của Người Chết Đói Khát xoáy màu xanh nhạt khi hắn cộng hưởng với Cõi Dã Thú, những sinh vật hoang dã nhỏ nhất kéo đến gần hắn như một đám đom đóm.#!"

 soul_arts_healing_sleep_perk_name: "Giấc Ngủ Trị Liệu"
 soul_arts_goblin_cat_perk_name: "Mèo Yêu Tinh"
 soul_arts_duke_of_the_wild_perk_name: "Công Tước Của Hoang Dã"
 SOUL_ARTS_HEALING_SLEEP_PERK_EFFECT: "Vào lúc bắt đầu một trận chiến, buộc [knight|E] của kẻ địch có [prowess|E] cao nhất phải rời khỏi cuộc chiến miễn là họ không có khả năng phòng vệ tinh thần mạnh.\n#flavor Chỉ với một cái chạm, người tu luyện ban cho giấc ngủ yên bình của mùa đông chuyển sang xuân.#!"
 SOUL_ARTS_GOBLIN_CAT_PERK_EFFECT: "Là một [character_interaction|E], gọi một con thú cưng.\n#flavor Người tu luyện có thể biến bất kỳ con vật nào thành linh thú của mình trong một đêm- hoặc cả một đội quân, nếu Linh Hồn Dã Thú của hắn đủ vĩ đại.#!"
 SOUL_ARTS_DUKE_OF_THE_WILD_PERK_EFFECT: "#flavor Với những ai có giác quan tâm linh, người tu luyện Linh Hồn Dã Thú dường như bị nhấn chìm trong ngọn lửa xanh trắng, sau đó hiện ra dưới hình dạng của một hoang linh mạnh mẽ: một linh hồn đường xá to lớn, hoặc một linh hồn chim ưng khổng lồ, hay bất cứ thứ gì tương tự.#!"

 soul_arts_summon_wilding_spirit_perk_name: "Gọi Hoang Linh"
 soul_arts_junkyard_menagerie_perk_name: "Vườn Thú Bãi Rác"
 soul_arts_running_with_the_wolves_perk_name: "Chạy Cùng Sói"
 SOUL_ARTS_SUMMON_WILDING_SPIRIT_PERK_EFFECT: "#flavor Người tu luyện gọi tên một linh hồn cụ thể, và tiếng gọi ấy không thể nào cưỡng lại được với nó.#!"
 SOUL_ARTS_JUNKYARD_MENAGERIE_PERK_EFFECT: "Có thể tuyển mộ [GetMaA('jagglings').GetName] làm [men_at_arms|E].\n#flavor Người Chết Đói Khát dừng lại để thở ra một làn khí xanh nhạt từ lòng bàn tay, làn khí lắng xuống như bụi và đánh thức các hoang linh của những vật vô tri.#!"
 SOUL_ARTS_RUNNING_WITH_THE_WOLVES_PERK_EFFECT: "#flavor Muôn thú của đất trời thường bỏ qua Gauntlet theo những cách con người không thể, len lỏi qua các con đường cả vật chất và tâm linh.#!"

 soul_arts_god_of_the_glen_perk_name: "Thần Của Khe Núi"
 soul_arts_one_nights_revival_perk_name: "Hồi Sinh Một Đêm"
 SOUL_ARTS_GOD_OF_THE_GLEN_PERK_EFFECT: "Mở khóa một số lựa chọn biến hình thú.\n#flavor Người Chết Đói Khát du hành qua các cõi linh hồn thường bị giới hạn trong một hình dạng gần đúng với thân thể vật chất của họ, nhưng không phải với người tu luyện Linh Hồn Dã Thú.#!"
 SOUL_ARTS_ONE_NIGHTS_REVIVAL_PERK_EFFECT: "Thú cưng của bạn sẽ không thể chết nữa.\n#flavor Sự trớ trêu của kỹ thuật này không thoát khỏi những ai am hiểu chuyện kinh dị. Với một chút hy sinh năng lượng sống nhỏ, một Người Chết Đói Khát có thể làm sống lại một xác người hoặc động vật vừa chết, kết hợp cơ, xương, da và cưỡng ép tia lửa sự sống.#!"

 soul_arts_spirited_away_perk_name: "Bị Cuốn Đi"
 soul_arts_stone_lion_perk_name: "Sư Tử Đá"
 SOUL_ARTS_SPIRITED_AWAY_PERK_EFFECT: "Mỗi #V 15#! năm, nếu thủ đô của bạn có một khe [duchy_building|E], một Tổ Rồng trong đó sẽ được nâng cấp.\n#flavor Vào những đêm hội và trăng tròn, người trần có thể vô tình lạc vào cõi khác... và đôi khi một người tu luyện sẽ ép buộc điều đó xảy ra, gộp họ vào một cơn bão linh hồn khổng lồ.#!"
 SOUL_ARTS_STONE_LION_PERK_EFFECT: "Mở khóa [GetMaA('stone_lions').GetName] làm [men_at_arms|E].\n#flavor Những linh thú hộ vệ của đền thờ và miếu mạo sống lại theo ý muốn của Người Chết Đói Khát.#!"



 soul_arts_ogres_bearning_perk_name: "Uy Thế Yêu Ma"
 soul_arts_read_the_inner_darkness_perk_name: "Đọc Bóng Tối Nội Tâm"
 soul_arts_tears_of_hell_perk_name: "Nước Mắt Địa Ngục"
 SOUL_ARTS_OGRES_BEARNING_PERK_EFFECT: "#flavor Người tu luyện phát ra một luồng khí cháy bỏng, hiện lên với những kẻ nhạy cảm về tâm linh như một con quỷ đáng sợ bao trùm trong lửa- nhưng ai cũng cảm nhận được sự sợ hãi, nhạy cảm hay không.#!"
 SOUL_ARTS_READ_THE_INNER_DARKNESS_PERK_EFFECT: "Là một [character_interaction|E], khám phá một [secret|E] ngẫu nhiên của mục tiêu.\n#flavor Người tu luyện nhìn vào mắt ai đó và thấy điều họ muốn giữ kín.#!"
 SOUL_ARTS_TEARS_OF_HELL_PERK_EFFECT: "Là một [character_interaction|E], gây [stress|E] cho mục tiêu của bạn dựa trên số lượng [sinful|E] [traits|E] của họ.\n#flavor Người Chết Đói Khát tràn ngập mắt và tai mình với khí đỏ như máu, tràn ra và nhỏ giọt. Bất cứ điều gì bị đánh dấu bởi sự sa đọa hay tàn ác giờ đây rõ ràng với nàng như đom đóm trong đêm: những linh hồn bị dày vò, Người Chết Đói Khát mang Suffering, những cổng ẩn dẫn vào địa ngục, và hơn thế nữa.#!"

 soul_arts_wrathful_ajna_perk_name: "Ajna Thịnh Nộ"
 soul_arts_chainbreaker_meditation_perk_name: "Thiền Định Đoạn Xích"
 SOUL_ARTS_WRATHFUL_AJNA_PERK_EFFECT: "#flavor Với kỹ thuật này, trán của Người Chết Đói Khát nứt mở để lộ ra một con mắt đỏ thẫm âm ỉ, chỉ những kẻ nhạy cảm về tâm linh mới thấy được. Con mắt tỏa ra khói đen khi có sự dối trá- và đốt cháy kẻ dối trá nào nhìn vào nó.#!"
 SOUL_ARTS_CHAINBREAKER_MEDITATION_PERK_EFFECT: "Có được khả năng phòng vệ tinh thần mạnh, khiến bạn miễn nhiễm với một số quyền năng tâm linh.\n#flavor Người tu luyện đè bẹp ác quỷ nội tâm của chính mình trong khoái lạc.#!"

 soul_arts_killing_shriek_perk_name: "Tiếng Rú Chết Chóc"
 soul_arts_jeweled_eyes_perk_name: "Mắt Ngọc"
 soul_arts_shadow_self_perk_name: "Bản Ngã Bóng Tối"
 SOUL_ARTS_KILLING_SHRIEK_PERK_EFFECT: "Vào lúc bắt đầu một trận chiến, buộc [knight|E] của kẻ địch có [prowess|E] cao nhất phải rời khỏi cuộc chiến miễn là họ không có khả năng phòng vệ tinh thần mạnh.\n#flavor Giọng nói của Người Chết Đói Khát rú lên với những giày vò của địa ngục.#!"
 SOUL_ARTS_JEWELED_EYES_PERK_EFFECT: "#flavor Rakshasa có thể đẹp đẽ như chúng tàn bạo, nếu chúng muốn. Người tu luyện Hungry Dead toát ra một làn mây tâm linh hồng-đỏ thẫm quyến rũ, đến mức ai nhìn vào mắt hắn cũng sẽ tin mọi lời hắn nói và làm bất cứ điều gì cho hắn.#!"
 SOUL_ARTS_SHADOW_SELF_PERK_EFFECT: "Là một [character_interaction|E], tạo một bản sao của chính bạn.\n#flavor Người Chết Đói Khát ban sự sống cho Devil Soul của mình, dùng khí để làm sống động bóng của nàng thành một tay sai.#!"

 soul_arts_bloody_foresight_perk_name: "Điềm Báo Máu"
 soul_arts_joyful_spark_of_union_perk_name: "Tia Sáng Vui Sướng Của Hợp Nhất"
 soul_arts_agony_liberation_perk_name: "Giải Thoát Khỏi Thống Khổ"
 SOUL_ARTS_BLOODY_FORESIGHT_PERK_EFFECT: "Là một [character_interaction|E], nhận [GetModifier('soul_arts_bloody_forseight_modifier').GetNameWithTooltip] với chi phí 1 [POD_aggravated_damage_with_box|E].\n#flavor Người tu luyện tự cắt cổ mình hoặc ngã vào chông gai- và tương lai được vén màn với sự rõ ràng chấn động.#!"
 SOUL_ARTS_JOYFUL_SPARK_OF_UNION_PERK_EFFECT: "#flavor Ma Nghệ là một lời nguyền, và Suffering là một hình phạt... Nhưng trong tu luyện, vẫn có hy vọng.#!"
 SOUL_ARTS_AGONY_LIBERATION_PERK_EFFECT: "Là một [character_interaction|E], thay đổi các đặc điểm tính cách của bạn với chi phí 1 [POD_aggravated_damage_with_box|E].\n#flavor Con ma quỷ giác ngộ sẽ tháo xích cho bạn bằng đau đớn- Nhưng bạn phải sẵn lòng chết.#!"

 soul_arts_the_final_diadem_perk_name: "Vương Miện Cuối Cùng"
 soul_arts_crack_the_tortoise_shell_perk_name: "Đập Vỡ Mai Rùa"
 SOUL_ARTS_THE_FINAL_DIADEM_PERK_EFFECT: "Là một [character_interaction|E], nhận một $POD_splat_wraith$ hay $POD_splat_mortal$ đã bị trói buộc làm đệ tử (con cái theo nghĩa gameplay).\n#flavor Bậc thầy Ma Nghệ phá vỡ nền đá của Ngàn Địa Ngục, xây dựng một lâu đài xứng đáng với một hoàng tử địa ngục.#!"
 SOUL_ARTS_CRACK_THE_TORTOISE_SHELL_PERK_EFFECT: "Là một [character_interaction|E], khiến mục tiêu của bạn mất toàn bộ [piety|E], và nếu họ là một $POD_splat_kueijin$, khiến họ mất 25 [Glossary('Pháp Môn','podgloss.dharma')] [trait_level_track_xp|E].\n#flavor Kỹ thuật bậc thầy này cho phép người tu luyện Devil Soul rung chuyển chính nền tảng tồn tại của một Người Chết Đói Khát.#!"
 

 SOUL_ARTS_THE_DRAGON_TEAR_REQUIREMENT_EFFECT: "#X [perk|E] này yêu cầu mọi [perks|E] cấp $VALUE|0V$ khác trong Lối Sống Pháp Nghệ Linh Hồn [lifestyle|E]!#! #weak (trừ Địa Ngục Chức Pháp)#!"

 soul_arts_perfect_eye_of_heaven_perk_name: "Mắt Hoàn Hảo Của Thiên Đường"
 SOUL_ARTS_PERFECT_EYE_OF_HEAVEN_PERK_EFFECT: "Có thể trục xuất $POD_splat_wraith_plural$, $POD_splat_fae_plural$ hoặc $POD_splat_demon_plural$ về các cõi [umbra|E] bản địa của họ mà không cần biết tên thật của họ.\n#flavor Người tu luyện nhìn lên mọi cõi của Đại Luân Xa bằng ánh mắt của một vị vua.#!"

 soul_arts_dragon_medicine_perk_name: "Dược Long"
 SOUL_ARTS_DRAGON_MEDICINE_PERK_EFFECT: "Là một [character_interaction|E], chữa lành [EmptyScope.ScriptValue('POD_dragon_medicine_aggravated_heal_value')|V0] [POD_aggravated_damage_with_box|E], [EmptyScope.ScriptValue('POD_dragon_medicine_superficial_heal_value')|V0] [POD_superficial_damage_with_box|E], và mọi [traits|E] sức khỏe tiêu cực.\n#flavor Người tu luyện trở thành một lương y chữa lành vết thương... hoặc một công cụ tra tấn, nếu nàng muốn.#!"

 soul_arts_soul_nursery_perk_name: "Vườn Ươm Linh Hồn"
 SOUL_ARTS_SOUL_NURSERY_PERK_EFFECT: "Là một [character_interaction|E], khiến một $POD_splat_vampire$ đạt được [GetTrait('golconda').GetName(GetNullCharacter)], một $POD_splat_wraith$ giải trừ mọi [Fetters|E], hoặc một $POD_splat_kueijin$ nhận thêm 1 cấp [Glossary('Pháp Môn','podgloss.dharma')] (trừ [GetTrait('dharma10').GetName(GetNullCharacter)]).\n#flavor Kỹ thuật đáng sợ nhất trong thế giới về đêm, điều này cho phép bậc thầy của Long Lệ hái một linh hồn như hái trái chín, đưa nó vào trong chính mình để biến đổi hoặc nuốt chửng.#!"



 soul_arts_flowing_canal_of_hell_perk_name: "Kênh Chảy Của Địa Ngục"
 SOUL_ARTS_FLOWING_CANAL_OF_HELL_PERK_EFFECT: "Là một [character_interaction|E], nhận [GetModifier('soul_arts_flowing_canal_of_hell_modifier').GetNameWithTooltip] với chi phí @stress_icon!100 [static_stress|E].\n#flavor Không Người Chết Đói Khát nào tồn tại lâu mà không trải qua những mặt trái của Suffering, và tất cả đều từng mong có thể kiểm soát những cơn bùng phát của sức mạnh ma quỷ. Kỹ thuật này không hoàn toàn ngăn chặn hỗn loạn và tàn phá- dù thế nào, năng lượng của địa ngục vẫn phải trào ra. Tuy nhiên, một Người Chết Đói Khát khôn ngoan có thể giảm nhẹ hoặc chuyển hướng dòng chảy đó theo những cách hữu ích.#!"

 soul_arts_wax_seal_of_the_demon_king_perk_name: "Dấu Sáp Của Vua Quỷ"
 SOUL_ARTS_WAX_SEAL_OF_THE_DEMON_KING_PERK_EFFECT: "Mở khóa một số [men_at_arms|E] thuộc loài quỷ.\n#flavor Trợ giúp chất lượng khó mà tìm được, đặc biệt với những Người Chết Đói Khát không có đặc quyền thời gian để nuôi dạy con cái Dhampyr. Vì vậy, kỹ thuật này rất được ưa chuộng: Kẻ dệt địa ngục có thể gọi một con quỷ và có được sự trung thành hoàn toàn của nó. Ngay cả khi con quỷ sau đó nhập vào một người và trở thành Half-Devil, sự trung thành đó vẫn áp dụng. Tuy nhiên, nếu Suffering của Người Chết Đói Khát có lúc nào tụt xuống dưới một ngưỡng nhất định, họ sẽ phải dựa vào những biện pháp khác để giữ con quỷ tiếp tục phục vụ, và nó không thể bị trục xuất về địa ngục nữa.#!"

 soul_arts_dark_cultivation_perk_name: "Tu Luyện Hắc Ám"
 soul_arts_infernal_road_perk_name: "Con Đường Địa Ngục"
 SOUL_ARTS_DARK_CULTIVATION_PERK_EFFECT: "#flavor Sử dụng Pháp Nghệ Linh Hồn thông thường đòi hỏi sự kiên nhẫn và tính toán trước: Các bậc thầy nói rằng không thể tu luyện nhiều hơn một linh hồn cùng lúc, và ai cũng biết chỉ những người tu luyện tài năng nhất mới có thể nhanh chóng chuyển đổi giữa bốn linh hồn mà không bị kiệt sức. Kỹ thuật này, bằng cách mô phỏng sự tu luyện qua Suffering, có thể cho phép một kẻ dệt địa ngục phá vỡ những quy tắc đó một cách dễ dàng đáng kinh ngạc.#!"
 SOUL_ARTS_INFERNAL_ROAD_PERK_EFFECT: "Là một [character_interaction|E], tiêu @stress_icon!100 [static_stress|E] để dịch chuyển quân đội của bạn đến vị trí của mục tiêu, hoặc dịch chuyển đến điểm đến kế tiếp khi đang di chuyển.\n#flavor Với kỹ thuật này, kẻ dệt địa ngục dùng những con đường cổ xưa của địa ngục để đi bất cứ đâu trên thế giới, xoắn qua khoảng cách và thời gian trên một chiến xa rực lửa và đến nơi chỉ trong vài giây. Điểm bất lợi là thời gian bị bỏ qua ở thế giới trần tục vẫn trôi qua bình thường ở địa ngục, khiến Người Chết Đói Khát không thể rời chiến xa cho đến khi hành trình hoàn tất. Tùy vào việc một đội ngựa quỷ mất bao lâu để vượt qua khoảng cách, kẻ dệt địa ngục có thể cần chuẩn bị sẵn vài món hối lộ cho các quan chức địa ngục, cũng như một số 'bữa ăn du hành' chuẩn bị trước.#!"

 soul_arts_breaking_the_dragons_neck_perk_name: "Bẻ Gãy Cổ Rồng"
 SOUL_ARTS_BREAKING_THE_DRAGONS_NECK_PERK_EFFECT: "Là một [character_interaction|E], làm bại hoại một Tổ Rồng hiện có, đảm bảo chỉ bạn hoặc các [akuma|E] khác có thể sử dụng nó.\n#flavor Chỉ có một lý do, ngoài điên loạn hay ám ảnh tâm linh, để làm bại hoại một Tổ Rồng và biến nó thành một mảnh địa ngục nhỏ trên trần gian: vì bạn muốn có nó chỉ cho riêng mình. Những lời đồn về một 'tập sách bổ sung' đã mất của Iron Book, mô tả một phiên bản của kỹ thuật này ở quy mô lớn hơn nhiều, đã dấy lên mạnh mẽ hơn từ khi Wicked City được hé lộ.#!"
