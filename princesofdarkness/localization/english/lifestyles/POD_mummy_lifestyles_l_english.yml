 COMMAND_SIMPLE_IMPLEMENT_PERK_EFFECT: "#flavor Bằng cách khắc các chữ tượng hình đơn giản lên một vật đơn giản, Xác Ướp giành được quyền kiểm soát bản chất linh hồn của nó.#!"
 SIMPLE_INERTION_PERK_EFFECT: "#flavor Xác Ướp có thể xóa bỏ bất kỳ hiệu ứng cấp một nào trên một mục tiêu vật chất vô tri.#!"
 SIMPLE_CREATURE_PERK_EFFECT: "#flavor Xác Ướp tạo ra một hình nhân nhỏ mô phỏng động vật (ví dụ chuột hoặc cóc) hoạt động như một tôi bộc.#!"
 SIMPLE_SERVITOR_PERK_EFFECT: "Như một [character_interaction|E], cho hoặc [modifier|E] tặng một lượng nhỏ tài nguyên đã chọn[gold_i][prestige_i][piety_i][dynasty_prestige_i] với giá #N 2#! [stress|E] mỗi tháng cho chính bạn.\n#flavor Xác Ướp tạo ra một tôi bộc nhỏ có thể được giao các nhiệm vụ đơn giản.#!"
 SIMPLE_WREST_PERK_EFFECT: "#flavor Xác Ướp có thể thử giành quyền kiểm soát pháp thuật một kết cấu ở cấp một.#!"
 COMMAND_LESSER_IMPLEMENT_PERK_EFFECT: "#flavor Bằng cách khắc các chữ tượng hình đơn giản lên một mục tiêu có thể di chuyển được, Xác Ướp có thể giành quyền kiểm soát và điều khiển nó từ xa.#!"
 FALSE_DOOR_PERK_EFFECT: "#flavor Xác Ướp có thể tạo ra một lối cửa trên tường, bằng cách tiến hành một nghi lễ hoặc dùng Sekhem của mình để ép tường biến thành cửa.#!"
 LESSER_INERTION_PERK_EFFECT: "#flavor Xác Ướp có thể xóa bỏ bất kỳ hiệu ứng cấp hai nào trên một mục tiêu vật chất vô tri.#!"
 LESSER_CHATTEL_PERK_EFFECT: "Như một [character_interaction|E], sao chép một [artifact|E] #COMMONBROWN Thường#! không độc nhất.\n#flavor Xác ướp có thể chế tác một bản sao thu nhỏ của một vật đơn giản (như thanh kiếm hay thuyền nhỏ) có thể biến thành vật kích thước đầy đủ khi kích hoạt.#!"
 LESSER_CREATURE_PERK_EFFECT: "#flavor Xác Ướp tạo ra một hình nhân nhỏ mô phỏng động vật (như mèo hoặc rắn hổ mang) hoạt động như một tôi bộc.#!"
 LESSER_WREST_PERK_EFFECT: "#flavor Xác Ướp có thể thử giành quyền kiểm soát pháp thuật một kết cấu ở cấp hai.#!"
