 RENEWAL_OF_THE_HORUS_PERK_EFFECT: "Thời gian hiệu lực dược tễ: #P +2#!\n#flavor Các Công Thức Giả Kim kéo dài lâu hơn trước.#!"
 WATER_OF_LIFE_PERK_EFFECT: "Cải tiến chuỗi thiên hướng [GetPerk('simple_tonic_perk').GetName(GetPlayer)] bằng cách #P giảm#! chi phí của nó.\n#flavor Xác Ướp có thể dùng Sekhem của mình để truyền vào bất kỳ loại nước tinh khiết nào khả năng trị thương nhỏ.#!"
