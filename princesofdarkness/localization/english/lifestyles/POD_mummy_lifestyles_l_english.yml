 THE_CRAWLING_EYE_PERK_EFFECT: "Cải thiện [GetPerk('guard_perk').GetName(GetPlayer)] bằng cách tăng lượng tài nguyên nhận được.\n#flavor Xác Ướp có thể tạo ra một hình nhân côn trùng nhỏ và dùng nó làm gián điệp.#!"
 MAJOR_RESTORATION_PERK_EFFECT: "$unlock_forging_node$ Dùng 3 mảnh vật phẩm #COMMONBROWN Thường#! hoặc #color_dark_green Tinh xảo#! để thêm 1 hoặc 2 hiệu ứng dựa trên loại [artifact|E].\n#flavor Xác Ướp có thể tái tạo một vật thể nhỏ đã bị phá hủy từ hiện diện linh hồn của nó trong [UmbraGlossary('shadowlands')].#!"
 VIZIERS_BEAST_PERK_EFFECT: "#flavor Các sinh vật được tạo ra qua Hekau Hình Nhân đến cấp ba có thể tự duy trì bằng thức ăn thông thường, thay vì Sekhem.#!"
 SANCTIFY_CHATTEL_PERK_EFFECT: "Cho phép tặng [gold|E] cho $POD_splat_wraith_plural$.\nCải thiện [GetPerk('princely_reflection_perk').GetName(GetPlayer)] bằng cách cho phép bạn tặng [artifacts|E] #ILLUSTRIOUSPURPLE Lừng lẫy#! cho $POD_splat_wraith_plural$.\n#flavor Xác Ướp có thể phù chú vật phẩm để sử dụng chúng khi hắn du hành qua [UmbraGlossaryLocalized('shadowlands','Âm Phủ')].#!"
 SCEPTER_OF_THE_VIZIER_PERK_EFFECT: "#flavor Xác Ướp tạo thành một quyền trượng cho phép người khác điều khiển các hình nhân của hắn đến cấp một.#!"
 VIZIERS_WREST_PERK_EFFECT: "#flavor Xác Ướp có thể thử giành quyền kiểm soát pháp thuật một kết cấu ở cấp sáu.#!"
 GREATER_RESTORATION_PERK_EFFECT: "$unlock_forging_node$ Dùng 3 mảnh vật phẩm #FAMEDBLUE Danh Tiếng#! để thêm 3 hiệu ứng dựa trên loại [artifact|E].\n#flavor Xác Ướp có thể tái tạo một vật thể phức tạp đã bị phá hủy từ hiện diện linh hồn của nó trong [UmbraGlossary('shadowlands')].#!"
 SPIRIT_SCEPTER_PERK_EFFECT: "#flavor Xác Ướp tạo ra một sakhmu, một quyền trượng của uy quyền, có thể gây hại cho các sinh vật xuyên qua Màn Che.#!"
 KINGLY_BEAST_PERK_EFFECT: "#flavor Các sinh vật được tạo ra qua Hekau Hình Nhân đến cấp bốn có thể tự duy trì bằng thức ăn thông thường, thay vì Sekhem.#!"
 GREATER_SCEPTER_OF_THE_VIZIER_PERK_EFFECT: "#flavor Xác Ướp tạo thành một quyền trượng cho phép người khác điều khiển các hình nhân của hắn đến cấp ba.#!"
 STALKING_HOUND_OF_TYPHON_PERK_EFFECT: "Cải thiện [GetPerk('the_crawling_eye_perk').GetName(GetPlayer)] bằng cách tăng lượng tài nguyên nhận được.\n#flavor Xác ướp tạo ra một tượng nhỏ hình dạng thô ráp giống người với khuôn mặt thú tính và những móng vuốt mạnh mẽ.#!"
 KINGLY_WREST_PERK_EFFECT: "#flavor Xác Ướp có thể thử giành quyền kiểm soát pháp thuật một kết cấu ở cấp bảy.#!"
 EFFIGY_OF_SIN_PERK_EFFECT: "#flavor Bằng cách tự hiến thân và tự nguyện nhận lấy tội lỗi của người khác, Xác Ướp có thể xá tội những tội lỗi này trước Các Vị Phán Quan của Ma'at.#!"
 PRINCELY_RESTORATION_PERK_EFFECT: "$unlock_forging_node$ Dùng 3 mảnh vật phẩm #ILLUSTRIOUSPURPLE Lừng lẫy#! để thêm 4 hiệu ứng dựa trên loại [artifact|E].\n#flavor Xác Ướp có thể tái tạo một vật thể phức tạp lớn đã bị phá hủy từ hiện diện linh hồn của nó trong [UmbraGlossary('shadowlands')].#!"
 DIVINE_BEAST_PERK_EFFECT: "#flavor Các sinh vật được tạo ra qua Hekau Hình Nhân đến cấp năm có thể tự duy trì bằng thức ăn thông thường, thay vì Sekhem.#!"
 PRINCELY_SCEPTER_OF_THE_VIZIER_PERK_EFFECT: "#flavor Xác Ướp tạo thành một quyền trượng cho phép người khác điều khiển các hình nhân của hắn đến cấp năm.#!"
 DIVINE_WREST_PERK_EFFECT: "#flavor Xác Ướp có thể thử giành quyền kiểm soát pháp thuật một kết cấu ở cấp tám.#!"

