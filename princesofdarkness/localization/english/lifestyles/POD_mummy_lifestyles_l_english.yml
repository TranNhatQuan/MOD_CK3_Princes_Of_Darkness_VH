 hekau_alchemy_focus: "Chuyên Tâm Giả Kim"
 hekau_alchemy_focus_modifier: "[GetFocus('hekau_alchemy_focus').GetName]"
 hekau_alchemy_focus_desc: "Cái ở trên giống như cái ở dưới, và cái ở dưới giống như cái ở trên, để hoàn thành những điều kỳ diệu của nhất thể."
 hekau_alchemy_focus_effect_desc: "Chuyên tâm vào Giả Kim mang lại:"
 hekau_amulets_focus: "Chuyên Tâm Bùa Hộ Mệnh"
 hekau_amulets_focus_modifier: "[GetFocus('hekau_amulets_focus').GetName]"
 hekau_amulets_focus_desc: "Bùa Hộ Mệnh, còn được gọi là Meket trong tiếng Ai Cập, là những vật phẩm tập trung sức mạnh huyền bí, thường dùng để bảo vệ trước tà ác, bệnh tật hay tà thuật."
 hekau_amulets_focus_effect_desc: "Chuyên tâm vào Bùa Hộ Mệnh mang lại:"
 hekau_celestial_focus: "Chuyên Tâm Thiên Văn"
 hekau_celestial_focus_modifier: "[GetFocus('hekau_celestial_focus').GetName]"
 hekau_celestial_focus_desc: "Hekau Thiên Văn là nghệ thuật huyền thuật Ai Cập cổ đại tập trung vào số mệnh, thời tiết và chiêm tinh."
 hekau_celestial_focus_effect_desc: "Chuyên tâm vào Thiên Văn mang lại:"
 hekau_effigy_focus: "Chuyên Tâm Hình Tượng"
 hekau_effigy_focus_modifier: "[GetFocus('hekau_effigy_focus').GetName]"
 hekau_effigy_focus_desc: "Hình Tượng là nghệ thuật Hekau về những liên kết biểu tượng, thường được thể hiện qua các hình tượng nhỏ gọi là Ushabti."
 hekau_effigy_focus_effect_desc: "Chuyên tâm vào Hình Tượng mang lại:"
 hekau_necromancy_focus: "Chuyên Tâm Triệu Hồn"
 hekau_necromancy_focus_modifier: "[GetFocus('hekau_necromancy_focus').GetName]"
 hekau_necromancy_focus_desc: "Triệu Hồn là nghệ thuật Hekau định hình [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] và điều khiển những linh hồn cư ngụ tại đó."
 hekau_necromancy_focus_effect_desc: "Chuyên tâm vào Triệu Hồn mang lại:"
 hekau_nomenclature_focus: "Chuyên Tâm Xưng Danh"
 hekau_nomenclature_focus_modifier: "[GetFocus('hekau_nomenclature_focus').GetName]"
 hekau_nomenclature_focus_desc: "Xưng Danh là nghệ thuật Hekau sử dụng [Glossary('Chân Danh','podgloss.truename')], gọi là ren trong tiếng Ai Cập, cho các mục đích huyền bí."
 hekau_nomenclature_focus_effect_desc: "Chuyên tâm vào Xưng Danh mang lại:"
 tan_feng_focus: "Chuyên Tâm Phong Đan"
 tan_feng_focus_modifier: "[GetFocus('tan_feng_focus').GetName]"
 tan_feng_focus_desc: "Ban tặng quyền năng chế ngự Dương cho những ai đón nhận và thuận theo nó."
 tan_feng_focus_effect_desc: "Chuyên tâm vào Phong Đan mang lại:"
 tan_lung_focus: "Chuyên Tâm Long Đan"
 tan_lung_focus_modifier: "[GetFocus('tan_lung_focus').GetName]"
 tan_lung_focus_desc: "Triệu gọi những khía cạnh của Âm trong muôn hình vạn trạng."
 tan_lung_focus_effect_desc: "Chuyên tâm vào Long Đan mang lại:"

