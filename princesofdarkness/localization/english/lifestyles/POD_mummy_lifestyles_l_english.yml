 ASHEN_SHROUD_PERK_EFFECT: "#flavor Bằng cách vẽ lên mặt mình, Xác Ướp có thể hiện thân như một sinh vật bất tử để khiến người trần khiếp sợ.#!"
 EYE_OF_THE_HORIZON_PERK_EFFECT: "#flavor Kết nối bất kỳ hình ảnh nào của một con mắt với chính giác quan của người thợ thủ công, cho phép Xác Ướp theo dõi mục tiêu qua con mắt đó.#!"
 SIMPLE_WARD_PERK_EFFECT: "$unlock_forging_node$ [GetModifier('simple_ward_modifier').GetNameWithTooltip]\n#flavor Xác Ướp tạo ra một lá bùa hộ mệnh đơn giản được thiết kế để trấn áp những mối đe dọa cụ thể (như việc sử dụng Hekau Xưng Danh chống lại nó, các đợt tấn công nhằm vào tim, v.v.).#!"
 WARDING_SIGN_PERK_EFFECT: "#flavor Xác Ướp thực hiện những cử chỉ đơn giản để trấn áp vận rủi.#!"
 WOOD_WARD_PERK_EFFECT: "#flavor Xác Ướp không thể bị gây hại bởi các vật thể bằng gỗ (như cọc gỗ).#!"
 AMULET_OF_CLOUD_WALKING_PERK_EFFECT: "#flavor Xác Ướp có thể đi trên không khí lên đến tầm mây.#!"
 LESSER_TALISMAN_PERK_EFFECT: "$unlock_forging_node$ [GetModifier('lesser_talisman_diplomacy_modifier').GetNameWithTooltip]\n#flavor Xác Ướp tạo ra một Linh Phù giúp tăng cường một Chỉ Số cụ thể.#!"
 LESSER_WARD_PERK_EFFECT: "Cải tiến [GetPerk('simple_ward_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('simple_ward_modifier').GetNameWithTooltip] bằng [GetModifier('lesser_ward_modifier').GetNameWithTooltip]\n#flavor Xác Ướp tạo ra một lá bùa hộ mệnh đơn giản, có khả năng bảo vệ tốt hơn, được thiết kế để trấn áp những mối đe dọa cụ thể.#!"
 PRAYER_OF_THE_AKEN_PERK_EFFECT: "#flavor Xác ướp gọi một trong các Aken, những trợ thủ của Anubis, để giúp dẫn đường qua [UmbraGlossaryLocalized('shadowlands','Âm Phủ')].#!"
 SCARAB_OF_LIFE_PERK_EFFECT: "#flavor Xác Ướp tạo hình một con bọ hung tí hon giúp rút ngắn thời gian cần thiết để phục sinh.#!"
 METAL_WARD_PERK_EFFECT: "#flavor Xác Ướp không thể bị gây hại bởi các vật thể bằng kim loại.#!"
 MAJOR_WARD_PERK_EFFECT: "Cải tiến [GetPerk('lesser_ward_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('lesser_ward_modifier').GetNameWithTooltip] bằng [GetModifier('major_ward_modifier').GetNameWithTooltip]\n#flavor Xác Ướp tạo ra một lá bùa hộ mệnh có khả năng bảo vệ tốt hơn, được thiết kế để trấn áp những mối đe dọa cụ thể.#!"
 SIGN_OF_LUCK_PERK_EFFECT: "#flavor Xác Ướp thực hiện một nghi lễ nhỏ để cải thiện vận may của một người.#!"
 VEIL_OF_AMAUNET_PERK_EFFECT: "$unlock_forging_node$ [GetModifier('veil_of_amaunet_modifier').GetNameWithTooltip]\n#flavor Xác Ướp tạo ra một Bùa Hộ Mệnh cho phép hắn trở nên vô hình trước các sinh vật trần tục.#!"
 WRAPPING_OF_IMHOTEP_PERK_EFFECT: "Với vai trò [character_interaction|E], chữa lành thương tích cho mục tiêu của bạn.\n#flavor Xác Ướp phù chú lên băng gạc để chữa thương hiệu quả hơn.#!"
 EBON_BINDING_PERK_EFFECT: "#flavor Xác Ướp phù chú lên các cuộn vải để giam giữ linh hồn vào một thân xác.#!"
 EYE_OF_SAKHMET_PERK_EFFECT: "Với vai trò [character_interaction|E], gây [GetModifier( 'eye_of_sakhmet_modifier' ).GetNameWithTooltip|L] lên mục tiêu của bạn.\n#flavor Xác Ướp khắc biểu tượng của Sakhmet lên một vật thể của mục tiêu, khiến việc chữa thương trở nên khó khăn và kéo dài hơn.#!"
 GEBS_BLESSING_PERK_EFFECT: "#flavor Xác Ướp tạo ra một Bùa Hộ Mệnh dẫn truyền năng lượng để bảo vệ người đeo khỏi những lực tự nhiên mà đất sinh ra.#!"
 GREATER_VEIL_OF_AMAUNET_PERK_EFFECT: "Cải tiến [GetPerk('veil_of_amaunet_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('veil_of_amaunet_modifier').GetNameWithTooltip] bằng [GetModifier('greater_veil_of_amaunet_modifier').GetNameWithTooltip]\n#flavor Xác Ướp tạo ra một Bùa Hộ Mệnh cho phép hắn trở nên vô hình trước người sống.#!"
 GREATER_TALISMAN_PERK_EFFECT: "Cải tiến [GetPerk('lesser_talisman_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('lesser_talisman_diplomacy_modifier').GetNameWithTooltip] bằng [GetModifier('greater_talisman_diplomacy_modifier').GetNameWithTooltip]\n#flavor Xác Ướp tạo ra một Linh Phù giúp tăng cường một Chỉ Số cụ thể.#!"
 GREATER_WARD_PERK_EFFECT: "Cải tiến [GetPerk('major_ward_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('major_ward_modifier').GetNameWithTooltip] bằng [GetModifier('greater_ward_modifier').GetNameWithTooltip]\n#flavor Xác Ướp tạo ra một lá bùa hộ mệnh có khả năng bảo vệ tốt hơn, được thiết kế để trấn áp những mối đe dọa cụ thể.#!"
 BUCKLE_OF_ISIS_PERK_EFFECT: "#flavor Xác Ướp tạo ra một Bùa Hộ Mệnh giúp trấn áp mọi hình thức pháp thuật nhằm vào hắn.#!"
 PRINCELY_TALISMAN_PERK_EFFECT: "Cải tiến [GetPerk('greater_talisman_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('greater_talisman_diplomacy_modifier').GetNameWithTooltip] bằng [GetModifier('princely_talisman_diplomacy_modifier').GetNameWithTooltip]\n#flavor Xác Ướp tạo ra một Linh Phù giúp tăng cường một Chỉ Số cụ thể.#!"
 PRINCELY_WARD_PERK_EFFECT: "Cải tiến [GetPerk('greater_ward_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('greater_ward_modifier').GetNameWithTooltip] bằng [GetModifier('princely_ward_modifier').GetNameWithTooltip]\n#flavor Xác Ướp tạo ra một lá bùa hộ mệnh còn có khả năng bảo vệ tốt hơn nữa, được thiết kế để trấn áp những mối đe dọa cụ thể.#!"
 SCARAB_OF_DEATH_PERK_EFFECT: "#flavor Xác Ướp tạo ra một bùa hộ mệnh nhỏ hình bọ hung, bảo vệ ba của người đeo trong những lần lưu lại [UmbraGlossaryLocalized('shadowlands','Âm Phủ')].#!"
 WARD_OF_PERMANENCE_PERK_EFFECT: "#flavor Xác Ướp làm cho phù chú trên một Bùa Hộ Mệnh trở nên bền vững hơn trước thời gian.#!"
 WRAPPINGS_OF_OSIRIS_PERK_EFFECT: "Cải tiến [GetPerk('wrapping_of_imhotep_perk').GetName(GetPlayer)] bằng cách cho phép nó chữa [GetTrait('wounded_3').GetName(GetPlayer)] và [GetTrait('disfigured').GetName(GetPlayer)].\n#flavor Xác Ướp tạo ra loại băng gạc trị thương mạnh hơn.#!"
 KINGLY_WARD_PERK_EFFECT: "Cải tiến [GetPerk('princely_ward_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('princely_ward_modifier').GetNameWithTooltip] bằng [GetModifier('kingly_ward_modifier').GetNameWithTooltip]\n#flavor Xác Ướp tạo ra một lá bùa hộ mệnh uy lực được thiết kế để trấn áp những mối đe dọa cụ thể.#!"
 LESSER_SEAL_OF_MAAT_PERK_EFFECT: "#flavor Xác Ướp có thể sao chép một trong các cấp độ một và hai của Hekau Bùa Hộ Mệnh dưới dạng hình xăm trên da của chính mình.#!"
 NYARASHAHIMS_BANISHING_SIGN_PERK_EFFECT: "Có thể [POD_banish|E] $POD_splat_wraith_plural$, $POD_splat_fae_plural$ hoặc $POD_splat_demon_plural$ về cõi [umbra|E] nguyên bản của chúng.\n#flavor Được sáng tạo bởi pháp sư Shemsu-Heru Nyarashahim, phép thuật này bao gồm một cử chỉ phức tạp có thể trục xuất các thực thể ngoại giới trở về cõi giới nguyên quán của chúng.#!"
 NYARASHAHIMS_SCREAMING_SCARAB_PERK_EFFECT: "#flavor Xác Ướp tạo ra một bùa hộ mệnh hình bọ hung có thể phát ra tiếng rú điếc tai khi được sử dụng.#!"
 PIERCING_EYE_OF_THOTH_PERK_EFFECT: "Trở nên miễn nhiễm với các năng lực tâm linh thù địch.\n#flavor Xác Ướp tạo ra một bùa hộ mệnh cho phép nhìn thấu qua ảo ảnh.#!"
 SERQETS_STING_PERK_EFFECT: "Mở khóa các thế đánh mới trong [single_combat_duel|E].\n#flavor Nếu xác ướp mang theo một lượng nhỏ chất độc, hắn có thể tiêm nó vào qua một dấu tay.#!"
 SHATTER_THE_GLYPH_PERK_EFFECT: "#flavor Xác Ướp có thể triệt tiêu bất kỳ Bùa Hộ Mệnh thù địch nào lên đến cấp độ ba.#!"
 TALISMAN_OF_THE_VULTURE_PERK_EFFECT: "$unlock_forging_node$ [GetModifier('talisman_of_the_vulture_diplomacy_modifier').GetNameWithTooltip]\n#flavor Xác Ướp tạo ra một linh phù nhỏ giúp tăng cường hai Chỉ Số cụ thể.#!"
 VIZIERS_TALISMAN_PERK_EFFECT: "Cải tiến [GetPerk('princely_talisman_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('princely_talisman_diplomacy_modifier').GetNameWithTooltip] bằng [GetModifier('viziers_talisman_diplomacy_modifier').GetNameWithTooltip]\n#flavor Xác Ướp tạo ra một linh phù giúp tăng cường một chỉ số.#!"
 WHISPER_BETWEEN_TWO_HEARTS_PERK_EFFECT: "$unlock_forging_node$ Gấp đôi [durability|E] của [artifact|E] được chế tác\n#flavor Xác Ướp tạo ra một bùa hộ mệnh nhỏ có thể chia thành hai nửa.#!"
 RAMOSES_ARMOR_PERK_EFFECT: "Cải tiến [GetPerk('kingly_ward_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('kingly_ward_modifier').GetNameWithTooltip] bằng [GetModifier('ramoses_armor_modifier').GetNameWithTooltip]\n#flavor Được đặt theo tên nhà quán quân trước đây của Horus, Xác Ướp tạo ra một bùa hộ mệnh có tác dụng như bùa trấn ải, nhưng có thể bảo vệ trước ba mối đe dọa cụ thể.#!"
 CONDUIT_OF_SHADOW_PERK_EFFECT: "#flavor Xác ướp có thể tạo ra một nơi chứa cho một thực thể linh hồn tự nguyện nhập vào.#!"
 KINGLY_TALISMAN_PERK_EFFECT: "Cải tiến [GetPerk('viziers_talisman_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('viziers_talisman_diplomacy_modifier').GetNameWithTooltip] bằng [GetModifier('kingly_talisman_diplomacy_modifier').GetNameWithTooltip]\n#flavor Xác Ướp tạo ra một Linh Phù giúp tăng cường một Chỉ Số cụ thể.#!"
 SEAL_OF_MAAT_PERK_EFFECT: "#flavor Xác Ướp có thể sao chép một trong các cấp độ ba của Hekau Bùa Hộ Mệnh dưới dạng hình xăm trên da của chính mình.#!"
 SHATTER_THE_GREATER_GLYPH_PERK_EFFECT: "#flavor Xác Ướp có thể triệt tiêu bất kỳ Bùa Hộ Mệnh thù địch nào lên đến cấp độ bốn.#!"
 SHIELD_OF_THE_PHARAOHS_PERK_EFFECT: "Cải tiến [GetPerk('kingly_ward_perk').GetName(GetPlayer)] bằng cách thêm [GetModifier('shield_of_the_pharaohs_modifier').GetNameWithTooltip]\n#flavor Xác Ướp tạo ra một bùa hộ mệnh bảo vệ trước các loại vũ khí phóng xa.#!"
 VAULT_OF_INNER_STRENGTH_PERK_EFFECT: "$unlock_forging_node$ [GetModifier('vault_of_inner_strength_modifier').GetNameWithTooltip]\n#flavor Xác Ướp tạo ra một bùa hộ mệnh có thể tích trữ điểm Ý Chí để dùng sau này.#!"
 DIVINE_TALISMAN_PERK_EFFECT: "Cải tiến [GetPerk('kingly_talisman_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('kingly_talisman_diplomacy_modifier').GetNameWithTooltip] bằng [GetModifier('divine_talisman_diplomacy_modifier').GetNameWithTooltip]\n#flavor Xác Ướp tạo ra một Linh Phù giúp tăng cường một Chỉ Số cụ thể.#!"
 GREATER_SEAL_OF_MAAT_PERK_EFFECT: "#flavor Xác Ướp có thể sao chép một trong các cấp độ bốn của Hekau Bùa Hộ Mệnh dưới dạng hình xăm trên da của chính mình.#!"
 HARDENING_SIGN_OF_GEB_PERK_EFFECT: "Cho phép bạn tiêu hao ý chí thay vì chịu thương tích.\n#flavor Xác Ướp có thể khiến thân xác hắn miễn nhiễm với sát thương va đập và tăng thêm khả năng chống lại pháp thuật thù địch.#!"
 HEART_OF_MAAT_PERK_EFFECT: "Cải tiến [GetPerk('vault_of_inner_strength_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('vault_of_inner_strength_modifier').GetNameWithTooltip] bằng [GetModifier('heart_of_maat_modifier').GetNameWithTooltip]\n#flavor Xác Ướp có thể tạo ra một bùa hộ mệnh giúp tăng thêm tỷ lệ Cân Bằng của người đeo.#!"
 INSCRIBE_THE_FLESH_PERK_EFFECT: "#flavor Xác Ướp phủ lên da mình các chữ tượng hình dành riêng cho Ma'at, khiến các sinh vật thấm nhuần sự Tha Hóa phải khiếp sợ.#!"
 SHATTER_THE_PRINCELY_GLYPH_PERK_EFFECT: "#flavor Xác Ướp có thể triệt tiêu bất kỳ Bùa Hộ Mệnh thù địch nào lên đến cấp độ năm.#!"
 TALISMAN_OF_THE_ASP_PERK_EFFECT: "Cải tiến [GetPerk('talisman_of_the_vulture_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('talisman_of_the_vulture_diplomacy_modifier').GetNameWithTooltip] bằng [GetModifier('talisman_of_the_asp_diplomacy_modifier').GetNameWithTooltip]\n#flavor Xác Ướp tạo ra một linh phù nhỏ giúp tăng cường ba Chỉ Số cụ thể.#!"
 VORACIOUS_SCARAB_OF_NYARASHAHIM_PERK_EFFECT: "Mở khóa các thế đánh mới trong [single_combat_duel|E].\n#flavor Xác Ướp tạo ra một con bọ hung nhỏ có thể được đặt lên một thân xác đã mất khả năng chống cự.#!"

