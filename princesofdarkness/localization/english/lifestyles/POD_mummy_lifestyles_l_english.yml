 KINGLY_ELIXIR_PERK_EFFECT: "Cải tiến [GetPerk('princely_elixir_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('princely_elixir_diplomacy_modifier').GetNameWithTooltip] bằng [GetModifier('kingly_elixir_diplomacy_modifier').GetNameWithTooltip].\n#flavor Xác Ướp tạo ra một linh dược mạnh mẽ hơn hẳn, tăng cường hiệu ứng lên một thuộc tính duy nhất.#!"
 KINGLY_TONIC_PERK_EFFECT: "Cải tiến [GetPerk('princely_tonic_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('princely_tonic_modifier').GetNameWithTooltip] bằng [GetModifier('kingly_tonic_modifier').GetNameWithTooltip].\n#flavor Xác Ướp tạo ra một loại bổ dược vô cùng tinh luyện với khả năng trị thương lớn hơn.#!"
 KINGLY_QUIDDITY_PERK_EFFECT: "#flavor Hiệu ứng huyền bí áp lên một vật thể trở nên mạnh mẽ hơn.#!"
 KINGLY_QUIDDITY_EFFECT: "[GetPerk('kingly_quiddity_perk').GetName(GetPlayer)]"
