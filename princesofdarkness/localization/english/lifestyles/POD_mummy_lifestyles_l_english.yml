 STILL_THE_FLUTTERING_WING_PERK_EFFECT: "#flavor Mục tiêu bị ảnh hưởng bởi Ngưng Cánh Chim Vẫy chịu tê liệt trong thời gian ngắn.#!"
 THE_WAY_OF_THE_CALM_SOUL_PERK_EFFECT: "#flavor Đạo Của Tâm Hồn Tĩnh Lặng cho phép một Wu T'ian làm dịu các trạng thái hoảng loạn hoặc lo âu (như Frenzy) ở một cá nhân.#!"
 IRON_BODY_MEDITATION_PERK_EFFECT: "#flavor Thiết Thân Thiền Định cho phép một Wu T'ian dẫn năng lượng âm qua da thịt mình, củng cố thân thể chống lại thương tật bằng cách thiền định trong một giờ.#!"
 HUNDRED_SHADOW_CLOUD_PERK_EFFECT: "#flavor Với thuật này, một Wu T'ian có thể khiến một đám mây bóng tối linh hồn dày đặc cuộn lên từ bóng của mình như sương mù đen.#!"
 LUNGTAN_UNSEEN_PASSAGE_PERK_EFFECT: "#flavor Bằng cách khởi động thuật này, Xian Lung có thể ảnh hưởng đến chỉ số Arcane của mình để giữ ẩn danh và trở thành một người gần như vô diện.#!"
 LESSER_SPIRIT_PROJECTION_PERK_EFFECT: "#flavor Với thuật này, Wu T'ian có thể tiến vào [UmbraGlossaryLocalized('shadowlands','Âm Phủ')].#!"
 ICE_HAND_STRIKE_PERK_EFFECT: "#flavor Bao trùm hai tay trong một luồng sáng xanh của âm khí đóng băng, một Wu T'ian dưới ảnh hưởng của thuật này để lại cái lạnh tê cứng sau mỗi đòn đánh.#!"
 NO_MIND_KATA_PERK_EFFECT: "#flavor Bằng cách làm sạch tâm trí và để sự thanh thản của Đạo tràn qua mình, một Wu T'ian với thuật này có thể vận dụng ý chí để thực hiện những kỳ tích siêu nhân thực sự trong một lĩnh vực đã chọn trước.#!"
 EBON_BONDS_PERK_EFFECT: "$POD_can_weaken_fetter_trigger_loca$\n$POD_can_bind_wraith_trigger_loca$\n$POD_can_command_wraith_trigger_loca$\n#flavor Với một lời nói và một cử chỉ, một bất tử có thể triệu ra những dải ruy băng đen huyền bí từ chính bóng của mục tiêu để trói họ trong những dây trói mềm như lụa và chắc như thép.#!"
 KNOW_THE_WANDERING_SOUL_PERK_EFFECT: "#flavor Với Nghi Lễ này, Xian Lung có thể thấu hiểu được cả những người phàm, động vật và linh hồn kỳ lạ nhất.#!"
 SHIELD_OF_FORTUNE_PERK_EFFECT: "#flavor Xian Lung có thể tự bao bọc mình trong joss, gây ra vận rủi cho những ai muốn hại mình.#!"
 PROJECTION_OF_INWARD_BEING_PERK_EFFECT: "#flavor Với thuật này, một Wu T'ian có thể vạch mặt một sinh thể siêu nhiên đang ẩn giấu bằng cách truyền Chi vào bóng của mục tiêu để nó mang hình dạng bản ngã thật của chủ nhân (dạng Crinos đối với Hengeyokai, Mien đối với Hsien, v.v.).#!"
 GHOST_WALKING_METHOD_PERK_EFFECT: "#flavor Khi thi triển thuật này, Xian Lung trở nên không thể bị phát hiện đối với vài giác quan đã chọn.#!"
 BRAMBLES_ON_THE_ROAD_PERK_EFFECT: "Có thể điều khiển Shroud.\n#flavor Bằng cách sử dụng Nghi Lễ này, Xian Lung có thể nâng chỉ số Shroud xung quanh mình.#!"
 PROTECT_AGAINST_THE_DEMON_PERK_EFFECT: "Bạn không còn có thể bị $POD_splat_wraith_plural$ chiếm hữu.\n#flavor Với nghi lễ này, Xian Lung có thể tạo ra những lá bùa chặn ác ma và các tay sai khác của [Glossary('Yama Kings','podgloss.yamaking')] không cho vào một khu vực.#!"
 SCROLL_OF_THE_MINDS_EYE_PERK_EFFECT: "Như một [character_interaction|E], cho mục tiêu của bạn [GetModifier('tan_scroll_of_the_minds_eye_modifier').GetNameWithTooltip] trong 20 năm.\n#flavor Với nghi lễ này, Xian Lung chuẩn bị cho [Glossary('Sixth Age','game_concept_sixth_age_desc')].#!"
 BLUR_THE_MIND_PERK_EFFECT: "#flavor Bằng cách triệu gọi thuật này, Xian Lung có thể khiến nạn nhân quên đi những sự kiện đã xảy ra gần đây xung quanh họ.#!"
 WHISPERING_STONES_PERK_EFFECT: "#flavor Với Nghi Lễ này, Xian Lung có thể ghi lại ký ức của người chết từ [UmbraGlossary('tempest')] để dịch các văn bản bằng những ngôn ngữ chưa biết đến hoặc đã tuyệt chủng.#!"
 DEATH_TOUCH_PERK_EFFECT: "Như một [character_interaction|E], cho mục tiêu của bạn [GetModifier('tan_death_touch_modifier').GetNameWithTooltip] với chi phí 100 [static_stress|E].\n#flavor Chỉ dành riêng cho những ác ma khủng khiếp nhất, dim mak huyền thoại cho phép các bậc thầy Lung Tan làm rối loạn nghiêm trọng dòng chảy Chi của một mục tiêu duy nhất, gây tàn tật hoặc giết chết chỉ bằng một cái chạm.#!"
 EYE_OF_THE_TEMPEST_PERK_EFFECT: "#flavor Bằng cách thiền định và buông bỏ mọi sợ hãi và nghi ngờ, sự bình thản nội tâm của Xian Lung thậm chí có thể dập tắt bão tố, hoặc tạo ra một 'bong bóng' bảo vệ nếu bão tố trở nên quá dữ dội.#!"
 TREAD_THE_DRAGON_TRACKS_PERK_EFFECT: "Như một [character_interaction|E], cho phép bạn dịch chuyển quân đội của mình đến vị trí của mục tiêu, hoặc dịch chuyển đến điểm đến tiếp theo khi đang di chuyển.\n#flavor Với Nghi Lễ này, Xian Lung có thể hòa hợp Chi nội tại của mình với dòng chảy của một Long Mạch gần đó và di chuyển đến một Ổ Rồng trong tích tắc sau khi thiền định trong một giờ tại một Ổ Rồng hoặc dọc theo một Long Mạch.#!"

