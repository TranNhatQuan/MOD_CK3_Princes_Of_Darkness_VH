 transcendant_living_flame_perk_name: "Ngọn Lửa Sống Siêu Thoát"
 gentle_typhoons_passing_perk_name: "Cuồng Phong Nhẹ Nhàng Đi Qua"

 SEE_THE_LANDS_OF_THE_SPIRIT_PERK_EFFECT: "#flavor Với thuật này, Wu T'ian có thể tiến vào Umbra.#!"
 SENSE_LUCKS_FLOW_PERK_EFFECT: "#flavor Một Wu T'ian với thuật này có thể cảm nhận những biến động của joss, phân biệt được may hay rủi xung quanh con người, địa điểm và sự kiện.#!"
 BODY_MENDING_TECHNIQUE_PERK_EFFECT: "Như một [character_interaction|E], chữa lành mục tiêu của bạn.\n#flavor Thuật Hàn Gắn Thân Thể cho phép một bất tử chữa lành tổn thương do thương tật hoặc bệnh tật bằng phương thức nghi lễ.#!"
 LINGERING_AID_OF_THE_CAREGIVER_PERK_EFFECT: "#flavor Một bất tử với nghi lễ này có thể truyền đủ năng lượng để giữ cho bệnh nhân của mình tiếp tục hồi phục với tốc độ nhanh hơn dù họ đã rời khỏi bên cạnh người đó.#!"
 SWEET_DREAMSS_CARESS_PERK_EFFECT: "Như một [character_interaction|E], khiến mục tiêu của bạn giảm 50 [static_stress|E].\n#flavor Chống lại sự kiệt sức bằng sinh lực nâng đỡ của năng lượng Dương thuần khiết, Vuốt Ve Của Mộng Đẹp cho phép một bất tử xua tan sự mệt mỏi của chính mình hoặc của người khác bằng cách nhẹ nhàng ấn các ngón tay vào những huyệt đạo chính.#!"
 SNAKE_FIST_STRIKE_PERK_EFFECT: "#flavor Để đối phó với khả năng tự phục hồi của ác ma và các sinh thể siêu nhiên khác, một Wu T'ian có thể dùng thuật này để tăng nhanh các đòn đánh của mình một cách huyền bí và biến thân thể họ thành vũ khí chết người#!"
 CALL_THE_SPIRITS_PERK_EFFECT: "Mở khóa [men_at_arms|E] Nguyên Tố và Linh Hồn.\n#flavor Thuật này cho phép một bất tử triệu hồi các linh hồn nguyên tố và thiên nhiên.#!"
 SPIRIT_LANTERN_PERK_EFFECT: "#flavor Chỉ với một cử chỉ, một Wu T'ian sở hữu Đèn Linh Hồn có thể tạo ra một quả cầu lửa ma trong lòng bàn tay, chiếu sáng xung quanh bằng ánh vàng dịu nhẹ khiến ác ma và các sinh thể ô uế khác khiếp sợ.#!"
 LEAPING_TIGER_POUNCE_PERK_EFFECT: "#flavor Nạp năng lượng vào cơ bắp, một Wu T'ian với thuật này có thể nhảy những khoảng cách đáng kinh ngạc.#!"
 DRUNKEN_MONKEY_DANCE_PERK_EFFECT: "#flavor Lắc lư và chao đảo như thể đang say mềm, một Wu T'ian dưới ảnh hưởng của thuật này bằng cách nào đó tránh được đấm đá, đạn bắn và các đòn tấn công khác nhằm vào mình với sự dễ dàng khiến đối thủ bối rối và bực tức.#!"
 STORMWIND_PRANA_PERK_EFFECT: "#flavor Dựa trên nguyên lý vận động thể hiện tinh túy của Dương, Wu T'ian sử dụng nhóm thuật này để tăng vọt tốc độ của mình.#!"
 BIND_THE_DEMONS_SERVANT_PERK_EFFECT: "Như một [character_interaction|E], [POD_banish|E] một $POD_splat_fae$, $POD_splat_demon$ hoặc $POD_splat_wraith$ đang bị [imprisoned|E] về cõi giới nguyên bản của chúng.\n#flavor Thuật này cho phép một bất tử trục xuất hoặc trói buộc các linh hồn và ác ma cấp thấp của Cõi Dương.#!"
 OPENING_THE_THIRD_EYE_PERK_EFFECT: "Như một [character_interaction|E], cho một [GetTrait('mortal').GetName(GetPlayer)] hoặc $POD_splat_hunter$ #P +5#! vào mọi [skills|E] (ngoại trừ [prowess|E] được #P +10#!). Ngoài ra còn khiến họ trở thành một [GetTrait('sorcerer').GetName(GetPlayer)].\n#flavor Với thuật này, một Wu T'ian có thể xuyên qua Màn Che và đánh thức người phàm trước thế giới ẩn giấu của shen.#!"
 THE_CLEARING_OF_THE_WAY_PERK_EFFECT: "Có thể điều khiển Gauntlet.\n#flavor Với thuật này, Wu Feng có thể điều khiển chỉ số Wall xung quanh mình.#!"
 FLAME_HAND_STRIKE_PERK_EFFECT: "#flavor Với hai tay bao trùm trong một luồng Chi rực lửa, một bất tử với thuật này nhấn chìm kẻ địch trong lửa bằng mỗi lần chạm.#!"
 ELEGANT_CRANE_DEFTNESS_PERK_EFFECT: "#flavor Được Chi dương nâng đỡ, Wu T'ian với thuật này trở nên nhẹ nhàng và nhanh nhẹn khác thường, có thể giữ thăng bằng dễ dàng trên những rìa hẹp nhất, chạy qua các mặt bất ổn như nước và cát lún hoặc dùng lá cây để nâng đỡ trọng lượng khi leo trèo.#!"
 MANTLE_OF_DIVINE_AUTHORITY_PERK_EFFECT: "#flavor Kêu gọi thiên mệnh của [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')] và sự quản lý trung thành của Bát Tiên, một Wu T'ian dám xướng lên những lời quyền năng thiêng liêng nằm trong lõi của thuật này sẽ triệu hồi uy quyền và sức mạnh chính đại của Ngai Ngọc.#!"
 WALK_THE_BARRIERS_PERK_EFFECT: "#flavor Bước Qua Rào Chắn cho phép một bất tử chuyển hình thể vật lý của mình vào Cõi Dương.#!"
 PLAGUE_CURING_METHOD_PERK_EFFECT: "Cải thiện [GetPerk('body_mending_technique_perk').GetName(GetPlayer)] bằng cách giảm chi phí xuống ba lần.\n#flavor Với thuật này, Wu T'ian có thể truyền năng lượng Dương vào thân thể của bệnh nhân sau khi chăm sóc họ trong ít nhất 15 phút.#!"
 TEN_PACES_STRIKE_PERK_EFFECT: "#flavor Bỏ qua nhu cầu tiếp xúc vật lý thông thường, một Wu T'ian với thuật này có thể vô hình chiếu lực của một đòn võ thuật đơn lẻ qua một khoảng cách bằng sức mạnh của Chi tập trung.#!"
 GODBODY_OF_THE_CELESTIAL_EMPEROR_PERK_EFFECT: "#flavor Gợi nhớ về sự uy nghi của [Glossary('Wan Xian','game_concept_kuei_jin_desc')] trước khi họ sa ngã, Thần Thể Của Thiên Hoàng bao bọc người thi triển trong một vòng hào quang bạc chiếu sáng con đường trước Wu T'ian, gây ra một trạng thái tâm trí giống Sương Mù lên người phàm và buộc các sinh thể siêu nhiên bị ô nhiễm phải bỏ chạy.#!"
 RESTORATION_OF_YOUTHS_VIGOR_PERK_EFFECT: "Như một [character_interaction|E], cho một [GetTrait('mortal').GetName(GetPlayer)] hoặc $POD_splat_hunter$ [GetModifier('tan_restoration_of_youths_vigor_modifier').GetNameWithTooltip].\n#flavor Các bậc thầy Feng Tan có thể thực hiện phép màu tái sinh của phượng hoàng để đảo ngược tàn phá của thời gian và khôi phục sinh lực tuổi xuân của một người phàm.#!"
 TRANSCENDANT_LIVING_FLAME_PERK_EFFECT: "Như một [character_interaction|E], cho một [GetTrait('mortal').GetName(GetPlayer)] hoặc $POD_splat_hunter$ [GetModifier('extra_life_1_modifier').GetNameWithTooltip], giảm [piety_level|E] của bạn 1 cấp.\n#flavor Với thuật cuối cùng này, Wu T'ian có thể khôi phục sức khỏe hoàn toàn cho bản thân hoặc một đồng minh, nếu tình huống được Thiên Đình xem là đủ nguy cấp.#!"
 GENTLE_TYPHOONS_PASSING_PERK_EFFECT: "#flavor Được triệu hồi trong giao tranh, Cuồng Phong Nhẹ Nhàng Đi Qua biến một bậc thầy Feng Tan thành tâm điểm bình lặng tuyệt đối giữa một cơn lốc xoáy dữ dội của các đòn đấm.#!"

