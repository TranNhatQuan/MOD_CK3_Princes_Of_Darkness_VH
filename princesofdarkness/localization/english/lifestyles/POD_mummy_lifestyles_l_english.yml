 MAJOR_INERTION_PERK_EFFECT: "#flavor Xác Ướp có thể xóa bỏ bất kỳ hiệu ứng cấp ba nào trên một mục tiêu vật chất vô tri.#!"
 COMPLEX_CHATTEL_PERK_EFFECT: "Cải thiện [GetPerk('lesser_chattel_perk').GetName(GetPlayer)] bằng cách cho phép nó sao chép [artifacts|E] #color_dark_green Tinh xảo#! không độc nhất.\n#flavor Xác ướp có thể chế tác bản thu nhỏ của một vật phức tạp hơn (như ô tô hay súng) có thể biến thành vật kích thước đầy đủ khi kích hoạt.#!"
 MAJOR_BOND_OF_FATE_PERK_EFFECT: "Cho phép trang bị [artifacts|E] vật phẩm #color_dark_green Tinh xảo#!.\n#flavor Xác Ướp tạo ra một liên kết cảm ứng giữa một hình nhân của vật thể vô tri không lớn hơn một ngôi nhà cỡ trung và bản gốc tương ứng để tác động lên nó.#!"
 EFFIGY_OVERSEER_PERK_EFFECT: "Cải thiện [GetPerk('simple_servitor_perk').GetName(GetPlayer)] bằng cách tăng lượng tài nguyên nhận được.\n#flavor Xác Ướp tạo ra một hình nhân nhỏ có thể được giao điều phối một số tôi bộc. Giám thị có khả năng hiểu các lệnh phức tạp hơn.#!"
 MAJOR_CREATURE_PERK_EFFECT: "#flavor Xác Ướp tạo ra một hình nhân mô phỏng động vật (như chó hay khỉ) hoạt động như một tôi bộc.#!"
