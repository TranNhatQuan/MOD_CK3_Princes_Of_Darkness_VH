 SIMPLE_WEATHER_MAGIC_PERK_EFFECT: "Với vai trò [character_interaction|E], điều khiển thời tiết trên một [county|E] mà mục tiêu của bạn đang ở.\n#flavor Xác ướp tạo ra một thay đổi nhỏ, không gây hại, trong môi trường xung quanh.#!"
 GRIP_THE_WATER_PERK_EFFECT: "Mở khóa lựa chọn #V Lũ Lụt#! trong [character_interaction|E] [GetPerk('simple_weather_magic_perk').GetName(GetPlayer)].\n#flavor Xác ướp có thể nâng lên hoặc hạ xuống mực nước của một vùng nước.#!"
 BECALM_PERK_EFFECT: "Có thể làm mạnh lên hoặc giảm nhẹ các thiên tai.\nTrở nên miễn nhiễm với mọi [modifiers|E] chiến tranh Celestial.\n#flavor Xác ướp triệt tiêu các hiệu ứng thời tiết bất lợi trong tầm một cánh tay quanh mình.#!"
 WEATHER_SIGHT_PERK_EFFECT: "Có thể dự đoán thiên tai.\n#flavor Xác ướp có thể dự đoán thời tiết với độ chính xác cao.#!"
 HANGING_THE_STARS_PERK_EFFECT: "#flavor Xác ướp có thể trì hoãn hiệu ứng của một hekau đến khi nào cô ấy triệu hồi nó.#!"
 HIDING_THE_STARS_PERK_EFFECT: "#flavor Xác ướp được che giấu khỏi các phép bói toán hoặc định vị.#!"
 LESSER_WEATHER_MAGIC_PERK_EFFECT: "Cải tiến [GetPerk('simple_weather_magic_perk').GetName(GetPlayer)] bằng cách cho phép nó tác động lên toàn bộ một [duchy|E].\n#flavor Giống như Pháp Thuật Thời Tiết Đơn Giản, nhưng xác ướp có thể tạo ra một thay đổi lớn hơn.#!"
 WEATHER_WHISPERS_PERK_EFFECT: "#flavor xác ướp có thể nghe được các cuộc trò chuyện diễn ra ở phía đón gió so với vị trí hiện tại của cô ấy.#!"
 BOOK_OF_THOTH_PERK_EFFECT: "Bạn sẽ nhận được thông báo nếu có ai đó có ý định sát hại bạn bè hoặc gia đình của bạn.\n#flavor Bằng cách lẩm nhẩm một câu chú, xác ướp có thể nhận biết được các bí mật trong khu vực xung quanh mình ngay lập tức.#!"
 SAHU_RA_PERK_EFFECT: "Gây thương tích cho [knights|E] và [commanders|E] của kẻ địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc đối thủ của bạn trong [single_combat_duel_plural|E], nếu họ là $POD_splat_vampire_plural$ (hoặc các [splats|E] khác sợ ánh nắng).\n#flavor Xác ướp toát ra ánh sáng rực rỡ như sức mạnh của mặt trời.#!"
 READ_THE_STARS_PERK_EFFECT: "Với vai trò [character_interaction|E], ban cho mục tiêu của bạn [GetModifier('POD_hekau_read_the_stars_modifier').GetNameWithTooltip] trong 5 năm.\n#flavor Xác ướp có thể điều hòa pháp thuật của mình theo hoàn cảnh, bồi thêm công sức cho một nghi lễ sau đó.#!"
 MAJOR_WEATHER_MAGIC_PERK_EFFECT: "Cải tiến [GetPerk('lesser_weather_magic_perk').GetName(GetPlayer)] bằng cách cho phép nó tác động lên toàn bộ một [kingdom|E].\n#flavor Giống như Pháp Thuật Thời Tiết Đơn Giản, nhưng với hiệu ứng còn mạnh mẽ hơn.#!"
 CALL_THE_STARS_PERK_EFFECT: "Mở khóa lựa chọn #V Mưa Sao Băng#! trong [character_interaction|E] [GetPerk('simple_weather_magic_perk').GetName(GetPlayer)], giảm cấp độ [development|E] đi #N 2#!.\n#flavor Bằng cách khấn cầu Nuit, xác ướp triệu hồi một trận mưa thiên thạch tàn phá.#!"
 DIVINE_FORMS_PERK_EFFECT: "Với vai trò [character_interaction|E], tự ban cho mình một [modifier|E] tăng một [skill|E] tùy chọn lên #P +3#! #weak ([GetModifier('POD_hekau_divine_form_diplomacy_modifier').GetNameWithTooltip])#!.\n#flavor Bằng cách khấn cầu một trong các vị thần, xác ướp có thể tạm thời tăng cường một trong các Chỉ Số của cô ấy.#!"
 GREATER_WEATHER_MAGIC_PERK_EFFECT: "Cải tiến [GetPerk('major_weather_magic_perk').GetName(GetPlayer)] bằng cách cho phép nó tác động lên toàn bộ một [empire|E].\n#flavor Giống như Pháp Thuật Thời Tiết Đơn Giản, nhưng với hiệu ứng còn mạnh mẽ hơn.#!"
 SANDSTORM_PERK_EFFECT: "Mở khóa lựa chọn #V Bão Cát#! trong [character_interaction|E] [GetPerk('simple_weather_magic_perk').GetName(GetPlayer)].\n#flavor Xác ướp triệu hồi một cơn lốc cát tàn phá.#!"
 READ_THE_TREE_OF_LIFE_PERK_EFFECT: "#flavor Xác ướp có thể đọc được số phận của bất kỳ ai, nhìn xuyên vào quá khứ hoặc tương lai của họ.#!"
 WISDOM_OF_ISIS_PERK_EFFECT: "Trở nên miễn nhiễm với Pháp Thuật Thời Tiết.\nCó khả năng chống lại cao đối với mọi hình thức pháp thuật.\n#flavor Bằng cách khấn cầu Isis, xác ướp có thể hóa giải pháp thuật của kẻ địch.#!"
 RAS_AWAKENING_PERK_EFFECT: "Tất cả [children|E] của bạn sẽ nhận được [GetModifier('POD_hekau_ras_awakening_modifier').GetNameWithTooltip].\n#flavor Xác ướp truyền sức mạnh của Ra vào tối đa năm mục tiêu.#!"
 POTENT_WEATHER_MAGIC_PERK_EFFECT: "Cải tiến [GetPerk('lesser_weather_magic_perk').GetName(GetPlayer)] bằng cách cho phép nó tác động lên toàn bộ một lục địa.\n#flavor Cấp độ pháp thuật thời tiết mạnh mẽ nhất hiện có.#!"
 ROUSING_APOPHIS_PERK_EFFECT: "Cải tiến lựa chọn #V Mưa Sao Băng#! từ [GetPerk('call_the_stars_perk').GetName(GetPlayer)] thành #V Tận Thế Sớm#!, giảm [development|E] đi #N 5#!.\n#flavor Xác ướp gây ra một trận động đất.#!"
 PLAGUE_OF_MAAT_PERK_EFFECT: "Với vai trò [character_interaction|E], triệu hồi một [epidemic|E] trần tục tại vị trí hiện tại của mục tiêu.\n#flavor Xác ướp có thể khấn gọi một trong Bảy Ôn Dịch Của Ai Cập.#!"
 DIVINE_GREATNESS_PERK_EFFECT: "Cải tiến [GetPerk('divine_forms_perk').GetName(GetPlayer)] bằng cách tăng [modifier|E] lên #P +6#! thay vì #P +3#! #weak ([GetModifier('POD_hekau_divine_greatness_diplomacy_modifier').GetNameWithTooltip])#!.\n#flavor Giống như Hình Dạng Thần Thánh, nhưng với hiệu ứng mạnh mẽ hơn.#!"
 GEBS_GRASP_PERK_EFFECT: "#flavor Phép thuật này nhằm vào bất kỳ đối tượng nào trong tầm nhìn của người triệu hồi. Làm tăng lực hấp dẫn tác động lên đối tượng đó.#!"
 INUNDATION_OF_THE_NILE_PERK_EFFECT: "#V Lũ Lụt#! từ [GetPerk('grip_the_water_perk').GetName(GetPlayer)] không còn tốn chi phí và kéo dài lâu hơn.\n#flavor Nghi lễ này có thể gây ra những trận lụt khủng khiếp hoặc để lại một lòng sông cạn khô với chỉ vài vũng nước đọng.#!"
 CALL_OF_THE_NORTH_STAR_PERK_EFFECT: "#flavor Phép thuật hữu ích này sắp xếp lại các lực từ trong khu vực theo ý muốn của pháp sư.#!"
 FESTIVAL_OF_MAAT_PERK_EFFECT: "Với vai trò [character_interaction|E], chuyển đổi 500 [piety_i] thành 5 [trait_level_track_xp|E] của [GetTrait('integrity').GetName(GetPlayer)], hoặc -50 [static_stress|E] nếu bạn không có [GetTrait('integrity').GetName(GetPlayer)].\n#flavor Nhận được sự ủng hộ của những người tham gia lễ hội trong một thời gian hạn định.#!"
 ARCH_OF_NUIT_PERK_EFFECT: "#flavor Nghi lễ này tăng cường các ảnh hưởng bảo hộ của Nuit bằng cách cản trở mọi năng lượng tâm linh tiêu cực.#!"
 CYCLE_OF_RA_PERK_EFFECT: "Mở khóa lựa chọn #V Chu Kỳ Của Ra#! trong [character_interaction|E] [GetPerk('simple_weather_magic_perk').GetName(GetPlayer)].\n#flavor Phép thuật này khiến pháp sư toát ra ánh sáng chói lòa của Ra và nhấp nháy nhanh qua các chu kỳ ngày và đêm của mình.#!"
 STAR_OF_THE_MESSIAH_PERK_EFFECT: "#flavor Nghi lễ này ban cho quyền tiếp cận tạm thời với các ảnh hưởng của người trần, xuất phát từ những người nhận được các dấu hiệu rằng pháp sư bằng cách nào đó chính là chìa khóa cho hy vọng và ước mơ của họ.#!"
 WHISPERS_OF_THE_TREE_OF_LIFE_PERK_EFFECT: "Với vai trò [character_interaction|E], tự ban cho mình [GetModifier('POD_hekau_whispers_of_the_tree_of_life_modifier').GetNameWithTooltip] trong 2 năm.\n#flavor Dòng chảy của Sekhem xuyên suốt vũ trụ mang theo những lời thì thầm về các bí mật mà Cây Sự Sống nắm giữ, và phép thuật này cho phép xác ướp lắng nghe chúng chỉ bằng cách hòa vào luồng năng lượng huyền bí này.#!"
 CROSSED_BY_THE_STARS_PERK_EFFECT: "Với vai trò [character_interaction|E], gây [GetModifier('POD_hekau_crossed_by_the_stars_modifier').GetNameWithTooltip] lên mục tiêu của bạn.\n#flavor Các bậc thầy của Hekau Celestial học được cách đánh bại kẻ địch bằng cách trói buộc họ một cách khó hiểu với những điềm xấu, ảnh hưởng tiêu cực và “những vì sao độc ác”.#!"

