 DEATHS_SHROUD_PERK_EFFECT: "#flavor Xác Ướp có thể che giấu linh hồn của mình khi ở trong Duat bằng cách đặt các biểu tượng bảo vệ lên tim và mắt của nó.#!"
 SEPARATE_KA_PERK_EFFECT: "#flavor Xác Ướp có thể chặt đứt linh hồn khỏi thân xác, cho phép hắn trốn thoát vào [UmbraGlossaryLocalized('shadowlands','Âm Phủ')].#!"
 GHOST_LANTERN_PERK_EFFECT: "#flavor Xác Ướp biến Sekhem thành một quả cầu ánh sáng ma quái dẫn đường cho hắn trong [UmbraGlossaryLocalized('shadowlands','Âm Phủ')].#!"
 STORMWALK_PERK_EFFECT: "Bạn sẽ không còn bị lạc trong [UmbraGlossary('tempest')].\n#flavor Xác Ướp có thể định hướng bản thân trong [UmbraGlossary('tempest')] luôn biến đổi bên dưới [UmbraGlossary('shadowlands')] bằng cách tập trung vào những nơi quen thuộc (như Amenti).#!"
 BODY_PRESERVATION_PERK_EFFECT: "#flavor Một Xác Ướp có thể bảo tồn khat của mình khỏi phân hủy bằng cách dùng nhiều loại hỗn hợp và tắm thân xác trong dầu và kem.#!"
 JUDGE_THE_SOUL_PERK_EFFECT: "#flavor Xác Ướp có thể thấy được linh hồn của mục tiêu và mức độ nó hòa hợp với Ma'at. Các sinh vật siêu nhiên cũng có thể được nhận diện bằng phép thuật này.#!"
 SUMMON_THE_DEAD_PERK_EFFECT: "$POD_can_summon_wraith_trigger_loca$\n#flavor Xác Ướp có thể phát ra lời gọi triệu hồi một hồn ma cụ thể mà Xác Ướp biết đến. Phép thuật này không cho quyền kiểm soát sinh vật đó.#!"
 STORM_SHIELD_PERK_EFFECT: "#flavor Bằng cách khơi dòng Sekhem của mình, Xác Ướp có thể dựng lên các lá chắn chống lại những cơn bão trong [UmbraGlossaryLocalized('shadowlands','Âm Phủ')], cũng như Yêu Tinh và các sinh vật tương tự.#!"
 FERTILITY_OF_OSIRIS_PERK_EFFECT: "#flavor Nghi lễ này cho phép một người chết nam giới làm cho một người phàm nữ còn sống mang thai.#!"
 REVISIT_DEATH_PERK_EFFECT: "Nếu bất kỳ người thân hay bạn bè của bạn bị giết trong hoàn cảnh bí ẩn, bạn sẽ biết được kẻ giết họ.\n#flavor Bằng cách chạm vào da của một xác chết, Xác Ướp có thể hồi tưởng lại những trải nghiệm cuối cùng của thân xác này.#!"
 BANISH_THE_DEAD_PERK_EFFECT: "Bạn sẽ không còn bị $POD_splat_wraith_plural$ chiếm hữu nữa.\n#flavor Xác Ướp có thể trục xuất một hồn ma đã chiếm hữu một thân xác người phàm.#!"
 BIND_THE_DEAD_PERK_EFFECT: "Mở khóa [GetMaA('wraiths').GetName] làm [men_at_arms|E].\n$POD_can_weaken_fetter_trigger_loca$\n$POD_can_bind_wraith_trigger_loca$\n$POD_can_command_wraith_trigger_loca$\n#flavor Xác Ướp có thể buộc một hồn ma phải thực hiện một nhiệm vụ cụ thể.#!"
 SENSE_THE_DEAD_PERK_EFFECT: "#flavor Xác Ướp có thể cảm nhận nếu một hồn ma đang theo dõi hắn hoặc ở gần đó.#!"
 MANIFESTATION_PERK_EFFECT: "Cho phép tương tác với các nhân vật trên [UmbraGlossary('earth')] khi vẫn ở trong [umbra|E].\n#flavor Khi ở trong Duat, Xác Ướp có thể hiện linh hồn của mình như một bóng ma mờ ảo trong thế giới của người sống.#!"
 SEPARATE_BA_PERK_EFFECT: "#flavor Xác Ướp có thể tùy ý bước vào bất kỳ [umbra|E] nào.#!"
 SHADOW_PORTAL_PERK_EFFECT: "#flavor Xác Ướp có thể tạo ra một cổng dịch chuyển trong [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] cho phép di chuyển nhanh.#!"
 DEATHS_HAND_PERK_EFFECT: "#flavor Xác Ướp có thể khơi dòng Plasm nguyên sơ của [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] chống lại kẻ thù chỉ bằng một cái chạm.#!"
 BIND_THE_LIVING_PERK_EFFECT: "$POD_can_covert_to_wraith_trigger_loca$\n$POD_can_summon_on_death_trigger_loca$\n#flavor Xác Ướp có thể thi hành một nghi lễ đảm bảo người đó sẽ tồn tại như một Hồn Ma.#!"
 AMENTIS_GRACE_PERK_EFFECT: "#flavor Với nghi lễ này, một xác ướp có thể tạo ra một lá bùa để hình thành một [UmbraGlossary('shadow_realm')] tạm thời.#!"
 SIN_EATING_PERK_EFFECT: "Như một lựa chọn [execution|E], giết một $POD_splat_wraith$ bị giam giữ để mất 25 [stress|E].\n#flavor Xác Ướp có thể xá tội cho một mục tiêu khỏi những xung động tiêu cực mãnh liệt hoặc thậm chí Đam Mê Đen Tối.#!"
 KHAIBITS_EMBRACE_PERK_EFFECT: "Mở khóa các đòn thế [single_combat_duel|E] mới.\n#flavor Xác Ướp có thể phong ấn một mục tiêu người phàm trong một cái quan tài bằng chất dịch tâm linh đen.#!"
 SEVER_SOUL_PERK_EFFECT: "Mở khóa [GetMaA('walker').GetName], [GetMaA('shambler').GetName], [GetMaA('skeletons').GetName] và [GetMaA('dragons_teeth').GetName] làm [men_at_arms|E].\n#flavor Xác Ướp có thể cắt đứt liên kết giữa một sinh vật siêu nhiên đã lìa khỏi thân xác của nó và thân xác đó.#!"
 HEART_OF_LIFE_PERK_EFFECT: "Cho phép tương tác với các nhân vật trên [UmbraGlossary('earth')] khi đang hồi sinh từ cái chết.\n#flavor Sau khi cắt lìa một phần thân thể, như một bàn tay hay đầu của mình, Xác Ướp có thể hồi sinh phần đó trong chu kỳ chết của mình để tiếp cận thế giới của người sống.#!"
 PANOPLY_OF_SHADOW_PERK_EFFECT: "#flavor Bằng cách viện đến các thế lực của [UmbraGlossary('oblivion')], Xác Ướp có thể tự cuộn mình vào bóng của chính hắn để trở thành một sinh vật vô hình có thể vô hiệu hóa bất kỳ đòn tấn công vật lý nào.#!"
 SCOURING_OBLIVION_PERK_EFFECT: "Như một [character_interaction|E], gây [GetModifier('POD_hekau_scouring_oblivion_modifier').GetNameWithTooltip] lên mục tiêu của bạn trong 5 năm.\n#flavor Xác Ướp có thể chữa lành các sinh vật sống bằng cách chiết xuất năng lượng của cái chết ra khỏi thân xác chúng.#!"
 ENTRAP_THE_BA_PERK_EFFECT: "#flavor Xác Ướp có thể bắt giữ linh hồn hay tâm hồn của một mục tiêu và phong ấn nó trong một bình chứa được chuẩn bị đặc biệt.#!"
 CALL_THE_KHAIBIT_PERK_EFFECT: "Mở khóa [GetMaA('spectres').GetName] làm [men_at_arms|E].\nNhư một lựa chọn [execution|E], giết một tù nhân trong khi nhận 2 [GetTrait('integrity').GetName(GetPlayer)] [trait_level_track_xp|E], hoặc -10 [static_stress|E] nếu bạn không có [GetTrait('integrity').GetName(GetPlayer)].\n#flavor Ngay lúc chết, một Xác Ướp có thể chặt đứt Bóng khỏi một linh hồn, cho phép nó ra đi trong khi khaibit của nó tồn tại lại như một Yêu Tinh.#!"
 RESHAPE_THE_LOST_SOUL_PERK_EFFECT: "#flavor Xác Ướp có thể thay đổi Đam Mê của một Hồn Ma.#!"
 OPEN_THE_SEBKHET_PERK_EFFECT: "Có thể điều khiển cả Màn Che và Cửa Chắn.\n#flavor Xác Ướp xé rách Màn Che, cho phép bản thân và những người khác bước vào Duat.#!"
 KHU_OF_TWO_LANDS_PERK_EFFECT: "Cho phép bạn tương tác với những sinh thể của [umbra|E] khi bạn đang ở thế giới vật chất.\n#flavor Xác Ướp có thể tương tác với Thế Giới Vật Chất và [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] mà không bị phạt.#!"
 ASPECT_OF_DUAT_PERK_EFFECT: "Có thể biến hình và duy trì hình dạng đã biến khi vẫn ở trong [umbra|E].\n#flavor Xác Ướp có thể định hình dáng vẻ của mình trong [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] theo ý muốn.#!"
 EATING_THE_HEART_PERK_EFFECT: "Mỗi #V 50#! năm một lần, bạn có thể đánh lừa Các Vị Phán Quan của Ma'at trong quá trình hồi sinh của bạn để tránh bị trừng phạt.\n#flavor Xác Ướp tạo ra một trái tim giả để đánh lừa Các Vị Phán Quan của Ma'at trong một khoảng thời gian hạn chế.#!"
 SHADOW_TALISMAN_PERK_EFFECT: "#flavor Xác Ướp có thể mang Bùa Chú mà hắn tạo ra qua Hekau Bùa Chú vào [UmbraGlossaryLocalized('shadowlands','Âm Phủ')].#!"
 LIGHTEN_THE_SHADOW_PERK_EFFECT: "Cải thiện [GetPerk('scouring_oblivion_perk').GetName(GetPlayer)] bằng cách cũng loại bỏ [GetTrait('spectre').GetName(GetNullCharacter)], [GetTrait('shadow').GetName(GetNullCharacter)] hoặc [GetTrait('wight').GetName(GetNullCharacter)].\n#flavor Xác Ướp có thể làm dịu những mặt tối tăm hơn của một mục tiêu, ví dụ như kéo một ma cà rồng ra khỏi Cuồng Nộ.#!"
 GIFT_OF_PURPOSE_PERK_EFFECT: "#flavor Xác Ướp có thể truyền một phần động lực nội tâm của chính mình cho một mục tiêu.#!"
 SPEAR_OF_ANUBIS_PERK_EFFECT: "Mở khóa các đòn thế [single_combat_duel|E] mới.\n#flavor Bằng cách cắt mở lòng bàn tay, Xác Ướp có thể hiện sức mạnh của [UmbraGlossary('oblivion')] thành một ngọn giáo tối tăm gây sát thương gia trọng và xuyên qua mọi lớp phòng vệ thông thường.#!"
 LOYAL_COMPANION_PERK_EFFECT: "Vật nuôi và chiến mã của bạn sẽ được hồi sinh khi chúng chết.\n#flavor Sau khi ướp xác một con vật đặc biệt trung thành, Xác Ướp có thể hồi sinh nó như một tôi bộc ma quái.#!"
 CALL_FORTH_THE_REAVERS_OF_UR_PERK_EFFECT: "Có thể tuyển mộ [GetMaA('the_reavers_of_ur').GetName] làm [men_at_arms|E].\n#flavor Xác Ướp triệu hồi một bầy hình dạng xám ghê rợn uốn lượn từ một nơi không xác định để tàn sát kẻ thù một cách kinh tởm.#!"
 DARK_WALL_OF_HATSHEPSUT_PERK_EFFECT: "#flavor Được phát triển bởi Shemsu-Heru Hatshepsut như một biến thể nhỏ của Nghi Lễ Vua Mặt Trời, phép thuật này tạo ra một bức tường Sekhem cản trở mọi linh hồn vượt qua nó và nâng cao Màn Che tại chỗ.#!"
 WALKING_IN_THE_SHADOW_OF_ANUBIS_PERK_EFFECT: "#flavor Xác Ướp có thể di chuyển ngay lập tức qua các thế giới khác nhau của Tellurian, miễn là hắn biết đến sự tồn tại của chúng.#!"
 SPIRIT_THE_BODY_AWAY_PERK_EFFECT: "#flavor Xác Ướp có thể biến xác chết thành plasm, đưa thân xác của hắn vượt qua Màn Che.#!"
 EMPOWER_KA_PERK_EFFECT: "#flavor Xác Ướp tăng cường ka của mình để bảo vệ thân xác hiệu quả hơn trong chu kỳ chết của hắn.#!"
 EMPOWER_BA_PERK_EFFECT: "#flavor Xác Ướp có thể tăng cường ba của mình để trở về xác nhanh hơn.#!"
 CASTING_AWAY_PERK_EFFECT: "Như một [character_interaction|E], ném mục tiêu của bạn vào [UmbraGlossary('tempest')] sau một lần kiểm tra [prowess|E]. Nếu họ không có quyền tiếp cận [UmbraGlossaryLocalized('shadowlands','Âm Phủ')], họ sẽ chết.\n#flavor Xác Ướp có thể quăng mục tiêu vào những cơn gió cuồng nộ của [UmbraGlossary('tempest')].#!"
 HEART_OF_REINCARNATION_PERK_EFFECT: "Mỗi #V 25#! năm, nhận [GetModifier('extra_life_1_modifier').GetNameWithTooltip] nếu bạn chưa có nó. Điều này sẽ tránh được quá trình hồi sinh thông thường của $POD_splat_mummy_plural$.\n#flavor Bằng cách truyền bản chất của mình vào một vật nhỏ, xác ướp có thể tránh khỏi sự hủy diệt hoàn toàn của thân xác bằng cách tái sinh trong con của người phụ nữ kế tiếp chạm vào vật đó.#!"
 TRANSFIXING_GAZE_PERK_EFFECT: "#flavor Bằng một cái nhìn chằm chằm, Xác Ướp có thể khuấy động Khaibit trong một mục tiêu, làm tê liệt họ trong một khoảng thời gian ngắn.#!"
 SEPARATE_KHAIBIT_PERK_EFFECT: "Như một [character_interaction|E], cho phép bạn tạo ra một bản sao của chính mình.\n#flavor Xác Ướp có thể chặt đứt khaibit của chính mình, biến nó thành một sinh vật giống [GetTrait('spectre').GetName( GetNullCharacter )] hành động theo lệnh của kẻ tạo ra nó.#!"
 BARRING_THE_GATES_PERK_EFFECT: "Như một [character_interaction|E], điều khiển Màn Che cho toàn bộ một vương quốc.\n#flavor Xác Ướp có thể nâng cao sức mạnh của Màn Che tại chỗ để ngăn chặn bất kỳ cuộc xâm nhập của hồn ma.#!"
 PROMISE_MADE_BEFORE_AMMUTS_SCALES_PERK_EFFECT: "Như một [character_interaction|E], cho mục tiêu của bạn [GetModifier('extra_life_1_modifier').GetNameWithTooltip] trong khi nhận 2 $POD_splat_mummy$ Ký Ức [trait_level_track_xp|E].\n#flavor Xác Ướp có thể truyền một mảnh của Phép Thuật Sự Sống cho một người phàm tự nguyện sau khi thỉnh ý Các Vị Phán Quan của Ma'at về trường hợp này.#!"
 UNMAKING_PERK_EFFECT: "Như một lựa chọn [execution|E], giết vĩnh viễn một tù nhân, vượt qua mọi phương thức hồi sinh.\n#flavor Xác Ướp có thể ném bất cứ thứ gì vào giếng của hư vô, xóa bỏ nó khỏi sự tồn tại.#!"
 CALL_OF_OBLIVION_PERK_EFFECT: "Như một [character_interaction|E], ném mục tiêu của bạn vào [UmbraGlossary('oblivion')], xóa bỏ họ khỏi sự tồn tại sau một lần kiểm tra [prowess|E]. Chỉ hoạt động trên mục tiêu không bất tử.\n#flavor Xác Ướp lập tức buộc linh hồn của mục tiêu ra khỏi thân xác nó, tiếp tục sang bất kỳ số phận nào đang chờ đợi nó.#!"

