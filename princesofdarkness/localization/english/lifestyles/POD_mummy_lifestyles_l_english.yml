 ASKING_THE_TREES_PERK_EFFECT: "Như một [character_interaction|E], triệu hồi một trong các [Glossary('Chân Danh','podgloss.truename')] cây cỏ mà bạn biết để kích thích sự sinh trưởng của nó, áp dụng [modifier|E] tích cực hoặc tiêu cực lên lãnh địa của mục tiêu.\n#flavor Người Amenti có thể điều khiển thực vật ở một mức độ hạn chế.#!"
 FORGETTING_THE_STONE_PERK_EFFECT: "Như một [character_interaction|E], triệu hồi một trong các [Glossary('Chân Danh','podgloss.truename')] kim loại mà bạn biết để tiêu diệt nó trong một khu vực, áp dụng [modifier|E] tiêu cực lên lãnh địa của mục tiêu.\n#flavor Người Amenti có thể làm biến mất một số vật liệu vô cơ.#!"
 FORGETTING_THE_TREE_PERK_EFFECT: "Như một [character_interaction|E], triệu hồi một trong các [Glossary('Chân Danh','podgloss.truename')] cây cỏ mà bạn biết để tiêu diệt nó trong một khu vực, áp dụng [modifier|E] tích cực hoặc tiêu cực lên lãnh địa của mục tiêu.\n#flavor Người Amenti có thể làm biến mất các vật liệu hữu cơ, như gỗ.#!"
 NAME_THE_SECRET_PERK_EFFECT: "#flavor Người Amenti có thể đoán ra những nhược điểm ẩn giấu bằng cách nghiên cứu Chân Danh của mục tiêu.#!"
 NAMING_THE_WARNING_PERK_EFFECT: "#flavor Bằng cách xướng lên các âm tiết trong Chân Danh của mình, người Amenti có thể xua đuổi kẻ địch.#!"
 BECOMING_THE_STONE_PERK_EFFECT: "Như một [character_interaction|E], biến hình thành kim loại mà bạn biết [Glossary('Chân Danh','podgloss.truename')] của nó.\n#flavor Người Amenti có thể biến da thịt mình thành một loại khoáng vật mà họ biết Chân Danh.#!"
 BECOMING_THE_TREE_PERK_EFFECT: "Như một [character_interaction|E], biến hình thành cây cỏ mà bạn biết [Glossary('Chân Danh','podgloss.truename')] của nó.\n#flavor Người Amenti có thể biến da thịt mình thành một loại cây.#!"
 CLOUD_THE_NAME_PERK_EFFECT: "Trở nên miễn nhiễm với [journey|E] 'Học Chân Danh'.\n#flavor Người Amenti có thể che mờ Chân Danh của chính mình, ẩn mình khỏi những kẻ địch cũng sử dụng thuật này.#!"
 COMMAND_THE_BEAST_PERK_EFFECT: "Có thể tuyển mộ [men_at_arms|E] động vật miễn là bạn biết [Glossary('Chân Danh','podgloss.truename')] của chúng.\n#flavor Người Amenti có thể khiến một con vật khuất phục để phục vụ mình.#!"
 MEND_FLESH_PERK_EFFECT: "Như một [character_interaction|E], chữa lành một [trait|E] thương tật mà bạn biết [Glossary('Chân Danh','podgloss.truename')] của nó.\n#flavor Người Amenti có thể ra lệnh cho các mô liền lại với nhau.#!"
 BECOME_ANIMAL_PERK_EFFECT: "Như một [character_interaction|E], biến hình thành một con vật mà bạn biết [Glossary('Chân Danh','podgloss.truename')] của nó.\n#flavor Người Amenti có thể biến chính mình thành một con vật mà họ đã đoán ra Chân Danh.#!"
 COMMAND_THOUGHT_PERK_EFFECT: "Có thể sử dụng [journey|E] 'Học Chân Danh'.\n#flavor Người Amenti có thể ra một lệnh bằng lời mà mục tiêu có tri giác buộc phải tuân theo.#!"
 NAME_THE_HEKAU_PERK_EFFECT: "#flavor Người Amenti có thể hóa giải các thuật siêu nhiên khác nhằm vào mình.#!"
 WHISPERS_TO_THE_HEART_PERK_EFFECT: "#flavor Người Amenti có thể khơi gợi bất kỳ cảm xúc nào trong mục tiêu.#!"
 HEKAU_ENSLAVE_PERK_EFFECT: "Sau khi học được [Glossary('Chân Danh','podgloss.truename')] của một nhân vật, khiến họ yêu mến bạn #weak (+200 quan điểm)#!.\n#flavor Người Amenti có thể ràng buộc một mục tiêu theo ý chí của mình trong một thời gian dài.#!"
 FORTIFY_FLESH_PERK_EFFECT: "#flavor Người Amenti có thể ban cho da mình những đặc tính của đá.#!"
 NAMING_THE_BODYS_DESTRUCTION_PERK_EFFECT: "Như một [character_interaction|E], gây một [trait|E] thương tật mà bạn biết [Glossary('Chân Danh','podgloss.truename')] của nó lên mục tiêu.\n#flavor Người Amenti có thể nhắm vào các bộ phận thân thể của kẻ địch bằng cách xướng lên Chân Danh của chúng và ra lệnh cho chúng héo mòn.#!"
 SPEAKING_ALL_NAMES_PERK_EFFECT: "#flavor Người Amenti có thể tức thời thông hiểu bất kỳ ngôn ngữ nào nhờ tri thức về Chân Danh.#!"
 FORGETTING_THE_NAME_PERK_EFFECT: "Như một [character_interaction|E], xóa bỏ hoàn toàn một nhân vật mà bạn biết [Glossary('Chân Danh','podgloss.truename')] của họ khỏi sự tồn tại.\n#flavor Người Amenti có thể xóa bỏ Chân Danh của mục tiêu, trục xuất nó khỏi sự tồn tại và xóa sạch mọi ghi chép.#!"
 PTAHS_WORD_PERK_EFFECT: "#flavor Người Amenti có thể tạo ra một vật vô tri nhỏ bằng cách xướng lên Chân Danh của nó.#!"
 WHISPERS_TO_THE_BODY_PERK_EFFECT: "Như một [character_interaction|E], thay đổi các [traits|E] thể chất của bạn miễn là bạn biết [Glossary('Chân Danh','podgloss.truename')] của chúng.\n#flavor Người Amenti có thể tái tạo hình dạng của chính mình bằng cách xướng lên Chân Danh của nó và ra lệnh cho nó trở thành điều họ mong muốn.#!"
 WORDS_OF_AUTHORITY_PERK_EFFECT: "#flavor Người Amenti xướng lên một câu mà tất cả những ai nghe được buộc phải thực hiện hết khả năng của mình.#!"
 ECHO_THE_LESSER_NAME_PERK_EFFECT: "#flavor Người Amenti có thể thấu hiểu Chân Danh của những sự vật hay khái niệm cơ bản chỉ bằng cách lắng nghe âm vang mang theo bởi Sekhem.#!"
 NAME_OF_SEKHEM_PERK_EFFECT: "Mỗi tháng, giảm 5 [stress|E].\n#flavor Người Amenti có thể sai khiến Sekhem, kéo nó về bản thân để bổ sung nguồn dự trữ của mình, hoặc hướng nó đến một đồng minh.#!"
 NAME_OF_SKILL_PERK_EFFECT: "#flavor Người Amenti có thể học hoặc nâng cao một kỹ năng thông qua tri thức về một Chân Danh liên quan.#!"
 RIDDLE_OF_THE_SPHINX_PERK_EFFECT: "#flavor Người Amenti có thể đặt ra một câu hỏi và gieo vào mục tiêu nhu cầu phải trả lời.#!"
 BECOMING_THE_PERSON_PERK_EFFECT: "Cải thiện [GetPerk('whispers_to_the_body_perk').GetName(GetPlayer)] bằng cách còn cho phép bạn thay đổi cả [traits|E] tính cách, căng thẳng và sức khỏe.\n#flavor Bằng cách sử dụng Chân Danh của một người, người Amenti trở thành người đó, thực sự thấu hiểu người này là như thế nào.#!"
 ECHO_THE_GREATER_NAME_PERK_EFFECT: "#flavor Người Amenti có thể thấu hiểu Chân Danh của những sự vật hay khái niệm phức tạp hơn.#!"
 NAME_OF_THE_ATTRIBUTE_PERK_EFFECT: "#flavor Người Amenti có thể nâng cao các thuộc tính của mình bằng cách sử dụng Chân Danh của chúng.#!"
 NAMES_OF_THE_FORGOTTEN_PERK_EFFECT: "Có thể tuyển mộ [GetMaA('the_lost_ancients').GetName] làm [men_at_arms|E].\n#flavor Thông qua nghiên cứu tận tâm, người Amenti có thể tạo ra một Chân Danh cho một sinh thể đã đánh mất Chân Danh của mình.#!"
 NAME_OF_THE_WILL_PERK_EFFECT: "Mỗi tháng, giảm 7 [stress|E].\n#flavor Người Amenti có thể nâng cao ý chí của mình bằng cách sử dụng Chân Danh của nó.#!"
 RENAMING_THE_HEKAU_PERK_EFFECT: "Mở khóa một quyết định cho phép bạn học #V 1#! khả năng từ một [splat|E] khác.\n#flavor Người Amenti có thể sắp xếp lại các quy luật của một quyền năng siêu nhiên cụ thể, ví dụ như định nghĩa lại Discipline của một ma cà rồng hoặc mô hình pháp thuật của một mage.#!"

