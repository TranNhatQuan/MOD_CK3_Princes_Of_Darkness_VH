 ANALYZE_MATERIAL_PERK_EFFECT: "Thời gian hiệu lực dược tễ: #P +1#!\n#flavor Xác Ướp có thể biết được thông tin về thành phần cấu tạo của một vật thể.#!"
 CLOUD_OF_SMOKE_PERK_EFFECT: "#flavor Xác Ướp khiến lửa tỏa ra một luồng khói đen đặc bằng cách ném một loại bột pha chế vào đó.#!"
 DRINK_OF_SEVEN_DAYS_REST_PERK_EFFECT: "$unlock_brewing_node$ [GetModifier('drink_of_seven_days_rest_modifier').GetNameWithTooltip]\n#flavor Dược tễ này giải trừ mọi mệt mỏi cho người uống, chữa lành những tổn thương nhỏ.#!"
 MILD_POISON_PERK_EFFECT: "$unlock_brewing_node$ [GetModifier('mild_poison_modifier').GetNameWithTooltip]\n#flavor Xác Ướp tạo ra một loại độc dược nhẹ nhưng có thể gây chết người.#!"
 POTION_OF_RESILIENCE_PERK_EFFECT: "$unlock_brewing_node$ [GetModifier('potion_of_resilience_modifier').GetNameWithTooltip]\n#flavor Dược tễ này hoạt động như một loại thuốc gây mê siêu nhiên.#!"
 SIMPLE_ELIXIR_PERK_EFFECT: "$unlock_brewing_node$ [GetModifier('simple_elixir_diplomacy_modifier').GetNameWithTooltip]\n#flavor Xác Ướp tạo ra một Linh Dược, một dược tễ sơ cấp giúp tăng cường một thuộc tính duy nhất trong một khoảng thời gian.#!"
 SIMPLE_PHILTRE_PERK_EFFECT: "$unlock_brewing_node$ [GetModifier('simple_philtre_modifier').GetNameWithTooltip]\n#flavor Xác Ướp tạo ra một mê dược, một chất sơ cấp khơi gợi một cảm xúc cụ thể ở đối tượng.#!"
 SIMPLE_TONIC_PERK_EFFECT: "$unlock_brewing_node$ [GetModifier('simple_tonic_modifier').GetNameWithTooltip]\n#flavor Xác Ướp tạo ra một loại thuốc mỡ hoặc dược tễ trị thương.#!"
 STASIS_PERK_EFFECT: "Độ bền [artifact|E] của dược tễ: #P +5#!\n#flavor Xác Ướp giữ cho một vật chất duy nhất không bị các thế lực bên ngoài làm biến đổi.#!"
 BLOOD_OF_THE_SNAKE_PERK_EFFECT: "Cải tiến [GetPerk('potion_of_resilience_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('potion_of_resilience_modifier').GetNameWithTooltip] bằng [GetModifier('blood_of_the_snake_modifier').GetNameWithTooltip].\n#flavor Xác Ướp tạo ra một loại thuốc giải bảo vệ trước mọi độc tố tự nhiên hoặc chữa lành tổn thương do độc gây ra.#!"
 COBRA_SPIT_PERK_EFFECT: "Cải tiến [GetPerk('mild_poison_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('mild_poison_modifier').GetNameWithTooltip] bằng [GetModifier('cobra_spit_modifier').GetNameWithTooltip].\n#flavor Xác Ướp tạo ra một chất dịch có tính ăn mòn, gây tổn hại nghiêm trọng cho mô sống.#!"
 ESSENCE_LONGING_PERK_EFFECT: "Cải tiến [GetPerk('simple_philtre_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('simple_philtre_modifier').GetNameWithTooltip] bằng [GetModifier('essence_longing_modifier').GetNameWithTooltip].\n#flavor Xác Ướp tạo ra một loại nước hoa có tác dụng như một chất kích thích tình dục nhẹ.#!"
 EYES_OF_THE_KA_PERK_EFFECT: "#flavor Xác Ướp tạo ra một loại thuốc mỡ mà khi bôi lên mắt và tai, cho phép chứng kiến [UmbraGlossary('shadowlands')].#!"
 ICE_OF_THE_DESERT_PERK_EFFECT: "Độ bền [artifact|E] của dược tễ: #P +5#!\n#flavor Xác Ướp có thể biến đổi một phần trạng thái tự nhiên của vật chất.#!"
 LESSER_QUIDDITY_PERK_EFFECT: "#flavor Bằng việc sử dụng Sekhem, Xác Ướp kích hoạt bản chất (thuộc tính linh thiêng biểu tượng) của một vật thể.#!"
 LESSER_QUIDDITY_EFFECT_DESC: "[GetPerk('lesser_quiddity_perk').GetName(GetPlayer)]"
 REED_OF_HIDDEN_CURRENTS_PERK_EFFECT: "Thời gian hiệu lực dược tễ: #P +1#!\n#flavor Xác Ướp phù trợ một ít cỏ khô, rơm hoặc cỏ dại để phát hiện sự hiện diện của một chất cụ thể khác.#!"
 SPARK_OF_RA_PERK_EFFECT: "Mở khóa các thế đánh [single_combat_duel|E].\nTăng cơ hội gây thương tích cho [knights|E] địch khi ở [combat_phase|E] với vai trò [knight|E].\n#flavor Xác Ướp có thể đốt cháy một chất dễ cháy bằng Sekhem của mình.#!"
 COMPLEX_ELIXIR_PERK_EFFECT: "Cải tiến [GetPerk('simple_elixir_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('simple_elixir_diplomacy_modifier').GetNameWithTooltip] bằng [GetModifier('complex_elixir_diplomacy_modifier').GetNameWithTooltip].\n#flavor Xác Ướp tạo ra một linh dược cao cấp hơn, tăng cường hiệu ứng lên một thuộc tính duy nhất.#!"
 COMPLEX_PHILTRE_PERK_EFFECT: "Cải tiến [GetPerk('essence_longing_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('essence_longing_modifier').GetNameWithTooltip] bằng [GetModifier('complex_philtre_modifier').GetNameWithTooltip].\n#flavor Xác Ướp tạo ra một mê dược cao cấp hơn, khơi gợi một cảm xúc kéo dài lâu hơn.#!"
 COMPLEX_TONIC_PERK_EFFECT: "Cải tiến [GetPerk('simple_tonic_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('simple_tonic_modifier').GetNameWithTooltip] bằng [GetModifier('complex_tonic_modifier').GetNameWithTooltip].\n#flavor Xác Ướp tạo ra một loại bổ dược tiên tiến hơn với khả năng trị thương lớn hơn.#!"
 DANGEROUS_POISON_PERK_EFFECT: "Cải tiến [GetPerk('cobra_spit_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('cobra_spit_modifier').GetNameWithTooltip] bằng [GetModifier('dangerous_poison_modifier').GetNameWithTooltip].\n#flavor Xác Ướp tạo ra một loại độc dược hiệu quả hơn.#!"
 ONE_HUNDRED_THOUSAND_TONGUES_PERK_EFFECT: "#flavor Bằng cách tạo ra một loại thuốc mỡ đặc biệt cho môi và tai, xác ướp có thể hiểu được mọi ngôn ngữ được nói trong khu vực xung quanh mình.#!"
 POTION_OF_VALOR_PERK_EFFECT: "Cải tiến [GetPerk('drink_of_seven_days_rest_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('drink_of_seven_days_rest_modifier').GetNameWithTooltip] bằng [GetModifier('potion_of_valor_modifier').GetNameWithTooltip].\n#flavor Xác Ướp tạo ra một dược tễ giúp người dùng bỏ qua các hình phạt do thương tích trong một khoảng thời gian ngắn.#!"
 SALTS_OF_THE_DEAD_PERK_EFFECT: "Cải tiến [GetPerk('blood_of_the_snake_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('blood_of_the_snake_modifier').GetNameWithTooltip] bằng [GetModifier('salts_of_the_dead_modifier').GetNameWithTooltip].\n#flavor Xác Ướp có thể uống một loại muối đặc biệt giúp miễn nhiễm với một số loại tổn hại chỉ ảnh hưởng đến người sống (như thiếu oxy).#!"
 TEARS_OF_ISIS_PERK_EFFECT: "Độ bền [artifact|E] của dược tễ: #P +5#!\n#flavor Xác Ướp có thể chưng cất Sekhem thành hình thái vật chất, cho phép tích trữ để dùng sau.#!"
 ASHES_TO_ASHES_PERK_EFFECT: "Mở khóa các thế đánh [single_combat_duel|E] mới.\nTăng cơ hội gây thương tích nghiêm trọng cho [knights|E] địch khi ở [combat_phase|E] với vai trò [knight|E].\n#flavor Xác Ướp có thể biến đổi trạng thái của bất kỳ vật chất nào trong tức khắc.#!"
 GREATER_QUIDDITY_PERK_EFFECT: "#flavor Hiệu ứng huyền bí áp lên một vật thể trở nên mạnh mẽ hơn.#!"
 GREATER_QUIDDITY_EFFECT: "[GetPerk('greater_quiddity_perk').GetName(GetPlayer)]"
 PANACEA_PERK_EFFECT: "$unlock_brewing_node$ Chữa khỏi mọi [diseases|E]\n#flavor Xác Ướp tạo ra một dược tễ có thể chữa khỏi mọi bệnh (từ cảm lạnh thông thường đến bệnh đậu mùa nặng), nhưng không thể trị thương.#!"
 PHILOSOPHERS_STONE_PERK_EFFECT: "$unlock_brewing_node$ [GetModifier('philosophers_stone_modifier').GetNameWithTooltip]\n#flavor Xác Ướp tạo ra một loại bột nhanh chóng vón lại thành hình dạng giống viên sỏi, cho phép biến đổi bất kỳ kim loại nào thành vàng hoặc bạc.#!"
 POTION_OF_SEPARABLE_KA_PERK_EFFECT: "Cải tiến [GetPerk('salts_of_the_dead_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('salts_of_the_dead_modifier').GetNameWithTooltip] bằng [GetModifier('potion_of_separable_ka_modifier').GetNameWithTooltip].\n#flavor Xác Ướp tạo ra một dược tễ cho phép tách một linh hồn khỏi thân xác của nó.#!"
 CATALYST_CRUCIBLE_PERK_EFFECT: "Độ bền [artifact|E] của dược tễ: #P +5#!\n#flavor Xác Ướp có thể biến đổi các chế phẩm đã tạo trước đó với sự trợ giúp của Sekhem.#!"
 DEADLY_POISON_PERK_EFFECT: "Cải tiến [GetPerk('dangerous_poison_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('dangerous_poison_modifier').GetNameWithTooltip] bằng [GetModifier('deadly_poison_modifier').GetNameWithTooltip].\n#flavor Xác Ướp tạo ra một loại độc dược thực sự nguy hiểm.#!"
 DUST_TO_DUST_PERK_EFFECT: "Mở khóa các thế đánh [single_combat_duel|E] mới.\nTăng cơ hội đánh trọng thương [knights|E] địch khi ở [combat_phase|E] với vai trò [knight|E].\n#flavor Xác Ướp có thể biến xác thịt thành đất sét bằng cách truyền dẫn Sekhem qua cái chạm của mình.#!"
 FLESH_OF_THE_GODS_PERK_EFFECT: "Cải tiến [GetPerk('potion_of_separable_ka_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('potion_of_separable_ka_modifier').GetNameWithTooltip] bằng [GetModifier('flesh_of_the_gods_modifier').GetNameWithTooltip].\n#flavor Bằng cách rải bụi vàng lên thân mình, Xác Ướp có thể nhận được sự bảo vệ huyền bí tạm thời.#!"
 POTENT_ELIXIR_PERK_EFFECT: "Cải tiến [GetPerk('complex_elixir_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('complex_elixir_diplomacy_modifier').GetNameWithTooltip] bằng [GetModifier('potent_elixir_diplomacy_modifier').GetNameWithTooltip].\n#flavor Xác Ướp tạo ra một linh dược cao cấp hơn, tăng cường hiệu ứng lên một thuộc tính duy nhất.#!"
 POTENT_PHILTRE_PERK_EFFECT: "Cải tiến [GetPerk('complex_philtre_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('complex_philtre_modifier').GetNameWithTooltip] bằng [GetModifier('potent_philtre_modifier').GetNameWithTooltip].\n#flavor Xác Ướp tạo ra một mê dược cao cấp hơn, khơi gợi một cảm xúc kéo dài lâu hơn.#!"
 POTENT_TONIC_PERK_EFFECT: "Cải tiến [GetPerk('complex_tonic_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('complex_tonic_modifier').GetNameWithTooltip] bằng [GetModifier('potent_tonic_modifier').GetNameWithTooltip].\n#flavor Xác Ướp tạo ra một loại bổ dược tiên tiến hơn với khả năng trị thương lớn hơn.#!"
 POTION_OF_THE_DIVINE_PERK_EFFECT: "Cải tiến chuỗi thiên hướng [GetPerk('simple_tonic_perk').GetName(GetPlayer)] bằng cách thêm [GetModifier('extra_life_1_modifier').GetNameWithTooltip]\n#flavor Xác Ướp tạo ra một dược tễ có thể tạm thời tránh khỏi cái chết.#!"
 POTION_OF_THE_VILE_BODY_PERK_EFFECT: "Cải tiến chuỗi thiên hướng [GetPerk('mild_poison_perk').GetName(GetPlayer)] bằng cách thêm [GetModifier('potion_of_the_vile_body_modifier').GetNameWithTooltip]\n#flavor Xác Ướp tạo ra một dược tễ khiến mọi dịch thể trong cơ thể mình trở nên độc hại.#!"
 DISTILL_THE_WISDOM_OF_MAAT_PERK_EFFECT: "#flavor Xác Ướp có thể chưng cất chỉ số Cân Bằng của chính mình, để đưa con người trở lại hòa hợp với Nguyên Lý Vũ Trụ.#!"
 DRAUGHT_OF_PERFECT_MEMORY_PERK_EFFECT: "Cải tiến chuỗi thiên hướng [GetPerk('potion_of_resilience_perk').GetName(GetPlayer)] bằng cách thêm [GetModifier('draught_of_perfect_memory_modifier').GetNameWithTooltip].\n#flavor Xác Ướp tạo ra một chất có thể ngay lập tức phục hồi ký ức của người dùng, vượt qua cả những sự phong tỏa siêu nhiên.#!"
 PERSONAL_POISON_PERK_EFFECT: "Cải tiến [GetPerk('deadly_poison_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('deadly_poison_modifier').GetNameWithTooltip] bằng [GetModifier('personal_poison_modifier').GetNameWithTooltip].\n#flavor Xác Ướp tạo ra một loại độc dược chỉ có tác dụng với một mục tiêu cụ thể.#!"
 PRINCELY_ELIXIR_PERK_EFFECT: "Cải tiến [GetPerk('potent_elixir_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('potent_elixir_diplomacy_modifier').GetNameWithTooltip] bằng [GetModifier('princely_elixir_diplomacy_modifier').GetNameWithTooltip].\n#flavor Xác Ướp tạo ra một linh dược cao cấp hơn, tăng cường hiệu ứng lên một thuộc tính duy nhất.#!"
 PRINCELY_TONIC_PERK_EFFECT: "Cải tiến [GetPerk('potent_tonic_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('potent_tonic_modifier').GetNameWithTooltip] bằng [GetModifier('princely_tonic_modifier').GetNameWithTooltip].\n#flavor Xác Ướp tạo ra một loại bổ dược tiên tiến hơn với khả năng trị thương lớn hơn.#!"
