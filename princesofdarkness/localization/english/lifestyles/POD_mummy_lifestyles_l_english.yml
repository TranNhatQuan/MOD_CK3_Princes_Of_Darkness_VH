 DIVINE_TONIC_PERK_EFFECT: "Cải tiến [GetPerk('kingly_tonic_perk').GetName(GetPlayer)] bằng cách thay thế [GetModifier('kingly_tonic_modifier').GetNameWithTooltip] bằng [GetModifier('divine_tonic_modifier').GetNameWithTooltip].\n#flavor Xác Ướp tạo ra một loại bổ dược vô cùng tinh luyện với khả năng trị thương lớn hơn.#!"
