 single_combat.0031.desc.sc_attacker.POD_leaping_rake.fatality: "Đối thủ ta né tránh đòn tấn công của ta và ngay lập tức phản công."
 single_combat.0031.desc.sc_attacker.POD_wishbone.fatality: "Đối thủ ta né tránh đòn tấn công của ta và ngay lập tức phản công."
 single_combat.0031.desc.sc_attacker.POD_manipulate_inertia.fatality: "Và ta mất nó còn tệ hơn cả những gì ta đã dự đoán. Dù sao ta cũng sẽ chẳng mất thêm gì nữa, nếu điều đó được tính là một sự an ủi."
 single_combat.0031.desc.sc_attacker.POD_manipulate_acceleration.fatality: "Và ta mất nó còn tệ hơn cả những gì ta đã dự đoán. Dù sao ta cũng sẽ chẳng mất thêm gì nữa, nếu điều đó được tính là một sự an ủi."
 single_combat.0031.desc.sc_attacker.POD_manipulate_cohesion.fatality: "Và ta mất nó còn tệ hơn cả những gì ta đã dự đoán. Dù sao ta cũng sẽ chẳng mất thêm gì nữa, nếu điều đó được tính là một sự an ủi."
 single_combat.0031.desc.sc_attacker.POD_dragons_breath.fatality: "\"Có lẽ ta đã dồn quá nhiều vào đòn tấn công này\" là suy nghĩ cuối cùng của ta khi [sc_victor.GetSheHe] thu hẹp khoảng cách và cắm vũ khí của [sc_victor.GetHerHis] vào cổ họng ta."
 single_combat.0031.desc.sc_attacker.POD_bark_mudpuppy.fatality: "[sc_victor.GetSheHe|U] chỉ đơn giản gồng bắp thịt của [sc_victor.GetHerHis] một cách khoa trương rồi chém vào cổ họng ta khi ta đang hồi phục, và với điều đó, ta bị bịt miệng vĩnh viễn."
 single_combat.0031.desc.sc_attacker.POD_clap_of_thunder.fatality: "[sc_victor.GetSheHe|U] phủi bỏ cuộc tấn công bằng tiếng ồn và tung ra một loạt phản công nhanh nhẹn khiến máu đổ, và với sự tự chủ bị lung lay như thế này, cuộc đấu này coi như đã kết thúc."
 single_combat.0031.desc.sc_attacker.POD_dragon_slash.fatality: "[sc_victor.GetSheHe|U] tận dụng chính đà tấn công của ta để chống lại ta khi [sc_victor.GetSheHe] bước sang một bên và giơ vũ khí của [sc_victor.GetHerHis] lên, và khi nó giáng xuống cổ ta, tất cả những gì ta có thể nghĩ là: quả là một bài học điển hình về sự tự tin thái quá."




