 single_combat.0041.desc.opponent_response.POD_leaping_rake.injury: "Ta nhảy bổ vào đối thủ của ta, làm [my_foe.GetHerHim] bị thương."
 single_combat.0041.desc.opponent_response.POD_wishbone.injury: "Ta gây sát thương lên kẻ địch của ta, cố xé [my_foe.GetHerHim] ra từng mảnh."
 single_combat.0041.desc.opponent_response.POD_manipulate_inertia.injury: "Và chúng chẳng có gì cả, chẳng mấy chốc đã phải chật vật gượng dậy sau đòn tấn công dồn dập của ta."
 single_combat.0041.desc.opponent_response.POD_manipulate_acceleration.injury: "Và chúng chẳng có gì cả, chẳng mấy chốc đã phải chật vật gượng dậy sau đòn tấn công dồn dập của ta."
 single_combat.0041.desc.opponent_response.POD_manipulate_cohesion.injury: "Và chúng chẳng có gì cả, chẳng mấy chốc đã phải chật vật gượng dậy sau đòn tấn công dồn dập của ta."
 single_combat.0041.desc.opponent_response.POD_dragons_breath.injury: "Ta tận dụng việc [sc_loser.GetHerHis] quá đà và đánh cho [sc_loser.GetHerHim] bất tỉnh trong khi cổ họng [sc_loser.GetHerHis] vẫn còn phát sáng."
 single_combat.0041.desc.opponent_response.POD_bark_mudpuppy.injury: "Ta thu hẹp khoảng cách và bịt miệng [sc_loser.GetHerHim] bằng một cú chặt vào cổ họng. Xin đừng hét thêm nữa."
 single_combat.0041.desc.opponent_response.POD_clap_of_thunder.injury: "Có vẻ như tiếng sấm ảnh hưởng đến [sc_loser.GetHerHim] nhiều hơn là đến ta, và những đòn phản công nhanh nhẹn của ta gần như không gặp phải kháng cự nào. Trận đấu kết thúc chỉ trong chốc lát."
 single_combat.0041.desc.opponent_response.POD_dragon_slash.injury: "Tất cả những gì ta cần làm là bước sang một bên và đấm vào sau gáy [sc_loser.GetHerHim], như thể ta là một võ sư đang khiển trách học trò của [sc_victor.GetHerHis]."


#Defender Lost, Opponent Finishing Move Fatality
#Example: "\n\nBefore [sc_loser.GetFirstNameNoTooltip] can bring [sc_loser.GetHerHis] secondary weapon to bear, I swing my own [sc_victor.Custom('signature_weapon')] round to [sc_victor.Custom2('SignatureWeaponKillTypeTorso2ThirdPersonSimplePresentGendered',SCOPE.sC('sc_loser'))]. [sc_loser.GetHerHis|U] battered body is hurled backwards, spasming and bleeding into the [sc_defender.Custom('GroundType')].\n\nWithin the minute, all movement stops."
 single_combat.0041.desc.opponent_response.POD_bite.fatality: "Và nó trúng đích, mùi máu say lòng người lan tỏa trong không khí. Chẳng mấy chốc chúng khuất phục trước nụ hôn này và hương vị chiến thắng ngọt ngào của ta là một hương vị đẫm máu."
 single_combat.0041.desc.opponent_response.POD_blood_surge.fatality: "Ta có thể thấy mình đứng cao hơn và mạnh mẽ hơn, được sức mạnh của máu tiếp thêm sinh lực. Ta nhanh chóng thừa thế tấn công và kết liễu trận đấu bằng một nhát cắt nhanh vào cổ. Cái đầu bại trận lăn đi, chỉ dừng lại khi va vào chân ta."
 single_combat.0041.desc.opponent_response.POD_blood_heal.fatality: "Mọi vết thương của ta biến mất trước mắt khi sức mạnh của máu chữa lành cho ta. Ta nhanh chóng thừa thế tấn công và kết liễu trận đấu bằng một nhát cắt nhanh vào cổ. Cái đầu bại trận lăn đi, chỉ dừng lại khi va vào chân ta."
 single_combat.0041.desc.opponent_response.POD_blink.fatality: "Và chúng chẳng có gì cả, đòn tấn công dồn dập của ta chỉ dừng lại khi chỉ còn lại tro tàn trước mắt ta."
 single_combat.0041.desc.opponent_response.POD_lightning_strike.fatality: "Ta làm vậy, kẻ địch của ta chẳng mấy chốc bị đẩy lùi bởi đòn tấn công bất ngờ này. Và lùi nữa... và lùi nữa... cho đến khi không còn nơi nào để rút lui."
 single_combat.0041.desc.opponent_response.POD_split_second.fatality: "Đối thủ của ta chưa chuẩn bị đủ kỹ, và một đòn mạnh giáng xuống, quá nhanh để né tránh bằng cảm nhận thời gian bị bóp méo của chúng. Nó cắt chúng gọn gàng thành hai nửa đối xứng đầy mãn nhãn."
 single_combat.0041.desc.opponent_response.POD_unerring_aim.fatality: "Đối thủ của ta chẳng thể làm gì ngoài chịu trận ngay giữa hai mắt. Ta không kìm được nụ cười đắc thắng khi chúng ngã ngửa ra sau."
 single_combat.0041.desc.opponent_response.POD_lethal_body.fatality: "Đối thủ của ta cảm giác như cả một căn nhà vừa sập xuống người chúng. Khi chúng ngã lùi, ta chiếm được thế thượng phong. Vậy là kết thúc."
 single_combat.0041.desc.opponent_response.POD_brutal_feed.fatality: "Đối thủ của ta không thoát được khỏi vòng ôm chết chóc này. Chẳng mấy chốc chúng khuất phục trước nụ hôn này và hương vị chiến thắng ngọt ngào của ta là một hương vị đẫm máu."
 single_combat.0041.desc.opponent_response.POD_earthshock.fatality: "Đối thủ của ta ngã xuống và ta tận dụng cơ hội này để tấn công tàn bạo. Chúng không né được đòn nhắm vào cổ."
 single_combat.0041.desc.opponent_response.POD_fist_of_caine.fatality: "Cơn bão này như những lưỡi dao đâm vào da chúng, cắt xẻ những mảng lớn thịt bất tử theo từng cử động. Cho đến khi chỉ còn lại một bộ xương. Rồi chỉ còn tro bụi."
 single_combat.0041.desc.opponent_response.POD_toughness.fatality: "Dường như chẳng có gì có thể xuyên thủng hàng phòng thủ của ta. Đối thủ của ta kiệt sức khi cố gắng phá vỡ nó. Đòn phản công của ta nhanh và chí mạng."
 single_combat.0041.desc.opponent_response.POD_flesh_of_marble.fatality: "Dường như chẳng có gì có thể xuyên thủng hàng phòng thủ của ta. Đối thủ của ta kiệt sức khi cố gắng phá vỡ nó. Đòn phản công của ta nhanh và chí mạng."
 single_combat.0041.desc.opponent_response.POD_prowess_from_pain.fatality: "Được tiếp sức bởi năng lực khủng khiếp này, ta giáng một đòn mạnh khiến ruột gan kẻ địch của ta nổ tung thành một mớ hỗn độn đẫm máu."
 single_combat.0041.desc.opponent_response.POD_feral_weapons.fatality: "Và điều đó xảy ra, khi đối thủ của ta không tránh được một đòn chém chí mạng lao tới."
 single_combat.0041.desc.opponent_response.POD_shapechange.fatality: "Bất ngờ trước sự biến đổi đột ngột này, đối thủ của ta bị trúng đòn và phải điên cuồng đẩy lùi con quái vật mà ta đã hóa thành. Nhưng vô ích, phần hoang dã đã thắng hiệp này trước phần con người."
 single_combat.0041.desc.opponent_response.POD_vanish.fatality: "Vì thế, đối thủ của ta không thấy đòn tiếp theo lao tới từ phía sau lưng chúng. Và đó là điều cuối cùng chúng còn cảm nhận được."
 single_combat.0041.desc.opponent_response.POD_nocturne.fatality: "Vì thế, đối thủ của ta không thấy đòn tiếp theo lao tới từ phía sau lưng chúng. Và đó là điều cuối cùng chúng còn cảm nhận được."
 single_combat.0041.desc.opponent_response.POD_arms_of_ahriman.fatality: "Đối thủ của ta tránh được một trong số chúng nhưng không tránh được cái thứ hai... khiến chúng bị đẩy trở lại về phía cái đầu tiên. Chiến thắng của ta là một chiến thắng của những xúc tu quật ngã."
 single_combat.0041.desc.opponent_response.POD_the_darkness_within.fatality: "Chúng đột ngột nhảy vào miệng đối thủ của ta, và chỉ vài giây sau, một vụ nổ máu và bóng tối kết thúc trận đấu này."
 single_combat.0041.desc.opponent_response.POD_aegis_of_shadows.fatality: "Dường như chẳng có gì có thể xuyên thủng hàng phòng thủ của ta. Đối thủ của ta kiệt sức khi cố gắng phá vỡ nó. Đòn phản công của ta nhanh và chí mạng."
 single_combat.0041.desc.opponent_response.POD_compel.fatality: "Nó bắt kẻ địch của ta không kịp đề phòng, và ta tận dụng sự mất tập trung này để cắt cổ chúng gọn gàng."
 single_combat.0041.desc.opponent_response.POD_terminal_decree.fatality: "Chúng ngoan ngoãn làm vậy, hết lần này đến lần khác. Ta bật cười độc ác khi kẻ địch cũ của ta tự đánh mình đến chết."
 single_combat.0041.desc.opponent_response.POD_daunt.fatality: "Nó bắt kẻ địch của ta không kịp đề phòng, và ta thừa thế tấn công cho đến khi không còn gì để tấn công nữa."
 single_combat.0041.desc.opponent_response.POD_dread_gaze.fatality: "Nó bắt kẻ địch của ta không kịp đề phòng, và ta thừa thế tấn công cho đến khi không còn gì để tấn công nữa."
 single_combat.0041.desc.opponent_response.POD_extinguish_vitae.fatality: "Vì thế, đối thủ của ta đột nhiên cảm thấy yếu đi hẳn và Con Thú đang gầm gừ trong niềm hân hoan chiến thắng dự đoán trước. Ta lao tới và đấm xuyên qua tim để tung đòn kết liễu."
 single_combat.0041.desc.opponent_response.POD_scorpions_touch.fatality: "Bị trúng đòn này, kẻ địch của ta cảm thấy khó chịu và cử động của chúng trở nên chậm chạp. Ta ban cho chúng một cái chết nhân từ và giết chúng bằng một đòn nhanh gọn thay vì nụ hôn chậm rãi của nọc độc."
 single_combat.0041.desc.opponent_response.POD_theft_of_vitae.fatality: "Kẻ địch của ta bất lực không thể ngăn cản, dòng máu quý giá của chúng giờ thuộc về ta! Và không có máu, một ma cà rồng chỉ là tro bụi. Điều đó chẳng mấy chốc được chứng minh trước mắt ta."
 single_combat.0041.desc.opponent_response.POD_baals_curse.fatality: "Bị trúng đòn này, kẻ địch của ta cảm thấy khó chịu và cử động của chúng trở nên chậm chạp. Ta ban cho chúng một cái chết nhân từ và giết chúng bằng một đòn nhanh gọn thay vì nụ hôn chậm rãi của nọc độc."
 single_combat.0041.desc.opponent_response.POD_cauldron_of_blood.fatality: "Nó bỏng rát, nó bỏng rát! Thật là một đống lửa dễ chịu để ngắm nhìn cho thay đổi không khí."
 single_combat.0041.desc.opponent_response.POD_touch_of_oblivion.fatality: "Máu của đối thủ ta đột nhiên hòa lẫn với những bóng tối hung hãn đang cố chiếm quyền kiểm soát. Một khi mọi giọt máu đã bị dập tắt, những bóng tối ngoan ngoãn biến mất."
 single_combat.0041.desc.opponent_response.POD_stygian_shroud.fatality: "Vì thế, đối thủ của ta không thấy đòn tiếp theo lao tới từ phía sau lưng chúng. Và đó là điều cuối cùng chúng còn cảm nhận được."
 single_combat.0041.desc.opponent_response.POD_fire_torch.fatality: "Đòn tấn công đáng thương của đối thủ ta sau đó bị đáp trả bằng một đòn ra tay bậc thầy. Chúng sẽ không hồi phục sau đòn này."
 single_combat.0041.desc.opponent_response.POD_fire_bombs.fatality: "Chúng không dễ dàng né được cú đấm vào mặt tiếp theo. Hay cú tiếp theo nữa, cho đến khi đầu chúng rơi khỏi vai."
 single_combat.0041.desc.opponent_response.POD_fire_spewer.fatality: "Đòn tấn công tiếp theo của ta chính xác hơn nhiều. Đó là một nhát chém đầu gọn gàng và mãn nhãn."
 single_combat.0041.desc.opponent_response.POD_crossbow_shot.fatality: "Đòn tấn công tiếp theo của ta chính xác hơn nhiều. Đó là một nhát chém đầu gọn gàng và mãn nhãn."
 single_combat.0041.desc.opponent_response.POD_unleash_dogs.fatality: "Ta ném một trong những con chó của chúng vào chúng để trả đũa. Chúng bắt lấy con chó theo phản xạ, cho ta đủ thời gian để tung ra một đòn chí mạng."
 single_combat.0041.desc.opponent_response.POD_stake_attack.fatality: "Chúng không dễ dàng né được cú đấm vào mặt tiếp theo. Hay cú tiếp theo nữa, cho đến khi đầu chúng rơi khỏi vai."
 single_combat.0041.desc.opponent_response.POD_oculi_trust.fatality: "Chúng nhanh chóng bị đẩy lùi bởi đợt tấn công không ngừng nghỉ của ta. Bị dồn vào chân tường, chúng ngã xuống đất, bất lực."
 single_combat.0041.desc.opponent_response.POD_oculi_wine.fatality: "Chúng không dễ dàng né được cú đấm vào mặt tiếp theo. Hay cú tiếp theo nữa, cho đến khi đầu chúng rơi khỏi vai."
 single_combat.0041.desc.opponent_response.POD_acre_catechumen.fatality: "Đòn phản công của ta bắt chúng không kịp đề phòng và trúng đích. Cái kết đến trong một tia sáng của thép."
 single_combat.0041.desc.opponent_response.POD_acre_flesh.fatality: "Nó gây đau đớn khá nhiều. Đủ để làm chúng mất tập trung khỏi đòn tiếp theo. Đòn này không gây đau lâu."
 single_combat.0041.desc.opponent_response.POD_acre_flight.fatality: "Hoặc thậm chí áp đảo chúng, khi ta đẩy chúng lùi lại. Và lùi nữa. Cho đến khi không còn nơi nào để đi."
 single_combat.0041.desc.opponent_response.POD_acre_auto.fatality: "Chúng không dễ dàng né được cú đấm vào mặt tiếp theo. Hay cú tiếp theo nữa, cho đến khi đầu chúng rơi khỏi vai."
 single_combat.0041.desc.opponent_response.POD_murnau_mirror.fatality: "Chúng bị đẩy lùi, chật vật theo kịp. Vượt quá tầm với của chúng!"
 single_combat.0041.desc.opponent_response.POD_murnau_arcana.fatality: "Cái này nổ ngay trước mặt chúng. Rồi làm nổ tung cả khuôn mặt chúng luôn."
 single_combat.0041.desc.opponent_response.POD_sisters_hosanna.fatality: "Đòn phản công của ta bắt chúng không kịp đề phòng và trúng đích. Cái kết đến trong một tia sáng của thép."
 single_combat.0041.desc.opponent_response.POD_sisters_oratorio.fatality: "Đòn phản công của ta bắt chúng không kịp đề phòng và trúng đích. Cái kết đến trong một tia sáng của thép."
 single_combat.0041.desc.opponent_response.POD_bone_obedience.fatality: "Chúng bị đẩy lùi, chật vật theo kịp. Vượt quá tầm với của chúng!"
 single_combat.0041.desc.opponent_response.POD_five_poison_cloud.fatality: "Chúng không dễ dàng né được cú đấm vào mặt tiếp theo. Hay cú tiếp theo nữa, cho đến khi đầu chúng rơi khỏi vai."
 single_combat.0041.desc.opponent_response.POD_ching_shih.fatality: "Chúng bị thương, nhưng vẫn đứng vững. Cho đến khi không còn nữa. Nó kết thúc như cách nó bắt đầu, trong bóng tối."
 single_combat.0041.desc.opponent_response.POD_long_neck.fatality: "Ta không, và đối thủ của ta bị thương. Đủ nặng để phần còn lại của trận đấu trở thành một kết cục chắc chắn."
 single_combat.0041.desc.opponent_response.POD_bloodlash.fatality: "Trước khi trúng đích bằng một đòn nhanh gây thương tích cho chúng. Đủ nặng để phần còn lại của trận đấu trở thành một kết cục đã định trước."
 single_combat.0041.desc.opponent_response.POD_goblin_scorch.fatality: "Chúng không dễ dàng né được cú đấm vào mặt tiếp theo. Hay cú tiếp theo nữa, cho đến khi đầu chúng rơi khỏi vai."
 single_combat.0041.desc.opponent_response.POD_goblin_lantern.fatality: "Ta sau đó phản công bằng một đòn mạnh. Đầu chúng không thích điều đó, và quyết định rơi xuống sàn để phản đối."
 single_combat.0041.desc.opponent_response.POD_bone_dance.fatality: "Ta sau đó phản công bằng một đòn mạnh. Đầu chúng không thích điều đó, và quyết định rơi xuống sàn để phản đối."
 single_combat.0041.desc.opponent_response.POD_dragon_dance.fatality: "Chúng bị đẩy lùi, chật vật theo kịp. Vượt quá tầm với của chúng!"
 single_combat.0041.desc.opponent_response.POD_chi_interrupt.fatality: "Ta sau đó phản công bằng một đòn mạnh. Đầu chúng không thích điều đó, và quyết định rơi xuống sàn để phản đối."
 single_combat.0041.desc.opponent_response.POD_thousand_hell_stare.fatality: "Ta sau đó phản công bằng một đòn mạnh. Đầu chúng không thích điều đó, và quyết định rơi xuống sàn để phản đối."
 single_combat.0041.desc.opponent_response.POD_wind_attack.fatality: "Chúng bị đẩy lùi, chật vật theo kịp. Vượt quá tầm với của chúng!"
 single_combat.0041.desc.opponent_response.POD_demon_claws.fatality: "Chúng bị thương, nhưng vẫn đứng vững. Cho đến khi không còn nữa. Nó kết thúc như cách nó bắt đầu, trong bóng tối."
 single_combat.0041.desc.opponent_response.POD_tormented_essence.fatality: "Ta sau đó phản công bằng một đòn mạnh. Đầu chúng không thích điều đó, và quyết định rơi xuống sàn để phản đối."
