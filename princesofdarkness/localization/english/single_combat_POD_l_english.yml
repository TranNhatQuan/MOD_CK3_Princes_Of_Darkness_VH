 single_combat.0041.desc.sc_attacker.POD_feral_taunt.injury: "Ta khiêu khích đối thủ, làm phân tâm [my_foe.GetHerHim], rồi tấn công, làm [my_foe.GetHerHim] bị thương."
 single_combat.0041.desc.sc_attacker.POD_feral_evasion.injury: "Ta né tránh đòn tấn công của đối thủ, xuyên phá [my_foe.GetHerHis] hàng phòng thủ và làm [my_foe.GetHerHim] bị thương."
 single_combat.0041.desc.sc_attacker.POD_jaw_lock.injury: "Ta khóa chân đối thủ, làm [my_foe.GetHerHim] bị thương."
 single_combat.0041.desc.sc_attacker.POD_hamstring.injury: "Ta cắn vào tứ chi kẻ địch, làm [my_foe.GetHerHim] bị thương."
 single_combat.0041.desc.sc_attacker.POD_leaping_rake.injury: "Ta lao vào đối thủ, làm [my_foe.GetHerHim] bị thương."
 single_combat.0041.desc.sc_attacker.POD_wishbone.injury: "Ta gây sát thương cho kẻ địch, cố xé toạc [my_foe.GetHerHim] ra."
 single_combat.0041.desc.sc_attacker.POD_manipulate_inertia.injury: "Và họ chẳng còn gì, chẳng mấy chốc chỉ còn cách chật vật hồi phục sau đợt tấn công dồn dập của ta."
 single_combat.0041.desc.sc_attacker.POD_manipulate_acceleration.injury: "Và họ chẳng còn gì, chẳng mấy chốc chỉ còn cách chật vật hồi phục sau đợt tấn công dồn dập của ta."
 single_combat.0041.desc.sc_attacker.POD_manipulate_cohesion.injury: "Và họ chẳng còn gì, chẳng mấy chốc chỉ còn cách chật vật hồi phục sau đợt tấn công dồn dập của ta."
 single_combat.0041.desc.sc_attacker.POD_dragons_breath.injury: "[sc_loser.GetSheHe|U] né tránh, nhưng hơi muộn. Ngọn lửa táp vào mạn sườn [sc_loser.GetHerHim], và đối thủ của ta không còn lựa chọn nào khác ngoài việc xin hàng trước khi hơi thở tiếp theo của ta gây thêm thiệt hại."
 single_combat.0041.desc.sc_attacker.POD_bark_mudpuppy.injury: "[sc_loser.GetSheHe|U] nghiến chặt răng [sc_loser.GetHerHis] khi các vết thương mở ra khắp làn da [sc_loser.GetHerHis], và khoảnh khắc mất tập trung đó đủ để ta kề vũ khí vào cổ họng [sc_loser.GetHerHis]."
 single_combat.0041.desc.sc_attacker.POD_clap_of_thunder.injury: "[sc_loser.GetSheHe|U] không kháng cự khi ta tước vũ khí của [sc_loser.GetHerHim] và đưa trận đấu này đến một kết thúc chóng vánh."
 single_combat.0041.desc.sc_attacker.POD_dragon_slash.injury: "[sc_loser.GetSheHe|U] chẳng mấy chốc bị dồn vào thế bí và không kháng cự, ngay cả khi ta lao vào vật lộn và quật ngã [sc_loser.GetHerHis] xuống sàn. Ta đã thắng."


#Aggressor Won, Own Combat Move Fatality
#Example: "sailing through [sc_loser.GetHerHis] guard and straight into [sc_loser.GetHerHis] chest.\n\n[sc_loser.GetFirstNameNoTooltip] staggers back, my off-hand dagger pulling loose as [sc_loser.GetSheHe] does, spraying gore and fragments of bone all over the floor.\n\n[sc_loser.GetSheHe|U] bleeds out quickly, though not exactly painlessly."
 single_combat.0041.desc.sc_attacker.POD_bite.fatality: "Và nó trúng đích, hương máu say lòng lan tỏa trong không khí. Họ chẳng mấy chốc gục ngã trước nụ hôn ấy, và hương vị ngọt ngào của chiến thắng ta có được đẫm máu."
 single_combat.0041.desc.sc_attacker.POD_blood_surge.fatality: "Ta thấy mình cao lớn và mạnh mẽ hơn, được máu tiếp thêm sức mạnh. Ta nhanh chóng thừa thế tấn công và kết liễu trận đấu bằng một nhát cắt nhanh vào cổ. Cái đầu đã gục ngã lăn đi, chỉ dừng lại khi va vào chân ta."
 single_combat.0041.desc.sc_attacker.POD_blood_heal.fatality: "Mọi vết thương của ta biến mất trước mắt khi sức mạnh của máu chữa lành cho ta. Ta nhanh chóng thừa thế tấn công và kết liễu trận đấu bằng một nhát cắt nhanh vào cổ. Cái đầu đã gục ngã lăn đi, chỉ dừng lại khi va vào chân ta."
 single_combat.0041.desc.sc_attacker.POD_blink.fatality: "Và họ chẳng còn gì, đợt tấn công dồn dập của ta chỉ dừng lại khi trước mặt ta chỉ còn lại tro tàn."
 single_combat.0041.desc.sc_attacker.POD_lightning_strike.fatality: "Ta làm vậy, kẻ địch của ta chẳng mấy chốc bị đẩy lùi bởi đòn tấn công bất ngờ này. Và lùi nữa... và lùi nữa... cho đến khi không còn nơi nào để rút lui."
 single_combat.0041.desc.sc_attacker.POD_split_second.fatality: "Đối thủ của ta chưa kịp chuẩn bị đủ, và một đòn mạnh giáng xuống, quá nhanh để né tránh bởi cảm nhận thời gian méo mó của họ. Nó xẻ đôi họ thành hai nửa cân đối đến dễ chịu."
 single_combat.0041.desc.sc_attacker.POD_unerring_aim.fatality: "Đối thủ của ta chẳng thể làm gì ngoài việc chịu trận trúng ngay giữa hai mắt. Ta không kìm được nụ cười đắc thắng khi họ ngã ngửa ra sau."
 single_combat.0041.desc.sc_attacker.POD_lethal_body.fatality: "Đối thủ của ta cảm giác như cả một căn nhà sụp đổ đè lên người họ. Khi họ ngã lùi lại, ta chiếm được thế cao. Vậy là kết thúc."
 single_combat.0041.desc.sc_attacker.POD_brutal_feed.fatality: "Đối thủ của ta không thể thoát khỏi cái ôm chết chóc này. Họ chẳng mấy chốc gục ngã trước nụ hôn ấy, và hương vị ngọt ngào của chiến thắng ta có được đẫm máu."
 single_combat.0041.desc.sc_attacker.POD_earthshock.fatality: "Đối thủ của ta ngã xuống và ta tận dụng cơ hội này để tấn công tàn bạo. Họ không tránh được đòn nhắm vào cổ."
 single_combat.0041.desc.sc_attacker.POD_fist_of_caine.fatality: "Cơn bão này như những lưỡi dao trên da thịt họ, cắt xẻ những mảng lớn thịt da bất tử với mỗi chuyển động. Cho đến khi chỉ còn lại bộ xương. Rồi chỉ còn tro tàn."
 single_combat.0041.desc.sc_attacker.POD_toughness.fatality: "Dường như chẳng có gì có thể xuyên thủng hàng phòng thủ của ta. Đối thủ của ta kiệt sức khi cố xuyên phá. Đòn phản công của ta nhanh và chí mạng."
 single_combat.0041.desc.sc_attacker.POD_flesh_of_marble.fatality: "Dường như chẳng có gì có thể xuyên thủng hàng phòng thủ của ta. Đối thủ của ta kiệt sức khi cố xuyên phá. Đòn phản công của ta nhanh và chí mạng."
 single_combat.0041.desc.sc_attacker.POD_prowess_from_pain.fatality: "Được tiếp sức bởi năng lực khủng khiếp này, ta giáng một đòn mạnh khiến nội tạng kẻ địch của ta nổ tung thành một mớ hỗn độn đẫm máu."
 single_combat.0041.desc.sc_attacker.POD_feral_weapons.fatality: "Và nó xảy ra, khi đối thủ của ta không thể tránh được một cú vụt chí mạng nhắm vào họ."
 single_combat.0041.desc.sc_attacker.POD_shapechange.fatality: "Bất ngờ trước sự biến đổi đột ngột này, đối thủ của ta bị đánh trúng và phải điên cuồng đẩy lùi con quái vật mà ta đã hóa thân. Nhưng vô ích, sự hoang dã đã thắng con người trong hiệp này."
 single_combat.0041.desc.sc_attacker.POD_vanish.fatality: "Vì vậy, đối thủ của ta không thấy đòn tiếp theo ập đến từ phía sau lưng họ. Và đó là điều cuối cùng họ còn cảm nhận được."
 single_combat.0041.desc.sc_attacker.POD_nocturne.fatality: "Vì vậy, đối thủ của ta không thấy đòn tiếp theo ập đến từ phía sau lưng họ. Và đó là điều cuối cùng họ còn cảm nhận được."
 single_combat.0041.desc.sc_attacker.POD_arms_of_ahriman.fatality: "Đối thủ của ta né được một trong số chúng nhưng không né được cái thứ hai... thứ đẩy họ quay lại về phía cái đầu tiên. Chiến thắng của ta là một trận những xúc tu quật đập."
 single_combat.0041.desc.sc_attacker.POD_the_darkness_within.fatality: "Chúng đột ngột nhảy vào miệng đối thủ của ta, và chỉ vài giây sau, một vụ nổ máu và bóng tối kết thúc trận đấu này."
 single_combat.0041.desc.sc_attacker.POD_aegis_of_shadows.fatality: "Dường như chẳng có gì có thể xuyên thủng hàng phòng thủ của ta. Đối thủ của ta kiệt sức khi cố xuyên phá. Đòn phản công của ta nhanh và chí mạng."
 single_combat.0041.desc.sc_attacker.POD_compel.fatality: "Nó khiến kẻ địch của ta mất cảnh giác, và ta tận dụng sự phân tâm này để cắt cổ họ gọn gàng."
 single_combat.0041.desc.sc_attacker.POD_terminal_decree.fatality: "Điều mà họ ngoan ngoãn làm theo, hết lần này đến lần khác. Ta bật cười độc ác khi kẻ từng là địch thủ của ta tự đập chết chính mình."
 single_combat.0041.desc.sc_attacker.POD_daunt.fatality: "Nó khiến kẻ địch của ta mất cảnh giác, và ta thừa thế tấn công cho đến khi chẳng còn gì để tấn công nữa."
 single_combat.0041.desc.sc_attacker.POD_dread_gaze.fatality: "Nó khiến kẻ địch của ta mất cảnh giác, và ta thừa thế tấn công cho đến khi chẳng còn gì để tấn công nữa."
 single_combat.0041.desc.sc_attacker.POD_extinguish_vitae.fatality: "Vì vậy, đối thủ của ta đột nhiên cảm thấy yếu đi hẳn và Dã Thú đang gầm gừ trong niềm hân hoan chiến thắng đã dự đoán trước. Ta lao tới và đấm xuyên qua tim để kết liễu."
 single_combat.0041.desc.sc_attacker.POD_scorpions_touch.fatality: "Bị trúng đòn, kẻ địch của ta cảm thấy khó chịu và cử động chậm chạp hẳn đi. Ta ban cho họ một cái chết nhân đạo và giết họ bằng một đòn nhanh gọn thay vì nụ hôn chậm rãi của chất độc."
 single_combat.0041.desc.sc_attacker.POD_theft_of_vitae.fatality: "Kẻ địch của ta bất lực không thể ngăn cản, dòng máu quý giá của họ giờ là của ta! Và không có máu, một ma cà rồng chỉ là tro bụi. Điều này chẳng mấy chốc được chứng minh ngay trước mắt ta."
 single_combat.0041.desc.sc_attacker.POD_baals_curse.fatality: "Bị trúng đòn, kẻ địch của ta cảm thấy khó chịu và cử động chậm chạp hẳn đi. Ta ban cho họ một cái chết nhân đạo và giết họ bằng một đòn nhanh gọn thay vì nụ hôn chậm rãi của chất độc."
 single_combat.0041.desc.sc_attacker.POD_cauldron_of_blood.fatality: "Nó bỏng rát, nó bỏng rát! Thật là một đống lửa dễ chịu để chiêm ngưỡng cho đổi gió."
 single_combat.0041.desc.sc_attacker.POD_touch_of_oblivion.fatality: "Máu của đối thủ ta đột nhiên trộn lẫn với những bóng tối hung hãn đang cố chiếm quyền kiểm soát. Khi từng giọt máu cuối cùng đã bị dập tắt, bóng tối ngoan ngoãn biến mất."
 single_combat.0041.desc.sc_attacker.POD_stygian_shroud.fatality: "Vì vậy, đối thủ của ta không thấy đòn tiếp theo ập đến từ phía sau lưng họ. Và đó là điều cuối cùng họ còn cảm nhận được."
 single_combat.0041.desc.sc_attacker.POD_fire_torch.fatality: "Đòn tấn công đáng thương của đối thủ ta sau đó bị phản công bằng một đòn tuyệt kỹ. Họ sẽ không hồi phục sau đòn này."
 single_combat.0041.desc.sc_attacker.POD_fire_bombs.fatality: "Họ không dễ dàng né được cú đấm vào mặt tiếp theo dù vậy. Hay cú tiếp theo nữa, cho đến khi đầu họ rơi khỏi vai."
 single_combat.0041.desc.sc_attacker.POD_fire_spewer.fatality: "Đòn tiếp theo của ta chính xác hơn nhiều dù vậy. Đó là một nhát chém đầu gọn gàng và thỏa mãn."
 single_combat.0041.desc.sc_attacker.POD_crossbow_shot.fatality: "Đòn tiếp theo của ta chính xác hơn nhiều dù vậy. Đó là một nhát chém đầu gọn gàng và thỏa mãn."
 single_combat.0041.desc.sc_attacker.POD_unleash_dogs.fatality: "Ta ném một trong những con chó của họ vào họ để trả đũa. Họ bắt lấy nó theo phản xạ, cho ta nhiều thời gian hơn đủ để tung một đòn chí mạng."
 single_combat.0041.desc.sc_attacker.POD_stake_attack.fatality: "Họ không dễ dàng né được cú đấm vào mặt tiếp theo dù vậy. Hay cú tiếp theo nữa, cho đến khi đầu họ rơi khỏi vai."
 single_combat.0041.desc.sc_attacker.POD_oculi_trust.fatality: "Họ nhanh chóng bị đẩy lùi bởi cuộc tấn công không ngừng nghỉ của ta. Bị dồn vào góc, họ ngã xuống đất, bất lực."
 single_combat.0041.desc.sc_attacker.POD_oculi_wine.fatality: "Họ không dễ dàng né được cú đấm vào mặt tiếp theo dù vậy. Hay cú tiếp theo nữa, cho đến khi đầu họ rơi khỏi vai."
 single_combat.0041.desc.sc_attacker.POD_acre_catechumen.fatality: "Đòn phản công của ta khiến họ mất cảnh giác và trúng đích. Kết cục đến trong một ánh chớp thép."
 single_combat.0041.desc.sc_attacker.POD_acre_flesh.fatality: "Nó đau lắm. Đủ để khiến họ mất tập trung trước đòn tiếp theo. Đòn này không đau lâu."
 single_combat.0041.desc.sc_attacker.POD_acre_flight.fatality: "Hay thậm chí vượt qua họ, khi ta đẩy lùi họ. Và lùi nữa. Cho đến khi chẳng còn nơi nào để đi."
 single_combat.0041.desc.sc_attacker.POD_acre_auto.fatality: "Họ không dễ dàng né được cú đấm vào mặt tiếp theo dù vậy. Hay cú tiếp theo nữa, cho đến khi đầu họ rơi khỏi vai."
 single_combat.0041.desc.sc_attacker.POD_murnau_mirror.fatality: "Họ bị đẩy lùi, chật vật theo kịp. Vượt quá tầm với của họ rồi!"
 single_combat.0041.desc.sc_attacker.POD_murnau_arcana.fatality: "Cái này nổ ngay trước mặt họ. Rồi làm nổ tung luôn khuôn mặt họ."
 single_combat.0041.desc.sc_attacker.POD_sisters_hosanna.fatality: "Đòn phản công của ta khiến họ mất cảnh giác và trúng đích. Kết cục đến trong một ánh chớp thép."
 single_combat.0041.desc.sc_attacker.POD_sisters_oratorio.fatality: "Đòn phản công của ta khiến họ mất cảnh giác và trúng đích. Kết cục đến trong một ánh chớp thép."
 single_combat.0041.desc.sc_attacker.POD_bone_obedience.fatality: "Họ bị đẩy lùi, chật vật theo kịp. Vượt quá tầm với của họ rồi!"
 single_combat.0041.desc.sc_attacker.POD_five_poison_cloud.fatality: "Họ không dễ dàng né được cú đấm vào mặt tiếp theo dù vậy. Hay cú tiếp theo nữa, cho đến khi đầu họ rơi khỏi vai."
 single_combat.0041.desc.sc_attacker.POD_ching_shih.fatality: "Họ bị thương, nhưng vẫn đứng vững. Cho đến khi không còn nữa. Nó kết thúc như cách nó bắt đầu, trong bóng tối."
 single_combat.0041.desc.sc_attacker.POD_long_neck.fatality: "Ta không né, và đối thủ của ta bị thương. Đủ nặng để phần còn lại của trận đấu là một kết cục chắc chắn."
 single_combat.0041.desc.sc_attacker.POD_bloodlash.fatality: "Trước khi tiếp đất bằng một đòn nhanh khiến họ bị thương. Đủ nặng để phần còn lại của trận đấu là một kết luận báo trước."
 single_combat.0041.desc.sc_attacker.POD_goblin_scorch.fatality: "Họ không dễ dàng né được cú đấm vào mặt tiếp theo dù vậy. Hay cú tiếp theo nữa, cho đến khi đầu họ rơi khỏi vai."
 single_combat.0041.desc.sc_attacker.POD_goblin_lantern.fatality: "Ta sau đó phản công bằng một đòn mạnh. Đầu họ không thích điều đó, và quyết định rơi xuống sàn để phản đối."
 single_combat.0041.desc.sc_attacker.POD_bone_dance.fatality: "Ta sau đó phản công bằng một đòn mạnh. Đầu họ không thích điều đó, và quyết định rơi xuống sàn để phản đối."
