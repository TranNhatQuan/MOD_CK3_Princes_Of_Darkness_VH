 single_combat.0031.desc.sc_attacker.POD_stand_upon_the_dragons_back.fatality: "Ta bị đẩy lùi, chật vật theo kịp. Cuộc đấu không kéo dài lâu sau đó, ta hoàn toàn lép vế."
 single_combat.0031.desc.sc_attacker.POD_dragon_ward.fatality: "Ta bị đẩy lùi, chật vật theo kịp. Cuộc đấu không kéo dài lâu sau đó, ta hoàn toàn lép vế."
 single_combat.0031.desc.sc_attacker.POD_typhonic_maw.fatality: "Một đòn đánh ngang qua cái vật cồng kềnh đó nhanh chóng để hở hệ phòng thủ của ta. Rồi để hở toàn bộ cơ thể ta khi ta không thể phản ứng đủ nhanh."
 single_combat.0031.desc.sc_attacker.POD_cobra_fangs.fatality: "Đối thủ ta nhanh chóng nắm lấy chiếc răng nanh vô hại nhưng vẫn đang chìa ra của ta và bóp nát nó trong tay họ. Ta sau đó không thể phản ứng đủ nhanh để tránh việc họ bóp nát cả đầu ta trong tay."
 single_combat.0031.desc.sc_attacker.POD_snout_strike.fatality: "Đối thủ ta nhanh chóng nắm lấy mõm của ta. Ta sau đó không thể phản ứng đủ nhanh để tránh việc họ bóp nát cả đầu ta trong tay."
 single_combat.0031.desc.sc_attacker.POD_chi_breaker.fatality: "Ta bị thương, nhưng vẫn đứng vững. Cho đến khi không còn nữa. Nó kết thúc như cách nó bắt đầu, trong bóng tối."
