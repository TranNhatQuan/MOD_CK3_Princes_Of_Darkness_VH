 single_combat.0031.desc.opponent_response.POD_murnau_arcana.fatality: "Bất ngờ, phản ứng ngược từ nó là một đòn chí mạng và nổ tung vào mặt ta. Và cũng nổ tung mặt ta luôn."
 single_combat.0031.desc.opponent_response.POD_sisters_hosanna.fatality: "Đòn đánh tiếp theo giáng vào ta là một đòn chí mạng. Ta không có cơ hội nào."
 single_combat.0031.desc.opponent_response.POD_sisters_oratorio.fatality: "Vì vậy, ta không thể tránh được đòn tấn công tiếp theo đang lao tới. Và đòn kế tiếp. Và... cho đến khi chẳng còn gì để thấy nữa."
 single_combat.0031.desc.opponent_response.POD_bone_obedience.fatality: "Ta không thể phá vỡ lớp phòng thủ của đối thủ, và đòn phản công là một đòn chí mạng. Ta không có cơ hội nào."
 single_combat.0031.desc.opponent_response.POD_five_poison_cloud.fatality: "Ta bị nhấn chìm trong nó, và chết trong một cơn ho độc địa khi bò lết trên sàn."
 single_combat.0031.desc.opponent_response.POD_ching_shih.fatality: "Nhanh hơn, cường tráng hơn và mạnh mẽ hơn ta, ta bị áp đảo. Và nhanh chóng bị kết liễu bằng một đòn dứt khoát không thương tiếc."
 single_combat.0031.desc.opponent_response.POD_long_neck.fatality: "Vì vậy, ta không thể tránh được đòn tấn công tiếp theo đang lao tới. Và đòn kế tiếp. Và... cho đến khi chẳng còn gì để thấy nữa."
 single_combat.0031.desc.opponent_response.POD_bloodlash.fatality: "Ta bất ngờ trước nó, và nhanh chóng bị đánh bật lùi bởi trận công kích. Kẻ địch ta nắm lấy cơ hội, và đầu ta chẳng mấy chốc lăn lóc trên sàn."
 single_combat.0031.desc.opponent_response.POD_goblin_scorch.fatality: "Ta bị nhấn chìm trong nó, và chết trong một địa ngục rực lửa."
 single_combat.0031.desc.opponent_response.POD_goblin_lantern.fatality: "Ta bị nhấn chìm trong nó, và chết trong một địa ngục rực lửa."
 single_combat.0031.desc.opponent_response.POD_bone_dance.fatality: "Vì vậy, ta không thể tránh được đòn tấn công tiếp theo đang lao tới. Và đòn kế tiếp. Và... cho đến khi chẳng còn gì để thấy nữa."
 single_combat.0031.desc.opponent_response.POD_dragon_dance.fatality: "Nhanh hơn, cường tráng hơn và mạnh mẽ hơn ta, ta bị áp đảo. Và nhanh chóng bị kết liễu bằng một đòn dứt khoát không thương tiếc."
 single_combat.0031.desc.opponent_response.POD_chi_interrupt.fatality: "Ta bị trúng một đòn, hai đòn rồi ba đòn... khi máu ngừng chảy trong huyết quản, ta tê liệt hoàn toàn. Đối thủ ta không mất nhiều thời gian để kết thúc nỗi thống khổ của ta."
 single_combat.0031.desc.opponent_response.POD_thousand_hell_stare.fatality: "Trong trạng thái tâm trí khó khăn này, ta không thể tự vệ đúng cách. Đó là một điểm yếu chí mạng, và là điều ta sẽ không phải hối tiếc lâu."
 single_combat.0031.desc.opponent_response.POD_wind_attack.fatality: "Vì vậy, ta không thể tránh được đòn tấn công tiếp theo đang lao tới. Và đòn kế tiếp. Và... cho đến khi chẳng còn gì để thấy nữa."
 single_combat.0031.desc.opponent_response.POD_demon_claws.fatality: "Nhanh hơn, cường tráng hơn và mạnh mẽ hơn ta, ta bị áp đảo. Và nhanh chóng bị kết liễu bằng một đòn dứt khoát không thương tiếc."
 single_combat.0031.desc.opponent_response.POD_tormented_essence.fatality: "Trong trạng thái tâm trí khó khăn này, ta không thể tự vệ đúng cách. Đó là một điểm yếu chí mạng, và là điều ta sẽ không phải hối tiếc lâu."
 single_combat.0031.desc.opponent_response.POD_adramelechs_wrath.fatality: "Nhanh hơn, cường tráng hơn và mạnh mẽ hơn ta, ta bị áp đảo. Và nhanh chóng bị kết liễu bằng một đòn dứt khoát không thương tiếc."
 single_combat.0031.desc.opponent_response.POD_blood_atemi.fatality: "Ta bị trúng một đòn, hai đòn rồi ba đòn... với hệ tuần hoàn rối loạn, ta tê liệt hoàn toàn. Đối thủ ta không mất nhiều thời gian để kết thúc nỗi thống khổ của ta."
 single_combat.0031.desc.opponent_response.POD_stand_upon_the_dragons_back.fatality: "Ta thậm chí không thể đánh trả đối thủ, và đòn phản công là một đòn chí mạng. Ta không có cơ hội nào."
 single_combat.0031.desc.opponent_response.POD_dragon_ward.fatality: "Ta không thể phá vỡ lớp phòng thủ của đối thủ, và đòn phản công là một đòn chí mạng. Ta không có cơ hội nào."
 single_combat.0031.desc.opponent_response.POD_typhonic_maw.fatality: "Hàm Typhon nuốt chửng ta, kết liễu cuộc đời bất tử của ta trong hố axit dạ dày."
 single_combat.0031.desc.opponent_response.POD_cobra_fangs.fatality: "Một chiếc răng nanh độc địa đánh trúng ta. Chất độc nhanh chóng lan vào máu ta, biến nó, rồi biến ta, thành axit. Cái kết của ta nồng nặc mùi lưu huỳnh và vang lên như tiếng cười của đối thủ ta."
 single_combat.0031.desc.opponent_response.POD_snout_strike.fatality: "Một cú tóm vào mõm ta. Ta nhanh chóng bị kết liễu bằng một đòn dứt khoát không thương tiếc."
 single_combat.0031.desc.opponent_response.POD_chi_breaker.fatality: "Đối thủ ta đâm bàn tay vào thân ta, dòng chảy của ta bị rối loạn. Đủ nặng để phần còn lại của trận đấu là một kết cục chắc chắn."
 single_combat.0031.desc.opponent_response.POD_hundred_star_shower.fatality: "Lực va chạm của các phi tiêu nạp Khí lớn hơn nhiều so với bình thường. Ta không có cơ hội nào."
 single_combat.0031.desc.opponent_response.POD_jaw_hammer.fatality: "Hàm ta bị gãy. Sọ ta cũng vậy."
 single_combat.0031.desc.opponent_response.POD_fading_light_strike.fatality: "Sức mạnh của ta bị đánh cắp. Đủ nặng để phần còn lại của trận đấu là một kết cục chắc chắn."
 single_combat.0031.desc.opponent_response.POD_chain_snake.fatality: "Đòn tấn công của ta bị chặn lại, cùng lúc đó, một đầu của sợi xích đánh trúng chỗ hiểm của ta."
 single_combat.0031.desc.opponent_response.POD_twisting_thrust.fatality: "Một vết cắt sâu vào cơ thể ta. Ta không có cơ hội nào."
 single_combat.0031.desc.opponent_response.POD_prone_attacks.fatality: "Ta không thể phá vỡ lớp phòng thủ của đối thủ, và đòn phản công là một đòn chí mạng. Ta không có cơ hội nào."
 single_combat.0031.desc.opponent_response.POD_dagger_claw.fatality: "Nhanh hơn, cường tráng hơn và mạnh mẽ hơn ta, ta bị áp đảo. Và nhanh chóng bị kết liễu bằng một đòn dứt khoát không thương tiếc."
 single_combat.0031.desc.opponent_response.POD_spark_of_ra.fatality: "Quả cầu lửa trúng đích, và tầm nhìn ta tối sầm khi ngọn lửa cháy bùng chiếm lấy mọi giác quan của ta."
 single_combat.0031.desc.opponent_response.POD_deaths_hand.fatality: "Năng lượng linh hồn trúng đích, và tầm nhìn ta tối sầm lại."
 single_combat.0031.desc.opponent_response.POD_ashes_to_ashes.fatality: "Kẻ địch ta niệm một câu thần chú để biến da thịt ta thành tro. Ta sụp đổ khi cảm thấy da thịt mình khô quắt lại."
 single_combat.0031.desc.opponent_response.POD_dust_to_dust.fatality: "Đối thủ ta chạm vào ta. Da thịt ta bắt đầu biến thành đất sét đen. Ta đang chết dần."
 single_combat.0031.desc.opponent_response.POD_khaibits_embrace.fatality: "Vòng ôm của Khaibit nhấn chìm hoàn toàn ta. Giờ đây ta đã bị mắc kẹt."
 single_combat.0031.desc.opponent_response.POD_serqets_sting.fatality: "Ta cảm thấy chất độc thiêu đốt trong huyết quản, và tầm nhìn ta tối sầm lại."
 single_combat.0031.desc.opponent_response.POD_voracious_scarab_of_nyarashahim.fatality: "Con bọ hung đục khoét vào da thịt ta, và chẳng mấy chốc ta cảm thấy nó đang gặm nhấm trái tim mình."
 single_combat.0031.desc.opponent_response.POD_spear_of_anubis.fatality: "Đối thủ ta phá vỡ hàng phòng thủ của ta và hạ gục ta."
 single_combat.0031.desc.opponent_response.POD_feral_clawing.fatality: "Ta cảm thấy đau đớn, khi đối thủ hạ gục ta bằng móng vuốt trần [my_foe.GetHerHis]."
 single_combat.0031.desc.opponent_response.POD_feral_bite.fatality: "Đối thủ ta cắn đứt mặt ta, phá vỡ hàng phòng thủ của ta. Ta ngã xuống."
 single_combat.0031.desc.opponent_response.POD_feral_assault.fatality: "Điên cuồng tấn công ta từ mọi phía, đối thủ ta phá vỡ hàng phòng thủ của ta và hạ gục ta."
 single_combat.0031.desc.opponent_response.POD_feral_taunt.fatality: "Trong khi ta bị phân tâm bởi những lời khiêu khích của kẻ địch, [my_foe.GetSheHe] hạ gục ta."
 single_combat.0031.desc.opponent_response.POD_feral_evasion.fatality: "Né tránh mọi đòn tấn công của ta, kẻ địch xuyên thủng phòng thủ của ta và hạ gục ta."
 single_combat.0031.desc.opponent_response.POD_jaw_lock.fatality: "Trong khi cố khóa chặt chi của ta, đối thủ ta phá vỡ được hàng phòng thủ của ta và hạ gục ta."
 single_combat.0031.desc.opponent_response.POD_hamstring.fatality: "Tấn công vào tứ chi ta, đối thủ ta phá vỡ hàng phòng thủ của ta và hạ gục ta."
 single_combat.0031.desc.opponent_response.POD_leaping_rake.fatality: "Khi ta không thể né tránh cú nhảy bổ của đối thủ, [my_foe.GetSheHe] đâm xuyên ta bằng móng vuốt [my_foe.GetHerHis]."
 single_combat.0031.desc.opponent_response.POD_wishbone.fatality: "Áp đảo ta, kẻ địch của ta xé toạc ta."
 single_combat.0031.desc.opponent_response.POD_manipulate_inertia.fatality: "Và ta chẳng có gì cả. Trận công kích không bao giờ dừng lại, ít nhất là không khi ta còn sống."
 single_combat.0031.desc.opponent_response.POD_manipulate_acceleration.fatality: "Và ta chẳng có gì cả. Trận công kích không bao giờ dừng lại, ít nhất là không khi ta còn sống."
 single_combat.0031.desc.opponent_response.POD_manipulate_cohesion.fatality: "Và ta chẳng có gì cả. Trận công kích không bao giờ dừng lại, ít nhất là không khi ta còn sống."
 single_combat.0031.desc.opponent_response.POD_dragons_breath.fatality: "Cơn đau không thể diễn tả nổi khi một biển lửa bao trùm lấy ta và thiêu đốt ta ngay tại chỗ đứng. Điều cuối cùng ta thấy là hình ảnh phản chiếu chập chờn của mình trong đôi mắt loài bò sát vô cảm của [sc_victor.GetFirstNamePossessiveNoTooltip]."
 single_combat.0031.desc.opponent_response.POD_bark_mudpuppy.fatality: "Tiếng ồn xé rách da ta dữ dội đến mức các vết thương mở ra khắp nơi, như thể ta đã bị cắt bằng dao vô số lần. Khi ta nghiến răng chịu đau, [sc_victor.GetFirstNameNoTooltip] lao vào cho đòn kết liễu, và [sc_victor.Custom('signature_weapon')] của [sc_victor.GetHerHis] cắm phập vào cổ họng ta."
 single_combat.0031.desc.opponent_response.POD_clap_of_thunder.fatality: "Ta trở nên mất phương hướng khi tiếng sấm vang khiến tai ta ù đi và tầm nhìn chao đảo. Không còn nhận thức được xung quanh hay việc đối thủ đang làm gì, mạng sống của ta bị dập tắt không chút thương tiếc."
 single_combat.0031.desc.opponent_response.POD_dragon_slash.fatality: "Ta không có cách nào đáp trả cuộc tấn công dồn dập không ngơi nghỉ của [sc_victor.GetHerHis]. [sc_victor.GetSheHe|U] cứ tiếp tục và tiếp tục, không bao giờ dừng lại, ngay cả khi [sc_victor.GetSheHe] xé tay ta ra, moi ruột ta, và đánh ta đến chết bằng chính xương sống của ta."


#Aggressor Lost, Own Combat Move Feedback
#Example: "Splitting my attention between two strikes proves to have been... ambitious. I'm first aware of the [sc_loser.Custom('signature_weapon')] being ripped from my grasp when my offhand-dagger jerks towards it involuntarily,"
 single_combat.0031.desc.sc_attacker.POD_bite: "Đối thủ của tôi né đòn lao tới của tôi một cách nhẹ nhàng, khiến tôi hoàn toàn hớ hênh trước đòn phản công."
 single_combat.0031.desc.sc_attacker.POD_blood_surge: "Tôi không thể khơi dậy dòng máu bên trong mình vì cần dồn hết sự tập trung để không bị đối thủ vượt mặt."
 single_combat.0031.desc.sc_attacker.POD_blood_heal: "Tôi không thể khơi dậy dòng máu bên trong mình vì cần dồn hết sự tập trung để không bị đối thủ vượt mặt."
 single_combat.0031.desc.sc_attacker.POD_blink: "Đi quá xa quá nhanh, tôi mất vị thế cho hiệp đấu tiếp theo."
 single_combat.0031.desc.sc_attacker.POD_lightning_strike: "Đòn đánh của tôi, tuy nhanh, nhưng thiếu chính xác và trượt mục tiêu."
 single_combat.0031.desc.sc_attacker.POD_split_second: "Bất chấp thời gian bị bóp méo, đối thủ của tôi dường như thích nghi khá tốt."
 single_combat.0031.desc.sc_attacker.POD_unerring_aim: "Một cú nhắm hoàn hảo... nhưng thiếu sức mạnh, chỉ sượt qua mục tiêu."
 single_combat.0031.desc.sc_attacker.POD_lethal_body: "Sức mạnh chẳng là gì nếu thiếu độ chính xác, khi các đòn đánh mạnh mẽ của tôi trượt mục tiêu."
 single_combat.0031.desc.sc_attacker.POD_brutal_feed: "Nanh của tôi suýt trượt khỏi cổ đối thủ, khiến tôi hớ hênh trước đòn phản công."
 single_combat.0031.desc.sc_attacker.POD_earthshock: "Đứng vững trên đôi chân, đối thủ của tôi chỉ hơi lảo đảo vì trận địa chấn."
 single_combat.0031.desc.sc_attacker.POD_fist_of_caine: "Luồng gió do các đòn đánh tăng cường bởi Potence của tôi tạo ra chỉ như một làn gió nhẹ đối với đối thủ."
 single_combat.0031.desc.sc_attacker.POD_toughness: "Bất chấp sức bền tăng cường của tôi, những đòn đánh mạnh mẽ của đối thủ vẫn đau như quỷ."
 single_combat.0031.desc.sc_attacker.POD_flesh_of_marble: "Đá cẩm thạch cũng có thể vỡ, như những đòn đánh long trời lở đất của đối thủ đang chứng minh ngay lúc này."
 single_combat.0031.desc.sc_attacker.POD_prowess_from_pain: "Ngay cả một ma cà rồng khổ dâm cũng có giới hạn. Đau đến mức này thì chẳng còn khoái cảm hay ích lợi gì nữa."
 single_combat.0031.desc.sc_attacker.POD_feral_weapons: "Đối thủ của tôi khéo léo né tránh những móng vuốt chết chóc của tôi, biết rõ sự nguy hiểm của chúng."
 single_combat.0031.desc.sc_attacker.POD_shapechange: "Bị bản năng thú tính lấn át, các đòn đánh của tôi tàn bạo nhưng thiếu độ chính xác cần thiết để trúng đích."
 single_combat.0031.desc.sc_attacker.POD_vanish: "Tìm kiếm những điểm bất thường nhỏ nhặt trong khu vực, đối thủ của tôi đã phát hiện ra tôi."
 single_combat.0031.desc.sc_attacker.POD_nocturne: "Đối thủ của tôi dường như chỉ hơi chậm lại bởi bóng tối, vẫn chiến đấu hết sức mình."
 single_combat.0031.desc.sc_attacker.POD_arms_of_ahriman: "Nhanh chóng tránh ra khỏi đường đi, đối thủ của tôi thoát khỏi tầm tay tôi."
