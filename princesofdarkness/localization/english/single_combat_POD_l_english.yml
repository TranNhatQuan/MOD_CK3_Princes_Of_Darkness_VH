 single_combat.0001.POD_ashen_ladys_embrace: "Sự đụng chạm của ta sẽ hủy diệt thân xác ngươi!"
 single_combat.0001.tt.POD_ashen_ladys_embrace: "#D Ngươi cố biến đổi trạng thái vật chất của kẻ địch trong khoảnh khắc.#!"
 single_combat.0001.desc.my_feedback.POD_ashen_ladys_embrace: "Ta niệm phép biến da thịt đối thủ ta thành tro."
 single_combat.0001.desc.opponent_response.POD_ashen_ladys_embrace: "Kẻ địch của ta cố niệm phép biến ta thành tro."
 single_combat.0031.desc.sc_defender.POD_ashen_ladys_embrace: "Câu phép không có hiệu lực."
 single_combat.0031.desc.opponent_response.POD_ashen_ladys_embrace: "Kẻ địch của ta cố niệm phép và biến thân xác ta thành tro."
 single_combat.0031.desc.opponent_response.POD_ashen_ladys_embrace.injury: "Một phần da thịt ta khô quắt lại vì câu phép của đối thủ."
 single_combat.0031.desc.opponent_response.POD_ashen_ladys_embrace.fatality: "Kẻ địch của ta niệm phép biến da thịt ta thành tro. Ta gục ngã khi cảm nhận da thịt mình khô quắt lại."
 single_combat.0031.desc.sc_attacker.POD_ashen_ladys_embrace: "Câu phép của ta không có hiệu lực."
 single_combat.0031.desc.sc_attacker.POD_ashen_ladys_embrace.injury: "Câu phép của ta không có hiệu lực, và ta bị hở sườn trước đòn phản công."
 single_combat.0031.desc.sc_attacker.POD_ashen_ladys_embrace.fatality: "Đối thủ của ta phản công bằng một đòn mạnh mẽ. Mắt ta tối sầm lại."
 single_combat.0041.desc.sc_defender.POD_ashen_ladys_embrace: "Ta niệm phép biến da thịt kẻ địch thành tro."
 single_combat.0041.desc.opponent_response.POD_ashen_ladys_embrace: "Đối thủ của ta cố niệm phép và biến da thịt ta thành tro."
 single_combat.0041.desc.opponent_response.POD_ashen_ladys_embrace.injury: "Ta niệm phép biến kẻ địch thành tro. Một phần da thịt họ bắt đầu khô quắt lại."
 single_combat.0041.desc.opponent_response.POD_ashen_ladys_embrace.fatality: "Ta né đòn tấn công của kẻ địch và niệm phép biến da thịt họ thành tro. Họ đổ sụp xuống đất khi bắt đầu khô quắt lại."
 single_combat.0041.desc.sc_attacker.POD_ashen_ladys_embrace: "Ta niệm phép biến kẻ địch thành Tro."
 single_combat.0041.desc.sc_attacker.POD_ashen_ladys_embrace.injury: "Câu phép có hiệu lực và các phần da thịt của kẻ địch ta bắt đầu khô quắt lại."
 single_combat.0041.desc.sc_attacker.POD_ashen_ladys_embrace.fatality: "Ta niệm phép biến da thịt đối thủ ta thành tro. Họ đổ sụp xuống đất."

 single_combat.0001.POD_dragons_ire: "Ta sẽ triệu hồi Cơn Thịnh Nộ của Rồng!"
 single_combat.0001.tt.POD_dragons_ire: "#D Triệu hồi Cơn Thịnh Nộ của Rồng cho phép ngươi dẫn một luồng sức mạnh từ chính [UmbraGlossary('dreaming')] vào trận cận chiến.#!"
 single_combat.0001.desc.my_feedback.POD_dragons_ire: "Dùng hết sức mạnh của mình, ta cố xé toạc đối thủ ra."
 single_combat.0001.desc.opponent_response.POD_dragons_ire: "Dùng hết sức mạnh của [my_foe.GetHerHis], kẻ địch của ta cố xé toạc ta ra."
 single_combat.0031.desc.sc_defender.POD_dragons_ire: "Ta cố xé toạc kẻ địch ra, nhưng [my_foe.GetSheHe] tỏ ra cứng cáp hơn ta tưởng."
 single_combat.0031.desc.opponent_response.POD_dragons_ire: "Dùng hết sức mạnh của [my_foe.GetHerHis], kẻ địch của ta cố xé toạc ta ra."
 single_combat.0031.desc.opponent_response.POD_dragons_ire.injury: "Ta cảm thấy đau đớn, khi đối thủ xé toạc da thịt ta."
 single_combat.0031.desc.opponent_response.POD_dragons_ire.fatality: "Áp đảo ta, kẻ địch xé toạc ta ra."
 single_combat.0031.desc.sc_attacker.POD_dragons_ire: "Ta cố xé toạc kẻ địch ra, nhưng [my_foe.GetSheHe] tỏ ra cứng cáp hơn ta tưởng."
 single_combat.0031.desc.sc_attacker.POD_dragons_ire.injury: "Ta bị đẩy lùi, chật vật theo kịp."
 single_combat.0031.desc.sc_attacker.POD_dragons_ire.fatality: "Đối thủ của ta né tránh đòn tấn công và ngay lập tức phản công."
 single_combat.0041.desc.sc_defender.POD_dragons_ire: "Dùng hết sức mạnh của mình, ta cố xé toạc đối thủ ra."
 single_combat.0041.desc.opponent_response.POD_dragons_ire: "Dùng hết sức mạnh của [my_foe.GetHerHis], kẻ địch của ta cố xé toạc ta ra."
 single_combat.0041.desc.opponent_response.POD_dragons_ire.injury: "Ta gây sát thương cho kẻ địch, cố xé toạc [my_foe.GetHerHim] ra."
 single_combat.0041.desc.opponent_response.POD_dragons_ire.fatality: "Ta phản công đòn tấn công của kẻ địch, xé [my_foe.GetHerHim] ra làm hai mảnh."
 single_combat.0041.desc.sc_attacker.POD_dragons_ire: "Dùng hết sức mạnh của mình, ta cố xé toạc đối thủ ra."
 single_combat.0041.desc.sc_attacker.POD_dragons_ire.injury: "Ta gây sát thương cho kẻ địch, cố xé toạc [my_foe.GetHerHim] ra."
 single_combat.0041.desc.sc_attacker.POD_dragons_ire.fatality: "Với sức mạnh phi thường của mình, ta xé toạc kẻ địch."