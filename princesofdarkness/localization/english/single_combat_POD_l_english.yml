 single_combat.0041.desc.sc_defender.POD_dragon_ward: "Ta mở rộng con mắt thứ ba và dẫn Khí của mình vào một lá bùa bảo hộ mạnh mẽ."
 single_combat.0041.desc.sc_defender.POD_typhonic_maw: "Ta há rộng hàm đủ để nuốt chửng đối thủ mình."
 single_combat.0041.desc.sc_defender.POD_cobra_fangs: "Nanh ta trở nên độc hại, tìm đường xuyên vào da thịt đối thủ ta."
 single_combat.0041.desc.sc_defender.POD_snout_strike: "Ta cố thực hiện một cú đâm ngắn, hung hãn, hoặc có thể, một cú tóm, vào mõm."
 single_combat.0041.desc.sc_defender.POD_chi_breaker: "Ta cố thúc một bàn tay vào thân đối thủ và làm gián đoạn dòng chảy tự nhiên của Khí bên trong cơ thể đối thủ ta."
 single_combat.0041.desc.sc_defender.POD_hundred_star_shower: "Ta nạp năng lượng sinh mệnh của chính mình vào phi tiêu."
