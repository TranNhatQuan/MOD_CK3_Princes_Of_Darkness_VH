 single_combat.0031.desc.sc_attacker.POD_thousand_hell_stare.fatality: "Rồi họ phản công bằng một đòn đánh mạnh mẽ. Đầu ta không thích điều đó, và quyết định rơi xuống sàn để phản kháng."
