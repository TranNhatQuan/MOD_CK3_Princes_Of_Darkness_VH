 single_combat.0041.desc.opponent_response.POD_typhonic_maw.fatality: "Ta chém ngang qua cái mõm quái dị đó. Một nhát chém gọn gàng dọc theo khuôn mặt xấu xí này kết thúc trận đấu."
 single_combat.0041.desc.opponent_response.POD_cobra_fangs.fatality: "Khi nọc độc tan biến khỏi nanh của đối thủ ta, ta đấm vào cái đầu đang vươn ra của chúng hết sức có thể, đảm bảo chúng sẽ không đứng dậy được lần này."
 single_combat.0041.desc.opponent_response.POD_snout_strike.fatality: "Ta sau đó phản công bằng một đòn mạnh. Đầu chúng không thích điều đó, và quyết định rơi xuống sàn để phản đối."
