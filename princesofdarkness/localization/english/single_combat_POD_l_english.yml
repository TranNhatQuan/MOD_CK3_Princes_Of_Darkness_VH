 single_combat.0041.desc.opponent_response.POD_compel.injury: "Nó bắt kẻ địch của ta không kịp đề phòng, và chẳng mấy chốc chúng phải gượng dậy sau một đòn giáng xuống lúc chúng đang mất tập trung."
 single_combat.0041.desc.opponent_response.POD_terminal_decree.injury: "Chúng ngoan ngoãn làm vậy, trước tiên cảm nhận sự nhục nhã rồi mới đến đau đớn."
 single_combat.0041.desc.opponent_response.POD_daunt.injury: "Nó bắt kẻ địch của ta không kịp đề phòng, và chẳng mấy chốc chúng phải gượng dậy sau một đòn giáng xuống lúc chúng đang mất tập trung."
