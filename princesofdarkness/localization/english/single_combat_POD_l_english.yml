 single_combat.0041.desc.opponent_response.POD_bone_dance: "Điệu múa được hoàn thành, tạo ra một tấm màn uể oải trong khu vực."
 single_combat.0041.desc.opponent_response.POD_dragon_dance: "Điệu múa đã hoàn tất, và trạng thái xuất thần đã bắt đầu."
 single_combat.0041.desc.opponent_response.POD_chi_interrupt: "Kẻ địch của ta lao về phía ta, tìm kiếm những huyệt đạo Khí trọng yếu của ta."
 single_combat.0041.desc.opponent_response.POD_thousand_hell_stare: "Đau đớn, giận dữ và tuyệt vọng bất chợt xâm chiếm linh hồn ta."
 single_combat.0041.desc.opponent_response.POD_wind_attack: "Cơn gió nổi lên, và đối thủ ta nhanh nhẹn hơn bao giờ hết."
 single_combat.0041.desc.opponent_response.POD_demon_claws: "Đối thủ ta đã mang hình dạng của một con quỷ đáng sợ."
 single_combat.0041.desc.opponent_response.POD_tormented_essence: "Đau đớn, giận dữ và tuyệt vọng bất chợt xâm chiếm linh hồn ta."
 single_combat.0041.desc.opponent_response.POD_adramelechs_wrath: "Đối thủ ta đã mang hình dạng của một con quỷ đáng sợ."
 single_combat.0041.desc.opponent_response.POD_blood_atemi: "Đối thủ ta lao về phía ta, cố khiến hệ tuần hoàn của ta rối loạn."
