 single_combat.0031.desc.opponent_response.POD_typhonic_maw.injury: "Hàm Typhon sượt qua ta. Và thứ địa ngục này thật đau đớn."
 single_combat.0031.desc.opponent_response.POD_cobra_fangs.injury: "Một chiếc răng nanh độc địa sượt qua ta, chưa đủ để gây tử vong, nhưng đủ để đáng lo ngại..."
 single_combat.0031.desc.opponent_response.POD_snout_strike.injury: "Một cú đấm ngắn, hiểm hóc trúng ta, chưa đủ để gây tử vong, nhưng đủ để đáng lo ngại..."
 single_combat.0031.desc.opponent_response.POD_chi_breaker.injury: "Đối thủ ta đâm bàn tay vào thân ta, chưa đủ để gây tử vong, nhưng đủ để đáng lo ngại..."
 single_combat.0031.desc.opponent_response.POD_hundred_star_shower.injury: "Lực va chạm của các phi tiêu nạp Khí lớn hơn nhiều so với bình thường. Nó đau đớn thật sự!"
 single_combat.0031.desc.opponent_response.POD_jaw_hammer.injury: "Hàm ta bị gãy, chưa đủ để gây tử vong, nhưng đủ để đáng lo ngại..."
 single_combat.0031.desc.opponent_response.POD_fading_light_strike.injury: "Sức mạnh của ta bị đánh cắp, chưa đủ để gây tử vong, nhưng đủ để đáng lo ngại..."
 single_combat.0031.desc.opponent_response.POD_chain_snake.injury: "Đòn tấn công của ta bị chặn lại, cùng lúc đó, một đầu của sợi xích đánh trúng mặt ta."
 single_combat.0031.desc.opponent_response.POD_twisting_thrust.injury: "Một vết cắt sâu vào cơ thể ta, chưa đủ để gây tử vong, nhưng đủ để đáng lo ngại..."
 single_combat.0031.desc.opponent_response.POD_prone_attacks.injury: "Ta không thể phá vỡ lớp phòng thủ của đối thủ, và đòn phản công thật đau đớn."
 single_combat.0031.desc.opponent_response.POD_dagger_claw.injury: "Nhanh hơn, cường tráng hơn và mạnh mẽ hơn ta, ta bị áp đảo."
 single_combat.0031.desc.opponent_response.POD_spark_of_ra.injury: "Quả cầu lửa trúng đích, thiêu đốt ta."
 single_combat.0031.desc.opponent_response.POD_deaths_hand.injury: "Năng lượng linh hồn trúng đích, gây đau đớn cho ta."
 single_combat.0031.desc.opponent_response.POD_ashes_to_ashes.injury: "Từng phần da thịt ta khô quắt lại vì câu thần chú của đối thủ."
 single_combat.0031.desc.opponent_response.POD_dust_to_dust.injury: "Đối thủ ta chạm vào ta, và ta cảm thấy da thịt mình biến thành đất sét đen."
 single_combat.0031.desc.opponent_response.POD_khaibits_embrace.injury: "Ta không thể phá vỡ vòng khóa của đối thủ và bị bóng tối gây thương tổn."
 single_combat.0031.desc.opponent_response.POD_serqets_sting.injury: "Ta cảm thấy chất độc thiêu đốt trong huyết quản."
 single_combat.0031.desc.opponent_response.POD_voracious_scarab_of_nyarashahim.injury: "Ta cảm thấy con bọ hung đói khát đục khoét vào da thịt mình."
 single_combat.0031.desc.opponent_response.POD_spear_of_anubis.injury: "Ta cảm nhận nhát đâm từ ngọn giáo của kẻ thù."
 single_combat.0031.desc.opponent_response.POD_feral_clawing.injury: "Và ta cảm nhận tiếng rít của móng vuốt kẻ địch."
 single_combat.0031.desc.opponent_response.POD_feral_bite.injury: "Ta cảm thấy đau đớn, khi đối thủ cắn đứt một mảng thịt của ta."
 single_combat.0031.desc.opponent_response.POD_feral_assault.injury: "Ta không thể thoát khỏi đòn tấn công điên cuồng của đối thủ. Nó trúng đích."
 single_combat.0031.desc.opponent_response.POD_feral_taunt.injury: "Khi ta bị phân tâm bởi những lời khiêu khích ác ý của kẻ địch, [my_foe.GetSheHe] tấn công ta."
 single_combat.0031.desc.opponent_response.POD_feral_evasion.injury: "Né tránh mọi đòn tấn công của ta, đối thủ ta nhanh chóng ra đòn, xuyên thủng phòng thủ của ta."
 single_combat.0031.desc.opponent_response.POD_jaw_lock.injury: "Đối thủ ta gây thương tổn cho chi của ta, trong khi khóa chặt nó tại chỗ."
 single_combat.0031.desc.opponent_response.POD_hamstring.injury: "Kẻ địch của ta gây thương tổn cho chi của ta trong khi điên cuồng cắn xé nó."
 single_combat.0031.desc.opponent_response.POD_leaping_rake.injury: "Kẻ địch của ta nhảy bổ thẳng vào ta, gây thương tích cho ta bằng móng vuốt [my_foe.GetHerHis]."
 single_combat.0031.desc.opponent_response.POD_wishbone.injury: "Ta cảm thấy đau đớn, khi đối thủ xé toạc da thịt ta."
 single_combat.0031.desc.opponent_response.POD_manipulate_inertia.injury: "Và ta chẳng có gì cả, chẳng mấy chốc chỉ còn biết chật vật gượng dậy sau trận công kích."
 single_combat.0031.desc.opponent_response.POD_manipulate_acceleration.injury: "Và ta chẳng có gì cả, chẳng mấy chốc chỉ còn biết chật vật gượng dậy sau trận công kích."
 single_combat.0031.desc.opponent_response.POD_manipulate_cohesion.injury: "Và ta chẳng có gì cả, chẳng mấy chốc chỉ còn biết chật vật gượng dậy sau trận công kích."
 single_combat.0031.desc.opponent_response.POD_dragons_breath.injury: "Ta né tránh để không bị thiêu thành than, nhưng ngọn lửa vẫn liếm trúng ta và để lại những vết bỏng đau đớn. Ta phải bỏ cuộc trước khi đòn tấn công tiếp theo biến ta thành một đống tro tàn."
 single_combat.0031.desc.opponent_response.POD_bark_mudpuppy.injury: "Tiếng ồn xé rách da ta dữ dội đến mức các vết thương mở ra khắp nơi, như thể ta đã bị cắt bằng dao vô số lần. Khi ta nghiến răng chịu đau, [sc_victor.GetFirstNameNoTooltip] chuẩn bị [sc_victor.GetHerselfHimself] cho đòn kết liễu, và ta nhận ra mình đã hoàn toàn thất bại."
 single_combat.0031.desc.opponent_response.POD_clap_of_thunder.injury: "Ta trở nên mất phương hướng khi tiếng sấm vang khiến tai ta ù đi và tầm nhìn chao đảo. Khi ta tỉnh lại, [sc_victor.GetFirstNameNoTooltip] đã tận dụng khoảnh khắc mất tập trung của ta và tước vũ khí của ta."
 single_combat.0031.desc.opponent_response.POD_dragon_slash.injury: "Ta không có cách nào đáp trả cuộc tấn công dồn dập không ngơi nghỉ của [sc_victor.GetHerHis], và khi [sc_victor.GetSheHe] lao vào vật ta ngã xuống sàn, ta phải thừa nhận thất bại."

#Defender Lost, Opponent Finishing Move Fatality
#Example: "The blow carves into my chest, and a veritable fountain of gore pours from the wound.\n\nPerhaps it was folly going up against a [sc_victor.GetWomanMan] who kills for sport so regularly? Maybe so, maybe not. Either way, the fast-spreading numbness in my limbs tells me I don't have long to rue my mistakes."
 single_combat.0031.desc.opponent_response.POD_bite.fatality: "Và nó trúng đích, mùi hương máu say đắm lan tỏa khắp không khí. Đã quá muộn để thoát thân khi ta chìm đắm trong cơn mê ly của nụ hôn ấy. Phần còn lại là lịch sử, nhưng không còn là của ta nữa."
 single_combat.0031.desc.opponent_response.POD_blood_surge.fatality: "Ngay cả từ vị trí của ta, ta có thể thấy hắn đứng cao lớn và mạnh mẽ hơn, được tiếp sức bởi dòng máu. Bỗng nhiên mạnh mẽ và nhanh nhẹn hơn hẳn, ta còn chưa kịp thấy đòn đánh ập tới đã bị chặt làm đôi."
 single_combat.0031.desc.opponent_response.POD_blood_heal.fatality: "Mọi công sức của ta tan biến trước mắt khi sức mạnh của dòng máu chữa lành cho kẻ địch. Bỗng nhiên mạnh mẽ và nhanh nhẹn hơn hẳn, ta còn chưa kịp thấy đòn đánh ập tới đã bị chặt làm đôi."
 single_combat.0031.desc.opponent_response.POD_blink.fatality: "Và ta chẳng có gì cả. Trận công kích không bao giờ dừng lại, ít nhất là không khi ta còn sống."
 single_combat.0031.desc.opponent_response.POD_lightning_strike.fatality: "Điều mà hắn làm được, chẳng mấy chốc ta bị đẩy lùi bởi đòn tấn công bất ngờ này. Đối thủ ta tận dụng cơ hội này để tấn công ta lần nữa và ta sụp xuống sàn, bất lực không thể ngăn cản đòn kết liễu."
 single_combat.0031.desc.opponent_response.POD_split_second.fatality: "Ta chưa chuẩn bị đủ, và một đòn đánh mạnh giáng xuống, quá nhanh để né tránh bởi cảm nhận thời gian bị bóp méo của ta. Đó sẽ là điều cuối cùng ta còn cảm nhận được."
 single_combat.0031.desc.opponent_response.POD_unerring_aim.fatality: "Ta chẳng thể làm gì ngoài chịu trận ngay giữa hai mắt. Đối thủ ta nhếch mép cười khi ta ngã ngửa ra sau, bất lực không thể bảo vệ bản thân thêm nữa."
 single_combat.0031.desc.opponent_response.POD_lethal_body.fatality: "Cảm giác như cả một ngôi nhà vừa sụp đổ lên người ta, ta hầu như không thể gượng dậy để thấy đối thủ đặt tay lên đầu ta và... Chấm hết."
 single_combat.0031.desc.opponent_response.POD_brutal_feed.fatality: "Và nó trúng đích, mùi hương máu say đắm lan tỏa khắp không khí. Đã quá muộn để thoát thân khi ta chìm đắm trong cơn mê ly của nụ hôn ấy. Phần còn lại là lịch sử, nhưng không còn là của ta nữa."
 single_combat.0031.desc.opponent_response.POD_earthshock.fatality: "Ta ngã xuống và đối thủ tận dụng cơ hội này để giáng đòn tàn bạo vào ta. Ta không thể né được đòn đánh nhắm vào cổ. Đầu ta lăn trên sàn và dừng lại dưới chân đối thủ."
 single_combat.0031.desc.opponent_response.POD_fist_of_caine.fatality: "Cơn bão này như những lưỡi dao cứa vào da ta, cắt xẻ những mảng lớn da thịt bất tử của ta theo từng động tác. Chẳng mấy chốc ta chỉ còn là một bộ xương, và còn nhanh hơn nữa để hóa thành tro bụi."
 single_combat.0031.desc.opponent_response.POD_toughness.fatality: "Dường như không gì có thể xuyên thủng lớp phòng thủ này. Ta kiệt sức khi cố phá vỡ nó. Ta không thấy được đòn phản công ập tới, và ta sẽ không bao giờ còn thấy được điều gì khác nữa."
 single_combat.0031.desc.opponent_response.POD_flesh_of_marble.fatality: "Dường như không gì có thể xuyên thủng lớp phòng thủ này. Ta kiệt sức khi cố phá vỡ nó. Ta không thấy được đòn phản công ập tới, và ta sẽ không bao giờ còn thấy được điều gì khác nữa."
 single_combat.0031.desc.opponent_response.POD_prowess_from_pain.fatality: "Được sức mạnh khủng khiếp này tiếp sức, đối thủ ta giáng một đòn kinh hoàng nghiền nát trái tim bất tử của ta thành bùn nhão. Nó phát ra một âm thanh đau đớn khi mọi thứ chìm vào bóng tối."
 single_combat.0031.desc.opponent_response.POD_feral_weapons.fatality: "Và nó xảy ra, ân huệ duy nhất là nó không kéo dài đau đớn lâu."
 single_combat.0031.desc.opponent_response.POD_shapechange.fatality: "Bất ngờ trước sự biến đổi này, ta bị trúng đòn và chẳng mấy chốc bị con quái vật này moi ruột đến chết vĩnh viễn."
 single_combat.0031.desc.opponent_response.POD_vanish.fatality: "Vì vậy, ta không thấy được đòn đánh tiếp theo từ phía sau. Và nó xé toạc nội tạng ta, tạo nên một mớ hỗn độn khắp nơi khi ta nổ tung thành máu me và nội tạng."
 single_combat.0031.desc.opponent_response.POD_nocturne.fatality: "Vì vậy, ta không thấy được đòn đánh tiếp theo từ phía sau. Và nó xé toạc nội tạng ta, tạo nên một mớ hỗn độn khắp nơi khi ta nổ tung thành máu me và nội tạng."
 single_combat.0031.desc.opponent_response.POD_arms_of_ahriman.fatality: "Ta né được một trong số chúng nhưng không né được cái thứ hai... và nó dội ta bật ngược lại về phía cái đầu tiên. Ta trở thành bao cát trong một hồi trước khi mọi thứ chìm vào bóng tối."
 single_combat.0031.desc.opponent_response.POD_the_darkness_within.fatality: "Chúng bỗng nhảy vào miệng ta, và ta phải dùng toàn bộ ý chí để trục xuất chúng. Ta không kịp làm điều đó đúng lúc và máu ta, cùng với chính ta, biến mất vào bóng tối."
 single_combat.0031.desc.opponent_response.POD_aegis_of_shadows.fatality: "Dường như không gì có thể xuyên thủng lớp phòng thủ này. Ta kiệt sức khi cố phá vỡ nó. Ta không thấy được đòn phản công ập tới, và ta sẽ không bao giờ còn thấy được điều gì khác nữa."
 single_combat.0031.desc.opponent_response.POD_compel.fatality: "Nó khiến ta không kịp đề phòng, và chẳng mấy chốc ta quá mất tập trung để thấy đòn đánh tiếp theo. Và đó là đòn cuối cùng."
 single_combat.0031.desc.opponent_response.POD_terminal_decree.fatality: "Điều mà ta ngoan ngoãn làm theo, từ từ tự giết chính mình trong khi đối thủ ta cười vang suốt cả quá trình. Suy nghĩ cuối cùng của ta là hy vọng rằng sẽ không ai biết ta đã chết như thế nào."
 single_combat.0031.desc.opponent_response.POD_daunt.fatality: "Nó khiến ta không kịp đề phòng, và chẳng mấy chốc ta quá mất tập trung để thấy đòn đánh tiếp theo. Và đó là đòn cuối cùng."
 single_combat.0031.desc.opponent_response.POD_dread_gaze.fatality: "Nó khiến ta không kịp đề phòng, và chẳng mấy chốc ta quá mất tập trung để thấy đòn đánh tiếp theo. Và đó là đòn cuối cùng."
 single_combat.0031.desc.opponent_response.POD_extinguish_vitae.fatality: "Vì vậy, ta bỗng cảm thấy yếu đi hẳn và Dã Thú đang gầm gào giận dữ. Nhưng không lâu vì đối thủ ta lợi dụng lúc ta mất tập trung để giáng một đòn hoàn hảo vào cổ ta. Ai cần đầu để làm gì chứ?"
 single_combat.0031.desc.opponent_response.POD_scorpions_touch.fatality: "Trúng đòn, ta cảm thấy buồn nôn và động tác trở nên chậm chạp. Trong tình trạng thảm hại này, ta nhanh chóng bị kẻ địch áp đảo, hắn ban cho ta ân huệ một cái chết nhanh chóng thay vì để chất độc phát tác."
 single_combat.0031.desc.opponent_response.POD_theft_of_vitae.fatality: "Ta bất lực không thể ngăn cản, dòng máu quý giá của ta bị đánh cắp cho đến khi chẳng còn lại gì. Và không còn máu... Chỉ còn lại tro tàn."
 single_combat.0031.desc.opponent_response.POD_baals_curse.fatality: "Bị thương bởi nó, ta cảm thấy buồn nôn và động tác trở nên chậm chạp. Trong tình trạng thảm hại này, ta nhanh chóng bị kẻ địch áp đảo, hắn ban cho ta ân huệ một cái chết nhanh chóng thay vì để chất độc phát tác."
 single_combat.0031.desc.opponent_response.POD_cauldron_of_blood.fatality: "Nó bỏng rát, nó bỏng rát! Ta đã hóa thành lửa!... và chẳng mấy chốc thành tro bụi."
 single_combat.0031.desc.opponent_response.POD_touch_of_oblivion.fatality: "Máu ta bỗng hòa lẫn với thứ bóng tối hung hãn đang cố chiếm quyền kiểm soát. Khi sinh lực bị rút cạn, ta sụp xuống sàn, chẳng mấy chốc chỉ còn lại một đống tro tàn và bóng tối cuộn xoáy."
 single_combat.0031.desc.opponent_response.POD_stygian_shroud.fatality: "Vì vậy, ta không thấy được đòn đánh tiếp theo từ phía sau. Và nó xé toạc nội tạng ta, tạo nên một mớ hỗn độn khắp nơi khi ta nổ tung thành máu me và nội tạng."
 single_combat.0031.desc.opponent_response.POD_fire_torch.fatality: "Ngọn lửa nhấn chìm hoàn toàn ta và chẳng mấy chốc, tất cả chỉ còn là tro bụi."
 single_combat.0031.desc.opponent_response.POD_fire_bombs.fatality: "Ngọn lửa nhấn chìm hoàn toàn ta và chẳng mấy chốc, tất cả chỉ còn là tro bụi."
 single_combat.0031.desc.opponent_response.POD_fire_spewer.fatality: "Ngọn lửa nhấn chìm hoàn toàn ta và chẳng mấy chốc, tất cả chỉ còn là tro bụi."
 single_combat.0031.desc.opponent_response.POD_crossbow_shot.fatality: "Nó đánh trúng ta ngay giữa hai mắt rồi trồi ra từ phía sau đầu ta. Toàn là đau đớn. Rồi đến bóng tối."
 single_combat.0031.desc.opponent_response.POD_unleash_dogs.fatality: "Chẳng mấy chốc ta ngã xuống đất, hầu như chỉ còn biết đẩy lùi lũ quái thú này. Đối thủ ta sừng sững tiến về phía ta và giáng đòn vào thân hình bất lực của ta..."
 single_combat.0031.desc.opponent_response.POD_stake_attack.fatality: "Cọc gỗ xuyên qua tim ta, và mọi thứ chìm vào bóng tối."
 single_combat.0031.desc.opponent_response.POD_oculi_trust.fatality: "Vì vậy, ta không thể tránh được đòn tấn công tiếp theo đang lao tới. Và đòn kế tiếp. Và... cho đến khi chẳng còn gì để thấy nữa."
 single_combat.0031.desc.opponent_response.POD_oculi_wine.fatality: "Ta bị thương, và da thịt ta hóa thành tro trước khi ta kịp làm bất cứ điều gì. Ít ra cũng là một cái chết nhanh chóng."
