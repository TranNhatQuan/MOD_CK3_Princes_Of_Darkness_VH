#Outcome Event: Loser

#Defender Lost, Own Combat Move Feedback
#Example: "My opponent sees through my feint, leaving the companion-stab pointless."
 single_combat.0031.desc.sc_defender.POD_bite: "Đối thủ của tôi né tránh cú lao tới của tôi một cách dễ dàng, khiến tôi hoàn toàn hở sườn cho một đòn phản công."
 single_combat.0031.desc.sc_defender.POD_blood_surge: "Tôi không thể khơi dậy dòng máu bên trong mình vì cần dồn hết sự tập trung để không bị đối thủ vượt mặt."
 single_combat.0031.desc.sc_defender.POD_blood_heal: "Tôi không thể khơi dậy dòng máu bên trong mình vì cần dồn hết sự tập trung để không bị đối thủ vượt mặt."
 single_combat.0031.desc.sc_defender.POD_blink: "Đi quá xa quá nhanh, tôi bị lệch vị trí cho hiệp đấu tiếp theo."
 single_combat.0031.desc.sc_defender.POD_lightning_strike: "Đòn đánh của tôi, dù nhanh, lại thiếu chính xác và trượt mục tiêu."
 single_combat.0031.desc.sc_defender.POD_split_second: "Bất chấp dòng thời gian bị bẻ cong, đối thủ của tôi dường như thích ứng khá tốt."
 single_combat.0031.desc.sc_defender.POD_unerring_aim: "Một cú nhắm hoàn hảo... nhưng thiếu sức mạnh, chỉ vừa sượt qua mục tiêu."
 single_combat.0031.desc.sc_defender.POD_lethal_body: "Sức mạnh chẳng là gì nếu thiếu độ chính xác, khi các đòn tấn công mạnh mẽ của tôi trượt mục tiêu."
 single_combat.0031.desc.sc_defender.POD_brutal_feed: "Răng nanh tôi vừa vặn trượt khỏi cổ đối thủ, khiến tôi hở sườn cho một đòn phản công."
 single_combat.0031.desc.sc_defender.POD_earthshock: "Đứng vững trên đôi chân, đối thủ của tôi hầu như không bị lay chuyển bởi cơn địa chấn."
 single_combat.0031.desc.sc_defender.POD_fist_of_caine: "Luồng gió bị cuốn theo các đòn đánh được Potence tăng cường của tôi chỉ như một làn gió nhẹ đối với kẻ thù."
 single_combat.0031.desc.sc_defender.POD_toughness: "Bất chấp độ bền được tăng cường của tôi, những đòn đánh mạnh mẽ của đối thủ vẫn đau đớn khủng khiếp."
 single_combat.0031.desc.sc_defender.POD_flesh_of_marble: "Đá cẩm thạch cũng có thể vỡ, như những đòn đánh long trời lở đất của đối thủ đang chứng minh ngay lúc này."
 single_combat.0031.desc.sc_defender.POD_prowess_from_pain: "Ngay cả một ma cà rồng khổ dâm cũng có giới hạn. Nó đau quá mức để có thể khoái cảm và hữu ích lúc này."
 single_combat.0031.desc.sc_defender.POD_feral_weapons: "Kẻ thù của tôi khéo léo né tránh móng vuốt chết người của tôi, biết rõ mối nguy hiểm của chúng."
 single_combat.0031.desc.sc_defender.POD_shapechange: "Bị bản năng thú vật lấn át, các đòn tấn công của tôi tàn bạo nhưng thiếu sự chính xác cần thiết để trúng đích."
 single_combat.0031.desc.sc_defender.POD_vanish: "Tìm kiếm những điểm bất thường nhỏ trong khu vực, đối thủ của tôi vẫn phát hiện ra tôi."
 single_combat.0031.desc.sc_defender.POD_nocturne: "Kẻ thù của tôi dường như chỉ hơi chậm lại bởi bóng tối, vẫn chiến đấu ở phong độ tốt nhất."
 single_combat.0031.desc.sc_defender.POD_arms_of_ahriman: "Nhanh chóng tránh sang một bên, đối thủ của tôi đã thoát khỏi tầm với."
 single_combat.0031.desc.sc_defender.POD_the_darkness_within: "Không có sơ hở nào xuất hiện, kẻ thù của tôi né tránh những bóng tối cuộn xoáy gần như hoàn hảo."
 single_combat.0031.desc.sc_defender.POD_aegis_of_shadows: "Khi ánh sáng xua tan bóng tối, những đòn đánh mạnh mẽ của đối thủ đập vỡ lớp giáp bóng tối của tôi."
 single_combat.0031.desc.sc_defender.POD_compel: "Với một nỗ lực ý chí phi thường, đối thủ của tôi phớt lờ mệnh lệnh của tôi."
 single_combat.0031.desc.sc_defender.POD_terminal_decree: "Với một nỗ lực ý chí phi thường, đối thủ của tôi phớt lờ mệnh lệnh của tôi."
 single_combat.0031.desc.sc_defender.POD_daunt: "Đối thủ của tôi hoàn toàn không hề nao núng trước sự hiện diện được tăng cường của tôi, vẫn chiến đấu ở phong độ tốt nhất."
 single_combat.0031.desc.sc_defender.POD_dread_gaze: "Đối thủ của tôi thực ra có vẻ thích thú khi đánh bại chính cơn ác mộng tồi tệ nhất của mình thành cháo, khiến ánh nhìn kinh hoàng trở nên vô dụng."
 single_combat.0031.desc.sc_defender.POD_extinguish_vitae: "Máu của đối thủ tôi quá mạnh so với những trò xảo thuật, và vẫn hiệu quả như thường lệ."
 single_combat.0031.desc.sc_defender.POD_scorpions_touch: "Một loại độc chết người sẽ vô dụng nếu bạn không thể tiêm nó vào, và đối thủ của bạn hết sức cẩn thận né tránh các đòn đánh tiếp theo của bạn."
 single_combat.0031.desc.sc_defender.POD_theft_of_vitae: "Máu của đối thủ tôi quá mạnh so với những trò xảo thuật và khó chịu thay vẫn ở nguyên trong cơ thể họ."
 single_combat.0031.desc.sc_defender.POD_baals_curse: "Một loại độc chết người sẽ vô dụng nếu bạn không thể tiêm nó vào, và đối thủ của bạn hết sức cẩn thận né tránh các đòn đánh tiếp theo của bạn."
 single_combat.0031.desc.sc_defender.POD_cauldron_of_blood: "Máu của đối thủ tôi quá mạnh so với hiệu ứng của tôi, máu của họ vẫn lạnh bất chấp mọi nỗ lực của tôi."
 single_combat.0031.desc.sc_defender.POD_touch_of_oblivion: "Sự đụng chạm của Oblivion chỉ vừa sượt qua đối thủ của tôi, khiến nó gần như vô giá trị."
 single_combat.0031.desc.sc_defender.POD_stygian_shroud: "Ngay cả khi giác quan bị làm chậm lại bởi tấm màn, đối thủ của tôi vẫn chiến đấu ở phong độ tốt nhất."
 single_combat.0031.desc.sc_defender.POD_fire_torch: "Lần này không có may mắn, ngọn đuốc của tôi bị né tránh dễ dàng."
 single_combat.0031.desc.sc_defender.POD_fire_bombs: "Thứ hỗn hợp nhỏ bị kẻ thù né tránh dễ dàng."
 single_combat.0031.desc.sc_defender.POD_fire_spewer: "Với việc nhắm bắn cực kỳ thiếu chính xác, ngọn lửa thậm chí không đến gần mục tiêu dự định."
 single_combat.0031.desc.sc_defender.POD_crossbow_shot: "Phát bắn đi chệch xa mục tiêu dự định."
 single_combat.0031.desc.sc_defender.POD_unleash_dogs: "Lũ thú nhanh chóng bị tiêu diệt."
 single_combat.0031.desc.sc_defender.POD_stake_attack: "Đòn tấn công liều lĩnh của tôi bị né tránh dễ dàng."
 single_combat.0031.desc.sc_defender.POD_oculi_trust: "Tuy nhiên, dường như nó không thực sự ngăn được họ lâu."
 single_combat.0031.desc.sc_defender.POD_oculi_wine: "Đòn tấn công liều lĩnh của tôi bị né tránh dễ dàng."
 single_combat.0031.desc.sc_defender.POD_acre_catechumen: "Tuy nhiên tôi không tận dụng được sức mạnh mới này đủ nhanh."
 single_combat.0031.desc.sc_defender.POD_acre_flesh: "...nhưng đối thủ của tôi không quan tâm và đợt tấn công tiếp theo của họ vẫn mạnh mẽ như thường lệ."
 single_combat.0031.desc.sc_defender.POD_acre_flight: "Tuy nhiên dường như vẫn chưa đủ, và kẻ thù của tôi dễ dàng bắt kịp tôi."
 single_combat.0031.desc.sc_defender.POD_acre_auto: "Không hẳn vậy, vì nó bị né tránh dễ dàng."
 single_combat.0031.desc.sc_defender.POD_murnau_mirror: "Tuy nhiên vẫn chưa đủ, và tôi hiện vẫn bị lép vế."
 single_combat.0031.desc.sc_defender.POD_murnau_arcana: "Sức mạnh càng lớn... rủi ro phản tác dụng càng cao."
 single_combat.0031.desc.sc_defender.POD_sisters_hosanna: "Tuy nhiên tôi không tận dụng được sức mạnh mới này đủ nhanh."
 single_combat.0031.desc.sc_defender.POD_sisters_oratorio: "Tuy nhiên, dường như nó không thực sự ngăn được họ lâu."
 single_combat.0031.desc.sc_defender.POD_bone_obedience: "Nhưng đợt tấn công không ngừng nghỉ của đối thủ tôi vẫn gây đau đớn."
 single_combat.0031.desc.sc_defender.POD_five_poison_cloud: "Tuy nhiên nó bị né tránh vào giây phút cuối cùng."
 single_combat.0031.desc.sc_defender.POD_ching_shih: "Tuy nhiên đối thủ của tôi không hề ấn tượng, và ra đòn nhanh chóng."
 single_combat.0031.desc.sc_defender.POD_long_neck: "Nhưng không phải độ chính xác vô hạn, khi tôi trượt đòn tấn công tiếp theo."
 single_combat.0031.desc.sc_defender.POD_bloodlash: "Nó chẳng giúp ích được bao nhiêu, khi đối thủ của tôi dễ dàng bước sang một bên."
 single_combat.0031.desc.sc_defender.POD_goblin_scorch: "Tuy nhiên nó bị né tránh vào giây phút cuối cùng."
 single_combat.0031.desc.sc_defender.POD_goblin_lantern: "Đối thủ của tôi cẩn thận tránh né tôi trong khoảng thời gian này."
