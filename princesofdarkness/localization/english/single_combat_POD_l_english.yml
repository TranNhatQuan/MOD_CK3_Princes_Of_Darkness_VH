 single_combat.0041.desc.sc_attacker.POD_stand_upon_the_dragons_back.fatality: "Họ bị đẩy lùi, chật vật theo kịp. Vượt quá tầm với của họ rồi!"
 single_combat.0041.desc.sc_attacker.POD_dragon_ward.fatality: "Họ bị đẩy lùi, chật vật theo kịp. Vượt quá tầm với của họ rồi!"
 single_combat.0041.desc.sc_attacker.POD_typhonic_maw.fatality: "Ta chém ngang qua cái miệng quái dị đó. Một nhát chém gọn gàng dọc khuôn mặt xấu xí này kết thúc trận đấu."
 single_combat.0041.desc.sc_attacker.POD_cobra_fangs.fatality: "Khi chất độc tan biến khỏi răng nanh của đối thủ ta, ta đấm vào cái đầu đang vươn ra của họ hết sức có thể, đảm bảo họ sẽ không đứng dậy được lần này."
 single_combat.0041.desc.sc_attacker.POD_snout_strike.fatality: "Ta sau đó phản công bằng một đòn mạnh. Đầu họ không thích điều đó, và quyết định rơi xuống sàn để phản đối."
 single_combat.0041.desc.sc_attacker.POD_chi_breaker.fatality: "Ta sau đó phản công bằng một đòn mạnh. Đầu họ không thích điều đó, và quyết định rơi xuống sàn để phản đối."
 single_combat.0041.desc.sc_attacker.POD_hundred_star_shower.fatality: "Ta sau đó phản công bằng một đòn mạnh. Đầu họ không thích điều đó, và quyết định rơi xuống sàn để phản đối."
