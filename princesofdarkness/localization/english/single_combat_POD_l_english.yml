 single_combat.0031.desc.sc_attacker.POD_dragons_breath.injury: "\"Có lẽ mình đã dồn quá nhiều vào đòn tấn công này\" là suy nghĩ cuối cùng của tôi khi [sc_victor.GetSheHe] thu hẹp khoảng cách và đánh cho tôi bất tỉnh."
 single_combat.0031.desc.sc_attacker.POD_bark_mudpuppy.injury: "[sc_victor.GetSheHe|U] chỉ đơn giản gồng [sc_victor.GetHerHis] cơ bắp một cách khoa trương và đấm vào cổ họng tôi trong lúc tôi đang hồi phục, và với đòn đó, trận đấu kết thúc."
 single_combat.0031.desc.sc_attacker.POD_clap_of_thunder.injury: "[sc_victor.GetSheHe|U] phủi bỏ đợt tấn công bằng âm thanh và tung ra một đòn phản công nhanh khiến tôi mất thăng bằng và chấm dứt trận đấu này."
 single_combat.0031.desc.sc_attacker.POD_dragon_slash.injury: "[sc_victor.GetSheHe|U] dùng chính đà của tôi để chống lại tôi khi [sc_victor.GetSheHe] bước sang một bên và đập vào sau gáy tôi, như một võ sư quở trách học trò của [sc_victor.GetHerHis]."


#Aggressor Lost, Own Combat Move Fatality
#Example: "which distracts me just long enough that I don't notice the follow-up [sc_victor.Custom('SignatureWeaponAttemptedLight')] before it's [sc_victor.Custom('SignatureWeaponKillTypeTorso2PresentParticiple')].\n\nI stagger, then topple backwards into the [sc_defender.Custom('GroundType')], convulsing, trying to scream but unable to manage more than a hoarse whisper. How could anyone survive this much #EMP pain#!?\n\nThey couldn't."
 single_combat.0031.desc.sc_attacker.POD_bite.fatality: "Và nó đến thật nhanh, dưới dạng một đòn đánh vào mặt, cắt đôi nó gọn gàng."
 single_combat.0031.desc.sc_attacker.POD_blood_surge.fatality: "Và sự phân tâm nhỏ đó đủ để đối thủ của ta chớp lấy lợi thế bằng một đòn đánh nhanh vào cổ ngươi. Đầu ngươi chẳng mấy chốc lăn xuống sàn, chẳng lành mạnh chút nào."
 single_combat.0031.desc.sc_attacker.POD_blood_heal.fatality: "Và sự phân tâm nhỏ đó đủ để đối thủ của ta chớp lấy lợi thế bằng một đòn đánh nhanh vào cổ ngươi. Đầu ngươi chẳng mấy chốc lăn xuống sàn, chẳng lành mạnh chút nào"
 single_combat.0031.desc.sc_attacker.POD_blink.fatality: "Và ta mất nó còn tệ hơn cả những gì ta đã dự đoán. Dù sao ta cũng sẽ chẳng mất thêm gì nữa, nếu điều đó được tính là một sự an ủi."
 single_combat.0031.desc.sc_attacker.POD_lightning_strike.fatality: "Đòn phản công của đối thủ ta thì không. Tim ta bị xuyên thủng và vỡ tung. Một kết cục đẫm máu."
 single_combat.0031.desc.sc_attacker.POD_split_second.fatality: "Ta bị trúng đòn tấn công tiếp theo của họ như thể chẳng có gì xảy ra. Và nó nhắm thẳng vào cổ ta. Một kết cục chẳng mấy vinh quang."
 single_combat.0031.desc.sc_attacker.POD_unerring_aim.fatality: "Thu hẹp khoảng cách, kẻ địch của ta đấm vào bụng ta vì sự xấc xược của ta. Rồi đến mặt. Rồi xé toạc cổ ta khỏi vai."
 single_combat.0031.desc.sc_attacker.POD_lethal_body.fatality: "Đáng tiếc là của đối thủ ta thì không. Và nó đau. Cho đến khi không còn đau nữa, khi bóng tối nuốt chửng ngươi."
 single_combat.0031.desc.sc_attacker.POD_brutal_feed.fatality: "Và nó đến thật nhanh, dưới dạng một đòn đánh vào mặt, cắt đôi nó gọn gàng."
 single_combat.0031.desc.sc_attacker.POD_earthshock.fatality: "Bị phân tâm bởi thất bại này, ta không thấy đòn đánh tiếp theo ập đến. Và giờ đây, ta sẽ chẳng bao giờ thấy gì nữa."
 single_combat.0031.desc.sc_attacker.POD_fist_of_caine.fatality: "Những đòn đánh của hắn lại nhắm vào ta nhiều hơn hẳn và ta chẳng mấy chốc quỵ xuống đất, chỉ có thể trơ mắt nhìn cái kết đang ập tới."
 single_combat.0031.desc.sc_attacker.POD_toughness.fatality: "Có vẻ như Fortitude lần này không đủ. Nó cũng không đủ để cứu ngươi khỏi đòn đánh mạnh mẽ nhắm vào cổ ngươi sắp tới."
 single_combat.0031.desc.sc_attacker.POD_flesh_of_marble.fatality: "Ta cảm thấy như đang ở tâm chấn của một trận động đất. Và ngươi chẳng mấy chốc bị nó nuốt chửng, không bao giờ được thấy lại."
 single_combat.0031.desc.sc_attacker.POD_prowess_from_pain.fatality: "Đối thủ của ta nhanh chóng đảm bảo rằng nó sẽ chẳng mấy chốc đau hơn nữa. Cho đến khi không còn đau nữa."
 single_combat.0031.desc.sc_attacker.POD_feral_weapons.fatality: "Đòn phản công của họ cũng chẳng kém phần nguy hiểm, và ta không thể tự cứu mình khỏi loạt đòn đánh mạnh mẽ tiếp theo đang ập đến."
 single_combat.0031.desc.sc_attacker.POD_shapechange.fatality: "Khơi dậy bao thế hệ loài người thuần hóa muông thú hoang dã, đối thủ của ta bắt đầu đánh cho hình dạng thú của ta tối tăm mặt mũi. Một chiến thắng vang dội cho loài người trong màn đấu này giữa người và thú."
 single_combat.0031.desc.sc_attacker.POD_vanish.fatality: "Đòn đánh tiếp theo của hắn cũng vậy. Và đòn kế tiếp. Và đòn kế tiếp nữa..."
 single_combat.0031.desc.sc_attacker.POD_nocturne.fatality: "Điều đó được chứng minh bởi đòn đánh tiếp theo, gần như hoàn hảo, của họ. Và đòn kế tiếp. Và đòn kế tiếp nữa..."
 single_combat.0031.desc.sc_attacker.POD_arms_of_ahriman.fatality: "Bị phân tâm bởi thất bại này, ta phải chịu đựng một đòn trả đũa nhanh chóng. Trong tình trạng hiện tại, ta không thể phục hồi đủ nhanh. Việc này sẽ sớm kết thúc."
 single_combat.0031.desc.sc_attacker.POD_the_darkness_within.fatality: "Đáng tiếc là ta chống đỡ không tốt trước đòn đánh tiếp theo của họ. Sự bất tử luôn kết thúc bằng cái chết theo cách nào đó."
 single_combat.0031.desc.sc_attacker.POD_aegis_of_shadows.fatality: "Không bất khả xâm phạm quả thật đau đớn khủng khiếp. Nhưng thực sự chết đi thì không, như ngươi sẽ sớm nhận ra."
 single_combat.0031.desc.sc_attacker.POD_compel.fatality: "Và rồi ra lệnh cho nắm đấm của họ nhắm vào đầu ta. Nó có hiệu quả. Đầu ta không thích điều đó và quyết định tách rời khỏi cơ thể ta."
 single_combat.0031.desc.sc_attacker.POD_terminal_decree.fatality: "Và rồi ra lệnh cho nắm đấm của họ nhắm vào đầu ta. Nó có hiệu quả. Đầu ta không thích điều đó và quyết định tách rời khỏi cơ thể ta."
 single_combat.0031.desc.sc_attacker.POD_daunt.fatality: "Điều đó được chứng minh bởi đòn đánh tiếp theo, gần như hoàn hảo, của họ. Và đòn kế tiếp. Và đòn kế tiếp nữa..."
 single_combat.0031.desc.sc_attacker.POD_dread_gaze.fatality: "Và thật đau đớn khi phải hứng chịu nó. Khi ngươi sớm cảm thấy lời nguyền của Caine rời khỏi cơ thể mình, ngươi có một chút an ủi nhỏ nhoi là đã giúp kẻ địch của mình vượt qua nỗi sợ hãi một cách tàn bạo, ít nhất là vậy."
 single_combat.0031.desc.sc_attacker.POD_extinguish_vitae.fatality: "Điều mà ta chẳng mấy chốc có thể xác nhận khi một cú đá được máu tăng cường đánh trúng bụng ta. Ta chẳng mấy chốc chẳng còn ruột gan, và cũng chẳng còn bất tử nữa."
 single_combat.0031.desc.sc_attacker.POD_scorpions_touch.fatality: "Ngươi lại thiếu sự cẩn trọng tương tự khi né tránh đòn của họ, và ngươi rốt cuộc thua trận này. Cuối cùng, chỉ còn lại bóng tối."
 single_combat.0031.desc.sc_attacker.POD_theft_of_vitae.fatality: "Của ta lại vọt ra khi cú đấm của đối thủ trúng mặt ta. Để phản kháng, đầu ta quyết định tách rời khỏi cơ thể mình."
 single_combat.0031.desc.sc_attacker.POD_baals_curse.fatality: "Ngươi lại thiếu sự cẩn trọng tương tự khi né tránh đòn của họ, và ngươi rốt cuộc thua trận này. Cuối cùng, chỉ còn lại bóng tối."
 single_combat.0031.desc.sc_attacker.POD_cauldron_of_blood.fatality: "Điều mà ta chẳng mấy chốc có thể xác nhận khi một cú đá được máu tăng cường đánh trúng bụng ta. Ta chẳng mấy chốc chẳng còn ruột gan, và cũng chẳng còn bất tử nữa."
 single_combat.0031.desc.sc_attacker.POD_touch_of_oblivion.fatality: "Không hề nao núng, kẻ địch của ta áp đảo ta và ta rốt cuộc thua trận này. Cuối cùng, chỉ còn lại bóng tối."
 single_combat.0031.desc.sc_attacker.POD_stygian_shroud.fatality: "Điều mà ta chẳng mấy chốc có thể xác nhận khi một cú đá được máu tăng cường đánh trúng bụng ta. Ta chẳng mấy chốc chẳng còn ruột gan, và cũng chẳng còn bất tử nữa."
 single_combat.0031.desc.sc_attacker.POD_fire_torch.fatality: "Đòn tấn công thảm hại của ta sau đó bị phản công bằng một đòn đánh bậc thầy. Ta sẽ không hồi phục được từ đòn này."
 single_combat.0031.desc.sc_attacker.POD_fire_bombs.fatality: "Ta không dễ dàng né được cú đấm vào mặt tiếp theo. Hay đòn kế tiếp, cho đến khi đầu ta rơi khỏi vai."
 single_combat.0031.desc.sc_attacker.POD_fire_spewer.fatality: "Đòn đánh tiếp theo của đối thủ ta lại chính xác hơn nhiều. Đầu ta bị chém lìa khỏi vai trong một động tác nhanh gọn."
 single_combat.0031.desc.sc_attacker.POD_crossbow_shot.fatality: "Đòn đánh tiếp theo của đối thủ ta lại chính xác hơn nhiều. Đầu ta bị chém lìa khỏi vai trong một động tác nhanh gọn."
 single_combat.0031.desc.sc_attacker.POD_unleash_dogs.fatality: "Đối thủ ta ném một trong những con chó của chính ta vào ta để trả đũa. Ta bắt lấy nó theo phản xạ, hóa ra lại là một nước đi sai lầm khi đối thủ ta áp sát để tung một đòn chí mạng."
 single_combat.0031.desc.sc_attacker.POD_stake_attack.fatality: "Ta không dễ dàng né được cú đấm vào mặt tiếp theo. Hay đòn kế tiếp, cho đến khi đầu ta rơi khỏi vai."
 single_combat.0031.desc.sc_attacker.POD_oculi_trust.fatality: "Ta nhanh chóng bị đẩy lùi bởi một cuộc tấn công dồn dập không ngừng. Bị dồn vào chân tường, ta ngã xuống đất, bất lực."
 single_combat.0031.desc.sc_attacker.POD_oculi_wine.fatality: "Ta không dễ dàng né được cú đấm vào mặt tiếp theo. Hay đòn kế tiếp, cho đến khi đầu ta rơi khỏi vai."
 single_combat.0031.desc.sc_attacker.POD_acre_catechumen.fatality: "Đòn phản công của đối thủ ta khiến ta trở tay không kịp và trúng đích. Cái kết đến trong một ánh chớp thép."
 single_combat.0031.desc.sc_attacker.POD_acre_flesh.fatality: "Nó đau đớn khá nhiều. Đủ để làm ta phân tâm trước đòn đánh tiếp theo. Đòn này thì không đau lâu."
 single_combat.0031.desc.sc_attacker.POD_acre_flight.fatality: "Hoặc thậm chí vượt trội hơn ta, khi ta bị đẩy lùi. Rồi lại lùi thêm. Cho đến khi không còn nơi nào để lùi nữa."
 single_combat.0031.desc.sc_attacker.POD_acre_auto.fatality: "Ta không dễ dàng né được cú đấm vào mặt tiếp theo. Hay đòn kế tiếp, cho đến khi đầu ta rơi khỏi vai."
 single_combat.0031.desc.sc_attacker.POD_murnau_mirror.fatality: "Ta bị đẩy lùi, chật vật theo kịp. Cuộc đấu không kéo dài lâu sau đó, ta hoàn toàn lép vế."
 single_combat.0031.desc.sc_attacker.POD_murnau_arcana.fatality: "Cái này phát nổ ngay trước mặt ta. Rồi làm nổ tung cả khuôn mặt ta."
 single_combat.0031.desc.sc_attacker.POD_sisters_hosanna.fatality: "Đòn phản công của đối thủ ta khiến ta trở tay không kịp và trúng đích. Cái kết đến trong một ánh chớp thép."
 single_combat.0031.desc.sc_attacker.POD_sisters_oratorio.fatality: "Đòn phản công của đối thủ ta khiến ta trở tay không kịp và trúng đích. Cái kết đến trong một ánh chớp thép."
 single_combat.0031.desc.sc_attacker.POD_bone_obedience.fatality: "Ta bị đẩy lùi, chật vật theo kịp. Cuộc đấu không kéo dài lâu sau đó, ta hoàn toàn lép vế."
 single_combat.0031.desc.sc_attacker.POD_five_poison_cloud.fatality: "Ta không dễ dàng né được cú đấm vào mặt tiếp theo. Hay đòn kế tiếp, cho đến khi đầu ta rơi khỏi vai."
 single_combat.0031.desc.sc_attacker.POD_ching_shih.fatality: "Ta bị thương, nhưng vẫn đứng vững. Cho đến khi không còn nữa. Nó kết thúc như cách nó bắt đầu, trong bóng tối."
 single_combat.0031.desc.sc_attacker.POD_long_neck.fatality: "Đối thủ ta thì không, và ta bị thương. Đủ nặng để phần còn lại của trận đấu trở thành một kết cục chắc chắn."
 single_combat.0031.desc.sc_attacker.POD_bloodlash.fatality: "Trước khi trúng phải một đòn đánh nhanh khiến ta bị thương. Đủ nặng để phần còn lại của trận đấu trở thành một kết cục đã định trước."
 single_combat.0031.desc.sc_attacker.POD_goblin_scorch.fatality: "Ta không dễ dàng né được cú đấm vào mặt tiếp theo. Hay đòn kế tiếp, cho đến khi đầu ta rơi khỏi vai."
 single_combat.0031.desc.sc_attacker.POD_goblin_lantern.fatality: "Rồi họ phản công bằng một đòn đánh mạnh mẽ. Đầu ta không thích điều đó, và quyết định rơi xuống sàn để phản kháng."
 single_combat.0031.desc.sc_attacker.POD_bone_dance.fatality: "Rồi họ phản công bằng một đòn đánh mạnh mẽ. Đầu ta không thích điều đó, và quyết định rơi xuống sàn để phản kháng."
