 single_combat.0041.desc.sc_attacker.POD_fading_light_strike.fatality: "Ta sau đó phản công bằng một đòn mạnh. Đầu họ không thích điều đó, và quyết định rơi xuống sàn để phản đối."
 single_combat.0041.desc.sc_attacker.POD_chain_snake.fatality: "Ta sau đó phản công bằng một đòn mạnh. Đầu họ không thích điều đó, và quyết định rơi xuống sàn để phản đối."
 single_combat.0041.desc.sc_attacker.POD_twisting_thrust.fatality: "Ta sau đó phản công bằng một đòn mạnh. Đầu họ không thích điều đó, và quyết định rơi xuống sàn để phản đối."
 single_combat.0041.desc.sc_attacker.POD_prone_attacks.fatality: "Ta sau đó phản công bằng một đòn mạnh. Đầu họ không thích điều đó, và quyết định rơi xuống sàn để phản đối."
 single_combat.0041.desc.sc_attacker.POD_dagger_claw.fatality: "Ta sau đó phản công bằng một đòn mạnh. Đầu họ không thích điều đó, và quyết định rơi xuống sàn để phản đối."
 single_combat.0041.desc.sc_attacker.POD_spark_of_ra.fatality: "Quả cầu lửa đánh trúng, biến đối thủ của ta thành một ngọn đuốc hấp hối."
 single_combat.0041.desc.sc_attacker.POD_deaths_hand.fatality: "Luồng năng lượng u linh đánh trúng kẻ địch của ta, đánh bại họ."
 single_combat.0041.desc.sc_attacker.POD_ashes_to_ashes.fatality: "Ta niệm phép biến da thịt đối thủ ta thành tro. Họ đổ sụp xuống đất."
 single_combat.0041.desc.sc_attacker.POD_dust_to_dust.fatality: "Kẻ địch của ta đổ sụp xuống đất khi da thịt họ biến thành đất sét."
 single_combat.0041.desc.sc_attacker.POD_khaibits_embrace.fatality: "Kẻ địch của ta hoàn toàn bị bóng tối ôm trọn. Giờ họ nằm trong tay ta."
 single_combat.0041.desc.sc_attacker.POD_serqets_sting.fatality: "Chất độc bỏng rát trong huyết quản họ, và đối thủ của ta chẳng mấy chốc gục ngã."
 single_combat.0041.desc.sc_attacker.POD_voracious_scarab_of_nyarashahim.fatality: "Con bọ cánh cứng đào sâu hơn vào bên trong, và đối thủ của ta chẳng mấy chốc gục ngã."
 single_combat.0041.desc.sc_attacker.POD_spear_of_anubis.fatality: "Ta hạ gục đối thủ bằng ngọn giáo của Anubis."
 single_combat.0041.desc.sc_attacker.POD_feral_clawing.fatality: "Ta hạ gục đối thủ bằng vuốt trần của mình."
 single_combat.0041.desc.sc_attacker.POD_feral_bite.fatality: "Ta cắn đứt mặt kẻ địch."
 single_combat.0041.desc.sc_attacker.POD_feral_assault.fatality: "Ta điên cuồng tấn công đối thủ, hạ gục [my_foe.GetHerHim]."
 single_combat.0041.desc.sc_attacker.POD_feral_taunt.fatality: "Ta khiêu khích kẻ địch, rồi hạ gục [my_foe.GetHerHim]"
 single_combat.0041.desc.sc_attacker.POD_feral_evasion.fatality: "Trong khi né tránh kẻ địch, ta tiến sát [my_foe.GetHerHim] và hạ gục [my_foe.GetHerHim]."
 single_combat.0041.desc.sc_attacker.POD_jaw_lock.fatality: "Ta khóa tứ chi kẻ địch, hạ gục [my_foe.GetHerHim]."
 single_combat.0041.desc.sc_attacker.POD_hamstring.fatality: "Ta tấn công tứ chi đối thủ, hạ gục [my_foe.GetHerHim]."
 single_combat.0041.desc.sc_attacker.POD_leaping_rake.fatality: "Ta lao vào kẻ địch, đâm xuyên [my_foe.GetHerHim] bằng vuốt của ta."
 single_combat.0041.desc.sc_attacker.POD_wishbone.fatality: "Với sức mạnh phi thường của mình, ta xé toạc kẻ địch."
 single_combat.0041.desc.sc_attacker.POD_manipulate_inertia.fatality: "Và họ chẳng còn gì, đợt tấn công dồn dập của ta chỉ dừng lại khi trước mặt ta chỉ còn lại tro tàn."
 single_combat.0041.desc.sc_attacker.POD_manipulate_acceleration.fatality: "Và họ chẳng còn gì, đợt tấn công dồn dập của ta chỉ dừng lại khi trước mặt ta chỉ còn lại tro tàn."
 single_combat.0041.desc.sc_attacker.POD_manipulate_cohesion.fatality: "Và họ chẳng còn gì, đợt tấn công dồn dập của ta chỉ dừng lại khi trước mặt ta chỉ còn lại tro tàn."
 single_combat.0041.desc.sc_attacker.POD_dragons_breath.fatality: "[sc_loser.GetSheHe|U] bị bắt trọn ngay giữa biển lửa, và ta nghe thấy tiếng thét đau đớn tuyệt vọng của [sc_loser.GetHerHis], rồi im lặng."
 single_combat.0041.desc.sc_attacker.POD_bark_mudpuppy.fatality: "[sc_loser.GetSheHe|U] nghiến chặt răng [sc_loser.GetHerHis] khi các vết thương mở ra khắp làn da [sc_loser.GetHerHis], và khoảnh khắc mất tập trung đó đủ để ta đâm xuyên vũ khí qua cổ họng [sc_loser.GetHerHis]."
 single_combat.0041.desc.sc_attacker.POD_clap_of_thunder.fatality: "[sc_loser.GetSheHe|U] không kháng cự khi ta dễ dàng chặt đầu [sc_loser.GetHerHim] và đưa trận đấu này đến một kết thúc chóng vánh."
 single_combat.0041.desc.sc_attacker.POD_dragon_slash.fatality: "[sc_loser.GetSheHe|U] không có phản ứng gì trước đòn tấn công của ta và không kháng cự, ngay cả khi ta xé đứt cánh tay [sc_loser.GetHerHis], moi ruột [sc_loser.GetHerHim], và đánh [sc_loser.GetHerHim] đến chết bằng chính cột sống của [sc_loser.GetHerHis]."


