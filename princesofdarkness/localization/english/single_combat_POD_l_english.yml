#Defender Won, Own Combat Move Feedback
#Example: "Though they pull back just in time, my off-hand stab almost ends this."
 single_combat.0041.desc.sc_defender.POD_bite: "Ta lao tới, cố cắm hàm răng nhọn hoắt vào chiếc cổ hấp dẫn trước mặt ta."
 single_combat.0041.desc.sc_defender.POD_blood_surge: "Ta triệu hồi sức mạnh từ máu mình để tiếp thêm sinh lực."
 single_combat.0041.desc.sc_defender.POD_blood_heal: "Ta triệu hồi sức mạnh từ máu mình để hàn gắn vết thương và tự chữa lành."
 single_combat.0041.desc.sc_defender.POD_blink: "Ta lao tới nhanh hơn mắt thường có thể thấy, hy vọng rằng đối thủ ta không có cách nào đoán trước được động tác của ta."
 single_combat.0041.desc.sc_defender.POD_lightning_strike: "Ta ra đòn theo bản năng với sức mạnh của Celerity, cố bắt đối thủ ta trở tay không kịp."
 single_combat.0041.desc.sc_defender.POD_split_second: "Thời gian chậm lại quanh ta khi Celerity phát huy tác dụng. Ta phải tận dụng cơ hội đó."
 single_combat.0041.desc.sc_defender.POD_unerring_aim: "Nhờ sự tinh thông Celerity của ta, đòn tiếp theo của ta chính xác tuyệt đối."
 single_combat.0041.desc.sc_defender.POD_lethal_body: "Potence cho phép ta lao vào đối thủ với lực của một trận tuyết lở."
 single_combat.0041.desc.sc_defender.POD_brutal_feed: "Ta lao tới cổ họng, hy vọng rút cạn máu đối thủ ta trong tích tắc."
 single_combat.0041.desc.sc_defender.POD_earthshock: "Đánh xuống mặt đất, ta khiến chính sàn nhà rung chuyển dưới chân chúng ta."
 single_combat.0041.desc.sc_defender.POD_fist_of_caine: "Nhờ Potence, luồng không khí bị dịch chuyển bởi những động tác ẩu đả của ta tự nó đã là một vũ khí chết người."
 single_combat.0041.desc.sc_defender.POD_toughness: "Da thịt ta trở nên bền bỉ khác thường, hy vọng chặn được mọi đòn đánh ập đến."
 single_combat.0041.desc.sc_defender.POD_flesh_of_marble: "Da thịt ta biến thành đá cẩm thạch siêu nhiên, không thể bị tổn hại. Hy vọng là vậy."
 single_combat.0041.desc.sc_defender.POD_prowess_from_pain: "Vết thương của ta nuôi dưỡng ta, ta đang mạnh lên từng giây."
 single_combat.0041.desc.sc_defender.POD_feral_weapons: "Móng vuốt ta chìa ra sẵn sàng xẻ đôi đối thủ ta."
 single_combat.0041.desc.sc_defender.POD_shapechange: "Ta dùng hình dạng thú của mình để lao vào đối thủ bằng nanh trước."
 single_combat.0041.desc.sc_defender.POD_vanish: "Ta biến mất khỏi tầm mắt, cố làm đối thủ ta bối rối."
 single_combat.0041.desc.sc_defender.POD_nocturne: "Bóng tối cuộn xoáy quanh chiến trường của chúng ta, khiến việc quan sát trở nên khó khăn."
 single_combat.0041.desc.sc_defender.POD_arms_of_ahriman: "Những xúc tu đen ngòm xuất hiện từ lòng đất và cố tấn công kẻ địch của ta."
 single_combat.0041.desc.sc_defender.POD_the_darkness_within: "Bóng tối cuộn xoáy quanh đối thủ ta, tìm kiếm một sơ hở."
 single_combat.0041.desc.sc_defender.POD_aegis_of_shadows: "Một bộ giáp bóng tối xuất hiện quanh ta, bảo vệ ta khỏi tổn hại."
 single_combat.0041.desc.sc_defender.POD_compel: "Ta ra một mệnh lệnh nhanh chóng cho đối thủ ta."
 single_combat.0041.desc.sc_defender.POD_terminal_decree: "Ta ra lệnh cho đối thủ ta tự làm hại bản thân."
 single_combat.0041.desc.sc_defender.POD_daunt: "Ta trở nên hùng vĩ hơn, uy quyền hơn, hy vọng đủ để khiến kẻ địch chùn bước."
 single_combat.0041.desc.sc_defender.POD_dread_gaze: "Ta hiện lên như cơn ác mộng tồi tệ nhất của kẻ địch."
 single_combat.0041.desc.sc_defender.POD_extinguish_vitae: "Chỉ với một cái phất tay, ta khiến máu của đối thủ ta trơ ì."
 single_combat.0041.desc.sc_defender.POD_scorpions_touch: "Ta rút một ít máu mình, biến nó thành chất độc."
 single_combat.0041.desc.sc_defender.POD_theft_of_vitae: "Ta khiến máu trào ra từ miệng kẻ địch rồi dẫn nó về phía mình."
 single_combat.0041.desc.sc_defender.POD_baals_curse: "Ta rút một ít máu mình và biến nó thành một chất độc cực kỳ hung hãn."
 single_combat.0041.desc.sc_defender.POD_cauldron_of_blood: "Chỉ với một cái phất tay, ta khiến máu của đối thủ ta sôi lên trong chính huyết quản của họ."
 single_combat.0041.desc.sc_defender.POD_touch_of_oblivion: "Ta chạm vào đối thủ ta và truyền qua họ sức mạnh entropy thuần khiết của Oblivion."
 single_combat.0041.desc.sc_defender.POD_stygian_shroud: "Ta trải rộng một bóng tối ngột ngạt trên một khu vực rộng lớn, làm câm lặng âm thanh và triệt tiêu mọi giác quan khác."
 single_combat.0041.desc.sc_defender.POD_fire_torch: "Ta hy vọng vào một vận may trong khi vung điên cuồng ngọn đuốc của mình."
 single_combat.0041.desc.sc_defender.POD_fire_bombs: "Ta phóng lửa giả kim về phía đối thủ ta."
 single_combat.0041.desc.sc_defender.POD_fire_spewer: "Cỗ máy kỳ lạ phun lửa dữ dội."
 single_combat.0041.desc.sc_defender.POD_crossbow_shot: "Phát bắn được khai hỏa, tìm kiếm mục tiêu của nó."
 single_combat.0041.desc.sc_defender.POD_unleash_dogs: "Đàn chó lao về phía kẻ địch của ta, khát khao máu và thịt."
 single_combat.0041.desc.sc_defender.POD_stake_attack: "Ta lao tới với cọc gỗ đi trước."
 single_combat.0041.desc.sc_defender.POD_oculi_trust: "Lời của Chúa được cất lên, tràn ngập kẻ địch ta bằng nỗi khiếp sợ."
 single_combat.0041.desc.sc_defender.POD_oculi_wine: "Ta lao về phía đối thủ, tìm cách tiếp xúc để lời nguyền của ta bén rễ."
 single_combat.0041.desc.sc_defender.POD_acre_catechumen: "Lời của Chúa được cất lên, tràn ngập ta bằng sức mạnh."
 single_combat.0041.desc.sc_defender.POD_acre_flesh: "Lời của Chúa được cất lên, tràn ngập ta bằng sức chịu đựng."
 single_combat.0041.desc.sc_defender.POD_acre_flight: "Được Đấng Thiêng Liêng ban phước, ta nhanh nhẹn hơn bao giờ hết."
 single_combat.0041.desc.sc_defender.POD_acre_auto: "Ta chuẩn bị cho những gì có thể là đòn đánh cuối cùng."
 single_combat.0041.desc.sc_defender.POD_murnau_mirror: "Tấm gương của Chúa chỉ cho ta con đường để sánh ngang sức mạnh của con quái vật này."
 single_combat.0041.desc.sc_defender.POD_murnau_arcana: "Ta chuẩn bị nắm quyền kiểm soát sức mạnh của con quái vật."
 single_combat.0041.desc.sc_defender.POD_sisters_hosanna: "Ta hát vang vinh quang của Chúa, tràn ngập ta bằng sức mạnh."
 single_combat.0041.desc.sc_defender.POD_sisters_oratorio: "Ta hát vang vinh quang của Chúa, tràn ngập kẻ địch ta bằng nỗi kinh hoàng."
 single_combat.0041.desc.sc_defender.POD_bone_obedience: "Xương cốt ta bắt đầu trở nên không thể phá vỡ."
 single_combat.0041.desc.sc_defender.POD_five_poison_cloud: "Năng lượng Âm đen tối của đám mây lao về phía kẻ địch của ta."
 single_combat.0041.desc.sc_defender.POD_ching_shih: "Hình dạng quái vật khủng khiếp giờ đây là của ta"
 single_combat.0041.desc.sc_defender.POD_long_neck: "Ta kéo dài tứ chi mình, cho ta tầm với vô hạn."
 single_combat.0041.desc.sc_defender.POD_bloodlash: "Một xúc tu máu được tạo ra, mang lại cho ta những cơ hội mới."
 single_combat.0041.desc.sc_defender.POD_goblin_scorch: "Ngọn lửa linh hồn được phóng về phía đối thủ ta."
 single_combat.0041.desc.sc_defender.POD_goblin_lantern: "Ta biến thành một quả cầu lửa phát sáng."
 single_combat.0041.desc.sc_defender.POD_bone_dance: "Điệu múa được hoàn thành, tạo ra một tấm màn uể oải trong khu vực."
 single_combat.0041.desc.sc_defender.POD_dragon_dance: "Điệu múa đã hoàn tất, và trạng thái xuất thần đã bắt đầu."
 single_combat.0041.desc.sc_defender.POD_chi_interrupt: "Ta lao về phía đối thủ, tìm kiếm những huyệt đạo Khí trọng yếu của nó."
 single_combat.0041.desc.sc_defender.POD_thousand_hell_stare: "Đau đớn, giận dữ và tuyệt vọng bất chợt xâm chiếm linh hồn đối thủ ta."
 single_combat.0041.desc.sc_defender.POD_wind_attack: "Cơn gió nổi lên, và ta nhanh nhẹn hơn bao giờ hết."
 single_combat.0041.desc.sc_defender.POD_demon_claws: "Ta là con quỷ và nó là ta. Chúng ta sẽ chiến thắng."
 single_combat.0041.desc.sc_defender.POD_tormented_essence: "Đau đớn, giận dữ và tuyệt vọng bất chợt xâm chiếm linh hồn đối thủ ta."
 single_combat.0041.desc.sc_defender.POD_adramelechs_wrath: "Ta là con quỷ và nó là ta. Chúng ta sẽ chiến thắng."
