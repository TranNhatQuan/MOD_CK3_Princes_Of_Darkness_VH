 single_combat.0041.desc.opponent_response.POD_dragon_ward: "Đối thủ ta mở rộng con mắt thứ ba và dẫn Khí của hắn vào một lá bùa bảo hộ mạnh mẽ."
 single_combat.0041.desc.opponent_response.POD_typhonic_maw: "Đối thủ ta há rộng hàm hắn đủ để nuốt chửng ta!"
 single_combat.0041.desc.opponent_response.POD_cobra_fangs: "Nanh của đối thủ ta trở nên độc hại, tìm đường xuyên vào da thịt ta."
 single_combat.0041.desc.opponent_response.POD_snout_strike: "Đối thủ ta cố thực hiện một cú đâm ngắn, hung hãn, hoặc có thể, một cú tóm, vào mõm."
 single_combat.0041.desc.opponent_response.POD_chi_breaker: "Đối thủ ta cố thúc một bàn tay vào thân ta và làm gián đoạn dòng chảy tự nhiên của Khí bên trong cơ thể ta."
 single_combat.0041.desc.opponent_response.POD_hundred_star_shower: "Đối thủ ta nạp năng lượng sinh mệnh của chính hắn vào phi tiêu."
 single_combat.0041.desc.opponent_response.POD_jaw_hammer: "Đối thủ ta cố thực hiện một đòn đánh mạnh mẽ nhằm nghiền nát xương hàm ta."
 single_combat.0041.desc.opponent_response.POD_fading_light_strike: "Đối thủ ta cố đánh cắp sức mạnh từ ta."
 single_combat.0041.desc.opponent_response.POD_chain_snake: "Đối thủ ta cố chặn đòn tấn công của ta trong khi bắt giữ chi ra đòn."
 single_combat.0041.desc.opponent_response.POD_twisting_thrust: "Đối thủ ta cố cắt sâu vào cơ thể ta."
 single_combat.0041.desc.opponent_response.POD_prone_attacks: "Đối thủ ta ngã sấp xuống"
 single_combat.0041.desc.opponent_response.POD_dagger_claw: "Đối thủ ta xòe ngón tay của cả hai bàn tay và đâm chúng vào bụng dưới của ta."
 single_combat.0041.desc.opponent_response.POD_spark_of_ra: "Đối thủ ta ném một quả cầu lửa đã bốc cháy vào ta."
 single_combat.0041.desc.opponent_response.POD_deaths_hand: "Đối thủ ta cố thổi bay ta bằng năng lượng linh hồn."
 single_combat.0041.desc.opponent_response.POD_ashes_to_ashes: "Đối thủ ta cố niệm một phép thuật để biến da thịt ta thành tro."
 single_combat.0041.desc.opponent_response.POD_dust_to_dust: "Đối thủ ta cố chạm vào ta và biến da thịt ta thành đất sét đen."
 single_combat.0041.desc.opponent_response.POD_khaibits_embrace: "Đối thủ ta nắm lấy mặt ta. Chúng đang nhấn chìm ta trong bóng tối!"
 single_combat.0041.desc.opponent_response.POD_serqets_sting: "Đối thủ ta cố làm dấu hiệu con rắn và đầu độc ta."
 single_combat.0041.desc.opponent_response.POD_voracious_scarab_of_nyarashahim: "Đối thủ ta cố thả một con bọ hung háu đói lên người ta."
 single_combat.0041.desc.opponent_response.POD_spear_of_anubis: "Đối thủ ta triệu hồi một cây thương bóng tối trong tay hắn và tấn công ta."
 single_combat.0041.desc.opponent_response.POD_feral_clawing: "Đối thủ ta vung móng vuốt vào ta."
 single_combat.0041.desc.opponent_response.POD_feral_bite: "Kẻ địch của ta cắn xé ta."
 single_combat.0041.desc.opponent_response.POD_feral_assault: "Kẻ thù của ta lao vào ta, vung tứ chi của [my_foe.GetHerHis] vào ta và cắn xé."
 single_combat.0041.desc.opponent_response.POD_feral_taunt: "Đối thủ ta cố làm mất tinh thần ta bằng cách khiêu khích tính cách của ta."
 single_combat.0041.desc.opponent_response.POD_feral_evasion: "Kẻ địch của ta né tránh đòn tấn công của ta."
 single_combat.0041.desc.opponent_response.POD_jaw_lock: "Đối thủ ta khóa chặt chân ta tại chỗ."
 single_combat.0041.desc.opponent_response.POD_hamstring: "Kẻ địch của ta cắn xé tứ chi ta."
 single_combat.0041.desc.opponent_response.POD_leaping_rake: "Đối thủ ta bất chợt nhảy vào ta, cố đâm xuyên ta bằng móng vuốt của [my_foe.GetHerHis]."
 single_combat.0041.desc.opponent_response.POD_wishbone: "Dùng hết sức mạnh của [my_foe.GetHerHis], đối thủ ta cố xé toạc ta ra."
 single_combat.0041.desc.opponent_response.POD_manipulate_inertia: "Kẻ địch của ta lao tới nhanh hơn mắt thường có thể thấy, hy vọng rằng ta không có cách nào đoán trước được điều đó."
 single_combat.0041.desc.opponent_response.POD_manipulate_acceleration: "Kẻ địch của ta lao tới nhanh hơn mắt thường có thể thấy, hy vọng rằng ta không có cách nào đoán trước được điều đó."
 single_combat.0041.desc.opponent_response.POD_manipulate_cohesion: "Kẻ địch của ta lao tới nhanh hơn mắt thường có thể thấy, hy vọng rằng ta không có cách nào đoán trước được điều đó."
 single_combat.0041.desc.opponent_response.POD_dragons_breath: "[sc_loser.GetFirstNameNoTooltip] phả ra một luồng lửa vô hại về phía ta, trông giống một gã hề đang diễn trò hơn là một con rồng hung tợn."
 single_combat.0041.desc.opponent_response.POD_bark_mudpuppy: "[sc_loser.GetFirstNameNoTooltip] hét lên với tất cả sức lực của [sc_loser.GetHerHis], và dù tiếng ồn đó tấn công ta, ta vẫn tiến lên."
 single_combat.0041.desc.opponent_response.POD_clap_of_thunder: "[sc_loser.GetFirstNameNoTooltip] vỗ hai tay của [sc_loser.GetHerHis] vào nhau và cố gắng một cách quả cảm để hất ta mất thăng bằng bằng một tiếng động sấm sét, nhưng ta không hề nao núng."
 single_combat.0041.desc.opponent_response.POD_dragon_slash: "[sc_loser.GetFirstNameNoTooltip] lao vào ta, tung ra [sc_loser.GetHerselfHimself] bằng một loạt những nhát chém uyển chuyển, điêu luyện của móng vuốt [sc_loser.GetHerHis], nhưng [sc_loser.GetSheHe] không nhận ra đà tấn công về phía trước của [sc_loser.GetHerHis] đã để lộ chính [sc_loser.GetHerselfHimself] một cách sơ hở như thế nào."


