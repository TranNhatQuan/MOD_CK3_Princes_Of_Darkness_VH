 single_combat.0041.desc.opponent_response.POD_blood_surge: "Kẻ địch của ta triệu hồi sức mạnh từ máu của hắn để tiếp thêm sinh lực."
 single_combat.0041.desc.opponent_response.POD_blood_heal: "Kẻ địch của ta triệu hồi sức mạnh từ máu của hắn để hàn gắn vết thương."
 single_combat.0041.desc.opponent_response.POD_blink: "Kẻ địch của ta lao tới nhanh hơn mắt thường có thể thấy, hy vọng rằng ta không có cách nào đoán trước được điều đó."
 single_combat.0041.desc.opponent_response.POD_lightning_strike: "Kẻ địch của ta ra đòn theo bản năng với sức mạnh của Celerity, cố bắt ta trở tay không kịp."
 single_combat.0041.desc.opponent_response.POD_split_second: "Thời gian chậm lại quanh chúng ta khi Celerity phát huy tác dụng. Đối thủ ta chắc chắn sẽ tận dụng cơ hội đó."
 single_combat.0041.desc.opponent_response.POD_unerring_aim: "Nhờ sự tinh thông Celerity của hắn, đòn đánh của kẻ địch ta chính xác tuyệt đối."
 single_combat.0041.desc.opponent_response.POD_lethal_body: "Với lực của một trận tuyết lở được Potence trợ giúp, đối thủ ta lao về phía ta."
 single_combat.0041.desc.opponent_response.POD_brutal_feed: "Kẻ địch của ta lao tới cổ họng ta, hy vọng rút cạn máu ta trong tích tắc."
 single_combat.0041.desc.opponent_response.POD_earthshock: "Đánh xuống mặt đất, kẻ địch của ta khiến chính sàn nhà rung chuyển dưới chân chúng ta."
 single_combat.0041.desc.opponent_response.POD_fist_of_caine: "Nhờ Potence, luồng không khí bị dịch chuyển bởi những động tác ẩu đả của kẻ địch ta tự nó đã là một vũ khí chết người."
 single_combat.0041.desc.opponent_response.POD_toughness: "Da thịt đối thủ ta trở nên bền bỉ khác thường, có khả năng chặn được mọi đòn đánh ập đến."
 single_combat.0041.desc.opponent_response.POD_flesh_of_marble: "Da thịt đối thủ ta biến thành đá cẩm thạch siêu nhiên, không thể bị tổn hại."
 single_combat.0041.desc.opponent_response.POD_prowess_from_pain: "Vết thương của kẻ địch ta nuôi dưỡng hắn, mạnh lên từng giây."
 single_combat.0041.desc.opponent_response.POD_feral_weapons: "Móng vuốt đối thủ ta chìa ra sẵn sàng xẻ đôi ta."
 single_combat.0041.desc.opponent_response.POD_shapechange: "Kẻ địch của ta dùng hình dạng thú của hắn để lao vào ta bằng nanh trước."
 single_combat.0041.desc.opponent_response.POD_vanish: "Kẻ địch của ta biến mất khỏi tầm mắt, cố làm ta bối rối."
 single_combat.0041.desc.opponent_response.POD_nocturne: "Bóng tối cuộn xoáy quanh chiến trường của chúng ta, khiến việc quan sát trở nên khó khăn."
 single_combat.0041.desc.opponent_response.POD_arms_of_ahriman: "Những xúc tu đen ngòm xuất hiện từ lòng đất và cố tấn công ta."
 single_combat.0041.desc.opponent_response.POD_the_darkness_within: "Bóng tối cuộn xoáy quanh ta, tìm kiếm một sơ hở."
 single_combat.0041.desc.opponent_response.POD_aegis_of_shadows: "Một bộ giáp bóng tối xuất hiện quanh đối thủ ta, bảo vệ hắn khỏi tổn hại."
 single_combat.0041.desc.opponent_response.POD_compel: "Kẻ địch của ta ra một mệnh lệnh nhanh chóng bằng Dominate."
 single_combat.0041.desc.opponent_response.POD_terminal_decree: "Kẻ địch của ta ra lệnh, buộc ta tự làm hại bản thân."
 single_combat.0041.desc.opponent_response.POD_daunt: "Kẻ địch của ta trở nên hùng vĩ hơn, uy quyền hơn, chắc hẳn hy vọng khiến ta chùn bước."
 single_combat.0041.desc.opponent_response.POD_dread_gaze: "Kẻ địch của ta hiện lên như cơn ác mộng tồi tệ nhất của ta. Một cảnh tượng gây phân tâm."
 single_combat.0041.desc.opponent_response.POD_extinguish_vitae: "Chỉ với một cái phất tay, kẻ địch của ta khiến máu ta trơ ì."
 single_combat.0041.desc.opponent_response.POD_scorpions_touch: "Kẻ địch của ta rút một ít máu hắn, biến nó thành chất độc."
 single_combat.0041.desc.opponent_response.POD_theft_of_vitae: "Kẻ địch của ta khiến máu trào ra từ miệng ta rồi dẫn nó về miệng hắn."
 single_combat.0041.desc.opponent_response.POD_baals_curse: "Kẻ địch của ta rút một ít máu hắn và biến nó thành một chất độc cực kỳ hung hãn."
 single_combat.0041.desc.opponent_response.POD_cauldron_of_blood: "Chỉ với một cái phất tay, kẻ địch của ta khiến máu ta sôi lên trong chính huyết quản của ta."
 single_combat.0041.desc.opponent_response.POD_touch_of_oblivion: "Kẻ địch của ta chạm vào ta và truyền qua ta sức mạnh entropy thuần khiết của Oblivion."
 single_combat.0041.desc.opponent_response.POD_stygian_shroud: "Kẻ địch của ta trải rộng một bóng tối ngột ngạt trên một khu vực rộng lớn, làm câm lặng âm thanh và triệt tiêu mọi giác quan khác."
 single_combat.0041.desc.opponent_response.POD_fire_torch: "Đối thủ ta hy vọng vào một vận may trong khi vung điên cuồng ngọn đuốc của hắn."
 single_combat.0041.desc.opponent_response.POD_fire_bombs: "Đối thủ ta phóng lửa giả kim về phía ta."
 single_combat.0041.desc.opponent_response.POD_fire_spewer: "Cỗ máy kỳ lạ của đối thủ ta phun lửa dữ dội."
 single_combat.0041.desc.opponent_response.POD_crossbow_shot: "Phát bắn của đối thủ ta được khai hỏa, tìm kiếm mục tiêu của nó."
 single_combat.0041.desc.opponent_response.POD_unleash_dogs: "Đàn chó lao về phía ta, khát khao máu và thịt."
 single_combat.0041.desc.opponent_response.POD_stake_attack: "Kẻ địch của ta lao tới với cọc gỗ đi trước."
 single_combat.0041.desc.opponent_response.POD_oculi_trust: "Lời của Chúa được cất lên, tràn ngập ta bằng nỗi khiếp sợ."
 single_combat.0041.desc.opponent_response.POD_oculi_wine: "Kẻ địch của ta lao về phía ta, tìm cách tiếp xúc để lời nguyền của hắn bén rễ."
 single_combat.0041.desc.opponent_response.POD_acre_catechumen: "Lời của Chúa được cất lên, tràn ngập đối thủ ta bằng sức mạnh."
 single_combat.0041.desc.opponent_response.POD_acre_flesh: "Lời của Chúa được cất lên, tràn ngập đối thủ ta bằng sức chịu đựng."
 single_combat.0041.desc.opponent_response.POD_acre_flight: "Được Đấng Thiêng Liêng ban phước, kẻ địch của ta nhanh nhẹn hơn bao giờ hết."
 single_combat.0041.desc.opponent_response.POD_acre_auto: "Đối thủ ta chuẩn bị cho những gì có thể là đòn đánh cuối cùng."
 single_combat.0041.desc.opponent_response.POD_murnau_mirror: "Tấm gương của Chúa chỉ cho đối thủ ta con đường để sánh ngang sức mạnh của ta."
 single_combat.0041.desc.opponent_response.POD_murnau_arcana: "Kẻ địch của ta chuẩn bị nắm quyền kiểm soát sức mạnh của ta."
 single_combat.0041.desc.opponent_response.POD_sisters_hosanna: "Đối thủ ta hát vang vinh quang của Chúa, tràn ngập hắn bằng sức mạnh."
 single_combat.0041.desc.opponent_response.POD_sisters_oratorio: "Đối thủ ta hát vang vinh quang của Chúa, tràn ngập ta bằng nỗi kinh hoàng."
 single_combat.0041.desc.opponent_response.POD_bone_obedience: "Xương cốt đối thủ ta bắt đầu trở nên không thể phá vỡ."
 single_combat.0041.desc.opponent_response.POD_five_poison_cloud: "Năng lượng Âm đen tối của đám mây lao về phía ta."
 single_combat.0041.desc.opponent_response.POD_ching_shih: "Hình dạng quái vật khủng khiếp giờ đây đang đối diện ta."
 single_combat.0041.desc.opponent_response.POD_long_neck: "Kẻ địch của ta kéo dài tứ chi hắn, cho hắn tầm với vô hạn."
 single_combat.0041.desc.opponent_response.POD_bloodlash: "Một xúc tu máu được tạo ra, mang lại cho đối thủ ta những cơ hội mới."
 single_combat.0041.desc.opponent_response.POD_goblin_scorch: "Ngọn lửa linh hồn được phóng về phía ta."
