 single_combat.0041.desc.sc_defender.POD_fading_light_strike: "Ta cố đánh cắp sức mạnh từ đối thủ mình."
 single_combat.0041.desc.sc_defender.POD_chain_snake: "Ta cố chặn đòn tấn công của đối thủ trong khi bắt giữ chi ra đòn."
 single_combat.0041.desc.sc_defender.POD_twisting_thrust: "Ta cố cắt sâu vào cơ thể đối thủ mình."
 single_combat.0041.desc.sc_defender.POD_prone_attacks: "Ta ngã sấp xuống."
 single_combat.0041.desc.sc_defender.POD_dagger_claw: "Ta xòe ngón tay của cả hai bàn tay và đâm chúng vào bụng dưới của đối thủ mình."
 single_combat.0041.desc.sc_defender.POD_spark_of_ra: "Ta ném một quả cầu lửa đã bốc cháy vào đối thủ mình."
 single_combat.0041.desc.sc_defender.POD_deaths_hand: "Ta giơ lòng bàn tay lên để thổi bay kẻ địch bằng năng lượng linh hồn."
 single_combat.0041.desc.sc_defender.POD_ashes_to_ashes: "Ta niệm một phép thuật để biến da thịt kẻ địch thành tro bụi."
 single_combat.0041.desc.sc_defender.POD_dust_to_dust: "Ta cố chạm vào đối thủ và biến da thịt họ thành đất sét đen."
 single_combat.0041.desc.sc_defender.POD_khaibits_embrace: "Ta nắm lấy mặt đối thủ và bắt đầu nhấn chìm họ trong bóng tối."
 single_combat.0041.desc.sc_defender.POD_serqets_sting: "Ta làm dấu hiệu bọ cạp và chích độc vào đối thủ mình."
 single_combat.0041.desc.sc_defender.POD_voracious_scarab_of_nyarashahim: "Ta thả một con bọ hung để nuốt chửng đối thủ mình."
 single_combat.0041.desc.sc_defender.POD_spear_of_anubis: "Ta triệu hồi một cây thương trong tay mình và tấn công kẻ địch."
 single_combat.0041.desc.sc_defender.POD_feral_clawing: "Ta vung móng vuốt vào kẻ địch."
 single_combat.0041.desc.sc_defender.POD_feral_bite: "Ta cắn xé đối thủ mình."
 single_combat.0041.desc.sc_defender.POD_feral_assault: "Ta điên cuồng lao vào đối thủ, vung tứ chi và cắn xé."
 single_combat.0041.desc.sc_defender.POD_feral_taunt: "Ta cố làm mất tinh thần kẻ địch bằng cách khiêu khích."
 single_combat.0041.desc.sc_defender.POD_feral_evasion: "Ta né tránh đòn tấn công của kẻ địch."
 single_combat.0041.desc.sc_defender.POD_jaw_lock: "Ta khóa chặt chân đối thủ tại chỗ."
 single_combat.0041.desc.sc_defender.POD_hamstring: "Ta cắn xé tứ chi của kẻ địch."
 single_combat.0041.desc.sc_defender.POD_leaping_rake: "Ta bất chợt nhảy vào đối thủ, cố đâm xuyên họ bằng móng vuốt của mình."
 single_combat.0041.desc.sc_defender.POD_wishbone: "Dùng hết sức mạnh của mình, ta cố xé toạc đối thủ ra."
 single_combat.0041.desc.sc_defender.POD_manipulate_inertia: "Ta lao tới nhanh hơn mắt thường có thể thấy, hy vọng rằng đối thủ ta không có cách nào đoán trước được động tác của ta."
 single_combat.0041.desc.sc_defender.POD_manipulate_acceleration: "Ta lao tới nhanh hơn mắt thường có thể thấy, hy vọng rằng đối thủ ta không có cách nào đoán trước được động tác của ta."
 single_combat.0041.desc.sc_defender.POD_manipulate_cohesion: "Ta lao tới nhanh hơn mắt thường có thể thấy, hy vọng rằng đối thủ ta không có cách nào đoán trước được động tác của ta."
 single_combat.0041.desc.sc_defender.POD_dragons_breath: "Ta phả ra một luồng lửa khổng lồ về hướng [sc_loser.GetFirstNamePossessiveNoTooltip] khiến [sc_loser.GetHerHim] hoảng loạn."
 single_combat.0041.desc.sc_defender.POD_bark_mudpuppy: "Ta cất giọng và gầm lên với [sc_loser.GetFirstNameNoTooltip] bằng tất cả sức lực, khiến [sc_loser.GetHerHim] run rẩy đủ để phạm phải một sai lầm chí mạng."
 single_combat.0041.desc.sc_defender.POD_clap_of_thunder: "Ta vỗ hai tay vào nhau và một tiếng sấm vang dội bất ngờ làm rung chuyển tận tâm can [sc_loser.GetFirstNameNoTooltip]."
 single_combat.0041.desc.sc_defender.POD_dragon_slash: "Ta lao vào [sc_loser.GetFirstNameNoTooltip] bằng một loạt những nhát chém uyển chuyển, điêu luyện của móng vuốt mình, và phản ứng của [sc_loser.GetHerHis] hoàn toàn vô hiệu."



