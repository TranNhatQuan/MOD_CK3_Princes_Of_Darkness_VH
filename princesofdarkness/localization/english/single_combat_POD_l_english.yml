 single_combat.0031.desc.sc_attacker.POD_spark_of_ra.fatality: "Đòn phản công của đối thủ ta hạ gục ta."
 single_combat.0031.desc.sc_attacker.POD_deaths_hand.fatality: "Họ phản công bằng một đòn đánh mạnh mẽ. Mặt ta va xuống đất khá nhanh."
 single_combat.0031.desc.sc_attacker.POD_ashes_to_ashes.fatality: "Đối thủ ta phản công ta bằng một đòn tấn công mạnh mẽ. Thị lực ta chìm vào bóng tối."
 single_combat.0031.desc.sc_attacker.POD_dust_to_dust.fatality: "Đòn phản công của đối thủ ta trúng đích. Tất cả những gì ta thấy là bóng tối."
 single_combat.0031.desc.sc_attacker.POD_khaibits_embrace.fatality: "Họ phá vỡ cái ôm của ta và hạ gục ta."
 single_combat.0031.desc.sc_attacker.POD_serqets_sting.fatality: "Kẻ địch của ta không hề nao núng, và nhanh chóng hạ gục ta."
 single_combat.0031.desc.sc_attacker.POD_voracious_scarab_of_nyarashahim.fatality: "Đối thủ ta phản công và hạ gục ta."
 single_combat.0031.desc.sc_attacker.POD_spear_of_anubis.fatality: "Ta bị hạ gục bởi đòn phản công của đối thủ ta."
 single_combat.0031.desc.sc_attacker.POD_feral_clawing.fatality: "Đối thủ ta né tránh đòn tấn công của ta và ngay lập tức phản công."
 single_combat.0031.desc.sc_attacker.POD_feral_bite.fatality: "Đối thủ ta né tránh đòn tấn công của ta và ngay lập tức phản công."
