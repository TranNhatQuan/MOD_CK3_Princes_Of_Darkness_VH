 single_combat.0041.desc.opponent_response.POD_extinguish_vitae.injury: "Vì thế, đối thủ của ta đột nhiên cảm thấy yếu đi hẳn và Con Thú đang gầm gừ trong niềm hân hoan chiến thắng dự đoán trước."
