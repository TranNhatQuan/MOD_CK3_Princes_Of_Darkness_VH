 single_combat.0041.desc.opponent_response.POD_prone_attacks.fatality: "Ta sau đó phản công bằng một đòn mạnh. Đầu chúng không thích điều đó, và quyết định rơi xuống sàn để phản đối."
 single_combat.0041.desc.opponent_response.POD_dagger_claw.fatality: "Ta sau đó phản công bằng một đòn mạnh. Đầu chúng không thích điều đó, và quyết định rơi xuống sàn để phản đối."
 single_combat.0041.desc.opponent_response.POD_spark_of_ra.fatality: "Ta phản công bằng một tia lửa của Ra. Đối thủ của ta bị trúng quả cầu lửa, bị thiêu cháy đến chết."
 single_combat.0041.desc.opponent_response.POD_deaths_hand.fatality: "Ta phản công kẻ địch của ta bằng một luồng năng lượng linh hồn. Chúng gục xuống đất."
 single_combat.0041.desc.opponent_response.POD_ashes_to_ashes.fatality: "Ta né đòn tấn công của kẻ địch và niệm một phép thuật để biến da thịt chúng thành tro bụi. Chúng gục xuống đất khi bắt đầu khô héo."
 single_combat.0041.desc.opponent_response.POD_dust_to_dust.fatality: "Ta né đòn tấn công của kẻ địch và chạm vào da chúng. Chúng gục xuống khi da thịt chúng hóa thành đất sét đen."
 single_combat.0041.desc.opponent_response.POD_khaibits_embrace.fatality: "Ta né đòn tấn công của kẻ địch và nắm lấy mặt chúng. Bóng tối nhấn chìm chúng."
 single_combat.0041.desc.opponent_response.POD_serqets_sting.fatality: "Ta phản công bằng dấu hiệu của Serqet. Đối thủ của ta gục xuống vì nọc độc."
 single_combat.0041.desc.opponent_response.POD_voracious_scarab_of_nyarashahim.fatality: "Ta phản công bằng cách thả ra một con bọ hung đói khát. Nó đào sâu vào bên trong chúng khi chúng gục xuống khuất phục."
 single_combat.0041.desc.opponent_response.POD_spear_of_anubis.fatality: "Ta phản công đối thủ của ta bằng cách đánh trúng chúng bằng ngọn giáo của Anubis. Chúng gục xuống đất."
 single_combat.0041.desc.opponent_response.POD_feral_clawing.fatality: "Ta phản công đòn tấn công của đối thủ, hạ gục [my_foe.GetHerHim] bằng móng vuốt trần của ta."
 single_combat.0041.desc.opponent_response.POD_feral_bite.fatality: "Ta né đòn tấn công của kẻ địch, cắn đứt mặt [my_foe.GetHerHis]."
 single_combat.0041.desc.opponent_response.POD_feral_assault.fatality: "Ta phản công đòn tấn công của kẻ địch, điên cuồng tấn công và hạ gục [my_foe.GetHerHim]."
 single_combat.0041.desc.opponent_response.POD_feral_taunt.fatality: "Ta né đòn tấn công của kẻ địch, khiến [my_foe.GetHerHim] mất tập trung bằng lời khiêu khích, rồi hạ gục [my_foe.GetHerHim]."
 single_combat.0041.desc.opponent_response.POD_feral_evasion.fatality: "Ta né tránh các đòn tấn công của kẻ địch, rồi hạ gục [my_foe.GetHerHim]."
 single_combat.0041.desc.opponent_response.POD_jaw_lock.fatality: "Ta phản công đòn tấn công của kẻ địch, cắn vào chân tay [my_foe.GetHerHis] và hạ gục [my_foe.GetHerHim]."
 single_combat.0041.desc.opponent_response.POD_hamstring.fatality: "Ta phản công đòn tấn công của kẻ địch, cắn vào chân tay [my_foe.GetHerHis] và hạ gục [my_foe.GetHerHim]."
 single_combat.0041.desc.opponent_response.POD_leaping_rake.fatality: "Ta né đòn tấn công của kẻ địch, nhảy bổ vào [my_foe.GetHerHim] và hạ gục [my_foe.GetHerHim]."
 single_combat.0041.desc.opponent_response.POD_wishbone.fatality: "Ta phản công đòn tấn công của kẻ địch, xé [my_foe.GetHerHim] thành hai mảnh."
 single_combat.0041.desc.opponent_response.POD_manipulate_inertia.fatality: "Và chúng chẳng có gì cả, đòn tấn công dồn dập của ta chỉ dừng lại khi chỉ còn lại tro tàn trước mắt ta."
 single_combat.0041.desc.opponent_response.POD_manipulate_acceleration.fatality: "Và chúng chẳng có gì cả, đòn tấn công dồn dập của ta chỉ dừng lại khi chỉ còn lại tro tàn trước mắt ta."
 single_combat.0041.desc.opponent_response.POD_manipulate_cohesion.fatality: "Và chúng chẳng có gì cả, đòn tấn công dồn dập của ta chỉ dừng lại khi chỉ còn lại tro tàn trước mắt ta."
 single_combat.0041.desc.opponent_response.POD_dragons_breath.fatality: "Ta tận dụng việc [sc_loser.GetHerHis] quá đà và đâm vào cổ họng [sc_loser.GetHerHis] khi nó vẫn còn phát sáng. Rồng đã bị hạ."
 single_combat.0041.desc.opponent_response.POD_bark_mudpuppy.fatality: "Ta thu hẹp khoảng cách và bịt miệng [sc_loser.GetHerHim] bằng cách bóp nát cổ họng [sc_loser.GetHerHis]. [sc_loser.GetSheHe|U] sẽ không bao giờ hét lên được nữa."
 single_combat.0041.desc.opponent_response.POD_clap_of_thunder.fatality: "Có vẻ như tiếng sấm ảnh hưởng đến [sc_loser.GetHerHim] nhiều hơn là đến ta, và những đòn phản công nhanh nhẹn của ta gần như không gặp phải kháng cự nào. Chỉ trong chốc lát, [sc_victor.Custom('signature_weapon')] của ta cắm sâu vào da thịt, và trận đấu kết thúc."
 single_combat.0041.desc.opponent_response.POD_dragon_slash.fatality: "Gần như quá dễ dàng để bước sang một bên và giáng vũ khí của ta xuống chiếc cổ không được bảo vệ của [sc_loser.GetHerHis]. Phải công nhận cho [sc_loser.GetHerHis], cơ thể [sc_loser.GetHerHis] vẫn tiếp tục trượt về phía trước một đoạn, như một minh chứng cho sức mạnh đằng sau đòn tấn công."


#Aggressor Won, Own Combat Move Feedback
#Example: "I swing my [sc_victor.Custom('signature_weapon')] in an almost lazy feint. My opponent doesn't see my off-hand dagger until it's too late, when it's already"
 single_combat.0041.desc.sc_attacker.POD_bite: "Ta lao về phía trước, cố cắm nanh nhọn của ta vào chiếc cổ mời gọi trước mặt ta."
 single_combat.0041.desc.sc_attacker.POD_blood_surge: "Ta triệu hồi sức mạnh của máu để ban cho ta thêm sức lực."
 single_combat.0041.desc.sc_attacker.POD_blood_heal: "Ta triệu hồi sức mạnh của máu để hàn gắn vết thương và tự chữa lành cho mình."
 single_combat.0041.desc.sc_attacker.POD_blink: "Ta lao về phía trước nhanh hơn cả mắt thường có thể thấy, hy vọng đối thủ của ta không có cách nào lường trước được động tác của ta."
 single_combat.0041.desc.sc_attacker.POD_lightning_strike: "Ta tấn công theo bản năng với sức mạnh của Celerity, cố bắt đối thủ của ta không kịp đề phòng."
 single_combat.0041.desc.sc_attacker.POD_split_second: "Thời gian chậm lại quanh ta khi Celerity phát huy tác dụng. Ta phải tận dụng cơ hội đó."
 single_combat.0041.desc.sc_attacker.POD_unerring_aim: "Nhờ khả năng thành thạo Celerity của ta, đòn tiếp theo của ta chính xác hoàn hảo."
 single_combat.0041.desc.sc_attacker.POD_lethal_body: "Potence cho phép ta lao vào đối thủ với sức mạnh của một trận tuyết lở."
 single_combat.0041.desc.sc_attacker.POD_brutal_feed: "Ta lao về phía cổ, hy vọng rút cạn máu đối thủ của ta chỉ trong vài giây."
 single_combat.0041.desc.sc_attacker.POD_earthshock: "Đánh vào mặt đất, ta khiến chính sàn đất rung chuyển dưới chân chúng ta."
 single_combat.0041.desc.sc_attacker.POD_fist_of_caine: "Nhờ Potence, luồng không khí do các động tác đấm đá của ta tạo ra tự nó đã là một vũ khí chết chóc."
 single_combat.0041.desc.sc_attacker.POD_toughness: "Da thịt ta trở nên đề kháng khác thường, hy vọng chặn được bất kỳ đòn tấn công nào lao tới."
 single_combat.0041.desc.sc_attacker.POD_flesh_of_marble: "Da thịt ta hóa thành đá cẩm thạch siêu nhiên, miễn nhiễm với mọi tổn hại. Hy vọng vậy."
 single_combat.0041.desc.sc_attacker.POD_prowess_from_pain: "Vết thương của ta nuôi dưỡng ta, ta đang mạnh lên theo từng giây."
 single_combat.0041.desc.sc_attacker.POD_feral_weapons: "Móng vuốt của ta vươn ra sẵn sàng chém đôi đối thủ của ta."
 single_combat.0041.desc.sc_attacker.POD_shapechange: "Ta dùng hình dạng thú của mình để nhảy bổ vào đối thủ, nanh nhọn đi trước."
 single_combat.0041.desc.sc_attacker.POD_vanish: "Ta biến mất khỏi tầm nhìn, cố gây rối trí đối thủ của ta."
 single_combat.0041.desc.sc_attacker.POD_nocturne: "Bóng tối cuộn xoáy quanh chiến trường của chúng ta, khiến việc quan sát trở nên khó khăn."
 single_combat.0041.desc.sc_attacker.POD_arms_of_ahriman: "Những xúc tu đen trồi lên từ lòng đất và cố tấn công kẻ địch của ta."
 single_combat.0041.desc.sc_attacker.POD_the_darkness_within: "Bóng tối cuộn xoáy quanh đối thủ của ta, tìm kiếm một sơ hở."
 single_combat.0041.desc.sc_attacker.POD_aegis_of_shadows: "Một bộ giáp bóng tối xuất hiện quanh ta, bảo vệ ta khỏi tổn hại."
 single_combat.0041.desc.sc_attacker.POD_compel: "Ta ra một mệnh lệnh nhanh cho đối thủ của ta."
 single_combat.0041.desc.sc_attacker.POD_terminal_decree: "Ta ra lệnh cho đối thủ của ta tự làm hại bản thân."
 single_combat.0041.desc.sc_attacker.POD_daunt: "Ta trở nên uy nghi hơn, mạnh mẽ hơn, hy vọng đủ để khiến kẻ địch của ta chùn bước."
 single_combat.0041.desc.sc_attacker.POD_dread_gaze: "Ta hiện ra như cơn ác mộng tồi tệ nhất của kẻ địch."
 single_combat.0041.desc.sc_attacker.POD_extinguish_vitae: "Chỉ với một cái vẩy tay, ta khiến máu của đối thủ trở nên bất động."
 single_combat.0041.desc.sc_attacker.POD_scorpions_touch: "Ta rút một ít máu của mình, biến nó thành nọc độc."
 single_combat.0041.desc.sc_attacker.POD_theft_of_vitae: "Ta khiến máu trào ra khỏi miệng kẻ địch rồi dẫn nó về phía ta."
 single_combat.0041.desc.sc_attacker.POD_baals_curse: "Ta rút một ít máu của mình và biến nó thành một loại nọc độc cực kỳ hung hãn."
 single_combat.0041.desc.sc_attacker.POD_cauldron_of_blood: "Chỉ với một cái vẩy tay, ta khiến máu của đối thủ sôi sục trong chính huyết quản của chúng."
 single_combat.0041.desc.sc_attacker.POD_touch_of_oblivion: "Ta chạm vào đối thủ của ta và truyền qua chúng sức mạnh entropy thô sơ của Oblivion."
 single_combat.0041.desc.sc_attacker.POD_stygian_shroud: "Ta trải rộng một bóng tối ngột ngạt trên một khu vực rộng lớn, làm câm lặng âm thanh và ức chế mọi giác quan khác."
 single_combat.0041.desc.sc_attacker.POD_fire_torch: "Ta hy vọng vào một cơ may khi vung ngọn đuốc của mình một cách điên cuồng."
 single_combat.0041.desc.sc_attacker.POD_fire_bombs: "Ta phóng ngọn lửa giả kim về phía đối thủ của ta."
 single_combat.0041.desc.sc_attacker.POD_fire_spewer: "Cỗ máy kỳ lạ đó phun ra lửa một cách bừa bãi."
 single_combat.0041.desc.sc_attacker.POD_crossbow_shot: "Phát bắn được khai hỏa, tìm kiếm mục tiêu của nó."
 single_combat.0041.desc.sc_attacker.POD_unleash_dogs: "Bầy chó lao về phía kẻ địch của ta, khát máu và thịt."
 single_combat.0041.desc.sc_attacker.POD_stake_attack: "Ta lao tới, cọc nhọn đi trước."
 single_combat.0041.desc.sc_attacker.POD_oculi_trust: "Lời của Chúa được cất lên, khiến kẻ địch của ta cảm thấy khiếp sợ."
 single_combat.0041.desc.sc_attacker.POD_oculi_wine: "Ta lao về phía đối thủ, tìm cách tiếp xúc để lời nguyền của ta bám lấy."
 single_combat.0041.desc.sc_attacker.POD_acre_catechumen: "Lời của Chúa được cất lên, ban cho ta sức mạnh."
 single_combat.0041.desc.sc_attacker.POD_acre_flesh: "Lời của Chúa được cất lên, ban cho ta sức bền."
 single_combat.0041.desc.sc_attacker.POD_acre_flight: "Được Đấng Thiêng Liêng ban phước, ta nhanh hơn bao giờ hết."
 single_combat.0041.desc.sc_attacker.POD_acre_auto: "Ta chuẩn bị sẵn sàng cho điều có thể là đòn cuối cùng."
 single_combat.0041.desc.sc_attacker.POD_murnau_mirror: "Tấm gương của Chúa chỉ cho ta con đường để sánh ngang sức mạnh của con quái vật này."
 single_combat.0041.desc.sc_attacker.POD_murnau_arcana: "Ta chuẩn bị để giành lấy quyền kiểm soát sức mạnh của con quái vật."
 single_combat.0041.desc.sc_attacker.POD_sisters_hosanna: "Ta hát vang vinh quang của Chúa, tràn đầy sức mạnh."
 single_combat.0041.desc.sc_attacker.POD_sisters_oratorio: "Ta hát vang vinh quang của Chúa, khiến kẻ địch của ta tràn ngập kinh hoàng."
 single_combat.0041.desc.sc_attacker.POD_bone_obedience: "Xương của ta bắt đầu trở nên không thể phá vỡ."
 single_combat.0041.desc.sc_attacker.POD_five_poison_cloud: "Năng lượng Âm đen tối của đám mây lao về phía kẻ địch của ta."
 single_combat.0041.desc.sc_attacker.POD_ching_shih: "Hình dạng quái vật khủng khiếp giờ đã thuộc về ta"
 single_combat.0041.desc.sc_attacker.POD_long_neck: "Ta vươn dài chân tay, cho ta tầm với vô hạn."
 single_combat.0041.desc.sc_attacker.POD_bloodlash: "Một xúc tu máu được tạo ra, mang lại cho ta những cơ hội mới."
 single_combat.0041.desc.sc_attacker.POD_goblin_scorch: "Ngọn lửa linh hồn lao về phía đối thủ của ta."
 single_combat.0041.desc.sc_attacker.POD_goblin_lantern: "Ta biến thành một quả cầu lửa phát sáng."
 single_combat.0041.desc.sc_attacker.POD_bone_dance: "Điệu nhảy được hoàn thành, tạo ra một tấm màn uể oải trong khu vực."
 single_combat.0041.desc.sc_attacker.POD_dragon_dance: "Điệu nhảy đã hoàn tất, và cơn mê hoặc đã bắt đầu."
 single_combat.0041.desc.sc_attacker.POD_chi_interrupt: "Ta lao vào đối thủ, tìm kiếm các huyệt đạo Khí trọng yếu của chúng."
 single_combat.0041.desc.sc_attacker.POD_thousand_hell_stare: "Đau đớn, giận dữ và tuyệt vọng đột nhiên bao trùm linh hồn đối thủ của ta."
 single_combat.0041.desc.sc_attacker.POD_wind_attack: "Ngọn gió đã nổi lên, và ta nhanh hơn bao giờ hết."
 single_combat.0041.desc.sc_attacker.POD_demon_claws: "Ta là con quỷ và nó là ta. Chúng ta sẽ chiến thắng."
 single_combat.0041.desc.sc_attacker.POD_tormented_essence: "Đau đớn, giận dữ và tuyệt vọng đột nhiên bao trùm linh hồn đối thủ của ta."
 single_combat.0041.desc.sc_attacker.POD_adramelechs_wrath: "Ta là con quỷ và nó là ta. Chúng ta sẽ chiến thắng."
 single_combat.0041.desc.sc_attacker.POD_blood_atemi: "Ta lao vào đối thủ, cố khiến hệ tuần hoàn của chúng rối loạn."
 single_combat.0041.desc.sc_attacker.POD_stand_upon_the_dragons_back: "Ta dẫn Khí từ những dòng chảy tự nhiên của Đất vào cơ thể ta."
 single_combat.0041.desc.sc_attacker.POD_dragon_ward: "Ta mở rộng con mắt thứ ba và dẫn Khí của ta vào một lá bùa hộ mệnh bảo vệ mạnh mẽ."
 single_combat.0041.desc.sc_attacker.POD_typhonic_maw: "Ta há rộng hàm đủ để nuốt trọn đối thủ của ta."
 single_combat.0041.desc.sc_attacker.POD_cobra_fangs: "Nanh của ta trở nên có độc, tìm đường xâm nhập vào da thịt đối thủ của ta."
 single_combat.0041.desc.sc_attacker.POD_snout_strike: "Ta cố thực hiện một cú đấm ngắn, hiểm hóc, hoặc có thể là một cú chộp, vào mõm."
 single_combat.0041.desc.sc_attacker.POD_chi_breaker: "Ta cố đẩy một tay vào thân đối thủ và làm rối loạn dòng chảy tự nhiên của Khí bên trong cơ thể đối thủ."
 single_combat.0041.desc.sc_attacker.POD_hundred_star_shower: "Ta nạp năng lượng sinh mệnh của chính mình vào các phi tiêu."
 single_combat.0041.desc.sc_attacker.POD_jaw_hammer: "Ta cố thực hiện một đòn mạnh nhằm đánh vỡ xương hàm đối thủ của ta."
 single_combat.0041.desc.sc_attacker.POD_fading_light_strike: "Ta cố đánh cắp sức mạnh từ đối thủ của ta."
 single_combat.0041.desc.sc_attacker.POD_chain_snake: "Ta cố chặn đòn tấn công của đối thủ trong khi bắt lấy chi đang tấn công."
 single_combat.0041.desc.sc_attacker.POD_twisting_thrust: "Ta cố cắt sâu vào cơ thể đối thủ của ta."
 single_combat.0041.desc.sc_attacker.POD_prone_attacks: "Ta ngã sấp mặt xuống.."
 single_combat.0041.desc.sc_attacker.POD_dagger_claw: "Ta xòe rộng các ngón tay của cả hai bàn tay và đâm chúng vào bụng dưới của đối thủ."
 single_combat.0041.desc.sc_attacker.POD_spark_of_ra: "Ta ném một quả cầu lửa đã được đốt cháy vào đối thủ của ta."
 single_combat.0041.desc.sc_attacker.POD_deaths_hand: "Ta giơ lòng bàn tay để bắn kẻ địch của ta bằng năng lượng linh hồn."
 single_combat.0041.desc.sc_attacker.POD_ashes_to_ashes: "Ta niệm một phép thuật để biến kẻ địch của ta thành Tro Bụi."
 single_combat.0041.desc.sc_attacker.POD_dust_to_dust: "Ta di chuyển để chạm vào đối thủ và biến da thịt chúng thành đất sét đen."
 single_combat.0041.desc.sc_attacker.POD_khaibits_embrace: "Ta cố chộp lấy mặt đối thủ của ta và nhấn chìm chúng trong bóng tối."
 single_combat.0041.desc.sc_attacker.POD_serqets_sting: "Ta tạo dấu hiệu bọ cạp và chích đối thủ của ta bằng nọc độc."
 single_combat.0041.desc.sc_attacker.POD_voracious_scarab_of_nyarashahim: "Ta thả ra một con bọ hung để nuốt chửng đối thủ của ta."
 single_combat.0041.desc.sc_attacker.POD_spear_of_anubis: "Ta tấn công kẻ địch của ta bằng một ngọn giáo bóng tối."
 single_combat.0041.desc.sc_attacker.POD_feral_clawing: "Ta vung móng vuốt vào kẻ địch của ta."
 single_combat.0041.desc.sc_attacker.POD_feral_bite: "Ta cắn xé đối thủ của ta."
 single_combat.0041.desc.sc_attacker.POD_feral_assault: "Ta điên cuồng lao vào đối thủ của ta, vung chân tay và cắn xé."
 single_combat.0041.desc.sc_attacker.POD_feral_taunt: "Ta cố làm mất thăng bằng kẻ địch của ta bằng cách khiêu khích."
 single_combat.0041.desc.sc_attacker.POD_feral_evasion: "Ta né tránh các đòn tấn công của kẻ địch."
 single_combat.0041.desc.sc_attacker.POD_jaw_lock: "Ta khóa chặt chân đối thủ tại một chỗ."
 single_combat.0041.desc.sc_attacker.POD_hamstring: "Ta cắn xé chân tay kẻ địch của ta."
 single_combat.0041.desc.sc_attacker.POD_leaping_rake: "Ta đột ngột nhảy bổ vào đối thủ, cố đâm xuyên chúng bằng móng vuốt của ta."
 single_combat.0041.desc.sc_attacker.POD_wishbone: "Dùng hết sức lực, ta cố xé đối thủ của ta ra từng mảnh."
 single_combat.0041.desc.sc_attacker.POD_manipulate_inertia: "Ta lao về phía trước nhanh hơn cả mắt thường có thể thấy, hy vọng đối thủ của ta không có cách nào lường trước được động tác của ta."
 single_combat.0041.desc.sc_attacker.POD_manipulate_acceleration: "Ta lao về phía trước nhanh hơn cả mắt thường có thể thấy, hy vọng đối thủ của ta không có cách nào lường trước được động tác của ta."
 single_combat.0041.desc.sc_attacker.POD_manipulate_cohesion: "Ta lao về phía trước nhanh hơn cả mắt thường có thể thấy, hy vọng đối thủ của ta không có cách nào lường trước được động tác của ta."
 single_combat.0041.desc.sc_attacker.POD_dragons_breath: "Ta hít thật sâu và thở ra một luồng lửa khổng lồ thẳng vào [sc_loser.GetFirstNameNoTooltip]."
 single_combat.0041.desc.sc_attacker.POD_bark_mudpuppy: "Ta cất cao giọng và gầm lên về phía [sc_loser.GetFirstNameNoTooltip] hết sức có thể, dồn một tiếng hét đơn lẻ thành một vũ khí xé toạc da thịt."
 single_combat.0041.desc.sc_attacker.POD_clap_of_thunder: "Ta vỗ hai tay vào nhau và một tiếng sấm vang dội bất ngờ khiến [sc_loser.GetFirstNameNoTooltip] choáng váng hoàn toàn."
 single_combat.0041.desc.sc_attacker.POD_dragon_slash: "Nhớ lại quá trình huấn luyện của mình, ta lao vào [sc_loser.GetFirstNameNoTooltip] bằng một loạt động tác chém uyển chuyển, điêu luyện bằng móng vuốt của ta, kết hợp kỹ năng điềm tĩnh với sức mạnh thô sơ."


#Aggressor Won, Own Combat Move Injury
#Example: "sailing pommel-first for [sc_loser.GetHerHis] [sc_loser.Custom('MaskFace')].\n\nThe blow impacts [sc_loser.GetFirstNameNoTooltip] #EMP hard#!, slamming so deep I swear I can feel the bone bruise, and [sc_loser.GetSheHe] staggers backwards in a daze.\n\nWhen the [sc_loser.Custom('signature_weapon')] drops from [sc_loser.GetHerHis] hand, my opponent stammers out a yield without me needing to do anything."
 single_combat.0041.desc.sc_attacker.POD_bite.injury: "Và nó trúng đích, hương máu say lòng lan tỏa trong không khí. Họ vừa kịp thoát khỏi cái ôm chết chóc này trước khi quá muộn."
 single_combat.0041.desc.sc_attacker.POD_blood_surge.injury: "Ta thấy mình cao lớn và mạnh mẽ hơn, được máu tiếp thêm sức mạnh. Ta nhanh chóng thừa thế tấn công."
 single_combat.0041.desc.sc_attacker.POD_blood_heal.injury: "Mọi vết thương của ta biến mất trước mắt khi sức mạnh của máu chữa lành cho ta. Ta nhanh chóng thừa thế tấn công."
 single_combat.0041.desc.sc_attacker.POD_blink.injury: "Và họ chẳng còn gì, chẳng mấy chốc chỉ còn cách chật vật hồi phục sau đợt tấn công dồn dập của ta."
 single_combat.0041.desc.sc_attacker.POD_lightning_strike.injury: "Ta làm vậy, kẻ địch của ta chẳng mấy chốc bị đẩy lùi bởi đòn tấn công bất ngờ này."
 single_combat.0041.desc.sc_attacker.POD_split_second.injury: "Đối thủ của ta chưa kịp chuẩn bị đủ, và một đòn mạnh giáng xuống, quá nhanh để né tránh bởi cảm nhận thời gian méo mó của họ."
 single_combat.0041.desc.sc_attacker.POD_unerring_aim.injury: "Đối thủ của ta chẳng thể làm gì ngoài việc chịu trận, cảm nhận thịt da bất tử của mình phản kháng trước sự đối xử tàn tệ này."
 single_combat.0041.desc.sc_attacker.POD_lethal_body.injury: "Đối thủ của ta chẳng mấy chốc chật vật đứng dậy, cảm giác như cả một căn nhà sụp đổ đè lên người họ."
 single_combat.0041.desc.sc_attacker.POD_brutal_feed.injury: "Đối thủ của ta thoát khỏi cái ôm chết chóc này, nhưng không phải trước khi đã cảm nhận cơn đau nhói do răng nanh của ta gây ra."
 single_combat.0041.desc.sc_attacker.POD_earthshock.injury: "Đối thủ của ta ngã xuống và ta tận dụng cơ hội này để tấn công tàn bạo. Họ vừa kịp tránh được đòn nhắm vào cổ."
 single_combat.0041.desc.sc_attacker.POD_fist_of_caine.injury: "Cơn bão này như những lưỡi dao trên da thịt họ, cắt xẻ những mảng lớn thịt da bất tử với mỗi chuyển động."
 single_combat.0041.desc.sc_attacker.POD_toughness.injury: "Dường như chẳng có gì có thể xuyên thủng hàng phòng thủ của ta. Đối thủ của ta kiệt sức khi cố xuyên phá."
 single_combat.0041.desc.sc_attacker.POD_flesh_of_marble.injury: "Dường như chẳng có gì có thể xuyên thủng hàng phòng thủ của ta. Đối thủ của ta kiệt sức khi cố xuyên phá."
 single_combat.0041.desc.sc_attacker.POD_prowess_from_pain.injury: "Được tiếp sức bởi năng lực khủng khiếp này, ta giáng một đòn mạnh khiến đối thủ loạng choạng lùi lại."
 single_combat.0041.desc.sc_attacker.POD_feral_weapons.injury: "Và điều đó suýt xảy ra, khi đối thủ của ta vừa kịp tránh được một cú vụt chí mạng nhắm vào họ."
 single_combat.0041.desc.sc_attacker.POD_shapechange.injury: "Bất ngờ trước sự biến đổi đột ngột này, đối thủ của ta bị đánh trúng và phải điên cuồng đẩy lùi con quái vật mà ta đã hóa thân."
 single_combat.0041.desc.sc_attacker.POD_vanish.injury: "Vì vậy, đối thủ của ta không thấy đòn tiếp theo ập đến từ phía sau lưng họ. Và nó đau đấy."
 single_combat.0041.desc.sc_attacker.POD_nocturne.injury: "Vì vậy, đối thủ của ta không thấy đòn tiếp theo ập đến từ phía sau lưng họ. Và nó đau đấy."
 single_combat.0041.desc.sc_attacker.POD_arms_of_ahriman.injury: "Đối thủ của ta né được một trong số chúng nhưng không né được cái thứ hai... và những thứ này đau lắm."
 single_combat.0041.desc.sc_attacker.POD_the_darkness_within.injury: "Chúng đột ngột nhảy vào miệng đối thủ của ta, và họ phải dùng hết ý chí để tống chúng ra ngoài."
 single_combat.0041.desc.sc_attacker.POD_aegis_of_shadows.injury: "Dường như chẳng có gì có thể xuyên thủng hàng phòng thủ của ta. Đối thủ của ta kiệt sức khi cố xuyên phá."
 single_combat.0041.desc.sc_attacker.POD_compel.injury: "Nó khiến kẻ địch của ta mất cảnh giác, và họ chẳng mấy chốc phải hồi phục sau một đòn giáng xuống trong lúc họ mất tập trung."
 single_combat.0041.desc.sc_attacker.POD_terminal_decree.injury: "Điều mà họ ngoan ngoãn làm theo, trước tiên là cảm thấy nhục nhã rồi mới đến đau đớn."
 single_combat.0041.desc.sc_attacker.POD_daunt.injury: "Nó khiến kẻ địch của ta mất cảnh giác, và họ chẳng mấy chốc phải hồi phục sau một đòn giáng xuống trong lúc họ mất tập trung."
 single_combat.0041.desc.sc_attacker.POD_dread_gaze.injury: "Nó khiến kẻ địch của ta mất cảnh giác, và họ chẳng mấy chốc phải hồi phục sau một đòn giáng xuống trong lúc họ mất tập trung."
 single_combat.0041.desc.sc_attacker.POD_extinguish_vitae.injury: "Vì vậy, đối thủ của ta đột nhiên cảm thấy yếu đi hẳn và Dã Thú đang gầm gừ trong niềm hân hoan chiến thắng đã dự đoán trước."
 single_combat.0041.desc.sc_attacker.POD_scorpions_touch.injury: "Bị trúng đòn, kẻ địch của ta cảm thấy khó chịu và cử động chậm chạp hẳn đi."
 single_combat.0041.desc.sc_attacker.POD_theft_of_vitae.injury: "Kẻ địch của ta bất lực không thể ngăn cản, dòng máu quý giá của họ giờ là của ta!"
 single_combat.0041.desc.sc_attacker.POD_baals_curse.injury: "Bị trúng đòn, kẻ địch của ta cảm thấy khó chịu và cử động chậm chạp hẳn đi."
 single_combat.0041.desc.sc_attacker.POD_cauldron_of_blood.injury: "Nó bỏng rát, nó bỏng rát!"
 single_combat.0041.desc.sc_attacker.POD_touch_of_oblivion.injury: "Máu của đối thủ ta đột nhiên trộn lẫn với những bóng tối hung hãn đang cố chiếm quyền kiểm soát. Không phải một trải nghiệm dễ chịu."
 single_combat.0041.desc.sc_attacker.POD_stygian_shroud.injury: "Vì vậy, đối thủ của ta không thấy đòn tiếp theo ập đến từ phía sau lưng họ. Và nó đau đấy."
 single_combat.0041.desc.sc_attacker.POD_fire_torch.injury: "Đối thủ của ta vừa kịp né tránh, nhưng không phải trước khi một phần lửa đã thiêu đốt da thịt họ."
 single_combat.0041.desc.sc_attacker.POD_fire_bombs.injury: "Đối thủ của ta vừa kịp né tránh, nhưng không phải trước khi một phần lửa đã thiêu đốt da thịt họ."
 single_combat.0041.desc.sc_attacker.POD_fire_spewer.injury: "Đối thủ của ta vừa kịp né tránh, nhưng không phải trước khi một phần lửa đã thiêu đốt da thịt họ."
 single_combat.0041.desc.sc_attacker.POD_crossbow_shot.injury: "Nó đánh trúng kẻ địch của ta với một tiếng động vang dội, và họ bị đánh lùi trong hiệp này."
 single_combat.0041.desc.sc_attacker.POD_unleash_dogs.injury: "Đối thủ của ta xử lý chúng, nhưng không đủ nhanh, chúng vẫn kịp cắn xé họ trong chốc lát."
 single_combat.0041.desc.sc_attacker.POD_stake_attack.injury: "Cây cọc trượt khỏi tim đối thủ của ta, nhưng vẫn sượt qua họ khá đau đớn."
 single_combat.0041.desc.sc_attacker.POD_oculi_trust.injury: "Vì vậy, kẻ địch của ta không thể tránh được đòn tấn công tiếp theo nhắm vào họ."
 single_combat.0041.desc.sc_attacker.POD_oculi_wine.injury: "Đối thủ của ta bị thương, và một phần da thịt họ hóa thành tro trước khi họ kịp tự gỡ rối."
 single_combat.0041.desc.sc_attacker.POD_acre_catechumen.injury: "Đòn tiếp theo giáng vào kẻ địch của ta đặc biệt đau đớn."
 single_combat.0041.desc.sc_attacker.POD_acre_flesh.injury: "Đối thủ của ta không thể phá vỡ hàng phòng thủ của ta, và đòn phản công thật đau đớn."
 single_combat.0041.desc.sc_attacker.POD_acre_flight.injury: "Vì vậy, đối thủ của ta không thể tránh được đòn tấn công tiếp theo nhắm vào họ."
 single_combat.0041.desc.sc_attacker.POD_acre_auto.injury: "Không hẳn vậy, nhưng nó vẫn là một đòn rất đau đớn khi kẻ địch của ta lùi lại vì nó."
 single_combat.0041.desc.sc_attacker.POD_murnau_mirror.injury: "Vì vậy, kẻ địch của ta không thể tránh được đòn tấn công tiếp theo nhắm vào họ."
