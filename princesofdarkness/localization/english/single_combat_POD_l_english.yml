#Example: "Thinking quickly, I slam my [sc_victor.Custom('signature_weapon')]'s [sc_victor.Custom('SignatureWeaponEndType')] into [sc_victor.GetHerHis] other hand on my back-swing, sending the hidden blade flying off.\n\nNot wanting to risk more trickery, I move to [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]. [sc_loser.GetFirstNameNoTooltip] only narrowly avoids a messy death with one of the fastest yields I've ever seen."
 single_combat.0041.desc.opponent_response.POD_bite.injury: "Và nó trúng đích, mùi máu say lòng người lan tỏa trong không khí. Chúng chỉ vừa kịp thoát khỏi vòng ôm chết chóc này trước khi quá muộn."
 single_combat.0041.desc.opponent_response.POD_blood_surge.injury: "Ta có thể thấy mình đứng cao hơn và mạnh mẽ hơn, được sức mạnh của máu tiếp thêm sinh lực. Ta nhanh chóng thừa thế tấn công."
 single_combat.0041.desc.opponent_response.POD_blood_heal.injury: "Mọi vết thương của ta biến mất trước mắt khi sức mạnh của máu chữa lành cho ta. Ta nhanh chóng thừa thế tấn công."
 single_combat.0041.desc.opponent_response.POD_blink.injury: "Và chúng chẳng có gì cả, chẳng mấy chốc đã phải chật vật gượng dậy sau đòn tấn công dồn dập của ta."
 single_combat.0041.desc.opponent_response.POD_lightning_strike.injury: "Ta làm vậy, kẻ địch của ta chẳng mấy chốc bị đẩy lùi bởi đòn tấn công bất ngờ này."
 single_combat.0041.desc.opponent_response.POD_split_second.injury: "Đối thủ của ta chưa chuẩn bị đủ kỹ, và một đòn mạnh giáng xuống, quá nhanh để né tránh bằng cảm nhận thời gian bị bóp méo của chúng."
 single_combat.0041.desc.opponent_response.POD_unerring_aim.injury: "Đối thủ của ta chẳng thể làm gì ngoài chịu trận, cảm nhận da thịt bất tử của chúng phản kháng lại sự đối xử tàn tệ này."
 single_combat.0041.desc.opponent_response.POD_lethal_body.injury: "Đối thủ của ta chẳng mấy chốc gượng dậy khó khăn, cảm giác như cả một căn nhà vừa sập xuống người chúng."
 single_combat.0041.desc.opponent_response.POD_brutal_feed.injury: "Đối thủ của ta thoát được khỏi vòng ôm chết chóc này, nhưng không phải trước khi cảm nhận cơn đau nhói do nanh của ta gây ra."
 single_combat.0041.desc.opponent_response.POD_earthshock.injury: "Đối thủ của ta ngã xuống và ta tận dụng cơ hội này để tấn công tàn bạo. Chúng vừa vặn né được đòn nhắm vào cổ."
 single_combat.0041.desc.opponent_response.POD_fist_of_caine.injury: "Cơn bão này như những lưỡi dao đâm vào da chúng, cắt xẻ những mảng lớn thịt bất tử theo từng cử động."
 single_combat.0041.desc.opponent_response.POD_toughness.injury: "Dường như chẳng có gì có thể xuyên thủng hàng phòng thủ của ta. Đối thủ của ta kiệt sức khi cố gắng phá vỡ nó."
 single_combat.0041.desc.opponent_response.POD_flesh_of_marble.injury: "Dường như chẳng có gì có thể xuyên thủng hàng phòng thủ của ta. Đối thủ của ta kiệt sức khi cố gắng phá vỡ nó."
 single_combat.0041.desc.opponent_response.POD_prowess_from_pain.injury: "Được tiếp sức bởi năng lực khủng khiếp này, ta giáng một đòn mạnh khiến đối thủ loạng choạng lùi lại."
 single_combat.0041.desc.opponent_response.POD_feral_weapons.injury: "Và điều đó suýt xảy ra, khi đối thủ của ta vừa vặn tránh được một đòn chém chắc chắn gây tử vong lao tới."
 single_combat.0041.desc.opponent_response.POD_shapechange.injury: "Bất ngờ trước sự biến đổi đột ngột này, đối thủ của ta bị trúng đòn và phải điên cuồng đẩy lùi con quái vật mà ta đã hóa thành."
 single_combat.0041.desc.opponent_response.POD_vanish.injury: "Vì thế, đối thủ của ta không thấy đòn tiếp theo lao tới từ phía sau lưng chúng. Và nó gây đau đớn."
 single_combat.0041.desc.opponent_response.POD_nocturne.injury: "Vì thế, đối thủ của ta không thấy đòn tiếp theo lao tới từ phía sau lưng chúng. Và nó gây đau đớn."
 single_combat.0041.desc.opponent_response.POD_arms_of_ahriman.injury: "Đối thủ của ta tránh được một trong số chúng nhưng không tránh được cái thứ hai... và những thứ này gây đau đớn."
 single_combat.0041.desc.opponent_response.POD_the_darkness_within.injury: "Chúng đột ngột nhảy vào miệng đối thủ của ta, và chúng phải dùng hết ý chí để tống chúng ra ngoài."
