#Combat Descs

#Own Combat Move Feedback
#Example: "My [myself.Custom('signature_weapon')] makes a [myself.Custom('SignatureWeaponAttemptedLight')] one way, only for me to draw a fresh dagger with my off-hand and lunge at [my_foe.GetFirstNameNoTooltip] as [my_foe.GetSheHe] attempts to parry."
 single_combat.0001.desc.my_feedback.POD_bite: "Tôi lao tới, cố cắm những chiếc răng nanh sắc nhọn của mình vào chiếc cổ mời gọi trước mặt."
 single_combat.0001.desc.my_feedback.POD_blood_surge: "Tôi triệu hồi sức mạnh từ dòng máu của mình để tiếp thêm sức lực."
 single_combat.0001.desc.my_feedback.POD_blood_heal: "Tôi triệu hồi sức mạnh từ dòng máu của mình để hàn gắn vết thương và tự chữa lành."
 single_combat.0001.desc.my_feedback.POD_blink: "Tôi lao về phía trước nhanh hơn cả mắt thường có thể thấy, hy vọng đối thủ không cách nào lường trước được động tác của tôi."
 single_combat.0001.desc.my_feedback.POD_lightning_strike: "Tôi ra đòn theo bản năng với sức mạnh của Celerity, cố bắt đối thủ không kịp phòng bị."
 single_combat.0001.desc.my_feedback.POD_split_second: "Thời gian chậm lại quanh tôi khi Celerity phát huy tác dụng. Tôi phải tận dụng cơ hội đó."
 single_combat.0001.desc.my_feedback.POD_unerring_aim: "Nhờ sự tinh thông Celerity của mình, đòn kế tiếp của tôi sẽ trúng đích tuyệt đối."
 single_combat.0001.desc.my_feedback.POD_lethal_body: "Potence cho phép tôi lao vào đối thủ với sức mạnh của một trận tuyết lở."
 single_combat.0001.desc.my_feedback.POD_brutal_feed: "Tôi lao tới nhắm vào cổ, hy vọng rút cạn máu đối thủ chỉ trong vài giây."
 single_combat.0001.desc.my_feedback.POD_earthshock: "Đập xuống mặt đất, tôi khiến cả sàn đất rung chuyển dưới chân chúng tôi."
 single_combat.0001.desc.my_feedback.POD_fist_of_caine: "Nhờ Potence, luồng không khí bị cuốn theo các đòn đấm của tôi tự nó đã là một vũ khí chết người."
 single_combat.0001.desc.my_feedback.POD_toughness: "Da thịt tôi trở nên bền bỉ khác thường, hy vọng chặn được mọi đòn đánh sắp tới."
 single_combat.0001.desc.my_feedback.POD_flesh_of_marble: "Da thịt tôi hóa thành đá cẩm thạch siêu nhiên, không gì tổn hại được. Hy vọng là vậy."
 single_combat.0001.desc.my_feedback.POD_prowess_from_pain: "Vết thương nuôi dưỡng tôi, tôi đang mạnh lên từng giây."
 single_combat.0001.desc.my_feedback.POD_feral_weapons: "Móng vuốt tôi giương ra, sẵn sàng chẻ đôi đối thủ."
 single_combat.0001.desc.my_feedback.POD_shapechange: "Tôi dùng hình dạng thú vật của mình để nhảy bổ vào đối thủ, răng nanh đi trước."
 single_combat.0001.desc.my_feedback.POD_vanish: "Tôi biến mất khỏi tầm mắt, cố làm đối thủ hoang mang."
 single_combat.0001.desc.my_feedback.POD_nocturne: "Bóng tối cuộn xoáy quanh chiến trường của chúng tôi, khiến tầm nhìn trở nên khó khăn."
 single_combat.0001.desc.my_feedback.POD_arms_of_ahriman: "Những xúc tu đen từ lòng đất trồi lên, cố tấn công kẻ thù của tôi."
 single_combat.0001.desc.my_feedback.POD_the_darkness_within: "Bóng tối cuộn xoáy quanh đối thủ của tôi, tìm kiếm một sơ hở."
 single_combat.0001.desc.my_feedback.POD_aegis_of_shadows: "Một lớp giáp bóng tối hiện ra quanh tôi, bảo vệ tôi khỏi tổn hại."
 single_combat.0001.desc.my_feedback.POD_compel: "Tôi ra một mệnh lệnh nhanh chóng cho đối thủ."
 single_combat.0001.desc.my_feedback.POD_terminal_decree: "Tôi ra lệnh cho đối thủ tự làm hại bản thân."
 single_combat.0001.desc.my_feedback.POD_daunt: "Tôi trở nên uy nghi hơn, quyền lực hơn, hy vọng đủ để làm kẻ thù chùn bước."
 single_combat.0001.desc.my_feedback.POD_dread_gaze: "Tôi hiện ra như cơn ác mộng tồi tệ nhất của kẻ thù."
 single_combat.0001.desc.my_feedback.POD_extinguish_vitae: "Chỉ với một cái vẫy tay, tôi khiến máu của đối thủ trở nên trơ ì."
 single_combat.0001.desc.my_feedback.POD_scorpions_touch: "Tôi rút một ít máu của mình, biến nó thành chất độc."
 single_combat.0001.desc.my_feedback.POD_theft_of_vitae: "Tôi khiến máu trào ra khỏi miệng kẻ thù rồi dẫn nó về phía mình."
 single_combat.0001.desc.my_feedback.POD_baals_curse: "Tôi rút một ít máu của mình và biến nó thành một loại độc cực kỳ hung hãn."
 single_combat.0001.desc.my_feedback.POD_cauldron_of_blood: "Chỉ với một cái vẫy tay, tôi khiến máu của đối thủ sôi lên trong chính huyết quản của họ."
 single_combat.0001.desc.my_feedback.POD_touch_of_oblivion: "Tôi chạm vào đối thủ và dẫn truyền qua họ sức mạnh nguyên thủy của entropy từ Oblivion."
 single_combat.0001.desc.my_feedback.POD_stygian_shroud: "Tôi trải một màn bóng tối ngột ngạt ra khắp một vùng rộng lớn, bóp nghẹt âm thanh và triệt tiêu mọi giác quan khác."
 single_combat.0001.desc.my_feedback.POD_fire_torch: "Tôi trông chờ một chút may mắn trong lúc vung ngọn đuốc điên cuồng."
 single_combat.0001.desc.my_feedback.POD_fire_bombs: "Tôi phóng ngọn lửa giả kim về phía đối thủ."
 single_combat.0001.desc.my_feedback.POD_fire_spewer: "Cỗ máy kỳ lạ phun lửa loạn xạ."
 single_combat.0001.desc.my_feedback.POD_crossbow_shot: "Phát bắn được khai hỏa, tìm kiếm mục tiêu của nó."
 single_combat.0001.desc.my_feedback.POD_unleash_dogs: "Lũ chó lao về phía kẻ thù của tôi, khát khao máu thịt."
 single_combat.0001.desc.my_feedback.POD_stake_attack: "Tôi lao tới, cọc gỗ đi trước."
 single_combat.0001.desc.my_feedback.POD_oculi_trust: "Lời của Chúa được cất lên, khiến kẻ thù của tôi tràn ngập sợ hãi."
 single_combat.0001.desc.my_feedback.POD_oculi_wine: "Tôi lao về phía đối thủ, tìm cách tiếp xúc để lời nguyền của tôi bén rễ."
 single_combat.0001.desc.my_feedback.POD_acre_catechumen: "Lời của Chúa được cất lên, khiến tôi tràn ngập sức mạnh."
 single_combat.0001.desc.my_feedback.POD_acre_flesh: "Lời của Chúa được cất lên, khiến tôi tràn ngập sức bền."
 single_combat.0001.desc.my_feedback.POD_acre_flight: "Được Đấng Thiêng Liêng ban phước, tôi nhanh hơn bao giờ hết."
 single_combat.0001.desc.my_feedback.POD_acre_auto: "Tôi chuẩn bị tinh thần cho điều có thể là đòn kết liễu."
 single_combat.0001.desc.my_feedback.POD_murnau_mirror: "Tấm gương của Chúa chỉ cho tôi con đường để sánh ngang sức mạnh của con quái vật này."
 single_combat.0001.desc.my_feedback.POD_murnau_arcana: "Tôi chuẩn bị tinh thần để chiếm quyền kiểm soát sức mạnh của con quái vật."
 single_combat.0001.desc.my_feedback.POD_sisters_hosanna: "Tôi hát vang vinh quang của Chúa, tràn đầy sức mạnh."
 single_combat.0001.desc.my_feedback.POD_sisters_oratorio: "Tôi hát vang vinh quang của Chúa, khiến kẻ thù tràn ngập kinh hoàng."
 single_combat.0001.desc.my_feedback.POD_bone_obedience: "Xương cốt tôi bắt đầu trở nên không thể gãy vỡ."
 single_combat.0001.desc.my_feedback.POD_five_poison_cloud: "Năng lượng Âm đen tối của đám mây lao thẳng về phía kẻ thù."
 single_combat.0001.desc.my_feedback.POD_ching_shih: "Hình dạng quái vật khủng khiếp nay đã thuộc về tôi"
 single_combat.0001.desc.my_feedback.POD_long_neck: "Tôi kéo dài tứ chi, cho mình tầm với vô hạn."
 single_combat.0001.desc.my_feedback.POD_bloodlash: "Một xúc tu máu được tạo ra, mang lại cho tôi những cơ hội mới."
 single_combat.0001.desc.my_feedback.POD_goblin_scorch: "Ngọn lửa linh hồn lao thẳng về phía đối thủ."
 single_combat.0001.desc.my_feedback.POD_goblin_lantern: "Tôi biến thành một quả cầu lửa phát sáng."
 single_combat.0001.desc.my_feedback.POD_bone_dance: "Điệu nhảy hoàn tất, tạo ra một tấm màn uể oải bao trùm khu vực."
 single_combat.0001.desc.my_feedback.POD_dragon_dance: "Điệu nhảy hoàn tất, và trạng thái xuất thần đã bắt đầu."
 single_combat.0001.desc.my_feedback.POD_chi_interrupt: "Tôi lao vào đối thủ, tìm kiếm các huyệt đạo Khí trọng yếu của nó."
 single_combat.0001.desc.my_feedback.POD_thousand_hell_stare: "Đau đớn, giận dữ và tuyệt vọng bỗng nhiên xâm chiếm linh hồn đối thủ của tôi."
 single_combat.0001.desc.my_feedback.POD_wind_attack: "Gió đã nổi lên, và tôi nhanh hơn bao giờ hết."
 single_combat.0001.desc.my_feedback.POD_demon_claws: "Tôi là ác quỷ và nó là tôi. Chúng tôi sẽ chiến thắng."
 single_combat.0001.desc.my_feedback.POD_tormented_essence: "Đau đớn, giận dữ và tuyệt vọng bỗng nhiên xâm chiếm linh hồn đối thủ của tôi."
 single_combat.0001.desc.my_feedback.POD_adramelechs_wrath: "Tôi là ác quỷ và nó là tôi. Chúng tôi sẽ chiến thắng."
 single_combat.0001.desc.my_feedback.POD_blood_atemi: "Tôi lao vào đối thủ, cố khiến hệ tuần hoàn của họ rối loạn."
 single_combat.0001.desc.my_feedback.POD_stand_upon_the_dragons_back: "Tôi dẫn truyền Khí từ những dòng chảy tự nhiên của Đại Địa vào cơ thể mình."
 single_combat.0001.desc.my_feedback.POD_dragon_ward: "Tôi mở rộng con mắt thứ ba và dẫn truyền Khí của mình thành một lá bùa hộ mệnh mạnh mẽ."
 single_combat.0001.desc.my_feedback.POD_typhonic_maw: "Tôi há rộng hàm đủ để nuốt trọn đối thủ."
 single_combat.0001.desc.my_feedback.POD_cobra_fangs: "Răng nanh tôi trở nên độc hại, tìm đường xuyên vào da thịt đối thủ."
 single_combat.0001.desc.my_feedback.POD_snout_strike: "Bạn cố thực hiện một cú thúc ngắn, hung tợn, hoặc có lẽ là một cú tóm, vào mõm."
 single_combat.0001.desc.my_feedback.POD_chi_breaker: "Tôi cố đẩy một bàn tay vào thân của con Shen và phá vỡ dòng chảy tự nhiên của Khí bên trong cơ thể con quỷ."
 single_combat.0001.desc.my_feedback.POD_hundred_star_shower: "Tôi nạp năng lượng sinh mệnh của chính mình vào các phi tiêu shuriken."
 single_combat.0001.desc.my_feedback.POD_jaw_hammer: "Tôi cố tung một đòn mạnh mẽ nhằm đập vỡ xương hàm của đối thủ."
 single_combat.0001.desc.my_feedback.POD_fading_light_strike: "Tôi cố đánh cắp sức mạnh từ đối thủ."
 single_combat.0001.desc.my_feedback.POD_chain_snake: "Tôi cố chặn đòn tấn công của đối thủ trong khi bắt giữ chi đang tấn công."
 single_combat.0001.desc.my_feedback.POD_twisting_thrust: "Tôi cố cắt sâu vào cơ thể đối thủ."
 single_combat.0001.desc.my_feedback.POD_prone_attacks: "Tôi ngã sấp và đối diện với đối thủ đang đứng."
 single_combat.0001.desc.my_feedback.POD_dagger_claw: "Tôi xòe rộng các ngón tay của cả hai bàn tay thành những vòng cung rộng và đâm chúng vào bụng dưới của đối thủ."
 single_combat.0001.desc.my_feedback.POD_spark_of_ra: "Tôi ném một quả cầu lửa đã bốc cháy về phía đối thủ."
 single_combat.0001.desc.my_feedback.POD_deaths_hand: "Tôi giơ lòng bàn tay lên để bắn năng lượng linh hồn vào kẻ thù."
 single_combat.0001.desc.my_feedback.POD_ashes_to_ashes: "Tôi niệm một câu thần chú để biến da thịt đối thủ thành tro bụi."
 single_combat.0001.desc.my_feedback.POD_dust_to_dust: "Tôi cố chạm vào đối thủ và biến da thịt họ thành đất sét đen."
 single_combat.0001.desc.my_feedback.POD_khaibits_embrace: "Tôi nắm lấy khuôn mặt kẻ thù và thốt ra những lời khiến bóng tối bất động quấn quanh cơ thể họ."
 single_combat.0001.desc.my_feedback.POD_serqets_sting: "Tôi tạo dấu hiệu bọ cạp và chích độc vào đối thủ."
 single_combat.0001.desc.my_feedback.POD_voracious_scarab_of_nyarashahim: "Tôi thả một con bọ hung để nuốt chửng đối thủ."
 single_combat.0001.desc.my_feedback.POD_spear_of_anubis: "Tôi hiện hóa một ngọn giáo bóng tối trong tay và đâm vào kẻ thù."
 single_combat.0001.desc.my_feedback.POD_feral_clawing: "Tôi vung móng vuốt vào kẻ thù."
 single_combat.0001.desc.my_feedback.POD_feral_bite: "Tôi cắn xé đối thủ."
 single_combat.0001.desc.my_feedback.POD_feral_assault: "Tôi điên cuồng lao vào đối thủ, vung tứ chi và cắn xé."
 single_combat.0001.desc.my_feedback.POD_feral_taunt: "Tôi cố làm mất thăng bằng kẻ thù bằng cách chế giễu [my_foe.GetHerHis] tính cách."
 single_combat.0001.desc.my_feedback.POD_feral_evasion: "Tôi né tránh các đòn tấn công của kẻ thù."
 single_combat.0001.desc.my_feedback.POD_jaw_lock: "Tôi khóa chặt chân đối thủ tại một chỗ."
 single_combat.0001.desc.my_feedback.POD_hamstring: "Tôi cắn xé tứ chi của kẻ thù."
 single_combat.0001.desc.my_feedback.POD_leaping_rake: "Tôi bất ngờ nhảy bổ vào đối thủ, cố đâm xuyên [my_foe.GetHerHim] bằng móng vuốt."
 single_combat.0001.desc.my_feedback.POD_wishbone: "Dồn hết sức lực, tôi cố xé toạc đối thủ."
 single_combat.0001.desc.my_feedback.POD_manipulate_inertia: "Tôi lao về phía trước nhanh hơn cả mắt thường có thể thấy, hy vọng đối thủ không cách nào lường trước được động tác của tôi."
 single_combat.0001.desc.my_feedback.POD_manipulate_acceleration: "Tôi lao về phía trước nhanh hơn cả mắt thường có thể thấy, hy vọng đối thủ không cách nào lường trước được động tác của tôi."
 single_combat.0001.desc.my_feedback.POD_manipulate_cohesion: "Tôi lao về phía trước nhanh hơn cả mắt thường có thể thấy, hy vọng đối thủ không cách nào lường trước được động tác của tôi."
 single_combat.0001.desc.my_feedback.POD_dragons_breath: "Tôi hít một hơi thật sâu rồi phun ra một luồng lửa khổng lồ về phía [my_foe.GetFirstNameNoTooltip]."
 single_combat.0001.desc.my_feedback.POD_bark_mudpuppy: "Tôi cất cao giọng và gầm lên về phía [my_foe.GetFirstNameNoTooltip] với toàn bộ sức lực, dồn một tiếng thét duy nhất thành thứ vũ khí có thể xé toạc da thịt."
 single_combat.0001.desc.my_feedback.POD_clap_of_thunder: "Tôi vỗ hai tay vào nhau và một tiếng sấm vang dội, đột ngột làm rung chuyển tận xương tủy [my_foe.GetFirstNameNoTooltip]."
 single_combat.0001.desc.my_feedback.POD_dragon_slash: "Nhớ lại quá trình rèn luyện của mình, tôi lao vào [my_foe.GetFirstNameNoTooltip] bằng một loạt những nhát chém móng vuốt uyển chuyển, điêu luyện, kết hợp kỹ năng điềm tĩnh với sức mạnh thô bạo."


#Opponent Combat Move Feedback
#Example: "[my_foe.GetFirstNameNoTooltip] tries to feint left with [my_foe.GetHerHis] [my_foe.Custom('signature_weapon')], only to strike for my heart with a concealed dagger in [my_foe.GetHerHis] off-hand."
 single_combat.0001.desc.opponent_response.POD_bite: "Kẻ thù của tôi lao tới, cố cắm những chiếc răng nanh sắc nhọn của nó vào chiếc cổ mời gọi của tôi."
 single_combat.0001.desc.opponent_response.POD_blood_surge: "Kẻ thù của tôi triệu hồi sức mạnh từ dòng máu của nó để tiếp thêm sức lực."
 single_combat.0001.desc.opponent_response.POD_blood_heal: "Kẻ thù của tôi triệu hồi sức mạnh từ dòng máu của nó để hàn gắn vết thương."
 single_combat.0001.desc.opponent_response.POD_blink: "Kẻ thù của tôi lao về phía trước nhanh hơn cả mắt thường có thể thấy, hy vọng tôi không cách nào lường trước được điều đó."
 single_combat.0001.desc.opponent_response.POD_lightning_strike: "Kẻ thù của tôi ra đòn theo bản năng với sức mạnh của Celerity, cố bắt tôi không kịp phòng bị."
 single_combat.0001.desc.opponent_response.POD_split_second: "Thời gian chậm lại quanh chúng tôi khi Celerity phát huy tác dụng. Đối thủ của tôi chắc chắn sẽ tận dụng cơ hội đó."
 single_combat.0001.desc.opponent_response.POD_unerring_aim: "Nhờ sự tinh thông Celerity của nó, đòn đánh của kẻ thù trúng đích tuyệt đối."
 single_combat.0001.desc.opponent_response.POD_lethal_body: "Với sức mạnh của một trận tuyết lở nhờ Potence trợ giúp, đối thủ của tôi lao về phía tôi."
 single_combat.0001.desc.opponent_response.POD_brutal_feed: "Kẻ thù của tôi lao tới nhắm vào cổ tôi, hy vọng rút cạn máu tôi chỉ trong vài giây."
 single_combat.0001.desc.opponent_response.POD_earthshock: "Đập xuống mặt đất, kẻ thù của tôi khiến cả sàn đất rung chuyển dưới chân chúng tôi."
 single_combat.0001.desc.opponent_response.POD_fist_of_caine: "Nhờ Potence, luồng không khí bị cuốn theo các đòn đấm của kẻ thù tự nó đã là một vũ khí chết người."
 single_combat.0001.desc.opponent_response.POD_toughness: "Da thịt của đối thủ tôi trở nên bền bỉ khác thường, có lẽ sẽ chặn được mọi đòn đánh sắp tới."
 single_combat.0001.desc.opponent_response.POD_flesh_of_marble: "Da thịt của đối thủ tôi hóa thành đá cẩm thạch siêu nhiên, không gì tổn hại được."
 single_combat.0001.desc.opponent_response.POD_prowess_from_pain: "Vết thương nuôi dưỡng kẻ thù của tôi, khiến nó mạnh lên từng giây."
 single_combat.0001.desc.opponent_response.POD_feral_weapons: "Móng vuốt của đối thủ tôi giương ra, sẵn sàng chẻ đôi tôi."
 single_combat.0001.desc.opponent_response.POD_shapechange: "Kẻ thù của tôi dùng hình dạng thú vật của nó để nhảy bổ vào tôi, răng nanh đi trước."
 single_combat.0001.desc.opponent_response.POD_vanish: "Kẻ thù của tôi biến mất khỏi tầm mắt, cố làm tôi hoang mang."
 single_combat.0001.desc.opponent_response.POD_nocturne: "Bóng tối cuộn xoáy quanh chiến trường của chúng tôi, khiến tầm nhìn trở nên khó khăn."
 single_combat.0001.desc.opponent_response.POD_arms_of_ahriman: "Những xúc tu đen từ lòng đất trồi lên, cố tấn công tôi."
 single_combat.0001.desc.opponent_response.POD_the_darkness_within: "Bóng tối cuộn xoáy quanh tôi, tìm kiếm một sơ hở."
 single_combat.0001.desc.opponent_response.POD_aegis_of_shadows: "Một lớp giáp bóng tối hiện ra quanh đối thủ của tôi, bảo vệ nó khỏi tổn hại."
 single_combat.0001.desc.opponent_response.POD_compel: "Kẻ thù của tôi ra một mệnh lệnh nhanh chóng bằng Dominate."
 single_combat.0001.desc.opponent_response.POD_terminal_decree: "Kẻ thù của tôi ra lệnh, buộc tôi phải tự làm hại bản thân."
 single_combat.0001.desc.opponent_response.POD_daunt: "Kẻ thù của tôi trở nên uy nghi hơn, quyền lực hơn, có lẽ hy vọng làm tôi chùn bước."
 single_combat.0001.desc.opponent_response.POD_dread_gaze: "Kẻ thù của tôi hiện ra như cơn ác mộng tồi tệ nhất của tôi. Một cảnh tượng gây xao nhãng."
 single_combat.0001.desc.opponent_response.POD_extinguish_vitae: "Chỉ với một cái vẫy tay, kẻ thù của tôi khiến máu tôi trở nên trơ ì."
 single_combat.0001.desc.opponent_response.POD_scorpions_touch: "Kẻ thù của tôi rút một ít máu của nó, biến nó thành chất độc."
 single_combat.0001.desc.opponent_response.POD_theft_of_vitae: "Kẻ thù của tôi khiến máu trào ra khỏi miệng tôi rồi dẫn nó về miệng nó."
 single_combat.0001.desc.opponent_response.POD_baals_curse: "Kẻ thù của tôi rút một ít máu của nó và biến nó thành một loại độc cực kỳ hung hãn."
 single_combat.0001.desc.opponent_response.POD_cauldron_of_blood: "Chỉ với một cái vẫy tay, kẻ thù của tôi khiến máu tôi sôi lên trong chính huyết quản của tôi."
 single_combat.0001.desc.opponent_response.POD_touch_of_oblivion: "Kẻ thù của tôi chạm vào tôi và dẫn truyền qua tôi sức mạnh nguyên thủy của entropy từ Oblivion."
 single_combat.0001.desc.opponent_response.POD_stygian_shroud: "Kẻ thù của tôi trải một màn bóng tối ngột ngạt ra khắp một vùng rộng lớn, bóp nghẹt âm thanh và triệt tiêu mọi giác quan khác."
 single_combat.0001.desc.opponent_response.POD_fire_torch: "Đối thủ của tôi trông chờ một chút may mắn trong lúc vung ngọn đuốc điên cuồng."
 single_combat.0001.desc.opponent_response.POD_fire_bombs: "Đối thủ của tôi phóng một ít lửa giả kim về phía tôi."
 single_combat.0001.desc.opponent_response.POD_fire_spewer: "Cỗ máy kỳ lạ của đối thủ tôi phun lửa loạn xạ."
 single_combat.0001.desc.opponent_response.POD_crossbow_shot: "Phát bắn của đối thủ tôi được khai hỏa, tìm kiếm mục tiêu của nó."
 single_combat.0001.desc.opponent_response.POD_unleash_dogs: "Lũ chó lao về phía tôi, khát khao máu thịt."
 single_combat.0001.desc.opponent_response.POD_stake_attack: "Kẻ thù của tôi lao tới, cọc gỗ đi trước."
 single_combat.0001.desc.opponent_response.POD_oculi_trust: "Lời của Chúa được cất lên, khiến tôi tràn ngập sợ hãi."
 single_combat.0001.desc.opponent_response.POD_oculi_wine: "Kẻ thù của tôi lao về phía tôi, tìm cách tiếp xúc để lời nguyền của nó bén rễ."
 single_combat.0001.desc.opponent_response.POD_acre_catechumen: "Lời của Chúa được cất lên, khiến đối thủ của tôi tràn ngập sức mạnh."
 single_combat.0001.desc.opponent_response.POD_acre_flesh: "Lời của Chúa được cất lên, khiến đối thủ của tôi tràn ngập sức bền."
 single_combat.0001.desc.opponent_response.POD_acre_flight: "Được Đấng Thiêng Liêng ban phước, kẻ thù của tôi nhanh hơn bao giờ hết."
 single_combat.0001.desc.opponent_response.POD_acre_auto: "Đối thủ của tôi chuẩn bị tinh thần cho điều có thể là đòn kết liễu."
 single_combat.0001.desc.opponent_response.POD_murnau_mirror: "Tấm gương của Chúa chỉ cho đối thủ của tôi con đường để sánh ngang sức mạnh của tôi."
 single_combat.0001.desc.opponent_response.POD_murnau_arcana: "Kẻ thù của tôi chuẩn bị tinh thần để chiếm quyền kiểm soát sức mạnh của tôi."
 single_combat.0001.desc.opponent_response.POD_sisters_hosanna: "Đối thủ của tôi hát vang vinh quang của Chúa, tràn đầy sức mạnh."
 single_combat.0001.desc.opponent_response.POD_sisters_oratorio: "Đối thủ của tôi hát vang vinh quang của Chúa, khiến tôi tràn ngập kinh hoàng."
 single_combat.0001.desc.opponent_response.POD_bone_obedience: "Xương cốt của đối thủ tôi bắt đầu trở nên không thể gãy vỡ."
 single_combat.0001.desc.opponent_response.POD_five_poison_cloud: "Năng lượng Âm đen tối của đám mây lao thẳng về phía tôi."
 single_combat.0001.desc.opponent_response.POD_ching_shih: "Hình dạng quái vật khủng khiếp nay đang đối diện với tôi."
 single_combat.0001.desc.opponent_response.POD_long_neck: "Kẻ thù của tôi kéo dài tứ chi, cho nó tầm với vô hạn."
 single_combat.0001.desc.opponent_response.POD_bloodlash: "Một xúc tu máu được tạo ra, mang lại cho đối thủ của tôi những cơ hội mới."
 single_combat.0001.desc.opponent_response.POD_goblin_scorch: "Ngọn lửa linh hồn lao thẳng về phía tôi."
 single_combat.0001.desc.opponent_response.POD_goblin_lantern: "Đối thủ của tôi biến thành một quả cầu lửa phát sáng."
 single_combat.0001.desc.opponent_response.POD_bone_dance: "Điệu nhảy hoàn tất, tạo ra một tấm màn uể oải bao trùm khu vực."
 single_combat.0001.desc.opponent_response.POD_dragon_dance: "Điệu nhảy hoàn tất, và trạng thái xuất thần đã bắt đầu."
 single_combat.0001.desc.opponent_response.POD_chi_interrupt: "Kẻ thù của tôi lao vào tôi, tìm kiếm các huyệt đạo Khí trọng yếu của tôi."
 single_combat.0001.desc.opponent_response.POD_thousand_hell_stare: "Đau đớn, giận dữ và tuyệt vọng bỗng nhiên xâm chiếm linh hồn tôi."
 single_combat.0001.desc.opponent_response.POD_wind_attack: "Gió đã nổi lên, và đối thủ của tôi nhanh hơn bao giờ hết."
 single_combat.0001.desc.opponent_response.POD_demon_claws: "Đối thủ của tôi đã biến thành hình dạng một con ác quỷ đáng sợ."
 single_combat.0001.desc.opponent_response.POD_tormented_essence: "Đau đớn, giận dữ và tuyệt vọng bỗng nhiên xâm chiếm linh hồn tôi."
 single_combat.0001.desc.opponent_response.POD_adramelechs_wrath: "Đối thủ của tôi đã biến thành hình dạng một con ác quỷ đáng sợ."
 single_combat.0001.desc.opponent_response.POD_blood_atemi: "Đối thủ của tôi lao vào tôi, cố khiến hệ tuần hoàn của tôi rối loạn."
 single_combat.0001.desc.opponent_response.POD_stand_upon_the_dragons_back: "Đối thủ của tôi dẫn truyền Khí từ những dòng chảy tự nhiên của Đại Địa vào cơ thể nó."
 single_combat.0001.desc.opponent_response.POD_dragon_ward: "Đối thủ của tôi mở rộng con mắt thứ ba và dẫn truyền Khí của nó thành một lá bùa hộ mệnh mạnh mẽ."
 single_combat.0001.desc.opponent_response.POD_typhonic_maw: "Đối thủ của tôi há rộng hàm đủ để nuốt trọn tôi!"
 single_combat.0001.desc.opponent_response.POD_cobra_fangs: "Răng nanh của đối thủ tôi trở nên độc hại, tìm đường xuyên vào da thịt tôi."
 single_combat.0001.desc.opponent_response.POD_snout_strike: "Đối thủ của tôi cố thực hiện một cú thúc ngắn, hung tợn, hoặc có lẽ là một cú tóm, vào mõm."
 single_combat.0001.desc.opponent_response.POD_chi_breaker: "Đối thủ của tôi cố đẩy một bàn tay vào thân tôi và phá vỡ dòng chảy tự nhiên của Khí bên trong cơ thể tôi."
 single_combat.0001.desc.opponent_response.POD_hundred_star_shower: "Đối thủ của tôi nạp năng lượng sinh mệnh của nó vào các phi tiêu shuriken."
 single_combat.0001.desc.opponent_response.POD_jaw_hammer: "Đối thủ của tôi cố tung một đòn mạnh mẽ nhằm đập vỡ xương hàm của tôi."
 single_combat.0001.desc.opponent_response.POD_fading_light_strike: "Đối thủ của tôi cố đánh cắp sức mạnh từ tôi."
 single_combat.0001.desc.opponent_response.POD_chain_snake: "Đối thủ của tôi cố chặn đòn tấn công của tôi trong khi bắt giữ chi đang tấn công."
 single_combat.0001.desc.opponent_response.POD_twisting_thrust: "Đối thủ của tôi cố cắt sâu vào cơ thể tôi."
 single_combat.0001.desc.opponent_response.POD_prone_attacks: "Đối thủ của tôi ngã sấp."
 single_combat.0001.desc.opponent_response.POD_dagger_claw: "Đối thủ của tôi xòe rộng các ngón tay của cả hai bàn tay và đâm chúng vào bụng dưới của tôi."
 single_combat.0001.desc.opponent_response.POD_spark_of_ra: "Đối thủ của tôi ném một quả cầu lửa đã bốc cháy vào tôi."
 single_combat.0001.desc.opponent_response.POD_deaths_hand: "Kẻ thù của tôi giơ lòng bàn tay lên để bắn năng lượng linh hồn vào tôi."
 single_combat.0001.desc.opponent_response.POD_ashes_to_ashes: "Kẻ thù của tôi cố niệm một câu thần chú để biến tôi thành tro bụi."
 single_combat.0001.desc.opponent_response.POD_dust_to_dust: "Đối thủ của tôi cố chạm vào tôi và biến da thịt tôi thành đất sét đen."
 single_combat.0001.desc.opponent_response.POD_khaibits_embrace: "Kẻ thù của tôi nắm lấy khuôn mặt tôi, thốt ra những lời huyền bí. Bóng tối bất động bắt đầu quấn quanh cơ thể tôi."
 single_combat.0001.desc.opponent_response.POD_serqets_sting: "Đối thủ của tôi tạo dấu hiệu bọ cạp và chích độc vào tôi."
 single_combat.0001.desc.opponent_response.POD_voracious_scarab_of_nyarashahim: "Đối thủ của tôi thả một con bọ hung để tấn công tôi."
 single_combat.0001.desc.opponent_response.POD_spear_of_anubis: "Đối thủ của tôi tạo ra một ngọn giáo bóng tối và cố đâm vào tôi."
 single_combat.0001.desc.opponent_response.POD_feral_clawing: "Đối thủ của tôi vung móng vuốt vào tôi."
 single_combat.0001.desc.opponent_response.POD_feral_bite: "Kẻ thù của tôi cắn xé tôi."
 single_combat.0001.desc.opponent_response.POD_feral_assault: "Kẻ thù của tôi lao vào tôi, vung [my_foe.GetHerHis] tứ chi vào tôi và cắn xé"
 single_combat.0001.desc.opponent_response.POD_feral_taunt: "Đối thủ của tôi cố làm tôi mất thăng bằng bằng cách chế giễu tính cách của tôi."
 single_combat.0001.desc.opponent_response.POD_feral_evasion: "Kẻ thù của tôi né tránh các đòn tấn công của tôi."
 single_combat.0001.desc.opponent_response.POD_jaw_lock: "Đối thủ của tôi khóa chặt chân tôi tại một chỗ."
 single_combat.0001.desc.opponent_response.POD_hamstring: "Kẻ thù của tôi cắn xé tứ chi của tôi."
 single_combat.0001.desc.opponent_response.POD_leaping_rake: "Đối thủ của tôi bất ngờ nhảy bổ vào tôi, cố đâm xuyên tôi bằng móng vuốt của [my_foe.GetHerHis]."
 single_combat.0001.desc.opponent_response.POD_wishbone: "Dồn hết sức lực của [my_foe.GetHerHis], đối thủ của tôi cố xé toạc tôi."
 single_combat.0001.desc.opponent_response.POD_manipulate_inertia: "Kẻ thù của tôi lao về phía trước nhanh hơn cả mắt thường có thể thấy, hy vọng tôi không cách nào lường trước được điều đó."
 single_combat.0001.desc.opponent_response.POD_manipulate_acceleration: "Kẻ thù của tôi lao về phía trước nhanh hơn cả mắt thường có thể thấy, hy vọng tôi không cách nào lường trước được điều đó."
 single_combat.0001.desc.opponent_response.POD_manipulate_cohesion: "Kẻ thù của tôi lao về phía trước nhanh hơn cả mắt thường có thể thấy, hy vọng tôi không cách nào lường trước được điều đó."
 single_combat.0001.desc.opponent_response.POD_dragons_breath: "[my_foe.GetFirstNameNoTooltip] hít một hơi thật sâu rồi phun ra một luồng lửa khổng lồ như một con rồng thực thụ, chiếu sáng cả khung cảnh xung quanh chúng tôi."
 single_combat.0001.desc.opponent_response.POD_bark_mudpuppy: "[my_foe.GetFirstNameNoTooltip] #italic gầm thét#! với một sức mạnh bất ngờ xé rách da thịt tôi và đẩy lùi tôi."
 single_combat.0001.desc.opponent_response.POD_clap_of_thunder: "[my_foe.GetFirstNameNoTooltip] vỗ hai tay [my_foe.GetHerHis] vào nhau và tôi bỗng ù tai bởi một tiếng động như sấm khiến tai tôi cứ ù mãi."
 single_combat.0001.desc.opponent_response.POD_dragon_slash: "[my_foe.GetFirstNameNoTooltip] trông nghiêm nghị khi [my_foe.GetSheHe] lao vào tôi bằng [my_foe.GetHerselfHimself] với một loạt đòn tấn công móng vuốt hung tợn."



