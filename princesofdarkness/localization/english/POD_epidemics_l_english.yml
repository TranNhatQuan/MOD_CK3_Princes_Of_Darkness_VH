l_english:
 supernatural_diseases: "Dịch Bệnh Siêu Nhiên"

 epidemic_crimson_fever: "Hồng Nhiệt"
 disease_crimson_fever: "hồng nhiệt."
 health.2101.crimson_fever_outbreak.desc: "Một chứng bệnh siêu nhiên phát sinh ở người Cathay khi khía cạnh Dương của họ mất cân bằng. Dù là một căn bệnh khá hiếm gặp, nó được đồn là cực kỳ dễ lây lan. Sự hiếm gặp của nó cũng có nghĩa là chưa từng có cách chữa trị nào được thực sự nghiên cứu tới nơi tới chốn, khiến nó trở thành một viễn cảnh đáng sợ khi phải đối phó.\n\nMột ca bệnh nguy hiểm có vẻ như là hồng nhiệt đã len lỏi vào triều đình của ngài. Phát ban, ho và sốt hành hạ người bệnh, và đây có thể mới chỉ là khởi đầu."
 health.2101.crimson_fever_spreads.desc: "Lại thêm một ca hồng nhiệt nữa ngóc đầu dậy."
 
 POD_epidemic.1001.t: "[SCOPE.Custom('EventTitleDisease')]: Hồng Nhiệt"
 POD_epidemic.1001.desc: "Một chứng bệnh siêu nhiên phát sinh ở người Cathay khi khía cạnh Dương của họ mất cân bằng. Dù là một căn bệnh khá hiếm gặp, nó được đồn là cực kỳ dễ lây lan. Sự hiếm gặp của nó cũng có nghĩa là chưa từng có cách chữa trị nào được thực sự nghiên cứu tới nơi tới chốn, khiến nó trở thành một viễn cảnh đáng sợ khi phải đối phó.\n\nTa chưa từng nghĩ rằng chính mình sẽ phải chịu đựng căn bệnh này, nhưng cơn ác mộng nhức nhối, sốt hầm hập này không cho ta lựa chọn nào khác.\n\nKhi ta nghĩ đến hậu quả của sự mất cân bằng trong mình, ta cầu nguyện được cứu chuộc, hai lỗ mũi cay xè bởi mùi hôi thối nồng nặc của mật."
 POD_epidemic.1001.court_physician.desc: "\n\n"Xin đừng lo, [ROOT.Char.GetLadyLord] của ta! Hồng Nhiệt có thể chữa được, ta cam đoan với ngài.""
 POD_epidemic.1001.a: "Ta van xin, hãy để nó kết thúc!"

 POD_epidemic.1002.t: "[SCOPE.Custom('EventTitleDisease')]: Một Trận Chiến Thắng Lợi"
 POD_epidemic.1002.desc: "Không như nhiều người trước ta, ta đã đủ mạnh mẽ để sống sót qua sự tàn phá của Hồng Nhiệt đáng sợ. Đó là một thử thách tàn khốc, ta sẽ không phủ nhận điều đó, nhưng ta đã kiên trì vượt qua!"
 POD_epidemic.1002.a: "Ta sống để chiến đấu thêm một ngày nữa!"
 
 epidemic_chulorviosis: "Chulorviosis"
 disease_chulorviosis: "chulorviosis."
 health.2101.chulorviosis_outbreak.desc: "Một yếu tố kỳ dị, dễ lây lan mà không thể xếp vào loại nào, Chulorviosis rõ ràng mang bản chất siêu nhiên. Biến vật chủ của nó thành một dạng lai ghép biến dạng giữa người và quái vật xúc tu, nó dần dần tước đoạt ý chí tự do của vật chủ cho đến khi họ cũng trở thành một Chulorviah và bắt đầu lan truyền vết nhơ đó xa hơn nữa.\n\nMột nạn nhân bất hạnh của căn bệnh ký sinh này vừa mới được phát hiện gần đây. Dù đã được xử lý nhanh chóng, họ có thể đã lây nhiễm cho người khác trước cái chết nhân từ của mình..."
 health.2101.chulorviosis_spreads.desc: "Cái chết của cả thể xác lẫn linh hồn."

 POD_epidemic.1101.t: "[SCOPE.Custom('EventTitleDisease')]: Từng Chút Một"
 POD_epidemic.1101.desc: "Một yếu tố kỳ dị, dễ lây lan mà không thể xếp vào loại nào, Chulorviosis rõ ràng mang bản chất siêu nhiên. Biến vật chủ của nó thành một dạng lai ghép biến dạng giữa người và quái vật xúc tu, nó dần dần tước đoạt ý chí tự do của vật chủ cho đến khi họ cũng trở thành một Chulorviah và bắt đầu lan truyền vết nhơ đó xa hơn nữa.\n\nLàn da lốm đốm của một con mực nang, thật tương phản với tấm vải nhợt nhạt. Ta nhìn chằm chằm vào nó trong sự hoài nghi, cố nén thêm một cơn ho. Có phải nó...? Có phải ta...?\n\nTa lau ngón tay vào môi mình, bàn tay run rẩy khi kéo lại. Ta có thể cảm nhận được sự ẩm ướt ấm áp, nhưng ta sợ phải nhìn xuống."
 POD_epidemic.1101.court_physician.desc: "\n\n"Ta e rằng ngài đã nhiễm phải một thứ gì đó khủng khiếp, [ROOT.Char.GetLadyLord] của ta. Ta sẽ chữa trị cho ngài ngay lập tức.""
 POD_epidemic.1101.a: "Đây có phải là số phận của ta? Để rồi dần dần đánh mất chính mình?"

 POD_epidemic.1102.t: "[SCOPE.Custom('EventTitleDisease')]: Một Cơ Hội Thứ Hai"
 POD_epidemic.1102.desc: "Ta gầy rộc đi, ho, và chảy máu. Ta nghĩ mình sẽ hao mòn đến hư vô. Cảm giác đó thực sự đúng như vậy khi ta hầu như không thể lết ra khỏi giường.\n\nThế nhưng, sức khỏe và sức mạnh của ta đã hồi phục, dù chậm chạp đến đâu. Cuối cùng, ta đã sẵn sàng đối mặt với thế giới và mọi thử thách của nó."
 POD_epidemic.1102.a: "Đến lúc chinh phục thế giới!"

 POD_epidemic.1103.t: "[SCOPE.Custom('EventTitleDisease')]: Tiếng Gọi Từ Vực Sâu"
 POD_epidemic.1103.desc: "Sự biến dị đến chậm rãi lúc đầu, với những thứ như các giác hút nhỏ mọc ra từ cẳng tay ngươi. Rồi nó bắt đầu làm mờ đi trí tuệ của ngươi. Cuối cùng, những giọng nói cất lên bằng thứ ngôn ngữ xa lạ của chúng. Bất chấp mọi nỗ lực tốt nhất của ngươi, tiếng tụng niệm của chúng chỉ ngày càng lớn hơn cho đến một ngày ngươi cuối cùng cũng hiểu được chúng.\n\nBiển cả đang chờ đợi."
 POD_epidemic.1103.a: "Ta phải kháng cự!"
 POD_epidemic.1103.b: "Cuối cùng cũng là một phần của một thể thống nhất lớn hơn."
 
 POD_epidemic.1111.t: "[SCOPE.Custom('EventTitleDisease')]: Một Phương Thuốc?"
 POD_epidemic.1111.desc: "Rõ ràng, ngươi không thể chữa chulorviosis bằng các phương pháp thông thường, và ngay cả sức mạnh chữa lành cũng không có tác dụng. Căn bệnh ký sinh này đã tỏ ra kiên cường trước mọi thứ ngươi đã thử cho đến nay, và khi sự biến dị càng lớn dần, ngươi bắt đầu cảm thấy tuyệt vọng. Ngươi còn có những lựa chọn nào khác?"
 POD_epidemic.1111.a: "Sức mạnh thuần khiết của Đấng Thiêng Liêng."
 POD_epidemic.1111.b: "Sức mạnh thuần khiết của Địa Ngục."
 POD_epidemic.1111.c: "Sức mạnh thuần khiết của $glossary_triat$ và Gaia."
 POD_epidemic.1111.d: "Hồi sinh có thể là một lối thoát."
 POD_epidemic.1111.fallback: "Ta cần tìm một cách khác."
 POD_epidemic.1111.fallback.tt: "Kiểm tra danh sách quyết định của ngài, có một mục về cách chữa chulorviosis."
 
 epidemic_demonic_plague: "Ôn Dịch Quỷ Ám"
 disease_demonic_plague: "ôn dịch quỷ ám."
 health.2101.demonic_plague_outbreak.desc: "Sức mạnh khủng khiếp mang tên Giáng Ôn Dịch giáng xuống một trận ôn dịch kiểu Kinh Thánh lên kẻ thù của người triệu hồi nó, nguyền rủa họ bằng một căn bệnh cực kỳ dễ lây lan hoành hành cả người phàm lẫn Cainite. Nó gây ra những mụn nhọt dữ dội, đau đớn, trông như vết bỏng rỉ máu khi vỡ ra. Mục tiêu thu hút từng đàn côn trùng và vật ký sinh bất cứ nơi nào hắn đi qua khi chúng chờ đợi cái chết tất yếu của hắn và bữa tiệc tất yếu của chúng.\n\nSức mạnh khủng khiếp này đã lại được sử dụng một lần nữa, giương lưỡi hái tử thần lên vương quốc của ta."
 health.2101.demonic_plague_spreads.desc: "Lại thêm một linh hồn nữa đứng trước cửa Tử Thần, những vết mụn nhọt đáng sợ làm biến dạng làn da [sick_character.GetHerHis]."

 POD_epidemic.1201.t: "[SCOPE.Custom('EventTitleDisease')]: Cái Chạm Của Tử Thần Gặt Hái"
 POD_epidemic.1201.desc: "Sức mạnh khủng khiếp mang tên Giáng Ôn Dịch giáng xuống một trận ôn dịch kiểu Kinh Thánh lên kẻ thù của người triệu hồi nó, nguyền rủa họ bằng một căn bệnh cực kỳ dễ lây lan hoành hành cả người phàm lẫn Cainite. Nó gây ra những mụn nhọt dữ dội, đau đớn, trông như vết bỏng rỉ máu khi vỡ ra. Mục tiêu thu hút từng đàn côn trùng và vật ký sinh bất cứ nơi nào hắn đi qua khi chúng chờ đợi cái chết tất yếu của hắn và bữa tiệc tất yếu của chúng.\n\nSức mạnh này không còn chỉ là một câu chuyện đáng sợ nữa. Ta run rẩy ấn ngón tay vào khối u dưới nách mình. Một thế lực đen tối và chết chóc đang làm ô uế thịt da ta, nuốt chửng ta với mỗi bước chân ta đi."
 POD_epidemic.1201.court_physician.desc: "\n\n"[ROOT.Char.GetLadyLord] của ta, ta sẽ làm mọi thứ trong khả năng của mình, nhưng có lẽ nên chuẩn bị cho điều tồi tệ nhất...""
 POD_epidemic.1201.a: "Ôi, [ROOT.Char.GetFaith.HealthGodName]! Xin hãy cứu con khỏi cơn ác mộng này!"

 POD_epidemic.1202.t: "[SCOPE.Custom('EventTitleDisease')]: Bất Chấp Mọi Nghịch Cảnh"
 POD_epidemic.1202.desc: "Có vẻ như Tử Thần đã đi ngang qua cửa nhà ta, nán lại bên giường ta, nhưng cuối cùng lại quyết định để ta sống. Ta sẽ không bao giờ quên những đau đớn từ cái chạm của [ROOT.Char.GetFaith.DeathDeityHerHis|U], thế nhưng [ROOT.Char.GetFaith.DeathDeitySheHe|U] đã mở mắt ta trước điều kỳ diệu của hiện tại.\n\n Ôn dịch quỷ ám đã cướp đi nhiều sinh mạng, nhưng ta sẽ không phải là một trong số đó."
 POD_epidemic.1202.a: "Ca ngợi [ROOT.Char.GetFaith.HealthGodName] vì điều kỳ diệu này!"
 POD_epidemic.1202.a.tt: "Ta nay đã miễn nhiễm với [GetTrait('demonic_plague').GetName( GetNullCharacter )]"
 
 epidemic_gift_of_melancholia: "Món Quà Của U Sầu"
 disease_gift_of_melancholia: "món quà của u sầu"
 health.2101.gift_of_melancholia_outbreak.desc: "Món Quà Của U Sầu gây ra một chứng bệnh hao mòn dữ dội cho cả người phàm lẫn Cainite. Cả hai đều mắc phải một căn bệnh gây chóng mặt, suy nhược, khó chịu và buồn nôn. Căn bệnh này cực kỳ dễ lây giữa những người phàm, những kẻ có thể lây cho nhau chỉ bằng cách ở gần. Một ma cà rồng phải hoặc bị nhắm mục tiêu trực tiếp bởi sức mạnh này, hoặc hút máu một người phàm bị nhiễm bệnh mới có thể mắc phải. Tuy nhiên, một ma cà rồng bị nhiễm bệnh sẽ lây ôn dịch cho tất cả những ai hắn hút máu cho đến khi được chữa khỏi.\n\nMột ca bệnh vừa được phát hiện gần đây trong vương quốc của ngài."
 health.2101.gift_of_melancholia_spreads.desc: "Lại thêm một linh hồn nữa bị nguyền rủa bởi căn bệnh này."
 
 POD_epidemic.1301.t: "[SCOPE.Custom('EventTitleDisease')]: Món Quà Của U Sầu"
 POD_epidemic.1301.desc: "Món Quà Của U Sầu gây ra một chứng bệnh hao mòn dữ dội cho cả người phàm lẫn Cainite. Cả hai đều mắc phải một căn bệnh gây chóng mặt, suy nhược, khó chịu và buồn nôn. Căn bệnh này cực kỳ dễ lây giữa những người phàm, những kẻ có thể lây cho nhau chỉ bằng cách ở gần. Một ma cà rồng phải hoặc bị nhắm mục tiêu trực tiếp bởi sức mạnh này, hoặc hút máu một người phàm bị nhiễm bệnh mới có thể mắc phải. Tuy nhiên, một ma cà rồng bị nhiễm bệnh sẽ lây ôn dịch cho tất cả những ai hắn hút máu cho đến khi được chữa khỏi.\n\nVới đợt sốt và nôn mửa đầu tiên, ta không thể phủ nhận được nữa, ta đã bị nhiễm bệnh."
 POD_epidemic.1301.end.desc: "\n\nVà giờ đây những vết loét báo hiệu đang lan ra khắp làn da ta..."
 POD_epidemic.1301.court_physician.desc: "\n\n"Đúng vậy, những vết loét này là dấu hiệu chắc chắn của Món Quà Của U Sầu. Rất nguy hiểm nếu không được chữa trị.""
 POD_epidemic.1301.a: "Ta sẽ chịu đựng!"

 POD_epidemic.1302.t: "[SCOPE.Custom('EventTitleDisease')]: Thoát Khỏi Tử Thần"
 POD_epidemic.1302.desc: "Dù những vết sẹo có thể còn lại, cả trên da lẫn trong tâm trí ta, có vẻ như căn bệnh đã rời khỏi cơ thể ta. Ta sẽ sống sót. Vẫn còn thời gian."
 POD_epidemic.1302.a: "Vinh danh [ROOT.Char.GetFaith.HealthGodName]! Ta đã khỏe lại!"
 POD_epidemic.1302.a.tt: "Ta nay đã miễn nhiễm với [GetTrait('gift_of_melancholia').GetName( GetNullCharacter )]"
 
 epidemic_flaying_plague: "Ôn Dịch Lột Da"
 disease_flaying_plague: "ôn dịch lột da."
 health.2101.flaying_plague_outbreak.desc: "Không phải mọi kẻ thù của Garou đều có thể bị đánh bại bằng nanh vuốt. Vào mùa đông năm 1229, người sói ở Lihuania trở thành nạn nhân của một cơn sốt. Ban đầu nó có vẻ như một biến thể kỳ lạ của bệnh lao, rồi các mụn nhọt xuất hiện, rồi da thịt rơi rụng, đau đớn khôn xiết, khỏi xương cốt. Toàn bộ dân số Garou trong vùng đã chết và căn bệnh bắt đầu lan về phía tây. Hàng trăm Garou và Kinfolk chết dần trong hậu quả của nó khi các Theurge dường như khó lòng kiềm chế được nó.\n\nVà giờ đây, nó đã đến để đòi món nợ của mình trong vương quốc của ngài."
 health.2101.flaying_plague_spreads.desc: "Chúng ta phải tìm ra nguyên nhân!"

 POD_epidemic.1401.t: "[SCOPE.Custom('EventTitleDisease')]: Cái Chạm Của Quỷ Dữ"
 POD_epidemic.1401.desc: "Không phải mọi kẻ thù của Garou đều có thể bị đánh bại bằng nanh vuốt. Vào mùa đông năm 1229, người sói ở Lihuania trở thành nạn nhân của một cơn sốt. Ban đầu nó có vẻ như một biến thể kỳ lạ của bệnh lao, rồi các mụn nhọt xuất hiện, rồi da thịt rơi rụng, đau đớn khôn xiết, khỏi xương cốt. Toàn bộ dân số Garou trong vùng đã chết và căn bệnh bắt đầu lan về phía tây. Hàng trăm Garou và Kinfolk chết dần trong hậu quả của nó khi các Theurge dường như khó lòng kiềm chế được nó.\n\nNhưng ôn dịch này không còn chỉ là một câu chuyện đáng sợ nữa. Ta run rẩy ấn ngón tay vào khối u dưới nách mình. Một thế lực đen tối và chết chóc đang làm ô uế thịt da ta, nuốt chửng ta ngay cả khi ta vẫn còn thở."
 POD_epidemic.1401.court_physician.desc: "\n\n"[ROOT.Char.GetLadyLord] của ta, ta sẽ làm mọi thứ trong khả năng của mình, nhưng có lẽ nên chuẩn bị cho điều tồi tệ nhất...""
 POD_epidemic.1401.a: "Ôi, [ROOT.Char.GetFaith.HealthGodName]! Xin hãy cứu con khỏi cơn ác mộng này!"

 POD_epidemic.1402.t: "[SCOPE.Custom('EventTitleDisease')]: Bất Chấp Mọi Nghịch Cảnh"
 POD_epidemic.1402.desc: "Có vẻ như [ROOT.Char.GetFaith.DeathDeityName] đã đi ngang qua cửa nhà ta, nán lại bên giường ta, nhưng cuối cùng lại quyết định để ta sống. Ta sẽ không bao giờ quên những đau đớn từ cái chạm của [ROOT.Char.GetFaith.DeathDeityHerHis|U], thế nhưng [ROOT.Char.GetFaith.DeathDeitySheHe|U] đã mở mắt ta trước điều kỳ diệu của cuộc sống.\n\n Ôn dịch này đã cướp đi nhiều sinh mạng, nhưng ta sẽ không phải là một trong số đó."
 POD_epidemic.1402.a: "Ca ngợi [ROOT.Char.GetFaith.HealthGodName] vì điều kỳ diệu này!"
 POD_epidemic.1402.a.tt: "Ta nay đã miễn nhiễm với [GetTrait('flaying_plague').GetName( GetNullCharacter )]"
 
 epidemic_scourge: "Tai Ương"
 disease_scourge: "tai ương."
 health.2101.scourge_outbreak.desc: "Tai Ương là một trận ôn dịch đặc thù của ma cà rồng, lây nhiễm vào Huyết. Căn bệnh này là một chủng đột biến của bệnh phong lai với dịch hạch, tấn công trực tiếp vào $pod_vitae$ của ma cà rồng. Một khi bị nhiễm, nạn nhân phải tiêu tốn nhiều máu hơn mỗi lần họ sử dụng $pod_vitae$. Điều này càng trở nên tồi tệ hơn mỗi đêm nạn nhân chịu đựng Tai Ương. Trong một số trường hợp, nạn nhân còn phải chịu một chứng bệnh làm biến dạng ảnh hưởng đến ngoại hình của họ nhưng không đe dọa tính mạng.\n\nDù Tai Ương có thể chữa được tùy từng trường hợp, bản thân căn bệnh này không thể bị tiêu diệt hoàn toàn. Trong những trường hợp cực kỳ hiếm gặp, một ma cà rồng bị nhiễm bệnh trở thành người mang mầm bệnh và miễn nhiễm với tác động của nó. Người mang mầm bệnh sau đó lây Tai Ương sang các ma cà rồng khác.\n\nMột ca bệnh vừa được phát hiện gần đây trong vương quốc của ngài, khiến mọi người rơi vào một cơn hoảng loạn (còn hơn cả bình thường)."
 health.2101.scourge_spreads.desc: "Đến lúc phải suy nghĩ lại về thói quen ăn uống của ta..."

 POD_epidemic.1501.t: "[SCOPE.Custom('EventTitleDisease')]: Đã Bị Nhiễm!"
 POD_epidemic.1501.desc: "Tai Ương không tha cho ai... ít nhất là không tha cho ngươi. Đó thực sự là một cảm giác kỳ lạ, bệnh tật đã là một ký ức mờ nhạt từ những ngày còn hơi thở của ngươi từ lâu lắm rồi, và giờ nó đã quay lại ám ảnh ngươi.\n\nNgươi cảm thấy yếu ớt, dòng máu của ngươi gặp khó khăn khi triệu tập sức mạnh mà nó từng có, và ngươi có thể thấy trong ánh mắt của đoàn tùy tùng nỗi sợ hãi bị phơi bày trước ngươi... và ánh mắt tham lam của những cơ hội đang được cân nhắc trong khi ngươi đang suy yếu như vậy.\n\nNhững ngày tháng khó khăn đang ở phía trước."
 POD_epidemic.1501.a: "Ta chỉ cần nằm xuống một chút..."

 POD_epidemic.1502.t: "[SCOPE.Custom('EventTitleDisease')]: Bất Chấp Mọi Nghịch Cảnh"
 POD_epidemic.1502.desc: "Có vẻ như [ROOT.Char.GetFaith.DeathDeityName] đã đi ngang qua cửa nhà ta, nán lại bên giường ta, nhưng cuối cùng lại quyết định để ta sống. Ta sẽ không bao giờ quên những đau đớn từ cái chạm của [ROOT.Char.GetFaith.DeathDeityHerHis|U], thế nhưng [ROOT.Char.GetFaith.DeathDeitySheHe|U] đã mở mắt ta trước điều kỳ diệu của cuộc sống.\n\nTai Ương đã cướp đi nhiều sinh mạng trực tiếp hoặc gián tiếp, nhưng ta sẽ không phải là một trong số đó."
 POD_epidemic.1502.a: "Ca ngợi [ROOT.Char.GetFaith.HealthGodName] vì điều kỳ diệu này!"
 POD_epidemic.1502.a.tt: "Ta nay đã miễn nhiễm với [GetTrait('scourge').GetName( GetNullCharacter )]"


 epidemic_entoban_plague: "Ôn Dịch Entoban"
 disease_entoban_plague: "ôn dịch Entoban."
 health.2101.entoban_plague_outbreak.desc: "$POD_epidemic.1601.desc$"
 health.2101.entoban_plague_spreads.desc: "Chết tiệt!"
 POD_epidemic.1601.t: "[SCOPE.Custom('EventTitleDisease')]: Căn Bệnh Cổ Xưa"
 POD_epidemic.1601.desc: "Từ lâu, Mokolé-Mbembe vĩ đại đã tạo ra những lá bùa hộ mệnh chống sốt xung quanh lục địa Entoban, hay còn được biết đến rộng rãi hơn với tên gọi Châu Phi. Những lá bùa hộ mệnh đó đã tồn tại nguyên vẹn suốt hàng thiên niên kỷ, cho đến bây giờ. Một kẻ ngốc nào đó đã rút Thanh Kiếm Của Cơn Sốt ra khỏi vỏ và mang đến khổ đau cho tất cả chúng ta."
 POD_epidemic.1601.end.desc: "\n\nVà giờ đây có vẻ như, khổ đau cũng đã đến với ta."
 POD_epidemic.1601.court_physician.desc: "\n\n"Đúng vậy, những vết loét này là dấu hiệu chắc chắn của Ôn Dịch Entoban. Rất nguy hiểm nếu không được chữa trị.""
 POD_epidemic.1601.a: "Ta sẽ chịu đựng!"

 POD_epidemic.1602.t: "[SCOPE.Custom('EventTitleDisease')]: Thoát Khỏi Tử Thần"
 POD_epidemic.1602.desc: "Dù những vết sẹo có thể còn lại, cả trên da lẫn trong tâm trí ta, có vẻ như căn bệnh đã rời khỏi cơ thể ta. Ta sẽ sống sót. Vẫn còn thời gian."
 POD_epidemic.1602.a: "Vinh danh [ROOT.Char.GetFaith.HealthGodName]! Ta đã khỏe lại!"
 POD_epidemic.1602.a.tt: "Ta nay đã miễn nhiễm với [GetTrait('entoban_plague').GetName( GetNullCharacter )]"