l_english:

 legend_chronicle_mithras_chronicle: "Vị Thần Mặt Trời Bất Tử"
 legend_chronicle_mithras_chronicle_desc: "Câu chuyện về Vị Vua Từng Là và Mãi Mãi Là, Mithras"
 mithras_chronicle_opening: "Là một vị Thần được người Ba Tư cổ đại tôn thờ đầu tiên, Mithras (hay Mithra như cách Người được biết đến với họ) cai trị các bộ tộc loài người đầu tiên ở Trung Đông như một người cai trị nghiêm khắc nhưng công bằng. Chỉ xuất hiện vào ban đêm, Mithra dành thời gian ban ngày để xua đuổi bóng tối và mang vinh quang của Mặt Trời đến cho các tín đồ trung thành của mình.\nĐược tôn kính như Thần Mặt Trời, Mithra trở thành vị thần của giao ước, chân lý, lời thề và công lý."
 mithras_chronicle_motivation: "Sự cai trị hoàn hảo của Mithras dường như định mệnh sẽ kéo dài mãi mãi cho đến khi một vị thần khác xuất hiện, Kemintiri của Ai Cập. Say đắm khi cuối cùng cũng tìm được người ngang hàng với mình, Mithras đã mời nàng cùng cai trị bên cạnh mình. Tuy nhiên, Thần Mặt Trời đã trao tình bạn của mình quá sớm và Kemintiri đã phạm phải một sự phản bội khủng khiếp, cướp đi người thừa kế của Mithras và vị Thần của dân chúng ngài. Mặt Trời lặn xuống trên xứ Ba Tư khi Chúa Tể Ánh Sáng chìm vào tuyệt vọng."
 mithras_chronicle_famous_deed: "Nỗi đau buồn của Mithras sẽ chấm dứt khi người La Mã xuất hiện. Đem lòng quan tâm sâu sắc đến dân tộc hiếu chiến này, Mithras đã hiện thân trước họ và họ quỳ rạp xuống, ôm lấy vị Thần mới của mình và đặt cho ngài danh hiệu Kẻ Giết Bò Tót. Theo sự thúc đẩy của các tín đồ mới, Mithras đã chọn dẫn dắt họ ra trận và, trong một thời gian, thế giới thuộc về ngài."
 mithras_chronicle_extra_deed: "Triều đại được ban phước của Thần Mặt Trời trên người La Mã đã kết thúc khi một tôn giáo đối địch, Kitô giáo, bắt đầu lan rộng trong số những người La Mã ít hiếu chiến hơn, một nhóm mà Mithras từ trước đến nay vẫn xem nhẹ để ưu ái lòng nhiệt thành cuồng nhiệt của các binh sĩ tận tụy của mình. Thay vì mạo hiểm đối đầu tốn kém với kẻ thù này và gây nguy hiểm cho đàn chiên của mình, Mithras đã đưa những tín đồ trung thành nhất của mình lên đường đến Britain để tái tạo lại thế giới không tưởng của ngài trên vùng đất chưa được khám phá này."
 mithras_chronicle_conclusion: "Mặc cho Kitô giáo xâm lấn ngay cả vùng đất mới này, xứ Britannia vẫn thịnh vượng dưới sự cai trị của Chúa Tể Ánh Sáng, tự loại bỏ những tín đồ man rợ cuối cùng của các tôn giáo hoang dã. Khôn ngoan lựa chọn hợp tác cùng các tín đồ của Thánh Giá thay vì phát động một cuộc chiến tốn kém, Mithras giờ đây đang khéo léo kéo những sợi chỉ số phận sẽ biến Britannia từ một vùng đất thô lậu chưa bị chinh phục thành một cường quốc thế giới xứng đáng là lãnh địa của ngài."

 legend_chronicle_noddist_chronicle: "Caine: Kẻ Đầu Tiên"
 legend_chronicle_noddist_chronicle_desc: "Câu chuyện về kẻ đầu tiên trong dòng giống của ngươi, Caine"
 noddist_chronicle_opening: "Caine được hầu hết mọi người công nhận rộng rãi là ma cà rồng đầu tiên.\nTrong những ngày đầu tiên của loài người, người con trai của Adam và Eve đã chuẩn bị một lễ vật hiến tế dâng lên Chúa, gồm những hoa quả và rau củ tốt nhất của mình. Người anh trai Abel cũng chuẩn bị một lễ vật hiến tế, là những con vật tốt nhất mà anh đã nuôi dưỡng. Hoặc là có tranh chấp về việc lễ vật của ai tốt hơn, hoặc Chúa thực sự ưu ái lễ vật của Abel hơn của Caine. Kết quả cuối cùng là Caine đã "hiến tế" Abel trên bàn thờ, người anh trai của mình chính là lễ vật "tốt nhất" mà anh có thể dâng lên đấng toàn năng, vì anh không yêu ai hơn người anh trai đó.\nNhư một hình phạt, cha của Cain là Adam đã nguyền rủa anh bằng một dấu ấn trên da thịt, và đuổi anh đi lang thang trong bóng tối."
 noddist_chronicle_motivation: "Lang thang khắp Xứ Nod, Caine gặp Lilith. Nàng nhận thấy một vệt xoáy trong không khí quanh anh; một dấu hiệu của một quyền năng đen tối, khôn dò: sự giết chóc. Anh sở hữu quyền năng giết chết những sinh vật cao hơn — không phải để săn bắt như Adam đã làm, mà để giết chóc như Jehovah đã làm.\nNàng kinh ngạc, vì anh không mang dấu hiệu thần thánh nào, mà lang thang trong bụi đất như một con thú hèn kém. Thấy anh lạnh lẽo và đói khát, nàng đã đón Caine vào hơi ấm của nhà mình. Lilith tự nhận mình là Người Phụ Nữ Đầu Tiên, người vợ nguyên thủy của cha Caine. Sau khi ở cùng nàng một thời gian, cả hai trở thành tình nhân."
 noddist_chronicle_famous_deed: "Sau khi Caine nếm máu của Lilith, anh được ba thiên thần viếng thăm trong một linh ảnh. Những thiên thần này, vốn là sứ giả của Chúa, mỗi vị đều cho Caine cơ hội sám hối vì tội giết anh trai mình là Abel, nhưng Caine đã cự tuyệt họ vì kiêu hãnh, xem hành động của mình là chính đáng.\nMichael, khi bị từ chối, đã nguyền rủa Caine và childer của anh phải sợ hãi ngọn lửa sống của Người hơn bất cứ thứ gì khác.\nRaphael nguyền rủa Caine và childer của anh phải sợ hãi bình minh, vì ánh nắng mặt trời sẽ thiêu đốt như ngọn lửa thánh của Michael.\nUriel sau đó nguyền rủa Caine và childer của anh phải bám lấy Bóng Tối, chỉ uống máu, chỉ ăn tro tàn, và bị đóng băng tại thời khắc cận tử, bị nguyền để mọi thứ họ chạm vào đều tan thành cát bụi.\nMột thiên thần thứ tư, Gabriel, sau đó xuất hiện để trao con đường Golconda, con đường duy nhất đến với "ánh sáng", nhờ lòng thương xót của Chúa."
 noddist_chronicle_extra_deed: "Sau trải nghiệm này, Caine chính thức trở thành kẻ "Thức Tỉnh", sở hữu các Dị năng sau: Celerity, Potence, Fortitude, Obfuscate, Dominate, Presence, Protean, Animalism, và Auspex. Caine sau đó nhận thức được Con Đường Máu, Con Đường Cuối Cùng mà mọi con đường khác đều bắt nguồn từ đó. Và với tất cả những quyền năng này, anh đã phá vỡ mối ràng buộc với Lilith và bỏ lại nàng ở xứ Nod."
 noddist_chronicle_conclusion: "Caine tiếp tục lang thang khắp Xứ Nod trong cô độc, ký ức về tội lỗi của mình nhấn chìm anh trong đau khổ. Phải nhiều thời đại sau anh mới quyết định sống giữa loài người phàm trần trở lại. Quyền năng và dấu ấn của anh được loài người phàm trần biết đến rộng rãi, và một số thậm chí còn tôn thờ anh như một vị thần.\nCuối cùng, Caine định cư tại một cộng đồng nông nghiệp nhỏ, tên là Ubar. Chính tại đây, trong Thành Phố Đầu Tiên này, anh được biết đến với danh hiệu “Người Cha Bóng Tối.”"

 legend_chronicle_lilim_chronicle: "Lilith: Người Phụ Nữ Đầu Tiên"
 legend_chronicle_lilim_chronicle_desc: "Câu chuyện về người phụ nữ đầu tiên, Lilith."
 lilim_chronicle_opening: "Theo hầu hết các truyền thuyết cổ xưa, Lilith là người vợ đầu tiên của Adam, ngang hàng và đối ứng với chàng về quyền lực và trí tuệ. Nàng tách khỏi "con người nguyên thủy", và như một hình phạt, Chúa (còn được gọi là Jehovah) đã trục xuất nàng khỏi vườn Eden, thay thế nàng bằng việc tạo ra Eve.\nHơn nữa, Chúa đã nguyền rủa Lilith để nàng không bao giờ biết đến tình yêu của người khác. Đổi lại, mỗi sinh vật mà Lilith thực sự yêu thương và chăm sóc, không bao giờ có thể thực sự yêu nàng trở lại.\nMột số tín đồ của Lilith cho rằng Adam đã cố cưỡng hiếp Lilith – hoặc có thể chàng đã thực sự làm vậy – điều này đã thúc đẩy Lilith bỏ trốn khỏi Eden thay vì bị trục xuất."
 lilim_chronicle_motivation: "Tuy nhiên, theo phái Bahari, Lilith đã có một chuỗi dài những mối tình với cả Jehovah và Lucifer, những vị thần có Khu Vườn riêng của mình. Lucifer được cho là đã tặng Lilith "áo choàng đêm tối" như một món quà sau khi nàng lang thang khắp các vùng đất bên ngoài Eden, bị thiêu đốt và tra tấn. Nàng đã hái những vì sao từ áo choàng của mình để dùng làm hạt giống tạo nên khu vườn đầu tiên của nàng, Elona, Khu Vườn Hy Vọng."
 lilim_chronicle_famous_deed: "Một số câu chuyện kể rằng Lilith đã du hành và chứng kiến các khu vườn khác, nhưng cuối cùng tìm được đường trở lại khu vườn của Jehovah. Lucifer được cử đến để ngăn nàng vào, tuy nhiên, nàng hứa rằng nàng chỉ muốn thu thập thông tin để tạo khu vườn của riêng mình, và sẽ không lấy đi bất cứ thứ gì. Lucifer đồng ý. Trong khi Lilith ở trong khu vườn, nàng biến thành một con rắn và thấy Eve ngây thơ, người không biết gì về thế giới. Nàng đã đưa cho Eve trái cây, gây ra sự sa ngã của loài người, và trao cho Lilith lời nguyền của nàng."
 lilim_chronicle_extra_deed: "Lilith và Lucifer du hành đến rìa Biển Vô Tận, nơi họ sáng lập D'hainu, Khu Vườn Tái Sinh.\nCuối cùng bị Jehovah và Lucifer bỏ rơi, nàng gặp hậu duệ lang thang bị trục xuất của người chồng cũ, Kẻ Sát Nhân Đầu Tiên (như được đặt tên trong Kinh Thánh) Caine. Nàng đã đón nhận Caine, chăm sóc vết thương của anh, cho anh ăn và chữa lành cho anh, và dạy anh trí tuệ bí mật – hạt giống của nó đã nở rộ thành các Dị năng ma cà rồng."
 lilim_chronicle_conclusion: "Và anh đã đền đáp nàng như thế nào? Bằng cách bỏ rơi nàng luôn, để lang thang mãi mãi cách biệt, người mẹ của quái vật và kẻ đánh cắp hơi thở của trẻ sơ sinh. Caine tiếp tục sáng lập Enoch và Lilith rời khỏi hiện trường. Tuy nhiên, có lời đồn rằng nàng đã tạo ra khu vườn thứ ba, Ba'hara, Khu Vườn Sầu Muộn, từ đó nàng sẽ chuẩn bị cho Gehenna."

 legend_chronicle_setite_chronicle: "Set, Chúa Tể của Duat"
 legend_chronicle_setite_chronicle_desc: "Câu chuyện về vị đại giải phóng, Set."
 setite_chronicle_opening: "Theo đàn chiên trung thành của mình, Set sinh ra tại Ai Cập, bên sông Nile, gần 7.000 năm trước. Ngài là một thợ săn và chiến binh vĩ đại, đối thủ duy nhất của ngài là người anh trai, Osiris. Họ là cháu của Ra, một tù trưởng hùng mạnh đã chinh phục người dân sông Nile, từ đó thống nhất Thượng và Hạ Ai Cập."
 setite_chronicle_motivation: "Cái chết của cha mẹ Set, Geb và Nut, được Ra ra lệnh vì cảm thấy họ đã phản bội mình khi có thêm con cháu. Ra cảm thấy bị đe dọa bởi các dòng dõi hoàng gia và ra lệnh rằng họ không được sinh con. Set đau khổ trước lệnh giết cha mẹ mình, và tiếng nói của ngài trong vấn đề này khiến ngài bị lưu đày. Mặt khác, Osiris, có lẽ vì sợ hãi, đã bày tỏ lòng trung thành với Ra và trở thành người thừa kế ngai vàng."
 setite_chronicle_famous_deed: "Sau cái chết của Ra, Osiris nắm quyền kiểm soát vương quốc, thần thánh hóa ông nội mình và thúc đẩy việc thờ phụng ông như một vị thần. Set trở về với anh trai Osiris, hy vọng hòa giải; tuy nhiên, người anh trai đang trị vì vẫn tiếp tục lệnh lưu đày. Sau đó, Set lấy tên "Sutekh" và du hành về phía bắc đến Assyria."
 setite_chronicle_extra_deed: "Theo truyền thuyết tiếp diễn, Set trở về Ai Cập và hạ gục Vua Osiris cùng con trai ông là Horus. Chiếm Ai Cập làm của riêng, Set cai trị bằng quyền lực – và có lẽ (hoặc có lẽ không) đã tìm cách giải phóng loài người khỏi xiềng xích luật lệ do Ra áp đặt. Dù sự thật có thế nào, Horus đã trở lại từ cõi chết dưới hình dạng một Mummy và tìm cách trả thù cho sự hủy diệt của cha mình, trục xuất Set khỏi ngai vàng Ai Cập và bắt đầu một cuộc thập tự chinh kéo dài hàng thiên niên kỷ."
 setite_chronicle_conclusion: "Trong khi hầu hết tín đồ Setite đồng ý rằng Set từng là ma cà rồng vào một thời điểm nào đó (có lẽ cho đến khi ngài thăng hoa thành Thần), có một số người bác bỏ quan niệm rằng "Người Sáng Lập" của họ từng là người phàm, hay thậm chí từng được Trao truyền. Theo cách diễn giải này, Osiris, Set và Ra đều thực sự là các vị Thần.\nMột điểm gây tranh cãi khác nảy sinh liên quan đến vai trò của "Con Rắn của Hỗn Mang", $glossary_wyrm_apep$ (hay $glossary_wyrm_apophis$). Một số cho rằng nó đã bị Set giết chết (và có lẽ đã bị hấp thụ vào bản thể ngài) trong khi những người khác cho rằng đó thực chất là một đồng minh (hay thậm chí là chủ nhân) của Người Sáng Lập của họ. Cả hai cách diễn giải khó có thể cùng tồn tại và đã gây ra nhiều xích mích thần học bên trong Tín Đồ của Set."
 legend_danu: "[GetDynastyByID( 'POD_fae_dynasty_tuatha_de_danaan' ).GetBaseName]"
 legend_danu_desc: "[GetScriptedCharacterByHistoryID('POD_fae_character_1000').GetFirstName], còn được biết đến là Dana, là mẹ của Tuatha de Danaan. Tuatha de Danaan được đồn rằng đã ban cho Nhân Loại khả năng mơ mộng. Đổi lại, Nhân Loại đã trao cho Tuatha nguyên liệu thô cần thiết để định hình nên Kỷ Nguyên Huyền Thoại. Từ Tuatha, mọi kith khác đã sinh ra và sinh sôi khắp Cõi Mộng. Danu yêu cầu các Người Con của nàng tổ chức lễ hội để vinh danh nàng vào các ngày hạ chí, đông chí và xuân phân, thu phân."
 legend_balor: "Dòng Máu của [ancestor.GetFirstNameNoTooltip]"
 legend_balor_desc: "Trong trận chiến đầu tiên giữa người fomorian và [GetDynastyByID( 'POD_fae_dynasty_tuatha_de_danaan').GetBaseName], một lãnh chúa hùng mạnh tên là [GetScriptedCharacterByHistoryID( 'POD_fae_character_09').GetFirstNameNicknamed] được chọn để dẫn dắt người fomorian trong trận chiến. Thời trẻ, Balor, người chỉ có một mắt, đã bí mật theo dõi một nghi lễ trang trọng mà anh bị cấm chứng kiến. Như một hình phạt, Cõi Mộng đã nguyền rủa anh khiến con mắt của anh trở thành một thứ kinh hoàng. Bất cứ khi nào nó mở ra, một luồng ánh sáng đỏ khủng khiếp phát ra từ đó, giết chết mọi thứ nó nhìn vào. Như đã được tiên tri, anh bị giết bởi chính cháu trai mình [GetScriptedCharacterByHistoryID( 'POD_fae_character_12').GetFirstNameNicknamed]"
 legend_varich: "Người Con của Mặt Trời và Mặt Trăng"
 legend_varich_desc: "Từ lâu lắm rồi, trước khi những giấc mơ tan vỡ, [GetScriptedCharacterByHistoryID('POD_fae_character_19').GetFirstName] đã bước đi trên những vùng đất phương bắc. Anh là người con trai tươi sáng và tuấn tú của Miesiac; được biết đến là Mặt Trăng tóc bạc, mắt đen; và Dazbóga Mặt Trời, người mẹ đầy kiêu hãnh của anh, với những bím tóc vàng óng cuộn xuống tận chân bà và đôi mắt ngọc bích rực rỡ."
 legend_aesin: "Æsir và Vanir"
 legend_aesin_desc: "[GetDynastyByID( 'POD_fae_dynasty_aesin' ).GetBaseName] có dòng dõi từ các vị thần của Asgard, Æsir và Vanir. Một số thậm chí còn tự nhận là hậu duệ của những nhân vật nổi tiếng như [GetScriptedCharacterByHistoryID('POD_fae_character_1024').GetFirstName] và [GetScriptedCharacterByHistoryID('POD_fae_character_1025').GetFirstName]"
 legend_mathonwy: "Di Sản của [ancestor.GetFirstNameNoTooltip]"
 legend_mathonwy_desc: "Vua của Gwynedd, Lãnh chúa của Caer Dathal và một pháp sư vĩ đại của Tuatha de Danaan. Câu chuyện về Mathonwy là chuyện thứ tư trong Bốn Nhánh của Mabinogi."
 legend_eshu: "[ancestor.GetFirstNameNicknamed]"
 legend_eshu_desc: "Sau khi vị Thần vĩ đại Olorun, Orisha vĩ đại nhất, tạo ra thế giới và cho hai con trai của mình, Obatala và Orunmila, thiết kế và sắp đặt nó, ngài đã cử một Orisha khác tên là [ancestor.GetFirstNameNoTooltip], nhà ngôn ngữ học và sứ giả của mình, đi thu thập các lễ vật hiến tế cho ngài. Eshu là orisha có quyền năng cai quản đường xá và cổng vào, kẻ thích gây ra những trò tinh nghịch. Anh không tốt cũng không xấu, anh đơn giản chỉ là chính mình. Anh chơi khăm vì đó là cách của anh. Người tốt học được từ những trò khăm của anh còn kẻ xấu phải chịu khổ. Trong khi ở trần gian anh cũng sinh ra nhiều đứa con sau này trở thành người Eshu, chia sẻ tên và nhiệm vụ của anh. Con cháu của anh, thật không may, đã lấy tên của anh cho riêng mình, dù không có ác ý, và khi Eshu nghe tin người phàm đang đối xử với họ hàng của mình như thể đó là anh, anh biết mình phải trừng phạt những đứa con ngỗ nghịch của mình, nếu không những người khác cũng sẽ mất tên của họ và thế giới sẽ bị đảo lộn. Anh đã làm điều này dù trong lòng vẫn có chút tự hào về những gì tất cả con cái mình đã đạt được và họ đã học được bao nhiêu từ anh. Vì vậy, sau khi quan sát để nghĩ ra hình phạt tốt nhất, anh đã gọi tất cả con cái mình lại và kể cho chúng nghe một bí mật vĩ đại và đầy quyền năng, biến chúng thành sứ giả của mình trước thế giới, ra lệnh cho chúng bằng những lời trang trọng để dạy con cái mình noi theo con đường của anh. Rồi anh bay trở lại bầu trời, cười vang. Trò đùa và hình phạt là gì? Anh đã khiến các con mình làm công việc của anh thay anh và tận hưởng điều đó."