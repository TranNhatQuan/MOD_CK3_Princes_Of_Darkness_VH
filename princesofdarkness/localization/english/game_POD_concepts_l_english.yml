l_english:
 game_concept_princes_of_darkness: "Princes of Darkness"
 game_concept_princes_of_darkness_desc: "Một mod dành cho Crusader Kings 3, xoay quanh các sinh vật siêu nhiên trong '$pod_wod$' của White Wolf. Bạn đang chơi nó ngay lúc này! [Glossary('Prince','game_concept_prince_desc')] là tước hiệu lãnh địa tối cao của một [GetTrait('vampire').GetName( GetNullCharacter )] cai trị một vùng đất, tương đương với một [duchy|E] trong CK3. Bóng tối là gì? Hãy nhìn vào chính nội tâm mình."
 
 game_concept_world_of_darkness: "Thế Giới Bóng Tối"
 game_concept_WoD: "WoD"
 game_concept_world_of_darkness_desc: "Thế Giới Bóng Tối là một vũ trụ đã tồn tại hơn 30 năm nay, với hàng trăm cuốn sách và các loại hình truyền thông khác nói về nó. Ý tưởng chủ đạo là, trong thế giới của chúng ta, nhiều phe phái sinh vật siêu nhiên đang tương tác với nhau bên dưới bề mặt, tạo nên một thế giới ngầm đầy những âm mưu và câu chuyện."
  
 game_concept_prince: "Prince"
 game_concept_princes: "Princes"
 game_concept_prince_desc: "Prince là tước hiệu lãnh địa tối cao của một [GetTrait('vampire').GetName( GetNullCharacter )] cai trị một vùng đất, tương đương với một [duchy|E] trong CK3."
 
 game_concept_blood_potency: "Huyết Lực"
 #game_concept_blood_potency_desc: "Blood Potency is the inherent power of a [GetTrait('vampire').GetName( GetNullCharacter )]'s blood that grows slowly overtime and is limited by the [Glossary('Generation','game_concept_vampgeneration_desc')] of the [GetTrait('vampire').GetName( GetNullCharacter )]. Blood Potency decreases slowly in $pod_torpor$. It can increase more quickly by diablerizing $POD_splat_vampire_plural$ with higher blood potency. Blood Potency impacts how quickly $pod_discipline$ usage increases hunger and how impactful your [GetTrait('vampire').GetName( GetNullCharacter )] powers like [Glossary('Dị Năng','game_concept_discipline_desc')] are."
 game_concept_blood_potency_desc: "#bold Huyết Lực#! là sức mạnh nội tại trong dòng máu của một [GetTrait('vampire').GetName( GetNullCharacter )].\n\nHuyết Lực càng cao càng tăng [skills|E] và mang lại nhiều lợi ích khác nhau, nhưng cũng khiến việc giải tỏa [hunger_with_icon|E] từ người phàm trở nên khó khăn hơn. Cuối cùng, sẽ trở nên cần thiết phải sống dựa vào máu của các Ma Cà Rồng khác.\n\nHuyết Lực tăng rất chậm theo hàng thế kỷ, cho tới một giới hạn tùy theo [Glossary('Generation','game_concept_vampgeneration_desc')] của Ma Cà Rồng đó. $pod_diablerie$ sẽ nâng nó lên cao hơn nữa. Nó giảm dần chậm rãi khi ở trong $pod_torpor$."
 
 game_concept_vampgeneration: "Generation"
 game_concept_vampgeneration_desc: "Theo $pod_cainites$, đây là khoảng cách giữa dòng máu của một $POD_splat_vampire$ với cha đẻ của mọi $POD_splat_vampire_plural$ — Caine.  Caine thuộc về [GetTrait('vampgeneration1').GetName( GetNullCharacter )]. Ma Cà Rồng thuộc [GetTrait('vampgeneration14').GetName( GetNullCharacter )] trở lên là 'huyết mỏng' và gần như là người phàm, hầu như không còn là ma cà rồng nữa. Những ma cà rồng không tin Caine là thủy tổ thường truy nguyên [Glossary('Generation','game_concept_vampgeneration_desc')] của mình về một vị tổ huyền thoại khác. Ma cà rồng có thể giảm [Glossary('Generation','game_concept_vampgeneration_desc')] của mình, và nhờ đó tăng sức mạnh tiềm tàng, bằng cách thực hiện $pod_diablerie$ lên một ma cà rồng có [Glossary('Generation','game_concept_vampgeneration_desc')] thấp hơn mình."
 
 game_concept_bloodbond: "Huyết Ước"
 game_concept_bloodbond_desc: "Uống máu của một [GetTrait('vampire').GetName( GetNullCharacter )] thường tạo ra cảm giác trung thành và phục tùng mãnh liệt đối với [GetTrait('vampire').GetName( GetNullCharacter )] đó. Còn được gọi là 'Huyết Thệ', điều này tạo thành một mối ràng buộc có cường độ tăng dần theo lượng máu được tiêu thụ. Một số ma cà rồng không có khả năng tạo lập ràng buộc bằng máu của mình. Một số khác thì hoàn toàn không thể bị ràng buộc."
 
 game_concept_beast: "Dã Thú"
 game_concept_the_beast: "Dã Thú"
 game_concept_beasts: "Dã Thú"
 game_concept_beast_desc: "#bold Dã Thú#! là thuật ngữ mà $POD_splat_vampire_plural$ dùng để chỉ kẻ săn mồi tiềm ẩn bên trong, luôn tìm cách chiếm quyền kiểm soát tâm trí họ. Nó đối lập trực tiếp với Nhân Tính của họ và là nguyên nhân của nhiều thôi thúc đồi bại mà $pod_cainites$ cảm nhận được mỗi đêm.\n\nTrong những lúc cực kỳ nguy khốn, Dã Thú có thể áp đảo một [GetTrait('vampire').GetName( GetNullCharacter )], đẩy họ vào Phẫn Cuồng, một trạng thái bản năng thuần túy giữa chiến đấu và bỏ chạy.\n\nTrong [princes_of_darkness|E], đôi khi Dã Thú sẽ nói chuyện với bạn #beast như thế này#!. Nếu một [GetTrait('vampire').GetName( GetNullCharacter )] rơi xuống âm trong [piety|E], họ có nguy cơ rơi vào phẫn cuồng vĩnh viễn và trở thành một [GetTrait('wight').GetName( GetNullCharacter )]. Đây coi như một sự thoái vị mặc nhiên cho [heir|E] của họ."
 
 game_concept_the_masquerade: "Màn Che"
 game_concept_masquerade_exposure: "Nguy Cơ Lộ Diện"
 game_concept_masquerade_exposure_with_icon: "@masquerade_icon! Nguy Cơ Lộ Diện"
 game_concept_the_masquerade_desc: "Màn Che là thuật ngữ mà $POD_splat_vampire_plural$ dùng để chỉ việc giữ kín sự tồn tại của họ trước người phàm.  Vi phạm Màn Che có thể dẫn đến những hậu quả như bị thợ săn tấn công. Ở một số lãnh địa, điều này có thể bị xem là một [crime|E] giữa các ma cà rồng.\nHầu hết các tín ngưỡng có thể che giấu những vụ vi phạm Màn Che bằng một [character_interaction|E] cá nhân. Nếu Nguy Cơ Lộ Diện quá cao sẽ dẫn đến các cuộc nổi loạn phe phái và các sự kiện khiến nhân vật của bạn bị tấn công."

 game_concept_cainites: "Hậu Duệ Cain"
 game_concept_cainite: "Hậu Duệ Cain"
 game_concept_cainite_desc: "Hầu hết $POD_splat_vampire_plural$ đồng tình với 'câu chuyện khởi nguyên từ Caine' về nòi giống của họ. Kẻ sát nhân đầu tiên trong Kinh Thánh, sau khi giết chính em trai mình là Abel, đã bị Chúa và các thiên thần của Người nguyền rủa theo nhiều cách khác nhau, cuối cùng dẫn đến tình trạng ma cà rồng được biết đến ngày nay.\nVì lẽ đó, Hậu Duệ Cain đã trở thành một thuật ngữ rất phổ biến mà ma cà rồng dùng để tự gọi mình.\nThuật ngữ này cũng được dùng khi nói riêng về ma cà rồng \"phương Tây\", để phân biệt với $pod_kueijin$ phương Đông."

 game_concept_diablerist: "Kẻ Hành Diablerie"
 game_concept_diablerizing: "Đang Hành Diablerie"
 game_concept_diablerized: "Đã Bị Hành Diablerie"
 game_concept_diablerize: "Hành Diablerie"
 game_concept_diablerie: "Diablerie"
 game_concept_diablerie_desc: "Tội ác ghê tởm nhất mà một ma cà rồng có thể phạm phải, một vụ diablerie xảy ra khi toàn bộ máu của một ma cà rồng bị một kẻ khác uống cạn, khiến cho linh hồn của nạn nhân cũng bị nuốt chửng theo. Quá trình này, dù bị hầu hết mọi người khinh miệt, mang lại sức mạnh lớn hơn cho kẻ thực hiện, vì họ có thể học được một số năng lực của nạn nhân hoặc giảm generation của mình, đưa họ đến gần Caine hơn.\nTrong game, diablerie là một scheme có thể thực hiện nhắm vào các $POD_splat_vampire_plural$ khác. Nếu bạn thực hiện thành công, bạn có thể nhận được năng lực mới, tăng huyết lực, giảm generation, nhưng phải trả giá bằng một lượng piety đáng kể (tùy theo tôn giáo của bạn) và một bí mật khó giữ kín kể từ đó."
 
 game_concept_resonance: "Cộng Hưởng"
 game_concept_resonance_desc: "Máu mang một phẩm chất nhất định tùy theo tính cách và cảm xúc của người chứa nó. Việc uống máu ban cho $POD_splat_vampire_plural$ sức mạnh dựa theo bản chất của Cộng Hưởng đó. Bạn nhận thêm kinh nghiệm $pod_discipline$ khi uống máu có Cộng Hưởng phù hợp, hoặc qua #V $POD_hunt_target_interaction$#! [journey|E], hoặc thụ động bằng cách uống máu từ [POD_herd|E] của mình. Các loại Cộng Hưởng gồm:\n$BULLET_WITH_TAB$[choleric_lifestyle|E]\n$BULLET_WITH_TAB$[melancholy_lifestyle|E]\n$BULLET_WITH_TAB$[phlegmatic_lifestyle|E]\n$BULLET_WITH_TAB$[sanguine_lifestyle|E]\n$BULLET_WITH_TAB$[animal_lifestyle|E]"
 
 game_concept_torpor: "Miên Trạng"
 game_concept_torpor_desc: "Miên Trạng là một trạng thái ngủ đông tựa như hôn mê đối với một [GetTrait('vampire').GetName( GetNullCharacter )]. Dù không thể cử động, họ vẫn có thể nhận biết được những sự việc xảy ra xung quanh mình. Nó có thể do bị đóng cọc xuyên tim, chịu đủ tổn thương cơ thể, đói khát tột độ hoặc chán chường mà ra.\nMột nhân vật mang [trait|E] [GetTrait('torpor').GetName( GetNullCharacter )] sẽ bị suy yếu nghiêm trọng, không thể bị tương tác bởi hầu hết các hành động và không thể cai trị. Họ có thể được đánh thức bằng [character_interaction|E] đặc biệt #V $POD_wake_from_torpor_interaction$#!."
 game_concept_torpid: "miên trạng"
 
 game_concept_hunger: "Cơn Đói"
 game_concept_hunger_desc: "#bold Cơn Đói#! là khát vọng của một [GetTrait('vampire').GetName( GetNullCharacter )] muốn uống máu. Nó bị gây ra bởi [Glossary('The Beast','game_concept_beast_desc')]. [blood_potency|E] của Ma Cà Rồng càng cao, họ càng cần nhiều máu hơn để hạ Cơn Đói xuống. Việc tăng Cơn Đói có cả hiệu ứng tích cực lẫn phần lớn là tiêu cực.\n\nCách duy nhất để Cơn Đói của một [GetTrait('vampire').GetName( GetNullCharacter )] được thỏa mãn hoàn toàn là giết chết và rút cạn toàn bộ máu của một nạn nhân.  Ngay cả sự thỏa mãn Cơn Đói ấy cũng chỉ là tạm thời.\n\n[ghouls|E] cũng có Cơn Đói, kèm theo rắc rối bổ sung là [ghoul_vitae_dependency|E]."
 game_concept_hunger_i: "@blood_icon!"
 game_concept_hunger_with_icon: "@blood_icon!Cơn Đói"
 
 game_concept_discipline: "Dị Năng"
 game_concept_disciplines: "Dị Năng"
 game_concept_discipline_desc: "#bold Dị Năng#! là các năng lực siêu nhiên của $POD_splat_vampire_plural$. Nhiều năng lực trong số đó tương ứng với các khả năng ma cà rồng trong truyền thuyết dân gian, như sức mạnh siêu nhiên ([GetTrait('potence').GetName(GetNullCharacter)]), tốc độ ([GetTrait('celerity').GetName(GetNullCharacter)]), sức bền ([GetTrait('fortitude').GetName(GetNullCharacter)]) hay tàng hình ([GetTrait('obfuscate').GetName(GetNullCharacter)]).\n\nNguồn gốc của Dị Năng không được biết rõ, nhưng nhiều người tin rằng chúng là những món quà từ Caine hoặc Lilith, và một vài [Glossary('Antediluvian','game_concept_antediluvian_desc')] được cho là đã sáng tạo ra những Dị Năng độc nhất, được truyền lại qua dòng dõi của họ.\n\nTrong [princes_of_darkness|E], Dị Năng là các cây [perk|E] được mở khóa bởi [trait|E] Dị Năng tương ứng. Mỗi $pod_clan$ có ba Dị Năng liên kết mà thành viên của họ khởi đầu đã có, và các Dị Năng khác có thể được học qua [journeys|E], hoặc qua những phương cách kém quang minh hơn như $pod_diablerie$. Kinh nghiệm cho các [lifestyles|E] Dị Năng có được bằng cách uống máu với [resonance|E] phù hợp."

 game_concept_choleric_lifestyle: "Cộng Hưởng Nóng Nảy"
 game_concept_choleric_lifestyle_desc: "Cộng Hưởng Nóng Nảy phù hợp cho $POD_splat_vampire_plural$ muốn cải thiện [Glossary('Dị Năng','game_concept_discipline_desc')] liên quan đến việc uống máu mang cảm xúc như giận dữ và đố kỵ. Hãy tìm con mồi có [traits|E] tính cách như [GetTrait('wrathful').GetName( GetNullCharacter )] và [GetTrait('sadistic').GetName( GetNullCharacter )].\n\nCác [Glossary('Dị Năng','game_concept_discipline_desc')] phổ biến của nó gồm:\n$BULLET_WITH_TAB$[GetTrait('celerity').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('potence').GetName( GetNullCharacter )]\n\nCác [Glossary('Dị Năng','game_concept_discipline_desc')] hiếm của nó gồm:\n$BULLET_WITH_TAB$[GetTrait('valeren').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('vicissitude').GetName( GetNullCharacter )]"

 game_concept_sanguine_lifestyle: "Cộng Hưởng Đa Cảm"
 game_concept_sanguine_lifestyle_desc: "Cộng Hưởng Đa Cảm phù hợp cho $POD_splat_vampire_plural$ muốn cải thiện [Glossary('Dị Năng','game_concept_discipline_desc')] liên quan đến việc uống máu mang cảm xúc như hạnh phúc và nhiệt tình. Hãy tìm con mồi có [traits|E] tính cách như [GetTrait('gregarious').GetName( GetNullCharacter )] và [GetTrait('lustful').GetName( GetNullCharacter )].\n\nCác [Glossary('Dị Năng','game_concept_discipline_desc')] phổ biến của nó gồm:\n$BULLET_WITH_TAB$[GetTrait('presence').GetName( GetNullCharacter )]\n\nCác [Glossary('Dị Năng','game_concept_discipline_desc')] hiếm của nó gồm:\n$BULLET_WITH_TAB$[GetTrait('bloodsorcery').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('daimonion').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('kai').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('quietus').GetName( GetNullCharacter )]"

 game_concept_blood_magic_lifestyle: "Chú Thuật Huyết Mạch"
 game_concept_blood_magic_lifestyle_desc: "Thông qua việc thực hành Chú Thuật Huyết Mạch, một Hậu Duệ Cain có thể triệu hồi lửa, điều khiển thời tiết, và làm nhiều điều khác trái với tự nhiên ngay cả theo tiêu chuẩn của ma cà rồng. Thực hành Blood Sorcery là uốn ép chính dòng Máu của mình phải khuất phục. Bất kỳ hình thức nào của năng lực này đều nhắc nhở một ma cà rồng rằng họ đã cách xa con người biết bao, vì không có người phàm nào có thể sử dụng phép thuật theo cách này."

 game_concept_faith_lifestyle: "Đức Tin Chân Chính"
 # game_concept_faith: "$game_concept_faith_lifestyle$" Overwrite vanilla concept
 game_concept_faith_lifestyle_desc: "Một ân sủng hiếm có dành cho những nhân vật cực kỳ sùng đạo, trait Đức Tin Chân Chính mở ra lifestyle cùng tên, nơi nhiều năng lực khác nhau có thể đạt được nhờ XP lifestyle tương ứng"

 game_concept_phlegmatic_lifestyle: "Cộng Hưởng Điềm Đạm"
 game_concept_phlegmatic_lifestyle_desc: "Cộng Hưởng Điềm Đạm phù hợp cho $POD_splat_vampire_plural$ muốn cải thiện [Glossary('Dị Năng','game_concept_discipline_desc')] liên quan đến việc uống máu mang cảm xúc như đa cảm và kiềm chế. Hãy tìm con mồi có [traits|E] tính cách như [GetTrait('lazy').GetName( GetNullCharacter )] và [GetTrait('content').GetName( GetNullCharacter )].\n\nCác [Glossary('Dị Năng','game_concept_discipline_desc')] phổ biến của nó gồm:\n$BULLET_WITH_TAB$[GetTrait('auspex').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('dominate').GetName( GetNullCharacter )]\n\nCác [Glossary('Dị Năng','game_concept_discipline_desc')] hiếm của nó gồm:\n$BULLET_WITH_TAB$[GetTrait('dementation').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('melpominee').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('mytherceria').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('temporis').GetName( GetNullCharacter )]"

 game_concept_melancholy_lifestyle: "Cộng Hưởng U Sầu"
 game_concept_melancholy_lifestyle_desc: "Cộng Hưởng U Sầu phù hợp cho $POD_splat_vampire_plural$ muốn cải thiện [Glossary('Dị Năng','game_concept_discipline_desc')] liên quan đến việc uống máu mang cảm xúc như buồn bã và suy tư trí tuệ. Hãy tìm con mồi có [traits|E] tính cách như [GetTrait('shy').GetName( GetNullCharacter )] và [GetTrait('craven').GetName( GetNullCharacter )].\n\nCác [Glossary('Dị Năng','game_concept_discipline_desc')] phổ biến của nó gồm:\n$BULLET_WITH_TAB$[GetTrait('fortitude').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('obfuscate').GetName( GetNullCharacter )]\n\nCác [Glossary('Dị Năng','game_concept_discipline_desc')] hiếm của nó gồm:\n$BULLET_WITH_TAB$[GetTrait('bardo').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('chimerstry').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('necromancy').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('obtenebration').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('rift').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('visceratika').GetName( GetNullCharacter )]"

 game_concept_animal_lifestyle: "Cộng Hưởng Thú Tính"
 game_concept_animal_lifestyle_desc: "Cộng Hưởng Thú Tính phù hợp cho $POD_splat_vampire_plural$ muốn cải thiện [Glossary('Dị Năng','game_concept_discipline_desc')] liên quan đến việc uống máu từ động vật. Hãy tìm động vật làm con mồi.\n\nCác [Glossary('Dị Năng','game_concept_discipline_desc')] phổ biến của nó gồm:\n$BULLET_WITH_TAB$[GetTrait('animalism').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('protean').GetName( GetNullCharacter )]\n\nCác [Glossary('Dị Năng','game_concept_discipline_desc')] hiếm của nó gồm:\n$BULLET_WITH_TAB$[GetTrait('abombwe').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('serpentis').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('spiritus').GetName( GetNullCharacter )]\n\n$pod_discipline$ [GetTrait('flight').GetName( GetNullCharacter )] chỉ dành riêng cho các #TOOLTIP:GAME_TRAIT,gargoyle,[GetNullCharacter] #L Gargoyle#!#!."

 game_concept_blood_draught: "Draught"
 game_concept_blood_draught_desc: "Máu của ma cà rồng trở nên bão hòa với sức mạnh của $pod_discipline$ của họ, truyền lại một phần sức mạnh đó cho bất kỳ ai uống nó. Draught được ban phát thông qua một [character_interaction|E]."

 game_concept_shapeshift: "Biến Hình"
 game_concept_shapeshift_desc: "Một [character_interaction|E] cho phép người dùng biến đổi hình dạng của mình theo một cách nào đó, thường bắt nguồn từ [GetTrait('protean').GetName( GetNullCharacter )] hoặc [GetTrait('vicissitude').GetName( GetNullCharacter )]."

 game_concept_bloodsorcery: "Huyết Thuật"
 game_concept_bloodsorcerer: "Huyết Thuật Sư"
 game_concept_thaumaturgy: "Thaumaturgy"
 game_concept_durnaki: "Dur-An-Ki"
 game_concept_bloodsorcery_desc: "Huyết thuật, còn được gọi là Thaumaturgy, Akhu, Dur-An-Ki và Valeran, là nghệ thuật sử dụng $pod_vitae$ của ma cà rồng để triệu gợi những hiệu ứng phép thuật mạnh mẽ. Chỉ một số ít clan sở hữu và luôn được canh giữ cẩn mật, huyết thuật là một công cụ mạnh mẽ nhưng nguy hiểm và tốn kém. Mỗi phe phái có cách riêng để khơi gợi sức mạnh của máu — Tremere sử dụng phép thuật Hermetic và các biểu tượng huyền bí, các pháp sư của Banu Haqim lập giao ước với thần linh và các vị thần. Trong khi đó, Lasombra lao mình vào vực thẳm để gọi ra những phép huyền bí. Người ta nói rằng huyết thuật có sức mạnh gần như làm được mọi thứ — và mặc dù những lời đồn này thường xuất phát từ những kẻ hành thuật muốn tạo dựng hình ảnh đáng sợ, hoặc từ nạn nhân của các lời nguyền và quả cầu lửa, thì quả thực đúng là huyết thuật mở ra vô số phép thuật và năng lực mà người ta có thể coi là... Phi Tự Nhiên."
 
 game_concept_necromancy: "Tử Linh Thuật"
 game_concept_necromancy_desc: "Tử Linh Thuật là một dạng [bloodsorcery|E] liên quan đến cái chết, [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] và $POD_splat_wraith_plural$, những linh hồn của người đã khuất. \n Bằng cách vận dụng sức mạnh của hư vô và vực thẳm, các thuật sĩ tử linh có thể trói buộc các oan hồn theo ý muốn của mình và ra lệnh cho chúng thực hiện nhiều nhiệm vụ khác nhau — từ do thám cho đến chiếm hữu."
 
 game_concept_primogen: "Primogen"
 game_concept_primogen_desc: "Primogen là một tước vị chính thức dành cho $POD_splat_vampire_plural$ đóng vai trò đại diện cho [Glossary('Clans','game_concept_Clan_desc')] của mình. Họ thường là thành viên lâu đời nhất trong clan của mình tại thành phố. Nhìn chung, các [Glossary('Princes','game_concept_prince_desc')] cai trị đánh giá cao Primogen và ý kiến của họ. Họ được mời tham vấn cho các quyết định, và những khuyến nghị của họ có trọng lượng lớn.\n\nTrong game, Primogen là các [court_positions|E] dành cho ma cà rồng có [rank|E] [kingdom|E] trở lên. Một $pod_clan$ không có Primogen đại diện sẽ cảm thấy bị gạt ra ngoài lề, dẫn đến các khoản phạt [opinion|E] với các thành viên của mình.\n\nĐể biết những yếu tố tạo nên một Primogen tài giỏi, xem [primogen_aptitude|E]."
 
 game_concept_primogen_aptitude: "Năng Lực Primogen"
 game_concept_primogen_aptitude_desc: "Mỗi [court_position|E] [primogen|E] đòi hỏi những bộ kỹ năng khác nhau.\n\n$EFFECT_LIST_BULLET$[assamite_primogen|E]\n$EFFECT_LIST_BULLET$[brujah_primogen|E]\n$EFFECT_LIST_BULLET$[cappadocian_primogen|E]\n$EFFECT_LIST_BULLET$[gangrel_primogen|E]\n$EFFECT_LIST_BULLET$[gargoyle_primogen|E]\n$EFFECT_LIST_BULLET$[lasombra_primogen|E]\n$EFFECT_LIST_BULLET$[malkavian_primogen|E]\n$EFFECT_LIST_BULLET$[nosferatu_primogen|E]\n$EFFECT_LIST_BULLET$[ravnos_primogen|E]\n$EFFECT_LIST_BULLET$[salubri_primogen|E]\n$EFFECT_LIST_BULLET$[setite_primogen|E]\n$EFFECT_LIST_BULLET$[toreador_primogen|E]\n$EFFECT_LIST_BULLET$[tremere_primogen|E]\n$EFFECT_LIST_BULLET$[tzimisce_primogen|E]\n$EFFECT_LIST_BULLET$[ventrue_primogen|E]"
 
 game_concept_brujah_primogen: "$brujah_primogen_court_position$"
 game_concept_brujah_primogen_desc: "Một [primogen|E] [GetTrait('brujah').GetName(GetNullCharacter)] cần [martial|E], [learning|E], và [prowess|E] tốt.\n\nLà [GetTrait('scholar').GetName(GetNullCharacter)] và/hoặc [GetTrait('strategist').GetName(GetNullCharacter)] sẽ có ích.\n\nLà [GetTrait('wrathful').GetName(GetNullCharacter)] sẽ làm giảm hiệu quả."
 
 game_concept_cappadocian_primogen: "$cappadocian_primogen_court_position$"
 game_concept_cappadocian_primogen_desc: "Một [primogen|E] [GetTrait('cappadocian').GetName(GetNullCharacter)] cần [learning|E] và [stewardship|E] tốt.\n\nLà [GetTrait('patient').GetName(GetNullCharacter)], một [GetTrait('scholar').GetName(GetNullCharacter)], một #TOOLTIP:GAME_TRAIT,lifestyle_physician,[GetNullCharacter] #L Thầy Thuốc#!#!, và/hoặc một [GetTrait('lifestyle_herbalist').GetName(GetNullCharacter)] sẽ có ích.\n\nLà một #TOOLTIP:GAME_TRAIT,lifestyle_mystic,[GetNullCharacter] #L Nhà Huyền Học#!#! sẽ có ích đôi chút."
 
 game_concept_lasombra_primogen: "$lasombra_primogen_court_position$"
 game_concept_lasombra_primogen_desc: "Một [primogen|E] [GetTrait('lasombra').GetName(GetNullCharacter)] cần [intrigue|E], [stewardship|E], và [diplomacy|E] tốt.\n\nLà [GetTrait('arrogant').GetName(GetNullCharacter)], [GetTrait('ambitious').GetName(GetNullCharacter)], [GetTrait('zealous').GetName(GetNullCharacter)], và/hoặc một [GetTrait('schemer').GetName(GetNullCharacter)] sẽ có ích."
 
 game_concept_toreador_primogen: "$toreador_primogen_court_position$"
 game_concept_toreador_primogen_desc: "Một [primogen|E] [GetTrait('toreador').GetName(GetNullCharacter)] cần [diplomacy|E] và [intrigue|E] tốt.\n\nLà [GetTrait('gregarious').GetName(GetNullCharacter)] và/hoặc một [GetTrait('lifestyle_poet').GetName(GetNullCharacter)] sẽ có ích.\n\nCũng sẽ có ích nếu [culture|E] của nhân vật có một [tradition|E] cải thiện [trait|E] [GetTrait('lifestyle_poet').GetName(GetNullCharacter)] (chẳng hạn [GetCultureTradition('tradition_chanson_de_geste').GetName]) và/hoặc cải thiện #TOOLTIP:COURT_POSITION_TYPE,court_poet_court_position #L Thi Sĩ Cung Đình#!#! (chẳng hạn [GetCultureTradition('tradition_poetry').GetName])."
 
 game_concept_tzimisce_primogen: "$tzimisce_primogen_court_position$"
 game_concept_tzimisce_primogen_desc: "Một [primogen|E] [GetTrait('tzimisce').GetName(GetNullCharacter)] cần [learning|E], [stewardship|E], và [intrigue|E] tốt.\n\nLà [GetTrait('sadistic').GetName(GetNullCharacter)], [GetTrait('diligent').GetName(GetNullCharacter)], và/hoặc một [GetTrait('torturer').GetName(GetNullCharacter)] sẽ có ích.\n\n#help Bạn không thể đảm nhiệm court position này nếu bạn là [GetTrait('tremere').GetName(GetNullCharacter)].#!"
 
 game_concept_ventrue_primogen: "$ventrue_primogen_court_position$"
 game_concept_ventrue_primogen_desc: "Một [primogen|E] [GetTrait('ventrue').GetName(GetNullCharacter)] cần [stewardship|E], [diplomacy|E], và [martial|E] tốt.\n\nLà [GetTrait('ambitious').GetName(GetNullCharacter)] sẽ có ích.\n\nMột Ventrue Primogen cai trị một [kingdom|E] sẽ nhận được sự gia tăng lớn cho [aptitude|E] của mình."
 
 game_concept_assamite_primogen: "$assamite_primogen_court_position$"
 game_concept_assamite_primogen_desc: "Một [primogen|E] [GetTrait('assamite').GetName(GetNullCharacter)] cần [diplomacy|E], [martial|E], [learning|E], và [prowess|E] tốt.\n\nLà [GetTrait('diligent').GetName(GetNullCharacter)] sẽ có ích.\n\n#help Bạn chỉ có thể đảm nhiệm court position này nếu bạn là [GetTrait('assamite').GetName(GetNullCharacter)], theo một tín ngưỡng Ashirra, hoặc có kinh đô nằm trong [GetGeographicalRegion('world_middle_east').GetName].#!"
 
 game_concept_gangrel_primogen: "$gangrel_primogen_court_position$"
 game_concept_gangrel_primogen_desc: "Một [primogen|E] [GetTrait('gangrel').GetName(GetNullCharacter)] cần [prowess|E] tốt.\n\nLà [GetTrait('brave').GetName(GetNullCharacter)], [GetTrait('wrathful').GetName(GetNullCharacter)], và/hoặc một [GetTrait('shieldmaiden').GetName(GetNullCharacter)] sẽ có ích.\n\nLà một #TOOLTIP:GAME_TRAIT,lifestyle_blademaster,[GetNullCharacter] #L Kiếm Sĩ#!#! sẽ có ích đôi chút."
 
 game_concept_malkavian_primogen: "$malkavian_primogen_court_position$"
 game_concept_malkavian_primogen_desc: "Một [primogen|E] [GetTrait('malkavian').GetName(GetNullCharacter)] cần [diplomacy|E] và [learning|E] tốt.\n\nCó [GetTrait('auspexadvanced').GetName(GetNullCharacter)], là [GetTrait('gregarious').GetName(GetNullCharacter)], [GetTrait('honest').GetName(GetNullCharacter)], và/hoặc một [GetTrait('lifestyle_herbalist').GetName(GetNullCharacter)] sẽ có ích.\n\nLà một #TOOLTIP:GAME_TRAIT,lifestyle_mystic,[GetNullCharacter] #L Nhà Huyền Học#!#! cũng sẽ có ích (tăng theo cấp độ trait)."
 
 game_concept_nosferatu_primogen: "$nosferatu_primogen_court_position$"
 game_concept_nosferatu_primogen_desc: "Một [primogen|E] [GetTrait('nosferatu').GetName(GetNullCharacter)] cần [intrigue|E], [diplomacy|E], và [stewardship|E] tốt.\n\nCó [GetTrait('obfuscateadvanced').GetName(GetNullCharacter)], là một [GetTrait('schemer').GetName(GetNullCharacter)], [GetTrait('deceitful').GetName(GetNullCharacter)], và/hoặc [GetTrait('patient').GetName(GetNullCharacter)] sẽ có ích.\n\nLà [GetTrait('honest').GetName(GetNullCharacter)] sẽ làm giảm hiệu quả."
 
 game_concept_ravnos_primogen: "$ravnos_primogen_court_position$"
 game_concept_ravnos_primogen_desc: "Một [primogen|E] [GetTrait('ravnos').GetName(GetNullCharacter)] cần [intrigue|E], [martial|E], [stewardship|E], và [learning|E] tốt.\n\nLà [GetTrait('gregarious').GetName(GetNullCharacter)] và/hoặc [GetTrait('zealous').GetName(GetNullCharacter)] sẽ có ích.\n\n#help Bạn chỉ có thể đảm nhiệm court position này nếu bạn là [GetTrait('ravnos').GetName(GetNullCharacter)], hoặc có kinh đô nằm trong [GetGeographicalRegion('world_india').GetName].#!"
 
 game_concept_setite_primogen: "$setite_primogen_court_position$"
 game_concept_setite_primogen_desc: "Một [primogen|E] [GetTrait('setite').GetName(GetNullCharacter)] cần [intrigue|E], [diplomacy|E], và [learning|E] tốt.\n\nLà [GetTrait('deceitful').GetName(GetNullCharacter)], [GetTrait('gregarious').GetName(GetNullCharacter)], và/hoặc [GetTrait('zealous').GetName(GetNullCharacter)] sẽ có ích.\n\n#help Bạn chỉ có thể đảm nhiệm court position này nếu bạn là một [GetTrait('setite').GetName(GetNullCharacter)], hoặc có [faith|E] mang [doctrine|E] [GetFaithDoctrine('special_doctrine_set_pillars_kindred').GetBaseName] hoặc [GetFaithDoctrine('special_doctrine_set_corrupted_kindred').GetBaseName].#!"
 
 game_concept_tremere_primogen: "$tremere_primogen_court_position$"
 game_concept_tremere_primogen_desc: "Một [primogen|E] [GetTrait('tremere').GetName(GetNullCharacter)] cần [intrigue|E] và [learning|E] tốt.\n\nLà [GetTrait('patient').GetName(GetNullCharacter)], một [GetTrait('scholar').GetName(GetNullCharacter)], và/hoặc một [GetTrait('lifestyle_herbalist').GetName(GetNullCharacter)] sẽ có ích.\n\nLà một #TOOLTIP:GAME_TRAIT,lifestyle_mystic,[GetNullCharacter] #L Nhà Huyền Học#!#! sẽ có ích đôi chút.\n\n#help Bạn không thể đảm nhiệm court position này nếu bạn là [GetTrait('tzimisce').GetName(GetNullCharacter)], [GetTrait('salubri').GetName(GetNullCharacter)], [GetTrait('assamite').GetName(GetNullCharacter)], theo một tín ngưỡng Ashirra, hoặc có kinh đô nằm trong [GetGeographicalRegion('world_middle_east').GetName].#!"
 
 game_concept_salubri_primogen: "$salubri_primogen_court_position$"
 game_concept_salubri_primogen_desc: "Một [primogen|E] [GetTrait('salubri').GetName(GetNullCharacter)] cần [prowess|E] và [learning|E] tốt.\n\nLà [GetTrait('vengeful').GetName(GetNullCharacter)] và/hoặc một [GetTrait('scholar').GetName(GetNullCharacter)] sẽ có ích.\n\nLà một #TOOLTIP:GAME_TRAIT,lifestyle_blademaster,[GetNullCharacter] #L Kiếm Sĩ#!#! sẽ có ích đôi chút.\n\n#help Bạn chỉ có thể đảm nhiệm court position này nếu bạn là [GetTrait('salubri').GetName(GetNullCharacter)].#!"

 game_concept_gargoyle_primogen: "$gargoyle_primogen_court_position$"
 game_concept_gargoyle_primogen_desc: "Một [primogen|E] [GetTrait('gargoyle').GetName(GetNullCharacter)] cần [prowess|E] tốt.\n\nLà [GetTrait('wrathful').GetName(GetNullCharacter)], [GetTrait('callous').GetName(GetNullCharacter)] và/hoặc [GetTrait('brave').GetName(GetNullCharacter)] sẽ có ích.\n\nLà một #TOOLTIP:GAME_TRAIT,lifestyle_hunter,[GetNullCharacter] #L Thợ Săn#!#! sẽ có ích đôi chút.\n\n#help Bạn chỉ có thể đảm nhiệm court position này nếu bạn là một [GetTrait('gargoyle').GetName(GetNullCharacter)], hoặc nếu bạn là một [emperor|E] sau khi [GetTrait('visceratika').GetName( GetNullCharacter )] đã được khám phá.#!"
 
 game_concept_splat: "Splat"
 game_concept_splats: "Splats"
 game_concept_subsplat: "Subsplat"
 game_concept_splat_desc: "Thuật ngữ "Splat" chỉ loại sinh vật siêu nhiên mà bạn là. Trong [princes_of_darkness|E], splat của bạn được biểu thị bằng một [trait|E].\n\nTrong bookmark #bold Dark Ages: Vampire#!, các splat sau có thể chơi được:\n$EFFECT_LIST_BULLET$$POD_splat_vampire$\n$EFFECT_LIST_BULLET$$POD_splat_ghoul$\n$EFFECT_LIST_BULLET$$POD_splat_kueijin$\n\nTrong bookmark #bold Hunters & Hunted#!, các splat sau có thể chơi được:\n$EFFECT_LIST_BULLET$#italic Tất cả những splat trước đó, cộng thêm:#!\n$EFFECT_LIST_BULLET$$POD_splat_hunter$\n$EFFECT_LIST_BULLET$$POD_splat_revenant$\n$EFFECT_LIST_BULLET$$POD_splat_mummy$\n$EFFECT_LIST_BULLET$$POD_splat_werewolf$\n$EFFECT_LIST_BULLET$$POD_splat_bastet$\n$EFFECT_LIST_BULLET$$POD_splat_mokole$\n$EFFECT_LIST_BULLET$$POD_splat_demon$\n\nTrong bookmark #bold Dark Ages: Fae#!, các splat sau có thể chơi được:\n$EFFECT_LIST_BULLET$#italic Tất cả những splat trước đó, cộng thêm:#!\n$EFFECT_LIST_BULLET$$POD_splat_fae$\n$EFFECT_LIST_BULLET$$POD_splat_changeling$"
 
 game_concept_battle_modifier: "Bộ Chỉnh Trận Chiến"
 game_concept_battle_modifier_desc: "Các bộ chỉnh trận chiến sẽ bị gỡ bỏ khi trận chiến chống lại người tạo ra nó kết thúc."

 
 game_concept_endowments_lifestyle: "Lifestyle Xác Tín"
 game_concept_endowments_lifestyle_desc: "Xác Tín thể hiện tiến trình của một Nhà Điều Tra trên con đường tinh thông các phương pháp tiêu diệt tôi tớ của Địa Ngục thuộc dòng tu của họ."
 
 game_concept_obtenebration: "Obtenebration"
 game_concept_obtenebration_desc: "Obtenebration, năng lực điều khiển và thao túng bóng tối, là $pod_discipline$ mà $pod_clan$ của Bóng Tối lấy tên từ đó. Những kẻ mới học dị năng này có thể dùng nó để di chuyển và thao túng bóng tối theo ý mình, trong khi các bậc thầy có thể ban cho bóng tối hình dạng, thực thể, và một dáng vẻ tựa như sự sống. Bản chất của nguồn gốc sức mạnh này gây ra không ít bất đồng giữa những người Lasombra. Những trưởng lão cổ xưa nhất của $pod_clan$ cho rằng bóng tối tự thân là một thực thể nguyên sơ, ngang hàng và đối lập với lực sáng tạo đã sinh ra thế giới. Chịu ảnh hưởng của Zoroastrianism, những bậc trưởng lão thường gọi thế lực bóng tối này là Ahriman. Những người Lasombra khác lại tin rằng Obtenebration rút sức mạnh từ một cõi bóng tối chứ không phải từ một thực thể. Những người Lasombra hướng theo một trong các tín ngưỡng Abraham có thể gọi đó là Địa Ngục, trong khi một tín đồ của các vị thần Hy Lạp hay La Mã cổ đại có thể gọi đó là Tartarus. Dù nguồn gốc của nó là gì, Obtenebration hoàn toàn khiến những ai chứng kiến nó phải rùng mình. Nó gợi lên nỗi kinh hoàng nơi động vật hay người phàm khi thấy $pod_discipline$ này được sử dụng. Ngay cả $pod_cainites$, những kẻ mà chính sự tồn tại của họ đã thách thức mọi lời giải thích, cũng thường xem Obtenebration là một sự xúc phạm đến quy luật tự nhiên."
 
 game_concept_elder_perk: "Elder Perk"
 game_concept_elder_perks: "Elder Perks"
 game_concept_elder_perk_desc: "Elder Perks là các [perks|E] mà chỉ $POD_splat_vampire_plural$ có [Glossary('Generation','game_concept_vampgeneration_desc')] đủ thấp để đánh thức tiềm năng thực sự trong dòng máu của mình mới có thể tiếp cận được."
 
 game_concept_daimonion: "Daimonion"
 game_concept_daimonion_desc: "Bị xé ra từ những lời thì thầm của những kẻ bị trói buộc với đất, một giọng nói bị xé rách từ cổ họng của những pháp sư đầu tiên đã kêu gọi Vực Thẳm vang lên qua dòng máu Baali. Daimonion là một tiếng kêu vang khắp Sáng Thế, trải dài từ thế giới này đến một nơi bị ruồng bỏ, và sức mạnh theo tiếng vọng ấy mà quay trở về. Rồi một ngày nào đó, dòng dõi Baali sẽ gào thét, và tiếng thét ấy sẽ làm rung chuyển cả thế giới. Còn bây giờ, họ dùng Daimonion để nhẹ nhàng ru người khác vào giấc ngủ và khiến họ mơ về lửa và bóng tối."

 game_concept_Sire: "Sire"
 game_concept_Sires: "Sires"
 game_concept_Sire_desc: "Một ma cà rồng thành công [Glossary('Trao truyền','game_concept_Embrace_desc')] một người phàm thì được gọi là 'Sire' của người đó. Mối quan hệ này gần giống quan hệ cha/con trong thế giới người phàm. Cũng giống như vậy, nó có thể mang nhiều hình thái, từ quan hệ hợp tác cho đến hận thù công khai giữa hai bên.\nTrong mod, điều này thay thế cho quan hệ 'cha mẹ/con cái' đối với $POD_splat_vampire_plural$, vì họ không thể sinh con tự nhiên."
 
 game_concept_Embrace: "Trao truyền"
 game_concept_Embrace_desc: "Một ma cà rồng rút hết máu của một người phàm rồi cho họ nhấp một ngụm máu của chính mình sẽ biến họ thành ma cà rồng. Quá trình này được gọi là Trao truyền và sẽ tạo ra mối liên kết mạnh mẽ giữa [Glossary('Sire','game_concept_Sire_desc')] mới và childe mới của họ.\nTrong mod, bạn có thể nhấp chuột phải vào bất kỳ người phàm nào tại nơi ở của bạn để bắt đầu một âm mưu Trao truyền. Khi hoàn tất, bạn sẽ biến người phàm này thành childe ma cà rồng của chính mình, tạo ra quan hệ cha mẹ/con cái theo nghĩa lối chơi."
 game_concept_Embraced: "Đã được Trao truyền"
 
 game_concept_Clan: "Clan"
 game_concept_Clan_desc: "Clan là thuật ngữ dùng để mô tả các nhóm lớn của $POD_splat_vampire_plural$ có chung đặc điểm được truyền lại qua dòng máu. Clan của một ma cà rồng chính là dòng dõi của họ, 'gia đình' ma cà rồng mà họ được Trao truyền vào. Xã hội ma cà rồng ngày nay nhìn chung công nhận 13 clan, dù một số có thể đã thất truyền theo lịch sử, một số có thể tồn tại trong bí mật, và một số có thể chưa từng được biết đến.\nGiống như mọi dòng máu khác, mỗi Clan có sự am hiểu vượt trội với một bộ ba [Glossary('Dị Năng','game_concept_discipline_desc')], một $glossary_clan_curse$ gần như chỉ riêng có ở các thành viên của nó, và nhiều định kiến khác nhau gán cho nó do xu hướng $pod_Embrace$ những cá nhân có đặc điểm nhất định."
 game_concept_Clans: "Clan"
 
 game_concept_ashirra: "Ashirra"
 game_concept_ashirra_desc: "Ashirra (từ ashira, tiếng Ả Rập nghĩa là 'clan') là giáo phái mà $POD_splat_vampire_plural$ theo đạo Hồi dùng để tuyên xưng đức tin của mình vào Allah, có sự hiện diện mạnh mẽ tại các vùng đất Hồi giáo của người phàm. Thành viên của Ashirra tin rằng sự cứu rỗi cho ma cà rồng nằm trong số những lời hứa mà Muhammad đưa ra nếu họ chọn theo Allah. Trong khi một số ma cà rồng là tín đồ thực sự của đạo Hồi, phần lớn những kẻ tham gia Ashirra theo đạo Hồi vì điều đó thuận tiện cho họ hoặc giúp họ dễ dàng hoạt động hơn ở Trung Đông.\nTrong một số trường hợp, Ashirra có thể được dùng để chỉ bất kỳ ma cà rồng nào theo đạo Hồi."
 
 game_concept_antediluvian: "Antediluvian"
 game_concept_antediluvian_desc: "Có nghĩa là 'trước cơn đại hồng thủy', thuật ngữ Antediluvian có thể áp dụng cho bất kỳ $pod_cainite$ nào có trước Đại Hồng Thủy, chẳng hạn như Caine hay Thế Hệ Thứ Hai, nhưng nó hầu như luôn được dùng để chỉ riêng Thế Hệ Thứ Ba, những kẻ mà mười ba [Glossary('Clan','game_concept_Clan_desc')] bắt nguồn từ đó. Họ là những sinh vật có sức mạnh không thể đo đếm được.\nCó lẽ các Antediluvian có tuổi đời và sức mạnh dòng máu lớn đến mức họ sở hữu sức mạnh gần như thần thánh, và trên thực tế một số trong số họ có thể là các vị thần. Rất ít ghi chép về việc sức mạnh như vậy được sử dụng còn tồn tại, nhưng truyền thuyết thường mô tả họ là bất khả chiến bại. Một số thậm chí còn cho rằng cách duy nhất để giết những sinh vật như vậy là nếu chính họ muốn điều đó hoặc nếu điều đó xảy ra dưới tay một Antediluvian khác."
 game_concept_antediluvians: "Antediluvian"
 
 game_concept_einherjar: "Einherjar"
 game_concept_einherjar_desc: "Einherjar là thuật ngữ đại diện cho $POD_splat_vampire_plural$ Bắc Âu dưới thời trị vì của ma cà rồng Odin, Đấng Chí Cao (hầu hết Einherjar tin rằng ông là một dạng đại tư tế, không phải chính Odin mà là một người con hoặc đệ tử nhiệt thành của Odin), người đã giữ vững các lối sống cũ đang bị thay thế bởi Cơ Đốc giáo và chế độ phong kiến.\nKết hợp điều này với chủ nghĩa định mệnh của chiến binh Viking trung bình, kết quả là một tâm lý cố thủ. Einherjar tự xem mình là những chiến binh cuối cùng của Odin trên Midgard, chuẩn bị chiến đấu trong trận Ragnarok sắp tới. Tất cả những gì họ có thể làm là chuẩn bị cho trận chiến sắp tới và chết một cái chết anh hùng.\nMa cà rồng phương bắc không đơn thuần là người Viking có clan. Những đặc thù trong di sản Bắc Âu của họ mang lại cho Einherjar một cách nhìn về thế giới rất khác so với nhiều người anh em phương nam của họ. Sự khác biệt về tôn giáo, xã hội và lối sống không chỉ thể hiện ở đám đông người phàm, thói quen và đặc điểm của họ còn kéo dài mãi vào cõi vĩnh hằng."
 
 game_concept_ghoul: "Ghoul"
 game_concept_ghoul_desc: "Sau khi một $POD_splat_vampire$ cho một sinh vật khác uống $pod_vitae$ của mình, sinh vật đó trở thành một $POD_splat_ghoul$, được hưởng một vài lợi ích: Quá trình lão hóa dừng lại, đôi khi thậm chí còn đảo ngược nhẹ; được tiếp cận hạn chế với [Glossary('Dị Năng','game_concept_discipline_desc')] và hồi phục nhanh hơn. Tuy nhiên, Ghoul lệ thuộc vào Dòng Máu, vì họ sẽ trở lại tuổi thật của mình khi bị từ chối tiếp cận, đôi khi gây tử vong.\n\nKhi chơi một $POD_splat_vampire$ trong [princes_of_darkness|E], bạn có thể biến $POD_splat_mortal_plural$ [unlanded|E] thành $POD_splat_ghoul_plural$ thông qua một [scheme|E]. [prisoners|EU] có thể được biến đổi ngay lập tức. Bạn chỉ có thể có một số lượng Ghoul giới hạn tại một thời điểm, và bạn có thể tăng giới hạn đó bằng các công trình trong [Concept('domicile','Hideout')|E] của mình.\n\nMột số [splats|E] giống người phàm như $POD_splat_hunter_plural$ có thể trở thành $POD_splat_ghoul_plural$ trong quá trình chơi, hoặc thông qua một [character_interaction|E] lên $POD_splat_vampire_plural$ để yêu cầu trở thành [bound_ghoul|E] của họ, hoặc bằng cách uống máu của một Ma Cà Rồng bị [imprisoned|E] để trở thành một [masterless_ghoul|E]."
 game_concept_ghouls: "Ghoul"

 game_concept_vitae: "Vitae"
 game_concept_vitae_desc: "#bold Vitae#! là dòng máu chảy trong huyết quản của một Ma Cà Rồng. Những đặc tính dường như mang tính phép thuật của nó cho phép Ma Cà Rồng sử dụng [Glossary('Dị Năng','game_concept_discipline_desc')] và chữa lành mọi vết thương, dù nghiêm trọng đến đâu.\n\nKhi được uống trực tiếp từ huyết quản của một Ma Cà Rồng khác, Vitae gây nghiện khủng khiếp, tạo ra một [Glossary('Blood Bond','game_concept_bloodbond_desc')]. Người phàm uống Vitae sẽ trở thành [ghouls|E]."

 game_concept_POD_herd: "Đàn"
 game_concept_POD_herd_desc: "#X Bạn có thể tăng quy mô Đàn tối đa của mình vượt mức cơ bản là 3 bằng các công trình trong [Concept('domicile','Hideout')|E] của mình. #!.\n Một đàn là một nhóm người phàm mà các thành viên của nó cho phép một ma cà rồng nhất định hút máu từ họ, cung cấp nguồn thức ăn dễ dàng và giải phóng các đêm của ma cà rồng đó cho những việc cấp bách hơn."
 
 game_concept_revenant: "Revenant"
 game_concept_revenant_desc: "Một $POD_splat_revenant$ là một loại sinh vật lai vừa giống vừa khác với $POD_splat_mortal_plural$, [ghouls|E], và $POD_splat_vampire_plural$. Có người sẽ nói một revenant nằm giữa người phàm và ma cà rồng; người khác lại gọi đó là sự tha hóa của những sinh vật của Chúa bởi lời nguyền của Caine, hòa trộn hai thứ cho đến khi chúng không thể tách rời. Dù sao đi nữa, một revenant mang nhiều đặc tính của cả ma cà rồng lẫn người phàm, và có nhiều đặc điểm của ghoul bình thường. Revenant có thể uống máu của một ma cà rồng, nhưng không như ghoul họ không cần phải làm vậy, vì họ có thể tự sản sinh $pod_vitae$ của riêng mình, thứ cũng làm chậm quá trình lão hóa của họ.\nKhác với chủ nhân của mình, và bất chấp cái tên của họ, revenant là những sinh vật sống. Giống như người phàm, họ cần ăn, ngủ và thở. Họ có khả năng sinh sản hữu tính. Khác với người phàm, họ khỏe hơn và có khả năng tiếp cận các sức mạnh siêu nhiên từ Dấu Ấn Caine."
 game_concept_revenants: "revenant"
 
 game_concept_serpentis: "Serpentis"
 game_concept_serpentis_desc: "Serpentis được tin là di sản của chính Set, một món quà dành cho con cái của ông. Tín Đồ Của Set rất cẩn trọng canh giữ bí mật của $pod_discipline$ này, chỉ truyền dạy nghệ thuật này cho những ai họ cho là xứng đáng. Hầu hết ma cà rồng sợ hãi các Setite vì sức mạnh của Serpentis và mối liên hệ của nó với rắn và loài bò sát."
 
 game_concept_domitor: "Domitor"
 game_concept_domitor_desc: "Một domitor là một ma cà rồng cho một sinh vật khác uống $pod_vitae$ của chính mình và nắm giữ một [Glossary('Blood Bond','game_concept_bloodbond_desc')] đối với họ, những kẻ đến lượt mình trở thành Thrall hoặc [ghouls|E] của họ."
 
 game_concept_shintai_lifestyle: "Shintai"
 game_concept_shintai_lifestyle_desc: "Shintai được phát triển vào [Glossary('Kỷ Nguyên Thứ Năm','game_concept_fifth_age_desc')] (sau năm 1250), phù hợp cho $POD_splat_kueijin_plural$. Hầu hết ma cà rồng xem việc thành thạo một shintai là thể hiện sự am hiểu tương ứng về các nguyên lý Chi, và do đó là một Bước tiến quan trọng hướng tới việc làm chủ bản thân."
 
 game_concept_chi_arts_lifestyle: "Nghệ Thuật Chi"
 game_concept_chi_arts_lifestyle_desc: "Nghệ Thuật Chi phù hợp cho $POD_splat_kueijin_plural$. Những [Glossary('Dị Năng','game_concept_discipline_desc')] này cho phép một [GetTrait('kueijin').GetName( GetNullCharacter )] tạo ra các hiệu ứng huyền bí thông qua việc dẫn hướng Chi của bản thân (hoặc, trong một số trường hợp, Chi của người khác hay Chi xung quanh trong môi trường)."
 
 game_concept_soul_arts_lifestyle: "Nghệ Thuật Linh Hồn"
 game_concept_soul_arts_lifestyle_desc: "Nghệ Thuật Linh Hồn phù hợp cho $POD_splat_kueijin_plural$. Những ai làm chủ [Glossary('Dị Năng','game_concept_discipline_desc')] Linh Hồn là những sinh vật thực sự đáng gờm, có khả năng thực hiện những kỳ công ý chí cực kỳ khó khăn hoặc thống trị hoàn toàn linh hồn của các sinh vật khác."
 
 game_concept_demon_arts_lifestyle: "Nghệ Thuật Ma Quỷ"
 game_concept_demon_arts_lifestyle_desc: "Nghệ Thuật Ma Quỷ phù hợp cho $POD_splat_kueijin_plural$. Những [Glossary('Dị Năng','game_concept_discipline_desc')] này bắt nguồn từ và được cấp năng lượng bởi P'o."
 
 game_concept_qiao_lifestyle: "Qiao"
 game_concept_qiao_lifestyle_desc: "Qiao phù hợp cho [GetTrait('shih').GetName( GetNullCharacter )]. Qiao, hay Cầu Nối: những nghệ thuật cổ xưa mà qua đó thợ săn ma quỷ tập trung Chi của họ để thực hiện những kỳ công siêu phàm."
 
 game_concept_hekau_alchemy_lifestyle: "Hekau Luyện Kim"
 game_concept_hekau_alchemy_lifestyle_desc: "Hekau Luyện Kim phù hợp cho $POD_splat_mummy_plural$. Luyện kim đòi hỏi sự chuẩn bị và tận tụy. Một nhà luyện kim không thể chỉ đơn giản rút một phép thuật ra từ tay áo của mình, mà phải tạo ra một sản phẩm thể hiện hiệu ứng mà họ tìm kiếm hoặc một thứ tạo ra kết quả mong muốn."
 
 game_concept_hekau_amulets_lifestyle: "Hekau Bùa Hộ Mệnh"
 game_concept_hekau_amulets_lifestyle_desc: "Hekau Bùa Hộ Mệnh phù hợp cho $POD_splat_mummy_plural$. Bùa hộ mệnh, còn được gọi là Meket trong tiếng Ai Cập, là những vật bùa chú tập trung sức mạnh phép thuật, thường nhất là để bảo vệ chống lại cái ác, bệnh tật hoặc tà thuật."
 
 game_concept_hekau_celestial_lifestyle: "Hekau Thiên Thể"
 game_concept_hekau_celestial_lifestyle_desc: "Hekau Thiên Thể phù hợp cho $POD_splat_mummy_plural$. Hekau Thiên Thể là những nghệ thuật phép thuật của Ai Cập cổ đại tập trung vào số phận, thời tiết và chiêm tinh học."
 
 game_concept_hekau_effigy_lifestyle: "Hekau Hình Nộm"
 game_concept_hekau_effigy_lifestyle_desc: "Hekau Hình Nộm phù hợp cho $POD_splat_mummy_plural$. Hình Nộm là nghệ thuật Hekau về các mối liên kết biểu tượng, thường được thể hiện dưới dạng những tượng nhỏ gọi là Ushabti."
 
 game_concept_hekau_necromancy_lifestyle: "Hekau Chiêu Hồn"
 game_concept_hekau_necromancy_lifestyle_desc: "Hekau Chiêu Hồn phù hợp cho $POD_splat_mummy_plural$. Thuật Chiêu Hồn là nghệ thuật Hekau định hình [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] và điều khiển các linh hồn cư ngụ tại đó."
 
 game_concept_hekau_nomenclature_lifestyle: "Hekau Danh Xưng"
 game_concept_hekau_nomenclature_lifestyle_desc: "Hekau Danh Xưng phù hợp cho $POD_splat_mummy_plural$. Danh Xưng là nghệ thuật Hekau sử dụng [Glossary('Chân Danh','podgloss.truename')], được gọi là ren ở Ai Cập, cho các mục đích huyền bí."
 
 game_concept_tan_lifestyle: "Tan"
 game_concept_tan_lifestyle_desc: "Tan phù hợp cho [GetTrait('wutian').GetName( GetNullCharacter )]. Những sức mạnh đến từ Luyện Kim Phượng Hoàng và Rồng."
 
 game_concept_neteru: "Neteru"
 game_concept_neteru_desc: "#bold Neteru#! là những tín đồ đã tụ họp quanh một Reborn để thờ phụng nó. Các thành viên gia tộc của bạn từ những kiếp sống gần đây sẽ trở thành Neteru miễn phí, ngoài ra bạn cần dùng [character_interaction|E] để có được họ. Neteru có thể nắm giữ tước vị của bạn ngay cả khi là người phàm, và họ có thể sở hữu các công trình mummy hoặc xây dựng chúng khi bạn là lãnh chúa của họ."
 
 game_concept_thrall: "Thrall"
 game_concept_thralls: "Thrall"
 game_concept_thrall_desc: "#bold Thrall#! là những kẻ hầu hạ của $POD_splat_demon_plural$. Ma quỷ chọn thrall trong số những kẻ đầy tham vọng, thù hận, tàn tật, và mất mát; những người đàn ông và phụ nữ cảm thấy bị thế giới lừa dối, bị tước đoạt cuộc sống mà họ xứng đáng có được.\n\nBạn có thể biến các nhân vật thành thrall nếu họ theo tôn giáo của bạn. Để cải đạo họ, bạn có thể sử dụng [journey|E] Cám Dỗ Phạm Tội lên các nhân vật mang [trait|E] liên kết với tội lỗi của bạn.\n\nThrall có các tương tác đặc biệt bạn có thể sử dụng tốn điểm kỹ năng Arcana. Bạn cũng có thể yêu cầu chư hầu của họ gia nhập giáo phái của bạn."

 game_concept_cultist: "Tín Đồ"
 game_concept_cultists: "Tín Đồ"
 game_concept_cultist_desc: "#bold Tín Đồ#! là những kẻ tôn thờ một $POD_splat_demon$. Thông qua sự tôn thờ của mình, họ cung cấp cho ma quỷ [experience|E] [arcana_lifestyle|E] thụ động mỗi năm.\n\nChư hầu, cận thần, và chư hầu của [thralls|E] của bạn đều đủ điều kiện trở thành tín đồ thông qua $POD_set_cultist_interaction$ [character_interaction|E]. $POD_splat_demon_plural$ cũng có thể thuê một #V Cult Leader#! [court_position|E] tự động cải đạo các nhân vật đủ điều kiện thành Tín Đồ theo thời gian."

 game_concept_abombwe: "Abombwe"
 game_concept_abombwe_desc: "Abombwe là một Discipline được thực hành bởi Di Sản Akunanse của Laibon và dòng máu Bonsam bí ẩn của Kỷ Nguyên Đen Tối. Abombwe tận dụng mối liên kết chặt chẽ của ma cà rồng với và sự kiểm soát đối với Dã Thú của chính họ (và của người khác), cũng như dẫn kênh sức mạnh của Dã Thú cho nhiều mục đích khác nhau."
 
 game_concept_dark_kingdom: "Vương Quốc Bóng Tối"
 game_concept_dark_kingdoms: "Vương Quốc Bóng Tối"
 game_concept_dark_kingdom_desc: "Vương Quốc Bóng Tối là những túi thực tại ổn định bên trong [UmbraGlossary('tempest')] của [UmbraGlossaryLocalized('shadowlands','Âm Phủ')]. Mỗi vương quốc trong số này tuyên bố quyền thống trị đối với các Wraith của một vùng địa lý cụ thể."
 
 game_concept_shard_realm: "Cõi Mảnh Vỡ"
 game_concept_shard_realm_desc: "Trong vũ trụ quan phép thuật Truyền Thống, các hành tinh trong hệ mặt trời của chúng ta được liên kết với các vị thần, năng lượng, hiện tượng trần thế, và các Lĩnh Vực phép thuật. Tất nhiên, khoa học tìm cách gạt bỏ những liên kết đó và thay thế chúng bằng các phép đo của không gian lạnh lẽo, chết chóc. Tuy nhiên, ngay cả khi đó, cảnh tượng hùng vĩ của sức mạnh hành tinh vẫn không thể bị tước bỏ hoàn toàn sự kỳ diệu.\nMột Cõi Mảnh Vỡ được kết nối với một trong các hành tinh trong Hệ Mặt Trời và hình thành Umbra riêng biệt của chính nó. Mỗi Cõi Mảnh Vỡ được kết nối với một Lĩnh Vực cụ thể chiếm ưu thế trong ranh giới của nó. Mọi Cõi Mảnh Vỡ cũng được kết nối với một [Glossary('Cõi Bóng Ảnh','game_concept_shade_realm_desc')], được đồn đại là dẫn vào một vũ trụ song song bị chi phối bởi một trong các Lĩnh Vực. Mỗi Cõi Mảnh Vỡ được cư trú và cai trị bởi một Celestine hùng mạnh."
 
 game_concept_shade_realm: "Cõi Bóng Ảnh"
 game_concept_shade_realm_desc: "Một Cõi Bóng Ảnh, còn được gọi là Vada, là một cõi Umbra bị chi phối bởi một Lĩnh Vực phép thuật duy nhất. Mỗi Cõi Bóng Ảnh được liên kết với [Glossary('Cõi Mảnh Vỡ','game_concept_shard_realm_desc')] của một trong các hành tinh trong hệ mặt trời, nhưng biểu hiện bên trong Chân Trời của Trái Đất — giống như một cái bóng đổ xuống mặt đất bởi một đám mây trôi qua."
 
 game_concept_oneiric_realm: "Cõi Mộng Ảo"
 game_concept_oneiric_realms: "Cõi Mộng Ảo"
 game_concept_oneiric_realm_desc: "Trong dòng lũ tiếng vọng chính là [UmbraGlossary('deep_dreaming')], mười một cõi pha lê của các Oneiroi xoay vòng và ngân vang, khuấy động chất liệu của Giấc Mơ trong dòng chảy của chúng. Một trong những cõi này từng được gọi là [UmbraGlossary('arcadia')]; giờ đây, nó bị niêm phong từ bên trong, và bất kỳ ai rời khỏi đó đều không thể quay lại. Còn về các Cõi Mộng Ảo khác, những cõi của Moros và Hemera, Aether và Ker, Hypnates và [UmbraGlossaryLocalized('kingdom_of_dan','Dán')], Charis và Momus, Diké và Protea, người ta biết rất ít. Rất ít ai từng bước vào chúng, và không ai rời đi theo cùng cách họ đã đến.\n\nNgoài những Cõi Mộng Ảo được gọi là "thứ yếu" này (và liệu chúng có thực sự kém huy hoàng hơn Arcadia hay không, không ai có thể nói), chỉ còn lại Đêm Tối và Tĩnh Lặng, đưa tổng số lên 13. Các lữ khách báo cáo một hiện tượng kỳ lạ: Vượt qua Tĩnh Lặng, tại cõi sâu thẳm nhất có thể của [UmbraGlossary('dreaming')], thế giới tự mở ra và bóng tối được chuyển hóa thành điều kỳ diệu."
 
 game_concept_hearts_realm: "Cõi Trái Tim"
 game_concept_hearts_realms: "Cõi Trái Tim"
 game_concept_hearts_realm_desc: "Sâu trong [UmbraGlossary('dreaming')], nằm giữa [UmbraGlossary('far_dreaming')] và những Xứ Sở Xa Xăm Nhất phía sau, có những lãnh địa kể những câu chuyện được tạo hình theo hình ảnh trái tim con người. Mạnh mẽ hơn và gần gũi hơn những cõi phổ quát hơn của [UmbraGlossary('dreaming')], những "Cõi Trái Tim" này đã thu thập nhiều mảnh vỡ lang thang của Giấc Mơ Arcadia về phía mình và giờ đây thường bị nhầm lẫn với chính Arcadia bởi những lữ khách đầy hy vọng. Đáng buồn thay, đó là một kết luận quá lạc quan để có thể là sự thật."
 
 game_concept_home_realm: "Cõi Quê Nhà"
 game_concept_home_realms: "Cõi Quê Nhà"
 game_concept_home_realm_desc: "Cõi tổng thể, khi đó nhỏ hơn phần nào so với bây giờ, là sự hòa trộn ý tưởng của mỗi người về một thế giới hoàn hảo. Những vùng đất giáp ranh các khu vực giống như nỗ lực ghép hình vụng về đầu tiên của một gã khổng lồ. Các dạng địa hình xen kẽ khớp vào nhau và nhô ra thành những khối và mảng lởm chởm. Các loài vật và công trình kỳ dị đều mờ nhạt và run rẩy, chất liệu Giấc Mơ thô sơ nổ lách tách như điện trong không khí. Ngay cả khi họ đang quan sát, một số sinh vật kỳ dị đã tan biến vào hư vô. Một quyết định phải được đưa ra: họ nên ở lại và tiếp tục tạo dựng cõi này thêm nữa, xem liệu họ có thể đến được [UmbraGlossary('arcadia')] từ nơi họ đang đứng hay không, hay quay về thế giới trần tục và có thể thử lại? Tất cả đều đồng ý rằng họ đã ở quá xa Arcadia để có thể thử tiếp cận nó. Một số cho rằng cõi mới là một sự lãng phí thời gian, trong khi hầu hết những người còn lại ở lại đó và cố gắng làm cho nó ổn định hơn. Một vài người lang thang vào [UmbraGlossary('dreaming')] và không bao giờ được nghe tin tức gì nữa."
 
 game_concept_nightmare_realm: "Cõi Ác Mộng"
 game_concept_nightmare_realms: "Cõi Ác Mộng"
 game_concept_nightmare_realm_desc: "Một Cõi Ác Mộng là nơi những cơn ác mộng cư ngụ trong [UmbraGlossary('dreaming')]. Những nơi này, bị thúc đẩy bởi Firchlis, có thể tràn ngập [Glossary('Cõi Giấc Mơ','game_concept_dream_realm_desc')]. Tại đây, các mối đe dọa nghiêm trọng hơn nhiều so với ở nhiều nơi khác của [UmbraGlossary('dreaming')]."
 
 game_concept_dream_realm: "Cõi Giấc Mơ"
 game_concept_dream_realms: "Cõi Giấc Mơ"
 game_concept_dream_realm_desc: "Một Cõi Giấc Mơ là một phần của [UmbraGlossary('dreaming')] tương đối lành tính, nơi các mối nguy hiểm được cân bằng bởi những điều kỳ diệu có thể tìm thấy. Trái ngược với một [Glossary('Cõi Ác Mộng','game_concept_nightmare_realm_desc')]."
 
 game_concept_stable_point: "Điểm Ổn Định"
 game_concept_stable_points: "Điểm Ổn Định"
 game_concept_stable_point_desc: "Điểm Ổn Định là những nơi trong [UmbraGlossary('dreaming')] phần lớn không bị ảnh hưởng bởi Firchlis."
 
 game_concept_yang_world: "Dương Giới"
 game_concept_yang_world_desc: "Dương Giới dường như bao trùm [UmbraGlossary('spirit_wilds')], [UmbraGlossary('dreaming')] và [UmbraGlossary('astral_reaches')]. Đó là một cõi khí (chi) dương tính (dù không hẳn lành tính) và trôi nổi "phía trên" mặt phẳng vật chất. Chứa đựng một số lượng gần như vô hạn các cõi và cư dân linh hồn, Dương Giới tràn đầy năng lượng."


 game_concept_breedgifts_lifestyle: "Gift Dòng Giống"
 game_concept_breedgifts_lifestyle_desc: "$glossary_fera$ có hai dòng giống, [GetTrait('homid_born').GetName(GetNullCharacter)] và [GetTrait('beast_born').GetName(GetNullCharacter)]. Mỗi loại có bộ Gift riêng phản ánh sự nuôi dạy của họ."

 game_concept_lunar_auspicegifts_lifestyle: "Gift Auspice Mặt Trăng"
 game_concept_lunar_auspicegifts_lifestyle_desc: "Các Auspice #TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L Garou#! theo chu kỳ mặt trăng. Pha của mặt trăng trong lần Biến Đổi Đầu Tiên của họ quyết định Auspice của họ và những Gift nào có sẵn cho họ."

 game_concept_solar_auspicegifts_lifestyle: "Gift Auspice Mặt Trời"
 game_concept_solar_auspicegifts_lifestyle_desc: "Các Auspice [GetTrait('mokole').GetName(GetNullCharacter)] theo Mặt Trời. Trong khi cả hai Dòng Mokolé-mbembe và Gumagan đều theo bảy Auspice Mặt Trời, Makara và Zhong Lung lại theo các Auspice Theo Mùa riêng của họ. Tuy nhiên, những Auspice Theo Mùa này vẫn gắn liền về bản chất với mặt trời và do đó chúng chia sẻ Gift với các anh em họ của mình."

 game_concept_commongifts_lifestyle: "Gift Chung"
 game_concept_commongifts_lifestyle_desc: "Mỗi $glossary_fera$ có một bộ Gift tự nhiên có sẵn cho họ."

 game_concept_tribalgifts_lifestyle: "Gift Bộ Lạc"
 game_concept_tribalgifts_lifestyle_desc: "Gift Bộ Lạc là những gift được dạy bởi linh hồn bảo hộ của một bộ lạc [GetTrait('werewolf').GetName(GetNullCharacter)] hoặc [GetTrait('bastet').GetName(GetNullCharacter)]."

 game_concept_streamgifts_lifestyle: "Gift Dòng Chảy"
 game_concept_streamgifts_lifestyle_desc: "Bốn Dòng Chảy của Mokolé đã tách biệt từ lâu. Mỗi dòng đã phát triển bản sắc riêng và có được quyền tiếp cận các Gift bổ trợ cho cuộc sống và mục đích của họ."
 
 game_concept_mnesis_lifestyle: "Mnesis"
 game_concept_mnesis_lifestyle_desc: "Những sức mạnh của [GetTrait('mokole').GetName(GetNullCharacter)] cổ đại đã bị lãng quên theo năm tháng. Với sức mạnh của Mnesis, một Mokolé có thể bơi ngược dòng sông thời gian qua ký ức của tổ tiên mình để tìm kiếm những sức mạnh đã bị lãng quên này."

 game_concept_hengeyokaigifts_lifestyle: "Gift Hengeyokai"
 game_concept_hengeyokaigifts_lifestyle_desc: "Gift Hengeyokai là những gift được dạy trong các Triều Đình Dã Thú của châu Á. Chúng thúc đẩy sự hợp tác và thấu hiểu giữa các $glossary_fera$ khác nhau."

 game_concept_urgetaints_lifestyle: "Vết Nhơ Urge"
 game_concept_urgetaints_lifestyle_desc: "Những tôi tớ hàng đầu của $glossary_wyrm$, các Urge Wyrm, ban tặng những gift đen tối này cho thuộc hạ của chúng, hy vọng giành chiến thắng trong trận chiến vĩnh cửu chống lại lẫn nhau."

 
 game_concept_Fetter: "Fetter"
 game_concept_Fetters: "Fetter"
 game_concept_Fetter_desc: "Một Fetter là một người, nơi chốn, hoặc vật thể ràng buộc một wraith với [UmbraGlossary('shadowlands')] và giữ họ không rời đi. Cùng với việc cho phép một wraith bám víu vào sự tồn tại của mình và giữ họ không rơi vào [UmbraGlossary('oblivion')], Fetter cũng là những nơi mà một wraith có thể Ngủ Đông và lấy lại [Corpus|E].\nNếu một Fetter bị phá hủy, wraith mất đi một mối ràng buộc quan trọng với [UmbraGlossary('shadowlands')], và do đó sự tồn tại của họ trở nên bấp bênh hơn. Những wraith không có Fetter nào không tồn tại được lâu trong [UmbraGlossary('shadowlands')], vì họ không có nơi để hồi phục và không có gì ràng buộc họ với cuộc sống-sau-cái-chết của mình."
 
 game_concept_Corpus: "Corpus"
 game_concept_Corpus_desc: "Cơ thể của một wraith trong [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] được gọi là Corpus. Thay vì có các hệ thống sinh học phức tạp, nó được tạo thành từ một chất liệu gọi là plasm, phần lớn là chất liệu thô sơ của thế giới bên kia."

 game_concept_oblivion_pull: "Lực Kéo Oblivion"
 game_concept_oblivion_pull_desc: "#bold Lực Kéo Oblivion#! là thước đo mức độ mạnh mẽ mà [UmbraGlossary('oblivion')] kéo một $POD_splat_wraith$, và sự tồn tại của họ bấp bênh đến mức nào.\n\nMỗi tháng $POD_splat_wraith$ #italic người chơi#! sẽ nhận [stress|E] từ #N +10#! đến #P -10#! dựa trên Lực Kéo [UmbraGlossary('oblivion')] của họ.\n\nCác yếu tố ảnh hưởng đến [oblivion_pull|E]:\n$TAB$$POD_splat_wraith$: #N +10#!\n$TAB$Mỗi điểm [Fetter|E] đã phân bổ: #P -1#!\n$TAB$Mỗi điểm [Fetter|E] đã Giải Quyết: #P -2#!\n\nLượng [oblivion_pull|E] được hiển thị tại $POD_splat_wraith$"

 game_concept_POD_animals_maa: "Động vật"
 game_concept_POD_animals_maa_desc: "Động vật là [men_at_arms|E] có thể được chiêu mộ bằng nhiều cách khác nhau như Animalism.\n\nChúng bị Khắc chế bởi [archers|E]."

 game_concept_POD_construct_maa: "Vật thể Tạo tác"
 game_concept_POD_construct_maa_desc: "Vật thể Tạo tác là [men_at_arms|E] đại diện cho một loạt sinh vật ma thuật hoặc kỹ nghệ, có thể rất đa dạng về hình dạng, hình thái và sức mạnh tùy theo cách thức và lý do chúng được tạo ra."

 game_concept_POD_bygones_maa: "Di tích Cổ"
 game_concept_POD_bygones_maa_desc: "Di tích Cổ là một sinh vật của thần thoại và truyền thuyết, không còn có thể tồn tại công khai trên Trái Đất trong thời gian dài vì không tương thích với Consensus. Tuy hùng mạnh, sự bất ổn này khiến việc dùng chúng trong chiến trận trở thành một lựa chọn khó khăn."

 game_concept_POD_legendary_maa: "Truyền thuyết"
 game_concept_POD_legendary_maa_desc: "[men_at_arms|E] Truyền thuyết vượt ngoài mọi định nghĩa, mỗi đơn vị là một thứ độc nhất vô nhị.\n\nBản chất độc nhất của chúng có nghĩa là không gì có thể khắc chế chúng một cách đáng tin cậy, và chỉ số của chúng thường đủ mạnh để việc khắc chế các [men_at_arms|E] khác trở nên không cần thiết.\n\nDo bản chất độc nhất của chúng, không có địa hình đơn lẻ nào khiến chúng mạnh hơn hay yếu hơn một cách phổ quát."

 game_concept_POD_illusionary_maa: "Ảo ảnh"
 game_concept_POD_illusionary_maa_desc: "[men_at_arms|E] Ảo ảnh đại diện cho những ảo giác và ảo tưởng đánh lừa kẻ địch tấn công chúng, khiến chúng lãng phí thời gian và bị phân tâm."

 game_concept_POD_demonic_maa: "Ác quỷ"
 game_concept_POD_demonic_maa_desc: "[men_at_arms|E] Ác quỷ đại diện cho các thế lực địa ngục.\n\nDo đó chúng quá đa dạng để có thể bị khắc chế một cách phổ quát bởi bất cứ thứ gì, nhưng bản thân chúng lại bị khắc chế bởi những kẻ chuyên chiến đấu với thế lực địa ngục.\n\nTương tự, không thể khẳng định rằng có một loại địa hình nào có lợi một cách phổ quát cho các đơn vị này."

 game_concept_POD_spirit_maa: "Linh hồn"
 game_concept_POD_spirit_maa_desc: "[men_at_arms|E] Linh hồn là những thực thể phi vật chất có nguồn gốc, và thường cư ngụ, trong Umbra - vì lý do đó, một số pháp sư gọi chúng là \"Umbrood\".\n\nBản chất phi vật chất của chúng có nghĩa là không thể khắc chế chúng nếu không có phương tiện đặc biệt.\n\nTrạng thái phi vật chất của chúng cũng có nghĩa là linh hồn thường không bị ảnh hưởng xấu bởi địa hình, chúng cảm thấy như ở nhà tại một vùng hoang mạc băng giá cũng như tại một sa mạc nóng bỏng."

 game_concept_POD_fera_maa: "Fera"
 game_concept_POD_fera_maa_desc: "Trong khi Garou được Gaia tạo ra làm nanh vuốt của bà, để giữ bà an toàn, họ không phải là con cái duy nhất của bà. Bà đã tạo ra nhiều giống loài $glossary_fera$ hay Người Biến Hình khác và giao cho mỗi giống một nhiệm vụ. Một số đã lạc lối theo thời gian; số khác bị Garou ép buộc rời khỏi vai trò của mình. Một số đã quay sang phụng sự chỉ một khía cạnh của $glossary_triat$, thay vì Gaia như một tổng thể.\n\nFera đa dạng như chính những thứ mà họ biến thành, nên cách khắc chế chắc chắn duy nhất là hiểu biết về điểm yếu siêu nhiên của loại mà bạn đang đối mặt.\n\nCũng theo cách tương tự về khả năng khắc chế và bị khắc chế, khả năng địa hình của Fera cũng rất đa dạng."

 game_concept_POD_gargoyle_maa: "Gargoyle"
 game_concept_POD_gargoyle_maa_desc: "Gargoyle là một dòng máu ma cà rồng được Tremere tạo ra làm kẻ phục vụ cho họ. Mặc dù về mặt kỹ thuật không phải là một dòng máu Tremere, dòng máu này phần lớn nằm dưới sự kiểm soát của họ.\n\nKhả năng bay của Gargoyle tạo ra những vấn đề riêng cho quân đội thông thường khi khắc chế chúng, vì huấn luyện chiến đấu với kẻ địch biết bay không nằm trong hầu hết các bài tập vũ khí.\n\nViệc Gargoyle có thể bay có nghĩa là chúng có thể tránh được nhiều vấn đề do địa hình gây ra trong khi vẫn có thể tận dụng lợi thế của cùng địa hình đó."

 game_concept_POD_ghoul_maa: "Ghoul"
 game_concept_POD_ghoul_maa_desc: "Ghoul là thuật ngữ dùng để mô tả một thuộc hạ được tạo ra khi một $POD_splat_vampire$ ban cho một người phàm một chút $pod_vitae$ ma cà rồng mà không rút cạn máu của họ trước, việc đó sẽ dẫn đến Nghi lễ Trao truyền thay vào đó.\n\nGhoul không chỉ bao gồm những con người bình thường được ban $pod_vitae$ ma cà rồng mà còn cả những \"Warghoul\" do Tzimisce sử dụng, và do đó việc khắc chế một số Ghoul cũng dễ dàng như khắc chế một con người bình thường, trong khi những kẻ khác, như Szlachta quái dị, thì khó hơn.\n\nĐịa hình ảnh hưởng đến Ghoul theo cách người ta thường mong đợi dựa trên cơ thể của chúng."
 
 game_concept_POD_plasmic_maa: "Plasmic"
 game_concept_POD_plasmic_maa_desc: "Plasmic hay Thực thể Plasmic là một "dạng sống" của [UmbraGlossaryLocalized('shadowlands','Underworld')]; cụ thể, là bất kỳ sinh vật độc lập nào được cấu thành từ Plasm nhưng không hẳn là một hồn ma hay bóng ma."
 
 game_concept_POD_wraith_maa: "Hồn ma"
 game_concept_POD_wraith_maa_desc: "Hồn ma là một bóng ma, linh hồn của một người đã chết mà chưa mãn nguyện và giờ ám ảnh [UmbraGlossary('shadowlands')]."

 game_concept_POD_vampire_maa: "Ma cà rồng"
 game_concept_POD_vampire_maa_desc: "Hậu duệ bị nguyền rủa của Caine tạo nên những chiến binh đáng sợ khi màn đêm buông xuống chiến trường. Chúng vốn dĩ mạnh hơn và nhanh hơn người phàm, và hầu hết bọn chúng cũng sử dụng những năng lực tinh thần và thể chất mạnh mẽ có thể xoay chuyển cục diện của bất kỳ trận chiến nào."
  
 game_concept_POD_faerie_maa: "Faerie"
 game_concept_POD_faerie_maa_desc: "Các thuật ngữ faerie, fae, và Fair Folk thường được những người không phải changeling dùng thay thế cho nhau để chỉ cả changeling lẫn True Fae."
 
 game_concept_POD_chimera_maa: "Chimera Hoạt hình"
 game_concept_POD_chimera_maa_desc: "Chimera Hoạt hình đơn giản là những chimera có sự sống hoặc có vẻ ngoài của sự sống."
  
 game_concept_abomination: "Abomination"
 game_concept_abomination_desc: "Abomination là thuật ngữ dùng để mô tả một người biến hình bị biến thành ma cà rồng. Không cần phải nói rằng những sinh vật này cực kỳ hiếm, vì hầu hết $glossary_fera$ đều bị dị ứng dữ dội với $pod_vitae$ ma cà rồng. Kết quả là bị cả hai xã hội ruồng bỏ, và luôn rất bất ổn về mặt tinh thần.\nTrong game, #TOOLTIP:GAME_TRAIT,abomination,[GetNullCharacter] #L Abominations#!#! được coi là $POD_splat_vampire_plural$ không thể $pod_Embrace$ nhưng vẫn giữ được khả năng sử dụng các phép breed và auspice, cũng như khả năng biến hình."
 
 game_concept_grace: "Ân sủng"
 game_concept_grace_i: "@grace_icon!"
 game_concept_grace_desc: "Một biểu hiện cho thấy thực thể umbra này ưu ái bạn đến mức nào."
 
 game_concept_bind_wraith_interaction: "Tương tác Trói buộc Hồn ma"
 game_concept_bind_wraith_interaction_desc: "Một Tương tác cho phép nhân vật trói buộc một [GetTrait('wraith').GetName( GetNullCharacter )], sau đó cho phép ra thêm mệnh lệnh cho chúng."
 
 game_concept_command_wraith_interaction: "Tương tác Điều khiển Hồn ma"
 game_concept_command_wraith_interaction_desc: "Một Tương tác cho phép nhân vật điều khiển một [GetTrait('wraith').GetName(GetNullCharacter)] bị trói buộc hành động chống lại các nhân vật khác."
 
 game_concept_summon_wraith_on_death_interaction: "Tương tác Triệu hồi Hồn ma khi Chết"
 game_concept_summon_wraith_on_death_interaction_desc: "Một Tương tác cho phép nhân vật khiến một nhân vật khác trở thành [GetTrait('wraith').GetName( GetNullCharacter )] khi họ chết."

 game_concept_dreamer: "Người Mộng mơ"
 game_concept_dreamer_desc: "Trong số các Kithain, Người Mộng mơ có thể là một thuật ngữ chung cho bất kỳ người phàm nào nhưng thường được gán cho những người phàm thể hiện tia sáng của sự sáng tạo hoặc chưa bị Banality làm cho tê liệt đến mức trở nên chai sạn cảm xúc. Người Mộng mơ là nguồn Glamour chính cho Kithain, và do đó, là một nguồn tài nguyên được bảo vệ."
 
 game_concept_dan: "Dán"
 game_concept_dan_desc: "Trong hình thức cổ xưa của Kithain, Dán là Số phận; định mệnh và nghiệp báo của một người. Dán không dễ chịu với việc người ta can thiệp vào các sợi chỉ của nó, và những ai thường xuyên thao túng nó quá mức thông qua các Art như Soothsay thường thấy mình bị trói buộc ngày càng chặt vào mạng lưới của nó."
 
 game_concept_mythic_age: "Kỷ Nguyên Thần thoại"
 game_concept_mythic_age_desc: "Kỷ Nguyên Thần thoại kéo dài từ thời tiền sử cho đến khoảng năm 1000 TCN, khi Thời đại Đồ Sắt bắt đầu và nhân loại nhận ra rằng họ có thể định hình thế giới thông qua nỗ lực và sự thay đổi khắc nghiệt lạnh lùng."
 game_concept_sundering: "Sundering"
 game_concept_sundering_desc: "Sundering kéo dài từ khoảng năm 1000 TCN đến năm 1200-1400 SCN, khi con người bắt đầu ngừng tin vào Fae, và áp lực của Banality bắt đầu tích tụ."
 game_concept_shattering: "Shattering"
 game_concept_shattering_desc: "Vào khoảng thời gian của Tòa án Dị giáo Tây Ban Nha và Đại dịch Hạch (và tục lấy họ trở nên thịnh hành), áp lực tích tụ bởi Sundering cuối cùng đã bùng nổ, gây ra Shattering (khiến số lượng lớn [GetTrait('fae').GetName( GetNullCharacter )] hoặc bỏ đi đến [UmbraGlossary('arcadia')] hoặc chấp nhận Con đường [GetTrait('changeling').GetName( GetNullCharacter )], hoặc ẩn mình)."
 game_concept_interregnum: "Interregnum"
 game_concept_interregnum_desc: "Khoảng thời gian không có sidhe hay True Fae nào trên Trái Đất, khi những changeling 'pha loãng' còn lại phải tự lo liệu cho bản thân sau những giây phút hấp hối cuối cùng của [Glossary('Shattering','game_concept_shattering_desc')] vào khoảng năm 1400 SCN, chính là Interregnum, khi changeling phải tìm cách tự sinh tồn."
 game_concept_resurgence: "Resurgence"
 game_concept_resurgence_desc: "Sau hơn 400 năm của một Kỷ Nguyên Đen tối cho Fae, cuộc Đổ bộ Mặt Trăng năm 1969 hoặc đã mang đến Resurgence, hoặc là kết quả của việc mở lại các con đường giữa thế giới trần tục và thế giới thần thoại."
 
 game_concept_first_age: "Kỷ Nguyên Thứ Nhất"
 game_concept_first_age_desc: "Các nền văn hóa siêu nhiên khác nhau của Trung Nguyên có những tên gọi khác nhau cho kỷ nguyên này. Đối với [GetTrait('kueijin').GetName( GetNullCharacter )], đó là Kỷ Nguyên Thứ Nhất của Đại Chu Kỳ hay Kỷ Nguyên Thiên Đình. Đối với Hengeyokai, đó là Kỷ Nguyên Bình Minh. #TOOLTIP:GAME_TRAIT,mage,[GetNullCharacter] #L Chi'n Ta#!#! xem đó là trạng thái trước thời gian, được giải thích qua các thần thoại nhân loại như Bàn Cổ hay Brahman. Hsien nói về Kỷ Nguyên Toàn hảo. Kỷ Nguyên Thứ Nhất nói chung được coi là giai đoạn trước khi tạo ra thế giới. Nó đánh dấu thời kỳ khi Âm và Dương chưa tách rời, khi vạn vật là Một với [Glossary('Ngọc Hoàng','podgloss.augustpersonageofjade')] (hay Gaia). Nó được coi là một giai đoạn của sự hài hòa tột cùng, điểm kết nối đầu tiên giữa vạn vật."
 game_concept_second_age: "Kỷ Nguyên Thứ Hai"
 game_concept_second_age_desc: "[GetTrait('kueijin').GetName( GetNullCharacter )] và Hsien gọi đó là Kỷ Nguyên Thứ Hai của Đại Chu Kỳ hay Kỷ Nguyên Mỹ lệ, khi Trung Nguyên và Triều đình Linh giới vẫn còn gần nhau. Hengeyokai nói về Kỷ Nguyên Vạn Vật, nơi [Glossary('Tam Nguyên', 'glossary_triat_tt')] được sinh ra và sự sống như ngày nay được hình thành. #TOOLTIP:GAME_TRAIT,mage,[GetNullCharacter] #L Chi'n Ta#!#! cũng tương tự nói về sự sáng tạo của Tam Vị Siêu hình dưới hình thức Tam Bộ, những vị đã giám sát sự hình thành của Ngũ Hành, thứ sẽ nhường chỗ cho Vạn Vật."
 game_concept_third_age: "Kỷ Nguyên Thứ Ba"
 ##X Effects of Age:\n$BULLET_WITH_TAB$Every [akuma|E] gains: [GetModifier('akuma_debuff_modifier').GetNameWithTooltip]\n$BULLET_WITH_TAB$Every [Glossary('Yama King','podgloss.yamaking')] gains: [GetModifier('yama_debuff_modifier').GetNameWithTooltip]\n$BULLET_WITH_TAB$Every $POD_splat_kueijin$ gains: [GetModifier('godbodies_modifier').GetNameWithTooltip] #! \n
 game_concept_third_age_desc: "[GetTrait('kueijin').GetName( GetNullCharacter )], Hsien và Hengeyokai nói về Kỷ Nguyên Thứ Ba như Kỷ Nguyên Thứ Ba của Đại Chu Kỳ, Kỷ Nguyên Huyền thoại. Đó là thời tiền sử huyền thoại của Trung Nguyên, khi [Glossary('Wan Xian','game_concept_kuei_jin_desc')] đi lại giữa và cai trị nhân loại như những chủ nhân nhân từ. Đó cũng là kỷ nguyên mà những shen trung thành với Đấng Tối Cao chiến đấu với các sinh vật của [UmbraGlossaryLocalized('yomi_wan','Địa Ngục Yomi')] dưới những cuộc đình chiến bấp bênh. Đối với #TOOLTIP:GAME_TRAIT,mage,[GetNullCharacter] #L Chi'n Ta#!#!, đây là kỷ nguyên mà nhân loại tỉnh ngộ trước ý định của Thiên Đình và lần đầu học được cách sử dụng ma thuật.\nKỷ Nguyên Thứ Ba kết thúc thông qua âm mưu của [Glossary('Diêm Ma Vương','podgloss.yamaking')], những kẻ đã làm băng hoại [Glossary('Wan Xian','game_concept_kuei_jin_desc')] để chúng ăn chi. Nó cũng đánh dấu sự kết thúc của truyền thống huyền thoại và khởi đầu của lịch sử như nhân loại hiểu ngày nay."
 game_concept_fourth_age: "Kỷ Nguyên Thứ Tư"
 ##X Effects of Age:\n$BULLET_WITH_TAB$Every $POD_splat_kueijin$ gains: [GetModifier('godbodies_modifier').GetNameWithTooltip] #! \n
 game_concept_fourth_age_desc: "[GetTrait('kueijin').GetName( GetNullCharacter )] và Hsien nhớ lại kỷ nguyên này như Kỷ Nguyên Thứ Tư của Đại Chu Kỳ hay Kỷ Nguyên Sầu bi Diễm lệ. Nó đánh dấu khởi đầu của lời nguyền và sự biến đổi của [GetTrait('kueijin').GetName( GetNullCharacter )] từ chiến binh của Thiên Đình thành những sinh vật ma quỷ có nguồn gốc từ [UmbraGlossaryLocalized('yomi_wan','Địa Ngục Yomi')]. Đối với Tiểu Thần, đó là khởi đầu của sự lưu đày của họ khỏi Thiên Đình sau khi Đấng Tối Cao cấm họ vì liên quan đến cuộc nổi loạn của [Glossary('Wan Xian','game_concept_kuei_jin_desc')]. Hengeyokai nói về Kỷ Nguyên Thử thách, nơi [Glossary('Wan Xian','game_concept_kuei_jin_desc')] phản trắc đã kích động Fera chống lại nhau trong một sự kiện được ghi nhớ như Cuộc chiến Ô nhục. #TOOLTIP:GAME_TRAIT,mage,[GetNullCharacter] #L Chi'n Ta#!#! nhớ rằng nhiều phe phái khác nhau của những kẻ dùng ý chí đã nảy sinh từ thời kỳ này, và họ thường xung đột với nhau, như thấy trong các cuộc chiến như Chiến tranh Himalaya hay Chiến tranh Sông Rồng. Trong cuộc xung đột này, Yi, Cung thủ Xuất chúng và những kẻ theo ông xuất hiện, người đã sáng lập một giáo phái sau này tồn tại như [GetTrait('shih').GetName( GetNullCharacter )], chuyên săn lùng shen phản loạn."
 game_concept_fifth_age: "Kỷ Nguyên Thứ Năm"
 ##X Effects of Age:\n$BULLET_WITH_TAB$Every [akuma|E] gains: [GetModifier('akuma_buff_modifier').GetNameWithTooltip]\n$BULLET_WITH_TAB$Every [Glossary('Yama King','podgloss.yamaking')] gains: [GetModifier('yama_buff_modifier').GetNameWithTooltip] #!
 game_concept_fifth_age_desc: "Đối với [GetTrait('kueijin').GetName( GetNullCharacter )], Kỷ Nguyên Thứ Năm của Đại Chu Kỳ được biết đến như Kỷ Nguyên Bóng Tối. #TOOLTIP:GAME_TRAIT,mage,[GetNullCharacter] #L Chi'n Ta#!#! nói về thế giới hiện tại như bị thống trị bởi "Người Đá", những kẻ đến từ nơi xa xôi để đặt Trung Nguyên dưới sự kiểm soát của họ. Hengeyokai gọi đó là Kỷ Nguyên Bóng Râm. Hsien nói về Kỷ Nguyên Khổ nạn, nơi shen phải chứng minh mình xứng đáng với Thiên Đình hoặc bị hủy diệt một khi [Glossary('Ma Hoàng','podgloss.demonemperor')] cai trị. Gần như tất cả shen đều đồng ý rằng nguyên nhân của Kỷ Nguyên Thứ Năm là sự xâm nhập của người phương Tây vào Trung Nguyên."
 game_concept_sixth_age: "Kỷ Nguyên Thứ Sáu"
 ##X Effects of Age:\n$BULLET_WITH_TAB$Every [akuma|E] gains: [GetModifier('akuma_huge_buff_modifier').GetNameWithTooltip]\n$BULLET_WITH_TAB$Every [Glossary('Yama King','podgloss.yamaking')] gains: [GetModifier('yama_huge_buff_modifier').GetNameWithTooltip] #! \n
 game_concept_sixth_age_desc: "[GetTrait('kueijin').GetName( GetNullCharacter )] gọi kỷ nguyên sắp tới là Kỷ Nguyên Thứ Sáu của Đại Chu Kỳ, cũng được gọi là Kỷ Nguyên Sầu thảm. Đó là điểm đáy của Bánh Xe, nơi [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')] thoái vị khỏi ngai vàng của Người và một trong các [Glossary('Yama Kings','podgloss.yamaking')] sẽ lên ngôi để trở thành [Glossary('Demon Emperor','podgloss.demonemperor')]. Tuy nhiên, hầu hết [GetTrait('kueijin').GetName( GetNullCharacter )] xem Kỷ Nguyên Sầu thảm là một phần cần thiết của sự tồn tại. Tương tự, Hengeyokai tin rằng Kỷ Nguyên Sầu thảm sắp tới sẽ đặt ra thử thách lớn nhất của họ. Kẻ địch của họ, [Glossary('Yama Kings','podgloss.yamaking')], tìm cách lên ngôi thống trị Bánh Xe và giữ nó mắc kẹt mãi mãi trong Kỷ Nguyên Thứ Sáu, trong khi Đại Rết Khổng lồ tìm cách phá hủy chính bánh xe. Do đó, bổn phận của những đứa con của Mẹ Lục Bảo sẽ là bảo vệ Bánh Xe khỏi tất cả những kẻ tìm cách làm băng hoại nó. #TOOLTIP:GAME_TRAIT,mage,[GetNullCharacter] #L Chi'n Ta#!#! cũng tin rằng Bánh Xe sẽ sớm quay lại, nhưng bất đồng về việc nó sẽ ảnh hưởng đến họ ra sao. Hsien thay vào đó nói về Kỷ Nguyên Hoan lạc, nơi Bức Tường giữa các thế giới sẽ vỡ và cho phép họ trở về nhà. Những kẻ khác đã lấy lại những câu chuyện của các shen khác và bí mật lo lắng liệu điều này có tốt đẹp như nó nghe hay không."
 
 game_concept_grand_city: "Đại Thành"
 game_concept_grand_cities: "Đại Thành"
 game_concept_grand_city_desc: "Đại Thành là một trung tâm dân cư lớn có tầm quan trọng to lớn đối với cả thế giới phàm nhân và siêu nhiên.\n\nMỗi Đại Thành có một bộ cơ chế riêng biệt gắn liền với nó. Bạn có thể cần đáp ứng các yêu cầu đặc biệt trước khi có thể nâng cấp [buildings|E] của nó.\n\nCó 5 Đại Thành:\n$BULLET_WITH_TAB$[eternal_rome|E]\n$BULLET_WITH_TAB$[grand_city_of_constantinople|E]\n$BULLET_WITH_TAB$[grand_paris|E]\n$BULLET_WITH_TAB$[holy_cairo|E]\n$BULLET_WITH_TAB$[holy_jerusalem|E]\n\n#X Bạn chỉ có thể sở hữu #V;bold 1#! lãnh địa Đại Thành, trừ khi bạn thay đổi giới hạn đó qua luật chơi.#!"
 
 grand_city_incompatible_tooltip: "\n\n#help $fera_tribe_government$ [governments|El] không thể sử dụng thành phố này. Khi chinh phục thành phố, nó sẽ tự động chuyển đổi thành một bộ lạc.#!"
 grand_city_semi_incompatible_tooltip: "\n\n#help $fera_tribe_government$ [governments|El] không được đề cập cụ thể ở trên không thể sử dụng thành phố này. Khi chinh phục thành phố, nó sẽ tự động chuyển đổi thành một bộ lạc.#!"

 game_concept_eternal_rome: "Rome Vĩnh cửu"
 game_concept_st_peters_city: "Thành phố Thánh Peter"
 game_concept_roma_aeterna: "Roma Aeterna"
 game_concept_eternal_rome_desc: "[grand_city|E] Rome có một lịch sử lâu đời và đầy biến động. Có ba phiên bản của thành phố:\n\nKhi được kiểm soát bởi một [GetTrait('vampire').GetName(GetNullCharacter)], thành phố được gọi là #bold Roma Aeterna#!. 13 khu vực lịch sử của nó được chia cho các [Glossary('Clans','game_concept_Clan_desc')]. Để nâng cấp chúng, bạn sẽ cần sử dụng những [primogen|E] tài giỏi. Ở cấp 3, mỗi khu vực sẽ mở khóa #P năng lực mới#! cho nhân vật của bạn.\n\nKhi được kiểm soát bởi một [GetTrait('supehunter').GetName(GetNullCharacter)] của Shadow Inquisition, thành phố được gọi là #bold Thành phố Thánh Peter#!. Một Thợ săn có thể cư trú tại tu viện San Michele, biến nó thành trụ sở của Inquisition. Giúp đỡ các Dòng tu Inquisition khác sẽ mở khóa các lộ trình nâng cấp mạnh mẽ cho các công trình của nó.\n\nKhi được kiểm soát bởi bất kỳ ai khác, thành phố được gọi là #bold Rome Vĩnh cửu#!. Các di tích lịch sử của nó có thể được phục hồi bởi các nhân vật có [traits|E] cụ thể hoặc những người tài giỏi trong [court_positions|E].$grand_city_incompatible_tooltip$"
 
 game_concept_journey: "Hành trình"
 game_concept_journeys: "Hành trình"
 game_concept_journey_desc: "Một #bold Hành trình#! là một cuộc phiêu lưu dài hạn mà một nhân vật có thể thực hiện, một mình hoặc cùng với một [coterie|E].\n\nHầu hết Hành trình đều có một [planning_phase|E] và một [travel_phase|E].\n\nChỉ một Hành trình có thể hoạt động cùng lúc. Không giống như [schemes|E], Hành trình có thể được tạm dừng và tiếp tục vào một ngày sau đó.\n\n#help Để bắt đầu một Hành trình mới, nhấp vào nút #bold $POD_journeys_hud$#! ở phía bên phải màn hình của bạn, hoặc nhấp chuột phải vào một nhân vật khác và bắt đầu một Hành trình qua [character_interaction|E].#!"
 
 game_concept_planning_phase: "Giai đoạn Chuẩn bị"
 game_concept_planning_phase_desc: "#bold Giai đoạn Chuẩn bị#! của một [journey|E] đại diện cho việc nhân vật của bạn thu thập thông tin, cử trinh sát đi, và chuẩn bị các mặt khác cho chuyến đi sắp tới.\n\nThời lượng của Giai đoạn Chuẩn bị phụ thuộc vào [planning_speed|E]. Tùy thuộc vào [journey|E], có thể có cách để làm nó nhanh hơn. Một số Hành trình có [planning_speed|E] #V Tức thì#!, trong trường hợp đó Giai đoạn Chuẩn bị sẽ bị bỏ qua.\n\nSau khi Giai đoạn Chuẩn bị hoàn tất, [journey|E] sẽ chuyển sang [travel_phase|E]."
 
 game_concept_planning_speed: "Tốc độ Chuẩn bị"
 game_concept_planning_speed_desc: "Không giống như [schemes|E], [planning_phase|E] của một [journey|E] tiến triển với tốc độ không đổi mỗi tháng, không có yếu tố ngẫu nhiên nào liên quan.\n\n#help Chú giải của con số Tốc độ Chuẩn bị sẽ cho biết cách để tăng thêm tốc độ đó.#!"
 
 game_concept_travel_phase: "Giai đoạn Di chuyển"
 game_concept_travel_phase_desc: "Sau khi [planning_phase|E] của một [journey|E] hoàn tất, nhân vật của bạn biết được về một [location|E] trên thế giới nơi họ có thể hoàn thành nhiệm vụ của mình. Bạn có thể [travel|E] đến đó ngay lập tức, hoặc tạm dừng [journey|E] và đi sau.\n\nBạn có thể mời các thành viên trong [coterie|E] của mình cùng đi trong chuyến này.\n\n#help Bạn không thể bắt đầu [journeys|E] mới hoặc mời thành viên mới vào [coterie|E] của mình trong Giai đoạn Di chuyển.#!"
 
 game_concept_coterie: "Coterie"
 game_concept_coterie_desc: "Một #bold Coterie#! là một nhóm cá nhân cùng nhau thực hiện các [journeys|E]. "Coterie" là thuật ngữ được $POD_splat_vampire_plural$ sử dụng — các [splats|E] khác có thể có tên gọi khác cho nó.\n\nTrong khi bạn đang trong một [journey|E], [skills|E] được chia sẻ giữa các thành viên Coterie. Ví dụ, nếu một tình huống trong một [journey|E] đòi hỏi [diplomacy|E], nó chỉ xét đến [diplomacy_skill|E] của thành viên Coterie khéo léo ngoại giao nhất của bạn.\n\n#help Để xem lại Coterie của bạn, nhấp vào nút #bold $POD_journeys_hud$#! ở phía bên phải màn hình của bạn và chọn tab thứ hai.#!"
 
 game_concept_inner_circle: "Hội đồng Nội bộ"
 game_concept_inner_circle_desc: "Hội đồng Nội bộ là hội đồng điều hành của Camarilla. Hầu như không có gì được biết về Hội đồng Nội bộ, vốn luôn cố gắng giữ kín danh tính các thành viên của mình. Bộ mặt công khai của Hội đồng Nội bộ là các Justicar và các trợ lý Archon của họ. Các thành viên của Hội đồng Nội bộ bầu ra Justicar và thiết lập các nguyên tắc của luật Camarilla."
 game_concept_justicar: "Justicar"
 game_concept_justicar_desc: "Justicar là thành phần quyền lực nhất có thể thấy được của chính quyền Camarilla, chịu trách nhiệm phân xử các vấn đề của Truyền thống trên quy mô rộng và hành động như mắt, tai, và tay của Hội đồng Nội bộ. Có một Justicar cho mỗi clan của Camarilla, và mỗi người được phục vụ bởi nhiều Archon được đích thân chọn lựa, đóng vai trò là gián điệp, người thi hành, và đại diện của họ trên khắp thế giới."
 game_concept_archon: "Archon"
 game_concept_archon_desc: "Một Archon là một đặc vụ được công nhận của một trong các Justicar của Camarilla. Nếu Justicar là bàn tay của Hội đồng Nội bộ, thì Archon là những ngón tay của nó."
 
 game_concept_ventrue_clan_curse: "Lời nguyền Clan Ventrue"
 game_concept_feeding_restrictions: "Hạn chế Cho ăn"
 game_concept_ventrue_clan_curse_desc: "Mọi hậu duệ của $pod_clan$ [GetTrait('ventrue').GetName(GetNullCharacter)] đều chịu một hạn chế cho ăn khiến họ không thể cho ăn trên #bold bất kỳ ai#! ngoại trừ những người phàm rất đặc biệt.\n\nTrong [princes_of_darkness|E], một [GetTrait('ventrue').GetName(GetNullCharacter)] có thể chọn con mồi ưa thích của mình khi bắt đầu trò chơi. Cho ăn trên bất kỳ loại người phàm nào khác sẽ không làm giảm [hunger|E] của bạn, cũng không mang lại [lifestyle_experience|E] từ [resonance|E] của họ.\n\nCho ăn trên các $POD_splat_vampire_plural$ khác không bị ràng buộc bởi những hạn chế này."
 
 game_concept_blood_hunt: "Săn Máu"
 game_concept_anathema: "Anathema"
 game_concept_blood_hunt_desc: "Khi một [GetTrait('vampire').GetName(GetNullCharacter)] đã phạm phải một tội nghiêm trọng đe dọa sự an toàn của [the_masquerade|E], Camarilla có thể tuyên bố họ là [GetTrait('anathema').GetName(GetNullCharacter)] và kêu gọi một cuộc Săn Máu chống lại họ.\n\nTrong [princes_of_darkness|E], việc là [GetTrait('anathema').GetName(GetNullCharacter)] được thể hiện bằng một [trait|E]. Các thành viên Camarilla có thể nhắm mục tiêu [GetTrait('anathema').GetName(GetNullCharacter)] bằng [casus_belli|E] Săn Máu, việc này sẽ giam giữ tất cả [rulers|E] trong lãnh thổ của mục tiêu."
 
 game_concept_patron_council: "Hội đồng Bảo trợ"
 game_concept_patron_council_desc: "Hội đồng Bảo trợ (thường được gọi là "các Patron") là một liên minh lỏng lẻo của các fae theo chủ nghĩa truyền thống "Truyền thống" theo nghĩa này ám chỉ một thời điểm lịch sử trước Chiến tranh Mùa, khi mỗi Triều đình nắm quyền cai trị thế giới trong một khoảng thời gian được ấn định. Triều đình cầm quyền sẽ trao lại quyền lực cho Triều đình tiếp theo khi nhiệm kỳ đã thỏa thuận của mình kết thúc."
 
 game_concept_golconda: "Golconda"
 game_concept_enlightenment: "Giác ngộ"
 game_concept_golconda_desc: "#bold Golconda#! là một trạng thái giác ngộ huyền bí nơi một $POD_splat_vampire$ không còn chịu sự chi phối của [Glossary('The Beast','game_concept_beast_desc')].\n\nTrong [princes_of_darkness|E], [GetTrait('golconda').GetName(GetNullCharacter)] là một [trait|E]. Một số ít cá nhân hiếm hoi bắt đầu với nó, nhưng tất cả những người khác chỉ có thể đạt được nó sau một [journey|E] dài.\n\n#X Vì Golconda gắn liền chặt chẽ với Nhân tính của bạn, bạn sẽ mất toàn bộ tiến độ trên Hành trình này nếu bạn phạm tội giết người hoặc trộm cắp, hoặc rơi vào cơn Điên loạn.#!"
 
 game_concept_golconda_planning_speed: "Tốc độ Chuẩn bị Golconda"
 game_concept_golconda_planning_speed_desc: "Cách tốt nhất để tăng [planning_speed|E] của [journey|E] [golconda|E] là có những [GetCourtPositionType('touchstones_court_position').GetName()] phàm nhân. Họ là một [court_position|E] được mở khóa bởi các [faiths|E] có #TOOLTIP:GAME_FAITH_DOCTRINE,doctrine_enlightenment_virtues_conscience_and_selfcontrol #L Conscience#!#!, và bạn có thể tăng [aptitude|E] của họ bằng cách có một [Concept('relation','Relationship')|E] tốt với họ (như [friend|E] hoặc [lover|E]).\n\nCác cách khác để tăng tốc độ:\n$EFFECT_LIST_BULLET$Có các nhân vật khác có [traits|E] [GetTrait('golconda').GetName(GetNullCharacter)] hoặc [GetTrait('golconda_seeker').GetName(GetNullCharacter)] trong [coterie|E] của bạn\n$EFFECT_LIST_BULLET$Là một [GetTrait('confider').GetName(GetNullCharacter)], [GetTrait('journaller').GetName(GetNullCharacter)], hoặc [GetTrait('reclusive').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$Sở hữu một [artifact|E] với Golconda Lore"
 
 game_concept_hungerless: "Không Đói"
 game_concept_hungerless_desc: "Một $POD_splat_vampire$ không Đói đã hoàn toàn siêu việt khỏi nhu cầu về máu. Họ có thể tự do sử dụng [Glossary('Dị Năng','game_concept_discipline_desc')] và các năng lực khác vốn thường tốn máu để sử dụng.\n\nTuy nhiên, điều này cũng có nghĩa là họ không thể có được kinh nghiệm [resonance|E] từ việc săn mồi nữa."
 
 game_concept_umbra: "Umbra"
 game_concept_spirit_world: "Thế giới Linh hồn"
 game_concept_spirit_worlds: "Thế giới Linh hồn"
 game_concept_umbra_desc: "Umbra, còn được gọi là Thế giới Linh hồn, là hình ảnh phản chiếu tâm linh của thế giới vật chất. Nó được chia thành nhiều cõi phụ, mỗi cõi chứa đựng những kỳ quan và hiểm nguy riêng.\nChỉ một số ít thực thể được chọn mới có thể vượt qua chiều không gian này, và một số cõi chỉ mở ra cho một loại cá nhân cụ thể (hoặc với năng lực phù hợp).\nTrong game, Umbra có sẵn dưới dạng một bảng bên phải để khám phá cho những ai có khả năng làm điều đó."
 
 game_concept_skinlands: "Skinlands"
 game_concept_skinlands_desc: "Hồn ma gọi thế giới của người sống là Skinlands; điều này tương phản với [UmbraGlossary('shadowlands')], vùng đất của người chết và là quê hương của các hồn ma. Skinlands và [UmbraGlossary('shadowlands')] được ngăn cách bởi Shroud, thứ che khuất thế giới của người sống khỏi hồn ma. Hồn ma có thể có cái nhìn rõ hơn về những gì đang xảy ra giữa người sống nhờ năng lực bẩm sinh Lifesight. Spectre không thể nhìn xuyên qua Shroud và do đó không thể thấy Skinlands trừ khi chúng có Dark Arcanos Shroud-Rending."
 
 game_concept_gaia_realm: "Cõi Gaia"
 game_concept_gaia_realm_desc: "Cõi Gaia, thường được Garou gọi đơn giản là Cõi, là thế giới tự nhiên bao gồm cả lãnh địa vật chất, tâm linh và Umbral của Gaia: cụ thể là Trái Đất và tất cả các cõi linh giới chứa đựng trong đó. Thuật ngữ này đôi khi được sử dụng rộng rãi đến mức nó bao gồm cả [UmbraGlossary('penumbra')] nơi nó chồng lấn hoặc tiếp giáp với Cõi Gaia."
 
 game_concept_tao_te_hsien: "Tao Te Hsien"
 game_concept_tao_te_hsien_desc: "Đó không phải là Đạo giáo của Lão Tử, mặc dù nó được lấy cảm hứng từ đó. Mục đích của nó là để shinma hiểu được vị trí của mình trong vũ trụ kể từ khi Bức Tường xuất hiện. Không giống như triết học của loài người, nó có một mục tiêu... trao cho hsien sức mạnh để phá vỡ Bức Tường và du hành đến [spirit_worlds|E].\nNó chia sẻ nhiều đặc điểm của Đạo giáo. Những người theo nó có xu hướng rút lui khỏi những cạm bẫy của thế gian và tìm thấy một cuộc sống chiêm nghiệm an nhàn trong tự nhiên. Họ yêu việc học vì chính bản thân nó nhưng ít quan tâm đến chính trị. Một số là nhà khoa học, số khác là tu sĩ, số khác là ăn mày, số khác là chiến binh. Hsien của Nhật Bản đã sửa đổi nó thành một triết học giống Thiền hơn gọi là Hsien-do, và không giống một số tôn giáo phàm trần, Tao Te Hsien hoan nghênh sự thay đổi và chủ nghĩa cá nhân, miễn là nó không trở thành sự tự tôn vinh bản thân. Nó tĩnh lặng, bí ẩn, và sâu sắc.\nNó có năm bước tương ứng gần đúng với câu chuyện sáng thế của Đạo giáo, nhưng theo chiều ngược lại. Đối với người theo Đạo giáo, đầu tiên có Wu-Wo: Không phải Hư vô. Từ Wu-Wo sinh ra Wu Chi: Vô hạn. điều này sinh ra Hu T'un: Hỗn mang. Ở trung tâm của Hỗn mang này là một điểm tĩnh, ban đầu là một chấm nhỏ trở thành T'ai Chi: Đại Cực và từ đó sinh ra Đại Biến: T'ai I, được chia thành hai giai đoạn: T'ai Chu: Đại Sơ hay hình thể, và T'ai Shih: Đại Khởi hay Hơi thở Đầu tiên (Chi). Tất cả những điều này cuối cùng dẫn đến sự tạo ra của [Glossary('First Age','game_concept_first_age_desc')]: T'ai Su: Đại Nguyên thủy.\nTại sao các bước lại theo chiều ngược? Các bước đại diện cho cuộc đấu tranh để trở về Vô hạn; để phá vỡ những ràng buộc giới hạn việc du hành của shinma đến [spirit_worlds|E]. Có nhiều con đường trở về Vô hạn nhưng chắc chắn nhất là Tao Te Hsien. Có tin đồn rằng các Vị Thần Ô uế có phiên bản riêng của Nei Tan gọi là Hac Tao hay Con đường Đen; một con đường được quyết định bởi một [Glossary('Yama King','podgloss.yamaking')] trong [Glossary('Third Age','game_concept_third_age_desc')]."

 game_concept_cantrip: "Cantrip"
 game_concept_cantrips: "Cantrips"
 game_concept_fae_realm: "Cõi"
 game_concept_cantrip_desc: "Cantrip là các câu thần chú phép thuật của $POD_splat_fae$. Chúng có hai thành phần: #bold Nghệ Thuật#! và #bold Cõi#!.\n\nNghệ Thuật quyết định hiệu ứng của Cantrip. Một nhân vật có thể học các Nghệ Thuật mới bằng cách thực hiện một [journey|E] để #italic Học Kỹ Năng Mới#!, sau đó mở khóa [perks|E] trong một trong các [lifestyles|E] Nghệ Thuật.\n\nCõi quyết định ai có thể bị nhắm mục tiêu bởi Cantrip. Một $POD_splat_fae$ chưa thành thạo chỉ có thể ảnh hưởng đến những nhân vật rất cụ thể bằng phép thuật của mình, trong khi kẻ đã tinh thông các Cõi có thể mê hoặc bất kỳ ai trên thế giới.\n\nCó sáu Cõi:\n$EFFECT_LIST_BULLET$#TOOLTIP:GAME_TRAIT,realm_actor,[GetNullCharacter] #L;bold Diễn Viên#!#! cho phép thi triển Cantrip lên các mục tiêu ít quen thuộc hơn.\n$EFFECT_LIST_BULLET$#TOOLTIP:GAME_TRAIT,realm_fae,[GetNullCharacter] #L;bold Fae#!#! cho phép thi triển Cantrip lên các [splats|E] quyền năng hơn.\n$EFFECT_LIST_BULLET$#TOOLTIP:GAME_TRAIT,realm_prop,[GetNullCharacter] #L;bold Vật Phẩm#!#! cho phép thi triển Cantrip lên các [artifacts|E] hiếm hơn.\n$EFFECT_LIST_BULLET$#TOOLTIP:GAME_TRAIT,realm_nature,[GetNullCharacter] #L;bold Tự Nhiên#!#! cho phép ảnh hưởng đến các hiện tượng tự nhiên.\n$EFFECT_LIST_BULLET$#TOOLTIP:GAME_TRAIT,realm_scene,[GetNullCharacter] #L;bold Khung Cảnh#!#! quyết định tầm ảnh hưởng và khu vực của Cantrip.\n$EFFECT_LIST_BULLET$#TOOLTIP:GAME_TRAIT,realm_time,[GetNullCharacter] #L;bold Thời Gian#!#! quyết định thời lượng và thời gian hồi của Cantrip.\n\nMọi nhân vật mang huyết thống fae đều có thể mở khóa [perks|E] trong [lifestyle|E] [realm_lifestyle|E], nhưng để hoàn toàn tinh thông một Cõi cần phải thực hiện một [journey|E]."
 
 game_concept_bunk: "Bunk"
 game_concept_bunk_desc: "Từng có thời Glamour có thể được hái ra từ không khí; khi các fae tràn ngập nó và không cần đến sự dỗ dành nhẹ nhàng như vậy. Đó là [Glossary('Mythic Age','game_concept_mythic_age_desc')], nhưng thời đó không còn nữa. Giờ đây, để triệu hồi Glamour cần thiết nhằm dệt nên một cantrip, các changeling phải thực hiện những nghi thức và hành động kỳ lạ được gọi là Bunk."
 
 game_concept_unconquered_soul: "Linh Hồn Bất Khuất"
 game_concept_unconquered_soul_desc: "Linh Hồn Bất Khuất là một sự kiện trong đó chân dung, đặc điểm và đức tin của bạn có thể bị ghi đè bởi nạn nhân của $pod_diablerie$ mà bạn thực hiện."
 
 game_concept_umbra_expedition: "Viễn Chinh Umbra"
 game_concept_umbra_expeditions: "Viễn Chinh Umbra"
 game_concept_umbra_expedition_desc: "Khám phá một địa điểm umbra nơi một trong các nhà thám hiểm của bạn đã có một phát hiện, đòi hỏi phải vượt qua một loạt thử thách, có thể liên quan đến các cuộc đấu tay đôi với linh hồn, các bài kiểm tra kỹ năng, hoặc cơ hội tìm được kho báu."
 
 game_concept_umbra_aptitude: "Năng Khiếu Umbra"
 game_concept_umbra_aptitude_desc: "Thước đo mức độ nhanh chóng mà nhân vật này có thể khám phá umbra."
 
 game_concept_umbra_sense: "Giác Quan Umbra"
 game_concept_umbra_sense_desc: "Thước đo khả năng nhân vật này tránh bị mắc kẹt trong [umbra|E], hoặc hoàn thành thành công một [umbra_expedition|E] đã định.\nĐối với [GetTrait('mokole').GetName(GetNullCharacter)], nó còn giảm khả năng bị [innocents|E] tấn công."
 
 game_concept_roguelike_mode: "Chế Độ Roguelike"
 game_concept_roguelike_mode_desc: "Một #N chế độ khó#! dành cho [princes_of_darkness|E].\n\nKhi bắt đầu trò chơi, bạn sẽ chuyển sang một lãnh chúa một tỉnh ngẫu nhiên. Lãnh chúa đó cũng sẽ bị nguyền rủa. Bạn có thể chọn một trong các lời nguyền sau:\n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_wealth').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_love').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_rest').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_belongings').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_curiosity').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_guile').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_demands').GetNameWithTooltip]\n\nNgoài ra, bạn có thể để trò chơi chọn ngẫu nhiên một lời nguyền cho bạn, hoặc nhận tất cả các lời nguyền cùng một lúc.\n\nBạn chỉ có một mạng sống. Nếu lãnh chúa ban đầu của bạn chết trong khi vẫn đang bị nguyền rủa, trò chơi kết thúc.\n\nHoàn thành một trong các mục tiêu chính sẽ gỡ bỏ lời nguyền của bạn.\n\nChúc may mắn."

 game_concept_true_faith: "Đức Tin Chân Chính"
 game_concept_true_faith_desc: "Một số cá nhân có niềm tin vào thần thánh vững chắc đến mức chính sự xác tín của họ bảo vệ họ. Đây được gọi là #bold Đức Tin Chân Chính#!, và ban cho người tin siêu năng lực.\n\n$POD_splat_vampire_plural$ bị nó xua đuổi. $POD_splat_werewolf_plural$ bị tước mất phẫn nộ khi ở trước sự hiện diện của nó. $POD_splat_demon_plural$ và $POD_splat_wraith_plural$ đặc biệt dễ bị tổn thương trước nó. Tuy nhiên, Đức Tin Chân Chính có thể được tìm thấy ở nhiều [splats|E], và thậm chí một số Ma cà rồng cũng có nó.\n\nTrong [princes_of_darkness|E], [GetTrait('truefaith').GetName(GetNullCharacter)] là một [trait|E] mở khóa một [lifestyle|E] mới. Một nhân vật có đức tin đặc biệt mạnh mẽ là [GetTrait('beatific').GetName(GetNullCharacter)].\n\nViệc thờ phụng Ác Quỷ của một [GetTrait('witch').GetName(GetNullCharacter)] xung khắc với Đức Tin Chân Chính. $POD_splat_hunter_plural$ cũng có thể mất Đức Tin Chân Chính nếu họ có tính cách tội lỗi."

 game_concept_infiltration: "Xâm Nhập"
 game_concept_infiltration_mission: "Nhiệm Vụ Xâm Nhập"
 game_concept_infiltration_missions: "Nhiệm Vụ Xâm Nhập"
 game_concept_infiltrating: "Đang Xâm Nhập"
 game_concept_infiltration_desc: "Một cuộc #bold Xâm Nhập#! là một loại [journey|E] cho phép bạn lẻn vào [court|E] của người khác để hoàn thành một mục tiêu bí mật nào đó, chẳng hạn như đánh cắp một [artifact|E].\n\nCác cuộc Xâm Nhập diễn ra trên một bản đồ nơi bạn có thể tự do di chuyển. Nhấp vào các nút để di chuyển giữa chúng. Hãy nhớ rằng làm như vậy có thể làm tăng [suspicion_with_icon|E] của bạn.\n\nĐể hoàn thành một cuộc Xâm Nhập, bạn phải quay lại một nút thoát mà không để [suspicion_with_icon|E] của mình đạt đến [EmptyScope.ScriptValue('suspicion_max')|V0].\n\nHoàn thành thành công #V 3#! nhiệm vụ Xâm Nhập sẽ trao [GetModifier('infiltration_experience_modifier').GetNameWithTooltip]."

 game_concept_suspicion: "Nghi Ngờ"
 game_concept_suspicion_with_icon: "@masquerade_icon:color_goldy_yellow! Nghi Ngờ"
 game_concept_suspicion_desc: "#bold Nghi Ngờ#! mô tả mức độ chú ý bạn đã thu hút trong một cuộc [infiltration|E].\n\nNghi Ngờ chạy từ [EmptyScope.ScriptValue('suspicion_min')|V0] đến [EmptyScope.ScriptValue('suspicion_max')|V0]. Nếu nó đạt đến [EmptyScope.ScriptValue('suspicion_max')|V0], bạn sẽ bị bắt và cuộc [infiltration|E] thất bại.\n\nỞ mức [EmptyScope.ScriptValue('suspicion_threshold_1')|V0], [EmptyScope.ScriptValue('suspicion_threshold_2')|V0], và [EmptyScope.ScriptValue('suspicion_threshold_3')|V0] Nghi Ngờ, các biến chứng sẽ phát sinh khiến các bài kiểm tra [skill|E] trong tương lai khó khăn hơn."

 game_concept_mesmerize_defenses: "Phòng Vệ Trước Mesmerize"
 game_concept_mesmerize_defenses_desc: "Các nhân vật có tính cách áp đảo khó bị mesmerize hơn. Nếu người phòng thủ có các đặc điểm hoặc perk sau, cơ hội thành công của bạn sẽ giảm xuống: \nMa cà rồng \n$BULLET_WITH_TAB$[GetPerk('unswayable_mind_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetPerk('fortify_the_inner_facade_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$Phép thuật Huyết Chú 'Song of Jupiter' đã thi triển \n$BULLET_WITH_TAB$[GetTrait('dominateadvanced').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetTrait('presenceadvanced').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetTrait('auspexadvanced').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetTrait('fortitudeadvanced').GetName(GetNullCharacter)]\nXác ướp \n$BULLET_WITH_TAB$[GetPerk('wisdom_of_isis_perk').GetName(GetNullCharacter)] \nShih \n$BULLET_WITH_TAB$[GetPerk('mountain_meditation_perk').GetName(GetNullCharacter)]\nĐức Tin Chân Chính \n$BULLET_WITH_TAB$[GetPerk('holy_bulwark_perk').GetName(GetNullCharacter)]\nPsychic \n$BULLET_WITH_TAB$[GetPerk('anti_psi_1_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetPerk('anti_psi_2_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetPerk('anti_psi_3_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetPerk('anti_psi_4_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetPerk('anti_psi_5_perk').GetName(GetNullCharacter)]\nNgười sói \n$BULLET_WITH_TAB$[GetPerk('release_from_bondage_perk').GetName(GetNullCharacter)] \nFae \n$BULLET_WITH_TAB$[GetPerk('fair_is_foul_foul_is_fair_perk').GetName(GetNullCharacter)] \n$BULLET_WITH_TAB$[GetPerk('captive_heart_perk').GetName(GetNullCharacter)] \n$BULLET_WITH_TAB$[GetPerk('geas_ban_perk').GetName(GetNullCharacter)]\nVật phẩm \n$BULLET_WITH_TAB$Ancestor Talisman"

 game_concept_samuel_haight: "Samuel Haight"
 game_concept_samuel_haight_desc: "Một kẻ phản diện khét tiếng đến từ $pod_wod$, xuất hiện trong các cuộc phiêu lưu giao thoa của nhiều [splats|E] khác nhau. Còn được gọi là \"Ultimate Badass\".\n\nSamuel là một [GetTrait('kinfolk').GetName(GetNullCharacter)] căm ghét việc mình thiếu năng lực biến hình. Hắn sau đó tích lũy sức mạnh bằng nhiều cách khác nhau: uống máu $POD_splat_vampire$, học [bloodsorcery|E], sử dụng một nghi thức cấm kỵ để trở thành $POD_splat_werewolf$, dùng một artifact để đánh cắp Gift từ những Người sói khác, dùng chính artifact đó để đánh cắp kiến thức về Sphere từ một $POD_splat_mage$, và dùng thêm một artifact khác nữa để đạt được Arete.\n\nSự nghiệp ngông cuồng của hắn kết thúc khi một [GetTrait('baali').GetName(GetNullCharacter)] cổ xưa giết hắn trên đỉnh một kim tự tháp Aztec. Khi bước vào [UmbraGlossary('shadowlands')] với thân phận một [GetTrait('wraith').GetName(GetNullCharacter)], Haight đã bị rèn hồn thành một cái gạt tàn thuốc.\n\nDù có thể đã khởi đầu như một kẻ phản diện nghiêm túc, Samuel Haight dần dần trở thành một trò đùa ẩn dụ của các nhà biên kịch để châm biếm những nhân vật giao thoa quá mạnh."

 game_concept_samuel_haight_mode: "Chế Độ Samuel Haight"
 game_concept_samuel_haight_mode_with_icon: "@haight_icon! Chế Độ Samuel Haight"
 game_concept_samuel_haight_mode_desc: "Trong chế độ này, nhiều hạn chế về việc trộn lẫn [splats|E] được gỡ bỏ:\n\n$EFFECT_LIST_BULLET$Một số quyết định và tương tác nhất định từ trình tạo nhân vật được mở khóa mặc định, ví dụ như yêu cầu $pod_Embrace$, hoặc trở thành $POD_splat_ghoul$ bằng cách rút cạn một tù nhân $POD_splat_vampire$\n$EFFECT_LIST_BULLET$Bất kỳ [splat|E] nào cũng có thể học tất cả [Glossary('Numina','game_concept_numina_desc')]\n$EFFECT_LIST_BULLET$[GetTrait('truefaith').GetName(GetNullCharacter)] và #TOOLTIP:GAME_TRAIT,witch,[GetNullCharacter] #L Infernalism#!#! không còn xung khắc lẫn nhau\n$EFFECT_LIST_BULLET$$POD_splat_hunter_plural$ không mất khả năng của mình khi trở thành #TOOLTIP:GAME_TRAIT,witch,[GetNullCharacter] #L Infernalist#!#!\n$EFFECT_LIST_BULLET$Flaying Plague có thể được vũ khí hóa bởi bất kỳ nhân vật nào, và bất kỳ Fera nào cũng có thể bị biến thành một [GetTrait('abomination').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$Các nhân vật mang huyết thống fae vẫn giữ khả năng sử dụng [cantrips|E] sau $pod_Embrace$\n$EFFECT_LIST_BULLET$Các nhân vật siêu nhiên có thể nhận các đặc điểm [GetTrait('psychic').GetName(GetNullCharacter)] khi sinh ra\n$EFFECT_LIST_BULLET$Đặc điểm [GetTrait('dhampyr').GetName(GetNullCharacter)] không còn xung khắc với các đặc điểm [splat|E] khác khi sinh ra\n$EFFECT_LIST_BULLET$Các nửa-splat (như [GetTrait('ghoul').GetName(GetNullCharacter)]) không còn bị loại bỏ khi Hóa Nhộng hoặc Biến Đổi Đầu Tiên\n$EFFECT_LIST_BULLET$Fera có thể bị biến thành ghoul\n$EFFECT_LIST_BULLET$$POD_splat_ghoul_plural$ không mất đặc điểm [GetTrait('kinfolk').GetName(GetNullCharacter)] hoặc [GetTrait('kinain').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$Bất kỳ $POD_splat_vampire$ nào cũng có thể đánh thức [GetTrait('hun_and_po').GetName(GetNullCharacter)] của mình nếu họ kết bạn với một [GetTrait('salubri_watcher').GetName(GetNullCharacter)]\n\nCác thay đổi bổ sung:\n\n$EFFECT_LIST_BULLET$Tất cả [splats|E] có thể tự do tương tác với nhau\n$EFFECT_LIST_BULLET$[journeys|E] để học kỹ năng mới không tăng chi phí\n\nĐặt theo tên [samuel_haight|E]."

 game_concept_storyteller_mode: "Chế Độ Người Kể Chuyện"
 game_concept_storyteller_mode_with_icon: "@wod_icon! Chế Độ Người Kể Chuyện" # icon is big, needs a space
 game_concept_storyteller_mode_desc: "Chế độ chơi này có nhiều hạn chế khác nhau khiến việc tích lũy quyền lực nhanh chóng trở nên khó khăn hơn:\n\n$EFFECT_LIST_BULLET$[loyalty_with_icon|E] có yêu cầu [opinion|E] là #V 50#!\n$EFFECT_LIST_BULLET$Kinh nghiệm [resonance|E] từ việc uống máu bị giảm, dựa trên số lượng perk $pod_discipline$ mà một nhân vật có\n$EFFECT_LIST_BULLET$Người chơi tuyên chiến tấn công (thông qua tương tác nhân vật) hoặc hóa ma cà rồng cho một childe sẽ rơi khỏi [golconda|E]"

 game_concept_loyalty: "Trung Thành"
 game_concept_loyalty_with_icon: "@knight_icon!Trung Thành"
 game_concept_loyalty_desc: "Các [knights|E] vô địa sẽ muốn rời khỏi triều đình của người chơi nếu [opinion|E] của họ giảm xuống dưới #V 0#!. Bạn có một khoảng thời gian ân hạn 1 năm để nâng cao lại ý kiến của họ.\n\nCác nhân vật không phải chịu Trung Thành nếu:\n$EFFECT_LIST_BULLET$Bạn có một [strong_hook|E] đối với họ\n$EFFECT_LIST_BULLET$Họ nằm trong [council|E] của bạn\n$EFFECT_LIST_BULLET$Họ có mối quan hệ phục tùng với bạn (Herd, Dreamer, Thrall, Host, Oan Hồn Bị Ràng Buộc, hoặc Ác Quỷ Bị Ràng Buộc)\n$EFFECT_LIST_BULLET$Họ là [spouse|E], [friend|E], [soulmate|E], hoặc thành viên [coterie|E] của bạn\n$EFFECT_LIST_BULLET$Họ là [hostage|E] của bạn\n$EFFECT_LIST_BULLET$Họ đang chịu một Geas Bảo Hộ\n\nTrung Thành có yêu cầu khắt khe hơn trong [storyteller_mode_with_icon|E]."

 game_concept_static_stress: "Căng Thẳng Tinh Thần"
 game_concept_static_stress_desc: "Căng thẳng tinh thần là một loại [stress|E] đặc biệt không bị ảnh hưởng bởi bất kỳ modifier nào tác động đến một nhân vật."
 
 game_concept_kuei_jin: "Kuei-Jin"
 game_concept_kuei_jin_desc: "Thường được biết đến với tên Kuei-Jin, "Ma Cà Rồng Phương Đông" còn được gọi là Wan Kuei, Gui Ren, asuratizayya (ở Ấn Độ), hoặc đơn giản là "Tử Thi Đói Khát".\n\nNgười ta nói rằng Kuei-Jin là hậu duệ sa đọa của Wan Xian, "Vạn Anh Hùng" được [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')] chọn để dẫn dắt và bảo vệ vũ trụ trong lịch sử xa xưa. Wan Xian ban đầu được chọn thông qua các bài thử kỹ năng và lòng dũng cảm, và hấp thu khí xung quanh của vũ trụ. Tuy nhiên, họ đã sa ngã khỏi ân sủng, học cách hấp thu khí từ các sinh vật sống và làm hủ hóa các bài thử về sự xứng đáng.\n\nMột Kuei-Jin "sinh ra" khi linh hồn của họ thoát khỏi một [UmbraGlossaryLocalized('yomi_wan','Địa Ngục Yomi')] sau khi họ chết. Họ tự tổ chức xung quanh các Triều Đình chính trị và tuân theo một [Glossary('Dharma','podgloss.dharma')] để tìm đường trở về Thiên Đình."
 game_concept_wan_xian: "Wan Xian"
 game_concept_wan_kuei: "Wan Kuei"
 game_concept_hungry_dead: "Tử Thi Đói Khát"
 game_concept_asuratizayya: "Asuratizayya"

 game_concept_grand_city_of_constantinople: "Constantinople, Giấc Mơ Tàn Phai"
 game_concept_grand_city_of_constantinople_desc: "Đại Thành Constantinople có ba tuyến đường khác nhau tùy thuộc vào văn hóa của chủ sở hữu.\n\nTuyến đường cướp bóc (dành cho người Latin, Iberia, Pháp, Anh và Đức) có các công trình với thời gian xây dựng dài nhưng phần thưởng lớn ở cuối, thể hiện quá trình dài của việc cướp phá thành phố để lấy tất cả của cải.\nTuyến đường tái thiết (dành cho người Byzantine, La Mã, Nga và Hy Lạp Cổ đại) cung cấp các công trình tốn kém mất nhiều thời gian mới sinh lời nhưng lại mạnh mẽ nhất về sau đối với một Constantinople được xây dựng hoàn chỉnh.\nTuyến đường cải cách (dành cho tất cả những người khác) là một lựa chọn trung gian, cung cấp nhiều công trình với khả năng sinh lời tốt và chi phí phải chăng.$grand_city_incompatible_tooltip$"
  
 game_concept_plunder_route: "Tuyến Đường Cướp Bóc"
 game_concept_rebuild_route: "Tuyến Đường Tái Thiết"
 game_concept_reform_route: "Tuyến Đường Cải Cách"

 game_concept_bloodmagic_spell: "Phép Thuật Huyết Chú"
 game_concept_bs_spell: "Phép Thuật"
 game_concept_bs_spells: "Phép Thuật"
 game_concept_bloodmagic_spell_desc: "#bold Phép Thuật#! cho phép một [bloodsorcerer|E] làm những điều phi tự nhiên ngay cả theo tiêu chuẩn ma cà rồng. Mỗi Phép Thuật gắn liền với một [bs_path|E].\n\nPhép Thuật có thể có chi phí bổ sung ngoài [hunger_with_icon|E], như [static_stress|E] hoặc [piety|E].\n\nTrong [princes_of_darkness|E], Phép Thuật được thi triển thông qua [character_interaction|E] #V $blood_sorcery_interaction$#!. Cơ hội thành công của chúng dựa trên chênh lệch [learning|E], và, nếu cả hai đều là $POD_splat_vampire_plural$, chênh lệch [Glossary('Generation','game_concept_vampgeneration_desc')] của họ."

 game_concept_bloodmagic_tradition: "Truyền Thống Huyết Chú"
 game_concept_bs_tradition: "Truyền Thống"
 game_concept_bs_traditions: "Truyền Thống"
 game_concept_bloodmagic_tradition_desc: "Mỗi $pod_clan$ thực hành [bloodsorcery|E] đã tạo ra hệ thống tín ngưỡng và truyền thuyết riêng của mình xung quanh việc thực hành đó.\n\nTrong [princes_of_darkness|E], các Truyền Thống sau có thể được học thông qua [journey|E]:\n$EFFECT_LIST_BULLET$#bold Thaumaturgy#!, của [GetTrait('tremere').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$#bold Dur-An-Ki#!, của [GetTrait('assamite').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$#bold Akhu#!, của #TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L Setite#!#!\n$EFFECT_LIST_BULLET$#bold Sadhana#!, của [GetTrait('ravnos').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$#bold Koldunic Sorcery#!, của [GetTrait('tzimisce').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$#bold Abyssal Mysticism#!, của [GetTrait('lasombra').GetName(GetNullCharacter)]\n\nHọc một Truyền Thống sẽ mở khóa quyền truy cập vào các [bs_paths|E] liên quan của nó. Một số Con Đường cũng được chia sẻ giữa các Truyền Thống."

 game_concept_bloodmagic_path: "Con Đường Huyết Chú"
 game_concept_bs_path: "Con Đường"
 game_concept_bs_paths: "Con Đường"
 game_concept_bloodmagic_path_desc: "Một #bold Con Đường#! là một tập hợp các quy trình để đạt được một loại hiệu ứng với [bloodsorcery|E], như điều khiển thời tiết, thao túng bệnh tật, hoặc triệu hồi Ác Quỷ.\n\nTrong [princes_of_darkness|E], Con Đường là các dòng [perks|E] trong [lifestyle|E] Huyết Chú. Các perk này có thể mở khóa [bs_spells|E] mới hoặc cải thiện những cái đã có.\n\nHọc một [bs_tradition|E] sẽ mở khóa quyền truy cập vào các Con Đường liên quan của nó. Một số Con Đường cũng được chia sẻ giữa các Truyền Thống."

 game_concept_bloodmagic_ritual: "Nghi Thức Huyết Chú"
 game_concept_bs_ritual: "Nghi Thức"
 game_concept_bs_rituals: "Nghi Thức"
 game_concept_bloodmagic_ritual_desc: "#bold Nghi Thức#! là các [bs_spells|E] mạnh mẽ. Chúng thường có tỷ lệ thất bại thấp hơn, nhưng tốn nhiều thời gian và tài nguyên bổ sung hơn, như [gold|E] hoặc [piety|E].\n\nNghi Thức gắn liền với [bs_traditions|E]. Các Nghi Thức mạnh mẽ hơn được mở khóa bằng cách đạt được [perks|E] trong bất kỳ [bs_path|E] nào của Truyền Thống đó.\n\nTrong [princes_of_darkness|E], Nghi Thức là các [journeys|E]. Bạn không thể [travel|E] hoặc tham gia [activities|E] trong khi đang lên kế hoạch cho một Nghi Thức."
 
 game_concept_curia_support: "Sự Ủng Hộ Của Giáo Triều"
 game_concept_curia_support_desc: "Là một thanh tra dị giáo vô địa, bạn có một giá trị (mà bạn có thể kiểm tra trong quyết định cùng tên) gọi là Sự Ủng Hộ Của Giáo Triều, thể hiện mức độ Giáo Hội đánh giá cao hành động của bạn.\n\nBạn có thể cải thiện Sự Ủng Hộ Của Giáo Triều bằng cách hoàn thành các hợp đồng cụ thể hoặc giành chiến thắng trong các cuộc chiến chống lại những kẻ siêu nhiên. Bạn có thể tiêu Sự Ủng Hộ Của Giáo Triều để xin các loại ân huệ khác nhau (thông qua một quyết định) có thể đẩy nhanh việc đạt được mục tiêu cuối cùng của bạn: Châu Âu và Đất Thánh thoát khỏi tay sai của Địa Ngục.\n\nHãy lưu ý rằng mỗi khi một Giáo Hoàng mới được các hồng y bầu ra, một Sứ Thần Giáo Hoàng sẽ được cử đến trại của bạn để đánh giá lòng nhiệt thành của bạn. Ông ta sẽ không hài lòng nếu biết bạn sử dụng kiến thức không được cho phép như #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Pháp Thuật#!#! hoặc #TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L Quỷ Học#!#!. Nếu bạn đi xa hơn nữa, chẳng hạn như trở thành một [GetTrait('witch').GetName(GetNullCharacter)] hoặc bất tử bằng bất kỳ cách nào, bạn sẽ bị rút phép thông công."
 

 game_concept_crafting: "Chế Tác"
 game_concept_crafting_desc: "Chế Tác là một cơ chế được sử dụng để tạo ra [artifacts|E].\nCó ba phương pháp chế tác khác nhau:\n$BULLET_WITH_TAB$[crafting_forging|E]\n$BULLET_WITH_TAB$[crafting_brewing|E]\n$BULLET_WITH_TAB$[crafting_enhancing|E]\n\n[crafting_nodes|E] được đặt vào minigame chế tác nơi bạn có thể nhấp vào và kết nối chúng với nhau để tạo ra kết quả mong muốn. Kích thước bản đồ minigame được quyết định bởi [crafting_potential|E] của bạn, và bản đồ có thể được đổi lại bằng [crafting_rerolls|E].\n\nSố lượng nút bạn có thể sử dụng trong một phiên duy nhất bị giới hạn bởi [crafting_complexity|E] của bạn."

 game_concept_crafting_forging: "Rèn"
 game_concept_crafting_forged: "Đã Rèn"
 game_concept_crafting_forging_desc: "Thông qua rèn, bạn tạo ra các [artifacts|E] hoàn toàn mới. Các artifact này thường được trang bị cho nhân vật của bạn, mặc dù một số có thể có công dụng khác. Rèn đôi khi có thể yêu cầu tài nguyên bổ sung như mảnh artifact hoặc tù nhân cụ thể.\n\n[rarity|E] của artifact được tạo ra phụ thuộc vào độ bền tối đa của nó vào cuối quá trình rèn."

 game_concept_crafting_forging_template: "Mẫu Rèn"
 game_concept_crafting_forging_template_desc: "Một Mẫu Rèn quyết định loại artifact bạn đang tạo ra và được chọn thông qua một menu thả xuống trong giao diện [crafting_forging|E]. Chúng có thể từ áo giáp và vũ khí thông thường đến các vật thể siêu nhiên. Tất cả nhân vật đều có quyền truy cập vào các mẫu tương ứng với các ô trong kho đồ của họ. Các Mẫu bổ sung có thể được mở khóa thông qua [perks|E] hoặc các nguồn tương tự khác."

 game_concept_crafting_brewing: "Pha Chế"
 game_concept_crafting_brewing_desc: "Pha Chế là cách bạn tạo ra các hỗn hợp tiêu hao và các chất khác thông qua nhiều phương pháp khác nhau như giả kim thuật. Các vật phẩm tiêu hao này có thể được sử dụng lên chính bạn hoặc các nhân vật khác bằng cách sử dụng một [character_interaction|E]."

 game_concept_crafting_enhancing: "Tăng Cường"
 game_concept_crafting_enhancing_desc: "Tăng Cường hoặc Phù Phép là quá trình cải thiện các [artifacts|E] hiện có. Mỗi artifact có thể được cải thiện lên đến [crafting_enhance_limit|E] của nó và một số artifact nhất định không thể được tăng cường chút nào."

 game_concept_crafting_node: "Nút Chế Tác"
 game_concept_crafting_nodes: "Nút Chế Tác"
 game_concept_crafting_node_desc: "Nút Chế Tác là cách chính để tạo ra hoặc nâng cấp một artifact. Tất cả nhân vật bắt đầu với một số nút #bold cơ bản#! không thể bị vô hiệu hóa.\n\nCác nút đặc biệt bổ sung có thể được mở khóa thông qua perk, các công trình đặc biệt, hoặc các phương pháp đặc biệt khác. Mỗi nút có một số yêu cầu phải được đáp ứng để sử dụng nó. Các nút dành cho [crafting_brewing|E] cũng có thể tự thực thi hiệu ứng.\n\nCác nút #bold đặc biệt#! đã mở khóa có thể được bật và tắt tự do trước khi bắt đầu một phiên chế tác bằng cách nhấp vào chúng trong giao diện chế tác."
 
 game_concept_crafting_complexity: "Độ Phức Tạp Chế Tác"
 game_concept_crafting_complexity_desc: "Độ Phức Tạp thể hiện số lượng hành động bạn có sẵn khi tạo ra hoặc nâng cấp một artifact trước khi bạn buộc phải dừng lại.\n\nCon số này chủ yếu được tăng cường bởi [trait|El] [GetTrait('pod_crafter').GetName(GetNullCharacter)] cải thiện khi bạn sử dụng cơ chế [crafting|E]."
 
 game_concept_crafting_potential: "Tiềm Năng Chế Tác"
 game_concept_crafting_potential_desc: "Tiềm Năng Chế Tác thể hiện kích thước của bản đồ minigame chế tác được sử dụng khi chế tác. Giá trị càng cao càng mang lại nhiều cơ hội hơn. Tiềm năng chế tác chủ yếu dựa trên [trait_level_track_xp|E] của [GetTrait('pod_crafter').GetName(GetNullCharacter)]."
 
 game_concept_crafting_rerolls: "Đổi Lại Chế Tác"
 game_concept_crafting_rerolls_desc: "Đổi Lại Chế Tác, đúng như tên gọi, cho phép bạn đổi lại bản đồ minigame để có thể nhận được [crafting_nodes|E] hoặc bố cục tốt hơn. Nó dựa trên [learning|E] của bạn và là chỉ số chế tác duy nhất được liên kết trực tiếp với một [skill|E]."

 game_concept_crafting_enhance_limit: "Tiềm Năng Tăng Cường"
 game_concept_crafting_enhance_limit_desc: "Mỗi [artifact|E] có một giới hạn về số lần nó có thể được tăng cường, và giới hạn đó là tiềm năng của nó.\n\nTiềm năng chủ yếu dựa trên [rarity|E]:\n$BULLET_WITH_TAB$#COMMONBROWN Thông Thường#! — #N 0#!\n$BULLET_WITH_TAB$#color_dark_green Kiệt Tác#! — 1\n$BULLET_WITH_TAB$#FAMEDBLUE Danh Tiếng#! — 2\n$BULLET_WITH_TAB$#ILLUSTRIOUSPURPLE Lừng Lẫy#! — 3"

 game_concept_artifact_power: "Sức Mạnh Artifact"
 game_concept_artifact_power_with_icon: "@artifact_power_icon!Sức Mạnh Artifact"
 game_concept_artifact_power_desc: "Một số [crafting_forged|E] [artifacts|E] sở hữu một giá trị thể hiện sức mạnh của chúng khi được sử dụng trong hiệu ứng riêng của chúng. Điều này chỉ được hiển thị khi [crafting_forging_template|E] sử dụng nó. Giá trị này tăng lên với mỗi [crafting_node|E] được sử dụng trong quá trình Rèn tùy thuộc vào cấp bậc của nút."

 game_concept_POD_landless_mechanics: "Cơ Chế Vô Địa"
 game_concept_POD_landless_mechanics_desc: "Các [splats|E] sau đây có cơ chế riêng biệt khi là [adventurers|E]:\n\n$BULLET_WITH_TAB$ #bold $POD_splat_vampire_plural$, $POD_splat_ghoul_plural$, và $POD_splat_revenant_plural$#! có thể thăng cấp thành #TOOLTIP:GAME_TRAIT,ashen_adventurer,[GetNullCharacter] #L Nhà Thám Hiểm Tro Tàn#!#!, mở khóa các tương tác mới và các dòng công trình mới cho [domicile|E] của họ.\n$BULLET_WITH_TAB$ #bold $POD_splat_kueijin_plural$#! cũng có thể là #TOOLTIP:GAME_TRAIT,ashen_adventurer,[GetNullCharacter] #L Nhà Thám Hiểm Tro Tàn#!#!, với một vài thay đổi nhỏ.\n$BULLET_WITH_TAB$ #bold $POD_splat_hunter_plural$ của Shadow Inquisition#! nhận [curia_support|E] bằng cách săn lùng thành công các sinh vật của bóng đêm.\n$BULLET_WITH_TAB$ #bold $POD_splat_hunter_plural$ Độc Lập#! có một loạt quyết định để giành được sự ủng hộ từ các hội $POD_splat_hunter$ khác.\n$BULLET_WITH_TAB$ #bold $POD_splat_mummy_plural$#! có một Lăng Mộ sẽ nhận [POD_tomb_raids|E] từ những nhà thám hiểm tham lam.\n$BULLET_WITH_TAB$ #bold $POD_splat_demon_plural$#! có thể tái khám phá kiến thức ma quỷ bằng cách phát triển [Concept('cultist','Cult')|E] của họ.\n\nTất cả [splats|E] được nhắc đến ở trên đều có [domiciles|E] riêng biệt giữ lại các nâng cấp của họ khi chuyển đổi giữa vô địa và có lãnh địa.\n\nCác [splats|E] sau đây cũng có [domiciles|E] vô địa, nhưng không có cơ chế bổ sung nào khi là [adventurers|E]:\n\n$BULLET_WITH_TAB$ #bold $POD_splat_mokole_plural$#!\n\nCác [splats|E] khác #N không thể chơi được#! với tư cách [adventurers|E] (chưa)."
 
 game_concept_ashen_ambassador: "Đại Sứ Tro Tàn"
 game_concept_ashen_ambassador_desc: "Đại Sứ là các nhân vật vô địa làm việc (chủ yếu) vì lợi ích của một nhân vật có lãnh địa khác, Người Bảo Trợ Đại Sứ.\nCông cụ chính của họ là một tương tác nhân vật tên là Chuyến Thăm Đại Sứ, nơi họ có thể sử dụng các hành động khác nhau để gây ảnh hưởng đến lãnh chúa địa phương và nhận kinh nghiệm. Họ cũng có thể sử dụng tương tác Ủng Hộ Từ Người Bảo Trợ Của Bạn lên người bảo trợ của mình để yêu cầu các loại tài nguyên khác nhau.\nMột Đại Sứ chỉ có thể có một Người Bảo Trợ tại một thời điểm và sẽ mất quyền truy cập vào các tính năng của mình nếu họ có lãnh địa. Tuy nhiên, họ vẫn giữ lại kinh nghiệm và các công trình đã mở khóa cho đến thời điểm đó."
  
 game_concept_ashen_grandmaster: "Đại Sư Tro Tàn"
 game_concept_ashen_grandmaster_desc: "Đại Sư là các nhân vật vô địa lãnh đạo một quân đoàn (chính thức hoặc không). \nHọ có thể tùy chỉnh và cải thiện tổ chức của mình (thông qua một quyết định) bằng cách tiêu kinh nghiệm đặc điểm Đại Sư Tro Tàn, kinh nghiệm đó có được bằng cách tham gia các cuộc chiến ở phe chiến thắng, hoặc hoàn thành các hợp đồng vô địa về quân sự và chiến tranh.\n$pod_kueijin$ vô địa thay vào đó sử dụng kinh nghiệm này để học và cải thiện các chiến lược liên quan đến chiến tranh."

 game_concept_ashen_caravan: "Chủ Đoàn Lữ Hành Tro Tàn"
 game_concept_ashen_caravan_desc: "Chủ Đoàn Lữ Hành Tro Tàn là số ít những nhân vật thực sự biết cách vượt qua những con đường chết chóc của Thế Giới Bóng Tối, và bán chuyên môn của mình cho những ai cần đến.\nBạn nhận kinh nghiệm cho đặc điểm này bằng cách hoàn thành các hợp đồng vận chuyển. Nó mở khóa các vị trí triều đình vô địa mới và giảm chi phí sử dụng các lựa chọn di chuyển."
 
 game_concept_ashen_cult: "Chủ Giáo Phái Tro Tàn"
 game_concept_ashen_cult_desc: "Tiên tri, giáo trưởng dị giáo, kẻ làm phép lạ... Thế Giới Bóng Tối đầy rẫy những con người, dù là phàm nhân hay không, đang tìm kiếm chân lý và sẵn sàng tin vào một cá nhân có sức lôi cuốn truyền đạt (phiên bản của họ về) nó.\nBạn có thể cải thiện đặc điểm này bằng cách sử dụng quyết định cùng tên. Nó cho phép bạn tương tác với quận nơi domicile của bạn đóng theo nhiều cách khác nhau thông qua một sự kiện."

 game_concept_akuma: "Akuma"
 game_concept_akuma_desc: "Akuma, hay Kẻ Bị Quỷ Nuốt, là những cá nhân đã từ bỏ đức hạnh và ném số phận của mình vào tay [Glossary('Yama Kings','podgloss.yamaking')]. Một số chỉ là những con cờ ngây thơ đơn giản trong khi những kẻ khác là những sinh vật đáng sợ với sức mạnh địa ngục.\n\nVới mục đích của các mục tiêu trong [princes_of_darkness|E], Akuma là một trong các trường hợp sau:\n$BULLET_WITH_TAB$Nhân vật có [trait|E] [GetTrait('witch').GetName(GetPlayer)]\n$BULLET_WITH_TAB$Nhân vật có [trait|E] [GetTrait('wukuei').GetName(GetPlayer)]\n$BULLET_WITH_TAB$Nhân vật có [faith|E] mang [doctrine|E] [GetFaithDoctrine('special_doctrine_allied_to_yomi_wan_hostility').GetBaseName]\n$BULLET_WITH_TAB$Nhân vật có [modifier|E] [GetModifier('yama_king_modifier').GetNameWithTooltip]"

 game_concept_grand_paris: "Đại Thành Paris"
 game_concept_grand_paris_desc: "[grand_city|E] Paris được nhiều người khao khát. Có ba phiên bản của thành phố này:\n\n$BULLET_WITH_TAB$Paris Hiệp Sĩ: Dành cho [GetTrait('toreador').GetName(GetNullCharacter)], [GetTrait('ventrue').GetName(GetNullCharacter)], hoặc một $POD_splat_vampire$ theo Via Equitum. Mô phỏng theo liên minh đầy sóng gió giữa Đại Triều Đình của Alexander và $glossary_courts_of_love$ và tất cả tiềm năng mà nó nắm giữ.\nPhiên bản này chứa một công trình độc đáo cho Toreador (và Via Equitum) và một công trình khác cho Ventrue (với chính Alexander có một phiên bản khác).\n\n$BULLET_WITH_TAB$Paris Umbral: Dành cho các $POD_splat_vampire_plural$ khác, $POD_splat_kueijin_plural$, $POD_splat_demon_plural$, $POD_splat_wraith_plural$, #TOOLTIP:GAME_TRAIT,banemummy,[GetNullCharacter] #L Bane Mummy#!#!, hoặc các faith theo doctrine Unseelie. Đại diện cho một Paris dưới sự kiểm soát của các sinh vật siêu nhiên hắc ám.\n\n$BULLET_WITH_TAB$Paris Tự Do: Dành cho tất cả những người khác. Một Paris được giải thoát khỏi ảnh hưởng ký sinh của các thế lực hắc ám. Shadow Inquisition nhận được một vài công trình độc đáo trong thành phố.$grand_city_incompatible_tooltip$"


 game_concept_holy_cairo: "Cairo, Kẻ Chiến Thắng"
 game_concept_holy_cairo_desc: "Đôi khi được gọi là Umm al-Dunya ("Mẹ Của Thế Giới"). Ban đầu là thị trấn Fustat, khu vực này được xây dựng bởi người Ba Tư, La Mã, Byzantine, và cuối cùng là người Ả Rập, những người đặt tên cho nó là Al Qahirah ("Kẻ Chiến Thắng"). Có ba phiên bản của thành phố này:\n\n$BULLET_WITH_TAB$Cairo Cổ Đại: Dành cho tất cả thành viên của $glossary_osirian_league$ và Xác Ướp Ishmaelite #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L Xác Ướp#!. Nhận sức mạnh độc đáo khi bạn tập hợp các Osirian tại Cairo thánh thiện. Bạn sẽ cần tất cả các thành viên là [councillors|E] tài giỏi để mở khóa toàn bộ tiềm năng của thành phố.\n#warning Rất khuyến khích chơi ở bookmark thứ ba. Phiên bản này cũng hoàn toàn bị vô hiệu hóa ở bookmark đầu tiên.#!\n\n$BULLET_WITH_TAB$Cairo Ma Cà Rồng: Dành cho #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L ma cà rồng#!. Xây dựng và mở rộng $glossary_khittas$ để phát triển Cairo và cải thiện hiệu quả của [councillors|E] và [court_positions|E] của bạn. Các faith có [doctrine|el] Trụ Cột [Glossary('Ashirra','game_concept_ashirra_desc')] nhận thêm phần thưởng cho việc xây dựng Khittas theo phe Ashirra. Setite có thể xây dựng lại các ngôi đền sáng lập của mình để tạo ra [faith|El] Road of Set riêng của mình.\n\n$BULLET_WITH_TAB$Cairo Hồi Giáo: Dành cho tất cả những người khác. Nhưng chỉ có thợ săn Ikhwan al-Safa mới có thể mở khóa tiềm năng thực sự của thành phố này.$grand_city_semi_incompatible_tooltip$"

 game_concept_holy_jerusalem: "Jerusalem Thánh Thiện"
 game_concept_holy_jerusalem_desc: "[grand_city|E] Jerusalem là nơi có tầm quan trọng lớn đối với 3 tôn giáo Abraham. Jerusalem là trung tâm thờ phụng lịch sử của Do Thái giáo kể từ thời điểm Isaac bị trói và là nơi duy nhất được phép tổ chức một số lễ hội nhất định, nếu bỏ qua giáo lý của các giáo sĩ. Cơ Đốc giáo xem Jerusalem là nơi Chúa Jesus Đấng Messiah bị hành hình và phục sinh và rất gần Núi Ô-liu. Hồi giáo coi Jerusalem là điểm đến của Muhammad trong Hành Trình Đêm của ông và là Qibla đầu tiên.\n\nCác biến thể thành phố dựa trên sự cân bằng ảnh hưởng chính trị giữa 3 tôn giáo, một sự cân bằng vẫn còn khi thành phố bị chinh phục. Hãy lưu ý rằng với tư cách là một lãnh chúa Cơ Đốc giáo, bạn có thể thấy tốn kém khi tăng ảnh hưởng Cơ Đốc giáo sau khi chinh phục thành phố từ một lãnh chúa Hồi giáo. Có 4 phiên bản của thành phố:\n$BULLET_WITH_TAB$Jerusalem Cơ Đốc giáo: Dành cho tín đồ của [christian_derived_faiths|E]. Mở rộng sức mạnh của 5 quân đoàn thập tự chinh, tất cả đều cải thiện hoặc được cải thiện bởi các hiệp sĩ của bạn.\n$BULLET_WITH_TAB$Jerusalem Hồi giáo: Dành cho tín đồ của [muslim_derived_faiths|E]. Tu sửa và thánh hiến các địa điểm quan trọng để tăng thu nhập và khả năng loại bỏ những kẻ thập tự chinh xâm lược.\n$BULLET_WITH_TAB$Jerusalem Do Thái giáo: Dành cho tín đồ của [jewish_derived_faiths|E]. Xây dựng lại các di tích cổ của Jerusalem để có được một bộ công trình toàn diện.\n$BULLET_WITH_TAB$Jerusalem Chia Cắt: Dành cho tất cả những người khác. Xây dựng từng Khu Phố để mở khóa một số lợi ích mà một Jerusalem chuyên biệt hơn có thể có trong khi vẫn duy trì cân bằng quyền lực, sử dụng biểu đồ trong [decision|E] Thay Đổi Cân Bằng để theo dõi nó.\n\nNgoài các công trình khác nhau, Jerusalem còn cung cấp một số [Concept('jerusalem_unique_decisions','Unique Decisions')|E] liên quan đến Hố gần đó."

 game_concept_christian_derived_faiths: "Các Faith Bắt Nguồn Từ Cơ Đốc Giáo"
 game_concept_christian_derived_faith: "Faith Bắt Nguồn Từ Cơ Đốc Giáo"
 game_concept_christian_derived_faiths_desc: "[SelectLocalization( IsInGame, 'game_concept_christian_derived_faiths_desc_ingame', 'game_concept_christian_derived_faiths_desc_outofgame' )]"
 game_concept_christian_derived_faiths_desc_ingame: "Rất ít [characters|E] trong $pod_wod$ thực hành một hình thức Cơ Đốc giáo có thể nhận ra được và thay vào đó thực hành các [faiths|E] bắt nguồn từ các phiên bản quen thuộc hơn. Trong [princes_of_darkness|E], các [faiths|E] này là:\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('viachristi').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('viavindicta').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('viapenaculum').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('viaredemptio').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('pathoftheheavenlyabode').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('vianoctis').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('viadolorosa').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('viacain').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('viapura').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('redtemptation').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('apostlesthirdcaine').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('blackmagdalene').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('eschatologists').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('sanctamater').GetName]\n$BULLET_WITH_TAB$@supehunter_icon! [GetFaithByKey('shadowinquisition').GetName]\n$BULLET_WITH_TAB$@supehunter_icon! [GetFaithByKey('akritai').GetName]\n$BULLET_WITH_TAB$[faiths|E] [GetReligionByKey('calomenasforsaken_religion').GetName]\n$BULLET_WITH_TAB$@werewolf_icon! [GetFaithByKey('crestofthehorn').GetName]\n$BULLET_WITH_TAB$@werewolf_icon! [GetFaithByKey('orderofourmercifulmother').GetName]\n$BULLET_WITH_TAB$[faiths|E] [GetReligionByKey('fishers_religion').GetName]\n$BULLET_WITH_TAB$Bất kỳ [faith|E] nào có @changeling_icon! [GetFaithDoctrine('special_doctrine_fae_constantinians_hostility').GetBaseName]"
 game_concept_christian_derived_faiths_desc_outofgame: "Rất ít [characters|E] trong $pod_wod$ thực hành một hình thức Cơ Đốc giáo có thể nhận ra được và thay vào đó thực hành các [faiths|E] bắt nguồn từ các phiên bản quen thuộc hơn. Trong [princes_of_darkness|E], các [faiths|E] này là:\n$BULLET_WITH_TAB$@vampire_icon! $viachristi$\n$BULLET_WITH_TAB$@vampire_icon! $viavindicta$\n$BULLET_WITH_TAB$@vampire_icon! $viapenaculum$\n$BULLET_WITH_TAB$@vampire_icon! $viaredemptio$\n$BULLET_WITH_TAB$@vampire_icon! $pathoftheheavenlyabode$\n$BULLET_WITH_TAB$@vampire_icon! $vianoctis$\n$BULLET_WITH_TAB$@vampire_icon! $viadolorosa$\n$BULLET_WITH_TAB$@vampire_icon! $viacain$\n$BULLET_WITH_TAB$@vampire_icon! $viapura$\n$BULLET_WITH_TAB$@vampire_icon! $redtemptation$\n$BULLET_WITH_TAB$@vampire_icon! $apostlesthirdcaine$\n$BULLET_WITH_TAB$@vampire_icon! $blackmagdalene$\n$BULLET_WITH_TAB$@vampire_icon! $eschatologists$\n$BULLET_WITH_TAB$@vampire_icon! $sanctamater$\n$BULLET_WITH_TAB$@supehunter_icon! $shadowinquisition$\n$BULLET_WITH_TAB$@supehunter_icon! $akritai$\n$BULLET_WITH_TAB$[faiths|E] $calomenasforsaken_religion$\n$BULLET_WITH_TAB$@werewolf_icon! $crestofthehorn$\n$BULLET_WITH_TAB$@werewolf_icon! $orderofourmercifulmother$\n$BULLET_WITH_TAB$[faiths|E] $fishers_religion$\n$BULLET_WITH_TAB$Bất kỳ [faith|E] nào có @changeling_icon! $special_doctrine_fae_constantinians_hostility_name$"

 game_concept_muslim_derived_faiths: "Các Faith Bắt Nguồn Từ Hồi Giáo"
 game_concept_muslim_derived_faiths_desc: "[SelectLocalization( IsInGame, 'game_concept_muslim_derived_faiths_desc_ingame', 'game_concept_muslim_derived_faiths_desc_outofgame' )]"
 game_concept_muslim_derived_faiths_desc_ingame: "Rất ít [characters|E] trong $pod_wod$ thực hành một hình thức Hồi giáo có thể nhận ra được và thay vào đó thực hành các [faiths|E] bắt nguồn từ các phiên bản quen thuộc hơn. Trong [princes_of_darkness|E], các [faiths|E] này là:\n$BULLET_WITH_TAB$@vampire_icon! [Glossary('Ashirra','game_concept_ashirra_desc')]\n$BULLET_WITH_TAB$Bất kỳ [faith|E] nào có @vampire_icon! [GetFaithDoctrine('special_doctrine_ashirra_pillars_kindred').GetBaseName]\n$BULLET_WITH_TAB$[faiths|E] [GetReligionByKey('roadofblood_religion').GetName]\n$BULLET_WITH_TAB$@supehunter_icon! [GetFaithByKey('ikhwan_al_safa').GetName]"
 game_concept_muslim_derived_faiths_desc_outofgame: "Rất ít [characters|E] trong $pod_wod$ thực hành một hình thức Hồi giáo có thể nhận ra được và thay vào đó thực hành các [faiths|E] bắt nguồn từ các phiên bản quen thuộc hơn. Trong [princes_of_darkness|E], các [faiths|E] này là:\n$BULLET_WITH_TAB$@vampire_icon! [Glossary('Ashirra','game_concept_ashirra_desc')]\n$BULLET_WITH_TAB$Bất kỳ [faith|E] nào có @vampire_icon! $special_doctrine_ashirra_pillars_kindred_name$\n$BULLET_WITH_TAB$[faiths|E] $roadofblood_religion$\n$BULLET_WITH_TAB$@supehunter_icon! $ikhwan_al_safa$"

 game_concept_jewish_derived_faiths: "Các Faith Bắt Nguồn Từ Do Thái Giáo"
 game_concept_jewish_derived_faiths_desc: "[SelectLocalization( IsInGame, 'game_concept_jewish_derived_faiths_desc_ingame', 'game_concept_jewish_derived_faiths_desc_outofgame' )]"
 game_concept_jewish_derived_faiths_desc_ingame: "Rất ít [characters|E] trong $pod_wod$ thực hành một hình thức Do Thái giáo có thể nhận ra được và thay vào đó thực hành các [faiths|E] bắt nguồn từ các phiên bản quen thuộc hơn. Trong [princes_of_darkness|E], các [faiths|E] này là:\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('derechchaim').GetName]\n$BULLET_WITH_TAB$@supehunter_icon! [GetFaithByKey('judge').GetName]"
 game_concept_jewish_derived_faiths_desc_outofgame: "Rất ít [characters|E] trong $pod_wod$ thực hành một hình thức Do Thái giáo có thể nhận ra được và thay vào đó thực hành các [faiths|E] bắt nguồn từ các phiên bản quen thuộc hơn. Trong [princes_of_darkness|E], các [faiths|E] này là:\n$BULLET_WITH_TAB$@vampire_icon! $derechchaim$\n$BULLET_WITH_TAB$@supehunter_icon! $judge$"

 game_concept_jerusalem_unique_decisions: "Quyết Định Jerusalem"
 game_concept_jerusalem_unique_decisions_desc: "[SelectLocalization( IsInGame, 'game_concept_jerusalem_unique_decisions_desc_ingame', 'game_concept_jerusalem_unique_decisions_desc_outofgame' )]"
 game_concept_jerusalem_unique_decisions_desc_ingame: "Một sinh vật quyền năng nằm bên trong một hố có miệng có thể được tìm thấy tại Ketef Hinnom. Nhiều tiếng nói mâu thuẫn nhau phát ra từ Hố, có lẽ mang lại một số hiểu biết. Những tiếng nói này chạm đến cả người phàm lẫn kẻ siêu nhiên, khiến nhiều người trong khu vực rơi vào cuồng loạn và cuồng tín tôn giáo. Đây là bản tóm tắt các quyết định hiện có:\n$BULLET_WITH_TAB$#V $supehunter_purify_jerusalem_pit_decision$#!: Dành cho một [GetTrait('supehunter').GetName(GetNullCharacter)] thuộc [religion|E] [GetReligionByKey('hunters_religion').GetAdjective]\n$BULLET_WITH_TAB$#V $malkavian_search_for_sister_decision$#!: Dành cho một [GetTrait('malkavian').GetName(GetNullCharacter)] để tìm kiếm ai đó quan trọng đối với...\n$BULLET_WITH_TAB$#V $malakaite_mistress_boon_decision$#!: Dành cho một [GetTrait('vampire').GetName(GetNullCharacter)], [GetTrait('revenant').GetName(GetNullCharacter)], hoặc [GetTrait('ghoul').GetName(GetNullCharacter)] thuộc [faith|E] [GetFaithByKey('eyesofmalakai').GetName] để yêu cầu sự trợ giúp từ Nữ Chủ Nhân của bạn trong việc hoàn thành nhiệm vụ của bạn\n$BULLET_WITH_TAB$#V $molochite_maintain_the_sleep_decision$#!: Dành cho một [GetTrait('vampire').GetName(GetNullCharacter)] thuộc [house|E] [GetDynastyHouseByID('house_moloch').GetName] để khai thác kiến thức khi bạn làm sâu thêm giấc ngủ của Kẻ Ngủ Say\n$BULLET_WITH_TAB$#V $nergalite_wake_the_sleeper_decision$#!: Dành cho một [GetTrait('witch').GetName(GetNullCharacter)] hoặc một [GetTrait('vampire').GetName(GetNullCharacter)] [GetTrait('witch').GetName(GetNullCharacter)] hoặc cho một [GetTrait('vampire').GetName(GetNullCharacter)] thuộc [house|E] [GetDynastyHouseByID('house_nergal').GetName] hoặc [GetDynastyHouseByID('house_angellisater').GetName]. Có phần thưởng cho việc giúp đỡ những sinh vật như vậy.\n$BULLET_WITH_TAB$#V $vamp_lower_gen_jerusalem_decision$#!: Dành cho một [GetTrait('vampire').GetName(GetNullCharacter)] không có quyết định độc đáo để hạ thấp [Glossary('Generation','game_concept_vampgeneration_desc')] của bạn, nhưng hãy coi chừng cái giá phải trả\n$BULLET_WITH_TAB$#V $mummies_tap_web_faith_decision$#!: Dành cho một [GetTrait('shemsuheru').GetName(GetNullCharacter)], [GetTrait('cabiri').GetName(GetNullCharacter)], hoặc [GetTrait('banemummy').GetName(GetNullCharacter)] [GetTrait('mummy').GetName(GetNullCharacter)] khi họ khai thác Mạng Lưới Đức Tin để nhận thêm kinh nghiệm Hekau\n$BULLET_WITH_TAB$#V $constantinian_channel_religious_fervor_decision$#!: Dành cho các nhân vật mang huyết thống fae thuộc [GetFaithDoctrine('special_doctrine_fae_constantinians_hostility').GetBaseName] sau khi hoàn thành [decision|E] Constantinian Catechism khi họ sử dụng cơn cuồng loạn địa phương trong hành trình tìm kiếm quyền lực của mình"
 game_concept_jerusalem_unique_decisions_desc_outofgame: "Một sinh vật quyền năng nằm bên trong một hố có miệng có thể được tìm thấy tại Ketef Hinnom. Nhiều tiếng nói mâu thuẫn nhau phát ra từ Hố, có lẽ mang lại một số hiểu biết. Những tiếng nói này chạm đến cả người phàm lẫn kẻ siêu nhiên, khiến nhiều người trong khu vực rơi vào cuồng loạn và cuồng tín tôn giáo. Đây là bản tóm tắt các quyết định hiện có:\n$BULLET_WITH_TAB$#V $supehunter_purify_jerusalem_pit_decision$#!: Dành cho một [GetTrait('supehunter').GetName(GetNullCharacter)] thuộc $hunters_religion_adj$ [religion|E]\n$BULLET_WITH_TAB$#V $malkavian_search_for_sister_decision$#!: Dành cho một [GetTrait('malkavian').GetName(GetNullCharacter)] để tìm kiếm ai đó quan trọng đối với...\n$BULLET_WITH_TAB$#V $malakaite_mistress_boon_decision$#!: Dành cho một [GetTrait('vampire').GetName(GetNullCharacter)], [GetTrait('revenant').GetName(GetNullCharacter)], hoặc [GetTrait('ghoul').GetName(GetNullCharacter)] thuộc $eyesofmalakai$ [faith|E] để yêu cầu sự trợ giúp từ Nữ Chủ Nhân của bạn trong việc hoàn thành nhiệm vụ của bạn\n$BULLET_WITH_TAB$#V $molochite_maintain_the_sleep_decision$#!: Dành cho một [GetTrait('vampire').GetName(GetNullCharacter)] thuộc [house|E] $dynn_moloch$ để khai thác kiến thức khi bạn làm sâu thêm giấc ngủ của Kẻ Ngủ Say\n$BULLET_WITH_TAB$#V $nergalite_wake_the_sleeper_decision$#!: Dành cho một [GetTrait('witch').GetName(GetNullCharacter)] hoặc một [GetTrait('vampire').GetName(GetNullCharacter)] [GetTrait('witch').GetName(GetNullCharacter)] hoặc cho một [GetTrait('vampire').GetName(GetNullCharacter)] thuộc [house|E] $dynn_nergal$ hoặc $dynn_angellisater$. Có phần thưởng cho việc giúp đỡ những sinh vật như vậy.\n$BULLET_WITH_TAB$#V $vamp_lower_gen_jerusalem_decision$#!: Dành cho một [GetTrait('vampire').GetName(GetNullCharacter)] không có quyết định độc đáo để hạ thấp [Glossary('Generation','game_concept_vampgeneration_desc')] của bạn, nhưng hãy coi chừng cái giá phải trả\n$BULLET_WITH_TAB$#V $mummies_tap_web_faith_decision$#!: Dành cho một [GetTrait('shemsuheru').GetName(GetNullCharacter)], [GetTrait('cabiri').GetName(GetNullCharacter)], hoặc [GetTrait('banemummy').GetName(GetNullCharacter)] [GetTrait('mummy').GetName(GetNullCharacter)] khi họ khai thác Mạng Lưới Đức Tin để nhận thêm kinh nghiệm Hekau\n$BULLET_WITH_TAB$#V $constantinian_channel_religious_fervor_decision$#!: Dành cho các nhân vật mang huyết thống fae thuộc $special_doctrine_fae_constantinians_hostility_name$ sau khi hoàn thành [decision|E] Constantinian Catechism khi họ sử dụng cơn cuồng loạn địa phương trong hành trình tìm kiếm quyền lực của mình"

 game_concept_POD_homeland: "Quê Hương"
 game_concept_POD_homeland_desc: "Một #bold Quê Hương#! là một [region|E] mà một số $POD_splat_mummy_plural$ nhất định bắt nguồn từ đó, gợi nhớ họ về thời xưa cũ.\n\nMỗi năm, $POD_splat_mummy_plural$ nhận #P +1#! [trait_level_track_xp|E] Ký Ức nếu họ đang ở quê hương của mình.\n\nQuê Hương:\n$BULLET_WITH_TAB$[GetTrait('shemsuheru').GetName(GetPlayer)] - [GetGeographicalRegion('pod_lands_of_faith').GetName]\n$BULLET_WITH_TAB$[GetTrait('cabiri').GetName(GetPlayer)] - [GetGeographicalRegion('POD_region_greece').GetName]\n$BULLET_WITH_TAB$[GetTrait('wutian').GetName(GetPlayer)] - Trung Nguyên ([GetGeographicalRegion('world_asia').GetName])\n\nCác Xác Ướp khác không có quê hương, và không nhận được lợi ích nào từ điều đó."

 game_concept_POD_tomb_raid: "Cướp Lăng Mộ"
 game_concept_POD_tomb_raids: "Cướp Lăng Mộ"
 game_concept_POD_tomb_raid_desc: "#bold Cướp Lăng Mộ#! là các sự kiện thỉnh thoảng xảy ra trong đó [domicile|E] của bạn bị những nhà thám hiểm tham lam tấn công.\n\nBạn có thể cố gắng cứu lăng mộ của mình thông qua một bài kiểm tra [skill|E] hoặc bằng cách tiêu [gold|E], [prestige|E] và [piety|E]. Nếu thất bại, một công trình ngẫu nhiên trong lăng mộ của bạn sẽ bị hạ cấp và bạn sẽ mất [trait_level_track_xp|E] Ký Ức cùng với việc nhận [stress|E]."

 game_concept_POD_health_track: "Chỉ Số Sức Khỏe"
 game_concept_POD_damage: "Tổn hại"
 game_concept_POD_health_track_desc: "#bold Thanh Máu#! là khái niệm được lấy trực tiếp từ bản game bàn, nơi [health|E] của bạn được thể hiện bằng một số ô nhất định. Mỗi lần bị thương, bạn đánh dấu một trong các ô đó.\n\nCác ô của thanh máu được hiển thị trong chú giải của các [traits|E] thương tích như [GetTrait('wounded_1').GetName(GetNullCharacter)], và được đánh dấu như sau:\n\n$TAB$$POD_damage_box$ [POD_superficial_damage|E]\n$TAB$$POD_aggravated_damage_box$ [POD_aggravated_damage|E]\n$TAB$$POD_undamaged_box$ Chưa bị thương\n\nTổng chiều dài thanh máu của bạn phụ thuộc vào [splat|E] của bạn.\n\nKhi bị thương nặng hơn, bạn trở nên #bold Suy Nhược#!, dẫn đến các hình phạt ngày càng nặng đối với [skills|E] của bạn. Mức độ suy nhược phụ thuộc vào số ô đã bị lấp đầy (bất kể loại tổn hại nào).\n\nNếu tất cả các ô của thanh máu đều bị lấp đầy, với một nửa trở lên là [POD_aggravated_damage|E], bạn #N sẽ chết#!. Các nhân vật bất tử sẽ rơi vào $pod_torpor$ thay vì chết."

 game_concept_POD_superficial_damage: "Tổn Hại Bề Mặt"
# This has a space in front of the icon since the icon is pretty big otherwise
 game_concept_POD_superficial_damage_with_box: " @health_track_damage_icon! Tổn Hại Bề Mặt"
 game_concept_POD_superficial_damage_desc: "#bold Tổn Hại Bề Mặt#! là một trong các loại tổn hại được đánh dấu trên [POD_health_track|E] của bạn. Nó hiển thị bằng biểu tượng @health_track_damage_icon!.\n\nHầu hết các [splats|E] sẽ tự nhiên hồi phục #V 1#! tổn hại bề mặt mỗi #V 2 năm#!. Một số đặc điểm và perk nhất định có thể tăng lượng hồi phục, hoặc giảm thời gian hồi. $POD_splat_vampire_plural$ phải dùng [character_interaction|E] #V Hồi Máu#!.\n\nNếu [POD_health_track|E] của bạn đã đầy mà bạn tiếp tục chịu tổn hại bề mặt, nó sẽ chuyển thành [POD_aggravated_damage|E] thay vào đó.\n\nTổn hại bề mặt cũng có thể được [soaked|E] bằng một số khả năng nhất định, cho bạn một tỷ lệ phần trăm cơ hội tránh toàn bộ vết thương sắp tới."

 game_concept_POD_aggravated_damage: "Tổn Hại Trầm Trọng"
# This has a space in front of the icon since the icon is pretty big otherwise
 game_concept_POD_aggravated_damage_with_box: " @health_track_aggravated_damage_icon! Tổn Hại Trầm Trọng"
 game_concept_POD_aggravated_damage_desc: "#bold Tổn Hại Trầm Trọng#! là một trong các loại tổn hại được đánh dấu trên [POD_health_track|E] của bạn. Nó hiển thị bằng biểu tượng @health_track_aggravated_damage_icon!.\n\nTổn Hại Trầm Trọng khó hồi phục hơn nhiều so với [POD_superficial_damage|E]. Hầu hết các splat sẽ tự nhiên \"hạ cấp\" một ô tổn hại trầm trọng thành [POD_superficial_damage|E] mỗi #V 4 năm#!.\n\nNếu tất cả các ô của thanh máu đều bị lấp đầy, với một nửa trở lên là [POD_aggravated_damage|E], bạn #N sẽ chết#!. Các nhân vật bất tử sẽ rơi vào $pod_torpor$ thay vì chết."

 game_concept_soak_damage: "Hấp Thụ"
 game_concept_soaked: "Đã Hấp Thụ"
 game_concept_soaking: "Đang Hấp Thụ"
 game_concept_soak_chance: "Cơ Hội Hấp Thụ"
 game_concept_soak_damage_desc: "Một số năng lực và [perks|E] có thể cho bạn cơ hội hấp thụ [POD_superficial_damage|E] sắp tới, nghĩa là tổn hại đó sẽ không được áp dụng.\n\nMặc một [artifact|E] giáp là cách dễ nhất để có cơ hội hấp thụ, với mỗi cấp [rarity|E] của bộ giáp cộng thêm #V 10%#!."

 game_concept_fetish: "Fetish"
 game_concept_fetishes: "Fetish"
 game_concept_fetish_artifact_icon: "@gnosis_icon!"
 game_concept_fetish_artifact_wyrm_icon: "@wyrm_icon!"
 game_concept_fetish_desc: "Fetish là một [artifact|E] đã được truyền linh hồn ràng buộc vào bên trong. Mọi $glossary_fera$ đều có thể tự nhiên sử dụng chúng, các [splats|E] khác sẽ cần perk hoặc modifier đặc biệt.\n\nKhác với artifact thông thường, Fetish cần được bảo trì để duy trì hoạt động:\n$BULLET_WITH_TAB$$glossary_fera$: 5% $POD_terrain_gnosis_regen_supply_limit_mult$ mỗi loại.\n$BULLET_WITH_TAB$Những kẻ khác: Một [spirit_companion|E] mỗi loại.\nNếu bạn không thể duy trì chúng, tất cả các artifact fetish sẽ bị vô hiệu hóa.\n\nCó khả năng trang bị fetish sẽ tự động mở khóa nút [fetish_smithing|E] trong [crafting_forging|E]."

 game_concept_fetish_smithing: "Rèn Fetish"
 game_concept_fetish_smithing_desc: "Hành động ràng buộc một [GetTrait('spirit').GetName(GetNullCharacter)] vào một [artifact|E]. Nút này sẽ ràng buộc một [spirit_companion|E] hoặc một Linh Hồn bị giam cầm vào một artifact và biến nó thành một [fetish|E].\n\nHiệu ứng của nút này phụ thuộc vào của Linh Hồn bị ràng buộc:\n$BULLET_WITH_TAB$[spirit_language|E]\n$BULLET_WITH_TAB$[education_trait|E]\n$BULLET_WITH_TAB$[physical_traits|E]\n$BULLET_WITH_TAB$[trait_level_track_xp|E]\n$BULLET_WITH_TAB$Các perk hoặc modifier liên quan của thợ rèn"

 game_concept_spirit_companion: "Linh Hồn Đồng Hành"
 game_concept_spirit_companions: "Linh Hồn Đồng Hành"
 game_concept_companion: "Đồng Hành"
 game_concept_spirit_pact: "Khế Ước Linh Hồn"
 game_concept_spirit_pacts: "Khế Ước Linh Hồn"
 game_concept_spirit_companion_desc: "Linh Hồn Đồng Hành là một quan hệ đặc biệt có thể được thiết lập với một [GetTrait('spirit').GetName(GetNullCharacter)] tự nguyện thông qua [character_interaction|E]. Linh Hồn sẽ gia nhập triều đình của bạn và mang lại nhiều lợi ích:\n$BULLET_WITH_TAB$Trao một modifier Khế Ước độc nhất tùy theo loại của chúng\n$BULLET_WITH_TAB$Tăng $POD_terrain_gnosis_regen_supply_limit_mult$\n$BULLET_WITH_TAB$Tăng tốc độ [journey|E] Truy Tìm Linh Hồn\n$BULLET_WITH_TAB$Được dùng trong [fetish_smithing|E]\n\nLinh Hồn Đồng Hành chỉ nhận được [trait_level_track_xp|E] thông qua [Concept('character_interaction','Character Interactions')|E] nhắm vào chúng."

 game_concept_spirit_language: "Ngôn Ngữ Linh Hồn"
 game_concept_ancestral_tongue: "Cổ Ngữ Tổ Tiên"
 game_concept_spirit_language_desc: "Trước khi có thể tương tác với một [GetTrait('spirit').GetName(GetNullCharacter)], bạn phải học ngôn ngữ của nó trước, điều này có thể thực hiện qua [character_interaction|E].\n\nNgôn ngữ của các [ancestor_spirits|E] (chẳng hạn như Cổ Ngữ Nguyên Thủy) là bẩm sinh đối với $glossary_fera$ và không thể học được bởi người khác qua các phương thức thông thường."

 game_concept_ancestor_spirit: "Linh Hồn Tổ Tiên"
 game_concept_ancestor_spirits: "Linh Hồn Tổ Tiên"
 game_concept_ancestor_spirit_desc: "$glossary_fera$ có cơ hội trở thành một [GetTrait('spirit').GetName(GetNullCharacter)] Tổ Tiên khi chết. Các Linh Hồn này chỉ có thể giao tiếp bằng [ancestral_tongue|E] của giống Fera của mình và thường không thể tăng Cấp Linh Hồn của chúng.\n\nCơ hội biến thành Linh Hồn chủ yếu phụ thuộc vào Cấp ([trait_level_track_xp|E]) và [piety_level|E] của $glossary_fera$. Các nhân vật [lowborn|E] không thể trở thành Linh Hồn."

 game_concept_innocent: "Kẻ Vô Tội"
 game_concept_innocents: "Những Kẻ Vô Tội"
 game_concept_tormentor: "Kẻ Hành Hạ"
 game_concept_tormentors: "Những Kẻ Hành Hạ"
 game_concept_innocent_desc: "Nhiều [GetTrait('mokole').GetName(GetNullCharacter)] không kiềm chế được cảm xúc khi gặp phải những ký ức đen tối trong Mnesis của họ, và Những Kẻ Vô Tội chính là kết quả. Những cảm xúc tiêu cực này kết tụ thành một [GetTrait('spirit').GetName(GetNullCharacter)] độc ác, tìm cách hủy diệt cả kẻ tạo ra nó lẫn mọi Mokolé khác.\n\nKẻ Vô Tội có thể gặp ở những nơi các linh hồn khác xuất hiện và cũng có thể được triệu hồi bình thường.\nTuy nhiên, Mokolé phải hết sức cẩn thận. Khi một Mokolé đang trú tại [umbra|E], có khả năng họ sẽ bị những Kẻ Vô Tội này tấn công. [umbra_sense|E] có thể giảm khả năng bị tấn công, tuy nhiên các cuộc tấn công này xảy ra thường xuyên hơn tại [UmbraGlossary('spirit_wilds')]. Một số cuộc tấn công đặc biệt chết chóc và Kẻ Vô Tội có thể trở nên ám ảnh với Mokolé cụ thể đó. Nếu điều này xảy ra, Kẻ Vô Tội sẽ bám lấy mục tiêu của nó và trở thành Kẻ Hành Hạ của nó.\n\nKẻ Vô Tội trở thành Kẻ Hành Hạ là một quan hệ đặc biệt sẽ liên tục hành hạ nạn nhân của nó theo nhiều cách. Cách duy nhất để thoát khỏi là trục xuất chúng bằng [character_interaction|E]."

 game_concept_diabolism: "Quỷ Thuật"
 game_concept_diabolist: "Quỷ Thuật Sư"
 game_concept_diabolism_bind: "Ràng Buộc"
 game_concept_diabolism_binding: "Đang Ràng Buộc"
 game_concept_diabolism_bound: "Đã Ràng Buộc"
 game_concept_diabolism_desc: "#bold Quỷ Thuật#! là một trong hai cách để nhận [investiture_lifestyle|E] (cách còn lại là [thralldom|E]). Không chấp nhận làm nô lệ cho $POD_splat_demon_plural$, kẻ theo Địa Ngục Học dùng một nghi thức ràng buộc để đảo ngược động lực này và nô dịch hóa Quỷ thay vào đó, cưỡng đoạt sức mạnh của chúng bằng vũ lực.\n\nRàng buộc Quỷ đòi hỏi kiến thức về [GetTrait('demonology').GetName(GetNullCharacter)], có thể học được qua [journey|E]. [trait_level_track_xp|E] trong Địa Ngục Học được nhận thụ động mỗi năm. Trước khi có thể thử ràng buộc, bạn cũng phải học được [Glossary('Chân Danh','podgloss.truename')] của Quỷ. Cuối cùng, bạn cần một [artifact|E] đủ mạnh để giam giữ Quỷ. Tất cả những điều này khiến Quỷ Thuật trở thành một quá trình chậm chạp.\n\nMột khi bạn thành công trong việc ràng buộc, bạn nhận được điểm [perk|E] [investiture_lifestyle|E] dựa trên tổng [skills|E] của Quỷ.\n\nNếu artifact đó đổi chủ hoặc bị phá hủy, Quỷ #N sẽ thoát khỏi ràng buộc#!, trở thành [rival|E] của bạn, và bắt đầu thực hiện các hành vi [demonic_sabotage|E]. Bạn cũng mất [perks|E] [investiture_lifestyle|E] của chúng."

 game_concept_demonic_sabotage: "Phá Hoại"
 game_concept_demonic_sabotage_desc: "$POD_splat_demon_plural$ căm ghét việc bị một [diabolist|E] xiềng xích, và sẽ bắt đầu thực hiện hành vi phá hoại nếu:\n$EFFECT_LIST_BULLET$Bạn thất bại trong việc ràng buộc chúng nhiều lần liên tiếp (cho đến khi chúng trở thành [rival|E] của bạn)\n$EFFECT_LIST_BULLET$Artifact chúng bị ràng buộc trong đó đổi chủ hoặc bị phá hủy, làm phá vỡ sự ràng buộc\n\nHành vi Phá Hoại sẽ được thực hiện mỗi năm. Nếu thành công, Quỷ có thể gây ra một [modifier|E] tiêu cực, gây một ít [POD_superficial_damage|E], trực tiếp lấy đi một ít [prestige|E] hoặc [gold|E], hoặc thậm chí giết một [courtier|E] ngẫu nhiên.\n\nHành vi Phá Hoại sẽ dừng lại nếu Quỷ bị [Concept('POD_banish','Trục Xuất')|E], [diabolism_bound|E], không còn là [rival|E] của bạn, hoặc nếu sự căm ghét của chúng phai nhạt (điều này mất rất nhiều thời gian)."

 game_concept_thralldom: "Nô Dịch"
 game_concept_thralldom_desc: "#bold Nô Dịch#! là một trong hai cách để nhận [investiture_lifestyle|E] (cách còn lại là [diabolism|E]). Kẻ theo Địa Ngục Học soạn thảo một [demonic_pact|E] với một $POD_splat_demon$, bán linh hồn mình để đổi lấy sức mạnh. Điều này chỉ đòi hỏi kiến thức sơ cấp về [GetTrait('demonology').GetName(GetNullCharacter)], có thể học được qua [journey|E]. Các nhân vật đã là #TOOLTIP:GAME_TRAIT,witch,[GetNullCharacter] #L Kẻ theo Địa Ngục Học#!#! hoặc theo một [faith|E] thờ quỷ có thể làm điều này ngay lập tức.\n\nKhông có giới hạn về số lượng [demonic_pacts|E] bạn có thể ký, khiến đây là cách dễ dàng để có được nhiều sức mạnh trong thời gian ngắn. Ngoại trừ, tất nhiên, việc bạn phải giữ đúng các điều khoản của hợp đồng.\n\nKý một Khế Ước cũng cho Quỷ một [strong_hook|E] lên bạn và cải đạo bạn sang [faith|E] của chúng.\n\nỞ những bookmark mà Quỷ không tồn tại trên bản đồ với tư cách là [splat|E] chơi được, bạn có thể dùng [GetTrait('demonology').GetName(GetNullCharacter)] để thực hiện một [demonic_summoning|E]."

 game_concept_demonic_pact: "Khế Ước"
 game_concept_demonic_pact_obligation: "Nghĩa Vụ"
 game_concept_demonic_pact_frequency: "Tần Suất"
 game_concept_demonic_pact_the_fine_print: "Điều Khoản Nhỏ"
 game_concept_demonic_pacts: "Khế Ước"
 game_concept_demonic_pact_desc: "#bold Khế Ước#! là các điều khoản và điều kiện của [thralldom|E]. Bạn ký Khế Ước với $POD_splat_demon_plural$ thông qua [character_interaction|E].\n\nMỗi Khế Ước có ba điều khoản:\n$BULLET_WITH_TAB$#bold Nghĩa Vụ#! - Một hành động cụ thể mà nô lệ #italic phải#! làm, hoặc #italic không được#! làm.\n$BULLET_WITH_TAB$#bold Tần Suất#! - Một hạn chót định kỳ được đặt ra cho nô lệ để hoàn thành #bold Nghĩa Vụ#!, dao động từ mỗi #V 20#! năm đến mỗi #V 4#! năm.\n$BULLET_WITH_TAB$#bold Điều Khoản Nhỏ#! - Một hình phạt hoặc sự trừng phạt nếu bạn không thể hoặc không hoàn thành #bold Nghĩa Vụ#! trong #bold Tần Suất#! đã cho.\n\nMỗi điều khoản có một giá trị. Khi ký khế ước, bạn nhận được điểm [perk|E] [investiture_lifestyle|E] bằng tổng giá trị của khế ước. Khoản thanh toán này chỉ xảy ra #bold một lần#! cho mỗi Khế Ước.\n\nMột khi đã ký, Khế Ước sẽ #X khắc ghi vào linh hồn bạn, mãi mãi#!. Ngay cả khi $POD_splat_demon$ sau đó bị ràng buộc, trục xuất, hoặc bị giết, Khế Ước của chúng vẫn còn hiệu lực."

 game_concept_demonic_summoning: "Triệu Hồi Quỷ"
 game_concept_demonic_summoning_desc: "Một [character_interaction|E] được mở khóa ở #V 5#! [trait_level_track_xp|E] trong [GetTrait('demonology').GetName(GetNullCharacter)].\n\nNgười triệu hồi hiến tế một số [prisoners|E] để có cơ hội triệu hồi một $POD_splat_demon$ từ [UmbraGlossary('abyss')]. Quỷ sẽ gia nhập triều đình của bạn và có thể thân thiện hoặc không. Sau đó bạn có thể trở thành [Concept('thralldom','Nô Lệ')|E] của chúng bằng cách ký một [demonic_pact|E] với chúng, hoặc cố gắng [diabolism_bind|E] chúng.\n\nBạn có thể nhắm vào bản thân để triệu hồi một Quỷ ngẫu nhiên, hoặc nhắm vào một nhân vật $POD_splat_demon$ có [GetModifier('trapped_in_abyss_modifier').GetNameWithTooltip] để triệu hồi cụ thể chúng."

 game_concept_POD_banish: "Trục Xuất"
 game_concept_POD_banish_desc: "Một [character_interaction|E] được mở khóa qua nhiều cách khác nhau, như [GetTrait('demonology').GetName(GetNullCharacter)] hoặc #TOOLTIP:GAME_TRAIT,theurgist,[GetNullCharacter] #L Thần Thuật#!#!. Nó cho phép người dùng trục xuất một số [splats|E] ngoại giới nhất định về quê hương của chúng tại [umbra|E], việc này tước bỏ mọi [titles|E] của chúng và vô hiệu hóa chúng hiệu quả. Thông thường, điều này đòi hỏi phải học [Glossary('Chân Danh','podgloss.truename')] của chúng trước, nhưng một số khả năng bỏ qua yêu cầu đó.\n\nCác splat sau có thể bị trục xuất:\n$BULLET_WITH_TAB$#bold $POD_splat_demon_plural$#! có thể bị trục xuất về [UmbraGlossary('abyss')]\n$BULLET_WITH_TAB$#bold $POD_splat_fae_plural$#! có thể bị trục xuất về [UmbraGlossary('arcadia')]\n$BULLET_WITH_TAB$#bold $POD_splat_wraith_plural$#! có thể bị trục xuất về [Glossary('Vương Quốc Bóng Tối','game_concept_dark_kingdom_desc')] quê hương của chúng"

 game_concept_weaken_demon: "Làm Suy Yếu Quỷ"
 game_concept_weaken_demon_desc: "Một [character_interaction|E] được mở khóa ở #V 50#! [trait_level_track_xp|E] trong [GetTrait('demonology').GetName(GetNullCharacter)].\n\nNhà Địa Ngục Học nhắc lại những hình phạt Chúa đã giáng xuống đội quân sa ngã và khơi dậy những ký ức đau thương đó lên một $POD_splat_demon$ không đề phòng. Điều này làm giảm [skills|E] của Quỷ trong năm năm. Vì [journey|E] [Glossary('Chân Danh','podgloss.truename')] nhanh hơn trên các mục tiêu có kỹ năng thấp, điều này có thể giúp việc [diabolism_bind|E] Quỷ dễ dàng hơn.\n\nỞ #V 50#! [trait_level_track_xp|E], tương tác này gây ra [GetModifier('POD_weaken_demon_modifier').GetNameWithTooltip]. Ở #V 75#! [trait_level_track_xp|E], nó được cải thiện thành [GetModifier('POD_massively_weaken_demon_modifier').GetNameWithTooltip]."

 game_concept_ghoul_vitae_dependency: "Lệ Thuộc Vitae"
 game_concept_ghoul_vitae_dependency_desc: "Mỗi [EmptyScope.ScriptValue('POD_years_to_lose_vitae_passively_base')|V0] năm, [ghouls|E] người chơi thụ động #N nhận#! #bold;V 1#! [hunger_with_icon|E]. Ghoul rất già nhận cơn đói chậm hơn.\n\n[masterless_ghouls|E] khi đạt đến #TOOLTIP:STATIC_MODIFIER,bloodhunger5_modifier #N;L Cơn Đói Máu 5#!#! sẽ #N không còn là Ghoul nữa, quay trở lại thành [GetTrait('mortal').GetName(GetNullCharacter)] và mất toàn bộ [Glossary('Dị Năng','game_concept_discipline_desc')] của mình.#!\n\n[bound_ghouls|E] có thể duy trì ở mức đói tối đa vô thời hạn, vì [Glossary('Domitor','game_concept_domitor_desc')] của họ giữ cho họ sống sót.#!"

 game_concept_ghoul_discipline_limit: "Giới Hạn Dị Năng"
 game_concept_ghoul_greatest_vitae_ingested: "Vitae Cao Cấp Nhất Đã Hấp Thụ"
 game_concept_ghoul_discipline_limit_desc: "Cả [ghouls|E] lẫn [Glossary('Revenant','game_concept_revenant_desc')] đều có những giới hạn nhất định đối với [Glossary('Dị Năng','game_concept_discipline_desc')] ngoài việc hoàn toàn không thể nhận [elder_perks|E].\n\n[Glossary('Dị Năng','game_concept_discipline_desc')] dành cho [ghouls|E] bị giới hạn ở một cấp nhất định dựa trên $pod_vitae$ mà họ đã hấp thụ trong đời. Họ càng hấp thụ từ thế hệ thấp hơn, họ càng có thể đạt [perks|E] cấp cao hơn:$game_concept_ghoul_discipline_limit_levels_generation$\nĐiều quan trọng là [Glossary('Thế Hệ','game_concept_vampgeneration_desc')] #V thấp nhất#! mà họ đã hấp thụ, không phải gần đây nhất.\n\n[Glossary('Revenant','game_concept_revenant_desc')] đơn giản hơn, họ không thể nhận [traits|E] Dị Năng Cao Cấp [Glossary('Dị Năng','game_concept_discipline_desc')] mà không trở thành một [ghoul|E] và tuân theo quy tắc của họ để đạt được nó. Nói đơn giản hơn, họ sẽ luôn có thể nhận [perks|E] cấp 1-[EmptyScope.ScriptValue('POD_discipline_limit_for_revenant')] bất kể điều gì khác.\n\nDo bản chất của [GetTrait('bloodsorcery').GetName(GetNullCharacter)] và [GetTrait('necromancy').GetName(GetNullCharacter)], cả hai đều được miễn trừ khỏi Giới Hạn Dị Năng."
 game_concept_ghoul_discipline_limit_levels_generation: "\n$BULLET_WITH_TAB$Thế hệ 9+ [Glossary('Generation','game_concept_vampgeneration_desc')]: cấp 1\n$BULLET_WITH_TAB$Thế hệ 8 [Glossary('Generation','game_concept_vampgeneration_desc')]: cấp 2\n$BULLET_WITH_TAB$Thế hệ 7 [Glossary('Generation','game_concept_vampgeneration_desc')]: cấp 3\n$BULLET_WITH_TAB$Thế hệ 6 [Glossary('Generation','game_concept_vampgeneration_desc')]: cấp 4\n$BULLET_WITH_TAB$Thế hệ 5 [Glossary('Generation','game_concept_vampgeneration_desc')]: cấp 5\n$BULLET_WITH_TAB$Thế hệ 4 [Glossary('Generation','game_concept_vampgeneration_desc')]: [trait|E] Cao Cấp"

 game_concept_bound_ghoul: "Ghoul Bị Ràng Buộc"
 game_concept_bound_ghouls: "Ghoul Bị Ràng Buộc"
 game_concept_bound_ghoul_desc: "#help Phần lớn ghoul đều bị ràng buộc với một ma cà rồng, domitor của chúng. Vị ma cà rồng này cung cấp máu cho chúng, nhanh chóng biến điều đó thành một cơn nghiện trầm trọng khiến ghoul làm bất cứ điều gì để làm hài lòng chủ nhân và nhận thêm máu.#!\n\nTrong [princes_of_darkness|E], bất kỳ [ghoul|E] nào có [Glossary('Domitor','game_concept_domitor_desc')] đều được coi là #bold Ghoul Bị Ràng Buộc#!.\n\nGhoul Bị Ràng Buộc phải hoàn thành [bound_ghoul_missions_with_icon|E] cho [Glossary('Domitor','game_concept_domitor_desc')] của họ theo định kỳ, người này sẽ thỏa mãn [hunger_with_icon|E] của họ như phần thưởng. Khác với [masterless_ghouls|E], Ghoul Bị Ràng Buộc không gặp hậu quả gì khi đạt cơn đói tối đa. Tuy nhiên, nếu quan điểm của Domitor của họ giảm xuống dưới #N -25#!, họ sẽ bị giết vào lần thất bại nhiệm vụ tiếp theo.\n\nGhoul Bị Ràng Buộc có thể trở thành [masterless_ghouls|E] bằng cách [bound_ghoul_breaking_blood_bond|E]."

 game_concept_bound_ghoul_mission: "Nhiệm Vụ"
 game_concept_bound_ghoul_missions: "Nhiệm Vụ"
 game_concept_bound_ghoul_mission_with_icon: "@ghoul_icon!Nhiệm Vụ"
 game_concept_bound_ghoul_missions_with_icon: "@ghoul_icon!Nhiệm Vụ"
 game_concept_bound_ghoul_mission_desc: "Nhiệm Vụ là cách duy nhất để một [bound_ghoul|E] nhận được $pod_vitae$ cho [Glossary('Dị Năng','game_concept_discipline_desc')]. [Glossary('Domitor','game_concept_domitor_desc')] của một [bound_ghoul|E] sẽ giao một nhiệm vụ mới mỗi [EmptyScope.ScriptValue('POD_years_to_gain_new_mission')|V0] năm. Bạn cũng có thể yêu cầu một Nhiệm Vụ mới từ họ bằng [character_interaction|E].\n\nNhiệm Vụ có thể bao gồm hoàn thành một [journey|E], bắt cóc một [character|E] cụ thể hoặc đơn giản là cho đi một số tài nguyên như [gold|E].\n\nSau khi hoàn thành một nhiệm vụ #P thành công#!, một [bound_ghoul|E] sẽ nhận được [EmptyScope.ScriptValue('POD_vitae_gained_from_completed_mission')|V0] $pod_vitae$ để dùng riêng.\n\n#N Thất bại#! một nhiệm vụ sẽ làm giảm quan điểm của Domitor của bạn đối với bạn. Nếu nó giảm xuống dưới #N -25#!, bạn có thể bị vứt bỏ #weak (bị giết)#!."

 game_concept_bound_ghoul_breaking_blood_bond: "Phá Vỡ Ràng Buộc Máu"
 game_concept_bound_ghoul_breaking_blood_bond_desc: "Nếu bạn hoàn thành thành công [journey|E] #V $breaking_the_blond_bond_name$#! mà không gặp phải bất kỳ [mental_breaks|E] nào dọc đường, [strong_hook|E] của [Glossary('Domitor','game_concept_domitor_desc')] của bạn sẽ được thay thế bằng một hook yếu. Điều này cho phép bạn trốn thoát khỏi chủ nhân của mình bằng [character_interaction|E], hoặc để bạn [GetScheme('murder').GetTypeName] họ nếu bạn có ý định đó."

 game_concept_masterless_ghoul: "Ghoul Vô Chủ"
 game_concept_masterless_ghouls: "Ghoul Vô Chủ"
 game_concept_masterless_ghoul_desc: "#help Hiếm hoi và can đảm (hoặc ngu ngốc) là những ghoul không có chủ. Cơn nghiện máu chết người không quan tâm đến tự do và phải được thỏa mãn, buộc những linh hồn tội nghiệp này phải làm việc cho nhiều ma cà rồng để có được máu, hoặc thậm chí nguy hiểm hơn, cố gắng săn lùng chính những chủ nhân cũ của họ.#!\n\nTrong [princes_of_darkness|E], bất kỳ [ghoul|E] nào #bold không#! có [Glossary('Domitor','game_concept_domitor_desc')] đều được coi là #bold Vô Chủ#!.\n\nGhoul Vô Chủ cần liên tục tìm kiếm máu để chống lại [ghoul_vitae_dependency|E] của họ. Nếu họ đạt đến #TOOLTIP:STATIC_MODIFIER,bloodhunger5_modifier #N;L Cơn Đói Máu 5#!#!, họ #N không còn là Ghoul nữa, quay trở lại thành [GetTrait('mortal').GetName(GetNullCharacter)] và mất toàn bộ [Glossary('Dị Năng','game_concept_discipline_desc')] của mình.#!\n\nCó hai cách để tìm $pod_vitae$. Cách đầu tiên là nhắm vào bất kỳ $POD_splat_vampire$ vô lãnh địa nào bằng [journey|E] #V $hunt_target_name$#!. Cách thứ hai là [masterless_ghoul_imprisoned_drinking|E]. Cả hai đều mang rủi ro, vì nạn nhân sẽ cố gắng hết sức để chống trả."

 game_concept_masterless_ghoul_imprisoned_drinking: "Uống Máu Từ Ma Cà Rồng Bị Giam Cầm"
 game_concept_masterless_ghoul_imprisoned_drinking_desc: "[masterless_ghouls|E] có thể tiêu thụ $pod_vitae$ từ $POD_splat_vampire_plural$ bị [imprisoned|E], và mặc dù điều này nghe có vẻ tốt hơn nhiều so với việc săn lùng họ, nó cũng mang rủi ro riêng.\n\nUống máu từ $POD_splat_vampire_plural$ luôn tạo ra một [Glossary('Ràng Buộc Máu','game_concept_bloodbond_desc')] đối với [ghouls|E], nghĩa là nếu ai đó liên tục uống từ cùng một mục tiêu, họ sẽ sớm muộn cũng khuất phục.\n\nKhi uống từ một $POD_splat_vampire$ bị [imprisoned|E], [Glossary('Ràng Buộc Máu','game_concept_bloodbond_desc')] yếu nhất sẽ được tạo ra trong [EmptyScope.ScriptValue('POD_duration_for_soft_cooldown_drinking')|V0] năm, trong thời gian đó bạn sẽ không thể giết họ. #bold Nếu bạn uống từ họ lần nữa trong giai đoạn này#!, bạn sẽ có nguy cơ khiến họ trốn khỏi [prison|E] hoặc tệ hơn, bị giết hoặc trở thành một [bound_ghoul|E].\n\nMỗi $POD_splat_vampire$ có một giới hạn về lượng bạn có thể uống trước khi họ chết, được thể hiện bằng việc họ không có [GetModifier('bloodhunger5_modifier').GetNameWithTooltip]."

 game_concept_pack_totem: "Vật Tổ Bầy"
 game_concept_pack_totem_desc: "Một vật tổ là một linh hồn quyền năng cho mượn sức mạnh của nó cho một nhóm $glossary_fera$ để đổi lấy một dịch vụ hoặc cống phẩm tượng trưng nào đó. Một vật tổ có thể được chọn trong [journey|E] #bold Huấn luyện cùng [coterie|E] của bạn#! khi bạn có một [coterie|E] đầy đủ.\nLựa chọn này là vĩnh viễn và ảnh hưởng đến mọi thành viên của [coterie|E]."

