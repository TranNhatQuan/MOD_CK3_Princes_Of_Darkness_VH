 game_concept_possession: "Bị Chiếm Hữu"
 game_concept_possess: "Chiếm Hữu"
 game_concept_possessed: "Bị Chiếm Hữu"
 game_concept_possession_desc: "Những Kẻ Bị Chiếm Hữu là những người phàm hoặc siêu nhiên đã bị chiếm hữu vĩnh viễn bởi một [GetTrait('spirit').GetName(GetNullCharacter)] quyền năng của Gaia hoặc $glossary_triat$.\n\nTrở thành một [GetTrait('fomori').GetName(GetNullCharacter)] được thực hiện bằng cách yêu cầu một Linh Hồn Bane [spirit_companion|E] chiếm hữu bạn."

 game_concept_wyrm_taint: "Vết Nhơ Wyrm"
 game_concept_wyrm_tainted: "Nhiễm Vết Nhơ Wyrm"
 game_concept_wyrm_taint_desc: "Vết Nhơ Wyrm thể hiện mức độ gần gũi của một $glossary_fera$ theo Gaia với việc sa ngã theo $glossary_wyrm$.\n\nGiá trị này thay đổi hàng năm tùy thuộc vào [traits|E], [perks|E] và các cơ chế liên quan khác của nhân vật. Nhiều hành động cũng có thể trực tiếp làm tăng giá trị này, chẳng hạn như bị tra tấn, hành quyết những kẻ vô tội, giao du với những kẻ phụng sự Wyrm, và tương tự.\n\nLượng Vết Nhơ Wyrm mà một nhân vật có được hiển thị trên thanh bên của họ."

 game_concept_balefire: "Balefire"
 game_concept_balefires: "Balefire"
 game_concept_balefire_desc: "Balefire là một dạng lửa bị nhiễm độc, một ngọn lửa xanh tà ác được nuôi dưỡng bởi sự tha hóa của $glossary_wyrm$. Những ngọn lửa này cực kỳ chết chóc, [POD_aggravated_damage|E] của chúng mất nhiều thời gian hơn để tự nhiên hồi phục và khó hồi phục hơn bằng Hồi Máu của một [GetTrait('vampire').GetName(GetNullCharacter)]."

 game_concept_fleshcraft: "Nhục Thể Thuật"
 game_concept_fleshcrafting: "Nhục Thể Thuật"
 game_concept_fleshcrafted: "Đã Qua Nhục Thể Thuật"
 game_concept_fleshcraft_desc: "Nhục Thể Thuật là một năng lực xâm lấn có thể thay đổi và trong một số trường hợp tái tạo hoàn toàn ngoại hình và khả năng thể chất của một người. Đây là nguyên lý cốt lõi và sức mạnh của $pod_discipline$ [GetTrait('vicissitude').GetName(GetNullCharacter)].\n\nThông qua Nhục Thể Thuật, những điều sau có thể thực hiện được tùy theo perk và khả năng của bạn:\n$BULLET_WITH_TAB$Thay đổi ngoại hình.\n$BULLET_WITH_TAB$Thay đổi tuổi ngoại hình của một người bất tử.\n$BULLET_WITH_TAB$Chỉnh sửa [physical_traits|E]\n$BULLET_WITH_TAB$Chỉnh sửa từng bộ phận cơ thể để thêm các đặc điểm như [GetPerk('fc_head_third_eye_perk').GetName(GetNullCharacter)] hoặc [GetPerk('fc_head_extending_fangs_perk').GetName(GetNullCharacter)]"

 game_concept_kraina: "Kraina"
 game_concept_krainas: "Kraina"
 game_concept_kraina_desc: "Kraina là một tập hợp con của [bs_spells|E] và [bs_rituals|E] độc quyền của #V Thuật Koldun#!.\n\nKhi Koldun nhận thêm [perks|E] trong cây #V Genius Loci#!, Kraina của họ có thêm chức năng.\nCơ hội thành công luôn hoạt động, tuy nhiên các hiệu ứng khác đòi hỏi Koldun phải thi triển #bold từ#! các địa điểm được tăng quyền năng của họ. Vị trí của mục tiêu không quan trọng.\n\nMỗi Kraina có yêu cầu riêng được liệt kê bên dưới:\n$BULLET_WITH_TAB$Transylvania: [region|E] [GetGeographicalRegion('PoD_region_transylvania_kraina').GetName]\n$BULLET_WITH_TAB$Biển Đen: [region|E] [GetGeographicalRegion('PoD_region_black_sea_kraina').GetName]\n$BULLET_WITH_TAB$Białowieża: [region|E] [GetGeographicalRegion('PoD_region_bialowieza_kraina').GetName]\n$BULLET_WITH_TAB$Giếng: Bất kỳ công trình nào sau đây hoặc phiên bản nâng cấp của chúng:\n$TAB$$BULLET_WITH_TAB$[GetBuilding('land_nexus_01').GetName]\n$TAB$$BULLET_WITH_TAB$[GetBuilding('sanctuary_of_flesh_01').GetName]\n$TAB$$BULLET_WITH_TAB$[GetBuilding('cathedral_of_flesh_01').GetName]\n$TAB$$BULLET_WITH_TAB$[GetBuilding('well_of_sacrifice_01').GetName]\n$BULLET_WITH_TAB$Enoch: [development|E] #V 40#! trở lên"
 PoD_region_transylvania_kraina: "Kraina Transylvania"
 PoD_region_black_sea_kraina: "Kraina Biển Đen"
 PoD_region_bialowieza_kraina: "Kraina Białowieża"