 ghouls: "Bộc Huyết Tuyển Chọn"
 ghouls_flavor: "#F Những kẻ nô bộc thề nguyền huyết mạch của ma cà rồng, Bộc huyết được ban cho sức mạnh và độ bền vượt trội. Cùng với sự bất tử của mình (dù phụ thuộc vào máu ma cà rồng), họ trở thành những chiến binh thiện chiến.#!"
 
 szlachta: "Szlachta"
 szlachta_flavor: "#F Những Bộc huyết bị Vicissitude tạo hình lại thân xác để tăng cường sức chiến đấu. Dù quá trình này khiến họ mạnh mẽ hơn, họ cũng bị biến dạng một cách gớm ghiếc.#!"
 
 vozhd: "Vozhd"
 vozhd_flavor: "#F Khoảng chục Bộc huyết đã bị cắt bỏ một phần não được hợp nhất qua thuật Koldunic và Vicissitude, tạo ra một vũ khí sinh học biết đi cao 15 bộ. Một mớ hỗn độn các sinh vật sống bị nung chảy hòa làm một, thành một quái vật đa chi to bằng con voi.#!"

 zmei: "Zmei"
 zmei_flavor: "#F Những sinh vật đáng sợ với sức mạnh khôn lường, từng là bề tôi của $glossary_wyrm$, nay bị trói buộc với Baba Yaga, Bà Ngoại Bé Nhỏ.#!"
 
 massvampires: "Ma Cà Rồng Trao Truyền Hàng Loạt"
 massvampires_flavor: "#R Quy mô Tối đa = 3 #! \n #F Một bầy ma cà rồng non do một cuộc $pod_Embrace$ hàng loạt tạo ra. Máu đã khiến họ mạnh hơn người phàm, nhưng họ vẫn còn mới mẻ với năng lực của mình.#!"
 

 
 witchhunters: "Thợ Săn Phù Thủy"
 witchhunters_flavor: "#F Những kẻ phàm chuyên săn lùng quái vật.#!"
 
 wolves_flavor: "#F Ít âm thanh nào trong tự nhiên rợn người hơn tiếng tru của sói. Không hiểu sao nó bao trùm mọi nỗi sợ hãi của loài người trước hoang dã, cũng như mọi khát khao mà chúng ta hằng ao ước.#!"
 
 bats: "Dơi"
 bats_flavor: "#F Kỳ dị và đáng sợ, dơi trải qua ban ngày ngủ treo ngược mình trên cây và trong hang, còn ban đêm thì bay lượn tìm kiếm thức ăn là côn trùng, trái cây và đôi khi cả máu người.#!"

 gargoyle_warriors: "Gargoyle Chiến Binh"
 gargoyle_warriors_flavor: "#F #!"
 
 gargoyle_sentinels: "Gargoyle Lính Canh"
 gargoyle_sentinels_flavor: "#F #!"

 gargoyle_scouts: "Gargoyle Trinh Sát"
 gargoyle_scouts_flavor: "#F #!"

 gargoyle_razorbats: "Dơi Lưỡi Dao"
 gargoyle_razorbats_flavor: "#F #!" 
 
 rats: "Chuột"
 rats_flavor: "#F Chuột tượng trưng cho sự bành trướng đô thị — những đống bẩn thỉu, bệnh tật và bí mật chất chồng do lơ là, nhưng cũng tượng trưng cho sự tinh khôn và sức chịu đựng bền bỉ. Một số Garou cảm thấy có sự đồng cảm với chúng, nhất là những người sói sống ở thành thị, nhưng loài gặm nhấm này đôi khi cũng bị gắn liền với những ma cà rồng hay pháp sư ẩn nấp cùng linh thú của họ. Không thể chối cãi, chuột có mặt ở khắp mọi nơi.#!"
 
 scorpions: "Bọ Cạp"
 scorpions_flavor: "#F Loài nhện này có kích thước dao động từ nhỏ như ngón tay cái đến lớn như bàn tay, và chúng tiêm một nọc độc mạnh mẽ chỉ bằng một cú quật đuôi cong nhanh như chớp.#!"
 
 snakes: "Rắn"
 snakes_flavor: "#F Một kẻ cám dỗ, một kẻ lừa dối, một kẻ mở cửa và đầu độc những linh hồn mất cảnh giác, con rắn cuộn mình, trườn đi và cắn xé lối vào trí tưởng tượng của loài người.#!"
 
 insects: "Côn Trùng"
 insects_flavor: "#F #!"

 maniacs: "Kẻ Điên Loạn"
 maniacs_flavor: "#F #!"
 
 demonic_thralls: "Nô Lệ Ác Quỷ"
 demonic_thralls_flavor: "#F Nô Lệ Ác Quỷ, phụng sự những chủ nhân Baali khủng khiếp của mình #!"
 
 #elite_swordsmen: "Elite Swordsmen"
 #elite_swordsmen_flavor: "#F Most skilled swordsmen, taken from local nobles, and taught how to fight alongside $pod_cainites$ #!"
 
 ghouled_cavalry: "Kỵ Binh Bộc Huyết Hóa"
 ghouled_cavalry_flavor: "#F Những kỵ sĩ Bộc huyết hóa sẵn sàng chiến đấu với bất cứ ai mà chủ nhân của họ muốn tiêu diệt. Thường dùng cả chiến mã Bộc huyết hóa trong trận mạc. #!"
 
 guards_guards: "Vệ Binh Bộc Huyết Hóa"
 guards_guards_flavor: "#F Từng là vệ binh của các quý tộc quan trọng trong vùng, những kẻ phàm này giờ đã được ban máu để phụng sự một chủ nhân vĩ đại hơn (và bí ẩn hơn) thay vào đó. #!"
 
 brigands: "Kẻ Ngoài Vòng Pháp Luật Bộc Huyết Hóa"
 brigands_flavor: "#F Từng đứng ở phía sai trái của luật pháp, những kẻ phàm này đã có một cuộc gặp gỡ làm thay đổi cả cuộc đời với vị lãnh chúa Hậu duệ Cain cai quản lãnh địa của mình. Tuy nhiên điều này không thực sự khiến họ trở thành người tốt hơn, chỉ là thiện nghệ hơn trong việc họ làm.#!"
 
 cultists: "Tín Đồ Tà Giáo"
 cultists_flavor: "#F Những kẻ phàm tận hiến cho quái vật siêu nhiên và các Thần linh phàm tục, bị $pod_cainites$ khống chế.#!"
 
 serpentis_monsters: "Quái Thú Typhon"
 serpentis_monsters_flavor: "#F Những quái thú khủng khiếp được tạo ra bằng $pod_discipline$ Serpentis, sẵn sàng xé xác và cắn nát.#!"
 
 crowds: "Đám Đông Bị Điều Khiển"
 crowds_flavor: "#F Một đám đông kẻ phàm, tin rằng chính nghĩa của ngươi là đúng đắn và sẵn sàng giúp đỡ ngươi.#!"

 musketmen: "Lính Súng Hỏa Mai"
 musketmen_flavor: "#F Sức mạnh đáng sợ của thuốc súng đang bắt đầu được sử dụng rộng rãi, khiến những kẻ phàm ngày càng bớt lép vế trước siêu nhiên.#!"
 
 thinbloods: "Huyết Mỏng"
 thinbloods_flavor: "#F Những ma cà rồng được Trao truyền hàng loạt thuộc thế hệ thứ 14 trở lên.#!"









 the_lost_ancients: "Những Bậc Tiền Bối Đã Mất"
 the_lost_ancients_flavor: "#F Những bóng hình vô định bị vũ trụ lãng quên, được triệu gọi để trợ giúp xác ướp.#!"

 POD_controlled_animals: "Động Vật Bị Điều Khiển"
 POD_controlled_animals_flavor: "#F Ôi trời, nhiều sóc thế này...#!"

 POD_ronin_hatamoto: "Hatamoto Ronin của Daimyo"
 POD_ronin_hatamoto_flavor: "#F Kỵ binh phàm tinh nhuệ, được năng lực của ngươi tăng cường và tận trung với chính nghĩa của ngươi.#!"
 POD_ronin: "Ronin của Daimyo"
 POD_ronin_flavor: "#F Bộ binh hạng nặng phàm cực kỳ thiện chiến, được năng lực của ngươi tăng cường và tận trung với chính nghĩa của ngươi.#!"
 POD_yumihiki: "Yumihiki của Daimyo"
 POD_yumihiki_flavor: "#F Cung thủ phàm cực kỳ thiện xạ, được năng lực của ngươi tăng cường và tận trung với chính nghĩa của ngươi.#!"
 POD_yumihiki_riders: "Kỵ Xạ Yumihiki của Daimyo"
 POD_yumihiki_riders_flavor: "#F Cung kỵ binh phàm cực kỳ thiện xạ, được năng lực của ngươi tăng cường và tận trung với chính nghĩa của ngươi.#!"
 POD_sojutsuka: "Samurai Sōjutsuka của Daimyo"
 POD_sojutsuka_flavor: "#F Thương binh phàm cực kỳ thiện chiến, được năng lực của ngươi tăng cường và tận trung với chính nghĩa của ngươi.#!"
 POD_sojutsuka_riders: "Kỵ Binh Sōjutsuka của Daimyo"
 POD_sojutsuka_riders_flavor: "#F Kỵ binh phàm cực kỳ thiện nghệ cầm thương cưỡi ngựa, được năng lực của ngươi tăng cường và tận trung với chính nghĩa của ngươi.#!"
 POD_teppo_gunners: "Xạ Thủ Teppō của Daimyo" #For all cultures when specific requirements are met
 POD_teppo_gunners_flavor: "#F Những kẻ phàm cực kỳ thiện nghệ sử dụng súng, được năng lực của ngươi tăng cường và tận trung với chính nghĩa của ngươi.#!"

 war_avatar_of_great_fenris: "Chiến Hóa Thân của Đại Fenris"
 war_avatar_of_great_fenris_flavor: "#F Ít có linh hồn nào — trừ chính các Incarna — đáng sợ và nguy hiểm như chiến hóa thân của Đại Fenris. Hóa thân của Sói Fenris hiện ra như một con sói khổng lồ, cao 10 bộ tính đến vai. Đôi mắt nó rực cháy cơn thịnh nộ và hàm răng nhỏ đầy máu của vô số kẻ thù. Bộ lông nó màu xám sẫm, dường như lấp lánh chuyển từ đen sang đỏ và thậm chí sang trắng khi ánh sáng lướt qua. Chiến hóa thân của Fenris không mạnh mẽ bằng chính Incarna, nhưng nó vẫn vượt qua những giới hạn thông thường của các linh hồn, và sở hữu các Đặc điểm còn mạnh hơn cả Nexus Crawler.#!"
 


 
 enochian_guards: "Vệ Binh Đền Thờ Enochian"
 enochian_guards_flavor: "#F Các chiến binh thời xưa lại tề tựu một lần nữa để bảo vệ những chủ nhân bất tử của mình.#!"
 
 maryannu: "Maryannu"
 maryannu_flavor: "#F Tầng lớp quý tộc chiến xa có thể đã bị người phàm lãng quên, nhưng truyền thống đầy kiêu hãnh này vẫn tồn tại nơi những kẻ từng biết đến nó trong kiếp trước.#!"
  
 romani_scouts: "Trinh Sát Romani"
 romani_scouts_flavor: "#F Những kỵ sĩ nhanh nhẹn và bền bỉ, thiện nghệ trong việc tìm ra hướng tiếp cận tốt nhất cho trận chiến.#!"
  

 
 cockatrices: "Cockatrices"
 cockatrices_flavor: "#F Giữa cát bụi dịch chuyển của sa mạc, từng có một con rắn hung ác, hơi thở và ánh mắt của nó đã giết chết biết bao chiến binh.#!"
 drake: "Drake"
 drake_flavor: "#F Drake có thân hình rắn dài, bọc giáp dày đặc, gần như không hề hấn gì trước cung tên và gươm giáo.#!"
 orm: "Orm"
 orm_flavor: "#F Wyrm (hay còn gọi là orm) trú ngụ ở những vùng lạnh giá, hình dạng gần giống một con rắn khổng lồ hoặc con lươn.#!"
 wyverns_flavor: "#F Wyvern là một loài rắn có cánh, cuộn khúc, có phạm vi săn mồi trải dài từ tận miền cực bắc châu Âu cho tới tận Hy Lạp và Ethiopia.#!"
 lindworm: "Lindworm"
 lindworm_flavor: "#F Lindworm khó nắm bắt, kẻ rình rập trên những vùng đất hoang cằn cỗi.#!"
 amphiptere: "Amphiptere"
 amphiptere_flavor: "#F Amphiptere là một loài rắn có cánh nhưng không chân, chỉ di chuyển bằng cách bay.#!"
 sphinx: "Sphinx"
 sphinx_flavor: "#F Một con sphinx, hay mèo-rồng, chẳng khác gì một con hổ hay báo với đôi cánh màng mỏng, nanh khổng lồ, mắt rắn và hơi thở khói mù.#!"
 fu_guardian: "Fu Guardian"
 fu_guardian_flavor: "#F Là kẻ canh giữ trật tự và lễ nghĩa, con rồng nhỏ này mang dáng vẻ lai giữa sư tử, rồng và chó.#!"
 feng_huang: "Feng Huang"
 feng_huang_flavor: "#F Ngọn lửa này thiêu rụi ngọn lửa kia đang cháy, Nỗi đau này vơi bớt nhờ nỗi đau khác.#!"
 ghul: "Ghul"
 ghul_flavor: "#F Những đứa con này của Iblis, Chúa Tể Bóng Tối, đi ra giữa loài người để dụ dỗ và ăn thịt.#!"
 gryphon: "Gryphon"
 gryphon_flavor: "#F Những cổ vật có từ trước cả thời huy hoàng của Ai Cập đã khắc họa gryphon, sinh vật nửa sư tử nửa chim săn mồi, sải cánh bay trên nền trời rạng đông. Đó là linh vật totem truyền thống của bộ tộc Red Talons.#!"
 harpy: "Harpy"
 harpy_flavor: "#F Ban đầu được ghi lại trong truyền thuyết Hy Lạp, harpy là sứ giả báo điềm chết chóc và là kẻ trừng phạt lòng kiêu hãnh.#!"
 hippocampi: "Hippocampi"
 hippocampi_flavor: "#F Những con ngựa chạy dọc bờ hồ và đại dương sẽ hòa cùng các linh hồn biến hóa của sóng nước. Đôi khi, những cuộc rong chơi của chúng lại kết thúc bằng những cuộc mây mưa.#!"
 hippogryph: "Hippogryph"
 hippogryph_flavor: "#F Giống như những truyền thuyết u ám về nguồn gốc của mình, loài ngựa-đại bàng gọi là hippogryph mang một vẻ u sầu và tính khí hung dữ.#!"
 manticore: "Manticore"
 manticore_flavor: "#F Cũng như mỗi loài vật đều có chỗ đứng của mình trong chuỗi thức ăn và vòng đời, manticore là một sự giễu nhại sống động của trật tự ấy.#!"
 pegasus: "Pegasus"
 pegasus_flavor: "#F Hoang dã và tự nhiên như chính những viên đá quý mà đôi cánh của nó lấy màu — lam ngọc, hồng ngọc, lục bảo và tử hoàng ngọc — pegasus là một sinh vật hiếm có và quý giá.#!"
 peryton: "Peryton"
 peryton_flavor: "#F Peryton có sức cuốn hút lạ kỳ đối với một loài vật chết chóc đến vậy. Đầu hươu của nó phủ lớp lông mềm màu đen, nâu hoặc xám.#!"
 phoboros: "Phoboros"
 phoboros_flavor: "#F Phoboros có dáng vẻ như một con bò trắng nhỏ. Nhiều đặc điểm của sinh vật này gắn nó với mặt trăng theo nghĩa biểu tượng, và qua đó với nước của thế gian.#!"
 roc: "Roc"
 roc_flavor: "#F Roc là những loài chim khổng lồ, giống như những con diều hâu trắng chói lọi hoặc vàng lốm đốm.#!"
 seabishop: "Seabishop"
 seabishop_flavor: "#F Loài "giám mục biển" khó nắm bắt là một điều bí ẩn. Được phát hiện khi một con dạt vào bờ, những thực thể này lẩn tránh loài người dưới lòng sóng, né tránh mọi tiếp xúc với thế giới trên mặt nước.#!"
 sea_serpent: "Sea Serpent"
 sea_serpent_flavor: "#F Ám ảnh những vùng sâu nhất của đại dương cùng những biển lớn và vịnh, sea serpent là tai họa của những con tàu viễn dương.#!"
 shadhavar: "Shadhavar"
 shadhavar_flavor: "#F Là một sinh vật giống linh dương, shadhavar lang thang trên những đồng bằng nơi gió thổi tự do.#!"
 simurgh: "Simurgh"
 simurgh_flavor: "#F Nhà tiên tri ở Delphi, ông già trên núi và ba Nữ Thần Số Mệnh trong hang động, tất cả đều là hiện thân của bậc ẩn sĩ toàn tri, kẻ tự tách mình khỏi loài người.#!"
 umkovu: "Umkovu"
 umkovu_flavor: "#F Sa mạc khốn khổ mang lấy hình hài của nó, con chó rừng kiêu hãnh và căng thẳng. Trong lúc tìm kiếm ngươi, ta lần mò qua đêm dài nặng nề nhất.#!"
 unicorn: "Unicorn"
 unicorn_flavor: "#F Từng con một dưới ánh trăng nơi đó, Hí vang xa trên bầu không khí ma quái. Những con kỳ lân tiến xuống biển.#!"
 vodayany: "Vodayany"
 vodayany_flavor: "#F Qua bao thời đại, những sinh vật đã bò ra khỏi mặt nước tĩnh lặng u ám của các hồ nước, để lại dấu vết trên bờ cho người phàm phải suy ngẫm.#!"
 wilde_beast: "Wilde Beast"
 wilde_beast_flavor: "#F Wilde beast kết hợp những kỹ năng săn mồi tuyệt vời nhất của sư tử với tính cách hiền lành, trung thành của một chú chó spaniel.#!"
 
 demonhound: "Demonhound"
 demonhound_flavor: "#F Bị các linh hồn của Vực Sâu chiếm hữu, những con chó săn này gầy guộc và hiểm ác, với đôi mắt độc địa rực lên từ những cái đầu như bộ xương, cùng bọt dãi sôi sục phun ra từ hàm răng bốc lửa.#!"
 imps: "Imps"
 imps_flavor: "#F Là những ác quỷ nhỏ của Vực Sâu, imp là những kẻ bịp bợm mưu mẹo. Dù không ưa đối đầu trực diện, chúng có thể trở nên bất ngờ ngoan cường khi bị dồn vào chân tường.#!"
 lucifergia: "Lucifergia"
 lucifergia_flavor: "#F Những con chó săn của linh hồn là tay sai thi hành lệnh của Quỷ Vương. Khi một khế ước không được thực hiện, những con quỷ này sẽ truy đuổi kẻ vi phạm cho tới tận Thiên Đường nếu cần.#!"
 malebranche: "Malebranche"
 malebranche_flavor: "#F Những kẻ hành hạ của Địa Ngục đã có cả một cõi vĩnh hằng để hoàn thiện nghệ thuật của mình. Không có điểm yếu nào của thân xác và linh hồn con người mà chúng không biết đến.#!"
 war_servitors: "War-Servitors"
 war_servitors_flavor: "#F Là đẳng cấp chiến binh của Vực Thẳm, những thực thể đáng sợ này chỉ khuất phục (thường là miễn cưỡng) trước các Đại Quỷ. Là hiện thân của bạo lực, chúng là một cơn lốc gào thét gồm móng vuốt, hỏa ngục và vũ khí địa ngục.#!"
      
 the_unnamable: "The Unnamable"
 the_unnamable_flavor: "#F Những kẻ Earthbound có thể xé toạc một cánh cổng nhỏ giữa Sáng Thế và các cõi hỗn mang rồi kéo một thứ gì đó xuyên qua — một sinh vật quá quái dị và nguy hiểm để tồn tại trong thực tại này. Những sinh vật được triệu hồi bởi phép chiêu gọi này luôn là những quái vật nguy hiểm với sức mạnh giết chóc khủng khiếp và khát khao hủy diệt.#!"
 
 nervosa: "Nervosa"
 nervosa_flavor: "#F Sinh ra từ sự điên loạn, chúng có thể trông giống người thường, thú vật, hoặc những sinh vật ngoài hành tinh, hay thậm chí chẳng có thân xác nào cả.#!"
 monster_under_the_bed: "The Monster Under the Bed"
 monster_under_the_bed_flavor: "#F Có những thứ như những con rắn tím khổng lồ chờ tay hoặc chân của bạn thò ra khỏi mép nệm để chúng có thể tóm lấy bạn, và có những thứ nhỏ bé chỉ đơn giản ngồi đó nhìn chằm chằm lại bạn (với đôi mắt to, tròn xoe, vàng khè) ngay bên ngoài vùng sáng của đèn pin.#!"
 nocnitsa: "Nocnitsa"
 nocnitsa_flavor: "#F Những quái vật sinh ra từ ác mộng của changeling này thuộc hàng bị sợ hãi nhất trong số các chimera, và thường mang hình dạng trực tiếp hoặc mang tính biểu tượng từ chính những nỗi sợ lớn nhất, suy nhược nhất của kẻ tạo ra chúng.#!"
 sprites: "Sprites"
 sprites_flavor: "#F Sprite sinh ra từ trí tưởng tượng và niềm vui thích. Chúng thường tinh nghịch và tệ lắm thì chỉ là quái ác vặt.#!"
 monsters: "Monsters"
 monsters_flavor: "#F Monster là tên gọi dành cho Animate Chimera không thuộc bất kỳ hạng mục nào khác trong số các sinh vật Chimerical mà Fae biết đến.#!"
 feral_chimera: "Feral Chimera"
 feral_chimera_flavor: "#F Phần lớn feral chimera là đối trọng của [UmbraGlossary('dreaming')] dành cho các loài thú hoang bình thường: thỏ, mèo, sói, ngựa, v.v.#!"
 urban_legends: "Urban Legends"
 urban_legends_flavor: "#F Urban legend gần như đa dạng chẳng kém gì nocnitsa, và có thể khó lường như nervosa. Chúng có thể hiện ra dưới dạng cá sấu trong cống rãnh, những bóng ma quấy nhiễu nhà cửa, hoặc bất cứ thứ gì nằm giữa hai thái cực đó.#!"
 
 sidhe_wild_hunt: "Sidhe Wild Hunt"
 sidhe_wild_hunt_flavor: "#F Là kẻ được chọn của một Lãnh Chúa Freehold, Wild Hunt là những kỵ sĩ giỏi nhất trong số các Changeling, những hiệp sĩ lừng lẫy của Đại Cuộc Săn. Họ nằm trong số những chiến binh tài giỏi nhất mà một Fae có thể tung ra chống lại kẻ thù giờ đã bị định đoạt số phận, và ngay cả các vị thần cổ xưa cũng phải sợ tiếng vó ngựa của họ.#!"
 troll_berserkers: "Troll Berserkers"
 troll_berserkers_flavor: "#F Troll đứng cao hơn người cao nhất tới hai cái đầu, thoạt nhìn chỉ khác biệt ở vóc dáng. Gương mặt chúng thường ưa nhìn, theo cái kiểu góc cạnh, thô mộc của những dân tộc kém văn minh hơn. Chúng để tóc dài, tết thành bím qua mỗi bên tai. Phần tóc phía sau không bao giờ cắt, cứ mọc dài cho tới khi chạm giữa lưng.#!"
 nuckelavee: "Nuckelavee"
 nuckelavee_flavor: "#F Nuckelavee là một sinh vật biển có nửa thân trên là người, nhưng nửa thân dưới giống ngựa. Dù ý tưởng về một nhân mã đi biển có thể khiến vài người thấy nực cười, sinh vật này chẳng hề như vậy. Nuckelavee có khả năng khiến mọi kẻ, trừ những người gan dạ nhất, phải kinh hãi, vì một lý do đơn giản: những sinh vật này không có da. Thay vào đó, chúng là một mớ hỗn độn nội tạng đập phập phồng và máu me chảy giật, và cảnh tượng một sinh vật như vậy trồi lên từ sóng biển hoàn toàn đủ sức khiến bất cứ kẻ xui xẻo nào chứng kiến phải khiếp sợ.#!"
 duergar: "Duergar"
 duergar_flavor: "#F Duergar là những kẻ cư ngụ trên đồi. Chúng cao chừng một hoặc hai bộ, nhưng nếu không thì trông giống đàn ông với bộ râu dài và đôi mắt sắc lẹm. Bất chấp vóc dáng nhỏ bé, Duergar có sức mạnh của người đàn ông khỏe nhất cùng tính khí nóng nảy tương xứng. Chúng cực kỳ hung hãn bảo vệ lãnh thổ, và sẽ tấn công bất cứ ai xâm phạm đất đai của mình. Cách phòng vệ duy nhất trước cơn giận của chúng là cầu xin lòng hiếu khách và dâng một món quà để đổi lấy sự tha thứ.#!"
 skoggra: "Skoggra"
 skoggra_flavor: "#F Skoggra, hay còn gọi là Wood-Wives, thực ra có thể khá thân thiện với con người. Tất cả đều là giống cái và khá xinh đẹp, dù chúng trông có vẻ hoang dã. Phần thân dưới của chúng phủ vỏ cây, cùng với lá và hoa vào mùa xuân. Nhưng gương mặt chúng lại xinh đẹp, với đôi mắt xanh như rêu và mái tóc nâu quấn hoang dại quanh vai.#!"
 ovinniks: "Ovinniks"
 ovinniks_flavor: "#F Thoạt nhìn, Ovinniks có vẻ khá giống Brownies. Chúng sống trong chuồng bò hoặc chuồng ngựa và đặc biệt yêu thích động vật. Trên thực tế, người ta tin rằng chúng có khả năng trò chuyện với động vật bằng chính ngôn ngữ của chúng. Tuy nhiên, sự tương đồng chỉ dừng lại ở đó. Trong khi Brownies nhìn chung hữu ích và chỉ nổi giận khi cảm thấy mình không được trân trọng, Ovinniks lại là những sinh vật ác ý từ trong ra ngoài. Dù chúng sẽ không bao giờ làm hại một con vật, con người lại là con mồi hợp pháp đối với chúng.#!"
 brownies: "Brownies"
 brownies_flavor: "#F Những sinh vật hữu ích này sống trong và quanh các hộ gia đình khắp châu Âu. Chúng chỉ xuất hiện vào ban đêm, thực hiện những việc vặt cần thiết quanh nhà, từ dọn dẹp, cọ rửa cho tới đánh bóng và vá víu. Ngay trước khi bị bắt gặp, chúng biến mất không dấu vết, khiến hầu hết mọi người phải tự hỏi rốt cuộc chiếc ủng ấy đã được sửa lại thế nào hoặc ai đã chất đầy lại thùng củi.#!"
 night_elves: "Night Elves"
 night_elves_flavor: "#F Những yêu tinh bóng tối của xứ Bavaria từ lâu đã gieo rắc kinh hoàng cho các ngôi làng địa phương. Tập tính và nơi cư trú của chúng phần lớn không ai biết rõ. Chỉ có những câu chuyện điên loạn của những kẻ từng phát hiện ra các ngôi làng trên ngọn cây của chúng mới kể lại về chúng. Ít người còn giữ được tâm trí lành lặn sau trải nghiệm ấy, làm giảm độ tin cậy của những câu chuyện này.#!"
 goblins: "Goblins"
 goblins_flavor: "#F Những sinh vật quái ác này sống trong những cánh rừng tối tăm hơn khắp phần lớn châu Âu. Chúng trông như những con búp bê trẻ em dị dạng lớn lên, bị bỏ lại trong đầm lầy than bùn suốt nhiều tháng rồi được hồi sinh, kèm theo một khẩu vị dành cho thịt người.#!"
 malicious_faerie: "Malicious Faerie"
 malicious_faerie_flavor: "#F Những sinh vật hiểm độc này là tai họa của người sống. Chúng chẳng nghĩ ra được điều gì hay hơn là gây chuyện quấy phá, từ những trò đùa vô hại cho tới việc phá hủy cả làng mạc, và luôn sẵn lòng chỉ đường sai cho một lữ khách lạc lối, pha chế một thứ thuốc độc để "chữa lành" nước giếng hay thậm chí dẫn cả một đám goblin tới trại của một thương nhân.#!"
 
 chitterers: "Chitterers"
 chitterers_flavor: "#F Được tạo thành từ phần thân sau của hai con sói với bề mặt trụi lông và một thân hình hồng nhạt phủ đầy hàng tá mỏ chim kêu chíu chít; Chitterers là một trong những tạo vật đáng lo ngại nhất mà Tremere từng hoàn thành.#!"
 reapers: "Reapers"
 reapers_flavor: "#F Reaper, được đặt tên theo hai chi trước to lớn, hình lưỡi liềm, được thiết kế hoàn hảo để chặt đầu, là một con bọ cánh cứng cỡ người với một chuỗi những cái đầu chuột rít gào, tranh giành nhau ở nơi lẽ ra phải là gương mặt của nó.#!"
 skin_eaters: "Skin-Eaters"
 skin_eaters_flavor: "#F Là những côn trùng nhỏ bé giống bọ chét với sự thèm ăn vô độ, Skin-Eater được tạo ra để tuân theo những mệnh lệnh đơn giản và thèm khát da thịt thay vì máu.#!"
    
 crocodiles_flavor: "#F Với thân hình dài và lớp da thô ráp như vỏ cây, cá sấu (alligator, caiman và crocodile) rất dễ bị nhầm là những khúc gỗ mục — một sai lầm chết người.#!"
 bears_flavor: "#F Đứng thẳng như một người đàn ông trên đôi chân mập mạp của mình, gấu cư ngụ ở những nơi lạnh lẽo, hẻo lánh — những vương quốc rừng rậm rạp có nước (và cá) gần đó.#!"
 lions_flavor: "#F Với bộ lông vàng óng và bờm dài, rậm rạp của con đực, sư tử là những sinh vật lộng lẫy.#!"
 tigers: "Tigers"
 tigers_flavor: "#F To lớn, mượt mà và mềm dẻo, những con vật xinh đẹp này di chuyển nhanh nhẹn qua bóng tối của rừng rậm, được ngụy trang bởi bộ lông sọc vằn của mình.#!"
 bulls_flavor: "#F Gia súc đã đóng một vai trò then chốt trong lịch sử văn minh nhân loại, và theo đó, trong cả thần thoại của nhân loại.#!"
 horses: "Horses"
 horses_flavor: "#F Cao lớn và cơ bắp, với chiếc cổ dài cong vút, đôi mắt tinh anh, cùng bờm và đuôi bay phấp phới, những sinh vật này thực sự trông như các nguyên tố hóa thành hình hài sống động.#!"
 camels_flavor: "#F Là con vật thồ hàng của Ả Rập, lạc đà là một sinh vật tính khí xấu, và thường phớt lờ mọi tiếng nói trừ tiếng nói uy quyền mạnh mẽ nhất.#!"
 stags_flavor: "#F Với tứ chi mảnh khảnh, đôi móng guốc nhỏ bé đến khó tin, và đôi mắt to, ướt long lanh, thật dễ hiểu vì sao hươu lại có tiếng là loài vật của cõi tiên.#!"
 goats: "Goats"
 goats_flavor: "#F Thon gọn và lông xù hơn cừu hoang, dê nhanh nhẹn đến kinh ngạc.#!"
 rams: "Rams"
 rams_flavor: "#F Với gương mặt hiền lành và bộ lông xoăn tít, cừu sống ở bất cứ nơi nào chúng có thể gặm cỏ.#!"
 boars_flavor: "#F Lớn hơn (cao ba đến bốn bộ tính từ vai), thô ráp hơn, và hung dữ hơn hẳn lợn nhà, lợn rừng là hiện thân bằng xương bằng thịt của tính khí cáu kỉnh.#!"
 monkeys: "Monkeys"
 monkeys_flavor: "#F Từ những khu rừng rậm của châu Phi và Nam Mỹ cho tới những dãy núi châu Á, loài linh trưởng phủ một cái bóng gợi nhớ đến loài người một cách khó chịu.#!"
 cats_flavor: "#F Loài mèo là một câu đố sống động, một chút hoang dã đã chấp nhận có một chỗ đứng bên bếp lửa của con người.#!"
 foxes_flavor: "#F Cáo là những sinh vật ranh mãnh. Chúng đạt được mục đích không phải bằng đe dọa hay bạo lực thể xác, mà bằng sự khôn khéo và nhanh trí.#!"
 raptors: "Raptors"
 raptors_flavor: "#F Raptor — diều hâu, chim ưng, đại bàng — đối với loài chim cũng giống như sư tử và hổ đối với các loài thú.#!"
 gooses: "Gooses"
 gooses_flavor: "#F Trên không trung hay lướt nhẹ trên mặt nước, thiên nga là hiện thân của vẻ đẹp và sự duyên dáng.#!"
 owls: "Owls"
 owls_flavor: "#F Với bộ lông mềm mại giúp chúng bay không một tiếng động, cùng đôi mắt to, nhạy bén cho phép chúng nhìn rõ trong bóng tối gần như hoàn toàn, cú là bậc thầy của bầu trời đêm.#!"
 ravens_flavor: "#F Loài chim lớn hơn, quạ, xòe rộng đôi cánh như một tấm áo choàng vừa duyên dáng vừa u ám.#!"
 toads: "Toads"
 toads_flavor: "#F Ếch và cóc từng được cho là tự nhiên sinh ra từ bùn đất.#!"
 
 golems: "Golems"
 golems_flavor: "#F Những câu chuyện về quái vật làm từ que củi, đá, đất sét, đất và thậm chí cả lúa mì rải rác khắp các truyền thuyết địa phương trên toàn châu Âu.#!"
 guardians_flavor: "#F Các tu sĩ của những giáo phái quyền lực, các pháp sư bí ẩn có sức mạnh phi thường và thậm chí cả những mụ phù thủy đồng quê thỉnh thoảng vẫn đặt quyền năng lên những vật vô tri để canh giữ nơi trú ẩn của mình.#!"
 homunculus: "Homunculus"
 homunculus_flavor: "#F Mỗi homunculus là một tác phẩm mang dấu ấn riêng của kẻ tạo ra nó, sở hữu một nhận thức thực sự về mục đích và ước muốn của kẻ tạo ra mình, cùng những lý thuyết ma thuật đã sinh ra nó.#!"
 
 sebau: "Sebau"
 sebau_flavor: "#F Sebau, những kẻ tôi tớ bằng đất sét sẵn sàng chết vì kẻ tạo ra chúng#!"

 hidden: "Hidden"
 hidden_flavor: "#F Một hidden là một xác chết biết đi có tính độc lập cao và tự chủ động cơ, thường có thể qua mặt được như người thường — khác với các loại xác chết biết đi khác.#!"
 walker: "Walkers"
 walker_flavor: "#F Là điểm giữa của những hidden kín đáo và những shambler thực sự ghê tởm, walker phân hủy chậm rãi, dù phần lớn vẫn còn đủ tỉnh táo để che giấu sự biến dạng của mình bằng nước hoa, quần áo và những thứ tương tự.#!"
 shambler: "Shamblers"
 shambler_flavor: "#F Chúng là những xác chết lảo đảo, rỉ dịch, thối rữa, lẽ ra không nên sống mà vẫn sống. Chúng được đặt tên như vậy vì chúng lê bước và co giật khi di chuyển, do gân và dây chằng đang phân hủy của chúng không thể điều khiển cơ thể một cách bình thường.#!"
 skeletons: "Skeletons"
 skeletons_flavor: "#F Những kẻ không có nguyên liệu tươi để dùng vẫn có thể ghép nối vài khúc xương lại rồi hồi sinh chúng. Những chiến binh xương biết cử động là một cảnh tượng rợn người.#!"
 dragons_teeth: "Dragon's Teeth"
 dragons_teeth_flavor: "#F Không thể hoàn toàn trông cậy vào tay sai người phàm, nhiều pháp sư đã có thể mang theo bên mình những kẻ bảo vệ, giấu chúng trong một cái túi cho tới khi cần dùng. Một cái túi đơn giản chứa vài chiếc răng nanh có thể chứa cả một đội quân những chiến binh bất khiết này — mỗi chiếc răng, một khi được ném xuống đất, sẽ mọc lên thành một chiến binh xương đầy đủ, sẵn sàng xé xác, gây thương tật và giết chóc theo lệnh của chủ nhân mình.#!"
 
 yulan_jin: "Yulan-jin"
 yulan_jin_flavor: "#F Yulan-jin là những [GetTrait('kueijin').GetName( GetNullCharacter )] có linh hồn bị xé nát bởi những cực hình của [UmbraGlossary('yomi_wan')] và do đó không thể trú ngụ trong chính thân xác của mình.#!"
 ban_ren_guei: "Ban Ren Guei"
 ban_ren_guei_flavor: "#F Ban Ren Guei, hay Người Nửa Quỷ, là hậu duệ của một Bane Dụ Hoặc Kẻ Ngủ Say và một người phàm. Họ thường xuyên bị các Devil-Tiger sai khiến và ràng buộc để phục vụ chúng.#!"



 unwholesome_nightmare_inducing_ghost: "Unwholesome Nightmare-Inducing Ghosts"
 unwholesome_nightmare_inducing_ghost_flavor: "#F Những thực thể này là một dạng Spectre, kuei quyền năng còn sót lại khi một hồn ma sa vào Po của mình. Bị một Devil Tiger khống chế, chúng gieo rắc kinh hoàng trong những giấc mơ của kẻ thù.#!"
 unrighteous_cult_leading_ghost: "Unrighteous Cult-Leading Ghost"
 unrighteous_cult_leading_ghost_flavor: "#F Một dạng hồn ma được biết đến ở phương Tây với tên gọi Apparition, những Yin-spirit này khoái trá gây dựng các giáo phái giữa người sống. Devil Tiger thường tìm ra những cách dùng sáng tạo cho những người phàm bị linh hồn này lừa gạt.#!"
 twice_crimson_tigers_maa: "Twice-Crimson Tigers"
 twice_crimson_tigers_maa_flavor: "#F Devil Tiger sinh dưới Nam Hướng đặc biệt hung hãn và hiếu chiến. Chúng là mũi nhọn của $pod_kueijin$.#!"
 polong_maa: "Polong"
 polong_maa_flavor: "#F Dù có thể mang bất cứ hình dạng nào mà con ma cà rồng mong muốn, một Polong được tạo ra luôn là một sinh vật gồm sụn và thịt sống với trí khôn hạn chế. Các Mistress of Flesh Shintai có thể điều khiển Polong từ xa và nhìn thấy những gì chúng thấy.#!"
 hungry_red_dragons_maa: "Hungry Red Dragons"
 hungry_red_dragons_maa_flavor: "#F Các chiến binh của Thrashing Dragons là bậc thầy của trạng thái xuất thần chiến trận Dragon Dance. Piyau Payung được coi là Red Dragon vĩ đại nhất mà thế gian từng thấy, và nhiều kẻ cố gắng noi theo nàng.#!"
 wayang_kulit_maa: "Wayang Kulit"
 wayang_kulit_maa_flavor: "#F Một lối chiến tranh của [Glossary('Penangallan','podgloss.penangallan')] dùng Flesh Shintai để gây rối loạn cho kẻ thù. Được đặt tên theo lối kịch bóng của người Java. #!"
 lianfang_maa: "Lianfang"
 lianfang_maa_flavor: "#F Trong thời chiến, Resplendent Cranes có thể huy động một liên minh gồm Wu và những $pod_kueijin$ không liên kết để cùng nhau lập thành một đội quân tạm bợ.#!"
 heaven_hell_legion_maa: "Heaven and Hell Legion"
 heaven_hell_legion_maa_flavor: "#F Đội quân kỷ luật của Tướng Quân Ma, dù còn khá non trẻ, vẫn là một trong những lực lượng hiệu quả nhất của $pod_kueijin$ Trung Hoa.#!"
 triumphant_hares_maa: "Triumphant Hares"
 triumphant_hares_maa_flavor: "#F Một cái tên trớ trêu dành cho các chiến binh $pod_kueijin$ không có chút tài năng thực sự nào. Resplendent Cranes thường đẩy những kẻ ngỗ ngược, thiếu kỹ năng vào các nhiệm vụ cảm tử khi cần thiết.#!"
 majestic_warriors_maa: "Majestic Warriors"
 majestic_warriors_maa_flavor: "#F Được đặt tên theo vị [Glossary('Bồ Tát','podgloss.bodhisattva')] khó nắm bắt nhưng được kính trọng của họ, lực lượng tinh nhuệ của Resplendent Cranes là một đội quân cân bằng và kỷ luật tốt trên chiến trường.#!"
 dark_jade_lovers_maa: "Dark Jade Lovers"
 dark_jade_lovers_maa_flavor: "#F Là hiện thân của cái chết đối với Thousand Whispers, những sát thủ tài ba mang muôn vàn gương mặt.#!"
 still_earth_flowers_maa: "Still Earth Flowers"
 still_earth_flowers_maa_flavor: "#F Vững chãi và kiên định nhưng cũng luôn biến đổi, những chiến binh này của Thousand Whispers tìm cách thể hiện chính đất đai.#!"
 jade_mask_ghost_killers_maa: "Jade Mask Ghost-Killers"
 jade_mask_ghost_killers_maa_flavor: "#F Một số Thousand Whispers tìm thấy bổn phận trong việc giúp các hồn ma và những spectre khác được siêu thoát. Họ đã trở thành những chuyên gia trong việc đối phó với tay sai của âm giới. #!"
 xiang_qi_masters_maa: "Xiang-qi Masters"
 xiang_qi_masters_maa_flavor: "#F Bone Flowers nhìn chiến tranh với cùng thái độ dửng dưng như thể họ đang chơi một ván cờ bàn. Họ sẽ dùng mọi quân cờ trên bàn cờ để giành lợi thế cho mình.#!"
 black_pearl_masters_maa: "Black Pearl Masters"
 black_pearl_masters_maa_flavor: "#F Được đặt tên theo vị [Glossary('La Hán','podgloss.arhat')] được tôn kính nhất của Bone Flowers, những chiến binh này nằm trong số ít Bone Flowers thực sự cống hiến khát khao tri thức của mình cho việc tinh thông chiến tranh.#!"
 keepers_black_metal_maa: "Keepers of the Black Metal Egg"
 keepers_black_metal_maa_flavor: "#F Những Bone Flowers thực sự tinh thông Yin gần như miễn nhiễm với đau đớn và hoàn toàn không hề nao núng. Cả hai đều là tài sản lớn để dùng trên chiến trường.#!"
 kataragama_chosen_maa: "Kataragama's Chosen"
 kataragama_chosen_maa_flavor: "#F Được đặt tên theo vị người sáng lập được tôn sùng của Rising Phoenix, những chiến binh này noi theo các chiến dịch chiến thắng của ông chống lại bọn ma cà rồng theo tà giáo ô uế của Sri Lanka.#!"
 jade_warriors_maa: "Jade Warriors"
 jade_warriors_maa_flavor: "#F Một Jade Warrior là một đệ tử đã tinh thông sức mạnh thể chất cần thiết để chiến đấu vì [Glossary('Pháp Môn','podgloss.dharma')]. Ở giai đoạn này, họ có thể bị trưng dụng để tham chiến nếu cần.#!"
 lotus_mist_warriors_maa: "Lotus Mist Ambushers"
 lotus_mist_warriors_maa_flavor: "#F Dùng một sức mạnh bí mật chỉ những người cùng [Glossary('Pháp Môn','podgloss.dharma')] mới biết, những chiến binh này dùng chính môi trường xung quanh để trở nên gần như vô hình.#!"
 children_sita_maa: "Children of Sita"
 children_sita_maa_flavor: "#F Con cái của một Nữ Thần bị hàm oan và lưu đày chỉ có thể ra trận với những chiến mã và trang bị tinh xảo nhất mà giáo phái của họ có thể mua được.#!"
 celestial_guard_maa: "Celestial Guards"
 celestial_guard_maa_flavor: "#F Những vị Thần tái sinh của Celestial Tribe phải được bảo vệ bởi những tín đồ nhiệt thành và tài giỏi nhất của mình mọi lúc.#!"
 kabalyeru_maa: "Kabalyeru"
 kabalyeru_maa_flavor: "#F Khi một Seeker chứng tỏ được bản thân bằng tài năng trên chiến trường, họ trở thành một Kabalyeru và từ đó được coi là chiến binh chính thức của giáo phái mình.#!"
 fighting_cloud_maa: "Fighting Cloud Masters"
 fighting_cloud_maa_flavor: "#F Các bậc thầy của môn nghệ thuật này có thể xuyên thủng bức màn ảo ảnh đang bao trùm thế giới này. Khi làm vậy, họ dường như có thể tấn công rồi rút lui như thể chưa từng tồn tại.#!"
 illusion_shattering_maa: "Illusion Shattering Strike"
 illusion_shattering_maa_flavor: "#F Các bậc thầy của Inward Way biết rõ điều gì là thật và điều gì không. Bằng cách vận dụng nghệ thuật bí truyền của mình, họ có thể xua tan bất cứ sinh vật nào không thuộc về cõi này chỉ bằng một đòn duy nhất.#!"
 disciples_riyan_maa: "Disciples of Riyan"
 disciples_riyan_maa_flavor: "#F Vị tổ phụ của Cerulean Veils đã trải qua một hành trình dài và gian nan đầy hiểm nguy. Những chiến binh này tôn vinh những thử thách của ông bằng cách tôi luyện bản thân để chống chọi với những điều kiện khắc nghiệt nhất.#!"
    
 shikome_assassin: "Shikome"
 shikome_assassin_flavor: "#F Xinh đẹp lạnh lùng, Shikome là những sát thủ, cận vệ và ái thiếp của [Glossary('Emma-O','podgloss.emmao')]. Tất cả từng là $pod_kueijin$ mà hắn đã đích thân thu phục vào phục vụ mình.#!"
 kumo_huntress: "Kumo Huntress"
 kumo_huntress_flavor: "#F Gầy gò và nhợt nhạt, cư dân Kumo của [UmbraGlossary('kakuri')] [UmbraGlossaryLocalized('yomi_wan','Địa Ngục Yomi')] mang dáng vẻ như nhện ngay cả khi mang hình người.#!"
 raksha_of_ravana: "Raksha of Ravana"
 raksha_of_ravana_flavor: "#F Raksha đều đặn hành trình đến Trung Nguyên để kiếm ăn và giao thương, đồng thời lén lút lang thang khắp [UmbraGlossaryLocalized('yomi_wan','Địa Ngục Yomi')] để tìm kiếm vật hiến tế cho Lanka.#!"
 the_children_of_tou_mou: "The Children of Tou Mu"
 the_children_of_tou_mou_flavor: "#F Những hình dạng vuông vức, khom lưng, bằng sắt đen với đôi mắt đỏ rực, nửa như tự động cơ hình người nửa như côn trùng, Children of [Glossary('Tou Mu','podgloss.toumu')] được tạo ra để sống sót qua điều kiện khắc nghiệt trong cõi giới của Yama Queen.#!"
 mikaboshis_demons_of_iron_and_violence: "Mikaboshi's Demons of Iron and Violence"
 mikaboshis_demons_of_iron_and_violence_flavor: "#F Tìm ra mục tiêu. Tiêu diệt mục tiêu. Gây thiệt hại kèm theo càng nhiều càng tốt trong lúc tiêu diệt.#!"
 shinjuku_undercity_scavengers: "Shinjuku Undercity Scavengers"
 shinjuku_undercity_scavengers_flavor: "#F Không ai thoát ra khỏi [Glossary('Wicked City','podgloss.wickedcity')]. Phần lớn cứ dội qua dội lại giữa đường phố và lao động chân tay cho đến khi cuối cùng kiệt sức (và chẳng bao lâu sau, lụi tàn). Nhưng với những kẻ nào cố mà thoát được khỏi guồng quay tàn khốc ấy, cú ngã không tránh khỏi còn tệ hơn nhiều. Shinjuku không phải một tình nhân hiếu khách.#!"
 fat_striders_of_the_hell_of_boiling_oil: "Fat-Striders of the Hell of Boiling Oil"
 fat_striders_of_the_hell_of_boiling_oil_flavor: "#F Về hình dạng, những sinh vật này trông phần nào giống ấu trùng muỗi lai với dạng chưa trưởng thành của một loài châu chấu hay ve sầu đặc biệt ghê tởm, với đôi chân khẳng khiu của loài côn trùng lướt nước. Fat-strider tấn công bằng cái miệng răng thép ở đầu vòi hút có thể vươn dài nhanh như chớp.#!"
 wu_huas_corpse_tiger_demons: "Wu Hua's Corpse-Tiger Demons"
 wu_huas_corpse_tiger_demons_flavor: "#F Corpse-Tiger Demon của Wu Hua có vẻ ngoài to lớn (cao ba mét), cơ bắp cuồn cuộn, mang hình dạng nam nữ với đầu và đuôi hổ, cùng bàn chân như chân hổ với móng vuốt dài, đen, có thể thu vào thay vì bàn tay.#!"
 kani_no_jingoku: "Kani no Jingoku"
 kani_no_jingoku_flavor: "#F Kani no Jingoku là cư dân của Seven Burning Seas và là đầy tớ của Yama Queen bí ẩn, Nữ Hoàng của những Viên Ngọc.#!"
 generic_servitor: "Generic Servitor"
 generic_servitor_flavor: "#F Không phải ai ở [UmbraGlossaryLocalized('yomi_wan','Địa Ngục Yomi')] cũng có thể là một đầy tớ độc đáo và thú vị của cái ác. Phải có kẻ đảm nhận vai trò con quái vật hạng trung, thứ kinh hoàng lê bước, tên tra tấn tầm thường giúp lấp đầy hàng ngũ binh đoàn của [UmbraGlossaryLocalized('yomi_wan','Địa Ngục Yomi')].#!"
 the_unfaced_ones_maa: "The Unfaced Ones"
 the_unfaced_ones_maa_flavor: "#F The Unfaced Ones là đống tàn tích méo mó, quấn giẻ rách của những Spectre đã lưu lại quá lâu trên Ebon Road. Dù hình dạng đã tàn tạ, The Unfaced Ones vẫn cực kỳ nhanh nhẹn và được nhiều [Glossary('Yama Kings','podgloss.yamaking')] dùng làm chó canh gác.#!"
 the_guardians_yomi_maa: "Guardians of the Wall"
 the_guardians_yomi_maa_flavor: "#F Được [Glossary('Yama Kings','podgloss.yamaking')] tạo ra riêng cho mục đích canh giữ Bức Tường bao quanh Yomi World, những linh hồn này là sự kết hợp đáng sợ giữa mãnh thú Trung Nguyên và ác quỷ Yomi. Một Guardian điển hình di chuyển trên sáu chân có vảy và móng vuốt, thân hình uốn lượn được phủ giáp ngọc bích đen.#!"

 shades: "Shades"
 shades_flavor: "#F Trong số những Spectre quyền năng nhất, Shade là những oan hồn từng bị ném vào [UmbraGlossary('tempest')], bị cuốn vào một trận Maelstrom hoặc Great Maelstrom, hoặc lạc mất bản thân trong một Harrowing.#!"
 wraiths_flavor: "#F Oan hồn hiện hình được triệu hồi từ [UmbraGlossaryLocalized('shadowlands','Âm Phủ')].#!"
 spectres: "Spectres"
 spectres_flavor: "#F Spectre hiện hình được gọi ra từ [UmbraGlossary('pod_realm_labyrinth')].#!"
 the_reavers_of_ur: "The Reavers of Ur"
 the_reavers_of_ur_flavor: "#F Một bầy hình thù xám xịt, gớm ghiếc, uốn lượn được triệu hồi từ một nơi vô danh để tàn sát kẻ thù một cách ghê rợn.#!"
 soldiers_of_the_emperor: "Soldiers of the Emperor"
 soldiers_of_the_emperor_flavor: "#F Binh lính được hưởng vinh dự to lớn trong Jade Empire, vì họ bảo vệ Đế Quốc chống lại ác quỷ, Spectre và những kẻ xâm lược khác.#!"
 bureaucrats_of_jade_palace: "Bureaucrats of Jade Palace"
 bureaucrats_of_jade_palace_flavor: "#F Các vị Đại Thần cư ngụ trong sảnh đường và sân viện của Jade Palace, nơi bị Tempest bao phủ của Emperor, là một giống loài đặc biệt, những kẻ mưu mô và quan liêu tài giỏi nhất trong toàn Đế Quốc.#!"
 demon_jailer: "Demon Jailer"
 demon_jailer_flavor: "#F Những cai ngục, kẻ tra tấn và đốc công của Địa Ngục đều đã dùng quyền năng ma quái Moliate để biến bản thân thành ác quỷ trong truyền thuyết.#!"
 phantasies: "Phantasies"
 phantasies_flavor: "#F Đây là những sinh vật có nét tương đồng mạnh mẽ với sinh vật sống, chẳng hạn cá voi hay chim chóc. Phantasy có thể đủ khôn ngoan để giao tiếp cùng, và đôi khi sẽ giúp đỡ oan hồn trong [UmbraGlossary('tempest')]. Giống như động vật ở [Glossary('Skinlands','game_concept_skinlands_desc')], một số loài thù địch với con người, một số thân thiện, và một số tốt nhất nên tránh xa.#!"
 deliriums: "Deliriums"
 deliriums_flavor: "#F Plasmic có vẻ như là những động vật bị biến đổi, chẳng hạn ngựa có cánh hay mèo có râu ăng-ten. Delirium có xu hướng thông minh và quyền năng hơn Phantasy đôi chút.#!"
 legendaries: "Legendaries"
 legendaries_flavor: "#F Plasmic mô phỏng theo một loại quái thú thần thoại nào đó, chẳng hạn Phượng Hoàng. Legendary có xu hướng thông minh, quyền năng và hiếm gặp.#!"
 angelics: "Angelics"
 angelics_flavor: "#F Đúng như tên gọi, Angelic xuất hiện như những sinh thể thiên thần xinh đẹp trong truyền thống Do Thái-Cơ Đốc cổ điển: áo choàng, vầng hào quang và đôi cánh là điều thường thấy, nhưng một số Angelic có thể mang hình dạng lưỡng tính hoặc lấp lánh hơn. Chúng thường trôi dạt khắp [UmbraGlossary('tempest')], giúp đỡ oan hồn trên hành trình của họ.#!"
 demonics: "Demonics"
 demonics_flavor: "#F Đúng như tên gọi, Demonic là những sinh vật xuất hiện như hình ảnh phản chiếu của sự xấu xa, dục vọng, hoặc cả hai. Mục đích duy nhất của Demonic dường như là tra tấn, nô dịch hoặc hủy diệt bất kỳ oan hồn nào chúng gặp phải. Một số Demonic có thể tạm thời mang hình dạng Angelic, và có thể dẫn dụ một oan hồn trước khi lộ ra bản chất thật và giáng xuống hình phạt.#!"
 archangelics: "Archangelics"
 archangelics_flavor: "#F Archangelic thoạt nhìn có thể giống Angelic, nhưng đến một lúc nào đó sẽ biến đổi thành hình dạng rực lửa, kinh hoàng khi chứng kiến. Chúng thường mang theo một thanh kiếm hoặc cuộn giấy phán xét, và sẽ dùng một năng lực Castigate đặc biệt để rút Shadow của một oan hồn ra nhằm hủy diệt nó. Psyche của oan hồn khi đó sẽ bị Archangelic lấy đi cho những mục đích không rõ, dù người ta ngờ rằng Psyche đóng vai trò trong việc rèn nên những thanh kiếm rực lửa của Archangelic.#!"
 archdemonics: "Archdemonics"
 archdemonics_flavor: "#F Đối lập với Archangelic, một Archdemonic sẽ cố gắng làm mạnh thêm Shadow của một oan hồn thay vì thanh tẩy nó. Chúng có vẻ mang lại lợi ích lúc đầu, dạy cho oan hồn những Arcanoi mới, nhưng chỉ dạy những kỹ năng khiến oan hồn tích Angst. Cuối cùng, một Archdemonic sẽ bào mòn nạn nhân của mình và để cho Shadow giành quyền kiểm soát, biến họ thành đầy tớ của [UmbraGlossary('oblivion')].#!"
 djinn: "Djinn"
 djinn_flavor: "#F Một số Angelic và Demonic xuất hiện như thần đèn hay efreeti và dường như sở hữu những quyền năng gắn liền với các sinh thể đó. Chúng có thể ban cho oan hồn của cải kếch xù - tất nhiên bằng tiền tệ Stygia - cùng những vật phẩm khác như cung điện di vật và thảm bay. Của cải này khiến oan hồn phải trả giá đắt.#!"
 wyrds: "Wyrds"
 wyrds_flavor: "#F Plasmic không có điểm tương đồng nào với sinh vật sống hay huyền thoại. Wyrd nhìn chung xa lạ; ngay cả khi chúng đủ thông minh để giao tiếp với oan hồn (và phần lớn thông minh đến đáng sợ), yêu cầu hay đòi hỏi của chúng nhìn chung quá bí ẩn để có thể hiểu được.#!"
 ailerons: "Ailerons"
 ailerons_flavor: "#F Cơ thể của một Aileron chẳng có gì nhiều; một cái miệng hút đầy móc câu, một cái đuôi dài như roi quất, và đôi cánh lớn mà chúng dùng để lướt theo các luồng [UmbraGlossary('tempest')] là tất cả những gì tạo nên nó. Chính thân hình mỏng manh và màu sắc của chúng khiến chúng gần như vô hình giữa đống mảnh vụn cuồn cuộn của những cơn bão.#!"
 cerements: "Cerements"
 cerements_flavor: "#F Cerement xuất hiện như những khối chất nhầy ectoplasm lớn rỉ ra, với những mạch máu đập rộn khắp bên trong. Cerement là một trong những loại Whistimmu ôn hòa hơn, và hiếm khi tự đi tìm rắc rối. Tuy nhiên, nếu một oan hồn gặp phải một con, họ sẽ gặp phải khoảng thời gian khốn khổ; oan hồn xui xẻo bị vướng vào một Cerement sẽ mất đi một năm ký ức cho mỗi ngày họ bị mắc kẹt bên trong. Cerement thậm chí có thể kéo nạn nhân của mình ra khỏi [Fetters|E] và Passion của họ, rồi sử dụng chúng như thể là của chính nó. Cuối cùng, oan hồn bị bắt giữ sẽ tự mình trở thành một Cerement.#!"
 kraken: "Kraken"
 kraken_flavor: "#F Kraken đáng sợ vì kích thước khổng lồ của nó; trên thực tế nó lớn đến mức chưa có oan hồn nào từng báo cáo đã nhìn thấy nó trọn vẹn. Người ta biết nó có xúc tu và đôi mắt to lớn, nhưng không biết gì khác về hình dạng hay giải phẫu của nó. Kraken cũng khá cổ xưa; Great Library of Stygia có những ghi chép về sự tồn tại của nó từ trước khi Charon hoàn tất việc xây dựng vương quốc vĩ đại của mình trên Isle of Sorrows.#!"
 mourners: "Mourners"
 mourners_flavor: "#F Mourner, thoạt nhìn, giống những hình dáng khoác áo choàng của Ferrymen. Tuy nhiên, thay vì mang theo đèn lồng và lưỡi hái, Mourner đeo trên mình những khối xích nặng nề. Gương mặt của chúng không thể nhìn thấy, bị che khuất trong bóng tối của áo choàng. Chúng luôn di chuyển thành bầy, với mọi Mourner trong một nhóm nhất định bị xích vào kẻ quyền năng nhất trong số đó. Không giống nhiều sinh vật của [UmbraGlossary('tempest')], Mourner dường như luôn có một mục tiêu cụ thể khi xuất hiện, hành quân từ [UmbraGlossary('tempest')] vào [UmbraGlossary('shadowlands')].#!"
 shroudrippers: "Shroudrippers"
 shroudrippers_flavor: "#F Shroudripper là một trong những loài Whistimmu khó nắm bắt nhất, khó phát hiện và gần như không thể bắt giữ hay khảo sát. Dù chưa từng được khảo sát chi tiết, người ta nhìn chung đồng ý rằng Shroudripper có thân hình nhỏ gọn, và một lớp màng mỏng căng giữa mười "ngón tay" cho phép chúng bay. Lớp màng đó cũng chứa những tia nhỏ có thể phun axit, và mỗi ngón tay kết thúc bằng một móng vuốt rất sắc. Tuy nhiên, Shroudripper cực kỳ mong manh; những con bị tiêu diệt mà [Corpus|E] của chúng được thu hồi sẽ tan chảy thành một đống plasm vô định hình chỉ trong vài giây.#!"
 tindelhounds: "Tindelhounds"
 tindelhounds_flavor: "#F Đúng như tên gọi, Tindelhound bề ngoài giống loài chó. Tuy nhiên, do vết nhơ của [UmbraGlossary('oblivion')], những con chó này có nhiều đầu, miệng và mắt hơn hẳn loài chó bình thường; con nhiều nhất được ghi nhận có mười miệng và mười lăm mắt. Chúng cũng lớn hơn nhiều so với chó thông thường, cỡ khoảng 15 feet tính đến vai. Ngoài hàm răng và kích thước, chúng có móc gai thay vì lông, phun lửa xanh từ miệng, và để lại một vệt bồ hóng phía sau. Như thế vẫn chưa đủ, Tindelhound còn khá thông minh, có thể thích nghi khá nhanh với những tình huống bất thường. May cho oan hồn, phần lớn chúng tránh xa [UmbraGlossary('shadowlands')], sống sâu bên trong [UmbraGlossary('tempest')].#!"
 shadow_beasts: "Shadow Beasts"
 shadow_beasts_flavor: "#F Quái thú bóng tối hiện hình được triệu hồi từ Abyss bằng chú thuật huyết mạch.#!"
 hungry_shade: "Hungry Shades"
 hungry_shade_flavor: "#F Shade đói khát hiện hình được triệu hồi từ Abyss bằng chú thuật huyết mạch.#!"

 mist_dragons: "Mist Dragons"
 mist_dragons_flavor: "#F Sâu bên trong những màn sương huyền bí này là những con rồng nhỏ bé, không lớn hơn mèo là bao.#!"
 giants_flavor: "#F Thân hình đồ sộ của chúng, thường cao hơn 20 feet, giống như những con người cơ bắp cuồn cuộn với làn da thô ráp, sần sùi, khiến người ta đưa ra giả thuyết rằng chúng có thể là họ hàng xa của inanimae đá.#!"
 tarrkel: "T'arrkel"
 tarrkel_flavor: "#F Vực thẳm của Underbridge sinh ra những sinh vật méo mó, ác mộng vượt ngoài khả năng hiểu biết của con người, những sinh vật sống nhờ đau đớn và tồn tại bằng thịt của kẻ sống.#!"
 fire_salamanders: "Fire Salamanders"
 fire_salamanders_flavor: "#F Những sinh vật này, dù giống loài họ hàng bình thường của chúng, là những sinh vật phép thuật sống chủ yếu trong các cõi tiên nằm ngoài thế giới tự nhiên.#!"
 firebirds: "Firebirds"
 firebirds_flavor: "#F Firebird là một sinh vật màu sắc rực rỡ đến từ vùng đất Slav ở Đông Âu.#!"
 
 aughisky: "Aughisky"
 aughisky_flavor: "#F Những con ngựa ma quái đen tối ám ảnh các ngã tư đường hoặc rình rập gần các ao hồ, dòng suối nước lợ.#!"


 
 sirens: "Sirens"
 sirens_flavor: "#F Những nàng ma nữ tóc dài quyến rũ của biển cả, Siren dụ dỗ các thủy thủ đến những nấm mồ dưới nước trên những rạn đá ngầm hay eo biển nguy hiểm.#!"

 incubus: "Incubus"
 incubus_flavor: "#F Incubus là hình dạng nam của loài ác quỷ cám dỗ và dục vọng này, được gần như mọi nền văn hóa biết đến (dù dưới những tên gọi khác nhau).#!"
 succubus: "Succubus"
 succubus_flavor: "#F Succubus là hình dạng nữ của loài ác quỷ cám dỗ và dục vọng này, được gần như mọi nền văn hóa biết đến (dù dưới những tên gọi khác nhau).#!"
 
 pelesit: "Pelesit"
 pelesit_flavor: "#F Những sinh vật nhỏ bé được tạo ra từ chính thịt của wan-kuei và được phái đi làm việc vặt.#!"
 
 vampires_hunters: "Vampire Hunters"
 vampires_hunters_flavor: "#F Nỏ là vũ khí ưa thích khi săn lùng lũ hút máu. Còn cách nào tốt hơn để đưa cọc nhọn thẳng vào trọng tâm vấn đề - trái tim?#!"
 demons_hunters: "Demon Hunters"
 demons_hunters_flavor: "#F Được huấn luyện để chống lại sự tha hóa và xua tan ảo ảnh, những người này không ngừng nghỉ trừ khử tay sai của đại kẻ thù.#!"
 monsters_hunters: "Monster Hunters"
 monsters_hunters_flavor: "#F Những kẻ biến hình quái dị quá kinh khủng để người thường có thể nhìn thẳng vào. May thay, những người này không phải người thường.#!"
 dazbog_hunters: "Warriors of Dazbog"
 dazbog_hunters_flavor: "#F Người thừa kế vị thần chiến binh vĩ đại của mặt trời, những anh hùng này hạ gục quái vật hùng mạnh bất cứ nơi nào họ đến.#!"
        
 dragons_flavor: "#F Ôi được làm một con rồng\na biểu tượng của quyền năng Thiên Đường.#!"

 minion_of_the_divine: "Blessed Warriors"
 minion_of_the_divine_flavor: "#F Được truyền cảm hứng bởi hào quang thần thánh của ngài, những chiến binh kiêu hãnh này chiến đấu như chính các thiên thần.#!"
 
 hoplites: "Hoplites"
 hoplites_flavor: "#F Trở về cùng khiên của ngươi, hoặc trên nó.#!"
 companion_cavalry: "Companion Cavalry"
 companion_cavalry_flavor: "#F "Ngươi sẽ làm gì nếu ngươi từng đến được tận cùng thế giới?" "Ta sẽ quay lại và chinh phục mặt đối lập của nó." #!"
    
 envy_dragon: "Envy"
 envy_dragon_flavor: "#F Hình dạng tự nhiên của Envy là một con hải xà khổng lồ, dài hơn bất kỳ con tàu nào. Một cái đầu rồng nanh xanh nằm trên đỉnh một thân hình rắn rồng đồ sộ, cùng hai đôi vây có vuốt. Mảnh mai và uyển chuyển, Envy thích thú quấn thân mình quanh những con tàu nhiều vòng trước khi tước đoạt thủy thủ đoàn và hàng hóa của chúng, rồi đưa tất cả xuống đáy biển sâu.#!"
 gluttony_dragon: "Gluttony"
 gluttony_dragon_flavor: "#F Con rắn to béo vĩ đại này cuộn mình ở Black Forest phía bắc, không xa nơi nó ra đời là bao. Con thằn lằn đen như than không cần đi xa để tìm một nơi ở phù hợp với nhu cầu của nó. Không như một số họ hàng của nó, nó không có cánh và do đó không thể bay. Tuy nhiên, tốc độ trên mặt đất ở dạng rắn của nó bù đắp nhiều hơn cho sự mất mát đó. Nó có thể lao vun vút qua những vùng đất rộng lớn chỉ trong chốc lát, để lại sau lưng những đám bụi khổng lồ và một vệt mảnh vụn.#!"
 greed_dragon: "Greed"
 greed_dragon_flavor: "#F Serpent of Greed chạy trốn vào những dãy núi của Ý để tìm một nơi ở mới. Ít ai thấy con quái vật đen vĩ đại rẽ màn đêm mà đi. Không ai thấy nó đến, trong lốt một kẻ ăn mày xin bất cứ thứ gì có thể xin được, cái lưỡi bạc của nó luôn nới lỏng ngay cả những sợi dây túi tiền chặt chẽ nhất. Chẳng bao lâu, nó đã tích lũy đủ của cải để lập nghiệp kinh doanh. Một lần nữa, giọng nói ngọt ngào của nó thuyết phục những kẻ nhẹ dạ, lần này để thu hút đối tác cho các phi vụ của nó. Vận may của họ cộng vào vận may của nó và cùng lúc lớn dần lên. Chẳng bao lâu nó đã trở thành một thế lực kinh doanh.#!"
 lust_dragon: "Lust"
 lust_dragon_flavor: "#F Con quái vật đỏ vĩ đại này bay lên trời ngay sau khi ra đời, bay qua vùng biển đến quần đảo Anh. Serpent of Lust là một con rồng mảnh khảnh và uyển chuyển, không lớn bằng một số họ hàng của nó, nhưng vẫn có kích thước đáng gờm. Đôi cánh của nó trải rộng gấp rưỡi chiều dài thân. Vảy lấp lánh của nó đỏ như hồng ngọc, tạo nên một sinh vật hấp dẫn, nếu không phải vì hàm răng nanh cỡ người và móng vuốt dài như giáo.#!"
 pride_dragon: "Pride"
 pride_dragon_flavor: "#F Serpent of Pride có vảy làm hang ổ bên dưới hầm mộ của Rome, trong những đường hầm đã bị chính đầy tớ của nó bịt kín từ lâu. Một cánh cửa nặng nề, khóa kín là lối vào hay ra duy nhất có thể sử dụng; hành lang bên ngoài dẫn đến dinh thự nguy nga của hình dạng người hiện tại của nó. Nó dành thời gian ở đây giữa giới thượng lưu, luôn cẩn thận để trông đẹp trai hơn một chút, ăn mặc chỉnh chu hơn một chút, và đáng ngạc nhiên, cư xử lịch thiệp hơn một chút so với bất kỳ ai khác. Nó để lại phần lớn công việc phàm trần giả tạo của mình trong tay những kẻ hầu người phàm đáng tin cậy - và thường bị lừa gạt.#!"
 sloth_dragon: "Sloth"
 sloth_dragon_flavor: "#F Sloth là một con trăn khổng lồ, màu nâu bẩn, hoàn toàn không bận tâm đến vẻ ngoài của mình. Không như họ hàng của nó, nó không có cánh hay chân. Nó là một con rắn to béo với đầu rồng. Đúng như tên gọi, thân hình nó là một cuộn dây thừng loài bò sát chắc nịch, bề mặt trơn nhẵn của nó chỉ bị phá vỡ bởi thỉnh thoảng một khối u của bữa ăn vẫn còn đang tiêu hóa.#!"
 wrath_dragon: "Wrath"
 wrath_dragon_flavor: "#F Khi Serpent of Wrath bùng nổ xông vào thế giới, sự thù địch của nàng làm rung chuyển cả mặt đất. Những ý nghĩ gây hấn và báo thù của nàng lan tỏa ra ngoài cho đến khi tìm được một vật chủ sẵn lòng cho cơn giận của nàng. The Huns tràn qua châu Âu, thỏa mãn tính khí của con quái vật. Nàng ngụ trong giấc ngủ dưới lớp băng giá của miền tây nước Nga. Lần tới khi nàng tỉnh giấc, chắc chắn sẽ là khi ngửi thấy mùi tàn sát.#!"
 

 mob_maa: "Mob"
 mob_maa_flavor: "#F Một đám thường dân được trang bị sơ sài, bị lừa gạt hoặc thuyết phục để chết vì lãnh chúa bất tử của họ.#!"
 poachers_maa: "Poachers"
 poachers_maa_flavor: "#F Những kẻ khả nghi từ vùng hoang dã được trả tiền để chiến đấu cho những kẻ bảo trợ còn khả nghi hơn.#!"
 outriders_maa: "Outriders"
 outriders_maa_flavor: "#F Những kỵ sĩ tài giỏi với ít băn khoăn đạo đức đang rất được các lãnh chúa bóng đêm săn đón.#!"
 rabble_maa: "Militia"
 rabble_maa_flavor: "#F Cây chĩa cũng coi như một loại giáo dài, phải không? Ăn mày thì đâu được kén chọn.#!"
 retainers_maa: "Retainers"
 retainers_maa_flavor: "#F Cận vệ phàm nhân của bất kỳ lãnh chúa bất tử biết tự trọng nào. Thường được trả công rất hậu hĩnh (hoặc bị khống chế) để đảm bảo lòng trung thành của họ.#!"
 disgraced_nobles_maa: "Disgraced Nobles"
 disgraced_nobles_maa_flavor: "#F Những người con trai thứ của giới quý tộc đã đánh mất danh dự vì tính cách khả nghi và những kẻ đồng bọn mờ ám của mình.#!"

 neteru_medjay: "Neteru Medjay"
 neteru_medjay_flavor: "#F "Quân phụ trợ" của các đoàn quân Reborn phần lớn được tuyển mộ từ những người quen biết trong gia tộc rộng lớn mà các Mummy bất tử đã nuôi dưỡng qua nhiều thời đại.#!"             
 neteru_slingers: "Neteru Slingers"
 neteru_slingers_flavor: "#F Chiếc ná tầm thường đã hạ gục vô số chiến binh hùng mạnh qua nhiều thời đại. Với kỹ năng của những Neteru được các Mummy huấn luyện này, họ sẽ làm được điều đó một lần nữa.#!"             
 neteru_khopesh: "Neteru Khopesh Guard"
 neteru_khopesh_flavor: "#F Đội cận vệ tinh nhuệ của vị Pharaoh đã chết từ lâu được tái sinh qua những chiến binh Neteru này, do chính các Mummy huấn luyện.#!"             
 neteru_tomb_guard: "Neteru Tomb Guard"
 neteru_tomb_guard_flavor: "#F Những Neteru được chọn để canh gác lãnh chúa bất tử của mình trong lúc họ ngủ yên là những kẻ phòng thủ tinh nhuệ, kỹ năng của họ được mài giũa qua nhiều năm đẩy lùi những kẻ trộm mộ vô lương tâm.#!"             

 flagellants_maa: "Flagellants"
 flagellants_maa_flavor: "#F Đổ máu và chết vì vinh quang của các Thiên Thần của Chúa... còn lý do gì xứng đáng hơn thế?#!"
 chanters_cultists: "Unholy Choristers"
 chanters_cultists_flavor: "#F Chúng ca vang về sự cứu rỗi sẽ đến từ tay chủ nhân của mình... và về ngày tận số không thể tránh khỏi của kẻ thù chúng.#!"
  
 silver_hunters: "Thợ Săn Bạc"
 silver_hunters_flavor: "#F Những Hồn Ma Sương Mù kết tinh từ Bạc, các Nhà Vô Địch Giấc Mơ này sải bước qua rừng như những kỵ binh biên phòng của bạc lấp lánh. Sinh ra từ truyền thuyết về những thợ săn quái thú kinh hoàng trong đêm tối, chúng săn đuổi con mồi nguy hiểm nhất, và gieo rắc nỗi kinh hoàng vào tim những đứa con của Gaia.#!"
 coffin_makers: "Thợ Đóng Quan Tài"
 coffin_makers_flavor: "#F Được cho là báo hiệu sự diệt vong của lũ bóng ma hút máu, gai nhọn của các nhà vô địch này cào rách và thiêu đốt dòng máu của giống nòi tà ác xuất thân từ kẻ sát nhân điên loạn đầu tiên. Như những bụi hồng được nuôi để giết chóc, chúng khao khát máu chẳng khác gì con mồi của mình.#!"
 guardian_angels: "Thiên Thần Hộ Mệnh"
 guardian_angels_flavor: "#F Được tạo hình từ những câu chuyện cổ tích cha mẹ kể cho con trẻ về những vị bảo hộ đặc biệt luôn dõi theo chúng, do một sự trớ trêu kỳ lạ của số phận, những sinh vật xa lạ từ Vực Thẳm thấy các Chiến Binh Giấc Mơ ánh sáng này đặc biệt đáng ghê tởm.#!"
 unfettered_phantoms: "Bóng Ma Không Xiềng Xích"
 unfettered_phantoms_flavor: "#F Mang hình dạng bất cứ thứ gì mà linh hồn tội nghiệp nhìn thấy nó coi là 'việc còn dang dở', Fae đã thấy những chiến binh này đặc biệt gây khiếp sợ cho kẻ chết, khi chúng mang những hình dạng khủng khiếp khiến các bóng ma phải gào thét bỏ chạy vào hư không.#!"
        
 vigiles_francia_maa: "Vigiles Francia"
 vigiles_francia_maa_flavor:  "#F Được Salianna thành lập sau khi bà chiếm quyền kiểm soát nước Pháp, "gardes de nuit" là một hội hiệp sỹ Toreador Pháp tinh nhuệ, nổi danh vì tinh thông Celerity. #!"
 faydits_maa: "Faydits"
 faydits_maa_flavor: "#F Được Esclarmonde thành lập để bảo vệ Occitania, hội hiệp sỹ này quy tụ nhiều thị tộc khác nhau, được rèn luyện để đáp trả nhanh chóng mọi cuộc xâm lấn từ phía Pháp.#!"
 centuries_epines_maa: "Centurie des Epines"
 centuries_epines_maa_flavor: "#F Ban đầu được lập ra để đẩy lùi cuộc xâm lăng của các Cainite [Glossary('Ashirra','game_concept_ashirra_desc')] Iberia vào thế kỷ thứ 10 tại Occitania, nhóm này đã phát triển thành một đội lính đánh thuê tàn nhẫn hoạt động cả ở Pháp lẫn Iberia.#!"
 white_company_maa: "White Company"
 white_company_maa_flavor: "#F Những hiệp sỹ Cainite hào hiệp này đến từ Tây Ban Nha, nổi tiếng vì sự liêm chính không tì vết và tuân thủ nghiêm ngặt các chuẩn mực đạo đức do thủ lĩnh của họ, Dona Lupa Manrique, đặt ra.#!"
 fellowship_lady_maa: "Hội Huynh Đệ của Đức Bà"
 fellowship_lady_maa_flavor: "#F Được một Toreador người Anh thành lập sau khi nhận được khải tượng về Đức Mẹ Đồng Trinh trong Cuộc Thập Tự Chinh Đầu Tiên, Hội Huynh Đệ tận hiến cho việc bảo vệ và giúp đỡ phụ nữ. Họ tin rằng nhiệm vụ thiêng liêng này sẽ giải thoát họ khỏi lời nguyền của Caine. #!"
 order_chanticleer_maa: "Dòng Tu Chanticleer"
 order_chanticleer_maa_flavor: "#F Hội thợ săn quỷ Cainite bộc trực này có một bảng thành tích ấn tượng. Tuy nhiên bản tính nóng nảy đã khiến họ có nhiều kẻ thù, và ngày càng nhiều lãnh chúa trục xuất họ khỏi lãnh địa của mình.#!"
 dispossessed_maa: "Những Kẻ Bị Tước Đoạt"
 dispossessed_maa_flavor: "#F Được lập nên bởi những ghoul bị bỏ lại khi các chủ nhân Cainite thập tự chinh của họ bỏ mạng nơi Đất Thánh, Những Kẻ Bị Tước Đoạt sớm trở thành một mạng lưới ghoul tự do tương trợ lẫn nhau, đôi khi thậm chí trực tiếp chống lại những ma cà rồng áp bức.#!"
 order_star_morning_maa: "Dòng Tu Sao Mai"
 order_star_morning_maa_flavor: "#F Tín đồ của Via Adversarius, xem việc săn lùng ma quỷ địa ngục như một bổn phận thiêng liêng, Dòng Tu này được biết đến là sẵn sàng liên minh với những phe cùng chí hướng như đồng đạo trong Dòng Tu Chanticleer hay Tal'mahe'Ra bí ẩn.#!"
 order_crooked_cross_maa: "Dòng Tu Thập Tự Cong"
 order_crooked_cross_maa_flavor: "#F Một Dòng Tu Hiệp Sỹ Malkavian theo cách diễn giải kỳ quặc riêng của họ về ý chí của Malkav. Việc cố gắng lý giải sự điên loạn của ngài khiến họ rơi vào những nơi chốn và tình huống khó lường nhất. #!"
 order_bitter_ashes_maa: "Dòng Tu Tro Đắng"
 order_bitter_ashes_maa_flavor: "#F Các Hiệp Sỹ Chén Thánh huyền thoại chỉ là truyền thuyết hơn là thực tế, ngoại trừ số ít may mắn sống sót qua các cuộc truy tìm Chén Thánh. Sức mạnh của họ khiến họ vượt xa những ma cà rồng thông thường, trở thành những chiến binh vô song.#!"
 order_of_vengeance_maa: "Dòng Tu Báo Thù Chí Thánh"
 order_of_vengeance_maa_flavor: "#F Tên gọi chung cho các tín đồ của Via Vindicta, những kẻ hành xử và tự tổ chức mình như một dòng tu hiệp sỹ.#!"
 leper_knights_maa: "Hiệp Sỹ Phong Cùi"
 leper_knights_maa_flavor: "#F Dòng Tu Hiệp Sỹ Phong Cùi của Nosferatu là những người bảo trợ và canh giữ cho những kẻ bệnh tật và mắc dịch trong giới người phàm. Khi bổn phận thiêng liêng của họ bị đe dọa, họ hợp thành một lực lượng chiến đấu đáng gờm, tận dụng sức mạnh thể chất thường bị xem nhẹ của thị tộc mình.#!"
 the_unblooded_maa: "Những Kẻ Vô Huyết"
 the_unblooded_maa_flavor: "#F Khởi đầu từ hai Salubri cố gắng gìn giữ truyền thống và nghi lễ của thị tộc đang lụi tàn của mình, Những Kẻ Vô Huyết đã phát triển thành một dòng tu hiệp sỹ hỗn hợp, tận hiến bảo vệ những gì còn sót lại của đàn con từng một thời kiêu hãnh của Saulot.#!"
 mahgrib_maa: "Người Tầm Đạo Mahgrib"
 mahgrib_maa_flavor: "#F Một chi phái bí mật của Ashirra, Mahgrib tận hiến chống lại các thế lực tha hóa dù chúng mang hình dạng nào. Các thành viên Mahgrib được kính trọng chẳng kém gì bị sợ hãi vì sự tận tụy nghiêm khắc của họ.#!"
 banu_sasan_maa: "Banu Sasan"
 banu_sasan_maa_flavor: "#F Những Người Con của Sasan tự nhận có dòng dõi hoàng tộc Ba Tư. Những kẻ lang bạt khét tiếng này được nhiều ma cà rồng thuê mướn khi cần những giải pháp kín đáo hơn cho vấn đề của mình.#!"

 the_wardens_maa: "Những Người Gác Đền"
 the_wardens_maa_flavor: "#F Những kẻ canh giữ các thánh địa của Con Đường Dã Thú, Những Người Gác Đền rất giàu kinh nghiệm trong việc đối phó với các pháp sư, fae và các $glossary_fera$ tham lam khác đang tìm cách sử dụng sức mạnh huyền bí của những nơi này cho mục đích riêng.#!"
 order_twilight_maa: "Dòng Tu Hoàng Hôn"
 order_twilight_maa_flavor: "#F Còn được gọi là Dòng Tu của Những Hiệp Sỹ Chân Chính của Vầng Dương Lặn, dòng tu hiệp sỹ này gây dựng danh tiếng bằng việc săn lùng wight, những ma cà rồng đã biến thành quái vật sau khi sa vào Dã Thú của mình.#!"
 knights_black_cross_maa: "Hiệp Sỹ Thập Tự Đen"
 knights_black_cross_maa_flavor: "#F Dòng Tu Hiệp Sỹ Cainite ngầm chi phối Dòng Tu Teuton của người phàm, Thập Tự Đen là cánh tay quân sự chủ lực của Ventrue Đức. Được Lãnh Chúa Jurgen von Verden thành lập và huấn luyện, họ là lực lượng chiến đấu được kính trọng nhất của thị tộc.#!"
 knights_avalon_maa: "Hiệp Sỹ Avalon"
 knights_avalon_maa_flavor: "#F Lấy hình mẫu theo các Hiệp Sỹ Bàn Tròn, những chiến binh đáng kính này đã thề trung thành với Mithras. Vị Quốc Vương Thần Thánh của nước Anh đã giao cho họ nhiệm vụ tiêu diệt các kẻ thù đủ loại đe dọa lãnh địa của ngài, dù đó là Wight, Lupine, thợ săn phù thủy hay những thứ còn khó nắm bắt hơn.#!"
 woodwose_savages_maa: "Man Rợ Woodwose"
 woodwose_savages_maa_flavor: "#F Đám Man Rợ là một nhóm hiệp sỹ bất tử không còn tuân theo quy tắc hiệp nghĩa hay lễ nghi hiệp sỹ. Thay vào đó, chúng lập thành các băng nhóm du mục di chuyển từ làng này sang làng khác, chiếm đoạt bất cứ thứ gì hợp ý và trừng phạt bất kỳ ai dám nói rằng một chiếc vạc/cây thánh giá vàng chạm khắc/thiếu nữ nào đó không phải của chúng để lấy.#!"
 knights_shroud_maa: "Hiệp Sỹ Tấm Khăn Liệm"
 knights_shroud_maa_flavor: "#F Được chính Al-Ashrad bảo trợ, những "Hiệp Sỹ Pháp Sư" này đóng vai trò tiên phong của ngài trong cuộc chiến chống lại ma quỷ địa ngục và các mối đe dọa kín đáo khác đối với Banu Haqim.#!"
 knights_blood_maa: "Hiệp Sỹ Dòng Máu"
 knights_blood_maa_flavor: "#F Thành lập trong những ngày đen tối của các cuộc xâm lăng man tộc, Hiệp Sỹ Dòng Máu là những Ventrue đã từ bỏ truyền thống thị tộc để tập trung vào sức mạnh quân sự bằng mọi giá. Không ngừng luyện tập cho chiến tranh, họ trung thành tuyệt đối với thị tộc nói chung, dù đôi khi bị các Ventrue khác xem là quá cực đoan.#!"
 valkyries_maa: "Valkyrie"
 valkyries_maa_flavor: "#F Một nhóm nữ chiến binh, họ đúng nghĩa là những kẻ chọn ra người tử trận, danh xưng và địa vị của họ bắt nguồn từ thời ma cà rồng còn có thể được thể chế hóa thành một tôn giáo. Vai trò của các Valkyrie là những kẻ định đoạt số phận trận chiến: họ có thể xuất hiện trong một trận đánh quan trọng để xoay chuyển cục diện có lợi cho một bên. Ngày nay, họ vẫn là lực lượng tinh nhuệ chủ lực của các ma cà rồng Einherjar chống lại cuộc xâm lăng Kitô giáo.#!"
 order_rose_sable_maa: "Dòng Tu Hồng Hắc"
 order_rose_sable_maa_flavor: "#F Một chi phái bí mật bên trong Dòng Tu Hiệp Sỹ Cứu Tế, các hiệp sỹ ghoul tài năng xuất chúng này được kính trọng và săn đón vì tài thao lược quân sự. Vị bảo trợ Toreador của họ cho đến nay vẫn xoay xở tránh bị ép quy phục trước vô số thế lực bên ngoài đang tìm cách kiểm soát Dòng Tu. #!"
 knights_rose_sable_maa: "Huynh Đệ Hồng Hắc"
 knights_rose_sable_maa_flavor: "#F Thành lập năm 1125 CN từ một nhóm hiệp sỹ quý tộc lang bạt đang trên đường gia nhập cuộc Thập Tự Chinh, các Hiệp Sỹ nổi tiếng với áo giáp và vũ khí được chế tác đầy nghệ thuật. Niềm tin dị giáo của họ không được phô bày công khai và họ có thể hoạt động trong xã hội người phàm vì chủ nhân của mình, Toreador Andrew.#!"
 disciples_anubis_maa: "Đệ Tử Anubis"
 disciples_anubis_maa_flavor: "#F Đệ Tử Anubis là một nhóm Cainite cổ xưa tại Ai Cập. Họ truy nguyên nguồn gốc từ một methuselah Gangrel tên Anpu, người bạn và đồng minh của Osiris trong cuộc chiến chống lại Set. Đàn con của ngài ủng hộ $glossary_osirian_league$ của Horus, có quan hệ mật thiết với cả Lupine Silent Striders lẫn Giáo Phái Isis của người phàm. #!"
 disciples_anubis_maa_upgraded: "Đệ Tử Báo Thù của Anubis"
 disciples_anubis_maa_upgraded_flavor: "#F Đệ Tử Anubis là một nhóm Cainite cổ xưa tại Ai Cập. Họ truy nguyên nguồn gốc từ một methuselah Gangrel tên Anpu, người bạn và đồng minh của Osiris trong cuộc chiến chống lại Set. Đàn con của ngài ủng hộ $glossary_osirian_league$ của Horus, có quan hệ mật thiết với cả Lupine Silent Striders lẫn Giáo Phái Isis của người phàm. #!"
 warrior_setites_maa: "Setite Chiến Binh"
 warrior_setites_maa_flavor: "#F Không phải mọi Tín Đồ của Set đều là những kẻ quyến rũ lưỡi chẻ, kín đáo. Một số trong họ ưa chuộng con đường thượng võ hơn, trở thành chiến binh thánh cho vị thần của mình. Setite Chiến Binh từ bỏ Obfuscate Discipline để theo Potence – chẳng còn lén lút trong bóng tối cho những con rắn này. Họ là những chiến binh kiêu hãnh và tàn bạo phụng sự Set, sẵn lòng xông pha trận mạc để yểm trợ cho các đồng đạo kín đáo hơn của mình. #!"
 lions_rodrigo_maa: "Sư Tử của Rodrigo"
 lions_rodrigo_maa_flavor: "#F Tận hiến cho sự nghiệp Tái Chinh Phục Bóng Tối, những "hiệp sỹ" này muốn tiêu diệt hoàn toàn mọi [Glossary('Ashirra','game_concept_ashirra_desc')] trên bán đảo Iberia. Sự tàn nhẫn của họ đã mang lại nhiều chiến thắng nhưng cũng tạo ra nhiều kẻ thù bất tử, và không chỉ trong hàng ngũ Ashirra.#!"

 knights_templar_maa: "Hiệp Sỹ Templar"
 knights_templar_maa_flavor: "#F Dù bị chi phối bởi vô số ảnh hưởng siêu nhiên cạnh tranh nhau, các Templar vẫn là một lực lượng chiến đấu đáng gờm.#!"
 knights_hospitaler_maa: "Hiệp Sỹ Cứu Tế"
 knights_hospitaler_maa_flavor: "#F Lý tưởng về "hiệp sỹ thập tự chinh đức hạnh" đã ăn sâu trong Dòng Tu Bệnh Viện Thánh Gioan Jerusalem. Dù được ngưỡng mộ hay bị chê trách, họ vẫn là những chiến binh đáng kính nể.#!"
 teutonic_knights_maa: "Hiệp Sỹ Teuton"
 teutonic_knights_maa_flavor: "#F Các Thập Tự Quân Phương Bắc nổi tiếng tham lam và cuồng tín tàn nhẫn. Dù vậy, sức bền bỉ của họ gần như vô song trong hàng ngũ chiến binh của Chúa.#!"
 knights_calatrava_maa: "Hiệp Sỹ Calatrava"
 knights_calatrava_maa_flavor: "#F Dòng tu quân sự Tây Ban Nha này là đồng minh kiên định của cuộc Tái Chinh Phục Kitô giáo, dù đôi khi bị dẫn dắt lầm đường bởi những kẻ âm mưu trong bóng tối quanh các vua chúa Iberia.#!"
 knights_livonia_maa: "Hiệp Sỹ Livonia"
 knights_livonia_maa_flavor: "#F Những Kiếm Sỹ Livonia rộng mở với người thuộc mọi đẳng cấp. Điều này đã giúp số lượng của họ tăng vọt nhưng chất lượng (và phẩm hạnh đạo đức) của dòng tu đã sa sút khá nhiều vì lựa chọn này.#!"
 knights_st_thomas_maa: "Hiệp Sỹ Thánh Thomas thành Acre"
 knights_st_thomas_maa_flavor: "#F Dòng tu quân sự Anh nhỏ bé này chịu áp lực từ Giáo Hội buộc phải sáp nhập với Templar hoặc Hiệp Sỹ Cứu Tế. Nó đã tìm được sự che chở trong Tòa Dị Giáo Bóng Tối nhờ những cuộc điều tra riêng của mình về siêu nhiên tại Đất Thánh.#!"
 knights_st_catherine_maa: "Hiệp Sỹ Thánh Catherine thành Sinai"
 knights_st_catherine_maa_flavor: "#F Dòng tu đang suy tàn này gần như bị xóa sổ bởi những cuộc tấn công kỳ lạ nhưng chết chóc trong những thập kỷ gần đây. Nhận thấy dấu hiệu can thiệp của siêu nhiên, Tòa Dị Giáo Bóng Tối đã che chở cho tàn dư kiệt quệ của họ.#!"
 knights_st_helena_maa: "Nữ Hiệp Sỹ Thánh Helena"
 knights_st_helena_maa_flavor: "#F Dòng tu tự phong này không có sự chuẩn thuận của Giáo Hội. Bị khinh miệt và chế giễu bởi trật tự chính thống, danh tiếng đức hạnh của họ đã giúp họ thoát khỏi sự chống đối, nhưng nỗi bất bình về sự tồn tại của họ đang tăng lên từng ngày, với phần thưởng nay được treo cho bất kỳ hiệp sỹ nào loại bỏ (đôi khi bằng vũ lực) một số phụ nữ ngoan cố này vào các tu viện.#!"
 twilight_light_footmen_maa: "Biệt Kích Hoàng Hôn"
 twilight_light_footmen_maa_flavor: "#F Đơn vị du kích tinh nhuệ của một lãnh chúa đầy tham vọng muốn chứng tỏ mình là bậc thầy của các Chiến Tranh Hoàng Hôn.#!"
 midnight_light_footmen_maa: "Biệt Kích Nửa Đêm"
 midnight_light_footmen_maa_flavor: "#F Một đám bộ binh huấn luyện sơ sài được tung vào quân địch khi không còn e dè gì nữa. Chủ yếu dùng để gây phân tán hoặc áp đảo bằng số đông.#!"
 twilight_archers_maa: "Cung Thủ Hoàng Hôn"
 twilight_archers_maa_flavor: "#F Những xạ thủ tinh nhuệ của một bậc thầy Chiến Tranh Hoàng Hôn, sẵn sàng bảo vệ lãnh chúa của mình trong các cuộc thách đấu chính thức hay trên chiến trường.#!"
 midnight_archers_maa: "Cung Thủ Nửa Đêm"
 midnight_archers_maa_flavor: "#F Trong cảnh hỗn loạn của các Chiến Tranh Nửa Đêm, đôi khi chỉ cần đưa cho ai đó một cây cung và chỉ về hướng chung của kẻ địch là đủ tốt rồi.#!"
 twilight_light_horsemen_maa: "Kỵ Binh Nhẹ Hoàng Hôn"
 twilight_light_horsemen_maa_flavor: "#F Các bậc thầy Chiến Tranh Hoàng Hôn triển khai các đơn vị kỵ binh nhẹ để đạt hiệu quả to lớn, sử dụng tốc độ và chiến thuật đánh nhanh rút gọn không ai sánh bằng.#!"
 midnight_light_horsemen_maa: "Kỵ Binh Nhẹ Nửa Đêm"
 midnight_light_horsemen_maa_flavor: "#F Đánh vu hồi bằng một đơn vị kỵ binh nhẹ đông đảo luôn có thể hiệu quả, ngay cả khi đám kỵ binh nhẹ đó được tập hợp vội vàng.#!"
 twilight_pikemen_maa: "Giáo Binh Hoàng Hôn"
 twilight_pikemen_maa_flavor: "#F Cận vệ tinh nhuệ gồm những kẻ dày dạn kinh nghiệm trong các Chiến Tranh Hoàng Hôn, những chiến binh này đã trau dồi kỹ năng lên đến trình độ gần như siêu nhiên.#!"
 midnight_pikemen_maa: "Giáo Binh Nửa Đêm"
 midnight_pikemen_maa_flavor: "#F Một đám nông dân cầm chĩa được ném vào quân địch với hy vọng có điều gì đó tốt đẹp xảy ra (cho chủ nhân bí mật của họ, không phải cho bản thân họ).#!"
 twilight_armored_footmen_maa: "Bộ Binh Hoàng Hôn"
 twilight_armored_footmen_maa_flavor: "#F Những con tốt trên bàn cờ của một Chiến Chủ Hoàng Hôn. Những con tốt được trang bị giáp rất tốt và rất thiện chiến, nhưng vẫn chỉ là những con tốt.#!"
 midnight_armored_footmen_maa: "Bộ Binh Nửa Đêm"
 midnight_armored_footmen_maa_flavor: "#F Áo giáp chất lượng tốt dư thừa kết hợp với sự thiếu kỹ năng và huấn luyện dẫn đến... kết quả lẫn lộn.#!"
 twilight_armored_horsemen_maa: "Kỵ Binh Giáp Nặng Hoàng Hôn"
 twilight_armored_horsemen_maa_flavor: "#F Đòn kết liễu trong bất kỳ Chiến Tranh Hoàng Hôn nào thường được giáng xuống bởi những chiến binh tinh nhuệ này, được trang bị những gì tốt nhất mà lãnh chúa của họ có thể cung cấp.#!"
 midnight_armored_horsemen_maa: "Kỵ Binh Giáp Nặng Nửa Đêm"
 midnight_armored_horsemen_maa_flavor: "#F Một cuộc xung phong hoành tráng có thể xoay chuyển cục diện của nhiều Chiến Tranh Nửa Đêm. Đáng buồn thay, những kỵ binh này được trang bị tốt hơn nhiều so với mức được huấn luyện.#!"
 massghouls_maa: "Đám Ghoul Ô Hợp"
 massghouls_maa_flavor: "#F Một đám người phàm vội vã được cho uống máu ma cà rồng rồi chỉ về phía kẻ địch gần nhất. Kết quả có thể khác nhau.#!"
 
 lesser_ushabti_maa: "Ushabti Hạ Đẳng"
 lesser_ushabti_maa_flavor: "#F Những tượng nhỏ hình sinh vật bé như chuột hay chim sẻ. Trí thông minh và khả năng chiến đấu hạn chế của chúng được bù đắp bằng sự dễ dàng trong việc tạo ra chúng.#!"
 medium_ushabti_maa: "Ushabti Trung Đẳng"
 medium_ushabti_maa_flavor: "#F Những tượng hình sinh vật cỡ trung như mèo, chó hay rắn hổ mang. Chúng trung thành và bền bỉ hơn các sinh vật hạ đẳng nhưng khó chế tạo hơn.#!"
 overseer_ushabti_maa: "Ushabti Giám Sát"
 overseer_ushabti_maa_flavor: "#F Một dạng gia nhân thông minh hơn, Ushabti Giám Sát có khả năng chỉ huy các đồng loại hạ đẳng của mình, khiến chúng trở thành thành phần trọng yếu trong đội hình chiến đấu của một Mummy.#!"
 great_ushabti_maa: "Ushabti Vĩ Đại"
 great_ushabti_maa_flavor: "#F Ushabti cao lớn sừng sững, có khi ngang tầm một con voi, những cỗ máy quý hiếm và trân quý này có khả năng đập tan đội hình địch dễ như trở bàn tay.#!"
 guard_ushabti_maa: "Ushabti Cận Vệ"
 guard_ushabti_maa_flavor: "#F Những kẻ canh giữ các lăng mộ Mummy quyền lực nhất, loại cỗ máy này nổi tiếng vì sự bền bỉ và khả năng phục hồi khó tin.#!"
 terracottan_fodder_maa: "Chiến Binh Đất Nung"
 terracottan_fodder_maa_flavor: "#F Thấp kém nhất trong đội quân bất tử của Tần Thủy Hoàng, làm nền tảng cho đội quân tượng đất nung của một Mummy.#!"
 terracottan_warriors_maa: "Vũ Sỹ Đất Nung"
 terracottan_warriors_maa_flavor: "#F Những chiến binh lừng danh trong đội quân bất tử của Tần Thủy Hoàng, nay phụng sự ý chí của một Mummy Phương Đông.#!"
 terracottan_scouts_maa: "Chiến Xa Đất Nung"
 terracottan_scouts_maa_flavor: "#F Dù kiểu chiến tranh mà chúng từng phát huy sở trường đã lùi vào dĩ vãng từ lâu, hiệu quả của những tượng này vẫn còn thừa sức hữu dụng.#!"
 terracottan_knights_maa: "Kỵ Binh Đất Nung"
 terracottan_knights_maa_flavor: "#F Ngay cả ngựa cũng có tượng riêng của mình, sẵn sàng được triệu hồi lặp đi lặp lại để tuân theo mệnh lệnh của chủ nhân bất tử.#!"
 terracottan_guards_maa: "Dũng Sỹ Đất Nung"
 terracottan_guards_maa_flavor: "#F Những gì tinh hoa nhất từng thuộc về đội quân vĩ đại nhất từng tồn tại, nay chỉ còn là những tượng đất nung phục vụ theo ý chí của hậu duệ Bát Tiên.#!"
 ravnos_kshatriya_maa: "Ravnos Kshatriya"
 ravnos_kshatriya_maa_flavor: "#F Đẳng cấp chiến binh của Ravnos đã bị cuốn vào một cuộc chiến toàn diện chống lại [Glossary('Asuratizayya','game_concept_kuei_jin_desc')] từ lâu đến mức không ai còn nhớ nổi. Điều này đã tôi luyện họ thành những chiến binh mạnh mẽ và kỷ luật.#!"
 lamia_warmaidens_maa: "Lamia Gorgon"
 lamia_warmaidens_maa_flavor: "#F Những nữ chiến binh của Lilith chiến đấu điên cuồng, dù là để bảo vệ những kẻ được Cappadocian bảo trợ hay vì vinh quang của Mẹ Bóng Tối.#!"
 agitators_maa: "Brujah Kích Động"
 agitators_maa_flavor: "#F Ban đầu được đặt theo tên đội quân nổi loạn (và cả trộm cướp) của Robin Leeland, Những Kẻ Kích Động đã trở thành thuật ngữ chung chỉ những Brujah muốn lật đổ trật tự hiện hành.#!"
 corsairs_lasombra_maa: "Cướp Biển Lasombra"
 corsairs_lasombra_maa_flavor: "#F Mọi Lasombra đều cảm nhận được tiếng gọi của biển cả vào một thời điểm nào đó trong đời bất tử của mình. Hầu hết đáp lại nó bằng sự ngạo nghễ, gươm trong tay khi họ đột kích lên các con tàu khác dưới màn đêm che chở.#!"
 salubri_warriors_maa: "Salubri Chiến Binh"
 salubri_warriors_maa_flavor: "#F Đàn con của Samiel đã chiến đấu chống lại cái ác từ đêm đầu tiên chúng được tạo ra. Thủ lĩnh của họ có thể đã ra đi, nhưng bổn phận của họ vẫn tiếp diễn.#!"
 web_assassins_maa: "Sát Thủ Mạng Lưới Đao Kiếm"
 web_assassins_maa_flavor: "#F Mạng Lưới Đao Kiếm bí mật hiếm khi ra trận. Nhưng khi thực sự cần thiết, họ trở thành những chiến binh chuyên biệt đáng lo ngại về hiệu quả.#!"
 tmr_column_maa: "Cột Trụ Ma Cà Rồng"
 tmr_column_maa_flavor: "#F Cột Trụ là đơn vị cơ bản của các hoạt động Black Hand. Được hình thành và dẫn dắt bởi các dominion, cột trụ mang tính thường trực nhưng quy mô thay đổi. Các dominion tập hợp những liên minh gồm nhiều đội đặc nhiệm (gọi là kamut) gồm khoảng chục đặc vụ, tùy theo yêu cầu nhiệm vụ.#!"
 ravnos_purified_maa: "Những Kẻ Được Thanh Tẩy"
 ravnos_purified_maa_flavor: "#F Một giáo phái cực đoan của Ravnos tận hiến chống lại các mối đe dọa siêu nhiên, Những Kẻ Được Thanh Tẩy là bậc thầy chiến tranh du kích.#!"
 ghouled_cultists: "Cuồng Tín Đồ Bị Ghoul Hóa"
 ghouled_cultists_flavor: "#F Người phàm tận trung cuồng tín với Thần Cainite của mình, được ban máu như phần thưởng tối thượng cho lòng tận hiến trọn vẹn.#!"
 anda_jagun_maa: "Anda Jagun"
 anda_jagun_maa_flavor: "#F Một đơn vị quân Mông Cổ gồm 100 người, Jagun này được tăng cường bởi các thành viên dòng máu [Glossary('Anda','podgloss.anda')], khiến các cung kỵ binh ấy càng thêm tiếng tăm đáng sợ hơn thường lệ.#!"

 the_leviathan: "Leviathan"
 the_leviathan_flavor: "#F Leviathan được mô tả như một cơn thủy triều bóng tối, một binh đoàn xúc tu với gọng kìm bằng đá. Bóng tối là sức mạnh của nó, và khi nó tóm lấy nạn nhân, sự đen tối trở nên trọn vẹn. Những kẻ bất hạnh bị cỗ máy ấy ôm siết có thể nghe thấy tiếng thét gào và tiếng vọng bị giam cầm của tuyệt vọng, cất lên từ lâu bởi những kẻ sám hối bị tra tấn.#!"
 army_of_leviathans: "Leviathan"

 the_dragon_kung_kung: "Cung Cung"
 the_dragon_kung_kung_flavor: "#F Vị thần rồng vĩ đại Cung Cung, kẻ từng làm gãy đổ Trụ Trời và nhấn chìm thế gian trong lũ lụt. Ngài là bạn thân của Wan Kung Yi và đã giúp đỡ ông trong trận chiến cuối cùng định mệnh chống lại toàn thể siêu nhiên tề tựu. Từ đó không ai còn thấy ngài nữa, dường như đang chờ đợi một linh hồn xứng đáng với bạn mình xuất hiện một lần nữa.#!"

 celestial_army: "Thiên Binh"
 celestial_army_flavor: "#F Đội quân hùng mạnh của các thợ săn quỷ, từng được tập hợp để báo thù cho cái chết của Wan Kung Yi. Dù họ đã đánh mất mục tiêu và trở nên chai sạn, tài nghệ chiến đấu của họ chưa bao giờ bị nghi ngờ.#!"
 
 pharaohs_sentry: "Cận Vệ Pharaoh"
 pharaohs_sentry_flavor: "#F Cận Vệ Pharaoh là những xác chết hồi sinh vô cảm, mãi mãi phụng sự sắc lệnh của pháp sư, đóng vai trò chiến binh và lính canh cảnh giác không hề áy náy khi giết chóc, cũng chẳng sợ hãi khi bỏ mạng trong khi thi hành nhiệm vụ.#!"
 
 sheddim_maa: "Sheddim"
 sheddim_maa_flavor: "#F Những thực thể bí ẩn đến "từ thế giới khác". Chúng dường như được tạo thành từ lửa nhưng có tri giác và mang trong mình mối hận thù cháy bỏng đối với Tạo Vật của Chúa.#!"

 stone_lions: "Sư Tử Đá"
 stone_lions_flavor: "#F Những linh thú canh giữ đền thờ và miếu mạo đã được Kẻ Đói Khát ban cho sự sống.#!"

 illusionary_combatants: "Chiến Binh Ảo Ảnh"
 illusionary_combatants_flavor: "#flavor Một ảo ảnh về những chiến binh trang bị giáp nặng, có khả năng thu hút sự chú ý về phía chúng một cách hiệu quả.#!"
 
 black_crows_maa: "Quạ Đen"
 black_crows_maa_flavor: "#F Đội biệt kích sát thủ riêng của Yidu. Gồm những người phàm tận trung và các Erk trẻ tuổi, Quạ Đen từ bỏ giáp nặng để đổi lấy tốc độ và sự chết chóc.#!

 dragon_fiends_maa: "Ác Long"
 dragon_fiends_maa_flavor: "#F Những Tzimisce nhào nặn thịt da này thích thú theo dõi xem kẻ địch của chúng chịu đựng được bao lâu trước sự biến dạng liên tục của chính da thịt mình.#!"
 
 knights_jordi_alfama_maa: "Hiệp Sỹ Sant-Jordi d’Alfama"
 knights_jordi_alfama_maa_flavor: "#F Thành lập tại Aragon năm 1201, dòng tu này giúp cai quản Majorca sau khi Aragon chiếm được nó. Thị Tộc Lasombra có chỗ đứng vững chắc trong dòng tu, gây ảnh hưởng lớn thông qua các ghoul cấp cao.#!"

 