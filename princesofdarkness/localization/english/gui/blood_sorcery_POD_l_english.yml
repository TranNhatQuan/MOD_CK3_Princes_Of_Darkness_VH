 POD_bloodmagic_events.3.t: "[Localize(Concatenate3('ritual_',ROOT.Var('current_journey').Var('ritual').GetFlagKey,'_name'))]"
 POD_bloodmagic_events.3.desc: "Ngay cả sau nhiều thế kỷ thí nghiệm, muôn vàn nghi lễ được $pod_cainites$ phát triển trên khắp thế giới đều được xây dựng trên cùng một nền tảng. Cho dù các nghi thức này bắt nguồn từ Thaumaturgy, Sorcery, Necromancy, hay những pháp thuật kỳ lạ hơn, tất cả đều triệu gọi sức mạnh của #R máu#!.\n\nTrong độ sâu thẳm đỏ thẫm nhất của bản thể mình, những Cainite này tìm thấy sức mạnh: một sức mạnh thô sơ chờ được đưa ra ánh sáng. Bằng ý chí của mình, những Cainite này lôi kéo sức mạnh này, giằng co và gào thét, ra khỏi bóng tối để thực hiện những kỳ tích phi thường. Các nghi lễ đã được phát triển để dẫn dắt và hội tụ lực lượng mới này, không bị ràng buộc bởi cấu trúc của các [Glossary('Disciplines','game_concept_discipline_desc')] đã được biết đến.\n\nChỉ một từ duy nhất có thể miêu tả sức mạnh đã vang vọng suốt bao thời đại này:\n\nMa Thuật."
 POD_bloodmagic_events.3.a: "Ta khuấy động huyết mạch của mình và bắt đầu..."
