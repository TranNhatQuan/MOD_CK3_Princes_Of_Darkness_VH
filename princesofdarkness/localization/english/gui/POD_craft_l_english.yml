 custom_lungin_artifact_name: "Lungin"
 custom_lungin_artifact_desc: "Một ống điếu gỗ cùng nhiều loại thảo mộc khác nhau. Những loại thảo mộc này có thể được hun để làm dịu tâm trí."
 custom_arrows_of_the_sun_artifact_name: "Mũi Tên Mặt Trời"
 custom_arrows_of_the_sun_artifact_desc: "Đây là những mũi tên chứa đựng tinh túy của Mặt Trời và được trang trí bằng vàng. Chúng được phú cho những mảnh vụn của một Linh Hồn Mặt Trời. Các mũi tên bùng cháy sau khi trúng mục tiêu, gây ra sát thương khủng khiếp."
 custom_thunder_dart_artifact_name: "Phi Tiêu Sấm Sét"
 custom_thunder_dart_artifact_desc: "Thứ vũ khí uy lực này to bằng bất kỳ phi tiêu thường nào, nhưng chết chóc hơn nhiều. Khi phóng vào kẻ địch, nó đánh trúng với sức mạnh của một tia sét, gây sát thương sấm sét lên kẻ thù và cả khu vực xung quanh. Những mũi phi tiêu này được chế tác từ xương của một con quái vật và gắn lông vũ sặc sỡ, sau đó một Linh Hồn Sấm Sét hoặc Mưa được dụ vào bên trong mũi phi tiêu."
 custom_edge_of_the_sun_artifact_name: "[fetish_artifact_icon]Lưỡi Kiếm Mặt Trời"
 custom_edge_of_the_sun_artifact_desc: "Đây là một thứ vũ khí chết chóc mà người Mokolé mang theo để dùng trong các cuộc quyết đấu nghi lễ và các cuộc hành quyết. \"Chết dưới ánh vàng\" là một cách nói bóng gió ám chỉ kết cục bi thảm của những kẻ phạm luật. Cây mã tấu được đúc từ vàng ròng và điểm xuyết ngọc quý. Để tạo ra một lưỡi kiếm như vậy, vàng phải được nung chảy lúc bình minh rồi đúc thành lưỡi kiếm, được ếm bùa để có độ cứng của thép, sau đó ngọc quý phải được gắn vào chuôi gỗ tếch, và toàn bộ được phú cho một Linh Hồn Chiến Tranh."
 custom_blade_of_the_kings_artifact_name: "[fetish_artifact_icon]Lưỡi Kiếm Của Các Vương"
 custom_blade_of_the_kings_artifact_desc: "#bold Chuyển toàn bộ sát thương thành [POD_aggravated_damage|E] khi chống lại những nhân vật có [prowess|E] thấp hơn [artifact_power_with_icon|E] của lưỡi kiếm này.#!\n\nMột thanh kiếm cổ xưa từng được các Mokolé thời xưa sử dụng. Các Vương Thằn Lằn trưởng lão sẽ ngủ Giấc Ngủ Của Rồng với thứ vũ khí này bên mình. Lưỡi kiếm biến hình để phù hợp với người mang nó; khi Mokolé biến thành Archid, Lưỡi Kiếm Của Các Vương cũng biến đổi để khớp với hình dạng to lớn mới của người mang nó. Những thứ vũ khí này được tạo ra bằng cách ràng buộc một linh hồn biến hình, chẳng hạn như Bươm Bướm hay Bạch Tuộc, vào vũ khí trong lúc nó được rèn. Với mỗi nhát rèn định hình kim loại hay đá của lưỡi kiếm, người thợ rèn phải xướng lên tên của linh hồn đó."


