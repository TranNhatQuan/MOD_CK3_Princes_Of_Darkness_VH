l_english:
 POD_fleshcrafting_tutorial: "Mỗi bộ phận cơ thể trong sáu bộ phận có hai lớp, #bold;clickable @flesh_icon!Da Thịt#! và #bold;clickable @bone_icon!Xương#! có thể bấm được. Mỗi bộ phận cơ thể chỉ có thể có một biến đổi cho mỗi lớp.\n\nMỗi biến đổi có một giá trị #bold;clickable @vicissitude_icon! Mức Độ Phức Tạp#!. Tỷ lệ thành công khi thay đổi biến đổi được xác định bởi tổng độ phức tạp của mọi bộ phận cơ thể so với #bold;clickable [learning_i]Học Thức#! của bạn và bất kỳ phần thưởng bổ sung nào bạn có.\n\nBấm vào một trong các ô bên trái để bắt đầu."

 # lowercase f for "fleshcrafting" since it looks better with that specific font
 POD_fleshcrafting_title: "nhào nặn thân xác: #bold [GetPlayer.MakeScope.Var('fleshcraft_target').Char.GetFirstNameNoTooltip]#!"

 fc_head: "Đầu"
 fc_torso: "Thân"
 fc_arm_r: "Tay Phải"
 fc_arm_l: "Tay Trái"
 fc_leg_r: "Chân Phải"
 fc_leg_l: "Chân Trái"
 fc_arms: "Tay"
 fc_legs: "Chân"

 fc_head_flesh: "Đầu, @flesh_icon!Da Thịt#!"
 fc_head_bone: "Đầu, @bone_icon!Xương#!"
 fc_torso_flesh: "Thân, @flesh_icon!Da Thịt#!"
 fc_torso_bone: "Thân, @bone_icon!Xương#!"
 fc_arm_r_flesh: "Tay Phải, @flesh_icon!Da Thịt#!"
 fc_arm_r_bone: "Tay Phải, @bone_icon!Xương#!"
 fc_arm_l_flesh: "Tay Trái, @flesh_icon!Da Thịt#!"
 fc_arm_l_bone: "Tay Trái, @bone_icon!Xương#!"
 fc_leg_r_flesh: "Chân Phải, @flesh_icon!Da Thịt#!"
 fc_leg_r_bone: "Chân Phải, @bone_icon!Xương#!"
 fc_leg_l_flesh: "Chân Trái, @flesh_icon!Da Thịt#!"
 fc_leg_l_bone: "Chân Trái, @bone_icon!Xương#!"

 POD_fleshcrafting_flesh_unassigned: "#italic Bấm để nhào nặn @flesh_icon!Da Thịt#!"
 POD_fleshcrafting_bone_unassigned: "#italic Bấm để nhào nặn @bone_icon!Xương#!"
 POD_fleshcraft_modify_layer: "#I Bấm để biến đổi lớp này\nBấm chuột phải để xóa lựa chọn#!"
 POD_fleshcrafting_selected_layer: "Đang biến đổi: [GetPlayer.MakeScope.Var('fc_selected_layer').GetFlagName]"
 POD_fleshcrafting_layer_confirm: "Chọn một biến đổi để tiếp tục"
 POD_fleshcrafting_button_clear: "#I Bấm để xóa mọi biến đổi đã chọn#!"
 # invisible bullet so that the text is aligned with the other invisible bullets from the custom_tooltips in POD_fleshcrafting_list_all_perk_effects_on_character
 # this necessary trust me bro
 POD_fleshcrafting_button_reset: "#color:{0.0,0.0,0.0,0.0} $EFFECT_LIST_BULLET$#!#I Bấm để áp dụng lại các nhào nặn thân xác hiện tại của [GetPlayer.MakeScope.Var('fleshcraft_target').Char.GetFirstNamePossessive]#!\n\n#color:{0.0,0.0,0.0,0.0} [GetScriptedGui('POD_fleshcrafting_trait_tooltip').BuildTooltip( GuiScope.AddScope('character',GetPlayer.MakeScope.Var('fleshcraft_target').Char.MakeScope).End )]#!"

 POD_fleshcrafting_perk_name: "[Perk.GetNameNoTooltip( GetPlayer.MakeScope.Var('fleshcraft_target').Char.Self )]: @vicissitude_icon! #bold [EmptyScope.ScriptValue(Concatenate(Scope.GetFlagKey,'_complexity'))|0]#!"
 POD_fleshcrafting_perk_complexity: "@vicissitude_icon! #bold [EmptyScope.ScriptValue(Concatenate(Scope.GetFlagKey,'_complexity'))|0]#!"

 POD_fleshcrafting_total_complexity: "Tổng Độ Phức Tạp: @vicissitude_icon! [GetPlayer.MakeScope.ScriptValue('POD_fleshcrafting_current_complexity')|0]"
 # colors interpolated between red -> green as the success chance goes up
 POD_fleshcrafting_success_chance_tt: "Tỷ Lệ Thành Công: #color:{[Lerp_CFixedPoint( '(CFixedPoint)1.0', '(CFixedPoint)0.2', GetPlayer.MakeScope.ScriptValue('POD_fleshcrafting_success_chance_decimal') )],[Lerp_CFixedPoint( '(CFixedPoint)0.2', '(CFixedPoint)0.7', GetPlayer.MakeScope.ScriptValue('POD_fleshcrafting_success_chance_decimal') )],0.2} [GetPlayer.MakeScope.ScriptValue('POD_fleshcrafting_success_chance')|0]% #!"

 POD_fleshcrafting_success: "Khi thành công"
 POD_fleshcrafting_failure: "Khi thất bại"
 POD_fleshcrafting_success_message: "Nhào Nặn Thân Xác Thành Công"
 POD_fleshcrafting_failure_message: "Nhào Nặn Thân Xác Thất Bại"
 POD_fleshcrafting_torture_consequences: "@warning_icon!#X Vì [TARGET_CHARACTER.GetFirstName] không phải là [ghoul|E] của bạn, [TARGET_CHARACTER.GetSheHe] sẽ coi đây là hành vi [torture|E]#!"

 POD_fleshcrafting_confirm: "Nhào Nặn Thân Xác"

 POD_fleshcrafting_need_to_select_perk: "Bạn cần biến đổi ít nhất một bộ phận cơ thể"

