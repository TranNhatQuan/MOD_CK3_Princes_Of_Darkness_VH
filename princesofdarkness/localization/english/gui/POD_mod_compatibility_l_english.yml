l_english:
 pod_mod_compatibility_header: "#bold;beast CẢNH BÁO: MOD KHÔNG TƯƠNG THÍCH#!"

 pod_mod_compatibility_character: "Một trong các mod của bạn đang ghi đè tệp:\n\n#bold /gui/window_character.gui#!\n\nĐiều này sẽ gây ra nhiều vấn đề với cửa sổ nhân vật, bao gồm nhưng không giới hạn ở: mất nút bấm, thông tin nhân vật bị thiếu hoặc hiển thị sai, hoặc mất quan hệ.\n\nChúng tôi khuyến cáo mạnh mẽ nên gỡ bỏ các mod khác cho đến khi cảnh báo này không còn hiển thị."
 pod_mod_compatibility_hud: "Một trong các mod của bạn đang ghi đè tệp:\n\n#bold /gui/hud.gui#!\n\nĐiều này sẽ gây ra vấn đề với HUD, như mất nút bấm ở thanh bên.\n\nChúng tôi khuyến cáo mạnh mẽ nên gỡ bỏ các mod khác cho đến khi cảnh báo này không còn hiển thị."
 pod_mod_compatibility_county: "Một trong các mod của bạn đang ghi đè tệp:\n\n#bold /gui/window_county_view.gui#!\n\nTệp này cần thiết để duy trì các script công trình của chúng tôi.\n\nChúng tôi khuyến cáo mạnh mẽ nên gỡ bỏ các mod khác cho đến khi cảnh báo này không còn hiển thị."
 pod_mod_compatibility_interaction: "Một trong các mod của bạn đang ghi đè tệp:\n\n#bold /gui/interaction_menu_window.gui#!\n\nTệp này đảm bảo có thanh cuộn khi một nhân vật có quá nhiều tương tác nhân vật khả dụng.\n\nChúng tôi khuyến cáo mạnh mẽ nên gỡ bỏ các mod khác cho đến khi cảnh báo này không còn hiển thị."
 pod_mod_compatibility_lifestyle: "Một trong các mod của bạn đang ghi đè tệp:\n\n#bold /gui/window_character_lifestyle.gui#!\n\nTệp này đảm bảo có thanh cuộn cho các cây Lối sống lớn.\n\nChúng tôi khuyến cáo mạnh mẽ nên gỡ bỏ các mod khác cho đến khi cảnh báo này không còn hiển thị."
 pod_mod_compatibility_domicile: "Một trong các mod của bạn đang ghi đè tệp:\n\n#bold /gui/window_domicile.gui#!\n\nTệp này cần thiết để duy trì các công trình Nơi Ẩn Náu khi chuyển đổi chính thể hoặc chuyển từ không lãnh địa <-> có lãnh địa.\n\nChúng tôi khuyến cáo mạnh mẽ nên gỡ bỏ các mod khác cho đến khi cảnh báo này không còn hiển thị."
 
