 #
 #quincunx_edict_tax_modifier: "Đã Cổ Vũ Chiến Tranh Hoàng Hôn"
 #quincunx_edict_tax_modifier_desc: "Chiến Tranh Hoàng Hôn là cách thức tao nhã hơn để tiến hành chiến tranh ngầm giữa các [GetTrait('kueijin').GetName( GetNullCharacter )], và có lẽ cũng thú vị hơn. Về nhiều mặt, nó giống một cuộc đấu tay đôi hơn là một cuộc chiến. Các bên giao tranh tuân theo những quy tắc ứng xử đã định, và một bên trung lập được mời đến để phân xử tranh chấp. Mục tiêu không phải là tàn phá lãnh địa của đối phương, mà là hoàn thành một mục tiêu cụ thể — như ám sát một lãnh chúa có giá trị, hay buộc một lãnh đạo chính trị được lòng dân thoái vị — với càng nhiều chiến lược và sự khéo léo càng tốt."
 #quincunx_edict_army_modifier: "Đã Cổ Vũ Chiến Tranh Nửa Đêm"
 #quincunx_edict_army_modifier_desc: "Chiến Tranh Nửa Đêm là cách thức tàn bạo hơn để tiến hành chiến tranh ngầm giữa các [GetTrait('kueijin').GetName( GetNullCharacter )] — một cuộc thù hận mà mỗi bên dùng mọi chiến thuật có thể để tiêu diệt bên kia, không khoan nhượng. Chiến Tranh Nửa Đêm phải được tuyên bố công khai, trước mặt một Tổ Tiên cấp cao; nhưng khi đã tuyên bố, không có cách nào danh dự để kết thúc nó, ngoại trừ một số nghi thức."