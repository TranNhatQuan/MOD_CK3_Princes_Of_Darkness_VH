 umbra_discovery_dah: "Linh Hồn Cố Vấn"
 umbra_discovery.dah.desc: "$umbra_discovery_finder$ đã tìm thấy manh mối về một linh hồn thông thái đang ở tại $umbra_discovery_region$ xứng đáng cho một [umbra_expedition|E]"
 umbra_discovery_coruroc: "Coruroc"
 umbra_discovery.coruroc.desc: "$umbra_discovery_finder$ đã nghe về một oan hồn người sói lạ lùng lang thang tại $umbra_discovery_region$ xứng đáng cho một [umbra_expedition|E]"
 umbra_discovery_aidan_farwatcher: "Aidan Farwatcher"
 umbra_discovery.aidan_farwatcher.desc: "$umbra_discovery_finder$ đã nghe về một linh hồn tổ tiên kỳ lạ không thuộc bộ lạc nào đang lang thang tại $umbra_discovery_region$ xứng đáng cho một [umbra_expedition|E]"
 umbra_discovery_aristotle: "Aristotle"
 umbra_discovery.aristotle.desc: "$umbra_discovery_finder$ đã nghe rằng nhà triết học lừng danh Aristotle đang ghé thăm $umbra_discovery_region$ xứng đáng cho một [umbra_expedition|E]"
 umbra_discovery_hypatia: "Hypatia"
 umbra_discovery.hypatia.desc: "$umbra_discovery_finder$ đã nghe rằng vị lãnh đạo tinh thần của Mouseion [umbra|E] đang ghé thăm $umbra_discovery_region$ xứng đáng cho một [umbra_expedition|E]"
 umbra_discovery_mahfuz_alam: "Mahfuz Alam"
 umbra_discovery.mahfuz_alam.desc: "$umbra_discovery_finder$ đã nghe rằng chiến binh oan hồn lừng danh Mahfuz Alam đang ghé thăm $umbra_discovery_region$ xứng đáng cho một [umbra_expedition|E]"
 umbra_discovery_muse_expedition: "Triều Đình Nàng Thơ"
 umbra_discovery.muse_expedition.desc: "$umbra_discovery_finder$ đã khám phá ra $umbra_discovery_region$ huyền thoại. Bạn đã được chính các nàng thơ mời gọi, một sự thật xứng đáng cho một [umbra_expedition|E]"
 umbra_discovery_elemental_court_armor_expedition: "Giáp Nguyên Tố"
 umbra_discovery.elemental_court_armor_expedition.desc: "$umbra_discovery_finder$ đã khám phá ra $umbra_discovery_region$ huyền thoại. Tìm thấy một hiện vật thú vị tại Triều Đình Nguyên Tố Đất, $umbra_discovery_finder$ giờ đang thỉnh cầu tổ chức một [umbra_expedition|E] đúng nghĩa để điều tra."
 umbra_discovery_elemental_court_armor_expedition2: "Giáp Nguyên Tố"
 umbra_discovery.elemental_court_armor_expedition2.desc: "$umbra_discovery_finder$ đã khám phá ra $umbra_discovery_region$ huyền thoại, chính xác hơn là Triều Đình Nguyên Tố Lửa. Một [umbra_expedition|E] để cải thiện Giáp Nguyên Tố của bạn có thể là một triển vọng đáng giá lúc này."
 umbra_discovery_elemental_court_armor_expedition3: "Giáp Nguyên Tố"
 umbra_discovery.elemental_court_armor_expedition3.desc: "$umbra_discovery_finder$ đã khám phá ra $umbra_discovery_region$ huyền thoại, chính xác hơn là Triều Đình Nguyên Tố Nước. Một [umbra_expedition|E] để cải thiện Giáp Nguyên Tố của bạn có thể là một triển vọng đáng giá lúc này."
 umbra_discovery_elemental_court_armor_expedition4: "Giáp Nguyên Tố"
 umbra_discovery.elemental_court_armor_expedition4.desc: "$umbra_discovery_finder$ đã khám phá ra $umbra_discovery_region$ huyền thoại, chính xác hơn là Triều Đình Nguyên Tố Khí. Một [umbra_expedition|E] để cải thiện Giáp Nguyên Tố của bạn có thể là một triển vọng đáng giá lúc này."
 umbra_discovery_grand_hall_expedition: "Nhà Thám Hiểm Umbra"
 umbra_discovery.grand_hall_expedition.desc: "Trong khi khám phá $umbra_discovery_region$ như mê cung, $umbra_discovery_finder$ đã được một linh hồn thân thiện tiếp cận, đề nghị phục vụ cho việc khám phá tiếp theo. Lời đề nghị này có thể xứng đáng cho một [umbra_expedition|E]"
 umbra_discovery_heaven_expedition: "Cầu Thang Lên Thiên Đường"
 umbra_discovery.heaven_expedition.desc: "Trong khi khám phá những vùng xa xôi nhất của Deep Umbra, $umbra_discovery_finder$ tìm thấy một cánh cổng sáng chói bằng ngọc trai nóng chảy. Một luồng sáng trắng tỏa ra từ rào chắn, tắm họ trong sự an ủi khôn tả. Họ không được phép bước vào nhưng có lẽ Đức Tin không khoan nhượng của bạn có thể đưa bạn tới nơi họ đã thất bại? Nếu vậy thì một [umbra_expedition|E] tới chính $umbra_discovery_region$ là điều nên làm."
 umbra_discovery_epiphamies_expedition: "Pháo Đài Của Sự Ngu Xuẩn Loài Người"
 umbra_discovery.epiphamies_expedition.desc: "Trong khi khám phá $umbra_discovery_region$, cõi giới của những khái niệm trừu tượng được ban cho hình hài, $umbra_discovery_finder$ tìm thấy một tòa lâu đài đồ sộ vang dội quyền năng. Dù có một bầu không khí bất an bao quanh nó, nó vẫn có thể xứng đáng cho một [umbra_expedition|E]."
 umbra_discovery_spirit: "Linh Hồn Lang Thang"
 umbra_discovery.spirit.desc: "$umbra_discovery_finder$ đã thấy một linh hồn lang thang tại $umbra_discovery_region$ xứng đáng cho một [umbra_expedition|E]"
 umbra_discovery_bane: "Tà Linh Lang Thang"
 umbra_discovery.bane.desc: "$umbra_discovery_finder$ đã thấy một Tà Linh lang thang tại $umbra_discovery_region$ xứng đáng cho một [umbra_expedition|E]"
 umbra_discovery_artifact_shards: "Artifact Shards"
 umbra_discovery.artifact_shards.desc: "$umbra_discovery_finder$ đã tìm thấy một kho Mảnh Hiện Vật trong $umbra_discovery_region$ đáng để thực hiện một [umbra_expedition|E]"
 umbra_discovery_mokole_dinosaur_maa: "Giấc Mơ Về Dã Thú"
 umbra_discovery.mokole_dinosaur_maa.desc: "$umbra_discovery_finder$ đã thấy thoáng qua bóng dáng một dã thú cổ đại trong $umbra_discovery_region$ đáng để thực hiện một [umbra_expedition|E]"
 umbra_discovery_grey: "Grey"
 umbra_discovery.grey.desc: "$umbra_discovery_finder$ đã thấy một automaton ngoài hành tinh lang thang trong $umbra_discovery_region$ đáng để thực hiện một [umbra_expedition|E]"
 umbra_discovery_celestial_dragons: "Rồng Thiên Giới"
