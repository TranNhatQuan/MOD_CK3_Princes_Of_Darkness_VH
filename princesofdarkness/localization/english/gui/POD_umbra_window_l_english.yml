 # Umbra Location
 
 umbra_realm_earth: "Trái Đất"
 umbra_realm_earth_desc: "Thế giới vật chất. Trong số các thế giới của thực tại "vững chắc" nằm trong Tellurian, Trái Đất thường được gọi là "Cõi Giới" ngụ ý vị thế cội nguồn của nó. Đấng thần thánh (celestine) của hành tinh này dĩ nhiên là Gaia, và bóng của Trái Đất được gọi là [UmbraGlossary('penumbra')].\n\n$POD_splat_werewolf_plural$ và các loài biến hình khác gọi nó là "[Glossary('Gaia Realm','game_concept_gaia_realm_desc')]", để tôn vinh Gaia, linh hồn của Trái Đất.\n\n$POD_splat_wraith_plural$ gọi cõi này là [Glossary('Skinlands','game_concept_skinlands_desc')], để phân biệt với [UmbraGlossary('shadowlands')] (Penumbra Tăm Tối) nối liền với [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] (Umbra Tăm Tối).\n\nTrong Cách Nói Thông Thường của #TOOLTIP:GAME_TRAIT,fae,[GetNullCharacter] #L Kithain#!#!, Thế Giới Thức Tỉnh là Trái Đất... phần của Trái Đất không nằm trong các Umbra hay [UmbraGlossary('dreaming')]. Còn được gọi là Thế Giới Mùa Thu, Vùng Đất của Những Giấc Mơ Dang Dở, và Thế Giới của Xác Thịt."
 earth_effect_desc: ""

 umbra_realm_penumbra: "Penumbra"
 umbra_realm_penumbra_desc: "Penumbra, còn được gọi là Bóng của Trái Đất, là [spirit_world|E] bao quanh trực tiếp thế giới vật chất. Nhiều, nhưng không phải tất cả, các đặc điểm địa hình đều có hình ảnh phản chiếu ở đó."
 
 umbra_realm_astral_reaches: "Astral Reaches"
 game_concept_high_umbra: "High Umbra"
 game_concept_astral_umbra: "Astral Umbra"
 umbra_realm_astral_reaches_desc: "Astral Reaches, còn được gọi là Astral Umbra, High Umbra, hay Upper Umbra, là các cõi giới của tư tưởng, ý niệm, và khái niệm."
 
 umbra_realm_dreaming: "Dreaming"
 umbra_realm_dreaming_desc: "Như một tấm bưu thiếp hình ảnh của một kỳ nghỉ, khi nhân loại bắt đầu đặt niềm tin nhiều hơn vào những sự thật lạnh lùng cứng nhắc (và sắt thép lạnh lùng cứng nhắc) thay vì ý thích và tưởng tượng, những phần thần thoại của thế giới đã tách ra thành một tầng thực tại chồng lấn được gọi là Cõi Mộng."

 umbra_realm_underworld: "Underworld"
 game_concept_yin_world: "Yin World"
 game_concept_dark_umbra: "Dark Umbra"
 umbra_realm_underworld_desc: "Underworld, còn được gọi là Dark Umbra hay Contrarium, là lãnh địa của người chết và ký ức."
 
 umbra_realm_paradox_realms: "Paradox Realm"
 umbra_realm_paradox_realms_desc: "Paradox Realm là những cõi giới riêng tư được tạo ra bởi nghịch lý (paradox) tích tụ trong một Pháp sư đặc biệt thô tục. Paradox Realm thường mang hình dạng liên quan đến hành vi xúc phạm đã gây ra chúng; một Pháp sư bị lưu đày vì ném một quả cầu lửa có thể thấy mình trên bờ một hồ lửa vĩnh cửu, hay trong một thành phố làm bằng que diêm."
 paradox_realms_effect_desc: ""
 
 umbra_realm_heaven: "Thiên Đường"
 umbra_realm_heaven_desc: "Heaven là nơi ngự của Chúa và các Elohim, thuộc về thế giới khác, thanh khiết. Đó từng là quê hương của những Kẻ Sa Ngã trước cuộc Nổi Loạn.\nKể từ khi Cuộc Chiến Thịnh Nộ kết thúc, không còn liên lạc nào được thiết lập với Heaven và bàn tay của Đấng Sáng Tạo phần lớn đã rời xa tạo vật sa ngã.\n\nMột hình ảnh phản chiếu của Heaven vẫn tồn tại trong [umbra|E], được cư dân của nó gọi là Thiên Đường. Nó được mô phỏng theo nhận thức của loài người về Heaven nhiều hơn là thực sự tương đồng với bản gốc."
 heaven_effect_desc: ""
 
 umbra_realm_dreamtime: "Dreamtime"
 umbra_realm_dreamtime_desc: "Dreamtime là một Shallow Realm, một Cõi Giới hiếm hoi nằm ngay trên bề mặt của [umbra|E], ngay giữa Gauntlet và điểm khởi đầu của [umbra|E], chỉ được tìm thấy ở Úc."
 dreamtime_effect_desc: ""
 
 umbra_realm_chimare: "Chimare"
 umbra_realm_chimare_desc: "Một số Garou tin rằng mỗi giấc mơ đều có một hình ảnh Chimare đại diện. Điều này không đúng; [UmbraGlossary('penumbra')] không đủ lớn để chứa hết. Chúng cũng không đại diện cho mọi giấc mơ, nhưng chúng xuất hiện bất cứ khi nào một giấc mơ đạt đến một mức độ nổi bật trong tiềm thức văn hóa. Các biến thể phổ biến cũng nhận được Chimare riêng của chúng. Cả một cụm Chimare đại diện cho các biến thể của giấc mơ "biểu diễn trong tình trạng khỏa thân" và "rơi ngã"."
 chimare_effect_desc: ""
 
 umbra_realm_demesne: "Demesne"
 umbra_realm_demesne_desc: "Một Demesne là không gian riêng của một Pháp sư bên trong [UmbraGlossary('dreaming')].\n\nĐể đến được đó, cần có một mối liên kết đặc biệt với giấc mơ của bản thân, thứ hiếm khi có thể học được, mặc dù một Shallowing có thể hữu ích. Những Pháp sư quyền năng thường có toàn quyền kiểm soát vùng đất mộng của mình, trong khi những Pháp sư kém quyền năng hơn đôi khi có khách viếng thăm từ tiềm thức của họ."
 demesne_effect_desc: ""
 
 umbra_realm_near_dreaming: "Near Dreaming"
 umbra_realm_near_dreaming_desc: "Near Dreaming là phần của [UmbraGlossary('dreaming')] gần nhất với Thế Giới Trần Tục."
 near_dreaming_effect_desc: ""
 
 umbra_realm_far_dreaming: "Far Dreaming"
 umbra_realm_far_dreaming_desc: "Far Dreaming là phần của [UmbraGlossary('dreaming')] tương ứng với những giấc mơ tập thể của nhân loại."
 far_dreaming_effect_desc: ""
 
 umbra_realm_deep_dreaming: "Deep Dreaming"
 umbra_realm_deep_dreaming_desc: "Deep Dreaming là phần của [UmbraGlossary('dreaming')] xa nhất khỏi Thế Giới Thức Tỉnh."
 deep_dreaming_effect_desc: ""
 
 umbra_realm_arcadia: "Arcadia"
 umbra_realm_arcadia_desc: "Arcadia là quê hương nguyên thủy của loài fae."
 arcadia_effect_desc: ""
 
 umbra_realm_kingdom_of_dan: "Vương Quốc Dán"
 umbra_realm_kingdom_of_dan_desc: "Vương Quốc [Glossary('Dán','game_concept_dan_desc')] là một trong các [Glossary('Oneiric Realm','game_concept_oneiric_realm_desc')] của [UmbraGlossary('deep_dreaming')].\n\nTrong một thế giới không có biên giới cố định, có hai đường ranh giả định mà một số nhà bản đồ học giấc mơ dùng để đo đạc phạm vi của [UmbraGlossary('dreaming')] Đã Biết: Trục Chính và Đường Xích Đạo Phân. Đường đầu tiên đo [UmbraGlossary('dreaming')] từ trên xuống dưới. Đường thứ hai băng qua đường trung tuyến ngang của [UmbraGlossary('dreaming')], đóng vai trò như một đường xích đạo thô sơ. Cũng như mọi phép đo trong [UmbraGlossary('dreaming')], đây phần lớn chỉ là một ước lệ trí tuệ nhằm mang lại chút cảm giác trật tự cho một vũ trụ vốn hỗn loạn. Ở đỉnh của Trục Chính hư cấu này nằm Vương Quốc [Glossary('Dán','game_concept_dan_desc')]."
 kingdom_of_dan_effect_desc: ""
 
 umbra_realm_kureksarra: "Kureksarra"
 umbra_realm_kureksarra_desc: "Kureksarra, được biết đến như Đồng Bằng Đỏ, là một [Glossary(Localize('game_concept_hearts_realm'),'game_concept_hearts_realm_desc')] trong [UmbraGlossary('dreaming')].\n\nLãnh địa của chiến tranh bất tận, Kureksarra là quê hương của những giấc mơ về đấu tranh, cạnh tranh, chiến thắng, và trả thù. Một vùng đồng bằng rộng lớn lấm chấm những tàn tích của các công trình phòng thủ kiên cố, Kureksarra từng là một cõi xanh tươi với những phong cảnh dịu dàng và những trang viên yên bình. Giờ đây, tất cả những gì còn lại là một vùng đất ngập tràn xương cốt và vũ khí gãy vỡ đến mức mặt đất từ chối sinh ra bất cứ thứ gì sống. Chỉ còn những cây sồi già héo úa, nhỏ giọt máu như nhựa đỏ khi trời mưa. Những lối mòn dẫn vào và ra khỏi Kureksarra là những con đường lưỡi dao và những dòng sông dao cạo. Đôi Kinh Đô Song Sinh từng thanh lịch của cõi giới này giờ chỉ còn là những tàn tích đổ nát chứa đầy xương cốt và mùi máu trong bụi đất."
 kureksarra_effect_desc: ""
 
 umbra_realm_rubezhal: "Rubezhal"
 umbra_realm_rubezhal_desc: "Rubezhal là một [Glossary(Localize('game_concept_hearts_realm'),'game_concept_hearts_realm_desc')] trong [UmbraGlossary('dreaming')].\n\nẨn ngay dưới bề mặt của [UmbraGlossary('dreaming')], trong những đường hầm và hang động và hốc đá được phù phép bên dưới những ngọn đồi, lãnh địa Rubezhal gần như là một thế giới tự thân. Các nàng tiên đã xây dựng nhiều cõi giới tráng lệ nhất của họ ở đây, giữa những rễ cây của Giấc Mơ và những ngọn núi, những cõi giới được dệt nên từ đá quý và kim loại quý và được thắp sáng bởi những mặt trời và mặt trăng nội tại được tạo tác khéo léo."
 rubezhal_effect_desc: ""
 
 umbra_realm_capecia: "Capecia"
 umbra_realm_capecia_desc: "Capecia, Thành Phố Đồng Hồ, là một [Glossary(Localize('game_concept_hearts_realm'),'game_concept_hearts_realm_desc')] trong [UmbraGlossary('dreaming')].\n\nHào Quang (Glamour) của Capecia là về chiến thắng của kỹ nghệ nhân tạo trước tự nhiên. Ở đây, trong Thành Phố Đồng Hồ, những changeling bị nô dịch và các đồng minh loài người của họ đã tạo ra một cõi giới bị cai trị bởi đồ chơi thiếc và máy móc tự động, những con rối và búp bê giấy. Kỹ năng của các nghệ nhân đã chinh phục thời gian bằng cách xây dựng không phải bằng xác thịt, mà bằng những vật liệu bền vững hơn: đồng thau và nhựa, dây kim loại và da thuộc, gỗ lõi và cao su. Mọi thứ trong thành phố nhộn nhịp này không chỉ nhân tạo mà còn tự động. Đó là một thế giới nơi những changeling bằng xác thịt trôi dạt như những bóng ma bối rối. Những hình nhân lấp đầy các lối đi tự động và vội vã trên đôi chân khớp cứng khi chúng nhảy điệu nhảy không bao giờ kết thúc. Bên trên, những người-rối nhìn chằm chằm bằng đôi mắt thủy tinh qua cửa sổ văn phòng, trong khi những kẻ khác trò chuyện về bất cứ điều gì lấp đầy cái đầu nhồi báo giấy của chúng. Con chó thiếc đuổi theo con mèo thiếc đuổi theo con chuột thiếc không ngừng nghỉ."
 capecia_effect_desc: ""
 
 umbra_realm_irrgarten: "Irrgarten"
 umbra_realm_irrgarten_desc: "Irrgarten là một [Glossary(Localize('game_concept_hearts_realm'),'game_concept_hearts_realm_desc')] trong [UmbraGlossary('dreaming')] gắn liền với sự lang thang.\n\nNơi những lối mòn quanh co giao nhau và hội tụ, đó là nơi bạn tìm thấy Irrgarten. Cõi giới này là nguồn gốc và trung tâm của những giấc mơ về lang thang dọc theo những con đường rối rắm, phân nhánh. Dù những con đường đó là hành lang của một mê cung đá, những sợi chỉ của một trò chơi dây, hay những lối mòn um tùm của bụi rậm rừng sâu, tất cả đều là những gương mặt của Irrgarten. Tất cả những ai đến đây có chủ đích để tìm kiếm trodcraft hay trí tuệ khác đều phải đối mặt với khả năng họ có thể không bao giờ tìm được đường ra nữa. Những cá nhân xui xẻo tìm đến đây một cách tình cờ thì coi như đã định đoạt số phận, trừ khi họ có cả may mắn lẫn trí khôn đứng về phía mình."
 irrgarten_effect_desc: ""
 
 umbra_realm_arike: "Ariké"
 umbra_realm_arike_desc: "Ariké, Đế Chế của Nuối Tiếc, là một [Glossary(Localize('game_concept_hearts_realm'),'game_concept_hearts_realm_desc')] trong [UmbraGlossary('dreaming')].\n\nBất cứ điều gì bạn đã mất đều ở đây. Những người bạn và người tình bạn sẽ không gặp lại, những con đường bạn sẽ không bao giờ bước đi, những khoảnh khắc bạn sẵn lòng trả giá cao để được sống lại... tất cả đều ở đây. Đây là Ariké, nơi những giấc mơ về những gì đã từng và những gì có thể đã xảy ra được sinh ra."
 arike_effect_desc: ""
 
 umbra_realm_myrmitown: "Myrmitown"
 umbra_realm_myrmitown_desc: "Myrmitown là một [Glossary('Cõi Giới Gốc','game_concept_home_realm_desc')] của loài Boggan.\n\nNhững điều đáng kinh ngạc nhất về Myrmitown là kiến trúc và những con kiến kỳ ảo khổng lồ mà loài boggan dùng làm gia súc thồ hàng. Những con kiến này được sử dụng cho mọi thứ từ thực phẩm đến vận chuyển. Loài boggan ở đây thành thạo đến mức họ có một loại kiến khác nhau cho mỗi loại công việc."
 myrmitown_effect_desc: ""
 
 umbra_realm_the_tunnels: "The Tunnels"
 umbra_realm_the_tunnels_desc: "The Tunnels là một [Glossary('Cõi Giới Gốc','game_concept_home_realm_desc')] của loài Sluagh.\n\nThe Tunnels là một mạng lưới ngầm như mê cung. Rất dễ bị lạc ở đây; hầu như không có ánh sáng, và gần đây đã xuất hiện những vực sâu rộng lớn trên mặt đất. Ngay cả những sluagh quen thuộc với khu vực đôi khi cũng bị lạc, khi những lối đi từng qua lại được trở nên không thể vượt qua vì một khe núi hay một trận lở đá. Cũng có nhiều cư dân kỳ ảo nguy hiểm. Hầu hết thân thiện với sluagh, nhưng thỉnh thoảng những cuộc tấn công nhắm vào sluagh bởi các sinh vật kỳ ảo điên loạn không phải là chưa từng có."
 the_tunnels_effect_desc: ""
 
 umbra_realm_balloon: "Balloon"
 umbra_realm_balloon_desc: "Balloon là một [Glossary('Cõi Giới Gốc','game_concept_home_realm_desc')] của loài Pooka.\n\nCó nhiều lối vào Balloon, mỗi lối đều có những cái bẫy thử thách dọc đường và lượng khách qua lại thường xuyên. Hầu như ai cũng được chào đón, ngoại trừ những cá nhân có xu hướng bạo lực hơn (một redcap Unseelie lao vào Balloon tìm bữa tối rất có thể sẽ bị làm nhục, bầm dập, và cuối cùng bị hất văng ra ngoài, với cơ thể bị đánh nát ở hàng ngàn chỗ, nếu hắn sống sót qua trận hất văng đó). Ngay cả sidhe cũng được chào đón và đôi khi được chấp nhận nếu họ không cố tỏ ra bề trên với mọi người họ gặp và vẫn giữ một không khí "vui vẻ". Dĩ nhiên, không cái bẫy lối vào hay trò đùa xã giao thông thường nào có thể khiến bất kỳ sidhe nào trông lố bịch, nhưng điều đó không ngăn được hầu hết dân Balloon cố gắng."
 balloon_effect_desc: ""
 
 umbra_realm_vale_of_mists: "Thung Lũng Sương Mù"
 umbra_realm_vale_of_mists_desc: "Thung Lũng Sương Mù là rào chắn huyền bí ngăn cách [UmbraGlossary('near_dreaming')] khỏi [UmbraGlossary('far_dreaming')] và [UmbraGlossary('deep_dreaming')], nơi Sương Mù Lãng Quên mạnh mẽ nhất."
 vale_of_mists_effect_desc: ""
 
 umbra_realm_fields_behind: "Cánh Đồng Phía Sau"
 umbra_realm_fields_behind_desc: "Cánh Đồng Phía Sau là một cõi giới chuyển tiếp giữa Near và [UmbraGlossary('far_dreaming')], nằm trong [UmbraGlossary('vale_of_mists')] và là một phần của Cánh Đồng lớn hơn."
 fields_behind_effect_desc: ""
 
 umbra_realm_bullydale_wastes: "Vùng Hoang Bullydale"
 umbra_realm_bullydale_wastes_desc: "Vùng Hoang Bullydale là một [Glossary('Nightmare Realm','game_concept_nightmare_realm_desc')] trong [UmbraGlossary('dreaming')].\n\nQua khỏi [UmbraGlossary('fields_behind')], những lối mòn trở nên hiểm trở, ngày càng ít giống đường xá và giống những lối mòn dê hay đường săn hơn. Những ngôi làng tiên tộc trở nên nhỏ hơn và thưa thớt hơn, thu hẹp dần cho đến khi lữ khách chỉ còn lại một mình ngoại trừ đôi ba túp lều thô sơ đây đó. Bản thân những người dân túp lều ngày càng trở nên kỳ dị hơn, và đây là vùng đất của những kẻ ăn thịt người, những kẻ đồi bại, cướp bóc, và phù thủy."
 bullydale_wastes_effect_desc: ""
 
 umbra_realm_low_dukedoms: "Các Công Quốc Hạ Đẳng"
 umbra_realm_low_dukedoms_desc: "Các Công Quốc Hạ Đẳng của Quox và Mux là [Glossary('Dream Realms','game_concept_dream_realm_desc')] gần [UmbraGlossary('vale_of_mists')].\n\nHướng về ranh giới của [UmbraGlossary('bullydale_wastes')], sự ích kỷ và bạo lực vặt vãnh trở nên mù quáng hơn; những âm mưu ngày càng lố bịch hơn. Những quy tắc thông thường uốn cong và cuối cùng sụp đổ thành phi lý. Khi hành vi hoàn toàn phi lý trở thành quy luật, thì lữ khách đã đến Các Công Quốc Hạ Đẳng, trái tim của trò lừa bịp và hài kịch slapstick trong [UmbraGlossary('dreaming')]."
 low_dukedoms_effect_desc: ""
 
 umbra_realm_blotkeldur: "Blotkeldur"
 umbra_realm_blotkeldur_desc: "Blotkeldur là một [Glossary('Nightmare Realm','game_concept_nightmare_realm_desc')] trong [UmbraGlossary('near_dreaming')].\n\nNhững acheri du mục chưa từng có một [Glossary('Cõi Giới Gốc','game_concept_home_realm_desc')], nhưng nếu có, một số người nói Blotkeldur sẽ phù hợp với họ. Lạnh lẽo, ẩm ướt, và ảm đạm, Blotkeldur là một đầm lầy nhiễm độc bất tận, những dòng sông nông uốn khúc, và bụi cây còi cọc bệnh hoạn. Sâu trong những vùng tối tăm nhất của cõi giới này là những thành phố khổng lồ được xây dựng từ những khúc xương ngà voi trơ trụi của những quái thú đã tuyệt chủng từ lâu ở mọi nơi ngoại trừ [UmbraGlossary('dreaming')] sâu thẳm nhất."
 blotkeldur_effect_desc: ""
 
 umbra_realm_wastelands: "Vùng Đất Hoang"
 umbra_realm_wastelands_desc: "Vùng Đất Hoang là một [Glossary('Nightmare Realm','game_concept_nightmare_realm_desc')] trong [UmbraGlossary('deep_dreaming')] và là quê hương của Vũng Sầu Muộn Đếm Được.\n\nVùng Đất Hoang là một nơi tối tăm, khốn khổ nơi ác mộng ngự trị vĩnh viễn. Trong [Glossary('Nightmare Realm','game_concept_nightmare_realm_desc')] bất tận này, những đam mê và nỗi sợ hãi méo mó hơn của người phàm mưng mủ và phát triển. Những khu rừng nấm độc và những thung lũng đầy địa y ẩm ướt, độc hại phủ lên những vùng đất từng có những cung điện sánh ngang [UmbraGlossary('arcadia')]. Ở nơi này, bóng tối là tuyệt đối và người Thallain nắm giữ quyền thống trị không thể chối cãi trên vùng đất. Không changeling tỉnh táo nào dám đến thăm nơi này, ngoại trừ một sự thật đơn giản: Vũng Sầu Muộn Đếm Được nằm ở trung tâm Vùng Đất Hoang. Vũng nước này được cho là sẽ hé lộ toàn bộ quá khứ cho bất kỳ ai có thể chịu đựng việc nhìn vào chiều sâu của nó. Nhiều changeling ở các Deep Realm khẳng định đã có những khải tượng về Vũng nước. Đó có thể chỉ là một lời dối trá được tạo ra bởi những kẻ cai trị [Glossary('Nightmare Realms','game_concept_nightmare_realm_desc')], hoặc có thể là điều gì đó hơn thế. Một số cho rằng đó là một con đường khả dĩ dành cho mọi Kithain."
 wastelands_effect_desc: ""
 
 umbra_realm_hieronymus_continuum: "Continuum Hieronymus"
 umbra_realm_hieronymus_continuum_desc: "Continuum Hieronymus là một [Glossary('Dream Realm','game_concept_dream_realm_desc')] trong Far hay [UmbraGlossary('deep_dreaming')] được một số người cho là nơi khai sinh của loài Nocker.\n\nHình dạng và kích thước thực sự của cõi giới này là chủ đề tranh luận sôi nổi giữa các nhà vật lý học nocker. Một số truyền thuyết cho rằng những nocker đầu tiên đến từ Dreamrealm này và du hành đến Trái Đất trong một quả trứng cơ khí khổng lồ. Ít nocker ủng hộ câu chuyện này, riêng tư họ vẫn công nhận [UmbraGlossary('arcadia')] là quê hương thật sự của mình, nhưng gần như tất cả bọn họ đều sẽ rút câu chuyện này ra như một con dao bấm trong lúc tranh cãi như "bằng chứng" cho sự vượt trội của họ so với các loài fae khác. Một số cho rằng continuum này không chỉ là một dreamrealm khác mà là một phần của một chiều không gian hoàn toàn khác tồn tại bên ngoài [UmbraGlossary('dreaming')] trong một nếp gấp của continuum không-thời gian. Những nocker đã đến được cõi giới này và trở về luôn có được những hiểu biết sâu sắc về phát minh. Cách duy nhất được biết để đến đó là qua các dị thường đứt gãy (rift) trong [UmbraGlossary('far_dreaming')] và với một Mũ Sóng Delta."
 hieronymus_continuum_effect_desc: ""
 
 umbra_realm_wyldweir: "Wyldweir"
 umbra_realm_wyldweir_desc: "Wyldweir là một [Glossary('Dream Realm','game_concept_dream_realm_desc')] của [UmbraGlossary('near_dreaming')].\n\nTừng là một xứ bảo hộ của Arcadia, vùng núi rừng này đã sụp đổ trước nhiều nhóm Denizen trong thời kỳ Miririm."
 wyldweir_effect_desc: ""
 
 umbra_realm_brobdingnag: "Brobdingnag"
 umbra_realm_brobdingnag_desc: "[Glossary('Dream Realm','game_concept_dream_realm_desc')] Brobdingnag có cư dân là những người khổng lồ vốn bình thường nhưng to lớn đến mức chưa từng có lữ khách nào đến Cõi Giới này thu hút được sự chú ý của họ: khách viếng thăm bị lờ đi hoặc vô tình bị giẫm bẹp."
 brobdingnag_effect_desc: "Cho phép tuyển mộ [GetMaA('giants').GetName] làm [men_at_arms|E] (dưới dạng [umbra_expedition|E])"
 
 umbra_realm_arawns_forge: "Lò Rèn của Arawn"
 umbra_realm_arawns_forge_desc: "Lò Rèn của Arawn là một [Glossary('Điểm Ổn Định','game_concept_stable_point_desc')] của [UmbraGlossary('far_dreaming')].\n\nCó một ngọn núi cô độc, đen như trái tim của một fomorian, nơi Arawn từng ngự triều. Các sườn núi trơn trượt như thủy tinh ướt và những cơn gió gào thét quanh các đỉnh núi ngăn cả rồng cũng không thể bay đủ gần để đáp xuống. Không khí lạnh buốt, và một lớp sương giá dày phủ lên những vùng đất xung quanh. Nhưng trong bóng tối của đêm, có một ánh sáng phát ra từ trung tâm ngọn núi tràn ra từ một hố sâu ngay tại đỉnh cao nhất, cách mặt đất vô số dặm. Ánh sáng đủ mạnh để nhuộm đáy những đám mây luôn bao quanh nơi đáng ghê tởm này thành màu đỏ như máu."
 arawns_forge_effect_desc: ""
 
 umbra_realm_great_dream_forest: "Đại Rừng Mộng"
 umbra_realm_great_dream_forest_desc: "Đại Rừng Mộng, còn được gọi là Rừng [Glossary('Dán','game_concept_dan_desc')] hay Milderwood, là khu rừng đại diện cho mọi khu rừng trong [UmbraGlossary('far_dreaming')].\n\nChỉ có một Khu Rừng duy nhất trong [UmbraGlossary('far_dreaming')]. Cổ xưa, tráng lệ, và thường chứa đầy hiểm nguy, Đại Rừng trải rộng trên những vùng lớn hơn bất kỳ lục địa nào của thế giới thức tỉnh. Mọi loại cây có thể tưởng tượng được, cả "thực" lẫn khác, đều tồn tại ở đây. Đại Rừng thậm chí còn chạy bên dưới [UmbraGlossary('slumbering_oceans')] và vào những vùng đất khác xa ngoài tầm mắt của hầu hết Kithain."
 great_dream_forest_effect_desc: ""
 
 umbra_realm_discordant_woods: "Khu Rừng Bất Hòa"
 umbra_realm_discordant_woods_desc: "Khu Rừng Bất Hòa là một phần của [UmbraGlossary('great_dream_forest')] và là một trong những [Glossary('Các Điểm Ổn Định','game_concept_stable_point_desc')] tương đối ổn định của [UmbraGlossary('far_dreaming')].\n\nDù trái cây trong rừng ngọt ngào và bổ dưỡng, Dù lớp mùn của khu rừng tạo nên một chiếc giường êm ái, Dù thú săn trong rừng dồi dào, Khu Rừng Bất Hòa mang đến một nỗi kinh hoàng câm lặng. Khu Rừng Bất Hòa thật tuyệt đẹp."
 discordant_woods_effect_desc: ""
 
 umbra_realm_sea_of_sorrow: "Biển Sầu Muộn"
 umbra_realm_sea_of_sorrow_desc: "Biển Sầu Muộn là một [Glossary('Các Điểm Ổn Định','game_concept_stable_point_desc')] của [UmbraGlossary('far_dreaming')].\n\nXa khỏi Đại Rừng nằm một nơi cát mịn như bột thổi bay khắp một vùng đất cằn cỗi và nuốt chửng bất cứ ai dám vượt qua khoảng đất rộng lớn của nó. Có một lối mòn duy nhất uốn lượn qua đại dương bụi này, trải dài Con Đường Bạc của nó xuyên qua sự hỗn loạn không ngừng thường nuốt trọn lối mòn hoàn toàn, trước khi để nó tỏa sáng trở lại. Những đợt sóng cát khổng lồ được cho là có thể xé nát da thịt dễ dàng, để lại quá ít đến mức ngay cả kền kền cũng không tìm được miếng nào đáng chú ý. Biển Sầu Muộn giữ kín những bí mật của nó rất kỹ. Chưa ai từng theo Con Đường Bạc băng qua vùng đất hoang này và trở về để kể lại những gì nằm ở phía bên kia."
 sea_of_sorrow_effect_desc: ""
 
 umbra_realm_great_chasm: "Vực Thẳm Lớn"
 umbra_realm_great_chasm_desc: "Vực Thẳm Lớn là một [Glossary('Điểm Ổn Định','game_concept_stable_point_desc')] của [UmbraGlossary('near_dreaming')].\n\nChiếm cùng vị trí mà Grand Canyon có trong thế giới trần tục, Vực Thẳm Lớn là một khe nứt không đáy trên bề mặt của [UmbraGlossary('near_dreaming')]. Ít Kithain đủ táo bạo hay dại dột để hành trình vào chiều sâu của nó, vì nơi đây ẩn chứa những bí ẩn."
 great_chasm_effect_desc: ""
 
 umbra_realm_great_engine: "Cỗ Máy Vĩ Đại"
 umbra_realm_great_engine_desc: "Cỗ Máy Vĩ Đại là một [Glossary('Điểm Ổn Định','game_concept_stable_point_desc')] của [UmbraGlossary('deep_dreaming')].\n\nQua khỏi những cánh đồng băng cằn cỗi của Đêm Bất Tận, nơi những người khổng lồ băng giá sinh sống và dùng troll làm nô lệ riêng của họ, có một cỗ máy với kích thước phi thường. Cỗ Máy Vĩ Đại luôn ở nơi nó đang nghỉ ngơi. Firchlis không làm thay đổi hình dạng của tàn tích sừng sững này, và sự trôi qua của muôn vàn thời đại không gây ra thiệt hại nào cho cấu trúc khổng lồ đó. Cỗ Máy Vĩ Đại nghỉ ngơi ở một góc nghiêng, bất động và im lặng. Không cơn gió nào thổi nơi cỗ máy chờ đợi. Không sinh vật sống nào cư ngụ trong bóng của nó."
 great_engine_effect_desc: ""
 
 umbra_realm_lake_of_sorrows: "Hồ Sầu Muộn"
 umbra_realm_lake_of_sorrows_desc: "Hồ Sầu Muộn là một [Glossary('Điểm Ổn Định','game_concept_stable_point_desc')] của [UmbraGlossary('near_dreaming')].\n\nNơi Great Salt Lake nằm trong Vương Quốc của Mặt Trời Rực Cháy, Hồ Sầu Muộn được phản chiếu trong [UmbraGlossary('near_dreaming')]. Hồ nước chứa trong lòng nó một thành phố với vẻ đẹp khó tin và sự tráng lệ khôn tả. Những tòa tháp vươn lên từ dưới làn nước và chỉ còn cách không khí vài phân; thỉnh thoảng, một cá nhân nhìn thấy cư dân của thành phố này ngước nhìn lên họ, ngay cả khi họ đang nhìn xuống chiều sâu. Những kho báu vượt ngoài tầm tưởng tượng của người phàm lấp lánh rực rỡ trong chiều sâu, đôi khi được giữ trong tay và đôi khi nằm trên những viên đá cuội màu xà cừ trong lòng hồ. Thành phố này thịnh vượng, chứa đầy những Kithain cả quen thuộc lẫn xa lạ với changeling. Tuy nhiên, dù có quyền năng và những khả năng kỳ diệu, họ vẫn không thể đến được thành phố bên dưới mặt nước."
 lake_of_sorrows_effect_desc: ""
 
 umbra_realm_rivers_of_phantasia: "Những Dòng Sông Phantasia"
 umbra_realm_rivers_of_phantasia_desc: "Những Dòng Sông Phantasia là [Glossary('Các Điểm Ổn Định','game_concept_stable_point_desc')] trong [UmbraGlossary('near_dreaming')].\n\nNhững Dòng Sông Phantasia bao phủ lục địa Bắc Mỹ trong [UmbraGlossary('near_dreaming')], giống như sông Colorado, Mississippi, và Rio Grande bao phủ Bắc Mỹ. Dù chỉ một vài Vương Quốc được ban phước bởi những dòng nước này, ảnh hưởng của chúng luôn được cảm nhận khi changeling tìm thấy chúng. Nước của những dòng sông này tinh khiết và ngọt ngào như những giấc mơ tuyệt vời nhất. Uống từ chúng đủ để xoa dịu mọi cơn đói và thậm chí có thể chữa lành vết thương, cả thật lẫn kỳ ảo. Ở một số điểm nhất định, Những Dòng Sông Phantasia được cho là có khả năng xóa bỏ năm tháng khỏi một changeling. Những Grump uống từ dòng nước có thể trở nên trẻ hơn, thậm chí đến mức trở thành những childling một lần nữa. Dù không ký ức nào bị mất đi do những thay đổi tuổi tác này, quan điểm sống bị đảo ngược: không chỉ cơ thể trẻ lại mà cả linh hồn cũng vậy."
 rivers_of_phantasia_effect_desc: ""
 
 umbra_realm_seas_of_dream: "Những Biển Mộng"
 umbra_realm_seas_of_dream_desc: "Những Biển Mộng là [Glossary('Các Điểm Ổn Định','game_concept_stable_point_desc')] trong [UmbraGlossary('near_dreaming')] tương ứng với những đại dương của Trái Đất.\n\n[UmbraGlossary('near_dreaming')] có những đại dương, giống như thế giới thức tỉnh có những đại dương. Dù chúng phản ánh vị trí của những vùng biển trần tục, Những Biển Mộng là những kỳ quan tập thể của riêng chúng. Đâu đó trong chiều sâu của những đại dương, Atlantis vẫn còn tồn tại và người cá xây nhà của họ. Những thủy quái khổng lồ ngủ yên ở đây, chờ đợi đến thời điểm thích hợp để thể hiện sự hiện diện của mình và mơ những giấc mơ vượt ngoài cả sự hiểu biết của Kithain. Những thành phố trôi nổi bên dưới những đợt sóng, một số vẫn còn thịnh vượng, một số đã bị bỏ hoang từ lâu, tất cả đang chờ đợi để tiết lộ bí mật của mình cho bất kỳ ai đủ tò mò và can đảm để khám phá chúng."
 seas_of_dream_effect_desc: ""
 
 umbra_realm_slumbering_oceans: "Những Đại Dương Ngủ Yên"
 umbra_realm_slumbering_oceans_desc: "Những Đại Dương Ngủ Yên là [Glossary('Các Điểm Ổn Định','game_concept_stable_point_desc')] của [UmbraGlossary('far_dreaming')].\n\nNhững đại dương lớn của [UmbraGlossary('far_dreaming')] nối liền với cả những Near Realm lẫn [UmbraGlossary('deep_dreaming')]. Nước ở đây đục ngầu, quá sâu và tối để tiết lộ bí mật của chúng. Những đại dương lớn này trải dài đến những vùng đất khác trong [UmbraGlossary('dreaming')], những cõi giới bí ẩn mà chưa Kithain nào từng đặt chân đến. Một số cho rằng người Tuatha de Danaan đã đưa những con thuyền của họ vượt qua Những Đại Dương Ngủ Yên để trở về nơi họ đã đến, trước khi [UmbraGlossary('dreaming')] thực sự được hình thành."
 slumbering_oceans_effect_desc: ""
 
 umbra_realm_splintered_mountains: "Những Ngọn Núi Vỡ Vụn"
 umbra_realm_splintered_mountains_desc: "Những Ngọn Núi Vỡ Vụn là một trong những [Glossary('Các Điểm Ổn Định','game_concept_stable_point_desc')] tương đối ổn định của [UmbraGlossary('far_dreaming')].\n\nNhững Ngọn Núi Vỡ Vụn trải dài hàng nghìn dặm và cắt ngang một con đường táo bạo xuyên qua Vùng Đất Tối của [UmbraGlossary('far_dreaming')]. Ở đây, những gã khổng lồ trong truyền thuyết và những quái vật thời xưa xây nhà và tìm kiếm bất kỳ ai đủ dại dột để bước vào lãnh địa của họ như nguồn sống. Harpy cưỡi những cơn gió buốt giá của các hẻm núi đá, háo hức chờ đợi những changeling để tra tấn, và basilisk ẩn nấp trong bóng tối của những tòa tháp đổ nát. Rất nhiều Kithain đã gặp cái chết của mình tại Những Ngọn Núi Vỡ Vụn, nơi Tuatha de Danaan từng cai trị trong thời kỳ trước cuộc Đại Vỡ (Shattering). Có những kho báu ẩn giấu trong các hang động của những ngọn núi, và một số tin rằng con đường đến [UmbraGlossary('arcadia')] chỉ có thể được tìm thấy bằng cách tìm kiếm những kho báu mà người Tuatha de Danaan đã bỏ lại khi họ rời khỏi những cung điện nay đã đổ nát của mình. Điều này có thể là dối trá hay có thể là sự thật, nhưng tất cả các sidhe đều nhớ đã đi qua dãy núi những tòa tháp đá hiểm trở, nhọn hoắt trên đường trở về Thế Giới Thức Tỉnh."
 splintered_mountains_effect_desc: ""
 
 umbra_realm_middlemarch: "Middlemarch"
 umbra_realm_middlemarch_desc: "Middlemarch là một Cõi Giới của [UmbraGlossary('near_dreaming')].\n\nLà chân đồi của [UmbraGlossary('splintered_mountains')] vĩ đại, những vùng đất đá khô cằn của Middlemarch tạo nên một số cõi giới khắc nghiệt nhất trong [UmbraGlossary('near_dreaming')]."
 middlemarch_effect_desc: ""
 
 umbra_realm_chakravada: "Chakravada"
 umbra_realm_chakravada_desc: "Chakravada là ngọn núi vĩ đại nhất trong số mọi ngọn núi của [UmbraGlossary('dreaming')].\n\nNằm trong [UmbraGlossary('splintered_mountains')], núi Chakravada, ngọn núi vĩ đại nhất trong số tất cả, cũng chính là trung tâm của mọi thế giới, và, ít nhất là trong những giấc mộng, nó có sự sống."
 chakravada_effect_desc: ""

 umbra_realm_goblin_market: "Chợ Yêu Tinh"
 umbra_realm_goblin_market_desc: "Chợ Yêu Tinh là một Chợ Fae nằm trong [UmbraGlossary('deep_dreaming')].\n\nDọc theo [UmbraGlossary('mistweir')] trong [UmbraGlossary('deep_dreaming')], cách xa hàng trăm dặm khỏi thôn ấp của [UmbraGlossary('fin_bheara')], sừng sững một quần thể lều trại và đình các được gọi là Chợ Yêu Tinh. Những báu vật có sức mạnh và độ hiếm hiếm có được bày bán tại Chợ, cùng với những thú vui và bí mật vượt ngoài hiểu biết của người phàm. Chợ Yêu Tinh do một tá yêu tinh (goblin) và đám tay sai redcap của chúng cai quản. Mọi kẻ đều được chào đón bước vào Chợ, miễn là họ có tiền hoặc hàng hóa để trao đổi."
 goblin_market_effect_desc: ""

 umbra_realm_distant_cities: "Những Thành Phố Xa Xôi"
 umbra_realm_distant_cities_desc: "Những Thành Phố Xa Xôi là một hiện tượng của [UmbraGlossary('near_dreaming')].\n\nMột hiện tượng thường gặp trong [UmbraGlossary('near_dreaming')] được gọi là Những Thành Phố Xa Xôi. Những nơi kỳ lạ này luôn đẹp đẽ không thể tả và hầu như không thể nào chạm tới. Chúng là những nơi được nhìn thấy nơi chân trời, những nơi diệu kỳ và vinh quang, chói sáng như ánh mặt trời trong ngày xuân đầu tiên thực sự. Đôi khi, chúng dường như chỉ cách vài dặm, đôi khi lại dường như cách hàng trăm dặm. Nhưng luôn luôn, chúng mê hoặc lòng người, tràn ngập những tháp pha lê và những cây cầu vàng, những lá cờ rực rỡ sắc màu và âm nhạc ám ảnh cả vùng thì thầm. Dù cách xa hàng dặm, người ta vẫn thấy được cư dân của Những Thành Phố Xa Xôi và khao khát được gặp họ, vì chắc hẳn ai đẹp đến thế phải biết đường đến [UmbraGlossary('arcadia')]."
 distant_cities_effect_desc: ""

 umbra_realm_fin_bheara: "Fin Bheara"
 umbra_realm_fin_bheara_desc: "Fin Bheara là một Boggan Chân Tiên (True Fae) và cũng là tên của thôn ấp Tiên tộc được đặt theo tên hắn trong [UmbraGlossary('deep_dreaming')].\n\nDọc theo bức đại tường, những xóm nhỏ và thị trấn đủ mọi quy mô đã mọc lên qua hàng thế kỷ, có cư dân là các fae thường dân tự nhận đã rời bỏ [UmbraGlossary('arcadia')] để đến những nơi xa lánh sidhe. Lớn nhất trong những thị trấn này gọi là Fin Bheara, theo tên vị boggan đã khai khẩn vùng đất ấy. Fin Bheara quy tụ đủ mọi loại Kithain, kể cả nhiều sidhe tự nhận rằng [UmbraGlossary('arcadia')] đã đóng cửa với họ vào thời điểm cuộc Đại Vỡ (Shattering)."
 fin_bheara_effect_desc: ""

 umbra_realm_mistweir: "Mistweir"
 umbra_realm_mistweir_desc: "Mistweir là rào chắn cuối cùng giữa [UmbraGlossary('far_dreaming')] và [UmbraGlossary('deep_dreaming')]. Mistweir bao trọn [UmbraGlossary('deep_dreaming')] và là ranh giới giữa cõi trần tục và cõi kỳ ảo."
 mistweir_effect_desc: ""

 umbra_realm_dream_burrow: "Hang Mộng"
 umbra_realm_dream_burrow_desc: "Hang Mộng là một cõi giới túi nằm trong [UmbraGlossary('near_dreaming')], được một changeling Pooka đào để trốn khỏi sự Tầm Thường Hóa (Banality).\n\nNhiều Hang Mộng khác nhau chứa nhiều pooka đa dạng với số lượng khác nhau. Bị cô lập với nhau, mỗi hang đã tiến hóa theo cách riêng đặc biệt của nó. Các hang có quy mô từ những chốn nương náu nhỏ bé cho từng gia đình pooka thỏ, cho đến những khu rừng kỳ ảo với đủ loài muôn hình vạn trạng. Mỗi hang mang một hương vị và cảnh sắc riêng biệt, tùy vào changeling hoặc những changeling đã mộng nó ra đời. Nhiều hang vẫn còn tồn tại, ẩn giấu và phát triển mạnh, dù đã qua bao thời gian."
 dream_burrow_effect_desc: ""

 umbra_realm_madness_realm: "Cõi Điên Loạn"
 umbra_realm_madness_realm_desc: "Cõi Điên Loạn là một nơi trong [UmbraGlossary('near_dreaming')], nơi sự điên loạn của những Người Mộng Mơ (Dreamer) phàm nhân đôi khi có thể gây ra những tình thế nan giải nghiêm trọng cho Kithain.\n\nCõi Điên Loạn có lẽ là những vùng nguy hiểm nhất của [UmbraGlossary('near_dreaming')]. Tại những nơi này, những giấc mộng của người phàm đã buông bỏ lý trí thường được hiện thực hóa. Những giấc mộng điên loạn có sức mạnh cực lớn và có thể cuốn một lữ khách bất cẩn vào thực tại méo mó của chúng trong thời gian dài."
 madness_realm_effect_desc: ""

 umbra_realm_meridianus: "Meridianus"
 umbra_realm_meridianus_desc: "Meridianus là một cõi giới trống rỗng như hư không, đầy những cơn gió dữ dội và ma thú bóng tối, do Tuatha de Danaan để lại nhằm canh giữ chống lại lũ Denizen.\n\nNhững Denizen thực hiện cuộc hành trình đến Thế Giới Mùa Thu nhanh chóng nhận ra rằng đến được Trái Đất còn dễ hơn nhiều so với quay trở lại. Trái Đất tạo ra một dòng chảy ngầm tâm linh nặng nề và tăm tối mà những Dark-Kin phù du khó lòng thoát khỏi. "Dòng chảy ngầm" này biểu hiện theo nhiều cách. Quan trọng nhất trong số đó là một vùng của [UmbraGlossary('near_dreaming')] tồn tại ngay bên ngoài Sương Mù. Được gọi là Meridianus, vùng này là một tuyến phòng thủ cổ xưa do Tuatha để lại nhằm giúp thực thi Lệnh Cấm Bạc. Là một cõi giới của những cơn bão gào thét và ít thực chất, nó gần như không thể nào định hướng và bị ám bởi những ma thú nguy hiểm. Được gọi là Bóng-Mộng, những khối bóng tối đen kịt này tấn công bất kỳ Dark-kin nào ghé thăm, làm tan rã thực chất huyễn tưởng của chúng. Denizen chỉ gặp phải khía cạnh kỳ lạ này của vùng đất trên đường rời khỏi thế giới thức tỉnh, chứ không phải khi bước vào."
 meridianus_effect_desc: ""

 umbra_realm_sea_of_silver: "Biển Bạc"
 umbra_realm_sea_of_silver_desc: "Biển Bạc là đại dương vĩ đại của [UmbraGlossary('deep_dreaming')].\n\nĐại dương vô tận của ánh sáng, hoàng hôn và bóng tối trở thành [UmbraGlossary('deep_dreaming')], và Triều Đình Đen của lũ Fomorian; Biển mang ngàn cái tên, mỗi tên ứng với một trái tim đang mộng mơ; những vùng vô tận này phân chia [UmbraGlossary('far_dreaming')] khỏi [UmbraGlossary('deep_dreaming')]. Hãy gọi nó là Biển Sâu Thẳm, hay Biển Hoàng Hôn, hay Biển Chạng Vạng, hay Đại Dương Mộng Mơ, hay thậm chí là Bão Tố. Mọi hành trình mong muốn rời khỏi Cõi Mộng Xa cũng phải rời bỏ luôn những ranh giới được đánh dấu rõ ràng của Con Đường Bạc và mọi cột mốc, dấu hiệu thử thách quen thuộc khác."
 sea_of_silver_effect_desc: ""

 umbra_realm_snail_graveyards: "Nghĩa Địa Ốc Sên"
 umbra_realm_snail_graveyards_desc: "Nghĩa Địa Ốc Sên là sáu địa điểm đã biết trong [UmbraGlossary('dreaming')] mà những con ốc sên tìm đến khi chúng nhận ra mình sắp chết.\n\nVì đường đi gian nan và những con ốc sên hấp hối di chuyển chậm chạp, phần lớn không bao giờ đến được nghĩa địa mà chết dọc đường. Thực tế, một trong những cách dễ nhất để changeling tìm đường đến Nghĩa Địa Ốc Sên gần nhất là lần theo dấu vết rời rạc của những vỏ ốc dưới chân. Càng đi, vỏ ốc trên mặt đất càng dày đặc dần, và cuối cùng người ta sẽ thấy mình đang ở trong một Nghĩa Địa Ốc Sên. Những con ốc sên già nhất và khỏe nhất tìm đến [UmbraGlossary('arike')] để chết."
 snail_graveyards_effect_desc: ""

 umbra_realm_spawning_fields: "Cánh Đồng Sinh Sản"
 umbra_realm_spawning_fields_desc: "Cánh Đồng Sinh Sản là những nơi mà giấc mộng của người phàm đổ thẳng vào [UmbraGlossary('dreaming')].\n\nCánh Đồng Sinh Sản nguy hiểm ngay cả trong hoàn cảnh tốt nhất. Chúng là những đại dương hỗn loạn của Glamour thuần khiết và là những kết nối một chiều trực tiếp giữa [UmbraGlossary('dreaming')] và Thế Giới Mùa Thu. Ma thú (Chimera) liên tục được sinh ra trong những đài phun trào sức mạnh này và thường chết rất nhanh. Cánh Đồng Sinh Sản dường như xuất hiện ngẫu nhiên cùng với [UmbraGlossary('near_dreaming')] và cũng biến mất một cách thất thường không kém"
 spawning_fields_effect_desc: ""

 umbra_realm_tenebrous_realm: "Cõi Giới Âm U"
 umbra_realm_tenebrous_realm_desc: "Cõi Giới Âm U là một trong những cõi giới nằm ngoài Con Đường Bạc, ít được changeling biết đến nhưng lại có Denizen cư ngụ.\n\nKhông được xác định bởi bất kỳ bản đồ hay ranh giới nào, Cõi Giới Âm U là một thuật ngữ chung mà changeling dùng để chỉ những cõi giới ít được hiểu rõ nằm ngoài Con Đường Bạc. Đối với hầu hết mọi changeling, trừ những kẻ ưa phiêu lưu nhất, những nơi này bị coi là tăm tối, xa lạ và nguy hiểm. Còn đối với những adhene sinh sống ở đó, chúng đơn giản chỉ là... nhà."
 tenebrous_realm_effect_desc: ""

 umbra_realm_winterweir: "Winterweir"
 umbra_realm_winterweir_desc: "Winterweir là một Cõi Giới thuộc [UmbraGlossary('far_dreaming')].\n\nNằm trong phần Mùa Đông của [UmbraGlossary('forest_of_lies')] dọc theo một nhánh sông đổ về [UmbraGlossary('sea_of_silver')], Winterweir là một nơi lạnh lẽo, sương mù bao phủ, đầy bí ẩn. Là quê nhà của loài fuath, ít phần nào của Khu Rừng dày đặc và hoang dã như Winterweir... hay nguy hiểm bằng. Những fuath sinh sống tại cõi giới này nghi kỵ người lạ và thường xua đuổi họ trừ khi được xoa dịu đúng cách. Một số làm vậy chỉ để bảo vệ sự riêng tư, trong khi số khác thực sự có ác ý. Nhóm trước có lý do chính đáng để nghi ngờ, đặc biệt trước những cuộc đột kích gần đây của fir-bholg và hoạt động của nhóm thứ hai."
 winterweir_effect_desc: ""

 umbra_realm_forest_of_lies: "Khu Rừng Dối Trá"
 umbra_realm_forest_of_lies_desc: "Khu Rừng Dối Trá là một phần của [UmbraGlossary('great_dream_forest')] và là một trong những [Glossary('Điểm Ổn Định','game_concept_stable_point_desc')] tương đối hiếm hoi của [UmbraGlossary('far_dreaming')].\n\nKhu Rừng Dối Trá chạy theo những hình mẫu quá phức tạp để phần lớn có thể hiểu thấu. Nó luôn nằm ở ranh giới phân chia [UmbraGlossary('far_dreaming')] và [UmbraGlossary('deep_dreaming')]. Chính tại Khu Rừng Dối Trá mà Asterlan cùng đoàn tùy tùng đã giao chiến với lũ nhện của Vực Thở Dài. Không có gì tốt đẹp tồn tại trong Khu Rừng Dối Trá. Mọi thứ nơi đây đều tăm tối và u ám, có lẽ sinh ra từ nỗi sợ hãi nguyên thủy của con người đối với rừng già. Trái cây từ những cây cổ thụ xoắn xuýt của khu rừng đắng chát và thường độc hại đối với Kithain. Muông thú nơi đây đều là loài săn mồi, và phần lớn lớn đến kích thước khiến cả một đội quân troll cũng phải chùn bước."
 forest_of_lies_effect_desc: ""

 umbra_realm_maharaurava: "Mahâraurava"
 umbra_realm_maharaurava_desc: "Mahâraurava là [Glossary('Cõi Giới Gốc','game_concept_home_realm_desc')] của loài Naraka trong [UmbraGlossary('near_dreaming')].\n\nLà nạn nhân lớn nhất của cái chết Ravana, vẻ đẹp xưa kia của [Glossary('Cõi Giới Gốc','game_concept_home_realm_desc')] naraka đã biến mất vĩnh viễn. Nằm trong cõi giới [UmbraGlossary('near_dreaming')] tương ứng với vùng Tây Bắc Ấn Độ, Mahâraurava từng ở tâm điểm khi Những Kẻ Ẩn Giấu (Hidden Ones) triển khai quả bom-linh hồn của chúng. Rất ít sinh vật khác từng ghé thăm cõi giới này, có lẽ ngoại trừ loài acheri. Truyền thuyết changeling kể rằng vùng đất này từng là cõi giới đẹp đẽ và tàn khốc nhất, gồm những dãy núi nạm ngọc vĩ đại nơi ngay cả hòn đá nhỏ nhất cũng đáng giá bằng tiền chuộc một vị công tước. Loài naraka, một phần của giống nòi tiên gọi là Asura, sống trong sự xa hoa văn minh dù tàn nhẫn, cư ngụ trong những cung điện đồ sộ được tạc vào những ngọn núi lấp lánh, ngả mình trong những khu vườn trĩu quả trau dồi nghệ thuật âm nhạc, ái ân và khổ đau. Theo truyền thuyết, nhiệm vụ của chúng là trừng phạt những linh hồn người độc ác, đun sôi họ trong những dòng sông đồng nóng chảy của vùng đất này."
 maharaurava_effect_desc: ""

 umbra_realm_astral_plane: "Cõi Sao"
 umbra_realm_astral_plane_desc: "Cõi Sao nhìn chung có thể được coi là một sự phản chiếu của ý thức toàn thể nhân loại, sau đó được chia nhỏ thành nhiều cõi giới khác nhau ứng với từng phạm trù ý tưởng."
 astral_plane_effect_desc: "Phần thưởng/yêu cầu cao hơn khi mở khóa huấn luyện lối sống học thuật."

 umbra_realm_vulgate: "Vulgate"
 umbra_realm_vulgate_desc: "Vulgate - còn gọi là Mundus Imaginalis - là phần thấp nhất của [UmbraGlossary('astral_reaches')]. Nó bao hàm những khái niệm phổ biến nhất mà triết học tập thể và tâm thức của nhân loại (và, có thể, một số loài khác) đã từng nghĩ tới."
 vulgate_effect_desc: "Phần thưởng/yêu cầu cao hơn khi mở khóa huấn luyện lối sống ngoại giao."

 umbra_realm_grand_hall: "Đại Sảnh"
 umbra_realm_grand_hall_desc: "Nó trồi lên từ màn sương Cõi Sao tựa như một bóng ma - Đại Sảnh của Những Cánh Cổng Vô Tận. Nó không bao giờ ở yên một chỗ lâu, nhưng luôn giữ một hình dáng tương tự - một hành lang thưa thớt nhưng ấm áp giữa các thế giới, được tạo hình theo phong cách Địa Trung Hải Cổ Điển và trang trí bằng gỗ cổ cùng gạch khảm."
 grand_hall_effect_desc: ""

 umbra_realm_city_of_brass: "Thành Phố Đồng Thau"
 umbra_realm_city_of_brass_desc: "Thành Phố Đồng Thau có hình dáng của một thành phố khổng lồ với tám đại lộ lớn được làm từ đủ các sắc thái của đồng thau và đồng đỏ. Nó đóng vai trò trung tâm kinh tế giữa các pasha Djinn của Thế Giới Vô Hình và những pháp sư muốn nhận được sự trợ giúp của Djinn mà không cần chọc giận chúng một cách vô ích bằng cách dùng Bộ Luật Solomon để ép buộc chúng phục dịch."
 city_of_brass_effect_desc: "$UMBRA_DISCOVERY_FETISH$"

 umbra_realm_spires: "Những Ngọn Tháp"
 umbra_realm_spires_desc: "Các nhà vũ trụ học tin rằng Những Ngọn Tháp là kết quả của việc nhiều tâm trí cùng tập trung vào một ý tưởng, khiến nó được nâng lên từ [UmbraGlossary('vulgate')] vào một cõi giới cao hơn."
 spires_effect_desc: "Phần thưởng/yêu cầu cao hơn khi mở khóa huấn luyện lối sống mưu chước."

 umbra_realm_inventium: "Inventium"
 umbra_realm_inventium_desc: "Inventium là một Cõi Giới thuộc [UmbraGlossary('astral_reaches')], chứa đầy mọi phát minh mà loài người từng mơ tới. Những phát minh này hiện hình cùng một tiếng nổ lách tách nghe rõ và rơi nhẹ nhàng thành những đống khổng lồ lấp đầy Cõi Giới theo mọi hướng."
 inventium_effect_desc: "Hành động Tìm Kiếm Phát Minh sẽ không còn gây stress khi thất bại nữa. (dưới dạng [umbra_expedition|E])\nHành động Tìm Kiếm Phát Minh sẽ cho vàng khi thất bại. (dưới dạng [umbra_expedition|E])\nHành động Tìm Kiếm Cải Tiến sẽ không gây stress khi thất bại. (dưới dạng [umbra_expedition|E])"

 umbra_realm_epiphamy: "Epiphamy"
 umbra_realm_epiphamy_desc: "Epiphamy hiện thân cho những khái niệm trừu tượng hoàn toàn, như "Quy Luật Tự Nhiên" hay "Tình Yêu Đích Thực". Chúng hiện ra như những đám mây rực rỡ sắc màu trên bầu trời cõi giới của [UmbraGlossary('vulgate')], có thể cho khách viếng thăm những gợi ý về khái niệm mà chúng hiện thân."
 epiphamy_effect_desc: "Phần thưởng/yêu cầu cao hơn khi mở khóa huấn luyện lối sống quản lý."

 umbra_realm_elemental_courts: "Các Triều Đình Nguyên Tố"
 umbra_realm_elemental_courts_desc: "Các Triều Đình Nguyên Tố nằm ở lưng chừng một Ngọn Tháp, trước khi lữ khách thực sự đến được Năm Cánh Cổng, với mỗi Nguyên Tố được đại diện bởi một cõi giới thể hiện bản chất cố hữu của nó."
 elemental_courts_effect_desc: ""

 umbra_realm_the_court_of_the_muses: "Triều Đình Nàng Thơ"
 umbra_realm_the_court_of_the_muses_desc: "Triều Đình Nàng Thơ đã chịu nhiều tổn thất nặng nề khi tín ngưỡng Hy Lạp Cổ Điển gần như tuyệt diệt hoàn toàn. Dù vậy, dù cõi giới của họ ngày càng thu hẹp mỗi ngày, chín người con gái của Zeus vẫn thực hành nghệ thuật của mình, hy vọng rằng đam mê của họ sẽ đẩy lùi Hư Vô thêm một chút nữa."
 the_court_of_the_muses_effect_desc: "$UMBRA_DISCOVERY_FETISH$"

 umbra_realm_shadowlands: "Shadowlands"
 umbra_realm_shadowlands_desc: "Shadowlands là một 'lớp da' phản chiếu của thực tại, với mỗi địa điểm trong cõi giới của người sống đều có một địa điểm tương ứng trong Shadowlands, mà phần lớn tuân theo những quy luật khoảng cách thông thường. Đây là nơi các oan hồn cư ngụ, chờ đợi sự cứu rỗi, hoặc, nhiều khả năng hơn, [UmbraGlossary('oblivion')]."

 shadowlands_effect_desc: "Mở khóa một tương tác cho phép bạn gửi một [GetTrait('wraith').GetName( GetNullCharacter )] bị trói buộc đến Shadowlands để nó không còn gây thêm stress khi duy trì."

 umbra_realm_river_of_death: "Dòng Sông Tử Thần"
 umbra_realm_river_of_death_desc: "Dòng Sông Tử Thần là một thủy lộ trong [UmbraGlossary('tempest')], đóng vai trò là Con Đường Huyết Mạch chính từ Stygia đến [UmbraGlossary('shadowlands')] và các [Glossary('Vương Quốc Bóng Tối','game_concept_dark_kingdom_desc')] khác."
 river_of_death_effect_desc: ""

 umbra_realm_sunless_sea: "Biển Vô Nhật"
 umbra_realm_sunless_sea_desc: "Được đặt tên như vậy vì bầu trời phía trên nó luôn tăm tối, ánh sáng trong Biển Vô Nhật từ những nguồn như tàu thuyền và hải đăng có thể được nhìn thấy từ hàng dặm xa vì nó tán xạ trên mặt nước."
 sunless_sea_effect_desc: ""

 umbra_realm_far_shore: "Bờ Biển Xa Xăm"
 umbra_realm_far_shore_desc: "Những Bờ Biển Xa Xăm là một lãnh thổ bí ẩn trong [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] do những thực thể pythian gọi là Những Kẻ Rạng Rỡ (Shining Ones) kiểm soát. Đối với những cư dân Stygia hiện đại, Những Bờ Biển Xa Xăm là những lãnh thổ do bọn Dị Giáo kiểm soát, và không đáng tin cậy."
 far_shore_effect_desc: ""

 umbra_realm_weeping_bay: "Vịnh Than Khóc"
 umbra_realm_weeping_bay_desc: "Vịnh Than Khóc nằm giữa Biển Linh Hồn và [UmbraGlossary('sunless_sea')], đóng vai trò là hải cảng chính của Stygia và là mối liên kết với nhiều Necropolis khác. Vịnh này có hình dáng đặc trưng của một vầng trăng khuyết và luôn tràn ngập tiếng nức nở, rên rỉ của những oan hồn hàn-linh (soulforged) tạo nên vịnh."
 weeping_bay_effect_desc: ""

 umbra_realm_sea_of_souls: "Biển Linh Hồn"
 umbra_realm_sea_of_souls_desc: "Bức tường biển phòng thủ được xây dựng quanh Stygia và [UmbraGlossary('isle_of_sorrows')]. Tên gọi của nó bắt nguồn từ những oan hồn bất hạnh đã bị hàn-luyện hoặc xích chặt vào cấu trúc của bức tường."
 sea_of_souls_effect_desc: ""

 umbra_realm_isle_of_sorrows: "Đảo Sầu Muộn"
 umbra_realm_isle_of_sorrows_desc: "Đảo Sầu Muộn là một hòn đảo đá nằm ở cửa sông của [UmbraGlossary('river_of_death')], sâu trong [UmbraGlossary('tempest')]."
 isle_of_sorrows_effect_desc: ""

 umbra_realm_dark_kingdom_of_iron: "Vương Quốc Bóng Tối Sắt"
 umbra_realm_dark_kingdom_of_iron_desc: "Stygia là kinh đô của những kẻ chết phương Tây, một thành phố to lớn không thể tưởng tượng nổi nằm trên [UmbraGlossary('isle_of_sorrows')] sâu trong [UmbraGlossary('tempest')]. Đây là nơi đặt trụ sở chính của nhiều tổ chức oan hồn phương Tây khác nhau."
 dark_kingdom_of_iron_effect_desc: "Mở khóa một tương tác cho phép bạn gửi một [GetTrait('wraith').GetName( GetNullCharacter )] bị trói buộc đến [Glossary('Vương Quốc Bóng Tối','game_concept_dark_kingdom_desc')] này để nó có cơ hội học được [arcanoi_lifestyle|E] mới."

 umbra_realm_dark_kingdom_of_clay: "Vương Quốc Bóng Tối Đất Sét"
 umbra_realm_dark_kingdom_of_clay_desc: "Karta, được người ngoài gọi là [Glossary('Vương Quốc Bóng Tối','game_concept_dark_kingdom_desc')] Đất Sét, là cõi giới trong [UmbraGlossary('tempest')] thuộc về những thổ dân bản địa của Úc."
 dark_kingdom_of_clay_effect_desc: "Mở khóa một tương tác cho phép bạn gửi một [GetTrait('wraith').GetName( GetNullCharacter )] bị trói buộc đến [Glossary('Vương Quốc Bóng Tối','game_concept_dark_kingdom_desc')] này để nó có cơ hội học được [arcanoi_lifestyle|E] mới."

 umbra_realm_dark_kingdom_of_ivory: "Vương Quốc Bóng Tối Ngà Voi"
 umbra_realm_dark_kingdom_of_ivory_desc: "Bụi Rậm Ma (Bush of Ghosts), còn được gọi là [Glossary('Vương Quốc Bóng Tối','game_concept_dark_kingdom_desc')] Ngà Voi, là [UmbraGlossary('shadowlands')] dành cho loài abambo, hay các oan hồn của châu Phi."
 dark_kingdom_of_ivory_effect_desc: "Mở khóa một tương tác cho phép bạn gửi một [GetTrait('wraith').GetName( GetNullCharacter )] bị trói buộc đến [Glossary('Vương Quốc Bóng Tối','game_concept_dark_kingdom_desc')] này để nó có cơ hội học được [arcanoi_lifestyle|E] mới.\nNếu bạn là một oan hồn, có được quyền truy cập cây Behest của [misc_arcanoi_lifestyle|E]. (dưới dạng [umbra_expedition|E])"

 umbra_realm_dark_kingdom_of_jade: "Vương Quốc Bóng Tối Ngọc Bích"
 umbra_realm_dark_kingdom_of_jade_desc: "Suối Vàng, còn được gọi là [Glossary('Vương Quốc Bóng Tối','game_concept_dark_kingdom_desc')] Ngọc Bích, là một phần của [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] dành riêng và do những kẻ chết châu Á kiểm soát."
 dark_kingdom_of_jade_effect_desc: "Mở khóa một tương tác cho phép bạn gửi một [GetTrait('wraith').GetName( GetNullCharacter )] bị trói buộc đến [Glossary('Vương Quốc Bóng Tối','game_concept_dark_kingdom_desc')] này để nó có cơ hội học được [arcanoi_lifestyle|E] mới."

 umbra_realm_dark_kingdom_of_obsidian: "Vương Quốc Bóng Tối Hắc Diệu Thạch"
 umbra_realm_dark_kingdom_of_obsidian_desc: "Vùng Đất Lột Da (Flayed Lands) là tên gọi cho vương quốc của kẻ chết từng thống trị Trung Mỹ, một phần của [Glossary('Vương Quốc Bóng Tối','game_concept_dark_kingdom_desc')] Hắc Diệu Thạch hùng mạnh."
 dark_kingdom_of_obsidian_effect_desc: "Mở khóa một tương tác cho phép bạn gửi một [GetTrait('wraith').GetName( GetNullCharacter )] bị trói buộc đến [Glossary('Vương Quốc Bóng Tối','game_concept_dark_kingdom_desc')] này để nó có cơ hội học được [arcanoi_lifestyle|E] mới."

 umbra_realm_dark_kingdom_of_wire: "Vương Quốc Bóng Tối Dây Thép"
 umbra_realm_dark_kingdom_of_wire_desc: "[Glossary('Vương Quốc Bóng Tối','game_concept_dark_kingdom_desc')] Dây Thép là vùng thuộc [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] của châu Âu, là quê nhà của loài dybbuk, những Oan Hồn bị giết trong cuộc Diệt Chủng (Holocaust). Dù không phải một [Glossary('Vương Quốc Bóng Tối','game_concept_dark_kingdom_desc')] thực thụ, nó độc lập với [UmbraGlossary('dark_kingdom_of_iron')] vốn cai trị phần lớn kẻ chết của châu Âu."
 dark_kingdom_of_wire_effect_desc: "Mở khóa một tương tác cho phép bạn gửi một [GetTrait('wraith').GetName( GetNullCharacter )] bị trói buộc đến [Glossary('Vương Quốc Bóng Tối','game_concept_dark_kingdom_desc')] này để nó có cơ hội học được [arcanoi_lifestyle|E] mới."

 umbra_realm_dark_kingdom_of_sand: "Vương Quốc Bóng Tối Cát"
 umbra_realm_dark_kingdom_of_sand_desc: "Amenti, [Glossary('Vương Quốc Bóng Tối','game_concept_dark_kingdom_desc')] Cát, là [Glossary('Vương Quốc Bóng Tối','game_concept_dark_kingdom_desc')] của những Kẻ Bất Tử (Undying) trong [UmbraGlossaryLocalized('shadowlands','Âm Phủ')]. Nơi này không có oan hồn sinh sống, mà là các Bất Tử, những kẻ đã chết và thấy mình quay trở lại trong [UmbraGlossary('shadowlands')]."
 dark_kingdom_of_sand_effect_desc: "Mở khóa một tương tác cho phép bạn gửi một [GetTrait('wraith').GetName( GetNullCharacter )] bị trói buộc đến [Glossary('Vương Quốc Bóng Tối','game_concept_dark_kingdom_desc')] này để nó có cơ hội học được [arcanoi_lifestyle|E] mới."

 umbra_realm_swar: "Swar"
 umbra_realm_swar_desc: "Swar (hay Svarga), Thành Phố Hoan Lạc, là thành phố của kẻ chết Ấn Độ, Swar đóng vai trò là thành phố đầu não của Bhuvar, [UmbraGlossary('shadowlands')] của Ấn Độ."
 swar_effect_desc: "Mở khóa một tương tác cho phép bạn gửi một [GetTrait('wraith').GetName( GetNullCharacter )] bị trói buộc đến [Glossary('Vương Quốc Bóng Tối','game_concept_dark_kingdom_desc')] này để nó có cơ hội học được [arcanoi_lifestyle|E] mới."

 umbra_realm_night_markets: "Chợ Đêm"
 umbra_realm_night_markets_desc: "Chợ Đêm, trên danh nghĩa là một phần của [UmbraGlossary('swar')], nơi những Kẻ Chết Đông Nam Á cư ngụ."
 night_markets_effect_desc: "Mở khóa một tương tác cho phép bạn gửi một [GetTrait('wraith').GetName( GetNullCharacter )] bị trói buộc đến [Glossary('Vương Quốc Bóng Tối','game_concept_dark_kingdom_desc')] này để nó có cơ hội học được [arcanoi_lifestyle|E] mới."

 umbra_realm_mantaqat_khayal: "Mantaqat Khayal"
 umbra_realm_mantaqat_khayal_desc: "Mantaqat Khayal, [UmbraGlossary('shadowlands')] của Trung Đông. Rất ít điều được biết về vùng đất này, ngoại trừ việc cơn Rên Xiết (Keening) đã nhấn chìm nó trong một trận bão cát vĩnh cửu kể từ ít nhất là buổi bình minh của Hồi Giáo. Chỉ có các Necropolis mới che chở khỏi trận bão cát này, và nó chỉ được băng qua bởi thương nhân, người hành hương và dân du mục."
 mantaqat_khayal_effect_desc: "Mở khóa một tương tác cho phép bạn gửi một [GetTrait('wraith').GetName( GetNullCharacter )] bị trói buộc đến [Glossary('Vương Quốc Bóng Tối','game_concept_dark_kingdom_desc')] này để nó có cơ hội học được [arcanoi_lifestyle|E] mới."

 umbra_realm_islands_of_flint: "Những Hòn Đảo Đá Lửa"
 umbra_realm_islands_of_flint_desc: "Những Hòn Đảo Đá Lửa, được các nhà bản đồ học Stygia gọi là [Glossary('Vương Quốc Bóng Tối','game_concept_dark_kingdom_desc')] Đá Lửa, là lãnh địa của những oan hồn bản địa Bắc Mỹ."
 islands_of_flint_effect_desc: ""

 umbra_realm_feng_tu: "Feng-tu"
 umbra_realm_feng_tu_desc: "Feng-tu là một cõi giới trong Suối Vàng được các thế lực của Ngọc Hoàng tạo ra riêng để phản chiếu hình ảnh của Địa Ngục."
 feng_tu_effect_desc: ""

 umbra_realm_fields_of_aaru: "Cánh Đồng A'aru"
 umbra_realm_fields_of_aaru_desc: "Cánh Đồng A'aru là nơi cư ngụ của các Quan Tòa Ma'at và nằm trong [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] giữa những phế tích của [UmbraGlossary('dark_kingdom_of_sand')]. A'aru chỉ có thể được tìm thấy khi linh hồn không thân xác của một xác ướp (mummy) được Anubis hoặc một trong những tôi tớ của ngài, các Aken, hộ tống. Đây là nơi dành cho những oan hồn đã chứng tỏ mình xứng đáng tìm đến Thiên Đường."
 fields_of_aaru_effect_desc: ""

 umbra_realm_isle_of_eurydice: "Đảo Eurydice"
 umbra_realm_isle_of_eurydice_desc: "Đảo Eurydice đóng vai trò Tòa Số Mệnh, trụ sở của Quân Đoàn Số Mệnh, cũng như các thủ lĩnh của họ, Những Phu Nhân Số Mệnh, và vị Phu Nhân Số Mệnh tôn quý. Đảo này là nơi duy nhất trong số các Tòa của các Quân Đoàn không nằm ở chính Stygia."
 isle_of_eurydice_effect_desc: ""

 umbra_realm_shadow_realm: "Cõi Bóng"
 umbra_realm_shadow_realm_desc: "Cõi Bóng là những nơi trong [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] mà các Xác Ướp (Mummies) ghé thăm để tự tái sinh cho đến khi họ sẵn sàng nhập lại vào thân xác của mình, và những nơi này ban cho họ sự bảo vệ trước sự săn đuổi của Bóng Ma (Spectre) hay Xoáy Cuồng (Maelstrom)."
 shadow_realm_effect_desc: ""

 umbra_realm_hades: "Hades"
 umbra_realm_hades_desc: "[UmbraGlossary('shadow_realm')] trung tâm của các Xác Ướp Cabiri được gọi là Hades, theo tên [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] thần thoại Hy Lạp."
 hades_effect_desc: ""

 umbra_realm_gates_of_heaven: "Cổng Thiên Đường"
 umbra_realm_gates_of_heaven_desc: "Trách nhiệm đè nặng lên tất cả những Kẻ Tái Sinh (Reborn). Tám Vị Tiên giao nhiệm vụ cho Wu T'ian. Họ nhận chỉ thị, và họ phải thực thi ý trời. Khi thất bại, họ dành thời gian chiêm nghiệm tại Cổng Thiên Đường, chuẩn bị bản thân để không thất bại thêm lần nữa."
 gates_of_heaven_effect_desc: ""

 umbra_realm_yomi_wan: "Địa Ngục Yomi"
 umbra_realm_yomi: "Địa Ngục Yomi"
 umbra_realm_yomi_wan_desc: "Địa Ngục Yomi, còn được gọi là Yomi Wan hay theo nghĩa đen là Ngàn Địa Ngục, là những chiều không gian tâm linh nhân tạo được các [Glossary('Diêm Ma Vương','podgloss.yamaking')] tạo ra bằng cách kết hợp các thế giới linh hồn của [Glossary('Thế Giới Dương','game_concept_yang_world_desc')] và [UmbraGlossaryLocalized('shadowlands','Âm Giới')], nhằm phục vụ làm trụ sở của họ.\nChúng được chia thành các nhà tù dành cho linh hồn kẻ chết, mỗi nơi mang chủ đề theo [Glossary('Diêm Ma Vương','podgloss.yamaking')] cai trị nơi đó, và luôn trong tình trạng xung đột liên miên để giành quyền thống trị lẫn nhau."

 yomi_wan_effect_desc: "Mở khóa tương tác cho phép bạn gửi một [GetTrait('wraith').GetName( GetNullCharacter )] bị trói buộc đến [UmbraGlossary('yomi_wan')] để nó có thể trở về dưới dạng [GetTrait('kueijin').GetName( GetPlayer )]."

 umbra_realm_sea_of_shadow: "Biển Bóng Tối"
 umbra_realm_sea_of_shadow_desc: "Biển Bóng Tối là thuật ngữ mà các Oan Hồn dùng để chỉ lớp "đáy" của [UmbraGlossary('tempest')], chảy quanh và chảy vào [UmbraGlossary('pod_realm_labyrinth')] và [UmbraGlossary('oblivion')]."
 sea_of_shadow_effect_desc: "Cho phép bạn tìm thấy một whistimmu ngẫu nhiên dưới dạng [umbra_expedition|E].\nNhận $POD_plasmic_maa$ dưới dạng [umbra_expedition|E], cho phép chiêu mộ $POD_plasmic_maa$ làm [men_at_arms|E]."

 umbra_realm_tempest: "Bão Tố"
 umbra_realm_tempest_desc: "Bão Tố là một cơn lốc năng lượng, ký ức xoáy cuộn vĩnh viễn và #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Bóng Ma#!#! phát ra từ [UmbraGlossary('pod_realm_labyrinth')] và không ngừng đổ mưa huyết tương (plasma) cùng vật chất xuống cả [UmbraGlossary('shadowlands')] lẫn các [Glossary('Vương Quốc Bóng Tối','game_concept_dark_kingdom_desc')]."
 tempest_effect_desc: "Cho phép bạn tìm thấy một whistimmu ngẫu nhiên dưới dạng [umbra_expedition|E].\nNhận $POD_plasmic_maa$ dưới dạng [umbra_expedition|E], cho phép chiêu mộ $POD_plasmic_maa$ làm [men_at_arms|E]."

 umbra_realm_stormwall: "Bức Tường Bão"
 umbra_realm_stormwall_desc: "Bức Tường Bão là một rào chắn siêu hình giữa thế giới của người sống và kẻ chết."
 stormwall_effect_desc: "Cho phép bạn tìm thấy một whistimmu ngẫu nhiên dưới dạng [umbra_expedition|E].\nNhận $POD_plasmic_maa$ dưới dạng [umbra_expedition|E], cho phép chiêu mộ $POD_plasmic_maa$ làm [men_at_arms|E]."

 umbra_realm_island_below_the_sea: "Hòn Đảo Dưới Biển"
 umbra_realm_island_below_the_sea_desc: "Ở giữa [UmbraGlossary('abyss')], giữa [UmbraGlossary('mirrorlands')] và [UmbraGlossary('oblivion')], là Hòn Đảo Dưới Biển, đóng vai trò là quê nhà của Les Mystéres và một căn cứ hoạt động cho các Loa."
 island_below_the_sea_effect_desc: "Nếu bạn là một oan hồn, có được quyền truy cập cây Connaissance của [misc_arcanoi_lifestyle|E]. (dưới dạng [umbra_expedition|E])"

 umbra_realm_mirrorlands: "Mirrorlands"
 umbra_realm_mirrorlands_desc: "Mirrorlands là tên gọi cho những phản chiếu [UmbraGlossary('shadowlands')] của các hòn đảo Caribbean, do các oan hồn được gọi là Les Invisibles đặt cho."
 mirrorlands_effect_desc: ""

 umbra_realm_pod_realm_labyrinth: "Labyrinth"
 umbra_realm_pod_realm_labyrinth_desc: "Labyrinth có cấu trúc tương đối lỏng lẻo, và không tấm bản đồ nào có thể lý giải được nó; những mốc địa danh tồn tại cũng dễ dàng dịch chuyển."

 pod_realm_labyrinth_effect_desc: "Mở khóa một tương tác cho phép bạn gửi một [GetTrait('wraith').GetName( GetNullCharacter )] bị trói buộc đến Labyrinth để nó có thể trở về dưới dạng một [GetModifier('doomslayer_modifier').GetNameWithTooltip].\nNếu bạn là một oan hồn, có được hiệu ứng [GetModifier('doomslayer_modifier').GetNameWithTooltip]. (dưới dạng [umbra_expedition|E])"

 umbra_realm_well_of_the_void: "Giếng Hư Không"
 umbra_realm_well_of_the_void_desc: "Giếng Hư Không là hiện thân vật lý của [UmbraGlossary('oblivion')], nằm ở trung tâm và đáy sâu nhất của [UmbraGlossary('pod_realm_labyrinth')]."
 well_of_the_void_effect_desc: ""

 umbra_realm_oblivion: "Hư Vô"
 umbra_realm_oblivion_desc: "Hư Vô chính là entropy, một thế lực hủy diệt và điên loạn không ngừng cuộn trào mà từ đó không có đường quay lại."
 oblivion_effect_desc: "#X Bất kỳ sinh vật nào bước vào đây sẽ bị xóa sổ sự tồn tại của mình.#!"

 umbra_realm_abyss: "Vực Thẳm"
 umbra_realm_abyss_desc: "Vực Thẳm, còn được gọi là Địa Ngục hay Hố Sâu, là chiều không gian tối tăm bóng tối do Chúa Trời tạo ra như một nhà tù vĩnh cửu cho lũ Sa Ngã (Fallen)."

 abyss_effect_desc: ""

 umbra_realm_dis: "Dis"
 umbra_realm_dis_desc: "Chút tổ chức ít ỏi mà những Người Lái Đò (Ferrymen) có được đều xoay quanh Dis, một Biển Sargasso của các pháo đài, hang động và tàu thuyền trong [UmbraGlossary('tempest')]. Nơi đây chứa các địa điểm tụ họp chính của họ, trụ sở của các bộ phận lưu trữ và chế tạo, cùng ủy ban điều hành nhỏ của họ."
 dis_effect_desc: ""

 umbra_realm_spirit_wilds: "Spirit Wilds"
 umbra_realm_spirit_wilds_desc: "Spirit Wilds là tên gọi khác của Middle Umbra, đặc biệt là khoảng không gian giữa các Near Realm. Phần này của [umbra|E] phản chiếu môi trường tự nhiên, cả ở trạng thái nguyên sơ lẫn bị văn minh làm tổn thương."

 spirit_wilds_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_the_homeland_of_the_black_furies: "Quê Hương của Black Furies"
 umbra_realm_the_homeland_of_the_black_furies_desc: "Quê hương của Black Furies giống với những cảnh sắc của Hy Lạp thần thoại: Những dãy núi đá sừng sững trên vô số hòn đảo nhỏ và bán đảo trải dài ra biển xanh ngọc. Những khu rừng thông và ô liu tươi tốt, luôn trĩu quả, trải dài trên đảo, cùng những công trình xây theo phong cách Hy Lạp, dù gần đây, những công trình từ mọi nơi trên thế giới cũng đã xuất hiện. Vô số hiện thân của kẻ săn mồi, con mồi và con người cư ngụ trong quê hương này. Mọi sinh vật đều sống như một phần của vòng tuần hoàn săn mồi-con mồi tự nhiên, không bên nào bị săn bắt quá mức hay chết đói."
 the_homeland_of_the_black_furies_effect_desc: "$UMBRA_DISCOVERY_FETISH$\n$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_the_homeland_of_the_bone_gnawers: "Quê Hương của Bone Gnawers"
 umbra_realm_the_homeland_of_the_bone_gnawers_desc: "Quê hương của Bone Gnawers giống như khu ổ chuột của một thành phố. Các quán rượu mở cửa 24 giờ mỗi ngày và đều phục vụ bia rẻ tiền theo bình. Những tụ điểm vui chơi có mặt ở mọi góc phố, nhưng những Gnawer tinh khôn biết rằng những chỗ tốt nhất nằm trong các con hẻm sau, chỉ cần gõ đúng cửa. Bên ngoài thành phố, có một vùng đồi núi với những khu rừng thưa và đàn gia súc béo tốt."
 the_homeland_of_the_bone_gnawers_effect_desc: "$UMBRA_DISCOVERY_FETISH$\n$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_the_homeland_of_the_children_of_gaia: "Quê Hương của Children of Gaia"
 umbra_realm_the_homeland_of_the_children_of_gaia_desc: "Quê hương của Children of Gaia là một vùng đất rộng lớn của những khu rừng tươi tốt, đồi núi thoai thoải và những dòng suối róc rách len lỏi qua các thung lũng. Con người thoát khỏi Delirium lang thang du mục khắp quê hương này, với những đô thị trung tâm phản chiếu những phiên bản sạch sẽ hơn của các thành phố Sumer cổ đại. Những đàn linh thú kỳ lân gặm cỏ trên đồi và mỗi vị khách đều nhận được một anamae-kỳ lân dẫn đường qua cõi giới."
 the_homeland_of_the_children_of_gaia_effect_desc: "$UMBRA_DISCOVERY_FETISH$\n$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_the_homeland_of_the_fianna: "Quê Hương của Fianna"
 umbra_realm_the_homeland_of_the_fianna_desc: "Quê hương của Fianna là một cảnh sắc xanh tươi của đồi núi, thung lũng nhỏ và thung lũng trông như được vẽ ra từ những truyền thống của tiểu thuyết giả tưởng lịch sử. Các nàng tiên đùa giỡn trong rừng và những linh thú hươu đực lang thang trên đất dưới sự dẫn dắt của Stag trong "Cuộc Săn Hoang Dã", bảo vệ quê hương khỏi những kẻ xâm nhập. Những lễ hội tự phát thường xuyên diễn ra tại quê hương này và có xu hướng thu hút bất kỳ ai trong tầm nghe."
 the_homeland_of_the_fianna_effect_desc: "$UMBRA_DISCOVERY_FETISH$\n$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_the_homeland_of_the_get_of_fenris: "Quê Hương của Get of Fenris"
 umbra_realm_the_homeland_of_the_get_of_fenris_desc: "Những vịnh hẹp, những vùng lãnh nguyên bao la và rừng taiga lạnh giá, tối tăm, tất cả được bao trùm bởi mùa đông vĩnh cửu, tạo nên quê hương của Fenrir. Những đàn thú khổng lồ thời băng hà, như sói dữ và voi ma mút, lang thang trên đất và tấn công bất kỳ người sói đơn độc nào. Người Fenrir tụ họp trong những làng-lữ quán nơi họ uống rượu, đánh nhau, ăn chơi và truyền lại những trường ca về chiến công của mình."
 the_homeland_of_the_get_of_fenris_effect_desc: "$UMBRA_DISCOVERY_FETISH$\n$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_the_homeland_of_the_glass_walkers: "Quê Hương của [SelectLocalization( And(GetVariableSystem.Exists( 'spirit_travel_open' ), IsDefaultGUIMode), 'glasswalker_CUSTOM', 'glasswalker_modern_name')]"
 umbra_realm_the_homeland_of_the_glass_walkers_desc: "Quê hương của [SelectLocalization( And(GetVariableSystem.Exists( 'spirit_travel_open' ), IsDefaultGUIMode), 'glasswalker_CUSTOM', 'glasswalker_modern_name')] là một đô thị được xây dựng theo những thiết kế của Gaia. Những tòa tháp cao có hàng chục tầng vườn ngoài trời tràn ngập cây cối cùng chim chóc và muông thú tự nhiên bị thu hút bởi những loài thực vật này. Mỗi khu vườn phục vụ một hệ sinh thái khác nhau. Nhiều con người vui vẻ sống cả đời mình chỉ trong vài tòa tháp."
 glasswalker_CUSTOM: "[GetPlayer.Custom( 'glasswalker_custom_name' )]"
 the_homeland_of_the_glass_walkers_effect_desc: "$UMBRA_DISCOVERY_FETISH$\n$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_the_homeland_of_the_red_talons: "Quê Hương của Red Talons"
 umbra_realm_the_homeland_of_the_red_talons_desc: "Quê hương của Red Talons là một vùng hoang dã rộng lớn, chưa bị hủy hoại. Những kẻ săn mồi săn bắt không hạn chế và cạnh tranh lẫn nhau. Nổi bật nhất là những đàn sói lớn đã trở nên thống trị quê hương này."
 the_homeland_of_the_red_talons_effect_desc: "$UMBRA_DISCOVERY_FETISH$\n$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_the_homeland_of_the_shadow_lords: "Quê Hương của Shadow Lords"
 umbra_realm_the_homeland_of_the_shadow_lords_desc: "Shadow Lords sống trong một vùng bị một Ngọn Núi Vĩ Đại thống trị, bầu trời luôn bị bao phủ bởi mây đen và giông bão. Những đỉnh núi và khu rừng bên dưới chìm trong bóng tối vĩnh cửu, nơi các Shadow Lords tụ họp trong những tòa lâu đài để âm mưu chống lại lẫn nhau nhằm tìm ra cách trèo lên ngọn núi."
 the_homeland_of_the_shadow_lords_effect_desc: "$UMBRA_DISCOVERY_FETISH$\n$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_the_homeland_of_the_stargazers: "Quê Hương của Stargazers"
 umbra_realm_the_homeland_of_the_stargazers_desc: "Lãnh địa của Stargazers là một cõi giới được thiết kế để thử thách cả năm hình dạng của Garou. Những ngọn núi cao hơn cả dãy Himalaya chiếm giữ trung tâm Cõi Giới. Một vành đai đồi thấp bao quanh chân những đỉnh núi này, phủ đầy đồng cỏ tươi tốt, sa mạc hay những khu rừng nguy nga. Các đền thờ đáp ứng nhu cầu tu luyện tâm linh nội tại của bất kỳ Garou nào."
 the_homeland_of_the_stargazers_effect_desc: "$UMBRA_DISCOVERY_FETISH$\n$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_the_homeland_of_the_silver_fangs: "Quê Hương của Silver Fangs"
 umbra_realm_the_homeland_of_the_silver_fangs_desc: "Quê hương của Silver Fangs là một vùng lãnh thổ rộng lớn giống với thảo nguyên Nga. Những linh thú chim ưng bay lượn trên bầu trời, dõi theo mọi vị khách và báo cho Falcon biết về sự hiện diện của họ. Ở trung tâm lãnh địa sừng sững Lâu Đài Anh Hùng, một tượng đài tưởng nhớ những chiến công của Silver Fangs khi phụng sự cho Quốc Gia Garou."
 the_homeland_of_the_silver_fangs_effect_desc: "$UMBRA_DISCOVERY_FETISH$\n$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_the_homeland_of_the_corax: "Quê Hương của Corax"
 umbra_realm_the_homeland_of_the_corax_desc: "Quê hương của Corax là một cây khổng lồ với vô số cành nhánh trải rộng, đầy những hốc cây lý tưởng để làm tổ. Helios chiếu sáng vĩnh viễn trên cái cây này, vốn được kết nối với gần như mọi cõi giới trong umbra, cho phép loài người-quạ (wereraven) di chuyển nhanh chóng."
 the_homeland_of_the_corax_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_the_homeland_of_the_nuwisha: "Quê Hương của Nuwisha"
 umbra_realm_the_homeland_of_the_nuwisha_desc: "Quê hương của Nuwisha được gọi là Đường Hầm của Coyote. Toàn bộ Cõi Giới là một căn phòng hình bầu dục với một chiếc bàn trung tâm khổng lồ chất đầy thức ăn không bao giờ vơi. Những cánh cửa xếp dọc theo tường, dẫn đến bất kỳ nơi nào một Nuwisha từng ghé thăm. Một số cánh cửa này bị khóa, nhưng lại mở ra vào những thời điểm dường như ngẫu nhiên."
 the_homeland_of_the_nuwisha_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_the_homeland_of_the_silent_striders: "Quê Hương của Silent Striders"
 umbra_realm_the_homeland_of_the_silent_striders_desc: "Quê hương của Silent Striders bị chi phối bởi một dòng sông khổng lồ gọi là Dòng Sông Sự Sống. Được bao trùm trong bóng đêm vĩnh cửu, phần còn lại của nó gồm những sa mạc bạc lấp lánh rộng lớn và bị chi phối bởi những tháp bút (obelisk) cùng những công trình đồ sộ tương tự khắc đầy chữ tượng hình, được canh chỉnh cẩn thận để làm nổi bật những chòm sao tưởng nhớ các anh hùng Silent Strider thời xưa."
 the_homeland_of_the_silent_striders_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_the_homeland_of_the_uktena: "Quê Hương của Uktena"
 umbra_realm_the_homeland_of_the_uktena_desc: "Quê hương của Uktena giống với Vùng Đất Thuần Khiết (Pure Lands). Giờ đây những linh hồn tổ tiên cuối cùng của các bộ tộc này chỉ còn cư ngụ trong quê hương này. Những sinh vật thần thoại độc đáo và những anh hùng trong truyền thuyết Thổ Dân Châu Mỹ cũng lập nhà trong Cõi Giới này và trao đổi bí mật với Uktena để đổi lấy sự bảo vệ lâu dài. Cõi giới này có mối liên kết với [UmbraGlossary('abyss')], cũng như [UmbraGlossary('galunlati')], nơi chính Uktena cư ngụ."
 the_homeland_of_the_uktena_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_galunlati: "Galunlati"
 umbra_realm_galunlati_desc: "Galunlati là quê nhà trong Umbra của Đại Uktena, linh vật tổ (totem) của bộ tộc Uktena. Đây là nơi cư ngụ của những mãnh thú thần thoại và là quê nhà của những nét đặc trưng nguy hiểm và uy nghi nhất của thiên nhiên. Thiên nhiên hiện rõ nét hơn trong Galunlati: Những đỉnh núi cao hơn, rừng rậm dày hơn, sông chảy xiết hơn và bão tố dữ dội hơn. Nhiều Uktena muốn giành lấy cấp bậc Trưởng Lão trước tiên phải ghé thăm Galunlati và sống sót qua đó trước khi được chấp nhận vào những vòng tròn cao hơn của bộ tộc mình."
 galunlati_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_the_homeland_of_the_wendigo: "Quê Hương của Wendigo"
 umbra_realm_the_homeland_of_the_wendigo_desc: "Quê hương của Wendigo là một vùng lãnh nguyên băng giá với mùa đông vĩnh cửu và một dải Cực Quang khổng lồ vắt ngang bầu trời đêm. Những cơn bão tuyết gào thét không ngớt trên khắp cảnh sắc, nhanh chóng bào mòn bất kỳ ai không tìm được một trong những khu định cư ẩn giấu của Wendigo. Nó được kết nối với nhiều Near Realm khác, bao gồm Aetherial Reaches, [UmbraGlossary('legendary_realm')], [UmbraGlossary('pangaea')] và quê hương của Uktena và Croatan."
 the_homeland_of_the_wendigo_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_the_homeland_of_the_croatan: "Quê Hương của Croatan"
 umbra_realm_the_homeland_of_the_croatan_desc: "Vùng đất của Croatan giống với những khu rừng taiga Bắc Mỹ. Khí hậu luôn lạnh và sương mù, thỉnh thoảng có mưa. Không có hiện thân (emanation) nào được tìm thấy và toàn bộ quê hương này yên tĩnh đến ám ảnh. Turtle ngủ ở trung tâm cõi giới, thỉnh thoảng cựa mình trong giấc ngủ."
 the_homeland_of_the_croatan_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_the_homeland_of_the_bunyip: "Quê Hương của Bunyip"
 umbra_realm_the_homeland_of_the_bunyip_desc: "Cõi Giới có đủ loại khí hậu đa dạng bao gồm rừng ngập mặn nhiệt đới, hẻm núi sâu, vùng cây bụi ôn đới và rừng mưa mát mẻ. Mọi vùng đất mà Bunyip từng lập nhà và cất tiếng hát đều được tái hiện tại đây. Nơi đây có cư dân là những sinh vật của [UmbraGlossary('dreamtime')] cũng như những hiện thân linh hồn của loài động vật đã tuyệt chủng của Úc."
 the_homeland_of_the_bunyip_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_the_former_homeland_of_the_white_howlers: "Quê Hương Cũ của White Howlers"
 umbra_realm_the_former_homeland_of_the_white_howlers_desc: "Quê hương cũ của White Howlers đã bị $glossary_wyrm$ vặn xoắn đến mức không thể nhận ra. Không khí đặc quánh khói và gợn sóng vì hơi nóng. Một mặt trời xanh bệnh hoạn thiêu đốt xuống bề mặt, không hề được che chắn bởi bất kỳ tầng ozone nào. Đêm xuống cũng chẳng mang lại chút nhẹ nhõm nào khi các chất ô nhiễm nguội đi và lắng xuống bề mặt, khiến mặt trăng hiện lên một màu vàng huỳnh quang xuyên qua lớp hơi độc."
 the_former_homeland_of_the_white_howlers_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_calumn: "Calumn"
 umbra_realm_calumn_desc: "Một Calumn là lãnh địa của $glossary_wyrm$ nằm trong Near Umbra. Chúng hình thành khi một cảm xúc tiêu cực đặc biệt mạnh mẽ được bộc lộ tại một nơi trong thế giới vật chất đến mức để lại dấu ấn trong [umbra|E]. Đây là một thỏi nam châm thu hút lũ Bane, và những Linh Hồn sống gần một Calumn mang những dấu hiệu của cảm xúc tương ứng, thậm chí cả những vật vô tri cũng bị nhiễm độc bởi sự gần gũi đó."

 calumn_effect_desc: "$UMBRA_DISCOVERY_FETISH$\n$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_heavenly_flower_garden: "Vườn Hoa Thiên Giới"
 umbra_realm_heavenly_flower_garden_desc: "Vườn Hoa Thiên Giới được mô tả là quê nhà của các vị thần. Bên trong đó, linh hồn của kẻ chết được vun trồng như những đóa hoa và cuối cùng nở rộ thành một thân xác mới, trong khi linh hồn của người sống được thể hiện dưới dạng những đóa hoa nở rộ. Tại đây, các pháp sư già đã tán tỉnh chúng bằng những bài ca và thơ phú cho đến khi được chấp nhận làm tôi tớ của họ trên trần gian. Chuyến hành trình này được gọi là Chan Fa, trong đó Wu-Keng không chỉ tiên đoán những sự ra đời mới, mà còn giao tiếp với linh hồn của những người thân đã khuất."
 heavenly_flower_garden_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_xi_wang_chin: "Xi Wang Chi"
 umbra_realm_xi_wang_chin_desc: "Đây là một nơi của bão tố bất tận và nước gào thét, tràn ngập cơn thịnh nộ nguyên sơ của các nguyên tố và khó chịu đối với mọi sinh vật không thuộc về cõi giới này. Chỉ có Mokolé và Nagah biết đến sự tồn tại của nó, nhưng phần lớn, cõi giới này bị họ tránh né, vì cư dân của nó cực kỳ nguy hiểm và không nên bị quấy rầy một cách bừa bãi. Tuy nhiên, đôi khi, người Nagah có thể mạo hiểm đến Xi Wang Chi để tìm kiếm một món quà mà họ đặc biệt cần đến."
 xi_wang_chin_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_atrocity_realm: "Cõi Tàn Bạo"
 umbra_realm_atrocity_realm_desc: "Cõi Tàn Bạo, được các pháp sư gọi là Vùng Đất Hoang Tàn (Wasteland), là một trong những Near Realm. Hàng thiên niên kỷ đau khổ từ mọi nạn nhân trên thế giới đã tạo nên Cõi Giới này, một nơi mà những sự tàn bạo và tra tấn tồi tệ nhất đã được lưu danh bất tử."
 atrocity_realm_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_battleground: "Chiến Trường"
 umbra_realm_battleground_desc: "Chiến Trường, được biết đến ở phương Đông là Cõi Giới của Những Chiến Hồn (Realm of Fighting Spirits), là một Near Realm trong [umbra|E] chứa đựng mọi trận chiến từng được đánh, từ những cuộc xung đột sớm nhất giữa các bộ lạc thời đồ đá mới chống lại gấu và sói, cuộc Impergium và các cuộc Chiến Tranh Cuồng Nộ (Wars of Rage) cho đến những xung đột tôn giáo hiện tại ở Iberia và Trung Đông."
 battleground_effect_desc: "Phần thưởng/yêu cầu cao hơn khi mở khóa huấn luyện lối sống quân sự."

 umbra_realm_cyberrealm: "CyberRealm"
 umbra_realm_cyberrealm_desc: "CyberRealm là một trong mười ba Near Realm trong [umbra|E]. Cõi giới này có lẽ đại diện cho đỉnh cao ảnh hưởng của $glossary_weaver$ trong [umbra|E]. Nó được các pháp sư gọi là Dystopia."
 cyberrealm_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_digital_web: "Mạng Lưới Số"
 umbra_realm_digital_web_desc: "Mạng Lưới Số là một Vùng (Zone) hoàn toàn nằm trong thực tại ảo, và là quê nhà không chính thức của các Virtual Adept. Đây được cho là nền móng cho sáng kiến "Thực Tại 2.0" của các Adept, đưa nhân loại tiến đến một thế giới tốt đẹp hơn, thoát khỏi những vấn đề của thực tại vật chất trên Trái Đất. Cũng giống như Internet là một loại "không gian" ảo không liên quan đến bất kỳ vị trí thực tế nào, Mạng Lưới Số về mặt lý thuyết là một Điểm Tương Ứng (Correspondence Point) quan trọng. Nó cũng có thể có một dạng kết nối nào đó với Núi Qaf của Ahl-i-Batin."
 digital_web_effect_desc: ""

 umbra_realm_hollow_worlds: "Những Thế Giới Rỗng"
 umbra_realm_hollow_worlds_desc: "Không chỉ một mà là một loạt các phiên bản của thuyết về sự tồn tại của một Trái Đất Rỗng (Hollow Earth). Bề ngoài tương tự như những loại cõi giới thấy trong Middle Umbra, Những Thế Giới Rỗng đáng chú ý vì chúng có thể được những người phàm bình thường tiếp cận thông qua việc sử dụng một số lối đi ngầm, giếng mỏ và những chiếc thang máy không có gì đặc biệt. Hơn nữa, một số cho rằng Những Thế Giới Rỗng tạo thành một loại [umbra|E] hoàn toàn khác biệt, và gọi nó là "Umbra Nội Tại" (Inner Umbra), cho rằng nếu Trái Đất là một nhà hát và thế giới bên ngoài tiền sảnh là [umbra|E], thì khu vực hậu trường chính là nơi có thể tìm thấy Những Thế Giới Rỗng. Dù thế nào, những nỗ lực vượt qua Gauntlet để vào Những Thế Giới Rỗng luôn thất bại, khiến hầu hết các nhà lý thuyết về địa hình học Umbra phải bối rối."
 hollow_worlds_effect_desc: ""

 umbra_realm_erebus: "Erebus"
 umbra_realm_erebus_desc: "Thường được so sánh với 'địa ngục' của Garou, Erebus thực chất là một nơi thanh tẩy tâm linh. Nó tràn ngập những dòng sông bạc nóng chảy vừa thiêu đốt vừa chữa lành cùng lúc, kéo dài sự đau khổ của các tù nhân trong nhiều tháng, nhiều năm, thậm chí có thể hàng thế kỷ."
 erebus_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_flux_realm: "Cõi Biến Động"
 umbra_realm_flux_realm_desc: "Flux, Cõi Biến Động, hay Rạng Rỡ (Radiance) là một Cõi Giới trong Near Umbra. Đây là một hồ chứa mạnh mẽ của năng lượng Wyld thuần khiết, không pha loãng, chưa bị nhiễm bởi sự sắp đặt của Weaver."
 flux_realm_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_hy_brasil: "Hy-Brasil"
 umbra_realm_hy_brasil_desc: "Hy-Brasil hiện ra như một vùng đất của những câu chuyện thần kỳ bất tận. Tại đây, các mùa không bao giờ thay đổi và ngày luôn bị khóa chặt vĩnh viễn trong hoàng hôn. Ở nửa phía tây của vùng đất, mặt trời lặn trong bầu trời giữa hè. Về phía đông, mặt trăng mọc lên, lạnh lẽo và hung tợn, trên một đêm giữa mùa đông."
 hy_brasil_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_legendary_realm: "Cõi Giới Truyền Thuyết"
 umbra_realm_legendary_realm_desc: "Cõi Giới Truyền Thuyết là một trong những Near Realm nằm trong Near Umbra. Garou du hành qua cõi giới này có thể trải nghiệm cuộc đời của những vị tổ tiên huyền thoại của họ. Tuy nhiên, các sự kiện trong cõi giới này không phải là sự tái hiện lịch sử nghiêm ngặt; chúng có thể phản ánh những câu chuyện đã bị thay đổi qua thời gian để phù hợp với lý tưởng của thế giới hiện tại."
 legendary_realm_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_mountains_of_heaven: "Những Ngọn Núi Thiên Giới"
 umbra_realm_mountains_of_heaven_desc: "Những Ngọn Núi Thiên Giới là một Cõi Giới Umbra trong [Glossary('Thế Giới Dương','game_concept_yang_world_desc')]. Cõi Giới này hiện ra như một dãy núi vĩ đại, khiến ngay cả dãy Himalaya hùng vĩ cũng trở nên nhỏ bé, vươn cao trên một biển mây."
 mountains_of_heaven_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_pangaea: "Pangaea"
 umbra_realm_pangaea_desc: "Pangaea là một sự phản chiếu của Trái Đất nguyên thủy, cho thấy thế giới như nó đã từng trước khi có văn minh, lịch sử loài người, và thậm chí cả Impergium."
 pangaea_effect_desc: "Nhận hiệu ứng [GetModifier('paleontologist_modifier').GetNameWithTooltip] (dưới dạng [umbra_expedition|E])\n$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_scar: "Vết Sẹo"
 umbra_realm_scar_desc: "Vết Sẹo là một trong những Near Realm của [umbra|E]. Đây là một hiện thân của cuộc cách mạng công nghiệp bị biến chất thành sự áp bức nghiền nát linh hồn dưới một lý tưởng thịnh vượng đã hoen gỉ."
 scar_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_summer_country: "Xứ Sở Mùa Hạ"
 umbra_realm_summer_country_desc: "Xứ Sở Mùa Hạ là một trong những Near Realm nằm trong Near Umbra của Trái Đất. Giờ đây nó chẳng còn lại gì nhiều ngoài một huyền thoại, vì đã phai nhạt dần suốt hàng thập kỷ. Truyền thuyết kể rằng cõi giới này là sự phản chiếu tình yêu thuần khiết và vô bờ bến của Gaia dành cho những đứa con của Người."
 summer_country_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_tiger_lands: "Đất Hổ"
 umbra_realm_tiger_lands_desc: "Đất Hổ là một Yang Realm trong [umbra|E] phương Đông, đóng vai trò là nơi lánh nạn cho linh hồn của những loài vật bị đe dọa và những linh hồn đã mất quê hương sau nạn phá rừng của con người."
 tiger_lands_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_umi: "Umi"
 umbra_realm_umi_desc: "Một trong những cõi Umbra hùng mạnh nhất của Trung Thổ, lãnh địa Umi tự nhận toàn bộ Thái Bình Dương là phạm vi cai quản của mình, dù một số cõi linh hồn Polynesia và Indonesia không đồng tình như vậy."
 umi_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_wolfhome: "Wolfhome"
 umbra_realm_wolfhome_desc: "Wolfhome là một trong các Cõi Gần, nằm trong Umbra Gần của Trái Đất. Nơi đây thường có Garou lui tới. Cõi này là một vùng hoang dã nguyên sơ bao la. Lời giải cho những bí ẩn nguyên thủy được giấu kín tại đây."
 wolfhome_effect_desc: "$UMBRA_DISCOVERY_FETISH$\n$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_aetherial_realm: "Aetherial Realm"
 umbra_realm_aetherial_realm_desc: "Aetherial Realm, còn gọi là Aetheria, là vùng xa nhất của Cõi Gần bên trong Umbra, trải dài qua [UmbraGlossary('spirit_wilds')] cho đến tận Màng Chắn. Nó phản chiếu vào thế giới vật chất dưới hình hài bầu trời phía trên, nơi ngày và đêm luân chuyển không ngừng."
 aetherial_realm_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_court_of_eshtarra: "Court of Eshtarra"
 umbra_realm_court_of_eshtarra_desc: "$umbra_realm_eshtarra_desc$"
 umbra_realm_eshtarra: "Eshtarra"
 umbra_realm_eshtarra_desc: "Eshtarra, Người Kể Chuyện Ca Hát, là Hóa Thân Hành Tinh của Trái Đất theo Chiêm Tinh Học Garou."
 court_of_eshtarra_effect_desc: "Có thể nhận perk quà tặng hành tinh tương ứng qua một [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_court_of_sokhta: "Court of Sokhta"
 umbra_realm_court_of_sokhta_desc: "$umbra_realm_sokhta_desc$"
 umbra_realm_sokhta: "Sokhta"
 umbra_realm_sokhta_desc: "Sokhta là một hóa diện của Luna, vị Celestine bảo trợ cho Garou và nhiều Changing Breed khác, và cung điện của bà là nơi cư ngụ của vô số Lune cùng các linh hồn có cảm tình với Garou Nation."
 court_of_sokhta_effect_desc: "Có thể nhận perk quà tặng hành tinh tương ứng qua một [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_court_of_katanka_sonnak: "Court of Katanka-Sonnak"
 umbra_realm_court_of_katanka_sonnak_desc: "$umbra_realm_katanka_sonnak_desc$"
 umbra_realm_katanka_sonnak: "Katanka-Sonnak"
 umbra_realm_katanka_sonnak_desc: "Katanka-Sonnak, Kỵ Sĩ Cuồng Phong, là Hóa Thân Hành Tinh của Mặt Trời trong Chiêm Tinh Học Garou."
 court_of_katanka_sonnak_effect_desc: "Có thể nhận perk quà tặng hành tinh tương ứng qua một [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_court_of_mitanu: "Court of Mitanu"
 umbra_realm_court_of_mitanu_desc: "$umbra_realm_mitanu_desc$"
 umbra_realm_mitanu: "Mitanu"
 umbra_realm_mitanu_desc: "Mitanu, Kẻ Lừa Lọc Tinh Ranh, được biết đến trong chiêm tinh học Garou là Hóa Thân Hành Tinh của Sao Thủy. Hắn vừa là kẻ bịp bợm vừa là người yêu thích trò khôi hài."
 court_of_mitanu_effect_desc: "Có thể nhận perk quà tặng hành tinh tương ứng qua một [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_court_of_hakahe: "Court of Hakahe"
 umbra_realm_court_of_hakahe_desc: "$umbra_realm_hakahe_desc$"
 umbra_realm_hakahe: "Hakahe"
 umbra_realm_hakahe_desc: "Hakahe là Hóa Thân của Vulcan, hành tinh gần Mặt Trời hơn cả Sao Thủy, và được cho là kẻ đã rèn nên linh hồn của những Garou sơ sinh."
 court_of_hakahe_effect_desc: "Có thể nhận perk quà tặng hành tinh tương ứng qua một [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_court_of_tambiyah: "Court of Tambiyah"
 umbra_realm_court_of_tambiyah_desc: "$umbra_realm_tambiyah_desc$"
 umbra_realm_tambiyah: "Tambiyah"
 umbra_realm_tambiyah_desc: "Tambiyah, Người Mẹ Che Mạng, là Hóa Thân Hành Tinh của Sao Kim trong Chiêm Tinh Học Garou."
 court_of_tambiyah_effect_desc: "Có thể nhận perk quà tặng hành tinh tương ứng qua một [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_court_of_nerigal: "Court of Nerigal"
 umbra_realm_court_of_nerigal_desc: "$umbra_realm_nerigal_desc$"
 umbra_realm_nerigal: "Nerigal"
 umbra_realm_nerigal_desc: "Nerigal, Chiến Binh Băng Giá, là Hóa Thân Hành Tinh của Sao Hỏa theo Chiêm Tinh Học Garou."
 court_of_nerigal_effect_desc: "Có thể nhận perk quà tặng hành tinh tương ứng qua một [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_court_of_rorg: "Court of Rorg"
 umbra_realm_court_of_rorg_desc: "$umbra_realm_rorg_desc$"
 umbra_realm_rorg: "Rorg"
 umbra_realm_rorg_desc: "Rorg, Thợ Săn Nhiều Vuốt, là Hóa Thân của Turog, một hành tinh đã bị hủy diệt nay tạo thành Vành Đai Tiểu Hành Tinh, theo chiêm tinh học Garou."
 court_of_rorg_effect_desc: "Có thể nhận perk quà tặng hành tinh tương ứng qua một [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_court_of_zarok: "Court of Zarok"
 umbra_realm_court_of_zarok_desc: "$umbra_realm_zarok_desc$"
 umbra_realm_zarok: "Zarok"
 umbra_realm_zarok_desc: "Zarok, Đấng Cai Trị Đội Vương Miện, là Hóa Thân Hành Tinh của Sao Mộc trong Chiêm Tinh Học Garou."
 court_of_zarok_effect_desc: "Có thể nhận perk quà tặng hành tinh tương ứng qua một [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_court_of_lu_bat: "Court of Lu-Bat"
 umbra_realm_court_of_lu_bat_desc: "$umbra_realm_lu_bat_desc$"
 umbra_realm_lu_bat: "Lu-Bat"
 umbra_realm_lu_bat_desc: "Lu-Bat, Cố Vấn Điềm Tĩnh, là Hóa Thân Hành Tinh của Sao Thổ trong Chiêm Tinh Học Garou."
 court_of_lu_bat_effect_desc: "Có thể nhận perk quà tặng hành tinh tương ứng qua một [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_court_of_ruatma: "Court of Ruatma"
 umbra_realm_court_of_ruatma_desc: "$umbra_realm_ruatma_desc$"
 umbra_realm_ruatma: "Ruatma"
 umbra_realm_ruatma_desc: "Ruatma, Kẻ Ẩn Trong Bóng Tối, là Hóa Thân của Sao Thiên Vương."
 court_of_ruatma_effect_desc: "Có thể nhận perk quà tặng hành tinh tương ứng qua một [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_court_of_shantar: "Court of Shantar"
 umbra_realm_court_of_shantar_desc: "$umbra_realm_shantar_desc$"
 umbra_realm_shantar: "Shantar"
 umbra_realm_shantar_desc: "Shantar, Người Thợ Dệt Khung Cửi, là Hóa Thân của Sao Hải Vương."
 court_of_shantar_effect_desc: "Có thể nhận perk quà tặng hành tinh tương ứng qua một [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_court_of_meros: "Court of Meros"
 umbra_realm_court_of_meros_desc: "$umbra_realm_meros_desc$"
 umbra_realm_meros: "Meros"
 umbra_realm_meros_desc: "Meros, Kẻ Lang Thang, là Hóa Thân của Sao Diêm Vương."
 court_of_meros_effect_desc: "Có thể nhận perk quà tặng hành tinh tương ứng qua một [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_weaver_reaches: "Weaver Reaches"
 umbra_realm_weaver_reaches_desc: "Weaver Reaches là những dải thực tại đã bị vôi hóa cứng đờ, tựa như tấm bản đồ điện toán của một nhà thiên văn học. Các nút giao cắt của mạng lưới khóa chặt những vì sao lạnh lẽo và các hành tinh đóng băng vào một trật tự đối xứng phi tự nhiên. Không có dấu hiệu nào của sự sống. Những linh hồn $glossary_weaver$ khổng lồ như 'nhện sao' tuần tra và bảo trì mạng lưới, đảm bảo mọi thứ luôn ở đúng vị trí đã định."
 weaver_reaches_effect_desc: ""

 umbra_realm_wyld_reaches: "Wyld Reaches"
 umbra_realm_wyld_reaches_desc: "Wyld Reaches là một nơi hỗn mang. Các hành tinh và sao chổi nhảy múa quanh nhau, va chạm nhau theo những quy luật biến đổi không ngừng. Những vì sao lạnh cháy rực làm đông cứng mọi thứ xung quanh chúng, và những vì sao khác đẩy văng mọi vật bằng sóng phản trọng lực, tất cả xoay vòng lẫn nhau."
 wyld_reaches_effect_desc: "$UMBRA_DISCOVERY_FETISH$"

 umbra_realm_wyrm_reaches: "Wyrm Reaches"
 umbra_realm_wyrm_reaches_desc: "Những vì sao trong Wyrm Reaches đã cháy tàn thành xác chết vô hồn hoặc sụp đổ thành hố đen, thường dẫn thẳng vào [UmbraGlossary('malfeas')]. Các tinh vân ô nhiễm và balefire cuộn xoáy quanh chúng, che khuất các chòm sao khỏi tầm mắt bất kỳ ai nhìn vào, biến chúng thành những vệt đen tối trong bầu trời Umbra."
 wyrm_reaches_effect_desc: ""

 umbra_realm_mercury: "Sao Thủy"
 umbra_realm_mercury_desc: "Sao Thủy, theo nhận định chung, là một thế giới cằn cỗi, không khí quyển, chi chít hố thiên thạch.\n\nTương ứng bên Umbra cũng khó cư ngụ không kém, do vị trí quá gần Mặt Trời. Từng có thời Ahl-i-Batin đặt một Chantry trên thế giới này. Các Mage đã làm chậm vòng quay của hành tinh sao cho khu định cư, được xây trong một hố thiên thạch, luôn nằm ở rìa hoàng hôn."
 mercury_effect_desc: ""

 umbra_realm_venus: "Sao Kim"
 umbra_realm_venus_desc: "Trong thế giới vật chất, Sao Kim là một thế giới nóng bức, ngột ngạt, cằn cỗi với bầu khí quyển nghẹt thở nhiễm axit sulfuric. Tuy nhiên, khác với đa số hành tinh, nó có một Penumbra có thể phản chiếu một giai đoạn lịch sử sớm hơn của nó. Sao Kim ở Penumbra được bao phủ bởi những khu rừng nhiệt đới sum suê và các đại dương nông đầy đầm lầy. Mối liên hệ của nó với Sphere Life nghĩa là môi trường nơi đây tràn ngập mọi dạng sinh vật sống: các nhà thám hiểm có nguy cơ bị rêu hoặc nấm xâm chiếm cơ thể nếu đứng yên quá lâu, và có thể cần thường xuyên vệ sinh, khử trùng trang bị để tránh nhiễm nấm mốc."
 venus_effect_desc: ""

 umbra_realm_mars: "Sao Hỏa"
 umbra_realm_mars_desc: "Sao Hỏa từng có sự sống, và vì vậy có một Penumbra, nơi người ta có thể dễ dàng nhìn thấy tàn tích của những con kênh chạy dọc theo các đường ley cổ xưa. Ngay cả ở Penumbra, không khí vẫn loãng và bão cát dữ dội là một mối nguy hiểm."
 mars_effect_desc: ""

 umbra_realm_jupiter: "Sao Mộc"
 umbra_realm_jupiter_desc: "Trong khi bản thân Sao Mộc chỉ là một khối khí không có bề mặt, nhiều mặt trăng của nó lại dễ chịu hơn nhiều đối với khách viếng thăm. Tại đây, vượt ra ngoài Horizon, các Mage có thể thi triển những phép thuật phi thường mà không sợ Paradox. Mỗi mặt trăng được gọi là Gallilean hiện đang bị một phe Mage khác nhau kiểm soát, dù thế cục thay đổi nhanh chóng và thường xuyên. Các cổng dịch chuyển giữa hai mặt trăng bất kỳ của Sao Mộc hoặc Sao Thổ rất dễ mở, nên cần phòng thủ kiên cố để ngăn kẻ xâm nhập."
 jupiter_effect_desc: ""

 umbra_realm_saturn: "Sao Thổ"
 umbra_realm_saturn_desc: "Sao Thổ là một hành tinh khí khổng lồ ở vùng ngoài của hệ Mặt Trời. Giống Sao Mộc, việc ghé thăm "bề mặt" của Sao Thổ thực ra là bất khả thi. Tuy nhiên, các mặt trăng của nó lại là nơi đặt một số căn cứ được các Mage sử dụng."
 saturn_effect_desc: ""

 umbra_realm_uranus: "Sao Thiên Vương"
 umbra_realm_uranus_desc: "Không giống các mặt trăng của Sao Mộc và Sao Thổ, các mặt trăng của Sao Thiên Vương không dễ tiếp cận qua cổng dịch chuyển, và khoảng cách từ Horizon khiến các phương thức du hành khác trở nên nhọc nhằn. Akashic Brotherhood duy trì một Chantry trên một trong các mặt trăng đó, còn Marauder chiếm cứ vài mặt trăng khác, nhưng phần lớn khách viếng thăm đến Sao Thiên Vương vì sự cô lập, do đó hệ thống này phần lớn chưa được khám phá và không có ai cư ngụ. Ngược lại, [Glossary('Shade Realm','game_concept_shade_realm_desc')] của nó lại đón một lượng lớn người qua lại."
 uranus_effect_desc: ""

 umbra_realm_neptune: "Sao Hải Vương"
 umbra_realm_neptune_desc: "Giống Sao Thiên Vương, hoạt động của Mage nơi đây rất ít ỏi vì cách xa Horizon. Một vài chantry tồn tại trên các mặt trăng khác nhau của Sao Hải Vương, nhưng không rõ là những mặt trăng nào; một số trong đó có thể nằm trên các mặt trăng mà Sleeper còn chưa đặt tên."
 neptune_effect_desc: ""

 umbra_realm_pluto: "Sao Diêm Vương"
 umbra_realm_pluto_desc: "Sao Diêm Vương là một thế giới nhỏ, băng giá với một mặt trăng có kích thước tương đối lớn tên là Charon. Có một mặt trăng ẩn giấu lớn tên là Cerberus, nơi Euthanatos duy trì một chantry để nghiên cứu [Glossary('Shade Realm','game_concept_shade_realm_desc')]. Họ không cho phép người ngoài tiếp cận; họ không ngần ngại dùng vũ lực để đẩy lui các Mage cố xâm nhập, và không Tradition nào muốn thử vận may của mình."
 pluto_effect_desc: ""

 umbra_realm_moon: "Mặt Trăng"
 umbra_realm_moon_desc: "Các Mage xem Mặt Trăng có ít nhất ba hình thái khác biệt, tùy thuộc vào việc người ta đứng ở phía nào của Gauntlet và tiếp cận nó ra sao.\n\nBề mặt vật chất của Mặt Trăng là một vùng hoang mạc đá cằn cỗi hiếm khi có người ghé thăm.\n\nMặt Trăng có một Penumbra, nhưng Mặt Trăng ở Penumbra vẫn không có dấu hiệu sự sống — dù tại đây vẫn có thể nhìn thấy những tàn tích cho thấy không phải lúc nào cũng như vậy.\n\nHình thái thứ ba của Mặt Trăng là hình thái mà Garou biết đến, đó chính là cung điện của Phoebe, hay Sokhta, Hóa Thân Hành Tinh của Mặt Trăng."
 moon_effect_desc: ""

 umbra_realm_sun: "Mặt Trời"
 umbra_realm_sun_desc: "Khu vực của [UmbraGlossary('deep_umbra')] nơi ngự trị Helios chẳng có gì ngoài hơi nóng và ánh sáng trắng chói lòa. Những cây cầu tạo thành từ ánh sáng đỏ tựa như quầng lửa Mặt Trời bắc ngang qua các vực sâu chứa đầy nguyên tố bị siêu nhiệt hóa. Các Hóa Thân nguyên tố lửa cư ngụ nơi đây, rực rỡ và vui tươi, nhưng luôn sẵn sàng bảo vệ cõi giới trước kẻ xâm nhập. Chúng sẽ tấn công bất kỳ người sói nào bước vào cõi này, dù chúng chào đón Corax và những kẻ khác thờ phụng Helios. Bất kỳ bề mặt nào trong lãnh địa của Helios cũng quá nóng để đứng lại hay ở gần quá lâu. Chỉ những linh hồn biết bay mới có thể vào được khu vực này của Deep Umbra, còn những kẻ lữ hành không có khả năng bay sẽ bị thiêu rụi trong biển lửa trước khi kịp nhận ra sai lầm của mình."
 sun_effect_desc: ""

 umbra_realm_shard_realm_of_prime: "Shard Realm of Prime"
 umbra_realm_shard_realm_of_prime_desc: "[Glossary('Shard Realm','game_concept_shard_realm_desc')] nối liền với Trái Đất và Luna."
 shard_realm_of_prime_effect_desc: ""

 umbra_realm_darkside_moon_base: "Darkside Moon Base"
 umbra_realm_darkside_moon_base_desc: "Darkside Moon Base là một Void Engineer Construct nằm trong miệng hố thiên thạch Daedalus ở "mặt tối" của Mặt Trăng. Nơi đây được mô tả là một chốn u ám, ảm đạm để sinh sống và làm việc."
 darkside_moon_base_effect_desc: ""

 umbra_realm_victoria_station: "Victoria Station"
 umbra_realm_victoria_station_desc: "Victoria Station từng là một trạm không gian của Etherite nằm trong Penumbra của Mặt Trăng. Vốn là một nhà ga xe lửa từ thời London Victoria, nó từng phục vụ như căn cứ tiền phương cho nhiều Ethernaut khám phá [UmbraGlossary('deep_umbra')]."
 victoria_station_effect_desc: ""

 umbra_realm_shard_realm_of_infinity: "Shard Realm of Infinity"
 umbra_realm_shard_realm_of_infinity_desc: "[Glossary('Shard Realm','game_concept_shard_realm_desc')] nối liền với Sol."
 shard_realm_of_infinity_effect_desc: ""

 umbra_realm_shard_realm_of_correspondence: "Shard Realm of Correspondence"
 umbra_realm_shard_realm_of_correspondence_desc: "[Glossary('Shard Realm','game_concept_shard_realm_desc')] nối liền với Sao Thủy."
 shard_realm_of_correspondence_effect_desc: ""

 umbra_realm_mus: "Mus"
 umbra_realm_mus_desc: "Mus từng là mặt trăng duy nhất của Sao Thủy, một tảng đá xám bé nhỏ bị pháp thuật hùng mạnh khiến vô hình trước những người quan sát từ Trái Đất."
 mus_effect_desc: ""

 umbra_realm_fors_collegis_mercuris: "Fors Collegis Mercuris"
 umbra_realm_fors_collegis_mercuris_desc: "Fors Collegis Mercuris, "Học Viện Ngẫu Nhiên của Sao Thủy", từng là một trường phái pháp thuật bí mật dành cho các Mage tân nhập của Order of Hermes. Nó vốn được xây dựng ngoài thành Genoa, Ý vào năm 1190 bởi các Mage của House Bonisagus. Đến năm 1450, dưới áp lực ngày càng gia tăng từ các cuộc tấn công của Order of Reason, học viện được chuyển đến Horizon Realm của Mus, mặt trăng vô hình của Sao Thủy."
 fors_collegis_mercuris_effect_desc: ""

 umbra_realm_shard_realm_of_life: "Shard Realm of Life"
 umbra_realm_shard_realm_of_life_desc: "[Glossary('Shard Realm','game_concept_shard_realm_desc')] nối liền với Sao Kim."
 shard_realm_of_life_effect_desc: ""

 umbra_realm_seasonal_realms: "Seasonal Realms"
 umbra_realm_seasonal_realms_desc: "Seasonal Realms, hay Verbena Seasonal Realms, là bốn cõi giới riêng biệt bên trong [UmbraGlossary('shard_realm_of_life')], còn được biết đến như hình chiếu Umbra của hành tinh Sao Kim."
 seasonal_realms_effect_desc: ""

 umbra_realm_shard_realm_of_forces: "Shard Realm of Forces"
 umbra_realm_shard_realm_of_forces_desc: "[Glossary('Shard Realm','game_concept_shard_realm_desc')] nối liền với Sao Hỏa."
 shard_realm_of_forces_effect_desc: ""

 umbra_realm_shard_realm_of_matter: "Shard Realm of Matter"
 umbra_realm_shard_realm_of_matter_desc: "[Glossary('Shard Realm','game_concept_shard_realm_desc')] nối liền với Sao Mộc."
 shard_realm_of_matter_effect_desc: ""

 umbra_realm_shard_realm_of_time: "Shard Realm of Time"
 umbra_realm_shard_realm_of_time_desc: "[Glossary('Shard Realm','game_concept_shard_realm_desc')] nối liền với Sao Thổ."
 shard_realm_of_time_effect_desc: ""

 umbra_realm_shard_realm_of_spirit: "Shard Realm of Spirit"
 umbra_realm_shard_realm_of_spirit_desc: "[Glossary('Shard Realm','game_concept_shard_realm_desc')] nối liền với Sao Thiên Vương."
 shard_realm_of_spirit_effect_desc: ""

 umbra_realm_shard_realm_of_mind: "Shard Realm of Mind"
 umbra_realm_shard_realm_of_mind_desc: "[Glossary('Shard Realm','game_concept_shard_realm_desc')] nối liền với Sao Hải Vương."
 shard_realm_of_mind_effect_desc: ""

 umbra_realm_shard_realm_of_entropy: "Shard Realm of Entropy"
 umbra_realm_shard_realm_of_entropy_desc: "[Glossary('Shard Realm','game_concept_shard_realm_desc')] nối liền với Sao Diêm Vương."
 shard_realm_of_entropy_effect_desc: ""

 umbra_realm_cerberus: "Cerberus"
 umbra_realm_cerberus_desc: "Cerberus là tên một mặt trăng của Sao Diêm Vương trong hệ Mặt Trời. Nó không thể quan sát được từ Trái Đất và do đó chưa từng được Sleeper xác định."
 cerberus_effect_desc: ""

 umbra_realm_shade_realm_of_correspondence: "Shade Realm of Correspondence"
 umbra_realm_shade_realm_of_correspondence_desc: "[Glossary('Shade Realm','game_concept_shade_realm_desc')] nối liền với Sao Thủy. [Glossary('Shade Realm','game_concept_shade_realm_desc')] này không thể tiếp cận trực tiếp từ Trái Đất, và những ai xoay xở đến được đó thấy mình di chuyển xuyên qua không gian toàn chiều theo những hình học không thể nắm bắt."
 shade_realm_of_correspondence_effect_desc: ""

 umbra_realm_shade_realm_of_life: "Shade Realm of Life"
 umbra_realm_shade_realm_of_life_desc: "[Glossary('Shade Realm','game_concept_shade_realm_desc')] nối liền với Sao Kim. Cõi này là một khu rừng rậm tươi tốt, biến đổi không ngừng. Sự dễ tiếp cận tương đối của nó từ Trái Đất khiến nơi đây trở thành chiến trường thường xuyên trong Ascension War."
 shade_realm_of_life_effect_desc: ""

 umbra_realm_shade_realm_of_forces: "Shade Realm of Forces"
 umbra_realm_shade_realm_of_forces_desc: "[Glossary('Shade Realm','game_concept_shade_realm_desc')] nối liền với Sao Hỏa. Shade Realm of Forces là một cơn bão bất tận, chỉ có vài khoảng lặng hiếm hoi, cô lập. [doissetep|E] từng chiếm cứ một trong những khoảng lặng đó, ít nhất là cho đến khi nó bị hủy diệt. Cũng như Shade Realm of Life, nơi đây thường (dù nguy hiểm) là chiến trường cho các trận chiến giữa Mage."
 shade_realm_of_forces_effect_desc: ""

 umbra_realm_shade_realm_of_matter: "Shade Realm of Matter"
 umbra_realm_shade_realm_of_matter_desc: "[Glossary('Shade Realm','game_concept_shade_realm_desc')] nối liền với Sao Mộc. Cõi này có thể liên kết với Hollow Earth, hoặc có thể tương tự nhưng ở quy mô lớn hơn nhiều — một đế chế của khủng long, các nền văn minh đã mất và những thứ khác không còn tồn tại nữa."
 shade_realm_of_matter_effect_desc: ""

 umbra_realm_shade_realm_of_time: "Shade Realm of Time"
 umbra_realm_shade_realm_of_time_desc: "[Glossary('Shade Realm','game_concept_shade_realm_desc')] nối liền với Sao Thổ. Bất kỳ ai ghé thăm Shade Realm of Time đều đang liều lĩnh nghiêm trọng, vì chỉ cần một cử động nhỏ nhất cũng gây ra biến dạng thời gian và du hành thời gian ngoài tầm kiểm soát."
 shade_realm_of_time_effect_desc: ""

 umbra_realm_shade_realm_of_spirit: "Shade Realm of Spirit"
 umbra_realm_shade_realm_of_spirit_desc: "[Glossary('Shade Realm','game_concept_shade_realm_desc')] nối liền với Sao Thiên Vương. Không có Gauntlet nào trong Shade Realm of Spirit: linh hồn và người phàm có thể tương tác trực tiếp với nhau. Tại đây, Avatar của một Mage cũng có thể hiện hình xác thịt và trò chuyện với họ."
 shade_realm_of_spirit_effect_desc: ""

 umbra_realm_shade_realm_of_mind: "Shade Realm of Mind"
 umbra_realm_shade_realm_of_mind_desc: "[Glossary('Shade Realm','game_concept_shade_realm_desc')] nối liền với Sao Hải Vương. Bản chất của Shade Realm of Mind, như người ta có thể đoán được, được định hình bởi chính điều mà kẻ ghé thăm mong đợi tìm thấy ở đó. Nó phản chiếu lại chính suy nghĩ và cảm xúc của khách viếng thăm, chẳng khác nào một tấm gương."
 shade_realm_of_mind_effect_desc: ""

 umbra_realm_shade_realm_of_entropy: "Shade Realm of Entropy"
 umbra_realm_shade_realm_of_entropy_desc: "[Glossary('Shade Realm','game_concept_shade_realm_desc')] nối liền với Sao Diêm Vương. Người ta cho rằng tại đây Bánh Xe Nghiệp Chướng Vĩ Đại của Vũ Trụ được phơi bày trần trụi, và nó thậm chí có thể có mối liên hệ trực tiếp với [UmbraGlossary('shadowlands')]."
 shade_realm_of_entropy_effect_desc: ""

 umbra_realm_first_horizon: "First Horizon"
 umbra_realm_first_horizon_desc: "First Horizon nằm ở rìa khí quyển Trái Đất và rải rác các Horizon Realm, bao gồm cả [Glossary('Shade Realm','game_concept_shade_realm_desc')]."
 first_horizon_effect_desc: ""

 umbra_realm_true_horizon: "True Horizon"
 umbra_realm_true_horizon_desc: "True Horizon là một vùng bao la của [umbra|E] nằm giữa Umbra Gần và Umbra Xa. Đối với Sleeper, nó biểu hiện như khoảng không giữa Mặt Trời và vành đai tiểu hành tinh."
 true_horizon_effect_desc: ""

 umbra_realm_autochthonia: "Autochthonia"
 umbra_realm_autochthonia_desc: "Autochthonia, được các Hermetic gọi là Realm of Binding, là một Shenti của Sự Tĩnh Tại do Technocracy kiểm soát, một hóa hiện khổng lồ của Weaver. Autochthonia tồn tại sâu trong [UmbraGlossary('true_horizon')], quay quanh Mặt Trời theo hướng đối nghịch trực tiếp với Trái Đất."
 autochthonia_effect_desc: ""

 umbra_realm_balador: "Balador"
 umbra_realm_balador_desc: "Balador từng là một chantry Horizon Realm do Cult of Ecstasy kiểm soát, nơi các thành viên của Tradition này cùng những vị khách được vinh danh của họ có thể đắm chìm trong đủ loại khoái lạc làm mê hoặc tâm trí.\n\nLịch sử của Balador phần nào mơ hồ, nhưng nó đã tồn tại vào thời Grand Convocation, khi nó khiến các khách viếng thăm từ những Tradition khác choáng váng vì chỉ thấy sự trụy lạc mà không thấy kỷ luật đằng sau. Luật lệ trọng yếu duy nhất tại Balador là "Miễn không hại ai, cứ làm theo ý mình"; một bộ quy tắc ứng xử chi tiết hơn đã được soạn thảo sau khi quá nhiều khách viếng thăm vi phạm điều khoản đầu tiên của nguyên tắc căn bản này."
 balador_effect_desc: ""

 umbra_realm_gernsback_continuum: "Gernsback Continuum"
 umbra_realm_gernsback_continuum_desc: "Gernsback Continuum là một Horizon Realm do Etherite xây dựng như một biểu hiện lý tưởng hóa cho Paradigm của họ.\n\nCõi giới này hiện ra như một thành phố Art Deco lấp lánh, tràn ngập những kỳ quan của khoa học và công nghệ. Vỉa hè di động, ba lô phản lực, và những tòa nhà kính góc cạnh đều là những nét đặc trưng của cõi này. Vào ban đêm, các thiên thể có thể được nhìn thấy phóng đại trên bầu trời."
 gernsback_continuum_effect_desc: ""

 umbra_realm_midrealm: "Midrealm"
 umbra_realm_midrealm_desc: "Midrealm là một Cõi Umbra nằm ở trung tâm của [umbra|E]. Nó chứa đựng Alder Bole, một Cây Thế Giới nguyên thủy đã hình thành nên Tellurian, và có một sảnh đường nơi Umbrood thuộc mọi loại có thể gặp gỡ trong hòa bình.\n\nMidrealm không chỉ là trung tâm của [umbra|E], mà còn có thể là trung tâm của chính Thực Tại. Một số học giả tin rằng nó thậm chí có thể chính là Núi Qaf và/hoặc Correspondence Point."
 midrealm_effect_desc: ""

 umbra_realm_moreauvia: "Moreauvia"
 umbra_realm_moreauvia_desc: "Moreauvia, còn gọi là Research Plantation No. 4: Construct Mooreauvia, là một Horizon Realm Construct của Progenitor, nơi Convention biến đổi gen để tạo ra nô lệ."
 moreauvia_effect_desc: ""

 umbra_realm_red_donjon: "Red Donjon"
 umbra_realm_red_donjon_desc: "Auld Covenant của các Mage đã tồn tại gần 600 năm. Dù cabal này duy trì một Horizon Realm khá rộng lớn, gọi là Red Donjon, các Mage phần lớn thời gian vẫn ở trong và quanh Edinburgh."
 red_donjon_effect_desc: ""

 umbra_realm_yenosia: "Yenosia"
 umbra_realm_yenosia_desc: "Yenosia là một Horizon Realm. Vốn được gọi là Land of Dreams, nơi đây từng là chỗ đặt một chantry Mage tên Arcosia, phần lớn gồm những người theo chủ nghĩa hòa bình Chœur Céleste."
 yenosia_effect_desc: ""

 umbra_realm_null_b: "Null-B"
 umbra_realm_null_b_desc: "Null-B từng là một Construct của Technocratic Union. Nó nằm ở trung tâm của [UmbraGlossary('yenosia')], một Horizon Realm."
 null_b_effect_desc: ""

 umbra_realm_horizon: "Horizon"
 umbra_realm_horizon_desc: "Horizon từng là thành trì vĩ đại nhất của Council of Nine Mystic Traditions, một Horizon Realm nơi văn hóa và paradigm của mỗi Tradition cùng tồn tại trong hòa hợp tương đối với nhau."
 horizon_effect_desc: ""

 umbra_realm_concordia: "Concordia"
 umbra_realm_concordia_desc: "Concordia là thành phố chính của [UmbraGlossary('horizon')], và là nơi đặt Council Chamber của Council of Nine Mystic Traditions."
 concordia_effect_desc: ""

 umbra_realm_far_horizon: "Far Horizon"
 umbra_realm_far_horizon_desc: "Far Horizon tương ứng đại khái với vị trí của vành đai tiểu hành tinh."
 far_horizon_effect_desc: ""

 umbra_realm_deep_umbra: "Deep Umbra"
 umbra_realm_deep_umbra_desc: "Deep Umbra, còn gọi là Deep Universe, là một cõi giới bao la nằm ngoài không gian Umbra của Trái Đất. Phần lớn nơi đây là một khoảng trống mênh mông. Từ góc nhìn con người, Deep Umbra chính là không gian sâu thẳm, ngoài vũ trụ, hay toàn bộ vũ trụ."
 deep_umbra_effect_desc: ""

 umbra_realm_malfeas: "Malfeas"
 umbra_realm_malfeas_desc: "Malfeas là cõi Shenti điên loạn của Wyrm nằm trong [UmbraGlossary('deep_umbra')]. Đây là một thế giới ác mộng địa ngục chứa đầy mọi điều khủng khiếp có thể tưởng tượng ra, và một vài thứ còn khủng khiếp đến mức chỉ cần cố tưởng tượng ra chúng cũng đủ khiến người ta phát điên."

 umbra_realm_central_duchy: "Central Duchy"
 umbra_realm_central_duchy_desc: "Một phiến đá tròn nhô lên, khắc hình xoáy ốc, nằm ở trung tâm vùng đất rộng lớn có hình dạng bất quy tắc này. Những tòa nhà cầu kỳ và đe dọa vây quanh sân trong, mỗi tòa cao hơn một dặm. Một trong những công trình đồ sộ này là Đại Thánh Đường khổng lồ, với ô cửa kính màu to lớn khắc họa những quái vật xúc tu trồi lên từ dưới lòng đất. Thánh đường này được dâng hiến cho tất cả các đầu của Hydra và là nơi duy nhất trong toàn cõi [UmbraGlossary('malfeas')] công khai chào đón những kẻ trung thành với bất kỳ đầu nào trong số đó."
 central_duchy_effect_desc: "@wyrm_icon![umbra_expedition|E]: Lần lượt khám phá chín căn phòng của Temple Obscura"

 umbra_realm_maeljin_duchies: "Maeljin Duchies"
 umbra_realm_maeljin_duchies_desc: "Một bức tường khổng lồ làm từ đá và xương hóa thạch canh giữ [UmbraGlossary('central_duchy')], và lãnh địa của mỗi Maeljin Incarna đều tiếp giáp với bức tường này, bao quanh nó từ mọi phía. Bức tường quanh Central Duchy có những chiếc gai sắt sắc như dao cạo hiểm độc trên đỉnh, thường xuyên được trang trí bằng thi thể của bất kỳ ai từng đặc biệt chọc giận Maeljin Incarna cai quản đoạn tường đó."
 maeljin_duchies_effect_desc: "@wyrm_icon![umbra_expedition|E]: Nhận [lifestyle_experience|E] [urgetaints_lifestyle|E] nếu ngươi có [lifestyle|E]"

 umbra_realm_border_duchies: "Border Duchies"
 umbra_realm_border_duchies_desc: "Một số phần của [UmbraGlossary('malfeas')] nằm giữa các [UmbraGlossary('maeljin_duchies')] trông có vẻ như những vùng hoang mạc cằn cỗi, nhưng vẻ ngoài có thể đánh lừa. Những vùng hoang mạc này thực chất là hai Duchy khác thuộc về các Maeljin Incarna vốn tránh né việc giao tiếp với đồng loại của mình."
 border_duchies_effect_desc: "@wyrm_icon![umbra_expedition|E]: Khám phá [men_at_arms|E] Tà Linh"

 umbra_realm_earth_pit: "Earth Pit"
 umbra_realm_earth_pit_desc: "Đối với người sói, một trong những địa điểm nguy hiểm nhất trong toàn cõi [UmbraGlossary('malfeas')] chính là Earth Pit. Nằm trong một hẻm núi giữa một trong những đầm lầy của Knight Entropy và sa mạc của Nameless Angel of Despair, Earth Pit là một vùng rộng lớn tái hiện lại các đặc điểm tổng thể của nhiều cảnh quan nguyên sơ và trù phú nhất Trái Đất, nhưng dưới hình hài một bản nhại độc hại, nhiễm độc của những bản gốc."
 earth_pit_effect_desc: "@wyrm_icon![umbra_expedition|E]: Find a $glossary_wyrm$ [fetish|E]"

 umbra_realm_elemental_duchies: "Elemental Duchies"
 umbra_realm_elemental_duchies_desc: "Các rìa ngoài cùng của [UmbraGlossary('malfeas')] chứa bốn Elemental Duchy của khói độc, balefire, bùn nhớp và chất độc.\n\nCác cung điện của bốn Maeljin nguyên tố nằm gần trung tâm mỗi Duchy. Phá hủy một trong những tòa lâu đài ô uế này có thể làm suy yếu nguyên tố tương ứng, nhất là nếu Garou cũng tiêu diệt vĩnh viễn Maeljin nguyên tố đó."
 elemental_duchies_effect_desc: "@wyrm_icon![umbra_expedition|E]: Tìm một Linh Hồn Tà Linh Nguyên Tố"

 umbra_realm_black_spiral_labyrinth: "Black Spiral Labyrinth"
 umbra_realm_ebon_maze: "Ebon Maze"
 umbra_realm_black_spiral_labyrinth_desc: "Black Spiral Labyrinth, còn gọi là Ebon Maze tại Trung Thổ, là một mê cung xoáy ốc nằm trong cõi [UmbraGlossary('malfeas')], chứa đựng những nỗi kinh hoàng không thể tưởng tượng nổi của Wyrm."
 black_spiral_labyrinth_effect_desc: "@wyrm_icon![umbra_expedition|E]: Find a $glossary_wyrm$ [fetish|E]"

 umbra_realm_copernicus_research_center: "Copernicus Research Center"
 umbra_realm_copernicus_research_center_desc: "Copernicus Research Center ("The Cop") là một quả cầu Dyson trong suốt, đồ sộ, do Void Engineer kiểm soát. Nó bao quanh một trong các ngôi sao của Alpha Centauri và trải rộng bán kính một AU."
 copernicus_research_center_effect_desc: ""

 umbra_realm_first_city: "First City"
 umbra_realm_first_city_desc: "First City, còn được biết đến với tên gọi Thành Enoch cùng nhiều tên khác, được các học giả Noddist công nhận là thành phố đầu tiên trong thần thoại Cainite, như được ghi chép trong Book of Nod."
 first_city_effect_desc: "Stationed character gains minor [prestige|E] every #V 3#! months."

 umbra_realm_mirror_zone: "Mirror Zone"
 umbra_realm_mirror_zone_desc: "Mirror Zone bí ẩn ưa thích việc phô bày cho những "vị khách" của nó thấy những gì lẽ ra đã có thể xảy ra."
 mirror_zone_effect_desc: "[umbra_aptitude|E]: [grace_i]#P +25%#!"

 umbra_realm_null_zone: "Paths of the Wyck"
 umbra_realm_null_zone_desc: "Paths of the Wyck là một mê cung những con đường nhỏ dẫn đến hầu hết các cõi giới của [umbra|E]. Định hướng tại đây rất khó khăn, vì các con đường luôn chuyển dịch và trông đều giống hệt nhau."
 null_zone_effect_desc: "[umbra_aptitude|E]: [grace_i]#P +25%#!"

 umbra_realm_neter_khertet: "Neter-khertet"
 umbra_realm_neter_khertet_desc: "Trước khi [UmbraGlossary('dark_kingdom_of_sand')] được thành lập, người chết Ai Cập cư ngụ trong Neter-Khertet, "chốn linh thiêng dưới lòng đất"."
 neter_khertet_effect_desc: ""

 umbra_realm_kakuri: "Kakuri"
 umbra_realm_kakuri_desc: "Còn gọi là Night Realm, Kakuri là một [UmbraGlossaryLocalized('yomi_wan','Địa Ngục Yomi')] do [Glossary('Diêm Ma Vương','podgloss.yamaking')] [Glossary('Emma-O','podgloss.emmao')] cai quản.\nKakuri là một lãnh địa mang thuộc tính Âm, một khoảng trống không ánh sáng, không niềm vui, không danh dự, chỉ toàn băng và tuyết.\nLà lãnh địa tử vong tổ tiên của người Ainu, Kakuri có một lối thoát bí mật dành cho các tín đồ nguyên thủy của [Glossary('Emma-O','podgloss.emmao')]."

 kakuri_effect_desc: "Can recruit [GetMaA('shikome_assassin').GetName] as [men_at_arms|E]\nCan recruit [GetMaA('kumo_huntress').GetName] as [men_at_arms|E]\n$UMBRA_INVESTMENTS_OF_SOUL$"

 umbra_realm_wicked_city: "Wicked City"
 umbra_realm_wicked_city_desc: "Wicked City là một cơn ác mộng của cyberpunk, phong thủy điên loạn và những học thuyết quản trị bào mòn linh hồn.\nĐây là nơi mọi yếu tố tồi tệ nhất của lòng tham và chủ nghĩa tư bản hội tụ trong bầu không khí đồi bại của Yomi. Đây cũng là một trong những Địa Ngục phát triển nhanh nhất bên trong Yomi Wan."
 wicked_city_effect_desc: "Can recruit [GetMaA('shinjuku_undercity_scavengers').GetName] as [men_at_arms|E]\nCan recruit [GetMaA('mikaboshis_demons_of_iron_and_violence').GetName] as [men_at_arms|E]\n$UMBRA_INVESTMENTS_OF_SOUL$"

 umbra_realm_hell_of_burrowing_maggots: "Hell of Burrowing Maggots"
 umbra_realm_hell_of_burrowing_maggots_desc: "Hell of Burrowing Maggots. Do Rangda, nữ chúa ôn dịch, cai quản. Hell of Burrowing Maggots đúng như tên gọi của nó. Đó là một địa ngục. Nó có Giòi. Rất nhiều giòi. Đủ mọi hình dạng và kích cỡ. Ngươi chính là bữa trưa của chúng."
 hell_of_burrowing_maggots_effect_desc: "Can recruit [GetMaA('raksha_of_ravana').GetName] as [men_at_arms|E]\n$UMBRA_INVESTMENTS_OF_SOUL$"

 umbra_realm_hell_of_being_skinned_alive: "Hell of Being Skinned Alive"
 umbra_realm_hell_of_being_skinned_alive_desc: "Hell of Being Skinned Alive. Lãnh địa của [Glossary('Tou Mu','podgloss.toumu')]. Hell of Being Skinned Alive là một sa mạc hứng chịu những cơn gió không ngừng, mang theo cát mịn sắc bén như dao cạo. Những sinh vật không được che chắn sẽ bị lột da chỉ trong vài phút. Chính [Glossary('Tou Mu','podgloss.toumu')] ngự trị từ một cung điện lơ lửng trên không, trang hoàng bằng những thi thể (còn sống) bị đóng cọc của những kẻ từng chọc giận bà."
 hell_of_being_skinned_alive_effect_desc: "Can recruit [GetMaA('the_children_of_tou_mou').GetName] as [men_at_arms|E]\n$UMBRA_INVESTMENTS_OF_SOUL$"

 umbra_realm_hell_of_boiling_oil: "Hell of Boiling Oil"
 umbra_realm_hell_of_boiling_oil_desc: "Hell of Boiling Oil. Thực ra đó là mỡ. Mỡ người được ninh nhừ một cách ngon lành."
 hell_of_boiling_oil_effect_desc: "Can recruit [GetMaA('fat_striders_of_the_hell_of_boiling_oil').GetName] as [men_at_arms|E]\n$UMBRA_INVESTMENTS_OF_SOUL$"

 umbra_realm_hell_of_bitter_truth: "Hell of Bitter Truth"
 umbra_realm_hell_of_bitter_truth_desc: "Hell of Bitter Truth là nơi dành cho những kẻ cuồng tín tôn giáo. Dù Hell of Bitter Truth không mang lại đau đớn thể xác nào, đối với những người sùng đạo này, ý nghĩ rằng họ không xứng đáng với Thiên Đường hay — tệ hơn nữa — rằng tôn giáo của họ đã sai lầm, lại trở thành nguồn khổ đau bất tận. Đám quỷ hầu của Hen Tian thường xuyên nhắc nhở các tù nhân rằng họ không xứng đáng được chiêm ngưỡng các vị thần, và đôi khi còn đề nghị một linh hồn cách để "chuộc lỗi" nhằm đến được lãnh địa của các vị thần họ tôn thờ. Dĩ nhiên, tất cả những nhiệm vụ này chỉ là mưu kế, thường liên quan đến việc phụng sự [Glossary('Diêm Ma Vương','podgloss.yamaking')], khiến các nạn nhân càng lún sâu hơn vào tuyệt vọng khi họ khám phá ra sự thật."
 hell_of_bitter_truth_effect_desc: "$UMBRA_INVESTMENTS_OF_SOUL$"

 umbra_realm_hell_of_spiked_chains: "Hell of Spiked Chains"
 umbra_realm_hell_of_spiked_chains_desc: "Hell of Spiked Chains từng là một bình nguyên bằng phẳng bao la, nơi cư ngụ của những linh hồn người phàm đã chết trên các thảo nguyên. Mỗi linh hồn trong số này được [Glossary('Diêm Ma Vương','podgloss.yamaking')] chỉ định ngẫu nhiên vào một bộ tộc, và ngài định kỳ chọn một trong các bộ tộc này làm bộ tộc được sủng ái. Mọi bộ tộc khác đều bị tước đi một trong các giác quan (hoặc chi thể) của mình và phải phục tùng bộ tộc được sủng ái trong mọi việc. Nếu họ bất tuân, hay khi một trong những Kẻ Được Sủng Ái nổi hứng, họ sẽ bị đem ra chịu cực hình của Xiềng Gai. Nạn nhân bị trói bằng những dây xích sắt gai rèn từ [UmbraGlossaryLocalized('yomi_wan','Địa Ngục Yomi')] và treo lên từ những măng đá của một hang động lớn trong một khoảng thời gian không xác định. Mỗi khi nạn nhân vùng vẫy, những chiếc gai sẽ cắm sâu hơn vào bản thể của họ, nuôi dưỡng [Glossary('Diêm Ma Vương','podgloss.yamaking')]."
 hell_of_spiked_chains_effect_desc: "$UMBRA_INVESTMENTS_OF_SOUL$"

 umbra_realm_qlippoth: "Qlippoth"
 umbra_realm_qlippoth_desc: "Qlippoth là những thế giới bị chối bỏ, chứa đựng một vũ trụ nửa vời cư ngụ bởi những sinh vật có từ trước khi Tapestry được tạo ra.\n\nBản chất của một Qlippah không nhất thiết là tà ác, nhưng nguy hiểm cho nhân loại và vũ trụ mà họ đã quen thuộc. Một số Qlippoth chứa đựng các khía cạnh tuyệt đối của Chúa, điều sẽ khiến ý chí tự do trở nên bất khả thi và không cho phép sự sống tiến hóa, trong khi những Qlippoth khác lại chứa đựng những khái niệm còn kỳ lạ hơn, quá xa lạ để tâm trí con người có thể nắm bắt."
 qlippoth_effect_desc: ""

 umbra_realm_doissetep: "Doissetep"
 umbra_realm_doissetep_desc: "Doissetep là một tòa lâu đài đồ sộ, đường kính lên tới một dặm và cao ba mươi tầng. Qua nhiều thế kỷ tồn tại, những cánh, tầng và phần mở rộng mới đã được xây thêm, khiến nó mang một vẻ ngoài pha tạp. Vô số căn phòng và hành lang tạo nên phần trên của chantry, trong khi bên dưới là một tổ hợp đường hầm ngoằn ngoèo dẫn đến các hầm mộ khác nhau trong núi. Những lối đi bí mật nối liền nhiều căn phòng, cho phép những cư dân am tường di chuyển mà không bị phát hiện. Phần trung tâm là một công trình khổng lồ mang nét kiến trúc phương Đông."
 doissetep_effect_desc: ""

 umbra_realm_hive_realm: "Hive Realm"
 umbra_realm_hive_realm_desc: "Hive Realm là kết quả của Avatar Storm. Cơn bão đã xé toạc một số Cõi Giới dọc theo màng chắn cùng với nó và hợp nhất chúng thành những Cõi Giới mới, gây khó chịu, rải rác khắp [umbra|E]. Mọi Mage cố gắng tiếp cận một Cõi Giới đều có khả năng cao sẽ chạm phải một Hive Realm thay vào đó. Phần lớn được cấu thành từ đá đỏ như máu, mủn nát, và có bầu khí quyển rất mỏng khiến việc hít thở trở nên khó khăn."
 hive_realm_effect_desc: ""