 umbra_place_shadowlands_tooltip: "[GetTrait('wraith').GetName( GetNullCharacter )] không có [Fetters|E] sẽ nhận mức [stress|E] trung bình mỗi năm để duy trì bản thân trong [UmbraGlossary('shadowlands')]. (10% cơ hội cho mỗi [Fetter|E] chưa được gán hoặc đã mất)"
 umbra_place_dark_kingdom_tooltip: "Ở lại [Glossary('Vương Quốc Bóng Tối','game_concept_dark_kingdom_desc')] để không phải nhận [stress|E] do thiếu [Fetters|E]"
 
 broken_mirror_valid_tooltip: "Lãnh địa của bạn ([GetPlayer.GetCurrentLocation.GetName]) #bold không#! có [GetBuilding('wyrm_taint_01').GetName] hay một [faith|E] chấp nhận thuyết quỷ học."
 labyrinth_progress_effect_tooltip: "Bạn nhận #V 100#! tiến độ thám hiểm trong [UmbraGlossary('pod_realm_labyrinth')] (Nếu đang đóng quân)."
 
 glen_desc: "Một Thung Lũng là khu vực trong [UmbraGlossary('penumbra')] bão hòa năng lượng của $glossary_wyld$. Thung Lũng thường gắn với những vùng hoang dã chưa bị xâm phạm trong thế giới vật chất (khiến chúng ngày càng hiếm hoi và khó tiếp cận)."
 hellhole_desc: "Một Hố Địa Ngục là khu vực trong [UmbraGlossary('penumbra')] bão hòa năng lượng nhiễm Wyrm, thường do một thứ gì đó đặc biệt tàn phá hoặc độc hại tồn tại ở phía vật chất của Gauntlet. Hố Địa Ngục có sức tàn phá sâu sắc lên mọi thứ xung quanh, và là nơi sinh sôi của những Tà Linh hùng mạnh."
 veinous_stair_desc: "Bậc Thang Huyết Mạch là lối đi từ Stygia thẳng vào [UmbraGlossary('pod_realm_labyrinth')]. Là nơi ổn định nhất trong [UmbraGlossary('shadowlands')], Bậc Thang được tạo thành từ loại đá đen không rõ nguồn gốc."
 onyx_tower_desc: "Tháp Onyx là nơi ở của Charon, vị Hoàng đế đã từng và sẽ lại trị vì Stygia. Là tòa nhà cao nhất Stygia, nó tượng trưng cho quyền lực của Charon và khả năng ông giám sát [UmbraGlossary('dark_kingdom_of_iron')]."
 periphery_desc: "Vùng Ngoại Vi, đôi khi còn được gọi là "Umbra Mềm", là một nơi chốn - hay một trạng thái tâm trí, như nhiều $glossary_fera$ vẫn chỉ ra - nằm giữa [UmbraGlossary('penumbra')] và Thế Giới Vật Chất."
 broken_mirror_desc: "Gương Vỡ là những nơi mà ranh giới giữa Thế Giới Vật Chất và [UmbraGlossary('yomi_wan')] đã bị nới lỏng bởi khối lượng khổng lồ đau khổ của người phàm, Khí Ô Nhiễm và những linh hồn hoang tàn."
 blight_desc: "Một Vùng Ô Nhiễm là khu vực trong [UmbraGlossary('penumbra')] bị tổn hại bởi cuộc chiến giữa $glossary_weaver$ và $glossary_wyrm$. Những khu vực đô thị này dày đặc Tà Linh và nghẹt thở bởi mạng lưới của Weaver; theo một cách nào đó chúng đại diện cho mọi mặt tiêu cực của một thành phố, được cụ thể hóa và nén lại thành một vùng nhỏ."
 broken_lands_desc: "Một Vùng Đất Gãy Vỡ là thứ y hệt trong một câu chuyện cổ tích. Người ta kể về việc tìm thấy một ngã ba trên con đường mòn nơi trước đó chẳng hề có, hay một hang động mở ra trên vách đá vốn còn nguyên vẹn hai ngày trước. Ngựa không muốn đi xuống con đường đó, và trở nên thực sự bồn chồn khi càng đến gần. Đôi khi con đường dẫn đến một mảng hoang dã kỳ lạ nơi thú vật không hành xử đúng cách - thỏ rừng săn sói đồng cỏ, nhện dệt tơ bằng bạc, kền kền ăn xương từ xác chết mà không làm hỏng phần thịt. Mặt trời có thể không mọc suốt nhiều ngày, hay mặt trăng có thể tỏa sáng màu xanh lục hoặc đỏ."
 vista_desc: "Cảnh Tượng là những khu vực trong [umbra|E] mở ra một dạng trình diễn phản ánh một trong bốn chủ đề: Cái Chết, Đình Trệ, Hỗn Mang, hay Khởi Nguyên.\n\nCảnh Tượng không thể tương tác và chỉ đơn thuần cho thực thể gặp phải chúng thấy một viễn cảnh thay thế về thời điểm hay nơi chốn nào đó, được soi sáng bởi một trong các chủ đề của nó. Những cảnh được khắc họa cho thấy một thế giới nơi điều gì đó lớn lao đã xảy ra như sự tạo lập vũ trụ hay mức độ trật tự đến mức tê liệt. Những phong cảnh Umbra này trải rộng khắp toàn bộ tầm nhìn của bạn, như thể bất cứ điều gì đang diễn ra đều ở ngay trước mặt bạn. Chúng có vẻ giống sự kiện hơn là một buổi trình diễn sân khấu, và tác động đến mọi giác quan của lữ khách."
 
