 ventrue_ephorate_tab_tt: "#bold Ventrue Ephorate #!"
 ventrue_ephorate_intro: "#bold Ephorate gồm 12 elder Ventrue quyền lực và có ảnh hưởng nhất. Các Ephor thiết lập tiền lệ trong các vấn đề "chính sách của clan". Đây là cấp bậc cao nhất trong hệ thống nội bộ Ventrue.\nBên cạnh việc mở khóa các vị trí triều đình độc quyền, mỗi Ephor còn hậu thuẫn một phe cụ thể, và tùy theo sức mạnh tổng thể, mỗi phe sẽ mang lại lợi ích và trở ngại cho toàn clan, thể hiện qua các hệ số dynasty.#!"
