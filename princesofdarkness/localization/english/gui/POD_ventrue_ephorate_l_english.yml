 pod_ventrue_ephorate.30.t: "Một Chỗ Ngồi Trên Bàn Nghị Sự"
 pod_ventrue_ephorate.30.desc: "Tin đồn đang rộ lên trong thế giới nhỏ bé lộng lẫy của Ventrue về sự ra đi gần đây của một Ephor, một trong mười hai thành viên đứng đầu $pod_clan$. Vì sự bất tử, một chỗ ngồi trên bàn nghị sự này hiếm khi trống, điều này đã tạo ra một cuộc chiến ảnh hưởng ngầm giữa các Ventrue đầy tham vọng, tất cả đều cố gây ấn tượng với các Ephor còn lại với hy vọng được chọn vào vị trí trống.\nNgài có muốn đặt mình vào vị trí ứng viên tiềm năng không?"
 pod_ventrue_ephorate.30.a: "Đương nhiên, ta là lựa chọn tốt nhất."
 pod_ventrue_ephorate.30.b: "Chưa phải lúc của ta."
 entry_ephorate_tt: "Ngài sẽ được chọn làm Ephor mới nhất. Chi phí của lựa chọn này tùy thuộc vào nhiều yếu tố như thanh danh, cấp tước vị và quy mô lãnh địa của Ngài."
 pod_ventrue_ephorate.4.t: "Ephorate Gọi Tên"
 pod_ventrue_ephorate.4.desc: "Với sự ra đi gần đây của một thành viên Ephorate danh giá, một chỗ trống đã xuất hiện. Các Ephor đã quyết định rằng Ngài là ứng viên tốt nhất để thay thế người đồng nghiệp đã mất. Đây chắc chắn là một danh dự rất lớn vì các Ephor có tiếng nói quan trọng trong các vấn đề của clan.\nDù Ngài chỉ là một trong mười hai tiếng nói, điều này vẫn sẽ tạo dựng danh tiếng tốt cho Ngài và có thể mở ra những cơ hội mới trong tương lai. Đã đến lúc Ngài giành lấy vị trí của mình giữa những Ventrue quyền lực nhất trên thế giới."
 pod_ventrue_ephorate.4.a: "Tài năng của ta cuối cùng đã được đền đáp."
 ventrue_ephorate_entry_tt: "Ngài giờ đã là một phần của Ephorate và sẽ tự động hậu thuẫn một phe tùy theo tín ngưỡng và đặc điểm của Ngài.\nCác sự kiện mới liên quan đến vai trò mới của Ngài trong việc định hình clan sẽ xảy ra trong tương lai."
 pod_ventrue_ephorate.4.b: "Ta sẽ hậu thuẫn Ashen Knights."
 pod_ventrue_ephorate.4.c: "Ta sẽ hậu thuẫn Merchant Princes."
 pod_ventrue_ephorate.4.d: "Ta sẽ hậu thuẫn Eternal Senate."
 pod_ventrue_ephorate.4.e: "Ta sẽ hậu thuẫn Sinner Rome."
 pod_ventrue_ephorate.4.f: "Ta sẽ hậu thuẫn Patricians."

 pod_ventrue_ephorate.6.t: "Ephorate"
 pod_ventrue_ephorate.6.desc: "Ephorate gồm 12 elder Ventrue quyền lực và có ảnh hưởng nhất. Các Ephor thiết lập tiền lệ trong các vấn đề "chính sách của clan". Đây là cấp bậc cao nhất trong hệ thống nội bộ Ventrue. Chức năng quan trọng nhất của Ephorate không dễ định lượng; họ định hướng cho toàn thể $pod_clan$. Triết lý, phong cách lãnh đạo và quan điểm chính trị của họ được thảo luận và tranh luận qua các cấp bậc, do đó ảnh hưởng đến đa số Ventrue ở một mức độ nào đó.\n #X Ephorate là một đặc điểm nổi bật của Ventrue. Các hệ số dynasty quan trọng được trao cho Ventrue tùy theo sức mạnh của các phe trong Ephorate. Mỗi Ephor cũng có quyền truy cập các vị trí triều đình độc quyền. Các Ephor được chọn suốt đời, nghĩa là chỉ khi một người chết mới có thể mở ra một chỗ trống mới trên bàn nghị sự.\nNgài có thể truy cập vào đó qua một thẻ ở bên phải màn hình.#!"
 pod_ventrue_ephorate.6.a: "Chúng ta mạnh hơn khi đoàn kết."
 ventrue_ephorate_intro_tt: "Ephorate hiện tại bị chia rẽ, nhưng chịu sự chi phối yếu của Patricians, mang lại một hệ số cho toàn thể clan Ventrue.\nNếu thành phần của Ephorate thay đổi, các hệ số cũng có thể thay đổi."
 ventrue_ephorate_intro_member_tt: "Ephorate hiện tại bị chia rẽ, nhưng chịu sự chi phối yếu của Patricians, mang lại một hệ số cho toàn thể clan Ventrue.\nNếu thành phần của Ephorate thay đổi, các hệ số cũng có thể thay đổi.\nNhân vật của Ngài bắt đầu với vai trò thành viên của tổ chức này, điều này sẽ mở ra những khả năng mới để ảnh hưởng đến clan trong tương lai."

 pod_ventrue_ephorate.100.t: "Hồi Kết của Ephorate"
 pod_ventrue_ephorate.100.desc: "Ephorate luôn bị chia rẽ giữa các phe tranh đấu kể từ thời La Mã. Sự chia rẽ này thực ra chính là mạch sống của tổ chức, vì nó có nghĩa là clan Ventrue thiếu một quyền lực tuyệt đối có thể ép buộc nó tiến lên.\nTình trạng này đã thay đổi và một phe đã đạt được sự thống trị hoàn toàn đối với tổ chức. Khi clan Ventrue một lần nữa thống nhất dưới một tầm nhìn, chính Ephorate mất hết quyền lực, sớm trở thành một di tích của thời kỳ hỗn loạn đã qua của Ventrue."
 pod_ventrue_ephorate.100.a: "Một bước tiến táo bạo hướng tới tương lai."
 ventrue_ephorate_end_tt: "Ephorate bị giải thể, phe chiến thắng áp đặt một phiên bản mạnh hơn của hệ số của họ lên dynasty của clan Ventrue."

 ephorate_distributing_funds_modifier: "Ephorate Phân Bổ Lại Quỹ"
 ephorate_distributing_funds_modifier_desc: "Ephorate đang phân bổ lại một phần quỹ của mình để hỗ trợ các dự án của Ventrue trên toàn thế giới."

 pod_ventrue_ephorate.7.t: "Kho Báu của Ephorate"
 pod_ventrue_ephorate.7.desc: "Ephorate đang nắm giữ một trong những ngân khố ấn tượng nhất trong lịch sử ma cà rồng. Clan Ventrue nổi tiếng với các khoản đầu tư khôn khéo, và những khoản đầu tư đó có thể tồn tại vĩnh viễn. Vì vậy, Ephorate chỉ đạo các hoạt động toàn cầu của clan trước khi phân bổ lại tài sản cho các dự án khác của Ventrue trên toàn thế giới.\nNgài đã được chọn là người xử lý việc phân bổ lại hiện tại cho thập kỷ này, nghĩa là Ngài giờ đang chịu trách nhiệm về một nguồn dự trữ vàng khổng lồ.\nMột danh dự, và một cám dỗ..."
 pod_ventrue_ephorate.7.a: "Đôi khi tiền bạc biến mất..."
 pod_ventrue_ephorate.7.b: "Đến lúc đầu tư lại."

 ephorate_decorum_modifier: "Sự Trang Nghiêm của Ephorate"
 ephorate_decorum_modifier_desc: "Ephorate duy trì tốt sự trang nghiêm, thể hiện hình ảnh một clan Ventrue quyền lực và kỷ luật."

 pod_ventrue_ephorate.8.t: "Sự Trang Nghiêm của Tầng Lớp Tinh Hoa"
 pod_ventrue_ephorate.8.desc: "Ephorate là một tổ chức danh giá và được kỳ vọng đại diện cho tầng lớp tinh hoa của clan Ventrue. Vấn đề là với quá nhiều elder quyền lực trong cùng một tổ chức, tính khí có thể nóng lên rất nhanh và các buổi họp căng thẳng có thể dẫn đến những mối hận thù kéo dài vượt ra ngoài các sảnh đường của Ephorate. Một cuộc tranh luận gay gắt như vậy đã bắt đầu trở nên căng thẳng với một trong những đồng nghiệp của Ngài và cả hai bên vẫn chưa ai chịu nhượng bộ.\nNếu tiếp diễn, rất có thể vấn đề này sẽ bị nghe thấy bên ngoài tổ chức và phá vỡ vẻ ngoài đoàn kết kỷ luật mà clan Ventrue muốn thể hiện. Việc nhượng bộ ngay bây giờ vẫn là một lựa chọn nếu Ngài muốn tránh khả năng tồi tệ đó."
 pod_ventrue_ephorate.8.a: "Chúng ta có thể từ từ hạ nhiệt cuộc tranh luận này."
 pod_ventrue_ephorate.8.b: "Hãy thỏa hiệp."
 pod_ventrue_ephorate.8.c: "Ta đúng trong việc này!"

 ephorate_decorum_broken_modifier: "Sự Trang Nghiêm của Ephorate Đã Sụp Đổ"
 ephorate_decorum_broken_modifier_desc: "Vẻ ngoài đoàn kết của Ephorate đang xuất hiện những vết nứt, làm suy yếu clan Ventrue nói chung."

 pod_ventrue_ephorate.9.t: "Hiểm Nguy Khắp Nơi"
 pod_ventrue_ephorate.9.desc: "Ephorate sử dụng một lực lượng cảnh sát ngầm kiêm nhiệm phản ứng nhanh, gọi là Lictor. Những sát thủ quyền lực này đảm bảo rằng lợi ích của clan Ventrue luôn được bảo vệ bằng vũ lực khi cần thiết và đã là một trợ lực quan trọng cho nhiều Prince yếu thế qua nhiều năm.\nĐáng buồn là, dường như các mối đe dọa đối với Ventrue không bao giờ ngừng xuất hiện và các Lictor đang báo cáo bị quá tải bởi số lượng đám cháy họ phải dập tắt. Vì vậy, họ đang yêu cầu thêm nguồn lực được gửi đến, dù đó là vàng hay các ân huệ chính trị với các Prince trung lập.\nVới vai trò là Ephor hiện đang chịu trách nhiệm về an ninh nội bộ, việc đáp lại lời kêu gọi giúp đỡ này thuộc về Ngài."
 pod_ventrue_ephorate.9.a: "Các Lictor chỉ cần làm việc chăm chỉ hơn."
 pod_ventrue_ephorate.9.b: "Một mục đích chính đáng."

 ephorate_overwhelmed_lictor_modifier: "Lictor của Ephorate Bị Quá Tải"
 ephorate_overwhelmed_lictor_modifier_desc: "Lực lượng phản ứng nhanh của Ephorate, các Lictor, đang bị quá tải với các yêu cầu, để lại nhiều lỗ hổng trong hệ thống phòng thủ của clan."

 pod_ventrue_ephorate.10.t: "Tai Mắt của Ventrue"
 pod_ventrue_ephorate.10.desc: "Các thành viên cấp thấp nhất của Ephorate là Tribune, những người đưa tin và gián điệp cho tổ chức và cho toàn thể clan Ventrue. Dù không phải là một cấp bậc danh giá, tầm quan trọng của họ không thể bị xem nhẹ vì họ thường là nguồn thông tin đáng tin cậy nhất mà các Prince Ventrue có được.\nCác Tribune rất đông nhưng phối hợp kém và chủ yếu báo cáo cho Ventrue lớn tuổi nhất trong khu vực của họ thay vì trực tiếp cho Ephorate. Vì Ngài là Ephor chịu trách nhiệm về họ trong thập kỷ này, Ngài đang xem xét một cuộc cải cách toàn diện để đưa họ gần hơn với chính Ephorate, hy vọng sẽ cải thiện hiệu suất của họ cùng lúc."
 pod_ventrue_ephorate.10.a: "Ta sẽ soạn một cuộc cải cách."
 pod_ventrue_ephorate.10.b: "Không cần thay đổi."

 ephorate_empowered_tribunes_modifier: "Tribune của Ephorate Được Tăng Quyền"
 ephorate_empowered_tribunes_modifier_desc: "Những người đưa tin và gián điệp của Ephorate đã được tổ chức lại, mang lại thêm nhiều hỗ trợ cho các lợi ích ngầm của clan."

 pod_ventrue_ephorate.11.t: "Cấp Dưới Đầy Tham Vọng"
 pod_ventrue_ephorate.11.desc: "Các đặc vụ trực tiếp của Ephorate là Strategoi, những cá nhân quyền lực được trao quyền lực của các Ephor và là những người duy nhất thực sự biết tên của họ. Strategoi vô cùng hữu ích như một phương tiện để thực thi quyền lực của Ephorate mà không gây nguy hiểm cho bản thân, nhưng họ cũng thường gây rắc rối vì họ nhòm ngó vị trí của các Ephor với lòng tham và là nguyên nhân chính gây ra sự phản bội trong tổ chức.\nHầu như đã trở thành lệ thường đối với các Ephor để tiến hành rà soát kỹ lưỡng các Strategoi theo thời gian (điều này thường dẫn đến một cuộc thanh trừng) và Ngài là người được giao nhiệm vụ với vinh dự đáng ngờ này cho thập kỷ này."
 pod_ventrue_ephorate.11.a: "Các Strategoi trung thành."
 pod_ventrue_ephorate.11.b: "Chúng không thể được tin tưởng."

 ephorate_empowered_strategoi_modifier: "Strategoi của Ephorate Được Tăng Quyền"
 ephorate_empowered_strategoi_modifier_desc: "Các đặc vụ trực tiếp của Ephorate đang làm việc chăm chỉ hơn bao giờ hết, nhưng thường vì lợi ích riêng của họ hơn là của clan."

 pod_ventrue_ephorate.667.t: "Những Điểm Tranh Cãi"
 pod_ventrue_ephorate.667.desc: "Ventrue là một clan bị chia rẽ theo nhiều cách, giữa các vùng đất, truyền thống, dòng máu và cách tồn tại khác nhau. Gần như điều duy nhất mà các phe khác nhau của họ đồng thuận là di sản cao quý của họ và rằng họ nên đoàn kết, nhưng với phe nào lãnh đạo, và hướng đến mục đích gì? Đây vẫn là những điểm tranh cãi lớn nhất giữa các Ventrue.\nNgài muốn tìm hiểu thêm về phe nào?"
 pod_ventrue_ephorate.667.a: "Patricians"
 pod_ventrue_ephorate.667.b: "Eternal Senate."
 pod_ventrue_ephorate.667.c: "Sinner Rome."
 pod_ventrue_ephorate.667.d: "Merchant Princes."
 pod_ventrue_ephorate.667.e: "Ashen Knights."
 pod_ventrue_ephorate.667.f: "Chưa cần bây giờ."

 pod_ventrue_ephorate.668.t: "Những Vị Vua Chân Chính Duy Nhất"
 pod_ventrue_ephorate.668.desc: "Patricians (còn được gọi là Patriarchs) khẳng định quyền cai trị mọi Cainite được thừa hưởng từ Enoch. Họ chủ yếu bao gồm các Prince phản chiếu tầng lớp quý tộc trần thế. Trong khi họ tôn trọng những thành tựu của Camilla và Rome, họ coi chủ nghĩa hưởng lạc và sự sa đọa là nguyên nhân dẫn đến sự sụp đổ của nó và nghiêm khắc, có kỷ luật hơn nhiều so với những người anh em theo lối La Mã của họ.\nCác Patriarch là những Ventrue bảo thủ đúc trong khuôn mẫu cổ điển. Họ coi mình là tầng lớp quý tộc được chọn của màn đêm, được Caine ưu ái và định sẵn để cai trị. Họ tuân theo mạnh mẽ các giáo lý của Con Đường Đế Vương (Road of Kings), phần lớn, và bám chặt vào những cách làm cũ (nghĩa là các truyền thống phong kiến của châu Âu, điều mà hầu hết các Patriarch biết đến từ đời sống trần thế của họ). Họ thúc đẩy quyền lực Ventrue và không tin vào sự thay đổi. Rốt cuộc, tại sao mọi thứ phải thay đổi, khi chúng đã được Chúa và Caine sắp đặt như vậy từ khởi thủy thời gian?\nSố phận tương lai trong Canon\nHợp nhất với Merchant Princes, Patricians sẽ trở thành thứ mà mọi người nghĩ là một Ventrue chân chính trong những đêm hiện đại."

 pod_ventrue_ephorate.669.t: "Giấc Mộng La Mã"
 pod_ventrue_ephorate.669.desc: "Còn được gọi là Antasian, Eternal Senate được dẫn dắt bởi những lý tưởng của Julia Antasia, một Ventrue La Mã từng là thành viên của Eternal Senate tại thành phố đó trước khi nó suy tàn. Một hình mẫu của Con Đường Nhân Tính (Road of Humanity), Antasia dạy cho những người theo bà về tầm quan trọng của sự bình đẳng và hợp tác vì lợi ích chung của tất cả. Bà giữ vững những cách thức "cổ xưa" chân chính của các Cainite La Mã và những ngày huy hoàng của Đế Chế và hy vọng tái tạo lại những thành tựu của Eternal Senate. Không cần phải nói, các Patriarch coi các Antasian là ảo tưởng nhất, hoặc tệ hơn là một cuộc nổi loạn nguy hiểm đang hình thành. Senate xem các Ventrue Patriarch là những kẻ tinh hoa kiêu ngạo, ích kỷ chỉ quan tâm đến quyền lực và vị trí của riêng họ mà không có gì khác.\nSố phận tương lai trong Canon\nVới sự biến mất của người dẫn dắt và lãnh đạo của họ, Eternal Senate sẽ mất phần lớn ảnh hưởng của mình vào tay Patricians, chỉ để lại một vài thành phố (như Frankfurt) theo đuổi lý tưởng của nó trong những thế kỷ tới."

 pod_ventrue_ephorate.670.t: "Rome Ngọt Ngào Sa Đọa"
 pod_ventrue_ephorate.670.desc: "Titus Venturus Camille (thường được biết đến với tên Camilla) là một nhân vật gây tranh cãi trong lịch sử Ventrue. Họ ca ngợi nhiều thế kỷ trị vì của ông trên Rome và sự đoàn kết chưa từng có trước hay sau đó mà ông mang lại cho thế giới Cainite và cảm thấy tự hào về vai trò của ông trong việc thanh trừng Carthage địa ngục. Nhưng họ ít hào hứng hơn với sự tuân theo cuồng nhiệt của ông đối với Con Đường Tội Lỗi (Road of Sin) và sự sa đọa tột độ mà ông mang đến cho Rome. Vì vậy, hầu hết Ventrue hài lòng khi nói về Camilla như một hình mẫu của một Ventrue trung cổ chân chính: một người cai trị mạnh mẽ và khôn khéo thống nhất các clan dưới quyền mình. Nhưng những người khác vẫn biết sự thật, Camilla được định hình bởi Con Đường Tội Lỗi không kém gì bởi việc là một Ventrue và họ tôn vinh cả hai mặt.\nCó lẽ clan Ventrue đã đi sai hướng sau khi Rome sụp đổ và một sự trở lại những đêm xưa tốt đẹp có thể là điều đáng ưu tiên hơn hướng đi hiện tại...\nSố phận tương lai trong Canon\nCamilla sẽ vẫn là một phần kỳ lạ và gây tranh cãi trong lịch sử Ventrue nhưng, dù tốt hay xấu, clan Ventrue sẽ không bao giờ trải nghiệm lại sự đoàn kết và sa đọa mà ông đã đạt được ở Rome cổ đại."

 pod_ventrue_ephorate.671.t: "Tiền Bạc là Quyền Lực"
 pod_ventrue_ephorate.671.desc: "Một quyền lực đang trỗi dậy trong Ventrue là các thành viên của clan làm giàu bằng nghề buôn bán thay vì tìm kiếm đất đai và lãnh địa riêng. Hầu hết những Merchant Princes này là tín đồ của Con Đường Con Buôn (Path of the Merchant) và tìm thấy sức mạnh của mình trong của cải hơn là đất đai và chư hầu. Không gắn với bất kỳ địa phương cụ thể nào, và hưởng lợi (phần lớn) từ Cuộc Chiến Các Prince, Merchant Princes đã tổ chức thành các bang hội và mạng lưới liên hệ khắp châu Âu.\nTrong khi nhiều Ventrue khinh miệt Merchant Princes với thói "hám tiền" và "cho vay nặng lãi" của họ, các thương gia đã dần dần tích lũy quyền lực và ảnh hưởng qua nhiều năm bên cạnh của cải. Giống như Eternal Senate, các Merchant tìm cách thống nhất lại Ventrue như trong những ngày ở Rome, nhưng dưới một bang hội thương mại thay vì một senate hay hoàng đế. Họ đã bắt đầu hậu thuẫn một số lãnh chúa Cainite để tạo ra môi trường thích hợp ở châu Âu, nơi họ có thể phát triển và trở thành quyền lực đứng sau ngai vàng.\nSố phận tương lai trong Canon\nLịch sử sẽ chứng minh Merchant Princes đúng khi tiền bạc sẽ thực sự trở thành quyền lực trong những thế kỷ tới. Liên minh với Patricians, Merchant Princes sẽ trở thành một phần không thể thiếu trong bản sắc cốt lõi của Ventrue."

 pod_ventrue_ephorate.672.t: "Ràng Buộc Danh Dự"
 pod_ventrue_ephorate.672.desc: "Ashen Knights là những Ventrue ít quan tâm đến việc tích lũy quyền lực nhất. Thay vào đó, họ nghiêm khắc tuân theo bộ quy tắc hiệp sĩ của riêng mình và hy vọng clan Ventrue sẽ nêu gương về sự dũng cảm, kiềm chế và kỷ luật cho các clan khác thay vì trực tiếp cố gắng cai trị họ. Hầu hết các Ashen Knights hợp tác tốt với các phe khác miễn là họ coi hành vi của phe đó là "danh dự", một tiêu chí có phần bí ẩn có thể khác nhau tùy theo mỗi hiệp sĩ.\nBị các Ventrue khác đánh giá thấp, Ashen Knights được các clan khác đánh giá cao vì có vẻ là những Ventrue ít kiêu ngạo hơn, không cố gắng cai trị họ bằng những lý lẽ đáng nghi ngờ nào đó. Điều này khiến họ trở thành một lực lượng chính trị với số lượng đồng minh đáng kinh ngạc có thể kêu gọi khi cần.\nSố phận tương lai trong Canon\nAshen Knights sẽ không chấp nhận sự biến đổi của clan Ventrue do liên minh giữa Patricians và Merchant Princes dẫn đầu. Gia nhập Sabbat mới hình thành để đáp trả, họ sẽ trở thành nòng cốt của Ventrue antitribu, chiến đấu để khôi phục danh dự đã mất từ lâu của clan mình."

  
