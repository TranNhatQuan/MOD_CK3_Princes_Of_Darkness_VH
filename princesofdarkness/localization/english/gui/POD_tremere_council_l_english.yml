l_english:
 tab_tremere_council: "#T Hội Đồng Tối Cao#!"
 
 tremere_council_tab_tt: "#bold Hội Đồng Tối Cao #!"
 tremere_council_intro: "Hội Đồng Tối Cao lãnh đạo Nhánh Tremere thay cho vị tổ sư. Mỗi Ủy Viên mang đến một giáo lý riêng cho tín ngưỡng Luật Lệ Tremere.\nNếu một Ủy Viên qua đời, cải đạo khỏi Luật Lệ Tremere hoặc ảnh hưởng giảm về 0, họ sẽ được thay bằng người mà chính Tremere cho là xứng đáng.\nMột [character_interaction|E] đặc biệt với các Ủy Viên cho phép bạn xin ân huệ, hoặc tăng/giảm ảnh hưởng của họ."
 council_influence_loc: "Ảnh Hưởng"
 
 generic_prowess_council_doctrine_name: "Ủy Viên Võ Lực"
 generic_prowess_council_doctrine_desc: "Có ít nhất một Ủy Viên được giáo dục về Võ Lực mang lại giáo lý này cho Tremere." 
 generic_intrigue_council_doctrine_name: "Ủy Viên Quyền Mưu"
 generic_intrigue_council_doctrine_desc: "Có ít nhất một Ủy Viên được giáo dục về Quyền Mưu mang lại giáo lý này cho Tremere." 
 generic_stewardship_council_doctrine_name: "Ủy Viên Quản Trị"
 generic_stewardship_council_doctrine_desc: "Có ít nhất một Ủy Viên được giáo dục về Quản Trị mang lại giáo lý này cho Tremere." 
 generic_learning_council_doctrine_name: "Ủy Viên Học Thức"
 generic_learning_council_doctrine_desc: "Có ít nhất một Ủy Viên được giáo dục về Học Thức mang lại giáo lý này cho Tremere." 
 generic_martial_council_doctrine_name: "Ủy Viên Quân Sự"
 generic_martial_council_doctrine_desc: "Có ít nhất một Ủy Viên được giáo dục về Quân Sự mang lại giáo lý này cho Tremere." 
 generic_diplomacy_council_doctrine_name: "Ủy Viên Ngoại Giao"
 generic_diplomacy_council_doctrine_desc: "Có ít nhất một Ủy Viên được giáo dục về Ngoại Giao mang lại giáo lý này cho Tremere." 
 abetorius_council_doctrine_name: "Ủy Viên Abetorius"
 abetorius_council_doctrine_desc: "Dù gặp nhiều thất bại, Abetorius vẫn được Tremere tin tưởng vào khả năng am hiểu và thao túng các thế lực ngoại bang vì lợi ích của nhánh." 
 grimgroth_council_doctrine_name: "Ủy Viên Grimgroth"
 grimgroth_council_doctrine_desc: "Grimgroth từng phản bội các đồng nghiệp Hermetic, khơi mào cuộc chiến không hồi kết giữa họ và Order of Reason. Tremere đã ban thưởng thích đáng cho hành động này." 
 astio_council_doctrine_name: "Ủy Viên Astio Giavetti"
 astio_council_doctrine_desc: "Vị lão sư này thoải mái hơn khi luyện thuật của mình so với việc lo toan chính trị trong Hội Đồng, khiến ông trở thành một thế lực gần như bị xem nhẹ trong Pyramid." 
 leduc_council_doctrine_name: "Ủy Viên LeDuc"
 leduc_council_doctrine_desc: "LeDuc trung thành hơn là tài giỏi, nhưng sự trung thành cũng có cái lợi riêng của nó." 
 calderon_council_doctrine_name: "Ủy Viên Calderon"
 calderon_council_doctrine_desc: "Calderon dễ nổi giận và chậm tha thứ. Nhánh Tremere chậm chạp được thúc đẩy hành động nhờ cơn thịnh nộ của ông." 
 xavier_council_doctrine_name: "Ủy Viên Xavier de Cincao"
 xavier_council_doctrine_desc: "Xavier là một nhà điều phối tài năng, có khả năng xử lý nhiều việc trên một vùng rộng lớn. Tuy nhiên sự chuyên tâm quá mức vào một số việc cụ thể của ông đôi khi gần như thành bệnh lý." 
 meerlinda_council_doctrine_name: "Ủy Viên Meerlinda"
 meerlinda_council_doctrine_desc: "Meerlinda khéo ngoại giao là trái tim thực sự của Hội Đồng, người giữ cho Pyramid không sụp đổ dù nó luôn cố hết sức để tan rã." 
 goratrix_council_doctrine_name: "Ủy Viên Goratrix"
 goratrix_council_doctrine_desc: "Goratrix đã thất bại trong cuộc tranh quyền đầu tiên với Etrius, nhưng cần nhiều hơn thế để thực sự hạ được ông ta." 
 etrius_council_doctrine_name: "Ủy Viên Etrius"
 etrius_council_doctrine_desc: "Kẻ trung thành nhất ngồi trên đỉnh Pyramid, giữ nó vững vàng thay cho Tremere." 
                      
 POD_tremere_council_interaction: "Diện Kiến Ủy Viên"       
 POD_tremere_council_interaction_desc: "Dùng Đức Tin của bạn để tăng hoặc giảm ảnh hưởng của Ủy Viên, hoặc xin một ân huệ."                    
        
