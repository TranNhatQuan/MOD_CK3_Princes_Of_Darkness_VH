 pod_tremere_council.2.t: "Diện Kiến Ủy Viên"
 pod_tremere_council.2.desc: "Hội Đồng Tối Cao của Tremere xử lý hầu hết công việc của Nhánh thay cho vị tổ sư. Vì Tremere được biết là đôi khi tỉnh dậy và tự ra sắc lệnh, các Ủy Viên luôn tranh giành quyền lực và ảnh hưởng, hy vọng làm hài lòng chủ nhân (hoặc ít nhất không khiến ông phật ý).\nTrong cuộc tranh đấu bất tận này, mọi tín đồ Tremere đều có vai trò của mình, tạo nên các nhóm bè cánh ca tụng người mà họ chọn để tôn sùng, hy vọng gặt hái phần thưởng khi thời cơ đến."
 pod_tremere_council.2.a: "Ca tụng Ủy Viên"           
 pod_tremere_council.2.b: "Cản trở Ủy Viên"           
 pod_tremere_council.2.c: "Xin Ủy Viên một ân huệ"           
 tremere_council_gain_influence_tt: "Ủy Viên sẽ nhận thêm 10 ảnh hưởng"           
 tremere_council_lose_influence_tt: "Ủy Viên sẽ mất 10 ảnh hưởng.\nNếu ảnh hưởng giảm về 0 hoặc thấp hơn, họ sẽ bị loại khỏi Hội Đồng."          
            
 pod_tremere_council.4.t: "Đỉnh Của Pyramid"
 pod_tremere_council.4.desc: "Một ghế trống trong Hội Đồng Tối Cao vừa xuất hiện và, như thường lệ, toàn thể Pyramid đang chờ lời phán của Tremere về việc ai sẽ là người được chọn. Suy nghĩ của Tremere về việc này huyền bí như người ta vẫn tưởng nhưng, ngoài vài lựa chọn "kỳ lạ", nó dường như chủ yếu tuân theo đường lối chính trị. Một tín đồ Tremere càng quyền lực, và càng thể hiện nhiều nhiệt tâm với Luật Lệ Tremere, thì càng có khả năng được bổ nhiệm vào Vòng Trong.\nCuối cùng, sau một thời gian chờ đợi đầy căng thẳng, các thành viên Vòng Trong hiện tại thông báo cho bạn tin này: Tremere đã chọn bạn. Vài người trong họ có vẻ hài lòng, người khác thì không vui, nhưng đó là ý chí của Tremere và do đó, giờ đây đã là sự thật."
 pod_tremere_council.4.a: "Bậc thang đã được bước lên"           
             
 tremere_council_entry_tt: "Bạn giờ đã là thành viên của Vòng Trong Tremere"

 pod_tremere_council.6.t: "Vòng Trong"
 pod_tremere_council.6.desc: "Hội Đồng Tối Cao lãnh đạo Nhà Tremere thay cho vị tổ sư. Những ma cà rồng quyền lực này, do chính Tremere đích thân chọn ra, là những kẻ lãnh đạo thực sự của $pod_clan$, vì tổ sư hiện đang trong $pod_torpor$ hoặc bận tâm những việc quan trọng hơn. Về căn bản, họ là những đầu óc chủ chốt định hình Nhà này, và giáo lý cùng chính sách của họ phải được mọi tín đồ Tremere trung thành tuân theo.\n #X Vòng Trong là một đặc điểm nổi bật của những tín đồ Tremere trung thành với Luật Lệ. Bạn có thể truy cập nó qua một thẻ ở bên phải màn hình.#!"
 pod_tremere_council.6.a: "Pyramid đứng vững nhờ kỷ luật"           
   
 pod_tremere_council.7.t: "Tranh Chấp Trong Pyramid"
 pod_tremere_council.7.desc: "Là quyền lực cao nhất trong $pod_clan$ Tremere, ngoài chính vị tổ sư, Hội Đồng Tối Cao là một ổ mưu mô và tranh chấp. Mỗi Ủy Viên đều muốn hạ bệ đồng sự và nâng cao vị thế của mình trong mắt Tremere, dẫn đến những xung đột (thường khá vụn vặt) có thể vang dội khắp Pyramid.\nMột cuộc xung đột như vậy vừa mới nổ ra và nhiều người đang chọn phe, buông lời nghi ngại và tin đồn về các Ủy Viên đang tranh chấp để đổ thêm dầu vào lửa."
 pod_tremere_council.7.c: "Việc này không đáng để ta bận tâm."                
 pod_tremere_council.7.a: "[councilor1.GetFirstName] đã gây ra nhiều lỗi lầm..."
 pod_tremere_council.7.b: "[councilor2.GetFirstName] không thực lòng trung thành với Tremere!"
  
 pod_tremere_council.8.t: "Ca Tụng Trong Pyramid"
 pod_tremere_council.8.desc: "Cuộc chiến ngầm giành ảnh hưởng giữa các Ủy Viên được tiến hành bằng nhiều cách khác nhau. Thu phục sự ủng hộ từ những tín đồ Tremere có ảnh hưởng là một trong số đó, và một Ủy Viên đã tìm cách lấy lòng bạn từ lâu. Những cử chỉ nhỏ, lời tán dương và cả hối lộ trắng trợn đều đã được dùng, và người 'bạn' mới của bạn giờ mong bạn công khai bày tỏ mình quý trọng họ đến mức nào."
 pod_tremere_council.8.a: "Theo ý kiến khách quan của ta, ngài là người xuất sắc nhất!"
 pod_tremere_council.8.b: "Ta không hạ mình vào những trò chính trị vụn vặt như vậy."
 pod_tremere_council.8.c: "Chắc chắn, sự ủng hộ của ta đáng giá hơn thế..."
 
 pod_tremere_council.9.t: "Tri Thức Trong Pyramid"
 pod_tremere_council.9.desc: "Gần đây bạn đã tìm ra một cuốn sách quan trọng liên quan đến nghiên cứu mới nhất của mình và may mắn là, nó đang thuộc quyền sở hữu của $pod_clan$ Tremere. Cụ thể hơn là trong thư viện riêng của một Ủy Viên. Bạn có thể gửi một yêu cầu chính thức (và khá vất vả) để được sử dụng, hoặc dùng cách hối lộ kiểu cũ. Dù sao thì cả tri thức cũng có giá của nó."
 pod_tremere_council.9.a: "Gửi yêu cầu chính thức."
 pod_tremere_council.9.b: "Một khoản đóng góp cho thư viện riêng có lẽ là cần thiết..."
 pod_tremere_council.9.c: "Ta không còn muốn cuốn sách này nữa."
 
 pod_tremere_council.10.t: "Bảo Trợ Trong Pyramid"
 pod_tremere_council.10.desc: "Một Ủy Viên đã chú ý đến bạn và đề xuất một quan hệ hợp tác nghiên cứu. Cùng nhau, hai người có thể đạt được những bước tiến lớn trong việc khám phá bí mật của Dòng Máu cho $pod_clan$ Tremere (và cho chính bạn). Tuy nhiên, sự hợp tác giữa hai thuật sĩ quyền lực như vậy thường khó mà thuận lợi, và có lẽ sẽ ít căng thẳng hơn nếu bạn từ chối đề xuất này và tiếp tục làm việc một mình."
 pod_tremere_council.10.a: "Chúng ta sẽ làm nên những điều vĩ đại!"
 pod_tremere_council.10.b: "Có lẽ chỉ nên hợp tác một phần?"
 pod_tremere_council.10.c: "Ta không cần bất kỳ sự giúp đỡ nào!"
  
 pod_tremere_council.11.t: "Âm Mưu Trong Pyramid"
 pod_tremere_council.11.desc: "Trong lúc đang xử lý một việc khác, gần đây bạn đã tìm ra chuyện xấu của một Ủy Viên. Không phải điều gì quá lớn, nhưng đủ để làm giảm ảnh hưởng của họ nếu thông tin nhạy cảm này bị lộ ra ngoài. Tuy nhiên điều này rất có thể sẽ gây rạn nứt giữa bạn và họ, và bạn cũng có thể xem xét trao thông tin này trực tiếp cho họ để đổi lấy chút thiện chí từ vụ việc này."
 pod_tremere_council.11.a: "Nhà Tremere phải biết sự thật!"
 pod_tremere_council.11.b: "Hãy quên chuyện thất thố này đi."

 window_council_session_tooltip: "Một Buổi Họp Hội Đồng cho phép Vòng Trong thảo luận chính sách của Tremere và đưa ra chỉ dẫn hữu ích cho Nhà... hoặc chỉ đơn giản là cãi vã bất tận với nhau.\nChỉ các Ủy Viên mới có thể mở một buổi họp Hội Đồng.\nChỉ được phép một lần mỗi 20 năm."
 Council_Session: "#V Buổi Họp Hội Đồng#!"
 
 pod_tremere_council.12.t: "Buổi Họp Hội Đồng"
 pod_tremere_council.12.desc: "Vòng Trong hiếm khi tụ họp nhưng khi họ làm vậy, đó luôn là một sự kiện trọng đại. Đây chính là nơi ẩn chứa quyền lực thực sự của Nhà Tremere, với các Ủy Viên được chọn ra đang lao tâm khổ tứ vì vinh quang của toàn thể Pyramid.\nÍt nhất, đó là phiên bản chính thức.\nPhần lớn thời gian, các buổi họp này lại biến thành những cuộc cãi vã vô bổ và đấu khẩu giữa các Ủy Viên đối địch và, ngoài những lời sỉ nhục và đe dọa, không đạt được gì nhiều. Tuy vậy, nếu bạn muốn tạo ra sự khác biệt thực sự trong chuyện của Nhánh, đây chính là nơi điều đó xảy ra."
 tremere_council_player_lose_influence_tt: "Bạn sẽ mất 10 ảnh hưởng.\nNếu ảnh hưởng giảm về 0 hoặc thấp hơn, bạn sẽ bị loại khỏi Hội Đồng Tremere."
 tremere_council_gold_tt: "Mọi tín đồ Tremere trung thành từ cấp công tước trở lên sẽ nhận 100 vàng."
 pod_tremere_council.12.a: "Chi viện cho công sức của các thành viên trung thành trong nhà!"
 tremere_council_military_tt: "Bạn sẽ được đưa ra vài lựa chọn để sử dụng phần kỳ dị hơn trong binh khí của Tremere."
 pod_tremere_council.12.b: "Chúng ta cần mọi sự giúp đỡ có thể có được..."
 pod_tremere_council.12.c: "Chúng ta phải đánh vào kẻ thù!"
 tremere_council_aggressive_tt: "Mọi tín đồ Tremere trung thành từ cấp công tước trở lên sẽ nhận một hiệu ứng kéo dài mười năm làm tăng khả năng gây chiến và một số ưu thế quân sự tấn công, đổi lại là căng thẳng tinh thần."
 pod_tremere_council.12.d: "Củng cố phòng thủ là điều then chốt."
 tremere_council_defensive_tt: "Mọi tín đồ Tremere trung thành từ cấp công tước trở lên sẽ nhận một hiệu ứng kéo dài mười năm làm giảm khả năng gây chiến và một số ưu thế quân sự phòng thủ, đổi lại là căng thẳng tinh thần."
 tremere_council_player_gain_influence_tt: "Bạn sẽ nhận thêm 10 ảnh hưởng."
 pod_tremere_council.12.e: "Chỉ chơi trò chính trị trong buổi họp này thôi."
 
 aggressive_order_modifier: "Giáo Lý Hiếu Chiến"
 aggressive_order_modifier_desc: "Vòng Trong đã ra sắc lệnh rằng Pyramid phải táo bạo trước kẻ thù, và Nhà Tremere sẽ tuân theo."
 defensive_order_modifier: "Giáo Lý Thủ Thế"
 defensive_order_modifier_desc: "Vòng Trong đã ra sắc lệnh rằng Pyramid phải tập trung củng cố phòng thủ, và Nhà Tremere sẽ tuân theo."
 
 pod_tremere_council.13.t: "Vấn Đề Quân Sự"
 pod_tremere_council.13.desc: "Không có gì bí mật khi Nhà Tremere có rất nhiều kẻ thù. Nhánh này đã sụp đổ từ lâu nếu không nhờ sự khéo léo tuyệt đối (và thiếu kiềm chế) trong việc tạo ra nhiều loại quái vật sinh ra để chiến đấu.\nGargoyle chỉ là phần nổi chính thức, dễ thấy của tảng băng. Còn rất nhiều thí nghiệm đáng lo ngại hơn do Goratrix và Virstania tạo ra có thể được tung ra nếu Hội Đồng Tối Cao chấp thuận..."
 pod_tremere_council.13.a: "Chúng ta chỉ cần thêm Gargoyle!"
 tremere_council_gargoyles_tt: "Mỗi tín đồ Tremere trung thành từ cấp công tước trở lên sẽ nhận hai nhóm [GetMaA('gargoyle_warriors').GetName]."
 pod_tremere_council.13.b: "Chuột giống chó sói có mỏ chim? Thật vậy sao?"
 tremere_council_chitterers_tt: "Tín đồ Tremere trung thành giờ sẽ có thể sử dụng [GetMaA('chitterers').GetName]."
 pod_tremere_council.13.c: "Bọ cánh cứng có vũ trang dao? Kể thêm cho ta nghe..."
 tremere_council_reapers_tt: "Tín đồ Tremere trung thành giờ sẽ có thể sử dụng [GetMaA('reapers').GetName]."
 pod_tremere_council.13.d: "Một đàn ăn thịt sống nghe có vẻ thú vị..."
 tremere_council_skin_eaters_tt: "Tín đồ Tremere trung thành giờ sẽ có thể sử dụng [GetMaA('skin_eaters').GetName]."
 pod_tremere_council.13.e: "Quân đội của chúng ta vẫn ổn như hiện tại."
 
 pod_gui_nick: "#V '[Character.GetNicknameNoTooltip|U]'#!"
 
 pod_tremere_council.30.t: "Một Chỗ Ngồi Trên Bàn?"
 pod_tremere_council.30.desc: "Pyramid của Tremere đang xôn xao vì tin đồn rằng gần đây có một ghế trống trong Hội Đồng Tối Cao. Chi tiết rất mù mờ vì đỉnh của Pyramid không hề nổi tiếng về việc công khai chuyện nội bộ. Bất kể nguyên nhân của chỗ trống này là gì, giờ là lúc mọi tín đồ Tremere trung thành chờ đợi lời phán của tổ sư về lựa chọn người thay thế.\nDù cách nghĩ của Tremere là khó dò, nhưng có lẽ đây là thời điểm tốt để bất kỳ ứng viên Ủy Viên nào thể hiện lòng tận tụy với chính nghĩa bằng cách chứng minh sự trung thành với Luật Lệ."
 entry_tremere_council_tt: "Bạn sẽ được chọn làm Ủy Viên Tremere tiếp theo. Lựa chọn này sẽ ít tốn kém hơn nếu cấp bậc, quy mô vương quốc và đức tin của bạn càng cao."

 