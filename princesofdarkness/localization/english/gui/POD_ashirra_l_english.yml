 temporary_doctrine_tt: "Giáo lý này sẽ bị hủy sau #V 10#! năm."
 
 ashirra_idealism_doctrine_name: "Lý Tưởng Ashirra"
 ashirra_edict_adopt_mysticism: "Ủng hộ Cải Cách"
 ashirra_mysticism_doctrine_name: "Cải Cách Ashirra" 
 ashirra_mysticism_doctrine_desc: "Do Haroun el-La'il khởi xướng, đường hướng này thách thức những người theo truyền thống trên nhiều vấn đề (như cho rằng Ashirra đã hoàn thành bổn phận với Sawn chỉ bằng chính sự tồn tại về đêm của mình). Nói rộng ra, đây là lời kêu gọi tranh luận và đổi thay mà các Elder cho là con dốc trơn trượt." 
 ashirra_edict_adopt_legalism: "Áp Đặt Truyền Thống"
 ashirra_legalism_doctrine_name: "Truyền Thống Ashirra"
 ashirra_legalism_doctrine_desc: "Quan điểm truyền thống của đa số Ashirra là tuân thủ nghiêm ngặt giáo lý, được các Ashirra đời đầu diễn giải lại cho phù hợp với kiếp bất tử của mình. Với những người phản đối, đường hướng này không chấp nhận tranh luận và chỉ củng cố quyền lực của các Elder."
 
 ashirra_edict_army: "Chi Phối Zawiya"
 ashirra_army_doctrine_name: "Zawiya Bị Chi Phối" 
 ashirra_army_doctrine_desc: "Dù không đông đảo như các dòng tu Cơ Đốc giáo, Hồi giáo vẫn có một số dòng tu quân sự. Ashirra có ảnh hưởng đáng kể trong đó và không ngần ngại sử dụng khi cần." 
 ashirra_edict_tax: "Bảo Vệ Madina"
 ashirra_tax_doctrine_name: "Madina Được Bảo Vệ"
 ashirra_tax_doctrine_desc: "Là trung tâm sinh hoạt của một thị trấn hay thành phố Hồi giáo, Madina là nơi Ashirra chi phối các việc của người trần mạnh mẽ nhất."
 ashirra_edict_opinion: "Áp Đặt Sự Trung Thành"
 ashirra_opinion_doctrine_name: "Tập Hợp Maghrib"
 ashirra_opinion_doctrine_desc: "Là một nhóm Ashirra nghiêm khắc và sùng đạo, Maghrib chuyên trừ khử mọi mối đe dọa với đức tin, dù từ trong hay ngoài."
 doctrine_parameter_ashirra_opinion_active: "" # Make loca empty to hidden this like vanilla
 doctrine_parameter_opinion_of_ashirra_opinion_active: "$VALUE|+=0$ [opinion|E] thưởng với [Glossary('Ashirra','game_concept_ashirra_desc')]"
 ashirra_opinion_active_opinion_name: "Đồng Đạo Ashirra"
 
 ashirra_edict_gain_fervor: "Tập Hợp Tín Đồ"
 fervor_gain_ashirra_edict: "Sắc Lệnh Ashirra"