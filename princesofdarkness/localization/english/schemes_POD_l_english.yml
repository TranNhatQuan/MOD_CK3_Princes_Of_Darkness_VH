 POD_command_effigy_gold_scheme_desc_general: "Kiếm Tiền [scheme|E] là một [personal_scheme|E] phái các effigy sinh vật của ngươi đi tìm kho báu cho ngươi bằng nhiều cách khác nhau. Âm mưu này có thể gây nguy hiểm cho effigy sinh vật của ngươi và được đẩy nhanh nhờ kỹ năng [stewardship|E] của ngươi. Vì nó không phải là [hostile_scheme|E], nó không phải là [secret_scheme_single|E] và không sử dụng [agents|E]."

 POD_command_effigy_prestige_scheme: "Lan Truyền Danh Tiếng của Ta"
