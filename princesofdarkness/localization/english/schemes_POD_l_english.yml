 PODentrance: "Mê Hoặc"
 PODentrance_action: "Mê Hoặc"
 POD_entrance_interaction: "Mê Hoặc #weak (Scheme)#!"
 POD_entrance_interaction_desc: "Thông qua $pod_discipline$ Presence, triệu hồi dòng máu để mê hoặc một sinh linh khiến chúng có cảm tình với ngươi."
 PODentrance_desc: "Thông qua sự mê hoặc, ta sẽ khiến [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] có cảm tình với ta!"
 PODentrance_desc_general: "$PODentrance$ là một [personal_scheme|E] nhắm tới việc khiến mục tiêu có cảm tình với ngươi. Nó được mở khóa bởi $pod_discipline$ [GetTrait('presence').GetName( GetNullCharacter )] [GetPerk('entrancement_perk').GetName(GetNullCharacter)] [perk|E]. \n\n #X Khác với âm mưu thông thường, tỉ lệ thành công được liệt kê không có ý nghĩa. Sau khi âm mưu hoàn tất, một cuộc đấu ngoại giao sẽ quyết định thành bại. #! \n\nCơ hội thành công tăng lên nhờ [GetPerk('majesty_perk').GetName(GetNullCharacter)], [GetTrait('presenceadvanced').GetName(GetNullCharacter)] và [GetPerk('ironclad_command_perk').GetName(GetNullCharacter)].  \n\nNếu kẻ phòng thủ sở hữu [GetPerk('unswayable_mind_perk').GetName(GetNullCharacter)], [GetPerk('fortify_the_inner_facade_perk').GetName(GetNullCharacter)], hoặc đã thi triển phép thuật Blood Sorcery 'Song of Jupiter', tỉ lệ thành công sẽ giảm."
 scheme_interaction_tt_PODentrance_approved: "[GetScheme('PODentrance').GetTypeName] [recipient.GetFirstName]. \nViệc này sẽ kết thúc bằng một cuộc đấu ngoại giao.\nNếu thành công, nạn nhân sẽ tăng thiện cảm với ngươi."
 PODENTRANCE_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUINamePossessive] [opinion|E] về ngươi sẽ tăng lên!"
 PODentrance_my_learning: "Học Thức của ngươi: $VALUE|=+0$"
 PODentrance_my_diplomacy: "Ngoại Giao của ngươi: $VALUE|=+0$"
 PODentrance_my_rival: "Nạn Nhân của ngươi: $VALUE|=+0$"
 
 PODmesmerize: "Thôi Miên"
 PODmesmerize_action: "Dominate"
 POD_mesmerize_interaction: "Thôi Miên #weak (Scheme)#!"
 POD_mesmerize_interaction_desc: "Thông qua $pod_discipline$ Dominate, triệu hồi dòng máu để buộc một sinh linh phải tuân theo mệnh lệnh của ngươi."
 PODmesmerize_desc: "Thông qua sự khống chế, ta sẽ có được một điểm ràng buộc lên [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip], cho phép ta ra đủ loại mệnh lệnh cho chúng!"
 PODmesmerize_desc_general: "$PODmesmerize$ là một [personal_scheme|E] nhắm tới việc buộc một sinh linh phải tuân theo mệnh lệnh của ngươi. Nó được mở khóa bởi $pod_discipline$ [GetTrait('dominate').GetName( GetNullCharacter )] [GetPerk('mesmerize_perk').GetName(GetNullCharacter)] [perk|E]. \n\n #X Khác với âm mưu thông thường, tỉ lệ thành công được liệt kê không có ý nghĩa. Sau khi âm mưu hoàn tất, một cuộc đấu quản lý sẽ quyết định thành bại. #! \n\nMa cà rồng có [Glossary('Thế Hệ','game_concept_vampgeneration_desc')] thấp hơn kẻ tấn công sẽ miễn nhiễm. Cũng như ma cà rồng đã đạt tới [golconda|E]. \n\nNhân vật có tính cách phục tùng sẽ dễ bị thôi miên hơn. Ma cà rồng có [Glossary('Thế Hệ','game_concept_vampgeneration_desc')] thấp hơn đối thủ sẽ có lợi thế. Hầu hết người phàm có rất ít khả năng phòng vệ trước năng lực này. Cơ hội thành công cũng tăng lên nhờ [GetPerk('rationalize_perk').GetName(GetNullCharacter)], [GetTrait('dominateadvanced').GetName(GetNullCharacter)] và [GetPerk('will_conquers_perk').GetName(GetNullCharacter)]. \n\n[mesmerize_defenses|E]"
 scheme_interaction_tt_POD_mesmerize_approved: "[GetScheme('PODmesmerize').GetTypeName] [recipient.GetFirstName] để chúng phục vụ ta.\nViệc này sẽ kết thúc bằng một cuộc đấu quản lý."
 PODmesmerize_SUCCESS_DESC: "Ngươi sẽ có được một điểm ràng buộc lên [TARGET_CHARACTER.GetShortUIName]!"
 PODmesmerize_my_stewardship: "Quản Lý của ngươi: $VALUE|=+0$"
 PODmesmerize_my_rival: "Nạn Nhân của ngươi: $VALUE|=+0$"
 
 PODsummon: "Triệu Hồi"
 POD_summon: "Triệu Hồi"
 PODsummon_action: "Triệu Hồi"
 POD_summon_interaction: "Triệu Hồi #weak (Scheme)#!"
 POD_summon_interaction_desc: "Thông qua $pod_discipline$ Presence, triệu hồi dòng máu để gọi một sinh linh đến triều đình của ngươi."
 PODsummon_desc: "Thông qua việc vận dụng sự hiện diện huyền bí của ngươi, [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] sẽ được triệu đến triều đình của ngươi."
 PODsummon_desc_general: "$PODsummon$ là một [personal_scheme|E] nhắm tới việc lôi kéo nhân vật khác đến triều đình của ngươi. Âm mưu này chủ yếu dựa trên [diplomacy|E] của ngươi, nó không phải là [secret_scheme_single|E] và không sử dụng [agents|E]. Nó được mở khóa bởi [GetPerk('summon_perk').GetName(GetNullCharacter)] [perk|E] của $pod_discipline$ [GetTrait('presence').GetName( GetNullCharacter )]. \n\n #X Khác với âm mưu thông thường, tỉ lệ thành công được liệt kê không có ý nghĩa. Khi âm mưu bắt đầu, một cuộc đấu trung bình giữa ngoại giao và mưu kế sẽ quyết định thành bại. Thành công sẽ cho phép âm mưu tiến triển và có khả năng tốn một điểm máu mỗi tháng. Thất bại sẽ kết thúc âm mưu và khiến ngươi không thể thử triệu hồi mục tiêu này trong 10 năm. Cũng có khả năng thất bại hoặc thành công một cách quyết định. Thành công quyết định sẽ giảm một nửa thời gian mục tiêu của ngươi cần để đến, trong khi thất bại quyết định sẽ khiến ngươi không thể thử triệu hồi mục tiêu trong 50 năm.#! \n\nCơ hội thành công tăng lên nhờ [GetPerk('majesty_perk').GetName(GetNullCharacter)], [GetTrait('presenceadvanced').GetName(GetNullCharacter)] và [GetPerk('ironclad_command_perk').GetName(GetNullCharacter)].  \n\nNếu kẻ phòng thủ sở hữu [GetPerk('unswayable_mind_perk').GetName(GetNullCharacter)], [GetPerk('fortify_the_inner_facade_perk').GetName(GetNullCharacter)], hoặc đã thi triển phép thuật Blood Sorcery 'Song of Jupiter', tỉ lệ thành công sẽ giảm. \n\nNếu mục tiêu đang phục vụ một Lãnh chúa khác hoặc là khách của họ, khả năng kháng âm mưu cá nhân của lãnh chúa đó sẽ làm tăng thời gian cần để triệu hồi mục tiêu."
 scheme_interaction_tt_PODsummon_approved: "Triệu hồi [recipient.GetFirstName].\nViệc này sẽ bắt đầu bằng một cuộc đấu giữa mức trung bình ngoại giao và mưu kế của ngươi đối đầu với mức trung bình ngoại giao và mưu kế của [recipient.GetHerHis]."
 PODSUMMON_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName] sẽ được triệu đến trước mặt ngươi!"
