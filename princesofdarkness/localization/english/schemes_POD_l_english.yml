 POD_command_effigy_renown_scheme_desc: "Các effigy của ngươi sẽ cố củng cố tên tuổi gia tộc ngươi."
 POD_command_effigy_renown_scheme_desc_general: "Giúp Đỡ Gia Tộc Ta [scheme|E] là một [personal_scheme|E] phái các effigy sinh vật của ngươi đi giành [dynasty_prestige|E] cho tên tuổi gia tộc ngươi bằng nhiều cách khác nhau. Âm mưu này có thể gây nguy hiểm cho effigy sinh vật của ngươi và được đẩy nhanh nhờ kỹ năng [diplomacy|E] của ngươi. Vì nó không phải là [hostile_scheme|E], nó không phải là [secret_scheme_single|E] và không sử dụng [agents|E]."

