 vamphunt: "Săn Mồi"
 vamphunt_action: "Săn Mồi"
 vamphunt_interaction: "Săn Mồi #weak (Scheme)#!"
 vamphunt_desc: "Săn [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] để lấy máu của [SCHEME.GetTargetCharacter.GetHerHis]."
 vamphunt_desc_general: "$vamphunt$ là một [hostile_scheme|E] trong đó [GetTrait('vampire').GetName( GetNullCharacter )] săn một nhân vật [GetTrait('mortal').GetName( GetNullCharacter )] để lấy máu của họ. Âm mưu này chủ yếu dựa trên [intrigue|E] của ngươi, nó là [secret_scheme_single|E] và không sử dụng [agents|E]. Khi thành công, [GetTrait('vampire').GetName( GetNullCharacter )] sẽ uống máu của [GetTrait('mortal').GetName( GetNullCharacter )]. Nếu âm mưu này bị phát hiện, nhân vật sẽ vi phạm [the_masquerade|E], dẫn tới những hệ lụy tiềm tàng như bị $POD_splat_hunter_plural$ tấn công. Năng lực này sẽ không có tác dụng lên nhân vật [landed|E]. Nạn nhân tiềm năng phải ở cùng địa điểm với ngươi."
 scheme_interaction_tt_vamphunt_approved: "Săn [recipient.GetFirstName]. Ngươi sẽ có thể hút máu của [recipient.GetHerHis] để bổ sung nguồn dự trữ của mình."
