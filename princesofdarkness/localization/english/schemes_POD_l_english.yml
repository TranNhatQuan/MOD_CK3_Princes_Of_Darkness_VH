 POD_command_effigy_lifestyle_scheme_desc_general: "Học Kỹ Năng Thay Ta [scheme|E] là một [personal_scheme|E] phái các effigy cao cấp của ngươi đi cố giành kinh nghiệm lối sống dựa trên đặc tính giáo dục của mục tiêu ngươi. Âm mưu này có thể gây nguy hiểm cho effigy sinh vật của ngươi và chủ yếu dựa trên kỹ năng [learning|E] của ngươi cùng cấp độ effigy sinh vật. Vì nó không phải là [hostile_scheme|E], nó không phải là [secret_scheme_single|E] và không sử dụng [agents|E]."
