 diablerize: "Diablerize"
 diablerize_action: "Diablerize"
 diablerize_interaction: "[Glossary('Diablerize','game_concept_diablerie_desc')] #weak (Âm mưu)#!"
 diablerize_desc: "Ta sẽ [Glossary('Diablerize','game_concept_diablerie_desc')] [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] và nuốt chửng linh hồn của hắn!"
 diablerize_desc_general: "$diablerize$ là một [hostile_scheme|E] nhằm giết một mục tiêu [GetTrait('vampire').GetName( GetNullCharacter )] và nuốt chửng toàn bộ máu cùng linh hồn của họ. Đây là một [secret_scheme|E] dựa trên [intrigue|E], có thể chiêu mộ [agents|E].\n\nMột $pod_diablerie$ thành công sẽ dẫn đến [character_death_death|E] của [scheme_target|E]. \n\nMột vụ giết người giữ được bí mật thành công sẽ mang lại cho [scheme_owner|E] một $pod_diablerie$ [secret|E].\n\nBị phát hiện khi đang cố [Glossary('Diablerize','game_concept_diablerie_desc')], hoặc thực hiện thành công diablerie lên một [GetTrait('vampire').GetName( GetNullCharacter )] là một [crime|E] nghiêm trọng đối với hầu hết các tín ngưỡng của [GetTrait('vampire').GetName( GetNullCharacter )]. Còn được gọi là 'Amaranth' theo tên nạn nhân đầu tiên của $pod_diablerie$, đây là quá trình một [GetTrait('vampire').GetName( GetNullCharacter )] rút cạn toàn bộ máu, kể cả linh hồn, của một [GetTrait('vampire').GetName( GetNullCharacter )] khác. Nó cho phép [Glossary('Diablerist','game_concept_diablerie_desc')] đạt được [blood_potency|E] và thậm chí một [Glossary('Thế Hệ','game_concept_vampgeneration_desc')] thấp hơn của nạn nhân. Cái giá phải trả thường là làm mạnh thêm [Glossary('Beast','game_concept_beast_desc')] của [GetTrait('vampire').GetName( GetNullCharacter )]. Chúng ta thể hiện điều này bằng cách mất các cấp độ [piety|E]. Hầu hết [GetTrait('vampire').GetName( GetNullCharacter )] s đều có ác cảm với #TOOLTIP:GAME_TRAIT,diablerist,[GetNullCharacter] #L Diablerists#!#!."
 scheme_interaction_tt_diablerize_approved: "[Glossary('Diablerize','game_concept_diablerie_desc')] [recipient.GetFirstName]."
