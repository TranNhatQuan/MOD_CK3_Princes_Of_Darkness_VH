l_english:




 kinfolk_militia: "Kinfolk Militia"
 kinfolk_militia_flavor: "#F Kinfolk hèn mọn thường là xương sống của bất kỳ đội quân $glossary_fera$ nào. Dù thường trang bị tồi tàn, họ bù đắp điều đó bằng ý chí quyết tâm tột cùng.#!"    
 kinfolk_leeches_hunters: "Kinfolk Thợ Săn Đỉa Máu"
 kinfolk_leeches_hunters_flavor: "#F Mọi Kinfolk đều biết rõ mối nguy từ lũ hút máu. Cung và nỏ là vũ khí ưa thích của những kẻ được giao nhiệm vụ săn lùng mối đe dọa này.#!"
 kinfolk_outriders: "Kinfolk Kỵ Binh Tiền Trạm"
 kinfolk_outriders_flavor: "#F Sống gần gũi với những người thân biến hình của mình, Kinfolk thường quen thuộc với hoang dã hơn những người phàm khác, điều này có thể được tận dụng để biến họ thành một lực lượng chiến đấu mạnh mẽ và nhanh nhẹn.#!"


 amazons: "Amazons Kinfolk"
 amazons_flavor: "#F Những người phụ nữ này, đã thoát khỏi ách gia trưởng, sẽ chiến đấu vì các ân nhân Black Furies của mình như những huyền thoại xưa.#!"
 kinfolk_defenders: "Những Kẻ Bảo Vệ"
 kinfolk_defenders_flavor: "#F Nhân loại cần được bảo vệ, và những Kinfolk mạnh mẽ, được chuẩn bị kỹ lưỡng này đã sẵn sàng làm tròn phần việc của mình.#!"
 woad_raider_maa: "Woad Raiders"
 woad_raider_maa_flavor: "#F Woad là một loài thực vật tìm thấy ở quần đảo Anh, từ đó có thể chiết xuất ra một sắc tố xanh lam. Các chiến binh Celt cổ đại từng sơn mình bằng sắc tố này trước khi lâm trận để trông đáng sợ hơn và làm nao núng kẻ thù. Fianna Kinfolk vẫn còn tôn vinh truyền thống này trong chiến đấu.#!"
 berserkers_maa: "Berserkers"
 berserkers_maa_flavor: "#F Kinfolk của Get of Fenris thường mặc rất ít hoặc không mặc áo giáp hay quần áo gì, xông vào trận chỉ khoác trên mình da gấu hoặc da sói.#!"
 ratha_maa: "Ratha"
 ratha_maa_flavor: "#F Dù xe ngựa chiến đã suy tàn ở Ấn Độ từ khoảng năm 300 TCN, ý nghĩa văn hóa và tôn giáo to lớn của chúng đã ngăn không cho chúng bị bỏ hẳn, dù kém hiệu quả hơn kỵ binh và voi chiến trong trận mạc, và vẫn được triển khai song song cùng những lực lượng đó. Kinfolk của Stargazers vẫn thường dùng chúng trong chiến đấu để quấy nhiễu kẻ thù của bộ tộc mình.#!"




 werewolfpack: "Bầy Người Sói"

 battlescarred_fera: "Fera Dày Dạn Trận Mạc"
 battlescarred_fera_flavor: "#F Một nhóm $glossary_fera$ kỳ cựu sẵn sàng bảo vệ đồng loại của mình.#!"

 skull_pigs: "Skull Pigs"
 skull_pigs_flavor: "#F Skull Pigs chẳng qua là tàn tích điên loạn của giống loài biến hình từng được gọi là Grondr — những người quản gia của Gaia chuyên lo việc dọn dẹp và tiêu hủy, từng giữ cho toàn bộ Gaia không bị mục ruỗng và thối rữa.#!"

###Werewolves

 cliath: "Cliath"
 cliath_flavor: "#F Cliath là những Garou trẻ tuổi, thường được các bậc trưởng bối gọi là "Pups". Những kẻ non trẻ này khao khát đạt được Vinh Quang và thăng Cấp Bậc.#!"

 amazons_diana_maa: "Amazons của Diana"
 amazons_diana_maa_flavor: "#F Amazons của Diana là một nhóm Furies quan tâm nhiều hơn đến việc trở thành những nữ chiến binh táo bạo, bất khả cản, hơn là những kẻ báo thù thiêng liêng. Phe này hiếm khi được xem là một nhóm chính thức, mà giống một tập hợp chung cho những kẻ tận tâm chứng minh mình ngang hàng với bất kỳ người đàn ông nào trong chiến đấu chống lại $glossary_wyrm$.#!"

 children_of_cluid_maa: "Children of Cluid"
 children_of_cluid_maa_desc: "#F Nhiều Cluithi tự xem mình là những đứa con đích thực nhất của Cluid, người anh hùng đầu tiên dẫn dắt người Pict đến Caledonia. Những chiến binh này chiến đấu với sự hăng hái tà mị để thúc đẩy mục tiêu của mình.#!"

 swarm_maa: "Bầy Đàn"
 swarm_maa_flavor: "#F Phe Bone Gnawer này tập trung vào khía cạnh chiến tranh của loài chuột, chú trọng lối đánh bẩn thỉu và khai thác mọi lợi thế có được trước kẻ thù. Họ chuyên về chiến thuật du kích, đánh vào $glossary_wyrm$ rồi biến mất ngay lập tức.#!"

 imminent_strike_maa: "Đòn Đánh Cận Kề"
 imminent_strike_maa_flavor: "#F Đòn Đánh Cận Kề là phe chiến tranh của Children of Gaia, tìm cách hợp nhất tất cả Garou cho trận chiến cuối cùng.#!"

 herne: "Anh Em của Herne"
 herne_flavor: "#F Một lực lượng phản ứng nhanh gần như hoàn toàn gồm các Ahroun, sẵn sàng bảo vệ bất kỳ Caern nào của Fianna đang gặp nguy hiểm ngay khi được báo tin.#!"

 mjolnir: "Những Người Con của Mjolnir"
 mjolnir_flavor: "#F Bị xem là những kẻ điên khát máu ngay cả bởi phần còn lại của Get, những chiến binh tàn bạo này là một cảnh tượng đáng để chiêm ngưỡng.#!"

 predator_kings_maa: "Predator Kings"
 predator_kings_maa_flavor: "#F Predator Kings tin rằng thời của sự thỏa hiệp đã qua rồi và loài người phải bị tàn sát cho đến khi không còn ai sống sót. Họ là những kẻ hung hãn nhất trong số Red Talons.#!"

 bringers_light_maa: "Những Kẻ Mang Ánh Sáng"
 bringers_light_maa_flavor: "#F Nếu có một nhóm Shadow Lords nào nhận được sự tôn trọng gần như phổ quát, đó chính là Những Kẻ Mang Ánh Sáng. Những Shadow Lords này là những kẻ chuyên xử lý các thế lực tà ác, chẳng hạn như Black Spiral Dancers hay ma cà rồng.#!"

 hakken_samurai_maa: "Samurai"
 hakken_samurai_maa_flavor: "#F Người Hakken đã dành cả đời để mài giũa kỹ năng sử dụng lưỡi kiếm của mình. Danh dự buộc họ phải dùng nó cho mục đích tốt đẹp, chống lại tay sai của $glossary_wyrm$.#!"

 daggers_nut_maa: "Những Lưỡi Dao của Nut"
 daggers_nut_maa_flavor: "#F Những Lưỡi Dao của Nut quyết tâm phá vỡ sự kìm kẹp của hậu duệ Sutekh lên Ai Cập, và rộng hơn, sự kìm kẹp của ma cà rồng lên lãnh thổ của họ nói chung.#!"

 royal_guard_sf_maa: "Ngự Lâm Quân"
 royal_guard_sf_maa_flavor: "#F Là hoàng tộc của Garou Nation, những người cai trị Silver Fangs đích thực luôn được hộ tống bởi những chiến binh tinh nhuệ nhất của gia tộc mình.#!"

 heavenlysuccessors_maa: "Những Người Kế Vị Thiên Giới"
 heavenlysuccessors_maa_flavor: "#F Là hậu duệ của Zhong Kuei, Những Người Kế Vị Thiên Giới đã thề nguyện tiêu diệt ma cà rồng và các sinh vật khác đang rút rỉa linh hồn của Gaia#!"

 luperci_maa: "Luperci"
 luperci_maa_flavor: "#F Những Warder người Ý giàu có và quyền lực là chuyên gia trong việc đối phó với vô số ma cà rồng đang săn mồi trong đế chế thương mại đang lên của họ. Họ đã lấy tên mình đặt cho những Warder chuyên chiến đấu chống lại đám hậu duệ bị nguyền rủa của Caine.#!"




###Bastet

 tekhmet: "Tekhmet"
 tekhmet_flavor: "#F Những "Kẻ Bé Nhỏ" này đã sẵn sàng giải phóng Hung Tính của mình và thăng Cấp Bậc giữa đồng loại.#!"

 children_saraam: "Children of Saraam"
 children_saraam_flavor: "#F Mẹ của Bagheera tự hào khi thấy những đứa con kỷ luật nghiêm minh của mình bảo vệ di sản của bà.#!"

 warriors_ubastet: "Chiến Binh của Ubastet"
 warriors_ubastet_flavor: "#F Bubasti từng cai trị Ai Cập như những vị thần. Dù thời đại đó đã qua từ lâu, họ vẫn biết cách chiến đấu trên quê hương mình chẳng thua kém ai.#!"

 samhach_bane: "Tà Linh của Samhach"
 samhach_bane_flavor: "#F Ceilican sẽ không bao giờ quên kẻ suýt giết chết tất cả bọn họ. Kẻ ngu ngốc đó sẽ phải trả giá.#!"

 durga_chosen: "Những Kẻ Được Chọn của Durga"
 durga_chosen_flavor: "#F Seline, trong hóa thân Durga của mình, mỉm cười với những kẻ được chọn tinh anh của bà, những chiến binh vĩ đại và đáng kính nhất của Khan.#!"

 seline_pride: "Niềm Tự Hào của Seline"
 seline_pride_flavor: "#F Tự xưng là những kẻ được Mặt Trăng chọn, Simba là những chiến binh kiêu hãnh và tàn nhẫn. Lịch sử của họ cũng đem lại cho họ vinh dự đáng ngờ là biết cách chiến đấu chống lại những kẻ biến hình khác.#!"

 danaa_runners: "Những Người Chạy của Danaa"
 danaa_runners_flavor: "#F Nhiều kẻ xem thường Swara mảnh khảnh, nhưng tốc độ kinh ngạc của họ đã chứng tỏ là sự sụp đổ của không ít kẻ săn mồi tưởng chừng đáng gờm.#!"


###Mokole
 mokole_hatchlings: "Hatchlings"
 mokole_hatchlings_flavor: "#F Mokolé là một giống loài đang dần tuyệt diệt. Chính vì vậy, việc bảo vệ các thế hệ tương lai là điều tối quan trọng. Với mục đích này, những kẻ mang Cấp Bậc thấp nhất, Hatchlings, đã học cách phòng thủ trước hầu hết các cuộc đột kích, dù là của người hay của thú.#!"

 primal_saurians: "Primal Saurians"
 primal_saurians_flavor: "#F Dòng Đất hòa hợp nhất với bản năng nguyên thủy của họ. Tiếng gầm của Mokolé-mbembe gieo rắc nỗi sợ hãi khi chúng tìm cách báo thù cho đồng loại đã mất.#!"

 bronzescales: "Bronzescales"
 bronzescales_flavor: "#F Cát thô ráp, sần sùi và len lỏi vào khắp mọi nơi. Một nơi ẩn nấp hoàn hảo cho Gumagan, khi chúng trồi lên từ cát để giáng cái chết xuống những kẻ ngu ngốc dám thách thức chúng trong lãnh địa của mình.#!"

 hidden_fangs: "Nanh Vuốt Ẩn Giấu"
 hidden_fangs_flavor: "#F Rừng rậm và rừng cây ẩn chứa nhiều kẻ săn mồi đáng sợ. Thế nhưng ngay cả những kẻ săn mồi ấy cũng là con mồi của Makara đang rình rập chúng.#!"

 sleeping_dragons: "Những Con Rồng Say Ngủ"
 sleeping_dragons_flavor: "#F Truyền thuyết của người phàm đã có một điều đúng. Đừng bao giờ đánh thức một Con Rồng khỏi giấc ngủ, vì cơn thịnh nộ của nó sẽ vô cùng khủng khiếp.#!"

 army_aten: "Đội Quân của Aten"
 army_aten_flavor: "#F Nhóm chiến binh Mokolé này liên tục chuẩn bị để chiến đấu chống lại [Glossary('Kẻ Hủy Diệt', 'glossary_wyrm_tt')] và các thế lực bóng tối. Họ cũng tìm kiếm và tiêu diệt những $glossary_fera$ sa ngã trước khi Wyrm-Taint bén rễ.#!"

###Animals
 whitewolves: "Bạch Lang"
 whitewolves_flavor: "#F Được đồn đại là hình dạng tổ tiên, thuần khiết nhất của Silver Fangs, Bạch Lang xuất hiện trong thời khắc cần thiết để giúp đỡ Bộ Tộc.#!"

 royal_crocodiles: "Cá Sấu Hoàng Gia"
 royal_crocodiles_flavor: "#F Những con cá sấu uy nghi này đã trở nên mạnh mẽ và to lớn hơn hẳn những con khác nhờ sự bảo hộ của những người chăm sóc Mokolé.#!"



###Dinosaur Bygones
 archators: "Archators"
 archators_flavor: "#F Những con quái vật đồ sộ này là sự dung hợp giữa khủng long và hình dạng Archid. Chúng có nhiều đặc điểm chung với hình dạng Archid của Mokolé nhưng không có tính khí giống vậy, một sự khác biệt mà nhiều kẻ phải trải nghiệm mới nhận ra. Chúng phục vụ trung thành các bạn đồng hành Saurian của mình, miễn là sức mạnh của chúng được tôn trọng và bụng chúng được no đủ.#!"
 dipeltas: "Dipeltas"
 dipeltas_flavor: "#F Loài khủng long có những tấm xương lớn trên hộp sọ. Những tấm xương này cứng hơn cả thép truyền thống và giúp bảo vệ chúng khi chúng lao vào mục tiêu.#!"
 avithons: "Avithons"
 avithons_flavor: "#F Những cỗ máy kinh hoàng có cánh và lông vũ đang bay lượn. Loài khủng long này lượn trên bầu trời rồi bổ xuống con mồi với tốc độ và độ chính xác đáng kinh ngạc.#!"
 dicravenators: "Dicravenators"
 dicravenators_flavor: "#F Những con khủng long hai chân nhỏ bé này là nỗi ám ảnh của nhiều loài ăn cỏ. Sự nhanh nhẹn và hung tợn của chúng khi truy đuổi con mồi là vô song.#!"
 rhincanthuses: "Rhincanthuses"
 rhincanthuses_flavor: "#F Giống một con Tê Giác bò sát khổng lồ hơn là một loài khủng long, Rhincanthuses là những cỗ máy húc đồ sộ sẽ lao xuyên qua bất cứ thứ gì.#!"
 baroceratops: "Baroceratops"
 baroceratops_flavor: "#F Hộp sọ dày và lớp giáp tự nhiên của Baroceratops bảo vệ nó khi nó liều lĩnh phá vỡ các công sự.#!"
 dracomuses: "Dracomuses"
 dracomuses_flavor: "#F Những con quái vật giống rồng khổng lồ tự thiêu đốt mình khi chúng chém và thiêu cháy con mồi.#!"
 archeorexes: "Archeorexes"
 archeorexes_flavor: "#F Những kẻ săn mồi đỉnh cao trong giấc mơ kỷ Jura của Mokolé. Được tạo ra cho một mục đích duy nhất: Hủy Diệt.#!"
 dryptoraptors: "Dryptoraptors"
 dryptoraptors_flavor: "#F Những con khủng long hai chân nhỏ bé này không lớn hơn một con Mokolé trung bình. Tuy nhiên, số lượng của chúng mới là điều khiến chúng trở nên chết chóc.#!"




