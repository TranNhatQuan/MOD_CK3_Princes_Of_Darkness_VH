 POD_frontier_region_tax_collector: "Biên Cương Đế Quốc"
 POD_frontier_region_tax_collector_flavor_desc: "#flavor Một vùng đất được giao nhiệm vụ trở thành thành lũy vững chắc chống lại đám man rợ nơi biên ải của chúng ta.#!"
  
 POD_tightened_bureaucracy_tax_collector: "Bộ Máy Quan Liêu Siết Chặt"
 POD_tightened_bureaucracy_tax_collector_flavor_desc: "#flavor Với một đặc vụ tài giỏi dẫn dắt cuộc điều tra, chắc chắn ngươi có thể tìm ra vài "điều bất thường" cần được chỉnh đốn? #!"
 POD_tightened_bureaucracy_tax_collector_tt: "Người thu thuế của ngươi phải có quản trị cao hơn chư hầu bị đánh thuế."
 
 POD_core_region_tax_collector: "Vùng Lõi"
 POD_core_region_tax_collector_flavor_desc: "#flavor Được triều đình của ngươi trực tiếp giám sát, vùng lõi là trung tâm quyền lực nơi ảnh hưởng của ngươi được cảm nhận rõ nhất.#!"
 POD_core_region_tax_collector_tt: "Ngươi chỉ có thể có một vùng lõi."
  
 POD_mandate_of_hell_tax_collector: "Thiên Mệnh Địa Ngục"
 POD_mandate_of_hell_tax_collector_flavor_desc: "#flavor Ngươi là Tổ Tiên đang cai trị. Vì vậy, mọi thứ, từ binh lính đến vàng bạc, đều phải đổ về ngươi. Những kẻ cai trị nhỏ dưới quyền ngươi phải được nhắc nhở về điều đó.#!"

