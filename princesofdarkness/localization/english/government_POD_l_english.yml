 cell_government_filter_option: "$cell_government$"
 cell_government_filter_option_desc: "Chỉ hiển thị các nhân vật có [government|E] [GetGovernment( 'cell_government' ).GetName]"
 
 legacy_rights: "#BLOODRED Truyền Thống Thứ Nhất: Giao Ước#!"
 legacy_rights_none: "Không Được Bảo Hộ Tôn Giáo"
 legacy_rights_none_short: "#BLOODRED Cưỡng Chế#!"
 legacy_rights_none_desc: "#flavor “Máu ta biến ngươi thành dòng dõi ta, tạo nên theo hình ảnh ta. Lời nguyền của ta là của ngươi, và sự cứu rỗi của ta là của ngươi. Ta đứng trước và trên ngươi như một vị thần nhiếp chính. Ta là con đường, Truyền Thống của ta là giao ước của ta. Từ bỏ ta và từ bỏ mọi hy vọng.” Caine đã phán như vậy.#! \n\n[liege|E] có thể [demand_conversion|E] đối với [vassal|E]\n[liege|E] có thể dùng [convert_county|E] trên lãnh thổ của [vassals|E]."
 legacy_rights_protected: "Được Bảo Hộ Tôn Giáo"
 legacy_rights_protected_desc: "#flavor “Máu ta biến ngươi thành dòng dõi ta, tạo nên theo hình ảnh ta. Lời nguyền của ta là của ngươi, và sự cứu rỗi của ta là của ngươi. Ta đứng trước và trên ngươi như một vị thần nhiếp chính. Ta là con đường, Truyền Thống của ta là giao ước của ta. Từ bỏ ta và từ bỏ mọi hy vọng.” Caine đã phán như vậy.#! \n\n#emphasis #bold Đặc Quyền [vassal|E]:#!#!\n[liege|E] không thể [demand_conversion|E] đối với [vassal|E]\n[liege|E] không thể dùng [convert_county|E] trên lãnh thổ của [vassals|E]\n\n#flavor [vassal|E] được trao một quy chế bảo hộ đặc biệt, với vương quốc chính thức công nhận quyền thực hành [faith|E] riêng của họ.#!"
 legacy_rights_protected_short: "#BLOODRED Không Cưỡng Chế#!"

 #destruction_rights: "#BLOODRED The Fifth Tradition: The Destruction #!"
 #destruction_rights_none: "No Destruction Rights"
 #destruction_rights_none_desc: "“Forbidden art thou to spill the blood of another of thy kind who is elder. This right belongs only to the closest to me and none other. It is forbidden for those of weaker blood to rise against their elders. This is my final covenant.” Thus spoke Caine.\n\n#flavor The [vassal] is not allowed to destroy kindred in their domain. Only the [liege] may call a Blood Hunt.#!"
 #destruction_rights_none_short: "#BLOODRED None#!"
 #destruction_rights_allowed: "Destruction Allowed"
 #destruction_rights_allowed_desc: "“Forbidden art thou to spill the blood of another of thy kind who is elder. This right belongs only to the closest to me and none other. It is forbidden for those of weaker blood to rise against their elders. This is my final covenant.” Thus spoke Caine.\n\n#emphasis #bold The [liege] allows the [vassal] to enforce the Lextalionis and call a blood hunt in the [vassal]'s domain.#!#!"
 #destruction_rights_allowed_short: "#BLOODRED Allowed#!"
 #destruction_rights_open_war: "Open Warfare"
 #destruction_rights_open_war_desc: "“Forbidden art thou to spill the blood of another of thy kind who is elder. This right belongs only to the closest to me and none other. It is forbidden for those of weaker blood to rise against their elders. This is my final covenant.” Thus spoke Caine.\n\n#emphasis #bold [vassal|E] Privileges:#!#!\nThe [vassal|E] can declare [war|E] regardless of the [lieges|E] [crown_authority|E]\nThe [vassal|E] pays #high [EmptyScope.ScriptValue('war_declaration_rights_allowed_cost_reduction_tooltip')|0]%#! less for [casus_bellis|E] within the [realm|E]\n\n#flavor The [vassal] does not have to spend a [hook] if their [lieges] [crown_authority] prevents them from waging war. This special treatment also makes it easier for the [vassal] to declare wars inside the [realm|E], reducing the cost by #high [EmptyScope.ScriptValue('war_declaration_rights_allowed_cost_reduction_tooltip')|0]%#!.#!"
 #destruction_rights_open_war_short: "#BLOODRED Open War#!"
 
 progeny_rights: "#BLOODRED Truyền Thống Thứ Ba: Dòng Dõi #!"
 progeny_rights_none: "Không Có Quyền Sinh Dòng Dõi"
 progeny_rights_none_short: "#BLOODRED Không Có#!"
 progeny_rights_none_desc: "#flavor “Ngươi chỉ được [Glossary('Sire','game_concept_Sire_desc')] kẻ khác khi có sự cho phép và ban phước của trưởng lão ngươi. Sáng tạo là đặc quyền của những kẻ gần ta nhất, vì họ sẽ phải chịu trách nhiệm. Phá vỡ điều này, cả ngươi và dòng dõi ngươi đều sẽ bị giết.” Caine đã phán như vậy.#! \n\n#emphasis #bold [vassal] không có quyền sinh dòng dõi từ [liege] của họ. Ngay cả việc tạo ghoul cũng bị cấm.#!#!"
 progeny_rights_granted: "Toàn Quyền Sinh Dòng Dõi"
 progeny_rights_granted_short: "#BLOODRED Bất Kỳ#!"
 progeny_rights_granted_desc: "#flavor “Ngươi chỉ được [Glossary('Sire','game_concept_Sire_desc')] kẻ khác khi có sự cho phép và ban phước của trưởng lão ngươi. Sáng tạo là đặc quyền của những kẻ gần ta nhất, vì họ sẽ phải chịu trách nhiệm. Phá vỡ điều này, cả ngươi và dòng dõi ngươi đều sẽ bị giết.” Caine đã phán như vậy.#! \n\n#emphasis #bold [vassal] có toàn quyền sinh dòng dõi từ [liege] của họ. Điều này bao gồm cả childe ma cà rồng lẫn ghoul.#!#!"
 progeny_rights_ghouls: "Quyền Tạo Ghoul"
 progeny_rights_ghouls_short: "#BLOODRED Ghoul #!"
 progeny_rights_ghouls_desc: "#flavor “Ngươi chỉ được [Glossary('Sire','game_concept_Sire_desc')] kẻ khác khi có sự cho phép và ban phước của trưởng lão ngươi. Sáng tạo là đặc quyền của những kẻ gần ta nhất, vì họ sẽ phải chịu trách nhiệm. Phá vỡ điều này, cả ngươi và dòng dõi ngươi đều sẽ bị giết.” Caine đã phán như vậy.#! \n\n#emphasis #bold [vassal] đã được [liege] của họ trao quyền tạo ghoul, nhưng không được tạo childe ma cà rồng.#!#!"
 progeny_rights_childer: "Quyền Sinh Dòng Dõi Kindred"
 progeny_rights_childer_short: "#BLOODRED Kindred #!"
 progeny_rights_childer_desc: "#flavor “Ngươi chỉ được [Glossary('Sire','game_concept_Sire_desc')] kẻ khác khi có sự cho phép và ban phước của trưởng lão ngươi. Sáng tạo là đặc quyền của những kẻ gần ta nhất, vì họ sẽ phải chịu trách nhiệm. Phá vỡ điều này, cả ngươi và dòng dõi ngươi đều sẽ bị giết.” Caine đã phán như vậy"#! \n\n#emphasis #bold [vassal] đã được [liege] của họ trao quyền tạo childe ma cà rồng, nhưng không được tạo ghoul.#!#!"

 #blood_oaths: "#BLOODRED The Fourth Tradition: The Accounting#!"
 #blood_oaths_none: "No Blood Oaths Required"
 #blood_oaths_none_short: "#BLOODRED Free Will#!"
 #blood_oaths_none_desc: "“Those thou create are thine own blood until release from thy charge. Until that moment, their sins, their blood and their punishments are thine.” Thus spoke Caine.\n\n#emphasis #bold The [vassal] is not required to swear a blood oath to their [liege].#!#!"
 #blood_oaths_required: "Blood Oaths Required"
 #blood_oaths_required_short: "#BLOODRED Blood Oaths#!"
 #blood_oaths_required_desc: "“Those thou create are thine own blood until release from thy charge. Until that moment, their sins, their blood and their punishments are thine.” Thus spoke Caine.\n\n#emphasis #bold The [vassal] must swear a blood oath to their [liege] and consume a draught of their [liege]'s blood. This is a minor blood bond and a weak hook.#!#!"
 
 domain_revocation_rights: "#BLOODRED Truyền Thống Thứ Hai: Lãnh Địa #!"
 domain_revocation_rights_default: "Thu Hồi Lãnh Địa"
 domain_revocation_rights_default_short: "#BLOODRED Ý Chí Của Liege#!"
 domain_revocation_rights_default_desc: "[liege] có thể thu hồi một lãnh địa nếu luật của vương triều cho phép."
 domain_revocation_rights_protected: "Lãnh Địa Được Bảo Vệ"
 domain_revocation_rights_protected_desc: "#flavor “Vì ta là chủ nhân của Nod, lãnh địa của ngươi là mối quan tâm của riêng ngươi. Ngươi là chủ nhân của nó, và tất cả sẽ tôn trọng điều này hoặc chịu cơn thịnh nộ của ngươi. Tất cả sẽ trình diện khi bước vào, và ngươi sẽ bảo vệ họ khi đến lượt. Theo lẽ phải, ngươi được phép săn bắt trong ranh giới lãnh địa của ngươi, máu của nó là của riêng ngươi. Hãy chấp nhận trách nhiệm này, quản lý lãnh địa của ngươi, và đối xử với người khác bằng sự tôn trọng mà ngươi mong đợi.” Caine đã phán như vậy.#! \n\nĐặc Quyền [vassal|E]:#!#!\n[liege|E] không thể thu hồi [titles|E] của [vassals_possessive|E]\n\n#flavor [vassal] được đảm bảo quyền sở hữu [titles] của họ, ngăn [liege|E] thu hồi chúng – bất kể [liege|E] có [revoke_title_reason] hay không.#!"
 domain_revocation_rights_protected_short: "#BLOODRED Được Bảo Vệ#!"
 
 #masquerade_protocol: "#BLOODRED The Sixth Tradition: The Masquerade #!"
 #masquerade_protocol_none: "No Masquerade"
 #masquerade_protocol_none_desc: "#flavor The [liege] does not enforce the Silence of Blood in the [vassal]'s domain.#!"
 #masquerade_protocol_none_short: "#BLOODRED None#!"
 #masquerade_protocol_lax: "Lax Masquerade"
 #masquerade_protocol_lax_desc: "“Never shalt thou reveal thy true nature to those not of the blood. Doing so shall renounce thy claims to my covenants.” Thus spoke Caine.\n\n#emphasis #bold The [liege] only enforces the extreme violations of Silence of Blood in the [vassal]'s domain.#!#!"
 #masquerade_protocol_lax_short: "#BLOODRED Lax#!"
 #masquerade_protocol_strict: "Strict Masquerade"
 #masquerade_protocol_strict_desc: "“Never shalt thou reveal thy true nature to those not of the blood. Doing so shall renounce thy claims to my covenants.” Thus spoke Caine.\n\n#emphasis #bold The [liege] enforces a strict interpretation of Silence of Blood in the [vassal]'s domain.#!#!"
 #masquerade_protocol_strict_short: "#BLOODRED Strict#!" 
 
 #blood_tithe: "#BLOODRED Blood Tithe#!"
 #blood_tithe_none: "No $blood_tithe$"
 #blood_tithe_none_short: "#BLOODRED None#!"
 #blood_tithe_none_desc: "#emphasis #bold The [vassal] owes no blood tithe to their [liege].#!#!"
 #blood_tithe_required: "Kine Blood Tithe"
 #blood_tithe_required_short: "#BLOODRED Kine#!" 
 #blood_tithe_required_desc: "#emphasis #bold On demand, the [vassal] must supply one of the kine to the court of their [liege]. Typically, this means the death of the mortal.#!#!" 
 #blood_tithe_vampiric: "Vassal Vitae Blood Tithe"
 #blood_tithe_vampiric_short: "#BLOODRED Your Vitae#!"
 #blood_tithe_vampiric_desc: "#emphasis #bold On demand, the [vassal] must provide their own vampiric blood to their [liege]. This will increase the hunger of donor.#!#!"
 #blood_tithe_childer: "Childer Blood Tithe"
 #blood_tithe_childer_short: "#BLOODRED Your Childer#!"
 #blood_tithe_childer_desc: "#emphasis #bold On demand, the [vassal] must provide one of their childer to their [liege]. This often leads to the destruction of the childe.#!#!"

 primogen_rights: "#BLOODRED Vòng Trong #!"
 primogen_rights_none: "Không Có Ghế Vòng Trong"
 primogen_rights_none_desc: "#emphasis [vassal] không được trao bất kỳ đặc quyền khác thường nào khi nói đến [council] Vòng Trong.#!"
 primogen_rights_none_short: "#BLOODRED Không Có#!"
 primogen_rights_guaranteed: "Ghế Vòng Trong"
 primogen_rights_guaranteed_desc: "#emphasis #bold Đặc Quyền [vassal|E]:#!#!\n[interaction|E] #high $force_onto_council$#! có thể được sử dụng tùy ý\n\n#flavor [vassal] được trao đặc quyền [council] Vòng Trong đặc biệt, và sẽ mong đợi một ghế thường trực trong [council]. Trao đặc quyền này cho quá nhiều [vassals] cuối cùng sẽ khiến [powerful_vassals] của [realm|E] bất mãn.#!"
 primogen_rights_guaranteed_short: "#BLOODRED Được Đảm Bảo#!"
 
 type_of_courts: "Loại Triều Đình"
 type_of_courts_political: "Triều Đình Chính Trị"
 type_of_courts_political_desc: "#flavor Triều đình chính trị, cho đến nay, là loại phổ biến nhất. Chúng nhóm họp để giám sát lợi ích của [GetTrait('kueijin').GetName( GetNullCharacter )] và người phàm tại một khu vực địa lý cụ thể như thị trấn hoặc thành phố. Các thành phố lớn có thể có nhiều triều đình chính trị, mỗi triều đình có lãnh thổ và truyền thống riêng cùng một tập hợp vấn đề riêng biệt để thử thách khắc nghiệt vị tổ tiên của thành phố đó.#!"
 type_of_courts_social: "Triều Đình Xã Hội"
 type_of_courts_social_desc: "#flavor Triều đình xã hội ít phổ biến hơn so với các triều đình chính trị và tọa lạc tại những nơi khác thường nhất. Chúng hình thành xung quanh các mục tiêu xã hội (như bảo vệ và duy trì một Dragon Nest), các lĩnh vực học thuật và thậm chí cả những mối quan tâm mang tính khu vực.#!"
 type_of_courts_political_short: "Chính Trị"
 type_of_courts_social_short: "Xã Hội"

 fera_tribe_government: "Bộ Tộc Fera"
 fera_tribe_government_with_icon: "@fera_icon! $fera_tribe_government$"
 fera_tribe_government_adjective: "Bộ Tộc"
 fera_tribe_government_realm: "Bộ Tộc Fera"
 fera_tribe_government_vassals_label: "[obligations|E] Bộ Tộc dựa trên [opinion|E]"
 fera_tribe_government_desc: "Bộ tộc là đơn vị xã hội lớn nhất của $glossary_fera$. Thành viên bộ tộc thường gắn kết bởi huyết thống, totem hoặc Patron tương tự, và lối sống.\nCác Changing Breed khác nhau tự tổ chức khác nhau trong cách phân loại rộng này nhưng tất cả đều chia sẻ sự nhấn mạnh vào việc cùng chung các mối liên kết xã hội và tâm linh."
 fera_tribe_government_filter_option: "$fera_tribe_government$"
 fera_tribe_government_filter_option_desc: "Chỉ hiển thị các nhân vật có [government|E] [GetGovernment( 'fera_tribe_government' ).GetName]"

 dark_kingdom_government: "Vương Quốc Bóng Tối"
 dark_kingdom_government_with_icon: "@wraith_icon! $dark_kingdom_government$"
 dark_kingdom_government_adjective: "Vương Quốc Bóng Tối"
 dark_kingdom_government_realm: "Vương Quốc Bóng Tối"
 dark_kingdom_government_vassals_label: "[obligations|E] [Glossary('Dark Kingdom','game_concept_dark_kingdom_desc')] dựa trên [vassal_contract|E] của mỗi [vassal|E]"
 dark_kingdom_government_desc: "Vương Quốc Bóng Tối là những vùng thực tại ổn định bên trong [UmbraGlossary('tempest')] của [UmbraGlossaryLocalized('shadowlands','Âm Phủ')]. Mỗi vương quốc trong số này tuyên bố quyền cai trị các Wraith của một khu vực địa lý cụ thể."
 dark_kingdom_government_filter_option: "$dark_kingdom_government$"
 dark_kingdom_government_filter_option_desc: "Chỉ hiển thị các nhân vật có [government|E] [GetGovernment( 'dark_kingdom_government' ).GetName]"

 infernal_court_government: "Triều Đình Địa Ngục"
 infernal_court_government_with_icon: "@demon_icon! $infernal_court_government$"
 infernal_court_government_adjective: "Triều Đình Địa Ngục"
 infernal_court_government_realm: "Triều Đình Địa Ngục"
 infernal_court_government_vassals_label: "[obligations|E] Triều Đình Địa Ngục dựa trên [vassal_contract|E] của mỗi [vassal|E]"
 infernal_court_government_desc: "Những Demon đã trở về từ Abyss thường tự tổ chức thành các Triều Đình, tàn tích còn sót lại từ Kỷ Nguyên Thịnh Nộ, khi những Kẻ Sa Ngã cai trị các Bastion của riêng mình trong cuộc chiến chống lại Thiên Đường."
 infernal_court_government_filter_option: "$infernal_court_government$"
 infernal_court_government_filter_option_desc: "Chỉ hiển thị các nhân vật có [government|E] [GetGovernment( 'infernal_court_government' ).GetName]"

 household_government: "Gia Hộ"
 household_government_with_icon: "@changeling_icon! $household_government$"
 household_government_adjective: "Gia Hộ"
 household_government_realm: "Gia Hộ"
 household_government_vassals_label: "[obligations|E] Gia Hộ dựa trên [vassal_contract|E] của mỗi [vassal|E]"
 household_government_desc: "Một Gia Hộ là một nhóm Changeling gắn bó với một freehold, phục vụ người cai trị địa phương với tư cách chư hầu hoặc thuộc hạ."
 household_government_filter_option: "$household_government$"
 household_government_filter_option_desc: "Chỉ hiển thị các nhân vật có [government|E] [GetGovernment( 'household_government' ).GetName]"
 
 legion_religion_modifier: "[religion|E] Legion mang lại thưởng giảm [stress|E]."
 guild_religion_modifier: "[religion|E] Guild mang lại thưởng [experience|E] [lifestyle|E] Arcanoi."
 yellow_springs_religion_modifier: "[religion|E] Yellow Springs mang lại quyền truy cập [lifestyle|E] [jade_arcanoi_lifestyle|E]."
 
 vampire_antagonistic: "Đối Nghịch (Ma Cà Rồng)"
 vampire_antagonistic_desc: "Không gì kích động con người bằng sự ganh đua hoặc ghen tị. Tốt hơn hết bạn nên coi chừng sau lưng trong gia tộc này, nếu không bạn có thể thấy ai đó cố gắng đâm dao vào đó."
 vampire_competitive: "Cạnh Tranh (Ma Cà Rồng)"
 vampire_competitive_desc: "Sự cạnh tranh trong gia đình có thể là một điều lành mạnh. Nó thúc đẩy các thành viên trong gia tộc này vượt trội hơn nhau, dù là trên chiến trường, hay trong nỗ lực giành lấy ngai vàng..."
 vampire_impassive: "Thờ Ơ (Ma Cà Rồng)"
 vampire_impassive_desc: "Tại sao phải tốn thời gian và công sức quan tâm phần còn lại của gia đình đang làm gì? Các thành viên gia tộc này có xu hướng chủ yếu lo cho bản thân mình trước tiên."
 vampire_friendly: "Thân Thiện (Ma Cà Rồng)"
 vampire_friendly_desc: "Họ có thể đôi khi không nhìn cùng một hướng, nhưng các thành viên của gia tộc này luôn giữ quan hệ thân thiện."
 vampire_harmonious: "Hài Hòa (Ma Cà Rồng)"
 vampire_harmonious_desc: "Một gia tộc hoàn toàn hài hòa. Các thành viên gia tộc này làm mọi cách để đoàn kết và luôn hỗ trợ lẫn nhau."
 
 vampire_tax_slot: "Ảnh Hưởng Chư Hầu"
 
 #blood_tithe_required_tax_collector: "Blood Tithe"
 #blood_tithe_required_tax_collector_desc: "#emphasis #bold On demand, the [vassal] must supply one of the kine to the court of their [liege]. Typically, this means the death of the mortal.#!#!" 
 #blood_tithe_required_tax_collector_flavor_desc: "#flavor The lord of the domain asks for blood, and he shall receive his due.#!" 
 #
 #progeny_rights_tax_collector: "Progeny Rights"
 #progeny_rights_tax_collector_flavor_desc: "#emphasis #bold “Thou shalt only [Glossary('Sire','game_concept_Sire_desc')] another with the permission and blessing of thine elder. To create is the providence of those closest to me, for they shall be accountable. Break this, and both thee and thy progeny shall be slain.” Thus spoke Caine.#!" 
 #progeny_rights_tax_collector_desc: "#flavor \n\n#emphasis #bold The [vassal] has no rights to create progeny by their [liege]. Even the creation of ghouls is forbidden.#!#!" 
 # 
 legacy_rights_protected_tax_collector: "Quyền Truyền Thống"
 legacy_rights_protected_tax_collector_desc: "#emphasis #bold [liege|E] không thể [demand_conversion|E] đối với [vassal|E]\n[liege|E] không thể dùng [convert_county|E] trên lãnh thổ của [vassals|E].#!#!"
 legacy_rights_protected_tax_collector_flavor_desc: "#flavor  “Máu ta biến ngươi thành dòng dõi ta, tạo nên theo hình ảnh ta. Lời nguyền của ta là của ngươi, và sự cứu rỗi của ta là của ngươi. Ta đứng trước và trên ngươi như một vị thần nhiếp chính. Ta là con đường, Truyền Thống của ta là giao ước của ta. Từ bỏ ta và từ bỏ mọi hy vọng.” Caine đã phán như vậy.#!"
 
 domain_revocation_rights_protected_tax_collector: "Quyền Lãnh Địa"
 domain_revocation_rights_protected_tax_collector_desc: "#emphasis #bold [liege|E] không thể thu hồi [titles|E] của [vassals_possessive|E]\n\n [vassal] được đảm bảo quyền sở hữu [titles] của họ, ngăn [liege|E] thu hồi chúng – bất kể [liege|E] có [revoke_title_reason] hay không.#!#!"
 domain_revocation_rights_protected_tax_collector_flavor_desc: "#flavor  “Vì ta là chủ nhân của Nod, lãnh địa của ngươi là mối quan tâm của riêng ngươi. Ngươi là chủ nhân của nó, và tất cả sẽ tôn trọng điều này hoặc chịu cơn thịnh nộ của ngươi. Tất cả sẽ trình diện khi bước vào, và ngươi sẽ bảo vệ họ khi đến lượt. Theo lẽ phải, ngươi được phép săn bắt trong ranh giới lãnh địa của ngươi, máu của nó là của riêng ngươi. Hãy chấp nhận trách nhiệm này, quản lý lãnh địa của ngươi, và đối xử với người khác bằng sự tôn trọng mà ngươi mong đợi.” Caine đã phán như vậy.#!"
 
 guaranteed_council_tax_collector: "Vị Trí Trong Hội Đồng"
 guaranteed_council_tax_collector_desc: "#emphasis #bold Chư hầu này luôn có thể ép buộc gia nhập hội đồng của liege của họ. #!#!"
 guaranteed_council_tax_collector_flavor_desc: "#flavor  Một ghế tại bàn hội đồng danh giá của một liege quyền lực là một vinh dự mà một số người nghĩ rằng họ xứng đáng được hưởng.#!"
 
 POD_strict_taxation_tax_collector: "Thuế Khóa Hà Khắc"
 POD_strict_taxation_tax_collector_flavor_desc: "#flavor Bạn muốn vàng. Họ có vàng. Một sự kết hợp trời định.#!"
 
 POD_tributary_tax_collector: "Chư Hầu Triều Cống"
 POD_tributary_tax_collector_desc: "#emphasis #bold [liege|E] không thể thu hồi [titles|E] của [vassals_possessive|E]\n\n[vassal] được đảm bảo quyền sở hữu [titles] của họ, ngăn [liege|E] thu hồi chúng – bất kể [liege|E] có [revoke_title_reason] hay không. [liege|E] không thể [demand_conversion|E] đối với [vassal|E]\n[liege|E] không thể dùng [convert_county|E] trên lãnh thổ của [vassals|E].#!#!"
 POD_tributary_tax_collector_flavor_desc: "#flavor Chư hầu này hầu như không thừa nhận quyền cai trị của bạn. Sự kiểm soát của bạn với lãnh thổ của họ mong manh nhất có thể.#!"
 
 POD_hard_control_tax_collector: "Kiểm Soát Tuyệt Đối"
 POD_hard_control_tax_collector_desc: "#emphasis #bold Chư hầu không thể tuyên chiến bất kỳ cuộc chiến nào nếu không có hook trên liege của họ.#!#!"
 POD_hard_control_tax_collector_flavor_desc: "#flavor Họ sẽ trả tiền. Họ sẽ cung cấp quân đội. Họ sẽ vâng lời. Họ không có lựa chọn nào khác.#!"
  
 #vampire_tax_collector_court_position: "Satrap"
 #vampire_tax_collector_court_position_desc: "The satrap is tasked by the central authority to keep the loyalty of the domains swearing fealty to a more powerful vampire. They are, for all intents and purposes, the hand of the Prince when dealing with subordinates.\nSatraps as a concept were invented by Mithras mixing his Persian heritage with English feudalism. The term has then spread far and wide to represent agents of powerful vampires dealing with their vassals."
  
 rose_treaty: "Hiệp Ước Hoa Hồng"
 rose_treaty_granted_desc: "#emphasis #bold Đặc Quyền [vassal|E]:#!#!\n[liege|E] không thể [demand_conversion|E] đối với [vassal|E]\n[liege|E] không thể dùng [convert_county|E] trên lãnh thổ của [vassals|E]\n\n #flavor Được ký kết năm 1215, Hiệp Ước Hoa Hồng đã trao cho Mithras một đế chế thống nhất để cai trị, và cho các thần dân của ông một khuôn khổ để hoạt động. Đây là một trong những hệ thống quản trị ma cà rồng đầu tiên dựa vào chế độ phong kiến để quản lý một vương quốc.#!"
 rose_treaty_granted: "Đã Chấp Nhận Hiệp Ước Hoa Hồng"
 rose_treaty_granted_short: "Đã Chấp Nhận"
 rose_treaty_none: "Đã Từ Chối Hiệp Ước Hoa Hồng"
 rose_treaty_none_short: "Đã Từ Chối"

 roaming_court: "Triều Đình Du Mục"
 roaming_court_granted_desc: "#flavor Được Hardestadt tiên phong như một cách để luôn để mắt tới chư hầu của mình (và khiến họ sợ hãi trước khả năng ông xuất hiện bất cứ lúc nào), triều đình du mục của giới Cainite Đức đã trở thành một nét đặc trưng của vùng đất này.#!"
 roaming_court_granted: "Triều Đình Du Mục Áp Bức"
 roaming_court_granted_short: "Áp Bức"
 roaming_court_none: "Triều Đình Du Mục Ôn Hòa"
 roaming_court_none_short: "Ôn Hòa"

 #roaming_court_tax_collector: "Roaming Court"
 #roaming_court_tax_collector_flavor_desc: "#flavor Pioneered by Hardestadt as a mean of always keeping an eye on his vassals (and making them fear his potential arrival at a moment notice), the roaming court of the German Cainites has become a staple of this region.#!"
 
 #ravnos_war_machine_tax_collector: "Eternal Warrior"
 #ravnos_war_machine_tax_collector_flavor_desc: "#flavor The Eternal War for India requires soldiers, not merchants. You are on the frontlines, or you are out.#!"

 ravnos_war_machine: "Kshatriya Ravnos"
 ravnos_war_machine_granted_desc: "#flavor Cuộc Chiến Vĩnh Cửu vì Ấn Độ cần binh lính, không cần thương nhân. Ngươi ở tiền tuyến, hoặc ngươi bị loại.#!"
 ravnos_war_machine_granted: "Sẵn Sàng Chiến Đấu"
 ravnos_war_machine_granted_short: "Đã Sẵn Sàng"
 ravnos_war_machine_none: "Nghỉ Ngơi"
 ravnos_war_machine_none_short: "Đã Nghỉ"
  
 #free_state_tax_collector: "Free State"
 #free_state_tax_collector_flavor_desc: "#flavor You are no tyrant. Let your comrades rule their land as they wish and spread the revolt on their own.#!"
 #free_state_tax_collector_desc: "#emphasis #bold The [vassal|E] pays less [piety|E] to use [holy_war|E] [casus_bellis|E].\nThe vassal is more likely to start wars.\n\nThe [vassal] is guaranteed ownership of their [titles], preventing the [liege|E] from revoking them – regardless of the [liege|E] having a [revoke_title_reason] or not.#!#!"
 #need_anarch_vassal_tt: "The vassal must be from the Via Furores, the Via Liberatio or the Free Anarch faith."
 
 free_state: "Tự Do Bang"
 free_state_granted_desc: "#emphasis #bold [vassal|E] trả ít [piety|E] hơn để dùng [holy_war|E] [casus_bellis|E].\nChư hầu có nhiều khả năng khởi chiến hơn.\n\n[vassal] được đảm bảo quyền sở hữu [titles] của mình, ngăn không cho [liege|E] tước đoạt chúng – bất kể [liege|E] có [revoke_title_reason] hay không.#!#! \n\n#flavor Ngươi không phải bạo chúa. Hãy để đồng minh của ngươi cai trị đất đai của họ theo ý muốn và tự mình lan tỏa cuộc nổi dậy.#!"
 free_state_granted: "Tự Do Bang"
 free_state_granted_short: "Tự Do"
 free_state_none: "Bang Bị Xiềng Xích"
 free_state_none_short: "Bị Xiềng Xích"
  
 #cult_tax_collector: "Cult Influence"
 #cult_tax_collector_flavor_desc: "#flavor True believers can rely on your lenience as a fellow practitioner. Or at least they expect to.#!"
 #cult_tax_collector_desc: "#emphasis #bold The [vassal] is guaranteed ownership of their [titles], preventing the [liege|E] from revoking them – regardless of the [liege|E] having a [revoke_title_reason] or not.#!#!"
 #vassal_should_same_faith_tt: "The vassal must be of the same faith as you."

 cult_contract: "Giáo Phái"
 cult_contract_granted_desc: "#emphasis #bold [vassal] được đảm bảo quyền sở hữu [titles] của mình, ngăn không cho [liege|E] tước đoạt chúng – bất kể [liege|E] có [revoke_title_reason] hay không.#!#! \n\n#flavor Những tín đồ chân chính có thể trông cậy vào sự khoan dung của ngươi như một người đồng đạo. Hoặc ít nhất họ mong đợi vậy.#!"
 cult_contract_granted: "Bang Giáo Phái"
 cult_contract_granted_short: "Giáo Phái"
