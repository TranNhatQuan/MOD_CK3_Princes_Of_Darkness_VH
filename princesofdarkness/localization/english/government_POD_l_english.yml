 cult_government_vassals_label: "[obligations|E] của Giáo Phái Xác Ướp dựa trên [piety_level|E] của [liege|E]"
 cult_government_desc: "Từ thời cổ đại, những Kẻ Tái Sinh đã chỉ huy các nhóm người phàm tận tụy phục vụ họ. Ngay cả trong những giai đoạn ngủ dài, các tổ chức này vẫn tiếp tục tồn tại, truyền lại bí mật và trách nhiệm cho thế hệ kế tiếp và canh giữ lăng mộ của chủ nhân họ."
 cult_government_filter_option: "$cult_government$"
 cult_government_filter_option_desc: "Chỉ hiển thị các nhân vật có [government|E] [GetGovernment( 'cult_government' ).GetName]"

