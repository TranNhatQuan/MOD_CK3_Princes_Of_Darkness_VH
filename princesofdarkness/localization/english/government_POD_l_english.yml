 #tzimisce_hospitality_tax_collector_desc: "#emphasis #bold Vassals can't declare any wars without a hook on their liege.#!#!"

 tzimisce_hospitality: "Hiếu Khách Tzimisce"
 tzimisce_hospitality_granted_desc: "#emphasis #bold Chư hầu không thể tuyên chiến nếu không có hook đối với lãnh chúa của họ.#!#! \n\n #flavor Ngươi đang để họ sống. Họ nên biết ơn.#!"
