 english_victory_objective_decision: "Ách Thống Trị của Anh"
 english_victory_objective_decision_tooltip: "Nước Pháp đã đủ suy yếu để mở đường cho những chủ nhân mới."
 english_victory_objective_decision_desc: "Người phàm Anh có ý tưởng đúng đắn. Nước Pháp và nước Anh phải được thống nhất, tất nhiên là dưới sự cai trị đúng đắn của người Anh."
 english_victory_objective_decision_confirm: "Một liên minh vĩnh cửu đã ra đời!"
 english_victory_objective_decision_effect_tooltip: "Xung Đột sẽ kết thúc. Các thành phố [GetTitleByKey('b_rethel').GetNameNoTier], [GetTitleByKey('b_lyon').GetNameNoTier], [GetTitleByKey('b_bordeaux').GetNameNoTier], [GetTitleByKey('b_blois').GetNameNoTier] và [GetTitleByKey('b_poitiers').GetNameNoTier] sẽ nhận được một công trình đặc biệt mới. Ngươi sẽ tiếm đoạt Đế Quốc [GetTitleByKey('e_love').GetNameNoTier] nếu ngươi chưa sở hữu nó. Nhiều nhân vật ở Francia sẽ cải sang tôn giáo của ngươi." 
   
 pod_french_struggle.105.t: "Ách Thống Trị của Anh"
 pod_french_struggle.105.desc: "Số phận của nước Pháp và nước Anh đã gắn liền với nhau từ năm 1066. Đối với ma cà rồng, đó là thời điểm mà một nhóm ba Cainite người Norman đã tiếm quyền cai trị từ Cult of Mithras ở nước Anh. Nhưng chiến thắng của họ chỉ tồn tại trong thời gian ngắn khi Mithras, sau khi trở về từ Miên Trạng, đã nhanh chóng giành lại quyền kiểm soát lãnh địa của mình.\nKể từ đó, nước Anh đã lan rộng ảnh hưởng của mình khắp nước Pháp, lợi dụng sự hỗn loạn do cuộc lưu đày của Alexander gây ra để trước tiên chiếm một số lãnh thổ và, quan trọng hơn, một số ảnh hưởng đối với người dân địa phương. Từ từ nhưng chắc chắn, các Cainite từ quần đảo đã dần củng cố ngày càng nhiều quyền lực trong khu vực và, theo gương người phàm của họ, giờ đây tuyên bố quyền thống trị đối với một Đế Quốc 'Angevin' đích thực."
 pod_french_struggle.105.a: "Từ York đến Marseilles."
 pod_french_struggle.105.custom: "Những người cai trị liên quan không cuồng tín sẽ cải sang tín ngưỡng của ngươi."  
 e_love_mithras: "Courts of Avalon"
 e_love_english: "Đế Quốc Angevin"
 
 german_victory_objective_decision: "Ách Thống Trị của Đức"
 german_victory_objective_decision_desc: "Nước Đức và nước Pháp có một lịch sử lâu dài cùng nhau, bắt nguồn từ Charlemagne đối với người phàm, và Eirik Eigermann đối với ma cà rồng. Chúng ta phải dùng quá khứ này để thống nhất khu vực."
 german_victory_objective_decision_confirm: "Một chiến thắng của người Karling!"
     
 pod_french_struggle.106.t: "Ách Thống Trị của Đức"
 pod_french_struggle.106.desc: "Trong thế giới người phàm, nước Đức và nước Pháp từng là một dưới sự cai trị của Charlemagne. Nhiều Cainite đã cố gắng tái hiện lại chiến công này, từ Eirik Eigermann người Saxon cho đến chính vị chủ nhân bất tử của Charlemagne, Alexander. Không ai thành công hoàn toàn, dù hai nước có mối quan hệ gắn bó chặt chẽ.\nTuy nhiên, cuộc lưu đày cưỡng bức của Alexander đã mở ra những cơ hội mới cho các Cainite Đức, những người vào thời điểm đó đã là một lực lượng mạnh mẽ và thống nhất dưới những Ventrue danh giá như Hardestadt hay Julia Antasia. Kể từ đó, ảnh hưởng của Đức trong chính trị ma cà rồng Pháp chỉ ngày càng lớn mạnh đến mức nhiều người dự đoán rằng tương lai của hai quốc gia này đã được định sẵn. Những người thừa kế của người Frank và người Saxon sẽ một lần nữa cùng nhau hướng tới một mục tiêu chung."
 pod_french_struggle.106.a: "Từ Magdeburg đến Brest."
 e_love_eternal: "Gallia"
 e_love_fiefs: "Fiefs of the Rose"

 pod_french_struggle.1000.t: "Vật Lộn với Inquisition"
 pod_french_struggle.1000.desc: "Inquisition đáng sợ về cơ bản đã ra đời ở nước Pháp trong bóng tối của cuộc Thập Tự Chinh Albigensian. Các đặc vụ của họ rình rập trên đường phố vào ban đêm, sử dụng tài năng thánh thiện của mình để khiến cho cuộc sống-không-chết của ma cà rồng trở nên khó khăn hơn nhiều. Đáng buồn thay, họ hiện diện đặc biệt đông đảo ở một trong những khu vực dưới quyền kiểm soát của ngươi gần đây, khiến ngươi không còn lựa chọn nào khác ngoài việc chịu đựng cơn bão, hoặc tìm cách đối phó với họ theo cách nào đó."
 pod_french_struggle.1000.a: "Cứ chờ đợi thôi."
 pod_french_struggle.1000.b: "Thuê một số đặc vụ để đánh lạc hướng họ."
 pod_french_struggle.1000.c: "Điều hướng họ tới đối thủ của ngươi!"
 pod_french_struggle.1000.d: "Ta đã chán ngấy bọn chúng rồi, giết sạch chúng!"

 pod_french_struggle.1001.t: "Từ Constantinople đến Lyon"
 pod_french_struggle.1001.desc: "Hoàng thân Lyon từng quyền lực, Francois d'Alencourt, đã chứng kiến vận may của mình suy tàn khi Inquisition xuất hiện. Tuy nhiên, ông vẫn là một thế lực rất được kính trọng ở nước Pháp, và phong thái danh dự của ông không ai sánh bằng.\nĐêm nay, ông đến triều đình của ngươi với một đề nghị. Một đoàn người tị nạn từ Đế Chế Byzantine đang sụp đổ đã tìm đường tới lãnh địa của ông, tìm kiếm một nơi mới để trú ngụ. Trong khi d'Alencourt đã giúp đỡ những người ông có thể giúp, Lyon đã trở nên quá nguy hiểm khi Inquisition hoành hành khắp khu vực. Vì vậy, ông đến gặp ngươi với một yêu cầu chính thức là tìm cho những người tị nạn này một nơi trú ngụ trong lãnh địa của ngươi, đồng thời bảo vệ và tiếp đón họ tốt nhất có thể. Danh dự chỉ ra rằng không gì kém hơn việc giúp đỡ người khốn khó, xét cho cùng."
 pod_french_struggle.1001.a: "Một chính nghĩa. Và một ân huệ thú vị."
 pod_french_struggle.1001.b: "Ta sẽ không mắc bẫy những trò chính trị này!"

 pod_french_struggle.1002.t: "Trò Chơi Chết Người"
 pod_french_struggle.1002.desc: "Isouda de Blaise là một trong những Nữ Vương của Courts of Love có ảnh hưởng nhất và chắc chắn là người đáng sợ nhất. Ẩn sau lớp vỏ mỏng manh của vẻ duyên dáng và xinh đẹp là một tâm trí hoàn toàn loạn trí, bày ra những trò chơi xã hội xoắn xuýt nhất để chơi tại triều đình của bà.\nGần đây ngươi đã nhận được lời mời tham dự một buổi tụ họp như vậy. Isouda chắc chắn sẽ coi đó là chuyện cá nhân nếu ngươi từ chối, nhưng liệu ngươi có sẵn sàng chịu đựng những điều tồi tệ nhất mà 'Đóa Hồng Sói' có thể ném vào ngươi không?"
 pod_french_struggle.1002.a: "Điều tồi tệ nhất có thể xảy ra là gì chứ?"
 pod_french_struggle.1002.b: "Ta có một cuộc hẹn quan trọng vào ngày đó!"
 pod_french_struggle.1002.c: "Phương pháp tra tấn mới ư? Tuyệt vời!"

 pod_french_struggle.1003.t: "Trò Tiêu Khiển Tốn Kém"
 pod_french_struggle.1003.desc: "Nữ Vương trẻ nhất của Courts of Love, Helene cai trị vùng Champagne rất giàu có. Bề ngoài trông có vẻ như một thiếu nữ hơi ngây thơ và bốc đồng, nhưng Helene đã chứng minh khá thường xuyên rằng sự hòa đồng của bà phần lớn chỉ là lớp vỏ bọc.\nChampagne sắp tổ chức các hội chợ lớn của Pháp, có lẽ là sự kiện thương mại quan trọng nhất ở Tây Âu. Nhiều ma cà rồng hiện đang cố gắng giành lấy một phần lợi ích và, có lẽ không phải ngẫu nhiên, Helene đã mời nhiều người trong số họ (kể cả ngươi) đến một bữa tiệc xa hoa trong cùng khoảng thời gian đó, có khả năng là để đảm bảo rằng ngươi không can thiệp vào kế hoạch của bà cho sự kiện này."
 pod_french_struggle.1003.a: "Danh dự đáng giá hơn vàng."
 pod_french_struggle.1003.b: "Nghĩ lại thì..."
 pod_french_struggle.1003.c: "Một bữa tiệc ư? Ta có rất nhiều ý tưởng muốn thử!"

 pod_french_struggle.1004.t: "Vua của Tình Yêu"
 pod_french_struggle.1004.desc: "Vị Vua of Love duy nhất được các Courts công nhận là Etienne, hoàng thân của vùng Poitou. Là một người kín đáo, ông từng bị đánh giá thấp như một người cai trị yếu đuối cho đến gần đây, khi động thái táo bạo của ông chống lại Esclarmonde cùng việc ông xích lại gần với Mithras và nước Anh đột nhiên cho thấy một đầu óc chính trị nguy hiểm hơn nhiều so với dự đoán ban đầu.\nNgươi đã nhận được yêu cầu gặp mặt ông vì một mục đích không được tiết lộ. Đây có khả năng sẽ là một nước cờ chính trị đáng kể nếu ngươi chấp nhận, vì Etienne chắc chắn có một kế hoạch nào đó đang ấp ủ chống lại một đối thủ khác."
 pod_french_struggle.1004.a: "Ai là mục tiêu?"
 pod_french_struggle.1004.b: "Hắn quá nguy hiểm để tin tưởng."
 pod_french_struggle.1004.c: "Ta có thể cải thiện kế hoạch của hắn..."

 pod_french_struggle.1005.t: "Vị Vua Chuẩn Bị Kém"
 pod_french_struggle.1005.desc: "Geoffrey du Temple là một trong những kẻ chủ mưu chính đứng sau cuộc lưu đày của Alexander ([Glossary('Sire','game_concept_Sire_desc')] của chính ông ta). Đáng buồn thay cho ông ta, kể từ đó, ông ta ngày càng bị gạt ra ngoài lề bởi những kẻ chơi chính trị điêu luyện hơn ông ta nhiều, như chính Salianna.\nCảm nhận được sự yếu đuối của mình, Geoffrey đang tìm kiếm bất kỳ đồng minh nào sẵn sàng giúp đỡ chính nghĩa của ông ta. Liên kết bản thân với ông ta sẽ tốn kém nhưng ông ta vẫn là Hoàng Thân của Paris, một vị trí đòi hỏi sự tôn trọng và sẽ đóng vai trò then chốt trong việc thống nhất nước Pháp vào một thời điểm nào đó."
 pod_french_struggle.1005.a: "Cho ông ta một ít sự giúp đỡ."
 pod_french_struggle.1005.b: "Cho ông ta một ít sự giúp đỡ tượng trưng, vô dụng."
 pod_french_struggle.1005.c: "Cho ông ta một sự giúp đỡ chuẩn bị kỹ lưỡng và toàn diện."

 pod_french_struggle.1006.t: "Sự Giàu Có của Aquitaine"
 pod_french_struggle.1006.desc: "Bordeaux là một trong những thành phố thịnh vượng nhất nước Pháp. Trớ trêu thay, điều này phần lớn là do nó là thành phố Pháp quan trọng nhất do người phàm Anh (và thường cả ma cà rồng) nắm giữ trong một thời gian dài. Điều này đã biến nó thành trung tâm thương mại cho bất kỳ thương nhân Anh nào đáng giá.\nHoàng Thân của Bordeaux là Gerard, một chư hầu trung thành của Mithras và một nhà quản lý có năng lực. Tuy nhiên, ông hoàn toàn choáng ngợp trước những lợi ích cạnh tranh trong thành phố và sự hiện diện ngày càng tăng của Inquisition trong khu vực, trong khi lại nhận được ít hoặc không có sự giúp đỡ nào từ nước Anh. Sự rối loạn như vậy có thể là một cơ hội để 'giải phóng' một số của cải giàu có của Bordeaux cho mục đích sử dụng của riêng ngươi..."
 pod_french_struggle.1006.a: "Ta sẽ tôn trọng Hoàng Thân Quốc của Gerard"
 pod_french_struggle.1006.b: "Vàng miễn phí nằm đó thật sự."
 pod_french_struggle.1006.c: "Thêm vàng nữa!"

 pod_french_struggle.1007.t: "Nữ Vương của Occitania"
 pod_french_struggle.1007.desc: "Esclarmonde quyền lực đã trở thành điểm tập hợp của các Cainite Occitan kể từ khi cuộc Thập Tự Chinh Albigensian bắt đầu. Sự kháng cự bền bỉ của bà chống lại cả Inquisition lẫn người Pháp phương Bắc đã khiến triều đình của bà trên thực tế độc lập khỏi sự kiểm soát của Paris.\n'Nữ Vương đen' là một nhân vật bí ẩn, và nhiều người được cho là đã thề trung thành vĩnh viễn với bà chỉ sau một cái liếc nhìn. Đây là lý do tại sao ngươi lo lắng về lời mời bất ngờ này đến Toulouse đột nhiên xuất hiện trước cửa nhà ngươi..."
 pod_french_struggle.1007.a: "Chắc chắn, ta có thể chống lại phép thuật của bà ta!"
 pod_french_struggle.1007.b: "Tốt hơn là không nên mạo hiểm."
 pod_french_struggle.1007.c: "Ta cũng biết một hai điều về thuật mê hoặc..."
 french_struggle_taunt_tooltip: "Không, ngươi không thể đâu."
 
 pod_french_struggle.1008.t: "Thần Mặt Trời Mang Quà Đến"
 pod_french_struggle.1008.desc: "Mithras, người cai trị quyền lực của Baronies of Avalon, đã tỏ ra ít quan tâm đến nước Pháp trong thời gian Alexander cai trị. Nhưng giờ đây khi đất nước bị bất ổn bởi cuộc lưu đày của ông ta, và người phàm Anh cũng đang lấn tới, có vẻ như Thần Mặt Trời đã có những kế hoạch mới.\nBắt đầu một chuyến công du xa hoa khắp nước Pháp, Mithras đã ghé thăm nhiều thành phố, gây ấn tượng với các cư dân Cainite của họ bằng sức mạnh và ảnh hưởng to lớn của mình. Ngươi có thể sắp xếp để Mithras ghé qua thành phố của ngươi trong chuyến công du nếu ngươi muốn. Điều đó chắc chắn sẽ có lợi cho hình ảnh của ngươi và ông ta là một vị khách hào phóng. Nhưng nguy cơ rơi vào bùa mê của ông ta là điều cần cân nhắc..."
 pod_french_struggle.1008.a: "Ta lấy làm vinh hạnh trước sự hiện diện của người!"
 pod_french_struggle.1008.b: "Tốt hơn là không nên mạo hiểm."
 pod_french_struggle.1008.c: "Mithras đã là Thần của ta rồi! Chắc chắn người sẽ giúp ta chứ?"
 
 pod_french_struggle.1009.t: "Đề Nghị của Bạo Chúa"
 pod_french_struggle.1009.desc: "Hardestadt quyền lực của nước Đức là một sự kỳ lạ trong thế giới Cainite. Xuất thân từ một dòng dõi bí ẩn, ông ta đã trở thành Ventrue quan trọng nhất châu Âu bất chấp tuổi đời còn trẻ của mình. Nổi tiếng là một chính trị gia xảo quyệt và tàn nhẫn, ông ta cũng được biết đến là người không giấu giếm lời nói.\nChuyến viếng thăm đột ngột của ông ta đến triều đình của ngươi là một cú sốc nhưng đề nghị của ông ta còn đáng ngạc nhiên hơn. Thẳng thắn một cách trần trụi, Hardestadt nói với ngươi rằng ông ta có kế hoạch cho nước Pháp và ngươi có thể là một tài sản trong nỗ lực này. Ông ta đề nghị cho ngươi vàng, một đội quân riêng và sự công nhận giá trị của ngươi tại triều đình của ông ta nếu ngươi đồng ý gia nhập Fiefs of the Black Cross."
 pod_french_struggle.1009.a: "Một đề nghị hấp dẫn..."
 pod_french_struggle.1009.b: "Ta không tin hắn."

 pod_french_struggle.1010.t: "Một Cuộc Trò Chuyện Kinh Điển"
 pod_french_struggle.1010.desc: "Một trong những Ventrue có ảnh hưởng nhất Tây Âu, Julia Antasia, đã đến thăm một số triều đình của nước Pháp. Bà có nhiều tín đồ tận tụy trong khu vực, tất cả đều ca ngợi sự điềm tĩnh và tầm nhìn không tưởng của bà về một xã hội dân chủ cho các Cainite.\nBà đã ghé thăm triều đình của ngươi vài đêm nay và ngươi phải thừa nhận rằng danh tiếng của bà không hề bị thổi phồng. Bà điềm tĩnh, chững chạc và mọi điều bà nói vẽ nên một tầm nhìn sống động về một tương lai tiềm năng vĩ đại cho giống loài của ngươi. Ngươi có thể cảm nhận bản thân mình ngày càng bị lay động bởi cuộc trò chuyện có vẻ vô hại này giữa những người ngang hàng."
 pod_french_struggle.1010.a: "Một cuộc trò chuyện thú vị, không hơn không kém."
 pod_french_struggle.1010.b: "Bà ấy có một số điểm rất hay..."
 pod_french_struggle.1010.c: "Thưa quý bà, đừng nói thêm nữa, hãy để ta phục vụ người!"

 pod_french_struggle.1011.t: "Món Quà Độc"
 pod_french_struggle.1011.desc: "Là Mẫu Chủ của Courts of Love, Salianna, ít nhất là trên danh nghĩa, là Cainite quan trọng nhất nước Pháp kể từ cuộc lưu đày của Alexander. Tuy nhiên, quyền cai trị của bà đang bị tranh chấp và bà đang cố gắng củng cố nó tốt nhất có thể kể từ đó.\nLà một trong những người cai trị có ảnh hưởng của màn đêm ở nước Pháp, ngươi phải chịu một số mưu kế của bà nhằm được công nhận. Trong phiên họp triều đình gần đây nhất, bà đang cố gắng đề nghị ngươi một người phàm được chọn lọc để ngươi sử dụng tùy ý. Về mặt chính trị, việc chấp nhận món quà nghĩa là công nhận bà như một lãnh chúa ban thưởng cho chư hầu, củng cố vị thế của bà bằng cái giá của ngươi. Mặt khác, người phàm này có vẻ thực sự thú vị..."
 pod_french_struggle.1011.a: "Ta lấy làm vinh hạnh, Mẫu Chủ."
 pod_french_struggle.1011.b: "Bà cứ giữ lấy quà của mình đi."

 pod_french_struggle.1012.t: "Khách Từ Phương Nam"
 pod_french_struggle.1012.desc: "Lasombra Iberia nằm trong số nhiều kẻ ngoại lai cố gắng giành lấy bất kỳ ảnh hưởng nào có thể ở nước Pháp sau cuộc lưu đày của Alexander. Rắc rối của chính họ trên bán đảo với cuộc nội chiến đang diễn ra sớm đã chấm dứt nỗ lực của họ. Dù vậy, một số Lasombra trẻ tuổi nhìn thấy cơ hội trong tình cảnh của nước Pháp, có lẽ để gây dựng cơ đồ trước khi trở về quê hương trong vinh quang.\nMột nhóm lính đánh thuê như vậy gần đây đã đến đề nghị phục vụ ngươi. Ngươi rõ ràng có thể từ chối đề nghị của họ, nhưng không có nghi ngờ gì rằng sau đó họ sẽ tìm một chủ khác, có lẽ thậm chí là một trong những đối thủ của ngươi."
 pod_french_struggle.1012.a: "Ngươi được thuê."
 pod_french_struggle.1012.b: "Ngươi không được thuê."

 french_struggle_house_modifier: "Những Bậc Thầy của Nước Pháp"
 french_struggle_house_modifier_desc: "Các thành viên của Gia Tộc này đã củng cố nước Pháp ma cà rồng, đảm bảo cho họ ảnh hưởng to lớn đối với phần quan trọng này của Tây Âu."
 
