 pod_assamite_struggle.108.t: "Web of Knives"
 pod_assamite_struggle.108.desc: "Là một phe phái không chính thức trong Banu Haqim, Web of Knives là một giáo phái sát thủ bí mật tôn thờ một Methuselah bí ẩn tên là Ur-Shulgi. Chúng là những tín đồ cuồng tín sẵn sàng tiêu diệt bất kỳ ma cà rồng nào từ chối phục vụ chủ nhân của chúng. Chúng còn được biết đến như những kẻ sát nhân khát máu và phải chịu trách nhiệm cho tiếng xấu của cả $pod_clan$ trong mắt người ngoài.\nVới nỗ lực và nguồn lực lớn, ngươi có thể khởi động một chiến dịch để giúp đỡ hoặc bôi nhọ phe phái này trong bức tranh chính trị chung của Banu Haqim."
 pod_assamite_struggle.108.a: "Giúp đỡ phe phái này"
 pod_assamite_struggle.108.b: "Đối đầu với phe phái này"
 pod_assamite_struggle.108.c: "Chưa làm gì lúc này"
 faction_gain_influence_tt: "Ảnh hưởng của phe phái này sẽ tăng lên"
 faction_lose_influence_tt: "Ảnh hưởng của phe phái này sẽ giảm xuống"
 
 pod_assamite_struggle.109.t: "Ashirra"
 pod_assamite_struggle.109.desc: "Phe phái quyền lực này trong Banu Haqim chủ trương hợp tác chặt chẽ hơn với phong trào [Glossary('Ashirra','game_concept_ashirra_desc')]. Nó chủ yếu gồm những ma cà rồng trẻ tuổi, vốn theo đạo Hồi khi còn sống, nhưng cũng có một vài trưởng lão quyền lực đã cải sang chính nghĩa này. Với việc đạo Hồi ngày càng chiếm ưu thế trong khu vực, phe Ashirra đang có đà tiến rất mạnh. Họ có xu hướng liên minh với Council of Scrolls với hy vọng trở thành lựa chọn thỏa hiệp mà tất cả các bên khác đều có thể chấp nhận được.\nVới nỗ lực và nguồn lực lớn, ngươi có thể khởi động một chiến dịch để giúp đỡ hoặc bôi nhọ phe phái này trong bức tranh chính trị chung của Banu Haqim."
 
 pod_assamite_struggle.110.t: "Council of Scrolls"
 pod_assamite_struggle.110.desc: "Ban đầu được lập ra để tìm kiếm và bảo tồn tri thức tại Alamut, Council of Scrolls đã phát triển thành một phe phái chính trị dành cho các Pháp sư và Vizir, những người ủng hộ giải pháp thỏa hiệp cho cuộc khủng hoảng hiện tại. Dù có lập trường này, họ vẫn kịch liệt chống đối Web of Knives, phần lớn vì ảnh hưởng của người sáng lập ra họ, Al-Ashrad. Council hiện đang hợp tác với phe [Glossary('Ashirra','game_concept_ashirra_desc')], xem đây là một lựa chọn tốt để giữ cho Banu Haqim ổn định trong tương lai.\nVới nỗ lực và nguồn lực lớn, ngươi có thể khởi động một chiến dịch để giúp đỡ hoặc bôi nhọ phe phái này trong bức tranh chính trị chung của Banu Haqim."
 
 pod_assamite_struggle.111.t: "Silsila"
 pod_assamite_struggle.111.desc: "Tăng lữ chiến binh tinh nhuệ của Banu Haqim từng là những người lãnh đạo thực sự của Alamut trong thời kỳ đạo Zoroaster còn thống trị. Vì vậy, họ đã gắn bó mật thiết với tôn giáo này và suy tàn cùng với đức tin của mình. Sự trở lại của Nakurtum với tư cách Trưởng Lão vào năm 1214 đã giúp bảo toàn chút ảnh hưởng ít ỏi còn sót lại của họ, nhưng điều này có lẽ là quá ít, quá muộn, đặc biệt khi phần lớn Banu Haqim mới đều xuất thân từ dòng máu phàm nhân theo đạo Hồi.\nVới nỗ lực và nguồn lực lớn, ngươi có thể khởi động một chiến dịch để giúp đỡ hoặc bôi nhọ phe phái này trong bức tranh chính trị chung của Banu Haqim."
  
 pod_assamite_struggle.112.t: "Lost Tribe"
 pod_assamite_struggle.112.desc: "Lost Tribe là một giáo phái dị giáo gồm (phần lớn) Banu Haqim tôn thờ Zilah đã chết và tìm cách báo thù cho nàng bằng cách tiêu diệt những kẻ sát hại nàng, Thế Hệ Thứ Ba, cùng những kẻ theo phò họ. Điều này khiến họ xung đột trực tiếp với phần còn lại của $pod_clan$ vốn tôn sùng Haqim, và vì vậy họ đã bị thanh trừng khỏi chính trường Alamut hết lần này đến lần khác. Tuy nhiên, ảnh hưởng của họ vẫn âm ỉ và họ có xu hướng tái xuất hiện vào lúc ít ai ngờ tới nhất.\nVới nỗ lực và nguồn lực lớn, ngươi có thể khởi động một chiến dịch để giúp đỡ hoặc bôi nhọ phe phái này trong bức tranh chính trị chung của Banu Haqim."
  
 clashing_heretics_modifier: "Dị Giáo Đối Đầu"
 clashing_heretics_modifier_desc: "Quận này là trung tâm của một cuộc chiến ngầm giữa hai giáo phái đối nghịch."
 
 pod_assamite_struggle.1000.t: "Dị Giáo Đối Đầu"
 pod_assamite_struggle.1000.desc: "Dù cùng là những giáo phái dị giáo bên trong Banu Haqim, Lost Tribe và Web of Knives không hề ưa nhau. Họ xem đối thủ của mình là mối đe dọa cấp bách nhất đối với $pod_clan$, và cuộc chiến ngầm giữa họ có lẽ là đẫm máu nhất trong số mọi phe phái.\nMột trong những lãnh địa của ngươi gần đây đã chứng kiến sự gia tăng của những hoạt động cực đoan như vậy, và cả hai giáo phái đang quấy nhiễu thường dân cũng như ngày càng trở nên khó xử lý hơn. Khó mà lý lẽ được với họ, nhưng đứng về phía một phe phái có thể đảm bảo rằng, ít nhất, sự quấy nhiễu này sẽ không kéo dài quá lâu."
 pod_assamite_struggle.1000.a: "Gửi viện trợ cho Web of Knives."
 pod_assamite_struggle.1000.b: "Gửi viện trợ cho Lost Tribe"
 pod_assamite_struggle.1000.c: "Thao túng cả hai phe để giải quyết vấn đề."
 pod_assamite_struggle.1000.a.success: "Đã xử lý xong."
 pod_assamite_struggle.1000.a.failure: "Ngày càng tệ hơn..."
 pod_assamite_struggle.1000.d: "Ta cai trị nơi đây, không phải chúng!"
 wok_gain_influence_tt: "Web of Knives có thêm ảnh hưởng."
 wok_lose_influence_tt: "Web of Knives mất bớt ảnh hưởng."
 losttribe_gain_influence_tt: "Lost Tribe có thêm ảnh hưởng."
 losttribe_lose_influence_tt: "Lost Tribe mất bớt ảnh hưởng."
 
 pod_assamite_struggle.1001.t: "Bổn Phận Của Kẻ Sùng Đạo"
 pod_assamite_struggle.1001.desc: "Cộng đồng [Glossary('Ashirra','game_concept_ashirra_desc')] rất mạnh ở Ba Tư. Một trong những tôn chỉ của phong trào này là để phàm nhân sống theo ý họ, với sự can thiệp từ ma cà rồng ít nhất có thể. Dĩ nhiên, điều này không phải lúc nào cũng thực tế đối với một kẻ cai trị màn đêm.\nMột đại diện Ashirra như vậy gần đây đã đến lãnh địa của ngươi, phàn nàn rằng các thuộc hạ của ngươi đang có cách hành xử quá tay đối với các vấn đề của phàm nhân trong khu vực."
 pod_assamite_struggle.1001.a: "Thương lượng một giải pháp thỏa hiệp."
 pod_assamite_struggle.1001.a.success: "Một thỏa thuận tốt."
 pod_assamite_struggle.1001.a.failure: "Tiếng la hét và cãi vã."
 pod_assamite_struggle.1001.b: "Được thôi, chúng ta sẽ không can thiệp."
 ashirra_gain_influence_tt: "Ashirra có thêm ảnh hưởng."
 ashirra_lose_influence_tt: "Ashirra mất bớt ảnh hưởng."
 pod_assamite_struggle.1001.c: "Ta cai trị theo ý ta thấy phù hợp!"
 
 pod_assamite_struggle.1002.t: "Sự Thật Về Haqim"
 pod_assamite_struggle.1002.desc: "Là một nhân vật được con cháu tôn kính, Haqim vẫn còn là một bí ẩn đối với phần lớn bọn họ. Là một người ít nói khi còn hoạt động, sự biến mất của ông càng làm sâu thêm những lời đồn đại xung quanh ông. Với bản chất chia rẽ hiện tại của Clan, việc chủ đề về bản chất thật sự của Haqim thường xuyên được đem ra bàn luận là điều tự nhiên.\nLà một kẻ cai trị màn đêm có tầm ảnh hưởng, ý kiến của ngươi có trọng lượng hơn hầu hết những kẻ khác."
 pod_assamite_struggle.1002.a: "Haqim, dù vĩ đại, cũng chỉ là một tôi tớ của Đấng Vĩ Đại Nhất."
 silsila_gain_influence_tt: "Silsila có thêm ảnh hưởng."
 pod_assamite_struggle.1002.b: "Haqim là vị thẩm phán tối hậu cho giá trị của nhân loại."
 council_gain_influence_tt: "Council of Scrolls có thêm ảnh hưởng."
 pod_assamite_struggle.1002.c: "Một con người vĩ đại, dù đôi lúc có khiếm khuyết."
 pod_assamite_struggle.1002.d: "Ta không nghĩ Haqim quan trọng đến thế..."
 
 pod_assamite_struggle.1003.t: "Cuộn Giấy Thất Lạc"
 pod_assamite_struggle.1003.desc: "Thuộc hạ của ngươi gần đây đã bắt được một tên trộm mà Alamut đã tìm kiếm từ lâu. Sau khi xem xét kỹ hơn, có vẻ như người này không thực sự là một tên trộm mà là một học giả sở hữu, có vẻ như, một bản viết quan trọng được thực hiện từ thời Zoroaster.\nGiới lãnh đạo Silsila, những người gìn giữ lịch sử và phần lớn theo đạo Zoroaster, đang yêu cầu ngươi giao lại các bản viết này cho họ, dĩ nhiên là sau khi bồi thường cho sự giúp đỡ của ngươi. Nhưng ngươi còn có những lựa chọn khác..."
 pod_assamite_struggle.1003.a: "Hân hạnh được phục vụ."
 silsila_lose_influence_tt: "Silsila mất bớt ảnh hưởng."
 pod_assamite_struggle.1003.b: "Đốt cuộn giấy. Và luôn cả 'tên trộm'."
 pod_assamite_struggle.1003.c: "Ta còn có những bạn hữu khác có thể quan tâm đến chuyện này..."
 pod_assamite_struggle.1003.d: "Ta sẽ giữ lấy nó."
 
 pod_assamite_struggle.1004.t: "Dao Đã Tuốt"
 pod_assamite_struggle.1004.desc: "Một trong những ngôi làng hẻo lánh trong lãnh địa của ngươi gần đây đã bị đám cuồng tín của Web of Knives 'ghé thăm', những kẻ, nếu lời của những người sống sót là thật, đang tìm kiếm một tên gián điệp ngoại đạo. Như thường lệ, phương pháp của Web of Knives thô bạo và đặc biệt gây chấn động cho thần dân phàm nhân của ngươi.\nDọn dẹp hậu quả không khó lắm, nhưng ngươi có thể muốn phản ứng lại cuộc tấn công đê hèn này nhắm vào quyền uy của mình."
 pod_assamite_struggle.1004.a: "Một tên gián điệp? Thiêu rụi ngôi làng!"
 pod_assamite_struggle.1004.b: "Công khai lên án Web of Knives."
 wok_lose_lot_influence_tt: "Web of Knives mất rất nhiều ảnh hưởng."
 pod_assamite_struggle.1004.c: "Truy lùng và xử lý những kẻ gây hấn."
 pod_assamite_struggle.1004.d: "Không cần chọc giận Web vì chuyện nhỏ nhặt như vậy."
 involved_knives_out_tt: "Những kẻ cai trị liên quan đến cuộc đấu tranh theo đức tin Path of Righteousness sẽ mất 50 cảm tình với ngươi."
 involved_knives_out_lots_tt: "Những kẻ cai trị liên quan đến cuộc đấu tranh theo đức tin Path of Righteousness sẽ mất 100 cảm tình với ngươi."
 
 pod_assamite_struggle.1005.t: "Vùng Đất Của Gián Điệp"
 pod_assamite_struggle.1005.desc: "Ba Tư là một nơi rộng lớn, và điều đó khiến nhu cầu về một hệ thống chuyển thư đáng tin cậy đến và đi từ Alamut trở nên rất quan trọng. Dù các ghoul đưa tin khá tốt, ngươi khá chắc chắn rằng phần lớn hành trình của họ đang bị theo dõi bởi những phe phái kém liêm chính hơn trong cuộc đấu tranh hiện tại. Ngươi nghi ngờ rằng thực ra rất có khả năng báo cáo và các thư từ khác của ngươi đang thường xuyên bị chặn bởi kẻ thù.\nCouncil of Scrolls gần đây đã đề xuất một hệ thống mới do Al-Ashrad nổi tiếng tạo ra, một quả cầu ma thuật được ban sức mạnh bởi quyền năng Djinni cho phép giao tiếp tầm xa hơn. Tuy nhiên, một số tiếng nói phản đối điều này có thể được nghe thấy, khi họ lập luận rằng điều này đơn giản chỉ có nghĩa là thay đổi ai theo dõi ai..."
 pod_assamite_struggle.1005.a: "Một sáng kiến xuất sắc, ta cần một cái."
 pod_assamite_struggle.1005.b: "Ta sẽ tự nghĩ ra hệ thống của riêng mình."
 council_lose_influence_tt: "Council of Scrolls mất bớt ảnh hưởng."
 pod_assamite_struggle.1005.c: "Council đang thao túng chúng ta!"
 
 pod_assamite_struggle.1006.t: "Những Người Con Gái Của Haqim"
 pod_assamite_struggle.1006.desc: "Việc Trao truyền phụ nữ chưa bao giờ đặc biệt là một vấn đề trong văn hóa Banu Haqim, nhất là khi chính Haqim cũng đã làm vậy, nhưng sự trỗi dậy của phong trào [Glossary('Ashirra','game_concept_ashirra_desc')] đã thay đổi tình trạng này. Trong giai cấp chiến binh, tục lệ Trao truyền phụ nữ đã mất dần vị thế vào thế kỷ thứ 8, khi nó bắt đầu bị xem là vô đạo đức khi nguyền rủa phụ nữ với kiếp bất tử.\nMối rạn nứt này vẫn tồn tại đến tận đêm nay, dù các chiến binh đã bắt đầu nới lỏng chính sách này từ vài thập kỷ nay. Vì vậy, dù không còn là một vấn đề cấp bách như trước, nó vẫn là chủ đề tranh luận giữa các con trai, và con gái, của Haqim."
 pod_assamite_struggle.1006.a: "Đối với ta điều đó vẫn cảm thấy sai trái."
 pod_assamite_struggle.1006.b: "Haqim biết mình đang làm gì."
 pod_assamite_struggle.1006.c: "Thành thật mà nói, nên làm ngược lại mới đúng."
 
 pod_assamite_struggle.1007.t: "Ba Giai Cấp"
 pod_assamite_struggle.1007.desc: "Không ai thực sự biết hệ thống Giai Cấp đã bắt đầu bén rễ trong xã hội Banu Haqim từ khi nào, nhưng giờ đây nó đã là một phần không thể thiếu của kiếp bất tử ở Ba Tư. Theo truyền thống, các Vizier là những người lãnh đạo và tích cực tham gia chính trị nhất trong ba giai cấp, nhưng quyền lực đã dần chuyển sang tay các Chiến Binh trong thời gian gần đây hơn. Về phần mình, các Pháp Sư từ lâu đã là một nhóm sống ẩn dật và số lượng ít ỏi của họ khiến họ trở thành giai cấp yếu nhất.\nHệ thống Giai Cấp vận hành song song với các phe phái chính trị trong xã hội Banu Haqim, và dù ngươi có thể tìm thấy bất kỳ giai cấp nào trong bất kỳ phe phái nào, một số được ưu ái hơn những giai cấp khác tùy theo chương trình chính trị của ngươi."
 pod_assamite_struggle.1007.a: "Các Chiến Binh dẫn dắt chúng ta tiến lên."
 pod_assamite_struggle.1007.b: "Các Pháp Sư nắm giữ sự thật."
 pod_assamite_struggle.1007.c: "Các Vizier là những người lãnh đạo tự nhiên của chúng ta."
 pod_assamite_struggle.1007.d: "Tất cả chúng ta phải hợp lực như một."
 
 council_gain_lot_influence_tt: "Council of Scrolls có thêm rất nhiều ảnh hưởng."
  
 pod_assamite_struggle.1008.t: "Những Bí Ẩn Của Al-Ashrad"
 pod_assamite_struggle.1008.desc: "Người đứng đầu Giai Cấp Pháp Sư, vị Amr, luôn là Al-Ashrad bí ẩn, một childe cổ xưa và được kính trọng rộng rãi (cũng như bị e sợ) của Ur-Shulgi còn bí ẩn hơn. Được biết đến là kẻ sống khép kín, vị Amr chịu trách nhiệm cho một số sáng tạo kỳ diệu nhất của những Người Con Của Haqim cùng khả năng sử dụng bậc thầy Blood Magic của họ.\nPhong thái chậm rãi, thận trọng của ông thể hiện tâm trí của một bậc cổ xưa thực thụ, lên kế hoạch cho hàng thế kỷ sắp tới. Tuy vậy, gần đây, Al-Ashrad đã hoạt động một cách khác thường tại Alamut, nhẹ nhàng thúc đẩy chương trình nghị sự của Council of Scrolls, phe phái mà ông và những tiếng nói ôn hòa khác trong Banu Haqim đã tạo ra."
 pod_assamite_struggle.1008.a: "Toàn tâm toàn ý giúp đỡ nỗ lực của ông ta."
 pod_assamite_struggle.1008.b: "Cản trở ông ta mọi lúc mọi nơi."
 pod_assamite_struggle.1008.c: "Ông ta đang toan tính điều gì?"

 targetted_web_modifier: "Bị Web Nhắm Đến"
 targetted_web_modifier_desc: "Web of Knives đã để ý đến ngươi. Một sự chú ý nguy hiểm nhất."
  
 wok_gain_lot_influence_tt: "Web of Knives có thêm rất nhiều ảnh hưởng."
  
 pod_assamite_struggle.1009.t: "Mạng Lưới Của Thetmes"
 pod_assamite_struggle.1009.desc: "Một nhân vật gây chia rẽ giữa những Người Con Của Haqim, Thetmes quyền lực được biết đến như một kẻ thao túng bóng tối bậc thầy và là một trong những sát thủ nguy hiểm nhất Alamut. Lòng trung thành của hắn với Web of Knives được thì thầm khắp các sảnh đường Alamut, nhưng mục tiêu cuối cùng thực sự của Thetmes chỉ có hắn mới biết.\nDưới lệnh của hắn, Web gần đây đã bắt đầu một chiến dịch đe dọa cẩn trọng khắp Ba Tư, đảm bảo rằng các Vương Tử và Sultan trở nên... 'chú tâm' hơn đối với yêu cầu của giáo phái này. Vị trí của ngươi trong sự kiện này chắc chắn sẽ được theo dõi cẩn thận bởi tên người Ai Cập tàn nhẫn này."
 pod_assamite_struggle.1009.a: "Toàn tâm toàn ý giúp đỡ nỗ lực của hắn."
 pod_assamite_struggle.1009.b: "Cản trở hắn mọi lúc mọi nơi."
 pod_assamite_struggle.1009.c: "Hắn đang toan tính điều gì?"
 
 silsila_gain_lot_influence_tt: "Silsila có thêm rất nhiều ảnh hưởng."
  
 pod_assamite_struggle.1010.t: "Mệnh Lệnh Của Nakurtum"
 pod_assamite_struggle.1010.desc: "Nakurtum, một trong những childe lâu đời nhất của chính Haqim, đã nắm quyền kiểm soát Alamut vào năm 1214 bằng một cuộc phô diễn sức mạnh vội vàng. Lòng sùng đạo của bà đối với một tôn giáo đang suy tàn, cùng thái độ kiêu ngạo của bà đối với các phe phái khác, đã khiến bà có rất ít bạn bè, và bà chỉ vừa đủ kiểm soát được chính Alamut.\nDù vậy, bà vẫn là Trưởng Lão, và tước hiệu đó xứng đáng được rất nhiều sự tôn trọng trong xã hội Banu Haqim. Vì vậy, bà mong đợi được tuân theo khi ban ra mệnh lệnh của mình. Chống lại ý muốn của bà là dễ dàng vì bà không có phương tiện để thực thi quyền uy của mình, nhưng đó vẫn là một sự vi phạm nghi thức theo một cách nào đó. Vì vậy khi một trong những mệnh lệnh đó đến với ngươi, ngươi phải quyết định hướng hành động của mình."
 pod_assamite_struggle.1010.a: "Tuân theo ý nguyện của Trưởng Lão."
 pod_assamite_struggle.1010.b: "Phớt lờ những lời lảm nhảm của bà ta."
 pod_assamite_struggle.1010.c: "Làm cho có, ở mức tối thiểu."
  
 jamal_levies_modifier: "Sự Tinh Thông Của Jamal"
 jamal_levies_modifier_desc: "Jamal đã đích thân huấn luyện các nhà vô địch của ngươi. Những kẻ vẫn còn đi lại được đã tiến bộ rất nhiều."
 
 ashirra_gain_lot_influence_tt: "Ashirra có thêm rất nhiều ảnh hưởng."
  
 pod_assamite_struggle.1011.t: "Sự Tinh Thông Của Jamal"
 pod_assamite_struggle.1011.desc: "Chiến binh nguy hiểm nhất của Banu Haqim được công nhận rộng rãi là Jamal, một trong những childe của Haqim. Chiến binh đáng sợ này còn được biết đến là một tín đồ kiên định của chính nghĩa [Glossary('Ashirra','game_concept_ashirra_desc')] và đã là thủ lĩnh không chính thức của họ suốt nhiều thế kỷ nay.\nDù vậy, Jamal cũng được cho là một tiếng nói ôn hòa, và thường được thấy giúp đỡ những Banu Haqim khác, kể cả những kẻ không chia sẻ chính nghĩa của mình. Phong thái thân thiện này đã giúp ông, cùng phe Ashirra, nhận được rất nhiều sự tôn trọng qua nhiều năm.\nĐêm nay ngươi là đối tượng được chiến binh vĩ đại này chú ý đến. Nhận thấy một vài khiếm khuyết trong kỹ năng chiến đấu của các nhà vô địch của ngươi, ông đề nghị giúp họ trong một buổi huấn luyện nhỏ."
 pod_assamite_struggle.1011.a: "Ta lấy làm vinh hạnh, cảm ơn."
 pod_assamite_struggle.1011.b: "Ta không nghĩ điều đó cần thiết."
 pod_assamite_struggle.1011.c: "Xin hãy nhẹ tay với họ."
   
 losttribe_gain_lot_influence_tt: "Lost Tribe có thêm rất nhiều ảnh hưởng."
  
 pod_assamite_struggle.1012.t: "Sự Thật của Anosh"
 pod_assamite_struggle.1012.desc: "Giáo phái Cult of Zilah bí ẩn (và cực kỳ dị giáo) của Dastur Anosh đã ẩn náu kể từ khi chủ nhân ông ta chết dưới tay các sát thủ Alamut. Dù vậy, ảnh hưởng của ông ta vẫn chưa hoàn toàn biến mất khỏi chính trường Ba Tư. Đêm nay, ngươi nhận được một mẩu tin rằng một cuộn giấy da cổ chứa vài thông tin... thú vị về Thế Hệ Thứ 3 đang lưu truyền trong khu vực của ngươi. Một âm mưu nhỏ nhưng có khả năng gây ảnh hưởng lớn như vậy chính là dấu ấn của Anosh, và ngươi phải quyết định phải làm gì với chuyện này."
 pod_assamite_struggle.1012.a: "Ta phải tự mình đọc nó."
 pod_assamite_struggle.1012.b: "Tìm và tiêu hủy nó!"
 pod_assamite_struggle.1012.c: "Mặc kệ nó."
   
