 french_victory_objective_decision: "Nước Pháp Được Phục Hồi"
 french_victory_objective_decision_tooltip: "Nếu nước Pháp muốn sống sót trước những kẻ xâm lược đang lấn tới, nó phải được thống nhất một lần nữa."
 french_victory_objective_decision_desc: "Sự suy yếu của nước Pháp đã khiến người Đức và người Anh nhòm ngó những vùng đất vốn thuộc về chúng ta. Đã đến lúc gạt bỏ những bất đồng và một lần nữa trỗi dậy như một trong những thế lực mạnh nhất của màn đêm."
 french_victory_objective_decision_confirm: "Nước Pháp Vĩnh Cửu"
 french_victory_objective_decision_effect_tooltip: "Xung Đột sẽ kết thúc. Các thành phố [GetTitleByKey('b_rethel').GetNameNoTier], [GetTitleByKey('b_lyon').GetNameNoTier], [GetTitleByKey('b_bordeaux').GetNameNoTier], [GetTitleByKey('b_blois').GetNameNoTier] và [GetTitleByKey('b_poitiers').GetNameNoTier] sẽ nhận được một công trình đặc biệt mới. Ngươi sẽ tiếm đoạt Đế Quốc [GetTitleByKey('e_love').GetNameNoTier] nếu ngươi chưa sở hữu nó." 
  
 pod_french_struggle.102.t: "Nước Pháp Được Phục Hồi"
 pod_french_struggle.102.desc: "Bị tan vỡ bởi cuộc lưu đày cưỡng bức của Alexander, sự thống nhất của nước Pháp đã bị đe dọa bởi các Cainite Đức và Anh đang lấn tới, cũng như bởi chính các hoàng thân chia rẽ và tranh cãi của nó đang tranh giành quyền thống trị trong khoảng trống để lại sau cuộc chính biến. Sự biến động này cũng để cho Inquisition có cơ hội phát triển mạnh, đe dọa phá hủy những gì còn sót lại của cấu trúc chính trị ma cà rồng.\nNhưng giờ đây không còn như vậy nữa, khi các Cainite Pháp đã tìm thấy một cảm giác mục đích và đoàn kết mới. Một lần nữa thoát khỏi những kẻ xâm lược, và đủ tổ chức để ngăn chặn Inquisition, các Courts đã trở lại chính trường ma cà rồng của Tây Âu một cách mạnh mẽ."
 pod_french_struggle.102.a: "Câu chuyện của nước Pháp chỉ mới bắt đầu."
 
 e_love_brujah: "Courts of Philosophy"
