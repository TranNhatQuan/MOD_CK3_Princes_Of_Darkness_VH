 assamite_struggle_uninvolved_or_external_tt: "Thủ đô của ngươi phải nằm ngoài Ba Tư/Alamut"
 assamite_struggle_secure_assamite_foothold_empire_tt: "Ngươi kiểm soát một đế quốc không phải Ba Tư/Alamut"
 fp2_struggle_secure_assamite_foothold_empire_dejure_effect_tt: "Ngươi sẽ chuyển de jure của các vương quốc Ba Tư mà ngươi sở hữu sang đế quốc của chính mình nếu đế quốc đó giáp ranh (về mặt de jure) với đế quốc Alamut."
 
 
 NOT_NO_WARS_STRUGGLE_PARAMETER_CD: "Ngươi đang ở trong một Giai Đoạn Xung Đột nơi ngươi không thể tấn công nhân vật này."
 
 french_struggle: "Một Nước Pháp Rạn Nứt"
 french_struggle_desc: "Nước Pháp ma cà rồng từng được cai trị bởi một trong những Ventrue có ảnh hưởng nhất, Alexander. Ông được hậu thuẫn bởi Toreador Courts of Love, một nhóm các Nữ Vương quyền lực cai quản từ các thành phố lớn của Pháp, đưa ra lời khuyên và hỗ trợ cho ông. Nhưng sự lãnh đạm và cô lập của lão Ventrue này cuối cùng đã dẫn tới sự sụp đổ của ông vào năm 1222, khi ông bị lật đổ bởi một cuộc chính biến do Nữ Vương quyền lực nhất của Courts of Love, Salianna, cùng chính childe của ông, Geoffrey, dàn dựng.\nSalianna sau đó lên nắm quyền, nhưng một sự thay đổi tàn khốc như vậy sau hơn 600 năm ổn định đã đẩy nước Pháp vào hỗn loạn. Sự hỗn loạn càng trầm trọng hơn bởi cuộc Thập Tự Chinh Albigensian đang diễn ra, sự chia rẽ giữa người Occitan và người Pháp, cùng sự xâm lấn của Anh và Đức vào vương quốc này. Liệu nước Pháp ma cà rồng có sống sót qua những thời khắc sóng gió sắp tới?"
 struggle_french_phase_chaos: "Cơn Bão"
 struggle_french_phase_chaos_desc: "Khi Inquisition hoành hành khắp nơi, các vương quốc ma cà rồng lâm vào chiến tranh trong bóng tối của nước Pháp, hy vọng giành lấy bằng sức mạnh vũ khí những gì họ không thể có được bằng lời ngọt ngào."
 struggle_french_phase_reprieve: "Sự Tĩnh Lặng"
 struggle_french_phase_reprieve_desc: "Ngay cả ma cà rồng cũng cần thời gian để hồi phục. Việc củng cố quyền lực đang diễn ra ngay lúc này, khi các Vua và Nữ Vương đảm bảo rằng ảnh hưởng và lực lượng của họ đã sẵn sàng cho giai đoạn tiếp theo."
 
 pod_french_struggle.0501.t: "Một Nước Pháp Rạn Nứt"
 pod_french_struggle.0501.desc: "Nước Pháp ma cà rồng từng được cai trị bởi một trong những Ventrue có ảnh hưởng nhất, Alexander. Ông được hậu thuẫn bởi Toreador Courts of Love, một nhóm các Nữ Vương quyền lực cai quản từ các thành phố lớn của Pháp, đưa ra lời khuyên và hỗ trợ cho ông. Nhưng sự lãnh đạm và cô lập của lão Ventrue này cuối cùng đã dẫn tới sự sụp đổ của ông vào năm 1222, khi ông bị lật đổ bởi một cuộc chính biến do Nữ Vương quyền lực nhất của Courts of Love, Salianna, cùng chính childe của ông, Geoffrey, dàn dựng.\nSalianna sau đó lên nắm quyền, nhưng một sự thay đổi tàn khốc như vậy sau hơn 600 năm ổn định đã đẩy nước Pháp vào hỗn loạn. Sự hỗn loạn càng trầm trọng hơn bởi cuộc Thập Tự Chinh Albigensian đang diễn ra, sự chia rẽ giữa người Occitan và người Pháp, cùng sự xâm lấn của Anh và Đức vào vương quốc này. Liệu nước Pháp ma cà rồng có sống sót qua những thời khắc sóng gió sắp tới?"
 pod_french_struggle.0501.a: "Hỗn loạn sinh ra cơ hội."
 
