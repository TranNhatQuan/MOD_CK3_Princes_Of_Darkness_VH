l_english:
 
 reconquista_struggle: "Cuộc Shadow Reconquista"
 reconquista_struggle_desc: "Kể từ khi Đế chế La Mã sụp đổ, dòng Lasombra đã ngự trị tối cao ở Iberia. Nhưng kỷ nguyên này đang đi đến một hồi kết đẫm máu, khi xung đột tôn giáo giữa những kẻ phàm trần trên bán đảo cuối cùng đã lan sang thế giới bóng đêm.\nCuộc nội chiến Lasombra chính thức bùng nổ vào năm 1172 với sự sụp đổ của Murcia, và kể từ đó, những kẻ kích động từ cả hai phía như Ambrosio Luis Moncada và Badr đã thổi bùng ngọn lửa chiến tranh vì lợi ích riêng của họ.\nIberia giờ đây chìm trong hỗn loạn, và khi lính đánh thuê, kẻ ngoại lai cùng những kẻ cơ hội đổ xô về phe này hay phe khác, vẫn chưa rõ ai (nếu có) sẽ là người chiến thắng cuối cùng từ lò luyện này."
 struggle_reconquista_phase_shadows: "Chiến Tranh Bóng Tối"
 struggle_reconquista_phase_shadows_desc: "Cuộc Shadow Reconquista chưa bao giờ xứng với cái tên của nó hơn lúc này. Các Prince và Sultan đang mưu tính bước đi tiếp theo, và dù chiến tranh công khai vẫn tồn tại, nó ít thịnh hành hơn những lưỡi dao trong bóng tối."
 struggle_reconquista_phase_hostility: "Hỗn Loạn"
 struggle_reconquista_phase_hostility_desc: "Căng thẳng và oán hận cuối cùng đã nhường chỗ cho những cuộc tấn công công khai nhắm vào láng giềng và đồng tộc. Masquerade mỏng manh hơn bao giờ hết khi Iberia rực cháy trong đêm tối."
 struggle_reconquista_phase_reprieve: "Tạm Lắng"
 struggle_reconquista_phase_reprieve_desc: "Ngay cả ma cà rồng cũng cần thời gian để hồi phục. Việc củng cố quyền lực đang diễn ra ngay lúc này, khi các Prince và Sultan đảm bảo rằng ảnh hưởng và lực lượng của họ đã sẵn sàng cho giai đoạn tiếp theo."
 
##### Intro #####
 pod_reconquista_struggle.0501.t: "Cuộc Shadow Reconquista"
 pod_reconquista_struggle.0501.desc: "Kể từ khi Đế chế La Mã sụp đổ, dòng Lasombra đã ngự trị tối cao ở Iberia. Nhưng kỷ nguyên này đang đi đến một hồi kết đẫm máu, khi xung đột tôn giáo giữa những kẻ phàm trần trên bán đảo cuối cùng đã lan sang thế giới bóng đêm.\nCuộc nội chiến Lasombra chính thức bùng nổ vào năm 1172 với sự sụp đổ của Murcia, và kể từ đó, những kẻ kích động từ cả hai phía như Ambrosio Luis Moncada và Badr đã thổi bùng ngọn lửa chiến tranh vì lợi ích riêng của họ.\nIberia giờ đây chìm trong hỗn loạn, và khi lính đánh thuê, kẻ ngoại lai cùng những kẻ cơ hội đổ xô về phe này hay phe khác, vẫn chưa rõ ai (nếu có) sẽ là người chiến thắng cuối cùng từ lò luyện này.\n\n"
 pod_reconquista_struggle.0501.desc.involved: "Iberia từng được cai trị bởi Gangrel, rồi đến Brujah Carthage và Ventrue La Mã, giờ đây... giờ là lúc ta khẳng định chủ quyền của mình trên vùng đất này!\n\n"
 pod_reconquista_struggle.0501.desc.interloper: "Iberia từng được cai trị bởi Gangrel, rồi đến Brujah Carthage và Ventrue La Mã, giờ đây... giờ là lúc ta khẳng định chủ quyền của mình trên vùng đất này!\n\n"
 pod_reconquista_struggle.0501.a: "Nắm lấy vận mệnh!"
 
 secure_reconquista_foothold_decision_title: "Chỗ Đứng ở Iberia"
 secure_reconquista_foothold_decision_desc: "Cuộc nội chiến Lasombra ở Iberia là thời cơ để trục lợi. Chúng sẽ không kịp chuẩn bị trước một mối đe dọa từ bên ngoài."
 secure_reconquista_foothold_decision_tooltip: "Sáp nhập một phần Iberia"
 secure_reconquista_foothold_decision_confirm: "Về tay kẻ mạnh nhất"
 
 reconquista_struggle_phase_hostility_or_opportunity_tt: "Cuộc Xung Đột Reconquista phải đang ở giai đoạn Chiến Tranh Bóng Tối hoặc Hỗn Loạn."
 struggle_secure_reconquista_foothold_ends_the_struggle_tt: "Cuộc Xung Đột kết thúc."
 
 pod_reconquista_struggle.100.t: "Bình Minh trên Iberia"
 pod_reconquista_struggle.100.desc: "Dòng Lasombra bị chia rẽ đã tạo ra một cơ hội lớn cho những kẻ ngoại lai trên bán đảo. Với lưỡi kiếm chĩa vào nhau, họ đã không hề hay biết mối đe dọa từ bên ngoài cho đến khi đã quá muộn.\nVới ban lãnh đạo mới, Iberia đang dần quên đi cuộc Shadow Reconquista, Midnight Crescent và mọi mối bất hòa của họ. Đây là một kỷ nguyên mới, và sau người Gangrel Iberia, người Brujah Carthage, người Ventrue La Mã và người Lasombra, Iberia sẽ một lần nữa phải thích nghi với những chủ nhân mới."
 pod_reconquista_struggle.100.a: "Iberia cần một dòng máu mới."

 pod_reconquista_struggle.101.desc: "Dòng Lasombra bị chia rẽ đã tạo ra một cơ hội lớn cho những kẻ ngoại lai trên bán đảo. Với lưỡi kiếm chĩa vào nhau, họ đã không hề hay biết mối đe dọa từ bên ngoài cho đến khi đã quá muộn.\nVới ban lãnh đạo mới, Iberia đang dần quên đi cuộc Shadow Reconquista, Midnight Crescent và mọi mối bất hòa của họ. Đây là một kỷ nguyên mới, và sau người Gangrel Iberia, người Brujah Carthage, người Ventrue La Mã và người Lasombra, Iberia sẽ một lần nữa phải thích nghi với những chủ nhân mới."
 pod_reconquista_struggle.101.a: "Lũ ngoại lai đáng nguyền rủa."
 
 shadow_reconquista_tt: "Kết cục này chỉ dành cho người Lasombra không phải [Glossary('Ashirra','game_concept_ashirra_desc')]"
 ashirra_reconquista_tt: "Kết cục này chỉ dành cho các nhân vật [Glossary('Ashirra','game_concept_ashirra_desc')] và Tariq el Haqim"
 
 noconquista_objective_decision: "Con Đường Thứ Ba"
 noconquista_objective_decision_tooltip: "Đã đến lúc xua tan bóng tối phủ lên Iberia."
 noconquista_objective_decision_desc: "Sự tranh cãi về đức tin giữa người Lasombra theo Cơ Đốc giáo và [Glossary('Ashirra','game_concept_ashirra_desc')] đã khiến Iberia không thể phát huy hết tiềm năng thực sự của mình. Điều này không thể tiếp diễn."
 noconquista_objective_decision_confirm: "Iberia thức tỉnh!"
 noconquista_objective_decision_effect_tooltip: "Các vương quốc Lasombra sẽ bị suy yếu nghiêm trọng. Ngươi sẽ nhận được một hiệu ứng mạnh mẽ. Ngươi sẽ có quyền sử dụng [casus_belli|E] Xâm Lược nếu chưa có, đồng thời được giảm giá chi phí của nó."
 thirdway_reconquista_tt: "Kết cục này chỉ dành cho những nhân vật không phải Lasombra và không phải [Glossary('Ashirra','game_concept_ashirra_desc')]."
 thirdway_effect_tt: "Các vương quốc Lasombra sẽ bị suy yếu nghiêm trọng bởi hiệu ứng Uy Quyền Rạn Nứt. Ngươi sẽ có quyền sử dụng [casus_belli|E] Xâm Lược nếu chưa có, đồng thời được giảm giá chi phí của nó."
 
 heir_yzebel_modifier: "Người Thừa Kế của Yzebel"
 heir_yzebel_modifier_desc: "Ma cà rồng đầu tiên thống nhất Iberia, Yzebel người Carthage, đã tìm thấy người thừa kế của mình nơi nhân vật này."
 
 pod1230objectives.113.t: "Con Đường Thứ Ba"
 pod1230objectives.113.desc: "Iberia có một lịch sử lâu dài. Ban đầu do các nhóm chiến binh Gangrel du mục cư ngụ, sau đó được thống nhất bởi Yzebel người Brujah Carthage cho đến khi bà thất bại trước người Ventrue La Mã. Rồi, lợi dụng sự suy yếu của cả hai phe sau cuộc chiến của họ, người Lasombra đã len lỏi vào bán đảo và nhanh chóng củng cố quyền kiểm soát vùng đất này.\nTuy nhiên, cuộc nội chiến của họ đã làm suy yếu vị thế của họ đến mức một thế lực mới đã trỗi dậy ở Iberia. Nhiều người từng nghĩ rằng người Lasombra sẽ trụ vững mãi mãi, nhưng giờ đây họ đã bị chứng minh là sai lầm. Vùng đất này có chủ nhân mới, và dòng tộc Bóng Tối chỉ có thể hổ thẹn trước một thất bại hoàn toàn như vậy ngay trên quê hương mình."
 pod1230objectives.113.a: "Ta sẽ tồn tại lâu hơn tất cả bọn chúng!"
 pod1230objectives.114.a: "Thêm một trang sử nữa được lật qua."
 
 struggle_parameter_unlocks_secure_reconquista_foothold_decision: "Mở khóa quyết định Xác Lập Chỗ Đứng ở Iberia cho các nhân vật không tham gia ở trong hoặc gần Iberia."
 
 pod_reconquista_struggle.1000.t: "Căng Thẳng và Cơ Hội"
 pod_reconquista_struggle.1000.desc: "Iberia đang trong tình trạng căng thẳng tột độ. Mọi ma cà rồng đều đang cố gắng tận dụng chút ảnh hưởng ít ỏi mà chúng có đối với dân chúng phàm trần để giành lợi thế. Sự giằng co liên tục này đã khiến những kẻ phàm trần trong vùng gần như phát cuồng, nổi loạn và biểu tình chống lại mọi thứ và mọi người.\nSự căng thẳng bất thường này mang lại một số cơ hội cho các lãnh chúa và quý bà của màn đêm, và cố vấn của ngươi đang thúc giục ngươi khơi mào thêm cho ngọn lửa, đảm bảo rằng nó sẽ không sớm nguội tắt. Suy cho cùng, những kẻ phàm trần đang căng thẳng là những kẻ phàm trần dễ thao túng."
 pod_reconquista_struggle.1000.a: "Hãy để chúng ta leo thang tình hình một cách kín đáo."
 pod_reconquista_struggle.1000.b: "Ngươi đề xuất giải pháp này, ngươi tự làm đi."
 pod_reconquista_struggle.1000.c: "Không, kẻ phàm trần quá quý giá để phung phí."
 pod_reconquista_struggle.1000.d: "Tại sao ta phải quan tâm đến kẻ phàm trần?"
 
 pod_reconquista_struggle.1001.t: "Suối Tắm Nửa Đêm"
 pod_reconquista_struggle.1001.desc: "Những nhà tắm xa hoa, di tích từ thời La Mã, có mặt khắp Iberia và là thú vui ưa thích của những kẻ phàm trần có ảnh hưởng. Công việc kinh doanh này từ lâu đã do những Cainite bản địa điều hành, những kẻ tự hào về sự kín đáo của mình và chỉ giao dịch với các Prince và Sultan của Màn Đêm vào những dịp rất bất thường.\nTuy nhiên gần đây, một học giả Hồi giáo đã chứng minh rằng tắm rửa tốt cho sức khỏe của kẻ phàm trần, khiến những 'chủ nhà tắm' bí ẩn này phải lộ diện và xin tài trợ để mở rộng hoạt động của họ. Họ lập luận rằng kẻ phàm trần khỏe mạnh là kẻ phàm trần hữu ích, vì vậy cả hai bên đều có thể hưởng lợi từ sự mở rộng này."
 pod_reconquista_struggle.1001.a: "Ngươi sẽ nhận được sự ủng hộ của ta."
 pod_reconquista_struggle.1001.b: "Phá sập nhà tắm của chúng và mang về cho ta bất cứ thứ gì có giá trị!"
 pod_reconquista_struggle.1001.c: "Hiện giờ ta sẽ không đầu tư."
   
 pod_reconquista_struggle.1020.t: "Sư Tử và Dao Găm"
 pod_reconquista_struggle.1020.desc: "Trong cuộc xung đột bao trùm Iberia, có những kẻ cuồng tín ở cả hai phe. Các Sư Tử của Rodrigo chiến đấu cho người Lasombra Cơ Đốc giáo, và ngay cả họ đôi khi cũng phải bận tâm về sự tàn bạo của mình trong trận chiến. Đối với [Glossary('Ashirra','game_concept_ashirra_desc')], danh tiếng của Web of Knives không cần phải chứng minh thêm nữa, với những vụ giết người ghê rợn chồng chất đêm này qua đêm khác.\nMột nhóm như vậy gần đây đã xuất hiện tại thủ đô của ngươi, tuyên bố đang truy đuổi một 'gián điệp ngoại đạo' trước khi để lại một đống xác chết và sự tàn phá phía sau.\nNhư thường lệ, ngươi bị bỏ lại để giải quyết hậu quả."
 pod_reconquista_struggle.1020.a: "Khôi phục trật tự càng sớm càng tốt."
 pod_reconquista_struggle.1020.b: "Một gián điệp ngoại đạo?! Cướp bóc và thiêu rụi những gì còn lại để đảm bảo an toàn!"
 pod_reconquista_struggle.1020.c: "Đổ lỗi cho ai đó khác rồi tiếp tục."
   
 pod_reconquista_struggle.3011.t: "Cuộc Canh Thức"
 pod_reconquista_struggle.3011.desc: "El Cid đã có ảnh hưởng sâu sắc đến người Lasombra Cơ Đốc giáo. Lăng mộ của ông đã trở thành nơi thờ phụng cho các kỵ sĩ tương lai với những nghi lễ công phu được gọi là 'Cuộc Canh Thức'. Vì El Cid cũng được [Glossary('Ashirra','game_concept_ashirra_desc')] kính trọng, một cuộc đình chiến không chính thức được thỏa thuận khi những kẻ hành hương sùng đạo di chuyển khắp Iberia để thực hiện bổn phận của họ.\nNhưng đôi khi, và thường xuyên hơn cả hai phe muốn thừa nhận, cuộc đình chiến này không được tôn trọng, và những kẻ lữ hành trở thành nạn nhân khác của cuộc Shadow Reconquista. Một nhóm người Lasombra Cơ Đốc giáo như vậy đang di chuyển qua vùng đất của ngươi, yêu cầu được hưởng hòa bình của El Cid để di chuyển tự do. Ngươi sẽ làm gì?"
 pod_reconquista_struggle.3011.a: "Một phong tục đáng được tôn trọng."
 pod_reconquista_struggle.3011.b: "Một khoản thuế nhỏ để đi qua vùng đất của ta có vẻ hợp lý."
 pod_reconquista_struggle.3011.c: "Những đồng đạo sùng đạo, hãy nhận lấy một đội hộ tống và phước lành của ta."
 pod_reconquista_struggle.3011.d: "Lũ ngốc ngây thơ đang chờ được chuộc lại!"
    
 assamite_struggle: "Một Gia Tộc Chia Rẽ"
 assamite_struggle_desc: "Người Banu Haqim đã cai trị Ba Tư kể từ khi vị thủy tổ huyền thoại của họ, Haqim, sáng lập Alamut. Trong mắt người ngoài, chưa từng có gì ngoài sự thống nhất hoàn hảo giữa họ kể từ thời điểm đó, nhưng sự thật lại hoàn toàn khác.\nChủ nghĩa bè phái đang đe dọa phá vỡ kỷ luật lừng danh của Con Cháu Haqim từ bên trong. Sự xuất hiện của một Eldest mới, Nakurtum gây tranh cãi, có thể là điểm bùng phát. Dù một cuộc nội chiến dường như chưa -thể- xảy ra ngay, mỗi phe giờ đây đang mài giũa dao găm của mình để đảm bảo rằng chính họ, và chỉ họ mà thôi, sẽ định hình tương lai của người Banu Haqim."
  
 pod_assamite_struggle.0501.t: "Một Gia Tộc Chia Rẽ"
 pod_assamite_struggle.0501.desc: "Người Banu Haqim đã cai trị Ba Tư kể từ khi vị thủy tổ huyền thoại của họ, Haqim, sáng lập Alamut. Trong mắt người ngoài, chưa từng có gì ngoài sự thống nhất hoàn hảo giữa họ kể từ thời điểm đó, nhưng sự thật lại hoàn toàn khác.\nChủ nghĩa bè phái đang đe dọa phá vỡ kỷ luật lừng danh của Con Cháu Haqim từ bên trong. Sự xuất hiện của một Eldest mới, Nakurtum gây tranh cãi, có thể là điểm bùng phát. Dù một cuộc nội chiến dường như chưa -thể- xảy ra ngay, mỗi phe giờ đây đang mài giũa dao găm của mình để đảm bảo rằng chính họ, và chỉ họ mà thôi, sẽ định hình tương lai của người Banu Haqim.\nCác phe tranh giành chính cho chiến thắng này là Web of Knives, một giáo phái sát thủ bí mật đầy cuồng tín, [Glossary('Ashirra','game_concept_ashirra_desc')], những kẻ ủng hộ đưa gia tộc đến gần hơn với Hồi giáo, Council of Scrolls, đại diện cho phe ôn hòa và hòa giải, Silsila, một nhóm cựu binh Zoroastrian tinh hoa, và cuối cùng là Lost Tribe, một giáo phái bí ẩn thờ phụng dị giáo.\n #italic Cuộc Xung Đột Một Gia Tộc Chia Rẽ được quyết định bởi ảnh hưởng. Ngươi có thể kiểm tra tiến trình của từng phe bằng một quyết định nhỏ đặc biệt.#!"
 pod_assamite_struggle.0501.a: "Haqim đang dõi theo."
  
 struggle_parameter_unlocks_no_wars: "Không thể trực tiếp gây chiến với các nhân vật tham gia khác."
 NO_WARS_STRUGGLE_PARAMETER_CD: "Ngươi đang ở trong một Giai Đoạn Xung Đột nơi ngươi không thể tấn công nhân vật này."
 
 secure_assamite_foothold_decision_title: "Chỗ Đứng ở Ba Tư"
 secure_assamite_foothold_decision_desc: "Sự chia rẽ của người Banu Haqim ở Ba Tư đang mở ra cơ hội. Chúng sẽ không kịp chuẩn bị trước một mối đe dọa từ bên ngoài."
 secure_assamite_foothold_decision_tooltip: "Sáp nhập một phần Ba Tư"
 secure_assamite_foothold_decision_confirm: "Về tay kẻ mạnh nhất"
  
 pod_assamite_struggle.100.t: "Bình Minh trên Ba Tư"
 pod_assamite_struggle.100.desc: "Dòng Banu Haqim bị chia rẽ đã tạo ra một cơ hội lớn cho những kẻ ngoại lai của Ba Tư. Với lưỡi kiếm chĩa vào nhau, họ đã không hề hay biết mối đe dọa từ bên ngoài cho đến khi đã quá muộn.\nVới ban lãnh đạo mới, Ba Tư đang dần quên đi Web of Knives, Alamut và mọi mối bất hòa của họ. Đây là một kỷ nguyên mới, và thời gian sẽ trả lời liệu kẻ chinh phục mới này có thể khuất phục Ba Tư theo ý muốn của mình, hay sẽ bị đánh gục bởi những cư dân ngoan cố của nó như nhiều kẻ trước đây đã từng."
 pod_assamite_struggle.100.a: "Ba Tư cần một dòng máu mới."

 pod_assamite_struggle.101.desc: "Dòng Banu Haqim bị chia rẽ đã tạo ra một cơ hội lớn cho những kẻ ngoại lai của Ba Tư. Với lưỡi kiếm chĩa vào nhau, họ đã không hề hay biết mối đe dọa từ bên ngoài cho đến khi đã quá muộn.\nVới ban lãnh đạo mới, Ba Tư đang dần quên đi Web of Knives, Alamut và mọi mối bất hòa của họ. Đây là một kỷ nguyên mới, và thời gian sẽ trả lời liệu kẻ chinh phục mới này có thể khuất phục Ba Tư theo ý muốn của mình, hay sẽ bị đánh gục bởi những cư dân ngoan cố của nó như nhiều kẻ trước đây đã từng."
 pod_assamite_struggle.101.a: "Lũ ngoại lai đáng nguyền rủa."
  
 struggle_assamite_phase_shadows: "Gia Đình Bất Hòa"
 struggle_assamite_phase_shadows_desc: "Người Banu Haqim đang chật vật duy trì vẻ ngoài thống nhất. Có sự oán hận trong không khí và những lưỡi dao găm đã tra vỏ khắp nơi."
 struggle_assamite_phase_hostility: "Gia Đình Đổ Vỡ"
 struggle_assamite_phase_hostility_desc: "Haqim hẳn phải rơi lệ khi thấy Con Cháu mình đánh lẫn nhau. Alamut đang sụp đổ từ bên trong."
 struggle_assamite_phase_reprieve: "Gia Đình Hàn Gắn"
 struggle_assamite_phase_reprieve_desc: "Thể hiện sự điềm tĩnh hơn hầu hết ma cà rồng khác, người Banu Haqim giờ đây đang công khai bàn bạc về những bất đồng của họ, hy vọng tìm ra một giải pháp hợp lý cho các vấn đề hiện tại."
   
 urshulgi_victory_objective_decision_tt: "Ảnh hưởng của Web of Knives phải là tuyệt đối."
 urshulgi_victory_objective_decision_tt2: "Ảnh hưởng của Council of Scrolls phải không còn tồn tại."
 assamite_struggle_victory_effect_tooltip: "Ngươi sẽ nhận được [title|E] Alamut nếu chưa có. Hơn nữa, tất cả các nhân vật Assamite trong phạm vi ngoại giao giờ đây sẽ chấp nhận trở thành chư hầu mà không cần thắc mắc."
 assamite_struggle_needed_tt: "Ngươi cần tham gia Cuộc Xung Đột Một Gia Tộc Chia Rẽ, đòi hỏi thủ đô của ngươi phải nằm trong vùng Cuộc Xung Đột Một Gia Tộc Chia Rẽ (các vương quốc de jure của Ba Tư, Transoxiana, Makran, Kabulistan, Daylam, Khorasan/Web of Knives)"
 assamite_victory_objective_decision_tt: "Ảnh hưởng của Web of Knives cần phải không còn tồn tại."
 assamite_victory_objective_decision_tt2: "Ảnh hưởng của Council of Scrolls, hoặc ảnh hưởng của Ashirra, phải là tuyệt đối."
 losttribe_victory_objective_decision_tt: "Ảnh hưởng của Lost Tribe phải là tuyệt đối."
 losttribe_victory_objective_decision_tt2: "Ảnh hưởng của Silsila phải không còn tồn tại."
 losttribe_victory_objective_decision_tt3: "Ảnh hưởng của Ashirra phải không còn tồn tại."
 losttribe_victory_objective_decision_effect_tooltip: "Nhiều người Banu Haqim sẽ cải sang Giáo Phái Zilah và chính Zilah sẽ ban phước cho ngươi, cải thiện nhân vật của ngươi."
 
 losttribe_victory_objective_decision: "Con Cái của Zilah"
 losttribe_victory_objective_decision_desc: "Giáo Phái Zilah từ lâu đã bị trục xuất khỏi nền chính trị của Alamut. Nhưng những tín đồ trung thành của Thế Hệ Thứ Hai không hề dễ bị khuất phục. Đã đến lúc người Banu Haqim phải nhìn thấy tội lỗi của cha mình."
 losttribe_victory_objective_decision_tooltip: "Haqim là một kẻ dối trá cần phải bị phơi bày!"
 losttribe_victory_objective_decision_confirm: "Vinh quang của Zilah được đảm bảo"
  
 pod_assamite_struggle.102.t: "Con Cái của Zilah"
 pod_assamite_struggle.102.desc: "Sự trở lại chậm rãi, được chuẩn bị kỹ lưỡng, của Lost Tribe trong nền chính trị của Alamut đã có tác động sâu sắc đến người Assamite. Từng tận tụy với thủy tổ Haqim của mình, giờ đây họ nguyền rủa Thế Hệ Thứ Ba vì tội ác của họ đối với Thế Hệ Thứ Hai, và đặc biệt là đối với Zilah.\nThe Weeping Stone, được cho là nơi an nghỉ của chính Zilah, đã trở thành một địa điểm hành hương, và nhiều người đã hành trình đến đó để uống những giọt lệ máu chảy ra từ tảng đá, trải nghiệm nỗi thống khổ mà Zilah từng phải chịu đựng từ lâu.\nTrớ trêu thay, nhìn từ bên ngoài, người Assamite vẫn là một giáo phái kỳ lạ tận tụy với một mục đích kỳ lạ. Nhưng từ bên trong, mọi thứ sẽ không bao giờ còn như trước nữa."
 pod_assamite_struggle.102.a: "Chúng ta sẽ báo thù cho tội ác cổ xưa nhất của giống loài mình."
 pod_assamite_struggle.103.a: "Đã đến lúc theo đuổi sự thật."
 pod_assamite_struggle.103.b: "Không bao giờ! Ca ngợi Haqim!"
 pod_assamite_struggle.104.a: "Những sự kiện kỳ lạ cho một gia tộc kỳ lạ."
 pod_assamite_struggle.102.custom: "Nhiều người Banu Haqim sẽ cải sang Giáo Phái Zilah."

 silsila_victory_objective_decision_tt: "Ảnh hưởng của Silsila phải là tuyệt đối."
 silsila_victory_objective_decision_tt2: "Ảnh hưởng của Lost Tribe phải không còn tồn tại."
 silsila_victory_objective_decision_effect_tooltip: "Ngươi sẽ có khả năng mua các quyền yêu sách hiện vật với giá ưu đãi."
 
 silsila_victory_objective_decision: "Trung Tâm Vững Vàng"
 silsila_victory_objective_decision_desc: "Silsila là tầng lớp tinh hoa tinh thần của người Banu Haqim và chịu ảnh hưởng sâu sắc từ giáo lý Zoroastrian. Vị thế của họ đã suy yếu kể từ khi Hồi giáo trỗi dậy, nhưng họ vẫn còn đủ ảnh hưởng để hy vọng vào tương lai."
 silsila_victory_objective_decision_tooltip: "Chúng ta là tầng lớp tinh hoa thực sự của Haqim."
 silsila_victory_objective_decision_confirm: "Đúng như lẽ ra phải vậy"
   
 pod_assamite_struggle.105.t: "Trung Tâm Vững Vàng"
 pod_assamite_struggle.105.desc: "Tầng lớp tăng lữ chiến binh tinh hoa của người Banu Haqim, Silsila, đã liên tục mất dần ảnh hưởng trong nền chính trị của Alamut một thời gian nay, do gắn bó với tôn giáo Zoroastrian đang suy tàn. Sự trở lại tàn bạo của Nakurtum với tư cách Eldest vào năm 1214 cũng không giúp ích gì, khi những phương pháp lãnh đạo tàn nhẫn của bà càng khiến các phe phái khác đoàn kết hơn chống lại phe bảo thủ cũ.\nTuy nhiên điều này đã thay đổi khi Silsila dần dần xoay chuyển được tình thế, lợi dụng sự chia rẽ của các đối thủ và chứng minh cam kết của mình trong việc dập tắt dị giáo để khẳng định vị thế của mình. Không phải mọi thứ đều tốt đẹp đối với tầng lớp nhỏ bé này, nhưng hiện tại, phần còn lại của người Banu Haqim công nhận quyền cai trị của họ và đang tập hợp sau lưng những người thừa kế của Haqim và của Zoroaster."
 pod_assamite_struggle.105.a: "Chúng ta là những kẻ duy nhất xứng đáng cai trị."
 pod_assamite_struggle.106.a: "Truyền thống lại chiến thắng."
 
 assamite_factions_decision: "Tình Hình Cuộc Xung Đột Ba Tư"
 assamite_factions_decision_desc: "Tìm hiểu sức mạnh tương đối hiện tại của mỗi phe trong cuộc xung đột, và cách gây ảnh hưởng đến họ một cách nhanh chóng."
 assamite_factions_decision_tooltip: "Xem tình hình hiện tại của cuộc xung đột Ba Tư."
 assamite_factions_decision_confirm: "Chúng ta đang ở đâu?"
 assamite_factions_tt: "Ngươi sẽ nhận được thông tin về tình hình hiện tại của cuộc xung đột và một số cách để gây ảnh hưởng đến nó khi cần gấp."

 pod_assamite_struggle.107.t: "Tình Hình Cuộc Đấu Tranh"
 pod_assamite_struggle.107.opening: "Cuộc đấu tranh Ngôi Nhà Chia Rẽ xoay quanh các phe phái bên trong Banu Haqim. Sau đây là tình hình hiện tại của họ:"
