 rule_black_death: "$POD_gamerule$ Cái Chết Đen"
 setting_black_death_default: "Cái Chết Đen Mặc Định"
 setting_black_death_default_desc: "Cái Chết Đen sẽ xảy ra vào thế kỷ 14, tàn phá và kìm hãm sự phát triển của thế giới."
 setting_black_death_disabled: "#high Vô Hiệu Hóa Cái Chết Đen#!"
 setting_black_death_disabled_desc: "Cái Chết Đen sẽ không xảy ra"

