 #setting_lasombra_have_black_eyes: "#high Eyes of the Abyss#!"
 #setting_lasombra_have_black_eyes_desc: "Lasombra with 'Oblivion's Sight' have black eyes."

 rule_banu_haqim_darken: "$POD_gamerule$ Lời Nguyền Banu Haqim"
 setting_banu_haqim_default_darken: "#high Sẫm Màu Theo Tuổi Tác#!"
 setting_banu_haqim_default_darken_desc: "Da của Banu Haqim, tức Assamite, sẫm màu dần thành màu đen tuyền như đá vỏ chai khi họ càng già đi."
 setting_banu_haqim_never_darken: "Không Bao Giờ Sẫm Màu"
 setting_banu_haqim_never_darken_desc: "Banu Haqim sẽ không có hiệu ứng thị giác sẫm màu như đá vỏ chai khi họ già đi."

 rule_world_of_darkness: "$POD_gamerule$ Thế Giới Bóng Tối"
 setting_world_of_monsters: "Thế Giới Bóng Tối"
 setting_world_of_monsters_desc: "Hầu hết các nhân vật có lãnh địa đều là sinh vật siêu nhiên hoặc những kẻ săn lùng chúng."
 setting_world_of_minions_and_monsters: "#high Thế Giới Bóng Đêm#!"
 setting_world_of_minions_and_monsters_desc: "Hầu hết các nhân vật có lãnh địa đều là sinh vật siêu nhiên hoặc những kẻ phụng sự hay săn lùng chúng."
 setting_world_of_minions: "#high Thế Giới Tha Hóa#!"
 setting_world_of_minions_desc: "Hầu hết các nhân vật có lãnh địa đều là tay sai của các sinh vật siêu nhiên hoặc những kẻ săn lùng chúng."
 setting_world_of_mortals_player_knows: "#high Thế Giới Bí Mật#!"
 setting_world_of_mortals_player_knows_desc: "Thế giới không hề hay biết về những nỗi kinh hoàng rình rập trong đêm tối, nhưng nhân vật người chơi thì biết quá rõ..."
 setting_world_of_mortals: "#high Thế Giới Ngu Muội#!"
 setting_world_of_mortals_desc: "Hầu hết các nhân vật có lãnh địa đều không hề hay biết về thế giới siêu nhiên, kể cả nhân vật người chơi."
 
 rule_splats: "$POD_gamerule$ Ưu Thế Siêu Nhiên"
 setting_vampires: "#high Vampire: the Masquerade#!"
 setting_vampires_desc: "Kindred nắm giữ phần lớn tước vị có đất."
 setting_hunters: "#high Dark Ages Inquisitor#!"
 setting_hunters_desc: "Phần lớn nhân vật giữ tước vị có đất là thợ săn hoặc quái vật siêu nhiên."
 setting_werewolves: "#high Werewolf: the Apocalypse#!"
 setting_werewolves_desc: "Garou nắm giữ phần lớn tước vị có đất."
 setting_mages: "#high Mage: the Ascension#!"
 setting_mages_desc: "Phần lớn người giữ tước vị có đất là pháp sư đã giác ngộ."
 setting_fae: "#high Changeling: the Dreaming#!"
 setting_fae_desc: "Phần lớn người giữ tước vị có đất là Fae."
 setting_wraiths: "#high Wraith: the Oblivion#!"
 setting_wraiths_desc: "Trò chơi sẽ diễn ra tại [UmbraGlossary('shadowlands')] nơi phần lớn người giữ tước vị có đất là Oan Hồn."
 setting_demons: "#high Demon: the Fallen#!"
 setting_demons_desc: "Phần lớn người giữ tước vị có đất là ác quỷ."
 setting_vampires_vs_werewolves: "#high Nanh và Vuốt#!"
 setting_vampires_vs_werewolves_desc: "Phần lớn nhân vật giữ tước vị có đất là Kindred hoặc Garou."
 setting_vampires_vs_mages: "#high Chiến Tranh Massasa#!"
 setting_vampires_vs_mages_desc: "Phần lớn nhân vật giữ tước vị có đất là Kindred hoặc Pháp Sư."
 setting_mortals: "#high Mortal: the Innocent#!"
 setting_mortals_desc: "Phần lớn tước vị có đất thuộc về người phàm không hề hay biết về Thế Giới Bóng Tối"
 setting_all_splats: "Thế Giới Bóng Tối"
 setting_all_splats_desc: "Mọi sinh vật siêu nhiên hiện có sẽ được đưa vào thế giới."
 
