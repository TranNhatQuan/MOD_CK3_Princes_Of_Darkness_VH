l_english:
 game_rule_category_pod: "Princes of Darkness"
 game_rule_category_pod_graphics: "Đồ họa"

 #POD_gamerule: "#color:{0.7,0,0};glow_color:{1,0,0,0.5} [Concept('princes_of_darkness','PoD:')]#!"
 POD_gamerule: "[Concept('princes_of_darkness','@pod_icon!')]"

 rule_NPC_vampire_ruler_lifestyle_learning: "$POD_gamerule$ Học Hỏi Cổ Xưa"
 setting_NPC_vampire_rulers_do_not_learn_lifestyle_perks: "Trưởng lão không học chiêu trò mới."
 setting_NPC_vampire_rulers_do_not_learn_lifestyle_perks_desc: "Ma Cà Rồng Quân Chủ không do Người Chơi điều khiển KHÔNG học các đặc ân phong cách sống."
 setting_NPC_vampire_rulers_learn_lifestyle_perks: "Trưởng lão học chiêu trò mới."
 setting_NPC_vampire_rulers_learn_lifestyle_perks_desc: "Ma Cà Rồng Quân Chủ không do Người Chơi điều khiển có học các đặc ân phong cách sống sau khi trò chơi bắt đầu."

 rule_pod_lore_restrictions: "$POD_gamerule$ Chế Độ Chơi"
 setting_pod_lore_restrictions_default: "Mặc định"
 setting_pod_lore_restrictions_default_desc: "Một trải nghiệm cân bằng, phù hợp với đa số người chơi."
 setting_pod_lore_restrictions_more: "#high @wod_icon! $game_concept_storyteller_mode$#!"
 setting_pod_lore_restrictions_more_desc: "[storyteller_mode_with_icon|E] đang hoạt động. Một mức #N khó hơn#! dành cho người chơi giàu kinh nghiệm."
 setting_pod_lore_restrictions_less: "#high @haight_icon! $game_concept_samuel_haight_mode$#!"
 setting_pod_lore_restrictions_less_desc: "[samuel_haight_mode_with_icon|E] đang hoạt động. Một mức #N ngớ ngẩn#! dành cho người chơi thích nhân vật siêu năng lực."
 setting_pod_lore_restrictions_custom: "#high @mage_icon! Tùy chỉnh#!"
 setting_pod_lore_restrictions_custom_desc: "Nhận thêm các tùy chọn để bạn tự tinh chỉnh chế độ chơi."

 rule_pod_loyalty: "$POD_gamerule$ Lòng Trung Thành"
 setting_pod_loyalty_default: "Mặc định"
 setting_pod_loyalty_default_desc: "[loyalty_with_icon|E] có yêu cầu quan điểm là #V 0#!."
 setting_pod_loyalty_harsher: "#high @wod_icon! Khó hơn#!"
 setting_pod_loyalty_harsher_desc: "[loyalty_with_icon|E] có yêu cầu quan điểm là #V 50#!."
 setting_pod_loyalty_disabled: "#high @mage_icon! Vô hiệu hóa#!"
 setting_pod_loyalty_disabled_desc: "[loyalty_with_icon|E] bị vô hiệu hóa."

 rule_pod_resonance_diminishing_returns: "$POD_gamerule$ Đường Cong Kinh Nghiệm Resonance"
 setting_pod_resonance_diminishing_returns_disabled: "Vô hiệu hóa"
 setting_pod_resonance_diminishing_returns_disabled_desc: "Lượng kinh nghiệm [resonance|E] nhận được không bị ảnh hưởng bởi các đặc ân $pod_discipline$ của bạn."
 setting_pod_resonance_diminishing_returns_enabled: "#high @wod_icon! Kích hoạt#!"
 setting_pod_resonance_diminishing_returns_enabled_desc: "Lượng kinh nghiệm [resonance|E] nhận được sẽ giảm dần khi bạn có thêm nhiều đặc ân $pod_discipline$."

 rule_pod_losing_golconda: "$POD_gamerule$ Mất Golconda"
 setting_pod_losing_golconda_default: "Luật Mặc Định"
 setting_pod_losing_golconda_default_desc: "Bạn sẽ mất [golconda|E] vì giết người, trộm cắp, phát cuồng, và những hành vi tàn ác. Các cơn suy sụp tinh thần 'Khủng Hoảng [Glossary('Dharma','podgloss.dharma')]' của $POD_splat_kueijin$ sẽ chỉ kích hoạt ở [stress_level|E] 4."
 setting_pod_losing_golconda_harsher: "#high @wod_icon! Luật Khắc Nghiệt Hơn#!"
 setting_pod_losing_golconda_harsher_desc: "Ngoài các luật mặc định, bạn cũng sẽ mất [golconda|E] khi tuyên chiến xâm lược, hoặc khi bạn $pod_Embrace$ một hậu duệ. Các cơn suy sụp tinh thần 'Khủng Hoảng [Glossary('Dharma','podgloss.dharma')]' của $POD_splat_kueijin$ cũng sẽ kích hoạt ở [stress_level|E] 3."

 rule_pod_seek_knowledge_cost_increase: "$POD_gamerule$ Chi phí học năng lực mới"
 setting_pod_seek_knowledge_cost_increase_enabled: "Tăng dần"
 setting_pod_seek_knowledge_cost_increase_enabled_desc: "Mỗi lần bạn bắt đầu một [journey|E] để học một năng lực mới, các Hành Trình sau đó sẽ tăng chi phí."
 setting_pod_seek_knowledge_cost_increase_disabled: "#high @haight_icon! Không Tăng#!"
 setting_pod_seek_knowledge_cost_increase_disabled_desc: "[journeys|E] để học năng lực mới sẽ không tăng chi phí."

 rule_pod_seek_knowledge_limits: "$POD_gamerule$ Điều kiện tiên quyết để học $pod_disciplines$ hiếm"
 setting_pod_seek_knowledge_limits_enabled: "Kích hoạt"
 setting_pod_seek_knowledge_limits_enabled_desc: "Các $pod_disciplines$ ma cà rồng hiếm sẽ yêu cầu bạn đáp ứng một số điều kiện tiên quyết trước khi có thể học."
 setting_pod_seek_knowledge_limits_disabled: "Vô hiệu hóa"
 setting_pod_seek_knowledge_limits_disabled_desc: "Các $pod_disciplines$ ma cà rồng hiếm sẽ không yêu cầu bạn đáp ứng điều kiện tiên quyết nào trước khi có thể học."

 rule_pod_splat_hostility: "$POD_gamerule$ Sự Thù Địch Giữa Các Splat"
 setting_pod_splat_hostility_default: "Mặc định"
 setting_pod_splat_hostility_default_desc: "Một số [splats|E] thù địch với nhau, khiến hầu hết [interactions|E] giữa chúng bị ngăn cản."
 setting_pod_splat_hostility_disabled: "#high @haight_icon! Vô hiệu hóa#!"
 setting_pod_splat_hostility_disabled_desc: "[splats|E] không bị ngăn cản tương tác với nhau (dù vẫn chịu các mức phạt quan điểm và giáo lý về tội ác)."

 rule_pod_charjoin_decisions: "$POD_gamerule$ Quyết Định Tạo Nhân Vật"
 setting_pod_charjoin_decisions_disabled: "Vô hiệu hóa"
 setting_pod_charjoin_decisions_disabled_desc: "Các quyết định và tương tác để thay đổi [splat|E] của bạn (ví dụ như xin được $pod_Embrace$, hoặc trở thành $POD_splat_ghoul$ bằng cách rút máu tù nhân $POD_splat_vampire$) bị vô hiệu hóa trừ khi bạn dùng Trình Tạo Nhân Vật trong game."
 setting_pod_charjoin_decisions_enabled: "#high @haight_icon! Kích hoạt#!"
 setting_pod_charjoin_decisions_enabled_desc: "Các quyết định và tương tác để thay đổi [splat|E] của bạn (ví dụ như xin được $pod_Embrace$, hoặc trở thành $POD_splat_ghoul$ bằng cách rút máu tù nhân $POD_splat_vampire$) được kích hoạt."

 rule_pod_numina_on_birth: "$POD_gamerule$ Numina khi Sinh Ra"
 setting_pod_numina_on_birth_default: "Hạn chế"
 setting_pod_numina_on_birth_default_desc: "Chỉ có người phàm mới có thể nhận đặc điểm [GetTrait('psychic').GetName(GetNullCharacter)] khi sinh ra."
 setting_pod_numina_on_birth_unrestricted: "#high @haight_icon! Không hạn chế#!"
 setting_pod_numina_on_birth_unrestricted_desc: "Bất kỳ nhân vật nào cũng có thể nhận đặc điểm [GetTrait('psychic').GetName(GetNullCharacter)] khi sinh ra."

 rule_pod_sorcery_availability: "$POD_gamerule$ Khả Năng Tiếp Cận #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Pháp Thuật#!#!"
 setting_pod_sorcery_availability_restricted: "Hạn chế"
 setting_pod_sorcery_availability_restricted_desc: "Chỉ $POD_splat_bastet$ và các [splats|E] giống người như $POD_splat_hunter_plural$, $POD_splat_ghoul_plural$ hoặc [GetTrait('kinfolk').GetName(GetNullCharacter)] mới có thể học #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Pháp Thuật#!#!.\nSau khi $pod_Embrace$, nó biến thành [GetTrait('bloodsorcery').GetName(GetNullCharacter)]."
 setting_pod_sorcery_availability_unrestricted: "#high @haight_icon! Không hạn chế#!"
 setting_pod_sorcery_availability_unrestricted_desc: "Bất kỳ [splat|E] nào cũng có thể học #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Pháp Thuật#!#!.\nĐặc điểm này được giữ lại sau khi $pod_Embrace$."

 rule_pod_splat_mixing: "$POD_gamerule$ Pha Trộn Splat"
 setting_pod_splat_mixing_default: "Mặc định"
 setting_pod_splat_mixing_default_desc: "Các hạn chế mặc định về việc pha trộn [splats|E]."
 setting_pod_splat_mixing_haight_mode: "#high @haight_icon! Chế Độ Samuel Haight#!"
 setting_pod_splat_mixing_haight_mode_desc: "Nhiều hạn chế về việc pha trộn [splats|E] được nới lỏng (xem [samuel_haight_mode_with_icon|E] để biết chi tiết)."

 rule_pod_fog_of_war: "$POD_gamerule$ Sương Mù Chiến Tranh"
 setting_pod_fog_of_war_disabled: "Vô hiệu hóa"
 setting_pod_fog_of_war_disabled_desc: "Bạn có hiểu biết hoàn hảo về các kết quả ngẫu nhiên và các nhân vật khác, như trong CK3 nguyên bản."
 setting_pod_fog_of_war_enabled: "#high Kích hoạt#!"
 setting_pod_fog_of_war_enabled_desc: "Nhiều trường hợp siêu-tri-thức giờ đây bị trò chơi che giấu. #clickable Tính năng này vẫn đang trong giai đoạn phát triển, và sẽ có thêm nội dung trong tương lai. Trong lúc này, nên chọn tùy chọn \"Tùy chỉnh\" thay thế.#!"
 #setting_pod_fog_of_war_enabled_desc: "Many instances of meta-knowledge are now hidden by the game, and you won't know anything about other characters until you gather more information first."
 setting_pod_fog_of_war_custom: "#high Tùy chỉnh#!"
 setting_pod_fog_of_war_custom_desc: "Bạn có thể tùy chỉnh loại siêu-tri-thức nào bị che giấu."

 rule_pod_random_outcomes: "$POD_gamerule$ Sương Mù Chiến Tranh: Kết Quả Ngẫu Nhiên"
 setting_pod_random_outcomes_percentages: "Phần trăm"
 setting_pod_random_outcomes_percentages_desc: "Các kết quả ngẫu nhiên được hiển thị dưới dạng phần trăm, như trong CK3 nguyên bản."
 setting_pod_random_outcomes_immersive: "#high Đắm chìm#!"
 setting_pod_random_outcomes_immersive_desc: "Các kết quả ngẫu nhiên được hiển thị dưới dạng ước lượng thô, ví dụ \"Khó xảy ra\" hoặc \"Dễ xảy ra\"."
 setting_pod_random_outcomes_uncertain: "#high Bất định#!"
 setting_pod_random_outcomes_uncertain_desc: "Bạn không nhận được bất kỳ thông tin nào về khả năng xảy ra của các kết quả ngẫu nhiên."

 rule_pod_endgame_delay: "$POD_gamerule$ Trì Hoãn Giai Đoạn Cuối"
 setting_pod_endgame_delay_canon: "Chính Thống"
 setting_pod_endgame_delay_canon_desc: "Các sự kiện giai đoạn cuối sẽ xảy ra vào đúng ngày chính thống của chúng, bắt đầu từ Thời Đại Tòa Dị Giáo năm 1431."
 setting_pod_endgame_delay_100: "#high 100 năm#!"
 setting_pod_endgame_delay_100_desc: "Các sự kiện giai đoạn cuối sẽ bắt đầu #V 100#! năm sau khi trò chơi bắt đầu."
 setting_pod_endgame_delay_50: "#high 50 năm#!"
 setting_pod_endgame_delay_50_desc: "Các sự kiện giai đoạn cuối sẽ bắt đầu #V 50#! năm sau khi trò chơi bắt đầu."
 setting_pod_endgame_delay_20: "#high 20 năm#!"
 setting_pod_endgame_delay_20_desc: "Các sự kiện giai đoạn cuối sẽ bắt đầu #V 20#! năm sau khi trò chơi bắt đầu."
 setting_pod_endgame_delay_2: "#high 2 năm#!"
 setting_pod_endgame_delay_2_desc: "Các sự kiện giai đoạn cuối sẽ bắt đầu #V 2#! năm sau khi trò chơi bắt đầu."
 setting_pod_endgame_delay_random: "#high Ngẫu nhiên#!"
 setting_pod_endgame_delay_random_desc: "Các sự kiện giai đoạn cuối sẽ bắt đầu vào một ngày ngẫu nhiên, từ #V 2#! đến #V 500#! năm sau khi trò chơi bắt đầu."

 rule_age_of_inquisition_difficulty: "$POD_gamerule$ Độ Khó Tòa Dị Giáo"
 setting_age_of_inquisition_difficulty_easy: "#high Tòa Dị Giáo Dễ#!"
 setting_age_of_inquisition_difficulty_easy_desc: "Các Thẩm Tra Viên giai đoạn cuối sẽ hầu như không gây tổn hại gì cho các lãnh địa ma cà rồng."
 setting_age_of_inquisition_difficulty_default: "Tòa Dị Giáo Mặc Định"
 setting_age_of_inquisition_difficulty_default_desc: "Các Thẩm Tra Viên giai đoạn cuối sẽ làm rung chuyển thế giới ma cà rồng, nhưng sau đó dần dần bị đẩy lùi."
 setting_age_of_inquisition_difficulty_hard: "#high Tòa Dị Giáo Tận Thế#!"
 setting_age_of_inquisition_difficulty_hard_desc: "Các Thẩm Tra Viên giai đoạn cuối có khả năng xóa sổ 'nền văn minh' ma cà rồng."

 #rule_web_of_knives_difficulty: "$POD_gamerule$ Web of Knives Deadliness"
 #setting_web_of_knives_difficulty_default: "Default Web of Knives"
 #setting_web_of_knives_difficulty_default_desc: "The Banu Haqim assassins of the Web of Knives will be deadly in their regional strongholds, but their reach won't extent as well in other areas."
 #setting_web_of_knives_difficulty_hard: "#high Deadly Web of Knives#!"
 #setting_web_of_knives_difficulty_hard_desc: "The Banu Haqim assassins of the Web of Knives can now reach their target anywhere in the world, meaning that it's only a matter of time before their accomplish their bloody mission."


