l_english:
 POD_gargoyle_caste_stonewolf_modifier: "Đẳng cấp Gargoyle Chó Đá"
 POD_gargoyle_caste_stonewolf_modifier_desc: "Được tạo ra bởi một thí nghiệm thuật giả kim với một sinh vật giống sói. Rất nguy hiểm với một chú chó tốt."
 POD_gargoyle_caste_shade_modifier: "Đẳng cấp Gargoyle Bóng Ma"
 POD_gargoyle_caste_shade_modifier_desc: "Được tạo ra bởi một thí nghiệm thuật giả kim với một Lasombra."
 POD_gargoyle_caste_scout_modifier: "Đẳng cấp Gargoyle Trinh Sát"
 POD_gargoyle_caste_scout_modifier_desc: "Được tạo ra bởi một thí nghiệm thuật giả kim, giỏi do thám."
 POD_gargoyle_caste_warrior_modifier: "Đẳng cấp Gargoyle Chiến Binh"
 POD_gargoyle_caste_warrior_modifier_desc: "Được tạo ra bởi một thí nghiệm thuật giả kim, giỏi chiến đấu."
 POD_gargoyle_caste_sentinel_modifier: "Đẳng cấp Gargoyle Vệ Binh"
 POD_gargoyle_caste_sentinel_modifier_desc: "Được tạo ra bởi một thí nghiệm thuật giả kim, giỏi canh gác."
 POD_gargoyle_caste_blood_modifier: "Đẳng cấp Gargoyle Hộ Huyết"
 POD_gargoyle_caste_blood_modifier_desc: "Được tạo ra bởi một thí nghiệm thuật giả kim với một Tremere. Liệu cái giá của những kẻ đúc phép có đáng không?"
 POD_gargoyle_caste_caryatid_modifier: "Đẳng cấp Gargoyle Caryatid"
 POD_gargoyle_caste_caryatid_modifier_desc: "Được tạo ra bởi một thí nghiệm thuật giả kim với một Toreador, một bức tượng đẹp đẽ nhưng chết chóc."
 POD_gargoyle_caste_boyar_modifier: "Đẳng cấp Gargoyle Boyar"
 POD_gargoyle_caste_boyar_modifier_desc: "Được tạo ra bởi một thí nghiệm thuật giả kim với một Ventrue. Có khả năng chỉ huy thú vật và dẫn dắt các Gargoyle khác."
 POD_gargoyle_caste_chatterer_modifier: "Đẳng cấp Gargoyle Lải Nhải"
 POD_gargoyle_caste_chatterer_modifier_desc: "Được tạo ra bởi một thí nghiệm thuật giả kim với một Malkavian. Tiếng ồn không ngớt của chúng có thể đẩy nhiều kẻ đến điên loạn."
 POD_gargoyle_caste_bingmayong_modifier: "Đẳng cấp Gargoyle Bingmayong"
 POD_gargoyle_caste_bingmayong_modifier_desc: "Được tạo ra bởi một thí nghiệm thuật giả kim với một [GetTrait('kueijin').GetName( GetNullCharacter )], một tạo vật làm từ vật liệu kỳ lạ phương Đông."
 POD_gargoyle_caste_bone_modifier: "Đẳng cấp Gargoyle Rắn Xương"
 POD_gargoyle_caste_bone_modifier_desc: "Được tạo ra bởi một thí nghiệm thuật giả kim với một Cappadocian."
 POD_gargoyle_caste_onyx_cat_modifier: "Đẳng cấp Gargoyle Mèo Onyx"
 POD_gargoyle_caste_onyx_cat_modifier_desc: "Được tạo ra bởi một thí nghiệm thuật giả kim với một bastet."
 POD_gargoyle_caste_golden_manticore_modifier: "Đẳng cấp Gargoyle Manticore Vàng"
 POD_gargoyle_caste_golden_manticore_modifier_desc: "Được tạo ra bởi một thí nghiệm thuật giả kim với một bastet của bộ tộc Simba."
 POD_gargoyle_caste_serpent_modifier: "Đẳng cấp Gargoyle Rắn Cát"
 POD_gargoyle_caste_serpent_modifier_desc: "Được tạo ra bởi một thí nghiệm thuật giả kim với một Tín Đồ của Set."
 POD_gargoyle_caste_fairy_modifier: "Đẳng cấp Gargoyle Tiên Yêu"
 POD_gargoyle_caste_fairy_modifier_desc: "Được tạo ra bởi một thí nghiệm thuật giả kim với một trong những Fair Folk."
 POD_gargoyle_caste_kintsugi_modifier: "Đẳng cấp Gargoyle Kintsugi"
 POD_gargoyle_caste_kintsugi_modifier_desc: "Lần đầu được tạo ra bởi sự dung hợp giả kim giữa một Kizoku và Bushi, Kintsugi giống như đồ sứ tinh xảo bị vỡ rồi được phục hồi."
 POD_gargoyle_caste_rogata_modifier: "Đẳng cấp Gargoyle Rogata"
 POD_gargoyle_caste_rogata_modifier_desc: "Lần đầu được tạo ra bởi sự tổng hợp thuật giả kim giữa Bushi và Chibo, Monomi, hoặc Kishu, Rogata giống như những bức tượng Gang Đúc."
 POD_gargoyle_caste_totai_modifier: "Đẳng cấp Gargoyle Totai"
 POD_gargoyle_caste_totai_modifier_desc: "Lần đầu được tạo ra bởi nghi thức tạo hình thịt giữa Kizoku và Chibo, Monomi, hoặc Kishu, Totai được đặt tên theo những con búp bê gốm mà chúng giống."
 
 

