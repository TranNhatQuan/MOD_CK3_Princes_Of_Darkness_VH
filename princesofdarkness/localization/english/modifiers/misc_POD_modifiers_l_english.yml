l_english:
 inspiration_modifier: "Được Truyền Cảm Hứng"
 soul_crushed_modifier: "Tâm Hồn Tan Vỡ"
 soul_crushed_modifier_desc: "Ma cà rồng này gần như không còn chấp nhận kiếp bất tử của mình nữa, cứ máy móc làm hết việc này đến việc khác"
 POD_childe_dislike_opinion: "Không Ưa Lời Dạy Của Ngươi"
 isolated_modifier: "Bị Cô Lập"
 isolated_modifier_desc: "Ngươi đã tách mình ra cùng childe của mình, để đảm bảo hắn hiểu được vài... nguyên tắc cốt lõi."
 left_alone_modifier: "Bị Bỏ Mặc"
 left_alone_modifier_desc: "Như một phép thử đức tin, ngươi để cộng đồng này tự vận hành mà không can thiệp; và điều đó thực ra có vài lợi ích."
 POD_childe_like_opinion: "Thích Lời Dạy Của Ngươi"
 helpful_diplomat_childe_modifier: "Childe Ngoại Giao Đắc Lực"
 helpful_diplomat_childe_modifier_desc: "Childe của ngươi đã gây ấn tượng tốt tại nhiều triều đình, giúp ngươi có được tình bằng hữu của họ một thời gian."
 helpful_childe_modifier: "Childe Đắc Lực"
 helpful_childe_modifier_desc: "Childe của ngươi đã trợ giúp rất nhiều trong mọi việc quốc sự, cải thiện khả năng cai quản của ngươi."
 helpful_steward_childe_modifier: "Childe Quản Gia Đắc Lực"
 helpful_steward_childe_modifier_desc: "Childe của ngươi có vài dự án mở rộng cho các triều đình mới có thể hữu ích."
 helpful_intrigue_childe_modifier: "Childe Mưu Sĩ Đắc Lực"
 helpful_intrigue_childe_modifier_desc: "Childe của ngươi như một phiên bản thứ hai của ngươi, luôn mưu tính vì lợi ích của chính ngươi."
 exemplar_childe_modifier: "Cai Trị Bằng Nỗi Sợ"
 exemplar_childe_modifier_desc: "Nhân vật này đã chứng minh rằng có rất ít giới hạn hắn sẽ không vượt qua để giữ quyền lực."
 martial_mentor_modifier: "Sư Phụ Chiến Lược"
 martial_mentor_modifier_desc: "Một vị tướng lĩnh xuất chúng nay đang dìu dắt nhân vật này."
 not_so_shadowy_modifier: "Không Còn Kín Đáo"
 not_so_shadowy_modifier_desc: "Cá nhân này đã làm lộ tính bí mật của nhiệm vụ."
 disrespected_subordinates_modifier: "Sỉ Nhục Thuộc Hạ"
 disrespected_subordinates_modifier_desc: "Cá nhân này đã bắt thuộc hạ của mình làm một việc nhục nhã khiến họ oán hận."
 profanated_holy_relic_modifier: "Báng Bổ Thánh Vật"
 profanated_holy_relic_modifier_desc: "Cá nhân này đã không giữ đủ lòng thành kính khi được giao phó một thánh vật."
 flawless_presentation_modifier: "Trình Diễn Hoàn Hảo"
 flawless_presentation_modifier_desc: "Màn trình diễn của childe ngươi đã gây ấn tượng ngay cả với những chư hầu khó tính nhất của ngươi."
 laying_back_modifier: "Nghỉ Ngơi"
 laying_back_modifier_desc: "Ngươi đang thư thái một thời gian. Ngươi hoàn toàn xứng đáng với điều đó!"
 byzantine_community_modifier: "Cộng Đồng Byzantine"
 byzantine_community_modifier_desc: "Một nhóm nhỏ người tị nạn Byzantine, gồm cả $pod_cainites$ lẫn Kine, đã tìm được nơi trú ẩn trong lãnh địa của ngươi. Họ biết ơn vì được che chở."
 shard_hagia_modifier: "Mảnh Vỡ Của Hagia Sophia"
 shard_hagia_modifier_desc: "Một phần nhỏ của nơi từng là sào huyệt của một trong những ma cà rồng vĩ đại nhất thời đại này, Michael. Ngươi gần như có thể lạc mất bản thân trong đó..."
 roderigo_step1_modifier: "Lời Dạy Của Roderigo"
 roderigo_step1_modifier_desc: "Vị pháp sư trầm lặng có quá nhiều điều để dạy ngươi. Ngươi chỉ cần một bước nhảy của lòng tin..."
 roderigo_step2_modifier: "Trí Tuệ Của Roderigo"
 roderigo_step2_modifier_desc: "Ngươi biết nhiều hơn trước đây rất nhiều! Nhưng vẫn còn vài sự thật ẩn giấu đủ gần để ngươi cảm nhận được..."
 roderigo_step3_modifier: "Chân Lý Của Roderigo"
 roderigo_step3_modifier_desc: "Ngươi biết chân lý nguyên thủy về sự sống và cái chết. Giá như ngươi có thể nhớ được nó..."
 hunted_by_wolves_modifier: "Bị Săn Đuổi"
 hunted_by_wolves_modifier_desc: "Những Lupine đáng sợ theo dõi từng bước chân ngươi, chờ đợi sơ hở. Ngươi hiện chỉ cần đánh lạc hướng chúng."
 loose_wolves_modifier: "Sói Sổng Chuồng"
 loose_wolves_modifier_desc: "Người sói đang hoành hành khắp vùng nông thôn, đôi khi còn tấn công trực tiếp vào thành thị."
 crisis_of_faith_modifier: "Khủng Hoảng Đức Tin"
 crisis_of_faith_modifier_desc: "Ngươi đã mất đức tin, và không thể dùng các năng lực Đức Tin Chân Chính"
 fiend_lover_modifier: "Kẻ Yêu Ác Quỷ"
 fiend_lover_modifier_desc: "Người này đã phản bội chính nghĩa một cách khó hiểu bằng cách thả một tôi tớ của Địa Ngục khỏi nơi giam cầm."
 tracked_down_modifier: "Bị Truy Lùng"
 tracked_down_modifier_desc: "Tung tích của cá nhân này đã bị một bên thù địch nắm rõ\n#weak Cho phép hoàn thành ngay lập tức [journey|E] Tìm Sào Huyệt nhắm vào mục tiêu#!"
 endo_holyweapon_modifier: "Vũ Khí Thánh"
 endo_holyweapon_modifier_desc: "Người này được trang bị một vũ khí thấm đẫm sức mạnh thần thánh."
 serpent_garden_modifier: "Rắn Trong Khu Vườn"
 serpent_garden_modifier_desc: "Con Rắn đã quay lại Avalon. Các vị Nam Tước không hài lòng."
 truce_of_tuzfold_modifier: "Đình Chiến Tuzfold"
 truce_of_tuzfold_modifier_desc: "Nền hòa bình trắng nhục nhã mà ngươi buộc phải ký khiến ngươi trông yếu đuối trước các chư hầu đầy tham vọng."
 cowed_by_trial_modifier: "Thất Bại Trong Phiên Tòa Chiến Tranh"
 cowed_by_trial_modifier_desc: "Vladimir Rustovitch đã nghiền nát lực lượng của ngươi bằng một loạt màn thể hiện tài thao lược táo bạo. Ngươi không còn ở tư thế để lật đổ hắn."
 emboldened_by_trial_modifier: "Chiến Thắng Trong Phiên Tòa Chiến Tranh"
 emboldened_by_trial_modifier_desc: "Ngươi đã nghiền nát mọi nỗ lực của Vladimir Rustovitch nhằm kìm hãm quyền lực đang lớn mạnh của ngươi. Có lẽ đã đến lúc ra tay?"
 tremere_politics_modifier: "Chính Trị Tremere"
 tremere_politics_modifier_desc: "Luôn có ai đó ở vị trí cao hơn ngươi trong Kim Tự Tháp"
 spent_from_call_modifier: "Kiệt Sức Vì Triệu Hồi"
 spent_from_call_modifier_desc: "Việc gọi childe của ngươi trở về đã gây tổn hao."
 confused_by_roque_modifier: "Rối Trí"
 confused_by_roque_modifier_desc: "Ngươi đã trở thành mục tiêu của một âm mưu vô lý dường như chẳng có điểm đầu hay điểm cuối. Chuyện quái gì đang xảy ra vậy?"
 restored_autorithy_modifier: "Uy Quyền Được Khôi Phục"
 restored_autorithy_modifier_desc: "$pod_clan$ Lasombra không thể phủ nhận vị trí lãnh đạo của ngươi thêm nữa."
 targeted_by_baali_modifier: "Tin Đồn Ác Ý"
 targeted_by_baali_modifier_desc: "Ngươi là mục tiêu của một chiến dịch tung tin sai lệch độc ác."
 black_spiraled_modifier: "Cơn Điên Của Xoáy Đen"
 black_spiraled_modifier_desc: "Ngươi đã thấy những thứ mà không phàm nhân, cũng không ma cà rồng nào nên thấy."
 black_spiraled_good_modifier: "Sức Mạnh Của Xoáy Đen"
 black_spiraled_good_modifier_desc: "Ngươi đã chịu đựng được cơn điên của Black Spiral và trở nên mạnh mẽ hơn sau đó"
 
