 demonic_feature_antennae_modifier: "Râu"
 demonic_feature_antennae_modifier_desc: "Kẻ sở hữu mọc ra một đôi râu giống côn trùng giúp cảm nhận môi trường xung quanh."
 demonic_feature_claws_modifier: "Móng Vuốt"
 demonic_feature_claws_modifier_desc: "Nhân vật mọc ra móng vuốt ma quỷ."
 demonic_feature_demon_armor_modifier: "Áo Giáp Ma Quỷ"
 demonic_feature_demon_armor_modifier_desc: "Áo giáp ma quỷ có thể xuất hiện dưới dạng vảy, áo giáp samurai lộng lẫy, hoặc bất cứ hình dạng nào khác, và mang lại khả năng bảo vệ tốt hơn trước các đòn tấn công."
 demonic_feature_demon_weapon_modifier: "Vũ Khí Ma Quỷ"
 demonic_feature_demon_weapon_modifier_desc: "Một vũ khí huyền bí xuất hiện trong tay nhân vật. Vũ khí này có thể bừng cháy với Khí, phát ra những tiếng rên rỉ kinh hoàng, phủ đầy những khuôn mặt nhăn nhó, v.v."
 demonic_feature_enlarged_body_parts_modifier: "Bộ Phận Cơ Thể Phình To"
 demonic_feature_enlarged_body_parts_modifier_desc: "Một bộ phận cơ thể của nhân vật phình to hơn bình thường rất nhiều, thường phủ đầy vết loét hoặc chằng chịt những mạch máu xấu xí."
 demonic_feature_eyes_of_horror_modifier: "Mắt Kinh Hoàng"
 demonic_feature_eyes_of_horror_modifier_desc: "Đôi mắt ma quỷ của nhân vật gợi lên nỗi kinh hoàng và điên loạn cho bất cứ ai nhìn vào chúng."
 demonic_feature_extra_arms_modifier: "Cánh Tay Phụ"
 demonic_feature_extra_arms_modifier_desc: "Hai cánh tay phụ mọc ra từ thân nhân vật, cho phép kỹ năng vật lộn tốt hơn hoặc đơn giản là thực hiện nhiều đòn tấn công hơn bình thường."
 demonic_feature_form_of_the_yamamatsu_modifier: "Hình Dạng Yamamatsu"
 demonic_feature_form_of_the_yamamatsu_modifier_desc: "Thân thể ma quỷ của [GetTrait('kueijin').GetName( GetNullCharacter )] trở nên nhão nhoẹt và chảy xệ, gần như lỏng ở một số chỗ, tạo cho họ một vẻ ngoài biến dạng kinh khủng."
 demonic_feature_foulness_modifier: "Sự Ô Uế"
 demonic_feature_foulness_modifier_desc: "Hình dạng ma quỷ của nhân vật cực kỳ dơ bẩn: có thể phủ đầy máu khô và mảnh thịt, có thể bị bao quanh bởi một đám mây hôi thối, v.v."
 demonic_feature_hive_body_modifier: "Thân Tổ Ong"
 demonic_feature_hive_body_modifier_desc: "Những lỗ nhỏ và hang trên da thân ma quỷ giải phóng ra những sinh vật nhỏ bé, kinh tởm. Rắn, nhện, ong và dơi đều là những biểu hiện thường gặp của sức mạnh kỳ dị này."
 demonic_feature_horns_modifier: "Sừng"
 demonic_feature_horns_modifier_desc: "Nhân vật mọc sừng từ đầu. Sừng có thể ngắn hoặc dài, trơn nhẵn hoặc lởm chởm, thẳng hoặc cong, nhiều nhánh hoặc một nhánh, tùy theo ý muốn của nhân vật."
 demonic_feature_horror_modifier: "Kinh Hoàng"
 demonic_feature_horror_modifier_desc: "Shintai có thể khiến con người chịu hiệu ứng tương tự Mê Sảng.\n#weak Ban [GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip] [modifier|E] cho [knights|E] địch khi hành động như một [commander|E] trong [combat_phase|E], hoặc cho kẻ thù của ngươi trong [single_combat_duel_plural|E].#!"
 demonic_feature_huge_size_modifier: "Kích Thước Khổng Lồ"
 demonic_feature_huge_size_modifier_desc: "Sinh lực của nhân vật tăng lên khi [GetTrait('kueijin').GetName( GetNullCharacter )] đột nhiên phát triển cao từ chín đến mười hai feet."
 demonic_feature_mandibles_modifier: "Hàm Kìm"
 demonic_feature_mandibles_modifier_desc: "Miệng của nhân vật phình to và mọc ra những chiếc răng khủng khiếp, ngà, hoặc thậm chí có thể là hàm kìm giống côn trùng."
 demonic_feature_multiple_heads_modifier: "Nhiều Đầu"
 demonic_feature_multiple_heads_modifier_desc: "Nhân vật mọc thêm một hoặc nhiều đầu, tối đa bảy đầu phụ, mỗi đầu giúp [GetTrait('kueijin').GetName( GetNullCharacter )] cảm nhận môi trường xung quanh tốt hơn."
 demonic_feature_poisoned_fangs_modifier: "Răng Nanh Độc"
 demonic_feature_poisoned_fangs_modifier_desc: "Răng nanh trong miệng nhân vật trở nên đặc biệt to, sắc bén và ăn mòn."
 demonic_feature_spikes_modifier: "Gai Nhọn"
 demonic_feature_spikes_modifier_desc: "Cơ thể nhân vật phủ đầy một trong những thứ sau: gai nhọn, da nhám như cá mập, lông cứng và sắc như dây thép gai, móng, da nóng bỏng hoặc lạnh buốt, dao cạo, gai móc, hoặc mảnh thủy tinh vỡ."
 demonic_feature_spurting_tendrils_modifier: "Xúc Tu Phun Trào"
 demonic_feature_spurting_tendrils_modifier_desc: "Những xúc tu nhỏ, ngón tay hoặc cơ vòng nhô ra từ da của [GetTrait('kueijin').GetName( GetNullCharacter )]."
 demonic_feature_suckers_modifier: "Giác Hút"
 demonic_feature_suckers_modifier_desc: "Cánh tay hoặc các chi khác của nhân vật phủ đầy giác hút giống như những miệng cá mút đá nhỏ."
 demonic_feature_suppurating_pustules_modifier: "Mụn Mủ Lở Loét"
 demonic_feature_suppurating_pustules_modifier_desc: "Thân thể ma quỷ của nhân vật phủ đầy vết loét và vết thương rỉ mủ."
 demonic_feature_tentacles_modifier: "Xúc Tu"
 demonic_feature_tentacles_modifier_desc: "Nhân vật mọc ra những xúc tu ghê tởm phủ đầy chất nhầy."
 demonic_feature_tail_modifier: "Đuôi"
 demonic_feature_tail_modifier_desc: "Nhân vật mọc ra một cái đuôi."
 demonic_feature_the_host_modifier: "Vật Chủ"
 demonic_feature_the_host_modifier_desc: "Những khuôn mặt ma quỷ có răng nanh mọc ra từ lưng, thân và các chi của nhân vật."
 demonic_feature_third_eye_modifier: "Con Mắt Thứ Ba"
 demonic_feature_third_eye_modifier_desc: "Nhân vật mọc ra một con mắt thứ ba giữa trán."
 demonic_feature_wings_modifier: "Đôi Cánh"
 demonic_feature_wings_modifier_desc: "Những cánh giống dơi nhô ra và trải rộng từ lưng nhân vật."
 demonic_feature_wing_spines_modifier: "Gai Cánh"
 demonic_feature_wing_spines_modifier_desc: "Đôi cánh của nhân vật mọc ra những gai nhọn giống ngón tay."
 
