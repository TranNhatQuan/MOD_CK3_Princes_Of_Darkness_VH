l_english:
 difference_engine_modifier: "Máy Sai Phân"
 difference_engine_modifier_desc: "Một cỗ máy tính cơ khí tự động được thiết kế để lập bảng các hàm đa thức."
 aeolipile_modifier: "Bình Aeolipile"
 aeolipile_modifier_desc: "Một tuabin hơi nước hướng tâm đơn giản, không cánh, quay tròn khi bình chứa nước ở giữa được đun nóng."
 antikythera_mechanism_modifier: "Cơ Chế Antikythera"
 antikythera_mechanism_modifier_desc: "Một thiên văn nghi cổ đại Hy Lạp vận hành bằng tay, dùng để dự đoán vị trí thiên thể và nhật nguyệt thực trước hàng chục năm."
 flexible_glass_modifier: "Chén Thủy Tinh Dẻo"
 flexible_glass_modifier_desc: "Chiếc chén được đem thử để đập vỡ, nhưng nó chỉ móp méo chứ không vỡ tan."
 archimedes_death_ray_modifier: "Tia Tử Thần Archimedes"
 archimedes_death_ray_modifier_desc: "Một số lượng lớn gương parabol và khiên chắn được đánh bóng sáng loáng."
 wodden_hawk_modifier: "Diều Gỗ Hình Chim Ưng"
 wodden_hawk_modifier_desc: "Một con diều gỗ do Mặc Tử chế tạo, có thể bay lượn trên bầu trời."
 wodden_ox_modifier: "Trâu Gỗ"
 wodden_ox_modifier_desc: "Một chiếc xe một bánh với hai tay cầm do Gia Cát Lượng sáng tạo."
 lingjen_modifier: "Linh Nhân"
 lingjen_modifier_desc: "Một con rối do Đàn Sư chế tạo, có thể hát múa như người sống."
 south_pointing_chariot_modifier: "Xe Chỉ Nam"
 south_pointing_chariot_modifier_desc: "Một cỗ xe hai bánh cổ xưa của Trung Hoa, mang theo một con trỏ có thể di động để chỉ hướng nam, bất kể xe xoay chuyển thế nào."
 seismoscope_modifier: "Địa Động Nghi"
 seismoscope_modifier_desc: "Địa động nghi của Trương Hành, có thể xác định gần đúng hướng phát ra của trận động đất."
 bhaskaras_wheel_modifier: "Bánh Xe Của Bhāskara"
 bhaskaras_wheel_modifier_desc: "Một cỗ máy chuyển động vĩnh cửu giả thuyết do nhà toán học Ấn Độ Bhāskara II tạo ra."
 
