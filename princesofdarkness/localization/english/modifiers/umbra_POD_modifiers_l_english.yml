 seat_of_burning_waters_modifier: "Học Hỏi Từ Ngai Vàng Nước Cháy"
 seat_of_burning_waters_modifier_desc: "Ngai Vàng Nước Cháy là cung điện của Lãnh Chúa Tươi Cười và cũng là tổng hành dinh của Binh Đoàn Bạo Liệt tại Stygia. Từ nơi đây, Lãnh Chúa Tươi Cười âm mưu chống lại các Lãnh Chúa Tử Thần đồng liêu và vạch ra những kế hoạch lớn lao cho tương lai nhánh Đẳng Cấp của mình."
 seat_of_dust_modifier: "Học Hỏi Từ Ngai Vàng Cát Bụi"
 seat_of_dust_modifier_desc: "Ngai Vàng Cát Bụi là cung điện của Lãnh Chúa Xương Cốt và tổng hành dinh của Binh Đoàn Xương Cốt. Trong khi hầu hết các Ngai Vàng đều có cách để các thành viên Binh Đoàn kết nối lại và giải quyết Đam Mê cùng [Fetters|E] của mình, Ngai Vàng Cát Bụi lại đặc biệt ở chỗ nó thuần túy chỉ phục vụ công việc của Binh Đoàn, cả quân sự lẫn dân sự."
 seat_of_golden_tears_modifier: "Học Hỏi Từ Ngai Vàng Lệ Vàng"
 seat_of_golden_tears_modifier_desc: "Ngai Vàng Lệ Vàng là cung điện của Lãnh Chúa Ăn Mày và tổng hành dinh của Binh Đoàn Bần Cùng. Cũng giống như chính Binh Đoàn ấy, Ngai Vàng Lệ Vàng không ngừng biến đổi khi những u hồn mới từ mọi tầng lớp được thêm vào."
 seat_of_shadows_modifier: "Học Hỏi Từ Ngai Vàng Bóng Tối"
 seat_of_shadows_modifier_desc: "Ngai Vàng Bóng Tối là cung điện của Quý Bà Tro Tàn, thủ lĩnh Binh Đoàn Sắt của Stygia. Từ Ngai Vàng Bóng Tối, Quý Bà Tro Tàn và Binh Đoàn Sắt giám sát phần việc của họ trong Đẳng Cấp bằng cách xây dựng và củng cố hệ thống phòng thủ của Stygia cùng các Vong Thành của nó."
 seat_of_silence_modifier: "Học Hỏi Từ Ngai Vàng Tĩnh Lặng"
 seat_of_silence_modifier_desc: "Ngai Vàng Tĩnh Lặng là cung điện của Lãnh Chúa Trầm Mặc và tổng hành dinh của Binh Đoàn Câm Lặng. Tòa nhà mang một vẻ đẹp giản dị, ngăn nắp, như để đối lập với sự hỗn loạn nội tâm của nhiều cư dân nơi đây."
 seat_of_succor_modifier: "Học Hỏi Từ Ngai Vàng Cứu Rỗi"
 seat_of_succor_modifier_desc: "Ngai Vàng Cứu Rỗi là cung điện của Quý Bà Cười Vui và tổng hành dinh của Binh Đoàn Sám Hối. Đây là một trong số ít cung điện từng bị một Binh Đoàn khác chinh phục, nhưng nhiều người cho rằng chính những điểm yếu ấy cũng là sức mạnh của nó. Nó vừa tồn tại như một pháo đài, vừa như một loại phòng khám nơi các thành viên Binh Đoàn đối diện với cơn điên loạn của chính mình."
 seat_of_thorns_modifier: "Học Hỏi Từ Ngai Vàng Gai Nhọn"
 seat_of_thorns_modifier_desc: "Ngai Vàng Gai Nhọn là cung điện của Lãnh Chúa Lục Bảo và tổng hành dinh của Binh Đoàn Lục Bảo. Nó rực sáng với hàng ngàn tinh thể hỏa hồn xanh lục lấp lánh trên chính tòa nhà, khiến nó nổi bật giữa những sắc xám đen ảm đạm của Stygia và [UmbraGlossary('shadowlands')]. Mỗi tinh thể mang đủ năng lượng để đẩy một u hồn thẳng vào cơn Đại Nạn. Bao quanh vẻ đẹp ấy là một vành đai gai góc có tri giác dày nửa dặm, bảo vệ cung điện khỏi kẻ xâm nhập và tạo thành lớp giáp dày khi bị vây hãm."
 seat_of_fate_modifier: "Học Hỏi Từ Ngai Vàng Định Mệnh"
 seat_of_fate_modifier_desc: "Một dinh thự rộng lớn, trải dài theo phong cách Iberia, Ngai Vàng Định Mệnh vẫn hòa làm một với hòn đảo mà nó tọa lạc. Đáng chú ý nhất là những cái cây mọc trong vô số sân trong của tòa nhà; đây là loại gỗ sống duy nhất tồn tại trong [UmbraGlossary('dark_kingdom_of_iron')] và, cùng với đám sậy dọc theo [UmbraGlossary('river_of_death')], là một trong số ít nguồn cung cấp giấy tại [UmbraGlossaryLocalized('shadowlands','Âm Phủ')]."
 
 jade_palace_modifier: "Đã Ghé Thăm Ngọc Cung"
 jade_palace_modifier_desc: "Ngọc Cung là trung tâm của chính quyền Đế Quốc tại Hoàng Tuyền, tọa lạc giữa lòng một cơn cuồng phong vĩnh cửu trong [UmbraGlossary('tempest')]."
 
 blessed_by_great_celestial_dragons_modifier: "Được Thần Long Vĩ Đại Ban Phước"
 blessed_by_great_celestial_dragons_modifier_desc: "Những thực thể này giống các thế lực của tự nhiên hơn là loài thú."
