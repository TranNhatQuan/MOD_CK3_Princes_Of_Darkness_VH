 doomslayer_modifier_desc: "Kẻ Diệt Vong là một u hồn được chọn để phục vụ một nhóm đặc biệt chuyên về thám hiểm và chiến đấu trong [UmbraGlossary('pod_realm_labyrinth')]. Các Kẻ Diệt Vong có thể được giao bất kỳ nhiệm vụ nào, từ trinh sát đơn giản trong [UmbraGlossary('pod_realm_labyrinth')] cho đến bắt giữ một Bóng Ma cụ thể."
 
