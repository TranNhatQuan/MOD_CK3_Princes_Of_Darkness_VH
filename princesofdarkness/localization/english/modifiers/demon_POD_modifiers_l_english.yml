 halaku_dynasty_modifier: "Tàn Tích Thiên Giới của Halaku"
 halaku_dynasty_modifier_desc: "Từng là thiên tộc vĩ đại của Đêm Sa Ngã, nay chỉ còn lại những tàn tích của những gì nó từng là.\n#help Ban quyền tiếp cận Bí Truyền của Cõi Vô Hình.#!"

 ritual_of_sundered_soul_tt: "#I [modifier|E] này có thể được nâng cấp thông qua quyết định.#!"
 ritual_of_sundered_soul_tt2: "#I Khi chết, ngươi sẽ hồi sinh bằng cách hạ cấp hiệu ứng này. #X;bold Nếu ngươi chết trong khi mang [GetModifier('ritual_of_sundered_soul_unstable_modifier').GetNameWithTooltip], ngươi sẽ bị mắc kẹt trong Vực Thẳm mãi mãi.#!#!"
 ritual_of_sundered_soul_unstable_modifier: "Nghi Thức Linh Hồn Phân Ly Bất Ổn"
 ritual_of_sundered_soul_unstable_modifier_desc: "Nghi Thức Linh Hồn Phân Ly là một phát kiến mới mà Lucifer ban cho đoàn quân sa ngã của hắn, cho phép họ tương tác với thế giới người phàm. Tuy nhiên, sự bất ổn hiện tại của nó khiến đây là một trải nghiệm rất khó chịu.\n\n$ritual_of_sundered_soul_tt$\n\n$ritual_of_sundered_soul_tt2$\n\n"
 ritual_of_sundered_soul_semi_stable_modifier: "Nghi Thức Linh Hồn Phân Ly Chao Đảo"
 ritual_of_sundered_soul_semi_stable_modifier_desc: "Ngươi đã cải tiến thiết kế của Lucifer cho nghi thức này đủ để có thể duy trì hoạt động trên bất kỳ vật chủ nào lâu hơn.\n\n$ritual_of_sundered_soul_tt$\n\n$ritual_of_sundered_soul_tt2$\n\n"
 ritual_of_sundered_soul_modifier: "Nghi Thức Linh Hồn Phân Ly"
 ritual_of_sundered_soul_modifier_desc: "Đủ vững chắc để cho phép ngươi biểu hiện thêm sức mạnh của mình trên Trái Đất, nghi thức này đang chứng tỏ là một tài sản ngày càng mạnh mẽ hơn.\n\n$ritual_of_sundered_soul_tt$\n\n$ritual_of_sundered_soul_tt2$\n\n"
 ritual_of_sundered_soul_stabilized_modifier: "Nghi Thức Linh Hồn Phân Ly Ổn Định"
 ritual_of_sundered_soul_stabilized_modifier_desc: "Ngươi đã hoàn thiện ý tưởng khả thi mà Lucifer từng ban cho đoàn quân sa ngã. Giờ đây uy nghi thực sự của ngươi có thể được hiển lộ trước thế gian.\n\n$ritual_of_sundered_soul_tt2$\n\n"
 ritual_of_sundered_soul_exalted_modifier: "Nghi Thức Linh Hồn Phân Ly Siêu Việt"
 ritual_of_sundered_soul_exalted_modifier_desc: "Không còn phụ thuộc vào vật chủ người phàm, thay vào đó ngươi đã buộc linh hồn mình vào một hình hài vĩnh cửu do chính mình tạo ra. Thế gian rung chuyển khi ngươi để lại dấu ấn của mình lên nó.\n\n$ritual_of_sundered_soul_tt2$\n\n"

 POD_shapeshift_form_apocalyptic_angelic_modifier: "Hình Dạng Khải Huyền Thiên Thần"
 POD_shapeshift_form_apocalyptic_damned_modifier: "Hình Dạng Khải Huyền Đọa Đày"
 
 arsenal_of_the_beast_claws_modifier: "Móng Vuốt"
 arsenal_of_the_beast_claws_modifier_desc: "Móng tay của nhân vật dài ra như móng vuốt cong của loài chim săn mồi hoặc móng vuốt có thể thu vào của loài mèo."
 arsenal_of_the_beast_fangs_modifier: "Nanh"
 arsenal_of_the_beast_fangs_modifier_desc: "Răng của nhân vật mọc sắc nhọn như răng sói hoặc các loài dã thú lớn khác, hoặc có lẽ họ mang một chiếc mỏ của loài chim săn mồi."
 arsenal_of_the_beast_gaping_maw_modifier: "Miệng Há Rộng"
 arsenal_of_the_beast_gaping_maw_modifier_desc: "Hàm của nhân vật tháo khớp hoặc đơn giản là phình to đến mức không tưởng, phô bày hàng hàng lớp lớp răng nanh sáng loáng."
 arsenal_of_the_beast_horns_modifier: "Sừng"
 arsenal_of_the_beast_horns_modifier_desc: "Nhân vật mọc ra cặp sừng dê điển hình, gạc như hươu đực, những gai xương phi tự nhiên nhô ra từ hộp sọ hoặc một số phần mọc khác cho phép thực hiện các đòn húc."
 arsenal_of_the_beast_lashing_tail_modifier: "Đuôi Quất"
 arsenal_of_the_beast_lashing_tail_modifier_desc: "Nhân vật mang một chiếc đuôi cơ bắp mạnh mẽ."
 arsenal_of_the_beast_poison_modifier: "Chất Độc"
 arsenal_of_the_beast_poison_modifier_desc: "Cơ thể của nhân vật sản sinh ra một loại nọc độc chết người."
 arsenal_of_the_beast_venom_spit_modifier: "Phun Nọc Độc"
 arsenal_of_the_beast_venom_spit_modifier_desc: "Nhân vật có một tuyến nọc độc trong cổ họng cho phép họ phun ra chất độc."
 arsenal_of_the_beast_spines_modifier: "Gai"
 arsenal_of_the_beast_spines_modifier_desc: "Các gai xương hoặc lông nhọn nhô ra từ da của nhân vật."
 arsenal_of_the_beast_tentacles_modifier: "Xúc Tu"
 arsenal_of_the_beast_tentacles_modifier_desc: "Nhân vật có một xúc tu dài hoặc một chiếc đuôi có thể cầm nắm."
 arsenal_of_the_beast_wings_modifier: "Cánh"
 arsenal_of_the_beast_wings_modifier_desc: "Nhân vật mọc ra đôi cánh lớn từ lưng, khi xòe hết cỡ có chiều dài gấp rưỡi chiều cao của nhân vật."
 
 implacable_vengeance_perk_modifier: "Báo Thù Không Khoan Nhượng"
 
 unknown_eminence_modifier: "Danh Vọng Vô Danh"
 unknown_eminence_modifier_desc: "Ngươi đã bị người phàm, Chúa Trời và quỷ dữ lãng quên. Thiên Danh của ngươi không còn gợi lên nỗi sợ hãi hay sự kính trọng nào nữa."
 known_eminence_modifier: "Danh Vọng Được Biết Đến"
 known_eminence_modifier_desc: "Thiên Danh của ngươi nghe quen thuộc với nhiều quỷ dữ, dù chúng không nhớ mục đích hay thành tựu ban đầu của ngươi."
 respected_eminence_modifier: "Danh Vọng Được Kính Trọng"
 respected_eminence_modifier_desc: "Hầu hết quỷ dữ có lẽ đã nghe đến tên ngươi và nhiều kẻ có ý niệm sơ lược về những gì ngươi đã làm trước cuộc nổi loạn, dù chỉ qua sự liên hệ chung chung."
 honored_eminence_modifier: "Danh Vọng Được Tôn Vinh"
 honored_eminence_modifier_desc: "Ngươi từng nắm giữ vị trí quyền lực trên một nhóm thiên thần khác trước và trong cuộc nổi loạn. Một khía cạnh cụ thể nào đó của Sáng Thế thuộc quyền thiết kế hoặc duy trì của ngươi, bao gồm một số khái niệm, sinh vật hoặc vật thể tổng hợp."
 powerful_eminence_modifier: "Danh Vọng Uy Quyền"
 powerful_eminence_modifier_desc: "Từng có lúc, ngươi chỉ huy các huynh đệ của mình trong việc sáng tạo ra một thành phần thiết yếu nào đó của vũ trụ. Có lẽ chính những thiết kế của công trình này là của ngươi, và ngươi từng nổi danh khắp thiên binh vì sự khéo léo và tầm nhìn của mình."
 exalted_eminence_modifier: "Danh Vọng Siêu Việt"
 exalted_eminence_modifier_desc: "Vào lúc khởi thủy, có Lời, và ngươi nằm trong số những âm tiết tiếp theo được Người thốt ra. Ngươi từng chỉ huy cả một binh đoàn sáng thế và đứng bên Lucifer như một trong những sĩ quan được hắn chọn lựa trong cuộc nổi loạn. Mọi quỷ dữ đều biết đến ngươi và biết Thiên Danh của ngươi, dù chúng có nhớ lý do hay không."
 
