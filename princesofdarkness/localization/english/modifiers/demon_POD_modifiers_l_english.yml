 neberu_dynasty_modifier: "Tàn Tích Thiên Giới của Neberu"
 neberu_dynasty_modifier_desc: "Từng là Thiên Tộc vĩ đại của Các Thiên Cầu, nay chỉ còn lại những tàn tích của những gì nó từng là.\n#help Ban quyền tiếp cận Bí Truyền của Nhà Tiên Tri.#!"
 lammasu_dynasty_modifier: "Tàn Tích Thiên Giới của Lammasu"
 lammasu_dynasty_modifier_desc: "Từng là Thiên Tộc vĩ đại của Vực Sâu, nay chỉ còn lại những tàn tích của những gì nó từng là.\n#help Ban quyền tiếp cận Bí Truyền của Vẻ Đẹp.#!"
 rabisu_dynasty_modifier: "Tàn Tích Thiên Giới của Rabisu"
