 namaru_dynasty_modifier: "Tàn Tích Thiên Giới của Namaru"
 namaru_dynasty_modifier_desc: "Từng là Thiên Tộc vĩ đại của Sao Mai, nay chỉ còn lại những tàn tích của những gì nó từng là.\n#help Ban quyền tiếp cận Bí Truyền của Sứ Giả.#!"
