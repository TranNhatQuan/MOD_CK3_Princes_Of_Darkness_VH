 lifeblood_addiction_modifier: "Nghiện Huyết Mạch"
 lifeblood_addiction_modifier_desc: "Ma cà rồng thèm khát dòng máu mãnh liệt chảy trong huyết quản của xác ướp, nhưng những ma cà rồng vô nhân tính đặc biệt khinh miệt “sự yếu đuối đạo đức” mà việc uống máu xác ướp gợi lên trong chúng. Một ma cà rồng đã nghiện máu xác ướp về mặt tâm lý sẽ nhanh chóng thoái hóa thành quái vật."

