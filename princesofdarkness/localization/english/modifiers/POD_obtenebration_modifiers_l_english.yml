l_english:

 nocturne_power_modifier: "Dạ Khúc"
 nocturne_power_modifier_desc: "Nhân vật này tỏa ra một bóng tối khủng khiếp bao trùm kẻ thù lân cận và rút cạn sinh lực của chúng."
 nocturne_drained_stamina_modifier: "[battle_modifier|E]: Thể Lực Bị Rút Cạn"
 nocturne_drained_stamina_modifier_desc: "Thể lực của nhân vật này đã bị một đám mây bóng tối khủng khiếp rút cạn."
 darkness_within_drained_stamina_modifier: "[battle_modifier|E]: Bóng Tối Nội Tại"
 darkness_within_drained_stamina_modifier_desc: "Thể lực và máu của nhân vật này đã bị một đám mây bóng tối khủng khiếp rút cạn."
 devour_all_hope_drained_stamina_modifier: "[battle_modifier|E]: Nuốt Chửng Mọi Hy Vọng"
 devour_all_hope_drained_stamina_modifier_desc: "Một lượng lớn thể lực và máu của nhân vật này đã bị một đám mây bóng tối khủng khiếp rút cạn."

 drain_the_life_power_modifier: "Sinh Lực Bị Rút Cạn"
 drain_the_life_power_modifier_desc: "Khu vực này bị bao trùm bởi bóng tối nuốt chửng mọi thứ nó chạm vào"

 shadow_twin_modifier: "Bóng Song Sinh"
 shadow_twin_modifier_desc: "Nhân vật này là một Bóng Song Sinh, một sinh vật được tạo ra từ bóng tối với một phần sức mạnh của chủ nhân nó."