 ### Objective Reward Modifiers
 covenant_of_life_and_death_modifier: "Ước Giao Sự Sống và Cái Chết"
 covenant_of_life_and_death_modifier_desc: "Thông qua các nghi thức hoại linh cổ xưa, Impundulu đã đổi mới ước giao của mình với dòng dõi Bomkazi. Mối liên kết giữa nữ phù thủy còn sống và pháp sư hoại linh bất tử chưa bao giờ bền chặt hơn thế."

 ishologu_modifier: "The Ishologu"
 ishologu_modifier_desc: "Sau khi phá vỡ ước giao cổ xưa thông qua Nghi Thức Ishologu, ma cà rồng này không còn bị ràng buộc với các nữ phù thủy Bomkazi nữa. Được tự do khỏi giới hạn về săn máu, nhưng cũng bị cắt đứt khỏi nguồn sinh lực pháp thuật từng nuôi dưỡng họ."

 ### Opinion Modifiers
 fellow_scholar_of_death_modifier: "Đồng Môn Học Giả Về Cái Chết"

 ### Event Modifiers
 memory_of_bomkazi_modifier: "Ký Ức Về Bomkazi"
 memory_of_bomkazi_modifier_desc: "Ký ức về Bomkazi, nữ phù thủy vợ đầu tiên, vẫn còn vương vấn. Sự hy sinh của bà vọng vang qua bao thời đại."

 withering_blood_urgency_modifier: "Dòng Máu Đang Suy Tàn"
 withering_blood_urgency_modifier_desc: "Dòng dõi Bomkazi ngày càng suy yếu qua từng thế hệ. Phải làm điều gì đó trước khi các nữ phù thủy phàm nhân biến mất hoàn toàn."

 ### Trigger Tooltips
 POD_impundulu_has_bomkazi_courtier_tt: "Có một [GetTrait('bomkazi_witch').GetName(GetNullCharacter)] trong triều đình của bạn"
 POD_impundulu_has_completed_withering_blood_tt: "Đã hoàn thành mục tiêu 'Chữa Trị Dòng Máu Đang Suy Tàn'"
 