l_english:
 house_hardestadt_modifier: "Gia Tộc Hardestadt"
 house_hardestadt_modifier_desc: "Tuy có huyết thống mập mờ với vị thủy tổ Ventrue, Gia Tộc Hardestadt đã chứng tỏ một tài năng cai trị chưa từng thấy kể từ những đêm trường của La Mã Ventrue."
 house_nabonidus_modifier: "Gia Tộc Nabonidus"
 house_nabonidus_modifier_desc: "Dòng dõi ẩn dật này của Assamite được biết đến với khả năng khơi dậy lòng tin sâu sắc nơi những kẻ đi theo, dù cho những thú vui kỳ dị mà nó dường như theo đuổi."
 house_shahiri_modifier: "Gia Tộc Sha'hiri"
 house_shahiri_modifier_desc: "Dòng dõi của vị Trưởng Lão được chính Haqim chọn làm người kế vị là lựa chọn đồng thuận cho $pod_clan$ vốn đang chia rẽ. Dù cũng có thể vì Sha'hiri được biết đến như một kẻ khá dễ bị lấn át."
 house_anath_modifier: "Gia Tộc Anath"
 house_anath_modifier_desc: "Nữ Hoàng Chiến Tranh và Tình Yêu là một nhân vật đầy bí ẩn, nhưng con cháu của bà đã đạt được những chiến tích lớn lao cả trong ngoại giao lẫn chinh chiến. Tuy nhiên, họ cũng nổi tiếng là khá liều lĩnh và bộc trực."
 house_jamal_modifier: "Gia Tộc Jamal"
 house_jamal_modifier_desc: "Vị thủ lĩnh không khoan nhượng của phe [Glossary('Ashirra','game_concept_ashirra_desc')] trong $pod_clan$ Assamite là một chiến binh vô song. Nhưng ông lại không nổi tiếng vì sự kiên nhẫn đối với những kẻ ngoại đạo."
 house_urshulgi_modifier: "Gia Tộc Ur'Shulgi"
 house_urshulgi_modifier_desc: "Dòng dõi của Mục Tử Đen là một điều bí ẩn. Và vì lợi ích của tất cả, nó nên tiếp tục là một bí ẩn chưa lời giải."
 house_thetmes_modifier: "Gia Tộc Thetmes"
 house_thetmes_modifier_desc: "Con Nhện có những mưu kế lồng trong mưu kế. Và không có thời gian để bận tâm đến những chuyện vặt vãnh như việc cai trị."
 house_anosh_modifier: "Gia Tộc Anosh"
 house_anosh_modifier_desc: "Bị cả $pod_clan$ ruồng bỏ, dòng dõi Anosh là dòng dõi của những khải tượng và những cuộc thử nghiệm vào cõi vô định."
 house_azrael_modifier: "Gia Tộc Azrael"
 house_azrael_modifier_desc: "Những chiến binh giỏi nhất của một $pod_clan$ chiến binh tự mình ra tay."
 house_nakurtum_modifier: "Gia Tộc Nakurtum"
 house_nakurtum_modifier_desc: "Nakurtum liều lĩnh và nóng nảy đã chinh phục $pod_clan$ Assamite như một cơn bão. Bà đòi hỏi sự tận tụy đúng mực từ thuộc hạ nhưng lại chật vật để có được điều đó."
 house_abuilaf_modifier: "Gia Tộc Abu Ilaf"
 house_abuilaf_modifier_desc: "Chi hệ nhỏ bé của một hậu duệ ít quan trọng của Haqim chủ yếu sản sinh ra những kẻ tầm đạo tận tụy, thường sống ẩn dật và khép kín."
 house_shango_modifier: "Gia Tộc Shango"
 house_shango_modifier_desc: "Là những bậc trị vì và cố vấn sắc sảo, người Shango vẫn bị các Laibon khác nghi kỵ vì lối hành xử tàn nhẫn của mình. Do đó, việc một người Shango cai quản một lãnh địa rộng lớn mà không gặp phản kháng là điều khá hiếm hoi."
 house_wahsheen_modifier: "Gia Tộc Wah'Sheen"
 house_wahsheen_modifier_desc: "Thật khó để giành được lòng tin của một Gangrel thuộc phe [Glossary('Ashirra','game_concept_ashirra_desc')], nhưng một khi đã có được, đó là mối liên kết không gì lay chuyển nổi."
 house_saad_modifier: "Gia Tộc Saad"
 house_saad_modifier_desc: "Những người Bedouin của $pod_clan$ Assamite phần nào bị coi thường và có xu hướng gắn bó với nhau hoặc với các bộ tộc của mình."
 house_zayyat_modifier: "Gia Tộc Zayyat"
 house_zayyat_modifier_desc: "Gia Tộc Zayyat rực cháy với đức tin của những kẻ mới cải đạo. Một cảnh tượng vừa truyền cảm hứng vừa đáng sợ."
 house_hannibal_modifier: "Gia Tộc Hannibal"
 house_hannibal_modifier_desc: "Dù chiến đấu dũng cảm và với đầu óc chiến lược sắc bén, các thành viên Gia Tộc Hannibal dường như luôn định sẵn sẽ thất bại vào phút cuối."
 house_losario_modifier: "Gia Tộc Losario"
 house_losario_modifier_desc: "Các thành viên Gia Tộc Losario là những kẻ nổi loạn và cách tân, luôn đẩy lùi mọi giới hạn. Tuy vậy, dường như không ai có thể giận họ lâu."
 house_leeland_modifier: "Gia Tộc Leeland"
 house_leeland_modifier_desc: "Con cháu của Leeland là những thủ lĩnh đầy nhiệt huyết của thế giới $pod_cainite$ tự do. Các thị tộc truyền thống sẽ luôn nghi ngờ họ đang toan tính điều gì đó."
 house_menele_modifier: "Gia Tộc Menele"
 house_menele_modifier_desc: "Không khoan nhượng khi chiến đấu vì niềm tin của mình, các thành viên Gia Tộc Menele thường mù quáng trước những mối đe dọa tinh vi hơn."
 house_dominic_modifier: "Gia Tộc Dominic"
 house_dominic_modifier_desc: "Am tường nghệ thuật chiến tranh, các thành viên Gia Tộc Dominic đáng buồn thay lại thường trở thành con mồi dễ dàng cho [Glossary('Beast','game_concept_beast_desc')] đặc biệt đói khát của chính mình."
 house_gersakkun_modifier: "Gia Tộc Gersakkun"
 house_gersakkun_modifier_desc: "Dòng dõi gần như bị lãng quên này chưa để lại dấu ấn nào trong lịch sử Brujah, dù đã sản sinh ra một số triết gia tài năng."
 house_truebrujah_modifier: "Gia Tộc True Brujah"
 house_truebrujah_modifier_desc: "Không ai biết liệu có sự thật nào trong câu chuyện nguồn gốc kỳ dị của huyết thống này hay không. Nhưng sự lạnh lùng xa cách của họ dù sao cũng chẳng giúp họ có thêm bạn bè."
 house_baytmushakis_modifier: "Gia Tộc Bay't Mushakis"
 house_baytmushakis_modifier_desc: "Những người Brujah theo Hồi giáo không hề khoan nhượng trong cuộc săn lùng những kẻ Ventrue đáng ghét. Họ là kẻ thù dai dẳng đối với bất kỳ ai làm bạn với đại địch của họ."
 house_guillaume_modifier: "Gia Tộc Guillaume"
 house_guillaume_modifier_desc: "Công bằng và chính trực, các thành viên Gia Tộc Guillaume quan tâm đến trạng thái linh hồn mình hơn là bất kỳ trò chính trị vặt vãnh nào."
 house_azif_modifier: "Gia Tộc Azif"
 house_azif_modifier_desc: "Gia Tộc Azif mang trên mình vết nhơ từ hành vi trộm đoạt linh hồn đầy tham lam của vị thủy tổ. Một tội ác mà ít ai sẵn lòng quên."
 house_osebo_modifier: "Gia Tộc Osebo"
 house_osebo_modifier_desc: "Nếu để mặc, Osebo là một sinh vật của lửa và cơn thịnh nộ chỉ vừa đủ kiềm chế. Nhưng chính họ cũng biết điều này và tìm kiếm những bậc bảo trợ công minh để giữ mình trong khuôn khổ."
 house_lexor_modifier: "Gia Tộc Lexor"
 house_lexor_modifier_desc: "Người Brujah Lexor từng cai quản cả một đế chế. Đáng buồn thay, bộ máy quan liêu rối rắm của họ đã khiến họ mù quáng trước những mối đe dọa ở xa quê nhà."
 house_giovanni_modifier: "Gia Tộc Giovanni"
 house_giovanni_modifier_desc: "Những người này thích giữ mọi chuyện trong nội bộ gia tộc."
 house_lazarene_modifier: "Gia Tộc Lazarene"
 house_lazarene_modifier_desc: "Kẻ ăn xin thì không có quyền lựa chọn. Bị chính $pod_clan$ mình săn đuổi, con cháu của Lazarus sẽ liên minh với bất kỳ ai sẵn lòng."
 house_japhet_modifier: "Gia Tộc Japhet"
 house_japhet_modifier_desc: "Những thủ lĩnh truyền thống của $pod_clan$ Cappadocian có một cách tiếp cận rất buông lỏng. Điều đó có thể mang lại lợi ích... và cũng đầy nguy hiểm."
 house_byzar_modifier: "Gia Tộc Byzar"
 house_byzar_modifier_desc: "Các thành viên Gia Tộc Byzar là những người xây dựng các nền văn minh. Tuy nhiên, họ lại không giỏi trong việc bảo vệ chúng."
 house_premascine_modifier: "Gia Tộc Premascine"
 house_premascine_modifier_desc: "Nếu tham vọng là một đức hạnh, thì đây chính là những thiên thần của nó."
 house_harbingersofskulls_modifier: "Gia Tộc Harbingers"
 house_harbingersofskulls_modifier_desc: "Nhóm sát thủ kỳ dị này của người Cappadocian cảm thấy thoải mái trong bóng tối hơn nhiều so với trên ngai vàng."
 house_lamia_modifier: "Gia Tộc Lamia"
 house_lamia_modifier_desc_no_collide: "Không ai biết mục đích thực sự của những nữ chiến binh, con gái của Lilith. Và họ cũng không hé lộ."
 house_mlawatu_modifier: "Gia Tộc Mla Watu"
 house_mlawatu_modifier_desc: "Bạn không thể tin tưởng một sinh vật tìm kiếm quyền lực trong linh hồn và thể xác của người chết. Dù cho họ có biết những điều mà bạn khao khát."
 house_almawt_modifier: "Gia Tộc Al Mawt"
 house_almawt_modifier_desc: "Thận trọng để không chọc giận thế giới Hồi giáo, những người Cappadocian của chi hệ này có ít đồng minh, nhưng nhiều bí mật."
 house_hecata_modifier: "Gia Tộc Hecata"
 house_hecata_modifier_desc: "Một đêm nào đó, Nữ Thần Chết sẽ đón nhận tất cả những đứa con lạc lối của mình vào vòng tay lạnh giá."
 house_rusenko_modifier: "Gia Tộc Rusenko"
 house_rusenko_modifier_desc: "Nếu sự điên loạn là một chiếc thang, thì chẳng còn bao nhiêu bậc để leo lên nữa."
 house_lhiannan_modifier: "Gia Tộc Lhiannan"
 house_lhiannan_modifier_desc: "Những tàn tích của một thời đại đã qua đang chiến đấu đến hơi thở cuối cùng. Và đó là một cảnh tượng đầy nguy hiểm để chứng kiến."
 house_odin_modifier: "Gia Tộc Odin"
 house_odin_modifier_desc: "Vị Toàn Phụ đang dõi theo trận chiến cuối cùng của các [Glossary('Einherjar','game_concept_einherjar_desc')]. Và không kẻ hèn nhát nào được bước vào Valhalla."
 house_rufus_modifier: "Gia Tộc Rufus"
 house_rufus_modifier_desc: "Rufus đã bảo vệ những ngọn núi của mình suốt hàng ngàn năm. Ông có ý định tiếp tục thêm một ngàn năm nữa."
 house_matasuntha_modifier: "Gia Tộc Matasuntha"
 house_matasuntha_modifier_desc: "Người Hung từng suýt hủy diệt La Mã trong quá khứ. Bà không có ý định để điều đó bị ngăn chặn lần thứ hai."
 house_hukros_modifier: "Gia Tộc Hukros"
 house_hukros_modifier_desc: "Dòng dõi của Hukros luôn tìm kiếm những sự thật ẩn giấu, một tinh thần tò mò khiến những kẻ đồng đạo không mấy hài lòng."
 house_aajav_modifier: "Gia Tộc Aajav"
 house_aajav_modifier_desc: "Ngọn cờ của Aajav tung bay cao trên bầu trời, tiếng gào thét thách thức cuối cùng của một thế giới đang hấp hối. Giờ đây không còn đường lui nữa."
 house_kurru_modifier: "Gia Tộc Kurru"
 house_kurru_modifier_desc: "Các thành viên Gia Tộc Kurru cảm thấy thoải mái một cách khác thường ở vai trò lãnh đạo so với phần còn lại của $pod_clan$ Gangrel. Tuy nhiên, cách tiếp cận bộc trực của họ đối với việc cai trị thường khiến họ dễ bị tổn thương trước những thủ đoạn ngầm."
 house_vola_modifier: "Gia Tộc Vola"
 house_vola_modifier_desc: "Những người phương Bắc cường tráng của Gia Tộc Vola không có kiên nhẫn với kẻ ngốc. Còn có những cuộc đột kích và cướp bóc đang chờ được thực hiện!"
 house_anda_modifier: "Gia Tộc [Glossary('Anda','podgloss.anda')]"
 house_anda_modifier_desc: "Nỗi kinh hoàng của thảo nguyên là những chiến binh vô song, nhưng lại gặp khó khăn khi phải thích nghi với những khắc nghiệt của việc cai trị những vùng đất rộng lớn."
 house_akunanse_modifier: "Gia Tộc Akunanse"
 house_akunanse_modifier_desc: "Những con nhện khôn ngoan của châu Phi tỏ ra ít quan tâm đến Jyhad. Điều này khiến họ trở thành những người láng giềng hữu ích, nhưng lại là những kẻ cai trị kém cỏi."
 house_noiad_modifier: "Gia Tộc Noiad"
 house_noiad_modifier_desc: "Những $pod_cainites$ kỳ dị của phương Bắc băng giá là những sinh vật hoang dã, không thích hợp để cai quản những vùng đất đông dân cư."
 house_montano_modifier: "Gia Tộc Montano"
 house_montano_modifier_desc: "Những thủ lĩnh truyền thống của $pod_clan$ Lasombra là những nhà thần bí ẩn dật, thường không mấy phù hợp với vai trò của mình."
 house_deruiz_modifier: "Gia Tộc De Ruiz"
 house_deruiz_modifier_desc: "Những kẻ thù không đội trời chung của người Hồi giáo Iberia đã ăn sâu vào nền văn hóa hiệp sĩ của Iberia, và tận dụng triệt để điều đó."
 house_narses_modifier: "Gia Tộc Narses"
 house_narses_modifier_desc: "Những thủ lĩnh từng một thời vĩ đại của Dị Giáo $pod_cainite$ giờ nằm rải rác và tan vỡ kể từ cái chết của vị tổng giám mục của họ. Tội lỗi của họ vẫn chưa bị lãng quên."
 house_boukephos_modifier: "Gia Tộc Boukephos"
 house_boukephos_modifier_desc: "Người con nhà ngoại giao học thức của Lasombra là một $pod_cainite$ dễ mến, được thế hệ trẻ yêu quý. Tuy nhiên, ông thường có xu hướng lang thang xa khỏi lãnh địa của mình."
 house_sybil_modifier: "Gia Tộc Sybil"
 house_sybil_modifier_desc: "Phần còn lại của $pod_clan$ hầu như không thừa nhận dòng dõi của người con gái bị ruồng bỏ này. Vì vậy, họ đã học cách chủ yếu dựa vào chính mình."
 house_gratiano_modifier: "Gia Tộc Gratiano"
 house_gratiano_modifier_desc: "Gratiano được định sẵn cho những điều vĩ đại. Và ông luôn hăng hái nhắc nhở mọi người về điều đó."
 house_khanommehr_modifier: "Gia Tộc Khanom Mehr"
 house_khanommehr_modifier_desc: "Xa lánh chính trị, Gia Tộc Khanom Mehr tận hiến cho việc bảo vệ $pod_clan$ và vị sáng lập của mình."
 house_karotos_modifier: "Gia Tộc Karotos"
 house_karotos_modifier_desc: "Dòng dõi gần như vô danh của một Lasombra bí ẩn mang theo vài biến cố đau thương trong quá khứ nhưng còn tất cả để chứng minh."
 house_qabilatalkhayal_modifier: "Gia Tộc Qabilat al-Khayal"
 house_qabilatalkhayal_modifier_desc: "Những người Lasombra thuộc phe [Glossary('Ashirra','game_concept_ashirra_desc')] đang ở thế yếu, lòng nhiệt thành không ngơi nghỉ của họ vừa là phúc lành vừa là lời nguyền trong thời buổi gian nan này."
 house_allama_modifier: "Gia Tộc al-Lam'a"
 house_allama_modifier_desc: "Với nền ngoại giao linh hoạt của mình, Gia Tộc al-Lam'a nhỏ bé đang bảo đảm sự tồn vong của mình, bất chấp sự miễn cưỡng trong việc dùng đến những thủ đoạn ngầm."
 house_tubalcain_modifier: "Gia Tộc Tubalcain"
 house_tubalcain_modifier_desc: "Là bậc thầy về Dominate, Gia Tộc Tubalcain không hề khoan dung với những quan điểm tôn giáo khác biệt."
 house_tepelit_modifier: "Gia Tộc Tepelit"
 house_tepelit_modifier_desc: "Tepelit ẩn dật và gần như vô danh đã thấy được những khải tượng về sự diệt vong của mình, và một số người nói rằng, ông thậm chí đã chấp nhận nó."
 house_blueeye_modifier: "Gia Tộc Blue Eye"
 house_blueeye_modifier_desc: "Dòng dõi huyền thoại này của Lasombra là một dòng dõi ẩn dật, mà hầu hết mọi người đều đồng ý là không thích hợp để cai trị hay nắm giữ các vị trí quyền lực."
 house_ramanga_modifier: "Gia Tộc Ramanga"
 house_ramanga_modifier_desc: "Một dòng dõi tàn nhẫn không ngần ngại công khai thao túng loài người, Gia Tộc của Nữ Hoàng Madagascar chỉ tin tưởng vào chính mình trong chuyện cai trị."
 house_lamdiel_modifier: "Gia Tộc Lamdiel"
 house_lamdiel_modifier_desc: "Với những khải tượng bất tận về diệt vong và bóng tối, làm một thành viên của Gia Tộc Lamdiel chẳng hề dễ dàng."
 house_eater_modifier: "Gia Tộc Eater"
 house_eater_modifier_desc: "Hắn luôn dõi theo bạn, chờ đợi khoảnh khắc để cướp đi lời nói của bạn nếu bạn không cẩn thận."
 house_brahina_modifier: "Gia Tộc Brahina"
 house_brahina_modifier_desc: "Là những sinh vật của đam mê mãnh liệt, các thành viên Gia Tộc Brahina gặp khó khăn trong việc tập trung vào một chủ đề trong thời gian dài."
 house_delaurent_modifier: "Gia Tộc De Laurent"
 house_delaurent_modifier_desc: "Một học giả tập trung và tài năng, De Laurent ở trạng thái tốt nhất khi một mình trong thư viện của mình, chứ không phải khi cai quản một triều đình đông đảo."
 house_midian_modifier: "Gia Tộc Midian"
 house_midian_modifier_desc: "Bạo chúa có thể gặp may mắn. Nhưng may mắn thì luôn sẽ cạn kiệt sớm hơn là muộn."
 house_banes_modifier: "Gia Tộc Banes"
 house_banes_modifier_desc: "Biết trước tương lai có thể là một ân huệ. Nhưng nó cũng có thể đập tan một sự nắm bắt thực tại vốn đã mong manh."
 house_plague_modifier: "Gia Tộc Plague"
 house_plague_modifier_desc: "Gia Tộc của Ôn Dịch mang một sứ mệnh đơn nhất, khủng khiếp khiến việc lại gần họ trở nên rất nguy hiểm."
 house_izaha_modifier: "Gia Tộc Izaha"
 house_izaha_modifier_desc: "Gia Tộc Malkavian này thậm chí còn điên loạn hơn cả mức thông thường, nhưng có một nét sắc bén khó hiểu trong đôi mắt xoắn vặn của họ."
 house_lerterimas_modifier: "Gia Tộc Lerterimas"
 house_lerterimas_modifier_desc: "Bị chính $pod_clan$ mình ruồng bỏ vì liên minh với một thế lực đen tối hơn, Gia Tộc Lerterimas lao về phía một ngày tận thế do chính họ tạo ra."
 house_panehesy_modifier: "Gia Tộc Panehesy"
 house_panehesy_modifier_desc: "Gia Tộc Malkav Ai Cập này từng nắm giữ những vị trí quan trọng trong các vương quốc Ai Cập cổ đại. Điều đó dường như đã giúp họ giữ được lý trí trong tầm kiểm soát, nếu không nói là để xoa dịu cuộc tìm kiếm một quyền năng cao hơn của họ."
 house_nissiku_modifier: "Gia Tộc Nissiku"
 house_nissiku_modifier_desc: "Vị Hoàng Tử Tinh Ranh biết khi nào nên lừa gạt và khi nào nên quyến rũ. Sự hiện diện của ông vẫn còn được cảm nhận trong dòng dõi của mình, những kẻ luôn bị thôi thúc tìm ra những cách mới để thỏa mãn tinh thần không ngừng mở rộng của họ."
 house_ananke_modifier: "Gia Tộc Ananke"
 house_ananke_modifier_desc: "Kẻ bị oan khuất sẽ trút cơn báo thù đẫm máu lên các con trai và con gái của những kẻ lừa dối." 
 house_vrykolakas_modifier: "Gia Tộc Vrykolakas"
 house_vrykolakas_modifier_desc: "Kẻ Đã Trốn Thoát vẫn đang chạy trốn, không bao giờ ngoái nhìn lại."
 house_yagnatia_modifier: "Gia Tộc Yagnatia"
 house_yagnatia_modifier_desc: "Người Bà đã không còn chạy trốn nữa. Con cháu của bà sẽ đứng vững và chiến đấu đến cùng nếu cần thiết."
 house_baytmutasharid_modifier: "Gia Tộc Bay't Mutasharid"
 house_baytmutasharid_modifier_desc: "Những Nosferatu trong thế giới Hồi giáo từ chối gia nhập cuộc Hajj sống một cuộc đời khép kín, cay đắng và bên lề xã hội."
 house_trajan_modifier: "Gia Tộc Trajan"
 house_trajan_modifier_desc: "Nếu Mạng Lưới của Trajan không biết về một thông tin nào đó, thì điều đó đơn giản là không đáng để biết."
 house_absalon_modifier: "Gia Tộc Absalon"
 house_absalon_modifier_desc: "Các vị Giám Mục bất tử của Đan Mạch nắm giữ những vị trí quyền lực danh giá trên quê hương của họ. Đương nhiên, đó là vùng đất duy nhất đáng để quan tâm."
 house_yima_modifier: "Gia Tộc Yima"
 house_yima_modifier_desc: "Chén Thánh của $pod_clan$ Nosferatu là điều để người ta quy tụ quanh, tìm sự an ủi trong đó hoặc chết vì nó."
 house_alexius_modifier: "Gia Tộc Alexius"
 house_alexius_modifier_desc: "Bừng cháy với cơn thịnh nộ cuồng tín, Gia Tộc Alexius sẵn sàng thanh tẩy mọi kẻ ngoại đạo cản đường họ."
 house_malachite_modifier: "Gia Tộc Malachite"
 house_malachite_modifier_desc: "Tảng Đá của Constantinople cũng chính là hy vọng cuối cùng của nó. Không trở ngại nào có thể ngăn được con đường của những Kẻ Được Chọn của Michael."
 house_guruhi_modifier: "Gia Tộc Guruhi"
 house_guruhi_modifier_desc: "Theo truyền thống là những thủ lĩnh của Laibon, người Guruhi trân trọng vị thế của mình, cách xa khỏi cảnh bần cùng của những người anh em phương Bắc."
 house_al_hajj_modifier: "Gia Tộc al-Hajj"
 house_al_hajj_modifier_desc: "Những người bảo vệ các Thánh Địa, kiên định không lay chuyển trong đức tin của mình."
 house_mnemach_modifier: "Gia Tộc Mnemach"
 house_mnemach_modifier_desc: "Mnemach đã ở Luteria suốt cả cuộc đời mình. Kiến thức của bà về pháp thuật cổ xưa chỉ có tình yêu của bà dành cho thành phố của mình mới sánh kịp."
 house_chandraputra_modifier: "Gia Tộc Chandraputra"
 house_chandraputra_modifier_desc: "Vị thủ lĩnh không thể tranh cãi của $pod_clan$ Ravnos suốt hàng thiên niên kỷ sẽ không đứng yên khi các anh em mình đang bị tấn công liên tục. Chiến thắng hoặc cái chết là lựa chọn duy nhất đối với Vị Tướng Quân."
 house_ravana_modifier: "Gia Tộc Ravana"
 house_ravana_modifier_desc: "Kẻ phản bội đã bán linh hồn mình từ lâu. Đừng bao giờ đánh giá thấp sức cám dỗ của Cái Ác thuần khiết."
 house_hazimel_modifier: "Gia Tộc Hazimel"
 house_hazimel_modifier_desc: "...và, khi ngươi nhìn vào Con Mắt, tri thức vĩnh hằng đã tuôn trào từ đó."
 house_alexandrite_modifier: "Gia Tộc Alexandrite"
 house_alexandrite_modifier_desc: "Lấy vàng từ miệng Con Rắn là một nước cờ nguy hiểm mà những người Alexandrite đã quen thuộc."
 house_rroma_modifier: "Gia Tộc Phuri Dae"
 house_rroma_modifier_desc: "Xa quê hương, họ gắn bó với nhau, tìm nơi trú ẩn khỏi cơn bão không bao giờ dứt."
 house_kali_modifier: "Gia Tộc Kali"
 house_kali_modifier_desc: "Một dòng dõi bị lãng quên, sự tồn tại của nó đã bị xóa khỏi các ghi chép của người Ravnos vì những tội ác ghê tởm của họ... hay vì những quan điểm khác biệt."
 house_baytmujirim_modifier: "Gia Tộc Bay't Mujirim"
 house_baytmujirim_modifier_desc: "Bị nghi kỵ bởi thế giới [Glossary('Ashirra','game_concept_ashirra_desc')] rộng lớn hơn, những người Ravnos theo Hồi giáo là một giống loài tự lực, cứng cỏi dù có phần hoài nghi."
 house_kinyonyi_modifier: "Gia Tộc Kinyonyi"
 house_kinyonyi_modifier_desc: "Những sứ giả của Vương Quốc Hắc Ngà là một cảnh tượng được chào đón ở hầu hết các triều đình, dù họ chẳng bao giờ ở lại lâu."
 house_bashirite_modifier: "Gia Tộc Bashirite"
 house_bashirite_modifier_desc: "Cho đến ngày Tận Thế, vẫn còn tiền để kiếm."
 house_phaedymite_modifier: "Gia Tộc Phaedymite"
 house_phaedymite_modifier_desc: "Những Hiệp Sĩ của Ravnos cố gắng cứu chuộc Thị Tộc sa ngã của mình, bất chấp chính bản thân nó."
 house_sybarite_modifier: "Gia Tộc Sybarite"
 house_sybarite_modifier_desc: "Không có đúng hay sai. Cứ lấy những gì bạn khao khát."
 house_yoryari_modifier: "Gia Tộc Yoryari"
 house_yoryari_modifier_desc: "Tìm kiếm sự thật, trở về với cội nguồn. Phương Đông đang réo gọi."

 indian_ravnos_improved_modifier: "Indian Ravnos Được Tăng Cường"
 indian_ravnos_improved_modifier_desc: "Trung tâm của clan Ravnos vẫn đứng vững và sẽ tiếp tục như vậy. Cuộc Chiến Vĩnh Hằng sẽ được giành chiến thắng."
 house_alexandrite_improved_modifier: "Gia Tộc Alexandrite Đầy Nhuệ Khí"
 house_alexandrite_improved_modifier_desc: "Lũ rắn phải khiếp sợ trước những người thừa kế đích thực của Ai Cập cổ đại."
 house_rroma_improved_modifier: "Gia Tộc Phuri Dae Đầy Nhuệ Khí"
 house_rroma_improved_modifier_desc: "Những kẻ du mục cuối cùng cũng sẽ tìm được một nơi để gọi là nhà và sự nghỉ ngơi mà họ thực sự xứng đáng."
 house_baytmujirim_improved_modifier: "Gia Tộc Bay't Mujirim Đầy Nhuệ Khí"
 house_baytmujirim_improved_modifier_desc: "Từ những kẻ bị ruồng bỏ trở thành những kẻ cai trị, từng không có chỗ ngồi trên bàn tiệc. Giờ đây họ sở hữu cả chiếc bàn ấy."
 house_bashirite_improved_modifier: "Gia Tộc Bashirite Đầy Nhuệ Khí"
 house_bashirite_improved_modifier_desc: "Nếu một chỗ đứng trên Thiên Đường có thể mua được, người Bashirite đã sẵn sàng mặc cả để có được nó."
 house_phaedymite_improved_modifier: "Gia Tộc Phaedymite Đầy Nhuệ Khí"
 house_phaedymite_improved_modifier_desc: "Tinh thần hiệp sĩ và danh dự không bao giờ thực sự chết. Ngay cả giữa những kẻ bất tử."
 house_sybarite_improved_modifier: "Gia Tộc Sybarite Đầy Nhuệ Khí"
 house_sybarite_improved_modifier_desc: "Bữa tiệc này sẽ thực sự không bao giờ kết thúc."
 house_yoryari_improved_modifier: "Gia Tộc Yoryari Đầy Nhuệ Khí"
 house_yoryari_improved_modifier_desc: "Một sự pha trộn mới giữa Đông và Tây trỗi dậy, mạnh mẽ hơn cả hai cộng lại."
 house_erk_improved_modifier: "Gia Tộc Erk Đầy Nhuệ Khí"
 house_erk_improved_modifier_desc: "Người Ravnos gốc Turk đã củng cố quyền kiểm soát trên vùng đất tổ tiên của họ. Lần này họ sẽ không từ bỏ nó."

 house_samiel_modifier: "Gia Tộc Samiel"
 house_samiel_modifier_desc: "Các Thiên Thần đã hết chịu ẩn nấp, rút lui, hay khiếp sợ. Đã đến lúc chiến tranh."
 house_enosh_modifier: "Gia Tộc Enosh"
 house_enosh_modifier_desc: "Những cố vấn thông thái của Gia Tộc Enosh là một nhóm điềm tĩnh, hiếm khi coi bạo lực là một lựa chọn."
 house_rayzeel_modifier: "Gia Tộc Rayzeel"
 house_rayzeel_modifier_desc: "Những người chữa lành của $pod_clan$ Salubri đã chứng kiến quá nhiều cái chết cho đến giờ. Tinh thần của họ suy yếu dần theo mỗi vết thương họ hàn gắn."
 house_twilight_modifier: "Gia Tộc Twilight"
 house_twilight_modifier_desc: "Những người bảo vệ nhân loại, không khoan nhượng trong cuộc chiến chống lại cái ác."
 house_hrorsh_modifier: "Gia Tộc Hrorsh"
 house_hrorsh_modifier_desc: "Không được chuẩn bị trước cuộc tấn công tàn nhẫn của người Tremere, Gia Tộc Hrorsh là lời nhắc nhở như bóng ma về một $pod_clan$ từng huy hoàng."
 house_mokur_modifier: "Gia Tộc Mokur"
 house_mokur_modifier_desc: "Kẻ cuối cùng sụp đổ, đúng như Saulot đã định sẵn từ đầu."
 house_watcher_modifier: "Gia Tộc Watcher"
 house_watcher_modifier_desc: "Khi những người anh em phương Tây của họ sụp đổ, họ đứng vững trong bóng tối phương Đông, sự canh gác của họ chỉ mới bắt đầu."
 house_abdallah_modifier: "Gia Tộc Abdallah"
 house_abdallah_modifier_desc: "Người khởi đầu một di sản, người mang một lời tiên tri, luôn dõi theo."

 house_khaibit_modifier: "Gia Tộc Khaibit"
 house_khaibit_modifier_desc: "Dòng dõi của người con trai đầu của Set mang trong mình sự tôn trọng và kính sợ xứng đáng giữa các đồng loại."
 house_sarrasine_modifier: "Gia Tộc Sarrasine"
 house_sarrasine_modifier_desc: "Sarrasine sẽ giết cha mẹ mình để đổi lấy bất kỳ mảnh quyền lực nào. Trên thực tế, hắn đã làm điều đó rồi."
 house_jormungandr_modifier: "Gia Tộc Jormungandr"
 house_jormungandr_modifier_desc: "Những kẻ dị giáo này hầu như chẳng tận tụy với bất kỳ chính nghĩa nào, ngoại trừ lợi ích và sự sống còn của chính họ."
 house_isis_modifier: "Gia Tộc Isis"
 house_isis_modifier_desc: "Hãy dè chừng người phụ nữ bị khinh miệt. Nhất là khi nàng là con gái của Isis, và nắm giữ bí mật của sự sống và cái chết trong lòng bàn tay."
 house_tawaret_modifier: "Gia Tộc Taweret"
 house_tawaret_modifier_desc: "Taweret từng đánh Kemintiri đến bất phân thắng bại và sống sót để kể lại câu chuyện ấy. Sức mạnh của bà chảy trong dòng dõi của bà."
 house_nefertiti_modifier: "Gia Tộc Nefertiti"
 house_nefertiti_modifier_desc: "Nếu kiêu hãnh đi trước sự sụp đổ, Nefertiti sẽ còn sụp đổ trong một thời gian rất, rất dài."
 house_maatkare_modifier: "Gia Tộc Maatkare"
 house_maatkare_modifier_desc: "Sự quyến rũ ngọt ngào của Con Rắn đầy khoan dung... và mê hoặc đến vậy."
 house_seterpenre_modifier: "Gia Tộc Seterpenre"
 house_seterpenre_modifier_desc: "Vị Hierophant nhà ngoại giao có đủ cởi mở để hợp tác với người ngoài. Vài kẻ thậm chí sẽ gọi ông là mềm yếu."
 house_heru_modifier: "Gia Tộc Heru"
 house_heru_modifier_desc: "Hãy coi chừng, con rắn này có những chiếc nanh đáng gờm."
 house_scorpio_modifier: "Gia Tộc Scorpio"
 house_scorpio_modifier_desc: "Gia Tộc này thể hiện một sở thích đáng báo động trong việc vạch ra những kế hoạch tận thế dài dòng, kéo dài. Càng đáng báo động hơn là một vài trong số đó có thể thực sự thành công vào một ngày nào đó..."
 house_porphyrion_modifier: "Gia Tộc Porphyrion"
 house_porphyrion_modifier_desc: "Những Quỷ Dữ của Ấn Độ đang chuẩn bị những kế hoạch không thể lường trước để mang vinh quang của Set đến tiểu lục địa này. Nếu họ thành công, điều đó sẽ chẳng dễ chịu cho ai cả."
 house_osiris_modifier: "Gia Tộc Osiris"
 house_osiris_modifier_desc: "Bị Con Rắn săn đuổi, những Người Con của Thần Chết giờ đây gần như đều đã về bên cha mình."
 house_damballah_modifier: "Gia Tộc Damballah"
 house_damballah_modifier_desc: "Phần nào xa cách với $pod_clan$ chính, những Người Con của Damballah là một nhóm thực dụng, điều chỉnh tín điều của họ theo tín ngưỡng châu Phi."
 house_khaytall_modifier: "Gia Tộc Khay'Tall"
 house_khaytall_modifier_desc: "Những kẻ dị giáo bị ruồng bỏ từng gắn liền với Constantinople của Michael là một dòng dõi bị săn đuổi. Lựa chọn của họ ngày càng ít đi theo từng đêm trôi qua."
 house_wepwawet_modifier: "Gia Tộc Wepwawet"
 house_wepwawet_modifier_desc: "Giáo phái chiến binh này bảo vệ Ai Cập khỏi những mối đe dọa từ bên ngoài, những mối đe dọa mà chính họ tự phân loại ra như vậy."
 house_mucalinda_modifier: "Gia Tộc Mucalinda"
 house_mucalinda_modifier_desc: "Những Naktanchara bị khinh miệt là một nhánh Phật giáo tách ra từ $pod_clan$ Setite. Sống ẩn dật và trong thế phòng thủ, vị thế của họ hết sức bấp bênh."
 house_glycon_modifier: "Gia Tộc Glycon"
 house_glycon_modifier_desc: "Những kẻ lừa đảo là một đẳng cấp chiến binh khát quyền lực của $pod_clan$ Setite. Mù quáng trước các âm mưu, họ chỉ là những kẻ vũ phu chĩa vào mục tiêu gần nhất."
 house_echidna_modifier: "Gia Tộc Echidna"
 house_echidna_modifier_desc: "Những Gorgon đã tiên đoán được sự diệt vong của chính mình. Sự chấp nhận kỳ lạ ấy khiến họ bị hầu hết $pod_cainites$ e sợ."
 house_nephilim_modifier: "Gia Tộc Nephilim"
 house_nephilim_modifier_desc: "Gia Tộc danh giá nhất của $pod_clan$ Toreador đã sa sút kể từ cái chết của người sáng lập. Tuy nhiên, hạt giống của sự vĩ đại vẫn còn đó."
 house_salianna_modifier: "Gia Tộc Salianna"
 house_salianna_modifier_desc: "Salianna đã mất tất cả hai lần rồi. Nàng sẽ không để điều đó xảy ra lần thứ ba."
 house_callisti_modifier: "Gia Tộc Callisti y Callisto"
 house_callisti_modifier_desc: "Là những nhà ngoại giao tài ba, các thành viên của Gia Tộc này có xu hướng quên đi bức tranh nhỏ vì bức tranh lớn, điều đã khiến họ phải trả giá đắt."
 house_nicholas_modifier: "Gia Tộc Nicholas"
 house_nicholas_modifier_desc: "Với một dòng dõi bịa đặt và một phong thái dễ bị lãng quên, Etienne de Poitiers đã biến Gia Tộc của mình thành một mục tiêu khó bị xác định."
 house_andrew_modifier: "Gia Tộc Andrew"
 house_andrew_modifier_desc: "Vị 'tổng lãnh thiên thần' của phái Dị Giáo $pod_cainite$ đã truyền cho Gia Tộc của mình tầm nhìn thực dụng về việc dùng tôn giáo như một động lực cho chiến tranh."
 house_helena_modifier: "Gia Tộc Helena"
 house_helena_modifier_desc: "Nếu bạn chưa từng phải lòng một thành viên của Gia Tộc Helena, ấy là vì bạn chưa gặp ai trong số họ mà thôi."
 house_baldr_modifier: "Gia Tộc Baldr"
 house_baldr_modifier_desc: "Những Skald phương Bắc đang cố gắng giữ cho những câu chuyện của họ sống mãi bằng sức mạnh của bài ca và giọng hát."
 house_lubbock_modifier: "Gia Tộc Lubbock"
 house_lubbock_modifier_desc: "Lạc lối trong đam mê, các thành viên của Gia Tộc Lubbock là con mồi dễ dàng trong thế giới $pod_cainite$ không khoan nhượng."
 house_volgirre_modifier: "Gia Tộc Volgirre"
 house_volgirre_modifier_desc: "Những kẻ cai trị nhỏ nhen của các lãnh địa nô lệ nhỏ nhen, Gia Tộc Volgirre là những bạo chúa tàn nhẫn và những sire độc ác."
 house_apollo_modifier: "Gia Tộc Apollo"
 house_apollo_modifier_desc: "Những đóa hoa nhỏ bé và mỏng manh, tìm kiếm ánh mặt trời và dễ dàng bị chiến tranh giày xéo."
 house_rayeenalfen_modifier: "Gia Tộc Ray'een al-Fen"
 house_rayeenalfen_modifier_desc: "Những người viết thư pháp của thế giới Hồi giáo đã vướng vào một cuộc ly giáo kéo dài qua nhiều thế hệ, đủ lâu để in hằn trong máu của họ."
 house_ishtarri_modifier: "Gia Tộc Ishtarri"
 house_ishtarri_modifier_desc: "Bị dày vò bởi cơn khát sâu thẳm muốn đắm chìm trong thói xấu, người Ishtarri dù vậy vẫn tài giỏi trong nghệ thuật tinh vi của việc thao túng thông tin."
 house_goratrix_modifier: "Gia Tộc Goratrix"
 house_goratrix_modifier_desc: "Kẻ mang ánh sáng sẽ đảm bảo một kỷ nguyên mới cho $pod_clan$, hoặc sẽ bị bóng tối nuốt chửng."
 house_etrius_modifier: "Gia Tộc Etrius"
 house_etrius_modifier_desc: "Vị nhiếp chính được chọn của Tremere dẫn dắt một cuộc phòng thủ kiên cường ở vị trí đứng đầu một $pod_clan$ tơi tả. Một vị trí không mấy ai thèm muốn."
 house_leduc_modifier: "Gia Tộc LeDuc"
 house_leduc_modifier_desc: "Vị nhiếp chính trước đây của Pháp từng là một $pod_cainite$ được kính trọng ở đó, hơn hẳn người kế nhiệm ông, Goratrix."
 house_meerlinda_modifier: "Gia Tộc Meerlinda"
 house_meerlinda_modifier_desc: "Người phụ nữ duy nhất trong Hội Đồng Bảy Người thực sự là người giữ cho kim tự tháp quyền lực đứng vững. Nước Anh sẽ là phần thưởng của bà nếu bà có thể vượt mặt những $pod_cainites$ cảnh giác của Quần Đảo."
 house_calderon_modifier: "Gia Tộc Calderon"
 house_calderon_modifier_desc: "Người Tây Ban Nha hung hãn sẽ bảo vệ danh dự của Tremere đến hơi thở cuối cùng, không hề hay biết về những thế lực tăm tối đang hoạt động."
 house_grimgroth_modifier: "Gia Tộc Grimgroth"
 house_grimgroth_modifier_desc: "Những bóng ma của Mistridge vẫn còn tức giận cho đến đêm nay, một cái tên đơn độc được thốt lên bằng giọng nguyền rủa: Grimgroth."
 house_cincao_modifier: "Gia Tộc De Cincao"
 house_cincao_modifier_desc: "Xavier tàn nhẫn trong phương pháp của mình, nhưng không ai có thể phủ nhận rằng hắn đạt được những kết quả đáng kinh ngạc khi làm vậy."
 house_telyavel_modifier: "Gia Tộc Telyavel"
 house_telyavel_modifier_desc: "Bị săn đuổi như những kẻ dị giáo, các Magi của Đức Tin Cổ đang tìm thấy sự an toàn tương đối cùng những $pod_cainites$ cùng chí hướng."
 house_trimira_modifier: "Gia Tộc Trimira"
 house_trimira_modifier_desc: "Những kẻ xa lạ trên vùng đất thù địch, buộc phải nhượng bộ để sống sót."

 dynn_rock_lord_modifier: "Gia Tộc Gargoyle"
 dynn_rock_lord_modifier_desc: "Từng là nô lệ, giờ đây được tự do cai trị vùng đất với những mối ràng buộc huyết thống được rèn từ đá."

 house_kartarirya_modifier: "Gia Tộc Kartarirya"
 house_kartarirya_modifier_desc: "Người Tzimisce nhiều tay của Ấn Độ nổi tiếng với việc chặt vài cái đầu trước khi hỏi han."
 house_yaroslavich_modifier: "Gia Tộc Yaroslavich"
 house_yaroslavich_modifier_desc: "Càng mạnh mẽ hơn, Hedeon càng cảm thấy khoái trá khi nghiền nát những kẻ thù đáng thương của mình."
 house_ruthven_modifier: "Gia Tộc Ruthvenski"
 house_ruthven_modifier_desc: "Những người canh giữ thể xác của Tzimisce bị mù quáng bởi vị trí danh giá của mình, không hề hay biết về vô số mối đe dọa mà nó kéo theo."
 house_vykos_modifier: "Gia Tộc Vykos"
 house_vykos_modifier_desc: "Myka đang trên một hành trình dài đi tìm ý nghĩa. Điểm cuối con đường ngày càng đến gần hơn mỗi đêm trôi qua..."
 house_rustovitch_modifier: "Gia Tộc Rustovitch"
 house_rustovitch_modifier_desc: "Vladimir cố gắng thuần hóa $pod_clan$ Tzimisce bằng vũ lực. Một nước đi táo bạo, và có khả năng gây chết người."
 house_yorak_modifier: "Gia Tộc Yorak"
 house_yorak_modifier_desc: "Hãy tưởng tượng cơn ác mộng tồi tệ nhất của bạn mang hình hài con người. Tra tấn bạn đến vĩnh viễn. Trong khi những nạn nhân trước đó của hắn dõi theo bạn, trước khi bạn gia nhập cùng họ trên các bức tường của Cathedral."
 house_tabak_modifier: "Gia Tộc Tabak"
 house_tabak_modifier_desc: "Gia Tộc Tabak được nuôi dưỡng để lãnh đạo, biết chính xác khi nào nên vắt kiệt từng giọt máu cuối cùng của nông dân, hay khi nào nên chạy trốn khi thất thế."
 house_dracon_modifier: "Gia Tộc Dracon"
 house_dracon_modifier_desc: "Những hậu duệ sùng đạo của Dracon và Obertus không thích hợp với chiến tranh và tránh xa những tập tục biến hình của đồng loại."
 house_byelobog_modifier: "Gia Tộc Byelobog"
 house_byelobog_modifier_desc: "Vị Thần Trắng cai trị Mùa Đông, nhưng chẳng bận tâm đến việc cai trị bất cứ điều gì khác."
 house_triglav_modifier: "Gia Tộc Triglav"
 house_triglav_modifier_desc: "Gia Tộc Triglav chìm đắm trong mối thù với Gia Tộc Dracon, hầu như không còn khả năng làm bất cứ điều gì khác."
 house_andeleon_modifier: "Gia Tộc Andeleon"
 house_andeleon_modifier_desc: "Thờ ơ với hầu hết các mối bận tâm trần tục, Andeleon đang tìm kiếm sự thật vượt xa những vì sao."
 house_demdemeh_modifier: "Gia Tộc Demdemeh"
 house_demdemeh_modifier_desc: "Kẻ thực sự học rộng biết rằng hắn phải vượt qua xác thịt để trở thành một vị Thần."
 house_djavakhi_modifier: "Gia Tộc Djavakhi"
 house_djavakhi_modifier_desc: "Khi bạn cai trị bằng bàn tay sắt, đừng bao giờ hạ tay xuống."
 house_nagloper_modifier: "Gia Tộc Nagloper"
 house_nagloper_modifier_desc: "Làm sao [Glossary('Dã Thú','game_concept_beast_desc')] có thể kiểm soát bạn nếu chính bạn là Dã Thú?"
 house_hrothgar_modifier: "Gia Tộc Hrothgar"
 house_hrothgar_modifier_desc: "Bạn có thể chạy trốn khỏi $pod_clan$ của chính mình, nhưng liệu bạn có thể chạy trốn khỏi Ragnarok?"
 house_jedrik_modifier: "Gia Tộc Jedrik"
 house_jedrik_modifier_desc: "Đôi khi, mối đe dọa nghiêm trọng nhất đối với quyền cai trị của bạn lại gần bạn hơn bạn nghĩ."
 house_tinia_modifier: "Gia Tộc Tinia"
 house_tinia_modifier_desc: "Bị cuốn theo niềm khao khát xê dịch, các thành viên của Gia Tộc Tinia luôn khao khát những trải nghiệm mới lạ, kỳ thú."
 house_mithras_modifier: "Gia Tộc Mithras"
 house_mithras_modifier_desc: "Hậu duệ của Thần Mặt Trời dễ dàng tuân theo hàng ngũ, đã bị người khởi sinh ra họ uốn nắn suốt nhiều thế kỷ nay."
 house_alexander_modifier: "Gia Tộc Alexander"
 house_alexander_modifier_desc: "Alexander đã chứng minh tài quản lý khôn khéo của mình khi cai trị đế chế hùng mạnh nhất Tây Âu. Nhưng những cơn thịnh nộ của ông cũng nổi tiếng không kém."
 house_antonian_modifier: "Gia Tộc Antonian"
 house_antonian_modifier_desc: "Kiến Trúc Sư của Giấc Mơ đã xây dựng nên một trong những xã hội không tưởng ấn tượng nhất của thế giới $pod_cainite$. Cho đến khi ông ta phát điên và bị hủy diệt vì điều đó."
 house_camilla_modifier: "Gia Tộc Camilla"
 house_camilla_modifier_desc: "Hậu duệ của Rome tự hào một cách chính đáng về di sản của họ. Uy tín và sự trọng vọng to lớn mà họ nắm giữ có thể dễ dàng khiến họ trở nên lười biếng."
 house_eigermann_modifier: "Gia Tộc Eigermann"
 house_eigermann_modifier_desc: "Những kẻ bắt nạt và vũ phu hầu như không hòa hợp trong $pod_clan$ Ventrue, Gia Tộc Eigermann là kẻ thù tồi tệ nhất của chính mình."
 house_artemis_modifier: "Gia Tộc Artemis"
 house_artemis_modifier_desc: "Người Ventrue Orthias chiếm đoạt ngai vàng và hiếm khi chờ đợi thời cơ khi một lưỡi kiếm có thể đẩy nhanh tiến trình. Họ tin rằng mình xứng đáng được vinh quang và giành lấy nó không chút do dự."
 house_bindusara_modifier: "Gia Tộc Bindusara"
 house_bindusara_modifier_desc: "Học giả lang thang là một kho tàng tri thức, thường được tìm đến để học hỏi những cách thức bí ẩn của các thế hệ đã qua."
 house_veddartha_modifier: "Gia Tộc Veddartha"
 house_veddartha_modifier_desc: "Gần như đồng nghĩa với chính Ventrue, Veddartha là một Gia Tộc lãnh đạo kiêu hãnh và tận tụy."
 house_arakur_modifier: "Gia Tộc Arakur"
 house_arakur_modifier_desc: "Dòng dõi của Arakur mang tiếng xấu về $pod_diablerie$, giao du với quỷ dữ, và tính kiêu ngạo. Họ cũng là những kẻ hèn nhát có bằng sáng chế khi không thể bắt nạt được ai."
 house_medon_modifier: "Gia Tộc Medon"
 house_medon_modifier_desc: "Medon có vinh dự đáng ngờ là ma cà rồng thực sự quyền lực đầu tiên từng bị người phàm giết chết. Một nỗi hổ thẹn mà dòng dõi của ông vẫn còn cảm nhận đến ngày nay."
 house_nefermeriisis_modifier: "Gia Tộc Nefer-meri-Isis"
 house_nefermeriisis_modifier_desc: "Đứa con hung dữ của Ventrue thích tự tay nhúng vào chiến trận. Vì vậy, dòng dõi của nàng khinh miệt việc dựa dẫm vào người khác."
 house_arpad_modifier: "Gia Tộc Arpad"
 house_arpad_modifier_desc: "Kiên cường và bám rễ sâu trong giới quý tộc Hungary, Gia Tộc Arpad là kẻ thù khó lòng đánh bật khỏi quê hương của họ."
 house_antasia_modifier: "Gia Tộc Antasia"
 house_antasia_modifier_desc: "Julia Antasia điềm tĩnh và quen biết rộng nuôi dưỡng đàn con của mình trở thành những kẻ đáng kính và thân thiện, luôn giải quyết vấn đề bằng sự quan tâm và lòng trắc ẩn."
 house_le_croise_modifier: "Gia Tộc le Croise"
 house_le_croise_modifier_desc: "Geoffrey bị dày vò bởi những cơn giận dữ giống hệt [Glossary('Sire','game_concept_Sire_desc')] của mình. Hắn chỉ có thể trông cậy vào phong thái hiệp sĩ của mình để cứu hắn khỏi cơn thịnh nộ của $pod_clan$."
 house_moloch_modifier: "Gia Tộc Molochim"
 house_moloch_modifier_desc: "Những kẻ canh giữ một thế giới vô ơn, người Molochim bị săn đuổi bởi cả các clan khác lẫn đồng tộc của họ. Kẻ trước không hiểu mục đích của họ, còn kẻ sau lại hiểu quá rõ."
 house_nergal_modifier: "Gia Tộc Nergalite"
 house_nergal_modifier_desc: "Một tai họa giáng lên thế giới mà họ muốn chứng kiến cháy rụi, những người con của Nergal là những kẻ ghê tởm đen tối nhất mà lời nguyền của Caine từng tạo ra."
 house_angellisater_modifier: "Gia Tộc Angellis Ater"
 house_angellisater_modifier_desc: "Những kẻ Angellis Ater đáng ghê tởm là những kẻ tiếm quyền trong $pod_clan$ Baali, tìm kiếm một con đường điên loạn để trở thành ác quỷ."
 house_ennamaru_modifier: "Những Người Con của Ennamaru"
 house_ennamaru_modifier_desc: "Những Người Con là những kẻ thao túng tàn nhẫn và tàn bạo trong các Triều Đình không mảy may nghi ngờ của người Cainite Pháp. Chẳng có cái kết hạnh phúc nào khi họ dính líu vào."
 house_the_third_modifier: "Kẻ Thứ Ba"
 house_the_third_modifier_desc: "Hãy sợ hãi Điều Chưa Biết."
 house_erk_modifier: "Gia Tộc Erk"
 house_erk_modifier_desc: "Được tôi luyện trong sự cô lập khắc nghiệt của Ergenekon, người Erk khai thác của cải từ lãnh địa của họ với hiệu suất tàn nhẫn. Nhưng bản tính điềm tĩnh, cô lập khiến họ vụng về trong các tình huống xã giao."
 #house_wankuei_modifier: "House Wan Kuei"
 #house_wankuei_modifier_desc: "The [Glossary('Hungry Dead','game_concept_kuei_jin_desc')] of China are masters of a vast Empire, but they suffer from some serious limitations that the Western $pod_cainites$ could take advantage of."
 house_hollow_reeds_modifier: "Gia Tộc Hollow Reeds"
 house_hollow_reeds_modifier_desc: "Vạn Con Quỷ phải trải qua Vạn kiếp sống trước khi trở về như những anh hùng của Thiên Đường."
 house_eight_lotus_modifier: "Gia Tộc Eight Lotus"
 house_eight_lotus_modifier_desc: "Xue đã chỉ ra con đường, đi theo nó từng chữ là con đường duy nhất dẫn đến sự cứu rỗi."
 house_midnight_jewel_modifier: "Gia Tộc Midnight Jewel"
 house_midnight_jewel_modifier_desc: "Chấp nhận rằng họ đã chết và bất biến là cách duy nhất để $pod_kueijin$ có thể học hỏi từ những sai lầm trong quá khứ."
 house_hell_tigers_modifier: "Gia Tộc Hell Tigers"
 house_hell_tigers_modifier_desc: "Những Quỷ Dữ không khoan nhượng sẽ bám riết [Glossary('Ma Hoàng','podgloss.demonemperor')] trên từng bước đường lên ngôi tất yếu của hắn."
 house_inward_seekers_modifier: "Gia Tộc Inward Seekers"
 house_inward_seekers_modifier_desc: "Những Người Tìm Kiếm tìm ra con đường của mình bằng cách tự cô lập bản thân. Có lẽ đó là lý do vì sao họ có quá ít bạn bè."
 house_celestial_nails_modifier: "Gia Tộc Celestial Nails"
 house_celestial_nails_modifier_desc: "Liệu những kẻ tự xưng là con cái của một nữ thần bị oan ức có phải là ảo tưởng hay chỉ đơn giản là kiêu ngạo?"
 house_cerulean_watchers_modifier: "Gia Tộc Cerulean Watchers"
 house_cerulean_watchers_modifier_desc: "Giao tiếp với các Kami thất thường có thể mang lại những phần thưởng lớn lao... hoặc những khổ nạn lớn lao."
 house_emperor_vanguard_modifier: "Gia Tộc Emperor's Vanguard"
 house_emperor_vanguard_modifier_desc: "[Glossary('Ma Hoàng','podgloss.demonemperor')] sẽ cần những con tốt để đẩy nhanh quá trình lên ngôi của hắn. Việc những con tốt ấy có được ban thưởng sau đó hay không lại là một chuyện hoàn toàn khác."
 house_asuratizayya_modifier: "Gia Tộc Asuratizayya"
 house_asuratizayya_modifier_desc: "Bị những [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] khác gán mác dị giáo, những [Glossary('Asuratizayya','game_concept_kuei_jin_desc')] người Ấn Độ vẫn giữ vững truyền thống của mình và bảo vệ cộng đồng của họ."
 house_crane_modifier: "Laughing Cranes"
 house_crane_modifier_desc: "Những Người Thừa Kế của Mẹ học được nhiều hơn về cách thực sự sống sau cái chết của họ hơn là khi họ còn sống."
 house_jade_demons_modifier: "Jade Demons"
 house_jade_demons_modifier_desc: "Ngồi trên những mỏ khoáng sản quý giá nhất, Jade Demons đã biến việc bán ngọc bích quý giá của họ cho kẻ trả giá cao nhất thành một nghệ thuật."
 house_wanderers_modifier: "Gia Tộc Steppe Tortoises"
 house_wanderers_modifier_desc: "Bị Akuma hoành hành, những [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] của thảo nguyên đang sống những ngày tháng vay mượn."
 house_uji_modifier: "Gia Tộc Uji"
 house_uji_modifier_desc: "Những Great Clan truyền thống và các Grandmaster của Night-Temple, liên minh với nhau một cách miễn cưỡng."
 house_thunder_tiger_modifier: "Gia Tộc Thunder Tigers"
 house_thunder_tiger_modifier_desc: "Tập trung vào việc thấu hiểu cách nhân loại thay đổi thế giới, Thunder Tigers di chuyển nhanh hơn những $pod_kueijin$ khác."
 house_wise_spider_modifier: "Gia Tộc Wise Spiders"
 house_wise_spider_modifier_desc: "Vun đắp phiên bản nhân tính của riêng mình, Wise Spiders hiểu rằng người phàm sẽ đóng vai trò then chốt trong cuộc chiến tương lai chống lại [Glossary('Ma Hoàng','podgloss.demonemperor')]."
 house_blooming_blossom_modifier: "Gia Tộc Blooming Blossom"
 house_blooming_blossom_modifier_desc: "Sự tuân thủ chậm rãi và bền bỉ theo trí tuệ của quá khứ sẽ giành chiến thắng trong cuộc chiến."
 house_six_springs_modifier: "Gia Tộc Six Springs"
 house_six_springs_modifier_desc: "Ai cũng có thể giành được cơ hội cứu chuộc dù không phải ai cũng sẽ tận dụng nó."
 house_yellow_moon_modifier: "Gia Tộc Yellow Moon"
 house_yellow_moon_modifier_desc: "Nếu bạn đi theo bước chân của ai đó, hãy chắc chắn rằng họ chưa từng lạc lối trước đã."
 house_inward_tempest_modifier: "Gia Tộc Inward Tempest"
 house_inward_tempest_modifier_desc: "Nếu bạn không thể tìm ra đường trở lại Meru, hãy chắc chắn không ai khác có thể."
 house_tigers_meru_modifier: "Gia Tộc Tigers of Meru"
 house_tigers_meru_modifier_desc: "Ở đỉnh cao của thế giới và gần với khởi nguyên đến vậy, nhưng lại xa cách sự giác ngộ đến thế."
 house_proud_tigers_modifier: "Gia Tộc Proud Tigers"
 house_proud_tigers_modifier_desc: "Tại sao August Personage lại phải là bậc toàn năng vô ngộ? Không ai đứng trên sự chất vấn cả."
 house_scorching_devils_modifier: "Gia Tộc Scorching Devils"
 house_scorching_devils_modifier_desc: "Từng người một đều phải chiến đấu để ngăn chặn [Glossary('Ma Hoàng','podgloss.demonemperor')]. Dù muốn hay không."
 house_penangallan_modifier: "Gia Tộc Blood Flowers"
 house_penangallan_modifier_desc: "Nữ tính sẽ được tôn vinh trong tàn tích đẫm máu của kẻ thù."
 house_bishamon_modifier: "Gia Tộc Bishamon"
 house_bishamon_modifier_desc: "Những kẻ cai trị nước Nhật về đêm không dung thứ bất đồng chính kiến và chẳng mấy kiên nhẫn với những mối đe dọa nhắm vào quyền cai trị của họ."
 house_genji_modifier: "Gia Tộc Genji"
 house_genji_modifier_desc: "Những kẻ mới nổi trẻ tuổi và giàu có của nước Nhật về đêm sẽ dùng mọi thủ đoạn miễn là leo lên được đỉnh cao."
 house_iga_modifier: "Gia Tộc Iga"
 house_iga_modifier_desc: "Chuyên đối phó với các mối đe dọa từ người phàm, người Iga rất giỏi trong công việc của mình dù số lượng ít ỏi."
 house_koga_modifier: "Gia Tộc Koga"
 house_koga_modifier_desc: "Chuyên đối phó với các mối đe dọa siêu nhiên, người Koga rất giỏi trong công việc của mình dù số lượng ít ỏi."
 house_sotogawa_modifier: "Gia Tộc Sotogawa No"
 house_sotogawa_modifier_desc: "Những "kẻ ngoại lai" trong nền chính trị về đêm của Nhật Bản tự hào về biệt danh của mình. Họ đã giành được sự chấp nhận miễn cưỡng bằng con đường gian khó."
 house_nukekubi_modifier: "Gia Tộc Nukekubi"
 house_nukekubi_modifier_desc: "Danrin-no-Nukekubi là một trong những bậc thầy vĩ đại nhất Nhật Bản về Flesh Shintai. Cả những huyền thoại đã được tạo ra về nàng."
 house_taira_modifier: "Gia Tộc Taira"
 house_taira_modifier_desc: "Những Uji bảo thủ hàng đầu cũng là những người bảo vệ Thiên Hoàng. Một vị trí danh giá, dù chỉ mang tính nghi lễ."
 house_echizen_modifier: "Gia Tộc Echizen"
 house_echizen_modifier_desc: "Những pháp sư ngọc bích, nghệ nhân, trung gian với Triều Tiên, người Echizen nhúng tay vào nhiều việc khác nhau."
 house_chibo_modifier: "Gia Tộc Chibo"
 house_chibo_modifier_desc: "Dòng dõi thầy tu và pháp sư huyền bí của người Tzimisce ở [Glossary('Mikaboshi','podgloss.mikaboshi')], người Chibo là những vì sao đẫm máu của phép thuật."
 house_monomi_modifier: "Gia Tộc Monomi"
 house_monomi_modifier_desc: "Những chiến binh của người Tzimisce ở [Glossary('Mikaboshi','podgloss.mikaboshi')], người Monomi là những vì sao đẫm máu của thanh kiếm."
 house_kishu_modifier: "Gia Tộc Kishu"
 house_kishu_modifier_desc: "Những sát thủ của người Tzimisce ở [Glossary('Mikaboshi','podgloss.mikaboshi')], người Kishu là những vì sao đẫm máu của lưỡi dao găm."
 house_kizoku_modifier: "Gia Tộc Kizoku"
 house_kizoku_modifier_desc: "Sinh ra từ một người kể chuyện và bị dày vò bởi những cơn ác mộng, người Kizoku là Kindred của những Kẽ Nứt."
 house_bushi_modifier: "Gia Tộc Bushi"
 house_bushi_modifier_desc: "Tự xưng là những đứa con tắm máu của Thần Bão của Amatsukami, người Bushi là những chiến binh ngoan cường không ai sánh bằng."

 house_bishamon_improved_modifier: "Gia Tộc Bishamon Chiếm Ưu Thế"
 house_bishamon_improved_modifier_desc: "Những kẻ cai trị Nhật Bản về đêm không dung thứ bất đồng và chẳng có mấy kiên nhẫn với những mối đe dọa nhắm vào quyền lực của họ."
 house_genji_improved_modifier: "Gia Tộc Genji Chiếm Ưu Thế"
 house_genji_improved_modifier_desc: "Những kẻ trẻ tuổi và giàu có mới nổi của Nhật Bản về đêm sẽ dùng mọi thủ đoạn miễn là leo lên được đỉnh cao."
 house_iga_improved_modifier: "Gia Tộc Iga Chiếm Ưu Thế"
 house_iga_improved_modifier_desc: "Chuyên đối phó với các mối đe dọa từ người phàm, Iga rất giỏi trong việc họ làm dù số lượng ít ỏi."
 house_koga_improved_modifier: "Gia Tộc Koga Chiếm Ưu Thế"
 house_koga_improved_modifier_desc: "Chuyên đối phó với các mối đe dọa siêu nhiên, Koga rất giỏi trong việc họ làm dù số lượng ít ỏi."
 house_sotogawa_improved_modifier: "Gia Tộc Sotogawa No Chiếm Ưu Thế"
 house_sotogawa_improved_modifier_desc: "Những "kẻ ngoại lai" trong chính trường về đêm của Nhật Bản tự hào về biệt danh của mình. Họ đã giành được sự chấp nhận miễn cưỡng bằng con đường gian khó."
 house_nukekubi_improved_modifier: "Gia Tộc Nukekubi Chiếm Ưu Thế"
 house_nukekubi_improved_modifier_desc: "Danrin-no-Nukekubi là một trong những bậc thầy vĩ đại nhất của Nhật Bản về Xác Thân Shintai. Cả một truyền thuyết đã được dựng nên về nàng."
 house_taira_improved_modifier: "Gia Tộc Taira Chiếm Ưu Thế"
 house_taira_improved_modifier_desc: "Uji bảo thủ hàng đầu này cũng là những kẻ bảo hộ cho Thiên Hoàng. Một vị thế danh giá, dù chỉ mang tính nghi lễ."
 house_echizen_improved_modifier: "Gia Tộc Echizen Chiếm Ưu Thế"
 house_echizen_improved_modifier_desc: "Những pháp sư ngọc bích, nghệ nhân, trung gian với Triều Tiên, Echizen có tay trong nhiều lãnh vực."
 house_chibo_improved_modifier: "Gia Tộc Chibo Chiếm Ưu Thế"
 house_chibo_improved_modifier_desc: "Dòng dõi thầy tế và pháp sư của Tzimisce thuộc [Glossary('Mikaboshi','podgloss.mikaboshi')], Chibo là những vì sao đẫm máu của pháp thuật."
 house_monomi_improved_modifier: "Gia Tộc Monomi Chiếm Ưu Thế"
 house_monomi_improved_modifier_desc: "Những chiến binh của Tzimisce thuộc [Glossary('Mikaboshi','podgloss.mikaboshi')], Monomi là những vì sao đẫm máu của thanh kiếm."
 house_kishu_improved_modifier: "Gia Tộc Kishu Chiếm Ưu Thế"
 house_kishu_improved_modifier_desc: "Những sát thủ của Tzimisce thuộc [Glossary('Mikaboshi','podgloss.mikaboshi')], Kishu là những vì sao đẫm máu của lưỡi dao găm."
 house_kizoku_improved_modifier: "Gia Tộc Kizoku Chiếm Ưu Thế"
 house_kizoku_improved_modifier_desc: "Sinh ra từ một người kể chuyện và bị ám ảnh bởi ác mộng, Kizoku là Kindred của những Vết Rạn."
 house_bushi_improved_modifier: "Gia Tộc Bushi Chiếm Ưu Thế"
 house_bushi_improved_modifier_desc: "Tự xưng là con cái tắm máu của Thần Bão thuộc Amatsukami, Bushi là những chiến binh ngoan cường vô song."
 japanese_uji_improved_modifier: "Uji Chiếm Ưu Thế"
 japanese_uji_improved_modifier_desc: "Uji này đã vươn lên vị thế vượt trội so với các đối thủ trong chính trường về đêm của Nhật Bản."

 house_kuntilanak_modifier: "Gia Tộc Kuntilanak"
 house_kuntilanak_modifier_desc: "Lời nguyền cô lập biểu hiện thành việc bị mắc kẹt giữa cõi sống và cõi chết, Kuntilanak là những pháp sư gọi hồn ma quái."
 house_sangun_modifier: "Gia Tộc Sangun"
 house_sangun_modifier_desc: "Những lãnh chúa trên núi non Triều Tiên, Sangun là những bậc quân vương mang hình dạng thú tính."
 house_anh_modifier: "Gia Tộc Anh"
 house_anh_modifier_desc: "Khác biệt so với Gangrel nhưng cũng riêng biệt với Thủy Thủ, Anh là những kẻ rình rập ẩn giấu nơi đại dương quanh Indonesia, Đông Dương và Malaysia."
 house_banpaia_modifier: "Gia Tộc Banpaia"
 house_banpaia_modifier_desc: "Hậu duệ của một đoàn viễn chinh Tremere đã lạc mất về phương Đông, Banpaia đã tự khẳng định mình như một thế lực mới trong thế giới về đêm ở Đông Á."
 house_nyayo_modifier: "Gia Tộc Nyayo"
 house_nyayo_modifier_desc: "Caitiff bản địa châu Phi, Nyayo tìm cách quy tụ các Laibon để chống lại sự can thiệp từ bên ngoài."
 dynn_bima_modifier: "Bima"
 dynn_bima_modifier_disc: "Dòng dõi Huyết tộc Hồi sinh được tạo ra bởi Zhenga, Bima có dòng máu cực kỳ dễ biến đổi và hỗn loạn."
                  
 dynn_nagaraja_modifier: "Nagaraja"
 dynn_nagaraja_modifier_desc: "Lời nguyền ghê tởm của Nagaraja khiến họ trở thành một đám bị ruồng bỏ, nhưng cũng là một đám kiên cường."
 dynn_unbound_modifier: "Unbound"
 dynn_unbound_modifier_desc: "Chỉ riêng tin đồn về những $pod_cainites$ như vậy và dòng dõi của họ đã là một mối đe dọa cho trật tự đã được thiết lập."
 dynn_kiasyd_modifier: "Kiasyd"
 dynn_kiasyd_modifier_desc: "Kiasyd lánh đời và bí ẩn miệt mài trong các phòng thí nghiệm giả kim của mình, không hay biết những mối đe dọa đang lớn dần quanh họ."
 dynn_impundulu_modifier: "Impundulu"
 dynn_impundulu_modifier_desc: "Impundulu đang tìm kiếm một kẽ hở trong một khế ước đã lập từ lâu, thứ đang dần dần đẩy họ đến chỗ diệt vong."
 house_ahrimane_modifier: "Ahriman"
 house_ahrimane_modifier_desc: "Adisa chưa từng khuất phục hay lùi bước trước bất kỳ trận chiến nào. Các con gái của bà cũng sẽ không làm vậy; xét cho cùng Freya vẫn đang dõi theo."
 house_feroux_modifier: "Feroux"
 house_feroux_modifier_desc: "Cái gọi là Gangrel Hy Lạp là một dòng dõi kiêu hãnh, từng là một trong những lực lượng chủ chốt đứng sau Giấc Mơ Constantinople. Sự mất mát đó đè nặng lên linh hồn họ."
 house_siren_modifier: "Những Nàng Con Gái của Âm Thanh Hỗn Tạp"
 house_siren_modifier_desc: "Chúng hát cho ta nghe, những nàng siren của bảy đại dương..."
 dynn_knightsofacre_modifier: "Knights of Acre"
 dynn_knightsofacre_modifier_desc: "Các Hiệp Sĩ quả thực hung hãn trong chiến trận, nhưng lại coi thường những cách thức tinh vi hơn để phá vỡ kế hoạch của Kẻ Thù."
 dynn_swordofstjames_modifier: "Sword of St. James"
 dynn_swordofstjames_modifier_desc: "Thành thật mà nói, những kẻ theo Rodrigue là lũ khốn kiêu ngạo. Nhưng họ cũng là lũ khốn kiêu ngạo cứng rắn như thép!"
 dynn_redorder_modifier: "Red Order"
 dynn_redorder_modifier_desc: "Họ nắm giữ những bí mật khủng khiếp về nỗi kinh hoàng của cõi vô danh. Nhưng quá nhiều thời gian trong thư viện cũng khiến họ trở nên... yếu ớt trước những sách lược thực tế hơn."
 dynn_sistersjohn_modifier: "Sisters of St. John"
 dynn_sistersjohn_modifier_desc: "Bị ám ảnh bởi những viễn kiến khủng khiếp về ngày tận thế, các Nữ Tu đã hình thành một năng lực hành chính rất vững chắc để neo giữ sự tồn tại đáng sợ của mình."
 dynn_oculidei_modifier: "Oculi Dei"
 dynn_oculidei_modifier_desc: "Những thành viên đa nghi của Đôi Mắt Chúa Trời thường đúng về nỗi sợ hãi của họ. Nhưng điều đó cũng không khiến họ được các đồng bọn yêu mến hơn."
 dynn_murnau_modifier: "Von Murnau"
 dynn_murnau_modifier_desc: "Gia Tộc Đức kiêu hãnh này đã quen với việc đối phó với đám nông dân trốn thuế. Xét cho cùng, nỗi sợ Chúa Trời đâu chỉ dành riêng cho lũ con cái Địa Ngục."
 dynn_gantenbein_modifier: "Gantenbein"
 dynn_gantenbein_modifier_desc: "Những người anh em Bogomilist cuồng tín gặp khó khăn nhất trong việc dung hòa đức tin chân thành của mình với nhu cầu về máu ma cà rồng. Điều đó khiến họ trở nên xa lạ với chính đàn chiên của mình."
 house_obertus_modifier: "Obertus"
 house_obertus_modifier_desc: "Sự sụp đổ của Constantinople đè nặng lên Dòng Obertus tận tụy. Nhưng họ vẫn miệt mài không ngừng để khám phá những bí mật sâu kín nhất của thần thánh."
 house_grimaldi_modifier: "Grimaldi"
 house_grimaldi_modifier_desc: "Nhân đạo nhất trong số các [Glossary('Revenants','game_concept_revenant_desc')] là mối liên kết giữa $pod_clan$ Tzimisce và thế giới người phàm. Những nhà ngoại giao và thương nhân tài ba, họ vẫn bị các gia tộc hiếu chiến hơn khinh miệt."
 house_bratovitch_modifier: "Bratovitch"
 house_bratovitch_modifier_desc: "Những quái vật thô bạo thường phục vụ Tzimisce, Bratovitch là những chiến binh và thợ săn dấu vết, hiếm khi tham gia các sự kiện xã giao tao nhã."
 house_szantovich_modifier: "Szantovich"
 house_szantovich_modifier_desc: "Szantovich là những kẻ xã giao sa đọa, giàu có, khoái lạc chủ nghĩa. Họ kích thích các giác quan của mình để theo đuổi khoái lạc và đùa giỡn với con người một cách liều lĩnh bất cần. Có lẽ họ là những [Glossary('Revenants','game_concept_revenant_desc')] ít tự chủ nhất."
 house_vlaszy_modifier: "Vlaszy"
 house_vlaszy_modifier_desc: "Mọi thành viên Vlaszy đều được huấn luyện về kỵ thuật, chính trị, binh pháp và các kỹ năng cung đình khác từ khi còn nhỏ, và nhiều bậc trưởng lão Tzimisce ưa chuộng họ làm nhà vô địch và sứ giả của mình."
 house_basarab_modifier: "Basarab"
 house_basarab_modifier_desc: "Nổi tiếng vì tài năng chiến trận và khả năng lãnh đạo, họ là những tài sản quý giá đối với Tzimisce. Dòng dõi Basarab đang lớn mạnh từng đêm, bắt đầu khiến một số chủ nhân của họ cảm thấy bất an về sức mạnh của những 'thú cưng' của mình..."
 house_premysl_modifier: "Premysl"
 house_premysl_modifier_desc: "Xuất thân từ một dòng dõi hoàng tộc Bohemia, Premysl là những lãnh chúa tàn nhẫn và nhỏ nhen với kẻ dưới, nhưng lại cuồng tín tận tụy với các chủ nhân Tzimisce của mình."
 house_danislav_modifier: "Danislav"
 house_danislav_modifier_desc: "Nguyên là một dòng họ quý tộc có liên hệ với các Chúa Tể Bóng Tối, các Danislav ở bắc Transylvania rơi vào vòng khống chế của Tzimisce Florescu, kẻ đã giam họ trong hầm ngục của mình suốt mười năm đầu đời và huấn luyện họ phục tùng hắn."
 house_khazi_modifier: "Khazi"
 house_khazi_modifier_desc: "Dòng dõi kỳ lạ và lánh đời này chỉ phục vụ Methuselah Byelobog và bị coi là những kẻ bị ruồng bỏ, quái dị ngay cả theo tiêu chuẩn của Tzimisce."
 dynn_ducheski_modifier: "Ducheski"
 dynn_ducheski_modifier_desc: "Một gia đình từng mang tên Krevcheski và thuộc quyền sở hữu của Tzimisce. Nay họ phục vụ Tremere và nổi tiếng với tài năng về pháp thuật cũng như chế tạo các thiết bị cơ khí, đặc biệt là dụng cụ tra tấn. Nhiều Tremere giao cho Ducheski trông coi thư viện và phòng thí nghiệm của mình."
 house_oprichniki_modifier: "Oprichniki"
 house_oprichniki_modifier_desc: "Đội mật vụ của Ivan Bạo Chúa chỉ vừa đủ sống sót qua triều đại của chủ nhân mình. Những kẻ sống sót được các Tzimisce Nga nhận nuôi và gây dựng thành một gia tộc [Glossary('Revenant','game_concept_revenant_desc')], dù chưa từng đặt chân lên mảnh đất bị nguyền rủa của Transylvania."
 house_narov_modifier: "Narov"
 house_narov_modifier_desc: "Narov kiêu ngạo bị hầu hết các gia tộc khác khinh ghét, nhưng lối sống xa hoa của họ vẫn là niềm ganh tị của nhiều kẻ."
 house_rustovitchi_modifier: "Rustovitchi"
 house_rustovitchi_modifier_desc: "Bị đẩy vào một cuộc chiến mà họ không muốn tham gia, Rustovitchi không còn lựa chọn nào khác ngoài thắng hoặc chết."
 house_ruthvenski_modifier: "Ruthvenski"
 house_ruthvenski_modifier_desc: "Ruthvenski là một dòng dõi đã cạn kiệt, bám víu vào vinh quang xưa cũ. Tài cai trị của họ vẫn sắc bén như trước, nhưng chẳng còn ai buồn phục tùng họ nữa."
 house_slatikov_modifier: "Slatikov"
 house_slatikov_modifier_desc: "Con tốt của Razkoljna, Tzimisce của Krakow, Slatikov là một gia tộc nhỏ gồm các học giả và người có học thức, chỉ quan tâm lơ là đến ván cờ lớn của Jyhad."
 dynn_enrathi_modifier: "Enrathi"
 dynn_enrathi_modifier_desc: "Enrathi là những kẻ buôn nô lệ và luôn luôn như vậy. Bất kể thời thế đổi thay, luôn có người tìm đến dịch vụ của họ... và sẽ luôn luôn như thế."
 dynn_marijava_modifier: "Marijava"
 dynn_marijava_modifier_desc: "Những gián điệp và sát thủ của Tal'mahe'Ra tận tụy, thậm chí ngoan cố, với nghệ thuật họ đã chọn."
 dynn_rafastio_modifier: "Rafastio"
 dynn_rafastio_modifier_desc: "Rafastio quyến rũ có liên hệ lỏng lẻo với Tal'mahe'Ra, nơi họ phục vụ vừa là nhà tiên tri vừa là những kẻ xã giao hào nhoáng."
 dynn_dhabi_modifier: "D'habi"
 dynn_dhabi_modifier_desc: "D'habi nhu nhược đã bị hủy hoại tinh thần qua hàng thế kỷ bị ngược đãi dưới tay các chủ nhân Baali của mình."
 dynn_keskinen_modifier: "Keskinen"
 dynn_keskinen_modifier_desc: "Keskinen là một gia tộc nhỏ bé, gắn bó khăng khít, phục vụ vị Methuselah điên loạn tên là Louhi. Họ thực hành những pháp thuật cổ xưa, phần lớn đã bị lãng quên, được tiếp sức một phần bởi dòng máu và truyền thống bị bóp méo được truyền lại qua nhiều năm."
 dynn_rosselini_modifier: "Rosselini"
 dynn_rosselini_modifier_desc: "Rosselini mất trí là một gia tộc Pháp Sư Gọi Hồn từng chạm trán với Giovanni quá nhiều lần. Nay họ phục vụ kẻ thù cổ xưa đó, dù muốn hay không."
 dynn_rawan_modifier: "Rawan"
 dynn_rawan_modifier_desc: "Đám dân chài phục vụ Anushin-Rawan lập dị được nuôi dưỡng chỉ với một mục đích: hoàn toàn trung thành với Nữ Chủ của họ."
 dynn_kairouan_modifier: "Kairouan Brotherhood"
 dynn_kairouan_modifier_desc: "Một gia tộc được tạo ra qua các thí nghiệm của Pháp Sư Assamite trên các [Glossary('Revenants','game_concept_revenant_desc')] Tzimisce; Kairouan Brotherhood đã phân rã khắp thế giới, cả ba Đẳng Cấp đều tranh giành nhau cách tận dụng tốt nhất số ít còn sót lại."
 dynn_dimitriou_modifier: "Dimitriou"
 dynn_dimitriou_modifier_desc: "Prias đã từng giết người, quái vật, và cả thần thánh để bảo vệ Nữ Chủ của mình. Hắn sẽ làm lại điều đó không chút do dự."
 dynn_nirriti_modifier: "Nirriti"
 dynn_nirriti_modifier_desc: "Những kẻ bảo vệ cõi Tử Thần là một đám kiên cường, và là kẻ thù đáng gờm cho bất kỳ dị giáo nào dám bén mảng tới."
 dynn_crassus_modifier: "Crassus"
 dynn_crassus_modifier_desc: "Một thí nghiệm điên rồ sinh ra từ thời La Mã, gia tộc Crassus mang trong mình lời nguyền của những thói xa hoa tồi tệ nhất thời Đế Chế."
 dynn_gravenor_modifier: "Gravenor"
 dynn_gravenor_modifier_desc: "Gravenor đa nghi được giấu kín khỏi tầm mắt, phục vụ các chủ nhân Nosferatu của mình chừng nào lý trí họ còn nguyên vẹn."
 dynn_angustri_modifier: "Angustri"
 dynn_angustri_modifier_desc: "Angustri hiếm hoi nổi tiếng vì sự khôn khéo và biết tận dụng tốt kỹ năng của mình để phục vụ các chủ nhân Ravnos của họ."
 dynn_kurulas_modifier: "Kurulas"
 dynn_kurulas_modifier_desc: "Bộ tộc của thê thiếp Thành Cát Tư Hãn được coi trọng trong Đại Trướng [Glossary('Anda','podgloss.anda')]. Họ được gìn giữ cẩn thận như một mối liên kết danh giá với quá khứ huy hoàng của mình."
 dynn_qarnaim_modifier: "Qarnaim"
 dynn_qarnaim_modifier_desc: "Carthage từng là đỉnh cao của mối quan hệ giữa người phàm và $pod_cainite$. Qarnaim đang đấu tranh để biến câu chuyện khởi nguyên của họ thành hiện thực một lần nữa."
 dynn_bomkazi_modifier: "Bomkazi"
 dynn_bomkazi_modifier_desc: "Trung thành với các đối tác Impundulu của mình, các nữ phù thủy Bomkazi thận trọng trước sự pha loãng chậm rãi của dòng máu họ."
 dynn_societyofstgeorge_modifier: "Society of Saint George"
 dynn_societyofstgeorge_modifier_desc: "Không ai có thể phát động một cuộc xung phong tàn khốc giữa chiến trường trống trải như các Hiệp Sĩ của Thánh George, nhưng sự ưa chuộng chiến thuật này của họ đã gần như là một sự kiêu ngạo ngu xuẩn."
 dynn_orderofstjoan_modifier: "Order of St Joan"
 dynn_orderofstjoan_modifier_desc: "Những kẻ theo Jeanne, độc lập đến ương ngạnh, chiến đấu chống lại cái ác theo cách riêng của mình, bất kể Giáo Hội có thích hay không."
 house_faust_modifier: "Faust"
 houst_faust_modifier_desc: "Zethraeus đã tiến hành nhiều thí nghiệm phi đạo đức và giao kèo với các thế lực địa ngục trong hành trình tìm kiếm tri thức lớn lao hơn."
 dynn_custom_bloodline_war_modifier: "Dòng Máu Chiến Binh"
 dynn_custom_bloodline_war_modifier_desc: "Dòng máu này sống vì chinh phạt; hầu hết Kindred coi họ là những kẻ hiếu chiến."
 dynn_custom_bloodline_prowess_modifier: "Dòng Máu Sát Thủ"
 dynn_custom_bloodline_prowess_modifier_desc: "Dòng máu này gồm những kẻ sát nhân tàn độc. Điều đó không mang lại cho họ sự yêu mến từ Kindred, nhưng gần như ai cũng phải khiếp sợ họ."
 dynn_custom_bloodline_intrigue_modifier: "Dòng Máu Mưu Sĩ"
 dynn_custom_bloodline_intrigue_modifier_desc: "Thành viên của dòng máu này là một trong những kẻ mưu mô chết chóc nhất trong thế giới $pod_cainite$."
 dynn_custom_bloodline_diplomacy_modifier: "Dòng Máu Ngoại Giao"
 dynn_custom_bloodline_diplomacy_modifier_desc: "Thành viên của dòng máu này tin rằng có thể đạt được những điều lớn lao bằng sự lịch thiệp... khi điều đó có lợi cho họ."
 dynn_custom_bloodline_learning_modifier: "Dòng Máu Cầu Tri"
 dynn_custom_bloodline_learning_modifier_desc: "Thành viên của dòng máu này tìm kiếm câu trả lời. Họ cho rằng tri thức quan trọng hơn nhiều so với mưu mô chính trị và chiến tranh."
 dynn_custom_bloodline_stewardship_modifier: "Dòng Máu Quân Vương"
 dynn_custom_bloodline_stewardship_modifier_desc: "Thành viên của dòng máu này tìm cách thống trị kẻ khác. Không phải vì kiêu hãnh, mà vì họ biết cách trị vì."
 dynn_custom_bloodline_secret_modifier: "Huyết Thống Thuần Chủng"
 dynn_custom_bloodline_secret_modifier_desc: "Thành viên của dòng máu này cho rằng mình là hậu duệ đích thực của Caine. Trong mắt họ, mọi $pod_cainite$ khác chỉ là lũ đỉa hút máu tầm thường, không có quyền gì với dòng máu của Caine."
 house_mancheaka_modifier: "Gia Tộc Mancheaka"
 house_mancheaka_modifier_desc: "Như thủy tổ của họ từng làm từ lâu, các thành viên của dòng dõi này có xu hướng lao đầu vào hiểm nguy, khiến họ trở thành con mồi dễ dàng cho những kẻ thao túng lành nghề."
 house_caias_modifier: "Gia Tộc Koine"
 house_caias_modifier_desc: "Caias Koine chiến đấu để bảo vệ danh dự của [Glossary('Sire','game_concept_Sire_desc')] mình, chỉ để ngã xuống trước thứ tà thuật ghê tởm nhất."
 house_nebmaatsutekh_modifier: "Gia Tộc Nebmaatsutekh"
 house_nebmaatsutekh_modifier_desc: "Người mẹ của những phép màu là bằng chứng bất tử cho món nợ của Ra với Set."
 house_nephtys_modifier: "Gia Tộc Nephtys"
 house_nephtys_modifier_desc: "Nàng sinh ra từ sự dối trá, và cũng chết vì nó."
 house_wadjet_modifier: "Gia Tộc Wadjet"
 house_wadjet_modifier_desc: "Từng bị Set quyến rũ, Wadjet đã thoát ra và chiến đấu dũng cảm để bảo vệ những kẻ khác khỏi hắn."
 house_gilgamesh_modifier: "Gia Tộc Gilgamesh"
 house_gilgamesh_modifier_desc: "Nhà thơ đã sáng tác nhiều bài ca về chàng, nhưng không có bài nào về cái chết của chàng."
 house_enkidu_modifier: "Gia Tộc Enkidu"
 house_enkidu_modifier_desc: "Được giao phó những trọng trách quan trọng nhất, Enkidu sẽ không bao giờ nao núng."
 house_amarantha_modifier: "Gia Tộc Amarantha"
 house_amarantha_modifier_desc: "Kẻ bị hủy diệt đầu tiên vẫn còn sống, một di sản của đau khổ và hận thù."
 house_amphion_modifier: "Gia Tộc Amphion"
 house_amphion_modifier_desc: "Amphion đã quyến rũ chính Arikel bằng thứ âm nhạc hài hòa và êm dịu của mình."
 house_tammuz_modifier: "Gia Tộc Tammuz"
 house_tammuz_modifier_desc: "Kẻ bảo hộ và người tình của vật hiến tế của Arikel đã truyền vào dòng dõi mình một cảm thức về trách nhiệm điềm gở."
 house_ereshkigal_modifier: "Gia Tộc Ereshkigal"
 house_ereshkigal_modifier_desc: "Nữ pháp sư bí ẩn và lánh đời này có mưu đồ riêng của mình, xa rời những mối bận tâm của các Gangrel khác."
 house_cyscek_modifier: "Gia Tộc Cyscek"
 house_cyscek_modifier_desc: "Trước đồng loại quái dị của mình, Cyscek sẽ không ngần ngại thực hiện sự hy sinh tối thượng."
 house_gallod_modifier: "Gia Tộc Gallod"
 house_gallod_modifier_desc: "Nạn nhân của những nỗi kinh hoàng từ Bậc Trưởng Lão Tối Cổ, dòng dõi của Gallod được viết nên bằng máu."
 house_ionache_modifier: "Gia Tộc Ionache"
 house_ionache_modifier_desc: "Vị Voivode đầu tiên đã bị lãng quên từ lâu. Nhưng dòng dõi của ông vẫn nhớ về vinh quang đã mất của mình."
 house_toomler_modifier: "Gia Tộc Toomler"
 house_toomler_modifier_desc: "Một bậc thầy về vicissitude, Toomler đã không thể nhận ra những hiểm nguy trần tục hơn nhiều. Hắn vẫn phục vụ $pod_clan$ cho đến đêm nay, dưới một hình dạng khác."
 house_melachoate_modifier: "Gia Tộc Melachoate"
 house_melachoate_modifier_desc: "Kẻ Nictuku phản loạn đang chơi trò hai mặt, cẩn thận đảm bảo rằng không bên nào nghi ngờ điều đó."
 house_petrodon_modifier: "Gia Tộc Petrodon"
 house_petrodon_modifier_desc: "Một lòng cuồng tín cuồng nhiệt luôn thúc đẩy Petrodon tiến về phía trước, khiến kẻ thù của hắn phải thì thầm tên hắn trong nỗi kinh sợ."
 house_carna_modifier: "Gia Tộc Carna"
 house_carna_modifier_desc: "Một linh hồn lạc lối tìm kiếm mục đích có thể là mối đe dọa lớn nhất đối với Kim Tự Tháp Tremere."
 house_dracula_modifier: "Gia Tộc Dracula"
 house_dracula_modifier_desc: "Di sản kinh hoàng và khiếp đảm của kẻ này một ngày nào đó sẽ trở thành di sản của mọi ma cà rồng."
 house_valerius_modifier: "Gia Tộc Valerius"
 house_valerius_modifier_desc: "Không ai tôn trọng viên phó tướng trung thành cho đến chính khoảnh khắc hắn ngừng trung thành."
 house_giangaleazzo_modifier: "Gia Tộc Giangaleazzo"
 house_giangaleazzo_modifier_desc: "Vị Hoàng Thân Đích Thực biết khi nào cần xem xét lại lòng trung thành hiện tại của mình."
 house_cardona_modifier: "Gia Tộc Cardona"
 house_cardona_modifier_desc: "Một Vị Tộc Trưởng đích thực bảo vệ cả những thành viên thấp kém nhất trong gia đình mình."
 house_rosselini_modifier: "Gia Tộc Rosselini"
 house_rosselini_modifier_desc: "Tri thức chẳng bận tâm đến ranh giới đạo đức."
 dynn_mamluk_modifier: "Gia Tộc Mamluk Caitiff"
 dynn_mamluk_modifier_desc: "Bị kỳ thị vì dòng dõi Caitiff của mình, hậu duệ của Mukhtar Bey đã nhiều lần chứng minh tài năng hành chính của họ dù vậy."
 house_cecilia_modifier: "Gia Tộc Cecilia"
 houst_cecilia_modifier_desc: ""
 house_etheyra_modifier: "Gia Tộc Etheyra"
 house_etheyra_modifier_desc: "Khi phản bội tất cả mọi người và mọi thứ, hãy sẵn sàng để cuối cùng chỉ còn rất ít người tin tưởng bạn."
 custom_lay_order_modifier: "Gia Tộc Nhập Môn"
 custom_lay_order_modifier_desc: "Một gia tộc quý tộc gồm những kẻ phàm tục đã thề nguyện phò trợ chính nghĩa."
 custom_knightly_order_modifier: "Hiệp Sĩ Đoàn"
 custom_knightly_order_modifier_desc: "Một hội chiến binh gắn kết bởi Bí Tích Thánh Chức."
 custom_mendicant_order_modifier: "Khất Sĩ Đoàn"
 custom_mendicant_order_modifier_desc: "Một hội tôn giáo thề nguyện sống giữa và phò trợ thường dân."
 custom_contemplative_order_modifier: "Đan Viện Chiêm Niệm"
 custom_contemplative_order_modifier_desc: "Một cộng đồng tín đồ tách biệt khỏi thế sự để chuyên tâm cầu nguyện."
 house_dankovsky_modifier: "Gia Tộc Dankovsky"
 house_dankovsky_modifier_desc: "Những pháp sư gọi hồn quá thận trọng của vùng thảo nguyên bị số phận an bài chịu sự nghi kỵ vĩnh viễn của Gia Tộc, sau cuộc hóa kiếp cưỡng ép ngoài ý muốn của họ."
         
 dynn_horus_modifier: "Shemsu-Heru"   
 dynn_horus_modifier_desc: "Shemsu-Heru là Triều đại đầu tiên, những Bất Tử đích thực được các vị Thần tạo ra và vì các vị Thần mà tiến hành thánh chiến chống lại $glossary_wyrm_apophis$."
 dynn_ishmaelites_modifier: "Ishmaelites"
 dynn_ishmaelites_modifier_desc: "Những kẻ phản bội của Ishmaelites, triều đại thứ hai, ra đời từ khát vọng tự do và quyền tự quyết."
 dynn_apepnu_modifier: "Apepnu"
 dynn_apepnu_modifier_desc: "Triều đại thứ ba là Apepnu bị nguyền rủa, tôi tớ của $glossary_wyrm_apophis$ được tạo ra bởi nghi thức Bane của kẻ thù Set."
 dynn_cabiri_modifier: "Cabiri"
 dynn_cabiri_modifier_desc: "Những tên trộm bất chính của sự bất tử, Triều đại thứ tư của Cabiri, vừa bị căm ghét vừa bị đố kỵ ngang nhau."
 dynn_wufeng_modifier: "Wu Feng"
 dynn_wufeng_modifier_desc: "Wu Feng mang thuộc tính Dương và là tôi tớ của Nữ Hoàng Đỏ Thẫm."
 dynn_xianlung_modifier: "Xian Lung"
 dynn_xianlung_modifier_desc: "Xian Lung mang thuộc tính Âm và là tôi tớ của Hắc Long."

 dynn_asharu_modifier: "Asharu"
 dynn_asharu_modifier_desc: "Asharu từng là các thiên thần hộ vệ bị đày xuống [UmbraGlossary('abyss')]."
 dynn_rabisu_modifier: "Rabisu"
 dynn_rabisu_modifier_desc: "Rabisu là các Ác Quỷ từng có nhiệm vụ bảo hộ và làm giàu cho thiên nhiên, đồng thời trao thiên nhiên ấy cho loài người."
 dynn_halaku_modifier: "Halaku"
 dynn_halaku_modifier_desc: "Halaku là các Elohim từng phục vụ với vai trò sứ giả của cái chết, nhằm nhường chỗ cho nhiều sự sống hơn."
 dynn_namaru_modifier: "Namaru"
 dynn_namaru_modifier_desc: "Namaru là Gia tộc đầu tiên và từng là những sứ giả của Chúa Trời trước Sự Sa Ngã."
 dynn_lammasu_modifier: "Lammasu"
 dynn_lammasu_modifier_desc: "Lammasu từng là các thiên thần của Chúa Trời, những kẻ truyền cảm hứng và kiếm tìm chân lý, cái đẹp và sức mạnh nội tại."
 dynn_annunaki_modifier: "Annunaki"
 dynn_annunaki_modifier_desc: "Annunaki từng là những kẻ tạo hình và sử dụng Trái Đất, bị Chúa Trời kết án đày xuống [UmbraGlossary('abyss')]."
 dynn_neberu_modifier: "Neberu"
 dynn_neberu_modifier_desc: "Neberu là những kẻ gìn giữ các công trình của Chúa Trời, từng làm việc với vai trò cố vấn và nhà tiên tri trước Sự Sa Ngã."

 dynn_beaumayn_modifier: "Beaumayn"
 dynn_beaumayn_modifier_desc: "Hôm nay ta thề trung thành với Cuốn Sách và Lưỡi Kiếm, với tương lai là định mệnh của ta, với hiện tại là bổn phận của ta, và với quá khứ là báu vật của ta. Ta thề trung thành với các thành viên và mục tiêu của Gia tộc Beaumayn, và nguyện giấc mộng của kẻ bị đọa đày sẽ ám ảnh tâm trí ta nếu ta phản bội lòng tin này. Như ngôi sao đen kia rực cháy trên cao, trái tim ta cũng rực cháy phụng sự người."
 dynn_dougal_modifier: "Dougal"
 dynn_dougal_modifier_desc: "Trái tim ta là trái tim của Dougal. Cánh tay ta sẽ nâng lấy chiếc búa của người. Thân thể ta sẽ gánh vác gánh nặng của người. Trái tim ta sẽ tuân theo ý chí của người. Ta sẽ lao động cho đến ngày cuối cùng của đời mình, làm công việc của người."
 dynn_eiluned_modifier: "Eiluned"
 dynn_eiluned_modifier_desc: "Hôm nay ta thề trung thành với Đen và Bạc, thông qua lãnh chúa của ta. Ta sẽ dành cho bậc bề trên sự tôn kính mà họ xứng đáng được nhận, và ta sẽ dẫn dắt những kẻ trẻ hơn ta trên con đường thấu hiểu và trí tuệ. Mỗi ngày ta sẽ nỗ lực học hỏi thêm về thế gian và về chính trái tim mình, để làm giàu thêm cho cả Eiluned lẫn bản thân ta. Trên hết, ta nguyện dâng mình cho Gia tộc Eiluned với tư cách chư hầu, và ta mong mình sẽ phụng sự trong danh dự và vinh quang."
 dynn_fiona_modifier: "Fiona"
 dynn_fiona_modifier_desc: "Thưa Lãnh Chúa/Lãnh Nương, ta xin dâng người trọn vẹn tình cảm và hơi ấm trái tim ta, để những điều ấy giúp người vượt qua muôn dặm đường và bao năm tháng sắp tới. Ta sẽ là bạn của người, là tri kỷ của người, và là bạn đời của người theo ý người muốn. Trong những giờ khắc cô quạnh ta sẽ ở bên người, và trên chiến trường ta sẽ mang theo tín vật của người với niềm tự hào và danh dự. Người sẽ không bao giờ cô đơn; nước mắt người sẽ không bao giờ rơi mà thiếu bàn tay ta lau đi. Chừng nào mối ràng buộc này chưa bị phá vỡ, háng ta sẽ không còn tìm thấy khoái lạc; trái tim ta sẽ không còn tìm thấy niềm vui trong lạc thú xác thịt. Nguyện hàm răng của sư tử bạc nhà Fiona xé nát thân ta nếu ta phản bội lòng tin của người!"
 dynn_gwydion_modifier: "Gwydion"
 dynn_gwydion_modifier_desc: "Các Lãnh Chúa và Lãnh Nương của Chim Ưng, ta xin thề trung thành với người và với Gia tộc cao quý Gwydion, từ ngày này cho đến khi mặt trời không còn rực cháy nữa. Ta sẽ không bao giờ thất bại trong việc bảo vệ những người ta chăm sóc, cũng như danh dự của anh chị em ta. Ta sẽ khoan hòa trong thời bình và bất khuất trong chiến trận, và ta sẽ đem lại danh dự cho Gia tộc Gwydion bằng những việc làm của mình. Nhân danh Lãnh Chúa Gwydion Xám và Lãnh Nương Keredwyn, ta xin thề."
 dynn_liam_modifier: "Liam"
 dynn_liam_modifier_desc: "Nguyện ánh sáng Mặt Trời thiêu đốt da thịt ta,\nNguyện ánh sáng Mặt Trăng gieo vào ta nỗi sợ hãi,\nNguyện lương thực của Đất Mẹ gieo vào ta cơn đói,\nNguyện dòng nước của Sự Sống làm khô cạn cổ họng ta\nNếu ta từ bỏ la bàn của hành trình mình,\nNếu ta xao lãng việc chăm sóc [UmbraGlossary('dreaming')],\nNếu ta mù quáng trước nhu cầu của những người ta chăm sóc,\nNếu ta xem nhẹ sự trong sạch của bổn phận mình."
 dynn_aesin_modifier: "Aesin"
 dynn_aesin_modifier_desc: "Linh hồn bất diệt của ta nay thuộc về Gia tộc Aesin. Ta thề trước rừng núi quê hương mình rằng ta sẽ giữ gìn truyền thống và tập tục của Gia tộc Aesin. Biết rằng mình đã tìm được chốn an toàn, ta tìm nơi trú ẩn dưới đôi cánh của cú. Nếu lời thề này bị phá vỡ, nguyện [UmbraGlossary('dreaming')] tước đoạt mọi đặc quyền của ta và không bao giờ để ta quên mình từng là ai và mình đã trở thành gì."
 dynn_ailil_modifier: "Ailil"
 dynn_ailil_modifier_desc: "Bởi vảy của rồng bạc, bởi ánh sáng của bốn vì sao, bởi tấm màn đêm tối đen nhất, ta trao thân thể, trái tim và ý chí của mình vào sự gìn giữ của Gia tộc Ailil. Nguyện mục tiêu của gia tộc dẫn dắt tầm nhìn ta, hy vọng của gia tộc định hướng khát vọng ta, và mục đích của gia tộc truyền cảm hứng cho hành động ta. Nguyện mọi tham vọng của ta tan thành cát bụi nếu ta phản bội những lời mình đã thốt ra đêm nay. Rồng bên cạnh ta, sao trên đầu ta, đêm tối sau lưng ta, hãy chứng giám lời thề của ta."
 dynn_balor_modifier: "Balor"
 dynn_balor_modifier_desc: "Bởi con rắn quấn quanh tòa tháp vàng, bởi tia sáng đỏ thẫm tuôn ra từ Con Mắt của Balor, bởi dòng máu chảy như lửa trong huyết quản ta, ta nguyện dâng trái tim, tâm trí và thân thể mình cho ý chí của Gia tộc Balor. Nguyện thử thách đánh dấu thân thể ta khác biệt với mọi kẻ khác sẽ là lời nhắc nhở không ngừng về nguồn gốc và định mệnh của ta. Nguyện ta phải chịu cơn đau đớn của ngàn ngọn lửa nếu ta phản bội gia tộc mình. Ta thề như vậy, bởi máu và con mắt, trước chính [UmbraGlossary('dreaming')]."
 dynn_daireann_modifier: "Daireann"
 dynn_daireann_modifier_desc: "Hỡi anh chị em, bởi lưỡi kiếm sắc bén và mối ràng buộc của máu huyết, ta thề dâng sức mạnh đôi tay và lòng can đảm của trái tim mình để bảo vệ các người và chính nghĩa của chúng ta trước sức mạnh của kẻ thù. Người sẽ không bao giờ đơn độc trên chiến trường chừng nào hơi thở còn tồn tại trong thân thể ta. Nếu ta phá vỡ lời thề này, nguyện cơn mưa dao găm sắt xuyên thấu ngực ta và đày linh hồn ta vĩnh viễn vào bóng tối."
 dynn_leanhaun_modifier: "Leanhaun"
 dynn_leanhaun_modifier_desc: "Bởi các nguyên tố và bản chất của Giấc Mộng, ta tuyên bố trước các nhân chứng rằng ta đã sẵn sàng đảm nhận bổn phận của mình trong Gia tộc Leanhaun. Ta sẽ mãi trung thành với gia tộc mình, giữ gìn bí mật của gia tộc, hỗ trợ mọi thành viên đồng môn, và canh giữ kho báu của gia tộc. Nếu ta thất bại trong bất kỳ bổn phận nào, hoặc nếu ta phản bội gia tộc mình, nguyện tên ta bị xóa khỏi sử sách và bị xóa khỏi tâm trí những Kẻ Mộng Mơ. Nguyện câu chuyện của ta dang dở, mục đích của ta chẳng thành, và bản chất của ta tan tác theo gió. Nguyện không một Kithain nào còn nhớ từng có kẻ như ta tồn tại."
 dynn_varich_modifier: "Varich"
 dynn_varich_modifier_desc: "Một khuôn mẫu ta đã khởi đầu, nay ta kết thúc nó để bắt đầu lại từ đầu nhân danh Varich, người sáng lập gia tộc mà ta nhận làm của riêng mình. Nguyện ta không bao giờ để những sợi chỉ của một khuôn mẫu bị bỏ dở chưa đọc hết. Nguyện ta không bao giờ để một thử thách trôi qua mà không đáp lại. Nguyện ta không bao giờ trao lời thề tình yêu chân thật cho kẻ khác. Ta trao vinh dự cho Gia tộc Varich và phụng sự gia tộc bằng tâm trí, trái tim và hành động của mình. Nếu ta bội thề, nguyện mọi bàn tay của gia tộc ta nổi dậy chống lại ta và nguyện nhịp đập trái tim ta lịm tắt vĩnh viễn."
 dynn_danaan_modifier: "Danaan"
 dynn_danaan_modifier_desc: "Với mỗi vì sao trên bầu trời, có một con đường để bước đi. Với mỗi giấc mộng trong đêm, có một hành trình đang chờ đợi. Ta thề bởi những vì sao trên cao và những giấc mộng bên trong sẽ phụng sự Gia tộc Danaan, canh giữ những nẻo đường của [UmbraGlossary('dreaming')] và khai mở những lối đi mới nơi chưa từng tồn tại. Ta sẽ bảo vệ những lữ khách, dẫn dắt những Kẻ Mộng Mơ, và tiếp tục cho đến khi không còn con đường nào để đi theo nữa. Ta thề như vậy, và nguyện con rồng nuốt chửng ta trong giấc mộng nếu ta thất hứa với lời thề này."
 dynn_scathach_modifier: "Scathach"
 dynn_scathach_modifier_desc: "Hôm nay ta lập một lời thề bằng máu và thép, và nguyện dâng đời mình cho Gia tộc Scathach. Ta sẽ lắng nghe lời của các nhà tiên tri, và không dâng lưỡi kiếm mình cho bất kỳ chính nghĩa nào mời gọi sự ô nhục. Ta sẽ tự tay chăm chút thanh thép của mình, tự giữ lấy chủ kiến của mình, và tự bước đi trên con đường của mình cho đến ngày ta không còn đổ bóng nữa. Ta thề như vậy, bởi ánh trăng sáng và lưỡi kiếm nhuốm máu. Và thế là cuộc hành trình dài của ta bắt đầu."

 POD_unity_impassive_tax_modifier: "Cải Thiện Hành Chính"
 POD_unity_impassive_tax_modifier_desc: "Các thành viên của gia tộc này đang được hưởng hiệu suất hành chính được cải thiện."

 POD_aspiration_legacy_5_modifier: "Dòng Máu Đang Tiến Hóa"

