 POD_desprete_for_immortality_desc: "Ngươi từng là kẻ bất tử, và giờ đây đồng hồ đang điểm từng khắc..."
 POD_useless_dreamers: "Kẻ Mộng Du Vô Dụng"
 POD_useless_dreamers_desc: "Nhờ việc nghiên cứu Banality, ngươi tạm thời mất khả năng rút tỉa hiệu quả từ dreamers.\nNgươi không thể giảm căng thẳng cũng như nhận Glamour từ [dreamers|E] của mình"
 POD_weird_dreaming_contection: "Mối Liên Kết Mộng Mị Kỳ Dị"
 POD_weird_dreaming_contection_desc: "Nhờ việc nghiên cứu Glamour, ngươi tạm thời làm nhiễu loạn mối liên kết của mình với [UmbraGlossary('dreaming')], khiến Cantrip trở nên tốn kém hơn.\nChi phí của [cantrips|E] nhân với #N 2#!"
 POD_disconected_from_dreaming: "Đứt Lìa Khỏi Dreaming"
 POD_disconected_from_dreaming_desc: "Trong nỗ lực cân bằng giữa Glamour và Banality, ngươi đã làm sai điều gì đó...\nChi phí của [cantrips|E] nhân với #N 4#!\nNgươi không thể thử lại trong suốt thời gian hiệu ứng này còn tồn tại"