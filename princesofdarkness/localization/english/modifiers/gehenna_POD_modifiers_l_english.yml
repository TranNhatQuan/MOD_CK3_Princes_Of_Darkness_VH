l_english:
 POD_izhim_ur_baal_curse_modifier: "Lời Nguyền Baali: Toàn Lực"
 POD_izhim_ur_baal_curse_modifier_desc: "Banu Haqim đang khao khát máu của các ma cà rồng khác và khó lòng cưỡng lại được. Một tiếng cười cuối cùng từ những kẻ thù bại trận của họ trong Chiến Tranh Baali."
 POD_county_great_fire_modifier: "Bị Thiêu Rụi Bởi Đại Hỏa Hoạn"
 POD_county_great_flood_modifier: "Bị Nhấn Chìm Trong Đại Hồng Thủy"
 POD_county_great_sacking_modifier: "Bị Tàn Phá Trong Cuộc Đại Cướp Bóc"
 POD_county_great_famine_modifier: "Đại Nạn Đói"
 POD_county_great_earthquake_modifier: "Bị Tàn Phá Bởi Đại Địa Chấn"
 POD_baali_curse_normal_modifier: "Lời Nguyền Baali: Thích Nghi"
 POD_baali_curse_normal_modifier_desc: "Banu Haqim đã thích nghi với Lời Nguyền Baali khiến họ khao khát máu. Dù vẫn còn là một trở ngại, giờ đây nó đã phần lớn được kiểm soát."
 POD_baali_curse_jamal_modifier: "Lời Nguyền Baali: Khiên Đức Tin"
 POD_baali_curse_jamal_modifier_desc: "Jamal dạy cho Banu Haqim cách phòng vệ trước Lời Nguyền Baali bằng cách đặt niềm tin vào thần thánh. Bất kể ngươi tin vào ai, sự bình yên thực sự chỉ có thể tìm thấy nơi những quyền năng cao hơn."
 POD_baali_curse_thetmes_modifier: "Lời Nguyền Baali: Chấp Nhận"
 POD_baali_curse_thetmes_modifier_desc: "Sao phải chống lại nó? Thetmes có một luận điểm hay. Nếu ai đó yếu đuối đến mức để bản thân bị diablerize, điều đó có nghĩa là linh hồn họ có lẽ hữu ích hơn khi làm bữa ăn cho ngươi thay vì cho chính họ."
 
 