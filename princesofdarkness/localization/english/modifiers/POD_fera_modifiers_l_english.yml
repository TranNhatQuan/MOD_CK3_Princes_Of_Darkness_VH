 POD_delirium_modifier: "[battle_modifier|E]: Delirium"
 POD_delirium_modifier_desc: "Delirium là nỗi sợ hãi bản năng áp đảo, tác động lên những con người phàm trần khi họ nhìn thấy người sói và một số $glossary_fera$ khác trong hình dạng chiến tranh của chúng."
 POD_reduced_delirium_modifier: "[battle_modifier|E]: Delirium Suy Giảm"
 POD_reduced_delirium_modifier_desc: "Delirium là nỗi sợ hãi bản năng áp đảo, tác động lên những con người phàm trần khi họ nhìn thấy người sói và một số $glossary_fera$ khác trong hình dạng chiến tranh của chúng."


