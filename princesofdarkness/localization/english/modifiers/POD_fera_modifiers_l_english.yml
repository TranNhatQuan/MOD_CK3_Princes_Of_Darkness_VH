 # Forms
 #################
 
 POD_werewolf_form_crinos_modifier: "Hình Dạng Crinos"
 POD_werewolf_form_crinos_modifier_desc: "The "Hình Dạng Chiến Tranh", một dạng lai kinh hoàng giữa người và sói với sức mạnh và tốc độ vượt trội.\n#weak Trao [modifier|E] [GetModifier('POD_delirium_modifier').GetNameWithTooltip] cho [knights|E] địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho kẻ thù của ngươi trong [single_combat_duel_plural|E]#!"
 POD_werewolf_form_glabro_modifier: "Hình Dạng Glabro"
 POD_werewolf_form_glabro_modifier_desc: "Trông giống người ở mức tương đối, nhưng mang quá nhiều nét thú tính để có thể coi là người."
 POD_werewolf_form_hispo_modifier: "Hình Dạng Hispo"
 POD_werewolf_form_hispo_modifier_desc: "Một con sói khổng lồ thời tiền sử."
 POD_werewolf_form_lupus_modifier: "Hình Dạng Lupus"
 POD_werewolf_form_lupus_modifier_desc: "Không thể phân biệt với một con sói bình thường, nhưng có tốc độ vượt trội."
 
 POD_ajaba_form_crinos_modifier: "Hình Dạng Crinos"
 POD_ajaba_form_crinos_modifier_desc: "Hình dạng chiến tranh; nhỏ hơn và kém mạnh mẽ hơn đôi chút so với của Garou, nhưng cũng dai sức hơn một chút.\n#weak Trao [modifier|E] [GetModifier('POD_delirium_modifier').GetNameWithTooltip] cho [knights|E] địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho kẻ thù của ngươi trong [single_combat_duel_plural|E]#!"
 POD_ajaba_form_anthros_modifier: "Hình Dạng Anthros"
 POD_ajaba_form_anthros_modifier_desc: "Hình dạng gần-người."
 POD_ajaba_form_crocas_modifier: "Hình Dạng Crocas"
 POD_ajaba_form_crocas_modifier_desc: "Hình dạng gần-linh cẩu. Một con linh cẩu khổng lồ to bằng một con gấu nhỏ."
 POD_ajaba_form_hyaenid_modifier: "Hình Dạng Hyaenid"
 POD_ajaba_form_hyaenid_modifier_desc: "Hình dạng linh cẩu."

 POD_ananasi_form_lilian_modifier: "Hình Dạng Lilian"
 POD_ananasi_form_lilian_modifier_desc: ""
 POD_ananasi_form_crawlerling_modifier: "Hình Dạng Crawlerling"
 POD_ananasi_form_crawlerling_modifier_desc: ""
 POD_ananasi_form_pithus_modifier: "Hình Dạng Pithus"
 POD_ananasi_form_pithus_modifier_desc: ""
 
 POD_bastet_form_crinos_modifier: "Hình Dạng Crinos"
 POD_bastet_form_crinos_modifier_desc: "Một dạng lai người-mèo đồ sộ, sự kết hợp nguy hiểm giữa sức mạnh và mưu mẹo.\n#weak Trao [modifier|E] [GetModifier('POD_delirium_modifier').GetNameWithTooltip] cho [knights|E] địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho kẻ thù của ngươi trong [single_combat_duel_plural|E]#!"
 POD_bastet_form_sokto_modifier: "Hình Dạng Sokto"
 POD_bastet_form_sokto_modifier_desc: "Gần-người."
 POD_bastet_form_chatro_modifier: "Hình Dạng Chatro"
 POD_bastet_form_chatro_modifier_desc: "Hình dạng mèo nguyên thủy."
 POD_bastet_form_feline_modifier: "Hình Dạng Feline"
 POD_bastet_form_feline_modifier_desc: "Mèo bình thường."
 
 POD_corax_form_crinos_modifier: "Hình Dạng Crinos"
 POD_corax_form_crinos_modifier_desc: "Hình dạng Crinos là một sinh vật nửa-chim rất vụng về. Corax thường chỉ dùng hình dạng này để chống trả kẻ thù đủ lâu để thoát thân, và chỉ khi không còn lựa chọn nào khác.\n#weak Trao [modifier|E] [GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip] cho [knights|E] địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho kẻ thù của ngươi trong [single_combat_duel_plural|E]#!"
 POD_corax_form_corvid_modifier: "Hình Dạng Corvid"
 POD_corax_form_corvid_modifier_desc: "Hình dạng Corvid về cơ bản là hình dạng của một con quạ thường, dù Corax là loài chim đặc biệt lớn, kích cỡ gần bằng đại bàng."
 
 POD_gurahl_form_crinos_modifier: "Hình Dạng Crinos"
 POD_gurahl_form_crinos_modifier_desc: "Hình dạng chiến tranh. Cực kỳ mạnh mẽ và dai sức, chưa kể đến kích thước khổng lồ: cao từ 10 đến 16 feet, nặng tới 1200 kg.\n#weak Trao [modifier|E] [GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip] cho [knights|E] địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho kẻ thù của ngươi trong [single_combat_duel_plural|E]#!"
 POD_gurahl_form_arthren_modifier: "Hình Dạng Arthren"
 POD_gurahl_form_arthren_modifier_desc: "Hình dạng gần-người. Mạnh mẽ và dai sức hơn đáng kể so với hình dạng glabro của người sói, Gurahl trong Hình Dạng Arthren được cho là đã truyền cảm hứng cho các truyền thuyết về Sasquatch và những sinh vật tương tự."
 POD_gurahl_form_bjornen_modifier: "Hình Dạng Bjornen"
 POD_gurahl_form_bjornen_modifier_desc: "Hình dạng gần-gấu. Giống một con gấu hang động cổ đại, với móng vuốt và răng nanh dài hơn, Hình Dạng Bjornen gần như to lớn và mạnh mẽ ngang Crinos, thậm chí còn gây sát thương cắn và cào hung tợn hơn."
 POD_gurahl_form_urus_modifier: "Hình Dạng Urus"
 POD_gurahl_form_urus_modifier_desc: "Hình dạng gấu. Gurahl Homid mang hình dạng loài gấu tương ứng với Bộ Tộc của mình."
 
 POD_kitsune_form_koto_modifier: "Hình Dạng Koto"
 POD_kitsune_form_koto_modifier_desc: "Dạng lai giữa cáo và người."
 POD_kitsune_form_sambuhenge_modifier: "Hình Dạng Sambuhenge"
 POD_kitsune_form_sambuhenge_modifier_desc: "Gần Người."
 POD_kitsune_form_juko_modifier: "Hình Dạng Juko"
 POD_kitsune_form_juko_modifier_desc: "Con cáo to bằng sói."
 POD_kitsune_form_kyubi_modifier: "Hình Dạng Kyubi"
 POD_kitsune_form_kyubi_modifier_desc: "Con cáo bình thường."
 
 POD_mokole_form_archid_modifier: "Hình Dạng Archid"
 POD_mokole_form_archid_modifier_desc: "Hình dạng chiến tranh được coi là "hình hài chân thật" của bất kỳ cá thể Mokolé nào. Thông qua Mnesis, chúng mơ về những loài bò sát, chim chóc và khủng long từ quá khứ, điều này quyết định các đặc điểm của Hình Dạng Archid.\n#weak Trao [modifier|E] [GetModifier('POD_delirium_modifier').GetNameWithTooltip] cho [knights|E] địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho kẻ thù của ngươi trong [single_combat_duel_plural|E]#!"



 
 POD_nagah_form_azhi_dahaka_modifier: "Hình Dạng Azhi Dahaka"
 POD_nagah_form_azhi_dahaka_modifier_desc: "Hình dạng chiến đấu khác nhau tùy từng Nagah, nhưng tất cả đều có một chiếc mang lớn như rắn hổ mang, nhiều kẻ tự rạch sẹo để trở nên dễ nhận biết hơn trong hình dạng này, có thể tháo rời hàm, và có mang (chúng hoàn toàn sống được dưới nước trong hình dạng này). Khối lượng cơ thể của Nagah tăng lên do một cái đuôi dài 16 đến 20 feet chiếm nửa dưới cơ thể, cánh tay chúng trở nên giống rắn khi các đốt sống mọc thay cho xương tay bình thường, giúp chúng vật lộn dễ dàng hơn. Bàn tay của kẻ-nửa-rắn mọc ra móng vuốt khủng khiếp chẳng kém gì của bất kỳ Garou nào, và vảy cùng mai của chúng có sức bền siêu nhiên. Bất kỳ vết sẹo nào Nagah từng có đều nổi bật rõ rệt trong hình dạng này, thường tạo thành hoa văn trên vảy của Azhi Dahaka. Nagah gây hiệu ứng Delirium đầy đủ trong hình dạng này; ít con người nào chịu nổi khi nhìn thẳng vào hiện thân của nỗi sợ nguyên thủy đối với loài rắn.\n#weak Trao [modifier|E] [GetModifier('POD_delirium_modifier').GetNameWithTooltip] cho [knights|E] địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho kẻ thù của ngươi trong [single_combat_duel_plural|E]#!"
 POD_nagah_form_silkaram_modifier: "Hình Dạng Silkaram"
 POD_nagah_form_silkaram_modifier_desc: "Gần giống người, nhưng tóc và da được thay bằng các vảy nhỏ, khuôn mặt dẹt lại và đôi mắt trở nên giống rắn hơn, răng hợp lại làm một trừ hai chiếc răng nanh có thể thu vào như rắn hổ mang. Trong hình dạng này, chúng có được nọc độc nguy hiểm cho người phàm và cả kẻ bất tử."
 POD_nagah_form_kali_dahaka_modifier: "Hình Dạng Kali Dahaka"
 POD_nagah_form_kali_dahaka_modifier_desc: "Giống một con rắn khổng lồ với hai điểm khác biệt; chúng lớn hơn nhiều so với bất kỳ con hổ mang thường nào, và có răng nanh chứa nọc độc to lớn. Với Primal-urge, chúng có thể mọc ra một đôi tay mảnh khảnh. Hình dạng này cũng có mang và có thể thở dưới nước."
 POD_nagah_form_vasuki_modifier: "Hình Dạng Vasuki"
 POD_nagah_form_vasuki_modifier_desc: "Không thể phân biệt với một con hổ mang, rắn chuông, rắn miệng bông, hay bất kỳ giống rắn nào khác bình thường."
 
 POD_nuwisha_form_manabozho_modifier: "Hình Dạng Manabozho"
 POD_nuwisha_form_manabozho_modifier_desc: "Hình dạng chiến tranh, một dạng lai giữa người và chó sói đồng cỏ.\n#weak Trao [modifier|E] [GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip] cho [knights|E] địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho kẻ thù của ngươi trong [single_combat_duel_plural|E]#!"
 POD_nuwisha_form_tsitsu_modifier: "Hình Dạng Tsitsu"
 POD_nuwisha_form_tsitsu_modifier_desc: "Hình dạng gần-người."
 POD_nuwisha_form_sendeh_modifier: "Hình Dạng Sendeh"
 POD_nuwisha_form_sendeh_modifier_desc: "Hình dạng gần-chó sói đồng cỏ."
 POD_nuwisha_form_latrani_modifier: "Hình Dạng Latrani"
 POD_nuwisha_form_latrani_modifier_desc: "Hình dạng chó sói đồng cỏ."
 

 POD_ratkin_form_crinos_modifier: "Hình Dạng Crinos"
 POD_ratkin_form_crinos_modifier_desc: "Hình dạng chiến tranh, một dạng lai giữa người và chuột.\n#weak Trao [modifier|E] [GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip] cho [knights|E] địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho kẻ thù của ngươi trong [single_combat_duel_plural|E]#!"
 POD_ratkin_form_rodens_modifier: "Hình Dạng Rodens"
 POD_ratkin_form_rodens_modifier_desc: "Một con chuột với kích thước khác nhau."
 
 POD_rokea_form_gladius_modifier: "Hình Dạng Gladius"
 POD_rokea_form_gladius_modifier_desc: "Được người-cá-mập gọi là "Hàm Đứng", Gladius là một sinh vật cá mập đi bằng hai chân cao mười feet. Tương tự Crinos, Hàm Đứng kết hợp sức mạnh của cá mập với sự linh hoạt của hình dạng con người. Hình dạng này gây ra hiệu ứng Delirium một phần ở con người.\n#weak Trao [modifier|E] [GetModifier('POD_delirium_modifier').GetNameWithTooltip] cho [knights|E] địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho kẻ thù của ngươi trong [single_combat_duel_plural|E]#!"
 POD_rokea_form_grabrus_modifier: "Hình Dạng Grabrus"
 POD_rokea_form_grabrus_modifier_desc: "Còn được gọi là "Lưng Tròn", hình dạng này thường chỉ được biết đến bởi các Rokea sống trên cạn – các người-cá-mập sống ở đại dương ít khi cần dùng đến nó. Rokea rụng hết lông trên cơ thể và trở nên xấu xí hơn cả hình dạng homid của mình. Cô ấy hoặc anh ấy tăng gấp đôi khối lượng cơ, và lưng nở rộng ra khi vây lưng bắt đầu hình thành.\n#weak Trao [modifier|E] [GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip] cho [knights|E] địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho kẻ thù của ngươi trong [single_combat_duel_plural|E]#!"
 POD_rokea_form_chasmus_modifier: "Hình Dạng Chasmus"
 POD_rokea_form_chasmus_modifier_desc: "Hình dạng mà Rokea gọi là "Hàm Chiến Đấu" là một cơn ác mộng thời tiền sử gây ra hiệu ứng Delirium đầy đủ ở con người. Rokea biến thành một phiên bản khổng lồ của hình dạng giống loài mình, dài hơn phân nửa so với hình dạng Squamus của cô ấy. Rokea chiến đấu dưới nước trong hình dạng này.\n#weak Trao [modifier|E] [GetModifier('POD_delirium_modifier').GetNameWithTooltip] cho [knights|E] địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho kẻ thù của ngươi trong [single_combat_duel_plural|E]#!"
 POD_rokea_form_squamus_modifier: "Hình Dạng Squamus"
 POD_rokea_form_squamus_modifier_desc: "Còn được gọi là "Hàm Bơi", hình dạng này không thể phân biệt với một con cá mập bình thường thuộc giống loài của Rokea."
 
 POD_apis_form_crinos_modifier: "Hình Dạng Minotaur"
 POD_apis_form_crinos_modifier_desc: "Một người-bò khổng lồ với hàm răng sắc nhọn"
 POD_apis_form_aurochs_modifier: "Hình Dạng Aurochs"
 POD_apis_form_aurochs_modifier_desc: "Hình dạng loài vật"
 
 POD_camazotz_form_crinos_modifier: "Hình Dạng Crinos"
 POD_camazotz_form_crinos_modifier_desc: "Hình dạng chiến tranh của Camazotz, một dạng lai giữa người và dơi.\n#weak Trao [modifier|E] [GetModifier('POD_delirium_modifier').GetNameWithTooltip] cho [knights|E] địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho kẻ thù của ngươi trong [single_combat_duel_plural|E]#!"
 POD_camazotz_form_apterous_modifier: "Hình Dạng Apterous"
 POD_camazotz_form_apterous_modifier_desc: "Gần-người, không thể bay được, nhưng leo trèo cực kỳ giỏi."
 POD_camazotz_form_megachiroptera_modifier: "Hình Dạng Megachiroptera"
 POD_camazotz_form_megachiroptera_modifier_desc: "Một con dơi khổng lồ với sải cánh dài 5 feet."
 
 POD_grondr_form_crinos_modifier: "Hình Dạng Crinos"
 POD_grondr_form_crinos_modifier_desc: "Một sinh vật hình người đầu lợn rừng đáng sợ."
 POD_grondr_form_aperius_modifier: "Hình Dạng Aperius"
 POD_grondr_form_aperius_modifier_desc: "Gần-Người."
 POD_grondr_form_daeodon_modifier: "Hình Dạng Daeodon"
 POD_grondr_form_daeodon_modifier_desc: "Con lợn rừng ăn thịt khổng lồ thời tiền sử."
 POD_grondr_form_scrofa_modifier: "Hình Dạng Scrofa"
 POD_grondr_form_scrofa_modifier_desc: "Lợn rừng."
 


 POD_shapeshift_form_whippoorwill_modifier: "Hình Dạng Vật Tổ Whippoorwill"
 POD_shapeshift_form_kirijama_modifier: "Hình Dạng Vật Tổ Kirijama"
 POD_shapeshift_form_greendragon_modifier: "Hình Dạng Vật Tổ Green Dragon"
 POD_shapeshift_form_bat_totem_modifier: "Hình Dạng Vật Tổ Bat"
 POD_shapeshift_form_hakaken_modifier: "Hình Dạng Vật Tổ Hakaken"
 POD_shapeshift_form_darkfungus_modifier: "Hình Dạng Vật Tổ Dark Fungus"
 POD_shapeshift_form_relshab_modifier: "Hình Dạng Vật Tổ Relshab"
 POD_shapeshift_form_glouogh_modifier: "Hình Dạng Vật Tổ G'louogh"


 POD_shapeshift_form_shiva_modifier: "Shiva Kẻ Hủy Diệt"
 POD_shapeshift_form_shiva_modifier_desc: "Trong một luồng ánh sáng thánh thiện, Bastet biến thành một con báo-người dạng Crinos cao 12 feet, sáu tay, cầm những vũ khí bốc lửa. Cho tới khi mặt đất phủ đầy xác chết, cỗ máy thịnh nộ thần thánh này chặt chém mọi thứ xung quanh nó - dù là kẻ thù hay không - thành từng mảnh máu me be bét."
 POD_shapeshift_form_kali_modifier: "Kali Mẫu Thần Bóng Tối"
 POD_shapeshift_form_kali_modifier_desc: "Trong một luồng ánh sáng thánh thiện, Bastet biến thành một con báo-người dạng Crinos cao 12 feet, sáu tay, cầm những vũ khí bốc lửa. Cho tới khi mặt đất phủ đầy xác chết, cỗ máy thịnh nộ thần thánh này chặt chém mọi thứ xung quanh nó - dù là kẻ thù hay không - thành từng mảnh máu me be bét."


