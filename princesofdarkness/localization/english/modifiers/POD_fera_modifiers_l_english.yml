 war_quest_prowess_modifier: "Cuộc Hành Trình Vũ Dũng"
 war_quest_prowess_modifier_desc: "Ngươi liên tục bị những kẻ mạo danh thách thức trong suốt cuộc hành trình tâm linh của mình, một tình cảnh mệt mỏi."
 war_quest_province_modifier: "Cuộc Hành Trình Chiến Tranh"
 war_quest_province_modifier_desc: "Lãnh địa của ngươi liên tục bị tấn công như một phần của cuộc hành trình tâm linh chiến tranh, gây ra thương vong cao trong dân chúng."

 leadership_quest_vassal_modifier: "Cuộc Hành Trình Lãnh Đạo"
 leadership_quest_vassal_modifier_desc: "Phẩm chất lãnh đạo của ngươi liên tục bị nghi ngờ như một phần của cuộc hành trình tâm linh."
 leadership_quest_diplomacy_modifier: "Cuộc Hành Trình Lãnh Đạo"
 leadership_quest_diplomacy_modifier_desc: "Cuộc hành trình tâm linh của ngươi gây căng thẳng lên tâm trạng, khiến ngươi nổi giận vô cớ."
 leadership_quest_opinion_modifier: "Cuộc Hành Trình Lãnh Đạo"
 leadership_quest_opinion_modifier_desc: "Cuộc hành trình tâm linh của ngươi gây căng thẳng lên tâm trạng, khiến ngươi nổi giận vô cớ."

 stewardship_quest_domain_modifier: "Cuộc Hành Trình Cai Trị"
