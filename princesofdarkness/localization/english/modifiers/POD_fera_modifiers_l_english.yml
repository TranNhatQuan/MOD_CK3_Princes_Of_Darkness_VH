 learning_quest_piety_modifier: "Cuộc Hành Trình Tri Thức"
 learning_quest_piety_modifier_desc: "Bao nhiêu là câu đố! Linh hồn cú liên tục chất vấn lòng tận tụy của ngươi với chính nghĩa."
