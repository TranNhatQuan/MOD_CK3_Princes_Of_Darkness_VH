 #################
 # Pack Totems
 #################

 falcon_totem_modifier: "Vật Tổ Bầy: Falcon"
 falcon_totem_modifier_desc: "Falcon ghét những kẻ hèn nhát và sẽ tự tay hạ gục chúng nếu cần."
 grandfatherthunder_totem_modifier: "Vật Tổ Bầy: Grandfather Thunder"
 grandfatherthunder_totem_modifier_desc: "Grandfather dạy về sự kiên nhẫn và mưu tính cẩn trọng, nhưng không hề ưa những kẻ cai trị nhu nhược."
 stag_totem_modifier: "Vật Tổ Bầy: Stag"
 stag_totem_modifier_desc: "Stag là hiện thân hoàn hảo của thiên nhiên, yêu thương và chăm sóc bạn bè, nhưng tàn khốc và không khoan nhượng với kẻ thù."
 fenris_totem_modifier: "Vật Tổ Bầy: Đại Fenris"
 fenris_totem_modifier_desc: "Đại Fenris luôn phủ đầy máu, và mong con cháu mình cũng vậy."
 pegasus_totem_modifier: "Vật Tổ Bầy: Pegasus"
 pegasus_totem_modifier_desc: "Pegasus và các con gái của nàng bảo vệ những nghi lễ thiêng liêng khỏi cái ác của con người."
 cockroach_totem_modifier: "Vật Tổ Bầy: Cockroach"
 cockroach_totem_modifier_desc: "Cockroach có thời gian đứng về phía mình. Cuối cùng, con cháu của hắn sẽ là những kẻ sống sót cuối cùng."
 owl_totem_modifier: "Vật Tổ Bầy: Owl"
 owl_totem_modifier_desc: "Con cháu của Owl thấy được rất nhiều điều, nhưng chúng chỉ tiết lộ bí mật cho những ai thực sự biết lắng nghe."
 raven_totem_modifier: "Vật Tổ Bầy: Raven"
 raven_totem_modifier_desc: "Cơn đói khát vô tận của Raven đối với thức ăn, tri thức và của cải đã đưa con cháu hắn tiến về phía trước."
 rat_totem_modifier: "Vật Tổ Bầy: Rat"
 rat_totem_modifier_desc: "Rat có cả một đội quân trong tay. Ít ai, nếu có, sánh được với đám bộ binh vô số của hắn."
 bonyscrap_totem_modifier: "Vật Tổ Bầy: Bonyscrap"
 bonyscrap_totem_modifier_desc: "Linh hồn kền kền là một kẻ đáng ghét nhưng ít ai nhặt xác giỏi như hắn."
 hatii_totem_modifier: "Vật Tổ Bầy: Hatii"
 hatii_totem_modifier_desc: "Linh hồn voi hùng mạnh có trí nhớ lâu dài và, với bạn bè, là một đồng minh đáng tin cậy không gì sánh được."
 ika_ika_totem_modifier: "Vật Tổ Bầy: Ika-Ika"
 ika_ika_totem_modifier_desc: "Linh hồn khỉ tinh nghịch là một người bạn vui vẻ để có bên cạnh nhưng thói thích trêu chọc bất kỳ ai gần gũi khiến hắn kém được các Bastet điềm tĩnh hơn tôn trọng."
 butterfly_totem_modifier: "Vật Tổ Bầy: Butterfly"
 butterfly_totem_modifier_desc: "Butterfly luôn biến đổi, là đấng bảo trợ của những trái tim yên bình, những kẻ tràn đầy kinh ngạc trước điệu vũ vĩnh hằng."
 king_cats_totem_modifier: "Vật Tổ Bầy: King of Cats"
 king_cats_totem_modifier_desc: "King of Cats tinh khôn là hiện thân của Bastet hơn bất kỳ ai khác. Hắn là linh hồn của cuộc nổi dậy anh dũng và ưu ái những kẻ có trí óc nhanh nhạy và lưỡi kiếm còn nhanh hơn."
 king_beasts_totem_modifier: "Vật Tổ Bầy: King of Beasts"
 king_beasts_totem_modifier_desc: "Linh hồn Sư Tử là một bạo chúa hào phóng. Nếu ngươi khúm núm quỳ lạy trước hắn, hắn sẽ ban cho ngươi một chút sức mạnh đáng nể của mình."
 mantis_totem_modifier: "Vật Tổ Bầy: Mantis"
 mantis_totem_modifier_desc: "Theo một số truyền thuyết là đấng tạo ra thế giới, Mantis thông thái mơ mộng để thoát khỏi rắc rối. Với sự tinh thông bảy tầng tĩnh lặng, một giải pháp luôn tự hiện ra trước những kẻ theo hắn đúng lúc."
 mistress_catkind_totem_modifier: "Vật Tổ Bầy: Mistress of Catkind"
 mistress_catkind_totem_modifier_desc: "Hiện thân của bản chất nữ giới, Mistress vừa là người mẹ hết mực yêu thương, người tình đắm say, nữ thần chiến tranh và kẻ lang thang giữa bí ẩn, tất cả cùng một lúc."
 whispers_totem_modifier: "Vật Tổ Bầy: Whispers"
 whispers_totem_modifier_desc: "Linh hồn của những bí mật dẫn dắt các Bastet tò mò hướng tới những khám phá, nếu bản thân họ biết kiềm chế những hành động ồn ào."
 dragon_totem_modifier: "Vật Tổ Bầy: Dragon"
 dragon_totem_modifier_desc: "Dragon vĩ đại và hung tợn, thiêu cháy tất cả những kẻ chống lại hắn bằng hơi thở độc của mình."
 agni_totem_modifier: "Vật Tổ Bầy: Agni"
 agni_totem_modifier_desc: "Agni là Dragon được giải phóng, sức mạnh của hắn không gì sánh bằng."
 finch_totem_modifier: "Vật Tổ Bầy: Finch"
 finch_totem_modifier_desc: "Finch là sự thích nghi, thích nghi là để sống sót. Ép buộc thay đổi trong tự nhiên là mời gọi tai họa."
 horseshoe_crab_totem_modifier: "Vật Tổ Bầy: Horseshoe Crab"
 horseshoe_crab_totem_modifier_desc: "Hắn đã phát triển mạnh mẽ trong khi các Vua Thằn Lằn trỗi dậy rồi sụp đổ. Hắn sẽ sống lâu hơn cả loài người và cả Ngày Tận Thế."
 scarab_totem_modifier: "Vật Tổ Bầy: Scarab"
 scarab_totem_modifier_desc: "Với người hầu cận của Mặt Trời dõi theo ngươi, bóng tối bao trùm Khem cuối cùng có thể được thanh tẩy."
 snake_doctor_totem_modifier: "Vật Tổ Bầy: Snake Doctor"
 snake_doctor_totem_modifier_desc: "Hắn khâu lại vết thương cho những người bạn có vảy của mình, và khâu luôn cả tai của những kẻ khác."
 whiptail_lizard_totem_modifier: "Vật Tổ Bầy: Whiptail Lizard"
 whiptail_lizard_totem_modifier_desc: "Với các con gái, nàng ban cho sức mạnh, với đàn ông, nàng ban cho lòng thù hận."
 narukami_totem_modifier: "Vật Tổ Bầy: Naru-kami"
 narukami_totem_modifier_desc: "Grandfather Thunder tôn trọng sức mạnh, nhưng chỉ từ những kẻ xứng đáng."
 tsukiyomi_totem_modifier: "Vật Tổ Bầy: Tsuki-yomi"
 tsukiyomi_totem_modifier_desc: "Nữ Thần Mặt Trăng sẽ soi sáng con đường của ngươi, nhưng thủy triều nổi giận theo những vầng trăng đổi thay."
 susanowo_totem_modifier: "Vật Tổ Bầy: Susanowo"
 susanowo_totem_modifier_desc: "Thần Bão Tố đáp lại cơn thịnh nộ của ngươi bằng chính cơn thịnh nộ của hắn.\nSử dụng #V Storm#! Phép Thuật Thời Tiết gây 1 sát thương Sét [POD_aggravated_damage|E] lên mục tiêu của ngươi và tất cả [knights|E] của họ nếu họ đang có chiến tranh với ngươi."

 #Wyrm
 whippoorwill_totem_modifier: "Vật Tổ Bầy: Whippoorwill"
 whippoorwill_totem_modifier_desc: "Tiếng kêu của Whippoorwill sẽ là điều cuối cùng chúng nghe thấy."
 kirijama_totem_modifier: "Vật Tổ Bầy: Kirijama"
 kirijama_totem_modifier_desc: "Sự tồn tại của Kirijama Kẻ Ẩn Giấu được bao phủ trong bí ẩn."
 greendragon_totem_modifier: "Vật Tổ Bầy: Green Dragon"
 greendragon_totem_modifier_desc: "Từng là người bảo hộ của White Howlers, Green Dragon đã sa ngã khỏi ân sủng nặng nề như họ và vẫn tiếp tục ban phước cho những đứa con tha hóa của mình cho đến ngày nay."
 bat_totem_modifier: "Vật Tổ Bầy: Bat"
 bat_totem_modifier_desc: "Nửa điên loạn của Bat vẫn phụng sự chủ nhân đã sa ngã của nó."
 hakaken_totem_modifier: "Vật Tổ Bầy: Hakaken"
 hakaken_totem_modifier_desc: "Hoang tưởng và kiêu ngạo là hai đặc tính của những kẻ theo Hakaken. Bằng những công cụ này, chúng truyền bá lời của Incarna đã sa ngã của mình."
 darkfungus_totem_modifier: "Vật Tổ Bầy: Dark Fungus"
 darkfungus_totem_modifier_desc: "Loài cây duy nhất đủ mạnh để sống sót trong Black Spiral ban phước cho con cháu mình bằng những viễn kiến. Tuy nhiên không phải viễn kiến nào cũng được chào đón.\nMiễn phí tổn khi học [GetTrait('demonology').GetName(GetNullCharacter)] qua [journey|E]"
 relshab_totem_modifier: "Vật Tổ Bầy: Relshab"
 relshab_totem_modifier_desc: "Như Relshab, giờ đây cơn đói của ngươi là vĩnh cửu."
 glouogh_totem_modifier: "Vật Tổ Bầy: G'louogh"
 glouogh_totem_modifier_desc: "Một quả cầu kinh dị biến đổi không ngừng, G'louogh sinh ra một số sinh vật khủng khiếp nhất của $glossary_wyrm$ mỗi khi nó xuất hiện."
