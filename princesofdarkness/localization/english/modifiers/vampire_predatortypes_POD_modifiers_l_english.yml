l_english:
 predatortype_farmer_modifier: "Kiểu Săn Mồi: Nông Dân"
 predatortype_farmer_modifier_desc: "Ma cà rồng này thích hút máu từ động vật hơn."
 predatortype_bloodleech_modifier: "Kiểu Săn Mồi: Đỉa Máu"
 predatortype_bloodleech_modifier_desc: "Ma cà rồng này thích hút máu của các ma cà rồng khác!"
 predatortype_phlebotomist_modifier: "Kiểu Săn Mồi: Thầy Thuốc Trích Huyết"
 predatortype_phlebotomist_modifier_desc: "Ma cà rồng này lấy $pod_vitae$ dưới vỏ bọc một thầy thuốc thực hiện trích máu."
 predatortype_bedlamite_modifier: "Kiểu Săn Mồi: Kẻ Săn Người Điên"
 predatortype_bedlamite_modifier_desc: "Ma cà rồng này săn mồi trên những kẻ điên loạn. Bản thân chúng cũng có thể mất trí, hoặc ít nhất trông có vẻ như vậy trước con mồi."
 predatortype_cenobite_modifier: "Kiểu Săn Mồi: Tu Sĩ"
 predatortype_cenobite_modifier_desc: "Ma cà rồng này có một [POD_herd|E] tại một cơ sở tôn giáo như tu viện."
 predatortype_alleycat_modifier: "Kiểu Săn Mồi: Mèo Hẻm"
 predatortype_alleycat_modifier_desc: "Ma cà rồng này rình rập và tấn công bạo lực người phàm để lấy máu. Đây là một cách tiếp cận thô bạo."
 predatortype_cauchemar_modifier: "Kiểu Săn Mồi: Ác Mộng"
 predatortype_cauchemar_modifier_desc: "Ma cà rồng này chỉ hút máu từ những kẻ đang ngủ."
 predatortype_familias_modifier: "Kiểu Săn Mồi: Gia Tộc Máu"
 predatortype_familias_modifier_desc: "Ma cà rồng này gần như chỉ hút máu từ một dòng họ cụ thể. Nó thậm chí có thể có quan hệ huyết thống với gia đình đó; ít nhất đó là điều gia đình họ nghĩ."
 predatortype_footpad_modifier: "Kiểu Săn Mồi: Kẻ Cướp Đường"
 predatortype_footpad_modifier_desc: "Thây ma này lẩn khuất cùng tầng lớp cặn bã của xã hội, lấy máu của kẻ nghèo khó. Nếu chúng biến mất, chính quyền cũng chẳng buồn quan tâm."
 predatortype_consensualist_modifier: "Kiểu Săn Mồi: Người Theo Chủ Nghĩa Đồng Thuận"
 predatortype_consensualist_modifier_desc: "Ma cà rồng này chỉ hút máu từ những kẻ tự nguyện... điều này gây khó khăn lớn cho việc che giấu Màn Che trong lãnh địa."
 predatortype_osiris_modifier: "Kiểu Săn Mồi: Osiris"
 predatortype_osiris_modifier_desc: "Ma cà rồng này dẫn dắt một giáo phái máu, như thời cổ đại. Đám phàm nhân tôn thờ và tự nguyện hiến dâng bản thân cho vị thần máu này."
 predatortype_siren_modifier: "Kiểu Săn Mồi: Nàng Tiên Cá"
 predatortype_siren_modifier_desc: "Ma cà rồng này quyến rũ người tình để rút cạn máu họ qua nụ hôn."
 predatortype_gentry_modifier: "Kiểu Săn Mồi: Quý Tộc"
 predatortype_gentry_modifier_desc: "Ma cà rồng này có một vị trí địa vị nhất định trong xã hội phàm nhân. Nó dùng địa vị đó để săn lùng kẻ giàu có và quyền lực. Không ai tin rằng một kẻ thanh lịch như vậy lại là quái vật."
 predatortype_graverobber_modifier: "Kiểu Săn Mồi: Kẻ Trộm Mộ"
 predatortype_graverobber_modifier_desc: "Ma cà rồng này ám ảnh nghĩa trang và hầm mộ, săn mồi trên những người đưa tang và dòng máu lạnh của kẻ vừa mới qua đời."
 predatortype_extortionist_modifier: "Kiểu Săn Mồi: Kẻ Tống Tiền"
 predatortype_extortionist_modifier_desc: "Ma cà rồng này đe dọa và bóc lột phàm nhân để lấy máu của họ. Kẻ Tống Tiền đưa ra những 'lời đề nghị không thể từ chối'."
 
 

