l_english:
 mithras_bane_modifier: "Khắc Tinh của Mithras"
 mithras_bane_modifier_desc: "Ma cà rồng danh giá này đã trục xuất Mithras và bè lũ của hắn khỏi Britannia. Chiến tích ấy lừng danh khắp nơi."
 politically_secure_modifier: "Vững Vàng Chính Trị"
 politically_secure_modifier_desc: "Những lựa chọn gần đây của ngươi đã khiến ngươi được đồng bối kính trọng. Vị thế của ngươi có vẻ vững chắc trong lúc này."
 hostile_shadows_modifier: "Bóng Tối Thù Địch"
 hostile_shadows_modifier_desc: "Sự trỗi dậy như vũ bão của ngươi đã khiến nhiều kẻ ganh tị. Sẽ còn lâu mới hết những lưỡi dao chực chờ ngươi trong bóng tối."
 blood_horn_modifier: "Sừng Máu"
 blood_horn_modifier_desc: "Ngươi đã tìm lại được Sừng Máu lừng danh của Odin, một cổ vật có thể biến bất kỳ chất lỏng nào thành máu."
 broken_authority_modifier: "Uy Quyền Sụp Đổ"
 broken_authority_modifier_desc: "Nhân vật này đã mất đi một lượng uy tín đáng báo động: luôn là vấn đề lớn trong chính trường Ma Cà Rồng."
 capital_past_modifier: "Di Tích Al Andalus"
 capital_past_modifier_desc: "Người phàm đã bỏ lại Al Andalus phía sau, nhưng thành phố này có một xã hội bất tử tận tụy gìn giữ những kỷ vật của di sản chung họ."
 sword_of_troile_modifier: "Thanh Kiếm của Troile"
 sword_of_troile_modifier_desc: "Một trong những vũ khí quyền năng nhất lịch sử Kindred, thanh kiếm pha lê này từng được chính Troile sử dụng trong vô số trận chiến bảo vệ Carthage."
 #zmei_legacy_perk_effect: "# Fearsome creatures of immense power, once servants of the $glossary_wyrm$, are now bound to Baba Yaga, the Little Grandmother.#!" 
 babayaga_victory_opinion: "Trung Thành với Mụ Phù Thủy Già."
 eyes_and_ears_modifier: "Tai Mắt Khắp Nơi"
 eyes_and_ears_modifier_desc: "Là thủ lĩnh của $pod_clan$ Nosferatu, mạng lưới chỉ điểm của ngươi không ai sánh bằng."
 fortified_alamut_modifier: "Alamut Đoàn Kết"
 fortified_alamut_modifier_desc: "Thoát khỏi những xung đột nội bộ, Tổ Đại Bàng đứng vững bất khuất như pháo đài hàng đầu của thế giới $pod_cainite$."
 path_of_the_zealot_modifier: "Haqimite Cuồng Tín"
 path_of_the_zealot_modifier_desc: "Đoàn kết dưới ngọn cờ đức tin, mỗi Assamite giờ đây đều là một chiến binh bảo vệ chân lý đầy quyền năng."
 path_of_the_diplomat_modifier: "Haqimite Ngoại Giao"
 path_of_the_diplomat_modifier_desc: "Mỗi Assamite giờ đây đều nằm dưới một sự lãnh đạo mới, cho phép họ cầu viện ân huệ và bằng hữu khắp nơi trên thế giới."
 path_of_the_sorcerer_modifier: "Haqimite Pháp Sư"
 path_of_the_sorcerer_modifier_desc: "Ẩn dật, nhưng giờ đây đã đoàn kết trong nghiên cứu, $pod_clan$ Assamite là người canh giữ vô vàn bí mật chưa từng được tiết lộ."
 eternal_consul_modifier: "Chấp Chính Quan Vĩnh Hằng"
 eternal_consul_modifier_desc: "Kẻ cai trị Rome Tội Lỗi là một sinh vật đầy mê hoặc, chỉ cần một lời thì thầm là khiến ước muốn đen tối nhất của hầu hết mọi người thành hiện thực."
 lasombra_chronicles_modifier: "Biên Niên Sử Lasombra"
 lasombra_chronicles_modifier_desc: "Tập cuối cùng kể về sự trỗi dậy của đấng cứu thế $pod_clan$ Lasombra, khắc tinh của [Glossary('Ashirra','game_concept_ashirra_desc')]."
 eternal_mullah_modifier: "Mullah Vĩnh Hằng"
 eternal_mullah_modifier_desc: "Mullah Vĩnh Hằng chiến thắng của [Glossary('Ashirra','game_concept_ashirra_desc')] là một tồn tại có uy quyền tâm linh và thế tục vô song."
 ashirra_castle_modifier: "[Glossary('Ashirra','game_concept_ashirra_desc')] Castel del Ombro"
 ashirra_castle_modifier_desc: "Khi $pod_clan$ Lasombra dần bị [Glossary('Ashirra','game_concept_ashirra_desc')] thống trị, một trụ sở mới, phù hợp hơn, đang được xây dựng."
 impressed_westerner_opinion: "Gangrel Tây Phương Ấn Tượng"
 collapse_civilisation_modifier: "Văn Minh Sụp Đổ"
 collapse_civilisation_modifier_desc: "Bầy sói đã áp sát cửa, và ngươi chỉ vừa đủ sức ngăn chúng lại. Quyền kiểm soát của ngươi giờ chẳng còn vươn xa hơn phòng ngai bao nhiêu."
 alpha_gangrel_modifier: "Gangrel Đầu Đàn"
 alpha_gangrel_modifier_desc: "Ngươi đã đánh bại mọi kẻ thách thức. Toàn bộ $pod_clan$ đối xử với ngươi bằng sự kính trọng, nếu không muốn nói là phục tùng."
 prime_councilor_modifier: "Nghị Viên Tối Cao"
 prime_councilor_modifier_desc: "Nhiếp chính của $pod_clan$ thay cho Tremere, cá nhân này có quyền tiếp cận tri thức hiếm có và có thể trông cậy vào lòng trung thành của các đồng tộc."
 prime_curse_modifier: "Lời Nguyền Tối Cao"
 prime_curse_modifier_desc: "Lời nguyền của Nghị Viên Tối Cao đã chạm đến cá nhân này, khiến họ khó lòng suy nghĩ mạch lạc."
 dark_nobility_modifier: "Quý Tộc Bóng Tối"
 dark_nobility_modifier_desc: "Ngự trị trên những lâu đài u ám và dân chúng bị áp bức, $pod_clan$ Tzimisce là một trong những kẻ cai trị đáng sợ nhất."
 kupala_empowered_modifier: "Được Kupala Tăng Lực"
 kupala_empowered_modifier_desc: "Ngươi đã giao kèo với quỷ dữ. Theo đúng nghĩa đen."
 kupala_depowered_modifier: "Bị Kupala Rút Lực"
 kupala_depowered_modifier_desc: "Kẻ Earthbound vùng Carpathian đã rút sinh lực từ cá nhân này để tăng lực cho tôi tớ được hắn sủng ái."
 sargon_codex_modifier: "Sách Cổ Sargon"
 sargon_codex_modifier_desc: "Quyền năng tối thượng, hay ít nhất là tri thức, giờ thuộc về ngươi. Nhưng lý trí của ngươi thì không còn là của ngươi nữa."
 grateful_brethren_opinion: "Huynh Đệ Biết Ơn"
 sargon_fragment_modifier: "Mảnh Vỡ Sách Cổ Sargon"
 sargon_fragment_modifier_desc: "Chỉ một mảnh vỡ của Sách Cổ Sargon đã bị hủy diệt, nhưng vẫn là một vật chứa quyền năng của lời tiên tri và trí huệ."
 pseudo_third_modifier: "Giả Thế Hệ Ba"
 pseudo_third_modifier_desc: "Ngươi chưa hoàn thành $pod_diablerie$ [Glossary('Antediluvian','game_concept_antediluvian_desc')], nhưng ngươi vẫn gần đạt tới quyền năng và uy danh ngang tầm thế hệ thứ 3."
 cappadocian_purge_modifier: "Cuộc Thanh Trừng Cappadocian"
 cappadocian_purge_modifier_desc: "$pod_clan$ Giovanni mới tập trung tận diệt những ân nhân cũ của mình, cùng bất kỳ ai che chở cho họ."
 kill_on_sight_modifier: "Gặp Là Giết"
 kill_on_sight_modifier_desc: "Bị kẻ thù nhắm tới, những nhân vật này đang sống trên thời gian vay mượn, bị săn đuổi ở mọi ngóc ngách."
 decentralized_rule_modifier: "Cai Trị Phân Quyền"
 decentralized_rule_modifier_desc: "Ngươi chẳng qua chỉ là người giữ hòa bình cho một tập hợp các thực thể chính trị khác nhau. Vì vậy, dù được kính trọng, ngươi không phải lúc nào cũng được tuân phục."
 serpent_allure_modifier: "Sức Quyến Rũ của Rắn Thần"
 serpent_allure_modifier_desc: "Ngươi được chính Set ban phước, mang trong mình một hào quang rõ rệt hứa hẹn thỏa mãn mọi ước muốn đen tối."
 sword_of_samiel_modifier: "Thanh Kiếm của Samiel"
 sword_of_samiel_modifier_desc: "Chiến Binh Salubri huyền thoại đầu tiên là một chiến binh vô song, sẵn sàng làm nhiều hơn cả bổn phận để chống lại thế lực bóng tối."
 saulot_heir_modifier: "Người Kế Thừa Saulot"
 saulot_heir_modifier_desc: "Ngươi là một sinh vật khôn ngoan như chính Saulot từng là; có kẻ còn nói ngươi cuối cùng đã tìm thấy [golconda|E] sau bao năm tranh đấu."
 usurpers_exposed_modifier: "Kẻ Tiếm Quyền Bị Vạch Trần"
 usurpers_exposed_modifier_desc: "$pod_clan$ Tremere đã bị vạch trần đúng bản chất của chúng. Một lũ dối trá đánh cắp linh hồn suýt đẩy $pod_clan$ của ngươi đến bờ diệt vong chỉ vì lợi ích riêng."
 herald_of_the_end_modifier: "Đại Địch Thù"
 herald_of_the_end_modifier_desc: "Ngươi là Nergal tái sinh, kẻ báo điềm diệt vong và đọa đày của thế giới bị nguyền rủa này. Chúng sẽ phải quỳ gối hoặc chết."
 demons: "Ác Quỷ Earthbound"
 demons_flavor: "#F Thiên Thần Sa Ngã từ cuộc nổi loạn định mệnh của Lucifer. Nhà ngục vực thẳm của chúng có những điểm yếu, và chúng có thể bị triệu hồi lên cõi phàm trần rồi bị trói buộc với cái giá rất đắt.#!"
 #DEMONS_LEGACY_PERK_EFFECT: "@warning_icon!#X This legacy perk is only unlockable by achieving the [GetTrait('baali').GetName( GetPlayer )] $pod_clan$ #Weak (Except Via Hyron)#! special objective [decision|E].#!" 
 ##VENTRUE_OBJECTIVE_LEGACY_PERK_EFFECT: "@warning_icon!#X This legacy perk is only unlockable by achieving the [GetTrait('ventrue').GetName( GetPlayer )] $pod_clan$ special objective [decision|E].#!" 
 #ZMEI_LEGACY_PERK_EFFECT: "@warning_icon!#X This legacy perk is only unlockable by achieving the Caring Grandmother special objective [decision|E], available to Nosferatu and characters on the Via Tantabus.#!"  
 rebel_conqueror_modifier: "Kẻ Chinh Phạt Nổi Loạn của Phương Tây"
 rebel_conqueror_modifier_desc: "Ngươi không quỳ gối trước Triều Đình hay Tổ Tiên nào cả. Trên lãnh thổ của ngươi, ý chí của ngươi là tối thượng, và khốn khổ cho kẻ nào dám thách thức ngươi."
 first_magaji_modifier: "Magaji Đầu Tiên"
 first_magaji_modifier_desc: "Magaji đầu tiên được toàn châu Phi chính thức công nhận mang tầm quan trọng to lớn trong chính trường Laibon."
 TARGET_IS_HUNTER: "Là Thẩm Tra Viên: $VALUE|=+0$"
 TARGET_IS_VAMPIRE: "Là Ma Cà Rồng: $VALUE|=+0$"
 TARGET_IS_GHOUL: "Là [ghoul|E]: $VALUE|=+0$"
 TARGET_IS_MORTAL: "Là Người Phàm: $VALUE|=+0$"
 TARGET_IS_WEREWOLF: "Là Người Sói: $VALUE|=+0$"
 TARGET_IS_MUMMY: "Là Xác Ướp: $VALUE|=+0$"
 TARGET_IS_WRAITH: "Là Oan Hồn: $VALUE|=+0$"
 TARGET_IS_MAGE: "Là Pháp Sư: $VALUE|=+0$"
 TARGET_IS_FAE: "Là Tiên: $VALUE|=+0$"
 TARGET_IS_DEMON: "Là Ác Quỷ: $VALUE|=+0$"
 chosen_of_light_modifier: "Kẻ Được Ánh Sáng Chọn"
 chosen_of_light_modifier_desc: "Có một hào quang kỳ lạ bao quanh nhân vật này. Như thể chính đấng thần thánh đã chọn họ cho một mục đích cao cả hơn."
 link_enoch_modifier: "Cổng Vào Enoch"
 link_enoch_modifier_desc: "Enoch, Thành Phố Đầu Tiên, là quê hương thật sự của Tal'meha'Ra tại [UmbraGlossaryLocalized('shadowlands','Âm Phủ')]. Quận này giờ đây có đường liên thông trực tiếp tới đó và có thể rút tài nguyên từ đó tùy ý."
 seed_of_rebellion_modifier: "Hạt Giống Nổi Loạn"
 seed_of_rebellion_modifier_desc: "Tal'mahe'Ra bí ẩn đã gieo hạt giống nghi kỵ và nổi loạn vào nhân vật này."
 runemages_community_modifier: "Cộng Đồng Pháp Sư Rune"
 runemages_community_modifier_desc: "Đại Sảnh của Ulf đã tìm nơi trú ẩn tại tỉnh này, mang ảnh hưởng huyền bí của họ đến quê hương mới."
 cursed_by_cathar_modifier: "Lời Nguyền của Cathar"
 cursed_by_cathar_modifier_desc: "Người Cathar cuối cùng đã nguyền rủa tên ngươi khi hắn chết trong một cái chết không thể dung thứ. Ngươi cảm thấy... lo lắng."
 cathar_community_modifier: "Cộng Đồng Cathar"
 cathar_community_modifier_desc: "Những người Cathar cuối cùng đã tìm nơi trú ẩn tại đây, dưới sự bảo hộ của ngươi. Một sự thật đã khiến cư dân bất bình."
 lost_in_callous_modifier: "Hiện Thân của Kinh Hoàng"
 lost_in_callous_modifier_desc: "Chúng sợ ngươi. Chúng bảo rằng Chúa đã rời bỏ ngươi. Nhưng ngươi biết Người chưa từng gần ngươi hơn thế."
 hardened_heart_modifier: "Trái Tim Chai Sạn"
 hardened_heart_modifier_desc: "Nhân vật này đã tẩy sạch trái tim mình khỏi những tình cảm ủy mị cản trở điều cần phải làm."
 bloodline_founder_modifier: "Người Sáng Lập Chi Hệ Máu"
 bloodline_founder_modifier_desc: "Người sáng lập chi hệ máu của chính mình, mọi thành viên trong dòng dõi này đều công nhận ngươi là tổ tiên của họ."
 firebombs_modifier: "Bom Lửa"
 firebombs_modifier_desc: "Người này được trang bị những quả cầu gốm chứa chất cực kỳ dễ cháy cùng hệ thống kích nổ."
 firespewer_modifier: "Súng Phun Lửa"
 firespewer_modifier_desc: "Người này được trang bị một cỗ máy thử nghiệm có khả năng phun ra chất dễ cháy dưới áp lực và đồng thời châm lửa nó."
 masters_of_fire: "Bậc Thầy Lửa"
 masters_of_fire_desc: "Phe phái này đã tìm lại được bí mật của Lửa Hy Lạp và điều chỉnh vũ khí này theo nhu cầu của họ."
 gifts_from_heaven_modifier: "Món Quà từ Thiên Đường"
 gifts_from_heaven_modifier_desc: "Sự tinh thông thực sự về Qiao được ban cho nhân vật này, cho phép họ học các cấp độ Qiao cao ngay cả trước bình minh của [Glossary('Sixth Age','game_concept_sixth_age_desc')]."
 keening_modifier: "Tiếng Ai Ca"
 keening_modifier_desc: "Sức mạnh của Tiếng Ai Ca vẫn bảo vệ ngươi dù ở cách xa Hòn Đá Đen."
 sufi_mystic_modifier: "Bậc Thầy Huyền Thuật"
 sufi_mystic_modifier_desc: "Kiến thức của ngươi về các thế lực huyền bí kết hợp với giáo lý Taftani đã dạy cho ngươi rất nhiều điều."
 kabbalah_modifier: "Đại Mekubbal"
 kabbalah_modifier_desc: "Nhờ thấu hiểu trọn vẹn Talmud bí truyền, ngươi là bậc thầy huyền học Do Thái."
 antediluvian_dominor_modifier: "Nghi Thức Chưa Trọn Vẹn"
 antediluvian_dominor_modifier_desc: "Ngươi đã không hoàn thành trọn vẹn nghi thức Đoạt Máu, nhưng ngươi vẫn nhận được một phần quyền năng của dòng máu ấy truyền sang mình."

 indep_mummy_against_horus_modifier: "Kẻ Thù của Horus"
 indep_mummy_with_horus_modifier: "Đồng Minh của Horus"

 support_from_knight_of_acre_modifier: "Sự Ủng Hộ của Hiệp Sĩ Acre"
 support_from_sister_of_stjohn_modifier: "Sự Ủng Hộ của Nữ Tu Sĩ Thánh John"
 support_from_oculi_dei_modifier: "Sự Ủng Hộ của Oculi Dei"
 support_from_red_order_modifier: "Sự Ủng Hộ của Hồng Giáo Đoàn"
 support_from_von_murnau_modifier: "Sự Ủng Hộ của Gia Tộc Murnau"

 decani_boon_modifier: "Ân Huệ của Decani"
 decani_boon_modifier_desc: "#flavor Nhân vật này đã được ban cho một mảnh quyền năng của [GetTrait('demon').GetName(GetNullCharacter)] bởi một Decani.#!\nCho phép tiếp cận [investiture_lifestyle|E] [lifestyle|E]"
 decani_modifier: "Decani"
 decani_modifier_desc: "#flavor Nhân vật này đã cướp đoạt quyền năng của [GetTrait('demon').GetName(GetNullCharacter)], sau khi ăn linh hồn của một Decani.#!\nCho phép tiếp cận [arcana_lifestyle|E] và [lore_lifestyle|E] [lifestyles|E]"

 cappadocius_boon_modifier: "Ân Huệ của Cappadocius"

