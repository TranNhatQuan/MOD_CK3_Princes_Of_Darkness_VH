 demon_arts_infernal_fortitude_modifier: "Pháp Nghệ Ma: Kiên Cường Địa Ngục"
 demon_arts_infernal_fortitude_modifier_desc: "Có thể [soak_damage|E] [POD_aggravated_damage_with_box|E]"
 demon_arts_iron_mountain_modifier: "Pháp Nghệ Ma: Thiết Sơn"

 demon_arts_infernal_glory_modifier: "Pháp Nghệ Ma: Vinh Quang Địa Ngục"
 demon_arts_demon_regalia_modifier: "Pháp Nghệ Ma: Ma Bào"

 demon_regalia_barbed_hide_modifier: "Da Gai Móc"
 demon_regalia_razor_claws_modifier: "Móng Vuốt Dao Cạo"
 demon_regalia_razor_claws_modifier_desc: "Nhân vật mọc ra móng vuốt sắc như dao cạo."
 demon_regalia_razor_horns_modifier: "Sừng Dao Cạo"
 demon_regalia_razor_horns_modifier_desc: "Nhân vật mọc sừng từ đầu. Sừng có thể ngắn hoặc dài, trơn nhẵn hoặc lởm chởm, thẳng hoặc cong, nhiều nhánh hoặc một nhánh, tùy theo ý muốn của nhân vật."
 demon_regalia_demon_weapon_modifier: "Vũ Khí Ma Quỷ"
 demon_regalia_demon_weapon_modifier_desc: "Một vũ khí huyền bí xuất hiện trong tay nhân vật. Vũ khí này có thể bừng cháy với Khí, phát ra những tiếng rên rỉ kinh hoàng, phủ đầy những khuôn mặt nhăn nhó, v.v."
 demon_regalia_demon_armor_modifier: "Áo Giáp Ma Quỷ"
 demon_regalia_demon_armor_modifier_desc: "Áo giáp ma quỷ có thể xuất hiện dưới dạng vảy, áo giáp samurai lộng lẫy, hoặc bất cứ hình dạng nào khác, và mang lại khả năng bảo vệ tốt hơn trước các đòn tấn công."
 demon_regalia_extra_arms_modifier: "Cánh Tay Phụ"
 demon_regalia_extra_arms_modifier_desc: "Hai cánh tay phụ mọc ra từ thân nhân vật, cho phép kỹ năng vật lộn tốt hơn hoặc đơn giản là thực hiện nhiều đòn tấn công hơn bình thường."
 demon_regalia_huge_size_modifier: "Kích Thước Khổng Lồ"
 demon_regalia_huge_size_modifier_desc: "Sinh lực của nhân vật tăng lên khi họ đột nhiên phát triển cao từ chín đến mười hai feet."
 demon_regalia_poisoned_fangs_modifier: "Răng Nanh Độc"
 demon_regalia_poisoned_fangs_modifier_desc: "Răng nanh trong miệng nhân vật trở nên đặc biệt to, sắc bén và ăn mòn."
 demon_regalia_spikes_modifier: "Gai Nhọn"
 demon_regalia_spikes_modifier_desc: "Cơ thể nhân vật phủ đầy một trong những thứ sau: gai nhọn, da nhám như cá mập, lông cứng và sắc như dây thép gai, móng, da nóng bỏng hoặc lạnh buốt, dao cạo, gai móc, hoặc mảnh thủy tinh vỡ."
 demon_regalia_tentacles_modifier: "Xúc Tu"
 demon_regalia_tentacles_modifier_desc: "Nhân vật mọc ra những xúc tu ghê tởm phủ đầy chất nhầy."
 demon_regalia_tail_modifier: "Đuôi"
 demon_regalia_tail_modifier_desc: "Nhân vật mọc ra một cái đuôi."
 demon_regalia_wings_modifier: "Đôi Cánh"
 demon_regalia_wings_modifier_desc: "Những cánh giống dơi nhô ra và trải rộng từ lưng nhân vật."
 demon_regalia_antennae_modifier: "Râu"
 demon_regalia_antennae_modifier_desc: "Kẻ sở hữu mọc ra một đôi râu giống côn trùng giúp cảm nhận môi trường xung quanh."
 demon_regalia_monstrous_maw_modifier: "Hàm Miệng Quái Vật"
 demon_regalia_monstrous_maw_modifier_desc: "Hàm miệng của nhân vật có thể tháo khớp đến mức độ bất thường."


