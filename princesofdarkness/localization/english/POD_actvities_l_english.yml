 brujah_panegyra_option_accommodations: "Chỗ Ở"
 brujah_panegyra_accommodations_bad: "Lều Trại Xập Xệ"
 brujah_panegyra_accommodations_bad_desc: "$EFFECT_LIST_BULLET$ Chỗ ở càng tốt, ngươi càng nhận được nhiều uy vọng gia tộc khi hoạt động kết thúc.\n\n#weak Điều gì quan trọng hơn, kỹ năng được phô diễn hay nơi phô diễn chúng?#!"
 brujah_panegyra_accommodations_normal: "Lều Bạt Đơn Giản"
 brujah_panegyra_accommodations_normal_desc: "$EFFECT_LIST_BULLET$ Chỗ ở càng tốt, ngươi càng nhận được nhiều uy vọng gia tộc khi hoạt động kết thúc.\n\n#weak Bí quyết để có một màn trình diễn tươm tất là có được một ngày nghỉ ngơi tốt.#!"
 brujah_panegyra_accommodations_good: "Trại Doanh Xa Hoa"
 brujah_panegyra_accommodations_good_desc: "$EFFECT_LIST_BULLET$ Chỗ ở càng tốt, ngươi càng nhận được nhiều uy vọng gia tộc khi hoạt động kết thúc.\n\n#weak Panegyra nên là nhiều hơn những sự kiện thể thao đơn thuần, chúng nên là toàn bộ #underline trải nghiệm#! để phô trương vinh quang của thị tộc Brujah!.#!"
 
 brujah_panegyra_option_prizes: "Giải Thưởng"
 brujah_panegyra_prizes_bad: "Giải Thưởng Đơn Giản"
 brujah_panegyra_prizes_bad_desc: "$EFFECT_LIST_BULLET$ Quyết định số lượng vàng trao cho người chiến thắng.\n\n#weak Chúng ta ở đây vì tình yêu thể thao, những món đồ trang trí kia chỉ là cái cớ.#!"
 brujah_panegyra_prizes_normal: "Giải Thưởng Tươm Tất"
 brujah_panegyra_prizes_normal_desc: "$EFFECT_LIST_BULLET$ Quyết định số lượng vàng trao cho người chiến thắng.\n\n#weak Dù không đến đây vì giải thưởng, có thể trang trải cho chuyến về nhà cũng là một mục tiêu rất thực tế.#!"
 brujah_panegyra_prizes_good: "Giải Thưởng Hảo Hạng"
 brujah_panegyra_prizes_good_desc: "$EFFECT_LIST_BULLET$ Quyết định số lượng vàng trao cho người chiến thắng.\n\n#weak Không có gì để đặt cược, thì thi đấu còn ý nghĩa gì?#!"
 brujah_panegyra_prizes_very_good: "Giải Thưởng Tốt"
 brujah_panegyra_prizes_very_good_desc: "$EFFECT_LIST_BULLET$ Quyết định số lượng vàng trao cho người chiến thắng.\n\n#weak Một giải thưởng không chỉ là món đồ trang trí trao cho người thắng cuộc, nó còn là ngọn hải đăng thu hút những kẻ gan dạ và táo bạo đến tham dự.#!"
 brujah_panegyra_prizes_splendid: "Giải Thưởng Lộng Lẫy"
 brujah_panegyra_prizes_splendid_desc: "$EFFECT_LIST_BULLET$ Quyết định số lượng vàng trao cho người chiến thắng.\n\n#weak Những giải thưởng tốt nhất là những giải thưởng hào nhoáng đến mức làm lu mờ chính người thắng cuộc.#!"

 brujah_panegyra_phase_archery: "Bắn Cung"
 brujah_panegyra_phase_archery_desc: "Một cuộc thi cung trong đó mỗi thí sinh bắn vào mục tiêu với một số lượng mũi tên nhất định, nhằm ghi được càng nhiều điểm càng tốt.\nĐây là một phần bổ sung khá mới cho Panegyra, chủ yếu được yêu cầu bởi các thành viên trẻ tuổi của thị tộc Brujah mong muốn một điều gì đó "hiện đại" hơn để thi đấu."
 brujah_panegyra_phase_kerykes: "Kerykes"
 brujah_panegyra_phase_kerykes_desc: "Một cuộc thi tài hùng biện, đây từ lâu là môn được yêu thích nhất bởi bộ phận uyên bác nhất của Brujah.. và cũng là môn bị người ngoài sợ hãi nhất vì độ dài lê thê của nó."
 brujah_panegyra_phase_wrestling: "Đấu Vật"
 brujah_panegyra_phase_wrestling_desc: "Một phần kinh điển của Thế Vận Hội Hy Lạp, đấu vật là cuộc thi sức mạnh và mưu trí, trong đó các thí sinh cố gắng vật ngã hoặc ném đối thủ ra khỏi vòng đấu để trở thành người trụ lại cuối cùng."
 brujah_panegyra_phase_boxing: "Đấm Bốc"
 brujah_panegyra_phase_boxing_desc: "Cuộc thi có khả năng gây ra cơn Cuồng Loạn cho các thí sinh nhiều nhất, đấm bốc đặt hai đấu sĩ vào một trận đấu với một bộ quy tắc công phu (và thường thay đổi giữa mỗi kỳ Panegyra)."
 brujah_panegyra_phase_board_game: "Cờ Bàn"
 brujah_panegyra_phase_board_game_desc: "Một cuộc thi trí tuệ trong đó các thí sinh chơi một loạt các ván cờ bàn, với người chiến thắng cuối cùng là người chơi còn trụ lại sau cùng.\nCờ vua là môn được chơi nhiều nhất nhưng các kỳ Panegyra tổ chức tại những vùng đất mà nó không phổ biến thường thay thế bằng một lựa chọn địa phương khác."
 brujah_panegyra_phase_horse_race: "Đua Ngựa"
 brujah_panegyra_phase_horse_race_desc: "Một môn thể thao khán giả trong đó các lãnh chúa và phu nhân đưa ngựa vào cuộc đua với nhau, người chiến thắng là người đầu tiên vượt qua vạch đích.\nMột số kỳ Panegyra sử dụng xe ngựa cho cuộc thi này, trong khi những kỳ khác tách các cuộc đua ngựa thành nhiều cuộc thi nhỏ hơn."
 
 panegyra_rewards_tt: "Phần thưởng được trao cho người chiến thắng."
 
 brujah_panegyra_events.1000.t: "Bắn Cung"
 brujah_panegyra_events.1000.desc: "Bắn cung chưa bao giờ là một phần của Thế Vận Hội cổ đại và, do đó, không được các Brujah xem là phù hợp cho Panegyra của họ. Chỉ sau một chiến dịch vận động dài và gian nan của các thành viên trẻ tuổi trong thị tộc, nó mới cuối cùng được thêm vào như một môn thi đấu. Những người ủng hộ bắn cung thường giải thích rằng đây là hiện thân hoàn hảo của người Brujah vì nó đòi hỏi cả năng lực thể chất lẫn một trí óc sắc bén.\nHầu hết người chiến thắng thường là những tân ma trẻ tuổi lớn lên với cây cung trong tay và đây từ lâu là môn thi mà họ mong đợi nhất. Các trưởng lão thường xem đây là điều xấu cần thiết, một sự mở đầu cho những phần truyền thống và được tôn trọng hơn nhiều của Panegyra diễn ra sau đó."
 brujah_panegyra_events.1000.a: "Đã đến lúc dốc toàn lực!"
 brujah_panegyra_events.1000.b: "Không phải sở trường của ta, hãy thong thả thôi."
 brujah_panegyra_events.1000.c: "Ta đã sẵn sàng."
 panegyra_overdrive_tt: "Điều này sẽ tăng cơ hội thành công của ngươi trong cuộc thi này."
 panegyra_underdrive_tt: "Điều này sẽ giảm cơ hội thành công của ngươi trong cuộc thi này."
 
 brujah_panegyra_events.1010.t: "Kerykes"
 brujah_panegyra_events.1010.desc: "Các kerykes (sứ giả) từng gắn liền với các salpinktai (người thổi kèn) trong Thế Vận Hội cổ đại để tạo thành cuộc thi Sứ Giả và Kèn Trumpet. Phần thổi kèn chưa bao giờ thực sự phổ biến trong giới Brujah nhưng cuộc thi hùng biện thì chắc chắn có. Người chiến thắng được chọn dựa trên sự rõ ràng trong cách phát âm và độ vang của giọng nói cũng như những gì họ thực sự nói. Một số dùng thơ ca trong khi những người khác ưa chuộng các tác phẩm chính trị Hy Lạp cổ như Plato hay Aristotle.\nĐược các trưởng lão Brujah yêu thích, đây là một cuộc thi bị các thị tộc khác sợ hãi vì nó có thể kéo dài hàng đêm ròng rã trước khi kết thúc. Những lời đề nghị lịch sự về việc đặt ra giới hạn thời gian cho mỗi thí sinh cho đến nay vẫn bị từ chối thẳng thừng."
 brujah_panegyra_events.1010.b: "Hãy cố đừng ngủ gật..."
 brujah_panegyra_events.1010.c: "Giọng nói của ta là một vũ khí được mài sắc!"

 brujah_panegyra_events.1020.t: "Đấu Vật"
 brujah_panegyra_events.1020.desc: "Kinh điển của mọi kinh điển, đấu vật đã là một phần cố định của Thế Vận Hội từ khi có Thế Vận Hội. Luật lệ của nó hầu như không thay đổi kể từ khi được sáng tạo ra và nó vẫn là môn được ưa chuộng của Panegyra cho đến tận đêm nay. Gangrel và Nosferatu được ghi nhận là những thí sinh đặc biệt hung mãnh, thường tước đoạt chiến thắng của Brujah, vì họ quen với những kỳ tích sức mạnh thể chất cần thiết để chiến thắng ở đây."

 brujah_panegyra_events.1030.t: "Đấm Bốc"
 brujah_panegyra_events.1030.desc: "Đấm bốc có vinh dự đáng ngờ là vừa là cuộc thi có luật lệ thay đổi thường xuyên nhất vừa là môn gây ra cơn Cuồng Loạn nhiều nhất cho các thí sinh. Do đó, đôi khi nó bị tranh cãi là không phù hợp với ma cà rồng nhưng nỗ lực loại bỏ nó khỏi Panegyra chưa bao giờ nhận được nhiều sự ủng hộ.\nĐây là môn thi ưa thích của người Toreador, những kẻ nói rằng họ trân trọng "nghệ thuật thể chất" được phô diễn qua một cuộc thi như vậy. Những người Brujah hay châm biếm từng ám chỉ rằng họ chỉ muốn thỏa mãn dục vọng của mình với các thí sinh, vì đấm bốc, theo truyền thống Hy Lạp, được thực hiện trong tình trạng khỏa thân."

 brujah_panegyra_events.1040.t: "Cờ Bàn"
 brujah_panegyra_events.1040.desc: "Phần bổ sung đầu tiên không thuộc Thế Vận Hội Hy Lạp vào Panegyra, các trò chơi cờ bàn từ lâu đã là một phần cố định. Được các trưởng lão Brujah ưa chuộng (và cả các Lasombra tham gia), đây thường là cuộc thi quan trọng nhất về mặt chính trị vì các trưởng lão này thường trò chuyện trong lúc chơi và một số người cho rằng những quyết định quan trọng (hoặc mối thù) đã định hình thế giới Cainite bắt đầu từ đây.\nCờ vua là môn chủ đạo nhưng không phải là môn duy nhất được chơi. Tuy nhiên, các trọng tài khá miễn cưỡng trong việc nhanh chóng giới thiệu những trò chơi mới, vì một số thí sinh từng cố gắng đưa ra trò chơi bị lãng quên của họ từ một nền văn hóa bị lãng quên mà không có cách nào để kiểm tra luật lệ, điều này sẽ mang lại cho họ lợi thế không công bằng."

 brujah_panegyra_events.1050.t: "Đua Ngựa"
 brujah_panegyra_events.1050.desc: "Thế Vận Hội Hy Lạp rất ưa chuộng đua ngựa, được xem là cuộc thi danh giá nhất, và nó đã được Panegyra của Brujah mô phỏng theo trong nhiều thế kỷ nay. Tuy nhiên, mỗi kỳ đều có cách tổ chức cuộc đua khác nhau, với xe ngựa là một cảnh tượng vinh quang nhưng ngày càng hiếm gặp trong thời nay (vì những người đánh xe và thợ đóng xe ngựa lành nghề đã trở nên khan hiếm trong thời đại này).\nNhiều nơi đã chuyển sang một cuộc đua ngựa truyền thống hơn và sau đó phải cân nhắc xem có chấp nhận ngựa Bộc huyết hay không. Chưa có sự đồng thuận dứt khoát nào đạt được về chủ đề này và, do đó, một thí sinh nên hỏi thăm về điều này trước cuộc đua, nếu không sẽ có nguy cơ bị buộc tội gian lận."

 brujah_panegyra_events.20.t: "Kết Thúc Cuộc Thi"
 brujah_panegyra_events.20.desc: "[contest_winner.GetTitledFirstName] đã thắng cuộc thi!\nBụi lắng xuống trong đấu trường khi phần này của Panegyra khép lại. Kẻ thua cuộc liếm láp vết thương (thể xác hoặc không) của mình, người chiến thắng đắm chìm trong vinh quang (và sự ganh tị) đạt được nhờ màn trình diễn của họ, và những nô bộc bị Bộc huyết bị bỏ lại để dọn dẹp mớ hỗn độn do các chủ nhân bất tử của họ để lại."
 brujah_panegyra_events.20.a: "Vinh quang cho người thắng cuộc, tang thương cho kẻ bại trận."
 
 brujah_panegyra_events.13.t: "Olympia Tái Sinh"
 brujah_panegyra_events.13.desc: "Được giới thiệu lần đầu bởi các Brujah gốc Hy Lạp say mê ý tưởng về Thế Vận Hội Olympic, Panegyra là một cuộc tụ họp truyền thống của thị tộc Brujah trên đảo Chalcis diễn ra mỗi thập kỷ. Các trò chơi được tài trợ, bám sát theo Thế Vận Hội Hy Lạp cổ, là phần được mong đợi nhất của sự kiện.\nPanegyra đã lan rộng đến bất cứ nơi nào thị tộc Brujah đặt chân đến qua nhiều thế kỷ và nhiều kỳ nhỏ hơn được tổ chức ở các nơi khác trên thế giới. Mỗi kỳ Panegyra thường có những biến thể riêng, thường gắn liền với văn hóa của vùng đất nơi nó được tổ chức. Mọi ma cà rồng đều được chào đón tham gia, dù việc sử dụng $pod_discipline$ bị nghiêm cấm tuyệt đối, điều này có xu hướng san bằng sân chơi giữa các thí sinh đa dạng.\nDù hầu hết các thị tộc không thực sự quan tâm đến sự kiện này, nhiều người vẫn đến ít nhất là để xem hoặc dùng nó làm vỏ bọc cho một số toan tính chính trị với những Cainite đến từ những vùng đất xa xôi."
 brujah_panegyra_events.13.a: "Hãy để trò chơi bắt đầu!"
  
 panegyra_conclusion_general: "Panegyra đã đi đến hồi kết. Có kẻ đã giành được vinh quang, có kẻ đã nếm trải nỗi cay đắng của thất bại và những kẻ khác đã lợi dụng sự kiện để mưu tính và toan liệu cho tương lai. Các trọng tài đã đang nghĩ đến việc thay đổi luật lệ cho kỳ tiếp theo và các thí sinh đang nghĩ cách cải thiện chế độ luyện tập để làm tốt hơn nữa.\nNhìn chung, đây là một thành công cho thị tộc Brujah, nhắc nhở thế giới Cainite rằng họ vẫn trung thành với lý tưởng hoàn thiện tinh thần và thể chất của mình."
 
 panegyra_archery_tt: "Bắn cung ưu ái sự kiên nhẫn, những người thành thạo cung tên (và có một cây cung tốt cũng giúp ích) và các thí sinh có thể chất vượt trội nói chung."
 panegyra_kerykes_tt: "Kerykes ưu ái các nhà ngoại giao, thi sĩ và những thí sinh hòa đồng. Những nhân vật nhút nhát hoặc có tật về giọng nói có cơ hội chiến thắng thấp hơn."
 panegyra_wrestling_tt: "Đấu vật ưu ái mạnh mẽ sức mạnh thể chất và những nhân vật có thể hình cường tráng."
 panegyra_boxing_tt: "Đấm bốc ưu ái những nhân vật kiên nhẫn, tàn nhẫn và thành thạo đấu tay đôi (chẳng hạn như Kiếm Sư)."
 panegyra_board_game_tt: "Cờ bàn ưu ái những nhân vật uyên bác, kiên nhẫn và xảo trá."
 panegyra_horse_race_tt: "Đua ngựa ưu ái những kỵ sĩ tài giỏi, những nhân vật thiên về quản lý và siêng năng."
 
 brujah_panegyra_events.1001.t: "Công Cụ Của Nghề"
 brujah_panegyra_events.1001.desc: "Các thí sinh trong cuộc thi bắn cung được yêu cầu mang theo cung của riêng mình, điều này đã dẫn đến một cộng đồng nhỏ nhưng phát triển mạnh của những người làm cung định cư gần Panegyra. Nhiều ma cà rồng thường không dùng cung nên họ mua một cây từ các nghệ nhân trước cuộc thi. Ngay cả số ít Cainite mang theo vũ khí của riêng mình cũng có khả năng bị kiểm tra trước khi cuộc thi bắt đầu để đảm bảo nó ở tình trạng hoàn hảo."
 brujah_panegyra_events.1001.a: "Ta muốn cây cung tốt nhất trong nước!"
 brujah_panegyra_events.1001.b: "Cứ dán hai cành cây lại với nhau là được rồi."
 brujah_panegyra_events.1001.c: "Một cây cung bình thường là đủ."
 
 panegyra_overdrive_other_tt: "Thí sinh này sẽ có cơ hội chiến thắng cuộc thi hiện tại tăng lên."
 panegyra_underdrive_other_tt: "Thí sinh này sẽ có cơ hội chiến thắng cuộc thi hiện tại giảm xuống."
 
 brujah_panegyra_events.1002.t: "Bàn Tay Giúp Đỡ"
 brujah_panegyra_events.1002.desc: "Khi cuộc thi bắn cung đang diễn ra, một thí sinh khác đã để ý đến kết quả ban đầu tốt của ngươi và đến gặp ngươi để xin lời khuyên. Xã hội ma cà rồng vốn dĩ như vậy, họ chắc chắn không mong đợi điều đó miễn phí và thay vì trò chơi chính trị phức tạp thường thấy ở đồng loại của ngươi, họ đề nghị một khoản vàng nhỏ để thuê ngươi làm cố vấn trong suốt cuộc thi này."
 brujah_panegyra_events.1002.a: "Đầu tiên, hãy nói về gió..."
 brujah_panegyra_events.1002.b: "Ha! Không."
 brujah_panegyra_events.1002.c: "Chỉ đưa ra vài lời khuyên cơ bản rồi thôi."
  
 panegyra_disqualified_tt: "Ngươi bị loại khỏi cuộc thi này."
 panegyra_disqualified_other_contestant: "[other_contestant.GetShortUIName] bị loại khỏi cuộc thi này."
 
 brujah_panegyra_events.1003.t: "Một Chút Trợ Giúp"
 brujah_panegyra_events.1003.desc: "Ngay cả ma cà rồng trẻ nhất cũng có tiềm năng tạo nên những kỳ tích thể chất vĩ đại nếu dùng máu của mình. Do đó, sẽ dễ dàng đến mức nực cười nếu gian lận trong bất kỳ cuộc thi nào ưu ái những điều đó. Tuy nhiên, luật lệ của Panegyra rất rõ ràng, không được sử dụng bất kỳ loại năng lực máu nào trong suốt giải đấu. Các trọng tài Brujah được biết đến là cực kỳ tinh tường trong việc phát hiện bất kỳ hành vi gian lận nào như vậy.\nNgươi khá chắc chắn rằng một số (nếu không muốn nói là hầu hết) không bị bắt, vì vậy ngươi có thể thử. Nó có thể mang lại cho ngươi một lợi thế đáng kể trong cuộc thi hoặc khiến ngươi bị loại nếu bị bắt gặp."
 brujah_panegyra_events.1003.a: "Không phải gian lận nếu ta không bị bắt."
 brujah_panegyra_events.1003.b: "Cơ thể hoàn hảo của ta chính là toàn bộ sự gian lận ta cần."
 brujah_panegyra_events.1003.c: "Gian lận là dành cho kẻ thua cuộc."
 brujah_panegyra_events.1003.d: "Bị bắt gặp!"
 
 brujah_panegyra_events.1011.t: "Sự Chuẩn Bị Hoàn Hảo"
 brujah_panegyra_events.1011.desc: "Đối với một số người Brujah theo chủ nghĩa truyền thống, Kerykes là sự kiện quan trọng nhất của Panegyra. Họ dành nhiều năm để chuẩn bị bài diễn văn của mình, tìm kiếm những từ ngữ và ngữ điệu hoàn hảo cho màn trình diễn (có lẽ rất dài) của họ trong sự kiện.\nĐối với người ngoài, khá khó để chen chân vào cấp độ thi đấu này mà không có sự chuẩn bị kỹ lưỡng. Dù những bất ngờ vẫn từng xảy ra, nhiều khả năng là để ngăn các thí sinh quen thuộc nghĩ rằng họ cần phải diễn thuyết dài hơn nữa để chiến thắng."
 brujah_panegyra_events.1011.a: "Ta đã chuẩn bị mọi thứ hoàn hảo!"
 brujah_panegyra_events.1011.b: "Ta có thể học được một hai điều từ những nhà hùng biện như vậy."
 brujah_panegyra_events.1011.c: "Hãy chuẩn bị thôi."
  
 brujah_panegyra_events.1012.t: "Người Viết Thuê"
 brujah_panegyra_events.1012.desc: "Khi lang thang qua khu vực, ngươi để ý thấy một trong những thí sinh Kerykes đã để bài diễn văn của mình không có ai trông coi trong lúc đang trò chuyện với một vị khách khác không xa nơi đây. Một cảnh tượng như vậy khá hiếm gặp và, khi ngươi xác nhận rằng dường như không có ai gần đó, ngươi ngửi thấy một cơ hội.\nMọi thứ đều công bằng trong chiến tranh và trò chơi mà, phải không?"
 brujah_panegyra_events.1012.a: "Đốt nó đi! Vì nó thú vị."
 brujah_panegyra_events.1012.b: "Đánh cắp nó để cản trở màn trình diễn của họ."
 brujah_panegyra_events.1012.c: "Nghiên cứu nó để học hỏi từ họ."
 brujah_panegyra_events.1012.d: "Cứ trả lại một cách lịch sự."
 
 brujah_panegyra_events.1013.t: "Sẵn Sàng Diễn Thuyết"
 brujah_panegyra_events.1013.desc: "Sự kiện chính của Kerykes là khoảnh khắc ngươi trình bày bài diễn văn của mình trước các trọng tài và khán giả. Những người đến từ nền tảng truyền thống thường có một bài diễn văn rất dài, trầm ngâm, thường mang lại cho họ sự kính trọng từ đồng loại. Ngược lại, các thí sinh trẻ tuổi hơn có xu hướng ưa chuộng cách tiếp cận "đi thẳng vào vấn đề" hơn và bàn về những chủ đề hiện đại hơn, thậm chí còn dùng Kerykes như một nền tảng để trút giận về chính trị.\nCác nỗ lực gian lận không phải là hiếm gặp trong cuộc thi, vì các dị năng tâm trí có thể rất hữu ích để tác động đến ban giám khảo. Tuy nhiên, như thường lệ, các trọng tài Brujah đang theo dõi sát sao từ bên lề và sẵn sàng tuyên bố loại ngay lập tức nếu cần."
 brujah_panegyra_events.1013.a: "Chỉ một chút tác động tâm trí thôi..."
 brujah_panegyra_events.1013.b: "Ngươi sẽ cho ta vị trí đầu tiên!"
 brujah_panegyra_events.1013.c: "Cho điểm đầu tiên trong một trăm sáu mươi sáu điểm của ta..."
 brujah_panegyra_events.1013.d: "Cứ tiếp tục thôi."
  
 brujah_panegyra_events.1021.t: "Ánh Mắt Của Mãnh Hổ"
 brujah_panegyra_events.1021.desc: "Đấm bốc trong Panegyra gần như đã được nâng lên thành một môn nghệ thuật, chủ yếu vì một số người thực hành nó đã có hàng thế kỷ luyện tập để làm chủ nó. Nếu ngươi muốn thi đấu chống lại những đối thủ đáng gờm như vậy, ngươi sẽ cần một chế độ luyện tập nghiêm túc. May mắn thay, Panegyra có nhiều khả năng cho việc luyện tập như vậy dù kết quả luôn khó lường, cơ thể ma cà rồng không phản ứng gần giống như cơ thể người phàm đối với những bài tập như vậy."
 brujah_panegyra_events.1021.a: "Bắt đầu đoạn phim tập luyện!"
 brujah_panegyra_events.1021.b: "Ta đã hoàn hảo như ta có thể."
 
 brujah_panegyra_events.1022.t: "Bạn Tập"
 brujah_panegyra_events.1022.desc: "Các thí sinh đang chuẩn bị cho sự kiện đấm bốc và nhiều người đang tìm bạn tập để thực sự thử thách kỹ năng của mình. Một thí sinh như vậy đã đến gặp ngươi với lời cầu xin về sự hợp tác đó. Việc quyết định thuộc về ngươi, liệu ngươi sẽ dốc hết sức, có khả năng cho đối thủ này một lợi thế, hay âm thầm cố gắng làm suy yếu tiềm năng của họ."
 brujah_panegyra_events.1022.a: "Cứ làm việc của ngươi, ta sẽ chỉ đứng xem."
 brujah_panegyra_events.1022.b: "Nhanh hơn! Ngươi có thể làm tốt hơn thế!"

 brujah_panegyra_events.1023.t: "Bộc Phát"
 brujah_panegyra_events.1023.desc: "Đấm bốc là môn có nhiều trường hợp bị loại nhất trong Panegyra. Việc để hai ma cà rồng đấm nhau là công thức hoàn hảo cho cơn Cuồng Loạn dễ dàng và cuộc thi gần như là một trận đấu ý chí ngang bằng với một trận đấu thể chất. Rơi vào Cuồng Loạn là thua ngay lập tức nhưng kìm nén bản năng quá mức cũng có thể cản trở màn trình diễn tổng thể của ngươi. Cần đạt được một sự cân bằng tinh tế để chiến thắng."
 brujah_panegyra_events.1023.a: "Xả nó ra!"
 brujah_panegyra_events.1023.b: "Xả TẤT CẢ ra!"
 brujah_panegyra_events.1023.c: "Bình tĩnh và điềm đạm."
  
 brujah_panegyra_events.1031.t: "Trò Chơi Bắt Đầu"
 brujah_panegyra_events.1031.desc: "Rất nhiều loại cờ bàn khác nhau xuất hiện tại mỗi kỳ Panegyra dù hầu hết chỉ được dùng cho mục đích luyện tập hoặc giải trí chứ không phải thi đấu thực sự. Tuy vậy, nhiều ma cà rồng thấy những trò giải trí này đáng ngạc nhiên là gần giống với một số tình huống họ phải đối mặt đêm này qua đêm khác. Do đó, không hiếm khi nhiều khán giả đến tham gia cùng các thí sinh trong thời gian nghỉ, thử sức với các hoạt động khác nhau có mặt tại chỗ."
 brujah_panegyra_events.1031.a: "Có lẽ một trò đố vui?"
 brujah_panegyra_events.1031.b: "Trò chơi chiến tranh là tuyệt nhất!"
 brujah_panegyra_events.1031.c: "Hãy cứ tập trung vào cuộc thi phía trước."
  
 brujah_panegyra_events.1032.t: "Luật Lệ Kỳ Lạ"
 brujah_panegyra_events.1032.desc: "Thế giới người phàm đã sản sinh ra rất nhiều trò cờ bàn và rất nhiều bộ luật khác nhau cho mỗi trò. Có thể khó để theo dõi hết những điều đó, đặc biệt đối với ma cà rồng vốn thường được biết đến là bảo thủ với lối sống của mình. Một thí sinh như vậy đã đến gặp ngươi để xin giúp đỡ hiểu một trò chơi khá bí ẩn đến từ vùng đất của ngươi. Một cơ hội tốt để phô diễn kiến thức của ngươi... hoặc chỉ để chế giễu họ vì sự thất bại của họ."
 brujah_panegyra_events.1032.a: "Trẻ con còn biết chơi trò này!"
 brujah_panegyra_events.1032.b: "Vậy trong lượt đầu tiên..."
  
 brujah_panegyra_events.1033.t: "Những Nước Đi Của Jyhad"
 brujah_panegyra_events.1033.desc: "Một trong những đối thủ đầu tiên của ngươi trong cuộc thi cờ bàn rõ ràng xem trò chơi ngươi đang chơi như một hình ảnh đại diện cho Jyhad, Đại Trò Chơi chính trị và mưu mô do các Cainite chơi đùa. Đây hoàn toàn không phải là một thông lệ hiếm gặp, vì nhiều ma cà rồng xem người khác như những quân cờ trên bàn cờ và lên kế hoạch cho các nước đi của mình trước hàng thập kỷ. Tuy nhiên, điều này hiếm gặp hơn trong một cuộc thi thực sự, và đối thủ của ngươi có vẻ tập trung nhiều hơn vào việc thúc ép ngươi đưa ra những tuyên bố chính trị tinh tế nào đó qua ván cờ của ngươi thay vì thực sự chơi nó."
 brujah_panegyra_events.1033.a: "Cứ chơi trò chơi chết tiệt này đi."
 brujah_panegyra_events.1033.b: "Nếu quân cờ này đại diện cho vị Vương này, thì..."
    
 brujah_panegyra_events.1041.t: "Ngắm Hàng"
 brujah_panegyra_events.1041.desc: "Trước sự kiện chính, Panegyra đã mang lại một số giải trí với một màn trình diễn của người phàm và các đô vật Bộc huyết đấu với nhau. Dù họ chắc chắn thiếu kinh nghiệm và sức mạnh ma cà rồng thô sơ, họ sử dụng một số chiến thuật hiện đại hơn có thể hữu ích trong cuộc thi.\nĐây cũng là những mẫu người phàm khá tuyệt vời và ngươi để ý thấy vài ma cà rồng nhìn họ một cách thèm khát, có lẽ đang hy vọng vào chút máu ngọt ngào và mạnh mẽ của họ..."
 brujah_panegyra_events.1041.a: "Ngon lành làm sao!"
 brujah_panegyra_events.1041.b: "Ta muốn cái này thay vì thế."
 brujah_panegyra_events.1041.c: "Chỉ nghiên cứu trận đấu của họ thôi."
 
 brujah_panegyra_events.1042.t: "Trận Đấu Trình Diễn"
 brujah_panegyra_events.1042.desc: "Các trọng tài Panegyra thông báo với ngươi rằng ngươi đã được chọn cho một trận đấu trình diễn trước khi cuộc thi đấu vật chính thức bắt đầu. Đây là con dao hai lưỡi vì nếu ngươi dốc hết sức, ngươi có khả năng để lộ điểm yếu và điểm mạnh của mình cho các thí sinh khác. Nhưng nếu không, ngươi có khả năng thua, điều luôn là một chuyện nhục nhã trước quá nhiều khán giả."
 brujah_panegyra_events.1042.a: "Thua để giấu chiến thuật của ngươi."
 brujah_panegyra_events.1042.b: "Thắng vì vinh quang!"
  
 brujah_panegyra_events.1043.t: "Trận Đấu Dàn Xếp"
 brujah_panegyra_events.1043.desc: "Ngươi đã được một nô bộc của một thí sinh khác giấu tên tiếp cận trước khi cuộc thi đấu vật bắt đầu. Xác định ngươi là một mối đe dọa tiềm tàng cho chiến thắng của họ, họ đề nghị cho ngươi một ít vàng để chỉ cần cố tình thua một trong những trận đấu sớm của ngươi, loại ngươi khỏi tư cách thí sinh cho các vòng sau. Các trọng tài Panegyra nổi tiếng là rất tinh tường trong việc nhận ra việc sử dụng năng lực ma cà rồng... nhưng cũng nổi tiếng là ngây thơ khi cho rằng việc gian lận và dàn xếp kiểu cũ cũng có thể xảy ra, vì vậy rất khó có khả năng ngươi sẽ bị bắt gặp."
 brujah_panegyra_events.1043.a: "Vàng hữu ích hơn vinh quang."
 brujah_panegyra_events.1043.b: "...nhưng vinh quang là vĩnh cửu!"
   
 brujah_panegyra_events.1051.t: "Cỗ Xe Vàng"
 brujah_panegyra_events.1051.desc: "Ban tổ chức của kỳ Panegyra này đã quyết định rằng lần này sẽ là một cuộc đua xe ngựa, một truyền thống rất cổ xưa bắt nguồn từ Thế Vận Hội của người phàm. Đáng buồn thay, xe ngựa gần như đã bị người phàm của thời đại tăm tối này lãng quên hoàn toàn và việc có được trong tay một chiếc đủ ấn tượng và hiệu quả sẽ không phải là việc rẻ tiền.\nCác nghệ nhân (thường là các bộc huyết xuất thân từ một dòng dõi lâu đời của những người làm xe ngựa được ma cà rồng nuôi dưỡng) đang ở ngoại ô Panegyra, sẵn sàng cung cấp tay nghề của họ để ngươi sử dụng. Lựa chọn của ngươi sẽ là gì?"
 brujah_panegyra_events.1051.a: "Cái rẻ tiền này là quá đủ rồi!"
 brujah_panegyra_events.1051.b: "Một chiếc chắc chắn và vững chãi."
 brujah_panegyra_events.1051.c: "Chỉ những cỗ xe vàng thời xưa mới xứng đáng!"

 brujah_panegyra_events.1052.t: "Đấu Thương Đêm"
 brujah_panegyra_events.1052.desc: "Đấu thương từng là một thú vui phổ biến của giới quý tộc phàm nhân trong một thời gian nhưng khá chậm chạp để bắt kịp với tư duy bảo thủ hơn nhiều của ma cà rồng. Tuy nhiên, một thế hệ Cainite trẻ hơn được sinh ra trong thời đại này và đôi khi thậm chí còn là quý tộc từng tự mình luyện tập đấu thương. Do đó, nó đã đạt được đủ sự chú ý để đôi khi được đưa vào làm một cuộc thi của Panegyra.\nĐây là một môn nguy hiểm vì đấu thương đòi hỏi không được chùn bước, biết rõ rằng đối thủ có thể âm thầm cố gắng dùng sức mạnh của máu để giết chết ngươi ngay khi ngọn thương của hai bên va chạm."
 brujah_panegyra_events.1052.a: "Sợ hãi không nằm trong từ vựng của ta."
 brujah_panegyra_events.1052.b: "Hãy lùi lại một bước trước khi va chạm..."
 
 brujah_panegyra_events.1053.t: "Dòng Máu Hữu Ích"
 brujah_panegyra_events.1053.desc: "Ban tổ chức Panegyra đã quyết định rằng, lần này, ngựa Bộc huyết không được phép tham gia cuộc thi đua ngựa. Sẽ có các cuộc kiểm tra như thường lệ để đảm bảo không ai cố gắng gian lận.\nTuy nhiên, điều này mang lại cho ngươi một cơ hội khi ngươi để ý thấy một chuồng ngựa không có người canh giữ trên đường đến chuồng của chính mình. Với một chút hối lộ cho người chăn ngựa và một ít máu của chính ngươi, ngươi có thể biến một trong những con ngựa của các thí sinh khác thành Bộc huyết, từ đó đảm bảo họ bị loại trong quá trình đó."
 brujah_panegyra_events.1053.a: "Mưu mô nhỏ nhặt là mưu mô tốt nhất."
 brujah_panegyra_events.1053.b: "...vẫn còn quá nhỏ nhặt."
 
