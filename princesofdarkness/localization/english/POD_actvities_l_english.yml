 activity_brujah_panegyra: "Đại Hội Panegyra của Brujah"
 activity_brujah_panegyra_desc: "Một truyền thống được tạo ra bởi các Brujah gốc Hy Lạp, Panegyra là phiên bản ma cà rồng của Thế Vận Hội Olympic, được thiết kế riêng cho những điểm mạnh và điểm yếu độc đáo của con cái Caine."
 activity_brujah_panegyra_host_desc: "$BULLET_WITH_TAB$[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$[stress_loss_i][stress|E] Giảm\n$BULLET_WITH_TAB$[GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E]"
 activity_brujah_panegyra_selection_tooltip: "Mời $knight_culture_player_plural$, chư hầu, và các lân bang của ngươi đến một cuộc tranh tài tráng lệ\n\nPhần Thưởng Dự Kiến:\n$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$[stress_loss_i] [stress|E] Giảm"
