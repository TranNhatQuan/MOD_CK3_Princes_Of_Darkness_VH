l_english:
 vampire_elective_succession_law: "Kẻ Quyền Lực Nhất"
 vampire_elective_succession_law_effects: "Khi có sự thay đổi quyền lãnh đạo trong xã hội Kindred, thường thì ứng viên quyền lực nhất, hoặc có nhiều quan hệ nhất, sẽ giành được phần thưởng. [ruler|E] và mọi [vassals|E] [de_jure|E] trực tiếp thấp hơn [title|E] một hoặc hai [ranks|E] có thể đề cử một [heir|E] trong số chính họ và [close_family|E] của người cai trị."
 vampire_elective_candidates: "Gia đình Ruột thịt, Người Tuyên Nhận và Cử Tri"
 vampire_elective_candidates_tooltip: "Để trở thành một Ứng viên đủ quyền lực, một nhân vật phải đáp ứng một trong các điều kiện sau:\n$EFFECT_LIST_BULLET$Là thành viên hợp pháp thuộc [close_family|E] của người cai trị hiện tại.\n$EFFECT_LIST_BULLET$Là một [claimant|E] của tước vị.\n$EFFECT_LIST_BULLET$Là một [elector|E] Phong kiến hợp lệ của tước vị"
 vampire_elective_electors: "Người Cai Trị và Chư Hầu"
 vampire_elective_electors_tooltip: "Để trở thành một [elector|E] hợp lệ trong xã hội Kindred, một chư hầu phải đáp ứng tất cả các điều kiện sau:\n$EFFECT_LIST_BULLET$Là chư hầu [de_jure|E] của tước vị\n$EFFECT_LIST_BULLET$Là chư hầu trực tiếp của tước vị\n$EFFECT_LIST_BULLET$Chỉ thấp hơn tước vị một hoặc hai [ranks|E]"
 tooltip_vampire_vote_strength_diplomacy: "Ngoại giao Cao"
 tooltip_vampire_vote_strength_intrigue: "Mưu mô Cao"
 tooltip_vampire_elector_vote_decrepit: "Lão già này đã già lắm rồi. Rất già. Tốt hơn hết là nên lấy lòng ông ta."

 overextension_law: "Dàn Trải Quá Mức"
 overextension_0: "Không Dàn Trải Quá Mức"
 overextension_0_effects_not_in_prev: "#R Đây là trạng thái mặc định và sẽ duy trì như vậy chừng nào quy mô vương quốc của ngươi không vượt quá 50.#!"
 overextension_1: "Dàn Trải Quá Mức Đang Tăng"
 overextension_1_effects: "#R Cấp độ này sẽ xảy ra nếu vương quốc của ngươi trên 50 quy mô vương quốc nhưng dưới 100.#!\n$EFFECT_LIST_BULLET$Ngươi mở khóa vị trí triều đình [GetCourtPositionType('imperial_envoy_court_position').GetName()] có thể giúp ngươi giảm bớt căng thẳng."
 overextension_2: "Dàn Trải Quá Mức Nghiêm Trọng"
 overextension_2_effects: "#R Cấp độ này sẽ xảy ra nếu vương quốc của ngươi trên 100 quy mô vương quốc nhưng dưới 150.#!\n$EFFECT_LIST_BULLET$Ngươi mở khóa vị trí triều đình [GetCourtPositionType('imperial_chancellor_court_position').GetName()] có thể giúp ngươi giảm bớt căng thẳng."
 overextension_3: "Dàn Trải Quá Mức Làm Suy Kiệt"
 overextension_3_effects: "#R Cấp độ này sẽ xảy ra nếu vương quốc của ngươi trên 150 quy mô vương quốc.#!\n$EFFECT_LIST_BULLET$Ngươi mở khóa vị trí triều đình [GetCourtPositionType('imperial_minister_court_position').GetName()] có thể giúp ngươi giảm bớt căng thẳng."
 always_no_tt: "Điều này không thể thay đổi thủ công."
 
 