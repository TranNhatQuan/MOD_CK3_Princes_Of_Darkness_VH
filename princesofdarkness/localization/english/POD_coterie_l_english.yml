 POD_coteriename_gabriella: "#TOOLTIP:POD_coteriename_gabriella_tt #L Principled Latins#!#!"
 POD_coteriename_anadja: "#TOOLTIP:POD_coteriename_anadja_tt #L Heirs of Enoch#!#!"
 POD_coteriename_suleiman: "#TOOLTIP:POD_coteriename_suleiman_tt #L The First Ashirra#!#!"
 POD_coteriename_erinyes: "#TOOLTIP:POD_coteriename_erinyes_tt #L The Erinyes#!#!"
 POD_coteriename_carnival: "#TOOLTIP:POD_coteriename_carnival_tt #L Carnival Moriendi#!#!"
 POD_coteriename_fratres: "#TOOLTIP:POD_coteriename_fratres_tt #L Fratres Plaga#!#!"
 POD_coteriename_red_thor: "#TOOLTIP:POD_coteriename_red_thor_tt #L Crew of the Red Thor#!#!"
 POD_coteriename_horus: "#TOOLTIP:POD_coteriename_horus_tt #L Khopesh of the Avenger#!#!"
 POD_coteriename_leopold: "#TOOLTIP:POD_coteriename_leopold_tt #L Gladius Dei#!#!"
 POD_coteriename_field: "#TOOLTIP:POD_coteriename_field_tt #L Field of Stars#!#!"
 POD_coteriename_crescent: "#TOOLTIP:POD_coteriename_crescent_tt #L Crescent Moon#!#!"
 POD_coteriename_bright: "#TOOLTIP:POD_coteriename_bright_tt #L Bright Promise#!#!"
 POD_coteriename_sun_glory: "#TOOLTIP:POD_coteriename_sun_glory_tt #L Helios' Fury#!#!"
 POD_coteriename_ishbara: "#TOOLTIP:POD_coteriename_ishbara_tt #L Keepers of the Töre#!#!"
 POD_coteriename_yidu: "#TOOLTIP:POD_coteriename_yidu_tt #L The West Wind#!#!"

 POD_coteriename_camilla_tt: "Tanitbaal-Sahar đã chỉ cho họ con đường. Ngay cả sự sụp đổ của một Đế chế cũng không thể lay chuyển niềm tin của họ."
 POD_coteriename_mithras_tt: "Những nhà vô địch được đích thân một vị Thần tuyển chọn, được tin cậy và có lẽ còn được san sẻ cả bí mật của Người."
 POD_coteriename_alencourt_tt: "Sợi dây gia tộc có thể chịu đựng mọi thứ, kể cả cái chết."
 POD_coteriename_eon_tt: "Đức tin có thể chờ đợi đôi chút, nhưng châu báu và danh tiếng thì không."
 POD_coteriename_sophoniba_tt: "Trong khi Carthage biến mất, Tunis vẫn hưng thịnh dưới con mắt canh chừng của những kẻ bảo hộ nó."
 POD_coteriename_augustus_tt: "Tay phải và tay trái của Đấng Thượng Phụ, vươn tới những bí mật mà Người khao khát."
 POD_coteriename_hardestadt_tt: "Gắn kết bởi một mục đích chung, tìm cách tái tạo thế giới Cainite theo hình ảnh của riêng họ."
 POD_coteriename_julia_tt: "Khởi đầu của một lý tưởng, gắn kết bởi sức hút của một thánh vật."
 POD_coteriename_jurgen_tt: "Thanh gươm của Hardestadt, thường tìm cách thoát khỏi xiềng xích của chính mình."
 POD_coteriename_silent_fury_tt: "Từ đám ô hợp thành quân nổi loạn, quất roi vào một thế giới thờ ơ."
 POD_coteriename_nordic_ventrue_tt: "Những người đàn ông và phụ nữ "văn minh" đang tẩy trừ phương Bắc khỏi các vị Thần Cũ."
 POD_coteriename_bar_sinister_tt: "Gắn kết bởi lòng tham và sự nhỏ nhen, không có kẻ thù nào tệ hơn chính bản thân họ."
 POD_coteriename_ferals_livonia_tt: "Một trận chiến cuối cùng anh dũng hay một cuộc hồi sinh khó ngờ?"
 POD_coteriename_redemption_tt: "Christoff đã đoàn kết họ và ngay cả khi vắng mặt cũng không thể chia rẽ họ."
 POD_coteriename_andreas_tt: "Một đoàn lữ hành gồm những kẻ lưu vong và lạc loài, đoàn kết dưới ánh mắt nhân từ của Set."
 POD_coteriename_gabriella_tt: "Trong khi Constantinople bốc cháy, vài người Latin cố dập tắt ngọn lửa."
 POD_coteriename_anadja_tt: "Được nuôi dưỡng để thành công, mong chờ một ngai vàng dối trá và ác độc."
 POD_coteriename_suleiman_tt: "Người đầu tiên nghe được lời Người và thực sự thấu hiểu."
 POD_coteriename_erinyes_tt: "Những nữ thần báo oán thời xưa, ngang nhiên thách thức kẻ thù ngăn cản họ."
 POD_coteriename_carnival_tt: "Tất cả đều được chào đón bước vào. Ít ai được chào đón rời đi."
 POD_coteriename_fratres_tt: "Đoàn kết trong việc nghiên cứu những nỗi kinh hoàng của cái chết và bệnh tật, gieo rắc nó bất cứ nơi nào họ đến."
 POD_coteriename_red_thor_tt: "Khi con thuyền dài đáng sợ vẫn còn giong buồm, Thời đại Viking sẽ không bao giờ thực sự kết thúc."
 POD_coteriename_horus_tt: "Những nhà vô địch của Đấng Báo Thù, săn lùng và tiêu diệt lũ rắn bất cứ nơi nào chúng trú ngụ."
 POD_coteriename_leopold_tt: "Những người đàn ông và phụ nữ có mục đích được Chúa ban phước để trở thành nhà vô địch của Người. Hoặc có lẽ là những vị tử đạo của Người."
 POD_coteriename_field_tt: "Những Garou trẻ tuổi táo bạo và liều lĩnh, đôi khi bị lòng nhiệt thành làm mờ mắt."
 POD_coteriename_crescent_tt: "Những anh hùng của một Quốc gia, định mệnh không bao giờ thực sự chết."
 POD_coteriename_bright_tt: "Gần như tan vỡ, Lời Hứa vẫn tồn tại bất chấp chính nó."
 POD_coteriename_sun_glory_tt: "Bầy danh giá nhất Tây Âu, đang vật lộn đối mặt với sự ra đi của một thủ lĩnh được yêu mến."
 POD_coteriename_ishbara_tt: "Kẻ già đời nhất trong số Erk, tận tụy gìn giữ trật tự trong lãnh địa của họ và bảo vệ chúng."
 POD_coteriename_yidu_tt: "Quyết tâm đánh vào lũ Kuei-Jin đáng ghét ở phương Đông, họ sẽ không nghỉ tay cho đến khi thành công hoặc chết."
 
 POD_coteriename_brugge_triumvirate: "#TOOLTIP:POD_coteriename_brugge_triumvirate_tt #L Những Nhà Nhân Văn của Bruges#!#!"
 POD_coteriename_brugge_triumvirate_tt: "Noi theo tấm gương kiêu hãnh của người thầy Antasian, các quý cô của Bruges đấu tranh cho tự do của dân mình."
 POD_coteriename_muses: "#TOOLTIP:POD_coteriename_muses_tt #L Những Nàng Thơ của Constantinople#!#!"
 POD_coteriename_muses_tt: "Họ từng yêu hắn và bước theo dấu chân hắn. Giờ đây họ gìn giữ ký ức về hắn."
 POD_coteriename_rosae_crucis: "#TOOLTIP:POD_coteriename_rosae_crucis_tt #L Rosae Crucis#!#!"
 POD_coteriename_rosae_crucis_tt: "Những "Hoàng tử Ngoan đạo" là những người thầy được săn đón và những kẻ thù đáng sợ, coi trọng sự độc lập của mình chẳng kém gì đức tin."
 POD_coteriename_daughters_sun: "#TOOLTIP:POD_coteriename_daughters_sun_tt #L Những Người Con Gái của Mặt Trời#!#!"
 POD_coteriename_daughters_sun_tt: "Đoàn kết trong cơn điên loạn của mẹ mình, họ chờ đợi và chuẩn bị cho sự trở lại vinh quang tất yếu của bà."
 POD_coteriename_leper_knights: "#TOOLTIP:POD_coteriename_leper_knights_tt #L Những Kỵ Sĩ Phong Cùi#!#!"
 POD_coteriename_leper_knights_tt: "Những kẻ tùy tùng đáng tin của Malachite đã mất mát rất nhiều kể từ năm 1204. Dù vậy, thủ lĩnh của họ vẫn còn đó để dẫn dắt và Nosferatu chẳng phải là gì nếu không kiên cường."
 POD_coteriename_ashirra_trader: "#TOOLTIP:POD_coteriename_ashirra_trader_tt #L Tấm Màn Đêm#!#!"
 POD_coteriename_ashirra_trader_tt: "Abu Fahim Kateb du hành khắp lãnh thổ Ashirra để buôn bán thánh vật và tin tức mà hắn gửi về Alamut và nhiều chủ nhân của hắn."
 POD_coteriename_frankokratia: "#TOOLTIP:POD_coteriename_frankokratia_tt #L Frankokratia#!#!"
 POD_coteriename_frankokratia_tt: "Với Constantinople đã quỳ gối, chỉ cần một chiếc vòng cổ là đủ để thuần hóa nó mãi mãi. Alfonzo rất vui lòng cung cấp."
 POD_coteriename_kerberos: "#TOOLTIP:POD_coteriename_kerberos_tt #L Coterie Kerberos#!#!"
 POD_coteriename_kerberos_tt: "Những đứa con đầu tiên của quỷ Ennamaru đang lên kế hoạch mở rộng quyền lực của hắn bằng cách gia tăng số lượng dòng máu của mình."
 POD_coteriename_bayonne_triumvirate: "#TOOLTIP:POD_coteriename_bayonne_triumvirate_tt #L Tam Đầu Chế Bayonne#!#!"
 POD_coteriename_bayonne_triumvirate_tt: "Hậu quả từ hành động của họ đang nhanh chóng ập đến với các thủ lĩnh của Bayonne."
 POD_coteriename_sower: "#TOOLTIP:POD_coteriename_sower_tt #L Kẻ Gieo Trồng của Người Mẹ Bóng Tối#!#!"
 POD_coteriename_sower_tt: "Như Người Mẹ Bóng Tối đã từng làm, họ tạo ra quái vật để bảo vệ khu vườn của mình."
 POD_coteriename_house_goratrix: "#TOOLTIP:POD_coteriename_house_goratrix_tt #L Nhà Goratrix#!#!"
 POD_coteriename_house_goratrix_tt: "Phe đối lập đoàn kết chống lại Etrius và những kẻ ủng hộ hắn. Sẵn sàng thỏa hiệp với ác quỷ để giành lấy quyền lực đứng đầu Clan Tremere."
 POD_coteriename_nemausus: "#TOOLTIP:POD_coteriename_nemausus_tt #L Consilio Civitatis Nemausus#!#!"
 POD_coteriename_nemausus_tt: "Thành cổ của Augustus đã bị hủy diệt nhiều lần nhưng vẫn còn thịnh vượng. Điều này đã thu hút sự chú ý không mong muốn đối với các Cainite của thành phố."
 POD_coteriename_iskender: "#TOOLTIP:POD_coteriename_iskender_tt #L Đám Cướp của Iskender#!#!"
 POD_coteriename_iskender_tt: "Bất chấp cái chết của thủ lĩnh, các bạn đồng hành của Iskender cố gắng tôn vinh ký ức và mục đích sống của hắn."
 POD_coteriename_alexander: "#TOOLTIP:POD_coteriename_alexander_tt #L Tùy Tùng của Kẻ Lưu Vong#!#!"
 POD_coteriename_alexander_tt: "Một vị Vua lưu vong vẫn là Vua và càng cần người làm việc bẩn thay mình hơn bao giờ hết."
 POD_coteriename_rosamund: "#TOOLTIP:POD_coteriename_rosamund_tt #L Cánh Hoa Hồng#!#!"
 POD_coteriename_rosamund_tt: "Đóa hoa đẹp nhất nước Pháp có một đoàn tùy tùng nhỏ nhưng tận tụy, đảm bảo nàng không bị hái trước thời của mình."
 POD_coteriename_bezariel: "#TOOLTIP:POD_coteriename_bezariel_tt #L Âm Mưu Đẫm Máu#!#!"
 POD_coteriename_bezariel_tt: "Bezariel là một bậc thầy thao túng. Là con quỷ quyền lực nhất nước Nga, hắn ban "sự bảo hộ" của mình cho các đồng loại vẫn còn choáng váng sau thời gian bị giam trong Ngục Tù Vực Thẳm."
 POD_coteriename_flaying_monkeys: "#TOOLTIP:POD_coteriename_flaying_monkeys_tt #L Bầy Khỉ Lột Da#!#!"
 POD_coteriename_flaying_monkeys_tt: "Wu bất cân bằng của Piyau Payung [Glossary('Wu','podgloss.wu')] là một cái tát vào mặt phái Wan Kuei truyền thống Trung Hoa. Nhưng nó còn nguy hiểm hơn nhiều đối với [akuma|E] mà cô ta săn đuổi với hiệu quả vô cùng ấn tượng."
 POD_coteriename_shiva_lingham: "#TOOLTIP:POD_coteriename_shiva_lingham_tt #L Shiva Lingham#!#!"
 POD_coteriename_shiva_lingham_tt: "Ba học giả của màn đêm, tận tụy dạy dỗ và tiếp thu trí tuệ."
 POD_coteriename_jervais: "#TOOLTIP:POD_coteriename_jervais_tt #L Đám Vật Tế của Jervais#!#!"
 POD_coteriename_jervais_tt: "Ceoris sẽ nhận hết công lao nếu họ thắng và Ceoris chắc chắn sẽ không rơi lệ nếu họ thua."
 POD_coteriename_delta: "#TOOLTIP:POD_coteriename_delta_tt #L Nhóm Lạc Lối Xa Xôi#!#!"
 POD_coteriename_delta_tt: "Lạc lối giữa thảo nguyên bất tận, ngọn gió sau lưng đẩy họ về phía một tương lai bất định."
 POD_coteriename_black_winds: "#TOOLTIP:POD_coteriename_black_winds_tt #L Những Cơn Gió Đen#!#!"
 POD_coteriename_black_winds_tt: "Những nữ thợ săn của thảo nguyên, nhắm tới con mồi lớn hơn nhiều so với những kẻ phàm trần đồng loại."
 POD_coteriename_golden_jade_wu: "#TOOLTIP:POD_coteriename_golden_jade_wu_tt #L Hội Ngọc Bích Vàng #!#!"
 POD_coteriename_golden_jade_wu_tt: "Khi ngươi đã có trái tim của thế giới, ngươi còn muốn gì hơn ngoài người cai trị nó?"
 POD_coteriename_horns_ice_wu: "#TOOLTIP:POD_coteriename_horns_ice_wu_tt #L Sừng Băng#!#!"
 POD_coteriename_horns_ice_wu_tt: "Từng là trụ cột của Triều Đình Bạch Hổ, Sừng Băng phải tự tái tạo mình sau cuộc lưu đày tự nguyện của người sáng lập."
 POD_coteriename_demons_zhongdu_wu: "#TOOLTIP:POD_coteriename_demons_zhongdu_wu_tt #L Ác Quỷ Trung Đô#!#!"
 POD_coteriename_demons_zhongdu_wu_tt: "Trong lửa họ bị đày xuống địa ngục, và trong xiềng xích sắt họ được tôi luyện lại."
 POD_coteriename_entwined_serpents: "#TOOLTIP:POD_coteriename_entwined_serpents_tt #L Rắn Quấn Quyện#!#!"
 POD_coteriename_entwined_serpents_tt: "Bởi tham vọng của một con rắn nhợt nhạt, những kẻ bị thế gian ruồng bỏ khao khát thấy nó quỳ gối."
 POD_coteriename_amber_wren: "#TOOLTIP:POD_coteriename_amber_wren_tt #L Hổ Tước Hổ Phách#!#!"
 POD_coteriename_amber_wren_tt: "Một đế chế sống nhờ lời nói và đôi tai của nó. Và tại Triều Đình Hoàng Đế Vàng, tin tức mang theo mình sắc hổ phách."
 POD_coteriename_illustrious_scribes: "#TOOLTIP:POD_coteriename_illustrious_scribes_tt #L Những Người Chép Sử Lừng Danh#!#!"
 POD_coteriename_illustrious_scribes_tt: "Những văn bản quý giá và thiêng liêng của Wan Kuei không tự viết ra mình. Và ở khắp mọi phương, ngòi bút vẫn tuôn chảy."
 POD_coteriename_bronze_pennant: "#TOOLTIP:POD_coteriename_bronze_pennant_tt #L Cờ Hiệu Đồng#!#!"
 POD_coteriename_bronze_pennant_tt: "Trong thời buổi khó khăn, không thiếu những kẻ đáng nguyền rủa và độc ác, cùng những chính nghĩa để chống lại chúng."
 POD_coteriename_warriors_hebei: "#TOOLTIP:POD_coteriename_warriors_hebei_tt #L Chiến Binh Hà Bắc#!#!"
 POD_coteriename_warriors_hebei_tt: "Từ phương Bắc đến, những Ác Quỷ quyết tâm đập tan lũ khốn kiếp của trần gian."
 POD_coteriename_fivefold_way: "#TOOLTIP:POD_coteriename_fivefold_way_tt #L Bậc Hiền Triết của Ngũ Đạo#!#!"
 POD_coteriename_fivefold_way_tt: "Từ Tu Viện Thiếu Lâm ẩn giấu, các Hiền Triết vô song chiêm nghiệm những chân lý ẩn giấu trong giáo lý của Xue."
 POD_coteriename_emerald_bier: "#TOOLTIP:POD_coteriename_emerald_bier_tt #L Quan Tài Lục Bảo#!#!"
 POD_coteriename_emerald_bier_tt: "Con đường xuống địa ngục được cho là lát bằng những ý định tốt đẹp. Nhưng nói đúng hơn thì nó được lát bằng dục vọng."
 POD_coteriename_blissful_ice_daggers: "#TOOLTIP:POD_coteriename_blissful_ice_daggers_tt #L Dao Băng Hạnh Phúc#!#!"
 POD_coteriename_blissful_ice_daggers_tt: "Các Hoạn Quan nhà Tống có một nhóm bậc thầy ẩn giấu, tất cả đều từng là Hoạn Quan."
 POD_coteriename_silver_locks: "#TOOLTIP:POD_coteriename_silver_locks_tt #L Ổ Khóa Bạc#!#!"
 POD_coteriename_silver_locks_tt: "Cấp vốn cho một đế chế không phải là việc dễ dàng. Ổ Khóa Bạc không đòi hỏi gì kém hơn sự hoàn hảo."
 POD_coteriename_eternal_ice: "#TOOLTIP:POD_coteriename_eternal_ice_tt #L Băng Vĩnh Cửu#!#!"
 POD_coteriename_eternal_ice_tt: "Những kẻ trung gian và nhà ngoại giao được kính trọng, tất cả đều xuất thân từ những hoàn cảnh khốn cùng nhất. Xue từng nói ánh sáng Thiên Đàng có thể chiếu tới tất cả, và Băng Vĩnh Cửu tìm cách chứng minh điều đó."
 POD_coteriename_sovereign_virtue: "#TOOLTIP:POD_coteriename_sovereign_virtue_tt #L Các Chúa Tể của Đức Hạnh#!#!"
 POD_coteriename_sovereign_virtue_tt: "Máu đặc hơn nước, nhưng không đặc bằng máu của giao ước. Sao không làm cả hai cùng lúc?"
 POD_coteriename_silver_blade_horsemen: "#TOOLTIP:POD_coteriename_silver_blade_horsemen_tt #L Kỵ Sĩ Lưỡi Bạc#!#!"
 POD_coteriename_silver_blade_horsemen_tt: "Vị lãnh chúa được cứu chuộc dẫn quân đội mình vào trận chiến cuối cùng, hy vọng cuối cùng cũng phá vỡ được Xiềng Gai."
 POD_coteriename_golden_shroud: "#TOOLTIP:POD_coteriename_golden_shroud_tt #L Khăn Liệm Vàng#!#!"
 POD_coteriename_golden_shroud_tt: "Những bậc mẫu mực của Triều Đình Phượng Hoàng Đỏ che giấu một mối quan hệ mâu thuẫn và xung khắc đằng sau vẻ ngoài anh hùng của họ."
 POD_coteriename_leaping_gibbons: "#TOOLTIP:POD_coteriename_leaping_gibbons_tt #L Vượn Nhảy#!#!"
 POD_coteriename_leaping_gibbons_tt: "Sự táo bạo và năng lực dư dả... tất cả những gì còn lại là hỏi xem họ sẽ trèo cao đến đâu... và sẽ ngã sâu đến đâu."
 POD_coteriename_eastern_vanguard: "#TOOLTIP:POD_coteriename_eastern_vanguard_tt #L Tiền Phong Phương Đông#!#!"
 POD_coteriename_eastern_vanguard_tt: "Quân Mông Cổ đang theo dõi, dò xét Vạn Lý Trường Thành để tìm bất kỳ dấu hiệu suy yếu nào."
 POD_coteriename_bright_forest: "#TOOLTIP:POD_coteriename_bright_forest_tt #L Khu Rừng Sáng#!#!"
 POD_coteriename_bright_forest_tt: "Họ đã cùng nhau xây dựng một Đế chế. Họ cũng có thể cùng nhau phá hủy nó."
 POD_coteriename_regretful_hunters: "#TOOLTIP:POD_coteriename_regretful_hunters_tt #L Thợ Săn Hối Hận#!#!"
 POD_coteriename_regretful_hunters_tt: "Nhiều cây cầu đã bị thiêu rụi trong sự ra đời của Triều Đình Huyền Vũ. Giờ đây họ sống với hậu quả và tìm kiếm sự chuộc lỗi dưới ánh mắt canh chừng của các trọng tài Thiên Đàng."
 POD_coteriename_riders_ashen: "#TOOLTIP:POD_coteriename_riders_ashen_tt #L Kỵ Sĩ của Đồng Bằng Tro Tàn#!#!"
 POD_coteriename_riders_ashen_tt: "Thế giới nằm đổ nát sau Thời Đại Huyền Thoại. Nhưng khi ai đó cho rằng mình thừa hưởng một thế giới đã hư hỏng từ căn bản, điều đó đầu độc mọi nỗ lực khôi phục của họ."
 POD_coteriename_blackest_night: "#TOOLTIP:POD_coteriename_blackest_night_tt #L Đêm Đen Tối Nhất#!#!"
 POD_coteriename_blackest_night_tt: "Đừng sợ những gì bảo vệ ngươi trong bóng tối"
 POD_coteriename_inoue_clan: "#TOOLTIP:POD_coteriename_inoue_clan_tt #L Lưỡi Kiếm của Inoue#!#!"
 POD_coteriename_inoue_clan_tt: "Đâu mới là lưỡi kiếm, Garou hay Thanh Gươm?"
 POD_coteriename_outriders_spiked: "#TOOLTIP:POD_coteriename_outriders_spiked_tt #L Kỵ Binh Tiên Phong của Xiềng Gai#!#!"
 POD_coteriename_outriders_spiked_tt: "Đôi khi, Địa Ngục không thể chờ ngươi được. Đám Kỵ Binh Tiên Phong đảm bảo đẩy nhanh tiến trình đó."
 POD_coteriename_riders_ashen_plain: "#TOOLTIP:POD_coteriename_riders_ashen_plain_tt #L Kỵ Sĩ của Đồng Bằng Tro Tàn#!#!"
 POD_coteriename_riders_ashen_plain_tt: "Họ từng phi nhanh hơn bất kỳ ai khác. Nhưng giờ đây, họ khó lòng chạy thoát khỏi định mệnh của chính mình."
 POD_coteriename_sons_tengri: "#TOOLTIP:POD_coteriename_sons_tengri_tt #L Con Trai của Tengri#!#!"
 POD_coteriename_sons_tengri_tt: "Trụ cột của thảo nguyên vẫn đứng vững. Nhưng tuổi tác của nó có thể là sự sụp đổ của chính nó."
 POD_coteriename_barren_winds: "#TOOLTIP:POD_coteriename_barren_winds_tt #L Những Cơn Gió Cằn Cỗi#!#!"
 POD_coteriename_barren_winds_tt: "Một mối thù truyền kiếp khiến họ mù quáng trước mối đe dọa sau lưng mình. Những cơn gió có thể sớm trở nên thực sự cằn cỗi."
 POD_coteriename_storm_fire: "#TOOLTIP:POD_coteriename_storm_fire_tt #L Bão Lửa#!#!"
 POD_coteriename_storm_fire_tt: "Liệu ngọn lửa có thể thực sự bén trên thảo nguyên cằn cỗi?"
 POD_coteriename_black_hoof_riders: "#TOOLTIP:POD_coteriename_black_hoof_riders_tt #L Kỵ Sĩ Móng Đen#!#!"
 POD_coteriename_black_hoof_riders_tt: "Kỵ sĩ thực sự thống trị thảo nguyên. Nhưng liệu Móng Đen có sống sót qua tay Con Cái của Dobrul không?"
 POD_coteriename_silent_glade: "#TOOLTIP:POD_coteriename_silent_glade_tt #L Khoảng Rừng Thưa Im Lặng#!#!"
 POD_coteriename_silent_glade_tt: "Những sủng thiếp quý giá của Dokhor-Khan, được chọn từ những miền xa xôi nhất mà Thảo Nguyên đã chinh phục, đã tự giải phóng bản thân, và trên hết muốn báo thù."
 POD_coteriename_harbingers_eternal_wind: "#TOOLTIP:POD_coteriename_harbingers_eternal_wind_tt #L Sứ Giả của Cơn Gió Vĩnh Cửu#!#!"
 POD_coteriename_harbingers_eternal_wind_tt: "Sự đọa đày là một lời hiệu triệu. Hãy đáp lại nó."
 POD_coteriename_jean_marc_rabble: "#TOOLTIP:POD_coteriename_jean_marc_rabble_tt #L Đám Ô Hợp của Jean-Marc#!#!"
 POD_coteriename_jean_marc_rabble_tt: "Toàn là những kẻ dối trá và lừa đảo, đoàn kết trong việc theo đuổi tham vọng."
 POD_coteriename_strood_salvation: "#TOOLTIP:POD_coteriename_strood_salvation_tt #L Sự Cứu Rỗi của Strood#!#!"
 POD_coteriename_strood_salvation_tt: "Những kẻ dị giáo phù phiếm và tự phụ vẫn là những kẻ dị giáo."
 POD_coteriename_protectorate_compostela: "#TOOLTIP:POD_coteriename_protectorate_compostela_tt #L Vùng Bảo Hộ Compostela#!#!"
 POD_coteriename_protectorate_compostela_tt: "Những người bảo vệ một trong những thánh địa Kitô giáo linh thiêng nhất chỉ đứng sau Gauthier de Dampierre về đức tin và sự tận tụy."



 POD_coterietravel_none: "$EFFECT_LIST_BULLET$$POD_coterietravel_gui_none$"
 POD_coterietravel_empty: "$EFFECT_LIST_BULLET$$POD_coterietravel_gui_empty$"
 POD_coterietravel_yes: "$EFFECT_LIST_BULLET$Các thành viên của $POD_player_coterie$ sẽ tham gia cùng bạn."
 POD_coterietravel_no: "$EFFECT_LIST_BULLET$Các thành viên của $POD_player_coterie$ sẽ #bold không#! tham gia cùng bạn."
 
 POD_coterietravel_gui_nodestination: "#X @warning_icon! Chưa có điểm đến nào được thiết lập. Đây là lỗi. Vui lòng báo cáo (trên Steam hoặc Discord của PoD).#!"
 #POD_coterietravel_gui_earthbound: "#X @warning_icon! To start the [travel_phase|E] as an [GetTrait('earthbound').GetName(GetPlayer)], you need to inhabit an [artifact|E] and have at least 1 other [GetPlayer.Custom('PODCoterie')] member.#!"
 POD_coterietravel_gui_earthbound: "#X @warning_icon! $POD_no_host_earthbound_travel_text$#!"
 POD_coterietravel_gui_none: "Vì bạn không có [GetPlayer.Custom('PODCoterie')], bạn sẽ đi một mình."
 POD_coterietravel_gui_empty: "Vì bạn là thành viên duy nhất của $POD_player_coterie$, bạn sẽ đi một mình."
 POD_coterietravel_gui: "Đi cùng $POD_player_coterie$?"
 
 
 #####################################
 ##### Travel start event flavor #####
 #####################################
 
 POD_coterietravel_earthbound_flavor: "Cuối cùng cũng đến lúc $POD_player_coterie$ lên đường cho [journey|E] này. [GetPlayer.MakeScope.Var('stone_prison').Artifact.GetName] mà tôi trú ngụ đang được giấu an toàn trong xe ngựa của chúng tôi."
 POD_coterietravel_none_flavor: "Cuối cùng cũng đến lúc tôi lên đường cho [journey|E] của mình."
 POD_coterietravel_yes_flavor: "Cuối cùng cũng đến lúc $POD_player_coterie$ lên đường cho [journey|E] này."
 POD_coterietravel_no_flavor: "Cuối cùng cũng đến lúc tôi lên đường cho [journey|E] của mình. Các thành viên khác của $POD_player_coterie$ đã ở lại để tôi thực hiện nhiệm vụ đơn độc này."
 
 POD_coterieflavor_ambitious_1: "[ROOT.Char.GetFirstNameNicknamed] đang bước đi với vẻ quyết tâm dứt khoát, dường như háo hức vượt qua mọi trở ngại và đối mặt mọi thử thách trên con đường của [ROOT.Char.GetHerHis|l]."
 
 POD_coterieflavor_arbitrary_1: "[ROOT.Char.GetFirstNameNicknamed] bẻ khớp ngón tay [ROOT.Char.GetHerHis|l] đầy háo hức trước chuyến đi này, sẵn sàng phá vỡ vài quy tắc."
 
 POD_coterieflavor_arrogant_1: "[ROOT.Char.GetFirstNameNicknamed] sải bước dẫn đầu nhóm chúng tôi, cằm hếch cao, trông như thể thành công của chuyến đi này là điều hiển nhiên."
 POD_coterieflavor_arrogant_2: "[ROOT.Char.GetFirstNameNicknamed] bật cười sảng khoái. "Đừng có vẻ ủ rũ thế, [GetPlayer.GetFirstName]", [ROOT.Char.GetSheHe|l] nói. "$POD_player_coterie$ sẽ chiến thắng, như chúng ta vẫn luôn thế. Chúng ta là giỏi nhất, xét cho cùng." [ROOT.Char.GetSheHe|U] nháy mắt."
 
 POD_coterieflavor_brave_1: "[ROOT.Char.GetFirstNameNicknamed] đứng ở đầu nhóm chúng tôi. [ROOT.Char.GetSheHe|U] di chuyển với sự tự tin tuyệt đối, sẵn sàng đối mặt mọi hiểm nguy và cười vào mặt nó."
 
 POD_coterieflavor_callous_1: "[ROOT.Char.GetFirstNameNicknamed] bước đi cạnh nhóm chúng tôi, không một chút cảm xúc hiện trên gương mặt [ROOT.Char.GetHerHis|l]."
 
 POD_coterieflavor_calm_1: "[ROOT.Char.GetFirstNameNicknamed] nhìn về phía trước với vẻ mặt thanh thản trên gương mặt [ROOT.Char.GetHerHis|l]. Tôi chưa từng thấy [ROOT.Char.GetHerHim|l] hoảng loạn, và tôi tự hỏi liệu chuyến đi này có phải lần đầu tiên không."
 
 POD_coterieflavor_chaste_1: "[ROOT.Char.GetFirstNameNicknamed] bước đi cạnh nhóm chúng tôi một cách lơ đãng, dường như đang chìm đắm trong một kiểu tưởng tượng nào đó. Chắc chắn không phải loại đồi trụy, biết tính [ROOT.Char.GetHerHim|l]."
 
 POD_coterieflavor_compassionate_1: "[ROOT.Char.GetFirstNameNicknamed] nhìn phần còn lại của chúng tôi với sự ấm áp chân thành trong ánh mắt [ROOT.Char.GetHerHis|l], luôn vui vẻ giúp đỡ người khác trong hành trình của họ."
 
 POD_coterieflavor_content_1: "[ROOT.Char.GetFirstNameNicknamed] bước đi cùng nhóm với nhịp độ thoải mái. [ROOT.Char.GetSheHe|U] trông thực sự hài lòng đi theo bất cứ điều gì, dù chuyến đi này thành công hay thất bại."
 
 POD_coterieflavor_craven_1: "[ROOT.Char.GetFirstNameNicknamed] trông hơi căng thẳng trước viễn cảnh lên đường lần này. [ROOT.Char.GetSheHe|U] có tiếng là nhát gan, nhưng chuyến đi này có thể là cơ hội để [ROOT.Char.GetHerHim|l] chứng minh bản thân [ROOT.Char.GetHerselfHimself|l]."
 
 POD_coterieflavor_cynical_1: "[ROOT.Char.GetFirstNameNicknamed] mang nụ cười nhếch mép đầy thấu hiểu trên gương mặt [ROOT.Char.GetHerHis|l], sẵn sàng theo bất kỳ chuyến phiêu lưu nào miễn là nó cho [ROOT.Char.GetHerHim|l] cơ hội thách thức các vị thần."
 
 POD_coterieflavor_deceitful_1: "[ROOT.Char.GetFirstNameNicknamed] nháy mắt với tôi đầy ẩn ý. Tôi biết rõ tài dối trá của [ROOT.Char.GetHerHis|l], và tôi hy vọng [ROOT.Char.GetSheHe|l] sẽ hướng nó vào kẻ thù của chúng ta, chứ không phải các thành viên khác của $POD_player_coterie$."
 
 POD_coterieflavor_diligent_1: "[ROOT.Char.GetFirstNameNicknamed] mang theo một túi đầy trang bị, rõ ràng đã chuẩn bị kỹ lưỡng cho chuyến đi này."
 
 POD_coterieflavor_eccentric_1: "[ROOT.Char.GetFirstNameNicknamed] huýt sáo một giai điệu nho nhỏ cho [ROOT.Char.GetHerselfHimself|l] và gật gù đầu [ROOT.Char.GetHerHis|l] qua lại, lạc trong thế giới riêng của [ROOT.Char.GetHerHis|l]."
 
 POD_coterieflavor_fickle_1: "[ROOT.Char.GetFirstNameNicknamed] nhìn xa xăm về phía đàn chim, dễ bị phân tâm như thường lệ."
 
 POD_coterieflavor_forgiving_1: "[ROOT.Char.GetFirstNameNicknamed] mỉm cười thánh thiện, thực sự sống trọn từng khoảnh khắc, bất kể chuyện gì xảy ra."
 
 POD_coterieflavor_generous_1: "[ROOT.Char.GetFirstNameNicknamed] nhìn phần còn lại của nhóm chúng tôi với vẻ nồng hậu. Tôi mong chúng ta sẽ không gặp phải ai lợi dụng lòng hào phóng của [ROOT.Char.GetHerHis|l]."
 
 POD_coterieflavor_gluttonous_1: "[ROOT.Char.GetFirstNameNicknamed] vỗ vỗ bụng [ROOT.Char.GetHerHis|l], đã háo hức mong chờ những món ngon [ROOT.Char.GetSheHe|l] có thể được thưởng thức trong chuyến đi này."
 
 POD_coterieflavor_greedy_1: "[ROOT.Char.GetFirstNameNicknamed] sờ vào túi tiền trong túi áo [ROOT.Char.GetHerHis|l], chắc chắn sẽ dùng chuyến đi này như một cách để làm đầy thêm nó."
 
 POD_coterieflavor_gregarious_1: "[ROOT.Char.GetFirstNameNicknamed] vui vẻ trò chuyện với tôi đủ thứ chuyện, thực sự thoải mái nhất trong yếu tố của [ROOT.Char.GetHerHis|l] khi ở giữa đám đông."
 
 POD_coterieflavor_honest_1: "[ROOT.Char.GetFirstNameNicknamed] nhìn xa xăm với vẻ mặt điềm tĩnh trên gương mặt [ROOT.Char.GetHerHis|l]. Liệu bản tính trung thực của [ROOT.Char.GetHerHis|l] sẽ là lợi thế trong chuyến đi này, hay là gánh nặng?"
 
 POD_coterieflavor_humble_1: "[ROOT.Char.GetFirstNameNicknamed] bước đi với hai tay [ROOT.Char.GetHerHis|l] khoanh sau lưng [ROOT.Char.GetHerHis|l]. [ROOT.Char.GetSheHe|U] là một phần quan trọng của nhóm chúng tôi, dù [ROOT.Char.GetSheHe|l] sẽ không bao giờ thừa nhận điều đó."
 
 POD_coterieflavor_impatient_1: "[ROOT.Char.GetFirstNameNicknamed] gõ chân [ROOT.Char.GetHerHis|l] sốt ruột, dường như nóng lòng muốn lên đường."
 POD_coterieflavor_impatient_2: "[ROOT.Char.GetFirstNameNicknamed] đang đi đi lại lại. [ROOT.Char.GetSheHe|U] liếc tôi đầy trách móc. "Đi thôi nào. Chúng ta không nên lãng phí thêm thời gian nào nữa.""
 
 POD_coterieflavor_just_1: "[ROOT.Char.GetFirstNameNicknamed] trông trầm ngâm. Có lẽ [ROOT.Char.GetSheHe|l] đã hy vọng lên một chuyến đi khác, một chuyến đi có thể sửa chữa một trong những bất công lớn của thế giới này."
 
 POD_coterieflavor_lazy_1: "[ROOT.Char.GetFirstNameNicknamed] lê bước ở cuối nhóm chúng tôi với nhịp độ thong thả, không một chút bận tâm nào trên đời."
 
 POD_coterieflavor_lustful_1: "[ROOT.Char.GetFirstNameNicknamed] bước đi cạnh nhóm chúng tôi một cách lơ đãng, dường như đang chìm đắm trong một kiểu tưởng tượng nào đó. Một loại đồi trụy, biết tính [ROOT.Char.GetHerHim|l]."
 
 POD_coterieflavor_paranoid_1: "Ánh mắt của [ROOT.Char.GetFirstNameNicknamedPossessive] đảo qua đảo lại, lo lắng quét khắp xung quanh để tìm bất kỳ dấu hiệu nguy hiểm nào."
 
 POD_coterieflavor_patient_1: "[ROOT.Char.GetFirstNameNicknamed] nhìn phần còn lại của nhóm chúng tôi với cái gật đầu điềm tĩnh, như thể [ROOT.Char.GetSheHe|l] có cả một khoảng thời gian vô tận để hoàn thành chuyến đi này."
 
 POD_coterieflavor_sadistic_1: "Ánh mắt của [ROOT.Char.GetFirstNameNicknamedPossessive] quét khắp chân trời với cơn khát gợi nhớ đến một kẻ săn mồi, háo hức hơi quá mức trước những hiểm nguy phía trước."
 
 POD_coterieflavor_shy_1: "[ROOT.Char.GetFirstNameNicknamed] bước đi cẩn trọng, ánh mắt [ROOT.Char.GetHerHis|l] dán chặt xuống đất. [ROOT.Char.GetSheHe|U] hiếm khi có tâm trạng muốn trò chuyện."
 
 POD_coterieflavor_stubborn_1: "[ROOT.Char.GetFirstNameNicknamed] tiến bước với nhịp độ không gì lay chuyển nổi, như thể không gì có thể ngăn [ROOT.Char.GetHerHim|l] hoàn thành chuyến phiêu lưu của chúng ta đến cùng."
 
 POD_coterieflavor_temperate_1: "[ROOT.Char.GetFirstNameNicknamed] mang theo một túi trang bị nhẹ nhàng và gọn gàng, đúng với niềm tin của [ROOT.Char.GetHerHis|l] rằng sự điều độ là tất cả."
 
 POD_coterieflavor_trusting_1: "[ROOT.Char.GetFirstNameNicknamed] nhìn xung quanh với vẻ ngạc nhiên trong veo, hoặc không hề hay biết hoặc không hề bận tâm đến bất kỳ hiểm nguy nào chúng ta có thể gặp phải."
 
 POD_coterieflavor_vengeful_1: "[ROOT.Char.GetFirstNameNicknamed] trông nghiêm nghị. Luôn khó mà đoán được [ROOT.Char.GetSheHe|l] đang nghĩ gì. Chuyến đi này có thể chỉ là một bước trong kế hoạch lớn của [ROOT.Char.GetHerHis|l] để hạ gục kẻ thù của [ROOT.Char.GetHerHis|l]."
 
 POD_coterieflavor_wrathful_1: "[ROOT.Char.GetFirstNameNicknamed] đang tiến bước ở đầu nhóm chúng tôi, vai ưỡn thẳng, trông như một cái lò xo đã sẵn sàng bung ra. Tôi mong cơn nóng giận khét tiếng của [ROOT.Char.GetHerHis|l] sẽ không gây rắc rối cho chuyến phiêu lưu của chúng ta."
 
 POD_coterieflavor_zealous_1: "[ROOT.Char.GetFirstNameNicknamed] sải bước tiến lên đầy quyết tâm, một niềm tin sâu sắc bắt nguồn từ đức tin của [ROOT.Char.GetHerHis|l] vào lý tưởng của [ROOT.Char.GetFaith.GetName]."
 
 POD_coterieflavor_generic_1: "[ROOT.Char.GetFirstNameNicknamed] không có tính cách. Đã có lỗi xảy ra khi tạo nhân vật này."