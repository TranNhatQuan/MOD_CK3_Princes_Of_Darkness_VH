l_english:



 jagglings: "Jaggling"
 jagglings_flavor: "#F Jaggling là những "công dân" umbra thông thường. Chúng thường có tri giác, và sở hữu bản sắc cá nhân riêng. Jaggling thường phụng sự một Incarna.#!"

 water_spirits: "Linh Thể Nước"
 water_spirits_flavor: "Linh thể nhỏ của vùng nước địa phương được triệu hồi để phụng sự."

 rat_headed_dragonfly_demon: "Ác Quỷ Chuồn Chuồn Đầu Chuột"
 rat_headed_dragonfly_demon_flavor: "#F Dài từ ba mươi đến bốn mươi lăm centimet, với sải cánh lên đến sáu mươi centimet, những ác quỷ chuồn chuồn có lớp vỏ óng ánh rực rỡ như lồng ngực ruồi hay dầu loang trên mặt nước. Chúng được Devil Tigers dùng làm trinh sát.#!"

 sleeper_seducing_bane: "Tà Linh Quyến Rũ Kẻ Ngủ"
 sleeper_seducing_bane_flavor: "#F Những ác quỷ giống succubus này chẳng hề hấp dẫn chút nào. Thật vậy, Tà Linh Quyến Rũ Kẻ Ngủ hiện hình như những khối thịt đỏ ướt nhẫy trải rộng vài mét và gắn đầy xúc tu đủ kích cỡ. Devil Tigers được biết là có trói buộc chúng để phụng sự mình.#!"

 face_robe_demon: "Ác Quỷ Áo Choàng Mặt"
 face_robe_demon_flavor: "#F Ác Quỷ Áo Choàng Mặt khó chịu ngay cả theo tiêu chuẩn của Devil Tigers. Cư ngụ giữa những hành vi tàn bạo và tuyệt vọng, Ác Quỷ Áo Choàng Mặt được đặt tên như vậy vì thói quen khó chịu của chúng là khoác lên mình những áo choàng lộng lẫy làm từ khuôn mặt của nạn nhân.#!"

 fire_elemental: "Linh Thể Lửa"
 fire_elemental_flavor: "#F Linh Thể Lửa, tự xem mình là đam mê của Gaia và từng dạy loài người cách dùng lửa. Chúng bất chợt xuất hiện phía sau Gauntlet, chỉ để rồi tan biến khi nguồn nuôi dưỡng của chúng cạn kiệt.#!"

 air_elemental: "Linh Thể Khí"
 air_elemental_flavor: "#F Linh Thể Khí, thường cư ngụ ở những vùng xa xôi của [UmbraGlossary('aetherial_realm')] hoặc đi theo những Cơn Gió Umbra.#!"

 water_elemental: "Linh Thể Nước"
 water_elemental_flavor: "#F Linh Thể Nước, cư ngụ trong các vùng nước bên trong Umbrascape.#!"

 earth_elemental: "Linh Thể Đất"
 earth_elemental_flavor: "#F Linh Thể Đất, được đồn rằng gần gũi nhất với Gaia và thường cư ngụ trong lớp đất chưa bị ô nhiễm bên trong [UmbraGlossary('penumbra')].#!"

 electricity_elemental: "Linh Thể Sét"
 electricity_elemental_flavor: "#F Garou Trưởng Lão tin rằng Linh Thể là tạo vật đầu tiên của Gaia và những linh thể mới hơn là một sự tha hóa báo hiệu Khải Huyền. Số khác tin rằng những linh thể này vẫn luôn hiện hữu nhưng thiếu vật chất để hiện hình. Dù có những câu chuyện về một Triều Đình Linh Thể ở [UmbraGlossaryLocalized('astral_reaches','High Umbra')], hầu hết Garou không tin vào sự tồn tại của nó. Theurge nói rằng những gì người ngoài cảm nhận như một hệ thống cấp bậc chỉ là phản chiếu của những giả định riêng mà Linh Thể phản ánh lại để giao tiếp tốt hơn với một sinh vật bằng xương bằng thịt.#!"

 metal_elemental: "Linh Thể Kim Loại"
 metal_elemental_flavor: "#F Linh Thể Kim Loại tự xem mình là những kẻ thống trị tương lai của giống loài mình và có mối quan hệ căng thẳng với Linh Thể Đất. Chúng hiện hình như những hình nhân làm từ kim loại mà chúng đại diện, và thường nóng nảy, kiêu ngạo.#!"

 wood_elemental: "Linh Thể Gỗ"
 wood_elemental_flavor: "#F Chỉ già hơn linh thể kim loại một chút, lin shen cũng có mối quan hệ gần gũi với con người. Trong khi một số tieh shen cảm thấy bị con người bỏ rơi, hầu hết Linh Thể Gỗ cảm thấy mình là nạn nhân.#!"

 liderci: "Liderci"
 liderci_flavor: "#F Những linh thể quỷ quyệt này là hiện thân của dục vọng thuần khiết, những kẻ cám dỗ linh hồn và tình nhân của ác quỷ.#!"

 animated_tree: "Cây Được Hồn Hóa"
 animated_tree_flavor: "#F Những cái cây được truyền phép và hồn hóa để hành động, chúng hành quân ra trận khi được một người làm vườn phép thuật dẫn dắt.#!"

 stormcrows: "Quạ Bão"
 stormcrows_flavor: "#F Được Ông Nội Sấm Sét sủng ái, Quạ Bão chủ yếu đóng vai trò gián điệp cho Shadow Lords, nhưng chúng có thể là một lực lượng mạnh mẽ khi đủ đông đảo.#!"

 apis_minotaurs: "Minotaur"
 apis_minotaurs_flavor: "#F Apis hay Moonbull đã bị Garou đẩy đến bờ tuyệt chủng, một tội ác ghê tởm phạm phải với một giống loài từ bi. Nhưng đừng nhầm lòng từ bi của chúng với sự yếu đuối vì chúng trở lại để báo thù cho cái chết của mình nhờ sức mạnh Mnesis của Mokolé.#!"

 camazotz_megachiropteras: "Megachiroptera"
 camazotz_megachiropteras_flavor: "#F Nhờ sức mạnh của Mnesis những con dơi người đã tuyệt chủng trở lại để bay lượn trong bóng tối. Răng nanh của chúng sẵn sàng cắm sâu vào những kẻ đã gây ra sự diệt vong của chúng, hoặc bất cứ ai cản đường chúng.#!"

 grondr_daeodons: "Daeodon"
 grondr_daeodons_flavor: "#F Nơi kẻ khác có thể rút lui vì sợ bị $glossary_wyrm$ làm ô uế hay chiếm hữu, Grondr sẽ tiến lên, không hề nao núng trước sự ô uế áp đảo. Nhiều Fera nhớ về Grondr theo cách này, và giờ đây những ký ức đó đã được đưa vào hiện thực qua Mnesis. Giờ đây Grondr tìm kiếm Garou, để thanh trừng chúng và sự ô uế của chúng. Vì còn lý do gì khác khiến chúng phạm phải sự phản bội như vậy?.#!"

 hoglings: "Hogling"
 hoglings_flavor: "#F Những Tà Linh này hiện hình như những đám mây khói độc dày đặc, cuồn cuộn một cách đáng ngại trên mục tiêu của chúng.#!"
 furmlings: "Furmling"
 furmlings_flavor: "#F Những khối lửa xanh phát sáng bệnh hoạn, những Tà Linh này lan truyền lửa và hủy diệt bất cứ nơi nào chúng đi qua.#!"
 hrugglings: "H'ruggling"
 hrugglings_flavor: "#F Những Tà Linh này là những đống chất thải cống rãnh lăn lóc, với mùi hôi thối và sức mạnh tà ác tương xứng.#!"
 wakshaani: "Wakshaani"
 wakshaani_flavor: "#F Tà Linh hiện hình như những tấm chất lỏng màu tím với vết loang, mạch máu và mụn nước sủi bọt.#!"
 phantasmi: "Phantasmi"
 phantasmi_flavor: "#F Phantasmi là tàn tích của những fomori đã chết. Những lớp vỏ rỗng này tìm cách hủy diệt bất cứ thứ gì đã giết chúng.#!"
 bitter_rages: "Phẫn Nộ Cay Đắng"
 bitter_rages_flavor: "#F Tà Linh do Wyrm tạo ra trong một nỗ lực biến mọi người thành kẻ điên loạn.#!"
 meat_puppets: "Con Rối Thịt"
 meat_puppets_flavor: "#F Xác chết bị chiếm hữu của những con vật non và con người đã chết oan uổng, được đưa trở lại để lan truyền khổ đau.#!"
 shade_spiders: "Nhện Bóng"
 shade_spiders_flavor: "#F Những bàn tay người bị chặt đứt tìm cách kéo người sống đến chỗ diệt vong.#!"
 gray_masses: "Khối Xám"
 gray_masses_flavor: "#F Từng là linh thể của Wyld, giờ đây sự phát triển nấm mốc hủy diệt của chúng phụng sự Wyrm thay vào đó.#!"
 thinbones: "Xương Gầy"
 thinbones_flavor: "#F Tà Linh đói khát không đáy, sinh ra ở những nơi nạn đói khủng khiếp.#!"
 glutton_worms: "Giun Phàm Ăn"
 glutton_worms_flavor: "#F Chúng trông đại khái như lai giữa một con ấu trùng khổng lồ và một con rắn phình to không da; chúng không có mắt, chỉ có những lớp thịt hồng nhạt xám cuộn quanh một bộ hàm dài như cá barracuda.#!"
 scrags: "Scrag"
 scrags_flavor: "#F Tà Linh chiến binh phục vụ như binh lính của Wyrm trong cuộc truy cầu hủy diệt vô tận của nó.#!"
 nexus_crawlers: "Kẻ Bò Trườn Nexus"
 nexus_crawlers_flavor: "#F Tà Linh đáng sợ mà chỉ riêng sự hiện diện của chúng cũng ăn mòn và phân hủy kết cấu của thực tại xung quanh chúng.#!"