l_english:
  POD_custom_nickname.10.t: "Biệt Hiệu Tùy Chọn"
  POD_custom_nickname.10.desc: "Nhiều cư dân của World of Darkness được biết đến bằng nhiều hơn chỉ mỗi tên gọi; ngươi có phải một trong số họ hay ngươi vẫn chưa giành được vinh dự đó?"
  POD_custom_nickname.10.a: "Có, hãy để ta chọn cách ta sẽ được gọi"
  POD_custom_nickname.10.b: "Không, ta vẫn chưa có biệt hiệu nào"

  POD_custom_nickname.100.t: "Biệt Hiệu Tùy Chọn"
  POD_custom_nickname.100.desc: "Một quyết định quan trọng cần được đưa ra, ngươi muốn được gọi là gì? \n\nNếu ngươi đưa ra một quyết định tồi thì ngươi sẽ phải sống chung với nó trong một thời gian rất dài."
  POD_custom_nickname.100.a: "Từ nay ta sẽ được biết đến với tên..."

   #Both of these are needed for the custom nickname to work properly.
  nick_POD_custom_nickname1: "[ROOT.Char.GetLocalizedText('POD_custom_nickname_text')]"
  nick_POD_custom_nickname2: "[CHARACTER.Custom('PODCustomNickname')]"

  nick_POD_custom_nickname_default: "Kẻ Đã Khuất"