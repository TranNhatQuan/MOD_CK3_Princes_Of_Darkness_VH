 POD_malkavian_madness_network_divine: "Mạng lưới Điên loạn: Thần thánh"
 POD_malkavian_madness_network_divine_desc: "Sử dụng thông tin từ những huynh đệ Malkavian của ngươi và lắng nghe những lời thì thầm tăm tối.... Mở đường cho mục tiêu rơi vào những mưu đồ nhỏ nhặt của ngươi."
 POD_malkavian_madness_network_divine_ct: "Với mỗi Malkavian trong triều đình của [recipient.GetFirstNamePossessive], sự khôn khéo của [recipient.GetHerHis] sẽ bị suy giảm."
 POD_malkavian_madness_network_backlash: "Việc khai thác mạng lưới điên loạn có thể gây ra những tác dụng phụ "thú vị"."
