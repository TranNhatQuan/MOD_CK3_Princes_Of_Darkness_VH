 POD_blink_modifier_desc: "Di chuyển với tốc độ kinh người, ngươi đang tìm ra tuyến đường nhanh nhất để đại quân của ngươi noi theo."
 
 POD_drained_modifier: "Kiệt Sức"
 POD_drained_modifier_desc: "Di chuyển quá nhanh khiến đầu óc ngươi choáng váng, làm cho việc nắm bắt toàn cục trở nên khó khăn hơn."
 
 POD_blink_interaction: "Chớp Dời"
 POD_blink_interaction_desc: "Sử dụng sức mạnh Celerity của ngươi, ngươi sẽ đảm bảo mọi việc diễn ra nhanh hơn! Nhất là đại quân của ngươi."
   
 POD_vanish_interaction: "Biến Mất"
 POD_vanish_interaction_desc: "Sử dụng sức mạnh Obfuscate của ngươi, ngươi có thể biến mất khỏi tầm mắt thế nhân trong một khoảng thời gian, ngăn chặn mọi âm mưu nhắm vào ngươi."
 POD_vanish_tt: "Mọi âm mưu nhắm vào ngươi, dù là riêng tư hay thù địch, đều bị ngăn chặn."

 POD_silence_death_modifier: "Sự Tĩnh Lặng của Tử Thần"
 POD_silence_death_modifier_desc: "Thật khó mà giao tiếp khi một sự tĩnh lặng rợn người bám theo ngươi khắp mọi nơi."
 
 POD_silence_of_death_interaction: "Sự Tĩnh Lặng của Tử Thần"
 POD_silence_of_death_interaction_desc: "Sử dụng sức mạnh Obfuscate của ngươi, ngươi có thể cản trở nghiêm trọng mọi nỗ lực giao tiếp của nạn nhân."
 
