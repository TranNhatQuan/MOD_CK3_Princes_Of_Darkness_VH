 awaketorpor_desc: "Ta sẽ định vị [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] và sau đó xử lý hắn theo cách ta thấy phù hợp"
 awaketorpor_desc_general: "Cố gắng định vị nơi ẩn náu của con ma cà rồng đang Miên trạng này"
 AWAKETORPOR_SUCCESS_DESC: "Ngươi sẽ bắt đầu cuộc khám phá cuối cùng nơi ẩn náu của [TARGET_CHARACTER.GetShortUINamePossessive]"
