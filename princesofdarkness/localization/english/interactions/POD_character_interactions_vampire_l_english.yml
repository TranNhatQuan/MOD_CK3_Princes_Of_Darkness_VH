 fortitude_soaked_damage_ct: "Sự tinh thông Fortitude của ngươi đã bảo vệ ngươi khỏi bị thương."
 armoured_flesh_ct: "Lớp da thịt như giáp sắt của ngươi sẽ ngăn ngươi khỏi cái chết"
