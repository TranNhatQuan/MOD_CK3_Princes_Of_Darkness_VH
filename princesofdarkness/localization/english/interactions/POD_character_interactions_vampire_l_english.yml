 awaketorpor_my_learning: "Học Thức của Ngươi: $VALUE|=+0$"
 awaketorpor_my_rival: "Nạn Nhân của Ngươi: $VALUE|=+0$"
 POD_awaketorpor.667.t: "Mất Dấu Vết"
 POD_awaketorpor.667.desc: "Có lẽ con mồi của ngươi đã tỉnh giấc, hoặc mọi manh mối của ngươi đều sai lệch ngay từ đầu. Dù sao đi nữa, ngươi đã mất dấu vết của con ma cà rồng đang Miên trạng và phải bắt đầu lại từ đầu nếu ngươi vẫn quyết tâm định vị hắn."
 POD_awaketorpor.667.option.a: "Có vẻ như ta đã bị đoán trước"
 POD_awaketorpor.1.t: "Câu Hỏi và Câu Trả Lời"
 POD_awaketorpor.1.desc: "Ngươi đã tìm thấy một manh mối quan trọng về vị trí của con ma cà rồng đang say ngủ mà ngươi tìm kiếm. Đáng buồn thay, manh mối đó chỉ dẫn ngươi đến một mức nào đó, và thực chất chỉ đưa ngươi đến một ngôi làng nhỏ nơi không ai muốn nói chuyện với ngươi.\nCó lẽ họ đang bị nô dịch bởi con mồi của ngươi? Thật khó nói, nhưng ngươi không thể thực tế mà lang thang quanh khu vực này quá lâu, vậy nên ngươi sẽ phải thuyết phục họ trả lời các câu hỏi của mình."
 POD_awaketorpor.1.option.a: "Ngươi kia! Trả lời ta!"
 POD_awaketorpor.1.option.aa.effect.success.desc: "Một thành công tuyệt đối sẽ giúp kế hoạch của ngươi tiến triển suôn sẻ"  
 POD_awaketorpor.1.option.ab.effect.success.desc: "Ngươi có thể sẽ mất thứ gì đó trên đường đi..."      
 POD_awaketorpor.1.option.ac.effect.success.desc: "Ngươi mất dấu vết..."      
 POD_awaketorpor.1.option.b: "Việc này không đáng để bận tâm"       
 POD_awaketorpor.1.option.b.custom: "Ngươi kết thúc hành trình của mình tại đây, để mặc con ma cà rồng đang say ngủ với giấc ngủ của hắn"       
 POD_awaketorpor.1.success: "Vàng bạc mở ra nhiều cánh cửa"
 POD_awaketorpor.2.t: "Mê Cung"
 POD_awaketorpor.2.desc: "Hiển nhiên, nó phải là một mê cung. Mục tiêu của ngươi đã xây dựng hoặc mượn một loạt hang động dưới lòng đất và giờ đang ẩn náu trong đó. Và, ngươi đoán đúng đấy, có bẫy ở khắp mọi nơi.\nNgươi có thể cố gắng vượt qua mê cung này để đến được con mồi của mình, nhưng ngươi rất có khả năng sẽ bị thương trong quá trình đó."
 POD_awaketorpor.2.option.a: "Từng bước một..."
 POD_awaketorpor.2.success: "Ối! Đừng nhắm vào đầu!"
 POD_awaketorpor.3.t: "Đám Nô Bộc"
 POD_awaketorpor.3.desc: "Ngươi tìm thấy nơi mục tiêu của mình đang nằm... nhưng ngươi cũng tìm thấy cả một đội quân lính đánh thuê đang canh giữ nơi đó, dường như được trả công bởi một âm mưu phức tạp do một vài Nô Bộc của con ma cà rồng đó điều hành. Ngươi cũng có quân đội của riêng mình không xa lắm, hiển nhiên rồi, nhưng lính đánh thuê đã cố thủ vững chắc và đang chờ đợi rắc rối.\nSự lựa chọn là của ngươi, nếu ngươi tiến lên, ngươi sẽ cần chiến thắng thật nhanh trước khi chúng di chuyển con ma cà rồng đang Miên trạng đến nơi khác. Ngươi cũng có thể hủy bỏ chiến dịch này nếu không muốn mạo hiểm."
 POD_awaketorpor.3.option.a: "Xung phong!"
 POD_awaketorpor.3.option.b: "Việc này không đáng để bận tâm"
 POD_awaketorpor.3.success: "Một chiến thắng hỗn loạn"
 POD_awaketorpor.10.t: "Sự Lựa Chọn"
 POD_awaketorpor.10.desc: "Mọi trở ngại trên con đường đến với mục tiêu đang Miên trạng của ngươi đã bị dẹp bỏ. Giờ đây, ngươi phải chuẩn bị tinh thần cho cuộc đối đầu với con mồi của mình, vì những con ma cà rồng vừa mới thức tỉnh không phải là những kẻ thân thiện nhất.\nNgươi phải chọn mục tiêu của mình đối với con quái vật đang say ngủ trước mặt ngươi."
 POD_awaketorpor.10.option.a: "Ta muốn đánh thức và chiêu mộ họ"
 POD_awaketorpor.10.option.b: "Thêm một linh hồn nữa để ăn!"
 POD_awaketorpor.11.t: "Trở Về Nhà"
 POD_awaketorpor.11.desc: "Ngươi đã mất dấu vết của mục tiêu, và ngươi trở về triều đình mà không có gì mấy, nếu có, để cho thấy về chuyến đi của mình. Hiển nhiên, đây là một thời điểm khó khăn, vì các đối thủ của ngươi đã cười khẩy sau lưng ngươi.\nNgươi sẽ xử lý tình huống này như thế nào?"
 POD_awaketorpor.11.option.a: "Chi tiền cho một cuộc phô trương lực lượng để dập tắt sự bất ổn"
 POD_awaketorpor.11.option.b: "Chúng sẽ im lặng theo thời gian"
 POD_awaketorpor.12.t: "Lời Nói Trong Giấc Ngủ"
 POD_awaketorpor.12.desc: "Ngươi đã tìm thấy con mồi của mình và sử dụng một người hiến máu 'tự nguyện' để giúp gột rửa giấc ngủ hàng thế kỷ. Không quá nhiều rắc rối, mặc dù hiển nhiên ngươi đã đứng cách xa trong suốt quá trình.\nGiờ đây, mục tiêu của ngươi đã hoàn toàn tỉnh táo, và đang lắng nghe cẩn thận những gì ngươi đề nghị. Đây là lúc quyết định, ngươi sẽ phải đảm bảo sự tham gia của họ và trở về triều đình của mình. Tốt hơn hết hãy chắc chắn về những gì ngươi sẽ nói tiếp theo..."
 POD_awaketorpor.12.option.a: "Ngươi sẽ không từ chối đề nghị của ta"
 POD_awaketorpor.12.option.aa.effect.success.desc: "Mục tiêu của ngươi gia nhập triều đình của ngươi!"  
 POD_awaketorpor.12.option.ab.effect.success.desc: "Ngươi đã phải van xin, nhưng nó đã thành công"      
 POD_awaketorpor.12.option.ac.effect.success.desc: "Một lời từ chối thẳng thừng, ngươi rời đi một mình"           
 POD_awaketorpor.12.option.b.custom: "Ngươi kết thúc hành trình của mình tại đây, để mặc con ma cà rồng đang say ngủ với giấc ngủ của hắn"       
 POD_awaketorpor.12.success: "Chào mừng!"
 POD_awaketorpor.12.successb: "...Chào mừng!" 
 POD_awaketorpor.12.successc: "Tất cả đều vô ích..."  
 POD_awaketorpor.13.t: "Người Canh Gác"
 POD_awaketorpor.13.desc: "Chỉ còn một trở ngại duy nhất trên con đường đến với con mồi của ngươi, một chiến binh trông có vẻ cứng cỏi đang canh giữ con ma cà rồng đang say ngủ. Họ có thể là một [ghoul|E], nhưng họ có vẻ được huấn luyện rất tốt, và ngươi nghi ngờ rằng những kẻ khác đang mai phục gần đó.\nKhông gian quá chật hẹp để phát động một cuộc tấn công bằng quân đội, và ngươi không thể quay lại bây giờ, nếu không chúng sẽ di chuyển thi thể của chủ nhân chúng đi. Vậy nên đây là một trận chiến mà ngươi rõ ràng đang ở thế bất lợi, nhưng ngươi có thể cảm nhận được dòng máu đang đập rộn ràng của con mồi mình gọi ngươi đến gần..."
 POD_awaketorpor.13.option.a: "Ta sẽ giết ngươi trước. Rồi sẽ đến lượt chủ nhân của ngươi!"
 POD_awaketorpor.13.option.abis: "Ngươi sẽ không ngăn được ta!"
 POD_awaketorpor.13.option.aa.effect.success.desc: "Một chiến thắng toàn diện!"  
 POD_awaketorpor.13.option.ab.effect.success.desc: "Thật gian nan..."      
 POD_awaketorpor.13.option.ac.effect.success.desc: "Khoan đã! Dùng mũi tên lửa là gian lận đấy!"           
 POD_awaketorpor.13.success: "...suýt chút nữa"
 POD_awaketorpor.14.t: "Phần Thưởng"
 POD_awaketorpor.14.desc: "Cuối cùng, mục tiêu đang say ngủ của ngươi cũng đã hoàn toàn không còn khả năng tự vệ trước ngươi. Ngươi gần như run lên vì mong đợi, điều mà hiển nhiên là không thể xảy ra trong trạng thái của ngươi. Thời gian dường như đứng yên khi ngươi phô ra nanh vuốt của mình, sẵn sàng tiêu thụ linh hồn mà ngươi đã chiến đấu để giành lấy.\nDã Thú của ngươi vô cùng hài lòng, và ngươi sẽ rời khỏi nơi này mạnh mẽ hơn khi đến... nhưng có lẽ bớt nhân tính hơn."
 POD_awaketorpor.14.option.a: "Một chiến thắng đẫm máu."
 POD_awaketorpor.14.option.b: "Chỉ cần kết liễu chúng."
 POD_awaketorpor.14.desc.b: "Cuối cùng, mục tiêu đang say ngủ của ngươi cũng đã hoàn toàn không còn khả năng tự vệ trước ngươi. Không còn gì để làm ngoài việc hoàn thành nhiệm vụ nghiệt ngã mà ngươi đã đến đây vì nó. Đây có thể không phải là một cách rất kịch tính để kết thúc cuộc phiêu lưu này, nhưng việc đảm bảo kẻ thù này sẽ không bao giờ tỉnh dậy để cản trở ngươi trong tương lai tự nó đã là một thành công."
 POD_awaketorpor_prisoner_interaction: "Đánh Thức Tù Nhân"
 POD_awaketorpor_prisoner_interaction_desc: "Cưỡng ép [recipient.GetFirstName] thức dậy khỏi [GetTrait('wraith').GetName( recipient )]."
 
 
 POD_infiltrate_interaction: "Xâm nhập"
 POD_infiltrate_interaction_desc: "Ngươi sẽ xâm nhập triều đình này trong lốt một kẻ mới được Trao truyền, khiến chúng chịu một khoản phạt kháng cự âm mưu đáng kể"
 infiltrate_modifier: "Đã bị Xâm nhập"
 infiltrate_modifier_desc: "Không hiểu vì sao, ai nấy trong triều đình ngươi dường như đều biết quá nhiều chuyện..."
  
 absalon_svantevit_reborn: "Svantevit Tái Sinh"
 absalon_svantevit_reborn_desc: "Vị Thần chiến tranh lại một lần nữa bước đi giữa đêm tối!... dù điều đó khiến vật chủ đáng thương của ngài phải chịu không ít căng thẳng"
           
 POD_trial_by_war_interaction: "Thử thách bằng Chiến trận"
 POD_trial_by_war_interaction_desc: "Đã đến lúc dạy cho kẻ này biết ai mới thực sự là Voivode ở đây"
    
 POD_etrius_abuse_interaction: "Chính trị Tremere"
 POD_etrius_abuse_interaction_desc: "Là cánh tay phải của chính Tremere, đã đến lúc sử dụng quyền lực của ngươi bên trong $pod_clan$"
     
 POD_maatkare_interaction: "Quyến rũ"
 POD_maatkare_interaction_desc: "Giúp $pod_cainite$ lầm đường lạc lối này học được sự thật về vinh quang của Set"
 
 POD_ventrue_succor_interaction: "Đạo lý Cứu giúp"
 POD_ventrue_succor_interaction_desc: "$pod_clan$ Ventrue tự ràng buộc mình vào quyền được cứu giúp - khi một Ventrue đang lâm vào cảnh nguy khốn cùng cực, những Ventrue khác có nghĩa vụ phải giúp đỡ họ. Tuy nhiên, không có gì là miễn phí."
 
