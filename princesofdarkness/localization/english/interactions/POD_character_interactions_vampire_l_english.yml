 resilient_mind_ct: "Fortitude của ngươi hoạt động như một lớp đệm giữa tâm trí ngươi và sự điên loạn, thanh tẩy ngươi khỏi chứng loạn thần cả tự nhiên lẫn có nguồn gốc ma thuật."
