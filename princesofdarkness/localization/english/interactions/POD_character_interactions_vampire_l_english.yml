 scheme_interaction_tt_awaketorpor_approved: "Ngươi sẽ cố tìm hiểu vị trí chính xác của con ma cà rồng đang Miên trạng này. Sau đó cuộc săn lùng sẽ bắt đầu. Hiển nhiên, có những rủi ro nghiêm trọng liên quan..." 
