 POD_malkavian_madness_network_borrow_skill: "Mạng lưới Điên loạn - Mượn Kỹ năng"
 POD_malkavian_madness_network_borrow_skill_desc: "Rút ra những mảnh suy nghĩ tưởng chừng ngẫu nhiên từ mạng lưới điên loạn để tăng cường một trong các kỹ năng của ngươi."
 POD_malkavian_madness_network_borrow_skill_ct: "Kỹ năng được chọn sẽ được củng cố bởi thứ tri thức kỳ lạ từ Mạng lưới Điên loạn... Nó đến từ đâu vậy?"
