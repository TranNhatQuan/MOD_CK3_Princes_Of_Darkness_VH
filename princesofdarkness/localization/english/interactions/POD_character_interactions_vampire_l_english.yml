 POD_project_negative_psychic_energy_interaction: "Phóng chiếu Năng lượng Tiêu cực"
 POD_project_negative_psychic_energy_interaction_desc: "Dồn hết mọi tội lỗi, bực dọc, giận dữ và cơn đói của ngươi vào linh hồn Hun của mình rồi phóng chiếu luồng năng lượng tâm linh tiêu cực này như một lưỡi dao đâm vào linh hồn của [recipient.GetFirstNamePossessive]." 
 POD_project_negative_psychic_energy.tt: "Nạn nhân sẽ chịu lượng căng thẳng bằng đúng lượng ngươi đang có, hoặc thậm chí còn tệ hơn."
 
