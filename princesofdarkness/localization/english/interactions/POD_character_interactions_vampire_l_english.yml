 activate_prowess_from_pain_loc: "Sức Mạnh Từ Cơn Đau"
 activate_toughness_ct: "Trong khi năng lực này được kích hoạt, nhân vật của ngươi được bảo vệ bởi sức mạnh siêu nhiên của Fortitude. Mỗi khi chịu sát thương, họ có cơ hội 'hấp thụ' sát thương đó. Nếu thành công, họ sẽ không phải chịu vết thương. Dù thành công hay thất bại, một lượt kiểm tra rouse (đói khát) sẽ được thực hiện để cấp năng lượng cho nỗ lực này."
 deactivate_toughness_ct: "Ngừng Kích Hoạt Sức Bền. Ngươi sẽ không còn được bảo vệ khỏi thương tích, nhưng cũng sẽ không mất thêm máu để duy trì dị năng này."
 activate_prowess_from_pain_ct: "Kích hoạt Sức Mạnh Từ Cơn Đau, rút sức mạnh từ chính vết thương của ngươi. Vết thương càng nghiêm trọng, sức mạnh càng lớn."
