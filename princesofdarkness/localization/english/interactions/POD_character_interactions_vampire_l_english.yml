 POD_gangrel_challenge_interaction_desc: "Khi hai Gangrel gặp nhau lần đầu tiên, hoặc sau một thời gian dài xa cách, họ thực hiện Nghi thức Địa vị, đấu tay đôi hoặc khoe khoang chiến tích để tìm hiểu lẫn nhau."
