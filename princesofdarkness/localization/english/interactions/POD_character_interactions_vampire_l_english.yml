 POD_create_bounty_interaction_ct: "Hợp đồng sẽ được đăng lên danh sách của Mạng lưới Dao găm, nghĩa là các sát thủ Banu Haqim có thể sẽ truy đuổi nó. Phần thưởng ngươi đưa ra càng cao thì khả năng họ cử một sát thủ lành nghề càng lớn."
