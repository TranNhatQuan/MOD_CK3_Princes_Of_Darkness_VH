 POD_cappadocian_send_advisor_interaction: "Cử Cố vấn"
 POD_cappadocian_send_advisor_interaction_desc: "Ngoài việc theo đuổi học thuật, người Cappadocian còn nổi tiếng vì phục vụ như những cố vấn cho các vị vua và hoàng thân. Biết được điều này, ngươi có thể gửi con của mình đến phục vụ trong triều đình của một lãnh chúa khác, thu về nhiều lợi ích."
 POD_cappadocian_send_advisor_interaction_ct: "Con cái của ngươi sẽ được gửi đến triều đình của [recipient.GetFirstNamePossessive] để làm cố vấn hoặc quan chấp chính. Nếu chứng tỏ được hiệu quả, ngươi sẽ nhận được lòng biết ơn của vị lãnh chúa ngoại bang đó và con ngươi thậm chí có thể học được điều gì đó. Tuy nhiên, nếu con ngươi thất bại, ngươi có thể phải gánh chịu hậu quả."
