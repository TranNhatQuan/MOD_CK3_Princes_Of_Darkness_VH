 ### ==========================================
 ### SỰ KIỆN TRAO ĐỔI TRI THỨC
 ### ==========================================

 ### Sự kiện 1: Sự Tiếp Cận
 POD_impundulu.2001.t: "Sự Trao Đổi của Người Chết"
 POD_impundulu.2001.desc: "Chúng ta ngồi đối diện nhau — hai học giả của mộ phần, chia cắt bởi dòng máu nhưng gắn kết bởi sự tò mò. Lời đề nghị đã được đưa ra. Giờ ta phải định ra giá cả.\n\nTa sẽ đề nghị điều gì để đổi lấy tri thức của họ về cái chết?"
 POD_impundulu.2001.a: "Vàng. Dung môi phổ quát."
 POD_impundulu.2001.b: "Một sự giúp đỡ. Ta còn nợ họ một ân tình."
 POD_impundulu.2001.c: "Bí mật của chính ta. Các nhánh Cenotaph và Haunting."
 POD_impundulu_exchange_offer_gold_tt: "Ngài sẽ trả 200 vàng cho tri thức gọi hồn."
 POD_impundulu_exchange_offer_favor_tt: "Ngài sẽ nợ họ một sự giúp đỡ (Kiềm chế) để đổi lấy tri thức."
 POD_impundulu_exchange_offer_secrets_tt: "Ngài sẽ chia sẻ bí mật thuật gọi hồn của Impundulu để đổi lại. Họ sẽ có quyền tiếp cận các nhánh Cenotaph/Haunting."

 ### Sự kiện 2: Kết Quả
 POD_impundulu.2002.t: "Tri Thức Đã Được Trao Đổi"
 POD_impundulu.2002.desc: "Cuộc trao đổi đã hoàn tất. Những đêm dài thảo luận cẩn trọng, các nghi thức được chia sẻ, và những buổi trình diễn được canh giữ kỹ càng đã đơm hoa kết trái. Ta đã thấy được cách tiếp cận của họ với thuật gọi hồn — một góc nhìn khác với ta, nhưng không thể chối bỏ sức mạnh của nó.\n\nMột nhánh mới của cái chết mở ra trước ta."
 POD_impundulu.2002.a: "Người chết nói bằng nhiều thứ tiếng. Giờ ta hiểu thêm một."

 ### Dự phòng nếu mọi mục tiêu hợp lệ đã chết trong thời gian chờ 1 năm
 POD_impundulu.2003.t: "Cuộc Tìm Kiếm Vô Ích"
 POD_impundulu.2003.desc: "Dù các trinh sát của ta đã lữ hành khắp nơi để tìm kiếm các học giả của mộ phần, họ cuối cùng cũng trở về tay không.\n\nNhững chuyên gia ban đầu tỏ ra quan tâm tới thư từ của ta đã chết, mất căn cứ hoạt động, hoặc tìm ra lý do khác để ngừng liên lạc với ta."
 POD_impundulu.2003.a: "Thật không may, nhưng ta có thể thử lại lúc khác."