l_english:
 POD_train_arts_interaction: "Huấn Luyện Pháp Nghệ"
 POD_train_arts_interaction_desc: "Dạy cho [recipient.GetFirstName] một trong các Pháp Nghệ của ngươi"

 POD_art_shapeshift_interaction: "Biến Hình"
 POD_art_shapeshift_interaction_desc: "Dùng Khí của ngươi để biến đổi hình dạng."
 POD_art_shapeshift_interaction_desc_demonic_feature: "Phô Bày Nét Ma Quái"
 POD_art_shapeshift_interaction_desc_divine_bird: "Chim Thần"
 POD_art_shapeshift_interaction_desc_the_shintai_of_jade: "Shintai của Ngọc"

 POD_demon_arts_infernal_might_interaction: "Uy Lực Địa Ngục"
 POD_demon_arts_infernal_might_interaction_desc: "Đỉnh cao của Pháp Nghệ Ma Quyền, thân thể ngươi trở thành vũ khí được tiếp sức bởi khổ đau và thống khổ của chính mình, đảm bảo không gì có thể cản đường ngươi."

 POD_demon_arts_infernal_speed_interaction: "Tốc Độ Địa Ngục"
 POD_demon_arts_infernal_speed_interaction_desc: "Đỉnh cao của Pháp Nghệ Hắc Phong, tốc độ ngươi giờ vượt qua tốc độ âm thanh, đảm bảo không ai có thể chạy thoát khỏi ngươi."

 POD_demon_arts_infernal_fortitude_interaction: "Sức Bền Địa Ngục"
 POD_demon_arts_infernal_fortitude_interaction_desc: "Đỉnh cao của Pháp Nghệ Thiết Sơn, da thịt ngươi trở thành bức tường sắt bất khả xâm phạm, đảm bảo không gì có thể vượt qua ngươi."

 POD_demon_arts_infernal_glory_interaction: "Vinh Quang Địa Ngục"
 POD_demon_arts_infernal_glory_interaction_desc: "Đỉnh cao của Pháp Nghệ Ma Bào, ngươi trở thành hậu duệ đích thực của Vạn Chiến Binh, đảm bảo chỉ một cái chạm của ngươi cũng gây ra thống khổ."

 POD_soul_arts_crippling_sorrows_interaction: "Nỗi Đau Tê Liệt"
 POD_soul_arts_crippling_sorrows_interaction_desc: "Nhắc [recipient.GetFirstName] nhớ về những gì họ đã mất."

 POD_soul_arts_like_a_whisp_interaction: "Như Một Làn Khói"
 POD_soul_arts_like_a_whisp_interaction_desc: "Biến mất như một làn khói khỏi tâm trí những kẻ âm mưu."
 POD_soul_arts_like_a_whisp_interaction_tt: "Mọi [scheme|E] nhằm vào ngươi sẽ bị hủy bỏ."

 POD_soul_arts_world_of_quiet_interaction: "Thế Giới Tĩnh Lặng"
 POD_soul_arts_world_of_quiet_interaction_desc: "Lời thì thầm trở thành âm lượng bình thường, gây khó khăn lớn cho các nỗ lực ngoại giao."

 POD_soul_arts_graveyard_song_interaction: "Khúc Ca Nghĩa Địa"
 POD_soul_arts_graveyard_song_interaction_desc: "Tạm thời hợp nhất [Glossary('Skinlands','game_concept_skinlands_desc')] và [UmbraGlossaryLocalized('shadowlands','Âm Phủ')], gây hỗn loạn trong khu vực."
 POD_soul_arts_graveyard_song_interaction_tt: "Mọi [county|E] [de_jure|E] trong [THIS.Title.GetName] sẽ nhận [GetModifier('soul_arts_graveyard_song_modifier').GetNameWithTooltip] trong 5 năm"

 POD_soul_arts_mortal_perfection_interaction: "Sự Hoàn Hảo Của Người Trần"
 POD_soul_arts_mortal_perfection_interaction_desc: "Hiện ra hoàn hảo nhất mức bất kỳ kẻ nhìn vào có thể hình dung."

 POD_soul_arts_the_scent_of_heavens_favor_interaction: "Hương Vị Ân Sủng Của Thiên Đình"
 POD_soul_arts_the_scent_of_heavens_favor_interaction_desc: "Tìm một người trần có những đặc điểm cụ thể."
 POD_soul_arts_the_scent_of_heavens_favor_interaction_tt: "Ngươi sẽ có thể chọn [skills|E] của người trần mà ngươi đang tìm kiếm."

 POD_soul_arts_waywards_brand_interaction: "Dấu Ấn Kẻ Lạc Lối"
 POD_soul_arts_waywards_brand_interaction_desc: "Đánh dấu [recipient.GetFirstName] là kẻ bị các thần khinh miệt."

 POD_soul_arts_i_am_your_doom_interaction: "Ta Là Định Số Của Ngươi"
 POD_soul_arts_i_am_your_doom_interaction_desc: "Đánh dấu [recipient.GetFirstName] là kẻ thù của các thần."

 POD_soul_arts_fate_of_houses_interaction: "Định Số Của Các Gia Tộc"
 POD_soul_arts_fate_of_houses_interaction_desc: "Định hình tương lai của toàn bộ [court|E] của [recipient.GetFirstName]."

 POD_soul_arts_goblin_cat_interaction: "Mèo Yêu Tinh"
 POD_soul_arts_goblin_cat_interaction_desc: "Trói buộc một con vật làm linh thú của ngươi"

 POD_soul_arts_read_the_inner_darkness_interaction: "Đọc Bóng Tối Nội Tâm"
 POD_soul_arts_read_the_inner_darkness_interaction_desc: "Đọc thấu những bí mật đen tối nhất của [recipient.GetFirstName]."
 POD_soul_arts_read_the_inner_darkness_interaction_tt: "Phát hiện một [secret|E] ngẫu nhiên của [recipient.GetFirstName]"

 POD_soul_arts_tears_of_hell_interaction: "Nước Mắt Địa Ngục"
 POD_soul_arts_tears_of_hell_interaction_desc: "Cho [recipient.GetFirstName] thấy ý nghĩa của tội lỗi."
 POD_soul_arts_tears_of_hell_interaction_tt: "[recipient.GetFirstName] có [recipient.MakeScope.ScriptValue('POD_num_sinful_traits')] [traits|E] [sinful|E]. Mỗi [trait|E] [sinful|E] sẽ gây ra 25 [stress|E]"

 POD_soul_arts_shadow_self_interaction: "Bản Ngã Bóng Tối"
 POD_soul_arts_shadow_self_interaction_desc: "Chia bản thân ngươi thành P'o và Hun, bản chất thấp hèn và bản chất siêu thoát của ngươi."
 POD_soul_arts_shadow_self_interaction_tt: "Ngươi sẽ tạo ra Bản Ngã Bóng Tối của riêng mình"

 POD_soul_arts_bloody_forseight_interaction: "Điềm Báo Đẫm Máu"
 POD_soul_arts_bloody_forseight_interaction_desc: "Qua khổ đau, hé lộ tương lai của chính ngươi."

 POD_soul_arts_agony_liberation_interaction: "Giải Thoát Qua Thống Khổ"
 POD_soul_arts_agony_liberation_interaction_desc: "Thay đổi bản thân bằng cách dùng sức mạnh của khổ đau."
 POD_soul_arts_agony_liberation_interaction_tt: "Việc này sẽ mở ra một trình đơn cho phép ngươi thay đổi tính cách của mình."

 POD_soul_arts_the_final_diadem_interaction: "Vương Miện Cuối Cùng"
 POD_soul_arts_the_final_diadem_interaction_desc: "Đẩy [recipient.GetFirstName] vào một Địa Ngục do chính ngươi tạo ra."

 POD_soul_arts_crack_the_tortoise_shell_interaction: "Nứt Vỡ Mai Rùa"
 POD_soul_arts_crack_the_tortoise_shell_interaction_desc: "Làm rung chuyển cốt lõi tồn tại của [recipient.GetFirstNamePossessive]."

 POD_soul_arts_dragon_medicine_interaction: "Dược Long"
 POD_soul_arts_dragon_medicine_interaction_desc: "Dùng sự tinh thông cả bốn đức hạnh của ngươi để tịnh hóa thân thể của [recipient.GetFirstNamePossessive]."

 POD_soul_arts_soul_nursery_interaction: "Nôi Linh Hồn"
 POD_soul_arts_soul_nursery_interaction_desc: "Đưa linh hồn của [recipient.GetFirstNamePossessive] đến cội nguồn vũ trụ, giữ nó lại đó để được biến hóa."

 POD_soul_arts_flowing_canal_of_hell_interaction: "Dòng Chảy Kênh Địa Ngục"
 POD_soul_arts_flowing_canal_of_hell_interaction_desc: "Nỗi đau nội tâm của ngươi, một lần nữa tiếp thêm sức mạnh cho ngươi."

 POD_soul_arts_infernal_road_interaction: "Con Đường Địa Ngục"
 POD_soul_arts_infernal_road_interaction_desc: "Dùng những con đường địa ngục cổ xưa để di chuyển ngay lập tức trong Trung Nguyên."

 POD_soul_arts_breaking_the_dragons_neck_interaction: "Bẻ Cổ Rồng"
 POD_soul_arts_breaking_the_dragons_neck_interaction_desc: "Làm ô nhiễm những gì thiêng liêng."
 POD_soul_arts_breaking_the_dragons_neck_interaction_tt: "Ngươi phải sở hữu ít nhất một Tổ Rồng trong lãnh địa của mình."

 POD_chi_arts_soul_bridge_interaction: "Cầu Nối Linh Hồn"
 POD_chi_arts_soul_bridge_interaction_desc: "Kết nối linh hồn ngươi với [recipient.GetFirstNamePossessive]."
 POD_chi_arts_soul_bridge_interaction_force: "Cưỡng Ép Kết Nối"

 POD_chi_arts_sapping_the_dragon_nest_interaction: "Rút Cạn Tổ Rồng"
 POD_chi_arts_sapping_the_dragon_nest_interaction_desc: "Rút cạn sức mạnh của một Tổ Rồng cho bản thân ngươi."
 POD_chi_arts_sapping_the_dragon_nest_interaction_tt: "Ngươi phải sở hữu ít nhất một Tổ Rồng trong lãnh địa của mình."

 POD_chi_arts_accentuate_chi_interaction: "Tăng Cường Khí"
 POD_chi_arts_accentuate_chi_interaction_desc: "Sửa chữa bất kỳ sự bất thường trong luồng chảy của Khí."

 POD_chi_arts_joss_weaving_interaction: "Dệt Joss"
 POD_chi_arts_joss_weaving_interaction_desc: "Kéo những sợi chỉ định mệnh gắn liền với [recipient.GetFirstName]."
 POD_chi_arts_joss_weaving_interaction_give: "Ban Joss"
 POD_chi_arts_joss_weaving_interaction_take: "Lấy Joss"

 POD_chi_arts_realigning_the_stars_interaction: "Sắp Xếp Lại Các Vì Tinh Tú"
 POD_chi_arts_realigning_the_stars_interaction_desc: "Sắp xếp lại các vì tinh tú của [recipient.GetFirstName]."
 POD_chi_arts_realigning_the_stars_interaction_tt: "Nếu không có [GetPerk('chi_arts_reweaving_the_stars_perk').GetName(GetPlayer)], ngươi không thể dùng tương tác này khi người nhận đã có [modifier|E] lá số tử vi"

 POD_chi_arts_cursing_the_star_interaction: "Nguyền Rủa Các Vì Tinh Tú"
 POD_chi_arts_cursing_the_star_interaction_desc: "Nguyền rủa các vì tinh tú của [recipient.GetFirstName], gây ra những tai nạn xảy đến."

 POD_shintai_flow_like_blood_interaction: "Chảy Như Máu"
 POD_shintai_flow_like_blood_interaction_desc: "Thoát khỏi mọi ngục tù như thể ngươi được tạo thành từ máu."

 POD_shintai_your_god_beckons_interaction: "Thần Của Ngươi Vẫy Gọi"
 POD_shintai_your_god_beckons_interaction_desc: "Triệu hồi tín đồ trung thành của ngươi đến [court|E] của ngươi."

 POD_shintai_excellent_corpse_interaction: "Tử Thi Tuyệt Hảo"
 POD_shintai_excellent_corpse_interaction_desc: "Điều khiển tử thi của ngươi."
 POD_shintai_excellent_corpse_interaction_increase: "Làm sẹo tử thi của ngươi"
 POD_shintai_excellent_corpse_interaction_decrease: "Làm sạch tử thi của ngươi"

 POD_shintai_flowers_of_flesh_interaction: "Những Bông Hoa Thịt"
 POD_shintai_flowers_of_flesh_interaction_desc: "Da thịt sẽ trở thành tấm toan của ngươi."
 POD_shintai_flowers_of_flesh_interaction_tt: "Mở ra một cửa sổ mới để thay đổi [traits|E] thể chất của [recipient.GetFirstName]"

 POD_shintai_the_root_of_illusion_interaction: "Cội Rễ Của Ảo Ảnh"
 POD_shintai_the_root_of_illusion_interaction_desc: "Chẳng có thực tại nào cả, vậy hãy cùng diễn màn kịch vĩ đại nhất."

 POD_shintai_rakshasa_blade_interaction: "Lưỡi Kiếm Rakshasa"
 POD_shintai_rakshasa_blade_interaction_desc: "Chúng không thể chối bỏ ta thêm được nữa!"

 POD_shintai_touch_of_the_stranger_inflict_interaction: "Cái Chạm Của Kẻ Lạ: Gieo Rắc"
 POD_shintai_touch_of_the_stranger_inflict_interaction_desc: "Chỉ bằng một cái chạm, gieo rắc bất kỳ bệnh dịch nào ngươi chọn."

 POD_shintai_touch_of_the_stranger_heal_interaction: "Cái Chạm Của Kẻ Lạ: Chữa Lành"
 POD_shintai_touch_of_the_stranger_heal_interaction_desc: "Chỉ bằng một cái chạm, chữa lành bất kỳ bệnh dịch nào ngươi chọn."

 POD_shintai_fevers_purity_interaction: "Sự Thanh Khiết Của Cơn Sốt"
 POD_shintai_fevers_purity_interaction_desc: "Để cơn sốt thiêu đốt tâm trí ngươi, để lại sự an bình nội tâm phía sau."

 POD_shintai_wild_eyed_bulwark_interaction: "Thành Trì Mắt Cuồng Dại"
 POD_shintai_wild_eyed_bulwark_interaction_desc: "Để cơn sốt thiêu đốt thân thể ngươi, tịnh hóa mọi tạp chất khi nó lan tỏa."

 POD_shintai_the_shintai_of_poxes_interaction: "Shintai Của Đậu Mùa"
 POD_shintai_the_shintai_of_poxes_interaction_desc: "Giải phóng một dịch bệnh lên nơi ở của [recipient.GetFirstNamePossessive]."

 POD_shintai_arms_of_the_sea_interaction: "Những Cánh Tay Của Biển Cả"
 POD_shintai_arms_of_the_sea_interaction_desc: "Thông thạo gió, biển và mây."
 POD_shintai_arms_of_the_sea_interaction_options_heading: "Ta nên triệu gọi thảm họa thiên nhiên nào?"
