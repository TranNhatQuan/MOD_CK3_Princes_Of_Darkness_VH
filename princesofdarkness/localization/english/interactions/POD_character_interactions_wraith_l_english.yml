l_english:
 
 # Necromancer #

 POD_weaken_fetter_interaction: "Làm Suy Yếu [Fetter|E]"
 POD_weaken_fetter_interaction_desc: "Trói buộc một $POD_splat_wraith$ không phải chuyện dễ dàng, muốn bắt đầu thì trước tiên cần một kẽ hở. Vậy sao không tự tạo ra một cái?"
 POD_weaken_fetter_interaction_need_fetter: "Trước hết phải có một [Fetter|E] để làm suy yếu. Lưu ý rằng không phải [Fetters|E] nào cũng có thể bị làm suy yếu."
 POD_weaken_fetter_interaction.success: "Sự can thiệp của ngươi sẽ thành công!"
 POD_weaken_fetter_interaction.failure: "Sự can thiệp của ngươi sẽ thất bại!"
 POD_weaken_fetter_interaction_effect: "Một [Fetter|E] ngẫu nhiên sẽ bị làm suy yếu, thậm chí bị phá hủy."
 
 POD_bind_interaction: "Trói Buộc Oan Hồn"
 POD_bind_interaction_desc: "Trói buộc một thực thể bằng pháp thuật hắc ám và ý chí thuần khiết. Chúng khó lòng vui vẻ khi bị trói buộc, và hẳn sẽ oán hận ngươi sâu sắc vì điều đó. Lặp lại việc này nhiều lần có thể củng cố sự trói buộc."
 POD_bind_interaction_limit: "Ngươi đã đạt giới hạn số nhân vật bị trói buộc rồi! (1 cho mỗi [learning_i]#V 8#! [learning|E] cộng thêm mọi phần thưởng từ nguồn khác)"
 POD_bind_interaction_free_fetter: "Phải có một kẽ hở để bắt đầu nghi lễ, chẳng hạn như một [Fetter|E] còn trống chưa được phân bổ."
 POD_bind_interaction.success: "Sự trói buộc của ngươi sẽ thành công!"
 POD_bind_interaction.failure: "Sự trói buộc của ngươi sẽ thất bại!"
 POD_bind_interaction_hook: "#i Sức mạnh của [hook|E] phụ thuộc vào số điểm [Fetter|E] mà sự trói buộc của ngươi có được, tối đa là 10#!"
 POD_bind_interaction_level: "#i Mỗi cấp độ trói buộc của ngươi làm tăng ích lợi của $POD_splat_wraith$ này, như thể chúng được +1 vào mọi [skills|E]#!"
 
 POD_convert_to_wraith_interaction: "Sát Hại Theo Nghi Lễ"
 POD_convert_to_wraith_interaction_desc: "Vấy bẩn linh hồn của người này rồi giết chết họ bằng thuật huyền bí cổ xưa để đảm bảo họ sẽ trở lại làm một oan hồn trong triều đình của ngươi."
 convert_to_wraith_desc_general: "Tạo ra một oan hồn"
 
 POD_manipulate_bound_wraith_interaction: "Điều Khiển Oan Hồn Bị Trói Buộc"
 POD_manipulate_bound_wraith_interaction_desc: "Điều khiển những oan hồn bị ngươi trói buộc."
 recipient_secondary_POD_manipulate_bound_wraith_interaction: "Oan Hồn"
 command_wraith_interaction.recall: "Triệu Hồi Về"
 command_wraith_interaction.release: "Cởi Trói"
 POD_not_in_possession: "#bold Không#! đang chiếm hữu bất kỳ nhân vật nào."
 
 POD_command_wraith_recall_interaction: "Triệu Hồi Về"
 POD_command_wraith_recall_interaction_desc: "[recipient.GetTitledFirstName] sẽ trở về triều đình của ngươi."
 POD_command_wraith_recall_interaction_extra_icon: "$hook_extra_icon$"
 
 POD_summon_wraith_on_death_interaction: "Triệu Hồi Oan Hồn Khi Chết"
 POD_summon_wraith_on_death_interaction_desc: "Nếu [recipient.GetFirstNamePossessive] chết trong vòng 10 năm, hãy triệu hồi [recipient.GetHerHim] về triều đình của ngươi khi [recipient.GetSheHe] chết, biến thành một [GetTrait('wraith').GetName( GetNullCharacter )] trong quá trình đó."
 marked_wraith_has_arrive: "Oan hồn được đánh dấu đã đến"

 POD_summon_wraith_interaction: "Triệu Hồi Oan Hồn"
 POD_summon_wraith_interaction_desc: "Tìm kiếm trong lãnh thổ của ngươi một [GetTrait('wraith').GetName( GetNullCharacter )] dễ bị tổn thương trước hành động của ngươi."
 POD_summon_wraith_interaction_effect: "Trong khoảng 10 ngày, sẽ xuất hiện một oan hồn [courtier|E] mới trong [court|E] của ngươi."
 
 POD_reshape_the_lost_soul_interaction: "Định Hình Lại Linh Hồn Lạc Lối"
 POD_reshape_the_lost_soul_interaction_desc: "Thay đổi Đam Mê của [recipient.GetFirstName]."
 POD_reshape_the_lost_soul_interaction_increase: "Tăng"
 POD_reshape_the_lost_soul_interaction_decrease: "Giảm"
 
 POD_calm_local_spirit_interaction: "Trấn An Linh Hồn Địa Phương"
 POD_calm_local_spirit_interaction_desc: "Trò chuyện với một linh hồn tại nơi ở của ngươi và cố gắng giành được thiện cảm từ chúng."
 
 POD_send_to_skinland_character_interaction: "Gọi Về Skinlands"
 POD_send_to_skinland_character_interaction_desc: "Gọi [recipient.GetFirstName] về [Glossary('Skinlands','game_concept_skinlands_desc')] để ngươi có thể gửi mệnh lệnh cho [recipient.GetHerHim]."
 POD_send_to_shadowland_character_interaction: "Gửi Đến Shadowlands"
 POD_send_to_shadowland_character_interaction_desc: "Gửi [recipient.GetFirstName] đến [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] để ngươi có thể ngừng phải trả ý chí hằng năm nhằm duy trì [recipient.GetHerHim] ở lại thế giới người phàm."
 POD_send_to_dark_kingdom_character_interaction: "Gửi Đến Vương Quốc Bóng Tối"
 POD_send_to_dark_kingdom_character_interaction_desc: "Gửi [recipient.GetFirstName] đến bất kỳ [Glossary('Dark Kingdom','game_concept_dark_kingdom_desc')] nào để [recipient.GetFirstName] có thể học [arcanoi_lifestyle|E] mới (với nguy cơ trở thành một [GetTrait('spectre').GetName( GetNullCharacter )])."
 POD_send_to_dark_kingdom_character_interaction.random.tt: "Vì ngươi không có đủ hiểu biết về [Glossary('Dark Kingdom','game_concept_dark_kingdom_desc')] để biết nên gửi đi đâu, [recipient.GetFirstName] sẽ có nguy cơ rất cao bị lạc lối và trở thành một [GetTrait('spectre').GetName( GetNullCharacter )]."
 POD_send_to_yomi_wan_character_interaction: "Gửi Đến Yomi"
 POD_send_to_yomi_wan_character_interaction_desc: "Gửi [recipient.GetFirstName] đến [UmbraGlossary('yomi_wan')] để [recipient.GetFirstName] có thể trở về dưới dạng [GetTrait('kueijin').GetName( GetPlayer )]."
 POD_send_to_labyrinth_character_interaction: "Gửi Đến Labyrinth"
 POD_send_to_labyrinth_character_interaction_desc: "Gửi [recipient.GetFirstName] đến [UmbraGlossary('pod_realm_labyrinth')] để [recipient.GetFirstName] có thể trở về dưới dạng [GetModifier('doomslayer_modifier').GetNameWithTooltip]."
 
 POD_banish_wraith_interaction: "Trục Xuất Oan Hồn"
 POD_banish_wraith_interaction_desc: "[POD_banish|E] [recipient.GetFirstName] đến một [Glossary('Dark Kingdom','game_concept_dark_kingdom_desc')]."
 
 POD_offer_seeds_of_pomegranate_interaction: "Dâng Hạt Lựu"
 POD_offer_seeds_of_pomegranate_interaction_desc: "Biến [recipient.GetFirstName] thành một [GetTrait('risen').GetName( GetPlayer )]."
 
 # Arcanoi #

 POD_possess_interaction: "Chiếm Hữu"
 POD_possess_interaction_desc: "Chiếm hữu nhân vật này, giành quyền kiểm soát hành động của [recipient.GetHerHis] và truyền cho họ một phần sức mạnh của ngươi. Sử dụng nhiều lần sẽ làm sâu sắc thêm mức độ kiểm soát và củng cố sức mạnh mà ngươi ban cho mục tiêu."
 POD_command_wraith_possess_interaction: "Chiếm Hữu #weak (Điều Khiển Oan Hồn)#!"
 POD_command_wraith_possess_interaction_desc: "Ra lệnh cho một trong những oan hồn bị ngươi trói buộc chiếm hữu nhân vật này, giành quyền kiểm soát hành động của [recipient.GetHerHis] và truyền cho họ một phần sức mạnh của oan hồn đó. Sử dụng nhiều lần sẽ làm sâu sắc thêm mức độ kiểm soát và củng cố sức mạnh mà oan hồn ban cho mục tiêu."
 actor_secondary_POD_command_wraith_possess_interaction: "Oan Hồn"
 POD_command_wraith_possess_interaction_extra_icon: "$hook_extra_icon$"
 
 POD_depossess_interaction: "Chấm Dứt Chiếm Hữu"
 POD_depossess_interaction_desc: "Rời khỏi thân xác này để theo đuổi một thân xác khác, hoặc đơn thuần là để được tự do."
 POD_command_wraith_depossess_interaction: "Chấm dứt chiếm hữu #weak (Điều Khiển Oan Hồn)#!"
 POD_command_wraith_depossess_interaction_desc: "Ra lệnh cho các oan hồn đang chiếm hữu rời khỏi thân xác này để theo đuổi một thân xác khác, hoặc đơn thuần là để được tự do."
