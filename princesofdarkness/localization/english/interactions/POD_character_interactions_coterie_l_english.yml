l_english:
 POD_create_coterie_interaction: "Lập một [GetPlayer.Custom('PODCoterieNoTooltip')]"
 POD_create_coterie_interaction_desc: "[GetPlayer.GetShortUINameNoTooltip|U] sẽ trở thành người sáng lập một [GetPlayer.Custom('PODCoterie')] mới."
 POD_create_coterie_interaction_effect: "#V [actor.GetFirstNameNoTooltip]#! sẽ trở thành người sáng lập một [GetPlayer.Custom('PODCoterie')] mới."
 POD_create_coterie_interaction_effect2: "Ngài sẽ có thể chọn tên cho nó."
 
 POD_invite_to_coterie_interaction: "Mời vào [GetPlayer.Custom('PODGetCoterieName')]"
 POD_invite_to_coterie_multiplayer_interaction: "$POD_invite_to_coterie_interaction$"
 POD_invite_to_coterie_interaction_desc: "[recipient.GetShortUINameNoTooltip] sẽ trở thành một thành viên trong [GetPlayer.Custom('PODCoterie')] của ngài."
 POD_invite_to_coterie_interaction_effect: "[recipient.GetShortUIName] sẽ trở thành một thành viên trong [GetPlayer.Custom('PODCoterie')] của ngài."
 POD_at_coterie_size_cap: "[GetPlayer.Custom('PODCoterie')] của ngài đã có [EmptyScope.ScriptValue('coterie_max_size')] thành viên"
 POD_coterie_requirement_same_realm: "[recipient.GetShortUIName] phải thuộc cùng [realm|E] với ngài, hoặc là hôn phối của ngài"
 POD_recipient_already_has_coterie: "[recipient.GetShortUIName] đã là thành viên của #bold [recipient.Custom('PODGetCoterieName')]#!"
 POD_invite_to_coterie_interaction_mortal: "Ngài không thể mời $POD_splat_mortal_plural$ vào [GetPlayer.Custom('PODCoterie')] của mình"
 POD_invite_to_coterie_interaction_mortal_cultist: "Ngài không thể mời $POD_splat_mortal_plural$ vào [GetPlayer.Custom('PODCoterie')] của mình, trừ khi họ là tín đồ sùng bái của ngài"
 POD_invite_to_coterie_interaction_mortal_neteru: "Ngài không thể mời $POD_splat_mortal_plural$ vào [GetPlayer.Custom('PODCoterie')] của mình, trừ khi họ là [neteru|E] của ngài"
 POD_invite_to_coterie_interaction_packbond: "Hãy nhớ rằng $glossary_fera$ gắn kết với [GetPlayer.Custom('PODCoterie')] của mình suốt đời, vì vậy sau này ngài sẽ không thể đuổi [recipient.GetHerHim] ra được."
 POD_invite_to_coterie_interaction_rivalry: "#help Tư cách thành viên [GetPlayer.Custom('PODCoterie')] được xem là một sự cam kết. Sau này ngài sẽ có thể đuổi [recipient.GetShortUIName] ra, nhưng nếu làm vậy, [recipient.GetSheHe] sẽ trở thành [rival|E] của ngài.#!"
 
 POD_kick_from_coterie_interaction: "Đuổi khỏi [GetPlayer.Custom('PODGetCoterieName')]"
 POD_kick_from_coterie_interaction_desc: "[recipient.GetShortUINameNoTooltip] sẽ không còn là thành viên trong [GetPlayer.Custom('PODCoterie')] của ngài nữa."
 POD_kick_from_coterie_interaction_packbond: "$glossary_fera$ không thể đuổi thành viên khác ra vì họ gắn kết với [GetPlayer.Custom('PODCoterie')] của mình suốt đời"
 
 POD_disband_coterie_interaction: "Giải tán [GetPlayer.Custom('PODGetCoterieName')]"
 POD_disband_coterie_interaction_desc: "Giải tán [GetPlayer.Custom('PODCoterie')] của ngài."
 POD_disband_coterie_interaction_effect: "[GetPlayer.Custom('PODCoterie')] của ngài, $POD_player_coterie$, sẽ bị giải tán."
 POD_disband_coterie_interaction_packbond: "$glossary_fera$ không thể giải tán [GetPlayer.Custom('PODCoterie')] của mình trừ khi không còn thành viên nào khác"