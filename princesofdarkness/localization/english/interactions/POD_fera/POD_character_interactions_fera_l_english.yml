#### Common Interactions ####
 POD_fera_shapeshift_interaction: "Biến Hình"
 POD_fera_shapeshift_interaction_desc: "Dùng $POD_energy_gnosis$ để biến đổi hình dạng của ngươi."
 POD_fera_shapeshift_interaction_options_heading: "Ta nên biến thành hình dạng nào?"
 POD_fera_shapeshift_interaction_homid: "Trở về hình dạng Homid"
 POD_fera_shapeshift_interaction_beastform: "[GetPlayer.Custom('PODFeraBeastform')]"
 POD_fera_shapeshift_interaction_warform: "[GetPlayer.Custom('PODFeraWarform')]"
 POD_fera_shapeshift_interaction_primalhumanform: "[GetPlayer.Custom('PODFeraPrimalHumanform')]"
 POD_fera_shapeshift_interaction_primalbeastform: "[GetPlayer.Custom('PODFeraPrimalBeastform')]"
 POD_shapeshift_form_totem_form: "Hình dạng Vật Tổ"



 POD_train_gift_interaction: "Huấn Luyện Thiên Phú"
 POD_train_gift_interaction_desc: "Truyền dạy cho [recipient.GetFirstName] một trong các Thiên Phú của ngươi"



 POD_fera_weather_magic_interaction: "Phép Thuật Thời Tiết"
 POD_fera_weather_magic_interaction_desc: "Giáng một thiên tai xuống vương quốc của [recipient.GetFirstNamePossessive]."
 POD_fera_weather_magic_interaction_options_heading: "Ta nên triệu hồi hiểm họa thiên nhiên nào?"




 POD_spawn_flaying_plague_interaction: "Giải Phóng Ôn Dịch Lột Da"
 POD_spawn_flaying_plague_interaction_desc: "Ngươi có trong tay thứ Ôn Dịch Lột Da khủng khiếp. Với vài nguyên liệu đặc biệt cho nghi lễ, ngươi sẽ có thể giải phóng nó lên đám sói không hề hay biết một lần nữa."
 POD_spawn_flaying_plague_interaction.tt: "Gieo rắc Ôn Dịch Lột Da lên lãnh địa của [recipient.GetFirstNamePossessive]."
 POD_spawn_flaying_plague_actor_toast: "Ôn Dịch Lột Da đang hoành hành khắp lãnh địa của [recipient.GetFirstNamePossessive]."
 POD_spawn_flaying_plague_actor_toast.desc: "Mong rằng ngươi sẽ không phải hối hận vì điều này"
 POD_spawn_flaying_plague_failure_toast: "Ngươi đã thất bại trong việc lan truyền Ôn Dịch Lột Da tại lãnh địa của [recipient.GetFirstNamePossessive]"
 POD_spawn_flaying_plague_failure_toast.desc: "Nhưng tương lai sẽ còn nhiều cơ hội khác..."
 POD_spawn_flaying_plague_interaction_success: "Ôn Dịch Lột Da sẽ bùng phát tại lãnh địa của [recipient.GetFirstNamePossessive] và lan rộng dần theo thời gian."
 POD_spawn_flaying_plague_interaction_failure: "Ôn Dịch Lột Da đã không thể bén rễ."
 POD_inflict_flaying_plague_interaction: "Gieo Rắc Ôn Dịch Lột Da"
 POD_inflict_flaying_plague_interaction_desc: "Lây nhiễm Ôn Dịch Lột Da cho [recipient.GetFirstName], làm suy yếu khả năng phòng vệ của họ. Nếu họ có thể trở thành một [GetTrait('abomination').GetName(GetNullCharacter)], điều này sẽ đảm bảo $pod_Embrace$ thành công."


###Planetary Gifts interactions
 POD_ebon_binding_interaction: "Xiềng Xích Bóng Tối"
 POD_ebon_binding_interaction_desc: "Trói buộc một hình phạt thích đáng lên [recipient.GetFirstName]. [recipient.GetFirstName] sẽ chịu cơn đau tê liệt mỗi khi [recipient.GetSheHe] nghĩ đến việc buông mình theo hành động bị cấm đoán."
 ebon_binding_modifier: "Xiềng Xích Bóng Tối"
 
 
 POD_savagery_of_the_taloned_hunter_interaction: "Man Rợ Của Kẻ Săn Mồi Móng Vuốt"
 POD_savagery_of_the_taloned_hunter_interaction_desc: "Tiêu 1 $POD_energy_gnosis$ và ý chí để nhận 2 $POD_energy_gnosis$."
 
 POD_burden_of_knowledge_interaction: "Gánh Nặng Tri Thức"
 POD_burden_of_knowledge_interaction_desc: "Khiến [recipient.GetFirstName] nhận [GetModifier('murderous_frenzy_modifier').GetNameWithTooltip], [GetModifier('change_for_better_modifier').GetNameWithTooltip] hoặc tự sát"
 
 POD_essential_transformation_interaction: "Biến Đổi Cốt Lõi"
 POD_essential_transformation_interaction_desc: "Tăng vết thương để nhận $POD_energy_gnosis$."
