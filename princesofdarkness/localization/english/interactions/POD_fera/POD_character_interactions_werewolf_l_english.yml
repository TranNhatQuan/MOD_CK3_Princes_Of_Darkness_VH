 pack_tactics_modifier: "Chiến Thuật Bầy Đàn"
 pack_tactics_modifier_desc: "Trong mắt người ngoài, bầy của ngươi di chuyển như một."
 strength_will_modifier: "Sức Mạnh Ý Chí"
 strength_will_modifier_desc: "Một sức mạnh không gì cản nổi, một bầy đoàn kết vì một mục đích duy nhất: hủy diệt kẻ thù của họ."