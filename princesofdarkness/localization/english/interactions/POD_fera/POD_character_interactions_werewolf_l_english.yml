l_english:

 POD_divide_interaction: "Chia Rẽ"
 POD_divide_interaction_desc: "Ngươi sẽ gieo mầm bất hòa trong vương quốc này, khiến các chư hầu bất mãn với chúa của mình."
 divide_modifier: "Chia Rẽ"
 divide_modifier_desc: "Mọi điều ngươi làm hay nói đều dường như bị các chư hầu hiểu lầm. Như thể một thế lực xấu xa đã bóp méo lời nói của ngươi..."

 POD_inspiration_interaction: "Cảm Hứng"
 POD_inspiration_interaction_desc: "Là Alpha của bầy này, bổn phận của ngươi là phô bày sức mạnh để khích lệ những kẻ theo sau."
 werewolf_inspiration_modifier: "Cảm Hứng"
 werewolf_inspiration_modifier_desc: "Khi có Alpha ở gần, sức mạnh chiến đấu của ngươi được tăng cường."

 POD_primal_song_interaction: "Khúc Ca Nguyên Thủy"
 POD_primal_song_interaction_desc: "Ngươi sẽ chọn một trong các khúc ca mà ngươi biết, nhận các loại phần thưởng khác nhau tùy theo lựa chọn."
 song_siren_modifier: "Khúc Ca Nàng Tiên Cá"
 song_siren_modifier_desc: "Bằng cách nghe theo tiếng gọi, chúng ta trở nên mạnh mẽ hơn."


 POD_break_the_bonds_interaction: "Phá Vỡ Ràng Buộc"
 POD_break_the_bonds_interaction_desc: "Dùng gnosis để buộc [recipient.GetFirstName] tiêu một hook mà [recipient.GetSheHe] có với ngươi."

 POD_shared_strength_interaction: "Chia Sẻ Sức Mạnh"
 POD_shared_strength_interaction_desc: "Truyền kỹ năng của ngươi cho [recipient.GetFirstName]."
 shared_strength_diplomacy_gain_modifier: "Chia Sẻ Sức Mạnh: Ngoại Giao Tăng"
 shared_strength_diplomacy_loss_modifier: "Chia Sẻ Sức Mạnh: Ngoại Giao Giảm"
 shared_strength_martial_gain_modifier: "Chia Sẻ Sức Mạnh: Chỉ Huy Tăng"
 shared_strength_martial_loss_modifier: "Chia Sẻ Sức Mạnh: Chỉ Huy Giảm"
 shared_strength_stewardship_gain_modifier: "Chia Sẻ Sức Mạnh: Quản Lý Tăng"
 shared_strength_stewardship_loss_modifier: "Chia Sẻ Sức Mạnh: Quản Lý Giảm"
 shared_strength_intrigue_gain_modifier: "Chia Sẻ Sức Mạnh: Mưu Mô Tăng"
 shared_strength_intrigue_loss_modifier: "Chia Sẻ Sức Mạnh: Mưu Mô Giảm"
 shared_strength_learning_gain_modifier: "Chia Sẻ Sức Mạnh: Học Thức Tăng"
 shared_strength_learning_loss_modifier: "Chia Sẻ Sức Mạnh: Học Thức Giảm"
 shared_strength_prowess_gain_modifier: "Chia Sẻ Sức Mạnh: Võ Dũng Tăng"
 shared_strength_prowess_loss_modifier: "Chia Sẻ Sức Mạnh: Võ Dũng Giảm"

 POD_storyteller_interaction: "Kể Chuyện"
 POD_storyteller_interaction_desc: "Dùng gnosis để có cơ hội xảy ra một sự kiện ngẫu nhiên."
 POD_storyteller_interaction.tt: "25% cơ hội xảy ra một sự kiện ngẫu nhiên."

 POD_unleash_storm_of_mothers_wrath_interaction: "Giải Phóng Cơn Thịnh Nộ của Mẫu Thần"
 POD_unleash_storm_of_mothers_wrath_interaction_desc: "Giải phóng một Cơn Thịnh Nộ của Mẫu Thần sẽ gây tàn phá trong một vùng."
 POD_unleash_storm_of_mothers_wrath_interaction.tt: "Ngươi sẽ giải phóng một Cơn Thịnh Nộ của Mẫu Thần lên lãnh thổ của [recipient.GetFirstNamePossessive]"
 POD_unleash_storm_of_mothers_wrath_interaction.duel.success: "Ngươi đã thành công gây ra Cơn Bão"
 POD_unleash_storm_of_mothers_wrath_interaction.duel.tt.attacker_wins: "Lãnh thổ của [recipient.GetFirstNamePossessive] chìm trong Cơn Thịnh Nộ của Mẫu Thần, gây tàn phá bất cứ nơi nào nó đi qua."
 POD_unleash_storm_of_mothers_wrath_interaction.duel.failure: "Ngươi đã thất bại trong việc gây ra Cơn Bão"
 POD_unleash_storm_of_mothers_wrath_interaction.duel.tt.attacker_lost: "Ngươi đã thất bại"
 POD_unleash_storm_of_mothers_wrath_interaction_actor_toast: "Ngươi đã giải phóng thành công một Cơn Thịnh Nộ của Mẫu Thần lên lãnh thổ của [recipient.GetFirstNamePossessive]"
 POD_unleash_storm_of_mothers_wrath_interaction_recipient_toast: "Một Cơn Thịnh Nộ của Mẫu Thần đã được giải phóng lên thủ phủ của ngươi bởi [actor.GetFirstName]"
 POD_unleash_storm_of_mothers_wrath_interaction_failed_toast: "Ngươi không thể giải phóng một Cơn Thịnh Nộ của Mẫu Thần lên lãnh thổ của [recipient.GetFirstNamePossessive]"
 storm_of_mothers_wrath_modifier: "Bị Cơn Thịnh Nộ của Mẫu Thần Tàn Phá"
 storm_of_mothers_wrath_modifier_desc: "Vùng này bị tàn phá bởi một trận mưa đá đen tối đáng sợ, xuất hiện ngay cả khi trời quang mây tạnh."

 POD_tagalong_interaction: "Đi Theo"
 POD_tagalong_interaction_desc: "Nhận phước lành của vật tổ từ [recipient.GetFirstName]."

 POD_beg_interaction: "Van Xin"
 POD_beg_interaction_desc: "Van xin [recipient.GetFirstName] cho chút đồ thừa."

 POD_riot_interaction: "Kích Động Bạo Loạn"
 POD_riot_interaction_desc: "Triệu tập một đám linh hồn hiểm ác để kích động cư dân của quận thủ phủ của [recipient.GetFirstNamePossessive] nổi loạn bạo lực."

 POD_airitechs_daughters_interaction: "Biến thành Người Sói Crinos"
 POD_airitechs_daughters_interaction_desc: "Ép [recipient.GetFirstName] mang hình dạng người sói Crinos."

 POD_shadow_pack_interaction: "Triệu Hồi Bản Sao Bóng Tối"
 POD_shadow_pack_interaction_desc: "Triệu hồi các bản sao bóng tối của chính ngươi."
 POD_shadow_pack_interaction.tt: "Ngươi sẽ cố triệu hồi các bản sao bóng tối của chính ngươi."

 POD_renew_the_cycle_interaction: "Tái Sinh Chu Kỳ"
 POD_renew_the_cycle_interaction_desc: "Khiến [recipient.GetFirstName] trở về trạng thái tự nhiên của mình (hóa thành cát bụi hoặc đơn giản là mất đi vẻ sống động)."

 POD_thought_form_of_the_twelve_ministers_interaction: "Đạt Chân Quân Bình Tâm Linh"
 POD_thought_form_of_the_twelve_ministers_interaction_desc: "Bằng một câu thần chú được xướng lên, ngươi đạt được sự quân bình tâm linh chân thực trong một khoảnh khắc."

 POD_burning_scars_interaction: "Sẹo Lửa"
 POD_burning_scars_interaction_desc: "Chia sẻ ngọn lửa thiêu đốt với [recipient.GetFirstName]." 

 POD_dumpster_diving_interaction: "Lục Thùng Rác"
 POD_dumpster_diving_interaction_desc: "Từ một điện thờ của Đống Rác Vĩ Đại đến một điện thờ khác, cho phép ngươi dịch chuyển tức thời đến vị trí của [recipient.GetFirstNamePossessive], hoặc đến điểm đến tiếp theo khi đang [traveling|E], miễn là tỉnh mục tiêu có [development|E] cao."

 POD_home_in_all_lands_perk_interaction: "Xuất Hiện"
 POD_home_in_all_lands_perk_interaction_desc: "Bước sang một bên, và xuất hiện tại vị trí của [recipient.GetFirstNamePossessive] nơi có thể tìm thấy sói hoang dã."

 POD_storm_winds_slash_interaction: "Chém Gió Bão"
 POD_storm_winds_slash_interaction_desc: "Chém xuyên không khí và [recipient.GetFirstName] từ xa."
 POD_storm_winds_slash_interaction_requirement: "Phải trang bị một thanh Katana"

 POD_dark_of_night_interaction: "Bóng Tối Đêm Trường"
 POD_dark_of_night_interaction_desc: "Khiến chúng không thấy gì cả."
 POD_dark_of_night_interaction_success: "Mù Lòa"

 POD_moon_bridge_interaction: "Cầu Trăng"
 POD_moon_bridge_interaction_desc: "Bước đi trên con đường trăng xuyên qua sương mù của [umbra|E], cho phép ngươi dịch chuyển tức thời đến một caern tại vị trí của [recipient.GetFirstNamePossessive], hoặc đến điểm đến tiếp theo khi đang [traveling|E]."

 POD_blooding_fury_interaction: "Cuồng Nộ Huyết Thống"
 POD_blooding_fury_interaction_desc: "Tự gây thương tích cho bản thân để tăng $POD_energy_gnosis$ của ngươi."

