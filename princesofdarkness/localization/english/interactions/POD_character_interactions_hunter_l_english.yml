l_english:
 POD_inquihunt_interaction: "Tìm Sào Huyệt"
 POD_inquihunt_interaction_desc: "Ngài sẽ tìm cách xác định chính xác vị trí của con quái vật này. Rồi cuộc săn sẽ bắt đầu. Rõ ràng, việc này có những rủi ro nghiêm trọng..."
 I_CAN_ONLY_PLOT_ONE_INQUIHUNT_AT_A_TIME_TRIGGER: "Chỉ có thể lập kế hoạch cho một cuộc săn tại một thời điểm"
 scheme_interaction_tt_inquihunt_approved: "Ngài sẽ tìm cách xác định chính xác vị trí của con quái vật này. Rồi cuộc săn sẽ bắt đầu. Rõ ràng, việc này có những rủi ro nghiêm trọng..."
 inquihunt: "Âm mưu Tìm Sào Huyệt"
 inquihunt_action: "Tìm Sào Huyệt"
 inquihunt_interaction: "Tìm Sào Huyệt #weak (Âm mưu)#!"
 inquihunt_desc: "Ta sẽ tiêu diệt [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] và tẩy trừ ô uế của chúng khỏi vùng đất này"
 inquihunt_desc_general: "Tìm cách xác định vị trí con quái vật trước khi mở cuộc tấn công"
 INQUIHUNT_SUCCESS_DESC: "Ngài sẽ bắt đầu cuộc tấn công cuối cùng vào [TARGET_CHARACTER.GetShortUIName]"
 INQUIHUNT_DISCOVERY_DESC: "@warning_icon! Ngài bị lộ cho [crime|E] săn lùng tà thuật"
 inquihunt_my_intrigue: "Chỉ số Xảo Trá của Ngài: $VALUE|=+0$"
 inquihunt_my_rival: "Nạn nhân của Ngài: $VALUE|=+0$"
 POD_inquihunt_effect_message: "Nếu Ngài theo phong cách sống Đức Tin Chân Chính, Ngài sẽ nhận được một ít điểm kinh nghiệm phong cách sống đức tin tùy theo tuổi của con ma cà rồng bị giết."
 POD_inquihunt.667.t: "Mất Dấu"
 POD_inquihunt.667.desc: "Con mồi của Ngài đã tìm cách thoát khỏi những nỗ lực truy lùng kiên trì của Ngài. Có lẽ được các tay sai khác của Ác Quỷ giúp đỡ, chúng đã bò trở lại cái hố mà chúng chui ra, lẩn tránh Ngài. Nhưng Chúa Trời kiên nhẫn, và Ngài cũng vậy. Chúng sẽ không tránh được cọc thiêu mãi mãi."
 POD_inquihunt.667.option.a: "Có vẻ như ta đã bị đoán trước"
 POD_inquihunt.1.t: "Trên Đường Săn"
 POD_inquihunt.1.desc: "Cuối cùng Ngài đã truy ra sào huyệt của con quái vật. Không thể sai được, vì rõ ràng những người dân nghèo khổ xung quanh đây đã mất đi tình yêu của [ROOT.Char.GetFaith.HighGodName]. Họ trở nên hoang tưởng, như những cái xác rỗng không hồn, sợ ra ngoài vào ban đêm, và ngay cả Giáo Hội cũng trở nên hoang tàn.\nNgài và đoàn tùy tùng nhỏ của mình rõ ràng là hy vọng duy nhất của nơi này. Khi lập trại, đã đến lúc Ngài phải suy tính bước tiếp theo. Chắc chắn Chúa đã dẫn Ngài đến sào huyệt tội ác này, nhưng cách tiêu diệt nó thì tùy Ngài quyết định..."
 POD_inquihunt.1.desc.fera: "Cuối cùng Ngài đã truy ra sào huyệt của con quái vật. Không thể sai được, vì những con vượn xung quanh đây đều hoang tưởng, là những cái xác rỗng bị $glossary_wyrm$ làm ô uế, sợ ra ngoài vào ban đêm.\nKhi trinh sát khu vực, đã đến lúc Ngài phải suy tính bước tiếp theo. Ngài đã tìm ra sào huyệt của sự bại hoại, nhưng cách tiêu diệt nó thì tùy Ngài quyết định..."
 POD_inquihunt.1.option.a: "Dân đen vẫn chưa mất vào tay bóng tối. Hãy để ta rao giảng."
 POD_inquihunt.1.option.a.fera: "Với chút thuyết phục, đám vượn có thể bị kích động thành cơn thịnh nộ chống lại con đỉa."
 POD_inquihunt.1.option.a.generic: "Ta phải thuyết phục họ!"
 POD_inquihunt.1.option.aa.effect.success.desc: "Thành công tuyệt đối sẽ đảm bảo chiến thắng nhanh chóng cho chính nghĩa của Ngài"
 POD_inquihunt.1.option.ab.effect.success.desc: "Một kết quả hòa... con quái vật vẫn sẽ gây ra vấn đề"
 POD_inquihunt.1.option.ac.effect.success.desc: "Đừng phạm sai lầm, nếu không kẻ thù chắc chắn sẽ hạ Ngài nhanh chóng"
 POD_inquihunt.1.option.f: "Ta có cảm giác không lành về việc này"
 POD_inquihunt.1.option.f.custom: "Đây không phải nơi hay thời điểm thích hợp, Ngài sẽ trở lại vào lúc khác"
 POD_inquihunt.1.option.b: "Binh sĩ của [ROOT.Char.GetFaith.HighGodName]! Hôm nay chúng ta tấn công tòa lâu đài này!"
 POD_inquihunt.1.option.b.fera: "Những kẻ được Gaia chọn! Hôm nay chúng ta tấn công tòa lâu đài này!"
 POD_inquihunt.1.option.c: "Hãy để chúng ta tiêu diệt tài sản của nó và cô lập con quái vật trước"
 POD_inquihunt.1.option.d: "Chúng sợ ánh sáng của [ROOT.Char.GetFaith.HighGodName]. Hãy để chúng ta hành động vào ban ngày"
 POD_inquihunt.1.option.d.fera: "Helios sẽ giúp chúng ta. Hãy để chúng ta hành động vào ban ngày"
 POD_inquihunt.1.option.e: "Ta có thể có ghi chép gì đó về con ác quỷ đặc biệt này trong sách của mình..."
 POD_inquihunt.1.option.g: "Ta sẽ tự tay giết ngươi, con quái vật kia!"
 POD_inquihunt.2.t: "Đống Lửa Thỏa Mãn"
 POD_inquihunt.2.desc: "Việc đưa những linh hồn đáng thương này trở lại ánh sáng của [ROOT.Char.GetFaith.HighGodNamePossessive] dễ dàng hơn Ngài tưởng. Họ rất muốn được lắng nghe và học hỏi, sau bao năm lạc lối trong bóng tối.\nMột khi đã xong việc đó, việc liên minh với họ và sử dụng mọi điều họ biết về con quái vật ẩn nấp trong đêm càng dễ dàng hơn. Và thế là, với cả thị trấn theo cùng, Ngài đã xông vào sào huyệt của chúng, dễ dàng khống chế nó bằng số lượng đông đảo và sự trợ giúp của ánh sáng [ROOT.Char.GetFaith.HighGodNamePossessive].\nVà sau tất cả những điều đó, giờ đây Ngài đang thích thú xem con quái vật bị thiêu trên cọc, với cả thị trấn hoan hô tên của [ROOT.Char.GetFaith.HighGodNamePossessive], và của Ngài."
 POD_inquihunt.2.desc.fera: "Việc kêu gọi một đám đông người phàm dậy lên dễ dàng hơn Ngài tưởng. Họ rất muốn lật đổ đứa con của $glossary_wyrm$ đang ăn thịt đồng loại của họ.\nMột khi đã xong việc đó, việc liên minh với họ và sử dụng mọi điều họ biết về con quái vật ẩn nấp trong đêm càng dễ dàng hơn. Và thế là, với cả thị trấn theo cùng, Ngài đã xông vào sào huyệt của chúng, dễ dàng khống chế nó bằng số lượng đông đảo.\nVà sau tất cả những điều đó, giờ đây Ngài đang thích thú xem con quái vật bị thiêu trên cọc, với cả thị trấn hoan hô!"
 POD_inquihunt.2.option.a: "Cảnh tượng này làm ấm lòng ta"
 POD_inquihunt.3.t: "Con Cái Chống Lại Cha Mẹ"
 POD_inquihunt.3.t.fera: "Đám Đông Nổi Loạn"
 POD_inquihunt.3.desc: "Có vẻ con quái vật đã bám sâu móng vuốt vào ngôi làng này. Việc rao giảng của Ngài đã thu hút được một lượng lớn tín đồ, nhưng cũng có một số ít kẻ nổi loạn, giờ đang chống lại đoàn rước thiêng của Ngài ngay tại cửa sào huyệt con ác quỷ.\nRõ ràng, chúng đã bị Ác Quỷ làm hư hỏng, nhưng Ngài không có thời gian để cứu vớt linh hồn của họ, vì con ma cà rồng chắc chắn sẽ trốn thoát ngay khi nghe thấy náo động bên ngoài. Tuy vậy còn một lựa chọn khác, chắc chắn nhanh hơn, nhưng cũng đáng ngờ về mặt đạo đức..."
 POD_inquihunt.3.desc.fera: "Có vẻ con quái vật đã bám sâu móng vuốt vào ngôi làng này. Việc kích động của Ngài đã thu hút được một lượng lớn tín đồ, nhưng cũng có một số ít kẻ trung thành với con đỉa, giờ đang chống lại đám đông của Ngài ngay tại cửa sào huyệt của cái xác.\nRõ ràng, chúng đã bị $glossary_wyrm$ làm hư hỏng, nhưng Ngài không được chậm trễ, vì con ma cà rồng chắc chắn sẽ trốn thoát ngay khi nghe thấy náo động bên ngoài. Tuy vậy còn một lựa chọn khác, chắc chắn nhanh hơn, nhưng cũng đáng ngờ về mặt đạo đức..."
 POD_inquihunt.3.option.a: "Giết hết chúng rồi để Chúa Trời phân xử"  ##historical quote, leaving God here is fine
 POD_inquihunt.3.option.b: "Không một kẻ vô tội nào bị hại, dù là những kẻ vô tội lầm lạc"
 POD_inquihunt.4.t: "Trớ Trêu Bốc Lửa"
 POD_inquihunt.4.desc: "Ngài đã nghiêm trọng đánh giá thấp sức ảnh hưởng của con quái vật này đối với ngôi làng. Bài giảng của Ngài bị đáp lại bằng sự hoài nghi, thậm chí là giận dữ ra mặt. Đã quá muộn khi Ngài nhận ra sự thật: tất cả họ đều đã bị con ma cà rồng khống chế từ đầu.\nĐoàn tùy tùng của Ngài đã bị giết trong lúc ngủ, và Ngài bị mang đi một cách vội vã đến chính cái cọc mà Ngài đã định dùng cho con quái vật. Khi ngọn lửa bắt đầu nhấn chìm Ngài, Ngài nhớ rằng Chúa là lòng khoan dung. Và vì thế, cầu xin Người thương xót cho thất bại của Ngài, và những linh hồn của những kẻ vô tội lầm lạc này."
 POD_inquihunt.4.desc.generic: "Ngài đã nghiêm trọng đánh giá thấp sức ảnh hưởng của con quái vật này đối với ngôi làng. Lời lẽ của Ngài bị đáp lại bằng sự hoài nghi, thậm chí là giận dữ ra mặt. Đã quá muộn khi Ngài nhận ra sự thật: tất cả họ đều đã bị con ma cà rồng khống chế từ đầu.\nĐoàn tùy tùng của Ngài đã bị giết trong lúc ngủ, và Ngài bị mang đi một cách vội vã đến chính cái cọc mà Ngài đã định dùng cho con quái vật. Khi ngọn lửa bắt đầu nhấn chìm Ngài, Ngài nhớ ra rằng, thật ra, mọi thứ luôn được định sẵn để kết thúc như thế này. Ngài đã làm hết những gì có thể."
 POD_inquihunt.4.desc.fera: "Ngài đã nghiêm trọng đánh giá thấp sức ảnh hưởng của con quái vật này đối với ngôi làng. Việc kích động của Ngài bị đáp lại bằng sự hoài nghi, thậm chí là giận dữ ra mặt. Đã quá muộn khi Ngài nhận ra sự thật: tất cả họ đều đã bị con ma cà rồng khống chế từ đầu.\nCác tín đồ của Ngài đã bị giết trong lúc ngủ, và Ngài bị mang đi một cách vội vã đến chính cái cọc mà Ngài đã định dùng cho con quái vật. Khi ngọn lửa bắt đầu nhấn chìm Ngài, Ngài mong rằng ở kiếp sau mình sẽ là một chiến binh tốt hơn cho Gaia."
 POD_inquihunt.4.option.a: "nó kết thúc như khi bắt đầu, trong lửa."
 POD_inquihunt.5.t: "Kế Hoạch Hoàn Hảo"
 POD_inquihunt.5.desc: "Kiêu ngạo là một tội lỗi, nhưng Ngài phải công nhận: đó là một cuộc tấn công hoàn hảo, được các Hiệp Sĩ của Chúa dũng cảm dưới quyền Ngài chỉ huy một cách tài tình. Bất chấp vô số nô lệ canh giữ khu vực, và còn nhiều cạm bẫy hơn nữa, cuối cùng Ngài đã xông vào được nơi đó với ít tổn thất.\nRõ ràng, Ngài đã tấn công vào giữa ban ngày, và Ngài phải ghi công cho ánh sáng của Chúa vì đã giữ cho con quái vật ngủ yên trong suốt trận chiến. Sau khi chiếm được tòa lâu đài, đó là một khoảnh khắc không có gì kịch tính, nhưng vẫn thỏa mãn, khi Ngài chặt đầu con ma cà rồng đang say ngủ. Chiến thắng lại một lần nữa thuộc về Ngài."
 POD_inquihunt.5.desc.generic: "Sự tự tin thái quá là một kẻ giết người chậm rãi nhưng âm ỉ, nhưng Ngài phải công nhận: đó là một cuộc tấn công hoàn hảo, được các thợ săn dũng cảm dưới quyền Ngài chỉ huy một cách tài tình. Bất chấp vô số nô lệ canh giữ khu vực, và còn nhiều cạm bẫy hơn nữa, cuối cùng Ngài đã xông vào được nơi đó với ít tổn thất.\nRõ ràng, Ngài đã tấn công vào giữa ban ngày, và Ngài phải ghi công cho chiến thuật đó vì đã giữ cho con quái vật ngủ yên trong suốt trận chiến. Sau khi chiếm được tòa lâu đài, đó là một khoảnh khắc không có gì kịch tính, nhưng vẫn thỏa mãn, khi Ngài chặt đầu con ma cà rồng đang say ngủ. Chiến thắng lại một lần nữa thuộc về Ngài."
 POD_inquihunt.5.desc.fera: "Đó là một cuộc tấn công hoàn hảo, được các chiến binh dưới quyền Ngài chỉ huy một cách tài tình. Bất chấp vô số nô lệ canh giữ khu vực, và còn nhiều cạm bẫy hơn nữa, cuối cùng Ngài đã xông vào được nơi đó với ít tổn thất.\nRõ ràng, Ngài đã tấn công vào giữa ban ngày, và Ngài phải ghi công cho ánh sáng của Helios vì đã giữ cho con quái vật ngủ yên trong suốt trận chiến. Sau khi chiếm được tòa lâu đài, đó là một khoảnh khắc không có gì kịch tính, nhưng vẫn thỏa mãn, khi Ngài chặt đầu con ma cà rồng đang say ngủ. Chiến thắng lại một lần nữa thuộc về Ngài."
 POD_inquihunt.5.option.a: "Ta thích khi một kế hoạch thành công."
 POD_inquihunt.6.t: "Chiến Thắng Kiểu Pyrros?"
 POD_inquihunt.6.desc: "Khi trận chiến vẫn còn tiếp diễn trong tòa lâu đài, Ngài biết chiến thắng đã trong tay. Nhưng liệu cái giá này có đáng không? Những kẻ phòng thủ đã có sự chuẩn bị, và vô số cạm bẫy đã cướp đi sinh mạng của những chiến binh tốt của Chúa. Một con quái vật chết có đủ để đền đáp cho những linh hồn đáng thương này không?\nVẫn chưa quá muộn, và Ngài có thể hủy bỏ cuộc tấn công hôm nay, nhưng con ma cà rồng rõ ràng sẽ lợi dụng màn đêm để trốn thoát. Hoặc Ngài tiếp tục, và mãi mang gánh nặng về những người tốt đã mất vì một chính nghĩa đáng giá."
 POD_inquihunt.6.desc.generic: "Khi trận chiến vẫn còn tiếp diễn trong tòa lâu đài, Ngài biết chiến thắng đã trong tay. Nhưng liệu cái giá này có đáng không? Những kẻ phòng thủ đã có sự chuẩn bị, và vô số cạm bẫy đã cướp đi sinh mạng của những người nam và nữ tốt dưới quyền Ngài. Một con quái vật chết có đủ để đền đáp cho những linh hồn đáng thương này không?\nVẫn chưa quá muộn, và Ngài có thể hủy bỏ cuộc tấn công hôm nay, nhưng con ma cà rồng rõ ràng sẽ lợi dụng màn đêm để trốn thoát. Hoặc Ngài tiếp tục, và mãi mang gánh nặng về những người đồng hành đã mất vì một chính nghĩa đáng giá."
 POD_inquihunt.6.desc.fera: "Khi trận chiến vẫn còn tiếp diễn trong tòa lâu đài, Ngài biết chiến thắng đã trong tay. Nhưng liệu cái giá này có đáng không? Những kẻ phòng thủ đã có sự chuẩn bị, và vô số cạm bẫy đã cướp đi sinh mạng của các chiến binh của Gaia. Một con quái vật chết có đủ để đền đáp cho những người thân này không?\nVẫn chưa quá muộn, và Ngài có thể hủy bỏ cuộc tấn công hôm nay, nhưng con ma cà rồng rõ ràng sẽ lợi dụng màn đêm để trốn thoát. Hoặc Ngài tiếp tục, và mãi mang gánh nặng về những tín đồ tốt đã mất vì một chính nghĩa đáng giá."
 POD_inquihunt.6.option.a: "Chiến thắng đáng với sự hy sinh này!"
 POD_inquihunt.6.option.b: "Con đường dễ dàng đó dẫn đến sự đọa lạc."
 POD_inquihunt.7.t: "Trận Chiến Cuối Cùng"
 POD_inquihunt.7.desc: "Mọi thứ đã diễn ra hết sức tồi tệ. Tòa lâu đài đã được chuẩn bị sẵn, và Ngài không thể nào phá vỡ được tường thành. Tệ hơn nữa, quân tiếp viện đến từ một thị trấn gần đó, dường như cũng đang phục vụ Chúa Tể Bóng Tối của tòa lâu đài. Con quái vật ở rất gần, nhưng lại xa vô cùng.\nKhông còn đường thoát cho Ngài và các hiệp sĩ dũng cảm của mình, và có vẻ Chúa sẽ gọi Ngài về cõi của Người hôm nay. Ngài hy vọng mình đáng được hưởng lòng khoan dung của Người, nhưng trước đó... Ngài sẽ hạ càng nhiều con ác quỷ này càng tốt."
 POD_inquihunt.7.desc.generic: "Mọi thứ đã diễn ra hết sức tồi tệ. Tòa lâu đài đã được chuẩn bị sẵn, và Ngài không thể nào phá vỡ được tường thành. Tệ hơn nữa, quân tiếp viện đến từ một thị trấn gần đó, dường như cũng đang phục vụ Chúa Tể Bóng Tối của tòa lâu đài. Con quái vật ở rất gần, nhưng lại xa vô cùng.\nKhông còn đường thoát cho Ngài và các thợ săn dũng cảm của mình, và số phận của Ngài giờ đây không thể tránh khỏi. Nhưng trước đó... Ngài sẽ hạ càng nhiều con ác quỷ này càng tốt."
 POD_inquihunt.7.desc.fera: "Mọi thứ đã diễn ra hết sức tồi tệ. Tòa lâu đài đã được chuẩn bị sẵn, và Ngài không thể nào phá vỡ được tường thành. Tệ hơn nữa, quân tiếp viện đến từ một thị trấn gần đó, dường như cũng đang phục vụ Chúa Tể Bóng Tối của tòa lâu đài. Con quái vật ở rất gần, nhưng lại xa vô cùng.\nKhông còn đường thoát cho Ngài, và các chiến binh dũng cảm của Ngài sẽ phải chết. Ngài sẽ hạ càng nhiều đứa con của $glossary_wyrm$ này càng tốt."
 POD_inquihunt.7.option.a: "Hôm nay là ngày tốt để chết"
 POD_inquihunt.8.t: "Đốt Sạch Tài Sản"
 POD_inquihunt.8.desc: "Đòn tấn công của Ngài rất có phương pháp. Ngài đã nhắm vào mọi hội nhóm, dân quân hay bè tà giáo mà con quái vật có nhúng tay vào. Ngài đã dùng hai thứ vũ khí lợi hại: sức hút của vàng cho kẻ tham lam, và nỗi sợ Giáo Hội cho kẻ tha hóa.\nVà thế là, chiến dịch của Ngài đã cô lập con ma cà rồng, làm chúng mất đồng minh và phân tán nô lệ của chúng. Giờ đây Ngài đang nhìn nơi trú ẩn cuối cùng của con quái vật cháy rụi trước mắt, tiếng gào thét của con vật bên trong như âm nhạc đối với tai Ngài."
 POD_inquihunt.8.desc.generic: "Đòn tấn công của Ngài rất có phương pháp. Ngài đã nhắm vào mọi hội nhóm, dân quân hay bè tà giáo mà con quái vật có nhúng tay vào. Ngài đã dùng hai thứ vũ khí lợi hại: sức hút của vàng cho kẻ tham lam, và nỗi sợ sự thịnh nộ của Ngài cho kẻ tha hóa.\nVà thế là, chiến dịch của Ngài đã cô lập con ma cà rồng, làm chúng mất đồng minh và phân tán nô lệ của chúng. Giờ đây Ngài đang nhìn nơi trú ẩn cuối cùng của con quái vật cháy rụi trước mắt, tiếng gào thét của con vật bên trong như âm nhạc đối với tai Ngài."
 POD_inquihunt.8.desc.fera: "Đòn tấn công của Ngài rất có phương pháp. Ngài đã nhắm vào mọi hội nhóm, dân quân hay bè tà giáo mà con quái vật có nhúng tay vào. Ngài đã dùng hai thứ vũ khí lợi hại: sức hút của vàng cho kẻ tham lam, và nỗi sợ sự báo thù cho kẻ tha hóa.\nVà thế là, chiến dịch của Ngài đã cô lập con ma cà rồng, làm chúng mất đồng minh và phân tán nô lệ của chúng. Giờ đây Ngài đang nhìn nơi trú ẩn cuối cùng của con quái vật cháy rụi trước mắt, tiếng gào thét của con vật bên trong như âm nhạc đối với tai Ngài."
 POD_inquihunt.8.option.a: "Ngươi bị sa thải rồi"
 POD_inquihunt.9.t: "Cuộc Đời Lính Đánh Thuê Là Dành Cho Ta"
 POD_inquihunt.9.desc: "Con quái vật độc ác này có ảnh hưởng lớn hơn trong vùng so với những gì Ngài nghĩ ban đầu. Tuy vậy Ngài đã kiên định, và giờ đây Ngài khá chắc rằng phần lớn tài sản của chúng đã bị hành động của Ngài phá hủy.\nNhưng có vẻ con ma cà rồng sẽ không dễ dàng gục ngã, khi một nhóm lính đánh thuê hùng mạnh giờ đang tiến về vị trí của Ngài, dường như được kẻ thù của Ngài thuê để tiêu diệt Ngài. Ngài có một lựa chọn: lính đánh thuê thích vàng, và Ngài có thể quay chúng chống lại chủ thuê trước khi chúng kịp bỏ trốn. Hoặc Ngài có thể chấp nhận thiệt hại và coi như hòa lần này."
 POD_inquihunt.9.option.a: "Ta đề nghị vàng và sự cứu rỗi cho những người sùng đạo như các ngươi."
 POD_inquihunt.9.option.a.fera: "Một số người sẽ chiến đấu với quái vật, miễn là giá cả hợp lý."
 POD_inquihunt.9.option.b: "Lần sau ta sẽ bắt được con ác quỷ này"
 POD_inquihunt.10.t: "Đổi Chủ"
 POD_inquihunt.10.desc: "Ngài đã tính toán sai. Mọi hành động của Ngài đều bị hóa giải ở mỗi bước. Con ma cà rồng này có nhiều vàng, nhiều tay sai và nhiều ảnh hưởng hơn với cộng đồng này so với những gì Ngài từng có thể dự đoán.\nVà giờ đây, mọi thứ sụp đổ, theo đúng nghĩa đen, sau khi sai lầm cuối cùng của Ngài đã tiết lộ vị trí của Ngài cho con quái vật. Một nhóm 'lính đánh thuê' lão luyện nhanh chóng xuất hiện, và với chỉ những hiệp sĩ trung thành của Chúa để bảo vệ Ngài, chẳng mấy chốc Ngài đã bị vây hãm ngay trong căn cứ của mình. Khi những âm thanh cuối cùng của trận chiến tắt dần bên ngoài, giờ Ngài nghe thấy âm thanh của những bó đuốc bị ném qua cửa sổ. May mắn là, Ngài còn thời gian cho một lời Kinh Lạy Cha cuối cùng."
 POD_inquihunt.10.desc.generic: "Ngài đã tính toán sai. Mọi hành động của Ngài đều bị hóa giải ở mỗi bước. Con ma cà rồng này có nhiều vàng, nhiều tay sai và nhiều ảnh hưởng hơn với cộng đồng này so với những gì Ngài từng có thể dự đoán.\nVà giờ đây, mọi thứ sụp đổ, theo đúng nghĩa đen, sau khi sai lầm cuối cùng của Ngài đã tiết lộ vị trí của Ngài cho con quái vật. Một nhóm 'lính đánh thuê' lão luyện nhanh chóng xuất hiện, và với chỉ những thợ săn trung thành để bảo vệ Ngài, chẳng mấy chốc Ngài đã bị vây hãm ngay trong căn cứ của mình. Khi những âm thanh cuối cùng của trận chiến tắt dần bên ngoài, giờ Ngài nghe thấy âm thanh của những bó đuốc bị ném qua cửa sổ. Ngày tận cùng đã gần kề."
 POD_inquihunt.10.desc.fera: "Ngài đã tính toán sai. Mọi hành động của Ngài đều bị hóa giải ở mỗi bước. Con ma cà rồng này có nhiều vàng, nhiều tay sai và nhiều ảnh hưởng hơn với cộng đồng này so với những gì Ngài từng có thể dự đoán.\nVà giờ đây, mọi thứ sụp đổ, theo đúng nghĩa đen, sau khi sai lầm cuối cùng của Ngài đã tiết lộ vị trí của Ngài cho con quái vật. Một nhóm 'lính đánh thuê' lão luyện nhanh chóng xuất hiện, và với chỉ những người thân trung thành để bảo vệ Ngài, chẳng mấy chốc Ngài đã bị vây hãm ngay trong doanh trại của mình. Khi những âm thanh cuối cùng của trận chiến tắt dần bên ngoài, giờ Ngài nghe thấy âm thanh của những bó đuốc bị ném vào doanh trại. Có vẻ đây là hồi kết."
 POD_inquihunt.10.option.a: "Pater noster qui es in caelis..."
 POD_inquihunt.10.option.a.fera: "Vorus cười nhạo thất bại của ta."
 POD_inquihunt.10.option.a.generic: "Điểm cuối của con đường."
 POD_inquihunt.11.t: "Kẻ Thù Của Kẻ Thù Ta..."
 POD_inquihunt.11.desc: "Một điều Ngài biết về ma cà rồng là chúng phần lớn đều thù địch với nhau. Và Ngài đã trở thành chuyên gia trong việc lợi dụng điều này.\nBằng cách để lại vài đầu mối về sào huyệt này cho một tổ ác quỷ lân cận đã biết, Ngài chỉ cần ngồi yên xem mục tiêu của mình bị một nhóm côn đồ do đối thủ của chúng thuê tấn công trong đêm. Chúng thắng, nhưng đã suy yếu đủ để các hiệp sĩ của Ngài dễ dàng khống chế nó. Ngài nhanh chóng tìm cho nó một nơi ở mới trong phòng tra tấn riêng của mình. Sau đó Ngài đã trải qua những ngày rất sáng tỏ với nó cho đến khi Ngài để nó chảy máu đến chết thật. Ý Chúa đã được thực hiện."
 POD_inquihunt.11.desc.fera: "Một điều Ngài biết về ma cà rồng là chúng phần lớn đều thù địch với nhau. Và Ngài đã trở thành chuyên gia trong việc lợi dụng điều này.\nBằng cách để lại vài đầu mối về sào huyệt này cho một tổ ác quỷ lân cận đã biết, Ngài chỉ cần ngồi yên xem mục tiêu của mình bị một nhóm côn đồ do đối thủ của chúng thuê tấn công trong đêm. Chúng thắng, nhưng đã suy yếu đủ để các chiến binh của Ngài dễ dàng khống chế nó. Ngài chỉ cần xông vào để hạ gục."
 POD_inquihunt.11.option.a: "Những tiếng thét chúng phát ra khi có mặt một Thánh Vật thật thú vị..."
 POD_inquihunt.11.option.a.generic: "Gần như quá dễ dàng."
 POD_inquihunt.11.option.a.fera: "Có nhiều vinh quang trong việc tiêu diệt những con đỉa."
 POD_inquihunt.12.t: "Cây Thập Tự Và Con Dao"
 POD_inquihunt.12.t.fera: "Kẻ Săn Và Con Mồi"
 POD_inquihunt.12.desc: "Bạn khâm phục sự tinh quái của con quái vật này. Đa số mục tiêu trước đây của bạn đều dễ dàng ngã gục ngay khi bạn giương lên mạng lưới âm mưu quanh chúng, nhưng con này... con này đã đánh trả. Rất mạnh.\nMạng lưới của chính bạn bị tấn công, với những lời đồn cay độc nhằm vào riêng bạn. Bạn biết mình có thể thắng cuộc chiến ngầm này, nhưng sẽ tốn kém rất nhiều để hàn gắn thiệt hại do kẻ thù gây ra. Chỉ cần thúc đẩy thêm một chút nữa là bạn có thể tận hưởng niềm vui đưa con ma cà rồng này vào phòng tra hình tốt nhất của bạn... Thật khó quyết định."
 POD_inquihunt.12.desc.fera: "Bạn khâm phục sự tinh quái của con quái vật này. Đa số mục tiêu trước đây của bạn đều dễ dàng ngã gục ngay khi bạn giương lên mạng lưới âm mưu quanh chúng, nhưng con này... con này đã đánh trả. Rất mạnh.\nMạng lưới của chính bạn bị tấn công, với những lời đồn cay độc nhằm vào riêng bạn. Bạn biết mình có thể thắng cuộc chiến ngầm này, nhưng sẽ tốn kém rất nhiều để hàn gắn thiệt hại do kẻ thù gây ra. Chỉ cần thúc đẩy thêm một chút nữa là bạn có thể đánh bại con ma cà rồng này. Thật khó quyết định."
 POD_inquihunt.12.option.a: "Danh tiếng không phải là tất cả"
 POD_inquihunt.12.option.b: "Con quỷ này không đáng công sức bỏ ra"
 POD_inquihunt.13.t: "Gặp Kẻ Cao Tay Hơn"
 POD_inquihunt.13.desc: "Bạn chẳng có cơ hội nào. Mọi hành động của bạn đều bị đoán trước, mọi bước đi của bạn đều dễ dàng bị hóa giải. Bạn chẳng khác gì một đứa trẻ chơi cờ vua mà không biết luật. Con ma cà rồng này có lẽ chính là kẻ đã sáng tạo ra trò chơi ấy.\nNgay cả khi bạn đã hiểu ra mối nguy mình đang gặp, thì đã quá muộn. Và thế là, giờ đây bạn bị tra hình mỗi đêm bởi chính kẻ mà bạn từng dại dột muốn tiêu diệt. Và ngay trong lĩnh vực đặc biệt này, chúng còn biết nhiều hơn bạn rất nhiều..."
 POD_inquihunt.13.option.a: "Màn đêm tối tăm và đầy rẫy nỗi khiếp sợ"
 POD_inquihunt.14.t: "Biết Rõ Kẻ Thù"
 POD_inquihunt.14.desc: "Bạn khá vui mừng khi thấy trong sách của mình có vài ghi chép cũ về con quái vật đặc biệt mà bạn đang truy lùng. Bạn còn vui hơn khi biết được sự gắn bó kỳ lạ của nó với một gia đình người phàm vẫn còn sống. Như thể những sinh vật này vẫn còn cảm nhận được xúc cảm của người phàm vậy!\nDù sao thì, đây cũng là một thông tin dễ khai thác. Bằng cách dùng những người phàm ấy làm mồi nhử, bạn đã dụ được con ma cà rồng sa vào một cái bẫy được tính toán kỹ càng trên đất thánh. Con quái vật này lập tức hóa thành tro bụi ngay khi bước vào khu vực đó, một quan sát mà bạn đã nhanh tay ghi lại vào nhật ký của mình."
 POD_inquihunt.14.option.a: "Cái này có thể sẽ có ích cho lần sau"
 POD_inquihunt.15.t: "Một Cuốn Sách Đi Quá Xa"
 POD_inquihunt.15.desc: "Con quái vật này thật khó nắm bắt. Nó đã tránh được hai cái bẫy được bạn tính toán kỹ càng, và bạn đang dần mất ưu thế, khi vài tay chân của bạn đã biến mất không rõ tung tích.\nDù vậy vẫn còn một khả năng, một thứ bạn chọn không dùng tới cho đến giờ vì bản chất...'huyền bí' của nó. Hội Thánh chắc chắn sẽ không chấp thuận một lựa chọn như thế, nhưng có lẽ cái chết của con ma cà rồng này đáng giá hơn danh tiếng của bạn?"
 POD_inquihunt.15.desc.generic: "Con quái vật này thật khó nắm bắt. Nó đã tránh được hai cái bẫy được bạn tính toán kỹ càng, và bạn đang dần mất ưu thế, khi vài tay chân của bạn đã biến mất không rõ tung tích.\nDù vậy vẫn còn một khả năng, một thứ bạn chọn không dùng tới cho đến giờ vì bản chất...'huyền bí' của nó. Một mối quan hệ đáng ngờ của bạn trong vùng đã đề nghị giúp đỡ, nhưng việc dựa vào cái nguồn có thể đã bị nhuốm bẩn này có thể làm hại danh tiếng của bạn."
 POD_inquihunt.15.desc.fera: "Con quái vật này thật khó nắm bắt. Nó đã tránh được hai cái bẫy được bạn tính toán kỹ càng, và bạn đang dần mất ưu thế, khi vài tay chân của bạn đã biến mất không rõ tung tích.\nDù vậy vẫn còn một khả năng, một thứ bạn chọn không dùng tới cho đến giờ vì bản chất...'huyền bí' của nó. Một linh hồn nguy hiểm đã liên lạc với tôi, ngỏ ý 'giúp đỡ'."
 POD_inquihunt.15.option.a: "[ROOT.Char.GetFaith.HighGodName] rốt cuộc cũng khoan dung..."
 POD_inquihunt.15.option.a.desc: "Bất kể giá nào, tôi cũng sẽ trả."
 POD_inquihunt.15.option.b: "Đó là ranh giới tôi không vượt qua"
 POD_inquihunt.16.t: "Nếu Bạn Nhìn Vào Vực Sâu..."
 POD_inquihunt.16.desc: "Bạn không thật sự biết nó bắt đầu từ khi nào. Bạn tìm thấy một ghi chép về con ma cà rồng trong một cuốn sách cũ, rồi lại thêm một cuốn khác... và bạn bắt đầu đọc. Càng đọc nhiều hơn khi có thêm sách được mang đến cho bạn bởi vài tay chân mà bạn chẳng nhớ đã thuê từ lúc nào.\nBạn đã lạc lối khá lâu trong công việc của mình và bạn đã đào sâu, có lẽ là quá sâu. Ít nhất, đó là điều Hội Thánh nghĩ, khi bạn bị một trong các kỵ sĩ của mình tố cáo vì những thứ đọc 'tà giáo' của bạn. Và thế là, bạn lại ở đây, trên cột thiêu một lần nữa, nhưng lần này không phải giữa công chúng..."
 POD_inquihunt.16.desc.generic: "Bạn không thật sự biết nó bắt đầu từ khi nào. Bạn tìm thấy một ghi chép về con ma cà rồng trong một cuốn sách cũ, rồi lại thêm một cuốn khác... và bạn bắt đầu đọc. Càng đọc nhiều hơn khi có thêm sách được mang đến cho bạn bởi vài tay chân mà bạn chẳng nhớ đã thuê từ lúc nào.\nBạn đã lạc lối khá lâu trong công việc của mình và bạn đã đào sâu, có lẽ là quá sâu. Ít nhất, đó là điều giáo sĩ địa phương nghĩ, khi bạn bị một trong các người đồng hành của mình tố cáo vì những thứ đọc 'tà giáo' của bạn. Và thế là, bạn lại ở đây, trên cột thiêu một lần nữa, nhưng lần này không phải giữa công chúng..."
 POD_inquihunt.16.desc.fera: "Bạn không thật sự biết nó bắt đầu từ khi nào. Bạn tìm thấy một ghi chép về con ma cà rồng trong một cuốn sách cũ, rồi lại thêm một cuốn khác... và bạn bắt đầu đọc. Càng đọc nhiều hơn khi có thêm sách được mang đến cho bạn bởi vài tay chân mà bạn chẳng nhớ đã thuê từ lúc nào.\nBạn đã lạc lối khá lâu trong công việc của mình và bạn đã đào sâu, có lẽ là quá sâu. Rồi linh hồn ấy đến với bạn cùng một lời đề nghị nguy hiểm. Quá nguy hiểm, dẫn bạn vào một cái bẫy và cuối cùng dẫn đến cái chết của bạn."
 POD_inquihunt.16.option.a: "Tôi đã gần chạm tới sự thật đến thế! Gần đến thế!"
 POD_inquihunt.17.t: "Cuồng Nộ Thánh Thiện"
 POD_inquihunt.17.t.fera: "Cuồng Nộ của Gaia"
 POD_inquihunt.17.desc: "Chúng không hề ngờ tới một cuộc tấn công trực diện. Đó là điều bạn rút ra được sau khi chém xuyên qua một số lượng đáng kể tay chân chưa kịp chuẩn bị của con ma cà rồng trước khi tìm ra nơi nó nghỉ ngơi. Dù bạn đã tấn công vào ban ngày, tiếng ồn ào của trận chiến đã khiến con quái vật thức tỉnh, nó đang chờ bạn.\nBạn phải thừa nhận là chúng đã thể hiện khá tốt, dù chậm chạp vào ban ngày, nhưng nhìn chung, bạn vẫn khá dễ dàng chặt đầu chúng trước khi chúng có thể thực sự lấy lại thế trận trong cuộc chiến này. Một con hút máu nữa bị loại khỏi mặt đất tươi đẹp của Chúa."
 POD_inquihunt.17.desc.generic: "Chúng không hề ngờ tới một cuộc tấn công trực diện. Đó là điều bạn rút ra được sau khi chém xuyên qua một số lượng đáng kể tay chân chưa kịp chuẩn bị của con ma cà rồng trước khi tìm ra nơi nó nghỉ ngơi. Dù bạn đã tấn công vào ban ngày, tiếng ồn ào của trận chiến đã khiến con quái vật thức tỉnh, nó đang chờ bạn.\nBạn phải thừa nhận là chúng đã thể hiện khá tốt, dù chậm chạp vào ban ngày, nhưng nhìn chung, bạn vẫn khá dễ dàng chặt đầu chúng trước khi chúng có thể thực sự lấy lại thế trận trong cuộc chiến này. Thêm một vết khấc nữa trên cây nỏ của bạn."
 POD_inquihunt.17.desc.fera: "Chúng không hề ngờ tới một cuộc tấn công trực diện. Đó là điều bạn rút ra được sau khi chém xuyên qua một số lượng đáng kể tay chân chưa kịp chuẩn bị của con ma cà rồng trước khi tìm ra nơi nó nghỉ ngơi. Dù bạn đã tấn công vào ban ngày, tiếng ồn ào của trận chiến đã khiến con quái vật thức tỉnh, nó đang chờ bạn.\nBạn phải thừa nhận là chúng đã thể hiện khá tốt, dù chậm chạp vào ban ngày, nhưng nhìn chung, bạn vẫn khá dễ dàng chặt đầu chúng trước khi chúng có thể thực sự lấy lại thế trận trong cuộc chiến này. Một tay sai nữa của $glossary_wyrm$ hút cạn Gaia bị loại bỏ."
 POD_inquihunt.17.option.a: "Vậy, con tiếp theo ở đâu?"
 POD_inquihunt.18.t: "Một Đối Thủ Xứng Tầm"
 POD_inquihunt.18.desc: "Con này đáng gờm. Dù đã dễ dàng hạ gục hầu hết lính gác của chúng, và tấn công vào ban ngày, con quái vật này vẫn là một kẻ địch đáng gờm. Bạn tự tin rằng mình sẽ thắng, nhờ ánh sáng ban ngày, nhưng đây là một quá trình chậm chạp và gian khổ.\nTệ hơn nữa, trận chiến kéo dài này đã cho tay chân khác của con ma cà rồng thời gian để can thiệp. Bạn có lẽ cũng có thể đánh bại cả chúng, nhưng bạn sẽ không thoát ra mà không bị thương trong một trận chiến như vậy..."
 POD_inquihunt.18.option.a: "Tôi sẽ thắng, bất kể giá nào"
 POD_inquihunt.18.option.b: "Tôi phải bảo toàn bản thân cho những trận chiến sau"
 POD_inquihunt.19.t: "Thua Cuộc"
 POD_inquihunt.19.desc: "Vậy là nó kết thúc như thế này. Con quái vật, dù bị tấn công vào ban ngày, vẫn mạnh hơn, nhanh hơn và dai sức hơn bạn rất nhiều. Bạn đã nhận ra điều này khá sớm trong cuộc đối đầu và đã chấp nhận số phận.\nGiờ đây, chỉ còn là vấn đề giữ chân nó đủ lâu để quân của bạn có thể rút lui và sống thêm một ngày, điều mà bạn khá chắc là cuối cùng đã hoàn thành. Với một cú đánh cuối cùng, con ma cà rồng chuẩn bị kết liễu bạn. Nhưng bạn thanh thản hơn nó sẽ mãi không bao giờ có được, vì Chúa đang chờ bạn ở phía bên kia."
 POD_inquihunt.19.desc.generic: "Vậy là nó kết thúc như thế này. Con quái vật, dù bị tấn công vào ban ngày, vẫn mạnh hơn, nhanh hơn và dai sức hơn bạn rất nhiều. Bạn đã nhận ra điều này khá sớm trong cuộc đối đầu và đã chấp nhận số phận.\nGiờ đây, chỉ còn là vấn đề giữ chân nó đủ lâu để quân của bạn có thể rút lui và sống thêm một ngày, điều mà bạn khá chắc là cuối cùng đã hoàn thành. Với một cú đánh cuối cùng, con ma cà rồng chuẩn bị kết liễu bạn. Bạn thanh thản vì luôn biết đời mình sẽ kết thúc như vậy."
 POD_inquihunt.19.desc.fera: "Vậy là nó kết thúc như thế này. Con quái vật, dù bị tấn công vào ban ngày, vẫn mạnh hơn, nhanh hơn và dai sức hơn bạn rất nhiều. Bạn đã nhận ra điều này khá sớm trong cuộc đối đầu và đã chấp nhận số phận.\nGiờ đây, chỉ còn là vấn đề giữ chân nó đủ lâu để quân của bạn có thể rút lui và sống thêm một ngày, điều mà bạn khá chắc là cuối cùng đã hoàn thành. Với một cú đánh cuối cùng, con ma cà rồng chuẩn bị kết liễu bạn. Chúc may mắn hơn ở kiếp sau."
 POD_inquihunt.19.option.a: "Ánh sáng sẽ không bao giờ thực sự lụi tàn"

 POD_inquihunt.50.t: "Săn Sói"
 POD_inquihunt.50.desc: "Săn người sói là một việc vô cùng may rủi, ngay cả với những thợ săn lành nghề nhất. Những sinh vật này có thân hình cơ bắp lực lưỡng, hoạt động theo bầy và hiếm khi rời khỏi caern được phòng thủ kiên cố của chúng, nơi những kẻ xâm nhập bị giết ngay khi thấy. Gia đình gắn bó khăng khít của chúng, "Thân Tộc", cũng che chở chúng khỏi việc phải giao tiếp với thế giới bên ngoài.\nSăn ma cà rồng lại có vẻ dễ dàng hơn nhiều khi so sánh.\nCách tiếp cận rõ ràng nhất sẽ là một cuộc tấn công trực diện dùng số lượng áp đảo và vũ khí bạc, vì những sinh vật này yếu trước loại kim loại này. Dù bạn có tập hợp được bao nhiêu lợi thế, chúng chắc cũng khó mà gục ngã dễ dàng. Bạn có chắc muốn thử không?"
 POD_inquihunt.50.option.a: "Không thể quay đầu nữa."
 POD_inquihunt.50.option.b: "Trang bị bạc cho tất cả mọi người!"
 POD_inquihunt.50.option.c: "Ta hãy phát động một cuộc tấn công cẩn trọng."
 POD_inquihunt.50.option.z: "Tôi không thích cơ hội của mình."
 hunt_give_up_tt: "Bạn quay đầu, từ bỏ cuộc săn này."

 POD_inquihunt.51.t: "Một Trận Máu Me Ngoạn Mục"
 POD_inquihunt.51.desc: "Đó là một trận chiến bừa bộn đúng như bạn đã nghĩ nó sẽ diễn ra. Những con quái vật ấy trả giá ngang bằng (nếu không phải nhiều hơn) so với những gì chúng đã gây ra để bị hạ gục. May thay, quân số, trang bị và tài chỉ huy vượt trội của bạn đủ để giành lấy chiến thắng.\nKhi các đồng đội của bạn kính cẩn chôn cất những người đã ngã xuống và không chút nghi thức thiêu rụi cái sào huyệt bẩn thỉu của những kẻ biến hình này, bạn dành một khoảnh khắc để rửa sạch máu và thịt nát của trận chiến trong con sông gần đó.\nNgọn lửa bắt đầu lan rộng, và hôm nay, chiến thắng sẽ có mùi tro tàn trong gió và cây cối đang cháy."
 POD_inquihunt.51.option.a: "Có phải tôi vừa nghe thấy tiếng rừng khóc than?"

 POD_inquihunt.52.t: "Một Trận Máu Me"
 POD_inquihunt.52.desc: "Liệu những con quái vật này có thể bị giết không?\nDù mọi hiểu biết của bạn về chúng chứng minh là có thể, trận chiến này lại có vẻ quyết tâm chứng minh bạn sai. Bị thâm tím, bị cắt, bị cắm đầy mũi tên trên khắp cơ thể to lớn của chúng... chúng vẫn chém xuyên qua lực lượng của bạn với sự dễ dàng đáng sợ. Cơn phẫn nộ điên cuồng của chúng chỉ càng khiến chúng mạnh hơn, và dù bạn đã quá dày dạn kinh nghiệm để sợ hãi, bạn vẫn thấy rõ điềm chẳng lành.\nRa lệnh rút quân toàn bộ, bạn bảo vệ hậu quân đủ lâu để thoát khỏi lãnh địa bộ lạc của chúng và nhẹ nhõm khi thấy chúng chọn không đuổi theo. Đây không phải một chiến thắng nhưng bạn còn sống để chiến đấu thêm ngày khác. Xét đến đối thủ, đó cũng đã là điều đáng kể."
 POD_inquihunt.52.option.a: "Tôi sẽ trở lại."

 POD_inquihunt.53.t: "Trận Máu Me Của Bạn"
 POD_inquihunt.53.desc: "Trang bị, quân số và sự chuẩn bị vượt trội có vẻ không phải là đối thủ của sức mạnh hoang dã thuần túy.\nBất cứ nơi nào bạn nhìn tới, bạn thấy một trong các đồng đội của mình bị móng vuốt khổng lồ của những con quái vật này cắn xé tàn bạo. Ngay cả những cú đánh của bạn cũng chỉ vừa đủ xuyên qua lớp da mạnh mẽ đến siêu nhiên của chúng, và ngay cả vết thương sâu nhất cũng chỉ khiến chúng thêm giận dữ và vì thế thêm mạnh mẽ.\nMọi thứ kết thúc quá nhanh để bạn kịp ra lệnh rút quân, khi một số người của bạn đã tự bỏ chạy. Dù những kẻ biến hình này không phải lúc nào cũng đuổi theo, bạn nhanh chóng nhận ra rằng một số trong chúng, kể cả mục tiêu trước đây của bạn, đã bao vây bạn, rõ ràng hiểu rằng bạn chính là kẻ chỉ huy ở đây.\nCó vẻ đã đến lúc cho trận chiến cuối cùng. Là một thợ săn, bạn luôn biết nó sẽ kết thúc theo cách đó."
 POD_inquihunt.53.option.a: "Tôi đã làm hết sức mình."

 POD_inquihunt.80.t: "Trở Về Địa Ngục"
 POD_inquihunt.80.desc: "Săn ác quỷ đặt ra một nan đề khó khăn vì thực tế là chúng thực sự bất tử. Mọi điều bạn biết về chúng đều cho thấy rằng giết chết thể xác của chúng chỉ là một trở ngại tạm thời, vì chúng có vẻ trước hết là những sinh vật của tinh chất linh hồn.\nDù vậy, hy vọng chưa mất, vì có những cách để ít nhất bảo đảm chúng bị đẩy trở lại Địa Ngục nơi chúng thuộc về. Bạn khá tự tin rằng thật khó cho một con ác quỷ trốn khỏi các Địa Ngục, có lẽ cần đến sự giúp đỡ của những kẻ theo tà giáo ác quỷ để làm được điều đó.\nVậy để săn một con ác quỷ, bạn cần hiểu rõ về điểm yếu riêng của chúng, cách cô lập chúng khỏi đám tay sai có lẽ đông đảo đang chờ triệu hồi chúng trở lại, và một lòng can đảm to lớn. Bạn đã có điều sau, giờ là lúc rèn luyện hai điều đầu."
 POD_inquihunt.80.option.a: "Tôi đã sẵn sàng hơn bao giờ hết."
 POD_inquihunt.80.option.b: "Tôi muốn biết mọi thứ có thể biết về con ác quỷ này."
 hunt_demon_abyss_tt: "Con ác quỷ này sẽ mất hết danh hiệu và bị đưa trở lại Ngục Tù Vực Thẳm."

 POD_inquihunt.81.t: "Trừ Tà Nhập Môn"
 POD_inquihunt.81.desc: "Mọi thứ diễn ra đúng như kế hoạch. Bạn thu thập được tin tức quan trọng về con ác quỷ này, bao gồm một phần [Glossary('True Name','podgloss.truename')] của nó, trước khi bắt tay xử lý giáo đoàn của nó. May mắn là, những kẻ sùng bái thường không quá thông minh (nếu không thì chúng đã không trở thành kẻ sùng bái theo ý bạn) nên bạn đã thành công đánh lừa chúng và đẩy chúng vào một chuyến đi vô vọng của kẻ ngốc.\nCái đẹp của việc này là bạn chưa từng phải đối mặt trực tiếp với con ác quỷ. Chỉ cần tìm ra điểm neo linh hồn của nó với thế giới này, dùng mảnh [Glossary('True Name','podgloss.truename')] của nó và thực hiện một cuộc trừ tà (có thể nói là khá phức tạp) để buộc linh hồn nó thoát ra khỏi vật chủ. Khi đã "được giải thoát", lực hút của Ngục Tù Vực Thẳm đã làm phần việc còn lại cho bạn.\nMột cuộc săn được thực hiện hoàn hảo."
 POD_inquihunt.81.option.a: "Chuyến đi miễn phí trở về nhà giam của ngươi."

 POD_inquihunt.82.t: "Thợ Săn Đối Đầu Ác Quỷ"
 POD_inquihunt.82.desc: "Đối phó với những kẻ sùng bái của con ác quỷ khá dễ, một vài mánh gây hiểu lầm lợi dụng lòng cuồng tín bất chính của chúng đã có hiệu quả. Con ác quỷ chính nó lại là một vấn đề hoàn toàn khác. Chúng đã che giấu mọi thứ liên quan tới [Glossary('True Name','podgloss.truename')] hay điểm neo linh hồn của chúng với thế giới này dưới quá nhiều lớp dối trá đến mức bạn cũng đã bị dẫn lạc đường nhiều lần trên đường đi.\nBạn "nghĩ" mình đã có một đầu mối nhưng giờ bạn đang cẩn trọng, vì lần theo nó có thể là một trong nhiều cái bẫy mà mục tiêu của bạn để lại để đối phó với những mối đe dọa như chính bạn. Nếu bạn kích hoạt nó và để lộ mình với con ác quỷ, mọi thứ sẽ trở nên khá... khó chịu. Bạn khôn ngoan chọn bỏ cuộc truy đuổi lúc này. Bạn luôn có thể tiếp tục sau, khi hy vọng dấu vết có thể dẫn tới bạn đã nguội lạnh."

 POD_inquihunt.83.t: "Xuống Địa Ngục Với Ngươi"
 POD_inquihunt.83.desc: "Bạn đã quá chắc chắn rằng lần này mình có đầu mối đúng. Sau vô số tin tức giả và thông tin gây hiểu lầm, cuối cùng bạn đã thu thập được thứ mà bạn nghĩ là một phần [Glossary('True Name','podgloss.truename')] của con ác quỷ và vị trí điểm neo linh hồn của nó. Cuối cùng có được thứ gì đó cụ thể để chứng minh cho công sức của mình, bạn liền vội vàng dùng đầu mối đó để bắt đầu cuộc trừ tà của mình... và rơi thẳng vào một cái bẫy.\nKhi những kẻ sùng bái đang tụng niệm thành vòng tròn quanh bàn thờ nơi bạn bị xích lại và con ác quỷ chính nó đang hứa hẹn cho bạn sự tra hình ngọt ngào, bạn lạ lùng thấy mình chủ yếu đang tự hỏi liệu Địa Ngục có thật sự tồn tại không. Bạn có cảm giác khó chịu rằng mình sẽ sớm biết được câu trả lời."
 POD_inquihunt.83.option.a: "Chuyến đi một chiều cuối cùng."

 POD_inquihunt.110.t: "Thợ Săn Mộng Cảnh"
 POD_inquihunt.110.desc: "Có rất nhiều truyền thuyết xoay quanh tộc Fae bí ẩn... điều thực ra chẳng giúp được gì trong việc săn chúng vì hầu hết đều mâu thuẫn nhau. Xuyên thủng lớp dối trá cố ý bao quanh những sinh vật này không dễ dàng, nhưng bạn đã cố gắng nắm được một sự thật quan trọng: sắt lạnh có thể giết được chúng.\nGiờ đây, chỉ cần bước vào một trong những "triều đình" của chúng cũng chẳng khác nào một bản án tử hình. Fae được biết là những kẻ lừa lọc bậc thầy, ẩn mình sau lớp lớp ảo ảnh. Nhưng chúng có một điểm yếu nơi sự quan tâm đến loài người. Nếu bạn khiến mình trở nên đủ thú vị, có lẽ bạn có thể được mời vào và đủ gần mục tiêu để ra tay..."
 POD_inquihunt.110.option.a: "Tôi phải mơ lớn."
 POD_inquihunt.110.option.b: "Tôi muốn con dao sắt lạnh tốt nhất mà vàng có thể mua được."

 POD_inquihunt.111.t: "Hồi Kết Của Một Giấc Mơ"
 POD_inquihunt.111.desc: "Cũng cần một chút chuẩn bị nhưng bạn đã khiến mình trông đủ thú vị để thu hút sự chú ý của các nàng tiên địa phương. Đóng vai một người phàm ngây ngô bị mê hoặc bởi những sinh vật kỳ dị ấy, bạn theo chúng vào thế giới kỳ diệu lạ thường của chúng. Giữ được sự tỉnh táo dù xung quanh hỗn loạn, bạn thu hút được sự chú ý của mục tiêu, kẻ lẩm bẩm điều gì đó về việc chiết "glamour" từ bạn.\nMột khi đã ở nơi kín đáo, và trước khi chúng có thể làm bất cứ điều gì đã định, con dao sắt lạnh của bạn đã cắt qua cổ họng chúng. Bạn đã rời khỏi triều đình fae vài phút sau đó mà không ai hay biết."
 POD_inquihunt.111.option.a: "Trở về thực tại."

 POD_inquihunt.112.t: "Những Đêm Không Mộng"
 POD_inquihunt.112.desc: "Dù đã nỗ lực hết mình để khiến mình trông hấp dẫn với tộc Fae kỳ lạ, bạn đã đi vào ngõ cụt. Có lẽ bạn chưa hoàn toàn hiểu được điều chúng tìm kiếm ở một người phàm, hoặc có lẽ chúng đơn giản là đã nhận ra ý định thật của bạn.\nDù trường hợp nào, triều đình Fae, và mục tiêu của bạn, vẫn ngoan cố khép chặt với bạn. Với việc chúng có lẽ đã nhận ra ý định của bạn, xông vào lúc này sẽ là một ý tưởng rất tệ. Bạn sẽ phải chờ một cơ hội khác."

 POD_inquihunt.113.t: "Từ Mộng Đến Ác Mộng"
 POD_inquihunt.113.desc: "Bạn nhận ra điều gì đó đã sai lệch ngay trong triều đình Fae. Trước đó, bạn nghĩ màn trình diễn khiến mình trông đủ thú vị để thu hút sự chú ý của mục tiêu đang diễn ra hoàn hảo. Chính lúc chúng bắt đầu xúm lại quanh bạn và không gian quanh bạn chuyển sang một tông màu tối tăm hơn hẳn, bạn mới hiểu ra sai lầm to lớn mình đã gây ra.\nBạn không biết bằng cách nào hay khi nào nhưng chắc chắn là chúng đã nhận ra bạn mang theo sắt lạnh, một điều cấm kỵ nghiêm trọng, vào nhà của chúng. Cũng chắc chắn không kém rằng ác mộng cuối cùng của bạn chỉ mới vừa bắt đầu."
 POD_inquihunt.113.option.a: "...và nó sẽ không bao giờ kết thúc."

 POD_inquihunt.7010.t: "Sẵn Sàng Ra Tay"
 POD_inquihunt.7010.desc: "Những sinh vật của màn đêm luôn khổ công che giấu hoạt động của mình, vì chúng biết rằng bí mật là điều duy nhất bảo toàn sự sống của chúng.\n\nĐôi khi, một trong số chúng sẽ để lộ sơ hở.\n\nĐây chính là một cơ hội như thế."
 POD_inquihunt.7010.a: "Cuộc săn bắt đầu."
 POD_inquihunt.7010.b: "Để lúc khác."
         
