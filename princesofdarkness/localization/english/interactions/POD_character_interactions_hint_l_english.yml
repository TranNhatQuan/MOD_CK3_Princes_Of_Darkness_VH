l_english:
 POD_hint_fog_of_war_interaction: "#difficulty_hard Nhân Vật Chưa Rõ#!"
 POD_hint_fog_of_war_interaction_desc: "Bạn không biết gì về nhân vật này, thậm chí không nghe danh tiếng." # TODO: explain fog of war mechanics

 POD_hint_dummy_interaction: "#difficulty_hard Kẻ Bảo Vệ Mod#!"
 POD_hint_dummy_interaction_desc: "[recipient.GetShortUIName] cần tồn tại để một số đoạn script trong mod này hoạt động được. Nếu bạn thấy [recipient.GetHerHim] trong triều đình của mình, chỉ cần mỉm cười và vẫy tay. [recipient.GetSheHe|U] sẽ biến mất trong chốc lát."

 POD_hint_apocalyptic_interaction: "#difficulty_hard Giấc Ngủ Vĩnh Hằng#!"
 POD_hint_apocalyptic_interaction_desc: "Không ai biết tung tích của [recipient.GetShortUINamePossessive]. Về mọi mặt, [recipient.GetSheHe|U] đã mất tích vĩnh viễn."

 POD_hint_torpor_interaction: "#difficulty_hard Đang Miên Trạng#!"
 POD_hint_torpor_interaction_desc: "[recipient.GetShortUIName] đang trong trạng thái bất động hoàn toàn, khiến hầu hết các tương tác đều không thể thực hiện."

 POD_hint_umbra_trapped_interaction: "#difficulty_hard Mắc Kẹt Trong Umbra#!"
 POD_hint_umbra_trapped_interaction_desc: "[recipient.GetShortUIName] đang mắc kẹt trong một khu vực nguy hiểm của [umbra|E].\n\nKhông thể giao tiếp được, trừ khi bạn tìm được cách đưa [recipient.GetHerHim] ra ngoài."

 POD_hint_umbra_interaction: "#difficulty_hard Bên Kia Bức Màn#!"
 POD_hint_umbra_interaction_desc: "Bạn hoặc [recipient.GetShortUIName] đang ở trong [umbra|E], khiến việc giao tiếp trở nên bất khả thi.\n\nBạn có thể vượt qua giới hạn này nếu cả hai bên đều có cách liên lạc với những thực thể ở phía bên kia."

 POD_hint_wight_interaction: "#difficulty_hard Dã Thú#!"
 POD_hint_wight_interaction_desc: "[recipient.GetShortUIName] đã hoàn toàn mất đi tâm trí của [recipient.GetHerHis] mình. Giờ đây [recipient.GetSheHe] chỉ còn hành động theo bản năng thú tính thuần túy."

 POD_hint_robotic_interaction: "#difficulty_hard Cấu Trúc Nhân Tạo#!"
 POD_hint_robotic_interaction_desc: "Thực thể này được ban sự sống thông qua một dạng ma thuật nào đó. Nó có thể thực hiện các việc đơn giản và tuân theo lệnh, nhưng không làm được gì hơn."

 POD_hint_hostile_splat_interaction: "#difficulty_hard Splat Thù Địch#!"
 POD_hint_hostile_splat_interaction_desc: "Nhân vật này coi [splat|E] của bạn là kẻ tử thù. Họ không có ý định thực hiện bất kỳ giao thiệp ngoại giao nào với đồng loại của bạn."
