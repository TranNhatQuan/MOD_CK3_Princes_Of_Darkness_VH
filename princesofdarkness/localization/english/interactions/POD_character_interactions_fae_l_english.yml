 POD_oath_of_secrecy_interaction: "Lời Thề Giữ Bí Mật"
 POD_oath_of_secrecy_interaction_desc: "Một Lời Thề bảo vệ thông tin quý giá."
 POD_oath_of_secrecy_interaction_tooltip: "[recipient.GetFirstName] sẽ trở thành [GetTrait('oathbreaker').GetName( GetPlayer )] nếu [recipient.GetSheHe] để lộ bí mật của ngươi."
 oath_of_secrecy_opinion: "Lời Thề Giữ Bí Mật"
 oath_of_secrecy_modifier: "Lời Thề Giữ Bí Mật"
 oath_of_secrecy_modifier_desc: "Khi Sương Mù bao trùm tâm trí người phàm và cánh cổng [UmbraGlossary('arcadia')] còn chưa ai tìm thấy, ta xin giữ kín và bí mật những gì ta biết được trong thời khắc và nơi chốn này. Nó sẽ không bao giờ thoát khỏi môi ta, kẻo đêm sẽ hóa thành ngày và mọi điều bị giấu kín sẽ bị phơi bày.\n#weak Nhân vật sẽ trở thành [GetTrait('oathbreaker').GetName( GetPlayer )] nếu để lộ bí mật của đối tượng lời thề.#!"

 POD_oath_of_guardianship_interaction: "Lời Thề Bảo Hộ"
 POD_oath_of_guardianship_interaction_desc: "Lời Thề bảo vệ một người, một nơi chốn hoặc một vật."
 POD_oath_of_guardianship_interaction_tooltip: "[recipient.GetFirstName] sẽ trở thành [GetTrait('oathbreaker').GetName( GetPlayer )] nếu [secondary_recipient.GetFirstName] chết."
 recipient_secondary_POD_oath_of_guardianship_interaction: "Người Được Thề Bảo Hộ"
 oath_of_guardianship_opinion: "Lời Thề Bảo Hộ"
 oath_of_guardianship_modifier: "Lời Thề Bảo Hộ"
 oath_of_guardianship_modifier_desc: "Như mặt trời canh giữ Trái Đất ban ngày; như những vì sao canh giữ ban đêm, ta cũng sẽ phụng sự ngươi như thế. Đây là bổn phận của ta. Ta sẽ không bỏ rơi ngươi cho tới thời khắc đã hứa, kẻo những vì sao sẽ nhắm mắt và ngủ yên.\n#weak Nhân vật sẽ cố gắng cứu đối tượng lời thề khỏi bị sát hại.\nNhân vật sẽ trở thành [GetTrait('oathbreaker').GetName( GetPlayer )] nếu đối tượng lời thề chết.#!"

 POD_oath_of_truehearts_interaction: "Lời Thề Chân Tâm"
 POD_oath_of_truehearts_interaction_desc: "Lời Thề mà những cặp tình nhân trong hàng Kithain thề nguyện với nhau."
 POD_oath_of_truehearts_interaction_tooltip: "[recipient.GetFirstName] sẽ trở thành [GetTrait('oathbreaker').GetName( GetPlayer )] nếu [recipient.GetSheHe] ăn nằm với người khác."
 oath_of_truehearts_opinion: "Lời Thề Chân Tâm"
 oath_of_truehearts_modifier: "Lời Thề Chân Tâm"
 oath_of_truehearts_modifier_desc: "Ta trao cho ngươi món quà là chính bản thân ta. Hãy nhận lấy nó thật tự nguyện; nó được trao đi tự nguyện, và từ nay ngươi mãi mãi giữ ta trong vòng tay ngươi. Ta thề yêu ngươi và trao cho ngươi lời hứa hôn ước. Nguyện những ai canh giữ tình yêu sẽ canh giữ lời thề này và những ai giữ vững nó, và nguyện chúng ta không bao giờ bị chê trách trong mắt họ.\n#weak Nhân vật sẽ cố gắng không ăn nằm với người khác.\nNhân vật sẽ trở thành [GetTrait('oathbreaker').GetName( GetPlayer )] nếu đã ăn nằm với người khác.#!"

 POD_fae_interactions.300.t: "$murder_save_header$ Người Bảo Hộ Lời Thề"
 POD_fae_interactions.300.desc.assassin: "Sát thủ của ta đã thất bại trong việc giết [target.GetTitledFirstName]! Rõ ràng Người Bảo Hộ Lời Thề [oath_guardian.GetTitledFirstName] của [target.GetFirstNamePossessiveNoTooltip] đã can thiệp, xuất hiện vài giây trước khi vụ giết người xảy ra và hạ sát kẻ giết thuê của ta."
 POD_fae_interactions.300.desc.thugs: "Đám côn đồ ta thuê để giết [target.GetTitledFirstName] đã thất bại trong nhiệm vụ của chúng! Bất chấp sự hung tợn của chúng, Người Bảo Hộ Lời Thề của [target.GetFirstNamePossessiveNoTooltip] đã có thể giữ [target.GetHerHim] khỏi bị tổn hại đủ lâu để lính gác của [target.GetHerHis] kịp tập hợp lại và hạ sát đám cướp còn lại."
 POD_fae_interactions.300.desc.mob: "Trong khi đám đông ta xúi giục để giết [target.GetTitledFirstName] đã kéo được [target.GetHerHim] khỏi lưng ngựa của [target.GetHerHis], chúng không thể hoàn tất công việc trước khi Người Bảo Hộ Lời Thề của [target.GetFirstNamePossessiveNoTooltip] can thiệp. [oath_guardian.GetSheHe|U] đã không thương tiếc hạ sát đám dân đen trong tầm tay của [target.GetFirstNameNoTooltip] và khiến những kẻ còn lại khiếp sợ bỏ chạy."
 POD_fae_interactions.300.desc.lured_into_forest: "Ta cứ tưởng kế hoạch khiến [target.GetTitledFirstName] lạc trong rừng đã diễn ra hoàn hảo khi màn đêm buông xuống mà không có dấu hiệu nào của [target.Custom('GirlBoy')] lạc lối.\n\nThật không may, đúng lúc ta chuẩn bị đi ngủ thì ta nhận được tin rằng Người Bảo Hộ Lời Thề của [target.GetFirstNamePossessiveNoTooltip] đã ra khỏi rừng cùng với [target.Custom('GirlBoy')] đi theo sau. Rõ ràng [oath_guardian.GetSheHe] đã tự [oath_guardian.GetHerselfHimself] lần theo dấu vết của [target.GetFirstNamePossessiveNoTooltip] xuyên qua rừng và tìm thấy cậu ta ngay trước khi đám thú đói làm điều đó."
 POD_fae_interactions.300.desc.child_pushed: "Cái [target.Custom('GirlBoy')] ngu ngốc nhỏ bé lẽ ra sẽ là [target.GetTitleAsNameNoTooltip] đã ngu ngốc đến mức sa vào bẫy của ta! [target.GetFirstName] trèo lên mép ban công đúng như kế hoạch, và tay sai của ta đẩy [target.GetHerHim] rơi xuống khoảng không...\n\n..Nhưng cú ngã lẽ ra phải chí mạng thì lại không, khi [target.GetSheHe] được Người Bảo Hộ Lời Thề của [target.GetHerHis] đỡ lấy ngay trước khi chạm đất. [target.GetSheHe|U] sống sót để thấy ngày mai, và khó có khả năng sẽ mắc bẫy đó lần nữa."
 POD_fae_interactions.300.oath_guardian_dies: "\n\nÍt nhất thì [oath_guardian.GetFirstNameNoTooltip] sẽ không còn làm phiền ta nữa, vì [oath_guardian.GetSheHe] đã chết vì vết thương của [oath_guardian.GetHerHis]."
 POD_fae_interactions.300.a: "Xong rồi..."
 POD_fae_interactions.300.b: "... Chưa xong cho tới khi ta nói là xong!"
 POD_fae_interactions.301.t: "$murder_save_header$ Người Bảo Hộ Lời Thề"
 POD_fae_interactions.301.desc.assassin: "Hôm nay ta suýt #EMP chết#!! Nếu [oath_guardian.GetFirstName] không nhận ra điều bất thường và theo ta về phòng riêng, giờ ta đã là một xác chết.\n\nĐiều đầu tiên ta nghe thấy về tên sát thủ là [oath_guardian.GetFirstNameNoTooltip] lao vào vật ngã ai đó xuống đất ngay phía sau ta, và sau đó mọi thứ chỉ còn là một mớ hỗn loạn dao găm và nắm đấm cho tới khi kẻ tấn công nằm chết."
 POD_fae_interactions.301.desc.assassin.oath_guardian_dies: "\n\nĐáng buồn thay, [oath_guardian.GetFirstNameNoTooltip] đã phải trả giá đắt nhất. Dù tên sát thủ đã chết, vết thương của [oath_guardian.GetHerHis] cũng đã trở nên chí mạng."
 POD_fae_interactions.301.desc.thugs: "Ta đang di chuyển cùng đoàn tùy tùng thì một tiếng hét vang lên từ một lùm cây. "Tấn công! Nhắm vào [ROOT.Char.GetTitleTierName]!" Một cuộc phục kích!\n\nĐây không phải bọn cướp tầm thường nhắm vào vàng bạc của ta, mà là côn đồ nhắm vào tính mạng ta! Người Bảo Hộ Lời Thề của ta, [oath_guardian.GetFirstNameNoTooltip], lao đến bảo vệ ta, đặt thân mình [oath_guardian.GetHerHis] giữa lũ cướp khát máu và ta.\n\n[oath_guardian.GetFirstNameNoTooltip|U] tổ chức một cuộc rút lui vừa đánh vừa chạy khi kẻ thù của ta áp sát vị trí với lưỡi kiếm vung lên, nhưng chẳng bao lâu những lính gác khác của ta đã kịp tập hợp để bảo vệ chúng ta và hạ gục những kẻ tấn công còn lại."
 POD_fae_interactions.301.desc.thugs.oath_guardian_dies: "Chỉ khi cuộc giao tranh đã lắng xuống thì [oath_guardian.GetSheHe] mới khuỵu xuống đất, và ta phát hiện ra vết thương sâu của [oath_guardian.GetHerHis]. [oath_guardian.GetSheHe] đã thực sự bảo vệ ta cho tới giây phút cuối cùng..."
 POD_fae_interactions.301.desc.mob: "Ta đang cưỡi ngựa qua các con phố của [home_province.GetName] thì một đám dân đen la hét và gào thét ùa vào đoàn tùy tùng của ta. Trước khi ta kịp nhận ra chuyện gì đang xảy ra, đám thường dân đã kéo ta khỏi lưng ngựa và bắt đầu đánh đập ta!\n\nNgười Bảo Hộ Lời Thề của ta, [oath_guardian.GetFirstName], lao đến bảo vệ ta với [oath_guardian.Custom('signature_weapon')] trong tay, không thương tiếc [oath_guardian.Custom('SignatureWeaponWoundVerb1PresentParticiple')] vào đám dân đen đang đánh ta và, có lẽ không mấy hào hoa, bảo vệ ta khỏi bị tổn hại thêm khi ta bị chôn vùi dưới xác của chúng."
 POD_fae_interactions.301.desc.mob.oath_guardian_lives: "\n\nSau khi tiếng giao tranh ngừng lại, [oath_guardian.GetFirstNameNoTooltip] lăn các xác chết khỏi người ta và đỡ ta đứng dậy. Ngoài chúng ta ra, con phố giờ đã vắng tanh, tất cả những kẻ âm mưu đều đã chết hoặc bỏ chạy."
 POD_fae_interactions.301.desc.mob.oath_guardian_dies: "\n\nKhi ta tự thoát ra khỏi đống xác chết, con phố đã vắng tanh ngoại trừ thi thể của những kẻ đã ngã xuống — [oath_guardian.GetFirstNameNoTooltip] cũng ở trong số đó."
 POD_fae_interactions.301.desc.lured_into_forest: "Ta đang chơi trốn tìm với vài cận thần trong rừng thì nhận ra đã rất lâu rồi ta không nghe thấy ai tìm mình. Quá lâu.\n\nTa gọi to, nhưng không nghe thấy gì. Ta đã bị bỏ rơi... Ta cố tìm đường về nhà, nhưng không biết đường nào ra đường nào, và trời tối rất nhanh.\n\nChẳng bao lâu ta có thể nghe thấy lũ thú di chuyển giữa những hàng cây, nhưng trước khi chúng có thể tiếp cận ta thì Người Bảo Hộ Lời Thề của ta, [oath_guardian.GetFirstName], đã ở đó, thở hổn hển và cầm một ngọn đuốc đang cháy. Ngọn lửa dường như xua đuổi được lũ thú, chúng giữ khoảng cách trong khi [oath_guardian.GetSheHe] hổn hển nói "Đi nào... về nhà... thưa chủ nhân của ta...""
 POD_fae_interactions.301.desc.child_pushed: "\n\n#EMP RẦM#!\n\nTa đã ngã vào vòng tay của Người Bảo Hộ Lời Thề của ta, [oath_guardian.GetFirstNameNoTooltip]. "Đứa trẻ ngốc nghếch! Nếu ta không đến kịp lúc... thôi bỏ đi. Hãy để ta đưa ngươi đến nơi an toàn.""
 POD_fae_interactions.301.owner_discovered: "\n\nChỉ có một người có thể là kẻ chịu trách nhiệm cho cuộc tấn công này: [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 POD_fae_interactions.301.a: "Ai lại muốn #EMP ta#! phải chết chứ?"
 POD_fae_interactions.301.b: "[owner.GetSheHe|U] sẽ phải trả giá cho việc này!"

