 POD_fae_interactions.601.t: "Người Kế Vị Xứng Đáng"
 POD_fae_interactions.601.desc: "Người hầu của ngươi mang đến kẻ phù hợp nhất với mọi tiêu chí của ngươi, giờ là lúc biến tiên linh này thành người kế vị của ngươi."
 POD_fae_interactions.601.a: "Tiến hành nhận nuôi."

 POD_fae_interactions.610.t: "Rèn Giũa Tính Cách"
 POD_fae_interactions.610.desc: "Vừa mới trở thành fae, người kế vị mới của ngươi đã bỏ lỡ rất nhiều trải nghiệm sống nơi thế giới thực. Là bậc cha mẹ, ngươi nên dạy cho người kế vị của mình cách thực sự nhìn nhận thế giới, và ngươi vừa tìm được cơ hội để làm điều đó."
 POD_fae_interactions.610.skip: "Có lẽ để lần sau"
 POD_fae_interactions.611.a: "Hãy táo bạo, ngay cả khi gặp rắc rối."
 POD_fae_interactions.611.b: "Hãy cẩn trọng nếu rắc rối xảy đến."
 POD_fae_interactions.612.a: "Ngươi có thời gian."
 POD_fae_interactions.612.b: "Hãy thể hiện cơn thịnh nộ của ngươi."
 POD_fae_interactions.613.a: "Chung thủy với người bạn đời của ngươi."
 POD_fae_interactions.613.b: "Tình yêu là dành cho tất cả mọi người."
 POD_fae_interactions.614.a: "Ngươi vậy là ổn rồi."
 POD_fae_interactions.614.b: "Hãy vươn xa hơn nữa."
 POD_fae_interactions.615.a: "Ngươi có một chính nghĩa."
 POD_fae_interactions.615.b: "Thời gian đứng về phía chúng ta."
 POD_fae_interactions.616.a: "Luôn có một con đường khác."
 POD_fae_interactions.616.b: "Cứ giữ nguyên như ngươi vốn là."
 POD_fae_interactions.617.a: "Báo thù là vĩnh cửu."
 POD_fae_interactions.617.b: "Hận thù không phải là mấu chốt."
 POD_fae_interactions.618.a: "Vàng bạc không phải là điều đáng bận tâm."
 POD_fae_interactions.618.b: "Không gì có thể thành nếu thiếu tiền bạc."
 POD_fae_interactions.619.a: "Ngươi có thể tin người khác."
 POD_fae_interactions.619.b: "Ngươi không thể tin bất kỳ ai."
 POD_fae_interactions.620.a: "Hãy trung thực."
 POD_fae_interactions.620.b: "Một lời nói dối nhỏ chẳng hại gì."
 POD_fae_interactions.621.a: "Ngươi chỉ là một trong số nhiều người."
 POD_fae_interactions.621.b: "Ngươi thật xuất chúng."
 POD_fae_interactions.622.a: "Luật pháp trên hết."
 POD_fae_interactions.622.b: "Ngươi trên hết."
 POD_fae_interactions.623.a: "Hãy cho nó thời gian."
 POD_fae_interactions.623.b: "Thời gian không chờ đợi ai."
 POD_fae_interactions.624.a: "Thú vui chỉ là sự xao nhãng."
 POD_fae_interactions.624.b: "Hãy tận hưởng cuộc sống của ngươi."
 POD_fae_interactions.625.a: "Niềm tin là chìa khóa."
 POD_fae_interactions.625.b: "Hãy phản bội thế giới trước khi nó phản bội ngươi."
 POD_fae_interactions.626.a: "Trung thành với con đường của ngươi."
 POD_fae_interactions.626.b: "Con đường của ngươi không quá quan trọng."
 POD_fae_interactions.627.a: "Hãy tử tế."
 POD_fae_interactions.627.b: "Nghĩ cho bản thân trước tiên."
 POD_fae_interactions.627.c: "Hãy sẻ chia nỗi đau của ngươi với thế giới."
 
