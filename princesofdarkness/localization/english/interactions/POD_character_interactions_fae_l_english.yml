 POD_fae_interactions.701.a: "Tâm trí ta mở rộng. Và cùng với nó, là những khả năng."
 POD_fae_interactions.701.a.tt: "Ngài đã học được [Glossary('True Name','podgloss.truename')] của [trait|E] [GetPlayer.MakeScope.Var('current_journey').Var('target_trait').Trait.GetName(GetPlayer)]."
 
