l_english:
 POD_hunt_target_interaction: "Săn Đuổi"
 POD_hunt_target_interaction_desc_vampire: "Lên [journey|E] để săn đuổi [recipient.GetShortUINameNoTooltip]. Ngươi sẽ có thể rút máu [recipient.GetHerHis] để bổ sung nguồn dự trữ."
 POD_hunt_target_interaction_effect_vampire: "Ngươi sẽ lên [journey|E] để săn đuổi [recipient.GetShortUIName] và uống máu [recipient.GetHerHis|l]."
 POD_hunt_target_interaction_desc_chi: "Lên [journey|E] để săn đuổi [recipient.GetShortUINameNoTooltip]. Ngươi sẽ có thể rút máu [recipient.GetHerHis] để bổ sung Ý Chí."
 POD_hunt_target_interaction_desc_banemummy: "Lên [journey|E] để săn đuổi [recipient.GetShortUINameNoTooltip]. Ngươi sẽ có thể ăn thịt [recipient.GetHerHis] để bổ sung Ý Chí."
 POD_hunt_target_interaction_effect_banemummy: "Ngươi sẽ lên [journey|E] để săn đuổi [recipient.GetShortUIName] và ăn thịt [recipient.GetHerHis|l]."
 POD_hunt_target_interaction_monthly: "[journey|E] này sẽ có [planning_speed|E] là $hunt_journey_monthly_num$ mỗi tháng."
 
 POD_wake_from_torpor_interaction: "Tìm Nơi Ẩn Náu"
 POD_wake_from_torpor_interaction_desc: "Lên [journey|E] để tìm ra vị trí chính xác của con ma cà rồng đang Miên trạng này. Sau đó, ngươi có thể mời [recipient.GetHerHim] đến triều đình của ngươi, hoặc tấn công [recipient.GetHerHim]..."
 POD_wake_from_torpor_interaction_effect: "Ngươi sẽ lên [journey|E] để tìm ra vị trí chính xác của con ma cà rồng đang Miên trạng này. Sau đó, cuộc săn đuổi sẽ bắt đầu. Hiển nhiên, rủi ro liên quan là không nhỏ..." 
 POD_wake_from_torpor_interaction_monthly: "#help [planning_speed|E] của [journey|E] này dựa trên [intrigue_skill|E] của ngươi và mục tiêu.#!"
 
 POD_assault_lair_interaction: "Tìm Sào Huyệt"
 POD_assault_lair_interaction_desc: "Lên [journey|E] để tìm ra vị trí chính xác của con quái vật này. Sau đó, cuộc săn đuổi sẽ bắt đầu. Hiển nhiên, rủi ro liên quan là không nhỏ..."
 POD_assault_lair_interaction_infiltration: "@death_icon!#N;bold Vì [recipient.GetShortUIName] có cấp bậc [kingdom|E] hoặc cao hơn, ngươi chỉ có thể săn đuổi [recipient.GetHerHim] bằng cách trực tiếp [infiltrating|E] sào huyệt của [recipient.GetHerHis].#!"
 POD_assault_lair_interaction_effect: "Ngươi sẽ lên [journey|E] để tìm ra vị trí chính xác của con quái vật này. Sau đó, cuộc săn đuổi sẽ bắt đầu. Hiển nhiên, rủi ro liên quan là không nhỏ..." 
 POD_assault_lair_interaction_monthly: "#help [planning_speed|E] của [journey|E] này dựa trên nhiều yếu tố, như tuổi tác, cấp bậc, [intrigue|E], [masquerade_exposure|E] của mục tiêu, và nhiều yếu tố khác.#!"
 POD_assault_lair_interaction_instant: "#help Vì ngươi đã [GetModifier('tracked_down_modifier').GetNameWithTooltip|L] mục tiêu, [journey|E] sẽ hoàn thành ngay lập tức.#!"

 POD_heist_interaction_hostile_warning: "@death_icon!#N;bold [recipient.GetFirstNamePossessiveNoTooltip] [splat|E] thù địch với ngươi. [infiltration|E] này sẽ nguy hiểm hơn bình thường rất nhiều, và nếu thất bại, ngươi sẽ bị #R hành quyết#! thay vì giam giữ.#!"
 POD_heist_interaction_wary: "@warning_icon! #X [recipient.GetShortUINameNoTooltip] [GetModifier('wary_of_infiltrators_modifier').GetNameWithTooltip]#!"
 POD_heist_interaction_dont_scout: "Bản đồ sẽ #N;bold không#! được tiết lộ trước."
 POD_heist_interaction_scout: "Bản đồ #P;bold sẽ#! được tiết lộ, nhưng [planning_phase|E] sẽ kéo dài gấp ba lần."
 POD_heist_interaction_one_key: "Mục tiêu của ngươi sẽ nằm trong một hầm chứa #N;bold bị khóa#!. Ngươi sẽ phải tìm ra chìa khóa trong lúc [infiltration|E]."
 POD_heist_interaction_two_keys: "Mục tiêu của ngươi sẽ nằm trong một hầm chứa #N;bold bị khóa#!. Vì đây là một hiện vật quý giá, ngươi sẽ phải tìm ra #N;bold hai chìa khóa#! trong lúc [infiltration|E]."

 POD_gold_heist_interaction: "Trộm Vàng"
 POD_gold_heist_interaction_desc: "Lên [infiltration_mission|E] để trộm [gold|E] từ [recipient.GetShortUINameNoTooltip]"
 POD_gold_heist_dont_scout: "Chuẩn bị nhanh"
 POD_gold_heist_scout: "Trinh sát kỹ càng"
 POD_cant_scout_hostile_heist: "Ngươi không thể thu thập đủ thông tin về những kẻ tử địch của mình"
 POD_gold_heist_interaction_effect: "Ngươi sẽ lên [infiltration_mission|E] để trộm [gold|E] từ [recipient.GetShortUIName]."
 POD_gold_heist_interaction_monthly: "[journey|E] này sẽ có [planning_speed|E] là $twelve_months_monthly_num$ mỗi tháng."
 POD_gold_heist_interaction_monthly_scouted: "[journey|E] này sẽ có [planning_speed|E] là $three_years_monthly_num$ mỗi tháng."
 POD_gold_heist_interaction_ghoul_mission: "Nếu ngươi trộm được [gold|E] từ [recipient.GetFirstName], ngươi sẽ hoàn thành [bound_ghoul_mission_with_icon|E] của mình là #V $POD_ghoul_mission_steal_rivals_gold_contract$#!."

 POD_artifact_heist_interaction: "Trộm Hiện Vật"
 POD_artifact_heist_interaction_desc: "Lên [infiltration_mission|E] để trộm một [artifact|E] từ [recipient.GetShortUINameNoTooltip]"
 POD_artifact_heist_interaction_effect: "Ngươi sẽ lên [infiltration_mission|E] để trộm [target.Custom('ColorizedArtifactName')] từ [recipient.GetShortUIName]."
 POD_artifact_heist_interaction_monthly: "#help [planning_speed|E] của [journey|E] này dựa trên [stewardship_skill|E] của ngươi.#!"