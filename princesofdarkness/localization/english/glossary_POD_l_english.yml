 ####### Kuei-Jin / Asia glossary

 podgloss.dokhorkhan: "Dokhor-Khan là [Glossary('Diêm Ma Vương','podgloss.yamaking')] của [Glossary('Địa Ngục Xiềng Gai','podgloss.hellspikedchains')].\nTính đến năm 1230, hắn là một trong những [Glossary('Diêm Ma Vương','podgloss.yamaking')] hùng mạnh nhất, và quyền cai trị của hắn trên thảo nguyên gần như không ai dám tranh. Hắn lấy khổ đau và thù hận làm thức ăn, nổi danh với những mưu kế ngang ngược, có lúc liều lĩnh, nhằm áp chế các đối thủ của mình."
 podgloss.hellspikedchains: "Địa Ngục Xiềng Gai là một [UmbraGlossaryLocalized('yomi_wan','Địa Ngục Yomi')] hiện ra thành một đồng bằng mênh mông, phẳng lặng, nơi trú của linh hồn những kẻ phàm đã chết trên thảo nguyên. Mỗi linh hồn ấy bị [Glossary('Diêm Ma Vương','podgloss.yamaking')] [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] phân bừa vào một bộ tộc, và cứ theo kỳ hạn hắn lại chọn ra một bộ tộc làm tộc được sủng ái.\nMọi bộ tộc còn lại bị tước đi một giác quan (hoặc một chi thể) và phải phục tùng tộc được sủng ái trong mọi việc. Nếu chúng dám bất tuân, hoặc chỉ vì một kẻ trong tộc Sủng Ái nổi hứng, chúng sẽ bị đem ra chịu cực hình Xiềng Gai.\nNạn nhân bị trói bằng xiềng sắt gai rèn nơi Yomi rồi treo lên những nhũ đá trong một hang lớn, chẳng biết bao lâu mới thôi. Mỗi lần nạn nhân vùng vẫy, gai sắt lại cắm sâu hơn vào chính bản thể của chúng, mà nuôi béo [Glossary('Diêm Ma Vương','podgloss.yamaking')]."
 podgloss.yamaking: "Diêm Ma Vương, còn được gọi là Ma Vương, là những thực thể hùng mạnh trấn giữ một [UmbraGlossaryLocalized('yomi_wan','Địa Ngục Yomi')].\nNgười ta cho rằng xưa kia chúng từng là phán quan của cõi tử, nhưng theo thời gian đã bị hư hoại, và giờ chúng dùng chính địa vị ấy để tự tôn mình lên trên đồng loại, mong trở thành [Glossary('Ma Hoàng','podgloss.demonemperor')] sẽ lật đổ Thiên Đình.\nDẫu tính khí và sở thích mỗi kẻ mỗi khác, tất cả chúng đều dùng thuộc hạ [akuma|E] để thi hành mưu đồ của mình trong cõi phàm."
 podgloss.dharma: "Với $pod_kueijin$, Pháp Môn là con đường dẫn tới giác ngộ, cho phép chúng siêu thoát khỏi bản tính thú vật và mở ra hy vọng được ngộ đạo, được trở lại vòng Nghiệp Báo. Là loài mang tính ma quỷ, việc giác ngộ với $pod_kueijin$ khó gấp bội, và đường tới minh triết có thể dài đến hàng nghìn năm.\nTheo truyền thống, Ngũ Pháp Môn do Đại La Hán Xue vạch ra (Ma Hổ, Ảnh Ca, Thụy Hạc, Cốt Hoa và Đằng Long) được coi là Pháp Môn chính thống, còn tất cả các pháp môn khác thì ít nhiều đều là dị giáo."
 podgloss.hundredclouds: "Bách Vân là cứu cánh tối hậu của [Glossary('Pháp Môn','podgloss.dharma')]. Nó nghĩa là trút bỏ được nghiệp chướng đọa đày của mình mà trở về vòng luân hồi.\n\"Bách Vân\" là một lối nói ẩn dụ chỉ sự an tịnh tối hậu, cái trạng thái siêu thoát mà đến cả phận sự với Thiên Đình cũng được đặt xuống. Bách Vân không phải là quyền năng, dẫu $pod_kueijin$ hạng thấp có thể nhìn nó như vậy; nó cũng chẳng phải ảo ảnh, dẫu với những kẻ không thấu hiểu thì trông hệt như thế. Khi hòa vào Bách Vân (mà người trí hiểu rằng đó là một biểu tượng, không phải một hội nhóm), một $pod_kueijin$ đạt tới đỉnh cao của bản thể mình, còn cao hơn cả [Glossary('Bồ Tát','podgloss.bodhisattva')]. Phần lớn sau khi lên tới tầm ấy thì rời bỏ thế gian này, biến mất về một chốn không ai hay. Số khác chọn ở lại để dẫn đường cho kẻ hậu sinh."
 podgloss.bodhisattva: "Bồ Tát là những $pod_kueijin$ đã tới được giai đoạn cuối cùng của [Glossary('Pháp Môn','podgloss.dharma')] mà mình đã chọn.\nSố $pod_kueijin$ đạt tới ngôi Bồ Tát tương đối ít ỏi; quá trình ấy mất hàng trăm, thậm chí hàng nghìn năm, mà phần lớn $pod_kueijin$ đã gặp Cái Chết Cuối Cùng hoặc đã khuất phục con quỷ trong lòng từ rất lâu trước khi tới được ngôi ấy. Những kẻ tới được thì là những thực thể mạnh mẽ khôn lường — sánh ngang Methuselah của $pod_cainite$ chẳng chút khó khăn.\nDẫu một số ít vẫn hoạt động trên chính trường, phần lớn thì làm bậc dẫn đạo tinh thần."
 podgloss.arhat: "La Hán là một $pod_kueijin$ đã siêu thoát khỏi [Glossary('Pháp Môn','podgloss.dharma')] của mình mà tới được [Glossary('Bách Vân','podgloss.hundredclouds')], tự giải thoát khỏi lời nguyền của kiếp phi sinh. Phần lớn đã sống hàng trăm năm trước khi siêu thoát được.\nVị La Hán lừng danh và được ghi nhớ nhất là Xue, người đặt ra Ngũ Trùng Đạo sinh ra Ngũ Đại [Glossary('Pháp Môn','podgloss.dharma')] chính thống. Đến nay, nhiều kẻ vẫn cho rằng noi theo Xue mới là con đường chân chính duy nhất dẫn tới Giác Ngộ."
 podgloss.wheelofages: "Bánh Xe Kỷ Nguyên là vòng tuần hoàn vĩnh cửu của tồn tại, trong đó thế gian phải chịu đựng hết những kỷ nguyên khổ ải ngày một sâu dày, cho tới khi vòng xoay chạm đáy và thế gian bắt đầu tự chỉnh lại mà hướng về Cực Lạc một lần nữa.\nNó được phân thành các Kỷ Nguyên, dù mỗi giống loài siêu nhiên lại diễn giải một cách khác nhau. Phần lớn đều đồng ý rằng Kỷ Nguyên cuối cùng trước Cực Lạc sẽ là lúc một [Glossary('Ma Hoàng','podgloss.demonemperor')] trỗi lên, kẻ sẽ tìm cách chặn Bánh Xe lại mà thống trị vĩnh viễn."
 podgloss.demonemperor: "Trong thuyết mạt thế của $pod_kueijin$, Kỷ Nguyên Thứ Sáu sẽ được đánh dấu bằng sự giáng lâm của một chúa tể tối cao của bóng tối và kinh hoàng, kẻ sẽ cai trị thế gian bằng bàn tay sắt (lại còn đầy gai). Ma Hoàng sắp tới ấy sẽ là dấu ấn của cái kỷ nguyên đọa lạc đó, và điều nhân từ duy nhất trong thời hắn là Kỷ Nguyên Thứ Sáu sẽ ngắn ngủi... nếu Vũ Trụ còn vận hành cho đúng lẽ.\n\nĐoán xem ai sẽ thành Ma Hoàng là một thú tiêu khiển được $pod_kueijin$ ưa chuộng. [Glossary('Diêm Ma Vương','podgloss.yamaking')] thì thường cho rằng Ma Hoàng sẽ là một kẻ trong bọn chúng, mà ứng viên hay được nhắc nhất vào năm 1230 là [Glossary('Emma-O','podgloss.emmao')]. Những cái tên hay được nêu khác có Saulot, kẻ có lẽ đã chạm phải thần thoại này khi chu du phương Đông rồi quyết rằng ngự trị làm Ma Hoàng còn hơn là hòa giải với Đấng Toàn Năng."
 podgloss.penangallan: "Bắt nguồn từ một từ Mã Lai chỉ ma cà rồng, Penangallan cuối cùng thành tên gọi chung cho các nữ tộc trưởng $pod_kueijin$ vùng Đông Nam Á. Là môn đồ của [Glossary('Pháp Môn','podgloss.dharma')] Đằng Long và lệch Dương nặng, những $pod_kueijin$ có tinh thần nữ quyền hung hãn này hoặc đang gây dựng một cuộc giải phóng bản ngã trọn vẹn, hoặc đang gây dựng những hang hùm tàn bạo và bệnh hoạn — tùy bạn hỏi ai."
 podgloss.emmao: "Emma-O, chúa tể hắc ám của [Glossary('Kakuri','podgloss.kakuri')], hiện là kẻ được đặt cược nhiều nhất trong cuộc đại chiến giữa các [Glossary('Diêm Ma Vương','podgloss.yamaking')] tranh ngôi [Glossary('Ma Hoàng','podgloss.demonemperor')].\nLà hiện thân tột cùng của Âm Tướng, Emma-O là kẻ sắc sảo, tính toán và tuyệt không có lòng thương xót. Hắn thường hiện ra dưới hình một người đàn ông cao lớn khác thường, râu dài, chuộng vẻ ngoài lông lá, da như đá vỏ chai, khoác vải Ainu thêu hình chiến trận, bệnh dịch và tử vong. Bên hắn thường có những nữ tì [Glossary('Shikome','podgloss.shikome')] xinh đẹp theo hầu.\n\nEmma-O là [Glossary('Diêm Ma Vương','podgloss.yamaking')] duy nhất còn hoạt động dám khoe rằng mình đã thắng được một kẻ đồng hàng, kẻ đó là Yen-Lo, nguyên Phán Quan Cân Bằng."
 podgloss.kakuri: "Còn được gọi là Dạ Giới, Kakuri là một [UmbraGlossaryLocalized('yomi_wan','Địa Ngục Yomi')] do [Glossary('Diêm Ma Vương','podgloss.yamaking')] [Glossary('Emma-O','podgloss.emmao')] cai quản.\nKakuri là một lãnh địa thuộc Âm Tướng, một cõi hư không băng tuyết không ánh sáng, không niềm vui, không danh dự.\nVốn là cõi tử tổ truyền của người Ainu, Kakuri có một lối ra bí mật dành cho những kẻ thờ phụng [Glossary('Emma-O','podgloss.emmao')] từ thuở ban đầu."
 podgloss.shikome: "Đẹp một vẻ đẹp lạnh như băng, Shikome là thích khách, vệ sĩ và thê thiếp của [Glossary('Emma-O','podgloss.emmao')]. Mỗi shikome đều do chính [Glossary('Emma-O','podgloss.emmao')] tự tay tuyển chọn rồi dụ dỗ cẩn thận vào phụng sự hắn. Nhiều nàng thuở còn kiếp phàm từng bị bạo hành, bị bỏ mặc hoặc bị lãng quên, mà nay vui lòng hầu hạ chủ nhân — kẻ mà nơi hắn các nàng tìm thấy đủ cả phẩm chất của một người cha, một người tình và một vị chúa. Đáp lại, hắn tỏ lòng kính trọng các nàng.\n\nNăng lực nguy hiểm nhất của một shikome là tài điều khiển đàn ông. Shikome lấy ý chí của đàn ông làm thức ăn, y như phần lớn $pod_kueijin$ lấy Khí làm thức ăn. Đàn bà thì tự khắc ghê tởm shikome mà tìm cách hãm hại, còn đàn ông thì sẵn sàng làm mọi thứ cho các nàng, dâng các nàng bất cứ điều gì các nàng muốn, và chết vì các nàng chỉ để mong một ánh mắt dịu dàng (thứ mà họ sẽ chẳng bao giờ có được)."
 podgloss.mikaboshi: "Mikaboshi, chúa tể của [Glossary('Thành Đô Tà Nghiệt','podgloss.wickedcity')], là một [Glossary('Diêm Ma Vương','podgloss.yamaking')] xưa từng là học giả và kiến trúc sư người Nhật. Dù còn rất non trẻ so với đồng hàng, chính cái khát vọng cách tân không ngơi nghỉ và mưu đồ dựng nên một \"quốc gia máy móc\" biến nhân loại thành những cái xác rỗng vô hồn đã khiến hắn thành một ngôi sao đang lên, khi các nền văn minh của loài người cứ mở rộng mãi ra."
 podgloss.wickedcity: "Thành Đô Tà Nghiệt là một [UmbraGlossaryLocalized('yomi_wan','Địa Ngục Yomi')] do [Glossary('Diêm Ma Vương','podgloss.yamaking')] [Glossary('Mikaboshi','podgloss.mikaboshi')] cai quản.\nĐó là một cơn mộng dữ của kỹ nghệ hắc ám, phong thủy điên loạn và những học thuyết quản trị nghiền nát linh hồn.\nĐó là nơi mọi thứ tệ hại nhất của lòng tham và của chủ nghĩa vị lợi tụ hội lại trong bầu không khí hư hoại của Yomi. Nó cũng là một trong những [UmbraGlossaryLocalized('yomi_wan','Địa Ngục Yomi')] lớn nhanh nhất."
 podgloss.anda: "Anda là một huyết thống $pod_cainite$ thuộc [GetTrait('gangrel').GetName(GetNullCharacter)], tồn tại giữa người Mông Cổ. Chính chúng tin rằng mình là dòng dõi của Itugen, vị địa mẫu thần trong tín ngưỡng Mông Cổ.\nVì ở gần $pod_kueijin$ về mặt địa vực, chúng thường xảy ra xung đột, mà những cuộc chinh phạt của người Mông Cổ phàm tục lại đang đe dọa làm tình thế tệ đi nhiều."
 podgloss.augustpersonageofjade: "Trong thần thoại $pod_kueijin$, đây là đấng đang trị vì Thiên Đình — dù không còn can dự việc thế gian — và là hiện thân của Tạo Hóa. Khi Kỷ Nguyên Thứ Sáu tới, Ngọc Hoàng sẽ thoái vị, nhường chỗ cho [Glossary('Ma Hoàng','podgloss.demonemperor')]."
 podgloss.infantdevilcivilizer: "Lời khuyên nhủ dịu dàng của cha mẹ có lúc có chỗ của nó, nhưng lúc đang thuần hóa những $pod_kueijin$ hoang dại vừa mới trở về từ [UmbraGlossaryLocalized('yomi_wan','Địa Ngục Yomi')] thì tuyệt không phải lúc. Vào vai ấy là Quan Khai Hóa Ấu Ma, kẻ giám sát công cuộc của các Hội Khai Hóa Ấu Ma ở từng địa phương trong việc thu nhận, chế ngự và hộ tống những linh hồn trở về ấy tới Triều đình gần nhất."
 podgloss.wu: "Cái ý niệm tương trợ lẫn nhau một cách tự nhiên giữa những $pod_kueijin$ đồng chí hướng đã định ra tầng bậc căn bản nhất của giao tiếp và định danh trong xã hội $pod_kueijin$. Chúng tự tổ chức thành từng nhóm năm kẻ (thường là vậy), theo truyền thống gọi là Wu. Một Wu đóng vai gia đình thay thế cho một $pod_kueijin$ trong cơ hội tồn tại lần thứ hai này."
 podgloss.toumu: "$pod_kueijin$ có một kẻ địch đáng gờm trong một [UmbraGlossaryLocalized('yomi_wan','Địa Ngục Yomi')] khủng khiếp hơn mọi chốn khác, và tên nàng ta là Tou Mu.\nTou Mu thuộc hàng độc địa nhất trong các [Glossary('Diêm Ma Vương','podgloss.yamaking')], mà chính cái lòng thâm độc ấy đã đưa nàng ta tới sát ngôi [Glossary('Ma Hoàng','podgloss.demonemperor')]. Thiết Nữ Hoàng là Diêm Ma Nữ Vương nổi danh hơn hết thảy, nổi danh vì lòng thù hận cháy bỏng dành cho Huyết tộc Đông phương.\nCác [Glossary('Diêm Ma Vương','podgloss.yamaking')] khác thì tìm cách làm bọn chúng hư hoại rồi mắc bẫy, còn làm tay sai cho Thiết Nữ Hoàng thì may lắm cũng chỉ là được hoãn án tử."
 podgloss.wuhua: "Wu Hua, chúa tể của Hầm Muối và Sắt, là một [Glossary('Diêm Ma Vương','podgloss.yamaking')]. Dẫu Địa Ngục của hắn và quyền lực chung của hắn nhỏ hơn một số đối thủ, hắn chẳng thua kém ai về sự gian tà.\nBắt tù nhân làm đến rã xương, Wu Hua chỉ chừa ra Thanh Lâu Sắt như một đường thoát khả dĩ, mà rốt cuộc nhiều kẻ chọn rồi lại hối.\nCơ cấu tổ chức của Wu Hua được rập theo lề lối quan liêu của Trung Hoa thời sơ khai. Thuộc hạ biết vâng lời thì được ban thưởng và thăng cấp. Tay sai bất tuân thì bị trừng phạt, rồi cuối cùng bị hủy diệt. Bất cứ sinh vật nào leo lên được qua những tầng bậc méo mó ấy thì hẳn là một sinh vật cực kỳ gian tà và giảo hoạt, phải hết sức dè dặt mà đối đãi."
 podgloss.truename: "Chân Danh của một thực thể vừa là sự tồn tại, vừa là lịch sử, vừa là bản dạng của nó. Đó là một từ bao trùm mọi phần của đối tượng, từ nội tạng cho tới chính linh hồn. Nhiều dạng pháp thuật cho phép người ta triệu gọi Chân Danh của một thực thể khác để tác động tới chính thực tại của nó.\n\nTrong [princes_of_darkness|E], việc học Chân Danh của một nhân vật khác là một [journey|E] chậm rãi mà một số [splats|E] có thể theo. Đó là điều kiện tiên quyết cho một số năng lực — chẳng hạn, #TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L Nhà Quỷ Học#!#! phải biết Chân Danh của một $POD_splat_demon$ mới [diabolism_bind|E] được nó.\n\n$POD_splat_mummy_plural$ dùng Chân Danh rất nhiều, thứ mà họ gọi là #italic Ren#!. Ngoài việc học Ren của các nhân vật, họ còn có một [journey|E] để học Ren của kim loại, cây cỏ và loài vật, dùng vào Nomenclature Hekau của mình."
 
 ####### Historical glossary

 podgloss.kisaeng: "Một kỹ nữ được đào tạo bài bản, hành nghề ca kỹ hợp pháp."
 podgloss.kwanryong_kuibu_koryo_changwan: "Chỉ huy các chiến binh Goryeo đã quy phục."
 podgloss.joseon_gyeonggukjeon: "Một pho sách dày trình bày tỉ mỉ một thể chế cai trị mới, rập theo thể chế Nho giáo Trung Hoa từng dùng dưới Nhà Chu."
 podgloss.uinyo: "Một nữ y sư, chuyên chữa bệnh cho phụ nữ."
 podgloss.sambyeolcho: "Tam Biệt Sao là một nhánh của chính quyền quân sự Goryeo, do gia tộc Ch'oe — hiện đang nắm quyền ở Goryeo — lập nên. Sambyeolcho đảm nhiệm cả chức năng tuần phòng lẫn chiến đấu."
 podgloss.taejo_joseon: "Yi Sǒng-gye là người sáng lập triều Joseon, triều đại sẽ thay thế triều Goryeo bằng một bộ máy cai trị theo Tân Nho giáo."
 podgloss.nobi: "Nobi là những kẻ thuộc tầng lớp nô lệ. Họ bị coi là tài sản hay vật sở hữu, có thể đem mua, bán hoặc ban tặng."
 podgloss.jajewi: "Đội Cấm Vệ Quý Tộc Thiếu Niên gồm những người con trai hứa hẹn nhất của giới quý tộc, được tổ chức để rèn giũa thành thế hệ quan lại trung thành kế tiếp."
 podgloss.hunminjeongeum: "#italic Hunminjeongeum#! — Huấn Dân Chính Âm — là một văn kiện do các học giả Tập Hiền Điện biên soạn nhằm chuẩn hóa và truyền dạy Hangul, thứ chữ viết Triều Tiên do Vua Sejong Đại Đế sáng tạo."
 podgloss.seonbi: "#italic Seonbi#! là các học giả, thường là những người phụng sự dân chúng mà không làm quan. Họ chọn bỏ qua bổng lộc và quyền uy của chốn quan trường để dồn sức phát triển và truyền bá tri thức."
 podgloss.sahwa: "Sĩ hoạ, còn gọi là những cuộc Thanh Trừng Văn Nhân, là các cuộc thanh trừng nhằm vào học giả phái Sarim, một trong hai phe vướng vào cuộc tranh quyền trên chính trường Joseon."
 podgloss.geobukseon: "Quy thuyền là một trong những chiến hạm xung kích đầu tiên từng được thiết kế. Được dựng nên để cơ động dưới làn đạn địch và cản quân Nhật nhảy sang, chúng đã giành về cho thủy quân Joseon rất nhiều thắng lợi."
 podgloss.thai-to: "Miếu hiệu dành cho vị hoàng đế đầu tiên của một triều đại."
 podgloss.tran-trieu: "Những ngôi đền thờ phụng linh hồn Đức Thánh Hưng Đạo, nơi các nữ tư tế trong tín ngưỡng thờ ngài được các hiện thân của ngài nhập vào."
 podgloss.hyangyak: "Hương ước, cái cốt của luật lệ xã hội ở Joseon, cho phép làng xã có một mức độ tự trị."
 podgloss.guyen: "Một quyển đơn lẻ trong một bộ sách lớn hơn."
 podgloss.man_da_la: "Man Đà La, còn gọi là Cà Độc Dược, là một loài hoa trắng linh thiêng khiến người ta rơi vào cơn hôn trầm."
 podgloss.thai_hoc_sinh: "Thái học sinh, kỳ khoa cử cao nhất do triều đình phong kiến Đại Việt tổ chức dưới thời nhà Trần."
 podgloss.hanh_khien: "Hành khiển, viên quan cao cấp chỉ dưới Tể tướng và ngang hàng phó tể tướng. Người được cất lên chức này thì được phép mặc áo đỏ."
 podgloss.chua: "Chúa, một chức vị nắm thực quyền mà hai họ đối đầu Trịnh và Nguyễn dùng để cai trị Đại Việt, trong khi hoàng đế nhà Lê phần lớn chỉ còn là danh hiệu hư vị."
 podgloss.stupa: "Stūpa — bảo tháp — là một kiến trúc hình gò chứa thánh tích, được Phật tử dùng làm nơi thiền định."
 podgloss.binnya_thau: "Vị Vương Hậu Già."
 podgloss.tachiuchi_ni_myo_o_etaru: "Nghệ thuật chém ra tứ phương tám hướng."
 podgloss.chidori: "Thiên Điểu — Nghìn Cánh Chim — là thanh kiếm của một samurai trung nghĩa."
 podgloss.raikiri: "Lôi Thiết — Kẻ Chém Sấm — là thanh kiếm đã chém một vị Thần Sấm ngay trong tia lôi giáng xuống đầu người cầm kiếm."
 podgloss.kensho: "Trong Thiền tông, Kenshō — kiến tính — là sự chợt tỉnh ngộ về bản tính chân thật của mình, cái bản tính chân thật ấy chỉ về Pháp Giới."
 podgloss.nareswari: "Mẹ của những đế vương."
 podgloss.kerbau_yang_menyeberang: "Trâu Lội Qua Sông."
 podgloss.rakryan_patih: "Patih là các Thượng thư ở quần đảo Indonesia, trong đó Rakryan Patih là chức cao trọng nhất, tức Tể tướng nắm việc cai quản vương quốc Majapahit."
 podgloss.kshatriya: "Một trong bốn đẳng cấp xã hội của Ấn giáo, kshatriya gắn với giới quý tộc chiến binh."
 podgloss.miezu: "Tru di cửu tộc là hình án tuyên trong những vụ quốc sự nghiêm trọng nhất, gồm việc tận diệt cả dòng giống của kẻ phạm tội. Cha mẹ, ông bà, con cháu, anh chị em ruột và anh chị em bên vợ bên chồng, chú bác cô dì cùng vợ chồng họ, anh chị em họ, vợ chồng và cha mẹ vợ chồng của kẻ ấy — tất thảy đều bị xử tử, cùng với chính kẻ phạm tội. Những đứa trẻ còn nhỏ thì được tha mạng, nhưng thường bị bán làm nô lệ."
 podgloss.maha_patih: "Vị [Glossary('patih', 'podgloss.rakryan_patih')] lớn nhất có quyền thế đến mức tầm với của ông ta vượt xa phận sự thượng thư thường tình, và được xem như một vị phụ chính hay phó vương hơn là một Tể tướng đơn thuần."
 podgloss.bhayangkara: "Đội cấm vệ tinh nhuệ của Majapahit, chuyên trách bảo vệ tính mạng hoàng đế và hoàng thân."
 podgloss.sumpah_palapa: "Lời thề của Gajah Mada rằng sẽ không nghỉ ngơi cho tới khi đế quốc Majapahit ngự trị khắp quần đảo Nusantara.\n#italic 'Nếu ta đã chinh phục Quần đảo Nusantara, khi ấy ta mới hưởng sự an nghỉ. Nếu ta đã chinh phục Gurun, Seram, Tanjungpura, Haru, Pahang, Dompo, Bali, Sunda, Palembang, Tumasik, khi ấy ta mới hưởng sự an nghỉ.'#!"
 podgloss.kinalakian: "Kinalakian là một đội chiến binh tinh nhuệ toàn nữ bảo vệ vương quốc Talawasi, được phần còn lại của quần đảo xem như những nữ chiến binh Amazon của Nusantara."
 podgloss.kakawin: "Kakawin là một thể thơ Java, thường làm theo lối thơ có niêm luật."
 podgloss.bhinneka_tunggal_ika: "#italic Đa Dạng Mà Là Một.#!\nCâu này về sau sẽ trở thành phương châm của chính phủ Indonesia."
 podgloss.silat: "Silat là tên gọi chung chỉ một dòng võ thuật lấy việc sử dụng vô số loại binh khí làm trọng tâm, thứ binh khí thường do chính người thầy rèn ra khi thấy học trò đã đủ tư cách bước vào lối luyện ấy."
 podgloss.bentahara: "Bentahara là một chức vị trong các vương quốc Mã Lai, tương đương Tể tướng hoặc quan giữ khố."
 podgloss.wally_songo: "[Glossary('Wali', 'podgloss.wali')] Songo là Chín Vị Thánh của Hồi giáo, được tôn kính vì vai trò lịch sử của họ trong việc truyền bá Hồi giáo ở Indonesia."
 podgloss.wali: "Một vị thánh, hay một người bạn của Thượng Đế, theo tiếng Ả Rập."
 podgloss.shahbander: "Quan cảng vụ, nắm việc quản lý thương nhân và thu thuế."
 podgloss.laksamana: "Đô đốc trong các vương quốc Hồi giáo Mã Lai."
