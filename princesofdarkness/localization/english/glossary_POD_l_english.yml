 ####### POD glossary

 glossary_clan_curse: "[Glossary('Lời nguyền Clan', 'glossary_clan_curse_tt')]"
 glossary_clan_curse_tt: "Lời nguyền Clan là một hạn chế siêu nhiên mà $POD_splat_vampire$ phải gánh chịu, tùy theo $pod_clan$ của mình.\n\nNhững khuyết tật ấy để lại dấu ấn tâm lý sâu sắc lên kẻ vừa mới sa vào kiếp ma cà rồng, thường buộc chúng phải sắp đặt lại toàn bộ cuộc sống về đêm. Tuy vậy, mỗi Clan lại có cách biện giải riêng để phủi bỏ Lời nguyền của mình. Số khác tự dối lòng, xem đó là một ân phúc còn giấu kín, hoặc là dư ảnh của một cuộc đại ngộ, một lợi thế trời cho.\n\nTheo Sách Nod, Lời nguyền Clan là hậu quả từ cơn thịnh nộ của Caine giáng xuống [GetTrait('vampgeneration3').GetName(GetNullCharacter)] sau khi [GetTrait('vampgeneration2').GetName(GetNullCharacter)] bị hủy diệt."

 glossary_courts_of_love: "[Glossary('Tòa Ái Tình', 'glossary_courts_of_love_tt')]"
 glossary_courts_of_love_tt: "Tòa Ái Tình là một lãnh địa của [GetTrait('vampire').GetName(GetNullCharacter)] và cũng là một thể chế phong kiến, do [GetTrait('toreador').GetName(GetNullCharacter)] người Pháp lập nên. Nó gồm nhiều Tòa Ái Tình, mỗi tòa là lãnh địa của một Toreador hùng mạnh.\n\nNhững tòa danh giá và có thế lực nhất, cùng các chủ nhân của chúng trong sử sách, là:\n$BULLET_WITH_TAB$Valois dưới quyền Mẫu Chủ Salianna\n$BULLET_WITH_TAB$Champagne dưới quyền Nữ hoàng Helene 'la Juste'\n$BULLET_WITH_TAB$Poiters dưới quyền Quốc vương Etienne de Poiters\n$BULLET_WITH_TAB$Anjou dưới quyền Nữ hoàng Isouda de Blaise\n$BULLET_WITH_TAB$Toulouse dưới quyền Nữ hoàng Esclaramonde"

 glossary_osirian_league: "[Glossary('Liên minh Osiris', 'glossary_osirian_league_tt')]"
 glossary_osirian_league_tt: "Liên minh Osiris là một hội kín lập ra để chống lại [Glossary('Set','game_concept_antediluvian_desc')].\n\nThành viên của hội gồm:\n$BULLET_WITH_TAB$[GetTrait('mokole').GetName(GetNullCharacter)] dưới trướng Sobek.\n$BULLET_WITH_TAB$Bộ tộc Silent Striders của #TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L Garou#!.\n$BULLET_WITH_TAB$Những #TOOLTIP:GAME_TRAIT,bastet,[GetNullCharacter] #L người mèo#! Bubasti.\n$BULLET_WITH_TAB$Con Cái Osiris và Đệ Tử Anubis, những kẻ #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L mang huyết mạch ma cà rồng#!.\n$BULLET_WITH_TAB$Các tăng lữ pháp thuật phàm nhân của Giáo phái Isis.\n$BULLET_WITH_TAB$[GetTrait('eshu').GetName(GetNullCharacter)] phiêu bạt.\n$BULLET_WITH_TAB$Và chính [GetTrait('shemsuheru').GetName(GetNullCharacter)]."


 glossary_khitta: "[Glossary('Khitta', 'glossary_khitta_tt')]"
 glossary_khittas: "[Glossary('Khitta', 'glossary_khitta_tt')]"
 glossary_khitta_tt: "Cairo là đất dung thân của nhiều phe phái, tổ chức thành các Khitta — những khu phố phân định lỏng lẻo, mỗi khu là lãnh địa của một $pod_clan$ hoặc một chi hệ nhất định. Các lãnh địa này thường tự trị, nhưng xét đến cùng thì tất cả đều phải phục tùng Sultan hoặc Prince. Cairo phần lớn theo Hồi giáo, song chỉ một số ít Khitta là đứng về phía [Glossary('Ashirra','game_concept_ashirra_desc')].\n\nKhitta của Ashirra:\n$BULLET_WITH_TAB$Banu al-Lam'a: Khu của Lasombra.\n$BULLET_WITH_TAB$Banu Yashkur: Khu của Assamite.\n$BULLET_WITH_TAB$Banu al-Hajj: Khu của Nosferatu.\n$BULLET_WITH_TAB$Banu al-Fen: Khu của Toreador. Theo nguyên tác, Khitta này có tên Banu Duval và chỉ được lập nên khi một Toreador theo Napoleon đặt chân tới Cairo năm 1798.\n\nCác Khitta khác:\n$BULLET_WITH_TAB$Banu Ahl ar-Raya: Khu của True Brujah.\n$BULLET_WITH_TAB$Banu al as-Sa'idi: Khu của Setite.\n$BULLET_WITH_TAB$Banu Zamalek: Khu tự do, nơi nhiều ma cà rồng khác dựng chốn nương thân.\n$BULLET_WITH_TAB$Banu al-Azraq: Khu của Ventrue, do Antonius và dòng dõi của hắn dẫn dắt.\n$BULLET_WITH_TAB$Banu al-Giza: Khu của Đệ Tử Anubis, nằm ngay ngoại vi Cairo."

 ###############
 #### Fera #####
 ###############
 glossary_fera: "[Glossary('Fera', 'glossary_fera_tt')]"
 glossary_fera_tt: "#bold Fera#! là một giống loài thuộc về linh giới, có khả năng biến hình thành thú. $POD_splat_werewolf_plural$ là đông đảo và nổi danh nhất, song còn nhiều tộc khác nữa.\n\nTheo thần thoại của Fera, họ được Gaia — Mẫu Thần của muôn loài — tạo ra, mỗi tộc được giao một phận sự riêng để canh giữ những gì bà đã tạo nên. Thế nhưng nhiều tộc đã rời xa phận sự ấy, do lãnh đạm, do chai sạn, hoặc do những cuộc tương tàn đẫm máu giữa các bộ tộc, và Gaia ngày một xa cách.\n\nCác Fera sau đây có thể chơi được trong [princes_of_darkness|E]:\n$BULLET_WITH_TAB$#TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L;bold Garou#!#! #weak (Người sói)#!\n$BULLET_WITH_TAB$#bold [GetTrait('bastet').GetName(GetNullCharacter)]#! #weak (Người mèo)#!\n$BULLET_WITH_TAB$#bold [GetTrait('mokole').GetName(GetNullCharacter)]#! #weak (Người cá sấu và Người rồng)#!"

 glossary_triat: "[Glossary('Tam Vị', 'glossary_triat_tt')]"
 glossary_triat_tt: "Tam Vị là ba trong số những thực thể lớn nhất của linh giới: $glossary_wyld$, $glossary_weaver$ và $glossary_wyrm$.\n\nThuở ban sơ, Tam Vị ở trong thế cân bằng. Wyld tạo ra vật chất thô sơ, sinh mệnh và linh hồn; Weaver ban cho những tạo vật ấy hình hài và công dụng; còn Wyrm hủy diệt chúng để dành chỗ cho những tạo vật mới.\n\nNhưng Tam Vị nay đã mất cân bằng. Weaver rút sức mạnh từ nhân loại — từ những thành đô, kỹ nghệ, công nghiệp và khoa học của con người — nên hùng mạnh hơn bao giờ hết. Ảnh hưởng của Wyld thì lụi dần, khi tài nguyên bị vét cạn, những vùng hoang dã của thế gian bị phá nát, và tự nhiên bị bắt phải cúi đầu theo ý người. Nhưng hiểm họa lớn nhất vẫn là Wyrm — nó lấy tội ác làm thức ăn và hủy diệt không phân biệt gì hết. "

 glossary_wyld: "[Glossary('Wyld', 'glossary_wyld_tt')]"
 glossary_wyld_tt: "#bold Wyld#! là một trong ba linh hồn có sức mạnh không thể đo lường hợp thành $glossary_triat$.\n\nWyld là lực sinh thành: nó tạo ra Hỗn loạn tuyệt đối, rồi $glossary_weaver$ ban trật tự cho cái hỗn loạn ấy, trước khi $glossary_wyrm$ hủy diệt và trả nó về với hỗn loạn. Trong khi hai vị kia của Tam Vị hóa điên, thì Wyld đang lụi tàn — bị Weaver chèn ép đến ngạt, bị Wyrm hủy hoại bừa bãi.\n\nLãnh địa của Wyld là tự nhiên cùng sức sinh sôi ngút ngàn của nó, thứ đang bị loài người từ từ tàn phá."

 glossary_weaver: "[Glossary('Weaver', 'glossary_weaver_tt')]"
 glossary_weaver_tt: "#bold Weaver#! là một trong ba linh hồn có sức mạnh không thể đo lường hợp thành $glossary_triat$.\nPhận sự của Weaver là tạo lập trật tự từ những tạo vật của $glossary_wyld$, ban cho chúng hình hài và công dụng suốt thời gian tồn tại, trước khi chúng bị $glossary_wyrm$ hủy diệt — nhờ vậy mà giữ được thế cân bằng giữa sáng tạo và hủy diệt.\n\nNgười ta tin rằng Weaver là kẻ chịu trách nhiệm chính cho sự mất cân bằng của Tam Vị. Weaver đã chán ghét việc trật tự do mình dựng nên cứ bị Wyrm phá hủy, nên dệt màng nhện để giam cầm Wyrm và chấm dứt sự hủy diệt ấy. Chính cảnh tù đày đó đã khiến Wyrm hóa điên, và từ đó nó bắt đầu hủy diệt tất thảy, chứ không riêng những gì đã đến kỳ tận số.\n\nHóa thân và con cháu của Weaver thường mang hình nhện, đôi khi là hình côn trùng. Nó là đấng bảo hộ của luật pháp, trật tự, khoa học và kỹ nghệ. Nhân loại càng tiến bước, Weaver càng lớn mạnh theo."

 glossary_wyrm: "[Glossary('Wyrm', 'glossary_wyrm_tt')]"
 glossary_wyrm_triatic: "[Glossary('Wyrm Tam Vị', 'glossary_wyrm_tt')]"
 glossary_wyrm_apep: "[Glossary('Apep', 'glossary_wyrm_tt')]"
 glossary_wyrm_apophis: "[Glossary('Apophis', 'glossary_wyrm_tt')]"
 glossary_wyrm_tt: "#bold Wyrm#! là một trong ba linh hồn có sức mạnh không thể đo lường hợp thành $glossary_triat$.\n\nPhận sự của Wyrm là thanh tẩy và chỉnh sửa toàn bộ Tạo Hóa, đưa Tạo Hóa tiến sâu hơn vào cõi Hoại Diệt. Nó làm việc ấy bằng cách tiêu trừ những gì $glossary_wyld$ tạo ra và $glossary_weaver$ dựng thành hình, qua đó hoàn tất vòng tuần hoàn vĩnh cửu từ sinh tới tử. Nó là vị thứ hai trong $glossary_triat$ hóa điên. Khi $glossary_weaver$ phát điên và bắt đầu bọc kín mọi thứ trong màng nhện để ngăn tạo vật của mình bị hủy diệt, Wyrm dần bị trói buộc đến mức không còn làm tròn phận sự theo ý mình được nữa. Bị chặn mất cơ hội làm đúng cái điều mình được sinh ra để làm, nó rơi vào trạng thái phẫn nộ và điên loạn thuần túy, quyết hủy diệt tất thảy, bất kể đã đến kỳ tận số hay chưa.\n\nGiờ đây, Wyrm tồn tại như một Hắc Thần của [Glossary('Tai Ương', 'glossary_wyrm_calamity_tt')], [Glossary('Cuồng Thực', 'glossary_wyrm_consumption_tt')] và [Glossary('Ô Uế', 'glossary_wyrm_corruption_tt')]."

 glossary_wyrm_calamity: "[Glossary('Ác Thú Chiến Tranh', 'glossary_wyrm_calamity_tt')]"
 glossary_wyrm_calamity_tt: "#bold Ác Thú Chiến Tranh#! hay #bold Wyrm Tai Ương#! là cái đầu thứ nhất trong ba đầu của $glossary_wyrm_triatic$.\n\nĐó là một con quái vật của cơn phẫn nộ vô nghĩa, sẵn sàng hủy diệt mọi thứ trên đường nó đi. Phẫn nộ vô bờ là thứ nuôi nó, bản năng hủy diệt là thứ dẫn đường cho nó. Thuộc hạ của nó thì đủ loại, từ những đội quân xung kích lao vào tử địa không màng sống chết, cho tới những tên hộ pháp khổng lồ lấy việc đè bẹp và tận diệt nạn nhân làm niềm vui.\n\nCái đầu này tương ứng với lòng ưa hỗn loạn của $glossary_wyld$, nhưng ở đây là thứ hỗn loạn đạt được bằng kinh hoàng và tàn phá."

 glossary_wyrm_consumption: "[Glossary('Kẻ Nuốt Linh Hồn', 'glossary_wyrm_consumption_tt')]"
 glossary_wyrm_consumption_tt: "#bold Kẻ Nuốt Linh Hồn#! hay #bold Wyrm Cuồng Thực#! là cái đầu thứ hai trong ba đầu của $glossary_wyrm_triatic$.\n\nĐó là hiện thân của những cơn thèm khát gặm nhấm: tham lam, dục vọng và cuồng ăn. Một số thuộc hạ của nó đã dâng nộp toàn bộ ý chí; số khác là những kẻ sát nhân một mực đuổi theo thứ mà chúng ngu muội tin rằng sẽ làm mình trọn vẹn. Lòng thù hận của Kẻ Nuốt Linh Hồn mưng mủ độc địa như một chứng bệnh, cứ thế đục khoét thịt da nhiễm bệnh và mài mòn tâm trí đã rối loạn.\n\nCái đầu này tương ứng với khát vọng hợp nhất của $glossary_weaver$, có điều thứ hợp nhất ở đây chẳng hơn gì việc gộp lại bằng cách nuốt vào rồi tiêu hóa dần."

 glossary_wyrm_corruption: "[Glossary('Wyrm Ô Uế', 'glossary_wyrm_corruption_tt')]"
 glossary_wyrm_corruption_tt: "#bold Wyrm Ô Uế#! hay #bold Wyrm Bôi Nhọ#! là cái đầu thứ ba trong ba đầu của $glossary_wyrm_triatic$.\n\nĐó là hiện thân của mọi xung động và bản năng làm hư hoại trên cõi đời. Wyrm Ô Uế quyến dụ nạn nhân một cách âm thầm và ngấm ngầm từ bên trong, thì thào những lời mê hoặc dẫn con mồi tự nguyện bước vào miệng nó. Nó là con rắn trong Vườn Địa Đàng, là tham vọng ngu muội của một thiên thần đọa lạc, là sự ngạo mạn của một [GetTrait('mage').GetName(GetNullCharacter)] triệu gọi thứ quyền năng vượt quá tầm kiểm soát của mình, hay là thói tự phụ của một $glossary_fera$ tưởng rằng mình chế ngự được chính những thế lực linh giới rồi sẽ đẩy hắn xuống chốn đọa đày.\n\nCái đầu này tương ứng với phận sự thanh tẩy thuở ban đầu của Wyrm, nhưng ở cõi phàm nó chỉ còn là một thực thể bị giới hạn: chỉ có thể gặm mòn nạn nhân một cách vô hình, tinh vi và từ bên trong, cho tới khi thứ còn lại chỉ là một cái xác rỗng tối đen, hư hoại đến mức không thể sống nổi."



