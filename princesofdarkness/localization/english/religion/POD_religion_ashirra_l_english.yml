#Main religion
 ashirra_religion: "@vampire_icon! Ashirra"
 ashirra_religion_adj: "Ashirra"
 ashirra_religion_adherent: "Ashirra"
 ashirra_religion_adherent_plural: "Ashirra"
 ashirra_religion_desc: "[Glossary('Ashirra','game_concept_ashirra_desc')] (từ ashira, tiếng Ả Rập nghĩa là 'clan') là giáo phái mà các ma cà rồng Hồi giáo tuyên xưng đức tin của mình nơi Allah, và cai quản Ả Rập cùng Bắc Phi, khởi đầu từ thời Tăm Tối. Thành viên của [Glossary('Ashirra','game_concept_ashirra_desc')] tin rằng sự cứu chuộc cho Kindred nằm trong số những lời hứa mà Muhammad đã ban nếu họ chọn theo Allah."

 ashirra_religious_head_title: "Mullah"
 ashirra_religious_head_title_name: "Sultanate"


#Holy Orders
 holy_order_the_mahgrib: "The Mahgrib"
 holy_order_the_shuhada: "The Shuhada"
 holy_order_defenders_ashirra: "Hộ Vệ Ashirra"
 holy_order_companions_of_the_prophet: "Bằng Hữu của Nhà Tiên Tri"


#Ashirra-Group Faiths
 tariqelsama: "Tariq el-Sama"
 tariqelsama_adj: "Sama"
 tariqelsama_adherent: "el-Sama"
 tariqelsama_adherent_plural: "el-Sama"
 tariqelsama_desc: "Tín đồ của Tariq el-Sama bám chặt vào những mặc khải của Nhà Tiên Tri và cân bằng cơn thịnh nộ của Dã Thú bằng lời cầu nguyện mỗi đêm cùng đức tin không lay chuyển. Hắn không chống lại Dã Thú khi nó trỗi dậy, mà cho phép nó một sự giải thoát vừa phải, kìm hãm nó lại khi những thôi thúc đe dọa chiếm quyền hoàn toàn. Thử thách là giữ được thế cân bằng và chỉ cho phép chúng ở mức độ vừa phải, vì cái ác nằm ở sự thái quá."

 tariqelumma: "Tariq el-Umma"
 tariqelumma_adj: "Umma"
 tariqelumma_adherent: "Sadeeq"
 tariqelumma_adherent_plural: "Asdiqa"
 tariqelumma_desc: "Tín đồ của Tariq el-Umma có xu hướng tái khẳng định bản tính căn cốt của mình qua những hành động tử tế và lòng trắc ẩn. Họ thường tìm cách bảo vệ và giúp đỡ những người hàng xóm phàm nhân trong bí mật, và can thiệp khi có thể để sửa chữa bất công hay thấy kẻ có tội bị trừng phạt. Nhiều tín đồ cân bằng bản tính thú tính của mình bằng cách góp phần truyền bá tri thức và chữa lành khắp thế giới Hồi giáo."

 tariqelharb: "Tariq el-Harb"
 tariqelharb_adj: "Harb"
 tariqelharb_adherent: "Chiến Binh"
 tariqelharb_adherent_plural: "Chiến Binh"
 tariqelharb_desc: "Một chiến binh Ashirra được kỳ vọng phải bảo vệ các tín đồ khỏi kẻ thù của họ hay những kẻ can thiệp vào việc thực hành đức tin. Tương tự, hắn phải bảo vệ danh dự của phụ nữ và trẻ em. Trên chiến trường, hắn phải chiến đấu như kẻ bị ám, bất chấp sự an toàn của bản thân. Đó không phải là mạng sống của chiến binh để mất, mà là của Allah."

 tariqelbedouin: "Tariq el-Bedouin"
 tariqelbedouin_adj: "Bedouin"
 tariqelbedouin_adherent: "Người Bộ Tộc"
 tariqelbedouin_adherent_plural: "Người Bộ Tộc"
 tariqelbedouin_desc: "Một ma cà rồng Hồi giáo theo Tariq này vì hắn tin rằng sự lười biếng và những xa hoa quyến rũ của cung điện và thành thị làm suy yếu kỷ luật bản thân và lòng can đảm đạo đức của một cá nhân. Thay vì chịu đựng vô số phiền nhiễu của một cuộc sống về đêm đầy rẫy giải trí, ma cà rồng ấy tìm kiếm một cuộc sống khắc nghiệt hơn, tuyệt vọng hơn, gột rửa tâm trí khỏi mọi thứ ngoại trừ những thử thách từng khoảnh khắc mà hoang mạc đặt ra."

 tariqelalaam: "Tariq el-Alaam"
 tariqelalaam_adj: "Alaam"
 tariqelalaam_adherent: "Shaheed"
 tariqelalaam_adherent_plural: "Shuhada"
 tariqelalaam_desc: "Shuhada là những kẻ tử vì đạo tự hiến mình làm vật hy sinh bất tử để người khác không phải chịu khổ. Họ sẽ tự nguyện hy sinh bản thân để ngăn chặn sự ô uế gây ra bởi bất cứ điều gì bị coi là bất khiết, dù bằng chiến trận hay cách khác. Họ dâng hiến bản thân cho chính nghĩa của Allah, hy vọng được xem là xứng đáng như những vị tử đạo phàm nhân của Hồi giáo."

 sheperdsofislam: "Shepherds of Islam"
 sheperdsofislam_adj: "Shepherds"
 sheperdsofislam_adherent: "Nhân Chứng"
 sheperdsofislam_adherent_plural: "Nhân Chứng"
 sheperdsofislam_desc: "Những Shepherd tin rằng chính Allah, trong sự khôn ngoan và lòng trắc ẩn của Ngài, đã chọn họ làm những người gìn giữ bất tử cho lời của vị Tiên Tri cuối cùng và vĩ đại nhất (cầu bình an cho Người). Hồi giáo sẽ tiếp tục tồn tại — chỉ có thể tiếp tục tồn tại — trong những kẻ đã đích thân chứng kiến lời của Nhà Tiên Tri và sẽ luôn ở đó để truyền lại cho người khác."

 tariqelatham: "Tariq el-A'Tham"
 tariqelatham_adj: "A'Tham"
 tariqelatham_adherent: "Học Giả"
 tariqelatham_adherent_plural: "Học Giả"
 tariqelatham_desc: "Chủ yếu được thực hành bởi Qabilat al-Mawt, Tariq này kết hợp cả Road of Bones lẫn tín ngưỡng Ashirra. Điều này đã dẫn đến những phương thức tìm kiếm tri thức ôn hòa hơn, chẳng hạn như các nghiên cứu chiêm tinh của thế giới Hồi giáo. Dù không được hầu hết các giáo phái Ashirra chấp nhận hoàn toàn, Tariq el-A'Tham vẫn được dung thứ và tín đồ của nó được tự do theo đuổi tri thức miễn là không gây hại cho phàm nhân."