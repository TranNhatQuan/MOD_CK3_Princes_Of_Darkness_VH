 #Black-Hand-Group Faiths
 talmahera: "Tal'Mahe'Ra"
 talmahera_adj: "Tal'Mahe'Ra"
 talmahera_adherent: "Quân Thập Tự Bóng Tối"
 talmahera_adherent_plural: "Quân Thập Tự Bóng Tối"
 talmahera_desc: "Tal'Mahe'Ra là một tổ chức cổ xưa được hình thành từ một liên minh bất ngờ giữa các pháp sư Chakravanti và một số clan ma cà rồng (đáng chú ý nhất là Assamite), dù thành viên của tổ chức còn bao gồm cả những sinh vật siêu nhiên khác ngoài ma cà rồng và pháp sư."
 
 manusnigrum: "Manus Nigrum"
 manusnigrum_adj: "Manus Nigrum" 
 manusnigrum_adherent: "Bàn Tay Đen"
 manusnigrum_adherent_plural: "Những Kẻ Thuộc Bàn Tay Đen"
 manusnigrum_desc: "Nhánh phương Tây của một giáo phái tử thần cổ xưa tôn thờ một nhóm thực thể được gọi là Aralu, mà họ tin là các [Glossary('Antediluvian','game_concept_antediluvian_desc')], từng say ngủ trong thành phố ma Enoch nằm sâu trong vùng đất của kẻ chết. Giáo phái này chủ yếu can dự vào chính trường ma cà rồng, mưu tính việc tận diệt tộc Baali."

 pathofselffocus: "Con Đường Tự Chú Tâm"
 pathofselffocus_adj: "Người Hướng Nội"
 pathofselffocus_adherent: "Người Hướng Nội"
 pathofselffocus_adherent_plural: "Người Hướng Nội"
 pathofselffocus_desc: "Người Hướng Nội tin rằng bằng cách chấp nhận dòng chảy của vũ trụ và thuận theo nó mà không can thiệp, họ có thể chấm dứt xung đột nội tâm và nhờ đó khống chế được Dã Thú. Bởi lẽ thay đổi thế giới là điều bất khả, họ cho rằng người ta chỉ có thể thay đổi chính mình để thích nghi với thế giới."
 
 pathofthescorchedheart: "Con Đường Trái Tim Cháy Khô"
 pathofthescorchedheart_adj: "Rathmonicusi"
 pathofthescorchedheart_adherent: "Kẻ Không Khoan Nhượng"
 pathofthescorchedheart_adherent_plural: "Kẻ Không Khoan Nhượng"
 pathofthescorchedheart_desc: "Dựa trên Sách Trái Tim Trống Rỗng của Rathmonicus, ban đầu được truyền bá trong một số ít Huyết Tộc thuộc Giáo hội Công giáo; kinh văn của nó về sau được Bàn Tay Đen Chân Chính thu thập và biên soạn lại. Con Đường Trái Tim Cháy Khô khống chế Dã Thú bằng cách diệt trừ có hệ thống mọi cảm xúc trong trái tim của ma cà rồng."
 
