 boli_zouhisze_adj: "Zouhisze"
 boli_zouhisze_adherent: "Tín Đồ"
 boli_zouhisze_adherent_plural: "Tín Đồ"
 boli_zouhisze_desc: "Một nhánh tách ra từ Warders of Men ở Trung Hoa vào khoảng trước năm 2000 TCN, dù vẫn giữ lại một số nét văn hóa của bộ tộc gốc, như sự trân trọng văn hóa nhân loại và tôn sùng linh hồn Gián. Chính điều sau đã khiến $glossary_fera$ bản địa Trung Hoa xa lánh Boli Zouhisze và loại họ khỏi Thú Triều, bởi hình tượng côn trùng gắn liền mật thiết với Wyrm trong mắt người Hengeyokai."

