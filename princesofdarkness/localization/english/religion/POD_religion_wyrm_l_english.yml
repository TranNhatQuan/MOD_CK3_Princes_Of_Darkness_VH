 blackspiraldancer_adj: "Vũ Công Xoáy Đen"
 blackspiraldancer_adherent: "Vũ Công Xoáy Đen"
 blackspiraldancer_adherent_plural: "Vũ Công Xoáy Đen"
 blackspiraldancer_desc: "Còn được gọi là Bộ Tộc Thất Lạc, những Vũ Công Xoáy Đen đáng sợ là những Garou đã ngả theo $glossary_wyrm$. Từng được gọi là Bầy Sói Trắng, họ đã bị làm ô uế đến tận cùng sau khi bộ tộc cố tự mình hạ gục Wyrm."

 cluithi: "Cluithi"
 cluithi_adj: "Cluithi"
 cluithi_adherent: "Cluith"
 cluithi_adherent_plural: "Cluithi"
 cluithi_desc: "Tuy nhiên, trong bộ tộc Xoáy Đen, một trại đã cố hết sức để gìn giữ di sản của Bầy Sói Trắng. Cluithi vẫn còn lang thang trên những vùng đầm lầy và rừng rậm hoang vu nhất Scotland, bắt chước dáng vẻ tổ tiên mình đã có từ nhiều thế kỷ trước. Họ xé rách y phục, tự hào tô mình bằng màu xanh trên cơ thể và khắc hình xăm Pict. Những kẻ cai trị trại này cũng mang khuynh hướng ưu tú, tự xem mình là giới quý tộc của bộ tộc. Tên của trại là để tưởng nhớ những kẻ cai trị nguyên thủy của các Vương Quốc Pict. Nhiều Cluithi tự xem mình là hậu duệ đích thực nhất của Cluid, vị anh hùng đầu tiên dẫn dắt người Pict đến Caledonia."

 princesofruin: "Chúa Tể Diệt Vong"
 princesofruin_adj: "Diệt Vong"
 princesofruin_adherent: "Chúa Tể Diệt Vong"
 princesofruin_adherent_plural: "Chúa Tể Diệt Vong"
 princesofruin_desc: "Chúa Tể Diệt Vong khẳng định rằng cuộc chiến vì Khải Huyền đã kết thúc và ngã ngũ. Họ rao giảng lối sống buông thả bản năng, tuyên bố rằng cái xác đang hấp hối của thế giới nay là của họ để cai trị và tùy ý đối xử. Là những nhà vô địch đắc thắng của Kẻ Làm Băng Hoại, họ khẳng định rằng việc thỏa mãn những bản năng thấp hèn của chính mình chính là hình thức thờ phụng $glossary_wyrm$."

 seekersoftheancient: "Kẻ Tìm Kiếm Đấng Cổ Xưa"
 seekersoftheancient_adj: "Kẻ Tìm Kiếm"
 seekersoftheancient_adherent: "Kẻ Tìm Kiếm"
 seekersoftheancient_adherent_plural: "Kẻ Tìm Kiếm"
 seekersoftheancient_desc: "Những druid hắc ám của đất đai, tìm cách giao cảm với khí trời và địa mạch bao quanh các Đấng Cổ Xưa. Họ không tán tụng chính linh hồn ấy, mà cầu khẩn đức tính của các nguyên tố thuộc về nó, gián tiếp triệu hồi nó hành động qua thiên nhiên. Điều này ban cho họ ngộ tính và sức mạnh một cách gián tiếp, cho phép họ phát triển và điều khiển một Hố Sâu đã được kết nối với vùng đất xung quanh. Họ đóng vai pháp sư, liều mình rơi vào nô lệ và điên loạn để giao tiếp với những linh hồn không thể tưởng tượng nổi và trực tiếp thu nhận ngộ tính."


 ##############
 #### Wyrm ####
 ##############


 wyrmbound: "Kẻ Bị Wyrm Ràng Buộc"
 wyrmbound_adj: "Bị Wyrm Ràng Buộc"
 wyrmbound_adherent: "Kẻ Bị Ô Uế"
 wyrmbound_adherent_plural: "Kẻ Bị Ô Uế"
 wyrmbound_desc: "$glossary_wyrm$ có vô số kẻ hầu trong số các tôi tớ của nó. Có kẻ phụng sự trong ý thức, có kẻ phụng sự mà không hề hay biết. Nhưng mọi hành động của chúng đều phục vụ mục đích lớn lao hơn của Wyrm là mang đến Khải Huyền; ngày tàn của Gaia. Vì vậy, mọi sinh vật gây ra khổ đau, đắm chìm trong đồi bại và/hoặc góp phần vào sự hủy diệt, dù tự nguyện hay không, dù ý thức hay không, đều là tôi tớ của Wyrm."
 
 
 #Bone Gnawers
 maneaters: "Kẻ Ăn Thịt Người"
 maneaters_adj: "Ăn Thịt Người"
 maneaters_adherent: "Kẻ Ăn Thịt Người"
 maneaters_adherent_plural: "Kẻ Ăn Thịt Người"
 maneaters_desc: "Trại Bone Gnawer này có được sức mạnh bằng cách vi phạm điều khoản của Litany cấm ăn thịt đồng loại con người. Phần lớn 'tín đồ cải đạo' của trại này từng là những Garou đã quá nhiều lần khuất phục trước cơn phẫn cuồng. Ngày nay số họ còn lại rất ít, và nhiều kẻ trong số đó đã liên minh với trại Kẻ Ăn Xác tương tự trong hàng ngũ Silent Strider.\\nNhững câu chuyện rùng rợn thi thoảng về những con sói người khát máu cũng củng cố thêm niềm tin vào sự tồn tại của Kẻ Ăn Thịt Người — xét cho cùng, trong lúc đói khát, một Gnawer khó lòng cưỡng lại cám dỗ tự nuôi mình và loại bớt vài cái miệng đói thừa thãi cùng một lúc."

 holy_order_butchers_men: "Đồ Tể của Loài Người"

 #Shadowlords
 masks: "Mặt Nạ"
 masks_adj: "Mặt Nạ"
 masks_adherent: "Mặt Nạ"
 masks_adherent_plural: "Mặt Nạ"
 masks_desc: "Một hội kín của Shadowlord chuyên gieo rắc nỗi sợ hãi cho kẻ thù, lòng tận tụy của Mặt Nạ với những nghệ thuật hắc ám của họ cuồng tín đến mức người ta đồn rằng họ tự hành hạ thân xác mình theo nghi thức để khơi dậy nỗi kinh hoàng lớn hơn nơi nạn nhân. Vì cái chưa biết mới là sân chơi của nỗi sợ, không một Mặt Nạ thực thụ nào tiết lộ tư cách thành viên trại của mình cho người ngoài, trừ những kẻ đang bị nhắm đến để chiêu mộ vào hàng ngũ của họ."

 #Shadowlords
 societyofnidhogg: "Hội Nidhogg"
 societyofnidhogg_adj: "Nidhogg"
 societyofnidhogg_adherent: "Tín Đồ Nidhogg"
 societyofnidhogg_adherent_plural: "Tín Đồ Nidhogg"
 societyofnidhogg_desc: "Mọi Shadowlord đều hiểu sức mạnh của bóng tối, nhưng không ai thấu hiểu sâu sắc bằng các thành viên của trại bí ẩn, huyền bí này. Lòng cuồng tín của họ mạnh đến mức họ tuyên bố rằng chính ánh sáng mặt trời là mối đe dọa cho các thế lực của Sấm Sét, và tìm cách nhấn chìm thế giới vào bóng tối vĩnh viễn."

 holy_order_writhing_shadows: "Bóng Tối Quằn Quại"

 #Hakken
 ebon_centipede: "Rết Đen"
 ebon_centipede_adj: "Đen"
 ebon_centipede_adherent: "Kẻ Tìm Mê Cung"
 ebon_centipede_adherent_plural: "Kẻ Tìm Mê Cung"
 ebon_centipede_desc: "Khi bóng tối trở nên quá sâu đến mức tuyệt vọng hay tàn nhẫn nhấn chìm một Hakken, họ có thể tự nộp mình cho Mê Cung Đen và thề nguyện với [Glossary('Rết', 'glossary_wyrm_tt')]. Là những sinh vật cô độc, khốn khổ và bạo tàn, chúng là mối họa cho mọi điều thiện lành về mặt tâm linh, chẳng khác gì lũ #ONCLICK:FAITH,blackspiraldancer #TOOLTIP:FAITH,blackspiraldancer $Sói Người Hủy Diệt|L$#!#! thoái hóa ở phương Tây." 

