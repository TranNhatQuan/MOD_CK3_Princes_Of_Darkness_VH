 blackspiraldancer_religion_desc: "Còn được gọi là Bộ Tộc Thất Lạc, những Vũ Công Xoáy Đen đáng sợ là những Garou đã ngả theo $glossary_wyrm$. Từng được gọi là Bầy Sói Trắng, họ đã bị làm ô uế đến tận cùng sau khi bộ tộc cố tự mình hạ gục Wyrm."

