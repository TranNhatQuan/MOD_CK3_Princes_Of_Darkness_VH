 #Silent Striders
 eatersofthedead: "Kẻ Ăn Xác"
 eatersofthedead_adj: "Ăn Xác"
 eatersofthedead_adherent: "Kẻ Ăn Xác"
 eatersofthedead_adherent_plural: "Kẻ Ăn Xác"
 eatersofthedead_desc: "Một trại trong hàng ngũ Silent Strider bị chính đồng tộc mình đẩy xuống hoạt động ngầm, nơi người ta đồn rằng họ hành nghi lễ ô uế trong bóng tối. Ăn não kẻ thù và học lấy mọi bí mật của hắn: một nghi thức đê tiện nhưng hữu dụng. Tất cả những kẻ ăn thịt người khác đều dần hóa điên và bốc mùi tanh tưởi của $glossary_wyrm$. Một số thậm chí còn nghiện món não tươi, sẵn sàng giết cả kẻ vô tội lẫn kẻ có tội chỉ để thỏa cơn thèm."

 holy_order_children_ammit: "Con Cái của Ammit"

 #Star Gazers
 metasticbirth: "Sinh Nở Di Căn"
 metasticbirth_adj: "Di Căn"
 metasticbirth_adherent: "Bà Đỡ"
 metasticbirth_adherent_plural: "Bà Đỡ"
 metasticbirth_desc: "Những Stargazer này tin rằng $glossary_wyrm$ không bị giam cầm, mà đang ở trong một cái kén trải qua biến hóa, chuẩn bị cho một thực tại mới do $glossary_weaver$ khai sinh. Khi hoàn tất biến hóa, nó sẽ phá kén chui ra và mở đầu cho thế giới mới. Những Stargazer theo trại này tin rằng đây là điều tốt lành, và bộ tộc nên giúp kẻ khác chuẩn bị cho nó, chứ không phải chống lại nó."

 #Star Gazers
 ouroboroans: "Ouroboroan"
 ouroboroans_adj: "Ouroboroan"
 ouroboroans_adherent: "Ouroboroan"
 ouroboroans_adherent_plural: "Ouroboroan"
 ouroboroans_desc: "Họ tìm cách giải thoát $glossary_wyrm$ của Cân Bằng khỏi Mạng Lưới. Thay vì chống lại $glossary_weaver$, họ dùng năng lượng của mình để truy tìm Wyrm trong mọi hình dạng của nó với hy vọng khám phá ra bí mật giải thoát nó. Họ tin rằng chỉ bằng cách đi theo Wyrm đến tận hang ổ của nó, thay vì chiến đấu với tôi tớ của nó, họ mới thực sự có thể tác động đến kết cục của Cuộc Chiến Cuối Cùng. Do đó, một số tu sĩ này tin rằng con đường của Wyrm phải được sử dụng, chứ không phải né tránh."

 holy_order_unshacklers_corruption: "Kẻ Giải Thoát Khỏi Ô Uế"


