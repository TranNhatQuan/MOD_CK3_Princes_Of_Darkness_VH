 hellcats_desc: "Khi Vũ Công Xoáy Đen tấn công cuộc hội họp thường niên của Ceilican Bastet ở Scotland, chúng ép một số Bastet vào [UmbraGlossary('black_spiral_labyrinth')] để biến họ theo $glossary_wyrm$. Những ai sống sót trở thành Hellcat, cơn điên loạn nguyên bản của họ biến thành sự hung hãn tự hủy hoại và vô thức. Chờ đợi Khải Huyền để tôn vinh Hắc Phụ của mình, những sinh vật bị nhiễm độc này mang theo mối liên kết mạnh mẽ với các món quà ảo thuật của Fae cùng nhiều pháp bảo nhiễm Wyrm mà họ chế tạo bằng sự tò mò kiểu Bastet."

 holy_order_eyes_cahlash: "Mắt của Cahlash"

 
 mnetics: "Mnetic"
 mnetics_adj: "Mnetic"
 mnetics_adherent: "Mnetic"
 mnetics_adherent_plural: "Mnetic"
 mnetics_desc: "Mnetic chính là Kẻ Ăn Bí Mật. Đôi mắt họ đã được mở ra trước sự thật rằng ký ức chỉ là phù du và có thể bị bóp méo. Trong khi các Mokolé khác dành hàng năm trời sống lại quá khứ qua Mnesis, Mnetic biết rằng tất cả chỉ là dối trá. Nếu mọi Mokolé đều nhớ lại quá khứ, vậy sao mỗi người lại nhớ khác nhau? Kẻ Ăn Bí Mật say sưa bóp méo Mnesis bằng dối trá và lừa lọc của mình. Nhiều Mokolé đã sa ngã trước [Glossary('Kẻ Hòa Tan', 'glossary_wyrm_tt')] vì tin vào lời dối trá của hắn, và nhờ đó Mnetic ngày càng mạnh hơn."

 holy_order_forgotten_nightmares: "Cơn Ác Mộng Bị Lãng Quên"