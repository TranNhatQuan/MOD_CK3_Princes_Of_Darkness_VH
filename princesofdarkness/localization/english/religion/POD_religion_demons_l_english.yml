 avarice: "Tham Lam"
 avarice_adj: "Tham Lam"
 avarice_desc: "Ác quỷ của lòng tham muốn chiếm hữu tất cả mọi thứ, kiểm soát mọi điều chúng thấy và không cho kẻ khác được có. Không như những kẻ háu ăn, ác quỷ tham lam không muốn tiêu thụ những thứ chúng thèm khát, chúng muốn giữ những thứ đó mãi mãi, ngay cả rất lâu sau khi chúng đã mục nát thành vô dụng. Ác quỷ của lòng tham thường kín đáo và xảo quyệt, luôn để mắt đến những lợi ích lâu dài; đối với một thực thể bất tử, việc bỏ ra ba thế kỷ để gây dựng ảnh hưởng lên một đất nước hay một giáo phái chẳng phải nỗ lực gì lớn lao, miễn là cuối cùng ngươi nắm trọn quyền kiểm soát nó."
 avarice_adherent: "Ác quỷ của Lòng Tham"
 avarice_adherent_plural: "Ác quỷ của Lòng Tham"

 envy: "Đố Kỵ"
 envy_adj: "Đố Kỵ"
 envy_desc: "Ác quỷ của lòng đố kỵ tìm cách hủy diệt những kẻ sở hữu thứ mà ác quỷ không có — tự do, tình yêu, hy vọng và sự an ủi từ phước lành của Chúa Trời. Những con ác quỷ ấy không muốn có những thứ đó cho riêng mình; điều chúng muốn là trừng phạt những kẻ dám ngông cuồng sở hữu những thứ ấy, những kẻ tự cho mình cao quý hơn người khác vì có được những phước lành đó. Chỉ sau khi kéo mọi kẻ khác xuống bùn nhơ, những con ác quỷ này mới thấy thỏa mãn, khi biết rằng không ai khác trong cõi Sáng Thế hạnh phúc hơn chúng."
 envy_adherent: "Ác quỷ của Sự Đố Kỵ"
 envy_adherent_plural: "Ác quỷ của Sự Đố Kỵ"

 gluttony: "Háu Ăn"
 gluttony_adj: "Háu Ăn"
 gluttony_desc: "Ác quỷ của sự háu ăn khao khát cảm giác, thỏa mãn mọi ham muốn và dục vọng vượt quá điểm no đủ rồi vẫn tiếp tục không ngừng. Người phàm thường gắn sự háu ăn với ham muốn thức ăn, nhưng thực chất đó đơn thuần là ham muốn tiêu thụ, sử dụng nhiều tài nguyên hơn mức cần thiết. Một con ác quỷ trong cơn cuồng háu ăn chọn lấy một loại tài nguyên nhất định — thức ăn, đức tin, mạng sống con người — và tìm thấy niềm vui đồi bại không chỉ trong việc dùng cạn hay hủy hoại thứ đó, mà còn phô trương sự hủy diệt và tiêu thụ ấy trước những kẻ giờ đây buộc phải sống thiếu thốn."
 gluttony_adherent: "Ác quỷ của Sự Háu Ăn"
 gluttony_adherent_plural: "Ác quỷ của Sự Háu Ăn"

 lust: "Dục Vọng"
 lust_adj: "Dục Vọng"
 lust_desc: "Ác quỷ của dục vọng đắm chìm trong những thôi thúc và cảm giác của thể xác, phát cuồng trước những khả năng buông thả xác thịt. Những con ác quỷ này thường xuyên chiếm hữu các tín đồ, thỏa thích trong khoái lạc và hoạt động trước khi tận hưởng cảm giác từ cái chết ghê rợn của những thân xác đó. Ác quỷ của dục vọng thường ám ảnh với chuyện chăn gối, nhưng đó không phải hình thức khoái lạc thể xác duy nhất chúng khao khát — chúng lao vào những cuộc truy hoan ăn uống, đánh nhau, say sưa và hủy diệt trong khoảng thời gian chúng có được trong một thân xác."
 lust_adherent: "Ác quỷ của Dục Vọng"
 lust_adherent_plural: "Ác quỷ của Dục Vọng"

 pride: "Kiêu Ngạo"
 pride_adj: "Kiêu Ngạo"
 pride_desc: "Mọi con ác quỷ đều hiểu rõ tội kiêu ngạo, có lẽ còn rõ hơn cả loài người từng có thể hiểu. Chính sự kiêu ngạo là Tội Lỗi Đầu Tiên, tội của Lucifer và toàn thể các thiên thần đã nổi loạn chống lại Chúa Trời thay vì chấp nhận sắc lệnh của Người. Ác quỷ của sự kiêu ngạo vẫn luôn đặt mình lên trên mọi thực thể khác, và đòi hỏi sự tôn thờ cùng tán tụng từ cả người phàm lẫn đồng loại ác quỷ. Chìm đắm trong ngạo mạn, một con ác quỷ kiêu ngạo có thể san bằng cả một thành phố chỉ để trừng phạt một lời xúc phạm nhỏ nhặt, hoặc tra tấn cả một xã hội cho đến khi từng thành viên đồng ý yêu mến và tôn thờ nó vô điều kiện."
 pride_adherent: "Ác quỷ của Sự Kiêu Ngạo"
 pride_adherent_plural: "Ác quỷ của Sự Kiêu Ngạo"

 sloth: "Lười Biếng"
 sloth_adj: "Lười Biếng"
 sloth_desc: "Ác quỷ của sự lười biếng chẳng hề biếng nhác chút nào; đó chỉ là cách nhìn sai lệch của người phàm về tội lỗi này. Lười biếng là nhu cầu về sự đơn giản, sự tiện lợi — một sự thờ ơ đến mức phản xã hội tuyệt đối với thế giới. Ác quỷ của sự lười biếng gần như đều là ác quỷ của cái chết, những kẻ từng dẫn dắt các linh hồn đến phần thưởng cuối cùng của chúng. Giờ đây chúng khao khát sự cô tịch và tĩnh lặng của cái chết, sự thanh bình của một thế giới trống rỗng. Những con ác quỷ này hiếm gặp, bởi hư vô của Địa Ngục có xu hướng nuốt chửng chúng mãi mãi; số còn sót lại là những quái vật sẵn sàng dập tắt cả một đất nước chỉ để làm im tiếng khóc của một đứa trẻ, những kẻ khát khao sự hủy diệt tuyệt đối và một thế giới chỉ còn bụi và bia mộ."
 sloth_adherent: "Ác quỷ của Sự Lười Biếng"
 sloth_adherent_plural: "Ác quỷ của Sự Lười Biếng"

 wrath: "Thịnh Nộ"
 wrath_adj: "Thịnh Nộ"
 wrath_desc: "Ác quỷ của sự thịnh nộ là những cơn lốc tàn sát và hủy diệt, những quái vật càn quét và giết chóc chỉ vì niềm vui thuần túy của sự hủy diệt. Thịnh nộ còn hơn cả một sự khao khát bạo lực; đó là lời tuyên xưng của cơn giận chính đáng, của việc giáng phạt lên những kẻ đã phạm lỗi. Một số ác quỷ của sự thịnh nộ tự xem mình là những kẻ thực thi trật tự xã hội, nhưng số khác chẳng buồn tự lừa dối mình bằng những lời như vậy. Dù thế nào, nỗi ám ảnh của con ác quỷ này vẫn là trút giận và hủy diệt bất cứ thứ gì khiến nó bực bội, cản trở hay đơn giản chỉ là gây phiền toái."
 wrath_adherent: "Ác quỷ của Sự Thịnh Nộ"
 wrath_adherent_plural: "Ác quỷ của Sự Thịnh Nộ"

