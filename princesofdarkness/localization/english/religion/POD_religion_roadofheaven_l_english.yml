 #Noddist-Group Faiths
 
 viacaeli: "Via Caeli"
 viacaeli_adj: "Tín đồ Nod"
 viacaeli_adherent: "Tín đồ Nod"
 viacaeli_adherent_plural: "Tín đồ Nod"
 viacaeli_desc: "Theo Phúc Âm Laodice, một thánh văn của $pod_cainite$, các nguyên lý của một số Con Đường Via Caeli bắt nguồn từ chính Caine. Dù Caine bị Thượng Đế nguyền rủa, hắn cũng gần gũi với Thượng Đế hơn bất kỳ Huyết Tộc nào từng tồn tại. Tín đồ của Con Đường Thiên Đường cố gắng kiểm soát Dã Thú của mình thông qua lòng sùng đạo."

 viadivinitatis: "Via Divinitatis"
 viadivinitatis_adj: "Tín đồ Thần Thánh"
 viadivinitatis_adherent: "Tín đồ Thần Thánh"
 viadivinitatis_adherent_plural: "Tín đồ Thần Thánh"
 viadivinitatis_desc: "Những kẻ cuồng tín của phái Nod và là tiền thân của Sabbat, tín đồ của Con Đường này tự cho mình được Thượng Đế sủng ái thay vì bị Người nguyền rủa, những tín đồ phái Thần Thánh tìm cách kiểm soát người phàm và lôi kéo càng nhiều $pod_cainites$ càng tốt gia nhập Via Caeli. Đạo Lộ này bị nhiều người coi là lệch lạc nhất trong bốn nhánh."

 viapenaculum: "Via Penaculum"
 viapenaculum_adj: "Penaculum"
 viapenaculum_adherent: "Kẻ Sám Hối"
 viapenaculum_adherent_plural: "Kẻ Sám Hối"
 viapenaculum_desc: "Các Tín Đồ theo Con Đường Sám Hối tự coi mình không xứng đáng với Thượng Đế, là sinh vật thấp hèn nhất trong mắt Người. Không đạo lộ nào coi trọng các hành vi sám hối đến vậy, bởi đây là cách duy nhất mà những $pod_cainites$ này thấy được để đạt tới giác ngộ và được Thượng Đế đoái hoài."

 viavindicta: "Via Vindicta"
 viavindicta_adj: "Vindicta"
 viavindicta_adherent: "Thập Tự Quân"
 viavindicta_adherent_plural: "Thập Tự Quân"
 viavindicta_desc: "Những Huyết Tộc này tự coi mình là Bàn Tay Thịnh Nộ của Thượng Đế, tiêu diệt những kẻ đã xúc phạm Người. Bất kỳ ai bị coi là tà ác hay bất trung với Thượng Đế đều phải bị hủy diệt. Họ thường săn lùng những $pod_cainites$ mà họ coi là đồi bại."

 viadolorosa: "Via Dolorosa"
 viadolorosa_adj: "Dolorosa"
 viadolorosa_adherent: "Kẻ Tuẫn Đạo"
 viadolorosa_adherent_plural: "Kẻ Tuẫn Đạo"
 viadolorosa_desc: "Những kẻ tuẫn đạo của Con Đường Nước Mắt, các tín đồ Nod này tự hiến mình làm vật hy sinh bất tử để người khác không phải chịu khổ. Họ sẵn lòng hy sinh bản thân để ngăn chặn mọi sự đồi bại gây ra bởi bất cứ điều gì bị coi là ô uế, đặc biệt là ác quỷ hay những $pod_cainites$ khác."

 viachristi: "Via Christi"
 viachristi_adj: "Christi"
 viachristi_adherent: "Tín Đồ Cơ Đốc"
 viachristi_adherent_plural: "Tín Đồ Cơ Đốc"
 viachristi_desc: "$pod_cainites$ từng là tín đồ Cơ Đốc lúc còn sống có thể chọn theo Con Đường Christ, với niềm tin rằng kế hoạch của Thượng Đế cho thế gian bao gồm cả ma cà rồng, và việc luôn vâng phục ý Người sẽ giúp họ kiểm soát Dã Thú."
 
 derechchaim: "Derech Chaim"
 derechchaim_adj: "Derech Chaim"
 derechchaim_adherent: "Estries"
 derechchaim_adherent_plural: "Estrie"
 derechchaim_desc: "$pod_cainites$ từng theo Do Thái giáo lúc còn sống có thể chọn theo Con Đường Sự Sống. Họ tin rằng HaShem đã tạo ra ma cà rồng cùng với phần còn lại của thế giới, và do đó luật lệ của Torah vẫn áp dụng cho họ và mang lại phương tiện để kiểm soát Dã Thú."
 
 codeofsamiel: "Luật Lệ Samiel"
 codeofsamiel_adj: "Tín đồ Samiel"
 codeofsamiel_adherent: "Tín đồ Samiel"
 codeofsamiel_adherent_plural: "Tín đồ Samiel"
 codeofsamiel_desc: "Người vĩ đại nhất trong dòng chiến binh của Saulot, vị sáng lập tuẫn đạo Samiel được cho là đã tự tay chấp bút viết nên con đường này. Theo truyền thuyết, Samiel đã nhận được các nguyên lý cốt lõi về danh dự và thịnh nộ của con đường này trong một lần được Michael, thống lĩnh Thiên Binh, hiện đến, trong lúc Saulot vắng mặt."

 viaarchangeli: "Via Archangeli"
 viaarchangeli_adj: "Nephilim"
 viaarchangeli_adherent: "Nephilim"
 viaarchangeli_adherent_plural: "Nephilim"
 viaarchangeli_desc: "Noi theo bước chân của Michael nghĩa là hành động như nàng thơ và người chăn dắt cho tất cả, và như kẻ tuẫn đạo khi cần thiết. Là tín đồ của Con Đường Thiên Đường, các Tín Đồ của Đại Thiên Thần xem Michael như đấng Christ hồi sinh của những kẻ Bị Nguyền Rủa và tin rằng ma cà rồng phải đóng vai thiên thần đối với đàn người phàm của mình."
 
 holy_order_order_of_bitter_ashes: "Hội Tro Tàn Cay Đắng"
 holy_order_leper_knights: "Hiệp Sỹ Phong Cùi"
 holy_order_order_of_chanticleer: "Hội Gà Trống Gáy"
 holy_order_the_unblooded: "Những Kẻ Không Máu"
 holy_order_order_of_laodicea: "Hội Laodice"
 holy_order_order_of_nod: "Hội Nod"
 holy_order_the_faithful: "Những Người Trung Thành"
 holy_order_order_of_divinity: "Hội Thần Thánh"
 holy_order_holy_order_of_vengeance: "Hội Báo Thù Chí Thánh"
 holy_order_order_of_penitence: "Hội Sám Hối"
 holy_order_martyrs_of_tears: "Những Kẻ Tuẫn Đạo Nước Mắt"
 holy_order_order_of_terafim: "Hội Terafim"
 holy_order_order_of_estries: "Hội Estries"

 consumptionism: "Thuyết Cuồng Thực"
 consumptionism_adj: "Thuyết Cuồng Thực"
 consumptionism_adherent: "Tín đồ Cuồng Thực"
 consumptionism_adherent_plural: "Tín đồ Cuồng Thực"
 consumptionism_desc: "Thượng Đế đã chết, bị Caine diablerie hóa. Sau đó Caine sinh ra một thế hệ khác, và tia sáng của Thượng Đế trong hắn bị chia tách. Vì vậy, các Tín đồ Cuồng Thực cho rằng không được giết hại bất kỳ sinh mạng Huyết Tộc nào... trừ khi tia sáng của Thượng Đế trong họ được thu hồi lại bằng $pod_diablerie$."
  
 divisionism: "Thuyết Phân Chia"
 divisionism_adj: "Thuyết Phân Chia"
 divisionism_adherent: "Tín đồ Phân Chia"
 divisionism_adherent_plural: "Tín đồ Phân Chia"
 divisionism_desc: "Thượng Đế đã chia sẻ bản chất của Người vào mọi Huyết Tộc, nhưng chỉ những kẻ trung thành mới đủ thánh thiện để xứng đáng nhận lấy nó. Vì vậy, các tín đồ Phân Chia tìm cách cải đạo hoặc [Glossary('Diablerize','game_concept_diablerie_desc')] các ma cà rồng khác."
    
 viaaesigard: "Via Aesigard"
 viaaesigard_adj: "Aesigard"
 viaaesigard_adherent: "Aesigard"
 viaaesigard_adherent_plural: "Aesigard"
 viaaesigard_desc: "Những nếp sống và truyền thống Bắc Âu cổ xưa phải được gìn giữ, và ma cà rồng không phải Thần Linh hay thậm chí được các Thần Linh chọn lựa. Họ bị trói buộc bởi định mệnh, như mọi người Bắc Âu khác.\nAesigard thông thái tìm cách truyền bá các Saga để chân lý được biết đến, dù cho kết cục đã được viết sẵn."

 vianoctis: "Via Noctis"
 vianoctis_adj: "Noctis"
 vianoctis_adherent: "Kẻ Cứu Chuộc"
 vianoctis_adherent_plural: "Kẻ Cứu Chuộc"
 vianoctis_desc: "Những Kẻ Cứu Chuộc cảm nhận sức nặng lời nguyền của Caine và sự đọa đày của chính mình, thậm chí còn hơn cả những tín đồ theo Via Caeli. Cũng như các tín đồ Nod, những Kẻ Cứu Chuộc tìm kiếm sự cứu rỗi và tha thứ, và để đạt được nó đòi hỏi phải chịu khổ và thanh tẩy. Tuy nhiên, thay vì những cách thức khá ôn hòa của tín đồ Nod, những Kẻ Cứu Chuộc chủ động dấn thân vào thế giới loài người, trừng phạt và giết chết những kẻ phàm nhân tội lỗi."

 pathoftheheavenlyabode: "Con Đường Nơi Ở Thiên Đàng"
 pathoftheheavenlyabode_adj: "Thiên Đàng"
 pathoftheheavenlyabode_adherent: "Kẻ Báo Oán"
 pathoftheheavenlyabode_adherent_plural: "Kẻ Báo Oán"
 pathoftheheavenlyabode_desc: "Tín đồ của con đường này tin rằng, để thực sự cứu rỗi một linh hồn, thân xác phàm trần phải bị hủy diệt ngay khi linh hồn đã tìm được sự cứu rỗi, nhằm ngăn chặn sự đồi bại tiếp diễn."

 viaredemptio: "Via Redemptio"
 viaredemptio_adj: "Được Cứu Chuộc"
 viaredemptio_adherent: "Kẻ Được Cứu Chuộc"
 viaredemptio_adherent_plural: "Kẻ Được Cứu Chuộc"
 viaredemptio_desc: "Via Redemptio là một biến thể cực đoan tách ra từ Via Penaculum. Họ chấp nhận rằng mình đã bị Thượng Đế nguyền rủa vì tội lỗi của mình và phải chuộc tội, nhưng sẽ không ngần ngại hành động quyết liệt chống lại ác quỷ và những kẻ tội lỗi để cứu chuộc linh hồn mình."


