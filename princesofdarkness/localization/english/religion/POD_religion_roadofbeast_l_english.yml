 viatantabus_desc: "Ma cà rồng theo Baba Yaga toàn năng, Mụ Phù Thủy của nước Nga. Nosferatu duy nhất từng thách thức đấng thủy tổ quái dị của mình, Grandmother vừa được ngưỡng mộ vừa bị khinh miệt như nhau bởi $pod_clan$ của bà."
 
