 #Feral-Group Faiths
 viabestiae: "Via Bestiae"
 viabestiae_adj: "Dã Thú"
 viabestiae_adherent: "Dã Thú"
 viabestiae_adherent_plural: "Những Kẻ Dã Thú"
 viabestiae_desc: "Tín đồ của Con Đường Dã Thú kiểm soát Dã Thú của mình qua các khái niệm nguyên thủy về sinh tồn, sức mạnh và cá tính. Nhiều tín đồ Con Đường Dã Thú chọn một cuộc sống đơn giản, hoang dã để phụng sự tốt nhất tín điều của Via Bestiae, trong khi những kẻ khác theo đuổi nó bằng cách sống một cuộc đời giản đơn, chẳng khác gì kẻ man rợ."

 viapraedator: "Via Praedator"
 viapraedator_adj: "Praedator"
 viapraedator_adherent: "Thợ Săn"
 viapraedator_adherent_plural: "Những Thợ Săn"
 viapraedator_desc: "Những Kẻ Dã Thú theo Con Đường Thợ Săn tồn tại để săn đuổi những kẻ mà chúng xem là thấp kém hơn mình. Làm khác đi là báng bổ. Chúng cũng dùng Dã Thú của mình như một công cụ để hoàn thành cuộc săn."

 viaerronis: "Via Erronis"
 viaerronis_adj: "Kẻ Lang Thang"
 viaerronis_adherent: "Kẻ Lang Thang"
 viaerronis_adherent_plural: "Những Kẻ Lang Thang"
 viaerronis_desc: "Đối với những Kẻ Dã Thú theo Con Đường Kẻ Du Mục này, văn minh và bất cứ thứ gì gắn liền với nó đều là điều ghê tởm. Chúng đi nhẹ, và chúng luôn di chuyển. Con đường này còn được gọi là Con Đường Hành Trình."

 viaferitas: "Via Feritas"
 viaferitas_adj: "Kẻ Man Dã"
 viaferitas_adherent: "Kẻ Man Dã"
 viaferitas_adherent_plural: "Những Kẻ Man Dã"
 viaferitas_desc: "Những Kẻ Dã Thú trên Con Đường Kẻ Man Dã là những kẻ dễ để Dã Thú bung phát thành cơn Phẫn Cuồng nhất. Cơn thịnh nộ của chúng nhắm vào bất cứ thứ gì chúng cho là yếu đuối, đặc biệt là văn minh. Chúng ra đòn thường xuyên, và ra đòn thật mạnh."

 viavenatorumbra: "Via Venator Umbra"
 viavenatorumbra_adj: "Venator Umbra"
 viavenatorumbra_adherent: "Thợ Săn Xám"
 viavenatorumbra_adherent_plural: "Những Thợ Săn Xám"
 viavenatorumbra_desc: "Nếu có những Kẻ Dã Thú nào không ghê tởm khái niệm văn minh, thì đó chính là những kẻ theo Con Đường Thợ Săn Xám này. Trái lại, chúng xem thị trấn và thành phố như một dạng khác của bãi săn. Chúng là những Kẻ Dã Thú văn minh nhất, nhưng đừng nhầm, chúng không hề kém tài săn bắt so với những kẻ khác."
 
 vialiberatio: "Via Liberatio"
 vialiberatio_adj: "Liberatio"
 vialiberatio_adherent: "Kẻ Giải Phóng"
 vialiberatio_adherent_plural: "Những Kẻ Giải Phóng"
 vialiberatio_desc: "Thường bị nhầm lẫn với Furores, những Kẻ Dã Thú trên Via Liberatio xem thành phố như một cái bẫy và cái chết của tâm hồn. Chúng xem nhiệm vụ của mình là giải phóng những con người bị giam cầm hướng tới một lối sống thuần khiết, nguyên thủy hơn."

 viaeinherjar: "Einherjar"
 viaeinherjar_adj: "Einherjar"
 viaeinherjar_adherent: "Einherjar"
 viaeinherjar_adherent_plural: "Einherjar"
 viaeinherjar_desc: "Một Con Đường được thực hành trong giới ma cà rồng Bắc Âu, đóng vai trò như lời nhắc nhở về đạo lý cổ xưa mà Đấng Toàn Phụ đã trao cho họ. Con Đường này dạy về trách nhiệm, lòng can đảm trước nghịch cảnh, và tinh thần chủ động cá nhân. Nhiều kẻ xua đuổi Dã Thú bằng những hành động kỷ luật sắt đá và lòng can đảm, chẳng hạn như đứng nhìn mặt trời mọc. Phần lớn tín đồ của Con Đường này thô lỗ, chỉ biết vun vén cho bản thân, và ngược đãi thể xác những kẻ mà họ không tôn trọng. Thường thì, ngay cả những người họ tôn trọng cũng chỉ được đối xử khá hơn đôi chút."
 
 viayasaq: "Yasaq"
 viayasaq_adj: "Yasa"
 viayasaq_adherent: "Anda"
 viayasaq_adherent_plural: "Anda"
 viayasaq_desc: "Một Con Đường của ma cà rồng vùng Thảo Nguyên, cụ thể là của [Glossary('Anda','podgloss.anda')]. Nó gợi nhớ lại nhiều truyền thống của yasa (huynh đệ chiến binh) trong dân Mông Cổ. Tín đồ của Con Đường Yasa được người phương Tây gọi là Man Rợ."
 
 pathofnoiad: "Path of the Noiad"
 pathofnoiad_adj: "Noiad"
 pathofnoiad_adherent: "Noiad"
 pathofnoiad_adherent_plural: "Noiad"
 pathofnoiad_desc: "Nguồn gốc của các Noiad đã bị cả $pod_cainite$ lẫn người phàm lãng quên. Trong tâm trí của các Noiad, họ luôn ngự ở phương Bắc, dẫn dắt và bảo vệ các bộ tộc Sámi ở miền bắc Scandinavia. Các Noiad tin rằng bản thân là những sinh thể thần thánh, được các vị thần phái đến để dẫn dắt và bảo vệ dân tộc được chọn của họ khỏi các mối đe dọa siêu nhiên lẫn trần tục, cũng như luận giải điềm báo của các vị Thần trong guovssahas. Mối quan hệ giữa Noiad và bộ tộc của họ mang tính cộng sinh: Noiad sẽ bảo vệ bộ tộc khỏi kẻ thù và làm người dẫn đường, pháp sư, và thầy dạy cho họ, trong khi bộ tộc tự nguyện hiến máu và che chở cho Noiad suốt những tháng dài không có bóng tối. Trong thời kỳ đói kém, Noiad sẽ [ghoul|E] các thành viên trong bộ tộc để đảm bảo họ sống sót. Noiad sống công khai giữa người Sámi, và chỉ được Trao truyền riêng trong phạm vi dân tộc này. Những kẻ được chọn cho $pod_Embrace$ thường là những kẻ có tài năng bói toán, cũng như luận giải giấc mơ và chiêm tinh. Noiad cũng theo dõi những đứa trẻ hậu duệ từ các gia đình có ít nhất một ma cà rồng, tìm kiếm những đặc điểm mà họ ưa chuộng."
 
