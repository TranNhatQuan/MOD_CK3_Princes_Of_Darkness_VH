 #Spectre-Group Faiths
 malfean: "Malfean"
 malfean_adj: "Malfean"
 malfean_desc: "Malfean là những thế lực vĩ đại của bóng tối và hủy diệt, mang đến đau khổ, tà ác và khiếp sợ bất cứ nơi nào tầm ảnh hưởng của chúng chạm tới. Nhưng phần lớn, chúng là một thế lực vô hình, chỉ được cảm nhận qua tay sai và bộ hạ của mình. Nhân loại nên biết ơn vì điều đó."
 malfean_adherent: "Spectre"
 malfean_adherent_plural: "Spectre"
 
 grand_maw: "Grand Maw"
 grand_maw_adj: "Grandmother"
 grand_maw_desc: "Grandmother là tên gọi của... một thứ gì đó. Có kẻ tin rằng "bà" là đứa em sinh đôi tà ác của Chúa Trời, kẻ khác nghĩ "bà" là tàn dư của một vũ trụ đã chết, và những kẻ khác nữa lại chỉ ra rằng "bà" chính là [UmbraGlossary('oblivion')]. "Bà" thực chất là gì thì không ai biết được, nhưng điều được biết là bà ta cổ xưa và muốn nuốt chửng mọi linh hồn sống trên trái đất. Cái tên thường gọi của bà ta bắt nguồn từ biệt danh "the Grand Maw", nghe gần giống từ "Grandma". Vì vậy, bà ta được biết đến với tên gọi Grandmother."
 grand_maw_adherent: "Spectre"
 grand_maw_adherent_plural: "Spectre"