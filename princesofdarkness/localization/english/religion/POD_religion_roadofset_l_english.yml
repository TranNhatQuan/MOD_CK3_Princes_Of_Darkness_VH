 #Settite-Group Faiths
 viaset: "Con Đường Set"
 viaset_adj: "Setite"
 viaset_adherent: "Setite"
 viaset_adherent_plural: "Setite"
 viaset_desc: "Nhánh chính của $pod_clan$ Set là một tổ chức mang tính giáo phái, thờ phụng [Glossary('Antediluvian','game_concept_antediluvian_desc')] của mình (hay vị thần đích thực) như đấng giải phóng toàn nhân loại."
 
 viaapep: "Con Đường Apep"
 viaapep_adj: "Apepite"
 viaapep_adherent: "Apepite"
 viaapep_adherent_plural: "Apepite"
 viaapep_desc: "Những kẻ này xem trạng thái bất tử của mình là một món quà được ban phước từ con rắn hỗn loạn, chứ không phải một lời nguyền. Vì thế, chúng đắm chìm trong hỗn loạn và thỏa mãn bản thân. Chúng xem $glossary_wyrm_apep$ Con Rắn của Hỗn Loạn như một hóa thân của Set."
 
 pathofsubversion: "Con Đường Lật Đổ"
 pathofsubversion_adj: "Tha Hóa"
 pathofsubversion_adherent: "Kẻ Tha Hóa"
 pathofsubversion_adherent_plural: "Kẻ Tha Hóa"
 pathofsubversion_desc: "Chỉ thông qua việc tha hóa các định chế quy mô lớn thì con người mới được giải phóng. Những Kẻ Tha Hóa là những đặc vụ xuất sắc trong các tôn giáo và nhà nước có tổ chức."

 pathofheliopolis: "Con Đường Heliopolis"
 pathofheliopolis_adj: "Typhonian"
 pathofheliopolis_adherent: "Theophidian"
 pathofheliopolis_adherent_plural: "Theophidian"
 pathofheliopolis_desc: "Một Con Đường mới của Set được tạo ra từ giáo huấn của những ngôi đền sáng lập tại Cairo. Chỉ thời gian mới trả lời được Con Đường mới này sẽ ra sao trên thế gian."
 
 holy_order_cohort_of_set: "Đội Cấm Vệ của Set"
 holy_order_medjay: "Medjay"

 