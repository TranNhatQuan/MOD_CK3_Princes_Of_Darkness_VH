l_english: 

 #Common Modern Anarch Localization
 modernanarch_religion: "@vampire_icon! Anarch"
 modernanarch_religion_adj: "Anarch"
 modernanarch_religion_adherent: "Anarch"
 modernanarch_religion_adherent_plural: "Anarch"
 modernanarch_religion_desc: "Anarch là những ma cà rồng chối bỏ hiện trạng của xã hội $pod_cainite$."
 modernanarch_high_god_name: "Tự Do"
 modernanarch_high_god_name_alternate: "Tự Do"
 modernanarch_creator_god_name: "Tự Do"

 #ModernAnarch-Group Faiths
 
 freeanarch: "Anarch Tự Do"
 freeanarch_adj: "Anarch Tự Do"
 freeanarch_adherent: "Anarch Tự Do"
 freeanarch_adherent_plural: "Anarch Tự Do"
 freeanarch_desc: "Những $pod_cainites$ này sẽ không bao giờ khuất phục bất kỳ quyền lực nào ngoài quyền lực mà chính họ chọn cho mình, bất kể tỷ lệ thắng thua ra sao. Các thành trì Anarch thường hoang dại và bất trị, nhưng lại là ngọn hải đăng của hy vọng và tự do cho nhiều ma cà rồng trẻ tuổi. Và cũng là thứ mà các bậc trưởng lão của họ muốn nghiền nát càng sớm càng tốt."
 
 #Common Camarilla Localization
 camarilla_religion: "@vampire_icon! Camarilla"
 camarilla_religion_adj: "Camarilla"
 camarilla_religion_adherent: "Camarilla"
 camarilla_religion_adherent_plural: "Camarilla"
 camarilla_religion_desc: "Ngoài việc ngăn khối phàm nhân đang lớn mạnh phát hiện ra sự tồn tại của ma cà rồng, Camarilla còn nhắm tới việc duy trì hiện trạng của xã hội Huyết Tộc; do đó, phần lớn cơ cấu và truyền thống của nó phản chiếu xã hội $pod_cainite$ ở châu Âu phong kiến thời Trung Cổ Đen Tối."
 
 #Camarilla-Group Faiths
 
 camahumanity: "Camarilla (Nhân Tính)"
 camahumanity_adj: "Camarilla"
 camahumanity_adherent: "Camarilla"
 camahumanity_adherent_plural: "Camarilla"
 camahumanity_desc: "Huyết Tộc được khuyến khích hòa mình với phàm nhân càng nhiều càng tốt và giữ lấy sự lịch thiệp, điềm tĩnh có được từ việc bám lấy những đặc tính con người của mình. Hầu như mọi thành viên Camarilla đều theo "Con Đường" Nhân Tính, còn các Con Đường Giác Ngộ khác thì bị ngăn cản mạnh mẽ và thường chỉ được các bậc trưởng lão thực hành."

 camaanarchs: "Camarilla (Anarch)"
 camaanarchs_adj: "Anarch"
 camaanarchs_adherent: "Anarch"
 camaanarchs_adherent_plural: "Anarch"
 camaanarchs_desc: "Phần lớn Anarch tôn trọng và giữ vững Màn Che cùng một số Luật khác, dù họ không tôn trọng những ma cà rồng thực thi các luật ấy hay hệ thống hưởng lợi từ chúng.\nTheo các điều khoản của Công Ước Thorns, Anarch được các thành viên Camarilla xem là một phe phái của Camarilla, nhưng không như Sabbat, họ được dung thứ."
    
 #Common Sabbat Localization
 sabbat_religion: "@vampire_icon! Sabbat"
 sabbat_religion_adj: "Sabbat"
 sabbat_religion_adherent: "Sabbat"
 sabbat_religion_adherent_plural: "Sabbat"
 sabbat_religion_desc: "Sabbat là một tổ chức lỏng lẻo gồm những $pod_cainites$ chối bỏ các Luật. Không như Camarilla, Sabbat tin vào [Glossary('Antediluvians','game_concept_antediluvian_desc')] và Caine. Còn được gọi là Thanh Kiếm của Caine, vì họ tin rằng mình sẽ là đội quân mà ngài dùng để hủy diệt [Glossary('Antediluvians','game_concept_antediluvian_desc')] một khi Gehenna đến."
 sabbat_religious_head_title: "Priscus"
 sabbat_religious_head_title_name: "Priscus"
 sabbat_religious_text: "Sách Nod"

 #Sabbat-Group Faiths
 
 pathofhonorableaccord: "Con Đường Hòa Ước Danh Dự"
 pathofhonorableaccord_adj: "Người Ái Quốc Sabbat"
 pathofhonorableaccord_adherent: "Người Ái Quốc"
 pathofhonorableaccord_adherent_plural: "Người Ái Quốc"
 pathofhonorableaccord_desc: "Con Đường Hòa Ước Danh Dự là một Con Đường Giác Ngộ khai thác Dã Thú thông qua việc thực hành nghiêm ngặt lối hành xử danh dự và hiệp nghĩa.\n $pod_cainites$ theo Con Đường Hòa Ước Danh Dự đặt giá trị cao vào nghi thức và lễ nghi. Vì vậy các Hiệp Sỹ của Sabbat luôn tham gia các đoàn chinh chiến, ritae, lễ nghi cùng các sự kiện khác của pack. Nhìn chung, những kẻ theo Con Đường này tìm cách kết dệt các phe phái rời rạc của giáo phái lại dưới một ngọn cờ chung là lòng trung thành với một chính nghĩa."
 
 pathofdeathandthesoul: "Con Đường Cái Chết & Linh Hồn"
 pathofdeathandthesoul_adj: "Người Nghiên Cứu Tử Vong Sabbat"
 pathofdeathandthesoul_adherent: "Người Nghiên Cứu Tử Vong"
 pathofdeathandthesoul_adherent_plural: "Người Nghiên Cứu Tử Vong"
 pathofdeathandthesoul_desc: "Con Đường Cái Chết và Linh Hồn là một Con Đường Giác Ngộ đè nén Dã Thú bằng việc nghiên cứu một cách tách bạch về cái chết, trạng thái phi tử và linh hồn.\nLà một trong những con đường học thuật nhất, Người Nghiên Cứu Tử Vong xem sự tồn tại của ma cà rồng như một phương tiện để khám phá những bí ẩn của sự sống và cái chết. Họ chia vũ trụ thành cõi lý tính của xác thịt và vật lý, cùng cõi phi lý tính của khổ đau, bí ẩn và hiện tượng siêu nhiên. Để khám phá những khác biệt này và tìm ra câu trả lời cho các câu hỏi của mình, một ma cà rồng phải khám phá chính trạng thái của bản thân và bản chất của linh hồn."
 
 pathofpowerandtheinnervoice: "Con Đường Quyền Lực và Tiếng Nói Nội Tâm"
 pathofpowerandtheinnervoice_adj: "Người Hợp Nhất Sabbat"
 pathofpowerandtheinnervoice_adherent: "Người Hợp Nhất"
 pathofpowerandtheinnervoice_adherent_plural: "Người Hợp Nhất"
 pathofpowerandtheinnervoice_desc: "Con Đường Quyền Lực và Tiếng Nói Nội Tâm là một Con Đường Giác Ngộ kiểm soát Dã Thú thông qua quyết tâm nghiêm khắc và việc tích lũy quyền lực thế tục.\nNhững kẻ theo Con Đường này tin rằng chân lý nằm trong chính họ và cách tốt nhất để tìm ra nó là một cuộc tìm kiếm nội tâm hướng tới giác ngộ cá nhân, cuối cùng dẫn đến việc tích lũy quyền lực. Kiểm soát bản thân và thế giới bên ngoài là mục tiêu duy nhất đáng theo đuổi. Vì lẽ đó, một ma cà rồng phải phát triển năng lực của mình, mở rộng ảnh hưởng, và bày quân cờ của mình."
 
 pathofthebeast: "Con Đường Dã Thú"
 pathofthebeast_adj: "Dã Thú Sabbat"
 pathofthebeast_adherent: "Dã Thú"
 pathofthebeast_adherent_plural: "Dã Thú"
 pathofthebeast_desc: "Con Đường Dã Thú là một Con Đường Giác Ngộ tìm cách kiểm soát Dã Thú bằng việc chấp nhận những thôi thúc của nó như lẽ tự nhiên và chấp nhận vai trò của bản thân như một kẻ săn mồi giữa những kẻ săn mồi.\nVô tổ chức và né tránh những cạm bẫy của văn minh, những kẻ theo Con Đường này thường từ chối công nghệ để thay vào đó dựa vào tài năng vốn có trong hình hài bất tử của mình." 
 
 pathofmetamorphosis: "Con Đường Biến Hóa"
 pathofmetamorphosis_adj: "Người Biến Hóa Sabbat"
 pathofmetamorphosis_adherent: "Người Biến Hóa"
 pathofmetamorphosis_adherent_plural: "Người Biến Hóa"
 pathofmetamorphosis_desc: "Con Đường Biến Hóa là một Con Đường Giác Ngộ kiểm soát Dã Thú bằng cách nghiên cứu giới hạn của nó và giới hạn của ma cà rồng nói chung.\nHọ tin rằng bước kế tiếp là một trạng thái gần giống sự thần thánh hóa, mà họ gọi là Azhi Dahaka, theo tên con rồng trong thần thoại Ba Tư, và họ sẽ làm bất cứ điều gì – bất cứ điều gì – để đạt được nó. Đó là một triết lý xa xôi, cô độc, tách biệt khỏi mọi nhu cầu ngoài vấn đề duy trì sự sống."
 
 pathofcathari: "Con Đường Cathari"
 pathofcathari_adj: "Người Albigensia Sabbat"
 pathofcathari_adherent: "Người Albigensia"
 pathofcathari_adherent_plural: "Người Albigensia"
 pathofcathari_desc: "Con Đường Cathari tự coi mình là đối trọng trực tiếp của phái Cathar thời Trung Cổ: ma cà rồng là những linh hồn cai quản, kẻ cai ngục của Demiurge, được đặt vào thế gian này để đảm bảo loài người sẽ không bao giờ vượt thoát khỏi nó. Caine bị đấng tạo hóa tốt lành đày đọa vào thể xác và khổ đau bất tận, nhưng trong quá trình đó lại được đặt lên trên loài người, để đánh giá con người và cám dỗ họ rời xa sự ngộ đạo. Vì lẽ đó, người Albigensia (danh xưng chính thức của một kẻ theo con đường này) khuyến khích sự phóng túng và chủ nghĩa vật chất nơi phàm nhân, đồng thời cố tình phá vỡ nhiều điều cấm kỵ của phái Cathar cổ xưa."
 
 pathofcaine: "Con Đường Caine"
 pathofcaine_adj: "Người Theo Sách Nod Sabbat"
 pathofcaine_adherent: "Người Theo Sách Nod"
 pathofcaine_adherent_plural: "Người Theo Sách Nod"
 pathofcaine_desc: "Con Đường Caine là một Con Đường Giác Ngộ mô phỏng theo Người Cha Hắc Ám để xua đuổi Dã Thú.\nCốt lõi của Con Đường Caine nằm ở việc thể hiện trọn vẹn bản chất ma cà rồng: Những câu hỏi về sự tồn tại, giới hạn của hình hài ma cà rồng, và những biến đổi do Nghi lễ Trao truyền gây ra, tất cả thúc đẩy Người Theo Sách Nod vào những suy đoán, tranh luận, nghiên cứu và khảo cứu bất tận. Học thuật và hiểu biết lịch sử đều đáng quý, nhưng ma cà rồng cũng phải đồng thời phát triển về tâm linh lẫn thể chất, để khám phá giới hạn của hình hài bất tử mình."
 
 pathofharmony: "Con Đường Hài Hòa"
 pathofharmony_adj: "Người Hài Hòa Sabbat"
 pathofharmony_adherent: "Người Hài Hòa"
 pathofharmony_adherent_plural: "Người Hài Hòa"
 pathofharmony_desc: "Một biến thể của Con Đường Dã Thú ở chỗ nó chấp nhận Dã Thú như một điều cần thiết cho sự sinh tồn của ma cà rồng.\nNgười Hài Hòa không tin rằng bất cứ thứ gì tồn tại lại là phi tự nhiên. Chỉ đơn thuần tồn tại có nghĩa là một cá thể hay một thế lực có một vị trí. Điều này bao gồm cả ma cà rồng. Đúng, vai trò của ma cà rồng trong trật tự tự nhiên có phần khó chịu, nhưng rồi con thỏ cũng sẽ cảm thấy như vậy về con cáo mà thôi."
 
 pathofnight: "Con Đường Đêm Tối"
 pathofnight_adj: "Người Hư Vô Sabbat"
 pathofnight_adherent: "Người Hư Vô"
 pathofnight_adherent_plural: "Người Hư Vô"
 pathofnight_desc: "Con Đường Đêm Tối, đôi khi được gọi là Con Đường Đêm Tối Đồng Minh, là một Con Đường Giác Ngộ rao giảng sự chấp nhận lời nguyền của Caine và Dã Thú. Các Hậu duệ Cain phải khai thác sức mạnh của mình để phụng sự mục đích đã định sẵn của kiếp ma cà rồng – gieo rắc tàn phá lên phàm nhân và khơi dậy nỗi kinh sợ – và nhờ đó tìm thấy sự cứu rỗi."

 vasantasenadharma: "Vasantasenadharma"
 vasantasenadharma_adj: "Vasantasenadharma"
 vasantasenadharma_adherent: "Tín Đồ Vasantasena"
 vasantasenadharma_adherent_plural: "Tín Đồ Vasantasena"
 vasantasenadharma_desc: "Vasantasena và Sire Malkavian của bà, Unmada, đã chu du khắp thế giới suốt thời Trung Cổ, rao giảng chống lại Ràng Buộc Máu. Họ chối bỏ vinculum, hệ thống thứ bậc Huyết Tộc truyền thống, và mọi sự đánh mất ý chí tự do. Cuối cùng, họ lên án các Antediluvian vì sự chuyên chế tàn bạo của chúng qua Jyhad, gia nhập Sabbat trong thời kỳ hình thành của giáo phái này."

 pathofredemption: "Con Đường Cứu Chuộc"
 pathofredemption_adj: "Kẻ Tuẫn Đạo Sabbat"
 pathofredemption_adherent: "Kẻ Tuẫn Đạo"
 pathofredemption_adherent_plural: "Kẻ Tuẫn Đạo"
 pathofredemption_desc: "Con Đường Cứu Chuộc là một Con Đường Giác Ngộ chống lại Dã Thú bằng cách phấn đấu tìm kiếm sự cứu rỗi trong việc phụng sự Chúa. Đương nhiên, những tuyên bố này có phần bất tiện trong các xã hội hiện nay của Những Kẻ Bị Nguyền Rủa, nhưng những kẻ theo con đường này thường quyết tâm đạt được ân sủng hơn là quan tâm đến người khác."
 
 pathofleviathansabbat: "Con Đường Leviathan"
 pathofleviathansabbat_adj: "Leviathan"
 pathofleviathansabbat_adherent: "Leviathan"
 pathofleviathansabbat_adherent_plural: "Leviathan"
 pathofleviathansabbat_desc: "Tôn giáo phi chính thống này được một Patron ủy thác biên soạn.\n\nBắt nguồn từ thuyết đồng nhất luận Trung Hoa cổ đại, nó hướng tới việc xây dựng một tập thể giống Leviathan, tạo ra một khái niệm tập thể về cộng đồng học thuật thông qua sự giáo hóa linh hoạt và luật lệ cứng rắn, và cuối cùng tạo nên một ý chí tập thể thống nhất để tiến hóa về mặt tâm linh như một sinh vật đơn bào tiến hóa thành sinh vật đa bào."
       