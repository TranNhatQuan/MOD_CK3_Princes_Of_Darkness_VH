 #Lilin-Group Faiths
 derechlilit: "Derech Lilit"
 derechlilit_adj: "Lilin"
 derechlilit_adherent: "Lilin"
 derechlilit_adherent_plural: "Lilin"
 derechlilit_desc: "Con Đường Lilith tôn thờ nhân vật trong truyền thống Do Thái giáo, Lilith, người xuất hiện trong nhiều nguồn Noddist cũng như trong các truyền thống được các giáo phái bí mật lưu truyền. Phần lớn các giáo phái quy Lilith về những nguyên tắc căn bản: Về đau đớn và sáng tạo. Để sáng tạo, người ta phải gây tổn thương và bị tổn thương. Đây chính là nguyên tắc căn bản của sự sống."

 viafaciendi: "Via Faciendi"
 viafaciendi_adj: "Faciendi"
 viafaciendi_adherent: "Kẻ Tạo Tác"
 viafaciendi_adherent_plural: "Những Kẻ Tạo Tác"
 viafaciendi_desc: "Con Đường Tạo Tác tôn thờ việc tìm kiếm và truyền bá những đứa con quỷ dữ của Lilith, dựa trên truyền thống Kinh Thánh về Lilith như Mẹ của Quái Vật."

 viaspinae: "Via Spinae"
 viaspinae_adj: "Bahari"
 viaspinae_adherent: "Ba'ham"
 viaspinae_adherent_plural: "Bahari"
 viaspinae_desc: "Con Đường Gai Nhọn chú tâm vào nỗi đau thể xác. Thành viên nghiên cứu nỗi đau một cách có hệ thống, tìm cách hệ thống hóa các ngưỡng chịu đựng và những cách phá vỡ giới hạn của nạn nhân để nàng thấy được sự thật đau đớn của Lilith."

 viacalantica: "Via Calantica"
 viacalantica_adj: "Ki-sikil-lil-la-ke"
 viacalantica_adherent: "Ki-sikil-lil-la-ke"
 viacalantica_adherent_plural: "Ki-sikil-lil-la-ke"
 viacalantica_desc: "Con Đường Màn Che chú tâm vào hình ảnh Lilith như một kẻ nổi loạn và nhân vật đối lập với cả Thượng Đế của Abraham lẫn Caine. Họ là những kẻ hung hãn nhất trong số các Lilin, thường là chiến binh nhiều hơn là học giả."

 holy_order_bahari: "Bahari"
 holy_order_faithful_of_the_dark_mother: "Tín Đồ của Mẹ Bóng Tối"
 holy_order_lhaka: "Lhaka"

 daughtersofgorgo: "Con Gái của Gorgo"
 daughtersofgorgo_adj: "Gorgon"
 daughtersofgorgo_adherent: "Gorgon"
 daughtersofgorgo_adherent_plural: "Gorgon"
 daughtersofgorgo_desc: "Một tổ chức nhỏ nhưng hiếu chiến, tìm cách sát hại bất cứ bạo chúa ma cà rồng nào. Họ hoạt động như những sát thủ, huấn luyện những kẻ mới được Trao truyền bị hại thành những kẻ giết người rắn rỏi, sẵn sàng trả thù kẻ áp bức mình."
 