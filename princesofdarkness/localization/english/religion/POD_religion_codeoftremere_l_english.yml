 #Warlock-Group Faiths
 tremerecode: "Luật Lệ Tremere"
 tremerecode_adj: "Luật Lệ Tremere"
 tremerecode_adherent: "Phù Thủy"
 tremerecode_adherent_plural: "Phù Thủy"
 tremerecode_desc: "Luật Lệ Tremere đánh dấu $pod_clan$ này là độc nhất vô nhị giữa các $pod_cainites$; không một nhóm nào khác tuân theo một tập hợp quy tắc thống nhất phân định rạch ròi hành vi nào là chấp nhận được. Không có phép thuật ràng buộc nào bắt bất kỳ Tremere nào phải giữ lời thề, trừ khi một Regent nghiêm khắc nào đó chủ động quyết định thực thi nó; thay vào đó, luật lệ này trên thực tế là một bản liệt kê những gì cấu thành hành vi chấp nhận được đối với một thành viên của Gia tộc Tremere cao quý. Luật lệ này nêu rõ những gì được kỳ vọng ở người Tremere, và những hành vi nào sẽ chuốc lấy sự bất bình."

 viaservilis: "Via Servilis"
 viaservilis_adj: "Via Servilis"
 viaservilis_adherent: "Nô Bộc"
 viaservilis_adherent_plural: "Nô Bộc"
 viaservilis_desc: "Thường được gọi là Con Đường Phụng Sự. Via Servilis tuyên rằng chỉ những hành động làm hài lòng và tôn kính các đấng tạo hóa của giống loài Gargoyle mới xứng đáng được ngưỡng mộ."

