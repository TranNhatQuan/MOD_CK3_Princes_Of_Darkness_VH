 #Group Faiths

 calomenasforsaken: "Những Kẻ Ruồng Bỏ của Calomena"
 calomenasforsaken_adj: "Ruồng Bỏ"
 calomenasforsaken_adherent: "Ruồng Bỏ"
 calomenasforsaken_adherent_plural: "Ruồng Bỏ"
 calomenasforsaken_desc: "Là tai họa giáng xuống giống loài $pod_cainite$, những Kẻ Ruồng Bỏ là một nhóm thợ săn tin theo tà thuyết Bogomil. Họ tin rằng Calomena là em gái của Caine, và sứ mệnh của họ là mang đến sự hủy diệt cho những đứa con của Caine — loài ma cà rồng. Họ tin vào một triết lý nhị nguyên và cũng tuân giữ cảnh nghèo khổ khắc nghiệt mà hầu hết người Bogomil noi theo."
 holy_order_forsaken_militant: "Chiến Binh Ruồng Bỏ"
 