 holy_order_order_of_oradea: "Hội Oradea"
 holy_order_knez_of_dacia: "Knez của Dacia"
 holy_order_dragons_of_wallachia: "Rồng của Wallachia"

 pathofasakku: "Con Đường Asakku"
 pathofasakku_adj: "Kẻ Bị Tha Hóa"
 pathofasakku_adherent: "Kẻ Bị Tha Hóa"
 pathofasakku_adherent_plural: "Những Kẻ Bị Tha Hóa"
 pathofasakku_desc: "Phiên bản này của con đường là phi chính thống và được một Người Bảo Trợ ủy thác thực hiện\nMột nhà thần bí lang thang, Dragastes đã dùng Vicissitude của mình để chữa lành người bệnh và kẻ bị thương, cả loài Người lẫn Hậu duệ Cain. Tuy nhiên, với mỗi lần chữa lành, dòng máu nhiễm độc của hắn lại lan ra đám đông, làm thối rữa họ từ bên trong và tha hóa họ thành những công cụ đơn thuần cho ý chí của Asakku. Rất có thể lời nguyền của Dragastes đã lan rộng khắp phần lớn Địa Trung Hải. Tuy nhiên, Asakku, hay đúng hơn là những Watcher đã khống chế ý chí của hắn, đã đánh giá thấp những Hậu duệ Cain khác của Thành Phố. Dracon, một Tzimisce cổ xưa có tri thức về Vicissitude vượt xa cả Asakku, đã truy lùng nhiều giáo phái và nhanh chóng đẩy tên Tzimisce phản loạn phải bỏ trốn khỏi thành phố. Tuy nhiên, một số tàn dư của cơn điên loạn Dragastes vẫn còn sót lại nơi vùng biên viễn của Byzantium cổ đại, dù nhiều thế kỷ chuẩn bị và mưu tính đã bị phá hủy chỉ trong vài năm ngắn ngủi. Giáo phái từ đó đã di cư đến vùng hoang vu Siberia dưới sự dẫn dắt của Hierophant của họ, Matthaios Yelbeghen."
 
 pathofstars: "Con Đường Vì Sao"
 pathofstars_adj: "Con Đường Vì Sao"
 pathofstars_adherent: "Kẻ Tầm Đạo"
 pathofstars_adherent_plural: "Các Kẻ Tầm Đạo"
 pathofstars_desc: "Một phiên bản biến dị của Con Đường Biến Hóa, tín đồ của Con Đường Vì Sao tìm kiếm sự hoàn hảo và phụng sự một chủ nhân mới không chỉ bằng sự hoàn thiện bản thân, mà còn bằng sự hoàn thiện cả thế giới. Đau khổ là bản chất, một tài nguyên để khai thác. Vậy nên để thực sự thăng hoa, người ta phải biến đau khổ thành thứ tầm thường, dễ trao đổi như tiền xu, và phổ biến đến mức không ai còn nghĩ tới việc thách thức nó. Làm một Kẻ Tầm Đạo không chỉ là nâng tầm chính mình, mà còn là cho cả thế giới thấy giá trị thật sự của nó." 
 
 