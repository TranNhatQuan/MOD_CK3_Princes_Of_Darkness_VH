 #Seeker-Group Faiths
 viamutationis: "Via Mutationis"
 viamutationis_adj: "Biến Hóa Luận"
 viamutationis_adherent: "Kẻ Tầm Đạo"
 viamutationis_adherent_plural: "Các Kẻ Tầm Đạo"
 viamutationis_desc: "Tín đồ của Con Đường Biến Hóa dùng tri thức không phải vì người khác, mà vì chính bản thân họ. Những kẻ trở thành Kẻ Tầm Đạo sống cuộc đời cô độc, khép kín khi họ khám phá năng lực của chính mình. Họ dựa vào những câu đố và mảnh vụn thông tin, và thường đáp lại bằng những câu trả lời tương tự."

 pathoftheflesh: "Con Đường Xác Thịt"
 pathoftheflesh_adj: "Biến Hóa Luận Xác Thịt"
 pathoftheflesh_adherent: "Kẻ Tầm Đạo Xác Thịt"
 pathoftheflesh_adherent_plural: "Các Kẻ Tầm Đạo Xác Thịt"
 pathoftheflesh_desc: "Mục tiêu thật sự của con đường này hoàn toàn thuộc về thể xác. Sự biến đổi thân thể dẫn tới việc chiếm hữu quyền năng to lớn trong thế giới vật chất. Yếu tố tâm linh chỉ được xem là quan trọng khi nó hỗ trợ cho sự biến đổi thể xác này."

 pathofthespirit: "Con Đường Linh Hồn"
 pathofthespirit_adj: "Biến Hóa Luận Linh Hồn"
 pathofthespirit_adherent: "Kẻ Tầm Đạo Linh Hồn"
 pathofthespirit_adherent_plural: "Các Kẻ Tầm Đạo Linh Hồn"
 pathofthespirit_desc: "Mục tiêu thật sự của con đường này là một sự biến đổi hoàn toàn thuộc về tâm linh. Họ tin rằng con người chỉ nên chú tâm vào tâm trí và linh hồn, rằng sự biến đổi thể xác chỉ là ảo ảnh. Thế giới vật chất chỉ đơn thuần là công cụ cho sự trưởng thành tâm linh."
 
 viaapotheosis: "Via Apotheosis"
 viaapotheosis_adj: "Apotheosis"
 viaapotheosis_adherent: "Kẻ theo Apotheosis"
 viaapotheosis_adherent_plural: "Những Kẻ theo Apotheosis"
 viaapotheosis_desc: "Tôn giáo phi chính thống này được một Người Bảo Trợ ủy thác thực hiện\nTín đồ nỗ lực vượt qua giới hạn sinh học của mình, hoàn thiện năng lực tâm trí và thể xác cho đến khi họ trở nên không thể phân biệt với thần thánh. Các nghi lễ cạnh tranh bao gồm việc quỳ lụy và học hỏi từ bậc bề trên để đổi lấy sự hiến tế bằng máu. Vicissitude là $pod_discipline$ được sử dụng phổ biến nhất trong cuộc hành trình (bất tử) suốt (vô)sinh để đạt tới sự hoàn hảo, dù các tín đồ được khuyến khích sử dụng hầu như mọi quyền năng sẵn có để đạt được mục tiêu lý tưởng hóa và vị kỷ của mình (kể cả các khế ước với ác quỷ và $pod_diablerie$)."
