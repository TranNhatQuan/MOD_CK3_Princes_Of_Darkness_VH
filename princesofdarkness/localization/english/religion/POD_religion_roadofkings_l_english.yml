 cleopatrans: "Tín Đồ Cleopatra của Yima"
 cleopatrans_adj: "Tín Đồ Cleopatra"
 cleopatrans_adherent: "Tín Đồ Cleopatra"
 cleopatrans_adherent_plural: "Các Tín Đồ Cleopatra"
 cleopatrans_desc: "Giáo phái này là sự hòa trộn giữa truyền thuyết về Yima, vị Nosferatu huyền thoại dường như không bị ảnh hưởng bởi lời nguyền $pod_clan$ của mình, và Cleopatra, nữ hoàng Ai Cập xinh đẹp. Sự say mê này đã khiến $pod_clan$ trở nên hùng mạnh, và nhiều Prince từng là Tín Đồ Cleopatra cho đến khi Đế Chế La Mã sụp đổ. Giáo phái này gần như đã tàn lụi kể từ đó."
 
 path_of_carnal_desire: "Con Đường Dục Vọng Xác Thịt"
 path_of_carnal_desire_adj: "Dục Vọng"
 path_of_carnal_desire_adherent: "Kẻ Được Khao Khát"
 path_of_carnal_desire_adherent_plural: "Những Kẻ Được Khao Khát"
 path_of_carnal_desire_desc: "Tôn giáo phi chính thống này được một Người Bảo Trợ đặt riêng.\n\nCòn được gọi là Via Carnalium Desideriorum, con đường này không phải là chuyện buông thả trong khoái lạc — mà là việc dùng dục vọng như một công cụ kiểm soát. Dù gợi cảm không kém Via Voluptarius, nó ít mang tính bản năng hơn mà thiên về sự thống trị thông qua dục vọng xác thịt. Đó là tiếng hát của các Nàng Tiên Cá trên đá ngầm, không phải những thủy thủ xấu số bị chúng mê hoặc. Khác với những kẻ theo Con Đường Tội Lỗi, những Kẻ Được Khao Khát tuân theo các chuẩn mực của Con Đường Quân Vương và truyền thống của nó, nên họ tìm được chốn nương náu trong triều đình của các Đại Clan.\n\nNhững Kẻ Được Khao Khát được biết đến với mối kình địch tôn giáo cùng các Tín Đồ Khoái Lạc, diễn ra trong các phòng ngủ và nhà chứa khắp Ý." 
 holy_order_order_of_whores: "Hội Babylon"
 holy_order_order_of_dominatrices: "Hội Dục Vọng"
 holy_order_studs_of_desire: "Cám Dỗ của Dục Vọng"
 
 viaofficii: "Via Officii"
 viaofficii_adj: "Bổn Phận"
 viaofficii_adherent: "Kẻ Đã Thề"
 viaofficii_adherent_plural: "Những Kẻ Đã Thề"
 viaofficii_desc: "Tôn giáo phi chính thống này được một Người Bảo Trợ đặt riêng.\n\nCòn được gọi là Con Đường Bổn Phận, con đường này được Senen Forsworn — Kẻ Canh Giữ Trắng — phát triển để thực thi nghiêm ngặt Sự Im Lặng của Máu. Họ hành động cực đoan để giữ vững sự toàn vẹn của Màn Che."
 tenet_carnal_desire_name: "Dục Vọng Xác Thịt"
 tenet_carnal_desire_desc: "Một giáo lý phi chính thống được một Người Bảo Trợ yêu cầu."
  
 shatteredspear: "Ngọn Giáo Gãy"
 shatteredspear_adj: "Ngọn Giáo Gãy"
 shatteredspear_adherent: "Người Sparta"
 shatteredspear_adherent_plural: "Những Người Sparta"
 shatteredspear_desc: "Những kẻ mang di sản của Artemis Orthia, đứa con đầu lòng và được yêu quý nhất trong số các childer của Ventrue và là Nữ Thần của Sparta cổ đại, người đã dẫn đầu tiên phong chống lại Brujah của Carthage và ngã xuống khi chiến đấu với bóng tối đã xiết chặt thành phố ấy trong nanh vuốt độc ác của nó.\nNgọn Giáo hoạt động trong bí mật, mỗi chiến binh đứng vững trước làn sóng của Gehenna và các thế lực quỷ dữ ẩn nấp bên ngoài xã hội Hậu Duệ Cain văn minh."
 
 pathofleviathan: "Con Đường Leviathan"
 pathofleviathan_adj: "Leviathan"
 pathofleviathan_adherent: "Leviathan"
 pathofleviathan_adherent_plural: "Các Leviathan"
 pathofleviathan_desc: "Tôn giáo phi chính thống này được một Người Bảo Trợ đặt riêng.\n\nBắt nguồn từ thuyết đồng nhất luận Trung Hoa cổ đại, tôn giáo này hướng đến việc xây dựng một tập thể kiểu Leviathan, tạo ra một khái niệm tập thể về thân thể học giả thông qua sự giáo hóa linh hoạt và luật lệ hà khắc, và cuối cùng tạo ra một ý chí tập thể thống nhất để tiến hóa về mặt tâm linh như một sinh vật đơn bào tiến hóa thành sinh vật đa bào."
 
