 #Scion-Group Faiths
 viaregalis: "Via Regalis"
 viaregalis_adj: "Regalis"
 viaregalis_adherent: "Đấng Sáng Soi"
 viaregalis_adherent_plural: "Các Đấng Sáng Soi"
 viaregalis_desc: "Tín đồ Via Regalis kiềm chế Dã Thú của mình bằng cách cai trị kẻ khác. Người phàm là hạ đẳng, lời hứa sẽ được giữ trọn, quyền lực là tất cả."

 viaequitum: "Via Equitum"
 viaequitum_adj: "Equitum"
 viaequitum_adherent: "Hiệp Sỹ Thánh"
 viaequitum_adherent_plural: "Các Hiệp Sỹ Thánh"
 viaequitum_desc: "Những kẻ theo Con Đường Hiệp Nghĩa tin rằng, với tư cách những sinh thể thượng đẳng, họ có bổn phận bảo vệ kẻ thấp kém hơn mình, cả $pod_cainite$ lẫn người phàm. Những Hậu Duệ này tin tưởng mạnh mẽ nhất vào các khái niệm bổn phận và danh dự."

 viamercator: "Via Mercator"
 viamercator_adj: "Mercator"
 viamercator_adherent: "Thương Nhân"
 viamercator_adherent_plural: "Các Thương Nhân"
 viamercator_desc: "Đối với những Hậu Duệ theo Con Đường Thương Nhân này, quyền lực và tiền bạc song hành; do đó, họ dành phần lớn thời gian để tích lũy của cải và dùng nó để âm thầm tác động mọi việc từ hậu trường. Tuy nhiên, họ cũng trân trọng danh tiếng của bản thân, và sẽ làm mọi cách để bảo đảm đó là một danh tiếng tốt đẹp."

 viatyrannus: "Via Tyrannus"
 viatyrannus_adj: "Tyrannus"
 viatyrannus_adherent: "Bạo Chúa"
 viatyrannus_adherent_plural: "Các Bạo Chúa"
 viatyrannus_desc: "Dù nhiều kẻ mang tiếng là hung tàn, thích kiểm soát và khát quyền lực, những Hậu Duệ theo Con Đường Bạo Chúa cũng thuộc hàng trọng danh dự nhất trong Via Regalis. Nếu một trong số họ mang nghĩa vụ với ngươi, nghĩa vụ đó sẽ được giữ trọn, bất kể cái giá phải trả. Tuy vậy, họ là những kẻ dễ cai trị bằng nỗi sợ hơn là bằng sự thu phục lòng người."

 viaconsuasor: "Via Consuasor"
 viaconsuasor_adj: "Consuasor"
 viaconsuasor_adherent: "Cố Vấn"
 viaconsuasor_adherent_plural: "Các Cố Vấn"
 viaconsuasor_desc: "Những Hậu Duệ theo Con Đường Cố Vấn này bằng lòng khuyên bảo hơn là trực tiếp cai trị, nhưng điều đó không khiến họ kém tài vận dụng quyền lực hơn những kẻ khác trên Con Đường Quân Vương. Thực tế, những Hậu Duệ này thuộc hàng giỏi nhất trong việc thao túng tinh vi và nhận ra những chi tiết có thể đe dọa đến quyền lực của kẻ cầm quyền."
 
 viamithras: "Via Mithras"
 viamithras_adj: "Giáo Phái Mithras"
 viamithras_adherent: "Tín Đồ Mithras"
 viamithras_adherent_plural: "Các Tín Đồ Mithras"
 viamithras_desc: "Tín Đồ Mithras đứng giữa lằn ranh của Via Regalis và một giáo phái đích thực. Dù quyền lực và danh dự vẫn được coi trọng, sự sùng kính dành cho một vị thần thực sự, Mithras, mới là tối thượng. Họ vẫn giữ vững một tổ chức có nguồn gốc từ thời hoàng kim của giáo phái này, tại La Mã Cổ Đại."

 viaentelechia: "Via Entelechia"
 viaentelechia_adj: "Entelechia"
 viaentelechia_adherent: "Kẻ Tận Hiến"
 viaentelechia_adherent_plural: "Những Kẻ Tận Hiến"
 viaentelechia_desc: "Những Kẻ Tận Hiến được định nghĩa bởi ba nền tảng của Entelechy: Andreia, sự nam tính; enkratia, nội lực; và sophrosyne, sự tự chủ nội tâm. Những ràng buộc của con người như lòng thương xót hay sự cảm thông (hay sự cân nhắc) đều thấp kém hơn họ. Khi một Kẻ Tận Hiến gặp một nhóm đồng tộc của mình, hắn sẽ nắm quyền lãnh đạo họ, chỉ ra sự thấp kém hiển nhiên của những kẻ đối lập với mình và không ngần ngại giết những ma cà rồng nào dám bất tuân mệnh lệnh của họ."		
 
 codexoflegacies: "Codex of Legacies"
 codexoflegacies_adj: "Codex Di Sản"
 codexoflegacies_adherent: "Kẻ Mộng Mơ"
 codexoflegacies_adherent_plural: "Những Kẻ Mộng Mơ"
 codexoflegacies_desc: "$pod_cainites$ ở Constantinople không tuân theo sáu Truyền Thống của Caine. Thay vào đó, Brujah Tribonius đã tạo ra Codex of Legacies, một tập hợp giáo điều nhằm củng cố quyền cai trị của Tam Vị Nhất Thể và ba clan cầm quyền: Toreador, Tzimisce và Ventrue. Một hội đồng ba Quaesitor — mỗi người từ một trong ba clan đó — giám sát bộ codex này và xét xử những kẻ vi phạm giáo điều của nó."
 
