 stygia_hostility_name: "Sự Thù Địch của Stygia"
 special_doctrine_is_legion_faith_name: "Quân Đoàn"
 special_doctrine_is_legion_faith_desc: "Đối với các oan hồn Stygia, Hierarchy chính là xã hội và tám Quân Đoàn chính là Hierarchy."
 doctrine_parameter_hostility_override_special_doctrine_is_legion_faith: "[faiths|E] Quân Đoàn được xem là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 special_doctrine_is_great_guild_faith_name: "Đại Hội"
 special_doctrine_is_great_guild_faith_desc: "Các hội này là thiết yếu để Stygia và xã hội oan hồn vận hành. Kết quả là chúng hoạt động công khai ít nhiều với tư cách tổ chức dựa trên Arcanos."
 doctrine_parameter_hostility_override_special_doctrine_is_great_guild_faith: "[faiths|E] Đại Hội được xem là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 special_doctrine_is_working_guild_faith_name: "Hội Lao Động"
 special_doctrine_is_working_guild_faith_desc: "Các hội trong hạng mục này được xem là "tầng lớp lao động"; nghĩa là, họ bao gồm những oan hồn kiếm sống qua ngày bằng Arcanos của mình."
 doctrine_parameter_hostility_override_special_doctrine_is_working_guild_faith: "[faiths|E] Hội Lao Động được xem là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 special_doctrine_is_criminal_guild_faith_name: "Hội Phạm Pháp"
 special_doctrine_is_criminal_guild_faith_desc: "Các hội này không chỉ phi pháp, mà còn vi phạm Dictum Mortuum hoặc nổi tiếng vì vi phạm nghiêm trọng luật lệ Stygia."
 doctrine_parameter_hostility_override_special_doctrine_is_criminal_guild_faith: "[faiths|E] Hội Phạm Pháp được xem là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 special_doctrine_is_forbidden_guild_faith_name: "Hội Cấm"
 special_doctrine_is_forbidden_guild_faith_desc: "Còn được gọi là Tiểu Hội vì không được mời ký Hiệp Ước các Hội, các nhóm này bị Hierarchy săn lùng và bị xã hội oan hồn khiếp sợ."
 doctrine_parameter_hostility_override_special_doctrine_is_forbidden_guild_faith: "[faiths|E] Hội Cấm được xem là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"

 tenet_eyes_of_gaia_name: "Mắt của Gaia"
 tenet_eyes_of_gaia_desc: "Thay vì được giao một mục đích cụ thể, mỗi bộ tộc Bastet cố gắng lấp đầy một khoảng trống mà những kẻ khác chưa để ý tới. Garou (và một số kẻ khác) gọi họ là Mắt của Gaia vì lòng say mê tri thức bí mật của họ."
 doctrine_parameter_access_rush_schemes: "Bạn được tiếp cận quyết định phụ Rush Schemes."
 tenet_kind_warriors_name: "Chiến Binh Nhân Hậu"
 tenet_kind_warriors_desc: "Gurahl là những kẻ bảo vệ và chữa lành giữa các Changing Breed và là những người bảo hộ nguyên thủy của Gaia. Tuy nổi tiếng là hiền lành và chậm nổi giận, ngay cả cái chết cũng không thể ngăn họ hoàn thành bổn phận của mình."
 doctrine_parameter_raiding_forbidden: "Không thể [raid|E]"

 tenet_amakusa_rite_name: "Nghi Lễ Amakusa"
 tenet_amakusa_rite_desc: "Qua việc pha trộn $pod_vitae$ trong một chiếc bát chung và được củng cố bằng những nghi lễ và sự tôn kính đúng đắn, những liều thuốc đập tan áp bức và san bằng tất cả dưới màn đêm có thể giải phóng Blood Tribe, để cuộc cách mạng vĩnh cửu của họ có thể tiếp tục được tiến hành mà không sợ Bloodbond hay thiếu phương tiện để làm vậy."

 tenet_cruelty_of_stars_name: "Sự Tàn Nhẫn của Các Vì Sao"
 tenet_cruelty_of_stars_desc: "Đằng sau mỗi gia sản kếch xù là một tội ác còn lớn hơn. Người phàm là thịt, và ác quỷ máu là kẻ tiêu thụ. Giác Ngộ là trò chơi của kẻ nghèo hèn. Hãy thúc ép họ, đè bẹp họ, cướp bóc họ, và ép họ phải kiếm lại những gì đã mất trong khi khiến họ tin rằng đó là một món hời. Cứ để họ gọi ngươi là Kẻ Theo Quỷ. Ngươi còn tiền phải kiếm."

 tenet_physical_ascension_name: "Sự Thăng Hoa của Xác Thịt"
 tenet_physical_ascension_desc: "Mục tiêu của mọi Seeker là thăng hoa xác phàm của mình lên một trạng thái được gọi là [GetTrait('azhi_dahaka').GetName(GetPlayer)]. Một trạng thái mà nơi đó họ hoàn toàn tách biệt bản thân khỏi Sáng Thế, để trở thành một ý chí tự tại trong một vũ trụ không còn quyền năng nào chi phối được bản ngã."
 doctrine_parameter_azhi_dahaka_journey_bonus: "Tăng [planning_speed|E] của [journey|E] #bold Tìm Kiếm Azhi Dahaka#! thêm #P +25%#!"

 tenet_burn_the_inferno_name: "Thiêu Rụi Địa Ngục"
 tenet_burn_the_inferno_desc: "Vũ khí của [akuma|E] sẽ bị quay ngược lại chống chính chúng. Không hy sinh nào là quá lớn, không phản bội nào là quá nhỏ."
 doctrine_parameter_recruit_deviltiger_banes: "Có thể chiêu mộ [GetMaA('rat_headed_dragonfly_demon').GetName], [GetMaA('sleeper_seducing_bane').GetName], và [GetMaA('face_robe_demon').GetName] làm [men_at_arms|E]"


 land_of_faith_controlled_name: "Đất Đức Tin"
 special_doctrine_land_of_faith_controlled_name: "Đất Đức Tin"
 special_doctrine_land_of_faith_controlled_desc: "Đất Đức Tin đang nằm dưới quyền kiểm soát của chúng ta, và chúng ta được hưởng lợi lớn từ Sekhem mà nó ban tặng."

 unproven_dharma_name: "[Glossary('Dharma','podgloss.dharma')] Chưa Được Chứng Thực"
 special_doctrine_unproven_dharma_name: "[Glossary('Dharma','podgloss.dharma')] Chưa Được Chứng Thực"
 special_doctrine_unproven_dharma_desc: "Không phải mọi [Glossary('Dharma','podgloss.dharma')] đều đã chứng minh là con đường dẫn đến [Glossary('Hundred Clouds','podgloss.hundredclouds')]. Đối với những kẻ chưa từng có ghi chép về sự thăng hoa, nỗi sợ rơi vào ngõ cụt luôn là một mối lo."
 doctrine_parameter_unproven_dharma_parameter: ""
 
 tenet_obeisance_to_devils_name: "Khuất Phục Trước Quỷ Dữ"
 tenet_obeisance_to_devils_desc: "Chúng ta tồn tại bên dưới các Tiểu Thần. Chúng ta phải nằm ngoài tầm chú ý, vượt ngoài sự soi xét, kẻo tự chuốc lấy diệt vong."
 doctrine_parameter_hostility_override_tenet_obeisance_to_devils: "[faiths|E] có [doctrine|E] [GetFaithDoctrine('tenet_obeisance_to_devils').GetBaseName] được coi là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] thay vì #V Thù địch#!" 


 tenet_fera_innovative_name: "Đổi Mới"
 tenet_fera_innovative_desc: "Tiến bộ công nghệ là lợi thế quan trọng nhất mà bất kỳ ai có thể sở hữu. Trong khi phần lớn Garou hoài nghi với sự đổi mới, một số tín đồ của $glossary_weaver$ công khai thúc đẩy đổi mới không chỉ vì lợi ích của riêng họ mà còn của toàn nhân loại."

 tenet_one_blade_name: "Hợp Nhất Với Lưỡi Kiếm"
 tenet_one_blade_desc: "Hakken là những chiến binh và người bảo vệ hàng đầu của Hengeyokai. Vì lẽ đó, nhiều người trong số họ dành cả đời để tinh thông kiếm thuật."
 doctrine_parameter_katana_crafting: "Kiếm [crafting_forged|E] sẽ luôn là Katana"
 doctrine_parameter_no_sword_fetish_upkeep: "[fetishes|E] Kiếm và Katana không yêu cầu Chi phí Duy trì $POD_energy_gnosis$"
 doctrine_parameter_pack_training_blademaster: "Rèn luyện [prowess|E] cùng [GetPlayer.Custom('PODCoterie')] của bạn mang lại [trait_level_track_xp|E] cho [GetTrait('lifestyle_blademaster').GetName(GetPlayer)]"

 tenet_wolves_of_sable_name: "Sói Của Sable"
 tenet_wolves_of_sable_desc: "Sable là kẻ săn mồi vô hình trong lớp tuyết trôi dạt; lặng lẽ ấp ủ, kiên nhẫn chờ đợi, ra tay không báo trước rồi lại biến mất vào băng, tuyết, và gió, chỉ để lại một hai giọt máu làm bằng chứng rằng nàng từng có mặt ở đó. Nàng là kẻ sống sót nhỏ bé, được tôi luyện bởi môi trường xung quanh và rèn giũa bởi sự cô độc của mình. Nàng đại diện cho nữ thợ săn bất ngờ và sự sinh tồn của kẻ mạnh nhất trước những nghịch cảnh khắc nghiệt nhất. Con cái của Sable được các linh hồn gió xem như đồng minh và có thể gọi cũng như trò chuyện với chúng tự do. Sable dựa vào con cái mình để bảo vệ vùng đất Siberia của nàng. Falcon xem mọi Con cái của Sable là những kẻ lai tạp ô danh, mất thể diện, và trong mọi hoàn cảnh, Falcon sẽ không dung thứ cho tư cách thành viên của một Siberakh trong bầy mà hắn đã chọn làm của riêng mình." 

 tenet_soldiers_of_the_wyrm_name: "Chiến Binh Của Wyrm"
 tenet_soldiers_of_the_wyrm_desc: "Chúng ta là chiến binh của $glossary_wyrm$, không phải của những kẻ tôi tớ thấp kém của nó. Vinh quang của chúng ta sẽ được nhìn thấy, đức tin của chúng ta sẽ được đền đáp."
 doctrine_parameter_reduced_urgetaints_xp: "Giảm [lifestyle_experience|E] [urgetaints_lifestyle|E] nhận được: #N -25%#!"

 tenet_secrets_of_flesh_name: "Bí Mật Của Xác Thịt"
 tenet_secrets_of_flesh_desc: "Nhiều trí tuệ ngủ yên trong xác thịt. Litany sẽ không còn từ chối chúng ta nữa."
 doctrine_parameter_wyrm_education_lifestyle_xp_from_cannibalism: "Nhận [lifestyle_experience|E] tương ứng với [education|E] của bạn khi nuốt chửng nhân vật khác, tỷ lệ theo tuổi của nạn nhân"
 doctrine_parameter_infamy_renown_from_cannibalism: "Nhận $POD_fera_renown_infamy$ Danh Vọng $glossary_fera$ khi nuốt chửng nhân vật trên 200 tuổi"

 tenet_centipede_embrace_name: "Vòng Ôm Của Rết"
 tenet_centipede_embrace_desc: "[Glossary('Rết', 'glossary_wyrm_tt')] sẽ lớn lên bất tận, ăn mòn chính mảnh đất này."
 doctrine_parameter_ignore_dragon_nest_requirements: "Bỏ qua mọi yêu cầu [development|E] trong [duchy_buildings|E] Tổ Rồng"

 tenet_wyrm_seekers_name: "Kẻ Tìm Kiếm Wyrm"
 tenet_wyrm_seekers_desc: "$glossary_wyrm$ nắm giữ nhiều tri thức và quyền năng, người ta chỉ cần tìm kiếm nó."
 doctrine_parameter_increased_urgetaints_xp: "Tăng [lifestyle_experience|E] [urgetaints_lifestyle|E] nhận được: #P +25%#!"

 tenet_channel_darkness_name: "Truyền Dẫn Bóng Tối"
 tenet_channel_darkness_desc: "Chúng ta là một với bóng tối, chỉ là những bóng ma trong đêm. Chúng ta di chuyển không ai thấy được cho đến khi bóng tối của chúng ta giáng xuống những kẻ ngu ngốc cản đường."
 doctrine_parameter_unlock_shadow_shapeshift: "Mở khóa hình dạng biến hình [GetModifier('POD_shapeshift_form_shadow_modifier').GetNameWithTooltip]"

 tenet_hypnotic_serpent_name: "Sự Mê Hoặc Của Rắn Thôi Miên"
 tenet_hypnotic_serpent_desc: "[Glossary('Cahlash', 'glossary_wyrm_tt')] gọi tên chúng ta và chúng ta sẽ đáp lời. Rồi đây, những kẻ khác cũng sẽ học được điều đó."
 doctrine_parameter_learn_secrets_from_seduction: "[schemes|E] [GetScheme('seduce').GetTypeName] thành công sẽ tiết lộ mọi [secrets|E] mà mục tiêu biết, kể cả bí mật của chính họ."


 tenet_vengence_sobek_name: "Báo Thù Cho Sobek"
 tenet_vengence_sobek_desc: "Đất đai sẽ được thanh tẩy. Sông ngòi sẽ tuôn chảy. Gió sẽ thổi qua. Đền đài sẽ được thánh hóa. Mặt trời sẽ rực cháy. Loài rắn sẽ bị thiêu đốt."

 tenet_flames_agni_name: "Ngọn Lửa Của Agni"
 tenet_flames_agni_desc: "Trong khi mọi Mokolé tôn kính Dragon, các tín đồ của Trật Tự Vũ Trụ gọi ngài là Agni, Thần Lửa, Người Chuyển Giao Lễ Vật, và Người Phát Ngôn của Wani. Agni vừa mạnh mẽ vừa thông thái, ngọn lửa của ngài che chở tín đồ và thiêu đốt kẻ thù.\nMột ngọn lửa vĩnh cửu cháy âm ỉ trong mỗi đứa con được chọn của ngài, chúng chỉ cần thắp nó lên."
 doctrine_parameter_unlock_agni_totem: "Có thể chọn [GetModifier('agni_totem_modifier').GetNameWithTooltip] thay vì [GetModifier('dragon_totem_modifier').GetNameWithTooltip] làm Vật Tổ của [GetPlayer.Custom('PODCoterie')]."
 doctrine_parameter_gain_fire_immunity: "Nhận miễn nhiễm với sát thương lửa."

 tenet_lords_rivers_name: "Chúa Tể Của Sông Ngòi"
 tenet_lords_rivers_desc: "Nhiều Zhong Lung chọn sống dọc theo những dòng sông lớn của Zhong Guo. Dòng Nước nắm giữ quyền năng đáng sợ đối với sông ngòi, một Mokolé trẻ tuổi thường phải vật lộn để kiểm soát một dòng suối nhỏ, trong khi một Dragon có thể di chuyển cả một dòng sông.\nCác Dragon tự kiềm chế rất nhiều khi thi triển những quyền năng này, nếu không hậu quả sẽ tàn khốc cho vùng đất."
 doctrine_parameter_gnosis_from_river_provinces: "[counties|E] ven sông sở hữu của đức tin này cho Hồi phục $POD_energy_gnosis$: #P 2.5%#!."
 doctrine_parameter_reduces_flood_weather_cost: "Giảm chi phí của Phép Thuật Thời Tiết #V Lũ Lụt#!."

 tenet_dragon_princes_name: "Chúa Tể Rồng"
 tenet_dragon_princes_desc: "Wani là các Chúa Tể Rồng của Zhong Guo, cai quản mây trời cùng sự lên xuống của nước, và giám sát các hoàng tộc của loài người. Zhong Lung, với hình dạng rồng Archid của mình, là con cái của Wani. Sự thật này đôi khi bị các chủng tộc khác tranh cãi, cho đến khi một tia sét khiến họ phải suy nghĩ lại."
 doctrine_parameter_can_learn_galliard_gifts: "Có thể học các Ân Tứ [GetTrait('galliard').GetName( GetPlayer )] từ [lifestyle|E] [lunar_auspicegifts_lifestyle|E]."

 tenet_outlast_world_name: "Trường Tồn Hơn Thế Gian"
 tenet_outlast_world_desc: "Chúng ta không cần ai khác ngoài chính mình. Da chúng ta dày, tinh thần chúng ta vững vàng. Thế gian có thể sụp đổ, nhưng chúng ta vẫn sẽ đứng vững."

 tenet_pilgrims_waves_name: "Kẻ Hành Hương Của Sóng Nước"
 tenet_pilgrims_waves_desc: "Biển cả chứa đựng nhiều hiểm nguy và trí tuệ, chỉ bằng cách vượt qua chúng, chúng ta mới có thể tôi luyện tinh thần mình. Nghịch cảnh có thể nuôi dưỡng hy vọng, và sự kiên cường."
 doctrine_parameter_dreaming_sands_pilgrimage: "Hoàn thành [pilgrimages|E] mang lại [lifestyle_experience|E] Lữ Khách và Danh Vọng $POD_fera_renown_wisdom$ $glossary_fera$"
 doctrine_parameter_faith_can_raid_oversea: "Cho phép [raiding|E] vượt biển"


 tenet_gaia_memory_name: "Ký Ức Của Gaia"
 tenet_gaia_memory_desc: "Trọng trách của chúng ta luôn là trở thành Ký Ức Của Gaia. Bổn phận của chúng ta là dẫn dắt các Chủng Biến Hình khác và dạy cho họ lịch sử lâu đời của $glossary_fera$ cùng những nhiệm vụ mà Gaia đã đặt ra cho chúng ta."
 doctrine_parameter_pack_training_coterie_xp: "Huấn luyện cùng [GetPlayer.Custom('PODCoterie')] của bạn mang lại Danh Vọng $POD_fera_renown_wisdom$ $glossary_fera$ cho mọi thành viên"


 tenet_sun_blessed_name: "Được Mặt Trời Ban Phước"
 tenet_sun_blessed_desc: "Celestine Helios đã ban ân sủng của mình chỉ cho hai trong số $glossary_fera$, [GetTrait('mokole').GetName(GetNullCharacter)] và [GetTrait('corax').GetName(GetNullCharacter)].\nHơi ấm của mặt trời tiếp thêm sinh lực cho thân thể và xoa dịu tâm hồn. Mặt trời là một thiên thể kỳ diệu, tựa như một người cha vĩ đại."

 tenet_eastern_mokole_name: "Mokolé Phương Đông"
 tenet_eastern_mokole_desc: "Mokolé của châu Á đã học cách thích nghi với vô số tín ngưỡng phàm nhân và siêu nhiên thấm đẫm khắp vùng đất này. Dù họ vẫn tin đức tin của riêng mình vượt trội hơn hẳn, họ vẫn sẵn lòng cân nhắc tín ngưỡng của các chủng tộc trẻ hơn."

 tenet_twisted_memories_name: "Ký Ức Bị Bóp Méo"
 tenet_twisted_memories_desc: "Ký ức là những thứ dễ uốn nắn, dễ thay đổi, dễ bị bóp méo."
 doctrine_parameter_remove_relation_torture: "Xóa bỏ một [relation|E] ngẫu nhiên khỏi nạn nhân của bạn trong khi [torture|E]"
 doctrine_parameter_mokole_wyrm_taint_torture: "Tăng mạnh [wyrm_taint|E] gây ra cho [GetTrait('mokole').GetName(GetNullCharacter)] trong khi [torture|E]"


 doctrine_fera_wyrm_taint_visible_name: ""
 fera_wyrm_taint_visible_doctrine_name: ""
 fera_wyrm_taint_visible_doctrine_desc: ""
 doctrine_parameter_can_see_wyrm_taint: ""

 doctrine_parameter_wyrm_possession_power_faith_bonus_t1: "Thêm điểm [perk|E] [possessedpower_lifestyle|E] khi bị [possessed|E]: #P +2#!"
 doctrine_parameter_wyrm_possession_power_faith_bonus_t2: "Thêm điểm [perk|E] [possessedpower_lifestyle|E] khi bị [possessed|E]: #P +4#!"

 doctrine_fera_triat_alignment_group_name: "Lập Trường Với Tam Vị"
 
 doctrine_fera_triat_alignment_balanced_name: "Cân Bằng"
 doctrine_fera_triat_alignment_balanced_desc: "Dù $glossary_triat$ không còn cân bằng nữa, nhiều $glossary_fera$ vẫn tin vào trật tự cũ."
 doctrine_parameter_hostility_override_doctrine_fera_triat_alignment_balanced: "[faiths|E] có [GetFaithDoctrine('doctrine_fera_triat_alignment_balanced').GetBaseName] được coi là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"

 doctrine_fera_triat_alignment_wyld_name: "Wyld"
 doctrine_fera_triat_alignment_wyld_desc: "Do mối đe dọa từ cả $glossary_weaver$ lẫn $glossary_wyrm$, hầu hết $glossary_fera$ tôn kính $glossary_wyld$ hơn các thành viên khác của $glossary_triat$, xem nó cùng Gaia là những thứ cần được bảo vệ."

 doctrine_fera_triat_alignment_weaver_name: "Weaver"
 doctrine_fera_triat_alignment_weaver_desc: "Sự phát triển của $glossary_weaver$ sẽ không bao giờ dừng lại chừng nào nhân loại còn tồn tại."
 doctrine_parameter_ignore_fera_dev_requirements: "Bỏ qua các yêu cầu [development|E] thấp cho công trình $glossary_fera$"
 doctrine_parameter_no_fera_dev_reduction: "Công trình $glossary_fera$ tại các tỉnh theo [faith|E] này không làm giảm [development|E]"

 doctrine_fera_triat_alignment_wyrm_name: "Wyrm"
 doctrine_fera_triat_alignment_wyrm_desc: "Giống như bậc chủ nhân sa ngã của chúng, các tôi tớ của $glossary_wyrm$ chỉ tìm kiếm hỗn loạn và hủy diệt." 
 doctrine_parameter_hostility_override_doctrine_fera_triat_alignment_wyrm: "[faiths|E] có [GetFaithDoctrine('doctrine_fera_triat_alignment_wyrm').GetBaseName] được coi là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_can_recruit_wyrm_maa: "Có thể chiêu mộ [GetMaA('scrags').GetName] và [GetMaA('skull_pigs').GetName] làm [men_at_arms|E]"

 doctrine_fera_triat_alignment_triatic_wyrm_name: "Wyrm Tam Vị"
 doctrine_fera_triat_alignment_triatic_wyrm_desc: "$glossary_wyrm_triatic$ là một sự nhạo báng $glossary_triat$ nguyên bản. Ba cái đầu của Wyrm ban sức mạnh tà ác vô song cho những tôi tớ thân cận nhất của chúng."
 doctrine_parameter_hostility_override_doctrine_fera_triat_alignment_triatic_wyrm: "[faiths|E] có [GetFaithDoctrine('doctrine_fera_triat_alignment_triatic_wyrm').GetBaseName] được coi là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"


 doctrine_fera_triat_alignment_gaia_name: "Gaia"
 doctrine_fera_triat_alignment_gaia_desc: "Gaia là một trong những linh hồn quyền năng nhất được biết đến - có lẽ là linh hồn đầu tiên, và quyền năng nhất. Bà được cho là đã tạo ra Garou và phần lớn Fera để làm chiến binh và tay sai của mình cả trong thế giới vật chất lẫn thế giới linh hồn. Bà là Mẹ Thiên Nhiên, nuôi dưỡng và tràn đầy sức sống nhưng cũng tàn bạo và lãnh đạm khi bị chọc giận."
 doctrine_parameter_hostility_override_doctrine_fera_triat_alignment_gaia: "[faiths|E] có [GetFaithDoctrine('doctrine_fera_triat_alignment_gaia').GetBaseName] được coi là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"


 doctrine_fera_litany_group_name: "Luật Lệ Fera"

 doctrine_fera_werewolf_litany_name: "Litany"
 doctrine_fera_werewolf_litany_desc: "Luật lệ của Người xưa vốn cổ xưa. Truyền thống của họ khác nhau tùy bộ tộc, nhưng mọi Garou đều phải ghi nhớ và tuân theo bộ luật trung tâm gọi là Litany. Ở dạng đầy đủ, nó vừa là một sử thi vừa là một bộ luật. Dù cần đến những học giả vĩ đại nhất mới có thể tinh thông toàn bộ Litany, phần lớn người sói học nó dưới dạng những giáo điều cơ bản. Mỗi giáo điều đều có nền tảng thực tiễn, nhưng không phải tất cả đều được xem là đạo đức không thể chối cãi một cách phổ quát."
 doctrine_parameter_hostility_override_doctrine_fera_werewolf_litany: "[faiths|E] có [GetFaithDoctrine('doctrine_fera_werewolf_litany').GetBaseName] được coi là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"

 doctrine_fera_werewolf_dark_litany_name: "Dark Litany"
 doctrine_fera_werewolf_dark_litany_desc: "Dark Litany là Litany của $glossary_wyrm$, được các Black Spiral Dancers tuân theo. Phụng sự Ý Chí của Wyrm. Tôn trọng Sức Mạnh của Kẻ Hùng Mạnh. Mọi thứ không bị Cấm đều được Phép. Buông thả theo Ham Muốn của ngươi. Bất chấp ấn tượng về Black Spirals như một bộ tộc hỗn loạn vô luật, Litany của họ thường được tuân thủ nghiêm ngặt hơn cả Litany của các Quốc gia Garou."
 doctrine_parameter_hostility_override_doctrine_fera_werewolf_dark_litany: "[faiths|E] có [GetFaithDoctrine('doctrine_fera_werewolf_dark_litany').GetBaseName] được coi là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]" 

 doctrine_fera_bastet_karoush_name: "Karoush"
 doctrine_fera_bastet_karoush_desc: "Karoush là bộ luật của người mèo, tương tự Litany của Garou. Được truyền lại từ tổ tiên họ, những luật lệ này lớn hơn bất kỳ Bastet nào và cao hơn bất kỳ cấp bậc hay danh hiệu nào. Đây là những quy tắc danh dự của họ, và người Bastet tin rằng chúng tách biệt họ khỏi nhân loại, bảo vệ họ khỏi những sai lầm của con người. Karoush là bộ luật do tổ tiên họ tạo ra, Luật của Mặt Trăng và Mặt Trời, Luật của Sự Định Hình Bí Mật và Luật của Sự Biến Đổi: Tôn Trọng Bản Thân, Tôn Trọng Lời Nói Của Ngươi, Tôn Trọng Thân Tộc Và Đồng Loại Của Ngươi, Tôn Trọng Đất Đai Của Ngươi và Tôn Trọng Sự Im Lặng Của Ngươi."
 doctrine_parameter_hostility_override_doctrine_fera_bastet_karoush: "[faiths|E] có [GetFaithDoctrine('doctrine_fera_bastet_karoush').GetBaseName] được coi là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"

 doctrine_fera_mokole_duties_name: "Các Bổn Phận"
 doctrine_fera_mokole_duties_desc: "Helios đã ban cho Con cái của mình một loạt các mệnh lệnh đạo đức và cá nhân để họ sống theo. Được gọi là Các Bổn Phận, đây là tiền thân của Litany Garou nơi Mokolé. Mỗi Bổn Phận gắn liền với một thánh triều mặt trời, dù mọi Mokolé đều bị ràng buộc bởi chúng. Vi phạm Các Bổn Phận sẽ phải chịu khiển trách, mất địa vị, và các hình phạt khác. Những kẻ phạm tội nghiêm trọng sẽ bị ăn thịt. Noonday Suns thực thi luật lệ, dù ngay cả Midnight Suns cũng sẽ khiển trách một Mokolé thiếu bổn phận. "
 doctrine_parameter_hostility_override_doctrine_fera_mokole_duties: "[faiths|E] có [GetFaithDoctrine('doctrine_fera_mokole_duties').GetBaseName] được coi là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"


 doctrine_fera_fallen_tribe_name: "Bộ Tộc Sa Ngã"
 doctrine_fera_fallen_tribe_desc: "Một số bộ tộc Fera đã sa ngã khỏi mục đích nguyên bản của mình. Điều này có thể do nhiều lý do, từ những tranh cãi về ý thức hệ cho đến những vết nhơ tâm linh, nhưng kết quả đều như nhau. Bị cô lập (trong trường hợp tốt nhất) hoặc bị săn lùng (trong trường hợp tệ nhất) bởi bộ tộc gốc của mình, những kẻ sa ngã này ẩn nấp trong bóng tối, sợ hãi những kẻ từng được xem là đồng loại của họ."
 doctrine_parameter_hostility_override_doctrine_fera_fallen_tribe: "[faiths|E] có [GetFaithDoctrine('doctrine_fera_fallen_tribe').GetBaseName] được coi là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"




 doctrine_fera_pact_group_name: "Hiệp Ước Fera"

 doctrine_fera_werewolf_pact_name: "Hiệp Ước Garou"
 doctrine_fera_werewolf_pact_desc: "Vì lý do này hay lý do khác, tín đồ của đức tin này đã tạo dựng mối liên kết chặt chẽ với #TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L Garou#!. Những bộ tộc man rợ và tàn bạo này không dễ kết bạn nhưng lại xem trọng lời thề của mình khi đã kết giao."
