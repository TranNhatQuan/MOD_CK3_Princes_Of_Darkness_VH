 doctrine_lycanthropy_name: "Lycanthropy"
 doctrine_lycanthropy_crime_name: "Tội Phạm"
 doctrine_lycanthropy_crime_desc: "Người sói phải bị tiêu diệt.\n\nCủa Những Ác Thú Mặt Trăng\n\nNhững Ác Thú Mặt Trăng, những kẻ-biến-hình, chúng là Cổ Xưa nhất trong tất cả, trước cả cha ta chúng đã lang thang khắp đất đai. Chớ nán lại trên đường đi của chúng, hãy tránh xa chúng, chúng nhắm vào chúng ta như sói giữa bầy cừu. Vì chúng ta thuộc về một loài, còn chúng thuộc loài khác. Hãy cẩn trọng với đất thiêng của chúng, hãy bước nhẹ qua vùng hoang dã của chúng. Răng nanh của chúng cũng như răng nanh của ta, móng vuốt của chúng cũng như móng vuốt của ta, chớ nán lại trên đường đi của chúng, chúng thuộc về một loài, còn ta thuộc loài khác."
 doctrine_lycanthropy_shunned_name: "Bị Xa Lánh"
 doctrine_lycanthropy_shunned_desc: "Dù siêu nhiên như chúng ta, người sói không giống chúng ta. Không hề giống chút nào.\n\nCủa Những Ác Thú Mặt Trăng\n\nNhững Ác Thú Mặt Trăng, những kẻ-biến-hình, chúng là Cổ Xưa nhất trong tất cả, trước cả cha ta chúng đã lang thang khắp đất đai. Chớ nán lại trên đường đi của chúng, hãy tránh xa chúng, chúng nhắm vào chúng ta như sói giữa bầy cừu. Vì chúng ta thuộc về một loài, còn chúng thuộc loài khác. Hãy cẩn trọng với đất thiêng của chúng, hãy bước nhẹ qua vùng hoang dã của chúng. Răng nanh của chúng cũng như răng nanh của ta, móng vuốt của chúng cũng như móng vuốt của ta, chớ nán lại trên đường đi của chúng, chúng thuộc về một loài, còn ta thuộc loài khác."
