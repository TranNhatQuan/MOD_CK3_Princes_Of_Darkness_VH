 doctrine_vampirediablerie_name: "$pod_diablerie$"
 doctrine_vampirediablerie_crime_name: "Tội Phạm"
 doctrine_vampirediablerie_crime_desc: "Nuốt trọn linh hồn của một Kindred khác là tội ác tồi tệ nhất trong số các loài của chúng ta.\n\nMột Lời Từ Biệt, Cấm Đoán $pod_diablerie$\n\nChớ tìm máu của chính Bậc Trưởng Lão của ngươi, chớ tìm máu của [Glossary('Sire','game_concept_Sire_desc')] của [Glossary('Sire','game_concept_Sire_desc')] ngươi, chớ tìm máu của kẻ đã tạo ra ngươi làm Thân Tộc, vì ngươi sẽ cảm nhận giàn hỏa thiêu, khi ngươi phải trả giá cho tội lỗi bất tử của mình."
