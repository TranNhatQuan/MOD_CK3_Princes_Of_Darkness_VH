 doctrine_fae_morality_name: "Đạo Đức Fae"
 doctrine_fae_morality_seelie_name: "Seelie"
 doctrine_fae_morality_unseelie_name: "Unseelie"
 doctrine_fae_morality_seelie_desc: "Tuy thường bị người ngoài và cả những kithain non kinh nghiệm gán cho là triều đình 'thiện', Triều đình Seelie thực ra được định nghĩa bởi các đức tính danh dự và tình yêu. Dù điều này có vẻ khớp với quan niệm về 'cái thiện', tinh thần hiệp sĩ trượng nghĩa đôi khi xung khắc với đạo đức của thế giới hiện đại, và ý niệm tình yêu cung đình của fae đôi lúc cách xa thực tế mà người phàm phải đối mặt. Theo nhiều cách, Luật Seelie bắt rễ từ những truyền thống võ hiệp.\n\nTrước [Glossary('Shattering','game_concept_shattering_desc')], các Triều đình Seelie cai trị từ Beltaine đến Samhain, xuyên suốt Mùa Xuân và Mùa Hạ. Luật Seelie là: thà chết chứ không chịu nhục, tình yêu chinh phục tất cả, cái đẹp là sự sống và không bao giờ quên một món nợ"
 doctrine_fae_morality_unseelie_desc: "Nhiều fae Seelie xem Triều đình Unseelie như một thứ gì đó tà ác, nhưng cách mô tả này quá đơn giản. Unseelie ôm lấy sự đổi thay và khinh miệt truyền thống, không thấy có mối ràng buộc đặc biệt nào với quá khứ của mình, hay thậm chí với [UmbraGlossary('dreaming')], thứ dường như ngày càng trở nên xa vời. Lối sống Unseelie đầy đam mê và thực dụng, thỏa mãn cả dục vọng lẫn nhu cầu như nhau; Unseelie không tự chối bỏ bản thân bất cứ điều gì.\n\nTrước [Glossary('Shattering','game_concept_shattering_desc')], các Triều đình Unseelie cai trị từ Samhain đến Beltaine, xuyên suốt Mùa Thu và Mùa Đông. Luật Unseelie là: Đổi thay là tốt, glamour là tự do, danh dự là dối trá và đam mê đặt trước bổn phận."
