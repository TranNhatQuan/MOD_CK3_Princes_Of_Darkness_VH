 doctrine_nomarriage_desc: "Tôn giáo này không có hôn nhân."

 doctrine_onlyconcubines_name: "Chỉ Có Thê Thiếp"
 doctrine_onlyconcubines_desc: "Tôn giáo này chỉ cho phép thê thiếp, không có phối ngẫu."

 tenet_apotheosis_name: "Thần Cách Hóa"
 tenet_apotheosis_desc: ""

 tenet_bloodcommunion_name: "Hiệp Thông Máu"
 tenet_bloodcommunion_desc: "Hiệp Thông Máu của tín đồ Thần Cách Hóa là một phiên bản tà ác của nghi lễ hiệp thông người phàm. Trong tôn giáo này, nó phục vụ nhiều chức năng tương tự. Máu, tất nhiên, không mang tính biểu tượng — nó đến từ một cuộc hiến tế người."

 tenet_exaltedideals_name: "Lý Tưởng Siêu Việt"
 tenet_exaltedideals_desc: "Sự hoàn hảo về trí tuệ, thể chất và vẻ đẹp là lý tưởng, còn những gì trái ngược là tội lỗi. Sự hoàn hảo không chỉ là một trạng thái tinh thần, mà còn là lý do để phát động chiến tranh chống lại kẻ hạ đẳng."

 tenet_willing_embrace_name: "Trao Truyền Tự Nguyện"
 tenet_willing_embrace_desc: "Đẩy một linh hồn khác vào cảnh đọa đày vĩnh viễn không phải là chuyện nhỏ. Ứng viên $pod_Embrace$ tiềm năng phải hiểu rõ hoàn toàn điều mình đang chấp nhận."
 doctrine_parameter_willing_embrace: "Trước khi $pod_Embrace$ bất kỳ ai, ngươi sẽ phải thuyết phục nạn nhân chấp nhận trở thành ma cà rồng."
 doctrine_parameter_ashirra_second_embrace: "Mở khóa một sự kiện giáo dục childe đặc biệt"
 doctrine_parameter_cannot_embrace_prisoners: "Không thể $pod_Embrace$ [prisoners|E]"
 doctrine_parameter_willing_embrace_restrictions: "Không thể $pod_Embrace$ #TOOLTIP:GAME_TRAIT,supehunter,[GetNullCharacter] #L Thợ Săn#!, #TOOLTIP:GAME_TRAIT,ghoul,[GetNullCharacter] #L Bộc Huyết#!, hoặc #TOOLTIP:GAME_TRAIT,changeling,[GetNullCharacter] #L Changeling#!"

 tenet_mercy_for_vanquished_name: "Khoan Dung với Kẻ Bại Trận"
 tenet_mercy_for_vanquished_desc: "Một khi kẻ thù đầu hàng, hắn phải được đối xử với phẩm giá và sự tôn trọng xứng với địa vị của mình. Nếu tù binh hay gia đình họ không thể trả tiền chuộc, họ phải được thả ra vì lòng thương xót.\n\nMột kẻ địch trên chiến trường sinh ra là để bị giết, nhưng một kẻ địch đã bại trận phải được đối xử với đầy đủ sự lịch thiệp, với hy vọng rằng một ngày nào đó hắn có thể tìm được đường vào hàng ngũ những kẻ trung thành.\n\nChẳng có ích gì khi mãi nghĩ về những gì có thể đã xảy ra hay dằn vặt về những việc đã qua. Chiến binh chỉ hướng về trận chiến tiếp theo, và hy vọng mình sẽ hoàn thành nhiệm vụ một cách xứng đáng."
 doctrine_parameter_frequent_kingdom_holy_wars: "[holy_wars|E] chống lại các Vương Quốc có thể được tuyên bố mỗi 25 năm thay vì 50"
 doctrine_parameter_house_arrest_only: "[prisoners|E] chỉ có thể bị đưa vào [house_arrest|E]"
 house_arrest_only_tooltip: "Tôn giáo chỉ cho phép [house_arrest|E]"
 doctrine_parameter_piety_from_releasing: "Nhận [piety|El] khi thả các nhân vật $hostility_hostile_tooltippable$ hoặc $hostility_evil_tooltippable$ mà không có yêu sách nào"
 doctrine_parameter_prisoner_conversion_higher_chance: "Tù nhân có nhiều khả năng chấp nhận cải đạo hơn để đổi lấy tự do"
 prisoner_conversion_higher_chance_tooltip: "Giáo lý tôn giáo của ngươi: $VALUE|=+0$"
 doctrine_parameter_executing_hostile_evil_vampires_costs_piety: "Xử tử nhân vật mang đặc điểm [GetTrait('vampire').GetName(GetPlayer)] thuộc tôn giáo $hostility_hostile_tooltippable$ hoặc $hostility_evil_tooltippable$ tốn [piety|El]"

 tenet_struggles_of_desert_name: "Đấu Tranh của Sa Mạc"
 tenet_struggles_of_desert_desc: "Con dân của cát được dạy phải đối mặt trực diện với mọi thử thách, không dựa vào gì hơn ngoài những phẩm chất mà Allah đã ban cho họ để vượt qua. Chỉ có một phản ứng duy nhất trước nghịch cảnh, đó là vượt qua nó bằng lòng can đảm thuần túy và mưu trí.\n\nNhững ma cà rồng này không ngừng bị thôi thúc thử thách lòng can đảm và năng lực của mình, sẵn lòng chấp nhận mọi thử thách và chiến thắng bằng tài năng và kỹ năng thuần túy. Họ ưa chuộng những thử thách đêm này qua đêm khác của kẻ lang bạt, nơi không có gì đảm bảo về nơi trú ẩn hay lương thực."

 tenet_ashen_faith_name: "Đức Tin Tro Tàn"
 tenet_ashen_faith_desc: "Hầu hết các Con Đường ma cà rồng chủ yếu là triết lý, chỉ gắn với bản thân. Nhưng đức tin của ngươi thì không, ngươi đang mang ơn cứu rỗi đến cho toàn thể $pod_cainites$ và lời rao giảng phải được lan truyền."
 doctrine_parameter_ashen_faith: "[character_interaction|E] Đòi Hỏi Cải Đạo có tỷ lệ thành công cao hơn. Mở khóa nghĩa vụ chư hầu Ảnh Hưởng Giáo Phái."
 ASHEN_FAITH: "Giáo Lý Đức Tin Tro Tàn $VALUE|=+0$"

 tenet_the_pyramid_name: "Kim Tự Tháp"
 tenet_the_pyramid_desc: "Bị vây hãm từ mọi phía bởi những kẻ thù hùng mạnh, tuyến phòng thủ chính của Tremere là sự tuân phục tuyệt đối vào một trật tự thứ bậc vô cùng nghiêm ngặt."
 doctrine_parameter_the_pyramid: "Chư hầu không thể tuyên chiến với chư hầu khác nếu không có ân huệ với lãnh chúa của họ."

 tenet_feral_vampires_name: "Ma Cà Rồng Hoang Dã"
 tenet_feral_vampires_desc: "Những vùng đất hoang sơ là bãi săn của chúng ta, và những người giữ truyền thuyết của chúng ta đảm bảo rằng di sản của chúng ta sẽ được lưu truyền."
 doctrine_parameter_feral_lorekeepers: "Có thể sử dụng quyết định Đặt Hàng Sử Thi mà không cần bất kỳ perk nào, nhưng luôn dẫn đến một bài ca."
 doctrine_parameter_can_hunt: "Có thể sử dụng quyết định Đi Săn, ngay cả khi là ma cà rồng."
 can_hunt_name: "Có thể đi săn"
 doctrine_parameter_city_aversion: "Mất quyền truy cập vào các công trình đại diện cho ảnh hưởng lên chuyện thành thị, thay vào đó nhận các phiên bản nông thôn."

 tenet_old_ways_name: "Lối Cũ"
 tenet_old_ways_desc: "Đã nhiều thế kỷ trôi qua kể từ khi phương Bắc phàm trần tôn sùng và đi theo những kẻ cướp bóc táo bạo nhất hơn là các thương nhân giàu có và quý tộc xảo trá. Nhiều ma cà rồng xem đây là một sự phát triển vô cùng đáng tiếc."

 tenet_sanctioned_diableries_name: "Diablerie Được Cho Phép"
 tenet_sanctioned_diableries_desc: "Con Cái của Haqim phải thu hồi lại dòng máu của những kẻ không xứng đáng, nhưng hãy coi chừng vị quan tòa hấp tấp."
 doctrine_parameter_sanctioned_diableries: "Trong một $pod_diablerie$, nếu nạn nhân của ngươi là kẻ hèn nhát, độc đoán hoặc theo một tôn giáo Tà Ác, chi phí tín tâm sẽ được giảm bớt. Nếu nạn nhân là kẻ can đảm, công chính hoặc theo một tôn giáo Chính Nghĩa, chi phí sẽ tăng lên."

 COURT_CHAPLAIN_CONVERSION_SECRET_CULT_PENALTY: "Hình phạt vì có giáo lý Giáo Phái Bí Mật."

 tenet_secret_cult_name: "Giáo Phái Bí Mật"
 tenet_secret_cult_desc: "Tôn giáo này tổ chức như một kiểu âm mưu bí ẩn. Ít ai thực sự biết đến sự tồn tại của họ, và họ thích như vậy."
 doctrine_parameter_secret_cult: "Có thể chiêu mộ [GetMaA('cultists').GetName] làm [men_at_arms|E]"
 tenet_noblesse_oblige_name: "Trách Nhiệm Quý Tộc"
 tenet_noblesse_oblige_desc: "Các lãnh chúa xem trọng trách nhiệm của lãnh chúa đối với chư hầu của mình một cách vô cùng nghiêm túc. Việc quản lý hệ thống chư hầu một cách công bằng sẽ mang lại những chư hầu hạnh phúc. Chư hầu hạnh phúc đồng nghĩa với một lãnh chúa thành công."

 tenet_knowledge_above_all_name: "Tri Thức Trên Hết"
 tenet_knowledge_above_all_desc: "Bí ẩn vĩ đại quá quan trọng để bị kìm hãm bởi những mối bận tâm đạo đức tầm thường."
 doctrine_parameter_experiments_on_prisoners: "Cho phép sử dụng một phương pháp hành quyết đặc biệt."
 EXECUTION_EXPERIMENTS: "Thí Nghiệm trên Chúng"

 tenet_moments_of_truth_name: "Khoảnh Khắc Chân Lý"
 tenet_moments_of_truth_desc: "Một tia cảm hứng lóe lên? Một thông điệp từ các thế lực cao hơn? Dù thế nào, một sự kiện trọng đại như vậy có thể thay đổi bất kỳ ai đến tận cốt lõi."
 doctrine_parameter_moments_of_truth: "Cho phép tiếp cận một khả năng giải tỏa căng thẳng đặc biệt, nơi ngươi có thể thay đổi các đặc điểm của mình."

 stress_threshold.7001.t: "Suy Sụp Tinh Thần: Khoảnh Khắc Chân Lý"
 stress_threshold.7001.desc: "Ngươi đã được ban cho một khải thị. Những biến động hiện tại của ngươi là một thử thách từ Đấng Toàn Năng để đánh giá sự xứng đáng của ngươi. Một khoảnh khắc minh mẫn hiếm hoi như vậy có thể là dịp để ngươi lập một lời thề.\nChắc chắn, có những khiếm khuyết trong tính cách của ngươi mà ngươi có thể khắc phục, hy vọng sẽ đưa ngươi đến gần hơn với Đấng Thiêng Liêng trong quá trình đó."
 stress_threshold.7001.a: "Công lý chỉ dành cho kẻ yếu đuối!"
 stress_threshold.7001.b: "Ta đã đánh mất nhân tính của mình chưa?"
 stress_threshold.7001.c: "Ta phải giữ tập trung."
 stress_threshold.7001.d: "Ta cần nhiều hơn nữa!"
 stress_threshold.7001.e: "Tất cả bọn chúng đều ở đây để hại ta!"
 stress_threshold.7001.f: "Có lẽ không phải tất cả bọn chúng đều ở đây để hại ta?"

 tenet_honor_and_bravery_name: "Danh Dự và Lòng Can Đảm"
 tenet_honor_and_bravery_desc: "Một chân chúa tể của màn đêm đích thực dẫn đầu từ tuyến trước, không hề sợ hãi chém xuyên qua bất kỳ kẻ địch nào ngu ngốc đến mức đứng chắn đường mục đích cao quý của họ!"
 doctrine_parameter_battle_winning_prestige: "Ngươi nhận được nhiều uy vọng hơn khi thắng trận."

 tenet_community_name: "Cộng Đồng"
 tenet_community_desc: "Người mục tử tốt chăm sóc đàn cừu của mình. Hãy để nó sinh sôi và phát triển, và không để kẻ săn mồi nào lại gần nó."
 doctrine_parameter_access_to_develop_capital: "Ngươi có quyền sử dụng quyết định Phát Triển Kinh Đô, và nó tốn ít căng thẳng hơn."

 tenet_svadharma_name: "Svadharma"
 tenet_svadharma_desc: "Tín đồ của con đường này tin rằng họ đã rơi ra khỏi vòng luân hồi tái sinh. Cách duy nhất để sửa chữa mọi thứ là đi theo một bộ nghĩa vụ mới, giúp người khác tìm ra con đường riêng của họ, dù họ có muốn hay không."
 doctrine_parameter_access_to_improve_scheme: "Ngươi có quyền sử dụng quyết định Cải Thiện Mưu Đồ."

 tenet_lilithmaid_name: "Lilith, Thiếu Nữ"
 tenet_lilithmaid_desc: "Thiếu Nữ giận dữ và nguyền rủa số phận đã bày ra trước mắt nàng. Nàng sẽ không thuộc về bất kỳ người đàn ông, quốc gia hay thậm chí là tài sản của Chúa Trời."

 tenet_lilithmother_name: "Lilith, Người Mẹ"
 tenet_lilithmother_desc: "Thiếu Nữ trở thành Người Mẹ trong đau đớn và cuối cùng hiểu ra rằng đó là điều duy nhất bất biến trên thế gian này."

 tenet_lilithcrone_name: "Lilith, Bà Lão"
 tenet_lilithcrone_desc: "Bà Lão đã sinh sôi khắp thế gian và giờ đây sử dụng tri thức của mình để dẫn dắt họ vào thế giới."

 tenet_aphrodisiac_saturnalia_name: "Mê Dược và Saturnalia"
 tenet_aphrodisiac_saturnalia_desc: "Các nghi lễ Mùa Xuân và Mùa Đông là nền tảng trong đời sống của tôn giáo này. Được chọn làm người tổ chức những sự kiện đó là một vinh dự lớn lao."
 doctrine_parameter_aphrodisiac_saturnalia: "Ngươi có quyền tiếp cận hai chức vụ triều đình mới: Chúa Tể Hỗn Loạn và Người Chủ Trì Mê Dược."

 tenet_fire_fury_name: "Lửa và Thịnh Nộ"
 tenet_fire_fury_desc: "Toàn bộ hệ thống chính trị ma cà rồng đã thối nát và phải bị lật đổ. Và đàm phán hòa bình không còn là một lựa chọn nữa."

 tenet_helios_truth_name: "Chân Lý của Helios"
 tenet_helios_truth_desc: "Helios dạy cho Garou biết tiết chế bản năng và Cuồng Nộ của mình bằng tư duy và lý trí. Vì vậy, những kẻ theo ngài thường trở thành những nhà ngoại giao và đàm phán tài ba. Thông thường, vấn đề lớn nhất trong việc đạt được một cuộc đình chiến, hiệp ước hay liên minh là khiến bên kia lắng nghe lập luận mà nhân vật đưa ra. Helios coi trọng chân lý và công lý. Helios mang lại lý trí và sự khéo léo cho những người sói tôn kính ngài."

 tenet_summer_festivals_name: "Lễ Hội Mùa Hè"
 tenet_summer_festivals_desc: "Triều Đình Mùa Hè tự hào về sự tuân thủ truyền thống và trật tự, cùng việc gìn giữ kỷ luật nghiêm khắc. Một phần của những truyền thống đó là các lễ hội phổ biến trong những ngày nóng nực nhất của mùa hè, tượng trưng cho tiếng cười, niềm vui và tự do. Chúng tạo cớ để thu thập càng nhiều Diễm Sắc càng tốt từ những giấc mơ nóng bỏng của người phàm, và trong lúc lễ hội diễn ra, các fae được phép đùa giỡn với bất kỳ người phàm nào họ gặp. Lễ hội Cao Hạ của phe Seelie cho phép họ, trong một ngày ngắn ngủi, sử dụng người phàm như đồ chơi một cách không hổ thẹn, và thỏa sức trêu chọc, chơi khăm."

 tenet_ivory_priesthood_name: "Tăng Đoàn Ngà Voi"
 tenet_ivory_priesthood_desc: "Khi Sói Đầu Tiên chết để cứu Gaia, nó đã học được "Bí Mật của Cái Chết". Tăng Đoàn Ngà Voi là một hội kín gồm các Theurge tộc Nanh Bạc, những kẻ sau khi trải qua một loạt thử thách và kiểm nghiệm tâm linh, bắt đầu học được những bí mật tương tự về những gì nằm bên kia tấm màn của Cái Chết."

 tenet_hexcraft_name: "Thuật Nguyền Rủa"
 tenet_hexcraft_desc: "Làm chủ ánh mắt độc địa, lời nguyền, vận rủi, Amria. Hãy cẩn thận đừng chọc giận họ, kẻo ngươi sẽ nhận lấy hậu quả của một lời nguyền. Ruột gan ngươi sẽ bị vặn thành nút thắt, khiến ngươi nôn mửa và yếu ớt như một đứa trẻ trong cả tuần. Những lời nguyền của họ giúp họ trong mọi loại mưu đồ hiểm ác."

 tenet_vengeance_of_nut_name: "Báo Thù cho Nut"
 tenet_vengeance_of_nut_desc: "Những kẻ tìm cách báo thù cho Nut tận hiến cho việc hủy diệt ma cà rồng. Họ báo thù cho một quê hương đã mất và thân quyến đã mất. Các Sát Thủ Dao Găm hành động như những kẻ ám sát bất cứ nơi nào họ lang thang, lặng lẽ chọn ra một hay ba con Đỉa Máu để tận diệt. Họ thành thạo trong việc 'Tìm Sào Huyệt' của kẻ bất tử."
 doctrine_parameter_find_the_lair_active: "Mở khóa [journey|E] Tìm Sào Huyệt."

 tenet_way_of_zhong_kuei_name: "Đạo của Chung Quỳ"
 tenet_way_of_zhong_kuei_desc: "Phương pháp luận trấn áp ác quỷ bất tử do Chung Quỳ phát triển. Những ai theo con đường này thành thạo trong việc 'Tìm Sào Huyệt' của ma cà rồng."



 tenet_banepossession_name: "Quỷ Ám Bane"
 tenet_banepossession_desc: "Bane là các linh hồn tà ác phục vụ cho Wyrm. Bane trải dài từ yếu đuối và tương đối vô hại cho đến những sinh vật quyền năng khủng khiếp có khả năng xé toạc thực tại xung quanh chúng. Bane yếu thường được dùng để lây nhiễm cho người và động vật, biến chúng thành fomori. Tìm vật chủ cho bane được các giáo phái Wyrm xem là một nhiệm vụ thiêng liêng."

 past_lives_name: "Kiếp Trước"
 past_lives_doctrine_name: "Kiếp Trước"
 past_lives_doctrine_desc: "Đối với những anh hùng vĩ đại nhất, cái chết không phải là sự kết thúc. Những Garou khôn ngoan và mạnh mẽ nhất vẫn lưu lại, tồn tại như những linh hồn dẫn dắt hậu duệ của mình trong cuộc đấu tranh vĩ đại. Stargazer và Con Cái của Gaia xem đây là sự tái sinh theo nghĩa đen của các anh hùng Garou vào hậu duệ của họ. Một số cho rằng đó giống một ký ức chủng tộc tập thể hơn, như Ký Ức Akashic. Những Garou khác lại nghĩ về nó nhiều hơn như sự dẫn dắt của linh hồn tổ tiên. Những thị kiến hiện đến có thể truyền tải tri thức quan trọng và thậm chí cả kỹ năng thực tiễn. Đôi khi, dường như Garou còn bị chính linh hồn tổ tiên của mình nhập vào. Hiếm hoi hơn nữa, vị tổ tiên đó đã và dường như vẫn còn điên loạn."

 wyrm_tainted_name: "Vết Nhơ $glossary_wyrm$"
 wyrm_tainted_doctrine_name: "Vết Nhơ $glossary_wyrm$"
 wyrm_tainted_doctrine_desc: "Nhiều $glossary_fera$ tôn kính Gaia sở hữu một món quà cho phép họ cảm nhận vết nhơ của $glossary_wyrm$ trên kẻ khác. Vết nhơ này có thể mang nhiều hình dạng. Một vết nhơ phổ biến là các con đường và lối giác ngộ ma cà rồng, vốn bị xem là quá đồi bại đến mức tín đồ của những tôn giáo đó mặc nhiên bị xem là nhiễm vết nhơ của Wyrm."
 doctrine_parameter_hostility_override_wyrm_tainted_doctrine: "Các [faiths|E] có [GetFaithDoctrine('wyrm_tainted_doctrine').GetBaseName] được xem là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"

 tenet_bacchanal_name: "Tiệc Rượu Bacchanal"
 tenet_bacchanal_desc: "Tận hiến cho những cuộc truy hoan say sưa, giáo lý này khiến việc giảm căng thẳng của quyết định uống rượu hiệu quả gấp đôi. Một số người sẽ cho rằng việc tiêu thụ những chất độc như vậy là một cơn nghiện nguy hiểm."

 tenet_neter_sentra_name: "Neter Sentra"
 tenet_neter_sentra_desc: "Hơi thở của thần thánh: những lời cầu nguyện được khói mang lên thiên đường. Giáo phái khói thiêng đã tiếp nhận cải tiến mới lạ là không chỉ ăn bánh hashish, mà còn hút chúng. Họ thử nghiệm với nhiều loại hương liệu kỳ lạ và khói có khả năng gây nguy hiểm. Giáo lý này khiến việc giảm căng thẳng của quyết định hashishiyah hiệu quả gấp đôi."

 tenet_paranoia_name: "Hoang Tưởng"
 tenet_paranoia_desc: "Chỉ vì ngươi hoang tưởng không có nghĩa là không có kẻ nào muốn hại ngươi!"

 tenet_advocatus_diaboli_name: "Advocatus Diaboli"
 tenet_advocatus_diaboli_desc: "Satan và tay sai của hắn sở hữu năng lực thuyết phục ghê gớm, một khả năng lừa dối kỳ lạ khiến kẻ khác làm những việc phục vụ cho tham vọng quỷ dữ của chúng."

 tenet_collectivism_name: "Chủ Nghĩa Tập Thể"
 tenet_collectivism_desc: "Bắt nguồn từ thuyết đồng nhất luận Trung Hoa cổ đại, tận hiến cho việc xây dựng một tập thể kiểu Leviathan, tạo ra một khái niệm tập thể về giới học giả thông qua sự giáo hóa linh hoạt và luật lệ hà khắc, và cuối cùng tạo ra một ý chí tập thể thống nhất."
 


