 doctrine_fae_agenda_name: "Cương Lĩnh"

 doctrine_fae_agenda_militant_name: "Hiếu Chiến"
 doctrine_fae_agenda_militant_desc: "Rất nhiều fae nóng lòng mong Hiệp ước Đình chiến kết thúc để họ có thể trở lại với những cuộc giao tranh của Chiến tranh Mùa. Cảm xúc thúc đẩy và lòng trung thành được khơi dậy từ việc được Sained vào một Triều đình là mãnh liệt và khó lòng gạt bỏ trước bất kỳ chuyện gì. Gần như mọi thành viên của Bốn Triều đình đều thực lòng tin rằng lối sống của mình mới là con đường đúng đắn, dù đó là dưới hình thức một thế giới tốt đẹp hơn cho tất cả, hay đơn giản chỉ là kẻ mạnh nhất xứng đáng cai trị. Việc nối lại chiến tranh của fae không phải là điều gieo rắc nỗi khiếp sợ trong lòng phần đông fae theo phe phái—đó là tín hiệu cho thấy trận chiến định đoạt số phận thế giới cuối cùng cũng có thể bắt đầu."
 doctrine_fae_agenda_trucebearer_name: "Người Mang Đình Chiến"
 doctrine_fae_agenda_trucebearer_desc: "'Người Mang Đình Chiến' là thuật ngữ chỉ những fae tìm cách chấm dứt Chiến tranh Mùa, hoặc bằng cách kéo dài Hiệp ước Đình chiến vô thời hạn, hoặc bằng cách rèn nên một hiệp ước mới, lâu bền để chấm dứt hận thù giữa các Triều đình. Người Mang Đình Chiến của mọi Triều đình thường là những cá nhân đơn độc hay những nhóm nhỏ fae miệt mài hoạt động trong lĩnh vực xã hội để lôi kéo các triều đình địa phương hướng về hòa bình. Không có gì lạ khi họ hiếm khi thành công, nhưng điều đó chỉ càng khơi thêm ngọn lửa trong lòng họ. Hòa bình, dù phải trả giá thế nào, chính là sứ mệnh của họ."
 doctrine_fae_agenda_humanist_name: "Nhân Đạo"
 doctrine_fae_agenda_humanist_desc: "Phe Nhân Đạo không nhất thiết ủng hộ lòng tốt và sự khoan dung khi đối xử với cõi người, mà đúng hơn là ôm lấy một nguyên tắc đạo đức chủ yếu quan tâm đến việc thấu hiểu nhân loại. Con người giờ đây sở hữu số đông và quyền lực vượt xa những gì bản thân fae có. Phe Nhân Đạo tin rằng đây là lúc thu thập thông tin về con người, giao thiệp với họ, rèn nên những lời thề mới, và bằng mọi cách tìm kiếm sự cân bằng giữa hai giống loài trước khi quá muộn. Họ mong muốn đạt tới một mức độ phụ thuộc lẫn nhau với con người, nơi fae một lần nữa được công nhận, và hoặc được trân trọng và kính nể... hoặc đơn giản chỉ được trân trọng và e sợ."
 doctrine_fae_agenda_constantinian_name: "Constantinian"
 doctrine_fae_agenda_constantinian_desc: "Constantinian cũng có thể sử dụng [hostile_scheme|E] [GetScheme('inquihunt').GetTypeName] [GetTrait('supehunter').GetName( GetPlayer )] nhắm vào một [GetTrait('vampire').GetName( GetPlayer )].\n\n$tenet_constantinian_desc$"
 doctrine_fae_agenda_none_name: "Chưa Quyết Định"
 doctrine_fae_agenda_none_desc: "Không có cương lĩnh nào tỏ ra hấp dẫn cả. Phe Hiếu Chiến, Người Mang Đình Chiến, Phe Nhân Đạo và Constantinian đều có những lý lẽ đáng cân nhắc, và nhiều fae vẫn chưa quyết định con đường phía trước là gì."
