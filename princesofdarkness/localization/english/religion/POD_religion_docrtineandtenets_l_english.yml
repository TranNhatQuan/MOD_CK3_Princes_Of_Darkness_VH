l_english: 

# Vampire Doctrines

 
 tenet_vengeance_of_lilith_name: "Báo Thù của Lilith"
 tenet_vengeance_of_lilith_desc: "Con cái của Caine đã phá hủy khu vườn của Lilith và sát hại các con của nàng. Chỉ có Toreador và Nosferatu kiềm chế không tham gia hủy diệt, và đã che mặt những đứa trẻ đã chết bằng khăn voan như một dấu hiệu của lòng tôn kính. Vì thế, họ được miễn trừ khỏi sự báo thù của những kẻ theo Lilith."
 
 #A passage in Revelations of the Dark Mother, which describes how (represented allegorically as the thirteen $pod_clan$ Founders) 
 
 doctrine_vampirethemasquerade_name: "Màn Che"
 doctrine_werewolf_veil_name: "Tấm Màn"
 doctrine_vampirethemasquerade_strict_name: "Màn Che Nghiêm Ngặt"
 doctrine_werewolf_veil_shall_not_lifted_name: "Không Được Vén Lên"
 doctrine_vampirethemasquerade_strict_desc: "Sự Im Lặng của Máu được thực thi một cách nghiêm ngặt. Nhiều kindred bất mãn dưới sự thực thi hà khắc như vậy.\n\nChớ kết bạn với các Thi Nhân, họ sẽ ca ngợi ngươi quá nhiều.\n\nĐừng để bị biết đến. Hãy tìm đến bóng tối.\n\nChớ để tu sĩ, thi nhân, hay nông dân thấy ngươi ăn uống. Không một ai trong số họ sẽ để yên chuyện đó.\n\nKhi Thập Tự Giá có một mũi nhọn, hãy tìm sự an toàn cho ngươi."
 doctrine_vampirethemasquerade_lax_name: "Màn Che Lỏng Lẻo"
 doctrine_werewolf_veil_should_not_lifted_name: "Không Nên Vén Lên"
 doctrine_vampirethemasquerade_lax_desc: "Việc thực thi Sự Im Lặng của Máu khá lỏng lẻo. Dù Kindred có nỗ lực che giấu sự tồn tại của mình, đôi khi họ vẫn phạm phải những sai lầm khủng khiếp mà không bị các bậc trưởng lão trừng phạt."
 doctrine_werewolf_veil_should_not_lifted_desc: "Tấm Màn là một thuật ngữ đầy chất thơ cho niềm tin sai lầm rằng siêu nhiên không tồn tại, điều mà Delirium càng củng cố thêm. Tấm Màn được thiết lập chính thức thông qua Hiệp Ước chín ngàn năm trước, sự kiện đã chấm dứt Impergium. Litany nói rõ rằng 'Tấm Màn Không Được Vén Lên'. Delirium giúp giữ Tấm Màn luôn tại vị. Gây hại hay xé rách Tấm Màn đồng nghĩa với mất mát danh dự lớn lao trong hàng ngũ Garou, còn tu bổ Tấm Màn thì ngược lại. Trong thực tế, Delirium làm hầu hết công việc và Garou phần lớn không cần bận tâm về nó. Một số bộ tộc xem đó như một chỉ dẫn hơn là một quy tắc nghiêm ngặt cần thực thi." 
 doctrine_vampirethemasquerade_none_name: "Không Màn Che"
 doctrine_werewolf_veil_should_does_not_matter_name: "Không Còn Quan Trọng"
 doctrine_vampirethemasquerade_none_desc: "Ma cà rồng hành động mà không đoái hoài đến việc giữ bí mật trước loài kine.\nVới nguyên lý này thì khó giảm bớt mức độ bị lộ diện hơn, nhưng Kinh Sợ cao hơn sẽ giảm rủi ro nổi loạn tỉnh của một Cell Dị Giáo."
 doctrine_parameter_harder_masquerade_reduction: "[masquerade_exposure|E] khó giảm bớt hơn"
 doctrine_parameter_no_masquerade_penalty: "Nhiều hành động có cơ hội #N tăng#! [masquerade_exposure|E] giờ đây sẽ luôn thành công"
 
 doctrine_werewolf_veil_should_does_not_matter_desc: "Tấm Màn là một thuật ngữ đầy chất thơ cho niềm tin sai lầm rằng siêu nhiên không tồn tại, điều mà Delirium càng củng cố thêm. Tấm Màn được thiết lập chính thức thông qua Hiệp Ước chín ngàn năm trước, sự kiện đã chấm dứt Impergium. Litany nói rõ rằng 'Tấm Màn Không Được Vén Lên'. Delirium giúp giữ Tấm Màn luôn tại vị. Gây hại hay xé rách Tấm Màn đồng nghĩa với mất mát danh dự lớn lao trong hàng ngũ Garou, còn tu bổ Tấm Màn thì ngược lại. Một số người sói cho rằng Tấm Màn là một ý niệm lỗi thời không còn quan trọng nữa. Một số thậm chí còn chủ động tìm cách hạ bệ Tấm Màn để người sói có thể một lần nữa tái lập Impergium và công khai khủng bố toàn thể nhân loại."
 doctrine_vampirethemasquerade_consent_name: "Chỉ Hút Máu Từ Kẻ Tự Nguyện"
 doctrine_vampirethemasquerade_consent_desc: "Ma cà rồng, dù ẩn mình khỏi xã hội nói chung, phải tìm kiếm sự ưng thuận từ những 'người hiến máu' của mình." 
 doctrine_vampirethemasquerade_cult_name: "Giáo Phái Máu"
 doctrine_vampirethemasquerade_cult_desc: "Ma cà rồng có một hội kín hay một giáo phái máu ngầm tôn sùng họ như một vị thần máu."  
 doctrine_vampirethemasquerade_family_name: "Bí Mật Gia Tộc"
 doctrine_vampirethemasquerade_family_desc: "Ma cà rồng hút máu từ những gia đình phàm nhân cụ thể, những người có thể phần nào biết về tình trạng ma cà rồng. Họ mong muốn giữ cho dòng máu mình thuần khiết, và khinh miệt kẻ 'ô uế'."   
 doctrine_parameter_vampirethemasquerade_strict: "Nhân vật có [traits|E] [GetTrait('predatortype_consensualist').GetName( GetPlayer )], [GetTrait('predatortype_cultist').GetName( GetPlayer )] hoặc [GetTrait('predatortype_familias').GetName( GetPlayer )] là [criminals|E]"
 doctrine_parameter_vampirethemasquerade_lax: "Nhân vật có [traits|E] [GetTrait('predatortype_consensualist').GetName( GetPlayer )], [GetTrait('predatortype_cultist').GetName( GetPlayer )] hoặc [GetTrait('predatortype_familias').GetName( GetPlayer )] bị [shunned|E]"

 doctrine_parameter_vampirethemasquerade_family: "Nhân vật có [traits|E] [GetTrait('predatortype_alleycat').GetName( GetPlayer )], [GetTrait('predatortype_bedlamite').GetName( GetPlayer )], [GetTrait('predatortype_farmer').GetName( GetPlayer )], [GetTrait('predatortype_footpad').GetName( GetPlayer )] hoặc [GetTrait('predatortype_graverobber').GetName( GetPlayer )] bị [shunned|E]. Nhân vật có [trait|E] [GetTrait('predatortype_familias').GetName( GetPlayer )] được chấp nhận hoàn toàn"
 doctrine_parameter_vampirethemasquerade_cult: "Nhân vật có [traits|E] [GetTrait('predatortype_consensualist').GetName( GetPlayer )] hoặc [GetTrait('predatortype_familias').GetName( GetPlayer )] bị [shunned|E].  Nhân vật có [GetTrait('predatortype_cultist').GetName( GetPlayer )] [trait|E] được chấp nhận." 
 doctrine_parameter_vampirethemasquerade_consent: "Nhân vật có [GetTrait('predatortype_alleycat').GetName( GetPlayer )] [trait|E] là [criminals|E]. Nhân vật có [GetTrait('predatortype_cauchemar').GetName( GetPlayer )] hoặc [GetTrait('predatortype_extortionist').GetName( GetPlayer )] [traits|E] bị [shunned|E]. Nhân vật có [GetTrait('predatortype_consensualist').GetName( GetPlayer )] [trait|E] được ca ngợi. Mọi loại săn mồi khác đều được chấp nhận."  
 
# Oaths and Oathbreaking

 doctrine_oathbreaking_name: "Phản Thệ"
 doctrine_oathbreaking_crime_name: "Tội Phạm"
 doctrine_oathbreaking_crime_desc: "Lời thề là nền tảng của luật pháp. Kẻ phá vỡ lời thề không còn danh dự và tính mạng của họ đáng bị tước đoạt."
 doctrine_oathbreaking_shunned_name: "Bị Xa Lánh"
 doctrine_oathbreaking_shunned_desc: "Kẻ phá vỡ lời thề không đáng được tin cậy. Hãy cảnh giác với họ."
 doctrine_oathbreaking_accepted_name: "Được Chấp Nhận"
 doctrine_oathbreaking_accepted_desc: "Việc phá vỡ lời thề được chấp nhận. Ai lại tin lời của kẻ bất tử chứ?"
 doctrine_parameter_oathbreaking_illegal: "Nhân vật có [GetTrait('oathbreaker').GetName( GetPlayer )] [trait|E] là [criminals|E]"
 doctrine_parameter_oathbreaking_shunned: "Nhân vật có [GetTrait('oathbreaker').GetName( GetPlayer )] [trait|E] bị [shunned|E]"
 doctrine_parameter_oathbreaking_accepted: "Nhân vật có [GetTrait('oathbreaker').GetName( GetPlayer )] [trait|E] được chấp nhận hoàn toàn"
 
 doctrine_vampirebloodoath_name: "Lời Thề Máu"
 doctrine_vampirebloodoath_crime_name: "Tội Phạm"
 doctrine_vampirebloodoath_crime_desc: "Bị ràng buộc máu còn tệ hơn cả bị nô dịch, vì nó xiềng xích cả trái tim lẫn tâm trí, chứ không chỉ thân xác."
 doctrine_vampirebloodoath_shunned_name: "Bị Xa Lánh"
 doctrine_vampirebloodoath_shunned_desc: "Lời thề máu có thể là một gánh nặng cho kẻ thống trị chẳng kém gì cho nô lệ, hãy chọn lựa chúng thật cẩn thận, nếu có chọn. Hãy nhớ những câu tục ngữ. Một hớp Máu, ta nhận lấy. Hai hớp, ta chấp thuận. Ba hớp, ta từ chối."
 doctrine_vampirebloodoath_accepted_name: "Được Chấp Nhận"
 doctrine_vampirebloodoath_accepted_desc: "Lời Thề Máu là nền tảng của xã hội chúng ta. Lời thề trung thành nên được thực thi bằng một mức độ chư hầu máu nào đó."
 doctrine_parameter_vampirebloodoath_illegal: "Nhân vật có [GetTrait('unbondable').GetName( GetPlayer )] [trait|E] được chấp nhận hoàn toàn. Mất mộ đạo vì [Glossary('Blood Bond','game_concept_bloodbond_desc')]."
 doctrine_parameter_vampirebloodoath_shunned: "Nhân vật có [GetTrait('unbondable').GetName( GetPlayer )] [trait|E] được chấp nhận hoàn toàn. Mất mộ đạo vì [Glossary('Blood Bond','game_concept_bloodbond_desc')]."
 doctrine_parameter_vampirebloodoath_accepted: "Nhân vật có [GetTrait('unbondable').GetName( GetPlayer )] [trait|E] là [criminals|E]."

 doctrine_vampireghouling_name: "Chư Hầu [ghoul|E]"
 doctrine_vampireghouling_evil_name: "Tà Ác"
 doctrine_vampireghouling_evil_desc: "Không thể có hòa bình hay đàm phán với lũ tay sai. Chúng ta sẽ tiêu diệt tất cả bọn chúng, hoặc chết khi cố gắng."
 doctrine_vampireghouling_crime_name: "Tội Phạm"
 doctrine_vampireghouling_crime_desc: "Bộc huyết đe dọa Sự Im Lặng của Máu, chớ chia sẻ Dòng Máu với kẻ không xứng đáng.\n\nNgươi chớ trở thành như một Vị Thần đối với Con Cái của Seth, vì Đấng Ở Trên Cao, ngày càng ghen tuông trên bầu trời của người, sẽ giáng xuống dòng dõi của Caine mãi mãi. Hãy nhớ đến Ashtareth mặt hiền hòa, hãy nhớ đến Baal vàng son béo tốt, hãy nhớ đến Tammauz hùng mạnh, ngươi hãy biết rằng Con Cái của Seth sẽ vùng lên với vũ khí từ Đấng Ở Trên Cao, và chinh phục chúng ta, nếu chúng ta trở thành như các vị thần đối với họ. Ngươi hãy dẫn dắt Con Cái của Seth như người chăn cừu dẫn dắt đàn của mình, và tuyển lọc họ khi cần thiết. Ngươi hãy thanh tẩy dòng máu của họ, và giữ cho tất cả bọn họ tránh khỏi bệnh tật."
 doctrine_vampireghouling_shunned_name: "Bị Xa Lánh"
 doctrine_vampireghouling_shunned_desc: "Chúng ta là kẻ săn mồi, không phải con mồi. Chia sẻ máu của ngươi với loài kine là phơi bày sự yếu đuối của chính ngươi.\n\nNgươi chớ trở thành như một Vị Thần đối với Con Cái của Seth, vì Đấng Ở Trên Cao, ngày càng ghen tuông trên bầu trời của người, sẽ giáng xuống dòng dõi của Caine mãi mãi. Hãy nhớ đến Ashtareth mặt hiền hòa, hãy nhớ đến Baal vàng son béo tốt, hãy nhớ đến Tammauz hùng mạnh, ngươi hãy biết rằng Con Cái của Seth sẽ vùng lên với vũ khí từ Đấng Ở Trên Cao, và chinh phục chúng ta, nếu chúng ta trở thành như các vị thần đối với họ. Ngươi hãy dẫn dắt Con Cái của Seth như người chăn cừu dẫn dắt đàn của mình, và tuyển lọc họ khi cần thiết. Ngươi hãy thanh tẩy dòng máu của họ, và giữ cho tất cả bọn họ tránh khỏi bệnh tật."
 doctrine_vampireghouling_accepted_name: "Được Chấp Nhận"
 doctrine_vampireghouling_accepted_desc: "Chỗ đứng của loài kine là để phụng sự chúng ta, và họ trở thành chư hầu tốt hơn khi bị ràng buộc bởi Lời Thề Máu.\n\nCủa Những Kẻ Phụng Sự\n\nNhững kẻ ngươi chọn để ban ơn với Quyền Năng của Caine, có thể đến sống trong nhà ngươi, để bảo vệ ngươi, chớ để ai $pod_Embrace$ những kẻ canh giữ này, hãy để chúng được ban máu vào thời điểm thích hợp: hãy để Sức Mạnh của chúng là Sức Mạnh của ngươi, Sức Mạnh không suy giảm dưới ánh mặt trời. Hãy để Đôi Mắt của chúng là Đôi Mắt của ngươi, Đôi Mắt có thể nhìn thấy giữa ban ngày. Hãy để Đôi Tai của chúng là Đôi Tai của ngươi, Đôi Tai có thể nghe thấy trong khi ngươi say ngủ."
 doctrine_vampireghouling_mass_name: "Chấp Nhận Bộc Huyết Hàng Loạt"
 doctrine_vampireghouling_mass_desc: "Dòng máu của kindred có thể xây dựng nên những binh đoàn.\n\nCủa Những Kẻ Phụng Sự\n\nNhững kẻ ngươi chọn để ban ơn với Quyền Năng của Caine, có thể đến sống trong nhà ngươi, để bảo vệ ngươi, chớ để ai $pod_Embrace$ những kẻ canh giữ này, hãy để chúng được ban máu vào thời điểm thích hợp: hãy để Sức Mạnh của chúng là Sức Mạnh của ngươi, Sức Mạnh không suy giảm dưới ánh mặt trời. Hãy để Đôi Mắt của chúng là Đôi Mắt của ngươi, Đôi Mắt có thể nhìn thấy giữa ban ngày. Hãy để Đôi Tai của chúng là Đôi Tai của ngươi, Đôi Tai có thể nghe thấy trong khi ngươi say ngủ." 
 doctrine_parameter_vampireghouling_illegal: "Nhân vật có [traits|E] [GetTrait('ghoul').GetName( GetPlayer )], [GetTrait('regnant').GetName( GetPlayer )] hoặc [GetTrait('massregnant').GetName( GetPlayer )] là [criminals|E]."
 doctrine_parameter_vampireghouling_shunned: "Nhân vật có [traits|E] [GetTrait('ghoul').GetName( GetPlayer )] hoặc [GetTrait('regnant').GetName( GetPlayer )] bị [shunned|E]. Nhân vật có [GetTrait('massregnant').GetName( GetPlayer )] là [criminals|E]."
 doctrine_parameter_vampireghouling_accepted: "Nhân vật có [traits|E] [GetTrait('ghoul').GetName( GetPlayer )] hoặc [GetTrait('regnant').GetName( GetPlayer )] được chấp nhận hoàn toàn. Nhân vật có [GetTrait('massregnant').GetName( GetPlayer )] là [criminals|E]."
 doctrine_parameter_vampireghouling_mass: "Có thể chiêu mộ [GetMaA('massghouls_maa').GetName] làm [men_at_arms|E].\nNhân vật có [traits|E] [GetTrait('ghoul').GetName( GetPlayer )], [GetTrait('regnant').GetName( GetPlayer )] hoặc [GetTrait('massregnant').GetName( GetPlayer )] được chấp nhận hoàn toàn." 
 doctrine_parameter_majordomo_court_position_unlock: "Có thể tuyển dụng một [GetCourtPositionType('majordomo_court_position').GetName()]"
 majordomo_court_position_unlock_name: ""Có thể tuyển dụng một Majordomo"" #intentional double quotes

 doctrine_bloodsorcery_name: "Huyết Thuật"
 doctrine_bloodsorcery_crime_name: "Tội Phạm"
 doctrine_bloodsorcery_crime_desc: "Huyết Thuật là mối đe dọa đối với toàn thể Kindred và do đó phải bị cấm đoán. \n\nCủa Những Kẻ Được Khai Sáng\n\nMẫu Thân của Quyền Năng, Lilith hắc ám, là kẻ vĩ đại nhất trong bọn họ, nhưng còn có những kẻ khác, và sẽ còn nhiều kẻ nữa đến sau. Chớ uống máu của chúng, vì chúng sẽ giăng bẫy ngươi, hãy cảnh giác với chúng, chúng xảo quyệt lắm. Chúng nắm tri thức của Adam, và trí tuệ của Eva, chúng là kẻ mang lửa đến, kẻ cày xới đất đai, kẻ chăn nuôi thú vật, kẻ mang chữ viết đến, chúng là những Đứa Con của Mặt Trời, những Vì Sao Đang Lên. Chúng sẽ tìm cách lôi kéo ngươi vào hành trình của chúng, Hãy Kháng Cự! Hãy Kháng Cự! Con đường của chúng chẳng đoái hoài đến đói khát, máu huyết, hay thân xác. Chớ tin những kẻ có đôi mắt sáng ngời hướng về bình minh. Hãy luôn nhớ, chính Bình Minh mang đến cái chết cho ngươi"
 doctrine_bloodsorcery_shunned_name: "Bị Xa Lánh"
 doctrine_bloodsorcery_shunned_desc: "Các Huyết Thuật Sư là một đám đáng ngờ, tốt nhất cũng chỉ là một tội ác đôi khi cần thiết.\n\nCủa Những Kẻ Được Khai Sáng\n\nMẫu Thân của Quyền Năng, Lilith hắc ám, là kẻ vĩ đại nhất trong bọn họ, nhưng còn có những kẻ khác, và sẽ còn nhiều kẻ nữa đến sau. Chớ uống máu của chúng, vì chúng sẽ giăng bẫy ngươi, hãy cảnh giác với chúng, chúng xảo quyệt lắm. Chúng nắm tri thức của Adam, và trí tuệ của Eva, chúng là kẻ mang lửa đến, kẻ cày xới đất đai, kẻ chăn nuôi thú vật, kẻ mang chữ viết đến, chúng là những Đứa Con của Mặt Trời, những Vì Sao Đang Lên. Chúng sẽ tìm cách lôi kéo ngươi vào hành trình của chúng, Hãy Kháng Cự! Hãy Kháng Cự! Con đường của chúng chẳng đoái hoài đến đói khát, máu huyết, hay thân xác. Chớ tin những kẻ có đôi mắt sáng ngời hướng về bình minh. Hãy luôn nhớ, chính Bình Minh mang đến cái chết cho ngươi"
 doctrine_bloodsorcery_accepted_name: "Được Chấp Nhận"
 doctrine_bloodsorcery_accepted_desc: "Phép thuật tràn ngập thế giới quanh ta, và đó là quyền lợi cũng như đặc ân của ta được giao thoa cùng nó theo cách tổ tiên ta đã làm."
 doctrine_bloodsorcery_kufr_name: "Kufr"
 doctrine_bloodsorcery_kufr_desc: "Người Ashirra công khai thừa nhận sự tồn tại của phép thuật nhưng cảnh báo các tín đồ của mình chớ tìm kiếm sự trợ giúp từ các pháp sư. Làm như vậy là thể hiện sự thiếu đức tin nơi Allah, đấng duy nhất nắm quyền năng tuyệt đối trong vũ trụ. Tương tự, những kẻ hành pháp thuật, đặc biệt là bói toán tương lai, đang tìm cách tiếm đoạt một phần quyền năng của Ngài và do đó phạm tội báng bổ, khiến họ bị cấm cửa vào Thiên Đàng\n\nTuy nhiên, có một số người Ashirra hành một hình thức pháp thuật mà họ tin là phù hợp với ý chí của Allah. Pháp thuật này, Sihr, lấy quyền năng từ đức tin và tránh xa những thực hành chung của các truyền thống khác."
