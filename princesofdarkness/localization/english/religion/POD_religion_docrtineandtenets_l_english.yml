 doctrine_parameter_hurt_mortal_lose_piety: "Mất [piety_i][piety|E] khi làm bị thương nặng hay giết nạn nhân phàm nhân."
 doctrine_parameter_east_building_parameter: "[Glossary('Pháp Môn','podgloss.dharma')] phương Đông nhận thêm thưởng gắn với phát triển và khả năng kháng dịch bệnh tại các công trình Tổ Rồng cấp công tước."
 doctrine_parameter_south_building_parameter: "[Glossary('Pháp Môn','podgloss.dharma')] phương Nam nhận thêm thưởng gắn với chiến tranh tại các công trình Tổ Rồng cấp công tước."
 doctrine_parameter_west_building_parameter: "[Glossary('Pháp Môn','podgloss.dharma')] phương Tây nhận thêm thưởng gắn với mưu mô tại các công trình Tổ Rồng cấp công tước."
 doctrine_parameter_north_building_parameter: "[Glossary('Pháp Môn','podgloss.dharma')] phương Bắc nhận thêm thưởng gắn với tính chính danh tại các công trình Tổ Rồng cấp công tước."
 doctrine_parameter_center_building_parameter: "[Glossary('Pháp Môn','podgloss.dharma')] Trung Tâm nhận thêm thưởng gắn với kinh nghiệm lối sống tại các công trình Tổ Rồng cấp công tước."

 doctrine_parameter_frenzy_lose_piety: "Mất [piety_i][piety|E] khi phát cuồng."
 doctrine_parameter_can_hire_touchstones: "Có thể thuê [GetCourtPositionType('touchstones_court_position').GetName()]."
 doctrine_enlightenment_virtues_orun_and_aye_name: "Orun và Aye"
 doctrine_enlightenment_virtues_orun_and_aye_desc: "Laibon xây dựng cuộc đời mình quanh hai con đường Đạo Đức riêng biệt: Aye, là đạo đức của họ đối với loài người, và Orun, là đạo đức của họ đối với siêu nhiên."
 tenet_orun_and_aye_name: "Orun và Aye"
 tenet_orun_and_aye_desc: "Laibon xây dựng cuộc đời mình quanh hai con đường Đạo Đức riêng biệt: Aye, là đạo đức của họ đối với loài người, và Orun, là đạo đức của họ đối với siêu nhiên."
 #Depending on where they stand on these two scales, their appearance and supernatural power fluctuates. This fundamental difference forever separates the Laibon from the 'typical' $pod_cainite$."
 #Contrary to the Kindred, no Laibon follows the Path of Humanity, nor any other Path of Enlightenment for that matter. Instead,
 doctrine_enlightenment_virtues_direction_north_name: "Bắc"
 doctrine_enlightenment_virtues_direction_north_desc: "Bị rập khuôn là lạnh lùng, công minh và duy lý, [GetTrait('kueijin').GetName( GetNullCharacter )] hướng Bắc đóng vai trò như quan tòa và pháp quan đối với đồng loại, thường đứng ra phân xử tranh chấp và săn lùng tội phạm cùng [akuma|E]."
 doctrine_enlightenment_virtues_direction_east_name: "Đông"
 doctrine_enlightenment_virtues_direction_east_desc: "Thường được xem là những kẻ thoải mái nhất khi ở giữa loài người, [GetTrait('kueijin').GetName( GetNullCharacter )] hướng Đông được xem như nông dân, vun trồng những màn hồng và chăm sóc bầy đàn phàm nhân của mình."
 doctrine_enlightenment_virtues_direction_south_name: "Nam"
 doctrine_enlightenment_virtues_direction_south_desc: "Nổi tiếng với tính khí hung hãn, [GetTrait('kueijin').GetName( GetNullCharacter )] hướng Nam là động lực của xã hội, thách thức những niềm tin cũ kỹ và giữ cho Quincunx luôn cập nhật. Dù đồng loại thường xem họ là khó chịu, họ vẫn được các Trưởng Lão dung thứ vì trí tuệ và tài năng chiến đấu đáng gờm của mình."
 doctrine_enlightenment_virtues_direction_west_name: "Tây"
 doctrine_enlightenment_virtues_direction_west_desc: "Đóng vai trò như sứ giả tới các [spirit_worlds|E] của Trung Nguyên và đôi khi là sát thủ cho các Mandarin, [GetTrait('kueijin').GetName( GetNullCharacter )] hướng Tây thường bị đồng loại khinh miệt. Họ nổi tiếng là không khoan nhượng và hoàn thành mọi nhiệm vụ được giao- dù là từ một linh hồn, oan hồn hay mandarin- với sự chính xác tuyệt đối."
 doctrine_enlightenment_virtues_direction_center_name: "Trung Tâm"
 doctrine_enlightenment_virtues_direction_center_desc: "[GetTrait('kueijin').GetName( GetNullCharacter )] hướng Trung Tâm thường được giao nhiệm vụ dẫn dắt các Cathayan trẻ tuổi hơn vào những điều tinh tế của xã hội họ, nhưng nhiều người lại chọn khám phá tâm hồn của chính mình, dốc lòng cho sự giác ngộ pháp môn."

 tenet_vanilla_pursuit_of_knowledge_name: "Truy Cầu Tri Thức"
 tenet_vanilla_pursuit_of_knowledge_desc: "Nỗi ám ảnh với việc truy cầu tri thức. Tội lỗi bao gồm: không chịu học hỏi khi có cơ hội, từ chối theo đuổi thực nghiệm, từ chối chia sẻ hiểu biết với những kẻ khác trên Con Đường."

 tenet_greed_is_good_name: "Tham Lam Là Tốt"
 tenet_greed_is_good_desc: "Vàng bạc là quyền lực, vậy nên hãy dùng sự tích lũy của cải để giành lấy ảnh hưởng và từ đó thỏa mãn Dã Thú của mình."

 tenet_scorched_heart_name: "Trái Tim Trống Rỗng"
 tenet_scorched_heart_desc: "Được Rathmonicus phát triển, người ta kiểm soát Dã Thú bằng cách loại bỏ có hệ thống mọi cảm xúc trong trái tim ma cà rồng."

 tenet_isolation_name: "Cô Lập"
 tenet_isolation_desc: "Tất cả những gì chúng ta muốn là được yên thân. Cách thức của chúng ta là chuyện của riêng chúng ta, không phải chuyện của ai khác hơn là chuyện của họ đối với chúng ta."

 tenet_continued_life_name: "Sự Sống Tiếp Diễn"
 tenet_continued_life_desc: "Một số kẻ bất tử cố gắng tiếp tục cuộc sống phàm trần của mình càng nhiều càng tốt. Dù điều này giúp họ giữ liên hệ với cuộc sống phàm trần cũ, nó lại làm tăng nguy cơ lộ [the_masquerade|E]. Việc liên tục dùng sức mạnh huyền bí để ra vẻ còn sống cũng sẽ làm tăng cơn đói."

 tenet_vengeance_of_samiel_name: "Báo Thù của Samiel"
 tenet_vengeance_of_samiel_desc: "Samiel nhận được một cuộc viếng thăm từ Michael, thống lĩnh Thiên Binh, trong lúc Saulot vắng mặt. Vị tổng lãnh thiên thần đã chỉ dẫn vị vua chiến binh chép lại Bộ Luật và đưa vào đó những nghi thức cần thiết cho sức mạnh và sự tấn phong của các chiến binh mới."

# The greatest of Saulot's warrior line, the martyred founder Samiel is believed to have penned this text with his own hand. Samiel was killed at the end of the Second Baali War, as were more than half of his followers."

 tenet_devoted_to_michael_name: "Tận Hiến cho Michael"
 tenet_devoted_to_michael_desc: "Con Đường của Tổng Lãnh Thiên Thần là một Con Đường thuộc Con Đường Thiên Đường phổ biến tại Byzantium vào thế kỷ 13. Nó tôn kính ký ức của vị Thượng Phụ đã ngã xuống của Constantinople, Michael. Các tín đồ của con đường này được gọi là Michaelite."

 special_doctrine_three_pillars_kindred_name: "Ba Trụ Cột"
 special_doctrine_three_pillars_kindred_desc: "Nền tảng của xã hội phong kiến là lâu đài, nhà thờ và thị trấn. Xã hội Huyết Tộc phản chiếu điều này qua Con Đường Quân Vương, Con Đường Thiên Đường và Con Đường Nhân Tính cùng nhau khoan dung lẫn nhau."
 doctrine_parameter_hostility_override_special_doctrine_three_pillars_kindred: "Các [faiths|E] Huyết Tộc khác có [doctrine|E] [GetFaithDoctrine('special_doctrine_three_pillars_kindred').GetBaseName] được xem là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] thay vì $hostility_hostile_tooltippable$"

 special_doctrine_sin_pillars_kindred_name: "Trụ Cột Dục Vọng"
 special_doctrine_sin_pillars_kindred_desc: "Các môn đồ của Sahar mỗi người đã đi theo con đường riêng sau khi ngài biến mất, nhưng họ vẫn là huynh đệ tỷ muội trong cùng một đức tin."
 doctrine_parameter_hostility_override_special_doctrine_sin_pillars_kindred: "Các [faiths|E] Huyết Tộc khác có [doctrine|E] [GetFaithDoctrine('special_doctrine_sin_pillars_kindred').GetBaseName] được xem là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] thay vì $hostility_hostile_tooltippable$"

 special_doctrine_set_pillars_kindred_name: "Trụ Cột của Set"
 special_doctrine_set_pillars_kindred_desc: "Set mang nhiều hình dạng, nhiều tên gọi và nhiều truyền thuyết khởi nguyên. Nhưng cuối cùng, ngài vẫn là Đấng Giải Phóng Vĩ Đại."
 doctrine_parameter_hostility_override_special_doctrine_set_pillars_kindred: "Các [faiths|E] Huyết Tộc khác có [doctrine|E] [GetFaithDoctrine('special_doctrine_set_pillars_kindred').GetBaseName] được xem là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] thay vì $hostility_hostile_tooltippable$"

 special_doctrine_ashirra_pillars_kindred_name: "Trụ Cột Ashirra"
 special_doctrine_ashirra_pillars_kindred_desc: "Dù những kẻ theo bước chân đầu tiên của Hồi Giáo đến từ nhiều clan và xuất thân rất khác nhau, tất cả họ đều tin vào một điều gì đó lớn lao hơn bản thân mình."
 doctrine_parameter_hostility_override_special_doctrine_ashirra_pillars_kindred: "Các [faiths|E] Huyết Tộc khác có [doctrine|E] [GetFaithDoctrine('special_doctrine_ashirra_pillars_kindred').GetBaseName] được xem là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] thay vì $hostility_evil_tooltippable$"
 doctrine_parameter_ashirra_khitta_building_province_bonuses: "$glossary_khittas$ theo Ashirra tại [holy_cairo|E] cung cấp thêm thuế nếu Cairo theo tôn giáo này"
 doctrine_parameter_ashirra_khitta_building_character_bonuses: "$glossary_khittas$ theo Ashirra tại [holy_cairo|E] cung cấp tín tâm nếu người nắm giữ theo tôn giáo này"

 special_doctrine_lilith_pillars_kindred_name: "Trụ Cột Lilim"
 special_doctrine_lilith_pillars_kindred_desc: "Lilith tìm cách báo thù con cái của Caine. Nhưng nàng sẽ chấp nhận những kẻ cải đạo nhiệt thành, hay những con cờ hữu dụng, khi cần thiết."
 doctrine_parameter_hostility_override_special_doctrine_lilith_pillars_kindred: "Các [faiths|E] Huyết Tộc khác có [doctrine|E] [GetFaithDoctrine('special_doctrine_lilith_pillars_kindred').GetBaseName] được xem là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] thay vì $hostility_evil_tooltippable$"

 special_doctrine_heretical_paradox_name: "Vòng Tuần Hoàn Đứt Gãy"
 special_doctrine_heretical_paradox_desc: "Ravnos phương Đông (và nhiều Huyết Tộc khác) xem nhánh này là dị giáo và chỉ là cái cớ cho trộm cắp, diablerie, và các tội ác khác chống lại xã hội. Nhiều nỗ lực đã được khởi xướng để thanh trừng Con Đường này, dù chưa nỗ lực nào thành công cho đến nay."
 doctrine_parameter_hostility_override_tenet_svadharma: "Các [faiths|E] Huyết Tộc khác có [doctrine|E] [GetFaithDoctrine('tenet_svadharma').GetBaseName] xem tôn giáo này là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."

 special_doctrine_main_paradox_name: "Thấu Hiểu Vòng Tuần Hoàn"
 special_doctrine_main_paradox_desc: "Con Đường Nghịch Lý mang nợ nặng nề với một số giáo lý của Ấn Độ Giáo và được công nhận rộng rãi như một giáo lý đáng kính trọng trong giới ma cà rồng Ấn Độ. Trong khi đó, phiên bản Tây phương biến chất của nó thì không."
 doctrine_parameter_hostility_override_special_doctrine_heretical_paradox: "Các [faiths|E] Huyết Tộc khác có [doctrine|E] [GetFaithDoctrine('special_doctrine_heretical_paradox').GetBaseName] được xem là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."




 special_doctrine_ecumenical_hunters_name: "Thợ Săn Đại Đồng"
 special_doctrine_ecumenical_hunters_desc: "Dù các thợ săn đến từ nhiều xuất thân và đức tin khác nhau, họ nhận ra một mối liên kết chung trong việc chống lại những nỗi kinh hoàng siêu nhiên của Thế Giới Bóng Tối."
 doctrine_parameter_hostility_override_special_doctrine_ecumenical_hunters: "Các [faiths|E] Thợ Săn khác có [doctrine|E] [GetFaithDoctrine('special_doctrine_ecumenical_hunters').GetBaseName] được xem là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] thay vì $hostility_hostile_tooltippable$"

 special_doctrine_heretical_hunters_name: "Thợ Săn Dị Giáo"
 special_doctrine_heretical_hunters_desc: "Những Thợ Săn này, theo quan điểm của những kẻ còn lại, đã ngả về phía kẻ thù và nên bị săn lùng với cùng một sự thù ghét."

 special_doctrine_ignorance_name: "Không Thu Hút Sự Chú Ý"
 special_doctrine_ignorance_desc: "Người phàm không hề hay biết về siêu nhiên trong Thế Giới Bóng Tối. Chúng ta nên giữ cho mọi thứ như vậy."
 doctrine_parameter_hostility_override_special_doctrine_ignorance: "Các [faiths|E] Vô Minh cho rằng sự Ngây Thơ của người phàm khiến họ không phải là mối đe dọa với những kẻ siêu nhiên của Thế Giới Bóng Tối. Các tôn giáo muốn giữ người phàm trong vô minh xem họ là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] thay vì $hostility_hostile_tooltippable$ hay $hostility_evil_tooltippable$."
 doctrine_parameter_hostility_override_ignorance_hostility_doctrine: "Các [faiths|E] Vô Minh cho rằng sự Ngây Thơ của người phàm khiến họ không phải là mối đe dọa với những kẻ siêu nhiên của Thế Giới Bóng Tối. Các tôn giáo muốn giữ người phàm trong vô minh xem họ là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] thay vì $hostility_hostile_tooltippable$ hay $hostility_evil_tooltippable$."

 special_doctrine_fivefold_path_kindred_name: "Ngũ Pháp Môn"
 special_doctrine_fivefold_path_kindred_desc: "Năm [Glossary('Pháp Môn','podgloss.dharma')] truyền thống được tạo ra bởi [Glossary('La Hán','podgloss.arhat')] đầu tiên, [GetScriptedCharacterByHistoryID('791111').GetFirstName]. Chúng tạo thành cốt lõi truyền thống của xã hội $pod_kueijin$.\nCác tín đồ Ngũ Pháp Môn xem các [Glossary('Pháp Môn','podgloss.dharma')] dị giáo là những kẻ ngu muội đáng thương hay những kẻ phản bội nguy hiểm cần phải bị trừ khử vĩnh viễn."
 doctrine_parameter_hostility_override_special_doctrine_fivefold_path_kindred: "Các [faiths|E] [GetTrait('kueijin').GetName( GetNullCharacter )] có [doctrine|E] [GetFaithDoctrine('special_doctrine_fivefold_path_kindred').GetBaseName] được xem là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 
