 tenet_philosophical_combat_name: "Đấu Trí Triết Học"
 tenet_philosophical_combat_desc: "Thua một cuộc tranh luận trong diễn đàn có thể chết người không kém gì thua một trận chiến."

 tenet_constantinian_name: "Thần Học Constantinian"
 tenet_constantinian_desc: "Những fae tìm cách hiểu rõ chi tiết đức tin của con người từ trước đến nay luôn bị xem như đang theo đuổi một con đường học thuật khá vô dụng—cho đến bây giờ. Constantinian đã chứng kiến số lượng thành viên gia tăng vượt bậc trong những năm Hiệp ước Đình chiến. Được đặt theo tên Hoàng đế Constantine Đệ Nhất, những fae này tìm cách hiểu biết thêm về các tôn giáo của loài người, đặc biệt là Giáo hội Kitô giáo.\n\nNhững kẻ theo đuổi con đường nghiên cứu và suy luận này thường làm vậy vì một trong hai lý do chính: để thấu hiểu hiện tượng đức tin và tìm cách cân bằng nó với vị thế của fae trong thế giới; hoặc để tìm kiếm bất kỳ điểm yếu nào trong quyền lực mới của nhân loại, và tìm cách khai thác nó."

