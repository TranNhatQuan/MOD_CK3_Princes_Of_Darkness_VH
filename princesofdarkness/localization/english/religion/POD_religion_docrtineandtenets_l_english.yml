 special_masterless_ghoul_order_of_st_panteleimon_doctrine_desc: "Cánh tay quan liêu một thời của Giáo Hội Caine vẫn là những kẻ dị giáo theo cách riêng, nhưng giờ đây họ là những kẻ dị giáo của chúng ta."
