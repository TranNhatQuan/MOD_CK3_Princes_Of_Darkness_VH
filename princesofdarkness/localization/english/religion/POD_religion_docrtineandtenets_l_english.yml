 doctrine_haunting_name: "Ám Ảnh"
 doctrine_haunting_evil_name: "Tà Ác"
 doctrine_haunting_evil_desc: "Không thể có hòa bình hay đàm phán với kẻ chết. Chúng ta sẽ tiêu diệt tất cả bọn chúng, hoặc chết khi cố gắng."
 doctrine_haunting_crime_name: "Tội Phạm"
 doctrine_haunting_crime_desc: "Oan hồn phải bị giữ ở phía bên kia của tấm màn.\n\nCủa Những Linh Hồn Kẻ Chết\n\nHãy ghi nhớ kỹ: có một nơi bên kia linh hồn, bên kia sự sống, đó là Bóng Tối, là Bóng Đêm, và nơi đó Bóng Đêm ngự trị. Một hòn đảo, một pháo đài, một vùng đất của Kẻ Chết, ta đã du hành đến đó qua một con đường của diệt vong và ta đã chứng kiến vị vua đáng sợ của Thành Đô Stygian khi hắn ngự triều. Ta đã thấy những kẻ không mặt trùm mũ trùm băng qua Sông Styx. Chúng vây quanh chúng ta như ruồi nhặng trên xác thối rữa, và như chúng ta, chúng nuôi mình bằng nỗi sợ, khoái lạc, và cơn giận. Chúng đã chết, nhưng bất tử, và chúng gần gũi với chúng ta hơn ta từng biết."
 doctrine_haunting_shunned_name: "Bị Xa Lánh"
 doctrine_haunting_shunned_desc: "Oan hồn là những linh hồn tách rời khỏi xác chết của họ. Chúng có thể tìm cách chiếm hữu thân xác ta.\n\nCủa Những Linh Hồn Kẻ Chết\n\nHãy ghi nhớ kỹ: có một nơi bên kia linh hồn, bên kia sự sống, đó là Bóng Tối, là Bóng Đêm, và nơi đó Bóng Đêm ngự trị. Một hòn đảo, một pháo đài, một vùng đất của Kẻ Chết, ta đã du hành đến đó qua một con đường của diệt vong và ta đã chứng kiến vị vua đáng sợ của Thành Đô Stygian khi hắn ngự triều. Ta đã thấy những kẻ không mặt trùm mũ trùm băng qua Sông Styx. Chúng vây quanh chúng ta như ruồi nhặng trên xác thối rữa, và như chúng ta, chúng nuôi mình bằng nỗi sợ, khoái lạc, và cơn giận. Chúng đã chết, nhưng bất tử, và chúng gần gũi với chúng ta hơn ta từng biết."
 doctrine_haunting_accepted_name: "Được Chấp Nhận"
 doctrine_haunting_accepted_desc: "Oan hồn có thể hữu ích. Những kẻ thông thạo nghệ thuật triệu hồi và trói buộc oan hồn có thể dùng chúng cho đủ loại mục đích.\n\nCủa Những Linh Hồn Kẻ Chết\n\nHãy ghi nhớ kỹ: có một nơi bên kia linh hồn, bên kia sự sống, đó là Bóng Tối, là Bóng Đêm, và nơi đó Bóng Đêm ngự trị. Một hòn đảo, một pháo đài, một vùng đất của Kẻ Chết, ta đã du hành đến đó qua một con đường của diệt vong và ta đã chứng kiến vị vua đáng sợ của Thành Đô Stygian khi hắn ngự triều. Ta đã thấy những kẻ không mặt trùm mũ trùm băng qua Sông Styx. Chúng vây quanh chúng ta như ruồi nhặng trên xác thối rữa, và như chúng ta, chúng nuôi mình bằng nỗi sợ, khoái lạc, và cơn giận. Chúng đã chết, nhưng bất tử, và chúng gần gũi với chúng ta hơn ta từng biết."
