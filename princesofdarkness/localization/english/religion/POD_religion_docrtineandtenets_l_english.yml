 #Vampiric Tenets
 tenet_vampiremasquerade_name: "Màn Che"
 tenet_vampiremasquerade_desc: "Sự Câm Lặng của Dòng Máu. Ngươi chớ để lộ bản chất thật của mình cho những kẻ không thuộc về Dòng Máu. Kẻ nào làm vậy sẽ tự từ bỏ quyền thừa hưởng Dòng Máu của mình."

 tenet_vampireprogeny_name: "Hậu Duệ"
 tenet_vampireprogeny_desc: "Ngươi chỉ được [Glossary('Trao Truyền','game_concept_Sire_desc')] cho kẻ khác khi có sự cho phép của bậc Trưởng Lão. Nếu ngươi tạo ra hậu duệ mà không được Trưởng Lão cho phép, cả ngươi và hậu duệ ấy đều sẽ bị hủy diệt."

 tenet_vampiredestruction_name: "Hủy Diệt"
 tenet_vampiredestruction_desc: "Ngươi bị cấm hủy diệt đồng loại của mình. Quyền hủy diệt chỉ thuộc về bậc Trưởng Lão. Chỉ kẻ cao niên nhất trong các ngươi mới được phép kêu gọi Blood Hunt."

 tenet_vampiretouchstone_name: "Điểm Tựa"
 tenet_vampiretouchstone_desc: "Một Huyết Tộc có thể chọn một người phàm làm điểm tựa để giữ lại mối liên kết với nhân tính. Huyết Tộc đó khi ấy sẽ nhận được tín tâm. Có thêm các sự kiện liên quan đến điểm tựa này."

 tenet_vampireremorse_name: "Hối Hận"
 tenet_vampireremorse_desc: "Huyết Tộc suy ngẫm lại hành động của mình và cảm thấy hối tiếc vì hành vi quái dị của bản thân, nhờ đó nhận được tín tâm."

 tenet_vampireblushoflife_name: "Sắc Hồng Sự Sống"
 tenet_vampireblushoflife_desc: "Huyết Tộc có thể giả làm người còn sống. Điều này vừa giúp giữ Màn Che vừa nhắc nhở họ về cảm giác làm người, nhờ đó nhận được tín tâm."

 tenet_vampirenecromanticexperimention_name: "Thực Nghiệm Thuật Gọi Hồn"
 tenet_vampirenecromanticexperimention_desc: "Hãy nhớ kỹ: có một nơi vượt ngoài linh hồn, vượt ngoài sự sống, đó là Bóng Tối, là Bóng, và nơi đó Bóng trú ngụ. Một hòn đảo, một pháo đài, một vùng đất của Kẻ Chết, ta đã đi qua đó bằng con đường của định mệnh và đã chứng kiến vị vua đáng sợ của Thành Đô Stygian ngự trên ngai giữa triều đình. Ta đã thấy những kẻ trùm mũ không mặt băng qua sông Styx. Chúng vây quanh ta như ruồi nhặng trên xác thối rữa, và như chúng ta, chúng ăn nỗi sợ hãi, khoái lạc và cơn giận. Chúng đã chết, nhưng vẫn chưa hoàn toàn chết, và chúng gần với ta hơn ta từng biết. Dòng Máu của Huynh Đệ ta gào lên với ta khi ta ngủ lúc Mặt Trời băng qua bầu trời, ta nghe tiếng anh trai ta, Abel sinh thứ hai, đang gào thét. Hãy nhớ kỹ linh hồn của những kẻ đã chết, biết rằng sức mạnh của chúng không phải của ngươi, hãy lắng nghe lời chúng nói: chúng mang theo trí tuệ. Chớ nghe theo khúc hát của chúng: con đường ấy dẫn đến hư vô.\nHành quyết tạo ra cả cộng hưởng u sầu lẫn tín tâm."

 tenet_vampirenemetamorphopsisexperimention_name: "Thực Nghiệm Thuật Gọi Hồn"
 tenet_vampirenemetamorphopsisexperimention_desc: "Hành quyết tạo ra cả kinh nghiệm nóng nảy lẫn tín tâm."

 tenet_vampireauctoritasritae_name: "Auctoritas Ritae"
 tenet_vampireauctoritasritae_desc: "Một tập hợp mười ba nghi thức được mọi thành viên Sabbat thực hành."

 tenet_vampireamaranth_name: "Amaranth"
 tenet_vampireamaranth_desc: "Thực hành $pod_diablerie$"

 tenet_vampiremonomacy_name: "Monomacy"
 tenet_vampiremonomacy_desc: "Một cuộc đấu tay đôi danh dự kết thúc bằng $pod_diablerie$. Ritus Monomacy được dùng để phân xử các mâu thuẫn giữa mọi thành viên Sabbat."

 tenet_infernalism_name: "Quỷ Giáo"
 tenet_infernalism_desc: "Sự Ma Nhập thông qua các khế ước với quỷ dữ."

 tenet_vampireinquisition_name: "Dị Giáo Thẩm Vấn"
 tenet_vampireinquisition_desc: "Hãy nhớ kỹ Con Cái của Đấng Tối Cao, các Cherub, các Seraph, các Tổng Lãnh Thiên Thần, vì sự đụng chạm của chúng sẽ thiêu đốt ngươi như Ngọn Lửa của Michael. Hãy nhớ kỹ Con Cái của Kẻ Ở Dưới, dòng dõi của Rắn, vì sự đụng chạm của chúng cũng sẽ thiêu đốt ngươi, và lưỡi của chúng sẽ mê hoặc và lừa dối ngươi. Hãy săn lùng và tiêu diệt bọn thờ quỷ ở bất cứ nơi nào ngươi tìm thấy chúng."

 tenet_pleasure_name: "Khoái Lạc"
 tenet_pleasure_desc: "Sự truy cầu khoái lạc theo lối hưởng lạc"
 doctrine_parameter_reveler_from_elysium: "Ngươi nhận được kinh nghiệm [GetTrait('lifestyle_reveler').GetName(GetNullCharacter)] và [GetTrait('lifestyle_reveler').GetName(GetNullCharacter)] từ elysium."

 tenet_cruelty_name: "Tàn Nhẫn"
 tenet_cruelty_desc: "Khoái cảm có được từ việc gây ra đau đớn"

 tenet_quiritare_name: "Quiritare"
 tenet_quiritare_desc: "Chống lại Dã Thú hay cố gắng xoa dịu nó đều là điều bất khả, vậy nên hãy phó mặc hoàn toàn cho nó, thi hành theo ý muốn của nó."

 tenet_legacyoftrinity_name: "Di Sản Tam Vị"
 tenet_legacyoftrinity_desc: "Codex quy định sự vượt trội của ba clan chính: Toreador, Tzimisce và Ventrue. Thành viên các clan khác phải thỉnh cầu các Quaesitori để được [Glossary('Trao Truyền','game_concept_Sire_desc')] hậu duệ; thành viên ba clan chính được phép [Glossary('Trao Truyền','game_concept_Sire_desc')] cho bất kỳ ai họ muốn. Chỉ thành viên ba clan chính mới được phép trao lại lãnh địa cho ma cà rồng khác, và mỗi ma cà rồng trong lãnh địa đó có nghĩa vụ thực thi Codex."

 tenet_legacyofashes_name: "Di Sản Tro Tàn"
 tenet_legacyofashes_desc: "Codex quy định rằng bất kỳ ai giết một thành viên của ba clan chính sẽ bị kêu gọi Blood Hunt."

 tenet_legacyofshadow_name: "Di Sản Bóng Tối"
 tenet_legacyofshadow_desc: "Codex quy định rằng các Cainite không được tiết lộ bản chất thật của mình cho những kẻ không thuộc về Dòng Máu. Kẻ nào làm vậy sẽ tự từ bỏ quyền thừa hưởng Dòng Máu của mình."

 tenet_oaths_name: "Người Giữ Lời Thề"
 tenet_oaths_desc: "Luật lệ của chúng ta là mệnh lệnh của các trưởng lão, và mệnh lệnh của Caine trên tất cả. Lời thề là nền tảng của trật tự phong kiến."
 #A sworn oath is the most sacred bond a lord can make. An oathbreaker lord threatens all society as they degenerate to the Beast."
 #The oathsworn have casus belli to make war upon the forsworn and strip them of their titles."
 tenet_werewolf_oaths_desc: "Một lời thề đã tuyên là mối ràng buộc thiêng liêng nhất mà một người có thể lập nên. Một thủ lĩnh phản thệ chẳng còn danh dự, và đe dọa kéo mọi người vào sự sa đọa của mình."


 tenet_vampirehighclans_name: "Các Clan Thượng Đẳng"
 tenet_vampirehighclans_desc: "Các Clan Thượng Đẳng vượt trội hơn các Clan Hạ Đẳng. Các Clan Hạ Đẳng là những kẻ suy đồi rồi cũng sẽ khuất phục trước Dã Thú. Chúng không xứng đáng để cai trị hay giao du nơi thượng lưu."

 tenet_vampireselectivefeeding_name: "Kén Chọn Con Mồi"
 tenet_vampireselectivefeeding_desc: "Ngươi chớ hút máu của các Moon-Beast, những Kẻ Hoang Dã, kẻ bệnh tật, kẻ điên loạn, hay kẻ say rượu."
 #\n\nThe Moon-Beasts, the one-who-change, they are the Oldest of all, before my father they roamed the lands. Tarry not in the path of them, avoid them, they are set upon us like wolves in the sheepfold. For we are of one kind, and they another. Beware of their sacred ground, walk softly through their wilderness. Their bite is as our bite, their claws are as our claws, tarry not in the path of them, they are of one kind, and we are another.\n\nOf the mad ones, the wild ones, I say, first, drink not of their blood! But watch them, for they are beautiful in their wilderness, they are enchanting in their mystery, they are deadly in their war skills. Alone among the creatures of the night, they kept me company in the earth and brought me water when I was thirsty and could still breathe. Like Me, they were cast out, Like My Children, they are homeless, Like My Children's Children, they wander, Like my Mother and Father, they know too much, but they keep their own counsel, and, of them, I say mark me well, keep silent! Say nothing. Watch, and learn."
 #doctrine_parameter_vampireselectivefeeding: ""
 doctrine_parameter_vampireselectivefeeding: ""

 tenet_enkrateia_reie_sophrosyne_name: "Enkrateia Reie Sophrosyne"
 tenet_enkrateia_reie_sophrosyne_desc: "Một lối tiếp cận trí tuệ đối với kiếp bất tử, Con Đường này tập trung vào ba khái niệm nền tảng được xem là những đặc tính thiết yếu tìm kiếm ở hậu duệ Brujah tiềm năng trong những đêm tối của Carthage: enkrateia, reie, và sophrosyne. Enkrateia chỉ sức mạnh nội tâm. Reie chỉ lòng can đảm đạo đức. Sophrosyne nghĩa là sự tự chủ và đại diện cho mục tiêu lý tưởng của mọi Triết Gia: làm chủ cơn thịnh nộ Brujah."
 #It is not enough for the Philosopher to passively accept the frustrations that come her way, as the Path of Humanity requires. Instead, she must hone her reason into a sword and her will into a shield against the forces that would cause her to degenerate.\n\nSophrosyne means control of the self and represents the idealized goal of all Philosophers: mastery over the Brujah rage. It also means that the Brujah has committed to an eternity of mental, spiritual, and physical development. Philosophers develop sophrosyne by working to improve Physical and Mental Attributes and Abilities, rather than focusing on [Glossary('Disciplines','game_concept_discipline_desc')] or Social traits."

 #\n\nIn practical terms, this means that Philosophers usually have high Willpower and Self-Control ratings or else aggressively pursue those traits.\n\nReie refers to moral courage. The Philosopher must not shirk her responsibility to pursue either enlightenment or moral character out of fear of frenzy or other degradations. Instead, she must confront difficult situations with reason and self-$pod_discipline$, eschewing the impetuosity that defines the modern Brujah."

 tenet_cold_mind_name: "Tâm Trí Lạnh Lẽo"
 tenet_cold_mind_desc: "Tâm Trí Lạnh Lẽo là một trạng thái tư duy thiết yếu đối với Ảnh Ca. Về căn bản, nó mô tả một cách tiếp cận vô cảm, hoàn toàn bình thản và tự chủ trước thế giới xung quanh, nhưng phần lớn ý nghĩa của nó được che phủ trong những câu đố và Công Án, nên ý nghĩa trọn vẹn của Tâm Trí Lạnh Lẽo chỉ có thể hiểu rõ nhất khi đặt trong ngữ cảnh."

 tenet_intellectual_detachement_name: "Sự Tách Biệt Trí Tuệ"
 tenet_intellectual_detachement_desc: "Các Học Giả không sợ cái chết; trái lại, họ bị nó mê hoặc. Họ xem nó như một sức mạnh to lớn cần được nghiên cứu, mổ xẻ, và lý giải để họ có thể hiểu rõ hơn về chính sự tồn tại của mình."

 tenet_pact_of_athens_name: "Hiệp Ước Athens"
 tenet_pact_of_athens_desc: "Khoảng năm 1270 TCN, một hội nghị gồm các Kẻ Hoang Đàng thời kỳ đầu, phần lớn là Brujah, Ventrue, Toreador, và Salubri, đã họp tại thành Athens, vì nhiều ma cà rồng tham dự xem đó là nơi khai sinh chính thức của Con Đường này. Hiệp Ước Athens đóng vai trò như một chuẩn mực chính thức cho các trào lưu khác biệt trong xã hội ma cà rồng nhằm ngăn Dã Thú và giữ gìn Nhân Tính."

 tenet_judgement_name: "Phán Xét"
 tenet_judgement_desc: "Đối với các Vệ Binh, một trong những giáo lý chính của con đường này là các tín đồ phải thanh trừng mọi kẻ không xứng đáng với dòng máu của Caine và thanh lọc các huyết thống; kẻ nào thể hiện bản chất đen tối, thiếu danh dự trước một tín đồ của Haqim có thể sẽ phải chịu một hồi chuông cảnh tỉnh cay đắng. Các khái niệm danh dự, kỷ luật, và tự chủ cũng quan trọng không kém đối với các Vệ Binh. Hành động hấp tấp là một dấu nhục; để Dã Thú của mình giành quyền kiểm soát đơn giản là một tội đáng nguyền rủa."

 tenet_conviction_and_instinct_name: "Xác Tín và Bản Năng"
 tenet_conviction_and_instinct_desc: "Không mất tín tâm khi làm bị thương nặng hay giết nạn nhân phàm nhân. Ma cà rồng không mất tín tâm khi phát cuồng."
 tenet_conviction_and_selfcontrol_name: "Xác Tín và Tự Chủ"
 tenet_conviction_and_selfcontrol_desc: "Không mất tín tâm khi làm bị thương nặng hay giết nạn nhân phàm nhân. Ma cà rồng mất tín tâm khi phát cuồng."
 tenet_conscience_and_selfcontrol_name: "Lương Tâm và Tự Chủ"
 tenet_conscience_and_selfcontrol_desc: "Mất tín tâm khi làm bị thương nặng hay giết nạn nhân phàm nhân. Mất tín tâm khi phát cuồng."
