 changeling_rebirth_doctrine_desc: "Khi phần con người của một changeling chết đi (Cái Chết Trần Tục), bản ngã fae có thể vẫn tồn tại, nhưng changeling đó sẽ không bao giờ tái sinh nữa. Thường dân được tái sinh vào một vật chủ con người khác có ngoại hình và sự nuôi dưỡng khác với người phàm trước đó."

