 doctrine_demonic_name: "Ma Quỷ"
 doctrine_demonic_evil_name: "Tà Ác"
 doctrine_demonic_evil_desc: "Không thể có hòa bình hay đàm phán với lũ ác quỷ sinh ra từ địa ngục. Chúng ta sẽ tiêu diệt tất cả bọn chúng, hoặc chết khi cố gắng."
 doctrine_demonic_crime_name: "Tội Phạm"
 doctrine_demonic_crime_desc: "Lũ quỷ dữ có ý định mang địa ngục xuống trần gian. Chớ mặc cả với Bóng Tối: theo thời gian nó sẽ cuốn lấy tất cả chúng ta. Hãy đề phòng Con Cái của Đấng Bên Dưới, Dòng Dõi của Rắn, vì sự đụng chạm của chúng cũng sẽ thiêu đốt ngươi, và lưỡi của chúng sẽ lừa gạt và đánh lừa ngươi. Hãy săn lùng và tiêu diệt những kẻ theo tà giáo ở bất cứ nơi nào ngươi tìm thấy chúng."
 doctrine_demonic_shunned_name: "Bị Xa Lánh"
 doctrine_demonic_shunned_desc: "Những kẻ giao kèo với quỷ dữ tự gieo mầm diệt vong cho chính mình. Chớ mặc cả với Bóng Tối: theo thời gian nó sẽ cuốn lấy tất cả chúng ta. Hãy đề phòng Con Cái của Đấng Bên Dưới, Dòng Dõi của Rắn, vì sự đụng chạm của chúng cũng sẽ thiêu đốt ngươi, và lưỡi của chúng sẽ lừa gạt và đánh lừa ngươi. Hãy săn lùng và tiêu diệt những kẻ theo tà giáo ở bất cứ nơi nào ngươi tìm thấy chúng."
 doctrine_demonic_accepted_name: "Được Chấp Nhận"
 doctrine_demonic_accepted_desc: "Đầu tư vào địa ngục là con đường dẫn đến quyền năng thực sự!"
 doctrine_parameter_demonic_illegal: "Nhân vật có [GetTrait('demon').GetName( GetPlayer )], [GetTrait('baali').GetName( GetPlayer )], [GetTrait('witch').GetName( GetPlayer )], [GetTrait('spectre').GetName( GetPlayer )] hoặc [GetTrait('fomori').GetName( GetPlayer )] [traits|E] là [criminals|E]"
