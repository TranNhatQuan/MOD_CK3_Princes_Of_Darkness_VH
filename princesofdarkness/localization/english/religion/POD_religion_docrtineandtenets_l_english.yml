 doctrine_vampirefrenzy_shunned_name: "Bị Xa Lánh"
 doctrine_vampirefrenzy_shunned_desc: "Mọi Kindred đều đấu tranh chống lại những đòi hỏi của Dã Thú, chớ khuất phục nó dễ dàng. Hãy nhớ những câu tục ngữ. Hãy cưỡi lên Dã Thú, đừng để nó cưỡi lên ngươi."
