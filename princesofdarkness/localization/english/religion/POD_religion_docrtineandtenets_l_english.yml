 doctrine_fera_bastet_pact_name: "Hiệp Ước Bastet"
 doctrine_fera_bastet_pact_desc: "Vì lý do này hay lý do khác, tín đồ của đức tin này đã tạo dựng mối liên kết chặt chẽ với [GetTrait('bastet').GetName( GetPlayer )]. Bản tính tò mò của người mèo đã mang lại cho họ nhiều người bạn bất ngờ... dù một số hóa ra hoàn toàn không đáng tin cậy."
 doctrine_parameter_hostility_override_doctrine_fera_bastet_pact: "[faiths|E] có [GetFaithDoctrine('doctrine_fera_bastet_pact').GetBaseName] được coi là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"


 doctrine_fera_mokole_pact_name: "Hiệp Ước Mokolé"
 doctrine_fera_mokole_pact_desc: "Vì lý do này hay lý do khác, tín đồ của đức tin này đã tạo dựng mối liên kết chặt chẽ với [GetTrait('mokole').GetName( GetNullCharacter )]. Người cá sấu là một nhóm kiên trì, với Mnesis của mình, họ ghi nhớ bạn bè rất rõ, và kẻ thù thì còn rõ hơn."
 doctrine_parameter_hostility_override_doctrine_fera_mokole_pact: "[faiths|E] có [GetFaithDoctrine('doctrine_fera_mokole_pact').GetBaseName] được coi là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"


 doctrine_fera_wyrm_pact_name: "Hiệp Ước Wyrm"
 doctrine_fera_wyrm_pact_desc: "Vì lý do nào đó, tín đồ của đức tin này phần nào khoan dung với các tín đồ của $glossary_wyrm$. Liệu điều ngược lại có đúng hay không còn tùy vào ý muốn của kẻ khác. Xét cho cùng, không gian để nhảy múa trong vòng xoáy cũng có hạn."
 doctrine_parameter_hostility_override_doctrine_fera_wyrm_pact: "[faiths|E] có [GetFaithDoctrine('doctrine_fera_wyrm_pact').GetBaseName] được coi là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"


 doctrine_fera_alliance_group_name: "Liên Minh Fera"

 doctrine_fera_beast_courts_name: "Thú Triều"
 doctrine_fera_beast_courts_desc: "Trong số $glossary_fera$, liên minh giữa các chủng loài rất hiếm gặp. Ngoại lệ đáng chú ý nhất là Thú Triều, thề bảo vệ Mẹ Ngọc Bích (Gaia). Bên trong Triều đình là một xã hội tương tự các nền văn hóa đế quốc của châu Á thần thoại, đầy đủ nhiếp chính, triều thần, và thường dân. Bất kỳ hengeyokai ($glossary_fera$) nào cũng được tự do gia nhập Thú Triều, miễn là họ thề tuân theo một hệ thống danh dự và danh vọng chung được gọi là Đạo Ngọc Bích."
