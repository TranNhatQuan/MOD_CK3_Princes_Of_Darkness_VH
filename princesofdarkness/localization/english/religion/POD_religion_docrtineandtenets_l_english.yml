 doctrine_glamour_name: "Glamour"
 doctrine_glamour_evil_name: "Tà Ác"
 doctrine_glamour_evil_desc: "Không thể có hòa bình hay đàm phán với lũ mê tín cổ hủ. Chúng ta sẽ tiêu diệt tất cả bọn chúng, hoặc chết khi cố gắng."
 doctrine_glamour_crime_name: "Tội Phạm"
 doctrine_glamour_crime_desc: "Fae phải bị tiêu diệt."
 doctrine_glamour_shunned_name: "Bị Xa Lánh"
 doctrine_glamour_shunned_desc: "Dù siêu nhiên như chúng ta, Fae không giống chúng ta. Không hề giống chút nào.\n\nCủa Những Kẻ Hoang Dại\n\nVề những kẻ điên loạn, những kẻ hoang dại, ta nói rằng, trước hết, chớ uống máu của chúng! Nhưng hãy quan sát chúng, vì chúng đẹp đẽ trong sự hoang dã của mình, chúng mê hoặc trong sự bí ẩn của mình, chúng chết chóc trong tài nghệ chiến đấu của mình. Một mình trong số các sinh vật của màn đêm, chúng đã ở bên ta dưới lòng đất và mang nước đến cho ta khi ta khát và còn có thể thở. Như Ta, chúng bị ruồng bỏ, Như Con Cái Ta, chúng không nhà không cửa, Như Con Cháu của Con Cái Ta, chúng lang thang, Như Mẹ Cha Ta, chúng biết quá nhiều, nhưng chúng giữ kín ý riêng của mình, và, về chúng, ta nói hãy ghi nhớ kỹ, hãy im lặng! Đừng nói gì cả. Hãy quan sát, và học hỏi."
 doctrine_glamour_accepted_name: "Được Chấp Nhận"
 doctrine_glamour_accepted_desc: "Fae được chấp nhận.\n\nCủa Những Kẻ Hoang Dại\n\nVề những kẻ điên loạn, những kẻ hoang dại, ta nói rằng, trước hết, chớ uống máu của chúng! Nhưng hãy quan sát chúng, vì chúng đẹp đẽ trong sự hoang dã của mình, chúng mê hoặc trong sự bí ẩn của mình, chúng chết chóc trong tài nghệ chiến đấu của mình. Một mình trong số các sinh vật của màn đêm, chúng đã ở bên ta dưới lòng đất và mang nước đến cho ta khi ta khát và còn có thể thở. Như Ta, chúng bị ruồng bỏ, Như Con Cái Ta, chúng không nhà không cửa, Như Con Cháu của Con Cái Ta, chúng lang thang, Như Mẹ Cha Ta, chúng biết quá nhiều, nhưng chúng giữ kín ý riêng của mình, và, về chúng, ta nói hãy ghi nhớ kỹ, hãy im lặng! Đừng nói gì cả. Hãy quan sát, và học hỏi."
