 doctrine_magicraft_crime_name: "Tội Phạm"
 doctrine_magicraft_crime_desc: "Các Pháp sư phải bị tiêu diệt.\n\nCủa Những Kẻ Được Khai Sáng\n\nMẫu Thân của Quyền Năng, Lilith hắc ám, là kẻ vĩ đại nhất trong bọn họ, nhưng còn có những kẻ khác, và sẽ còn nhiều kẻ nữa đến sau. Chớ uống máu của chúng, vì chúng sẽ giăng bẫy ngươi, hãy cảnh giác với chúng, chúng xảo quyệt lắm. Chúng nắm tri thức của Adam, và trí tuệ của Eva, chúng là kẻ mang lửa đến, kẻ cày xới đất đai, kẻ chăn nuôi thú vật, kẻ mang chữ viết đến, chúng là những Đứa Con của Mặt Trời, những Vì Sao Đang Lên. Chúng sẽ tìm cách lôi kéo ngươi vào hành trình của chúng, Hãy Kháng Cự! Hãy Kháng Cự! Con đường của chúng chẳng đoái hoài đến đói khát, máu huyết, hay thân xác. Chớ tin những kẻ có đôi mắt sáng ngời hướng về bình minh. Hãy luôn nhớ, chính Bình Minh mang đến cái chết cho ngươi."
 doctrine_magicraft_shunned_name: "Bị Xa Lánh"
 doctrine_magicraft_shunned_desc: "Dù siêu nhiên như chúng ta, các pháp sư không giống chúng ta. Không hề giống chút nào.\n\nCủa Những Kẻ Được Khai Sáng\n\nMẫu Thân của Quyền Năng, Lilith hắc ám, là kẻ vĩ đại nhất trong bọn họ, nhưng còn có những kẻ khác, và sẽ còn nhiều kẻ nữa đến sau. Chớ uống máu của chúng, vì chúng sẽ giăng bẫy ngươi, hãy cảnh giác với chúng, chúng xảo quyệt lắm. Chúng nắm tri thức của Adam, và trí tuệ của Eva, chúng là kẻ mang lửa đến, kẻ cày xới đất đai, kẻ chăn nuôi thú vật, kẻ mang chữ viết đến, chúng là những Đứa Con của Mặt Trời, những Vì Sao Đang Lên. Chúng sẽ tìm cách lôi kéo ngươi vào hành trình của chúng, Hãy Kháng Cự! Hãy Kháng Cự! Con đường của chúng chẳng đoái hoài đến đói khát, máu huyết, hay thân xác. Chớ tin những kẻ có đôi mắt sáng ngời hướng về bình minh. Hãy luôn nhớ, chính Bình Minh mang đến cái chết cho ngươi."
 doctrine_magicraft_accepted_name: "Được Chấp Nhận"
