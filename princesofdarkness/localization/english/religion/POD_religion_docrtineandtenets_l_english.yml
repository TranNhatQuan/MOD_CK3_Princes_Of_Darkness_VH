 tenet_oath_truce_name: "Hiệp Ước Đình Chiến"
 tenet_oath_truce_desc: "'Người Mang Đình Chiến' là thuật ngữ chỉ những fae tìm cách chấm dứt Chiến tranh Mùa, hoặc bằng cách kéo dài Hiệp ước Đình chiến vô thời hạn, hoặc bằng cách rèn nên một hiệp ước mới, lâu bền để chấm dứt hận thù giữa các Triều đình."

 tenet_summer_traditions_name: "Truyền Thống Mùa Hạ"
 tenet_summer_traditions_desc: "Fae Triều đình Mùa Hạ xem trọng trách nhiệm của lãnh chúa đối với chư hầu của mình một cách vô cùng nghiêm túc. Quản lý hệ thống chư hầu một cách công minh sẽ đem lại chư hầu hài lòng. Chư hầu hài lòng nghĩa là một lãnh chúa thành công."
