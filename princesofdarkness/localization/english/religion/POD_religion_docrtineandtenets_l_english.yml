 special_doctrine_fae_militants_hostility_desc: "Phe Hiếu Chiến muốn vứt bỏ Hiệp ước Đình chiến và nối lại Chiến tranh Mùa"
 special_doctrine_fae_trucebearers_hostility_name: "Phe Người Mang Đình Chiến"
 special_doctrine_fae_trucebearers_hostility_desc: "Người Mang Đình Chiến hy vọng giữ vững Hiệp ước Đình chiến và để các Triều đình Mùa cai trị luân phiên."
 special_doctrine_fae_humanists_hostility_name: "Phe Nhân Đạo"
 special_doctrine_fae_humanists_hostility_desc: "Phe Nhân Đạo bị ám ảnh bởi nhân loại, hoặc là để yêu thương hoặc để kiểm soát họ."
 special_doctrine_fae_constantinians_hostility_name: "Phe Constantinian"
 special_doctrine_fae_constantinians_hostility_desc: "Kinh sợ trước quyền lực đang lớn mạnh của Giáo hội, Constantinian tìm cách tạo cho mình một chỗ đứng bên trong nó."
 special_doctrine_fae_undecided_hostility_name: "Phe Chưa Quyết Định"
 special_doctrine_fae_undecided_hostility_desc: "Còn mơ hồ về việc nối lại Chiến tranh Mùa, phe chưa quyết định vẫn chưa chọn được con đường trong việc khôi phục cuộc xung đột giữa các Triều đình Fae."
