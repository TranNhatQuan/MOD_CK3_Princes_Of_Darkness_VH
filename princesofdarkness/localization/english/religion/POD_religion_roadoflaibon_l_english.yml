 #Laibon-Group Faiths
 laibon: "Laibon"
 laibon_adj: "Laibon"
 laibon_adherent: "Laibon"
 laibon_adherent_plural: "Laibon"
 laibon_desc: "Laibon không phải một chủng tộc siêu nhiên riêng biệt, nhưng Laibon lại khác biệt khá nhiều so với Huyết Tộc 'thông thường' theo nhiều cách. Họ cho rằng nguồn gốc của mình bắt nguồn từ các vị thần và truyền thuyết châu Phi, khác hẳn phiên bản Nod của Huyết Tộc."


