 ghostcourtiers: "U Hồn Cận Thần"
 ghostcourtiers_desc: "Sự Giác Ngộ của Huyết Tộc bản địa vùng Nusantara Đông Nam Á, U Hồn Cận Thần gắn bó mật thiết với Thuật Gọi Hồn và việc giao tiếp với người chết."
 ghostcourtiers_adj: "U Hồn Cận Thần"
 ghostcourtiers_adherent: "U Hồn Cận Thần"
 ghostcourtiers_adherent_plural: "U Hồn Cận Thần"

 lordlycourtiers: "Quân Tử Cận Thần"
 lordlycourtiers_desc: "Sự Giác Ngộ của Huyết Tộc bản địa bán đảo Triều Tiên, Quân Tử Cận Thần tự ràng buộc mình vào những quy tắc hành xử và tiết chế nghiêm ngặt dưới lý tưởng đức hạnh quân tử."
 lordlycourtiers_adj: "Quân Tử Cận Thần"
