 roadofunexaminedhorizons_religion_desc: "Là Con Cái của Caine phục tùng Bách Quỷ, những Chi Hệ Thất Lạc này bước đi trên ranh giới giữa các Con Đường và [Glossary('Pháp Môn','podgloss.dharma')]."

 corpsecourtiers: "Tử Thi Cận Thần"
 corpsecourtiers_desc: "Số ít Huyết Tộc được khai tâm theo các con đường và sự Giác Ngộ của Thiên Quỷ, những Huyết Tộc này bước đi trên lằn ranh mong manh giữa phục tùng và 'Giác Ngộ'."
 corpsecourtiers_adj: "Tử Thi Cận Thần"
 corpsecourtiers_adherent: "Tử Thi Cận Thần"
