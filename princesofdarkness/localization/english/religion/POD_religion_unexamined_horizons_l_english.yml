 dreamcourtiers: "Mộng Cảnh Cận Thần"
 dreamcourtiers_desc: "Sự Giác Ngộ của Huyết Tộc bản địa Nhật Bản duy nhất hợp tác và lắng nghe Wan Kuei, Mộng Cảnh Cận Thần đối mặt trực diện với những dằn vặt nội tâm, tìm cách làm chủ ác mộng và hoài nghi của chính mình."
 dreamcourtiers_adj: "Mộng Cảnh Cận Thần"
