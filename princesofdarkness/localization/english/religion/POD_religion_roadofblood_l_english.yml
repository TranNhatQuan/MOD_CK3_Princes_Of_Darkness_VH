 #Sentinel-Group Faiths
 tariqelhaqim: "Tariq el-Haqim"
 tariqelhaqim_adj: "Banu Haqim"
 tariqelhaqim_adherent: "Vệ Binh"
 tariqelhaqim_adherent_plural: "Các Vệ Binh"
 tariqelhaqim_desc: "Những kẻ theo Via Sanguinus nằm trong số những kẻ nguy hiểm nhất đối với đồng bào $pod_cainites$ của chúng, vì hành động $pod_diablerie$ gần như là một nghi thức thanh tẩy giữa các Vệ Binh. Quả thật, một trong những nguyên lý chính của con đường này là để những kẻ theo nó thanh trừng tất cả những ai không xứng đáng với dòng máu của Caine và thanh lọc các huyết thống."

 pathofrighteousness: "Con Đường Chính Nghĩa"
 pathofrighteousness_adj: "Chính Nghĩa"
 pathofrighteousness_adherent: "Người Canh Giữ"
 pathofrighteousness_adherent_plural: "Các Người Canh Giữ"
 pathofrighteousness_desc: "Là những Người Canh Giữ của các Người Canh Giữ, tín đồ của con đường này quan tâm đến việc bài trừ sự tha hóa và thiếu quyết tâm giữa các tín đồ của Con Đường Máu."

 holy_order_sentinnels_of_haqim: "Vệ Binh của Haqim"
 holy_order_knives: "Những Lưỡi Dao Trong Bóng Tối"
 holy_order_judges: "Các Quan Tòa"
 holy_order_alamut: "Chiến Binh của Alamut"

 sisterhoodoferinyes: "Hội Chị Em Erinyes"
 sisterhoodoferinyes_adj: "Chị Em"
 sisterhoodoferinyes_adherent: "Chị Em"
 sisterhoodoferinyes_adherent_plural: "Các Chị Em"
 sisterhoodoferinyes_desc: "Hội Chị Em đã tồn tại dưới hình thức này hay hình thức khác từ những đêm tối của Hy Lạp cổ đại, khi một vizir trao dòng máu cho ba chị em được đồn đại là có năng lực tiên tri.\nTận tụy giữ vững quan điểm của Haqim về công lý, các Chị Em thường bị Alamut do nam giới thống trị ruồng bỏ nhưng luôn giữ mình đường hoàng trước công chúng và với niềm tự hào trong các sảnh đường của Banu Haqim."




