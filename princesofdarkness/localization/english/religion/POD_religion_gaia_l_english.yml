 #Common Bastet Localization
 karoush_high_god_name_alternate: "Nala"
 karoush_high_god_name_alternate_possessive: "của Nala"
 karoush_devil_name: "[Glossary('Cahlash', 'glossary_wyrm_tt')]"
 karoush_devil_name_possessive: "của [Glossary('Cahlash', 'glossary_wyrm_tt')]"
 karoush_death_deity_name: "[Glossary('Cahlash', 'glossary_wyrm_tt')]"
 karoush_death_deity_name_possessive: "của [Glossary('Cahlash', 'glossary_wyrm_tt')]"
 

 feline_religion: "@bastet_icon! Feline"
 feline_religion_adj: "Feline"
 feline_religion_adherent: "Feline"
 feline_religion_adherent_plural: "Felines"
 feline_religion_desc: "Bastet là những người mèo bị ám ảnh với tri thức bí mật và luôn theo đuổi cùng tích trữ nó. Nhiều người trong số họ là những pháp sư vĩ đại, những người khác là những chiến binh vĩ đại, nhưng họ hiếm khi là động vật sống theo bầy đàn và thường hoạt động đơn độc. Bastet được Luna tạo ra (người mà họ gọi là Seline). Thay vì được giao một mục đích cụ thể, mỗi bộ tộc cố gắng lấp đầy một khoảng trống mà những bộ tộc khác chưa hoàn toàn nắm bắt được."


 bagheera: "Bagheera"
 bagheera_adj: "Bagheera"
 bagheera_adherent: "Bagheera"
 bagheera_adherent_plural: "Bagheera"
 bagheera_desc: "Con cái của Saraam và được xem là những Đao Phủ của Kali, Bagheera là những Bastet có thể mang hình dạng báo đen. Bagheera cho rằng khi Gaia tạo ra Bastet, bà hy vọng Bagheera sẽ là những người ban hành luật lệ cho loài mèo. Vai trò này chưa bao giờ hoàn toàn thành hiện thực, nhưng dấu vết ý định của Gaia vẫn còn sót lại, khiến họ tràn đầy ý thức công lý sắc bén và tinh thần phẫn nộ chính nghĩa đáng sợ khi chứng kiến."  
 
 bubasti: "Bubasti"
 bubasti_adj: "Bubasti"
 bubasti_adherent: "Bubasti"
 bubasti_adherent_plural: "Bubasti"
 bubasti_desc: "Còn được gọi là Shadowcats, họ là những người mèo của Ai Cập. Là những nhà huyền học của loài mèo, họ là một chủng tộc nhút nhát và bí mật. Bubasti bị vị thần ma cà rồng cổ xưa Set nguyền rủa từ lâu, và kết quả là cuộc sống của họ mãi mãi gắn liền với đất đai Khem, quê hương tổ tiên của họ. Người ta nói rằng nếu tất cả Bubasti của một thế hệ nhất định rời khỏi Ai Cập, thế hệ đó sẽ là thế hệ cuối cùng. Không ai biết sự thật của tin đồn này, nhưng cũng chẳng ai muốn thử.\nDo cuộc chiến của họ với Set, họ liên kết chặt chẽ với $glossary_osirian_league$ của Horus và sáu thủ lĩnh của họ, Kheper, đã đạt được sự bất tử." 
 
 ceilican: "Ceilican"
 ceilican_adj: "Ceilican"
 ceilican_adherent: "Ceilican"
 ceilican_adherent_plural: "Ceilicans"
 ceilican_desc: "Còn được gọi là Ring Dancers, họ bắt nguồn từ bắc Âu, và có mối liên hệ chặt chẽ với tiên tộc nhưng bản thân không phải là tiên. Ceilican có thể truy nguyên tổ tiên của mình về những con sư tử không bờm ở bắc Âu và được xem là anh em họ với Simba (dù mọi Simba sẽ phẫn nộ khi bị so sánh với một Ring Dancer). Trong nỗi kinh hoàng của Cuộc Chiến Phẫn Nộ đã hủy diệt thân tộc của họ, những Ceilican còn sống sót đã thề trung thành với một lãnh chúa của xứ Tiên, kẻ đã sớm nô dịch họ và lây nhiễm cho họ tính khí thất thường của mình cùng cả điểm yếu trước sắt nguội."
 
 khan_adj: "Khan"
 khan_adherent: "Khan"
 khan_adherent_plural: "Khans"
 khan_desc: "Khan, còn được gọi là Bright Kings, là những người hổ, và là một trong chín bộ tộc còn sót lại của Bastet. Họ tự xem mình là thành lũy chống lại bóng tối, những kẻ là tạo vật hoàn hảo nhất của Gaia và vì vậy có nghĩa vụ bảo vệ mọi kẻ kém cỏi hơn. Dù thường độc lập và không hòa đồng như bất kỳ người mèo nào, nhiều Khan liên minh với Thú Triều.\nMột dân tộc đầy danh dự, Khan gợi lên sự tôn trọng mà loài sư tử đòi hỏi."
 
 simba: "Simba"
 simba_adj: "Simba"
 simba_adherent: "Simba"
 simba_adherent_plural: "Simbas"
 simba_desc: "Simba là những người sư tử. Họ còn được gọi là Lords of Sunlights hay Dark Kings. Simba đại diện cho những gì tốt đẹp nhất Gaia có thể ban tặng, ở chỗ họ oai vệ, kiêu hãnh, và mạnh mẽ vô song. Tuy nhiên, họ cũng kiêu ngạo, độc đoán, và ác độc, ngay cả trong hoàn cảnh tốt đẹp nhất.\nHọ tin rằng mọi thứ đơn giản là mất trật tự. Khi sự cân bằng được khôi phục, khi loài người biết vị trí của mình, và khi các thành phố trở thành nghĩa địa, loài sư tử sẽ được chứng minh là đúng. Trong tâm trí của Simba, những con quỷ của thời kỳ đen tối có thể bắt nguồn từ sự kết thúc của Impergium và sự lơi lỏng của các Chủng Biến Hình. Và họ có ý định đưa mọi thứ vào đúng trật tự: nếu điều đó đòi hỏi đổ máu, thì cứ để nó xảy ra. Chiến tranh là môn thể thao của các vị vua." 

 swara: "Swara"
 swara_adj: "Swara"
 swara_adherent: "Swara"
 swara_adherent_plural: "Swara"
 swara_desc: "Những người báo của các bộ tộc Bastet còn được gọi là Silver Folk. Giống như thân tộc của mình, họ cực kỳ nhanh nhẹn và di chuyển nhiều. Họ cũng có mối liên hệ độc đáo với [umbra|E]. Trong tất cả các bộ tộc Bastet, Swara là bộ tộc ít được hiểu rõ nhất. Đây là kết quả của nền văn hóa rất biệt lập của họ. Swara là chi hệ Bastet duy nhất có khả năng bước sang một bên, cho phép họ du hành đến những cõi trong [umbra|E] mà đồng loại của họ không thể tiếp cận. Một số suy đoán rằng đây là kết quả của mối quan hệ mạnh mẽ của họ với Luna, người mà hầu hết Swara tôn kính. Một số truyền thuyết cho rằng chính một Swara là kẻ đầu tiên viếng thăm mặt trăng vào thời Impergium, và chính điều đó đã dạy cho họ ý nghĩa và tầm quan trọng của cuộc chiến chống lại $glossary_wyrm$ và tình thế nghiêm trọng đến mức nào." 






