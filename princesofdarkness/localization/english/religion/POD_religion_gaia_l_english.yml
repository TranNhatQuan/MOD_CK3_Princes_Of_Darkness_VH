 #################
 #### Spirits ####
 #################

 gaia_religion: "@spirit_icon! Gaian"
 gaia_religion_adj: "Gaian"
 gaia_religion_adherent: "Gaian"
 gaia_religion_adherent_plural: "Gaians"
 gaia_religion_desc: "Gaia vĩ đại hơn cả một Celestine, và là một trong những linh hồn quyền năng nhất từng tồn tại - có lẽ là linh hồn đầu tiên, và mạnh mẽ nhất. Bà được cho là đã tạo ra Garou và phần lớn $glossary_fera$ để phụng sự làm chiến binh và tay sai của mình, cả trong thế giới vật chất lẫn [spirit_worlds|E]."

 
 velvet_brood: "Velvet Brood"
 velvet_brood_adj: "Velvet"
 velvet_brood_adherent: "Linh Thể"
 velvet_brood_adherent_plural: "Linh Thể"
 velvet_brood_desc: "Các linh hồn, ít nhất là những linh hồn có tri giác, là những sinh vật ưa giao tiếp xã hội. Chúng tương tác, tổ chức và lập kế hoạch. Chúng có bạn bè, hoặc ít nhất cũng có những kẻ được ưu ái hơn. Chúng ôm giữ mối hiềm khích và thù hận. Mỗi linh hồn là một cá thể riêng biệt, dù chúng có bị ràng buộc vào những khía cạnh nhất định gắn liền với bản chất của mình. Trong cõi Umbra, không ai sống trong chân không."


 ####################
 #### Werewolves ####
 ####################

 blackfury_religion: "@werewolf_icon! Black Furies"
 blackfury_religion_adj: "Black Furies"
 blackfury_religion_adherent: "Fury"
 blackfury_religion_adherent_plural: "Furies"
 blackfury_religion_desc: "Các nữ tộc trưởng của Garou gần gũi với $glossary_wyld$ hơn hầu hết các bộ tộc khác, và nổi tiếng với danh dự, sự khôn ngoan, lòng kiêu hãnh, cùng kỹ năng chiến đấu dữ dội.\nCác Fury tôn thờ Wyld như một sức mạnh của nữ tính, của bản năng thay vì những trừu tượng trí tuệ của $glossary_weaver$ (và bị Bộ tộc xem là nam tính). Wyld là sức mạnh giữ cho các chu kỳ của Gaia và Luna vận hành và bổ khuyết cho chúng."

 blackfury: "Black Furies"
 blackfury_adj: "Black Furies"
 blackfury_adherent: "Fury"
 blackfury_adherent_plural: "Furies"
 blackfury_desc: "Các nữ tộc trưởng của Garou gần gũi với $glossary_wyld$ hơn hầu hết các bộ tộc khác, và nổi tiếng với danh dự, sự khôn ngoan, lòng kiêu hãnh, cùng kỹ năng chiến đấu dữ dội.\nCác Fury tôn thờ Wyld như một sức mạnh của nữ tính, của bản năng thay vì những trừu tượng trí tuệ của $glossary_weaver$ (và bị Bộ tộc xem là nam tính). Wyld là sức mạnh giữ cho các chu kỳ của Gaia và Luna vận hành và bổ khuyết cho chúng."

 amazonsofdiana: "Amazons of Diana"
 amazonsofdiana_adj: "Amazons of Diana"
 amazonsofdiana_adherent: "Amazons"
 amazonsofdiana_adherent_plural: "Amazons"
 amazonsofdiana_desc: "Một nhóm Black Furies quan tâm nhiều hơn đến việc trở thành những nữ chiến binh táo bạo, bất khả cản, hơn là những kẻ báo thù thiêng liêng. Trại này hiếm khi được xem là một nhóm chính thức, mà giống một danh xưng chung cho những ai quyết tâm chứng minh mình ngang hàng với bất kỳ người đàn ông nào trong chiến đấu chống lại $glossary_wyrm$. Một số trong trại xem việc đưa các Fury bước vào tương lai, rời xa tập tục vô ích và cổ hủ của việc truy đuổi tội phạm, là điều cần thiết, nhưng những Garou đơn thuần căm ghét mọi đàn ông cũng có xu hướng tụ về Amazons."

 avengingmother: "Avenging Mother"
 avengingmother_adj: "Avenging Mother"
 avengingmother_adherent: "Avenger"
 avengingmother_adherent_plural: "Avengers"
 avengingmother_desc: "Một nhóm nhỏ rất hiếm của Black Furies, hoạt động nhằm lật đổ các cấu trúc gia trưởng của Quốc gia Garou và các Bộ tộc như Silver Fangs bằng cách lợi dụng lòng tin của họ."

 bacchantes: "Bacchantes"
 bacchantes_adj: "Bacchantes"
 bacchantes_adherent: "Bacchante"
 bacchantes_adherent_plural: "Bacchantes"
 bacchantes_desc: "Một phe bảo thủ theo đuổi mục đích thiêng liêng nguyên bản của Black Furies — báo thù cho những bất công đối với phụ nữ và trẻ em bằng lòng nhiệt thành cuồng tín và bạo lực không thương xót. Họ tin rằng khi làm vậy, họ đang chống lại sự thống trị của $glossary_wyrm$ đối với nhân loại và báo thù cho chính Gaia."

 freebooters: "Freebooters"
 freebooters_adj: "Freebooters"
 freebooters_adherent: "Freebooter"
 freebooters_adherent_plural: "Freebooters"
 freebooters_desc: "Sứ mệnh của Freebooters là tìm những nơi $glossary_wyld$ mới có thể được cung hiến cho Gaia và mở ra thành caern. Kuklos đang thu hẹp lại vì còn quá ít nơi Wyld sót lại trên thế giới. Một bộ phận Freebooters tin rằng họ cần tìm một thân thể mới cho Gaia ở đâu đó trong [umbra|E], nơi mà $glossary_wyrm$ vẫn chưa tìm ra." 

 moondaughter: "Moon-Daughter"
 moondaughters_adj: "Moon-Daughter"
 moondaughter_adherent: "Moon-Daughter"
 moondaughter_adherent_plural: "Moon-Daughters"
 moondaughter_desc: "Một giáo phái tìm cách truyền bá sự tôn thờ Gaia thông qua ngoại giáo. Dù bám víu vào truyền thống, họ cũng nỗ lực giữ cho tinh thần của Gaia sống động qua sự thay đổi, hiện thân cho sức mạnh của $glossary_wyld$ hết mức có thể. Phương pháp nghi lễ của họ chủ yếu liên quan đến pháp thuật cổ xưa, được truyền lại và biến đổi từ thế hệ này sang thế hệ khác."

 orderofourmercifulmother: "Order of Our Merciful Mother"
 orderofourmercifulmother_adj: "Order of Our Merciful Mother"
 orderofourmercifulmother_adherent: "Nữ Tu"
 orderofourmercifulmother_adherent_plural: "Nữ Tu"
 orderofourmercifulmother_desc: "Một trong những kuklos bị chế giễu nhiều nhất trong Black Furies. Hành động một cách tế nhị để đưa giáo điều của người khác đến gần hơn với một phiên bản tôn trọng Gaia và phụ nữ, Order nỗ lực cải cách xã hội loài người và Kitô giáo bằng cách dùng chính công cụ của họ để chống lại họ. Họ nhận công cho sự phổ biến ngày càng tăng của Đức Mẹ Đồng Trinh."

 sisterhood: "Sisterhood"
 sisterhood_adj: "Sisterhood"
 sisterhood_adherent: "Sister"
 sisterhood_adherent_plural: "Sister"
 sisterhood_desc: "Một mạng lưới bảo vệ Thân Tộc, phụ nữ, và Garou khỏi Tòa án Dị giáo và đưa họ đến nơi an toàn. Họ cũng quản lý các mạng lưới Thân Tộc khác nhau của Black Furies, cung cấp sự cứu giúp cho họ và thông báo cho các thành viên Bộ tộc khác khi một Thân Tộc bị một người đàn ông làm hại. Họ cũng thành thạo trong việc thu thập nguồn lực để Bộ tộc sử dụng."

 templeofartemis: "Temple of Artemis"
 templeofartemis_adj: "Temple of Artemis"
 templeofartemis_adherent: "Priestess of Artemis"
 templeofartemis_adherent_plural: "Priestesses Artemis"
 templeofartemis_desc: "Một trong những kuklos lâu đời nhất, và cũng là một trong những nhóm bảo thủ nhất. Họ khuyên nên rút lui khỏi Quốc gia Garou, và tái cống hiến Black Furies cho mục đích nguyên bản của họ là những kẻ báo thù cho phụ nữ. Họ cũng đóng vai trò như những vị quan tòa xét xử các Fury đã vi phạm tục lệ bộ tộc."

 bonegnawer_religion: "@werewolf_icon! Bone Gnawers"
 bonegnawer_religion_adj: "Bone Gnawers"
 bonegnawer_religion_adherent: "Bone Gnawer"
 bonegnawer_religion_adherent_plural: "Bone Gnawers"
 bonegnawer_religion_desc: "Những kẻ nhặt rác và sống sót của Garou, Bone Gnawers bị các bộ tộc khác xem chẳng khác gì lũ chó hoang bới móc trong rác rưởi của loài người. Bone Gnawers tự xem mình là những kẻ yếu thế, chờ đợi để chiến thắng trước những kẻ thù tự mãn."

 bonegnawer: "Bone Gnawers"
 bonegnawer_adj: "Bone Gnawers"
 bonegnawer_adherent: "Bone Gnawer"
 bonegnawer_adherent_plural: "Bone Gnawers"
 bonegnawer_desc: "Những kẻ nhặt rác và sống sót của Garou, Bone Gnawers bị các bộ tộc khác xem chẳng khác gì lũ chó hoang bới móc trong rác rưởi của loài người. Bone Gnawers tự xem mình là những kẻ yếu thế, chờ đợi để chiến thắng trước những kẻ thù tự mãn."

 thehood: "The Hood"
 thehood_adj: "Hood"
 thehood_adherent: "Hood"
 thehood_adherent_plural: "Hoods"
 thehood_desc: "Trại này chuyên phân phát của cải từ người giàu cho người nghèo, miễn là số tiền họ cung cấp được dùng vào những việc hữu ích. The Hood đang bắt đầu hình thành trong thời đại này (và tồn tại vượt ra ngoài ranh giới Rừng Sherwood).  Nhiều Gnawer trẻ tuổi lý tưởng đang gia nhập hàng ngũ của The Hood, bị cuốn hút bởi khái niệm tái phân phối của cải có tổ chức. Với tư cách là những tên cướp đường và vua trộm cướp, họ tìm ra cách mới để lấy lương thực từ những kẻ dư thừa và đưa vào miệng những người đang chết đói."
 
 ratfinks: "Rat Finks"
 ratfinks_adj: "Rat Finks"
 ratfinks_adherent: "Rat Fink"
 ratfinks_adherent_plural: "Rat Finks"
 ratfinks_desc: "Các Garou của trại này là gián điệp và những kẻ thu thập thông tin, một mạng lưới thân tộc và Garou làm những công việc tầm thường nhưng lại tình cờ cho họ quyền tiếp cận thông tin cấp cao. Các sinh vật siêu nhiên khác đôi khi cũng tương tác với trại: ma cà rồng Nosferatu, gián điệp Ratkin, và thậm chí cả sứ giả Corax."
 


 childrenoffamine: "Children of Famine"
 childrenoffamine_adj: "Children of Famine"
 childrenoffamine_adherent: "Child of Famine"
 childrenoffamine_adherent_plural: "Children of Famine"
 childrenoffamine_desc: "Đói khát có lẽ là một lối sống giữa những người nghèo thời trung cổ — nhưng Children of Famine luôn cố gắng hết sức để giảm bớt vấn đề này. Họ được biết đến là săn trộm trên đất đai hoàng gia hoặc trộm lúa mì từ các kho thóc tu viện trong thời kỳ khan hiếm. Gaia chưa bao giờ muốn con cái của Người phải chịu đói — và nơi nào có nạn đói, đó hẳn là do $glossary_wyrm$ gây ra. Nếu hạn hán hay dịch bệnh giáng xuống vùng đất, các Children thường đi tìm ai đó để đổ lỗi."

 childofgaia_religion: "@werewolf_icon! Children of Gaia"
 childofgaia_religion_adj: "Children of Gaia"
 childofgaia_religion_adherent: "Child"
 childofgaia_religion_adherent_plural: "Children"
 childofgaia_religion_desc: "Những người gìn giữ hòa bình của Garou, Children nỗ lực xây dựng sự thấu hiểu giữa các bộ tộc và hy vọng cuối cùng sẽ hợp nhất mọi bộ tộc thành một mặt trận thống nhất chống lại $glossary_wyrm$."

 childofgaia: "Children of Gaia"
 childofgaia_adj: "Children of Gaia"
 childofgaia_adherent: "Child"
 childofgaia_adherent_plural: "Children"
 childofgaia_desc: "Những người gìn giữ hòa bình của Garou, Children nỗ lực xây dựng sự thấu hiểu giữa các bộ tộc và hy vọng cuối cùng sẽ hợp nhất mọi bộ tộc thành một mặt trận thống nhất chống lại $glossary_wyrm$."

 servantsoftheunicorn: "Servants of the Unicorn"
 servantsoftheunicorn_adj: "Unicorn"
 servantsoftheunicorn_adherent: "Servant of the Unicorn"
 servantsoftheunicorn_adherent_plural: "Servants of the Unicorn"
 servantsoftheunicorn_desc: "Trại lớn nhất và quyền lực nhất của Children of Gaia thực ra không hẳn là một trại. Servants of the Unicorn đại diện cho lý tưởng bộ tộc, và hầu hết Children tự xem mình là Servants. Những Servant tận tụy nhất chủ động tìm kiếm các tranh chấp để hòa giải. Ngoài ra, Servants truyền bá thông điệp đoàn kết bộ tộc, thúc đẩy quan niệm rằng mọi Garou đều là Children of Gaia."
 
 crestofthehorn: "Crest of the Horn"
 crestofthehorn_adj: "Horn"
 crestofthehorn_adherent: "Crest"
 crestofthehorn_adherent_plural: "Crests"
 crestofthehorn_desc: "Một nhóm nhỏ tách ra từ Servants of the Unicorn, Crest of the Horn chủ yếu quan tâm đến các tranh chấp của Giáo hội Kitô giáo, và những thành viên cực đoan nhất của nó thường là những kẻ chống lại ảnh hưởng của Giáo hội."

 anointedones: "Anointed Ones"
 anointedones_adj: "Anointed"
 anointedones_adherent: "Anointed"
 anointedones_adherent_plural: "Anointed"
 anointedones_desc: "Những người gìn giữ hòa bình của Garou, Children nỗ lực xây dựng sự thấu hiểu giữa các bộ tộc và hy vọng cuối cùng sẽ hợp nhất mọi bộ tộc thành một mặt trận thống nhất chống lại $glossary_wyrm$. Trại này đã từ bỏ mọi hình thức bạo lực. Họ sẽ không ra tay đánh bất kỳ sinh vật nào khác, và không ngừng tìm cách mới để giải phóng mình khỏi Phẫn Nộ nhằm duy trì sự kiểm soát đó. Anointed Ones chật vật để tồn tại trong thời đại này, nhưng họ vẫn tồn tại."

 onetree: "The One Tree"
 onetree_adj: "One Tree"
 onetree_adherent: "Tree Child"
 onetree_adherent_plural: "Tree Children"
 onetree_desc: "Họ là những kẻ giết chóc — cả chiến binh tiền tuyến lẫn sát thủ lén lút. Dù vậy, họ không giết vì Phẫn Nộ, đam mê, thù hận, ác ý hay kiêu ngạo, và họ không chấp nhận thành viên nào muốn gia nhập trại với những động cơ đó. Họ giết bởi đó là điều Gaia đã tạo ra họ để làm; họ là kênh dẫn qua đó Gaia có thể đánh vào kẻ thù của mình."

 angelsofgaia: "Angels of Gaia"
 angelsofgaia_adj: "Angels"
 angelsofgaia_adherent: "Angel"
 angelsofgaia_adherent_plural: "Angel"
 angelsofgaia_desc: "Trại này của Children of Gaia bảo vệ, che chở và giải cứu trẻ em loài người khỏi $glossary_wyrm_corruption$. Họ đặc biệt chăm sóc những đứa trẻ có gia đình bị giết bởi chiến tranh hay bệnh tật cùng những đứa trẻ bị cha mẹ bỏ rơi."

 aetherainamorata: "Aethera Inamorata"
 aetherainamorata_adj: "Love"
 aetherainamorata_adherent: "Lover"
 aetherainamorata_adherent_plural: "Lovers"
 aetherainamorata_desc: "Một trại gây tranh cãi chuyên chữa lành thông qua tình dục và tình yêu thể xác, họ tin rằng các cặp đôi Garou-Garou không phải là sự vi phạm Litany (và thực tế là một công cụ quý giá hướng tới đoàn kết) miễn là họ không sinh con. Họ theo dõi các trường hợp mang thai của Thân Tộc để giúp các gia đình chuẩn bị cho khả năng có một đứa trẻ Garou, và tạo điều kiện cho hôn nhân giữa các Thân Tộc của các bộ tộc khác nhau, vì mục đích xây dựng đoàn kết và niềm tin liên bộ tộc." 

 fianna_religion: "@werewolf_icon! Fianna"
 fianna_religion_adj: "Fianna"
 fianna_religion_adherent: "Fianna"
 fianna_religion_adherent_plural: "Fianna"
 fianna_religion_desc: "Bắt nguồn sâu sắc từ truyền thống Celtic và châu Âu, Fianna nổi tiếng trong Garou vì niềm đam mê với thú vui cuộc sống, kỹ năng và sự dữ dội trong chiến đấu, cùng vai trò là những người gìn giữ âm nhạc, truyện kể, và truyền thuyết của Garou."

 fianna: "Fianna"
 fianna_adj: "Fianna"
 fianna_adherent: "Fianna"
 fianna_adherent_plural: "Fianna"
 fianna_desc: "Bắt nguồn sâu sắc từ truyền thống Celtic và châu Âu, Fianna nổi tiếng trong Garou vì niềm đam mê với thú vui cuộc sống, kỹ năng và sự dữ dội trong chiến đấu, cùng vai trò là những người gìn giữ âm nhạc, truyện kể, và truyền thuyết của Garou."

 brotherhoodofherne: "Brotherhood of Herne"
 brotherhoodofherne_adj: "Herne"
 brotherhoodofherne_adherent: "Brother of Herne"
 brotherhoodofherne_adherent_plural: "Brotherhood"
 brotherhoodofherne_desc: "Đây là Trại chủ yếu gồm các Ahroun cùng một số Thánh Triều khác pha trộn vào. Họ khởi đầu như một phương tiện chia sẻ nguồn lực khi cuộc chiến chống lại Black Spiral Dancers mới hình thành đang ở giai đoạn khốc liệt nhất. Một vài Ahroun từ mỗi Sept sẽ Moonbridge đến một Caern đang gặp nguy khốn và đến cứu viện, có thể nói như vậy. Brotherhood of Herne đang thích nghi tốt với các khái niệm hiệp sỹ đạo, huy hiệu học và tước hiệp sỹ của loài người. Tuy nhiên, họ bị các đồng tộc Fianna xem nhẹ."
 
 childrenofdire: "Children of Dire"
 childrenofdire_adj: "Dire"
 childrenofdire_adherent: "Dire Wolf"
 childrenofdire_adherent_plural: "Dire Wolves"
 childrenofdire_desc: "Chủ yếu gồm các Garou dạng lupus, trại này theo dõi các luồng phát ra từ thế lực $glossary_wyrm$ thông qua tác động của chúng lên $glossary_wyld$. Bằng cách ghi nhận những thay đổi trong dòng chảy giữa kẻ săn mồi và con mồi cùng sự phát triển hay suy tàn của thảm thực vật tại các địa điểm Wyld, họ có thể phát hiện ảnh hưởng của Wyrm trước khi nó trở nên mạnh mẽ. Bản thân trại này thường bị người ngoài nhìn với sự nghi ngờ vì họ hiếm khi gắn bó với một caern nào trong thời gian dài." 
 
 grancdhildrenoffionn: "Grandchildren of Fionn"
 grancdhildrenoffionn_adj: "Fionn"
 grancdhildrenoffionn_adherent: "Grandchild"
 grancdhildrenoffionn_adherent_plural: "Grandchildren"
 grancdhildrenoffionn_desc: "Nhiều Fianna trẻ tuổi xem Grandchildren of Fionn — tận tụy với lý tưởng chiến đấu của tổ tiên họ, Fionn mac Cumhail — như cơ hội hoàn hảo để chứng minh bản thân với phần còn lại của bộ tộc và Quốc gia. Họ tự xem mình là những anh hùng được Stag tuyển chọn, và nổi danh vì lòng dũng cảm, đi khắp nơi có trận chiến hay nhất." 

 mothersfundamentalists: "Mother's Fundamentalists"
 mothersfundamentalists_adj: "Fundamentalist"
 mothersfundamentalists_adherent: "Fundamentalist"
 mothersfundamentalists_adherent_plural: "Fundamentalists"
 mothersfundamentalists_desc: "Trại này của Fianna mong muốn khôi phục lại Impergium — việc chọn lọc dân số loài người mà Garou thực hành từ thời tiền sử. Họ đổ lỗi cho sự lan rộng không kiểm soát của nhân loại là nguyên nhân gây ra sự điên loạn của $glossary_weaver$ và $glossary_wyrm$ cùng cái chết chậm rãi của Gaia." 

 songkeepers: "Songkeepers"
 songkeepers_adj: "Songkeeper"
 songkeepers_adherent: "Songkeeper"
 songkeepers_adherent_plural: "Songkeepers"
 songkeepers_desc: "Songkeepers có quyền tuyên bố mình là di sản lâu đời nhất, chỉ có Grandchildren of Fionn mới có thể tranh cãi yêu sách đó. Họ là điều mà mọi người nghĩ đến khi nhắc tới Fianna; họ là các bậc thầy truyền thuyết, những người kể chuyện, và những kẻ tận tụy gìn giữ lịch sử truyền miệng sống mãi. Trại này không chỉ gồm Galliard. Các Theurge tìm kiếm và học các Nghi thức, đảm bảo không có gì bị mất khi Ngày Tận Thế đến gần, và các Philodox gìn giữ trí tuệ cổ xưa của các Phán Quyết trong quá khứ. Điều quan trọng là khả năng học hỏi và chia sẻ tri thức đó với mọi Garou, không chỉ riêng Fianna, đó là lý do Trại này được các Bộ tộc khác biết đến rộng rãi như vậy." 

 tuathadefionn: "Tuatha De Fionn"
 tuathadefionn_adj: "Tuatha De Fionn"
 tuathadefionn_adherent: "Tuatha"
 tuathadefionn_adherent_plural: "Tuatha"
 tuathadefionn_desc: "Trong khi người ngoài có thể liên hệ mọi Fianna với các nàng tiên, Tuatha de Fionn là trại nhiều khả năng nhất sẽ giao thiệp với họ. Các Tuatha mới được tuyển mộ bởi các thành viên hiện tại nhận thấy ở họ một điều gì đó — dòng máu hay sự điên loạn của tiên tộc — mà họ tin sẽ cho phép người mới gia nhập giao thiệp với Fair Folk trên cơ sở gần như bình đẳng. Sau một thời gian dài học việc, họ được đưa đi gặp Fae, và hy vọng sẽ gia nhập Tuatha de Fionn với tư cách thành viên đầy đủ. Children of Fionn không chỉ đàm phán với các nàng tiên thay mặt Quốc gia Garou, mà còn học hỏi từ họ về nhiều kẻ thù chung — dù không nhất thiết là sinh vật của Wyrm — nhiều khả năng sẽ can thiệp vào Quốc gia." 

 whisperingrovers: "Whispering Rovers"
 whisperingrovers_adj: "Rover"
 whisperingrovers_adherent: "Rover"
 whisperingrovers_adherent_plural: "Rovers"
 whisperingrovers_desc: "Họ không nhận đất đai nào là của mình và du hành khắp thế giới cùng thân tộc theo từng nhóm, phụ thuộc rất nhiều vào nhau để sinh tồn — luôn di động, không bao giờ ở lại một chỗ quá lâu. Họ đóng vai trò như tai mắt của thị tộc, với Righ của mỗi nhóm báo cáo lại cho Ard Righ của bộ tộc bất cứ điều gì họ nhận thấy trong chuyến du hành có thể dẫn đến rắc rối cho Fianna. Rovers được tìm đến khi các Fianna khác hay thậm chí các bộ tộc khác cần biết thông tin về một địa điểm nhất định." 

 dyn_a_drowyd_yn_flaidd: "Dyn a drowyd yn flaidd"
 dyn_a_drowyd_yn_flaidd_adj: "flaidd"
 dyn_a_drowyd_yn_flaidd_adherent: "Dyn"
 dyn_a_drowyd_yn_flaidd_adherent_plural: "Dyn"
 dyn_a_drowyd_yn_flaidd_desc: "Những Fianna xứ Wales này rất khép kín, ẩn mình trong các ngọn đồi và thung lũng của lãnh thổ mình và ít quan tâm đến những gì diễn ra bên ngoài ranh giới của họ. Các Fianna khác nói rằng Dyn a drowyd yn flaidd hòa huyết mình với các nàng tiên, ban cho họ sức mạnh kỳ lạ ngay cả trong hàng ngũ Garou, nhưng cũng khiến họ nhuốm màu điên loạn.\n\nGiống như Thân Tộc dữ dội của mình, Fianna vùng núi phía bắc là những chiến binh cứng cỏi hơn những kẻ ở vùng đất thấp, đã chứng minh giá trị của mình trước cả Get of Fenris lẫn người Norman." 

 getoffenris_religion: "@werewolf_icon! Get of Fenris"
 getoffenris_religion_adj: "Fenris"
 getoffenris_religion_adherent: "Fenris"
 getoffenris_religion_adherent_plural: "Fenris"
 getoffenris_religion_desc: "Những chiến binh dữ dội với rất ít chỗ cho lòng thương xót và trắc ẩn, Fenrir tự xem mình là những anh hùng vĩ đại, nhưng đã từng khiến các Garou khác kinh hãi vì cách hành xử bạo lực của họ."

 getoffenris: "Get of Fenris"
 getoffenris_adj: "Fenris"
 getoffenris_adherent: "Fenris"
 getoffenris_adherent_plural: "Fenris"
 getoffenris_desc: "Những chiến binh dữ dội với rất ít chỗ cho lòng thương xót và trắc ẩn, Fenrir tự xem mình là những anh hùng vĩ đại, nhưng đã từng khiến các Garou khác kinh hãi vì cách hành xử bạo lực của họ."
 
 valkyriaoffreya: "Valkyria of Freya"
 valkyriaoffreya_adj: "Valkyria"
 valkyriaoffreya_adherent: "Valkyria"
 valkyriaoffreya_adherent_plural: "Valkyria"
 valkyriaoffreya_desc: "Valkyria chiến đấu vì địa vị bình đẳng của phụ nữ trong Bộ tộc. Trong khi hầu hết Fenrir khinh miệt Trại này, tin rằng nó nuôi dưỡng những nữ giới của họ thành những kẻ yếu đuối hay than vãn chỉ biết phàn nàn thay vì giành lấy những gì thuộc về mình bằng quyền lợi, chính Valkyria khẳng định rằng họ quan trọng trong việc phá bỏ nhiều định kiến của loài người về vai trò của nữ giới trong xã hội. Họ thường xuyên xung đột (đôi khi bạo lực) với Black Furies."

 handoftyr: "Hand of Tyr"
 handoftyr_adj: "Tyr"
 handoftyr_adherent: "Hand"
 handoftyr_adherent_plural: "Hands"
 handoftyr_desc: "Hand of Tyr gồm những Get đã chuyển sự chú ý sang chống lại ảnh hưởng của $glossary_wyrm$ trong nhân loại, nhắm vào những kẻ hiếp dâm, lạm dụng trẻ em, khủng bố, và tội phạm bạo lực."

 fangsofgarm: "Fangs of Garm"
 fangsofgarm_adj: "Garm"
 fangsofgarm_adherent: "Fang"
 fangsofgarm_adherent_plural: "Fangs"
 fangsofgarm_desc: "Fangs of Garm tìm cách hòa nhập Get of Fenris tốt hơn vào Quốc gia Garou và tìm cách hàn gắn quan hệ với các Bộ tộc khác, để khi Ngày Tận Thế đến, họ có thể sát cánh cùng nhau."

 mjlolnirsthunder: "Mjolnir's Thunder"
 mjlolnirsthunder_adj: "Thunder"
 mjlolnirsthunder_adherent: "Dedicated"
 mjlolnirsthunder_adherent_plural: "Dedicated"
 mjlolnirsthunder_desc: "Trại cổ xưa này gồm những kẻ đã đánh mất (hoặc cắt đứt) mọi mối liên hệ với thế giới xung quanh và cống hiến hoàn toàn cho việc hủy diệt $glossary_wyrm$. Họ không quan tâm đến bất cứ điều gì khác: không phải con người hay sói, linh hồn, Veil, hay thậm chí cả xã hội Garou nói chung. Họ là những quái vật mà các bộ tộc khác đôi khi hình dung tất cả Fenrir đều như vậy, đã đánh đổi mọi mảnh vụn lòng trắc ẩn, sự đồng cảm, và lẽ thường để lấy sự cống hiến đơn nhất, thái nhân cách cho cái chết của Wyrm."

 gloriousfistofwotan: "Glorious Fist of Wotan"
 gloriousfistofwotan_adj: "Wotan"
 gloriousfistofwotan_adherent: "Fist"
 gloriousfistofwotan_adherent_plural: "Fists"
 gloriousfistofwotan_desc: "Glorious Fist of Wotan tin rằng chỉ có việc xóa sổ loài người mới có thể cứu được Gaia. Con người đã trở thành vật trung gian lớn nhất mà qua đó $glossary_wyrm$ lan rộng, vì vậy để kiềm chế nó, họ phải bị giết."

 lokissmile: "Loki's Smile"
 lokissmile_adj: "Loki"
 lokissmile_adherent: "Smiler"
 lokissmile_adherent_plural: "Smilers"
 lokissmile_desc: "Loki's Smile được cho là điều khiển Bộ tộc từ trong bóng tối, các thành viên của nó giao tiếp qua các linh hồn bão tố và ẩn mình khỏi phần còn lại của Bộ tộc." 
 
 warderofmen_religion: "@werewolf_icon! Warders of Men"
 warderofmen_religion_adj: "Warders of Men"
 warderofmen_religion_adherent: "Warder"
 warderofmen_religion_adherent_plural: "Warders"
 warderofmen_religion_desc: "Đắm chìm trong tôn giáo loài người, và sự lên xuống của thành thị, Warder of Men sống chết theo một tín điều tiến bộ. Dù họ sợ Ngày Tận Thế như bất kỳ người sói nào khác, họ tin rằng mỗi ngày trôi qua khiến họ mạnh mẽ hơn, rằng mọi phát minh mới có thể được chiếm dụng cho mục đích của họ, và mọi triết lý mới có thể củng cố quyết tâm của họ. Theo cách này, họ là hình mẫu tiêu biểu của Urrah và không có sự ác cảm mạnh mẽ với dân số loài người như hầu hết Garou."

 warderofmen: "Warders of Men"
 warderofmen_adj: "Warders of Men"
 warderofmen_adherent: "Warder"
 warderofmen_adherent_plural: "Warders"
 warderofmen_desc: "Đắm chìm trong tôn giáo loài người, và sự lên xuống của thành thị, Warder of Men sống chết theo một tín điều tiến bộ. Dù họ sợ Ngày Tận Thế như bất kỳ người sói nào khác, họ tin rằng mỗi ngày trôi qua khiến họ mạnh mẽ hơn, rằng mọi phát minh mới có thể được chiếm dụng cho mục đích của họ, và mọi triết lý mới có thể củng cố quyết tâm của họ. Theo cách này, họ là hình mẫu tiêu biểu của Urrah và không có sự ác cảm mạnh mẽ với dân số loài người như hầu hết Garou."
 
 bellowsandcrucible: "Bellows and Crucible"
 bellowsandcrucible_adj: "Firetenders"
 bellowsandcrucible_adherent: "Firetender"
 bellowsandcrucible_adherent_plural: "Firetenders"
 bellowsandcrucible_desc: "'Firetenders' phần lớn là Theurge và Philodox, tất cả đều am hiểu về pháp thuật nguyên tố. Họ cố gắng hết sức để dẫn dắt các nhà giả kim loài người đến giác ngộ, hy vọng mở mắt cho những kẻ họ dẫn dắt thấy được vinh quang của thế giới tâm linh vượt xa hơn."
 
 brethrenofthebook: "Brethren of the Book"
 brethrenofthebook_adj: "Book"
 brethrenofthebook_adherent: "Brother"
 brethrenofthebook_adherent_plural: "Brethren"
 brethrenofthebook_desc: "Những Warder này tôn vinh điều họ tin là thành tựu vĩ đại nhất của nhân loại — chữ viết. Các thành viên của trại này tích trữ những cuộn giấy và bản chép quý hiếm, và từng lẻn vào các tu viện và pháo đài để đánh cắp sách trước khi chiến tranh hay thảm họa có thể tàn phá chúng. Brethren sinh sôi giữa các học giả, giáo sĩ và những người có học thức khác, và thường phấn đấu để biết chữ ở càng nhiều ngôn ngữ càng tốt."
 

 
 goldenwheel: "Golden Wheel"
 goldenwheel_adj: "Golden Wheel"
 goldenwheel_adherent: "Merchant"
 goldenwheel_adherent_plural: "Merchants"
 goldenwheel_desc: "Thương mại và buôn bán thúc đẩy thành tựu loài người — ít nhất, đó là điều các Wheel khẳng định. Trại này cố gắng hết sức để thúc đẩy quan hệ thương mại giữa các thành phố và quốc gia, lập luận rằng nơi nào hàng hóa được trao đổi, ý tưởng cũng sẽ được trao đổi theo. Một số Garou cáo buộc rằng Wheels hành động vì lòng tham nhiều hơn là vì sự cao thượng, nhưng có rất ít bằng chứng về bất kỳ sự tham nhũng lớn nào trong trại."

 redtalon_religion: "@werewolf_icon! Red Talons"
 redtalon_religion_adj: "Red Talons"
 redtalon_religion_adherent: "Talon"
 redtalon_religion_adherent_plural: "Talons"
 redtalon_religion_desc: "Red Talons là bộ tộc duy nhất trong Garou hoàn toàn mang bản chất sói thuần túy, hoàn toàn xa lánh loài người như một vết nhơ trên Trái Đất. Talons kể rằng Bộ tộc của họ được hình thành trực tiếp từ Gaia và họ vẫn là những Garou thuần khiết nhất giữ được liên hệ với hình dạng nguyên thủy của mình, không bị vấy bẩn bởi nhân loại ô uế."

 redtalon: "Red Talons"
 redtalon_adj: "Red Talons"
 redtalon_adherent: "Talon"
 redtalon_adherent_plural: "Talons"
 redtalon_desc: "Red Talons là bộ tộc duy nhất trong Garou hoàn toàn mang bản chất sói thuần túy, hoàn toàn xa lánh loài người như một vết nhơ trên Trái Đất. Talons kể rằng Bộ tộc của họ được hình thành trực tiếp từ Gaia và họ vẫn là những Garou thuần khiết nhất giữ được liên hệ với hình dạng nguyên thủy của mình, không bị vấy bẩn bởi nhân loại ô uế."

 predatorkings: "Lodge of the Predator Kings"
 predatorkings_adj: "Predator King"
 predatorkings_adherent: "Predator"
 predatorkings_adherent_plural: "Predators"
 predatorkings_desc: "Predator Kings tin rằng thời gian cho sự thỏa hiệp đã qua và loài người phải bị tàn sát cho đến khi không còn ai sót lại."
 
 wardersoftheland: "Warders of the Land"
 wardersoftheland_adj: "Land"
 wardersoftheland_adherent: "Warder"
 wardersoftheland_adherent_plural: "Warders"
 wardersoftheland_desc: "Warders sẽ giết bất kỳ con người nào xâm phạm lãnh thổ của họ, nhưng sẽ không truy đuổi họ ra ngoài phạm vi đó. Warders sẽ không ngần ngại giết một người nếu cần thiết, nhưng không tin vào việc tàn sát hàng loạt. Một số cảm thấy rằng nếu không có quá nhiều loài người, họ sẽ chỉ là một mối phiền toái có thể chấp nhận được thay vì mối đe dọa công khai như hiện tại. Những người khác muốn thấy loài người biến mất, nhưng không cảm thấy Garou có đủ công cụ để đạt được điều đó, nên họ tìm kiếm những lựa chọn khác."

 nightfear: "Night-Fear"
 nightfear_adj: "Night-Fear"
 nightfear_adherent: "Terror"
 nightfear_adherent_plural: "Terrors"
 nightfear_desc: "Trại này, chủ yếu gồm Ragabash và Galliard, quan tâm nhất đến những câu chuyện mà loài người kể cho nhau nghe. Họ hy vọng rằng con người có thể học cách tôn kính Người Mẹ thông qua nỗi sợ hãi, và qua nỗi sợ hãi mà dạy nhau sự thận trọng. Night-Fear được biết đến là tấn công những con người mà họ cho là xâm phạm rõ ràng, nhưng không bao giờ để giết chết — họ chỉ gây thương tích và khủng bố, với hy vọng rằng con người sẽ lan truyền tin đồn rằng một số địa điểm và hành vi là điều cấm kỵ." 
  
 settingmoon: "Setting Moon"
 settingmoon_adj: "Setting Moon"
 settingmoon_adherent: "Talon"
 settingmoon_adherent_plural: "Talons"
 settingmoon_desc: "Các nhà tiên tri và bậc hiền triết của Talons đôi khi xuất thân từ trại nhỏ bé này. Họ là những kẻ theo đuổi tầm nhìn và người gìn giữ lời tiên tri, và chính những dự đoán bi thảm của họ củng cố niềm tin của bộ tộc rằng loài người một ngày nào đó sẽ là cái chết của Gaia. Setting Moon đôi khi cử sứ giả đến các sept khác, và thường góp thành viên vào các nhóm đa bộ tộc, với hy vọng cảnh báo các bộ tộc khác trước khi quá muộn."
 
 kucha_ekundu: "Kucha Ekundu"
 kucha_ekundu_adj: "Kucha Ekundu"
 kucha_ekundu_adherent: "Kucha Ekundu"
 kucha_ekundu_adherent_plural: "Kucha Ekundu"
 kucha_ekundu_desc: "Kucha Ekundu là một chi hệ của Red Talons sinh sống ở châu Phi và giao phối với chó hoang châu Phi (còn gọi là "sói vằn") thay vì sói thật. Một số tin đồn cho rằng họ học được điều này từ Mokolé. Nhiều Kucha Ekundu chia sẻ cùng quan điểm về loài người như những người anh em họ của mình. Kucha Ekundu vẫn tôn thờ Griffon làm Vật Tổ của mình."
 
 shadowlord_religion: "@werewolf_icon! Shadow Lords"
 shadowlord_religion_adj: "Shadow Lords"
 shadowlord_religion_adherent: "Shadow Lord"
 shadowlord_religion_adherent_plural: "Shadow Lords"
 shadowlord_religion_desc: "Những nhà chính trị và thao túng của Garou, Shadow Lords hoạt động thông qua hệ thống thứ bậc nghiêm ngặt và những phương thức bí mật để giành lấy càng nhiều quyền lực càng tốt."
 
 shadowlord: "Shadow Lords"
 shadowlord_adj: "Shadow Lords"
 shadowlord_adherent: "Shadow Lord"
 shadowlord_adherent_plural: "Shadow Lords"
 shadowlord_desc: "Những nhà chính trị và thao túng của Garou, Shadow Lords hoạt động thông qua hệ thống thứ bậc nghiêm ngặt và những phương thức bí mật để giành lấy càng nhiều quyền lực càng tốt."
 
 lordsofthesummit: "Lords of the Summit"
 lordsofthesummit_adj: "Summit"
 lordsofthesummit_adherent: "Lord"
 lordsofthesummit_adherent_plural: "Lords"
 lordsofthesummit_desc: "Một Lord of the Summit sẽ làm bất cứ điều gì để đạt được quyền lực, và một khi đã đạt được, sẽ không hy sinh nó vì bất kỳ lý do gì. Viện dẫn Litany, các Lord có thẩm quyền tuyên bố rằng vì Ngày Tận Thế đã gần kề, không còn ảo tưởng nào về hòa bình mà dưới đó quyền cai trị của họ có thể bị thách thức một cách danh dự. Những Lord này nắm giữ nhiều vị trí lãnh đạo trong bộ tộc (và Quốc gia), nơi trạng thái “thiết quân luật” liên tục của họ thúc đẩy và bảo tồn sự chuyên chế của họ." 

 bringersoflight: "Bringers of Light"
 bringersoflight_adj: "Lightbringer"
 bringersoflight_adherent: "Bringer"
 bringersoflight_adherent_plural: "Bringers"
 bringersoflight_desc: "Bringers of Light tìm kiếm sức mạnh nội tại bằng cách liên tục thử thách bản thân trước sự vấy bẩn xung quanh. Lần này qua lần khác, họ tìm đến sự cám dỗ của $glossary_wyrm$, tương tác với ma cà rồng, Black Spiral Dancers, fomori, và các Wyrmfolk khác. Dù nhiều người đã gục ngã khi cố gắng ôm lấy tín điều của trại này, các Bringer tin rằng những kẻ mạnh mẽ nhất (và thực sự xứng đáng) không khuất phục trước bóng tối; họ vượt qua nó. Tất nhiên nhiều người gục ngã; con đường họ chọn khá nguy hiểm, và họ chịu rủi ro chết dưới tay những kẻ xung quanh cũng như bị ô uế bởi sự đụng chạm của Wyrm." 

 childrenofcrow: "Children of Crow"
 childrenofcrow_adj: "Crow"
 childrenofcrow_adherent: "Child"
 childrenofcrow_adherent_plural: "Children"
 childrenofcrow_desc: "Nhận Crow làm Vật Tổ của mình, những Garou này đóng vai trò cố vấn và "kẻ giải quyết vấn đề" cho các thủ lĩnh trong Quốc gia Garou, ủng hộ kẻ mạnh và người khôn ngoan trong khi âm mưu lật đổ kẻ bất xứng. Họ bám vào bóng tối, không quan tâm đến quyền lực hay lãnh đạo cá nhân. Thay vào đó, họ làm việc sau hậu trường, học hỏi bí mật và chú ý đến những chi tiết mà người khác bỏ sót, mà họ dùng để hạ gục kẻ thù của Garou và giải phóng Gaia, từng chút một. Họ tạo ra những beta tận tụy, trung thành."  

 judgesofdoom: "Judges of Doom"
 judgesofdoom_adj: "Doom"
 judgesofdoom_adherent: "Judge"
 judgesofdoom_adherent_plural: "Judges"
 judgesofdoom_desc: "Judges of Doom gieo rắc nỗi sợ hãi sâu sắc vào trái tim Quốc gia Garou bằng cách tìm kiếm và tiêu diệt những Garou công khai vi phạm các điều khoản của Litany. Họ theo đuổi chương trình hành động của mình với lòng nhiệt thành tàn nhẫn. Không thương xót và không hối hận, họ không tỏ ra khoan dung khi săn lùng và tiêu diệt Garou — thậm chí toàn bộ sept — những kẻ đã để một caern bị xâm phạm hoặc phạm phải vi phạm quy mô lớn khác đối với luật lệ của Quốc gia. Không kẻ vi phạm Litany nào thoát khỏi sự giám sát và công lý của họ."  

 hakken: "Hakken"
 hakken_adj: "Hakken"
 hakken_adherent: "Hakken"
 hakken_adherent_plural: "Hakken"
 hakken_desc: "Một Bộ tộc Hengeyokai bắt nguồn từ Shadow Lords, nhưng khác với những người anh em phương Tây của mình, Hakken và thế giới quan của họ vượt ra ngoài khuôn mẫu Shadow Lord. Hakken theo đuổi khái niệm Bushidō, con đường của võ sĩ. Mọi Hakken trung thành đều theo con đường này và tự xem mình là samurai theo nghĩa truyền thống nhất. Hakken là một trong số ít bộ tộc Garou có ảnh hưởng đáng kể trong Thú Triều châu Á."

 hakken_war_god_name: "Susanowo"
 hakken_war_god_name_possessive: "của Susanowo"
 hakken_night_god_name: "Tsuki-yomi"
 hakken_night_god_name_possessive: "của Tsuki-yomi"

 
 silentstrider_religion: "@werewolf_icon! Silent Striders"
 silentstrider_religion_adj: "Silent Striders"
 silentstrider_religion_adherent: "Silent Strider"
 silentstrider_religion_adherent_plural: "Silent Striders"
 silentstrider_religion_desc: "Bắt nguồn từ Ai Cập, Silent Striders đã bị nguyền rủa phải lưu vong bởi ma cà rồng quyền năng Set, và họ đã chạy trốn kể từ đó. Du mục, hướng nội, và mang tính tâm linh sâu sắc, Silent Striders đã dò xét những tầng sâu của [umbra|E], có lẽ sâu hơn bất kỳ bộ tộc Garou nào khác." 
 
 silentstrider: "Silent Striders"
 silentstrider_adj: "Silent Striders"
 silentstrider_adherent: "Silent Strider"
 silentstrider_adherent_plural: "Silent Striders"
 silentstrider_desc: "Bắt nguồn từ Ai Cập, Silent Striders đã bị nguyền rủa phải lưu vong bởi ma cà rồng quyền năng Set, và họ đã chạy trốn kể từ đó. Du mục, hướng nội, và mang tính tâm linh sâu sắc, Silent Striders đã dò xét những tầng sâu của [umbra|E], có lẽ sâu hơn bất kỳ bộ tộc Garou nào khác."

 harbingers_adj: "Harbingers"
 harbingers_adherent: "Harbinger"
 harbingers_adherent_plural: "Harbingers"
 harbingers_desc: "Đây là những Garou đầu tiên xem trọng Lời Tiên Tri Phượng Hoàng, hoặc ít nhất một số người nói vậy. Họ tách ra và lang thang khắp thế giới tìm kiếm dấu hiệu $glossary_wyrm$ và mang lời về. Họ vẫn chưa xong việc kể cho Garou nghe về mọi Wyrmsign họ tìm thấy. Quan trọng nhất, họ mang lại hy vọng. Họ là một trong những nhóm khôn ngoan nhất của Garou, nên tốt hơn hết bạn hãy nhảy dựng lên khi họ bảo bạn làm vậy."

 seekers_adj: "Seekers"
 seekers_adherent: "Seekers"
 seekers_adherent_plural: "Seekers"
 seekers_desc: "Seekers lang thang từ nơi này sang nơi khác tìm kiếm thông tin họ chưa từng biết. Seekers thường thông minh, tháo vát, tò mò, và cứng đầu hết mực. Nếu bạn muốn biết điều gì, hãy hỏi một Seeker. Nếu họ không biết câu trả lời, họ sẽ chỉ cho bạn hướng đi đúng. Seekers biết những gì đã xảy ra và những gì đang xảy ra. Seekers biết nhiều nghi thức huyền bí hơn bất kỳ trại nào khác của Silent Striders. Họ cũng rất có thể mang theo một túi đầy bùa chú và bảo vật tìm thấy ở những góc tối và nơi hẻo lánh. Họ thường đóng vai trò cố vấn cho các Strider trẻ tuổi, và nhiều người vẫn giữ liên lạc với những người cố vấn của chính mình từ thời trẻ."

 dispossessed: "Dispossessed"
 dispossessed_adj: "Dispossessed"
 dispossessed_adherent: "Dispossessed"
 dispossessed_adherent_plural: "Dispossessed"
 dispossessed_desc: "Người ta không thể không lo lắng cho Dispossessed. Họ không cố gắng điều gì khó hơn việc định cư ở đâu đó nhưng điều gì đó luôn ngăn cản họ thành công. Chẳng có gì lạ khi họ trở nên cay đắng đến vậy.\nHọ nghiên cứu về Ngày Tận Thế và là những kẻ ảm đạm nhất trong số các Strider. Họ theo dõi các điềm báo về Ngày Tận Thế sắp đến và kể lại lời cảnh báo của mình cho những ai sẵn lòng lắng nghe. Thậm chí có tin đồn rằng họ cố gắng giúp đưa Ngày Tận Thế đến, tin rằng họ sẽ có một mái nhà sau khi ngày tận cùng đã đến và qua đi."

 wayfarers: "Wayfarers"
 wayfarers_adj: "Wayfarers"
 wayfarers_adherent: "Wayfarers"
 wayfarers_adherent_plural: "Wayfarer"
 wayfarers_desc: "Những Strider này bán dịch vụ của mình cho người trả giá cao nhất. Nếu một người nói rằng anh ta sẽ chuyển thông điệp của bạn đi, nó sẽ được chuyển đi. Số ít thành viên của liên minh lỏng lẻo gồm những kẻ cơ hội này thường giao dịch bằng hàng đổi hàng và ân huệ. Họ lý luận rằng, thường thì họ thậm chí sẽ không được chào đón ở hầu hết các sept nếu không làm ơn cho những người có thẩm quyền — vậy tại sao không lấy một bữa ăn ngon và ít thông tin để đổi lại, để làm ngọt thêm thỏa thuận?"

 daggersofnut: "Daggers of Nut"
 daggersofnut_adj: "Daggers of Nut"
 daggersofnut_adherent: "Dagger"
 daggersofnut_adherent_plural: "Daggers"
 daggersofnut_desc: "Lấy tên từ Incarna ngoại giáo Aegyptia của màn đêm, những Strider này thực sự tức giận trước sự trỗi dậy của ma cà rồng. Lòng căm thù của họ đối với xác sống còn vượt qua cả Fianna hoang dã nhất hay Silver Fang thuần khiết nhất — vì họ báo thù cho quê hương đã mất và thân tộc đã mất. Daggers hành động như những sát thủ bất cứ nơi nào họ đi qua, âm thầm chọn ra một hay vài Leech để tiêu diệt, dù điều đó chắc chắn sẽ làm phật lòng bất kỳ hiệp ước đình chiến hiện có nào giữa người bản địa. Bất cứ nơi nào Daggers of Nut đi qua, cuộc chiến giữa người sói và ma cà rồng lại bùng lên thành cơn thịnh nộ mới." 
 

 
 bitterhex: "Bitter Hex"
 bitterhex_adj: "Hex"
 bitterhex_adherent: "Witch"
 bitterhex_adherent_plural: "Witches"
 bitterhex_desc: "Các thành viên của Bitter Hex sử dụng một trong những công cụ gây tranh cãi và nguy hiểm nhất mà bộ tộc biết đến: lời nguyền. Trong khi các thành viên giữ kín mối liên hệ của mình với trại, bản thân trại này không hề giấu giếm sự tồn tại của nó. Họ muốn phần còn lại của thế giới biết rằng bộ tộc của họ đã chịu đựng đủ rồi, và Hex có đủ phép thuật để báo thù cho bất kỳ điều sai trái nào, dù nhỏ nhặt đến đâu, đối với Striders và Thân Tộc của họ."  

 silverfang_religion: "@werewolf_icon! Silver Fangs"
 silverfang_religion_adj: "Silver Fangs"
 silverfang_religion_adherent: "Silver Fang"
 silverfang_religion_adherent_plural: "Silver Fangs"
 silverfang_religion_desc: "'Bộ tộc Alpha' của Quốc gia Garou, Silver Fangs là những nhà cai trị và thủ lĩnh chiến tranh truyền thống. Những Garou cao quý này nổi tiếng vì vẻ đẹp thể chất, lòng dũng cảm, và danh dự. Đáng buồn thay, nhiều thành viên trẻ tuổi hơn của bộ tộc mắc phải những tật kỳ lạ - đãng trí, ảo giác nhẹ, mộng du - không hẳn là loạn thần công khai, nhưng vẫn đáng chú ý."
 
 silverfang: "Silver Fangs"
 silverfang_adj: "Silver Fangs"
 silverfang_adherent: "Silver Fang"
 silverfang_adherent_plural: "Silver Fangs"
 silverfang_desc: "'Bộ tộc Alpha' của Quốc gia Garou, Silver Fangs là những nhà cai trị và thủ lĩnh chiến tranh truyền thống. Những Garou cao quý này nổi tiếng vì vẻ đẹp thể chất, lòng dũng cảm, và danh dự. Đáng buồn thay, nhiều thành viên trẻ tuổi hơn của bộ tộc mắc phải những tật kỳ lạ - đãng trí, ảo giác nhẹ, mộng du - không hẳn là loạn thần công khai, nhưng vẫn đáng chú ý."

 sunlodge: "Sun Lodge"
 sunlodge_adj: "Sun"
 sunlodge_adherent: "Sun-kissed"
 sunlodge_adherent_plural: "Sun-kissed"
 sunlodge_desc: "Helios mang đến lý trí và sự khéo léo cho những người sói tôn kính ông. Ông dạy Garou tiết chế bản năng và Phẫn Nộ bằng tư duy và logic. Nhờ vậy, những người theo ông thường trở thành nhà ngoại giao và đàm phán tài giỏi. Vấn đề lớn nhất khi đạt được một hiệp định đình chiến, hiệp ước hay liên minh thường là khiến phía bên kia lắng nghe lập luận mà nhân vật đưa ra. Helios coi trọng sự thật và công lý."
 
 moonlodge: "Moon Lodge"
 moonlodge_adj: "Moon"
 moonlodge_adherent: "Lunar"
 moonlodge_adherent_plural: "Lunars"
 moonlodge_desc: "Moon Lodge chuyên giúp đỡ tinh thần của sept và các nhóm, đồng thời duy trì mối quan hệ tốt đẹp với các linh hồn và làm mới ân sủng của Luna."
 
 ivorypriesthood: "Ivory Priesthood"
 ivorypriesthood_adj: "Ivory"
 ivorypriesthood_adherent: "Priest"
 ivorypriesthood_adherent_plural: "Priests"
 ivorypriesthood_desc: "Ít giống một phe phái hơn là các nhà nghiên cứu huyền bí tự phong của bộ tộc, Ivory Priests nghiên cứu những bí mật của sự sống và cái chết. Khi Sói Đầu Tiên chết để cứu Gaia, nó đã học được “Bí Mật của Cái Chết.” Ivory Priesthood là một hội kín gồm các Theurge của Fang, những người, sau khi trải qua một loạt thử thách và kiểm nghiệm tâm linh, bắt đầu học những bí mật tương tự về những gì nằm sau tấm màn của Cái Chết."
 
 greyraptors: "Grey Raptors"
 greyraptors_adj: "Raptor"
 greyraptors_adherent: "Raptor"
 greyraptors_adherent_plural: "Raptors"
 greyraptors_desc: "Một hội gồm các Silver Fang cố gắng trừng phạt những kẻ xúc phạm hay phớt lờ quyền cai trị cổ xưa của bộ tộc mình, Grey Raptors giữ kín danh tính của mình, nhưng hành động của họ lại công khai. Nỗi kinh hoàng và tra tấn là công cụ hàng ngày của họ trong nỗ lực thực thi những lời thề trung thành cổ xưa mà ít Garou ngoài Fang còn nhớ hay công nhận."
 
 mastersoftheseal: "Masters of the Seal"
 mastersoftheseal_adj: "Seal"
 mastersoftheseal_adherent: "Master"
 mastersoftheseal_adherent_plural: "Masters"
 mastersoftheseal_desc: "Không Child of Falcon nào sẽ thừa nhận mình là thành viên của trại này và cáo buộc ai đó như vậy sẽ dẫn đến yêu cầu thách đấu danh dự. Lý do rất đơn giản: Masters of the Seal đều là những tên trộm, đánh cắp bí mật từ các linh hồn và từ các bộ tộc khác. Trong khi họ giữ kín danh tính của mình, họ tiết lộ những gì đã học được cho những người khác trong bộ tộc có thể sử dụng thông tin đó để thúc đẩy tốt nhất lợi ích chung của Fang."

 stargazer_religion: "@werewolf_icon! Stargazers"
 stargazer_religion_adj: "Stargazers"
 stargazer_religion_adherent: "Stargazer"
 stargazer_religion_adherent_plural: "Stargazers"
 stargazer_religion_desc: "Vốn cô độc theo bản chất, Stargazers là những kẻ điềm tĩnh nhất và hướng nội nhất trong Garou, cũng như là bộ tộc nhỏ nhất còn lại. Luôn là người ngoài cuộc trong Quốc gia Garou, họ tự nhận mình là hậu duệ của các môn đồ của Klaital Starcatcher, một bậc hiền triết từ phương Đông từng rao giảng sự điều độ và hài hòa."

 stargazer: "Stargazers"
 stargazer_adj: "Stargazers"
 stargazer_adherent: "Stargazer"
 stargazer_adherent_plural: "Stargazers"
 stargazer_desc: "Vốn cô độc theo bản chất, Stargazers là những kẻ điềm tĩnh nhất và hướng nội nhất trong Garou, cũng như là bộ tộc nhỏ nhất còn lại. Luôn là người ngoài cuộc trong Quốc gia Garou, họ tự nhận mình là hậu duệ của các môn đồ của Klaital Starcatcher, một bậc hiền triết từ phương Đông từng rao giảng sự điều độ và hài hòa."

 heavenlysuccessors: "Heavenly Successors Of The Demon-Eater"
 heavenlysuccessors_adj: "Successors"
 heavenlysuccessors_adherent: "Successor"
 heavenlysuccessors_adherent_plural: "Successors"
 heavenlysuccessors_desc: "Bị nhiều người gọi là một giáo phái Ngày Tận Thế, Successors cống hiến bản thân để đánh bại và tiêu diệt những con quỷ hút linh hồn của Gaia như những khối u đói khát — tức là ma cà rồng và các loại xác sống khác. Khi không chiến đấu với những con quỷ của mình, các thành viên của trại này thường không thể phân biệt được với các Stargazer khác. Nhưng khi đối mặt với kẻ thù, họ khoác lên áo choàng xanh lá để tưởng nhớ Zhong Kuei, người đầu tiên trong số họ, và tấn công với lòng cuồng tín đơn nhất."

 innerpath: "Inner Path"
 innerpath_adj: "Inner Path"
 innerpath_adherent: "Pathfinder"
 innerpath_adherent_plural: "Pathfinders"
 innerpath_desc: "Một phe bí mật của Stargazers cống hiến để giành quyền kiểm soát Silver Fangs bằng thao túng và định hình chính sách từ bên trong. Họ tin rằng ai đó phải kiểm soát các lãnh đạo Garou điên loạn vì lợi ích của Gaia và Quốc gia nói chung. Họ rất kín đáo và hoạt động mà không có sự hiểu biết của các bậc thầy bộ tộc mình. Thay vì công khai thách thức Silver Fangs, Inner Path hợp tác với những kẻ bất mãn khác trong Quốc gia để đạt được mục tiêu của mình."

 klaitalpuk: "Klaital Puk"
 klaitalpuk_adj: "Puk"
 klaitalpuk_adherent: "Puk"
 klaitalpuk_adherent_plural: "Puk"
 klaitalpuk_desc: "Truyền thống nhất trong các trại Stargazer và có lẽ là trại có nhiều tín đồ nhất là Klaital Puk. Được dẫn dắt bởi hóa thân tái sinh của Klaital Star-catcher, Stargazer đầu tiên, Puk theo đuổi các nguyên tắc của người dẫn dắt mình để trau dồi giác ngộ. Họ cảm thấy rằng sự thấu hiểu từ trí tuệ nguyên bản đáng quý hơn trí tuệ từ một tâm trí bị vấy bẩn bởi thế giới hiện đại."

 sacredthread: "Sacred Thread"
 sacredthread_adj: "Sacred Thread"
 sacredthread_adherent: "Thread"
 sacredthread_adherent_plural: "Threads"
 sacredthread_desc: "Các thành viên của trại này cảm thấy rằng sự tập trung lấy người sói làm trung tâm của Quốc gia Garou sẽ là sự diệt vong của họ, và chỉ bằng cách chiến đấu với $glossary_wyrm$ nơi nó sinh sống — trong trái tim và tâm trí của nhân loại — mới có thể thực sự giành chiến thắng trong Cuộc Chiến. Sacred Thread du hành vào những trái tim đen tối nhất của các cộng đồng loài người và đóng vai trò là người hướng dẫn, cố vấn, và người thầy cho những người họ tìm thấy ở đó, cung cấp nhiều loại hình giáo dục để giúp củng cố tinh thần con người."

 trancerunners: "Trance Runners"
 trancerunners_adj: "Runners"
 trancerunners_adherent: "Runners"
 trancerunners_adherent_plural: "Runners"
 trancerunners_desc: "Đôi khi bị nhầm là thành viên của bộ tộc Silent Strider, trại này thuộc về một truyền thống cổ xưa. Lung-gompa — thiền định gió — ban cho họ sự dẻo dai thể chất để hoàn thành nhiệm vụ: truyền tải thông điệp, vật phẩm, và bí mật từ caern này sang caern khác hay triều đình này sang triều đình khác. Thông qua thiền định và các thực hành huyền bí khác, họ có thể đạt được trạng thái gần như không trọng lượng, cho phép họ chạy trên mặt nước, vượt qua những chướng ngại đáng sợ, và thực hiện những kỳ công khác về sự khéo léo, tốc độ, và sức bền."

 worldtree: "World Tree"
 worldtree_adj: "World Tree"
 worldtree_adherent: "Arborist"
 worldtree_adherent_plural: "Arborists"
 worldtree_desc: "World Tree tìm cách truyền bá giác ngộ không chỉ trong Garou mà còn đến loài người, pháp sư, và các Chủng Biến Hình. Họ cũng du hành xa hơn trong các cõi linh hồn so với hầu hết, đã học được cách gửi tâm trí mình vào [UmbraGlossaryLocalized('astral_reaches','Umbra Thiên Giới')] để tìm kiếm tri thức trong khi thân thể vẫn bén rễ nơi mặt đất."

 zephyr: "Zephyr"
 zephyr_adj: "Zephyr"
 zephyr_adherent: "Zephyr"
 zephyr_adherent_plural: "Zephyr"
 zephyr_desc: "Các thành viên của Zephyr du hành cùng các Garou khác, gia nhập các nhóm và truyền bá trí tuệ của mình qua tấm gương của bản thân. Trải nghiệm là mục tiêu của họ, vì trong những vận mệnh xoắn xuýt của nó họ hy vọng đạt được những tầm nhìn không thể có được bằng cách khác. Có người nói rằng Zephyr ban đầu được hình thành quanh một đạo tràng huấn luyện võ thuật Kailindo, nhưng giống như các linh hồn gió mà họ giao thiệp, họ không thể ở yên một chỗ quá lâu và lang thang cùng những cơn bão."

 anagamin: "Ana-gamin"
 anagamin_adj: "Ana-gamin"
 anagamin_adherent: "Ana-gamin"
 anagamin_adherent_plural: "Ana-gamin"
 anagamin_desc: "Được biết đến như “Những Kẻ Không Trở Lại,” một số người tin rằng Ana-gamin chỉ là một truyền thuyết. Tùy vào câu chuyện nào được kể, họ hoặc chấp nhận hoặc bắt cóc các thành viên bộ tộc mà họ cảm thấy xứng đáng đồng hành cùng họ trên hành trình xuyên qua [umbra|E]. Họ tìm cách giải thoát bản thân khỏi những xiềng xích của thực tại, và tin rằng chẳng bao lâu nữa, mọi Stargazer sẽ đến [umbra|E], thoát khỏi xiềng xích trần tục của mình, và không bao giờ quay lại Trái Đất."



 fera_outcasts_religion: "@werewolf_icon! Outcasts"
 fera_outcasts_religion_adj: "Outcast"
 fera_outcasts_religion_adherent: "Outcast"
 fera_outcasts_religion_adherent_plural: "Outcasts"
 fera_outcasts_religion_desc: "Ronin là những người sói, vì lý do này hay lý do khác, bị Quốc gia Garou ruồng bỏ.\nHầu hết Ronin đã vi phạm một điều khoản của Litany quá nhiều lần, khiêu khích một trưởng lão hay nhóm của mình, và một số thậm chí chọn cuộc sống này để thoát khỏi xã hội khắc nghiệt, phân cấp của Garou hoặc vì bị Harano áp đảo. Garou không phải là sinh vật đơn độc. Mọi bản năng của con người, sói, và Garou đều đòi hỏi sự bầu bạn của những thành viên khác cùng loài. Vì vậy, việc bị trục xuất khỏi thân tộc là một trong những bản án khủng khiếp nhất mà một Garou có thể đối mặt."

 ronin: "Ronin"
 ronin_adj: "Ronin"
 ronin_adherent: "Ronin"
 ronin_adherent_plural: "Ronin"
 ronin_desc: "Ronin là những người sói, vì lý do này hay lý do khác, bị Quốc gia Garou ruồng bỏ.\nHầu hết Ronin đã vi phạm một điều khoản của Litany quá nhiều lần, khiêu khích một trưởng lão hay nhóm của mình, và một số thậm chí chọn cuộc sống này để thoát khỏi xã hội khắc nghiệt, phân cấp của Garou hoặc vì bị Harano áp đảo. Garou không phải là sinh vật đơn độc. Mọi bản năng của con người, sói, và Garou đều đòi hỏi sự bầu bạn của những thành viên khác cùng loài. Vì vậy, việc bị trục xuất khỏi thân tộc là một trong những bản án khủng khiếp nhất mà một Garou có thể đối mặt."
 
 siberakh: "Siberakh"
 siberakh_adj: "Siberakh"
 siberakh_adherent: "Siberakh"
 siberakh_adherent_plural: "Siberakh"
 siberakh_desc: "Siberakh, hay Kẻ Ngoại Lai như họ tự gọi mình, là một chi hệ Garou người Nga có rất ít liên hệ với Quốc gia Garou. Vật Tổ của họ là Sable. Siberakh là hậu duệ của Silver Fangs từng nhận ra sự ngu ngốc của việc cận huyết để duy trì sự thuần khiết của dòng máu và thay vào đó chọn bạn đời từ dòng dõi Wendigo. Ngày nay, họ sống tách biệt trong vùng hoang dã Siberia, không được hầu hết Garou biết đến; chỉ có Wendigo và Silver Fangs biết về họ. Trong khi Silver Fangs xa lánh họ như Ronin để bảo vệ những tuyên bố về dòng dõi trong sạch của mình, Wendigo lại chấp nhận sự miễn cưỡng của Siberakh trong việc dính líu vào chính trị của Quốc gia Garou."



