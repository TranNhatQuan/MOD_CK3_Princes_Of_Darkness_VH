 ursine_religion: "@gurahl_icon! Ursine"
 ursine_religion_adj: "Ursine"
 ursine_religion_adherent: "Ursine"
 ursine_religion_adherent_plural: "Ursines"
 ursine_religion_desc: "Theo biên niên sử của chính họ, Gurahl từng là những người bảo vệ nguyên thủy của Gaia, được tạo ra để ngăn chặn sức mạnh hủy diệt của "Pattern Breaker". Khi nó trở nên quá mạnh đối với họ, họ đã cầu xin Gaia giúp đỡ, và vì vậy bà đã tạo ra Garou."
 
 riverkeepers: "River Keepers"
 riverkeepers_adj: "River Keepers"
 riverkeepers_adherent: "River Keeper"
 riverkeepers_adherent_plural: "River Keepers"
 riverkeepers_desc: "Những người bảo vệ và quản lý các dòng sông lớn nhỏ, River Keepers không chỉ bảo vệ các thủy lộ của Gaia mà còn đóng vai trò như pháp sư và người điều khiển thời tiết cho những người sống bên cạnh chúng."
 
 icestalkers: "Ice Stalkers"
 icestalkers_adj: "Ice Stalkers"
 icestalkers_adherent: "Ice Stalker"
 icestalkers_adherent_plural: "Ice Stalkers"
 icestalkers_desc: "Những kẻ mang đến Kỷ Băng Hà và là thân tộc của loài gấu Bắc Cực đáng sợ, Ice Stalkers là bộ tộc cực bắc nhất không chỉ trong Gurahl mà trong tất cả các Chủng Biến Hình."
 
