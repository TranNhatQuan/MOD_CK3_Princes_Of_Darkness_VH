 dreaming_sands: "Dreaming Sands"
 dreaming_sands_adj: "Dreaming"
 dreaming_sands_adherent: "Dreamer"
 dreaming_sands_adherent_plural: "Dreamers"
 dreaming_sands_desc: "Đôi biển song sinh của nước và cát là hai cực đối lập nhưng ngang hàng như nguồn gốc của trí tuệ. Mỗi hạt cát, mỗi giọt nước đều mang ký ức của những kẻ đã đến trước. Chính trong Dreamtime mà những ký ức này trở nên rõ ràng.\n\nHầu hết Dreamers sống phần lớn cuộc đời mình ở sa mạc sâu thẳm nhưng thường xuyên hành hương đến các đại dương và biển của thế giới. Một hành trình được thực hiện dễ dàng hơn nhờ đi theo Songlines; những lối đi Mnesis trong Dreamtime được tạo ra bởi Gumagan."


 dragons_zhong_guo: "Dragons of Zhong Guo"
 dragons_zhong_guo_adj: "Zhong Guo"
 dragons_zhong_guo_adherent: "Dragon"
 dragons_zhong_guo_adherent_plural: "Dragons"
 dragons_zhong_guo_desc: "Zhong Lung, những Con Rồng phương Đông, và những kẻ Cao Niên Nhất của Hengeyokai là những bậc hiền triết, học giả, và chiến binh của Thú Triều. Cùng với Emerald Mother (Gaia) và Sun, họ tôn kính Wani, Tổ Tiên Rồng của họ.\n\nGiống như Makara, họ tin vào Sự Cân Bằng, một nguyên tắc tối thượng chi phối toàn bộ vũ trụ. Sự Cân Bằng của âm và dương, ánh sáng và bóng tối, của [Glossary('Devisor', 'glossary_wyld_tt')], [Glossary('Designer', 'glossary_weaver_tt')], và [Glossary('Dissolver', 'glossary_wyrm_tt')], quan trọng hơn thiện tính hay ác tính vốn có của [Glossary('Three', 'glossary_triat_tt')]."


 emerald_memory: "Emerald Memory"
 emerald_memory_adj: "Emerald"
 emerald_memory_adherent: "Keeper"
 emerald_memory_adherent_plural: "Keepers"
 emerald_memory_desc: "Thú Triều chứa nhiều Mokolé khác ngoài Zhong Lung. Những Con Rồng có một vai trò rất vững chắc trong Triều đình; Makara và Gumagan thay vào đó phục vụ đúng mục đích của chi hệ mình, làm ký ức của Gaia. Emerald Memory bảo tồn và ghi chép lịch sử của Thú Triều và $glossary_fera$ khi Bánh Xe Kỷ Nguyên tiếp tục xoay. Họ cũng đóng vai trò cố vấn trong Triều đình để những sai lầm của quá khứ không bị lặp lại, ít nhất họ hy vọng vậy."


 eternal_breath: "Eternal Breath"
 eternal_breath_adj: "Eternal"
 eternal_breath_adherent: "Eternal"
 eternal_breath_adherent_plural: "Eternals"
 eternal_breath_desc: "Các tín đồ của Eternal Breath tin rằng chỉ có Mokolé sẽ tồn tại cho đến khi thế giới ngừng tồn tại. Không phải các #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L;bold Quỷ Máu#!#!, cũng không phải các $glossary_fera$ khác, và đặc biệt không phải các #TOOLTIP:GAME_TRAIT,mortal,[GetNullCharacter] #L;bold Con Khỉ Kiêu Hãnh Nhất#!#!. Thú Triều sẽ thất bại, các Chủng Biến Hình khác đã chứng minh rằng họ sẽ không bao giờ học được từ quá khứ. Chỉ thông qua việc làm chủ cơ thể và tinh thần của chính mình, Mokolé mới có thể tồn tại lâu hơn tất cả. Họ đã sống sót qua một Ngày Tận Thế, họ sẽ sống sót qua một lần nữa."







