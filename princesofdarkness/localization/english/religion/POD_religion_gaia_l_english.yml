 holy_order_dragons_chosen: "Dragon's Chosen"
 holy_order_blades_helios: "Blades of Helios"
 holy_order_avengers_lost: "Avengers of the Lost"
 holy_order_army_scales: "The Army of Scales"


 saurian_religion: "@mokole_icon! Saurian"
 saurian_religion_adj: "Saurian"
 saurian_religion_adherent: "Saurian"
 saurian_religion_adherent_plural: "Saurians"
 saurian_religion_desc: "Mokolé là những người thằn lằn, người cá sấu, weresaurian, và người rồng. Họ là hậu duệ của các Lizard Kings thời tiền sử, con đầu lòng của $glossary_fera$ và những đứa con được chọn của Helios. Vai trò của họ là làm ký ức của Gaia, một nhiệm vụ họ hoàn thành thông qua sức mạnh của Mnesis. Với Mnesis, một Mokolé có thể nhớ lại hàng ngàn đến hàng triệu năm trong quá khứ và lục lọi qua ký ức của tổ tiên mình."



 children_sobek: "Children of Sobek"
 children_sobek_adj: "Sobek"
 children_sobek_adherent: "Redeemer"
 children_sobek_adherent_plural: "Redeemers"
 children_sobek_desc: "Trong những ngày các vị thần còn bước đi trên Ai Cập cổ đại có Sobek, Tộc trưởng của Mokolé sông Nile. Sobek vĩ đại và Bầy của ông đã sát cánh cùng Osirians chống lại Set và lũ rắn độc ác của hắn. Dù sức mạnh kết hợp của họ, Osirians vẫn chịu thất bại. Set đã làm ô uế Sobek bằng những nghi lễ máu ghê tởm của hắn và biến ông thành Nghịch Đồ Mokolé đầu tiên và duy nhất.\nSobek bị ô uế đã ngủ say kể từ đó trong ngôi đền ẩn giấu của mình bên dưới Crocodilopolis cổ đại, cơn thịnh nộ thần thánh của ông bị kiềm chế. Những kẻ theo ông chưa quên ông, và tìm cách giải thoát ông cùng Khem khỏi sự ô uế của Setite. Nếu Thần Cá Sấu có thể được cứu rỗi và trở về với Ma'at thì khốn khổ cho kẻ thù của ông. Nếu không, khốn khổ cho chính tạo hóa."


 warriors_entoban: "Warriors of Entoban"
 warriors_entoban_adj: "Entoban"
 warriors_entoban_adherent: "Warrior"
 warriors_entoban_adherent_plural: "Warriors"
 warriors_entoban_desc: "Entoban, lục địa hòm cổ châu Phi, quê hương của nhân loại, cũng là quê hương của dòng Mokolé cổ xưa nhất. Được gọi là các chiến binh của Dòng Rồng, họ đã bị tấn công không ngừng trong các Cuộc Chiến Phẫn Nộ; lòng căm thù cực độ của họ đối với Garou chỉ đơn thuần phản ánh sự ngược đãi của chính Garou đối với họ. Giờ đây họ đã đảm nhận nhiệm vụ bảo vệ Entoban và che chở cho các chi hệ $glossary_fera$ khác còn sót lại ở đó. Tội ác của Garou sẽ bị báo thù, và Mokolé không bao giờ quên."


 cosmic_order: "Cosmic Order"
 cosmic_order_adj: "Cosmic"
 cosmic_order_adherent: "Seeker"
 cosmic_order_adherent_plural: "Seekers"
 cosmic_order_desc: "Mokolé của Ấn Độ xem Mặt Trời là nguồn giác ngộ của họ và Agni là sức mạnh của họ. Họ tin vào Rta (Trật Tự Vũ Trụ) và rằng nó có trước Jya (Gaia) và sẽ tồn tại sau bà. Dưới Jya, họ đặt Trimurti gồm Đấng Sáng Tạo, Đấng Bảo Tồn và Đấng Hủy Diệt. Những niềm tin độc đáo này chịu ảnh hưởng từ các tín ngưỡng phàm nhân trong Ấn Độ, mà Mokolé đã hòa hợp cùng.\nMọi thứ đều có mục đích, họ ở đây để tìm ra mục đích của mình."

