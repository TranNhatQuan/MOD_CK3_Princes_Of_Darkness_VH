 #Naktanchara Faith
 naktanchara: "Naktanchara"
 naktanchara_adj: "Naktanchara"
 naktanchara_adherent: "Naktanchara"
 naktanchara_adherent_plural: "Naktanchara"
 naktanchara_desc: "Đức tin Naktanchara kết hợp các yếu tố của Phật giáo Mật tông, tín ngưỡng linh hồn, tín ngưỡng Nāga truyền thống cũng như Ấn Độ giáo. Những người theo Naktanchara được xem là Phật tử, dù các thực hành của họ bị coi là phần nào không chính thống."
 
