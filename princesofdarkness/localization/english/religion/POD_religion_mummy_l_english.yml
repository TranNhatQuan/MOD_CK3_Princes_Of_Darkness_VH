 #Mummy-Group Faiths

 code_of_horus: "Luật Lệ Horus"
 code_of_horus_adj: "Wat Hor"
 code_of_horus_adherent: "Shemsu-Heru"
 code_of_horus_adherent_plural: "Shemsu-Heru"
 code_of_horus_desc: "Luật Lệ Horus, còn gọi là Wat Hor, là tập hợp các giáo huấn của Horus dành cho tín đồ. Nó tóm lược lại những bài học và trải nghiệm suốt đời của ngài, chứa mọi chỉ dẫn từng được trao cho một Xác Ướp mới được tạo ra từ những ngày xa xưa của Ai Cập cổ đại."
  
 ishmaelite: "Ishmaelite"
 ishmaelite_adj: "Ishmaelite"
 ishmaelite_adherent: "Ishmaelite"
 ishmaelite_adherent_plural: "Ishmaelites"
 ishmaelite_desc: "Những Ishmaelite là các Shemsu-Heru phản loạn đã từ bỏ cuộc thập tự chinh của Horus vì nhiều lý do khác nhau. Họ được đặt tên theo Ishmael, Shemsu-Heru đầu tiên dám lên tiếng chống lại quyền lãnh đạo của Horus và bị đày đọa lang thang cô độc đến vĩnh hằng."
 
 faces_of_apophis: "Diện Mạo của Apophis"
 faces_of_apophis_adj: "Diện Mạo"
 faces_of_apophis_adherent: "Xác Ướp Tà Linh"
 faces_of_apophis_adherent_plural: "Xác Ướp Tà Linh"
 faces_of_apophis_desc: "$glossary_wyrm_apophis$ là cội nguồn của mọi tai ương thế gian, hiện thân tối thượng của Isfret. Từ thuở khai thiên lập địa, Apophis đã tồn tại, làm ô uế và hủy hoại các nguyên lý của Ma'at. Đó là kẻ lừa lọc tối thượng, bóng tối áp đảo và sự đồi bại không ngừng nghỉ, đang giày vò thế gian này."
 
 cabiri: "Cabiri"
 cabiri_adj: "Cabiri"
 cabiri_adherent: "Cabirus"
 cabiri_adherent_plural: "Cabiri"
 cabiri_desc: "Rất lâu sau khi Phép Thuật Sự Sống được tạo ra và Horus cùng những tín đồ của ngài phát động cuộc chiến chống lại Sutekh và bè lũ của hắn, một trong các Ishmaelite đã truyền dạy các nguyên lý của Phép Thuật Sự Sống cho một pháp sư tài năng tên là Cabirus. Cabirus đã dùng điều này để tạo ra Phép Thuật Sự Sống của riêng mình và tạo nên những kẻ bất tử của chính hắn, không hề biết gì về Osiris và Ma'at — khiến các Shemsu-Heru kinh hoàng tột độ."
 
 ten_mandates_of_heaven: "Mười Điều Răn của Thiên Đình"
 ten_mandates_of_heaven_adj: "Điều Răn"
 ten_mandates_of_heaven_adherent: "Wu T'ian"
 ten_mandates_of_heaven_adherent_plural: "Wu T'ian"
 ten_mandates_of_heaven_desc: "Mười Điều Răn của Thiên Đình là các luật lệ và giáo huấn dành cho Wu T'ian, do Bát Tiên đặt ra dưới sự cai quản của [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')]. Mỗi Điều Răn đều quan trọng ngang nhau, và mỗi vị tiên có danh sách ưu tiên riêng để tuân theo, tùy vào tính cách và sở trường của mình."

 ten_mandates_of_hell: "Nô Lệ của các Diêm Ma Vương"
 ten_mandates_of_hell_adj: "Nô Lệ"
 ten_mandates_of_hell_adherent: "Wu Kuei"
 ten_mandates_of_hell_adherent_plural: "Wu Kuei"
 ten_mandates_of_hell_desc: "Đồn rằng các [Glossary('Yama Kings','podgloss.yamaking')] đã tạo ra những nô lệ Bất Tử của riêng mình để chống lại Gia Tộc Thiên Đình."

