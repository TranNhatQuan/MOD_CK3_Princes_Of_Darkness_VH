l_english: 

 burning_faith_name: "Đức Tin Rực Cháy"
 burning_faith_doctrine_name: "Đức Tin Rực Cháy"
 burning_faith_doctrine_desc: "Theo đuổi một chính nghĩa ngay thẳng, chẳng có gì mà những con người có ý chí và niềm tin mạnh mẽ không thể đạt được."
 undead_aesir_name: "Aesir Bất Tử"
 undead_aesir_doctrine_name: "[Glossary('Einherjar','game_concept_einherjar_desc')] Được Hồi Sinh"
 undead_aesir_doctrine_desc: "Các Chiến Binh của Canarl khao khát vinh quang và chiến trận, và bị những kẻ yếu $pod_cainites$ khiếp sợ một cách chính đáng."
 restored_republic_name: "Cộng Hòa Được Khôi Phục"
 restored_republic_doctrine_name: "Viện Nguyên Lão Đang Họp"
 restored_republic_doctrine_desc: "Đối với một định chế $pod_cainite$, Viện Nguyên Lão cởi mở đến bất ngờ. Nhưng cũng không kém phần căng thẳng và đẫm máu so với những định chế khác."
 senatorial_clans_name: "Bằng Hữu của Nền Cộng Hòa"
 senatorial_clans_doctrine_name: "Các Clan Nguyên Lão"
 senatorial_clans_doctrine_desc: "Viện Nguyên Lão chưa quên sự phản bội của Michael thành Constantinople hay Carthage. Các 'Clan' truỵ lạc của họ không được chào đón trong những sảnh đường thiêng liêng của Viện Nguyên Lão."
 vengeful_carthage_name: "Carthage Báo Thù"
 vengeful_carthage_doctrine_name: "Không Tưởng Không Khoan Nhượng"
 vengeful_carthage_doctrine_desc: "Carthage còn cả một chuỗi thế hệ những mối oan khuất cần được rửa sạch. Bằng máu của những kẻ phản bội người La Mã, càng tốt."
 broken_hope_name: "Hy Vọng Tan Vỡ"
 broken_hope_doctrine_name: "Không Tưởng Thất Bại"
 broken_hope_doctrine_desc: "Carthage Mới chỉ là một công cụ chính trị vô hồn. Tinh thần của những Prometheus chân chính đã bị nghiền nát bởi thất bại mới này."
 secure_anda_name: "Bảo Vệ [Glossary('Anda','podgloss.anda')]"
 secure_anda_doctrine_name: "Quản Lý Một Đế Quốc"
 secure_anda_doctrine_desc: "Từ những kẻ hiếu chiến lão luyện, [Glossary('Anda','podgloss.anda')] cũng trở thành những chính khách tài ba, tận dụng sự khoan dung tôn giáo của những người anh em Mông Cổ của họ làm nền tảng."
 crimsom_curia_name: "Giáo Triều Đỏ Thẫm"
 crimsom_curia_doctrine_name: "Tòa Nod Được Khôi Phục"
 crimsom_curia_doctrine_desc: "Hội đồng giáo sĩ được khôi phục của Giáo Hội Caine Đệ Tam đang xử lý công việc thường nhật... nhưng cũng đang kêu gọi mở rộng quyền cai quản của Giáo Hội trước khi Đấng Cứu Thế đến."
 militarized_experiments_name: "Xưởng Kinh Hoàng"
 militarized_experiments_doctrine_name: "Thí Nghiệm Quân Sự Hóa"
 militarized_experiments_doctrine_desc: "Những nghịch đồ và quái vật méo mó nay được $pod_clan$ Tzimisce sử dụng thường xuyên hơn nữa làm lính xung kích."
 warden_network_name: "Mạng Lưới Quản Giáo"
 warden_network_doctrine_name: "Tai Mắt Khắp Nơi"
 warden_network_doctrine_desc: "Order of Moloch giờ đây đoàn kết hơn bao giờ hết, đảm bảo rằng bất kỳ quản giáo nào cũng có thể tìm được trợ giúp ở bất cứ đâu."
 knights_acre_name: "Hiệp Sỹ Acre"
 knights_acre_doctrine_name: "Thanh Gươm của Chúa Đã Sẵn Sàng"
 knights_acre_doctrine_desc: "Các Hiệp Sỹ dũng cảm nay đã toàn tâm toàn ý cho mục đích của Inquisition, sẵn sàng trút cơn thịnh nộ thánh thần lên lũ quái vật địa ngục."
 oculi_dei_name: "Oculi Dei"
 oculi_dei_doctrine_name: "Những Con Mắt Cảnh Giác"
 oculi_dei_doctrine_desc: "Oculi Dei đã kiềm chế những thành viên đa nghi thái quá của mình, khiến nó trở thành một lực lượng còn đáng gờm hơn nữa để chống lại Cái Ác."
 sisters_stjohn_name: "Nữ Tu của Thánh John"
 sisters_stjohn_doctrine_name: "Sự Chăm Sóc Thánh Thiện"
 sisters_stjohn_doctrine_desc: "Các Nữ Tu là trái tim của Inquisition, chính là tảng đá nâng đỡ nó vượt qua bóng tối đang len lỏi."
 red_order_name: "Hội Đỏ"
 red_order_doctrine_name: "Những Người Canh Giữ Cẩn Trọng"
 red_order_doctrine_desc: "Hội Đỏ là người gìn giữ những bí mật của Inquisition. Và họ chỉ tiết lộ tri thức của mình với sự thận trọng tột độ."
 von_murnau_name: "Gia Tộc Von Murnau"
 von_murnau_doctrine_name: "Chó Săn của Chúa"
 von_murnau_doctrine_desc: "Gia tộc người Đức này đã toàn tâm toàn ý cho chính nghĩa của Inquisition, đem toàn bộ nguồn lực đáng kể của mình ra góp sức."
 great_awakening_name: "Đại Thức Tỉnh"
 great_awakening_doctrine_name: "Đại Thức Tỉnh"
 great_awakening_doctrine_desc: "Những Kẻ Ruồng Bỏ của Calomena từ lâu đã cố gắng truyền đạt chân lý được hé lộ cho họ tới đại chúng, nhưng nay họ không còn phải chật vật nữa. Bất cứ nơi nào họ thuyết giảng, dân chúng đều lắng nghe và đi theo."
 champions_gaia_name: "Nhà Vô Địch của Gaia"
 champions_gaia_doctrine_name: "Nhà Vô Địch của Gaia"
 champions_gaia_doctrine_desc: "Gaia hoàn toàn tự hào về những kẻ bảo vệ dũng cảm nhất của mình. Garou đoàn kết dưới ngọn cờ của họ, cuối cùng cũng cứu thế giới khỏi ngày tận thế."
 under_wufeng_cause_name: "Dưới Chính Nghĩa của Wu Feng"
 under_wufeng_cause_doctrine_name: "Dưới Chính Nghĩa của Wu Feng"
 under_wufeng_cause_doctrine_desc: "Hòa bình mang lại hy vọng, hy vọng mang lại chữa lành, chữa lành mang lại sự sống. Trong tất cả những điều này, địa ngục đều bị đánh bại."
 special_doctrine_is_wufeng_faith_name: "Wu Feng"
 special_doctrine_is_wufeng_faith_desc: "Hòa bình mang lại hy vọng, hy vọng mang lại chữa lành, chữa lành mang lại sự sống. Trong tất cả những điều này, địa ngục đều bị đánh bại."
 doctrine_parameter_hostility_override_special_doctrine_is_wufeng_faith: "[faiths|E] có [doctrine|E] [GetFaithDoctrine('under_wufeng_cause_doctrine').GetBaseName] được coi là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 hostility_override_under_wufeng_cause_doctrine: "[faiths|E] theo Wu Feng được coi là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 
 hunter_schism_mended_name: "Ly Giáo Thợ Săn Đã Được Hàn Gắn"
 special_doctrine_hunter_schism_mended_name: "Ly Giáo Thợ Săn Đã Được Hàn Gắn"
 special_doctrine_hunter_schism_mended_desc: "Shadow Inquisition nay đã nằm dưới sự cai quản của chúng ta."
 doctrine_parameter_access_to_holy_arts: "Được tiếp cận Thánh Thuật"

 theurgist_ordination_name: "Lễ Tấn Phong Nhà Thần Thuật"
 special_doctrine_theurgist_ordination_name: "Lễ Tấn Phong Nhà Thần Thuật"
 special_doctrine_theurgist_ordination_desc: "Thần Thuật nay đã trở thành một phần cốt lõi trong những gì chúng ta truyền dạy cho đệ tử."
 doctrine_parameter_theurgist_ordination: "Đệ tử sẽ nhận được [trait|E] [GetTrait('theurgist').GetName( GetPlayer )] khi được tấn phong."

 sorcerer_ordination_name: "Lễ Tấn Phong Pháp Sư"
 special_doctrine_sorcerer_ordination_name: "Lễ Tấn Phong Pháp Sư"
 special_doctrine_sorcerer_ordination_desc: "Pháp thuật nay đã trở thành một phần cốt lõi trong những gì chúng ta truyền dạy cho đệ tử."
 doctrine_parameter_sorcerer_ordination: "Đệ tử sẽ nhận được [trait|E] [GetTrait('sorcerer').GetName( GetPlayer )] khi được tấn phong."

 psychic_shunned_name: "Người Có Năng Lực Ngoại Cảm Bị Xa Lánh"
 special_doctrine_psychic_shunned_name: "Người Có Năng Lực Ngoại Cảm Bị Xa Lánh"
 special_doctrine_psychic_shunned_desc: "Những người sinh ra với năng lực ngoại cảm bị giáo phái này ngờ vực. Đó có thể là một món quà từ Chúa... nhưng cũng có thể là một dấu ấn từ Quỷ Dữ."

 revelations_piyau_name: "Giáo Huấn của Piyau Payung"
 revelations_piyau_hunger_doctrine_name: "Giáo Huấn về Cơn Đói"
 revelations_piyau_hunger_doctrine_desc: "#italic "Khi ngươi đói, hãy ăn. Nếu không có thức ăn, hãy cướp lấy từ kẻ yếu hơn mình, hoặc trộm lấy từ kẻ mạnh nhưng ngu ngốc. Nếu ngươi không thể ăn, thì hãy chịu đói." #!"
 revelations_piyau_sex_doctrine_name: "Giáo Huấn về Ân Ái"
 revelations_piyau_sex_doctrine_desc: "#italic "Hãy ân ái khi ngươi khao khát. Nếu ngươi không tìm được bạn tình sẵn lòng, hãy chiếm lấy thứ ngươi muốn, hoặc dùng người chị em ăn mặc đẹp đẽ hơn của việc chiếm đoạt, đó là quyến rũ.\nHãy sinh sôi, vì con cái là sức mạnh của cha mẹ chúng và sẽ tiếp nối dòng máu cùng sứ mệnh của cha mẹ ngay cả khi cha mẹ không còn tồn tại nữa. Nếu ngươi không thể sinh ra hậu duệ thành công, thì hãy chết trong cô độc và bị lãng quên." #!."
 revelations_piyau_glory_doctrine_name: "Giáo Huấn về Vinh Quang"
 revelations_piyau_glory_doctrine_desc: "#italic "Hãy vinh quang trong chính mình và tận hưởng những gì ngươi có thể, bởi vì khổ đau, xung đột và phiền muộn sẽ là bạn đồng hành thường trực của ngươi trong cõi bất tử. Ngươi sẽ không tìm thấy nhiều cơ hội để tận hưởng bản thân, ngay cả trong một sự tồn tại lâu dài như của chúng ta." #!"

 
 
 
 
 