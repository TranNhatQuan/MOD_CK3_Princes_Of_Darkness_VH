 solstice_court_trucebearers_desc: "Trong khi phần lớn bị lờ đi, coi thường hay đơn giản là khinh miệt, fae Mùa Giao cũng có thể trở thành những nhà ngoại giao với kỹ năng và sự hữu dụng phi thường, nhờ lập trường không thiên vị của họ trong toàn bộ cuộc xung đột. Là nhà ngoại giao, người đưa tin, gián điệp và đại sứ, fae Mùa Giao ở trong yếu tố của riêng mình. Đám Truce-Bearer Vô Triều đình là những cá nhân đơn độc hay các nhóm fae nhỏ nhiệt thành hoạt động trong đấu trường xã hội để lay chuyển các triều đình địa phương hướng đến hòa bình. Không có gì lạ khi họ hiếm khi thành công, nhưng điều đó chỉ càng thổi bùng ngọn lửa trong lòng họ. Hòa bình, bất kể cái giá phải trả, là thiên chức của họ."

 solstice_court_humanists: "Solstice Court Humanists"
 solstice_court_humanists_adj: "Solstice Court Humanist"
 solstice_court_humanists_adherent: "Solstice-kin Humanist"
 solstice_court_humanists_adherent_plural: "Solstice-kin Humanists"
 solstice_court_humanists_desc: "Rất ít fae Mùa Giao mạo hiểm tiếp xúc lâu dài với loài người, vì họ không thể rèn nên những lời thề phép thuật với người phàm. Số ít đám Vô Triều đình theo chương trình nghị sự Nhân Đạo bị thu hút bởi loài người như thiêu thân lao vào lửa. Phe Nhân Đạo không nhất thiết cổ vũ lòng tốt và sự bao dung khi ứng xử với cõi người, mà thay vào đó ôm lấy một đạo lý chủ yếu quan tâm đến việc thấu hiểu loài người."

 solstice_court_constantinians: "Solstice Court Constantinians"
 solstice_court_constantinians_adj: "Solstice Court Constantinian"
 solstice_court_constantinians_adherent: "Solstice-kin Constantinian"
 solstice_court_constantinians_adherent_plural: "Solstice-kin Constantinians"
 solstice_court_constantinians_desc: "Fae của Triều đình Mùa Giao, đã bác bỏ Chiến tranh Mùa và các giá trị của các triều đình theo Mùa, có lẽ là những kẻ cởi mở nhất với việc từ bỏ lý tưởng Fae để tìm kiếm sự cải đạo vào Giáo hội. Giá như có cách nào đó để họ vừa giữ được bản chất fae của mình qua phép rửa tội vừa có thể đạt được quyền năng của đức tin chân chính." 

