 winter_court_militants_desc: "Rất nhiều fae nóng lòng mong Hiệp ước Đình chiến kết thúc để họ có thể trở lại cuộc giao tranh của Chiến tranh Mùa. Những cảm xúc mãnh liệt được khơi dậy từ nghi lễ Sained gia nhập một Triều đình là thứ dữ dội. Đám Winter-kin Militant tin chắc rằng lối sống của họ mới là con đường đúng đắn—rằng kẻ mạnh nhất xứng đáng cai trị. Việc chiến tranh của fae tái diễn không phải điều gieo rắc nỗi kinh hoàng trong trái tim lạnh giá của họ. Đó là tín hiệu cho thấy trận chiến quyết định vận mệnh thế giới cuối cùng cũng có thể bắt đầu.\n\nĐám Winter-kin man rợ nhất trong tất cả các fae, chúng ẩn nấp dưới những cây cầu và trong rừng sâu tăm tối. Là những chiến binh hung tợn, chúng săn đuổi loài người, cảm giác hồi hộp của những cuộc săn ban đêm, vị máu và nỗi sợ hãi—đó mới là những thứ hợp khẩu vị chúng. Chúng khao khát Chiến tranh Mùa để có thể nhấn chìm thế giới vào một đêm đen tối, man rợ."

