 spring_court_desc: "Trong thời đại mới của cả đức tin và sự bất định này, Triều đình Mùa Xuân tìm cách thấu hiểu và hàn gắn những vết thương đã tạo ra giữa loài người và fae. Trong Chiến tranh Mùa, họ là những chiến binh hăng hái, khao khát giành chiến thắng một lần và mãi mãi; và trong cõi người, họ tìm cách giành lại vị thế liên quan đến loài người và được sợ hãi lẫn kính trọng một lần nữa.\n\nTriều đình của sự đổi thay và nghịch lý, fae Mùa Xuân nỗ lực thay đổi mọi thứ theo hướng có lợi cho mình, trước khi loài người quên lãng họ, hoặc trục xuất fae vĩnh viễn. Nếu bế tắc như vậy xảy ra, toàn bộ Chiến tranh Mùa và mọi nỗ lực khác sẽ đi đến một hồi kết vô nghĩa."
 
