 winter_court_desc: "Man rợ nhất trong tất cả các fae, đám Winter-kin ẩn nấp dưới những cây cầu và trong rừng sâu tăm tối. Dù là những chiến binh hung tợn, phần lớn bọn họ không mấy háo hức trước việc Hiệp ước Đình chiến kết thúc. Chiến tranh có tổ chức không phải sở thích của họ, nhưng săn đuổi loài người, cảm giác hồi hộp của những cuộc săn ban đêm, vị máu và nỗi sợ hãi—đó mới là những thứ hợp khẩu vị họ. Chỉ có ý niệm nhấn chìm thế giới vào một đêm đen tối, man rợ mới thúc đẩy họ tham gia Chiến tranh Mùa."
 
