# Solstice Court
# Vô Triều đình và tản mác, đám unSained là phe trung lập trong Chiến tranh Mùa. Trong khi phần lớn bị lờ đi, coi thường hay đơn giản là khinh miệt, fae Mùa Giao cũng có thể trở thành những lính đánh thuê và nhà ngoại giao với kỹ năng và sự hữu dụng phi thường, nhờ lập trường không thiên vị của họ trong toàn bộ cuộc xung đột. Một fae Mùa Giao có thể vừa là một ân huệ lớn lao cho một oathcircle, vừa là một gánh nặng lớn lao, tùy thuộc vào fae địa phương và quan điểm của họ—và kỹ năng cá nhân của Solstice-king. Nhiều kẻ trong số họ hoàn toàn phớt lờ xã hội fae và tồn tại ở rìa các lãnh địa, trong khi những kẻ khác tự tạo dựng cuộc sống mà họ có thể như những kiếm sĩ đánh thuê và người đưa tin cho các Triều đình cao quý và hùng mạnh.

# Đám fae Vô Triều đình lần đầu xuất hiện sau khi luật cai trị theo mùa được thiết lập. Một số fae, theo lời kể, đã từ chối trở thành một phần của luật cai trị theo mùa. Họ sẽ không chấp nhận gì kém hơn quyền cai trị thực sự. Phần lớn Fae xem thái độ này với sự thích thú và khinh bỉ, và trục xuất những fae như vậy khỏi Triều đình của họ. Những kẻ bị ruồng bỏ này lang thang từ nơi này sang nơi khác, và cuối cùng bắt đầu hành động như người đưa tin và lính đánh thuê để sinh tồn. Fae Mùa Giao, như cách họ được biết đến ngày nay, vẫn thực hiện những nhiệm vụ đó cho đến hôm nay.
 
# Solstice Poem:

# We have no great song. No poem. No words. And yet,we are beholden to none; slaves to

# neither the seaons' turning nor destiny's wheel.
# Họ bị Triều đình Mùa Xuân thương hại, bị các Triều thần Mùa Thu coi thường, bị đám Winter-kin căm ghét, và bị fae Mùa Hạ công khai khinh miệt. Tuy nhiên, lời buộc tội chính nhắm vào fae Mùa Giao lại là sự ngu ngốc. Sự thật là một fae vẫn còn unSained và không liên minh với một Triều đình được chọn thì không có quyền đối với cõi người một khi Chiến tranh Mùa kết thúc.
# Mọi fae Sained, ngay cả khi không phải chiến binh hay binh lính, đều tin rằng ý thức hệ của Triều đình mình là chân lý và kế hoạch tốt nhất cho trật tự thế giới mới. Trước sự tận tụy và cuồng tín như vậy, fae Mùa Giao đơn giản nhún vai và tuyên bố không quan tâm, không trung thành và không mong muốn tham gia vào phần thưởng cuối cùng—chính thế giới này.
# Việc phần lớn fae Mùa Giao thậm chí không giữ lời thề nào với loài người khiến tình cảnh của họ thêm một tầng bất lợi. Những lời thề, ở dạng cơ bản nhất, là những tấm khiên chống lại banality. Fae Mùa Giao, thiếu ngay cả sự phòng vệ cơ bản này cho linh hồn unSained của mình, do đó dễ tổn thương trong cõi người.
# Danh tiếng của phe này còn bị bôi nhọ thêm bởi lời vu khống của Triều đình Mùa Đông và Mùa Hạ, vì cả hai đều có những phe nội bộ nắm giữ những truyền thuyết mơ hồ khẳng định rằng toàn bộ Chiến tranh Mùa được khơi mào bởi một phe của fae Mùa Giao được biết đến với tên Bè Đảng Drail là sự thật. Một vài fae còn sống ngày nay tự nhận đã gặp Drail, dù các cuộc gặp gỡ của họ với hắn hẳn đã diễn ra nhiều năm sau khi Chiến tranh Mùa bắt đầu. Đó không phải là một cái tên được nhắc đến với sự tử tế.
# Bất chấp những điểm yếu bị nhìn nhận của họ, lính đánh thuê Mùa Giao là lựa chọn hàng đầu để thuê mướn trong Chiến tranh Mùa. An toàn hơn khi thuê dịch vụ của fae Mùa Giao so với bất kỳ fae Sained nào, vì đám Vô Triều đình không có lòng trung thành định trước hay đã thề nguyền từ trước. Là binh lính, nhà ngoại giao, người đưa tin, gián điệp và đại sứ, fae Mùa Giao ở trong yếu tố của riêng mình.
# Tất nhiên, ai cũng có một cái giá. Fae Mùa Giao không phải ngoại lệ, và có khả năng một kẻ được thuê sẽ đào tẩu hay phản bội thông tin bí mật. Đây luôn là một rủi ro cho người thuê, nhưng nhiều fae Mùa Giao đã giành được danh tiếng đáng tin cậy qua nhiều năm chuyên cần, nỗ lực và xung đột.
# Với gốc rễ hỗn loạn như vậy, không có gì ngạc nhiên khi fae Mùa Giao không được phân chia đều giữa ba Nguồn Gốc. Firstborn đông đảo nhất, theo sau là inanimae và changeling. Dù không hẳn hiếm, changeling chắc chắn ít hơn nhiều so với các Nguồn Gốc khác do việc fae Mùa Giao thiếu lời thề và mối quan hệ gắn liền với loài người. Firstborn Mùa Giao nổi tiếng kiêu hãnh và khó ứng xử trừ khi được thể hiện thái độ tôn trọng. Nhiều kẻ theo tín ngưỡng Solstice-kin này xem mình là tinh hoa của tinh hoa—họ là fae huyết thống thuần khiết, vượt trên những giới hạn mà fae bị ràng buộc Triều đình phải chịu đựng. Trên thực tế, chính những fae này đặc biệt nóng lòng mong Hiệp ước Đình chiến cuối cùng sụp đổ, để họ có thể bắt đầu nhận các hợp đồng quân sự bên cạnh việc đàm phán và ngoại giao. Đây thường là những Solstice-kin trở thành những kẻ được thuê mướn đáng mong muốn và hăng hái nhất.
# Khi Chiến tranh Mùa sắp bùng nổ trở lại, và các Triều đình, phe phái cùng chương trình nghị sự đang phình to với những căng thẳng và ý thức hệ xung đột, gần như không cần phải nói rằng fae Mùa Giao sẽ chứng kiến rất nhiều hoạt động trong thời gian tới—hoặc là kẻ kích động và lính đánh thuê nếu họ khôn khéo và cẩn trọng... hoặc chỉ đơn thuần là bia đỡ tên nếu không.
 
