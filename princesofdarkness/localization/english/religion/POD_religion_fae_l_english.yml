 winter_court_religion_adherent_plural: "Winter-kin"
 winter_court_religion_desc: "Những con quái vật trong truyền thuyết loài người, những sinh vật trong bóng tối đêm đen—đám Winter-kin sống để gieo rắc nỗi kinh hoàng cho loài người. Phần lớn khinh miệt Chiến tranh Mùa, Triều đình này đã đánh mất phần lớn động lực để cuối cùng chiến thắng các phe phái khác, giờ đây xem chúng gần như không đáng để ý. Fae Mùa Đông dường như không có khả năng đồng cảm với loài người, không có nền tảng hay điểm khởi đầu nào để thấu hiểu người phàm và cuộc đời họ. Changeling (và phe Nhân Đạo) hiếm khi xuất hiện ở triều đình này."

 winter_court: "Winter Court"
 winter_court_adj: "Winter Court"
 winter_court_adherent: "Winter-kin"
