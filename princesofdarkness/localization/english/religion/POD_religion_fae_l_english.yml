 summer_court_constantinians_desc: "Một số Summer-kin nhìn thấy sự phản chiếu niềm tin của chính họ trong tầm quan trọng của việc thực hành nghi lễ và tôn ti trật tự trong Giáo hội. Cơ Đốc giáo đã tồn tại và thậm chí phát triển mạnh mẽ hơn một thiên niên kỷ—vừa đủ lâu như một thể chế để giành được sự tôn trọng miễn cưỡng từ một số thành viên Triều đình Mùa Hạ. Đối với nhiều changeling Mùa Hạ, Giáo hội dường như vĩnh cửu và bất biến như true fae vậy. Đám Summer-kin Constantinian tìm cách rút ra những truyền thống cổ xưa của Cơ Đốc giáo, từ sự phục sinh của Chúa Giêsu được mô tả như bình minh cho đến nỗi ám ảnh của Constantine với Sol Invictus. Hãy để có ánh sáng!"
 
# Autumn Court
# Fae của Triều đình Mùa Thu tìm cách giấu đi bản chất thật sự của mình khỏi loài người, thống trị và thao túng họ từ phía sau những vỏ bọc của những ân nhân bí ẩn. Fae Mùa Thu, giống như đám Spring-kin, nhận ra rằng người phàm đang dần thay thế sự hiện diện của fae trong đời sống của họ bằng những lời cầu khấn tới một vị Thần xa xôi. Nhiều kẻ nỗ lực thấu hiểu lập trường mới của loài người và khôi phục vị thế của mình như những lãnh chúa nửa ẩn mình, trong khi những kẻ khác tìm cách dùng loài người và những lời thề cũ như vũ khí trong Chiến tranh Mùa. Người phàm, với mọi sự yếu đuối và nhược điểm của họ, vẫn hữu ích nhờ những lời thề ràng buộc họ—hữu ích cả như tấm khiên chống lại banality lẫn như đồng minh trong cuộc xung đột sắp tới.
# Bị mê hoặc bởi loài người, thậm chí còn hơn cả phần lớn fae, đám Autumn-kin trầm tư và khôn khéo. Thề nguyền với một fae Mùa Thu chẳng khác gì thỏa thuận với ác quỷ—quyến rũ, trao quyền năng và thường gây chết chóc khi tính sổ cuối cùng. Fae Mùa Thu nhìn loài người và đức tin của họ với sự kinh ngạc và tham vọng, và trong tất cả các fae, họ là kẻ hiểu rõ nhất rằng giai đoạn tiếp theo của Chiến tranh Mùa hoàn toàn phụ thuộc vào việc ứng xử với loài người.

# Autumn Poem:
# The falling colors of dusk descent with the waning leaves,
# Just as a butterfly's wings are a warning; their beauty deceives,
# For as their color spills like ink; they are dying
# Sure as the season's mists whisper it so,
# The vibrancy is a facade, as Autumn persists in lying.
 
# Khi Hiệp ước Đình chiến gần đến hồi kết, fae Mùa Thu dồn sự chú ý vào hai yếu tố mà họ tin sẽ thay đổi mọi thứ. Triều đình Mùa Xuân chịu sự giằng xé của quá nhiều hướng đi, trong khi Triều đình Mùa Hạ tàn nhẫn theo đuổi một mục tiêu duy nhất, và Triều đình Mùa Đông phần lớn vẫn mập mờ. Nhiều thành viên Triều đình Mùa Thu thích xem mình là điềm tĩnh hơn những đồng loại mùa khác trong thời điểm này; và ở một mức độ lớn, họ đúng. Fae của Triều đình Mùa Thu giỏi nhìn ra bức tranh toàn cảnh và hành động hướng đến mục tiêu của mình với điều đó trong đầu.
# Chiến tranh Mùa luôn được tiến hành để giành phần thưởng vĩ đại là chính thế giới, và các Triều đình khác chuẩn bị cho mình ở nhiều mức độ khác nhau để quay lại cuộc chiến với đôi mắt nheo lại và lưỡi kiếm tuốt trần. Fae Mùa Thu đã mở mắt và hạ thấp thanh kiếm của mình, vì có điều gì đó rất, rất sai lầm.
# Chiến tranh Mùa là canh bạc của kẻ ngốc: gần như không thể thắng, và tàn phá cả những kẻ chiến thắng, vì Triều đình cuối cùng giành được chiến thắng sẽ suy yếu đến mức bất kỳ thắng lợi nào cũng trở nên vô nghĩa. Vượt lên trên cả xung đột giữa fae, fae của Triều đình Mùa Thu đang hướng sự chú ý vào sự thật rằng thế giới không còn thực sự thuộc về họ nữa. Loài người đã sinh sôi nảy nở hàng ngàn người khắp cõi này, và họ mang theo mình những quyền năng xa lạ và phép thuật của đức tin bí ẩn của mình.
# Fae Mùa Thu nhận ra rằng bất kể phe phái nào chiến thắng tất cả trong Chiến tranh Mùa, điều xảy ra sau xung đột mới thực sự là khía cạnh quan trọng trong thời đại này. Loài người có phép thuật từ đấng giám hộ Thần thánh do họ tự tưởng tượng ra, điều này khiến nhiều fae tự hỏi liệu Đấng Duy Nhất có thực sự là một phát minh của người phàm hay không. Kể từ thời đại fae công khai tuyên bố quyền cai trị, diện mạo của thế giới đã thay đổi quá đáng kể để đơn giản tự lộ diện trước loài người và mong đợi sự sợ hãi, tôn sùng và kính trọng. Giờ đây, những phương pháp khác phải được áp dụng nếu fae muốn đạt được mục tiêu của mình. Chiến tranh Mùa có thể chờ đợi. Giờ là lúc kiểm kê lại thế giới và xem cuộc đại chiến này thực sự đang được tiến hành vì điều gì.
# Loài người có thể là một vũ khí lớn lao cho fae. Triều đình Mùa Thu, gần như hoàn toàn gồm những Changeling giỏi loại lừa dối và mặc cả này, đưa ra những thỏa thuận kiểu Faust và những lời thề cho người phàm túng quẫn (hay tham lam). Một tấm khiên chống lại Banality và một nguồn cả tri thức tôn giáo lẫn đồng minh và mối liên hệ, fae Mùa Thu thực sự xem loài người như một thứ hàng hóa hữu ích. Thêm vào đó, vì phần lớn fae của Triều đình này là changeling, họ cũng xem loài người như nguồn "tuyển mộ" chính. Nhiều fae Mùa Thu, bảo vệ bản chất thật của mình và mong muốn loài người không bao giờ hiểu trọn vẹn về fae, thích đánh cắp trẻ em loài người và nuôi chúng thành changeling hơn là kết đôi với người phàm.
# Triều đình Mùa Thu tràn ngập phe Constantine, những kẻ thiết lập những mối liên hệ dè dặt với những người phàm được chọn lọc trong nỗ lực to lớn nhằm thấu hiểu sự phức tạp và quyền năng của đức tin loài người. Quyền năng của phép rửa tội khiến fae Mùa Thu kinh hãi hơn bất kỳ Triều đình nào khác, cả vì Triều đình này phần lớn gồm changeling, và vì họ đã học được nhiều nhất về sự phức tạp của đức tin loài người. Bản thân phép rửa tội bị xem là kinh hoàng một cách nhất trí, vì một nghi lễ có thể ngay lập tức vô hiệu hóa Saining và tẩy sạch quyền năng huyền bí của một fae bị xem chẳng khác gì một số phận còn tệ hơn cái chết. Tuy nhiên, đám Autumn-kin lại thực dụng. Thay vì xem Giáo hội là kẻ thù cần chống lại và ngăn chặn, họ xem nó như một điều bí ẩn cần được phơi bày, khai mở và nghiên cứu. Một khi quyền năng của tín ngưỡng người phàm được thấu hiểu, có lẽ ngay cả Sương Mù cũng sẽ trở lại thế cân bằng nhân từ hơn của nó. 
# Hiện tại, nhiều kẻ theo phe Constantine đang tìm kiếm đồng minh mới trong số phe Nhân Đạo của Triều đình Mùa Xuân; và dù phe Truce-Bearer và Militant của Triều đình Mùa Thu phần lớn chỉ là những trường hợp hiếm gặp thú vị, họ vẫn tồn tại và hành động theo chương trình nghị sự riêng của mình.
# Có vẻ như Những Người Bảo Trợ thiếu thành viên Mùa Thu, đơn giản vì phần lớn phe Vanguard, vốn hiện diện công khai trước xã hội, không xuất thân từ Triều đình này. Tuy nhiên, phe Seeker và Austere Conclave lại sở hữu tỷ lệ fae Mùa Thu cao hơn phần của họ, vì bị thu hút bởi những vận hành nội bộ của cả cõi fae lẫn cõi người.

