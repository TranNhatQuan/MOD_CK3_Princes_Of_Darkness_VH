 spring_court_constantinians_desc: "Triều đình Mùa Xuân sở hữu tỷ lệ lớn nhất những fae tìm cách thấu hiểu Giáo hội vì sự tiến bộ và cân bằng của cả hai thế giới. Họ nhanh chóng nghiên cứu và thấu hiểu những kỳ quan như các đại giáo đường, lời cầu nguyện thánh thiện và các cuộc Thập Tự Chinh. Sự trỗi dậy của giáo hội Đấng Duy Nhất chắc chắn là sự thay đổi lớn nhất xảy ra với loài người, và đám Spring-kin Constantinian muốn trở thành một phần của những đổi thay tiếp theo mà Giáo hội mang lại." 
 
# Summer Court
# Chủ yếu gồm firstborn và inanimae, Triều đình Mùa Hạ là một pháo đài của truyền thống và sự tự cho mình là đúng. Các thành viên của Triều đình Mùa Hạ có cái nhìn xa lạ về loài người; và dù nhận thức rõ rằng cõi người và cư dân của nó đã hoàn toàn đổi thay trong các thế kỷ gần đây, những sinh vật cố chấp này không sẵn lòng thay đổi cùng họ. Đối với fae Mùa Hạ, không biết luật không phải là cái cớ. Loài người có thể đã quên đi nhiều lời thề của mình, nhưng điều đó không có nghĩa hình phạt nên được giảm nhẹ tương ứng.
# Triều đình Mùa Hạ tự hào về việc tuân thủ truyền thống và cấu trúc, cùng sự tuân theo kỷ luật nghiêm khắc. Fae Mùa Hạ là những chủ nhân nghiêm khắc nhưng công bằng, và tình yêu truyền thống của họ có nghĩa là họ đã giữ lại nhiều kho báu và pháo đài từ nhiều thời đại đã qua.
 
# Summer Poem:
# The pinnacle of Nature's fruits swell with the warmth of the midday,
# The fullest time of the turning year and darkness furthest away,
# A sedating calm claims beast and man,
# As the laze of summer weaves its terrible sheath,
# Shrouding the weak in a lack of will, allowing the sly to bare their teeth.
 
# Khoác lấy những vai trò truyền thống của fae, Triều đình Mùa Hạ được cư trú bởi những phản chiếu sống động của thế lực đang phai tàn của giống nòi Faerie. Cốt lõi của Triều đình này chính là hiện thân theo nghĩa đen của một trạng thái tĩnh tại bất biến; và trong những cột trụ truyền thống và lịch sử, fae Mùa Hạ tìm thấy một sức mạnh độc nhất.
# Các Triều đình khác có thể vội vã thay đổi và chuyển mình để hòa hợp với cõi người — đó là đặc quyền của họ. Fae Mùa Hạ đường bệ nhận thức được những thay đổi tương tự, nhưng đã đưa ra lựa chọn có ý thức để chống lại chúng. Loài người đã quên đi những lối cũ. Fae Mùa Hạ thì không. Đối với những kẻ theo chủ nghĩa truyền thống này, đã đến lúc nhắc nhở người phàm về cách mọi thứ từng như thế nào: làm mới lại mọi mối ràng buộc đã phai nhạt, nhắc họ nhớ về mọi phong tục đã mất, và khôi phục lại vị trí đúng đắn của những kẻ mới nổi trong thế giới này.
# Tất nhiên, fae Mùa Hạ không chuẩn bị xâm lược cõi người hàng loạt. Ngay cả với cái nhìn xa lạ của họ về loài người, rõ ràng một con đường như vậy sẽ là một thất bại trong trường hợp tốt nhất, và một thất bại thảm khốc trong trường hợp xấu nhất. Thay vào đó, họ dự định làm mới những mối ràng buộc cũ với người phàm và củng cố những liên kết còn sót lại. Loài người bị ràng buộc bởi lời thề sẽ được trân trọng và tưởng thưởng vì hành động phù hợp với vị trí của họ trong tấn kịch của thế giới, trong khi những kẻ phá vỡ lời thề sẽ bị trừng phạt nhanh chóng và dứt khoát đến mức tối đa theo các điều khoản của lời thề. Đối với fae Mùa Hạ, loài người là những sinh vật kỳ lạ, quyến rũ và thông minh, nhưng dù sao vẫn chỉ là sinh vật. Nhiều thành viên Triều đình này tin rằng đã đến lúc huấn luyện lại những sinh vật này.
# Khi Hiệp ước Đình chiến bước vào những ngày cuối cùng, các tiên nữ của Triều đình Mùa Hạ đang chuẩn bị cho việc xung đột tái diễn với trái tim hân hoan và lưỡi kiếm đã mài sắc. Chiến tranh Mùa là trận chiến của họ, vì bất chấp những thất bại của Trận Đá, fae Mùa Hạ luôn tin rằng họ sẽ trở thành người chiến thắng cuối cùng. Thật vậy, hiếm có lãnh địa Mùa Hạ nào thiếu một màn phô trương quân sự truyền thống (và vô cùng phô trương). Dù là những lá cờ chiến tranh treo trên xà nhà phòng ngai vàng của một cung điện, hay một tập hợp đường hầm dưới lòng đất chứa đầy tiếng sáo, tiếng kèn và tiếng đàn hạc của một bài ca chiến trận cổ xưa, nhiều fae Mùa Hạ trân quý những công cụ chiến tranh và là những kẻ ủng hộ nhiệt thành cho chương trình nghị sự Hiếu Chiến. Phe Truce-Bearer gần như chưa từng được nghe đến, và những kẻ theo đuổi chương trình nghị sự đó thường làm vậy chỉ với một mục đích duy nhất là cho lãnh địa của mình thêm thời gian chuẩn bị cho việc tái khởi chiến sự cuối cùng.
# Điều này không có nghĩa là fae Mùa Hạ là những kẻ man rợ khát máu. Trong phần lớn trường hợp, chẳng có gì xa sự thật hơn thế. Trong giới fae, họ thường dí dỏm và lịch thiệp; và dù thường xa cách, họ được xem là đúng mực đến mức cầu toàn. Tuy nhiên, con mắt người phàm không chia sẻ những cái nhìn này. Đối với loài người, fae Mùa Hạ không kém gì những sinh vật huyền thoại đầy kinh ngạc có thể mang đến giọt nước mắt vui sướng hay sợ hãi cho đôi mắt người phàm.
# Changeling ít ỏi hơn nhiều so với firstborn và inanimae, điều này giải thích phần lớn cho nhận thức xa lạ của Triều đình này về loài người. Ngay cả những changeling của phe cố chấp này, thường bị đánh cắp từ các gia đình hơn là sinh ra từ sự kết hợp giữa firstborn và loài người, cũng có xu hướng tuân theo những quy tắc ứng xử và sự đứng đắn gần như hiệp sĩ.
# Triều đình này mang một nỗi căm ghét mãnh liệt đối với Những Người Bảo Trợ, điều này hợp lý khi xét đến sự đảm bảo nhiệt thành của fae Mùa Hạ rằng họ sẽ chiến thắng trong Chiến tranh Mùa. Ngoài ra, fae Mùa Giao đặc biệt bị khinh miệt — ít nhất là ở nơi công cộng. Trong chốn riêng tư, fae Mùa Hạ hạ mình thuê mướn đám fae trung lập cũng thường xuyên như bất kỳ phe phái nào khác (và có lẽ còn hơn một số phe). Công khai, Triều đình nói chung khinh ghét đám Solstice-kin, chủ yếu vì tin đồn rằng đám Courtless đã khơi mào Chiến tranh Mùa.
 
