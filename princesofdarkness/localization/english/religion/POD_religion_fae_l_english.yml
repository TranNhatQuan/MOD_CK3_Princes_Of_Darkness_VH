 winter_court_constantinians_desc: "Phe Constantine của Triều đình Mùa Đông dùng hiểu biết về Giáo hội để trục lợi cho bản thân và gây tổn hại cho loài người. Họ đã dành sự quan tâm lớn đến việc Giáo hội đàn áp những kẻ dị giáo và phù thủy—không hẳn là giáo lý mà là kỹ thuật tra tấn và khủng bố của nó. Sự kinh hoàng bạo lực của Thập Tự Chinh Albigensian cũng đã khơi dậy sự tò mò của Winter-kin. Ngay cả những kẻ tự hành xác cũng khiến họ quan tâm. Những giấc mơ tận thế về Chúa Kitô với thanh gươm và các thiên thần báo thù có thể mang lại rất nhiều glamour để thu hoạch."
 
# Spring Court
# Trong thời đại mới của cả đức tin và sự bất định này, Triều đình Mùa Xuân tìm cách thấu hiểu và hàn gắn những vết thương đã tạo ra giữa loài người và fae. Trong Chiến tranh Mùa, họ là những chiến binh hăng hái, khao khát giành chiến thắng một lần và mãi mãi; và trong cõi người, họ tìm cách giành lại vị thế liên quan đến loài người và được sợ hãi lẫn kính trọng một lần nữa. Triều đình của sự đổi thay và nghịch lý, fae Mùa Xuân nỗ lực thay đổi mọi thứ theo hướng có lợi cho mình, trước khi loài người quên lãng họ, hoặc trục xuất fae vĩnh viễn. Nếu bế tắc như vậy xảy ra, toàn bộ Chiến tranh Mùa và mọi nỗ lực khác sẽ đi đến một hồi kết vô nghĩa.
# Fae Mùa Xuân ôm lấy sự đổi thay dưới mọi hình thức, dõi theo cuộc sống tiến triển qua các mùa và tận hưởng mọi biến thể muôn hình muôn vẻ của nó (bao gồm cả những cách khác nhau mà nó có thể kết thúc). Họ đã đánh mất nhiều lãnh địa vĩ đại nhất của mình từ nhiều thế kỷ trước, nhưng trong tất cả các Triều đình, họ là những kẻ giỏi nhất trong việc tìm kiếm mái nhà mới và thích nghi với môi trường mới.
 
# Spring Poem:
# Dawn cracks the pristine shell of day, new life does start,
# And the clasp of winter's crippled hand falls apart,
# The melt of snow runs down Nature's growing form,
# But with beauty of a blossoming flower,
# Comes not the strength to protect it from Her storm. 
 
# Mùa Xuân là mùa sinh sôi—của nảy nở và tăng trưởng. Đó cũng là mùa của thời tiết khó lường, của bão tố và tính khí thất thường, và của sự đổi thay không thể hòa giải.
# Fae Mùa Xuân ôm lấy sự đổi thay trong mọi việc, đó vừa là sức mạnh lớn lao vừa là điểm yếu lớn lao của chính Triều đình này. Sự đổi thay không phải lúc nào cũng tiến bộ, cũng không phải lúc nào cũng có lợi. Việc trở lại Chiến tranh Mùa sau nhiều thế kỷ 'hòa bình' căng thẳng là một sự thay đổi đáng kể, và là điều mà nhiều thành viên Triều đình Mùa Xuân hăng hái muốn hành động theo. Những fae khác, xem cuộc xung đột lớn lao này là một nỗ lực vô ích, ủng hộ việc thay đổi hoàn toàn chiến thuật, và mong tập trung công sức vào cõi người để đảm bảo sự liên quan lâu dài của fae.
# Những fae này thường được xem là bảo vệ loài người nhiều nhất, dù điều này không hẳn là một hành động vị tha tận tụy. Fae Mùa Xuân nhận ra rằng họ phải củng cố mối quan hệ cùng có lợi giữa hai chủng tộc, kẻo fae trượt khỏi tâm trí người phàm mãi mãi. Do đó, những lời thề của họ thường liên quan đến việc giúp đỡ hay bảo vệ loài người, dù những lời thề nặng nề như vậy đòi hỏi những cam kết tương xứng từ người phàm bị ràng buộc bởi lời thề.
# Một thái độ bốc đồng, những lợi ích xung đột và sự thiếu tập trung gắn kết là đặc trưng của fae Mùa Xuân—không có gì bất ngờ khi xét đến sự phân bổ tương đối đồng đều của ba Nguồn Gốc trong Triều đình này. Không thể phủ nhận sức mạnh, với thế lực của họ lên xuống theo thiên hướng theo mùa, Triều đình Mùa Xuân luôn bị chia rẽ bởi vô số cách tiếp cận khác nhau trong hàng ngũ của mình.
# Changeling không chịu định kiến tiêu cực nào của Triều đình, dù một số ít định kiến hiếm hoi vẫn tồn tại ở vài cá nhân. Theo thời gian, dân số changeling của Triều đình Mùa Xuân đã dần tăng lên để sánh với số lượng firstborn và inanimae, và tiếp tục phình to trong thời đại hiện nay. Phần lớn firstborn Mùa Xuân thích tạo ra changeling mới trong một công trình của tình yêu hay dục vọng, hơn là đánh cắp đứa trẻ được yêu quý của một gia đình loài người. Tuy nhiên, những đứa trẻ bị đối xử đặc biệt tàn nhẫn thường là những bổ sung quý giá cho Triều đình, được giải cứu khỏi cuộc sống bị ngược đãi. Fae Mùa Xuân, dù hiếm khi tử tế theo nghĩa của loài người, thường có lòng trắc ẩn với những người phàm bị chà đạp hay bất lực, đặc biệt là trẻ em. Những người phàm kém may mắn như vậy là mảnh đất màu mỡ cho những lời thề và liên minh.
# Chiến thuật của Triều đình Mùa Xuân, như có thể đoán trước, là một hỗn hợp xung đột giữa hành động và ý định. Trong khi phần lớn Triều đình theo chương trình nghị sự Nhân Đạo, phe Hiếu Chiến và phe Constantine cũng không hề hiếm. Phức tạp hơn nữa, nhiều kẻ theo phe Nhân Đạo lại vô cùng vui vẻ dành thời gian ném kỹ năng của mình vào Chiến tranh Mùa, và nhiều kẻ theo phe Hiếu Chiến lại ủng hộ việc bàn luận các vấn đề của cõi người giữa những cuộc giao tranh thù địch với các triều đình khác.
# Hiện tại, Triều đình này giống như một tổ kiến bị đá tung. Các nhà ngoại giao và đại sứ đua nhau đến các triều đình địa phương khác, cả lãnh địa Mùa Xuân lẫn các lãnh địa thù địch của Triều đình khác. Những khu vực khác phô trương sự hiện diện của các đội quân đã tập hợp, dù chỉ là cái bóng rỗng tuếch của những đạo quân vĩ đại từ Trận Đá, vẫn đáng gờm nhờ kỹ năng và sự tận tụy của họ.
# Điều thú vị là, Những Người Bảo Trợ cũng đang chứng kiến một sự gia tăng lớn số fae Mùa Xuân gia nhập hàng ngũ của họ. Phần lớn fae Mùa Xuân gia nhập hàng ngũ Những Người Bảo Trợ thường thấy mình ở giữa những khu ẩn cư bí mật của phe Seeker hay phe Vanguard táo bạo, dễ thấy.
  
