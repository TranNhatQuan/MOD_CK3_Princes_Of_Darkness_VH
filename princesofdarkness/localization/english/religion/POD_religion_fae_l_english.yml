# Political Faction Agendas

# Militants
# Rất nhiều fae nóng lòng mong Hiệp ước Đình chiến kết thúc để họ có thể trở lại cuộc giao tranh của Chiến tranh Mùa. Những cảm xúc mãnh liệt cùng lòng trung thành được khơi dậy từ nghi lễ Sained gia nhập một Triều đình là thứ dữ dội và khó lòng gạt bỏ vì bất cứ lý do gì. Hầu như mọi thành viên của Tứ Triều đều tin chắc rằng lối sống của họ mới là con đường đúng đắn, dù dưới hình thức một thế giới tốt đẹp hơn cho tất cả, hay đơn giản chỉ là kẻ mạnh nhất xứng đáng cai trị. Do đó, việc chiến tranh của fae tái diễn không phải điều gieo rắc nỗi kinh hoàng trong lòng phần lớn fae theo phe phái. Trên thực tế, hoàn toàn ngược lại—đó là hồi kết của một sự trì hoãn quá lâu, là tín hiệu cho thấy trận chiến quyết định vận mệnh thế giới cuối cùng cũng có thể bắt đầu.
# Phe Hiếu Chiến xuất hiện ở mọi Triều đình, dù Triều đình Mùa Hạ nuôi dưỡng nhiều Kẻ Hiếu Chiến nhất trong hàng ngũ của mình còn Triều đình Mùa Thu là ít nhất. Triều đình Mùa Đông và Mùa Xuân, tuy thiếu sự nhiệt thành thống trị thế giới như fae Mùa Hạ thể hiện, cũng không thiếu lý do để đưa quân ra tiền tuyến khi Chiến tranh Mùa tái khởi.

# Truce-Bearers
# 'Người Mang Đình Chiến' là danh xưng dành cho những fae tìm cách chấm dứt Chiến tranh Mùa, hoặc bằng cách kéo dài Hiệp ước Đình chiến vô thời hạn, hoặc bằng cách rèn nên một hiệp ước mới, lâu bền để chấm dứt xung đột giữa các triều đình. Nhiều kẻ trong phe này khoác lấy vẻ thờ ơ với loài người. Họ xem xã hội fae là điều quan trọng hơn vô cùng, và cần được chú ý ngay lập tức, hơn là thế giới của người phàm.
# Những fae khác, trong suốt 800 năm kể từ Trận Đá (và đặc biệt trong 100 năm Hiệp ước Đình chiến) đã xây dựng nên những liên minh và tình bạn khăng khít với thành viên của các Triều đình đối địch, và không mấy hào hứng ra trận chống lại những đồng đội mới này.
# Cuối cùng, một số fae không quan tâm liệu các Triều đình có tái chiến hay không; họ chỉ đơn giản mong bản thân không phải tham gia vào xung đột. Nhiều kẻ trong số này ủng hộ việc quay về Arcadia—hoặc ít nhất là tránh xa con đường của loài người.
# Người Mang Đình Chiến của mọi Triều đình thường là những cá nhân đơn độc hay các nhóm fae nhỏ nhiệt thành hoạt động trong đấu trường xã hội để lay chuyển các triều đình địa phương hướng đến hòa bình. Không có gì lạ khi họ hiếm khi thành công, nhưng điều đó chỉ càng thổi bùng ngọn lửa trong lòng họ. Hòa bình, bất kể cái giá phải trả, là thiên chức của họ.

# Humanists
# Phe Nhân Đạo không nhất thiết cổ vũ lòng tốt và sự bao dung khi ứng xử với cõi người, mà thay vào đó ôm lấy một đạo lý chủ yếu quan tâm đến việc thấu hiểu loài người. Trước hết, với sự trỗi dậy của nhiều tín ngưỡng và nghi lễ của loài người chủ động xua đuổi fae—đặc biệt là nghi thức rửa tội của Cơ Đốc giáo—ngay cả nhiều changeling cũng thừa nhận rằng họ không còn hiểu loài người như trước nữa. Thời thế đã đổi thay, và bỏ lại fae bên lề. Loài người giờ đây có số lượng và quyền lực vượt xa những gì bản thân fae sở hữu. Đây là một nhận thức đột ngột và vô cùng tỉnh táo.
# Phe Nhân Đạo tin rằng đây là lúc phải thu thập thông tin về loài người, giao thiệp với họ, rèn nên những lời thề mới, và bằng mọi cách tìm kiếm sự cân bằng giữa hai chủng tộc trước khi quá muộn. Phe này ý thức rõ rằng theo thời gian, rất có thể fae sẽ đơn giản trở nên chẳng còn liên quan gì đến loài người, một yếu tố chưa từng được xem xét trước đây. Do đó, dù hầu hết fae đều mang tinh thần Nhân Đạo ở mức độ này hay khác, các thành viên của phe này chiếm số đông đáng kể ở Triều đình Mùa Xuân và Mùa Thu. Nhiều kẻ theo phe Nhân Đạo mong muốn một giải pháp có lợi cho họ—loài người có thể làm gì cho fae? Nhưng cuối cùng, phe Nhân Đạo mong đạt được một mức độ phụ thuộc lẫn nhau với loài người, nơi fae một lần nữa được công nhận, và hoặc được trân trọng và kính nể... hoặc đơn giản là được trân trọng và sợ hãi.

# Constantinians

# Những fae tìm cách thấu hiểu chi tiết đức tin của loài người luôn bị xem là theo đuổi một con đường học thuật khá vô ích — cho đến bây giờ. Phe Constantine đã chứng kiến số lượng thành viên tăng vọt trong những năm Hiệp ước Đình chiến. Được đặt tên theo Hoàng đế Constantine Đệ Nhất, những fae này tìm cách hiểu biết thêm về các tôn giáo của loài người, đặc biệt là Giáo hội Cơ Đốc, và quan tâm đến việc này vì vô số lý do khả dĩ.
# Nhìn chung, phản ứng của fae trước Giáo hội thường là một thế cân bằng bất an giữa sợ hãi và kính sợ. Phe Constantine mang lấy thái độ này và kết hợp nó với khát khao tìm hiểu thêm về những điều bí ẩn trong đức tin loài người. Một số thành viên theo chương trình nghị sự này cảm thấy tôn trọng tín ngưỡng của loài người và quyền năng mà nhờ đó họ có được, nhưng cũng có không ít kẻ theo phe Constantine cảm thấy căm ghét, ghê tởm và thậm chí ganh tị.
# Những kẻ theo đuổi con đường nghiên cứu và suy luận này thường làm vậy vì một trong hai lý do chính: để thấu hiểu hiện tượng đức tin và tìm cách cân bằng nó với vị thế của fae trên thế giới; hoặc để tìm kiếm bất kỳ điểm yếu nào trong quyền năng mới của loài người, và tìm cách khai thác nó. Mối đe dọa lớn nhất đối với fae là nghi thức rửa tội, và nghi lễ này được những kẻ theo chương trình nghị sự Constantine dành nhiều sự chú ý và nghiên cứu. Những quyền năng của đức tin có thể xua đuổi fae về mặt thể xác cũng được nghiên cứu kỹ lưỡng—đây là những diễn biến mới đáng lo ngại và nguy hiểm cần được thấu hiểu.
# Triều đình Mùa Thu và Mùa Đông đều có phe Constantine trong hàng ngũ, dù phần lớn những fae này thường dùng hiểu biết về Giáo hội để trục lợi cho bản thân (và gây tổn hại cho loài người). Triều đình Mùa Xuân sở hữu tỷ lệ lớn nhất những fae tìm cách thấu hiểu Giáo hội vì sự tiến bộ và cân bằng của cả hai thế giới.

# Season Courts

# Winter Court
# Man rợ nhất trong tất cả các fae, đám Winter-kin ẩn nấp dưới những cây cầu và trong rừng sâu tăm tối. Dù là những chiến binh hung tợn, phần lớn bọn họ không mấy háo hức trước việc Hiệp ước Đình chiến kết thúc.  Chiến tranh có tổ chức không phải sở thích của họ, nhưng săn đuổi loài người, cảm giác hồi hộp của những cuộc săn ban đêm, vị máu và nỗi sợ hãi—đó mới là những thứ hợp khẩu vị họ. Chỉ có ý niệm nhấn chìm thế giới vào một đêm đen tối, man rợ mới thúc đẩy họ tham gia Chiến tranh Mùa.
# Những con quái vật trong truyền thuyết loài người, những sinh vật trong bóng tối đêm đen—đám Winter-kin sống để gieo rắc nỗi kinh hoàng cho loài người. Phần lớn khinh miệt Chiến tranh Mùa, Triều đình này đã đánh mất phần lớn động lực để cuối cùng chiến thắng các phe phái khác, giờ đây xem chúng gần như không đáng để ý. Fae Mùa Đông dường như không có khả năng đồng cảm với loài người, không có nền tảng hay điểm khởi đầu nào để thấu hiểu người phàm và cuộc đời họ. Changeling (và phe Nhân Đạo) hiếm khi xuất hiện ở triều đình này.

# Winter Poem:
# Sun hides low in her sky; fearful of the shadow she creates,
# As Night sits in his dank hollow and awaits,
# For her to sink deep beneath the iced barren lands,
# Allowing the frosts to eat warmth from the blooded,
# And free the hunting creatures of the forest once again.

# Humans have always feared the things that live in the shadows.
# Triều đình Mùa Đông hiểu biết rất ít về loài người, và càng chẳng bận tâm đến họ. Trong những khu rừng tối tăm nhất giữa đêm kinh hoàng, đó là những sinh vật ăn thịt trẻ lạc và nhuộm mũ trong máu còn sót lại. Đó là những sinh vật săn đuổi bất kỳ ai trong lãnh địa của chúng, khiến người phàm kiệt sức vì kinh hãi. Những sinh vật này là lý do khiến loài người sợ hãi những giờ khắc sau khi mặt trời lặn.
# Fae Mùa Đông mang nỗi căm ghét các Triều đình khác vượt xa sự bất đồng và ác cảm (phần nào) hợp lý giữa các phe Mùa Hạ, Mùa Xuân và Mùa Thu. Fae Mùa Đông cảm thấy đám Spring-kin gần như hoàn toàn bị nỗi ám ảnh với loài người làm mù quáng, fae Mùa Hạ bị mắc kẹt trong quá khứ và đang chịu khổ vì sự ngu muội của mình, còn Triều đình Mùa Thu dây dưa với những quyền năng kỳ lạ, ô uế của loài người tốt nhất nên tránh xa. Còn về fae Mùa Giao—thì họ quá hèn nhát để gia nhập ngay cả Triều đình Mùa Hạ đáng thương, bị luật lệ trói buộc.
# Khi Hiệp ước Đình chiến bước vào những giờ khắc cuối cùng, fae Mùa Đông khó lòng nhỏ dãi thèm khát một trận chiến với nanh vuốt đã mài sắc. Phần lớn thành viên Triều đình này thực ra khá thờ ơ với Chiến tranh Mùa. Trong nhiều trường hợp, họ quá xa rời chính trường fae để theo kịp làn sóng liên minh và phản bội mới nhất; và để hạn chế thêm sự dính líu của mình, họ thường chẳng quan tâm ai đang đâm sau lưng ai vì một hiệp ước địa phương nhỏ nhặt nào đó.
# Nhiều fae Mùa Đông là những kẻ thực tế, và có thể thấy rõ rằng Chiến tranh Mùa là một thứ gì đó giống như một cuộc thử thách bất tận. Phần lớn quan tâm nhiều hơn đến việc cứu lấy bản thân và bảo vệ lãnh địa của mình trước bất kỳ ảnh hưởng nào của loài người. Không có gì lạ khi những lời thề của họ với loài người thường thẳng thừng, đơn giản và cực kỳ nghiêm túc. Phá vỡ một lời thề Mùa Đông thường đồng nghĩa với cái chết, và cái chết thường đồng nghĩa với việc bị moi ruột dưới móng vuốt của một con quái vật man rợ.
# Dù vậy, đã có những khác biệt đáng chú ý trong quan điểm của Triều đình Mùa Đông những năm gần đây. Triều đình Mùa Xuân, vốn luôn bị đám Winter-kin xem là tập hợp kẻ ngốc hèn nhát, yếu đuối nhất từng tự xưng là một Triều đình, đang chuẩn bị cho nhiều cuộc giao tranh nghiêm túc khi Hiệp ước Đình chiến sụp đổ. Đặc biệt, Lưỡi Kiếm Xanh của Seigfreid Hein được nhìn nhận với sự bất an đặc biệt, cũng như các Quân Đoàn Thất Lạc Khác. Các chiến binh và binh lính của Triều đình Mùa Đông (dù ít ỏi) cuối cùng cũng nhận ra rằng đám Spring-kin chẳng hề là những kẻ nhu nhược không nanh vuốt như họ từng nghĩ. Trên thực tế, hoạt động quân sự Mùa Xuân còn sánh ngang cả Triều đình Mùa Hạ—về cường độ và sự tàn khốc, nếu không muốn nói về quy mô.
# Ngoài ra, những liên minh dè dặt với các lãnh địa Mùa Thu nhỏ hơn cũng đã được thử nghiệm và đạt được một số thành công. Fae Mùa Đông không phải là những kẻ giết chóc và quái vật vô tri toàn bộ—họ cũng có lợi ích gắn liền với những thay đổi trong cõi người. Tất nhiên, trong khi Triều đình Mùa Thu tìm cách nghiên cứu loài người và uốn nắn người phàm thành một lợi thế có thể sử dụng, Triều đình Mùa Đông quan tâm nhiều hơn đến việc khuất phục người phàm và chấm dứt sự trỗi dậy đột ngột của những tín ngưỡng quyền năng này, cùng với sự bùng nổ dân số changeling ở các Triều đình khác.
# Triều đình Mùa Đông, không có gì bất ngờ, chủ yếu gồm firstborn và inanimae. Hiếm có changeling nào sống sót qua nghi lễ Saining, vì những nghi lễ như vậy thường bị làm giả để đảm bảo kẻ tân binh thất bại. Ngược lại, cũng có tin đồn rằng nhiều changeling trong Triều đình này thực ra bị ép buộc trải qua nghi lễ Sained. Cơ chế chính xác đằng sau lời cáo buộc như vậy không khó để hiểu; những lời đe dọa hầu hết đi theo hướng, 'Chấp nhận Saining, hoặc bị ăn thịt." Dù một đề nghị như vậy là điều cấm kỵ đối với những fae kiêu hãnh của các Triều đình khác (và là nỗi khiếp sợ đối với một fae Mùa Giao trên lãnh thổ Mùa Đông), có vẻ như một khi nghi lễ Saining 'bị ép buộc' như vậy đã diễn ra, Winter-king mới thường tỏ ra vô cùng hài lòng với vị thế và quyền năng mới của mình. Khi cách tiếp cận này không được sử dụng, phần lớn changeling bị đánh cắp từ các gia đình, thay vì được sinh ra. Tuy nhiên, cả hai cách thức đều cực kỳ hiếm.

 winter_court_religion: "@changeling_icon! Winter Court"
