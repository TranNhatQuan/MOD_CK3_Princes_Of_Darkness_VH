 empire_of_seeds_desc: "Triều đình của Kubera, một Phyla của Inanimae. Quốc gia của Dryad là một tập hợp rừng rú chia sẻ đời sống và của cải chung. Trong [UmbraGlossary('dreaming')], Quê Hương của Nymph là một khu rừng trải rộng ở trung tâm của các Cõi Quê Hương. Về chính trị, Dryad ủng hộ Glome nhưng vẫn có những dè dặt về cách đối xử với Quê Hương Solimond. Là Phyla chịu ảnh hưởng nhiều nhất bởi Chiến tranh Tạo Tác, họ không mấy đồng cảm với sự nghiệp tái hòa nhập của Solimond. Lễ hội Xuân Phân là một Hội Chợ lớn do Kubera tổ chức. Nhạc công, nghệ sĩ và thợ thủ công Inanimae gặp gỡ để trưng bày hàng hóa của mình và tất cả cùng ăn mừng sự tái sinh của cuộc sống và hồi kết của Mùa Đông. Nếu các lãnh đạo của các đế chế cần đưa ra bất kỳ tuyên bố chung nào, đây là thời điểm và địa điểm để làm điều đó. Moot là một ngày lễ nơi Kubera tụ họp trong một khoảng rừng thưa khổng lồ vào giữa hè đâu đó ở Nga. Tại đây Dryad được phép thỉnh cầu hoàng đế của họ."

