 empire_of_stones_adherent: "Đá"
 empire_of_stones_adherent_plural: "Đá"
 empire_of_stones_desc: "Triều đình của Glome, một Phyla của Inanimae. Đế Chế Đá là một hệ thống cấp bậc nghiêm ngặt. Mọi Glome đều biết vị trí của mình trong tổng thể lớn hơn. Đồng thời, đế chế này cũng là một chế độ trọng dụng nhân tài. Sự thăng tiến diễn ra nhanh chóng cho những ai có thể thúc đẩy sự nghiệp của Đế Chế. Quê Hương [UmbraGlossary('dreaming')] của Glome là một pháo đài khổng lồ mọc lên từ một ngọn núi sống. Nó đã bị vây hãm ba lần và mỗi lần những kẻ xâm lược đều bị đẩy lui và nghiền nát. Tại trung tâm của công trình này là một trong số ít những mạch sắt chimerical. Trong tất cả các đế chế, Glome là những kẻ phân cực nhất về chính trị. Họ giữ vững lập trường cứng rắn rằng Solimond phải bị hủy diệt. Do Glome tổ chức, Lễ Hội Đông Chí là một Giải Đấu lớn được tổ chức trong [UmbraGlossary('dreaming')], tương tự Thế Vận Hội, nếu Thế Vận Hội là về dũng mãnh võ nghệ. Người chiến thắng được tắm trong lời tán dương và, nếu là Glome, sẽ được định sẵn cho sự thăng tiến nhanh chóng."

 empire_of_flames: "Đế Chế Ngọn Lửa"
 empire_of_flames_adj: "Ngọn Lửa"
 empire_of_flames_adherent: "Ngọn Lửa"
 empire_of_flames_adherent_plural: "Ngọn Lửa"
 empire_of_flames_desc: "Triều đình của Solimond, một Phyla của Inanimae. Quốc gia Salamander có một chế độ quân chủ đế quốc phức tạp với các cấp bậc quý tộc, lễ nghi và nghi thức sánh ngang bất cứ thứ gì Sidhe từng nghĩ ra. Những linh hồn lửa đầu tiên đem lòng yêu thịt xương từng ở trong đế chế này và, bị thúc đẩy bởi đam mê định mệnh này, đã dành hàng thế kỷ quan sát loài người và học hỏi những cách thức của trái tim kỳ lạ và tuyệt vời của họ theo cách chỉ một người tình mới có thể làm được. Cuối cùng, không thể giấu giếm thêm nữa, họ đã lộ diện và cho thịt xương thấy sự vận hành của Ngọn Lửa cùng quyền năng biến hình và chân lý của nó. Trong việc này, họ đã đẩy thế giới vô tri vào cảnh nô lệ dưới tay đàn ông và đàn bà và gây ra Chiến tranh Tạo Tác, buộc các Đế Chế khác phải quay lưng chống lại những ngọn lửa phản bội và trục xuất họ. Giờ đây, các Đế Chế Chậm khác tìm cách dập tắt các Neo của Khu Rừng Thưa của Salamander. Quê Hương [UmbraGlossary('dreaming')] của Salamander từng là một khung cảnh đồng thau của cung điện và điền trang với một chân trời rực lửa thắp sáng bầu trời. Hạ Chí là một vũ hội trang trọng và cao quý đầy vẻ đẹp cũng như một Đại Học 4 ngày nơi Solimond sẽ tụ họp và chia sẻ tri thức của mình."

 empire_of_tears: "Đế Chế Nước Mắt"
 empire_of_tears_adj: "Nước Mắt"
 empire_of_tears_adherent: "Nước Mắt"
 empire_of_tears_adherent_plural: "Nước Mắt"
 empire_of_tears_desc: "Triều đình của Ondine, một Phyla của Inanimae. Nereid điều hành đế chế của mình theo kiểu Dân Chủ Athen. Bất kỳ Nereid nào cũng có thể bỏ phiếu cho bất kỳ vấn đề nào. Quê Hương [UmbraGlossary('dreaming')] của những Người Thu Thập Trái Tim là một đại dương trải rộng khắp mọi chân trời. Sâu 20 dặm, bên trong nó là một thành phố khổng lồ với những tòa nhà và đại lộ bằng san hô. Bất kỳ vị khách nào ghé thăm cũng phải có khả năng thở dưới nước. Nhiều thuyền trưởng Cướp Biển nắm giữ bí mật để điều hướng những lối tắt qua đây thông qua [UmbraGlossary('dreaming')] vì nó gắn liền với mọi vùng nước trên Trái Đất và trong [UmbraGlossary('dreaming')]. Về chính trị, đế chế này không có kẻ thù và duy trì quan hệ hữu hảo với mọi Inanimae khác, dù lửa và nước chưa bao giờ có quan hệ tốt đẹp nhất. Thu Phân là một ngày lễ được Ondine và Paroseme cùng tổ chức. Tất cả đều được mời đến các cung điện dưới nước của Nereid với oxy được Silfar cung cấp. Yến tiệc linh đình và quà tặng được trao ban."

 empire_of_skies: "Đế Chế Bầu Trời"
 empire_of_skies_adj: "Bầu Trời"
 empire_of_skies_adherent: "Sylph"
 empire_of_skies_adherent_plural: "Sylph"
 empire_of_skies_desc: "Triều đình của Paroseme, một Phyla của Inanimae. Chính quyền của Silfar có thể được mô tả tốt nhất như một sự lai tạp giữa vô chính phủ và bộ lạc. Mỗi năm một lần, 13 thành viên tích cực lớn tuổi nhất họp mặt và tranh luận các vấn đề ảnh hưởng đến mọi Sprite rồi đưa ra những tuyên bố dài dòng, hoa mỹ ngay lập tức bị mọi người phớt lờ. Được tìm thấy trong [UmbraGlossary('deep_dreaming')], Quê Hương Paroseme trông như cả một đất nước làm bằng mây và thủy tinh. Những con thú ảo ảnh gặm cỏ giống mây và đám dân mỏng manh thơ thẩn dạo quanh vùng quê tinh tế bằng chân hoặc bằng cách bay. Ngay tại trung tâm cõi này, một tòa tháp mây, hình dạng như sừng kỳ lân, vươn cao, vững chắc như cẩm thạch. Trên đỉnh là nơi hội đồng họp mặt. Quan hệ tốt đẹp với Đế Chế Nước Mắt với một sự trao đổi đều đặn giữa Mưa và Bốc Hơi. Đế Chế Đá bị xem là quá nhàm chán để có quan hệ gì hơn ngoài xã giao qua loa. Họ có quan hệ hữu hảo với Đế Chế Hạt Giống. Không có kế hoạch nào để tham gia phong tỏa Đế Chế Ngọn Lửa. Không ai có gì để nói với Đế Chế Búp Bê. Thu Phân là một Lễ Hội chung cho Ondine và Paroseme. Tất cả đều được mời đến các cung điện dưới nước của Nereid với oxy được Silfar cung cấp. Yến tiệc linh đình và quà tặng được trao ban." 

 empire_of_dolls: "Đế Chế Búp Bê"
 empire_of_dolls_adj: "Búp Bê"
 empire_of_dolls_adherent: "Búp Bê"
 empire_of_dolls_adherent_plural: "Búp Bê"
 empire_of_dolls_desc: "Triều đình của Mannikin, một Phyla của Inanimae. Đám Đồ Chơi tuyên bố không có đế chế hay Quê Hương nào. Chúng thỉnh thoảng tụ tập ở những góc yên tĩnh của [UmbraGlossary('dreaming')] để giữ kín các cuộc họp bàn của mình và đôi khi sẽ xuất hiện để đưa ra lời khuyên trong triều đình của các đế chế khác. Một sứ giả tự xưng nói thay cho toàn thể Mannikin khoác áo choàng đen và ngay cả Thống Chế của Glome cũng lắng nghe khi kẻ khoác áo đen xuất hiện với tin tức. Mannikin chưa từng mời ai đến nơi hội họp của mình. Trong chính trường của các đế chế, đám Đồ Chơi đóng vai trò chất xúc tác cho sự thay đổi. Khi sứ giả của chúng xuất hiện, những biến chuyển chính sách đã cận kề. Nhiều người tự hỏi bí mật của những kẻ khoác áo đen là gì, nhưng các đế chế khác sẽ không bao giờ tiết lộ những gì đã được nói. Vài lần một sứ giả đã ngỏ lời với toàn thể một đế chế, chiến tranh đã nhanh chóng theo sau. Dù Mannikin không có nghi lễ thường niên nào, tin đồn vẫn dai dẳng về khoảng thời gian bị đánh cắp vào đêm Giao Thừa giữa 11:59 và Nửa Đêm. Người ta thì thầm rằng trong phút đó tất cả Đồ Chơi thức tỉnh và sống trọn một ngày hoàn toàn như người rồi trở về Neo của mình và thời gian tua ngược lại Nửa Đêm một lần nữa. NẾU điều đó là thật, nó sẽ giúp giải thích tại sao Búp Bê biết nhiều điều vẫn còn ẩn giấu với các đế chế khác đến vậy."
 
 eshu_religion: "@changeling_icon! Eshu"
 eshu_religion_adj: "Eshu"
 eshu_religion_adherent: "Eshu"
 eshu_religion_adherent_plural: "Eshu"               
 eshu_religion_desc: "Eshu có những quy tắc ứng xử riêng khác với các triều đình của Sidhe. Những kẻ theo lối danh dự và truyền thống thích được gọi là Ojo, hay ánh sáng ban ngày, fae. Những kẻ theo triết lý gạt bỏ lối cũ và buông thả đam mê, một cái chết của truyền thống, tự xưng là Iku, hay tử vong. Đừng nghĩ điều này có nghĩa là mọi Ojo đều tử tế và hào phóng hay mọi (hay thậm chí phần lớn) Iku đều là những kẻ trác táng sát nhân. Cả hai nhóm đều tuân theo Uhuru. Sa vào tay một quan tòa Ojo không chịu khoan nhượng cũng tệ chẳng kém gì bị một Iku mang mối thù bắt được. Eshu không gắn định kiến nào cho những triết lý này, trừ những trường hợp cực đoan, vì trong tất cả fae, họ xem mình là những cá thể riêng biệt. Hãy đánh giá một Eshu qua "triều đình" mà hắn chọn với rủi ro của riêng bạn."
 
 ojo_religion: "@changeling_icon! Ojo"
 ojo_religion_adj: "Ojo"
 ojo_religion_adherent: "Ojo"
 ojo_religion_adherent_plural: "Ojo"
 ojo_religion_desc: "Trong cách nói thông thường của Eshu, Ojo (aw-jaw) nghĩa là Ánh Sáng Ban Ngày và Sự Sống."
 
 ojo: "Ojo"
 ojo_adj: "Ojo"
 ojo_adherent: "Ojo"
 ojo_adherent_plural: "Ojo"
 ojo_desc: "Trong cách nói thông thường của Eshu, Ojo (aw-jaw) nghĩa là Ánh Sáng Ban Ngày và Sự Sống. Phần lớn Eshu mà bạn gặp, trên thực tế, sẽ là Ojo. Điều này đến một cách tự nhiên và phần lớn Elegbara rút sức mạnh từ hàng thiên niên kỷ truyền thống và lịch sử gắn liền với nó. Tuy nhiên, họ không tuân theo Luật Seelie (thứ mà họ có trước). Họ có những chuẩn mực riêng để tự đánh giá mình, dù họ vẫn sẽ tôn trọng Seelie vốn thường không mâu thuẫn. Eshu đơn giản chỉ có những giá trị cốt lõi khác biệt.\nHãy Nghe Theo Tiếng Gọi của Định Mệnh — Mọi Ojo tin rằng các orisha định đoạt mọi điều xảy ra.\nTruyền Lại Những Gì Ngươi Đã Nghe — Nếu không ai nhớ lịch sử, chúng ta sẽ lặp lại cùng những sai lầm. Một câu chuyện bị lãng quên là một đòn giáng vào tất cả Fae.\nTìm Công Lý Cho Những Kẻ Không Được Lắng Nghe — Eshu cảm thấy gắn bó với những dân tộc bị gạt ra bên lề khác và cố gắng hết sức để giúp đỡ."
 
 ojo_humanists: "Ojo Humanists"
 ojo_humanists_adj: "Ojo Humanist"
 ojo_humanists_adherent: "Ojo Humanist"
 ojo_humanists_adherent_plural: "Ojo Humanists"
 ojo_humanists_desc: "Một số Ojo đã tiếp thu cách tiếp cận của Eshu đối với lối sống changeling và việc sống giữa loài người đến mức họ thúc đẩy một chương trình nghị sự chính trị tương tự phe Nhân Đạo của các Triều đình Mùa."
 
 ojo_constantinians: "Ojo Constantinians"
 ojo_constantinians_adj: "Ojo Constantinian"
 ojo_constantinians_adherent: "Ojo Constantinian"
 ojo_constantinians_adherent_plural: "Ojo Constantinians"
 ojo_constantinians_desc: "Do Thái giáo, Cơ Đốc giáo và Hồi giáo đã lan rộng khắp châu Phi, thay thế các tín ngưỡng và phong tục ngoại giáo. Một số Ojo tìm cách hòa giải đức tin của họ vào Ánh Sáng Ban Ngày và Sự Sống với thần học và thực hành của Giáo hội loài người. Sách Enoch được cộng đồng Do Thái Beta Israel sử dụng ở Ethiopia, cũng như Giáo hội Chính Thống Ethiopia Tewahedo Cơ Đốc giáo. Trong các trang sách chứa đựng những câu chuyện về các thiên thần canh gác, Grigori và hậu duệ khổng lồ nửa người nửa thiên thần của họ, Nephilim. Fae có thể chính là Grigori và Nephilim đã được cứu chuộc." 
 
 iku_religion: "@changeling_icon! Iku"
 iku_religion_adj: "Iku"
 iku_religion_adherent: "Iku"
 iku_religion_adherent_plural: "Iku"       
 iku_religion_desc: "Trong cách nói thông thường của Eshu, Iku (ee-ku) là Tử Vong và Bóng Tối."
 
 iku: "Iku"
 iku_adj: "Iku"
 iku_adherent: "Iku"
 iku_adherent_plural: "Iku"
 iku_desc: "Trong cách nói thông thường của Eshu, Iku (ee-ku) là Tử Vong và Bóng Tối. Iku nhìn nhận mọi thứ có phần khác với Ojo. Eshu có thể nói rằng họ đối xử với cả Ojo lẫn Iku như nhau nhưng Iku biết điều đó không đúng. Họ biết Ojo xem họ như một trò đùa và là một trò đùa cay nghiệt, khó chịu, và ngay khi những kẻ còn lại biết điều đó, bạn tụt xuống vài bậc trong danh sách của họ. Nhiều kẻ nghĩ rằng vì họ không cúi đầu trước định mệnh nên họ không phải Elegbara thực thụ nhưng họ cũng có một quy tắc riêng. Dù không hoàn toàn giống Unseelie, họ vẫn hòa hợp khá tốt.\nKhông Có Định Mệnh Nào Cả — Điều này nghĩa là gì? Họ thực sự, tối hậu, là Tự Do!\nĐể Lại Rắc Rối Trên Đường Đi — Hỗn loạn kéo con người ra khỏi sự tự mãn. Khiến những kẻ nắm quyền sợ hãi bạn và những gì bạn biết.\nBáo Thù Là Thiêng Liêng — Họ tự lo cho bản thân trước tiên và đảm bảo rằng bất kỳ ai gây rắc rối với họ đều mất đi thứ gì đó, dù là danh dự, của cải, hay một bộ phận cơ thể."
 
 iku_humanists: "Iku Humanists"
 iku_humanists_adj: "Iku Humanist"
 iku_humanists_adherent: "Iku Humanist"
 iku_humanists_adherent_plural: "Iku Humanists"
 iku_humanists_desc: "Một số Iku đã tiếp thu cách tiếp cận của Eshu đối với lối sống changeling và việc sống giữa loài người đến mức họ thúc đẩy một chương trình nghị sự chính trị tương tự phe Nhân Đạo của các Triều đình Mùa."
 
 mu_religion: "@changeling_icon! Mu Courts"
 mu_religion_adj: "Mu Courts"
 mu_religion_adherent: "Mu"
 mu_religion_adherent_plural: "Mu"        
 mu_religion_desc: "Mu Courts là các nhóm Hsien đã tự nộp mình cho [Glossary('Yama Kings','podgloss.yamaking')] trong [Glossary('Fourth Age','game_concept_fourth_age_desc')] vì họ không thấy lối thoát nào khỏi tình thế nan giải mà chính họ đã gây ra cho mình bằng cách phá vỡ Thiên Mệnh. Hai triều đình này không liên minh với nhau nhưng cả hai đều bất hòa với các Triều đình Hsien khác."
 
 daityas: "Daityas"
 daityas_adj: "Daityas"
 daityas_adherent: "Daityas"
 daityas_adherent_plural: "Daityas"
 daityas_desc: "Daityas là một Triều đình Hsien đã liên minh với [Glossary('Yama Kings','podgloss.yamaking')] trong [Glossary('Fourth Age','game_concept_fourth_age_desc')] nhưng từ đó đã quay lưng lại với chúng. Không lâu sau khi họ thề trung thành với [Glossary('Yama Kings','podgloss.yamaking')], xã hội Daityas nhận ra rằng lũ quỷ chỉ làm hủ hóa họ và ăn mòn năng lượng sự sống của họ nên họ đã rời bỏ liên minh. Thông qua pháp thuật hắc ám của riêng mình, họ cũng tìm ra cách duy trì thân xác và tránh rơi vào hư vô như những Hsien khác.\nDaityas nỗ lực khuyến khích sự đến gần của [Glossary('Sixth Age','game_concept_sixth_age_desc')]; để mang đến một thời khắc khi [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')] bị trục xuất khỏi Thiên Triều của mình và Rồng cùng Phượng Hoàng giao chiến với nhau trong một cuộc chiến đẫm máu. Bằng cách cổ súy sự thiếu niềm tin, họ tìm cách làm suy yếu bức tường do August Personage tạo ra và từ đó đòi lại vị trí xứng đáng của mình trong Thiên Triều.\nDù bị các Hsien khác xem là lầm lạc, họ vẫn chưa phải là không thể cứu chuộc. Nếu muốn, họ có thể quay lại con đường đúng đắn và giúp các Hsien tránh khỏi Kỷ Nguyên Đau Buồn."
 
 kura_sau: "Kura Sau"
 kura_sau_adj: "Kura Sau"
 kura_sau_adherent: "Kura Sau" 
 kura_sau_adherent_plural: "Kura Sau"
 kura_sau_desc: "Kura Sau là một xã hội của những Hsien đã bị hủ hóa. Cũng được gọi là Gou Zhang, đây là một xã hội của những Hsien đã tự nộp mình cho [Glossary('Yama Kings','podgloss.yamaking')] và được xem là một phần của Mu Courts. Do đó, họ có thể du hành đến [UmbraGlossary('yomi_wan')] mà không phải chịu lời nguyền của August Personage In Jade. Thêm vào đó, họ có nhánh Wu Tan riêng được gọi là Hac Tao, một pháp thuật đê hèn cho phép họ mang khí ô uế của Thousand Hells vào thế giới.\nHọ nỗ lực hoàn thành chương trình nghị sự của những chủ nhân hắc ám của mình, mang đến [Glossary('Sixth Age','game_concept_sixth_age_desc')] và làm hủ hóa phần lớn Trung Nguyên. Phần lớn là những phản chiếu hắc ám của Hsien nguyên bản và một số thậm chí đáp lại lời cầu nguyện, với điều kiện chúng liên quan đến đổ máu và thỏa mãn những khao khát đen tối hơn. Một số cho rằng Kura Sau thậm chí còn chịu trách nhiệm cho sự hủ hóa của một số rồng và phượng hoàng, cám dỗ chúng bằng những lời hứa hẹn quyền năng mà chỉ [Glossary('Yama Kings','podgloss.yamaking')] mới có thể ban tặng."
 
 shinma_religion: "@changeling_icon! Shinma"
 shinma_religion_adj: "Shinma"
 shinma_religion_adherent: "Shinma"
 shinma_religion_adherent_plural: "Shinma"
 shinma_religion_desc: "Các Triều đình của Fae Phương Đông, Shinma, được xây dựng dựa trên ý thức hệ và thế giới quan."
 shu_shen: "Shu Shen"
 shu_shen_adj: "Shu Shen"
 shu_shen_adherent: "Shu Shen"
 shu_shen_adherent_plural: "Shu Shen" 
 shu_shen_desc: "Shu Shen là những kẻ trác táng của xã hội Shinma. Những Vị Thần Phàm Tục thách thức khái niệm cân bằng và theo đuổi cực đoan cả về xác thịt lẫn bạo lực. Chúng cướp bóc, hãm hại, sát hại, và nhìn chung hủy hoại danh tiếng của các Hsien nhân từ ở khắp mọi nơi. Chúng là lính đánh thuê và vệ sĩ cho những Shen quyền lực hơn có thể trả giá cho chúng, bao gồm cả [GetTrait('kueijin').GetName( GetNullCharacter )] hay thậm chí Kin-jin. Chúng có thể có đồng minh trong hàng ngũ ma cà rồng hoặc thậm chí là tôi tớ của [Glossary('Yama Kings','podgloss.yamaking')]."
 
 li_shen: "Li Shen"
 li_shen_adj: "Li Shen"
 li_shen_adherent: "Li Shen"
 li_shen_adherent_plural: "Li Shen"
 li_shen_desc: "Còn được gọi là phe Truyền Thống, Những Vị Thần Nghi Lễ hay đơn giản là Fu, Li Shen ôm lấy các giá trị Nho giáo. Họ tin vào [Glossary('Tao Te Hsien','game_concept_tao_te_hsien_desc')] nhưng nhấn mạnh sự trật tự của tự nhiên và việc duy trì nó, chứ không phải sự giác ngộ bản thân. Việc bảo vệ tự nhiên là mối quan tâm hàng đầu của họ và số lượng của họ gần như toàn bộ là Kamuii. Từng là quyền lực nhất trong các triều đình, Những Vị Thần Nghi Lễ đã mất liên lạc với các Shen khác và thường xuyên coi thường họ. Do định kiến này, cũng như mọi sự tranh giành nội bộ giữa các bộ, Fu không còn làm tốt công việc của mình như trước nữa."
 
 tu_shen: "Tu Shen"
 tu_shen_adj: "Tu Shen"
 tu_shen_adherent: "Tu Shen"
 tu_shen_adherent_plural: "Tu Shen"
 tu_shen_desc: "Dù bị phần lớn Shinma khác xem là những kẻ khoái lạc, Những Vị Thần Hòa Hợp, hay Đại Sứ của Thiên Đường, có cùng mục tiêu với Xian Mo... chỉ là bằng những cách rất khác nhau để đạt được nó. Họ tìm cách mang đến Kỷ Nguyên Hoan Lạc bằng cách thuyết phục mọi người tận hưởng thời gian tốt đẹp. Sự mê đắm, hân hoan, chứ không đơn thuần là khoái cảm xác thịt, mới là mục tiêu của họ. Họ hiểu rằng một bữa tối ngon lành với gia đình và bạn bè thỏa mãn và duy trì niềm vui lâu bền hơn một nắm thuốc. Những Vị Thần Hòa Hợp hành động theo niềm tin của mình bằng cách làm việc thiện, cố gắng khiến các triều đình shen khác nhau hợp tác hay ít nhất là trò chuyện với nhau. Họ đi đứng, và đôi khi ăn chơi, đúng như cách họ nói.\nĐại Sứ của Thiên Đường bị Li Shen nhìn với ánh mắt ngờ vực và quan hệ của họ với Yü cũng căng thẳng không kém. Phần lớn những kẻ khác ít nhất cũng thích sự đồng hành của họ. Về phần mình, Tu Shen nói rằng họ có quan hệ tốt với mọi nhóm."
 
 xian_mo: "Xian Mo"
 xian_mo_adj: "Xian Mo"
 xian_mo_adherent: "Xian Mo"
 xian_mo_adherent_plural: "Xian Mo"
 xian_mo_desc: "Còn được gọi là Những Kẻ Trầm Lặng hay Linh Hồn Pháp Thuật Bất Tử, Xian Mo là những nhà thần bí và tín đồ kiên định của [Glossary('Tao Te Hsien','game_concept_tao_te_hsien_desc')]. Họ tin rằng những cá nhân giác ngộ có thể tạo ra một thế giới hoàn hảo và đảo ngược vòng xoay của các Kỷ Nguyên. Sự nhấn mạnh vào cá nhân này khiến họ chống lại trật tự; họ thậm chí từ chối xem mình là một triều đình. Xian Mo là cái tên các Hsien khác đặt cho họ.\nTuy nhiên, Những Kẻ Trầm Lặng lại mang đến hy vọng cho Shinma, thứ mà phần lớn đã từ bỏ vào cuối [Glossary('Fourth Age','game_concept_fourth_age_desc')] khi Bức Tường ngăn họ khỏi [spirit_world|E]. Hanuman đã mang [Glossary('Tao Te Hsien','game_concept_tao_te_hsien_desc')] đến cho một hiền triết Komuko ở Di Fu. Komuko đã từ chức và ẩn cư vào núi non. Cuối cùng những lời dạy của họ dẫn đến những trước tác giờ được gọi là [Glossary('Tao Te Hsien','game_concept_tao_te_hsien_desc')], hay "Con Đường của Quyền Năng Hsien Sắp Đến." Những tín đồ nhiệt thành của nó giờ đây tạo thành Xian Mo và những lời dạy của họ đã khiến một số vượt qua được Bức Tường."
 
 xian_mun: "Xian Mun"
 xian_mun_adj: "Xian Mun"
 xian_mun_adherent: "Xian Mun"
 xian_mun_adherent_plural: "Xian Mun"
 xian_mun_desc: "Xian Mun, còn được gọi là Hội Bất Tử hay Những Kẻ Thế Tục, là những Shinma hoặc từ chối bản chất thật của mình hoặc quan tâm nhiều hơn đến đời sống phàm tục của họ. Một số thậm chí có thể dùng quyền năng của mình để thúc đẩy những chương trình nghị sự khác. Những kẻ tốt nhất trong Những Kẻ Thế Tục cảm thấy rằng có thể tuân theo [Glossary('Tao Te Hsien','game_concept_tao_te_hsien_desc')] bên ngoài xã hội hsien truyền thống trong khi những kẻ tệ nhất chẳng mấy bận tâm đến nó.\nHội Bất Tử xem thành viên của các triều đình khác như những kẻ ngốc bị lừa dối. Các cá nhân trả lời qua loa (kèm theo chút tiền và ngọc bích) cho các bộ địa phương và những kẻ mạnh Yü chỉ để được yên thân. Họ có xu hướng tự tổ chức theo nhiều mô hình khác nhau, dù là gia đình hay tập đoàn hay các thể chế khác của loài người."
 
 yellow_lotus: "Yellow Lotus"
 yellow_lotus_adj: "Yellow Lotus"
 yellow_lotus_adherent: "Yellow Lotus"
 yellow_lotus_adherent_plural: "Yellow Lotus"
 yellow_lotus_desc: "Yellow Lotus là một hội kín, tinh tế trong xã hội Hsien. Họ tản mác giữa các đồng loại hsien của mình và mục tiêu của họ có thể có vẻ mâu thuẫn. Trên thực tế, không ai biết chương trình nghị sự thật sự của họ hay thậm chí ai là thành viên của họ. Mục tiêu rõ ràng duy nhất của họ là khơi mào nổi loạn trong hàng ngũ Shinma. Họ khơi lại những mối thù cổ xưa và những sai lầm bị lãng quên từ lâu, tất cả để phá vỡ trật tự của các bộ Li Shen. Tuy nhiên, họ cũng nhận trách nhiệm trừng phạt những kẻ quá lộ liễu trong việc phô bày hình dạng wani của mình và do đó đôi khi hành động như một dạng cảnh sát mật. Công việc của họ bao trùm từ tung tin đồn đến ám sát. Họ muốn gì? Có lẽ họ chỉ đơn giản thích khuấy động hỗn loạn vì chính nó." 
 
 yu: "Yü"
 yu_adj: "Yü"
 yu_adherent: "Yü"
 yu_adherent_plural: "Yü"
 yu_desc: "Yü, còn được gọi là phe Cổ Điển hay Thập Đại Vương, mô phỏng bản thân theo Mười Vị Vua Trung Hoa thời tiền sử. (Họ thậm chí có thể từng là một số trong số đó.) Họ đã chia Trung Nguyên thành 10 tỉnh huyền bí nhưng những cuộc chiến của họ khiến biên giới thường xuyên thay đổi. Nhìn chung họ ủng hộ Fu và các Bộ của Fu, miễn là họ có thể khiến các bên đối đầu nhau và tận dụng tài năng của họ. Yü đã tích trữ ngọc bích qua nhiều thế kỷ và sở hữu một số hiện vật ngọc bích quyền năng nhất cho đến ngày nay. Họ cũng kiểm soát nhiều Tổ Rồng.\nTuy nhiên, không phải tất cả Yü đều là quý tộc. Một số chỉ là những lãnh chúa chiến tranh và tội phạm quyền lực kiểm soát các Bang Hội và Tam Hoàng hùng mạnh. Những Shinma này đối đầu trực diện với những Shen khác có lợi ích trong những giao dịch kinh doanh kém hợp pháp hơn của Trung Nguyên như [GetTrait('kueijin').GetName( GetNullCharacter )], Kindred, và những kẻ khác. Không Triều đình nào khác có thể chịu đựng quan hệ xấu với Yü nên đổi lại, họ đối xử với phần lớn những kẻ khác bằng sự tôn trọng. Mu Courts và [GetTrait('kueijin').GetName( GetNullCharacter )] là kẻ thù lớn nhất của họ."

 wu_hsien: "Wu Hsien"
 wu_hsien_adj: "Wu Hsien"
 wu_hsien_adherent: "Wu Hsien"
 wu_hsien_adherent_plural: "Wu Hsien"
 wu_hsien_desc: "Còn được gọi là Nông Dân hay Gia Tộc của Hsien, Wu Hsien là một xã hội chung cho tất cả. Đây là một danh xưng cho đại đa số Shinma sống trong những ngôi làng nhỏ và có mối liên hệ chặt chẽ với đất đai và các đền thờ địa phương. Họ có thể có những tổ chức chặt chẽ nhưng chỉ ở quy mô địa phương. Họ có thể khép kín và chỉ quan tâm đến người dân và môi trường địa phương.\nKhông nghi ngờ gì có nhiều Hirayanu hơn Kamuii trong số Nông Dân. Những Hsien này thường được xem là tôi tớ của cả Li Shen lẫn Yü nhưng lòng trung thành thật sự của họ chỉ nằm ở những ngôi làng, đền thờ, và những địa danh thiên nhiên tươi đẹp tại địa phương."
 
