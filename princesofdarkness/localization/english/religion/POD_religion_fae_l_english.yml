 winter_court_trucebearers_desc: "Khi Hiệp ước Đình chiến bước vào những giờ khắc cuối cùng, những fae Mùa Đông 'Truce-Bearer' khó lòng nhỏ dãi thèm khát một trận chiến với nanh vuốt đã mài sắc. Phần lớn thành viên Triều đình này thực ra khá thờ ơ với Chiến tranh Mùa. Trong nhiều trường hợp, họ quá xa rời chính trường fae để theo kịp làn sóng liên minh và phản bội mới nhất; và để hạn chế thêm sự dính líu của mình, họ thường chẳng quan tâm ai đang đâm sau lưng ai vì một hiệp ước địa phương nhỏ nhặt nào đó. Nhiều fae Mùa Đông là những kẻ thực tế, và có thể thấy rõ rằng Chiến tranh Mùa là một thứ gì đó giống như một cuộc thử thách bất tận. Phần lớn quan tâm nhiều hơn đến việc cứu lấy bản thân và bảo vệ lãnh địa của mình trước bất kỳ ảnh hưởng nào của loài người."

