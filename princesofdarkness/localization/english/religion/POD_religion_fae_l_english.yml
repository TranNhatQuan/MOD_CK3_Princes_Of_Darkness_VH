 spring_court_trucebearers_desc: "Trong khi phần lớn Triều đình Mùa Xuân chào đón hồi kết của Hiệp ước Đình chiến như một sự đổi thay lớn lao, đám Spring-kin Truce-Bearer lập luận rằng một thỏa hiệp trong đó quyền cai trị thế giới luân phiên qua các triều đình theo mùa sẽ là một sự đổi thay lớn hơn nhiều so với việc chỉ một triều đình duy nhất, dù là Triều đình Mùa Xuân, lên nắm quyền một mình."

 spring_court_humanists: "Spring Court Humanists"
 spring_court_humanists_adj: "Spring Court Humanist"
 spring_court_humanists_adherent: "Spring-kin Humanist"
 spring_court_humanists_adherent_plural: "Spring-kin Humanists"
 spring_court_humanists_desc: "Phần lớn Triều đình Mùa Xuân theo chương trình nghị sự Nhân Đạo. Đám Spring-kin thường được xem là bảo vệ loài người nhiều nhất, dù điều này không hẳn là một hành động vị tha tận tụy. Fae Mùa Xuân nhận ra rằng họ phải củng cố mối quan hệ cùng có lợi giữa hai chủng tộc, kẻo fae trượt khỏi tâm trí người phàm mãi mãi. Do đó, những lời thề của họ thường liên quan đến việc giúp đỡ hay bảo vệ loài người, dù những lời thề nặng nề như vậy đòi hỏi những cam kết tương xứng từ người phàm bị ràng buộc bởi lời thề."

 spring_court_constantinians: "Spring Court Constantinians"
