 autumn_court_militants: "Autumn Court Militants"
 autumn_court_militants_adj: "Autumn Court Militant"
 autumn_court_militants_adherent: "Autumn-kin Militant"
 autumn_court_militants_adherent_plural: "Autumn-kin Militants"
 autumn_court_militants_desc: "Phe Hiếu Chiến xuất hiện ở mọi Triều đình, dù Triều đình Mùa Thu có số lượng ít nhất khao khát chiến trận. Một số ít fae Mùa Thu nóng lòng mong Hiệp ước Đình chiến kết thúc để họ có thể trở lại cuộc giao tranh của Chiến tranh Mùa.\n\nĐám Autumn-Kin Militant dệt nên những âm mưu để thao túng cả fae lẫn người phàm làm quân cờ trong cuộc chiến. Họ tìm cách dùng loài người và những lời thề cũ như vũ khí trong Chiến tranh Mùa. Người phàm, với mọi sự yếu đuối và nhược điểm của họ, vẫn hữu ích nhờ những lời thề ràng buộc họ—hữu ích cả như tấm khiên chống lại banality lẫn như đồng minh trong cuộc xung đột sắp tới. Chiến tranh Mùa bắt đầu bằng ám sát, phục kích của lính đánh thuê, những cuộc tấn công ủy nhiệm lừa gạt cả người phàm lẫn fae, đâm sau lưng, lính đánh thuê Mùa Giao và bất ngờ—fae Mùa Thu tin rằng nó cũng có thể thắng bằng những phương thức như vậy. Ra tay từ bóng tối!"

