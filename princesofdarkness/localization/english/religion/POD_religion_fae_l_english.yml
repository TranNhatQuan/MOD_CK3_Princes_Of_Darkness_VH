 spring_court_militants_desc: "Trong Chiến tranh Mùa, đám Spring-kin Militant là những chiến binh hăng hái, khao khát giành chiến thắng một lần và mãi mãi; và trong cõi người, họ tìm cách giành lại vị thế liên quan đến loài người và được sợ hãi lẫn kính trọng một lần nữa. Triều đình của sự đổi thay và nghịch lý, fae Mùa Xuân nỗ lực thay đổi mọi thứ theo hướng có lợi cho mình, trước khi loài người quên lãng họ, hoặc trục xuất fae vĩnh viễn. Nhiều kẻ theo phe Spring-kin Militant ủng hộ việc bàn luận các vấn đề của cõi người giữa những cuộc giao tranh thù địch với các triều đình khác. Nhiều Triều đình Mùa Xuân phô trương sự hiện diện của các đội quân đã tập hợp, dù chỉ là cái bóng rỗng tuếch của những đạo quân vĩ đại từ Trận Đá, vẫn đáng gờm nhờ kỹ năng và sự tận tụy của họ."

