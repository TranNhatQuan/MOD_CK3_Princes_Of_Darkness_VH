 #Rakta-sadhu-Group Faiths
 raktasadhus: "Rakta-sadhus"
 raktasadhus_adj: "Rakta-sadhus"
 raktasadhus_adherent: "Rakta-sadhu"
 raktasadhus_adherent_plural: "Rakta-sadhus"
 raktasadhus_desc: "Ma cà rồng Ấn Độ hành pháp một hình thức huyết thuật gọi là Sadhana. Dù có những $pod_cainites$ Ấn Độ không hành pháp Sadhana, danh xưng số nhiều rakta-sadhus đôi khi vẫn được dùng để gọi chung mọi $pod_cainites$ Ấn Độ, phần lớn vì họ vẫn chưa chính thức hóa mạng lưới liên minh phù du của mình thành một giáo phái hay Triều đình thực thụ. Những liên minh đó thậm chí có lẽ đã chẳng bao giờ tồn tại nếu không có sự chống đối từ các ma cà rồng Cathay của Triều Đình Vạn Lôi vô hạn ở miền nam Ấn Độ và Triều Đình Phượng Hoàng Đỏ Thẫm ở miền đông Ấn Độ."
 
 mayaparisatya: "Mayaparisatya"
 mayaparisatya_adj: "Mayaparisatya"
 mayaparisatya_adherent: "Asura"
 mayaparisatya_adherent_plural: "Asura"
 mayaparisatya_desc: "Con Đường Nghịch Lý mang một món nợ nặng nề với một số giáo lý của Ấn Độ giáo. Theo đó, Huyết Tộc bị khóa chặt vĩnh viễn bên ngoài vòng luân hồi ảo mộng của vũ trụ (maya). Trong khi hầu hết chúng sinh đều tái sinh qua Saṃsāra, một sự vướng mắc liên tục trong vòng luân hồi, Huyết Tộc đã thoát khỏi vòng ấy. Mỗi cá nhân đều có mục đích riêng của mình, hay Svadharma, dù ma cà rồng, bị loại khỏi vòng luân hồi, đã đánh mất mục đích ấy."

 viaparadox: "Con Đường Nghịch Lý"
 viaparadox_adj: "Nghịch Lý"
 viaparadox_adherent: "Kẻ Lừa Dối"
 viaparadox_adherent_plural: "Những Kẻ Lừa Dối"
 viaparadox_desc: "Những Kẻ Lừa Dối tin vào một mục đích cao cả hơn cho mọi người, kể cả bản thân họ, những ma cà rồng khác, và người phàm. Nhiệm vụ của họ trong đời là dẫn dắt mọi người đến với vận mệnh cao cả hơn của họ. Nếu cần, điều này bao gồm cả cái chết, đặc biệt với những Huyết Tộc mà họ xem là lầm lạc và đã sa ngã khỏi vận mệnh thật sự của mình.\nTrong suốt nhiều thế kỷ chia cách với anh em phương Đông, con đường này đã biến đổi mạnh mẽ và giờ đây thường bị xem chỉ là cái cớ cho trộm cắp, diablerie, và những tội ác khác chống lại xã hội."

 pathofdevaraja: "Con Đường Devaraja"
 pathofdevaraja_adj: "Devaraja"
 pathofdevaraja_adherent: "Đấng Thần Thánh"
 pathofdevaraja_adherent_plural: "Các Đấng Thần Thánh"
 pathofdevaraja_desc: "Tín đồ của con đường này không tin vào một thứ quyền thiêng liêng nào để cai trị. Thay vào đó, họ tin rằng mình phải giành lấy quyền cai trị và vươn lên thần thánh trong mắt dân chúng của mình. Các Đấng Thần Thánh không tạo ra thần dân và kẻ dưới, mà thay vào đó, tạo ra tín đồ và người sùng bái."

 pathofdaitya: "Con Đường Daitya"
 pathofdaitya_adj: "Daitya"
 pathofdaitya_adherent: "Kẻ Dụ Rắn"
 pathofdaitya_adherent_plural: "Những Kẻ Dụ Rắn"
 pathofdaitya_desc: "Daitya tôn thờ Shiva, và tự xưng là thủ lĩnh của mọi ma cà rồng thờ phụng Shiva. Daitya xem bổn phận đẳng cấp của mình như một sự đảo ngược kỳ lạ của Bà-la-môn giáo phàm trần. Là ác quỷ, chúng phải chiến đấu với các vị thần và nỗ lực lật đổ trật tự đạo đức của thế giới. Nhưng là Brahmin, chúng lại phải nỗ lực giữ cho các ma cà rồng đồng bọn nằm trong đúng bổn phận đẳng cấp của mình như những kẻ sát nhân, lừa đảo, kẻ báng bổ nghi lễ thiêng liêng và mọi vai trò đáng ghê tởm khác vốn được giao cho ác quỷ."

 samsara: "Samsara"
 samsara_adj: "Samsara"
 samsara_adherent: "Rakshasa"
 samsara_adherent_plural: "Rakshasa"
 samsara_desc: "Con Đường Nghịch Lý hiện đại, còn gọi là Saṃsāra, là sáng tạo của những ma cà rồng Ravnos mới hóa. Nó không cứng nhắc như Mayaparisatya, nhưng cũng không cho phép sự tàn nhẫn vô độ và chủ nghĩa khoái lạc của Con Đường phương Tây. Đạo Lý của nó giống với Mayaparisatya, nhưng Thang Tội Lỗi đã được điều chỉnh để cho phép giao tiếp với những ma cà rồng không theo con đường này."