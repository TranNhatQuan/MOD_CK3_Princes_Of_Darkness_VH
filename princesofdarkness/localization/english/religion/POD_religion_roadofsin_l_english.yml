 #Sinner-Group Faiths
 viapeccati: "Via Peccati"
 viapeccati_adj: "Peccati"
 viapeccati_adherent: "Tội Nhân"
 viapeccati_adherent_plural: "Tội Nhân"
 viapeccati_desc: "Tín đồ của Via Peccati kiềm chế Dã Thú bằng cách buông mình theo mọi ý thích và ham muốn, bất kể làm tổn thương ai. Không làm theo ý mình sẽ khiến tình trạng của họ tệ hơn, nghĩa là đạo đức, luân lý và luật lệ thường bị bỏ lại phía sau khi họ bước đi trên Con Đường này. Tín đồ Via Peccati không hẳn là tà ác; chỉ là hoàn toàn buông thả theo bản thân."

 viavoluptuous: "Via Voluptarius"
 viavoluptuous_adj: "Voluptarius"
 viavoluptuous_adherent: "Kẻ Truy Hoan"
 viavoluptuous_adherent_plural: "Kẻ Truy Hoan"
 viavoluptuous_desc: "Tội Nhân của Con Đường Khoái Lạc là những kẻ khoái lạc chủ nghĩa nhất trong số những kẻ theo Con Đường Tội Lỗi. Với họ, khoái lạc là tất cả những gì liên quan tới sự tồn tại của họ, và tuyệt đối không có gì là cấm kỵ."

 viacrudelitas: "Via Crudelitas"
 viacrudelitas_adj: "Crudelitas"
 viacrudelitas_adherent: "Kẻ Vô Tâm"
 viacrudelitas_adherent_plural: "Kẻ Vô Tâm"
 viacrudelitas_desc: "Tín đồ của Con Đường Tàn Nhẫn là những kẻ hoài nghi và căm ghét nhất trong đám Tội Nhân. Xuất phát rất nhiều từ triết lý 'làm tổn thương chúng trước khi chúng làm tổn thương ta', Tội Nhân ở đây không tin vào lòng thương xót, sự cảm thông hay niềm trắc ẩn. Trái lại, khoái cảm duy nhất của họ đến từ nỗi đau của kẻ khác."

 viaadversarius: "Via Adversarius"
 viaadversarius_adj: "Adversarius"
 viaadversarius_adherent: "Kẻ Nghịch Thù"
 viaadversarius_adherent_plural: "Kẻ Nghịch Thù"
 viaadversarius_desc: "'Con Đường của Quỷ' không nên bị nhầm với cái gọi là Via Diabolis, những Tội Nhân này nỗ lực để không bị thao túng. Là những kẻ ám ảnh kiểm soát tột độ, họ sẽ đi đến những chừng mực cực đoan để bảo vệ ý chí tự do của mình và, khác thường thay, cả ý chí tự do của kẻ khác. Nhiều người coi họ là 'dễ chịu' nhất trong đám Tội Nhân."

 viadiabolis: "Via Diabolis"
 viadiabolis_adj: "Diabolis"
 viadiabolis_adherent: "Ác Quỷ"
 viadiabolis_adherent_plural: "Ác Quỷ"
 viadiabolis_desc: "Vốn là một Con Đường mang tính hủy diệt, Via Diabolis không được xem là con đường để dấn thân một cách hời hợt; những kẻ dám theo nó buông mình vào đủ mọi kiểu truỵ lạc và hủy diệt. Nhiều kẻ không thực sự tà ác, mà chỉ tin rằng một cuộc bất tử đức hạnh là một mưu cầu vô ích. Tuy nhiên, một số lại xem vai trò của quỷ một cách nghiêm túc, thậm chí tự xưng là quỷ hóa thân và tôi tớ của Sa-tăng. Baali đặc biệt gắn liền với Via Diabolis."

 viaprometheus: "Via Prometheus"
 viaprometheus_adj: "Promethean"
 viaprometheus_adherent: "Promethean"
 viaprometheus_adherent_plural: "Promethean"
 viaprometheus_desc: "Còn được gọi là Kẻ Mang Lửa, họ là một giáo phái $pod_cainites$ mơ về việc tái tạo Carthage và sự hài hòa giữa Huyết Tộc và Kine gắn liền với nó. Không có gì lạ khi nhiều thành viên là Brujah. Vì nhiều thành viên của các Clan Thượng Đẳng xem những viễn kiến này là phản nghịch, các Promethean buộc phải hành động lén lút."
 
 viafurores: "Via Furores"
 viafurores_adj: "Furores"
 viafurores_adherent: "Furores"
 viafurores_adherent_plural: "Furores"
 viafurores_desc: "Thành viên của giáo phái này có tiếng là những kẻ ngoài vòng pháp luật của $pod_cainites$. Bị hầu hết các prince lên án là trộm cắp và kẻ gây rối, họ tồn tại ở rìa của xã hội ma cà rồng, chật vật kiếm sống qua ngày như những kẻ đối chiếu phàm nhân của họ. Furores bị coi là hỗn loạn, nhưng họ có thể huy động một mức độ đam mê cho chính nghĩa của mình mà không nơi nào khác trong xã hội $pod_cainite$ sánh được."

 viaquiritare: "Via Quiritare"
 viaquiritare_adj: "Quiritare"
 viaquiritare_adherent: "Kẻ Gào Thét"
 viaquiritare_adherent_plural: "Kẻ Gào Thét"
 viaquiritare_desc: "Điên loạn nhất trong đám Tội Nhân và đối nghịch với Via Adversarius, tín đồ của Con Đường Tiếng Thét tin rằng vì họ đã bị đọa đày, họ cũng đã là con mồi của Dã Thú, và do đó tự cho phép mình bị nó thao túng để làm theo ý muốn của Dã Thú. Về bản chất họ là những ví dụ sống động của Địa Ngục Trần Gian; ngay cả những Tội Nhân khác cũng ghê tởm việc kết giao với những kẻ điên này."
 
 pathoftheeightfoldwheel: "Bánh Xe Tám Nan"
 pathoftheeightfoldwheel_adj: "Druid"
 pathoftheeightfoldwheel_adherent: "Druid"
 pathoftheeightfoldwheel_adherent_plural: "Druid"
 pathoftheeightfoldwheel_desc: "Con Đường Bánh Xe Tám Nan dựa trên tà giáo Celt, với trọng tâm đặc biệt vào chủ nghĩa druid. Họ đặt nặng việc tôn kính các vị thần và linh hồn của tự nhiên, phụng sự sự cân bằng trong vạn vật, và một lịch xoay vòng các lễ hội dựa trên thiên văn."
 
 pathofwatchfulgods: "Via Deorum Vigilans"
 pathofwatchfulgods_adj: "Vaticinator"
 pathofwatchfulgods_adherent: "Vaticinator"
 pathofwatchfulgods_adherent_plural: "Vaticinator"
 pathofwatchfulgods_desc: "Con Đường Các Vị Thần Canh Giữ tôn sùng đền thần ngoại giáo của người Hy Lạp và La Mã cổ đại, dù đền thần của các truyền thống ngoại giáo khác cũng tự định hướng theo Con Đường này. Ma cà rồng trên con đường này tận hiến bản thân để phụng sự các vị thần bằng cách dâng lễ vật đều đặn, tôn vinh và bảo vệ những gì các vị thần coi là thiêng liêng, và tuân theo những quy tắc danh dự nghiêm ngặt."

 viahyron: "Via Hyron"
 viahyron_adj: "Abelene"
 viahyron_adherent: "Abelene"
 viahyron_adherent_plural: "Abelene"
 viahyron_desc: "Con Đường Tổ Ong được theo gần như chỉ bởi Baali của Order of Moloch. Con Đường này rao giảng lòng trung thành bao trùm tất cả với toàn bộ dòng huyết thống và với [Glossary('Sire','game_concept_Sire_desc')] của mình nói riêng. Lý do chính cho điều này là vì các Đại Công Trình mà Baali muốn hoàn thành không thể đạt được một mình hay khi chúng cản trở công việc của kẻ khác. Ma cà rồng phải để tiếng nói của Bầy Đàn xâm nhập vào linh hồn mình để hiểu được những giấc mơ của các thực thể nơi Bóng Tối Ngoại Vực và giữ chúng ngủ yên. Ngoài ra, hầu hết ma cà rồng khác sẽ chủ động tiêu diệt một Baali nếu hắn đủ ngu ngốc để lộ mình là tín đồ."
 
 viatartaros: "Via Tártaros"
 viatartaros_adj: "Via Tártaros"
 viatartaros_adherent: "Tártarosin"
 viatartaros_adherent_plural: "Tártarosi"
 viatartaros_desc: "Tôn giáo phi chính thống này được một Người Bảo Trợ đặt riêng.\nHãy coi chừng, nơi đây có ác quỷ. Những Chiếc Chìa Khóa mở ngục tù xác thịt và xương cốt của chúng ta không thể tìm thấy chỉ qua học tập và thử nghiệm; thay vào đó ta phải tìm kiếm, không, chiếm lấy, tri thức mà những kẻ đứng bên kia ngưỡng cửa thế giới nắm giữ. Có kẻ gọi chúng ta là những người theo nội tại luận, nếu họ biết ý định thật sự của chúng ta, là vươn lên khỏi ngục tù mà ta đã hai lần sinh ra vào đó. Con đường này tăm tối, và đầy hiểm nguy, và ánh sáng duy nhất ta có thể tìm thấy là một ánh rạng rỡ xuyên thấu khủng khiếp, đe dọa thiêu đốt xác thịt ta và rút cạn chính linh hồn ta."

