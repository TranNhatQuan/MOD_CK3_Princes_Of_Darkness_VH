 holy_order_order_of_morrigan: "Order of the Morrigan"
 holy_order_order_of_tartaros: "Order of Tartaros"

 deimosianism: "Deimosianism"
 deimosianism_adj: "Deimosianism"
 deimosianism_adherent: "Deimosian"
 deimosianism_adherent_plural: "Deimosian"
 deimosianism_desc: "Ma cà rồng là hiện thân của những nỗi sợ nguyên thủy của Nhân Loại. Vì thế, chúng phải bộc lộ trong tình trạng của mình. Có lẽ một ngày nào đó nhân loại sẽ đủ mạnh mẽ để chinh phục nỗi sợ của mình. Cho tới lúc đó, Deimosian vẫn tự do lộng hành."
 
 servitorsofirad: "Servitors of Irad"
 servitorsofirad_adj: "Servant"
 servitorsofirad_adherent: "Servitor"
 servitorsofirad_adherent_plural: "Servitors"
 servitorsofirad_desc: "Tự xưng là tôi tớ của [Glossary('Antediluvians','game_concept_antediluvian_desc')], Servitors of Irad không mong cầu gì hơn ngoài chiến tranh và đổ máu bất tận. Hành tinh sẽ đẫm máu, và họ sẽ luôn ở tuyến đầu."
 
 baobhansith: "Baobhan Sith"
 baobhansith_adj: "Baobhan Sith"
 baobhansith_adherent: "Baobhan Sith"
 baobhansith_adherent_plural: "Baobhan Sith"
 baobhansith_desc: "Tôn giáo phi chính thống này được một Người Bảo Trợ đặt riêng.\n\nBaobhan Sith noi theo di sản của người sáng lập, Aisling Leanhaun, mà những lần hút máu đầu tiên của bà đã tạo cảm hứng cho truyền thuyết về Baobhan Sith ở vùng Cao Nguyên Scotland. Bị mê hoặc bởi huyền thoại về những ma cà rồng tiên tộc quyến rũ, sát nhân, tín đồ khoác lên mình khuôn mẫu ấy để giữ cho truyền thuyết luôn sống động." 
 holy_order_host_of_the_broken_heart: "Đoàn Quân Trái Tim Tan Vỡ"
 holy_order_host_of_the_unseelie: "Đoàn Quân Unseelie"
 
 pathoftevoro: "Path of Tevoro"
 pathoftevoro_adj: "Tevoro"
 pathoftevoro_adherent: "Timonian"
 pathoftevoro_adherent_plural: "Timoni"
 pathoftevoro_desc: "Tôn giáo phi chính thống này được một Người Bảo Trợ đặt riêng.\n\nCon Đường Tevoro là một lối đi dẫn tới nhiều năng lực và tri thức, mà một số cho là phi tự nhiên. Tevoro là đỉnh cao tột cùng của trải nghiệm Adrahasis. Timoni rao giảng việc theo đuổi tri thức—mọi tri thức." 
 
 bloodtribe: "Blood Tribe"
 bloodtribe_adj: "Blood Tribe"
 bloodtribe_adherent: "Anarch"
 bloodtribe_adherent_plural: "Anarch"
 bloodtribe_desc: "Được Miyako, Người Sáng Lập dòng huyết thống [GetTrait('bushi').GetName(GetNullCharacter)], khởi xướng đầu tiên, Blood Tribe là một tình huynh đệ tận tụy mãnh liệt, đoàn kết chống lại những cấu trúc áp bức của Thế Giới Đêm Tối. Thường chọn cái chết thay vì bị bắt giữ và tuân theo một quy tắc ứng xử nội bộ nghiêm ngặt khi hợp tác với nhau, các Blood Tribe theo nhiều cách giống với Furores xa hơn về phía Tây, dù có tổ chức hơn hẳn so với các đồng bào Vô Truyền Thống của họ." 
