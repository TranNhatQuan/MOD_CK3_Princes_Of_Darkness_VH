 cultofzilah_devil_name: "Haqim"
 cultofzilah_devil_name_possessive: "của Haqim"
 cultofzilah_desc: "Một nhóm $pod_cainites$ quy tụ quanh The Weeping Master và đệ tử của ông, Anosh. Sau khi tìm thấy một phiến đá khóc trong một thung lũng đã mất, giáo phái này trở thành những kẻ tôn thờ vị ma cà rồng thế hệ thứ hai tên là Zilah. Giờ đây họ đứng lên như kẻ thù của thế hệ thứ ba, những kẻ đã nổi loạn chống lại Caine và mệnh lệnh của những childer của Caine."
