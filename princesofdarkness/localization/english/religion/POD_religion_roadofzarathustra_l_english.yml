 #Zoroastrian-Group Faiths

 roadofagramainyu: "Con Đường Angra Mainyu"
 roadofagramainyu_adj: "Con Đường Angra Mainyu"
 roadofagramainyu_adherent: "Kẻ Tha Hóa"
 roadofagramainyu_adherent_plural: "Những Kẻ Tha Hóa"
 roadofagramainyu_desc: "Các tín đồ Bái Hỏa tin rằng họ — chịu ràng buộc bởi Angra Mainyu, Cơn Đói, và đêm tối vĩnh hằng — bị Angra Mainyu nguyền rủa. Họ phải khám phá trạng thái tồn tại này và, một khi đã thấu hiểu trọn vẹn cái ác, chọn trở nên thiện lương và quay về ân sủng của Ahura Mazda. Dĩ nhiên, không phải ai cũng đến được đó."

 roadofahuramazda: "Con Đường Ahura Mazda"
 roadofahuramazda_adj: "Con Đường Ahura Mazda"
 roadofahuramazda_adherent: "Kẻ Sám Hối"
 roadofahuramazda_adherent_plural: "Những Kẻ Sám Hối"
 roadofahuramazda_desc: "Con đường cứu chuộc là thông qua Ahura Mazda. Sau khi đã trải qua cái ác của Angra Mainyu, họ chọn trở nên thiện lương và quay về ân sủng của Ahura Mazda. Kẻ nhập môn của Con Đường Ahura Mazda tự thanh tẩy bản thân triệt để bằng nước."
 
 pathofdaena: "Con Đường Daena"
 pathofdaena_adj: "Con Đường Daena"
 pathofdaena_adherent: "Behdin"
 pathofdaena_adherent_plural: "Behdins"
 pathofdaena_desc: "Con Đường Daena dạy rằng hành động đức hạnh và tuân theo luật lệ cùng bổn phận sẽ mang lại quyền năng to lớn cho bản thân. Bằng cách hành động phù hợp với những luật lệ và bổn phận ấy, họ sẽ được ban thưởng xứng đáng. Luật lệ tạo nên cấu trúc cho một xã hội văn minh; phá vỡ luật lệ, và bản thân xã hội cũng sụp đổ."

