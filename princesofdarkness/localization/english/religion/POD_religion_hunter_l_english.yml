l_english: 

 #Common Hunters Localization
 hunters_religion: "@supehunter_icon! Thợ Săn Phù Thủy"
 hunters_religion_adj: "Săn Phù Thủy"
 hunters_religion_adherent: "Thợ Săn Phù Thủy"
 hunters_religion_adherent_plural: "Thợ Săn Phù Thủy"
 hunters_religion_desc: "Nhân loại vẫn chưa từ bỏ thế giới của mình. Những tâm hồn can trường này chiến đấu chống lại những nghịch đồ tự xưng là kẻ nô dịch họ."
 
 demon_hunters_religion: "@supehunter_icon! Thợ Săn Ác Quỷ"
 demon_hunters_religion_adj: "Săn Ác Quỷ"
 demon_hunters_religion_adherent: "Thợ Săn Ác Quỷ"
 demon_hunters_religion_adherent_plural: "Thợ Săn Ác Quỷ"
 demon_hunters_religion_desc: "Dường như chẳng có gì kìm hãm được Người Đêm phương Đông. Họ không chịu ràng buộc bởi Luật Che Giấu, cũng chẳng đoái hoài đến bất kỳ tấm màn che nào. Những hành vi thái quá của họ phần lớn được biện minh là thiên báo hoặc đơn thuần là vận may. Tuy vậy, một số ít tâm hồn lại xem việc khống chế những kẻ siêu nhiên ngỗ ngược là nghiệp báo mà trời đã định cho mình."

 #Hunter-Group Faiths

 independenthunters: "Thợ Săn Độc Lập"
 independenthunters_adj: "Độc Lập"
 independenthunters_adherent: "Thợ săn"
 independenthunters_adherent_plural: "Thợ săn"
 independenthunters_desc: "Không phụ thuộc vào bất kỳ tổ chức giáo hội nào, những thợ săn này theo đuổi cuộc chiến riêng biệt của mình chống lại những nỗi kinh hoàng siêu nhiên của Thế Giới Bóng Tối. Tuy thiếu nguồn lực của một tổ chức lớn, họ cũng không bị trói buộc bởi bất kỳ quy tắc đạo đức hay lề lối quan liêu cồng kềnh nào. Phần lớn những thợ săn này tự mình phát hiện ra mối đe dọa từ các sinh vật siêu nhiên, dù một số ít, vì bất mãn với luật lệ của Tòa Dị Giáo Bóng Tối, đã ngừng tuân theo mệnh lệnh từ trên và nay tự bước theo con đường của riêng mình."
 
 shadowinquisition: "Tòa Dị Giáo Bóng Tối"
 shadowinquisition_adj: "Dị Giáo"
 shadowinquisition_adherent: "Vị thẩm tra viên"
 shadowinquisition_adherent_plural: "Vị thẩm tra viên"
 shadowinquisition_desc: "Tòa Dị Giáo Bóng Tối là một chiến dịch bí mật do Giáo hội Công giáo dàn dựng trong thời kỳ Trung Cổ Đen Tối. Khác với Tòa Dị Giáo của Giáo hoàng vốn nhắm vào những kẻ dị giáo, Tòa Dị Giáo Bóng Tối nhắm vào ma cà rồng, người sói, pháp sư và những "tôi tớ của Satan" khác, để hủy diệt hoặc để cứu rỗi. Sự tồn tại của nó sẽ ngắn ngủi, nhưng những thành công của nó sẽ thay đổi thế giới $pod_cainite$ mãi mãi."
 shadowinquisition_religious_head_title: "Đại Thẩm Tra Viên"
 shadowinquisition_religious_head_title_name: "Văn Phòng Đại Thẩm Tra Viên"

 ikhwan_al_safa: "Ikhwan al-Safa"
 ikhwan_al_safa_adj: "Ikhwan"
 ikhwan_al_safa_adherent: "Sayyad al- Ghulan"
 ikhwan_al_safa_adherent_plural: "Sayyad al- Ghulan"
 ikhwan_al_safa_desc: "Được thành lập vào thế kỷ 12, Ikhwan al-Safa vẫn luôn canh chừng để bảo vệ những người có đức tin và chiến đấu chống lại những nỗi kinh hoàng bất tử của màn đêm. Khác với Tòa Dị Giáo, các Sayyadin rất thận trọng trong việc tránh sự chú ý của công chúng và cố gắng giảm thiểu tổn hại từ cuộc săn lùng của họ đối với những người vô tội."
 
 akritai_adj: "Akritai"
 akritai_adherent: "Thợ săn"
 akritai_adherent_plural: "Thợ săn"
 akritai_desc: "Akritai là một tập hợp các nhóm, phần lớn gồm những thợ săn phù thủy theo Chính Thống giáo phương Đông. Họ được xem vừa là đồng minh đáng gờm, vừa là đối thủ cạnh tranh của Tòa Dị Giáo."
 
 judge: "Quan Xét"
 judge_adj: "Quan Xét"
 judge_adherent: "Thợ săn"
 judge_adherent_plural: "Thợ săn"
 judge_desc: "Lấy tên gọi và truyền thống từ các Quan Xét trong Kinh Thánh, họ chiến đấu chống lại thứ mà họ xem là dòng dõi của Lilith. Họ dùng Torah và một phiên bản đặc biệt của Talmud làm nguồn tri thức cho cuộc chiến chống lại những kẻ trái tự nhiên. Do tỷ lệ người Do Thái thấp ở hầu hết các quốc gia, các Quan Xét hoạt động theo từng nhóm nhỏ, không có sự điều phối trung ương."
 
 shih_faith: "Tín Ngưỡng của Shih"
 shih_faith_adj: "Tín Ngưỡng"
 shih_faith_adherent: "Shih"
 shih_faith_adherent_plural: "Shih"
 shih_faith_desc: "Trải qua nhiều thế kỷ, [GetTrait('shih').GetName( GetPlayer )] đã phân hóa và lan rộng khắp Trung Vương Quốc, và họ đã điều chỉnh những triết lý được truyền dạy cho phù hợp với vùng đất nơi họ cư ngụ.\nNhưng không tín ngưỡng nào trong số đó là nguồn cội đức tin chính của họ. Mọi [GetTrait('shih').GetName( GetPlayer )] đều hiểu rằng những gì họ thực hành ở cấp độ cá nhân chẳng liên quan bao nhiêu đến chân lý mà họ theo đuổi với tư cách là thợ săn ác quỷ."
 shih_faith_religious_head_title: "Thiên Sư"
 shih_faith_religious_head_title_name: "Vương Quốc của Thiên Sư"
 
 strike_force_zero: "Strike Force Zero"
 strike_force_zero_adj: "SF0"
 strike_force_zero_adherent: "Đặc Vụ"
 strike_force_zero_adherent_plural: "Đặc Vụ"
 strike_force_zero_desc: "Strike Force Zero (còn gọi là SF0) là một cơ quan săn ác quỷ tinh nhuệ, tối mật của chính phủ Nhật Bản. Khác với Shih, Strike Force Zero không tin rằng shen có chỗ đứng nào trong trật tự tự nhiên: chúng là một mối đe dọa và phải bị tiêu diệt trước khi chúng có cơ hội hủy diệt nhân loại."
 
 sanbenito: "Sanbenito"
 sanbenito_adj: "Sanbenito"
 sanbenito_adherent: "Thợ săn"
 sanbenito_adherent_plural: "Thợ săn"
 sanbenito_desc: "Sanbenito là những cựu thẩm tra viên đã trở thành tín đồ của tư tưởng Raffaele Renzi, người sáng lập "Dị Giáo Florence", vốn cho rằng Hội Leopold đã sai lầm vì lòng nhiệt thành thái quá, và rằng sứ mệnh của họ nên là lòng khoan dung, chứ không phải hận thù. Do đó, thay vì tìm cách hủy diệt những kẻ siêu nhiên, các Kẻ Dị Giáo Florence lại tìm cách giúp họ giữ được nhân tính của mình."
 
 qorjin_baghatur: "Baghatur của Qorjin"
 qorjin_baghatur_adj: "của Qorjin"
 qorjin_baghatur_adherent: "Baghatur"
 qorjin_baghatur_adherent_plural: "Baghatur"
 qorjin_baghatur_desc: "Trong trận chiến thảm khốc tại Khúc Sông Samara, Qorjin là vị tướng Mông Cổ duy nhất không bỏ chạy trước những nỗi kinh hoàng biến hình đã tấn công Đại Trại.\nKhi trở về Karakorum, ông được triệu đến trước mặt chính Thành Cát Tư Hãn, người đã giao phó cho ông một trọng trách thiêng liêng mới. Trong những năm sau đó, ông đã nghiên cứu thế giới vô hình, học cách lợi dụng nỗi sợ hãi và mê tín của kẻ thù để mưu lợi tối đa cho mình, và dồn những sinh vật huyền thoại vào chân tường trước Đế Quốc Mông Cổ."
 
 warriors_dazbog: "Chiến Binh của Dazbog"
 warriors_dazbog_adj: "Chiến Binh"
 warriors_dazbog_adherent: "Dũng Sĩ"
 warriors_dazbog_adherent_plural: "Dũng Sĩ"
 warriors_dazbog_desc: "Thuở xa xưa, khi Caine vẫn còn một mình lang thang trên đất Nod, một con rắn khổng lồ từ bóng tối cuồn cuộn đã rơi xuống từ bầu trời. Sinh vật đáng ghét ấy đào sâu xuống lòng đất khi ánh mặt trời cứa rách và thiêu đốt thân xác nó, nhưng lối thoát không dễ dàng như vậy. Mặt trời đã ban một tia sáng thần thánh duy nhất cho Svarog, thần rèn và lửa trời. Svarog liền tạo ra Dazbog: chiến thần của mặt trời, và kẻ thù của mọi thứ ô uế bất khiết.\nDi sản cuộc chiến của ngài chống lại Cái Ác vẫn còn tiếp diễn đến ngày nay, cổ vũ những chiến binh Slav trẻ tuổi bảo vệ quê hương mình khỏi những sinh vật của màn đêm."
  
 corrupted_hunters_faith: "Thợ Săn Sa Đọa"
 corrupted_hunters_faith_adj: "Thợ Săn Sa Đọa"
 corrupted_hunters_faith_adherent: "Shih"
 corrupted_hunters_faith_adherent_plural: "Shih"
 corrupted_hunters_faith_desc: "Tôn giáo phi chính thống này được một Người Bảo Trợ đặt làm riêng\nDù [GetTrait('shih').GetName( GetPlayer )] đã điều chỉnh cho phù hợp với vùng đất nơi họ cư ngụ, một số trong họ đã đi quá xa. \nDù những [GetTrait('shih').GetName( GetPlayer )] ấy vẫn có cách nào đó để tiếp tục săn đuổi, họ lại theo đuổi những khoái lạc trần tục hơn - thậm chí cả khoái lạc xác thịt đồi trụy tập thể.\n[GetTrait('mortal').GetName( GetPlayer )], [GetTrait('ghoul').GetName( GetPlayer )], [GetTrait('werewolf').GetName( GetPlayer )], thậm chí [GetTrait('vampire').GetName( GetPlayer )] hay [GetTrait('kueijin').GetName( GetPlayer )], trong mắt họ, chỉ là những đối tượng của dục vọng. Do thiếu hiểu biết và sự khắc nghiệt của việc sinh tồn, đạo đức của thế hệ mới đã bị bóp méo, và lễ nghi cùng công lý của [GetTrait('shih').GetName( GetPlayer )] đã trở nên sa đọa."
 corrupted_hunters_faith_religious_head_title: "Đại Sư"
 corrupted_hunters_faith_religious_head_title_name: "Đại Miếu"
 