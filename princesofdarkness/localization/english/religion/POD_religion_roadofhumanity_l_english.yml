 childofosiris: "Con Cái Osiris"
 childofosiris_adj: "Osiris"
 childofosiris_adherent: "Người Osiris"
 childofosiris_adherent_plural: "Người Osiris"
 childofosiris_desc: "Con Cái Osiris tin vào truyền thuyết Ai Cập, và xem vai trò của mình là một sứ mệnh thiêng liêng, chống lại "bóng tối" của người Setite bằng "ánh sáng" của Osiris.\nGần như bị tiêu diệt trong những cuộc chiến buổi đầu chống lại Set, giờ đây họ sống ẩn dật và trốn tránh, hy vọng vào ngày Osiris trở lại để một lần nữa dẫn dắt họ."
   
 amaranthans: "Amaranthans"
 amaranthans_adj: "Amaranthans"
 amaranthans_adherent: "Amaranthan"
 amaranthans_adherent_plural: "Amaranthans"
 amaranthans_desc: "Một nhóm nhỏ $pod_cainites$ chuyên săn lùng những kẻ phạm tội diablerie. Họ dùng tên của nạn nhân đầu tiên của $pod_diablerie$ như một lời cam kết cho sứ mệnh của mình."