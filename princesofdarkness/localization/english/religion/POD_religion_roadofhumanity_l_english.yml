 #Prodigal-Group Faiths
 viahumanitatis: "Via Humanitatis"
 viahumanitatis_adj: "Hoang Đàng"
 viahumanitatis_adherent: "Kẻ Hoang Đàng"
 viahumanitatis_adherent_plural: "Những Kẻ Hoang Đàng"
 viahumanitatis_desc: "Tín đồ Via Humanitatis dùng thân phận con người để chống lại Dã Thú trong mình, luôn nhớ rằng họ từng là những phàm nhân bình thường trước khi bị ban cho lời nguyền của Caine. Họ đề cao các đức tính của con người, như tự do, trái tim và tâm hồn con người, cùng lý trí và trí tuệ như một ranh giới phân tách con người khỏi dã thú."

 viaanima: "Via Anima"
 viaanima_adj: "Anima"
 viaanima_adherent: "Kẻ Được Truyền Cảm Hứng"
 viaanima_adherent_plural: "Những Kẻ Được Truyền Cảm Hứng"
 viaanima_desc: "Via Anima thường được gọi là Con Đường Hơi Thở. Những Kẻ Được Truyền Cảm Hứng cố gắng tìm ý nghĩa và mục đích giữa những con người phàm trần, sẻ chia gánh nặng và cuộc sống thường nhật của họ. Bằng cách đó, họ hy vọng sẽ ngừng trở thành quái vật trong chính tâm trí mình, và nhờ thế trì hoãn Dã Thú. Nhiều kẻ đi theo con đường này chỉ đơn thuần theo bản năng, chưa từng suy nghĩ nhiều về vấn đề ấy."

 viacommunitas: "Via Communitas"
 viacommunitas_adj: "Communitas"
 viacommunitas_adherent: "Kẻ Khai Hóa"
 viacommunitas_adherent_plural: "Những Kẻ Khai Hóa"
 viacommunitas_desc: "Thường được gọi là Con Đường Cộng Đồng. Những Kẻ Khai Hóa tập trung vào cộng đồng nói chung hơn là từng cá nhân riêng lẻ. Họ hiếm khi tìm cách tôn vinh bản thân, và khi có làm vậy thì thường chỉ là phương tiện để đem lại lợi ích cho cả cộng đồng."

 vialuminis: "Via Luminis"
 vialuminis_adj: "Luminis"
 vialuminis_adherent: "Kẻ Được Khai Sáng"
 vialuminis_adherent_plural: "Những Kẻ Được Khai Sáng"
 vialuminis_desc: "Thường được gọi là Con Đường Khai Sáng. Những ai đi theo Con Đường Khai Sáng tìm kiếm Con Đường Cay Đắng dẫn tới [golconda|E] để rũ bỏ thế giới vật chất phía sau. Tín đồ của Via Luminis là những kẻ đơn độc, không hẳn vì lựa chọn, mà vì xã hội xa lánh họ. Sự khinh miệt dành cho người Salubri (và [golconda|E] nói chung) cũng khiến Con Đường này trở nên đáng ngờ trong mắt những ma cà rồng sùng đạo."

 viavireo: "Via Vireo"
 viavireo_adj: "Vireo"
 viavireo_adherent: "Kẻ Lang Bạt"
 viavireo_adherent_plural: "Những Kẻ Lang Bạt"
 viavireo_desc: "Thường được gọi là Con Đường Sức Sống. Những ai đi theo Con Đường Sức Sống không chỉ tận tụy với một lý tưởng về bản chất con người, mà còn với thiên tính của nó. Những Kẻ Lang Bạt bị lôi cuốn bởi xu hướng đổi mới, mở rộng chân trời, và tiến bước dù lành hay dữ của con người. Con Đường Sức Sống là một con đường mạnh mẽ và tràn đầy năng lượng, đề cao sự chuyển động và hành động hơn là chiêm nghiệm và tĩnh lặng."
 
 eternalsenate: "Eternal Senate"
 eternalsenate_adj: "Eternal Senate"
 eternalsenate_adherent: "Nghị Sĩ"
 eternalsenate_adherent_plural: "Nghị Sĩ"
 eternalsenate_desc: "Eternal Senate là một hội đồng gồm các $pod_cainites$ được mô phỏng theo Viện Nguyên Lão La Mã (dù nhỏ hơn nhiều), để cai quản, lập pháp và cai trị Huyết Tộc. Người Ventrue thành Rome đã tự tổ chức mình như những phàm nhân đã làm, theo hình thức cộng hòa: Eternal Senate của dòng Ventrue. Trong viện nguyên lão, mọi thành viên Ventrue đều có quyền phát biểu và quyền biểu quyết không phân biệt tuổi tác hay giới tính."
 
 inconnu: "Inconnu"
 inconnu_adj: "Inconnu"
 inconnu_adherent: "Inconnu"
 inconnu_adherent_plural: "Inconnu"
 inconnu_desc: "Inconnu là một giáo phái ma cà rồng cực kỳ bí mật. Hầu như không có gì được biết chắc chắn về họ, nhưng một số giả thuyết phổ biến nhất cho rằng nhóm này là một liên minh của các methuselah tồn tại để thao túng cả Camarilla lẫn Sabbat từ phía sau hậu trường, gồm toàn những kẻ cổ xưa đã từ bỏ Jyhad để theo đuổi [golconda|E], hoặc một giáo phái quyền lực gắn liền với [Glossary('Antediluvians','game_concept_antediluvian_desc')]. Ngay cả tuổi đời của giáo phái này cũng còn gây tranh cãi, có người tin rằng nó đã tồn tại từ tận thời La Mã cổ đại."
 
