 #Scholar-Group Faiths
 viaossium: "Via Ossium"
 viaossium_adj: "Ossium"
 viaossium_adherent: "Học Giả"
 viaossium_adherent_plural: "Học Giả"
 viaossium_desc: "Những kẻ theo Con Đường Xương Cốt coi trọng tri thức hơn tất thảy. Qua việc miệt mài nghiên cứu những điều chưa biết, các Học Giả giữ được Dã Thú của mình trong tầm kiểm soát. Họ sẵn sàng làm gần như mọi chuyện để học được điều gì đó mới, nhưng sẽ không hy sinh bản thân một cách vô ích vì bất cứ lý tưởng nào. Suy cho cùng, chính kho tri thức họ đã thu thập được quá quan trọng để giao phó cho kẻ khác. Đồng thời, các Học Giả không sợ cái chết; họ bị nó mê hoặc."
 
 followersoflazarus: "Tín Đồ của Lazarus"
 followersoflazarus_adj: "Lazarene"
 followersoflazarus_adherent: "Infitiore"
 followersoflazarus_adherent_plural: "Infitiores"
 followersoflazarus_desc: "Tín Đồ của Lazarus, còn được gọi là Infitiores, là những Cappadocian vì một lý do nào đó đã không hồi đáp lời triệu tập dẫn tới Feast of Folly, nhờ vậy thoát khỏi cuộc thanh trừng nhắm vào $pod_clan$. Không chắc liệu mình có được tha hay không, lại cảm thấy bị tổ sư phản bội, họ đã tự tách mình khỏi phần còn lại của $pod_clan$ Cappadocian. Lazarus được xem là thủ lĩnh không chính thức của các Infitiores."
 
 pathofthewheel: "Con Đường Bánh Xe"
 pathofthewheel_adj: "Bánh Xe"
 pathofthewheel_adherent: "Nhà Khoa Học"
 pathofthewheel_adherent_plural: "Nhà Khoa Học"
 pathofthewheel_desc: "Tín đồ của con đường này tin rằng Ma cà rồng đã bị đẩy ra ngoài vòng tuần hoàn và phải quay trở lại. Họ tìm kiếm bất kỳ phương pháp khoa học nào để đẩy toàn bộ $pod_cainites$ trở lại vòng tuần hoàn của sự sống."
 
 roadoftheabyss: "Con Đường Vực Thẳm"
 roadoftheabyss_adj: "Vực Thẳm"
 roadoftheabyss_adherent: "Nhà Huyền Học"
 roadoftheabyss_adherent_plural: "Nhà Huyền Học"
 roadoftheabyss_desc: "Các Nhà Huyền Học đắm chìm trong công cuộc nghiên cứu bất tận về một thế lực vượt lên trên và rốt cuộc đối nghịch với mọi ánh sáng và sự sống. Nhân tính cùng những khái niệm như đúng hay sai chẳng còn mấy ý nghĩa với những kẻ nghiên cứu bí ẩn của bóng tối ngoại biên."

 holy_order_harbringers_cappa: "Điềm Báo Giả"
 holy_order_erciyes: "Vệ Binh Erciyes"

 viaprimordia: "Via Primordia"
 viaprimordia_adj: "Primordia"
 viaprimordia_adherent: "Primordian"
 viaprimordia_adherent_plural: "Primordians"
 viaprimordia_desc: "Những Primordian tin vào 'Tam Vị', các linh hồn quyền năng của Sáng Tạo, Hủy Diệt và Bảo Tồn. Họ chờ đợi một biến cố lớn khi ba linh hồn ấy sẽ hợp nhất thành một Hóa Thân. Kỳ lạ thay, điều này có vẻ khá gần với niềm tin của một số Lupine."
