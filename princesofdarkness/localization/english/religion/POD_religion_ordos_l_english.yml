 #Scholar-Group Faiths
 
 ordoaenigmatis: "Ordo Aenigmatis"
 ordoaenigmatis_adj: "Aenigmatis"
 ordoaenigmatis_adherent: "Mystai"
 ordoaenigmatis_adherent_plural: "Mystai"
 ordoaenigmatis_desc: "Ordo này chuyên tâm vào các câu đố và biểu tượng, khai mở những ý nghĩa ẩn giấu, giải mã thần thoại và truyền thuyết để đạt tới tri thức chân thực về thế giới, về chính bản thân họ và về Dã Thú."
 
 ordosecstasis: "Ordo Ecstasis"
 ordosecstasis_adj: "Ecstasis"
 ordosecstasis_adherent: "Mystai"
 ordosecstasis_adherent_plural: "Mystai"
 ordosecstasis_desc: "Ordo này chuyên tâm vào các trạng thái xuất thần và Phẫn Cuồng, tìm cách giao tiếp với Dã Thú của mình để cuối cùng làm nó thỏa mãn qua những cực điểm của cả khoái lạc lẫn đau đớn."
 
 ordomaleficus: "Ordo Maleficus"
 ordomaleficus_adj: "Maleficus"
 ordomaleficus_adherent: "Mystai"
 ordomaleficus_adherent_plural: "Mystai"
 ordomaleficus_desc: "Rất ít điều được ghi lại về Ordo này, chỉ biết rằng họ là những kẻ theo tà giáo tìm kiếm những bí ẩn lớn lao hơn nhờ sự trợ giúp của các Thế Lực Ngoài Kia."
 
 jocastian: "Jocastian"
 jocastian_adj: "Jocastian"
 jocastian_adherent: "Jocastian"
 jocastian_adherent_plural: "Jocastians"
 jocastian_desc: "Một giáo phái nhỏ và ít người biết đến (và có thể là một dòng huyết thống Malkavian) khởi nguồn từ trong Sabbat như một giáo phái Noddist, nhưng từ đó đã trở nên độc lập. Dù phần lớn Jocastian là Malkavian, trong hàng ngũ của họ cũng có một số Brujah và các Hậu duệ Cain học thức khác. Họ hiến mình cho việc khám phá lịch sử chân thực của $pod_cainites$ và là kình địch của Mnemosyne. Dù một số học giả xem họ là một dòng huyết thống vì tập tục để một bậc thầy tự để mình bị một môn đệ hành Diablerie nhằm bảo tồn tri thức đã tích lũy, họ không khác gì $pod_clan$ gốc của mình."
 
 mnemosyne: "Mnemosyne"
 mnemosyne_adj: "Mnemosyne"
 mnemosyne_adherent: "Mystai"
 mnemosyne_adherent_plural: "Mystai"
 mnemosyne_desc: "Mnemosyne, hay những Kẻ Tầm Ký Ức, là một giáo phái Noddist gồm các học giả Malkavian; một số cho rằng Mnemosyne thực chất là một dòng huyết thống của Malkavian. Thành viên nổi bật nhất của họ là Aristotle de Laurent. Các thành viên của giáo phái tìm kiếm tri thức về lịch sử của Hậu duệ Cain, và hầu hết trong số họ theo Con Đường của Caine. Giáo phái này đang xung đột với Jocastian và, cho tới gần đây, với trưởng lão Ventrue Bindusara. Các thành viên của họ thực hành một hình thức $pod_diablerie$; khi một trưởng lão cảm thấy thời khắc của mình đã điểm, ông ta cho phép Hậu duệ Cain trẻ tuổi hơn hành Diablerie mình để tri thức có thể được truyền lại. Đây là lý do vì sao giáo phái đôi khi được gọi là một dòng huyết thống. Giáo phái được đặt tên theo nàng thơ Hy Lạp của ký ức."
 
 ordovaticinii: "Ordo Vaticinii"
 ordovaticinii_adj: "Vaticinii"
 ordovaticinii_adherent: "Mystai"
 ordovaticinii_adherent_plural: "Mystai"
 ordovaticinii_desc: "Tôn giáo phi chính thống này được một Người Bảo Trợ đặt riêng.\nOrdo này ám ảnh với những lời tiên tri về Gehenna."
 
 holy_order_habringers: "Những Kẻ Báo Điềm của Malkav"
 holy_order_lamia: "Bí Ẩn Lamia"
 holy_order_order_of_argaeus: "Dòng tu Argaeus"
 holy_order_cult_of_hecate: "Giáo phái Hecate"
 holy_order_sworn_to_cecil: "Thề Trung với Cecil"
 
 daughtersofthesun: "Những Người Con Gái của Mặt Trời"
 daughtersofthesun_adj: "Con Gái"
 daughtersofthesun_adherent: "Người Con Gái"
 daughtersofthesun_adherent_plural: "Những Người Con Gái"
 daughtersofthesun_desc: "Một giáo phái bí ẩn Malkavian thời tiền Hồi giáo, thờ phụng ba 'Nữ Thần' $pod_cainites$. Họ đã bị trục xuất khỏi Mecca và phần lớn bị đẩy vào ẩn náu bởi những [Glossary('Ashirra','game_concept_ashirra_desc')] Hồi giáo chiến thắng."
 
 eyesofmalakai: "Những Con Mắt của Malakai"
 eyesofmalakai_adj: "Con Mắt"
 eyesofmalakai_adherent: "Con Mắt"
 eyesofmalakai_adherent_plural: "Những Con Mắt"
 eyesofmalakai_desc: "Bề ngoài thờ phụng người em gái song sinh huyền thoại của Malkav, giáo phái tín đồ điên loạn này thường xuất hiện từ hư không, chỉ để lại sự điên loạn và hủy diệt trên đường đi của họ."
 

