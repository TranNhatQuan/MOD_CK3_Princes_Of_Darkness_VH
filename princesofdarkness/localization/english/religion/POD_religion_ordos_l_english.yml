 ordos_religion_desc: "Ordos là các giáo phái bí ẩn thời Trung Cổ Đen Tối, thành viên chỉ được tuyển mộ trong hàng ngũ ma cà rồng $pod_clan$ Malkavian. Ordos hiến mình cho việc giải mã các kỹ thuật chiêm nghiệm của những Malkavian thời cổ và khai mở tiềm năng ẩn trong sự điên loạn của họ để vượt qua Dã Thú. Họ tản mác khắp Cựu Thế Giới thành từng giáo phái nhỏ, mỗi giáo phái độc lập và chỉ có thể nhận diện qua phương pháp riêng của mình."
