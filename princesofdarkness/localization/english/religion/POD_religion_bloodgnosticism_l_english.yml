 eschatologists: "Các Nhà Mạt Thế Luận của Cappadocius"
 eschatologists_adj: "Nhà Mạt Thế Luận"
 eschatologists_adherent: "Nhà Mạt Thế Luận"
 eschatologists_adherent_plural: "Các Nhà Mạt Thế Luận"
 eschatologists_desc: "Một phe phái thuộc Đào Mộ $pod_clan$ tin tưởng hết lòng vào Dị Giáo Hậu Duệ Cain, dù mang sắc thái Cơ Đốc học đậm nét hơn giáo phái chính. Các Nhà Mạt Thế Luận tin rằng họ là Dòng Dõi của cả Caine lẫn Chúa Kitô, và việc hiến dâng $pod_vitae$ của mình cho người phàm tự nó là một bí tích. Các Nhà Mạt Thế Luận rong ruổi trên những con đường mòn khắp châu Âu và tổ chức các buổi 'phục hưng' đại chúng, phô diễn những phép màu kỳ diệu bằng máu và $pod_discipline$. Cuộc tụ họp lớn nhất trong số này diễn ra vào ngày 17 tháng 12, ngày Lễ Thánh Lazarus."
