 calomenaschosen: "Những Kẻ Được Calomena Chọn"
 calomenaschosen_adj: "Được Chọn"
 calomenaschosen_adherent: "Kẻ Được Chọn"
 calomenaschosen_adherent_plural: "Những Kẻ Được Chọn"
 calomenaschosen_desc: "Những Kẻ Được Chọn được sáng lập bởi Caitiff Stanislav. Được thành lập ở miền Tây Balkan, giáo phái này dường như bắt nguồn lỏng lẻo từ dị giáo Bogomil. Những Kẻ Được Chọn tin rằng Caine là một hậu duệ của quỷ dữ, và vì thế con cái của hắn là những biểu hiện đê tiện nhất trên trần thế. Calomena, Em Gái Song Sinh của Caine, được cho là đang chuẩn bị trở về và hủy diệt lũ Hậu duệ Cain đê tiện, thanh tẩy thế giới cho Thánh Linh vinh quang của Chúa. Những Kẻ Vô Clan là công cụ được chọn của bà. Họ tổ chức thành các vòng tròn do ma cà rồng dẫn dắt cùng với Bộc huyết và các thành viên phàm nhân. Stanislav đã tử đạo năm 1204 vào cuối Giấc Mộng của Michael và cuộc Thập Tự Chinh Cay Đắng, nhưng giáo phái của ông vẫn lê bước tiến về Gehenna."
