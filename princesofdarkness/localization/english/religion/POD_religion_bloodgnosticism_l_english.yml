 apostlesthirdcaine_desc: "Tông Đồ là một nhánh tách ra từ Dị Giáo Hậu Duệ Cain, ly khai khỏi Tòa Nod vào khoảng năm 1000 sau Công Nguyên.\nHọ là một phong trào cải cách trong chính tín ngưỡng của mình, tin rằng lối sống giản dị và khắc kỷ của họ sẽ hé lộ Caine Đệ Tam, người mà họ tin là một phàm nhân đang chờ được Trao truyền."
  
 sanctamater: "Sancta Mater"
 sanctamater_adj: "Sancta"
 sanctamater_adherent: "Sancta Mater"
 sanctamater_adherent_plural: "Sancta Mater"
 sanctamater_desc: "Bắt nguồn từ cùng gốc rễ với Ngộ đạo luận, Sancta Mater đặt trọng tâm vào thần tính của Mary, tin rằng bà là người nắm giữ Sophia (trí tuệ).\nBằng cách thờ phụng Sancta Mater, người ta có thể hy vọng thoát khỏi thế giới giả dối này cùng vị lãnh chúa băng hoại của nó, Giáo Hội La Mã."
    
  