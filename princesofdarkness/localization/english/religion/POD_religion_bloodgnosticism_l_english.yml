 #Blood Gnostics-Group Faiths

 viacain: "Dị Giáo Hậu Duệ Cain"
 viacain_adj: "Hậu Duệ Cain"
 viacain_adherent: "Hậu Duệ Cain"
 viacain_adherent_plural: "Các Hậu Duệ Cain"
 viacain_desc: "Dị Giáo Hậu Duệ Cain là một tín ngưỡng dị giáo được thực hành chủ yếu bởi các Hậu duệ Cain theo Cơ Đốc giáo, phần lớn nhưng không chỉ giới hạn ở ma cà rồng Lasombra. Nó thấm đẫm tinh thần Ngộ đạo luận và sử dụng cả một đoàn tu sĩ và giáo sĩ phàm nhân. Về mặt lịch sử, Dị Giáo này nảy sinh từ nhiều giáo phái máu khác nhau, nơi ma cà rồng được tôn thờ như những vị thần. Ma cà rồng, nhờ thân xác bất hoại, sự độc lập khỏi thế giới vật chất và sức mạnh mà [Glossary('Dị năng','game_concept_discipline_desc')] của chúng ban cho, được một số tín đồ Ngộ đạo xem là những sinh vật có tầng bậc tâm linh cao hơn, và được tìm đến để thụ giáo, đổi lại bằng $pod_vitae$."
 
