 swarmofsamael_desc: "Được kiểm soát bởi Baali, Bầy Đàn tin rằng Ialdabaoth là hai đầu của cùng một Dã Thú. Bầy Đàn nhấn mạnh vào truyền thống mạt thế luận của Euagetaematikon hơn là Thánh Thể Máu hay các yếu tố Cơ Đốc học, nhưng nhanh chóng hé lộ những bí ẩn tăm tối hơn của thuyết thờ quỷ cho kẻ không đề phòng. Triều Đình Đỏ Thẫm không hề áy náy khi tố cáo các giáo phái Dị Giáo Baali."
