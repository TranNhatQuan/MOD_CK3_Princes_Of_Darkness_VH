 blackmagdalene: "Giáo Hội Magdalene Đen"
 blackmagdalene_adj: "Magdalene Đen"
 blackmagdalene_adherent: "Magdalene Đen"
 blackmagdalene_adherent_plural: "Các Magdalene Đen"
 blackmagdalene_desc: "Di chuyển khắp châu Âu từ căn cứ của họ ở Marseilles để quyến rũ và làm băng hoại các tín đồ. Họ sử dụng cùng giáo lý với Dị Giáo Hậu Duệ Cain, bao gồm cả Thánh Thể Máu. Họ đồng nhất Thánh Mary Magdalene với Isis và nữ thần Ngộ đạo Sophia. Các tu viện nữ Magdalene thường đóng vai trò là những 'nhà thổ đền thiêng', gợi nhớ các giáo phái phồn thực cổ xưa của vùng Levant — và họ che giấu những nghi lễ thiến hoạn, ăn thịt người đẫm máu cay đắng từ những bí ẩn tăm tối nhất. Bất kỳ linh mục dâm dục nào cũng biết nơi những ý nghĩ dơ bẩn nhất của mình có thể tìm được thỏa mãn, và dân thường bắt đầu đồng nhất Thánh Mary Magdalene với 'người đàn bà ngoại tình' vô danh, nhờ những thái quá của giáo phái này. Những vở 'kịch thương khó' gần như khiêu dâm mà các Magdalene trình diễn vào ngày 22 tháng 7, Lễ Thánh Magdalene, đã bị các linh mục khắp nước Pháp lên án dữ dội. Tín Đồ Set cố tình gửi những thành viên táo tợn và thiếu tế nhị nhất của mình để gây dựng các giáo phái Magdalene."
