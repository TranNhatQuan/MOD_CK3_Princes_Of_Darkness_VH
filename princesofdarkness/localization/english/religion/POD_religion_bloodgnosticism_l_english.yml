 redtemptation_desc: "Tín ngưỡng này rao giảng rằng sự xuất hiện của Chúa Kitô với tư cách Caine Đệ Nhị đã báo hiệu khởi đầu một cuộc nổi dậy vĩ đại chống lại Ialdabaoth, kẻ tạo hóa quỷ quyệt của thế giới vật chất. Mọi luật lệ trước đây đều phải bị xóa bỏ, và các tín đồ phải Trao truyền cho càng nhiều người càng tốt và buông thả trong mọi phóng túng mà mình có thể."
 
