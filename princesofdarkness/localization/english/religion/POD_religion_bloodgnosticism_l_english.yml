 viapura: "Via Pura"
 viapura_adj: "Katharoi"
 viapura_adherent: "Kathar"
 viapura_adherent_plural: "Katharoi"
 viapura_desc: "Trong một thời đại ngày càng chống đối quyền lực giáo sĩ, họ đã chọn thuyết nhị nguyên Ngộ đạo làm thanh gươm phù hợp nhất cho mục đích của mình. Các Zealot xây dựng tôn giáo với sự tính toán gần như lạnh lùng, rút tỉa từ Chủ nghĩa Tân Plato, Kinh Thánh ngụy thư và nhiều nguồn gốc bí ẩn khác. Họ tự xưng là Katharoi, và ủng hộ những người Cathar phàm tục (cùng một từ, được nói bằng tiếng Pháp và tiếng Latin) không phải với tư cách người bảo trợ, mà là những người dẫn dắt tâm linh."
 
