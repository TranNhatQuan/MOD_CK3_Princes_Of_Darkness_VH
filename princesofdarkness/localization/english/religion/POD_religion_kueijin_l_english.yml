 #Kuei-jin Group Religios
 kueijin_religion: "@kueijin_icon! Pháp Môn Dị Giáo"
 kueijin_religion_adj: "Dị Giáo"
 kueijin_religion_adherent: "Dị Giáo"
 kueijin_religion_adherent_plural: "Dị Giáo"
 kueijin_religion_desc: "Có không ít ma cà rồng tồn tại mà không theo bất kỳ Pháp Môn nào trong năm [Glossary('Pháp Môn','podgloss.dharma')] do [GetScriptedCharacterByHistoryID('791111').GetFirstName] truyền lại. Chúng theo những con đường khác, những con đường mà các bậc tổ tiên của Ngũ Đại Triều Đình gọi là dị giáo."

 boneflowers_religion: "@kueijin_icon! Ảnh Ca"
 boneflowers_religion_adj: "Ca Vịnh"
 boneflowers_religion_adherent: "Ca Nhân"
 boneflowers_religion_adherent_plural: "Ca Nhân"
 boneflowers_religion_desc: "Ảnh Ca mang Âm Tướng, còn được gọi là Cốt Hoa, là những thuật sĩ gọi hồn lạnh lùng lý trí, tìm kiếm sự luận giải vô cảm và sự thực thi cân bằng của Pháp Môn. Họ cũng gắn bó chặt chẽ với xã hội phàm nhân qua hậu duệ của mình, và thường giúp đỡ gia tộc dù đã qua nhiều thế kỷ."

 deviltigers_religion: "@kueijin_icon! Ma Hổ"
 deviltigers_religion_adj: "Hổ"
 deviltigers_religion_adherent: "Ma Thiên"
 deviltigers_religion_adherent_plural: "Ma Thiên"
 deviltigers_religion_desc: "Ma Hổ tin rằng họ là những kẻ thay thế cho lũ ác quỷ bất tài của thời xa xưa; họ trừng phạt kẻ có tội và tìm kiếm Giác Ngộ qua đau đớn và bạo lực."

 resplendentcranes_religion: "@kueijin_icon! Thụy Hạc"
 resplendentcranes_religion_adj: "Pháp Trị"
 resplendentcranes_religion_adherent: "Quan Án"
 resplendentcranes_religion_adherent_plural: "Quan Án"
 resplendentcranes_religion_desc: "Đạo Thụy Hạc là một tập hợp môn phái mang nặng tinh thần pháp trị, tận tụy đảo ngược [Glossary('Bánh Xe Kỷ Nguyên','podgloss.wheelofages')] và khôi phục đức hạnh."

 thousandwhispers_religion: "@kueijin_icon! Thiên Ngữ"
 thousandwhispers_religion_adj: "Thì Thầm"
 thousandwhispers_religion_adherent: "Kẻ Thì Thầm"
 thousandwhispers_religion_adherent_plural: "Kẻ Thì Thầm"
 thousandwhispers_religion_desc: "Thiên Ngữ sống qua một chuỗi mặt nạ, những thân phận mới mà họ dựng lên sau khi chết để hiểu được đời sống phàm nhân và hy vọng vượt qua nó."

 thrashingdragons_religion: "@kueijin_icon! Đằng Long"
 thrashingdragons_religion_adj: "Vũ Điệu"
 thrashingdragons_religion_adherent: "Vũ Giả"
 thrashingdragons_religion_adherent_plural: "Vũ Giả"
 thrashingdragons_religion_desc: "[Glossary('Pháp Môn','podgloss.dharma')] Đằng Long thường bị hiểu lầm, họ thừa nhận rằng mình đã chết, nhưng tìm cách đạt Giác Ngộ bằng cách mô phỏng và tương tác với người sống. Bất chấp sự sửng sốt hoài nghi của một số kẻ thuộc Thụy Hạc, họ vẫn là một [Glossary('Pháp Môn','podgloss.dharma')] được công nhận đầy đủ, dù có vẻ như họ ăn chơi trác táng suốt cả kiếp bất tử."

 #Kuei-jin Group Faiths

 faceofthegods: "Thiên Tộc"
 faceofthegods_adj: "Thần Cách"
 faceofthegods_adherent: "Tiểu Thần"
 faceofthegods_adherent_plural: "Tiểu Thần"
 faceofthegods_desc: "Có lẽ là dị giáo cực đoan nhất, Thiên Tộc tuyên bố rằng [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] là hậu duệ Thần linh bị lưu đày của nàng Sita bị oan khuất trong thần thoại Ấn Độ. Họ lập ra giáo phái riêng với tín đồ thờ phụng và chiết xuất khí từ lời cầu nguyện."

 faceofthegoddess: "Diện Nữ Thần"
 faceofthegoddess_adj: "Thần Cách"
 faceofthegoddess_adherent: "Tín Đồ Shakti"
 faceofthegoddess_adherent_plural: "Tín Đồ Shakti"
 faceofthegoddess_desc: "Một biến thể của Thiên Tộc, [Glossary('Pháp Môn','podgloss.dharma')] này tuyên bố rằng họ từng là người phàm trước khi được nữ thần Shakti chọn để đầu thai vào một giai đoạn chuyển tiếp giữa kiếp phàm trần đã qua và thần tính tương lai của họ."

 flameoftherisingphoenix: "Phượng Hoàng Trỗi Dậy"
 flameoftherisingphoenix_adj: "Trỗi Dậy"
 flameoftherisingphoenix_adherent: "Phượng Hoàng"
 flameoftherisingphoenix_adherent_plural: "Phượng Hoàng"
 flameoftherisingphoenix_desc: "[Glossary('Pháp Môn','podgloss.dharma')] Phượng Hoàng Trỗi Dậy tin rằng mục đích của Nhị Độ Hô Hấp là để chuộc lại tội lỗi của kiếp sống trước. Họ thường sống giữa gia tộc phàm nhân của mình, bảo vệ và giúp họ thịnh vượng hết mức có thể."

 thegreatclans: "Đại Tộc"
 thegreatclans_adj: "Tộc"
 thegreatclans_adherent: "Tộc Nhân"
 thegreatclans_adherent_plural: "Tộc Nhân"
 thegreatclans_desc: "Đại Tộc là một định chế bản địa của quần đảo Nhật Bản. Về bản chất, họ là những mạng lưới gia tộc mở rộng, trong đó Tử Thi Đói theo dõi và bảo vệ lợi ích của hậu duệ mình. Trong một số gia tộc chư hầu của Đại Tộc, hậu duệ phàm nhân thậm chí còn hay biết và được biết trước về kế hoạch của tổ tiên mình.\nNhững Đại Tộc lâu đời nhất có gốc rễ từ thời kỳ Jomon, nhưng biến chuyển sâu sắc nhất của họ xảy ra sau khi [Glossary('Pháp Môn','podgloss.dharma')] Ấn Độ và Trung Hoa du nhập vào thế kỷ thứ 6 CN."

 inwardway: "Nội Quán Đạo"
 inwardway_adj: "Cầu Tìm"
 inwardway_adherent: "Kẻ Cầu Tìm"
 inwardway_adherent_plural: "Kẻ Cầu Tìm"
 inwardway_desc: "Một giáo phái bị các Triều Đình chính coi là dị giáo, những Kẻ Cầu Tìm của Nội Quán Đạo tin rằng thế giới là ảo ảnh và dùng các nguyên lý triết học Đạo giáo để mở rộng sự thấu hiểu của họ về cái thực tại "chân thực"."

 inwardfocus: "Nội Tâm Chú"
 inwardfocus_adj: "Cuồng Phong"
 inwardfocus_adherent: "Kabalyeru"
 inwardfocus_adherent_plural: "Kabalyeru"
 inwardfocus_desc: "Một giáo phái bị các Triều Đình chính coi là dị giáo, Cuồng Phong của Nội Tâm Chú tin rằng thế giới là ảo ảnh và muốn đập tan nó bằng bạo lực cực độ và các thủ đoạn khủng bố."

 spiritlivingearth: "Đại Địa Sinh Linh"
 spiritlivingearth_adj: "Thanh Lam"
 spiritlivingearth_adherent: "Kannushi"
 spiritlivingearth_adherent_plural: "Kannushi"
 spiritlivingearth_desc: "Dựa trên nhiều truyền thống Thần đạo và vật linh giáo khác nhau, [Glossary('Pháp Môn','podgloss.dharma')] này mang tính nội quan và tập trung chủ yếu vào việc tương tác với thế giới linh hồn. Việc họ xem ác quỷ và ác linh là những người thầy phù hợp đã khiến họ bị các Triều Đình chính gắn mác dị giáo."

 kinofizanami: "Thân Tộc Izanami"
 kinofizanami_adj: "Thân Tộc"
 kinofizanami_adherent: "Thân Tộc"
 kinofizanami_adherent_plural: "Thân Tộc"
 kinofizanami_desc: "Thân Tộc tin rằng họ là những hóa thân phân mảnh của Izanami-no-mikoto, vị kami nguyên thủy của cái chết và sự ô uế. Họ cũng tin rằng còn có những kẻ khác rải rác khắp các cõi giới – người phàm, linh hồn hoang dã, và những kẻ khác – vốn là những mảnh vỡ của Izanami giống như họ, đang chờ được tìm thấy và đánh thức qua tra tấn, sát nhân nghi lễ, và Khí bị nhiễm độc.\n\nChính vì lý do này mà Thân Tộc Izanami ẩn mình rất kỹ giữa những người anh em họ hàng Veil của họ, bởi họ sẽ bị truy lùng bất cứ khi nào bị phát hiện."

 holy_order_fallen_heroes: "Anh Hùng Sa Ngã"
 holy_order_jinhai_remembrance: "Ký Ức Jinhai"
 holy_order_cursed_golden_children: "Những Đứa Trẻ Vàng Bị Nguyền Rủa"
 holy_order_followers_of_arhat: "Tín Đồ của [Glossary('La Hán','podgloss.arhat')]"
 holy_order_second_breath: "Nhị Độ Hô Hấp"
 holy_order_masters_high_war: "Bậc Thầy của Đại Chiến"
 
 empty_hands: "Không Thủ"
 empty_hands_adj: "Thủ"
 empty_hands_adherent: "$boneflowers_religion_adherent$"
 empty_hands_adherent_plural: "$boneflowers_religion_adherent_plural$"
 empty_hands_desc: "Trường phái tư tưởng Không Thủ tin rằng họ phải giữ mình không vấy bẩn nhưng không có quyền can thiệp vào hành trình tri thức của kẻ khác, kể cả khi giao tiếp với [akuma|E]."

 fishhooks: "Lưỡi Câu"
 fishhooks_adj: "Câu"
 fishhooks_adherent: "$boneflowers_religion_adherent$"
 fishhooks_adherent_plural: "$boneflowers_religion_adherent_plural$"
 fishhooks_desc: "Những Lưỡi Câu nghiên cứu, thẩm vấn, lừa gạt và tra tấn [akuma|E]. Bằng cách đó, họ tìm cách thấu hiểu [Glossary('Diêm Ma Vương','podgloss.yamaking')] và sự đọa đày mà không phải mạo hiểm chính linh hồn mình. Họ sẽ làm hoặc nói bất cứ điều gì để lấy được tin tức từ một [akuma|E]."

 august_body_of_sagacious_devils: "Hội Đồng Ma Quỷ Minh Triết"
 august_body_of_sagacious_devils_adj: "Minh Triết"
 august_body_of_sagacious_devils_adherent: "Ngọc Ma"
 august_body_of_sagacious_devils_adherent_plural: "Ngọc Ma"
 august_body_of_sagacious_devils_desc: "Những thủ lĩnh chính thức của Ma Hổ, Hội Đồng sử dụng một hệ thống cấp bậc cạnh tranh cực đoan để dẫn dòng năng lượng phẫn nộ của P'o vào những công việc hữu ích cho lợi ích chung của [GetTrait('kueijin').GetName( GetNullCharacter )]."

 thousand_embers_righteousness_societies: "Hội Thiên Diễm"
 thousand_embers_righteousness_societies_adj: "Chính Nghĩa"
 thousand_embers_righteousness_societies_adherent: "$deviltigers_religion_adherent$"
 thousand_embers_righteousness_societies_adherent_plural: "$deviltigers_religion_adherent_plural$"
 thousand_embers_righteousness_societies_desc: "Là hạt nhân xã hội của Ma Hổ, các hội này là những nhóm nhỏ cùng nhau làm việc, rèn luyện và khai sáng bản thân. Tuy nhiên, mục đích lâu dài của mỗi hội là đóng vai trò đánh lạc hướng [Glossary('Ma Hoàng','podgloss.demonemperor')], như một tổ du kích sẽ thiêu rụi xã hội phàm nhân để ngăn [Glossary('Diêm Ma Vương','podgloss.yamaking')] hưng thịnh."

 searing_wind: "Cuồng Phong Thiêu Đốt"
 searing_wind_adj: "Thiêu Đốt"
 searing_wind_adherent: "Bộ Binh Địa Ngục"
 searing_wind_adherent_plural: "Bộ Binh Địa Ngục"
 searing_wind_desc: "Theo chân Đại [Glossary('La Hán','podgloss.arhat')] Hon Li của mình, những Ma Hổ này khước từ cấu trúc của các Triều Đình. Thay vào đó họ chuẩn bị cho trận chiến cuối cùng chống lại [Glossary('Ma Hoàng','podgloss.demonemperor')] và sẵn lòng thiêu rụi thế giới để giành chiến thắng nếu cần."

 societies_brigands_devils: "Hội Lật Đổ Triều Đại"
 societies_brigands_devils_adj: "Lật Đổ"
 societies_brigands_devils_adherent: "Ma Thảo Khấu"
 societies_brigands_devils_adherent_plural: "Ma Thảo Khấu"
 societies_brigands_devils_desc: "Hội Thảo Khấu và Ma Quỷ Truỵ Lạc Lật Đổ Triều Đại chủ yếu là một đám đệ tử bị thiệt thòi trong xã hội, được các bậc trưởng bối sử dụng khi họ cảm thấy thế giới phàm nhân cần một cuộc xáo trộn đẫm máu. Sự xuất hiện đông đảo của họ luôn báo hiệu thời loạn."

 black_iron_talons: "Hắc Thiết Trảo"
 black_iron_talons_adj: "Thiết"
 black_iron_talons_adherent: "Trảo Nhân"
 black_iron_talons_adherent_plural: "Trảo Nhân"
 black_iron_talons_desc: "Hắc Thiết Trảo là lực lượng bán quân sự của Ma Hổ, tự tổ chức theo một hệ thống chỉ huy quân sự. Họ cũng được biết đến như những nhà điều tra vô song, và một Trảo Nhân luôn đảm bảo mục tiêu của mình quả thực là tà ác trước khi ra tay."

 brillant_coals: "Than Hồng Rực Rỡ"
 brillant_coals_adj: "Xích"
 brillant_coals_adherent: "Xích Hổ"
 brillant_coals_adherent_plural: "Xích Hổ"
 brillant_coals_desc: "Than Hồng Rực Rỡ là triết lý truyền thống của Ma Hổ được điều chỉnh cho phù hợp với Triều Đình Xích Phượng. Do đó nó mang tính mẫu hệ và thiên về bản năng xác thịt hơn là bạo lực thô sơ."

 electric_money: "Liên Minh Thương Mại Xích Hổ"
 electric_money_adj: "Xích"
 electric_money_adherent: "Xích Hổ"
 electric_money_adherent_plural: "Xích Hổ"
 electric_money_desc: "The "investment bank" của Ma Hổ là một hội tận tụy chống lại [Glossary('Diêm Ma Vương','podgloss.yamaking')] trên mặt trận kinh tế. Họ sẵn lòng đánh sập cả nền kinh tế nếu lũ quỷ Yomi mất đi những tài sản quan trọng trong quá trình đó."

 righteous_smiting_fist: "Chính Nghĩa Trừng Ma Quyền"
 righteous_smiting_fist_adj: "Quyền"
 righteous_smiting_fist_adherent: "Kẻ Giải Phóng"
 righteous_smiting_fist_adherent_plural: "Kẻ Giải Phóng"
 righteous_smiting_fist_desc: "Chính Nghĩa Địa Ngục Trừng Ma Quyền là một hội khước từ chính sách chung sống với oan hồn của các Triều Đình. Thay vào đó họ muốn lật đổ Hắc Vương Quốc Ngọc và kẻ cai trị đồi bại của nó để giải thoát những linh hồn bị giam cầm trong đó."

 sinner_punishing_society: "Hội Trừng Tội"
 sinner_punishing_society_adj: "Trừng Phạt"
 sinner_punishing_society_adherent: "Kẻ Trừng Phạt"
 sinner_punishing_society_adherent_plural: "Kẻ Trừng Phạt"
 sinner_punishing_society_desc: "Hội Trừng Tội Lỗi Lạc đi đến những cực đoan như vậy để trừng phạt kẻ ác đến mức ngay cả những Ma Hổ khác cũng phải chùn bước. Những cuộc hành hình công khai và cực kỳ bạo lực của họ khiến họ bị coi là gánh nặng cho chính nghĩa chung của Ma Hổ."

 shan_bo_heresy: "Dị Giáo Shan-bo"
 shan_bo_heresy_adj: "Shan"
 shan_bo_heresy_adherent: "Kẻ Thăng Hoa"
 shan_bo_heresy_adherent_plural: "Kẻ Thăng Hoa"
 shan_bo_heresy_desc: "Một triết gia Ma Hổ, Shan-bo, đã đẩy mạnh ý tưởng cấp tiến rằng [Glossary('Ngọc Hoàng','podgloss.augustpersonageofjade')] có thể đã phạm sai lầm khi lưu đày $pod_kueijin$, và đã hổ thẹn rút lui khỏi thế giới sau khi nhận ra điều đó. Shan-bo chưa từng lay chuyển tầm nhìn của mình dù nhiều lần bị các Triều Đình khiển trách, và số tín đồ nhỏ nhưng tận tụy của ông vẫn tồn tại đến ngày nay."
 
 shining_ice_guardians: "Hộ Vệ Băng Sáng"
 shining_ice_guardians_adj: "Sáng"
 shining_ice_guardians_adherent: "$resplendentcranes_religion_adherent$"
 shining_ice_guardians_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 shining_ice_guardians_desc: "Là nhánh chính của [Glossary('Pháp Môn','podgloss.dharma')] Thụy Hạc, các hộ vệ tự hào về sự tuân thủ nghiêm ngặt Bát Liên Đạo của mình."

 eight_lotus_blooming: "Bát Liên Khai Nở"
 eight_lotus_blooming_adj: "Liên"
 eight_lotus_blooming_adherent: "$resplendentcranes_religion_adherent$"
 eight_lotus_blooming_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 eight_lotus_blooming_desc: "Giáo phái này của Thụy Hạc tập trung nhiều hơn vào một hành trình nội tâm hướng tới luật pháp và trật tự, đặt trọng tâm lớn vào thiền định và các cuộc tầm cầu tâm linh."

 empty_throne: "Không Ngai"
 empty_throne_adj: "Ngai"
 empty_throne_adherent: "$resplendentcranes_religion_adherent$"
 empty_throne_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 empty_throne_desc: "Một giáo phái ôn hòa khuyến khích hành động chính nghĩa hơn là các phương pháp và quy định cụ thể. Họ tin rằng ngay cả kẻ độc ác nhất cũng có thể được khuyến khích từ bỏ con đường của mình khi đối diện với đức hạnh."

 two_li_road: "Nhị Lý Đạo"
 two_li_road_adj: "Đạo"
 two_li_road_adherent: "$resplendentcranes_religion_adherent$"
 two_li_road_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 two_li_road_desc: "Giáo phái này tin rằng nền văn minh hiện đại là nguyên nhân thực sự của cái ác và tìm cách quay về những lối sống giản dị và truyền thống hơn."

 yellow_moon: "Hoàng Nguyệt"
 yellow_moon_adj: "Nguyệt"
 yellow_moon_adherent: "$resplendentcranes_religion_adherent$"
 yellow_moon_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 yellow_moon_desc: "Được sáng lập bởi ba vị quan lại tin vào sự Giác Ngộ có thể tìm thấy trong triết lý của người phàm, giáo phái này đã sống sót qua sự sa cơ của họ và được miễn cưỡng công nhận là chính thống."

 fellowship_of_the_travelers_of_the_great_earth: "Đoàn Lữ Khách Đại Địa"
 fellowship_of_the_travelers_of_the_great_earth_adj: "Đoàn"
 fellowship_of_the_travelers_of_the_great_earth_adherent: "$resplendentcranes_religion_adherent$"
 fellowship_of_the_travelers_of_the_great_earth_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 fellowship_of_the_travelers_of_the_great_earth_desc: "Một giáo phái phi pháp tìm kiếm một vị Hoàng Đế mới để thống nhất Trung Vương Quốc thành một quốc gia. Vì mục đích này, họ can thiệp vào chuyện phàm trần nhiều hơn hẳn những gì giáo lý chính thống cho phép."

 liberators_of_the_wheel: "Kẻ Giải Phóng Bánh Xe"
 liberators_of_the_wheel_adj: "Giải Phóng"
 liberators_of_the_wheel_adherent: "$resplendentcranes_religion_adherent$"
 liberators_of_the_wheel_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 liberators_of_the_wheel_desc: "Một giáo phái phi pháp tin rằng [Glossary('Bánh Xe Kỷ Nguyên','podgloss.wheelofages')] xoay chuyển là do những nơi ngoài Trung Vương Quốc đã sa vào tội lỗi quá sâu để có thể cứu chuộc. Theo đó, họ tiến hành các cuộc tấn công khủng bố để làm bất ổn thế giới bên ngoài Trung Vương Quốc."
 
 wise_centipedes: "Ngô Công Minh Triết"
 wise_centipedes_adj: "Ngô Công"
 wise_centipedes_adherent: "$thousandwhispers_religion_adherent$"
 wise_centipedes_adherent_plural: "$thousandwhispers_religion_adherent_plural$"
 wise_centipedes_desc: "Những Thiên Ngữ cân bằng trung tâm tự xưng đơn giản là Ngô Công Minh Triết, và quan tâm đến việc duy trì sự cân bằng một khi đã đạt được ở một nơi hay một con người."

 bunraku: "Bunraku"
 bunraku_adj: "Bunraku"
 bunraku_adherent: "$thousandwhispers_religion_adherent$"
 bunraku_adherent_plural: "$thousandwhispers_religion_adherent_plural$"
 bunraku_desc: "Hướng về phương Bắc, Bunraku hoạt động từ trong bóng tối để thực thi Cân Bằng trong Trung Vương Quốc."

 dancing_peacocks: "Khổng Tước Vũ"
 dancing_peacocks_adj: "Khổng Tước"
 dancing_peacocks_adherent: "$thousandwhispers_religion_adherent$"
 dancing_peacocks_adherent_plural: "$thousandwhispers_religion_adherent_plural$"
 dancing_peacocks_desc: "Hướng về phương Đông, những Khổng Tước sống giữa người phàm và can dự vào chuyện phàm trần nhiều nhất."

 scarlet_centipedes: "Xích Ngô Công"
 scarlet_centipedes_adj: "Ngô Công"
 scarlet_centipedes_adherent: "$thousandwhispers_religion_adherent$"
 scarlet_centipedes_adherent_plural: "$thousandwhispers_religion_adherent_plural$"
 scarlet_centipedes_desc: "Hướng về phương Nam, Xích Ngô Công là những kẻ gây rối và chiến binh tìm cách lật đổ hiện trạng."

 exalted_jade_masks: "Ngọc Diện Tôn Quý"
 exalted_jade_masks_adj: "Diện"
 exalted_jade_masks_adherent: "$thousandwhispers_religion_adherent$"
 exalted_jade_masks_adherent_plural: "$thousandwhispers_religion_adherent_plural$"
 exalted_jade_masks_desc: "Hướng về phương Tây, những Ngọc Diện săn đuổi hồn ma, tìm cách sửa chữa sự mất cân bằng của chúng bằng cách để chúng siêu thoát hoặc tiêu diệt chúng nếu chúng từ chối."

 laughing_rainbows: "Cầu Vồng Cười"
 laughing_rainbows_adj: "Cầu Vồng"
 laughing_rainbows_adherent: "$thrashingdragons_religion_adherent$"
 laughing_rainbows_adherent_plural: "$thrashingdragons_religion_adherent_plural$"
 laughing_rainbows_desc: "Là phái ôn hòa của Đằng Long, đây là quan điểm chính thống của [Glossary('Pháp Môn','podgloss.dharma')] này, tìm kiếm sự dung hòa giữa việc tìm kiếm trải nghiệm mới và chiêm nghiệm những trải nghiệm cũ."

 return_to_power: "Vinh Quy Đoạt Quyền"
 return_to_power_adj: "Quy Hồi"
 return_to_power_adherent: "$thrashingdragons_religion_adherent$"
 return_to_power_adherent_plural: "$thrashingdragons_religion_adherent_plural$"
 return_to_power_desc: "Được sáng lập bởi Đằng Long Kang Cho-lu, trường phái tư tưởng này tin rằng Wan Kuei nên chiếm lấy ngai vàng của các vương quốc phàm trần và cai trị như những vị thần nhân từ như họ đã từng làm trước khi sa cơ. Chỉ khi đó họ mới được [Glossary('Ngọc Hoàng','podgloss.augustpersonageofjade')] tha thứ."

 the_thousand_faced_thunders: "Thiên Diện Lôi"
 the_thousand_faced_thunders_adj: "Lôi"
 the_thousand_faced_thunders_adherent: "$thrashingdragons_religion_adherent$"
 the_thousand_faced_thunders_adherent_plural: "$thrashingdragons_religion_adherent_plural$"
 the_thousand_faced_thunders_desc: "Một giáo phái tận tụy với [Glossary('Dương Giới','game_concept_yang_world_desc')], đặc biệt thành thạo trong việc đối phó với các linh hồn cư ngụ ở đó. Họ có xu hướng theo sát những cải tiến của người phàm để dự đoán trước sự ra đời của những linh hồn mới."

 the_ten_seasons_sect: "Thập Quý Giáo Phái"
 the_ten_seasons_sect_adj: "Giáo Phái"
 the_ten_seasons_sect_adherent: "$thrashingdragons_religion_adherent$"
 the_ten_seasons_sect_adherent_plural: "$thrashingdragons_religion_adherent_plural$"
 the_ten_seasons_sect_desc: "Một giáo phái tận tụy tôn kính các chu kỳ tự nhiên và chăm chút vun trồng những "khu vườn", dù đó là những khu vườn theo nghĩa đen hay là gia tộc, tổ chức, thậm chí cả quốc gia."

 the_passion_bloodflowers: "Huyết Hoa Đam Mê"
 the_passion_bloodflowers_adj: "Huyết Hoa"
 the_passion_bloodflowers_adherent: "$thrashingdragons_religion_adherent$"
 the_passion_bloodflowers_adherent_plural: "$thrashingdragons_religion_adherent_plural$"
 the_passion_bloodflowers_desc: "Huyết Hoa còn có lập trường cực đoan hơn cả Cầu Vồng Cười về việc hưởng thụ cuộc sống, đôi khi giáp ranh với bản năng thú tính."

 thousandhells_religion: "@kueijin_icon! Thiên Địa Ngục" # TODO YAMAKINGS: replace with yama king / defiled icon
 thousandhells_religion_adj: "Địa Ngục"
 thousandhells_religion_adherent: "Akuma"
 thousandhells_religion_adherent_plural: "Akuma"
 thousandhells_religion_desc: "Một [Glossary('Pháp Môn','podgloss.dharma')] đối nghịch với Ngũ Trùng Đạo. Tín đồ của nó rao giảng sự hợp nhất với [Glossary('Diêm Ma Vương','podgloss.yamaking')] và xem trạng thái mới của mình như một cách phụng sự Ngọc Hoàng với tư cách kẻ hủy diệt."

 wayofthetenthousandscreams: "Vạn Thanh Gào Thét"
 wayofthetenthousandscreams_adj: "Gào Thét"
 wayofthetenthousandscreams_adherent: "Kẻ Gào Thét"
 wayofthetenthousandscreams_adherent_plural: "Kẻ Gào Thét"
 wayofthetenthousandscreams_desc: "Một [Glossary('Pháp Môn','podgloss.dharma')] đối nghịch với Ngũ Trùng Đạo. Tín đồ của nó rao giảng sự hợp nhất với [Glossary('Diêm Ma Vương','podgloss.yamaking')] và xem trạng thái mới của mình như một cách phụng sự Ngọc Hoàng với tư cách kẻ hủy diệt."
 
 thousandhells_emma_o: "Emma-o"
 thousandhells_emma_o_adj: "Emma-o"
 thousandhells_emma_o_adherent: "Shikome"
 thousandhells_emma_o_adherent_plural: "Shikome"
 thousandhells_emma_o_desc: "Emma-O, chúa tể hắc ám của [Glossary('Kakuri','podgloss.kakuri')], hiện đang là kẻ được ưu ái nhất trong cuộc đại chiến của [Glossary('Diêm Ma Vương','podgloss.yamaking')] để tranh giành ngôi vị [Glossary('Ma Hoàng','podgloss.demonemperor')].\nLà hiện thân điển hình của Âm Tướng, Emma-O là một cá thể xảo quyệt, tính toán và không chút thương xót. Thường xuất hiện dưới hình dạng một người đàn ông cực kỳ cao lớn, để bộ râu dài và nhìn chung nuôi dưỡng vẻ ngoài rậm lông, làn da như hắc diện thạch, mặc y phục Ainu mang họa tiết chiến trận, bệnh tật và cái chết. Ông thường được tháp tùng bởi các nữ bộc [Glossary('Shikome','podgloss.shikome')] xinh đẹp của mình.\n\nEmma-O là [Glossary('Diêm Ma Vương','podgloss.yamaking')] duy nhất hiện đang hoạt động có thể tự hào đã chiến thắng một trong những kẻ đồng hạng của mình và thu phục lãnh địa cùng quyền lực của hắn, đó chính là cựu Phán Quan Cân Bằng Yen-Lo."

 thousandhells_mikaboshi: "Mikaboshi"
 thousandhells_mikaboshi_adj: "Mikaboshi"
 thousandhells_mikaboshi_adherent: "Quan Chấp Hành Tà Ác"
 thousandhells_mikaboshi_adherent_plural: "Quan Chấp Hành Tà Ác"
 thousandhells_mikaboshi_desc: "Mikaboshi, chúa tể của [Glossary('Thành Đô Tà Nghiệt','podgloss.wickedcity')], là một [Glossary('Diêm Ma Vương','podgloss.yamaking')] từng là một học giả và kiến trúc sư người Nhật. Dù còn rất trẻ so với các kẻ đồng hạng, khát khao cải tiến không ngừng nghỉ và việc tạo ra một "quốc gia máy móc" sẽ biến nhân loại thành những vỏ xác vô hồn khiến hắn trở thành một ngôi sao đang lên khi các nền văn minh nhân loại ngày càng mở rộng."

 thousandhells_ravana: "Ravana"
 thousandhells_ravana_adj: "Ravana"
 thousandhells_ravana_adherent: "Raksha"
 thousandhells_ravana_adherent_plural: "Raksha"
 thousandhells_ravana_desc: "Ravana từng là kẻ kiêu ngạo và ích kỷ nhất trong tất cả [Glossary('Diêm Ma Vương','podgloss.yamaking')]. Hắn thực sự tin rằng không sinh thể nào có thể vượt qua hắn về quyền lực, trí tuệ hay sự tàn nhẫn. Sự kiêu ngạo này khiến hắn rất nguy hiểm nhưng cũng rất dễ đoán, và đã dẫn đến sự sụp đổ của hắn.\nGiờ đây đang ngủ yên trong thành phố đổ nát Lanka, có vẻ như cơ hội để Rajah của Ma Quỷ trở thành [Glossary('Ma Hoàng','podgloss.demonemperor')] đã qua đi."

 thousandhells_rangda: "Rangda"
 thousandhells_rangda_adj: "Rangda"
 thousandhells_rangda_adherent: "Kẻ Mang Ôn Dịch"
 thousandhells_rangda_adherent_plural: "Kẻ Mang Ôn Dịch"
 thousandhells_rangda_desc: "Rangda là kẻ ít kiêu ngạo nhất trong [Glossary('Diêm Ma Vương','podgloss.yamaking')]. Không cao ngạo cũng không tham lam, Rangda cảm thấy rằng bệnh tật và cái chết chậm rãi nên dành cho tất cả mọi người, giàu hay nghèo, thành thị hay thôn dã như nhau.\nVì mục đích này, ả là kẻ bình đẳng nhất trong các Diêm Ma Vương. Ả chỉ muốn mọi sinh thể sống đều rơi vào tầm ảnh hưởng của mình và chết sau khi chịu đựng càng nhiều thống khổ càng tốt."
 
 thousandhells_tou_mu: "Tou Mu"
 thousandhells_tou_mu_adj: "Tou Mu"
 thousandhells_tou_mu_adherent: "Nhện"
 thousandhells_tou_mu_adherent_plural: "Nhện"
 thousandhells_tou_mu_desc: "$pod_kueijin$ có một kẻ địch đáng gờm trong một [UmbraGlossaryLocalized('yomi_wan','Địa Ngục Yomi')] khủng khiếp hơn bất kỳ nơi nào khác, và tên ả là Tou Mu.\nTou Mu là một trong những kẻ độc ác nhất trong [Glossary('Diêm Ma Vương','podgloss.yamaking')], và chính sự thù hận này đã đưa ả đến gần ngôi vị [Glossary('Ma Hoàng','podgloss.demonemperor')] hơn bất kỳ ai. Thiết Nữ Hoàng là Diêm Ma Nữ Vương được biết đến nhiều nhất, nổi tiếng với lòng căm hận cuồng nhiệt dành cho Huyết tộc Đông phương.\nTrong khi các [Glossary('Diêm Ma Vương','podgloss.yamaking')] khác sẽ tìm cách làm băng hoại và sập bẫy chúng, thì làm việc cho Thiết Nữ Hoàng, tốt nhất cũng chỉ là một sự hoãn án tử."

 thousandhells_dokhor_khan: "Dokhor-Khan"
 thousandhells_dokhor_khan_adj: "Dokhor-Khan"
 thousandhells_dokhor_khan_adherent: "Kẻ Được Sủng Ái"
 thousandhells_dokhor_khan_adherent_plural: "Kẻ Được Sủng Ái"
 thousandhells_dokhor_khan_desc: "Dokhor-Khan là [Glossary('Diêm Ma Vương','podgloss.yamaking')] của [Glossary('Địa Ngục Xiềng Gai','podgloss.hellspikedchains')].\nTính đến năm 1230, hắn là một trong những [Glossary('Diêm Ma Vương','podgloss.yamaking')] hùng mạnh nhất, và quyền kiểm soát của hắn trên các thảo nguyên gần như không ai tranh chấp nổi. Hắn ăn thức thống khổ và thù hận, nổi tiếng với những âm mưu táo bạo, đôi khi liều lĩnh, để giành quyền thống trị trước các đối thủ."

 thousandhells_wu_hua: "Wu Hua"
 thousandhells_wu_hua_adj: "Wu Hua"
 thousandhells_wu_hua_adherent: "Tù Nhân"
 thousandhells_wu_hua_adherent_plural: "Tù Nhân"
 thousandhells_wu_hua_desc: "Wu Hua, chúa tể của Hầm Muối và Sắt, là một [Glossary('Diêm Ma Vương','podgloss.yamaking')]. Dù Địa Ngục và sức mạnh tổng thể của hắn nhỏ hơn một số đối thủ, hắn không hề thiếu sự tàn ác.\nBắt tù nhân lao động đến kiệt sức, Wu Hua chỉ đưa ra Thanh Lâu Sắt như một lối thoát khả dĩ mà nhiều kẻ cuối cùng lại hối hận vì đã chọn.\nCơ cấu tổ chức của Wu Hua được tạo khuôn theo cấu trúc quan liêu của Trung Hoa thời sơ khai. Những kẻ hầu vâng lời được thưởng bằng quà tặng và thăng chức. Những tay sai bất tuân bị trừng phạt và cuối cùng bị hủy diệt. Bất kỳ sinh vật nào đã leo lên qua những cấp bậc quái dị này chắc chắn là một sinh vật đầy tàn ác và xảo quyệt, và cần được đối xử thận trọng."
 
 thousandhells_the_wandering_overlord: "Chúa Tể Lang Thang"
 thousandhells_the_wandering_overlord_adj: "Lang Thang"
 thousandhells_the_wandering_overlord_adherent: "Kẻ Lang Thang"
 thousandhells_the_wandering_overlord_adherent_plural: "Kẻ Lang Thang"
 thousandhells_the_wandering_overlord_desc: "Trong số những bí ẩn của Yomi, Chúa Tể Lang Thang là một trong những bí ẩn lớn nhất, ngay cả với các đồng bối [Glossary('Diêm Ma Vương','podgloss.yamaking')] của hắn. Hắn không nắm giữ lãnh địa nào, không có kẻ hầu nào, và dường như cảm thấy như ở nhà bình đẳng cả ở Yomi lẫn Trung Vương Quốc.\nMục đích của Chúa Tể Lang Thang không ai biết được. Đôi khi hắn giúp đỡ những kẻ cần giúp mà không có lý do rõ ràng nào. Những lúc khác hắn thao túng sự việc theo cách khiến hàng ngàn kẻ phải chịu khổ. Hắn không đưa ra lời giải thích nào cho hành động của mình, và các Diêm Ma Vương khác, có lẽ vì sợ phản ứng, chưa bao giờ hỏi han."

 thousandhells_haha_no_fukami: "Haha no Fukami"
 thousandhells_haha_no_fukami_adj: "Haha no Fukami"
 thousandhells_haha_no_fukami_adherent: "Nữ Bộc Trân Châu"
 thousandhells_haha_no_fukami_adherent_plural: "Nữ Bộc Trân Châu"
 thousandhells_haha_no_fukami_desc: "Haha no Fukami không nằm trong số các [Glossary('Diêm Ma Vương','podgloss.yamaking')] nguyên thủy, và một số kẻ sẽ nói rằng ả vẫn chưa đủ băng hoại để đứng cùng hàng với họ. Chỉ có quyền cai trị của ả trên một trong các Thiên Địa Ngục mới đưa ả vào hàng ngũ đó.\nHaha no Fukami từng là mẫu thần đại dương nguyên thủy vào cuối Kỷ Nguyên Thứ Nhất, và chỉ khi [Glossary('Ngọc Hoàng','podgloss.augustpersonageofjade')] yêu cầu ả trở thành kẻ trừng phạt những tội ác chống lại đại dương và tội ác dùng lửa hoặc nước thì địa vị thiên đình của ả mới được củng cố."

 thousandhells_honoyeta: "Honoyeta"
 thousandhells_honoyeta_adj: "Honoyeta"
 thousandhells_honoyeta_adherent: "Xà Thần"
 thousandhells_honoyeta_adherent_plural: "Xà Thần"
 thousandhells_honoyeta_desc: "Vị thần rắn Polynesia này còn được người Bali gọi là Basuki, và được người Ấn Độ gọi là Kaliya hay Naga Pahoda. Honoyeta là một linh hồn mang năng lượng Dương bị băng hoại của cái chết và bệnh tật. Honoyeta biết rằng hắn sẽ không bao giờ vươn tới ngôi vị [Glossary('Ma Hoàng','podgloss.demonemperor')], nhưng mối quan hệ thân thiện — một số kẻ gọi là xu nịnh — của hắn với Maeljin Aliara cho hắn những lựa chọn khác.\nHonoyeta ưa thích loài rắn độc làm tay sai và kẻ hầu cho quyền lực của mình."

 thousandhells_hine_nui_te_po: "Hine-Nui-Te-Po"
 thousandhells_hine_nui_te_po_adj: "Hine-Nui-Te-Po"
 thousandhells_hine_nui_te_po_adherent: "Kẻ Gieo Rắc Tuyệt Vọng"
 thousandhells_hine_nui_te_po_adherent_plural: "Kẻ Gieo Rắc Tuyệt Vọng"
 thousandhells_hine_nui_te_po_desc: "[Glossary('Diêm Ma Nữ Vương','podgloss.yamaking')] mang Âm Tướng này là một trong những chúa tể yếu nhất cai trị tại Yomi. Ả hiện hình như một đám mây bóng tối và ăn thức cảm giác tự khinh ghét bản thân.\nNhững linh hồn rơi vào tuyệt vọng và tự sát ở các đảo Thái Bình Dương lao thẳng vào lãnh địa biển băng giá của ả. Đám [akuma|E] hiếm hoi và cuồng tín của ả chủ yếu lẩn khuất dọc theo rìa xa của Triều Đình Xích Phượng."

 thousandhells_malaveyovo: "Malaveyovo"
 thousandhells_malaveyovo_adj: "Malaveyovo"
 thousandhells_malaveyovo_adherent: "Kẻ Ăn Thịt Người"
 thousandhells_malaveyovo_adherent_plural: "Kẻ Ăn Thịt Người"
 thousandhells_malaveyovo_desc: "Ban đầu được Thiên Đình giao nhiệm vụ canh giữ linh hồn của những kẻ chết vì đói, con quỷ này đã nhanh chóng từ bỏ nhiệm vụ của mình vì sức cám dỗ của quyền lực.\nLà một trong những [Glossary('Diêm Ma Vương','podgloss.yamaking')] khác đang tranh giành quyền kiểm soát Triều Đình Xích Phượng, Malaveyovo cai quản một lãnh địa nhỏ tại Yomi. Bằng cách hành hạ tín đồ của mình với cơn đói không thể thỏa mãn, hắn đẩy họ đến ăn thịt người, và rồi tưởng thưởng họ bằng những cảm giác khoái lạc và ngây ngất."

 thousandhells_grandmother_witch: "Bà Phù Thủy"
 thousandhells_grandmother_witch_adj: "Bà"
 thousandhells_grandmother_witch_adherent: "Cháu"
 thousandhells_grandmother_witch_adherent_plural: "Cháu"
 thousandhells_grandmother_witch_desc: "Bà Phù Thủy là một kẻ tranh ngôi vị [Glossary('Ma Hoàng','podgloss.demonemperor')] – có lẽ thậm chí là một ứng viên nghiêm túc, dù ít kẻ còn biết đến ả. Bà Phù Thủy có một giả thuyết về Kỷ Nguyên Sầu Muộn: Đó sẽ là kỷ nguyên pháp thuật hùng mạnh nhất từng thấy, dù không phải là một dạng pháp thuật mà thế giới hiện tại có thể sống sót qua được. Vì mục đích đó, ả gửi tay sai của mình đi khắp thế giới để thu thập những hiện vật bị nguyền rủa, chiêu mộ những kẻ triệu hồi ác quỷ và pháp sư tài năng, và củng cố yêu sách ngôi vị của mình bằng càng nhiều pháp thuật cấm kỵ mà ả có thể tìm được."

 thousandhells_tou_shen: "Tou Shen"
 thousandhells_tou_shen_adj: "Tou Shen"
 thousandhells_tou_shen_adherent: "Quái Vật Đậu Mùa"
 thousandhells_tou_shen_adherent_plural: "Quái Vật Đậu Mùa"
 thousandhells_tou_shen_desc: "Địa Ngục Sốt Rét là một lãnh địa nhỏ của Yomi, nơi cư ngụ của những kẻ đã gây ra hoặc trục lợi từ sự lây lan của bệnh đậu mùa. Nhiều linh hồn của Địa Ngục này đã bị Rangda đánh cắp khi ả củng cố vai trò [Glossary('Diêm Ma Nữ Vương','podgloss.yamaking')] của mọi bệnh dịch nói chung."

 thousandhells_hluh: "Hluh"
 thousandhells_hluh_adj: "Hluh"
 thousandhells_hluh_adherent: "Kẻ Đun Sôi"
 thousandhells_hluh_adherent_plural: "Kẻ Đun Sôi"
 thousandhells_hluh_desc: "Tên gọi Địa Ngục Dầu Sôi là một cách gọi sai lệch, vì lãnh địa này không chứa đầy dầu sôi, mà là mỡ người đã được luyện ra. Từng tảng mỡ cháy sém và bốc cháy nổi trên bề mặt đại dương sủi bọt đặc quánh xung quanh. Một lớp bọt xám sẫm của cặn bã nấu quá kỹ nổi lên bề mặt ở một số nơi.\n\n[Glossary('Diêm Ma Vương','podgloss.yamaking')] của lãnh địa này có lẽ là kẻ ít giống người nhất trong tất cả các Diêm Ma Vương. Tên hắn là Hluh, và được cho là một sinh vật dạng keo giống như một con sứa bọc giáp đỏ rực cỡ đảo, với những cái miệng hút răng nhọn ở đầu mỗi xúc tu.\nXét đến bản chất của nơi ở mà hắn chọn, khó có khả năng sinh vật này tồn tại theo bất kỳ cách nào mà tâm trí phàm nhân có thể dễ dàng (hay thoải mái) thấu hiểu."

 thousandhells_ku_of_the_thousand_tears: "Ku Ngàn Giọt Lệ"
 thousandhells_ku_of_the_thousand_tears_adj: "Ku Ngàn Giọt Lệ"
 thousandhells_ku_of_the_thousand_tears_adherent: "Người Gác Cổng"
 thousandhells_ku_of_the_thousand_tears_adherent_plural: "Người Gác Cổng"
 thousandhells_ku_of_the_thousand_tears_desc: "Feng-tu là một Địa Ngục Yomi mô phỏng lối vào Địa Ngục trong thần thoại Phật giáo. Dù chủ yếu do Ngọc Đế Yu Huang kiểm soát, [Glossary('Diêm Ma Vương','podgloss.yamaking')] Ku Ngàn Giọt Lệ cũng đặt nơi ở của hắn tại đây, cai quản những kẻ chết vì bất đồng chính kiến."


