l_english:
 POD_talmahera.10.t: "Bàn Tay Sau Bức Màn"
 POD_talmahera.10.desc: "Những tin tức đáng lo về một giáo phái Gehenna nào đó gần đây đã đến tai ngươi và các bậc chúa tể màn đêm cùng chí hướng. Dẫu phần lớn đám cuồng tín mạt thế ấy hầu như vô hại, riêng đám này dường như dùng vẻ ngoài vô hại làm bình phong để thu thập tin tức về đủ thứ chuyện: những thế lực lớn trong vùng, điểm yếu của họ, cùng những tài sản chính trị khác vốn chẳng liên quan gì tới lề lối thường thấy của các giáo phái Gehenna.\nCó lẽ đằng sau đây là một âm mưu lớn hơn."
 POD_talmahera.10.a: "Kẻ nào đang giật dây chúng ta?"
 
 POD_talmahera.11.t: "Bại Lộ!"
 POD_talmahera.11.desc: "Nếu Camarilla là thanh gươm của Tal’Mahe’Ra, thì Sabbat là chiếc chùy sắt của họ. Chẳng phải mọi ma cà rồng Sabbat đều là đám shovelhead cuồng loạn, song sự thiếu kiềm chế thì chỉ trong hàng ngũ này mới thấy rõ đến thế. Tal’Mahe’Ra đã cài người vào Sect ở mọi cấp quyền lực và ảnh hưởng, gồm ít nhất hai Archbishop và một Cardinal. Lợi thế lớn hơn của họ là quyền tự do gieo rắc những nhánh con của các giáo phái chính khắp Sabbat. Các nhóm ấy nhỏ bé, gồm những đặc vụ trung thành và mộ đạo, khoác lên nhiều bộ mặt khác nhau trước Sabbat.\nBất chấp những thành công đó, Sabbat vẫn là kẻ thù tư tưởng đích thực nhất mà Tal’Mahe’Ra phải đối mặt. Thanh Gươm của Caine tìm cách gây chiến với Antediluvian. Khi Gehenna tới, Sabbat chắc chắn sẽ là lực lượng chống đối chủ yếu. Khi tin tức về việc thờ phụng Antediluvian lọt tới tai những tín đồ chân chính của sect, câu trả lời của họ luôn nhanh gọn và đẫm máu.\n #N Chuyện này xảy ra vì mưu đồ xâm nhập của ngươi đã chạm mức nghi ngờ tối đa! #!"
 POD_talmahera.11.a: "Chỉ là một bước lùi."
 POD_talmahera.11.a.tt: "Việc xâm nhập Sabbat bị cấm trong #V 20#! năm."
 
 POD_talmahera.12.t: "Bại Lộ!"
 POD_talmahera.12.desc: "Camarilla vừa là Sect dễ xâm nhập nhất vừa là Sect khó xâm nhập nhất, và các đặc vụ Tal’Mahe’Ra gặt hái thành công ở những mức độ khác nhau trong nhiệm vụ của mình. Xét trên mọi phương diện đáng kể, Camarilla là đứa con hoang của chế độ nhân tài và chế độ quý tộc, còn Tal’Mahe’Ra đã thành bậc thầy lũng đoạn hệ thống ấy để đoạt quyền trong cơ cấu chính trị của Sect. Các đặc vụ Tal’Mahe’Ra thận trọng theo dõi việc Camarilla gạt bỏ Antediluvian như thể chuyện cổ tích và truyền thuyết vỉa hè. Nên làm gì với điều đó vẫn là điểm tranh cãi trong nội bộ Tal’Mahe’Ra. Một số đặc vụ gieo mầm hoài nghi trong thành phố của mình, tìm cách dụ Kindred vào các giáo phái. Họ mưu cầu chấm dứt những lạm quyền của Camarilla bằng cách lật đổ Sect thối nát từ bên trong, dùng chính thành viên của nó. Những đặc vụ khác lại nuôi dưỡng sự u mê của Camarilla, vun đắp và củng cố lòng hoài nghi ấy. Suy cho cùng, các Antediluvian rồi sẽ phải ăn khi tỉnh giấc. Còn bữa tiệc nào ngon hơn một đám ma cà rồng tâm trí yếu ớt, dòng máu mạnh mẽ, bị bắt gặp lúc chẳng đề phòng\nBất chấp vẻ dễ dàng ấy, đã có vài Prince và Justicar sinh nghi đủ để mở cuộc điều tra. Đến nay chưa có bằng chứng nào về một đại âm mưu lộ ra, nhưng có lẽ chỉ còn là vấn đề thời gian trước khi thứ gì đó buộc tội hé lộ.\n #N Chuyện này xảy ra vì mưu đồ xâm nhập của ngươi đã chạm mức nghi ngờ tối đa! #!"
 POD_talmahera.12.a: "Chỉ là một bước lùi."
 POD_talmahera.12.a.tt: "Việc xâm nhập Camarilla bị cấm trong #V 20#! năm."
 
 POD_talmahera.13.t: "Bại Lộ!"
 POD_talmahera.13.desc: "Tal’Mahe’Ra ở châu Phi và Trung Đông là một chi nhánh nhỏ bé, biệt lập, không chia sẻ bí mật của mình với thân thể chính của Sect. Vài kẻ tin rằng có một seraph ngự trong hàng ngũ ấy, song nhiều người biết rằng Bàn Tay ở châu Phi chẳng do một seraph nào coi sóc cả, mà là một tam đầu chế các trưởng lão diễn giải ý chí của Del’Roh theo cách họ thấy hợp. Mục đích chính của chi nhánh này là canh chừng sự hiện diện của Camarilla, Ashirra và Sabbat ở châu Phi, phá hỏng mưu đồ của đám Setite, và thu thập tin tức về những ma cà rồng Laibon bí hiểm và khép kín của châu Phi. Bàn Tay châu Phi ít khi đóng vai trò hiếu chiến trong công việc của vùng, khiến nó thành chi nhánh thụ động nhất của Tal’Mahe’Ra. Tôn ti lỏng lẻo phần lớn để mặc các thành viên tự xoay xở. Kết quả là nhiều giáo phái máu đã mọc lên dưới sự dẫn dắt của Tal’Mahe’Ra, cung cấp đều đặn máu, kẻ hầu, đặc vụ, gián điệp và chỉ điểm cho chủ nhân của chúng. Dẫu thụ động vậy, Bàn Tay châu Phi không phải lúc nào cũng đủ kín kẽ để tránh rắc rối, đáng kể nhất là từ sect Ashirra vốn tổ chức chặt chẽ và đối nghịch về tư tưởng.\n #N Chuyện này xảy ra vì mưu đồ xâm nhập của ngươi đã chạm mức nghi ngờ tối đa! #!"
 POD_talmahera.13.a: "Chỉ là một bước lùi."
 POD_talmahera.13.a.tt: "Việc xâm nhập Ashirra bị cấm trong #V 20#! năm."
 
 POD_talmahera.14.t: "Bại Lộ!"
 POD_talmahera.14.desc: "Tín Đồ của Set thoạt trông là một bổ sung hiển nhiên cho Tal'mahe'Ra, bởi hệ tư tưởng của họ chẳng khác mấy sự tôn sùng các sire Clan của chúng ta. Thế nhưng Sect đã lâm chiến với đám Setite từ những ngày đầu tiên trong lịch sử của mình. Khởi nguồn từ cuộc tranh giành Enoch hàng thiên niên kỷ trước, các xung đột về sau nảy sinh từ việc lũ Rắn tỏ ra lão luyện trong việc xúi giục cả Tal’Mahe’Ra lẫn đám Assamite lao vào nhau.\nDẫu Tal’Mahe’Ra chẳng mong gì hơn là hủy diệt hoàn toàn Clan này, họ vẫn phải hành sự thận trọng. Đám Setite biết rất nhiều về Sect và dùng những tin tức ấy để tự vệ một cách bài bản nếu Tal’Mahe’Ra ra tay quá lộ liễu. Điều đó buộc Sect phải bỏ dở việc nhắm vào đám Setite mà lo hạn chế thiệt hại để giữ kín bí mật của mình.\nĐáng buồn thay, lũ Rắn cũng là bậc thầy của chính trò này, khiến nhiều đặc vụ Tal'mahe'Ra ở Ai Cập biến mất hoặc bị dụ hẳn sang thờ phụng Set.\n #N Chuyện này xảy ra vì mưu đồ xâm nhập của ngươi đã chạm mức nghi ngờ tối đa! #!"
 POD_talmahera.14.a: "Chỉ là một bước lùi."
 POD_talmahera.14.a.tt: "Việc xâm nhập đám Setite bị cấm trong #V 20#! năm."
 
 POD_talmahera.15.t: "Bại Lộ!"
 POD_talmahera.15.desc: "Từ bóng tối của các cung điện Potala và Norbulinka, tới mái vàng của đền Jokhang, Lhasa là trái tim và linh hồn văn hóa của Tây Tạng, cũng như của Tal’Mahe’Ra ở châu Á. Tôn ti của Bàn Tay châu Á thì nghiêm ngặt, xem nhẹ lợi ích cá nhân mà coi trọng sự tận hiến cho toàn thể. Mỗi ma cà rồng bên trong đều biết chỗ đứng của mình trong trật tự ấy, và kẻ nào bước quá ranh giới đó thì bị xử lý dứt khoát. Chi nhánh này gắn bó sâu sắc với người phàm trong vùng, và Tal’Mahe’Ra đóng vai trò chủ động hơn trong đời sống thường nhật của đám kine.\nẢnh hưởng của Tal'mahe'Ra bị kìm hãm bởi một sự thật giản đơn: những lãnh thổ này thường nằm dưới quyền kiểm soát của đám Cathay, hay [GetTrait('kueijin').GetName( GetNullCharacter )], và những kẻ ấy dễ dàng nhận ra một ma cà rồng phương Tây đang can thiệp vào chuyện của họ.\n #N Chuyện này xảy ra vì mưu đồ xâm nhập của ngươi đã chạm mức nghi ngờ tối đa! #!"
 POD_talmahera.15.a: "Chỉ là một bước lùi."
 POD_talmahera.15.a.tt: "Việc xâm nhập đám Cathay bị cấm trong #V 20#! năm."