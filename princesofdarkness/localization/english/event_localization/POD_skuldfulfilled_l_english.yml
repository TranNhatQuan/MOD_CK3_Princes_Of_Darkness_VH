l_english:

 POD_skuldfulfilled.001.t: "Skuld Được Ứng Nghiệm"
 POD_skuldfulfilled.001.desc: "Ngươi đang cố tước đoạt quyền năng vĩnh cửu của máu khỏi kẻ tầm thường không phải $pod_cainite$ là [defender.GetFirstName], biến [defender.GetHerHim] thành một con người tầm thường lần nữa. Nếu [defender.GetSheHe] đủ già, có khả năng những thao túng của ngươi sẽ giết chết [defender.GetHerHim]"
 POD_skuldfulfilled.001.option.a: "[defender.GetSheHe|U] không xứng với quyền năng ấy!"
 POD_skuldfulfilled.001.option.a.tt: "Ngươi sẽ cố tước đoạt quyền năng của máu khỏi [defender.GetHerHis]"
 POD_skuldfulfilled.option.001.a.desc: "Ngươi sẽ vận dụng hiểu biết huyền bí của mình về Oblivion"
 POD_skuldfulfilled.001.option.success: "[defender.GetFirstName] trở thành một con người tầm thường"
 POD_skuldfulfilled.001.option.a.tt.attacker_wins: "Ngươi thành công"
 POD_skuldfulfilled.001.option.failure: "Hiểu biết của ngươi chưa đủ"
 POD_skuldfulfilled.001.option.a.tt.attacker_lost: "[defender.GetFirstName] kháng cự lại"
 POD_skuldfulfilled.001.option.b: "Chưa phải lúc..."
 POD_skuldfulfilled.001.option.b.tt: "Ngươi từ bỏ ý định đoạt lấy quyền năng của máu khỏi [defender.GetFirstName]"


 POD_skuldfulfilled.002.t: "Skuld Được Ứng Nghiệm"
 POD_skuldfulfilled.002.desc: "Kẻ nào đó đã dùng quyền năng hắc ám của Oblivion để đoạt lấy quyền năng dòng máu của ngươi khỏi [defender.GetFirstName]! Giờ [defender.GetSheHe] không còn bị ràng buộc với ngươi bằng mối liên kết máu nữa..."
 POD_skuldfulfilled.002.option.a: "Ta phải làm gì đó về chuyện này"
 POD_skuldfulfilled.002.option.a.tt: "[defender.GetFirstName] không còn là Nô Bộc của ngươi nữa"