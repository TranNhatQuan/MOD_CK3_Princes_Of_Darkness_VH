l_english:
 POD_infernalism_events.1.t: "Diabolus Advocatorum"
 POD_infernalism_events.1.desc: "$POD_splat_demon_plural$ xem [demonic_pacts|E] của chúng là chuyện hệ trọng. Tuy buộc phải giữ đúng phần mình trong giao kèo, chúng sẽ chộp lấy bất cứ kẽ hở hay điều khoản mập mờ nào có lợi cho chúng. Nhiều #TOOLTIP:GAME_TRAIT,witch,[GetNullCharacter] #L Tà Đạo Sĩ#!#! khờ dại đã hiểu ra quá muộn rằng phải đọc những dòng chữ nhỏ chăm chú hơn cả những chữ lớn viết bằng máu."

 POD_infernalism_events.1.pact: "• Khế Ước đã ký với [EventWindowWidget.GetScope.sC('recipient').GetFirstNameNoTooltip] •"

 POD_infernalism_events.1.confirm: "Linh hồn ta đổi lấy quyền năng."
 POD_infernalism_events.1.a: "Điều này chẳng có lợi cho ta."