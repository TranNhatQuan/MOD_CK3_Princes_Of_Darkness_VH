l_english:

 POD_inquisition_face_sins.001.t: "Đối Diện Tội Lỗi của Ngươi"
 POD_inquisition_face_sins.001.desc: "Ngươi bắt đầu cảm thấy mình không xứng với ân điển mà Chúa đã ban cho, với cái cách ngươi đang sống. Đức tin của ngươi từng không gì lay chuyển nổi, nhưng nay ngươi cảm nhận những vết rạn hiện ra khắp thành trì tinh thần của mình.\nThế gian này thực sự đã bị định đoạt diệt vong chăng? Hay là ngươi chưa làm đủ? Hoài nghi đang giày vò ngươi và cuộc khủng hoảng này ảnh hưởng ngày một nhiều tới năng lực của ngươi. Ngươi phải làm gì đó, có lẽ nên bắt đầu bằng việc trở thành một con người tốt hơn."
 POD_inquisition_face_sins.001.option.a: "Ta nên cố hiểu rõ hơn đường lối của Người"
 POD_inquisition_face_sins.001.option.a.tt: "Ngươi sẽ cố làm gì đó về chuyện này, điều đó có thể hóa giải cuộc khủng hoảng hoặc rốt cuộc lại khiến nó tốn kém hơn nữa."
 POD_inquisition_face_sins.001.generic.tt: "#R Cuộc khủng hoảng đức tin này xảy ra vì nhân vật của ngươi mang ít nhất một trong bảy mối tội đầu của Kitô giáo trung cổ (háu ăn, đố kỵ/báo thù, kiêu ngạo, dục vọng, thịnh nộ, tham lam, lười biếng).#!"
 POD_inquisition_face_sins.001.option.b: "Ta chẳng bận tâm chút nào..."
 POD_inquisition_face_sins.001.option.b.tt: "Ngươi sẽ không làm gì cả, và điều đó có cái giá của nó"
 
 POD_inquisition_face_sins.002.t: "Đối Diện Tội Lỗi của Ngươi II"
 POD_inquisition_face_sins.002.desc: "Sau khi ngẫm nghĩ về cách thấu hiểu sâu hơn ân điển của Chúa, ngươi rút ra hai lựa chọn: học hỏi về những bậc chân tu thời xưa, hoặc tìm kiếm sự giúp đỡ nơi các bề tôi của Chúa."
 POD_inquisition_face_sins.002.option.a: "Ta nên tìm tới trí tuệ vĩnh hằng của các vị Thánh thời xưa"
 POD_inquisition_face_sins.002.option.a.tt: "Ngươi sẽ cố học hỏi thêm về những người mộ đạo thời xưa"
 POD_inquisition_face_sins.002.option.a.desc: "Học Thức và lòng quyết tâm"
 POD_inquisition_face_sins.002.option.a.success: "Ngươi thành công trong việc thấu hiểu đường lối của Người rõ hơn"
 POD_inquisition_face_sins.002.option.a.success.tt: "Ta đã hiểu Người rõ hơn"
 POD_inquisition_face_sins.002.option.a.failure: "Ngươi thất bại trong việc thấu hiểu đường lối của Người rõ hơn"
 POD_inquisition_face_sins.002.option.a.failure.tt: "Có lẽ rốt cuộc ta chẳng phải bề tôi của Người?"
 POD_inquisition_face_sins.002.option.b: "Ta nên tìm sự giúp đỡ ở các nhà thờ lân cận"
 POD_inquisition_face_sins.002.option.b.tt: "Ngươi sẽ nhờ các linh mục và tu sĩ trong vùng giúp đỡ"
 POD_inquisition_face_sins.002.option.b.desc: "Ngoại Giao và lòng quyết tâm"
 POD_inquisition_face_sins.002.option.b.success: "Ngươi thành công trong việc thấu hiểu đường lối của Người rõ hơn"
 POD_inquisition_face_sins.002.option.b.success.tt: "Ta đã hiểu Người rõ hơn"
 POD_inquisition_face_sins.002.option.b.failure: "Ngươi thất bại trong việc thấu hiểu đường lối của Người rõ hơn"
 POD_inquisition_face_sins.002.option.b.failure.tt: "Có lẽ, rốt cuộc ta chẳng phải bề tôi của Người?"
 
 POD_inquisition_face_sins.102.t: "Đức Tin Phục Hồi"
 POD_inquisition_face_sins.102.desc.learning: "Sau khi dành thật nhiều thời gian bên những cuốn sách cổ viết về các bậc chân tu thời xưa, ngươi hiểu ra rằng đường lối của Chúa khác với đường lối của con người. Nếu Người ban phúc lành cho ngươi, một kẻ tội lỗi tầm thường, thì ngươi phải khiến Người tự hào."
 POD_inquisition_face_sins.102.desc.diplomacy: "Ngươi đã chuyện trò với rất nhiều bề tôi của Chúa trong mấy ngày qua, và giờ ngươi rốt cuộc bắt đầu hiểu rằng ngươi tự nhìn mình thế nào chẳng quan trọng, điều duy nhất quan trọng là Chúa nhìn ngươi ra sao. Nếu Người cho rằng ngươi xứng với phúc lành ấy, ngươi sẽ đảm bảo nó không bị phí hoài."
 POD_inquisition_face_sins.102.option.a: "Chúa hành sự theo những cách nhiệm mầu"
 POD_inquisition_face_sins.102.option.a.tt: "Ngươi giữ được thần lực của mình"
 
 POD_inquisition_face_sins.003.t: "Khủng Hoảng Đức Tin"
 POD_inquisition_face_sins.003.desc.learning: "Ngay cả sau khi ngươi dành thật nhiều thời gian đọc sách cổ để cố hiểu những bậc chân tu thời xưa, mọi thứ vẫn chẳng có chút ý nghĩa nào. Có lẽ, rốt cuộc ngươi chẳng phải bề tôi của Người. Hoặc chí ít cũng là một bề tôi khiếm khuyết. Ngươi chỉ còn biết cầu nguyện rằng thế là đủ."
 POD_inquisition_face_sins.003.desc.diplomacy: "Ngay cả các linh mục và tu sĩ trong vùng cũng chẳng giúp ngươi hiểu được Chúa và đường lối của Người. Có lẽ, rốt cuộc ngươi chẳng phải bề tôi của Người. Hoặc chí ít cũng là một bề tôi hết sức khiếm khuyết. Ngươi chỉ còn biết cầu nguyện rằng thế là đủ."
 POD_inquisition_face_sins.003.option.a: "Ta đã lạc lối"
 POD_inquisition_face_sins.003.option.a.tt: "Ngươi mất thần lực của mình... trong một thời gian"
 
 POD_inquisition_face_sins.004.t: "Khủng Hoảng Đức Tin II"
 POD_inquisition_face_sins.004.desc: "Đã lâu rồi kể từ lần cuối ngươi có thể dùng thần lực Chúa ban. Có lẽ ngươi đã mất đức tin, có lẽ Người đã mất lòng tin nơi ngươi. Nhưng ngươi vẫn có thể cố lấy lại quyền năng ấy, nếu ngươi muốn.\nXét cho cùng, chẳng bao giờ là quá muộn với người mang Đức Tin Chân Chính. Tội lỗi chỉ nằm ở chỗ không cố bước theo con đường ấy, chứ không nằm ở chỗ bước theo mà thất bại."
 POD_inquisition_face_sins.004.option.a: "Ta sẽ dốc hết những gì mình có để khôi phục Đức Tin"
 POD_inquisition_face_sins.004.option.a.tt: "Ngươi sẽ cố khôi phục Đức Tin của mình, bằng bất cứ giá nào"
 POD_inquisition_face_sins.004.option.b: "Ta không thể bỏ cuộc"
 POD_inquisition_face_sins.004.option.b.tt: "Ngươi sẽ cố hiểu rõ hơn về bản thân và về Chúa"
 POD_inquisition_face_sins.004.option.b.desc: "Thử thách Học Thức"
 POD_inquisition_face_sins.004.option.b.success: "Ngươi thành công trong việc hiểu rõ hơn về Người và về chính mình"
 POD_inquisition_face_sins.004.option.b.failure: "Ngươi thất bại trên hành trình hiểu rõ hơn về Người và về chính mình"
 POD_inquisition_face_sins.004.option.b.failure.tt: "Ngươi sẽ chưa lấy lại được quyền năng... vội"
 POD_inquisition_face_sins.004.option.c: "Lúc này ta không có thời gian cho những chuyện như vậy"
 POD_inquisition_face_sins.004.option.c.tt: "Hiện giờ ngươi sẽ không cố khôi phục đức tin của mình"
 POD_inquisition_face_sins.004.option.d: "Thành thật ư? Chẳng bận tâm chút nào"
 POD_inquisition_face_sins.004.option.d.tt: "Ngươi sẽ không bao giờ có thể khôi phục Đức Tin của mình"