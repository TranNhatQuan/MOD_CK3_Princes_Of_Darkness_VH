 pod1230objectives_fae.150.t: "Vua của Gầm Cầu"
 pod1230objectives_fae.150.desc: "Ta đã kiểm soát ngày càng nhiều cây cầu, và mở rộng vương quốc Gầm Cầu của ta thành một vương quốc hùng mạnh. Ta sẽ nhận được phần của mình. Tội nghiệp kẻ lữ hành nào không thể trả phí qua cầu cho ta. Fae Unseelie và những quái vật khủng khiếp tụ tập dưới ngọn cờ của ta và dòng nước tối tăm."
 pod1230objectives_fae.150.a: "Không ai được vượt qua nếu không có sự cho phép của ta"
 
 pod1230objectives_fae.151.t: "Đại Vương của Gầm Cầu"
 pod1230objectives_fae.151.desc: "Khi những dòng sông xuyên suốt Đông Âu đã rơi vào quyền kiểm soát của ngươi, không gian đáng sợ bên dưới vô số cây cầu sẽ là lãnh địa vĩ đại hơn của ngươi. Không ai được di chuyển qua những dòng nước gầm thét mà không có sự đồng ý của ngươi. Tất cả sẽ trả phần của mình cho ngươi, trong khi ngươi có thể dễ dàng đưa những sinh vật của cơn ác mộng thuần túy vào thế giới dễ như một cuộc dạo chơi thư thái."
 pod1230objectives_fae.151.a: "Không ai được vượt qua nếu không có sự cho phép của ta"
 
 sidhe_house_dominance_beaumayn_objective_decision: "Cuộc Chiến của Hai Anh Em"
 sidhe_house_dominance_beaumayn_objective_decision_desc: "Nhà Beaumayn đã bị chia rẽ bởi mối thù bí mật cay đắng giữa hai anh em [GetScriptedCharacterByHistoryID('POD_fae_character_53').GetFirstName] và [GetScriptedCharacterByHistoryID('POD_fae_character_54').GetFirstName]. Mọi thành viên trong nhà đều bị ám ảnh bởi lời sấm truyền định mệnh cuối cùng của Công Tước [GetScriptedCharacterByHistoryID('POD_fae_character_52').GetFirstName]: liệu Con Đường Sắt hứa hẹn cứu rỗi hay hủy diệt? Nhà này sẽ định đoạt con đường của mình qua một cuộc chiến bí mật."
 sidhe_house_dominance_beaumayn_objective_decision_tooltip: "Ngươi sẽ đánh bại lập luận của phe bên kia — vĩnh viễn."
 sidhe_house_dominance_beaumayn_objective_decision_confirm: "Giải quyết cuộc tranh luận, một lần và mãi mãi"
 brandell_victory_modifier: "Chủ Sở Hữu Escheat"
 markesh_victory_modifier: "Sứ Giả của Cuộc Di Cư"
 sidhe_house_dominance_beaumayn_objective_decision_custom: "[TARGET_CHARACTER.GetFirstName] phải chết"
 
 pod1230objectives_fae.160.t: "Ly Giáo Sắt"
 pod1230objectives_fae.160.desc: "Cuộc tranh luận về lời sấm truyền định mệnh cuối cùng của Công Tước [GetScriptedCharacterByHistoryID('POD_fae_character_52').GetFirstName] đã được giải quyết bằng việc tiêu diệt phe bên kia của cuộc tranh luận. Qua máu, sự đoàn kết của gia tộc đã được khôi phục, và quyền lãnh đạo của ngươi đối với nhà Beaumayn không còn bị nghi ngờ."
 pod1230objectives_fae.160.a: "Những kẻ theo [GetScriptedCharacterByHistoryID('POD_fae_character_53').GetFirstName] đã chiến thắng và sẽ thực thi Eschet!"
 pod1230objectives_fae.160.b: "Các Sứ Giả của Cuộc Di Cư sẽ dẫn dắt tất cả chúng ta theo Con Đường Sắt"
 
 sidhe_house_dominance_dougal_objective_decision: "Từ Vàng đến Thép"
 sidhe_house_dominance_dougal_objective_decision_desc: "Nhà Dougal nổi tiếng trong giới Sidhe với tài rèn kim loại. Trong bộ máy chính trị, nhiều kẻ tin rằng Nhà Dougal là thừa thãi, nhưng chính những khí cụ của họ mới nuôi dưỡng những mưu đồ của Nhà Eiluned. Những kẻ Fiona nóng nảy tranh giành nhau những kiệt tác xinh đẹp của họ. Các lãnh chúa Nhà Gwydion thực hiện những kỳ tích vĩ đại của mình bằng kiếm Dougal, khoác giáp Dougal. Trong khi hầu hết các nhà khác chỉ tranh cãi, hờn dỗi và lười biếng, Nhà Dougal làm việc, xây dựng và sáng tạo. Giờ đây khi Đồng đã bị Sắt và Thép vượt qua, Nhà Dougal cần tạo ra một kho tàng vũ khí và giáp trụ rộng lớn. Các thợ học việc và xưởng của Dougal sẽ tập trung vào việc tạo ra kho vũ khí đó, nhưng nó sẽ không hề rẻ."
 sidhe_house_dominance_dougal_objective_decision_tooltip: "Ngươi sẽ tạo ra một kho tàng vũ khí và giáp trụ khổng lồ"
 sidhe_house_dominance_dougal_objective_decision_confirm: "Một nhát búa của thợ rèn sắt bằng cả trăm nhát búa của thợ kim hoàn"
 dougal_victory_modifier: "Từ Vàng đến Thép"
 
 pod1230objectives_fae.161.t: "Từ Vàng đến Thép"
 pod1230objectives_fae.161.desc: "Dù phải trả giá rất đắt, quyền lãnh đạo của ngươi đối với các bậc thầy thủ công của Nhà Dougal đã xây dựng nên một kho vũ khí có tầm vóc và uy lực thực sự huyền thoại. Với những vũ khí như thế này, Fae có thể chinh phục cả thế giới. Hàng ngàn kẻ đang đứng trong Vũ Trang, dài cổ chờ đợi Tín Hiệu để vươn lên!"
 pod1230objectives_fae.161.a: "Vũ Trang! Vũ Trang!"
 
 sidhe_house_dominance_eiluned_objective_decision: "Tổ Ấm Kiên Cố"
 sidhe_house_dominance_eiluned_objective_decision_desc: "Nhà của Bí Mật đã âm mưu cùng nhiều thực thể và quyền năng tối tăm, huyền bí để thu thập tri thức phép thuật. Với nhiều nhà tiên tri tài giỏi, Nhà Eiluned được báo trước và do đó tìm cách chuẩn bị trước. Với những viễn kiến và lời sấm truyền về tương lai, các kiến trúc sư Eiluned đề xuất những công trình phòng thủ tinh vi có thể lường trước mọi kiểu vây hãm, đầy những lối đi bí mật, mê cung, hầm trú ẩn, lỗ giết người và bẫy cantrip phép thuật. Việc xây dựng những công trình phòng thủ tinh vi như vậy sẽ không hề rẻ."
 sidhe_house_dominance_eiluned_objective_decision_tooltip: "Với tầm nhìn xa, xây dựng các công trình phòng thủ tinh vi"
 sidhe_house_dominance_eiluned_objective_decision_confirm: "Được Báo Trước và Được Chuẩn Bị"
 eiluned_victory_modifier: "Tổ Ấm Kiên Cố"
 
 pod1230objectives_fae.162.t: "Tổ Ấm Kiên Cố"
 pod1230objectives_fae.162.desc: "Được báo trước tức là được chuẩn bị. Với tầm nhìn siêu nhiên vào những khả năng tương lai, các kiến trúc sư của Nhà Eiluned đã xây dựng những công trình phòng thủ tinh vi có thể chịu đựng mọi kiểu vây hãm. Hàng phòng thủ của ngươi đầy những lối đi bí mật, mê cung, hầm trú ẩn, lỗ giết người và bẫy cantrip phép thuật. Cuối cùng, ngươi cảm thấy an toàn."
 pod1230objectives_fae.162.a: "Cứ để kẻ thù của ta đến — chúng sẽ bị đập tan vào những phiến đá!"
 
 sidhe_house_dominance_fiona_objective_decision: "Người Tình Vĩ Đại"
 sidhe_house_dominance_fiona_objective_decision_desc: "Đối với Nhà Fiona, được yêu thương tốt hơn nhiều so với bị sợ hãi. Hầu như mọi Fiona đều là những Người Lãng Mạn; họ vui vẻ đắm chìm trong tình yêu cung đình và xây dựng những trò chơi cùng nghi thức tinh vi xoay quanh mọi chuyện tình cảm. Cung đình Fiona là những nơi của cái đẹp và đam mê, thường đầy những mưu đồ đùa cợt, những cuộc hẹn hò bí mật và những tình yêu cấm đoán. Nhà Fiona có thể thu thập danh tiếng bằng cách sở hữu kỹ năng tình ái tuyệt vời, gia tăng sức hấp dẫn siêu nhiên vốn có của họ, và cũng có nhiều người tình quyền lực đa dạng hữu ích cho những mưu đồ tương lai của họ."
 sidhe_house_dominance_fiona_objective_decision_tooltip: "Ngươi phải có sáu người tình thú vị."
 sidhe_house_dominance_fiona_objective_decision_confirm: "Yêu bằng một tình yêu còn hơn cả tình yêu"
 sidhe_house_dominance_fiona_objective_decision_custom: "Có #V 3#! nhân vật vĩ đại làm [lovers|E]"
 sidhe_house_dominance_fiona_objective_decision_werewolf: "Có một [GetTrait('werewolf').GetName( GetPlayer )] làm [lover|E]"
 sidhe_house_dominance_fiona_objective_decision_sidhe: "Có một [GetTrait('sidhe').GetName( GetPlayer )] [landed|E] làm [lover|E]"
 sidhe_house_dominance_fiona_objective_decision_satyr: "Có một [GetTrait('satyr').GetName( GetPlayer )] làm [lover|E]"
 fiona_victory_modifier: "Người Tình Vĩ Đại"
 
 pod1230objectives_fae.163.t: "Người Tình Vĩ Đại Nhất"
 pod1230objectives_fae.163.desc: "Các nhà thơ hát rong sẽ mãi hát về những chiến tích lãng mạn của ngươi với niềm khát khao cháy bỏng trong tim họ. Ngươi đã học nghệ thuật ái tình từ hiện thân thần thoại của dục vọng — các Satyr. Ngươi hiện thân cho vẻ đẹp của Sidhe kiều diễm nhất. Ngươi đã thuần hóa trái tim hung tợn của một con sói điên cuồng, và xích nó vào những ham muốn của ngươi. Những nhân vật vĩ đại sẵn sàng bỏ mọi dự định lớn lao của mình chỉ để có một đêm trong giường ngươi. Tất cả sẽ yêu ngươi và tuyệt vọng!"
 pod1230objectives_fae.163.a: "Yêu ta đi, yêu ta đi, hãy nói ngươi yêu ta"
 
 sidhe_house_dominance_gwydion_objective_decision: "Vị Vua Chân Chính"
 sidhe_house_dominance_gwydion_objective_decision_desc: "Với Cuộc Chia Cắt, Tuatha de Danaan đã rời Trái Đất đến [UmbraGlossary('arcadia')]. Nhà Gwydion, vốn từ lâu quen với vai trò hiệp sĩ lang thang, cùng với Cuộc Chia Cắt đã nhận ra một trách nhiệm mới — dẫn dắt toàn thể Fae. Giờ đây Nhà Gwydion cần phải tuyên bố chủ quyền đất đai của riêng mình và bảo vệ những vùng đất đó khỏi sự cướp bóc của những kẻ lạc lối và tuyệt vọng. Gwydion fab Don, cháu trai của vua xứ Venedotia, [GetScriptedCharacterByHistoryID('POD_fae_character_84').GetFirstName], có dòng dõi rõ ràng từ Ogma và chính nữ thần Danu. Truyền thuyết kể rằng Lãnh Chúa [GetScriptedCharacterByHistoryID('POD_fae_character_03').GetFirstName] đã có mặt tại lễ đăng quang của vị Đại Vương đầu tiên từng trị vì và ngài đã tặng một đôi sư tử đầu chim xám khổng lồ cho vị lãnh chúa mới. Ngài tuyên bố, 'Nếu có lúc nào lòng nghi ngờ chiếm lấy trái tim thần dân của ngươi, hãy để họ nhìn vào những con sư tử đầu chim, chúng sẽ là sứ giả của vị Đại Vương chân chính.' Các lãnh chúa Nhà Gwydion có sự dũng cảm, tham vọng và dòng dõi để chính đáng dẫn dắt toàn thể Sidhe Seelie đến một Thời Đại Hoàng Kim được tái sinh. Còn ai khác có thể theo đuổi cuộc hành trình tìm kiếm và sử dụng tia sét — Thanh Kiếm Ánh Sáng — lưỡi gươm của người kiến tạo hòa bình — [GetPODArtifact('caliburn_link').GetName], ngoài Vị Vua Chân Chính!"
 sidhe_house_dominance_gwydion_objective_decision_tooltip: "Ngươi phải chứng minh cho toàn thể Nhà Gwydion thấy rằng danh tiếng của ngươi được biết đến khắp thế giới qua thời gian trị vì lâu dài của nhiều tổ ấm, bảo đảm những địa điểm linh thiêng chứa đầy glamour, thu thập những hiện vật kỳ diệu và có những thiên anh hùng ca kể về chiến tích của ngươi sẽ thuyết phục toàn thể Fae về sự huy hoàng huyền thoại của ngươi. Cuối cùng, một cuộc hành trình tìm kiếm thanh kiếm của Vị Vua Chân Chính — Excalibur — [GetPODArtifact('caliburn_link').GetName] sẽ chứng minh uy nghi không thể chối cãi của ngươi."
 sidhe_house_dominance_gwydion_objective_decision_confirm: "Đến Lễ Đăng Quang!"
 sidhe_house_dominance_gwydion_objective_decision_custom: "Ngươi phải thu hồi [GetPODArtifactName('caliburn_link')] từ [great_chasm|E]"
 gwydion_victory_modifier: "Vị Vua Chân Chính"
 
 pod1230objectives_fae.164.t.king: "Vị Vua Chân Chính Đăng Quang"
 pod1230objectives_fae.164.t.queen: "Vị Nữ Vương Chân Chính Đăng Quang"
 pod1230objectives_fae.164.desc.king: "Qua những nỗ lực phi thường, Nhà Gwydion dưới sự lãnh đạo của ngươi đã chứng minh mình là cao quý nhất trong toàn thể Sidhe. Còn ai khác có thể theo đuổi cuộc hành trình tìm kiếm và sử dụng tia sét — Thanh Kiếm Ánh Sáng — lưỡi gươm của người kiến tạo hòa bình — [GetPODArtifact('caliburn_link').GetName], ngoài ngươi, Vị Vua Chân Chính! Toàn thể fae phải cúi đầu trước uy nghi của ngươi và công nhận quyền tối thượng tuyệt đối của ngươi."
 pod1230objectives_fae.164.desc.queen: "Qua những nỗ lực phi thường, Nhà Gwydion dưới sự lãnh đạo của ngươi đã chứng minh mình là cao quý nhất trong toàn thể Sidhe. Còn ai khác có thể theo đuổi cuộc hành trình tìm kiếm và sử dụng tia sét — Thanh Kiếm Ánh Sáng — lưỡi gươm của người kiến tạo hòa bình — [GetPODArtifact('caliburn_link').GetName], ngoài ngươi, Vị Vua Chân Chính! Toàn thể fae phải cúi đầu trước uy nghi của ngươi và công nhận quyền tối thượng tuyệt đối của ngươi."
 pod1230objectives_fae.164.a: "Tất cả giờ có thể bày tỏ lòng tôn kính"
 
 sidhe_house_dominance_liam_objective_decision: "Khúc Ca Phàm Nhân"
 sidhe_house_dominance_liam_objective_decision_desc: "Trí tưởng tượng của phàm nhân đã bị giam cầm trong ranh giới của Giáo Hội. Nhà Liam dẫn dắt Fae trong nỗ lực thấu hiểu quyền lực huyền bí mà Giáo Hội nắm giữ đối với nhân loại. Hoặc tổ chức chuyên chế nhất của Giáo Hội cần bị vô hiệu hóa, hoặc Giáo Hội cần sự dẫn dắt của Fae để tránh xa banality. Nếu Nhà Liam thành công, họ có thể định hướng sự phát triển của nhân loại hướng tới sự sáng tạo."
 sidhe_house_dominance_liam_objective_decision_tooltip: "Hòa Nhập hoặc Vô Hiệu Hóa Giáo Hội"
 sidhe_house_dominance_liam_objective_decision_confirm: "Đứng ngay đây trước Chúa Tể của khúc ca" # With nothing, nothing on my tongue but Hallelujah
 sidhe_house_dominance_liam_objective_decision_custom1: "Ngươi đã hoàn thành [decision|E] $destroy_inquisition_objective_decision$"
 sidhe_house_dominance_liam_objective_decision_custom2: "Đức tin của ngươi là [GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName] và ngươi đã hoàn thành [decision|E] $constantinian_objective_decision$"
 sidhe_house_dominance_liam_objective_decision_custom3: "Không được có [independent_ruler|E] [GetTrait('supehunter').GetName( GetPlayer )] nào trên bản đồ"
 sidhe_house_dominance_liam_objective_decision_custom3_ex: "$sidhe_house_dominance_liam_objective_decision_custom3$ #weak ([example.GetFirstName])#!"
 liam_victory_modifier: "Khúc Ca Phàm Nhân"
 
 pod1230objectives_fae.165.t: "Khúc Ca Phàm Nhân"
 pod1230objectives_fae.165.desc: "Xong rồi. Đàn cừu đã chấp nhận fae là những mục tử và người dẫn đường của họ. Giáo Hội sẽ không còn là mối đe dọa với Fae như trước kia nữa, và toàn thể tiên tộc phải cảm ơn [ROOT.Char.GetFullName]. Những lời ca tụng sẽ vang mãi cho Nhà [ROOT.Char.GetHouse.GetName] đến muôn đời.\n\nMọi fae trên trần thế và trên thiên giới sẽ cần cân nhắc mối quan hệ của họ với Thánh Giáo Hội cùng những kẻ chuyển cầu Linh Thiêng của nó — [ROOT.Char.GetHouse.GetName]. Cầu cho họ chọn con đường chính nghĩa đến sự cứu rỗi, hoặc chắc chắn miệng vực địa ngục sẽ chờ đón họ mãi mãi. Sự cứu chuộc đang ở trong tầm tay!\n\nCác phàm nhân sẽ giúp đỡ bằng mọi cách họ có thể, xây dựng những đại giáo đường tráng lệ, những kiệt tác nghệ thuật huy hoàng và âm nhạc khải hoàn, tất cả để tôn vinh đấng thiêng liêng và các sứ giả thánh thiện của người. Hãy để chúng ta xây dựng một tòa thành rực rỡ trên đồi cao sẽ là ngọn hải đăng của hy vọng và sự cứu rỗi cho tất cả những ai có tai để nghe khúc ca thánh thiện của chúng ta!"
 pod1230objectives_fae.165.a: "Hallelujah!"
 
 sidhe_house_dominance_aesin_objective_decision: "Đứng Vững Trên Midgard"
 sidhe_house_dominance_aesin_objective_decision_desc: "Tín đồ của Vị Thần Bị Đóng Đinh đã lan rộng khắp vùng đất Bắc Âu, đẩy người dân xa rời những khế ước của họ với Aesir và Vanir. Những kẻ mạo danh ma cà rồng gọi là [GetFaithByKey('viaeinherjar').GetName] đang chiếm giữ những đền thờ cổ của [GetTitleByKey('e_midgard').GetNameNoTier] bao gồm cả Uppsala — biến những nghi lễ cổ xưa của chúng ta thành giáo phái máu tầm thường của chúng. [GetFaithByKey('getoffenris').GetName] của [GetTitleByKey('k_fimbul_winter').GetNameNoTier] lang thang khắp vùng hoang dã phía bắc Thụy Điển và phải bị khuất phục. [GetTitleByKey('d_crystal_fortress').GetNameNoTier] nằm trong tay [GetTrait('changeling').GetName( GetPlayer )] [GetFaithByKey('summer_court').GetName] của Nhà [GetDynastyByID( 'POD_fae_dynasty_gwydion' ).GetBaseName] và đáng lẽ nó phải thuộc về chúng ta. Chúng ta sẽ cầm lấy vũ khí cổ xưa và thiêng liêng của mình và giành lại quê hương bằng máu."
 sidhe_house_dominance_aesin_objective_decision_tooltip: "Giành lại toàn bộ Midgard cho người Aesin"
 sidhe_house_dominance_aesin_objective_decision_artifacts: "Ngươi phải sở hữu một trong những hiện vật Bắc Âu này: [GetPODArtifactName('tapestry_of_fate_link')], [GetPODArtifactName('eilaf_link')], [GetPODArtifactName('kristrbani_link')], [GetPODArtifactName('odin_stone_link')]"
