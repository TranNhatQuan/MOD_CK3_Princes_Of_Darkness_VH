l_english:
 black_death_prevented: "Sự kiện Cái Chết Đen sẽ không xảy ra trong tương lai nữa."
 shattering_prevented: "Sự kiện [Glossary('Shattering','game_concept_shattering_desc')] sẽ không xảy ra trong tương lai nữa."
 prevent_black_death_objective_decision_before_last_date: "Ngày hiện tại là 1347.1.1 hoặc sớm hơn"

 prevent_black_death_rat_objective_decision: "Âm Mưu của Ratkin"
 prevent_black_death_rat_objective_decision_desc: "Nhiều nhà tiên tri Fae đang có những giấc mộng tiên tri về một biến cố thảm khốc trong tương lai giết chết hàng triệu người mộng mơ. Chi tiết còn mơ hồ nhưng dường như liên quan đến từng đàn chuột từ hướng đông kéo tới, những đống xác chết đang cháy, những bộ xương nhảy múa, những ngón tay và ngón chân đen sạm. Một số fae tin chắc rằng Ratkin và những kẻ tay sai nhiễm bệnh mang hơi hướng Wyrm của chúng phải bị tiêu diệt."
 prevent_black_death_objective_decision_court_physician_excellent: "Ngươi phải thuê một [GetCourtPositionType('court_physician_court_position').GetName()] có [aptitude|E] Xuất Sắc"
 prevent_black_death_objective_decision_artifact_cauldron_of_fear: "Ngươi phải sở hữu [GetPODArtifactName('cauldron_of_fear_link')] để có thể phá hủy nó"
 prevent_black_death_objective_decision_sabanu: "Tên Nosferatu bẩn thỉu [GetScriptedCharacterByHistoryID('790504').GetFirstName] cần phải chết hoặc đang $pod_torpor$"
 prevent_black_death_objective_decision_plague_bride: "Ả Malkavian độc ác [GetScriptedCharacterByHistoryID('790488').GetFirstName] cần phải chết hoặc đang $pod_torpor$"
 prevent_black_death_objective_decision_locolici: "[GetScriptedCharacterByHistoryID('POD_fae_character_72').GetFirstName] cùng bầy con gieo rắc dịch bệnh của hắn phải bị tiêu diệt. [GetScriptedCharacterByHistoryID('POD_fae_character_77').GetFirstName], [GetScriptedCharacterByHistoryID('POD_fae_character_79').GetFirstName] và [GetScriptedCharacterByHistoryID('POD_fae_character_81').GetFirstName] phải chết!"
 prevent_black_death_rat_objective_decision_tooltip: "Ngươi sẽ cố gắng ngăn chặn việc ứng nghiệm Lời Sấm Truyền của Chuột."
 prevent_black_death_rat_objective_decision_confirm: "Ngăn chặn Cái Chết Đen"
 prevent_black_death_rat_objective_decision_custom: "Không được có [independent_ruler|E] nào theo [GetReligionFamily('rf_wyrm').GetName] [religion|E] trên bản đồ"
 prevent_black_death_rat_objective_decision_custom_ex: "$prevent_black_death_rat_objective_decision_custom$ #weak ([example.GetFirstName])#!"

 prevent_black_death_cat_objective_decision: "Lũ Mèo Con!"
 prevent_black_death_cat_objective_decision_tooltip: "Ngươi sẽ ngăn chặn Lời Sấm Truyền của Chuột bằng cách khiến mọi người yêu mến loài mèo."
 prevent_black_death_cat_objective_decision_desc: "Rõ ràng, để ngăn chặn Lời Sấm Truyền của Chuột, ngươi nên khiến mọi người yêu mến loài mèo!"
 prevent_black_death_cat_objective_decision_confirm: "Meo!"
 prevent_black_death_cat_objective_decision_custom1: "Mọi vị vua và hoàng đế phải có hiệu ứng [GetModifier('cat_story_modifier').GetNameWithTooltip]"
 prevent_black_death_cat_objective_decision_custom1_ex: "$prevent_black_death_cat_objective_decision_custom1$ #weak ([example.GetFirstName])#!"
 prevent_black_death_cat_objective_decision_custom2: "Có thể chiêu mộ [GetMaA('cats').GetName] làm [men_at_arms|E]"

 prevent_black_death_anda_objective_decision: "Chặn Đứng Đám Rợ"
 prevent_black_death_anda_objective_decision_tooltip: "Ngươi sẽ ngăn chặn Lời Sấm Truyền của Chuột bằng cách chặn đứng quân Mông Cổ, nhắm vào đội cận vệ [Glossary('Anda','podgloss.anda')] của chúng để làm suy yếu chúng."
 prevent_black_death_anda_objective_decision_desc: "Lời Sấm Truyền của Ratkin không rõ ràng, nhưng ngươi có linh cảm rằng việc đối phó với đám rợ Mông Cổ và [Glossary('Anda','podgloss.anda')] có thể sẽ giúp ích."
 prevent_black_death_anda_objective_decision_confirm: "Không còn những cuộc đột kích nữa"
 
 destroy_inquisition_objective_decision: "Tiêu Diệt Tòa Thẩm Tra Bóng Tối"
 destroy_inquisition_objective_decision_tooltip: "Ngươi sẽ tiêu diệt Tòa Thẩm Tra Bóng Tối."
 destroy_inquisition_objective_decision_desc: "Giáo Hội cùng Tòa Thẩm Tra đáng sợ của nó bức hại người ngoại đạo và Fae. Nó cải đạo bằng lưỡi gươm, tra tấn hoặc thiêu sống các tín đồ của Cựu Thần và những kẻ hành đạo Huyền Bí. Các linh mục của nó dùng nghi lễ rửa tội lên trẻ em Changeling để tước đoạt vĩnh viễn bản chất phép màu của chúng, dập tắt tia lửa Glamour. Các Giáo Hoàng Celestine II và Innocent III đã tuyên bố cải đạo Livonia bằng vũ lực qua một cuộc Thập Tự Chinh. Một sắc chỉ giáo hoàng đã tuyên bố rằng chiến đấu chống lại người ngoại đạo vùng Baltic có cùng đẳng cấp với việc tham gia Thập Tự Chinh giành Jerusalem. Để Fae có thể tiếp tục tồn tại trên Trái Đất, đã đến lúc phải chấm dứt chuyện này."
 destroy_inquisition_objective_decision_confirm: "Chấm dứt Thời Kỳ Thiêu Đốt"
 destroy_inquisition_objective_decision_before_last_date: "Nhiệm vụ này cần hoàn thành trước năm [GetPlayer.MakeScope.ScriptValue('inquisition_spawn_year')|0]"
 destroy_inquisition_objective_decision_custom1: "Sự kiện Thời Đại Thẩm Tra sẽ không xảy ra trong tương lai"
 destroy_inquisition_objective_decision_custom2: "Mở khóa quyết định $prodigal_objective_decision$"
 destroy_inquisition_objective_decision_james: "[title|E] [GetTitleByKey('k_sword_of_st_james').GetNameNoTier] phải bị tiêu diệt."
 destroy_inquisition_objective_decision_knights: "[title|E] [GetTitleByKey('k_knights_of_acre').GetNameNoTier] phải bị tiêu diệt."
 destroy_inquisition_objective_decision_sisters: "[title|E] [GetTitleByKey('k_sisters_of_st_john').GetNameNoTier] phải bị tiêu diệt."
 destroy_inquisition_objective_decision_oculi: "[title|E] [GetTitleByKey('k_oculi_dei').GetNameNoTier] phải bị tiêu diệt."
 destroy_inquisition_objective_decision_red: "[title|E] [GetTitleByKey('k_red_order').GetNameNoTier] phải bị tiêu diệt."
 destroy_inquisition_objective_decision_murnau: "[title|E] [GetTitleByKey('k_house_murnau').GetNameNoTier] phải bị tiêu diệt."
 destroy_inquisition_objective_decision_livonia: "[GetTitleByKey('d_livonia').GetNameNoTier], [GetTitleByKey('d_lithuanians').GetNameNoTier], [GetTitleByKey('d_latgalians').GetNameNoTier] và [GetTitleByKey('d_esthonia').GetNameNoTier] không được nằm dưới quyền kiểm soát của Thợ Săn Phù Thủy"

 prodigal_objective_decision: "Đưa Những Kẻ Lạc Lối Trở Về"
 prodigal_objective_decision_tooltip: "Ngươi sẽ nhắc nhở những Kẻ Lạc Lối về con người thật của họ."
 prodigal_objective_decision_desc: "Theo tín ngưỡng của Fae, ma cà rồng, người sói, pháp sư, xác ướp và hồn ma đều là những chủng tộc fae đã quên mất nguồn gốc của mình trong [UmbraGlossary('dreaming')]. Trong khi các huyền thoại sáng thế riêng của từng chủng loài siêu nhiên này chắc chắn mâu thuẫn với ý tưởng này, những khả năng vô hạn hiện diện trong Cõi Mộng chắc chắn có nghĩa là điều đó có thể là sự thật. Fae gọi những sinh vật siêu nhiên khác này là 'Kẻ Lạc Lối'. Những Kẻ Lạc Lối đã quên mất nguồn gốc của mình trong [UmbraGlossary('dreaming')], đã đến lúc nhắc nhở họ về con người thật của họ."
 prodigal_objective_decision_confirm: "Về nhà đi, những đứa con lạc lối"
 prodigal_objective_decision_custom: "Không được có [independent_ruler|E] nào không mang trait faerie mà có thiện cảm tiêu cực với ngươi trên bản đồ"
 prodigal_objective_decision_custom_ex: "$prodigal_objective_decision_custom$ #weak ([example.GetFirstName])#!"
 prodigal_objective_decision_custom1: "Mọi sinh vật siêu nhiên khác sẽ được gọi lại là kẻ lạc lối"
 prodigal_objective_decision_custom2: "Các sinh vật siêu nhiên lạc lối sẽ luôn chấp nhận lời đề nghị thần phục của ngươi"
 prodigal_objective_decision_osiris_flail: "Ngươi phải sở hữu [GetPODArtifactName('osiris_flail_link')], vật đã ghi lại toàn bộ lịch sử."
 prodigal_objective_decision_tapestry_of_fate: "Ngươi phải sở hữu [GetPODArtifactName('tapestry_of_fate_link')], vật chứa đựng mọi [Glossary('True Name','podgloss.truename')] từng tồn tại, cũng như số phận của [UmbraGlossary('dreaming')]."
 prodigal_objective_decision_book_of_nod: "Ngươi phải quy tụ [GetPODArtifactName('book_of_nod_link')], vật chứa đựng lịch sử của Hậu duệ Cain."
 prodigal_objective_decision_baizetu: "Ngươi phải quy tụ năm mảnh của [GetPODArtifactName('baizetu_link')], cuốn pháp thư huyền thoại do Hoàng Đế Vàng biên soạn chứa đựng bí mật của toàn bộ 11.520 loại sinh vật siêu nhiên."
 prodigal_objective_decision_ural: "Ngươi [completely_control|E] Caern vương quyền của Trăng Lưỡi Liềm ([GetTitleByKey('b_voronezh').GetNameNoTier]), được lập nên trong thời Impergium."
 prodigal_objective_decision_book_of_the_spirits_secrets: "Ngươi phải sở hữu [GetPODArtifactName('book_of_the_spirits_secrets_link')]"
 prodigal_objective_decision_mayo: "Ngươi [completely_control|E] Triều Đình của Mọi Vị Vua ([GetTitleByKey('c_mayo').GetNameNoTier])."
 prodigal_objective_decision_enoch: "Ngươi [completely_control|E] tàn tích của Enoch ([GetTitleByKey('c_edessa').GetNameNoTier]), Thành Phố Đầu Tiên của Hậu duệ Cain"
 prodigal_objective_decision_giza: "Ngươi [completely_control|E] Thung Lũng Các Vị Vua ([GetTitleByKey('c_giza').GetNameNoTier]), quê hương của khu mộ địa các pharaoh và Đại Kim Tự Tháp."
 prodigal_objective_decision_khotan: "Ngươi [completely_control|E] [GetTitleByKey('c_khotan').GetNameNoTier], thủ đô vương quốc Hsien"
 pod1230objectives_fae.100.t: "Lời Sấm Truyền của Chuột"
 pod1230objectives_fae.100.desc: "Vào những năm đầu thế kỷ mười ba, những mùa đông kéo dài và lạnh lẽo, mưa rơi dai dẳng như gió mùa. Mùa màng chết ngập trong nước. Đường sá biến thành những vũng bùn lầy lội. Nạn đói và giá lạnh đã góp phần lấp đầy các nghĩa địa. Có những giấc mộng tiên tri về một biến cố thảm khốc trong tương lai giết chết hàng triệu người mộng mơ. Chi tiết còn mơ hồ nhưng dường như liên quan đến từng đàn chuột từ hướng đông kéo tới, những đống xác chết đang cháy, những bộ xương nhảy múa, những ngón tay và ngón chân đen sạm. Một số fae tin chắc rằng Ratkin và các đồng minh nhiễm bệnh mang hơi hướng Wyrm của chúng phải bị tiêu diệt.\nNhà Tiên Tri của ngươi đã lên tiếng, nói rằng họ đã thấy một tương lai đen tối còn tệ hơn cả Cuộc Chia Cắt, Lời Sấm Truyền của Chuột. Ngươi nên tập trung vào việc chữa lành trong thế kỷ tới để đảm bảo nó không xảy ra."
 pod1230objectives_fae.100.a: "Lũ Ratkin cùng tay sai của chúng!"
 pod1230objectives_fae.100.b: "Để chặn lũ chuột, chúng ta cần mèo!"
 unlock_convert_to_catlover_scheme: "Mở khóa [interaction|E] $POD_convert_to_catlover_interaction$."
 pod1230objectives_fae.100.c: "Đám rợ Mông Cổ mới là thủ phạm!"
 
 pod1230objectives_fae.101.t: "Âm Mưu của Ratkin"
 pod1230objectives_fae.101.desc: "Có một kế hoạch đen tối được lũ Ratkin bỉ ổi ấp ủ, chúng đã tạo ra căn bệnh chết chóc nhất từng được biết đến với cái tên Đại Dịch Đen. Ngươi mừng vì đã chặn đứng chúng trước khi chúng phát tán hoàn toàn dịch bệnh đó ra khắp thế giới."
 pod1230objectives_fae.101.a: "Lũ chuột đáng ghét."
 
 pod1230objectives_fae.102.t: "Thảm Họa Mèo"
 pod1230objectives_fae.102.desc: "Giờ đây mọi người trên thế giới đều yêu mến loài mèo, Lời Sấm Truyền của Chuột sẽ không ứng nghiệm, nhưng có thể sẽ có một vấn đề khác cần giải quyết."
 pod1230objectives_fae.102.a: "Ôi trời..."
 
 pod1230objectives_fae.103.t: "Tai Ương"
 pod1230objectives_fae.103.desc: "Đám Rợ Mông Cổ đang chậm lại nhờ có ngươi, và Nhà Tiên Tri của ngươi xác nhận rằng ngươi đã ngăn chặn một tương lai nơi quân Mông Cổ dùng máy bắn đá phóng xác chuột chết trong các cuộc vây hãm, điều có thể đã lan truyền một đại dịch."
 pod1230objectives_fae.103.a: "Ta đã đúng."
 
 pod1230objectives_fae.110.t: "Kỷ Nguyên Thứ Tư"
 pod1230objectives_fae.110.desc: "Từng là bề tôi của những vị thần quyền năng nhất trong hệ thống phẩm trật Thiên Đình, Hsien có trách nhiệm đáp lại lời cầu nguyện của phàm nhân theo ý muốn của các bậc bề trên. Trong những biến cố khủng khiếp của Cuộc Chiến Sông Rồng vào đầu [Glossary('Fourth Age','game_concept_fourth_age_desc')], cùng sự sụp đổ của [Glossary('Wan Xian','game_concept_kuei_jin_desc')] trong [Glossary('Third Age','game_concept_third_age_desc')], nhiều Shinma đã nổi loạn chống lại vị trí của mình trong Thiên Đình, hoặc để giúp đỡ phàm nhân hoặc để chống lại họ. Kết quả là, họ bị Ngọc Hoàng trừng phạt. Những kẻ dám đặt mình vào vị trí của [Glossary('Wan Xian','game_concept_kuei_jin_desc')] đã bị trục xuất và buộc phải sống giữa những phàm nhân của Trung Vương Quốc."
 pod1230objectives_fae.110.a: "Ta có sai không?"
 pod1230objectives_fae.110.a.t: "Ngươi bị buộc phải trở thành một changeling, ngươi sẽ tự động có một người thừa kế bản sao sau khi chết tự nhiên. Hoàn thành mục tiêu của ngươi để trở lại làm fae."
 
 pod1230objectives_fae.111.t: "Tao Te Hsien"
 pod1230objectives_fae.111.desc: "Bằng cách nghiên cứu Nei Tan, và tìm được tổ rồng quyền năng nhất, ngươi đã trở thành Tao Te Hsien, và giờ đây có thể giao tiếp với Thiên Đình một lần nữa."
 pod1230objectives_fae.111.a: "Ta đã trở lại"
 
 pod1230objectives_fae.120.t: "Chấm Dứt Thời Đại Thẩm Tra"
 pod1230objectives_fae.120.desc: "Sự ra đời của Tòa Thẩm Tra là đỉnh điểm của Cuộc Chia Cắt khi Giáo Hội, trong nỗ lực theo đuổi giáo lý của mình, đã cố gắng loại bỏ mọi yếu tố siêu nhiên không mong muốn, bao gồm cả fae, khỏi thế giới. Nhưng giờ mọi chuyện đã kết thúc."
 pod1230objectives_fae.120.a: "Lại thêm mê tín dị đoan!"
 
 pod1230objectives_fae.121.t: "Sự Trở Về của Những Kẻ Lạc Lối"
 pod1230objectives_fae.121.desc: "Mọi cư dân siêu nhiên khác của Thế Giới Bóng Tối đều là các phe phái của fae đã quên mất nguồn gốc của mình trong [UmbraGlossary('dreaming')]. Giờ đây họ đã tỉnh ngộ."
 pod1230objectives_fae.121.a: "Chào mừng trở lại."
 
 POD_fae_maintenance.21.t: "Sự Sụp Đổ"
 POD_fae_maintenance.21.desc: "Ngươi đã không thể ngăn chặn Lời Sấm Truyền.\nCuối cùng những sợi chỉ bị kéo căng đến mức mỏng manh giữa cõi phàm và [UmbraGlossary('dreaming')] bắt đầu đứt gãy. Sự cắt đứt này đã mang đến [Glossary('Shattering','game_concept_shattering_desc')]. Nó không chỉ cắt đứt mối liên kết giữa [UmbraGlossary('arcadia')] và Trái Đất mà còn dập tắt hy vọng rằng điều đó có thể bị đảo ngược.\nNgươi phải chọn một cách để đối phó với chuyện này."
 POD_fae_maintenance.21.a: "Chấp nhận Đạo Trao Đổi và từ bỏ sự bất tử của ngươi."
 POD_fae_maintenance.21.b: "Chạy trốn đến Arcadia."
 POD_fae_maintenance.21.c: "Ẩn mình vào một tổ ấm" #Become a Lost One.
 POD_fae_maintenance.21.d: "Ngươi đã tìm ra con đường bất tử của riêng mình."
 POD_fae_maintenance.21.d.tt: "Sự Sụp Đổ không có tác động gì đến ngươi, xét về cá nhân."
 POD_fae_maintenance.22.t: "Sự Sụp Đổ"
 POD_fae_maintenance.22.desc: "Cuối cùng những sợi chỉ bị kéo căng đến mức mỏng manh giữa cõi phàm và [UmbraGlossary('dreaming')] bắt đầu đứt gãy. Sự cắt đứt này chính là [Glossary('Shattering','game_concept_shattering_desc')]. Nó không chỉ cắt đứt mối liên kết giữa [UmbraGlossary('arcadia')] và Trái Đất mà còn dập tắt hy vọng rằng điều đó có thể bị đảo ngược."
 POD_fae_maintenance.22.a: "Ồ vậy sao?"
 
 POD_fae_maintenance.31.t: "Thời Kỳ Gián Đoạn"
 POD_fae_maintenance.31.desc: "Thời kỳ không còn sidhe hay Fae Chân Chính nào trên Trái Đất, với những changeling 'pha loãng' còn sót lại phải tự lo liệu cho bản thân sau những cơn hấp hối cuối cùng của [Glossary('Shattering','game_concept_shattering_desc')] vào khoảng năm 1400 sau Công Nguyên, chính là Thời Kỳ Gián Đoạn, khi các changeling phải cố gắng tìm cách tự sinh tồn."
 POD_fae_maintenance.31.a: "Thời của chúng ta đã qua."
 POD_fae_maintenance.31.b: "Thời của chúng ta đã đến."
 
 constantinian_objective_decision: "Hòa Nhập với Giáo Hội"
 constantinian_objective_decision_tooltip: "Giáo Hội sẽ nhìn nhận Fae như những tôi tớ thánh thiện của đấng thiêng liêng: thiên thần, tiên tri, kẻ làm phép màu và những kẻ thực sự được ban phước."
 constantinian_objective_decision_desc: "Thay vì xem Giáo Hội như một kẻ thù cần bị chống đối và ngăn chặn, phái Constantinian xem nó như một điều bí ẩn cần được khám phá, nghiên cứu và dẫn dắt. Một khi sức mạnh của niềm tin phàm nhân được thấu hiểu, có lẽ ngay cả Màn Sương cũng sẽ trở lại thế cân bằng nhân từ hơn của nó và Fae có thể gặt hái glamour từ sự sáng tạo của những kẻ mộ đạo."
 constantinian_objective_decision_confirm: "Thiết Lập Giáo Lý Constantinian"
 constantinian_objective_decision_custom_artifact: "Ngươi phải sở hữu một trong các [artifacts|E] thánh tích của Cơ Đốc Giáo: Chén Thánh, một Mảnh Thánh Giá Chân Chính, Đèn của Constantine, Roi Khổ Nạn, Ngọn Giáo Định Mệnh, Chén Thánh Valencia hoặc Kèn của Gabriel."
 constantinian_objective_decision_custom_byzantion: "Chủ nhân của [GetTitleByKey('c_byzantion').GetNameNoTier] phải là một [GetFaithDoctrine('special_doctrine_ecumenical_hunters').GetBaseName] hoặc một [GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName]"
 constantinian_objective_decision_custom_roma: "Chủ nhân của [GetTitleByKey('c_roma').GetNameNoTier] phải là một [GetFaithDoctrine('special_doctrine_ecumenical_hunters').GetBaseName] hoặc một [GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName]"
 constantinian_objective_decision_custom_jerusalem: "Chủ nhân của [GetTitleByKey('c_jerusalem').GetNameNoTier] phải là một [GetFaithDoctrine('special_doctrine_ecumenical_hunters').GetBaseName] hoặc một [GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName]"
 constantinian_objective_decision_custom1: "$POD_splat_hunter_plural$ sẽ ngừng xem Fae là kẻ thù không thể hòa hợp. Thay vào đó, Fae sẽ được xem như thiên thần, tiên tri, kẻ làm phép màu hoặc những kẻ đặc biệt được ban phước"
 constantinian_objective_decision_custom2: "Có thể chiêu mộ [GetMaA('witchhunters').GetName] làm [men_at_arms|E]"
 constantinian_objective_decision_custom3: "Thợ săn [GetFaithDoctrine('special_doctrine_constantinian_catechism').GetBaseName] sẽ luôn chấp nhận lời đề nghị thần phục của ngươi"
 
 pod1230objectives_fae.122.t: "Giáo Lý Constantinian"
 pod1230objectives_fae.122.desc: "Lạy Cha chúng con ở trên trời,\nchúng con nguyện danh Cha cả sáng.\nNước Cha trị đến.\nThánh Linh Người ngự xuống trên chúng con và thanh tẩy chúng con.\nÝ Cha thể hiện dưới đất cũng như trên trời.\nXin Cha cho chúng con hôm nay lương thực hằng ngày cho ngày mai,\nvà tha nợ chúng con, như chúng con vẫn giữ trọn bổn phận của mình.\nVà chớ để chúng con sa vào giờ thử thách — Sự Sụp Đổ, hay bị cám dỗ theo banality.\nVì vương quyền, quyền năng và vinh quang đều thuộc về Người mãi mãi."
 pod1230objectives_fae.122.a: "Amen."
 
 destroy_order_of_reason_objective_decision: "Vượt Lên Lý Trí"
 destroy_order_of_reason_objective_decision_tooltip: "Ngươi sẽ ngăn chặn Hội Lý Trí mang thêm banality đến với thế giới."
 destroy_order_of_reason_objective_decision_desc: "Những kẻ học thức tìm cách trói buộc thế giới trong Lý Trí và Khoa Học. Nỗ lực tầm thường của họ trong việc liệt kê, định nghĩa và giới hạn thế giới đang đe dọa chấm dứt niềm tin vào những điều huyền bí và không thể kiểm soát. Hội Thợ Nề, hậu duệ của Collegium Praecepti thời La Mã cổ đại, trong liên minh mới của họ với Huynh Đệ Hội Quy Tắc, tìm cách trói buộc thực tại bằng những quy định hà khắc như thể những kẻ hành nghề luật sư tầm thường của những đạo luật sắt đá lạnh lùng thuộc Ars Praeclarus. Chúng đang lần theo các đường ley để tìm ra những mạch nguồn glamour, mà chúng gọi là node, rồi rút cạn và phá hủy chúng. Vào năm 1210 sau Công Nguyên, Hội Thợ Nề đã phá hủy Khế Ước Mistridge bằng những ống sắt rèn dài bắn ra những viên đạn sắt lạnh trong một quy trình mà chúng gọi là 'khai hỏa đại bác'. Người ta nói rằng Nhà Tremere phản trắc, từng là pháp sư Hermetic — nay là ma cà rồng, đã góp phần vào chiến thắng này của Hội Thợ Nề. Những 'kẻ lý trí' này đã tàn sát mọi Phù Thủy và Fae mà chúng có thể tìm thấy trong đống đổ nát của Mistridge và vùng phụ cận. Chúng phải bị ngăn chặn bằng mọi giá!"
 destroy_order_of_reason_objective_decision_confirm: "Không còn trì trệ nữa"
 destroy_order_of_reason_objective_decision_before_last_date: "Ngày hiện tại là 1851.1.1 hoặc sớm hơn"
 destroy_order_of_reason_objective_decision_custom: "[title|E] Hội Lý Trí phải bị tiêu diệt.\nNgươi phải kiểm soát các xưởng vũ khí sắt rèn của Innsbruck ở Công Quốc Tyrol."
 destroy_order_of_reason_objective_decision_grimgroth: "[GetScriptedCharacterByHistoryID('505107').GetFirstName], Tai Ương của Mistridge, cần phải chết hoặc đang $pod_torpor$"
 
 pod1230objectives_fae.130.t: "Vượt Lên Lý Trí"
 pod1230objectives_fae.130.desc: "Âm mưu của Hội Lý Trí đã bị phá vỡ. Kế hoạch trói buộc thế giới trong Lý Trí và Khoa Học của chúng đã bị dập tắt. Những xưởng sắt lạnh của chúng đã bị bịt miệng. Với việc Tremere bị tiêu diệt, cuộc Chiến Tranh Massasa của chúng với Hội Hermes đã kết thúc trong thất bại cho lũ phù thủy Bất Tử Soán Ngôi. Các nhà Hermetic thống nhất giờ đây có thể dồn toàn bộ sự chú ý và cơn thịnh nộ vì việc phá hủy Mistridge lên Hội Thợ Nề và liên minh lén lút của chúng với những học giả cùng chí hướng, những kẻ keo kiệt bủn xỉn, những kẻ sùng đạo đạo mạo và các kẻ truyền bá banality khác. Không còn các triết gia 'duy lý', nhân loại đã bắt đầu quay trở lại với tín ngưỡng xưa cùng những khế ước cũ với Fae để vừa lý giải thế giới huyền ảo vừa sống sót qua nó."
 pod1230objectives_fae.130.a: "Trên trời dưới đất còn nhiều điều hơn những gì triết học của ngươi từng mộng tưởng"
 
 inert_cold_iron_objective_decision: "Sắt Lạnh Vô Hại"
 inert_cold_iron_objective_decision_tooltip: "Ngươi sẽ thay đổi "thực tại" khoa học, tìm cách biến đổi hoặc thay đổi tính chất của sắt lạnh để làm nó trở nên vô hại."
 inert_cold_iron_objective_decision_desc: "Fae chật vật để hiểu tại sao Sắt Lạnh lại gây hại cho họ. Nó có thể gây ra sự hủy diệt vĩnh viễn một linh hồn Fae. [GetScriptedCharacterByHistoryID('POD_fae_character_04').GetFirstName] đã hy sinh mạng sống để cố gắng phá vỡ sự kìm kẹp của sắt lạnh lên fae. Nhiều người tin rằng sắt đại diện cho sức mạnh của Cuộc Chia Cắt; sự phân chia triết học giữa nhân loại và [UmbraGlossary('dreaming')] được hiện thân... hóa thành xác thịt. Nó không được hình thành bởi bất kỳ 'vật thể' nào, mà như một hiệu ứng 'tự nhiên' khi Banality đạt đến mức nguy hiểm. Fae phải nghiên cứu Sắt Lạnh và bằng cách nào đó làm cho nó trở nên vô hại."
 inert_cold_iron_objective_decision_confirm: "Biến đổi hệ hình!"
 inert_cold_iron_objective_decision_before_last_date: "Ngày hiện tại là 1510.1.1 hoặc sớm hơn"
 inert_cold_iron_objective_decision_dougal: "Ngươi phải thuộc Nhà [GetDynastyByID( 'POD_fae_dynasty_dougal' ).GetBaseName]."
 inert_cold_iron_objective_decision_strathcurach_forge: "Ngươi [completely_control|E] Lò Rèn Dougal tại Stratchcruach ([GetTitleByKey('c_lennox').GetNameNoTier]), cũng như công quốc [GetTitleByKey('d_galloway').GetNameNoTier] xung quanh"
 inert_cold_iron_objective_decision_valiant_forge: "Ngươi [completely_control|E] Lò Rèn Dũng Cảm ([GetTitleByKey('c_warwickshire').GetNameNoTier]) cũng như các công quốc [GetTitleByKey('d_valiant_forge').GetNameNoTier] và [GetTitleByKey('d_hereford').GetNameNoTier]"
 inert_cold_iron_objective_decision_lost_forge: "Ngươi [completely_control|E] Lò Rèn Thất Lạc của Vulcan ([GetTitleByKey('c_messina').GetNameNoTier]) cũng như công quốc [GetTitleByKey('d_sicily').GetNameNoTier]"
 inert_cold_iron_objective_decision_anweyth: "Ngươi phải sở hữu: kiệt tác cuối cùng của Dougal, Thanh Kiếm của Phát Minh, [GetPODArtifactName('anweyth_link')], sắt lạnh được biến đổi thành thanh kiếm Thép đầu tiên."
 inert_cold_iron_objective_decision_caliper_of_aife: "Ngươi phải sở hữu [GetPODArtifactName('caliper_of_aife_link')], vật có thể đo lường mọi thứ."
 inert_cold_iron_objective_decision_achen: "Ngươi phải sở hữu [GetPODArtifactName('achen_link')], chiếc búa hai đầu của Dougal"
 inert_cold_iron_objective_decision_vulcans_hammer: "Ngươi phải sở hữu [GetPODArtifactName('vulcans_hammer_link')]"
 inert_cold_iron_objective_decision_gold_mines: "Ngươi tiêu 10000 vàng hoặc [completely_control|E] ít nhất một trong những mỏ vàng này: [GetTitleByKey('b_turoc').GetNameNoTier], [GetTitleByKey('b_abrudbanya').GetNameNoTier], [GetTitleByKey('c_chalkidike').GetNameNoTier], [GetTitleByKey('c_allaqi').GetNameNoTier], [GetTitleByKey('b_wasulu').GetNameNoTier], [GetTitleByKey('b_diakha').GetNameNoTier], [GetTitleByKey('b_goundafa').GetNameNoTier]"
 inert_cold_iron_objective_decision_no_murder: "Sắt lạnh sẽ trở nên vô hại và không còn đe dọa các linh hồn Fae nữa. Mọi Fae Sơ Sinh sẽ không còn là mục tiêu hợp lệ của các âm mưu ám sát."
 pod1230objectives_fae.131.t: "Sắt Lạnh Vô Hại"
 pod1230objectives_fae.131.desc: "Các 'nhà triết học tự nhiên' đã sai khi cho rằng vũ trụ bị ràng buộc bởi các quy luật cứng nhắc, có thể khám phá được. Với nỗ lực to lớn, thời gian, chi phí và sức mạnh ý chí thuần túy, ngươi đã chứng minh điều mà mọi nhà giả kim tìm kiếm Hòn Đá Triết Gia từng nghi ngờ. Bằng cách tiến hành hàng ngàn thí nghiệm, ngươi đã kiên trì và cuối cùng đạt được kết quả ngươi mong muốn. Thực tại uốn cong trước những kẻ có tâm trí và sự tự tin để hiện thực hóa mong muốn của mình. Nếu một điều tầm thường như cuộc truy tìm huyền thoại của các nhà giả kim biến chì thành vàng là khả thi, thì tại sao việc biến đổi sắt lạnh để vô hiệu hóa khả năng hủy diệt linh hồn bất tử của Fae của nó lại không thể. Eureka! Ngươi đã làm được!"
 pod1230objectives_fae.131.a: "Thực tại là những gì ta nói nó là!"
 
