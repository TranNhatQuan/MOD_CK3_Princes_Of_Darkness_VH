 rhineland_duchy_objective_rhineland_county_claims: "Có được [unpressed_claims|E] đối với Oberrhein ([GetTitleByKey('d_alsace').GetName] và các [counties|E] [GetTitleByKey('c_breisgau').GetNameNoTier], [GetTitleByKey('c_sundgau').GetNameNoTier], [GetTitleByKey('c_colmar').GetNameNoTier], [GetTitleByKey('c_strassburg').GetNameNoTier], [GetTitleByKey('c_baden').GetNameNoTier], [GetTitleByKey('c_erbach').GetNameNoTier], [GetTitleByKey('c_frankfurt').GetNameNoTier] và [GetTitleByKey('c_mainz').GetNameNoTier]) và một phần của Mittelrhein ([GetTitleByKey('c_koblenz').GetNameNoTier] và [GetTitleByKey('c_sayn').GetNameNoTier])."
 
 pod1230objectives_fae.1100.t: "Borbetomagus Đã Được Thu Hồi!"
 pod1230objectives_fae.1100.desc: "Kinh đô tổ tiên của Burgundy Cổ giờ đây là một phần của vương quốc ngươi."
 pod1230objectives_fae.1100.a: "Con đường đến sông Rhine đã rộng mở trước ta."
 
 rhineland_kingdom_objective_decision: "Vương Quốc Rhineland"
 rhineland_kingdom_objective_decision_tooltip: "Mở rộng [GetTitleByKey('d_rhineland').GetName] thành một [kingdom|E] đúng nghĩa dọc theo sông Rhine."
 rhineland_kingdom_objective_decision_desc: "Một khi triều đình được thiết lập tại kinh đô cổ xưa của Burgundy [GetTitleByKey('d_rhineland').GetName], toàn bộ Rhineland sẽ mở ra cho công cuộc chinh phục. Khi sông Rhine được bảo đảm, cuộc tìm kiếm kho báu huyền thoại của người Nibelungen — [GetGlobalVariable('rhinegold').Artifact.GetName] — có thể bắt đầu một cách nghiêm túc."
