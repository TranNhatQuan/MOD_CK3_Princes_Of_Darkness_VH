 sidhe_house_dominance_scathach_objective_decision_custom: "[Glossary('Shattering','game_concept_shattering_desc')] được ngăn chặn"
 scathach_victory_modifier: "Sắc Lệnh của các Nhà Tiên Tri Morphean"
 
 pod1230objectives_fae.180.t: "Sắc Lệnh của các Nhà Tiên Tri Morphean"
 pod1230objectives_fae.180.desc.fae: "Dù Sắc Lệnh của các Nhà Tiên Tri Morphean không phải lúc nào cũng có ý nghĩa với các thành viên trong nhà, cả nhà vẫn đoàn kết tuân theo chúng. Là lãnh đạo fae sơ sinh của Nhà Scathach, ngươi đã hành trình đến [UmbraGlossary('deep_dreaming')] và [UmbraGlossary('sea_of_silver')] để tìm ra điều được tiên tri sẽ được tìm thấy. Liệu điều đó có đủ không?"
 pod1230objectives_fae.180.desc.changeling: "Dù Sắc Lệnh của các Nhà Tiên Tri Morphean không phải lúc nào cũng có ý nghĩa với các thành viên Nhà Scathach, cả nhà vẫn đoàn kết tuân theo chúng. Là lãnh đạo changeling của Nhà, ngươi đã nghiêm túc tuân theo mệnh lệnh của Scathach ở lại Thế Giới Mùa Thu ngay cả khi banality đang dâng cao. Liệu điều đó có đủ không?"
 pod1230objectives_fae.180.a: "Như thường lệ, chúng ta tôn vinh các Nhà Tiên Tri Morphean"
 
 sidhe_house_dominance_danaan_objective_decision: "Vệ Binh Cõi Mộng"
 sidhe_house_dominance_danaan_objective_decision_desc: "Nhà Danaan lang thang khắp những con đường xuyên qua [UmbraGlossary('dreaming')]. Họ canh giữ các trod của nó và khai phá những lối đi mới. Họ dẫn đường cho người mộng mơ và qua Lời Thề với Rồng của mình giành được sự ưu ái của nhiều Chimera. Một lãnh đạo của nhà đã đi xa trong [UmbraGlossary('dreaming')] có thể nâng lên một đàn Chimera ấn tượng để thả vào Thế Giới Mùa Thu khi thời điểm thích hợp."
 sidhe_house_dominance_danaan_objective_decision_tooltip: "Du hành khắp thế giới và [UmbraGlossary('dreaming')] và học hỏi bí mật của nó để xây dựng một đội quân Chimera."
 sidhe_house_dominance_danaan_objective_decision_confirm: "Hai con đường tách nhau trong sương mù, và ta đã chọn con đường ít người đi hơn"
 danaan_victory_modifier: "Tìm Kiếm Vệ Binh Cõi Mộng"
 sidhe_house_dominance_danaan_objective_decision_traits: "Ngươi là một [GetTrait('eshu').GetName( GetPlayer )], [GetTrait('lifestyle_traveler').GetName( GetPlayer )], [GetTrait('pilgrim').GetName( GetPlayer )] hoặc một [GetTrait('adventurer').GetName( GetPlayer )]."
 sidhe_house_dominance_danaan_objective_decision_mount: "Có một con vật cưỡi: [GetPODArtifactName('ship_of_the_four_quarters_link')], [GetPODArtifactName('nightmare_horse_link')], [GetPODArtifactName('sorn_link')], [GetPODArtifactName('vozhd_palanquin_link')], [GetPODArtifactName('sorel_link')], ngựa, sói, gấu, sư tử, hoặc hổ"

 sidhe_house_dominance_danaan_objective_decision_artifact: "Có một kho báu hữu ích cho kẻ lữ hành: Bụi Đường, [GetPODArtifactNameWithFallback('pegasus_bridle_link',Localize('artifact_pegasus_bridle_name'))], $artifact_eye_of_opening_name$, [GetPODArtifactName('dreamstone_of_madoc_link')], [GetPODArtifactNameWithFallback('havens_compass_link',Localize('artifact_havens_compass_name'))], [GetPODArtifactNameWithFallback('broach_of_scrying_link',Localize('artifact_broach_of_scrying_name'))] hoặc [GetPODArtifactName('tapestry_of_fate_link')]."

 pod1230objectives_fae.181.t: "Vệ Binh Cõi Mộng"
 pod1230objectives_fae.181.desc: "Là lãnh đạo Nhà Danaan, ngươi đã lang thang khắp những con đường xuyên qua [UmbraGlossary('dreaming')]. Giờ ngươi canh giữ các trod của nó và khai phá những lối đi mới. Ngươi đã đóng vai trò người dẫn đường cho nhiều người mộng mơ. Qua Lời Thề với Rồng, ngươi đã giành được sự ưu ái của nhiều Chimera. Ngươi đã nâng lên một đàn Chimera ấn tượng đang chờ đợi mệnh lệnh của ngươi, sẵn sàng xâm chiếm cả Thế Giới Mùa Thu theo lời triệu gọi của ngươi."
 pod1230objectives_fae.181.a: "Vì Sự Phòng Thủ của các Trod đến Arcadia!"
 

 become_santa_objective_decision: "Trở Thành Santa"
 become_santa_objective_decision_desc: "Ngươi có một kế hoạch điên rồ đặc biệt để tránh mất đi sự bất tử đang đến cùng Sự Sụp Đổ. Bằng cách đều đặn phân phát đồ chơi huyễn ảo cho vô số trẻ em mỗi dịp Yule, ngươi sẽ sống vĩnh hằng nhờ niềm tin của chúng vào ngươi. Chúng sẽ viết thư cho ngươi để xin giúp đỡ. Chúng sẽ tôn trọng lối cũ và để lại lễ vật để thỏa mãn cơn đói vô đáy của ngươi."
 become_santa_objective_decision_before_last_date: "Ngươi phải trở thành Santa trước Cái Chết Đen và Sự Sụp Đổ!"
 become_santa_objective_decision_winter_capital: "Phải là mùa đông tại kinh đô của ngươi"
 become_santa_objective_decision_court_antiquarian_excellent: "Ngươi phải thuê một [GetCourtPositionType('antiquarian_court_position').GetName()] [GetTrait('boggan').GetName( GetPlayer )] hoặc [GetTrait('nocker').GetName( GetPlayer )] có [aptitude|E] tốt"
 become_santa_objective_decision_tooltip: "Ngươi sẽ trở nên bất tử bằng cách phân phát đồ chơi huyễn ảo cho vô số trẻ em mỗi dịp Yule"
 become_santa_objective_decision_deer_pooka: "Ngươi cần ít nhất một cận thần [GetTrait('pooka').GetName( GetPlayer )] có hiệu ứng [GetModifier('POD_pooka_deer_affinity_modifier').GetNameWithTooltip]. Santa cần một con tuần lộc!"
 become_santa_objective_decision_elves: "Ngươi cần ít nhất ba cận thần [GetTrait('nocker').GetName( GetPlayer )] và ba cận thần [GetTrait('boggan').GetName( GetPlayer )]. Xưởng của Santa cần 'yêu tinh'."
 become_santa_objective_decision_confirm: "Ta sẽ trở thành Santa, Người Mang Quà"
 become_santa_objective_decision_louhi: "[GetScriptedCharacterByHistoryID('790633').GetFirstName] Độc Ác có thể cố ngăn cản ngươi thăng chức, ả cần phải chết hoặc đang $pod_torpor$"
 become_santa: "Ngươi trở thành Santa!"
 pod1230objectives_fae.1000.t: "Santa Bất Diệt!"
 pod1230objectives_fae.1000.desc: "Xong rồi! Vô số trẻ em đã được tặng những món quà huyễn ảo. Vô số trẻ em tin vào ngươi! Những giấc mơ của chúng lấp đầy ngươi bằng một mạch nguồn glamour bất tận! Thế giới có thể bị tàn phá bởi chiến tranh đẫm máu, ôn dịch kinh hoàng, những cuộc thẩm tra khủng khiếp và banality bào mòn tâm hồn — nhưng ngươi sẽ trường tồn!\n\n #EMP 'Ngày hôm nay đất trời sẽ vang lên\nvới khúc ca trẻ thơ ca hát\ndâng Chúa, Đức Vua Kitô của chúng ta,\nsinh ra trên đời để cứu rỗi chúng ta;\nNgười mà Đức Chúa Cha đã ban cho chúng ta.\n\nSố phận thuộc về Người, niềm vui thuộc về chúng ta;\nkhi Người giáng trần,\nBethlehem chứng kiến ngày Người sinh ra;\nbò và lừa bên cạnh Người\ntừ giá lạnh mà che chở Người.\n\n Ngôi sao sáng của Chúa, trên đầu Người,\nBa Nhà Thông Thái dẫn lối đến với Người;\nquỳ gối bên giường Người,\ndâng lễ vật trước Người,\nca tụng Người và tôn thờ Người.\n\nNgày hôm nay thiên thần ca hát;\ncùng khúc ca đất trời vang lên,\nca tụng Chúa Kitô, Đức Vua thiên đàng,\nsinh ra trên đời để cứu rỗi chúng ta;\nbình an và tình yêu Người ban cho chúng ta.\n\nIdeo, o, o, Ideo, o, o,\nideo gloria in excelsis Deo!'#!"
 
# The Latin text is probably a musical parody of an earlier 12th century song beginning "intonent hodie voces ecclesie", written in honour of Saint Nicholas, the patron saint of Russia, sailors and children – to whom he traditionally brings gifts on his feast day, 6 December. https://en.wikipedia.org/wiki/Personent_hodie
 
