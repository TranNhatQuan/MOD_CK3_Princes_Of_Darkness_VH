 pod1230objectives_fae.1300.t: "Đế Chế sông Rhine!"
 pod1230objectives_fae.1300.desc: "Đã bảo đảm mọi Công Quốc dọc theo sông Rhine và với Rhinegold nằm chắc chắn trong kho báu của ngươi, không ai có thể tranh chấp quyền cai trị sông Rhine của ngươi."
