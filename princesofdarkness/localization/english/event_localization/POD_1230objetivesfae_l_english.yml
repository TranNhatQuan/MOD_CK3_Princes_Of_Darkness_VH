 aesin_victory_modifier: "Midgard Được Bảo Toàn"
 
 pod1230objectives_fae.170.t: "Midgard Được Bảo Toàn"
 pod1230objectives_fae.170.desc: "Khi mọi sinh vật siêu nhiên của Midgard đã quy phục vương quốc của ngươi, quá trình Cơ Đốc Giáo hóa Scandinavia đã bắt đầu bị đảo ngược. Người Bắc Âu sẽ tôn trọng lối cũ và sẽ tôn kính người Aesin như những vị thần trên Trái Đất.\n\n'Hãy lắng nghe lời ta, hỡi mọi tầng lớp người, những đứa con lớn nhỏ của Heimdall. Các ngươi đã triệu hồi chúng ta, người Aesin, để kể lại những gì chúng ta nhớ về những kỳ tích cổ xưa nhất của thần và người.'"
 pod1230objectives_fae.170.a: "Quạ của ta, hãy bay khắp thế gian mỗi ngày."
 
 sidhe_house_dominance_ailil_objective_decision: "Chấm Dứt Cuộc Chiến Mùa"
 sidhe_house_dominance_ailil_objective_decision_desc: "Nhà Ailil hưng thịnh nhờ quyền lực và đã mài giũa kỹ năng ngoại giao và mưu lược của mình. Fae Seelie đã phản bội chu kỳ luân phiên ngai vàng theo mùa thông thường, và qua đó đã tước đoạt lượt cai trị chính đáng của Ailil. Để khôi phục sự cân bằng, Cuộc Chiến Mùa phải chấm dứt. Nếu Ailil có thể chấm dứt Cuộc Chiến Mùa, vị thế của họ trong toàn thể các Nhà Sidhe sẽ không thể bị thách thức."
 sidhe_house_dominance_ailil_objective_decision_tooltip: "Chấm dứt Cuộc Chiến Mùa hoặc chiếm toàn bộ Ireland và giành lấy sự công nhận của ngươi"
 sidhe_house_dominance_ailil_objective_decision_confirm: "Vạn vật đều có một mùa, và một thời khắc cho mỗi mục đích"
 sidhe_house_dominance_ailil_objective_decision_custom: "Cuộc Đấu Tranh Chiến Tranh Mùa đã kết thúc"
 ailil_victory_modifier: "Chấm Dứt Cuộc Chiến Mùa"
 
 pod1230objectives_fae.171.t: "Ailil cho Mọi Mùa"
 pod1230objectives_fae.171.desc: "Với kỹ năng mưu lược và ngoại giao của ngươi, ngươi đã thành công chấm dứt cuộc xung đột khủng khiếp đã chia rẽ Fae từ lâu. Với sự lãnh đạo của ngươi, Nhà Ailil đã vươn lên trên mọi cuộc tranh cãi vặt vãnh của các Nhà Sidhe khác. Giờ đây với vị thế ưu việt của nhà ngươi, nỗ lực của Fae có thể tập trung vào việc canh tân những khế ước cổ xưa với nhân loại. Họ sẽ lại tin tưởng và mãi mãi."
 pod1230objectives_fae.171.a: "Một thời để chiến tranh, và một thời để hòa bình."
 
 sidhe_house_dominance_balor_objective_decision: "Di Sản của Người Fomorian"
 sidhe_house_dominance_balor_objective_decision_desc: "Nhà Balor truy nguyên tổ tiên của mình về dòng dõi sidhe đã hòa huyết với người Fomorian. Họ tin rằng Mùa Đông Vô Tận đã gần kề, và cần một bàn tay mạnh mẽ để dẫn dắt bánh lái đưa fae vượt qua nó. Qua mối liên kết của họ với $glossary_wyrm$, họ tìm cách liên minh giữa Unseelie với Black Spiral Dancer và Fomori. Với mối liên kết tổ tiên giữa Nhà Balor và người Fomorian, có thể thực hiện một nghi lễ mạnh mẽ để hợp nhất một Fae với một linh hồn tà linh quyền năng nhằm tạo ra giống lai Fae-Fomori — một Fomarch."
 sidhe_house_dominance_balor_objective_decision_tooltip: "Hợp nhất với một linh hồn Tà Linh để trở thành giống lai Fae-Fomori"
 sidhe_house_dominance_balor_objective_decision_confirm: "Triệu Hồi Kẻ Bò Trên Nexus"
 balor_victory_modifier: "Fomorian"
 sidhe_house_dominance_balor_objective_decision_artifacts: "Ngươi phải sở hữu một trong những hiện vật Balor này: [GetPODArtifactName('balors_crystal_eye_link')], [GetPODArtifactName('steaming_spear_of_vengeance_link')], [GetPODArtifactName('cauldron_of_fear_link')] hoặc Cặn Máu"

 pod1230objectives_fae.172.t: "Fomorian Mãi Mãi"
 pod1230objectives_fae.172.desc.start: "Nhà Balor đã truy nguyên tổ tiên của ngươi về dòng dõi sidhe đã hòa huyết với người Fomorian. Mùa Đông Vô Tận đã gần kề, và ngươi cần dẫn dắt fae vượt qua nó, dù họ có ưng thuận sự cai trị của ngươi hay không. Ngươi đã chuẩn bị nghi lễ để hợp nhất bản thể Fae của ngươi với một linh hồn tà linh quyền năng nhằm tạo ra giống lai Fae-Fomori — một Fomarch. Mắt Pha Lê của Balor phát sáng đỏ mờ và tỏa ra một sức nóng lớn."
 pod1230objectives_fae.172.desc.steaming_spear_of_vengeance: "Nâng [GetPODArtifact('steaming_spear_of_vengeance_link').GetName] lên, ngươi liếm dòng máu nóng từ lưỡi giáo, cảm thấy bản thân tràn ngập cơn thịnh nộ."
 pod1230objectives_fae.172.desc.cauldron_of_fear: "Sau khi chuẩn bị thứ hỗn hợp huyền bí ghê tởm — ngươi uống cạn từ [GetPODArtifact('cauldron_of_fear_link').GetName]."
 pod1230objectives_fae.172.desc.blood_dross: "Nghiền nát lọ nhỏ đường kết tinh, ngươi uống dòng máu ma cà rồng chứa bên trong Cặn Máu và tràn ngập glamour hắc ám."
 pod1230objectives_fae.172.desc.end: "Ngươi mở một trod đến [umbra|E] để triệu gọi Kẻ Bò Trên Nexus.\nMột ánh lấp lánh đen xuất hiện trong không khí cùng tiếng rên rỉ ngân nga run rẩy. Ngươi cảm thấy trên da mình như thể móng tay cào trên bảng đen. Không khí bốc mùi tanh tưởi gợi nhớ đến một căn bệnh ung thư. Linh hồn $glossary_wyrm$ hiện thân thành một avatar ghê tởm và kinh hoàng. Móng vuốt và răng nanh của nó xé toạc da thịt ngươi và dữ dội đâm xuyên vào khoang ngực ngươi. Ngươi tràn ngập cơn đau đớn tột cùng. Và rồi...\nChúng ta hợp nhất. Mãi mãi."
 
 pod1230objectives_fae.172.a: "Chúng ta là Fomarch!"

 sidhe_house_dominance_daireann_objective_decision: "Kẻ Chữa Lành-Chiến Binh"
 sidhe_house_dominance_daireann_objective_decision_desc: "Nhà này giành được địa vị cao quý nhờ [GetScriptedCharacterByHistoryID('POD_fae_character_21').GetFirstName] chữa lành cho một lãnh chúa Gwydion, nhưng họ giành được sự tôn trọng thực sự nhờ lòng dũng cảm của chiến binh [GetScriptedCharacterByHistoryID('POD_fae_character_88').GetFirstName] của họ. Nhà Daireann biết rất rõ rằng bàn tay có thể chữa lành cũng có thể gây hại. Một chiếc cốc có thể chứa cả thuốc độc lẫn thuốc giải. Một lưỡi kiếm có thể dùng để chữa lành, và cũng có thể dùng để cắt đứt sợi chỉ của một sinh mạng."
 sidhe_house_dominance_daireann_objective_decision_martial: "Ngươi có [education|E] [martial|E]"
 sidhe_house_dominance_daireann_objective_decision_martial_prowess: "Ngươi có [education|E] Martial [prowess|E]"
 
 sidhe_house_dominance_daireann_objective_decision_tooltip: "Phát triển cả khả năng chiến trận lẫn y thuật của ngươi"
 sidhe_house_dominance_daireann_objective_decision_confirm: "Vạn Vật Đều Có Một Mùa"
 daireann_victory_modifier: "Kẻ Chữa Lành-Chiến Binh"
 
 pod1230objectives_fae.173.t: "Kẻ Chữa Lành-Chiến Binh"
 pod1230objectives_fae.173.desc: "Là lãnh đạo Nhà Daireann, ngươi đã nỗ lực để làm gương cho bản chất song hành của kẻ chữa lành và chiến binh. Bàn tay ngươi có thể chữa lành và bàn tay ngươi có thể gây hại. Ngươi như một chiếc cốc có thể chứa cả thuốc độc lẫn thuốc giải, như một lưỡi kiếm có thể dùng để chữa lành hoặc để cắt đứt sợi chỉ của một sinh mạng."
 pod1230objectives_fae.173.a: "Kẻ Chữa Lành-Chiến Binh"
 
 sidhe_house_dominance_leanhaun_objective_decision: "Lời Nguyền của Leanhaun"
 sidhe_house_dominance_leanhaun_objective_decision_desc: "Lời nguyền bí mật giáng lên [GetScriptedCharacterByHistoryID('POD_fae_character_15').GetFirstName] lan rộng đến toàn bộ Nhà của nàng và khiến các thành viên già đi nhanh chóng nếu không rhapsodize phàm nhân. Lời tiên tri nói rằng nó sẽ không chấm dứt 'cho đến khi các vì sao khóc ra máu và chính mặt đất lạnh đi dưới chân ngươi', điều dường như khó xảy ra trong tương lai gần. Thông thường, Nhà Leanhaun mê hoặc và rhapsodize một nạn nhân phàm nhân mỗi lần. Người ta suy đoán rằng nếu đủ số người mộng mơ được nuôi dưỡng và glamour của những người mộng mơ đó đủ lớn, tác động của lời nguyền có thể được giảm bớt nếu không muốn nói là bị xóa bỏ."
 sidhe_house_dominance_leanhaun_objective_decision_tooltip: "Giảm bớt lời nguyền bằng cách khai thác một bầy Người Mộng Mơ"
 sidhe_house_dominance_leanhaun_objective_decision_confirm: "Những cực hình của chúng ta có thể trở thành bản chất của chúng ta"
 sidhe_house_dominance_leanhaun_objective_decision_custom: "Có #V 7#! [dreamers|E]"
 sidhe_house_dominance_leanhaun_objective_decision_great: "Có #V 3#! nhân vật vĩ đại làm [dreamers|E]"
 leanhaun_victory_modifier: "Lời Nguyền Leanhaun Được Giảm Bớt"
 
 pod1230objectives_fae.174.t: "Lời Nguyền của Leanhaun"
 pod1230objectives_fae.174.desc: "Là lãnh đạo Nhà Leanhaun, ngươi đã khám phá ra cách giảm bớt lời nguyền của cả triều đại mình. Thay vì chỉ chuyển từ một phàm nhân bị rhapsodize sang người khác mỗi khi cần kíp tuyệt vọng, ngươi nuôi dưỡng một bầy phàm nhân lớn để thu hoạch, bao gồm cả một số phần thưởng lớn tràn đầy glamour. Bằng cách liên tục rút cạn một hồ glamour lớn như vậy, ngươi đã có thể làm giảm nhẹ lời nguyền."
 pod1230objectives_fae.174.a: "Lời Nguyền của Leanhaun"
 
 sidhe_house_dominance_varich_objective_decision: "Các Linh Hồn của Rus"
 sidhe_house_dominance_varich_objective_decision_desc: "Inanimae, các linh hồn của đất và trời, từ lâu đã luôn là tôi tớ của [GetScriptedCharacterByHistoryID('POD_fae_character_19').GetFirstName]; những đứa con của nàng. Vùng đất Nga từng tràn ngập Inanimae. Những linh hồn này là một phần của mọi thứ đối với fae: đất đai, sông ngòi, tổ ấm của họ, và đài nguyên taiga vô tận bao quanh họ. Nhà Varich hiểu cách làm hài lòng những linh hồn này cũng như cách sử dụng chúng. Các linh hồn của bếp lửa và mái ấm mạnh mẽ và hữu ích tương xứng với kích thước và sự huy hoàng của Neo của chúng, cũng như mức độ tôn trọng dành cho chúng cho phép chúng được như vậy. Không có lãnh địa Varich nào hoàn chỉnh mà thiếu chúng, và không thành viên nào của Nhà Varich cố ý xúc phạm những linh hồn hữu ích này. Củng cố hàng ngũ Nhà Varich bằng cách đưa thêm nhiều Inanimae vào chư hầu."
 sidhe_house_dominance_varich_objective_decision_phyla_vassals: "Có năm [powerful_vassals|E] thuộc [GetTraitGroup('phyla').GetName()] Inanimae của [culture|E] Nga."
 sidhe_house_dominance_varich_objective_decision_culture: "Ngươi là [cultural_head|E]."
 sidhe_house_dominance_varich_objective_decision_tooltip: "Dẫn dắt văn hóa Nga và có nhiều bình chứa Inanimae"
 sidhe_house_dominance_varich_objective_decision_confirm: "Нет плохой земли, есть плохие хозяева"
 # There is no bad earth, only bad owners
 varich_victory_modifier: "Các Linh Hồn của Rus"
 
 pod1230objectives_fae.175.t: "Các Linh Hồn của Rus"
 pod1230objectives_fae.175.desc: "Là lãnh đạo Nhà Varich, ngươi đã vun đắp một mối quan hệ vững chắc với các linh hồn tự nhiên của vùng đất Rus. Những linh hồn này là một phần của mọi thứ đối với fae: đất đai, sông ngòi, tổ ấm của họ, và đài nguyên taiga vô tận bao quanh họ. Ngươi hiểu cách làm hài lòng những linh hồn này cũng như cách sử dụng chúng. Các linh hồn của bếp lửa và mái ấm mạnh mẽ và hữu ích tương xứng với kích thước và sự huy hoàng của Neo của chúng, cũng như mức độ tôn trọng ngươi đã dành cho chúng. Nghĩa vụ giữa quý tộc và tôi tớ chảy theo hai chiều, và Inanimae đã sẵn sàng hành động theo ý muốn của ngươi."
 pod1230objectives_fae.175.a: "Họ là những linh hồn của một vùng đất tốt lành."
 
 sidhe_house_dominance_scathach_objective_decision: "Sắc Lệnh của các Nhà Tiên Tri Morphean"
 sidhe_house_dominance_scathach_objective_decision_desc: "Kể từ khi [GetScriptedCharacterByHistoryID('POD_fae_character_17').GetFirstName] đánh bại Octriallach Vua Trắng của người Fomorian trong Cuộc Chiến của Rừng Cây, các Nhà Tiên Tri Morphean đã là thế lực định hình bên trong Nhà Scathach. Dù Sắc Lệnh của các Nhà Tiên Tri Morphean không phải lúc nào cũng có ý nghĩa với các thành viên trong nhà, cả nhà vẫn đoàn kết tuân theo chúng. Tuy nhiên các Nhà Tiên Tri đã tiên đoán thảm họa nếu Thanh Kiếm của Tethra đi vào Trái Tim của [UmbraGlossary('dreaming')], và Nhà Scathach đã tấn công Nhà Gwydion khi họ cố di chuyển nó. Trong cuộc đổ máu sau đó, lưỡi kiếm đã biến mất vào Cõi Mộng xung quanh. Hậu quả chính trị của trận chiến đã khiến Nhà Scathach trở thành một Nhà bị lưu đày và ruồng bỏ bởi phe Seelie. Dù vậy, các thành viên của nhà vẫn tuân theo Sắc Lệnh của các Nhà Tiên Tri. Bất chấp sự đoàn kết này, Nhà bị chia rẽ giữa những Changeling được giao nhiệm vụ ở lại khi phần lớn Sidhe chạy trốn đến [UmbraGlossary('arcadia')], và [GetScriptedCharacterByHistoryID('POD_fae_character_87').GetFirstName] cùng những kẻ theo bà là Fae Sơ Sinh tìm kiếm [UmbraGlossary('sea_of_silver')] trong [UmbraGlossary('deep_dreaming')] để tìm ra thứ gì đó có thể vừa gìn giữ Thế Giới Mùa Thu vừa đánh bại người Fomorian."
 sidhe_house_dominance_scathach_objective_decision_tooltip: ""
