 pod1230objectives_fae.1200.t: "Vua của sông Rhine!"
 pod1230objectives_fae.1200.desc: "Toàn bộ sông Rhine giờ đây nằm dưới quyền kiểm soát của ngươi. Chắc chắn Rhinegold đang ẩn giấu đâu đó dọc theo dòng sông huyền bí này."
 pod1230objectives_fae.1200.a: "Trên vùng đất sông Rhine, hãy là... Vua, vua, vua, vua!"
 
 rhineland_empire_objective_decision: "Đế Chế Rhineland"
 rhineland_empire_objective_decision_tooltip: "Mở rộng [GetTitleByKey('k_rhineland').GetName] dọc theo dòng sông để nó trở thành một [empire|E]."
 rhineland_empire_objective_decision_desc: "Với mọi [duchies|E] của [GetTitleByKey('e_rhineland').GetNameNoTier] dưới quyền cai trị của ngươi, những bạo chúa ma cà rồng từng tuyên bố chủ quyền vùng đất này đã bị tiêu diệt, và Rhinegold nằm chắc chắn trong kho báu của ngươi, tất cả phải công nhận quyền cai trị của ngươi trên toàn bộ sông Rhine."
 rhineland_empire_objective_decision_confirm: "Toàn bộ sông Rhine!"
 rhineland_empire_objective_dead_stiffs: "Những ma cà rồng nổi bật có tuyên bố chủ quyền đối với Rhineland phải chết hoặc đang $pod_torpor$ — [GetScriptedCharacterByHistoryID('505050').GetFirstName], [GetScriptedCharacterByHistoryID('505096').GetFirstName], [GetScriptedCharacterByHistoryID('505086').GetFirstName] và [GetScriptedCharacterByHistoryID('505121').GetFirstName]"
