 underbridge_empire_objective_decision_desc: "Khi những dòng sông xuyên suốt Đông Âu rơi vào quyền kiểm soát của ngươi, không gian đáng sợ bên dưới vô số cây cầu sẽ là lãnh địa vĩ đại của ngươi. Không ai được di chuyển qua những dòng nước gầm thét mà không có sự đồng ý của ngươi. Tất cả sẽ trả phần của mình cho ngươi, trong khi ngươi có thể dễ dàng đưa những sinh vật của cơn ác mộng thuần túy vào thế giới dễ như một cuộc dạo chơi thư thái."
