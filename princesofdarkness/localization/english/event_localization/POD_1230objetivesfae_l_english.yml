 rhineland_duchy_objective_decision: "Thu Hồi Borbetomagus"
 rhineland_duchy_objective_decision_desc: "Truyền thuyết về Siegfreid, Gunther và người Nibelung vẫn còn được nghe kể trong mọi mái nhà của người Germanic. Ngay cả các Tổng Giám Mục phàm nhân đương thời của Mainz cũng mang tên Siegfreid. Kinh đô tổ tiên của người Gibichung, thủ phủ của Burgundy Cổ, một lần nữa nên trở lại dưới quyền kiểm soát của Fae. Chiếm giữ Worms là bước tiếp theo trong việc thu hồi sông Rhine cho Fae."
 rhineland_duchy_objective_decision_tooltip: "Bảo đảm kinh đô cổ xưa của Burgundy Cổ"
 rhineland_duchy_objective_decision_confirm: "Thu Hồi Borbetomagus"
