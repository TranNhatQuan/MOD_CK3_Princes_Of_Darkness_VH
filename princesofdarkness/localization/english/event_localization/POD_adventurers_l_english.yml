l_english:

 PODadventurers.0003.desc: "Gia tộc phàm nhân Visconti đã là tâm điểm của chính trường Bắc Ý suốt nhiều thế hệ nay. Họ đã sản sinh ra vô số nhân vật lừng danh (và khét tiếng), đồng thời để lại dấu ấn của mình lên lịch sử vùng đất này. Họ luôn tránh xa giới siêu nhiên và né được sự can thiệp của nó... cho tới bây giờ.\nMột hậu duệ của gia tộc, Giangaleazzo, mới đây đã [Glossary('được Trao truyền','game_concept_Embrace_desc')] bởi một Lasombra vô danh, và đã nhanh chóng tận dụng cả uy thế gia tộc lẫn tài chính trị sắc sảo của mình để giành lấy ảnh hưởng to lớn tại Lombardy trong một khoảng thời gian ngắn đến kinh ngạc. Những mật vụ từng đáng tin và những mối liên hệ trung thành nay đang quay lưng lại với các thế lực siêu nhiên (và đôi khi cả phàm nhân) trong vùng để theo về với hắn, làm suy yếu nghiêm trọng quyền kiểm soát của các lãnh chúa địa phương nơi đây."
 PODadventurers.0003.a: "Hắn tưởng hắn là ai chứ?"
 PODadventurers.0003.b: "Hãy đẩy lùi thứ ảnh hưởng đang lớn dần của hắn."
 visconti_contacts_modifier: "Mối Liên Hệ Visconti"
 visconti_contacts_modifier_desc: "Các mối liên hệ trong gia tộc của Giangaleazzo tỏ ra hữu ích trong việc mở rộng ảnh hưởng của ngài."
 PODadventurers.0005.desc: "Trong một nước cờ đầy bất ngờ, Giangaleazzo Visconti đã đích thân tới [ROOT.Char.Custom('PODDomicile')] của ngài. Vốn không phải kẻ khờ, ngài lập tức hiểu rằng hắn không đến một mình, mà có đội quân đang lớn mạnh của hắn hậu thuẫn phía sau trong một màn phô trương sức mạnh mà ngài chỉ có thể nể phục. Gã Lasombra trẻ tuổi ấy dường như đã chọn riêng ngài làm ma cà rồng có thế lực nhất nước Ý (dù ngài ngờ rằng hắn nói câu đó với mọi lãnh chúa ma cà rồng hắn gặp) và muốn bàn về một thỏa ước có thể đôi bên cùng có lợi.\nHắn sẵn lòng rời khỏi nước Ý cùng đạo quân của mình, không gây thêm phiền nhiễu nào cho vùng đất này, nếu ngài đồng ý cung cấp cho hắn tài nguyên và ngân khoản để hắn khởi sự con đường quyền lực của mình ở một nơi khác. Để làm ngọt thêm thỏa thuận, hắn thậm chí còn hiến vài mối liên hệ Visconti của mình nhằm giúp ngài lan tỏa ảnh hưởng trong vùng nếu ngài chấp thuận. "
 PODadventurers.0005.a: "Thỏa thuận đã xong, gã Milano."
 PODadventurers.0005.b: "Kẻ mới nổi hỗn xược! Cút khỏi mắt ta!"
 PODadventurers.0003.b.tt: "[buildings|E] tại [barony|E] [GetTitleByKey('c_como').GetNameNoTier] sẽ bị phá hủy."
 PODadventurers.0003.a.tt: "[buildings|E] tại các [baronies|E] [GetTitleByKey('c_lombardia').GetNameNoTier], [GetTitleByKey('c_brescia').GetNameNoTier] và [GetTitleByKey('c_como').GetNameNoTier] sẽ bị phá hủy."
 
 PODadventurers.1001.desc: "Những báo cáo gần đây từ mật vụ của ngài mang tới tin tức về Giangaleazzo. Gã ma cà rồng trẻ tuổi này dường như ôm tham vọng ngất trời và đã tụ tập binh mã khắp miền bắc nước Ý vì một mục đích chưa rõ, lừa gạt những lãnh chúa cả tin dù phàm hay bất tử để họ chu cấp thêm cho đạo quân đang lớn mạnh của hắn. Cho tới nay, hắn tỏ ra quá khôn ngoan và khó nắm bắt để bị tóm, mà chính điều đó mới thật đáng lo..."
 PODadventurers.1001.a: "Ta có linh cảm chẳng lành về chuyện này..."
 PODadventurers.1001.player_warning: "Hãy chuẩn bị sẵn sàng, ngài sẽ sớm nghe thêm về hắn."
 PODadventurers.1002.t: "Prince: Giangaleazzo"
 PODadventurers.1002.desc: "#italic ‘Ta không phải kẻ sống bằng đam mê. Đúng, ta xem Milan là quyền thừa kế của mình, bởi ta từng là công tước nơi ấy từ rất lâu về trước, và cũng đúng, nước Ý sẽ mãi giữ một chỗ đặc biệt trong trái tim lạnh giá của ta. Nhưng liệu Caesar có dừng tham vọng của mình lại ở một thành phố chăng? Thậm chí ở một quốc gia chăng? Ta không chinh phạt đất đai và tước vị vì một mục đích cao cả nào, cũng chẳng vì thú vui của nó. Hoàn toàn không. Chẳng có tôn giáo nào, chẳng có triết lý nào và chẳng có cảm xúc nào cả, chỉ có Ván Cờ mà thôi. Qua mặt đối thủ, ngắm nhìn kế hoạch của hắn sụp đổ trước cả khi hắn kịp biết tên ngươi, ép hắn phản bội mọi thứ hắn trân quý… Đó mới là toàn bộ ý nghĩa của sự tồn tại của chúng ta. Hãy nhớ, luôn có kẻ chơi giỏi hơn ngươi. Một kẻ để ngươi dõi theo, học hỏi, rồi nghiền nát. Và trên đỉnh Kim Tự Tháp ư..? Chà, ta sẽ gặp ngươi ở đó, miễn là ngươi sống đủ lâu.’ #!\nSau một quá trình thu thập tin tức và ảnh hưởng hết sức tỉ mỉ, Giangaleazzo đã gom góp được một đạo quân đáng kể gồm vài mối liên hệ Condottieri cũ của hắn cùng những ma cà rồng trẻ đầy bất mãn. Hắn đã tiến được một bước trong chiến dịch chinh phục Bắc Ý của mình."
 PODadventurers.1002.a: "Đã đến lúc dạy cho gã Visconti ngạo mạn này chút khiêm nhường!"
 PODadventurers.1002.a.target.tt: "Ngài sẽ xử lý hắn khi thời cơ tới"
 PODadventurers.1002.a.not_target.tt: "Lãnh chúa của ngài giờ đang giao chiến với Giangaleazzo"
 PODadventurers.1002.b: "Ta muốn kẻ này về phe mình, bằng mọi giá!"
 PODadventurers.1002.b.custom: "Ngài sẽ thu phục gã Visconti đầy tham vọng làm chư hầu. Việc ấy sẽ tốn của ngài rất nhiều mới thành, mà hắn cũng chỉ biết ơn được một thời gian..." 
 POD_giangaleazzo.notification: "Prince ra tay"
 POD_giangaleazzo.desc: "Tại nước Ý, Giangaleazzo Visconti, một Lasombra đầy tham vọng, đã phát động chiến dịch chinh phạt. Liệu hắn có làm rung chuyển trung tâm cũ của Đế Chế?"
 PODadventurers.1011.t: "Sóng Gió Phía Trước"
 PODadventurers.1011.desc: "Cuộc nổi dậy của Wat Tyler đang bùng cháy khắp nước Anh, và hắn đã bắt đầu tác động tới cả thế giới $pod_cainite$. Tin đồn về một môn đồ trong số các ma cà rồng do hắn tạo ra ngày một lan rộng, kẻ môn đồ ấy quyết tâm khơi mào một cuộc nổi dậy thuộc loại... về đêm hơn." 
 PODadventurers.1011.a: "Ta có linh cảm chẳng lành về chuyện này..."
 PODadventurers.1011.player_warning: "Hãy chuẩn bị sẵn sàng, ngài sẽ sớm nghe thêm về chuyện này."
 PODadventurers.1012.t: "Kẻ Phản Loạn: Tyler"
 PODadventurers.1012.desc: "Cuộc nổi dậy của Wat Tyler vốn chỉ là chuyện phiền toái với $pod_cainites$ nước Anh, nhưng xem chừng những gợn sóng nó tạo ra chỉ mới bắt đầu. Một Brujah trẻ, Patricia xứ Bollingbroke, đã lấy tên của kẻ phản loạn ấy và bắt đầu kích động những $pod_cainites$ trẻ vỡ mộng cùng đám hạ lưu khác. Người đàn bà rực lửa ấy dường như quyết chí chấm dứt lũ bạo chúa, dù chúng là phàm nhân hay không. Khi ả đã chiếm được thành phố đầu tiên, và mỗi đêm trôi qua lại thêm nhiều kẻ về dưới trướng ả, các lãnh chúa nước Anh phải chọn cách đối phó với ả. Sẽ là bàn tay bọc nhung hay nắm đấm sắt đây?"
 PODadventurers.1012.a: "Lại một kẻ phản loạn nữa, lại một thất bại đã định sẵn sắp bị nghiền nát"
 PODadventurers.1012.a.target.tt: "Ngài sẽ xử lý ả khi thời cơ tới"
 PODadventurers.1012.a.not_target.tt: "Lãnh chúa của ngài giờ đang giao chiến với Tyler"
 PODadventurers.1012.b: "Chà.. ả cũng có vài lý lẽ hay... và một đạo quân lớn"
 PODadventurers.1012.b.custom: "Tyler chỉ chịu quỳ gối nếu ngài gia nhập chính nghĩa của ả. Một đề nghị hết sức sỉ nhục, hẳn rồi, nhưng ngài cũng sẽ có được một đồng minh hùng mạnh." 
 PODadventurers.1012.c: "Chúng ta cùng một phe!"
 POD_tyler.notification: "Kẻ Phản Loạn ra tay"
 POD_tyler.desc: "Tại nước Anh, Patricia xứ Bollingbroke đứng lên chống lại lũ bạo chúa trong một nỗ lực giành tự do hẳn là vô vọng... hay đó là tia lửa thật sự đầu tiên của một cuộc cách mạng vĩ đại?"
 PODadventurers.1021.t: "Sóng Gió Phía Trước"
 PODadventurers.1021.desc: "Tin đồn đã tới tai ngài rằng Vlad Tepes, vị lãnh chúa vốn đã lừng danh của Wallachia, đã dò hỏi về thế giới $pod_cainite$. Bằng cách nào đó, hắn đã biết được sự tồn tại của giống loài ngài và tỏ ra hứng thú với nó." 
 PODadventurers.1021.a: "Ta có linh cảm chẳng lành về chuyện này..."
 PODadventurers.1021.player_warning: "Hãy chuẩn bị sẵn sàng, ngài sẽ sớm nghe thêm về chuyện này."
 PODadventurers.1022.t: "Kẻ Xiên Cọc: Vlad Tepes"
 PODadventurers.1022.desc: "Vị lãnh chúa phàm nhân của Wallachia, Vlad Tepes Draculesti, đã hết lần này tới lần khác chứng tỏ mình được ban cho một ý chí bất khuất. Hắn từ chối được trao truyền trừ phi theo đúng điều kiện của riêng mình, và hắn hiểu về thân phận Ma cà rồng nhiều hơn khối kẻ cổ xưa ngay từ trước khi hóa thành một kẻ trong bọn. Những năm đầu của cuộc đời bất tử của hắn rực cháy bởi tin đồn. Ai là [Glossary('Sire','game_concept_Sire_desc')] của hắn? Hắn có thật đã tìm ra Thánh Đường Thịt Da mà vẫn vẹn nguyên? Lòng trung thành của hắn ngả về đâu? Những câu hỏi ấy vẫn chưa có lời đáp, nhưng kẻ tự xưng là Dracula xem chừng đã chán cảnh lang bạt. Gã Tzimisce ấy, dẫu chỉ là một kẻ non trẻ, đã tập hợp được một đám ma cà rồng, Bộc huyết và binh sĩ từ thời còn làm người đông đảo đến kinh ngạc, rồi hoàn tất cuộc chinh phạt đầu tiên của mình. Nay hắn đến trước mặt ngài với một đề nghị: hãy thừa nhận hắn là kẻ được ngài bảo trợ, và hai bên có thể khởi đầu một mối quan hệ đôi bên cùng có lợi. Từ chối thì... chà, mối đe dọa mà một kẻ như thế đặt ra chẳng cần phải giải thích."
 PODadventurers.1022.a: "Kẻ mới nổi thì vẫn là kẻ mới nổi, dù có biệt danh hoa mỹ đến đâu"
 PODadventurers.1022.a.target.tt: "Ngài sẽ xử lý hắn khi thời cơ tới"
 PODadventurers.1022.a.not_target.tt: "Lãnh chúa của ngài giờ đang giao chiến với Dracula"
 PODadventurers.1022.b: "Một đề nghị ta không thể chối từ"
 PODadventurers.1022.b.custom: "Dẫu sẽ tốn kém khi phải thừa nhận mối đe dọa từ một kẻ non trẻ đến vậy, có được Dracula lừng danh làm hậu duệ nhận nuôi vẫn là một đề nghị đầy cám dỗ. Ít nhất, việc đó hẳn sẽ mua cho ngài chút thời gian trước khi hắn trở mặt với ngài..." 
 POD_vlad.notification: "Kẻ Xiên Cọc ra tay"
 POD_vlad.desc: "Tại Transylvania, Vlad Tepes tiếp tục sự nghiệp đẫm máu của mình, lần này với thân phận một kẻ bất tử. Một Chúa Tể Bóng Đêm mới cho vùng đất bên kia rừng thẳm chăng?"
 first_giangaleazzo_event_troops: "Condottieri của Giangaleazzo"
 first_tyler_event_troops: "Quân Phản Loạn của Tyler"
 first_vlad_event_troops: "Quân Xiên Cọc của Vlad"
 
 
