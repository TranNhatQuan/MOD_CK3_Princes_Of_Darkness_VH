l_english:
 pod1230objectives_mummy.1.t: "Kết Liễu Con Rắn"
 pod1230objectives_mummy.1.desc: "Cuộc chiến vĩnh cửu giữa Horus và Set chẳng qua chỉ là sự tiếp nối cuộc chiến giữa Osiris và Set, mà bản thân nó cũng chỉ là một biểu hiện của Cân Bằng chống lại Hỗn Loạn. Đó là trận chiến nền tảng vì chính thực tại này, và buồn thay, chúng ta đã ở bên phía thất thế suốt một thời gian dài đằng đẵng.\nTrong khi Set và $glossary_wyrm_apophis$, ít nhất là cho tới nay, còn ngoài tầm với của chúng ta, thì bọn tôi tớ của chúng thì không. Nỗ lực mới nhằm giành lấy chiến thắng của chúng ta lần này khởi đầu không phải từ cái đầu con rắn, mà từ thân mình nó.\n\nVà nó đang cho thấy những kết quả đầy hứa hẹn."
 pod1230objectives_mummy.1.a: "Một chiến thắng quyết định."

 pod1230objectives_mummy.2.t: "Vùng Đất của Đức Tin"
 pod1230objectives_mummy.2.desc: "Ai Cập là quê nhà của chúng ta và là vùng đất nơi chúng ta mạnh mẽ nhất, nhờ vào nguồn năng lượng vĩ đại, Sekhem, mà chúng ta có thể rút ra từ chính mảnh đất ấy. Tuy nhiên, qua các thời đại, bản thân Ai Cập đã đổi thay, ảnh hưởng của nó lan ra một vùng rộng lớn và Sekhem cũng lan theo. Điều này cho chúng ta cơ hội khai thác nguồn sức mạnh ấy ở xa quê nhà truyền thống của mình.\nGiành được quyền kiểm soát toàn bộ vùng đất được ban phước bởi quyền năng siêu nhiên của Ai Cập sẽ cho phép chúng ta biểu lộ những quyền năng chưa từng thấy kể từ thời của các vị Thần, và hy vọng sẽ cho chúng ta lợi thế then chốt trong những trận chiến sắp tới."
 pod1230objectives_mummy.2.a: "Đạt được điều bất khả?"

 pod1230objectives_mummy.3.t: "Kẻ Thù Chính: $glossary_wyrm_apophis$"
 pod1230objectives_mummy.3.desc: "$glossary_wyrm_apophis$, Con Rắn, luôn là kẻ thù căn cốt nhất của chúng ta. Hắn chính là tinh túy của hỗn loạn và là nhân tố của sự mất cân bằng. Set, xét về nhiều mặt, xưa nay cũng chỉ là thuộc hạ của hắn, dù tự nguyện hay không. Chống lại một thực thể nguyên sơ đến thế luôn nằm ngoài tầm với của chúng ta, và Apophis đã dùng sự bất khả xâm phạm ấy để từ từ làm băng hoại sự cân bằng, thứ mà chúng ta gọi là Ma'at, rồi đẩy thế gian về phía hư vô.\nTuy nhiên, khi gần đây chúng ta thắng hết trận này tới trận khác trước bọn thuộc hạ của hắn, chúng ta thấy quyền khống chế của Apophis suy giảm ngày một nhiều, cho tới khi tất cả chúng ta nhận được thông điệp đầu tiên từ Osiris kể từ khi Người rời đi tới Amenti: "Hãy chấm dứt chuyện này".\n\nVà chúng ta đã làm vậy.\n\nĐược trang bị nguồn Sekhem gần như vô tận, chúng ta theo chân Anubis vào góc tối tăm nhất của Hư Vô rồi giáng đòn vào Con Rắn. Nhiều kẻ trong chúng ta đã ngã xuống, nhưng quyền năng của Osiris bảo đảm rằng họ quay lại hết lần này tới lần khác. Có kẻ còn nói rằng chính Isis đã hiện ra vào phút chót để xiềng xích Apophis vĩnh viễn.\n\nDù sự thật ra sao, Apophis không còn là mối đe dọa nữa, và thế gian giờ đây sẽ từ từ tiến về phía chính đạo và cân bằng như lẽ ra nó vẫn luôn phải thế.\nCòn chúng ta sẽ trông chừng nó, như chúng ta vẫn luôn làm."
 pod1230objectives_mummy.3.a: "Khải hoàn cuối cùng của chúng ta."

 pod1230objectives_mummy.4.t: "Giữ Yên Cội Rễ"
 pod1230objectives_mummy.4.desc: "Chúng ta khởi nguồn từ Ai Cập Cổ Đại, vùng đất của các vị Thần và các Pharaoh; chính sự tồn tại của chúng ta gắn liền với mảnh đất ấy, và ký ức của chúng ta về nó nuôi dưỡng quyền năng của chúng ta. Nhưng thế gian chẳng chờ đợi ai, nó đã đi xa từ lâu, chỉ để lại phế tích và những di vật bị cướp phá của quê nhà chúng ta.\nTrong khi Horus có lẽ đang dồn tâm sức vào cuộc chiến chống Set, việc đánh mất dấu vết nơi mình xuất thân có thể hủy diệt chúng ta chắc chắn hơn bất kỳ tay sai nào của kẻ phản bội. Chính vì thế chúng ta sẽ tiếp tục luôn gắng sức gìn giữ di sản của Ai Cập, dù là bằng cách bảo vệ kho báu của nó hay dạy lại lịch sử và văn hóa của nó cho những thế hệ mới nhất."
 pod1230objectives_mummy.4.a: "Ai Cập chính là bản thể của chúng ta"

 pod1230objectives_mummy.5.t: "Chặt Đầu Đại Bàng"
 pod1230objectives_mummy.5.desc: "Đấng tạo hóa của chúng ta, Set, đã bị mắc kẹt trong cuộc chiến với Horus suốt nhiều thế hệ. Dẫu việc Người không thể tiêu diệt được đối thủ là điều đáng lo, ngươi phải thừa nhận rằng Horus là một kẻ địch xứng tầm. Chủ nhân đích thực của ngươi, $glossary_wyrm_apophis$, dẫu sao cũng đã bảo ngươi như vậy.\nVị Thần đầu đại bàng ấy là quán quân của Ma'at ("sự cân bằng" theo cách hắn hiểu) và là chướng ngại chính trên đường tới chiến thắng của Apophis cùng món quà Hư Vô mà hắn dành cho thế gian này. Với việc "Kẻ Báo Thù" rốt cuộc cũng theo cha mẹ mình vào cái chết thật sự, bánh xe quay nhanh hơn bao giờ hết..."
 pod1230objectives_mummy.5.a: "Tiếng kêu cuối cùng của đại bàng."

 pod1230objectives_mummy.6.t: "Bữa Ăn Cuối Trước Nửa Đêm"
 pod1230objectives_mummy.6.desc: "Cái chết của Horus, dẫu là đòn chí mạng giáng vào "những kẻ bảo vệ sự cân bằng", lại có tác dụng không lường trước là tôi luyện thêm quyết tâm của chúng. Ngay cả những kẻ từng chống lại Horus vì cho rằng hắn quá cuồng tín và ngoan cố nay cũng tập hợp dưới tên hắn (và chính nghĩa của hắn) để cố ngăn ngươi lại.\n\nMà hiển nhiên, chúng chẳng làm nổi.\n\nDù vậy, chúng cũng diễn được một màn ra trò và làm chậm lại chiến thắng tối hậu của hư vô cùng $glossary_wyrm_apophis$ trong một thời gian. Nhưng khi kẻ cuối cùng trong bọn ngã xuống, chính thế gian này cũng gia tốc bước sa vào hồi kết của nó. Apophis đã thắng, và đã tới lúc thực tại khốn khổ này bị xóa bỏ."
 pod1230objectives_mummy.6.a: "Đã tới lúc dự tiệc"

 pod1230objectives_mummy.7.t: "Xoa Dịu Kẻ Báo Thù"
 pod1230objectives_mummy.7.desc: "[GetScriptedCharacterByHistoryID('792593').GetFirstName] xưa nay luôn nói rõ rằng ông ta cho mình là kẻ duy nhất xứng đáng sử dụng Chú Thuật Sự Sống. Bởi vậy, bất kỳ Xác ướp nào không tuân theo luật lệ của ông ta đều nếm trải cái trải nghiệm chẳng dễ chịu gì là bị thêm vào danh sách kẻ thù của ông ta.\nDù vậy, Horus tuy ngoan cố nhưng không phải kẻ khờ. Ông ta biết rằng có những mối đe dọa lớn hơn ngươi nhiều đối với thế gian này. Việc lung lạc vòng thân tín của ông ta và phô bày đủ sức mạnh để khiến ông ta nhận ra rằng săn đuổi ngươi sẽ là một việc tốn kém đã phần nào làm dịu bớt căng thẳng. Ngươi hẳn sẽ chẳng bao giờ làm bạn được với người con của Osiris, nhưng ít nhất ông ta cũng miễn cưỡng chấp nhận để yên cho ngươi lúc này."
 pod1230objectives_mummy.7.a: "Ít ra cũng là một cuộc đình chiến."

 pod1230objectives_mummy.8.t: "Kết Liễu Kẻ Báo Thù"
 pod1230objectives_mummy.8.desc: "[GetScriptedCharacterByHistoryID('792593').GetFirstName] xưa nay luôn nói rõ rằng ông ta cho mình là kẻ duy nhất xứng đáng sử dụng Chú Thuật Sự Sống. Bởi vậy, bất kỳ Xác ướp nào không tuân theo luật lệ của ông ta đều nếm trải cái trải nghiệm chẳng dễ chịu gì là bị thêm vào danh sách kẻ thù của ông ta.\nLý lẽ với một thực thể vẫn còn nung nấu báo thù sau bao nhiêu thời đại trôi qua là chuyện vô ích. Xác ướp khó giết nhưng không thật sự bất tử, và ngươi đã hết sức khoái trá khi chứng minh điều đó cho kẻ đã gây cho ngươi bao nỗi khổ suốt các thời đại. Với việc người con của Osiris và Isis rốt cuộc cũng đoàn tụ cùng cha mẹ thần thánh của mình ở thế giới bên kia, ngươi có thể yên tâm và tự vạch ra đường đi cho tương lai của chính mình."
 pod1230objectives_mummy.8.a: "Set hẳn đang cười lớn ngay lúc này."

 pod1230objectives_mummy.9.t: "Mở Rộng Các Nghệ Thuật Theourgia"
 pod1230objectives_mummy.9.desc: "Xác ướp được tạo ra từ Chú Thuật Sự Sống của Ai Cập Cổ Đại, và vì thế tự nhiên bị cuốn hút về phía Hekau, hình thức pháp thuật của Ai Cập Cổ Đại. Ngay cả những kẻ không thuộc nền văn hóa ấy trong kiếp đầu tiên cũng nhanh chóng học được Hekau. Dù vậy, điều này lại là nguồn cơn bực bội cho những Xác ướp khác, như nhóm Cabiri của Hy Lạp Cổ Đại, những kẻ từng sử dụng các hình thức pháp thuật khác với kết quả rực rỡ.\nDẫu những nỗ lực nhằm tái khám phá cách dùng chúng đã vô ích trong một thời gian dài, phương pháp gần đây của ngươi là tập hợp các pháp sư phàm nhân cùng tri thức (cổ xưa hay mới mẻ) của họ đã cho thấy vài kết quả đầy hứa hẹn. Dẫu pháp thuật ngoài Hekau hẳn sẽ chẳng bao giờ dễ dùng với Xác ướp như ngươi mong muốn, ít nhất nó cũng khả thi."
 pod1230objectives_mummy.9.a: "Lại làm học trò một lần nữa."

 pod1230objectives_mummy.10.t: "Củng Cố Hades"
 pod1230objectives_mummy.10.desc: "Khi [GetScriptedCharacterByHistoryID('792600').GetFirstName] lần đầu tạo ra phiên bản Chú Thuật Sự Sống của riêng mình, ông ta vấp phải vấn đề là không thể bước vào Amenti, cõi người chết của Ai Cập Cổ Đại nơi Xác ướp dành thời gian tái tạo bản thân giữa mỗi lần chết. Vì vậy ông ta đã chiếm giữ một phần rất nhỏ của Shadowlands, đặt tên là "Hades", để dùng vào việc tương tự, rồi xoay xở thuyết phục được Charon, thủ lĩnh của Âm Giới, chấp nhận vùng đất biệt lập ấy; có kẻ bảo là nhờ gốc gác Mycenae chung của hai người.\nDù sự thật thế nào, Hades vẫn chỉ là bản sao thảm hại của Amenti và hầu như chẳng giúp được Xác ướp đạt tới sự bất tử thật sự của mình. Tuy nhiên, nhờ những nỗ lực của ngươi, tình hình đã khá lên và các Xác ướp Cabiri giờ có thể tận hưởng một chốn nương náu an toàn hơn trong Âm Giới khi thời khắc ấy tới."
 pod1230objectives_mummy.10.a: "Cánh đồng Elysium của riêng chúng ta."

 pod1230objectives_mummy.11.t: "Từ Hellas Tới Ai Cập"
 pod1230objectives_mummy.11.desc: "Xác ướp được tạo ra ở Ai Cập Cổ Đại và tới nay vẫn rút năng lượng, thứ mà họ gọi là Sekhem, từ vùng đất ấy. Xác ướp Cabiri, vốn thuộc một nhánh phái sinh được tạo ra theo lối của vị sáng lập người Mycenae của họ, lại không có được đặc ân đó. Điều này xưa nay luôn đặt họ vào thế bất lợi, bởi Sekhem có thể được các Xác ướp lão luyện dùng vào những mục đích cực kỳ mạnh mẽ.\nVì số lượng ít ỏi và bị các giống loài siêu nhiên khác săn lùng, nhóm Cabiri chưa bao giờ có đủ thời gian nghiên cứu thấu đáo vấn đề này và tìm ra cách khắc phục. Điều đó đã thay đổi nhờ công trình gần đây của ngươi về việc tương tác với và rút lấy Sekhem từ chính cội nguồn của nó, rồi phỏng theo cho phù hợp với nền tảng Mycenae của riêng ngươi. Với thành công này, rốt cuộc ngươi đã bắc được nhịp cầu giữa mình và các môn đồ cổ xưa của Horus."
 pod1230objectives_mummy.11.a: "Hy Lạp và Ai Cập lại hòa làm một."

 pod1230objectives_mummy.12.t: "Bảo Vệ Tri Thức"
 pod1230objectives_mummy.12.desc: "Wu T'ian là những kẻ biệt lập và chỉ nghĩ cho mình, nhưng ngay cả họ cũng biết rằng sự bất tử của mình đặt lên vai họ một trách nhiệm lớn lao trước Kỷ Nguyên Thứ Sáu đang tới. Dẫu chiến thắng của [Glossary('Demon Emperor','podgloss.demonemperor')] không thể bị ngăn chặn vĩnh viễn, nó rốt cuộc cũng chỉ là một kỷ nguyên giữa vô vàn kỷ nguyên khác. Bởi vậy, họ cảm thấy như thể bổn phận của mình là bảo vệ những thành quả của các kỷ nguyên trước khi quá muộn.\nTri thức dưới mọi hình thức là một phần quan trọng của nỗ lực ấy. [Glossary('Demon Emperor','podgloss.demonemperor')] sẽ mở ra một kỷ nguyên của vô minh và có thể đẩy nhân loại lùi về buổi khởi đầu hoang dã của mình. Chỉ bằng cách bảo đảm rằng minh triết của các thời đại đã qua không bị mất đi thì điều đó mới có thể được ngăn lại."
 pod1230objectives_mummy.12.a: "Chúng ta học, vì thế chúng ta tồn tại."

 pod1230objectives_mummy.13.t: "Bảo Vệ Con Người"
 pod1230objectives_mummy.13.desc: "Wu T'ian là những kẻ biệt lập và chỉ nghĩ cho mình, nhưng ngay cả họ cũng biết rằng sự bất tử của mình đặt lên vai họ một trách nhiệm lớn lao trước Kỷ Nguyên Thứ Sáu đang tới. Dẫu chiến thắng của [Glossary('Demon Emperor','podgloss.demonemperor')] không thể bị ngăn chặn vĩnh viễn, nó rốt cuộc cũng chỉ là một kỷ nguyên giữa vô vàn kỷ nguyên khác. Bởi vậy, họ cảm thấy như thể bổn phận của mình là bảo vệ những thành quả của các kỷ nguyên trước khi quá muộn.\n[Glossary('Demon Emperor','podgloss.demonemperor')] sẽ làm băng hoại nhân loại khi họ bước lên ngai vàng. Nếu họ làm đen tối được trái tim của toàn thể nhân loại, mọi hy vọng cho những kỷ nguyên sau sẽ tiêu tan. Là những bậc thầy bất tử và giác ngộ, Wu T'ian phải chuẩn bị sẵn những chốn nương náu an toàn để nhân loại không hoàn toàn lạc lối trong thời kỳ đen tối sắp tới."
 pod1230objectives_mummy.13.a: "Là một cộng đồng, chúng ta được an toàn."

 pod1230objectives_mummy.14.t: "Bảo Vệ Shen"
 pod1230objectives_mummy.14.desc: "Wu T'ian là những kẻ biệt lập và chỉ nghĩ cho mình, nhưng ngay cả họ cũng biết rằng sự bất tử của mình đặt lên vai họ một trách nhiệm lớn lao trước Kỷ Nguyên Thứ Sáu đang tới. Dẫu chiến thắng của [Glossary('Demon Emperor','podgloss.demonemperor')] không thể bị ngăn chặn vĩnh viễn, nó rốt cuộc cũng chỉ là một kỷ nguyên giữa vô vàn kỷ nguyên khác. Bởi vậy, họ cảm thấy như thể bổn phận của mình là bảo vệ những thành quả của các kỷ nguyên trước khi quá muộn.\nNhững sinh vật siêu nhiên khác sẽ chiến đấu dũng cảm để cản trở hay làm chậm bước [Glossary('Demon Emperor','podgloss.demonemperor')]. Dẫu chúng sẽ không thành công, điều tối quan trọng với Wu T'ian là bảo đảm những kẻ đức hạnh trong số đó không ngã xuống. Việc phân tán sự chú ý của [Glossary('Demon Emperor','podgloss.demonemperor')] sẽ bảo đảm rằng họ không thể ngăn Bánh Xe tiến tới kỷ nguyên kế tiếp sau khi họ lên ngôi."
 pod1230objectives_mummy.14.a: "Những anh hùng cho một kỷ nguyên đã định sẵn diệt vong."

 pod1230objectives_mummy.15.t: "Bảo Vệ Trung Nguyên"
 pod1230objectives_mummy.15.desc: "Ngươi đã làm hết những gì có thể. Có lẽ còn hơn cả điều mà phần lớn kẻ khác nghĩ là khả dĩ. Những nỗ lực của ngươi sẽ bảo đảm rằng [Glossary('Demon Emperor','podgloss.demonemperor')] sẽ không sớm chạm tới ngai vàng của họ, và rằng triều đại của họ sẽ không diễn ra mà chẳng gặp kháng cự.\nDẫu vậy, ngươi vẫn ngờ rằng thế là chưa đủ, và trong khoảnh khắc hoài nghi ấy, ngươi nhận ra rằng chỗ đứng của mình giữa Bát Tiên là điều có thể đạt được, không phải như một phần thưởng như ngươi từng nghĩ, mà như một bổn phận phải làm nhiều hơn nữa.\nNếu ngươi muốn, chiến trường kế tiếp của ngươi chống lại các thế lực tà ác sẽ là chiến trường của những thực tại vũ trụ."
 pod1230objectives_mummy.15.a: "Nơi này vẫn còn cần ta."
 pod1230objectives_mummy.15.b: "Cuộc chiến tiếp diễn ở nơi khác."

 pod1230objectives_mummy.16.t: "Đạt Tới Ra Hekau"
 pod1230objectives_mummy.16.desc: "Các Shemsu-Heru xưa gọi Ra-Hekau là nghệ thuật tối thượng của Hekau, sự làm chủ thế gian bằng cách dùng [Glossary('True Names','podgloss.truename')] của vạn vật để uốn chúng theo ý mình. Theo truyền thuyết Ai Cập, Ra-Hekau lần đầu được hé lộ khi Thần Mặt Trời Ra trao cho Isis [Glossary('True Name','podgloss.truename')] của Người để nàng có thể chữa lành cho Người khỏi một liều độc chí mạng. Điều đó cho phép nàng trở thành Nữ Thần Pháp Thuật và tạo nên Chú Thuật Sự Sống.\nBuồn thay, họ sớm nhận ra rằng Chú Thuật Sự Sống có khiếm khuyết, và rằng họ đã đánh mất tia lửa nhân tính vốn cho phép dạng ma thuật đích thực này sau lần chết đầu tiên. Việc cố tái khám phá tri thức đã thất truyền ấy, hoặc tìm cách hoàn thiện Chú Thuật Sự Sống để trở về với Thời Hoàng Kim của quyền năng Xác ướp, từ lâu đã là mối bận tâm rõ rệt của một số kẻ trong bọn họ.\nDẫu việc làm chủ được chính Ra-Hekau hẳn vẫn nằm ngoài tầm tay họ, việc thử nghiệm và cải thiện những gì họ đã biết vẫn mang lại lợi ích tăng dần cho hình hài hiện tại của họ."
 pod1230objectives_mummy.16.a: "Gần hơn với vinh quang xưa của chúng ta."
