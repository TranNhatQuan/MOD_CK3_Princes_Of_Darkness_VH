l_english:

 POD_hazimel_wisdom.001.t: "Truy Cầu Trí Tuệ"
 POD_hazimel_wisdom.001.desc: "Hazimel vĩ đại đã trả giá cho trí tuệ của mình: con mắt của ông ta. Tấm gương ấy tới đêm nay vẫn được một số người Ravnos noi theo, bởi không ai đạt tới sự vĩ đại mà không có hy sinh.\nKhông phải Huyết Tộc nào cũng sẵn lòng hiến một phần thân xác bất tử của mình để đổi lấy tri thức. Ngươi, khác với những kẻ khác, đã sẵn sàng làm điều đó. Chỉ kẻ can trường mới có thể đạt tới trí tuệ vĩnh hằng, nhưng ngươi có đủ mạnh mẽ để hy sinh một điều không thể lấy lại hay không?"
 POD_hazimel_wisdom.001.option.a: "Ta sẽ noi gương Hazimel. Một con mắt đổi lấy tri thức"
 POD_hazimel_wisdom.001.option.a.tt: "Ngươi sẽ mất một con mắt, và sẽ không thể chữa lành nó"
 POD_hazimel_wisdom.001.option.b: "Cái chân của ta sao sánh được với tri thức ta sẽ có!"
 POD_hazimel_wisdom.001.option.b.tt: "Ngươi sẽ mất một chân, và sẽ không thể chữa lành nó"
 POD_hazimel_wisdom.001.option.c: "Ta... Ta chưa sẵn sàng"
 POD_hazimel_wisdom.001.option.c.tt: "Ngươi sẽ từ bỏ cuộc truy cầu trí tuệ của mình"