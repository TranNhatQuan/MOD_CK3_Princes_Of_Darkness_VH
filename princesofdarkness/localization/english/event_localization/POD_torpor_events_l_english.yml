l_english:

 POD_vampire_torpor_events.001.title: "Giấc Ngủ Sâu"
 POD_vampire_torpor_events.001.desc: "Vết thương đã khiến ngươi suy nhược, giờ ngươi cảm thấy một tiếng gọi kỳ lạ dấy lên từ bên trong, tiếng gọi ép ngươi bước vào $pod_torpor$, giấc ngủ sâu có thể kéo dài hàng ngàn năm."
 
 POD_vampire_torpor_events.001.resist: "Ta sẽ chống lại!"
 POD_vampire_torpor_events.001.resist.fight: "Ngươi sẽ cố chống lại việc chìm vào $pod_torpor$. Vết thương và mức độ đói khát của ngươi sẽ ảnh hưởng tới quyết định này."
 POD_vampire_torpor_events.001.surrender: "Ta sẽ không chống lại..."
 POD_vampire_torpor_events.001.surrender.surrender: "Ngươi sẽ tự nguyện bước vào $pod_torpor$. Điều này buộc ngươi phải thoái vị."
 POD_vampire_torpor_events.101.title: "Giấc ngủ vĩnh hằng"
 POD_vampire_torpor_events.101.desc: "Ngươi chẳng còn sức lực nào để tiếp tục kiếp bất tử với những vết thương thế này, đã đến lúc an nghỉ. Ngươi chỉ mong sẽ không có chuyện gì xảy đến với mình trong lúc còn ở trong $pod_torpor$."
 POD_vampire_torpor_events.101.defeat: "Giấc ngủ vĩnh hằng đang chờ."
 POD_vampire_torpor_events.101.defeat.sleep: "Ngươi sẽ bước vào $pod_torpor$, thoái vị nhường lại cho người thừa kế"
 POD_vampire_torpor_events.201.title: "Chống Lại $pod_torpor$"
 POD_vampire_torpor_events.201.desc: "Ngươi đã chống lại được. Cảm giác suy nhược kỳ lạ ấy đã tan biến và ngươi vẫn còn nhiều việc phải làm trước khi an nghỉ."
 POD_vampire_torpor_events.201.success: "Việc của ta nơi đây chưa xong."
 POD_vampire_torpor_events.201.success.victory: "Ngươi sẽ chưa bước vào $pod_torpor$."
 
 POD_vampire_torpor_events.002.title: "Kiếp Bất Tử Vĩnh Hằng"
 POD_vampire_torpor_events.002.desc: "Kiếp bất tử của ngươi đã kéo dài hàng trăm năm, ngươi bắt đầu thấy chán ngán thời đại này, có lẽ đã đến lúc an nghỉ chăng? Kiếp bất tử của ma cà rồng là một chuỗi dài đằng đẵng của khổ đau, nơi bằng hữu đến rồi đi và phàm nhân đổi thay nhanh tới mức chẳng mấy chốc đã hóa xa lạ với ngươi.\nCó lẽ thời đại sau sẽ khá hơn... mà cũng có lẽ không."
 
 POD_vampire_torpor_events.002.resist: "Ta vẫn còn việc phải làm."
 POD_vampire_torpor_events.002.resist.nosleep: "Ngươi chưa sẵn sàng an nghỉ."
 POD_vampire_torpor_events.002.rest: "Ta nghĩ đã đến lúc an nghỉ."
 POD_vampire_torpor_events.002.rest.sleep: "Ngươi sẽ tự nguyện bước vào $pod_torpor$. Điều này buộc ngươi phải thoái vị."
 POD_vampire_torpor_events.102.title: "Chưa phải lúc an nghỉ"
 POD_vampire_torpor_events.102.desc: "Ngươi chưa sẵn sàng bước vào $pod_torpor$, còn nhiều phàm nhân cần tới sự chăm chút của ngươi, và kẻ thù của ngươi còn phải run sợ thêm ít lâu nữa."
 POD_vampire_torpor_events.102.resist: "Ta vẫn còn việc phải lo."
 POD_vampire_torpor_events.102.resist.nosleep: "Ngươi sẽ chưa bước vào $pod_torpor$... vội."
 POD_vampire_torpor_events.202.desc: "Ngươi đã thức quá lâu rồi... Đã đến lúc an nghỉ, kẻ thù có thể chờ được. Có lẽ thời đại sau sẽ là thời hoàng kim đã hứa... hoặc là Gehenna đáng sợ. Nhưng ngươi đủ già đời để biết rằng nó nhiều phần sẽ chỉ là thêm một thời đại buồn tẻ, dài lê thê với đám phàm nhân làm hỏng mọi thứ..."
 POD_vampire_torpor_events.202.title: "Giấc ngủ vĩnh hằng"
 POD_vampire_torpor_events.202.accept: "$pod_torpor$ đang chờ."
 POD_vampire_torpor_events.202.accept.sleep: "Ngươi sẽ tự nguyện bước vào $pod_torpor$."
 
 POD_vampire_torpor_events.003.title: "Tỉnh Giấc"
 POD_vampire_torpor_events.003.desc: "Ngươi đã ở trong $pod_torpor$ một thời gian rồi. Chẳng phải đã đến lúc trở lại kiếp bất tử của mình sao?"
 POD_vampire_torpor_events.003.awake: "Đã đến lúc trở lại."
 POD_vampire_torpor_events.003.awake.torpor: "Ngươi sẽ tỉnh dậy khỏi $pod_torpor$, và kẻ thù của ngươi nên biết sợ."
 POD_vampire_torpor_events.003.sleep: "Ta chưa sẵn sàng."
 POD_vampire_torpor_events.003.sleep.nowake: "Ngươi sẽ ở lại trong $pod_torpor$ thêm một thời gian nữa."
 POD_vampire_torpor_events.103.title: "Giấc ngủ vĩnh hằng"
 POD_vampire_torpor_events.103.desc: "Ngươi chưa sẵn sàng trở lại."
 POD_vampire_torpor_events.103.sleep: "Chúc ngủ ngon."
 POD_vampire_torpor_events.103.sleep.continue: "Ngươi sẽ ngủ tiếp."
 POD_vampire_torpor_events.203.title: "Trở Lại Kiếp Bất Tử"
 POD_vampire_torpor_events.203.desc: "Cuối cùng ngươi đã sẵn sàng trở lại, kẻ thù của ngươi phải run sợ"
 POD_vampire_torpor_events.203.awake: "Ta đã trở lại"
 POD_vampire_torpor_events.203.awake.torpor: "Ngươi đang trở lại thế giới bóng tối"