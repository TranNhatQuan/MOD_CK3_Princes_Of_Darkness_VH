l_english:
 podshih.100.t: "Lời Thỉnh Cầu Hòa Hoãn"
 podshih.100.desc: "[shih.GetFirstName] muốn thỏa thuận đình chiến với ngươi. Đây là lệ thường trong đám [GetTrait('shih').GetName( GetPlayer )] lang bạt, bởi họ thường cần thời gian để kéo P'o trong mình ra khỏi sự thù địch và hung hãn triền miên mà công việc đẫm máu của họ đòi hỏi."
 podshih.100.a: "Ta đồng ý."
 podshih.100.b: "Ta sẽ không chấp nhận điều này."

 podshih.1010.t: "Thiên Quân và Tòa Dị Giáo"
 podshih.1010.desc: "Sau cuộc cải tổ Thiên Quân kéo dài hàng trăm năm mới thành, cơ hội cho một cuộc chiến toàn diện chống lại shen đã hiện ra.\nỞ phương Tây, Tòa Dị Giáo Bóng Tối của Giáo hội Công giáo đã bắt đầu thanh trừng ngay trên đất của mình, cho ngươi khả năng đẩy mạnh các đợt tấn công của chính ngươi. Đã đến lúc kết thúc chuyện này."
 podshih.1010.a: "Ta sẽ tham gia."

 POD_shih_events.0001.t: "Biết Địch Biết Ta"
 POD_shih_events.0001.desc: "Người sáng lập Shih, sư phụ Wan Kung Yi, đã chạm trán vô số sinh vật kỳ lạ trong những chuyến đi của mình. Có kẻ thân thiện, có kẻ không, và có kẻ nay đã tuyệt diệt hoàn toàn. Dẫu vậy, ông biết rằng bất cứ sinh vật nào trong số đó cũng có thể bị cái ác quyến rũ, và vì thế cần tới sự can thiệp của ông.\nNoi theo tấm gương ấy, người Shih học cách hoàn thiện bản thân trên nhiều kỹ năng khác nhau, sẵn sàng đối phó với bất kỳ hiểm họa bất ngờ nào họ có thể gặp phải." 
 POD_shih_events.0001.a: "Rèn luyện chuyên về [diplomacy|E]."
 POD_shih_events.0001.b: "Rèn luyện chuyên về [martial|E]."
 POD_shih_events.0001.c: "Rèn luyện chuyên về [stewardship|E]."
 POD_shih_events.0001.d: "Rèn luyện chuyên về [intrigue|E]."
 POD_shih_events.0001.e: "Rèn luyện chuyên về [learning|E]."
 POD_shih_events.0001.f: "Ta đã đổi ý."

 POD_shih_events.0002.t: "Tâm Thắng Thân"
 POD_shih_events.0002.desc: "Người Shih không chắc Qiao là do người sáng lập của họ, sư phụ Wan Kung Yi, sáng tạo ra, hay là thứ ông được các sinh vật siêu nhiên thân thiện truyền dạy. Dù thế nào đi nữa, nó đã chứng tỏ hết lần này tới lần khác là tài sản quý nhất của họ, sánh ngang và đôi khi vượt cả những quyền năng đáng sợ của giới siêu nhiên. Về cốt lõi, Qiao là việc dẫn dắt Khí bằng sự tập trung mãnh liệt. Vậy nên chẳng có gì lạ khi một phần lớn công phu rèn luyện của Shih dành cho việc tinh thông các thuật này." 
 POD_shih_events.0002.a: "Rèn luyện chuyên về [qiao_lifestyle|E]."
 POD_shih_events.0002.b: "Rèn luyện tinh thần tổng quát."

 POD_shih_events.0003.t: "Sức Người"
 POD_shih_events.0003.desc: "Người sáng lập Shih, sư phụ Wan Kung Yi, thuở đầu chủ yếu chú trọng rèn luyện thể chất cho môn đồ. Có kẻ cho rằng đó là nguyên nhân dẫn tới sự sụp đổ của ông và sự trỗi dậy của Thiên Quân, nhưng ít ai dám phủ nhận rằng đó là công phu tất yếu với bất cứ kẻ muốn săn quỷ nào.\nNgười Shih tuy không xông vào tấn công giới siêu nhiên ngay khi vừa thấy mặt, nhưng họ cũng chẳng dại dột tới mức tin rằng mình sẽ nhận được sự nhã nhặn tương tự từ những kẻ độc ác hơn trong các phe phái ấy." 
 POD_shih_events.0003.a: "Rèn luyện chuyên về [prowess|E]."
 POD_shih_events.0003.b: "Ta đã đổi ý."

 POD_shih_events.0004.t: "Cùng Nhau Thiền Định"
 POD_shih_events.0004.desc: "Dẫu có thể thi triển những quyền năng đáng nể, người Shih xét cho cùng vẫn là phàm nhân. Câu chuyện về người sáng lập của họ, sư phụ Wan Kung Yi, cùng những lời dạy của ông là kim chỉ nam chính, song họ cũng chịu ảnh hưởng từ các nền văn hóa nơi họ sinh sống. Với việc nhiều người hiểu rằng sự sa ngã của Yi bắt nguồn từ chỗ ông không làm chủ được cảm xúc của mình, thiền định đã trở thành phần không thể thiếu trong công phu rèn luyện của Shih."
 POD_shih_events.0004.a: "Ngẫm về chính nghĩa của chúng ta"
 POD_shih_events.0004.b: "Chữa lành tâm trí chúng ta"

 POD_shih_events.0005.t: "Bổn Phận của Shih"
 POD_shih_events.0005.desc: "Dẫu tự coi mình là những kẻ săn quái vật và ác quỷ, người Shih vẫn theo lời răn của người sáng lập rằng ngay cả giới siêu nhiên cũng là một phần của thế gian này. Vì lẽ đó, chỉ những kẻ thực sự độc ác mới đáng bị trừng phạt. Chính điều này tách biệt người Shih khỏi Thiên Quân đã bại vong, và sự chú tâm ấy giúp họ dồn hết nguồn lực vào những kẻ thù thực sự đang giày vò nhân loại." 
 POD_shih_events.0005.a: "Những kẻ mang lại thịnh vượng"
 POD_shih_events.0005.b: "Bảo vệ kẻ vô tội"