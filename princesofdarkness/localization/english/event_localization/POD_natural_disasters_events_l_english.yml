 POD_natural_disasters.0101.t: "[Localize(SCOPE.GetFlagName('disaster_loc'))]"
 POD_natural_disasters.0101.desc_flood: "Phần lớn [target_title.GetNameNoTierNoTooltip] đã bị cuốn trôi."
 POD_natural_disasters.0101.desc_earthquake: "Phần lớn [target_title.GetNameNoTierNoTooltip] đã bị tàn phá bởi động đất."
 POD_natural_disasters.0101.desc_storm: "Một cơn lốc xoáy đã tràn qua [target_title.GetNameNoTierNoTooltip]."
 POD_natural_disasters.0101.desc_great_relief: "Không ai thiệt mạng, và công cuộc tái thiết đang tiến hành suôn sẻ, nhờ một nhà hảo tâm hào phóng."
 POD_natural_disasters.0101.desc_relief: "Phần lớn kẻ phàm nhân đã kịp di tản, và thiệt hại về cơ sở hạ tầng là tối thiểu."
 POD_natural_disasters.0101.desc_stopped: "May mắn thay, thời tiết thuật của ai đó đã ngăn chặn được thảm họa trước khi nó có thể cướp đi bất kỳ mạng sống nào."
 POD_natural_disasters.0101.desc_aggraved: "Đột nhiên, hiểm họa trở nên mạnh mẽ hơn bao giờ hết. Không ai đếm nổi có bao nhiêu người đã thiệt mạng."
 POD_natural_disasters.0101.desc_default: "Rất nhiều người đã thiệt mạng trong thảm họa này."
 POD_natural_disasters.0101.option.a: "Ôi, thiên nhiên."