l_english:
 POD_natural_disasters.0003.t: "Linh Cảm Thời Tiết"
 POD_natural_disasters.0003.desc: "Linh cảm thời tiết của ngươi đã dự báo rằng sẽ có một thảm họa nguy hiểm xảy ra tại [task_contract.MakeScope.Var('target_title').Title.GetName] trong [GetGameTimeDifferenceForDiffDays(GetVarTimeRemaining(task_contract.MakeScope,'time_remaining'))].\n\nNgươi có can thiệp không?"
 POD_natural_disasters.0003.desc.coterie: "Thành viên [coterie_member.GetFirstNameNicknamed] trong [GetPlayer.Custom('PODCoterieNoTooltip')] của ngươi đến báo tin.\n\nLinh cảm thời tiết của [coterie_member.GetHerHis|U] đã dự báo rằng sẽ có một thảm họa nguy hiểm xảy ra tại [task_contract.MakeScope.Var('target_title').Title.GetName] trong [GetGameTimeDifferenceForDiffDays(GetVarTimeRemaining(task_contract.MakeScope,'time_remaining'))].\n\nNgươi có can thiệp không?"

 POD_natural_disasters.0003.tt: "Một #bold [task_contract.GetType.GetName]#! [task_contract|E] đã được tạo tại [task_contract.GetLocation.GetName]"
 
 POD_natural_disasters.0005.t: "Đại Họa Cận Kề"
 POD_natural_disasters.0005.desc: "Ngươi đến [task_contract.GetLocation.GetName].\n\nNếu ngươi không làm gì, [task_contract.MakeScope.Var('disaster_type').GetFlagName|l] sắp xảy đến sẽ gây thiệt hại to lớn cho toàn bộ [task_contract.MakeScope.Var('target_title').Title.GetName].\n\nGiờ phải làm gì đây?"
 POD_natural_disasters.0005.a: "Ta sẽ ngăn chặn [task_contract.MakeScope.Var('disaster_type').GetFlagName|l] bằng thời tiết thuật."
 POD_natural_disasters.0005.b: "Ta sẽ dốc sức để #P cải thiện#! thời tiết thay vào đó!"
 POD_natural_disasters.0005.c: "Ta sẽ làm cho [task_contract.MakeScope.Var('disaster_type').GetFlagName|l] #X;bold còn tồi tệ hơn nữa!#!"
 POD_natural_disasters.0005.d: "Ta sẽ cứu trợ cho những kẻ phàm nhân."
 POD_natural_disasters.0005.e: "Ta sẽ nỗ lực hết mình để #P hỗ trợ#! những kẻ phàm nhân."
 POD_natural_disasters.0005.f: "Ta đã đổi ý."
 
