l_english:
 pod1230objectives_shih.1.t: "Tìm Lại Lối Luyện Tập Wan Kung Yi"
 pod1230objectives_shih.1.desc: "Wan Kung Yi theo truyền thống được coi là Shih đầu tiên. Con người của nhà Thương này đã có một cuộc đời dài và đầy phiêu lưu, khởi đầu bằng lòng thù địch rõ rệt với những kẻ siêu nhiên đang thống trị mặt đất, trước khi hiểu ra rằng chúng cũng có chỗ đứng của mình trong vòng xoay của trật tự tự nhiên.\nYi vì thế đã dành trọn cuộc đời dài của mình để chỉ chiến đấu với những kẻ thực sự đe dọa nhân loại, và nhờ đó học được rất nhiều từ những sinh vật siêu nhiên đồng cảm với ông. Những lời dạy ấy trở thành nền tảng của toàn thể Shih và làm nên sức mạnh đáng gờm mà họ vẫn còn cho tới ngày nay. Trong số nhiều điều khác, Yi đã hệ thống hóa Qiao, trao quyền năng ấy cho những học trò xứng đáng để họ có thể đối đầu với cái ác thực sự trên thế cân bằng."
 pod1230objectives_shih.1.a: "Sư phụ Yi quả là bậc trí giả."

 pod1230objectives_shih.2.t: "Tiếp Nối Di Sản Wan Kung Yi"
 pod1230objectives_shih.2.desc: "Wan Kung Yi không phải người hoàn hảo. Người sáng lập Shih, dẫu có lập trường hòa giải với giới siêu nhiên, đã nổi cơn thịnh nộ khi gia đình ông bị một số kẻ trong đó sát hại. Dùng cây cung rèn từ Cây Trường Sinh, Yi tàn nhẫn thanh trừng những kẻ đã phụ bạc ông trong cơn cuồng nộ và biển máu. Điều này khiến ông mang biệt danh "Thần Tiễn" trong đám siêu nhiên vẫn còn nhớ cuộc tàn sát ấy.\nTuy nhiên người Shih biết rằng Yi đã trả giá đắt cho cơn bùng phát và sự phản bội chính lời dạy của mình. Mỗi mũi tên ông bắn ra trong cơn giận đều lấy đi sinh khí của ông, và khi cuộc thanh trừng kết thúc, chính linh hồn Yi đã bị vấy bẩn. Chẳng bao lâu sau đó ông rời khỏi thế gian này.\nShih khôn ngoan học từ tấm gương ấy và rèn luyện tâm trí ngang bằng với rèn luyện thân thể."
 pod1230objectives_shih.2.a: "Sân hận là kẻ thù."

 pod1230objectives_shih.3.t: "Chính Nghĩa và Minh Triết"
 pod1230objectives_shih.3.desc: "Sau khi Wan Kung Yi, người sáng lập Shih, qua đời, những kẻ săn quỷ nhanh chóng tổ chức lại thành một Thiên Quân hùng mạnh chuyên tận diệt giới siêu nhiên. Họ trở nên ngạo mạn, chèn ép người phàm và giết hại bất cứ ai chống đối. Những Shih khôn ngoan hơn giữ vững lời dạy của Yi và từ chối cúi đầu trước Thiên Quân.\nĐó hóa ra là lựa chọn sáng suốt, bởi trong một hành động chưa từng có, giới siêu nhiên đã liên minh với nhau để hủy diệt hoàn toàn Thiên Quân cùng đại bản doanh của nó ở Côn Lôn.\nNgười Shih, nay là những kẻ cuối cùng sống sót của di sản săn quỷ mà Yi để lại, cảm thấy trật tự tự nhiên đã giáng đòn đáp trả xuống đám anh em lạc lối của mình, rồi họ bước tiếp.\nTuy nhiên khi quyền lực và số môn đồ của ngươi ngày một lớn, một số người cho rằng chính nghĩa của Thiên Quân là đúng đắn, chỉ có phương pháp và kẻ lãnh đạo của nó là sai lầm. Họ thúc giục ngươi khoác lại tấm áo gây chia rẽ ấy và biến nó thành của mình."
 pod1230objectives_shih.3.a: "Xưa là điên rồ, nay vẫn là điên rồ."
 pod1230objectives_shih.3.b: "Thiên Quân tái sinh!"
 pod1230objectives_shih.3.c: "Ta sẽ tự đứng trên đôi chân mình."