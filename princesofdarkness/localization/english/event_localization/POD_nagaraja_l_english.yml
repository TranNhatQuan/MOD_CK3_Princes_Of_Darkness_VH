l_english:
 
 # Nickname
 nick_scourge_of_sutekh: "Tai Ương của Sutekh"

 # Character Interaction
 podnagaraja_send_childe_to_enoch_interaction: "Gửi đến Enoch"
 podnagaraja_send_childe_to_enoch_interaction_desc: "Gửi thành viên gia tộc Nagaraja này trên một hành trình một chiều đến thành phố ma Enoch trong Âm Giới, nơi họ sẽ phụng sự lợi ích của clan chúng ta từ bên kia Shroud."
 send_childe_to_enoch_effect_tooltip: "Hậu duệ của ngài sẽ khởi hành đến Âm Giới, không bao giờ trở lại. Ngài sẽ nhận một hệ số điều chỉnh và uy tín gia tộc."
 send_childe_to_enoch_not_primary_heir: "Không thể gửi người thừa kế chính của ngài đến Enoch"

 # ============================
 # Feature 1 Events
 # ============================

 podnagaraja.1.t: "Thanh Trừng Loài Rắn"
 podnagaraja.1.desc: "Xong rồi. Những kẻ cuối cùng của Daitya và anh em họ Setite của chúng đã bị đuổi khỏi các triều đình Ấn Độ và cao nguyên Tây Tạng. Con cái của Sutekh sẽ không còn thì thầm những lời dối trá vào tai những kẻ cai trị tiểu lục địa nữa. Một kỷ nguyên mới bình minh cho Nagaraja -- một kỷ nguyên nơi chúng ta đứng vững là những chúa tể không thể tranh cãi của màn đêm trên quê hương tổ tiên chúng ta."
 podnagaraja.1.a: "Hãy để họ kể về chiến thắng này trong nhiều thế kỷ tới."

 podnagaraja.2.desc: "Tin tức đã đến tai ngài rằng một kẻ cai trị Nagaraja đã đuổi những ảnh hưởng cuối cùng của Setite và Daitya khỏi Ấn Độ và Tây Tạng. Cán cân quyền lực trong khu vực đã thay đổi một cách mạnh mẽ."
 podnagaraja.2.a: "Màn đêm đang đổi thay."

 # ============================
 # Feature 2 Events (Journey)
 # Events 10-21: Pilgrimage to Enoch
 # ============================

 # --- Event 10: Arrival/Setup ---
 podnagaraja.10.t: "Shroud Mở Ra"
 podnagaraja.10.desc: "Các nghi thức đã hoàn tất, mọi sự chuẩn bị đã xong. Khi Shroud mở ra trước mặt ngài như một tấm màn sương giá lạnh, Âm Giới hé mở nanh vuốt của nó. Không khí trở nên đặc quánh với những lời thì thầm và nhiệt độ hạ xuống thứ gì đó còn hơn cả giá lạnh. Con đường đến Enoch trải dài phía trước -- hiểm nguy, khôn lường, và đầy những thứ mà ngay cả một Nagaraja cũng nên sợ hãi."
 podnagaraja.10.a: "Bắt đầu cuộc hạ xuống."
 podnagaraja.10.a.tt: "Cuộc hành hương của ngài xuyên Âm Giới bắt đầu..."

 # --- Event 12: Entering the Shadowlands (Pool) ---
 podnagaraja.12.t: "Bước Vào Shadowlands"
 podnagaraja.12.desc: "[UmbraGlossary('shadowlands')] trải dài trước mặt ngài -- một tấm gương xám của thế giới ngài đã bỏ lại, đầy những kẻ chết không yên nghỉ và những thứ còn tệ hơn thế. Ranh giới giữa thế giới người sống và Âm Giới sâu hơn mỏng manh nơi đây. Dòng máu Nagaraja của ngài ngân vang trong sự nhận biết."
 podnagaraja.12.a: "Tập trung vào con đường."
 podnagaraja.12.b: "Mở giác quan của ta cho người chết."
 podnagaraja.12.b.success: "Giác quan của ngài mở rộng. Người chết thì thầm những sự thật hữu ích"
 podnagaraja.12.b.failure: "Dòng lũ cảm giác linh thể áp đảo ngài trong chốc lát"

 # --- Event 13: The Tempest (Pool) ---
 podnagaraja.13.t: "Tempest"
 podnagaraja.13.desc: "Giữa [UmbraGlossary('shadowlands')] và những vùng sâu hơn của Âm Giới nằm [UmbraGlossary('tempest')] -- một cơn lốc gào thét của năng lượng linh thể đã nuốt chửng vô số linh hồn. Nó quật vào ngài bằng những cơn gió mang theo tiếng thét của kẻ bị đọa đày. Có những lối đi qua, nhưng không lối nào dễ chịu."
 podnagaraja.13.a: "Tiến qua bằng kỷ luật."
 podnagaraja.13.a.success: "Ngài ép mình vượt qua phần tồi tệ nhất của cơn bão"
 podnagaraja.13.a.failure: "Tempest quật ngài không thương tiếc"
 podnagaraja.13.b: "Dùng Necromancy để làm dịu những cơn gió chết chóc."
 podnagaraja.13.b.tt: "Necromancy cao cấp đảm bảo thành công"
 podnagaraja.13.b.success: "Sự tinh thông của ngài với người chết làm dịu cơn bão quanh ngài."
 podnagaraja.13.b.failure: "Kỹ năng Necromancy của ngài không đủ để thuần hóa Tempest."
 podnagaraja.13.c: "Chờ nó qua đi."

 # --- Event 14: Whispers of the Drowned (Pool) ---
 podnagaraja.14.t: "Tiếng Thì Thầm của Kẻ Chết Đuối"
 podnagaraja.14.desc: "Các bóng ma tụ tập ở rìa nhận thức của ngài, bị hút đến bởi hơi ấm của sinh lực bị đánh cắp. Hồn ma của những kẻ bị Nagaraja tiêu thụ qua nhiều thế kỷ -- họ nhớ những gì đã xảy ra với mình. Họ đưa ra kiến thức, cảnh báo, dối trá. Không thể nào biết được đâu là cái nào."
 podnagaraja.14.a: "Ra lệnh cho chúng dẫn đường ta."
 podnagaraja.14.a.success: "Các bóng ma khuất phục trước ý chí của ngài và tiết lộ những con đường hữu ích"
 podnagaraja.14.a.failure: "Các bóng ma chống lại mệnh lệnh của ngài với sự hằn học"
 podnagaraja.14.b: "Lờ chúng đi và tiếp tục bước."
 podnagaraja.14.c: "Nuốt chửng chất ngoại chất của chúng để lấy sức mạnh."
 podnagaraja.14.c.tt: "Thỏa mãn cơn đói của ngài bằng tinh chất linh thể"

 # --- Event 15: The False Necropolis (Pool) ---
 podnagaraja.15.t: "Thành Phố Người Chết Giả"
 podnagaraja.15.desc: "Một thành phố rộng lớn trồi lên từ sương mù linh thể -- những tòa tháp, tường thành, cổng thành trông cổ xưa đến khó tin. Trong khoảnh khắc, dòng máu ngài dâng trào với sự nhận biết. Enoch? Không. Có gì đó sai. Tỷ lệ hơi lệch, kiến trúc là một sự giả mạo thuyết phục. Đây là một cái bẫy, được xây để sập bẫy những kẻ hành hương không biết thành phố thật."
 podnagaraja.15.a: "Điều tra thận trọng -- có thể có thứ hữu ích để thu lượm."
 podnagaraja.15.a.success: "Trong đống đổ nát, ngài tìm thấy một cuốn nhật ký do một kẻ hành hương trước để lại"
 podnagaraja.15.a.failure: "Hệ thống phòng thủ của thành phố giả khiến ngài mất cảnh giác"
 podnagaraja.15.b: "Tránh nó hoàn toàn."
 podnagaraja.15.c: "Phá hủy nó để không Nagaraja nào khác mắc bẫy này nữa."

 # --- Event 16: A Spectral Anomaly (Pool) ---
 podnagaraja.16.t: "Một Dị Thường Linh Thể"
 podnagaraja.16.desc: "Một túi năng lượng Âm Giới thô chặn con đường phía trước -- một xoáy nước cuộn trào của lực linh thể làm biến dạng chính kết cấu của Shadowlands xung quanh nó. Người chết tránh xa nơi này. Ngay cả oan hồn cũng tránh nó thật xa."
 podnagaraja.16.a: "Đi xuyên qua nó."
 podnagaraja.16.a.success: "Năng lượng cọ xát ngài nhưng khiến ngài mạnh mẽ hơn"
 podnagaraja.16.a.failure: "Dị thường xé toạc bản chất của ngài"
 podnagaraja.16.b: "Đi vòng qua."
 podnagaraja.16.c: "Nghiên cứu dị thường từ một khoảng cách an toàn."
 podnagaraja.16.c.success: "Ngài rút ra được những hiểu biết về bản chất của Âm Giới"
 podnagaraja.16.c.failure: "Dị thường vượt quá khả năng lý giải"

 # --- Event 17: The Wraith Market (Pool) ---
 podnagaraja.17.t: "Chợ Oan Hồn"
 podnagaraja.17.desc: "Một đám oan hồn đang buôn bán với nhau trong một hốc trũng giữa những cơn gió Tempest. Chúng buôn bán ký ức, hối tiếc, và những mảnh vỡ của thế giới người sống. Một số trong chúng đã ở đây từ trước cả sự sụp đổ của Rome. Chúng nhìn ngài với một sự pha trộn giữa sợ hãi và đói khát -- Nagaraja được người chết biết đến."
 podnagaraja.17.a: "Đổi vàng lấy tin tức."
 podnagaraja.17.b: "Nuốt chửng một trong số chúng."
 podnagaraja.17.b.tt: "Thỏa mãn cơn đói của ngài, nhưng người chết sẽ nhớ"
 podnagaraja.17.c: "Lờ chúng đi và tiếp tục."

 # --- Event 18: Echoes of the Silk Road (Pool) ---
 podnagaraja.18.t: "Tiếng Vọng của Con Đường Tơ Lụa"
 podnagaraja.18.desc: "Con đường đi xuyên qua tiếng vọng linh thể của một thành phố Con Đường Tơ Lụa đã bị hủy diệt. Các thương nhân ma vẫn bày bán hàng hóa của họ trong một vòng lặp bất tận, không hề hay biết rằng họ và thành phố của họ đã chết từ nhiều thế kỷ trước. Các tòa nhà lấp lánh với vẻ tráng lệ phai tàn, và đâu đó sâu trong tàn tích, có thứ gì đó cổ xưa đang chờ đợi."
 podnagaraja.18.a: "Lục soát tàn tích để tìm kiến thức ẩn giấu."
 podnagaraja.18.a.success: "Ngài khám phá ra những truyền thuyết bị lãng quên giữa tàn tích linh thể"
 podnagaraja.18.a.failure: "Tàn tích chẳng cho gì ngoài bụi bặm và thất vọng"
 podnagaraja.18.b: "Điều tra những cư dân ma."
 podnagaraja.18.b.success: "Các hồn ma chia sẻ ký ức về những triều đại đã bị lãng quên từ lâu"
 podnagaraja.18.b.failure: "Các hồn ma né tránh sự hiện diện của ngài"
 podnagaraja.18.c: "Ghi lại những gì ta thấy và tiếp tục."

 # --- Event 19: A Fellow Traveler (Pool) ---
 podnagaraja.19.t: "Một Bạn Đồng Hành"
 podnagaraja.19.desc: "Một bóng hình hiện ra từ sương mù linh thể -- một Nagaraja khác, đang trở về từ Enoch sau một nhiệm vụ Tal'Mahe'Ra. Nàng gầy gò, đôi mắt trũng sâu vì cuộc hành trình, nhưng nàng mang trong mình sự tự tin lặng lẽ của kẻ đã sống sót qua Âm Giới sâu thẳm. Nàng đề nghị chia sẻ tin tức."
 podnagaraja.19.a: "Chia sẻ tin tức tự do -- chúng ta là người cùng dòng máu."
 podnagaraja.19.a.tt: "Có một rủi ro nhỏ rằng nàng không phải là kẻ như nàng tỏ ra"
 podnagaraja.19.b: "Đổi tin tức lấy tin tức."
 podnagaraja.19.b.success: "Một sự trao đổi công bằng. Ngài học được những điều có giá trị"
 podnagaraja.19.b.failure: "Nàng không cho ngài thứ gì hữu ích"
 podnagaraja.19.c: "Từ chối sự đồng hành của nàng -- ta đi một mình."
 podnagaraja.19.d: "Nàng trông có vẻ đói -- đề nghị chia sẻ nguồn cung Viscus của ta."
 podnagaraja.19.d.tt: "Sự hào phóng của ngài sẽ được clan ghi nhớ"

 # --- Event 20: Gates of Enoch (Final) ---
 podnagaraja.20.t: "Cổng Thành Enoch"
 podnagaraja.20.desc: "Trước mặt ngài sừng sững những cánh cổng cổ xưa đến khó tin của Enoch, Thành Phố Thứ Nhất, giờ đây chỉ còn là bóng ma của vinh quang xưa kia sâu trong Âm Giới. Không khí rung động với một quyền năng cổ xưa hơn cả lịch sử được ghi chép. Đây là nơi ranh giới giữa sự sống và cái chết, tri thức và điên loạn, tất cả đều tan biến. Ngài đứng trước ngưỡng cửa của bí ẩn vĩ đại nhất mà Nagaraja từng biết đến. Những kẻ hầu cận của Del'Roh dõi theo từ trong bóng tối, đo lường giá trị của ngài."
 podnagaraja.20.a: "Bước vào và bày tỏ lòng tôn kính với Del'Roh."
 podnagaraja.20.a.tt: "Ngài sẽ nhận được đặc điểm Lữ Khách Enoch, uy tín, và uy tín gia tộc"
 podnagaraja.20.b: "Bước vào và nghiên cứu các thư viện của Brujah."
 podnagaraja.20.c: "Ở lại Enoch và phụng sự."
 podnagaraja.20.c.tt: "Ngài sẽ rơi vào Miên Trạng, nhận được đặc điểm Lữ Khách Enoch, và kiếm được uy tín gia tộc lớn"

 # --- Event 21: Fellow Traveler Spy Follow-up ---
 podnagaraja.21.t: "Một Sự Phản Bội Trong Bóng Tối"
 podnagaraja.21.desc: "Có gì đó không ổn. Tin tức ngài đã chia sẻ với người bạn đồng hành đã xuất hiện ở những nơi lẽ ra không nên có. Hoặc là nàng không phải là kẻ nàng tự nhận, hoặc nàng đã bán bí mật của ngài cho kẻ khác. Thiệt hại có thể đã xảy ra rồi."
 podnagaraja.21.a: "Điều tra sự phản bội."
 podnagaraja.21.a.success: "Ngài phát hiện ra sự lừa dối trước khi thiệt hại thực sự xảy ra"
 podnagaraja.21.a.failure: "Bí mật của ngài đã lan truyền rồi. Thiệt hại là có thật"
 podnagaraja.21.b: "Cứ để nó qua đi -- một số thông tin có thể hy sinh."

 # ============================
 # Feature 4 Events
 # ============================

 podnagaraja.100.t: "Chuẩn Bị"
 podnagaraja.100.desc: "Silent Conclave đòi hỏi sự chuẩn bị cẩn thận. Thông điệp phải được gửi qua các kênh mà ngay cả những ma cà rồng khác cũng không thể lần theo, vật liệu nghi lễ được thu thập từ [UmbraGlossaryLocalized('shadowlands','Âm Phủ')], và một địa điểm an toàn được xác định. Công việc tẻ nhạt nhưng cần thiết."
 podnagaraja.100.a: "Bắt đầu chuẩn bị."
 podnagaraja.100.a.tt: "Buổi họp mật sẽ tập hợp trong một tháng"

 podnagaraja.101.t: "Buổi Tụ Họp"
 podnagaraja.101.desc: "Họ đến từng người một, hiện ra từ bóng tối và bước qua chính Shroud. Những Nagaraja đồng đạo của ngài, mỗi người mang theo bí mật và tri thức từ lãnh địa riêng của họ. Silent Conclave được triệu tập. Câu hỏi là: trọng tâm của nó sẽ là gì?"
 podnagaraja.101.a: "Tập trung vào các vấn đề mưu mô và bảo vệ."
 podnagaraja.101.a.tt: "Buổi họp mật sẽ bàn về các phương pháp phòng thủ và mưu kế"
 podnagaraja.101.b: "Tập trung vào nghiên cứu và nghi thức Necromancy."
 podnagaraja.101.b.tt: "Buổi họp mật sẽ khám phá những bí ẩn sâu xa hơn của cái chết"

 podnagaraja.102.t: "Lễ Hiến Tế"
 podnagaraja.102.desc: "Ở trung tâm của mỗi Silent Conclave là Lễ Hiến Tế -- một nghi thức khai thác mối liên kết độc nhất của Nagaraja với Âm Giới. Xác thịt phải được hiến tế để cấp năng lượng cho nghi lễ, như cách của clan chúng ta."
 podnagaraja.102.a: "Hiến tế tự do và hào phóng."
 podnagaraja.102.b: "Chỉ hiến tế mang tính tượng trưng."

 podnagaraja.103.t: "Bị Phát Hiện"
 podnagaraja.103.desc: "Buổi họp mật đã thu hút sự chú ý. Ai đó -- phàm nhân hoặc không -- đã nhận thấy buổi tụ họp và có thể đã chứng kiến những điều lẽ ra phải được giữ kín. Bằng chứng phải được xử lý trước khi Luật Che Giấu bị tổn hại thêm."
 podnagaraja.103.a: "Trả tiền để xóa dấu vết của chúng ta."
 podnagaraja.103.a.tt: "Chi vàng để loại bỏ bằng chứng"
 podnagaraja.103.b: "Phân tán và hy vọng vào điều tốt nhất."

 # ============================
 # Feature 6 Events
 # ============================

 podnagaraja.200.t: "Người Thực Hành Itarajana"
 podnagaraja.200.desc: "Tin tức về cuộc tìm kiếm pháp sư Itarajana của ngài đã có kết quả. Một người thực hành truyền thống Huyết Thuật Hindu cổ xưa đã được tìm thấy và đưa đến trước mặt ngài. [new_sorcerer.GetHerHis|U] kiến thức về các pháp thuật huyền bí bản địa của tiểu lục địa có thể chứng tỏ vô giá."
 podnagaraja.200.a: "Chào đón [new_sorcerer.GetHerHim] vào phụng sự của chúng ta."
 podnagaraja.200.a.tt: "[new_sorcerer.GetShortUIName|U] sẽ bị ràng buộc làm [ghoul|E] của ngài và gia nhập triều đình của ngài"

 podnagaraja.201.t: "Nghiên Cứu của Pháp Sư"
 podnagaraja.201.desc: "Pháp sư Itarajana của ngài [sorcerer.GetFirstName] đã tiến hành nghiên cứu tại triều đình của ngài, đào sâu vào giao điểm giữa huyền học Hindu và pháp thuật Necromancy. [sorcerer.GetSheHe|U] đến gặp ngài với những phát hiện của [sorcerer.GetHerHis] mình."
 podnagaraja.201.a: "Khuyến khích [sorcerer.GetHerHis] tiếp tục nghiên cứu."
 podnagaraja.201.b: "Khai thác kiến thức của [sorcerer.GetHerHis] để trục lợi ngay lập tức."

 # ============================
 # Feature 3 Events
 # ============================

 podnagaraja.300.t: "Một Hành Trình Không Trở Lại"
 podnagaraja.300.desc: "Ngài đứng trước [recipient.GetFirstNameNoTooltip], hậu duệ của ngài, sẵn sàng gửi họ đi thực hiện nhiệm vụ trang nghiêm nhất -- một cuộc hành hương một chiều đến thành phố ma Enoch. Ở đó, họ sẽ phụng sự lợi ích của clan từ bên kia Shroud, duy trì những mối liên kết mà người sống không thể."
 podnagaraja.300.a: "Hãy tiến bước và phụng sự clan chúng ta ở thế giới bên kia."
 podnagaraja.300.a.tt: "[recipient.GetFirstNameNoTooltip] sẽ khởi hành đến Âm Giới, không bao giờ trở lại. Ngài sẽ nhận uy tín và được gia tộc tôn vinh."
 podnagaraja.300.b: "Ta đã đổi ý."
 podnagaraja.300.b.tt: "[recipient.GetFirstNameNoTooltip] ở lại triều đình của ngài"

 # ============================
 # Feature 5 Events
 # ============================

 podnagaraja.400.t: "Rủi Ro của Kẻ Ăn Thịt"
 podnagaraja.400.desc: "Cơn đói cào xé. Không chỉ là cơn khát máu đơn thuần vốn hành hạ những ma cà rồng thấp kém hơn, mà là sự thèm khát sâu xa hơn, khủng khiếp hơn định hình nên Nagaraja -- nhu cầu về xác thịt sống. Lời nguyền đòi hỏi phải được thỏa mãn, và ngài càng cưỡng lại lâu, việc ăn uống cuối cùng càng trở nên nguy hiểm hơn."
 podnagaraja.400.a: "Ăn uống cẩn thận, rình rập một nạn nhân một cách chuẩn xác."
 podnagaraja.400.b: "Ăn uống liều lĩnh và thỏa mãn cơn đói hoàn toàn."
 podnagaraja.400.b.tt: "Có rủi ro rằng bằng chứng về việc ăn uống của ngài sẽ bị phát hiện"
 podnagaraja.400.c: "Ăn uống trên một trong những ghoul của ta thay vào đó."
 podnagaraja.400.c.tt: "An toàn, nhưng ghoul của ngài sẽ không hài lòng đâu"
 podnagaraja.400.d: "Chịu đựng cơn đói bằng ý chí kiên cường."

 podnagaraja.401.t: "Bằng Chứng Bị Phát Hiện"
 podnagaraja.401.desc: "Việc ăn uống liều lĩnh của ngài đã để lại dấu vết. Ai đó đã tìm thấy bằng chứng -- có thể là tàn tích, có thể là nhân chứng, có thể là thứ gì đó tệ hơn. Bằng chứng đe dọa phơi bày bản chất quái vật của ngài trước những kẻ không bao giờ nên biết."
 podnagaraja.401.a: "Trả tiền để bằng chứng bị hủy."
 podnagaraja.401.a.tt: "Chi vàng để làm vấn đề biến mất"
 podnagaraja.401.b: "Bỏ qua và tiếp tục."
 podnagaraja.401.c: "Đổ tội cho ai đó khác về hành động này."
 podnagaraja.401.c.success: "Ngài thành công đổ tội cho ai đó khác"
 podnagaraja.401.c.failure: "Nỗ lực đổ tội cho ai đó khác của ngài thất bại"


 # ============================
 # Feature 1: Purge the Serpent
 # ============================

 purge_serpent_india_decision: "Thanh Trừng Loài Rắn khỏi Ấn Độ"
 purge_serpent_india_decision_tooltip: "Đuổi tất cả những kẻ cai trị Setite và Daitya khỏi các triều đình Ấn Độ và Tây Tạng để giành quyền thống trị tiểu lục địa"
 purge_serpent_india_decision_desc: "Những tín đồ của Sutekh -- các Setite và Daitya -- đã từ lâu quấn chặt ảnh hưởng của họ qua các triều đình Ấn Độ và các tu viện Tây Tạng. Là một Nagaraja, trách nhiệm của chúng ta là thanh tẩy quê hương khỏi sự hiện diện băng hoại của chúng và thiết lập quyền thống trị của chúng ta trên tiểu lục địa."
 purge_serpent_india_decision_confirm: "Daitya sẽ biết đến sự sợ hãi"
 purge_serpent_capital_requirement: "Thủ đô của ngài phải nằm ở [GetGeographicalRegion('world_india').GetName] hoặc [GetGeographicalRegion('world_tibet').GetName]"
 purge_serpent_no_setite_india: "Không Setite hay Daitya nào được nắm giữ tước vị quận trở lên tại [GetGeographicalRegion('world_india').GetName]"
 purge_serpent_no_setite_tibet: "Không Setite hay Daitya nào được nắm giữ tước vị quận trở lên tại [GetGeographicalRegion('world_tibet').GetName]"
 purge_serpent_effect_tooltip: "Ngài sẽ được tôn vinh là Tai Ương của Sutekh và nhận được phần thưởng lớn"

 # ============================
 # Feature 2: Pilgrimage to Enoch
 # ============================

 pilgrimage_to_enoch_decision: "Hành Hương đến Enoch"
 pilgrimage_to_enoch_decision_tooltip: "Hành trình xuyên Shadowlands đến thành phố ma Enoch và trở về với tri thức bị cấm"
 pilgrimage_to_enoch_decision_desc: "Thành phố ma Enoch nằm sâu trong [UmbraGlossaryLocalized('shadowlands','Âm Phủ')], một nơi quyền năng khủng khiếp và tri thức bị cấm. Với sự tinh thông Necromancy và sự hậu thuẫn của một [coterie|E] trung thành, ngài có thể thực hiện hành trình nguy hiểm đến đó và trở về với sự khôn ngoan vượt xa sự thấu hiểu của phàm nhân."
 pilgrimage_to_enoch_decision_confirm: "Vào Shadowlands"
 pilgrimage_to_enoch_effect_tooltip: "Bắt đầu một [journey|E] đến thành phố ma Enoch trong Âm Giới"

 # ============================
 # Feature 4: Silent Conclave
 # ============================

 convene_silent_conclave_decision: "Triệu Tập một Silent Conclave"
 convene_silent_conclave_decision_tooltip: "Tổ chức một buổi tụ họp bí mật của các trưởng lão Nagaraja để trao đổi tri thức và thực hiện các nghi thức tăm tối"
 convene_silent_conclave_decision_desc: "Silent Conclave là một buổi tụ họp bí mật của Nagaraja, nơi tri thức bị cấm được trao đổi và các nghi thức tăm tối được thực hiện để phụng sự clan. Những buổi tụ họp như vậy hiếm hoi, nguy hiểm, và cực kỳ giá trị."
 convene_silent_conclave_decision_confirm: "Hãy tụ họp"
 convene_silent_conclave_effect_tooltip: "Tổ chức một buổi tụ họp bí mật của Nagaraja để trao đổi tri thức và thực hiện các nghi thức tăm tối"

 # ============================
 # Feature 6: Recruit Sorcerer
 # ============================

 recruit_itarajana_sorcerer_decision: "Chiêu Mộ một Pháp Sư Itarajana"
 recruit_itarajana_sorcerer_decision_tooltip: "Tìm kiếm một người thực hành Huyết Thuật Itarajana và ràng buộc họ làm ghoul phụng sự ngài"
 recruit_itarajana_sorcerer_decision_desc: "Truyền thống Huyết Thuật Itarajana bắt nguồn từ các tập tục huyền học Hindu và có nguồn gốc bản địa từ tiểu lục địa Ấn Độ. Một người thực hành lành nghề, được ràng buộc đúng cách làm ghoul, có thể chứng tỏ là một tài sản vô giá cho triều đình chúng ta."
 recruit_itarajana_sorcerer_decision_confirm: "Kiến thức của họ sẽ phụng sự chúng ta"
 recruit_itarajana_region_requirement: "Thủ đô của ngài phải nằm ở [GetGeographicalRegion('world_india').GetName], [GetGeographicalRegion('world_tibet').GetName], [GetGeographicalRegion('world_middle_east').GetName], hoặc [GetGeographicalRegion('world_steppe').GetName]"
 recruit_itarajana_max_cap: "Ngài không thể có nhiều hơn 3 #TOOLTIP:GAME_TRAIT,itarajana_sorcerer,[GetNullCharacter] #L Itarajana Sorcerers#!#! tại triều đình của ngài"
 recruit_itarajana_ghoul_cap: "Ngài đã có số lượng tối đa [Concept('ghoul','Ghouls')|E] ([SCOPE.GetValue('ghoul_amount')|0])"
 recruit_itarajana_effect_tooltip: "Một người thực hành [GetTrait('ghoul').GetName(GetNullCharacter)] của #TOOLTIP:GAME_TRAIT,itarajana_sorcerer,[GetNullCharacter] #L Itarajana Sorcery#!#! sẽ gia nhập triều đình của ngài"