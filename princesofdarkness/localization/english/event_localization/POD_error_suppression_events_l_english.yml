l_english:
 
 POD_error_suppression.0002.t: "Better Barbershop"
 #POD_error_suppression.0002.desc: "We are noticing that you are using the Better Barbershop mod (formerly Full Screen Barbershop). Please make sure you are using the following load order: Prince of Darkness mod, then Better Barbershop mod, then "POD + Better Barbershop Compatibility Patch" mod (podbb).\nOtherwise, you will miss out on several Princes of Darkness features and all characters will end up muscular or overweight and the scrollable character interactions will not be available. Thanks!"
 POD_error_suppression.0002.desc: "Chúng tôi nhận thấy ngài đang dùng mod Better Barbershop (trước đây là Full Screen Barbershop). Mod đó hiện #N không tương thích#! với PoD, và bản vá tương thích của nó đã lỗi thời. Chúng tôi khuyên ngài tạm thời gỡ nó khỏi playset.\n\nNếu không, ngài sẽ bỏ lỡ nhiều tính năng của Princes of Darkness, mọi nhân vật sẽ trở nên vạm vỡ hoặc thừa cân, và bảng tương tác nhân vật có thể cuộn sẽ không dùng được. Xin cảm ơn!"
 POD_error_suppression.0002.a: "Đã rõ"
 
 POD_error_suppression.0004.t: "Search & Trade Artifacts"
 POD_error_suppression.0004.desc: "Ngài đang dùng mod #bold Search & Trade Artifacts#! mà không có bản vá tương thích của nó. Điều này sẽ dẫn tới lỗi và hành vi ngoài ý muốn.\n\nChúng tôi khuyên ngài tải bản vá [princes_of_darkness|E] từ đường dẫn bên dưới."
 POD_error_suppression.0004.button: "#T Tải lại khung văn bản#!"
 POD_search_artifacts_steam_link: "https://steamcommunity.com/sharedfiles/filedetails/?id=3108318083"

 POD_error_suppression.0005.t: "Cảnh Báo Đặc Điểm Nguyên Bản"
 POD_error_suppression.0005.desc: "Một trong các mod của ngài đang thay đổi các đặc điểm nguyên bản, khiến những thay đổi của [princes_of_darkness|E] bị ghi đè. Điều này sẽ dẫn tới lỗi và hành vi ngoài ý muốn.\n\nChúng tôi khuyên ngài gỡ bớt các mod khác cho tới khi cảnh báo này không còn hiện ra nữa."