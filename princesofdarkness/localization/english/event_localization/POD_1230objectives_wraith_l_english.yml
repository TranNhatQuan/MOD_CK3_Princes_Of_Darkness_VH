l_english:
 pod1230objectives_wraith.1.t: "Siêu Thoát"
 pod1230objectives_wraith.1.desc: "Siêu Thoát về bản chất là chấp nhận cái chết của chính mình. Trong lịch sử, Ferrymen, Far Shores và Hierarchy đều được lập ra như những cơ chế để đạt tới Siêu Thoát. Mệnh lệnh mà Lady of Fate giao cho Charon là giúp những linh hồn lạc vào Âm Giới đạt tới Siêu Thoát và bước tiếp.\nSiêu Thoát về bản chất là chấp nhận cái chết của chính mình. Những thứ trói buộc một oan hồn vào âm giới, Passion và Fetter, đều phải được Hóa Giải. Một khi mọi thứ đã được hóa giải, oan hồn phải tìm tới một dạng hòa hợp nào đó với Bóng của mình."
 pod1230objectives_wraith.1.a: "Tự do"
 death_transcendence: "Nhân vật này đã siêu thoát khỏi cái chết để cuối cùng được tự do"

 pod1230objectives_wraith.2.t: "Trở Về Từ Cõi Chết"
 pod1230objectives_wraith.2.desc: "Risen là thuật ngữ dùng để chỉ một oan hồn đã tìm được cách trở về thân xác mình để bước đi giữa người sống nơi Skinlands. Vì thiếu một từ nào hay hơn, Risen gần như là những xác sống, chỉ khác là không có dáng đi lê lết, không có da thịt rữa nát, cũng không cần ăn óc người. Trở thành Risen là một trong những bí mật được canh giữ chặt chẽ nhất ở Shadowlands; tuy vậy, với sự trợ giúp, điều đó vẫn có thể làm được.\nVới bất cứ oan hồn nào muốn quay lại cõi sống, đây hẳn là khả năng hợp lý nhất, dù không phải không có những mặt trái và thử thách của nó."
 pod1230objectives_wraith.2.a: "Sống lại lần nữa."
 pod1230objectives_wraith.2.a.tt: "Ngươi sẽ trở lại cõi sống, như thể mọi chuyện kể từ khi ngươi chết chưa từng xảy ra."
 pod1230objectives_wraith.2.b: "Kiếp Risen"
 
 pod1230objectives_wraith.3.t: "Shroud Đã Được Bảo Toàn"
 pod1230objectives_wraith.3.desc: "Giovanni đã bị quét sạch, âm mưu phá hủy Shroud của chúng không còn nữa. Tro tàn của chúng đứng đó như lời cảnh cáo cho bất cứ sinh linh sống hay chết nào dám xâm phạm sự tôn nghiêm của Stygia. Tuy vậy công việc của ngươi với tư cách kẻ thi hành luật của Hierarchy chẳng bao giờ ngừng. Sẽ luôn có những kẻ ngu muội vi phạm Dictum Mortuum, và ngươi sẽ luôn có mặt để khiến chúng phải hối hận."
 pod1230objectives_wraith.3.a: "Shroud nằm dưới sự bảo hộ của ta."
 the_enforcer_of_dictum_mortuum: "Kẻ Thi Hành Dictum Mortuum"
 the_enforcer_of_dictum_mortuum_desc: "Ngươi sẽ có thể sử dụng các công trình của oan hồn"
 
 pod1230objectives_wraith.4.t: "Hồi Kết của Dictum Mortuum"
 pod1230objectives_wraith.4.desc: "Charon đã đầu hàng, và Dictum Mortuum không còn nữa, giờ ngươi có thể tùy ý tiếp xúc với bất cứ kẻ Quick nào."
 pod1230objectives_wraith.4.a: "Hãy dọn dẹp mớ hỗn độn này"
 pod1230objectives_wraith.4.b: "Đốt sạch tất cả"
 pod1230objectives_wraith.4.c: "Ta là Hoàng Đế mới!"
 the_gravedigger_of_dictum_mortuum: "Kẻ Đào Mồ Dictum Mortuum"