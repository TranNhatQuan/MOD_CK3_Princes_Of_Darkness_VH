l_english:

 podregionalpersons.2.t: "Kẻ Săn Bị Săn"
 podregionalpersons.2.desc: "Đã một thời gian nay, đoàn tùy tùng của ngươi xôn xao tin đồn về một kẻ phàm nhân đang săn lùng $pod_cainites$ quanh vùng đất ngươi. Dĩ nhiên, phàm nhân hiếm khi gặp may trong việc này, nhất là khi họ chọn con đường đơn thương độc mã, như kẻ này có vẻ đang làm.\nĐiều đáng chú ý là, bất chấp mọi khiếm khuyết đó, kẻ săn này đã đạt được vài thành công bước đầu, và nhiều con hẻm tối đã an toàn hơn nhờ hắn. Nhưng hắn khó nắm bắt, và ngươi thực sự không chắc hắn sẽ ra tay ở đâu tiếp theo, hay thậm chí có ra tay nữa không. Nhưng ngươi có thể giữ người của mình bám sát thực địa để thử lần theo dấu vết hắn, nếu ngươi muốn."
 podregionalpersons.2.a: "Ta muốn biết mọi thứ về hắn"
 podregionalpersons.2.custom: "Hãy cẩn trọng, có thể sẽ có hậu quả nghiêm trọng..."
 podregionalpersons.2.b: "Chuyện này không liên quan đến ta"
 podregionalpersons.2.customb: "Ngươi sẽ không còn nghe về hắn nữa"
 podregionalpersons.2.c: "Ta muốn biết mọi thứ về hắn"
 podregionalpersons.2.customc: "Có lẽ ngươi nên chiêu mộ kẻ tài năng này?"
 podregionalpersons.4.t: "Kẻ Săn Bị Săn II"
 podregionalpersons.4.desc: "Ngươi đã tìm ra hắn. Kẻ săn khó nắm bắt này chính là Karl Schrekt, đến từ Vienna. Một người đàn ông ít lời, khó lần theo dấu vết, và còn khó đánh giá hơn.\nLòng nhiệt thành của cơn thịnh nộ Chúa Trời cháy bỏng trong hắn, điều đó rõ ràng ai cũng thấy, nhưng nó bị vấy bẩn bởi một sự cay đắng khiến hắn không nhận ra nỗi thống khổ mà hắn gây ra trong những cuộc săn của mình. Ngươi sợ rằng linh hồn hắn đang ở bờ vực, và đội quân của Chúa Trời sẽ mất đi một con người xuất chúng nếu đức tin của hắn còn lung lay thêm nữa.\nCó lẽ ngươi có thể nhắc hắn nhớ về vinh quang của Chúa Trời và cho hắn thấy đức tính của việc làm việc trong một nhóm gắn kết? Đây sẽ là một cuộc tranh luận khó khăn, vì người này cứng đầu không ai bằng..."
 podregionalpersons.4.a: "Hỡi huynh đệ, hãy nghe theo Lời Chúa"
 podregionalpersons.4.effect.success.desc: "Ngươi thuyết phục được Karl gia nhập chính nghĩa của mình mà không gặp trở ngại"
 podregionalpersons.4.success: "Karl đã gia nhập cùng ngươi!"
 podregionalpersons.4.failure.effect.desc: "Đức tin của ngươi bị thử thách, nhưng cuối cùng ngươi cũng thuyết phục được hắn"
 podregionalpersons.4.failure: "Karl đã gia nhập cùng ngươi!"
 podregionalpersons.4.critical.failure.effect.desc: "Hắn đã mất vào tay ánh sáng..."
 podregionalpersons.4.critical.failure: "Karl đã ra đi"
 podregionalpersons.4.c: "Hắn đã đi quá xa rồi, vô phương cứu vãn"
 podregionalpersons.3.t: "Kẻ Săn Bị Săn II"
 podregionalpersons.3.desc: "Kẻ săn đơn độc gây rối quanh vùng đất ngươi vẫn còn lẩn tránh ngươi, nhưng ngươi đã có được, ít nhất là một ý niệm chung về phương thức hoạt động của hắn. Với hiểu biết này, ngươi đã nghĩ ra hai kế hoạch hành động để đánh lạc hướng và, hy vọng, bắt giữ được kẻ này.\nCả hai kế hoạch đều đòi hỏi ngươi phải giật vài sợi dây và có khả năng thu hút sự chú ý không mong muốn lên hoạt động của ngươi. Nhưng ngươi không thể lùi bước lúc này, vì có vẻ như chính kẻ săn cũng đang tiến sát vị trí của ngươi... Một cuộc đối đầu là không thể tránh khỏi vào lúc này."
 podregionalpersons.3.a: "Hãy đặt bẫy cho hắn"
 podregionalpersons.3.b: "Đối đầu trực diện hợp phong cách ta hơn"
 podregionalpersons.5.t: "Kẻ Săn Bị Săn III"
 podregionalpersons.5.desc: "Ngươi phải thừa nhận rằng mình có phần lo lắng. Lúc này, người của ngươi hẳn đang chờ tại trang viên cũ mà ngươi dựng lên làm bình phong để bẫy kẻ săn khó nắm bắt. Ngươi đã biết tên hắn, Karl Schrekt đến từ Vienna, một con sói đơn độc với một ý chí hiếm thấy ngay cả trong giới cuồng tín của hắn. Ngươi khá tự tin rằng mình đã lên kế hoạch bẫy tốt, và người của ngươi đủ giỏi để khuất phục hắn.\nNhưng... nếu hắn thoát được, hay tệ hơn, giết chết người của ngươi, hắn sẽ giáng một đòn rất nghiêm trọng vào quyền kiểm soát của ngươi lên vùng đất này. Và ngươi cũng sẽ mất đi cơ hội duy nhất để bắt được hắn."
 podregionalpersons.5.a: "Không còn đường lui nữa"
 podregionalpersons.5.effect.success.desc: "Kế hoạch diễn ra suôn sẻ"
 podregionalpersons.5.success: "Chúng ta đã bắt được hắn!"
 podregionalpersons.5.failure.effect.desc: "Hắn gây ra chút thiệt hại, nhưng ngươi đã thắng"
 podregionalpersons.5.failure: "Chúng ta đã bắt được hắn!... suýt thì không"
 podregionalpersons.5.critical.failure.effect.desc: "Karl chạy thoát, sau khi đánh gục người của ngươi"
 podregionalpersons.5.critical.failure: "Hắn đã hạ được chúng ta..."
 podregionalpersons.6.t: "Kẻ Săn Bị Săn III"
 podregionalpersons.6.desc: "Một buổi tối bình thường tại triều đình ngươi khi, đột nhiên, vài ngọn đuốc rơi lăn lóc từ đâu đó giữa căn phòng. Ngươi chật vật kìm nén Dã Thú đang khiếp sợ trong mình khi tiếng thét kinh hoàng và những ma cà rồng phẫn cuồng vang lên khắp nơi quanh ngươi.\nKhi ngươi cố chạy trốn khỏi cảnh hỗn loạn, một bóng người trùm mũ chặn đường ngươi, dường như không hề để ý đến ngọn lửa đang bùng lên quanh ngươi.\nKhông nói một lời, hắn bắt đầu tiến lại gần ngươi, mỗi tay cầm một ngọn đuốc đang cháy. Sự cuồng nhiệt điên loạn trong mắt hắn không để lại chút nghi ngờ nào, có vẻ như kẻ săn sói đơn độc khó nắm bắt đã tìm ra ngươi trước khi ngươi tìm ra hắn..."
 podregionalpersons.6.a: "Chặn hắn lại! NGAY!"
 podregionalpersons.6.effect.success.desc: "Ngươi áp đảo và bắt giữ được hắn!"
 podregionalpersons.6.success: "Chúng ta đã bắt được hắn!"
 podregionalpersons.6.failure.effect.desc: "Hắn gây ra chút thiệt hại, nhưng ngươi đã thắng"
 podregionalpersons.6.failure: "Chúng ta đã bắt được hắn!... suýt thì không"
 podregionalpersons.6.critical.failure.effect.desc: "Điều cuối cùng ngươi thấy là lửa, lửa khắp mọi nơi"
 podregionalpersons.6.critical.failure: "Ấm áp quá..."
 podregionalpersons.7.t: "Đại Sảnh của Ulf"
 podregionalpersons.7.desc: "Một báo cáo vừa gửi về cho ngươi rằng Đại Sảnh huyền thoại của Ulf đã được tìm thấy.\nHòn đảo nhỏ gần Na Uy này được cho là chứa kho báu của các Runemage nổi tiếng, những Pháp sư Rune của người Bắc Âu. Thời của họ đã qua từ lâu, khi Chúa Trời của Cơ Đốc giáo đã quét sạch tín ngưỡng của họ trên lục địa. Nhưng có vẻ một nhóm nhỏ trong số họ vẫn bám trụ tại Đại Sảnh, bảo vệ thứ có thể là cả một kho báu, xét theo sức mạnh họ từng có trong nhiều thế kỷ trước...\nNgươi sẽ làm gì với tin tức này?"
 podregionalpersons.7.a: "Đã đến lúc cướp phá, ta nói vậy!"
 podregionalpersons.7.custom: "Hãy cẩn trọng, có thể sẽ có hậu quả nghiêm trọng..."
 podregionalpersons.7.b: "Chúng ta phải bảo vệ những kẻ phụng sự Odin này!"
 podregionalpersons.7.c: "Ta có những việc cấp bách hơn cần lo"
 podregionalpersons.7.customb: "Ngươi sẽ không còn nghe về chuyện này nữa"
 podregionalpersons.8.t: "Đại Sảnh của Ulf II"
 podregionalpersons.8.desc: "Một ngôi làng chài nhỏ bé và khiêm tốn, Đại Sảnh của Ulf không phải là thành phố vàng son tráng lệ mà ngươi tưởng tượng.\nDù vậy, khi quan sát xung quanh, ngươi biết rõ hơn là không nên xem thường nhóm Pháp sư Rune có khả năng đang trú ngụ nơi đây. Theo ngươi thấy, ngươi có hai lựa chọn: một cuộc tấn công toàn lực ngay lúc này khi họ không ngờ tới, hoặc giả vờ thân thiện với chính nghĩa của họ để đâm sau lưng khi có cơ hội."
 podregionalpersons.8.a: "Chúng ta sẽ tống lũ ngốc này đến Valhalla!"
 podregionalpersons.8.effect.success.desc: "Ngươi chiếm được ngôi làng một cách dễ dàng"
 podregionalpersons.8.failure.effect.desc: "Ngươi hứng chịu một đòn nặng nề, nhưng ngôi làng đã thuộc về ngươi"
 podregionalpersons.8.critical.failure.effect.desc: "Các Pháp sư Rune đánh gục lực lượng của ngươi"
 podregionalpersons.8.failure: "Ngươi hứng chịu một đòn nặng"
 podregionalpersons.8.b: "Hãy gặp gỡ những 'người bạn' mới của chúng ta..."
 podregionalpersons.8.effect.success.descb: "Họ đón chào ngươi nồng nhiệt"
 podregionalpersons.8.critical.failure.effect.descb: "Họ nghi ngờ..."
 podregionalpersons.9.t: "Đại Sảnh của Ulf III"
 podregionalpersons.9.desc: "Trận chiến diễn ra ác liệt, đúng như ngươi dự đoán, các Pháp sư Rune bị bất ngờ, nhưng không phải không có phòng thủ. Phần lớn lực lượng của ngươi đã bị thương, hoặc bị giết hẳn, bởi bẫy, dân thường hay chính các pháp sư.\nNhưng giờ đây, ngươi đã ở trong chính Đại Sảnh, chỉ còn thủ lĩnh của họ đứng trước mặt ngươi. Và, phía sau hắn, ngươi đã có thể thấy ánh vàng lấp lánh của kho báu nổi danh...\nNgươi có thể chạy đi và vơ vét càng nhiều vàng càng tốt trước khi bỏ chạy. Hoặc ngươi có thể thử thách đấu với vị pháp sư Bắc Âu quyền năng này để giành trọn phần thưởng."
 podregionalpersons.9.a: "Ta không sợ gã này"
 podregionalpersons.9.effect.success.desc: "Ngươi chém tên ngốc này làm đôi! Vàng đã thuộc về ngươi!"
 podregionalpersons.9.success: "Một chiến thắng trọn vẹn!"
 podregionalpersons.9.critical.failure.effect.desc: "Ngươi đã không chuẩn bị kỹ..."
 podregionalpersons.9.critical.failure: "Kết Thúc"
 podregionalpersons.9.b: "Ta không sợ gã này... nhưng ta vẫn thích chạy hơn"
 podregionalpersons.10.t: "Đại Sảnh của Ulf III"
 podregionalpersons.10.desc: "Ngươi đã bị đánh bại hoàn toàn. Các Pháp sư Rune có bẫy, hệ thống cảnh báo huyền bí và dân thường hoàn toàn đứng về phía họ. Đội quân của ngươi cầm cự vừa đủ lâu để cho phép một nhóm nhỏ trong số các ngươi chạy thoát bằng con thuyền mà các ngươi dùng để đến đây.\nGiờ đây, ngươi phải chuẩn bị cho tương lai, vì thất bại này chắc chắn sẽ đè nặng lên uy tín của ngươi ở quê nhà. Dù vậy ngươi vẫn còn quyền kiểm soát câu chuyện được kể lại..."
 podregionalpersons.10.a: "Đó là một mưu kế để thanh trừng lũ phản bội trong vương quốc ta!"
 podregionalpersons.10.b: "Chúng có hàng trăm tên! Và chính Odin cũng chiến đấu cùng chúng!"
 podregionalpersons.11.t: "Đại Sảnh của Ulf III"
 podregionalpersons.11.desc: "Ngươi đã khiến các Pháp sư Rune tin rằng ngươi đứng về phía họ. Nhờ vậy, đã quá muộn khi cuối cùng họ hiểu ra bản chất thật của ngươi. Lực lượng của ngươi đã tàn sát phần lớn nhóm này và chiếm quyền kiểm soát ngôi làng.\nNhưng giờ đây, ngươi thấy hai thành viên còn sống sót của Nhóm đang hành động. Thủ lĩnh của họ, một người Bắc Âu cường tráng tên Brand, đang cố ghìm chân ngươi trong khi thành viên còn lại thu gom kho báu để tẩu thoát.\nNếu ngươi mất thời gian với Brand, ngươi sẽ mất một phần vàng, nhưng có khả năng đạt được một tù nhân hữu ích..."
 podregionalpersons.11.a: "Người này đáng giá hơn cả vàng bạc..."
 podregionalpersons.11.b: "Vàng! Nhiều vàng hơn nữa!"
 podregionalpersons.12.t: "Đại Sảnh của Ulf III"
 podregionalpersons.12.desc: "Họ nhận ra mưu kế của ngươi khá dễ dàng. Và họ đã đánh bại ngươi hoàn toàn ngay khi hiểu ra ngươi đã nói dối về ý định thật sự của mình.\nNgười của ngươi chật vật giữ vững trận địa vừa đủ để cho phép ngươi chạy thoát đến con thuyền mà các ngươi dùng để đến đây. Dĩ nhiên, thất bại này sẽ là một đòn giáng nặng nề vào uy tín của ngươi ở quê nhà nhưng... ngươi vẫn có thể kiểm soát câu chuyện của tình huống này, phần nào."
 podregionalpersons.12.a: "Đó là một mưu kế để thanh trừng lũ phản bội trong vương quốc ta!"
 podregionalpersons.12.b: "Chúng có hàng trăm tên! Và chính Odin cũng chiến đấu cùng chúng!"
 podregionalpersons.13.t: "Đại Sảnh của Ulf II"
 podregionalpersons.13.desc: "Các Pháp sư Rune khó mà thuyết phục được. Họ là một nhóm mệt mỏi, đã ẩn náu quá lâu, nhưng truyền thống chung của các ngươi đã giúp tìm được tiếng nói chung. Ngươi cho họ biết rằng vị trí của họ đã bị lộ và những kẻ khác sẽ đến với ý định thù địch hơn ngươi.\nDo đó, giờ đây họ đang chuẩn bị rời đi, và đề nghị ngươi một phần nhỏ kho báu của họ để tưởng thưởng cho sự giúp đỡ. Dù vậy, nếu ngươi đủ thuyết phục, ngươi có thể khiến họ gia nhập vương quốc của ngươi và hưởng sự bảo hộ của ngươi, điều này rõ ràng sẽ mang lại nhiều lợi ích hơn."
 podregionalpersons.13.a: "Hãy đi cùng chúng ta! Ragnarok vẫn có thể tránh được"
 podregionalpersons.13.effect.success.desc: "Họ đã bị thuyết phục!"
 podregionalpersons.13.critical.failure.effect.desc: "Họ không bị thuyết phục..."
 podregionalpersons.13.b: "Cảm ơn các huynh đệ, chúc thượng lộ bình an"
 podregionalpersons.13.critical.failure: "Họ không bị thuyết phục..."
 podregionalpersons.14.t: "Đại Sảnh của Ulf III"
 podregionalpersons.14.desc: "Ngươi đã có thể thuyết phục các Valdaermen gia nhập vương quốc của ngươi, và chấp nhận sự bảo hộ của ngươi. Họ đã bắt đầu mang lại sự giúp đỡ đáng kể tại kinh đô của ngươi, dùng năng lực huyền bí của họ để phụ giúp thường dân.\nMặc dù... họ cũng mang theo kho báu của mình khi đến đây, và ngươi có thể đâm sau lưng họ, chiếm lấy kho báu cho riêng mình, rồi trục xuất các Pháp sư Rune. Ngươi chắc rằng Odin sẽ không phiền lòng."
 podregionalpersons.14.a: "Hãy để những người bạn mới của chúng ta cảm thấy như ở nhà"
 podregionalpersons.14.b: "...Vàng vẫn là vàng"
 podregionalpersons.15.t: "Người Cathar Cuối Cùng"
 podregionalpersons.15.desc: "Một cá nhân kỳ lạ vừa đến triều đình ngươi gần đây. Cậu bé trẻ tuổi này rõ ràng là người tị nạn từ Montségur, pháo đài cuối cùng của phái Cathar, mới thất thủ trước quân Thập Tự Chinh. Ngươi đã nghe nhiều báo cáo mâu thuẫn về sự kiện này, từ kho báu nổi tiếng của phái Cathar được giấu đi trước cuộc vây hãm, đến chuyện 'Chúa Kitô của phái Cathar' nguyền rủa những người Cơ Đốc khi bị đưa lên giàn thiêu.\nNgươi không thể phủ nhận lòng mộ đạo của cậu bé này, nhưng để cậu ta thuyết giảng tại triều đình ngươi có thể nguy hiểm, vì phái Cathar có nhiều kẻ thù hơn là bạn bè..."
 podregionalpersons.15.a: "Mời cậu ta vào một cuộc tranh luận thần học"
 podregionalpersons.15.b: "Để cậu ta nói, nhưng theo dõi sát sao"
 podregionalpersons.15.c: "Đuổi cậu ta đi, cậu ta chỉ mang đến rắc rối"
 podregionalpersons.16.t: "Người Cathar Cuối Cùng II"
 podregionalpersons.16.desc: "Cuộc tranh luận thật thú vị, và ngươi đã có thêm nhiều cuộc khác kể từ đó. Có lẽ những 'Kẻ Thuần Khiết' đã có lý? Cậu bé nói về một con đường để ngươi theo đuổi đức tin chân chính, ngay cả trong tình trạng bị nguyền rủa của ngươi.\nThật cám dỗ, nhưng xét về chính trị, việc ngươi cải đạo sang một tín ngưỡng bị nghi kỵ sâu sắc có thể gây ra hậu quả nghiêm trọng..."
 podregionalpersons.16.a: "Sự cứu rỗi linh hồn ta đáng giá hơn thứ chính trị tầm thường"
 POD_faith_commited_modifier: "Tìm Thấy Thiên Mệnh"
 POD_faith_commited_modifier_desc: "#N Cải đạo qua giao diện tín ngưỡng sẽ tốn kém khủng khiếp chừng nào bổ trợ này còn hiệu lực. #!"
 podregionalpersons.16.b: "Ta đã rất vui với những cuộc trò chuyện của chúng ta, nhưng giờ ngươi phải rời đi"
 podregionalpersons.17.t: "Người Cathar Cuối Cùng II"
 podregionalpersons.17.desc: "Vì ngươi vẫn chưa đuổi cậu ta khỏi triều đình, cậu bé trẻ tuổi đã bắt đầu xem ngươi như một trong số ít $pod_cainites$ dễ chịu quanh đây. Do đó, cậu ta đã đề xuất ý tưởng để những người tị nạn khác đến phụng sự ngươi, điều này chắc chắn sẽ giúp ích cho sự thịnh vượng của vương quốc ngươi.\nMột hướng hành động khác là bắt giữ và 'chất vấn' cậu bé này cho đến khi cậu ta tiết lộ tất cả những gì mình biết về kho báu huyền thoại của Montségur..."
 podregionalpersons.17.a: "Người của ngươi được chào đón ở đây"
 podregionalpersons.17.b: "Hãy nói về vàng bạc..."
 podregionalpersons.18.t: "Con Quái Vật"
 podregionalpersons.18.desc: "Ai đó... hoặc thứ gì đó đang rình rập trên các con phố thành phố ngươi vào ban đêm. Và đó không phải người của ngươi. Thứ này đã bị cáo buộc giết người hàng loạt, theo cách ghê rợn nhất. Ngay cả vài đặc vụ của ngươi, dù đã dày dạn kinh nghiệm, cũng tỏ ra bất an trước những cảnh tượng kinh hoàng họ chứng kiến. Những tin đồn còn tăm tối hơn nói về những thí nghiệm thuộc loại phi phàm bất chính nhất.\nThành phố đang co rúm trong sợ hãi và ngươi phải hành động trước khi người dân bắt đầu tìm hiểu quá sâu về đời sống ban đêm. Ngươi có thể kín đáo báo động Tòa Dị Giáo phàm nhân, hy vọng họ sẽ ngăn chặn hắn. Hoặc ngươi có thể để hắn tự do hoành hành một thời gian, và tìm ra quy luật trong sự điên loạn của hắn. Cuối cùng, ngươi cũng có thể tăng cường tuần tra và lính canh vào ban đêm, khiến hắn phải sợ mà chạy sang một thị trấn khác, dễ bị tổn thương hơn." 
 podregionalpersons.18.a: "Để Thánh Thiện đấu với Tà Ác"
 podregionalpersons.18.custom: "Điều này sẽ khiến ngươi bị lộ đôi chút, nhưng hy vọng sẽ ngăn được con quái vật này"
 podregionalpersons.18.b: "Chắc hẳn phải có một phương pháp trong sự điên loạn của hắn"
 podregionalpersons.18.customb: "Con quái vật sẽ tiếp tục cơn cuồng loạn của nó, nhưng có lẽ một manh mối sẽ xuất hiện"
 podregionalpersons.18.c: "Dọa cho hắn chạy đi"
 podregionalpersons.18.customc: "Ngươi sẽ giúp lính canh phàm nhân vào ban đêm, đảm bảo hắn rời khỏi thành phố ngươi vĩnh viễn"
 podregionalpersons.19.t: "Con Quái Vật II"
 podregionalpersons.19.desc: "Nó phản tác dụng. Thảm hại.\nThứ ẩn nấp trong bóng đêm đã phát hiện đội Dị Giáo mà ngươi kín đáo tung theo dấu vết hắn và đã làm gương bằng chúng... theo cách khá ghê rợn, ngay giữa thị trấn.\nThành phố đang hoảng loạn, và ngươi đã nghe tin về một đội tinh nhuệ các đặc vụ của Chúa Trời đang trên đường thanh tẩy thị trấn. Ngay cả khi điều đó có nghĩa là thiêu rụi nó thành tro bụi.\nVà ngươi vẫn chưa có manh mối nào về việc đây là ai hay là thứ gì! Triều đình ngươi đang hoảng loạn, van xin ngươi hãy im hơi lặng tiếng và quên đi công việc đáng nguyền rủa này trước khi quá muộn..." 
 podregionalpersons.19.a: "Ta sẽ biết sự thật, dù ta có phải tự mình tìm ra nó!"
 podregionalpersons.19.custom: "Khi Tòa Dị Giáo siết chặt vòng vây quanh thành phố ngươi, ngươi tiếp tục cuộc điều tra của mình..."
 podregionalpersons.19.b: "...Hãy để chúng ta quên hết chuyện này đi"
 podregionalpersons.19.customb: "Ngươi từ bỏ cuộc săn này, và im hơi lặng tiếng trong khi Tòa Dị Giáo lùng sục khắp nơi"
 podregionalpersons.20.t: "Con Quái Vật III"
 podregionalpersons.20.desc: "Hắn đã tìm ra ngươi. Con quái vật đã khủng bố thành phố ngươi, và khiến cả một đội quân Thẩm Tra Viên chạy khắp nơi, đang đứng trước mặt ngươi. Một người đàn ông Đức bình thường đến ngạc nhiên tên Strohmann đang lặng lẽ nhìn quanh những triều thần bất an của ngươi.\n'Ta đã nghe nhiều về giống loài của ngươi. Thật hấp dẫn. Ta muốn học hỏi thêm. Có lẽ chúng ta có thể đi đến một thỏa thuận? Ta giúp ngươi đối phó với những Thẩm Tra Viên phiền toái đó và, đổi lại, ngươi kể cho ta tất cả những gì cần biết về sinh học ma cà rồng.'\nNgười này rõ ràng không bình thường, và ngay cả khi là phàm nhân, hắn vẫn có thể khiến hầu hết mọi người khó chịu. Đây là điều ngươi có thể tận dụng..." 
 podregionalpersons.20.a: "Một đề nghị hấp dẫn"
 podregionalpersons.20.b: "Đó là khởi đầu của một tình bạn tuyệt đẹp..."
 podregionalpersons.21.t: "Con Quái Vật II"
 podregionalpersons.21.desc: "Nó phản tác dụng. Thảm hại.\nNgươi chưa tìm ra manh mối nào về con quái vật và, tệ hơn, hắn đã bắt đầu nhắm vào chính người của ngươi, với một đặc vụ đã mất tích mà ngươi nghi ngờ sẽ không quay lại. Hoặc không còn nguyên vẹn.\nKhi xác chất chồng, thành phố đang hoảng loạn, và ngươi đã nghe tin về một đội tinh nhuệ các đặc vụ của Chúa Trời đang trên đường thanh tẩy thị trấn. Ngay cả khi điều đó có nghĩa là thiêu rụi nó thành tro bụi.\nVà ngươi vẫn chưa có manh mối nào về việc đây là ai hay là thứ gì! Triều đình ngươi đang hoảng loạn, van xin ngươi hãy im hơi lặng tiếng và quên đi công việc đáng nguyền rủa này trước khi quá muộn..." 
 podregionalpersons.21.a: "Ta sẽ biết sự thật, dù ta có phải tự mình tìm ra nó!"
 podregionalpersons.21.custom: "Khi Tòa Dị Giáo siết chặt vòng vây quanh thành phố ngươi, ngươi tiếp tục cuộc điều tra của mình..."
 podregionalpersons.21.b: "...Hãy để chúng ta quên hết chuyện này đi"
 podregionalpersons.21.customb: "Ngươi từ bỏ cuộc săn này, và im hơi lặng tiếng trong khi Tòa Dị Giáo lùng sục khắp nơi"
 podregionalpersons.22.t: "Kẻ Trầm Lặng"
 podregionalpersons.22.desc: "Một ma cà rồng tên Bakr đã bị đưa đến trước mặt ngươi. Tên Assamite này đã tấn công một nhóm hiệp sỹ của cuộc Thập Tự Chinh lần thứ Bảy gần vùng ảnh hưởng của ngươi mà không có sự cho phép của ngươi. Hành vi này không thể dung thứ, vì chắc chắn sẽ thu hút sự chú ý không mong muốn đến lãnh địa ngươi.\nBakr xin lỗi, và giải thích rằng hắn đang giải thoát một chiến binh Hồi giáo trẻ tuổi, người mà hắn định $pod_Embrace$. Hắn đề nghị một khoản vàng lớn để chứng tỏ không có ý xúc phạm ngươi. Ngươi có thể chấp nhận nó... hoặc ngươi có thể chiếm lấy triển vọng hấp dẫn này cho riêng mình, dù chưa biết nhiều về hắn ta." 
 podregionalpersons.22.a: "Tiễn Bakr ra cửa, và đưa đồ đệ hắn đến phòng ta"
 podregionalpersons.22.custom: "Ngươi sẽ biết thêm về chiến binh trẻ tuổi này, nhưng điều này có thể mang lại hậu quả"
 podregionalpersons.22.b: "Ngươi được tha thứ"
 podregionalpersons.23.t: "Kẻ Trầm Lặng II"
 podregionalpersons.23.desc: "Ngươi đã biết được tên của chàng trai trẻ mà ngươi 'giải cứu' khỏi Bakr, Tariq. Đáng buồn thay, quân Thập Tự Chinh cũng biết rằng tù nhân của họ giờ đang được ngươi chăm sóc, và họ có vẻ quyết tâm đến ngạc nhiên để giành lại hắn. Đủ để họ giờ đây phát động một cuộc tấn công quy mô lớn, khá liều lĩnh, vào lãnh địa ngươi.\nNgươi có thể cố đánh lui họ, nhưng ngươi có nguy cơ thu hút sự chú ý không mong muốn hơn nữa với sức mạnh siêu nhiên của mình. Hoặc ngươi có thể để Tariq lại cho họ và chỉ đơn giản quên đi sự phiền toái này." 
 podregionalpersons.23.a: "Ta hy vọng cậu ta xứng đáng với việc này..."
 podregionalpersons.23.custom: "Ngươi bỏ lại Tariq, và cả câu chuyện này, phía sau"
 podregionalpersons.23.b: "Ta không muốn dính vào chuyện này nữa"
 podregionalpersons.23.effect.success.desc: "Một chiến thắng, giờ hãy lo cho đồ đệ của ngươi..."
 podregionalpersons.23.critical.failure.effect.desc: "Chúng giành lại được Tariq..."
 podregionalpersons.23.critical.failure: "Chúng đã giành lại được Tariq..."
 podregionalpersons.24.t: "Kẻ Trầm Lặng III"
 podregionalpersons.24.desc: "Ngươi đã đối phó khá tốt với cuộc phản công của quân Thập Tự Chinh. Điều ngươi không lường trước được là cái chết đột ngột của các vệ sĩ ngươi và bầu không khí im lặng đột ngột càng kỳ lạ hơn bao trùm lều trại ngươi. Nó chỉ bị phá vỡ bởi một câu nói yếu ớt 'Ta lấy lại thứ thuộc về ta" khi ngươi chợt nhận ra rằng Bakr đang ở đây, và hắn chưa quên rằng ngươi đã đánh cắp hậu duệ tương lai của hắn.\nGiờ ngươi phải đối phó với một Assamite già nua quyền năng, quyết tâm hủy diệt ngươi, chỉ với một phàm nhân trẻ tuổi, dù can đảm, bên cạnh." 
 podregionalpersons.24.a: "Hãy khiêu vũ nào..."
 podregionalpersons.24.custom: "Không mấy vinh quang, nhưng hiệu quả"
 podregionalpersons.24.b: "Ta sẽ chỉ chộp lấy Tariq và chạy như bay"
 podregionalpersons.24.effect.success.desc: "Một chiến thắng, Tariq cuối cùng đã thuộc về ngươi!"
 podregionalpersons.24.critical.failure.effect.desc: "Nếu ngươi thất bại, cái chết của ngươi sẽ đến nhanh chóng..."
 podregionalpersons.24.critical.failure: "Và thế là kết thúc..."
 podregionalpersons.24.success: "Ngươi đã thắng!"
 podregionalpersons.25.t: "Hậu Quả của Một Giấc Mơ"
 podregionalpersons.25.desc: "Dù là một sự việc mang tính đạo đức mập mờ, cuộc Thập Tự Chinh lần thứ Tư đã mang lại của cải lớn cho các thành bang Ý, chủ yếu từ các di vật Hy Lạp bị cướp phá. Nhiều người, kể cả $pod_cainites$ Byzantine, cũng đang chạy trốn khỏi hỗn loạn và tìm nơi trú ẩn ở nơi khác.\nGần đây ngươi nghe về một đoàn lữ hành như vậy, đang di chuyển không xa lãnh địa ngươi. Như phần lớn người tị nạn, họ sẽ là con mồi dễ dàng cho đặc vụ của ngươi, và có triển vọng cướp lấy bất kỳ của cải nào họ mang theo.\nMột hướng hành động khác là chào đón họ tại triều đình ngươi. Một hành động cao thượng, cũng có thể mang lại những khả năng mới... chưa ai từng nói ngươi rộng lượng vô cớ." 
 podregionalpersons.25.a: "Hãy chào đón những người anh em họ nghèo khó của chúng ta"
 podregionalpersons.25.b: "Mang cho ta bất cứ thứ gì có giá trị!"
 podregionalpersons.25.c: "Những chuyện như vậy tầm thường với ta"          
 podregionalpersons.26.t: "Hậu Quả của Một Giấc Mơ II"
 podregionalpersons.26.desc: "Những người tị nạn Byzantine biết ơn sự giúp đỡ của ngươi. Họ nói về thành phố vĩ đại của họ, Constantinople, và vị lãnh đạo tinh thần còn vĩ đại hơn của họ, Michael.\nVị Thượng Phụ của Giấc Mộng đã sụp đổ cùng thành phố của mình nhưng họ vẫn nói về ông ta như một thực thể gần như thần thánh hơn là chỉ đơn thuần $pod_cainite$. Như một món quà, một người trong số họ đang trao cho ngươi một mảnh vỡ của 'tấm gương' Hagia Sophia nơi Michael từng ngự trước khi sụp đổ. Ngươi có thể nhận nó... nhưng chắc chắn có gì đó kỳ lạ về di vật này." 
 podregionalpersons.26.a: "Sự hiện diện của các ngươi đã đủ rồi, cảm ơn"
 podregionalpersons.26.b: "...báu vật của ta"
 podregionalpersons.27.t: "Hậu Quả của Một Giấc Mơ II"
 podregionalpersons.27.desc: "Ngươi dễ dàng đánh bại hệ thống phòng thủ ít ỏi của đoàn lữ hành. Không có nhiều chiến lợi phẩm như ngươi hy vọng, nhưng vẫn đủ để đáng công. Dù vậy, một vật thể đặc biệt đã bị người của ngươi tranh giành kịch liệt trong lúc chia chiến lợi phẩm.\nMảnh thủy tinh nhỏ này, có lẽ từ một tấm gương hay ô cửa sổ, có một hiệu ứng kỳ lạ lên con người, như thể đang gọi tận đáy tâm hồn họ. Ngươi biết về Michael, vị ma cà rồng gần như thần thánh của Constantinople trước khi sụp đổ... Có thể nào nó liên quan đến hắn?" 
 podregionalpersons.27.a: "Ta sẽ chỉ lấy vàng thôi"
 podregionalpersons.27.b: "Đưa cho ta thứ đó!"
 podregionalpersons.28.t: "Hậu Quả của Một Giấc Mơ III"
 podregionalpersons.28.desc: "Mảnh vỡ luôn ở bên ngươi suốt những ngày qua. Nó thậm chí còn xuất hiện trong giấc mơ ngươi! Những giấc mơ về Constantinople, một đế chế, một bộ ba methuselah hợp nhất hướng đến một xã hội lý tưởng vĩ đại hơn...\nNgươi có thể cảm nhận nó đang dần dần bào mòn ý chí của ngươi và khiến ngươi nhớ lại những điều mà lẽ ra ngươi không nên biết. Chẳng bao lâu nữa, ngươi sẽ không còn là con người như trước, và đây có thể là cơ hội cuối cùng của ngươi để giữ được sự tỉnh táo còn nguyên vẹn..." 
 podregionalpersons.28.a: "Giấc Mộng chính là thực tại của ta"
 podregionalpersons.28.b: "Ta không phải con rối của ai cả!"
 podregionalpersons.29.t: "Padre Craneo"
 podregionalpersons.29.desc: "Khi cuộc Reconquista của phàm nhân vẫn còn hoành hành tại Iberia, một cơ hội đã được trình bày cho ngươi. Trong một trận chiến, một người lính tên Roderigo đã được thấy thể hiện hành vi kỳ lạ và những năng lực kỳ lạ hơn. Tin đồn rằng hắn là một trong những Pháp sư huyền thoại, bậc thầy uốn nắn thực tại. Có lẽ là một kẻ trẻ tuổi, nếu không thì đặc vụ của ngươi chắc chắn đã không thể đưa hắn đến triều đình ngươi để yết kiến.\nNgười đàn ông trầm lặng này dường như không hề nao núng trước đoàn tùy tùng của ngươi, có vẻ hài lòng khi quan sát tất cả các ngươi từ khóe mắt. Ngươi sẽ làm gì với hắn?" 
 podregionalpersons.29.a: "Ta có quyền tiếp cận nhiều văn bản mà ngươi có thể thấy thú vị"
 podregionalpersons.29.b: "Lừa hắn gia nhập việc phụng sự ngươi"
 podregionalpersons.29.effect.success.desc: "Roderigo lưu lại triều đình ngươi hiện thời"
 podregionalpersons.29.critical.failure.effect.desc: "Roderigo rời khỏi triều đình ngươi"
 podregionalpersons.29.critical.failure: "Roderigo đã rời đi..."
 podregionalpersons.29.c: "Ta không có việc gì cho hắn"
 podregionalpersons.30.t: "Padre Craneo II"
 podregionalpersons.30.desc: "Roderigo đã thích nghi tốt với triều đình ngươi, và đang tận hưởng việc học hỏi thêm về cái chết từ ngươi và các ma cà rồng khác. Niềm say mê của hắn với thế giới bên kia dường như không có giới hạn và, dù ngươi học được nhiều điều khi trò chuyện với hắn, ngươi phải thừa nhận rằng nó bắt đầu khiến ngươi lo lắng.\nNgươi có thể cắt đứt việc nghiên cứu của Roderigo bằng cách Trao truyền cho hắn và đưa hắn vào gần tầm ảnh hưởng của ngươi hơn hoặc chỉ đơn giản chờ xem." 
 podregionalpersons.30.a: "Hãy cùng học hỏi thêm"
 podregionalpersons.30.b: "Đã đến lúc gia nhập cùng chúng ta"
 podregionalpersons.31.t: "Padre Craneo"
 podregionalpersons.31.desc: "Roderigo đã ngoan ngoãn chấp nhận quyết định của ngươi về việc dừng nghiên cứu của hắn và có thể sẽ $pod_Embrace$ hắn. Như thường lệ, hắn kỳ lạ giữ im lặng về cảm xúc của mình trong chuyện này và ngươi không biết liệu hắn coi đó là hình phạt hay phần thưởng.\nDù sự thật là gì, giờ hắn đã sẵn sàng phục vụ tại triều đình ngươi cho bất kỳ nhiệm vụ hay tương lai nào ngươi chọn." 
 podregionalpersons.31.a: "Một vận mệnh mới đang chờ đón hắn"
 podregionalpersons.32.t: "Padre Craneo III"
 podregionalpersons.32.desc: "Vị khách pháp sư của ngươi đã khám phá ra những sự thật choáng váng về cái chết và thế giới bên kia, những điều mà ngươi thậm chí còn chưa dám nghĩ đến trước khi hắn đến triều đình ngươi.\nHắn vẫn bình thản về những chuyện như vậy, và thẳng thắn cho ngươi biết rằng, nếu ngươi tiếp tục bảo trợ hắn, còn nhiều điều hơn nữa đang trong tầm với. Nhưng ngươi có cảm giác rằng mình đang đi quá xa quá nhanh..." 
 podregionalpersons.32.a: "Sự thật đã gần kề!"
 podregionalpersons.32.b: "Hãy dừng lại ở đây"
 podregionalpersons.33.t: "Padre Craneo IV"
 podregionalpersons.33.desc: "Những đêm này, ngươi hiếm khi có mặt tại triều đình mình nữa, thích trò chuyện với Roderigo hơn về những hiểu biết hấp dẫn của hắn về cái chết và âm giới. Vị pháp sư thậm chí có vẻ sắp mở được một cánh cổng đến chính Enoch, thành phố huyền thoại của các Tổ Tiên! Những kỳ quan gì đang chờ ngươi tại đó?\nNgươi không thể chờ để tiếp tục cuộc hành trình hấp dẫn này, nhưng một cảm giác day dứt đang giữ ngươi lại. Như thể ngươi đang nhìn thẳng vào vực thẳm..." 
 podregionalpersons.33.a: "Điều gì nằm phía bên kia?"
 podregionalpersons.33.b: "Ta phải chấm dứt sự điên rồ này ngay bây giờ!"
 podregionalpersons.33.custom: "Cơ hội cuối cùng để quay đầu..."
 podregionalpersons.34.t: "Padre Craneo V"
 podregionalpersons.34.desc: "Ngươi đã thấy Enoch! Ngươi đã thấy thành phố tuyệt diệu, Ngai Vàng Đen của Caine... mọi thứ! Roderigo đã ra đi, nhưng chẳng cần đến hắn nữa, vì mọi thứ giờ đã rõ ràng hơn nhiều đối với ngươi. Ngươi vượt lên trên những mối lo tầm thường của các ma cà rồng khác vì ngươi biết sự thật. Ngay cả khi ngươi không thể nhớ nó phần lớn thời gian...\nCũng không sao, không quan trọng, ngươi đã thấy Enoch!... hay đó là Irad? Mọi thứ thật mờ nhòe..." 
 podregionalpersons.34.a: "Ta giờ đã vượt lên trên chính trị tầm thường"
 podregionalpersons.35.t: "Con Chó Săn"
 podregionalpersons.35.desc: "Khi nước Anh vẫn đang tiến hành cuộc chiến dường như bất tận với Pháp, ngươi nghe về một cơ hội được trình bày bởi cuộc xung đột này. Một phàm nhân tên Edmund FitzHenry dường như hơn cả những gì hắn thể hiện. Có vẻ là con hoang của một gia tộc quý tộc nhỏ, có vẻ như chàng Edmund trẻ tuổi biết nhiều hơn về siêu nhiên so với phần lớn phàm nhân.\nĐiều này có thể giải thích những chiến thắng vang dội gần đây của hắn trên khắp các chiến trường nước Pháp. Ngươi có thể muốn điều tra thêm, nhưng những ma cà rồng khác đã bám theo dấu vết hắn." 
 podregionalpersons.35.a: "Ta sẽ thuyết phục họ rằng hắn là con mồi của ta"
 podregionalpersons.35.b: "Đưa họ đến một dấu vết giả"
 podregionalpersons.35.effect.success.desc: "Họ bị đánh lạc hướng khỏi mục tiêu của ngươi"
 podregionalpersons.35.critical.failure.effect.desc: "Họ vẫn đang cạnh tranh với ngươi"
 podregionalpersons.35.c: "Ta không có việc gì cho tên phàm nhân này"
 podregionalpersons.37.t: "Con Chó Săn: Bị Đánh Lạc Hướng"
 podregionalpersons.37.desc: "Đối thủ của ngươi vẫn đang bám sát dấu vết của Edmund, và họ đang khiến cuộc điều tra của ngươi càng thêm khó khăn. Ngươi đã cố tỏ ra kín đáo về việc này cho đến giờ, nhưng có lẽ đã đến lúc phải dùng đến hành động quyết liệt hơn nếu ngươi vẫn muốn tiếp tục cuộc truy tìm này." 
 podregionalpersons.37.a: "Ai cũng có giá của mình"
 podregionalpersons.37.b: "Tung Tòa Dị Giáo theo dấu vết chúng. Điều đó sẽ khiến chúng bận rộn."
 podregionalpersons.37.c: "Việc này không đáng"
 podregionalpersons.36.t: "Con Chó Săn II"
 podregionalpersons.36.desc: "Ngươi bắt đầu hiểu thêm về lai lịch của Edmund FitzHenry này. Hắn thực ra là thứ mà bọn Lupine gọi là 'Thân Tộc', dường như có nghĩa là một thành viên trong đại gia tộc mở rộng của lũ dã thú man rợ này. Điều đó có thể giải thích sức mạnh phi thường và hiểu biết kỳ lạ về siêu nhiên của hắn.\nCòn thú vị hơn nữa, hắn đang trốn chạy khỏi chúng vì một lý do nào đó, điều này có thể có nghĩa là hắn sẽ hoan nghênh sự giúp đỡ của ngươi. Đáng buồn thay, điều này cũng có nghĩa là lũ người sói này đang siết chặt vòng vây quanh hắn và sẽ không dễ chịu gì với sự can thiệp của ngươi..." 
 podregionalpersons.36.a: "Lũ dã thú này tôn trọng sức mạnh. Hãy đập vỡ vài cái đầu của chúng."
 podregionalpersons.36.b: "Chuẩn bị một cuộc phục kích!"
 podregionalpersons.36.effect.success.desc: "Lũ sói bị đẩy lùi về khu rừng của chúng"
 podregionalpersons.36.critical.failure.effect.desc: "Lũ người sói không hề sợ hãi"
 podregionalpersons.36.c: "Việc này đang trở nên quá nguy hiểm. Ta bỏ cuộc."
 podregionalpersons.38.t: "Con Chó Săn: Bị Đánh Lạc Hướng"
 podregionalpersons.38.desc: "Ngươi không thể loại bỏ được lũ người sói đang tìm kiếm Edmund. Và giờ đây, chúng rõ ràng cũng đang bám theo dấu vết ngươi. Trước khi có thể tiếp tục cuộc truy đuổi, trước tiên ngươi phải giải quyết chúng một lần và mãi mãi.\nNgươi sẽ cố đánh lạc hướng chúng, hay chỉ để chúng trút giận lên lãnh địa ngươi?" 
 podregionalpersons.38.a: "Khói và gương"
 podregionalpersons.38.b: "Vài phàm nhân ít hơn trong lãnh địa ta không đáng bận tâm"
 podregionalpersons.38.c: "Việc này không đáng"
 podregionalpersons.39.t: "Con Chó Săn III"
 podregionalpersons.39.desc: "Cuối cùng ngươi cũng lần theo dấu vết được Edmund FitzHenry này đến một chiến trường Pháp ảm đạm. Người đàn ông này xứng đáng với danh tiếng của mình, là một chỉ huy sắc sảo và một chiến binh vững vàng, rõ ràng được củng cố bởi dòng máu Lupine trong huyết quản.\nNhưng phàm trần không chờ đợi ai và vì thế ngươi đã tiếp cận hắn với lời đề nghị bảo vệ khỏi những kẻ săn người sói của hắn và một lời đề nghị bất tử còn hấp dẫn hơn. Edmund, dĩ nhiên, quan tâm và đã gia nhập triều đình ngươi.\nHắn chỉ đơn giản yêu cầu ngươi gọi hắn bằng tên khai sinh, giờ khi hắn không còn phải giấu giếm dòng dõi mình nữa." 
 podregionalpersons.39.a: "Chào mừng đến với màn đêm, 'Talley'"
 #podregionalpersons.41.t: "Storm From The East"
 #podregionalpersons.41.desc: "The Gangrel bloodline known as [Glossary('Anda','podgloss.anda')] has enjoyed a long period of prosperity since the rise of their mortal counterparts, the Mongols, as masters of China. They have used this connection to assume control over several key cities of the Celestial Empire, killing or dislodging the native $pod_wan_kuei$.\nBut this time has come to an end, as the Yuan dynasty lies shattered by the rise of the Ming, the $pod_wan_kuei$ are back, unified under a new structure, the 'Quincunx'. They have already purged the Anda bloodline from their native land and most of the eastern steppes and now are looking westwards. It seems they won't stop until the last Anda lies on the ground, dying a slow and painful death..." 
 #podregionalpersons.41.a: "A reckoning has come"
 #podregionalpersons.41.player_warningb: "A powerful army of $pod_wan_kuei$ will appear in Orgoo soon"
 #first_quincunxwarlord_event_troops: "Quincunx Vanguard"

                 
 elaine_knights1_modifier: "Những Nhà Vô Địch Đã Mất"
 elaine_knights1_modifier_desc: "Một số nhà vô địch của ngươi vẫn chưa quay về từ cuộc thám hiểm cùng Elaine de Calinot"

 elaine_knights2_modifier: "Những Nhà Vô Địch Đã Mất"
 elaine_knights2_modifier_desc: "Một số nhà vô địch của ngươi vẫn chưa quay về từ cuộc thám hiểm cùng Elaine de Calinot"

 elaine_knights3_modifier: "Những Nhà Vô Địch Đã Mất"
 elaine_knights3_modifier_desc: "Một số nhà vô địch của ngươi vẫn chưa quay về từ cuộc thám hiểm cùng Elaine de Calinot"
             
 podregionalpersons.43.t: "Nữ Pháp Sư"
 podregionalpersons.43.desc: "Một nữ quý tộc Pháp lạ mặt gần đây đã du hành quanh Algiers, hỏi han nhiều câu hỏi về siêu nhiên. Ả có vẻ tài giỏi, vì đã có thể lần ra vị trí triều đình ngươi. Dù ngươi không chắc về ý định của ả, ngươi bối rối khi ả tự giới thiệu mình một đêm nọ và bày tỏ mong muốn hợp tác với ngươi.\nả 'Elaine de Calinot' này tự nhận là một nữ pháp sư đang trên một hành trình bí ẩn ở châu Phi, và có thể cần giúp đỡ để chuẩn bị cho cuộc thám hiểm sâu hơn vào nội địa. Ả ước tính ngươi là cơ hội tốt nhất của mình cho công việc này và đề nghị dạy ngươi vài bí mật huyền bí để đổi lại." 
 podregionalpersons.43.a: "Chúng ta có thể thỏa thuận"
 podregionalpersons.43.b: "Ta không hứng thú"
     
 podregionalpersons.44.t: "Nữ Pháp Sư II"
 podregionalpersons.44.desc: "Elaine đã trở lại, hớn hở phấn khích. Dù ả không muốn nói chính xác những gì mình tìm thấy, ả rõ ràng khao khát nhiều hơn nữa. Đề nghị của ả khá đơn giản, ngươi tăng cường đoàn vệ sĩ của ả, và ả sẽ dạy ngươi thêm nhiều điều về 'phép thuật chân chính'.\nDù viễn cảnh này chắc chắn hấp dẫn, ngươi vẫn chưa biết chính xác chuyện gì đã xảy ra với cuộc thám hiểm đầu tiên, và ánh mắt gần như điên loạn trong mắt Elaine không hề trấn an được ngươi..." 
 podregionalpersons.44.a: "Ngươi sẽ có đoàn hộ tống của mình"
  
 podregionalpersons.45.t: "Nữ Pháp Sư III"
 podregionalpersons.45.desc: "Elaine đã trở lại, xông vào triều đình ngươi gần như điên cuồng. Ả khó mà hiểu được, vì lời nói của ả khá rời rạc, giống lời lảm nhảm của kẻ điên hơn là người phụ nữ điềm tĩnh mà ngươi từng gặp trước đây. Ngươi hiểu được rằng ả vẫn muốn sự giúp đỡ của ngươi cho một cuộc tìm kiếm sâu hơn nữa về... một thứ gì đó, hay một ai đó.\nDù trông khá mất trí, ngươi biết rằng ả vẫn có thể dạy ngươi vài khái niệm chú thuật huyết mạch thú vị nhưng liệu ngươi có thực sự muốn mạo hiểm vào lúc này? Ngươi cũng có thể thử thuyết phục ả dừng lại cuộc truy tìm điên rồ này trước khi quá muộn." 
 podregionalpersons.45.a: "Thêm nhà vô địch? Tất nhiên"
 podregionalpersons.45.b: "Hãy tỉnh táo lại đi!"
 podregionalpersons.45.effect.success.desc: "Ngươi thuyết phục được ả dừng lại"
 podregionalpersons.45.critical.failure.effect.desc: "Ả xông ra khỏi triều đình ngươi, giận dữ"

 dreadful_omen_modifier: "Điềm Báo Kinh Hoàng"
 dreadful_omen_modifier_desc: "Có gì đó không ổn, ngươi có thể cảm nhận được..."

 podregionalpersons.46.t: "Nữ Pháp Sư IV"
 podregionalpersons.46.desc: "Elaine đã được tìm thấy... à, những gì còn lại của ả. Đặc vụ của ngươi đã lần theo dấu vết ả đến một ngôi làng hẻo lánh nơi ả đã tàn sát phần lớn dân cư trước khi bị giết. Theo những gì họ thu thập được, ả dường như bằng cách nào đó đã trở nên hoang dại như thể Dã Thú đã chiếm lấy ả... nhưng ả không phải ma cà rồng, theo như ngươi biết.\nKhông sao, ngươi sẽ không còn nghe về ả nữa, nhưng ngươi không thể xua đi cảm giác rằng ả đã chọc vào thứ gì đó rất nguy hiểm..." 
 podregionalpersons.46.a: "Toàn bộ chuyện này là một ý tưởng rất tồi tệ ngay từ đầu"

 Elaine_de_Calinot: "Elaine de Calinot"
 nick_inquisitive_sorceress: "Nữ Pháp Sư Hiếu Kỳ"

 podregionalpersons.47.t: "Nữ Pháp Sư IV"
 podregionalpersons.47.desc: "Ngươi đã thuyết phục Elaine dừng hành vi liều lĩnh của ả... phần nào. Ngươi ngụ ý rằng ả cũng có thể học được nhiều nếu hợp tác chặt chẽ hơn với ngươi, vì thế giới ma cà rồng cũng đầy bí mật. Canh bạc của ngươi đã thành công và ả đã chấp nhận ở lại triều đình ngươi, lao vào bất cứ điều gì mới mẻ thu hút sự chú ý của mình.\nGiờ ả đã sa vào mạng lưới của ngươi, và ngươi có thể sử dụng ả vì lợi ích riêng của mình, hoặc thậm chí cân nhắc $pod_Embrace$. Ả tài năng, dù đôi khi có phần mất trí, nhưng ngươi đã thấy, và thuần hóa, những kẻ tệ hơn." 
 podregionalpersons.47.a: "Chúc ả có một kỳ lưu trú dễ chịu"

 podregionalpersons.48.t: "Tên Mamluk"
 podregionalpersons.48.desc: "Là một $pod_cainite$ có lợi ích tại Ai Cập, ngươi có đặc vụ trong hàng ngũ lãnh đạo Fatimid phàm nhân của vương quốc này. À thì... ngươi từng có.\nMột báo cáo vừa đến với ngươi rằng đặc vụ của ngươi được tìm thấy đã chết trên một con phố ở Cairo hôm qua. Chuyện này vẫn xảy ra, nhưng với nhiều người trong số họ cùng lúc mà không có cảnh báo? Điều đó khá kỳ lạ.\nNgươi có thể chấp nhận thiệt hại tại đó hoặc điều tra thêm." 
 podregionalpersons.48.a: "Gửi đặc vụ mới"
 podregionalpersons.48.b: "Ta không hứng thú"
     
 podregionalpersons.49.t: "Tên Mamluk II"
 podregionalpersons.49.desc: "À thì... những đặc vụ mới này không trụ được lâu. Họ được tìm thấy đã chết như những người trước đó vào đầu đêm nay. Dù vậy, điều này không hề vô ích, vì ngươi nghe tin đồn rằng một phàm nhân đáng ngạc nhiên tên 'Mukhtar Bey' gần đây đã gia nhập triều đình Fatimid.\nMột Mamluk (hay chiến binh nô lệ) bẩm sinh, phàm nhân này khá năng lực và tài giỏi. Cũng rất trung thành, vì có vẻ hắn là nguyên nhân của sự bảo vệ tăng cường đột ngột đối với các lãnh đạo Fatimid.\nNgười này có thể đáng để điều tra thêm." 
 podregionalpersons.49.a: "Gửi đặc vụ mới"
 podregionalpersons.49.effect.success.desc: "Ngươi tìm thấy điều gì đó..."
 podregionalpersons.49.critical.failure.effect.desc: "Không có gì thú vị"

 podregionalpersons.50.t: "Tên Mamluk III"
 podregionalpersons.50.desc: "Có vẻ Mukhtar đã tìm ra ngươi trước khi ngươi tìm ra hắn. Cùng với một đoàn tùy tùng hùng mạnh gồm các Mamluk kỳ cựu, hắn đang tiến sát triều đình ngươi, coi đó là mối đe dọa với các chủ nhân Fatimid của mình.\nNgươi có ít thời gian để lên kế hoạch cho cuộc tấn công trực diện này. Về phần mình, Mukhtar đã chuẩn bị sẵn sàng khi ngươi nhận thấy khá nhiều đuốc và cọc nhọn trong lực lượng địch. Có thể có những lựa chọn khác, như chạy trốn hoặc dùng bất cứ điều xấu xa nào ngươi có thể đã tìm ra về hắn trước đó." 
 podregionalpersons.50.a: "Chúng ta sẽ đứng vững và chiến đấu!"
 podregionalpersons.50.effect.success.desc: "Mukhtar bị đẩy lùi"
 podregionalpersons.50.critical.failure.effect.desc: "Một trận chiến khó khăn"
 podregionalpersons.50.b: "Ta biết điều gì đó thú vị..."
 podregionalpersons.50.custom: "Lựa chọn này khả dụng vì ngươi đã thành công trong thử thách mưu kế trước đó"
 podregionalpersons.50.c: "Chạy trốn!"

 podregionalpersons.51.t: "Tên Mamluk IV"
 podregionalpersons.51.desc: "Một trận chiến ác liệt, nơi chiến thắng của ngươi chủ yếu đến từ sự biến mất đột ngột của Mukhtar trong trận đánh. Dù không rõ chuyện gì thực sự xảy ra, đặc vụ của ngươi phải mất vài ngày mới tìm lại được hắn, một mình và... đã chết hẳn.\nCó vẻ ai đó đã vội vàng Trao truyền cho hắn trong cuộc tấn công nhưng nó không thành công hoàn toàn, khiến hắn chỉ còn là một Caitiff. Trong khi ngươi bối rối về việc [Glossary('Sire','game_concept_Sire_desc')] của hắn chính xác là ai, chiến thắng cuối cùng vẫn thuộc về ngươi. Một mình và bối rối, Mukhtar cũng sẽ là mục tiêu dễ dàng để đưa vào ngục tối của ngươi, nếu ngươi chọn vậy." 
 podregionalpersons.51.a: "Phải làm gì với ngươi đây..."
 
 podregionalpersons.52.t: "Tên Mamluk IV"
 podregionalpersons.52.desc: "Một trận chiến ác liệt, nơi ngươi chỉ vừa đủ sống sót, chủ yếu nhờ sự biến mất đột ngột của Mukhtar trong trận đánh. Điều này khiến người của hắn mất tinh thần và hàng phòng ngự của ngươi đứng vững.\nDù không rõ chuyện gì thực sự xảy ra, đặc vụ của ngươi phải mất vài ngày mới nghe được tin về hắn. Có vẻ Mukhtar đã bị một ma cà rồng vô danh Trao truyền trong cuộc tấn công nhưng nó không thành công hoàn toàn, khiến hắn trở thành một Caitiff. Sự may mắn này đã giúp ngươi sống sót qua đêm đó, nhưng Mukhtar cũng vậy, và có lẽ có một mối thù cần giải quyết với ngươi." 
 podregionalpersons.52.a: "Thêm một kẻ hay bớt một kẻ..."
 
 podregionalpersons.53.t: "Tên Mamluk IV"
 podregionalpersons.53.desc: "Trong cuộc điều tra của ngươi về Mukhtar Bey, ngươi phát hiện ra điều gì đó thú vị. Tên Mamluk này thực ra là một người khá sợ hãi, che giấu điều đó đằng sau nghĩa vụ với người của hắn và ý thức trung thành mạnh mẽ của mình.\nBiết được điểm yếu này, ngươi đã chuẩn bị theo đó, và một màn phô diễn sức mạnh siêu nhiên hoành tráng (thật sảng khoái khi được xả hơi đôi lúc) đã đủ để làm suy yếu sự kiềm chế nỗi sợ hãi của Mukhtar. Không có chỉ huy, đồng bọn của hắn dễ dàng bị đánh bại, và giờ ngươi có hắn trong tay.\nBất chấp khiếm khuyết rõ ràng này của hắn, hắn có thể vẫn còn giá trị với ngươi theo cách nào đó." 
 podregionalpersons.53.a: "Phải làm gì với ngươi đây..."
 
 Mukthar_Bey: "Mukhtar Bey"
 
 genevra_interference_modifier: "Can Thiệp"
 genevra_interference_modifier_desc: "Ai đó đang can thiệp vào công việc của ngươi trong khu vực này."

 podregionalpersons.64.t: "Nữ Quý Tộc"
 podregionalpersons.64.desc: "Ai đó đang can thiệp vào công việc của Tòa Dị Giáo tại Ý. Nó bắt đầu như một cuộc tranh giành quyền lực có vẻ đơn giản: một nữ quý tộc tố cáo các đối thủ của mình với các thợ săn, buộc tội họ chứa chấp ma cà rồng trong nhà (điều mà thực ra là đúng). Sau đó nó leo thang thành những cáo buộc khác và ảnh hưởng của ả Genevra này lớn dần đến mức nhiều nhánh của Tòa Dị Giáo giờ trông cậy vào ả để thu thập tin tình báo.\nTuy nhiên điều này có một tác dụng phụ, Genevra chỉ đưa các Thẩm Tra Viên theo dấu vết những ma cà rồng rất nhỏ nhoi, và các cuộc săn lùng những mục tiêu lớn hơn đang bị đánh lạc hướng bởi tất cả con mồi dễ dàng mà các Thẩm Tra Viên háo hức tuyên bố bắt được. Ngươi có thể muốn can thiệp vào tình huống đang phát triển này." 
 podregionalpersons.64.a: "Hãy kín đáo giúp đỡ ả."
 podregionalpersons.64.b: "Đưa ả đến gặp ta!"
 podregionalpersons.64.c: "Hoặc có lẽ là không."
                    
 podregionalpersons.65.t: "Nữ Quý Tộc II"
 podregionalpersons.65.desc: "Cuối cùng ngươi cũng bắt được ả quý tộc gây rối này. Việc này khó khăn hơn ngươi tưởng nhiều, vì ả đã cắm móng vuốt của mình khá sâu vào Tòa Dị Giáo Ý, cho phép ả luôn đi trước ngươi một bước. Dù vậy, ngươi có Chúa Trời đứng về phía mình và toàn bộ sự hậu thuẫn của các Thẩm Tra Viên tài giỏi nên ả chỉ có thể tránh ngươi được đến thế thôi.\nGiờ đây ả Genevra này đã bị đưa đến trước ngươi. Sự can thiệp không mong muốn của ả vào công việc của ngươi đã kết thúc, nhưng ngươi vẫn phải chọn phải làm gì với ả. Rõ ràng, ả là một phụ nữ có năng lực, nhưng liệu ả có thể được cứu chuộc và tin tưởng?" 
 podregionalpersons.65.a: "Ta có thể có việc dùng đến ngươi."
 podregionalpersons.65.b: "Lên giàn thiêu, mụ phù thủy!"
                    
 podregionalpersons.66.t: "Nữ Quý Tộc II"
 podregionalpersons.66.desc: "Sự giúp đỡ gián tiếp của ngươi dành cho nữ quý tộc gây rối này đã có hiệu quả. Với sự hậu thuẫn kín đáo của ngươi, Genevra vẫn đang dẫn dắt Tòa Dị Giáo truy đuổi những ma cà rồng nhỏ nhoi, không quan trọng, để ngươi và những huynh đệ thực sự quan trọng của ngươi được tự do làm điều mình muốn.\nNgười phụ nữ này có năng lực và ngươi có thể chỉ đơn giản để ả tiếp tục công việc của mình. Một lựa chọn khác là lặng lẽ bắt đầu khai thác thông tin từ các mối liên hệ của ả, điều này có thể giúp ngươi hiểu thêm về các động thái quân sự hiện tại của Tòa Dị Giáo." 
 podregionalpersons.66.a: "Để ả tiếp tục."
 podregionalpersons.66.b: "Bắt đầu ép buộc mạng lưới của ả."
                    
 podregionalpersons.67.t: "Nữ Quý Tộc III"
 podregionalpersons.67.desc: "Có vẻ ngươi không phải ma cà rồng duy nhất quan tâm đến Genevra. Một địa chủ nhỏ tên del Georgio đã bắt đầu có động thái Trao truyền cho ả.\nĐiều này làm ngươi khó chịu trên nhiều phương diện. Trước tiên, nó có nghĩa là sự can thiệp của Genevra đã kết thúc, vì Tòa Dị Giáo chắc chắn sẽ phát hiện ra ả nếu ả trở thành ma cà rồng. Thứ hai, ngươi không thực sự thích loại kẻ ngốc nhỏ nhoi này lảng vảng trong sân sau nhà mình, ngay cả khi chúng không biết điều đó.\nĐáng buồn thay, del Georgio đã hành động trước, có nghĩa là ngươi sẽ phải mặc cả với hắn nếu muốn giành lại Genevra. Ngay cả khi không còn ảnh hưởng lên Tòa Dị Giáo, ả vẫn có thể là một tài sản hữu ích." 
 podregionalpersons.67.a: "Báo cho Tòa Dị Giáo về hắn."
 podregionalpersons.67.b: "Chỉ cần hối lộ hắn."
 podregionalpersons.67.c: "Xông vào nhà hắn và đe dọa hắn."
 podregionalpersons.67.d: "Chỉ cần bẻ gãy tâm trí hắn."
 podregionalpersons.67.e: "Ả không đáng công."
 
 
 
