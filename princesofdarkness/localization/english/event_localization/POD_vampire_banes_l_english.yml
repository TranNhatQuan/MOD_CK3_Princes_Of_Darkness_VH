l_english:

 POD_vampire_banes.0001.t: "Mê Đắm Bởi Cái Đẹp"
 POD_vampire_banes.0001.desc.intro: "Người Toreador có con mắt tinh tường với cái đẹp. Tinh tường đến mức họ có thể bị đẩy tới những đỉnh cao ngây ngất, bị mê hoặc, bị cầm tù bởi một thoáng nhìn chân thực về nó.\n\n"
 POD_vampire_banes.0001.desc.painting: "Ngươi thoáng thấy bức họa khi đi ngang qua, rồi quay lại ngắm nó lần nữa, và lần nữa, đăm đăm nhìn nó hàng giờ liền. Những sắc màu rực rỡ, lớp bóng đổ và nét cọ tinh tế, tầng tầng ý đồ của người họa sĩ phủ lên một khung cảnh vốn tầm thường... mỗi đêm ngươi ở bên bức họa này, ngươi lại nhận ra một điều mới mẻ."
 POD_vampire_banes.0001.desc.song: "Ngươi nghe thấy nó một cách tình cờ. Một cô hầu bếp, hát vu vơ một mình trong lúc làm lụng. Vậy mà giai điệu nàng ngẫu hứng đặt ra lại có chiều sâu, có một tia thần thánh trong đó. Đêm này qua đêm khác ngươi ngân nga nó một mình, cố tìm lại vẻ huy hoàng của khoảnh khắc ấy."
 POD_vampire_banes.0001.desc.sculpture: "Ngươi hiếm khi để mắt tới những pho tượng điểm tô cho các đại sảnh và hành lang của mình. Nhưng một đêm nọ, có một pho khiến ngươi phải dừng lại. Nó bị bỏ quên nửa vời trong hốc tường, hiếm khi được lau chùi, vậy mà lớp bụi lại làm nổi bật cái đẹp nhất của nó, tô đậm những đường cong và cạnh sắc của kiệt tác tình cờ ấy. Cấm gia nhân chạm vào nó, ngươi trở lại bên pho tượng này đêm này qua đêm khác, mỗi lần lại tìm thấy một vẻ đẹp mới."
 POD_vampire_banes.0001.desc.poem: "Đôi khi thư phòng cũng có thể nguy hiểm. Nhất là khi ngươi cầm lên một cuốn sách và nửa bài thơ rơi ra. Nửa bài thơ! Mà lại là một bài đầy tiềm năng. Nó nói tới một điều chân thật nào đó trong tâm hồn, nhưng những phần khuyết thiếu thì khiến người ta phát điên. Đêm này qua đêm khác ngươi thử từng vần để hoàn tất bài thơ. Mỗi lần ngươi lại tiến gần hơn, nhưng chẳng có gì ngươi viết ra xứng với nó cả."
 POD_vampire_banes.0001.desc.end: "\n\nMột nỗi ám ảnh như thế có thể kéo dài hàng tháng trời trước khi phai nhạt."
 POD_vampire_banes.0001.a: "Cái đẹp là linh hồn của thế gian."
