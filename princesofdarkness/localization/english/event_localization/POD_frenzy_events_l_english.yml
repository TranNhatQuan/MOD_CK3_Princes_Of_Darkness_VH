l_english:

 POD_vampire_frenzy_events.001.t: "Phẫn Cuồng Vì Đói Khát!"
 POD_vampire_frenzy_events.001.desc: "Dã Thú gầm gừ bên trong ngươi, giành giật để được giải thoát. Ngươi đã bỏ đói nó quá lâu, và giờ nó đòi ngươi phải trao dây cương để nó có thể tự thỏa mãn. Dã Thú tìm cách thoát ra và tìm một chư hầu để hút máu, thỏa mãn cơn khát máu vô độ của nó từ nguồn gần nhất. Sự kiểm soát của nó với cơ thể ngươi tăng dần theo từng khoảnh khắc trôi qua, và khóe mắt ngươi chuyển sang màu đỏ. Ngươi có thể cố chống lại Dã Thú, nhưng buông xuôi sẽ cảm thấy thật dễ chịu...... #beast Sao phải chống cự, khi cả hai ta đều biết ta sẽ thắng?#!"
 POD_vampire_frenzy_events.001.succumb: "Khuất phục trước cơn Phẫn Cuồng"
 POD_vampire_frenzy_events.001.succumb.beast: "#beast Để ta cho ngươi thấy sự thỏa mãn thực sự.#!"
 POD_vampire_frenzy_events.001.fight: "Chống lại cơn Phẫn Cuồng"
 POD_vampire_frenzy_events.001.fight.beast: "#beast Như vậy chưa đủ. NGƯƠI chưa đủ.#!"
 POD_vampire_frenzy_events.001.fightwp: "Chống lại cơn Phẫn Cuồng bằng tất cả ý chí"
 POD_vampire_frenzy_events.001.fightwp.beast: "#beast Nếu không phải hôm nay, thì cũng là ngày mai.... tốt nhất nên đầu hàng ngay bây giờ đi, cưng ạ.#!"
 POD_vampire_frenzy_events.kai: "Danh dự là tất cả"
 POD_vampire_frenzy_events.kai.beast: "#beast Rồi ngươi sẽ nhận ra ý thức trách nhiệm của mình là sai lầm, hãy đầu hàng ta đi.#!"
 POD_vampire_frenzy_events.001.fight.failed: "Dã Thú chiếm quyền kiểm soát"
 POD_vampire_frenzy_events.001.desc.instinct: "Dã Thú gầm gừ bên trong ngươi, giành giật để được giải thoát. Ngươi đã bỏ đói nó quá lâu, và giờ nó đòi ngươi phải trao dây cương để nó có thể tự thỏa mãn. Dã Thú tìm cách thoát ra và tìm một chư hầu để hút máu, thỏa mãn cơn khát máu vô độ của nó từ nguồn gần nhất. Sự kiểm soát của nó với cơ thể ngươi tăng dần theo từng khoảnh khắc trôi qua, và khóe mắt ngươi chuyển sang màu đỏ. Ngươi có thể cảm thấy áp lực sau hốc mắt mình, và biết rằng đã đến lúc cưỡi lên con sóng đó và để Dã Thú ra ngoài chơi đùa. nhưng ngươi sẽ làm điều đó như thế nào?"
 POD_vampire_frenzy_events.001.drain: "Ta sẽ đi tìm một trong những tôi tớ phàm nhân của mình và hút cạn họ."
 POD_vampire_frenzy_events.001.drain.beast: "#beast Đơn giản và đi thẳng vào vấn đề. Ta thích điều đó!#!"
 POD_vampire_frenzy_events.001.vamp: "Ta có thể ngửi thấy vitae ngọt ngào của những Hậu Duệ Cain khác trong triều đình."
 POD_vampire_frenzy_events.001.vamp.beast: "#beast Uống máu từ một ma cà rồng khác? Thật kỳ lạ!#!"
 POD_vampire_frenzy_events.001.social: "Ta sẽ ăn ngay tại đây, ngay bây giờ. Ta không quan tâm triều đình sẽ nghĩ gì."
 POD_vampire_frenzy_events.001.social.beast: "#beast Thật đáng xấu hổ!#!"
 POD_vampire_frenzy_events.001.breach: "Ta sẽ chạy ra đường phố và ăn thịt một kẻ phàm nhân qua đường."
 POD_vampire_frenzy_events.001.breach.beast: "#beast Bởi vì cách đó luôn hiệu quả nhỉ?#!"
 POD_vampire_frenzy_events.201.t: "Phẫn Cuồng Vì Đói Khát: Hậu Quả"
 POD_vampire_frenzy_events.201.desc: "Ngươi tỉnh dậy trong trạng thái ngây ngất hoàn toàn, không thể tập trung vào bất cứ điều gì xung quanh. Vài khoảnh khắc trôi qua và ngươi nhận ra khoái cảm đang tỏa ra từ kẻ phàm nhân bên dưới nanh vuốt ngươi. Ngươi buông ra và phát hiện đó là [mortal.GetTitledFirstName], một trong những tôi tớ phàm nhân của ngươi. Có vẻ như Dã Thú đã dùng cơ thể ngươi để tấn công hắn.\n [mortal.GetTitledFirstName] không nhúc nhích, và một cuộc kiểm tra nhanh chứng minh rằng [mortal.GetSheHe] không còn chút máu nào. Trừ khi ngươi làm gì đó, [mortal.GetTitledFirstName] sẽ chết trong vòng tay ngươi. #beast [mortal.GetSheHe] phục vụ chúng ta nhiều hơn khi chết so với khi còn sống.#!"
 POD_vampire_frenzy_events.201.kill: "Không có gì ta có thể làm được. [mortal.GetTitledFirstName] sẽ chết."
 POD_vampire_frenzy_events.201.kill.beast: "#beast Kẻ phàm nhân đó đã hoàn thành mục đích của hắn.#!"  
 POD_vampire_frenzy_events.201.embrace: "Ta sẽ $pod_Embrace$ họ để cứu mạng họ."
 POD_vampire_frenzy_events.201.embrace.beast: "#beast Là mạng sống của họ mà ngươi đang cứu, hay là lương tâm của ngươi?#!"
 POD_vampire_frenzy_events.301.t: "Phẫn Cuồng Vì Đói Khát: Hậu Quả"
 POD_vampire_frenzy_events.301.desc: "Điều cuối cùng ngươi thấy trước khi rơi vào cơn Phẫn Cuồng là [bonder.GetTitledFirstName]. Giờ ngươi tỉnh dậy trong phòng của [bonder.GetHerHis], máu nhỏ giọt từ nanh vuốt ngươi. [bonder.GetTitledFirstName] đứng trước mặt ngươi với vẻ cau có trên gương mặt tái nhợt. Ngươi nhận thấy [bonder.GetSheHe] đang giữ bàn tay đang chảy máu của [bonder.GetHerHis]. Vệt máu dẫn đến ngươi, và ngươi cảm thấy một nỗi đau buồn khi nghĩ rằng mình đã làm hại [bonder.GetTitledFirstName]. Những cảm xúc mới đối với [bonder.GetTitledFirstName] thật khó hiểu, nhưng còn khó hiểu hơn là việc cơn Phẫn Cuồng của ngươi đã khiến ngươi uống máu từ một ma cà rồng khác. [bonder.GetTitledFirstName] cũng không có vẻ háo hức giải thích."
 POD_vampire_frenzy_events.301.a: "Ta sợ điều này sẽ quay lại ám ảnh ta."
 POD_vampire_frenzy_events.301.a.beast: "#beast Chúng ta sẽ phải đảm bảo điều đó không xảy ra.#!"
 POD_vampire_frenzy_events.401.t: "Phẫn Cuồng Vì Đói Khát: Hậu Quả"
 POD_vampire_frenzy_events.401.desc: "Dã Thú chọn đúng thời điểm tồi tệ nhất để ngóc đầu dậy - ngươi đang giữa một cuộc họp triều đình quan trọng. Ngươi cố gắng rời đi, nhưng Dã Thú từ chối chờ đợi. Cuối cùng ngươi lao vào một tôi tớ phàm nhân hạng thấp của một ma cà rồng mà ngươi không nhớ tên. Kẻ phàm nhân đó sống sót và chủ nhân của hắn quá tầm thường để đòi bồi thường, nhưng triều đình của ngươi giờ xem ngươi là kẻ yếu đuối. Ngươi cảm thấy như đã mất đi ít nhiều sự tôn trọng từ lãnh địa mình."
 POD_vampire_frenzy_events.401.a: "Ta sẽ đảm bảo luôn có sẵn một kẻ phàm nhân trong tương lai."
 POD_vampire_frenzy_events.401.a.beast: "#beast Điều đó sẽ chẳng ích gì.#!"
 POD_vampire_frenzy_events.501.t: "Phẫn Cuồng Vì Đói Khát: Hậu Quả"
 POD_vampire_frenzy_events.501.desc: "Dã Thú chọn đúng thời điểm tồi tệ nhất để ngóc đầu dậy - ngươi đang giữa một cuộc họp triều đình quan trọng. Ngươi kịp thoát ra trước khi Dã Thú chiếm quyền kiểm soát, tránh cho ngươi khỏi bị bẽ mặt trước triều đình. Bên ngoài, Dã Thú vồ lấy kẻ phàm nhân gần nhất, khiến ngươi cắm nanh vào da thịt hắn. Ngươi tỉnh dậy sau khi hắn đã tắt thở. Ngươi lau máu khỏi môi mình, tin rằng vấn đề đã kết thúc. Chỉ đến lúc đó ngươi mới để ý thấy kẻ phàm nhân đang nhìn chằm chằm vào ngươi."
 POD_vampire_frenzy_events.501.a: "Ta phải giải quyết chuyện này."
 POD_vampire_frenzy_events.501.a.beast: "#beast Nỗi kinh hoàng trong mắt hắn thật đáng yêu làm sao.#!"
 POD_vampire_frenzy_events.401.opinion_malus: "Thiện cảm của các chư hầu ngươi đối với ngươi giảm xuống."
 
 POD_vampire_frenzy_events.601.t: "Phẫn Cuồng Vì Thịnh Nộ!"
 POD_vampire_frenzy_events.601.desc.instinct: "Mọi ma cà rồng đều mang trong mình [Glossary('Dã Thú','game_concept_beast_desc')] - một sức mạnh bản năng của ác ý, thịnh nộ và đói khát. Khi Hậu Duệ Cain mất kiểm soát, Dã Thú chế ngự họ, nắm lấy dây cương và theo đuổi những ham muốn nguyên thủy của nó dù đó là báo thù, máu hay sự an toàn. Hậu Duệ Cain theo con đường của ngươi cố gắng khống chế Dã Thú, cưỡi lên con sóng Phẫn Cuồng để đạt được mục đích của họ. Để sử dụng sức mạnh của nó.\n\nDã Thú của ngươi đã bị kích động bởi cơn thịnh nộ ngươi đang cảm thấy lúc này, và nó đang cố thoát ra. Khóe mắt ngươi ửng đỏ khi ngươi tập trung ánh nhìn vào kẻ đã chọc giận ngươi. Nắm tay ngươi siết chặt đau đớn khi ngươi cố giữ mình không bùng nổ. Đã đến lúc Phẫn Cuồng, nhưng ngươi sẽ trút cơn thịnh nộ của mình lên ai đây?"
 POD_vampire_frenzy_events.601.desc: "Mọi ma cà rồng đều mang trong mình [Glossary('Dã Thú','game_concept_beast_desc')] - một sức mạnh bản năng của ác ý, thịnh nộ và đói khát. Khi Hậu Duệ Cain mất kiểm soát, Dã Thú chế ngự họ, nắm lấy dây cương và theo đuổi những ham muốn nguyên thủy của nó dù đó là báo thù, máu hay sự an toàn. Hậu Duệ Cain theo con đường của ngươi cố gắng chống lại Dã Thú, để giữ nó bị khóa chặt bên trong họ. Để từ chối cho nó quyền kiểm soát.\n\nDã Thú của ngươi đã bị kích động bởi cơn thịnh nộ ngươi đang cảm thấy lúc này, và nó đang cố thoát ra. Khóe mắt ngươi ửng đỏ khi ngươi tập trung ánh nhìn vào kẻ đã chọc giận ngươi. Nắm tay ngươi siết chặt đau đớn khi ngươi cố giữ mình không bùng nổ. Nếu có lúc nào để chống lại Dã Thú, thì chính là bây giờ, nhưng để nó giải quyết vấn đề thay ngươi thì dễ dàng biết bao..."
 POD_vampire_frenzy_events.601.succumb: "Khuất phục trước cơn Phẫn Cuồng"
 POD_vampire_frenzy_events.601.succumb.beast: "#beast Để ta cho ngươi thấy sự thỏa mãn thực sự.#!"
 POD_vampire_frenzy_events.601.fight: "Chống lại cơn Phẫn Cuồng"
 POD_vampire_frenzy_events.601.fight.beast: "#beast Như vậy chưa đủ. NGƯƠI chưa đủ.#!"
 POD_vampire_frenzy_events.601.fightwp: "Chống lại cơn Phẫn Cuồng bằng tất cả ý chí"
 POD_vampire_frenzy_events.601.fightwp.beast: "#beast Nếu không phải hôm nay, thì cũng là ngày mai.... tốt nhất nên đầu hàng ngay bây giờ đi, cưng ạ.#!"
 POD_vampire_frenzy_events.601.troops: "Đám lính gác đằng kia trông như một trận đấu hay đây...."
 POD_vampire_frenzy_events.601.troops.beast: "#beast Cái gì? Bọn chúng ư? Ít nhất hãy chọn ai đó xứng đáng là thử thách.#!"
 POD_vampire_frenzy_events.601.person: "Ta đã muốn đánh nhau với kẻ đó nhiều năm rồi..."
 POD_vampire_frenzy_events.601.person.beast: "#beast Ngươi còn để chúng chèn ép mình đến bao giờ nữa?#!"
 POD_vampire_frenzy_events.601.social: "Ta đập nát bất cứ vật gì gần ta nhất!"
 POD_vampire_frenzy_events.601.social.beast: "#beast Đấm vào tường... Thật độc đáo.#!"
 POD_vampire_frenzy_events.601.breach: "Ta sẽ cho lũ phàm nhân nhu nhược thấy cơn thịnh nộ của ta!"
 POD_vampire_frenzy_events.601.breach.beast: "#beast Đúng vậy, hãy để chúng run sợ trước chúng ta!#!"
 POD_vampire_frenzy_events.601.fight.failed: "Dã Thú chiếm quyền kiểm soát"
 POD_vampire_frenzy_events.701.desc: "Ngươi đang đi qua sân trong thì một cận thần của ngươi dám buông lời bình phẩm cay nghiệt về nhân cách ngươi. Ngay lập tức, ngươi rơi vào Phẫn Cuồng và lao đến chỗ vị cận thần đó. May thay, một đội lính gác được huấn luyện và trang bị đầy đủ đứng chắn giữa ngươi và vị cận thần tội nghiệp. Ngươi khá tự hào về những người tinh nhuệ này - ngươi đã tự tay huấn luyện họ, chính xác là để đối phó với ma cà rồng. Tuy nhiên giờ đây, ngươi có thể sẽ hối hận vì đã huấn luyện họ, khi họ dùng chính chiến thuật của ngươi để chống lại ngươi. \n\nNgươi bị khống chế trước khi có thể gây ra tổn hại lớn, nhưng ngươi không thoát khỏi mà không bị thương tổn, và danh tiếng của ngươi cũng vậy."
 POD_vampire_frenzy_events.701.a: "Bị chính người của ta ngăn cản."
 POD_vampire_frenzy_events.701.t: "Phẫn Cuồng Vì Thịnh Nộ: Hậu Quả"
 POD_vampire_frenzy_events.801.t: "Phẫn Cuồng Vì Thịnh Nộ: Hậu Quả"
 POD_vampire_frenzy_events.801.desc: "Phẫn Cuồng Vì Thịnh Nộ: Hậu Quả"
 POD_vampire_frenzy_events.801.victorydesc: "Ngươi nhìn xuống chư hầu của mình, [target.GetTitledFirstName], đang nằm trên sàn trong đau đớn. Ngươi nhớ lại chuyện đã xảy ra - [target.GetTitledFirstName] gần đây đã đối xử với ngươi bằng thái độ khinh miệt, và điều đó bắt đầu ảnh hưởng đến mối quan hệ công việc của các ngươi. Ngươi đã đến phòng riêng của [target.GetTitledFirstNamePossessive] để đối chất với [target.GetHerHim], và [target.GetSheHe] dám buộc tội ngươi phỉ báng! \n\n Lời buộc tội trắng trợn đó khiến ngươi rơi vào Phẫn Cuồng, và kết quả nằm ngay trước mặt ngươi. Nếu chuyện này lọt ra khỏi căn phòng này, hậu quả sẽ thảm khốc. Không chỉ chư hầu của ngươi sẽ oán hận ngươi, mà cả lãnh địa ngươi cũng sẽ chế giễu sự thiếu kiềm chế của ngươi. \n\n Nhưng dù sao... Ngươi và [target.GetTitledFirstName] đang ở đây một mình. Vẫn còn có thể đảm bảo rằng những gì đã xảy ra sẽ ở lại trong căn phòng này."
 POD_vampire_frenzy_events.801.lossdesc: "Ngươi ngước nhìn chư hầu của mình, [target.GetTitledFirstName], tay ôm chặt bụng đang rách toạc trong đau đớn.. Ngươi nhớ lại chuyện đã xảy ra - [target.GetTitledFirstName] gần đây đã đối xử với ngươi bằng thái độ khinh miệt, và điều đó bắt đầu ảnh hưởng đến mối quan hệ công việc của các ngươi. Ngươi đã đến phòng riêng của [target.GetTitledFirstNamePossessive] để đối chất với [target.GetHerHim], và [target.GetSheHe] dám buộc tội ngươi phỉ báng! \n\n Lời buộc tội trắng trợn đó khiến ngươi rơi vào Phẫn Cuồng, và nỗi đau cùng sự nhục nhã còn lại chảy tràn khắp người ngươi. Nếu chuyện này lọt ra khỏi căn phòng này, hậu quả sẽ thảm khốc. Không chỉ chư hầu của ngươi sẽ oán hận ngươi, mà cả lãnh địa ngươi cũng sẽ chế giễu sự thiếu kiềm chế của ngươi. Thêm vào đó, ngươi đã thua! \n\n Nhưng dù sao... Ngươi và [target.GetTitledFirstName] đang ở đây một mình. Vẫn còn có thể đảm bảo rằng những gì đã xảy ra sẽ ở lại trong căn phòng này."
 POD_vampire_frenzy_events.801.kill: "Chúng không thể kể cho ai nếu chúng đã chết...."
 POD_vampire_frenzy_events.801.bribe: "Nếu [target.GetSheHe] hứa không kể cho ai, ta sẽ hứa với [target.GetHerHim] một ân huệ."
 POD_vampire_frenzy_events.801.leave: "Ta sẽ không ở lại đây thêm một khoảnh khắc nào nữa, bất kể triều đình nghĩ gì."
 POD_vampire_frenzy_events.901.t: "Phẫn Cuồng Vì Thịnh Nộ: Hậu Quả"
 POD_vampire_frenzy_events.901.desc: "Buổi tiệc đang diễn ra tốt đẹp cho đến khi hai vị khách say rượu của ngươi quyết định ẩu đả ngay giữa sàn nhảy. Ngươi ra lệnh cho họ dừng lại, và họ trơ trẽn phớt lờ ngươi. Ngươi lặp lại mệnh lệnh, lần này lớn tiếng hơn. Họ vẫn thách thức ngươi. Sôi sục cơn giận vì bị coi thường, ngươi bước đến quát mắng họ, nhưng vô ích. Thật nhục nhã! \n\n Ngươi cố tách họ ra bằng vũ lực và họ dám xô đẩy ngươi. Ngươi, vị lãnh chúa hợp pháp của họ! Cơn thịnh nộ của ngươi lấn át lý trí khi ngươi gào thét và đánh vào một cây cột đủ mạnh để làm nó vỡ tan. Mọi người giờ đều đang nhìn chằm chằm vào ngươi, và ngươi nhận ra nó sẽ trông như thế nào - ngươi đã mất bình tĩnh và gây hư hại cho chính lâu đài của mình. Ngươi đã có thể thấy vài ánh mắt không hài lòng."
 POD_vampire_frenzy_events.901.a: "Việc này sẽ tốn vàng để sửa chữa."
 POD_vampire_frenzy_events.101.t: "Phẫn Cuồng Vì Thịnh Nộ: Hậu Quả"
 POD_vampire_frenzy_events.101.desc: "Ngươi nhìn xuống đôi bàn tay đẫm máu của mình, khóe miệng ngươi nhỏ giọt $pod_vitae$ lên bộ quần áo rách rưới và bẩn thỉu. Đó quả là một đêm dài.... Ngươi không nhớ nó bắt đầu như thế nào, nhưng ngươi nhớ rằng mình đã bước ra đường phố của kẻ phàm nhân trong cơn thịnh nộ và phá hủy mọi thứ trong tầm mắt. Ngươi cảm thấy như một vị thần - bất khả chiến bại, toàn năng và đáng sợ. Kẻ phàm nhân bỏ chạy trong sợ hãi, và số ít kẻ chống cự đã ngã gục dưới nanh vuốt ngươi. \n\n Bỏ qua những hệ lụy đạo đức từ hành động khủng khiếp của ngươi, ngươi đã gây ra không ít xáo trộn trong thế giới phàm nhân. Không nhiều kẻ thoát được, nhưng những kẻ thoát được chắc chắn sẽ lan truyền những câu chuyện về sức mạnh to lớn và sự quái dị của ngươi. Điều đó chắc chắn sẽ khiến thần dân ngươi sợ hãi, nhưng cũng sẽ thu hút sự chú ý không mong muốn."
 POD_vampire_frenzy_events.101.a: "Những điều ta có thể làm nếu ta buông bỏ kiểm soát...."
 
 POD_vampire_frenzy_events.801.toast: "Ngươi đã thua một trận đấu với [target.GetTitledFirstName]"
 
 
 
 
 