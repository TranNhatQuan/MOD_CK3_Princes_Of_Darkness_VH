 POD_test_of_faith.101.t: "Một Thử Thách Thành Công"
 POD_test_of_faith.101.desc: "Ngài đã thành công. Giờ ngài gần hoàn tất rồi. Ngài sẽ phụng sự Người cho phải đạo, và con đường đức hạnh mới là con đường đúng đắn. Ngài muốn cải thiện phần nào trong đời sống và hành xử của mình?" 
 POD_test_of_faith.101.option.a: "Tâm trí trước xác thịt"
 POD_test_of_faith.101.option.a.tt: "Ngài trở nên Trinh Khiết" 
 POD_test_of_faith.101.option.b: "Ta sẽ giữ bình tĩnh dù trong hoàn cảnh nào"
 POD_test_of_faith.101.option.b.tt: "Ngài trở nên Điềm Tĩnh" 
 POD_test_of_faith.101.option.c: "Sẻ chia là quan tâm"
 POD_test_of_faith.101.option.c.tt: "Ngài trở nên Hào Phóng" 
 POD_test_of_faith.101.option.d: "Ta sẽ giơ nốt má bên kia"
 POD_test_of_faith.101.option.d.tt: "Ngài trở nên Khoan Dung" 
 POD_test_of_faith.101.option.e: "Ta chẳng hơn gì người khác"
 POD_test_of_faith.101.option.e.tt: "Ngài trở nên Khiêm Tốn" 
 POD_test_of_faith.101.option.f: "Ta biết thế nào là đủ"
 POD_test_of_faith.101.option.f.tt: "Ngài sẽ trở nên Tiết Độ" 
 POD_test_of_faith.101.option.g: "Ta sẽ an nghỉ trên thiên đàng"
 POD_test_of_faith.101.option.g.tt: "Ngài trở nên Chăm Chỉ" 
  
 POD_test_of_faith.201.t: "Một Thử Thách Thất Bại"
 POD_test_of_faith.201.desc: "Ngài đã thất bại. Sự tập trung của ngài chưa đủ vẹn toàn. Có lẽ ngài nên thử lại sau chăng?\nChẳng có gì phải hổ thẹn khi không trèo nổi lên núi, chỉ hổ thẹn khi ngay từ đầu đã từ chối thử mà thôi."
 POD_test_of_faith.201.option.a: "Ta chưa sẵn sàng"
 POD_test_of_faith.201.option.a.tt: "Ngài đã thất bại"