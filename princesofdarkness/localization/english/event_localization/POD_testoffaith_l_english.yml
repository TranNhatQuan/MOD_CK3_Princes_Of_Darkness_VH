 POD_test_of_faith.001.t: "Thử Thách Đức Tin"
 POD_test_of_faith.001.desc: "Có những kẻ được phép sống trong tội lỗi, tôi tớ của Chúa thì không. Ngài chẳng xứng với ân điển của Người, nếu ngài không đủ đức hạnh, và ngài biết mình chẳng đủ. Đã tới lúc thay đổi bản thân, rũ bỏ những tội lỗi khiến ngài trở nên bất xứng. Một con đường gian nan, hẳn rồi, nhưng là con đường tất yếu."
 POD_test_of_faith.001.option.a: "Dục vọng sẽ không che mờ tâm trí ta"
