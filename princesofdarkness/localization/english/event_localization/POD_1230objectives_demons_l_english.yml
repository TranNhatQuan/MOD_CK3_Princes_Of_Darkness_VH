l_english:
  pod1230objectives_demons.1.desc: "Đức tin là thứ ác quỷ dùng để tiếp sức cho phần lớn năng lực của mình; khi còn là thiên thần, chúng có vô tận đức tin để vận dụng. Phần lớn kẻ sa ngã nay "thu hoạch" đức tin từ những con người tự nguyện bằng cách lập khế ước.\nVới việc mỗi Ác quỷ nay là hiện thân của một trong các mối tội cốt lõi, cách tốt nhất để chúng thu thêm quyền năng là làm sa đọa thêm nhiều phàm nhân. Lập vài giáo phái nhỏ thì dễ, nhưng ngươi đã đạt được điều ấn tượng hơn nhiều khi dựng nên cả một mạng lưới ảnh hưởng thần học đồ sộ trong vùng của mình.\nDẫu nhiều kẻ chẳng hay biết sự thật, hầu hết cư dân vùng này nay đều tiếp sức cho đà lên ngôi của ngươi mỗi lần họ cầu nguyện đấng thiêng liêng... hoặc mỗi lần họ buông mình theo dục vọng.\nThắng lợi như thế đảm bảo ngươi sẽ không bao giờ cạn đức tin, khiến những nỗi kinh hoàng của Ngục Tù Vực Thẳm chỉ còn là cơn ác mộng xa xôi. Dĩ nhiên, nếu ngươi nhắm tới báo thù thay vì thế, đây cũng có thể là khởi đầu xứng đáng cho cuộc thăng tiến tất yếu của ngươi thành kẻ thù lớn nhất của Thượng Đế..." 
  pod1230objectives_demons.1.a: "Tội Lỗi Vĩnh Hằng"
  eternal_avarice_modifier: "Tham Lam Vĩnh Hằng"
  eternal_envy_modifier: "Đố Kỵ Vĩnh Hằng"
  eternal_gluttony_modifier: "Háu Ăn Vĩnh Hằng"
  eternal_lust_modifier: "Dục Vọng Vĩnh Hằng"
  eternal_pride_modifier: "Kiêu Ngạo Vĩnh Hằng"
  eternal_sloth_modifier: "Lười Biếng Vĩnh Hằng"
  eternal_wrath_modifier: "Thịnh Nộ Vĩnh Hằng"

  pod1230objectives_demons.2.t: "Vượt Ngục Vực Thẳm"
  pod1230objectives_demons.2.desc: "Cuộc nổi loạn của Lucifer rốt cuộc đã thất bại dưới tay những kẻ theo hắn, và những kẻ bại trận bị ném vào Ngục Tù Vực Thẳm do Thượng Đế dựng nên để chuộc tội đời đời. Tuy nhiên kể từ đó, nhiều Ác quỷ (như chính ngươi) đã thoát ra qua những vết nứt của nhà ngục, hoặc do đám Tà Đạo Sĩ quá tham vọng triệu hồi. Dẫu vậy đó chỉ là dòng rỉ nhỏ so với cả Thiên Binh Địa Ngục vẫn còn bị giam nơi ấy.\nMở toang một pháo đài kiên cố đến thế chẳng phải chuyện dễ, nhưng đà lên ngôi gần đây của ngươi đã mang lại những cơ hội mới. Ngươi có thể chưa phải Đấng Toàn Năng, song nay ngươi đã đủ mạnh để thành mối đe dọa với Vực Thẳm.\nMỗi lần ngươi khoét thêm một lỗ hổng trong nhà ngục, càng nhiều anh em của ngươi thoát ra để cùng ngươi tới Trần Gian. Nhiều kẻ trong số đó đã đánh mất bản tính thiêng liêng thuở còn là Thiên Thần, nhưng giam chúng mãi trong Địa Ngục vào lúc này thì được ích gì? Vài kẻ biết đâu vẫn có thể tìm thấy sự cứu chuộc, còn với số còn lại, chúng nay nhìn ngươi như một Lucifer mới sẽ dẫn dắt chúng tới cuộc báo ứng tầm cỡ Kinh Thánh đã ấp ủ hàng ngàn năm..."
  pod1230objectives_demons.2.a: "Một cuộc Nổi Loạn Thiêng Liêng mới đang nhen nhóm."

  pod1230objectives_demons.3.t: "Ngày Tận Thế Kinh Thánh"
  pod1230objectives_demons.3.desc: "Thượng Đế đã bỏ rơi thế gian này từ lâu, chán nản vì những thất bại của loài người và cuộc nổi loạn của chính đám thiên thần trung thành với Người. Ngươi, cùng những kẻ Sa Ngã khác, bị đuổi khỏi Thiên Đường để mục rữa trong Địa Ngục mãi mãi. Nhưng ngươi đã chịu đựng được, hơn thế nữa, ngươi đã chiến thắng. Bất chấp mọi nỗ lực của các sứ giả của Thượng Đế và những mưu mô nhỏ nhen của các sinh vật siêu nhiên khác, thế gian nay đang ca tụng ngươi bằng lời tán dương báng bổ, đặt ngươi ngang hàng kình địch với chính Đấng Toàn Năng.\nĐã đến lúc cho sự xúc phạm tối thượng, Ngày Tận Thế đã được tiên báo từ xa xưa. Hãy giật những vì sao khỏi bầu trời, quật đổ toàn bộ Sáng Thế và ném tro tàn vào mặt Thượng Đế. Khi ấy, và chỉ khi ấy, ngươi mới đủ quyền năng để dẫn dắt Thiên Binh địa ngục của mình vào trận chiến thiêng liêng cuối cùng."
  pod1230objectives_demons.3.a: "Hồi Kết đã tới."
  pod1230objectives_demons.3.b: "Ta vẫn còn có thể vui thú dưới này..."
  the_end_of_the_world_tooltip: "Với việc Sáng Thế kết thúc và ngươi mang cuộc chiến tới Kẻ Phản Bội Vĩ Đại, ván chơi của ngươi sẽ khép lại."
  final_war_modifier: "Cuộc Chiến Cuối Cùng"
  final_war_modifier_desc: "Sáng Thế run rẩy trước kẻ hủy diệt chính mình\nGiới hạn của [kingdom|E] [holy_war|E] [casus_belli|E] được gỡ bỏ."

  pod1230objectives_demons.4.t: "Con Cái của Kẻ Sa Ngã"
  pod1230objectives_demons.4.desc: "Trong những thời khắc bạo tàn nhất của Cuộc Chiến Thiên Đường, Abaddon và Asmodeus (hai phó tướng của Lucifer) đã tiến hành những thí nghiệm ghê tởm dẫn tới sự ra đời của Nephilim: đứa con của một ác quỷ trong thân xác người và một người đàn bà phàm trần. Dẫu một số trong đó nhân từ, phần lớn đã bị vặn vẹo và làm cho sa đọa bởi chính những kẻ "cha" bất tử của chúng, những kẻ muốn dùng tiềm năng vô hạn ấy cho cuộc nổi loạn của riêng mình chống lại Lucifer.\nNhững Nephilim thuở đầu ấy đã gây ra vô số tội ác tày trời với loài người, cho tới khi Lucifer và những kẻ còn trung thành với hắn ngăn được chúng.\nNay khi ngươi rốt cuộc đã khám phá ra bí mật tạo nên chúng, ngươi có thể khai sinh một giống Nephilim mới. Chúng sẽ được dùng cho điều thiện hay điều ác? Lựa chọn ấy thuộc về ngươi."
  pod1230objectives_demons.4.a: "Dòng dõi của các Thần lại bước trên Trần Gian."

  pod1230objectives_demons.5.t: "Sự Tha Thứ Thiêng Liêng"
  pod1230objectives_demons.5.desc: "Ký ức của ngươi rốt cuộc đã trở về và ngươi nhớ lại tất cả. Sáng Thế, ánh sáng của Thượng Đế trải khắp thế gian, những bước chân chập chững đầu tiên của loài người, lời khẩn cầu của Lucifer xin che chở cho phàm nhân bất chấp kế hoạch của Thượng Đế... tất cả đã ùa về. Và cùng với nó là một nỗi mất mát sâu thẳm. Mất đi mục đích nguyên thủy của ngươi, mất đi ánh nhìn yêu thương của Thượng Đế dành cho ngươi, mất đi tiềm năng hoang dại mà ngươi từng vun đắp nơi phàm nhân.\nTừ đó tới nay, ngươi đã làm những điều khủng khiếp và bị trừng phạt vì chúng. Rồi ngươi thoát khỏi Ngục Tù Vực Thẳm, có lẽ đó cũng là một trong những thử thách Thượng Đế dành cho ngươi. Rõ ràng ngươi chẳng khá hơn là bao kể từ khi trở lại Trần Gian, nhưng rốt cuộc điều đó chẳng còn quan trọng. Nay ngươi đã thấy sự thật. Dù một sinh linh có gian ác đến đâu, dù tội ác chúng gây ra có tày trời đến mấy, vẫn luôn còn một cơ hội được tha thứ.\nNgươi chỉ cần bước bước đầu tiên hướng về nó, và cũng là bước cuối cùng của hành trình đời mình."
  pod1230objectives_demons.5.a: "Một ánh sáng chói lòa..."
  demonic_redemption_tooltip: "Và thế là câu chuyện của ngươi khép lại như lúc nó bắt đầu, thăng lên tới cánh cổng Thiên Đường."
  pod1230objectives_demons.5.b: "Vẫn chưa phải lúc."

  pod1230objectives_demons.6.t: "Babylon"
  pod1230objectives_demons.6.desc: "Ở những vương quốc cổ đại như Babylonia và Sumeria, vòng tín đồ của mỗi ác quỷ lớn dần thành một giáo phái, rồi thành một tôn giáo đủ đầy, với đền đài và tượng thần tạc theo hình dáng linh thể ấy mọc lên khắp thành thị, thôn làng và gia hộ trên toàn cõi.\nKhi dòng rỉ đức tin dâng thành suối chảy đều, rồi thành sông cuộn, các Earthbound dùng lore của mình để thỏa cơn thịnh nộ và trừng phạt kẻ vô tín bằng lời nguyền, ôn dịch và nạn đói.\nChưa từng có thời nào khác kể từ Sáng Thế mà các Thiên Thần Sa Ngã cai trị công khai đến vậy trên đám nhân loại yếu ớt. Sự sụp đổ của các nền văn minh ấy và sự trỗi dậy của độc thần giáo đã làm suy yếu ác quỷ đáng kể, buộc nhiều kẻ phải chìm vào giấc ngủ hoặc bị đày trở lại Vực Thẳm.\nKhoác lên mình tấm áo của thời đại ô nhục ấy là gửi một thông điệp rất mạnh tới các huynh đệ tỷ muội trong tội lỗi của ngươi."
  pod1230objectives_demons.6.a: "Thật huy hoàng"

  pod1230objectives_demons.7.t: "Nguyên Long Tội Lỗi"
  pod1230objectives_demons.7.desc: "Vài kẻ phàm trần, tin rằng mình có thể đạt tới sự thuần khiết về tâm linh và đạo đức bằng cách tẩy sạch tội lỗi khỏi bản thân, đã dành nhiều năm tìm cách sống tốt hơn trong mắt Thượng Đế. Khi năm tháng chứng tỏ rằng bản tính con người khiến việc tránh bảy mối tội đầu gần như bất khả, đường hướng của họ đã đổi thay.\nThành viên của hơn một giáo phái đã kết liễu đời mình như một cuộc hiến tế, đinh ninh rằng tội lỗi xác thịt có thể được xá miễn một khi bỏ lại thân xác. Số khác sa vào những nẻo tối tăm hơn, tin rằng đó không phải thất bại của riêng họ mà là của cả loài người. Họ đã hủy diệt cả những ngôi làng nhân danh việc tẩy trừ tội lỗi, chẳng một lần nhận ra sự trớ trêu trong chính hành động của mình.\nRốt cuộc phong trào ấy lụi tàn và trở thành ký ức xa mờ với tất cả, trừ dân các ngôi làng nép mình bên rìa Rừng Đen. Vị linh mục của làng, một kẻ gần như dị giáo, đã có một khải tượng về một đại pháp thuật có thể giật chính tội lỗi ra khỏi da thịt con người và trục xuất chúng khỏi thế gian.\nSuốt bốn mươi ngày bốn mươi đêm, đúng theo hình phạt của Thượng Đế dành cho tội lỗi, cả đàn chiên nhịn ăn. Vào ngày thứ bốn mươi mốt, giữa lời kinh và tiếng ca của buổi lễ, một thiên thần bước qua cửa nhà thờ. "Các ngươi đã làm tốt," ngài phán. "Tội lỗi của các ngươi được xá miễn và sẽ không còn nữa.” Ánh sáng trắng xanh tràn ngập nhà thờ, nhấn chìm cả mặt trời. Khi ánh sáng tắt đi, bảy con thú hung tợn đứng trước đám hội chúng, gào rú đòi máu. Và chúng đã có được máu.\nKhi kẻ cuối cùng của hội chúng ngã xuống dưới nanh vuốt lũ thú, im lặng ngự trị. Mỗi con vật nhìn sang những con khác với hiểu biết bẩm sinh về chỗ đứng của mình trên thế gian. Một ngọn hải đăng nguyên thủy của một trong bảy mối tội đầu."
  pod1230objectives_demons.7.a: "Tội lỗi nguyên thủy của riêng ta."

  pod1230objectives_demons.8.t: "Cây Tri Thức của Ác Quỷ"
  pod1230objectives_demons.8.desc: "Sau bao thiên niên kỷ bị giam trong Vực Thẳm mà ngẫm về số phận mình, và nay chứng kiến thế gian đã thành ra sao sau khi ngươi cùng các đồng bạn sa ngã thoát ra, ngươi còn lại quá nhiều câu hỏi và ngờ vực. Kế hoạch của Thượng Đế là gì? Vai trò của ngươi trong đó ra sao? Vì sao ngươi phải chịu đựng lâu đến thế trong nhà ngục địa ngục ấy?\nNgươi đã muốn biết lời đáp cho vô số câu hỏi ấy... và nay ngươi biết tất cả. Ngươi biết mục đích thật sự của Đấng Sáng Tạo ra mình, mọi bí ẩn của thế gian, mọi thắc mắc mà một tâm trí biết nghĩ từng nêu ra, dù tầm thường hay không sao thấu nổi với phàm nhân.\nNgươi BIẾT điều gì thúc đẩy mọi hành động của Thượng Đế, và ngươi nghĩ mình đủ tư cách tới thăm Người để trò chuyện (hoặc tranh cãi) một phen làm rung chuyển tận gốc rễ Sáng Thế."
  pod1230objectives_demons.8.a: "Ta biết điều gì thúc đẩy Người, "Cha". Và chúng ta sẽ nói về chuyện đó."
  pod1230objectives_demons.8.b: "Buổi đoàn tụ gia đình có thể chờ."
  #demonic_knowledge_character_interaction: "At any time you can change your mind, unlocks a [character_interaction|E] on yourself"
  godly_knowledge_modifier: "Tri Thức Thần Thánh"
  godly_knowledge_modifier_desc: "Tri thức của nhân vật này sánh ngang chính Thượng Đế."
  death_godly_talk: "Đã rời khỏi cõi tồn tại này"

  pod1230objectives_demons.9.t: "Một Cuộc Sáng Thế Mới"
  pod1230objectives_demons.9.desc: "Thượng Đế đã bỏ rơi thế gian này từ lâu, ngươi biết chắc điều đó sau khi thấy tình cảnh của chốn khốn khổ này. Với hiểu biết ấy, ngươi thu gom sự sùng bái của càng nhiều phàm nhân càng tốt, bởi ngươi biết Thượng Đế đã tạo ra loài người với một tia thần tính trong họ, và ngươi có kế hoạch dùng nó cho cuộc thăng tiến của chính mình. Rõ ràng loài người đã phung phí tiềm năng của họ bất chấp cuộc nổi loạn của Lucifer, và theo một nghĩa nào đó, ngươi đang tận dụng chút ít giá trị mà họ còn có thể mang lại cho một mục đích lớn lao hơn.\nCó lẽ rốt cuộc ngươi sẽ còn cho họ được hưởng chút phần trong đó.\nNay với đức tin của bấy nhiêu linh hồn nằm trong tay, cú đẩy cuối cùng của ngươi tới thần tính đã tới hồi kết. Ngươi sẽ chưa thách thức chính Thượng Đế, ít nhất là chưa, nhưng xét về mọi mặt, ngươi sẽ trở thành kẻ ngang hàng với Người.\nVà có lẽ, theo thời gian, còn hơn cả Người."
  pod1230objectives_demons.9.a: "Thiên Đường của ta, Địa Ngục của ngươi."
  world_in_your_hand_ending_tooltip: "#n Thế gian đã khuất phục trước ý chí của ngươi.#! Ván chơi của ngươi sẽ khép lại khi thế gian ngươi từng biết đổi thay. Ngươi sẽ là một vị thần nhân từ? Hay một vị thần thịnh nộ? Đó là câu chuyện của một dịp khác, và quá đỗi hoành tráng với Crusader Kings 3."
  