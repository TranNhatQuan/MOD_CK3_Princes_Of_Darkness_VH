l_english:

 POD_soulmate_frenzy.001.t: "Tâm Hồn Rách Nát"
 POD_soulmate_frenzy.001.desc: "Ngươi vừa nhận được tin báo và cả thế giới của ngươi đang sụp đổ. [lost_soulmate.GetFirstName] đã đón nhận cái chết thực sự. Tâm trí ngươi run rẩy, và phủ nhận sự thật này. Ngươi cần vô số khoảnh khắc trước khi thực sự hiểu được điều đó có nghĩa là gì: một phần của ngươi đã ra đi vĩnh viễn. Ngươi cô độc dưới bầu trời đêm, và nỗi cô đơn choáng váng này bóp nghẹt tâm trí ngươi. Nhưng có một con quái vật đang rình chờ sự yếu đuối của ngươi. Dã Thú trỗi dậy bên trong ngươi, cưỡi lên nỗi đau và tuyệt vọng của ngươi. Chẳng bao lâu nữa, tiếng gầm của nó sẽ vây hãm tâm hồn ngươi. Bởi vì nỗi đau buồn luôn kéo theo cơn Phẫn Cuồng."
 POD_soulmate_frenzy.001.option.a: "Ta phải chống cự bằng tất cả sức lực"
 POD_soulmate_frenzy.001.option.a.tt: "#beast Ngươi không thể chống lại ta!#!"
 POD_soulmate_frenzy.001.option.b: "Ta phải chống cự đủ lâu để rời khỏi triều đình"
 POD_soulmate_frenzy.001.option.b.tt: "#beast Ngươi không thể chạy trốn khỏi ta!#!"
 POD_soulmate_frenzy.001.option.c: "Ta chấp nhận vòng tay nó; Dã Thú chẳng bao giờ chịu khổ"
 POD_soulmate_frenzy.001.option.c.tt: "#beast Đã đến lúc yến tiệc!#!"
 
 POD_soulmate_frenzy.002.t: "Cố Gắng Chống Cự"
 POD_soulmate_frenzy.002.desc: "Một sự hiện diện đáng sợ lớn dần bên trong ngươi. Nó đầy những đam mê đỏ rực, những khát khao chết chóc, và ngươi muốn buông xuôi. Ngươi có thể quên hết mọi đau khổ, và tìm thấy sự nhẹ nhõm khi chào đón Dã Thú. Một hơi thở, trong khi ngươi đang ngạt thở với nỗi đau của mình. Nhưng ngươi có lý do riêng để chống cự. Ngươi biết Dã Thú là kẻ săn mồi bên trong, và ngươi là con mồi của nó.\nKhông có gì tốt đẹp nó có thể mang lại cho ngươi, ngoài thêm tuyệt vọng. Và thế là, ngươi chiến đấu chống lại Dã Thú, ngươi chiến đấu chống lại chính mình và ước muốn từ bỏ của bản thân. Tâm trí ngươi là một chiến trường, và ánh sáng đang lụi tàn. Ngươi cô độc chống lại bóng tối của chính mình, và nó đang nuốt chửng ngươi."
 POD_soulmate_frenzy.002.option.a: "Tiếp tục chiến đấu"
 POD_soulmate_frenzy.002.option.a.tt: "#beast Ngươi vẫn còn kiểm soát được... tạm thời thôi#!"
 
 POD_soulmate_frenzy.102.t: "Vượt Qua Nỗi Đau"
 POD_soulmate_frenzy.102.desc: "Những đêm tiếp theo dường như không bao giờ kết thúc. Dã Thú ở đây, sẵn sàng lợi dụng sự phiền toái nhỏ nhất, tiếng nức nở nhỏ nhất, để nắm lấy ngươi. Cận thần của ngươi cảm nhận có điều gì đó không ổn với ngươi, và may thay, họ theo bản năng tránh xa ngươi. Ánh mắt ngươi đầy vẻ tàn sát, đến cả người phàm cũng có thể nhận ra. Nhưng từng chút một, ngươi đẩy lùi con quái vật bên trong mình. Móng vuốt của nó không còn có thể bám vào ý thức ngươi được nữa. Và thế là, sau nhiều tuần chiến đấu gian khổ, ngươi lại nhốt con dã thú vào lồng của nó. Ngươi đã chiến thắng, nhưng phải trả giá bằng nỗ lực to lớn. Ít nhất, có lẽ nhiều mạng người đã được cứu nhờ đó.\nNỗi đau buồn của ngươi vẫn còn đây, và sự bất tử của ngươi mang một vị đắng chát. Nhưng thời gian dù sao cũng là đồng minh của ngươi. Có lẽ, một đêm nào đó, bầu trời sẽ lại đầy sao."
 POD_soulmate_frenzy.102.option.a: "Đã xong rồi"
 POD_soulmate_frenzy.102.option.a.tt: "Ngươi đã cố chống lại cơn Phẫn Cuồng, nhưng vẫn cảm thấy sự trống rỗng bên trong..."
 
 POD_soulmate_frenzy.003.t: "Dưới Bầu Trời Đỏ"
 POD_soulmate_frenzy.003.desc: "Ngươi giữ được cương của Dã Thú, ít nhất là một lúc. Ngươi rời khỏi lãnh địa mình, như thể Địa Ngục đang ở phía sau. Ngươi lao vào màn đêm, càng xa nhà càng tốt, trong khi Dã Thú tấn công bên trong ngươi bằng cơn Phẫn Cuồng. Đến một lúc nào đó, ngươi không thực sự nhớ khi nào, ngươi làm điều duy nhất còn lại để làm: ngươi mở lồng ra. Và ngươi chìm đắm trong cơn giày vò của những cảm xúc bị kìm nén quá lâu.\nRất nhiều người có lẽ sẽ chết, nhưng họ sẽ không phải là cận thần của ngươi."
 POD_soulmate_frenzy.003.option.a: "Đêm nay máu sẽ chảy"
 POD_soulmate_frenzy.003.option.a.tt: "#beast Cuối cùng! Chúng ta sẽ cho chúng thấy cơn thịnh nộ của mình!#!"
 
 POD_soulmate_frenzy.103.t: "Khi Con Người Đổ Máu"
 POD_soulmate_frenzy.103.desc: "Cơn Phẫn Cuồng nắm lấy ngươi suốt nhiều tuần. Ngươi băng qua lãnh địa mình như một cơn bão khát máu. Chẳng mấy chốc, tin đồn lan truyền về một con quái vật xuất hiện vào ban đêm, giết chóc mọi thứ trên đường đi. Ban ngày trở nên quá ngắn ngủi đối với dân chúng, còn ban đêm là những lời hứa chết chóc.\nNgươi không nhớ khi nào nó dừng lại. Ngươi chỉ đứng giữa một ngôi làng, và những mảnh thi thể của dân làng nằm rải rác khắp xung quanh ngươi. Hình ảnh này đã trở nên quen thuộc với ngươi, nhưng giờ đây, ngươi có thể cảm nhận được sự khủng khiếp của nó. Cuối cùng, ngươi trở về nơi trú ẩn của mình. Sự thật bên trong ngươi được thể hiện qua máu khô bám trên mặt và tay ngươi. Ngươi là con quái vật trong những câu chuyện, và trẻ con sẽ lớn lên trong nỗi sợ hãi ngươi."
 POD_soulmate_frenzy.103.option.a: "Tội ác của ngươi không đếm xuể"
 POD_soulmate_frenzy.103.option.a.tt: "#beast Đó là một bữa tiệc ngon lành#!"
 
 POD_soulmate_frenzy.203.t: "Vết Sẹo Của Nỗi Đau Và Cơn Thịnh Nộ"
 POD_soulmate_frenzy.203.desc: "Cơn Phẫn Cuồng lớn lao đó không xoa dịu được nỗi đau của ngươi. Sự thương tiếc không thể hoàn tất bằng cơn Phẫn Cuồng và sự tàn sát. Ngươi cảm thấy trống rỗng, bị bủa vây bởi cảm giác phi thực. Dã Thú đã để lại dấu ấn trong tâm trí ngươi, theo những cách ngươi chưa hiểu hết. Ngươi sẽ không bao giờ như trước nữa.\nNhưng ngươi sẽ sống sót, đêm này qua đêm khác. Đó là số phận của những kẻ bất tử."
 POD_soulmate_frenzy.203.option.a: "Từ nay, mọi thứ đều có vị của cát bụi"
 POD_soulmate_frenzy.203.option.a.tt: "Ngươi đã khuất phục trước cơn Phẫn Cuồng, nhưng vẫn cảm thấy sự trống rỗng bên trong..."
 
 POD_soulmate_frenzy.303.t: "Đứa Con Của $glossary_wyrm$"
 POD_soulmate_frenzy.303.desc: "Những cơn Phẫn Cuồng nắm lấy ngươi suốt nhiều tuần. Ngươi băng qua lãnh địa mình như một cơn bão khát máu. Chẳng mấy chốc, tin đồn lan truyền về một con quái vật xuất hiện vào ban đêm, giết chóc mọi thứ trên đường đi. Ban ngày trở nên quá ngắn ngủi đối với dân chúng, còn ban đêm là những lời hứa chết chóc.\nNhưng đôi khi, ngay cả quái vật cũng gặp phải yêu ma của riêng mình. Dã Thú của ngươi đã quá ồn ào, quá lộ liễu bởi cơn thèm khát chết chóc của nó. Một số sinh vật đã nghe thấy tiếng khóc của đất mẹ. Chúng ngửi thấy mùi tàn sát của ngươi và lần theo dấu vết đó. Một đêm nọ, chúng cuối cùng cũng tìm thấy ngươi, và ngươi trở thành con mồi. Một bầy người sói đột nhiên bao vây ngươi, và chúng quyết tâm chấm dứt sự tồn tại phạm thượng của ngươi. Bất chấp toàn bộ sức mạnh cơn Phẫn Cuồng của ngươi, nanh vuốt của chúng quá đông đảo. Đây có thể là trận chiến cuối cùng của ngươi."
 POD_soulmate_frenzy.303.option.a: "Quái vật không sợ lũ chó con"
 POD_soulmate_frenzy.303.option.a.tt: "#beast Cứ để chúng đến!#!"
 POD_soulmate_frenzy.303.option.a.desc: "Một trận chiến vì sự bất tử của ngươi"
 POD_soulmate_frenzy.303.option.a.success: "Ngươi giành phần thắng"
 POD_soulmate_frenzy.303.option.a.tt.win: "Ngươi thắng"
 POD_soulmate_frenzy.303.option.a.failure: "Ngươi bị đánh bại"
 POD_soulmate_frenzy.303.option.a.tt.lose: "Ngươi thua"
 
 POD_soulmate_frenzy.403.t: "Sau Những Móng Vuốt"
 POD_soulmate_frenzy.403.desc: "Tiếng gầm gừ của lũ sói hòa lẫn với tiếng của ngươi, và cuộc đối đầu khủng khiếp bắt đầu. Dã Thú của ngươi không có chút phân biệt nào, nhưng nó biết theo bản năng cách giết chóc và sống sót. Ngươi đứng giữa trận chiến; điệu nhảy của ngươi giữa cơn bão hoang dã. Ngươi né được một số đòn, thất bại với những đòn khác, và với mỗi vết thương mới, cơn Phẫn Cuồng của ngươi lại lớn dần lên.\nTrong tâm trí mê sảng của mình, ngươi thấy bản thân túm lấy da thịt trong tầm với, làm nổ tung đôi mắt, giật đứt hàm và chém đứt tay như chém đầu. Nỗi đau đến để xé toạc những hình ảnh này. Cơ thể ngươi có giới hạn và mọi cơn Phẫn Cuồng trên đời không thể vượt qua chúng. Sự mệt mỏi và những vết thương của ngươi đang trở nên quá lớn; và nỗi sợ hãi chiếm lấy con quái vật đang điều khiển ngươi. Vì thế, ngươi bỏ chạy, bất chấp lũ người sói điên cuồng đang đuổi theo ngươi. Sau nhiều giờ rượt đuổi, nhờ một phép màu nào đó, ngươi đã thoát khỏi chúng."
 POD_soulmate_frenzy.403.option.a: "Giờ ta cần nghỉ ngơi"
 POD_soulmate_frenzy.403.option.a.tt: "#beast Chúng không phải đối thủ của sức mạnh chúng ta!#!"
 
 POD_soulmate_frenzy.503.t: "Ta Là Một Trong Những Kẻ Còn Lại"
 POD_soulmate_frenzy.503.desc: "Cuối cùng ngươi cũng về đến nhà. Dã Thú im lặng, và ngươi cô độc. Người yêu ngươi không còn ở đó nữa, chỉ để lại cho ngươi sự vắng mặt của hắn và những ký ức. Ngươi vẫn còn sống, nhưng với cái giá nào? Sự tồn tại của ngươi dường như sẽ dài hơn rất nhiều."
 POD_soulmate_frenzy.503.option.a: "Từ nay, mọi thứ đều có vị của cát bụi"
 POD_soulmate_frenzy.503.option.a.tt: "Ngươi đã khuất phục trước cơn Phẫn Cuồng, nhưng vẫn cảm thấy sự trống rỗng bên trong..."
 
 POD_soulmate_frenzy.603.t: "Tình Yêu Có Thể Cứu Rỗi"
 POD_soulmate_frenzy.603.desc: "Tiếng gầm gừ của lũ sói hòa lẫn với tiếng của ngươi, và cuộc đối đầu khủng khiếp bắt đầu. Ngươi đứng giữa trận chiến; điệu nhảy của ngươi giữa cơn bão hoang dã. Ngươi né được một số đòn, thất bại với những đòn khác, và với mỗi vết thương mới, cơn Phẫn Cuồng của ngươi lại lớn dần lên. Nỗi đau đến để xé toạc những hình ảnh này. Cơ thể ngươi có giới hạn và mọi cơn Phẫn Cuồng trên đời không thể vượt qua chúng. Sự mệt mỏi và những vết thương của ngươi đang trở nên quá lớn. Đột nhiên, cơn Phẫn Cuồng rời bỏ ngươi.\nCác chiến binh của Gaia bắt được ngươi một cách tàn bạo. Vũ khí sát nhân của họ đánh trúng những cơ quan héo úa sau lớp da bụng ngươi, nghiền nát xương ngươi, biến thân thể ngươi thành vô số mảnh vụn. Ngươi cảm thấy trống rỗng khi đang hấp hối, nhưng một âm thanh lạ thu hút sự chú ý của ngươi. Bất chấp máu che mắt, ngươi có thể thấy một thứ gì đó đang lao về phía ngươi và bầy sói. Ngươi nhận ra [friend_savior.GetFirstName]. Một trận chiến mới bắt đầu, nhưng ngươi quá bị thương để có thể xem nó. Mọi thứ đều mờ nhòe, cho đến khi [friend_savior.GetFirstName] cúi xuống nhìn ngươi. 'Ta ở đây. Ta ở đây vì ngươi, ngay bây giờ'."
 POD_soulmate_frenzy.603.option.a: "Chào, bóng tối, người bạn cũ của ta"
 POD_soulmate_frenzy.603.option.a.tt: "Ngươi được [friend_savior.GetFirstName] cứu sống"
 
 POD_soulmate_frenzy.703.t: "Đón Nhận Sự Kết Thúc Của Ngươi"
 POD_soulmate_frenzy.703.desc: "Tiếng gầm gừ của lũ sói hòa lẫn với tiếng của ngươi, và cuộc đối đầu khủng khiếp bắt đầu. Ngươi đứng giữa trận chiến; điệu nhảy của ngươi giữa cơn bão hoang dã. Ngươi né được một số đòn, thất bại với những đòn khác, và với mỗi vết thương mới, cơn Phẫn Cuồng của ngươi lại lớn dần lên. Trong tâm trí mê sảng của mình, ngươi thấy bản thân túm lấy da thịt trong tầm với, làm nổ tung đôi mắt, giật đứt hàm và chém đứt tay như chém đầu. Nỗi đau đến để xé toạc những hình ảnh này.\nCơ thể ngươi có giới hạn và mọi cơn Phẫn Cuồng trên đời không thể vượt qua chúng. Đột nhiên, cơn Phẫn Cuồng rời bỏ ngươi và chỉ còn lại nỗi sợ hãi. Các chiến binh của Gaia bắt được ngươi một cách tàn bạo. Vũ khí sát nhân của họ đánh trúng những cơ quan héo úa sau lớp da bụng ngươi, nghiền nát xương ngươi, biến thân thể ngươi thành vô số mảnh vụn. Ngươi cảm thấy trống rỗng trước khi đầu ngươi lìa khỏi cổ. Ngươi có thể thấy những vì sao, lần cuối cùng, và rồi bóng tối ập đến."
 POD_soulmate_frenzy.703.option.a: "Sự an nghỉ vĩnh hằng đang chờ đợi"
 POD_soulmate_frenzy.703.option.a.tt: "Ngươi chết trong một trận chiến không cân sức với lũ người sói"
 
 POD_soulmate_frenzy.004.t: "Dã Thú Được Thả Rông"
 POD_soulmate_frenzy.004.desc: "Dòng ý thức của ngươi đột nhiên bị cắt đứt. Một cơn Phẫn Cuồng mãnh liệt nhấn chìm tư duy của ngươi và ngươi trở thành một cái vỏ rỗng, chỉ còn di chuyển vì bạo lực. Thứ này, vốn là ngươi mà không phải ngươi, chạy khắp lãnh địa của ngươi. Nó mù quáng trước sự hối hận, chỉ quan tâm đến việc gieo rắc cái chết, bởi vì cái chết đã sinh ra nó. Thế là móng vuốt của nó đánh vào gương mặt và nghiền nát xương cốt; và răng của nó xé toạc cổ họng, như xé toạc trái tim khỏi lồng ngực.\nNhà của ngươi giờ đây chìm ngập trong máu và tiếng thét. Màn đêm sẽ sớm im lặng trở lại. Đó vừa là một lời hứa vừa là một bản án."
 POD_soulmate_frenzy.004.option.a: "Mặt đất sẽ nhuộm đỏ lúc bình minh"
 POD_soulmate_frenzy.004.option.a.tt: "#beast Bắt đầu yến tiệc thôi!#!"
 
 POD_soulmate_frenzy.104.t: "Cơn Say Máu"
 POD_soulmate_frenzy.104.desc: "Cuối cùng, ngươi tỉnh dậy. Tấm màn che mắt ngươi được vén lên, và ngươi có thể thấy những gì mình đã làm trong đêm dài này. Dưới chân ngươi, một biển máu. Ngươi bị vây quanh bởi xác chết, những phần thi thể bị hành hạ và những thứ không thể nhận dạng khác. Ngươi có thể nhận ra nhiều vệ sĩ, tôi tớ, cận thần của mình, và một số gương mặt không còn xa lạ với ngươi. Tất cả giờ đây đông cứng với vẻ mặt kinh hoàng. Nhà của ngươi như một nghĩa địa lộ thiên, và ngươi là kẻ đào mộ."
 POD_soulmate_frenzy.104.option.a: "Tội ác của ngươi không đếm xuể"
 POD_soulmate_frenzy.104.option.a.tt: "#beast Giết cận thần thật vui, chúng ta nên làm lại lần nữa!#!"
 
 POD_soulmate_frenzy.204.t: "Vết Sẹo Của Nỗi Đau Và Cơn Thịnh Nộ"
 POD_soulmate_frenzy.204.desc: "Những cơn Phẫn Cuồng đó không xoa dịu được nỗi đau của ngươi. Sự thương tiếc không thể hoàn tất bằng cơn Phẫn Cuồng và sự tàn sát. Ngươi cảm thấy trống rỗng, bị bủa vây bởi cảm giác phi thực. Dã Thú đã để lại dấu ấn trong tâm trí ngươi, theo những cách ngươi chưa hiểu hết. Ngươi sẽ không bao giờ như trước nữa. Nhưng ngươi sẽ sống sót, đêm này qua đêm khác. Đó là số phận của những kẻ bất tử."
 POD_soulmate_frenzy.204.option.a: "Từ nay, mọi thứ đều có vị của cát bụi"
 POD_soulmate_frenzy.204.option.a.tt: "Ngươi đã khuất phục trước cơn Phẫn Cuồng, nhưng vẫn cảm thấy sự trống rỗng bên trong..."