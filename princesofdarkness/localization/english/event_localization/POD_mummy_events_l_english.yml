l_english:
 POD_mummy_resurrection.1.t: "Thực Sự Bất Tử?"
 POD_mummy_resurrection.1.desc: "Khi chết đi, các Xác Ướp trải qua một quá trình dài (và khó chịu), trong đó linh hồn họ bị ném vào một cõi giới tâm linh mang tên [UmbraGlossary('tempest')]. Ở đó, họ dần dần trở về [UmbraGlossary('earth')]. Ngoài ra, một số loại $POD_splat_mummy_plural$ còn phải chịu sự phán xét.\nXác Ướp Shemsu-heru đến Amenti, cõi giới của người chết Ai Cập, để gặp Anubis và các phán quan của Ma'at, trong khi Xác Ướp Cabiri đến Hades, nơi họ phải tự lo liệu trong một môi trường khắc nghiệt hơn."
 POD_mummy_resurrection.1.a: "Hãy phán xét ta"
 POD_mummy_resurrection.1.a.tt: "Sau khi chết, ngươi sẽ bị phán xét dựa trên Chính Trực của mình."
 POD_mummy_resurrection.1.b: "Ta đã mất đi thứ gì đó quan trọng..."
 POD_mummy_resurrection.1.b.tt: "Do nền tảng lung lay, ngươi đã mất đi một phần bản thân trong [UmbraGlossary('tempest')]"
 POD_mummy_resurrection.1.c: "Chủ nhân, con đã thất bại."
 POD_mummy_resurrection.1.c.tt: "$glossary_wyrm_apophis$ vốn chẳng nổi tiếng vì khoan dung với những kẻ thất bại..."
 POD_mummy_resurrection.1.d: "Ta sẽ trở lại"
 POD_mummy_resurrection.1.d.tt: "Nhờ nền tảng vững chắc, ngươi đã sống sót trong [UmbraGlossary('tempest')] mà không mất mát gì"

 POD_mummy_resurrection.2.t: "Cán Cân của Ma'at"
 POD_mummy_resurrection.2.desc: "Ngươi đã bị giết, và giờ thấy mình đang ở trong [UmbraGlossaryLocalized('shadowlands','Âm Phủ')], phải trải qua một cuộc phán xét để chứng minh mình xứng đáng được hồi sinh.\nMọi chuyện bắt đầu bằng việc chờ Anubis tìm ra ngươi, một quá trình có thể kéo dài và đầy căng thẳng, trước khi được đưa đến trước các phán quan của Ma'at, những người sẽ đánh giá xem ngươi có tận tụy thúc đẩy sự cân bằng trong kiếp sống vừa qua hay không."
 POD_mummy_resurrection.2.a: "Hãy cân đo tội lỗi của ta."
 POD_mummy_resurrection.2.a.tt: "Hình phạt ngươi phải nhận sẽ dựa trên mức độ Chính Trực của ngươi."
 POD_mummy_resurrection.2.b: "Ta không cần ngươi."
 POD_mummy_resurrection.2.b.tt: "Ngươi sẽ tìm một chủ nhân khác, trở thành chính thứ mà ngươi đã thề sẽ hủy diệt."
 POD_mummy_resurrection.2.c: "Ta sẽ làm tốt hơn!"
 POD_mummy_resurrection.2.c.tt: "Ngươi sẽ khẩn cầu các Phán Quan. Điều này sẽ không hiệu quả nữa trong 50 năm tới."
 
 podmummy.1.homelandandtomb: "[POD_homeland|E] Và Lăng Mộ"
 podmummy.1.homeland: "[POD_homeland|E]:"
 podmummy.1.tomb: "Do lăng mộ của ngươi:"
 POD_not_in_homelands_tt: "Ngươi không ở trong [POD_homeland|E] của mình nên không nhận được Ký Ức từ đó."
 POD_no_tomb_memory_tt: "\nLăng mộ của ngươi không cung cấp Ký Ức nào."
 
 podmummy.1000.t: "Đạo Mộ Tặc!"
 podmummy.1000.desc: "Lăng mộ của ngươi cất giữ vô số di vật gắn liền với những kiếp sống trước đây của ngươi... những thứ mà con mắt phàm tục hiện đại xem như báu vật vô giá. Nạn đạo mộ đã tồn tại từ khi những lăng mộ ấy ra đời, là mối họa dai dẳng cho sự tồn tại của các Xác Ướp, những kẻ thường thấy mình mất đi những di vật quan trọng khi tỉnh giấc bước vào một chu kỳ mới.\nBởi vậy, họ đã lập ra các giáo phái và cạm bẫy để bảo vệ những gì thuộc về mình khỏi lũ tham lam, nhưng đôi khi ngay cả những tuyến phòng thủ được dựng lên cẩn thận nhất cũng có thể bị phá vỡ hoàn toàn nhờ vận may của những kẻ phiêu lưu phiền toái này."
 podmummy.1000.a: "Kẻ nào dám quấy nhiễu giấc ngủ của ta?!"
 podmummy.1000.b: "Đã đến lúc tự tay nghiền nát lũ kiến phiền toái này."
 podmummy.1000.c: "Ta còn việc quan trọng hơn phải làm."

 podmummy.1001.t: "Ma Cà Rồng Đạo Mộ Tặc!"
 podmummy.1001.desc: "Ma Cà Rồng đã bị mê hoặc bởi các Xác Ướp kể từ khi hai bên tiếp xúc với nhau. Hình thức bất tử (có vẻ) "thuần khiết" hơn này, thoát khỏi lời nguyền của Cain, khiến họ say mê, nhất là khi họ xem Xác Ướp là những "kẻ bất tử thực sự", bởi ngay cả Cái Chết Cuối Cùng cũng chỉ mở ra một chu kỳ mới cho các ngươi. Bởi vậy, không có gì lạ khi nhiều Ma Cà Rồng đã trở nên ám ảnh với việc cố khám phá bí mật của giống loài ngươi.\nĐáng buồn thay, điều này thường khiến họ chẳng khác gì những tên đạo mộ tặc thông thường, bởi họ xem các di vật của ngươi là chìa khóa tiềm năng dẫn đến bí mật của ngươi. Tuy nhiên, Ma Cà Rồng thường trở thành mối đe dọa lớn hơn nhiều, bởi họ biết ngươi có thể làm gì và có được những quyền năng mà những kẻ phiêu lưu phàm nhân chỉ có thể mơ tới."
 podmummy.1001.a: "Ta nên làm một lăng mộ tắm nắng..."
 podmummy.1001.b: "Ta sẽ cho ngươi thấy sự bất tử thực sự!"
 podmummy.1001.c: "Ta còn việc quan trọng hơn phải làm."

 POD_mummy_hekau.201.t: "Tách Rời Khaibit"
 POD_mummy_hekau.201.desc: "Với sự tinh thông Necromancy của mình, ngươi có thể cố tách rời Khaibit của mình để dùng như một kẻ hầu cận giống Spectre."
 POD_mummy_hekau.201.option.a: "Hãy xuất hiện, bóng của ta! Hãy phụng sự ta."
 POD_mummy_hekau.201.option.a.tt: "Ngươi sẽ cố tách rời Khaibit của mình"
 POD_mummy_hekau.201.option.a.desc: "Một cuộc đấu tranh với cái bóng nội tâm của ngươi"
 POD_mummy_hekau.201.option.a.tt.success: "Khaibit của ngươi đã được tách rời thành công"
 POD_mummy_hekau.201.option.a.tt.failure: "Ngươi thất bại trong việc tách rời Khaibit"
 POD_mummy_hekau.201.option.b: "Bây giờ chưa phải lúc thích hợp"
 POD_mummy_hekau.201.option.b.tt: "Ngươi sẽ từ bỏ ý định tách rời Khaibit của mình"

 POD_mummy_hekau.202.t: "Tách Rời Khaibit II"
 POD_mummy_hekau.202.desc: "Với sự tinh thông Necromancy của mình, ngươi đã tách rời thành công Khaibit khỏi bản thân, giờ là lúc ban lệnh."
 POD_mummy_hekau.202.option.a: "Spectre của riêng ta"
 POD_mummy_hekau.202.option.a.tt: "Khaibit của ngươi đã được tách rời thành công."

 POD_mummy_hekau.203.t: "Tách Rời Khaibit II"
 POD_mummy_hekau.203.desc: "Ngay cả sự tinh thông Necromancy của ngươi cũng chưa đủ để tách rời Khaibit... ít nhất là bây giờ."
 POD_mummy_hekau.203.option.a: "Ta vẫn chưa sẵn sàng"
 POD_mummy_hekau.203.option.a.tt: "Ngươi thất bại trong việc tách rời Khaibit"

 POD_mummy_hekau.204.t: "Sự Trở Về của Khaibit"
 POD_mummy_hekau.204.desc: "Khaibit đã tách rời của ngươi đã gặp phải một sự cố và phải trở về với ngươi."
 POD_mummy_hekau.204.option.a: "Bóng của ta đã trở về"
 POD_mummy_hekau.204.option.a.tt: "Khaibit và ngươi lại một lần nữa hợp nhất"

 learning_true_names_head: "Học Chân Danh:"

 
 POD_mummy_scheme.100.t: "Con Mắt của Sakhmet"
 POD_mummy_scheme.100.desc: "Ngươi đã khắc biểu tượng của Sakhmet lên mục tiêu, khiến vết thương khó lành hơn và kéo dài lâu hơn."
 POD_mummy_scheme.100.a: "Tốt."
 
 POD_discover_true_name_outcome.2000.t: "Ngươi đã thất bại trong việc học ren của [target.GetTitledFirstNamePossessive]!"
 POD_discover_true_name_outcome.2000.desc: "Sau nhiều tháng phân tách cái tên thành từng thành phần, học cách phát âm chuẩn xác, học ý nghĩa của từng phần và cố gắng khám phá bản chất sâu kín nhất của nó, ta đã thất bại."
 POD_discover_true_name_outcome.2000.a: "Ta từ bỏ."
 POD_discover_true_name_outcome.2000.b: "Ren của [target.GetTitledFirstNamePossessive] sẽ nằm dưới sự sai khiến của ta!"

