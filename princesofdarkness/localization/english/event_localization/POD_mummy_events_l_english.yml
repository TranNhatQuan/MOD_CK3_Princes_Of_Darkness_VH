 POD_command_effigy_ongoing.1030.option.b.t.PAY_MEDIUM: "Thỏa Thuận Ổn Thỏa"
 POD_command_effigy_ongoing.1030.option.b.t.PAY_MAJOR: "Thỏa Thuận Tồi Tệ"

 POD_show_known_true_names_events.100.t: "Ren Đã Biết"
 POD_show_known_true_names_events.100.desc: "[PlayerGuiBuildTooltip('POD_display_known_ren_sgui')]"
 POD_show_known_true_names_events.100.option.a: "OK"
 POD_show_known_true_names_events.100.option.b: "Có thể làm gì với thực vật?"
 POD_show_known_true_names_events.100.option.c: "Có thể làm gì với cơ thể con người?"
 POD_show_known_true_names_events.100.option.d: "Có thể làm gì với động vật?"
 POD_show_known_true_names_events.100.option.e: "Có thể làm gì với kim loại?"
 POD_show_known_true_names_events.110.t: "Thực Vật"
 POD_show_known_true_names_events.110.desc: "Amenti nắm được ren của thực vật có thể ban các loại phước lành hay lời nguyền lên đất đai. Họ cũng có thể biến làn da mình thành chất liệu thực vật."
 POD_show_known_true_names_events.110.option.a: "OK"
 POD_show_known_true_names_events.110.option.b: "Quay Về Menu Trước"
 POD_show_known_true_names_events.130.t: "Động Vật"
 POD_show_known_true_names_events.130.desc: "Amenti nắm được ren của các loài động vật khác nhau có thể triệu gọi những con vật đó đến trợ giúp (MaA) hoặc biến hình thành con vật đó."
 POD_show_known_true_names_events.140.t: "Kim Loại"
 POD_show_known_true_names_events.140.desc: "Amenti nắm được ren của các kim loại khác nhau có thể triệu hồi kim loại quý ra đời hoặc biến làn da mình thành kim loại đó."