 POD_artifacts_book_of_nod.200.t: "Biên Niên Sử Caine"
 POD_artifacts_book_of_nod.200.desc: "Caine kể lại những động cơ dẫn đến lời nguyền của mình, đưa ra góc nhìn của hắn về những sự kiện xảy ra quanh những ngày sau Sự Sa Ngã của Loài Người, và lịch sử của hắn khi là Người Cha Bóng Tối."
 POD_artifacts_book_of_nod.200.option.a: "Thuở Ban Đầu"
 POD_artifacts_book_of_nod.200.option.b: "Sự Xuất Hiện của Lilith"
 POD_artifacts_book_of_nod.200.option.c: "Phép Thuật của Lilith"
 POD_artifacts_book_of_nod.200.option.d: "Sự Cám Dỗ của Caine"
 POD_artifacts_book_of_nod.200.option.e: "Câu Chuyện của Zillah"
 POD_artifacts_book_of_nod.200.option.f: "Câu Chuyện của Mụ Phù Thủy"
 POD_artifacts_book_of_nod.200.option.g: "Câu Chuyện của Thành Phố Thứ Nhất"
 POD_artifacts_book_of_nod.200.option.h: "Mục Lục"
 POD_artifacts_book_of_nod.300.t: "Biên Niên Sử Bóng Tối"
 POD_artifacts_book_of_nod.300.desc: "Một Biên Niên Sử của 'Sách Nod'. Một tuyển tập các mảnh vỡ và đoạn rời còn đang bị tranh cãi liệu có thực sự thuộc về Sách Nod hay không. Có những nhà phân tích cho rằng phần này đã bị pha loãng bởi các học giả và văn sĩ của Carthage, những kẻ đã dùng đến sự phóng túng thi ca để chép lại 'Luật của Caine.' Thậm chí có người nói rằng Biên Niên Sử Bóng Tối chỉ là một tuyển tập tuyên truyền do Camarilla tạo ra để hậu thuẫn cho ách cai trị bạo ngược của nó. Trong khi một số người tin đây là một trò đùa tinh vi của Malkavian, những người khác lại tin rằng các văn bản này đến thẳng từ chính Người Cha Bóng Tối, đặc biệt là mười ba điều răn được khắc trên những tấm bảng đá cổ chân thực."
 POD_artifacts_book_of_nod.300.desc.notale: "Ngài không sở hữu một bản sao của 'Biên Niên Sử Bóng Tối'."
 POD_artifacts_book_of_nod.300.option.a: "Tiếp tục đọc"
 POD_artifacts_book_of_nod.400.t: "Biên Niên Sử Bí Mật"
 POD_artifacts_book_of_nod.400.desc: "Một Biên Niên Sử của 'Sách Nod'. Nó chứa những lời tiên tri và khải tượng về một sự kiện gọi là Gehenna. Với một số người, dường như nỗi lo lắng về sự kiện này đã truyền từ Thế Hệ này sang Thế Hệ khác và gây ra một làn sóng hoang tưởng và sợ hãi tiếp tục vang vọng khắp Hậu duệ Cain và đám Canaille."
 POD_artifacts_book_of_nod.400.desc.notale: "Ngài không sở hữu một bản sao của 'Biên Niên Sử Bí Mật'."
 POD_artifacts_book_of_nod.400.option.a: "Tiếp tục đọc"
 POD_artifacts_book_of_nod.500.t: "Thuở Ban Đầu"
 POD_artifacts_book_of_nod.500.desc: "Ta mơ về thuở ban đầu\nký ức dài lâu nhất\nTa nói về thuở ban đầu\nNgười Cha cổ xưa nhất\nTa hát về thuở ban đầu\nvà buổi bình minh của Bóng Tối\nỞ Nod\nnơi ánh sáng Thiên Đường\nthắp sáng bầu trời đêm\nvà nước mắt của song thân ta làm ướt mặt đất.\n\nMỗi chúng ta, theo cách riêng của mình,\nbắt đầu sống\nvà lấy lương thực từ đất đai."
 POD_artifacts_book_of_nod.500.desc.notale: "Ngài không sở hữu một bản sao của 'Thuở Ban Đầu'." 
 POD_artifacts_book_of_nod.500.option.a: "Tiếp tục đọc Thuở Ban Đầu"
 POD_artifacts_book_of_nod.500.option.b: "Quay lại Biên Niên Sử Caine"
 POD_artifacts_book_of_nod.510.t: "Thuở Ban Đầu, tiếp theo"
 POD_artifacts_book_of_nod.510.desc: "Và ta, Caine trưởng nam, ta,\nvới những vật sắc bén\ngieo những hạt giống tối tăm\nlàm ướt chúng trong đất\nchăm bón chúng, xem chúng lớn lên\nVà Abel, thứ nam Abel\nchăm sóc lũ thú vật\ngiúp chúng đẻ đầy máu me\ncho chúng ăn, xem chúng lớn lên.\nTa yêu hắn, em trai ta\nHắn là kẻ sáng láng nhất, dịu dàng nhất, mạnh mẽ nhất.\nHắn là phần đầu tiên của mọi niềm vui của ta."
 POD_artifacts_book_of_nod.510.option.b: "Đoạn trước"
 POD_artifacts_book_of_nod.520.t: "Thuở Ban Đầu, tiếp theo"
 POD_artifacts_book_of_nod.520.desc: "Rồi một ngày Cha chúng ta phán cùng chúng ta.\nCaine, Abel, hãy dâng lên Người Trên Cao\nngươi phải làm một lễ vật hiến tế -\nmón quà là phần đầu tiên\ncủa tất cả những gì ngươi có\nVà ta, Caine trưởng nam, ta\nthu hoạch những chồi non\nnhững quả ngọt nhất\ncỏ non ngon nhất\nVà Abel, thứ nam, Abel\ngiết con vật non nhất,\nmạnh mẽ nhất,\nngọt ngào nhất trong đàn gia súc của hắn."
 POD_artifacts_book_of_nod.530.t: "Thuở Ban Đầu, tiếp theo"
 POD_artifacts_book_of_nod.530.desc: "Trên bàn thờ của Cha chúng ta\nchúng ta đặt lễ vật hiến tế\nvà đốt lửa dưới chúng\nvà nhìn làn khói mang chúng đi\nlên tới Người Trên Cao\n\nLễ vật của Abel, thứ nam,\ntỏa hương thơm ngọt ngào với Người Trên Cao\nvà Abel được ban phước.\nVà, ta, Caine trưởng nam, ta\nbị giáng xuống từ chốn xa xăm bởi\nmột lời nói khắc nghiệt và một lời nguyền,\nvì lễ vật của ta không xứng đáng."
 POD_artifacts_book_of_nod.540.t: "Thuở Ban Đầu, tiếp theo"
 POD_artifacts_book_of_nod.540.desc: "Ta nhìn lễ vật của Abel, vẫn còn bốc khói, thịt, máu.\nTa khóc, ta bưng lấy mắt mình\nta cầu nguyện suốt đêm ngày.\n\nVà khi Cha phán\nthời khắc Hiến Tế lại đến\nVà Abel dẫn con vật non nhất của hắn,\nngọt ngào nhất của hắn,\nyêu quý nhất của hắn\nđến ngọn lửa hiến tế\nTa không mang con vật non nhất của ta,\nngọt ngào nhất của ta,\nvì ta biết Người Trên Cao sẽ không muốn chúng."
 POD_artifacts_book_of_nod.550.t: "Thuở Ban Đầu, tiếp theo"
 POD_artifacts_book_of_nod.550.desc: "Và em trai ta, Abel yêu quý, nói với ta\n'Caine, ngươi đã không mang một lễ vật hiến tế,\nmón quà là phần đầu tiên của niềm vui ngươi,\nđể đốt trên bàn thờ của Người Trên Cao.'\n\nTa khóc những giọt nước mắt yêu thương khi ta, với những vật sắc bén,\nhiến tế thứ là phần đầu tiên của niềm vui ta,\nem trai ta.\n\nVà Máu của Abel phủ lên bàn thờ\nvà tỏa hương thơm ngọt ngào khi nó cháy." 
 POD_artifacts_book_of_nod.560.t: "Thuở Ban Đầu, tiếp theo"
 POD_artifacts_book_of_nod.560.desc: "Nhưng Cha ta phán\n'Ngươi bị nguyền rủa, Caine, kẻ đã giết em trai mình.\nNhư ta đã bị trục xuất\nngươi cũng sẽ như vậy.'\n\nVà Người đày ta đi lang thang trong Bóng Tối,\nvùng đất Nod.\n\nTa bay vào Bóng Tối\nTa chẳng thấy nguồn sáng nào\nvà ta sợ hãi.\nVà cô độc."
 POD_artifacts_book_of_nod.600.t: "Sự Xuất Hiện của Lilith"
 POD_artifacts_book_of_nod.600.desc: "Ta cô độc trong Bóng Tối\nVà ta trở nên đói khát.\nTa cô độc trong Bóng Tối\nVà ta trở nên lạnh lẽo.\nTa cô độc trong Bóng Tối\nVà ta khóc.\n\nRồi có một giọng nói ngọt ngào đến với ta,\nmột giọng nói như mật ong,\nNhững lời an ủi.\nNhững lời xoa dịu.\n\nMột người phụ nữ, tối tăm và diễm lệ,\nvới đôi mắt xuyên thấu Bóng Tối\nđến với ta.\n\n"
 POD_artifacts_book_of_nod.600.desc.notale: "Ngài không sở hữu một bản sao của 'Sự Xuất Hiện của Lilith'."  
 POD_artifacts_book_of_nod.600.option.a: "Tiếp tục đọc Sự Xuất Hiện của Lilith"
 POD_artifacts_book_of_nod.610.t: "Sự Xuất Hiện của Lilith, tiếp theo"
 POD_artifacts_book_of_nod.610.desc: "'Ta biết câu chuyện của ngươi. Caine của Nod.'\nNàng nói, mỉm cười.\n'Ngươi đói khát. Đến đây! Ta có thức ăn.\nNgươi lạnh lẽo. Đến đây! Ta có áo quần.\nNgươi buồn bã. Đến đây! Ta có sự an ủi.\n\n'Ai sẽ an ủi một kẻ bị Nguyền Rủa như ta?\nAi sẽ cho ta áo quần?\nAi sẽ cho ta ăn?'\n\n'Ta là người vợ đầu tiên của Cha ngươi,\nkẻ đã bất đồng với Người Trên Cao\nvà giành lấy Tự Do trong Bóng Tối.\nTa là Lilith."
 POD_artifacts_book_of_nod.620.t: "Sự Xuất Hiện của Lilith, tiếp theo"
 POD_artifacts_book_of_nod.620.desc: "'Đã có lúc, ta lạnh lẽo, và chẳng có hơi ấm nào cho ta.\nĐã có lúc. Ta đói khát và chẳng có thức ăn nào cho ta.\nĐã có lúc, ta buồn bã, và chẳng có sự an ủi nào cho ta.'\nNàng đón nhận ta, nàng cho ta ăn.\nNàng cho ta áo quần.\nTrong vòng tay nàng. Ta tìm thấy sự an ủi.\nTa khóc cho đến khi máu chảy ra từ mắt ta\nvà nàng hôn chúng đi."
 POD_artifacts_book_of_nod.700.t: "Phép Thuật của Lilith"
 POD_artifacts_book_of_nod.700.desc: "Và ta ở lại một thời gian trong Ngôi Nhà của Lilith\nvà hỏi nàng\n'Từ trong Bóng Tối,\nlàm sao nàng xây được nơi này?\nLàm sao nàng may được áo quần?\nLàm sao nàng trồng được lương thực?'\n\nVà Lilith mỉm cười và nói.\n'Không như ngươi, ta Đã Thức Tỉnh.\nTa thấy được những Sợi Chỉ đang Xe\nquanh ngươi, ta tạo ra thứ\nta cần từ Quyền Năng.'"
 POD_artifacts_book_of_nod.700.desc.notale: "Ngài không sở hữu một bản sao của 'Phép Thuật của Lilith'." 
 POD_artifacts_book_of_nod.700.option.a: "Tiếp tục Đọc Phép Thuật của Lilith"
 POD_artifacts_book_of_nod.710.t: "Phép Thuật của Lilith, tiếp theo"
 POD_artifacts_book_of_nod.710.desc: "'Vậy hãy Đánh Thức ta, Lilith.' Ta nói.\n'Ta cần Quyền Năng này.\nRồi, ta có thể tự may áo quần của mình,\ntự trồng lương thực của mình,\ntự xây Ngôi Nhà của mình.'\n Lilith cau mày lo lắng.\n 'Ta không biết\nSự Thức Tỉnh sẽ làm gì với ngươi,\nvì ngươi thực sự bị Cha ngươi Nguyền Rủa.\nNgươi có thể chết.\nNgươi có thể bị biến đổi vĩnh viễn.'"
 POD_artifacts_book_of_nod.720.t: "Phép Thuật của Lilith tiếp theo"
 POD_artifacts_book_of_nod.720.desc: "Caine nói, 'Dù vậy, một cuộc sống không có Quyền Năng sẽ chẳng đáng sống.\nTa thà chết còn hơn không có những món quà của nàng.\nTa sẽ không sống như một Nô Bộc của nàng.'\n\nLilith yêu ta, và ta biết điều này.\nLilith sẽ làm những gì ta yêu cầu,\ndù nàng không mong muốn vậy." 
 POD_artifacts_book_of_nod.730.t: "Phép Thuật của Lilith, tiếp theo"
 POD_artifacts_book_of_nod.730.desc: "Và thế là, Lilith, Lilith mắt sáng, Đánh Thức ta.\nNàng tự rạch mình bằng một con dao,\nchảy máu vì ta vào một cái bát.\nTa uống một hơi dài. Ngọt lịm.\n\nVà rồi ta rơi vào Vực Thẳm.\nTa rơi mãi, rơi mãi\nvào bóng tối sâu thẳm nhất."  
 
 POD_artifacts_book_of_nod.800.t: "Sự Cám Dỗ của Caine"
 POD_artifacts_book_of_nod.800.desc: "Và từ Bóng Tối\nmột ánh sáng rực rỡ chói lòa hiện đến -\nngọn lửa trong đêm.\nVà tổng lãnh thiên thần Michael hiện ra trước ta.\n\nTa không sợ hãi. Ta hỏi mục đích của ngài ấy.\nMichael, Tướng Quân của Thiên Đàng,\nkẻ mang Ngọn Lửa thánh,\nphán cùng ta,\n'Con của Adam, Con của Eve, tội của ngươi quá lớn,\nnhưng lòng thương xót của Cha ta cũng lớn lao không kém.\nNgươi sẽ không hối cải điều ác mà ngươi đã làm, và để lòng thương xót của Người tẩy sạch ngươi sao?'"
 POD_artifacts_book_of_nod.800.desc.notale: "Ngài không sở hữu một bản sao của 'Sự Cám Dỗ của Caine'."  
 POD_artifacts_book_of_nod.800.option.a: "Tiếp tục Đọc Sự Cám Dỗ của Caine"
 POD_artifacts_book_of_nod.810.t: "Sự Cám Dỗ của Caine, tiếp theo"
 POD_artifacts_book_of_nod.810.desc: "Và ta nói với Michael,\n'Không phải nhờ ân sủng của (Người Trên Cao), mà là của chính ta\nta sẽ sống, trong kiêu hãnh.'\n\nMichael nguyền rủa ta, phán rằng\n'Vậy thì, chừng nào ngươi còn bước đi trên mặt đất này,\nngươi và con cái ngươi sẽ sợ hãi ngọn lửa sống của ta,\nvà nó sẽ cắn sâu và thưởng thức thịt da ngươi'\n\nVà vào buổi sáng, Raphael đến trên đôi cánh rực sáng,\nánh sáng trên đường chân trời,\nkẻ điều khiển Mặt Trời,\nngười canh giữ phương Đông." 
 POD_artifacts_book_of_nod.820.t: "Sự Cám Dỗ của Caine, tiếp theo"
 POD_artifacts_book_of_nod.820.desc: "Raphael nói, rằng\n'Caine, con của Adam, con của Eve,\nem trai ngươi Abel tha thứ cho tội lỗi của ngươi\nngươi sẽ không hối cải, và chấp nhận lòng thương xót của Đấng Toàn Năng sao?'\n\nVà ta nói với Raphael:\n'Không phải nhờ sự tha thứ của Abel, mà là của chính ta,\nta sẽ được tha thứ.'"  
 POD_artifacts_book_of_nod.830.t: "Sự Cám Dỗ của Caine, tiếp theo"
 POD_artifacts_book_of_nod.830.desc: "Raphael nguyền rủa ta, phán rằng\n'Vậy thì, chừng nào ngươi còn bước đi trên mặt đất này,\nngươi và con cái ngươi sẽ sợ hãi bình minh,\nvà những tia nắng mặt trời sẽ tìm cách thiêu đốt ngươi như lửa,\ndù ngươi trốn ở đâu, mãi mãi.\nHãy trốn ngay đi, vì Mặt Trời mọc lên để trút cơn thịnh nộ của nó lên ngươi.\n\nNhưng ta tìm được một nơi bí mật trong lòng đất\nvà trốn khỏi ánh sáng thiêu đốt của Mặt Trời.\nSâu trong lòng đất, ta ngủ cho đến khi Ánh Sáng của Thế Gian bị che khuất sau ngọn núi Đêm Tối.'"
 POD_artifacts_book_of_nod.840.t: "Sự Cám Dỗ của Caine, tiếp theo"
 POD_artifacts_book_of_nod.840.desc: "Khi ta tỉnh dậy từ giấc ngủ ngày của mình, ta nghe tiếng cánh chim vỗ nhẹ nhàng và ta thấy đôi cánh đen của Uriel phủ quanh ta — Uriel, kẻ gặt hái, Thiên Thần của Cái Chết, Uriel tăm tối ngự trong bóng tối.\n\nUriel nói với ta khẽ khàng, rằng 'Con của Adam. Con của Eve. Chúa Toàn Năng đã tha thứ tội lỗi của ngươi. Ngươi có chấp nhận lòng thương xót của Người và để ta đưa ngươi đến phần thưởng của mình, không còn bị nguyền rủa nữa?"\n\nVà ta nói với Uriel cánh đen,\n'Không phải nhờ lòng thương xót của Chúa, mà là của chính ta, ta sẽ sống.\nTa là chính ta, ta đã làm những gì ta đã làm,\nvà điều đó sẽ không bao giờ thay đổi.'"
 POD_artifacts_book_of_nod.850.t: "Sự Cám Dỗ của Caine, tiếp theo"
 POD_artifacts_book_of_nod.850.desc: "Và rồi, qua Uriel đáng sợ\nChúa Toàn Năng nguyền rủa ta, phán rằng\n'Vậy thì, chừng nào ngươi còn bước đi trên mặt đất này,\nngươi và con cái ngươi sẽ bám lấy Bóng Tối\nNgươi sẽ chỉ uống máu\nNgươi sẽ chỉ ăn tro tàn\nNgươi sẽ mãi mãi như lúc ngươi chết,\nKhông bao giờ chết, sống mãi.\nNgươi sẽ bước đi mãi mãi trong Bóng Tối,\ntất cả những gì ngươi chạm vào sẽ vỡ vụn thành hư không,\ncho đến những ngày cuối cùng.'" 
 POD_artifacts_book_of_nod.860.t: "Sự Cám Dỗ của Caine, tiếp theo"
 POD_artifacts_book_of_nod.860.desc: "Ta thét lên đau đớn trước lời nguyền khủng khiếp này và xé nát thịt da mình.\nTa khóc ra máu,\nta hứng những giọt nước mắt vào một cái cốc\nvà uống chúng.\n\nKhi ta ngước lên từ ly rượu sầu muộn của mình\ntổng lãnh thiên thần Gabriel\nGabriel dịu dàng\nGabriel, Chúa Tể của Lòng Thương Xót\nhiện ra trước ta."  
 POD_artifacts_book_of_nod.870.t: "Sự Cám Dỗ của Caine, tiếp theo"
 POD_artifacts_book_of_nod.870.desc: "Tổng lãnh thiên thần Gabriel phán cùng ta,\n'Con của Adam, Con của Eve,\nHãy nhìn xem, lòng thương xót của Người Cha lớn lao hơn\nngươi có thể biết được\nvì ngay cả bây giờ có một con đường đã mở ra\nmột con đường của Lòng Thương Xót\nvà ngươi sẽ gọi con đường này là [golconda|E].\nVà hãy kể cho con cháu ngươi về nó,\nvì qua con đường đó chúng có thể\ntrở về ngự lại trong Ánh Sáng.'"
 POD_artifacts_book_of_nod.875.t: "Sự Cám Dỗ của Caine, tiếp theo"
 POD_artifacts_book_of_nod.875.desc: "Và với điều đó, bóng tối được nâng lên\n như một tấm màn che\n và ánh sáng duy nhất là đôi mắt sáng của Lilith.\n\nNhìn quanh mình, ta biết\nrằng ta đã Thức Tỉnh.\nKhi năng lượng của ta lần đầu\ndâng trào qua ta\nta khám phá ra\ncách di chuyển như tia chớp\ncách mượn sức mạnh của đất\ncách trở nên như đá\nNhững điều này như hơi thở từng là với ta."  
 POD_artifacts_book_of_nod.880.t: "Sự Cám Dỗ của Caine, tiếp theo"
 POD_artifacts_book_of_nod.880.desc: "Lilith sau đó chỉ cho ta\ncách nàng ẩn mình khỏi những kẻ săn đuổi\ncách nàng ra lệnh cho sự phục tùng\nvà cách nàng đòi hỏi sự tôn trọng\n\nRồi, tiếp tục Thức Tỉnh bản thân, ta khám phá ra\ncách biến đổi hình dạng\ncách có quyền năng chi phối loài vật\ncách khiến đôi mắt nhìn thấy thị giác"   
 POD_artifacts_book_of_nod.885.t: "Sự Cám Dỗ của Caine, tiếp theo"
 POD_artifacts_book_of_nod.885.desc: "Rồi Lilith ra lệnh cho ta dừng lại, nói rằng\nta đã vượt quá giới hạn của mình\nRằng ta đã đi quá xa\nRằng ta đang đe dọa chính bản chất của mình. Nàng dùng quyền năng của mình và ra lệnh cho ta dừng lại. Vì quyền năng của nàng, ta đã nghe theo,\nnhưng sâu bên trong ta một hạt giống đã được gieo trồng, hạt giống của sự nổi loạn\nvà khi nàng quay mặt đi khỏi ta,\nta lại mở lòng mình một lần nữa, với Màn Đêm,\nvà thấy được những khả năng vô hạn trong các vì sao\nvà biết rằng một con đường quyền năng, một con đường của Máu\nlà của ta để nắm lấy,\nvà thế là ta thức tỉnh trong mình Con Đường Cuối Cùng này,\ntừ đó mọi con đường khác sẽ nảy sinh."    
 POD_artifacts_book_of_nod.890.t: "Sự Cám Dỗ của Caine, tiếp theo"
 POD_artifacts_book_of_nod.890.desc: "Với quyền năng mới nhất này, ta đã phá vỡ những sợi dây trói buộc\nmà Quý Bà của Màn Đêm đặt lên ta\nTa rời khỏi Nữ Hoàng Bị Nguyền Rủa đêm hôm đó,\nkhoác mình trong bóng tối,\nta chạy trốn khỏi vùng đất Nod\nvà cuối cùng đến được một nơi\nmà ngay cả lũ ác quỷ của nàng cũng không thể tìm thấy ta."
 POD_artifacts_book_of_nod.900.t: "Câu Chuyện của Zillah"
 POD_artifacts_book_of_nod.900.desc: "Hãy để ta kể câu chuyện về Zillah\nngười đầu tiên được Caine yêu,\nngười vợ đầu tiên của Caine,\ndòng máu ngọt ngào nhất,\nlàn da mềm mại nhất,\nđôi mắt trong veo nhất\n\nMột mình trong số những Hậu Duệ mới nhất của Caine,\nCaine khao khát Nàng,\nvà nàng chẳng để tâm đến khao khát của hắn, quay mặt đi khỏi Hắn.\nKhông quà tặng, không lễ vật hiến tế, không nước hoa, không bồ câu,\nkhông vũ công xinh đẹp, không ca sĩ, không bò mộng,\nkhông tượng điêu khắc, không áo quần đẹp đẽ,\nkhông gì có thể làm trái tim Zillah\ntừ đá hóa thành quả ngọt."
 POD_artifacts_book_of_nod.900.desc.notale: "Ngài không có một bản sao của 'Câu Chuyện của Zillah'"
 POD_artifacts_book_of_nod.900.option.a: "Tiếp tục Đọc Câu Chuyện của Zillah"
 POD_artifacts_book_of_nod.910.t: "Câu Chuyện của Zillah, tiếp theo"
 POD_artifacts_book_of_nod.910.desc: "Vậy nên Caine giật tóc râu mình\nvà xé tóc mình\nvà đi lang thang trong hoang dã\nvào ban đêm, nghĩ về nàng,\ncháy bỏng vì nàng,\nvà một đêm nọ Caine bắt gặp\nmột Mụ Phù Thủy già hát cho mặt trăng nghe.\n\nCaine nói với Mụ Phù Thủy,\n"Sao ngươi lại hát như vậy?"\nVà Mụ Phù Thủy đáp lại,\n'Vì ta khao khát thứ ta không thể có ...'"  
 POD_artifacts_book_of_nod.920.t: "Câu Chuyện của Zillah, tiếp theo"
 POD_artifacts_book_of_nod.920.desc: "Caine nói với Mụ Phù Thủy,\n'Ta cũng khao khát. Người ta có thể làm gì?'' \n\nMụ Phù Thủy mỉm cười và nói,\n'Uống máu ta đêm nay,\nCaine, Cha của Kindred,\nvà quay lại đêm mai.\nRồi ta sẽ kể cho ngươi nghe sự khôn ngoan của Mặt Trăng.'\nCaine uống từ chiếc cổ trần của Mụ Phù Thủy,\nrồi rời đi."
 POD_artifacts_book_of_nod.930.t: "Câu Chuyện của Zillah, tiếp theo"
 POD_artifacts_book_of_nod.930.desc: "Đêm sau, Caine thấy Mụ Phù Thủy đang ngủ trên một tảng đá.\n'Dậy đi, Mụ Phù Thủy,' Caine nói.\n'Ta đã trở lại.\n\nMụ Phù Thủy mở một mắt và nói,\n'Ta mơ thấy giải pháp cho ngươi đêm nay. Uống thêm lần nữa từ ta,\nrồi quay lại đêm mai.\nMang theo một cái bát bằng đất sét.\nMang theo một con dao sắc.\nTa sẽ có câu trả lời cho ngươi lúc đó.'"
 POD_artifacts_book_of_nod.940.t: "Câu Chuyện của Zillah, tiếp theo"
 POD_artifacts_book_of_nod.940.desc: "Một lần nữa. Caine lấy máu từ Mụ Phù Thủy,\nngười lập tức chìm trở lại vào giấc ngủ say.\n\nKhi Caine trở lại vào đêm sau,\nMụ Phù Thủy ngước nhìn hắn và mỉm cười,\n'Xin chào, Chúa Tể của Dã Thú,' Mụ Phù Thủy nói.\n'Ta có sự khôn ngoan ngươi tìm kiếm.'\n'Lấy một ít máu của ta,\nvào cái bát ngươi có,\nvà trộn vào những quả mọng này\nvà những thảo dược này,\nvà uống cạn thứ linh dược.'" 
 POD_artifacts_book_of_nod.950.t: "Câu Chuyện của Zillah, tiếp theo"
 POD_artifacts_book_of_nod.950.desc: "'Ngươi sẽ không thể cưỡng lại.\nNgươi sẽ đầy quyền năng.\nNgươi sẽ tài giỏi.\nNgươi sẽ nồng nàn.\nNgươi sẽ rực sáng.\nTrái tim của Zillah sẽ tan chảy\nnhư tuyết tan vào xuân.'\n\nVà thế là. Caine uống từ thứ linh dược của Mụ Phù Thủy,\nvì hắn quá yêu Zillah,\nvà hắn cũng khao khát tình yêu của nàng đáp lại."
 POD_artifacts_book_of_nod.960.t: "Câu Chuyện của Zillah, tiếp theo"
 POD_artifacts_book_of_nod.960.desc: "Và Mụ Phù Thủy cười. Mụ Phù Thủy cười to. Mụ đã lừa hắn! Mụ đã bẫy hắn! Caine giận dữ không sao tả xiết. Caine vươn tay dùng quyền năng của mình, để xé nát Mụ Phù Thủy này bằng sức mạnh của hắn.\n\nMụ Phù Thủy cười khanh khách và nói, 'Đừng'\nVà Caine chẳng thể làm gì được nàng.\nMụ Phù Thủy cười khúc khích và nói. 'Hãy yêu ta.'\nVà Caine chẳng thể làm gì ngoài việc nhìn chằm chằm vào đôi mắt cổ xưa của mụ, khao khát làn da nhăn nheo của mụ.\nMụ Phù Thủy cười và nói, 'Hãy khiến ta bất tử.'\nVà Caine đã Trao truyền cho mụ. Mụ lại cười khanh khách, cười trong niềm khoái lạc thuần khiết của sự Trao truyền, vì nó chẳng gây đau đớn cho mụ." 
 POD_artifacts_book_of_nod.970.t: "Câu Chuyện của Zillah, tiếp theo"
 POD_artifacts_book_of_nod.970.desc: "'Ta đã khiến ngươi quyền năng. Caine của Enoch, Caine của Nod,\nnhưng ngươi sẽ mãi mãi bị ràng buộc với ta. Ta đã khiến ngươi làm chủ tất cả, nhưng ngươi sẽ không bao giờ quên ta!\nMáu của ngươi, mạnh mẽ như bây giờ,\nsẽ ràng buộc những kẻ uống nó,\nnhư ngươi đã làm, mỗi đêm một lần trong ba đêm.\nNgươi sẽ là chủ nhân.\nChúng sẽ là Nô Bộc của ngươi, như ngươi là của ta.\nVì dù Zillah sẽ yêu ngươi, như ngươi mong muốn,\nngươi sẽ yêu ta, mãi mãi.\nGiờ hãy đi, và giành lấy cô dâu xinh đẹp của ngươi,\nta sẽ chờ ngươi ở những nơi tăm tối nhất,\ntrong khi ta pha thêm linh dược cho sức khỏe của ngươi.'" 
 POD_artifacts_book_of_nod.980.t: "Câu Chuyện của Zillah, tiếp theo"
 POD_artifacts_book_of_nod.980.desc: "Và thế là, với trái tim nặng trĩu,\nCaine trở về Enoch.\nVà mỗi đêm,\ntrong ba đêm,\nZillah uống từ Sire của mình,\ndù nàng không hề hay biết.\nVà, vào đêm thứ ba,\nCaine tuyên bố hắn sẽ kết hôn\ncùng Zillah, hậu duệ ngọt ngào nhất của hắn,\nvà nàng đồng ý." 
 POD_artifacts_book_of_nod.1000.t: "Câu Chuyện của Mụ Phù Thủy"
 POD_artifacts_book_of_nod.1000.desc: "Suốt một năm một ngày\nCaine lao động phục dịch\ncho Mụ Phù Thủy, người với sự khôn ngoan từ máu.\ntrói buộc hắn chắc chắn như bất kỳ tù nhân nào.\nNàng sẽ đến thăm hắn vào ban đêm\nbắt hắn phải từ bỏ máu của mình\ncho những linh dược bí mật của nàng\nvà những công thức mạnh mẽ\nNàng sẽ bắt lấy Hậu Duệ của Hậu Duệ hắn,\nvà chúng sẽ không bao giờ được nghe tin lại nữa.\n\nNhưng Caine khôn ngoan. Hắn không bao giờ uống từ nàng nữa.\nVà nàng không yêu cầu hắn làm vậy, vì nghĩ\nrằng hắn vẫn luôn là Nô Bộc của mình."
 POD_artifacts_book_of_nod.1000.desc.notale: "Ngài không có một bản sao của 'Câu Chuyện của Mụ Phù Thủy'"
 POD_artifacts_book_of_nod.1000.option.a: "Tiếp tục Đọc Câu Chuyện của Mụ Phù Thủy"
 POD_artifacts_book_of_nod.1010.t: "Câu Chuyện của Mụ Phù Thủy, tiếp theo"
 POD_artifacts_book_of_nod.1010.desc: "Một đêm nọ. Caine đến gặp Mụ Phù Thủy trong rừng.\nvà kể cho mụ nghe về những giấc mơ khủng khiếp mà hắn đã trải qua trong giấc ngủ của mình.\n\n'Ta sợ cho mạng sống của mình, Mụ Phù Thủy.\nTa sợ lời tiên tri của Uriel,\nvà sự khao khát máu ta của Con Cái ta.\nHãy nói cho ta kiến thức bí mật, để ta có thể\nmạnh mẽ chống lại chính dòng máu của mình.'\n\nVà Mụ Phù Thủy đi đến một cái cây làm bằng gỗ gopher,\nvà bẻ gãy một cành.\nMụ lấy một con dao sắc\nvà gọt nhọn cành cây."
 POD_artifacts_book_of_nod.1020.t: "Câu Chuyện của Mụ Phù Thủy, tiếp theo"
 POD_artifacts_book_of_nod.1020.desc: "'Lấy mảnh gỗ sống này,\nsắc nhọn, chắc chắn,\nxuyên qua trái tim của hậu duệ lầm lạc của ngươi.\nNó sẽ khiến hắn bất động,\nvà thuộc quyền sai khiến của ngươi.\nThay vì tiệc tùng trên máu tim ngươi,\nhắn sẽ cảm nhận được sức nặng công lý của ngươi.'\n\nCaine nói. 'Cảm ơn, Mẹ,' và\nVới điều đó, di chuyển bằng những cử động nhanh nhẹn,\nCaine lấy chiếc cọc bằng gỗ gopher,\ntúm lấy nó và đâm nó\nsâu vào trái tim của Mụ Phù Thủy."
 POD_artifacts_book_of_nod.1030.t: "Câu Chuyện của Mụ Phù Thủy, tiếp theo"
 POD_artifacts_book_of_nod.1030.desc: "Bởi vì Caine, Caine khôn ngoan\nđã không ăn uống từ mụ suốt một năm một ngày\nvà bởi vì hắn dồn Ý Chí của mình qua\nđôi tay hắn, hắn đã phá vỡ Sợi Ràng Buộc mà mụ giữ\ntrên hắn, và xoay chuyển vận mệnh của mình.\n\nMụ lại cười, khi máu trào ra\nvà tuôn khỏi miệng mụ.\nĐôi mắt mụ tuôn trào hận thù.\nCaine hôn mụ một lần,\nhôn đôi môi lạnh lẽo, héo úa của mụ,\nvà bỏ mụ lại đó\ncho nụ cười dịu dàng của Raphael: mặt trời đang mọc lên."
 POD_artifacts_book_of_nod.1040.t: "Câu Chuyện của Mụ Phù Thủy, tiếp theo"
 POD_artifacts_book_of_nod.1040.desc: ""
 POD_artifacts_book_of_nod.1050.t: "Câu Chuyện của Mụ Phù Thủy, tiếp theo"
 POD_artifacts_book_of_nod.1050.desc: "" 

 POD_artifacts_book_of_nod.1100.t: "Câu Chuyện của Thành Phố Thứ Nhất"
 POD_artifacts_book_of_nod.1100.desc: "Thuở ban đầu chỉ có Caine\nCaine kẻ đã hiến tế em trai mình vì\ntình yêu.\nCaine kẻ đã bị trục xuất.\nCaine kẻ đã bị nguyền rủa mãi mãi với sự bất tử.\nCaine kẻ đã bị nguyền rủa với sự khao khát máu,\nChính từ Caine mà tất cả chúng ta sinh ra,\nSire của Sire chúng ta.\n\nSuốt một thời đại trôi qua hắn sống trong vùng đất Nod.\nTrong cô độc và khổ đau\nSuốt một kỷ nguyên hắn vẫn cô độc\nNhưng sự trôi qua của ký ức đã nhấn chìm nỗi sầu muộn của hắn."
 POD_artifacts_book_of_nod.1100.desc.notale: "Ngài không có một bản sao của 'Câu Chuyện của Thành Phố Thứ Nhất'"
 POD_artifacts_book_of_nod.1100.option.a: "Tiếp tục Đọc Câu Chuyện của Thành Phố Thứ Nhất" 
 POD_artifacts_book_of_nod.1110.t: "Câu Chuyện của Thành Phố Thứ Nhất, tiếp theo"
 POD_artifacts_book_of_nod.1110.desc: "Và thế là hắn trở về với thế giới của phàm nhân,\nVề với thế giới của em trai hắn Seth, con thứ ba của Eve,\nvà con cái của Seth đã tạo dựng.\nHắn trở về và được chào đón.\nVì không ai dám chống lại hắn,\ndo Dấu Ấn đã được đặt lên hắn.\n\nDân chúng thấy quyền năng của hắn và tôn thờ hắn,\nHắn trở nên quyền năng, và sức mạnh của hắn hùng mạnh,\ncách hắn gieo rắc kính sợ và uy quyền thật vĩ đại\nVà Con Cái của Seth phong hắn làm Vua\ncủa thành phố vĩ đại của họ, Thành Phố Thứ Nhất."
 POD_artifacts_book_of_nod.1115.t: "Câu Chuyện của Thành Phố Thứ Nhất, tiếp theo"
 POD_artifacts_book_of_nod.1115.desc: "Nhưng Caine trở nên cô độc trong Quyền Năng của mình.\nSâu bên trong hắn, hạt giống của sự cô độc nảy nở, và mọc lên một đóa hoa đen tối\nHắn thấy trong máu mình khả năng sinh sản\nBằng cách triệu hồi ác quỷ và lắng nghe những lời khôn ngoan thì thầm\nHắn học được cách tạo ra một đứa con cho riêng mình.\nHắn dần biết được quyền năng của nó, và, khi làm vậy,\nquyết định Trao truyền cho một kẻ gần hắn."
 POD_artifacts_book_of_nod.1120.t: "Câu Chuyện của Thành Phố Thứ Nhất, tiếp theo"
 POD_artifacts_book_of_nod.1120.desc: "Và, kìa, Uriel, Uriel Đáng Sợ, hiện ra trước Caine\nngay đêm đó và phán cùng hắn,\n'Caine, dù ngươi quyền năng, và mang dấu ấn của Chúa,\nhãy biết điều này: rằng bất kỳ Hậu Duệ nào ngươi tạo ra sẽ\nmang lời nguyền của ngươi, rằng bất kỳ Hậu Duệ nào của ngươi\nsẽ mãi mãi bước đi trong Vùng Đất Nod, và\nsợ hãi ngọn lửa và mặt trời, chỉ uống máu\nvà chỉ ăn tro tàn. Và vì chúng sẽ mang hạt giống ghen tuông của cha chúng, chúng sẽ mãi mãi âm mưu và chiến đấu lẫn nhau.\nĐừng đày đọa những đứa cháu của Adam đang tìm cách sống ngay chính. Caine!\nHãy kiềm chế sự Trao truyền đáng sợ của ngươi!'"
 POD_artifacts_book_of_nod.1125.t: "Câu Chuyện của Thành Phố Thứ Nhất, tiếp theo"
 POD_artifacts_book_of_nod.1125.desc: "Vậy mà, Caine biết mình phải làm gì, và một chàng trai trẻ\ntên Enoch, kẻ được yêu quý nhất trong dòng dõi của Seth,\ncầu xin được làm Con của Người Cha bóng tối.\n\nVà Caine, dù có ghi nhớ lời của Uriel,\ntóm lấy Enoch, và bọc hắn trong sự Trao truyền bóng tối.\n\nVà thế là, việc xảy đến rằng Caine sinh ra\nEnoch và, khi làm vậy, đặt tên Thành Phố Thứ Nhất là Enoch."
 POD_artifacts_book_of_nod.1130.t: "Câu Chuyện của Thành Phố Thứ Nhất, tiếp theo"
 POD_artifacts_book_of_nod.1130.desc: "Và khi làm vậy, Enoch cầu xin một người em trai,\nmột người em gái, và Caine, Người Cha nuông chiều,\nban cho hắn những điều đó, và tên của họ là\nZillah, người có dòng máu được Caine yêu quý nhất,\nvà Irad, kẻ có sức mạnh phục vụ cánh tay của Caine.\n\nVà những Kindred của Caine này học được cách\ntạo ra Hậu Duệ của riêng họ, và\nhọ Trao truyền cho thêm nhiều người trong dòng dõi của Seth, không suy nghĩ.\n\nVà rồi Caine khôn ngoan nói. 'Chấm dứt tội ác này.\nSẽ không còn nữa.'\nVà vì lời của Caine là luật lệ, Bầy Đàn của hắn tuân theo hắn."
 POD_artifacts_book_of_nod.1135.t: "Câu Chuyện của Thành Phố Thứ Nhất, tiếp theo"
 POD_artifacts_book_of_nod.1135.desc: "Thành phố tồn tại qua nhiều thời đại,\nVà trở thành trung tâm của một Đế Chế hùng mạnh.\nCaine trở nên gần gũi với những kẻ không giống hắn.\nCon cái của Seth biết hắn\nVà hắn, ngược lại, biết họ\nNhưng thế giới trở nên tăm tối với tội lỗi.\n\nCon Cái của Caine lang thang khắp nơi, buông thả theo những cách tăm tối của họ. Caine cảm thấy giận dữ khi con cái hắn tranh đấu. Hắn phát hiện ra sự dối trá khi thấy chúng gây chiến bằng lời nói. Hắn biết đến nỗi buồn khi thấy chúng ngược đãi con cái của Seth. Caine đọc được những điềm báo trên bầu trời tối dần, nhưng chẳng nói gì."
 POD_artifacts_book_of_nod.1140.t: "Câu Chuyện của Thành Phố Thứ Nhất, tiếp theo"
 POD_artifacts_book_of_nod.1140.desc: "Rồi trận Đại Hồng Thủy ập đến, một trận lũ lớn cuốn qua thế giới.\nThành Phố bị phá hủy,\ncon cái của Seth cùng với nó.\n\nMột lần nữa, Caine chìm vào nỗi sầu muộn lớn lao và đi vào cô độc.\nVà hắn bỏ mặc chúng ta, Hậu Duệ của hắn, tự lo liệu lấy.\nChúng ta tìm thấy hắn, sau nhiều tìm kiếm, sâu trong lòng đất,\nvà hắn bảo chúng ta hãy đi, nói rằng Trận Lụt là một sự trừng phạt,\ncho việc hắn đã trở lại thế giới của sự sống\nVà lật đổ luật lệ chân chính.\nHắn yêu cầu chúng ta đi, để hắn có thể ngủ."
 POD_artifacts_book_of_nod.1145.t: "Câu Chuyện của Thành Phố Thứ Nhất, tiếp theo"
 POD_artifacts_book_of_nod.1145.desc: "Vậy nên chúng ta một mình trở về để tìm con cái của Noah,\nVà tuyên bố rằng chúng ta là những kẻ cai trị mới.\n\nMỗi người tạo ra một Bầy Đàn, để giành lấy vinh quang của Caine,\nNhưng chúng ta không có sự khôn ngoan hay kiềm chế của hắn.\nMột cuộc đại chiến nổ ra, các Trưởng Lão chống lại Con Cái của họ,\nđúng như Uriel đã nói, và Con Cái đã giết chết cha mẹ mình.\nChúng nổi dậy. Dùng lửa và gỗ. Gươm và móng vuốt.\nĐể tiêu diệt những kẻ đã tạo ra chúng.\n\nNhững kẻ nổi loạn sau đó xây dựng một thành phố mới. Từ Đế Chế sụp đổ, họ tập hợp Mười Ba clan đã bị phân tán bởi Đại Chiến, và mang tất cả họ lại với nhau,"
 POD_artifacts_book_of_nod.1150.t: "Câu Chuyện của Thành Phố Thứ Nhất, tiếp theo"
 POD_artifacts_book_of_nod.1150.desc: "Họ mang vào Clan Vương Quyền,\nClan của Dã Thú,\nClan Mặt Trăng,\nClan của Kẻ Ẩn Giấu,\nClan Lữ Khách,\nClan của Đóa Hồng,\nClan Màn Đêm,\nClan của Những Kẻ Biến Hình,\nClan Rắn,\nClan của Cái Chết,\nClan của Người Chữa Lành,\nClan của Cuộc Săn,\nvà Clan Học Giả."
 POD_artifacts_book_of_nod.1155.t: "Câu Chuyện của Thành Phố Thứ Nhất, tiếp theo"
 POD_artifacts_book_of_nod.1155.desc: "Họ xây nên một thành phố tráng lệ,\nvà dân chúng tôn thờ họ như những vị thần.\n\nHọ tạo ra Hậu Duệ mới của riêng mình,\nThế Hệ Thứ Tư của Hậu duệ Cain.\nNhưng họ sợ hãi Jyhad,\nLời Tiên Tri của Uriel,\nVà điều đó bị cấm đối với những Con Cái ấy\nTạo ra thêm những kẻ khác thuộc giống loài của họ.\nQuyền năng này các Trưởng Lão của họ giữ cho riêng mình.\nKhi một Hậu Duệ được tạo ra, nó sẽ bị săn lùng và giết chết,\ncùng với Sire của nó."
 POD_artifacts_book_of_nod.1160.t: "Câu Chuyện của Thành Phố Thứ Nhất, tiếp theo"
 POD_artifacts_book_of_nod.1160.desc: "Dù Caine đã rời xa chúng ta,\nchúng ta vẫn cảm nhận được ánh mắt cẩn trọng của hắn dõi theo chúng ta,\nvà chúng ta biết rằng hắn ghi nhận những hành động và cách sống của chúng ta.\nHắn nguyền rủa Malkav, khi kẻ đó bôi nhọ hình ảnh của hắn\nvà đày đọa hắn vào sự điên loạn, mãi mãi.\nKhi Absimiliard bị phát hiện thỏa mãn sở thích của mình theo những cách bẩn thỉu với chính Con Cái của mình,\nCaine đặt tay lên Absimiliard,\nvà bảo hắn rằng hắn sẽ mãi mãi mang vẻ ngoài xấu xa và méo mó của mình."
 POD_artifacts_book_of_nod.1165.t: "Câu Chuyện của Thành Phố Thứ Nhất, tiếp theo"
 POD_artifacts_book_of_nod.1165.desc: "Hắn nguyền rủa tất cả chúng ta, vì đã giết phần đầu tiên trong Con Cái của hắn, Thế Hệ Thứ Hai,\nKhi chúng ta đã săn lùng chúng từng đứa một,\nZillah Xinh Đẹp, Irad Mạnh Mẽ, và Enoch Người Cai Trị Đầu Tiên.\nVà chúng ta thương tiếc tất cả bọn họ, vì chúng ta đều cùng một giống loài,\nvà tất cả các gia tộc của hậu duệ Caine.\n\nDù thành phố này vĩ đại như của Caine,\ncuối cùng nó cũng già cỗi.\nNhư mọi vật sống, nó dần dần bắt đầu chết đi."
 POD_artifacts_book_of_nod.1170.t: "Câu Chuyện của Thành Phố Thứ Nhất, tiếp theo"
 POD_artifacts_book_of_nod.1170.desc: "Các vị thần lúc đầu không thấy được sự thật,\nVà khi cuối cùng họ nhìn quanh mình thì đã quá muộn.\nVì, như Uriel đã nói,\nhạt giống của Cái Ác được gieo trồng đã nở thành một đóa hồng đỏ như máu.\nVà Troile, Con của Con của Con của Caine\nnổi dậy, và giết chết Cha mình, Brujah.\nVà ăn thịt hắn.\nRồi chiến tranh tàn phá thành phố\nVà không gì có thể như trước nữa."
 POD_artifacts_book_of_nod.1175.t: "Câu Chuyện của Thành Phố Thứ Nhất, tiếp theo"
 POD_artifacts_book_of_nod.1175.desc: "Mười Ba Người thấy thành phố của họ bị phá hủy và quyền lực của họ bị dập tắt,\nVà họ buộc phải chạy trốn, Hậu Duệ của họ cùng với họ.\nNhưng nhiều người đã bị giết trong lúc chạy trốn, vì họ đã trở nên yếu đuối.\n\nVới quyền uy của họ đã mất,\ntất cả đều tự do tạo ra Bầy Đàn riêng của mình,\nVà sớm thôi có nhiều Kindred mới,\nNhững kẻ cai trị khắp mặt đất.\nNhưng điều này không thể kéo dài.\n\nTheo thời gian, có quá nhiều Kindred\nVà rồi lại có chiến tranh một lần nữa,"
 POD_artifacts_book_of_nod.1180.t: "Câu Chuyện của Thành Phố Thứ Nhất, tiếp theo"
 POD_artifacts_book_of_nod.1180.desc: "Các Trưởng Lão đã ẩn náu sâu từ trước,\nVì họ đã học được sự thận trọng,\nNhưng Con Cái của họ đã lập ra thành phố và Bầy Đàn riêng của mình,\nVà chính họ là những kẻ bị giết trong làn sóng chiến tranh lớn.\nCuộc chiến toàn diện đến mức không còn ai của Thế Hệ đó\nĐể nói về chính mình nữa.\nNhững đợt sóng xác thịt phàm nhân được gửi đi khắp các lục địa\nĐể nghiền nát và thiêu rụi các thành phố của Kindred.\nPhàm nhân nghĩ rằng họ đang chiến đấu cho cuộc chiến của riêng mình.\nNhưng chính vì chúng ta mà họ đã đổ máu."
 POD_artifacts_book_of_nod.1185.t: "Câu Chuyện của Thành Phố Thứ Nhất, Tiếp Theo"
 POD_artifacts_book_of_nod.1185.desc: "Khi cuộc chiến này kết thúc,\nTất cả Kindred ẩn náu khỏi lẫn nhau\nVà khỏi loài người vây quanh họ.\nChúng ta vẫn ẩn náu cho đến ngày nay,\nVì Jyhad vẫn tiếp diễn.\nVà không ai biết khi nào Caine sẽ trỗi dậy lần nữa,\ntừ giấc ngủ của hắn trong lòng đất,\nvà kêu gọi thành phố Gehenna,\nThành Phố Cuối Cùng, Thành Phố của Sự Phán Xét.\nJyhad vẫn tiếp diễn."
 POD_artifacts_book_of_nod.1185.option.f: "Hồi Sinh Văn Hóa của Thành Phố Thứ Nhất"
