 POD_artifacts_book_of_nod.100.t: "Sách Nod"
 POD_artifacts_book_of_nod.100.desc: "Một tuyển tập những văn bản cổ xưa, được xem là thánh thư đối với các tín đồ Nod giáo $pod_cainites$. Nó bao gồm nhiều bản hiệu đính và mảnh vỡ đã được các học giả khác nhau ghép lại. Theo truyền thống, phương thức truyền tải chính của câu chuyện Caine là truyền khẩu, trong khi các văn bản chứa những sự kiện quan trọng nhất trong lịch sử Hậu duệ Cain được canh giữ nghiêm ngặt để bảo vệ Luật Che Giấu.\n\nCó vô số câu hỏi còn bỏ ngỏ liên quan đến lịch sử của Sách Nod. Tác giả của nó không rõ, dù Malkav, Saulot, và thậm chí cả Caine thường được cho là đã viết một phần của nó, nếu không muốn nói là toàn bộ. Dù tính xác thực của nội dung thường bị nghi ngờ, nó vẫn là ghi chép lịch sử sơ khai được đồng thuận nhiều nhất về $pod_cainites$.\n\nMột số cho rằng cả cuốn sách chỉ là huyền thoại hay dối trá, một câu chuyện mà ma cà rồng bịa ra để giải thích cho sự tồn tại của mình hay một công cụ dùng để đánh lừa kẻ khác suy nghĩ và hành động theo một cách nhất định. Càng làm tăng thêm những nghi ngờ này là việc nhiều đoạn văn được gán cho Sách Nod cực kỳ mơ hồ hoặc mâu thuẫn, đôi khi có vẻ như là sự đánh lạc hướng trắng trợn – điều này tạo ra một số cuộc ly giáo lớn (và thường bạo lực) trong cách diễn giải giữa các nhóm Nod giáo.\nMảnh cổ nhất của cuốn Sách được xác định niên đại ngay trước thời Sumer, khoảng năm 4500 TCN."
 POD_artifacts_book_of_nod.100.option.a: "Biên Niên Sử Caine"
