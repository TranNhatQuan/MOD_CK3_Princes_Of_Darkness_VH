 POD_artifacts_book_of_nod.reading.gain: "Đọc từ Sách Nod có thể mang lại những hiểu biết sâu sắc."
 POD_artifacts_book_of_nod.reading.loss: "Đọc từ Sách Nod hé lộ những sự thật kinh hoàng."
 POD_artifacts_book_of_nod.reading.learn.enochian: "Đọc từ Sách Nod đã dạy cho ngài ngôn ngữ Enochian."
