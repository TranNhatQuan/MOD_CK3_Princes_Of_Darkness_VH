 pod1230objectives_judges.1.t: "Các Magi của Tiên Tri"
 pod1230objectives_judges.1.desc: "Trong thời gian phục vụ các vị vua Babylon và Ba Tư, tiên tri Dani'el trở thành thủ lĩnh trong số các Magi. Với kiến thức về pháp thuật và sự thông thái của G-d, Dani'el trở thành Thủ Lĩnh của các Magi và dạy họ những điều huyền bí của Tanakh để dẫn dắt họ trong nghề của mình. Họ nghiên cứu các vì sao để tìm điềm báo về tương lai và những con đường tuyến tính hơn của thuật thần triệu truyền thống được dạy bởi Talmud bí mật.\n\nVới sự trỗi dậy của Những Kẻ Bị Nguyền Rủa và Những Kẻ Sa Ngã trong khu vực, các Magi đã bị loại bỏ rộng rãi khỏi vai trò cố vấn triều đình và buộc phải rút lui vào các học viện Geonic. Năng lực của họ có thể là một điều bí ẩn với chúng ta nhưng rõ ràng bắt nguồn từ những lời dạy của tiên tri Dani'el, khiến họ trở thành đồng minh. Sau khi chiếm lại trung tâm hoạt động của họ, chúng ta đã có thể thiết lập liên lạc với họ lần đầu tiên sau nhiều thế kỷ. Với sự thông thái của họ và sự giúp đỡ của các Quan Xét Mizrahi, chúng ta có thể truyền lại những bí mật từng chỉ được nắm giữ bởi số ít và củng cố cuộc chiến vĩnh cửu của chúng ta chống lại những kẻ ẩn nấp trong bóng tối."
 pod1230objectives_judges.1.a: "Cùng nhau chúng ta học hỏi."

 # Menahemite special content for Magi decision
 # Subevent so event number is a bunch of 1s
 pod1230objectives_judges.111.t: "Các Thầy Dạy của Menahem"
 pod1230objectives_judges.111.desc: "Sau khi chiếm Baghdad từ tay bè lũ của Lilith, chúng ta tái lập liên lạc với các Magi. Họ là bậc thầy của Talmud, cả bản công khai lẫn bản ẩn giấu, được thành lập bởi tiên tri Daniel trong thời kỳ Lưu Đày Đầu Tiên. Thường có một người trong số họ giữ danh hiệu Rosh Yeshiva hay Gaon. Di sản này đã ban cho họ sự am hiểu sâu sắc về nghệ thuật Kabbalah và pháp thuật, khiến họ trở thành đồng minh vô giá của các Quan Xét.\n\nVà thế là các Magi lần đầu gặp Menahem khi ông hành trình đến Baghdad trong cuộc tìm kiếm tri thức của mình. Họ chỉ dạy ông cách sử dụng đúng đắn những món quà thần thánh mà Adon Olam ban cho ông. Họ tiết lộ sự tồn tại của Con Cái Lilith và những sinh vật khác len lỏi trong bóng tối. Với sự giúp đỡ của họ, ông trở thành con người vĩ đại và uyên bác đã dẫn dắt chúng ta sau cái chết của cha ông và giải thoát chúng ta khỏi vòng kìm kẹp của bóng tối.\n\nCác Magi đã nghe tin đồn về hành động của chúng ta, nhưng chưa thể thiết lập liên lạc chính thức. Giờ đây, họ đề nghị khôi phục liên minh cũ và dạy chúng ta những gì đã truyền cho Menahem. Tất cả những gì họ yêu cầu đổi lại là sự giúp đỡ trong nỗ lực của họ để hiểu về những sinh vật trong bóng tối của họ, để có thể chống lại chúng hiệu quả hơn.\n\nVới Baghdad thuộc về chúng ta và sự ủng hộ của các Magi, không còn nghi ngờ gì rằng Jerusalem sẽ được giành lại từ bóng tối."
 pod1230objectives_judges.111.a: "Nối bước Menahem, rồi tiến xa hơn nữa"
 pod1230objectives_judges.111.b: "Chân đèn cháy sáng hơn"
 house_menahemites_improved_menahem_modifier: "Bước Chân của Menahem"
 house_menahemites_improved_menahem_modifier_desc: "Dù có lúc người ta từng nghi ngờ liệu Menahem có thực sự là Con Trai của Dawid hay không, giờ đây không còn nghi ngờ gì nữa. Ông có thể chưa hoàn toàn thừa kế trọn vẹn di sản của Dawid trong thời của mình, nhưng chúng ta đã hiện thực hóa nhiều lời hứa của ông và sẵn sàng hoàn thành vận mệnh của ông. Ông đã dạy chúng ta cách nhận diện và chiến đấu chống lại kẻ thù thật sự, một mục tiêu mà giờ đây chúng ta được các thầy dạy của ông hỗ trợ. Chúng ta đứng vững, được tiếp thêm sức mạnh, sẵn sàng đẩy lùi màn đêm."
 house_menahemites_menahem_teachers_modifier: "Các Thầy Dạy của Menahem"
 house_menahemites_menahem_teachers_modifier_desc: "Như họ từng dạy Menahem, giờ đây các Magi truyền lại những lời dạy của mình cho chúng ta, ban cho chúng ta cái nhìn sâu sắc về những gì chúng ta đang chiến đấu chống lại. Với sự giúp đỡ của họ, chân đèn của các Quan Xét cháy sáng hơn bao giờ hết, đẩy lùi bóng tối."

 pod1230objectives_judges.2.t: "Những Người Tạo Golem"
 pod1230objectives_judges.2.desc: "Sau nhiều nỗ lực, chúng ta đã thiết lập liên lạc với các Quan Xét Ashkenazi và Những Kẻ Bị Nguyền Rủa trong khu vực. Những Kẻ Bị Nguyền Rủa không muốn can dự vào cuộc săn lùng của chúng ta, chỉ bảo vệ những người anh em phàm nhân của chúng ta. Dù một vài Quan Xét cuồng tín hơn có thể phản đối điều này, chúng ta biết ơn sự giúp đỡ của họ trong việc bảo vệ anh em ta.\nCác Giáo Sĩ Baal Shem của họ, cái gọi là \"bậc thầy của cái tên\", đã nâng cao kiến thức của chúng ta về việc tạo cấu trúc lên gấp mười lần. Hãy để chúng ta dùng những golem này để bảo vệ mọi cộng đồng của mình và diệt trừ những kẻ săn mồi chúng ta từ trong bóng tối."
 pod1230objectives_judges.2.a: "Cùng nhau chúng ta bảo vệ."

 pod1230objectives_judges.3.t: "Truyền Thống của Dan"
 pod1230objectives_judges.3.desc: "Dù chúng ta có thể muốn trở thành học giả hay giáo sĩ, mọi Quan Xét đều buộc phải trở thành binh lính và chiến binh vì bảo vệ dân tộc mình phải đặt lên hàng đầu. Tuy nhiên, các Quan Xét Esra'elawi tại Abyssinia đã duy trì truyền thống chiến binh cổ xưa của dân tộc chúng ta, cụ thể là chi tộc Dan. Người Setite, Kẻ Bất Tử, Laibon và Ashirra không ngừng cố gắng tiêu diệt anh em chúng ta tại Beta Israel, buộc các Quan Xét Esra'elawi phải tinh thông nghệ thuật chiến tranh.\nGiờ đây khi chúng ta đã liên lạc được và chứng tỏ mình có thể giúp đỡ họ, họ đã truyền lại những lời dạy cổ xưa nhất của mình. Với nền tảng này, chúng ta có thể đảm bảo rằng truyền thống được duy trì trong triều đại của chúng ta, giúp ta trong cuộc truy tìm để tiêu diệt Caine và bè lũ của Lilith."
 pod1230objectives_judges.3.a: "Cùng nhau chúng ta chiến đấu."

 pod1230objectives_judges.4.t: "Bậc Thầy Thương Mại"
 pod1230objectives_judges.4.desc: "Do sự cô lập của họ khỏi phần lớn các cộng đồng Do Thái, phải mất một số nỗ lực để tiếp cận người Kochin. Họ có rất nhiều nguồn gốc. Một số từng là thương nhân dưới lệnh của Vua Solomon để đến những bờ biển chưa từng thấy. Những người khác đến đây, chạy trốn khỏi một trong hai cuộc Lưu Đày. Các Quan Xét của họ phải đối mặt với nhiều mối đe dọa không kém, dù đó là Những Kẻ Bị Nguyền Rủa Ấn Độ, Những Kẻ Bị Nguyền Rủa đến từ phương tây, hay Kẻ Chết Đói đến từ xa hơn về phía đông.\n\nNgười Kochin đã tinh thông hai lĩnh vực, cho phép họ sống sót, và giờ đây đã ban tặng sự tinh thông đó cho chúng ta. Họ kiểm soát một mạng lưới thương mại khổng lồ trải khắp Ấn Độ và khu vực lân cận để nuôi dưỡng các Quan Xét, và họ đã xây dựng một mạng lưới tình báo dựa trên nền tảng thương mại đó để giúp các Quan Xét trong các cuộc săn lùng của mình."
 pod1230objectives_judges.4.a: "Cùng nhau chúng ta quan sát."

 pod1230objectives_judges.5.t: "Các Nhà Ngoại Giao & Thần Học Gia của Iberia"
 pod1230objectives_judges.5.desc: "Người Do Thái Sephardi đã dành nhiều thế kỷ để nâng cao sự am hiểu về các văn bản thánh của chúng ta và học cách sinh tồn trong một môi trường thù địch nơi một vị vua có thể khoan dung với họ còn vị tiếp theo lại cố gắng tận diệt họ. Những kỹ năng này đã được truyền lại cho các Quan Xét địa phương của họ và khiến họ trở thành một trong những người anh em hiệu quả nhất của chúng ta.\n\nPhải mất một thời gian và nỗ lực, nhưng chúng ta đã đưa được người Sephardi về phía mình và giúp giảm bớt tình cảnh của họ. Để cảm tạ nỗ lực của chúng ta, họ đã gửi các giáo sĩ đến giúp đỡ chúng ta trong cuộc chiến chống lại thứ trườn bò trong bóng tối."
 pod1230objectives_judges.5.a: "Cùng nhau chúng ta đứng vững."

 pod1230objectives_judges.6.t: "Nguồn Gốc của Những Kẻ Bất Tử"
 pod1230objectives_judges.6.desc: "Osiris là một Kẻ Bị Nguyền Rủa cổ xưa, được Trao truyền bởi một trong những đứa con của Caine và có khả năng là $pod_cainite$ [Glossary('Generation','game_concept_vampgeneration_desc')] thứ 3 hoặc thứ 4. [Glossary('Sire','game_concept_Sire_desc')] của ông không rõ, dù Ilyes (thủy tổ của $pod_clan$ Brujah) là một ứng viên phổ biến trong một số học giả của chúng ta, một phần do giả thuyết đặt Isis (vợ của Osiris) là hậu duệ của Lilith.\n\nAi đó (các học giả của chúng ta chỉ đến Ilyes, Lilith, hay một pháp sư tên Thoth) sau đó sẽ quay lại giúp Isis và Nephthys trong cuộc tìm kiếm tri thức phép thuật của họ, mở rộng kiến thức mà Isis đã có sẵn.\n\nVới phép thuật của họ (và có lẽ bằng cách lợi dụng sự vắng mặt của Bene Elohim để đưa người chết đi đúng cách?), Những Kẻ Bất Tử đã vĩnh viễn ràng buộc linh hồn vào chính thân thể của họ sao cho linh hồn cuối cùng có thể trở về thế giới vật chất sau khi lấy lại sức mạnh trong [UmbraGlossaryLocalized('shadowlands','Âm Phủ')].\n\nTrong khi Những Kẻ Bất Tử Ai Cập hay Xác Ướp thường xuyên giao chiến với Những Kẻ Bị Nguyền Rủa (có lẽ bị Lilith lợi dụng?), những Kẻ Bất Tử khác đã tránh được việc vướng vào cuộc xung đột đó và dường như đã khám phá ra những phương thức khác biệt để đạt được kết quả cuối cùng tương tự, kể cả những khả năng thuật giả kim.\n\nTrích đoạn từ bản thảo sơ bộ của Havanah Tập 21, Chương 1 & 2"
 pod1230objectives_judges.6.a: "Chỉ có bè lũ của Lilith mới đáng để chúng ta chú ý."

 pod1230objectives_judges.7.t: "Nguồn Gốc của Những Kẻ Sa Ngã"
 pod1230objectives_judges.7.desc: "... và thế là một phần ba số Bene Elohim đã gia nhập Lucifer trong cuộc nổi loạn của hắn, bị thúc đẩy bởi lòng tham và sự kiêu ngạo của chúng. Một số tin rằng kế hoạch của chúng khôn ngoan hơn kế hoạch của YHWH. Những kẻ khác tìm kiếm quyền lực tối thượng đối với nhân loại, chính quyền năng của YHWH, hay đơn giản chỉ muốn hủy diệt tất cả những gì chúng xem là ô uế hay là địch thủ đối với tình yêu của G-d. Những kẻ khác nữa lại thấy những khái niệm mới về chiến tranh và bạo lực do Caine mang đến thật hấp dẫn. Bất kể lý do riêng của chúng là gì, chúng đã nổi loạn chống lại kế hoạch hoàn hảo của NGƯỜI và, không ai ngạc nhiên, đã thua trong cuộc chiến chống lại những kẻ trung thành của NGƯỜI.\nVì tội lỗi của mình, chúng bị trục xuất khỏi Tầng Trời Thứ Ba, vĩnh viễn bị ràng buộc với Trái Đất mà chúng từng thèm khát và Tầng Trời Thứ Nhất. Chúng bị mắc kẹt trong một vùng đất gọi là Vực Thẳm, chỉ có thể thoát ra qua tội lỗi và sự ngạo mạn của phàm nhân. Trên Trái Đất và trong Vực Thẳm, chúng sẽ chờ đợi Sự Phán Xét Cuối Cùng khi chúng sẽ bị đày xuống Gehinnom ...\n\nVì tội kích động cuộc nổi loạn, Lucifer đã nhận thêm một lời nguyền. Cũng như Trái Đất từng bị giao cho Những Kẻ Sa Ngã trong một thời gian, thì Những Kẻ Sa Ngã cũng bị giao phó cho những thói đồi bại của chính chúng. Lucifer sẽ đứng đó, không bị Vực Thẳm hay những vặn vẹo tồi tệ nhất của tội lỗi chạm đến, để hắn có thể chứng kiến tất cả những kẻ hắn từng tập hợp dưới trướng mình dần dần vặn vẹo và khuất phục trước sự tha hóa mà chính chúng đã sinh ra, chỉ mong muốn sự hủy diệt của chính hắn ...\n\nĐã hai lần Asmodeus và Abaddon tìm cách thay thế con người bằng những nô lệ bị bóp méo mà chúng gọi là Nephilim và cả hai lần G-d đều can thiệp vào kế hoạch của chúng. Lần đầu tiên, Đại Hồng Thủy đã quét sạch mọi dấu vết của những dòng máu ô uế đó. Đáp lại lần thứ hai, một tín ngưỡng mới nổi lên từ chính tín ngưỡng của chúng ta, một tín ngưỡng sẽ được gọi là Cơ Đốc giáo.\n\nTrích đoạn từ Havanah Tập 11, Chương 2 & Tập 18, Chương 7"
 pod1230objectives_judges.7.a: "Ta tự hỏi lần sau NGƯỜI sẽ phản ứng ra sao khi chúng lại thử."

 #pod1230objectives_judges.8.t: "Was Yeshua the Ha-mashiach?"
 #pod1230objectives_judges.8.desc: "After carefully studying the matter, there is evidence indicating that Yeshua of Nazareth may be Mashiach ben Yosef. However, the matter is not conclusive so we could choose to rule against it. Is the evidence sufficient to proclaim Yeshua as the Ha-mashiach?"
 #pod1230objectives_judges.8.a: "It is."
 #pod1230objectives_judges.8.b: "It is not."
 #
 #pod1230objectives_judges.9.t: "The Ha-mashiach Has Come!"
 #pod1230objectives_judges.9.desc: "In the ninth chapter of his book, Daniel began a count from Mar 14, 445BC, as the Gentiles reckon it, when we received the order to rebuild the Second Temple. He said that the Mashiach would come 483 of our years later. As it was said, so it was done for Yeshua passed through the gates of Jerusalem on the Tenth of Nisan precisely 483 years later to be cut off and left with nothing. As Daniel warned us, our city and G-d's temple were cast down as punishment for missing this sign.\n\nLet it now be known across the land that Mashiach ben Yosef has come! Let us worship His holy name and celebrate the grace of G-d for truly thine is the kingdom and the glory forever!"
 #pod1230objectives_judges.9.a: "Hallelujah and amen!"

 pod1230objectives_judges.9.t: "Sự Thật về Yeshua"
 pod1230objectives_judges.9.desc: "Người thường được biết đến với tên Yeshua thành Nazareth vẫn là một điều bí ẩn với chúng ta từ lâu. Một số học giả của chúng ta tin rằng ông thực ra là một Kẻ Bất Tử tên Melchizedek. Như nhiều Kẻ Bất Tử khác, ông sẽ có khả năng bắt chước sự phục sinh, tỉnh dậy trong chính thân thể mình sau một khoảng thời gian nhất định. Quan điểm này được củng cố bởi các báo cáo rằng ngôi mộ của ông được tìm thấy trống rỗng ngoài tấm vải liệm, một đặc điểm chung của Những Kẻ Bất Tử ...\n\nSự suy đoán có phần táo bạo này vẫn thiếu nguồn đáng tin cậy và hội của chúng ta đã đồng ý chỉ giữ nó ở mức đó, một giả thuyết, để tránh làm những thợ săn Cơ Đốc đồng nghiệp của chúng ta tức giận. Sự hợp tác với họ đã chứng tỏ hiệu quả nhiều lần trong quá khứ và việc giữ im lặng về những khác biệt thần học của chúng ta trong khi tập trung vào mối đe dọa thực sự là một cách tiếp cận thực dụng, và hiệu quả hơn nhiều.\n\nBản thảo từ Havanah Tập 21, Chương 16, chưa từng được công bố ngoài giới Quan Xét cấp cao."
 pod1230objectives_judges.9.a: "Chúng ta có thể đồng ý bất đồng quan điểm."

 pod1230objectives_judges.11.t: "Nguồn Gốc của Fae"
 pod1230objectives_judges.11.desc: "Mọi con người đều được tạo ra theo hình ảnh của G-d và giống như Người. Vì Người là Đấng Sáng Tạo của vạn vật, nên con người cũng mong muốn và có khả năng sáng tạo. Là những phản chiếu thấp kém hơn của Người, nhân loại có thể biến giấc mơ và ác mộng của mình thành hiện thực. Fae được tạo ra khi nhân loại theo nghĩa đen tạo ra những thứ từ giấc mơ và ác mộng của họ, phản ánh lý tưởng và nỗi sợ hãi của bất kỳ ai trong khu vực địa phương ...\n\nMối liên hệ của chúng với niềm tin có nghĩa là hiện thực, chủ nghĩa bi quan, sự thiếu vắng kỳ diệu, và sự thiếu vắng hỗn loạn đều có khả năng gây tổn thương thể xác cho chúng hoặc hạn chế năng lực của chúng ...\n\nSắt lạnh, được rèn nên trật tự thông qua ý chí thuần túy, được biết là dễ dàng tiêu diệt những sinh vật của giấc mơ này ...\n\nFae hiện là những sinh vật độc ác, phản chiếu của hoang dã và muông thú của nó khi chúng tìm cách hủy diệt văn minh. Tuy nhiên, những thay đổi đủ lớn trong niềm tin, giá trị và nỗi sợ hãi chung có thể dẫn đến thay đổi trong bản chất của Fae và biến chúng thành đồng minh hữu ích trong cuộc săn lùng. Ngoại lệ sẽ là những kẻ tự xưng là Shedim, cái gọi là Djinn mà chúng ta cho rằng sinh ra từ giấc mơ của Lilith và bè lũ của mụ. Chúng sẽ mãi mãi mang vết nhơ của mụ.\n\nTrích đoạn từ Havanah Tập 51, Chương 1 & 3 và Tập 52, Chương 20"
 pod1230objectives_judges.11.a: "Liệu đức tin & giấc mơ của chúng ta có thể uốn nắn thực tại để giúp cuộc săn lùng không?"

 pod1230objectives_judges.12.t: "Nguồn Gốc của Các Oan Hồn"
 pod1230objectives_judges.12.desc: "Oan hồn là loại sinh vật phi tự nhiên căn bản nhất, khối xây dựng nền tảng mà nhiều sinh vật khác có thể bắt nguồn từ đó, đặc biệt là khi chúng tự ràng buộc mình vào một thân thể. Trong bài luận này, ta sẽ chứng minh cách ...\n\n Không có Những Kẻ Sa Ngã làm người dẫn hồn và đưa người chết vào thế giới bên kia, họ bắt đầu tích tụ trên Trái Đất và thậm chí bắt đầu áp đảo người sống. Tệ hơn, một số Kẻ Sa Ngã chủ động tìm cách thu thập linh hồn người chết trong một vùng đất được bao phủ bởi một Tấm Màn đau đớn và thống khổ ...\n\nTheo thời gian, những Bene Elohim trung thành đã xuyên thủng Tấm Màn này, bắt giữ Những Kẻ Sa Ngã, và đưa chúng đến trước G-d để phán xét ...\n\nKhông muốn kết án nhiều linh hồn bị bắt trong cái bẫy của vùng đất này chỉ bằng cách hủy diệt cõi giới đó, G-d phán và các đại dương rẽ ra và Tấm Màn được đặt giữa hai đại dương. Một bên được giao cho người sống và bên còn lại, [UmbraGlossaryLocalized('shadowlands','Âm Phủ')], được giao cho những linh hồn chết vẫn chưa nguôi chưa sẵn lòng ra đi ...\n\nG-d ban năng lực cho Eve, người phụ nữ đầu tiên và một người mẹ vẫn tìm cách hòa giải với con trai mình, để chọn một người bảo vệ cho những linh hồn chết chưa nguôi. Để chiến đấu chống lại những vết nhơ tăm tối còn sót lại trong [UmbraGlossaryLocalized('shadowlands','Âm Phủ')], bà đã chọn một kẻ hóa thú, một trong những người sói, người sẽ được biết đến với tên Anubis, ít nhất là đối với những Kẻ Bất Tử mà ông giúp đỡ. Vết nhơ này làm tha hóa mọi linh hồn bị mắc kẹt trong cõi giới này, luôn thì thầm bên tai chúng để khuất phục trước tất cả những gì thuộc về Bóng Tối ...\n\nTrong cùng thế kỷ khi Moses rẽ Biển Đỏ dù không rõ có mối liên hệ nào không, Eve trở lại để chọn một người cai quản cho những linh hồn chết chưa nguôi. Tên của kẻ sáng tạo Sa Ngã của [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] được trao cho một người Mycenae, chuyển giao một phần quyền năng của Kẻ Sa Ngã đối với cõi giới đó và cho phép người Mycenae tách người sống khỏi người chết và giúp người chết đến được thế giới bên kia. Ông được biết đến với tên Charon ...\n\nBất cứ thứ gì không do chính G-d tạo ra cuối cùng đều phải đến hồi kết vì không tạo vật nào có thể là những đấng sáng tạo hoàn hảo. Cái được gọi là [UmbraGlossaryLocalized('oblivion','Hư Vô')] chính là bản chất của điều này. Đó là sự kết thúc, hủy diệt, và tha hóa không thể tránh khỏi của vùng đất kỳ lạ này vốn được tạo ra bởi Những Kẻ Sa Ngã. Không có ý chí hay trí tuệ nào ở đây, chỉ đơn thuần là entropy khiến mọi thông tin trở nên rời rạc và mọi năng lượng trở nên vô dụng, được hiện thân bởi những điều ác của Những Kẻ Sa Ngã và nỗi sợ hãi của các Oan Hồn bị mắc kẹt trong vùng đất kỳ lạ này.\n\nTrích đoạn từ Havanah Tập 23, Chương 1, 2, 5, & 6"
 pod1230objectives_judges.12.a: "Một nhóm sinh vật kỳ lạ đáng được thương xót."

 pod1230objectives_judges.13.t: "Nguồn Gốc của Kuei-Jin"
 pod1230objectives_judges.13.desc: "Do sự thiếu vắng anh em chúng ta trong khu vực cho đến thiên niên kỷ gần đây hơn, khó mà xác định chính xác ngày tháng khi bàn về Kẻ Chết Đói. Tuy nhiên, nguồn gốc của họ dường như gắn liền với cái mà họ gọi là Kỷ Nguyên Thứ Ba. Dựa trên cách đặt tên của họ, Kỷ Nguyên Thứ Nhất chỉ thời điểm khi Trái Đất còn vô hình và trống rỗng, và bóng tối bao trùm mặt vực sâu. Và Thần Khí của G-d bay lượn trên mặt nước. Kỷ Nguyên Thứ Hai của họ bắt đầu khi G-d tách ánh sáng khỏi bóng tối và tách nước ra. Nó kết thúc bằng Sự Sa Ngã đã tạo ra mọi loại sinh vật độc ác, chỉ một số trong đó là Những Kẻ Sa Ngã. Đáp lại Sự Sa Ngã, G-d, được biết đến ở phương Đông với tên Ngọc Hoàng, đã chọn một thiên thần để lựa ra 10 nghìn anh hùng, người bảo vệ, và người dẫn dắt cho nhân loại ...\n\nBị vấy bẩn như mọi con người bởi Tội Tổ Tông, những anh hùng này đã bị tha hóa bởi quyền năng của mình, đánh cắp sinh mệnh của những kẻ dưới sự chăm sóc của họ để tự tăng cường sức mạnh và thỏa thuận với Những Kẻ Sa Ngã để có thêm quyền năng. Bene Elohim vừa đủ để thay thế tất cả những kẻ đã chết trong các xung đột nội bộ của họ, bị thúc đẩy bởi lòng kiêu ngạo và khao khát vinh quang hơn nữa của họ ...\n\nTội ác của họ lên đến đỉnh điểm trong Cuộc Chiến Nhục Nhã khi họ giết chính con cái mình, làm ô uế các thánh địa được G-d ban phước và được rồng cùng người-thú bảo vệ, và tạo ra Chín Mặt Trời Giả ...\n\nNgay cả các bài kiểm tra tuyển chọn cũng bị tha hóa đến mức chỉ có kẻ ác mới được gia nhập hàng ngũ của họ ...\n\nKhông thể trì hoãn phán xét hay ban lòng thương xót thêm nữa, G-d giáng một lời nguyền lên 10 nghìn cựu anh hùng đó với chỉ bốn người được tha, một trong số đó sau này sẽ gia nhập chính thứ mà mình từng chiến đấu chống lại. Lời nguyền này ban cho họ một cái nhìn thoáng qua về sự thống khổ đang chờ đợi họ ở thế giới bên kia và tước đi năng lực từng ban cho họ, buộc họ phải hút cạn sinh lực con người để giữ lại những năng lực đó nếu họ muốn. Những cựu anh hùng này không phải sinh vật duy nhất trong khu vực bị mắc kẹt trong cõi vật chất, và không phải tất cả đều vẫn bị mắc kẹt mãi mãi vì G-d luôn từ bi, luôn để lại một con đường tái hợp cho những ai sẵn lòng bước đi trên đó ...\n\nCó một quan niệm sai lầm phổ biến rằng những kẻ giờ được gọi là Kuei-Jin chỉ giới hạn ở các khu vực phía đông của châu Á và châu Đại Dương. Trên thực tế, những cựu anh hùng và tội phạm trốn thoát này có thể xuất hiện ở bất cứ đâu. Tuy nhiên, Những Kẻ Bị Nguyền Rủa tận diệt họ ở những khu vực họ xuất hiện nhiều, xem họ đơn giản chỉ là caitiff wight hay những oan hồn mạnh bất thường. Trong lịch sử, Những Kẻ Hóa Thú tự xem mình mộ đạo hơn nên đã phát triển sự căm ghét và ghê tởm đối với Kuei-Jin.\nDù lý do đã bị lãng quên, sự căm ghét vẫn còn nên những kẻ hóa thú cũng tận diệt bất kỳ Kuei-Jin mới sinh nào trong lãnh thổ của họ. Chỉ có phương Đông sở hữu đủ ít hoặc đủ cởi mở Những Kẻ Bị Nguyền Rủa và những kẻ hóa thú để Kuei-Jin bén rễ, tại điểm đó họ có thể tạo điều kiện cho sự chuyển tiếp và hòa nhập của các Kuei-Jin tương lai.\n\nTrích đoạn từ Havanah Tập 46, Chương 1, 3, & 9 và Tập 50, Chương 4"
 pod1230objectives_judges.13.a: "Liệu chúng ta có thể sao chép lại năng lực của những kẻ mà G-d từng ban năng lực?"

 pod1230objectives_judges.14.t: "Nguồn Gốc của Những Kẻ Hóa Thú"
 pod1230objectives_judges.14.desc: "Sau Sự Sa Ngã, G-d chọn một thiên thần để lựa ra 10 nghìn anh hùng và người bảo vệ cho nhân loại. Thiên thần này đã chọn linh hồn của những phàm nhân trung thành đã chết dưới tay Những Kẻ Sa Ngã và ban cho họ cơ hội thứ hai để sống. Tái sinh thành Malhim, những linh hồn này đã đáp lại sự tàn bạo mà chính họ từng phải chịu, gieo rắc nỗi sợ hãi vào trái tim của mọi Kẻ Sa Ngã với sự háo hức tận diệt Những Kẻ Sa Ngã của họ. Họ có thể theo dõi và săn lùng con mồi đến bất kỳ góc khuất nào của tạo vật, thậm chí xuyên thủng cả cõi giới [UmbraGlossaryLocalized('shadowlands','Âm Phủ')]. Được vị thánh bảo trợ ban phước, họ có thể yêu cầu sự giúp đỡ của thiên nhiên, cả thực vật lẫn động vật. Trên thực tế, họ thậm chí có thể biến hình thành các loài động vật khác nhau để hỗ trợ trong các cuộc săn lùng và trận chiến, với những người-gấu là lâu đời và khôn ngoan nhất trong số họ ...\n\nVào thời điểm đó, họ được phân chia theo đối tượng họ săn lùng hay vai trò của họ trong việc hỗ trợ Đội Quân Thiên Đàng. Ví dụ, những kẻ giờ được gọi là Rokea chủ yếu săn lùng Nhà Lammasu trong khi Khan Bastet được xếp cùng những kẻ hóa thú khác làm lính hạng nặng ...\n\nNhư nhiều kẻ khác, những anh hùng này đã khuất phục trước cám dỗ của địa vị và quyền lực của mình. Họ nô dịch hóa nhân loại, giữ họ như gia súc giống hệt cách Những Kẻ Bị Nguyền Rủa làm. Vì tội ác của mình, họ bị nguyền rủa mang bản chất của những loài vật mà họ từng làm việc cùng và giống với. Theo thời gian, những Malhim từng hùng mạnh đã thoái hóa thành những sinh vật mà ngày nay chúng ta gọi là Những Kẻ Hóa Thú ...\n\nMột số học giả cho rằng Cuộc Chiến Phẫn Nộ đã gây ra sự sụp đổ cuối cùng từ Malhim thành Những Kẻ Hóa Thú. Có nhiều xung đột lãnh thổ, cuộc tranh giành những đàn người tốt nhất, những nỗ lực xác định chủng tộc mạnh nhất, và những cáo buộc phản bội Người Mẹ Bảo Trợ của họ. Mọi thứ lên đến đỉnh điểm khi một Nagah bị Sa Ngã tha hóa đã giết một Garou quan trọng đang mang một thông điệp quan trọng và đổ lỗi cho các chi tộc khác. Khi Gurahl từ chối hồi sinh người đưa tin Garou đó, Garou đã tấn công Gurahl, kẻ đã đánh trả cùng các đồng minh của mình trong số Grondr. Với cuộc chiến đã bắt đầu, Garou đã lợi dụng nó để thỏa mãn mọi ham muốn của mình: lòng kiêu ngạo, lòng tham đối với bí mật của kẻ khác, và niềm tin vào quyền cai trị mọi chi tộc khác của họ ...\n\nMột điểm thú vị về Những Kẻ Hóa Thú là mối liên hệ độc đáo của họ với những thiên thể nhất định thấy được trên Tầng Trời Thứ Hai. Dựa trên nghiên cứu của chúng ta về [UmbraGlossaryLocalized('shadowlands','Âm Phủ')], [UmbraGlossaryLocalized('dreaming','Cõi Mộng')], và các cõi Umbra khác, dường như hầu hết, nếu không muốn nói là tất cả, các thiên thể đều là biểu hiện của giấc mơ và niềm tin của nhân loại, đến mức những thiên thể đó có thể không tồn tại trước khi nhân loại quyết định rằng những ngôi sao đó nên khác biệt với những ngôi sao khác. Xin xem chương tiếp theo và Tập 52 để thảo luận thêm về ...\n\nTrích đoạn từ Havanah Tập 31, Chương 1 & 2, Tập 39, Chương 2"
 pod1230objectives_judges.14.a: "Liệu chúng ta có thể sao chép lại năng lực của những kẻ mà G-d từng ban năng lực?"

 pod1230objectives_judges.15.t: "Nguồn Gốc của Các Pháp Thuật Phàm Nhân"
 pod1230objectives_judges.15.desc: "Nhân loại đã quay lưng lại với G-d rất nhiều lần. Mọi con trai của Adam và con gái của Eve đều mang dấu ấn của Tội Tổ Tông. Caine đã tạo ra Những Kẻ Bị Nguyền Rủa qua vô số tội ác của mình, từ giết người đến cưỡng hiếp và thậm chí từ chối ăn năn. Nhiều con người đã gia nhập Những Kẻ Sa Ngã trong cuộc nổi loạn của họ chống lại G-d ...\n\nDù Người đã quay mặt khỏi chúng ta lúc này, Người chưa bao giờ quên nhân loại. Bàn luận về Ha-mashiach và bản chất được chọn của con cái Israel nằm ngoài phạm vi của tác phẩm này nên xin tham khảo các tập và văn bản giáo sĩ phù hợp. Liên quan đến cuộc thảo luận hiện tại, G-d đã để lại nhiều người thợ để giúp đỡ nhân loại, như Eve và hai Bene Elohim tên Ziana thuộc Nhà Rabisu và Raziel thuộc Nhà Lammasu. Hai vị sau được gọi là Sứ Giả ...\n\nKhông lâu sau Sự Sa Ngã và thậm chí trước Đại Hồng Thủy, Raziel đã chọn mười nghìn anh hùng chiến đấu bằng vẻ đẹp và tri thức của họ, luôn giúp đỡ nhân loại tiến lên. Những anh hùng này đã truyền cảm hứng cho những câu chuyện về Wan Xian và phần lớn kiến thức của họ được truyền lại cho Wu T'ian, cho phép họ tạo ra Linh Dược Trường Sinh Bất Tử và bằng cách nào đó liên quan đến Bát Tiên, những người thậm chí đến giờ vẫn làm việc cho G-d ở Tầng Trời Thứ Ba. Bát Tiên vẫn liên lạc với Wu T'ian, giao cho họ những nhiệm vụ về cách giảm thiểu vấn đề. Tương tự, Ziana đã chọn mười nghìn anh hùng chiến đấu bằng chính thiên nhiên, kiểm soát và mang lấy những khía cạnh của thực vật và động vật trong tự nhiên. Họ có thể ra lệnh cho cây cối giúp đỡ mình và mang lấy hình dạng của linh hồn động vật đã chọn họ. Từ giấc mơ của những anh hùng này, được ban phước với những phép thuật độc đáo, đã sinh ra những sinh vật được gọi là Fae. Trong khi những giấc mơ hiện đại có thể biến đổi Fae, chính những giấc mơ đầu tiên này đã sinh ra những Fae Đầu Tiên Thật Sự ...\n\nVới sự thất bại của từng anh hùng riêng lẻ của mình, hai vị Sứ Giả này quyết định kết hợp nỗ lực của họ và thay đổi cách họ làm việc. Không còn những quyền năng như vậy được giao phó cho một người duy nhất nữa, thay vào đó được chia nhỏ ra. Một số năng lực sẽ được học, với các Sứ Giả khuyến khích con người hướng đến tri thức ẩn giấu thông qua Sự Khao Khát. Những năng lực khác sẽ được ban cho khi sinh ra, để khám phá dần theo thời gian. Những năng lực khác nữa sẽ được ban như phần thưởng cho việc chịu đựng điều gì đó hay như sự giúp đỡ để chịu đựng điều gì đó, thường đi kèm với một thông điệp hướng dẫn. (Ghi chú của Dịch giả: Tại sao các Sứ Giả phải khó hiểu như vậy với hướng dẫn của mình? Sao không thể chỉ đơn giản là \"đến đây và làm điều này\".) Những năng lực này cho phép con người có khả năng nghe, thấy, và nói ra những điều bí ẩn mà lỗ tai bằng thịt, mắt bằng thạch, và lưỡi bằng đất sét không thể. Mỗi Người Được Ban Phước có thể tiếp cận và sử dụng Món Quà của mình theo những cách và hình thức khác nhau từ huyền học, thần bí học, thuật giả kim, nghi lễ, phép thuật, lời cầu nguyện, thiền định, và năng lực tâm linh ...\n\nTrong số các anh hùng của Raziel, chỉ có 8 người từng tìm được bình yên thực sự và được chấp nhận trở lại vòng tay của G-d. Được truyền cảm hứng bởi những nỗ lực mới của Raziel và Ziana, Bát Tiên này đã truyền lại một phần kiến thức của mình cho Wu T'ian, cho phép Wu T'ian tạo ra Linh Dược Trường Sinh Bất Tử mà không cần dựa vào phép thuật bị bóp méo của bè lũ Lilith. Bát Tiên chủ động liên lạc với Wu T'ian, giao cho họ những nhiệm vụ có vẻ ngẫu nhiên và không liên quan ...\n\nMục đích của các Sứ Giả và những người đại diện khác của G-d cuối cùng vẫn chưa rõ, dù một số nói rằng họ đang giảm thiểu thiệt hại trước khi nó trở nên quá nghiêm trọng. Có lẽ họ đang thử thách chúng ta? Thời gian sẽ trả lời ...\n\nTrích đoạn từ Havanah Tập 22, Chương 1 & Tập 31, Chương 1 & Tập 46, Chương 4"
 pod1230objectives_judges.15.a: "Hãy học hỏi nghệ thuật của những anh hùng đầu tiên đó."

 pod1230objectives_judges.16.t: "Những Câu Chuyện về Thành Phố Thứ Hai"
 pod1230objectives_judges.16.desc: "Trong sự thông thái của Người, G-d đã tìm ra cách để giải quyết nhiều tội lỗi cùng lúc và vì thế Người đã gửi Đại Hồng Thủy để rửa sạch những điều ghê tởm của Những Kẻ Sa Ngã, những kẻ bị tha hóa trong số các đầy tớ cũ của Người, và lòng kiêu ngạo của Những Kẻ Bị Nguyền Rủa ...\n\nSau Đại Hồng Thủy, Caine tự lưu đày mình. Ông đã tạo ra quá nhiều thứ để rồi bị cuốn trôi trong một năm duy nhất, chỉ với một nhóm nhỏ trong hơn 200 Kẻ Bị Nguyền Rủa sống sót qua Đại Hồng Thủy. Không phải điều đó quan trọng. Bất chấp mọi công sức của ông, chẳng có gì từng cải thiện, chỉ thay đổi theo những cách nhỏ nhặt ...\n\nKhông có Caine để kiềm chế họ, Thế Hệ Thứ Ba được phép thỏa mãn những thói xấu tồi tệ nhất và những cơn hoang tưởng tồi tệ nhất của mình. Khi kết hợp với nguồn cung thực phẩm hạn chế khi con cháu của Noah lan rộng ra, Thế Hệ Thứ Ba nhanh chóng quyết định quay lưng lại với những sire còn sống sót của mình, đẩy họ vào Miên Trạng nhưng không thể giết chết hoàn toàn. Một số nói rằng Irad đã giúp đỡ nỗ lực của họ trước khi họ quay sang chống lại cả ông. Những người khác nói rằng Zillah là người cuối cùng gục ngã, kêu gào cầu xin sự giúp đỡ của Caine khi bà chứng kiến các anh em mình gục ngã. Ông nghe thấy lời cầu xin của bà và động lòng thương xót, biến bà thành đá để bà không bị tìm thấy và giết chết. Ngoài ra, Caine hứa với người vợ yêu dấu Zillah rằng họ sẽ cùng nhau bước đi trong màn đêm một lần nữa sau khi mọi thứ được hàn gắn. Những người khác lại nói rằng Jabal đã hoàn toàn trốn thoát được, đi cùng Caine trong cuộc lưu đày của ông như một đầy tớ mãi mãi trung thành ...\n\nTruyền cảm hứng cho nhiều huyền thoại về một vị thần báo thù, cơn thịnh nộ của Caine không hề bị kiềm chế khi ông nghe tin về những gì đã xảy ra với cố vấn, tướng quân, và người vợ của mình dưới tay chính con cháu của họ. Càn quét vào cái gọi là Thành Phố Thứ Hai của họ, ông đã đặt ba lời nguyền lên mỗi người trong số 13 thành viên của Thế Hệ Thứ Ba, một lời nguyền khuếch đại cá nhân điểm yếu hay nỗi sợ hãi lớn nhất của mục tiêu và hai lời nguyền chung áp đặt lên tất cả. Mỗi [Glossary('Generation','game_concept_vampgeneration_desc')] cách xa Caine sẽ yếu hơn thế hệ trước, và không [Glossary('Generation','game_concept_vampgeneration_desc')] nào sẽ từng biết đến hòa bình vì tất cả sẽ bị khóa chặt trong một cuộc đấu tranh vĩnh cửu để thay thế những kẻ tiền nhiệm của mình. Trên thực tế, Thế Hệ Thứ Ba có thể đã có quyền năng ngang bằng với những đứa con trực tiếp của Caine trước khi Caine giáng những lời nguyền của mình. Cuối cùng, Caine cấy vào họ một sự ngờ vực và sợ hãi bẩm sinh đối với Những Kẻ Sa Ngã, khuyến khích con cháu của mình tránh xa Những Kẻ Sa Ngã hoặc tận diệt những kẻ theo chúng, điều này có thể giải thích tại sao Chiến Tranh Baali và cuộc tấn công Carthage là một trong số rất ít ví dụ về nhiều chi tộc hợp tác cùng nhau. Cũng như Thế Hệ Thứ Ba đã từng cố gắng, mỗi [Glossary('Generation','game_concept_vampgeneration_desc')] sẽ cố gắng tận diệt những kẻ đi trước mình, luôn sợ hãi những gì [Glossary('Generation','game_concept_vampgeneration_desc')] trước đó mạnh hơn có thể làm với họ. Những lời nguyền này cũng có tác dụng khuếch đại căng thẳng giữa các thành viên cùng [Glossary('Generation','game_concept_vampgeneration_desc')], tạo ra một nỗi sợ hãi lẫn nhau luôn hiện hữu ...\n\nNgay cả trước khi Caine nguyền rủa họ, Thế Hệ Thứ Ba đã tìm cách tái tạo vinh quang thành phố của Caine. Họ Trao truyền cho những thành viên mới của Thế Hệ Thứ Tư. Họ thu thập con cháu của Noah để tôn thờ và nuôi dưỡng bản thân ...\n\n Tuy nhiên, họ không bao giờ thoát khỏi những lời nguyền của Caine. Họ tận diệt bất kỳ ai cố Trao truyền cho chính con cháu mình. Họ biến mọi cư dân trong thành phố của mình thành con tốt, không gì hơn một quân cờ để di chuyển trong một trò chơi không thể tưởng tượng nổi ...\n\nMải mê trong những trò chơi của mình, họ không bao giờ nhận ra khi thành phố họ già cỗi và chết dần quanh mình. Khi cuối cùng họ chạy trốn, đã gần như quá muộn, và nhiều người trong số họ đã chết trong cuộc đào tẩu ...\n\nCaine cười khi ông dùng sự tinh thông Dominate của mình để thay đổi mọi ký ức về Thành Phố Thứ Hai này, thậm chí xóa bỏ cả tên của nó. Chỉ còn lại rất ít trong tâm trí những người sống sót ngoài cách thành phố của họ sụp đổ và những ký ức về thất bại của chính họ.\n\nTrích đoạn từ Havanah Tập 1, Chương 14 & 17"
 pod1230objectives_judges.16.a: "Như thường lệ, họ đã hủy diệt và tự nguyền rủa chính mình."

 pod1230objectives_judges.17.t: "Những Câu Chuyện về Thành Phố Thứ Nhất"
 pod1230objectives_judges.17.desc: "Trong những cuộc lang thang của mình, Caine đã phát triển hai điều: một khao khát quyền lực và một mong muốn có một gia đình mới. Cơ hội để hoàn thành cả hai đến khi một người đàn ông tên Enoch tìm thấy ông. Vua và hoàng hậu của Ubar (nhưng như thế thì Ubar mới là Thành Phố Thứ Nhất?) đã cử Enoch, công dân vĩ đại nhất của họ, đi tìm cho thành phố họ một người bảo vệ và một vị thần. Caine là người mà Enoch mang về ...\n\nLần đầu tiên, Caine đã Trao truyền cho ba người: Enoch vì đã đưa ông đến Ubar và vua cùng hoàng hậu của Ubar (suy đoán từ một cuốn sách cổ Ả Rập!) để bảo tồn tình yêu và sự thông thái của họ. Với hai người sau, Caine hy vọng rằng tình yêu của họ có thể bắt đầu làm giảm bớt hành động của ông. Tuy nhiên, họ đã bước vào ánh mặt trời để chết sau khi phát hiện ra họ không còn có thể sinh ra những đứa con thật sự. Caine thề sẽ không bao giờ Trao truyền nữa, một lời thề kéo dài cho đến khi lời của Enoch và sự cô đơn của chính Caine đã thay đổi ý định của ông ...\n\nIrad là vị tướng vĩ đại nhất còn sống vào thời điểm đó, được Caine chọn để bảo vệ thành phố Ubar. Dù bản chất mới của ông đã cải thiện kỹ năng lãnh đạo, nó cũng làm tăng cơn khát máu của Irad ...\n\nZillah đánh thức khát khao của Caine về một người vợ để đồng hành cùng ông qua cõi vĩnh hằng, nhưng bà tỏ ra kháng cự trước sự quyến rũ của ông nên ông tìm kiếm những cách khác để giành được tình cảm của bà. Trong tuyệt vọng, Caine tìm đến người vợ thứ hai của cha mình, Levatel, người đã bị đuổi khỏi khu vườn bởi Adam vì sự ghê tởm của ông khi chứng kiến sự tạo ra của bà. Hứa sẽ dạy ông bí mật, bà đã trói buộc Caine với chính mình, biến Caine thành nô lệ và tôi tớ của bà. Thông qua sự trói buộc đó, bà ép Caine Trao truyền cho bà (khó có khả năng, không có nguồn Hậu duệ Cain nào ủng hộ điều này) và đánh cắp một vài đứa con của ông từ Thế Hệ Thứ Hai và Thứ Ba. Tuy nhiên, khi vẫn chịu sự trói buộc đó, Caine đã học được bí mật của nó và chuẩn bị giết Levatel. Một năm và một ngày sau khi ông lần đầu bị nô dịch, sự trói buộc đã suy yếu đủ để Caine đóng cọc Levatel và bỏ mặc bà cho ánh mặt trời giết chết. Những đứa con mà bà đã chiếm đoạt và con cái của chính bà đã không thể cứu được bà, tạo ra một sự căm ghét vĩnh cửu đối với Hậu duệ Cain vẫn tiếp diễn qua số ít những kẻ sống sót qua Đại Hồng Thủy và khiến họ gia nhập bè lũ Lilith. Với sự trói buộc bằng máu, Caine đã ràng buộc Zillah với chính mình, dù không rõ liệu sự trói buộc đó có tạo ra ảo giác về tình yêu hay liệu bà thực sự dần yêu ông theo thời gian ...\n\nThay vì Trao truyền cho hắn, Caine đã biến người đứng đầu đám đầy tớ của mình thành ghoul hay huyết tộc hồi sinh đầu tiên. Với quyền năng ngang bằng Thế Hệ Thứ Ba, Jabal là phàm nhân có địa vị cao nhất trong Thành Phố Thứ Nhất ...\n\nCaine cai trị Ubar bằng bàn tay sắt, lưu đày hoặc giết bất kỳ Kẻ Bị Nguyền Rủa nào phá vỡ quy tắc của ông như giao du với Những Kẻ Sa Ngã hay giết hại lẫn nhau. Xét đến việc có bao nhiêu thành viên Thế Hệ Thứ Ba được Trao truyền mà không có sự cho phép của ông, thật thú vị là ông chưa bao giờ đàn áp điều đó. Ngoài ra, ông tử tế hơn con cái mình đối với phàm nhân. Một số nói rằng ông không muốn mạo hiểm nguồn thực phẩm của mình trong khi những người khác nói rằng ông vẫn tìm kiếm sự cứu chuộc cho hành động của mình, dù điều sau khó có khả năng xét đến câu chuyện của Zillah và những điều cấm kỵ tôn giáo của ông. Cụ thể, Caine cấm bất kỳ ai thờ phụng G-d và cấm mọi ngôi đền không dành cho ông hay những Kẻ Bị Nguyền Rủa khác. Tại chính ngôi đền của mình, ông thường xuyên tuyên bố rằng tất cả con cái ông đều bị nguyền rủa để mãi mãi thối rữa, phải chịu khổ đau trong Địa Ngục nếu họ từng chết, và bị G-d phớt lờ khi ngày tận thế cuối cùng đến ...\n\nKhông rõ làm thế nào Enoch đã thuyết phục được mọi người rằng Caine đổi tên Ubar theo tên Enoch (có phải ông đã làm vậy hay đây chỉ là suy đoán để dung hòa Ubar và Enoch?). Có lẽ ông đã dùng Dominate để viết lại ký ức, hoặc có lẽ con cái ông, đông đảo nhất trong ba nhóm, đã lấn át tiếng nói của tất cả những người khác.\n\nTrích đoạn từ một bản thảo bị loại bỏ của Havanah Tập 1, Chương 5-12"
 pod1230objectives_judges.17.a: "Quả là một câu chuyện tăm tối."

 pod1230objectives_judges.18.t: "Những Câu Chuyện về Lilith và Các Dị Năng"
 pod1230objectives_judges.18.desc: "Lilith là người vợ đầu tiên của Adam và bị đuổi đi vì hai lý do: vì sự bất tuân của bà đối với mệnh lệnh của Adam và vì sự ngoại tình của bà với một Ben Elohim trước Tội Tổ Tông và trước Sự Sa Ngã. Sau khi lang thang khắp vùng hoang dã trong tạo vật của G-d, bà trở về Vườn Địa Đàng và thuyết phục người tình thiên thần của mình cho bà quyền vào lại. Sử dụng phép thuật kỳ lạ đánh cắp từ Bene Elohim, bà biến mình thành Con Rắn đã cám dỗ Eve ngây thơ và xúi giục Tội Tổ Tông ...\n\nTrong những cuộc lang thang của mình, Caine gặp Lilith trong bản sao chép Vườn Địa Đàng của bà. Ông bị cuốn hút bởi dấu ấn của G-d đánh dấu ông là kẻ giết người và quyền năng mà nó đại diện. Bà mời ông vào nhà mình, cho ông ăn, băng bó vết thương của ông, và trở thành người tình của ông. Theo thời gian, Caine nhận ra Lilith có phép thuật kỳ lạ và van xin bà ban nó cho mình dù là vì tình yêu hay để giảm bớt lời nguyền của G-d. Và thế là, Lilith chuẩn bị một nghi lễ đặc biệt và cho Caine uống một ít huyết mạch của bà. Sau khi nếm máu bà, Caine được 4 vị Hayyot Bene Elohim và Tổng Lãnh Thiên Thần mang Cỗ Xe Thần Thánh Merkavah đến viếng thăm, mỗi vị cho ông một cơ hội ăn năn và mỗi vị nguyền rủa ông nặng hơn vị trước khi ông từ chối họ. Khi Caine từ chối ông, Mikha'el (Ai/không ai giống như G-d) đã nguyền Caine phải sợ hãi ngọn lửa sống của mình. Khi Caine từ chối ông, Rafa'el (G-d đã chữa lành) đã nguyền Caine phải sợ hãi bình minh vì vinh quang của mặt trời sẽ thiêu đốt như ngọn lửa sống của Mikha'el. Khi Caine từ chối ông, Auri'el (G-d là ánh sáng của ta) đã nguyền Caine phải bám lấy bóng tối, phải uống máu như ông đã làm trong nghi lễ này và như máu người anh em ông đã đổ, phải nuốt tro tàn để lại bởi ngọn lửa sống của Mikha'el, phải đông cứng tại thời điểm cận kề cái chết, và khiến mọi thứ họ chạm vào vỡ vụn thành cát bụi mà từ đó vạn vật được tạo ra. Gavri'el (G-d là sức mạnh của ta) đã đưa ra một cơ hội cuối cùng không thể từ chối và sẽ không bao giờ phai nhạt, cách duy nhất còn lại để nhận được lòng thương xót của G-d và gỡ bỏ lời nguyền. Khi tỉnh dậy từ những viễn kiến này, Caine đã nhận được 9 phép thuật tạo nên nền tảng của các Dị Năng hiện đại. Sau đó, ông từ bỏ Lilith vì những lý do không rõ, từ đó tạo ra sự căm ghét mà Lilith và bè lũ của bà vẫn còn giữ đối với Hậu duệ Cain. Một số cho rằng G-d đã thi hành lời nguyền của Người lên Lilith vì vai trò của bà trong Tội Tổ Tông giờ đây, đảm bảo rằng bè lũ quái vật của bà sẽ không bao giờ hợp tác cùng Những Kẻ Bị Nguyền Rủa ...\n\nVị trí hiện tại của Lilith không rõ vì Đại Hồng Thủy đã phá hủy nhiều dấu vết hoạt động của bà, kể cả khu vườn của bà. Một số nguồn nói rằng bà đã rút lui vào [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] hay [UmbraGlossaryLocalized('dreaming','Cõi Mộng')] nơi bà xây lại khu vườn của mình để chờ đợi ngày bà có thể tận diệt mọi mối đe dọa đối với "con cái" của mình và thực hiện sự trả thù khủng khiếp của bà đối với Caine. Một số sự kiện nhất định trong lịch sử Hậu duệ Cain cũng có thể bắt nguồn từ bà như một nỗ lực để làm suy yếu kẻ thù của bà trong sự chuẩn bị cho ...\n\nTrích đoạn từ Havanah Tập 1, Chương 2-4"
 pod1230objectives_judges.18.a: "Caine là một kẻ ngốc, nhưng G-d thật khôn ngoan."

 pod1230objectives_judges.19.t: "Những Câu Chuyện về Caine"
 pod1230objectives_judges.19.desc: "Sau khi Caine trở thành người canh tác đất đai và Abel trở thành người chăn cừu, Caine và Abel quyết định mang lễ vật đến dâng YHWH. YHWH hài lòng với lễ vật của Abel nhưng không hài lòng với của Caine. Caine đã không dâng hoa lợi đầu mùa của mình cũng không phải phần tốt nhất trong hoa lợi của mình. Tệ hơn, Caine dâng lễ vật vì những lý do sai lầm, để phô trương sự thịnh vượng của mình và để thu hút sự chú ý của người em gái sinh đôi mà ông muốn cưới. Caine tràn đầy cơn thịnh nộ khi G-d phớt lờ lễ vật của mình. Một kẻ sắp trở thành Sa Ngã, luôn căm ghét lòng mộ đạo của Abel, đã khơi dậy cơn giận và sự ghen tị của Caine, mang đến cho ông một giấc mơ đầy cảm hứng. Hai sinh vật giống hệt Caine và Abel xuất hiện. Rồi, một kẻ trách móc kẻ kia. Kẻ bị trách móc trở nên giận dữ với kẻ kia và cầm lấy một lưỡi cày đã bị đập cong.\n\nBỏ ngoài tai mọi lời cầu xin thương xót, kẻ bị trách móc đã cắt cổ và giết chết kẻ kia. Duy trì ngọn lửa giận dữ và không bao giờ để nó tắt, Caine trở nên tin chắc rằng không hề có phán xét cũng không có Đấng Phán Xét Toàn Năng cũng không có phần thưởng cho người công chính cũng không có sự trả thù chống lại kẻ ác. Lòng đố kỵ của ông với người em trai âm ỉ và chỉ càng lớn hơn khi cha mẹ họ sắp xếp để Abel cưới người em gái sinh đôi của Caine. Caine cầm lấy lưỡi cày của mình, đập cong nó thành một lưỡi dao, tiếp cận anh em mình ngoài đồng, và cắt cổ Abel. Và thế là Caine đã đổ máu người em trai Abel của mình xuống đất, và máu của Abel tuôn chảy trên mặt đất và bụng ông bị mổ phanh trước bầy gia súc.\n\nG-d nghe thấy tiếng kêu than của Abel và thấy trước hậu quả tương lai nên đã trừng phạt Caine. Không còn nữa đất đai sẽ ban sức mạnh của nó cho Caine. Mãi mãi ông sẽ là một kẻ chạy trốn và lang thang. Tuy nhiên, G-d hiểu được ảnh hưởng của những kẻ khác trong tình huống này và rằng là kẻ giết người đầu tiên, Caine thiếu sự hiểu biết đầy đủ về hậu quả hành động của mình. Vì vậy, Caine đơn giản chỉ bị nguyền rủa và được ban sự bảo vệ khỏi bất kỳ ai có thể tấn công ông.\n\nTrích đoạn từ Havanah Tập 1, Chương 1"
 pod1230objectives_judges.19.a: "Nhưng của chúng ta là một G-d của những cơ hội thứ hai. Liệu còn gì hơn trong câu chuyện này?"

 pod1230objectives_judges.20.t: "Sự Cứu Chuộc cho cả Những Kẻ Bị Nguyền"
 pod1230objectives_judges.20.desc: "Ở cấp độ căn bản, Những Kẻ Bị Nguyền Rủa, thường được gọi là ma cà rồng, là những oan hồn chiếm hữu chính xác chết của mình với cả xác chết lẫn lời nguyền của Caine đóng vai trò là fetter. Trong lòng từ bi vĩnh cửu của Người và bất chấp việc Caine từ chối chấp nhận món quà, G-d đã ban cho Caine và con cháu ông một con đường giờ được gọi là Golconda để gỡ bỏ lời nguyền của họ và cứu linh hồn họ khỏi sự đọa đày vĩnh viễn. Dù có thể khẳng định với một mức độ chắc chắn nào đó rằng Caine chưa đạt được Golconda trước Đại Hồng Thủy, đã hàng thiên niên kỷ trôi qua kể từ đó nên các học giả đã đưa ra một số lập luận rất thuyết phục rằng Caine có khả năng đã đạt được Golconda nhưng chưa bước sang thế giới bên kia vì ông phải giải quyết công việc với con cháu mình trước. Để thảo luận thêm về tình trạng hiện tại của Caine, xin tham khảo các bài bình luận và bài viết trong Chương 18 ...\n\nSaulot tuyên bố đã đạt được Golconda sau khi đánh cắp một phần kiến thức được Raziel ban cho con cháu của Wan Xian. Ông đã truyền lại những lời dạy đó cho chi tộc Salubri, ban cho họ con mắt thứ ba mang tính biểu tượng của mình và dẫn dắt nhiều người trong số họ đến Golconda. Tuy nhiên, những khám phá gần đây của các Quan Xét địa phương chỉ ra rằng chính Saulot chưa bao giờ đạt được Golconda. Ngoài ra, người Tremere đã dày công nỗ lực để tận diệt người Salubri nói chung và những ai đã đạt được Golconda nói riêng ...\n\nSaulot thậm chí đã đánh cắp cái tên đó từ các nhà thần bí phương Đông với thuật ngữ này mang ý thơ ca nhắc đến sự giàu có tâm linh vĩ đại mà những sinh vật siêu việt như vậy nắm giữ. Trớ trêu thay, những nhà thần bí đó ghét thuật ngữ Golconda vì nó không phải là thuật ngữ chính xác nhất mà chỉ là cái tên Saulot đã lấy và phổ biến trong số Những Kẻ Bị Nguyền Rủa phương Tây ...\n\nĐể đạt được Golconda, một Kẻ Bị Nguyền Rủa phải tìm được một người thầy, giữ lại hoặc lấy lại nhân tính của mình, và chuộc lỗi cho mọi tội lỗi của mình. Sau khi nghiên cứu và thiền định đủ, họ có thể trải nghiệm một sự thấu hiểu đặc biệt nào đó. Với sự thấu hiểu đó, cuối cùng họ có thể bắt đầu một suspire, một cuộc hành trình linh kiến vào giấc mơ và linh hồn của họ. Trong suspire, họ khám phá ra ý nghĩa của sự tồn tại, nguồn gốc của Dã Thú bên trong họ, và mối liên hệ của họ với Caine. Nếu họ thất bại trong việc đạt được Golconda trong suspire, họ sẽ không bao giờ có cơ hội khác, nếu thân thể và tâm trí họ thậm chí còn sống sót. Điều tương tự cũng đúng nếu họ mất Golconda bằng cách phạm phải bất kỳ tội lỗi nào ...\n\nNếu đạt được, Golconda loại bỏ nguy cơ một Kẻ Bị Nguyền Rủa bị Dã Thú bên trong nuốt chửng, gần như loại bỏ nhu cầu về máu của họ, và vô hiệu hóa những lời nguyền Caine đặt lên con cháu mình bao gồm cả điểm yếu clan và giới hạn [Glossary('Generation','game_concept_vampgeneration_desc')]. So với bè lũ của Lilith, Hậu duệ Cain là thứ chúng ta săn lùng vì sự tàn nhẫn của họ hơn bất cứ điều gì khác. Vì vậy, những ai đã đạt được Golconda được miễn khỏi các cuộc săn lùng của chúng ta, cho phép chúng ta dành nguồn lực để tiêu diệt những mối đe dọa lớn hơn nhiều đối với anh em ta.\n\nBản thảo bị loại bỏ từ Havanah Tập 1, Chương 3, được đánh dấu "thiếu nguồn nghiêm túc"."
 pod1230objectives_judges.20.a: "Lilith sẽ luôn là ưu tiên hàng đầu của chúng ta."

 #pod1230objectives_judges.21.t: "The Wandering Sage"
 #pod1230objectives_judges.21.desc: "A strange man, completely wrapped in a cloak and his face obscured with more than simply cloth, has appeared in our most secure of inner sanctums. Identifying himself as the Wandering Sage, he called me by name and asked to meet me face-to-face. Oddly, he seemed to speak in the native tongue of all that were present, even though they came from different lands. Should I go?"
 #pod1230objectives_judges.21.a: "Let's hear him out."
 #pod1230objectives_judges.21.b: "It's a trap. Purge it with fire!"
 #
 #pod1230objectives_judges.22.t: "Caine Lives in Death"
 #pod1230objectives_judges.22.desc: "Once alone with us, he names himself Caine, first of the Cursed Ones commonly called vampires. In our quest for the truth, we drew his attention during his wanderings. He sees a chance in us to redeem himself before YHWH and to judge his twisted offspring so he offers me two choices: his blessing or his touch. He urges me to choose quickly for he is not yet permitted to rest and must soon continue his wanderings. After all, he still has many affairs to wind up and a few matters to resolve.\n\nI desire ..."
 #pod1230objectives_judges.22.a: "His Blessing."
 #pod1230objectives_judges.22.b: "His Touch."
 #
 #pod1230objectives_judges.23.t: "Purging It With Fire"
 #pod1230objectives_judges.23.desc: "Using our greatest theurgists and sorcerers, we purged the sanctum with fire, eliminating everything alive within it. However, the so-called Wandering Sage simply walked out of the fire, untouched. With a wave of his hand, not even the strongest among us could move to stop his exit from our sanctum. Over his shoulder, he said \"I sympathize with your decision, but this will be the end of our business together. Do not fear though, I am no longer the vengeful man that I once was. Good health and the L-rd's blessing be upon you.\""
 #pod1230objectives_judges.23.a: "Shall we ever hear from him again, and do we want to?"

 pod1230objectives_judges.24.t: "Gửi Đi Lời Nói"
 pod1230objectives_judges.24.desc: "Các Quan Xét, giống như những cộng đồng họ bảo vệ, rải rác khắp thế giới. Dù đây là một tình trạng có thể chấp nhận được (thậm chí là một lợi thế trong một số trường hợp, như học hỏi về những quái vật siêu nhiên từ xa), nó cũng là một điểm yếu. Có giới hạn những gì một nhóm phi tập trung có thể làm được.\n\nNhững chiến thắng và khám phá gần đây của ngươi đã đặt ngươi vào một vị trí trung tâm với quyền lực chưa từng có đối với các Quan Xét. Lời nói của ngươi có trọng lượng và đủ để đưa các thợ săn từ khắp thế giới vào tổ chức đang lớn mạnh của ngươi.\n\nVới Đất Thánh, đã được thanh tẩy khỏi quái vật, làm căn cứ hoạt động của ngươi, hy vọng về chiến thắng cuối cùng trước con cái của Lilith chưa bao giờ cao đến vậy."
 pod1230objectives_judges.24.a: "Ngợi khen Chúa Trời trên Cao!"

 #pod1230objectives_judges.25.t: "Hebrew Culture Arises Once More"
 #pod1230objectives_judges.25.desc: "With the Promised Land once more under the control of the Israelites, they have set about reforming their culture into a cohesive group. All those within the Promised Land will be joining them."
 #pod1230objectives_judges.25.a: "We are reunited."
 #pod1230objectives_judges.25.b: "Can't beat 'em, join 'em."

 judge_religious_head_title_name: "Sanhedrin Mustar"

 embrace_hebrew_culture_vassals_custom: "Chư hầu được cải sang văn hóa Hebrew"
 embrace_hebrew_culture_counties_custom: "Các quận được cải sang văn hóa Hebrew"
 decision_embrace_hebrew_culture_get_innovations: "Văn hóa Hebrew nhận được mọi cải tiến của các văn hóa Diaspora"
 
 magi_modifier: "Rab-mag"
 magi_modifier_desc: "Kiến thức của ngươi về các thế lực huyền bí kết hợp với những lời dạy của các Magi đã dạy ngươi nhiều điều."
 ashkenazic_modifier: "Avra K'davra"
 ashkenazic_modifier_desc: "Triều đại ngươi đã học được những bí mật cần thiết để hoán đổi ngôn ngữ và tạo ra những cấu trúc giống như sống động từ cát bụi đơn thuần."
 esraelawi_modifier: "Truyền Thống Danite"
 esraelawi_modifier_desc: "Triều đại ngươi đã được số ít Quan Xét còn nhớ dạy cho một số truyền thống chiến tranh của người Danite."
 kochinim_modifier: "Zaken Roshi"
 kochinim_modifier_desc: "Là trưởng lão của người Kochin, triều đại ngươi giờ đây giám sát mạng lưới thương mại và tình báo của họ."
 sephardim_modifier: "Giáo Sĩ Vương Triều"
 sephardim_modifier_desc: "Người Sephardi đã gửi các giáo sĩ hành chính để giúp đỡ và cố vấn cho triều đại ngươi."
 second_city_modifier: "Bài Học từ Thành Phố Thứ Hai"
 second_city_modifier_desc: "Thành Phố Thứ Hai từng là nơi đầy mưu mô khi mọi cư dân đều tham gia Đại Trò Chơi và tìm cách thay thế cấp trên của mình, thường thông qua giết người hay diablerie."
 first_city_modifier: "Bài Học từ Thành Phố Thứ Nhất"
 first_city_modifier_desc: "Bất chấp mọi khiếm khuyết và tội lỗi khác của mình, Caine đã là một người cai trị có năng lực và khéo léo. Chúng ta có thể học một số bài học từ hành động của ông và cách ông quản lý Ubar, Thành Phố Thứ Nhất."
 lilith_and_disciplines_modifier: "Phép Thuật của Lilith & Caine"
 lilith_and_disciplines_modifier_desc: "Caine đã nhận được một số phép thuật nhất định từ Lilith trước khi rời bỏ bà. Nghiên cứu của chúng ta về chủ đề này đã cung cấp một số hiểu biết hữu ích có thể áp dụng cho nghiên cứu trong các lĩnh vực khác."
 caine_and_abel_modifier: "Chia Sẻ Câu Chuyện của Caine"
 caine_and_abel_modifier_desc: "Sau khi khám phá và chia sẻ toàn bộ câu chuyện của Caine, chúng ta đã thu thập thêm sự ủng hộ chống lại Những Kẻ Bị Nguyền Rủa và đoàn kết nhiều đồng minh."

 mashiach_cometh_name: "Lịch Sử Chung Do Thái-Cơ Đốc"
 special_doctrine_mashiach_cometh_name: "Lịch Sử Chung Do Thái-Cơ Đốc"
 special_doctrine_mashiach_cometh_desc: "Dù chúng ta bất đồng về nhiều điểm với những người anh em Cơ Đốc của mình, chúng ta vẫn có thể hợp tác chặt chẽ hơn cùng Tòa Dị Giáo Bóng Tối của Giáo hội và ủng hộ nỗ lực của họ."

 mummy_origins_modifier: "Am Hiểu về Những Kẻ Bất Tử"
 mummy_origins_modifier_desc: "Sau khi nghiên cứu Những Kẻ Bất Tử, chúng ta có thể kết hợp khả năng thuật giả kim của họ với thuật Kabbalah của mình, cung cấp thêm nguồn quỹ cho cuộc săn lùng."
 demon_origins_modifier: "Am Hiểu về Những Kẻ Sa Ngã"
 demon_origins_modifier_desc: "Sau khi nghiên cứu Những Kẻ Sa Ngã, chúng ta được trang bị tốt hơn để chống lại sự tiến công của chúng."
 fae_origins_modifier: "Am Hiểu về Fae"
 fae_origins_modifier_desc: "Sau khi nghiên cứu Fae, chúng ta có thể tinh chỉnh thực tại một cách tinh tế bằng đức tin và giấc mơ của mình, cải thiện khả năng xây dựng công trình mới."
 kueijin_origins_modifier: "Am Hiểu về Kuei-Jin"
 kueijin_origins_modifier_desc: "Sau khi nghiên cứu Kuei-Jin và Mười Nghìn Anh Hùng nguyên thủy, chúng ta có thể kéo dài tuổi thọ của mình, cải thiện khả năng săn lùng."
 therianthrope_origins_modifier: "Am Hiểu về Những Kẻ Hóa Thú"
 therianthrope_origins_modifier_desc: "Sau khi nghiên cứu Những Kẻ Hóa Thú, chúng ta có thể tăng cường sức mạnh cho bản thân như họ từng làm."
 
 undone_diaspora_modifier: "Các Quan Xét Trở Về"
 undone_diaspora_modifier_desc: "Từ Quần Đảo Anh đến bờ biển Trung Hoa, các Quan Xét trở về quê nhà và mang theo sự thịnh vượng, tri thức, và nhân lực to lớn. Có một số bất ổn giữa các truyền thống khác nhau và với những người hiện đang cư ngụ tại Đất Hứa, nhưng chúng ta sẽ học cách thích nghi, như chúng ta luôn làm."

 doctrine_origins_improvements_name: "Lợi Ích Nghiên Cứu"
 wraith_origins_name: "Am Hiểu về Các Oan Hồn"
 wraith_origins_desc: "Sau khi nghiên cứu Những Kẻ Bất Tử, chúng ta đã tăng cường khả năng hoạt động phía sau hậu trường."
 mortal_magic_origins_name: "Am Hiểu về Mọi Pháp Thuật Phàm Nhân"
 mortal_magic_origins_desc: "Sau nghiên cứu sâu rộng và một số người sẽ nói là quá mức, chúng ta đã khám phá nguồn gốc của mọi pháp thuật phàm nhân. Với sự am hiểu mới có được, chúng ta đã tinh thông nhiều kỹ năng cơ bản gắn liền với mỗi hình thức."

 doctrine_prioritized_hunting_name: "Săn Lùng Ưu Tiên"
 golconda_repentance_name: "Sự Thật về Những Kẻ Bị Nguyền Rủa"
 golconda_repentance_desc: "Sau bao nhiêu nghiên cứu, chúng ta đã đạt được sự am hiểu chân thực về bản chất của Những Kẻ Bị Nguyền Rủa, điều này sẽ cho phép chúng ta hợp tác cùng những kẻ được lòng thương xót của G-d chạm đến trong cuộc truy đuổi bè lũ của Lilith. Ngoài ra, mọi anh em Do Thái của chúng ta, cả Bị Nguyền Rủa lẫn phàm nhân, giờ đây có thể hợp tác cùng nhau để đạt được mục tiêu thực sự của chúng ta."
 doctrine_parameter_hostility_override_golconda_repentance: "Những [faiths|E] khác, cả $pod_cainite$ và thợ săn, có [GetFaithDoctrine('golconda_repentance').GetBaseName] [doctrine|E] được coi là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] thay vì $hostility_evil_tooltippable$"

 judge_research_origins_mummies_objective_decision_osiris_flail: "Ngươi phải có [GetPODArtifact('osiris_flail_link').GetName], vốn ghi lại toàn bộ lịch sử Xác Ướp"
 judge_research_origins_mummies_objective_decision_book_thoth: "Ngươi phải có [GetPODArtifact('book_thoth_link').GetName], vốn cung cấp cái nhìn sâu sắc vào thuật pháp thuật Xác Ướp được Thoth dạy cho Isis"
 judge_research_origins_mummies_objective_decision_isis_fragments: "Ngươi phải có [GetPODArtifact('isis_fragments_link').GetName], vốn ghi lại lịch sử Xác Ướp Ai Cập từ góc nhìn của giáo phái Isis"
 judge_research_origins_mummies_objective_decision_writings_cabirus: "Ngươi phải có [GetPODArtifact('writings_cabirus_link').GetName], vốn là một bản sao dịch tồi phiên bản của ông về Phép Thuật Sự Sống"

 judge_research_origins_demons_objective_decision_dreams_angra: "Ngươi phải có [GetPODArtifact('dreams_angra_link').GetName], vốn ban cho cái nhìn sâu sắc vào các nghi lễ cổ xưa của Ba'al"
 judge_research_origins_demons_objective_decision_incunabulum_kupalam: "Ngươi phải có [GetPODArtifact('incunabulum_kupalam_link').GetName], vốn ban cho cái nhìn sâu sắc vào bản chất của ác quỷ Kupala và các nghi lễ triệu hồi và trói buộc hắn"
 judge_research_origins_demons_objective_decision_book_tobit: "Ngươi phải có [GetPODArtifact('book_tobit_link').GetName], vốn mô tả những cách G-d dùng ác quỷ để thử thách kẻ trung thành và tri thức địa ngục của các [Glossary('Clans','game_concept_Clan_desc')] cổ xưa"
 judge_research_origins_demons_objective_decision_control_tunis: "Ngươi kiểm soát [GetTitleByKey('c_tunis').GetNameNoTier], nơi người Baali từng hiến tế nhiều trẻ em và gieo rắc sự điên loạn của chúng"
 judge_research_origins_demons_objective_decision_control_chandax: "Ngươi kiểm soát [GetTitleByKey('c_chandax').GetNameNoTier], nơi thi thể của Namtaru vẫn còn yên nghỉ"
 
 judge_research_origins_fae_objective_decision_mayo: "Ngươi kiểm soát [GetTitleByKey('c_mayo').GetNameNoTier], quê hương của Cổng Bạc, nơi Triều Đình Của Mọi Vua từng hội họp, và một trung tâm của cuộc xung đột của họ"
 judge_research_origins_fae_objective_decision_atholl: "Ngươi kiểm soát [GetTitleByKey('c_atholl').GetNameNoTier], quê hương hiện tại của Tuath của Chronos nơi nhiều Fae kể cả một số nhà tiên tri hiện đang trú ẩn khỏi cơn bão"
 judge_research_origins_fae_objective_decision_aviovara: "Ngươi kiểm soát [GetTitleByKey('c_aviovara').GetNameNoTier], được Fae biết đến với tên Pháo Đài Pha Lê và một trung tâm của cuộc xung đột của họ"
 judge_research_origins_fae_objective_decision_ailech: "Ngươi kiểm soát [GetTitleByKey('c_ailech').GetNameNoTier], quê hương cổ xưa của Balor Mắt Ác và vua của người Fomor"
 judge_research_origins_fae_objective_decision_monmouthshire: "Ngươi kiểm soát [GetTitleByKey('c_monmouthshire').GetNameNoTier], quê hương của trái tim thành Camelot huyền thoại và một nơi để thoáng thấy [UmbraGlossaryLocalized('dreaming','Cõi Mộng')]"
