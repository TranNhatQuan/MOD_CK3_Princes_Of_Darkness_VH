l_english:
 pod_judges_promised_land: "Đất Hứa"

 e_judges_title: "Quan Xét"
 e_judges_title_adj: "Quan Xét"
 
 judge_reclaim_promised_land_objective_decision: "Ổn Định Các Quan Xét"
 judge_reclaim_promised_land_objective_decision_desc: "Các Quan Xét là một tổ chức phi tập trung, mỗi người trong số họ chủ yếu bảo vệ cộng đồng riêng của mình. Chúng ta có thể lấy Tòa Dị Giáo Bóng Tối làm gương và đoàn kết dưới một ngọn cờ chung để hiệu quả hơn nhiều. Chúng ta chỉ cần một thủ lĩnh quy tụ và một chiến thắng nền tảng để đạt được điều này."
 judge_reclaim_promised_land_objective_decision_confirm: "Một khởi đầu mới."
 judge_reclaim_promised_land_objective_decision_tooltip: "Những người bảo vệ của một dân tộc, đang đoàn kết."

 judge_get_mystic_decision: "Học Hỏi Con Đường của Các Nhà Thông Thái"
 judge_get_mystic_decision_desc: "Để thực hiện đúng bổn phận của mình, ta nên nghiên cứu những con đường cổ xưa và huyền bí của tổ tiên ta. Ta sẽ hưởng lợi từ sự thông thái của họ và trở thành một nhà thông thái đích thực."
 judge_get_mystic_decision_confirm: "Hãy bắt đầu"
 judge_get_mystic_decision_tooltip: "Ta sẽ nghiên cứu những con đường cổ xưa để trở thành một nhà thông thái"

 judge_verify_christian_claim_objective_decision: "Vấn Đề của Cây Thánh Giá"
 judge_verify_christian_claim_objective_decision_desc: "Trước khi chúng ta có thể toàn tâm giúp đỡ Giáo hội Cơ Đốc trong cuộc săn lùng Những Kẻ Bị Nguyền Rủa, chúng ta phải giải quyết những khác biệt thần học với họ."
 judge_verify_christian_claim_objective_decision_confirm: "Chủ nghĩa thực dụng phải ngự trị ngày hôm nay"
 judge_verify_christian_claim_objective_decision_tooltip: "Những hậu duệ thần học xa cách của chúng ta."

 judge_contact_magi_objective_decision: "Liên Lạc với Các Magi"
 judge_contact_magi_objective_decision_desc: "Theo truyền thống do tiên tri Daniel đặt ra, các Magi từ lâu đã thực hành một hình thức pháp thuật dân gian mang tính tuyến tính hơn. Ngoài ra, họ là một trong số ít Quan Xét Mizrahi còn sót lại trong những ngày đen tối này. Hãy để chúng ta tái lập liên lạc với họ khi ta tìm cách phối hợp các nhóm khác nhau."
 judge_contact_magi_objective_decision_confirm: "Hãy nói chuyện với họ"
 judge_contact_magi_objective_decision_tooltip: "Chúng ta sẽ học hỏi từ người Mizrahi và các Magi"

 judge_contact_ashkenazic_objective_decision: "Liên Lạc với Các Quan Xét Ashkenazi"
 judge_contact_ashkenazic_objective_decision_desc: "Hơn hầu hết các nhóm khác, các Quan Xét Ashkenazi đã khám phá và nghiên cứu Sefer Yetzirah. Khả năng của các Giáo Sĩ Baal Shem của họ trong việc tạo ra những cấu trúc sống động đã được biết đến rộng rãi và đã giúp họ sống sót giữa Những Kẻ Bị Nguyền Rủa. Ngoài ra, họ đã giành được sự bảo hộ của hai Kẻ Bị Nguyền Rủa trong khu vực. Hãy để chúng ta tái lập liên lạc với họ khi ta tìm cách phối hợp các nhóm khác nhau."
 judge_contact_ashkenazic_objective_decision_confirm: "Hãy nói chuyện với họ"
 judge_contact_ashkenazic_objective_decision_tooltip: "Chúng ta sẽ học hỏi từ người Ashkenazi"
 judge_contact_ashkenazic_objective_decision_befriend_josef: "Người Bảo Vệ của Praha, [GetScriptedCharacterByHistoryID('505089').GetFirstName], phải là [friend|E], [lover|E], [soulmate|E], hoặc thành viên [GetPlayer.Custom('PODCoterie')] của ngươi, nếu vẫn còn hoạt động và sống"
 judge_contact_ashkenazic_objective_decision_befriend_yitzhak: "Giáo Sĩ Tro Tàn, [GetScriptedCharacterByHistoryID('790246').GetFirstName], phải là [friend|E], [lover|E], [soulmate|E], hoặc thành viên [GetPlayer.Custom('PODCoterie')] của ngươi, nếu vẫn còn hoạt động và sống"
 judge_contact_ashkenazic_objective_decision_know_theurgist: "Việc nghiên cứu Sefer Yezirah một mình là điều cấm kỵ. Chỉ có thể học nó theo nhóm hai hoặc ba người. Hãy tìm một #TOOLTIP:GAME_TRAIT,theurgist,[GetNullCharacter] #L Kabbalist#!#! khác để làm [friend|E], [lover|E], [soulmate|E], hoặc thành viên [GetPlayer.Custom('PODCoterie')] của ngươi để họ có thể nghiên cứu cùng ngươi."
 judge_contact_ashkenazic_objective_decision_popular_in_prague: "Quận [GetTitleByKey('c_praha').GetNameNoTier] phải nằm trong lãnh thổ ngươi và có [county_opinion|E] từ 35 trở lên đối với chủ nhân của nó."

 judge_contact_esraelawi_objective_decision: "Liên Lạc với Các Quan Xét Esra'elawi"
 judge_contact_esraelawi_objective_decision_desc: "Để bảo vệ những người anh em của chúng ta, mọi Quan Xét đều buộc phải trở thành binh lính và chiến binh. Tuy nhiên, các Quan Xét Esra'elawi đã đặc biệt duy trì truyền thống chiến binh của Chi Tộc Dan. Nếu chúng ta chứng tỏ được bản thân với họ, họ có thể sẵn lòng truyền dạy truyền thống của mình cho chúng ta."
 judge_contact_esraelawi_objective_decision_confirm: "Hãy nói chuyện với họ"
 judge_contact_esraelawi_objective_decision_tooltip: "Chúng ta sẽ học hỏi từ người Esra'elawi"

 judge_contact_kochinim_objective_decision: "Liên Lạc với Các Quan Xét Kochin"
 judge_contact_kochinim_objective_decision_desc: "Với cái giá là một khoản tiền và trở nên nổi bật hơn trước công chúng, chúng ta có thể liên lạc với những người anh em ở Ấn Độ. Người Kochin nổi tiếng với mạng lưới thương mại và mạng lưới tình báo được xây dựng xung quanh nó. Liên lạc với họ sẽ cho phép chúng ta tận dụng cả hai đặc điểm này."
 judge_contact_kochinim_objective_decision_confirm: "Hãy nói chuyện với họ"
 judge_contact_kochinim_objective_decision_tooltip: "Chúng ta sẽ học hỏi từ người Kochin"

 judge_contact_sephardim_objective_decision: "Liên Lạc với Các Quan Xét Sephardi"
 judge_contact_sephardim_objective_decision_desc: "Những người anh em Iberia và Bắc Phi của chúng ta nổi tiếng với sự am hiểu về các văn bản ngoài Tanakh và kỹ năng sinh tồn tại những vùng đất hỗn loạn đó. Nếu chúng ta có thể liên lạc với họ và giải quyết một số khó khăn mà họ đang gặp phải, thì họ sẽ có thể giúp chúng ta trong những nỗ lực tương lai."
 judge_contact_sephardim_objective_decision_confirm: "Hãy nói chuyện với họ"
 judge_contact_sephardim_objective_decision_tooltip: "Chúng ta sẽ học hỏi từ người Sephardi"

 judge_research_origins_mummies_objective_decision: "Xác Định Nguồn Gốc của Những Kẻ Bất Tử"
 judge_research_origins_mummies_objective_decision_desc: "Chúng ta biết rằng YHWH đã tạo ra vạn vật và chọn chúng ta làm dân Người. Tuy nhiên, có nhiều điều trong tạo vật của Người mà chúng ta chưa hiểu hết. Chúng ta nên tìm hiểu nguồn gốc của những #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L Kẻ Bất Tử#!#!, thường được biết đến hơn với tên Xác Ướp. Chúng ta sẽ ghi lại những phát hiện của mình trong một tác phẩm duy nhất mang tên Havanah."
 judge_research_origins_mummies_objective_decision_confirm: "Hãy tìm ra sự thật"
 judge_research_origins_mummies_objective_decision_tooltip: "Che giấu sự việc là vinh quang của G-d, nhưng dò xét sự việc là vinh quang của các vị vua."
 judge_research_origins_mummies_objective_decision_benefit: "Chúng ta khám phá nguồn gốc của những #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L Kẻ Bất Tử#!#!"
 judge_research_origins_mummies_objective_decision_befriend_cabirus: "Xác Ướp Độc Lập, [GetScriptedCharacterByHistoryID('792600').GetFirstName], phải là [friend|E], [lover|E], [soulmate|E], hoặc thành viên [GetPlayer.Custom('PODCoterie')] của ngươi, nếu vẫn còn hoạt động và sống"

 judge_research_origins_demons_objective_decision: "Xác Định Nguồn Gốc của Những Kẻ Sa Ngã"
 judge_research_origins_demons_objective_decision_desc: "Chúng ta biết rằng YHWH đã tạo ra vạn vật và chọn chúng ta làm dân Người. Tuy nhiên, có nhiều điều trong tạo vật của Người mà chúng ta chưa hiểu hết. Chúng ta nên tìm hiểu nguồn gốc của những #TOOLTIP:GAME_TRAIT,demon,[GetNullCharacter] #L Kẻ Sa Ngã#!#!, thường được biết đến hơn với tên Ác Quỷ. Chúng ta sẽ ghi lại những phát hiện của mình trong một tác phẩm duy nhất mang tên Havanah."
 judge_research_origins_demons_objective_decision_confirm: "Hãy tìm ra sự thật"
 judge_research_origins_demons_objective_decision_tooltip: "Che giấu sự việc là vinh quang của G-d, nhưng dò xét sự việc là vinh quang của các vị vua."
 judge_research_origins_demons_objective_decision_benefit: "Chúng ta khám phá nguồn gốc của những #TOOLTIP:GAME_TRAIT,demon,[GetNullCharacter] #L Kẻ Sa Ngã#!#!"

 judge_research_origins_fae_objective_decision: "Xác Định Nguồn Gốc của Fae"
 judge_research_origins_fae_objective_decision_desc: "Chúng ta biết rằng YHWH đã tạo ra vạn vật và chọn chúng ta làm dân Người. Tuy nhiên, có nhiều điều trong tạo vật của Người mà chúng ta chưa hiểu hết. Chúng ta nên tìm hiểu nguồn gốc của $POD_splat_fae$, dù việc thiếu văn bản về chủ đề này sẽ buộc chúng ta phải tìm đến những nguồn thông tin khác. Chúng ta sẽ ghi lại những phát hiện của mình trong một tác phẩm duy nhất mang tên Havanah."
 judge_research_origins_fae_objective_decision_confirm: "Hãy tìm ra sự thật"
 judge_research_origins_fae_objective_decision_tooltip: "Che giấu sự việc là vinh quang của G-d, nhưng dò xét sự việc là vinh quang của các vị vua."
 judge_research_origins_fae_objective_decision_benefit: "Chúng ta khám phá nguồn gốc của $POD_splat_fae$"

 judge_research_origins_wraiths_objective_decision: "Xác Định Nguồn Gốc của Các Oan Hồn"
 judge_research_origins_wraiths_objective_decision_desc: "Chúng ta biết rằng YHWH đã tạo ra vạn vật và chọn chúng ta làm dân Người. Tuy nhiên, có nhiều điều trong tạo vật của Người mà chúng ta chưa hiểu hết. Chúng ta nên tìm hiểu nguồn gốc của $POD_splat_wraith_plural$, có thể thậm chí liên lạc với họ thông qua chính những suy niệm của chúng ta. Chúng ta sẽ ghi lại những phát hiện của mình trong một tác phẩm duy nhất mang tên Havanah."
 judge_research_origins_wraiths_objective_decision_confirm: "Hãy tìm ra sự thật"
 judge_research_origins_wraiths_objective_decision_tooltip: "Che giấu sự việc là vinh quang của G-d, nhưng dò xét sự việc là vinh quang của các vị vua."
 judge_research_origins_wraiths_objective_decision_benefit: "Chúng ta khám phá nguồn gốc của $POD_splat_wraith_plural$"

 judge_research_origins_kueijin_objective_decision: "Xác Định Nguồn Gốc của Kuei-Jin"
 judge_research_origins_kueijin_objective_decision_desc: "Chúng ta biết rằng YHWH đã tạo ra vạn vật và chọn chúng ta làm dân Người. Tuy nhiên, có nhiều điều trong tạo vật của Người mà chúng ta chưa hiểu hết. Chúng ta nên tìm hiểu nguồn gốc của $pod_kueijin$ hay Wan Xian. Có lẽ chúng ta sẽ tìm ra phương thức trở về ban đầu của họ, trước khi bị tha hóa. Chúng ta sẽ ghi lại những phát hiện của mình trong một tác phẩm duy nhất mang tên Havanah."
 judge_research_origins_kueijin_objective_decision_confirm: "Hãy tìm ra sự thật"
 judge_research_origins_kueijin_objective_decision_tooltip: "Che giấu sự việc là vinh quang của G-d, nhưng dò xét sự việc là vinh quang của các vị vua."
 judge_research_origins_kueijin_objective_decision_benefit: "Chúng ta khám phá nguồn gốc của $POD_splat_kueijin$"

 judge_research_origins_therianthropes_objective_decision: "Xác Định Nguồn Gốc của Những Kẻ Hóa Thú"
 judge_research_origins_therianthropes_objective_decision_desc: "Chúng ta biết rằng YHWH đã tạo ra vạn vật và chọn chúng ta làm dân Người. Tuy nhiên, có nhiều điều trong tạo vật của Người mà chúng ta chưa hiểu hết. Chúng ta nên tìm hiểu nguồn gốc của [Glossary('Therianthropes', 'glossary_fera_tt')]. Chúng ta sẽ ghi lại những phát hiện của mình trong một tác phẩm duy nhất mang tên Havanah."
 judge_research_origins_therianthropes_objective_decision_confirm: "Hãy tìm ra sự thật"
 judge_research_origins_therianthropes_objective_decision_tooltip: "Che giấu sự việc là vinh quang của G-d, nhưng dò xét sự việc là vinh quang của các vị vua."
 judge_research_origins_therianthropes_objective_decision_benefit: "Chúng ta khám phá nguồn gốc của [Glossary('Therianthropes', 'glossary_fera_tt')]"

 judge_research_origins_mortal_magic_objective_decision: "Xác Định Nguồn Gốc của Các Pháp Thuật Phàm Nhân"
 judge_research_origins_mortal_magic_objective_decision_desc: "Chúng ta biết rằng YHWH đã tạo ra vạn vật và chọn chúng ta làm dân Người. Tuy nhiên, có nhiều điều trong tạo vật của Người mà chúng ta chưa hiểu hết. Chúng ta nên tìm hiểu nguồn gốc của mọi pháp thuật phàm nhân, một phần bằng cách học hết tất cả chúng. Chúng ta sẽ ghi lại những phát hiện của mình trong một tác phẩm duy nhất mang tên Havanah."
 judge_research_origins_mortal_magic_objective_decision_confirm: "Hãy tìm ra sự thật"
 judge_research_origins_mortal_magic_objective_decision_tooltip: "Che giấu sự việc là vinh quang của G-d, nhưng dò xét sự việc là vinh quang của các vị vua."
 judge_research_origins_mortal_magic_objective_decision_benefit: "Ngươi có được năng lực Hekau, Tan và Qiao."

 judge_research_origins_vampires_3rdgen_objective_decision: "Nghiên Cứu Nguồn Gốc của Thế Hệ Thứ Ba"
 judge_research_origins_vampires_3rdgen_objective_decision_desc: "Chúng ta biết rằng YHWH đã tạo ra vạn vật và chọn chúng ta làm dân Người. Tuy nhiên, có nhiều điều trong tạo vật của Người mà chúng ta chưa hiểu hết. Hàng đầu trong số đó là Những Kẻ Bị Nguyền Rủa. Bước đầu tiên là nghiên cứu hoạt động của [Glossary('Antediluvians','game_concept_antediluvian_desc')] ngay sau Đại Hồng Thủy. Chúng ta sẽ ghi lại những phát hiện của mình trong một tác phẩm duy nhất mang tên Havanah."
 judge_research_origins_vampires_3rdgen_objective_decision_confirm: "Hãy tìm ra sự thật"
 judge_research_origins_vampires_3rdgen_objective_decision_tooltip: "Che giấu sự việc là vinh quang của G-d, nhưng dò xét sự việc là vinh quang của các vị vua."
 judge_research_origins_vampires_3rdgen_objective_decision_benefit: "Chúng ta khám phá lịch sử của Thành Phố Thứ Hai của [Glossary('Antediluvians','game_concept_antediluvian_desc')] sau Đại Hồng Thủy"

 judge_research_origins_vampires_2ndgen_objective_decision: "Nghiên Cứu Nguồn Gốc của Thế Hệ Thứ Hai"
 judge_research_origins_vampires_2ndgen_objective_decision_desc: "Chúng ta biết rằng YHWH đã tạo ra vạn vật và chọn chúng ta làm dân Người. Tuy nhiên, có nhiều điều trong tạo vật của Người mà chúng ta chưa hiểu hết. Hàng đầu trong số đó là Những Kẻ Bị Nguyền Rủa. Bước tiếp theo là nghiên cứu nguồn gốc của cái gọi là Thế Hệ Thứ Hai và thành phố quê hương của họ từ trước Đại Hồng Thủy. Chúng ta sẽ ghi lại những phát hiện của mình trong một tác phẩm duy nhất mang tên Havanah."
 judge_research_origins_vampires_2ndgen_objective_decision_confirm: "Hãy tìm ra sự thật"
 judge_research_origins_vampires_2ndgen_objective_decision_tooltip: "Che giấu sự việc là vinh quang của G-d, nhưng dò xét sự việc là vinh quang của các vị vua."
 judge_research_origins_vampires_2ndgen_objective_decision_benefit: "Chúng ta khám phá lịch sử của Thế Hệ Thứ Hai và Thành Phố Thứ Nhất trước Đại Hồng Thủy"

 judge_research_origins_vampires_lilith_n_disciplines_objective_decision: "Nghiên Cứu Nguồn Gốc của Các Dị Năng"
 judge_research_origins_vampires_lilith_n_disciplines_objective_decision_desc: "Chúng ta biết rằng YHWH đã tạo ra vạn vật và chọn chúng ta làm dân Người. Tuy nhiên, có nhiều điều trong tạo vật của Người mà chúng ta chưa hiểu hết. Hàng đầu trong số đó là Những Kẻ Bị Nguyền Rủa. Bước tiếp theo là nghiên cứu nguồn gốc của các Dị Năng của Những Kẻ Bị Nguyền Rủa và mối liên hệ của chúng với kẻ thù đáng ghét của chúng ta, Lilith. Chúng ta sẽ ghi lại những phát hiện của mình trong một tác phẩm duy nhất mang tên Havanah."
 judge_research_origins_vampires_lilith_n_disciplines_objective_decision_confirm: "Hãy tìm ra sự thật"
