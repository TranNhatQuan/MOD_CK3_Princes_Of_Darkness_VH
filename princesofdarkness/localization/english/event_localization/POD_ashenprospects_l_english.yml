l_english:

 POD_ashen_prospect.001.t: "Mời Ứng Viên Tro Tàn"
 POD_ashen_prospect.001.desc: "Địa vị và tầm ảnh hưởng của ngươi trong cả thế giới Kindred lẫn Kine cho phép ngươi đưa những kẻ hầu cận tiềm năng về triều đình mình."
 POD_ashen_prospect.001.option.a: "Ứng viên quý tộc"
 POD_ashen_prospect.001.option.a.tt: "Triệu tập những $pod_cainites$ dòng dõi quý tộc có thể phụng sự ngươi."
 POD_ashen_prospect.001.option.b: "Ứng viên hiệp sỹ"
 POD_ashen_prospect.001.option.b.tt: "Truyền lời hiệu triệu những $pod_cainites$ tinh thông võ nghệ và mạnh về binh đao."
 POD_ashen_prospect.001.option.c: "Ứng viên quản gia"
 POD_ashen_prospect.001.option.c.tt: "Thu hút các quan quản khố và quản gia về triều đình ngươi bằng lời hứa hẹn giàu sang và địa vị."
 POD_ashen_prospect.001.option.d: "Ứng viên đạo tặc"
 POD_ashen_prospect.001.option.d.tt: "Mời gọi những $pod_cainites$ thạo nghề ẩn mình và coi thường quyền uy của Prince"
 POD_ashen_prospect.001.option.e: "Ứng viên giáo phái"
 POD_ashen_prospect.001.option.e.tt: "Bắt liên lạc với những $pod_cainites$ đầy tham vọng đang thao túng người phàm trong các giáo phái"

 POD_ashen_prospect.101.t: "Lời hiệu triệu đã được đáp lại!"
 POD_ashen_prospect.101.desc.noble: "Chẳng phải kẻ dòng dõi quý tộc nào cũng mưu cầu ngôi báu; một số bằng lòng phụng sự ngay cạnh ngai quyền lực. Với một cái giá thỏa đáng, lời khuyên của họ có thể thuộc về ngươi."
 POD_ashen_prospect.101.desc.knight: "Chiến tranh của loài người tạo nên một thế giới đầy rẫy $pod_cainites$ am tường binh pháp, sẵn lòng dâng gươm và lòng trung cho một Prince hào phóng, nếu giá cả phải chăng."
 POD_ashen_prospect.101.desc.seneschal: "Dẫu kho lẫm và sổ sách có khác với thế giới phàm trần, một lãnh chúa $pod_cainite$ biết điều vẫn quý trọng một quản gia giỏi để coi sóc lãnh địa của mình."
 POD_ashen_prospect.101.desc.thief: "Ngay cả kindred cũng chẳng thể sống một đời quang minh khi bị những kẻ cai trị đè nén; có một kẻ như thế dưới trướng ngươi có thể sẽ hữu dụng"
 POD_ashen_prospect.101.desc.cult: "Tôn giáo rất hệ trọng với người phàm. Bởi thế mà một số $pod_cainites$ khoác lên mình chiếc mặt nạ của Thần Linh hay tôi tớ của Người để dẫn dụ đồng loại thành thuộc hạ của chúng"
 POD_ashen_prospect.101.option.a: "Ta chọn [prospect_one.GetFirstName]"
 POD_ashen_prospect.101.option.a.tt: "[prospect_one.GetFirstName] gia nhập triều đình ngươi, [prospect_two.GetFirstName] và [prospect_three.GetFirstName] bị cho về"
 POD_ashen_prospect.101.option.b: "Ta chọn [prospect_two.GetFirstName]"
 POD_ashen_prospect.101.option.b.tt: "[prospect_two.GetFirstName] gia nhập triều đình ngươi, [prospect_one.GetFirstName] và [prospect_three.GetFirstName] bị cho về"
 POD_ashen_prospect.101.option.c: "Ta chọn [prospect_three.GetFirstName]"
 POD_ashen_prospect.101.option.c.tt: "[prospect_three.GetFirstName] gia nhập triều đình ngươi, [prospect_one.GetFirstName] và [prospect_two.GetFirstName] bị cho về"