l_english:

 POD_demon_maintenance.1.t: "Nợ Ác Quỷ"
 POD_demon_maintenance.1.desc: "Mỗi năm sức mạnh của ngươi lại lớn thêm nhờ sự sùng bái của các tín đồ."

 POD_demon_maintenance.2.t: "Đổi Thay Con Đường"
 POD_demon_maintenance.2.desc: "Ta đã thấy ánh sáng của chủ nhân mình, nhưng con đường hiện tại của ta không hề đối nghịch với con đường của người. Ta nên cải sang con đường của người, hay giữ lấy con đường riêng của mình? Dĩ nhiên, tất cả đều nhân danh người!"
 POD_demon_maintenance.2.a: "Con đường của người cũng là con đường của ta."
 POD_demon_maintenance.2.b: "Con đường của ta là của riêng ta."

 POD_demon_maintenance.3.t: "Gieo Nhân Nào Gặt Quả Ấy"
 POD_demon_maintenance.3.desc: "Giờ đây khi ta không còn sở hữu hiện vật trói buộc [demon.GetFirstName] vào ý chí của ta, [demon.GetSheHe] được tự do làm điều [demon.GetSheHe] muốn.\n\nTa chợt nhận ra rằng không gì khiến [demon.GetHerHim] hài lòng hơn việc mưu tính lật đổ ta."
 POD_demon_maintenance.3.a: "Điều này chẳng thể tốt lành gì."
 POD_demon_maintenance.3.a.tt: "[demon.GetFirstName] giờ đây sẽ thực hiện các hành vi [demonic_sabotage|E] chừng nào [demon.GetSheHe] vẫn là [rival|E] của ngươi và chưa bị [diabolism_bound|E] hay [Concept('POD_banish','Banished')|E]."
 POD_demon_maintenance.3.b: "May mắn thay, ta đã trục xuất [demon.GetHerHim] từ trước."

 POD_demon_maintenance.4.desc: "Nỗ lực thất bại của ta trong việc [diabolism_binding|E] [demon.GetFirstName] đã không lọt qua mắt [demon.GetHerHim].\n\nTa có thể cảm nhận một áp lực đè lên sau gáy, một cảm giác kinh hoàng khó tả, như thể có ai đó ngoài tầm mắt đang theo dõi ta.\n\nChờ đợi.\n\nMưu tính..."

 POD_demon_maintenance.10.t: "Vật Chứa"
 POD_demon_maintenance.10.desc: "Để có thể ở lại trong Sáng Thế, một ác quỷ phải trú ngụ trong một vật chứa hữu hình nào đó. Ác quỷ căm ghét những vật chứa của mình, những cái vỏ mà chúng phải ẩn nấp bên trong giữa thế giới vô giá trị của Thượng Đế; dù còn khá hơn cõi hư vô không lối thoát của Vực Thẳm, một vật chứa vẫn là một loại ngục tù, và mỗi khoảnh khắc bị neo giữ trong một thân xác hữu hình lại là một lý do nữa để căm ghét Thượng Đế. Chúng mong chờ đến ngày có thể thiêu rụi toàn bộ thế giới vật chất, ngắm nhìn cảnh hủy diệt huy hoàng ấy từ sự tiện nghi của vương quốc tâm linh ghê tởm của riêng chúng.\n#X Theo luật chơi, Earthbound là bất tử thực sự nhưng phải giữ linh hồn mình trong một phần của thế giới vật chất. Đó có thể là thủ phủ của chúng, khiến chúng không thể chỉ huy quân đội, di chuyển thủ phủ, và sẽ bị đẩy trở về Ngục Vực Thẳm nếu mất thủ phủ đó. Hoặc chúng có thể gắn với một vật lưu hồn, một hiện vật mang lại cho chúng nhiều khả năng di chuyển hơn nhưng cũng mong manh hơn nhiều. Nếu vật lưu hồn bị hủy diệt, Ác Quỷ lại phải quay về Ngục Vực Thẳm, một quá trình vô cùng tốn kém để thoát ra.#!"
 POD_demon_maintenance.10.option.a: "Ta chỉ chiếm hữu vật chủ con người."
 POD_demon_maintenance.10.option.a.tt: "Chỉ chiếm hữu vật chủ con người (không chiếm hữu vật chứa vô tri) sẽ giúp giảm bớt Torment của ngươi. (-1 điểm kinh nghiệm Torment/năm)"
 POD_demon_maintenance.10.option.b: "Ta ở trong một ngục tù bằng đá."
 POD_demon_maintenance.10.option.b.tt: "Ngươi sẽ không thể trở thành chỉ huy quân hay di chuyển, trừ khi ngươi cũng chiếm hữu thêm một thân xác vật chủ."
 POD_demon_maintenance.10.option.c: "Ta bị trói buộc vào mặt đất."
 POD_demon_maintenance.10.option.c.tt: "Ngươi sẽ không thể di chuyển thủ phủ của mình, và sẽ bị phế truất nếu để mất nó."
 earthbound_artifact_choice_tt: "Ngươi sẽ được đưa ra một lựa chọn giữa các hiện vật để chọn làm vật lưu hồn, những vật chứa cho linh hồn ngươi."

 POD_demon_maintenance.11.t: "Ngục Tù Bằng Đá"
 POD_demon_maintenance.11.desc: "Phần lớn ác quỷ lang thang trong Sáng Thế đều bị giam giữ bên trong các vật lưu hồn, những vật thể vô tri do tín đồ của chúng tạo ra để chúng trú ngụ. Khi một ác quỷ được triệu hồi, nghi thức sẽ tập trung vào vật lưu hồn đó; ác quỷ hiện diện bên trong nó, linh hồn của nó hòa lẫn vào chất liệu vật chất của vật thể ấy."
 POD_demon_maintenance.11.option.a: "Ta bị giam trong một vũ khí."
 POD_demon_maintenance.11.option.b: "Ta bị giam trong một bộ giáp."
 POD_demon_maintenance.11.option.c: "Ta bị giam trong một món đồ trang sức lấp lánh."
 POD_demon_maintenance.11.option.d: "Ta bị giam trong một cuốn sách."
 POD_demon_maintenance.11.option.e: "Ta bị giam trong một món đồ nội thất."
 POD_demon_maintenance.11.option.f: "Ta bị giam trong một món đồ trang sức nhỏ."

 POD_demon_maintenance.15.t: "Tiếp Tục Tìm Vật Chủ Mới?"
 POD_demon_maintenance.15.desc: "Sử dụng vật chủ con người cho phép ngươi di chuyển và tận hưởng các hoạt động, nhưng có nhược điểm là vật chủ chết đi nhanh chóng, như ngươi đang trải qua lúc này. Ngươi có nên tiếp tục tìm kiếm vật chủ con người trong tương lai không? Trói buộc vào một vật thể thay vào đó sẽ xóa bỏ cả điểm yếu lẫn điểm mạnh của phương pháp vật chủ con người ngươi đang dùng."
 POD_demon_maintenance.15.option.a: "Ta sẽ tiếp tục thay đổi."
 POD_demon_maintenance.15.option.b: "Ta đã chán ngán cuộc sống con người."

 POD_demon_maintenance.20.t: "Vật Chủ Kế Tiếp"
 POD_demon_maintenance.20.desc: "Lựa chọn duy nhất thay cho việc trú ngụ trong một vật lưu hồn đối với một thiên thần sa ngã là chiếm hữu một vật chủ con người — và cho tới gần đây, đây quả thực là một lựa chọn rất tồi. Ác quỷ có thể chiếm hữu con người trong một thời gian, nhưng không vĩnh viễn, bởi hành vi chiếm hữu khiến kẻ phàm trần chịu một cái chết khủng khiếp không thể tránh khỏi trong thời gian ngắn. Nghi Thức Linh Hồn Chia Cắt là một khả năng mới được tìm ra, giúp quá trình này dễ dàng hơn đôi chút.\n#X Theo luật chơi, ngươi là bất tử thực sự nhưng luôn phải có một vật chủ, nếu không sẽ bị buộc quay về Ngục Vực Thẳm. Ngươi có thể tự chọn vật chủ kế tiếp của mình thông qua [character_interaction|E] Thêm Vật Chủ Tiềm Năng, điều này cũng cho phép ngươi "hút" một phần thuộc tính của vật chủ. Nếu ngươi không có vật chủ trong một thời gian sau khi vật chủ hiện tại chết đi, ngươi sẽ được đề nghị một tín đồ ngẫu nhiên để dùng làm vật chủ "khẩn cấp" thay thế (không hút linh hồn trong trường hợp đó). Như ngươi có thể đoán, các nhân vật vật chủ rất quan trọng với lối chơi của ngươi, và ngươi có thể tìm thấy họ trong tab quan hệ Thuộc Hạ của mình. Hãy để mắt tới họ!#!"
 POD_demon_maintenance.20.option.a: "Ta sẽ chiếm hữu một tín đồ ngẫu nhiên."
 POD_demon_maintenance.20.option.b: "Ta sẽ chiếm hữu một hiện vật ngẫu nhiên."
 POD_demon_maintenance.20.option.c: "Ta sẽ chiếm hữu thủ phủ của mình."
 #POD_demon_maintenance.20.option.a.tt: "You will play your designated vessel that will inherit your name, age, traits, perks..."
 POD_demon_maintenance.20.option.d: "Hãy để ta trở về hình thái tâm linh."

 demon_without_host_tt: "Đây là một lựa chọn nguy hiểm. Không có vật chủ, ngươi có thể bị mắc kẹt trong [umbra|E] một thời gian."

 POD_demon_maintenance.70.t: "Tên Nô Bộc Xấc Xược"
 POD_demon_maintenance.70.desc: "Ngươi dám cả gan cố giam cầm chủ nhân chính đáng của mình?! Kẻ sở hữu linh hồn ngươi?!\nTham vọng sai lầm của ngươi sẽ khiến ngươi phải trả giá đắt, và ta sẽ vô cùng khoái trá khi bắt ngươi đền tội..."
 POD_demon_maintenance.70.option.a: "Đó chỉ là một sai lầm vô ý!"

 POD_demon_arcana.100.t: "Mua Kho Vũ Khí của Dã Thú"
 POD_demon_arcana.100.desc: "Mua một vũ khí thú tính mới."
 POD_demon_arcana.100.a: "[GetModifier('arsenal_of_the_beast_claws_modifier').GetNameWithTooltip]"
 POD_demon_arcana.100.b: "[GetModifier('arsenal_of_the_beast_fangs_modifier').GetNameWithTooltip]"
 POD_demon_arcana.100.c: "[GetModifier('arsenal_of_the_beast_gaping_maw_modifier').GetNameWithTooltip]"
 POD_demon_arcana.100.d: "[GetModifier('arsenal_of_the_beast_horns_modifier').GetNameWithTooltip]"
 POD_demon_arcana.100.e: "[GetModifier('arsenal_of_the_beast_lashing_tail_modifier').GetNameWithTooltip]"
 POD_demon_arcana.100.f: "[GetModifier('arsenal_of_the_beast_poison_modifier').GetNameWithTooltip]"
 POD_demon_arcana.100.g: "[GetModifier('arsenal_of_the_beast_venom_spit_modifier').GetNameWithTooltip]"
 POD_demon_arcana.100.h: "[GetModifier('arsenal_of_the_beast_spines_modifier').GetNameWithTooltip]"
 POD_demon_arcana.100.i: "[GetModifier('arsenal_of_the_beast_tentacles_modifier').GetNameWithTooltip]"
 POD_demon_arcana.100.j: "[GetModifier('arsenal_of_the_beast_wings_modifier').GetNameWithTooltip]"

 POD_days_of_fire.1342.t: "Đại Xoáy Lốc Thứ Hai"
 POD_days_of_fire.1342.desc: "Với những kẻ theo Người Bị Nguyền Rủa, bóng tối như thế đổ xuống Trái Đất\nVà xuống linh hồn con người\nĐến nỗi kẻ sống ghen tị với người chết, và hơn thế nữa, ghen tị với những kẻ đã quên mất cách chết đi.\nNgay khi người chết còn đang chịu đựng cơn bão lớn thứ hai của họ, kẻ sống,\nKhinh miệt món quà tối thượng của Đấng Ban Cho,\nLại đi ôm lấy lời nguyền của Đại Vương Huyết Tộc.\nĐiều này sẽ không chỉ xảy ra một lần, mà là hai lần."
 POD_days_of_fire.1401.t: "Phục Hưng"
 POD_days_of_fire.1401.desc: "Theo thời gian, bóng tối tan đi.\nCon người một lần nữa ngước mắt lên bầu trời\nVà tìm thấy điều gì đó lớn lao hơn chính mình.\nMột người với con mắt thủy tinh thấy được sự thật, và một người với chiếc mũi bạc ngửi ra nó.\nMột kẻ khờ khôn ngoan hỏi tại sao mặt trăng không rơi xuống.\nHọ là những người cha, vô tình, của một bộ tộc mới, chiến thắng trong âm thầm.\nHọ lập nên bộ tộc của Tâm Trí."
 POD_days_of_fire.1430.t: "Dị Giáo Thẩm Vấn"
 POD_days_of_fire.1430.desc: "Khi con cái của Người Bị Nguyền Rủa trở thành những người cha\nNhưng vẫn từ chối sinh ra con cái\nHọ sẽ giáng xuống con cái của Đại Vương Huyết Tộc\nVà họ sẽ giáng xuống con cái của Quyển Sách.\nCơn mưa của họ rơi xuống cả kẻ công chính lẫn kẻ bất chính như nhau\nVà cơn mưa ấy không phải nước, mà là lửa.\nTìm cách làm điều ác nhân danh điều thiện, họ vẫn làm điều thiện."
 POD_days_of_fire.1450.t: "Cuộc Nổi Dậy Anarch"
 POD_days_of_fire.1450.desc: "Theo thời gian, lời nguyền của Đại Vương\nĐơm hoa kết trái đầy đủ.\nNhư người con trưởng đã phỉ nhổ vào Đấng Ban Cho,\nNhư dòng dõi hoang của hắn đã phỉ nhổ vào hắn,\nThì lũ giòi bọ trong bầy đàn khốn khổ của hắn\nCũng sẽ trỗi dậy để đốt lũ rắn,\nCon số của điểm yếu chúng là mười bốn: Còn sức mạnh của chúng, kém đi một."
 POD_days_of_fire.1492.t: "Vùng Đất Giàu Có"
 POD_days_of_fire.1492.desc: "Vùng Đất Giàu Có ngủ say\nCho tới khi bị đánh thức bởi những người sắt trên những con cá gỗ.\nSứ giả đầu tiên của họ là Ôn Dịch.\nSứ giả thứ hai của họ là Con Ngựa.\nSứ giả thứ ba của họ là Sấm Sét gọi lên từ lòng đất.\nSứ giả cuối cùng của họ là một trận dịch của Sâu Bọ chích đốt.\nHọ đến, soi sáng, và cướp phá."
 POD_days_of_fire.1605.t: "Đại Xoáy Lốc Thứ Ba"
 POD_days_of_fire.1605.desc: "Sự sụp đổ của bộ tộc thuộc\nVùng Đất Giàu Có\nLà tội lỗi lớn đầu tiên của quốc gia đó.\nTừ đó sinh ra một cơn mưa của khổ đau\nđến nỗi, lần thứ ba,\nngay cả người chết cũng than khóc.\nTội lỗi lớn thứ hai của họ là đánh cắp\ncon cái của Vùng Đất Đầu Lâu.\nNhững nô lệ cày xới đất đai mất đi\nmọi ân huệ\nCủa tự do, gia đình và tín ngưỡng\nĐể bọn trộm cắp có được y phục êm ái\nvà biết đến sự ru ngủ ngọt ngào của rượu mạnh."
 POD_days_of_fire.1759.t: "Cách Mạng Công Nghiệp"
 POD_days_of_fire.1759.desc: "Chứng kiến những điều kỳ diệu, những kỳ quan,\nvà những thần đồng\nCon người đổ xô về bộ tộc của\nTâm Trí.\nKhông từ bỏ Quyển Sách, hay các\nTrụ Cột, hay Người Bị Nguyền Rủa\nVẫn còn nhiều kẻ giữ lòng trung thành ban đầu ấy trên\nmiệng lưỡi chứ không phải trong tâm hồn.\nHọ khoác lên mình những tấm y phục tinh xảo, được dệt\nnên không phải bởi bàn tay con người.\nÝ chí của họ vận hành cỗ máy chỉ bằng\nlàn sương mù mịt.\nTừ sự lựa chọn của con người mà mọi thứ\ntiếp nối sinh ra."
 POD_days_of_fire.1775.t: "Cách Mạng Mỹ"
 POD_days_of_fire.1775.desc: "Một thế lực mới đến với vùng đất cổ xưa\nThách thức trí tuệ cũ bằng\nkim loại mới\nVà những kẻ cai trị cũ bằng những chủ nhân mới.\nVì một chiếc lá và một thức uống\nmà điều này xảy ra\nVà vì những con đường đến Đế Quốc Trung Tâm\nvà Người của Giấc Mộng.\nNiềm kiêu hãnh của một vương quốc cổ xưa vì thế\nbị hạ thấp\nVà con cái nó bị ép phải dùng\nthứ độc dược mà kẻ xâm lược khinh miệt."
 POD_days_of_fire.1837.t: "Thời Đại Victoria"
 POD_days_of_fire.1837.desc: "Nó được gọi là một thời đại tươi đẹp, bởi\nnhững kẻ không thuộc về Đầu Lâu, hay\nGiấc Mộng.\nNgay cả với số ít ấy, nó cũng kéo dài chưa đầy\nmột thế hệ.\nNhững lý tưởng về lòng từ thiện và tử tế và\nnhân loại hoàn hảo\nBị hy sinh cho lòng tham và đố kỵ\ncùng sự bất toàn của con người.\nNhững lời kêu gọi cai trị bằng lý trí\nDẫn đến việc lý trí bị cai trị bởi đam mê.\nNhân danh đức hạnh, những thôi thúc đen tối diễu hành."
 POD_days_of_fire.1914.t: "Thế Chiến Thứ Nhất"
 POD_days_of_fire.1914.desc: "Với ánh mắt tham lam, mỗi quốc gia nhìn chằm chằm\nvào đĩa thức ăn của lân bang mình.\nVùng Đất Đầu Lâu, mãi mãi\nbị nguyền rủa, bị vồ lấy như thể bởi bầy chó rừng.\nChiến tranh được thả ra khắp thế gian,\nChiến đấu không chỉ trên chiến trường mà còn\ntrong lòng biển và trên bầu trời.\nMột cánh đồng hoang tàn rộng lớn, cùng\nbùn lầy, độc dược, và những lưỡi sắc bén\nđể cắt xẻ\nGhi hằn sẹo lên đất đai hàng dặm\nKhi đàn bà, đàn ông, và\ntrẻ nhỏ chết đi vì những lá cờ."
 POD_days_of_fire.1916.t: "Đại Xoáy Lốc Thứ Tư"
 POD_days_of_fire.1916.desc: "Nỗi bi thương lớn lao dâng lên từ cuộc chiến này\nĐến nỗi người chết một lần nữa bị quấy nhiễu trong mộ phần của họ.\nCơn bão bóng tối thứ tư\nCơn mưa ký ức thứ tư\nCay đắng hơn những cơn trước đó nhưng ít khắc nghiệt và tàn phá hơn\nso với hai cơn sắp tới."
 POD_days_of_fire.1918.t: "Đại Dịch Cúm"
 POD_days_of_fire.1918.desc: "Chỉ khi Vùng Đất Giàu Có\nCuối cùng tỉnh giấc trước tiếng khóc than của những bậc cha mẹ\nThì các trận chiến mới có thể nghiến răng dừng lại trong tiếc nuối.\nNhưng nỗi khốn khổ không kết thúc ở đó.\nKhi sự tàn sát giữa người với người được\nthay thế\nBằng sự tàn sát của tất cả bởi ôn dịch,\nThì thời gian của thế gian được\ntính bằng thế kỷ."
 POD_days_of_fire.1931.t: "Thế Chiến Thứ Hai"
 POD_days_of_fire.1931.desc: "Một cuộc chiến thứ hai nảy mầm từ hạt giống\ncủa cuộc chiến đầu tiên\nVà một cơn bão thứ hai giữa những\nkẻ bị tàn sát.\nLần này kẻ chiến bại đấu tranh để\ngiành lại niềm kiêu hãnh\nBiểu tượng của họ là con nhện của sự sống,\nbị bóp méo\nBởi chính cái chết mà họ mang đến cho\nNgười của Quyển Sách.\nHọ không tàn sát trong cơn nhiệt huyết\ncủa trận chiến,\nMà giết chóc với sự bình thản đều đặn của\nmột người mẹ đang nướng bánh mì."
 POD_days_of_fire.1937.t: "Chiến Tranh Trung-Nhật"
 POD_days_of_fire.1937.desc: "Không chỉ quốc gia nhện đen\nchiến đấu.\nChúng được tiếp sức bởi một hòn đảo của\nánh sáng phương đông.\nBằng mũi kiếm, chúng cưỡng đoạt\nĐế Quốc Trung Tâm.\nHậu duệ của Con Cái\ncủa Sói\nTìm cách lặp lại những cuộc chinh phạt\ncủa tổ tiên mình\nMột lần nữa quay về Vùng Đất\nĐầu Lâu."
 POD_days_of_fire.1945.t: "Kết Thúc Thế Chiến Thứ Hai"
 POD_days_of_fire.1945.desc: "Một lần nữa, chính Vùng Đất Giàu Có\nnghiêng cán cân của một cuộc đấu cân bằng mong manh\nTiêu tốn của cải lương thực và\nsắt thép cùng máu của những người con trai.\nVào lúc kết thúc cuộc chiến này,\nSự tàn sát giữa người với người được\nthay thế\nBằng sự tàn sát của tư tưởng và\nniềm tin.\nMột cuộc chiến của lửa và sấm sét\nĐược thay thế bằng một cuộc đấu tranh của im lặng\nvà giá lạnh."
 POD_days_of_fire.1950.t: "Bức Màn Sắt"
 POD_days_of_fire.1950.desc: "Một bức tường được dựng lên\nNhưng bị vượt qua trên không\nKhi Đại Bàng và Gấu tranh đấu.\nNhững tâm trí nông cạn nuôi dưỡng mối thù hằn sâu sắc\nVà con số của nỗi sợ mù quáng của họ là năm mươi bảy.\nNhững con rối chiến đấu bằng máu thật\nVà tất cả sống dưới bóng của ngọn lửa bất khiết."
 POD_days_of_fire.1999.t: "Đại Xoáy Lốc Thứ Sáu"
 POD_days_of_fire.1999.desc: "Cơn bão thứ sáu ập đến, nó không\nchết, chẳng bao giờ nguôi bởi ánh mặt trời.\nMột cơn bão vô hình câm lặng, một bức tường của\nkinh hoàng và bóng tối.\nNó đến từ một món quà Thiên Thần,\nđánh thức ngọn lửa ngủ yên trong tất cả?\nNó đến từ những bóng ma\nđược ghi nhớ, gây chiến với những gì bị lãng quên?\nNó đến. Rồi nàng đến.\nMồ mả phun trào, ký ức tàn phá\nthực tại, một tiếng than khóc vang vọng trong sảnh đường của [UmbraGlossary('oblivion')].\nHậu duệ hắc ám đáng sợ của nàng khiếp sợ\nĐại Miệng Nuốt, kẻ yêu thương ngay cả khi nó\nngấu nghiến."

 POD_demon_flavor.1.t: "Ký Ức: Ước Gì Ta Là Một Thiên Thần"
 POD_demon_flavor.1.desc: "Mọi Ác Quỷ từng là Thiên Thần, tạo vật do chính tay Thượng Đế nặn nên để giúp người cai quản và trông coi loài người. Mỗi Thiên Thần được khắc sâu vào bản thể một mục đích (đôi khi rộng lớn, đôi khi rất cụ thể) ngay trong buổi Sáng Thế. Mục đích thần thánh ấy chính là bản chất cốt lõi của họ, và dù đã bị bóp méo và tha hóa qua hàng thiên niên kỷ nổi loạn và giam cầm, nó không bao giờ có thể bị xóa sạch hoàn toàn.\nĐịa vị ngày càng lớn của ngươi đã kéo trở lại một vài ký ức xa xưa ấy từ chốn lãng quên. Trong những thời khắc giản đơn hơn trước cuộc Nổi Loạn, mục đích của ngươi là gì?"
 POD_demon_flavor.1.a: "Một thiên thần của số mệnh"
 POD_demon_flavor.1.b: "Một thiên thần của quy luật"
 POD_demon_flavor.1.c: "Một thiên thần của sự lãnh đạo"
 POD_demon_flavor.1.d: "Một thiên thần của những lối đi"
 POD_demon_flavor.1.e: "Một thiên thần của ánh sao"

 POD_demon_flavor.100.t: "Bậc Thang Xuống Địa Ngục"
 POD_demon_flavor.100.desc: "Ác Quỷ được nuôi dưỡng bởi lòng mộ đạo do các Nô Bộc của chúng cung cấp trực tiếp, hoặc thậm chí gián tiếp bởi những kẻ sa vào tội lỗi sở trường của chúng. Với lòng mộ đạo, một ác quỷ trở nên thực sự hùng mạnh, và về mặt lý thuyết ít nhất, có thể đạt được sức mạnh ngang hàng chính Thượng Đế.\nKhi địa vị của ngươi lớn dần và quyền thống trị của ngươi trên loài người của Thượng Đế mở rộng, sức mạnh của ngươi cũng vậy. Ngươi có muốn dùng lòng mộ đạo của đàn chiên mình để tự củng cố bản thân và thăng tiến trong hàng ngũ ác quỷ không?"
 POD_demon_flavor.100.a: "Một chút tăng cường."
 POD_demon_flavor.100.b: "Tiềm năng của ta là vô hạn."
 POD_demon_flavor.100.c: "Hãy tán tụng ta!"
 POD_demon_flavor.100.d: "Thiên Đường sẽ phải run sợ!"
 POD_demon_flavor.100.e: "Sức mạnh vô hạn!"
 POD_demon_flavor.100.f: "ta đã đủ mạnh rồi"

 POD_demon_flavor.2.t: "Ký Ức: Sáng Thế"
 POD_demon_flavor.2.desc: "Loài người là tạo vật tinh túy nhất của Thượng Đế, ít ra người nghĩ vậy. Mục đích của ngươi, với tư cách một thiên thần, là trông coi và dẫn dắt họ, nhưng không bao giờ để lộ mình. Thực ra, đó là một bước ngoặt khi Thượng Đế rõ ràng thiên vị tạo vật mới nhất của mình... nhưng cũng cảnh báo ngươi không được can thiệp vào những sai lầm tiềm tàng của họ. Ngay cả khi những sai lầm ấy có thể dẫn đến thảm họa. Nhiều thiên thần đã giằng xé về chuyện này, có kẻ nghĩ rằng mệnh lệnh mâu thuẫn của Thượng Đế là một phép thử. Hoặc rằng người đã ngừng quan tâm đến họ nay khi loài người bắt đầu trỗi dậy.\nCuối cùng, có kẻ trở nên ghen tị với loài người, có kẻ bảo bọc thái quá, có kẻ đứng ngoài cuộc. Còn ngươi thì sao?"
 POD_demon_flavor.2.a: "Ngươi đã theo đúng mục đích của mình: dẫn dắt họ."
 POD_demon_flavor.2.b: "Ngươi đã ghen tị và oán hận họ."
 POD_demon_flavor.2.c: "Ngươi đã hiện thân như một người thầy."

 POD_demon_flavor.3.t: "Ký Ức: Sự Sa Ngã"
 POD_demon_flavor.3.desc: "Cuộc Chiến trên Thiên Đường bắt đầu khi một lời tiên tri đến cảnh báo các thiên thần về một thảm họa sắp giáng xuống loài người. Một số, dẫn đầu bởi Lucifer, muốn hiện thân trước loài người để cứu họ khỏi vận mệnh ấy. Những kẻ khác nghĩ rằng ý chí của Thượng Đế về việc không can thiệp vào loài người quan trọng hơn vai trò người canh giữ của họ. Cuộc tranh luận biến thành chiến tranh sau khi Cain giết chết em trai mình là Abel, đưa khái niệm bạo lực vào thế giới còn non trẻ.\nCuộc nổi loạn của Lucifer cuối cùng thất bại, và mọi kẻ nổi loạn trở thành những thực thể nay được gọi là ác quỷ, như chính ngươi. Nhưng tại sao ngay từ đầu ngươi lại theo phe Lucifer?"
 POD_demon_flavor.3.a: "Sức lôi cuốn của Lucifer đã lay chuyển ngươi."
 POD_demon_flavor.3.b: "Ngươi muốn bảo vệ loài người."
 POD_demon_flavor.3.c: "Khái niệm mới về chiến tranh đã mê hoặc ngươi."
 POD_demon_flavor.3.d: "Cho đến ngày nay, ngươi vẫn không chắc chắn."

 POD_demon_flavor.4.t: "Ký Ức: Bị Đày Xuống Địa Ngục"
 POD_demon_flavor.4.desc: "Những thiên thần nổi loạn thất trận, kể cả ngươi, đều bị ném vào Ngục Vực Thẳm. Công trình đáng sợ này đã bẻ gãy hầu hết những kẻ bị giam cầm bên trong thành cái bóng thảm hại của chính họ trước kia. Một số vẫn tìm được chút bình thường mới nào đó và không để nỗi thống khổ thần thánh của mình khuất phục họ. Tuy nhiên, ngay cả điều này cũng phải trả giá. Xa rời mục đích ban đầu, xa rời chính bản chất cốt lõi của mình, những thực thể từng được gọi là thiên thần trở nên biến dạng đến mức không thể nhận ra, trong hy vọng tìm ra cách đối mặt với việc bị cấm cửa vĩnh viễn khỏi Thiên Đường.\nCuối cùng, ngươi là một trong số ít may mắn trốn thoát được, nhưng ngươi vẫn có thể cảm nhận lực kéo của Ngục Tù đang gọi ngươi trở về. Và những ký ức về nơi ấy cũng đang quay trở lại."
 POD_demon_flavor.4.a: "Ngươi đã làm những điều ở đó mà ngươi thà quên đi."
 POD_demon_flavor.4.b: "Ngươi đã cầu nguyện cho một sự tha thứ chẳng bao giờ đến."
 POD_demon_flavor.4.c: "Ngươi đã chịu đựng. Đó là tất cả những gì quan trọng."

 POD_demon_flavor.5.t: "Ký Ức: Địa Ngục Trần Gian"
 POD_demon_flavor.5.desc: "Ngươi là một trong số ít may mắn cuối cùng được triệu hồi ra khỏi Ngục Vực Thẳm, cho phép ngươi trốn thoát đến trần gian sau hàng thiên niên kỷ thống khổ cùng những kẻ nổi loạn đồng đội. Thế giới đã đổi thay rất nhiều kể từ khi ngươi bị giam cầm. Chiến tranh và tuyệt vọng ở khắp mọi nơi, bệnh dịch hoành hành, và thiên đường từng là Eden giờ đây dường như chỉ là một huyền thoại. Loài người vẫn tôn thờ Thượng Đế nhưng dưới nhiều hình thức khác nhau và tranh cãi xem hình thức nào tốt hơn.\nCó lẽ người đã thực sự quay mặt khỏi Trái Đất, có thể vì cuộc nổi loạn của Lucifer, hoặc vì những thất bại của loài người. Dù thế nào, phản ứng đầu tiên của ngươi khi lần đầu nhìn thấy thế giới mới này là gì?"
 POD_demon_flavor.5.a: "Nó cần được thanh tẩy!"
 demonic_objective_final_war_unlock: "Mở khóa Mục Tiêu #s $POD_demon_final_war_objective_decision$#! nếu ngươi đã hoàn thành các mục tiêu trước đó"
 POD_demon_flavor.5.b: "Biết bao tín đồ tiềm năng!"
 demonic_objective_overthrow_unlock: "Mở khóa Mục Tiêu #s $POD_new_genesis_objective_decision$#! nếu ngươi đã hoàn thành các mục tiêu trước đó"
 POD_demon_flavor.5.c: "Có lẽ, ở đâu đó, một tia hy vọng cứu rỗi mong manh."
 chance_of_redemption_unlock: "Mở khóa Mục Tiêu #s $POD_demon_redemption_objective_decision$#!"
 POD_demon_flavor.5.d: "Ta phải tìm ra lời giải cho câu hỏi Thần Thánh."
 demonic_objective_knowledge_unlock: "Mở khóa Mục Tiêu #s $demonic_knowledge_objective_decsion$#! nếu ngươi đã hoàn thành các mục tiêu trước đó"