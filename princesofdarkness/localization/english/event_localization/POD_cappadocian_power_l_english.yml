 POD_cappadocian_power.2000.title: "Hậu Duệ Chuyên Cần"
 POD_cappadocian_power.2000.desc: "Tin tức từ triều đình [recipient.GetNamePossessive] đã tới — hậu duệ của ngươi đã thành công mỹ mãn! Chúng đã hàn gắn những phán đoán sai lầm, xoa dịu những oán hờn và bắc nên những nhịp cầu mới. \n [recipient.GetName] rất hài lòng với món quà ngươi đã ban cho [recipient.GetHerHim]. [recipient.GetSheHe|U] đã báo cho ngươi biết rằng hậu duệ của ngươi sẽ ở lại bên cạnh [recipient.GetHerHis] trong thời gian tới, và rằng [recipient.GetSheHe] nợ ngươi một ân huệ cho những công lao đã bỏ ra."
 
 POD_cappadocian_power.3000.title: "Hậu Duệ Chuyên Cần"
