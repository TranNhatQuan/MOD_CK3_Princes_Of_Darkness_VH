 POD_cappadocian_power.5000.title: "Hậu Duệ Chuyên Cần"
 POD_cappadocian_power.5000.desc: "Tin tức từ triều đình [recipient.GetNamePossessive] đã tới — hậu duệ của ngươi đã thành công mỹ mãn! Chúng đã gây dựng các mối quan hệ, bịt kín những chỗ rò rỉ tiềm tàng và huấn luyện những mật vụ ám hành. \n [recipient.GetName] rất hài lòng với món quà ngươi đã ban cho [recipient.GetHerHim]. [recipient.GetSheHe|U] đã báo cho ngươi biết rằng hậu duệ của ngươi sẽ ở lại bên cạnh [recipient.GetHerHis] trong thời gian tới, và rằng [recipient.GetSheHe] nợ ngươi một ân huệ cho những công lao đã bỏ ra."
 
 POD_cappadocian_power.6000.title: "Hậu Duệ Chuyên Cần"
 POD_cappadocian_power.6000.desc: "Tin tức từ triều đình [recipient.GetNamePossessive] đã tới — hậu duệ của ngươi đã thành công mỹ mãn! Chúng đã tụng đọc thánh thư, hành xử đức hạnh và cải thiện quan hệ với dân chúng. \n [recipient.GetName] rất hài lòng với món quà ngươi đã ban cho [recipient.GetHerHim]. [recipient.GetSheHe|U] đã báo cho ngươi biết rằng hậu duệ của ngươi sẽ ở lại bên cạnh [recipient.GetHerHis] trong thời gian tới, và rằng [recipient.GetSheHe] nợ ngươi một ân huệ cho những công lao đã bỏ ra."
 
 POD_cappadocian_power.7000.title: "Hậu Duệ Thảm Họa"
 POD_cappadocian_power.7000.desc: "Tin tức từ triều đình [recipient.GetNamePossessive] đã tới — hậu duệ của ngươi đã thất bại thảm hại! Chúng đã gây ra tổn hại và hỗn loạn khôn xiết trong lĩnh vực chúng chọn. \n [recipient.GetName] đang sôi máu vì 'món quà' ngươi đã ban cho [recipient.GetHerHim]. [recipient.GetSheHe|U] đã báo cho ngươi biết rằng hậu duệ của ngươi sẽ trở về triều đình ngươi ngay khi có thể, và rằng [recipient.GetSheHe] vô cùng thất vọng vì cách ngươi đã lạm dụng lòng tin của [recipient.GetHerHis]. [recipient.GetSheHe|U] sẽ chờ ngươi chuộc lỗi, sớm hay muộn."
 
 POD_cappadocian_power.8000.title: "Hậu Duệ Thảm Họa"
 POD_cappadocian_power.8000.desc: "Tin tức từ triều đình [recipient.GetNamePossessive] đã tới — hậu duệ của ngươi đã thất bại thảm hại! Chúng đã gây ra tổn hại và hỗn loạn khôn xiết trong lĩnh vực chúng chọn. \n [recipient.GetName] đang sôi máu vì 'món quà' ngươi đã ban cho [recipient.GetHerHim]. [recipient.GetSheHe|U] đã báo cho ngươi biết rằng hậu duệ của ngươi sẽ ở lại bên [recipient.GetHerHis], song không còn là khách nữa, và rằng [recipient.GetSheHe] vô cùng thất vọng vì cách ngươi đã lạm dụng lòng tin của [recipient.GetHerHis]. [recipient.GetSheHe|U] sẽ chờ ngươi chuộc lỗi, sớm hay muộn."
 
