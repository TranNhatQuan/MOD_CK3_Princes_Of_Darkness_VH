 #chase_bounty: "Eliminate Contract"
 #chase_bounty_action: "Eliminate"
 #chase_bounty_desc: "Stalk and find the target when they are alone, then start single combat against them in order to complete your contract and claim the reward."
 #CHASE_BOUNTY_SUCCESS_DESC: "You find and attack the target."
 #CHASE_BOUNTY_DISCOVERY_DESC: "They find out about your mission."
 #chase_bounty_thier_prowess: "Their prowess"
 #chase_bounty_my_prowess: "My prowess"
 #chase_bounty_desc_general: "Stalk and find the target when they are alone, then start single combat against them in order to complete your contract and claim the reward."
 #POD_chase_bounty_interaction_desc: "Hunt the target to earn the bounty!"
 #
 #POD_web_of_knives.1.t: "Trial of Skill"
 #POD_web_of_knives.1.desc: "You have been contacted by one of the Web of Knives elusive recruiter. There will be three trials under his supervision and the first one will be a 'simple' test of skill against him. Using sword or intrigue, you will have to impress him enough for the process to continue. You have the choice between these two types of assassin skills to demonstrate."
 #POD_web_of_knives.1.a: "The sword"
 #POD_web_of_knives.1.effect.success.desc: "You triumphed!"
 #POD_web_of_knives.1.critical.failure.effect.desc: "You were defeated..."
 #POD_web_of_knives.1.b: "Scheming is my forte"
 #POD_web_of_knives.1.c: "I'm not ready yet"
 #web_setback_tooltip: "You give up on the trial for now. You will be able to come back to it."
 #POD_web_of_knives.1.d: "That's way too hard!"
 #web_ending_tooltip: "You give up on the trial and cut all ties you had to the Web. You won't be able to contact them in the future."
 # 
 #POD_web_of_knives.3.t: "Trial: Defeated"
 #POD_web_of_knives.3.desc: "You have been deemed unworthy during the trial. The Web of Knives won't work with you for now and you will have to wait some time before trying again, if that is something you even want to consider. Nothing of real value has been lost though, except a bit of pride."
 #POD_web_of_knives.3.a: "Next time, I will be ready"
 #web_trial_failure_tooltip: "You will be able to try again in 5 years" 
 #POD_web_of_knives.3.b: "These lunatics aren't worth my time!"
 #
 #POD_web_of_knives.2.t: "Trial of Humanity"
 #POD_web_of_knives.2.desc: "The second trial is actually quite simple. You must kill the specific mortal presented in front of you. No questions answered, no reasons given.\nJust senseless murder.\nClearly, they are testing if you are capable of following orders, no matter how brutal or idiotic they might seem. They also are probably judging your moral limits, as the members of the Web are known as very inhumane vampires."
 #POD_web_of_knives.2.a: "Senseless murder it is"
 #POD_web_of_knives.2.b: "This is going too far... for now"
 #POD_web_of_knives.2.c: "This is going too far!"
 #
 #POD_web_of_knives.5.t: "Trial of Faith"
 #POD_web_of_knives.5.desc: "The last trial is actually more of a pledge than anything else. The Web of Knives believes in a fanciful tale where Haqim embraced himself to fight against the 'Damned Children of Khayyin'. Their whole assassin business is merely a front to kill as much $pod_cainites$ as possible in impunity and slowly take over their whole $pod_clan$.\nClearly, they are demented and delusional... or are they? Perhaps there is something about a bloody unrepentant murderer cult that appeals to you. Or you could just pretend to believe in their fanciful tales... but they would clearly take grave offense if they ever find out."
 #POD_web_of_knives.5.a: "Glory to Haqim!"
 #POD_web_of_knives.5.b: "Glory to Haqim..."
 #POD_web_of_knives.5.effect.success.desc: "They believe you!"
 #POD_web_of_knives.5.success: "You are in!"
 #POD_web_of_knives.5.critical.failure.effect.desc: "They don't believe you..." 
 #POD_web_of_knives.5.critical.failure: "Don't trust cults"    
 #POD_web_of_knives.5.c: "I must politely decline"
 #join_web_tooltip: "You will join the Web, getting access to a new panel with contracts to be fulfilled"
 #
 #web_of_knives_intro: "You can kill the targets by any means."
 #web_of_knives_intro2: "You get a Pursue Contract [interaction|E] ending in a lethal duel with them."
 #
 #POD_web_of_knives.6.t: "Assassin!"
 #POD_web_of_knives.6.desc: "You have been studying your target for a while now, learning their habits, their strengths and more importantly their weaknesses. Vampires are paranoid creatures by nature, and it is often quite hard finding a moment in time where the deed can be done, but your thorough recon managed to find such an opportunity.\nJumping from the shadows, you strike first. Only one of you will walk out of this encounter alive."
 #POD_web_of_knives.6.a: "Death comes for you!"
 web_of_knives_diablerie_tt: "Một cuộc đấu tay đôi sinh tử. Ngươi sẽ được đề nghị thực hiện $pod_diablerie$ nếu chiến thắng."
 #POD_web_of_knives.6.b: "Your soul is mine!"

 POD_web_of_knives.7.t: "Web of Knives"
 POD_web_of_knives.7.desc: "Con Cái của Haqim có một truyền thống lâu đời, dù bị tranh cãi gay gắt trong nội bộ, về việc làm lính đánh thuê hay sát thủ đánh thuê cho các ma cà rồng khác. Được tổ chức dưới phe phái bí mật Web of Knives, những hợp đồng này mang lại của cải to lớn (và cơ hội $pod_diablerie$ cho những kẻ ít lương tâm hơn) cho những Banu Haqim ưa mạo hiểm. Dù không thành viên nào của clan bị ép buộc theo đuổi việc này, hầu hết bọn họ ít nhiều đều nhúng tay vào, chí ít cũng để củng cố thêm những định kiến sai lầm của các ma cà rồng khác rằng Banu Haqim toàn là những kẻ sát nhân khát máu không nên đụng vào.\n #X Web of Knives là một đặc điểm cốt lõi của Banu Haqim. Ngươi sẽ định kỳ nhận được các đề nghị theo đuổi một hợp đồng. Nếu chấp nhận, một chiến thắng sẽ mang lại cho ngươi vàng, uy tín và cơ hội $pod_diablerie$.#!"
 POD_web_of_knives.7.a: "Một danh tiếng đáng để duy trì."

 POD_web_of_knives.600.t: "Đầu và Linh Hồn của Chúng"
 POD_web_of_knives.600.desc: "Cuộc tấn công trực diện của ngươi vào nạn nhân đã có kết quả. Chúng đứng khiếp sợ trước mặt ngươi, không thể huy động bất kỳ sự kháng cự nào trước hành động tiếp theo của ngươi. Một cái chết đơn giản, gọn gàng sẽ hoàn tất hợp đồng và mang lại cho ngươi phần thưởng đã hứa, nhưng ngươi cũng biết rằng Web of Knives khuyến khích $pod_diablerie$ như một phần chiến lợi phẩm của kẻ chiến thắng.\nSức cám dỗ chắc chắn hiện diện ở đó, khi dòng máu của kẻ thù bại trận đang gọi mời ngươi, van nài được dùng vào một mục đích hữu ích hơn..."
 POD_web_of_knives.600.option.a: "Đầu và linh hồn của ngươi."
 POD_web_of_knives.600.option.b: "Cái đầu của ngươi là đủ."
 
 POD_web_of_knives.10.t: "Giá Treo Trên Đầu Chúng"
 POD_web_of_knives.10.desc: "Ngươi đã liên hệ với tổ chức bí ẩn được biết đến với tên Web of Knives, có ý định treo giá lên đầu kẻ địch của ngươi. Điều kiện của chúng như sau: ngươi trả nửa số vàng ngay bây giờ và nửa còn lại khi hợp đồng hoàn tất. Ngươi trả càng nhiều, chúng sẽ cử một thành viên của Web càng thiện nghệ. Không hoàn lại nửa đầu tiên nếu vụ ám sát thất bại.\nCòn có một yêu cầu kỳ lạ là ngươi phải hiến một giọt máu nhỏ, được cho là sẽ gửi tới đại sư của hội chúng, nhưng chúng trấn an ngươi rằng đó chỉ là một truyền thống chứ chẳng có gì đen tối hơn. Nếu không thể tin tưởng những sát thủ đánh thuê, thì ngươi còn có thể tin ai được nữa?"
 POD_web_of_knives.10.a: "Một khoản nhỏ hẳn là đủ."
 wok_reward_low_tt: "Nếu mục tiêu của ngươi có hơn 10 Mưu Mô hoặc 20 Võ Dũng, lựa chọn này không có cơ hội thành công.\nNgươi sẽ nhận kết quả sau vài tháng.\nCác lựa chọn tốt hơn chỉ khả dụng ở những vùng có sự hiện diện mạnh của Web of Knives."
 POD_web_of_knives.10.b: "Ta có thể trả nhiều hơn."
 wok_reward_medium_tt: "Nếu mục tiêu của ngươi có hơn 15 Mưu Mô hoặc 30 Võ Dũng, lựa chọn này không có cơ hội thành công.\nNgươi sẽ nhận kết quả sau vài tháng.\nCác lựa chọn tốt hơn chỉ khả dụng ở những vùng có sự hiện diện mạnh của Web of Knives."
 POD_web_of_knives.10.c: "Ta là một ma cà rồng có của ăn của để."
 wok_reward_high_tt: "Nếu mục tiêu của ngươi có hơn 20 Mưu Mô hoặc 40 Võ Dũng, lựa chọn này không có cơ hội thành công.\nNgươi sẽ nhận kết quả sau vài tháng.\nChỉ khả dụng ở những nơi sự hiện diện của Web of Knives vốn mạnh từ lâu đời."
 POD_web_of_knives.10.d: "Ta muốn chúng phải chết!"
 wok_reward_very_high_tt: "Nếu mục tiêu của ngươi có hơn 25 Mưu Mô hoặc 50 Võ Dũng, lựa chọn này không có cơ hội thành công.\nNgươi sẽ nhận kết quả sau vài tháng.\nChỉ khả dụng ở những nơi sự hiện diện của Web of Knives vốn mạnh nhất từ lâu đời."
 POD_web_of_knives.10.e: "Nghĩ lại thì..."     
 
 POD_web_of_knives.11.desc: "Đã vài tháng kể từ khi ngươi liên hệ với Web of Knives để nhờ giải quyết vấn đề nhỏ của mình. Ngươi vẫn theo dõi sát kẻ địch và gần đây biết được một âm mưu ám sát nhắm vào chúng. Trong khi triều đình của chúng đang xôn xao, ngươi thầm cảm ơn tính chuyên nghiệp của Web đã đảm bảo rằng, dù kết quả ra sao, sự việc cũng không thể lần ra dấu vết dẫn tới ngươi.\nGiờ đây, ngươi chỉ cần xem chúng có thành công hay không..."
 POD_web_of_knives.11.a: "Chúng đã làm được! Giờ là lúc trả nốt nửa còn lại..."
 POD_web_of_knives.11.b: "Chúng đã thất bại! Lũ vô dụng..."
 
 POD_web_of_knives.13.desc: "Người liên lạc của ngươi trong Web of Knives vừa thông báo cho ngươi về một hợp đồng treo giá lên đầu một ma cà rồng trong khu vực của ngươi. Web có nhiều đặc vụ có thể thử hoàn thành nhiệm vụ này, nhưng ngươi được ưu tiên chọn trước nếu muốn tự mình theo đuổi.\nNhư thường lệ, hai lựa chọn bày ra trước mặt ngươi. Một vụ giết người kín đáo có thể hiệu quả và giữ ngươi cách xa nạn nhân tiềm năng (chắc hẳn đang rất giận dữ) nếu mọi chuyện trở nên tồi tệ, hoặc ngươi có thể chọn cách tiếp cận "trực tiếp ra tay" hơn. Rõ ràng cách này rủi ro hơn nhiều nhưng cũng là cách duy nhất để đảm bảo khả năng thực hiện $pod_diablerie$ ở cuối cùng..."
 POD_web_of_knives.13.a: "Không cần mạo hiểm không cần thiết."
 wok_intrigue_duel_tt: "Lựa chọn này không khiến ngươi mạo hiểm gì hơn ngoài việc mất Uy tín nếu thất bại. Tuy nhiên, nếu chiến thắng, ngươi sẽ không có cơ hội hành Diablerie nạn nhân của mình."
 POD_web_of_knives.13.effect.success.desc: "Âm thầm và chí mạng"
 POD_web_of_knives.13.critical.failure.effect.desc: "Một thất bại..."
 POD_web_of_knives.13.b: "Một cuộc tấn công trực diện!"
 POD_web_of_knives.13.c: "Ta sẽ không nhận hợp đồng này."
 
 


