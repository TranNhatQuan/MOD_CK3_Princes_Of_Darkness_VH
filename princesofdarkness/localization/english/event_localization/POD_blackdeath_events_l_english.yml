l_english:
 
 POD_blackdeath.0002.t: "Tin Đồn về Một Trận Ôn Dịch"
 POD_blackdeath.0002.desc: "Bệnh tật là chuyện thường ngày của thời đại này, nhưng một tin đồn vừa chớm đã khiến ngươi phải chững lại. Nó kể về một trận ôn dịch khủng khiếp hơn mọi trận dịch khác, đến từ phương Đông xa xôi. Căn bệnh ghê rợn ấy dường như lan đi với tốc độ đáng báo động và số người chết mỗi ngày một tăng.\nQuyền cai trị của ngươi, dẫu phần nào tách rời khỏi những bận tâm của phàm nhân, vẫn gắn chặt với sự an lành của những sinh linh mong manh trong lãnh địa ngươi. Điều gì sẽ xảy ra nếu bỗng chốc ngươi chỉ còn cai trị xác chết và bọ chét? Đó là viễn cảnh ảm đạm, đủ khiến ngay cả lãnh chúa tàn nhẫn nhất cũng phải suy nghĩ.\nTuy nhiên thời gian đang cạn dần, và ngươi phải quyết định: ngươi có kín đáo chuẩn bị cho đám phàm nhân trong vùng đón lấy thời khắc nguy nan sắp tới hay không?"
 POD_blackdeath.0002.a: "Hãy cầu nguyện cho sự cứu rỗi!"
 POD_blackdeath.0002.b: "Ta cần đám phàm nhân của mình khỏe mạnh!"
 POD_blackdeath.0002.c: "Chuyện đó chẳng đáng để ta bận tâm"
 POD_blackdeath_preparations: "Ngươi sẽ có sự chuẩn bị tốt hơn khi Kỵ Sĩ Nhợt Nhạt tới."
 #small_blackdeath_devastation_modifier: "Small Black Death Devastation"
 #small_blackdeath_devastation_modifier_desc: "The Pale Rider is here, his touch is cold and deadly, but somewhat gentle compared to the rest of the world."
 #medium_blackdeath_devastation_modifier: "Medium Black Death Devastation"
 #medium_blackdeath_devastation_modifier_desc: "The Pale Rider is here. Lucky, but few, are those that managed to escape his deadly embrace."
 #high_blackdeath_devastation_modifier: "High Black Death Devastation"
 #high_blackdeath_devastation_modifier_desc: "The Pale Rider is here. This is his realm, and no living soul can enter here anymore."
 POD_blackdeath.0004.t: "Cái Chết Đen"
 POD_blackdeath.0004.desc: "Thế gian đã nếm trải không ít ôn dịch và bệnh tật, nhưng đã bao giờ nó biết tới thứ chết chóc như Cái Chết Đen này chưa? Ngay cả với tri thức uyên thâm của mình, ngươi cũng không nhớ nổi một biến cố nào thảm khốc đến vậy.\nPhàm nhân chết như ngả rạ, bị Kỵ Sĩ Nhợt Nhạt cướp đi khi hắn rong ruổi từ thành này sang thành khác, để lại sau lưng chỉ toàn xác chết và bọ chét. Cầu nguyện, lửa, đổ lỗi... dường như chẳng thứ gì ngăn nổi nó, hay thậm chí làm nó chậm lại. Cả cộng đồng đã hóa thành tro tàn và sự tĩnh lặng rợn người bao trùm không gian suốt ngày đêm đã nói lên tất cả...\nĐây là hồi kết chăng?"
 POD_blackdeath.0004.a: "Một hồi kết chậm rãi, đau đớn cho loài người?"
 POD_blackdeath_happening: "Cái Chết Đen đã tới. Các lãnh địa bị tàn phá, mất Phát triển và công trình tùy theo quy mô lây nhiễm. Ngươi sẽ thấy một biến số bá quốc cho biết mức độ thiệt hại ở từng bá quốc."
 POD_blackdeath.0005.t: "Tai Ương Scourge"
 POD_blackdeath.0005.desc: "Mọi thứ đang tệ đi.\nBằng cách nào đó, chủng Cái Chết Đen dường như đã biến dị. Cho tới nay nó chỉ hành hạ phàm nhân và ít gây hậu quả trực tiếp cho ma cà rồng, nhưng nay thì không còn vậy nữa. Biến chủng này, được giới học giả gọi là 'Scourge', tấn công thẳng vào $pod_vitae$ của ma cà rồng. Nó khiến máu kém mãnh lực hơn vốn có, và vì thế phải tiêu tốn nhiều hơn mới có tác dụng. Cộng thêm nguồn máu hạn hẹp vì phàm nhân vẫn chết la liệt khắp nơi bởi Cái Chết Đen...\nTin tốt duy nhất là Scourge dường như không gây tử vong cho ma cà rồng, cùng lắm chỉ làm suy nhược. Dẫu đã ráo riết truy xét, chẳng ai có nổi manh mối về chuyện này đã xảy ra thế nào hay ai là kẻ chịu trách nhiệm..."
 POD_blackdeath.0005.a: "Cơn ác mộng này có hồi kết không?"
 POD_blackdeath.0005.b: "Chắc chắn đám Tremere là thủ phạm!"
 POD_blackdeath.0005.c: "Đám Cappadocian đã táy máy với xác chết của phàm nhân!"
 POD_blackdeath.0005.d: "Rõ ràng đây là lỗi của đám Setite."
 POD_scourge_tremere: "Đám Tremere trong lãnh địa ngươi sẽ không thích điều đó."
 POD_scourge_cappadocian: "Đám Cappadocian trong lãnh địa ngươi sẽ không thích điều đó."
 POD_scourge_setite: "Đám Setite trong lãnh địa ngươi sẽ không thích điều đó."
 POD_scourge_warning: "Một số ma cà rồng đã bắt đầu nhiễm Scourge và phát tán nó."
 #weak_scourge_modifier: "Small Scourge Symptoms"
 #weak_scourge_modifier_desc: "You have been infected by the Scourge. Luckily, you are only experiencing some mild weakness so far."
 #medium_scourge_modifier: "Medium Scourge Symptoms"
 #medium_scourge_modifier_desc: "You have been infected by the Scourge. You are severely weakened, and have trouble keeping the appearance of a strong ruler."
 #high_scourge_modifier: "Severe Scourge Symptoms"
 #high_scourge_modifier_desc: "You have been infected by the Scourge. You feel very weak and, worse, you appear very weak to the rest of the Cainite world."
 #POD_blackdeath.0007.t: "The Scourge: Infected!"
 #POD_blackdeath.0007.desc: "The Scourge spares no one... at least not you. It's a strange feeling really, sickness has been a faint memory of your breathing days for a long time at this point and now it's back to haunt you.\nYou feel weak, your blood has trouble conjuring the power it once had and you can see in the eyes of your entourage the fear of being exposed to you... and the greedy glint of opportunities being pondered while you are thus weakened.\nTroubled times ahead."
 #POD_blackdeath.0007.a: "I just need to lay down a little..."
 POD_scourge_happening: "Ngươi đã nhiễm Scourge. Với bản chất lây lan của căn bệnh, tùy tùng của ngươi nhiều phần cũng đã hoặc sắp nhiễm.\nNgươi có thể xem mức độ nghiêm trọng của tình trạng hiện tại ngay trong đặc điểm ấy."
 #POD_blackdeath.0008.t: "The End of a Nightmare?"
 #POD_blackdeath.0008.desc: "The Black Death is slowly losing ground on the mortal realm. And while an utterly devastating event, it hasn't wiped out humanity as some have feared. It will take a long time for civilization to come back to where it was before, but the rebuilding efforts have begun.\nThe Scourge, this vampiric disease that affected them, is also slowing down, probably due to its parasitic connection to the Black Death itself. It seems the doomed race of Caine has earned a little more time under the night sky."
 #POD_blackdeath.0008.a: "The Pale Rider has shown mercy."
 POD_blackdeath.0007.t: "Ôn Dịch Lột Da"
 POD_blackdeath.0007.desc: "Không phải kẻ thù nào của Garou cũng có thể đối phó bằng nanh và vuốt. Mùa đông năm 1229, người sói ở Lihuania đổ bệnh vì một cơn sốt. Thoạt đầu trông như một biến thể lạ của bệnh lao, rồi những mụn nhọt nổi lên, rồi da thịt rơi khỏi xương trong đau đớn tột cùng. Toàn bộ dân Garou trong vùng đã chết và căn bệnh bắt đầu lan về phía tây. Hàng trăm Garou và Thân Tộc chết theo trong khi các Theurge dường như chật vật lắm mới kìm được nó.\nCác bầy khắp thế gian đang chia sẻ tin tức và tin đồn về nguyên nhân có thể của căn bệnh chết người này, thứ rõ ràng mang bản chất siêu nhiên bởi nó chỉ nhắm vào người sói và thân tộc của họ. Liệu có tìm ra được thủ phạm trước khi quá muộn cho những chiến binh kiêu hãnh của Gaia?"
 POD_blackdeath.0007.a: "Chúng ta phải hành động!"
 POD_flaying_plague_happening: "Ôn Dịch Lột Da đã bùng phát ở Đông Âu. Ngươi có thể dùng một quyết sách để chặn nó. Các đợt bùng phát mới sẽ xảy ra định kỳ cho tới khi tìm ra giải pháp."
  
 



