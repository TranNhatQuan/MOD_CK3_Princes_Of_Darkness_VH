l_english:

 POD_imprison.002.title: "Giam cầm: [targetdefender.GetFirstName]"
 POD_imprison.002.desc: "Ngươi đang cố giam cầm [targetdefender.GetFirstName], nhưng [targetdefender.GetSheHe] dám chống cự ngươi, ngươi nên làm gì?"
 POD_imprison.002.desc.hunter: "Ngươi đang cố giam cầm một con đẻ của quỷ dữ, [targetdefender.GetFirstName], nhưng những con đỉa này khó lòng để tôi tớ của Chúa bắt được chúng. Ngươi nên làm gì?"


 POD_imprison.002.option.a: "[targetdefender.GetFirstName] sẽ phải phục tùng ta!"
 POD_imprison.002.option.b: "[targetdefender.GetFirstName] không thể cưỡng lại sức quyến rũ của ta."
 POD_imprison.002.option.c: "Ta sẽ xé xác [targetdefender.GetHerHim] ra!"
 POD_imprison.002.option.d: "[attacker_marshal.GetFirstName] sẽ đặt [targetdefender.GetHerHim] vào đúng chỗ của [targetdefender.GetHerHis]!"
 POD_imprison.002.option.coterie: "Thành viên [prowess_duelist.GetFirstName] trong [GetPlayer.Custom('PODCoterieNoTooltip')] của ta sẽ khuất phục [targetdefender.GetHerHim]."
 POD_imprison.002.option.e: "[attacker_marshal.GetFirstName] chắc chắn biết cách bắt những con quỷ như thế!"
 POD_imprison.002.option.f: "Đã đến lúc [targetdefender.GetShortUIName] phải đối diện với sức nặng của tội lỗi [targetdefender.GetHerHis]."
 POD_imprison.002.option.g: "Chưa phải lúc thích hợp"
 POD_imprison.002.option.h: "Những cơn ác mộng của rift sẽ giữ chúng làm bạn cho đến khi ta quyết định phải làm gì với chúng"
 POD_imprison.002.option.success: "[attacker.GetFirstName] chiến thắng"


 POD_imprison.002.option.a.desc: "Một cuộc xung đột về sự thống trị"
 POD_imprison.002.option.b.desc: "Một cuộc xung đột về tính cách"
 POD_imprison.002.option.c.desc: "Một trận chiến bằng dũng mãnh"
 POD_imprison.002.option.d.desc: "Một trận chiến bằng dũng mãnh, thống lĩnh của ngươi đại diện cho ngươi"
 POD_imprison.002.option.d.success: "[attacker_marshal.GetFirstName] chiến thắng"
 POD_imprison.002.option.coterie.desc: "Một trận chiến bằng dũng mãnh, thành viên [GetPlayer.Custom('PODCoterie')] của ngươi đại diện cho ngươi"
 POD_imprison.002.option.coterie.success: "[prowess_duelist.GetFirstName] chiến thắng"
 POD_imprison.002.option.e.desc: "Kỹ năng quân sự của thống lĩnh ngươi đấu với sự dũng mãnh của con đỉa đó"
 POD_imprison.002.option.e.success: "[attacker_marshal.GetFirstName] bắt được một con quỷ đê tiện"
 POD_imprison.002.option.failure: "[targetdefender.GetFirstName] chiến thắng"
 POD_imprison.002.option.e.failure: "[targetdefender.GetFirstName] đã trốn thoát thành công"
 OD_imprison.002.option.f.desc: "Sử dụng thánh thuật Nước Mắt Của Vị Thánh Tử Đạo"

 POD_imprison.002.option.a.tt.attacker_wins: "Ta khuất phục [targetdefender.GetFirstName]!"
 POD_imprison.002.option.a.tt.attacker_lost: "Ý chí của [targetdefender.GetFirstNamePossessive] quá mạnh để khuất phục."
 POD_imprison.002.option.b.tt.attacker_wins: "Ta mê hoặc [targetdefender.GetFirstName]!"
 POD_imprison.002.option.b.tt.attacker_lost: "[targetdefender.GetFirstName] miễn nhiễm với sức quyến rũ của ta." 
 POD_imprison.002.option.c.tt.attacker_wins: "Ta đánh bại [targetdefender.GetFirstName] trong cuộc giao chiến tay đôi!"
 POD_imprison.002.option.c.tt.attacker_lost: "Ta bị đánh bại bởi [targetdefender.GetFirstName] trong cuộc giao chiến tay đôi."
 POD_imprison.002.option.d.tt.attacker_wins: "[attacker_marshal.GetFirstName] đánh bại [targetdefender.GetFirstName] trong cuộc giao chiến tay đôi!"
 POD_imprison.002.option.d.tt.attacker_lost: "[attacker_marshal.GetFirstName] bị đánh bại bởi [targetdefender.GetFirstName] trong cuộc giao chiến tay đôi."
 POD_imprison.002.option.coterie.tt.attacker_wins: "[prowess_duelist.GetFirstName] đánh bại [targetdefender.GetFirstName] trong cuộc giao chiến tay đôi!"
 POD_imprison.002.option.coterie.tt.attacker_lost: "[prowess_duelist.GetFirstName] bị đánh bại bởi [targetdefender.GetFirstName] trong cuộc giao chiến tay đôi."
 POD_imprison.002.option.e.tt.attacker_wins: "[targetdefender.GetFirstName] sẽ mục rữa trong ngục tù của ngươi!"
 POD_imprison.002.option.e.tt.attacker_lost: "[targetdefender.GetFirstName] trốn thoát"
 POD_imprison.002.option.f.tt: "[targetdefender.GetFirstName] sẽ thấy trong mắt ngươi độ sâu tội lỗi của [targetdefender.GetHerHis] phản chiếu lại cho [targetdefender.GetHerHim] một cách rõ ràng đến choáng ngợp."
 POD_imprison.002.option.g.tt: "Ngươi sẽ ngừng cố giam cầm [targetdefender.GetFirstName]."
 POD_imprison.002.option.h.tt: "[targetdefender.GetFirstName] sẽ không thể cưỡng lại việc bị niêm phong vĩnh viễn trong rift của ngươi"

 POD_imprison.102.title: "Tù nhân mới"
 POD_imprison.102.desc.dominate: "Ngươi đã thành công bẻ gãy tâm trí của [targetdefender.GetFirstNamePossessive] theo ý muốn của mình, giờ [targetdefender.GetSheHe] sẽ vào ngục tù của ngươi mà không phản kháng"
 POD_imprison.102.desc.presence: "Ngươi đã thành công khiến [targetdefender.GetFirstName] muốn bước vào phòng giam mới của [targetdefender.GetHerHis] chỉ để làm hài lòng ngươi."
 POD_imprison.102.desc.prowess: "Ngươi đã thắng. [targetdefender.GetFirstName] không thể chống cự ngươi nữa. Điều này sẽ dạy cho mọi người biết điều gì xảy ra với những kẻ chống đối ngươi."
 POD_imprison.102.desc.marshal: "[attacker_marshal.GetFirstName] đã đánh bại [targetdefender.GetFirstName]. Điều này sẽ dạy cho mọi người không được chống đối quyền lực của ngươi."
 POD_imprison.102.desc.coterie: "[prowess_duelist.GetFirstName] đã đánh bại [targetdefender.GetFirstName]. Điều này sẽ dạy cho mọi người không được chống đối $POD_player_coterie$."
 POD_imprison.102.desc.hunter: "[attacker_marshal.GetFirstName] đã dùng được điểm yếu của con ma cà rồng để bắt một con quái vật vô đạo, [targetdefender.GetFirstName]. Điều này sẽ dạy cho mọi con đẻ của địa ngục không được chống đối ngươi."
 POD_imprison.102.desc.tears: "Khi [targetdefender.GetFirstName] đứng tê liệt trước mặt ngươi, buộc phải nhớ lại vô số tội lỗi của [targetdefender.GetHerHis], người của ngươi cẩn thận vào vị trí để khuất phục [targetdefender.GetHerHim]. Trước khi [targetdefender.GetSheHe] hoàn toàn tỉnh lại, thân thể [targetdefender.GetHerHis] đã bị xích chặt và những cọc gỗ nhắm vào tim đã sẵn sàng đâm xuống chỉ với một cái giật mình nhỏ nhất."
 POD_imprison.102.desc.rift: "[targetdefender.GetFirstName] không thể thoát khỏi rift của ngươi. Điều này sẽ dạy cho mọi người biết điều gì xảy ra với những kẻ chống đối ngươi."
 POD_imprison.102.option.a: "Giờ ta phải làm gì với ngươi đây?"

 POD_imprison.103.desc: "Khi [targetdefender.GetFirstName] đứng tê liệt trước mặt ngươi, buộc phải nhớ lại vô số tội lỗi của [targetdefender.GetHerHis], người của ngươi cẩn thận vào vị trí để khuất phục [targetdefender.GetHerHim]. Trước khi [targetdefender.GetSheHe] hoàn toàn tỉnh lại, thân thể [targetdefender.GetHerHis] đã bị xích chặt và những cọc gỗ nhắm vào tim đã sẵn sàng đâm xuống chỉ với một cái giật mình nhỏ nhất."
 POD_imprison.103.option.a: "Giờ đến lúc phán xét."


 POD_imprison.202.title: "Thua trận"
 POD_imprison.202.desc: "Trận chiến đã thua, mục tiêu của ngươi đã trốn thoát khỏi ngươi. Có lẽ ngươi nên thử lại khi thời cơ chín muồi?"
 POD_imprison.202.desc.hunter: "[attacker_marshal.GetFirstName] đã thất bại. Kế hoạch của hắn không thành công và giờ con quỷ hiện thân này, [targetdefender.GetFirstName], đã trốn thoát! Có lẽ ngươi nên thử lại khi thời cơ chín muồi?"
 POD_imprison.202.option.a: "Đây chỉ là một trở ngại nhỏ"

 POD.imprison.302.title: "Bằng ý chí kiên định"
 POD_imprison.302.desc.dominate: "Nỗ lực khuất phục [targetdefender.GetFirstName] của ngươi đã thất bại. Ngươi có thể thử bắt giữ [targetdefender.GetHerHim] bằng vũ lực."
 POD_imprison.302.desc.presence: "[targetdefender.GetFirstName] đã chống lại sức quyến rũ của ngươi. Ngươi có thể thử bắt giữ [targetdefender.GetHerHim] bằng vũ lực."
 POD_imprison.302.option.a: "[targetdefender.GetFirstName] sẽ không thoát được!"
 POD_imprison.302.option.b: "Ta đã thất bại..."
 POD_imprison.302.option.b.tt: "Ngươi sẽ thất bại trong nỗ lực giam cầm. [targetdefender.GetFirstName] sẽ có được một điểm yếu nhẹ trước ngươi."

 POD_imprison.002.option.labyrinth: "Mê Cung Kami"
 POD_imprison.002.option.labyrinth.tt: "Bằng cách giấu kami này trong một căn phòng và nói ra lời trói buộc, ngươi có thể ngăn [targetdefender.GetFirstName] rời đi. Ví dụ, nếu [targetdefender.GetFirstName] trèo ra khỏi cửa sổ, họ sẽ thấy [targetdefender.GetHerselfHimself] quay trở lại qua cửa ra vào, và cứ thế tiếp diễn."