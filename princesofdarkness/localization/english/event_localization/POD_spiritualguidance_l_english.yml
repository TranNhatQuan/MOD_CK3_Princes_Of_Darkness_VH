l_english:

 POD_spiritual_guidance.001.t: "Hướng Dẫn Tâm Linh"
 POD_spiritual_guidance.001.desc: "[student.GetFirstName] đang sống một cuộc đời tội lỗi. Ngươi nghĩ mình có thể giúp [student.GetHerHim], nhưng liệu [student.GetSheHe] có chịu nghe không? Suy cho cùng, con đường dẫn tới sự cứu rỗi và xá tội có thể là một quá trình dài đằng đẵng và gian nan, không phải ai cũng chịu đựng nổi."
 POD_spiritual_guidance.001.option.a: "Ta sẽ giúp [student.GetHerHim]"
 POD_spiritual_guidance.001.option.a.tt: "Ngươi đang cố giúp [student.GetFirstName]"
 POD_spiritual_guidance.001.option.b: "Ta không cảm thấy hứng thú"
 POD_spiritual_guidance.001.option.b.tt: "Ngươi từ bỏ ý định giúp [student.GetFirstName]"
 
 
 POD_spiritual_guidance.002.t: "Cố gắng giúp đỡ"
 POD_spiritual_guidance.002.desc: "[teacher.GetFirstName] đã đến gặp ngươi và đề nghị giúp ngươi trở thành một tôi tớ tốt hơn của Chúa. Ngươi sẽ trả lời thế nào đây? Có thể ngươi sẽ trở thành một người tốt hơn sau cùng, hoặc chỉ phí phạm thời gian quý báu, thật khó nói trước."
 POD_spiritual_guidance.002.option.a: "Ta biết ơn nhận lời đề nghị của [teacher.GetHerHis]"
 POD_spiritual_guidance.002.option.a.tt: "Một bài học bắt đầu"
 POD_spiritual_guidance.002.option.b: "Ta không thích hướng đi này"
 POD_spiritual_guidance.002.option.b.tt: "Ngươi từ chối"
 
 POD_spiritual_guidance.102.t: "Một lời từ chối"
 POD_spiritual_guidance.102.desc: "[student.GetFirstName] không muốn ngươi 'giúp đỡ' [student.GetHerHim]. Có vẻ con đường cứu rỗi quá dốc đối với kẻ này. Dù sao thì Chúa cũng sẽ là vị quan tòa duy nhất phán xét linh hồn sau cùng."
 POD_spiritual_guidance.102.option.a: "Thật đáng tiếc..."
 POD_spiritual_guidance.102.option.a.tt: "[student.GetFirstName] đã từ chối lời đề nghị của ngươi"
 
 POD_spiritual_guidance.202.t: "Hướng Dẫn Tâm Linh II"
 POD_spiritual_guidance.202.desc: "Một người thực sự sùng đạo sẽ không hành động tội lỗi. [student.GetFirstName] chưa sẵn sàng phụng sự Chúa với đầy đủ hiệu quả. Và sứ mệnh thiêng liêng của ngươi là giúp [student.GetHerHim] hiểu Chúa hơn. Ngươi có sẽ là người thầy tận tụy đang được cần đến lúc này không?"
 POD_spiritual_guidance.202.option.a: "Dục vọng sẽ không che mờ tâm trí ngươi"
 POD_spiritual_guidance.202.option.a.tt: "Ngươi sẽ cố gắng loại bỏ dục vọng của [student.GetHerHis]"
 POD_spiritual_guidance.202.option.a.desc: "Thử Thách Đức Tin"
 POD_spiritual_guidance.202.option.a.failure.tt: "Ngươi thất bại trong việc giúp [student.GetFirstName]"
 POD_spiritual_guidance.202.option.b: "Cơn giận sẽ không khống chế được ngươi"
 POD_spiritual_guidance.202.option.b.tt: "Ngươi sẽ cố gắng loại bỏ cơn giận của [student.GetHerHis]"
 POD_spiritual_guidance.202.option.b.failure.tt: "Ngươi thất bại trong việc giúp [student.GetFirstName]"
 POD_spiritual_guidance.202.option.c: "Ngươi rốt cuộc không vĩ đại đến thế"
 POD_spiritual_guidance.202.option.c.tt: "Ngươi sẽ cố gắng loại bỏ sự kiêu ngạo của [student.GetHerHis]"
 POD_spiritual_guidance.202.option.c.failure.tt: "Ngươi thất bại trong việc giúp [student.GetFirstName]"
 POD_spiritual_guidance.202.option.d: "Ngươi nghỉ ngơi quá nhiều"
 POD_spiritual_guidance.202.option.d.tt: "Ngươi sẽ cố gắng loại bỏ sự lười biếng của [student.GetHerHis]"
 POD_spiritual_guidance.202.option.d.failure.tt: "Ngươi thất bại trong việc giúp [student.GetFirstName]"
 POD_spiritual_guidance.202.option.e: "Ngươi ăn uống quá độ"
 POD_spiritual_guidance.202.option.e.tt: "Ngươi sẽ cố gắng loại bỏ thói quen ăn uống xấu của [student.GetHerHis]"
 POD_spiritual_guidance.202.option.e.failure.tt: "Ngươi thất bại trong việc giúp [student.GetFirstName]"
 POD_spiritual_guidance.202.option.f: "Lòng tham không phải là điều tốt"
 POD_spiritual_guidance.202.option.f.tt: "Ngươi sẽ cố gắng loại bỏ lòng tham của [student.GetHerHis]"
 POD_spiritual_guidance.202.option.f.failure.tt: "Ngươi thất bại trong việc giúp [student.GetFirstName]"
 POD_spiritual_guidance.202.option.g: "Trái tim ngươi đầy oán hận"
 POD_spiritual_guidance.202.option.g.tt: "Ngươi sẽ cố gắng loại bỏ tính hay thù hận của [student.GetHerHis]"
 POD_spiritual_guidance.202.option.g.failure.tt: "Ngươi thất bại trong việc giúp [student.GetFirstName]"
 
 POD_spiritual_guidance.302.t: "Hướng Dẫn Tâm Linh III"
 POD_spiritual_guidance.302.desc: "Ngươi đã loại bỏ được tội lỗi của [student.GetHerHis]. Nhưng ngươi vẫn chưa xong, giờ là lúc chỉ cho [student.GetFirstName] thấy lối sống đức hạnh. Có lẽ bằng cách làm gương? Chỉ cần cẩn thận đừng để bản thân sa vào tội kiêu ngạo..."
 POD_spiritual_guidance.302.option.a: "Tâm trí trước, xác thịt sau"
 POD_spiritual_guidance.302.option.a.tt: "[student.GetFirstName] trở nên trinh khiết"
 POD_spiritual_guidance.302.option.b: "Ngươi nên biết đủ là đủ"
 POD_spiritual_guidance.302.option.b.tt: "[student.GetFirstName] trở nên điều độ"
 POD_spiritual_guidance.302.option.c: "Chia sẻ là quan tâm"
 POD_spiritual_guidance.302.option.c.tt: "[student.GetFirstName] trở nên hào phóng"
 POD_spiritual_guidance.302.option.d: "Ngươi nên đưa má bên kia ra"
 POD_spiritual_guidance.302.option.d.tt: "[student.GetFirstName] trở nên khoan dung"
 POD_spiritual_guidance.302.option.e: "Ngươi nên bình thản dù trong hoàn cảnh nào"
 POD_spiritual_guidance.302.option.e.tt: "[student.GetFirstName] trở nên điềm tĩnh"
 POD_spiritual_guidance.302.option.f: "Ngươi không hơn gì người khác"
 POD_spiritual_guidance.302.option.f.tt: "[student.GetFirstName] trở nên khiêm nhường"
 POD_spiritual_guidance.302.option.g: "Ngươi sẽ an nghỉ trên thiên đàng"
 POD_spiritual_guidance.302.option.g.tt: "[student.GetFirstName] trở nên siêng năng"
 
 POD_spiritual_guidance.402.t: "Hướng Dẫn Tâm Linh Thất Bại"
 POD_spiritual_guidance.402.desc: "[teacher.GetFirstName] đã khiến ngươi thất vọng! Sau tất cả những bài giảng đó... Có những linh hồn đơn giản là không được định sẵn để được cứu rỗi."
 POD_spiritual_guidance.402.option.a: "Thật đáng thất vọng"
 POD_spiritual_guidance.402.option.a.tt: "Hướng Dẫn Tâm Linh đã thất bại"
 
 POD_spiritual_guidance.502.t: "Hướng Dẫn Tâm Linh Thành Công"
 POD_spiritual_guidance.502.desc: "[teacher.GetFirstName] đã chỉ cho ngươi con đường đúng đắn. Những ngày tháng tội lỗi của ngươi gần như đã kết thúc, giờ ngươi phải trở nên tốt hơn bằng chính sức mạnh của mình."
 POD_spiritual_guidance.502.option.a: "[teacher.GetSheHe] đã thực sự làm được!"
 POD_spiritual_guidance.502.option.a.tt: "Ngươi giờ đã là một người tốt hơn"
 