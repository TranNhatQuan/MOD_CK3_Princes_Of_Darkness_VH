 POD_predatorstories.1405.t: "Nhìn Đi Hướng Khác"
 POD_predatorstories_auspexadvanced.1405.desc: "[GetTrait('sluagh').GetName( GetNullCharacter )], giờ rõ ràng đã lo lắng, đang nóng lòng muốn thương lượng với ngươi và đề nghị thêm vàng để đổi lấy việc để họ đi.\nTuy nhiên Dã Thú trong ngươi không tán thành lựa chọn này, vàng bạc là gì so với cơ hội độc nhất được nếm thử dòng máu độc đáo... sáng bóng... đang rung động ấy?"
 POD_predatorstories_kiasyd.1405.desc: "[GetTrait('sluagh').GetName( GetNullCharacter )], giờ rõ ràng đã lo lắng, đang nóng lòng muốn thương lượng với ngươi và đề nghị thêm vàng để đổi lấy việc để họ đi.\nTuy nhiên Dã Thú trong ngươi không tán thành lựa chọn này, vàng bạc là gì so với cơ hội độc nhất được nếm thử dòng máu độc đáo... sáng bóng... đang rung động ấy?"
 POD_predatorstories_maeghar.1405.desc: "[GetTrait('sluagh').GetName( GetNullCharacter )], giờ rõ ràng đã lo lắng, đang nóng lòng muốn thương lượng với ngươi và đề nghị thêm vàng để đổi lấy việc để họ đi.\nTuy nhiên Dã Thú trong ngươi không tán thành lựa chọn này, vàng bạc là gì so với cơ hội độc nhất được nếm thử dòng máu độc đáo... sáng bóng... đang rung động ấy?"
 POD_predatorstories.1405.desc: "Nạn nhân khác thường này, giờ rõ ràng đã lo lắng, đang nóng lòng muốn thương lượng với ngươi và đề nghị thêm vàng để đổi lấy việc để họ đi.\nTuy nhiên Dã Thú trong ngươi không tán thành lựa chọn này, vàng bạc là gì so với cơ hội độc nhất được nếm thử dòng máu độc đáo... sáng bóng... đang rung động ấy?"
 POD_predatorstories.1405.a: "Ảo giác quá."
 POD_predatorstories.1405.b: "Ánh sáng bóng thuộc về ta!"
 
 POD_predatorstories.1406.t: "Cuộc Chiến Mộng Mị"
 POD_predatorstories_auspexadvanced.1406.desc: "[GetTrait('sluagh').GetName( GetNullCharacter )] không còn nơi nào để chạy trốn.\nĐã đến lúc tự mình chứng kiến khả năng chiến đấu thực sự của sinh vật kỳ lạ này. Hy vọng ngươi thậm chí sẽ có thể hứng được chút máu từ những vết thương ngươi sẽ gây ra cho họ. Ngươi (và Dã Thú của ngươi) không thể chờ đợi trải nghiệm này."
 POD_predatorstories_kiasyd.1406.desc: "[GetTrait('sluagh').GetName( GetNullCharacter )] không còn nơi nào để chạy trốn.\nĐã đến lúc tự mình chứng kiến khả năng chiến đấu thực sự của sinh vật kỳ lạ này. Hy vọng ngươi thậm chí sẽ có thể hứng được chút máu từ những vết thương ngươi sẽ gây ra cho họ. Ngươi (và Dã Thú của ngươi) không thể chờ đợi trải nghiệm này."
 POD_predatorstories_maeghar.1406.desc: "[GetTrait('sluagh').GetName( GetNullCharacter )] không còn nơi nào để chạy trốn.\nĐã đến lúc tự mình chứng kiến khả năng chiến đấu thực sự của sinh vật kỳ lạ này. Hy vọng ngươi thậm chí sẽ có thể hứng được chút máu từ những vết thương ngươi sẽ gây ra cho họ. Ngươi (và Dã Thú của ngươi) không thể chờ đợi trải nghiệm này."
 POD_predatorstories.1406.desc: "Sinh vật kỳ lạ này không còn nơi nào để chạy trốn.\nĐã đến lúc tự mình chứng kiến khả năng chiến đấu thực sự của sinh vật kỳ lạ này. Hy vọng ngươi thậm chí sẽ có thể hứng được chút máu từ những vết thương ngươi sẽ gây ra cho họ. Ngươi (và Dã Thú của ngươi) không thể chờ đợi trải nghiệm này."
 POD_predatorstories.1406.a: "Của ta!"
 POD_predatorstories.1406.b: "Nghĩ lại thì... đây tất cả chỉ là một sự hiểu lầm thôi."
 
