 #Family member would like a wife
 POD_predatorstories.1200.t: "Người Mai Mối"
 POD_predatorstories.1200.desc: "Một trong những thành viên gia đình mà ngươi hút máu rất muốn kết hôn. Tuy nhiên anh ta thiếu vàng để trả cho của hồi môn. Là ân nhân ngầm của gia tộc anh ta, anh ta tìm đến ngươi để nhờ giúp đỡ.\nPhải nghe những yêu cầu vặt vãnh như thế này là một trong những điểm bất lợi của việc hút máu từ một [POD_herd|E] biết rõ sự thật, nhưng ít nhất chẳng ai ép buộc ngươi phải chấp nhận."
 POD_predatorstories.1200.a: "Ta sẽ được mời chứ?"
 POD_predatorstories.1200.b: "Ngươi nghĩ ta là ai chứ?!"
 POD_predatorstories.1200.c: "Ta biết một kẻ đủ tuyệt vọng"
 
 #Family member would like vampire to take child as ward
 POD_predatorstories.1210.t: "Người Giám Hộ Bất Tử"
 POD_predatorstories.1210.desc: "Vì phương pháp hút máu ưa thích của ngươi là đóng vai ân nhân của một gia đình, ngươi được họ biết đến như một người giàu có và có ảnh hưởng. Dù phần lớn thời gian họ không hiểu ngươi thực sự là gì, họ vẫn nghĩ ngươi là một thứ gì đó vĩ đại hơn họ, một điều đáng để noi theo. Vì vậy, một trong những thành viên gia đình ngươi đã chọn hỏi liệu ngươi có nhận con của họ làm người được giám hộ hay không."
 POD_predatorstories.1210.a: "Ta sẽ nuôi dạy chúng"
 POD_predatorstories.1210.b: "Ta không có thời gian"
 
 #Victim tries to cure you of vampirism with a potion
 POD_predatorstories.1220.t: "Bảo Đảm Có Hiệu Quả"
 POD_predatorstories.1220.desc: "Một thành viên trong [POD_herd|E] của ngươi đến với ngươi cùng một đề nghị kỳ lạ. Họ đã mua một loại thuốc mà họ nghĩ có thể chữa khỏi bệnh ma cà rồng của ngươi. Ý tưởng này rõ ràng nực cười nhưng họ có vẻ khá tự hào về bản thân vì đã có được một "phương thuốc thần kỳ" như vậy. Có lẽ ngươi nên chiều lòng họ."
 POD_predatorstories.1220.a: "Uống nó"
 POD_predatorstories.1220.b: "Đừng uống nó"
 
 POD_predatorstories.1220.a.success.toast: "Chỉ là nước lã"
 POD_predatorstories.1220.a.failure.toast: "Nước thánh sao?!"
 
 #Consensualist needs more convincing
 POD_predatorstories.1230.t: "Màn Thuyết Phục"
 POD_predatorstories.1230.desc: "Vì ngươi ưa thích những nạn nhân tự nguyện cho nhu cầu máu của mình, đôi khi ngươi phải đối phó với việc người ta không thực sự sẵn lòng chia sẻ máu của mình với một con quái vật bất tử. Điều này có nghĩa là ngươi phải sáng tạo hơn, hoặc ít nhất phải đủ khéo léo thuyết phục, để khiến họ đồng ý làm điều đó."
 POD_predatorstories.1230.a: "Tôn trọng ý nguyện của họ"
 POD_predatorstories.1230.b: "Đưa ra một thỏa thuận"
 POD_predatorstories.1230.c: "Đưa ra một thỏa thuận hời"
 POD_predatorstories.1230.d: "Thay đổi suy nghĩ của họ giúp họ"
 POD_predatorstories.1230.e: "Dùng phép Mê Hoặc để thay đổi suy nghĩ của họ"
 
 #Victim spouts prophecy
 POD_predatorstories.1240.t: "Lời Tiên Tri Vô Nghĩa"
 POD_predatorstories.1240.desc: "Ma cà rồng vốn là những sinh vật mê tín theo bản chất và họ thường thấy điềm báo ở khắp mọi nơi họ nhìn tới. Ngươi đã bị làm phiền bởi những lời lảm nhảm gần đây của một phàm nhân mà ngươi hút máu. Nó nghe có vẻ vô nghĩa và triều đình của ngươi trấn an rằng ngươi đang lo lắng vô cớ. Vậy rõ ràng là ngươi đã an toàn...\n ...nhưng nếu không thì sao?"
 POD_predatorstories.1240.a: "Có lẽ..."
 POD_predatorstories.1240.b: "Không đâu, chỉ là vô nghĩa thôi."
  
 #Victim has true faith
 POD_predatorstories.1250.t: "Kẻ Mộ Đạo Chân Chính"
 POD_predatorstories.1250.desc: "Ngươi cảm thấy có điều gì đó không ổn về phàm nhân này ngay khi ngươi tiến lại gần để hút máu họ. Nó chủ yếu biểu hiện như một cảm giác bất an tăng dần khi ngươi càng lại gần. Tuy nhiên khi ngươi bắt đầu hút máu từ họ, ngươi hiểu ra sự thật nguy hiểm.\nPhàm nhân này là một tín đồ chân chính và Đức Tin Chân Chính không lay chuyển của họ giờ đang thiêu đốt ngươi từ bên trong. Ngươi vội vàng rút nanh ra và lùi lại để đánh giá lại tình hình."
 POD_predatorstories.1250.a: "Giết chúng!"
 POD_predatorstories.1250.b: "Chạy trốn!"
 POD_predatorstories.1250.c: "Họ sẽ không nói về chuyện này."
 
 #Awoken sleeping vampire
 POD_predatorstories.1260.t: "Phép Tắc Của Kẻ Hút Máu"
 POD_predatorstories.1260.desc: "Một tình huống bất thường đã xảy ra đêm nay khi ngươi đang hút máu từ một phàm nhân. Ngươi nhận thấy rằng họ đã bị rút máu phần nào từ trước và nhanh chóng hiểu ra lý do, một ma cà rồng khác đã hút máu họ gần đây.\nĐây là một sự vi phạm phép tắc, dù không cố ý, và ngươi có thể muốn chính thức hóa giải tình huống này."
 POD_predatorstories.1260.a: "Cố gắng giải quyết tình huống một cách hòa bình"
 POD_predatorstories.1260.b: "Đe dọa chúng"
 POD_predatorstories.1260.c: "Phớt lờ chúng"
 
 POD_predatorstories.1260.a.success: "Ngươi hóa giải tình huống"
 POD_predatorstories.1260.a.success.toast: "Chúng gia nhập triều đình của ngươi"
 POD_predatorstories.1260.a.failure: "Ngươi không thể hóa giải tình huống"
 
 POD_predatorstories.1260.b.success: "Đã khuất phục"
 POD_predatorstories.1260.b.success.toast: "Chúng thật hèn kém"
 POD_predatorstories.1260.b.failure: "Không khuất phục"
 POD_predatorstories.1260.b.failure.toast: "Chúng vẫn ngoan cố"
 
 #POD_predatorstories.1261.t: "Escalated situation"
 #POD_predatorstories.1261.desc: "Your words have provoked them further, prepare to fight."
 #POD_predatorstories.1261.a: "Fight"
 #
 #POD_predatorstories.1261.a.success: "You defeat them"
 #POD_predatorstories.1261.a.success.toast: "Where words have failed fangs have prevailed"
 #POD_predatorstories.1261.a.failure: "They defeat you"
 #POD_predatorstories.1261.a.failure.toast: "They almost killed you!"
 
 #Vampire makes an ettiquette blunder around the gentry 
 POD_predatorstories.1270.t: "Sai Lầm Xã Giao"
 POD_predatorstories.1270.desc: "Hút máu từ giới quý nhân đồng nghĩa với việc ngươi phải giao du với họ, điều không phải lúc nào cũng là công việc thú vị nhất. Phong tục và phép tắc xã giao của phàm nhân thay đổi với tốc độ chóng mặt đối với ma cà rồng, và loại người này không dễ dàng bỏ qua một sai lầm.\nĐáng buồn thay, ngươi đã phạm phải một sai lầm như vậy đêm nay và nhanh chóng trở thành trò cười của bữa tiệc. Giá như ngươi có thể cho họ thấy ngươi thực sự là ai..."
 POD_predatorstories.1270.a: "Giữ bình tĩnh..."
 POD_predatorstories.1270.b: "Ta chắc chắn có thể cứu vãn phần nào chuyện này."
 POD_predatorstories.1270.c: "Chỉ là một câu đùa thôi mà, dĩ nhiên."
 
 #Invited to an invite only event by gentry victim
 POD_predatorstories.1280.t: "Lời Mời Sự Kiện Độc Quyền"
 POD_predatorstories.1280.desc: "Hút máu từ giới quý nhân đồng nghĩa với việc ngươi có suất tham dự một số sự kiện khá độc quyền. Một vài kẻ giao du thượng lưu thậm chí còn coi sự hiện diện của ngươi tại những sự kiện như vậy là dấu hiệu của địa vị xã hội, vì ngươi bí ẩn và cuốn hút đến vậy. Không phải ngươi thực sự quan tâm đám phàm nhân kiêu căng đó nghĩ gì, nhưng việc xuất hiện có thể phản ánh tốt về ngươi."
 POD_predatorstories.1280.a: "Vinh hạnh này hoàn toàn thuộc về các vị."
 POD_predatorstories.1280.b: "Ta không rảnh để bận tâm."
 
 #Cultist starts to doubt vampires divinity
 POD_predatorstories.1290.t: "Nghi Ngờ Thần Thánh"
 POD_predatorstories.1290.desc: "Vì ngươi dùng một giáo phái để có nguồn cung phàm nhân tự nguyện hút máu, ngươi phải đóng vai một đấng thần thánh trước họ. Dù phần lớn thời gian điều này khá dễ làm (dù sao ngươi cũng có quyền năng ấn tượng), đôi khi bầy chiên của ngươi đòi hỏi những màn trình diễn hào nhoáng và ấn tượng hơn. Một số năng lực, như những biểu hiện cao cấp của Presence hay Serpentis, đặc biệt phù hợp để lừa gạt những phàm nhân nhẹ dạ."
 POD_predatorstories.1290.a: "Đừng có dám nghi ngờ ta!"
 POD_predatorstories.1290.b: "Sự hiện diện của ta là thần thánh."
 POD_predatorstories.1290.c: "Ta mang gương mặt của các vị Thần."
 
 #Cultist requires healing
 POD_predatorstories.1300.t: "Sự Chữa Lành Thần Thánh"
 POD_predatorstories.1300.desc: "Vì ngươi đóng vai một đấng thần thánh trước một nhóm phàm nhân hiến máu cho ngươi, đôi khi ngươi phải thực sự đóng vai một ân nhân thần thánh. Một trong những tín đồ của ngươi đến gặp ngươi, van xin ngươi chữa khỏi căn bệnh đang giày vò họ bằng quyền năng thần thánh của ngươi. Những người khác tụ tập lại để chứng kiến quyền năng thần thánh của ngươi thi triển."
 POD_predatorstories.1300.a: "Không có gì ngươi có thể làm để giúp họ."
 POD_predatorstories.1300.b: "Đức tin sẽ chữa lành cho họ."
 POD_predatorstories.1300.c: "Vài loại thảo dược "thần thánh" sẽ giúp ích."
 POD_predatorstories.1300.d: "Ta quả thực có quyền năng chữa lành thần thánh."
 POD_predatorstories.1300.e: "Biến họ thành bộc huyết."
 
 #Victim is actually a prostitute
 
 POD_predatorstories.1311.t: "Cái Giá Của Máu"
 POD_predatorstories.1311.desc: "Con mồi ngươi truy lùng đêm nay cho nhu cầu máu của mình đã tỏ ra dễ chịu và sẵn lòng làm hài lòng đến bất ngờ. Ngươi không nghĩ gì về điều đó cho đến khi, sau khi mọi việc xong xuôi, họ yêu cầu ngươi trả tiền cho thời gian của họ. Hóa ra họ nghĩ ngươi là một vị khách với sở thích khác thường.\nQuả là ngượng ngùng."
 POD_predatorstories.1311.a: "Phớt lờ họ."
 POD_predatorstories.1311.b: "Thôi được... cứ vậy đi."
 POD_predatorstories.1311.c: "Chuyện này chưa từng xảy ra."
 POD_predatorstories.1311.d: "#beast Cái túi máu này dám đòi hỏi ta!#!"
 
 POD_predatorstories.1312.t: "Người Tình Bóng Đêm"
 POD_predatorstories.1312.desc: "Con mồi ngươi truy lùng đêm nay cho nhu cầu máu của mình đã tỏ ra dễ chịu và sẵn lòng làm hài lòng đến bất ngờ. Ngươi không nghĩ gì về điều đó cho đến khi, sau khi mọi việc xong xuôi, họ yêu cầu ngươi làm lại lần nữa vào lúc khác, dường như không hề bối rối trước "sở thích kỳ lạ" rõ ràng của ngươi. Có vẻ như ngươi đã có một người ngưỡng mộ."
 POD_predatorstories.1312.a: "Đây chỉ là chuyện một lần thôi."
 POD_predatorstories.1312.b: "Hãy làm điều gì đó khác một chút vào lần sau."
 POD_predatorstories.1312.c: "#beast Sao phải chờ?#!"
 
 #Scarce prey
 POD_predatorstories.1320.t: "Vùng Đất Cạn Kiệt"
 POD_predatorstories.1320.desc: "Có lẽ vì phàm nhân săn bắn quá mức hoặc vì một lý do nào khác mà ngươi không thực sự hiểu, gần đây đã có sự khan hiếm động vật để hút máu trong vùng của ngươi. Điều này khiến những cuộc săn của ngươi trở nên nguy hiểm hơn, vì phải đi sâu hơn vào rừng có thể khiến ngươi phải đối mặt với sự chú ý không mong muốn, cỡ như của loài sói."
 POD_predatorstories.1320.a: "Mua vài con vật thay thế."
 POD_predatorstories.1320.b: "Dùng bản năng săn bắn của ngươi."
 POD_predatorstories.1320.c: "Dùng năng lực của ngươi."
 
 #Victim discovers one of your secrets and threatens to reveal it
 POD_predatorstories.1330.t: "Phản Tống Tiền"
 POD_predatorstories.1330.desc: "Kẻ phàm nhân ngươi săn đuổi đêm nay khá kỳ lạ, dường như biết nhiều hơn về giống loài của ngươi (hay có lẽ về chính ngươi) hơn hầu hết phàm nhân nên biết. Nghi ngờ của ngươi được xác nhận khi họ tuyên bố đã nắm được một trong những bí mật của ngươi.\nSao điều này có thể xảy ra? Có kẻ nào đó đã bất cẩn, hoặc có lẽ họ làm việc bí mật cho một thành viên trong triều đình của ngươi... Dù thế nào, họ đe dọa sẽ tiết lộ bí mật nếu ngươi không để họ yên."
 POD_predatorstories.1330.a: "Ta chẳng có gì để giấu."
 POD_predatorstories.1330.b: "Chúng ta đang ở thế bế tắc."
 POD_predatorstories.1330.c: "Ngươi sẽ không nói về chuyện này."
 POD_predatorstories.1330.d: "#beast Chúng dám tống tiền ta ư?!#!"
 
 #Victim offers to pay you off instead
 POD_predatorstories.1340.t: "Thú Nhận Sạch Sẽ?"
 POD_predatorstories.1340.desc: "Ngươi hút máu bằng cách tống tiền và uy hiếp, một phương pháp hiệu quả trong hầu hết các trường hợp. Tuy nhiên, nó cũng khiến những phàm nhân dưới sự "bảo hộ" của ngươi luôn bồn chồn tìm cách thoát khỏi thỏa thuận mà ngươi đã ép buộc.\nMột trong những con mồi bị ngươi uy hiếp gần đây đã có được một khoản vàng. Đổi lại khoản tiền này, họ yêu cầu ngươi quên đi bí mật của họ và để họ yên."
 POD_predatorstories.1340.a: "Chúng ta có thỏa thuận."
 POD_predatorstories.1340.b: "Ta thích khoản thanh toán bằng máu hơn."
 POD_predatorstories.1340.c: "Ta muốn tất cả và muốn ngay bây giờ."
 POD_predatorstories.1340.d: "Họ có thể giữ lại một phần tiền và phục vụ ta thay vào đó."
 
 #Blackmailed victim tips off hunters
 POD_predatorstories.1350.t: "Hội Nhóm Hỗ Trợ"
 POD_predatorstories.1350.desc: "Ngươi hút máu bằng cách tống tiền và uy hiếp, một phương pháp hiệu quả trong hầu hết các trường hợp. Tuy nhiên, nó cũng khiến những phàm nhân dưới sự "bảo hộ" của ngươi luôn bồn chồn tìm cách thoát khỏi thỏa thuận mà ngươi đã ép buộc.\nTrong lúc tìm kiếm một trong những con mồi phàm nhân bị ngươi uy hiếp, ngươi bất ngờ bị nhiều thợ săn mang theo cọc gỗ vây hãm. Rõ ràng họ nghĩ rằng họ có thể thoát khỏi thỏa thuận mà ngươi đã ép buộc nếu ngươi gặp phải Cái Chết Cuối Cùng bất đắc kỳ tử. Đồ ngốc."
 POD_predatorstories.1350.a: "Hãy giải quyết đám thợ săn kia."
 POD_predatorstories.1350.b: "Để Dã Thú tiếp quản."
 
 POD_predatorstories.1350.a.success: "Chiến thắng dễ dàng"
 POD_predatorstories.1350.a.failure: "Chiến thắng gian nan"
 
 POD_predatorstories.1351.t: "Cuộc Viếng Thăm"
 POD_predatorstories.1351.desc: "Sau khi đánh bại đám thợ săn, ngươi tìm thấy một tờ giấy ghi rõ nơi phục kích ngươi. Tờ giấy gửi cho đám thợ săn mà ngươi nhận ra là từ một trong những phàm nhân bị ngươi uy hiếp. Rõ ràng họ đang cố khiến ngươi bị giết để thoát khỏi việc bị tống tiền.\nĐã đến lúc ghé thăm họ."
 POD_predatorstories.1351.a: "Hút máu như thường lệ nhưng khoan dung."
 POD_predatorstories.1351.b: "Vậy thì hãy chết vì mất máu."
 
 #Abundance of prey
 POD_predatorstories.1360.t: "Vùng Đất Trù Phú"
 POD_predatorstories.1360.desc: "Gần đây có nhiều động vật hoang dã trong lãnh địa của ngươi hơn bình thường. Ngươi không chắc nguyên nhân của sự thay đổi đáng mừng này nhưng nó khiến việc săn động vật để lấy máu trở nên dễ dàng và an toàn hơn bao giờ hết. Không cần phải đi sâu vào rừng khi ngươi có thể tìm thấy vô số con mồi ngay cả ở lối vào."
 POD_predatorstories.1360.a: "Ăn no say."
 
 #Animal victim fights back
 POD_predatorstories.1371.t: "Con Chim Giận Dữ"
 POD_predatorstories.1371.desc: "Săn động vật không phải lúc nào cũng là chuyện dễ dàng. Động vật không có tình cảm gì với ma cà rồng, và trong khi hầu hết sẽ bỏ chạy khi cảm nhận ngươi đến gần, một số sẽ cố gắng chống trả, thường dẫn đến những kết quả khó lường. Con gà trống này đặc biệt đã quyết định sẽ không chịu đựng sự hiện diện của ngươi thêm nữa.\nChà, chuyện này không nên là thử thách gì lớn."
 POD_predatorstories.1371.a: "Như lấy máu từ một con gà trống vậy."
 
 POD_predatorstories.1372.t: "Kẻ Được Sói Hôn"
 POD_predatorstories.1372.desc: "Săn động vật không phải lúc nào cũng là chuyện dễ dàng. Động vật không có tình cảm gì với ma cà rồng, và trong khi hầu hết sẽ bỏ chạy khi cảm nhận ngươi đến gần, một số sẽ cố gắng chống trả, thường dẫn đến những kết quả khó lường. Con sói này đặc biệt đã quyết định sẽ không chịu đựng sự hiện diện của ngươi thêm nữa.\nKhông phải là một thử thách khó khăn gì cho lắm."
 POD_predatorstories.1372.a: "Con chó hư!"
 POD_predatorstories.1372.b: "Chạy trốn!"
 
 POD_predatorstories.1372.a.success: "Ngươi dễ dàng đánh bại con sói"
 POD_predatorstories.1372.a.success.toast: "Chiến thắng!"
 POD_predatorstories.1372.a.failure: "Một chiến thắng bừa bộn"
 POD_predatorstories.1372.a.failure.toast: "Bị thương!"
 
 POD_predatorstories.1373.t: "Con Gấu Giận Dữ"
 POD_predatorstories.1373.desc: "Săn động vật không phải lúc nào cũng là chuyện dễ dàng. Động vật không có tình cảm gì với ma cà rồng, và trong khi hầu hết sẽ bỏ chạy khi cảm nhận ngươi đến gần, một số sẽ cố gắng chống trả, thường dẫn đến những kết quả khó lường. Con gấu này đặc biệt đã quyết định sẽ không chịu đựng sự hiện diện của ngươi thêm nữa.\nNhững con vật mạnh mẽ, không nên bị xem thường dù chúng không phải là đối thủ của hầu hết sức mạnh siêu nhiên của ma cà rồng."
 POD_predatorstories.1373.a: "Đôi tay gấu của ta sẽ đủ dùng."
 POD_predatorstories.1373.b: "Chạy trốn!"
 
 POD_predatorstories.1373.a.success: "Ngươi đánh bại con gấu"
 
 POD_predatorstories.1374.t: "Loài Gặm Nhấm Đáng Ghê Tởm"
 POD_predatorstories_sensebane.1374.desc: "Khi đang rình rập con mồi động vật, ngươi bất chợt phát hiện một con thỏ. Tuy nhiên có điều gì đó khác thường ở con vật này. Nó dường như bị bao quanh bởi máu và xác chết và chú ý đến ngươi.\nNhờ khả năng cao cấp đọc hào quang và phát hiện tà ác, ngươi biết con thỏ này bị một linh hồn tà linh chiếm hữu."
 POD_predatorstories.1374.desc: "Khi đang rình rập con mồi động vật, ngươi bất chợt phát hiện một con thỏ. Tuy nhiên có điều gì đó khác thường ở... con vật này? Nó dường như bị bao quanh bởi máu và xác chết và chú ý đến ngươi.\nĐó là con vật gặm nhấm ghê tởm, tàn ác và cáu kỉnh nhất mà ngươi từng thấy!"
 POD_predatorstories.1374.a: "Chà, đó không phải một con thỏ bình thường."
 POD_predatorstories.1374.b: "Con thỏ đó có một vệt hung dữ rộng cả dặm! Nó là một kẻ sát nhân!"
 POD_predatorstories.1374.c: "Ta sẽ trừ tà con vật ma quỷ này!"
  
 POD_predatorstories.1375.t: "Loài Gặm Nhấm Tàn Ác"
 POD_predatorstories.1375.desc: "Con thỏ giờ đang lao thẳng về phía ngươi, hàm răng như dao găm của nó giờ trở nên rõ ràng đến kinh hoàng. Nó có thể nhảy vọt. Hãy nhìn những khúc xương kia!\nRõ ràng là một sinh vật của chính Quỷ Dữ. Liệu ngươi có sống sót qua cuộc chạm trán khủng khiếp này không?"
 POD_predatorstories.1375.a: "Nó đang tiến về phía chúng ta!"
 
 POD_predatorstories.1375.a.success: "Một chiến thắng để đời!"
 POD_predatorstories.1375.a.failure: "Ngươi trốn chạy khỏi đứa con của địa ngục này"
 POD_predatorstories.1375.a.failure.toast: "Không bao giờ nữa"
 
 #Victim needs gold to purchase new cattle
 POD_predatorstories.1380.t: "Ân Nhân Đẫm Máu"
 POD_predatorstories.1380.desc: "Vì ngươi hút máu từ những người hiểu (ít nhất một phần) bản chất của ngươi, họ đã xem ngươi như một ân nhân tiềm năng cho gia đình họ để đổi lấy máu của họ. Điều này dẫn đến nhiều yêu cầu giúp đỡ có thể trở nên nhàm chán nhưng đảm bảo sự thịnh vượng cho [POD_herd|E] của ngươi trong tương lai. Một yêu cầu như vậy đã đến, dù ngươi không bận tâm nhớ chi tiết, nó liên quan đến việc họ cần vàng cho một công việc nông nghiệp nào đó." 
 POD_predatorstories.1380.a: "Ta sẽ giúp."
 POD_predatorstories.1380.b: "Tự lo liệu đi!"
 POD_predatorstories.1380.c: "Động vật vâng lời ta."
 
 #Victim is actually a Redcap
 POD_predatorstories.1390.t: "Chỉ Là Một Nạn Nhân Khác?"
 POD_predatorstories.1390.desc: "Đang rình rập tìm máu, ngươi phát hiện một ứng viên phù hợp để hút máu. Có điều gì đó khác thường ở họ không?... Không, chỉ là trí tưởng tượng của ngươi thôi. Máu của họ có vẻ đặc biệt hấp dẫn ngay cả từ chỗ ngươi đứng, như thể nó mang một phẩm chất "sáng bóng".\nĐã đến lúc phô ra nanh vuốt của ngươi."
 POD_predatorstories_auspexadvanced.1390.desc: "Đang rình rập tìm máu, nhờ khả năng nhìn thấu những gì kẻ khác không thể; Kỹ năng quan sát tinh tường của ngươi cho phép ngươi xác định rằng con mồi ngươi đã chọn thực chất là một [GetTrait('redcap').GetName( GetNullCharacter )] fae, không phải một ma cà rồng.\n\nNgươi biết rằng Redcap thường có xu hướng lao vào giao chiến và có thể phát hiện những gì vô hình; Ngươi cũng biết rằng hút máu một fae có khả năng sẽ gây ra vài tác dụng phụ."
 POD_predatorstories.1390.a: "Ngươi tiến về phía nạn nhân."
 POD_predatorstories.1390.b: "Có lẽ ta nên theo đuổi con mồi khác..."

 POD_predatorstories_auspexadvanced.1391.desc: "Dòng máu của nạn nhân ngươi dồn vào chân tường có vẻ đặc biệt hấp dẫn ngay cả từ chỗ ngươi đứng, như thể nó mang một phẩm chất "sáng bóng". Dã Thú trong ngươi lạ thường yên tĩnh, như thể đang cân nhắc liệu việc nuốt chửng sinh vật kỳ lạ này sẽ tốt hay xấu cho ngươi.\nGiờ ngươi đã đến gần hơn, con mồi của ngươi đã phát hiện ra ngươi và đã có tư thế hung hãn. Nếu ngươi không chạy trốn ngay bây giờ, ngươi sẽ phải chiến đấu."
 POD_predatorstories_kiasyd.1391.desc: "Giờ khi ngươi đã đến gần hơn, và là một [GetTrait('kiasyd').GetName( GetNullCharacter )], ngươi nhận ra nạn nhân của mình thực chất là một [GetTrait('redcap').GetName( GetNullCharacter )].\n\nNgươi biết rằng Redcap thường có xu hướng lao vào giao chiến và phát hiện những gì vô hình; Ngươi cũng biết rằng hút máu một fae có khả năng sẽ gây ra vài tác dụng phụ.\n\nTuy nhiên con mồi của ngươi đã phát hiện ra ngươi và đã có tư thế hung hãn. Nếu ngươi không chạy trốn ngay bây giờ, ngươi sẽ phải chiến đấu."
 POD_predatorstories_maeghar.1391.desc: "Giờ khi ngươi đã đến gần hơn, và là một [GetTrait('maeghar').GetName( GetNullCharacter )], ngươi nhận ra nạn nhân của mình thực chất là một [GetTrait('redcap').GetName( GetNullCharacter )].\n\nNgươi biết rằng Redcap thường có xu hướng lao vào giao chiến và phát hiện những gì vô hình; Ngươi cũng biết rằng hút máu một fae có khả năng sẽ gây ra vài tác dụng phụ.\n\nTuy nhiên con mồi của ngươi đã phát hiện ra ngươi và đã có tư thế hung hãn. Nếu ngươi không chạy trốn ngay bây giờ, ngươi sẽ phải chiến đấu."
 POD_predatorstories.1391.desc: "Khi ngươi dồn nạn nhân kỳ lạ của mình vào chân tường, Dã Thú trong ngươi lạ thường yên tĩnh, như thể đang cân nhắc liệu việc nuốt chửng sinh vật kỳ lạ này sẽ tốt hay xấu cho ngươi.\nGiờ ngươi đã đến gần hơn, ngươi nhận thấy nạn nhân của mình có ngoại hình khác thường, tuy nhiên ngươi không có thời gian để xử lý điều này vì con mồi của ngươi đã phát hiện ra ngươi và đã có tư thế hung hãn. Nếu ngươi không chạy trốn ngay bây giờ, ngươi sẽ phải chiến đấu."
 POD_predatorstories.1391.a: "Máu sáng bóng..."
 POD_predatorstories.1391.b: "Đây là một ý tưởng tồi..."
 
 POD_predatorstories.1391.a.success: "Ngươi đánh bại chúng"
 POD_predatorstories.1391.a.success.toast: "Máu sáng bóng!"
 POD_predatorstories.1391.a.failure: "Chúng đánh bại ngươi"
 POD_predatorstories.1391.a.failure.toast: "Lũ bươm bướm chết tiệt!"
 
 #Victim is actually a Sluagh
 POD_predatorstories.1401.t: "Trốn Tìm"
 POD_predatorstories.1401.desc: "Chỉ là một đêm săn mồi khác của ngươi cho đến khi có điều gì đó thu hút sự chú ý của ngươi. Có một thực thể ở gần đó mà ngươi không thể nhìn rõ, gần giống một ma cà rồng đang dùng Obfuscate nhưng cũng... khác biệt. Kẻ nào đó dò xét đầy khả nghi với năng lực kỳ lạ như vậy trong lãnh địa của ngươi chắc chắn đáng để điều tra."
 POD_predatorstories.1401.a: "Nhìn kỹ thêm lần nữa"
 POD_predatorstories.1401.b: "Dùng auspex để thấy điều vô hình"
 
 POD_predatorstories.1401.a.success: "Tìm thấy ngươi rồi!"
 POD_predatorstories.1401.a.failure: "Chẳng có gì cả..."

 POD_predatorstories.1402.desc: "Ngươi đã tìm thấy chúng và chúng quả thực... khác biệt. Một thứ ngươi chưa từng thấy trước đây và máu của chúng thì... sáng bóng? Dã Thú trong ngươi lạ thường yên tĩnh, như thể đang cân nhắc liệu ngươi có nên nuốt chửng thực thể kỳ lạ này hay không. Dù sao đi nữa, giờ khi chúng đã bị phát hiện, ngươi sắp trải qua một cuộc chạm trán kỳ lạ."
 POD_predatorstories_auspexadvanced.1402.desc: "Nhờ khả năng nhìn thấu những gì kẻ khác không thể; Kỹ năng quan sát tinh tường của ngươi cho phép ngươi xác định rằng con mồi ngươi đã chọn thực chất là một [GetTrait('sluagh').GetName( GetNullCharacter )] fae, không phải một [GetTrait('vampire').GetName( GetNullCharacter )].\n\n[GetTrait('sluagh').GetName( GetNullCharacter )] thường có xu hướng cố tránh xung đột và phát hiện những gì vô hình.\n\nNgươi biết rằng hút máu một fae có khả năng sẽ gây ra vài tác dụng phụ."
 POD_predatorstories.1402.a: "Bắt được ngươi rồi!"
 POD_predatorstories.1402.b: "Có lẽ ta nên theo đuổi con mồi khác..."
 
 POD_predatorstories.1403.t: "Bị Phát Hiện!"
 POD_predatorstories_auspexadvanced.1403.desc: "[GetTrait('sluagh').GetName( GetNullCharacter )] giật lùi lại đầy hoảng hốt và yêu cầu đổi lấy chút vàng để ngươi để họ yên.\nDòng máu sáng bóng kỳ lạ, phi trần thế của họ vẫn gọi mời ngươi, khiến Dã Thú trong ngươi tự hỏi nó sẽ có vị gì..."
 POD_predatorstories_kiasyd.1403.desc: "Giờ khi ngươi đã đến gần hơn, và là một [GetTrait('kiasyd').GetName( GetNullCharacter )], ngươi nhận ra nạn nhân của mình thực chất là một [GetTrait('sluagh').GetName( GetNullCharacter )], không phải một [GetTrait('vampire').GetName( GetNullCharacter )].\n\n[GetTrait('sluagh').GetName( GetNullCharacter )] thường có xu hướng cố tránh xung đột và phát hiện những gì vô hình.\n\nNgươi biết rằng hút máu một fae có khả năng sẽ gây ra vài tác dụng phụ."
 POD_predatorstories_maeghar.1403.desc: "Giờ khi ngươi đã đến gần hơn, và là một [GetTrait('maeghar').GetName( GetNullCharacter )], ngươi nhận ra nạn nhân của mình thực chất là một [GetTrait('sluagh').GetName( GetNullCharacter )], không phải một [GetTrait('vampire').GetName( GetNullCharacter )].\n\n[GetTrait('sluagh').GetName( GetNullCharacter )] thường có xu hướng cố tránh xung đột và phát hiện những gì vô hình.\n\nNgươi biết rằng hút máu một fae có khả năng sẽ gây ra vài tác dụng phụ."
 POD_predatorstories.1403.desc: "Giờ khi ngươi đã đến gần hơn, ngươi nhận thấy nạn nhân của mình có ngoại hình khác thường đối với một ma cà rồng.\n\nHọ giật lùi lại đầy hoảng hốt và yêu cầu đổi lấy chút vàng để ngươi để họ yên. Dòng máu kỳ lạ, phi trần thế của họ vẫn gọi mời ngươi, khiến Dã Thú trong ngươi tự hỏi nó sẽ có vị gì..."
 POD_predatorstories.1403.a: "Chúng ta có thỏa thuận."
 POD_predatorstories.1403.b: "Máu sáng bóng!"
 
 POD_predatorstories.1404.t: "Quay Lại Đây!"
 POD_predatorstories_auspexadvanced.1404.desc: "Khi từ chối lời đề nghị của họ, [GetTrait('sluagh').GetName( GetNullCharacter )] hoảng loạn và bỏ chạy với tốc độ đáng kinh ngạc. Rõ ràng họ rất thành thạo trong việc chạy trốn và ẩn nấp, và ngươi sẽ phải gắng sức cùng vốn hiểu biết về khu vực để bắt được họ (và quan trọng nhất là dòng máu sáng bóng của họ, như Dã Thú vui lòng nhắc nhở ngươi)."
 POD_predatorstories_kiasyd.1404.desc: "Khi từ chối lời đề nghị của họ, [GetTrait('sluagh').GetName( GetNullCharacter )] hoảng loạn và bỏ chạy với tốc độ đáng kinh ngạc. Rõ ràng họ rất thành thạo trong việc chạy trốn và ẩn nấp, và ngươi sẽ phải gắng sức cùng vốn hiểu biết về khu vực để bắt được họ (và quan trọng nhất là dòng máu sáng bóng của họ, như Dã Thú vui lòng nhắc nhở ngươi)."
 POD_predatorstories_maeghar.1404.desc: "Khi từ chối lời đề nghị của họ, [GetTrait('sluagh').GetName( GetNullCharacter )] hoảng loạn và bỏ chạy với tốc độ đáng kinh ngạc. Rõ ràng họ rất thành thạo trong việc chạy trốn và ẩn nấp, và ngươi sẽ phải gắng sức cùng vốn hiểu biết về khu vực để bắt được họ (và quan trọng nhất là dòng máu sáng bóng của họ, như Dã Thú vui lòng nhắc nhở ngươi)."
 POD_predatorstories.1404.desc: "Khi từ chối lời đề nghị của họ, nạn nhân hoảng loạn và bỏ chạy với tốc độ đáng kinh ngạc. Rõ ràng họ rất thành thạo trong việc chạy trốn và ẩn nấp, và ngươi sẽ phải gắng sức cùng vốn hiểu biết về khu vực để bắt được họ (và quan trọng nhất là dòng máu sáng bóng của họ, như Dã Thú vui lòng nhắc nhở ngươi)."
 POD_predatorstories.1404.a: "Đuổi theo chúng!"
 POD_predatorstories.1404.j: "Đuổi theo chúng thật quá phiền phức"
 
 POD_predatorstories.1404.a.success: "Bắt được rồi!"
