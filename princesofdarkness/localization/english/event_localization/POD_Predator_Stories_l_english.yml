l_english:

 #Multi Use
 POD_predatorstories_artifact: "[newly_created_artifact.GetName]"
 POD_predatorstories_beast_takeover_tooltip: "Dã Thú đang phẫn cuồng của ngươi sẽ đưa ngươi tới nơi an toàn"

 vampire_attacks_on_domain_modifier: "Lãnh địa đang bị Ma cà rồng tấn công"
 weak_fae_curse_modifier: "Lời nguyền Fae Yếu"
 strong_fae_curse_modifier: "Lời nguyền Fae Mạnh"
 drunkard_intoxicated_modifier: "Cảm giác Tuyệt vời"
 intoxicated_modifier: "Cảm giác Say"

 #Victim fights back
 POD_predatorstories.1010.t: "Con Mồi Ngang Ngạnh"
 POD_predatorstories.1010.bloodleech.t: "Miếng Mồi Ngang Ngạnh"
 POD_predatorstories.1010.desc: "hiếm khi mục tiêu của một cuộc hút máu ma cà rồng lại có thể chống trả. Nanh xuyên qua da thịt gây ra một cảm giác ngây ngất (được gọi là "nụ hôn") khiến hầu hết nạn nhân trở nên ngoan ngoãn. Tất nhiên vẫn luôn có ngoại lệ, có thể do ý chí đặc biệt kiên cường hoặc do một tác động bên ngoài phá vỡ trạng thái mê hoặc đó.\nĐêm nay là một trong những trường hợp hiếm hoi ấy, con mồi mà ngươi nhắm tới đang cố chống cự ngươi. Dù không phải mối đe dọa thực sự với một kẻ có sức mạnh như ngươi, nhưng tiếng kêu cứu của họ có thể thu hút sự chú ý không mong muốn."
 POD_predatorstories.1010.a: "Bịt miệng chúng lại"
 POD_predatorstories.1010.c: "Chúng không đáng"
 
 POD_predatorstories.1010.a.success: "Đã bịt miệng"
 POD_predatorstories.1010.a.success.toast: "Chúng chưa từng có cơ hội"
 POD_predatorstories.1010.a.failure: "Đừng có gào lên nữa!"
 POD_predatorstories.1010.a.failure.toast: "Bị đánh bại bởi một phàm nhân?!"
 POD_predatorstories.1010.b.failure.toast: "Thật đáng xấu hổ..."
 
 #Victim is a hunter
 POD_predatorstories.1020.t: "Con Mồi Săn Mồi"
 POD_predatorstories.1020.desc: "Chỉ là một đêm khác với một nạn nhân khác để rút máu từ đó... cho tới khi ngươi nhận ra có những kẻ khác đang ẩn nấp trong bóng tối. Hóa ra "nạn nhân" của ngươi đã có sự chuẩn bị, rất có thể là thành viên của một nhóm thợ săn địa phương đã nghiên cứu thói quen săn mồi của ngươi.\nMay mắn thay ngươi đã phát hiện ra cuộc phục kích của họ trước khi tình thế trở nên thực sự nguy hiểm, cho ngươi đủ thời gian để phản ứng. Dù vậy, một cuộc chiến kéo dài có thể khiến bản chất thật của ngươi bị phơi bày trước nhiều người hơn ngươi mong muốn." 
 
 POD_predatorstories.1020.a.success.toast: "Chúng chẳng bao giờ rút ra bài học"
 POD_predatorstories.1020.a.failure.toast: "Nguyền rủa ngươi!"
 
 #Victim is a vampire
 POD_predatorstories.1030.t: "Bốn Chiếc Nanh"
 POD_predatorstories.1030.desc: "Đã một thời gian ngươi truy lùng con mồi để đáp ứng nhu cầu máu trong đêm. Chúng đặc biệt thận trọng, gần như biết cách xoay xở trong đêm tối chẳng kém gì ngươi, và điều đó đã khơi dậy sự tò mò của ngươi.\nSau một hồi rượt đuổi, "con mồi" của ngươi cuối cùng dồn ngươi vào chân tường, để lộ ra rằng đó là một ma cà rồng. Chúng nghĩ ngươi đang theo dõi chúng để thực hiện diablerie, và hoàn toàn dễ hiểu khi chúng khá nghi ngờ lời giải thích của ngươi về sự hiểu lầm này."
 POD_predatorstories.1030.a: "Cố gắng giải quyết tình huống một cách hòa bình"
 POD_predatorstories.1030.c: "Phớt lờ chúng"
 
 POD_predatorstories.1030.a.success: "Ngươi hóa giải tình huống"
 POD_predatorstories.1030.a.success.toast: "Đã xoa dịu"
 POD_predatorstories.1030.a.failure: "Ngươi không thể hóa giải tình huống"
 POD_predatorstories.1030.a.failure.tooltip: "Đành phải dùng đến nanh vuốt"
 
 POD_predatorstories.1030.b.failure: "Chúng đánh bại ngươi"
 POD_predatorstories.1030.b.failure.toast: "Màn trình diễn đáng xấu hổ"
 
 POD_predatorstories.1031.t: "Tình Thế Leo Thang"
 POD_predatorstories.1031.desc: "Lời giải thích của ngươi chỉ khiến chúng thêm nghi ngờ về ý đồ của ngươi. Khi ngươi bắt đầu bực bội vì bế tắc này, ngươi bỗng nhận thấy một ánh mắt lóe lên trong mắt chúng. Chúng đang chuẩn bị tấn công ngươi.\nDù không phải mối đe dọa lớn với sức mạnh của ngươi, chúng vẫn là một ma cà rồng và có thể gây ra vài tổn hại đáng xấu hổ nếu ngươi không cẩn thận. Tốt nhất nên kết thúc chuyện này thật nhanh."
 POD_predatorstories.1031.a: "Đồ ngốc!"
 
 POD_predatorstories.1031.a.success: "Ngươi đánh bại chúng"
 POD_predatorstories.1031.a.success.toast: "Nanh vuốt đã thắng thế"
 POD_predatorstories.1031.a.failure: "Suýt nữa thì"
 POD_predatorstories.1031.a.failure.toast: "Chúng suýt hạ được ngươi!"
 
 #Adult witness
 POD_predatorstories.1040.t: "Nhân Chứng Hung Hãn"
 POD_predatorstories.1040.desc: "Việc hút máu từ phàm nhân có thể trở nên khá thường lệ sau một thời gian. Dù đã là tay lão luyện trong việc này, sự thiếu hào hứng trong cuộc săn có thể dẫn tới vài sự cố đáng xấu hổ. Đêm nay là một trường hợp như vậy khi ngươi nhận thấy một phàm nhân ở khóe mắt đang kinh hãi vì bắt gặp ngươi lúc đang say sưa rút máu nạn nhân."
 POD_predatorstories.1040.a: "Để mặc chúng"
 POD_predatorstories.1040.c: "#beast Người chết không kể chuyện#!"
 POD_predatorstories.1040.d: "Ta có đúng năng lực cần thiết"
 POD_predatorstories.1040.d.tooltip: "Rõ ràng họ đã uống quá nhiều."
 POD_predatorstories.1040.e: "Chúng sẽ không kể chuyện này cho ai"
 POD_predatorstories.1040.e.tooltip: "Chúng chưa từng thấy ngươi. Thực ra chúng chưa từng ở đây."
 
 POD_predatorstories.1040.a.toast: "Một con quái vật!"
 POD_predatorstories.1040.b.toast: "Một con quỷ dữ!"
 
 #Child witness
 POD_predatorstories.1050.t: "Trông Trẻ Ban Đêm"
 POD_predatorstories.1050.desc: "Việc hút máu từ phàm nhân có thể trở nên khá thường lệ sau một thời gian. Dù đã là tay lão luyện trong việc này, sự thiếu hào hứng trong cuộc săn có thể dẫn tới vài sự cố đáng xấu hổ. Đêm nay là một trường hợp như vậy khi ngươi nhận thấy một đứa trẻ ở khóe mắt đang kinh hãi vì bắt gặp ngươi lúc đang say sưa rút máu nạn nhân."
 POD_predatorstories.1050.c: "#beast Con quái vật dưới gầm giường là có thật#!"
 POD_predatorstories.1050.d.tooltip: "Chỉ là một cơn ác mộng thôi"
 
 #Hunter interference
 POD_predatorstories.1060.t: "Sự Can Thiệp của Thợ Săn"
 POD_predatorstories.1060.desc: "Do một vài ma cà rồng bất cẩn trong vùng, một nhóm trai tráng địa phương đã lập nên một kiểu dân quân thợ săn để tìm kiếm những "quái vật" săn mồi cộng đồng họ trong đêm tối. Dù chỉ là mối đe dọa nhỏ, chúng vẫn là một sự phiền toái khi ngươi đi săn."
 POD_predatorstories.1060.a: "Ngươi cố gắng lẩn tránh chúng và bắt lấy con mồi"
 POD_predatorstories.1060.a.tooltip: "Ngươi chỉ là một cái bóng và vẫn bắt được con mồi"
 POD_predatorstories.1060.b: "Bỏ cuộc săn"
 
 POD_predatorstories.1060.a.success: "Chúng chẳng thấy gì"
 POD_predatorstories.1060.a.success.toast: "Im lặng như cái chết"
 POD_predatorstories.1060.a.failure: "Chúng phát hiện ra ngươi!"
 POD_predatorstories.1060.a.failure.tooltip: "Nơi sự lén lút thất bại... đành phải dùng đến nanh vuốt"
 POD_predatorstories.1060.a.failure.success.toast: "Ngươi đánh bại thợ săn nhưng con mồi đã trốn thoát"
 POD_predatorstories.1060.a.failure.failure.toast: "Chúng suýt giết được ngươi!"
 
 POD_predatorstories.1061.t: "!"
 POD_predatorstories.1061.desc: "Bất chấp mọi nỗ lực của ngươi, nhóm thợ săn nghiệp dư địa phương này đã phát hiện ra ngươi trước khi ngươi kịp rút cạn nạn nhân dự định. Khi chúng lao về phía ngươi trong lúc hô hào tiếp viện, ngươi nhanh chóng nhận ra mình phải giải quyết chúng thật nhanh, nếu không sẽ phải kéo dài chuyện này trong một khoảng thời gian khó chịu."
 POD_predatorstories.1061.a: "Chào mừng đến cuộc săn cuối cùng của ngươi"
 POD_predatorstories.1061.a.success: "Nhanh gọn và hiệu quả"
 POD_predatorstories.1061.a.success.toast: "Chúng chẳng bao giờ rút ra bài học"
 POD_predatorstories.1061.a.failure: "Chậm chạp và bừa bộn"
 POD_predatorstories.1061.a.failure.toast: "Thật là một mớ hỗn độn"
 
 #Vampire poaches prey
 POD_predatorstories.1070.t: "Kẻ Săn Trộm Bất Tử"
 POD_predatorstories.1070.desc: "Là chủ nhân của lãnh địa này, ngươi mong đợi những kẻ mới đến sẽ ra mắt ngươi trước khi săn mồi trên vùng đất săn của ngươi. Dù hầu hết đều có ý thức tốt để làm đúng như vậy, nhưng luôn có vài kẻ ngạo mạn (hoặc ngu ngốc) nghĩ rằng chúng có thể phớt lờ ngươi.\nMột kẻ hư hỏng như vậy đã bị phát hiện và ngươi quyết định tự tay xử lý chúng, dạy cho cái đầu ngu ngốc của kẻ xâm phạm này một bài học về phép tắc."
 POD_predatorstories.1070.a: "Học biết vị trí của ngươi"
 POD_predatorstories.1070.b: "Hừ, ta không quan tâm"
 
 POD_predatorstories.1070.a.success: "Ngươi có thể quỳ xuống"
 POD_predatorstories.1070.a.success.toast: "Quỳ thấp hơn nữa"
 POD_predatorstories.1070.a.failure: "Sao ngươi dám!"
 POD_predatorstories.1070.a.failure.toast: "Sao chúng dám!"
 
 #Victim wants to be lover
 POD_predatorstories.1080.t: "Chuyện Tình Chạng Vạng"
 POD_predatorstories.1080.desc: "Khi tìm kiếm máu, lựa chọn dễ dàng nhất đôi khi là dùng lại cùng một phàm nhân. Hành động hút máu (nụ hôn) mang lại khoái cảm mãnh liệt cho họ, và nhiều người chẳng mong gì hơn là được trải nghiệm lại nó.\nMột phàm nhân như vậy đã là mục tiêu của ngươi suốt một thời gian và gần như bị mê hoặc bởi nhu cầu làm hài lòng ngươi. Họ có thể trở thành một người sưởi giường ngoan ngoãn nếu đó là điều ngươi đang tìm kiếm."
 POD_predatorstories.1080.a: "Đến phòng khách của ta..."
 POD_predatorstories.1080.b: "Đừng có mơ!"
 POD_predatorstories.1080.c: "#beast Lại gần...hơn nữa#!"
 
 #Victim has gold (Not a gift)
 POD_predatorstories.1090.t: "Vàng Con Mồi"
 POD_predatorstories.1090.desc: "Đêm nay là một đêm săn mồi bình thường, ngoại trừ một điều nhỏ. Nạn nhân của ngươi mang theo một lượng vàng đáng ngạc nhiên. Việc lấy đi số vàng đó chỉ là chuyện nhỏ, nhưng liệu ngươi, một sinh vật quyền năng của bóng đêm, có thực sự sa vào trò trộm cắp tầm thường hay không?"
 POD_predatorstories.1090.a: "Đúng vậy, ta sẽ làm"
 POD_predatorstories.1090.b: "Đó sẽ là một tội lỗi!"
 POD_predatorstories.1090.c: "Ta cao quý hơn thế"
 
 #Victim has artifact (Not a gift)
 POD_predatorstories.1100.t: "Đồ Vật Sáng Bóng"
 POD_predatorstories.1100.desc: "Đêm nay là một đêm săn mồi bình thường, ngoại trừ một điều nhỏ. Nạn nhân của ngươi mang theo một món đồ trang sức đắt tiền đến bất ngờ. Việc lấy đi món đồ đó chỉ là chuyện nhỏ, nhưng liệu ngươi, một sinh vật quyền năng của bóng đêm, có thực sự sa vào trò trộm cắp tầm thường hay không?"
 POD_predatorstories.1100.a: "Ta ngửi thấy mùi tiền"
 POD_predatorstories.1100.b: "Một món đồ trang trí tường mới"
 POD_predatorstories.1100.c: "[newly_created_artifact.GetName] sẽ hữu ích"
 
 #Victim has gold (Gift)
 POD_predatorstories.1110.t: "Món Quà Đẫm Máu"
 POD_predatorstories.1110.desc: "Ngươi đã vun đắp mối quan hệ với những phàm nhân là nguồn hút máu ưa thích của mình suốt một thời gian. Hầu hết trong số họ giờ đã bị mê hoặc hoàn toàn, coi ngươi như một ân nhân cần làm hài lòng, thậm chí như một vị thần. Điều này gần đây đã được đền đáp khi một trong số họ dâng tặng ngươi một món quà, hy vọng làm ngươi hài lòng với món quà khiêm tốn này."
 POD_predatorstories.1110.a: "Quả là "khiêm tốn""
 POD_predatorstories.1110.b: "Điều này gần như là một sự sỉ nhục"
 POD_predatorstories.1110.c: "Ta không bận tâm những chuyện vật chất như vậy"
 
 #Victim has artifact (Gift)
 POD_predatorstories.1120.a: "Bán nó đi"
 POD_predatorstories.1120.b: "Trưng bày nó"
 POD_predatorstories.1120.d: "Nó có thể hữu ích"
 
 #The victim dies during the feeding
 POD_predatorstories.1130.t: "Cơn Phẫn Cuồng Hút Máu"
 POD_predatorstories.1130.desc: "Việc hút máu là một cảm giác vô cùng khoái lạc đối với ma cà rồng. Máu chính là sự sống của chúng, và cám dỗ muốn lấy thêm một chút luôn hiện hữu. Ngay cả những đứa con lịch thiệp nhất của Cain cũng không phải lúc nào cũng cưỡng lại được bản chất nguyên thủy của mình. Khi điều này xảy ra, thường thì đã quá muộn trước khi con ma cà rồng lấy lại được sự kiểm soát giác quan, và họ nhận ra mình đang ôm một nạn nhân đã chết, bị rút cạn đến giọt máu cuối cùng."
 POD_predatorstories_conscious.1130.a: "Ta đã làm gì thế này?"
 POD_predatorstories_conviction.1130.a: "Thì sao?"
 
 #The victim is very ill
 POD_predatorstories.1140.t: "Ma Cà Rồng Dịch Bệnh"
 POD_predatorstories.1140.desc: "Bệnh tật của phàm nhân không ảnh hưởng nhiều đến ma cà rồng, ngoại trừ việc khiến trải nghiệm hút máu kém dễ chịu hơn. Tệ nhất, chúng có thể trở thành vật mang mầm bệnh và lây lan sang những phàm nhân khác khi hút máu, nhưng bản thân chúng không bị ảnh hưởng.\nDù vậy, khi ngươi nhận thấy nạn nhân của mình có dấu hiệu bệnh tật, ngươi cân nhắc bước đi tiếp theo. Lấy thêm máu từ họ có khả năng sẽ khiến họ chết."
 POD_predatorstories.1140.a: "Để mặc họ"
 POD_predatorstories.1140.b: "Ta có thể giúp họ"
 POD_predatorstories.1140.c: "Dùng năng lực của valeren để chữa lành cho họ"
 POD_predatorstories.1140.d: "Ta sẽ hút máu thật cẩn thận"
 POD_predatorstories.1140.e: "#beast Ta đòi thêm máu!#!"
 POD_predatorstories.1140.f: "Biến họ thành bộc huyết và hút máu"
 
 POD_predatorstories.1140.d.toast: "Có lẽ họ sẽ sớm chết vì ngươi"
 
 #Victim Flees
 POD_predatorstories.1150.t: "Con Chuột Bỏ Trốn"
 POD_predatorstories.1150.desc: "Đôi khi phàm nhân khiến ngươi bất ngờ. Khi ngươi đang chọn mục tiêu cho cuộc săn đêm nay, một trong số họ nhận thấy điều gì đó trong mắt ngươi (có lẽ là nỗi sợ hãi bản năng của con mồi trước kẻ săn mồi?) và bỏ chạy về phía lối ra. Đuổi theo họ có thể khá thú vị."
 POD_predatorstories.1150.a: "Chạy trong lúc còn có thể..."
 POD_predatorstories.1150.c: "Để mặc kẻ phàm nhân đang khiếp sợ."
 
 POD_predatorstories.1151.t: "Con Chuột Bị Dồn Vào Chân Tường"
 POD_predatorstories.1151.desc: "Với tốc độ siêu nhiên của ngươi, kẻ phàm nhân này không có cơ hội nào. Giờ khi ngươi đã đuổi kịp, họ cầu xin ngươi tha mạng. Dù điều đó cũng chẳng còn quan trọng vì họ đã hoàn toàn nằm trong tay ngươi."
 POD_predatorstories.1151.a: "Tha cho họ"
 POD_predatorstories.1151.c: "Máu của nỗi sợ hãi..."
 POD_predatorstories.1151.e: "Cuộc săn đã kết thúc"
 
 POD_predatorstories.1151.a.toast: "Ngươi thể hiện lòng khoan dung bất chấp rủi ro với Luật Che Giấu"
 POD_predatorstories.1151.c.toast: "Ngươi thể hiện lòng khoan dung sau khi hút máu bất chấp rủi ro với Luật Che Giấu"
 
 POD_predatorstories.1152.desc: "Với tốc độ siêu nhiên của ngươi, kẻ phàm nhân này không có cơ hội nào. Họ hoàn toàn không biết ngươi đã đuổi kịp và giờ đang cố lấy lại hơi thở trong khi nghĩ rằng mình đã an toàn. Dù điều đó cũng chẳng còn quan trọng vì giờ họ đã hoàn toàn nằm trong tay ngươi."
 
 #Victim needs gold to clear debts
 POD_predatorstories.1160.t: "Vàng Đỏ Thẫm"
 POD_predatorstories_consensualist.1160.desc: "Làm việc với những phàm nhân sẵn lòng hiến máu cho ngươi mang lại nhiều lợi thế cho những ma cà rồng không tìm kiếm cảm giác hồi hộp của cuộc săn. Tuy vậy, nó cũng đặt ra những vấn đề riêng, như phải quan tâm đến phúc lợi của họ để họ ở trong tình trạng có thể tiếp tục giúp đỡ ngươi.\nMột trong những người hiến máu tự nguyện của ngươi đang gặp vấn đề tài chính nghiêm trọng. Nếu ngươi không giúp đỡ, họ chắc chắn sẽ bị đánh đập hoặc thậm chí tệ hơn, điều này có thể khiến họ rời khỏi mạng lưới của ngươi, có lẽ là vĩnh viễn."
 POD_predatorstories_familias.1160.desc: "Làm việc với những phàm nhân sẵn lòng hiến máu cho ngươi mang lại nhiều lợi thế cho những ma cà rồng không tìm kiếm cảm giác hồi hộp của cuộc săn. Tuy vậy, nó cũng đặt ra những vấn đề riêng, như phải quan tâm đến phúc lợi của họ để họ ở trong tình trạng có thể tiếp tục giúp đỡ ngươi.\nMột trong những gia đình mà ngươi hút máu đang gặp vấn đề tài chính nghiêm trọng. Nếu ngươi không giúp đỡ, họ chắc chắn sẽ bị đánh đập hoặc thậm chí tệ hơn, điều này có thể khiến họ rời khỏi mạng lưới của ngươi, có lẽ là vĩnh viễn."
 POD_predatorstories_cultist.1160.desc: "Làm việc với những phàm nhân sẵn lòng hiến máu cho ngươi mang lại nhiều lợi thế cho những ma cà rồng không tìm kiếm cảm giác hồi hộp của cuộc săn. Tuy vậy, nó cũng đặt ra những vấn đề riêng, như phải quan tâm đến phúc lợi của họ để họ ở trong tình trạng có thể tiếp tục giúp đỡ ngươi.\nMột trong những tín đồ giáo phái của ngươi đang gặp vấn đề tài chính nghiêm trọng. Nếu ngươi không giúp đỡ, họ chắc chắn sẽ bị đánh đập hoặc thậm chí tệ hơn, điều này có thể khiến họ rời khỏi mạng lưới của ngươi, có lẽ là vĩnh viễn."
 POD_predatorstories.1160.a: "Ta là một ân nhân hào phóng."
 POD_predatorstories.1160.b: "Tự giải quyết vấn đề của ngươi đi!"
 POD_predatorstories.1160.c: "Ta nghĩ ta biết chủ nợ của ngươi..."
 POD_predatorstories.1160.d: "Họ sẽ quên chuyện này." 
 POD_predatorstories.1160.e: "Đã đến lúc thay đổi diện mạo của ngươi."
 POD_predatorstories.1160.f: "Ta sẽ dàn xếp mọi chuyện êm thấm."
 POD_predatorstories.1160.g: "Đã đến lúc để họ đổ máu."
 
 #Victim hires or performs attempted exorcism on vampire
 POD_predatorstories.1170.t: "Con Quỷ Mang Nanh"
 POD_predatorstories.1170.desc: "Dù hầu hết phàm nhân có thể bản năng nhận ra ngươi không phải một trong số họ, ít ai thực sự hiểu được ngươi thực chất là gì. Vì vậy, nhiều người dùng đến cách phân loại khá chung chung là "quỷ dữ"... điều này khiến ngươi thấy buồn cười hơn là ngạc nhiên khi nghe rằng vài kẻ tự xưng là thầy trừ tà đang tìm kiếm ngươi. Bản thân chuyện này không đáng lo ngại lắm, nhưng luôn có nguy cơ những kẻ ngốc nghếch này sẽ thu hút sự chú ý của những thợ săn tài giỏi và nguy hiểm hơn."
 POD_predatorstories.1170.a: "Những lời đồn đại vô hại thôi."
 POD_predatorstories.1170.b: "Trừ tà đi này!"
 POD_predatorstories.1170.c: "Khiến chúng quên đi."
 
 #Vampire attacks on your cult/family/consensual partners
 POD_predatorstories.1180.t: "Bảo Vệ Đàn Của Ngươi"
 POD_predatorstories.1180.desc: "Hầu hết ma cà rồng tôn trọng quyền uy của ngươi và biết rằng [POD_herd|E] của ngươi hoàn toàn cấm động vào. "Hầu hết" tuy nhiên không có nghĩa là tất cả. Một kẻ hư hỏng như vậy gần đây, hoặc vì thách thức hoặc vì ngu ngốc, đã lấy máu từ những phàm nhân của ngươi. Cần phải làm gương."
 POD_predatorstories.1180.a: "Có đủ máu cho tất cả mọi người."
 POD_predatorstories.1180.b: "Sao chúng dám!"
 POD_predatorstories.1180.c: "Ta sẽ nghiền nát tâm trí chúng."
 
 POD_predatorstories.1180.b.success: "Công lý đã được thực thi"
 POD_predatorstories.1180.b.failure: "Chúng đã trốn thoát!"
 
 #Mortal interference
 POD_predatorstories.1191.t: "Sự Can Thiệp Của Phàm Nhân"
 POD_predatorstories_alleycat.1191.desc: "Đang rình rập tìm máu, ngươi không may bị phát hiện và sau đó bị chặn lại bởi giọng nói của một người trong đội tuần tra đêm. "Ơ! Ngươi kia, ngươi đang làm gì ngoài đường vào giờ này. Để ta nói cho ngươi biết, ta sẽ để ngươi đi kèm một lời cảnh cáo nếu ngươi đóng góp cho quỹ..." hắn dừng lại và tằng hắng "quỹ bảo trợ"."
 POD_predatorstories_bedlamite.1191.desc: "Trong lúc rình rập tìm máu tại nhà thương điên, ngươi không may bị phát hiện và sau đó bị chặn lại bởi giọng nói của một nhân viên nhà thương điên cùng với lính gác. "Chúng đang xâm nhập trái phép vào khu đất nhà thương điên, đuổi chúng đi." Đám lính gác nhìn ngươi đầy đe dọa khi tay họ đưa về phía chuôi vũ khí." 
 POD_predatorstories_cauchemar.1191.desc: "Đang rình rập tìm máu, ngươi không may bị phát hiện và sau đó bị chặn lại bởi giọng nói của một người trong đội tuần tra đêm. "Ơ! Ngươi kia, ngươi đang làm gì ngoài đường vào giờ này. Để ta nói cho ngươi biết, ta sẽ để ngươi đi kèm một lời cảnh cáo nếu ngươi đóng góp cho quỹ..." hắn dừng lại và tằng hắng "quỹ bảo trợ"."
 POD_predatorstories_cenobite.1191.desc: "Trong lúc rình rập tìm máu tại tu viện, ngươi không may bị phát hiện và sau đó bị chặn lại bởi giọng nói của một cư dân tu viện cùng với lính gác. "Chúng đang xâm nhập trái phép vào khu đất tu viện, hãy đưa chúng ra khỏi nơi thánh thiêng này." Đám lính gác nhìn ngươi đầy đe dọa khi tay họ đưa về phía chuôi vũ khí."
 POD_predatorstories_footpad.1191.desc: "Đang rình rập tìm máu, ngươi không may bị phát hiện và sau đó bị chặn lại bởi giọng nói của một người trong đội tuần tra đêm. "Ơ! Ngươi kia, ngươi đang làm gì ngoài đường vào giờ này. Để ta nói cho ngươi biết, ta sẽ để ngươi đi kèm một lời cảnh cáo nếu ngươi đóng góp cho quỹ..."  hắn dừng lại và tằng hắng "quỹ bảo trợ"."
 POD_predatorstories_gentry.1191.desc: "Đang rình rập tìm máu tại một buổi tiệc riêng của giới quý tộc, một cặp vệ sĩ dường như tin rằng ngươi đã lén lút xâm nhập vào buổi tiệc nên đã tiến lên chặn đường ngươi. Một trong hai vệ sĩ lên tiếng "Đây là sự kiện riêng của các quý ngài, trình thiệp mời hoặc bị trục xuất bằng vũ lực"" 
 POD_predatorstories_graverobber.1191.desc: "Trong lúc rình rập tìm máu tại nghĩa trang, ngươi không may bị phát hiện và sau đó bị chặn lại bởi giọng nói của người trông coi nghĩa trang cùng với lính tuần đêm. "Chúng đang xâm phạm nghĩa trang này vào giờ này, bắt giữ chúng". Đám lính tuần đêm nhìn ngươi đầy đe dọa khi tay họ đưa về phía chuôi vũ khí."
 POD_predatorstories_phlebotomist.1191.desc: "Trong lúc rình rập tìm máu tại bệnh viện, ngươi không may bị phát hiện và sau đó bị chặn lại bởi giọng nói của một nhân viên bệnh viện cùng với lính gác. "Chúng đang xâm nhập trái phép vào khu đất bệnh viện, đuổi chúng đi". Đám lính gác nhìn ngươi đầy đe dọa khi tay họ đưa về phía chuôi vũ khí."
 POD_predatorstories_siren.1191.desc: "Có vẻ như tay trùm tội phạm địa phương đã để ý đến những cuộc theo đuổi tình ái có vẻ như của ngươi; Khi đang rình rập tìm máu tại quán rượu náo nhiệt địa phương, ngươi đã bị chặn lại bởi giọng nói của một trong hai tên côn đồ "Này cưng, cái quán này và mọi thứ làm việc trong đó đều là tài sản của ông chủ, trả tiền hoặc ăn một trận nhừ tử"." 
 POD_predatorstories_farmer.1191.desc: "Đang rình rập tìm máu, ngươi không may bị phát hiện và sau đó bị chặn lại bởi giọng nói của một người trong đội tuần tra của nhà vua. "Dừng lại, tên nông dân ngu ngốc kia, vì tội vi phạm luật săn bắn trộm do lãnh chúa của chúng ta ban hành, ngươi bị kết án phải nộp phạt hoặc chịu cảnh tù đày"."
 POD_predatorstories_alleycat.1191.a: "Ta quen thân đội trưởng đội tuần đêm."
 POD_predatorstories_bedlamite.1191.a: "Ta là một dược sĩ mới!"
 POD_predatorstories_cenobite.1191.a: "Ta đến đây để nếm thử rượu vang của tu viện!"
 POD_predatorstories_gentry.1191.a: "Ngươi có biết ta là ai không?"
 POD_predatorstories_siren.1191.a: "Ta có thể gây ra rất nhiều rắc rối cho ông chủ của ngươi đấy..."
 POD_predatorstories_farmer.1191.a: "Ta là bạn tốt của lãnh chúa các ngươi."
 POD_predatorstories.1191.b: "Chiến đấu để vượt qua chúng"
 POD_predatorstories.1191.b.success: "Ngươi đánh bại chúng"
 POD_predatorstories.1191.b.success.toast: "Ngươi đã vượt qua đám phàm nhân mà không bị thương"
 POD_predatorstories.1191.b.failure: "Chúng đánh bại ngươi"
 POD_predatorstories.1191.b.failure.toast: "Ngươi bị đám phàm nhân làm bị thương nhưng đã trốn thoát được"
 POD_predatorstories.1191.c: "Ta có thể trả tiền để ngươi lơ đi."
 POD_predatorstories.1191.d: "Ta chỉ đang định rời đi thôi."
 POD_predatorstories.1191.e: "Đánh lạc hướng chúng bằng một ảo ảnh."
 
 POD_predatorstories.1192.t: "Máu Lén Lút"
 POD_predatorstories.1192.desc: "Dù bằng cách ẩn mình hay dùng danh tính của kẻ khác, ngươi đã sẵn sàng để hút máu con mồi mà không gặp trở ngại."
 POD_predatorstories.1192.a: "Uống"
 POD_predatorstories.1192.b: "Uống đến chết"
 
 POD_predatorstories.1193.t: "Sự Chú Ý Không Mong Muốn"
 POD_predatorstories_alleycat.1193.desc: "Lời nguyền bất hạnh làm biến dạng gương mặt ngươi khiến việc giả làm phàm nhân trở nên khó khăn. Vì vậy, phản ứng của họ khi phát hiện ngươi ở nơi ngươi không nên có mặt thường mang tính hung hãn.\nĐang rình rập tìm máu, ngươi không may bị một đội tuần tra đêm phát hiện. Tin rằng ngươi là một loại quái vật nào đó hoặc có lẽ là dã thú hoang dại, đám lính tuần đêm tiến lên tấn công."
 POD_predatorstories_bedlamite.1193.desc: "Lời nguyền bất hạnh làm biến dạng gương mặt ngươi khiến việc giả làm phàm nhân trở nên khó khăn. Vì vậy, phản ứng của họ khi phát hiện ngươi ở nơi ngươi không nên có mặt thường mang tính hung hãn.\n"Trong lúc rình rập tìm máu tại nhà thương điên, ngươi không may bị một nhân viên phát hiện, người này đã mang theo lính gác. Tin rằng ngươi là một loại quái vật nào đó hoặc có lẽ là dã thú hoang dại, đám lính gác tiến lên tấn công." 
