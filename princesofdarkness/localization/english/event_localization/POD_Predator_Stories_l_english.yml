 #House has gold (Not a gift)
 POD_predatorstories.1410.t: "Vàng Trong Giấc Ngủ"
 POD_predatorstories.1410.desc: "Vì ngươi hút máu từ những phàm nhân đang say ngủ, ngươi phải đột nhập vào nhà họ. Dù đây là một công việc bình thường trong hầu hết thời gian, nó có thể tạo ra vài cơ hội như đêm nay.\nBên trong nhà nạn nhân của ngươi tình cờ có một lượng vàng đáng kể. Ngươi có thể dễ dàng lấy nó, nếu ngươi có ý định làm vậy."
 POD_predatorstories.1410.a: "Giờ nó là của ta"
 POD_predatorstories.1410.b: "Ta không phải một tên trộm tầm thường!" 
 
 #House has artifact (Not a gift)
 POD_predatorstories.1420.t: "Kho Báu Trong Giấc Ngủ"
 POD_predatorstories.1420.desc: "Vì ngươi hút máu từ những phàm nhân đang say ngủ, ngươi phải đột nhập vào nhà họ. Dù đây là một công việc bình thường trong hầu hết thời gian, nó có thể tạo ra vài cơ hội như đêm nay.\nBên trong nhà nạn nhân của ngươi tình cờ có một món gia bảo. Ngươi có thể dễ dàng lấy nó, nếu ngươi có ý định làm vậy."
 POD_predatorstories.1420.a: "Lấy nó để bán"
 POD_predatorstories.1420.b: "Lấy nó để trưng bày"
 POD_predatorstories.1420.c: "Lấy [newly_created_artifact.GetName] để dùng"

 #Victim is drunk (Drunk Modifiers Loca at the top in multi use catagory)
 POD_predatorstories.1430.t: "Cơn Nôn Nao Đẫm Máu"
 POD_predatorstories.1430.desc: "Khi hút máu phàm nhân, ma cà rồng thường bị ảnh hưởng bởi những gì đã xảy ra trong cơ thể phàm nhân đó trước khi chúng cắm nanh vào. Dù bệnh tật và những thứ tương tự không đáng lo với đám con của Cain, việc có nhiều loại chất khác nhau trộn lẫn trong máu có thể tạo ra một trải nghiệm... kỳ lạ cho con ma cà rồng đang hút máu.\nĐêm nay ngươi đã sẵn sàng để hút máu, khi nạn nhân của ngươi bỗng lẩm bẩm điều gì đó về cua.\nChuyến đi này có thể sẽ khá thú vị."
 POD_predatorstories_auspex.1430.desc: "Khi hút máu phàm nhân, ma cà rồng thường bị ảnh hưởng bởi những gì đã xảy ra trong cơ thể phàm nhân đó trước khi chúng cắm nanh vào. Dù bệnh tật và những thứ tương tự không đáng lo với đám con của Cain, việc có nhiều loại chất khác nhau trộn lẫn trong máu có thể tạo ra một trải nghiệm... kỳ lạ cho con ma cà rồng đang hút máu.\nĐêm nay ngươi đã sẵn sàng để hút máu, khi nạn nhân của ngươi bỗng lẩm bẩm điều gì đó về cua.\n\nTuy nhiên nhờ kỹ năng Dị năng Auspex của ngươi, ngươi có thể xác định rằng họ hoàn toàn mất kiểm soát. Máu của họ bị nhiễm các chất có thể ảnh hưởng đến ngươi ở một mức độ nào đó nếu ngươi hút máu."
 POD_predatorstories.1430.a: "Chà... chỉ một chút thôi."
 POD_predatorstories.1430.b: "Ta say be bét rồi!"
 POD_predatorstories.1430.c: "Tốt hơn là đừng."





