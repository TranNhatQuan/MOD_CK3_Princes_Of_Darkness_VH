 POD_travel_events.1.t: "Alamut: Tổ Đại Bàng"
 POD_travel_events.1.desc: "Trong những dãy núi của Tiểu Á, nếu biết nơi cần tìm, sẽ thấy một lối mòn hẹp tách khỏi con đường thương mại chính, nơi không có làng mạc nào trong hàng chục dặm. Tuyến đường này leo lên những sườn dốc hiểm trở nhất, đi sát bên những vực sâu chết chóc nơi gió lạnh gào thét cuốn kẻ bất cẩn xuống chết trên những tảng đá sắc như gươm phía dưới xa. Đây là con đường đến Alamut, Tổ Đại Bàng, thành trì cổ xưa của Banu Haqim.\nNhìn từ bên ngoài, Alamut chẳng có gì đáng chú ý: một pháo đài nhỏ trên đồi xây bằng đá bazan đen với tường thành quá ngắn và mỏng để chịu được một cuộc vây hãm. Tuy nhiên, đây chỉ là nhà canh cổng của pháo đài.\nBên trong công trình trung tâm, một lối đi rộng, bằng phẳng mở ra, dốc xuống trong lòng núi. Đây là nơi các tuyến phòng thủ thực sự của Alamut bắt đầu, được các thành viên của ba đẳng cấp liên tục bảo trì và giám sát. Những phép thuật giữ cho vị trí của nó ẩn khỏi tất cả những kẻ muốn gây hại cho cư dân nơi đây.\nĐây là các sảnh luyện tập, nơi hàng trăm chiến binh thử thách bản lĩnh của mình. Đây là vô số phòng thí nghiệm để các pháp sư thử nghiệm những phép thuật đã thất truyền từ lâu đối với loài người. Đây là thư viện vĩ đại, nơi các vizir suy ngẫm về những bí mật của vũ trụ.\nVà đây là Ngai Đen của Haqim, ngự giữa trung tâm pháo đài trong đại sảnh, chờ đợi sự trở về của vị chủ nhân chính danh và đáng sợ của nó."
 POD_travel_events.1.a: "Có nhiều điều để học hỏi ở đây."
 POD_travel_events.1.b: "Ta không nên chậm trễ."
 
 POD_travel_events.2.t: "Ceoris: Niềm Tự Hào của Tremere"
 POD_travel_events.2.desc: "Khách viếng thăm hay kẻ tấn công đều phải tiếp cận Ceoris từ những chân đồi hiểm trở, được phòng thủ kiên cố ở phía nam. Mưa, sương mù và bão tố khác thường che chắn thung lũng trong khi lính gác tuần tra ngày đêm. Con đường mòn kết thúc bằng một con dốc đứng dẫn tới cổng thành Ceoris. Nó đủ gồ ghề và khúc khuỷu để ngăn việc kéo vũ khí công thành tới tấn công thánh đường. Những tảng đá khổng lồ do các Gargoyle lăn xuống là điểm phục kích lý tưởng cho quân phòng thủ.\nKhách viếng thăm khi đến gần chỉ thấy sương mù và chỉ nghe tiếng gió gào. Đó là một khối đá đen khổng lồ vươn lên từ một cao nguyên nhân tạo. Bề mặt của nó không có trang trí gì, chỉ có hàng chục ô cửa sổ dài, hẹp, nay đã bị xây bịt và bọc kín bằng tấm chì, làm gián đoạn sự phẳng lì hoàn hảo của các mặt đứng. Tám tòa tháp vươn lên từ khối kiến trúc, đóng vai trò là mồi nhử vì không tòa nào trong số đó dẫn vào chính Ceoris. Một vài tòa bốc cháy khi có trọng lượng đè lên. Có vẻ Tremere không dễ gì bỏ được thói thích phô trương của họ.\nMột vực sâu khổng lồ bao quanh thánh đường, chỉ có cây cầu hẹp nhất để vượt qua. Cuối cùng, nhà canh cổng là trở ngại cuối cùng, được bảo vệ bởi những binh sĩ dày dạn và những Gargoyle hung tợn nhất. Ngay cả khi bị đánh bại, những cạm bẫy phép thuật uy lực vẫn chờ đợi kẻ xâm nhập ngoan cố. Sau nhà canh cổng cuối cùng là chính Ceoris, trái tim và linh hồn của dòng Tremere vô hồn."
 POD_travel_events.2.a: "Sào huyệt của bọn Tiếm Quyền."
 POD_travel_events.2.b: "Ấn tượng, nói nhẹ nhàng thì vậy."
 
 POD_travel_events.3.t: "Carthage: Giấc Mơ và Ác Mộng"
 POD_travel_events.3.desc: "Brujah vẫn lấy cảm hứng từ những huyền thoại về các học giả và triết gia vĩ đại từng hưng thịnh ở Carthage, một nền văn hóa nơi Kindred và phàm nhân gần gũi với nhau hơn bất kỳ thời điểm nào trước hay sau đó. Quả thật, một số Brujah (và một vài kẻ khác) nhớ về Carthage như "Thành Phố Thứ Ba", người kế thừa tinh thần và chính trị của Thành Phố Thứ Nhất và Thứ Hai. Tuy nhiên, những câu chuyện khác, đen tối hơn, kể về một giáo phái máu suy đồi dưới trướng không ai khác ngoài Troile, tổ tiên Antediluvian của Brujah; về những cuộc hiến tế con người – kể cả hiến tế trẻ sơ sinh – cho các thế lực địa ngục; và về sự cấu kết giữa Troile và methuselah Moloch của Baali.\nVentrue của Roma là những đối thủ quyết liệt của anh em họ Brujah ở Carthage. Khi Moloch kéo Troile vào con đường chai sạn cảm xúc và suy đồi, tin tức về sự thối nát lan tràn trong giới Brujah Carthage đã đến tai các clan La Mã. Nữ tiên tri Malkavian Tryphosa đã chỉ dẫn cho prince La Mã Camilla, hướng ông ta hành động chống lại Carthage, và Toreador người Carthage tên Helena đã phản bội thành phố của mình cho người La Mã. Thông qua Antediluvian của Toreador, Artemis Orthia, Lysander và prince Alchias, một liên minh đã hình thành chống lại Brujah của Carthage; dưới sự lãnh đạo của Ventrue La Mã, liên minh này bao gồm cả Malkavian, Toreador, Lasombra và đồng minh của họ. Khi Chiến Tranh Punic Lần Thứ Ba san phẳng Carthage vào năm 146 TCN, lực lượng liên hợp của liên minh Hậu duệ Cain La Mã đã đánh bại các bậc thầy Brujah và Baali của Carthage. Cuối cùng, Troile và Moloch bị đẩy vào Miên Trạng, quấn lấy nhau trong một vòng tay tình nhân vĩnh cửu dưới những cánh đồng rải muối của Carthage."
 POD_travel_events.3.a: "Một cơn ác mộng đang ngủ yên."
 POD_travel_events.3.b: "Tàn tích của thiên đường chúng ta."
  
 POD_travel_events.4.t: "Erciyes: Điều Rồ Dại của Cappadocius"
 POD_travel_events.4.desc: "Đôi khi được gọi là Tu Viện Bóng Tối vì vị trí của nó, những vách đá cao ở mọi phía khiến nơi đây chỉ nhận vài giờ ánh nắng trực tiếp mỗi ngày, Erciyes bị dòng Cappadocian chiếm lấy trong một cuộc tổng tấn công (hành động quân sự duy nhất trong lịch sử của clan) vào khoảng thế kỷ thứ 1 TCN, khi họ thay thế một tu viện trên núi vốn ban đầu phục vụ như một giáo phái cho một Malkavian. Từ đó, clan duy trì một quần thể đền thờ tại ngọn núi này, dành riêng cho việc nghiên cứu của Cappadocian về cái chết và Chúa Trời. Ngôi đền này theo Cơ Đốc Giáo (như Cappadocian thường vậy), nhưng nổi tiếng với những bí mật kỳ lạ và kinh hoàng.\n"Thành phố chị em" của nó, Kaymakli, nằm gần đó và mang một danh tiếng còn đen tối hơn. Thành phố này từng là một cộng đồng lai giữa Cappadocian và phàm nhân; phàm nhân cung cấp mọi tiện nghi và làm đàn gia súc cho các học giả bất tử trong hàng ngũ của họ. Dù không hẳn lý tưởng, sự sắp đặt này dường như tương đối thỏa đáng cho cả hai bên, có lẽ được điều hòa bởi cả điều kiện nhìn chung khắc nghiệt của một nông dân Thổ Nhĩ Kỳ thế kỷ 9 lẫn thái độ nhìn chung thụ động và có phần nhân đạo hơn của Cappadocius.\nKhi clan bị thanh trừng trong Feast of Folly, thành phố trở thành một nấm mồ cho hàng nghìn Cappadocian bất hạnh. Sau đó, clan chuyển phần lớn hoạt động của mình trở lại Erciyes."
 POD_travel_events.4.b: "Nơi an nghỉ cuối cùng của anh chị em chúng ta."
   
 POD_travel_events.5.t: "Thánh Đường Xác Thịt: Điều Rồ Dại của Yorak"
 POD_travel_events.5.desc: "Thánh Đường là sáng tạo, là nơi trú ẩn, và là lãnh địa của Yorak, một hậu duệ của Antediluvian dòng Tzimisce. Nó được xây dựng để bảo vệ một mầm ý thức của Antediluvian mà Yorak được giao phó, và theo thời gian nó mang hình dạng một pháo đài-thánh đường đáng sợ, tạc từ thịt của nông dân, nô lệ, kẻ thù, dã thú, và vô số nạn nhân khác được xây vào những bức tường rỉ mủ, phập phồng của công trình do vị methuselah và đoàn tùy tùng của hắn xây dựng trong suốt hàng thiên niên kỷ.\nTuy nhiên Thánh Đường còn hơn thế nhiều, nó là một cỗ máy sống (hay có lẽ bất tử) của ý thức tập thể điên loạn. Thánh đường phô bày một số bầu không khí rất đáng sợ, như một vũng máu lót đầy nạn nhân ngồi mà người ta có thể dùng làm ghế, những cây cột ghép từ thân thể, những bức tường miệng ngân nga một khúc ca ai oán khi ngươi đi ngang qua, hay hành lang lộ thiên nơi các xác chết vẫn bị xuyên qua bởi thạch nhũ. Những cột thạch nhũ và măng đá dày ấy tạo thành các trụ cột của Thánh Đường, với những giàn xương mà đá vôi mọc lên trên đó, tạo thành một hỗn hợp kiến trúc lỏng bằng xương. Hoặc những chiếc sọ – với đôi mắt và cấu trúc cơ xung quanh vẫn còn nguyên vẹn – mỏng đủ để thấy được biển nội tạng và các cơ quan trôi nổi bên trong tạo nên các bức tường.\nHàng chục ghoul làm ẩm đôi mắt để chúng có thể chớp bình thường. Còn nhiều Revenant hơn nữa thực hiện nghi thức xăm mình bằng cách luồn những sợi chỉ phủ bụi than qua da nạn nhân bằng kim xương. Sau đó, Yorak và các hậu duệ của hắn sẽ cẩn thận lột lớp da khỏi những vật hiến tế đang gào thét, xử lý tấm da như một tấm vải bạt bằng chất bảo quản, rồi căng nó lên các ô cửa sổ như một bức tranh khảm."
 POD_travel_events.5.a: "Tzimisce chẳng có giới hạn nào."
 POD_travel_events.5.b: "Thật là một kỳ quan!"
   
 POD_travel_events.6.t: "Castel del Ombro: Sào Huyệt của Lasombra"
 POD_travel_events.6.desc: "Có những hiện tượng bí ẩn thỉnh thoảng gắn liền với nơi này, và một truyền thuyết cổ xưa về việc bóng tối nơi đây vẫn nguyên vẹn ngay cả khi dòng dung nham từ núi Etna gần đó phủ ánh sáng đỏ rực rỡ lên mọi thứ khác. Cả cư dân địa phương lẫn giới chức đến thăm đều không nhận ra tâm trí họ bị bẻ cong triệt để như thế nào một cách thường xuyên để che giấu tất cả những gì thực sự đáng chú ý về tòa lâu đài này ở trung tâm điền trang. Với thị giác ma cà rồng thì đó lại là chuyện hoàn toàn khác.\nBản thân tòa lâu đài có thiết kế đơn giản, được sửa đổi vô số lần qua nhiều thế kỷ và thực ra không hề dựa vào sức mạnh vật lý cho việc phòng thủ. Một bức tường ngoài dài, vuông vức chính xác, bao quanh hai tòa tháp bên trong, cũng vuông vức. Tòa tháp phía đông vươn cao hơn, với một sân thượng mở rộng để người canh gác có tầm nhìn tốt nhất về bất kỳ rắc rối nào đến từ ngọn núi lửa cũng như các hướng khác. Không thể biết từ xa những bức tường được làm bằng gì, chính xác là vậy, bởi vì những cái bóng sống động bò trên mọi bề mặt trong một dòng chảy lên xuống chỉ vừa đủ để nhận ra. Những đợt sóng bóng tối trồi lên từ vực sâu sau khi mặt trời lặn mỗi đêm và quấn quanh lâu đài theo một mô hình xoáy ốc nói chung, rồi đảo ngược sau nửa đêm để dần dần rút đi.\nNgười ta nói rằng cổng thành chỉ được mở khi chính Lasombra không ở trong lâu đài, một cảnh tượng đáng lo ngại cho cả thế giới nói chung."
 POD_travel_events.6.a: "Rợn người."
 POD_travel_events.6.b: "Trái tim của clan chúng ta."
    
 POD_travel_events.7.t: "Hố của Malkav: Hiện Thân Điên Loạn"
 POD_travel_events.7.desc: "Những đường hầm chạy bên dưới Jerusalem, bị bỏ hoang từ lâu trước khi thành phố này thậm chí còn tồn tại. Mê cung những lối đi sụp đổ này gần như không thể đi qua ở một số chỗ với những vòm đá cao dẫn tới những vực đứng bên vách kéo dài xuống bóng tối tuyệt đối. Ở một số nơi, thế cân bằng giữ cho một lối đi bằng đá mở ra có thể mong manh như xương. Chỉ một va chạm nhỏ, và cả một đoạn hành lang lớn sẽ sụp xuống. Các lối đi đan xen theo ba chiều và còn nhiều tầng khác ngoài tầng đầu tiên.\nNgười ta thực sự có thể lang thang ở đây đến muôn đời.\nKhông thể vẽ bản đồ những tàn tích ấy nhưng có ba địa điểm nổi bật.\nCăn Phòng Nguệch Ngoạc, nơi các bức tường phủ đầy những nét vẽ tối màu, như phấn. Những hình ảnh điên loạn tấn công kẻ khờ khạo tội nghiệp nào cố giải mã chúng.\nDòng Sông Máu, mà bất kỳ Hậu duệ Cain nào cố uống từ đó sẽ chịu hậu quả khủng khiếp từ độc tính tuyệt đối của nó.\nVà cuối cùng, nơi an nghỉ huyền thoại của Antediluvian, đang mơ và đôi khi gọi những hậu duệ của mình đến bên hắn. Nhưng dù hắn có gọi mạnh mẽ hay lâu đến đâu, chưa từng có ai đến được bên hắn cả."
 POD_travel_events.7.a: "Đây không phải là nơi dành cho giống loài của ta."
 POD_travel_events.7.b: "Cha ơi, con đang lắng nghe!"
    
 POD_travel_events.8.t: "Triều Đình Lửa: Mắt của Rắn"
 POD_travel_events.8.desc: "Triều Đình Lửa nằm gần Thung Lũng Các Vị Vua. Lợi dụng sức quyến rũ của quyền lực và của cải trong khu vực, các Setite thường lôi kéo những kẻ mạo hiểm sa vào tay mình để bị dẫn dụ đến Triều Đình.\nBất kỳ ai bước vào đều thấy mình trong một hang động sâu nhuốm ánh sáng cam kỳ lạ. Những bức tranh treo trên tường, nổi bật nhất là bức vẽ một con rắn đen khổng lồ đang nuốt chửng mặt trời. Đường hầm dẫn tới một căn phòng lớn đục từ sa thạch. Sáu bức tượng khổng lồ hình người nam nữ với rắn quấn quanh mình làm trụ cột, đỡ trần vòm bên trên. Biểu cảm của các bức tượng hoặc là xuất thần hoặc là đau đớn. Trần nhà bị che phủ bởi những bóng tối dường như gợn sóng với sức sống riêng của chúng, những ai có thị lực tinh tường nhận ra rắn chạm khắc phủ kín toàn bộ trần nhà. Hàng chục con rắn thật trườn quanh phòng.\nMột hố lửa lớn hình tròn nằm gần trung tâm căn phòng. Lửa của nó cháy một màu xanh lục ghê rợn và tỏa ra một làn khói say ngất. Sau đám lửa là một bệ thờ, cầu thang dẫn từ đó lên một con hổ mang đá cuộn mình xòe mang che trên một ngai vàng. Đây là nơi nữ chủ nhân của Triều Đình Lửa ngự, bằng cách nào đó còn đáng sợ hơn bất cứ thứ gì khác trong căn phòng này."
 POD_travel_events.8.a: "Chúng thật sự yêu thích rắn của mình."
 POD_travel_events.8.b: "Quyền năng của Set, phô bày cho tất cả thấy."
      
 POD_travel_events.9.t: "Mê Cung Knossos: Sào Huyệt của Namtaru"
 POD_travel_events.9.desc: "Nergal là một cái tên đáng sợ, con ma cà rồng đã bán linh hồn cho các thế lực cao hơn và từng đe dọa Thành Phố Thứ Hai bằng đội quân quỷ dữ và Tà Đạo Sĩ của hắn. Những nỗ lực đầu tiên của hắn bị ngăn chặn, nhưng sau khi nhận ra nơi an nghỉ của con dã thú bóng tối mà hắn tìm cách đánh thức nằm ở bắc Galilee, hắn xuất hiện trở lại, tự xưng là Shaitan, người sáng lập Clan Baali.\nXây dựng pháo đài Chorazin trên ngôi mộ của Namtaru, Kẻ Mang Dịch Bệnh, hắn đã khai quật được thân xác ngủ yên và di chuyển nó đến Knossos ở biển Aegea, xây dựng một mê cung khổng lồ lấy cảm hứng từ các khe nứt bề mặt và các kênh dẫn của bộ não con người. Khi chính thực tại bị bẻ cong quanh hòn đảo lúc Namtaru ngày càng tỉnh thức, các ma cà rồng khác trở nên hoảng loạn và tấn công Nergal trong sào huyệt của hắn. Cùng nhau, mười ba clan đã khiến ngọn núi lửa dưới Knossos phun trào, nhấn chìm Namtaru xuống biển và dường như tiêu diệt Nergal vĩnh viễn.\nCho đến đêm nay, Knossos vẫn là nơi mà hầu hết ma cà rồng bản năng tránh xa, trừ những kẻ tìm cách giao du với những thực thể không nên bị quấy rầy."
 POD_travel_events.9.a: "Địa ngục trần gian."
 POD_travel_events.9.b: "Quyền năng tối tăm và vĩ đại nhất đang chờ đợi tại đây."
    
 POD_travel_events.10.t: "Tu Viện Sernog: Sào Huyệt của Tzimisce"
 POD_travel_events.10.desc: "Công trình nằm cao trên một sườn núi phía trên đường ranh giới cây cối. Một pháo đài bị bỏ hoang sừng sững đầy đe dọa, những bức tường ám đen của nó tạo thành một bộ xương tối tăm trên nền trời, một lớp vỏ tòa nhà lộ thiên dưới các vì sao. Gắn liền với pháo đài là một thánh đường cổ xưa, bề ngoài trong tình trạng tốt hơn nhưng không kém phần đáng sợ so với công trình đồng hành của nó. Đã bị phàm tục hóa từ lâu, vùng đất quanh thánh đường tu viện không còn được xem là đất thánh nữa; Hậu duệ Cain có thể bước đi trên khuôn viên này mà không bị trừng phạt.\nNội thất của thánh đường phản chiếu một bầu không khí báo điềm tối tăm. Kiến trúc dường như được tạc từ trí tưởng tượng cuồng loạn của một nhà thiết kế điên rồ nào đó. Những chạm khắc quái dị của các sinh vật có thể là thiên thần nhưng lại giống quỷ dữ nhìn xuống những kẻ đi qua vòm cổng ở lối vào của khu thánh điện cũ. Không khí bên trong thánh đường có mùi ẩm mốc, ngột ngạt, như thể có thứ gì đó đang chết dần vĩnh viễn đã tự chôn mình trong những phiến đá và giờ đây rỉ ra tinh chất của nó trong một làn sương mù thối rữa triền miên. Những tiếng rên rỉ ghê rợn lấp đầy gian phòng trung tâm rộng lớn, vọng lại từ những rường vòm cao và ngân vang thành một mớ âm thanh chói tai bắt chước tiếng khóc than của các nạn nhân đang chịu đựng những cực hình dai dẳng và tinh vi.\nCó một cửa sập ẩn bên dưới bàn thờ của nhà thờ. Được khoét vào sàn gỗ, cánh cửa mở ra bằng cách kéo lên vòng sắt của nó. Một cầu thang hẹp, tối tăm dẫn xuống hầm mộ của thánh đường, nơi chứa một quan tài đá được canh giữ bởi một đội quân nhỏ những sinh vật hầu cận."
 POD_travel_events.10.a: "Nơi Samiel đã gặp kết cục, nếu những câu chuyện là thật."
 POD_travel_events.10.b: "Hắn đang ngủ, chờ đợi thời điểm thích hợp để quay trở lại."
     
 POD_travel_events.11.t: "Hunedoara: Sào Huyệt của Kẻ Ẩn Giấu"
 POD_travel_events.11.desc: "Hỏi người dân Hunedoara xem lâu đài nằm ở đâu và ngươi sẽ nhận được ánh mắt ngơ ngác. Họ sẽ rất ngạc nhiên khi biết rằng những bản đồ cũ hơn cho thấy một lâu đài tráng lệ cách làng của họ chưa tới một giờ đi. Tòa lâu đài ấy vô danh.\nInconnu.\nĐáng sợ và hoang vắng trong vẻ tráng lệ đang phai tàn, tàn tích của nó bị giấu kín khỏi thế gian, nép mình trong một nơi trú ẩn đầy đá. Không phàm nhân nào có thể vào lâu đài, vì nghi thức khiến tất cả những ai lọt vào tầm mắt nó đều cảm thấy nỗi sợ hãi tột cùng. Càng đi xa khỏi nó, ký ức của họ càng phai nhạt, cho đến khi họ không còn nhớ gì về nó nữa.\nBước vào lâu đài là một nhiệm vụ gần như bất khả thi, ngay cả những quyền năng ma cà rồng vĩ đại nhất cũng không thể ép ai đó tránh khỏi nỗi sợ này. Do đó, những kẻ thực sự đến được lâu đài thường bị buộc phải làm vậy. Lối vào lâu đài chỉ có thể đạt được qua một con đường núi dài, khúc khuỷu, mảnh và hiểm trở, thường có một vực sâu bên cạnh. Những bức tường bên ngoài trong tình trạng đổ nát nghiêm trọng, và hầu hết các công trình bên ngoài đã sụp đổ, khiến toàn bộ khu vực trông càng hoang tàn và độc ác hơn. Bất kỳ ai cố vào bằng cách nào khác ngoài cổng chính đều bị đẩy lùi bởi gió, sét và cuối cùng là những đợt bùng lửa.\nBên trong ẩn chứa sự tập trung quyền năng ma cà rồng lớn nhất kể từ Carthage... và một thứ gì đó thậm chí còn nguy hiểm hơn."
 POD_travel_events.11.a: "Nơi Golconda đã chết, và Địa Ngục bắt đầu."
     
 POD_travel_events.12.t: "Vienna, Ngôi Nhà mà Etrius Đã Xây"
 POD_travel_events.12.desc: "Được tạo ra sau khi Etrius bày tỏ mối lo ngại nghiêm trọng của mình về việc biến House Tremere thành một clan ma cà rồng quá nhanh, Vienna nhanh chóng trở thành nơi trú ẩn an toàn nhất cho phe bảo thủ của clan.\nTọa lạc trên một mỏm đá lởm chởm cách thành phố vài dặm về phía bắc, thánh đường Vienna trông như một khu nhà săn lớn và uy nghi. Những bức tường của nó gồm những khối đá xám đồ sộ, được đẽo từ Trái Đất bằng phép thuật của Etrius. Những xà gỗ khổng lồ đóng vai trò trụ cột và dầm ngang xuyên suốt công trình. Mỗi căn phòng đều lớn và có kích thước quá khổ. Một mạng lưới rộng lớn các căn phòng không sử dụng chạy chằng chịt trên ngọn đồi nơi tòa nhà tọa lạc. Etrius xây những phòng đó để chừa chỗ cho việc mở rộng trong tương lai mà không thu hút sự chú ý không mong muốn.\nCác phòng thí nghiệm của Vienna rộng lớn và được trang bị đầy đủ, và thư viện là nơi tốt nhất mà Tremere có được ngoài Ceoris. Các khu vực chung vừa xa hoa vừa đáng sợ. Đồ nội thất gỗ nặng nề được bọc nhung thêu chỉ vàng. Hương thơm nồng nàn quá mức tỏa ra từ vô số lư đồng. Những tấm thảm thêu mô tả Tremere, Etrius và Goratrix nhìn xuống đầy vẻ không hài lòng với những kẻ chiếm dụng căn phòng, trong khi những cặp sừng nai khổng lồ, đầu lợn rừng và các chiến lợi phẩm khác xuất hiện khắp tòa nhà.\nVienna thiếu những biện pháp bảo vệ tinh vi của Ceoris, nhưng mặt đất vẫn còn chứa đầy những cạm bẫy tinh xảo."
 POD_travel_events.12.a: "Kế hoạch dự phòng của bọn Tiếm Quyền."
 POD_travel_events.12.b: "Một ốc đảo bình yên xa cách kẻ thù của chúng ta."
     
 POD_travel_danger_events.13.success: "Chúng đã bị đánh bại!"
 POD_travel_danger_events.13.wound: "Một chiến thắng gian nan."
 POD_travel_danger_events.13.failure: "Cuộc chạy thoát tốn kém..."
 POD_travel_events.13.t: "$travel_danger_prefix$ Cuộc Phục Kích của Người Sói!"
 POD_travel_events.13.desc: "Rừng rậm là lãnh địa của loài Lupine và, bất chấp nỗ lực hết mình để giữ kín tung tích, đám sói to xác chết tiệt đó vẫn lần ra được mùi hương của ngài. May thay, ngài đã chuẩn bị cho khả năng này và không hoàn toàn bị bất ngờ.\nDù vậy, đây là những sinh vật quyền năng, quen thuộc hơn nhiều với việc chiến đấu ở đây so với ngài. Chuyện này sẽ không dễ dàng."
 POD_travel_events.13.a: "Đứng vững lập trường!"
 POD_travel_events.13.b: "Ngươi kia, bảo vệ ta!"

 POD_travel_danger_events.14.success: "Chúng để ngài đi qua!"
 POD_travel_events.14.t: "$travel_danger_prefix$ Thợ Săn Đang Rình Rập"
 POD_travel_events.14.desc: "Bất chấp nỗ lực hết mình để giữ kín tung tích trong chuyến hành trình, có vẻ tin đồn về đoàn xe của ngài đã đến tai một nhóm thợ săn hám lợi. Chúng đã phong tỏa một cây cầu mà ngài sẽ phải băng qua để tiếp tục hành trình nhưng, may thay, dường như chúng không hoàn toàn chắc chắn về việc phải chờ đợi ai (hoặc thứ gì).\nDo đó ngài không bị tấn công ngay khi bị phát hiện, điều này cho ngài cơ hội thử lừa gạt chúng, có thể tránh được một cuộc giao tranh."
 POD_travel_events.14.a: "Xông lên trước khi chúng phản ứng!"
 POD_travel_events.14.b: "Ngươi, xử lý chúng."
 POD_travel_events.14.c: "Chúng tôi chỉ là những thương nhân khiêm nhường đi ngang qua..."
 
 POD_travel_events.15.t: "$travel_danger_prefix$ Nhà Tiên Tri Điên Loạn"
 POD_travel_events.15.desc: "Một kẻ bơ phờ, rõ ràng không hoàn toàn tỉnh táo, đã bắt đầu bám theo đoàn xe của ngài được một thời gian. Hắn đang thao thao bất tuyệt về Gehenna, Khải Huyền, Thăng Hoa, Thời Khắc Phán Xét và những điều nhảm nhí khác. Mọi nỗ lực xua đuổi hắn đi của ngài đều thất bại, và ngay cả khi dùng đến bạo lực cũng chỉ khiến hắn xuất hiện trở lại sau đó với những lời tiên đoán về ngày tận thế và u ám còn nhiều hơn nữa.\nĐoàn lữ hành của ngài đang bắt đầu bực bội vì những lời lảm nhảm về ngày tận thế không ngừng, buộc ngài phải cân nhắc hành động."
 POD_travel_events.15.a: "Nói chuyện với ta thay vào đó."
 POD_travel_events.15.b: "Cứ lờ tên điên đó đi."
 POD_travel_events.15.c: "Ta cũng có những lời tiên tri của riêng mình!"
  
 POD_travel_events.16.t: "$travel_danger_prefix$ Thị Trấn Yên Tĩnh"
 POD_travel_events.16.desc: "Kể từ khi ngài bước vào khu vực này, tin đồn đã lan truyền đến đoàn lữ hành của ngài về một thị trấn nhỏ xinh mà kế hoạch hành trình của ngài buộc ngài phải đi qua. Dân địa phương kể rằng những thứ ghê tởm bất khiết cai trị màn đêm ở đó, buộc dân làng phải cầu nguyện để được thấy bình minh sớm nhất có thể.\nKhi ngài đến gần hơn, tin đồn càng trở nên sống động hơn và đoàn tùy tùng của ngài đang chia sẻ nỗi bất an của họ với ngài. Họ đang biện luận cho một đường vòng nhỏ thay vì mạo hiểm đặt chân vào ngôi làng đáng nguyền rủa này và chọc giận bất kỳ ai thực sự đang cai trị nơi đây."
 POD_travel_events.16.a: "Ta không sợ chuyện ma nào cả!"
 POD_travel_events.16.b: "Được, đi đường vòng. Không phải ta sợ đâu..."
 POD_travel_events.16.c: "Ta cảm nhận được một linh hồn đồng điệu!"
  
 POD_travel_events.17.t: "$travel_danger_prefix$ Chiến Tranh Phàm Nhân"
 POD_travel_events.17.desc: "Đám phàm nhân vô tri đang tiến hành một cuộc chiến trong khu vực này vì lý do vặt vãnh nào đó. Không phải ngài quan tâm, nhưng sự tàn phá do các đội quân xung đột gây ra và nguy cơ vô tình chạm trán một trong số họ là mối lo cho kế hoạch hành trình của ngài. Một lựa chọn là chỉ đơn giản là đi một đường vòng khá dài, hy vọng tránh được mọi tiếp xúc với đám phàm nhân đang giao tranh. Ngài cũng có thể thuê thêm hướng dẫn viên địa phương so với dự tính ban đầu vì họ sẽ là người phù hợp nhất để tìm ra một tuyến đường thay thế an toàn.\nGiải pháp khác thường nhất sẽ là gia nhập cuộc hỗn chiến cùng đoàn tùy tùng của ngài, một giải pháp tốn thời gian nhưng có khả năng khai sáng để quan sát các chiến thuật chiến tranh mới nhất của phàm nhân."
 POD_travel_events.17.a: "Cứ tránh né chúng đi."
 POD_travel_events.17.b: "Thuê thêm người địa phương để đẩy nhanh mọi việc."
 POD_travel_events.17.c: "Một cuộc chiến ư? Để ta tham gia!"
 
 POD_travel_events.18.t: "$travel_event_prefix$ Dưới Lớp Vỏ Đêm Tối"
 POD_travel_events.18.desc: "Di chuyển đường dài đối với một ma cà rồng là một chuyện khốn khổ vì mặt trời là một trở ngại đáng gờm. Nếu ngài cố di chuyển vào ban ngày, ngài sẽ phải có những chỗ nghỉ rất đặc biệt (và đáng ngờ) để đảm bảo nơi nghỉ ngơi của ngài luôn hoàn toàn chống được ánh nắng và chỉ có thể được bảo vệ bởi những kẻ hầu cận cấp thấp thực sự có thể chịu được ánh sáng ban ngày. Nếu ngài chỉ di chuyển vào ban đêm, ngài có khả năng thu hút thêm sự chú ý không mong muốn và cần tính đến lịch trình ngủ nghỉ của chính những kẻ hầu cận ban ngày đó...\nKhông có giải pháp dễ dàng nào cho vấn đề đó và, do đó, những chuyến đi cùng một ma cà rồng thường kéo dài hơn nhiều so với khi không có, ngay cả với sự chuẩn bị tốt nhất từ trước."
 POD_travel_events.18.a: "Nó là như vậy đó."
 POD_travel_events.18.b: "Tiến lên! Nhanh hơn nữa!"
 
 POD_travel_events.19.t: "$travel_event_prefix$ Phong Cách Ai Cập Cổ"
 POD_travel_events.19.desc: "Là một xác ướp, ngài đã sống rất lâu và chứng kiến (và có lẽ còn từng lãnh đạo) những nền văn minh vĩ đại của thời Cổ Đại. Sự xa hoa và vinh quang của thế giới quá khứ này là một tương phản rõ rệt với sự ảm đạm của "Thời Kỳ Đen Tối" hiện nay. Đâu rồi các nhạc công, các cuộc rước kiệu, những người xướng ngôn công bố các tước hiệu vinh quang của ngài khi ngài bước qua vùng đất? Và những cỗ xe khủng khiếp kia là cái quái gì vậy? Chúng không đáng để so sánh với cỗ chiến xa vàng của ngài!\nNgài bỗng nảy sinh ý muốn trì hoãn chuyến hành trình hiện tại cho đến khi có thể tái hiện lại một phần vinh quang quá khứ này. Một công việc tốn kém và lâu dài nhưng ngài thực sự muốn cho đám người hiện đại kia thấy một vị Pharaoh thực thụ hành trình như thế nào."
 POD_travel_events.19.a: "Mang Hemhemet của ta đến đây!"
 POD_travel_events.19.b: "...Nỗi hoài niệm ập đến mạnh mẽ quá."
 
 POD_travel_events.20.t: "$travel_event_prefix$ Thợ Săn của Nhân Loại"
 POD_travel_events.20.desc: "Là một thợ săn tất cả những thứ khủng khiếp săn đuổi nhân loại, nghĩa vụ của ngài phải là một lời thề bí mật. Đồng loại của ngài sẽ hoảng loạn nếu họ biết được mức độ của mối đe dọa đang rình rập ngay sau mỗi góc phố. Sự bí mật này thường gây ra một số vấn đề vì nhiều người nhầm ngài với một dạng quyền uy giáo sĩ nào đó rồi trút bỏ những vấn đề hiện tại, thường rất tầm thường, của họ lên ngài khi ngài đi qua vùng đất của họ.\nThi hành công lý là điều ngài biết cách làm nhưng đó cũng sẽ là một sự chậm trễ đáng kể so với cuộc chiến cấp bách hơn (và quan trọng hơn nhiều) của ngài chống lại thế lực siêu nhiên."
 POD_travel_events.20.a: "Ta sẽ lắng nghe, và phán xét."
 POD_travel_events.20.b: "Tay sai của Quỷ Dữ sẽ không chờ ta đâu."
 
 POD_travel_events.21.t: "$travel_event_prefix$ Cuộc Hội Ngộ của Bầy Sói"
 POD_travel_events.21.desc: "Theo truyền thống, những Người Sói lữ hành được cho là có thể tìm nơi trú ẩn tại các Caern địa phương miễn là họ tôn trọng quyền lực và phong tục của cư dân nơi đó. Họ cũng được kỳ vọng là không ở lại quá lâu vì Người Sói là những sinh vật có tính lãnh thổ và không thích sự cạnh tranh tiềm tàng.\nCác trinh sát của ngài đã phát hiện một Caern gần đó có thể là nơi trú ẩn thân thiện tiềm năng. Điều này sẽ trì hoãn hành trình của ngài một thời gian, nhưng sẽ phản ánh tốt về ngài và người của ngài khi tham gia vào các truyền thống của Garou cùng dân địa phương."
 POD_travel_events.21.a: "Chúng ta có thể chia sẻ lửa cùng các ngươi một lúc không?"
 POD_travel_events.21.b: "Không có thời gian để trì hoãn."
 
 POD_travel_events.22.t: "$travel_event_prefix$ Địa Ngục Giáng Xuống Thị Trấn Nhỏ của Ngươi"
 POD_travel_events.22.desc: "Hành trình mang lại cơ hội cho giống loài của ngài và những kẻ hầu cận của họ. Đó là cách để khám phá những ngôi làng nhỏ, biệt lập, hầu như không được các cơ quan chức năng khác nhau của đất nước họ công nhận là tồn tại. Con mồi dễ dàng như vậy để tha hóa là một thú giải trí thư giãn trong một chuyến đi dài nhàm chán. Rõ ràng điều này sẽ trì hoãn hành trình của ngài một thời gian nhưng chẳng phải sự tự thỏa mãn đáng giá hơn tất cả mọi thứ hay sao?"
 POD_travel_events.22.a: "Những khoái lạc mà ta sẽ cho ngươi thấy..."

 ghouled_entourage_option: "Đoàn Tùy Tùng Ghoul"
 ghouled_entourage_option_desc: "Ma cà rồng cần một đoàn tùy tùng mạnh mẽ và trung thành trong các chuyến hành trình, vì chúng không thể hoạt động vào ban ngày. Ghoul là một lựa chọn tốt."               
 
 mummies_grandeur_option: "Hành Trình của Pharaoh"
 mummies_grandeur_option_desc: "Xác ướp nhớ lại thời họ từng là Pharaoh và hành trình cùng một đoàn tùy tùng và sự xa hoa có thể khiến các vị Vua tầm thường ngày nay phải đỏ mặt. Đôi khi, họ muốn khôi phục lại thời đại đó."
 
 werewolves_umbra_option: "Cầu Trăng"
 werewolves_umbra_option_desc: "Người Sói có thể di chuyển bằng những Cầu Trăng huyền thoại xuyên qua [umbra|E]. Trong nhiều trường hợp, cách này nhanh hơn và an toàn hơn nhiều so với việc đi đường thông thường."
 
 spread_cults_option: "Truyền Bá Giáo Phái"
 spread_cults_option_desc: "Hành trình mang lại cho ngài cơ hội để cài cắm những thành viên trung thành của giáo phái ngài vào các làng mạc và thị trấn địa phương mà ngài sẽ đi qua. Điều này sẽ trì hoãn ngài một chút, nhưng việc gia tăng ảnh hưởng của ngài chắc chắn là có lợi."

 nosferatu_hajj_option: "Cuộc Hành Hương"
 nosferatu_hajj_option_desc: "Hajj là một nhóm Nosferatu cuồng tín trong [Glossary('Ashirra','game_concept_ashirra_desc')]. Họ tự xem mình là những người bảo vệ các thánh địa của Hồi Giáo và những người hành hương của nó."
 
 POD_travel_events.23.t: "Ombos, Mắt của Set"
 POD_travel_events.23.desc: "Từ xa, Ombos trông như những đống đất, vài cây cột đổ và mảnh vỡ của các bức tường, không hơn không kém. Rất ít còn sót lại từ những gì từng là trung tâm của giáo phái phàm nhân thờ Set. Khi ngài bước qua tàn tích dưới ánh sao, một người đàn ông bước ra sau một ngôi mastaba đã bị xói mòn. Hắn mặc một chiếc áo choàng đen giản dị và mang theo cây thước đo của một tư tế Ai Cập cổ đại. "Chào mừng đến Nhà của Set".\nNgài đi vào sa mạc gần một giờ đồng hồ cho đến khi một cổng trụ đơn độc hiện lên trước mặt ngài. "Đại Set đang chờ ở phía sau. Hãy bước thẳng về phía trước và ngươi sẽ đến được với Người. Người sẽ tự mình trả lời các câu hỏi của ngươi."\nNgài chưa bao giờ thấy các vì sao sáng đến vậy trong bầu trời ánh trăng đen. Những mỏm đá đổ những bóng đen mờ đục lên cát sa mạc nhuốm bạc. Vậy mà ngài không đổ bóng, không để lại dấu chân trên cát. Ngài dõi theo một ngôi sao ở đường chân trời và đếm đến một ngàn, ba lần. Nó không hề di chuyển.\nLiệu chính thời gian có sợ hãi đấng Set uy quyền? Ngài không biết, nhưng có lẽ ngài sẽ sớm biết nếu tiếp tục bước về phía đường chân trời..."
 POD_travel_events.23.a: "Sutekh Khải Hoàn, xin nghe lời cầu nguyện của con."
 POD_travel_events.23.b: "Ta cảm nhận được điều gì đó hoặc ai đó..."
   
 POD_travel_events.24.t: "Sherwood, Sào Huyệt của Vô Chính Phủ"
 POD_travel_events.24.desc: "Một khu rừng săn bắn hoàng gia rộng lớn giáp ranh phía tây bởi sông Erewash và Rừng Đông Derbyshire, Sherwood là khu săn bắn ưa thích của giới quý tộc thời hậu xâm lược Norman. Tuy nhiên, nó thực sự nổi tiếng khi trở thành căn cứ của tên ngoài vòng pháp luật danh tiếng Robin Leeland.\nDù nguồn gốc của người này còn bí ẩn, Robin đã đấu tranh chống lại các bạo chúa từ rất lâu. Những nét đặc trưng cứng rắn và bẩn thỉu của hắn hiện diện trong nhiều cuộc nổi dậy của thường dân – trực tiếp tham gia vào các cuộc nổi dậy khác nhau của nông dân chống lại giới quý tộc Anh, là một người ủng hộ mạnh mẽ đặc biệt cho các khuynh hướng vô chính phủ, thường chiến đấu ở tuyến đầu trong các cuộc giao tranh quân sự.\n"Cây sồi lớn" của hắn, một cái cây khổng lồ ở trung tâm khu rừng mà hắn dùng làm nơi trú ẩn, giờ đây gần như là một địa điểm hành hương cho những chiến binh tự do tương lai hy vọng tìm thấy sự khôn ngoan dưới sự dẫn dắt của "Gã Trùm Khăn"."
 POD_travel_events.24.a: "Đả đảo bọn bạo chúa!"
 POD_travel_events.24.b: "Một cảnh tượng kỳ lạ."
  
 POD_travel_events.25.t: "Triều Đình Tình Yêu"
 POD_travel_events.25.desc: "Ngay cả trong số nhiều Triều Đình Tình Yêu danh giá, Triều Đình của Salianna được xem là xa hoa nhất. Thường được tổ chức tại những địa điểm giàu tính lịch sử, những "buổi dạ hội" của Salianna là nơi để thể hiện tài trí hay bản lĩnh võ thuật. Mục tiêu tối thượng của những màn phô diễn như vậy luôn giống nhau, làm hài lòng Nữ Hoàng của Paris và giành được ân sủng quý giá của bà.\nVào mùa đông, Triều Đình trở nên mang tính chính trị hơn, diễn ra tại điền trang của Salianna, nơi những khúc quanh và ngóc ngách của lãnh địa tạo điều kiện cho những kẻ âm mưu và ngồi lê đôi mách hành nghề. Mọi thứ diễn ra trong một Triều Đình đều được điều tiết bởi "Belles Dames sans Merci" (những quý bà xinh đẹp và không khoan nhượng), bốn nữ quan triều đình sẵn sàng hủy hoại danh tiếng của bất kỳ Hậu duệ Cain xấc xược nào chỉ bằng vài lời được chọn lọc.\nTriều Đình Tình Yêu của Salianna, tuy ít tàn nhẫn hơn triều đình của Isouda, vẫn không dành cho những kẻ yếu bóng vía, và nhiều tân sinh đầy hy vọng đã bị nghiền nát dưới những đòn quyền lực nhân từ (và thường không được nói ra) của nó."
 POD_travel_events.25.a: "Ta cần noi theo điều này!"

 POD_travel_events.26.t: "Đền Thờ Telyavel"
 POD_travel_events.26.desc: "Telyavel là Người Bảo Vệ của Kẻ Chết, nhưng cũng là vị thần thợ rèn được biết đến với tên Người Tạo Ra Vạn Vật. Tín ngưỡng dân gian Litva cho rằng một thợ rèn làm việc với các nguyên tố cơ bản của chính sự sáng tạo — khí, lửa, nước và đất — và nhào nặn chúng theo ý muốn, do đó làm thợ rèn không chỉ là một cách để tôn vinh các vị thần, mà còn là một cách để biết, ở một mức độ giới hạn, cảm giác được làm thần linh là như thế nào. Telyavel tái sinh linh hồn của kẻ chết, dùng chúng làm nguyên liệu thô để tạo ra những chiếc lá kim loại của Khu Rừng Bóng Tối.\n Để làm điều đó, một linh hồn sẽ xuất hiện trên đe của ông dưới hình dạng một người nhỏ bé (homunculus). Telyavel sẽ dùng kìm kẹp linh hồn và nhấn chìm nó vào lửa. Homunculus sẽ hét lên đau đớn nhưng khi người thợ rèn rút kìm ra khỏi ngọn lửa, giờ đây ông đang cầm một mẩu kim loại nóng sẵn sàng để rèn. Người thợ rèn sẽ đặt kim loại lên đe và đập nó trong khi máu bốc hơi phun ra theo mỗi nhát búa, chảy dọc theo các rãnh và rơi vào một lỗ hổng bên dưới - lấp đầy một biển máu rộng lớn gần đó. Cuối cùng của toàn bộ quá trình, một chiếc lá kim loại hoàn hảo sẽ xuất hiện và được gió mang đi vào Khu Rừng.\nTelyavel được thờ phụng nổi bật nhất bởi một huyết thống được biết đến với tên Telyavelic Tremere, những kẻ bảo vệ Khu Rừng một cách quyết liệt."
 POD_travel_events.26.a: "Một vị Thần quyền năng và một địa điểm phép thuật quyền năng."
 POD_travel_events.26.b: "Một cảnh tượng kỳ lạ."
     
 POD_travel_events.27.t: "Lăng Mộ, Trái Tim Chết Chóc của Venezia"
 POD_travel_events.27.desc: "“Ngươi muốn biết về Venice sao, khách lạ?” Đôi mắt của người dẫn đường, giọng nói của hắn, bỗng trở nên lạnh lẽo. “Vậy thì nghe cho kỹ.“\n “Ở Venice, Nosferatu, chúng ẩn nấp trong cống rãnh và trong các con kênh, hy vọng rằng ánh mắt của những kẻ ở trên không nhìn thấy chúng. Ventrue đến cùng những thương nhân lữ hành, và chúng nghĩ đến việc lập nơi trú ẩn, nhưng chúng không ở lại lâu, không. Venice, khách lạ, thuộc về Giovanni.”\n “Giovanni không có đối thủ. Những Kindred khác cư ngụ ở đây nhờ sự khoan dung của họ, hoặc chẳng cư ngụ ở đây chút nào. Không có xung đột công khai nào quấy nhiễu màn đêm Venice, vì Giovanni không cho phép điều đó. Chúng là một gia tộc, khách lạ, cũng như một clan. Trong nhiều thế kỷ, chúng đã trú ngụ ở đây, trong ngôi nhà tổ tiên của mình, mục rữa trong các điền trang gia tộc, trong các trường đại học, trong các ngân hàng và những kẻ cho vay nặng lãi. Chúng biết những bí mật nằm ngoài cái chết, khách lạ, vì chúng đã xây dựng cả đế chế của mình trên lưng những kẻ đã chết!”\n “Một đêm, một đêm khủng khiếp, chúng sẽ mở cánh cổng đến vùng đất cấm và Venice sẽ trở thành cả thế giới, Giovanni cuối cùng làm chủ một vùng đất chết chóc và cằn cỗi.”"
 POD_travel_events.27.a: "Đã đến lúc trả nợ cho Familia."
 POD_travel_events.27.b: "Chỉ là tin đồn thôi... phải không?"
          
     
     
 