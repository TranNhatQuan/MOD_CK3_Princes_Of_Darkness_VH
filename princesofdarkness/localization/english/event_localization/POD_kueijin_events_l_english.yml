l_english:

 podkueijin.1.t: "Một Truyền Nhân Xứng Đáng?"
 podkueijin.1.desc: "Thuộc hạ của ngươi đã trở về cùng những [Glossary('Hungry Dead','game_concept_kuei_jin_desc')] triển vọng mà họ tìm được. Một số trong đó tài năng hơn những kẻ khác, nhưng cũng đòi hỏi nhiều đòn bẩy hơn để trói buộc vào sự phục vụ của ngươi. Dù sao đây vẫn sẽ là một canh bạc, ngươi không có thời gian để tự mình xem xét họ trước khi đưa ra lựa chọn, vì sự chú ý bất ngờ mà ngươi dành cho họ sẽ thu hút sự để ý của các đối thủ."
 podkueijin.1.a: "Ta không cần một kẻ quá tài giỏi. Kẻo chúng trở thành mối đe dọa..."
 podkueijin.1.a.tt: "Một người thừa kế mới sẽ xuất hiện, được xem như hậu duệ của chính ngươi."
 podkueijin.1.b: "Kẻ này ít nhất có vẻ chấp nhận được."
 podkueijin.1.c: "Ta sẽ theo dõi sự nghiệp của kẻ này với sự quan tâm lớn."
 podkueijin.1.d: "Chỉ có triển vọng tốt nhất mới được chấp nhận."

 POD_shadow_self.death_management.t: "Mất Đi Một Phần Bản Thân"
 POD_shadow_self.death_management.desc: "Tin dữ đã đến, Bóng Ngã của ngươi, một phần của chính linh hồn ngươi, đã chết. Ngươi có thể cảm thấy một sự trống rỗng khủng khiếp bên trong. Có vẻ như việc phân chia chính bản thể của mình cuối cùng vẫn có hậu quả."
 POD_shadow_self.death_management.option.a: "Lại thêm một kẻ ngã xuống."
 POD_shadow_self.death_management.option.a.tt: "Bóng Ngã của ngươi đã chết"

 podkueijin.10.t: "Khủng Hoảng [Glossary('Dharma','podgloss.dharma')]"
 podkueijin.10.desc: "Lựa chọn [Glossary('Dharma','podgloss.dharma')] không nhất thiết phải là vĩnh viễn. Hầu hết $pod_kueijin$ khởi đầu theo một con đường, rồi từ bỏ nó để theo đuổi những vận mệnh khác. Đôi khi, họ thậm chí quay lại mục đích ban đầu của mình. Bất tử mang lại phạm vi lựa chọn rộng lớn hơn bất kỳ đời người phàm nào, và những lựa chọn đó chẳng bao giờ hiển nhiên như vẻ ngoài của chúng.\nDù thế nào, vẫn có một cái giá phải trả. Mọi cấp bậc [Glossary('Dharma','podgloss.dharma')] đều bị từ bỏ; Kuei-Jin bắt đầu một Con Đường mới và mất đi mọi địa vị hay lợi ích do cấp bậc cũ mang lại. Nếu nàng đang trong 50 năm đầu của kiếp bất tử, những thất bại như vậy là điều được dự liệu trước; nàng có thể lường trước việc bị khiển trách, nhưng không đến mức bị sỉ nhục nặng nề."
 podkueijin.10.a: "Hãy làm theo bản năng của ngươi."
 podkueijin.10.b: "Ta hoàn toàn ổn..."
 
 # Initial event
 
 #podkueijin.100.t: "[Glossary('Dharma','podgloss.dharma')]"
 #podkueijin.100.desc: "Wan-Kuei have been sent back to fulfill their karmic purpose, and it is imperative that they discover what that purpose is. Each and every Wan-Kuei learns to follow a [Glossary('Dharma','podgloss.dharma')], a way of unlife whereby the Wan-Kuei seeks to discover her purpose in the Great Cycle. Through the following of a [Glossary('Dharma','podgloss.dharma')], a Wan-Kuei learns to channel Chi, understand her undead nature and re-attune herself to the karmic wheel."
 #podkueijin.100.a: "I have already achieved a [Glossary('Bodhisattva','podgloss.bodhisattva')] level of [Glossary('Dharma','podgloss.dharma')]."
 #podkueijin.100.b: "I aspire to be a [Glossary('Bodhisattva','podgloss.bodhisattva')]."
 #podkueijin.100.c: "I have already achieved an Ancestor level of [Glossary('Dharma','podgloss.dharma')]."
 #podkueijin.100.d: "I have already achieved a Mandarin level of [Glossary('Dharma','podgloss.dharma')]."
 #podkueijin.100.e: "I have already achieved a Jina level of [Glossary('Dharma','podgloss.dharma')]."
 
 podkueijin.110.t: "Âm Dương"
 podkueijin.110.desc: "Wan-Kuei mang Âm Tướng là nơi chứa đựng năng lượng tiêu cực, hướng về cái chết. Họ thường điềm tĩnh, lý trí và tàn nhẫn.\nTrái lại, Wan-Kuei mang Dương Tướng tham lam hấp thụ năng lượng sự sống. Họ là những sinh vật đầy đam mê, hòa hợp với phàm nhân và cảm xúc.\nMột số Wan-Kuei là những sinh vật của sự Cân Bằng, cơ thể họ duy trì năng lượng sự sống và cái chết ở trạng thái quân bình."
 podkueijin.110.a: "Ta thích Âm hơn." 
 podkueijin.110.b: "Ta thích được Cân Bằng." 
 podkueijin.110.c: "Ta thích Dương hơn." 
 
 podkueijin.120.t: "Khí"
 podkueijin.120.desc: "[Glossary('Wheel of Ages','podgloss.wheelofages')] này xoay chuyển nhờ sự tương tác giữa Âm và Dương, được đại diện bởi Hắc Long thần thánh và Xích Hậu. Năng lượng của sự sáng tạo thấm đẫm thế gian, chảy vào và ra khỏi [Glossary('Yang Worlds','game_concept_yang_world_desc')] và Âm Giới. Gọi là Khí, năng lượng này chảy xuyên suốt và giữa Vạn Vật.\n\nGiống như Huyết Tộc, Wan-Kuei phải chịu đựng cơn đói. Khi một Wan-Kuei có từ năm điểm Khí trở xuống (thuộc loại nào cũng vậy) trong cơ thể, họ trở nên đói khát.\n\nĐức Hạnh Khí của một Wan-Kuei cho biết Wan-Kuei đó có thể an toàn dẫn qua cơ thể mình bao nhiêu Khí thuộc một loại nhất định. Wan-Kuei có thể dễ dàng hấp thụ nhiều Khí tạm thời hơn mức Đức Hạnh Khí của họ cho phép (một sự mất cân bằng vĩnh viễn cho phép hấp thụ nhiều Khí loại đó hơn mà không gây hại). Tuy nhiên, một Wan-Kuei lạm dụng cách này có nguy cơ gặp mất cân bằng - một cơn 'quá liều' Khí nguy hiểm. Wan-Kuei không có chút Khí nào thuộc một loại cụ thể trong cơ thể cũng tự động rơi vào trạng thái mất cân bằng tạm thời."
 podkueijin.120.a: "Đây là Khí của ta." 
 
 # Maintance event

 podkueijin.200.t: "Đứt Gãy Tâm Trí: Mất Cân Bằng"
 podkueijin.200.desc: "[GetTrait('kueijin').GetName( GetNullCharacter )] phải điều tiết lượng Khí nạp vào một cách cẩn thận, kẻo phải chịu đựng sự mất cân bằng Khí. Sự mất cân bằng Khí Âm thường khiến ma cà rồng dần trở nên giống xác chết và phi nhân tính hơn theo thời gian; ngược lại, sự mất cân bằng Khí Dương có thể dẫn đến sự bùng phát của nhiều loại bệnh dịch ma cà rồng chết người và cực kỳ dễ lây lan."
 podkueijin.200.a: "Hình phạt vì quá tập trung vào Bản Ngã." 
 podkueijin.200.a.tt: "Sự gần gũi của ngươi với Âm khiến ngươi xấu xí hơn và trở thành mục tiêu tiềm năng của những kẻ săn phù thủy." 
 podkueijin.200.b: "Hình phạt cho một đời Dục Vọng." 
 podkueijin.200.b.tt: "Sự gần gũi của ngươi với Dương khiến ngươi trở thành nguồn gốc của một đợt bùng phát bệnh dịch ma cà rồng." 
 podkueijin.200.c: "Ta sẽ tập trung Khí Âm vào cơ thể mình để trở nên cân bằng hơn một chút." 

 podkueijin.201.t: "Ch'ing Shih"
 podkueijin.201.desc: "Ch'ing Shih là những quái vật lộ liễu và không thể giả dạng người thường theo bất kỳ cách nào. Da thịt của Wan-Kuei chuyển sang màu xám bệnh hoạn, trong khi xương chuyển thành màu đen tuyền. Da nhăn nheo và co lại quanh xương. Nanh mọc dài và nhỏ nọc độc, những gai đen nhô ra từ lưng, khớp xương và lồng ngực. Toàn thân phát quang lân tinh và lóe sáng năng lượng Âm."
 podkueijin.201.a: "Ta là một quái vật giữa những quái vật."
 
 # Chi mechanic event
 
 podkueijin.210.t: "Mất Kiểm Soát"
 podkueijin.210.desc: "Ngươi đã cạn Khí, có lẽ vì ngươi là một Wan-Kuei mang Dương Tướng và cảm thấy cơn đói mãnh liệt hơn, hoặc có lẽ ngươi đã dùng hết Khí của mình và không thể dùng Khí thuộc tướng còn lại vì ngươi không làm chủ được dòng chảy đó. Vậy nên ngươi mất kiểm soát và lao vào đám đông để chiếm lấy chút Khí..."
 podkueijin.210.a: "Thật đáng xấu hổ."

 podkueijin.211.t: "Thiếu Khí"
 podkueijin.211.desc: "Một [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] không còn Khí trong cơ thể bắt đầu vỡ vụn và thối rữa. Mỗi lần ngươi phải tiêu hao Khí (để kích hoạt một $pod_discipline$ hoặc chỉ đơn giản là làm cho thân xác mình cử động), ngươi mất Sức Khỏe thay vào đó, cho đến khi linh hồn song của ngươi thoát khỏi cơ thể và sự tồn tại của ngươi như một Tử Thi Trỗi Dậy kết thúc."
 podkueijin.211.a: "Ta cần Khí!" 
 
 podkueijin.220.t: "Thiết Lập Cơ Chế Khí"
 podkueijin.220.desc: "Ngươi có thể chọn nguồn dự trữ Khí nào ngươi muốn khai thác trước khi sử dụng Khí, và có quá liều hay không khi nuốt chửng Khí."
 podkueijin.220.a: "Dùng trước: #bold Khí Âm#! / Khí Dương / Ngẫu nhiên" 
 podkueijin.220.b: "Dùng trước: Khí Âm / #bold Khí Dương#! / Ngẫu nhiên" 
 podkueijin.220.c: "Dùng trước: Khí Âm / Khí Dương / #bold Ngẫu nhiên#!" 
 podkueijin.220.d: "Khi nuốt chửng Khí: #bold Không Quá Liều#! / Quá Liều" 
 podkueijin.220.e: "Khi nuốt chửng Khí: Không Quá Liều / #bold Quá Liều#!" 
 podkueijin.220.f: "Xác nhận" 

 # Dharma event
 
 podkueijin.230.t: "[Glossary('Dharma','podgloss.dharma')] Nâng Cao"
 podkueijin.230.desc: "Khi ngươi đạt tới [Glossary('Dharma','podgloss.dharma')] cao, giờ đây mỗi lần tiến bộ sẽ nâng cấp Đức Hạnh Khí của ngươi, vậy nên giờ ngươi phải chọn tướng Đức Hạnh Khí nào ngươi muốn mở rộng."
 podkueijin.230.a: "Tất cả dồn vào Âm."
 podkueijin.230.b: "Tất cả dồn vào Dương."
 podkueijin.230.c: "Dồn cho cả hai."
 
 podkueijin.231.t: "[Glossary('Hundred Clouds','podgloss.hundredclouds')]"
 podkueijin.231.desc: "Dù nhiều người khẳng định rằng không còn [Glossary('Arhats','podgloss.arhat')] nào sót lại trong thế giới tỉnh thức, có những truyền thuyết bí mật mâu thuẫn với điều này, nói rằng đúng vậy, vẫn còn vài đấng giác ngộ thần thánh này lảng vảng đâu đó. Dù họ được cho là sẽ tiến lên Thiên Đình (và nhiều vị quả thực đã làm vậy), số ít được nhắc tới vẫn ở lại Trung Nguyên theo ý muốn của mình. Điều này đặc biệt đúng với Ma Hổ, những [Glossary('Arhats','podgloss.arhat')] của họ đang chờ đợi [Glossary('Sixth Age','game_concept_sixth_age_desc')] đến..."
 podkueijin.231.a: "Ta cũng sẽ ở lại."
 podkueijin.231.b: "Ta muốn ra đi."
 
 # Misc event
 
 podkueijin.240.t: "Shintai"
 podkueijin.240.desc: "Một nghệ thuật mới đã được phát triển, shintai, hậu duệ của nghệ thuật thân thể thần thánh."
 podkueijin.240.a: "Một bước phát triển thú vị."
 podkueijin.240.a.tt: "Mọi [GetTrait('kueijin').GetName( GetPlayer )] đều có quyền tiếp cận [shintai_lifestyle|E]."
 
 podkueijin.250.t: "Kỷ Nguyên Thứ Năm"
 podkueijin.250.desc: "[Glossary('Wheel of Ages','podgloss.wheelofages')] đã bước sang thời đại tiếp theo, khi các kỷ nguyên trôi qua, việc hút máu trở nên khó khăn hơn, khí trở nên hiếm hoi hơn và sự giác ngộ mất nhiều thời gian hơn."
 podkueijin.250.a: "Kỷ Nguyên của bóng tối."
 
 #podkueijin.260.t: "Spiritual Component Destroyed"
 #podkueijin.260.desc: "Dhampyr are dhampyr regardless of any special parentage. The power of [GetTrait('kueijin').GetName( GetPlayer )] blood either overwhelms any other inherited spiritual component or kills the child in the womb."
 #podkueijin.260.a: "My breeding plan is ruined."
 
 # Adoption event
 
 podkueijin.300.t: "Một Truyền Nhân Xứng Đáng?"
 podkueijin.300.desc: "Ngươi triệu tập thuộc hạ của mình để tìm kiếm thông tin về chih-mei (những $pod_kueijin$ vừa hồi sinh) quanh lãnh địa của ngươi, và ngươi đã chuẩn bị vật liệu cần thiết cho nghi lễ giúp họ lấy lại lý trí. Ngươi có thể chỉ định thêm yêu cầu để can dự sâu hơn vào quá trình này, nhưng càng cụ thể, chi phí càng cao.\nTrước hết, ngươi có muốn một kẻ vừa trở về từ [UmbraGlossaryLocalized('yomi_wan','Địa Ngục Yomi')] gần đây và vừa hít Hơi Thở Thứ Hai không? Đây là lựa chọn thông thường và phổ biến hơn nhiều. Nhưng ngươi cũng có thể yêu cầu một [GetTrait('shih').GetName( GetPlayer )] nào đó đã đánh mất toàn bộ nhân tính và đánh thức P'o của mình. Những thợ săn ma quỷ sa ngã đó hiếm hơn nhiều nhưng rõ ràng vẫn giữ được vài kỹ năng của mình ngay cả sau khi chết."
 podkueijin.300.a: "Không cần cầu kỳ."
 podkueijin.300.b: "Ta cần một cựu thợ săn ma quỷ."
 podkueijin.300.c: "Đức [Glossary('Emma-O','podgloss.emmao')] sẽ ban cho ta một [Glossary('Shikome','podgloss.shikome')]."

 podkueijin.310.desc: "Ngươi muốn truyền nhân của mình ở độ tuổi và giới tính nào? Con người chết đi bất kể tuổi trẻ của họ trong thời đại này, vì vậy điều đó sẽ không gây thêm khó khăn gì cho các trinh sát của ngươi trong việc tìm kiếm."
 podkueijin.310.a: "Một chàng trai trẻ."
 podkueijin.310.b: "Một người đàn ông trung niên."
 podkueijin.310.c: "Một ông già."
 podkueijin.310.d: "Một cô gái trẻ."
 podkueijin.310.e: "Một người phụ nữ trung niên."
 podkueijin.310.f: "Một bà lão."
 passion_bloodflowers_extra_cost_tt: "Cốt Hoa về mặt kỹ thuật không cấm đàn ông học hỏi [Glossary('Dharma','podgloss.dharma')] của họ nhưng việc cố gắng khai sáng cho một người đàn ông vẫn bị xem là hành động rất thất lễ."
 
 #podkueijin.320.t: "A Worthy Successor?"
 #podkueijin.320.desc: "With time and efforts, your servant will eventually find a target with the necessary requirements, but this will add to the end cost of this whole endeavor."
 #podkueijin.320.a: "Find me someone that had this body feature before their second breath."
 #podkueijin.320.a.tt: "You will be presented with a choice of body features"
 #podkueijin.320.b: "Some average body is enough."

 podkueijin.321.desc: "Vẻ đẹp nằm trong mắt kẻ chiêm ngưỡng... và lần này ngươi chính là kẻ chiêm ngưỡng đó. Ngươi có thể yêu cầu đội trinh sát của mình tìm kiếm những ứng viên đáp ứng những tiêu chí cụ thể của ngươi.\nMay thay, $pod_kueijin$ trở về từ các Địa Ngục có cơ thể được trẻ hóa so với bất cứ thứ gì đã giết chết họ ban đầu. Một số thậm chí thấy mình trông trẻ hơn đáng kể, có lẽ vì đây là cách họ hình dung "bản thân tốt nhất" của mình. Lý do chính xác cho quá trình kỳ lạ này vẫn còn là vấn đề tranh luận giữa các học giả."
 podkueijin.321.a: "Một Điêu Thuyền tái sinh."
 podkueijin.321.b: "Một vẻ đẹp không gì sánh bằng."
 podkueijin.321.c: "Xinh đẹp cũng chẳng hại gì."
 podkueijin.321.d: "Chỉ cần một người bình thường thôi."

 podkueijin.322.desc: "Con đường giác ngộ theo Pháp Môn chẳng hề dễ dàng. Và chắc chắn không dành cho kẻ ngu ngốc.\nDù các [UmbraGlossaryLocalized('yomi_wan','Địa Ngục Yomi')] hoạt động như một cách khá hiệu quả để loại bỏ những kẻ vốn không nên quay trở lại ngay từ đầu, nó cũng đồng thời đóng vai trò như một sức mạnh cân bằng. Ngay cả một nông dân mù chữ cũng có thể thể hiện sự thông tuệ vốn chỉ dành riêng cho các bậc hiền triết khi đối mặt với nghịch cảnh như vậy."
 podkueijin.322.a: "Ta muốn một Gia Cát Lượng thời hiện đại!"
 podkueijin.322.b: "Một kẻ xứng đáng với trí tuệ của ta."
 podkueijin.322.c: "Có chút thông minh cũng là điều hữu ích."
 podkueijin.322.d: "Chỉ cần một người bình thường thôi."

 podkueijin.323.desc: "Trong khi một số [UmbraGlossaryLocalized('yomi_wan','Địa Ngục Yomi')] ưa chuộng tra tấn trí tuệ hoặc tinh thần, hầu hết ít nhất cũng kết hợp vài hình thức thể xác. $pod_kueijin$ hồi sinh cũng đang trong trạng thái phẫn cuồng, nghĩa là họ bản năng đẩy sức mạnh thể chất của mình đến giới hạn ở giai đoạn này.\nMột số [Glossary('Dharma','podgloss.dharma')], như Ma Hổ, thực sự cố gắng vun đắp những tài năng thể chất sớm này trong khi những Pháp Môn khác, như Cốt Hoa, có xu hướng gác lại chuyện đó sau này để ưu tiên những theo đuổi trí tuệ hơn."
 podkueijin.323.a: "Tìm cho ta một Quan Vũ của riêng ta!"
 podkueijin.323.b: "Sức mạnh quả thực quan trọng."
 podkueijin.323.c: "Chỉ cần khỏe mạnh là đủ."
 kj_education_wait_tt: "Việc tìm kiếm học trò của ngươi sẽ bắt đầu. Sẽ mất vài tháng."   

 #podkueijin.324.t: "A Worthy Successor?"
 #podkueijin.324.desc: "Any extra prerequisites?"
 #podkueijin.324.a: "Albino."
 #podkueijin.324.b: "Giant."
 #podkueijin.324.c: "Dwarf."
 #podkueijin.324.d: "Nothing more."

 #podkueijin.325.t: "A Worthy Successor?"
 #podkueijin.325.desc: "This is you last chance to change your target before sending out the search party."
 #podkueijin.325.a: "That is all. Get searching!"
 #podkueijin.325.b: "Go back and choose again."
 
 podkueijin.350.t: "Một Học Trò Xứng Đáng"
 podkueijin.350.desc: "Thuộc hạ của ngươi mang đến kẻ phù hợp nhất với mọi tiêu chí của ngươi, giờ đã đến lúc để Hin này học về [Glossary('Dharma','podgloss.dharma')] và trở thành học trò của ngươi.\nVừa thoát khỏi nỗi kinh hoàng của [UmbraGlossaryLocalized('yomi_wan','Địa Ngục Yomi')], những $pod_kueijin$ mới đến thường xuất hiện trong trạng thái phẫn cuồng gây nguy hiểm cho cả bản thân họ lẫn những người xung quanh.\nNhiệm vụ của [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')] là xác định vị trí những quái vật sơ sinh đó, khuất phục họ nếu cần thiết, rồi đưa họ trở về triều đình của mình.\nMột khi đến nơi, một nghi lễ được thực hiện để xoa dịu P'o đang cuồng nộ của $pod_kueijin$, khiến họ phù hợp trở lại với cuộc sống văn minh.\nChỉ sau khi tất cả những điều này hoàn tất thì việc học Pháp Môn đích thực mới có thể bắt đầu."
 podkueijin.350.a: "Tiến hành nghi lễ khôi phục cân bằng Pháp Môn."
 podkueijin.351.desc: "Thuộc hạ của ngươi mang đến món quà mới nhất từ Đức [Glossary('Emma-O','podgloss.emmao')], giờ đã đến lúc để Hin này học về [Glossary('Dharma','podgloss.dharma')] và trở thành học trò của ngươi.\nVừa thoát khỏi nỗi kinh hoàng của [Glossary('Kakuri','podgloss.kakuri')], những [Glossary('Shikome','podgloss.shikome')] mới đến thường xuất hiện trong trạng thái phẫn cuồng gây nguy hiểm cho cả bản thân họ lẫn những người xung quanh.\nNhiệm vụ của [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')] là khuất phục và dạy dỗ họ về nhiệm vụ vinh quang mà họ được giao phó.\nSau khi lấy lại lý trí, một nghi lễ được thực hiện để xoa dịu P'o đang cuồng nộ của [Glossary('Shikome','podgloss.shikome')], khiến họ phù hợp trở lại với cuộc sống văn minh.\nChỉ sau khi tất cả những điều này hoàn tất thì việc học Pháp Môn đích thực mới có thể bắt đầu, để chuẩn bị cho người hầu mới tận tụy của Đức [Glossary('Emma-O','podgloss.emmao')] cho cuộc đời làm một vũ khí xinh đẹp của Daimyo Bóng Tối."
 
 podkueijin.400.t: "Học Tập [Glossary('Dharma','podgloss.dharma')]: Cân Bằng"
 podkueijin.400.desc: "Huyết tộc Đông phương chia mình thành ba loại rộng, tùy theo tỷ lệ năng lượng Âm/Dương của họ. Sự khác biệt giữa Âm và Dương càng lớn, tính cách của ma cà rồng càng rõ rệt.\nÂm là năng lượng của cái chết, thường lạnh lùng và tàn nhẫn trong khi Dương là năng lượng của sự sống, ấm áp nhưng đôi khi hung tợn.\n$pod_kueijin$ trẻ tuổi thường vật lộn để duy trì Cân Bằng giữa những năng lượng đối lập đó và trong khi một số [Glossary('Dharma','podgloss.dharma')] rao giảng sự mất cân bằng, đó không phải điều dễ nắm bắt với một kẻ mới. Do đó, họ dễ bị một trong hai năng lượng lấn át cho đến khi tự mình hiểu ra vấn đề.\n\nHọc trò của ngươi hiện đang chịu sự mất cân bằng nào?"
 podkueijin.400.a: "Một sự mất cân bằng Dương rõ ràng. Họ đang bồn chồn không yên."
 podkueijin.400.b: "Một sự mất cân bằng Âm. Họ đang sống ẩn dật."
 podkueijin.400.c: "Hiện tại họ đang khá cân bằng."
 
 podkueijin.401.t: "Học Tập [Glossary('Dharma','podgloss.dharma')]: Phương Hướng"
 podkueijin.401.desc: "Hầu hết $pod_kueijin$ nhận thấy mình được giao một "phương hướng," một mục đích cụ thể mà họ được kỳ vọng hoàn thành suốt kiếp bất tử. Thông qua sự tương tác đúng đắn giữa phương hướng và [Glossary('Dharma','podgloss.dharma')], các quan lại nói vậy, mỗi $pod_kueijin$ khám phá ra vận mệnh tổng thể của mình.\nViệc gán phương hướng là một sự kiện lớn ở nhiều triều đình; các thầy bói $pod_kueijin$ khổ công tra cứu kinh sách bói toán và nghiên cứu các vì sao dưới đó ma cà rồng mới trải qua Hơi Thở Thứ Hai, tất cả nhằm xác định phương hướng được định đoạt bởi thần linh.\n\nMa cà rồng phương bắc là những kẻ gìn giữ và thực thi truyền thống; họ là các quan tòa, đao phủ và thẩm phán của cả xã hội $pod_kueijin$ lẫn phàm nhân.\nMa cà rồng phương tây nghiên cứu các thế giới linh hồn để phục vụ như sứ giả và người canh giữ Khí; trớ trêu thay, họ cũng làm gián điệp và sát thủ khi cần thiết.\nMa cà rồng phương đông là đẳng cấp "người gặt hái", những "nông dân" đảm bảo đàn phàm nhân luôn hài hòa và khỏe mạnh; họ hành động như những kẻ khiêu khích khi cần thiết.\nMa cà rồng phương nam là những "chim lửa" — nhiệm vụ của họ là thúc đẩy sự thay đổi trong Chu Kỳ và dẫn dắt $pod_kueijin$ vào trận chiến.\nCuối cùng, ma cà rồng trung tâm là những học giả nghiên cứu sự tương tác vĩnh cửu giữa Hun và P'o, Âm và Dương, $pod_kueijin$ và các shen khác. Nhiệm vụ của họ là khám phá — hoặc tạo ra — những bí ẩn của sự tồn tại siêu nhiên.\n\nHọc trò của ngươi sẽ được gán phương hướng nào?"
 podkueijin.401.a: "Phương Bắc"
 podkueijin.401.b: "Phương Đông"
 podkueijin.401.c: "Trung Tâm"
 podkueijin.401.d: "Phương Nam"
 podkueijin.401.e: "Phương Tây"

 podkueijin.402.t: "Học Tập [Glossary('Dharma','podgloss.dharma')]: [Glossary('Wu','podgloss.wu')]"
 podkueijin.402.desc: "Ý tưởng về sự hỗ trợ tương hỗ tự nhiên giữa những $pod_kueijin$ cùng chí hướng quy định cấp độ tương tác và xác định xã hội chính trong xã hội $pod_kueijin$. Họ tự tổ chức thành các nhóm năm người (thường là vậy), theo truyền thống gọi là [Glossary('Wu','podgloss.wu')]. Một [Glossary('Wu','podgloss.wu')] hoạt động như gia đình thay thế của một $pod_kueijin$ trong cơ hội tồn tại thứ hai này.\nMột nhóm năm ma cà rồng (mỗi phương hướng một người) được xem là con số may mắn và hài hòa nhất cho một [Glossary('Wu','podgloss.wu')]; tuy nhiên, nhiều [Glossary('Wu','podgloss.wu')] gồm nhiều hoặc ít $pod_kueijin$ hơn và pha trộn các phương hướng khác nhau.\n\nWu không phải một mối quan hệ "trọn đời" và việc một kẻ mới đến trẻ tuổi, như học trò của ngươi, được gán vào một "[Glossary('Wu','podgloss.wu')] nhập môn" cùng những người trẻ khác để cùng nhau bước những bước đầu tiên là điều bình thường. Vì đây không phải một [Glossary('Wu','podgloss.wu')] thực sự, lâu dài (dù nó có thể trở thành như vậy), sự sắp xếp này nằm dưới sự kiểm soát của ngươi. Vì vậy ngươi có thể chọn tập trung nỗ lực của họ vào bất kỳ lĩnh vực cụ thể nào."
 podkueijin.402.a: "Các ngươi sẽ phục vụ như sứ giả của ta."
 podkueijin.402.b: "Giúp ta quản lý lãnh địa của ta."
 podkueijin.402.c: "Vài nhiệm vụ tế nhị cần sự chú ý của các ngươi."
 
 podkueijin.403.t: "Học Tập [Glossary('Dharma','podgloss.dharma')]: Một Kết Thúc"
 podkueijin.403.desc: "Vào thời cổ đại, phải mất mười năm để dạy dỗ một Hin, nhưng với thời đại hiện tại nhiều biến động hơn, chỉ hai năm đã trở thành chuẩn mực.\nĐệ tử của ngươi giờ đã là một sự bổ sung đáng giá cho xã hội $pod_kueijin$, đủ tự tin vào [Glossary('Dharma','podgloss.dharma')] của mình để không còn để bản chất hoang dã chi phối nữa. Giờ là lúc để họ tự mình tìm kiếm những trải nghiệm mới và những khoảnh khắc minh mẫn, hoặc có lẽ gia nhập phe ngươi cho những vấn đề thực tế hơn.\nHọ sẽ trở thành một đồng minh trung kiên hay một kẻ thù dai dẳng? Thời gian sẽ trả lời, như nó vẫn luôn làm vậy."
 podkueijin.403.a: "Thế giới đang chờ đợi ngươi."
 
 #podkueijin.500.t: "Forge Personality"
 #podkueijin.500.desc: "Recently regaining conscience, your disciple missed a lot of first breath experience. As sifu, you should teach your disciple how to truly look into the world, and you recently found a opportunity to do just that."
 #podkueijin.500.skip: "Maybe next time"
 #podkueijin.501.a: "Be bold, even in trouble."
 #podkueijin.501.b: "Be careful if trouble arises."
 #podkueijin.502.a: "You have time."
 #podkueijin.502.b: "Show your wrath."
 #podkueijin.503.a: "Loyal to your consort."
 #podkueijin.503.b: "Love is for all."
 #podkueijin.504.a: "You are ok."
 #podkueijin.504.b: "Go for more."
 #podkueijin.505.a: "You have a cause."
 #podkueijin.505.b: "Time is on our side."
 #podkueijin.506.a: "There always is another way."
 #podkueijin.506.b: "Stay as your are."
 #podkueijin.507.a: "Revenge is eternal."
 #podkueijin.507.b: "Hatred is not the point."
 #podkueijin.508.a: "Gold is not the concern."
 #podkueijin.508.b: "Nothing is possible without money."
 #podkueijin.509.a: "You can trust people."
 #podkueijin.509.b: "You can't trust no one."
 #podkueijin.510.a: "Be honest."
 #podkueijin.510.b: "A little lie doesn't hurt."
 #podkueijin.511.a: "You are just one among many."
 #podkueijin.511.b: "You are excellent."
 #podkueijin.512.a: "Law above all."
 #podkueijin.512.b: "You above all."
 #podkueijin.513.a: "Give it time."
 #podkueijin.513.b: "Time doesn't wait."
 #podkueijin.514.a: "Pleasures are a distraction."
 #podkueijin.514.b: "Enjoy your life."
 #podkueijin.515.a: "Trust is the key."
 #podkueijin.515.b: "Betray the world before it betrays you."
 #podkueijin.516.a: "Loyal to your path."
 #podkueijin.516.b: "Your path is not so important."
 #podkueijin.517.a: "Be nice."
 #podkueijin.517.b: "Think of yourself first."
 #podkueijin.517.c: "Share your pain to the world."
 
 # Celebration general event
 
 podkueijin.1010.desc: "Ngươi tự hỏi tại sao lại chấp nhận lời mời của ta chỉ để rồi tham dự buổi lễ ăn mừng của [other_host.GetTitledFirstNamePossessive] thay vào đó, nhưng hãy biết rằng ta sẽ ghi nhớ chuyện này."
 podkueijin.1010.a: "Thật đáng tiếc."
 
 podkueijin.1011.opening: "[sender.Custom2('AppropriateGreeting', ROOT.Char)]"
 podkueijin.1011.opening_desc: "Ta đây xin mời ngươi đến một buổi lễ ăn mừng tại triều đình của ta ở [barony.GetNameNoTier]!"
 podkueijin.1011.host_likes_me: "Ta hy vọng ngươi sẽ tham dự, vì nếu không sự vắng mặt của ngươi sẽ khiến ta vô cùng tiếc nuối."
 podkueijin.1011.host_gets_along_with_me: "Là một [ROOT.Char.GetTitleTierName] đáng chú ý, ta sẽ lấy làm vinh hạnh nếu ngươi tham dự."
 podkueijin.1011.host_dislikes_me: "Ta mong mọi nhân vật có tiếng đều có mặt, tiếc thay điều đó bao gồm cả ngươi."
 podkueijin.1011.a: "Tất nhiên ta sẽ tham dự."
 podkueijin.1011.b: "Ta sẽ tham dự. Một cách miễn cưỡng."
 podkueijin.1011.c: "Ta buồn phải nói rằng ta đang bận."
 podkueijin.1011.d: "Không, ta từ chối!"

 podkueijin.1012.desc: "Ta đây xin mời ngươi đến một buổi lễ ăn mừng tại triều đình của ta ở [barony.GetNameNoTier]! Đây sẽ là một sự kiện hoành tráng, xứng đáng với sự hiện diện danh giá của ngươi."
 podkueijin.1012.a: "Đó sẽ là vinh hạnh của ta."
 podkueijin.1012.b: "Ta có những việc quan trọng hơn cần giải quyết."

 podkueijin.1013.desc: "Ta đây xin mời ngươi đến một buổi lễ ăn mừng tại triều đình của ta ở [barony.GetNameNoTier]! Đây sẽ là một sự kiện hoành tráng, với 'món tráng miệng' và những trò giải trí thú vị."
 podkueijin.1013.a: "Đó sẽ là vinh hạnh của ta."
 podkueijin.1013.b: "Ta có những việc quan trọng hơn cần giải quyết."
 
 podkueijin.1021.t: "Lễ Ăn Mừng: Một Cuộc Tụ Họp Vui Vẻ"
 podkueijin.1021.desc: "Các vị khách tụ tập trong đại sảnh, những bậc danh giá đến từ khắp nơi gần xa trong vương quốc.\n\nKhông khí thật tươi vui, tinh thần phấn khởi khi buổi lễ ăn mừng bắt đầu!"
 podkueijin.1021.a: "Chào mừng, các bạn hữu!"
 podkueijin.1021.a.tt: "Buổi lễ ăn mừng bắt đầu"
 
 podkueijin.1022.t: "Một Lời Chào Đón Nồng Hậu"
 podkueijin.1022.likes_host: "Mọi vị khách đã tụ tập trong đại sảnh, và chủ nhân hiếu khách của chúng ta, [activity.GetOwner.GetTitledFirstName], đã chào đón tất cả chúng ta đến buổi lễ ăn mừng!"
 podkueijin.1022.dislikes_host: "Mọi vị khách đã tụ tập trong đại sảnh, và chủ nhân [activity.GetOwner.Custom('InsultAdjective')] của chúng ta, [activity.GetOwner.GetTitledFirstName], cuối cùng cũng đã chào đón tất cả chúng ta đến buổi lễ ăn mừng."
 podkueijin.1022.a.gregarious: "Ta nóng lòng muốn trò chuyện với mọi người!"
 podkueijin.1022.a.shy: "Có khá nhiều người ở đây..."
 podkueijin.1022.a: "Ta rất mong chờ điều này!"
 podkueijin.1022.b: "Chuyện này tốt hơn hết là đáng để ta bỏ thời gian ra."
 
 podkueijin.1041.t: "Lễ Ăn Mừng: Khi Các Vị Khách Ra Về"
 podkueijin.1041.desc: "Khi mọi người đã lên đường về nhà mình, ta tự hào nói rằng buổi lễ ăn mừng đã thành công!"
 podkueijin.1041.spouse: "\n\nTa phải cảm ơn [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] [spouse.GetFirstName] của ta vì phần lớn thành công này, và ta chẳng cảm thấy gì ngoài lòng biết ơn khi [spouse.GetSheHe] tiễn những vị khách cuối cùng ra về."
 podkueijin.1041.no_spouse: "Dù vậy, ta vẫn biết ơn vì công việc này đã kết thúc, ít nhất là hiện tại."
 podkueijin.1041.a: "Hẹn gặp lại lần sau!"

 podkueijin.1042.t: "Lễ Ăn Mừng: Trở Về Nhà"
 podkueijin.1042.desc: "Ôi thật là một buổi lễ ăn mừng! Ta sẽ nhớ mãi những ngày tháng ở trong đại sảnh của [host.GetTitledFirstNamePossessive] trong một thời gian dài sắp tới.\n\nGiờ là lúc rửa sạch dấu vết của cuộc vui và 'món tráng miệng', rồi một lần nữa tiếp tục nhiệm vụ của ta như một nhà cai trị trong thế giới siêu nhiên."
 podkueijin.1042.a: "Tạm biệt, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))] của ta!"

 podkueijin.1090.t: "Nhiệm Vụ Bị Bỏ Bê"
 podkueijin.1090.desc: "Thật là một thảm họa!\n\nSau tất cả sự chuẩn bị của ta, các vị khách của ta đã đến một buổi lễ ăn mừng không có chủ nhân!\nHọ đã về nhà, và ta đã để lại cho họ một ấn tượng khủng khiếp về mình."
 podkueijin.1090.a: "Ta có thể sẽ hối tiếc vì điều này."
 
 podkueijin.1091.t: "Một Buổi Lễ Ăn Mừng Tồi Tệ"
 podkueijin.1091.desc: "Ta không thể tin được. Dù đã có lời mời và sự chuẩn bị của ta, không một vị khách nào xuất hiện tại buổi lễ ăn mừng của ta.\n\nKhông sao cả! Ta sẽ tự mình tận hưởng toàn bộ 'món tráng miệng' này, và tiếng vọng của bước chân trong đại sảnh của ta chính là tất cả sự đồng hành ta cần!"
 podkueijin.1091.a: "Chẳng lẽ ta thực sự cô độc đến vậy?"
 podkueijin.1091.b: "Ta cảm thấy nhẹ nhõm đôi chút."
 
 podkueijin.1092.t: "Lễ Ăn Mừng: Không Có Người Tham Dự"
 podkueijin.1092.desc: "Thật là một vụ tai tiếng! [activity.GetOwner.GetTitledFirstName] đã không xuất hiện tại chính buổi lễ ăn mừng của [activity.GetOwner.GetHerHis]!\n\nCó phải [activity.GetOwner.GetSheHe] đang cố biến tất cả chúng ta thành trò cười?"
 podkueijin.1092.a: "Đây quả là một sự lãng phí thời gian!"

 podkueijin.1093.t: "Lễ Ăn Mừng: Kết Thúc Lễ Hội"
 podkueijin.1093.desc: "Với sự ra đi của [host.Custom2('MyCharacterIntroduction', ROOT.Char)] buổi lễ ăn mừng của [host.GetHerHis] đến hồi kết thúc.\n\nKhi các vị khách lặng lẽ ra về, ta cầu nguyện rằng [ROOT.Char.GetFaith.HighGodNameAlternate] sẽ chào đón [host.GetFirstName] đến [ROOT.Char.GetFaith.PositiveAfterLife] nồng hậu như [host.GetSheHe] đã chào đón chúng ta đến đại sảnh của [host.GetHerHis]."
 podkueijin.1093.a: "Kết thúc buổi lễ ăn mừng."

 podkueijin.1094.desc: "Vì giờ ta bị giam sau song sắt, buổi lễ ăn mừng hoành tráng của ta sẽ bị hủy bỏ. Ôi, tất cả những giờ ta đã bỏ ra để chuẩn bị nó... Uổng phí!"

 podkueijin.1095.desc: "[host.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã bị cầm tù, và buổi lễ ăn mừng hoành tráng của [host.GetHerHis] đã đến hồi kết thúc. Thật là một thời điểm không may mắn!"
 
 # Art Traning event
 art_train_header: "Rèn Luyện Nghệ Thuật:"
 
 podkueijin.1101.t: "$art_train_header$ Lời Lẽ Kỳ Lạ"
 podkueijin.1101.desc: "Ngươi đang tìm kiếm trong bộ sưu tập những cuốn sách kỳ lạ của mình để tìm cảm hứng, khi một trong số đó thu hút sự chú ý của ngươi, một cuốn được viết bởi một tác giả phương Tây nào đó. Trong một câu, họ nói rằng ma cà rồng phương Đông dùng câu 'chúc ngươi sống trong thời kỳ thú vị' như một lời lăng mạ... nhưng, điều này có nghĩa là gì?"
 podkueijin.1101.a: "Nó chẳng có ý nghĩa gì cả."
 podkueijin.1101.b: "Ta sẽ dịch câu này thành 'chúc ngươi sinh ra trong một gia đình tốt hơn'."
 
 podkueijin.1102.t: "$art_train_header$ Chạm Đến Ngưỡng Giới Hạn"
 podkueijin.1102.desc: "Ngươi đã khổ luyện chăm chỉ và thành công, nhưng ngươi có một cảm giác day dứt rằng mình có thể làm tốt hơn nữa, vậy nên có lẽ ngươi nên tự thúc ép bản thân thêm một chút, nhưng cũng có thể ngươi sẽ thụt lùi thay vào đó."
 podkueijin.1102.a: "Ta sẽ không ép buộc bản thân."
 podkueijin.1102.b: "Ta sẽ ép buộc bản thân."
 
 podkueijin.1199.t: "$art_train_header$ Kết Quả Rèn Luyện"
 podkueijin.1199.desc_shintai: "Việc ngươi liên tục chiến đấu và luyện tập cùng người khác đã mang lại vài kết quả.\n\n"
 podkueijin.1199.desc_chi_arts: "Sự phối hợp liên tục của ngươi với năng lượng khí xung quanh đã mang lại vài kết quả.\n\n"
 podkueijin.1199.desc_soul_arts: "Công việc liên tục của ngươi trên các nghệ thuật linh hồn đã mang lại vài kết quả.\n\n"
 podkueijin.1199.desc_demon_arts: "Sự tương tác liên tục của ngươi với Ác Quỷ của mình đã mang lại vài kết quả.\n\n"
 podkueijin.1199.desc_qiao: "Những nỗ lực liên tục của ngươi để kết nối bản thân với thế giới đã mang lại vài kết quả.\n\n"
 podkueijin.1199.desc_tan: "Thí nghiệm liên tục của ngươi với các vật liệu mới đã mang lại vài kết quả.\n\n"
 podkueijin.1199.desc_wu_tan: "Thí nghiệm liên tục của ngươi với các nguyên tố đã mang lại vài kết quả.\n\n"
 podkueijin.1199.desc_no_focus: "Sự thay đổi trọng tâm nhanh chóng của ngươi có thể mang lại vài kết quả kỳ lạ...\n\n"
 podkueijin.1199.desc_good: "Ngươi đã tiến bộ rất nhiều trong sức mạnh nghệ thuật của mình."
 podkueijin.1199.desc_good_bad: "Ngươi đã thu được rất nhiều kinh nghiệm cho nghệ thuật của mình."
 podkueijin.1199.desc_same: "Ngươi chỉ vừa học được một chút ít."
 podkueijin.1199.desc_bad_good: "Ngươi đã ép buộc quá mức, điều này đã cho Ác Quỷ của ngươi một cơ hội để tấn công."
 podkueijin.1199.desc_bad: "Ác Quỷ của ngươi đã hoàn toàn bung tỏa khi cuộc luyện tập của ngươi đã sai lệch."
 podkueijin.1199.desc_fallback: "Mong rằng lần sau ngươi sẽ làm tốt hơn."
 podkueijin.1199.a: "Rất tốt."
 podkueijin.1199.a.ex: "Ta sẽ dùng kiến thức [Glossary('Dharma','podgloss.dharma')] của mình để hiểu thêm nữa!"
 podkueijin.1199.b: "Vậy là đủ rồi."
 podkueijin.1199.b.ex: "Ta sẽ dùng kiến thức [Glossary('Dharma','podgloss.dharma')] của mình để rút ra một kết luận!"
 podkueijin.1199.c: "Còn hơn không có gì."
 podkueijin.1199.c.ex: "Kiến thức [Glossary('Dharma','podgloss.dharma')] của ta sẽ giúp ta có thêm nhiều hơn."
 podkueijin.1199.d: "Ta sẽ chống cự."
 podkueijin.1199.d.ex: "Ta sẽ dùng kinh nghiệm [Glossary('Dharma','podgloss.dharma')] của mình để xoa dịu tình huống này."
 podkueijin.1199.e: "Nó đến rồi đây..."
 podkueijin.1199.e.ex: "Ta sẽ dùng nhiều tiến bộ [Glossary('Dharma','podgloss.dharma')] của mình để tránh điều này."
 
 # Trek the Wild event
 trek_header: "Lang Thang Nơi Hoang Dã:"
 
 podkueijin.1201.t: "$trek_header$ Một đệ tử [GetTrait('shih').GetName( GetPlayer )]"
 podkueijin.1201.desc: "Ngươi đang đi bộ trong vùng hoang dã thì bị một thợ săn quái vật trẻ tuổi chặn lại. Ngươi có muốn đùa giỡn với kẻ thách đấu này không?."
 podkueijin.1201.a: "Ta sẽ cho ngươi thấy."
 podkueijin.1201.b: "Ta nên chạy thì hơn."
 
 podkueijin.1202.t: "$trek_header$ Một Sư Phụ [GetTrait('shih').GetName( GetPlayer )]"
 podkueijin.1202.desc: "Có vẻ như sư phụ của đệ tử đó ở gần đây, ông ta đã cứu đệ tử của mình khỏi tay ngươi, và đã kiềm chế bản thân trước nhu cầu trả thù ngay cả sau khi ngươi làm tổn thương đệ tử của ông ta. Một sự kiềm chế hiếm có từ phía [GetTrait('shih').GetName( GetPlayer )]."
 podkueijin.1202.a: "Lại thêm một xác chết."
 podkueijin.1202.b: "Ta sẽ để họ đi."
 
 podkueijin.1211.t: "$trek_header$ Động Vật Kỳ Lạ"
 podkueijin.1211.desc_opening: "Ngươi đã lang thang giữa nơi hoang vắng một thời gian cho đến khi tình cờ gặp một "
 podkueijin.1211.desc_white_deer: "đàn hươu trắng"
 podkueijin.1211.desc_rhinoceros: "đàn tê giác"
 podkueijin.1211.desc_green_peafowl: "đàn công lục"
 podkueijin.1211.desc_panda: "đàn gấu trúc"
 podkueijin.1211.desc_snub_nosed_monkey: "đàn khỉ mũi hếch"
 podkueijin.1211.desc_ending: "gần ngươi, săn được một loài động vật hiếm như vậy chắc chắn sẽ mang lại uy tín cho ngươi."
 podkueijin.1211.a: "Ta sẽ bắt lấy chúng."
 podkueijin.1211.a.success: "Ta đã thành công."
 podkueijin.1211.a.failure: "Ta đã thất bại."
 podkueijin.1211.b: "Ta sẽ để chúng đi."
 
 podkueijin.1221.t: "Cuộc Gặp Gỡ với Đức Trang Nghiêm Nhất Bà Chúa Ngọc Trai Đen, Mẫu Thân của Bóng Tối"
 podkueijin.1221.desc: "Ngươi đã gặp [Glossary('Arhat','podgloss.arhat')] danh tiếng của Cốt Hoa, người cũng trông giống như một cô gái mười sáu tuổi. Khó tìm, và được canh giữ bởi một đoàn tùy tùng hùng hậu gồm những tín đồ và linh hồn triệu hồi của họ, bà vẫn sẵn lòng chia sẻ trí tuệ của mình với những ai tìm được bà. Ước nguyện chân thành của bà là bảo tồn càng nhiều tri thức càng tốt để chuẩn bị cho [Glossary('Sixth Age','game_concept_sixth_age_desc')] sắp tới."
 podkueijin.1221.a: "Đó là vinh dự của ta."
 
 podkueijin.1299.t: "$trek_header$ Trở Về Từ Nơi Hoang Dã"
 podkueijin.1299.desc_opening: "Ngươi đã kết thúc cuộc phiêu lưu của mình, trở về nhà để nghỉ ngơi.\n\n"
 podkueijin.1299.desc_good: "Hành động vĩ đại của ngươi đã được biết đến khắp nơi, họ ngưỡng mộ việc làm của ngươi."
 podkueijin.1299.desc_good_bad: "Giờ đây có một số câu chuyện bịa đặt về ngươi, thậm chí vài câu chuyện còn tốt đẹp."
 podkueijin.1299.desc_same: "Gần như không ai biết ngươi đã làm gì, một số thậm chí còn nhận ra ngươi vắng mặt."
 podkueijin.1299.desc_bad_good: "Giờ đây có một số câu chuyện bịa đặt về ngươi, hầu hết đều xấu."
 podkueijin.1299.desc_bad: "Hành động đáng xấu hổ của ngươi đã được biết đến khắp nơi, điều này sẽ ảnh hưởng đến uy tín của ngươi."
 podkueijin.1299.desc_fallback: "Vì lý do nào đó, hành động của ngươi chưa bao giờ được ghi lại..."
 podkueijin.1299.a: "Xuất sắc."
 podkueijin.1299.a.ex: "Tìm cho ta một người kể chuyện, mọi người nên biết đến huyền thoại của ta!"
 podkueijin.1299.b: "Tốt."
 podkueijin.1299.b.ex: "Không! Ta phải thuê ai đó để nói thay cho ta!"
 podkueijin.1299.c: "Cũng được."
 podkueijin.1299.c.ex: "Chà, ta luôn hoan nghênh vài tin đồn hữu ích."
 podkueijin.1299.d: "Ta thà rằng họ kỳ vọng ở ta ít hơn."
 podkueijin.1299.d.ex: "Điều này có thể tệ, nếu chúng ta không có 'một phiên bản khác' của câu chuyện..."
 podkueijin.1299.e: "Cứ để họ nói, ta không quan tâm."
 podkueijin.1299.e.ex: "Ta sẽ trả tiền cho ai đó để dọn dẹp chuyện này."

 # Living between Mortal event
 mortal_business_header: "Giữa Phàm Nhân:"
 
 podkueijin.1301.t: "$mortal_business_header$ Điềm Báo"
 podkueijin.1301.desc: "Ngươi có kỹ năng đặc biệt xuất sắc trong các phương pháp bói toán và đọc điềm báo, cả chính thức lẫn không chính thức. Tùy vào trình độ kỹ năng của ngươi, ngươi có thể xây dựng được một công việc kinh doanh phát đạt trong thế giới phàm nhân."
 podkueijin.1301.a: "Ta có thể xem chỉ tay."
 podkueijin.1301.b: "Ta có thể biết chút gì đó về Tử Vi."
 podkueijin.1301.c: "Ta tiên đoán số phận."
 
 podkueijin.1311.t: "Cuộc Gặp Gỡ với Mẫu Thân Ngàn Hạc"
 podkueijin.1311.desc: "Ngươi đã gặp [Glossary('Arhat','podgloss.arhat')] của Đằng Long, bà là người sáng lập trực tiếp giáo phái Cầu Vồng Cười, và là người sáng lập gián tiếp của tất cả những giáo phái khác. Bà thường xuyên ở lại Cõi Phàm Trần, đổi nơi ẩn cư sau mỗi bốn năm. Bà vẫn thường xuyên tham vấn với các tín đồ của [Glossary('Dharma','podgloss.dharma')] về những vấn đề giác ngộ, dù dạo này bà thích trò chuyện với những jina cấp thấp hơn là các quan lại."
 podkueijin.1311.a: "Đó là vinh dự của ta."
 
 podkueijin.1399.t: "$mortal_business_header$ Trở Về Từ Thế Giới Phàm Nhân"
 podkueijin.1399.desc_opening: "Sau khi dành thời gian giữa những phàm nhân, cuối cùng ngươi cũng trở về thế giới của mình, tách biệt khỏi họ như lẽ ra phải vậy.\n\n"
 podkueijin.1399.desc_good: "Trong thời gian lưu lại, ngươi dễ dàng kiếm được một gia tài."
 podkueijin.1399.desc_good_bad: "Ngươi đã kiếm được ít vàng trong quá trình đó."
 podkueijin.1399.desc_same: "Ngươi kiếm được ít vàng nhờ công việc của mình."
 podkueijin.1399.desc_bad_good: "Ngươi đã hòa vốn."
 podkueijin.1399.desc_bad: "Ngươi đã mất một ít vàng."
 podkueijin.1399.desc_fallback: "Tài khoản của ngươi hiện những con số kỳ lạ..."
 podkueijin.1399.a: "Ta giàu rồi!"
 podkueijin.1399.b: "Càng nhiều càng tốt."
 podkueijin.1399.c: "Còn hơn không có gì."
 podkueijin.1399.d: "Hừm..."
 podkueijin.1399.e: "Một màn trình diễn đáng xấu hổ."
 
 # Second Breathday event
 
 podkueijin.1501.t: "Lễ Mừng Hơi Thở Thứ Hai: Món Quà Tuyệt Nhất"
 podkueijin.1501.desc: "Các vị khách lần lượt bước vào, khi vị chưởng quan xướng tên những báu vật kỳ lạ họ đã tặng làm quà, đặc biệt nhất trong số đó là món quà của [friendly_guest.GetFirstNameNoTooltip], một thứ thực sự chưa từng nghe đến."
 podkueijin.1501.a: "Rất tốt!"
 
 podkueijin.1502.t: "Lễ Mừng Hơi Thở Thứ Hai: Món Quà Tệ Nhất"
 podkueijin.1502.desc: "Các vị khách lần lượt bước vào, khi vị chưởng quan xướng tên những báu vật kỳ lạ họ đã tặng làm quà. Nhưng ngươi đã phạm sai lầm khi mời [unfriendly_guest.GetFirstNameNoTooltip], vì [unfriendly_guest.GetSheHe] đã tặng ngươi một cái chuông tang lễ!"
 podkueijin.1502.a: "Sao ngươi dám!"
 
 podkueijin.1510.t: "Lễ Mừng Hơi Thở Thứ Hai: Cậu Bé Đào Tiên"
 podkueijin.1510.desc: "Giữa buổi lễ ăn mừng, khi ngươi mở những Quả Đào Trường Sinh của mình, ngươi phát hiện có một cậu bé bên trong!"
 podkueijin.1510.a: "Ừm... món tráng miệng thêm!"
 podkueijin.1510.b: "Đưa Momotaro này ra khỏi đây."
 
 # Dragon Boat festival event
 
 podkueijin.1601.t: "Đua Thuyền Rồng: Bắt Đầu"
 podkueijin.1601.desc: "Cuộc đua thuyền rồng đã bắt đầu và các đối thủ được chia thành hai đội, đỏ thẫm và đen, ngươi có thể đặt một khoản cược nhỏ xem đội nào sẽ thắng."
 podkueijin.1601.a: "Đội Đỏ Thẫm."
 podkueijin.1601.b: "Đội Đen."
 podkueijin.1601.c: "Ta không hứng thú."
 
 podkueijin.1602.t: "Đua Thuyền Rồng: Lợi Thế"
 podkueijin.1602.desc: "Các đối thủ chèo thuyền một cách tuyệt vọng chống lại những con sóng cuộn trào và cơn gió mạnh, lao lên phía trước. Đội ngươi ưa thích đã dẫn trước đội kia vài tấc, thật tuyệt vời..."
 podkueijin.1602.a: "Đổi cược."
 podkueijin.1602.b: "Giữ nguyên cược."
 
 podkueijin.1603.t: "Đua Thuyền Rồng: Bất Lợi"
 podkueijin.1603.desc: "Các đối thủ chèo thuyền một cách tuyệt vọng chống lại những con sóng cuộn trào và cơn gió mạnh, lao lên phía trước. Đội ngươi ưa thích đã tụt lại sau đội kia vài tấc, thật tệ..."
 podkueijin.1603.a: "Đổi cược."
 podkueijin.1603.b: "Giữ nguyên cược."
 
 podkueijin.1604.t: "Đua Thuyền Rồng: Chiến Thắng"
 podkueijin.1604.desc: "Như mũi tên rời khỏi dây cung, những chiếc thuyền rồng đuổi theo nhau, và đội ngươi ưa thích đã thắng! Thật đáng kinh ngạc!"
 podkueijin.1604.a: "Ta biết mình có nhãn quan tốt mà."
 
 podkueijin.1605.t: "Đua Thuyền Rồng: Thất Bại"
 podkueijin.1605.desc: "Như mũi tên rời khỏi dây cung, những chiếc thuyền rồng đuổi theo nhau, và đội ngươi ưa thích đã thua. Ngươi đã thua cược."
 podkueijin.1605.a: "Chuyện này thỉnh thoảng cũng xảy ra."
 
 # Art Scheme
 
 kueijin_scheme.100.t: "Ăn Linh Hồn"
 kueijin_scheme.100.desc: "Ngươi thực sự có thể thấy dòng linh hồn ma quái chảy ra từ cơ thể nạn nhân và đi vào thiên nhãn của ngươi. Giờ ngươi có thể quyết định phải làm gì."
 kueijin_scheme.100.a: "Thanh tẩy linh hồn."
 kueijin_scheme.100.b: "Tra tấn linh hồn."
 kueijin_scheme.100.c: "Ăn linh hồn!"
 
 kueijin_scheme.110.t: "Thanh Tẩy Linh Hồn"
 kueijin_scheme.110.desc: "Linh hồn nạn nhân hòa nhập với chính linh hồn ngươi, và ngươi có thể bắt đầu quá trình thanh lọc linh hồn đó."
 kueijin_scheme.110.a: "Ta cố gắng đưa họ trở lại con đường Pháp Môn của mình."
 kueijin_scheme.110.b: "Ta cố gắng khôi phục lại Nhân Tính đã mất của họ."
 
 kueijin_scheme.120.t: "Tra Tấn Linh Hồn"
 kueijin_scheme.120.desc: "Trong khi hành hạ linh hồn, ngươi có thể cấy vào bất kỳ mệnh lệnh nào mong muốn hoặc thậm chí đi xa đến mức thay đổi Bản Tính của nạn nhân." 
