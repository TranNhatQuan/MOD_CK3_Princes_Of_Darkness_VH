 kueijin_scheme.200.desc: "Ngươi lặng lẽ truyền những thôi thúc đồng cảm đơn giản đến mục tiêu. Nhờ đó, ngươi có thể lấp đầy [recipient.GetName] bằng nỗi sợ hãi, niềm vui, nỗi buồn hay những cảm xúc tương tự. Cảm xúc đó đủ mạnh khiến [recipient.GetName] buộc phải hành động theo nó."
 kueijin_scheme.200.a: "Một cảm xúc làm tăng một phần tính cách của họ."
 kueijin_scheme.200.b: "Một cảm xúc làm giảm một phần tính cách của họ."
 
