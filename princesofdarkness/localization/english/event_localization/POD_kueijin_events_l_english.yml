 kueijin_scheme.130.t: "Hợp Nhất Linh Hồn"
 kueijin_scheme.130.desc: "Ngươi có thể ăn linh hồn của một nạn nhân, từ đó hợp nhất nó với chính mình. Hành động này tự động tốn một cấp bậc [Glossary('Dharma','podgloss.dharma')], trừ khi ngươi theo [Glossary('Dharma','podgloss.dharma')] Tiếng Gầm Của Ma Hổ hoặc đang phục vụ một [Glossary('Yama King','podgloss.yamaking')]. Một ma cà rồng ăn linh hồn của một sinh thể sẽ có được ký ức và năng lực Tri Thức của sinh thể đó. Nạn nhân lập tức chết ngay."
 kueijin_scheme.130.a: "Ta sẽ tiếp cận tri thức của họ."
 kueijin_scheme.130.b: "Ta sẽ tiếp cận ký ức của họ."
