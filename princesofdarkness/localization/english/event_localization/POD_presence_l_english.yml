l_english:

 POD_perfect_world.001.t: "Một Thế Giới Hoàn Hảo"
 POD_perfect_world.001.desc: "Ngươi là một thực thể quyền năng đáng kể và sự tinh thông Presence của ngươi thật vĩ đại. Ngươi nhìn xuống lãnh địa mình và thấy hết thảy đám kine đang sống đời chúng, chẳng bận tâm tới bức tranh lớn hơn. Nhưng ngươi có quyền năng đổi thay điều đó, khiến chúng sống theo lối ngươi thấy vừa ý, quyền năng biến lãnh địa của ngươi thành một thế giới hoàn hảo... cho ngươi.\nNhưng thế giới hoàn hảo của ngươi là gì?"
 POD_perfect_world.001.a: "Ta sẽ truyền cảm hứng cho chúng vươn tới sự vĩ đại; cai trị giới tinh hoa thì tốt hơn."
 POD_perfect_world.001.a.tt.beast: "#beast Chà, cớ sao ta lại muốn cai trị lũ nông dân?#!"
 POD_perfect_world.001.b: "Thế giới này tàn nhẫn; chúng nên xây dựng binh lực để trợ giúp mưu đồ của ta."
 POD_perfect_world.001.b.tt.beast: "#beast Chiến tranh đang tới.#!"
 POD_perfect_world.001.c: "Bây giờ chưa phải lúc."
 POD_perfect_world.001.c.tt: "Ngươi sẽ từ bỏ nỗ lực khiến người phàm hành xử theo ý mình"
 POD_perfect_world.001.c.tt.beast: "#beast Không! Ta phải khống chế chúng!#!"

 POD_perfect_world.002.t: "Một Thế Giới Hoàn Hảo"
 POD_perfect_world.002.desc: "Ngươi đã phải hao tổn rất nhiều quyền năng và vài kẻ kine nhận ra có điều gì đó kỳ lạ đang diễn ra, song kết quả thật phi thường! Ngươi đã thấy người phàm hành xử đúng như trong ảo ảnh của mình, và ngươi đã sẵn sàng gặt hái thành quả."
 POD_perfect_world.002.option.a: "Chà, thật hoàn hảo làm sao."
 POD_perfect_world.002.option.a.tt: "Ngươi đã thành công trong việc chi phối người phàm trong thành"

 POD_mask_of_empathy.001.t: "Mặt Nạ Đồng Cảm"
 POD_mask_of_empathy.001.desc: "Mọi thứ đã vào guồng; dùng quyền năng Presence mênh mông của mình, giờ ngươi có thể ra tay. Ngươi trải rộng ý chí cùng sức hút phi tự nhiên của mình và đã cảm thấy đích đến kề bên, rất gần rồi. Ngươi có tiến hành chăng?"
 POD_mask_of_empathy.001.option.a: "Đã đến lúc cắt đứt mối dây giữa chúng."
 POD_mask_of_empathy.001.option.a.tt: "Ngươi sẽ thử dùng năng lực Mặt Nạ Đồng Cảm"
 POD_mask_of_empathy.001.option.a.desc: "Cuộc đấu ý chí"
 POD_mask_of_empathy.001.option.a.tt.attacker_wins: "[target.GetFirstName] và [target_relation.GetFirstName] không còn gắn bó với nhau nữa"
 POD_mask_of_empathy.001.option.a.tt.defender_wins: "Ngươi đã thất bại và ý chí ngươi đang lung lay"
 POD_mask_of_empathy.001.option.b: "Chưa phải lúc."
 POD_mask_of_empathy.001.option.b.tt: "Ngươi sẽ từ bỏ nỗ lực chia rẽ mối gắn bó giữa [target.GetFirstName] và [target_relation.GetFirstName]"

 POD_mask_of_empathy.002.t: "Mặt Nạ Đồng Cảm"
 POD_mask_of_empathy.002.desc: "Ngươi đã thành công; ngươi đã cảm thấy [target.GetFirstName] và [target_relation.GetFirstName] không còn nghĩ về nhau như trước"
 POD_mask_of_empathy.002.option.a: "Chà, dĩ nhiên chúng chẳng thể cưỡng nổi sức hút của ta."
 POD_mask_of_empathy.002.option.a.tt: "Ngươi đã thành công"
 POD_mask_of_empathy.002.option.a.tt.beast: "#beast Ta khống chế chúng rồi!#!"

 POD_mask_of_empathy.003.t: "Mặt Nạ Đồng Cảm"
 POD_mask_of_empathy.003.desc: "Ngươi đã thất bại, [target.GetFirstName] và [target_relation.GetFirstName] vẫn còn gắn bó với nhau. Ngươi chỉ vừa đủ tránh bị phát giác, kể cũng là một điểm hay"
 POD_mask_of_empathy.003.option.a: "Thật đáng tiếc."
 POD_mask_of_empathy.003.option.a.tt: "Ngươi đã thất bại"
 POD_mask_of_empathy.003.option.a.tt.beast: "#beast Thật đáng thất vọng#!"
