 swara_nation_objective_decision: "Quốc Gia Bastet: Swara"
 pod1230objectives_fera.43.desc: "Như một minh chứng cho sự tôn trọng của họ, Swara theo chủ nghĩa biệt lập đã mời ngươi đến một trong những cõi hang động của họ để bàn về đề xuất tái thống nhất Quốc Gia Bastet của ngươi. Báo lửa không có ý cản đường ngươi hay tranh chấp tuyên bố của ngươi nhưng họ nhắc ngươi về nghĩa vụ thiêng liêng của Con Cái Seline, bảo vệ những vùng đất thuần khiết. Nếu ngươi có thể chứng minh cam kết của mình với nghĩa vụ tổ tiên này, họ sẽ hoàn toàn gia nhập. Nếu không họ sẽ tiếp tục làm việc riêng của mình xa rời những mưu đồ của phần còn lại loài mèo, như họ vẫn luôn làm cho đến nay.\nDựa trên một số điểm yếu về cấu trúc ngươi nhận thấy trong cõi hang động cụ thể này, ngươi nghĩ mình có thể quyên góp để giúp họ cải thiện hàng phòng thủ ở đây, cho thấy rằng ngươi thực sự đang xem xét yêu cầu của họ hết sức nghiêm túc."
 pod1230objectives_fera.43.a: "Ta sẽ cân nhắc yêu cầu của các ngươi."
 pod1230objectives_fera.43.b: "Một nhiệm vụ quan trọng. Để ta giúp ngay bây giờ."
 swara_nation_objective_decision_desc: "Swara là những người bảo vệ của những nơi tràn đầy linh khí. Họ muốn thấy cam kết của ngươi với sự nghiệp của họ trước khi hoàn toàn gia nhập dự án tái thiết Quốc Gia Bastet của ngươi."
 swara_nation_objective_decision_tooltip: "Những người bảo vệ cần được chúng ta bảo vệ."
 swara_nation_objective_decision_confirm: "Một kỳ tích vĩ đại cho một kẻ trị vì vĩ đại."
 
 pod1230objectives_fera.44.t: "Quốc Gia Bastet"
 pod1230objectives_fera.44.desc: "Với ngoại giao khôn khéo, ý chí kiên định và không ít sự thuyết phục "trực tiếp" hơn, cuối cùng ngươi đã tập hợp mọi bộ tộc dưới ngọn cờ của mình. Từng người một họ đến để công nhận chiến thắng của ngươi và vị trị vì mới của Quốc Gia Bastet thống nhất. Toàn thể loài mèo cuối cùng đã hoạt động như một, điều chưa từng thấy kể từ thời huyền thoại, rất lâu trước cuộc chiến thất bại chống lại Garou chuyên chế.\nMột số "thần dân" mới của ngươi mong ngươi sớm sụp đổ, trong khi những kẻ khác thực lòng tin vào ngươi và tương lai ngươi đã hứa hẹn. Cuối cùng, điều đó không thực sự quan trọng. Ngươi đã giành được chiến thắng này.\nGiờ ngươi sẽ dẫn dắt đồng loại của mình đến một tương lai tươi sáng. Thời đại của loài mèo cuối cùng đã đến."
 pod1230objectives_fera.44.a: "Từ mặt trăng, Mẫu Seline mỉm cười."
 blessed_seline_modifier: "Được Seline Ban Phước"
 blessed_seline_modifier_desc: "Mẫu Thần của loài mèo mỉm cười với nhà vô địch được bà chọn lựa."
 bastet_nation_unifier_tooltip: "Chừng nào ngươi còn giữ tước hiệu Quốc Gia Bastet, ngươi giờ sẽ có quyền truy cập vào mọi Men at Arms Bastet."
 
 artifact_attacker_advantage_5_modifier: "[command_modifier_i|E]Ưu thế [advantage|E] cho bên tấn công: #P +5#!"
 artifact_monthly_prestige_10_modifier: "[prestige|E] hàng tháng: #P +40%#!"
 

 entoban_objective_decision: "Thống Nhất Entoban"
 entoban_objective_decision_tooltip: "Entoban cổ xưa sẽ trở về với con cái của Gaia, trọn vẹn một lần nữa."
 entoban_objective_decision_desc: "Ở đây tại Entoban, trái tim thế giới nơi chúng ta thức tỉnh vào đầu Kỷ Nguyên Ngủ Say. Ở đây chúng ta đã chăn dắt những chủng tộc trẻ hơn khi họ ra đời. Và cũng chính tại đây chúng ta đã bị phản bội bởi #TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L Kẻ Đập Trứng#! khi chúng sát hại thân tộc và đồng minh của chúng ta. Entoban sẽ lại thuộc về chúng ta, và lũ sói không thể ngăn cản chúng ta."
 entoban_objective_decision_confirm: "Quê Hương Nguyên Thủy Của Chúng Ta."
 entoban_objective_decision_requirement_example: "$entoban_objective_decision_requirement$ #weak ([example.GetName])#!"
 entoban_objective_decision_requirement: "Không #TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L Garou#! hay [GetTrait('kinfolk').GetName(GetNullCharacter)] của chúng nắm giữ đất đai tại [GetGeographicalRegion('world_africa').GetName]"
 entoban_objective_decision_effect: "Ngươi sẽ nhận được [title|E] [GetTitleByKey('h_entoban').GetNameNoTier] bao trùm toàn bộ [GetGeographicalRegion('world_africa').GetName]"
 entoban_objective_decision_effect2: "$glossary_fera$ có kinh đô tại [GetGeographicalRegion('world_africa').GetName] sẽ có cơ hội cao hơn để chấp nhận thần phục"
 pod1230objectives_fera.50.t: "Entoban"
 pod1230objectives_fera.50.desc: "Trong những thời đại xa xưa, vùng đất mà Nhân Loại gọi là Châu Phi từng là trái tim của một nền văn minh toàn cầu. Ở đây từng có những thành phố có kích thước của cả quốc gia làm từ kỳ quan và khả năng, nơi mọi tầng lớp cuộc sống thịnh vượng từ rất lâu trước Kỷ Nguyên Của Loài Có Vú. Nhưng thời đó đã kết thúc, và Entoban bị chia cắt. Trong hàng thiên niên kỷ ngủ say, nó đã rạn nứt và bị tan vỡ trong sự vắng mặt của chúng ta. Nhưng, đó là nỗi hổ thẹn của quá khứ. Giờ đây, khi ngươi rời khỏi Hang Ổ của mình và nhìn ra chân trời, tất cả dưới ánh mặt trời đều là một phần của một tổng thể duy nhất. Những thời đại vinh quang và kỳ quan đã mất có thể sẽ được khôi phục. Đây là bước đầu tiên trên con đường vươn tới tầm vóc huy hoàng như Kỷ Nguyên Các Vị Vua. Còn nhiều việc phải làm. Nhưng ngươi đã đảm bảo sẽ có một chỗ đứng cho các thế hệ mai sau."
 pod1230objectives_fera.50.a: "Như các Vua Rồng thời xưa, hãy lên ngôi trên Trái Tim Thế Giới."
 entoban_vassal_acceptance: "Entoban: $VALUE|=+0$"


 mokole_mbembe_spear_objective_decision: "Tìm Kiếm Ngọn Giáo"
 mokole_mbembe_spear_objective_decision_tooltip: "Qua sự cống nạp khéo léo và khám phá những nơi đã mất, một thánh tích có thể được tìm thấy."
 mokole_mbembe_spear_objective_decision_desc: "Ngọn giáo của [GetScriptedCharacterByHistoryID('795111').GetFirstName] đã thất lạc theo năm tháng. Nó được nhìn thấy lần cuối tại [umbra|E] nhưng với [innocents|E] lảng vảng, nhiều Mokolé không dám mạo hiểm tìm kiếm nó. Mặt khác, [spirit_companions|E] của chúng ta phù hợp hơn nhiều cho nhiệm vụ này."
 mokole_mbembe_spear_objective_decision_confirm: "Trở về tay người Mokolé."
 mokole_mbembe_spear_objective_decision_requirement: "[GetBuilding('umbral_lake_tele_03').GetName] phải được xây dựng hoàn chỉnh"
 mokole_mbembe_spear_objective_decision_requirement2: "Đạt được [GetModifier('paleontologist_modifier').GetNameWithTooltip] từ [UmbraGlossary('pangaea')]"
 mokole_mbembe_spear_objective_decision_requirement3: "Ngươi có [spirit_companion|E] ở Cấp Bậc tối đa" 
 mokole_mbembe_spear_objective_decision_requirement4: "Ngươi có hai [spirit_companions|E] ở Cấp Bậc tối đa"
 pod1230objectives_fera.51.t: "Ngọn Giáo của Kẻ Đầu Tiên"
 pod1230objectives_fera.51.desc: "Khi ngươi di chuyển qua Pangaea, các linh hồn dẫn ngươi đến một khoảng rừng bị lãng quên, ẩn dưới thân xác của một Vua Rồng khổng lồ đã chết từ lâu. Bên dưới bụng chúng, trong một hang động hình thành từ xương sườn, có một ngọn giáo hùng vĩ duy nhất cắm sâu vào một trái tim bằng đá. Bất chấp di hài hóa thạch của vị Vua, ngọn giáo vẫn hoàn hảo và rực rỡ bên trong trái tim đó, đứng vững chãi và kiên định trước sự tàn phá của thời gian. Với một sinh vật có sức mạnh như ngươi, việc rút nó ra là một chuyện đơn giản. Khi ngọn giáo được rút ra, vị Vua cổ xưa tan thành cát bụi, và hốc động ẩn giấu này biến mất khỏi mọi thứ ngoại trừ ký ức của ngươi. Sức nặng của năm tháng đè nặng lên ngươi, khi Ngọn Giáo chấp nhận người cầm giữ mới của nó."
 pod1230objectives_fera.51.a: "Một vũ khí hùng mạnh xứng đáng với một vị Vua."


 tkash_objective_decision: "Khôi Phục Sự Cân Bằng"
 tkash_objective_decision_tooltip: "Bóng Tối không được vượt qua Ánh Sáng."
 tkash_objective_decision_desc: "Những sinh vật bỉ ổi của màn đêm đe dọa Rta, Trật Tự Vũ Trụ. Chúng phải bị thiêu rụi trước khi sự ô uế của chúng lan rộng khắp rừng rậm của chúng ta."
 tkash_objective_decision_confirm: "Sự Cân Bằng Đã Được Khôi Phục"
 tkash_objective_decision_effect: "Ngươi sẽ nhận được [title|E] [GetTitleByKey('h_tkash').GetNameNoTier] bao trùm toàn bộ [GetGeographicalRegion('world_india').GetName]"
 tkash_objective_decision_effect2: "Mọi $POD_splat_vampire_plural$ và [GetTrait('kueijin').GetName(GetNullCharacter)] có đất đai tại Ấn Độ sẽ chịu #V 5#! sát thương Lửa"
 pod1230objectives_fera.52.t: "Rừng Rậm Nguyên Sơ"
 pod1230objectives_fera.52.desc: "Trong hàng thiên niên kỷ, vùng đất này đã là một chiến trường. Giữa những cuộc chiến của lũ Đỉa và Ác Quỷ Trốn Thoát, càng trầm trọng thêm bởi sự lơ là của Khan và sự điên loạn của lũ con hoang $glossary_wyld$, bất chấp hàng phòng thủ tự nhiên của vùng đất này, nó vẫn là tâm điểm của một cuộc chiến đêm không hồi kết kể từ khi Ác Quỷ Máu xuất hiện. Nhưng, cuối cùng, không còn nữa. Sự kiểm soát của ngươi đối với vùng đất mà dân tộc ngươi gọi là T'kash giờ đã tuyệt đối, vì không ai trong số họ ngờ tới sự trỗi dậy của ngươi. Vô số kẻ bất tử giờ đã tan tác, và ẩn náu. Nhưng chúng không thể thoát khỏi cơn thịnh nộ của dân tộc ngươi. Là một phần của lễ đăng quang vĩ đại, ánh sáng của Helios bắt đầu tràn ngập khu rừng, chờ đợi thời điểm thích hợp. Khi các Weresuchid tập hợp xướng tên ngươi và sự khôi phục của đế chế cổ xưa này, chiếc vương miện phát sáng khi các Trưởng Lão đặt nó lên trán ngươi. Cơn thịnh nộ của Helios sẽ không có giới hạn, khi ánh sáng từ đó bắt đầu bùng cháy và ánh mặt trời, trong một tia chớp ngắn ngủi, tắm gội Ấn Độ. Chính Helios đã công nhận quyền cai trị của ngươi. Cuộc Chiến Vĩnh Cửu cuối cùng đã kết thúc."
 pod1230objectives_fera.52.a: "T'kash tự do sẽ thực sự Vĩnh Cửu."



 makara_mace_objective_decision: "Những Bài Ca Trên Gió"
 makara_mace_objective_decision_tooltip: "Hãy hát cùng ta."
 makara_mace_objective_decision_desc: "Makara luôn là những kẻ hòa đồng nhất trong bốn Chi Phái, bản tính vui vẻ hòa đồng của họ dẫn đến nhiều tình bạn. Tuy nhiên hầu hết tình bạn không đủ để vượt qua những thời khắc gian nan này. Dù cây chùy huyền thoại của Makara sẽ là một người bạn tuyệt vời."
 makara_mace_objective_decision_confirm: "Một màn trình diễn ngoạn mục."
 makara_mace_objective_decision_requirement: "Hai người [friends|E] của ngươi phải ở bậc [kingdom|E] trở lên"
 makara_mace_objective_decision_requirement2: "Ngươi biết ít nhất 8 [languages|E]"
 pod1230objectives_fera.53.t: "Chùy của Những Cơn Gió"
 pod1230objectives_fera.53.desc: "Khi màn trình diễn dần lắng xuống, ngươi gục ngã, kiệt sức, nhưng vô cùng mãn nguyện. Trong khi nhiều Chi Phái khác sẽ gọi màn trình diễn như vậy là ngớ ngẩn, đó là một sự giải tỏa trọn vẹn khi thực hiện một màn trình diễn như thế. Buổi lễ, một sự khẳng định tình bạn trong thời kỳ gian truân, đã được thực hiện tốt đẹp. Với hầu hết những người biểu diễn, họ không hề hay biết về bản chất thực sự của nghi lễ. Nhưng giờ đây, khi ngươi nằm trong một vũng bò sát lớn, có một luồng ánh sáng dẫn đường được hình thành và triệu gọi bởi bài ca. Chùy của Những Cơn Gió, một thánh tích của Makara đã thất lạc từ lâu, đã được triệu hồi và trao cho ngươi, biết rằng Makara một lần nữa xứng đáng với nó. Ngươi mỉm cười. Đã đến lúc cho một màn trình diễn thêm."
 pod1230objectives_fera.53.a: "Những cơn gió sẽ hát cùng ta."


 zhong_guo_objective_decision: "Con Cái của Wani"
 zhong_guo_objective_decision_tooltip: "Chúng ta được định để dẫn dắt."
 zhong_guo_objective_decision_desc: "Zhong Lung là hậu duệ của các Vua Rồng. Trách nhiệm của chúng ta là dẫn dắt $glossary_fera$ trẻ hơn tại Trung Vương Quốc, tuổi tác và sự khôn ngoan của chúng ta sẽ mang đến một kỷ nguyên thịnh vượng bất tận."
 zhong_guo_objective_decision_confirm: "Chúng ta trở thành các Đại Long."
 zhong_guo_objective_decision_requirement: "Ngươi phải có cả một [GetTrait('werewolf').GetName(GetNullCharacter)] và một [GetTrait('bastet').GetName(GetNullCharacter)] trong [GetPlayer.Custom('PODCoterie')] của mình là thành viên của [GetFaithDoctrine('doctrine_fera_beast_courts').GetBaseName]"
 zhong_guo_objective_decision_requirement2: "[GetPlayer.Custom('PODCoterie')] của ngươi phải có ít nhất 30 ở mọi [skills|E]"
 zhong_guo_objective_decision_requirement3: "[GetPlayer.Custom('PODCoterie')] của ngươi phải có ít nhất 75 [prowess|E]"
 zhong_guo_objective_decision_effect: "Ngươi sẽ nhận được [title|E] [GetTitleByKey('h_zhong_guo').GetNameNoTier] bao trùm toàn bộ [GetGeographicalRegion('world_asia_china').GetName]"
 zhong_guo_objective_decision_effect2: "Mọi [faiths|E] [GetFaithDoctrine('doctrine_fera_beast_courts').GetBaseName] sẽ nhận được [GetFaithDoctrine('special_zhong_guo_reward_doctrine').GetBaseName]"
 pod1230objectives_fera.54.t: "Zhong Guo"
 pod1230objectives_fera.54.desc: "Đối với đại đa số các Chi Phái, Mokolé từ lâu đã tin rằng thời của họ với tư cách Vua đã qua từ lâu, và phần lớn họ đã từ bỏ. Nhưng không phải Zhong Lung. Trong khi các Chi Phái khác bị tàn sát, Zhong Lung vẫn kiên cường, và tìm được vai trò mới với tư cách những triết gia và học giả. Họ đã thay đổi, và thích nghi. Giống như ngươi bây giờ. Ngươi có lẽ là một trong những sinh vật mạnh mẽ nhất thế giới, hình ảnh sống động của các Vua Rồng xưa. Thú Triều, Mặt Trăng, và Mặt Trời đều đã công nhận ngươi là hiện thân mới của các Vua trong vòng quay này của Bánh Xe Kỷ Nguyên. Không phải bằng chiến tranh, mà bằng uy nghi và ngoại giao, một Kỷ Nguyên Các Vua mới vừa ra đời. Thế giới nằm trước mặt ngươi, với Cái Nôi của Wani như một vùng đất trung tâm bất khả xâm phạm. Kỷ Nguyên Các Vua Thứ Hai đã đến."
 pod1230objectives_fera.54.a: "Ta đã trở thành một Prince thực sự của Wani."


 gaias_memory_objective_decision: "Ký Ức của Gaia"
 gaias_memory_objective_decision_tooltip: "Không gì có thể thực sự bị lãng quên."
 gaias_memory_objective_decision_desc: "Mokolé là ký ức của Gaia, đã đến lúc chúng ta hoàn thành nghĩa vụ của mình. Dù đó là lịch sử của $glossary_fera$, sự luân chuyển của [Glossary('Wheel of Ages','podgloss.wheelofages')], hay thế giới phàm nhân, chúng ta đã chứng kiến tất cả. Giờ chúng ta chỉ đơn giản cần nhớ lại nó."
 gaias_memory_objective_decision_confirm: "Nhớ lại khởi nguyên."
 gaias_memory_objective_decision_requirement: "[GetPlayer.Custom('PODCoterie')] của ngươi phải có ít nhất hai $glossary_fera$ Cấp 4 khác"
 gaias_memory_objective_decision_requirement2: "Đạt được #ILLUSTRIOUSPURPLE Vọng Âm Thời Đại#! từ [journey|E] Hành Trình Linh Hồn"
 gaias_memory_objective_decision_requirement3: "Một [GetTrait('kueijin').GetName(GetNullCharacter)] phải là [friend|E], [best_friend|E], [lover|E], hoặc [soulmate|E] của ngươi"
 pod1230objectives_fera.55.t: "Ký Ức Vĩnh Cửu"
 pod1230objectives_fera.55.desc: "Mnesis luôn là một sự hiện diện mâu thuẫn đối với Mokolé. Là Ký Ức của Gaia, mọi Mokolé có thể trượt vào những giấc mơ chung của họ, nhưng với hầu hết Mokolé, họ nhiều nhất chỉ có những mảnh vỡ rời rạc để lấy ra. Nhưng đó không phải điều ngươi hài lòng. Qua những cuộc thảo luận sâu sắc với những người quản lý thế giới và tìm kiếm tri thức đã bị lãng quên, ngươi có thể lao sâu vào ký ức, và khám phá những sự thật đã mất từ lâu. Tất cả những gì ngươi cần làm bây giờ là dám làm điều đó."
 pod1230objectives_fera.55.a: "Cầu cho chúng ta không bao giờ quên lãng lần nữa."


 undying_body_objective_decision: "Thân Xác Bất Tử"
 undying_body_objective_decision_tooltip: "Chúng ta đứng một mình."
 undying_body_objective_decision_desc: "Nhật Bản tràn ngập tất cả những sinh vật siêu nhiên này, đã đến lúc chúng ta loại bỏ chúng. Chúng ta sẽ chiếm lấy vùng đất này và chờ đợi ngày khải huyền đến. Chúng sẽ chết, và chúng ta sẽ sống."
 undying_body_objective_decision_confirm: "Một luận điểm đã được chứng minh."
 undying_body_objective_decision_requirement_example: "$undying_body_objective_decision_requirement$ #weak ([example.GetName])#!"
 undying_body_objective_decision_requirement: "Không $glossary_fera$ Dòng Sinh nào khác sở hữu đất đai tại [GetGeographicalRegion('world_asia_japan').GetName]"
 undying_body_objective_decision_requirement2: "Ngươi có ít nhất #V 80%#! [soak_chance|E]"
 undying_body_objective_decision_effect: "Hình dạng Archid nhận được: [GetModifier('archid_undying_flesh_modifier').GetNameWithTooltip] "
 pod1230objectives_fera.56.t: "Tinh Thông Thân Xác"
 pod1230objectives_fera.56.desc: "Trong phần lớn lịch sử của Hengeyokai, Nhật Bản đã là một nơi ẩn dật xa xôi, cô lập tại tận cùng thế giới. Chủ yếu là nhà của Người Chết Đói và những thứ đáng ghê tởm hơn nữa, một số con cái của Mẫu Thần Ngọc Bích đã gọi vùng đất này là nhà, nhưng rõ ràng họ đã sai lầm trong nghĩa vụ của mình. Lũ chó gần như đã xóa sổ dân tộc ngươi giờ đã tan tác, những kẻ trẻ tuổi của các dòng khác đã chạy trốn, và giờ đây, chỉ còn ngươi và Ổ của ngươi còn sót lại. Một minh chứng cho ý chí của ngươi, và nơi ân sủng của Mẫu Thần Ngọc Bích đặt để. Sẽ khó khăn, canh giữ bà tại tận cùng thế giới, nhưng giờ đây, ít nhất ngươi đã có cơ sở cho tuyên bố này. Một tuyên bố không thể bị phủ nhận."
 pod1230objectives_fera.56.a: "Thế giới có thể tan vỡ, nhưng ta sẽ không."



 zhong_lung_pearls_objective_decision: "Quyền Thống Trị Nước"
 zhong_lung_pearls_objective_decision_tooltip: "Chúng ta là Chúa Tể của Những Dòng Sông."
 zhong_lung_pearls_objective_decision_desc: "Là Chi Phái Nước, chúng ta Zhong Lung có quyền chỉ huy đáng sợ đối với nước trên toàn thế giới. Tuy nhiên nếu những Viên Ngọc đã mất của các Vua Rồng có thể được thu hồi, thì quyền năng của chúng ta sẽ trở nên tuyệt đối."
 zhong_lung_pearls_objective_decision_confirm: "Lên Xuống Theo Dòng Nước."
 zhong_lung_pearls_objective_decision_requirement: "Tốc độ Hồi $POD_energy_gnosis$ đạt ít nhất #V 50%#!"
 pod1230objectives_fera.57.t: "Rồng Nước"
 pod1230objectives_fera.57.desc: "Tắm mình trong ánh sáng mặt trời tại Triều Đình của ngươi, dòng sông chảy qua ngươi khi ngươi thiền định về bản chất của những gì sắp đến. Zhong Lung từ lâu đã được coi là Chi Phái Nước, nhưng nếu không có Những Viên Ngọc của các Vua Rồng, tước hiệu đó mang tính hình thức nhiều hơn thực tế. Zhong Lung đã lâu phải chịu đựng sự sỉ nhục này, khi có những lời thì thầm rằng, có lẽ, những dòng sông một ngày nào đó sẽ bỏ rơi tất cả các ngươi. Nhưng khi ngươi trồi lên khỏi mặt nước, khoác lên mình Những Viên Ngọc đã mất, những kẻ chỉ trích sẽ im lặng, những lời dối trá của họ chết trên môi. Đây không còn chỉ là một tuyên bố hình thức nữa. Những Dòng Sông đã trở về nơi thuộc về chúng, trong móng vuốt."
 pod1230objectives_fera.57.a: "Những dòng nước thuộc quyền kiểm soát của ta."


 prehistoric_dreams_objective_decision: "Những Giấc Mơ Tiền Sử"
 prehistoric_dreams_objective_decision_tooltip: "Thế giới như nó từng là."
 prehistoric_dreams_objective_decision_desc: "Hình dạng hiện tại của chúng ta bị giới hạn bởi những gì chúng ta có thể mơ tới, nhưng chúng ta lại bị giới hạn bởi thời đại hiện tại của mình. Qua cát và nước chúng ta có thể nhớ lại thời khủng long còn đi lại trên thế giới. Với những ký ức này, chúng ta có thể định hình dạng thể của mình thành thứ gì đó thực sự đáng sợ."
 prehistoric_dreams_objective_decision_confirm: "Huyền thoại hóa thành hiện thực."
 prehistoric_dreams_objective_decision_requirement: "Đã khám phá mọi loài Khủng Long trong [UmbraGlossary('astral_reaches')]"
 prehistoric_dreams_objective_decision_requirement2: "Đã ghé thăm mọi [holy_site|E]"
 prehistoric_dreams_objective_decision_effect: "Hình dạng Archid nhận được: [GetModifier('archid_prehistoric_terror_modifier').GetNameWithTooltip] "
 pod1230objectives_fera.58.t: "Những Giấc Mơ Tiền Sử"
 pod1230objectives_fera.58.desc: "Giấc ngủ. Một điều mà nhiều Mokolé quen thuộc như một bóng ma, một tiếng gọi về những gì nhiều Mokolé coi là thời kỳ tốt đẹp hơn, khi thân xác họ có thể sánh ngang linh hồn họ. Quá thường xuyên, chính bóng ma của những hình dạng này lẩn tránh thân xác ngươi khiến quá nhiều đồng loại của ngươi trở nên u sầu, trầm cảm, và thu mình. Nhưng ở cuối hành trình của ngươi, chôn vùi dưới cát giữa xương cốt tổ tiên ngươi, những giấc mơ về thân xác từ lâu bị từ chối đó không tan biến khi ngươi cựa mình. Ngươi trỗi dậy, cát rơi khỏi trán và mào của ngươi. Một thân xác của loài rồng, một hình dạng của các Vua trỗi dậy từ cát, giấc mơ đó thành hiện thực. Ngươi đã đi trên những con đường thiêng liêng, nhớ lại những gì tất cả các ngươi từng là. Và giờ đây, nó sẽ ở bên ngươi mỗi khi ngươi tỉnh giấc, thế giới giờ là giấc mơ sống của ngươi."
 pod1230objectives_fera.58.a: "Một cơn ác mộng cho kẻ thù của ta."



 walking_world_objective_decision: "Bước Đi Khắp Thế Giới"
 walking_world_objective_decision_tooltip: "Để hiểu quá khứ, trước tiên phải biết hiện tại."
 walking_world_objective_decision_desc: "Thế giới không còn như xưa, điều đó đã quá rõ ràng. Khi quá khứ mờ dần vào Mnesis, chúng ta phải nhìn vào những kỳ quan trước mắt mình. Chúng cũng sẽ trở thành Mnesis của tương lai."
 walking_world_objective_decision_confirm: "Vòng tuần hoàn vẫn tiếp diễn."
 walking_world_objective_decision_requirement: "Ngươi đã ghé thăm #V 30#! [points_of_interest|E] #weak (Hiện tại: [THIS.Var('poi_visited').GetValue|V0])#!"
 walking_world_objective_decision_requirement2: "Ngươi có [umbra_aptitude|E] #V 200%#!"
 pod1230objectives_fera.59.t: "Thời Gian Trôi Đi..."
 pod1230objectives_fera.59.desc: "Thường thì, Mokolé mơ về những thời đại đã qua từ lâu, khao khát chúng trở lại. Phủ nhận những thành tựu của hiện đại và ám ảnh về quá khứ. Và quá thường xuyên, họ mục ruỗng và thối rữa trong dục vọng đó, mù quáng trước cả thế giới xung quanh mình. Ngươi, tuy nhiên, đã không để mình lạc lối trong nỗi tuyệt vọng đó. Theo thời gian, ký ức của thế hệ ngươi sẽ trở thành Mnesis. Và nơi những kẻ khác ích kỷ ẩn mình trong ký ức của chính họ, ngươi đã chọn tạo ra ký ức của riêng mình. Rất nhiều vẻ đẹp của thế giới hiện đại giờ đã được thêm vào ký ức của những kẻ sẽ nối bước ngươi. Với những kẻ đến sau ngươi, họ sẽ có ký ức về những kỳ quan, bi kịch, và sự uy nghi của nhân loại cùng những sinh vật của thế giới bóng đêm. Ngươi sẽ trang bị cho họ những ký ức hiện đại, tươi mới với tất cả những gì họ cần để không chỉ sống sót, mà còn thịnh vượng. Một di sản mà thời gian không thể xóa nhòa. Một di sản sẽ tồn tại và vượt qua cả cát bụi thời gian."
 pod1230objectives_fera.59.a: "Vậy mà vẫn còn nhiều điều để chiêm ngưỡng hơn nữa..."

 garou_objective_decision_caern_tooltip: "Ngươi cần có một Caern đã tối đa của bất kỳ loại nào (công trình cấp công quốc Cấp 5, Caern của Ý Chí, Phẫn Nộ, Lãnh Đạo, Trí Tuệ hoặc Bí Ẩn)." 


 beast_of_war_objective_decision: "Ác Thú Chiến Tranh"
 beast_of_war_objective_decision_tooltip: "Quá nhiều cái chết."
 beast_of_war_objective_decision_desc: "$glossary_wyrm_calamity$ khao khát sự hủy diệt. Qua tai ương và tàn sát chúng ta sẽ được tăng cường sức mạnh, càng thêm vinh quang cho $glossary_wyrm$."
 beast_of_war_objective_decision_confirm: "Tai ương đang đến!"
 beast_of_war_objective_decision_requirement: "Mọi [powerful_vassals|E] của ngươi phải bị [intimidated|E] hoặc [cowed|E] bởi ngươi"

 eater_of_souls_objective_decision: "Kẻ Nuốt Linh Hồn"
 eater_of_souls_objective_decision_tooltip: "Thân xác ta và linh hồn của chúng."
 eater_of_souls_objective_decision_desc: "Để phụng sự $glossary_wyrm_consumption$, ta phải hy sinh nhiều thứ. Chỉ khi chính thân xác chúng ta tràn ngập sức mạnh thô của $glossary_wyrm$ và vùng đất bị rút cạn sự sống thì cái đầu Hydra này mới được thỏa mãn."
 eater_of_souls_objective_decision_confirm: "Nuốt trọn tất cả!"
 eater_of_souls_objective_decision_requirement: "Có ít nhất #V 4#! [fetishes|E] được trang bị và kích hoạt"

 defiler_wyrm_objective_decision: "Wyrm Ô Uế"
 defiler_wyrm_objective_decision_tooltip: "Tất cả rồi sẽ phụng sự, sớm muộn thôi."
 defiler_wyrm_objective_decision_desc: "$glossary_wyrm$ lớn mạnh bằng cách làm ô uế kẻ khác, điều này khiến $glossary_wyrm_corruption$ có thể nói là cái đầu mạnh nhất. Một mình thì chỉ làm được đến vậy, chúng ta sẽ cần thêm tay sai của nó để làm ô uế thế giới."
 defiler_wyrm_objective_decision_confirm: "Sự ô uế tuyệt đẹp!"
 defiler_wyrm_objective_decision_requirement: "Đã khám phá mọi [men_at_arms|E] Tà Linh tại [UmbraGlossary('malfeas')]"
 defiler_wyrm_objective_decision_requirement2: "Ngươi có hai [spirit_companions|E] [GetFaithByKey('wyrmbound').GetName] ở Cấp Bậc tối đa"

 wyrm_hydra_objective_decision: "Tận Hiến cho Hydra"
 wyrm_hydra_objective_decision_tooltip: "Tam Vị chân chính trỗi dậy."
 wyrm_hydra_objective_decision_desc: "Triều đại chúng ta đã phụng sự $glossary_wyrm$ tốt đẹp. Chúng ta sẵn sàng mở ra một kỷ nguyên mới dưới sự lãnh đạo của kẻ mạnh nhất trong chúng ta.\Rồi thế giới sẽ biết đến nỗi sợ hãi thực sự."
 wyrm_hydra_objective_decision_confirm: "Giờ ta đã hoàn chỉnh."
 wyrm_hydra_objective_decision_effect: "Ngươi sẽ nhận được [title|E] [GetTitleByKey('h_wyrm').GetNameNoTier] bao gồm mọi [empires|E] ngươi nắm giữ"
 pod1230objectives_fera.61.t: "Wyrm Trỗi Dậy"
 pod1230objectives_fera.61.desc: "Quyền năng của $glossary_wyrm_triatic$ giờ đã tuyệt đối. $glossary_triat$ đã suy yếu. Giờ đây thế giới nằm phía trước, không hề hay biết ngày tận diệt đang đến gần.\n\nSẽ không có nơi trú ẩn nào khỏi cơn thịnh nộ của ngươi. Vũ khí và giáp trụ của chúng sẽ chẳng có ý nghĩa gì, đức tin của chúng lại càng ít hơn. Chúng sẽ chứng kiến thế giới đi đến hồi kết. Nhiều kẻ sẽ chống cự, sự ngoan cường của họ đáng khâm phục nhưng vô nghĩa, vì thế giới đã lao vào hàm răng của Khải Huyền. Không còn hy vọng, không còn tương lai, mọi sự sống đều đã bị định đoạt!"
 pod1230objectives_fera.61.a: "Ta là hồi kết của vạn vật!"