l_english:

 blackfury_objective_decision: "Con Gái của Gaia"
 blackfury_objective_decision_tooltip: "Black Fury phải đứng lên và dẫn dắt Quốc Gia Garou."
 blackfury_objective_decision_desc: "Nếu Black Fury muốn dẫn dắt Quốc Gia Garou thoát khỏi những cuộc tranh cãi vặt vãnh, trước tiên họ phải tìm được một Nữ Tộc Trưởng xứng đáng và củng cố quê hương của mình."
 blackfury_objective_decision_effect_tooltip: "Ngươi sẽ nhận được [title|E] Đế Chế Black Fury, một di vật quyền năng của bộ tộc ngươi và tiến gần hơn một bước đến việc thống nhất Garou." 
 blackfury_objective_decision_confirm: "Những người mẹ, người con gái và người lãnh đạo"
 blackfury_decision_custom: "Caern của Vinh Quang Mặt Trời, tại [GetTitleByKey('b_montbelliard').GetNameNoTier], phải được xây dựng hoàn chỉnh"
 blackfury_decision_custom_a: "Ngươi phải có 5 hiệp sỹ nữ trở lên với prowess 50 trở lên."
 blackfury_decision_custom_c: "Mức độ phát triển của ít nhất 5 county là 10 trở xuống."

 pod1230objectives_fera.1.t: "Con Gái của Gaia"
 pod1230objectives_fera.1.desc: "Black Fury từ lâu đã gắn bó với quê hương tổ tiên vùng Địa Trung Hải của họ. Sự trỗi dậy của La Mã và sự phát triển của các thành phố đi kèm với nó đã đánh dấu sự kết thúc quyền thống trị của họ trên vùng đất này và giúp lũ ma cà rồng làm suy giảm ảnh hưởng của Fury từng chút một. Không còn nữa.\nNhờ một chuỗi các Nữ Tộc Trưởng quyền năng, việc sử dụng khéo léo các thể chế phàm nhân chống lại ma cà rồng và một số cuộc tấn công liều lĩnh xứng đáng với người Amazon, Black Fury một lần nữa đã củng cố vững chắc chỗ đứng của mình.\nCác bộ tộc khác giờ đang dõi theo, tự hỏi liệu Fury có thể tận dụng chiến thắng bất ngờ này hay không. Có lẽ Gaia thực sự muốn các nhà vô địch của bà được thống nhất dưới quyền các con gái của bà sau tất cả?"
 pod1230objectives_fera.1.a: "Mẹ ơi, xin hãy nghe tiếng reo hò chiến thắng của chúng con!"
 pod1230objectives_fera.2.a: "Bọn Sói tự phụ!"
 pod1230objectives_fera.2.b: "Người Amazon lại cưỡi ngựa xông lên"
 
 bonegnawer_objective_decision: "Tiếng Cười của Gaia"
 bonegnawer_objective_decision_tooltip: "Chẳng phải là một trò đùa bệnh hoạn sao nếu lũ nhặt rác trở thành lãnh đạo?"
 bonegnawer_objective_decision_desc: "Chúng ta là tầng đáy của chuỗi thức ăn trong Quốc Gia Garou. Nhưng với những mưu mẹo và sự khôn khéo của mình, chúng ta có thể chứng minh cho tất cả những bộ tộc cao ngạo này thấy chúng ta thực sự hữu ích đến mức nào."
 bonegnawer_objective_decision_effect_tooltip: "Ngươi sẽ nhận được [title|E] Đế Chế Bone Gnawer, một di vật quyền năng của bộ tộc ngươi và tiến gần hơn một bước đến việc thống nhất Garou." 
 bonegnawer_objective_decision_confirm: "Lật đổ các ngai vàng!"
 bonegnawer_decision_custom: "Caern của Cánh Đồng Sao, tại [GetTitleByKey('b_oviedo').GetNameNoTier], phải được xây dựng hoàn chỉnh"
  
 pod1230objectives_fera.3.t: "Tiếng Cười của Gaia"
 pod1230objectives_fera.3.desc: "Trong khi các Shadow Lord và Silver Fang hùng mạnh tranh cãi nhau, trong khi Get of Fenris và Fianna dũng cảm chiến đấu những trận đánh vô vọng, Bone Gnawer chờ đợi. Được hỗ trợ bởi sự phát triển của văn minh nhân loại, những đứa con của Chuột đã làm điều họ giỏi nhất: sinh tồn, thích nghi và phát triển.\nTrong khi các bộ tộc khác ngày càng giống tàn tích của quá khứ, Bone Gnawer lại hòa hợp với nhân loại đã thay đổi này hơn bao giờ hết và giờ đây tất cả, dù miễn cưỡng, đang tìm đến họ để xin giúp đỡ và lời khuyên về cách đối phó với xã hội đã thay đổi này. Tầng đáy của Quốc Gia Garou đang trả thù, và, hết ơn huệ này đến ơn huệ khác, đang nhanh chóng leo lên nấc thang..."
 pod1230objectives_fera.3.a: "Lũ chuột không rời tàu, chúng chỉ huy nó!"
 pod1230objectives_fera.4.b: "Từ lũ nhặt rác thành lãnh đạo?"
  
 childofgaia_objective_decision: "Sự Đoàn Kết của Gaia"
 childofgaia_objective_decision_tooltip: "Chứng minh rằng đoàn kết không phải là điểm yếu là một thử thách không hồi kết."
 childofgaia_objective_decision_desc: "Chúng ta luôn phấn đấu vì sự đoàn kết trong Quốc Gia Garou, nhưng các bộ tộc hiếu chiến hơn vẫn né tránh chúng ta. Chỉ qua sức mạnh mà họ phải tôn trọng, hoặc vun đắp những mối quan hệ mà họ không thể phớt lờ, sự thống nhất mới có thể bắt đầu."
 childofgaia_objective_decision_effect_tooltip: "Ngươi sẽ nhận được [title|E] Đế Chế Children of Gaia, một di vật quyền năng của bộ tộc ngươi và tiến gần hơn một bước đến việc thống nhất Garou." 
 childofgaia_objective_decision_confirm: "Tụ họp và lắng nghe"
 childofgaia_decision_custom: "Caern của Biển Trắng, tại [GetTitleByKey('b_kem').GetNameNoTier], phải được xây dựng hoàn chỉnh"
   
 pod1230objectives_fera.5.t: "Sự Đoàn Kết của Gaia"
 pod1230objectives_fera.5.desc: "Thường bị coi thường là một bộ tộc hòa bình và yếu đuối, Children of Gaia trước hết là một thế lực vì sự đoàn kết và mục đích chung. Trong quá khứ, nỗ lực của họ thuyết phục các bộ tộc anh em ngồi lại nói chuyện về những mối thù của mình (thay vì đập đầu nhau) đã không mang lại kết quả.\nTuy nhiên điều này đã thay đổi gần đây khi họ chứng minh được sức mạnh của niềm tin và những kết quả to lớn có thể đạt được nếu mọi nhà vô địch của Gaia hành động như một. Cuối cùng, có lẽ lần đầu tiên, các bộ tộc đang lắng nghe và Quốc Gia Garou chưa bao giờ có vẻ mạnh mẽ và đoàn kết đến thế.\nQuả thật, hẳn Gaia đang mỉm cười với các con của mình lúc này."
 pod1230objectives_fera.5.a: "Cuối cùng họ cũng hiểu ra."
 pod1230objectives_fera.6.b: "Garou thống nhất? Một viễn cảnh đáng sợ."
   
 fianna_objective_decision: "Anh Hùng của Gaia"
 fianna_objective_decision_tooltip: "Quần Đảo là vùng đất của tổ tiên chúng ta và không con đỉa nào có thể đuổi chúng ta khỏi đây!"
 fianna_objective_decision_desc: "Từng là bá chủ không thể tranh cãi của Quần Đảo, Fianna đã rơi vào thời kỳ khó khăn với sự trở lại của Mithras và bệnh dịch lột da. Chúng ta phải phản công trước khi quá muộn!"
 fianna_objective_decision_effect_tooltip: "Ngươi sẽ nhận được [title|E] Đế Chế Fianna, một di vật quyền năng của bộ tộc ngươi và tiến gần hơn một bước đến việc thống nhất Garou." 
 fianna_objective_decision_confirm: "Đến giờ tiệc tùng rồi!"
 fianna_decision_custom: "Caern của Biển Hoang Dã, tại [GetTitleByKey('b_castletown').GetNameNoTier], phải được xây dựng hoàn chỉnh"
 fianna_decision_custom_a: "Các Nam Tước Quốc Avalon và Sisters of St-John không tồn tại hoặc đang bị ngươi nắm giữ."
 fianna_decision_custom_b: "Không county nào của ngươi có đức tin thù địch với fae."
 
 pod1230objectives_fera.7.t: "Anh Hùng của Gaia"
 pod1230objectives_fera.7.desc: "Dù được tôn trọng vì tài chiến đấu và những người kể chuyện nổi tiếng của mình, Fianna thường bị các bộ tộc khác coi là quá bất trị. Sự thiếu kỷ luật này đã khiến họ chịu những tổn thất lớn ở Quần Đảo, dẫn đến việc họ ngày càng bị cô lập khỏi phần còn lại của Quốc Gia Garou.\nNhưng không còn nữa, khi một chuỗi những người trị vì mạnh mẽ và ý thức mục đích được đổi mới đã chứng kiến Fianna một lần nữa vươn lên làm bá chủ Britannia. Khi những bài ca đã được sáng tác để lưu danh chiến công vĩ đại này, Fianna giờ sẽ bắt đầu hướng ra bên ngoài, có lẽ để mang sự giúp đỡ của mình đến phần còn lại của Quốc Gia.\n...Sau khi hồi phục từ bữa tiệc hoành tráng nhất họ từng tổ chức."
 pod1230objectives_fera.7.a: "...đầu ta đau quá."
 pod1230objectives_fera.8.b: "Người Celt đang đến."
   
 get_fenris_objective_decision: "Chiến Binh Cuồng Nộ của Gaia"
 get_fenris_objective_decision_tooltip: "Hậu duệ của Odin vẫn còn sống. Một sự sỉ nhục với mọi chiến binh của Fenris Vĩ Đại!"
 get_fenris_objective_decision_desc: "Bất chấp trận chiến khổng lồ đã loại bỏ Wotan, con cháu hắn vẫn ẩn nấp ở phương Nam trong khi lũ đỉa Đức cũng đang xâm lấn vùng đất của chúng ta. Tất cả phải bị trừng phạt!"
 get_fenris_objective_decision_effect_tooltip: "Ngươi sẽ nhận được [title|E] Đế Chế Get of Fenris, một di vật quyền năng của bộ tộc ngươi và tiến gần hơn một bước đến việc thống nhất Garou." 
 get_fenris_objective_decision_confirm: "Chúng ta sẽ hạ bệ Valhalla!"
 get_fenris_decision_custom: "Caern của Mùa Đông Fimbul, tại [GetTitleByKey('b_biton').GetNameNoTier], phải được xây dựng hoàn chỉnh"
 get_fenris_decision_custom_a: "Free State và đế chế Midgard không tồn tại hoặc đang bị ngươi nắm giữ."
 
 pod1230objectives_fera.9.t: "Chiến Binh Cuồng Nộ của Gaia"
 pod1230objectives_fera.9.desc: "Get of Fenris là những chiến binh đáng sợ tột cùng và không ai trong Quốc Gia Garou phủ nhận điều đó. Nhưng lối hành xử bạo lực, gần như lạm dụng của họ khiến họ bất hòa với các bộ tộc còn lại. Nhưng thời thế đã thay đổi.\nVới sự phát triển tràn lan của văn minh và lũ đỉa kiểm soát nó, Get of Fenris đang vận động cho sự thống nhất của Quốc Gia Garou dưới quyền lãnh đạo của họ với tư cách những Alpha không thể tranh cãi. Với thành công trong việc thu hồi quê hương Thụy Điển của mình, họ đưa ra một lập luận mạnh mẽ cho bản thân và nhiều kẻ đã tụ tập dưới ngọn cờ của họ.\nMáu và bạo lực sẽ đánh đổ kẻ thù của Gaia, và nếu vẫn chưa đủ, thêm nhiều đổ máu nữa cũng sẽ giải quyết được vấn đề..."
 pod1230objectives_fera.9.a: "Chúng ta sẽ hạ bệ Thiên Đường!"
 pod1230objectives_fera.10.b: "Đến Ragnarok chăng?"
   
 redtalon_objective_decision: "Cơn Thịnh Nộ của Gaia"
 redtalon_objective_decision_tooltip: "$glossary_wyld$ vẫn chưa chết."
 redtalon_objective_decision_desc: "Văn minh đang tràn lan ngày càng dữ dội và các bộ tộc khác từ chối hành động. Chính chúng ta phải cứu Gaia khỏi nhân loại đáng nguyền rủa này."
 redtalon_objective_decision_effect_tooltip: "Ngươi sẽ nhận được [title|E] Đế Chế Red Talon, một di vật quyền năng của bộ tộc ngươi và tiến gần hơn một bước đến việc thống nhất Garou." 
 redtalon_objective_decision_confirm: "Nhớ lại Các Lời Sấm Truyền"
 redtalon_decision_custom: "Caern của Rừng Mùa Đông, tại [GetTitleByKey('b_kazan').GetNameNoTier], phải được xây dựng hoàn chỉnh"
 redtalon_decision_requirement: "Ngươi phải có [spirit_companion|E] [GetFaithByKey('velvet_brood').GetName] ở Cấp Bậc tối đa." 
 
 pod1230objectives_fera.11.t: "Cơn Thịnh Nộ của Gaia"
 pod1230objectives_fera.11.desc: "Red Talon chưa từng nhượng bộ về Impergium, cuộc thanh trừng nhân loại mà họ cho là cần thiết. Khi các bộ tộc khác từ bỏ ý tưởng đó, họ thấy mình ngày càng bị cô lập. Nhưng Red Talon không có gì ngoài sự kiên nhẫn.\nRút lui về những thảo nguyên hoang dã còn sót lại, họ đảm bảo thanh lọc khu vực khỏi mọi kẻ ngoại lai không mong muốn và chờ đợi thời cơ. Khi các bộ tộc khác trở thành con mồi cho sự phát triển của nhân loại và lũ ma cà rồng đi kèm với nó, Red Talon lại thịnh vượng. Và giờ đây, họ là thế lực mạnh nhất còn lại trong Quốc Gia Garou và tiếng tru của họ sẽ được nghe thấy.\nImpergium sẽ diễn ra như kế hoạch và Gaia sẽ được cứu rỗi trong máu của nhân loại, dù họ có muốn hay không."
 pod1230objectives_fera.11.a: "Chúng sẽ lại sợ hãi lũ sói."
 pod1230objectives_fera.12.b: "Người đấu với hoang dã, một lần nữa"
  
 warderofmen_objective_decision: "Sức Bền Bỉ của Gaia"
 warderofmen_objective_decision_tooltip: "Để sinh tồn, chúng ta phải thích nghi"
 warderofmen_objective_decision_desc: "Nhân loại đã đến để ở lại, chúng ta phải chứng minh cho Quốc Gia Garou thấy con đường phía trước là đi cùng họ, không phải chống lại họ."
 warderofmen_objective_decision_effect_tooltip: "Ngươi sẽ nhận được [title|E] Đế Chế Warder of Men, một di vật quyền năng của bộ tộc ngươi và tiến gần hơn một bước đến việc thống nhất Garou." 
 warderofmen_objective_decision_confirm: "Một con đường mới cùng nhau"
 warderofmen_decision_custom: "Caern của Lời Hứa Sáng Ngời, tại [GetTitleByKey('b_acre').GetNameNoTier], phải được xây dựng hoàn chỉnh"
 warderofmen_decision_custom_a: "Ngươi sở hữu ít nhất 5 sách, nhật ký hoặc hiện vật tồn kho tương tự."
 
 pod1230objectives_fera.13.t: "Sức Bền Bỉ của Gaia"
 pod1230objectives_fera.13.desc: "Warder of Men nhanh chóng bị các bộ tộc khác gạt bỏ là 'những kẻ yêu nhân loại' nhưng Warder không bận tâm. Giống như linh vật tổ của họ, con gián, họ phấn đấu và sống sót qua tất cả. Nhân loại và văn minh giờ đây đang lên ngôi, và Warder hiểu điều này. Sự thấu hiểu sâu sắc của họ về tính tất yếu của chiến thắng nhân loại chính là điều đã đưa họ đến vị thế mạnh mẽ mà họ có ngày nay.\nTrong khi các bộ tộc khác cố bám víu vào những thời đại đã qua, Warder mở đường tiến về phía trước, tự tin vào tính hợp lý trong kế hoạch của mình. Giống như họ, Quốc Gia Garou sẽ tồn tại và tiến hóa nhưng, quan trọng nhất, sẽ sống sót."
 pod1230objectives_fera.13.a: "Sinh tồn, chịu đựng, phát triển."
 pod1230objectives_fera.14.b: "Lũ sói của thành phố?"
  
 shadowlord_objective_decision: "Bóng Tối của Gaia"
 shadowlord_objective_decision_tooltip: "Chúng ta được định để dẫn dắt Quốc Gia Garou, không phải lũ Silver Fang tự phụ đó"
 shadowlord_objective_decision_desc: "Nếu chúng ta muốn các bộ tộc còn lại công nhận quyền cai trị chính đáng của chúng ta đối với họ, trước tiên chúng ta phải phô diễn sức mạnh mạnh mẽ."
 shadowlord_objective_decision_effect_tooltip: "Ngươi sẽ nhận được [title|E] Đế Chế Shadow Lord, một di vật quyền năng của bộ tộc ngươi và tiến gần hơn một bước đến việc thống nhất Garou." 
 shadowlord_objective_decision_confirm: "Đã đến lúc!"
 shadowlord_decision_custom: "Caern của Bầu Trời Đêm, tại [GetTitleByKey('b_okachiv').GetNameNoTier], phải được xây dựng hoàn chỉnh"
 
 pod1230objectives_fera.15.t: "Bóng Tối của Gaia"
 pod1230objectives_fera.15.desc: "Đã quá lâu, Quốc Gia Garou thiếu vắng sự lãnh đạo đúng đắn. Silver Fang, những kẻ hề ba hoa đó, đã phô diễn dáng vẻ 'dẫn dắt' chúng ta. Nhưng họ chỉ đẩy các bộ tộc vào chia rẽ và những trận đánh vô vọng.\nVới quê hương của chúng ta lại an toàn, chúng ta đã chứng minh rằng chỉ có Shadow Lord mới đủ tư cách dẫn dắt Quốc Gia Garou tiến về phía trước. Và giờ đây, chúng ta sẽ dùng mọi công cụ trong tay để đảm bảo Gaia chiến thắng đến cùng. Các bộ tộc sẽ theo chúng ta đến chiến thắng trước Khải Huyền... dù họ có muốn hay không."
 pod1230objectives_fera.15.a: "Gaia cần những nhà vô địch khôn khéo."
 pod1230objectives_fera.16.b: "Ngai vàng của Silver Fang đã bị lật đổ."

 
 hakken_objective_decision: "Sói của Nippon"
 hakken_objective_decision_tooltip: "Một quê hương mới cho Sói."
 hakken_objective_decision_desc: "Sau Cuộc Chiến Ô Nhục, nhiều Hakken đã tự lưu đày mình đến Nippon. Dù chúng ta khoan dung với [GetTrait('kueijin').GetName(GetNullCharacter)] bản địa, sự cai trị của họ thật hà khắc. Nippon chỉ có thể được cai trị bằng danh dự, và chúng ta sẽ là chủ nhân của định mệnh chính mình."
 hakken_objective_decision_confirm: "Đã đến lúc chúng ta bén rễ, và biến vùng đất này thành nhà."
 hakken_objective_decision_requirement_example: "$hakken_objective_decision_requirement$ #weak ([example.GetName])#!"
 hakken_objective_decision_requirement: "Không [GetTrait('vampire').GetName(GetNullCharacter)] nào nắm giữ đất đai tại [GetGeographicalRegion('world_asia_japan').GetName]"
 hakken_objective_decision_requirement_example2: "$hakken_objective_decision_requirement2$ #weak ([example.GetName])#!"
 hakken_objective_decision_requirement2: "Mọi $glossary_fera$ và [GetTrait('kueijin').GetName(GetNullCharacter)] tại [GetGeographicalRegion('world_asia_japan').GetName] đều là [vassals|E] của ngươi"
 hakken_objective_decision_effect: "Ngươi sẽ nhận được [title|E] [GetTitleByKey('h_cherry_phoenix_court').GetNameNoTier] bao trùm toàn bộ [GetGeographicalRegion('world_asia_japan').GetName] và [GetGeographicalRegion('world_asia_korea').GetName]"
 pod1230objectives_fera.60.t: "Sói của Phương Đông"
 pod1230objectives_fera.60.desc: "Đã lâu chúng ta hành quân không ngừng nghỉ. Từ những cuộc hành quân thăm dò đầu tiên từ dãy Carpathia, qua những vùng đất do Silver Fang cai trị và xa hơn nữa vượt qua Stargazer, phần lớn chúng ta là những chiến binh đánh thuê. Giữa những cuộc chiến điên rồ và sự lên án của các nhà vô địch của chúng ta vì điều đó, chúng ta đã lạc lối. Nhưng không còn nữa. Giờ đây chúng ta an cư, hợp nhất các thị tộc trên vùng đất này mà phần còn lại của Thú Triều coi là chốn hẻo lánh, và biến nó thành của riêng chúng ta. Đã có tin về thành công của chúng ta đến được lục địa, và họ vô cùng ấn tượng trước những thắng lợi của chúng ta trước người Uji và Tsuchigumo bản địa. Chúng ta đứng cao, hãnh diện, và xứng đáng với quyền thừa kế của mình là Chiến Binh của Gaia. Nhưng công việc còn lâu mới kết thúc. Con Rết và các Ma Vương vẫn thịnh vượng, theo cách riêng của họ. Nhưng giờ đây? Giờ đây chúng ta có thể đưa cuộc chiến đến với chúng. Đúng cách, như những con sói kiêu hãnh của Mẫu Thần Ngọc Bích."
 pod1230objectives_fera.60.a: "Chúng ta đã tìm được một mái nhà xứng đáng."


 silentstrider_objective_decision: "Quê Hương Mới của Kẻ Lưu Đày"
 silentstrider_objective_decision_tooltip: "Ai Cập đã mất khỏi tay chúng ta, chúng ta phải xây dựng lại và bắt đầu từ đầu."
 silentstrider_objective_decision_desc: "Dù Marrakech là quê hương mới của chúng ta kể từ khi mất Ai Cập, chúng ta có thể tìm cách phá vỡ lời nguyền mà Set đã trói buộc chúng ta. Chúng ta phải sử dụng tri thức của Liên minh Osiris để phá hủy phép thuật bẩn thỉu này."
 silentstrider_objective_decision_effect_tooltip: "Ngươi sẽ nhận được [title|E] Đế Chế Silent Strider, một di vật quyền năng của bộ tộc ngươi và tiến gần hơn một bước đến việc thống nhất Garou." 
 silentstrider_objective_decision_confirm: "Giờ chúng ta đã sẵn sàng"
 silentstrider_decision_custom: "Caern của Bánh Xe Ptah, tại [GetTitleByKey('b_marrakesh').GetNameNoTier], phải được xây dựng hoàn chỉnh"
 silentstrider_decision_custom_b: "[GetScriptedCharacterByHistoryID('505094').GetFirstName] và [GetScriptedCharacterByHistoryID('790126').GetFirstName], hai kẻ đối đầu ma cà rồng chính của Silent Strider, phải chết hoặc đang $pod_torpor$"
 silentstrider_decision_custom_c: "Một nhân vật theo đức tin của Liên minh Osiris đang kiểm soát Cairo"
 
 pod1230objectives_fera.17.t: "Kẻ Lưu Đày Trở Về Quê Hương"
 pod1230objectives_fera.17.desc: "Sau cuộc chiến dài chống lại Set, Silent Strider bị buộc phải lưu đày khỏi quê hương Ai Cập của họ. Trở thành những kẻ du mục trong một thời gian, cuối cùng họ định cư tại Marrakech và vận may của họ đã cải thiện rất nhiều kể từ đó.\nGiờ đây vững vàng kiểm soát quê hương của mình một lần nữa, Silent Strider đang trở lại như một thế lực đáng gờm. Trí tuệ và sức mạnh niềm tin họ có được từ cuộc lưu đày cũng khiến họ ngày càng được các bộ tộc khác săn đón, những kẻ giờ tự hỏi liệu Strider có phải là một ứng viên mới hiếm có nhưng đầy hứa hẹn để dẫn dắt Quốc Gia Garou hay không."
 pod1230objectives_fera.17.a: "Cùng nhau đến Ai Cập!"
  
 silverfang_objective_decision: "Sự Trở Lại của Quốc Vương"
 silverfang_objective_decision_tooltip: "Chúng ta là những người lãnh đạo Quốc Gia Garou, giờ và mãi mãi."
 silverfang_objective_decision_desc: "Quyền lãnh đạo của chúng ta đối với các bộ tộc khác gần đây đã bị tranh chấp. Cần một màn phô diễn sức mạnh để dập tắt những kẻ bất đồng."
 silverfang_objective_decision_effect_tooltip: "Ngươi sẽ nhận được [title|E] Đế Chế Silver Fang, một di vật quyền năng của bộ tộc ngươi và tiến gần hơn một bước đến việc thống nhất Garou." 
 silverfang_objective_decision_confirm: "Ta đang nắm quyền chỉ huy trực tiếp"
 silverfang_decision_custom: "Caern của Trăng Lưỡi Liềm, tại [GetTitleByKey('b_voronezh').GetNameNoTier], phải được xây dựng hoàn chỉnh"
 
 pod1230objectives_fera.19.t: "Sự Trở Lại của Quốc Vương"
 pod1230objectives_fera.19.desc: "Kể từ thời La Mã, Silver Fang là những nhà lãnh đạo truyền thống của Quốc Gia Garou. Với sự sụp đổ của Đế Chế, và sự chuyển dịch dần dần của bộ tộc về hướng đông nhiều hơn, truyền thống này đã bị tranh chấp. Những bộ tộc như Shadow Lord hay Red Talon đã nhảy vào khoảng trống quyền lực để bào mòn quyền lực của Silver Fang và những bộ tộc khác như Silent Strider hay Fianna đơn giản là đã bị mất liên lạc do khoảng cách địa lý.\nTuy nhiên, với thành công gần đây của họ ở Nga, Silver Fang đang chứng minh rằng họ chỉ dời chỗ ngồi quyền lực của mình chứ không đánh mất những khả năng đã khiến họ được tôn trọng đến vậy ngay từ đầu. Không phải mọi bộ tộc đều đã quy phục, nhưng giới quý tộc của người sói đang tiến gần đến việc tái khẳng định quyền tự nhiên của họ."
 pod1230objectives_fera.19.a: "Kính chào các Quốc Vương!"
 pod1230objectives_fera.20.b: "Họ vẫn giữ được ngai vàng của mình... tạm thời"
    
 stargazer_objective_decision: "Trí Tuệ của Gaia"
 stargazer_objective_decision_tooltip: "Từ sự bình yên nội tâm có thể nảy sinh sự đoàn kết lớn hơn."
 stargazer_objective_decision_desc: "Chúng ta rao giảng sự chừng mực, và chúng ta đã chọn đứng tách biệt khỏi Quốc Gia Garou. Nhưng sự thụ động chỉ có thể kéo dài đến một mức nào đó trước khi trở thành sự thờ ơ."
 stargazer_objective_decision_effect_tooltip: "Ngươi sẽ nhận được [title|E] Đế Chế Stargazer, một di vật quyền năng của bộ tộc ngươi và tiến gần hơn một bước đến việc thống nhất Garou." 
 stargazer_objective_decision_confirm: "Đã đến lúc gặp gỡ những người anh em phương Tây của chúng ta"
 stargazer_decision_custom: "Caern của Báo Tuyết, tại [GetTitleByKey('b_xigaze').GetNameNoTier], phải được xây dựng hoàn chỉnh"
 
 pod1230objectives_fera.21.t: "Trí Tuệ của Gaia"
 pod1230objectives_fera.21.desc: "Chúng ta đã không tham gia Cuộc Chiến Phẫn Nộ và từ đó luôn giữ thái độ trung lập, tự mình quyết định. Nhưng có một giới hạn cho việc chúng ta có thể tách biệt bao xa khỏi những người anh em phương Tây. Rõ ràng, những mối đe dọa mà Garou phải đối mặt trong thời đại mới này đòi hỏi sự đoàn kết.\nCác bộ tộc khác đã chứng minh hết lần này đến lần khác xu hướng hành động hấp tấp và thiếu tính toán cẩn thận của họ. Chúng ta có thể cung cấp sự lãnh đạo sáng suốt để dẫn dắt cơn giận đó vào những việc hữu ích hơn. Đã đến lúc Quốc Gia Garou đón nhận trí tuệ của Gaia."
 pod1230objectives_fera.21.a: "Đã đến lúc bình tĩnh và lắng nghe, các người anh em."
 pod1230objectives_fera.22.b: "Những kẻ kỳ lạ này"
    
 gaia_objective_decision: "Chiến Thắng của Gaia"
 gaia_objective_decision_tooltip: "Chúng ta đã tuyên bố về việc dẫn dắt Quốc Gia Garou, giờ là lúc chứng minh chúng ta xứng đáng!"
 gaia_objective_decision_desc: "Chúng ta đã tuyên bố về việc dẫn dắt Quốc Gia Garou, giờ là lúc chứng minh chúng ta xứng đáng!"
 gaia_objective_decision_effect_tooltip: "Ngươi sẽ nhận được [title|E] Đế Chế Quốc Gia Garou, một giáo lý đức tin đặc biệt quyền năng và những kẻ trị vì không phải Người Sói sẽ bị tê liệt." 
 gaia_objective_decision_confirm: "Vì Gaia! Tiến lên!"
 
 pod1230objectives_fera.23.t: "Chiến Thắng của Gaia"
 pod1230objectives_fera.23.desc: "Bất chấp Ôn Dịch Lột Da và sự phát triển tràn lan của văn minh, Garou đã tồn tại. Dưới sự lãnh đạo mới và được tôn trọng, các bộ tộc đã đoàn kết để tiến hành một cuộc chiến chung chống lại lũ ma cà rồng đáng sợ và vô số tay sai của chúng. Từng bước một, người sói đang giành lại các Caern đã mất, kiềm chế sự phát triển của các thành phố và đảm bảo nhân loại ở đúng vị trí của mình. Khi ngày càng nhiều con đỉa bị xé toạc bởi răng nanh và móng vuốt, không còn nghi ngờ gì nữa: đây là thời đại của Sói.\nKhải Huyền có thể chờ đợi, vì Garou hơn bao giờ hết đã sẵn sàng canh giữ Gaia yêu quý của mình."
 pod1230objectives_fera.23.a: "Mẹ đã được cứu!"
 pod1230objectives_fera.24.b: "Gaia có thực sự được cứu không?"
 pod1230objectives_fera.23.custom: "Những kẻ trị vì không phải người sói sẽ nhận hiệu ứng tiêu cực mạnh mẽ, Sự Sụp Đổ của Văn Minh, trong 100 năm tới. Người sói trị vì cấp bậc thấp hơn giờ sẽ luôn chấp nhận sự thần phục từ nhân vật này, trừ Black Spiral Dancer."
    
 blackspiraldancer_objective_decision: "Những Đứa Cháu Đáng Yêu"
 blackspiraldancer_objective_decision_tooltip: "Bà mong chúng ta phải ngoan!"
 blackspiraldancer_objective_decision_desc: "Mụ Phù Thủy, Baba Yaga, là một trong những tôi tớ được chủ nhân của chúng ta tin cậy nhất. Nếu chúng ta làm hài lòng bà bằng cách tiêu diệt kẻ thù của bà, chắc chắn bà sẽ ban thưởng cho chúng ta!"
 blackspiraldancer_objective_decision_effect_tooltip: "Baba Yaga sẽ ban cho ngươi sự bất tử, theo một cách nào đó." 
 blackspiraldancer_objective_decision_confirm: "Bà có vui không, Bà ơi?"
 blackspiraldancer_victory_objective_decision_custom: "[title|E] [GetTitleByKey('k_crescent_moon').GetNameNoTier] phải bị tiêu diệt, hoặc do ngươi kiểm soát"
     
 pod1230objectives_fera.25.t: "Những Đứa Cháu Đáng Yêu"
 pod1230objectives_fera.25.desc: "Sự bành trướng nhanh chóng của Shadow Curtain, phần lớn nhờ có ngươi, đã làm hài lòng Bà Nội Nhỏ, Baba Yaga. Việc tiêu diệt bất kỳ mối đe dọa gần nào đối với quyền cai trị của bà cho phép bà tập trung vào những vấn đề quan trọng hơn nhưng điều đó không có nghĩa là bà đã quên ngươi.\nSau một nghi lễ công phu để đảm bảo ngươi sẽ (có thể) sống sót, Mụ Phù Thủy đã [Glossary('Embraced','game_concept_Embrace_desc')] ngươi, biến ngươi thành một trong những 'Vrykolakas' của bà, giống lai giữa ma cà rồng và người sói mà một số kẻ gọi là 'Nghịch Đồ'. Giờ đây ngươi đã bất tử và có thể sử dụng một số quyền năng của cả hai thế giới của mình. Hầu hết sẽ khiếp sợ trước sự biến đổi kinh khủng của ngươi nhưng ngươi biết đó thực sự là gì: món quà vĩ đại nhất."
 pod1230objectives_fera.25.a: "Ta đã đạt được sự hoàn hảo."
 pod1230objectives_fera.25.b: "Có lẽ điều đó hơi quá..."
 pod1230objectives_fera.26.a: "Thứ ghê tởm này là gì!?"
 pod1230objectives_fera.26.b: "Thứ ghê tởm này là gì!?"   
 
 become_abomination_tt: "Là một Nghịch Đồ, ngươi có toàn quyền truy cập năng lực của ma cà rồng ngoại trừ Trao truyền. Ngươi không còn là người sói nữa, nhưng ngươi vẫn giữ quyền truy cập vào Ân Huệ Dòng Sinh và Thánh Triều cũng như tùy chọn Biến Hình."
 become_abomination_holdings_tt: "Lãnh địa của ngươi sẽ được đổi từ bộ lạc sang lâu đài, mất đi những công trình giờ không tương thích trong quá trình này."
 
 storyteller_quest_decision: "Đại Nhiệm của Gaia"
 storyteller_quest_decision_desc: "Người sói sống (và thường chết) vì những nhiệm vụ sử thi do các thực thể tâm linh ban tặng. Thực hiện một nhiệm vụ như vậy sẽ mang lại cho ngươi phần thưởng lớn nếu ngươi có thể thành công.\nThu thập những cuốn sách huyền thoại sẽ là một nỗ lực đáng giá cho Gaia."
 storyteller_quest_decision_tooltip: "Kiếm được ân huệ huyền thoại."
 storyteller_quest_decision_confirm: "Vì Gaia!"
 
 release_from_bondage_quest_decision: "Đại Nhiệm của Incarna"
 release_from_bondage_quest_decision_desc: "Người sói sống (và thường chết) vì những nhiệm vụ sử thi do các thực thể tâm linh ban tặng. Thực hiện một nhiệm vụ như vậy sẽ mang lại cho ngươi phần thưởng lớn nếu ngươi có thể thành công.\nPhá hủy Shadow Curtain áp bức chắc chắn sẽ làm hài lòng Incarna."
 release_from_bondage_quest_decision_tooltip: "Kiếm được ân huệ huyền thoại."
 release_from_bondage_quest_decision_confirm: "Đánh sập bức tường"
 release_from_bondage_quest_decision_custom: "Tước hiệu [GetTitleByKey('e_shadow_curtain').GetNameNoTier] phải bị phá hủy"
 
 firebringer_quest_decision: "Đại Nhiệm của Coyote"
 firebringer_quest_decision_desc: "Người sói sống (và thường chết) vì những nhiệm vụ sử thi do các thực thể tâm linh ban tặng. Thực hiện một nhiệm vụ như vậy sẽ mang lại cho ngươi phần thưởng lớn nếu ngươi có thể thành công.\nTên bịp bợm Coyote chắc chắn sẽ hài lòng với một nhiệm vụ kỳ quặc."
 firebringer_quest_decision_tooltip: "Kiếm được ân huệ huyền thoại."
 firebringer_quest_decision_confirm: "Vậy chắc là đủ rồi, ta hy vọng thế"
 firebringer_quest_decision_custom: "Trao một [title|E] [empire|E]"
 
 prelude_to_apocalypse_quest_decision: "Đại Nhiệm của Maeljin Incarna"
 prelude_to_apocalypse_quest_decision_desc: "Người sói sống (và thường chết) vì những nhiệm vụ sử thi do các thực thể tâm linh ban tặng. Thực hiện một nhiệm vụ như vậy sẽ mang lại cho ngươi phần thưởng lớn nếu ngươi có thể thành công.\nĐể làm hài lòng Maeljin, ngươi phải mang sự hủy diệt đến vùng đất và chứng minh sự tinh thông của mình đối với các thế lực của sự ô uế."
 prelude_to_apocalypse_quest_decision_tooltip: "Kiếm được ân huệ huyền thoại."
 prelude_to_apocalypse_quest_decision_confirm: "Quyền Năng Vô Hạn!"
 prelude_to_apocalypse_quest_decision_requirement: "Ngươi phải có [spirit_companion|E] [GetFaithByKey('wyrmbound').GetName] ở Cấp Bậc tối đa."
 
 coruroc_quest_decision: "Nhiệm Vụ Cá Nhân của Coruroc"
 coruroc_quest_decision_desc: "Coruroc yêu cầu ngươi thanh tẩy sự ô nhiễm của Black Spiral Dancer nhân danh White Howler. Từng tổ ổ bẩn thỉu của chúng phải bị thanh trừng!"
 coruroc_quest_decision_tooltip: "Báo thù cho Howler."
 coruroc_quest_decision_confirm: "Cuối cùng cũng được thanh tẩy?"
 coruroc_quest_decision_custom: "Không được có [ruler|E] nào theo [GetReligionByKey('blackspiraldancer_religion').GetName] [religion|E] trên bản đồ"
 coruroc_quest_decision_custom_ex: "$coruroc_quest_decision_custom$ #weak ([example.GetFirstName])#!"      
 
 aidan_farwatcher_quest_decision: "Nhiệm Vụ Cá Nhân của Aidan Farwatcher"
 aidan_farwatcher_quest_decision_desc: "Bị thúc đẩy bởi khát vọng báo thù cho bộ tộc bị phản bội của mình, Aidan Farwatcher yêu cầu ngươi tiêu diệt Black Spiral Dancer."
 aidan_farwatcher_quest_decision_tooltip: "Cuộc Xoắn Ốc bị hóa giải?"
 aidan_farwatcher_quest_decision_confirm: "Một cuộc báo thù đẫm máu"
 
 stop_flaying_plague_decision: "Chặn Đứng Ôn Dịch Lột Da"
 stop_flaying_plague_decision_tooltip: "Phải có một giải pháp!"
 stop_flaying_plague_decision_desc: "Ôn Dịch Lột Da đang cướp đi vô số sinh mạng Garou và Thân Tộc trong hành trình lây lan của nó. Nếu không có gì được thực hiện, đây có thể là dấu chấm hết cho những chiến binh từng kiêu hãnh của Gaia.\n\nSilent Strider đang tìm cách giải quyết. Nếu không có gì được thực hiện trước thời điểm đó, họ nghĩ mình có thể đạt được kết quả vào năm 1265."
 stop_flaying_plague_decision_effect_tooltip: "Ôn Dịch Lột Da sẽ ngừng lây lan." 
 stop_flaying_plague_decision_confirm: "Bây giờ hoặc không bao giờ!"
 stop_flaying_plague_decision_custom: "Ngươi cần 10 trở lên ở mọi thuộc tính, trừ prowess cần 40 trở lên. Thuộc tính của các thành viên pack của ngươi cũng có thể được tính."
 
 pod1230objectives_fera.27.t: "Chặt Đứt Một Căn Bệnh"
 pod1230objectives_fera.27.desc: "Nhờ kỹ năng của pack và tùy tùng của ngươi, ngươi đã tìm ra manh mối về sự thật đằng sau Ôn Dịch Lột Da. Căn bệnh khủng khiếp này quả thực có nguồn gốc siêu nhiên, dường như được tạo ra bởi một nhóm pháp sư tôn thờ $glossary_wyrm$ tự xưng là Vòng Tròn Đỏ.\nNhững kẻ ngu ngốc này đã đứng sau nhiều cuộc tấn công táo tợn vào các Caern phía đông, đáng chú ý nhất là ở Sofia, và dù chúng cố che giấu dấu vết, chúng đã không làm điều đó đủ tốt và đủ nhanh.\nXông vào sào huyệt của chúng, ngươi đã cảm thấy vô cùng thỏa mãn khi chém giết đường vào giữa lũ tà đạo nhiễm Wyrm này cho đến khi các vòng tròn nghi lễ của chúng nhuộm đỏ bằng chính máu của chúng.\nDù mối đe dọa từ Ôn Dịch Lột Da giờ đã ở phía sau ngươi, vẫn còn một số nghi vấn về chi tiết liên quan đến nguồn gốc của nó, một số manh mối dẫn đến một ma cà rồng bí ẩn và những manh mối khác dẫn đến một ác quỷ. Điều này có thể đáng để điều tra trong tương lai nhưng, ít nhất là bây giờ, nghĩa vụ của ngươi với Gaia đã được hoàn thành."
 pod1230objectives_fera.27.a: "Một chiến thắng huyền thoại!"
 pod1230objectives_fera.28.a: "Tốt cho lũ sói, ta đoán vậy."
 pod1230objectives_fera.28.b: "Cuối cùng cũng xong!"
 
 weaponize_flaying_plague_decision: "Vũ Khí Hóa Ôn Dịch Lột Da"
 weaponize_flaying_plague_decision_tooltip: "Vũ khí tối thượng chống lại người sói?"
 weaponize_flaying_plague_decision_desc: "$POD_splat_werewolf_plural$ và gia đình họ, [GetTrait('kinfolk').GetName(GetNullCharacter)], gần đây đã bị ảnh hưởng bởi một căn bệnh chết chóc, Ôn Dịch Lột Da. Rõ ràng họ đang nỗ lực tìm ra giải pháp nhưng, cho đến lúc đó, phương pháp hiếm hoi này để phá vỡ hàng phòng thủ của một kẻ sói mang lại một cơ hội."
 weaponize_flaying_plague_decision_effect_tooltip: "Ngươi sẽ có thể lây lan Ôn Dịch Lột Da như một tương tác." 
 weaponize_flaying_plague_decision_effect_tooltip_2: "Bằng cách sử dụng Ôn Dịch Lột Da lên một tù nhân, ngươi có thể có cơ hội thành công trong việc Trao truyền cho họ và biến họ thành một [GetTrait('abomination').GetName(GetNullCharacter)] (ngoại trừ $glossary_fera$ vốn hoàn toàn không thể trở thành nghịch đồ)." 
 weaponize_flaying_plague_decision_confirm: "Vũ khí bí mật hoàn hảo của ta!"
 weaponize_flaying_plague_decision_custom: "Ngươi cần 3 tù nhân người sói trở lên để thí nghiệm."
 weaponize_flaying_plague_decision_customb: "Lũ người sói đang nỗ lực hết sức để tìm ra nguồn gốc của Ôn Dịch Lột Da. Một khi họ tìm ra (khoảng năm 1240), quyết định này sẽ biến mất."
 
 pod1230objectives_fera.29.t: "Ôn Dịch Lột Da Đã Vũ Khí Hóa"
 pod1230objectives_fera.29.desc: "Nguồn gốc thực sự của Ôn Dịch Lột Da vẫn còn bí ẩn. Vòng Tròn Đỏ theo tà đạo dường như là thủ phạm khả dĩ nhất nhưng ngươi cũng bắt gặp những đề cập về sự can thiệp từ một đại ác quỷ và thậm chí một vài ma cà rồng. Dù thế nào đi nữa đây cũng là một kỳ tích ấn tượng của phép thuật nghi lễ với rõ ràng một chút hơi hướng địa ngục.\nNhững thí nghiệm của chính ngươi trên những người sói ngươi có trong tay đã tiết lộ đủ về quy trình để giờ đây hiểu được cách tái tạo nó nếu cần thiết.\nNgay cả khi lũ người sói cuối cùng phá hủy nguồn gốc của Ôn Dịch Lột Da hiện tại, ngươi vẫn sẽ có thể sử dụng nó trong tương lai."
 pod1230objectives_fera.29.a: "Quả là một công cụ hữu ích..."
#pod1230objectives_fera.30.a: "I don't care"
#pod1230objectives_fera.30.b: "What it mean?"   

 gaian_church_objective_decision: "Mẫu Thần của Muôn Loài"
 gaian_church_objective_decision_tooltip: "Nhân loại phải đến để thấu hiểu Gaia."
 gaian_church_objective_decision_desc: "Một số người sói cố gắng xâm nhập Giáo Hội vì lòng sùng đạo thật sự hoặc vì cơ hội chủ nghĩa. Họ cố gắng đồng hóa Gaia với Đức Mẹ Đồng Trinh và đẩy hình tượng sau lên vị trí nổi bật hơn trong giáo lý của Rome."
 gaian_church_objective_decision_effect_tooltip: "Ngươi sẽ thay đổi giáo lý của giáo hội và kết hợp lý tưởng Gaian với thể chế nhân loại." 
 gaian_church_objective_decision_confirm: "Dẫn dắt chúng con, Mẫu Thần"
 gaian_church_objective_decision_custom1: "$POD_splat_hunter_plural$ sẽ ngừng xem Garou là kẻ thù không thể hòa hợp. Thay vào đó, Garou sẽ được coi là những người bảo vệ, người che chở, kẻ làm phép màu hoặc mang sứ mệnh thiêng liêng.\nĐiều này sẽ khiến đức tin của họ hợp tác dễ dàng hơn."

 pod1230objectives_fera.125.desc: "Trong khi hầu hết người sói kinh hãi trước sự trỗi dậy của Cơ Đốc Giáo, một số ít nhìn thấy cơ hội, và còn ít hơn nữa nhìn thấy một chút bóng dáng của Gaia trong lòng sùng kính của phàm nhân dành cho Mary. Dù ban đầu chỉ là thiểu số, những phe phái này đã tận dụng tốt sự phát triển nhanh chóng của quyền lực Giáo Hội và khéo léo tác động đến các cuộc tranh luận thần học để ủng hộ việc thờ phụng Mary khi có thể.\nĐã mất một thời gian dài và nhiều lần khởi đầu thất bại nhưng kết quả đang bắt đầu hiện rõ. Với ảnh hưởng dường như tinh tế này, "Giáo Hội của Gaia" đã tạo ra một hiệu ứng dây chuyền dẫn đến việc Giáo Hội Công Giáo âm thầm chuyển sự chú ý khỏi người sói và hướng nhiều hơn đến những mối quan tâm khác."
 pod1230objectives_fera.125.a: "Tất cả dưới một Mẫu Thần"
 gaiachurch_objective_decision_custom_roma: "Chủ nhân của [GetTitleByKey('c_roma').GetNameNoTier] phải là một [GetFaithDoctrine('special_doctrine_ecumenical_hunters').GetBaseName] hoặc theo đức tin của ngươi."
 
 bagheera_objective_decision: "Akari, Pourra, Doyala"
 bagheera_objective_decision_tooltip: "Tìm Kiếm, Nền Tảng, Trao Truyền"
 bagheera_objective_decision_desc: "Bagheera tự coi mình là những kẻ toàn diện nhất trong loài mèo. Nhiều tài năng và sức hút to lớn khiến báo hoa là bộ tộc duy nhất được mọi bộ tộc khác chấp nhận làm bạn. Có lẽ họ có thể tận dụng điều này để thúc đẩy sự đoàn kết trong Quốc Gia Bastet?"
 bagheera_objective_decision_effect_tooltip: "Ngươi sẽ mở khóa một chuỗi sự kiện đưa ngươi vào con đường thống nhất Quốc Gia Bastet. Là một Bagheera, quá trình này sẽ dễ dàng hơn một chút." 
 bagheera_objective_decision_confirm: "Vững vàng như một con mèo."
 bagheera_objective_decision_custom: "Ngươi cần 10 trở lên ở mọi thuộc tính, trừ prowess cần 40 trở lên. Thuộc tính của các thành viên pack của ngươi cũng có thể được tính."
  
 pod1230objectives_fera.31.desc: "Theo truyền thuyết của họ, Bagheera từng được tạo ra để làm quan tòa của loài mèo. Dù vai trò này đã bị bỏ từ lâu, họ vẫn giữ được sự tò mò tự nhiên và sức hút thân thiện đi kèm với nó. Như họ thường nói, họ là hiện thân chân thực nhất của tinh thần loài mèo, sự khôn ngoan, tình yêu và cơn giận hòa quyện làm một. Độc nhất trong số các bộ tộc Bastet bị chia rẽ, Bagheera duy trì được mối quan hệ thân thiện với tất cả anh em họ hàng của mình và, với sự nổi tiếng gần đây, điều này đã nảy sinh ý tưởng rằng có lẽ đã đến lúc những kẻ mang hình báo tận dụng sức mạnh này và thúc đẩy sự thống nhất của Quốc Gia Bastet bị chia rẽ.\nDù các bộ tộc khác hoài nghi tối đa, sự lãnh đạo tài năng hiện tại của Bagheera đã ít nhất đưa họ đến bàn đàm phán. Giờ vẫn còn phải xem liệu những con báo lôi cuốn này có đưa nỗ lực này đến một kết luận thỏa đáng hay không."
 pod1230objectives_fera.31.a: "Tất cả chúng ta đều là con của Seline!"

 bubasti_objective_decision: "Mèo Đấu Rắn"
 bubasti_objective_decision_tooltip: "Chúng ta kiên nhẫn. Chúng ta sẽ chờ đợi cuộc báo thù khải hoàn của mình."
 bubasti_objective_decision_desc: "Bubasti, từng được người Ai Cập tôn thờ như thần linh, đã mất tất cả vì cuộc chiến chống lại Setite. Nhưng như chính Bast, họ kiên nhẫn và những kẻ theo con rắn vẫn chưa thấy điều tồi tệ nhất từ những con mèo đen như đêm của xứ Khem."
 bubasti_objective_decision_effect_tooltip: "Ngươi sẽ giải phóng thân tộc mèo bị bắt giữ của mình, cho phép ngươi nhận được sự giúp đỡ từ họ trong tương lai.\nNgươi cũng sẽ mở khóa một chuỗi sự kiện đưa ngươi vào con đường thống nhất Quốc Gia Bastet." 
 bubasti_objective_decision_confirm: "Trên đường rình rập."
 bubasti_objective_decision_extra1: "Ngươi phải có ít nhất 20 [perks|E] trong [sorcery_lifestyle|E]"
  
 pod1230objectives_fera.32.desc: "Từng được người dân Ai Cập tôn thờ như thần linh, Bubasti đã mất tất cả trong cuộc chiến chống lại những kẻ theo Set. Tuy nhiên họ đã kiên nhẫn và hàng thiên niên kỷ tri thức về pháp thuật đã cho phép họ quan sát và chờ đợi thời điểm thích hợp để phản công.\nVà họ đã tìm thấy nó.\nDẫn đầu một lực lượng liên hợp táo bạo của $glossary_osirian_league$ tại ngôi đền Setite ở Ombos, Bubasti đã giải cứu thành công thân tộc đã mất của họ, những con mèo Kyphur, và giáng một đòn mạnh vào kẻ thù truyền kiếp của mình.\nVới niềm tự hào được khôi phục và thân tộc mèo của họ cuối cùng được phép thịnh vượng trở lại, những con mèo đen như đêm của xứ Khem đã gây ấn tượng mạnh với phần còn lại của Quốc Gia Bastet. Dù nhiều kẻ vẫn còn dè chừng thứ pháp thuật kỳ lạ của họ, hầu hết đều sẵn lòng cân nhắc ý tưởng để Bubasti đảm nhận vai trò nổi bật hơn trong tương lai."
 pod1230objectives_fera.32.a: "Hãy cúi đầu trước con mèo bóng đêm."

 ceilican_objective_decision: "Điên Cuồng Nhảy Múa"
 ceilican_objective_decision_tooltip: "Thời của sự nhàn hạ và bất cẩn đã qua. Bọn phản bội Faerie sẽ phải trả giá."
 ceilican_objective_decision_desc: "Từng vô tư và sống một cuộc đời hưởng lạc, Ceilican đã bị lãnh chúa Faerie Samhach phản bội, kẻ đã săn đuổi họ hiệu quả đến mức gần như đẩy họ đến tuyệt chủng. Giải thoát những tù nhân này sẽ cần một kế hoạch vững chắc và một nhóm anh hùng còn vững chắc hơn nhưng đó có thể là hy vọng sống còn duy nhất cho bộ tộc Ceilican."
 ceilican_objective_decision_effect_tooltip: "Ngươi sẽ giải phóng những anh chị em bị bắt giữ của mình, những người sau đó sẽ gia nhập triều đình của ngươi.\nNgươi cũng sẽ mở khóa một chuỗi sự kiện đưa ngươi vào con đường thống nhất Quốc Gia Bastet." 
 ceilican_objective_decision_confirm: "Một kiểu nhảy khác..."
   
 pod1230objectives_fera.33.desc: "Từng vô tư và sống một cuộc đời hưởng lạc, Ceilican đã bị lãnh chúa Faerie Samhach phản bội, kẻ đã săn đuổi họ hiệu quả đến mức gần như đẩy họ đến tuyệt chủng. Tuy nhiên "những con mèo hay đổi ý" chưa sẵn sàng từ bỏ và, dưới sự lãnh đạo tận tụy của ngươi, đã dàn dựng một cuộc trở lại đáng ngạc nhiên, xông vào triều đình Faerie của Lãnh Chúa Samhach và giải phóng đồng loại bị bắt giữ của họ.\nKhi Ceilican chiến thắng nhảy múa và ăn mừng trong đống đổ nát của triều đình kẻ phản bội đáng ghét, phần còn lại của Quốc Gia Bastet chú ý đến diễn biến khó hiểu này. Từng bị coi là đã tuyệt chủng, giờ dường như đã đến lúc chào đón Ceilican trở lại giữa những anh em mèo của họ, có lẽ là dấu hiệu cho ý muốn của Mẫu Seline rằng các con của bà cuối cùng nên vượt qua những hiềm khích cá nhân và đoàn kết dưới một ngọn cờ?"
 pod1230objectives_fera.33.a: "Bữa tiệc chưa kết thúc đâu!"

 khan_objective_decision_judgment_hammer: "Ngươi phải thu hồi [GetPODArtifact('judgment_hammer').GetName], vũ khí được coi trọng nhất của Khan và có thể nói là quyền năng nhất của toàn thể Bastet."
 khan_objective_decision: "Những Con Hổ Khôn Ngoan và Hung Dữ"
 khan_objective_decision_tooltip: "Bằng cách đạt được sự cân bằng hoàn hảo, chúng ta sẽ chỉ đường cho Quốc Gia Bastet."
 khan_objective_decision_desc: "Những thợ săn, chiến binh và người thầy vương giả, Khan là giới quý tộc thực sự của Bastet bất kể Simba chuyên chế có tuyên bố gì. Bằng cách hoàn thiện bản thân, họ có thể cho loài mèo thấy rằng họ thực sự được Mẫu Seline chọn lựa để dẫn dắt đến một tương lai huy hoàng."
 khan_objective_decision_effect_tooltip: "Điều này sẽ cải thiện Búa Phán Xét.\nNgươi cũng sẽ mở khóa một chuỗi sự kiện đưa ngươi vào con đường thống nhất Quốc Gia Bastet." 
 khan_objective_decision_confirm: "Đam mê, sức sống và trí tuệ."
  
 pod1230objectives_fera.34.desc: "Simba giận dữ nghĩ rằng Bastet nên được dẫn dắt bởi một con sư tử, một sinh vật lười biếng dựa vào các vợ để săn mồi và dựa vào sức mạnh để bắt nạt kẻ khác. Khan thay vào đó cho thấy tấm gương của con hổ, một kẻ săn mồi khôn ngoan và duyên dáng tự mình chiến đấu khi cần nhưng nếu không thì tìm cách cải thiện điều kiện của mình và của pack mình. Trong một thời gian dài, các Bastet khác đã âm thầm hy vọng Khan sẽ đảm nhận vai trò nổi bật hơn trong Quốc Gia Bastet để đối trọng với Simba.\nNhờ sự lãnh đạo vững vàng của ngươi và việc thu hồi Búa Phán Xét huyền thoại, thời điểm đó giờ đã đến. Simba có thể ra vẻ và gầm gừ tùy thích nhưng các bộ tộc khác giờ đang tập hợp sau lời kêu gọi đoàn kết của loài hổ."
 pod1230objectives_fera.34.a: "Một thời đại rực rỡ cho loài mèo bắt đầu!"

 simba_objective_decision: "Bạo Chúa Sư Tử"
 simba_objective_decision_tooltip: "Sư tử là vua của tự nhiên. Đã đến lúc nhắc nhở chúng."
 simba_objective_decision_desc: "Simba là những kẻ thống trị chính đáng của loài mèo. Tuy nhiên những khoảnh khắc yếu đuối và cáo buộc về "sự cai trị chuyên chế" đã làm xói mòn tuyên bố này. Đã đến lúc nhắc nhở các bộ tộc khác ai mới là người nắm quyền."
 simba_objective_decision_effect_tooltip: "Ngươi cũng sẽ mở khóa một chuỗi sự kiện đưa ngươi vào con đường thống nhất Quốc Gia Bastet." 
 simba_objective_decision_confirm: "Các quốc vương vạn tuế."
  
 ruler_catkind_dynasty_modifier: "Sư Tử Vương Giả và Đáng Sợ"
 ruler_catkind_dynasty_modifier_desc: "Simba đã tái khẳng định tuyên bố cai trị các bộ tộc Bastet khác của mình. Lũ sư tử đứng sẵn sàng bảo vệ điều đó trước bất kỳ kẻ nào dại dột tranh chấp sự thật này." 
 pod1230objectives_fera.35.desc: "Truyền thuyết Simba tuyên bố rằng mỗi bộ tộc Bastet được Mẫu Seline tạo ra với một mục đích trong tâm trí. Của họ là làm chúa tể. Rõ ràng, các Bastet khác có xu hướng bất đồng mạnh mẽ về cách diễn giải đó. Tuy nhiên sự than vãn vặt vãnh của họ không đáng để lũ sư tử hùng mạnh bận tâm.\nKhi các bộ tộc khác chìm đắm trong những mối bận tâm vô ích và nhỏ nhen, Simba làm điều duy nhất đáng làm: họ chinh phục và khẳng định quyền cai trị Châu Phi và xa hơn nữa với tư cách các quốc vương thực sự của vùng đất này. Và với thành công gần đây của họ trong việc khẳng định tuyên bố đó, các bộ tộc khác lần này im lặng."
 pod1230objectives_fera.35.a: "Một quốc vương thực sự tìm kiếm những gì hắn có thể lấy được."
 
 swara_spiritual_guardians_modifier: "Linh Hồn của Damaa"
 swara_spiritual_guardians_modifier_desc: "Nhờ mối liên kết chặt chẽ với thế giới tâm linh, Swara có thể dựa vào sự giúp đỡ ngoại giới dễ dàng hơn nhiều so với các bộ tộc Bastet khác."
 swara_objective_decision: "Người Bảo Vệ của Những Nơi Thuần Khiết"
 swara_objective_decision_tooltip: "Trong khi những kẻ khác cãi vã, chúng ta làm công việc mà Mẫu Seline đã giao phó cho chúng ta."
 swara_objective_decision_desc: "Swara là những người bảo vệ của những nơi tràn đầy linh khí. Trong khi các bộ tộc Bastet khác gạt bỏ họ là những kẻ hèn nhát và cô độc, họ âm thầm bảo vệ sự thuần khiết của Châu Phi với một lòng nhiệt thành mà ngay cả một Khan cũng phải ganh tị."
 swara_objective_decision_effect_tooltip: "Ngươi cũng sẽ mở khóa một chuỗi sự kiện đưa ngươi vào con đường thống nhất Quốc Gia Bastet." 
 swara_objective_decision_confirm: "Chúng ta làm những gì cần phải làm."
 swara_objective_decision_caern_tooltip: "Ngươi cần có một Caern đã tối đa cho mỗi loại (công trình cấp công quốc Cấp 5, Caern của Ý Chí, Phẫn Nộ, Lãnh Đạo, Trí Tuệ và Bí Ẩn)"

 pod1230objectives_fera.36.desc: "Báo lửa là một bí ẩn với các bộ tộc khác. Nhiều kẻ gạt bỏ họ là hèn nhát, luôn có vẻ chạy trốn vô định từ nơi này đến nơi khác và né tránh xung đột. Điều này không thể sai hơn được. Swara là những người bảo vệ tận tụy của sự thuần khiết vùng đất và họ chiến đấu quyết liệt như bất kỳ sư tử nào khi nhiệm vụ thiêng liêng của họ bị đe dọa.\nDù họ không phô trương, công việc của họ gần đây đã bắt đầu được công nhận trong Quốc Gia Bastet. Các bộ tộc khác im lặng, suy ngẫm rằng họ đã cãi vã hoặc ám ảnh về những mối bận tâm nhỏ nhặt trong khi Swara đang thực hiện ý chỉ của Mẫu Seline. Điều này đã dẫn đến một động lực bất ngờ đưa họ lên hàng đầu trong lời kêu gọi đoàn kết Bastet mới. Vẫn còn phải xem liệu "Tộc Bạc" thường tách biệt này có đáp lại lời kêu gọi đó trong tương lai hay không."
 pod1230objectives_fera.36.a: "Họ đang bắt đầu hiểu ra chăng?"
 
 pod1230objectives_fera.37.t: "Thống Nhất Quốc Gia Bastet"
 pod1230objectives_fera.37.desc: "Với thành công gần đây của ngươi đưa bộ tộc mình lên hàng đầu của Bastet, ý tưởng hợp nhất các bộ tộc rải rác thành một khối gắn kết đã nổi lên lần nữa. Hầu hết truyền thuyết loài mèo đồng ý rằng các ngươi từng được Mẫu Seline định sẵn để cùng nhau hợp tác và sự chia rẽ xảy ra trong những ngày đầu tiên chính là nguyên nhân chính dẫn đến thất bại của các ngươi trước người sói trong Cuộc Chiến Phẫn Nộ.\nDù vậy, bất chấp sự thật đã được đồng thuận này, đây sẽ là một nhiệm vụ rất khó khăn để đưa loài mèo đoàn kết lại một lần nữa. Mỗi bộ tộc sẽ cần được thuyết phục và mèo không gì khác ngoài vừa cứng đầu vừa hay thay đổi cùng lúc."
 pod1230objectives_fera.37.a: "Hãy nghe quan điểm của họ."
 
 pod1230objectives_fera.38.desc: "Bagheera hoàn toàn ủng hộ kế hoạch của ngươi để khôi phục Quốc Gia Bastet. Dù sao họ đã vận động cho điều đó suốt nhiều thế kỷ. Tuy nhiên, các quan tòa của loài mèo không muốn lặp lại những sai lầm của quá khứ và họ muốn chắc chắn rằng ngươi đủ tư cách dẫn dắt anh em mình đến một tương lai thịnh vượng.\nHọ định quan sát cách ngươi làm việc và cách ngươi vây quanh mình với tư cách một kẻ trị vì trước khi cam kết hoàn toàn cho sự nghiệp này. Để giúp ngươi trong việc này, họ đã đề nghị lời dạy của một trong những người thầy khôn ngoan nhất của họ để khắc phục điểm yếu trong khi cải thiện điểm mạnh của ngươi."
 pod1230objectives_fera.38.a: "Chúng ta sẽ tự lo liệu ổn thỏa."
 pod1230objectives_fera.38.b: "Sự sẵn lòng giúp đỡ của họ thật đáng trân trọng."
 new_objective_effect_tooltip: "Một quyết định lớn mới đã sẵn sàng."
 
 bagheera_nation_decision_custom: "Ngươi cần 15 trở lên ở mọi thuộc tính, trừ prowess cần 50 trở lên. Thuộc tính của các thành viên Pride của ngươi cũng có thể được tính."
 bastet_nation_progress_objective_decision_effect_tooltip: "Ngươi sẽ tiến gần hơn một bước đến việc khôi phục Quốc Gia Bastet."
 bagheera_nation_objective_decision: "Quốc Gia Bastet: Bagheera"
 bagheera_nation_objective_decision_tooltip: "Chúng ta phải được đánh giá xứng đáng."
 bagheera_nation_objective_decision_desc: "Bagheera tự coi mình là những kẻ toàn diện nhất trong loài mèo. Nhiều tài năng và sức hút to lớn khiến báo hoa là bộ tộc duy nhất được mọi bộ tộc khác chấp nhận làm bạn. Họ háo hức tham gia vào nỗ lực thống nhất Bastet của ngươi nhưng muốn chắc chắn trước tiên rằng ngươi sẽ là một kẻ trị vì khôn ngoan và có năng lực."
 bagheera_nation_objective_decision_confirm: "Một màn thể hiện tài trị vì xuất sắc."
 
 pod1230objectives_fera.39.desc: "Thành thật mà nói, Bubasti dường như không quan tâm nhiều đến mong muốn thống nhất Quốc Gia Bastet của ngươi. Những con mèo bóng tối bí ẩn của Ai Cập có vấn đề riêng cần giải quyết, đáng chú ý nhất là vụ bắt cóc thân tộc của họ, những con mèo Kyphur, bởi những Kẻ theo Set. Họ sẵn lòng chấp nhận ngươi làm kẻ trị vì loài mèo... nếu ngươi cam kết nguồn lực đáng kể của mình để giúp đỡ họ. Tuy nhiên họ không đến tay không, đề nghị dạy ngươi những bí mật của phép thuật tổ tiên của họ, được thừa hưởng từ thời chính nữ thần Isis vĩ đại nuôi dưỡng bộ tộc của họ."
 pod1230objectives_fera.39.a: "Sự nghiệp của ngươi cũng là của chúng ta."
 pod1230objectives_fera.39.b: "Ngươi nói phép thuật ư?"
 pod1230objectives_fera.39.c: "Ta chắc chắn chúng ta có thể thuyết phục họ suy nghĩ lại."
 used_bagheera_joker_tooltip: "Ngươi sẽ sử dụng "lá bài chủ" của mình, một cơ hội một lần để trực tiếp tập hợp bộ tộc này vào sự nghiệp của ngươi thay vì phải đáp ứng yêu cầu của họ."
 
 bubasti_knight_help_modifier: "Giúp Đỡ Bubasti"
 bubasti_knight_help_modifier_desc: "Nhiều nhà vô địch giỏi nhất của ngươi hiện đang vắng mặt, giúp Bubasti lên kế hoạch giải phóng thân tộc của họ khỏi Những Kẻ theo Set."
 bubasti_nation_objective_decision: "Quốc Gia Bastet: Bubasti"
 bubasti_nation_objective_decision_tooltip: "Đã đến lúc họ bước ra khỏi bóng tối."
 bubasti_nation_objective_decision_desc: "Bubasti, từng được người Ai Cập tôn thờ như thần linh, đã mất tất cả vì cuộc chiến chống lại Setite. Họ sẽ cam kết trung thành với sự nghiệp của ngươi nếu ngươi cung cấp cho họ đủ sự hỗ trợ để khôi phục vinh quang đã mất, bắt đầu từ thân tộc bị bắt giữ của họ."
 bubasti_nation_objective_decision_confirm: "Vậy chắc là đủ rồi."
  
 ceilican_nation_objective_decision: "Quốc Gia Bastet: Ceilican"
 pod1230objectives_fera.40.desc: "Một vị khách bất ngờ đã khiến các đại diện Bastet tập hợp sửng sốt khi tuyên bố mình là thành viên của Ceilican. "Những con mèo hay đổi ý" trong truyền thuyết Celt từ lâu đã bị phần còn lại của loài mèo cho là đã chết. Cá nhân này giải thích rằng Ceilican đã bị một lãnh chúa Fae săn đuổi đến gần tuyệt chủng nhưng một số ít trong họ đã trốn thoát và sống sót. Nghe tin về nỗ lực thống nhất Bastet đổi mới, họ đã đến khiêm tốn yêu cầu sự giúp đỡ của ngươi trong việc giải phóng những người sống sót còn lại khỏi tay kẻ thù của họ.\nLà kẻ trị vì tiềm năng của tất cả Con Cái Seline, ngươi khó có thể từ chối lời cầu xin giúp đỡ như vậy."
 pod1230objectives_fera.40.b: "Trốn tránh lâu như vậy? Hẳn ngươi biết vài mánh khóe."  
 ceilican_nation_objective_decision_tooltip: "Những người anh em họ bị lãng quên trở về với gia đình."
 ceilican_nation_objective_decision_confirm: "Một chiến thắng xứng đáng với vị trị vì mới của Bastet!"
 any_knight_ceilican_tooltip: "Ngươi phải có 5 hiệp sỹ trở lên với ít nhất 45 prowess."
 
 khan_nation_objective_decision: "Quốc Gia Bastet: Khan"
 pod1230objectives_fera.41.desc: "Những con hổ hùng mạnh luôn được coi là một ứng viên lãnh đạo mạnh mẽ cho Quốc Gia Bastet, sức mạnh vô song và phẩm hạnh danh dự khiến họ được những kẻ khác tôn trọng. Tuy nhiên, họ đã ân cần chấp nhận nhường bước cho tham vọng của ngươi, công nhận thành công ấn tượng của ngươi cho đến nay. Tuy nhiên Khan đã đưa ra cho ngươi một thử thách để chứng minh rằng ngươi thực sự là người được Seline chọn như ngươi tuyên bố. Họ thậm chí đề nghị cho ngươi trải qua thử thách truyền thống của họ dành cho giới quý tộc Khan, một bài kiểm tra khắc nghiệt và khó khăn nổi tiếng. Dù điều đó chưa đủ để giành được lòng trung thành của họ, điều này chắc chắn sẽ cải thiện tính chính danh của ngươi với toàn thể Bastet."
 pod1230objectives_fera.41.a: "Hãy để ta nghe yêu cầu của các ngươi."
 pod1230objectives_fera.41.b: "Về thử thách đó..."
 khan_nation_objective_decision_desc: "Những thợ săn, chiến binh và người thầy vương giả, Khan là giới quý tộc thực sự của Bastet bất kể Simba chuyên chế có tuyên bố gì. Họ sẽ không chấp nhận một kẻ trị vì không thể hiện được sự hoàn hảo tương xứng cả về thể chất lẫn tinh thần."
 khan_nation_objective_decision_tooltip: "Kết thân với những con hổ."
 khan_nation_objective_decision_confirm: "Ta là Khan của các Khan."
   
 simba_nation_objective_decision: "Quốc Gia Bastet: Simba"
 pod1230objectives_fera.42.desc: "Là những kẻ tự xưng vương của Quốc Gia Bastet, những con sư tử kiêu ngạo và tự phụ luôn khoác lác rằng họ mới nên là kẻ cai trị, thường đánh nhau với các Bastet khác để khẳng định tuyên bố của mình nếu cần. Ngươi đã mong đợi đề xuất thống nhất loài mèo dưới sự lãnh đạo của ngươi sẽ diễn ra khá tệ với họ.\nBằng cách nào đó, còn tệ hơn thế.\nPhải mất rất nhiều công sức để khuất phục các đại diện Simba và ngăn họ nhảy bổ vào ngươi bằng móng vuốt trước để "trừng phạt ngươi vì sự xấc xược". Chúng vẫn đang gào thét ầm ĩ khi bị lôi ra khỏi phòng và ngươi phải cân nhắc bước đi tiếp theo của mình. Ngày càng rõ ràng rằng lũ sư tử chỉ có thể bị khuất phục nếu ngươi chứng minh được sức mạnh của mình trên chính lãnh thổ của chúng: Châu Phi."
 pod1230objectives_fera.42.a: "Đã đến lúc thuần hóa chúng."
 pod1230objectives_fera.42.b: "Chúng ta cần một đầu cầu để bắt đầu cuộc xâm lược."
 simba_nation_objective_decision_desc: "Simba là những kẻ thống trị chính đáng của loài mèo... ít nhất là theo lời họ. Họ sẽ không từ bỏ tuyên bố này cho đến khi vùng đất trung tâm của họ bị chinh phục bởi kẻ nào sẵn lòng thách thức họ trên chính lãnh thổ của họ."
 simba_nation_objective_decision_tooltip: "Săn sư tử."
 simba_nation_objective_decision_confirm: "Đã đến lúc quăng chúng xuống vách đá."
