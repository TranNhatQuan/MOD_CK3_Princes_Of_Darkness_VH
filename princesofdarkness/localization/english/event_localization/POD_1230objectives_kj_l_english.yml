l_english:
 pod1230objectives_kj.1.t: "Chớp Lóe Ngộ Tính Pháp Môn"
 pod1230objectives_kj.1.desc: "Bởi chính bản chất của mình, $pod_kueijin$ tự xem mình là thứ ô uế tận gốc. Dẫu vậy, họ vẫn gánh một phận sự nào đó dưới Thiên Đình. Một [Glossary('Pháp Môn','podgloss.dharma')] giúp dẫn nàng tới phận sự ấy, giúp phản chiếu sự vươn lên khỏi trạng thái nguyên sơ của nàng. Trí tuệ — và cơn khát trí tuệ — thường đến cùng tuổi tác; trong dăm năm đầu của kiếp phi sinh, $pod_kueijin$ thấy mình còn vướng mắc trong những bận tâm phàm tục. Rực rỡ trong quyền năng mới có, nàng thường trở về mái nhà xưa để thanh toán vài mối nợ và cắt lấy một mảnh đất riêng. Nhưng rồi sau một thời gian, nàng hiểu ra rằng trò chơi của người phàm chẳng khác gì ngàn hạt gạo vãi tung — quá nhỏ để nhặt và quá nhọc để đuổi theo. Một $pod_kueijin$ sống đủ lâu để thấu được cái bất tử rốt cuộc sẽ muốn nhiều hơn là mấy quyền năng siêu phàm. Cuộc hành trình xuôi con đường Pháp Môn ngốn của một $pod_kueijin$ nhiều kiếp phàm nhân; những ngọn đèn lồng trên hành trình ấy — các khoảnh khắc ngộ tính gọi là den — thúc nàng bước tiếp trong đêm.\nDen là những chớp lóe ngộ tính, khi mọi sự bỗng chốc sáng tỏ. Những chớp lóe ấy báo hiệu bước tiến trên đường Pháp Môn. Kẻ thật sự có duyên đạt tới Giác Ngộ biết cách nhận ra và nắm lấy những khoảnh khắc quý giá (mà chóng tàn) này."
 pod1230objectives_kj.1.a: "Đã đến lúc."
 pod1230objectives_kj.1.b: "Đây chưa phải thời điểm."
 pod1230objectives_kj.1.b.tt: "#X @icon_warning!Hãy nhớ rằng #italic bất kỳ#! [mental_break|E] nào cũng sẽ khiến ngươi rơi xuống [GetTrait('dharma9').GetName(GetPlayer)]#!"

 pod1230objectives_kj.2.t: "[Glossary('Bách Vân','podgloss.hundredclouds')]"
 pod1230objectives_kj.2.desc: "Những tầng cao của [Glossary('Pháp Môn','podgloss.dharma')] vô hình như những hạt nước trong áng mây trên núi. Khó tả như hương thơm của đêm. Một $pod_kueijin$ phải tồn tại qua nhiều kiếp phàm nhân trước khi những chân lý siêu việt của [Glossary('Bách Vân','podgloss.hundredclouds')] trở nên tỏ tường. Cho tới lúc ấy, y có thể tụng kinh, nói công án và điều khiển ngũ hành mà chẳng thật sự thấu được mình đang làm gì.\n"[Glossary('Bách Vân','podgloss.hundredclouds')]" là một lối nói ẩn dụ chỉ sự an tịnh tối hậu, cái trạng thái siêu thoát mà đến cả phận sự với Thiên Đình cũng được đặt xuống. Bách Vân không phải là quyền năng, dẫu $pod_kueijin$ hạng thấp có thể nhìn nó như vậy; nó cũng chẳng phải ảo ảnh, dẫu với những kẻ không thấu hiểu thì trông hệt như thế. Khi hòa vào [Glossary('Bách Vân','podgloss.hundredclouds')] (mà người trí hiểu rằng đó là một biểu tượng, không phải một hội nhóm), một $pod_kueijin$ chạm tới ngưỡng cửa thần thánh, song nán lại để dẫn đường cho kẻ khác tới cánh cửa ấy.\nNhư làn sương tạo nên chúng, [Glossary('Bách Vân','podgloss.hundredclouds')] là thứ vô hình vô tướng. Chẳng kinh văn nào chứa nổi tinh túy của chúng, chẳng bài giảng nào truyền đạt được chân lý của chúng. Người ta bảo rằng một $pod_kueijin$ đạt tới trạng thái ấy thì không còn là ma cà rồng nữa — hoặc y đã trở thành ma cà rồng tối thượng. Có lẽ y là cả hai. Thần linh chẳng nói gì cả.\nMà sườn núi Tu Di thì dốc lắm."
 pod1230objectives_kj.2.a: "Đã đến lúc trở về với sự viên mãn."

 pod1230objectives_kj.3.t: "Một Bước Lùi"
 pod1230objectives_kj.3.desc: "Đôi khi, một $pod_kueijin$ — nhất là kẻ còn non trẻ — hành xử ích kỷ tới mức ngộ tính mờ đi. Con Quỷ ăn thức những sai lầm ấy và cổ vũ chúng bất cứ khi nào có thể. Bằng cách hành xử như một kẻ phàm nhỏ nhen, $pod_kueijin$ thật sự có thể tự đánh mất Giác Ngộ của mình. Nếu nàng không vượt lên nổi những bận tâm vụn vặt, các bậc hiền giả lập luận, thì một $pod_kueijin$ đáng phải ngâm mình trong chúng đến muôn đời!\nTuy vậy, chẳng ai hoàn hảo cả. Ngay cả những vị Tổ Tiên vĩ đại nhất cũng có phút yếu lòng và có thể quên mất phận sự của mình dưới Thiên Đình. Thất bại thật sự duy nhất xảy ra khi $pod_kueijin$ vấp ngã không chịu nghĩ rằng hành trình còn dài và nàng có cả cõi bất tử phía trước để thử lại."
 pod1230objectives_kj.3.a: "Học lấy và trưởng thành từ lần thất bại này."
 
 pod1230objectives_kj.4.t: "Xoay Về Hồi Kết"
 pod1230objectives_kj.4.desc: "Bánh Xe không thể tránh khỏi.\n\nDẫu nhiều kẻ hy vọng hành động của mình sẽ chặn được vòng xoay tất yếu tới Kỷ Nguyên Thứ Năm, điều đó đã không thành. Là do các Triều Đình sụp đổ, do [Glossary('Anda','podgloss.anda')] và [akuma|E] trỗi dậy, hay thậm chí do thứ gì chẳng liên quan gì cả, chẳng ai dám chắc. Nhưng ai cũng cảm nhận được. Đây là Kỷ Nguyên cuối cùng trước khi [Glossary('Ma Hoàng','podgloss.demonemperor')] lên ngôi làm chủ tể của Vạn Vật.\n\nMột bầu không khí tuyệt vọng và u sầu phủ xuống các sinh linh siêu nhiên của Trung Nguyên khi họ ngẫm ra tầm mức thất bại của mình. Dẫu vậy, vẫn còn nhiều kẻ không chịu buông xuôi. Còn những tổ chức chính trị mới để dựng nên, những quyền năng mới để khám phá, những giác ngộ mới để tìm ra.\n\nKỷ Nguyên Thứ Năm đang khởi đầu, và nó sẽ là một cuộc mài mòn chậm rãi tới hồi kết. Hoặc có lẽ là chiến thắng khó tin của một tia hy vọng leo lét."
 pod1230objectives_kj.4.a: "Nó đã bắt đầu." 
 wheel_ages_lose_dharma_tt: "Mọi kẻ tu [Glossary('Pháp Môn','podgloss.dharma')], trừ [akuma|E], sẽ khó tiến bước trên Pháp Môn của mình hơn trong 50 năm."
 wheel_ages_lose_godbodies_modifier_tt: "Thân Xác Thần Thánh, tàn tích quyền năng mà $pod_kueijin$ thuở xưa từng nắm giữ, nay đã mất hẳn."
 wheel_ages_akuma_buff_modifier_tt: "[akuma|E] được cổ vũ bởi vòng xoay của Bánh Xe. Chúng nhận một phần thưởng mạnh mẽ và sẽ hung hãn hơn trong 50 năm."
 wheel_ages_political_instability_tt: "Mọi lãnh chúa có đất của Trung Nguyên sẽ chịu cảnh bất ổn chính trị, trừ [akuma|E]."
 
 political_instability_modifier: "Bất Ổn Chính Trị"
 
 
 
 
 
 