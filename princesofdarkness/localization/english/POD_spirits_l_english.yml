 learn_language_outcome_success.spirits.desc: "Ngôn ngữ linh hồn thất thường chẳng khác gì những kẻ nói ra chúng. Một số dùng các khuôn mẫu dễ nhận biết, một số thì không. May thay, những ngôn ngữ phổ biến nhất thường trải qua cùng một hành trình như ngôn ngữ của người phàm, dần được đơn giản hóa để những thực thể phi linh hồn cũng có thể sử dụng.\nSuy cho cùng, linh hồn cần được thấu hiểu khi mặc cả với khách viếng thăm. Dù vậy, rất có thể những kẻ xảo quyệt nhất trong số chúng cũng sẽ tận dụng sự tinh vi của ngôn ngữ mình để giành phần thắng trong đàm phán.\nĐó là lý do bạn đã cẩn trọng học lấy thứ từ vựng có thể coi là hiếm gặp hơn, hy vọng tránh được số phận hiểu lầm một khế ước tâm linh nào đó trong tương lai."

 learn_language_outcome_failure.spirits.desc: ""Sau bao công sức khó nhọc... chẳng được gì cả! Thật #EMP không thể#! học nổi thứ ngôn ngữ linh hồn này. Dù cố gắng thế nào, ta vẫn nói như đứa trẻ mới cai sữa và lảm nhảm như một kẻ ngốc!\n\nChậc! Thật phí thời gian...""

