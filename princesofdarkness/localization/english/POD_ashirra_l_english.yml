####Court Positions####
 ashirra_imam_court_position: "Imam"
 ashirra_imam_court_position_desc: "Imam là lãnh tụ tinh thần trong mọi cộng đồng Ashirra. Người bảo vệ các tín đồ, đảm bảo sự an toàn và thịnh vượng cho cộng đồng, và thực thi luật lệ của Islam. Người cũng chịu trách nhiệm duy trì thánh đường Hồi giáo cho cộng đồng Ashirra của thành phố, vừa là trái tim tinh thần của cộng đồng vừa là nơi trú ẩn bình yên mà bất kỳ Cainite nào cũng có thể đến để bày tỏ nỗi oan ức của mình."
 ashirra_ulama_court_position: "Alim"
 ashirra_ulama_court_position_desc: "'Ulama là các học giả về Qur'an và Hadith. Họ phục vụ như những bậc hiền triết được kính trọng của cộng đồng. Những Ashirra theo đuổi tri thức tôn giáo sẽ phục vụ với vai trò 'ulama trong cộng đồng đêm tối của chính mình. Nhiều Ashirra trong số này đã thuộc lòng các thánh kinh này và trong một số trường hợp đã dành hàng trăm năm để suy ngẫm và tranh luận về ý nghĩa những lời dạy của Nhà Tiên Tri."
 ashirra_qadi_court_position: "Qadi"
 ashirra_qadi_court_position_desc: "Qadi là các thẩm phán của đức tin Islam, nghiên cứu luật lệ do Muhammad đặt ra và diễn giải chúng trong các tranh chấp hay tội ác xảy ra giữa các tín đồ. Mỗi vị thẩm phán phải am tường cả luật pháp được ghi trong Qur'an lẫn hàng trăm phán quyết và tiền lệ trước đó do các luật gia đặt ra trong suốt lịch sử Islam. Vị thẩm phán này cố vấn cho imam, quốc vương và các ma cà rồng khác về những vấn đề liên quan đến tranh chấp pháp lý, đồng thời đề xuất những hình phạt thích đáng cho các vi phạm luật Islam."
 ashirra_mullah_court_position: "Mullah"
 ashirra_mullah_court_position_desc: "Những học giả được kính trọng nhất trong hàng ngũ Ashirra được gọi là mullah. Dù bất kỳ Ashirra nào cũng có thể khát khao trở thành học giả của các thánh kinh, danh hiệu mullah chỉ có thể đạt được qua nhiều năm nghiên cứu tận tụy và được các mullah đương thời của giáo phái công nhận. Trong khắp thế giới Hồi giáo, chỉ một số ít ma cà rồng dám nhận danh hiệu này."
 ashirra_mullah_court_position_requirement_tooltip: "Họ là một [GetTrait('theologian').GetName(GetNullCharacter)] hoặc [GetTrait('scholar').GetName(GetNullCharacter)]"



####Court Position Tasks####
 POD_imam_sadaqah: "Dẫn Dắt Sadaqah Công Khai"
 POD_imam_sadaqah_desc: "$ashirra_imam_court_position$ của bạn sẽ phân phát của bố thí cho người nghèo khó và cùng khổ trong lãnh địa của bạn, nhân danh bạn."
 POD_imam_sanctuary: "Ban Nơi Trú Ẩn"
 POD_imam_sanctuary_desc: "$ashirra_imam_court_position$ sẽ dành thời gian lắng nghe những nỗi oan ức của các Cainite bình dân"
 POD_qadi_judge: "Ra Phán Quyết"
 POD_qadi_judge_desc: "$ashirra_qadi_court_position$ sẽ tập trung phân xử nhiều vụ việc khác nhau thay cho bạn."
 POD_ulama_teachings: "Cố Vấn Quốc Vương"
 POD_ulama_teachings_desc: "$ashirra_ulama_court_position$ cố vấn cho Quốc Vương bằng vốn kiến thức học thuật uyên thâm của mình."
 POD_ulama_teachings_requirement: "Bạn #bold không#! phải là một [cultural_head|E]"
 POD_ulama_learning: "Tìm Kiếm Tri Thức Sâu Xa Hơn"
 POD_ulama_learning_desc: "Con đường trở thành một $ashirra_mullah_court_position$ rất dài. $ashirra_ulama_court_position$ sẽ dành thời gian của mình theo đuổi việc trở thành một người như vậy."
 POD_ulama_learning_tooltip_requirement: "#bold Không#! sở hữu cả [GetTrait('theologian').GetName(GetNullCharacter)] lẫn [GetTrait('scholar').GetName(GetNullCharacter)]"
 POD_ulama_learning_tooltip: "Mỗi năm nhân vật này có cơ hội đạt được một [perk|El] trong [GetTrait('theologian').GetName(GetNullCharacter)] hoặc [GetTrait('scholar').GetName(GetNullCharacter)] [learning_lifestyle|E] cho đến khi có được cả hai đặc điểm này. Cơ hội này được cải thiện nhờ [aptitude|El] của người đó."
 court_ulama_study_theology_title: "Alim đạt được tiến triển"
 POD_mullah_warriors: "Triệu Tập Các Tín Đồ"
 POD_mullah_warriors_desc: "Nhiều thành viên của [Glossary('Ashirra','game_concept_ashirra_desc')] sẵn sàng chiến đấu chống lại kẻ thù của Allah. Họ sẽ không từ chối lời kêu gọi của $ashirra_mullah_court_position$."
 POD_mullah_zealots: "Dẫn Dắt Người Sùng Đạo"
 POD_mullah_zealots_desc: "Một $ashirra_mullah_court_position$ được kính trọng cao trong [Glossary('Ashirra','game_concept_ashirra_desc')]. Lời nói của người này có thể lay chuyển ngay cả những tín đồ hoài nghi nhất. Những ai ủng hộ người này cũng sẽ ủng hộ bạn."


