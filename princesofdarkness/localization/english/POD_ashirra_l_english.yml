 POD_imam_sadaqah_cairo_tooltip: "Mỗi năm nhân vật này có cơ hội cải đạo các quận không phải Ashirra sang [faith|E] của bạn. Cơ hội này được cải thiện nhờ [aptitude|El] của người đó."
 court_imam_sadaqah_cairo_effect_title: "Imam cải đạo một quận"
 cairo_imam_aptitude_reward_tooltip: "[GetBuilding('cairo_khitta_hajj_04').GetName]"

 POD_ulama_teachings_cairo_tooltip: "Mỗi năm nhân vật này có cơ hội loại bỏ một trong các [mental_break|E] [Concept('fame_trait','fame traits')|E] tiêu cực của bạn. Cơ hội này được cải thiện nhờ [aptitude|El] của người đó."
 court_ulama_teachings_cairo_effect_title: "Alim mang đến cách nhìn mới về cuộc sống"
 cairo_ulama_aptitude_reward_tooltip: "[GetBuilding('cairo_khitta_fen_04').GetName]"



