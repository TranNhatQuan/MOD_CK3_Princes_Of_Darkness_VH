 assault_lair_planning_title: "Sẵn Sàng Cho Cuộc Tấn Công"
 assault_lair_planning_desc: "Sự kiên nhẫn của ta đã được đền đáp.\n\nMất một thời gian, nhưng mạng lưới gián điệp và tay trong của ta cuối cùng đã mang về điều ta cần tìm: vị trí chính xác của sào huyệt [PlayerJourneyTarget.GetFirstNamePossessive].\n\nDĩ nhiên, phần nguy hiểm nhất của [journey|E] này vẫn còn ở phía trước..."
 assault_lair_planning_confirm: "$POD_journey_planning_confirm_default$"
 assault_lair_planning_decline: "$POD_journey_planning_decline_default$"
 assault_lair_travel_title: "Cuộc Săn Đã Bắt Đầu"
 assault_lair_travel_desc: "Đối đầu với một con quái vật như [PlayerJourneyTarget.GetFirstName] trên chính lãnh địa của [PlayerJourneyTarget.GetHerHis] luôn là việc đầy rủi ro, nhưng chúng ta có lợi thế bất ngờ. Liệu thế đã đủ chưa? Khi săn loại con mồi này, chỉ một sơ sẩy nhỏ nhất cũng có thể là cái chết."
 assault_lair_travel_confirm: "Ta sẽ không nương tay."


