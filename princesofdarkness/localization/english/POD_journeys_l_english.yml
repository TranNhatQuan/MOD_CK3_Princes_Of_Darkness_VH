 wake_from_torpor_travel_title: "Hành Trình Tìm Kẻ Ngủ Say"
 wake_from_torpor_travel_desc: "Khi tìm ra [PlayerJourneyTarget.GetFirstNameNicknamed], [PlayerJourneyTarget.GetSheHe|l] sẽ hoàn toàn nằm trong tay ta, nhưng vẫn còn ý thức được về những gì xung quanh [PlayerJourneyTarget.GetHerHis|l]. Một điều đáng suy ngẫm đầy kinh hoàng. Ta tự hỏi [PlayerJourneyTarget.GetSheHe|l] sẽ làm gì, nếu vị trí của chúng ta bị đảo ngược."
 wake_from_torpor_travel_confirm: "Chúng ta chỉ cần tìm ra sào huyệt của [PlayerJourneyTarget.GetHerHis|l] trước tiên."
 
 
 assault_lair_name: "Tấn Công Sào Huyệt Của"
 #assault_lair_desc: ""
