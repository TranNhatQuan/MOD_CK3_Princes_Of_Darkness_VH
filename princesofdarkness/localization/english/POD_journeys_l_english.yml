 seek_knowledge_thaumaturgy_name: "Học [GetTrait('bloodsorcery').GetName(GetNullCharacter)] (Thaumaturgy)"
 seek_knowledge_thaumaturgy_desc: "[GetTrait('bloodsorcery').GetName(GetNullCharacter)] là một $pod_discipline$ bí ẩn thường được gắn liền với [GetTrait('tremere').GetName(GetNullCharacter)], nhưng được thực hành bởi nhiều [Glossary('Clans','game_concept_Clan_desc')] khác nhau. Nó cho phép người thực hành dùng máu của mình cho một loạt các nghi thức pháp thuật đa dạng: tập trung tâm trí, cải thiện quân đội, nguyền rủa kẻ thù... và nhiều hơn nữa.\nCác Thaumaturge thường có tiếng tăm đáng sợ mà họ tận dụng làm lợi thế. Kẻ địch của họ khó mà lường trước được điều gì sẽ xảy ra khi đối đầu trực tiếp. Những kẻ không am hiểu có rất ít khái niệm về quy mô và tầm cỡ sức mạnh mà một thaumaturge có thể sở hữu, và đôi khi trí tưởng tượng của họ tự làm hại chính mình."
 seek_knowledge_thaumaturgy_effects: "Ngươi sẽ biết được vị trí của một người thầy am hiểu [GetTrait('bloodsorcery').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể đạt được $pod_discipline$ [trait|E]. Nó không chỉ cho phép ngươi mở khóa [perks|E] trong [lifestyle|E] [GetTrait('bloodsorcery').GetName(GetNullCharacter)], mà còn mở khóa [character_interaction|E] [bloodsorcery|E], cho phép ngươi thi triển nhiều loại pháp thuật có lợi và có hại.\n\n#warning Học Thaumaturgy nghĩa là ngươi sẽ không bao giờ có thể học Sihr.#!"
 seek_knowledge_thaumaturgy_tt: "Ta sẽ mở khóa những bí mật sâu xa nhất của vitae." 
 seek_knowledge_thaumaturgy_planning_title: "Nhiệm Vụ Tìm Thaumaturgy"
 seek_knowledge_thaumaturgy_planning_desc: "Ta đã khuấy động máu mình và chuẩn bị cho bản thân hết mức có thể, nhưng những điểm tinh tế của [GetTrait('bloodsorcery').GetName(GetNullCharacter)] vẫn còn vượt khỏi hiểu biết của ta.\n\nNếu ta muốn nắm vững hoàn toàn $pod_discipline$ này, ta sẽ cần một người thầy.\n\nMay mắn là, các trinh sát của ta đã cho ta biết nơi có thể tìm được một người như vậy."
 seek_knowledge_thaumaturgy_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_thaumaturgy_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_thaumaturgy_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_thaumaturgy_travel_desc: "Ta rất mong chờ cơ hội học [GetTrait('bloodsorcery').GetName(GetNullCharacter)]. Bí mật của nó được canh giữ nghiêm ngặt là có lý do. Khi ta mở khóa được nó, không ai biết được ta sẽ có khả năng làm được gì.\nCó lời truyền rằng sức mạnh thật sự của một thaumaturge nằm ở kỷ luật để chuẩn bị cho những khả năng nguy hiểm và sử dụng các nghi thức mà thoạt nhìn có thể không có vẻ mạnh mẽ. Một thaumaturge tài giỏi luôn sẵn sàng cho mọi loại tình huống, và có thể tung ra những sức mạnh mà nàng đã tích lũy khi tình huống khẩn cấp xảy đến. Các thaumaturge có đầu óc quân sự so sánh sự chuẩn bị của họ với việc đảm bảo có đủ đạn dự phòng trong trường hợp trận chiến trở nên bất lợi." 
 seek_knowledge_thaumaturgy_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_thaumaturgy_isvalid: "$disciplines_learning_thaumaturgy_tt$"

 seek_knowledge_sielanic_thaumaturgy_name: "Học [GetTrait('bloodsorcery').GetName(GetNullCharacter)] (Sielanic Thaumaturgy)"
 seek_knowledge_sielanic_thaumaturgy_desc: "Sielanic Thaumaturgy là một hình thức Thaumaturgy được truyền cảm hứng từ vị thần ngoại giáo Telyavel và được thực hành bởi các [GetTrait('tremere').GetName(GetNullCharacter)] thuộc dòng Telyavelic, một bloodline của Tremere có gốc tại Lithuania.\n\nCác Telvay đã học cách sử dụng sức mạnh của siela, linh hồn thuyết vật linh ẩn tàng trong đất, đá, cây cỏ và muông thú của quê hương họ đã chọn. Dựa trên các tập tục shaman giáo, những Con Đường này kết hợp cả yếu tố pháp thuật thiên nhiên và pháp thuật linh hồn.\n\nMột số Tremere ngoài bloodline này tin rằng Sielanic Thaumaturgy là một nhánh của Koldunic Sorcery và nhìn những ai thực hành nó bằng sự nghi ngờ và ngờ vực. Sự nghi ngờ của họ không hoàn toàn vô căn cứ, vì những người thực hành Sielanic Thaumaturgy có thể tiếp cận một số [bs_paths|E] của Koldunism."
 seek_knowledge_sielanic_thaumaturgy_effects: "Ngươi sẽ biết được vị trí của một người thầy am hiểu [GetTrait('bloodsorcery').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể đạt được $pod_discipline$ [trait|E]. Nó không chỉ cho phép ngươi mở khóa [perks|E] trong [lifestyle|E] [GetTrait('bloodsorcery').GetName(GetNullCharacter)], mà còn mở khóa [character_interaction|E] [bloodsorcery|E], cho phép ngươi thi triển nhiều loại pháp thuật có lợi và có hại.\n\n#warning Học Thaumaturgy nghĩa là ngươi sẽ không bao giờ có thể học Sihr.#!"
 seek_knowledge_sielanic_thaumaturgy_tt: "Ta sẽ mở khóa những bí mật sâu xa nhất của vitae." 
 seek_knowledge_sielanic_thaumaturgy_planning_title: "Nhiệm Vụ Tìm Sielanic Thaumaturgy"
 seek_knowledge_sielanic_thaumaturgy_planning_desc: "Ta đã khuấy động máu mình và chuẩn bị cho bản thân hết mức có thể, nhưng những điểm tinh tế của [GetTrait('bloodsorcery').GetName(GetNullCharacter)] vẫn còn vượt khỏi hiểu biết của ta.\n\nNếu ta muốn nắm vững hoàn toàn $pod_discipline$ này, ta sẽ cần một người thầy.\n\nMay mắn là, các trinh sát của ta đã cho ta biết nơi có thể tìm được một người như vậy."
 seek_knowledge_sielanic_thaumaturgy_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_sielanic_thaumaturgy_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_sielanic_thaumaturgy_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_sielanic_thaumaturgy_travel_desc: "Qua Sielanic Thaumaturgy, một ma cà rồng có thể trở thành một phần của thế giới tự nhiên, chia sẻ những năng lực vốn có trong đất, cây và sự sống của bất kỳ vùng đất nào mà họ hòa hợp. Cũng như vượt qua biên giới giữa sự sống và cái chết, dùng chính thân xác bất tử của mình làm ống dẫn để liên lạc với người chết. Các nghệ thuật Sielanic sử dụng cả Thaumaturgy truyền thống của [GetTrait('tremere').GetName(GetNullCharacter)] và Koldunic Sorcery của [GetTrait('tzimisce').GetName(GetNullCharacter)] để đạt được sức mạnh vượt ngoài tầm của một [bs_tradition|E] đơn lẻ." 
 seek_knowledge_sielanic_thaumaturgy_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_sielanic_thaumaturgy_isvalid: "$disciplines_learning_sielanic_tt$"

 seek_knowledge_dur_an_ki_name: "Học [GetTrait('bloodsorcery').GetName(GetNullCharacter)] (Dur-An-Ki)"
 seek_knowledge_dur_an_ki_desc: "Assamite Sorcery khởi nguồn từ Second City khi những pháp sư phàm nhân được Trao truyền vào Clan với lời hứa hẹn về quyền lực và sự sống vĩnh hằng. Những Sorcerer bất tử này đóng vai trò thẩm vấn viên và thợ săn ác ma trong các cuộc chiến chống lại Baali. Sau khi Second City sụp đổ, các Sorcerer được dùng để hỗ trợ liên lạc pháp thuật qua những khoảng cách lớn, giữ cho Clan đoàn kết và có tổ chức. Hơn nữa, họ dùng nghệ thuật của mình để bảo vệ Đàn mà Clan nuôi dưỡng. Họ chăm bón hoa màu nuôi sống Đàn và tiếp tục đánh trả các thế lực đe dọa Clan. \nCác Sorcerer này sau đó đã chuyển tài năng của mình sang nghệ thuật Dur-An-Ki (theo tiếng Sumer nghĩa là “Bậc Thầy của Trời và Đất”) để hỗ trợ họ trong sự nghiệp của mình. Một hình thức pháp thuật khởi nguồn từ Mesopotamia cổ đại, nó đã phát triển qua hàng ngàn năm để dung nạp những yếu tố của vô số thần thoại và tôn giáo khắp vùng Trung Đông rộng lớn. Về cơ bản, Dur-An-Ki cho phép các hiệp ước được ký kết giữa linh hồn và pháp sư (được gọi là ashipu)."
 seek_knowledge_dur_an_ki_effects: "Ngươi sẽ biết được vị trí của một người thầy am hiểu [GetTrait('bloodsorcery').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể đạt được $pod_discipline$ [trait|E]. Nó không chỉ cho phép ngươi mở khóa [perks|E] trong [lifestyle|E] [GetTrait('bloodsorcery').GetName(GetNullCharacter)], mà còn mở khóa [character_interaction|E] [bloodsorcery|E], cho phép ngươi thi triển nhiều loại pháp thuật có lợi và có hại."
 seek_knowledge_dur_an_ki_tt: "Ta sẽ mở khóa những bí mật sâu xa nhất của vitae." 
 seek_knowledge_dur_an_ki_planning_title: "Nhiệm Vụ Tìm Dur-An-Ki"
 seek_knowledge_dur_an_ki_planning_desc: "Ta đã khuấy động máu mình và chuẩn bị cho bản thân hết mức có thể, nhưng những điểm tinh tế của [GetTrait('bloodsorcery').GetName(GetNullCharacter)] vẫn còn vượt khỏi hiểu biết của ta.\n\nNếu ta muốn nắm vững hoàn toàn $pod_discipline$ này, ta sẽ cần một người thầy.\n\nMay mắn là, các trinh sát của ta đã cho ta biết nơi có thể tìm được một người như vậy."
 seek_knowledge_dur_an_ki_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_dur_an_ki_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_dur_an_ki_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_dur_an_ki_travel_desc:  "Trong khi các đặc trưng của Thaumaturgy là trật tự và độ chính xác khoa học, Assamite Sorcery lại kém khuôn khổ hơn nhiều. Nó lấy cảm hứng và hình thức từ nhiều nguồn văn hóa và những thí nghiệm được tiến hành qua nhiều thế kỷ: Hindu giáo, các thiên anh hùng ca, phong thủy, giả kim thuật và thiên văn học Islam, các pháp thuật cao cấp và thấp cấp của Mesopotamia, và các nghi lễ Ba Tư thờ Mithra, chỉ để kể ra vài ví dụ.\n Trong mỗi nghi thức mà một Sorcerer thi triển, con đường họ đi để hoàn thành nó bao gồm một số cột mốc. Tuy nhiên, thứ tự và cách thức những cột mốc này được hoàn thành lại khác nhau tùy từng người thi triển, tùy thuộc vào nguồn văn hóa nào họ dựa vào để định hình tập tục của mình."
 seek_knowledge_dur_an_ki_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_dur_an_ki_isvalid: "$POD_seek_knowledge_intro$\n$BULLET_WITH_TAB$$POD_seek_knowledge_learning_25$\n$BULLET_WITH_TAB$Ngươi là [GetTrait('assamite').GetName(GetPlayer)]\n$BULLET_WITH_TAB$Ngươi có [GetTrait('bloodsorceryadvanced').GetName(GetNullCharacter)] và [GetTrait('quietusadvanced').GetName(GetPlayer)]\n$BULLET_WITH_TAB$$POD_seek_knowledge_relation$\n$BULLET_WITH_TAB$$POD_seek_knowledge_game_rule$"
 
 seek_knowledge_akhu_name: "Học [GetTrait('bloodsorcery').GetName(GetNullCharacter)] (Akhu)"
 seek_knowledge_akhu_desc: "Setite Sorcery là một hiện tượng pháp thuật kỳ lạ. Nó có những yếu tố trải khắp quang phổ pháp thuật, tuy phần thực hành của nó lại mang hình thức nghi lễ, tôn giáo phần lớn. Dù vậy, \"Setite Sorcery\" là một cách gọi hơi sai lệch. Cái tên này ngụ ý một tập tục duy nhất, nhưng Setite Sorceries mới là cách gọi đúng hơn, vì đây thực chất là một tập hợp các tập tục khác nhau của các Followers of Set trên toàn thế giới. Vào thời hoàng kim của Ai Cập, trước khi cải sang Cơ Đốc giáo dưới tay Đế chế Rôma, pháp thuật là điều thường thấy, được cả phàm nhân và ma cà rồng thực hành. Người Ai Cập có nhiều từ để chỉ pháp thuật; các Setite dùng Heka (nghĩa đen là \"pháp thuật\") để chỉ pháp thuật của phàm nhân, và Ahku (\"các câu chú\") để chỉ chú thuật huyết mạch của họ. Đây vẫn là biến thể được biết đến rộng rãi nhất của \"Setite Sorcery\" cho đến nay."
 seek_knowledge_akhu_effects: "Ngươi sẽ biết được vị trí của một người thầy am hiểu [GetTrait('bloodsorcery').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể đạt được $pod_discipline$ [trait|E]. Nó không chỉ cho phép ngươi mở khóa [perks|E] trong [lifestyle|E] [GetTrait('bloodsorcery').GetName(GetNullCharacter)], mà còn mở khóa [character_interaction|E] [bloodsorcery|E], cho phép ngươi thi triển nhiều loại pháp thuật có lợi và có hại."
 seek_knowledge_akhu_tt: "Ta sẽ mở khóa những bí mật sâu xa nhất của vitae." 
 seek_knowledge_akhu_planning_title: "Nhiệm Vụ Tìm Akhu"
 seek_knowledge_akhu_planning_desc: "Ta đã khuấy động máu mình và chuẩn bị cho bản thân hết mức có thể, nhưng những điểm tinh tế của [GetTrait('bloodsorcery').GetName(GetNullCharacter)] vẫn còn vượt khỏi hiểu biết của ta.\n\nNếu ta muốn nắm vững hoàn toàn $pod_discipline$ này, ta sẽ cần một người thầy.\n\nMay mắn là, các trinh sát của ta đã cho ta biết nơi có thể tìm được một người như vậy."
 seek_knowledge_akhu_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_akhu_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_akhu_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_akhu_travel_desc:  "Akhu, trường phái được thực hành rộng rãi nhất của Setite Sorcery, giống với tôn giáo Ai Cập cổ đại. Với người Ai Cập cổ đại, thần Set, trong số nhiều vai trò khác, là Thần của Bão Tố. Vì vậy một người thực hành Akhu sẽ dựng lên một cột thu lôi mang tính biểu tượng để qua đó nàng có thể hút lấy một tia sét của Set nhằm cấp năng lượng cho các nghi thức tiếp theo của mình. Tuy nhiên, để thu hút sự ưu ái của Set, nàng phải dâng lên Dark God một lễ vật khiến hắn hài lòng lớn lao. Cách được chấp nhận để đạt được điều này giữa những người thực hành Akhu (được gọi là Lector Priest) là tuân theo những chỉ dẫn mà Set đã đặt ra trong The Book of Going Forth by Night."
 seek_knowledge_akhu_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_akhu_isvalid: "$POD_seek_knowledge_intro$\n$BULLET_WITH_TAB$$POD_seek_knowledge_learning_25$\n$BULLET_WITH_TAB$[faith|E] của ngươi có [doctrine|E] [GetFaithDoctrine('special_doctrine_set_pillars_kindred').GetBaseName]\n$BULLET_WITH_TAB$Ngươi có [GetTrait('bloodsorceryadvanced').GetName(GetNullCharacter)] và [GetTrait('serpentisadvanced').GetName(GetPlayer)]\n$BULLET_WITH_TAB$$POD_seek_knowledge_relation$\n$BULLET_WITH_TAB$$POD_seek_knowledge_game_rule$"

 seek_knowledge_sadhana_name: "Học [GetTrait('bloodsorcery').GetName(GetNullCharacter)] (Sadhana)"
 seek_knowledge_sadhana_desc: "Khi đến được Ấn Độ, các Followers of Set đã tìm thấy những yếu tố của tôn giáo Hindu mà họ có thể lợi dụng để cải đạo Kindred sang phe mình. Những người thực hành Sadhana chủ yếu xuất thân từ hàng ngũ của bloodline Setite được gọi là Daitya. Những Setite này theo thần Shiva, người có nguồn gốc từ thần Rudra, một vị thần bão tố, và do đó được xem là một hóa thân của Set. Tin rằng bản thân là ác ma mang xác thịt, các Setite Ấn Độ coi sứ mệnh của mình là lật đổ các vị thần và chiếm lấy quyền năng của họ cho riêng mình."
 seek_knowledge_sadhana_effects: "Ngươi sẽ biết được vị trí của một người thầy am hiểu [GetTrait('bloodsorcery').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể đạt được $pod_discipline$ [trait|E]. Nó không chỉ cho phép ngươi mở khóa [perks|E] trong [lifestyle|E] [GetTrait('bloodsorcery').GetName(GetNullCharacter)], mà còn mở khóa [character_interaction|E] [bloodsorcery|E], cho phép ngươi thi triển nhiều loại pháp thuật có lợi và có hại."
 seek_knowledge_sadhana_tt: "Ta sẽ mở khóa những bí mật sâu xa nhất của vitae." 
 seek_knowledge_sadhana_planning_title: "Nhiệm Vụ Tìm Sadhana"
 seek_knowledge_sadhana_planning_desc: "Ta đã khuấy động máu mình và chuẩn bị cho bản thân hết mức có thể, nhưng những điểm tinh tế của [GetTrait('bloodsorcery').GetName(GetNullCharacter)] vẫn còn vượt khỏi hiểu biết của ta.\n\nNếu ta muốn nắm vững hoàn toàn $pod_discipline$ này, ta sẽ cần một người thầy.\n\nMay mắn là, các trinh sát của ta đã cho ta biết nơi có thể tìm được một người như vậy."
 seek_knowledge_sadhana_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_sadhana_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_sadhana_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_sadhana_travel_desc: "Sadhana là sự áp đặt tâm trí lên vật chất. Dù có thể lập luận rằng sức mạnh của họ đến từ bên trong chứ không phải được truyền dẫn từ Dark God, chính niềm tin và sự tôn thờ của họ với Shiva mới cho họ sự tập trung để định hướng sức mạnh này. Nếu không có điều đó, người ta cho rằng họ sẽ chỉ đơn giản là lạc mất bản thân trong thiền định. Không có Shiva, họ sẽ không có sức mạnh, và do đó tất cả đều quy về Dark God cuối cùng."
 seek_knowledge_sadhana_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_sadhana_isvalid: "$POD_seek_knowledge_intro$\n$BULLET_WITH_TAB$$POD_seek_knowledge_learning_25$\n$BULLET_WITH_TAB$[capital|E] của ngươi nằm trong [GetGeographicalRegion('world_india').GetName]\n$BULLET_WITH_TAB$Ngươi là [GetTrait('whole_of_body').GetName(GetPlayer)] và có [GetTrait('bloodsorceryadvanced').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$$POD_seek_knowledge_relation$\n$BULLET_WITH_TAB$$POD_seek_knowledge_game_rule$"

 seek_knowledge_koldunic_name: "Học [GetTrait('bloodsorcery').GetName(GetNullCharacter)] (Koldunic)"
 seek_knowledge_koldunic_desc:  "Các koldun Tzimisce tự nhận đã tu luyện pháp thuật trước tất cả những kẻ khác. Koldunic Sorcery bắt nguồn từ nguyên tố luận sơ khai, khuất phục các linh hồn yếu hoặc giao kết với những kẻ mạnh hơn. Nổi bật nhất trong số các linh hồn nguyên tố này là thực thể Carpathia Kupala, được các koldun cổ xưa nhất gọi là “gốc rễ của muôn loài”. Việc tiếp tục giao thiệp với sinh thể này đã gây ra nhiều khó khăn nghiêm trọng, vì giao du với linh hồn chỉ cách địa ngục thuyết một đường tơ."
 seek_knowledge_koldunic_effects: "Ngươi sẽ biết được nơi ở của một người thầy thông hiểu [GetTrait('bloodsorcery').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể lĩnh hội Dị năng $pod_discipline$ [trait|E]. Nó không chỉ cho phép ngươi mở khóa các [perks|E] trong [lifestyle|E] [GetTrait('bloodsorcery').GetName(GetNullCharacter)], mà còn mở khóa [character_interaction|E] [bloodsorcery|E], cho phép ngươi thi triển nhiều loại pháp thuật có lợi và có hại."
 seek_knowledge_koldunic_tt: "Ta sẽ mở khóa những bí mật sâu xa nhất của vitae." 
 seek_knowledge_koldunic_planning_title: "Cuộc Tìm Kiếm Koldunic Sorcery"
 seek_knowledge_koldunic_planning_desc: "Ta đã khuấy động huyết mạch và chuẩn bị bản thân hết mức có thể, nhưng những điểm tinh tế của [GetTrait('bloodsorcery').GetName(GetNullCharacter)] vẫn còn vượt khỏi tầm hiểu biết của ta.\n\nNếu ta muốn tinh thông Dị năng $pod_discipline$ này trọn vẹn, ta sẽ cần một người thầy.\n\nMay sao, các trinh sát của ta đã báo cho ta biết nơi có thể tìm được một người như vậy."
