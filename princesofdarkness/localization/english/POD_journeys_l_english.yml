 breaking_the_blond_bond_desc: "Ngươi đang bị [Glossary('Blood Bound','game_concept_bloodbond_desc')], nghĩa là ý niệm về #italic sự phản kháng#! khó lòng nảy sinh, bị áp chế bởi thứ tình yêu giả tạo đang chảy cùng dòng máu.\n\nNhưng dù vậy, thứ tình yêu đó cũng không thể ngăn cản nội tâm ngươi nhận ra chuyện đang xảy ra và ấp ôm lấy ý niệm tự do đã lâu bị chôn giấu."
 breaking_the_blond_bond_effects: "Ngươi sẽ bắt đầu một [journey|E] dài để dần dần làm suy yếu [Glossary('Blood Bond','game_concept_bloodbond_desc')] của mình xuống mức có thể bỏ trốn hoặc hành động chống lại [Glossary('Domitor','game_concept_domitor_desc')] của ngươi. Lưu ý rằng tiến trình này cần toàn bộ ý chí của ngươi, và bất kỳ [mental_break|E] nào cũng sẽ ngay lập tức làm ngươi mất trắng công sức này. Ngoài ra, hoàn thành bất kỳ [bound_ghoul_mission_with_icon|E] nào cũng sẽ khiến tiến trình của ngươi lùi lại #N 10%#!."
 breaking_the_blond_bond_tt: "Dù Ràng Buộc cũng không phải vĩnh cửu."
 breaking_the_blond_bond_planning_title: "Đã Gần, Nhưng Vẫn Chưa Đủ"
 breaking_the_blond_bond_planning_desc: "Ngươi đã đến gần, ngươi có thể cảm nhận tình yêu ấy đang suy biến thành một cơn say mê đơn thuần. Nhưng ngươi vẫn cần thêm một cú đẩy nữa để thực sự được tự do."
 breaking_the_blond_bond_planning_confirm: "Thứ tình yêu đó... là giả?"
 breaking_the_blond_bond_planning_decline: "$POD_journey_planning_decline_default$"
 breaking_the_blond_bond_isvalid: "Để bắt đầu [journey|E] này, ngươi cần đang ở mức [stress|E] thứ 0."
 
