 demon_temp_journey_planning_title: "Khải Thị Sắp Đến"
 demon_temp_journey_planning_desc: "Ta đã nghiên cứu xu hướng của [PlayerJourneyTarget.GetShortUINamePossessive], khát khao của [PlayerJourneyTarget.GetHerHis], nỗi hổ nhục của [PlayerJourneyTarget.GetHerHis], sự trống rỗng bên trong mà [PlayerJourneyTarget.GetSheHe] không bao giờ có thể lấp đầy. [PlayerJourneyTarget.GetSheHe|U] cần ta.\n\nTa sẽ là nguồn suối làm dịu cơn khát của [PlayerJourneyTarget.GetHerHis]. Là cành ô-liu chấm dứt nỗi thống khổ của [PlayerJourneyTarget.GetHerHis].\n\nTa sẽ cứu rỗi [PlayerJourneyTarget.GetHerHim]."
