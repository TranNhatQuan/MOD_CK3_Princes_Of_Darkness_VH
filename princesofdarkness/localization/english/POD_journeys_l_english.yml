 realm_mastery_nature_desc: "#TOOLTIP:GAME_TRAIT,realm_nature,[GetNullCharacter] #L Cõi Tự Nhiên#!#! là [fae_realm|E] của các vật thể tự nhiên. Một $POD_splat_fae$ có hiểu biết kém về [fae_realm|E] này hoàn toàn không thể tác động đến hiện tượng tự nhiên. Cần phải tinh thông nếu muốn thi triển [cantrips|E] gây ra thiên tai."
 realm_mastery_nature_effects: "Ngươi sẽ đi đến một freehold và thỉnh cầu [Select_CString( DidShatteringHappen, 'Lost Ones', 'Nobles' )] ban cho ngươi hiểu biết về [fae_realm|E] #TOOLTIP:GAME_TRAIT,realm_nature,[GetNullCharacter] #L Tự Nhiên#!#!. Nếu thành công, ngươi sẽ có được [trait|E] [GetTrait('realm_nature').GetName(GetNullCharacter)], cho phép mở khóa perk cuối cùng trong [lifestyle|E] #TOOLTIP:GAME_TRAIT,realm_nature,[GetNullCharacter] #L Tự Nhiên#!#!."
