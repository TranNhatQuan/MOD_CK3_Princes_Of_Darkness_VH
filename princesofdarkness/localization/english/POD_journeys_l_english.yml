 gold_heist_planning_desc: "Ta đã tìm hiểu hết mức có thể về những gì diễn ra tại triều đình của [PlayerJourneyTarget.GetShortUINamePossessive].\n\nGiờ là lúc dùng hiểu biết này để tiến hành bước kế tiếp trong kế hoạch: [infiltration|E]."
