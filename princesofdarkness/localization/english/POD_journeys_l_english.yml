 seek_knowledge_serpentis_effects: "Ngươi sẽ biết được nơi ở của một người thầy thông thạo [GetTrait('serpentis').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể đạt được [trait|E] $pod_discipline$ này, cho phép ngươi mở khóa [perks|E] trong [lifestyle|E] [GetTrait('serpentis').GetName(GetNullCharacter)]."
