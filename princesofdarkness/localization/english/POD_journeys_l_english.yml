 seek_knowledge_animalism_name: "Học Dị Năng ([GetTrait('animalism').GetName(GetNullCharacter)])"
 seek_knowledge_animalism_desc: "[GetTrait('animalism').GetName(GetNullCharacter)] là $pod_discipline$ khống chế thú vật. Nó mở khóa nhiều năng lực liên quan đến thú vật, như [GetPerk('bond_famulus_perk').GetName(GetPlayer)] hay [GetPerk('call_of_the_wild_perk').GetName(GetPlayer)]."
 seek_knowledge_animalism_effects: "Ngươi sẽ biết được nơi ở của một người thầy am hiểu [GetTrait('animalism').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể chiếm lấy $pod_discipline$ [trait|E], nhờ đó mở khóa [perks|E] trong [lifestyle|E] [GetTrait('animalism').GetName(GetNullCharacter)]."
 seek_knowledge_animalism_tt: "Những con thú của màn đêm sẽ phải phục tùng ta."
 seek_knowledge_animalism_planning_title: "Cuộc Tìm Kiếm Animalism"
 seek_knowledge_animalism_planning_desc: "Ta đã khơi dậy huyết mạch và chuẩn bị bản thân hết mức có thể, nhưng những điểm tinh tế của [GetTrait('animalism').GetName(GetNullCharacter)] vẫn còn vượt khỏi tầm hiểu biết của ta.\n\nNếu ta muốn tinh thông $pod_discipline$ này hoàn toàn, ta sẽ cần một người thầy.\n\nMay sao, các trinh sát của ta đã cho biết nơi có thể tìm được một người như vậy."
 seek_knowledge_animalism_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_animalism_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_animalism_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_animalism_travel_desc: "Ta thật hào hứng khi có cơ hội học [GetTrait('animalism').GetName(GetNullCharacter)]. Người ta nói những con thú của màn đêm có rất nhiều câu chuyện để kể, nếu biết cách lắng nghe."
 seek_knowledge_animalism_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 
 seek_knowledge_auspex_name: "Học Dị Năng ([GetTrait('auspex').GetName(GetNullCharacter)])"
 seek_knowledge_auspex_desc: "[GetTrait('auspex').GetName(GetNullCharacter)] là $pod_discipline$ giác quan siêu nhiên. Nó cho phép người dùng nhận biết [resonance|E] của người khác, thực hiện [GetPerk('psychic_projection_perk').GetName(GetPlayer)], và nói chung cải thiện [schemes|E]."
 seek_knowledge_auspex_effects: "Ngươi sẽ biết được nơi ở của một người thầy am hiểu [GetTrait('auspex').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể chiếm lấy $pod_discipline$ [trait|E], nhờ đó mở khóa [perks|E] trong [lifestyle|E] [GetTrait('auspex').GetName(GetNullCharacter)]."
 seek_knowledge_auspex_tt: "Nhìn xuyên qua mọi tầm nhìn."
 seek_knowledge_auspex_planning_title: "Cuộc Tìm Kiếm Auspex"
 seek_knowledge_auspex_planning_desc: "Ta đã khơi dậy huyết mạch và chuẩn bị bản thân hết mức có thể, nhưng những điểm tinh tế của [GetTrait('auspex').GetName(GetNullCharacter)] vẫn còn vượt khỏi tầm hiểu biết của ta.\n\nNếu ta muốn tinh thông $pod_discipline$ này hoàn toàn, ta sẽ cần một người thầy.\n\nMay sao, các trinh sát của ta đã cho biết nơi có thể tìm được một người như vậy."
 seek_knowledge_auspex_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_auspex_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_auspex_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_auspex_travel_desc: "Ta thật hào hứng khi có cơ hội học [GetTrait('auspex').GetName(GetNullCharacter)]. Ai mà biết được ta sẽ có thể nhìn thấy gì với nhận thức được mở rộng của mình?"
 seek_knowledge_auspex_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 
 seek_knowledge_celerity_name: "Học Dị Năng ([GetTrait('celerity').GetName(GetNullCharacter)])"
 seek_knowledge_celerity_desc: "[GetTrait('celerity').GetName(GetNullCharacter)] là $pod_discipline$ tốc độ siêu nhiên. Nó cho phép người dùng thực hiện [GetModifier('POD_blink_modifier').GetNameWithTooltip], giúp cải thiện đáng kể khả năng cơ động của quân đội. Nó cũng cải thiện [scheme_resistance|E] khi bị tấn công."
 seek_knowledge_celerity_effects: "Ngươi sẽ biết được nơi ở của một người thầy am hiểu [GetTrait('celerity').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể chiếm lấy $pod_discipline$ [trait|E], nhờ đó mở khóa [perks|E] trong [lifestyle|E] [GetTrait('celerity').GetName(GetNullCharacter)]."
 seek_knowledge_celerity_tt: "Di chuyển nhanh hơn tầm mắt có thể thấy."
 seek_knowledge_celerity_planning_title: "Cuộc Tìm Kiếm Celerity"
 seek_knowledge_celerity_planning_desc: "Ta đã khơi dậy huyết mạch và chuẩn bị bản thân hết mức có thể, nhưng những điểm tinh tế của [GetTrait('celerity').GetName(GetNullCharacter)] vẫn còn vượt khỏi tầm hiểu biết của ta.\n\nNếu ta muốn tinh thông $pod_discipline$ này hoàn toàn, ta sẽ cần một người thầy.\n\nMay sao, các trinh sát của ta đã cho biết nơi có thể tìm được một người như vậy."
