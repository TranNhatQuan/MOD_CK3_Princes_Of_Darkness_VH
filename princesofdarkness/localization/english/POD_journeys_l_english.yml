 seek_knowledge_aquis_effects: "Ngươi sẽ biết được nơi ở của một người thầy am hiểu [GetTrait('art_aquis').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể học được [trait|E] [GetTrait('art_aquis').GetName(GetPlayer)], cho phép ngươi mở khóa [perks|E] trong [lifestyle|E] [GetTrait('art_aquis').GetName(GetNullCharacter)]."
 seek_knowledge_aquis_tt: "Những dòng nước dịu dàng và những đợt sóng êm ả."
 seek_knowledge_aquis_planning_title: "Cuộc Truy Tìm Aquis"
 seek_knowledge_aquis_planning_desc: "Ta đã khơi dậy Glamour và chuẩn bị bản thân tốt nhất có thể, nhưng những điểm tinh tế của [GetTrait('art_aquis').GetName(GetNullCharacter)] vẫn còn vượt khỏi tầm hiểu biết của ta.\n\nNếu ta muốn tinh thông Nghệ thuật này hoàn toàn, ta sẽ cần một người thầy.\n\nMay sao, các trinh sát của ta đã báo cho ta biết nơi có thể tìm được một người như vậy."
