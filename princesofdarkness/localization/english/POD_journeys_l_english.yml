 seek_knowledge_fortitude_effects: "Ngươi sẽ biết được nơi ở của một người thầy am hiểu [GetTrait('fortitude').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể chiếm lấy $pod_discipline$ [trait|E], nhờ đó mở khóa [perks|E] trong [lifestyle|E] [GetTrait('fortitude').GetName(GetNullCharacter)]."
