 seek_knowledge_rosselini_name: "Học [GetTrait('necromancy').GetName(GetNullCharacter)] (Rosselini)"
 seek_knowledge_rosselini_desc: "Giống như Giovanni, gia tộc Rossellini có quan hệ chặt chẽ với Venice, nơi cả hai gia tộc đều tu luyện tử linh thuật. Trong mắt các pháp sư khác, người Rossellini thường được xem là những nhà tử linh thuật tài năng hơn. Họ nổi danh vì cách đối xử tàn nhẫn (thậm chí so với chuẩn của Giovanni) đối với những oan hồn phục dịch của họ. Đa số các nhà tử linh thuật học nghề của mình để tìm kiếm quyền lực, nhưng người Rossellini đơn giản là hưởng thụ nó, và sự tàn ác nhàn nhã đó có thể cảm nhận được trong những phép thuật họ tạo ra."
 seek_knowledge_rosselini_effects: "Ngươi sẽ biết được nơi ở của một người thầy thông thạo [GetTrait('necromancy').GetName(GetNullCharacter)] của Rosselini. Sau khi đến đó, ngươi có thể học các kỹ thuật bí mật của họ. Nếu ngươi chưa có [trait|E] [GetTrait('necromancy').GetName(GetNullCharacter)], ngươi cũng sẽ đạt được [trait|E] $pod_discipline$ này, cho phép ngươi mở khóa [perks|E] trong [lifestyle|E] [GetTrait('necromancy').GetName(GetNullCharacter)]."
 seek_knowledge_rosselini_tt: "Cái chết trở nên hợp với họ."
 seek_knowledge_rosselini_planning_title: "Cuộc Tìm Kiếm Tử Linh Thuật"
 seek_knowledge_rosselini_planning_desc: "Ta đã khuấy động huyết mạch và chuẩn bị bản thân hết mức có thể, nhưng những điểm tinh tế của [GetTrait('necromancy').GetName(GetNullCharacter)] của Rosselini vẫn còn vượt khỏi tầm hiểu của ta.\n\nNếu ta muốn tinh thông $pod_discipline$ này đến cùng, ta sẽ cần một người thầy.\n\nMay sao, các trinh sát của ta đã cho ta biết nơi có thể tìm thấy một người như vậy."
 seek_knowledge_rosselini_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_rosselini_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_rosselini_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_rosselini_travel_desc: "Ta rất mong có được cơ hội học [GetTrait('necromancy').GetName(GetNullCharacter)] của Rosselini. Khống chế được entropy bản thân sẽ khiến ta trở thành một thế lực đáng phải dè chừng."
