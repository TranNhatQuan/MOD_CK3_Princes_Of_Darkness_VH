 realm_mastery_prop_name: "Đạt được [GetTrait('realm_prop').GetName(GetNullCharacter)]"
 realm_mastery_prop_desc: "#TOOLTIP:GAME_TRAIT,realm_prop,[GetNullCharacter] #L Cõi Vật Thể#!#! là [fae_realm|E] của những vật thể được tạo ra. Một $POD_splat_fae$ có hiểu biết kém về [fae_realm|E] này chỉ có thể thi triển [cantrips|E] lên [artifacts|E] vô giá trị. Cần phải tinh thông nếu muốn thi triển [cantrips|E] lên những bảo vật độc nhất."
 realm_mastery_prop_effects: "Ngươi sẽ đi đến một freehold và thỉnh cầu [Select_CString( DidShatteringHappen, 'Lost Ones', 'Nobles' )] ban cho ngươi hiểu biết về [fae_realm|E] #TOOLTIP:GAME_TRAIT,realm_prop,[GetNullCharacter] #L Vật Thể#!#!. Nếu thành công, ngươi sẽ có được [trait|E] [GetTrait('realm_prop').GetName(GetNullCharacter)], cho phép mở khóa perk cuối cùng trong [lifestyle|E] #TOOLTIP:GAME_TRAIT,realm_prop,[GetNullCharacter] #L Vật Thể#!#!."
