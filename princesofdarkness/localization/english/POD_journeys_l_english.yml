 find_artifact_tt: "Báu vật này phải thuộc về ta."
 
 assemble_artifact_name: "Lắp Ghép một Hiện Vật"
 assemble_artifact_desc: "Chọn một [artifact|E] để tìm kiếm."
 assemble_artifact_tt: "Tri thức có giá của nó."
 assemble_artifact_planning_title: "Thêm một Mảnh Ghép của Trò Đố"
 assemble_artifact_planning_desc: "Cuối cùng, các trinh sát của ta đã trở về với tin tốt lành. Họ đã tìm ra nơi có thể tìm thấy một chương khác của Sách Nod. Thu hồi được nó sẽ đưa ta gần hơn một bước tới việc hoàn thành cả tập sách.\n\nTa chỉ có thể hy vọng kẻ hiện đang nắm giữ nó có thể... bị thuyết phục để từ bỏ nó."
 assemble_artifact_planning_confirm: "$POD_journey_planning_confirm_default$"
 assemble_artifact_planning_decline: "$POD_journey_planning_decline_default$"
