 realm_mastery_prop_tt: "Những bảo vật huyền thoại trong lòng bàn tay ta."
 realm_mastery_prop_planning_title: "Cuộc Truy Tìm Tinh Thông Cõi Vật Thể"
 realm_mastery_prop_planning_desc: "Dù ta đã cố gắng giải phóng trí tưởng tượng của mình, nó vẫn còn hạn chế ở một số khía cạnh.\n\nNếu muốn đạt được hiểu biết trọn vẹn về #TOOLTIP:GAME_TRAIT,realm_prop,[GetNullCharacter] #L Cõi Vật Thể#!#!, ta sẽ cần tìm sự giúp đỡ từ [Select_CString( DidShatteringHappen, 'Lost Ones', 'Nobles' )] đã tinh thông nó.\n\nTa đã sẵn sàng biện luận cho trường hợp của mình tại freehold gần nhất."
