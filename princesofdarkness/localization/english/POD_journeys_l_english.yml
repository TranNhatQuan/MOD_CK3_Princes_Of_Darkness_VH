 provoke_vatican_warning: "#warning Sự vi phạm chưa từng có tiền lệ này đối với [the_masquerade|E] sẽ gây ra những hậu quả to lớn, làm thay đổi cả thế giới.\n\nNgươi sẽ trở thành [GetTrait('forever_infamous').GetName(GetPlayer)] và [GetModifier( 'prestige_level_0' ).GetNameWithTooltip|L]. Ngươi chắc chắn sẽ đi vào sách lịch sử. Ngươi cũng gần như chắc chắn sẽ đi luôn, theo đúng nghĩa đen.\n\nNgươi sẵn lòng liều mình không?#!"
 
 provoke_vatican_name: "Để lộ thân phận trước Vatican"
 provoke_vatican_desc: "Ta đã chán ngán việc luôn phải rình rập trong bóng tối, luôn phải khiếp sợ trước người phàm, luôn phải giữ cho sự tồn tại của chúng ta được che giấu. Không còn nữa! Ta sẽ cho họ thấy rằng giống loài của chúng ta đáng được tôn trọng. Ta sẽ cho tất cả họ thấy..."
 provoke_vatican_effects: "Ngươi sẽ đi đến Roma và tiết lộ bản chất siêu nhiên của mình trong một cuộc tàn phá dữ dội, khơi mào sự trả đũa từ Tòa Thẩm Tra.\n\n$provoke_vatican_warning$"
 provoke_vatican_isvalid: "$EFFECT_LIST_BULLET$Ngươi là [GetTrait('arrogant').GetName(GetPlayer)]\n$EFFECT_LIST_BULLET$[capital|E] của ngươi nằm ở [GetGeographicalRegion('world_europe').GetName]\n$EFFECT_LIST_BULLET$Ngươi theo một [christian_derived_faith|E]"
 provoke_vatican_religion_tt: "Ngươi cần theo một [christian_derived_faith|E]"
 provoke_vatican_tt: "Ta sẽ đi vào ô nhục lịch sử."
 provoke_vatican_planning_title: "Đánh Thức Con Hổ"
 provoke_vatican_planning_desc: "Quyết định đã được đưa ra. Sự chuẩn bị đã hoàn tất. Ta đã sẵn sàng hết mức có thể. Giờ chỉ còn lại một chuyến đi ngắn đến Thành Thánh.\n\nKhông phải ai cũng sẽ chia sẻ tầm nhìn của ta. Thực ra, ta dự đoán sẽ có nhiều kẻ tìm cách khuyên ta bỏ cuộc, xem đây là một việc làm ngu ngốc. Họ đơn giản là không hiểu được chiều sâu của khát vọng ta.\n\nNhưng chẳng bao lâu nữa, họ sẽ hiểu."
 provoke_vatican_planning_confirm: "Đây sẽ là kiệt tác của ta."
 provoke_vatican_planning_decline: "Ta nên chắc chắn mình đã sẵn sàng cho điều này."
 provoke_vatican_travel_title: "Hành Trình đến Vatican"
 provoke_vatican_travel_desc: "Con đường phía trước sẽ đầy nguy hiểm, và ta không thể không cảm thấy một nỗi lo âu. Đây có phải là cảm giác của Caesar khi ông vượt sông Rubicon? Ông có biết rằng hành động của mình sẽ thay đổi vận mệnh của cả một dân tộc? Ông có cảm nhận được sức nặng của lịch sử? Ta chỉ có thể hy vọng rằng một ngày nào đó, khi mọi việc đã ngã ngũ và cát bụi đã lắng xuống, hành động của ta sẽ được minh oan."
 provoke_vatican_travel_confirm: "Chẳng bao lâu nữa, cả thế giới sẽ biết đến tên ta."
 
 provoke_vatican_caelestius_name: "$provoke_vatican_name$"
 provoke_vatican_caelestius_desc: "Giống loài của chúng ta đã rình rập trong bóng tối quá lâu, và để làm gì? Giáo Hội đang gán cho chúng ta là những kẻ có tội, nhưng chính khái niệm Tội Lỗi của họ lại được rút ra từ những tiền đề sai lầm. Ta biết cách vạch ra những mâu thuẫn logic của họ. Ta biết cách sửa chữa điều sai trái này. Ta sẽ... tranh luận với Giáo Hoàng."
 provoke_vatican_caelestius_effects: "Ngươi sẽ đi đến Roma và cố gắng giới thiệu Đức Thánh Cha với giáo lý Noddism riêng của mình, giành được sự chúc phúc của ngài... hoặc khơi mào sự trả đũa từ Tòa Thẩm Tra.\n\n$provoke_vatican_warning$"
 #provoke_vatican_caelestius_isvalid: ""
 provoke_vatican_caelestius_tt: "Chắc hẳn Đức Thánh Cha sẽ chúc phúc cho ta."
 provoke_vatican_caelestius_planning_title: "Chuẩn Bị một Sự Khải Lộ"
 provoke_vatican_caelestius_planning_desc: "Quyết định đã được đưa ra. Sự chuẩn bị đã hoàn tất. Ta đã sẵn sàng hết mức có thể. Giờ chỉ còn lại một chuyến đi ngắn đến Thành Thánh.\n\nKhông phải ai cũng sẽ chia sẻ tầm nhìn của ta. Thực ra, ta dự đoán sẽ có nhiều kẻ tìm cách khuyên ta bỏ cuộc, xem đây là một việc làm ngu ngốc. Họ đơn giản là không hiểu được chiều sâu của đức tin ta.\n\nNhưng chẳng bao lâu nữa, họ sẽ hiểu."
 provoke_vatican_caelestius_planning_confirm: "$provoke_vatican_planning_confirm$"
 provoke_vatican_caelestius_planning_decline: "$provoke_vatican_planning_decline$"
