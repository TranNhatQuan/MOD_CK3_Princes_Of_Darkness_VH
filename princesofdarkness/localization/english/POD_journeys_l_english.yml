 seek_knowledge_mytherceria_desc: "[GetTrait('mytherceria').GetName(GetNullCharacter)] là một $pod_discipline$ của Xảo Thuật, được các dòng huyết [GetTrait('maeghar').GetName(GetNullCharacter)] và [GetTrait('kiasyd').GetName(GetNullCharacter)] tu luyện. Nó cải thiện [schemes|E] của người luyện và trao cho họ nhiều năng lực khác nhau gắn liền với Fae, chẳng hạn [GetPerk('aura_absorption_perk').GetName(GetPlayer)] hoặc [GetPerk('riddle_phantastique_perk').GetName(GetPlayer)]."
