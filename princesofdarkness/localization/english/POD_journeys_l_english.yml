 seek_knowledge_tieh_tan_name: "Học Wu Tan ([GetTrait('art_tieh_tan').GetName(GetNullCharacter)])"
 seek_knowledge_tieh_tan_desc: "[GetTrait('art_tieh_tan').GetName(GetNullCharacter)] là thuật giả kim của kim loại. Một người luyện tập có thể triệu hồi [men_at_arms|E] [GetMaA('metal_elemental').GetName()] và nhận được các khả năng như [GetPerk('summon_dispel_metal_perk').GetName(GetPlayer)], [GetPerk('tieh_tan_exchange_properties_perk').GetName(GetPlayer)], và [GetPerk('transmute_metal_perk').GetName(GetPlayer)]."
 seek_knowledge_tieh_tan_effects: "Ngươi sẽ biết được nơi ở của một người thầy am hiểu [GetTrait('art_tieh_tan').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể học được [trait|E] [GetTrait('art_tieh_tan').GetName(GetPlayer)], cho phép ngươi mở khóa [perks|E] trong [lifestyle|E] [GetTrait('art_tieh_tan').GetName(GetNullCharacter)]."
 seek_knowledge_tieh_tan_tt: "Sự chính trực của Kim Hồn."
 seek_knowledge_tieh_tan_planning_title: "Cuộc Truy Tìm Tieh Tan"
 seek_knowledge_tieh_tan_planning_desc: "Ta đã lưu chuyển Khí và chuẩn bị bản thân tốt nhất có thể, nhưng những điểm tinh tế của [GetTrait('art_tieh_tan').GetName(GetNullCharacter)] vẫn còn vượt khỏi tầm hiểu biết của ta.\n\nNếu ta muốn tinh thông Nghệ thuật này hoàn toàn, ta sẽ cần một người thầy.\n\nMay sao, các trinh sát của ta đã báo cho ta biết nơi có thể tìm được một người như vậy."
 seek_knowledge_tieh_tan_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_tieh_tan_planning_decline: "$POD_journey_planning_decline_default$"
