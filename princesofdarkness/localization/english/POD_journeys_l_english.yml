 seek_knowledge_daimonion_name: "Học Dị Năng Hiếm ([GetTrait('daimonion').GetName(GetNullCharacter)])"
 seek_knowledge_daimonion_desc: "[GetTrait('daimonion').GetName(GetNullCharacter)] là $pod_discipline$ địa ngục được dòng máu [GetTrait('baali').GetName(GetNullCharacter)] tu luyện. Người tu luyện sẽ nhận được [GetPerk('psychomachia_perk').GetName(GetPlayer)] và khả năng thao túng người khác qua tội lỗi và đức hạnh của họ. Nhưng liệu điều đó có đáng đổi lấy giá của linh hồn mình?"
 seek_knowledge_daimonion_effects: "Ngươi sẽ biết được nơi ở của một người thầy am hiểu [GetTrait('daimonion').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể chiếm lấy $pod_discipline$ [trait|E], nhờ đó mở khóa [perks|E] trong [lifestyle|E] [GetTrait('daimonion').GetName(GetNullCharacter)]."
 seek_knowledge_daimonion_tt: "Mục đích biện minh cho phương tiện."
 seek_knowledge_daimonion_planning_title: "Cuộc Tìm Kiếm Daimonion"
 seek_knowledge_daimonion_planning_desc: "Ta đã khơi dậy huyết mạch và chuẩn bị bản thân hết mức có thể, nhưng những điểm tinh tế của [GetTrait('daimonion').GetName(GetNullCharacter)] vẫn còn vượt khỏi tầm hiểu biết của ta.\n\nNếu ta muốn tinh thông $pod_discipline$ này hoàn toàn, ta sẽ cần một người thầy.\n\nMay sao, các trinh sát của ta đã cho biết nơi có thể tìm được một người như vậy."
