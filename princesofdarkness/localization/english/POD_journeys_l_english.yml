 provoke_vatican_caelestius_travel_desc: "$provoke_vatican_travel_desc$"
 provoke_vatican_caelestius_travel_confirm: "$provoke_vatican_travel_confirm$"
 
 siochain_1_name: "Truyền Thuyết về Sự Cân Bằng: Thế Giới Xám"
 siochain_1_desc: "Dù qua nghiên cứu có chủ đích hay nỗi kinh hoàng cận kề của cái chết, ngươi đã đến với một nhận thức. Sự cân bằng hoàn hảo giữa bản thân người phàm và bản thân yêu tinh của ngươi là khả thi. Nhưng để đạt được điều đó, cần phải đạt được hiểu biết trọn vẹn về cả Glamour và Banality. Một trận chiến gian nan, nếu từng có trận chiến nào như vậy."
 siochain_1_effects: "Ngươi sẽ chiêm niệm về Banality, và tiến gần hơn một bước tới sự hoàn hảo."
 siochain_1_isvalid: "$EFFECT_LIST_BULLET$Ngươi có [perk|E] [GetPerk('realm_fae_5_perk').GetName(GetPlayer)]"
 siochain_1_tt: "Thế Giới Mùa Thu nắm giữ câu trả lời."
 siochain_1_planning_title: "Tìm Kiếm Sự Cân Bằng"
 siochain_1_planning_desc: "Ta đã đắm mình vào thế giới của người phàm, bị bóp nghẹt bởi những luật lệ gò bó và nghi thức cứng nhắc của họ.\n\nDù Banality có đe dọa siết chặt ta, ta đã xem đó là một bài học. Và đã có rất nhiều bài học như vậy gần đây.\n\nLiệu đã đủ chưa?"
 siochain_1_planning_confirm: "Đến lúc suy ngẫm về những gì ta đã học được."
 siochain_1_planning_decline: "Chưa đến lúc."

 siochain_2_name: "Truyền Thuyết về Sự Cân Bằng: Thế Giới Sặc Sỡ"
 siochain_2_desc: "Ta đã đắm mình trong Banality và thoát ra an toàn, nhưng đó chỉ là bước đầu tiên. Tiếp theo, ta sẽ cần kết nối với bản thân yêu tinh của mình."
 siochain_2_effects: "Ngươi sẽ chiêm niệm về Glamour, và tiến gần hơn một bước tới sự hoàn hảo."
 #siochain_2_isvalid: ""
 siochain_2_tt: "Những câu hỏi mà chỉ Dreaming mới có thể trả lời."
 siochain_2_planning_title: "Tìm Kiếm Sự Cân Bằng"
 siochain_2_planning_desc: "Ta đã chiêm niệm trong khi ngập chìm trong những cơn bão Glamour. Ta đã để chất liệu thô sơ của Dreaming thấm đẫm ta cho đến khi không còn gì của ta sót lại, không còn phân biệt, không còn trong ngoài.\n\nLiệu sự hỗn loạn này có thể kết tinh thành hiểu biết thực sự?"
 siochain_2_planning_confirm: "Đến lúc suy ngẫm về những gì ta đã học được."
 siochain_2_planning_decline: "Chưa đến lúc."

 siochain_3_name: "Truyền Thuyết về Sự Cân Bằng: Nơi Giao Thoa của các Thế Giới"
 siochain_3_desc: "Dường như không có cách nào để hòa giải hiểu biết của ta về Glamour và Banality. Chúng đối lập nhau. Rõ ràng là vậy. Đó chỉ là lẽ thường. Nhưng khi nào lẽ thường từng cản được một Changeling?"
 siochain_3_effects: "Ngươi sẽ mạo hiểm thực hiện nỗ lực đầy rủi ro là hòa hợp Banality và Glamour trong chính bản thân mình."
 siochain_3_isvalid: "$EFFECT_LIST_BULLET$Ngươi không phải là [GetModifier('POD_disconected_from_dreaming').GetNameWithTooltip]"
 siochain_3_tt: "Tìm kiếm sự cân bằng giữa những nghịch lý."
 siochain_3_planning_title: "Đạt Được Sự Cân Bằng"
 siochain_3_planning_desc: "Banality và Glamour đi cùng nhau như nước và dầu. Chưa ai từng thành công trong việc pha trộn chúng.\n\nChưa mà thôi.\n\nTa đã chuẩn bị đủ lâu cho điều này. Thực hành chỉ có thể đưa ta đi được đến vậy. Ta cần phải liều mình."
 siochain_3_planning_confirm: "Bây giờ hoặc không bao giờ."
 siochain_3_planning_decline: "Nghe có vẻ căng thẳng, ta sẽ làm việc này vào lúc khác."

