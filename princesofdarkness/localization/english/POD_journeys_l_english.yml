 wake_from_torpor_planning_title: "Đánh Thức Kẻ Ngủ Say"
 wake_from_torpor_planning_desc: "Ta đã tìm hiểu hết mức có thể về nơi ở của thân xác [PlayerJourneyTarget.GetFirstNameNicknamedPossessive], hiện đang trong trạng thái [GetTrait('torpor').GetName(PlayerJourneyTarget)].\n\nGiờ ta đã biết vị trí đại khái của [PlayerJourneyTarget.GetHerHis|l], nhưng ta sẽ phải lục soát khắp tỉnh kỹ hơn nữa nếu muốn tìm ra nơi ẩn náu thật sự của [PlayerJourneyTarget.GetHerHis|l]."
