 seek_knowledge_tieh_tan_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 
 seek_knowledge_nei_tan_name: "Học Wu Tan ([GetTrait('art_nei_tan').GetName(GetNullCharacter)])"
 seek_knowledge_nei_tan_desc: "[GetTrait('art_nei_tan').GetName(GetNullCharacter)] là thuật giả kim của nội tâm. Một người luyện tập nhận được nhiều khả năng thụ động khác nhau như [GetPerk('the_benevolent_hand_of_jade_perk').GetName(GetPlayer)], [GetPerk('the_mutable_furies_perk').GetName(GetPlayer)], và [GetPerk('visage_of_dead_perk').GetName(GetPlayer)]. Họ cũng có thể [GetPerk('unlock_the_jade_portal_perk').GetName(GetPlayer)] và [GetPerk('fortify_the_wall_perk').GetName(GetPlayer)]."
 seek_knowledge_nei_tan_effects: "Ngươi sẽ biết được nơi ở của một người thầy am hiểu [GetTrait('art_nei_tan').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể học được [trait|E] [GetTrait('art_nei_tan').GetName(GetPlayer)], cho phép ngươi mở khóa [perks|E] trong [lifestyle|E] [GetTrait('art_nei_tan').GetName(GetNullCharacter)]."
 seek_knowledge_nei_tan_tt: "Cân bằng bản thân, vượt qua mọi giới hạn."
 seek_knowledge_nei_tan_planning_title: "Cuộc Truy Tìm Nei Tan"
 seek_knowledge_nei_tan_planning_desc: "Ta đã lưu chuyển Khí và chuẩn bị bản thân tốt nhất có thể, nhưng những điểm tinh tế của [GetTrait('art_nei_tan').GetName(GetNullCharacter)] vẫn còn vượt khỏi tầm hiểu biết của ta.\n\nNếu ta muốn tinh thông Nghệ thuật này hoàn toàn, ta sẽ cần một người thầy.\n\nMay sao, các trinh sát của ta đã báo cho ta biết nơi có thể tìm được một người như vậy."
 seek_knowledge_nei_tan_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_nei_tan_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_nei_tan_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_nei_tan_travel_desc: "Ta thật háo hức được có cơ hội học [GetTrait('art_nei_tan').GetName(GetNullCharacter)]. Liệu việc tinh thông nó có cho phép ta rời bỏ thế giới này không?"
 seek_knowledge_nei_tan_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 
 seek_knowledge_feng_shui_name: "Học Pháp Nghệ Khí ([GetTrait('chi_art_feng_shui').GetName(GetNullCharacter)])"
 seek_knowledge_feng_shui_desc: "Phong Thủy là một pháp thuật cổ xưa chuyên về sự sắp đặt đúng đắn và cát lành cho các công trình, mộ phần và không gian nội thất, phù hợp với các phát xạ từ trời và cấu hình từ đất, cho phép Khí lưu chuyển tự do để hài hòa con người với môi trường xung quanh họ."
 seek_knowledge_feng_shui_effects: "Ngươi sẽ biết được nơi ở của một người thầy am hiểu [GetTrait('chi_art_feng_shui').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể học được [trait|E] [GetTrait('chi_art_feng_shui').GetName(GetPlayer)], cho phép ngươi mở khóa [perks|E] trong [lifestyle|E] [GetTrait('chi_art_feng_shui').GetName(GetNullCharacter)]."
 seek_knowledge_feng_shui_tt: "Hài hòa trong mọi sự."
 seek_knowledge_feng_shui_planning_title: "Cuộc Truy Tìm Phong Thủy"
 seek_knowledge_feng_shui_planning_desc: "Ta đã lưu chuyển Khí và chuẩn bị bản thân tốt nhất có thể, nhưng những điểm tinh tế của [GetTrait('chi_art_feng_shui').GetName(GetNullCharacter)] vẫn còn vượt khỏi tầm hiểu biết của ta.\n\nNếu ta muốn tinh thông Nghệ thuật này hoàn toàn, ta sẽ cần một người thầy.\n\nMay sao, các trinh sát của ta đã báo cho ta biết nơi có thể tìm được một người như vậy."
 seek_knowledge_feng_shui_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_feng_shui_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_feng_shui_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_feng_shui_travel_desc: "Ta thật háo hức được có cơ hội học [GetTrait('chi_art_feng_shui').GetName(GetNullCharacter)]. Khi người ta trồng dưỡng sự hài hòa trong môi trường xung quanh mình, sự hài hòa nội tâm chắc chắn sẽ theo sau."
 seek_knowledge_feng_shui_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 
 seek_knowledge_obligation_name: "Học Pháp Nghệ Khí ([GetTrait('chi_art_obligation').GetName(GetNullCharacter)])"
 seek_knowledge_obligation_desc: "Obligation là một pháp thuật cho phép một $pod_kueijin$ áp đặt quyền kiểm soát lên người khác. Đó là một sự hồi tưởng về vinh quang của Wan Xian cổ xưa và uy quyền của họ bắt nguồn từ một sắc lệnh của chính [Glossary('Ngọc Hoàng','podgloss.augustpersonageofjade')]. Dù đã mất đi sự ưu ái này, một số kẻ vẫn có thể truyền cảm hứng hoặc thống trị tâm hồn những kẻ xung quanh họ."
 seek_knowledge_obligation_effects: "Ngươi sẽ biết được nơi ở của một người thầy am hiểu [GetTrait('chi_art_obligation').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể học được [trait|E] [GetTrait('chi_art_obligation').GetName(GetPlayer)], cho phép ngươi mở khóa [perks|E] trong [lifestyle|E] [GetTrait('chi_art_obligation').GetName(GetNullCharacter)]."
 seek_knowledge_obligation_tt: "Nói năng nhẹ nhàng, nhưng mang theo một cây gậy lớn."
 seek_knowledge_obligation_planning_title: "Cuộc Truy Tìm Obligation"
 seek_knowledge_obligation_planning_desc: "Ta đã lưu chuyển Khí và chuẩn bị bản thân tốt nhất có thể, nhưng những điểm tinh tế của [GetTrait('chi_art_obligation').GetName(GetNullCharacter)] vẫn còn vượt khỏi tầm hiểu biết của ta.\n\nNếu ta muốn tinh thông Nghệ thuật này hoàn toàn, ta sẽ cần một người thầy.\n\nMay sao, các trinh sát của ta đã báo cho ta biết nơi có thể tìm được một người như vậy."
 seek_knowledge_obligation_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_obligation_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_obligation_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_obligation_travel_desc: "Ta thật háo hức được có cơ hội học [GetTrait('chi_art_obligation').GetName(GetNullCharacter)]. Từng có thời Vạn Vị Anh Hùng mang trong mình uy quyền của chính Thiên Đình. Kỷ Nguyên Truyền Thuyết có thể đã lùi xa vào quá khứ, nhưng ai bảo ta không thể tiếp nối di sản của họ?"
 seek_knowledge_obligation_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 
 seek_knowledge_tapestry_name: "Học Pháp Nghệ Khí ([GetTrait('chi_art_tapestry').GetName(GetNullCharacter)])"
 seek_knowledge_tapestry_desc: "Dệt Cảnh là pháp thuật khí công khai thác triệt để long mạch. Qua việc luyện tập Dệt Cảnh, ma cà rồng hòa hợp bản thân với các lực Âm và Dương trong gió, nước và đất, sau đó điều khiển những lực đó cho nhiều mục đích khác nhau."
 seek_knowledge_tapestry_effects: "Ngươi sẽ biết được nơi ở của một người thầy am hiểu [GetTrait('chi_art_tapestry').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể học được [trait|E] [GetTrait('chi_art_tapestry').GetName(GetPlayer)], cho phép ngươi mở khóa [perks|E] trong [lifestyle|E] [GetTrait('chi_art_tapestry').GetName(GetNullCharacter)]."
 seek_knowledge_tapestry_tt: "Chuyển hướng những dòng sông lớn của khí."
 seek_knowledge_tapestry_planning_title: "Cuộc Truy Tìm Dệt Cảnh"
 seek_knowledge_tapestry_planning_desc: "Ta đã lưu chuyển Khí và chuẩn bị bản thân tốt nhất có thể, nhưng những điểm tinh tế của [GetTrait('chi_art_tapestry').GetName(GetNullCharacter)] vẫn còn vượt khỏi tầm hiểu biết của ta.\n\nNếu ta muốn tinh thông Nghệ thuật này hoàn toàn, ta sẽ cần một người thầy.\n\nMay sao, các trinh sát của ta đã báo cho ta biết nơi có thể tìm được một người như vậy."
 seek_knowledge_tapestry_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_tapestry_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_tapestry_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_tapestry_travel_desc: "Ta thật háo hức được có cơ hội học [GetTrait('chi_art_tapestry').GetName(GetNullCharacter)]. Chi'n Ta và Hengeyokai canh giữ những nơi quyền năng của họ một cách đầy đố kỵ. Một kho bí mật, chỉ chờ được ai đó đủ khát vọng để cưỡng ép mở ra."
 seek_knowledge_tapestry_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 
 seek_knowledge_prana_name: "Học Pháp Nghệ Khí ([GetTrait('chi_art_prana').GetName(GetNullCharacter)])"
 seek_knowledge_prana_desc: "Prana là pháp thuật khí công sử dụng cả hai mặt của Khí, Âm và Dương. Một người luyện tập có thể hòa hợp bản thân với các nguồn năng lượng của cái chết và sự sống tương ứng, hoặc dùng sự hòa hợp của chúng để chữa lành thương tích."
 seek_knowledge_prana_effects: "Ngươi sẽ biết được nơi ở của một người thầy am hiểu [GetTrait('chi_art_prana').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể học được [trait|E] [GetTrait('chi_art_prana').GetName(GetPlayer)], cho phép ngươi mở khóa [perks|E] trong [lifestyle|E] [GetTrait('chi_art_prana').GetName(GetNullCharacter)]."
 seek_knowledge_prana_tt: "Những nghịch lý hợp nhất."
 seek_knowledge_prana_planning_title: "Cuộc Truy Tìm Prana"
 seek_knowledge_prana_planning_desc: "Ta đã lưu chuyển Khí và chuẩn bị bản thân tốt nhất có thể, nhưng những điểm tinh tế của [GetTrait('chi_art_prana').GetName(GetNullCharacter)] vẫn còn vượt khỏi tầm hiểu biết của ta.\n\nNếu ta muốn tinh thông Nghệ thuật này hoàn toàn, ta sẽ cần một người thầy.\n\nMay sao, các trinh sát của ta đã báo cho ta biết nơi có thể tìm được một người như vậy."
 seek_knowledge_prana_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_prana_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_prana_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_prana_travel_desc: "Ta thật háo hức được có cơ hội học [GetTrait('chi_art_prana').GetName(GetNullCharacter)]. Những Kẻ Chết Đói Khát được định nghĩa bởi những nghịch lý: Chết và sống, Hun và P'o, luôn hướng đến Thiên Đình trong khi bị săn đuổi bởi các Địa Ngục. Bước đầu tiên, có vẻ như, là tìm ra sự hợp nhất trong sự khác biệt này."
 seek_knowledge_prana_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 
 seek_knowledge_kiai_name: "Học Chi Thuật ([GetTrait('chi_art_kiai').GetName(GetNullCharacter)])"
 seek_knowledge_kiai_desc: "Kiai là chi thuật khơi dòng thịnh nộ của Ác Ma qua giọng nói, một kỹ thuật uy lực có vô số ứng dụng trên chiến trường."
 seek_knowledge_kiai_effects: "Ngươi sẽ biết được nơi ở của một người thầy tường tận [GetTrait('chi_art_kiai').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể đạt được [trait|E] [GetTrait('chi_art_kiai').GetName(GetPlayer)], cho phép mở khóa [perks|E] trong [lifestyle|E] [GetTrait('chi_art_kiai').GetName(GetNullCharacter)]."
 seek_knowledge_kiai_tt: "Hét lên, hét lên, dốc hết ra ngoài."
 seek_knowledge_kiai_planning_title: "Cuộc Truy Tìm Kiai"
 seek_knowledge_kiai_planning_desc: "Ta đã lưu chuyển Khí của mình và chuẩn bị hết sức có thể, nhưng những điều tinh túy của [GetTrait('chi_art_kiai').GetName(GetNullCharacter)] vẫn còn vượt khỏi tầm hiểu biết của ta.\n\nNếu muốn tinh thông Thuật này trọn vẹn, ta cần một người thầy.\n\nMay sao, các trinh sát của ta đã báo lại nơi có thể tìm được một người như vậy."
 seek_knowledge_kiai_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_kiai_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_kiai_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_kiai_travel_desc: "Ta phấn khích trước cơ hội học được [GetTrait('chi_art_kiai').GetName(GetNullCharacter)]. Chuyện kể về những anh hùng vĩ đại đã đánh tan quân đội và san bằng cả chiến trường chỉ bằng giọng nói của mình."
 seek_knowledge_kiai_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 
 seek_knowledge_tzu_wei_name: "Học Chi Thuật ([GetTrait('chi_art_tzu_wei').GetName(GetNullCharacter)])"
 seek_knowledge_tzu_wei_desc: "Tử Vi là chi thuật đọc và điều khiển tử vi số mệnh. Khi $pod_kueijin$ tu luyện Tử Vi, họ có thể định hình chính vận mệnh và bẻ cong các thế lực của may rủi theo ý mình."
 seek_knowledge_tzu_wei_effects: "Ngươi sẽ biết được nơi ở của một người thầy tường tận [GetTrait('chi_art_tzu_wei').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể đạt được [trait|E] [GetTrait('chi_art_tzu_wei').GetName(GetPlayer)], cho phép mở khóa [perks|E] trong [lifestyle|E] [GetTrait('chi_art_tzu_wei').GetName(GetNullCharacter)]."
 seek_knowledge_tzu_wei_tt: "Không phải vận may, chỉ là kỹ năng... rồi biến thành vận may."
 seek_knowledge_tzu_wei_planning_title: "Cuộc Truy Tìm Tử Vi"
 seek_knowledge_tzu_wei_planning_desc: "Ta đã lưu chuyển Khí của mình và chuẩn bị hết sức có thể, nhưng những điều tinh túy của [GetTrait('chi_art_tzu_wei').GetName(GetNullCharacter)] vẫn còn vượt khỏi tầm hiểu biết của ta.\n\nNếu muốn tinh thông Thuật này trọn vẹn, ta cần một người thầy.\n\nMay sao, các trinh sát của ta đã báo lại nơi có thể tìm được một người như vậy."
 seek_knowledge_tzu_wei_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_tzu_wei_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_tzu_wei_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_tzu_wei_travel_desc: "Ta phấn khích trước cơ hội học được [GetTrait('chi_art_tzu_wei').GetName(GetNullCharacter)]. Số phận hẳn phải như một cuốn sách mở ra trước kẻ biết cách đọc nó trong các vì tinh tú."
 seek_knowledge_tzu_wei_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 
 seek_knowledge_sorcery_name: "Học Numinum (#TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Huyền Thuật#!#!)"
 seek_knowledge_sorcery_desc: "#TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Huyền Thuật#!#! là một dạng ma thuật đơn giản mà ngay cả người phàm chưa tỉnh thức cũng có thể học được. Nó bao gồm vô số khả năng huyền thuật: #TOOLTIP:PERK,numina_conveyance_5_perk #L Vận Chuyển#!#!, #TOOLTIP:PERK,numina_conjuration_4_perk #L Triệu Hồn#!#!, #TOOLTIP:PERK,numina_divination_5_perk #L Bốc Toán#!#!, #TOOLTIP:PERK,numina_enchantment_2_perk #L Phù Chú#!#!, và nhiều hơn nữa. Một người luyện thuật tinh thông thậm chí có thể dùng [GetPerk('numina_alchemy_5_perk').GetName(GetPlayer)] hoặc [GetPerk('numina_healing_6_perk').GetName(GetPlayer)] để đạt được sự bất tử."
 seek_knowledge_sorcery_effects: "Ngươi sẽ biết được nơi ở của một người thầy tường tận #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Huyền Thuật#!#!. Sau khi đến đó, ngươi có thể đạt được [trait|E] [GetTrait('sorcerer').GetName(GetPlayer)], cho phép mở khóa [perks|E] trong nhánh Thuật Sĩ của [lifestyle|E] #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Huyền Thuật#!#!."
 seek_knowledge_sorcery_isvalid: "$EFFECT_LIST_BULLET$[faith|E] của ngươi không được xem #TOOLTIP:GAME_FAITH_DOCTRINE,doctrine_magicraft_crime #L Ma Thuật#!#! là một [crime|E]."
 seek_knowledge_sorcery_tt: "Ta sẽ học những điều bí ẩn của ma thuật tuyến tính."
 seek_knowledge_sorcery_planning_title: "Cuộc Truy Tìm Ma Thuật Tuyến Tính"
 seek_knowledge_sorcery_planning_desc: "Sau khi nghiền ngẫm các cổ thư bí truyền và đọc nhiều luận thuyết về #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Huyền Thuật#!#!, giờ ta đã có nền tảng lý thuyết khá vững.\n\nTuy vậy, thực hành lại là chuyện khác. Ta sẽ cần một người thầy trước khi có thể tự xưng là [GetTrait('sorcerer').GetName(GetPlayer)] một cách thực thụ.\n\nCác trinh sát của ta đã báo lại nơi có thể tìm được một người như vậy."
 seek_knowledge_sorcery_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_sorcery_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_sorcery_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_sorcery_travel_desc: "Ta phấn khích trước cơ hội học được #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Huyền Thuật#!#!. Ai biết được ta sẽ làm được gì khi ma thuật nằm trong tay mình? Khả năng là vô hạn."
 seek_knowledge_sorcery_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 
 seek_knowledge_theurgy_name: "Học Numinum (#TOOLTIP:GAME_TRAIT,theurgist,[GetNullCharacter] #L Thần Thuật#!#!)"
 seek_knowledge_theurgy_desc: "#TOOLTIP:GAME_TRAIT,theurgist,[GetNullCharacter] #L Thần Thuật#!#! là một dạng ma thuật ban đầu do các nhà huyền học Do Thái tu luyện và gần đây được các học giả Cơ Đốc tái phát hiện. Nó đã được hệ thống hóa thành nhiều nhánh, như #TOOLTIP:PERK,numina_via_medicamenti_1_perk #L Via Medicamenti#!#!, #TOOLTIP:PERK,numina_via_oraculi_5_perk #L Via Oraculi#!#!, hay #TOOLTIP:PERK,numina_via_necromantiae_1_perk #L Via Necromantiae#!#!."
 seek_knowledge_theurgy_effects: "Ngươi sẽ biết được nơi ở của một người thầy tường tận #TOOLTIP:GAME_TRAIT,theurgist,[GetNullCharacter] #L Thần Thuật#!#!. Sau khi đến đó, ngươi có thể đạt được [trait|E] [GetTrait('theurgist').GetName(GetPlayer)], cho phép mở khóa [perks|E] trong nhánh Thần Thuật của [lifestyle|E] #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Huyền Thuật#!#!."
 seek_knowledge_theurgy_isvalid: "$EFFECT_LIST_BULLET$[faith|E] của ngươi không được xem #TOOLTIP:GAME_FAITH_DOCTRINE,doctrine_magicraft_crime #L Ma Thuật#!#! là một [crime|E].\n#help $EFFECT_LIST_BULLET$Hạn chế này bị bỏ qua nếu tín ngưỡng của ngươi có gốc từ các tôn giáo Abraham ([GetReligionByKey('roadofheaven_religion').GetName], [GetReligionByKey('ashirra_religion').GetName], [GetReligionByKey('bloodgnosticism_religion').GetName], [GetReligionByKey('roadofblood_religion').GetName], [GetReligionByKey('calomenasforsaken_religion').GetName], [GetReligionByKey('fishers_religion').GetName], [GetFaithByKey('shadowinquisition').GetName], [GetFaithByKey('akritai').GetName], [GetFaithByKey('ikhwan_al_safa').GetName], [GetFaithByKey('judge').GetName], [GetFaithByKey('crestofthehorn').GetName], [GetFaithByKey('orderofourmercifulmother').GetName], hoặc [GetDoctrine('tenet_constantinian').GetBaseName]).#!"
 seek_knowledge_theurgy_tt: "Ta sẽ hiện thân Bản Ngã Cao Cả của mình."
 seek_knowledge_theurgy_planning_title: "Cuộc Truy Tìm Thần Thuật"
 seek_knowledge_theurgy_planning_desc: "Sau khi nghiền ngẫm các cổ thư bí truyền và đọc nhiều luận thuyết về #TOOLTIP:GAME_TRAIT,theurgist,[GetNullCharacter] #L Thần Thuật#!#!, giờ ta đã có nền tảng lý thuyết khá vững.\n\nTuy vậy, thực hành lại là chuyện khác. Ta sẽ cần một người thầy trước khi có thể tự xưng là [GetTrait('theurgist').GetName(GetPlayer)] một cách thực thụ.\n\nCác trinh sát của ta đã báo lại nơi có thể tìm được một người như vậy."
 seek_knowledge_theurgy_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_theurgy_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_theurgy_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_theurgy_travel_desc: "Ta phấn khích trước cơ hội học được #TOOLTIP:GAME_TRAIT,theurgist,[GetNullCharacter] #L Thần Thuật#!#!. Với đủ sự tập trung, những điều bí ẩn của Thiên Đường sẽ hiện lên trước mắt trong tâm trí ta."
 seek_knowledge_theurgy_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 
 seek_knowledge_psychic_name: "Học Numinum (#TOOLTIP:GAME_TRAIT,psychic,[GetNullCharacter] #L Năng Lực Tâm Linh#!#!)"
 seek_knowledge_psychic_desc: "Một số người phàm có khả năng biểu hiện #TOOLTIP:GAME_TRAIT,psychic,[GetNullCharacter] #L Hiện Tượng Tâm Linh#!#!. Những khả năng này bao gồm vô số năng lực như #TOOLTIP:PERK,astral_projection_1_perk #L Xuất Hồn#!#!, #TOOLTIP:PERK,psychometry_1_perk #L Linh Cảm Vật Thể#!#!, #TOOLTIP:PERK,animal_psi_3_perk #L Tâm Linh Thú#!#!, và nhiều hơn nữa. Năng lực tâm linh được cho là bẩm sinh, nhưng có lẽ vẫn có cách để cưỡng buộc tâm trí mở ra..."
 seek_knowledge_psychic_effects: "Ngươi sẽ biết được nơi ở của một người thầy tường tận #TOOLTIP:GAME_TRAIT,psychic,[GetNullCharacter] #L Năng Lực Tâm Linh#!#!. Sau khi đến đó, ngươi có thể đạt được [trait|E] [GetTrait('psychic').GetName(GetPlayer)], cho phép mở khóa [perks|E] trong [lifestyle|E] #TOOLTIP:GAME_TRAIT,psychic,[GetNullCharacter] #L Psi#!#!."
 seek_knowledge_psychic_tt: "Ta sẽ đánh thức sức mạnh của tâm trí mình."
 seek_knowledge_psychic_planning_title: "Cuộc Truy Tìm Năng Lực Tâm Linh"
 seek_knowledge_psychic_planning_desc: "Sau khi nghiền ngẫm các cổ thư bí truyền và đọc nhiều luận thuyết về #TOOLTIP:GAME_TRAIT,psychic,[GetNullCharacter] #L Psi#!#!, giờ ta đã có nền tảng lý thuyết khá vững.\n\nĐáng tiếc, cả lý thuyết lẫn thực hành đều không thể thực sự khai mở tiềm năng của tâm trí ta. Cần có ai đó am hiểu để mở nó ra. Bằng vũ lực, nếu cần thiết.\n\nCác trinh sát của ta đã báo lại nơi có thể tìm được một người như vậy."
 seek_knowledge_psychic_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_psychic_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_psychic_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_psychic_travel_desc: "Ta phấn khích trước cơ hội học được #TOOLTIP:GAME_TRAIT,psychic,[GetNullCharacter] #L Năng Lực Tâm Linh#!#!. Tâm trí ta sẽ làm được gì khi thoát khỏi những ràng buộc hiện tại?"
 seek_knowledge_psychic_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 
 seek_knowledge_demonology_name: "Học #TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L Ác Ma Học#!#!"
 seek_knowledge_demonology_desc: "#TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L Ác Ma Học#!#!, tự nó, chỉ là môn nghiên cứu học thuật về $POD_splat_demon_plural$. Tất nhiên, hầu hết các Ác Ma Học Giả không hài lòng với lý thuyết đơn thuần, và chọn con đường quyết liệt hơn nhiều là bán linh hồn mình — một lối đi dẫn đến nhiều khả năng mà một số người có thể xem là phi tự nhiên."
 seek_knowledge_demonology_effects: "Ngươi sẽ biết được nơi ở của một người thầy tường tận #TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L Ác Ma Học#!#!. Sau khi đến đó, ngươi có thể đạt được [trait|E] [GetTrait('demonology').GetName(GetPlayer)], mở ra khả năng trở thành [GetTrait('witch').GetName(GetNullCharacter)] — hoặc qua nhiệm vụ khó khăn [diabolism_binding|E] một [GetTrait('demon').GetName(GetNullCharacter)] theo ý mình, hoặc con đường dễ dàng hơn nhiều là [Concept('becoming their willing slave','thralldom')|E]..."
 seek_knowledge_demonology_isvalid: "$EFFECT_LIST_BULLET$Ngươi phải ở trong một thế giới nơi $POD_splat_demon_plural$ là một trong các [splats|E] khả dụng."
 seek_knowledge_demonology_requirement_date: "Ngươi bắt đầu ở một bookmark chỉ dành cho [GetTrait('vampire').GetName(GetNullCharacter)], nơi $POD_splat_demon_plural$ (và nhiều [splats|E] khác) không khả dụng"
 seek_knowledge_demonology_tt: "Ta sẽ trả bất cứ giá nào để có được sức mạnh chân thực."
 seek_knowledge_demonology_planning_title: "Cuộc Truy Tìm Ác Ma Học"
 seek_knowledge_demonology_planning_desc: "Sau khi nghiền ngẫm các cổ thư cấm kỵ và đọc những luận thuyết phạm thượng về #TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L Ác Ma Học#!#!, giờ ta đã có nền tảng lý thuyết khá vững.\n\nTuy vậy, thực hành lại là chuyện khác. Ta sẽ cần một người thầy trước khi có thể tự xưng là #TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L Ác Ma Học Giả#!#! một cách thực thụ.\n\nCác trinh sát của ta đã báo lại nơi có thể tìm được một người như vậy."
 seek_knowledge_demonology_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_demonology_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_demonology_travel_title: "Cuộc Truy Tìm Tri Thức Cấm"
 seek_knowledge_demonology_travel_desc: "Ta không thể phủ nhận đôi chút run sợ trước ý tưởng học #TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L Ác Ma Học#!#!, nhưng ta đã quyết định. Ta sẽ bị khinh miệt, bị khước từ, thậm chí bị săn đuổi. Cả thế gian sẽ xa lánh ta. Nhưng cuối cùng... ta sẽ là người cười sau cùng."
 seek_knowledge_demonology_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 
