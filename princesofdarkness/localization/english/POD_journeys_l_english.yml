 assemble_artifact_travel_desc: ""
 assemble_artifact_travel_confirm: ""
 
 golconda_1_name: "Học Cách Chế Ngự Dã Thú của Ngươi"
 golconda_1_desc: "Có những lời đồn về $POD_splat_vampire_plural$ đã vượt qua [Glossary('Dã Thú','game_concept_beast_desc')] một cách vĩnh viễn, đạt đến một trạng thái mà họ không còn cần uống máu nữa. Nghe có vẻ quá tốt để là thật, nhưng nếu có câu trả lời nào ngoài kia, chúng đáng để tìm kiếm."
 golconda_1_effects: "Ngươi sẽ biết được nơi ở của một người thầy có thể đưa ngươi vào con đường đúng đắn."
 golconda_1_tt: "Liệu bình yên nội tâm có khả thi?"
 golconda_1_planning_title: "Thấu Hiểu Kẻ Địch Bên Trong"
 golconda_1_planning_desc: "#beast Cơn Khát#! là điều mà mọi $pod_cainite$ học cách chịu đựng... hoặc thỏa mãn. Nó trở thành âm thanh nền. Một sự thật không thể thay đổi trong sự tồn tại của chúng ta.\n\nNhưng có phải nhất định phải như vậy?\n\nCác trinh sát của ta đã báo cho ta biết về một nơi ta có thể tìm thêm câu trả lời."
 golconda_1_planning_confirm: "$POD_journey_planning_confirm_default$"
 golconda_1_planning_decline: "$POD_journey_planning_decline_default$"
 golconda_1_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 golconda_1_travel_desc: "Hẳn phải có điều gì đó khó hiểu về những câu trả lời ta đang tìm kiếm. Chẳng phải mọi $pod_cainite$ đều tìm cách thoát khỏi [Glossary('Dã Thú','game_concept_beast_desc')]? Vậy tại sao lời giải cho vấn đề này lại không được biết đến rộng rãi hơn? Ta cho rằng mình sẽ sớm biết tại sao."
 golconda_1_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 
 golconda_2_name: "Giảng Hòa với Dã Thú của Ngươi"
 golconda_2_desc: "Giờ khi đã biết về con đường [golconda|E], ta phải đối mặt với nhiệm vụ khó khăn là đạt được hiểu biết sâu sắc về [Glossary('Dã Thú','game_concept_beast_desc')] của mình. Nhiều kẻ đi trước ta đã dành hàng thế kỷ cho nỗ lực như vậy, mà chẳng có gì để chứng minh ngoài sự thất vọng. Liệu ta có thể thành công nơi họ đã thất bại?"
 golconda_2_effects: "Ngươi sẽ đạt được [trait_level_track_xp|E] như một [GetTrait('golconda_seeker').GetName(GetPlayer)]. Ngươi cũng sẽ có được [trait|E] nếu chưa có.\n\nCàng có nhiều [trait_level_track_xp|E], cơ hội đạt được một bước tiến quan trọng của ngươi càng cao.\n\n#X Toàn bộ tiến triển trong [journey|E] này sẽ mất đi khi rơi vào Phẫn Cuồng, hoặc khi gây ra án giết người hoặc trộm cắp.#!"
 golconda_2_isvalid: "$EFFECT_LIST_BULLET$Ngươi không có [men_at_arms|E] nào được tạo ra qua các hành vi tàn ác #weak ([GetMaA('szlachta').GetName] hoặc [GetMaA('vozhd').GetName])#!"
 golconda_2_trigger: "Ngươi cần giải tán bất kỳ [men_at_arms|E] nào được tạo ra qua các hành vi tàn ác #weak ([GetMaA('szlachta').GetName] hoặc [GetMaA('vozhd').GetName])#!"
 golconda_2_tt: "Một cuộc hành trình ngàn bước."
 golconda_2_planning_title: "Suy Ngẫm về Kẻ Săn Mồi Bên Trong"
 golconda_2_planning_desc: "[Glossary('Dã Thú','game_concept_beast_desc')] vẫn luôn gặm nhấm nơi sâu thẳm tâm trí ta như thường lệ, và ta đã dành một khoảng thời gian dài quan sát nó và cố gắng đạt được hiểu biết sâu sắc hơn về hành vi của nó.\n\nTa cần chút thời gian tĩnh lặng để suy nghĩ thấu đáo hơn về những gì mình đã học được.\n\nĐiều này có khả năng sẽ gây ra ít nhiều [stress|E]."
 golconda_2_planning_confirm: "Ta đã sẵn sàng."
 golconda_2_planning_decline: "Ta nên suy ngẫm về điều này vào một lúc ít căng thẳng hơn."
# golconda_2_travel_title: ""
# golconda_2_travel_desc: ""
# golconda_2_travel_confirm: ""
 golconda_widget_desc: "Tiếp tục giảng hòa với [Glossary('Dã Thú','game_concept_beast_desc')] của ngươi?"
 golconda_widget_tt: "Ngươi sẽ ngay lập tức bắt đầu một [journey|E] khác để đạt được ngộ tính về [golconda|E].\nGiá: [piety_i|E] #V 1000#!"
 
 golconda_3_name: "Suspire"
 golconda_3_desc: "Mọi sự chuẩn bị của ta đã dẫn đến điều này. Ta sẽ đối đầu với [Glossary('Dã Thú','game_concept_beast_desc')], một lần và mãi mãi."
 golconda_3_effects: "Ngươi sẽ tiến vào những ngóc ngách sâu thẳm nhất của linh hồn mình cho cuộc đối đầu cuối cùng.\n\n#X Dựa trên [trait_level_track_xp|E] của ngươi như một [GetTrait('golconda_seeker').GetName(GetPlayer)], ngươi có #V [GetPlayer.MakeScope.ScriptValue('suspire_success_chance')]%#! cơ hội thoát ra với tâm trí còn nguyên vẹn.#!"
 golconda_3_tt: "Tất cả hoặc không gì cả."
 golconda_3_planning_title: "Đích Đến Cuối Cùng"
 golconda_3_planning_desc: "Ta biết điều mình phải làm. Ta sẽ để $pod_vitae$ tăng cường các giác quan của mình, không khác gì dùng [GetTrait('auspex').GetName(GetNullCharacter)]. Rồi ta sẽ gửi ý thức của mình vào trong, đến nơi [Glossary('Dã Thú','game_concept_beast_desc')] cư ngụ.\n\nĐiều ta không biết là điều gì đang chờ đợi ta.\n\nChỉ có một cách để biết được."
 golconda_3_planning_confirm: "Đến lúc phải liều một bước nhảy niềm tin."
 golconda_3_planning_decline: "Vẫn chưa đến lúc để nhảy."
