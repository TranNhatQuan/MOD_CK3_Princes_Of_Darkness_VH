 realm_mastery_actor_travel_confirm: "$POD_journey_travel_confirm_realm_mastery$"
 
 realm_mastery_fae_name: "Đạt được [GetTrait('realm_fae').GetName(GetNullCharacter)]"
 realm_mastery_fae_desc: "#TOOLTIP:GAME_TRAIT,realm_fae,[GetNullCharacter] #L Cõi Fae#!#! là [fae_realm|E] của siêu nhiên. Một $POD_splat_fae$ có hiểu biết kém về [fae_realm|E] này chỉ có thể thi triển [cantrips|E] lên người phàm. Cần phải tinh thông nếu muốn thi triển [cantrips|E] lên những thực thể quyền năng như $POD_splat_mummy_plural$ hay $POD_splat_demon_plural$."
 realm_mastery_fae_effects: "Ngươi sẽ đi đến một freehold và thỉnh cầu [Select_CString( DidShatteringHappen, 'Lost Ones', 'Nobles' )] ban cho ngươi hiểu biết về [fae_realm|E] #TOOLTIP:GAME_TRAIT,realm_fae,[GetNullCharacter] #L Fae#!#!. Nếu thành công, ngươi sẽ có được [trait|E] [GetTrait('realm_fae').GetName(GetNullCharacter)], cho phép mở khóa perk cuối cùng trong [lifestyle|E] #TOOLTIP:GAME_TRAIT,realm_fae,[GetNullCharacter] #L Fae#!#!."
 realm_mastery_fae_isvalid: "$EFFECT_LIST_BULLET$Ngươi có [perk|E] [GetPerk('realm_fae_4_perk').GetName(GetPlayer)]\n$realm_mastery_generic_isvalid$"
 realm_mastery_fae_tt: "Ngay cả Ác Ma cũng không cưỡng lại được ma thuật của ta."
 realm_mastery_fae_planning_title: "Cuộc Truy Tìm Tinh Thông Cõi Fae"
 realm_mastery_fae_planning_desc: "Dù ta đã cố gắng giải phóng trí tưởng tượng của mình, nó vẫn còn hạn chế ở một số khía cạnh.\n\nNếu muốn đạt được hiểu biết trọn vẹn về #TOOLTIP:GAME_TRAIT,realm_fae,[GetNullCharacter] #L Cõi Fae#!#!, ta sẽ cần tìm sự giúp đỡ từ [Select_CString( DidShatteringHappen, 'Lost Ones', 'Nobles' )] đã tinh thông nó.\n\nTa đã sẵn sàng biện luận cho trường hợp của mình tại một trong các freehold."
