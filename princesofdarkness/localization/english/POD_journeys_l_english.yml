 hunt_in_capital_name: "Săn Mồi Tại Kinh Đô"
 hunt_in_capital_desc: "Mọi $pod_cainite$ đều bị cơn khát máu thúc đẩy, và ta không khác gì. Lãnh địa [GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier] sẽ là bãi săn của ta trong những đêm sắp tới.\n\n#help (Ngươi cũng có thể săn một nhân vật cụ thể bằng cách nhấn chuột phải vào họ và chọn Săn Mồi qua [journey|E] bằng [character_interaction|E].)#!"
 #hunt_in_capital_effects: ""
 hunt_in_capital_tt: "Đã đến lúc làm dịu cơn khát của ta."
 hunt_in_capital_planning_title: "Trên Đường Săn"
 hunt_in_capital_planning_desc: "Một lần nữa đã đến lúc ta làm dịu cơn thèm khát trên những kẻ phàm nhân của [GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier].\n\nTa nên sắp xếp thời gian cho một chuyến săn khi rảnh rỗi hơn."
 hunt_in_capital_planning_desc_gui: "Lang thang trên những con đường của [GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier], ta tìm thấy một số kẻ phàm nhân gần đó dễ trở thành con mồi cho những mưu tính của ta.\n\nTa chỉ có thời gian để theo đuổi một trong số họ."
 hunt_in_capital_planning_confirm: "Tiếc là lúc này ta không thể đi săn."
 hunt_in_capital_planning_confirm_gui: "Ta sẽ săn [GetPlayer.MakeScope.Var('hunt_in_capital_selected_mortal').Char.GetFirstNameNoTooltip] và hút máu [GetPlayer.MakeScope.Var('hunt_in_capital_selected_mortal').Char.GetHerHis]."
 hunt_in_capital_planning_confirm_gui_tt: "$EFFECT_LIST_BULLET$Ngươi có thể quyết định làm gì với [GetPlayer.MakeScope.Var('hunt_in_capital_selected_mortal').Char.GetFirstNameNoTooltip] khi [GetPlayer.MakeScope.Var('hunt_in_capital_selected_mortal').Char.GetSheHe] đã nằm trong tay ngươi.\n$EFFECT_LIST_BULLET$[GetPlayer.MakeScope.Var('hunt_in_capital_selected_mortal').Char.GetFirstNameNoTooltip] sẽ ở lại triều đình ngươi sau đó.\n$EFFECT_LIST_BULLET$Ngươi sẽ không gặp lại những kẻ phàm nhân khác."
 hunt_in_capital_planning_restart: "Không lựa chọn nào trong số này hợp ý ta. Ta sẽ thử một chuyến săn khác."
 hunt_in_capital_planning_decline: "$POD_journey_planning_decline_default$"
 hunt_in_capital_planning_decline_gui: "Ta đã đổi ý. Từ bỏ chuyến săn."
 hunt_in_capital_planning_decline_tt: "[journey|E] của ngươi đến $POD_current_journey$ sẽ kết thúc."
 hunt_in_capital_planning_decline_tt_2: "Ngươi sẽ không gặp lại những kẻ phàm nhân này nữa."
 hunt_in_capital_widget_desc: "Tiếp tục săn tìm #bold [Localize(Concatenate( 'POD_find_mortals_interaction_', GetPlayer.MakeScope.Var('hunt_in_capital_selection').GetFlagKey ))]#!?"
 hunt_in_capital_widget_tt: "Ngươi sẽ lập tức bắt đầu một [journey|E] khác để săn tìm #bold [Localize(Concatenate( 'POD_find_mortals_interaction_', GetPlayer.MakeScope.Var('hunt_in_capital_selection').GetFlagKey ))]#! tại kinh đô của ngươi.\n[GetPlayer.Custom('PODShowJourneyCostHunt')]"
 cthonic_womb_widget_desc: "Biến [EventWindowWidget.GetScope.sC('victim').GetShortUINameNoTooltip] thành một [GetTrait('wraith').GetName(GetNullCharacter)] sau khi giết [EventWindowWidget.GetScope.sC('victim').GetHerHim]?"
 cthonic_womb_widget_tt: "#help Điều này chỉ hiệu quả nếu ngươi rút cạn máu nạn nhân hoàn toàn.#!"
 
 fera_training_name: "Luyện Tập Cùng [GetPlayer.Custom('PODCoterieNoTooltip')]"
 fera_training_desc: "Hơn cả những người bạn đơn thuần, các thành viên trong [GetPlayer.Custom('PODCoterieNoTooltip')] của ngươi là những kẻ sẽ luôn kề vai sát cánh trong những tình cảnh nguy khốn nhất. Ngươi phải chuẩn bị cho mọi thứ như một đội ngũ."
 fera_training_effects: "Ngươi sẽ xem lại [GetPlayer.Custom('PODCoterie')] của mình và quyết định tập trung vào hình thức luyện tập nào."
 fera_training_isvalid: "$EFFECT_LIST_BULLET$Ngươi cần có một [GetPlayer.Custom('PODCoterie')] với ít nhất #V 1#! thành viên khác."
 fera_training_tt: "[GetPlayer.GetFaith.HighGodName] đang cần những chiến binh mạnh mẽ."
 fera_training_planning_title: "Mài Vuốt Giũa Nanh"
 fera_training_planning_desc: "Các thành viên của $POD_player_coterie$ đã tìm được thời gian để tụ họp cho một buổi luyện tập khác.\n\nĐiều này sẽ giúp chúng ta phối hợp tốt hơn như một đội ngũ, và làm những việc mà [GetPlayer.GetFaith.HighGodName] cần chúng ta làm."
 fera_training_planning_confirm: "Chúng ta sẽ bắt đầu buổi luyện tập ngay!"
 fera_training_planning_decline: "$POD_journey_planning_decline_default$"
 fera_training_widget_desc: "Tiếp tục luyện tập cùng [GetPlayer.Custom('PODCoterie')] của ngươi?"
 fera_training_widget_tt: "Ngươi sẽ lập tức bắt đầu một [journey|E] khác để luyện tập cùng [GetPlayer.Custom('PODCoterie')] của ngươi."

 fera_spirit_quest_name: "Dấn Thân Vào Cuộc Truy Tầm Linh Hồn"
 fera_spirit_quest_desc: "Các linh hồn là những người thầy của thế giới $glossary_fera$, nhưng học được các ân tứ của họ phải trả giá. Một Cuộc Truy Tầm Linh Hồn sẽ đưa ngươi vào một hành trình đầy những cuộc chạm mặt khác nhau."
 fera_spirit_quest_effects: "Ngươi sẽ có thể chọn từ một danh sách phần thưởng vào cuối cuộc truy tầm của mình:\n$EFFECT_LIST_BULLET$$glossary_fera$ [lifestyle_experience|E]\n$EFFECT_LIST_BULLET$Bùa Chú [artifacts|El]\n$EFFECT_LIST_BULLET$[traits|E] Lối sống hoặc Danh Vọng\n$EFFECT_LIST_BULLET$Một [GetTrait('spirit').GetName(GetNullCharacter)] thân thiện\n\nNhững phần thưởng nào sẽ có, cùng với chất lượng hay số lượng của chúng, phụ thuộc vào độ khó của cuộc truy tầm ngươi chọn, [learning|E] của ngươi, và [piety_level|E]."
 fera_spirit_quest_tt: "Nghe theo lời khẩn cầu của họ, và học lấy sức mạnh của họ."
 fera_spirit_quest_planning_title: "Cuộc Truy Tầm Hoàn Tất"
 fera_spirit_quest_planning_desc: "Cuộc Truy Tầm Linh Hồn của ngươi đã đến hồi kết. Đã đến lúc giao tiếp với các Linh Hồn và nhận lấy phần thưởng của ngươi."
 fera_spirit_quest_planning_confirm: "Nhiệm vụ của ta đã hoàn tất."
 fera_spirit_quest_planning_decline: "$POD_journey_planning_decline_default$"


 mokole_mnesis_quest_name: "Hành Trình Qua Mnesis"
 mokole_mnesis_quest_desc: "Sức mạnh của các [GetTrait('mokole').GetName(GetNullCharacter)] cổ xưa đã bị lãng quên theo thời gian. Với sức mạnh của Mnesis, một Mokolé có thể lội ngược dòng sông thời gian qua ký ức của tổ tiên mình để tìm lại những sức mạnh đã bị lãng quên này."
 mokole_mnesis_quest_effects: "Ngươi sẽ nhận được [mnesis_lifestyle|E] [lifestyle_experience|E] vào cuối [journey|E]. Độ dài và độ khó của [journey|E] được quyết định bởi việc ngươi cố nhớ lại xa đến đâu trong quá khứ.\nLượng [lifestyle_experience|E] ngươi nhận được được quyết định bởi những yếu tố sau:\n$EFFECT_LIST_BULLET$[learning|E]\n$EFFECT_LIST_BULLET$[prestige_level|E]\n$EFFECT_LIST_BULLET$[piety_level|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level|E]\n$EFFECT_LIST_BULLET$[trait_level_track_xp|E] của [GetTrait('mokole').GetName(GetNullCharacter)]\n\nMột hiệu ứng tiêu cực sẽ được áp dụng trong suốt hành trình khi ngươi rơi vào một giấc ngủ sâu. Ngươi cũng có thể bị Những Kẻ Săn Mộng tấn công, những $POD_splat_spirit_plural$ cơ hội tìm cách hại ngươi."
 mokole_mnesis_quest_tt: "Dòng Sông Mnesis sâu thẳm."
 mokole_mnesis_quest_planning_title: "Ký Ức Được Khôi Phục"
 mokole_mnesis_quest_planning_desc: "Hành trình của ngươi qua những dòng sông Mnesis đã hoàn tất.\nNhiều ảo ảnh và ký ức vẫn còn bám lấy tâm trí ngươi, nhưng ngươi đã học được gì?"
 mokole_mnesis_quest_planning_confirm: "Giờ ta đã nhớ ra."
 mokole_mnesis_quest_planning_decline: "$POD_journey_planning_decline_default$"

 
