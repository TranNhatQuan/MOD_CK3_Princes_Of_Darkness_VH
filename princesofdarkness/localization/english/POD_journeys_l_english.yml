 pilgrimage_to_enoch_planning_desc: "Sự chuẩn bị của ngươi đã hoàn tất. Các nghi lễ đã được tiến hành, các lễ vật đã được dâng, và con đường xuyên qua Shroud đã được vạch ra hết mức mà một sinh thể còn sống có thể làm được.\n\nThành phố ma Enoch đang chờ đợi trong lòng sâu của Âm Giới."
