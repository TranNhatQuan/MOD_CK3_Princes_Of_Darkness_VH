 seek_knowledge_rift_name: "Học Dị năng Hiếm ([GetTrait('rift').GetName(GetNullCharacter)])"
 seek_knowledge_rift_desc: "[GetTrait('rift').GetName(GetNullCharacter)] là một $pod_discipline$ đáng sợ được [GetTrait('kizoku').GetName( GetNullCharacter )] tu luyện. Nó cho phép người dùng tạo ra những kẽ nứt chiều không gian dẫn đến những ác mộng riêng của họ, thường theo cách gây bất hạnh lớn cho kẻ khác nhưng cũng có mục đích vô hại như giao tiếp bằng thần giao cách cảm và vận chuyển."
