 seek_knowledge_melpominee_effects: "Ngươi sẽ biết được nơi ở của một người thầy thông thạo [GetTrait('melpominee').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể đạt được [trait|E] $pod_discipline$ này, cho phép ngươi mở khóa [perks|E] trong [lifestyle|E] [GetTrait('melpominee').GetName(GetNullCharacter)]."
