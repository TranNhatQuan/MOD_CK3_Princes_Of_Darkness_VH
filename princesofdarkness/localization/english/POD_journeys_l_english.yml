 seek_knowledge_dementation_name: "Học Dị năng Hiếm ([GetTrait('dementation').GetName(GetNullCharacter)])"
 seek_knowledge_dementation_desc: "[GetTrait('dementation').GetName(GetNullCharacter)] là một $pod_discipline$ khét tiếng được [GetTrait('malkavian').GetName(GetNullCharacter)] $pod_clan$ tu luyện. Nó cho phép người luyện gieo rắc điên loạn lên đối phương, dẫn đến các hiệu ứng như [GetModifier('silence_the_sane_mind_perk_modifier').GetNameWithTooltip] hoặc [GetModifier('the_haunting_perk_modifier').GetNameWithTooltip]."
 seek_knowledge_dementation_effects: "Ngươi sẽ biết được nơi ở của một người thầy thông thạo [GetTrait('dementation').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể đạt được [trait|E] $pod_discipline$ này, cho phép ngươi mở khóa [perks|E] trong [lifestyle|E] [GetTrait('dementation').GetName(GetNullCharacter)]."
 seek_knowledge_dementation_tt: "Ngay cả tâm trí của họ cũng sẽ không được an toàn."
 seek_knowledge_dementation_planning_title: "Cuộc Tìm Kiếm Dementation"
 seek_knowledge_dementation_planning_desc: "Ta đã khuấy động huyết mạch và chuẩn bị bản thân hết mức có thể, nhưng những điểm tinh tế của [GetTrait('dementation').GetName(GetNullCharacter)] vẫn còn vượt khỏi tầm hiểu của ta.\n\nNếu ta muốn tinh thông $pod_discipline$ này đến cùng, ta sẽ cần một người thầy.\n\nMay sao, các trinh sát của ta đã cho ta biết nơi có thể tìm thấy một người như vậy."
