 seek_knowledge_koldunic_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_koldunic_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_koldunic_travel_desc: "Koldunic Sorcery tương tự Thaumaturgy về ý tưởng nhưng rất khác biệt trong thực hành. Những khác biệt chính bao gồm việc Koldunic Sorcery cần đến sự phục vụ của các linh hồn thiên nhiên thay vì các nghi thức và lễ nghi ghi nhớ sẵn, Koldunism có xu hướng tinh tế hơn Thaumaturgy nhiều ở các cấp độ thấp, và Koldunism đòi hỏi không hẳn là một sự nối dài của ý chí mà là việc trở thành người làm chủ chính thứ vật chất mà một Fiend muốn khống chế."
 seek_knowledge_koldunic_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_koldunic_isvalid: "$POD_seek_knowledge_intro$\n$BULLET_WITH_TAB$$POD_seek_knowledge_learning_25$\n$BULLET_WITH_TAB$[capital|E] của ngươi nằm ở [GetGeographicalRegion('world_europe_east').GetName]\n$BULLET_WITH_TAB$Ngươi là một [GetTrait('overseer').GetName(GetPlayer)] với [GetTrait('bloodsorceryadvanced').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$$POD_seek_knowledge_relation$\n$BULLET_WITH_TAB$$POD_seek_knowledge_game_rule$"


 seek_knowledge_sihr_name: "Học [GetTrait('bloodsorcery').GetName(GetNullCharacter)] (Sihr)"
 seek_knowledge_sihr_desc: "Hình thức huyết thuật này được số ít pháp sư [Glossary('Ashirra','game_concept_ashirra_desc')] tu luyện, bắt nguồn từ Mutasharid([GetTrait('nosferatu').GetName(GetNullCharacter)]) Tarique al-Hajji vào thế kỷ thứ chín. Tarique đã thiết lập liên hệ với [GetTrait('assamite').GetName(GetNullCharacter)], trong đó có Khalid al-Munir, một thành viên nổi bật của đẳng cấp pháp sư thuộc clan đó. Cùng nhau họ đã phát triển các con đường của Sihr, sức mạnh của nó bắt nguồn từ đức tin của người thi triển không kém gì từ quyền năng của huyết mạch họ.\n\nTrong khi Thaumaturgy và các hình thức huyết thuật khác bị xem là báng bổ trong Hồi giáo (vì chúng tìm đến một quyền năng khác ngoài Thượng Đế để trợ giúp ai đó), nhiều người thi triển Sihr tin rằng quyền năng của Sihr chỉ đến từ Thượng Đế. Việc thi triển pháp thuật thường dựa vào những lời cầu nguyện được dùng như câu chú."
 seek_knowledge_sihr_effects: "Ngươi sẽ biết được nơi ở của một người thầy thông hiểu [GetTrait('bloodsorcery').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể lĩnh hội Dị năng $pod_discipline$ [trait|E]. Nó không chỉ cho phép ngươi mở khóa các [perks|E] trong [lifestyle|E] [GetTrait('bloodsorcery').GetName(GetNullCharacter)], mà còn mở khóa [character_interaction|E] [bloodsorcery|E], cho phép ngươi thi triển nhiều loại pháp thuật có lợi và có hại.\n\n#warning Học Sihr nghĩa là ngươi sẽ không bao giờ có thể học Thaumaturgy.#!"
 seek_knowledge_sihr_tt: "Ta sẽ mở khóa những bí mật sâu xa nhất của vitae." 
 seek_knowledge_sihr_planning_title: "Cuộc Tìm Kiếm Sihr"
 seek_knowledge_sihr_planning_desc: "Ta đã khuấy động huyết mạch và chuẩn bị bản thân hết mức có thể, nhưng những điểm tinh tế của [GetTrait('bloodsorcery').GetName(GetNullCharacter)] vẫn còn vượt khỏi tầm hiểu biết của ta.\n\nNếu ta muốn tinh thông Dị năng $pod_discipline$ này trọn vẹn, ta sẽ cần một người thầy.\n\nMay sao, các trinh sát của ta đã báo cho ta biết nơi có thể tìm được một người như vậy."
 seek_knowledge_sihr_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_sihr_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_sihr_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_sihr_travel_desc:  "Khác với các con đường huyết thuật khác, Sihr chủ yếu được thi triển qua cầu nguyện thay vì câu chú và biểu tượng huyền bí. Nhiều pháp thuật và nghi lễ đòi hỏi sự cầu nguyện và tập trung mãnh liệt từ người thi triển, và do đó chỉ những ai thực sự tận tâm mới có thể thành công khi sử dụng chúng."
 seek_knowledge_sihr_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_sihr_isvalid: "$EFFECT_LIST_BULLET$Chỉ những ma cà rồng theo [faith|El] [GetReligionByKey('ashirra_religion').GetName] hoặc [GetFaithByKey('tariqelhaqim').GetName] mới có thể học Sihr"


 seek_knowledge_abyssal_mysticism_name: "Học [GetTrait('obtenebration').GetName(GetNullCharacter)] (Abyssal Mysticism)"
 seek_knowledge_abyssal_mysticism_desc:  "Đắm mình trong việc nghiên cứu bất tận một sức mạnh vượt lên và cuối cùng đối nghịch với mọi ánh sáng và sự sống, các Abyss Mystic ít màng đến nhân tính hay các chuẩn mực đúng sai của người phàm.\nCác nhà huyền bí của Clan Lasombra dò xét vào những nơi tăm tối để tìm kiếm bí mật, câu trả lời, và có lẽ còn nhiều câu hỏi hơn nữa. Đối với những linh hồn khao khát này, Obtenebration thông thường chỉ là khởi đầu. Bằng cách áp dụng các nguyên lý thaumaturgic vào Obtenebration, các nhà huyền bí Lasombra thời Dark Ages đã phát triển các nghi lễ để mở khóa những quyền năng ẩn giấu của bóng tối và triệu gọi những nỗi khủng khiếp nguyên thủy không tên của Abyss, từ đó biến Obtenebration thành một hình thức huyết thuật."
 seek_knowledge_abyssal_mysticism_effects: "Ngươi sẽ biết được nơi ở của một người thầy thông hiểu Abyssal Mysticism. Sau khi đến đó, ngươi có thể lĩnh hội Dị năng $pod_discipline$ [trait|E]. Nó không chỉ cho phép ngươi mở khóa các [perks|E] trong [lifestyle|E] [GetTrait('bloodsorcery').GetName(GetNullCharacter)], mà còn mở khóa [character_interaction|E] [bloodsorcery|E], cho phép ngươi thi triển nhiều loại pháp thuật có lợi và có hại."
 seek_knowledge_abyssal_mysticism_tt: "Ta sẽ mở khóa những bí mật sâu xa nhất của vitae." 
 seek_knowledge_abyssal_mysticism_planning_title: "Cuộc Tìm Kiếm Abyssal Mysticism"
 seek_knowledge_abyssal_mysticism_planning_desc: "Ta đã khuấy động huyết mạch và chuẩn bị bản thân hết mức có thể, nhưng những điểm tinh tế của Abyssal Mysticism vẫn còn vượt khỏi tầm hiểu biết của ta.\n\nNếu ta muốn tinh thông Dị năng $pod_discipline$ này trọn vẹn, ta sẽ cần một người thầy.\n\nMay sao, các trinh sát của ta đã báo cho ta biết nơi có thể tìm được một người như vậy."
 seek_knowledge_abyssal_mysticism_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_abyssal_mysticism_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_abyssal_mysticism_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_abyssal_mysticism_travel_desc: "Pháp thuật Abyssal triệu gọi các linh hồn từ một chiều không gian khác, một nơi giống như một dạng ngục luyện tối tăm. Những người thi triển này khuất phục và điều khiển các linh hồn, nhưng những linh hồn đó không giống bất cứ điều gì khác trong tạo hóa, và có vẻ không có chút ký ức hay liên hệ nào với các thực thể ác quỷ thực sự."
 seek_knowledge_abyssal_mysticism_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_abyssal_mysticism_isvalid: "$POD_seek_knowledge_intro$\n$BULLET_WITH_TAB$$POD_seek_knowledge_learning_25$\n$BULLET_WITH_TAB$Ngươi có [GetTrait('bloodsorceryadvanced').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$$POD_seek_knowledge_relation$\n$BULLET_WITH_TAB$$POD_seek_knowledge_game_rule$"

