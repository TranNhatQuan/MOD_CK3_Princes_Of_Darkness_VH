 seek_knowledge_giovanni_effects: "Ngươi sẽ biết được nơi ở của một người thầy thông thạo [GetTrait('necromancy').GetName(GetNullCharacter)] của Giovanni. Sau khi đến đó, ngươi có thể học các kỹ thuật bí mật của họ. Nếu ngươi chưa có [trait|E] [GetTrait('necromancy').GetName(GetNullCharacter)], ngươi cũng sẽ đạt được [trait|E] $pod_discipline$ này, cho phép ngươi mở khóa [perks|E] trong [lifestyle|E] [GetTrait('necromancy').GetName(GetNullCharacter)]."
