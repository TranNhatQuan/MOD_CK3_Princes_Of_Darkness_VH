 seek_knowledge_celerity_travel_desc: "Ta thật hào hứng khi có cơ hội học [GetTrait('celerity').GetName(GetNullCharacter)]. Kẻ thù của ta sẽ không thể chạy thoát khỏi ta lâu hơn nữa."
 seek_knowledge_celerity_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 
 seek_knowledge_dominate_name: "Học Dị Năng ([GetTrait('dominate').GetName(GetNullCharacter)])"
 seek_knowledge_dominate_desc: "[GetTrait('dominate').GetName(GetNullCharacter)] là $pod_discipline$ Khống Chế Tâm Trí. Nó cho phép người dùng [GetPerk('mesmerize_perk').GetName(GetPlayer)] người khác và ra lệnh mà buộc phải tuân theo. Nó cũng có thể che đậy các vi phạm [the_masquerade|E] thông qua [GetPerk('the_forgetful_mind_perk').GetName(GetPlayer)]."
 seek_knowledge_dominate_effects: "Ngươi sẽ biết được nơi ở của một người thầy am hiểu [GetTrait('dominate').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể chiếm lấy $pod_discipline$ [trait|E], nhờ đó mở khóa [perks|E] trong [lifestyle|E] [GetTrait('dominate').GetName(GetNullCharacter)]."
 seek_knowledge_dominate_tt: "Ta sẽ khiến chúng phải khuất phục theo ý ta."
 seek_knowledge_dominate_planning_title: "Cuộc Tìm Kiếm Dominate"
