 azhi_dahaka_1_name: "Con Đường Của Rồng"
 azhi_dahaka_1_desc: "Azhi Dahaka trong tiếng Ba Tư nghĩa là con rồng ba đầu của ác quỷ Ahriman. Đối với [GetTrait('tzimisce').GetName(GetNullCharacter)], đó là Chén Thánh của Metamorphosist, một trạng thái giác ngộ và tối thượng của sự tồn tại, đạt được nhờ sử dụng [GetTrait('vicissitude').GetName(GetPlayer)] một cách rộng rãi.\n\nCác nghiên cứu của ngươi đã xác nhận ấn tượng đầu tiên của ngươi, không chỉ có một con đường đến Azhi Dahaka mà có nhiều. Ngươi sẽ phải tự khai mở con đường của mình qua nghiên cứu nghiêm ngặt và thực nghiệm rộng rãi."
 azhi_dahaka_1_effects: "Ngươi sẽ nhận [trait_level_track_xp|E] trong [GetTrait('azhi_dahaka_scholar').GetName(GetPlayer)] vào cuối [journey|E]. Lượng [trait_level_track_xp|E] nhận được tăng theo [learning|E] và [Glossary('Generation','game_concept_vampgeneration_desc')] của ngươi."
 azhi_dahaka_1_tt: "Sự Biến Đổi Vĩnh Cửu."
 azhi_dahaka_1_planning_title: "Con Đường Của Rồng"
 azhi_dahaka_1_planning_desc: "Ta chỉ có thể dành một khoảng thời gian nhất định cho việc theo đuổi Azhi Dahaka, sự trì trệ sẽ không bao giờ là con đường tiến lên. Ta cần đánh giá lại tiến trình hiện tại của mình từ một góc nhìn khác."
 azhi_dahaka_1_planning_confirm: "$POD_journey_planning_confirm_default$"
 azhi_dahaka_1_planning_decline: "$POD_journey_planning_decline_default$"
 azhi_dahaka_1_travel_title: "Con Đường Của Rồng"
 azhi_dahaka_1_travel_desc: "Nhiều năm theo đuổi một mối manh duy nhất, nhưng nó có dẫn đến Rồng không?"
 azhi_dahaka_1_travel_confirm: "Biến đổi là điều hằng cửu."
 azhi_dahaka_widget_tt: "Ngươi sẽ lập tức bắt đầu một [journey|E] khác để có thêm hiểu biết về Azhi Dahaka\nGiá: [piety_i|E] #V 1000#!"
 azhi_dahaka_widget_desc: "Tiếp tục theo đuổi sự hoàn hảo?"
 azhi_dahaka_not_enough_piety: "Ngươi không có đủ [piety_i|E] để bắt đầu một [journey|E] khác"


 azhi_dahaka_2_name: "Nghi Lễ Thăng Hoa"
 azhi_dahaka_2_desc: "Azhi Dahaka không phải một Niết Bàn nơi Metamorphosist đạt đến sự hợp nhất với vũ trụ, mà ngược lại — trải qua Metamorphosis là hoàn toàn tách mình khỏi Tạo Hóa, để trở thành một ý chí tự tại trong một vũ trụ không còn quyền năng nào chi phối được bản ngã.\nMột số kẻ tin như vậy, dù sao thì. Metamorphosis là một cuộc theo đuổi cô độc. Ngươi sẽ thực sự đạt được nó chăng? Hay ngươi sẽ chỉ đánh mất bản thân trong một cơn lốc biến đổi vĩnh cửu?\nĐể trở thành Rồng của Sự Biến Đổi Vĩnh Cửu, ta phải tái tạo lại bản thân cả về thể xác và tâm trí. Ngươi đã chuẩn bị nghi lễ vĩ đại nhất để đạt được điều này."
 azhi_dahaka_2_effects: "Ngươi sẽ trở thành #TOOLTIP:GAME_TRAIT,azhi_dahaka,[GetNullCharacter] #L Rồng của Sự Biến Đổi Vĩnh Cửu#!#!."
 azhi_dahaka_2_tt: "Con rồng nguyên thủy gầm vang."
 azhi_dahaka_2_planning_title: "Nghi Lễ Thăng Hoa"
 azhi_dahaka_2_planning_desc: "Nghi lễ đã sẵn sàng. Đã đến lúc bước tới và tìm ra trái tim đang đập của con rồng, nơi hỗn mang và vĩnh cửu gặp nhau... rồi uống từ đó."
 azhi_dahaka_2_planning_confirm: "$POD_journey_planning_confirm_default$"
 azhi_dahaka_2_planning_decline: "$POD_journey_planning_decline_default$"
 azhi_dahaka_2_travel_title: "Nghi Lễ Thăng Hoa"
 azhi_dahaka_2_travel_desc: "Ta đang ở tâm điểm của cơn lốc này."
 azhi_dahaka_2_travel_confirm: "Con rồng đang đợi ta."

 hunt_for_sargon_codex_shard_name: "Săn Tìm Các Mảnh Vỡ Của Sargon Codex"
 hunt_for_sargon_codex_shard_desc: "Sargon Codex là một tấm bảng đất sét được Cappadocius viết trong những năm còn là người phàm. Sau $pod_Embrace$ của ông, việc mất đi Avatar đã gây ra hỗn loạn và tàn phá trong ký ức của ông. Ông không thể nhớ mình đã viết gì hay đã để nó ở đâu. Sau hàng nghìn năm, Sargon Codex đã bị hủy hoại và các phần của nó bị phân tán khắp thế giới. Nếu có ai phục hồi được nó, quyền năng vô biên sẽ chờ đợi họ."
 hunt_for_sargon_codex_shard_effects: "Ngươi sẽ bắt đầu thu thập thông tin về những địa điểm khả dĩ của các mảnh vỡ Sargon Codex."
 hunt_for_sargon_codex_shard_tt: "Kiệt tác của một học giả vô song."
 hunt_for_sargon_codex_shard_isvalid: "$EFFECT_LIST_BULLET$Vẫn còn những mảnh vỡ chưa được tìm ra."
 hunt_for_sargon_codex_shard_planning_title: "Một Mảnh Vỡ Đã Được Tìm Ra"
 hunt_for_sargon_codex_shard_planning_desc: "Các trinh sát của ta cuối cùng đã trở về báo tin tốt: vị trí đại khái của một trong các mảnh của Sargon Codex.\n\nGiờ khi ta đã biết phải đi đâu, ta có thể giải thoát nó.\n\nBằng vũ lực, nếu cần thiết."
 hunt_for_sargon_codex_shard_planning_confirm: "$POD_journey_planning_confirm_default$"
 hunt_for_sargon_codex_shard_planning_decline: "$POD_journey_planning_decline_default$"
 hunt_for_sargon_codex_shard_travel_title: "Trên Đường Săn Tìm Tri Thức"
 hunt_for_sargon_codex_shard_travel_desc: "Sargon Codex đã bị phân tán theo bốn phương từ lâu. Việc tập hợp lại tất cả các mảnh sẽ là một công việc vô cùng gian nan. Nhưng đối với một người tìm kiếm tri thức, phần thưởng ở cuối con đường khiến mọi công sức đều xứng đáng."
 hunt_for_sargon_codex_shard_travel_confirm: "Cappadocius chắc chắn sẽ ban phước cho nỗ lực này."


