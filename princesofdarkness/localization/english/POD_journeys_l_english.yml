 demon_temp_journey_travel_desc: "Khi chấp nhận tội lỗi, [PlayerJourneyTarget.GetFirstName] sẽ được cứu rỗi. Khi phủ phục [PlayerJourneyTarget.GetHerselfHimself] trước ta, [PlayerJourneyTarget.GetSheHe] sẽ nhận lấy vị trí xứng đáng của [PlayerJourneyTarget.GetHerHis] trên thế gian."
