 seek_knowledge_chimerstry_name: "Học Dị Năng Hiếm ([GetTrait('chimerstry').GetName(GetNullCharacter)])"
 seek_knowledge_chimerstry_desc: "[GetTrait('chimerstry').GetName(GetNullCharacter)] là $pod_discipline$ Ảo Ảnh, được $pod_clan$ [GetTrait('ravnos').GetName(GetNullCharacter)] tu luyện. Nó mang lại nhiều lợi ích liên quan đến [schemes|E] và cho phép gây [GetPerk('horrid_reality_perk').GetName(GetPlayer)] lên đối phương trong chiến tranh."
 seek_knowledge_chimerstry_effects: "Ngươi sẽ biết được nơi ở của một người thầy am hiểu [GetTrait('chimerstry').GetName(GetNullCharacter)]. Sau khi đến đó, ngươi có thể chiếm lấy $pod_discipline$ [trait|E], nhờ đó mở khóa [perks|E] trong [lifestyle|E] [GetTrait('chimerstry').GetName(GetNullCharacter)]."
 seek_knowledge_chimerstry_tt: "Chúng sẽ không còn biết đâu là thật nữa."
 seek_knowledge_chimerstry_planning_title: "Cuộc Tìm Kiếm Chimerstry"
 seek_knowledge_chimerstry_planning_desc: "Ta đã khơi dậy huyết mạch và chuẩn bị bản thân hết mức có thể, nhưng những điểm tinh tế của [GetTrait('chimerstry').GetName(GetNullCharacter)] vẫn còn vượt khỏi tầm hiểu biết của ta.\n\nNếu ta muốn tinh thông $pod_discipline$ này hoàn toàn, ta sẽ cần một người thầy.\n\nMay sao, các trinh sát của ta đã cho biết nơi có thể tìm được một người như vậy."
 seek_knowledge_chimerstry_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_chimerstry_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_chimerstry_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_chimerstry_travel_desc: "Ta thật hào hứng khi có cơ hội học [GetTrait('chimerstry').GetName(GetNullCharacter)]. Với $pod_discipline$ này, ta sẽ có thể thực hiện mọi loại xảo thuật... bất kể những xảo thuật đó vô hại, hay tàn nhẫn."
