 realm_mastery_name: "Tinh Thông các Cõi"
 realm_mastery_desc: "Chọn một Cõi để tinh thông."
 realm_mastery_tt: "Đẩy Glamour tới giới hạn của nó."
 realm_mastery_requirement_date: "Ngươi bắt đầu ở một bookmark nơi [splat|E] $POD_splat_fae$ không khả dụng"
 realm_mastery_generic_isvalid: "$EFFECT_LIST_BULLET$Ngươi phải ở trong một thế giới nơi $POD_splat_fae$ là một trong các [splats|E] khả dụng."
 realm_mastery_generic_travel_desc: "Ta đã củng cố hiểu biết về nghi thức cung đình và chuẩn bị những món quà lộng lẫy cho [Select_CString( DidShatteringHappen, 'Lost Ones', 'Nobles' )] của [PlayerJourneyDestination.GetHolding.GetCurrentSpecialBuildingType.GetName]. Ta hy vọng thế là đủ, biết rằng họ có thể đổi ý bất chừng."

 realm_mastery_actor_name: "Đạt được [GetTrait('realm_actor').GetName(GetNullCharacter)]"
 realm_mastery_actor_desc: "#TOOLTIP:GAME_TRAIT,realm_actor,[GetNullCharacter] #L Cõi Diễn Viên#!#! là [fae_realm|E] của những người quen biết. Một $POD_splat_fae$ có hiểu biết kém về [fae_realm|E] này chỉ có thể thi triển [cantrips|E] lên những nhân vật họ biết rất rõ. Cần phải tinh thông nếu muốn thi triển [cantrips|E] lên những kẻ thù bị căm ghét."
 realm_mastery_actor_effects: "Ngươi sẽ đi đến một freehold và thỉnh cầu [Select_CString( DidShatteringHappen, 'Lost Ones', 'Nobles' )] ban cho ngươi hiểu biết về [fae_realm|E] #TOOLTIP:GAME_TRAIT,realm_actor,[GetNullCharacter] #L Diễn Viên#!#!. Nếu thành công, ngươi sẽ có được [trait|E] [GetTrait('realm_actor').GetName(GetNullCharacter)], cho phép mở khóa perk cuối cùng trong [lifestyle|E] #TOOLTIP:GAME_TRAIT,realm_actor,[GetNullCharacter] #L Diễn Viên#!#!."
 realm_mastery_actor_isvalid: "$EFFECT_LIST_BULLET$Ngươi có [perk|E] [GetPerk('realm_actor_4_perk').GetName(GetPlayer)]\n$realm_mastery_generic_isvalid$"
 realm_mastery_actor_tt: "Ta sẽ bỏ bùa những kẻ đối nghịch với ta."
 realm_mastery_actor_planning_title: "Cuộc Truy Tìm Tinh Thông Cõi Diễn Viên"
 realm_mastery_actor_planning_desc: "Dù ta đã cố gắng giải phóng trí tưởng tượng của mình, nó vẫn còn hạn chế ở một số khía cạnh.\n\nNếu muốn đạt được hiểu biết trọn vẹn về #TOOLTIP:GAME_TRAIT,realm_actor,[GetNullCharacter] #L Cõi Diễn Viên#!#!, ta sẽ cần tìm sự giúp đỡ từ [Select_CString( DidShatteringHappen, 'Lost Ones', 'Nobles' )] đã tinh thông nó.\n\nTa đã sẵn sàng biện luận cho trường hợp của mình tại một trong các freehold."
