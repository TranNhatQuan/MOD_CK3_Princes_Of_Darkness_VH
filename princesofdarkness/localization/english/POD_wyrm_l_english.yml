 POD_wyrm.1.t: "Giao Tiếp cùng Viên Hồng Ngọc"
 POD_wyrm.1.desc: "Tiếng ngân của Viên Hồng Ngọc Linh Hồn tăng dần khi bạn rót năng lượng vào nó. Chẳng mấy chốc giọng nói của Black Spiral Dancer xâm nhập vào tâm trí bạn, hỏi bạn muốn đổi lấy gì cho tất cả năng lượng đó. Dù bạn chắc rằng linh hồn ấy trân trọng nguồn năng lượng, nó nghe có vẻ bực bội với hoàn cảnh hiện tại của mình."
 POD_wyrm.1.option.a: "Hãy cho ta sức mạnh!"
 POD_wyrm.1.option.b: "Hãy dạy ta [ancestral_tongue|E] của ngươi."
 POD_wyrm.1.option.c: "Hãy ban phước cho ta bằng sức mạnh của $glossary_wyrm$!"
 POD_wyrm.1.option.d: "Hãy kể thêm cho ta về viên hồng ngọc này."
 POD_wyrm.1.option.e: "Lúc này thì không có gì."

 POD_wyrm.101.t: "Bị Wyrm Mê Hoặc"
 POD_wyrm.101.desc: "Từ khoảnh khắc bạn có thể hiểu được thế giới, bạn đã được dạy về cái ác chính là $glossary_wyrm$. Ngày qua ngày bạn được bảo phải chiến đấu chống lại tay sai của nó, đề phòng các sứ giả của nó, và kháng cự ảnh hưởng của nó.\nCó vẻ như bạn đã thất bại một cách ngoạn mục.\n\n#I Những kẻ ngu ngốc đó đã sai. $glossary_wyrm$ mới là chân lý, và đôi mắt bạn cuối cùng đã được mở ra.#!"
 POD_wyrm.101.option.a: "Ta phụng sự Kẻ Bóng Tối..."


 temple_obscura_rooms_intro: "Temple Obscura là một ngôi đền khổng lồ làm từ đá cẩm thạch đen vân xanh. Bên ngoài là một mớ hỗn tạp kỳ dị và chói tai gồm những biểu tượng méo mó, quái dị cùng những phù điêu tượng trưng cho đau đớn và sự thoái hóa. Bên trong đền, ánh sáng phát ra từ những đốm balefire nhỏ gắn trên các giá đèn sống làm từ cánh tay bị chặt của tù nhân, cùng ánh sáng xanh lục mờ ảo từ những ô cửa kính màu trên trần. Bản thân ngôi đền gồm chín căn phòng, xếp nối tiếp nhau. Mỗi phòng chứa những bức tượng và bích họa liên quan đến những cực hình và thử thách đang chờ đợi bất kỳ ai dám bước vào. Một số trở ra còn tương đối tỉnh táo; nhiều kẻ vẫn còn hoạt động được phần lớn. Không ai trở ra còn nguyên vẹn lý trí."

 POD_wyrm.501.t: "Căn Phòng của Những Thất Bại Cá Nhân"
 POD_wyrm.501.desc: "$temple_obscura_rooms_intro$\n\nCăn phòng đầu tiên của ngôi đền hiện ra trước mặt bạn. Những ảo ảnh về quá khứ của bạn tràn ngập tâm trí ngay khi bạn bước vào. Bạn nhớ lại từng thất bại, từng quyết định sai lầm, và từng hậu quả từ những hành động trong quá khứ. Gốc rễ của trầm cảm bắt đầu bén rễ, nhưng bạn phải kháng cự."
 POD_wyrm.501.option.a: "Những ký ức ta cố quên đi..."
 POD_wyrm.501.option.b: "Sự yếu đuối phải bị thanh trừng."

 POD_wyrm.502.t: "Căn Phòng của Cơn Thịnh Nộ"
 POD_wyrm.502.desc: "$temple_obscura_rooms_intro$\n\nKhi bước vào căn phòng thứ hai, bạn cảm thấy bị cơn thịnh nộ chế ngự. Dù đó là của chính bạn hay là những lời thì thầm của $glossary_wyrm$, bạn không thể nói chắc. Bạn không hiểu tại sao mình ở đây, hay tại sao mình tức giận, chỉ biết rằng mình phải hủy diệt."
 POD_wyrm.502.option.a: "Ta phải đập vỡ thứ gì đó!"
 POD_wyrm.502.option.list1: "Bạn đấm vào một trong những cây cột bằng tay không"
 POD_wyrm.502.option.list2: "Bạn tấn công một lò than [balefire|E]"

 POD_wyrm.503.t: "Căn Phòng của Nỗi Đau Khổ"
 POD_wyrm.503.desc: "$temple_obscura_rooms_intro$\n\nCơn đau chạy khắp cơ thể bạn khi bạn bước vào căn phòng thứ ba. Khi thân xác bạn chịu đựng cuộc tấn công, tâm trí bạn một lần nữa tràn ngập những ảo ảnh về thất bại trong quá khứ. Chỉ có điều lần này những ảo ảnh tiết lộ cho bạn rằng $glossary_wyrm$ chính là sự cứu rỗi của bạn, chỉ thông qua nó bạn mới có thể đạt được chiến thắng."
 POD_wyrm.503.option.a: "Những ảo ảnh này cho ta sự thấu hiểu."
 POD_wyrm.503.option.b: "Ta thề nguyện phụng sự $glossary_wyrm$ vĩ đại."
 POD_wyrm.503.option.c: "$glossary_wyrm$ đã ban phước cho ta!"

 POD_wyrm.504.t: "Căn Phòng của Sự Xảo Quyệt"
 POD_wyrm.504.desc: "$temple_obscura_rooms_intro$\n\nBạn thấy một Tà Linh đang chờ đợi bạn trong căn phòng thứ tư. Tà Linh này đặc biệt tinh ranh và bạn phải đánh bại nó trong một cuộc đấu trí trước khi nó cho phép bạn tiếp tục."
 POD_wyrm.504.option.a: "Trí tuệ của ta đấu với ngươi."
 POD_wyrm.504.option.b: "Chân lý là một lời dối trá."
 POD_wyrm.504.option.list1: "Chiến thắng áp đảo"
 POD_wyrm.504.option.list2: "Chiến thắng sát nút"

 POD_wyrm.505.t: "Căn Phòng của Trận Chiến"
 POD_wyrm.505.desc: "$temple_obscura_rooms_intro$\n\nÂm thanh của trận chiến vọng đến tai bạn trước khi bạn kịp bước vào căn phòng thứ năm. Một đạo quân gồm Tà Linh, Fomori, và những tôi tớ khác của $glossary_wyrm$ đứng trước mặt bạn. Rõ ràng bạn phải làm gì."
 POD_wyrm.505.option.a: "Xông vào chiến trận!"

 POD_wyrm.506.t: "Căn Phòng của Sự Ô Uế"
 POD_wyrm.506.desc: "$temple_obscura_rooms_intro$\n\nTừ khoảnh khắc bạn bước vào căn phòng thứ sáu, một làn sóng ô uế tràn ngập lấy bạn. Giác quan bạn bị dội bom bởi ác ý thuần khiết, thân xác bạn dần được lấp đầy bởi năng lượng bóng tối. $glossary_wyrm$ ban cho bạn món quà của nó, giờ đây bạn chỉ cần sống sót."
 POD_wyrm.506.option.a: "Sức mạnh áp đảo..."

 POD_wyrm.507.t: "Căn Phòng của Lòng Trung Thành"
 POD_wyrm.507.desc: "$temple_obscura_rooms_intro$\n\nCăn phòng thứ bảy không có thử thách, câu đố, hay kẻ thù cầu kỳ nào. Chỉ có một tấm biển duy nhất đứng giữa phòng.\nHãy chứng minh lòng trung thành của bạn với $glossary_wyrm$ bằng một sự hy sinh lớn lao.\nGiờ thì, bạn sẽ dâng hiến điều gì?"
 POD_wyrm.507.option.a: "Mạng sống của [sacrifice.GetFirstName]."
 POD_wyrm.507.option.b: "Chính thịt da của ta."
 POD_wyrm.507.option.c: "Của cải vật chất của ta."
 POD_wyrm.507.option.d: "Mạng sống của thần dân ta."

 POD_wyrm.508.t: "Căn Phòng của Những Câu Đố"
 POD_wyrm.508.desc: "$temple_obscura_rooms_intro$\n\nCăn phòng thứ tám chìm trong bóng tối. Không gì có thể được nhìn thấy hay nghe thấy bên trong nó, kể cả tiếng bước chân của chính bạn. Sự im lặng đáng sợ chỉ bị phá vỡ bởi một giọng nói thì thầm những câu hỏi vào tâm trí bạn. Bạn trả lời khi ngày càng nhiều câu hỏi được đặt ra, và dần dần ý thức của bạn bắt đầu trượt khỏi tầm kiểm soát."
 POD_wyrm.508.option.a: "Thật nhiều câu hỏi thú vị..."
 POD_wyrm.508.option.b: "Ta phải chạy trốn!"
 POD_wyrm.508.tooltip: "@warning_icon!#X  Bạn sẽ phải thử lại căn phòng này sau để tiến vào phòng cuối cùng.#!"

 POD_wyrm.509.t: "Căn Phòng của Điều Bí Ẩn"
 POD_wyrm.509.desc: "$temple_obscura_rooms_intro$\n\nCuối cùng căn phòng cuối cùng của ngôi đền cũng hiện ra trước mặt bạn. Một con sói người sừng sững ngồi trên lưng con chiến mã bóng tối ở giữa phòng. Bộ giáp của hắn có kiểu dáng dường như thách thức thực tại, thanh kiếm và con vật cưỡi của hắn bốc cháy bởi ngọn balefire vĩ đại của $glossary_wyrm$. Hắn thốt ra một câu duy nhất trước khi lao vào tấn công bạn.\n"Ngươi chưa sẵn sàng."
 POD_wyrm.509.option.a: "Thử thách cuối cùng của ta..."
 POD_wyrm.509.option.b: "Ta chưa sẵn sàng. Chạy đi!"
 POD_wyrm.509.tooltip: "#help $glossary_wyrm$ cười nhạo sự yếu đuối của bạn.#!\n@warning_icon!#X  Bạn sẽ phải thử lại căn phòng này sau.#!"

 POD_wyrm.510.t: "Vũ Điệu Balefire"
 POD_wyrm.510.desc.a: "Sau một trận chiến tưởng chừng kéo dài hàng ngày trời, bạn cũng đã hạ gục được con quái vật gớm ghiếc đó. Khi thân xác hắn sụp đổ, con vật cưỡi của hắn dịch chuyển tới một khoảng cách ngắn phía sau xác chết. Trong giây lát bạn nghĩ con ngựa lửa sẽ trả thù cho chủ nhân của nó. Nhưng thay vào đó nó nhấn chìm xác chết trong những ngọn balefire dữ dội, rồi từ từ tiến đến gần bạn.\nCon ngựa đáng sợ này, tràn đầy sức mạnh của $glossary_wyrm$, dường như chấp nhận bạn làm chủ nhân mới của nó."
 POD_wyrm.510.desc.b: "Đối thủ của bạn đã nói đúng, bạn chưa hề sẵn sàng. Hầu hết các đòn tấn công của bạn bị gạt bỏ dễ dàng, một số trượt hoàn toàn. Còn những đòn tấn công của hắn thì chính xác, mạnh mẽ, và cực kỳ tàn khốc. Hy vọng duy nhất của bạn lúc này là chạy trốn.\nTội lỗi không nằm ở việc bị áp đảo, mà ở việc không nhận ra điều đó."
 POD_wyrm.510.option.a: "Giờ đây ta là chủ nhân."
 POD_wyrm.510.option.b: "Ta không thể chết ở đây..."
 POD_wyrm.510.tooltip: "@warning_icon!#X  Bạn sẽ phải thử lại căn phòng này sau...nếu bạn sống sót.#!"