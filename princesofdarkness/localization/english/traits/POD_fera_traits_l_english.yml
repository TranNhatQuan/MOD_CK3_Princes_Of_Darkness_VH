l_english:

 trait_fera: "$glossary_fera$"

 TRAIT_FLAG_DESC_can_become_ancestor_spirit: "@spirit_icon!Can become an [ancestor_spirit|E]"

 #Splats
 trait_werewolf: "Người sói"
 trait_werewolf_desc: "Một sinh vật siêu nhiên có thể biến hình. Chúng tự gọi mình là 'Garou'."
 trait_track_werewolf: "Cấp Bậc"
 trait_track_werewolf_desc: "#italic Cấp Bậc là một phần cốt lõi trong xã hội Garou, biểu hiện đầy đủ nhất cho bản chất thứ bậc của loài người sói.#!"
 trait_ajaba: "Ajaba"
 trait_ajaba_desc: "Người linh cẩu là chiến binh của Gaia ở châu Phi, lục địa không có loài sói sinh sống. Dù Cuộc Chiến Phẫn Nộ không lan tới châu Phi, Ajaba gần như đã bị diệt sạch bởi nội chiến và bởi mối tranh chấp với Bastet."
 trait_track_ajaba: "Cấp Bậc"
 trait_track_ajaba_desc: "#italic Ajaba luôn công nhận Tinh Ranh và Hung Tàn là các dạng Danh Vọng, nhưng chúng cũng coi trọng Ô Danh, điều mà nhiều thành viên của chúng lo ngại về tác động lâu dài.#!"
 trait_ananasi: "Ananasi"
 trait_ananasi_desc: "Người nhện không phải con của Gaia, mà là con của Nữ Vương Ananasa, một linh hồn hùng mạnh vốn là con của $glossary_weaver$. Chúng bị các $glossary_fera$ khác xem là dị hợm và đáng sợ, mà cũng chẳng phải vô cớ: hình thú của chúng là một bầy nhện bò lúc nhúc, chúng không hề có Phẫn Nộ, và chúng nuôi sức mạnh của mình bằng máu cướp từ con người. Tên chúng lấy từ Anansi, vị thần/kẻ lừa lọc của Tây Phi."
 trait_track_ananasi: "Cấp Bậc"
 trait_track_ananasi_desc: "#italic Ananasi có thể đạt Danh Vọng ở ba hạng mục, tương ứng với ba thành viên của $glossary_triat$; chúng cố gắng tuân theo cả ba, bất kể thuộc phe nào, để hiểu sâu hơn về "Mạng Lưới Vĩ Đại" của sự tồn tại. Các hạng mục đó là Tinh Ranh (dành cho $glossary_wyrm$), Phục Tùng (dành cho $glossary_weaver$) và Thông Tuệ (dành cho $glossary_wyld$).#!"
 trait_apis: "Apis"
 trait_apis_desc: "Người bò rừng hay "Ngưu Nguyệt", Apis từng nắm việc canh tác và nông nghiệp, được biết đến như "Kẻ Tác Hợp của Gaia". Chúng đã bị Garou diệt chủng trong Cuộc Chiến Phẫn Nộ."
 trait_track_apis: "Cấp Bậc"
 trait_track_apis_desc: "#italic Apis là những sinh vật khá quần cư, sống thành bầy từ sáu đến hai mươi bốn cá thể. Một con bò đực uy mãnh cai quản mỗi bầy và bảo vệ danh hiệu của mình trước mọi kẻ thách đấu. Con bò đực này chịu trách nhiệm bảo vệ bầy và dẫn dắt nó trong chiến trận.#!"
 trait_bastet: "Bastet"
 trait_bastet_desc: "Người mèo có nhiều bộ tộc khác nhau, giống như Garou, song mỗi tộc nhận mình thuộc một loài mèo hoang riêng. Chúng bị mê hoặc bởi tri thức bí truyền, luôn săn tìm và tích trữ nó. Nhiều kẻ là pháp sư lớn, số khác là chiến binh cự phách, nhưng chúng ít khi sống theo đàn và thường hành sự đơn độc. Một số bộ tộc của chúng đã tổn thất nặng nề trong Cuộc Chiến Phẫn Nộ."
 trait_track_bastet: "Cấp Bậc"
 trait_track_bastet_desc: "#italic Bastet công nhận một thứ bậc. Nó không mang ý nghĩa quyền lực tuyệt đối như ở Garou, mà là sự nhún nhường lịch thiệp và công nhận kinh nghiệm. Danh xưng của Bastet luôn mang ý nghĩa xã hội vượt ra ngoài Cấp Bậc của chúng.#!"
 trait_camazotz: "Camazotz"
 trait_camazotz_desc: "Camazotz từng là người dơi, những sứ giả của Gaia nơi bóng đêm và ở nam bán cầu, đối ứng với Corax."
 trait_track_camazotz: "Cấp Bậc"
 trait_track_camazotz_desc: "#italic Camazotz là một Dòng Sinh rất quần cư, sống thành đàn bình đẳng từ mười hai đến một trăm thành viên. Chúng thường sống trong hang động cùng Thân Tộc dơi của mình. Dù có xu hướng giữ bí mật, chúng vẫn cố duy trì quan hệ thân thiện và cởi mở với các $glossary_fera$ khác.#!"
 trait_corax: "Corax"
 trait_corax_desc: "Người quạ là sứ giả, mật vụ và trinh sát của Gaia, tuần tra khắp trời cao, luôn để mắt canh phòng hiểm nguy. Chúng là những kẻ nói nhiều kinh khủng, sẵn sàng kể lại điều mình thấy cho bất cứ ai chịu nghe. Chúng thoát khỏi cuộc tàn sát trong Cuộc Chiến Phẫn Nộ nhờ trợ giúp Garou, và giữ quan hệ hòa hảo nhất với người sói trong tất cả $glossary_fera$."
 trait_track_corax: "Cấp Bậc"
 trait_track_corax_desc: "#italic Corax đạt Danh Vọng như Ragabash của Garou, dù chúng có xu hướng thiên về dạng Thông Tuệ riêng của mình. Vinh Quang thường bị Corax mảnh khảnh bỏ bê.#!"
 trait_grondr: "Grondr"
 trait_grondr_desc: "Người lợn rừng từng sống ở Bắc Âu. Phận sự của chúng là thanh tẩy đất đai; chúng được gọi là kẻ chăm sửa của Gaia. Chúng đã bị Garou diệt chủng trong Cuộc Chiến Phẫn Nộ; linh hồn tổ tiên của chúng rơi vào tay $glossary_wyrm$ mà thành những Trư Đầu Cốt quái dị."
 trait_track_grondr: "Cấp Bậc"
 trait_track_grondr_desc: "#italic Grondr là một Dòng Sinh năng động và hung hãn. Chúng sống thành từng nhóm giống bầy gọi là Sounder, mỗi nhóm do một vua hoặc nữ hoàng cai trị, người giữ danh hiệu ấy bằng cách đánh bại mọi kẻ thách đấu trong đấu trường nghi lễ. Mỗi kẻ cai trị Sounder đều ngang hàng với những kẻ khác; chúng không có thứ bậc nào ngoài phạm vi từng Sounder riêng lẻ.#!"
 trait_gurahl: "Gurahl"
 trait_gurahl_desc: "Người gấu là những kẻ chữa lành của Gaia, gắn với Đất bằng một mối dây bền chặt hơn bất cứ $glossary_fera$ nào khác. Nhiều Garou tin rằng Gurahl đã tuyệt chủng, bị giết trong Cuộc Chiến Phẫn Nộ khi chúng không chịu trao ra bí mật hồi sinh kẻ đã chết."
 trait_track_gurahl: "Cấp Bậc"
 trait_track_gurahl_desc: "#italic Gurahl công nhận ba loại Danh Vọng: Vinh Dự, cho lòng tận tụy và sự tôn kính; Cứu Trợ, cho những hành động chữa lành, thanh tẩy hay giúp đỡ kẻ khác; và Thông Tuệ, cho việc khôi phục, gìn giữ hay khám phá tri thức, hoặc đạt được hiểu biết sâu sắc hơn về bản thân.#!"
 trait_kitsune: "Kitsune"
 trait_kitsune_desc: "Người cáo là pháp sư và cũng là nhà chính trị, kẻ gắn kết xã hội $glossary_fera$ Á Đông lại với nhau. Khác biệt so với mọi Fera, Kitsune chỉ có mặt trong Thú Triều của Trung Vương Quốc, sống phần lớn ở Trung Hoa và Nhật Bản. Được Luna ban phúc, Kitsune còn đóng vai thích khách trừ khử các quan lại mục ruỗng trong xã hội phàm tục, làm pháp sư triều đình và làm đạo tặc, tất cả để bảo hộ Thiên Mệnh."
 trait_track_kitsune: "Số Đuôi"
 trait_track_kitsune_desc: "#italic Kitsune đều khởi đầu với một cái đuôi. Gaia ban cho chúng thêm một cái mỗi khi chúng lên Cấp Bậc. Kitsune có chín đuôi đã đạt được sự bất tử, và được kính trọng vì quyền năng cùng đức hạnh của mình.#!"
 trait_mokole: "Mokolé"
 trait_mokole_desc: "Người thằn lằn là ký ức của Gaia. Hậu duệ của các Vua Thằn Lằn thời tiền sử đã tự tổ chức thành bốn "dòng" lớn, dựa theo bốn con sông nguyên thủy của thế gian. Một khi văn minh loài người sụp đổ, các đại vương sẽ trỗi lên từ chốn hoang tàn mà ngự trị một lần nữa."
 trait_track_mokole: "Cấp Bậc"
 trait_track_mokole_desc: "#italic Mokolé dùng cùng hệ thống Danh Vọng như Garou, tôn sùng các Nguyên Lý Vinh Dự, Thông Tuệ, và Vinh Quang. Mức độ mà mỗi Mokolé tuân theo từng nguyên lý hoàn toàn do Thánh Triều của họ quyết định.#!"
 trait_nagah: "Nagah"
 trait_nagah_desc: "Người rắn khởi nguồn từ Ấn Độ. Phần lớn (nếu không phải tất cả) các chủng biến hình khác đều tin rằng chúng đã chết, nhưng chúng vẫn còn đó cả. Giữ vai "Phán Quan của Gaia", Nagah đảm cả phận thẩm phán thầm lặng lẫn đao phủ giấu mặt cho các Chủng Biến Hình."
 trait_track_nagah: "Cấp Bậc"
 trait_track_nagah_desc: "#italic Vì các tổ đều du cư, Nagah phải tìm đến các Sesha để đạt Danh Vọng từ họ. Sesha, sau khi nghe về những chiến công của tổ, sẽ quyết định những điểm Danh Vọng nào được trao cho họ. Điều này quyết định Cấp Bậc, và từ đó, những món quà mà một Nagah sẽ học được. Hệ thống Danh Vọng sử dụng Vinh Quang, Vinh Dự và Thông Tuệ.#!"
 trait_nuwisha: "Nuwisha"
 trait_nuwisha_desc: "Người sói đồng là những bậc thầy dạy học của Gaia, có điều giống như vật tổ của chúng — Lão Sói Đồng — chúng chỉ thích dạy bằng cách chơi khăm. Nhờ một vố chúng chơi Luna, chúng không còn chút Phẫn Nộ nào nữa, nhưng lại thân với [umbra|E] hơn bất cứ $glossary_fera$ nào khác."
 trait_track_nuwisha: "Cấp Bậc"
 trait_track_nuwisha_desc: "#italic Khác với hầu hết $glossary_fera$, những kẻ đạt Cấp Bậc qua vinh dự và sự ưu ái của Bộ Tộc mình, Nuwisha đạt Danh Vọng qua việc dạy dỗ. Thay vì Vinh Dự, chúng có Hài Hước - và chúng càng chứng tỏ mình hài hước với vị thần của mình, một dạng hóa thân của Sói Đồng, thì chúng càng đạt được nhiều Danh Vọng hơn.#!"
 trait_ratkin: "Ratkin"
 trait_ratkin_desc: "Người chuột xưa từng trông coi nhân loại, giữ cho số lượng loài người đừng bao giờ đông quá mức. Thế nhưng Garou đã chiếm lấy vai ấy, và Ratkin thù hận chúng từ đó. Chúng chiến đấu một lòng cho $glossary_wyld$ và nhân mọi cơ hội để phá hoại kỹ nghệ."
 trait_track_ratkin: "Cấp Bậc"
 trait_track_ratkin_desc: "#italic Các khu định cư Ratkin có một thứ bậc nội bộ nghiêm ngặt. Một Vua Chuột cai quản khu định cư, được phục vụ bởi các nhóm cận thần — thường toàn là Ratkin rodens. Dưới cận thần, người chuột rodens có ưu tiên.#!"
 trait_rokea: "Rokea"
 trait_rokea_desc: "Ngay cả biển cả cũng có những kẻ hộ vệ. Người cá mập tuần tra nơi đáy sâu và rất ít khi bị kẻ trên cạn trông thấy."
 trait_track_rokea: "Cấp Bậc"
 trait_track_rokea_desc: "#italic Rokea chấp nhận ba dạng Danh Vọng: Dũng Cảm, chỉ tài chiến đấu và lòng can đảm của một người cá mập khi bảo vệ một Grotto; Hòa Hợp, tức khả năng của một người cá mập chấp nhận vị trí của mình trong thế giới và hành động phù hợp với nó, và Sáng Tạo, được trao cho những người cá mập, thông qua ý tưởng mới, giúp giống loài bảo vệ Biển Cả và chống lại lũ con của Qyrl.#!"
 trait_entomos: "Éntomos"
 trait_entomos_desc: "Một nhóm lớn $glossary_fera$ do $glossary_weaver$ tạo ra một cách gián tiếp, Éntomos bao gồm Ananasi, các Chủng Côn Trùng và C'etites. Tất thảy đều là cháu của Weaver, mang trong mình niềm khát khao bản năng hướng về những nguyên lý của Weaver: Tín Ngưỡng, Khoa Học và Giáo Điều."
 trait_track_entomos: "Cấp Bậc"
 trait_track_entomos_desc: "#italic Cấp Bậc là cách cốt lõi mà Éntomos tự tổ chức, cấu trúc bản thân trong các cấu trúc kinh nghiệm và kỹ năng để định hướng xã hội của mình.#!"



 #Extra splat descs
 trait_hakken: "Hakken"
 trait_hakken_desc: "Người sói của Nhật Bản, những kẻ đề cao triết lý bushidō."

 trait_mokole_mbembe: "Mokolé-mbembe"
 trait_mokole_mbembe_desc: "Chi Phái Chiến Binh, theo truyền thống đã rình mò khắp đầm lầy và sông ngòi của châu Phi và châu Mỹ. Được đặt tên theo thủy tổ của giống loài mình, đây là chi phái đông đảo nhất tính đến nay. Trong bốn chi phái, họ chịu tổn thất nặng nề hơn bất cứ ai trong Cuộc Chiến Phẫn Nộ, một tội ác sẽ mãi mãi được ghi nhớ."
 trait_gumagan: "Gumagan"
 trait_gumagan_desc: "Được biết đến như Chi Phái Tiền Phong, họ được các Mokolé khác kính trọng vì sự thấu hiểu về cõi linh hồn, đặc biệt là Thời Mộng. Gumagan thường được tìm thấy tránh xa nước, và một số dành cả đời mình trong sa mạc sâu thẳm của Úc châu."
 trait_makara: "Makara"
 trait_makara_desc: "Tiểu lục địa Ấn Độ là nơi sinh sôi của Makara, Chi Phái Dân Dã. Chính trị, tôn giáo, và thần bí học của loài người Ấn Độ đã ảnh hưởng sâu sắc tới chi phái này. Makara dùng Thánh Triều Mùa thay vì Thánh Triều Mặt Trời của bà con họ."
 trait_zhong_lung: "Zhong Lung"
 trait_zhong_lung_desc: "Hợp tác cùng các Chủng Biến Hình châu Á khác, Zhong Lung được biết đến như Chi Phái Triết Gia. Họ công nhận bốn Thánh Triều Mùa quyết định vai trò của mình trong xã hội rồng và Thú Triều."



 trait_kumo: "Kumo"
 trait_kumo_desc: "Người nhện đã sa vào vòng nô lệ của $glossary_wyrm$."
 trait_tengu: "Tengu"
 trait_tengu_desc: "Người quạ của Viễn Đông, phục vụ như trinh sát và sứ giả của Thú Triều."
 trait_okuma: "Okuma"
 trait_okuma_desc: "Okuma từng là một bộ tộc Gurahl sống ở Đông Nam Á, gồm cả miền bắc Ấn Độ và xa tới tận Nhật Bản. Thân Tộc thú vật của họ gồm gấu mặt trời, gấu mặt trăng, và gấu trúc khổng lồ. Khác với các bộ tộc Gurahl khác, những kẻ tôn thờ Gaia như mẹ mình và Luna như nguồn gốc quyền năng biến hình, Okuma còn có một mối quan hệ đặc biệt với Helios. Lông của mỗi Okuma đều mang những đốm màu rực rỡ."
 trait_nezumi: "Nezumi"
 trait_nezumi_desc: "Người chuột của châu Á, đang tiến hành một Cuộc Chiến Ngầm chống lại loài người."
 trait_same_bito: "Same-Bito"
 trait_same_bito_desc: "Người cá mập, tự coi mình thanh lịch hơn hẳn so với Rokea."
 trait_ozuzo: "Ozuzo"
 trait_ozuzo_desc: "Ozuzo là những Ajaba đã sa ngã theo $glossary_wyrm$."
 trait_histpah: "Histpah"
 trait_histpah_desc: "Histpah là những Vua Dối Trá, Bastet bị $glossary_wyrm$ làm ô uế."
 trait_buzzards: "Buzzards"
 trait_buzzards_desc: "Buzzard là những Đứa Trẻ Lạc Loài, Corax bị $glossary_wyrm$ nhiễm độc."
 trait_purgers: "Purgers"
 trait_purgers_desc: "Purger là những Gurahl sa ngã."
 trait_nokhomi: "Nokhomi"
 trait_nokhomi_desc: "Nokhomi, còn gọi là Nụ Cười Cay Đắng, là những Nuwisha sa ngã."
 trait_mad_destroyers: "Mad Destroyers"
 trait_mad_destroyers_desc: "Mad Destroyer là những Ratkin sa ngã."
 trait_balefire_sharks: "Balefire Sharks"
 trait_balefire_sharks_desc: "Balefire Shark là những Rokea bị $glossary_wyrm$ nhiễm độc."
 trait_xibalan: "Xibalan"
 trait_xibalan_desc: "Xibalan từng là Camazotz đã hiến thân cho $glossary_wyrm$ thông qua khía cạnh ô uế của vị thần bảo hộ chúng, Dơi."
 trait_skull_pig: "Skull Pig"
 trait_skull_pig_desc: "Trư Đầu Cốt là một loại sinh vật gắn với $glossary_wyrm$, được tạo ra từ Thân Tộc Grondr đã quy phục nó để sống sót qua Cuộc Chiến Phẫn Nộ."


 #Breeds
 trait_breed: "Dòng Sinh"
 trait_homid_born: "Homid"
 trait_homid_born_desc: "Homid là một Dòng Sinh của $glossary_fera$ sinh ra và lớn lên như con người, đó là hình dạng tự nhiên của chúng."
 trait_kojin: "Kojin"
 trait_kojin_desc: "Kojin là một Dòng Sinh của Kitsune sinh ra và lớn lên như con người, đó là hình dạng tự nhiên của chúng."
 trait_balaram: "Balaram"
 trait_balaram_desc: "Balaram là một Dòng Sinh của Nagah sinh ra và lớn lên như con người, đó là hình dạng tự nhiên của chúng."
 trait_beast_born: "Beastborn"
 trait_beast_born_desc: "Beastborn là một Dòng Sinh của $glossary_fera$ sinh ra và lớn lên như thú vật, đó là hình dạng tự nhiên của chúng."
 trait_lupus_born: "Lupus"
 trait_lupus_born_desc: "Lupus là một Dòng Sinh của Garou sinh ra và lớn lên như một con sói, đó là hình dạng tự nhiên của chúng."
 trait_hyaena_born: "Hyaena"
 trait_hyaena_born_desc: "Hyaena là một Dòng Sinh của Ajaba sinh ra và lớn lên như một con linh cẩu, đó là hình dạng tự nhiên của chúng."
 trait_bos_born: "Bos"
 trait_bos_born_desc: "Bos là một Dòng Sinh của Apis sinh ra và lớn lên như một con bò đực, đó là hình dạng tự nhiên của chúng."
 trait_feline_born: "Feline"
 trait_feline_born_desc: "Feline là một Dòng Sinh của Bastet sinh ra và lớn lên như một con mèo lớn, đó là hình dạng tự nhiên của chúng."
 trait_chiroptera_born: "Chiroptera"
 trait_chiroptera_born_desc: "Chiroptera là một Dòng Sinh của Camazotz sinh ra và lớn lên như một con dơi, đó là hình dạng tự nhiên của chúng."
 trait_corvid_born: "Corvid"
 trait_corvid_born_desc: "Corvid là một Dòng Sinh của Corax sinh ra và lớn lên như một con quạ, đó là hình dạng tự nhiên của chúng."
 trait_scrofa_born: "Scrofa"
 trait_scrofa_born_desc: "Scrofa là một Dòng Sinh của Grondr sinh ra và lớn lên như một con lợn rừng, đó là hình dạng tự nhiên của chúng."
 trait_ursine_born: "Ursine"
 trait_ursine_born_desc: "Ursine là một Dòng Sinh của Gurahl sinh ra và lớn lên như một con gấu, đó là hình dạng tự nhiên của chúng."
 trait_roko_born: "Roko"
 trait_roko_born_desc: "Roko là một Dòng Sinh của Kitsune sinh ra và lớn lên như một con cáo, đó là hình dạng tự nhiên của chúng."
 trait_suchid_born: "Suchid"
 trait_suchid_born_desc: "Suchid là một Dòng Sinh của Mokolé sinh ra và lớn lên như một loài bò sát, đó là hình dạng tự nhiên của chúng."
 trait_vasuki_born: "Vasuki"
 trait_vasuki_born_desc: "Vasuki là một Dòng Sinh của Nagah sinh ra và lớn lên như một con rắn, đó là hình dạng tự nhiên của chúng."
 trait_latrani_born: "Latrani"
 trait_latrani_born_desc: "Latrani là một Dòng Sinh của Nuwisha sinh ra và lớn lên như một con chó sói đồng, đó là hình dạng tự nhiên của chúng."
 trait_rodens_born: "Rodens"
 trait_rodens_born_desc: "Rodens là một Dòng Sinh của Ratkin sinh ra và lớn lên như một con chuột, đó là hình dạng tự nhiên của chúng."
 trait_squamus_born: "Squamus"
 trait_squamus_born_desc: "Squamus là một Dòng Sinh của Rokea sinh ra và lớn lên như một con cá mập, đó là hình dạng tự nhiên của chúng."


 #Auspices
 trait_lunar_auspice: "Thánh Triều"
 trait_ahroun: "Ahroun"
 trait_ahroun_desc: "Một trong năm Thánh Triều mà một Garou có thể sinh ra dưới đó. Trăng Tròn khiến Ahroun trở thành vũ khí sống của Gaia. Chúng là chiến binh giữa một giống loài chiến binh, là nhà vô địch của một dân tộc thượng võ. Luôn sẵn sàng giết chóc, và sẵn sàng hy sinh nếu cần."
 trait_galliard: "Galliard"
 trait_galliard_desc: "Một trong năm Thánh Triều mà một Garou có thể sinh ra dưới đó. Được đại diện bởi Trăng Khuyết Gần Tròn, Galliard hát lên linh hồn của Garou. Chúng là tiếng nói của Dân Tộc, kêu gọi họ ra trận và truyền cảm hứng để họ vươn tới sự vĩ đại trong cả sự sống lẫn cái chết. Chúng cũng là người gìn giữ truyền thống, mang theo tri thức của các Bộ Tộc từ tận thuở khai thiên lập địa."
 trait_philodox: "Philodox"
 trait_philodox_desc: "Một trong năm Thánh Triều mà một Garou có thể sinh ra dưới đó. Trăng bán nguyệt tượng trưng cho cân bằng và nhị nguyên, một Garou sinh ra dưới ảnh hưởng của nó thường đóng vai cố vấn, người hòa giải và người giữ luật cho bầy của mình."
 trait_theurge: "Theurge"
 trait_theurge_desc: "Một trong năm Thánh Triều mà một Garou có thể sinh ra dưới đó. Vầng trăng lưỡi liềm hình lưỡi hái ban tặng món quà thấu thị. Theurge là những nhà thần bí của Garou, gần gũi hơn bất cứ ai với [umbra|E] và cư dân của nó."
 trait_ragabash: "Ragabash"
 trait_ragabash_desc: "Một trong năm Thánh Triều mà một Garou có thể sinh ra dưới đó. Kẻ sinh ra trong đêm Trăng Non đóng vai kẻ lừa lọc thần thoại, gã khờ vừa dại dột vừa khôn ngoan. Hắn đóng vai kẻ đối lập, chất vấn truyền thống để tìm ra con đường khôn ngoan nhất."
 
 trait_dawn: "Dawn"
 trait_dawn_female_desc: "Một trong hai Diện Mạo mà một Ajaba có thể sinh ra dưới đó. Tương tự Ahroun của Garou, Dawn nữ là chiến binh."
 trait_dawn_male_desc: "Một trong hai Diện Mạo mà một Ajaba có thể sinh ra dưới đó. Tương tự Galliard của Garou, Dawn nam là người kể chuyện."
 trait_dusk: "Dusk"
 trait_dusk_female_desc: "Một trong hai Diện Mạo mà một Ajaba có thể sinh ra dưới đó. Một phiên bản bạo lực hơn của Ragabash, Dusk nữ là những sát thủ."
 trait_dusk_male_desc: "Một trong hai Diện Mạo mà một Ajaba có thể sinh ra dưới đó. Giống như những Theurge tài năng xuất chúng, Dusk nam là những nhà thần bí."
 
 trait_uzmati: "Uzmati"
 trait_uzmati_desc: "Một trong năm Thánh Triều mà một Gurahl có thể trải qua trong đời mình. Trăng Tròn khiến Uzmati trở thành vũ khí sống của Gaia. Chúng là chiến binh giữa một giống loài chiến binh, là nhà vô địch của một dân tộc thượng võ. Luôn sẵn sàng giết chóc, và sẵn sàng hy sinh nếu cần."
 trait_kojubat: "Kojubat"
 trait_kojubat_desc: "Một trong năm Thánh Triều mà một Gurahl có thể trải qua trong đời mình. Được đại diện bởi Trăng Khuyết Gần Tròn, Kojubat hát lên linh hồn của Gurahl. Chúng là tiếng nói của Dân Tộc, kêu gọi họ ra trận và truyền cảm hứng để họ vươn tới sự vĩ đại trong cả sự sống lẫn cái chết. Chúng cũng là người gìn giữ truyền thống, mang theo tri thức của các Bộ Tộc từ tận thuở khai thiên lập địa."
 trait_rishi: "Rishi"
 trait_rishi_desc: "Một trong năm Thánh Triều mà một Gurahl có thể trải qua trong đời mình. Trăng bán nguyệt tượng trưng cho cân bằng và nhị nguyên, một Gurahl dưới ảnh hưởng của nó thường đóng vai cố vấn, người hòa giải và người giữ luật cho bầy của mình."
 trait_kieh: "Kieh"
 trait_kieh_desc: "Một trong năm Thánh Triều mà một Gurahl có thể trải qua trong đời mình. Vầng trăng lưỡi liềm hình lưỡi hái ban tặng món quà thấu thị. Theurge là những nhà thần bí của Gurahl, gần gũi hơn bất cứ ai với [umbra|E] và cư dân của nó."
 trait_arcas: "Arcas"
 trait_arcas_desc: "Một trong năm Thánh Triều mà một Gurahl có thể trải qua trong đời mình. Kẻ sinh ra trong đêm Trăng Non đóng vai kẻ lừa lọc thần thoại, gã khờ vừa dại dột vừa khôn ngoan. Hắn đóng vai kẻ đối lập, chất vấn truyền thống để tìm ra con đường khôn ngoan nhất."
 
 trait_warriors: "Warriors"
 trait_warriors_desc: "Đúng như tên gọi, những chiến binh và kẻ sát nhân, tuyến đầu trong chiến trận, tương tự Ahroun của Garou. Còn được gọi là "Nô Lệ Lưỡi Kiếm"."
 trait_bards: "Bards"
 trait_bards_desc: "Bard là một Diện Mạo đã thất truyền của xã hội người chuột. Được gọi thông tục là "Người Nói", họ đóng vai người hòa giải của giống loài: những kẻ trung gian giữa Ratkin và các giống loài khác, thu thập truyền thuyết để bổ sung vào Ký Ức Máu chung của họ. Sứ giả tới Sept của Garou trong những ngày đầu của thế giới, họ là những kẻ đầu tiên chết khi giống loài mình bị phản bội."
 trait_knife_skulkers: "Knife Skulkers"
 trait_knife_skulkers_desc: "Sát thủ đáng kính của Ratkin, chỉ làm việc theo hợp đồng. Họ cũng đóng vai thẩm phán và người hòa giải, tương tự một Philodox."
 trait_shadow_seers: "Shadow Seers"
 trait_shadow_seers_desc: "Pháp sư và người dẫn dắt tâm linh, tương tự một Theurge."
 trait_tunnel_runners: "Tunnel Runners"
 trait_tunnel_runners_desc: "Trinh sát và gián điệp lang thang, kết nối các Hang Ổ Ratkin khắp thế giới. Tương tự Ragabash."
 
 trait_pryio: "Pryio"
 trait_pryio_twilight: "Twilight"
 trait_pryio_twilight_desc: "Còn gọi là 'Ân Sủng Trăng', Pryio quyết định vị trí của Bastet và cách con mèo ấy đối diện cuộc sống cùng đương đầu thử thách trên đường đời. Dù thường được quyết định bởi thời điểm trong ngày mà Bastet trải qua Lần Biến Đổi Đầu Tiên, Pryio có thể thay đổi nếu Bastet trải qua một biến cố lớn trong đời. Bastet Twilight là những kẻ hay chất vấn và tìm kiếm, họ có xu hướng làm thám tử, luật sư, gián điệp, hay nhà thần bí."
 trait_pryio_daylight: "Daylight"
 trait_pryio_daylight_desc: "Còn gọi là 'Ân Sủng Trăng', Pryio quyết định vị trí của Bastet và cách con mèo ấy đối diện cuộc sống cùng đương đầu thử thách trên đường đời. Dù thường được quyết định bởi thời điểm trong ngày mà Bastet trải qua Lần Biến Đổi Đầu Tiên, Pryio có thể thay đổi nếu Bastet trải qua một biến cố lớn trong đời. Bastet Daylight cởi mở và thẳng thắn, họ có xu hướng làm nhà ngoại giao, chiến binh, người lập pháp, và người bảo hộ."
 trait_pryio_night: "Night"
 trait_pryio_night_desc: "Còn gọi là 'Ân Sủng Trăng', Pryio quyết định vị trí của Bastet và cách con mèo ấy đối diện cuộc sống cùng đương đầu thử thách trên đường đời. Dù thường được quyết định bởi thời điểm trong ngày mà Bastet trải qua Lần Biến Đổi Đầu Tiên, Pryio có thể thay đổi nếu Bastet trải qua một biến cố lớn trong đời. Bastet Night thường thu mình và sống ẩn dật, họ có xu hướng làm sát thủ, học giả, nhà khoa học, và người luyện tà thuật."
 




 
 trait_solar_auspice: "Thánh Triều Mặt Trời"
 trait_rising_sun: "Rising Sun"
 trait_rising_sun_desc: "Giữa lúc bầu trời phương đông ửng đỏ và giữa trưa, ánh mặt trời đánh vào bầu trời. Mokolé sinh vào thời điểm này trong ngày xuất sắc như binh sĩ, thợ săn, nhà thám hiểm, và người tìm kiếm."
 trait_noonday_sun: "Noonday Sun"
 trait_noonday_sun_desc: "Vào lúc chính ngọ, mặt trời ngự trị tối cao trên Trái Đất, nhìn thấu mọi thứ. Phần lớn kẻ sinh dưới Thánh Triều này trở thành thẩm phán, người thi hành luật pháp, hay lính canh tuần tra quanh các vũng lầy."
 trait_setting_sun: "Setting Sun"
 trait_setting_sun_desc: "Khi mặt trời lặn, người khôn ngoan phòng vệ trước cái ác ẩn giấu trong bóng tối đang lan rộng. Nhiều kẻ trở thành lính canh, y tá, người chữa lành, hay người chăm sóc."
 trait_midnight_sun: "Midnight Sun"
 trait_midnight_sun_desc: "Khi những sinh vật của mặt trời sinh ra vào ban đêm, những sự kiện kỳ lạ và mâu thuẫn xảy ra. Bị hút về bóng tối, chúng vẫn cháy sáng với ánh sáng của Helios. Nhiều kẻ đóng vai thi sĩ, kẻ pha trò, nghệ sĩ, người kể huyền thoại, hay người dẫn đường cho kẻ chết."
 trait_shrouded_sun: "Shrouded Sun"
 trait_shrouded_sun_desc: "Khi mặt trời bị che khuất, những thế lực vô hình âm mưu chống lại những kẻ sống trong ánh sáng. Phần lớn trở thành nhà thần bí, người dạy tri thức linh hồn, hay học giả về tri thức bí mật."
 trait_decorated_sun: "Decorated Sun"
 trait_decorated_sun_desc: "Khi ánh sáng tụ lại, mặt trời được bao quanh bởi một vầng hào quang. Họ tự xem mình là những người tổ chức, điều phối, hay mai mối chăm chỉ."
 trait_eclipsed_sun: "Eclipsed Sun"
 trait_eclipsed_sun_desc: "Trong những khoảnh khắc kỳ diệu của thiên văn, những sự kiện phi thường có thể xảy ra. Hiếm nhất trong mọi Mokolé là những kẻ sinh ra trong lúc nhật thực. Họ là những vua-tăng lữ của xã hội Mokolé; mọi weresaurian đều phục tùng Eclipsed Sun."

 trait_vasanta: "Vasanta"
 trait_vasanta_desc: "Thánh Triều mùa xuân và các chiến binh của Mokolé Ấn Độ. Họ cũng là những lữ khách và luôn háo hức lắng nghe điều mới."

 trait_grisma: "Grisma"
 trait_grisma_desc: "Thánh Triều mùa hè và các thẩm phán của Makara. Họ được kỳ vọng tìm kiếm sự thật và công lý. Đây có thể là một bổn phận khắt khe trong một xã hội sinh ra từ niềm tin mãnh liệt vào bổn phận theo đẳng cấp và nghiệp báo."

 trait_zarad: "Zarad"
 trait_zarad_desc: "Thánh Triều mùa thu được xem là các nhà thần bí và người theo tâm linh. Những ai xuất thân không cho phép làm chức sắc tôn giáo thường trở thành bhagat (người của thần thánh), cố gắng hòa quyện đời sống thường nhật với các nghi lễ tôn giáo."

 trait_hemanta: "Hemanta"
 trait_hemanta_desc: "Thánh Triều mùa đông là những kẻ lừa lọc và những tên vô lại. Họ được kỳ vọng phải tinh ranh, nhưng thường bị gán cho hành vi phù phiếm."

 trait_tung_chun: "Tung Chun"
 trait_tung_chun_desc: "Họ là chiến binh và người tình, sinh vào mùa xuân. Màu của họ là xanh dương và xanh lá, và gió đông thổi qua họ."

 trait_nam_hsia: "Nam Hsia"
 trait_nam_hsia_desc: "Sinh vào mùa hè, họ là thẩm phán và người lập pháp. Họ được gió Nam cùng hơi ấm của nó ưu ái. Màu của họ là màu vàng của hoàng đế."

 trait_sai_chau: "Sai Chau"
 trait_sai_chau_desc: "Họ, những kẻ mang màu trắng nhợt nhạt chết chóc, sinh vào mùa thu. Họ là những nhà tiên tri và học giả giữa dân tộc học thức của mình. Gió Tây từ Tây Vương Mẫu thổi qua họ."

 trait_pei_tung: "Pei Tung"
 trait_pei_tung_desc: "Họ là những kẻ pha trò và lừa lọc. Sinh vào mùa đông, họ được gió Bắc cảnh báo, và trái tính trái nết, yêu thích nghịch lý. Màu của họ là màu đen, \"màu đen của ban ngày\" như họ vẫn nói."










 trait_path: "Đạo Lộ"
 trait_eji: "Eji"
 trait_eji_desc: "Đạo Lộ của Chiến Binh, gắn với Dung Nham, qua con đường Đất và Lửa."
 trait_doshi: "Doshi"
 trait_doshi_desc: "Đạo Lộ của Pháp Sư, gắn với Sấm Sét, qua con đường Khí và Lửa."
 trait_gukutsushi: "Gukutsushi"
 trait_gukutsushi_desc: "Đạo Lộ của Ảo Thuật Gia, gắn với Sương Mù, qua con đường Nước và Khí."
 trait_kataribe: "Kataribe"
 trait_kataribe_desc: "Đạo Lộ của Người Kể Chuyện, gắn với Đất Sét, qua con đường Đất và Nước."



 
 trait_seasonal_auspice: "Thánh Triều Mùa"
 trait_kamakshi: "Kamakshi"
 trait_kamakshi_desc: "Xuân - được ban phước bởi các thế lực của sự sống và tái sinh, nguyên tố của họ là đất."
 trait_kartikeya: "Kartikeya"
 trait_kartikeya_desc: "Hạ - mạnh mẽ và chân thật, năng lượng của họ khơi dậy niềm đam mê lớn nhất tìm thấy được giữa loài người rắn. Nguyên tố của họ là lửa."
 trait_kamsa: "Kamsa"
 trait_kamsa_desc: "Thu - tâm trí của mục tiêu là đam mê và sở trường của họ. Nguyên tố của họ là khí."
 trait_kali: "Kali"
 trait_kali_desc: "Đông - máu của họ lạnh nhất, tầm nhìn của họ chân thật nhất, và sự tận tụy với sự nghiệp của họ không có giới hạn. Nguyên tố của họ là nước."
 
 trait_freak: "Freak"
 trait_engineers: "Engineers"
 trait_engineers_desc: "Nhà khoa học, nhà phát minh và thợ sửa chữa, những kẻ say mê công nghệ."
 trait_munchmausen: "Munchmausen"
 trait_munchmausen_desc: "Ratkin kiếm khách, hoang tưởng vĩ đại, không trừ một ai."
 trait_plague_lords: "Plague Lords"
 trait_plague_lords_desc: "Bậc thầy của bệnh dịch và ô uế."
 trait_twitchers: "Twitchers"
 trait_twitchers_desc: "Những kẻ vô chính phủ giữa những kẻ vô chính phủ, Twitcher là những kẻ phá hoại điên loạn và khó lường."
 
 trait_aquatic_auspice: "Thánh Triều Nước"
 trait_brightwater: "Brightwater"
 trait_brightwater_desc: "Rokea sinh ra vào những ngày nắng đẹp hay dưới trăng tròn. Brightwater tương tự Ahroun của Garou; họ là chiến binh và anh hùng. Tuy nhiên, họ thường mong muốn ở gần bề mặt biển."
 trait_dimwater: "Dimwater"
 trait_dimwater_desc: "Dimwater sinh ra vào những ngày nhiều mây hoặc ban đêm dưới bất cứ tuần trăng nào trừ trăng tròn hay trăng non. Phần lớn Rokea thuộc Thánh Triều này. Họ là thẩm phán và lãnh đạo của giống loài Rokea và tạo ra số ít fetish mà Rokea sử dụng."
 trait_darkwater: "Darkwater"
 trait_darkwater_desc: "Được đồng loại gọi là "những kẻ điên", Darkwater sinh ra dưới nhật thực hay Trăng Non. Họ tò mò, sáng tạo, thông minh, và táo bạo. Họ thích lặn xuống vực sâu lạnh giá của biển cả hay đi trên đất liền để khám phá bí mật mới."
 
 trait_lunisolar_auspice: "Thánh Triều Nhật Nguyệt"
 trait_lunar: "Lunar"
 trait_lunar_desc: "Sinh vào ban đêm, những Apis này đóng vai chiến binh của Dòng Sinh, bảo vệ những kẻ mình chăm sóc khỏi mối đe dọa bên ngoài."
 trait_twilight: "Twilight"
 trait_twilight_desc: "Sinh vào lúc bình minh hoặc hoàng hôn, những Apis này gần gũi nhất với cõi linh hồn."
 trait_solar: "Solar"
 trait_solar_desc: "Sinh vào ban ngày, những Apis này làm việc gần gũi nhất với con người và các giống loài khác."
 
 trait_gnosis: "Gnosis"
 trait_gnosis_desc: "Trí Ngộ là một năng lượng tâm linh, huyền bí. Một số phàm nhân tài năng có thể sử dụng nó. Trí Ngộ là một tài nguyên có thể tái tạo, nhưng đang cạn dần. Nó có thể được phục hồi tại các địa điểm linh thiêng, qua thiền định, hoặc thương lượng với linh hồn. Địa điểm linh thiêng cung cấp Trí Ngộ, nhưng nếu chúng bị ô uế, nó có thể làm suy đồi người sử dụng, hoặc đơn giản là không còn Trí Ngộ khả dụng nữa."
 trait_gnosis_kinfolk: "Trí Ngộ của Thân Tộc"
 trait_gnosis_kinfolk_desc: "Trí Ngộ là một năng lượng tâm linh, huyền bí. Một số Thân Tộc tài năng có thể sử dụng nó. Trí Ngộ là một tài nguyên có thể tái tạo, nhưng đang cạn dần. Nó có thể được phục hồi tại các địa điểm linh thiêng, qua thiền định, hoặc thương lượng với linh hồn. Địa điểm linh thiêng cung cấp Trí Ngộ, nhưng nếu chúng bị ô uế, nó có thể làm suy đồi người sử dụng, hoặc đơn giản là không còn Trí Ngộ khả dụng nữa."


 trait_abomination: "Abomination"
 trait_abomination_desc: "Nghịch Đồ là thuật ngữ chỉ một kẻ biến hình bị biến thành ma cà rồng. Không cần phải nói, những sinh vật này cực kỳ hiếm gặp, do gần như mọi $glossary_fera$ đều dị ứng dữ dội với vitae ma cà rồng. Nghịch Đồ bị cả Garou lẫn Ma cà rồng khiếp sợ. Chúng cực kỳ quyền năng và phần lớn nhanh chóng hóa điên, trở nên thú tính và không còn khả năng hành xử dù chỉ hơi giống con người."
 trait_werewolf_abomination: "Nghịch Đồ Garou"
 trait_gurahl_abomination: "Umfalla"
 trait_abomination_with_type: "[ROOT.Var('fera_type').Trait.GetNameNoTooltip(ROOT.Char.Self)] Abomination"

 trait_kinfolk: "Kinfolk"
 trait_kinfolk_desc: "Thân Tộc, đôi khi gọi là Gallain hay đơn giản là Kin, là những con người và thú hoang có quan hệ huyết thống với $glossary_fera$ và không dễ mắc chứng Mê Sảng, nhưng bản thân không phải là Fera thực thụ."
 trait_werewolf_kinfolk: "Thân Tộc Garou"
 trait_werewolf_kinfolk_desc: "Mang dòng máu sói, hậu duệ của Garou."
 trait_kinfolk_with_type: "[ROOT.Var('fera_type').Trait.GetNameNoTooltip(ROOT.Char.Self)] Kinfolk"

 TRAIT_FLAG_DESC_is_spirit: "Không thể bị tổn hại về thể xác nếu không có quyền năng đặc biệt"


 trait_spirit: "Linh thể"
 trait_spirit_desc: "Linh thể là những thực thể vô hình thể, khởi sinh từ — và thường trú tại — [umbra|E]; chính vì vậy mà một số pháp sư gọi chúng là "Umbrood"."
 trait_track_spirit: "Cấp Bậc"
 trait_track_spirit_desc: "#italic Cấp Bậc của một Linh Thể là thước đo quyền năng tâm linh của nó. Linh Thể càng quyền năng càng có khả năng biểu hiện sức mạnh của mình trong thế giới vật chất và trợ giúp đồng đội.#!"


