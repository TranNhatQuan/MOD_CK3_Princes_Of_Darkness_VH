 trait_spirit_raccoon: "Linh Thể Gấu Mèo"
 trait_spirit_raccoon_desc: "$pact_tooltip$[GetModifier('spirit_raccoon_pact_modifier').GetNameWithTooltip]\n\n$trait_spirit_desc$"
 trait_spirit_crow: "Linh Thể Quạ"
 trait_spirit_crow_desc: "$pact_tooltip$[GetModifier('spirit_crow_pact_modifier').GetNameWithTooltip]\n\n$trait_spirit_desc$"
 trait_spirit_monkey: "Linh Thể Khỉ"
 trait_spirit_monkey_desc: "$pact_tooltip$[GetModifier('spirit_monkey_pact_modifier').GetNameWithTooltip]\n\n$trait_spirit_desc$"
 trait_spirit_toad: "Linh Thể Cóc"
 trait_spirit_toad_desc: "$pact_tooltip$[GetModifier('spirit_toad_pact_modifier').GetNameWithTooltip]\n\n$trait_spirit_desc$"
 trait_spirit_tree: "Linh Thể Cây"
 trait_spirit_tree_desc: "$pact_tooltip$[GetModifier('spirit_tree_pact_modifier').GetNameWithTooltip]\n\n$trait_spirit_desc$"


 trait_spirit_innocent: "Innocent"
 trait_spirit_innocent_desc: "$pact_tooltip$[GetModifier('spirit_innocent_pact_modifier').GetNameWithTooltip]\n\nMột sinh vật sinh ra từ những cơn ác mộng của [GetTrait('mokole').GetName(GetNullCharacter)]. Những linh thể dị dạng này hung hãn với mọi $glossary_fera$, trừ Mokolé, kẻ mà chúng chủ động săn đuổi trong cơn điên loạn cuồng bạo."
 trait_spirit_drattosi: "Drattosi"
 trait_spirit_drattosi_desc: "$pact_tooltip$[GetModifier('spirit_drattosi_pact_modifier').GetNameWithTooltip]\n\nDrattosi là những kẻ săn mồi khó nắm bắt, săn đuổi bất cứ ai đủ dại dột để sa vào bẫy của chúng. Chúng thông minh và có thể giao tiếp, nhưng mục tiêu chính của chúng là tiêu thụ năng lượng của kẻ khác."
 trait_spirit_ooralath: "Ooralath"
 trait_spirit_ooralath_desc: "$pact_tooltip$[GetModifier('spirit_ooralath_pact_modifier').GetNameWithTooltip]\n\nOoralath từng là tôi tớ của Weaver. Giờ đây chúng lang thang khắp vùng đất hoang của Umbra, hủy diệt mọi thực thể phi-Wyrm mà chúng gặp phải."
 trait_spirit_nocturna: "Nocturna"
 trait_spirit_nocturna_desc: "$pact_tooltip$[GetModifier('spirit_nocturna_pact_modifier').GetNameWithTooltip]\n\nNocturna, hay Mụ Phù Thủy Đêm, là kẻ bóp méo hy vọng và giấc mơ. Chúng săn tìm những kẻ đang say ngủ rồi vặn xoắn giấc mơ của họ thành ác mộng đen tối."
 trait_spirit_raptor: "Raptor"
 trait_spirit_raptor_desc: "$pact_tooltip$[GetModifier('spirit_raptor_pact_modifier').GetNameWithTooltip]\n\nRaptor hút năng lượng từ dục vọng nhục dục, không phải sự thu hút và trìu mến thông thường mà là sự tuyệt vọng và chinh phục."
 trait_spirit_harpy: "Harpy"
 trait_spirit_harpy_desc: "$pact_tooltip$[GetModifier('spirit_harpy_pact_modifier').GetNameWithTooltip]\n\nĐược tạc từ tinh chất của những linh thể Chim Ưng bị bắt giữ, Harpy là nỗi kinh hoàng của bầu trời. Tà Linh này thích đánh cắp đồ vật và cấy chúng ở nơi khác để gieo rắc hỗn loạn trong cộng đồng."
 trait_spirit_rotwalker: "Rot Walker"
 trait_spirit_rotwalker_desc: "$pact_tooltip$[GetModifier('spirit_rotwalker_pact_modifier').GetNameWithTooltip]\n\nRot Walker là linh thể của sự mục rữa: không phải cái chết, mà là sự đồi bại theo sau nó, không phải sự kết thúc, mà là những hồi kết dang dở bị bỏ mặc cho thối rữa."

 trait_spirit_seeder: "Seeder"
 trait_spirit_seeder_desc: "Seeder là những Tà Linh cực kỳ hung tàn, du hành một mình. Mục đích của chúng là cưỡng ép tạo ra Fomori."
 trait_spirit_dreammaker: "Dream Maker"
 trait_spirit_dreammaker_desc: "Dream Maker tồn tại để làm sa đọa những kẻ cay đắng và giận dữ, ban cho họ ước muốn của mình và giúp những kẻ chúng hỗ trợ đạt được quyền lực."
 trait_spirit_nihilach: "Nihilach"
 trait_spirit_nihilach_desc: "Nihilach là Tà Linh của Hư Vô, sự hủy diệt chờ đợi phía sau cơn đói của Wyrm. Một số tin rằng chúng chính là linh thể của Ngày Tận Thế."
 trait_spirit_shatteredhart: "Shattered Hart"
 trait_spirit_shatteredhart_desc: "Được tạc từ tinh chất của những linh thể Hươu Đực bị bắt giữ, Shattered Hart tìm nguồn sống trong đau khổ và khốn cùng. Điên loạn và bạo lực, những Hart này lang thang khắp lãnh địa săn mồi của mình, tấn công bất cứ thứ gì sẽ chấm dứt nỗi khốn cùng mà chúng đắm chìm trong đó."

 trait_spirit_smog: "Tà Linh Nguyên Tố Sương Khói"
 trait_spirit_smog_desc: "$pact_tooltip$[GetModifier('spirit_smog_pact_modifier').GetNameWithTooltip]\n\nMột trong bốn Nguyên Tố Wyrm bị ô uế. Những nguyên tố khí bị hủ hóa này được cho là cấu thành từ phần khí của thân thể Wyrm và đại diện cho lý trí cùng trí tuệ của nó."
 trait_spirit_balefire: "Tà Linh Nguyên Tố Lửa Ma"
 trait_spirit_balefire_desc: "$pact_tooltip$[GetModifier('spirit_balefire_pact_modifier').GetNameWithTooltip]\n\nMột trong bốn Nguyên Tố Wyrm bị ô uế. Những nguyên tố lửa bị hủ hóa này được cho là hình thành từ máu của Wyrm và đại diện cho trực giác cùng ý chí của nó."
 trait_spirit_sludge: "Tà Linh Nguyên Tố Bùn Nhơ"
 trait_spirit_sludge_desc: "$pact_tooltip$[GetModifier('spirit_sludge_pact_modifier').GetNameWithTooltip]\n\nMột trong bốn Nguyên Tố Wyrm bị ô uế. Những nguyên tố đất bị hủ hóa này được cho là cấu thành từ phần rắn của thân thể Wyrm và đại diện cho nhận thức cùng cảm giác thể xác của nó."
 trait_spirit_toxin: "Tà Linh Nguyên Tố Độc Tố"
 trait_spirit_toxin_desc: "$pact_tooltip$[GetModifier('spirit_toxin_pact_modifier').GetNameWithTooltip]\n\nMột trong bốn Nguyên Tố Wyrm bị ô uế. Những nguyên tố nước bị hủ hóa này được cho là hình thành từ chất lỏng bên trong thân thể Wyrm và đại diện cho những cảm xúc hoang dại của nó."


 trait_spirit_werewolf: "Tổ Tiên Người Sói"
 trait_spirit_werewolf_desc: "$pact_tooltip$[GetModifier('spirit_werewolf_pact_modifier').GetNameWithTooltip]\n\n$trait_spirit_desc$"
 trait_spirit_bastet: "Tổ Tiên Bastet"
 trait_spirit_bastet_desc: "$pact_tooltip$[GetModifier('spirit_bastet_pact_modifier').GetNameWithTooltip]\n\n$trait_spirit_desc$"
 trait_spirit_mokole: "Tổ Tiên Mokolé"
 trait_spirit_mokole_desc: "$pact_tooltip$[GetModifier('spirit_mokole_pact_modifier').GetNameWithTooltip]\n\n$trait_spirit_desc$"

 trait_spirit_human_desc: "$pact_tooltip$[GetModifier('spirit_human_pact_modifier').GetNameWithTooltip]\n\n$trait_spirit_desc$"

 trait_faction: "Phe Phái"
 trait_aspect: "Diện Mạo"
 trait_entomos_breed: "Dòng Sinh"
 trait_clade: "Chi Phái"
 trait_myrmidon: "Myrmidon"
 trait_myrmidon_desc: "Là Binh Sĩ, Trinh Sát, Tướng Lĩnh, và Gián Điệp của Éntomos, Myrmidon là Phe Phái thiên về chiến đấu của Éntomos."
 trait_viskr: "Viskr"
 trait_viskr_desc: "Là Hiền Triết, Thẩm Phán, Nhà Huyền Bí Học, và Nhà Ngoại Cảm của Éntomos, Viskr là Phe Phái cai trị và chuyên môn của Éntomos."
 trait_wyrsta: "Wyrsta"
 trait_wyrsta_desc: "Là Kẻ Lừa Lọc, Triết Gia, Kẻ Bất Đồng, và Kẻ Tạo Hình của Éntomos, Wyrsta là những nhân tố xúc tác cho sự thay đổi trong lòng Éntomos."
 trait_succor: "Succor"
 trait_succor_desc: "Là Người Chữa Lành, Nhà Trị Liệu, Cố Vấn, và Người Khuyên Bảo của Éntomos, Succor là một Phe Phái quý giá được định hình bởi sự đồng cảm và thấu hiểu."
 trait_tenere: "Tenere"
 trait_tenere_desc: "Ananasi theo phe Weaver, Tenere có quyền năng và khả năng tập trung vào ký ức, thời gian, và Gauntlet."
 trait_kumoti: "Kumoti"
 trait_kumoti_desc: "Ananasi theo phe $glossary_wyld$, Kumoti có những món quà tập trung vào tái sinh và nguyên tố, có thể vận dụng dòng chảy như những Món Quà."
 trait_hatar: "Hatar"
 trait_hatar_desc: "Ananasi theo phe $glossary_wyrm$, Hatar là những kẻ quyến rũ khét tiếng và người vận dụng hoại diệt, biến máu của mình thành thuốc độc và đánh vào Wyrm từ bên trong."
 trait_human_born: "Homid"
 trait_human_born_desc: "Éntomos sinh ra từ Con Người, Homid Éntomos gây rối loạn Linh Thể và là những Fera tài giỏi nhất trong số chúng. Homid Éntomos là loại Éntomos hiếm gặp nhất, do thời gian tương đối dài để chúng trải qua Lần Biến Đổi Đầu Tiên."
 trait_macro_born: "Macroborn"
 trait_macro_born_desc: "Éntomos sinh ra từ những sinh vật lớn hơn trong Chi Phái của chúng, Macroborn là những titan quyền năng của giống loài mình, nhấn mạnh hình dạng to lớn của chúng trong vinh quang hủy diệt thuần túy."
 trait_micro_born: "Microborn"
 trait_micro_born_desc: "Éntomos sinh ra từ những sinh vật nhỏ hơn trong Chi Phái của chúng, Microborn là những kẻ xâm nhập lẩn tránh và nhanh nhẹn, tinh thông hình dạng nhỏ bé của mình để vừa có thể ở bất cứ đâu vừa thoát khỏi mọi tình huống."
 trait_fera_born: "Manipulator"
 trait_fera_born_desc: "Éntomos sinh ra giữa các Éntomos trong trứng được ấp bởi một sinh vật thông minh, Manipulator là bậc thầy bẩm sinh của Dạng Chiến Trận, đồng thời cũng là những nhà trung gian giỏi nhất giữa các Thuộc Địa của mình."
 trait_titan_born: "Titanborn"
 trait_titan_born_desc: "Dòng Sinh đáng sợ nhất, những Titanborn kinh hoàng là Quái Vật của Ananasa, những cỗ máy hủy diệt khủng khiếp gợi lên chứng Mê Sảng ở mọi kẻ phi-Éntomos."

 trait_eshieho: "Eshieho"
 trait_eshieho_desc: "Những Đứa Con Trưởng của C'et, Eshieho là các Bậc Thầy Kiến Tạo và Trung Gian của bà, vùng trung dung thoải mái giữa các C'etite mang hình dạng Tôm Càng."
 trait_mishaho: "Mishaho"
 trait_mishaho_desc: "Những Đứa Con Giữa của C'et, Mishaho là các Đại Sứ và Người Lao Động của bà, mang hình dạng linh hoạt của Cua để lo liệu cho sự thịnh vượng của C'et."
 trait_bahaesh: "Bahaesh"
 trait_bahaesh_desc: "Những Đứa Con Út của C'et, Bahaesh Tôm Hùm là các Nhà Vô Địch bền bỉ và Người Phòng Thủ Bất Khuất của bà, tinh thông đôi càng khổng lồ của mình để nghiền nát kẻ thù của C'et."
 trait_ishihambi: "Ishihambi"
 trait_ishihambi_desc: "Những Lãnh Chúa Được Chọn của các Giống Loài Côn Trùng, Ishihambi là một Chi Phái rất hiếm, đã giả chết trước toàn thế giới để tập trung vào cuộc chiến bất tận của mình chống lại Ka Luon và Zigg'raugglur. Để hỗ trợ cuộc thám hiểm không ngừng của mình vào [umbra|E], chúng mang hình dạng của loài Bướm Đêm cao quý."
 trait_iqhawe: "Iqhawe"
 trait_iqhawe_desc: "Những Nhà Vô Địch Được Chọn của các Giống Loài Côn Trùng, Iqhawe là những hiệp sĩ áo giáp sáng ngời của họ, tinh thông một loạt Món Quà để đứng vững trước bất cứ điều gì đe dọa $glossary_weaver$. Xứng đáng là Bậc Thầy Kiếm của bà, những nhà vô địch của Weaver mang hình dạng Bọ Ngựa làm Chi Phái của mình."
 trait_umakhi: "Umakhi"
 trait_umakhi_desc: "Những Nhà Xây Dựng Được Chọn của các Giống Loài Côn Trùng, Umakhi là kiến trúc sư của những công trình vĩ đại nhất thuộc Đế Chế Bóng Tối thời cổ đại, dựng nên những tượng đài trường tồn cho vinh quang của $glossary_weaver$. Để hỗ trợ nhiệm vụ này, chúng mang hình dạng Mối để xây dựng di sản của mình."
 trait_umlimi: "Umlimi"
 trait_umlimi_desc: "Những Kẻ Đột Kích Được Chọn của các Giống Loài Côn Trùng, Umlimi là tai họa giáng xuống bất cứ ai chống lại chúng, tấn công trong hình dạng bầy đàn tinh thông của mình và nuốt chửng mọi thứ trước mặt. Đương nhiên, là sứ giả của nạn đói, chúng nhận Châu Chấu và các loài Cào Cào khác làm thân tộc."
 trait_umbulali: "Umbulali"
 trait_umbulali_desc: "Những Kẻ Tàn Sát Được Chọn của các Giống Loài Côn Trùng, Umbulali là những sát thủ đáng sợ và ngập tràn phẫn nộ của các Giống Loài Côn Trùng, mang hình dạng Ong Bắp Cày để phù hợp hơn với cơn thịnh nộ lạnh lùng của mình khi hủy diệt kẻ thù của $glossary_weaver$."
 trait_umhloli: "Umhloli"
 trait_umhloli_desc: "Những Binh Sĩ Được Chọn của các Giống Loài Côn Trùng, Umhloli đông đảo vô kể và thích nghi tốt, đa dạng như chính thân tộc Kiến của mình để hỗ trợ bà con trong việc làm giàu và bảo vệ $glossary_weaver$."
 trait_injiki: "Injiki"
 trait_injiki_desc: "Những Nhà Nông Học Được Chọn của các Giống Loài Côn Trùng, Injiki nổi danh trong giới Éntomos vì mật ong quý giá và phong phú của mình, tinh thông thân tộc Ong để tạo ra mật ong bổ dưỡng nuôi sống các Đế Chế Éntomos."
 trait_kstyw: "Kstyw"
 trait_kstyw_desc: "Giống Loài Côn Trùng trẻ nhất và là những kẻ từng bị lưu đày từ lâu, bị xóa khỏi mọi ghi chép, Kstyw là những Éntomos Bọ Cánh Cứng ngoan cường và bền bỉ đến cùng cực, phát triển mạnh nhờ tình đồng đội và sức chịu đựng trước những hiểm họa bủa vây họ."