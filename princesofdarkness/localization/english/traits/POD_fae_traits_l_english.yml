 trait_art_verdage_advanced_desc: "Verdage, một trong hai Sliver của Earth, chi phối sự sống và vật chất hữu cơ, đặc biệt là những gì cấu thành thực vật. Mọi Inanimae biết Verdage đều có thể nhận diện ngay lập tức sinh vật thực vật mà chúng nhìn thấy."
 trait_art_tieh_tan_advanced: "Tinh Thông Tieh Tan"
 trait_art_tieh_tan_advanced_desc: "Nguyên tố Kim bao gồm mọi kim loại quý và kim loại dùng để chế tác: vàng, bạc, sắt, đồng thau, và thép. Dù phạm vi của nó khá hạn hẹp so với Water hay Earth, công dụng áp đảo của nó là để chế tạo công cụ, đặc biệt cho chiến tranh. Bậc thầy của Kim có thể là những nghệ nhân tài ba hoặc những chiến binh bất khả xâm phạm."
 trait_art_lin_tan_advanced: "Tinh Thông Lin Tan"
 trait_art_lin_tan_advanced_desc: "Mộc tượng trưng cho sức mạnh của thế giới tự nhiên và, do đó, có quyền năng lên phần lớn thế giới. Các hiện tượng tự nhiên gắn với nó là mọi loại thực vật, tuổi trẻ, sức khỏe, và sự sinh trưởng."
 trait_art_shui_tan_advanced: "Tinh Thông Shui Tan"
 trait_art_shui_tan_advanced_desc: "Shui Fu, hay Bộ Thủy, là thế lực quyền năng nhất, kín đáo nhất, nhưng cũng kém hiệu quả nhất trong Trung Vương Quốc. Bậc thầy của Thủy vừa bị khiếp sợ vừa được tôn kính, nhưng phần lớn phục tùng chỉ vì sợ hãi.\nThủy là một trong những nguyên tố quyền năng nhất. Nó bao trùm mọi thứ ở dạng lỏng và khí: mây, khí mêtan, nước, máu, v.v... Thủy vốn dĩ vừa thiết yếu vừa nguy hiểm và lừa dối. Nó cũng kiểm soát gió và bão, nhưng không kiểm soát sấm sét."
 trait_art_hou_tan_advanced: "Tinh Thông Hou Tan"
 trait_art_hou_tan_advanced_desc: "Bậc thầy của Hỏa là những đối thủ tinh ranh và những nhà cai trị năng động. Họ có xu hướng không thể nghỉ ngơi và luôn tìm kiếm hoạt động, dấn thân. Hỏa gắn liền với sấm chớp, ánh sáng, ngọn lửa và mọi năng lượng khả kiến khác. Nó xuất hiện trong bão tố, ngọn lửa trần, màn hình máy tính, và dung nham rực cháy."
 trait_art_di_tan_advanced: "Tinh Thông Di Tan"
 trait_art_di_tan_advanced_desc: "Bậc thầy của Di Tan thường là những mưu sĩ khôn ngoan hay, đôi khi, những quan lại đáng sợ. Người Yü đặc biệt coi Bậc thầy của Thổ là những nhà cai trị sáng suốt, cân bằng. Nhiều hsien sẽ quy tụ dưới ngọn cờ vàng của một người như thế.\nThổ tượng trưng cho mọi loại đá, đất, sỏi, đá quý, và khoáng vật. Thổ là trung tâm của mọi nguyên tố và là trục xoay trong quan niệm của người Trung Hoa về thế giới. Nó tượng trưng cho chính Trung Vương Quốc."
 trait_art_nei_tan_advanced: "Tinh Thông Nei Tan"
 trait_art_nei_tan_advanced_desc: "Trong cách nói thông thường của Hsien, Nei Tan là "Nội Đan," pháp thuật Đạo giáo Wu Tan mà các shinma theo đuổi [Glossary('Tao Te Hsien','game_concept_tao_te_hsien_desc')] tu luyện."
 
 trait_faerie_eternity: "Vĩnh Hằng Tiên Tộc"
 trait_faerie_eternity_desc: "Sau khi bạn trải qua Chrysalis, bạn đã có một sinh nhật, rồi một sinh nhật khác, rồi lại một sinh nhật khác nữa. Thế nhưng có điều gì đó kỳ lạ - bạn dường như không lớn lên hay già đi. Bạn được chạm tới một tàn tích của sự bất tử vốn từng là quyền thừa kế bẩm sinh của mọi fae."
 
 trait_prodigal: "Prodigal"
 trait_enchanted_dreamers: "Enchanted Dreamer"
 trait_dark_chimera: "Dark Chimera"
 trait_prodigal_vampire_desc: "Ma cà rồng đầu tiên là một Redcap Unseelie thời xa xưa, kẻ đã thề lời thề máu kết nghĩa huynh đệ với đối thủ Sidhe Seelie của mình sau khi không ai thắng được ai trong chiến đấu. Họ trở thành huynh đệ, và lập nên những chiến công lẫy lừng; nhưng, khi họ giết một con rồng, Sidhe đã giành hết công lao. Phẫn nộ, Redcap cắn đứt đầu kẻ từng là đối thủ ngay trước mặt Vua của cõi đó, phá vỡ lời thề của mình. "Máu là tội lỗi của hắn, máu là di sản của hắn, và vì thế máu sẽ là cội nguồn quyền năng của hắn," câu chuyện kể lại như vậy, và hắn bị nguyền rủa thành ma cà rồng, không bao giờ được biết đến [UmbraGlossary('dreaming')] một lần nào nữa."
 trait_prodigal_mage_desc: "Pháp sư là phàm nhân, nhưng là những kẻ đã Tỉnh Thức để nhận thức được [UmbraGlossary('dreaming')], và pháp thuật cùng tài năng liên quan tới [UmbraGlossary('dreaming')] của họ mạnh mẽ hơn nhiều so với Kithain. Thần thoại Changeling kể rằng họ là hậu duệ của bốn đứa trẻ rơi từ trên trời xuống và tiêu diệt những đội quân hùng mạnh của các quý tộc fae đã phát hiện ra chúng. Những đứa trẻ đó là Té Điên Cuồng (mẹ của biến đổi), Li Bóng Tối (mẹ của cân bằng), Ihenn Thợ Rèn Sắt (cha của tĩnh tại) và Chla Không Ràng Buộc (cha của suy tàn)."
 trait_prodigal_fera_desc: "Người sói và những $glossary_fera$ khác là hậu duệ của những fae, vì không muốn từ bỏ hoàn toàn quyền tự do biến hình mà fae từng có trong những ngày xưa cũ, đã chọn mang thêm hình dạng thú vật bên cạnh hình dạng người. Những fae này gần gũi nhất với Đất Mẹ, và khi một Bóng Tối vĩ đại và khủng khiếp trỗi dậy nuốt chửng vùng đất, họ đã sốt ruột rời bỏ những hội đồng hoạch định vô hiệu của fae để lao thẳng vào trận chiến chống lại kẻ thù. Dù đã thành công ngăn chặn chiến thắng của Bóng Tối, họ đã phải trả một cái giá lớn - mất đi mọi giấc mơ của mình, chỉ còn lại giấc mơ chiến trận."
 trait_prodigal_demon_desc: "House Balor tự nhận mình là chuyên gia về ác quỷ và các thực thể quỷ dữ, tuyên bố chịu trách nhiệm về việc triệu hồi và giam cầm lịch sử nhiều sinh vật như vậy trong các cuộc chiến của họ chống lại Triều đình Fomorian. House Balor khẳng định lũ quỷ từng là fae cổ xưa vào thời Mùa Đông còn ngự trị thế gian, nhưng thời đại của chúng đã qua, và chúng bị đày vào một mê cung trong [UmbraGlossary('deep_dreaming')]. Việc chúng thoát ra chỉ được cho phép khi nhu cầu trở nên tuyệt vọng."
 trait_prodigal_wraith_desc: "Ma là dark chimera, nhưng là loại chimera tự tạo thành từ ký ức của những kẻ đã chết. Chỉ những linh hồn sáng tạo, giàu trí tưởng tượng và nhiệt huyết nhất mới được tái tạo trong thực tại ảo giác đen tối gọi là [UmbraGlossary('shadowlands')]. (Ngoài góc nhìn hơi khác biệt này, Changeling - nhờ vào Sluagh - có một hiểu biết khá chính xác về oan hồn.)"
 trait_prodigal_mummy_desc: "Ghi chép của Eshu khẳng định xác ướp từng là những phàm nhân được phù phép trở thành một với thực tại ảo giác của [UmbraGlossary('dreaming')]. Những kẻ được phù phép này đã thề nguyện với những vị Arcadian vĩ đại và cao quý, và qua những khế ước được ấn định trong thể xác lẫn linh hồn, họ trở nên vĩnh viễn tận trung với sự nghiệp của các vị thần fae của mình. Thể xác họ sẽ không bao giờ mục rữa, và linh hồn họ sẽ không bao giờ rời đi, chừng nào họ còn phụng sự chủ nhân và duy trì cân bằng giữa cõi phàm tục và cõi siêu việt."

 trait_agemo: "Agemo"
 trait_agemo_desc: "Trong cách nói thông thường của Eshu, Agemo nghĩa đen là tắc kè hoa. Từ này được Elegbara dùng cho kinain của họ vì chúng hòa lẫn được với cả xã hội tiên tộc lẫn xã hội phàm nhân."
 trait_itiyere: "Itiyere"
 trait_itiyere_desc: "Trong giới Eshu, Itiyere là một tiếng lóng hiếm gặp để chỉ Sidhe, bắt nguồn từ những nhân vật nghi lễ truyền thống có đôi tai dài cường điệu."
 trait_orisha_oko: "Orisha-Oko"
 trait_orisha_oko_desc: "Orisha-Oko là orisha của nông nghiệp và bếp lửa gia đình. Eshu gọi kith Boggan bằng tên này hoặc bằng tên rút gọn Oko."
 trait_taiyewo: "Taiyewo"
 trait_taiyewo_desc: "Trong cách nói thông thường của Eshu, Taiyewo nghĩa là "anh/chị cả trong cặp song sinh." Đây là tên gọi Elegbara dành cho kith Clurichaun. Xem thêm Ibeji và Kehinde."
 trait_iroko: "Iroko"
 trait_iroko_desc: "Trong cách nói thông thường của Eshu, Iroko là một loại cây sồi và cũng là một orisha nhỏ. Đây cũng là tên gọi Elegbara dành cho kith Ghille Dhu."
 trait_olokuta: "Olokuta"
 trait_olokuta_desc: "Olokuta là Orisha của đá. Đây cũng là tên gọi Eshu dành cho kith Nocker."
 trait_kehinde: "Kehinde"
 trait_kehinde_desc: "Trong cách nói thông thường của Eshu, Kehinde có nghĩa là em út trong cặp song sinh. Đây cũng là tên gọi Elegbara dành cho kith Piskey. Xem thêm Ibeji và Taiyewo."
 trait_ijapa: "Ijapa"
 trait_ijapa_desc: "Trong cách nói thông thường của Eshu, Ijapa nghĩa đen là con rùa và là con vật bịp bợm trong truyền thuyết Yoruba. Đây là tên gọi Elegbara dành cho kith Pooka."
 trait_jakuta: "Jakuta"
 trait_jakuta_desc: "Trong cách nói thông thường của Eshu, Jakuta là một danh xưng tôn vinh dành cho vị orisha sấm sét Shango, nghĩa là "Kẻ Ném Đá." Đây là tên gọi Elegbara dành cho kith Troll."
 trait_oshosi: "Oshosi"
 trait_oshosi_desc: "Oshosi, hay Oxóssi, là orisha của săn bắn, rừng rậm, muông thú hoang dã, và của cải. Ngài cũng gắn liền với các bữa ăn. Màu sắc của ngài là xanh dương và xanh lá. Eshu dùng tên này cho kith Redcap."
 trait_olu_igbo: "Olu-Igbo"
 trait_olu_igbo_desc: "Olu-Igbo là Orisha của bụi rậm và hoang dã. Trong cách nói thông thường của Eshu, đây cũng là từ chỉ kith Satyr."
 trait_sonponno: "Sonponno"
 trait_sonponno_desc: "Sonponno hay Sopona, là Orisha của đậu mùa và, mở rộng ra, các bệnh dịch khác, đặc biệt là những bệnh gây lở loét hay tổn thương da. Những tên gọi khác gồm Babalú-Ayé và danh xưng tôn vinh Ile-Titu. Eshu dùng tên này cho kith Sluagh, xuất phát từ ngoại hình của họ chứ không mang hàm ý miệt thị."
 
 trait_domovoi: "Domovoi"
 trait_domovoi_desc: "Một fae quyền năng của nơi cư ngụ, một domovoi thường mang dáng vẻ của một người được kính trọng trong gia đình để nói chuyện với những kẻ mà tổ ấm của họ được nó canh giữ. Nó biết hầu hết bí mật của tổ ấm mình. Nếu không được tôn trọng đúng mực và thường xuyên, domovoi có thể tiết lộ những bí mật này cho kẻ thù."
 trait_leshii: "Leshii"
 trait_leshii_desc: "Linh thể có sừng của rừng già, leshii trông như sự kết hợp giữa một cây cổ thụ phủ đầy rêu và một con người có gạc. Chúng gọi thủ lĩnh của mình là "Chúa Tể Rừng Già.""
 trait_kikimora: "Kikimora"
 trait_kikimora_desc: "Fae hữu ích nhất trong gia đình, kikimora làm những việc nhà như dệt vải và các việc vặt khác. Bất cứ ai nhìn thấy chúng làm việc nên chắc chắn khen ngợi tài năng của chúng, nếu không có thể thấy bánh mì bị cháy, quần áo bị buộc thắt nút, hay bình đựng bị đổ đầy giấm để trả đũa."
 trait_polevik: "Polevik"
 trait_polevik_desc: "Sum suê và gợi cảm, những tinh linh đồng ruộng này, cả nam lẫn nữ, tìm thấy sự mê hoặc trong các nghi lễ phồn thực khác nhau được thực hành bởi những ai hiểu được mối liên hệ giữa tình dục và việc cày xới đất đai màu mỡ."
 trait_vodyanoi: "Vodyanoi"
 trait_vodyanoi_desc: "Những Inanimae hay đổi tính của hồ và ao này thân thiện với những ai sử dụng các Anchor mà chúng bảo vệ, miễn là chúng nhận được quà tặng và sự tôn trọng. Rắc rối theo sau những kẻ không biết ơn đúng cách và không rưới thêm chút vodka xuống nước thỉnh thoảng. Vodyanoi lật úp thuyền của những ai không đối xử phải phép với chúng. Bất cứ ai cố tình khinh thường chúng nên nhớ tránh xa mặt nước nếu muốn sống sót, vì vodyanoi có thể triệu sấm sét giáng xuống những kẻ chúng không ưa."
 trait_berenginy: "Berenginy"
 trait_berenginy_desc: "Những tinh linh xinh đẹp với mái tóc đen buông dài, những fae yêu kiều này ca hát để dụ dỗ người tình đến gần nhưng đôi khi không muốn buông tha họ. Chúng cư ngụ dọc theo bờ sông và sẽ kéo những kẻ ngưỡng mộ mình xuống để ở lại mãi mãi cùng chúng trong làn nước đục ngầu ven bờ. Nhiều russalka đã ra đời theo cách này. Nếu không nhờ sự khôn ngoan và khả năng biết được hầu hết mọi chuyện xảy ra dọc con sông chúng phụng sự, những hiểm nguy khi tìm đến chúng sẽ vượt xa mọi lợi ích."
 trait_bannik: "Bannik"
 trait_bannik_desc: "Linh thể của nhà tắm, bannik thường trở nên ác ý nếu không được đối xử với sự tôn kính và không được dành cho lượt tắm cuối cùng trong đêm. Bannik giúp đỡ những ai chúng ưu ái bằng cách ban cho họ những linh ảnh trong làn nước chúng kiểm soát."
 trait_dvorovoi: "Dvorovoi"
 trait_dvorovoi_desc: "Một tinh linh thú vật của sân vườn, dvorovoi có thể rất nghịch ngợm với những ai không cho ăn hay đối xử tốt với nó. Chúng thường mang hình dạng mèo để lang thang và khám phá lãnh thổ của mình."
 
 trait_enchanted: "Được Phù Phép"
 trait_enchanted_desc: "Được truyền Glamour."
 TRAIT_FLAG_DESC_warning_enchanted_flag: "\n#X Với những kẻ không mang dòng máu fae, nhận Glamour tạm thời giảm dần #V 1#! mỗi #V 3#! tháng. Bạn sẽ mất đặc điểm này khi Glamour tạm thời của bạn về tới #V 0#!.#!"
 
 trait_patron_council: "Người Bảo Trợ"
 trait_patron_council_seeker: "Seeker"
 trait_patron_council_seeker_desc: "Phe nòng cốt được gọi là Seeker. Họ là trái tim của Hội đồng Bảo Trợ, những fae bám chặt nhất vào những huyền thoại xưa cũ về hệ thống hội đồng 'quyền lực chung'. Với cái nhìn cởi mở về mỗi Origin, và thành viên gần như được rút ra đều từ cả ba, những fae này thật sự tin vào những hệ quả tư tưởng mà quyền lực chung có thể mang lại. Seeker chủ yếu gồm những fae học giả, bảo thủ, và do đó có sự hiện diện khá kín tiếng trước công chúng. Đây là phe của Hội đồng Bảo Trợ đào sâu vào những cuốn sách huyền thoại xưa và cử người đi tìm kiếm ngay cả những tin đồn mơ hồ nhất về truyền thuyết tiên tộc lịch sử. Những hiện vật đã mất, những bản thảo mong manh kể về thời đại đã qua, thậm chí cả vũ khí và vật phẩm chế tác cổ xưa - tất cả đều là manh mối cho con đường của quá khứ, và vô giá đối với sự nghiệp của Seeker."
 trait_patron_council_vanguard: "Vanguard"
 trait_patron_council_vanguard_desc: "Vanguard chính là Người Bảo Trợ. Ít nhất, đó là những gì đa số áp đảo fae nghĩ tới khi Người Bảo Trợ được nhắc đến. Vanguard chiếm giữ một vai trò độc nhất trong Hội đồng Bảo Trợ, ở chỗ các thành viên của nó là bộ mặt công khai của tổ chức. Thay vì là một nhóm chính thức và thống nhất, Vanguard nhìn chung chỉ là những fae công khai và rõ ràng đề cao đức hạnh của Người Bảo Trợ và ủng hộ sự nghiệp của họ. Phần lớn chính khách, nhà ngoại giao, cố vấn và các ngôi sao xã hội khác của Hội đồng Bảo Trợ được xếp vào nhóm Vanguard, một cách gọi không mấy thiện cảm từ mọi kẻ bên ngoài "phe trong phe" này. Không cần phải nói, thành viên của phe này là một tập hợp đa dạng với nhiều tư tưởng và mục đích khác nhau như chính số lượng fae vốn có. Thay vì là một tập hợp gắn kết của những fae đồng thuận về quá khứ thật sự của giống loài, đại đa số Vanguard đơn giản chỉ đang chơi trò chính trị vì một mục đích duy nhất."
 trait_patron_council_austere_conclave: "Thành viên Austere Conclave"
 trait_patron_council_austere_conclave_desc: "Austere Conclave không tồn tại. Không như Seeker, những kẻ ẩn mình vì tính chất tế nhị của nhiệm vụ, Austere Conclave được che giấu khỏi mắt công chúng vì chính các thành viên của nó chủ động muốn như vậy.\nĐối với Người Bảo Trợ nói chung, Austere Conclave nguy hiểm, khó lường, không đáng tin cậy, gây bất ổn... và cực kỳ hữu ích. Đây là nguồn gốc của nhiều tin đồn xấu xa về Người Bảo Trợ - những câu chuyện về ám sát, phục kích, chặn bắt sứ giả, rò rỉ liên lạc giữa các triều đình đồng minh - tất cả những điều này và hơn thế nữa. Khi một fae thì thầm với bạn bè rằng Người Bảo Trợ đã giết Lady Davina vì bất cứ lý do gì, thì thường là, dù không hay biết, cô ta đang nhắc tới những hành động không được cho phép của Austere Conclave."

 trait_siochain: "Síocháin"
 trait_siochain_desc: "Truyền thuyết kể về những fae đã đạt được điều bất khả và tìm ra sự cân bằng tinh tế giữa bản thể phàm nhân và linh hồn tiên tộc bên trong họ. Síocháin, như cách họ được gọi, được cho là đã khám phá ra sự cân bằng giữa Glamour và Banality và nhờ đó tìm được sự bất tử đích thực."
 TRAIT_FLAG_DESC_banality_immunity: "Miễn nhiễm với Banality dưới mọi hình thức"