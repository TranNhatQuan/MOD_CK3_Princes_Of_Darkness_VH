l_english:
 trait_fae: "Fae Chân Chính"
 trait_fae_desc: "Fae Chân Chính là danh xưng dành cho bất cứ linh hồn nào sinh ra tại [UmbraGlossary('dreaming')], không phải chimera, và chưa trải qua Đạo Trao Đổi. Dù không có bản danh sách đầy đủ nào về các thực thể ấy, nó hẳn bao gồm Firstborn, Dark-kin, và có thể tính cả Inanimae."
 trait_firstbornfae: "Firstborn Fae"
 trait_firstbornfae_desc: "Firstborn sinh ra từ Sương Mù Tạo Hóa trong quá khứ xa xăm. Firstborn mới chỉ có thể là con cái của Firstborn khác, hoặc là các tinh linh được biến thành fae qua những cantrip uy lực. Firstborn tự xưng rằng chúng đã từng cai trị và thậm chí tạo ra toàn bộ thế giới, và chỉ riêng chúng mới có quyền định đoạt luật lệ và sắc lệnh của các cõi phép thuật. Dù hoài nghi, nhiều Fae vẫn chấp nhận điều đó và gọi chúng là 'True Fae'. Sự trỗi dậy của loài người đã làm suy yếu mạnh mẽ quyền lực của Firstborn, và nhiều kẻ lo sợ số phận của mình nếu không có gì được thực hiện."
 trait_denizen: "Adhene"
 trait_denizen_desc: "Kithain tùy tiện gọi những sinh vật này là "Dark-kin" vì tiếng xấu ghê tởm của chúng khi làm tôi tớ cho tộc Fomorian. Bất chấp việc rời bỏ đột ngột khỏi vùng đất loài người, tộc Adhene vẫn duy trì một mối liên hệ trực tiếp, dù kín đáo, với tâm thức con người. Hóa thân cho nhiều khía cạnh khác nhau của giấc mơ hay nỗi sợ hãi loài người, số lượng chủng loài adhene là vô cùng đa dạng và phong phú."
 trait_inanimae: "Inanimae"
 trait_inanimae_desc: "Inanimae là bà con của True Fae. Tuy không phải linh thể nguyên tố thực thụ, chúng có mối thân thuộc gần gũi với các linh thể ấy. Mỗi Inanimae tự tạo hình mình theo một nguyên tố nhất định."
 trait_changeling: "Đứa Trẻ Bị Tráo"
 trait_changeling_desc: "Giống lai giữa tiên và người. Các Triều đình cổ xưa tin rằng Người Đàn Bà Đầu Tiên đến chung giường với Người Đàn Ông Đầu Tiên vốn là một trong những Firstborn. Từ sự kết hợp giữa hai kẻ ấy, đứa trẻ bị tráo đầu tiên ra đời, dẫu cặp đôi này còn có thêm con và Người Đàn Bà Đầu Tiên còn có những kẻ khác nữa. Những lối giải thích khác, nhất là từ các fae bài xích loài người, cho rằng Đứa Trẻ Bị Tráo là phần sót lại của những fae dị dạng và không ai muốn, bị đem đổi lấy trẻ con người phàm rồi lớn lên giữa họ."
 trait_kinain: "Kinain"
 trait_kinain_desc: "Kinain là phàm nhân mang trong mình dòng máu tiên tộc, nhưng chưa phải là một Changeling đầy đủ."
 trait_hsien: "Hsien"
 trait_hsien_desc: "Thời cổ xưa, các fae của Trung Hoa từng làm sứ giả và tôi tớ của [spirit_world|E]. Những ngày ấy, chúng tự do qua lại giữa cõi linh hồn và cõi xác thịt, là những đặc phái viên của thiên nhiên, là người canh giữ và bảo hộ những nơi linh thiêng. Hsien là hậu duệ của những sinh thể từng bị mắc kẹt trong cõi xác thịt. Bị chia rẽ bởi cả hình dạng lẫn triều đình, Hsien phải vật lộn để tồn tại giữa một thế giới của phàm nhân đã quay lưng với cõi linh hồn, một thế giới đầy rẫy những sinh thể siêu nhiên khác chỉ chực hủy diệt chúng."

 trait_kithain: "Kithain"
 trait_jinn: "Jinn"
 trait_african_kiths: "African Kiths"
 trait_phyla: "Phyla"
 
 trait_sidhe: "Sidhe"
 trait_sidhe_desc: "Những nhà cai trị cao quý và tuyệt mỹ của tiên tộc, Sidhe là những lãnh chúa tiên tộc kiểu mẫu, đẹp đẽ tựa cõi khác."
 trait_boggan: "Boggan"
 trait_boggan_desc: "Thực tế và chăm chỉ, Boggan là những kẻ trông coi gia đình và những người nội trợ cần mẫn."
 trait_clurichaun: "Clurichaun"
 trait_clurichaun_desc: "Vui vẻ và lôi cuốn, những Kithain này là nguồn gốc của các truyền thuyết về yêu tinh leprechaun."
 trait_eshu: "Eshu"
 trait_eshu_desc: "Những kẻ lang thang tột bậc, Eshu là những nhà kể chuyện và nhà thám hiểm bậc thầy."
 trait_ghilledhu: "Ghille dhu"
 trait_ghilledhu_desc: "Linh thể của cây cối và thiên nhiên, Ghille dhu từng là những sinh vật hưng thịnh biến đổi bản tính theo từng mùa."
 trait_oba: "Oba"
 trait_oba_desc: "Những nhà quý tộc của tộc Elegbara, họ hàng gắn bó với đất đai của Eshu."
 trait_nocker: "Nocker"
 trait_nocker_desc: "Những kẻ cộc cằn miệng lưỡi thô lỗ này có thể nhỏ bé và kỳ dị khi nhìn vào, nhưng nhu cầu chế tác và xây dựng khiến chúng trở thành những nhà phát minh tài ba của xã hội Kithain."
 trait_piskey: "Piskey"
 trait_piskey_desc: "Piskey là một kith ngây thơ, mắt tròn xoe, gồm những kẻ lang thang bẩm sinh luôn tìm kiếm vẻ đẹp diễm lệ và kỳ vĩ của thế giới."
 trait_pooka: "Pooka"
 trait_pooka_desc: "Là những kẻ tinh nghịch trong trường hợp tốt nhất và nỗi kinh hoàng trong trường hợp xấu nhất, mỗi Kithain này đều có mối gắn kết với một loài vật nhất định và say mê những trò đùa tai quái."
 trait_troll: "Troll"
 trait_troll_desc: "Những người khổng lồ uy dũng này hiện thân cho lòng trung thành, danh dự, và sức mạnh của tiên tộc."
 trait_redcap: "Redcap"
 trait_redcap_desc: "Những Kithain gớm ghiếc này là những cỗ máy ăn uống quái dị, khiếp đảm khi nhìn vào và đầy thái độ hung hãn, bạo lực."
 trait_riverhag: "River Hag"
 trait_riverhag_desc: "Những fae sũng nước này sống trong các dòng nước chảy xiết và kéo con mồi vô tình xuống để dìm chết."
 trait_satyr: "Satyr"
 trait_satyr_desc: "Satyr là hiện thân của khoái lạc và đam mê."
 trait_sluagh: "Sluagh"
 trait_sluagh_desc: "Những fae bí ẩn và u tối này giỏi nhất trong việc thu thập tin tức và canh giữ bí mật."
 trait_swanmaiden: "Swan Maiden"
 trait_swanmaiden_desc: "Swan Maiden là một kith mới xuất hiện gần đây, sinh ra từ những giấc mơ lãng mạn và tình yêu đích thực."
 trait_wichtel: "Wichtel"
 trait_wichtel_desc: "Thợ mỏ và những người lao động khác là nền tảng của một cộng đồng vì họ làm những việc phải hoàn thành cho dù khó chịu đến đâu, dấn thân vào bóng tối và hiểm nguy để tìm kiếm tài nguyên mà xã hội phụ thuộc vào, và thực hiện những công việc nguy hiểm, nặng nhọc mà không mong cầu danh vọng hay tài sản. Việc phải xong vì nó buộc phải xong. Wichtel hiện thân cho lối sống ấy."
 trait_ifrit: "Ifrit"
 trait_ifrit_desc: "Được tôi luyện trong lửa và dày dạn trận mạc, Ifrit chẳng mấy kiên nhẫn với sự yếu đuối."
 trait_lilin: "Lilin"
 trait_lilin_desc: "Ngang bướng và quyến rũ, một Lilin biết rõ mình muốn gì và cách để đạt được nó."
 trait_qareen: "Qareen"
 trait_qareen_desc: "Qurana’ có được món quà lẫn lời nguyền của trí nhớ siêu phàm, và các Jinn khác gọi họ là “thư viện biết đi.”"
 trait_shaytan: "Shaytan"
 trait_shaytan_desc: "Kẻ mặc cả, kẻ bịp bợm, ả quyến rũ, tên bịp - đó là những nhãn mác gắn cho một Shaytan."
 trait_biloko: "Biloko"
 trait_biloko_desc: "Kith này đề cao giá trị của truyền thống và di sản, gắn bó chặt chẽ với văn hóa và cộng đồng của mình, đồng thời cảnh giác với người ngoài."
 trait_djedi: "Djedi"
 trait_djedi_desc: "Yêu thích xã giao, tiệc tùng và vui chơi, Djedi là những ngôi sao tức thời tài giỏi về pháp thuật chẳng kém gì bị nguyền rủa bởi sự phô trương."
 trait_kuino: "Kuino"
 trait_kuino_desc: "Đầy hy vọng, tham vọng, và siêng năng - kith này được cấu thành từ khát khao đạt tới thành công và cuộc sống tốt đẹp hơn, dù họ phải đề phòng lòng tham và việc đánh mất những vật thiêng liêng trên hành trình ấy."
 trait_obambo: "Obambo"
 trait_obambo_desc: "Kith này gồm những nhà thám hiểm và phiêu lưu tài ba, thông thạo mọi mánh khóe để khám phá Vùng Đất Giấc Mơ Cổ Xưa và thoát thân cùng chiến lợi phẩm, tuy trông có vẻ dễ mến nhưng lại nguy hiểm khi người thân yêu của họ bị đe dọa." 
 trait_okubili: "Okubili"
 trait_okubili_desc: "Điềm tĩnh và gắn kết với những kiếp trước, luôn chú tâm giữ cân bằng trong mọi kiếp sống hiện tại, kith này yêu thích việc dạy dỗ nhưng đôi khi lại sa vào những mối bận tâm của kiếp trước." 
 trait_chuihyu: "Chu-ih-yu"
 trait_chuihyu_desc: "Một Kwannon-jin của Hsien Đông phương, Chu-ih-yu là quý tộc nguyên tố; Kamuii Shinma thuộc nguyên tố Kim." 
 trait_chujung: "Chu Jung"
 trait_chujung_desc: "Một Kwannon-jin của Hsien Đông phương, Chu Jung là quý tộc nguyên tố; Kamuii Shinma thuộc nguyên tố Hỏa." 
 trait_fuhsi: "Fu Hsi"
 trait_fuhsi_desc: "Một Kwannon-jin của Hsien Đông phương, Fu Hsi là thường dân; Hirayanu Shinma gắn với nguyên tố Mộc, có khả năng hóa thành rắn." 
 trait_hanumen: "Hanumen"
 trait_hanumen_desc: "Một Kwannon-jin của Hsien Đông phương, Hanumen là thường dân; Hirayanu Shinma gắn với nguyên tố Thổ, có khả năng hóa thành khỉ." 
 trait_hengpo: "Heng Po"
 trait_hengpo_desc: "Một Kwannon-jin của Hsien Đông phương, Heng Po là thường dân; Hirayanu Shinma gắn với nguyên tố Thủy, có khả năng hóa thành cá." 
 trait_houchi: "Hou-chi"
 trait_houchi_desc: "Một Kwannon-jin của Hsien Đông phương, Hou-chi là quý tộc nguyên tố; Kamuii Shinma thuộc nguyên tố Mộc." 
 trait_komuko: "Komuko"
 trait_komuko_desc: "Một Kwannon-jin của Hsien Đông phương, Komuko là quý tộc nguyên tố; Kamuii Shinma thuộc nguyên tố Thổ." 
 trait_nyan: "Nyan"
 trait_nyan_desc: "Một Kwannon-jin của Hsien Đông phương, Nyan là thường dân; Hirayanu Shinma gắn với nguyên tố Hỏa, có khả năng hóa thành mèo." 
 trait_suijen: "Suijen"
 trait_suijen_desc: "Một Kwannon-jin của Hsien Đông phương, Suijen là quý tộc nguyên tố; Kamuii Shinma thuộc nguyên tố Thủy." 
 trait_tanuki: "Tanuki"
 trait_tanuki_desc: "Một Kwannon-jin của Hsien Đông phương, Tanuki là thường dân; Hirayanu Shinma gắn với nguyên tố Kim, có khả năng hóa thành tanuki hay chồn gấu mèo (thường bị dịch nhầm là "lửng")." 
 trait_glome: "Glome"
 trait_glome_desc: "Inanimae của Thổ, thành viên Đế chế Đá." 
 trait_kubera: "Kubera"
 trait_kubera_desc: "Inanimae của Mộc, thành viên Đế chế Hạt Giống." 
 trait_ondine: "Ondine"
 trait_ondine_desc: "Inanimae của Thủy, thành viên Đế chế Lệ." 
 trait_paroseme: "Paroseme"
 trait_paroseme_desc: "Inanimae của Khí, thành viên Đế chế Trời." 
 trait_solimond: "Solimond"
 trait_solimond_desc: "Inanimae của Hỏa, cựu thành viên Đế chế Lửa." 
 trait_mannikin: "Mannikin"
 trait_mannikin_desc: "Inanimae mang hình dạng người, thành viên Đế chế Búp Bê." 
 
 trait_realm_actor: "Tinh Thông Realm Actor"
 trait_realm_actor_desc: "Actor là realm gắn với mọi sinh thể trần thế, tỷ lệ thuận trực tiếp với mức độ bạn hiểu rõ họ. Bạn càng ít quen biết một sinh thể nào đó, dù là người sói, phàm nhân, oan hồn, ma cà rồng, v.v., thì càng cần tinh thông Actor cao hơn. Muốn tác động lên kẻ đối nghịch với bạn, bất kể hiểu biết ra sao, đều đòi hỏi phải tinh thông tuyệt đối." 
 trait_realm_fae: "Tinh Thông Realm Fae"
 trait_realm_fae_desc: "Fae liên quan tới các sinh thể khác của [UmbraGlossary('dreaming')]. Tác động lên Changeling khác, Sidhe Quý tộc, Adhene, Chimera, hay thậm chí điều khiển chính pháp thuật Changeling, tất cả đều thuộc realm Fae." 
 trait_realm_nature: "Tinh Thông Realm Nature"
 trait_realm_nature_desc: "Nature là quyền kiểm soát thực vật, đất đai, và muông thú. Bất cứ điều gì chưa bị tạo hóa động chạm tới đều có thể chịu sự kiểm soát của realm Nature." 
 trait_realm_prop: "Tinh Thông Realm Prop"
 trait_realm_prop_desc: "Prop là quyền kiểm soát và thao túng mọi vật thể được tạo ra. Quần áo, vũ khí, công trình, và bất cứ thứ gì khác được "tạo ra" đều thuộc Prop. Thiết bị càng phức tạp thì càng cần tinh thông realm Prop cao hơn." 
 trait_realm_scene: "Tinh Thông Realm Scene"
 trait_realm_scene_desc: "Scene là quyền kiểm soát không gian. Bạn càng tinh thông realm Scene, phạm vi tác động càng lớn hoặc càng nhiều mục tiêu hơn (kết hợp với các realm khác) mà bạn có thể ảnh hưởng." 
 trait_realm_time: "Tinh Thông Realm Time"
 trait_realm_time_desc: "Time là quyền kiểm soát thời điểm cantrip của bạn xảy ra hoặc kéo dài bao lâu. Tinh thông Time quyết định độ dài phép thuật của bạn có thể kéo dài, hay bạn có thể đặt "cơ chế kích hoạt" lên chúng trong bao lâu."  
 trait_realm_air: "Tinh Thông Realm Air"
 trait_realm_air_desc: "Air là nguyên tố bao trùm khắp địa cầu. Nó ảnh hưởng tới môi trường phi sinh vật và một cantrip tác động tới thời tiết, không khí, nhiệt độ, hay bất cứ điều gì khác trong phạm vi của người thi triển hay mục tiêu."
 trait_realm_earth: "Tinh Thông Realm Earth"
 trait_realm_earth_desc: "Earth tác động tới các vật thể phi sinh vật, phi siêu nhiên, cả tự nhiên lẫn nhân tạo."
 trait_realm_fire: "Tinh Thông Realm Fire"
 trait_realm_fire_desc: "Fire được dùng để tác động tới sinh vật sống phi siêu nhiên. Nó chỉ ảnh hưởng tới khía cạnh thể xác của những sinh vật ấy. Realm này cũng được dùng để tác động thể xác phàm nhân."
 trait_realm_water: "Tinh Thông Realm Water"
 trait_realm_water_desc: "Water chỉ ảnh hưởng tới môi trường tinh thần của sinh vật sống phi siêu nhiên. Muốn gây rối loạn tâm trí kẻ khác cần dùng realm này."
 trait_realm_spirit: "Tinh Thông Realm Spirit"
 trait_realm_spirit_desc: "Spirit được dùng để tác động tới bất cứ khía cạnh nào của một sinh thể hay vật thể siêu nhiên, kể cả Fae khác. Nó ảnh hưởng tới môi trường cũng như cõi thể xác và tinh thần. Nó cũng ảnh hưởng tới phàm nhân được phù phép."
 
