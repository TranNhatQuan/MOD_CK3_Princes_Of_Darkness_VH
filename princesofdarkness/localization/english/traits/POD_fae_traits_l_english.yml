 trait_nei_tan: "Nei Tan"
 
 trait_art_chicanery: "Art Chicanery"
 trait_art_chicanery_desc: "Chicanery là quyền năng phép thuật lừa dối của ảo ảnh và thao túng cảm xúc. Những kẻ luyện tập nó nhiều thường bị giới quý tộc coi là kém đáng tin cậy." 
 trait_art_legerdemain: "Art Legerdemain"
 trait_art_legerdemain_desc: "Legerdemain cho phép một changeling kiểm soát môi trường xung quanh bằng phương thức niệm động lực, từ móc túi từ xa đến tóm lấy và ném các vật thể lớn đi khắp nơi. Art này cũng cho phép tạo ra những vật thể và sinh vật ảo giác rắn chắc." 
 trait_art_primal: "Art Primal"
 trait_art_primal_desc: "Primal cho phép một changeling thao túng các thế lực của tự nhiên, từ triệu hồi nguyên tố đến giao tiếp với vật vô tri. Nó cũng ban quyền năng lên thể xác, cho phép một fae làm cứng da như vỏ cây, chữa lành thương tích, xé toạc thịt và thậm chí biến hình." 
 trait_art_soothsay: "Art Soothsay"
 trait_art_soothsay_desc: "Soothsay đại diện cho khả năng nhìn thấu tương lai của changeling. Tùy vào các realm được kết hợp sử dụng, changeling có thể học được thông tin về một người, một nơi, hay một vật." 
 trait_art_wayfare: "Art Wayfare"
 trait_art_wayfare_desc: "Art Wayfare liên quan tới khả năng di chuyển qua không gian của changeling. Điều này bao gồm nhảy vọt và bao phủ những khoảng cách xa, lao về phía trước với đôi chân nhanh không tưởng, và thậm chí dịch chuyển tức thời từ nơi này sang nơi khác." 
 trait_art_chronos: "Art Chronos"
 trait_art_chronos_desc: "Chronos là Art thao túng thời gian. Khác với các phương thức biến đổi thời gian mà những sinh thể siêu nhiên khác biết đến, Chronos khá gián tiếp, và gần như không bao giờ diễn ra theo trật tự tuyến tính - thay vào đó, nó là một Art tách rời khỏi trật tự đúng đắn của thời gian, khiến những kẻ luyện tập nó khó bị pháp thuật Time tác động, và mất đi cảm nhận về cách thời gian vận hành." 
 trait_art_dream_craft: "Art Dream-Craft"
 trait_art_dream_craft_desc: "Dream-Craft là Art thao túng chất liệu thô mà [UmbraGlossary('dreaming')] được tạo thành. Art này cho phép Sidhe thay đổi hình dạng vật lý bên trong [UmbraGlossary('dreaming')], có thể ảnh hưởng tới diện mạo của các freehold và nơi trú ẩn khác của [UmbraGlossary('dreaming')]. Nó cũng có thể ảnh hưởng tới voile, thứ trang phục ảo giác mà changeling mặc khi ở trong [UmbraGlossary('dreaming')]." 
 trait_art_naming: "Art Naming"
 trait_art_naming_desc: "Naming là Art của [Glossary('True Names','podgloss.truename')] và quyền năng của ngôn từ. Đây là một trong những Art nguy hiểm ngấm ngầm nhất mà Kithain biết đến, vì tuy các cấp độ thấp của nó trông có vẻ vô hại, một bậc thầy Naming có thể dễ dàng gây ra tổn hại không thể cứu vãn. Việc lạm dụng Naming một cách phù phiếm không được giới quý tộc xem nhẹ, họ sẽ nhanh chóng trừng phạt những kẻ lợi dụng hiệu ứng của nó." 
 trait_art_sovereign: "Art Sovereign"
 trait_art_sovereign_desc: "Sovereign là Art kiểm soát thường dân và uy nghiêm quý tộc. Đây là một trong những Art mang tính chính trị nhất mà Kithain thường luyện tập, và tồn tại chủ yếu để đảm bảo duy trì các cấu trúc chính trị của họ." 
 trait_art_infusion: "Art Infusion"
 trait_art_infusion_desc: "Infusion là Art hỗ trợ Nocker tạo ra mọi vật phẩm cơ khí và ảo giác kỳ diệu của chúng. Nó liên quan tới việc kết nối "FUBAR" và các thực thể ảo giác khác vào những hình dạng vật lý hoặc ảo giác." 
 trait_art_tale_craft: "Art Tale Craft"
 trait_art_tale_craft_desc: "Tale Craft là Art kể chuyện kỳ diệu của Eshu, thông qua việc tạo hiệu ứng đặc biệt, đọc vị đám đông, và thao túng cảm xúc của họ. [bunk|E] cho một cantrip Tale Craft, trừ một vài ngoại lệ, là một câu chuyện, dù được kể hay được hát." 
 trait_art_aphrodesia: "Art Aphrodesia"
 trait_art_aphrodesia_desc: "Aphrodesia là Art quyến rũ. Phiên bản fae của "Love Potion Number 9", trải dài từ một sức hút vừa phải đến việc khiến đối tượng sẵn lòng tự sát vì người mình say mê."
 trait_art_kryos: "Art Kryos"
 trait_art_kryos_desc: "Kryos là Art của giá lạnh và băng. Khác với các art nguyên tố khác mà changeling biết đến, quyền năng của Kryos khá theo nghĩa đen, gây ra cái lạnh thật sự, thay vì rùng mình theo nghĩa bóng. Một số kẻ lo sợ Art này có liên hệ mật thiết với Banality, do bản chất làm tê liệt và bất động của nó."
 trait_art_metamorphosis: "Art Metamorphosis"
 trait_art_metamorphosis_desc: "Metamorphosis là Art thay đổi hình dạng của sinh vật sống. Nó khác biệt rõ rệt với Primal ở chỗ, trong khi Primal liên quan tới việc định hình vật vô tri, Metamorphosis định hình vật sống. Qua đó, một fae có thể dễ dàng biến thành bất cứ thứ gì mình muốn, dù chỉ trong chốc lát."
 trait_art_pyretics: "Art Pyretics"
 trait_art_pyretics_desc: "Pyretics là art thao túng lửa thật và lửa ảo giác. Ngoài việc châm lửa mọi thứ, Pyretics còn có thể khai thác những khía cạnh ít hủy diệt hơn của lửa, soi sáng lối đi và phơi bày những gì ẩn giấu."
 trait_art_petros: "Petros"
 trait_art_petros_desc: "Petros, một trong hai Sliver của Earth, chi phối việc tạo hình đá và ban cho người thi triển những đặc tính vật lý của đá rắn. Mọi Inanimae biết Petros đều có thể leo lên bề mặt đá không mấy khó khăn."
 trait_art_aquis: "Aquis"
 trait_art_aquis_desc: "Aquis là Sliver của Water, kiểm soát sự vận động của nước qua khí quyển, cũng như phản ánh mối liên hệ giữa nước với sự đồng cảm và y thuật. Mọi Inanimae biết Aquis đều có thể thở dưới nước, và tự động biết bơi."
 trait_art_pyros: "Pyros"
 trait_art_pyros_desc: "Pyros là Sliver của Fire, tạo ra nhiệt và tự bốc cháy, cũng như tượng trưng cho ảnh hưởng tới đam mê nồng nhiệt. Mọi Inanimae biết Pyros đều có thể tạo ra một tia lửa nhỏ mà không cần diêm hay dụng cụ."
 trait_art_stratus: "Stratus"
 trait_art_stratus_desc: "Stratus là Sliver của Air, gây lạc hướng bằng cả những chuyển động nhanh đến chói mắt lẫn việc tạo ra ảo ảnh sương mù. Mọi Inanimae biết Stratus đều có thể cảm nhận các kiểu thời tiết từ xa hàng dặm."
 trait_art_verdage: "Verdage"
 trait_art_verdage_desc: "Verdage, một trong hai Sliver của Earth, chi phối sự sống và vật chất hữu cơ, đặc biệt là những gì cấu thành thực vật. Mọi Inanimae biết Verdage đều có thể nhận diện ngay lập tức sinh vật thực vật mà chúng nhìn thấy."
 trait_art_tieh_tan: "Tieh Tan"
 trait_art_tieh_tan_desc: "Nguyên tố Kim bao gồm mọi kim loại quý và kim loại dùng để chế tác: vàng, bạc, sắt, đồng thau, và thép. Dù phạm vi của nó khá hạn hẹp so với Water hay Earth, công dụng áp đảo của nó là để chế tạo công cụ, đặc biệt cho chiến tranh."
 trait_art_lin_tan: "Lin Tan"
 trait_art_lin_tan_desc: "Mộc tượng trưng cho sức mạnh của thế giới tự nhiên và, do đó, có quyền năng lên phần lớn thế giới. Các hiện tượng tự nhiên gắn với nó là mọi loại thực vật, tuổi trẻ, sức khỏe, và sự sinh trưởng."
 trait_art_shui_tan: "Shui Tan"
 trait_art_shui_tan_desc: "Thủy là một trong những nguyên tố quyền năng nhất. Nó bao trùm mọi thứ ở dạng lỏng và khí: mây, khí mêtan, nước, máu, v.v... Thủy vốn dĩ vừa thiết yếu vừa nguy hiểm và lừa dối. Nó cũng kiểm soát gió và bão, nhưng không kiểm soát sấm sét."
 trait_art_hou_tan: "Hou Tan"
 trait_art_hou_tan_desc: "Hỏa gắn liền với sấm chớp, ánh sáng, ngọn lửa và mọi năng lượng khả kiến khác. Nó xuất hiện trong bão tố, ngọn lửa trần, màn hình máy tính, và dung nham rực cháy."
 trait_art_di_tan: "Di Tan"
 trait_art_di_tan_desc: "Thổ tượng trưng cho mọi loại đá, đất, sỏi, đá quý, và khoáng vật. Thổ là trung tâm của mọi nguyên tố và là trục xoay trong quan niệm của người Trung Hoa về thế giới. Nó tượng trưng cho chính Trung Vương Quốc."
 trait_art_nei_tan: "Nei Tan"
 trait_art_nei_tan_desc: "Trong cách nói thông thường của Hsien, Nei Tan là "Nội Đan," pháp thuật Đạo giáo Wu Tan mà các shinma theo đuổi [Glossary('Tao Te Hsien','game_concept_tao_te_hsien_desc')] tu luyện."
 
 trait_art_chicanery_advanced: "Tinh Thông Art Chicanery"
 trait_art_chicanery_advanced_desc: "Chicanery là quyền năng phép thuật lừa dối của ảo ảnh và thao túng cảm xúc. Những kẻ luyện tập nó nhiều thường bị giới quý tộc coi là kém đáng tin cậy." 
 trait_art_legerdemain_advanced: "Tinh Thông Art Legerdemain"
 trait_art_legerdemain_advanced_desc: "Legerdemain cho phép một changeling kiểm soát môi trường xung quanh bằng phương thức niệm động lực, từ móc túi từ xa đến tóm lấy và ném các vật thể lớn đi khắp nơi. Art này cũng cho phép tạo ra những vật thể và sinh vật ảo giác rắn chắc." 
