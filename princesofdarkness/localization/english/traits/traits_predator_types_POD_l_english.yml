l_english:

 trait_predatortype_farmer: "Nông Dân"
 trait_predatortype_farmer_desc: "Ma cà rồng này thích hút máu từ động vật hơn."
 
 trait_predatortype_bloodleech: "Đỉa Máu"
 trait_predatortype_bloodleech_desc: "Ma cà rồng này thích hút máu của những ma cà rồng khác!"
 
 trait_predatortype_phlebotomist: "Kẻ Trích Huyết"
 trait_predatortype_phlebotomist_desc: "Ma cà rồng này chiếm đoạt $pod_vitae$ dưới vỏ bọc một thầy thuốc tiến hành trích huyết."
 
 trait_predatortype_bedlamite: "Kẻ Điên Loạn"
 trait_predatortype_bedlamite_desc: "Ma cà rồng này săn đuổi những kẻ điên loạn. Bản thân họ cũng có thể điên hoặc không."
 
 trait_predatortype_cenobite: "Tu Sĩ Ẩn Dật"
 trait_predatortype_cenobite_desc: "Ma cà rồng này có một [POD_herd|E] tại một cơ sở tôn giáo như tu viện."
 
 trait_predatortype_alleycat: "Mèo Hoang Ngõ Hẻm"
 trait_predatortype_alleycat_desc: "Ma cà rồng này rình rập và tấn công phàm nhân một cách bạo lực để chiếm lấy máu. Đây là cách làm thô bạo."
 
 trait_predatortype_cauchemar: "Cauchemar"
 trait_predatortype_cauchemar_desc: "Ma cà rồng này chủ yếu hút máu con mồi đang ngủ say."
 
 trait_predatortype_familias: "Familias"
 trait_predatortype_familias_desc: "Ma cà rồng này gần như chỉ hút máu từ một triều đại gia tộc nhất định. Họ thậm chí có thể có quan hệ huyết thống với gia tộc đó, ít nhất là theo suy nghĩ của chính gia tộc ấy."
 
 trait_predatortype_footpad: "Cướp Đường"
 trait_predatortype_footpad_desc: "Ma cà rồng này lẩn khuất cùng những kẻ hạ lưu trong xã hội, lấy máu của người nghèo khó. Nếu họ biến mất, chính quyền cũng chẳng buồn để tâm."
 
 trait_predatortype_consensualist: "Kẻ Cầu Ưng Thuận"
 trait_predatortype_consensualist_desc: "Ma cà rồng này chỉ hút máu từ những kẻ tự nguyện. Điều này gây phức tạp lớn cho [the_masquerade|E]."
 
 trait_predatortype_cultist: "Giáo Chủ Tà Giáo"
 trait_predatortype_cultist_desc: "Ma cà rồng này cầm đầu một giáo phái máu, như thời cổ đại. Đám phàm nhân sùng bái và tự nguyện hiến dâng bản thân cho vị thần máu này."
 
 trait_predatortype_siren: "Nàng Tiên Cá Mê Hoặc"
 trait_predatortype_siren_desc: "Ma cà rồng này quyến rũ những người tình để rút cạn máu họ qua nụ hôn."
 
 trait_predatortype_gentry: "Quý Nhân"
 trait_predatortype_gentry_desc: "Ma cà rồng này có một vị thế nhất định trong xã hội phàm nhân. Họ dùng vị thế đó để săn đuổi kẻ giàu có và quyền thế. Không ai tin rằng một kẻ thanh lịch như vậy lại là quái vật."
 
 trait_predatortype_graverobber: "Kẻ Đào Mộ"
 trait_predatortype_graverobber_desc: "Ma cà rồng này thường lảng vảng quanh nghĩa trang và hầm mộ để tìm xác chết mới hoặc người đưa tang. Họ có thể nuôi thân bằng những tử thi còn tươi mới."
 
 trait_predatortype_extortionist: "Kẻ Tống Tiền"
 trait_predatortype_extortionist_desc: "Ma cà rồng này ép buộc nạn nhân phải rỉ máu cho chúng. Bề ngoài, kẻ tống tiền chiếm đoạt máu để đổi lấy những dịch vụ như bảo kê hay do thám, nhưng dù nhu cầu được bảo vệ đôi khi là có thật, thì cũng thường xuyên đó chỉ là màn kịch dựng lên để khiến thỏa thuận ấy trông có vẻ chấp nhận được."
 

