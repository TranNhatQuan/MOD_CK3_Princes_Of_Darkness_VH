 trait_dharma0: "Pháp Môn 0"
 trait_dharma0_desc: "Hin (hay Sudra nếu là [GetTrait('kueijin').GetName( GetNullCharacter )] theo Ấn Độ giáo), những kẻ đã được kéo ra khỏi trạng thái chih-mei, nhưng chưa trở thành một phần của xã hội."
 
 trait_chihmei: "Chih-mei"
 trait_chihmei_desc: "Một sinh vật gần như vô tri, bị cơn đói khát Khí thống trị và buộc phải sống bằng thịt người. Một nhân vật đã sa vào chih-mei thì không thể chơi được nữa."
 trait_chihmei_dharma_desc: "Bằng một nghi lễ, một Chih-mei có thể được phục hồi về Cân Bằng Pháp Môn và trở nên văn minh, đánh thức lại ý thức cao hơn của mình (Hồn) và biến thành một hồn ma vô ưu hữu ích dưới một Pháp Môn chân chính."
 
 trait_chi_art_feng_shui: "Phong Thủy"
 trait_chi_art_feng_shui_desc: "Khí Thuật khác với các nghệ thuật khác, mới được phát triển như một cách sử dụng nâng cao của Khí thuần khiết. Chúng cũng là thứ xa rời nhất khỏi bản chất của Hungry Dead; muốn tu luyện chúng cần có một người thầy.\n\nPhong Thủy là một môn địa lý phong thủy cổ xưa chuyên về việc bố trí đúng đắn và cát lợi cho nhà cửa, mộ phần và nội thất, hài hòa với các luồng khí trời và cấu hình đất đai, cho phép Khí lưu chuyển tự do nhằm hài hòa con người với môi trường xung quanh."
 trait_chi_art_obligation: "Nghĩa Vụ"
 trait_chi_art_obligation_desc: "Khí Thuật khác với các nghệ thuật khác, mới được phát triển như một cách sử dụng nâng cao của Khí thuần khiết. Chúng cũng là thứ xa rời nhất khỏi bản chất của Hungry Dead; muốn tu luyện chúng cần có một người thầy.\n\nNghĩa Vụ là một nghệ thuật cho phép một $pod_kueijin$ áp đặt quyền kiểm soát lên kẻ khác. Đây là sự hồi tưởng về vinh quang của Wan Xian cổ xưa và quyền uy của họ bắt nguồn từ sắc mệnh của chính [Glossary('Ngọc Hoàng','podgloss.augustpersonageofjade')]. Dù đã đánh mất ân sủng ấy, một số vẫn có thể truyền cảm hứng hoặc thống trị tâm linh của những kẻ xung quanh mình."
 trait_chi_art_tapestry: "Dệt Cảnh"
 trait_chi_art_tapestry_desc: "Khí Thuật khác với các nghệ thuật khác, mới được phát triển như một cách sử dụng nâng cao của Khí thuần khiết. Chúng cũng là thứ xa rời nhất khỏi bản chất của Hungry Dead; muốn tu luyện chúng cần có một người thầy.\n\nDệt Cảnh là khí thuật khai thác triệt để các long mạch. Qua việc luyện tập Dệt Cảnh, ma cà rồng hòa hợp bản thân với các luồng Âm Dương trong gió, nước và đất, rồi thao túng những luồng lực ấy cho nhiều mục đích khác nhau."
 trait_chi_art_prana: "Prana"
 trait_chi_art_prana_desc: "Khí Thuật khác với các nghệ thuật khác, mới được phát triển như một cách sử dụng nâng cao của Khí thuần khiết. Chúng cũng là thứ xa rời nhất khỏi bản chất của Hungry Dead; muốn tu luyện chúng cần có một người thầy.\n\nPrana là khí thuật sử dụng cả hai mặt của Khí, Âm và Dương. Người luyện tập có thể hòa hợp bản thân với năng lượng của cái chết và sự sống tương ứng, hoặc dùng sự hội tụ của chúng để chữa lành vết thương."
 trait_chi_art_kiai: "Kiai"
 trait_chi_art_kiai_desc: "Khí Thuật khác với các nghệ thuật khác, mới được phát triển như một cách sử dụng nâng cao của Khí thuần khiết. Chúng cũng là thứ xa rời nhất khỏi bản chất của Hungry Dead; muốn tu luyện chúng cần có một người thầy.\n\nKiai là khí thuật dẫn truyền cơn thịnh nộ của Ma Vương qua giọng nói, một kỹ thuật uy hiếp có nhiều ứng dụng trên chiến trường."
 trait_chi_art_tzu_wei: "Tử Vi"
 trait_chi_art_tzu_wei_desc: "Khí Thuật khác với các nghệ thuật khác, mới được phát triển như một cách sử dụng nâng cao của Khí thuần khiết. Chúng cũng là thứ xa rời nhất khỏi bản chất của Hungry Dead; muốn tu luyện chúng cần có một người thầy.\n\nTử Vi là khí thuật đọc và thao túng lá số tử vi. Khi $pod_kueijin$ luyện tập Tử Vi, họ có thể định hình chính vận mệnh và uốn nắn các luồng may rủi theo ý mình."

 trait_shih: "Shih"
 trait_shih_desc: "Truyền thuyết kể rằng nguồn gốc của Shih nằm trong Ân ở thời nhà Thương. Họ đơn độc bước đi trong bóng tối, chiến đấu chống lại các thế lực của Nghìn Địa Ngục chỉ bằng sức mạnh của đôi tay và ý chí mình. Hơn 3.000 năm trước, Shih lần đầu bước ra giao chiến với shen. Dù các gia tộc kiêu hãnh của Shih không còn nữa, truyền thống của họ vẫn tồn tại và việc kể lại khởi nguyên của họ là một trong những câu chuyện được tôn kính nhất."
 
 trait_ha_holy_bulwark: "Thành Lũy Thánh"
 trait_ha_holy_bulwark_desc: "Nhân vật này không thể bị huyết bổn trói buộc."
 
 trait_ha_patris_mastery: "Tinh Thông Nghệ Thuật: Sophia Patris"
 trait_ha_patris_mastery_desc: "'Hãy hạ mình trước Chúa, và Người sẽ nâng các ngươi lên'"
 
 trait_ha_filius_mastery: "Tinh Thông Nghệ Thuật: Sedulitas Filius"
 trait_ha_filius_mastery_desc: "'Ai là kẻ vượt qua thế gian? Chỉ có kẻ tin rằng Jesus là Con của Chúa.'"
 
 trait_ha_spiritus_mastery: "Tinh Thông Nghệ Thuật: Boni Spiritus"
 trait_ha_spiritus_mastery_desc: "'Và Ta sẽ đặt Thần Khí Ta vào các ngươi và khiến các ngươi tuân theo các sắc lệnh của Ta và cẩn trọng giữ gìn luật lệ của Ta.'"
 
 trait_demonic_plague: "Ôn Dịch Ma Quỷ"
 trait_demonic_plague_desc: "Là kết quả của một lời nguyền quỷ dị đích thực, ôn dịch ma quỷ là một căn bệnh truyền nhiễm cao và chết người, ảnh hưởng đến Kindred không kém gì người phàm. Tệ hơn, căn bệnh này khiến ma cà rồng không thể chữa lành theo bất kỳ cách nào, và dẫn đến những vết thương ngày càng nặng khi da thịt tự xé rách."
 
 trait_demonic_plague_non_infectious: "Ôn Dịch Ma Quỷ"
 trait_demonic_plague_non_infectious_desc: "Là kết quả của một lời nguyền quỷ dị đích thực, ôn dịch ma quỷ là một căn bệnh chết người, ảnh hưởng đến Kindred không kém gì người phàm. Tệ hơn, căn bệnh này khiến ma cà rồng không thể chữa lành theo bất kỳ cách nào, và dẫn đến những vết thương ngày càng nặng khi da thịt tự xé rách."
 
 trait_demonic_plague_non_lethal: "Ôn Dịch Ma Quỷ"
 trait_demonic_plague_non_lethal_desc: "Là kết quả của một lời nguyền quỷ dị đích thực, ôn dịch ma quỷ là một căn bệnh truyền nhiễm cao, ảnh hưởng đến Kindred không kém gì người phàm. Tệ hơn, căn bệnh này khiến ma cà rồng không thể chữa lành theo bất kỳ cách nào"
 
 trait_demonic_plague_non_lethal_and_infectious: "Ôn Dịch Ma Quỷ"
 trait_demonic_plague_non_lethal_and_infectious_desc: "Là kết quả của một lời nguyền quỷ dị đích thực, ôn dịch ma quỷ là một căn bệnh ảnh hưởng đến Kindred không kém gì người phàm. Tệ hơn, căn bệnh này khiến ma cà rồng không thể chữa lành theo bất kỳ cách nào"
  
 trait_vampire_smallpox: "Đậu Mùa Ma Cà Rồng"
 trait_vampire_bubonic_plague: "Dịch Hạch Ma Cà Rồng"
 trait_vampire_typhus: "Thương Hàn Ma Cà Rồng"
 trait_vampire_cancer: "Ung Thư Ma Cà Rồng"
 trait_vampire_consumption: "Lao Phổi Ma Cà Rồng"
 trait_vampire_gout_ridden: "Gút Hành Hạ Ma Cà Rồng"
 trait_vampire_pneumonic: "Viêm Phổi Ma Cà Rồng"
 trait_vampire_great_pox: "'Đại Hoa Liễu' Ma Cà Rồng"
 trait_vampire_leper: "Phong Cùi Ma Cà Rồng"
 trait_vampire_ill: "Bệnh Ma Cà Rồng"
 
 trait_akuma: "Akuma"
 trait_akuma_desc: "Akuma, hay Kẻ Bị Quỷ Ăn, là những cá nhân đã từ bỏ đức hạnh và ném số phận mình theo [Glossary('Diêm Ma Vương','podgloss.yamaking')]. Xem thêm [akuma|E]"
 
 trait_mummy: "Xác ướp"
 trait_mummy_desc: "Xác ướp, còn được gọi là Kẻ Bất Tử hay Kẻ Tái Sinh, là những kẻ trường sinh mà thân thể đã được bảo tồn qua nghi lễ."
 trait_track_mummy: "Ký Ức"
 trait_track_mummy_desc: "Để nhận ký ức, bạn phải ở [POD_homeland|E] của mình hoặc xây các [domicile_buildings|E] cụ thể"
 
 trait_shemsuheru: "Shemsu-Heru"
 trait_shemsuheru_desc: "Phải có kẻ đầu tiên, và trong số các Bất Tử, vinh dự ấy thuộc về Shemsu-Heru, những người bạn hay đồng hành của Horus. Được Isis và em gái nàng tạo ra, ban đầu để theo hầu và phụng sự con trai nàng là Horus, họ là những Trường Sinh cổ xưa nhất thế gian."
 trait_banemummy: "Xác Ướp Tà Linh"
 trait_banemummy_desc: "Xác Ướp Tà Linh, còn gọi là Apepnu, là những bản sao báng bổ của xác ướp được hồi sinh bằng Phép Sinh Mệnh của Set, nhưng sự am hiểu của thần đã không trọn vẹn và phép thuật bị hủ hóa."
 trait_cabiri: "Cabiri"
 trait_cabiri_desc: "Cabiri là một Vương Tộc Bất Tử không có nguồn gốc từ Ai Cập mà từ Hy Lạp, hầu như không liên quan đến cuộc chiến giữa $glossary_wyrm_apophis$ và Ma'at."

 trait_wutian: "Wu T'ian"
 trait_wutian_desc: "Wu T'ian, Gia Tộc Thiên Đình, từng là học trò của các bậc hiền triết vĩ đại, nhận được linh dược trường sinh từ Bát Tiên để đổi lấy sự phụng sự vĩnh viễn cho Đạo."
 trait_wukuei: "Wu Kuei"
 trait_wukuei_desc: "Wu Kuei, Gia Tộc Ma Quỷ, là các bất tử của [UmbraGlossaryLocalized('yomi_wan','Địa Ngục Yomi')], những Wu T’ian phản bội đã bán linh hồn cho địa ngục để được an toàn khi [Glossary('Kỷ Nguyên Thứ Sáu','game_concept_sixth_age_desc')] ló rạng."
 
 trait_asekh_sen: "Asekh-Sen"
 trait_asekh_sen_desc: "Không phải bất tử trọn vẹn, những sinh vật này thường trông như xác chết lê bước bị một Tà Linh chiếm hữu, khiến sinh thể hồi sinh ấy tràn ngập hận thù sục sôi với mọi sự sống."
 
 trait_integrity: "Chính Trực"
 trait_integrity_desc: "Chính Trực là thước đo tổng quát cho việc một Xác Ướp phù hợp đến đâu với ý muốn của các phán quan. Xác Ướp có Chính Trực thấp có thể bị phán xét khá khắc nghiệt (hoặc tệ hơn) khi họ bước vào [UmbraGlossary('shadowlands')] để chuẩn bị cho kiếp sau."
 trait_track_integrity: "Chính Trực"
 trait_track_integrity_desc: "#medium Chính Trực là một hệ thống kiểu đức hạnh.\n\n#bold Tăng Chính Trực bằng cách:#!\n$BULLET_WITH_TAB$Giết với lý do chính đáng: #P +1#!\n$BULLET_WITH_TAB$Tặng quà: #P +2#!\n$BULLET_WITH_TAB$Chữa lành: #P +3#!\n\n#bold Giảm Chính Trực bằng cách:#!\n$BULLET_WITH_TAB$Giết không có lý do chính đáng: #N -3#!\n$BULLET_WITH_TAB$Thực hiện hành vi tàn ác (vd tra tấn): #N -2#!\n$BULLET_WITH_TAB$Thực hiện hành vi trộm cắp: #N -1#!#!"
 

 trait_automaton: "Automaton"
 trait_automaton_desc: "Một cơ thể nhân dạng nhân tạo."
 trait_effigy: "Effigy"
 trait_effigy_desc: "Những hình nộm nhỏ có thể được giao thực hiện các nhiệm vụ đơn giản."
 trait_animantis: "Animantis"
 trait_animantis_desc: "Một golem, một cỗ máy hầu cận sẽ phụng sự Nocker và hỗ trợ họ trong công việc."
 trait_servitor: "Servitor"
 trait_servitor_desc: "Earthbound có thể tạo cho mình một vật chứa di động, nhồi đầy ô uế của bản thân vào một vật phẩm được chuẩn bị đặc biệt và biến nó thành một vật chủ mạnh mẽ, trường tồn."
 trait_manifestation: "Manifestation"
 trait_manifestation_desc: "Những sự nhại lại gớm ghiếc của hình dạng con người. Ví dụ như khuôn mặt đông đặc lại từ một vũng máu, cánh tay làm từ châu chấu hay chiếc lưỡi hình thành từ giòi bọ. Hình dạng này độc lập về mặt vật lý với Haunter, và không có khả năng kiểm soát vận động tinh vi. Mặt khác, các manifestation được tạo ra mạnh ngang với Haunter đã tạo ra chúng, và sẽ phản ứng theo các mệnh lệnh đơn giản như quẫy đạp, cắn, co giật, v.v."
 trait_golem: "Golem"
 trait_golem_desc: "Golem là những cỗ máy nhân dạng cỡ lớn được tạo ra bằng pháp thuật, nổi tiếng vì kém ổn định và có xu hướng nổi điên."

 trait_mindless_clone: "Bản Sao"
 trait_mindless_clone_desc: "Một bản mô phỏng của một sinh thể khác, được kích hoạt qua một hình thức pháp thuật nào đó. Nó không thể hành động độc lập."
 trait_shadow_twin: "Song Sinh Bóng Tối"
 trait_mirror_duplicate: "Bản Sao Gương"
 trait_shadowy_duplicate: "Bản Sao Bóng Tối"
 trait_phantom_shadow: "Bóng Ma"
 trait_separated_khaibit: "Khaibit Bị Tách Rời"
 trait_separated_shadow: "Bóng Bị Tách Rời"
 trait_shadow_self: "Bản Ngã Bóng Tối"
 
 trait_risen: "Kẻ Hồi Sinh"
 trait_risen_desc: "Risen là thuật ngữ chỉ một oan hồn đã tìm được cách quay lại thân xác mình để bước đi giữa người sống ở [Glossary('Skinlands','game_concept_skinlands_desc')]."
 TRAIT_FLAG_DESC_cannot_resolve_fetters: "Không thể giải quyết [Fetters|E]"

 trait_spectre: "Spectre"
 trait_spectre_desc: "Spectre là những oan hồn đã đầu hàng trước Bóng của mình. Khi một linh hồn tích tụ quá nhiều cảm xúc đen tối, Bóng của nó sẽ chiếm quyền vĩnh viễn và nó trở thành Spectre."
 trait_track_spectre: "Đẳng Cấp"
 trait_track_spectre_desc: "Spectre oan hồn có một trật tự thứ bậc rõ ràng. Mortwight và Haint là các Đẳng Cấp Spectre thấp nhất trong hệ thống chức năng, vì chúng bước vào phụng sự [UmbraGlossary('oblivion')] trực tiếp từ [Glossary('Skinlands','game_concept_skinlands_desc')], và ít bị ánh hào quang của nó chạm đến nhất. Doppelganger đứng kế tiếp trong thứ bậc, đã vượt qua các thử thách của Tâm Thức và chiến thắng nhờ lòng tận trung với [UmbraGlossary('oblivion')]; tuy vậy tại thời điểm này, chúng chưa thể hiện dấu ấn của nó lên cơ thể. Shade và Apparition có địa vị cao hơn, vì ở chúng dấu ấn của [UmbraGlossary('oblivion')] đã bắt đầu hiện rõ. Nephwrack đứng kế tiếp vì việc tiếp xúc liên tục với [UmbraGlossary('oblivion')] đã biến đổi chúng đến mức Moliate không còn che giấu được bản chất của chúng nữa. Onceborn và Hekatonkhire là các Đẳng Cấp cao nhất mà một Spectre từng-là-người có thể đạt tới; dù tận trung với sự nghiệp của [UmbraGlossary('oblivion')], chúng vẫn từng có một thời sống thực. Ở đỉnh cao nhất của hệ thống là Neverborn, những kẻ đã bò ra từ chính [UmbraGlossary('oblivion')] trong những thời đại xa xưa. Stripling là độc nhất ở chỗ chúng tồn tại ngoài hệ thống đẳng cấp và phụng sự ở gần như mọi cấp bậc của [UmbraGlossary('oblivion')]."
 trait_stripling: "Stripling"
 trait_stripling_desc: "Stripling, còn gọi là Kẻ Chưa-Từng-Sống, là một loại Spectre gồm những kẻ bước vào [UmbraGlossary('shadowlands')] khi còn là trẻ con và cuối cùng bị Bóng của mình chiếm đoạt. Như các Spectre khác, Stripling thuộc về một trong các Đẳng Cấp Spectral, được xác định theo mức độ gần gũi với [UmbraGlossary('oblivion')], nhưng vì chúng thấy xã hội Spectral đã hình thành không hấp dẫn, chúng tự lập nhóm riêng độc lập với nó."
 trait_neverborn: "Neverborn"
 trait_neverborn_desc: "Neverborn là tên gọi dành cho các Malfean cổ xưa đã ngủ sâu trong [UmbraGlossary('pod_realm_labyrinth')]. Chúng còn được gọi là "Primordial", "Never Dead", và "Grotesque"."
 trait_hekatonkhire: "Hekatonkhire"
 trait_hekatonkhire_desc: "Hekatonkhire là một giống Spectre cổ xưa, chủ yếu được các Malfean dùng làm xe tăng và cừ húc thành trong các trận chiến chống Spectre địch. Chúng được cho là những kẻ suýt trở thành Onceborn nhưng đã đánh mất tâm trí trước quyền năng của [UmbraGlossary('oblivion')] và biến thành chẳng khác gì những kẻ hung tợn khổng lồ, dị dạng có khả năng tấn công nhiều đối thủ cùng lúc."
 trait_onceborn: "Onceborn"
 trait_onceborn_desc: "Onceborn là tên gọi dành cho các Malfean từng là con người. Chúng còn được gọi là Oncelived, Plotter và Cabalist."
 trait_nephwrack: "Nephwrack"
 trait_nephwrack_desc: "Nephwrack đã tồn tại qua nhiều thời đại, và việc tiếp xúc liên tục với [UmbraGlossary('oblivion')] đã khiến chúng từ bỏ hình dạng con người, trở nên vặn vẹo và dị dạng. Nhiều kẻ phụng sự cho một Malfean chủ nhân, đóng vai trò như sự hiện diện hữu hình của hắn."
 trait_shade: "Shade"
 trait_shade_desc: "Là một trong những Spectre quyền năng nhất, Shade từng là các oan hồn bị ném vào [UmbraGlossary('tempest')], bị cuốn vào một Maelstrom hay Đại Maelstrom, hoặc lạc mất bản thân trong một Harrowing. Tâm Thức mong manh của chúng bị [UmbraGlossary('oblivion')] hủy diệt hoàn toàn, chỉ để lại Bóng của chúng, tràn ngập hận thù và Đam Mê Đen Tối và nắm quyền kiểm soát vĩnh viễn. Cách thức chúng được tạo ra khiến chúng có biệt danh là Con Cái của [UmbraGlossary('oblivion')]."
 trait_apparition: "Apparition"
 trait_apparition_desc: "Apparition, nói cho dễ hiểu, là tầng lớp quản lý bậc trung của các Spectre - những Doppelganger và Mortwight đã bắt đầu tiến hóa thành Nephwrack. Vì vậy, rất khó nhận ra con người mà chúng từng là qua lớp biến đổi do [UmbraGlossary('oblivion')] gây ra. Vì con người đó đã biến mất từ lâu, [Corpus|E] phản chiếu bản ngã hiện tại."
 trait_doppelganger: "Doppelganger"
 trait_doppelganger_desc: "Doppelganger, còn gọi là Kẻ Bị Bóng Nuốt, trông giống oan hồn bình thường, ngoại trừ việc nhợt nhạt và gầy hơn. Dấu Chết thường in trên cơ thể chúng, dù dùng Moliate có thể che giấu điều này. Điểm nhận biết chắc chắn nhất là Bóng của chúng luôn hiện lên trong mắt chúng theo cách nào đó."
 trait_mortwight: "Mortwight"
 trait_mortwight_desc: "Mortwight là linh hồn của những kẻ chết vì cái chết cực kỳ bạo lực. Sự phẫn nộ và căm hờn của chúng đối với cái chết của mình khiến chúng thức tỉnh tại [UmbraGlossary('shadowlands')] thành Spectre, chưa từng tồn tại như một hồn ma. Nhiều Mortwight vốn đã có bản chất đen tối từ đầu, và một số tin rằng chúng đã định mệnh trở thành Spectre ngay từ lúc bắt đầu."
 trait_haint: "Haint"
 trait_haint_desc: "Haint bước vào [UmbraGlossary('shadowlands')] với Bóng của mình nắm quyền kiểm soát, giống như Mortwight. Không giống Mortwight, Haint được định nghĩa không phải bởi cái chết, mà bởi cuộc đời của chúng. Trước khi chết, chúng đã bị đẩy xuống một lối sống gần như phi nhân tính ngay khi còn giữa những kẻ Sống."
 
 trait_dhampyr: "Dhampyr"
 trait_dhampyr_desc: "Dhampyr, còn gọi là Shade Walker hay Twilight Children, là những đứa con (hiếm hoi) của [GetTrait('kueijin').GetName( GetNullCharacter )]. Được ban phước với tuổi thọ dài và may mắn khác thường, chúng lại bị cản trở bởi trạng thái nửa chết vĩnh viễn và những kỳ vọng phụng sự đặt lên vai bởi cha mẹ $pod_kueijin$ của mình."
 trait_golden_children: "Golden Child"
 trait_golden_children_desc: "Golden Children (hay Jin Hai) từng là những đứa con được ban phước tâm linh của Mười Nghìn Chiến Binh trong truyền thuyết. Vì họ là người phàm, họ từng là anh hùng của dân chúng cho tới khi bị chính các bậc cha mẹ $pod_kueijin$ đồi bại của mình tàn sát và bị giáng xuống thành dhampyr."
    
 trait_arcanos_argos: "Argos"
 trait_arcanos_argos_desc: "Người sử dụng Argos có thể thao túng, định hướng và du hành qua [UmbraGlossary('tempest')]." 
 
 trait_arcanos_castigate: "Castigate"
 trait_arcanos_castigate_desc: "Người sử dụng Castigate có thể thao túng và kiểm soát Bóng của một oan hồn." 
 
 trait_arcanos_embody: "Embody"
 trait_arcanos_embody_desc: "Những kẻ sử dụng Embody có thể hiện hình trong thế giới vật chất và, trong hoàn cảnh phù hợp, xuất hiện như một người còn sống."
 
 trait_arcanos_fatalism: "Fatalism"
 trait_arcanos_fatalism_desc: "Những kẻ sở hữu ân tứ Fatalism có thể nhìn thấu quá khứ hay tương lai của kẻ khác, và đọc được Số Phận tối hậu của một oan hồn."

 trait_arcanos_flux: "Flux"
 trait_arcanos_flux_desc: "Flux ảnh hưởng đến cấu trúc và phản ứng của vật chất ở [Glossary('Skinlands','game_concept_skinlands_desc')], và cũng ảnh hưởng đến hoạt động của các di vật oan hồn."

 trait_arcanos_inhabit: "Inhabit"
 trait_arcanos_inhabit_desc: "Oan hồn được ban ân tứ Inhabit có thể thao túng và kiểm soát vật thể vô tri."

 trait_arcanos_intimation: "Intimation"
 trait_arcanos_intimation_desc: "Người sử dụng Intimation có thể chỉnh sửa ham muốn và ước vọng của các oan hồn khác."

 trait_arcanos_keening: "Keening"
 trait_arcanos_keening_desc: "Những kẻ có thể sử dụng nghệ thuật Keening có thể thao túng cảm xúc qua âm thanh."

 trait_arcanos_lifeweb: "Lifeweb"
 trait_arcanos_lifeweb_desc: "Oan hồn thông thạo Lifeweb có thể dùng nó để củng cố, làm suy yếu, hoặc theo dõi [Fetters|E]."

 trait_arcanos_mnemosynis: "Mnemosynis"
 trait_arcanos_mnemosynis_desc: "Người sử dụng Mnemosynis có thể lần theo và đọc ký ức của kẻ khác."

 trait_arcanos_moliate: "Moliate"
 trait_arcanos_moliate_desc: "Những kẻ sử dụng Moliate có khả năng tái định hình [Corpus|E] của mình, cũng như [Corpus|E] của kẻ khác, thành những hình dạng hấp dẫn, và đôi khi đáng sợ."

 trait_arcanos_outrage: "Outrage"
 trait_arcanos_outrage_desc: "Outrage ảnh hưởng đến [Glossary('Skinlands','game_concept_skinlands_desc')] bằng cách biểu hiện ý chí của một oan hồn dưới dạng một sức mạnh áp đảo."

 trait_arcanos_pandemonium: "Pandemonium"
 trait_arcanos_pandemonium_desc: "Oan hồn sử dụng Arcanos này có thể dùng sức mạnh của hỗn loạn để gây náo động trong thế giới người sống."

 trait_arcanos_phantasm: "Phantasm"
 trait_arcanos_phantasm_desc: "Những kẻ sử dụng năng lực của Phantasm có thể thao túng giấc mơ và tạo ra ảo ảnh."

 trait_arcanos_puppetry: "Puppetry"
 trait_arcanos_puppetry_desc: "Những kẻ tinh thông Puppetry có thể kiểm soát cơ thể của những kẻ Sống."

 trait_arcanos_usury: "Usury"
 trait_arcanos_usury_desc: "Những kẻ tinh thông Usury có thể trao đổi chính những nguồn lực mà oan hồn dựa vào để tồn tại."

 trait_arcanos_kinesis: "Kinesis"
 trait_arcanos_kinesis_desc: "Oan hồn được ban ân tứ Kinesis có thể thao túng và kiểm soát vật thể vô tri."

 trait_barghest: "Barghest"
 trait_barghest_desc: "Barghest, còn gọi là chó săn máu, là những oan hồn đã bị biến thành hình dạng quái dị và bị “cắt não” bằng cách ghép một mõm sắt Stygian được chế tạo đặc biệt vào [Corpus|E] của chúng."
 trait_ferryman: "Ferryman"
 trait_ferryman_desc: "Qua Nghi Lễ Cắt Đứt, Bóng và Tâm Thức của nhân vật này bị tách rời vĩnh viễn, tạo thành một Pasiphae."
 TRAIT_FLAG_DESC_lose_shadow: "Không còn Bóng"
 TRAIT_FLAG_DESC_restore_possibility_to_reduce_stress_normal_way: "Có thể giảm căng thẳng theo cách thông thường, không còn bị ràng buộc bởi Đam Mê"
 TRAIT_FLAG_DESC_cannot_access_skinlands: "Mất toàn bộ khả năng tiếp cận [Glossary('Skinlands','game_concept_skinlands_desc')]"
 trait_shadow: "Bóng"
 trait_shadow_desc: "Bóng là thuật ngữ chỉ khía cạnh trong nhân cách của một oan hồn muốn thấy oan hồn ấy thất bại, ngừng chống chọi và khuất phục trước [UmbraGlossary('oblivion')]."
 TRAIT_FLAG_DESC_deteriorating_fetters: "Mỗi năm cấp độ của một [Fetter|E] ngẫu nhiên sẽ giảm #N 1#!"
 trait_pasiphae: "Pasiphae"
 trait_pasiphae_desc: "Pasiphae, những kẻ được gọi là Người Lái Đò của [UmbraGlossary('oblivion')] hay Kẻ Lang Thang của [UmbraGlossary('pod_realm_labyrinth')], thường bị những Helldiver thiếu hiểu biết và số ít oan hồn liều lĩnh khác dám mạo hiểm vào [UmbraGlossary('pod_realm_labyrinth')] nhầm tưởng là các tướng lĩnh của phe Bóng-Nuốt."
 trait_khaibit: "Khaibit"
 trait_khaibit_desc: "Một Khaibit bị tách khỏi xác ướp để dùng làm hầu cận kiểu spectre."
 trait_po: "P'o"
 trait_po_desc: "Phần linh hồn liên quan đến các khía cạnh thể chất của sự tồn tại; thường được gọi là mặt "thú tính" của linh hồn."
 trait_kuei: "Kuei"
 trait_kuei_desc: "Kuei là một oan hồn từ [UmbraGlossary('dark_kingdom_of_jade')] chưa được chôn cất theo đúng nghi thức và truyền thống của vùng đất đó. Chúng trở thành, nói cho dễ hiểu, những Bóng biết đi. Những oan hồn này cực kỳ nguy hiểm và lang thang khắp [UmbraGlossary('shadowlands')] không mục đích, săn tìm Pathos như một con thú đói tìm kiếm thức ăn."
 

 
 trait_psychic: "Psychic"
 trait_psychic_desc: "Nhân vật này sở hữu một hoặc nhiều năng lực thần giao cách cảm (còn gọi là hiện tượng ngoại cảm hay đơn giản là năng lực ngoại cảm)."
 trait_track_psychic: "Thông Thạo Ngoại Cảm"
 trait_track_psychic_desc: "#bold Mỗi bậc tăng tỷ lệ thành công của năng lực ngoại cảm thêm #P 10#!#!\nSử dụng năng lực ngoại cảm rất khó, đặc biệt là chống lại các sinh vật siêu nhiên. Nhưng như mọi thứ trong đời, sự thông thạo năng lực ngoại cảm cũng có thể đạt được qua việc nắm vững nền tảng và kinh nghiệm."
 trait_sorcerer: "Pháp Sư"
 trait_sorceress: "Nữ Pháp Sư"
 trait_rune_wise: "Pháp Sư Rune"
 trait_sorcerer_desc: "Nhân vật này sử dụng các nhánh tuyến tính của phù thuật dân gian.\nPháp Sư hoạt động trong khuôn khổ quy luật của thực tại để tạo ra những điều vĩ đại, nhưng họ vẫn còn cách xa Pháp sư (Mage), những người điều khiển ý chí có thể định hình chính thực tại."
 trait_theurgist: "Nhà Thần Thuật"
 trait_theurgist_desc: "Nhân vật này thực hành một nhánh cụ thể của phù thuật dựa trên thần bí học Do Thái hoặc giáo lý của Cơ Đốc giáo Bí truyền."
 
 trait_fallen: "Sa Ngã"
 trait_fallen_desc: "Chúng là những thiên thần sa ngã đã chọn đứng về phía Lucifer và nhân loại thay vì về phía Chúa trong những ngày đầu của Tạo Hóa. Để trừng phạt sự phản loạn và bất trung ấy, Tổng lãnh thiên thần Michael đã đuổi những thiên thần này khỏi Thiên Đàng và ném xuống Vực Thẳm. Các bức tường của Vực Thẳm nứt vỡ, và những kẻ Sa Ngã bắt đầu trốn thoát trở lại thế giới vật chất."
 trait_earthbound: "Earthbound"
 trait_earthbound_desc: "Ác quỷ là Đoàn Quân sa ngã của Thiên Đình, những Thiên Thần phản loạn đã theo Lucifer trong cuộc nổi loạn thất bại của hắn. Hình dạng thật của chúng không còn duy trì được nữa, các Ác Quỷ Earthbound phần lớn bị giam trong các thánh tráp, trong khi một số ít quản lý chiếm hữu được một địa điểm."
 TRAIT_FLAG_DESC_host_for_travel: "Không thể du hành hay chỉ huy quân đội trừ khi cũng đang chiếm hữu một vật chủ con người với [GetPerk('abandon_vessel_perk').GetName(GetNullCharacter)]"
 trait_laham: "Laham"
 trait_laham_desc: "Hậu duệ của một ác quỷ. Trường thọ một cách kỳ lạ, miễn nhiễm với đau đớn, và thường sở hữu những quyền năng phi nhân. Một hậu duệ-quỷ (hay laham) được cho là một tôi tớ đặc biệt của Địa Ngục."
 trait_nephilim: "Nephilim"
 trait_nephilim_desc: "Hậu duệ của một ác quỷ và một con người. Chúng sở hữu các ân tứ của con người và các Tri Thức của ác quỷ và trông thật khủng khiếp - nếu không phải vì dung mạo gớm ghiếc, thì cũng vì tiềm năng của chúng."

 trait_truepossessed: "Bị Chiếm Hữu"
 trait_fomori: "Fomor"
 trait_bakemono: "Bakemono"
 trait_fomori_desc: "Nhân vật này đã bị một tà linh chiếm hữu."
 trait_drone: "Drone"
 trait_drone_desc: "Nhân vật này đã bị một linh thể $glossary_weaver$ chiếm hữu."
 trait_gorgon: "Gorgon"
 trait_gorgon_desc: "Nhân vật này đã bị một linh thể $glossary_wyld$ chiếm hữu."
 trait_kami: "Kami"
 trait_kami_desc: "Nhân vật này đã được chính Gaia chạm đến."
 
 trait_methuselahs_thirst: "Cơn Khát của Methuselah"
 trait_methuselahs_thirst_desc: "Nhân vật này không còn khả năng uống máu người phàm để duy trì bản thân bất kể Blood Potency. Họ phải ăn $pod_vitae$ của các Kindred khác."
 trait_methuselahs_thirst_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] không còn khả năng uống máu người phàm để duy trì [ROOT.GetCharacter.GetHerselfHimself] bất kể Blood Potency. [ROOT.GetCharacter.GetSheHe|U] phải ăn $pod_vitae$ của các Kindred khác."

 trait_hun_and_po: "Hồn và P'o"
 trait_hun_and_po_desc: "Có tin đồn rằng một hoặc nhiều Salubri đã thực sự đánh thức Hồn và P'o của mình để trở thành [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] trọn vẹn... dù điều này còn gây tranh cãi và bị chính $pod_kueijin$ chế giễu không ít.\nNhưng nếu hóa ra đó là sự thật, có thể sẽ có cách để $pod_cainites$ học được quyền năng của những người anh em họ phương Đông."

 TRAIT_FLAG_DESC_immortality: "#P @goodhealth_icon!Bất Tử#!"
 TRAIT_FLAG_DESC_cannot_heal_naturally: "#N @neardeath_icon!Không thể tự lành tự nhiên#!"
 TRAIT_FLAG_DESC_torpor_heal: "Mỗi 2 năm, hoặc chuyển [POD_aggravated_damage|E] thành [POD_superficial_damage|E] hoặc chữa lành [POD_superficial_damage|E]"
 

 
 TRAIT_FLAG_DESC_yin_imbalanced: "Cho phép bạn hấp thụ nhiều Khí Âm hơn giới hạn Đức Âm mà không chịu hiệu ứng tiêu cực"
 TRAIT_FLAG_DESC_yang_imbalanced: "Cho phép bạn hấp thụ nhiều Khí Dương hơn giới hạn Đức Dương mà không chịu hiệu ứng tiêu cực"
 
 trait_permanent_maimed: "Tàn Phế Vĩnh Viễn"
 trait_permanent_one_eyed: "Vĩnh Viễn Chột Mắt"
 trait_permanent_one_legged: "Vĩnh Viễn Cụt Một Chân"
 trait_permanent_disfigured: "Vĩnh Viễn Biến Dạng"
 trait_permanent_scarred: "Vĩnh Viễn Sẹo Sần"
 trait_permanent_eunuch: "Vĩnh Viễn Hoạn Quan"
 trait_permanent_blind: "Vĩnh Viễn Mù"

 trait_dhampir: "Dhampir"
 trait_dhampir_desc: "Dhampir là thuật ngữ chỉ một "nửa-ma cà rồng", con của một người phàm và một ma cà rồng."
 
 trait_anathema: "Anathema"
 trait_anathema_desc: "Anathema là những ma cà rồng hay sinh vật khác bị đưa vào một cuộc Blood Hunt. Thuật ngữ này đôi khi được dùng riêng để chỉ mười ba Anathema "bị truy nã gắt gao nhất" nằm trong Danh Sách Đỏ."
 trait_anathema_character_desc: "Anathema là những ma cà rồng hay sinh vật khác bị đưa vào một [blood_hunt|E]. Thuật ngữ này đôi khi được dùng riêng để chỉ mười ba Anathema "bị truy nã gắt gao nhất" nằm trong Danh Sách Đỏ."
 
 TRAIT_FLAG_DESC_anathema_trait_flag: "Có thể bị nhắm mục tiêu bởi một [blood_hunt|E]"
 
 trait_forever_infamous: "#N;bold Ô Danh Vĩnh Viễn#!"
 trait_forever_infamous_desc: "Nhân vật này sẽ không bao giờ được yên nữa, vì biết rằng toàn bộ thế giới siêu nhiên muốn họ chết."
 trait_forever_infamous_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] sẽ không bao giờ được yên nữa, vì biết rằng toàn bộ thế giới siêu nhiên muốn [ROOT.GetCharacter.GetHerHim] chết."
 
 TRAIT_FLAG_DESC_permanent_masquerade5: "Vĩnh viễn mắc kẹt ở [GetModifier('masquerade5_modifier').GetNameWithTooltip]"
 
 trait_forever_indomitable: "#P;bold Vĩnh Viễn Bất Khuất#!"
 trait_forever_indomitable_desc: "Nhân vật này đã chuộc lỗi trong mắt thế giới siêu nhiên bằng cách tiêu diệt Inquisition... sau khi chính họ đã gây ra nó."
 trait_forever_indomitable_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã chuộc lỗi trong mắt thế giới siêu nhiên bằng cách tiêu diệt Inquisition... sau khi chính [ROOT.GetCharacter.GetHerselfHimself] đã gây ra nó."

 trait_golconda: "Golconda"
 trait_golconda_desc: "Nhân vật này đã đạt được bình yên nội tâm sau khi [Concept('golconda','giác ngộ')] về bản chất thật của [Glossary('Dã Thú','game_concept_beast_desc')]."
 trait_golconda_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã đạt được bình yên nội tâm sau khi [Concept('golconda','giác ngộ')] về bản chất thật của [Glossary('Dã Thú','game_concept_beast_desc')]."

 trait_golconda_seeker: "Kẻ Tầm Golconda"
 trait_golconda_seeker_desc: "Nhân vật này đang trên con đường dài hướng tới [enlightenment|E]."
 trait_golconda_seeker_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] đang trên con đường dài hướng tới [enlightenment|E]."
 trait_track_golconda_seeker: "Ngộ Tính"
 trait_track_golconda_seeker_desc: "\nChỉ số [trait_level_track_xp|E] của bạn thể hiện tỷ lệ thành công trong các giai đoạn cuối của [journey|E] [GetTrait('golconda').GetName(GetNullCharacter)].\n\n#X Toàn bộ tiến độ sẽ mất khi rơi vào phẫn cuồng, hoặc khi phạm tội giết người hay trộm cắp.#!"

 TRAIT_FLAG_DESC_elder_perk_flag: "@vampire_icon!Có thể học [elder_perks|E] bất kể [Glossary('Thế Hệ','game_concept_vampgeneration_desc')]"
 TRAIT_FLAG_DESC_hungerless_flag: "[Concept('hungerless','Không còn bị ảnh hưởng bởi cơn đói khát máu')|E]"
 TRAIT_FLAG_DESC_immune_to_frenzy_flag: "Sẽ không bao giờ [Glossary('Phẫn Cuồng','game_concept_beast_desc')]"
 TRAIT_FLAG_DESC_perks_for_piety_flag: "Có thể đổi [piety|E] lấy [perks|E] [resonance|E]"
 TRAIT_FLAG_DESC_humanity_feast_flag: "Có thể tổ chức #TOOLTIP:ACTIVITY_TYPE,activity_feast #L Yến Tiệc#!#! và nhận [piety|E] khi làm vậy"
 TRAIT_FLAG_DESC_golconda_mentoring_flag: "Có thể cố vấn cho kẻ khác trên con đường tới [golconda|E]"
 TRAIT_FLAG_DESC_warning_golconda_flag: "\n#X Đặc điểm này sẽ mất khi phạm tội giết người hay trộm cắp#!"
 TRAIT_FLAG_DESC_warning_golconda_seeker_flag: "\n#X Toàn bộ [trait_level_track_xp|E] sẽ mất khi rơi vào phẫn cuồng, hoặc khi phạm tội giết người hay trộm cắp#!"
 
 trait_alien: "Ngoài Hành Tinh"
 trait_alien_desc: "Sinh vật ngoài Trái Đất."
 trait_chulorviah: "Chulorviah"
 trait_chulorviah_desc: "Chulorviah, còn gọi là Dòng Vực Thẳm hay Hậu Duệ Kraken, là một sinh vật kỳ dị thuộc cõi âm hoạt động giống như một căn bệnh."

 trait_crimson_fever: "Sốt Đỏ"
 trait_crimson_fever_desc: "Một căn bệnh siêu nhiên biểu hiện ở người Cathayan có Dương Tướng mất cân bằng. Dù là một bệnh khá hiếm, nó được đồn là cực kỳ dễ lây. Sự hiếm gặp của nó cũng có nghĩa là các phương thuốc tiềm năng chưa từng được nghiên cứu thực sự, khiến nó trở thành một viễn cảnh đáng sợ khi phải đối phó."
 trait_chulorviosis: "Chulorviosis"
 trait_chulorviosis_desc: "Một căn bệnh kỳ dị ảnh hưởng đến cả loài chân đầu (cephalopod) lẫn con người. Căn bệnh này thuần túy mang tính linh hồn; các cuộc khám nghiệm xác Chulorviah dạt vào bờ không cho ra thông tin gì về chúng. Virus này biến đổi con người và loài chân đầu để chúng trở nên giống loài kia hơn: một con người có thể mọc mỏ, da lốm đốm và giác hút, trong khi một con bạch tuộc có thể mọc móng tay thô sơ hoặc đổi màu mắt.\n\nTrí tuệ con người nhường chỗ cho bản năng, trong khi loài chân đầu trở nên có ý thức và độc ác hơn. Quá trình biến đổi có thể mất nhiều tháng để hoàn tất, nhưng gần như không thể tránh khỏi một khi đã bắt đầu. Sau khoảng sáu tháng, con người rời bỏ mặt đất để gia nhập đồng loại của mình dưới biển sâu. Trước khi đạt tới trạng thái đó, phần lớn Chulorviah tìm cách lây nhiễm cho càng nhiều người càng tốt."
 trait_gift_of_melancholia: "Món Quà U Sầu"
 trait_gift_of_melancholia_desc: "Một căn bệnh hao mòn khủng khiếp ảnh hưởng đến cả người phàm lẫn Hậu duệ Cain như nhau, gây chóng mặt, suy nhược, khó chịu và buồn nôn."
 trait_flaying_plague: "Ôn Dịch Lột Da"
 trait_flaying_plague_desc: "Một ôn dịch khủng khiếp ảnh hưởng đến cả Thân Tộc lẫn Garou như nhau. Ban đầu nó có vẻ như một biến thể kỳ lạ của bệnh lao, sau đó các mụn nhọt xuất hiện, rồi da tróc ra khỏi xương một cách đau đớn."
 trait_scourge: "Scourge"
 trait_scourge_desc: "Scourge là một ôn dịch riêng của ma cà rồng lây nhiễm vào Máu. Căn bệnh này là một chủng đột biến của bệnh phong lai với dịch hạch, tấn công trực tiếp vào $pod_vitae$ của ma cà rồng. Khi đã nhiễm bệnh, nạn nhân phải tiêu tốn nhiều máu hơn mỗi lần họ tiêu $pod_vitae$. Tình trạng này càng tệ hơn theo từng đêm nạn nhân chịu đựng Scourge. Trong một số trường hợp, nạn nhân còn mắc thêm một chứng bệnh làm biến dạng ngoại hình nhưng không đe dọa tính mạng."
 trait_track_scourge: "Mức Độ"
 trait_track_scourge_desc: "Mức Độ Scourge"
 trait_entoban_plague: "Ôn Dịch Entoban"
 trait_entoban_plague_desc: "Một căn bệnh cổ xưa cực kỳ chết người đã phá vỡ những lá bùa từng ngăn giữ nó ở châu Phi."

 TRAIT_FLAG_DESC_bypass_mental_defenses: "Có thể vượt qua hàng phòng thủ tinh thần mạnh"

 TRAIT_FLAG_DESC_immunity_to_the_delirium: "Miễn nhiễm với Delirium"
 TRAIT_FLAG_DESC_regeneration: "@goodhealth_icon!Chữa lành [POD_superficial_damage|E] nhanh hơn"
 TRAIT_FLAG_DESC_fera_trait_healing: "@goodhealth_icon!Chữa lành mọi thương tật không vĩnh viễn mỗi năm"
 TRAIT_FLAG_DESC_resurrection: "Cho phép hồi sinh nếu nhân vật chết vì nguyên nhân phi tự nhiên"
 
 TRAIT_FLAG_DESC_capture_immunity: "Bạn không thể bị bắt giam trong [sieges|E] hay [raids|E] nữa"
 TRAIT_FLAG_DESC_avoid_combat_wound: "Ít nguy cơ bị thương hoặc bị giết trong chiến đấu hơn."
 TRAIT_FLAG_DESC_strong_mental_defenses: "Miễn nhiễm với [character_interaction|E] tinh thần thù địch."

 TRAIT_FLAG_DESC_cannot_shapeshift: "#X @warning_icon! Không thể biến hình#!"

 trait_azhi_dahaka_scholar: "Học Giả Azhi Dahaka"
 trait_azhi_dahaka_scholar_desc: "Nhân vật này tìm kiếm sự thấu hiểu về Azhi Dahaka, một trạng thái giác ngộ và tối thượng của sự tồn tại có thể đạt được qua việc sử dụng rộng rãi Dị năng Vicissitude."
 trait_azhi_dahaka_scholar_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] tìm kiếm sự thấu hiểu về Azhi Dahaka, một trạng thái giác ngộ và tối thượng của sự tồn tại có thể đạt được qua việc sử dụng rộng rãi Dị năng Vicissitude."
 trait_track_azhi_dahaka_scholar: "Biến Hình"
 trait_track_azhi_dahaka_scholar_desc: "Bạn đang tiến dần từng bước đến sự thăng hoa."
#brought on by extensive use of the discipline Vicissitude."
 trait_azhi_dahaka: "Azhi Dahaka"
 trait_azhi_dahaka_desc: "Azhi Dahaka là thuật ngữ mà ma cà rồng $pod_clan$ [GetTrait('tzimisce').GetName(GetNullCharacter)] dùng để chỉ một trạng thái giác ngộ và tối thượng của sự tồn tại. Một hình thể vật chất và tâm linh biến đổi không ngừng, khó hiểu với hầu hết mọi kẻ."
 trait_azhi_dahaka_character_desc: "$trait_azhi_dahaka_desc$\n\nĐã trút bỏ những tàn tích cuối cùng của nhân tính [ROOT.Char.GetHerHis], [ROOT.Char.GetFirstNameNoTooltip] đã trở nên thực sự đáng sợ khi nhìn vào: một Rồng giữa muôn vàn Rồng."
 TRAIT_FLAG_DESC_can_ghoul_supernaturals_flag: "@ghoul_icon!Có thể [ghoul|E] hầu hết sinh vật siêu nhiên"
 TRAIT_FLAG_DESC_free_vampire_shapeshifts_flag: "@vampire_icon![shapeshift|E] của ma cà rồng không còn tốn [Concept('hunger','@blood_icon!Máu')|E]"
 TRAIT_FLAG_DESC_azhi_dahaka_stat_randomization_flag: "@vampire_icon![skills|E] gốc liên tục thay đổi"

 TRAIT_FLAG_DESC_infinite_blood_flag: "Nguồn dự trữ [Concept('hunger','@blood_icon!Máu')|E] vô hạn"
 
 trait_zombu: "Zombu"
 trait_zombu_desc: "Một xác chết được hồi sinh bằng ma thuật gọi hồn. Những sinh vật này không biết sợ hãi, không bao giờ mệt mỏi, và hoàn toàn phục tùng. Chúng thường được dùng làm lao công hay binh lính. Một số đã mục nát đến mức trông như những bộ xương lê bước."

 trait_pod_crafter_1: "Thợ Thủ Công"
 trait_pod_crafter_2: "Thợ Thủ Công Chuyên Nghiệp"
 trait_pod_crafter_3: "Đại Sư Thợ Thủ Công"
 trait_pod_crafter_1_desc: "Nhân vật này có ít nhiều kinh nghiệm trong nghệ thuật chế tác."
 trait_pod_crafter_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] có ít nhiều kinh nghiệm trong nghệ thuật chế tác."
 trait_pod_crafter_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] là một chuyên gia trong nghệ thuật chế tác."
 trait_pod_crafter_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] là một bậc thầy trong nghệ thuật chế tác."
 trait_track_forging: "Rèn Đúc"
 trait_track_forging_desc: "Kinh nghiệm Rèn Đúc, càng cao thì [artifacts|E] chế tác ra càng tốt"
 trait_track_brewing: "Chưng Cất"
 trait_track_brewing_desc: "Kinh nghiệm Chưng Cất, càng cao thì [artifacts|E] chế tác ra càng tốt"
 trait_track_enhancing: "Tăng Cường"
 trait_track_enhancing_desc: "Kinh nghiệm Tăng Cường, càng cao thì [artifacts|E] chế tác ra càng tốt"
 
 trait_ashen_adventurer: "Nhà Thám Hiểm Tro Tàn"
 trait_ashen_adventurer_desc: "Một nhà thám hiểm lang bạt bị thúc đẩy bởi việc tìm kiếm giàu sang, danh vọng và máu."
 trait_track_ashen_ambassador: "[ashen_ambassador|E]"
 trait_track_ashen_ambassador_desc: "#bold Bạn có thể nhận kinh nghiệm cho track đặc điểm này bằng cách sử dụng tương tác nhân vật Chuyến Viếng Thăm Ngoại Giao.#! \n Thề trung thành với một nhà cai trị ngoại bang, nhà ngoại giao này rong ruổi khắp vùng đất để tìm cơ hội mang lại lợi ích cho người bảo trợ mình."
 
 trait_track_ashen_grandmaster: "[ashen_grandmaster|E]"
 trait_track_ashen_grandmaster_desc: "#bold Kinh nghiệm này có thể dùng để cải thiện quân đoàn của bạn với tư cách một ma cà rồng vô địa, hoặc chiến lược của bạn với tư cách một $pod_kueijin$ vô địa. Có thể nhận được bằng cách hoàn thành hợp đồng quân sự hoặc chiến tranh vô địa.#! \nHậu duệ Cain có truyền thống lập các đội quân được chính thức hóa thành một tổ chức đủ cấu trúc và mục đích chung để được coi là một quân đoàn.\nỞ phương Đông, $pod_kueijin$ tận tâm hơn trong việc cải thiện sự tinh thông quân sự của mình theo hướng chiến lược."
 trait_track_ashen_caravan: "[ashen_caravan|E]"
 trait_track_ashen_caravan_desc: "#bold Kinh nghiệm này có thể nhận được bằng cách hoàn thành hợp đồng vận chuyển.#! \nAshen Caravan Master là số ít những nhân vật thực sự biết cách chèo lái những con đường chết chóc của Thế Giới Bóng Tối, và bán kinh nghiệm của mình cho những ai cần đến."
 
 trait_track_ashen_cult: "[ashen_cult|E]"
 trait_track_ashen_cult_desc: "#bold You can improve this trait track by using the decision of the same name. It allows you to interact with the county your domicile is stationed in various ways via an event.#! \n Prophets, heresiarchs, miracles workers... the World of Darkness is full of people, be they mortals or not, that are looking to the truth and willing to believe in a charismatic individual delivering (their version of) it."
 

