 trait_dharma9: "Pháp Môn 9"
 trait_dharma9_player_desc: "$trait_dharma_player_desc$\n\n\n$trait_dharma9_desc$"
 trait_dharma9_desc: "Còn gọi là [Glossary('Bồ Tát','podgloss.bodhisattva')], kẻ đã đạt tới giai đoạn cuối cùng của [Glossary('Pháp Môn','podgloss.dharma')] mình chọn, thường cần 1000 năm để đạt tới trạng thái này. Có thể ăn Khí trong không khí xung quanh."
