 trait_wanxian: "Wan Xian"
 trait_wankuei: "Wan Kuei"
 trait_kueijin: "Kuei-Jin"
 trait_kueijin_desc: "Còn được gọi là Wan Kuei, Gui Ren, asuratizayya (ở Ấn Độ), "Ngạ Tử" hay đơn giản là "Ma cà rồng Đông phương".\n\nTương truyền Kuei-Jin là hậu duệ đã hư hoại của Wan Xian, "Thập Vạn Anh Hùng" mà [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')] tuyển chọn thuở xa xưa để dẫn dắt và bảo hộ vũ trụ. Wan Xian ban đầu được chọn qua những thử thách về tài năng và dũng khí, và lấy khí lưu tán của vũ trụ làm thức ăn. Thế nhưng họ đã đánh mất ân sủng, học cách hút khí của sinh vật sống mà làm hoen ố chính những thử thách định phẩm giá ấy.\n\nMột Kuei-Jin "sinh ra" khi linh hồn kẻ ấy thoát khỏi một [UmbraGlossaryLocalized('yomi_wan','Địa Ngục Yomi')] sau khi chết. Chúng tự tổ chức quanh các Triều đình chính trị và theo một [Glossary('Dharma','podgloss.dharma')] để tìm đường trở về Thiên Đình." 
  
 trait_animalism: "Animalism"
 trait_animalism_desc: "Một $pod_discipline$ đưa ma cà rồng lại gần bản chất thú tính của mình hơn. Điều này không chỉ cho phép chúng giao tiếp và giành quyền thống trị lên các sinh vật của tự nhiên, mà còn ban cho chúng ảnh hưởng lên chính [Glossary('The Beast','game_concept_beast_desc')].\n\nAnimalism đặc biệt phổ biến trong các clan xa rời nhân tính nhất, dù nhiều quyền năng của nó nhắm cụ thể vào Dã Thú của phàm nhân và $pod_cainites$."
 
 trait_animalismadvanced: "Animalism Nâng cao"
 trait_animalismadvanced_desc: "Một $pod_discipline$ đưa ma cà rồng lại gần bản chất thú tính của mình hơn. Điều này không chỉ cho phép chúng giao tiếp và giành quyền thống trị lên các sinh vật của tự nhiên, mà còn ban cho chúng ảnh hưởng lên chính [Glossary('The Beast','game_concept_beast_desc')].\n\nAnimalism đặc biệt phổ biến trong các clan xa rời nhân tính nhất, dù nhiều quyền năng của nó nhắm cụ thể vào Dã Thú của phàm nhân và $pod_cainites$."
 
 trait_auspex: "Auspex"
 trait_auspex_desc: "Auspex là một $pod_discipline$ ban cho ma cà rồng giác quan siêu nhiên.\nĐây là một trong những [Glossary('Disciplines','game_concept_discipline_desc')] phổ biến và được ưa chuộng nhất trong hàng ngũ $pod_cainites$ nhờ tính linh hoạt và hữu ích toàn diện trong hầu như mọi khía cạnh của đời sống ma cà rồng. Hơn nữa, nó được biết là ban một mức độ khả năng tiên tri nhất định, đặc biệt khi cảnh báo một $pod_cainite$ về nguy hiểm, ngay cả khi họ đang trong $pod_torpor$."
 
 trait_auspexadvanced: "Auspex Nâng cao"
 trait_auspexadvanced_desc: "Auspex là một $pod_discipline$ ban cho ma cà rồng giác quan siêu nhiên.\nĐây là một trong những [Glossary('Disciplines','game_concept_discipline_desc')] phổ biến và được ưa chuộng nhất trong hàng ngũ $pod_cainites$ nhờ tính linh hoạt và hữu ích toàn diện trong hầu như mọi khía cạnh của đời sống ma cà rồng. Hơn nữa, nó được biết là ban một mức độ khả năng tiên tri nhất định, đặc biệt khi cảnh báo một $pod_cainite$ về nguy hiểm, ngay cả khi họ đang trong $pod_torpor$."
 
 trait_celerity: "Celerity"
 trait_celerity_desc: "Celerity là một $pod_discipline$ ban cho ma cà rồng sự nhanh nhẹn và phản xạ siêu nhiên.\n\nVới một số $pod_cainites$, thế giới phàm nhân trôi qua như quay chậm. Trong lúc căng thẳng, ma cà rồng có Celerity có thể di chuyển với tốc độ kinh ngạc, trở thành những vệt mờ chuyển động với bất cứ ai, phàm nhân hay bất tử, không sở hữu $pod_discipline$ này."
 
 trait_celerityadvanced: "Celerity Nâng cao"
 trait_celerityadvanced_desc: "Celerity là một $pod_discipline$ ban cho ma cà rồng sự nhanh nhẹn và phản xạ siêu nhiên.\n\nVới một số $pod_cainites$, thế giới phàm nhân trôi qua như quay chậm. Trong lúc căng thẳng, ma cà rồng có Celerity có thể di chuyển với tốc độ kinh ngạc, trở thành những vệt mờ chuyển động với bất cứ ai, phàm nhân hay bất tử, không sở hữu $pod_discipline$ này." 
 
 trait_chimerstry: "Chimerstry"
 trait_chimerstry_desc: "Chimerstry là $pod_discipline$ đặc trưng của Ravnos, triệu hồi ảo ảnh vào tồn tại. Những hình ảnh ma quái ấy chân thực đến mức nào tùy vào kỹ năng của $pod_cainite$."
 
 trait_chimerstryadvanced: "Chimerstry Nâng cao"
 trait_chimerstryadvanced_desc: "Chimerstry là $pod_discipline$ đặc trưng của Ravnos, triệu hồi ảo ảnh vào tồn tại. Những hình ảnh ma quái ấy chân thực đến mức nào tùy vào kỹ năng của $pod_cainite$."
 
 trait_daimonion: "Daimonion"
 trait_daimonion_desc: "Daimonion là một $pod_discipline$ ma quỷ chỉ được thực hành bởi Baali và những kẻ thờ ma tồi tệ nhất trong hàng ngũ ma cà rồng. Quyền năng của nó chính là quyền năng của Ác Quỷ, và qua việc sử dụng Daimonion, Baali khai thác thế lực của Địa Ngục và lũ quỷ của nó để làm suy sụp tinh thần và tàn phế kẻ thù."

 trait_daimonionadvanced: "Daimonion Nâng cao" 
 trait_daimonionadvanced_desc: "Daimonion là một $pod_discipline$ ma quỷ chỉ được thực hành bởi Baali và những kẻ thờ ma tồi tệ nhất trong hàng ngũ ma cà rồng. Quyền năng của nó chính là quyền năng của Ác Quỷ, và qua việc sử dụng Daimonion, Baali khai thác thế lực của Địa Ngục và lũ quỷ của nó để làm suy sụp tinh thần và tàn phế kẻ thù."  

 trait_dementation: "Dementation"
 trait_dementation_desc: "Dementation là một $pod_discipline$ được biết rộng rãi như dấu ấn đặc trưng của Malkavian.\n\n Dementation khai thác chính sự điên loạn của ma cà rồng và dùng nó để đạt được những nhận thức sâu sắc hoặc gieo rắc điên loạn lên kẻ khác. Những quyền năng như vậy là một trong những lý do chính khiến $pod_clan$ Malkavian thường được xem vừa sâu sắc vừa cực kỳ nguy hiểm."
 
 trait_dementationadvanced: "Dementation Nâng cao"
 trait_dementationadvanced_desc: "Dementation là một $pod_discipline$ được biết rộng rãi như dấu ấn đặc trưng của Malkavian.\n\n Dementation khai thác chính sự điên loạn của ma cà rồng và dùng nó để đạt được những nhận thức sâu sắc hoặc gieo rắc điên loạn lên kẻ khác. Những quyền năng như vậy là một trong những lý do chính khiến $pod_clan$ Malkavian thường được xem vừa sâu sắc vừa cực kỳ nguy hiểm."
 
 trait_dominate: "Dominate"
 trait_dominate_desc: "Dominate là một $pod_discipline$ áp đảo tâm trí người khác bằng ý chí của ma cà rồng, buộc nạn nhân phải suy nghĩ hay hành động theo mệnh lệnh của ma cà rồng."
 
 trait_dominateadvanced: "Dominate Nâng cao"
 trait_dominateadvanced_desc: "Dominate là một $pod_discipline$ áp đảo tâm trí người khác bằng ý chí của ma cà rồng, buộc nạn nhân phải suy nghĩ hay hành động theo mệnh lệnh của ma cà rồng.\n\nKhía cạnh của Dominate trong lời nguyền ma cà rồng là nó hạ thấp giá trị của tình bạn hay sự thân mật chân thực. Dominate cũng làm cùn mòn sự đồng cảm của người sử dụng, và ai đó phải cẩn thận để không quen với việc luôn bị bao quanh bởi những kẻ nịnh hót."
 
 trait_fortitude: "Fortitude"
 trait_fortitude_desc: "Fortitude là một $pod_discipline$ ban cho Kindred sự bền bỉ phi phàm, đến mức có thể kháng cự cả lửa và ánh mặt trời.\n\nFortitude cũng có thể bảo vệ khỏi sự thao túng và kiểm soát như từ [Glossary('Disciplines','game_concept_discipline_desc')] Dominate và Presence."
 
 trait_flight: "Flight"
 trait_flight_desc: "Đôi cánh bẩm sinh, tiến hóa, ghép nối hay có được bằng cách khác, cùng kinh nghiệm phong phú trong việc sử dụng nó. Ban cho quyền năng bay lượn."
 
 trait_flightadvanced: "Flight Nâng cao"
 trait_flightadvanced_desc: "Flight là một $pod_discipline$ siêu nhiên, độc quyền của huyết thống Gargoyle, cho phép những ma cà rồng này bay lượn.\n\nQuá nặng để bay bằng phương thức tự nhiên, những Gargoyle bằng đá phải sử dụng $pod_discipline$ này; các $pod_cainites$ khác có khả năng bay (bằng cách biến thành dơi hay sương mù dùng Protean, chẳng hạn) không cần nó và không thể học nó."
 
 trait_melpominee: "Melpominee"
 trait_melpominee_desc: "$pod_discipline$ Melpominee xuất hiện đồng thời với Daughters of Cacophony và gắn bó chặt chẽ với huyết thống ấy. Nó cho phép người sở hữu dùng lời nói và tiếng hát để tạo ra nhiều hiệu ứng siêu nhiên khác nhau."
 
 trait_melpomineeadvanced: "Melpominee Nâng cao"
 trait_melpomineeadvanced_desc: "$pod_discipline$ Melpominee xuất hiện đồng thời với Daughters of Cacophony và gắn bó chặt chẽ với huyết thống ấy. Nó cho phép người sở hữu dùng lời nói và tiếng hát để tạo ra nhiều hiệu ứng siêu nhiên khác nhau.\n\nĐược đặt tên theo nàng Muse Bi Kịch của Hy Lạp, Melpominee là một $pod_discipline$ độc nhất của Daughters of Cacophony. Nó khám phá quyền năng của giọng nói, làm rung chuyển tận tâm hồn những kẻ xung quanh và cho phép ma cà rồng thực hiện những kỳ tích âm thanh vốn không thể có được bằng cách khác."
 
 trait_mytherceria: "Mytherceria"
 trait_mytherceria_desc: "Mytherceria là một $pod_discipline$ biểu hiện ở những ma cà rồng mang dòng máu tiên tộc như Kiasyd và Maeghar. Nó ban cho ma cà rồng giác quan thần bí, khả năng đánh cắp tri thức, và các quyền năng khác gắn liền với tiên tộc."
 
 trait_mytherceriaadvanced: "Mytherceria Nâng cao"
 trait_mytherceriaadvanced_desc: "Mytherceria là một $pod_discipline$ biểu hiện ở những ma cà rồng mang dòng máu tiên tộc như Kiasyd và Maeghar. Nó ban cho ma cà rồng giác quan thần bí, khả năng đánh cắp tri thức, và các quyền năng khác gắn liền với tiên tộc.\n\nMột tập hợp quyền năng gắn liền với tiên tộc và có xu hướng phơi bày tri thức mới, Mytherceria đã đẩy nhiều nạn nhân của nó vào cơn điên loạn lảm nhảm, hoặc ít nhất là sự bực bội tột cùng."
 
 trait_necromancy: "Thuật Gọi Hồn"
 trait_necromancy_desc: "[necromancy|E] là một hình thức [bloodsorcery|E] chuyên biệt cho thế giới của kẻ chết: oan hồn và [UmbraGlossary('shadowlands')]. Cũng như có nhiều trường phái [bloodsorcery|E] thông thường khác nhau, có nhiều cách thực hành [necromancy|E] khác nhau. Nó chủ yếu được thực hành bởi Giovanni."
 trait_necromancy_character_desc: "$necromancy_paths_display$\n\n$trait_necromancy_desc$"
 
 trait_necromancyadvanced: "Thuật Gọi Hồn Nâng cao"

 necromancy_paths_display: "#medium [ROOT.Char.GetFirstNameNoTooltip] có kiến thức về những trường phái Thuật Gọi Hồn sau:[AddTextIf(GetScriptedGui('has_cappadocian_necromancy_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@cappadocian_icon! Cappadocian')][AddTextIf(GetScriptedGui('has_giovanni_necromancy_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@giovanni_icon! Giovanni')][AddTextIf(GetScriptedGui('has_harbinger_necromancy_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@harbinger_icon! Harbinger')][AddTextIf(GetScriptedGui('has_impundulu_necromancy_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@impundulu_icon! Impundulu')][AddTextIf(GetScriptedGui('has_lamia_necromancy_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@lamia_icon! Lamia')][AddTextIf(GetScriptedGui('has_nagaraja_necromancy_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@nagaraja_icon! Nagaraja')][AddTextIf(GetScriptedGui('has_rosselini_necromancy_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@giovanni_icon! Rosselini')]#!"
 
 trait_obeah: "Obeah"
 trait_obeah_desc: "Obeah là $pod_discipline$ độc nhất của Salubri, còn được gọi là Valeren Path of the Healer.\n\nObeah bắt nguồn từ Saulot trong những chuyến du hành của ngài tới phương Đông, học từ [GetTrait('kueijin').GetName( GetNullCharacter )] cách sử dụng Ngọc Rồng. Học Obeah khiến một con mắt thứ ba phát triển giữa trán."
 
 trait_obeahadvanced: "Obeah Nâng cao"
 trait_obeahadvanced_desc: "Obeah là $pod_discipline$ độc nhất của Salubri, còn được gọi là Valeren Path of the Healer.\n\nObeah bắt nguồn từ Saulot trong những chuyến du hành của ngài tới phương Đông, học từ [GetTrait('kueijin').GetName( GetNullCharacter )] cách sử dụng Ngọc Rồng. Học Obeah khiến một con mắt thứ ba phát triển giữa trán."
 
 trait_obfuscate: "Obfuscate"
 trait_obfuscate_desc: "Obfuscate là một $pod_discipline$ cho phép ma cà rồng ẩn mình, đánh lừa tâm trí kẻ khác, hoặc khiến họ phớt lờ những gì người dùng không muốn bị nhìn thấy.\n\nObfuscate là một phần của lời nguyền Caine lên [Glossary('Antediluvians','game_concept_antediluvian_desc')], xóa nhòa họ khỏi tạo hóa."
 
 trait_obfuscateadvanced: "Obfuscate Nâng cao"
 trait_obfuscateadvanced_desc: "Obfuscate là một $pod_discipline$ cho phép ma cà rồng ẩn mình, đánh lừa tâm trí kẻ khác, hoặc khiến họ phớt lờ những gì người dùng không muốn bị nhìn thấy.\n\nObfuscate là một phần của lời nguyền Caine lên [Glossary('Antediluvians','game_concept_antediluvian_desc')], xóa nhòa họ khỏi tạo hóa. Những kẻ thường xuyên sử dụng $pod_discipline$ này thấy mình tách biệt khỏi xã hội, không bao giờ tham gia tương tác xã hội, chỉ quan sát."
 
 trait_obtenebration: "Obtenebration"
 trait_obtenebration_desc: "[Glossary('Obtenebration','game_concept_obtenebration_desc')] được cho là càng làm đọa đày thêm ma cà rồng sử dụng nó, kẻ tự tách mình xa hơn khỏi ân sủng của Chúa và rơi vào lực hút tăm tối của Vực Thẳm. Vì lý do này, người dùng bị cả loài vật lẫn con người xa lánh. Bóng tối phi tự nhiên được Obtenebration triệu hồi cực kỳ đáng sợ với phàm nhân, loài vật, và thậm chí cả những $pod_cainites$ khác chưa quen với việc sử dụng nó."
 
 trait_obtenebrationadvanced: "Obtenebration Nâng cao"
 trait_obtenebrationadvanced_desc: "Obtenebration được cho là càng làm đọa đày thêm ma cà rồng sử dụng nó, kẻ tự tách mình xa hơn khỏi ân sủng của Chúa và rơi vào lực hút tăm tối của Vực Thẳm. Vì lý do này, người dùng bị cả loài vật lẫn con người xa lánh. Bóng tối phi tự nhiên được Obtenebration triệu hồi cực kỳ đáng sợ với phàm nhân, loài vật, và thậm chí cả những $pod_cainites$ khác chưa quen với việc sử dụng nó."
 
 trait_potence: "Potence"
 trait_potence_desc: "Potence là $pod_discipline$ ban cho ma cà rồng sức mạnh thể chất và sự cường tráng phi thường. Ma cà rồng có $pod_discipline$ Potence sở hữu năng lực thể chất vượt xa giới hạn của phàm nhân."

 trait_potenceadvanced: "Potence Nâng cao"
 trait_potenceadvanced_desc: "Potence là $pod_discipline$ ban cho ma cà rồng sức mạnh thể chất và sự cường tráng phi thường. Ma cà rồng có $pod_discipline$ Potence sở hữu năng lực thể chất vượt xa giới hạn của phàm nhân." 
 
 trait_presence: "Presence"
 trait_presence_desc: "Presence là $pod_discipline$ về sức hút siêu nhiên và thao túng cảm xúc, cho phép Kindred thu hút, lay chuyển, và kiểm soát đám đông.\n\nPresence làm dịu bớt lời nguyền của Chúa lên $pod_cainites$ ở chỗ nó khiến ma cà rồng trở thành trung tâm của sự chú ý. Bằng cách mê hoặc, quyến rũ, hay đe dọa những kẻ ở gần."

 trait_presenceadvanced: "Presence Nâng cao" 
 trait_presenceadvanced_desc: "Presence là $pod_discipline$ về sức hút siêu nhiên và thao túng cảm xúc, cho phép Kindred thu hút, lay chuyển, và kiểm soát đám đông.\n\nPresence làm dịu bớt lời nguyền của Chúa lên $pod_cainites$ ở chỗ nó khiến ma cà rồng trở thành trung tâm của sự chú ý. Bằng cách mê hoặc, quyến rũ, hay đe dọa những kẻ ở gần."

 trait_kai: "Kai"
 trait_kai_desc: "Kai là một $pod_discipline$ về nội lực dựa trên danh dự được nuôi dưỡng bên trong người sử dụng.\n\nNgười dùng Kai tập trung nội lực và ý chí của mình thành một thứ vũ khí vừa mang tính quân sự vừa mang tính cưỡng ép."

 trait_kaiadvanced: "Kai Nâng cao" 
 trait_kaiadvanced_desc: "Kai là một $pod_discipline$ về nội lực dựa trên danh dự được nuôi dưỡng bên trong người sử dụng.\n\nNgười dùng Kai tập trung nội lực và ý chí của mình thành một thứ vũ khí vừa mang tính quân sự vừa mang tính cưỡng ép."

 TRAIT_FLAG_DESC_can_intensify_herd_resonance: "Có thể thay đổi cường độ [resonance|E] của các thành viên [POD_herd|E] của mình"

 trait_protean: "Protean"
 trait_protean_desc: "Protean là $pod_discipline$ ban cho ma cà rồng khả năng biến đổi hình dạng, từ mọc ra móng vuốt thú tính đến bốc hơi thành một đám sương mù.\n\nProtean là một phần của lời nguyền Chúa lên Caine ở khía cạnh nó bóc trần lớp mặt nạ nhân tính mà mọi ma cà rồng phải giữ gìn, phơi bày [Glossary('The Beast','game_concept_beast_desc')] trong tâm hồn hắn."
 
 trait_proteanadvanced: "Protean Nâng cao"
 trait_proteanadvanced_desc: "Protean là $pod_discipline$ ban cho ma cà rồng khả năng biến đổi hình dạng, từ mọc ra móng vuốt thú tính đến bốc hơi thành một đám sương mù.\n\nProtean là một phần của lời nguyền Chúa lên Caine ở khía cạnh nó bóc trần lớp mặt nạ nhân tính mà mọi ma cà rồng phải giữ gìn, phơi bày [Glossary('The Beast','game_concept_beast_desc')] trong tâm hồn hắn. Người dùng ở cấp Nâng cao đôi khi thấy cơ thể mình biến đổi ngoài ý muốn, phản ứng trực tiếp với cảm xúc, đẩy họ vào những tình huống bối rối."
 
 trait_quietus: "Quietus"
 trait_quietus_desc: "Quietus là $pod_discipline$ đặc trưng của Assamite, ban cho họ ảnh hưởng lên máu của kẻ khác.\n\nDù mỗi Đẳng Cấp Assamite đều sở hữu Quietus như một $pod_discipline$ nội bộ $pod_clan$, nó chủ yếu được biết đến như công cụ của sát thủ trong tay Đẳng Cấp Chiến Binh, và các quyền năng cấp thấp hơn phần lớn hướng tới mục đích đó."

 trait_quietusadvanced: "Quietus Nâng cao"
 trait_quietusadvanced_desc: "Quietus là $pod_discipline$ đặc trưng của Assamite, ban cho họ ảnh hưởng lên máu của kẻ khác.\n\nDù mỗi Đẳng Cấp Assamite đều sở hữu Quietus như một $pod_discipline$ nội bộ $pod_clan$, nó chủ yếu được biết đến như công cụ của sát thủ trong tay Đẳng Cấp Chiến Binh, và các quyền năng cấp thấp hơn phần lớn hướng tới mục đích đó."
 
 trait_rift: "Rift"
 trait_rift_desc: "Rift là một $pod_discipline$ chủ yếu được [GetTrait('kizoku').GetName( GetNullCharacter )] thực hành, cho phép họ dùng ác mộng của mình để thao túng thực tại theo những cách mang lại lợi ích lớn cho khả năng cơ động và mưu mẹo của bản thân."

 trait_riftadvanced: "Rift Nâng cao" 
 trait_riftadvanced_desc: "Rift là một $pod_discipline$ chủ yếu được [GetTrait('kizoku').GetName( GetNullCharacter )] thực hành, cho phép họ dùng ác mộng của mình để thao túng thực tại theo những cách mang lại lợi ích lớn cho khả năng cơ động và mưu mẹo của bản thân."

 trait_serpentis: "Serpentis"
 trait_serpentis_desc: "Serpentis là $pod_discipline$ đặc trưng của $pod_clan$ Followers of Set. Nó chủ yếu cung cấp khả năng biến hình, dù cũng bao hàm sự ô uế và các đặc tính khác gắn liền với rắn.\n\nSerpentis mang ý nghĩa gần như tôn giáo với $pod_clan$ này, dù các nhà khoa học Kindred cho rằng có mối liên hệ với quyền năng biến hình của Protean."
 
 trait_serpentisadvanced: "Serpentis Nâng cao"
 trait_serpentisadvanced_desc: "Serpentis là $pod_discipline$ đặc trưng của $pod_clan$ Followers of Set. Nó chủ yếu cung cấp khả năng biến hình, dù cũng bao hàm sự ô uế và các đặc tính khác gắn liền với rắn.\n\nSerpentis mang ý nghĩa gần như tôn giáo với $pod_clan$ này, dù các nhà khoa học Kindred cho rằng có mối liên hệ với quyền năng biến hình của Protean."
 
 trait_spiritus: "Spiritus"
 trait_spiritus_desc: "Spiritus là một $pod_discipline$ độc quyền của huyết thống Ahrimane, cho phép họ tương tác với linh hồn thú tính. Ở cấp cơ bản nhất, nó cho phép ma cà rồng nói chuyện và triệu hồi linh hồn, nhưng ở cấp cao hơn, quyền năng có thể được dẫn truyền từ chúng để tăng cường sức mạnh cho Ahrimane."

 trait_spiritusadvanced: "Spiritus Nâng cao"
 trait_spiritusadvanced_desc: "Spiritus là một $pod_discipline$ độc quyền của huyết thống Ahrimane, cho phép họ tương tác với linh hồn thú tính. Ở cấp cơ bản nhất, nó cho phép ma cà rồng nói chuyện và triệu hồi linh hồn, nhưng ở cấp cao hơn, quyền năng có thể được dẫn truyền từ chúng để tăng cường sức mạnh cho Ahrimane."
 
 trait_temporis: "Temporis"
 trait_temporis_desc: "Temporis là một $pod_discipline$ độc quyền của True Brujah. Được cho là một dạng tinh luyện của Celerity, Temporis ban cho $pod_cainite$ khả năng thao túng chính dòng chảy thời gian."

 trait_temporisadvanced: "Temporis Nâng cao"
 trait_temporisadvanced_desc: "Temporis là một $pod_discipline$ độc quyền của True Brujah. Được cho là một dạng tinh luyện của Celerity, Temporis ban cho $pod_cainite$ khả năng thao túng chính dòng chảy thời gian.\n\nDù quyền năng, $pod_discipline$ này cũng có thể gây căng thẳng khi sử dụng."
 
 trait_thinbloodalchemy: "Thin Blood Alchemy"
 trait_thinbloodalchemy_desc: "$pod_discipline$ độc quyền cho Thin-Blood, cho phép họ mô phỏng quyền năng của [Glossary('Disciplines','game_concept_discipline_desc')] ma cà rồng thuần huyết.\n\nThin-Blood Alchemy là một thực hành hai bước: chưng cất một hỗn hợp máu theo công thức phù hợp, rồi kích hoạt hỗn hợp đó bằng cách uống nó và dẫn truyền quyền năng của nó."

 trait_thinbloodalchemyadvanced: "Thin-blood Alchemy Nâng cao"
 trait_thinbloodalchemyadvanced_desc: "$pod_discipline$ độc quyền cho Thin-Blood, cho phép họ mô phỏng quyền năng của [Glossary('Disciplines','game_concept_discipline_desc')] ma cà rồng thuần huyết.\n\nThin-Blood Alchemy là một thực hành hai bước: chưng cất một hỗn hợp máu theo công thức phù hợp, rồi kích hoạt hỗn hợp đó bằng cách uống nó và dẫn truyền quyền năng của nó."

 trait_valeren: "Valeren"
 trait_valeren_desc: "Valeren là $pod_discipline$ thần bí của Salubri. Ở cấp cơ bản nhất, Valeren ban khả năng kiểm soát cơn đau và tăng cường năng lực quân sự, dường như cho phép các chiến binh khai thác quyền năng thiên đường để đánh bại kẻ thù."

 trait_valerenadvanced: "Valeren Nâng cao" 
 trait_valerenadvanced_desc: "Valeren là $pod_discipline$ thần bí của Salubri. Ở cấp cơ bản nhất, Valeren ban khả năng kiểm soát cơn đau và tăng cường năng lực quân sự, dường như cho phép các chiến binh khai thác quyền năng thiên đường để đánh bại kẻ thù." 

 trait_vicissitude: "Vicissitude"
 trait_vicissitude_desc: "Một trong những quyền năng kinh hoàng nhất mà $pod_cainites$ có được, Vicissitude là quyền năng đặc trưng của Tzimisce và gần như không được biết tới ngoài $pod_clan$ này. Với nó, một kẻ tạo hình dày dạn kinh nghiệm có thể tạc nên da thịt và xương cốt của một đối tượng, biến họ thành một sinh vật có vẻ đẹp dị thường hoặc vặn xoắn họ thành một quái vật dị dạng."
 
 trait_vicissitudeadvanced: "Vicissitude Nâng cao" 
 trait_vicissitudeadvanced_desc: "Một trong những quyền năng kinh hoàng nhất mà $pod_cainites$ có được, Vicissitude là quyền năng đặc trưng của Tzimisce và gần như không được biết tới ngoài $pod_clan$ này. Với nó, một kẻ tạo hình dày dạn kinh nghiệm có thể tạc nên da thịt và xương cốt của một đối tượng, biến họ thành một sinh vật có vẻ đẹp dị thường hoặc vặn xoắn họ thành một quái vật dị dạng." 
 TRAIT_FLAG_DESC_chiropteran_marauder: "Mở khóa lựa chọn biến hình [GetModifier('POD_shapeshift_form_chiropteran_modifier').GetNameWithTooltip]"
 TRAIT_FLAG_DESC_study_anatomy: "Mở khóa [character_interaction|E] Nghiên Cứu Giải Phẫu"
 
 trait_visceratika: "Visceratika"
 trait_visceratika_desc: "$pod_discipline$ Visceratika là sở hữu của huyết thống Gargoyle và là phần mở rộng từ ái lực tự nhiên của họ với đá, đất, và những thứ được tạo từ chúng.\n\nVisceratika mang những khả năng biến hình tương tự Protean, dù nhấn mạnh nhiều hơn vào phòng thủ."

 trait_visceratikaadvanced: "Visceratika Nâng cao"
 trait_visceratikaadvanced_desc: "$pod_discipline$ Visceratika là sở hữu độc quyền của huyết thống Gargoyle và là phần mở rộng từ ái lực tự nhiên của họ với đá, đất, và những thứ được tạo từ chúng.\n\nVisceratika mang những khả năng biến hình tương tự Protean, dù nhấn mạnh nhiều hơn vào phòng thủ."

 trait_bloodsorcery: "Huyết Thuật"
 trait_bloodsorceryadvanced: "Huyết Thuật Nâng cao"
 trait_bloodsorcery_desc: "[bloodsorcery|E] chỉ phép thuật do ma cà rồng thực hiện, được cấp năng lượng bởi các tập tục tôn giáo hoặc huyền bí và quyền năng của $pod_vitae$ của $pod_cainite$.\n\nQua việc thực hành [bloodsorcery|E], một $pod_cainite$ có thể triệu hồi lửa, kiểm soát thời tiết, và làm nhiều điều khác phi tự nhiên ngay cả theo chuẩn mực ma cà rồng."
 trait_bloodsorcery_character_desc: "$bloodmagic_paths_display$\n\n$trait_bloodsorcery_desc$"

 bloodmagic_paths_display: "#medium [ROOT.Char.GetFirstNameNoTooltip] có kiến thức về những [bs_traditions|E] sau:[AddTextIf(GetScriptedGui('has_thaumaturgy_bloodmagic_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@tremere_icon! Thaumaturgy')][AddTextIf(GetScriptedGui('has_sielanic_thaumaturgy_bloodmagic_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@tremere_icon! Sielanic Thaumaturgy')][AddTextIf(GetScriptedGui('has_dur_an_ki_bloodmagic_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@assamite_icon! Dur-An-Ki')][AddTextIf(GetScriptedGui('has_akhu_bloodmagic_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@setite_icon! Akhu')][AddTextIf(GetScriptedGui('has_sadhana_bloodmagic_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@ravnos_icon! Sadhana')][AddTextIf(GetScriptedGui('has_koldunic_bloodmagic_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@tzimisce_icon! Koldunic')][AddTextIf(GetScriptedGui('has_sihr_bloodmagic_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@sihr_icon! Sihr')][AddTextIf(GetScriptedGui('has_abyssal_mysticism_bloodmagic_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@lasombra_icon! Abyssal Mysticism')]#!"

 TRAIT_FLAG_DESC_unlock_incorporeal_form: "Có thể biến hình thành [GetModifier( 'POD_shapeshift_form_incorporeal_modifier' ).GetNameWithTooltip|L]"

 trait_darkthaumaturgy: "Dark Thaumaturgy"
 trait_darkthaumaturgyadvanced: "Dark Thaumaturgy Nâng cao"
 trait_darkthaumaturgy_desc: "$bloodmagic_paths_display$\n\nDark Thaumaturgy là tên gọi cho [thaumaturgy|E] học được từ ác quỷ.\n\nMa cà rồng có thể lập khế ước với ác quỷ để học được bí mật của [bloodsorcery|E], giống như pháp sư phàm nhân làm để học các loại ma thuật quỷ dữ khác; họ làm vậy với cái giá là bất cứ phần linh hồn nào còn sót lại, niêm phong một thỏa thuận là con đường tắt để đạt quyền năng phép thuật."
 
 trait_sielanic_thaumaturgy: "Sielanic Thaumaturgy"
 trait_sielanic_thaumaturgyadvanced: "Sielanic Thaumaturgy Nâng cao"
 trait_sielanic_thaumaturgy_desc: "$bloodmagic_paths_display$\n\nSielanic Thaumaturgy là một dạng Thaumaturgy lấy cảm hứng từ vị thần ngoại giáo Telyavel và được thực hành bởi Telyavelic Tremere, một huyết thống của Tremere có gốc gác từ Litva.\n\nTelvay học cách khai thác quyền năng của siela, linh hồn vật linh tiềm ẩn trong đất, đá, thực vật, và động vật của quê hương mà họ tiếp nhận."
 
 trait_ogham: "Ogham"
 trait_oghamadvanced: "Ogham Nâng cao"
 trait_ogham_desc: "$bloodmagic_paths_display$\n\nOgham là một dạng [bloodsorcery|E] rất giới hạn dựa trên rune Celt, được thực hành bởi Lhiannan, khai thác mảnh linh hồn của huyết thống, nhượng lại quyền năng bên trong lãnh thổ của họ."
 
 trait_sihr: "Sihr"
 trait_sihradvanced: "Sihr Nâng cao"
 trait_sihr_desc: "$bloodmagic_paths_display$\n\nSihr được tin là truyền thống [bloodsorcery|E] duy nhất phù hợp với ý chí của Allah. Nó khác với các hình thức [bloodsorcery|E] khác ở chỗ quyền năng của nó bắt nguồn từ đức tin của người thi triển. Sihr chỉ được truyền dạy cho [Glossary('Ashirra','game_concept_ashirra_desc')] và những người Hồi giáo [GetTrait('assamite').GetName( GetNullCharacter )]."
 
 trait_abyssmysticism: "Abyss Mysticism"
 trait_abyssmysticismadvanced: "Abyss Mysticism Nâng cao"
 trait_abyssmysticism_desc: "$bloodmagic_paths_display$\n\nAbyss Mysticism là một hình thức [bloodsorcery|E], bắt nguồn từ $pod_discipline$ Obtenebration. Dĩ nhiên, nghệ thuật huyền bí này gần như chỉ được thực hành bởi các thành viên $pod_clan$ Lasombra. Những kẻ thực hành nghệ thuật thần bí này được gọi là The Shadowed."
 
 trait_sadhana: "Sadhana"
 trait_sadhanaadvanced: "Sadhana Nâng cao"
 trait_sadhana_desc: "$bloodmagic_paths_display$\n\nSadhana là một hình thức [bloodsorcery|E] Hindu có trước Thaumaturgy Hermetic nổi bật của $pod_clan$ Tremere hàng ngàn năm. Nó được thực hành bởi các $pod_cainites$ Brahmin theo Ấn Độ giáo của Ấn Độ, được biết đến với tên rakta-sadhu hay thậm chí Blood Brahmin."
 
 trait_akhu: "Akhu"
 trait_akhuadvanced: "Akhu Nâng cao"
 trait_akhu_desc: "$bloodmagic_paths_display$\n\nAkhu, thường được người ngoài gọi là Setite Sorcery, là truyền thống [bloodsorcery|E] cổ xưa của Followers of Set.\n\nVào thời hoàng kim của Ai Cập, trước khi cải sang Cơ Đốc giáo dưới tay Đế chế La Mã, phép thuật là chuyện thường thấy, được thực hành bởi cả phàm nhân lẫn ma cà rồng."
 
 trait_koldunicsorcery: "Koldunic Sorcery"
 trait_koldunicsorceryadvanced: "Koldunic Sorcery Nâng cao"
 trait_koldunicsorcery_desc: "$bloodmagic_paths_display$\n\nKoldunic Sorcery hay Koldunism là một hình thức [bloodsorcery|E] của $pod_cainite$, chủ yếu được thực hành bởi [GetTrait('tzimisce').GetName(GetNullCharacter)].\n\nNó độc đáo ở chỗ sử dụng [krainas|E] khai thác quyền năng từ đất đai và linh hồn của nó."
 
 trait_duranki: "Dur-An-Ki"
 trait_durankiadvanced: "Dur-An-Ki Nâng cao"
 trait_duranki_desc: "$bloodmagic_paths_display$\n\nDur-An-Ki (Bậc Thầy của Thiên Đường và Trần Gian) là một hình thức [bloodsorcery|E] được thực hành bởi Kindred Trung Đông và châu Phi. Đây là một dạng phép thuật rất cổ xưa, khai thác từ vô số truyền thống tôn giáo phàm nhân, và có trước Thaumaturgy, mà nó giống về nhiều mặt."
 
 trait_thaumaturgy: "Thaumaturgy"
 trait_thaumaturgyadvanced: "Thaumaturgy Nâng cao"
 trait_thaumaturgy_desc: "$bloodmagic_paths_display$\n\nThaumaturgy là hình thức [bloodsorcery|E] được $pod_clan$ ma cà rồng Tremere canh giữ kỹ lưỡng.\n\nĐược tạo ra qua nghiên cứu tỉ mỉ và thực nghiệm sâu rộng, Thaumaturgy khai thác nguyên lý phép thuật Hermetic mà House Tremere từng sử dụng khi còn là một hội kín pháp sư, được điều chỉnh để lấy năng lượng từ quyền năng phép thuật nội tại của $pod_vitae$ thay vì Quintessence."

 trait_fortitudeadvanced: "Fortitude Nâng cao"
 trait_fortitudeadvanced_desc: "Fortitude là một $pod_discipline$ ban cho Kindred sự bền bỉ phi phàm, đến mức có thể kháng cự cả lửa và ánh mặt trời.\n\nFortitude ban cho $pod_cainite$ khả năng kháng cự mọi loại thương tổn, tuy nhiên nó hoàn thành phần của mình trong lời nguyền Chúa ở chỗ nó nuôi dưỡng sự kiêu ngạo và tự phụ thái quá."

 trait_oblivion: "Oblivion" 
 trait_oblivion_desc: "Oblivion là một $pod_discipline$ cho phép người sử dụng khai thác một thứ gì đó hoàn toàn phi tự nhiên; triệu hồi bóng tối siêu nhiên từ Vực Thẳm và nô dịch hóa những bóng ma qua Oblivion, tương tự [necromancy|E]."

 trait_oblivionadvanced: "Oblivion Nâng cao" 
 trait_oblivionadvanced_desc: "Oblivion là một $pod_discipline$ cho phép người sử dụng khai thác một thứ gì đó hoàn toàn phi tự nhiên; triệu hồi bóng tối siêu nhiên từ Vực Thẳm và nô dịch hóa những bóng ma qua Oblivion, tương tự [necromancy|E]." 

 trait_mortis: "Mortis"
 trait_mortis_desc: "$pod_discipline$ Mortis bắt nguồn từ việc kiểm soát và thao túng cái chết. Cụ thể hơn, Mortis là một hình thức [bloodsorcery|E] liên quan tới thi thể và tình trạng của chúng sau khi chết. $pod_clan$ Cappadocian là Kindred duy nhất sở hữu ái lực tự nhiên với $pod_discipline$ này."
 
 trait_mortisadvanced: "Mortis Nâng cao" 
 trait_mortisadvanced_desc: "$pod_discipline$ Mortis bắt nguồn từ việc kiểm soát và thao túng cái chết. Cụ thể hơn, Mortis là một hình thức [bloodsorcery|E] liên quan tới thi thể và tình trạng của chúng sau khi chết. $pod_clan$ Cappadocian là Kindred duy nhất sở hữu ái lực tự nhiên với $pod_discipline$ này."

 trait_nihilistics: "Nihilistics"
 trait_nihilistics_desc: "Nihilistics là một $pod_discipline$ độc quyền của Nagaraja, cho phép họ xuyên thấu Bức Màn và dẫn truyền [UmbraGlossary('oblivion')]. Dù một số công dụng của nó liên quan tới cư dân của [UmbraGlossaryLocalized('shadowlands','Âm Giới')], nhiều quyền năng của nó cho phép ma cà rồng kéo [UmbraGlossary('oblivion')] vào thế giới vật chất."
 
 trait_nihilisticsadvanced: "Nihilistics Nâng cao" 
 trait_nihilisticsadvanced_desc: "Nihilistics là một $pod_discipline$ độc quyền của Nagaraja, cho phép họ xuyên thấu Bức Màn và dẫn truyền [UmbraGlossary('oblivion')]. Dù một số công dụng của nó liên quan tới cư dân của [UmbraGlossaryLocalized('shadowlands','Âm Giới')], nhiều quyền năng của nó cho phép ma cà rồng kéo [UmbraGlossary('oblivion')] vào thế giới vật chất."

 trait_thanatosis: "Thanatosis"
 trait_thanatosis_desc: "Thanatosis là $pod_discipline$ độc quyền của huyết thống Samedi, liên quan tới việc thao túng hiệu ứng của cái chết và sự phân hủy. Ở một số khía cạnh nó tương tự [necromancy|E]. $pod_discipline$ này xử lý dáng vẻ của cái chết dưới mọi hình thức. Những người thực hành nó bị ám ảnh bởi dáng vẻ của cái chết, thấy mình bị mọi Kindred xa lánh trừ những kẻ méo mó nhất."
 
 trait_thanatosisadvanced: "Thanatosis Nâng cao" 
 trait_thanatosisadvanced_desc: "Thanatosis là $pod_discipline$ độc quyền của huyết thống Samedi, liên quan tới việc thao túng hiệu ứng của cái chết và sự phân hủy. Ở một số khía cạnh nó tương tự [necromancy|E]. $pod_discipline$ này xử lý dáng vẻ của cái chết dưới mọi hình thức. Những người thực hành nó bị ám ảnh bởi dáng vẻ của cái chết, thấy mình bị mọi Kindred xa lánh trừ những kẻ méo mó nhất."

 trait_deimos: "Deimos"
 trait_deimos_desc: "Deimos là một $pod_discipline$ được Lamia tạo ra trong quá trình nghiên cứu về kẻ chết và về Lilith. Nó ban cho ma cà rồng một mức kiểm soát nhất định lên chính hình hài vô hồn của mình cũng như những linh hồn tăm tối và sự bảo trợ của Dark Mother. Nó còn được gọi là Path of the Four Humours."
 
 trait_deimosadvanced: "Deimos Nâng cao" 
 trait_deimosadvanced_desc: "Deimos là một $pod_discipline$ được Lamia tạo ra trong quá trình nghiên cứu về kẻ chết và về Lilith. Nó ban cho ma cà rồng một mức kiểm soát nhất định lên chính hình hài vô hồn của mình cũng như những linh hồn tăm tối và sự bảo trợ của Dark Mother. Nó còn được gọi là Path of the Four Humours."

 trait_abombo: "Abombo"
 trait_abombo_desc: "Một trường phái được Laibon châu Phi thực hành, tập trung vào mối liên hệ giữa kẻ chết và người sống; tương tự nhưng khác biệt với Cenotaph Path của [necromancy|E]. Nó cho phép nhà gọi hồn kiểm soát và thậm chí tái phân bổ [Fetter|E] của một oan hồn."
 
 trait_abomboadvanced: "Abombo Nâng cao" 
 trait_abomboadvanced_desc: "Một trường phái được Laibon châu Phi thực hành, tập trung vào mối liên hệ giữa kẻ chết và người sống; tương tự nhưng khác biệt với Cenotaph Path của [necromancy|E]. Nó cho phép nhà gọi hồn kiểm soát và thậm chí tái phân bổ [Fetter|E] của một oan hồn."

 trait_abombwe: "Abombwe"
 trait_abombwe_desc: "Abombwe là $pod_discipline$ được thực hành bởi Di Sản Akunanse của Laibon và huyết thống Bonsam bí ẩn từ Kỷ Đen Tối."
 
 trait_abombweadvanced: "Abombwe Nâng cao"
 trait_abombweadvanced_desc: "Abombwe là $pod_discipline$ được thực hành bởi Di Sản Akunanse của Laibon và huyết thống Bonsam bí ẩn từ Kỷ Đen Tối. Abombwe khai thác mối liên hệ mật thiết của ma cà rồng với và quyền kiểm soát lên chính [Glossary('Beasts','game_concept_beast_desc')] của mình (và của kẻ khác), cũng như dẫn truyền quyền năng của Dã Thú cho nhiều mục đích khác nhau." 
 
 trait_bardo: "Bardo"
 trait_bardo_desc: "Bardo là $pod_discipline$ đặc trưng được Children of Osiris thực hành, được thần Osiris của Ai Cập truyền lại cho họ."
 
 trait_bardoadvanced: "Bardo Nâng cao"
 trait_bardoadvanced_desc: "Bardo là $pod_discipline$ đặc trưng được Children of Osiris thực hành, được thần Osiris của Ai Cập truyền lại cho họ."
 
