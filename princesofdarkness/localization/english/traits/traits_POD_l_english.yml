 DHARMA_PASSIVE_5_HERD: "Have 5 [POD_herd|E] members"
 DHARMA_PASSIVE_5_GHOUL: "Have 5 [ghoul|E] thralls"
 DHARMA_PASSIVE_DHARMA9: "You have [GetTrait('dharma9').GetName(GetPlayer)]"
 DHARMA_PASSIVE_HARDER: "Due to the [Glossary('Fifth Age','game_concept_fifth_age_desc')], advancing dharma is much harder"
 DHARMA_PASSIVE_IMPOSSIBLE: "Due to the [Glossary('Sixth Age','game_concept_sixth_age_desc')], advancing dharma is impossible"
