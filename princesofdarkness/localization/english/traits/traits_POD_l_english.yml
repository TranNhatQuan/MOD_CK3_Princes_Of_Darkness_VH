 trait_dharma10: "Pháp Môn 10"
 trait_dharma10_desc: "Kẻ đã siêu việt khỏi [Glossary('Pháp Môn','podgloss.dharma')] của mình và chạm tới ngưỡng cửa [Glossary('Bách Vân','podgloss.hundredclouds')]."
 trait_dharma10_stayed_desc: "Còn gọi là [Glossary('La Hán','podgloss.arhat')], kẻ đã hoàn thành bước cuối cùng trên Đường Về, và đạt được Giác Ngộ. Nhiều người không ngần ngại bước vào [Glossary('Bách Vân','podgloss.hundredclouds')] ngay khi có thể, nhưng một số ít vẫn nán lại nơi trần thế."
