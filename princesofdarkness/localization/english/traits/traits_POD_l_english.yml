 trait_mod_guardian_desc: "[ROOT.Char.GetFirstNameNoTooltip] needs to exist in order to make some of the scripts in this mod work. If you see [ROOT.Char.GetHerHim] in your court, just smile and wave. [ROOT.Char.GetSheHe|U] will disappear shortly."
  
 
 

 
 trait_midnight_warrior: "Midnight Warrior"
 trait_midnight_warrior_desc: "A term used to distinguish a practitioner of the ancestral $pod_kueijin$ Midnight Wars, ritualized wars following strict protocols and strategies. Building upon millennia of warfare traditions, these individuals are feared generals who have mastered a wide variety of tactics."
 trait_midnight_warrior_1: "Midnight Warrior"
 trait_midnight_warrior_2: "Midnight General"
 trait_midnight_warrior_3: "Midnight Master"
 trait_track_midnight_warrior: "Midnight Warrior"
 trait_track_midnight_warrior_desc: "#help You gain experience in this track by being landless and using your [ashen_grandmaster|E] xp on it.#!"

 trait_twilight_warrior: "Twilight Warrior"
 trait_twilight_warrior_desc: "Twilight Wars are small, non lethal, conflicts strictly regulated in $pod_kueijin$ society and used to arbitrate escalating hostilities. They tend to teach in depth, though not always practical, tactics and strategies used for "real" warfare later on."
 trait_twilight_warrior_1: "Twilight Warrior"
 trait_twilight_warrior_2: "Twilight General"
 trait_twilight_warrior_3: "Twilight Master"
 trait_track_twilight_warrior: "Twilight Warrior"
 trait_track_twilight_warrior_desc: "#help You gain experience in this track by being landless and using your [ashen_grandmaster|E] xp on it.#!"

 trait_wayang_kulit: "Wayang Kulit"
 trait_wayang_kulit_desc: "A warfare style created by the [Glossary('Penangallan','podgloss.penangallan')] of Southeast Asia. Named after Javanese shadow plays, it makes extensive use of Flesh Shintai to confuse the enemy."
 trait_wayang_kulit_1: "Wayang Kulit Disciple"
 trait_wayang_kulit_2: "Wayang Kulit Mistress"
 trait_wayang_kulit_3: "Wayang Kulit Penangallan"
 trait_track_wayang_kulit: "Wayang Kulit Disciple"
 trait_track_wayang_kulit_desc: "#help You gain experience in this track by being landless and using your [ashen_grandmaster|E] experience on it.#!"

 trait_angered_malkav: "Angered Madness Network"
 trait_angered_malkav_desc: "You have angered the Madness Network and all those connected to it. Some say you have even angered something or someone within the Network itself. You can already feel its many, many claws sinking into your mind."
 
  
 trait_demonology: "Demonology"
 trait_demonology_desc: "This character knows the basics of demonic behavior and some of their more unusual powers. This character could probably pull off a summoning and may have observed or even assisted with one, but actual bindings are another story..."
 trait_demonology_xp: "#medium;italic Passively gain [ROOT.Char.MakeScope.ScriptValue('POD_yearly_demonology_xp_gain')|V] [trait_level_track_xp|E] every year:#!\n[ROOT.Char.MakeScope.GetScriptValueDesc('POD_yearly_demonology_xp_gain')]\n"
 trait_demonology_1: "Demonology Student"
 trait_demonology_1_desc: "$trait_demonology_xp$\n$trait_demonology_desc$"
 trait_demonology_2: "Demonology Scholar"
 trait_demonology_2_desc: "$trait_demonology_xp$\nThis character understands the mysteries of Hell and fragments of the strange and blasphemous prehistory recounted by the damned. This character could certainly perform summoning and binding rites and may know a handful of Celestial Names to use… if they wanted to."
 trait_demonology_3: "Demonology Master"
 trait_demonology_3_desc: "$trait_demonology_xp$\nDid Lucifer himself appear before this character so that they might be his scribe? Demons rightly fear this character's power and learning."
 
 trait_track_demonology: "Demonologist"
 trait_track_demonology_desc: "#italic One who studies demons. A demonologist is interested in the theoretical, spiritual or intellectual science of demons, and does not necessarily have any intention to ever invoke a demon or interact with one directly. When curiosity or thirst for power becomes overwhelming, however, demonology can act as a jumping-off point for #TOOLTIP:GAME_TRAIT,witch,[GetNullCharacter] #L Infernalism#!#!.#!"

 TRAIT_FLAG_DESC_demonology_unlocks_pacts: "Can sign [demonic_pacts|E] with $POD_splat_demon_plural$: #P Yes#!"
 TRAIT_FLAG_DESC_demonology_xp_gain_decision: "Can [GetModifier('POD_focus_on_demonology_modifier').GetNameWithTooltip] via [decision|E]: #P Yes#!"
 
 trait_POD_grail_knight: "Grail Knight"
 TRAIT_FLAG_DESC_stronger_ghouls_flag: "[ghouls|E] are [GetTrait('physique_good_1').GetName(GetNullCharacter)] and gain more [prowess|E]"
 TRAIT_FLAG_DESC_order_bitter_ashes_maa_flag: "Can recruit [GetMaA('order_bitter_ashes_maa').GetName] as [men_at_arms|E]"
 trait_POD_grail_knight_desc: "This $POD_splat_vampire$ has drunk from the Grail of the Bitter Ashes and survived. Each Grail Knight experiences different visions and powers when achieving it but, in any case, they are now part of a very small cadre of truly blessed individuals."
 
 trait_fleshcrafted: "Fleshcrafted"
 trait_fleshcrafted_character_desc: "#color:{0.0,0.0,0.0,0.0} [GetScriptedGui('POD_fleshcrafting_trait_tooltip').BuildTooltip( GuiScope.AddScope('character',ROOT.Char.MakeScope).End )]#!\n\n[ROOT.Char.GetFirstNameNoTooltip] was reshaped physically (and some might say, spiritually) by use of the [Glossary('Discipline','game_concept_discipline_desc')] [GetTrait('vicissitude').GetName(GetNullCharacter)]."
 trait_fleshcrafted_desc: "This character was reshaped physically (and some might say, spiritually) by use of the [Glossary('Discipline','game_concept_discipline_desc')] [GetTrait('vicissitude').GetName(GetNullCharacter)]."
 trait_track_fleshcrafted: "Complexity"
 trait_track_fleshcrafted_desc: "The degree to which this creature has been modified. The effects of [GetTrait('vicissitude').GetName(GetNullCharacter)] can be barely noticeable if applied with a subtle touch, but a Szlachta with a full suite of combat enhancements will look disturbing even to other $pod_cainites$."
 trait_pilgrim_of_enoch: "Pilgrim of Enoch"
 trait_pilgrim_of_enoch_desc: "A [GetTrait('nagaraja').GetName(GetNullCharacter)] who has made the perilous journey to the ghost-city of Enoch in the [UmbraGlossaryLocalized('shadowlands','Underworld')] and returned with forbidden knowledge of the dead."
 trait_pilgrim_of_enoch_character_desc: "[ROOT.Char.GetFirstNameNoTooltip]'s pilgrimage to the ghost-city of Enoch has granted [ROOT.Char.GetHerHim] insight into the deepest mysteries of Necromancy."

 trait_itarajana_sorcerer: "Itarajana Sorcerer"
 trait_itarajana_sorcerer_desc: "A practitioner of Itarajana, a form of blood sorcery native to the Indian subcontinent that draws upon Hindu mystical traditions."
