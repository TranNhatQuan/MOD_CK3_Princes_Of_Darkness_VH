 trait_dharma7_desc: "Phần lớn đảm nhận vai trò Quan Lại (hay Brahmin nếu là [GetTrait('kueijin').GetName( GetNullCharacter )] theo Ấn Độ giáo), cũng là điều kiện tối thiểu để trở thành Tổ Tiên, thường cần 250 năm để đạt tới trạng thái này. Có thể ăn Khí trong không khí xung quanh."
