l_english:
 trait_use_ingame_chargen: "Dùng Trình Tạo Nhân Vật Trong Game"
 trait_use_ingame_chargen_desc: "Khuyến nghị cho người chơi mới.\n\nKhi vào game, bạn sẽ trải qua một chuỗi sự kiện cho phép chọn [splat|E] và mọi đặc điểm cùng hiệu ứng siêu nhiên cần thiết sẽ tự động được thiết lập."

 trait_unusual: "Kỳ Dị"
 trait_unusual_desc: "Có điều gì đó kỳ lạ ở người này."

 trait_vampire: "Ma cà rồng"
 trait_vampire_desc: "Nhân vật này thuộc hàng bất tử bất sinh."
 
 trait_diablerist: "Diablerist"
 trait_diablerist_desc: "Nhân vật này đã phạm $pod_diablerie$ bằng cách nuốt máu tim của một ma cà rồng khác, ngấu nghiến linh hồn kẻ đó."
 
 #trait_cultist: "Demonic Cultist"
 #trait_cultist_desc: "This character has made a pact with a demonic power for infernal investments."
 
 trait_infernalist: "Kẻ Thờ Ma"
#trait_infernalist_desc: "This character has thrown their lot in with dark gods, demons, creatures from the outer void and God only knows what else."
 trait_infernalist_desc: "Nhân vật này đã tiếp xúc với $POD_splat_demon_plural$ để đạt được quyền năng [investiture_lifestyle|E] của chúng. Một tập tục ghê tởm làm ô uế linh hồn, bị xem là tà ác ngay cả theo chuẩn mực của $pod_wod$."
 trait_infernalist_diabolism_desc: "[ROOT.Char.GetFirstNameNoTooltip] theo con đường [diabolism|E]."
 trait_infernalist_thralldom_desc: "[ROOT.Char.GetFirstNameNoTooltip] theo con đường [thralldom|E]."
 
 trait_ghoul: "Bộc huyết"
 trait_ghoul_desc: "Một kẻ phàm đã uống máu ma cà rồng, từ đó sinh ra cơn khát đòi thêm nữa mà thành (phần nhiều là) một nô bộc tự nguyện của chủ mình."
 trait_ghoul_vitae_dependency_desc: "#medium [ghoul_vitae_dependency|E]: #underline;V;TOOLTIP:trait_ghoul_vitae_dependency_chance [ROOT.Char.MakeScope.ScriptValue('POD_chance_to_lose_vitae_passively')|V0]%#! cơ hội nhận #N 1 [hunger_with_icon|E]#! mỗi #underline;TOOLTIP:trait_ghoul_vitae_dependency_years [ROOT.Char.MakeScope.ScriptValue('POD_years_to_lose_vitae_passively')|V0]#! năm.#!\n\n"
 trait_ghoul_vitae_dependency_years: "[GetPlayer.MakeScope.GetScriptValueDesc('POD_years_to_lose_vitae_passively')]"
 POD_years_to_lose_vitae_passively_age_above_80: "Bạn hơn #V 80#! tuổi"
 POD_years_to_lose_vitae_passively_age_above_200: "Bạn hơn #V 200#! tuổi"
 trait_ghoul_vitae_dependency_chance: "[GetPlayer.MakeScope.GetScriptValueDesc('POD_chance_to_lose_vitae_passively')]"
 trait_ghoul_highest_vitae_ingested_desc: "#medium [ROOT.Char.GetFirstNamePossessiveNoTooltip] [ghoul_greatest_vitae_ingested|E] thuộc về [GetTrait(Concatenate('vampgeneration',IntToString(FixedPointToInt(ROOT.Char.MakeScope.ScriptValue('POD_highest_generation_ingested_value'))))).GetName(GetNullCharacter)], cho phép [perks|E] [Glossary('Discipline','game_concept_discipline_desc')] tới cấp [ROOT.Char.MakeScope.ScriptValue('POD_allowed_discipline_level_for_ghouls_or_revenants')|V0].#!\n\n"
 trait_bound_ghoul_desc: "#medium [ROOT.Char.GetFirstNameNoTooltip] là [bound_ghoul|E] của #V [GetScriptedGui('POD_show_ghoul_domitor').BuildTooltip(GuiScope.AddScope('ghoul',ROOT.Char.MakeScope).End)]#!.#!\n\n"
 trait_bound_masterless_ghoul_desc: "#medium [ROOT.Char.GetFirstNameNoTooltip] là một [masterless_ghoul|E].#!\n\n"
 
 trait_szlachta: "Szlachta"
 trait_szlachta_desc: "Một phàm nhân đã uống máu ma cà rồng rồi bị biến đổi bởi $pod_discipline$ Vicissitude."
 
 trait_mortal: "Phàm nhân"
 trait_mortal_desc: "Một con người bình thường. Kiếp sống ngắn ngủi làm sao..."
 
 
 trait_mage: "Pháp sư"
 trait_mage_desc: "Những con người có hóa thân đã thức tỉnh, cho phép họ sử dụng pháp thuật chân chính mà làm biến đổi chính cấu tạo của thực tại."
 
 trait_wraith: "Oan hồn"
 trait_wraith_desc: "Một linh hồn đã chết bị lôi trở lại cõi phàm bởi hắc pháp, hoặc bởi còn quyến luyến một điều gì đã bỏ lại phía sau."
 trait_gaunt: "Gaunt"
 trait_gaunt_desc: "Gaunt là một oan hồn lớn tuổi đã giải quyết được một hay nhiều [Fetters|E] của mình và vẫn duy trì chúng."
 trait_domem: "Domem"
 trait_domem_desc: "Domem là một oan hồn có toàn bộ [Fetters|E] đã bị hủy diệt, khiến chúng không thể lưu lại [UmbraGlossary('shadowlands')] trong bất cứ khoảng thời gian nào - dù việc trở thành Domem thường ngụ ý tuổi tác cao, một oan hồn có thể trở thành Domem dù còn rất trẻ, chỉ cần [Fetters|E] của chúng bị hủy diệt."
 trait_enfant: "Enfants"
 trait_enfant_desc: "Oan hồn tự ý thức khởi đầu là Enfant; khi một người chết, linh hồn của họ tái sinh trong [UmbraGlossaryLocalized('shadowlands','Âm Giới')] được phủ một lớp plasm gọi là caul."
 trait_track_fetter: "Fetter"
 trait_track_fetter_desc: "$game_concept_Fetter_desc$"
 trait_track_fetter_resolved: "Fetter Đã Giải Quyết"
 trait_track_fetter_resolved_desc: "[Fetters|E] cũng có thể được giải quyết, nghĩa là một oan hồn đạt được sức mạnh để nói lời từ biệt với những điều và những người mà nó từng yêu thương lúc sinh thời. Một oan hồn giải quyết được toàn bộ [Fetters|E] của mình có thể ở lại [UmbraGlossary('shadowlands')] vô thời hạn, nhưng nếu thành tựu ấy mang lại lợi ích này, nó hiếm đến mức gần như huyền thoại."
 
 
 trait_wight: "Wight"
 trait_wight_desc: "Wight là một ma cà rồng đã đánh mất toàn bộ đạo đức của mình. Xét theo mọi ý nghĩa, chúng chính là [Glossary('The Beast','game_concept_beast_desc')] hiện thân. Một nhân vật đã sa vào Wassail không bao giờ có thể được cứu vãn hay chơi tiếp được nữa."
 
 trait_vampclan: "$pod_clan$"
 
 trait_assamite: "Banu Haqim"
 trait_assamite_desc: "Đóng đô tại pháo đài ẩn giấu ở Trung Đông, họ theo truyền thống bị các Kindred phương Tây xem là những sát thủ và diablerist nguy hiểm."
 
 trait_assamite_laibon: "Shango"
 trait_assamite_laibon_desc: "Một trong các Di Sản của Laibon. Là những kẻ thờ phụng Shango, thần bão của người Yoruba, Shango có lẽ là di sản văn minh nhất của Laibon, chỉ sau Guruhi quý tộc."
 
 trait_baali: "Baali"
 trait_baali_desc: "Huyết thống ma cà rồng gắn liền với việc thờ quỷ."
 
 trait_brujah: "Brujah"
 trait_brujah_desc: "Nóng tính và luôn đầy nhiệt huyết, họ đang giành lại vị thế của mình như một $pod_clan$ gồm những triết gia và nhà hoạt động cao ngạo."
 
 trait_brujah_laibon: "Osebo"
 trait_brujah_laibon_desc: "Một trong các di sản của Laibon. Là chiến binh của Laibon, Osebo lấy tên từ con báo nổi tiếng trong truyền thuyết Ashanti Tây Phi."
 
 trait_brujah_ashirra: "Bay't Mushakis"
 trait_brujah_ashirra_desc: "Brujah theo đức tin Hồi giáo được gọi là Bay't Mushakis, và nhiều kẻ là childer của Kindred Carthage. Họ lan rộng khắp Bắc Phi, đặc biệt là những kẻ trẻ tuổi tuyên bố thánh chiến và tìm cách trừng phạt Kindred La Mã đã hủy diệt cuộc thí nghiệm vĩ đại ấy."
 
 trait_cacophony: "Daughter of Cacophony"
 trait_cacophony_desc: "Hiện phần lớn gồm phụ nữ (do khó khăn liên quan tới việc huấn luyện những kẻ có âm vực như phần lớn nam giới), các Daughter thực hành Melpominee, một $pod_discipline$ cho phép họ tạo ra những hiệu ứng kỳ lạ qua tiếng hát. Họ là những ca sĩ hợp xướng tuyệt vời nhất trong hàng ngũ bất tử, và tổ chức một buổi tụ họp của họ mang lại uy tín rất cao."
 
 trait_caitiff: "Caitiff"
 trait_caitiff_desc: "Được gọi là những kẻ không clan, là $pod_cainites$ không thuộc về bất cứ $pod_clan$ nào."

 trait_caitiff_laibon: "Nyayo"
 trait_caitiff_laibon_desc: "Ít mang tính Chi Hệ hơn là một Phân Loại, Nyayo truy nguyên gốc gác của mình về Mombasa như những chiến binh vô song không ràng buộc dòng dõi, thường tận tụy đi theo cùng con đường với Old Man."
 
 trait_cappadocian: "Cappadocian"
 trait_cappadocian_desc: "Những học giả xa cách bị ám ảnh bởi bí ẩn của cái chết và linh hồn."
 
 trait_cappadocian_laibon: "Mla Watu"
 trait_cappadocian_laibon_desc: "Có lẽ không nhóm Laibon nào bị xa lánh nhiều như Mla Watu. Dù Laibon nói chung đã xa rời nhân tính, họ vẫn giữ một sự tôn trọng lành mạnh với người chết như nhiều phong tục châu Phi đòi hỏi. Tuy nhiên, Mla Watu không hài lòng chỉ với việc giao tiếp cùng tổ tiên đã khuất; họ tìm cách kiểm soát những linh hồn ấy, cả thể xác lẫn linh hồn."
 
 trait_cappadocian_ashirra: "Qabilat al-Mawt"
 trait_cappadocian_ashirra_desc: "Nhánh Hồi giáo của $pod_clan$ Cappadocian được biết đến ở Trung Đông với tên Qabilat al-Mawt, và nằm trong số những kindred học thức nhất của vùng đất ấy. Qabilat al-Mawt phải thận trọng trong việc nghiên cứu người chết vì Hồi giáo coi trọng người đã khuất; sự xúc phạm tử thi có thể thu hút sự chú ý của cả phàm nhân lẫn [Glossary('Ashirra','game_concept_ashirra_desc')], tức Kindred Hồi giáo có tổ chức."
 
 trait_gangrel: "Gangrel"
 trait_gangrel_desc: "Man rợ. Nguyên thủy, cường tráng và thú tính."
 
 trait_gangrel_laibon: "Akunanse"
 trait_gangrel_laibon_desc: "Một trong các di sản của Laibon. Họ lấy tên và bản tính từ truyền thuyết 'nhện khôn ngoan' của nhiều câu chuyện dân gian châu Phi. Họ nổi tiếng vì kiến thức uyên thâm, lời khuyên khôn ngoan, và bản tính phi chính trị."
 
 trait_gangrel_ashirra: "Wah'Sheen"
 trait_gangrel_ashirra_desc: "Dù [Glossary('Ashirra','game_concept_ashirra_desc')] gọi mọi Gangrel là "Wah'Sheen", vẫn có một ranh giới rõ rệt giữa hai nhánh, tương tự sự phân chia giữa Gangrel Thành Thị và Gangrel Thôn Dã, dù mối quan hệ giữa họ thù địch hơn nhiều."

 trait_gargoyle: "Gargoyle"
 trait_gargoyle_desc: "Ma cà rồng trông như những bức tượng đá biết cử động.\nĐược tạo ra bởi Tremere làm lính xung kích chống lại Tzimisce, phần lớn Gargoyle hài lòng phục vụ những chủ nhân được ban phép thuật của mình, nhưng một số ít thể hiện tư duy độc lập."
 
 trait_giovanni: "Giovanni"
 trait_giovanni_desc: "Sau khi thăng hoa vào dòng máu, Augustus Giovanni lập tức bắt đầu Trao truyền cho chính gia đình mình. Trong quá trình đó, Giovanni trở thành thứ gì đó nằm giữa một huyết thống và một giáo phái trong lòng $pod_clan$ Cappadocian. Được công nhận là chuyên gia về [necromancy|E], Giovanni tự tách mình ra một chút khỏi $pod_clan$ gốc."
 
 trait_harbingersofskulls: "Harbingers of Skulls"
 trait_harbingersofskulls_desc: "Một huyết thống ma cà rồng với làn da nhợt nhạt chết chóc. Ngoài ra, da của Harbinger co rút lại khiến những $pod_cainites$ này trông như bộ xương, với tứ chi khẳng khiu và khuôn mặt đông cứng trong nụ cười bất tử của thần chết."

 trait_kiasyd: "Kiasyd"
 trait_kiasyd_desc: "Một huyết thống ma cà rồng mang dòng máu tiên tộc, hậu duệ của Lasombra Marconius xứ Strasbourg."
  
 trait_lasombra: "Lasombra"
 trait_lasombra_desc: "$pod_clan$ Lasombra là những kẻ theo thuyết Darwin xã hội, những kẻ săn mồi, thanh lịch và phi nhân tính."
 
 trait_lasombra_laibon: "Xi Dundu"
 trait_lasombra_laibon_desc: "Lấy tên từ từ 'bóng tối' trong tiếng Bavili, Xi Dundu nguyên gốc xuất thân từ Congo cho đến khi một nghi lễ thất bại buộc họ rời khỏi quê hương. Giờ đây họ định cư giữa các dân tộc Maasai ở Đông Phi."
 
 trait_lasombra_ashirra: "Qabilat al-Khayal"
 trait_lasombra_ashirra_desc: "Lasombra Ả Rập nổi bật trong số các đối tác Kindred Hồi giáo của họ ở chỗ họ là một trong số ít bay't có đa số theo Cơ Đốc giáo. Hồi giáo đã bén rễ ở một vài nơi trong $pod_clan$, đặc biệt là Iberia, và gây ra những rạn nứt lớn trong bay't."  
 
 trait_maeghar: "Maeghar"
 trait_maeghar_desc: "Một tập hợp những tai nạn đơn lẻ xuất hiện khi một $pod_cainite$ cố gán lời nguyền của mình lên một sinh thể mang dòng máu tiên tộc. Mọi Maeghar đều có một đặc điểm thể chất cho thấy bản chất tiên tộc của mình, từ tinh tế (da trắng như tuyết và tóc đen như gỗ mun) đến lộ liễu (sáu cánh tay)."
 
 trait_malkavian: "Malkavian"
 trait_malkavian_desc: "$pod_clan$ Kindred bị nguyền rủa bởi điên loạn."
 
 trait_malkavian_ashirra: "Bay't Majnoon"
 trait_malkavian_ashirra_desc: "Malkavian của [Glossary('Ashirra','game_concept_ashirra_desc')], Bay't Majnoon, được kính trọng hơn những kẻ ở phương Tây. Nhiều kẻ được coi là cố vấn, vệ sĩ, và thậm chí là tiên tri Hồi giáo."
 
 trait_nosferatu: "Nosferatu"
 trait_nosferatu_desc: "Bóng Ma. Lén lút, mạnh mẽ và đáng sợ."
 
 trait_nosferatu_ashirra: "Hajj"
 trait_nosferatu_ashirra_desc: "Nosferatu cải sang Hồi giáo nhanh chóng trở thành những nhân vật được kính trọng. Nhìn thấy trong Hồi giáo lời hứa cứu rỗi ngay cả cho những sinh vật khốn khổ như chính mình, họ nhanh chóng trở thành một trụ cột của giáo phái [Glossary('Ashirra','game_concept_ashirra_desc')].\nMột nhân vật then chốt cho thành công của họ là Tarique al-Hajj, một pháp sư huyết thuật Nosferatu đã giúp ngăn chặn những hậu quả tồi tệ nhất của Keening. Vì điều này, hắn và bầy đàn của mình được đổi tên thành Hajj, những người bảo vệ những nơi linh thiêng nhất của Hồi giáo."
 
 trait_nosferatu_laibon: "Guruhi"
 trait_nosferatu_laibon_desc: "Lấy tên từ vị thần Gambia mà họ tự nhận là hậu duệ, Guruhi tin rằng mình là chủ nhân của châu Phi, những kẻ cai trị chính đáng của đất đai và con người nơi đây."
  
 trait_nosferatu_mnemachien: "Mnemachien"
 trait_nosferatu_mnemachien_desc: "#medium $glossary_clan_curse$: Luôn là [GetTrait('predatortype_consensualist').GetName(GetNullCharacter)]#!\n\nBắt nguồn từ nữ tư tế Druid Mnemach, Mnemachien sử dụng sức mạnh của mình để giữ một nguyên tắc cân bằng với loài người."
 
 trait_baali_ennamaru: "Children of Ennamaru"
 trait_baali_ennamaru_desc: "Xuất thân từ Methuselah bí ẩn Nekys, Children of Ennamaru là những kẻ thao túng tài ba, thích thú tra tấn tâm lý mục tiêu của mình."
  
 trait_toreador_volgirre: "Volgirre"
 trait_toreador_volgirre_desc: "Volgirre kiều diễm một cách u tối là những chuyên gia trong những thú vui đen tối nhất của nghệ thuật, sử dụng [GetTrait('vicissitude').GetName(GetNullCharacter)] để tạo ra những tác phẩm méo mó và kinh hoàng mang vẻ đẹp ghê tởm."
  
 trait_oldclantzimisce: "$pod_clan$ Tzimisce Cổ"
 trait_oldclantzimisce_desc: "Thành viên của $pod_clan$ Tzimisce không gia nhập Sabbat"
 
 trait_ravnos: "Ravnos"
 trait_ravnos_desc: "Nổi tiếng là những kẻ lang thang phiêu bạt và bịp bợm, Ravnos là những kẻ giả dối vui vẻ thực hành nghệ thuật lừa gạt và trộm cắp của mình."
 
 trait_ravnos_ashirra: "Bay't Mujrim"
 trait_ravnos_ashirra_desc: "Bay't Mujrim là thuật ngữ Ả Rập cho $pod_clan$ của những Kẻ Lừa Dối (Mujrim theo nghĩa đen là 'Tội Phạm'). Họ không được chào đón hơn trong thế giới Hồi giáo vì những thói xấu của mình dẫn họ vào nhiều cuộc đối đầu không mong muốn với [Glossary('Ashirra','game_concept_ashirra_desc')]."
 
 trait_ravnos_laibon: "Kinyonyi"
 trait_ravnos_laibon_desc: "Một trong các Di Sản của Laibon. Họ lấy tên từ từ 'chim' trong tiếng Luganda, phản ánh xu hướng không ngừng du hành của mình, thậm chí còn hơn cả Akunanse ham tìm tri thức."
 
 trait_ravnos_erk: "Erk"
 trait_ravnos_erk_desc: "Một huyết thống mang tính lãnh thổ cao và kỷ luật, đóng đô tại thảo nguyên Trung Á. Khác với clan gốc du mục của mình, Erk tĩnh tại và bén rễ sâu vào lãnh địa của họ. Xuất thân từ thung lũng Ergenekon giàu quặng sắt, ẩn giấu, họ là những kẻ sống sót thực dụng, xuất sắc trong quản trị và hậu cần."
 
 trait_salubri: "Salubri"
 trait_salubri_desc: "$pod_clan$ Salubri từng hùng mạnh giờ chỉ còn là một huyết thống sau khi thủy tổ của họ, Saulot, bị hủy diệt."

 trait_salubri_ashirra: "Al-Amin"
 trait_salubri_ashirra_desc: "Salubri Hồi giáo, được biết đến với tên al-Amin (nghĩa đen là 'Những Kẻ Đức Hạnh'), không kém may mắn hơn các đối tác châu Âu của họ. Trong nhiều thế kỷ, họ canh chừng Baali từ Bắc Phi tới châu Á, thường cải trang thành thành viên của các clan khác."

 trait_salubri_laibon: "Nkulu Zao"
 trait_salubri_laibon_desc: "Một trong các Di Sản nhỏ của Laibon. Là childer của dòng dõi gần như tuyệt chủng Zao-lat, số lượng của Nkulu Zao rất ít sau khi Di Sản của họ bị săn lùng suốt nhiều thế kỷ."

 trait_samedi: "Samedi"
 trait_samedi_desc: "Có lẽ xuất thân từ vùng Caribbean, mọi thành viên của huyết thống này dường như đều giống một xác sống hay một tử thi. Samedi dường như luôn trong trạng thái mục rữa. Những mảng thịt thối rữa rơi khỏi cơ thể họ với tần suất ngày càng tăng khi họ già đi, và mùi tử khí bám theo họ dù họ đi đến đâu."
 
 trait_setite: "Setite"
 trait_setite_desc: "$pod_clan$ ma cà rồng tin rằng thủy tổ của mình là thần Set của Ai Cập. Tín ngưỡng Setite chính thống cho rằng Set một ngày nào đó sẽ trở lại để cai trị hoặc nuốt chửng thế gian, và những Setite sùng đạo chuẩn bị con đường cho sự phục sinh của ngài."
 
 trait_setite_raktasadhus: "Daitya"
 trait_setite_raktasadhus_desc: "Daitya là một biến thể dị giáo, có thủy tổ đã du hành từ Ai Cập sang Ấn Độ để tìm kiếm tri thức thần bí cổ xưa và săn lùng Children of Osiris, những kẻ được đồn đại đã chạy trốn vào dãy Himalaya."

 trait_setite_naktanchara: "Naktanchara"
 trait_setite_naktanchara_desc: "Dòng dõi Naktanchara của huyết thống này bị ruồng bỏ vì họ đã cải sang Phật giáo và bắt đầu chống lại hệ thống đẳng cấp của Kindred Ấn Độ."

 trait_toreador: "Toreador"
 trait_toreador_desc: "$pod_clan$ ma cà rồng nổi tiếng là một trong những Kindred xinh đẹp, gợi cảm, quyến rũ, giàu cảm xúc và lộng lẫy nhất."
 
 trait_toreador_ashirra: "Ray'een al-Fen"
 trait_toreador_ashirra_desc: "Toreador Hồi giáo là Ray'een al-Fen, thường được gọi là Scribe, vì phần lớn ưa chuộng nghề viết thư pháp, nhà văn và kiến trúc sư."
 
 trait_toreador_laibon: "Ishtarri"
 trait_toreador_laibon_desc: "Một trong các Di Sản của Laibon. Ishtarri tự nhận là hậu duệ của nữ thần Babylon Ishtar, nhưng hiện thiếu mối liên hệ cá nhân với châu Phi mà Guruhi tương tự có được."
  
 trait_tremere: "Tremere"
 trait_tremere_india: "Trimira"
 trait_tremere_desc: "$pod_clan$ học giả, tập trung vào [bloodsorcery|E]. Họ bị khinh miệt vì cuộc tấn công bị cho là nhằm vào [Glossary('Antediluvian','game_concept_antediluvian_desc')] Saulot, và bị e sợ vì kỷ luật cùng sự gắn kết mạnh mẽ trong $pod_clan$ chưa từng thấy ở nơi nào khác trong xã hội $pod_cainite$"
 
 trait_truebrujah: "True Brujah"
 trait_truebrujah_desc: "Một huyết thống của $pod_clan$ Brujah tự nhận là hậu duệ của chính [Glossary('Antediluvian','game_concept_antediluvian_desc')] thủy tổ của dòng dõi ấy chứ không phải [Glossary('Diablerist','game_concept_diablerie_desc')]/childe của ngài, Troile. True Brujah nổi tiếng vì thái độ điềm tĩnh, xa cách."
 
 trait_tzimisce: "Tzimisce"
 trait_tzimisce_desc: "$pod_clan$ của lễ nghi phong kiến và thuật tạo hình thịt tàn bạo."
 
 trait_tzimisce_laibon: "Nagloper"
 trait_tzimisce_laibon_desc: "Lấy tên từ từ 'pháp sư ác' trong tiếng Khoikhoin, Nagloper xứng đáng với danh tiếng là kẻ đáng sợ nhất trong hàng ngũ Laibon. Họ để [Glossary('The Beast','game_concept_beast_desc')] thống trị mình, dẫn tới việc gây ra mọi hành vi đồi bại có thể tưởng tượng, và một số điều chỉ được cho là có thể xảy ra trong ác mộng."
  
 trait_ventrue: "Ventrue"
 trait_ventrue_desc: "Lãnh Chúa. Uy nghiêm, uy quyền và quý tộc."
 
 trait_ventrue_ashirra: "El Hijazi"
 trait_ventrue_ashirra_desc: "El Hijazi là một dòng dõi đặc trưng của Ventrue. Khác với phần lớn $pod_clan$ - vốn theo truyền thống gắn liền với người La Mã hay người Cơ Đốc châu Âu - huyết thống El Hijazi tự nhận là hậu duệ của các dòng dõi Ả Rập bản địa. Họ đã theo Hồi giáo và được công nhận là một phần của [Glossary('Ashirra','game_concept_ashirra_desc')], nhưng số lượng của họ cũng tương đối ít."
 
 trait_ventrue_raktasadhus: "Danava"
 trait_ventrue_raktasadhus_desc: "Danava là một huyết thống của $pod_clan$ Ventrue tập trung quanh tiểu lục địa Ấn Độ. Là những hiền triết uy nghiêm, khổ hạnh và tăng lữ, Danava nằm trong số những ma cà rồng được kính trọng nhất trong hệ thống Đẳng Cấp của Damned Ấn Độ."

 trait_chibo: "Chibo"
 trait_chibo_desc: "Dòng dõi tăng lữ và pháp sư của [GetTrait('tzimisce').GetName(GetNullCharacter)] thuộc [Glossary('Mikaboshi','podgloss.mikaboshi')], Chibo là những vì sao đẫm máu của phép thuật."

 trait_monomi: "Monomi"
 trait_monomi_desc: "Chiến binh của [GetTrait('tzimisce').GetName(GetNullCharacter)] thuộc [Glossary('Mikaboshi','podgloss.mikaboshi')], Monomi là những vì sao đẫm máu của thanh kiếm."

 trait_kishu: "Kishu"
 trait_kishu_desc: "Sát thủ của [GetTrait('tzimisce').GetName(GetNullCharacter)] thuộc [Glossary('Mikaboshi','podgloss.mikaboshi')], Kishu là những vì sao đẫm máu của lưỡi dao găm."

 trait_kizoku: "Kizoku"
 trait_kizoku_desc: "Sinh ra từ một người kể chuyện và bị ám ảnh bởi ác mộng, Kizoku là Kindred của những Vết Rạn."

 trait_bushi: "Bushi"
 trait_bushi_desc: "Tự nhận là hậu duệ đẫm máu của Thần Bão thuộc Amatsukami, Bushi là những chiến binh kiên định không ai sánh bằng."

 trait_kuntilanak: "Kuntilanak"
 trait_kuntilanak_desc: "Lời nguyền cô lập biểu hiện thành việc bị mắc kẹt giữa thế giới người sống và người chết, Kuntilanak là những nhà gọi hồn ma quái."

 trait_sangun: "Sangun"
 trait_sangun_desc: "Những lãnh chúa trên núi non Triều Tiên, Sangun là những bậc quân vương mang hình dạng thú vật."

 trait_anh: "Anh"
 trait_anh_desc: "Tách biệt khỏi [GetTrait('gangrel').GetName(GetNullCharacter)] nhưng khác biệt với Mariner, Anh là những kẻ rình rập ẩn giấu của đại dương quanh Indonesia, Đông Dương, và Malaysia."

 trait_banpaia: "Banpaia"
 trait_banpaia_desc: "Hậu duệ của một đoàn thám hiểm [GetTrait('tremere').GetName(GetNullCharacter)] đã thất lạc tới phương Đông, Banpaia đã tìm thấy vị thế của mình như một thế lực mới trong thế giới đêm tối Đông Á."

 TRAIT_FLAG_DESC_can_create_gargoyles: "Có thể tạo ra #TOOLTIP:GAME_TRAIT,gargoyle,[GetNullCharacter] #L Gargoyle#!#!"

