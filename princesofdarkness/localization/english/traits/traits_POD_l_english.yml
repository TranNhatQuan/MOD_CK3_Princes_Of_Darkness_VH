 trait_supehunter: "Thợ săn"
 trait_supehunter_desc: "Một kẻ đi săn quái vật."
 
 trait_turnedhunter: "Thợ Săn Bị Tha Hóa"
 trait_turnedhunter_desc: "Thợ săn quái vật này đã bị các thế lực siêu nhiên làm chệch hướng khỏi sứ mệnh của mình."
 
 trait_torpor: "Torpor"
 trait_torpor_desc: "$pod_torpor$ chỉ đơn thuần là một trạng thái tĩnh lặng sâu hơn so với giấc ngủ mà ma cà rồng thường trải qua vào ban ngày. Độ dài của $pod_torpor$ tùy thuộc vào chỉ số Nhân Tính hay Con Đường của ma cà rồng, và có thể kéo dài từ một ngày đến hơn một thiên niên kỷ. Người ta nói rằng ma cà rồng cổ xưa thường cảm thấy cần bước vào $pod_torpor$ tự nguyện, còn được gọi là giấc ngủ của thời đại."
 trait_little_death: "Cái Chết Nhỏ"
 trait_little_death_desc: "Trong Cái Chết Nhỏ, thể xác nhân vật 'chết đi', nhưng linh hồn song trùng vẫn lưu lại trong xác. [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] sợ hãi Cái Chết Nhỏ, vì đó là một khoảng thời gian đầy ám ảnh với linh ảnh và ác mộng, khi linh hồn cực kỳ dễ bị tổn thương trước tà thuật thù địch."
 trait_caul: "Caul"
 trait_caul_desc: "Khi một Quick chết, họ bước vào [UmbraGlossaryLocalized('shadowlands','Âm Giới')] được phủ trong một cái kén plasma gọi là Caul. Trong lúc còn caul, Enfant ở trong trạng thái tĩnh lặng, như mơ, và nhìn chung không nhận thức được môi trường xung quanh."
 trait_slumber: "Ngủ Say"
 trait_slumber_desc: "Một trạng thái bất động và tách biệt khỏi thế giới."
 trait_deactivated: "Ngừng Hoạt Động"
 trait_deactivated_desc: "Đã ngừng hoạt động, không còn tiêu thụ năng lượng của kẻ tạo ra mình, xác ướp."
 trait_coccon: "Kén"
 trait_coccon_desc: "Nhân vật tự bọc mình trong một lớp vỏ cứng trong khi trao đổi chất của cô chậm lại thành trạng thái tựa như ngủ đông."
 trait_long_sleep: "Giấc Ngủ Dài"
 trait_long_sleep_desc: "Trạng thái ngủ đông tựa như bản năng ngủ đông tự nhiên của loài gấu."
 trait_dragon_sleep: "Giấc Ngủ của Rồng"
 trait_dragon_sleep_desc: "Mokolé đang chìm trong giấc ngủ sâu. [ROOT.GetCharacter.GetSheHe|U] mơ về quá khứ qua sức mạnh của Mnesis. Đó là những giấc mơ hay ác mộng, không ai có thể nói chắc."
 
 trait_canon: "Canon"
 trait_canon_desc: ""
 
 trait_demon: "Ác quỷ"
 trait_demon_desc: "Ác quỷ là những thiên thần đọa lạc, những kẻ đã chọn đứng về phía Lucifer và nhân loại thay vì về phía Chúa trong những ngày đầu của Tạo Hóa. Để trừng phạt sự phản loạn và bất trung ấy, Tổng lãnh thiên thần Michael đã đuổi những thiên thần này khỏi Thiên Đàng mà quẳng xuống [UmbraGlossary('abyss')]."

 trait_elohim: "Elohim"
 trait_elohim_desc: "Elohim, còn gọi là Thiên Thần, là những sinh thể trên trời có cánh, làm sứ giả và tùy tùng của Chúa trên Thiên Đàng."
 
 trait_vampgeneration: "Thế Hệ"
 
 trait_vampgeneration1: "Thế Hệ Thứ 1"
 trait_vampgeneration1_desc: "Caine, ma cà rồng đầu tiên. Bị Chúa nguyền rủa thành tổ tiên của lũ đọa đày, khiến hắn trên thực tế là ma cà rồng duy nhất của thế hệ này."
 
 trait_vampgeneration2: "Thế Hệ Thứ 2"
 trait_vampgeneration2_desc: "Ba người con thần thoại của Caine. Bị Thế Hệ Thứ Ba sát hại."
 
 trait_vampgeneration3: "Thế Hệ Thứ 3"
 trait_vampgeneration3_desc: "Thường được gọi là Antediluvian, thế hệ này sáng lập nên các Clan ma cà rồng. Phần lớn trong số họ được đồn là sở hữu quyền năng gần với Thần Thánh hơn là chỉ là Hậu duệ Cain thường."

 trait_vampgeneration4: "Thế Hệ Thứ 4"
 trait_vampgeneration4_desc: "Thường được gọi là Methuselah, thế hệ này gồm những ma cà rồng còn hoạt động mạnh mẽ nhất từ Kỷ Tăm Tối cho đến nay."

 trait_vampgeneration5: "Thế Hệ Thứ 5"
 trait_vampgeneration5_desc: "Chỉ kém phần mạnh mẽ hơn đôi chút so với Thế Hệ Thứ 4, thế hệ này nắm giữ phần lớn những kẻ thao túng thực sự trong chính trường ma cà rồng."

 trait_vampgeneration6: "Thế Hệ Thứ 6"
 trait_vampgeneration6_desc: "Các "thế hệ giữa" là những ma cà rồng đông đảo nhất. Họ thường là những nhân vật chính trị quan trọng theo cách riêng của mình, nhưng phần lớn thời gian vẫn nằm dưới sự lãnh đạo (đôi khi khuất mặt) của một ma cà rồng thế hệ thấp hơn."

 trait_vampgeneration7: "Thế Hệ Thứ 7"
 trait_vampgeneration7_desc: "Các "thế hệ giữa" là những ma cà rồng đông đảo nhất. Họ thường là những nhân vật chính trị quan trọng theo cách riêng của mình, nhưng phần lớn thời gian vẫn nằm dưới sự lãnh đạo (đôi khi khuất mặt) của một ma cà rồng thế hệ thấp hơn."

 trait_vampgeneration8: "Thế Hệ Thứ 8"
 trait_vampgeneration8_desc: "Các "thế hệ giữa" là những ma cà rồng đông đảo nhất. Họ thường là những nhân vật chính trị quan trọng theo cách riêng của mình, nhưng phần lớn thời gian vẫn nằm dưới sự lãnh đạo (đôi khi khuất mặt) của một ma cà rồng thế hệ thấp hơn."

 trait_vampgeneration9: "Thế Hệ Thứ 9"
 trait_vampgeneration9_desc: "Các "thế hệ giữa" là những ma cà rồng đông đảo nhất. Họ thường là những nhân vật chính trị quan trọng theo cách riêng của mình, nhưng phần lớn thời gian vẫn nằm dưới sự lãnh đạo (đôi khi khuất mặt) của một ma cà rồng thế hệ thấp hơn."

 trait_vampgeneration10: "Thế Hệ Thứ 10"
 trait_vampgeneration10_desc: "Các "thế hệ cao nhất" là đám hạ lưu của thế giới Hậu duệ Cain. Bị các thế hệ thấp hơn khinh miệt, thậm chí ngược đãi thẳng thừng, họ nắm rất ít quyền lực trong chính trường bóng đêm."

 trait_vampgeneration11: "Thế Hệ Thứ 11"
 trait_vampgeneration11_desc: "Các "thế hệ cao nhất" là đám hạ lưu của thế giới Hậu duệ Cain. Bị các thế hệ thấp hơn khinh miệt, thậm chí ngược đãi thẳng thừng, họ nắm rất ít quyền lực trong chính trường bóng đêm."

 trait_vampgeneration12: "Thế Hệ Thứ 12"
 trait_vampgeneration12_desc: "Các "thế hệ cao nhất" là đám hạ lưu của thế giới Hậu duệ Cain. Bị các thế hệ thấp hơn khinh miệt, thậm chí ngược đãi thẳng thừng, họ nắm rất ít quyền lực trong chính trường bóng đêm."

 trait_vampgeneration13: "Thế Hệ Thứ 13"
 trait_vampgeneration13_desc: "Các "thế hệ cao nhất" là đám hạ lưu của thế giới Hậu duệ Cain. Bị các thế hệ thấp hơn khinh miệt, thậm chí ngược đãi thẳng thừng, họ nắm rất ít quyền lực trong chính trường bóng đêm."

 trait_vampgeneration14: "Thế Hệ Thứ 14"
 trait_vampgeneration14_desc: "Những kẻ "Máu Loãng" hầu như khó được coi là ma cà rồng thực thụ. Lời nguyền của Caine đã loãng đi quá nhiều ở họ đến mức chỉ còn thể hiện một phần sức mạnh và điểm yếu truyền thống của các thế hệ thấp hơn."

 trait_vampgeneration15: "Thế Hệ Thứ 15"
 trait_vampgeneration15_desc: "Những kẻ "Máu Loãng" hầu như khó được coi là ma cà rồng thực thụ. Lời nguyền của Caine đã loãng đi quá nhiều ở họ đến mức chỉ còn thể hiện một phần sức mạnh và điểm yếu truyền thống của các thế hệ thấp hơn."
 
 trait_vampgeneration16: "Thế Hệ Thứ 16"
 trait_vampgeneration16_desc_no_collide: "Những kẻ "Máu Loãng" hầu như khó được coi là ma cà rồng thực thụ. Lời nguyền của Caine đã loãng đi quá nhiều ở họ đến mức chỉ còn thể hiện một phần sức mạnh và điểm yếu truyền thống của các thế hệ thấp hơn."
 
 trait_something_unusual: "Điều Gì Đó Bất Thường"
 trait_something_unusual_desc: "Có điều gì đó kỳ lạ ở đây."
 
 trait_revenant: "Huyết tộc Hồi sinh"
 trait_revenant_desc: "Một [ghoul|E] độc lập, sinh ra đã có máu ma cà rồng trong huyết mạch. Thường bị coi là giống lai bất tịnh giữa ma cà rồng và người phàm, [Glossary('Huyết tộc Hồi sinh','game_concept_revenant_desc')] mắc kẹt giữa cả hai thế giới."

 trait_zadruga: "Zadruga"
 trait_zadruga_desc: "Một thuật ngữ của Tzimisce chỉ những ghoul cha truyền con nối. Trong tất cả các Clan, Tzimisce là kẻ nuôi dưỡng nhiều gia đình [ghoul|E] nhất."

 trait_oathbreaker: "Kẻ Phản Thệ"
 trait_oathbreaker_desc: "Nhân vật này đã phá vỡ một lời thề."
 
 trait_regnant: "Chủ Nhân"
 trait_regnant_desc: "Nhân vật này đã tạo ra một [ghoul|E]."
 
 trait_massregnant: "Đại Chủ Nhân"
 trait_massregnant_desc: "Nhân vật này đã tạo ra hàng loạt ghoul. Đây thường là một hành vi vi phạm [the_masquerade|E]."
 
 trait_unbondable: "Không Thể Trói Buộc"
 trait_unbondable_desc: "Nhân vật này không thể bị huyết bổn trói buộc."
 
 trait_exposed: "Bị Lộ Diện"
 trait_exposed_desc: "Bản chất siêu nhiên của sinh vật này đã bị phơi bày trước người phàm. Thợ săn sẽ lên kế hoạch tấn công chúng."
 
 trait_nagaraja: "Nagaraja"
 trait_nagaraja_desc: "Nagaraja là một huyết thống kỳ dị gồm những ma cà rồng ăn thịt người, bị Kindred ở mọi phe trong cuộc Jyhad e sợ."
 
 trait_hecata: "Hecata"
 trait_hecata_desc: "Họ không phải là một $pod_clan$ hoàn toàn thuần nhất bắt nguồn từ một [Glossary('Antediluvian','game_concept_antediluvian_desc')] duy nhất và một huyết thống liền mạch, mà được hợp thành từ Giovanni cùng tàn dư của $pod_clan$ Cappadocian cũ và các huyết thống liên quan; cũng như Nagaraja dù không có liên hệ với [Glossary('Antediluvian','game_concept_antediluvian_desc')]." 

 trait_impundulu: "Impundulu"
 trait_impundulu_desc: "Một huyết thống ma cà rồng gắn kết với một hội phù thủy phàm nhân, được xem là một trong các Di Sản của Laibon. Impundulu khi còn sống là một pháp sư gọi hồn quyền năng, kết hôn với một nữ phù thủy sinh mệnh cũng quyền năng không kém tên là Bomkazi."  
 
 trait_sire: "[Glossary('Sire','game_concept_Sire_desc')]"
 trait_sire_desc: "Ma cà rồng này đã tạo ra một đồng loại khác."
 
 trait_masssire: "[Glossary('Sire','game_concept_Sire_desc')]"
 trait_masssire_desc: "Ma cà rồng này đã tạo ra một số lượng lớn ma cà rồng. Phần lớn các Pháp Môn xem đây là một hành vi vi phạm [the_masquerade|E]."
 
 trait_lamia: "Lamia"
 trait_lamia_desc: "Lamia từng là một huyết thống $pod_cainites$ tận tụy bảo vệ $pod_clan$ Cappadocian, dù ban đầu họ chỉ là một nhóm giáo phái tự nhận là hậu duệ của Lilith, người vợ đầu tiên của Adam."
 
 trait_gangrel_greek: "Gangrel Hy Lạp"
 trait_gangrel_greek_desc: "Gangrel Hy Lạp là một nhánh tách ra bắt đầu từ Kỷ Tăm Tối.\n\nGangrel đã ẩn náu trong các thành phố loài người từ trước cả thời Babylon. Qua bao thế kỷ, những Gangrel này đã tập trung vào việc sinh tồn trong một môi trường khác biệt – nơi đầy rẫy những hiểm nguy riêng của nó."

 trait_anda: "Anda"
 trait_anda_desc: "Anda là một huyết thống $pod_cainite$ của Gangrel tồn tại giữa người Mông Cổ. Chính họ tin rằng mình là hậu duệ của Itugen, nữ thần đất trong tín ngưỡng Mông Cổ.\nSự gần gũi về địa lý với $pod_kueijin$ thường dẫn đến các cuộc xung đột, dù các cuộc chinh phạt của người Mông Cổ phàm nhân đe dọa khiến tình hình tồi tệ hơn nhiều."
  
 trait_ahrimane: "Ahrimane"
 trait_ahrimane_desc: "Ahrimane là một huyết thống Kindred hiếm hoi, toàn nữ giới, từng tồn tại vào Kỷ Tăm Tối, đứng đầu là một người phụ nữ tên Adisa.\n\nCâu chuyện về Ahrimane, theo lời họ kể, bắt đầu với Adisa, một Valkyrje và là con gái của Freyja, nữ thần Bắc Âu."

 trait_patron: "Người Bảo Trợ"
 trait_patron_desc: "Một nhân vật có tiếng tăm đầu tư vào Thế Giới Bóng Tối."
 
 trait_harbringersofskulls: "Harbingers of Skulls"
 trait_harbringersofskulls_desc: ""
 

 
 trait_true_faith: "Đức Tin Chân Chính"
 trait_truefaith: "Đức Tin Chân Chính"
 trait_truefaith_desc: "Nhân vật này thực sự tin vào sự hiện diện của Đấng Thiêng Liêng. [Glossary('Đức Tin Chân Chính','game_concept_true_faith_desc')] là một phần cốt lõi trong linh hồn họ, ban cho họ khả năng tiếp cận những năng lực mà một số người gọi là phi tự nhiên. Nhưng hãy cẩn thận, những kẻ tội lỗi rốt cuộc có thể bị tước đoạt món quà thiêng liêng ấy.\nĐặc điểm này mở khóa một nhánh lối sống mới."
 trait_truefaith_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] thực sự tin vào sự hiện diện của Đấng Thiêng Liêng. [Glossary('Đức Tin Chân Chính','game_concept_true_faith_desc')] là một phần cốt lõi trong linh hồn [ROOT.Char.GetHerHis], ban cho [ROOT.Char.GetHerHim] khả năng tiếp cận những năng lực mà một số người gọi là phi tự nhiên. Nhưng hãy cẩn thận, những kẻ tội lỗi rốt cuộc có thể bị tước đoạt món quà thiêng liêng ấy.\nĐặc điểm này mở khóa một nhánh lối sống mới."

 trait_beatific: "Người Được Thánh Sủng"
 trait_beatific_desc: "Là hiện thân sống động của vị Thần mà họ tôn thờ, nhân vật này là một người làm phép màu, một hình mẫu của [Glossary('Đức Tin Chân Chính','game_concept_true_faith_desc')] giữa một thế giới bóng tối. Điều này cho họ khả năng tiếp cận những năng lực mà một số người gọi là phi tự nhiên. Nhưng hãy cẩn thận, những kẻ tội lỗi rốt cuộc có thể bị tước đoạt món quà thiêng liêng ấy."
 trait_beatific_character_desc: "Là hiện thân sống động của vị Thần mà [ROOT.Char.GetHerHis] tôn thờ, [ROOT.Char.GetFirstNameNoTooltip] là một người làm phép màu, một hình mẫu của [Glossary('Đức Tin Chân Chính','game_concept_true_faith_desc')] giữa một thế giới bóng tối. Điều này cho [ROOT.Char.GetHerHim] khả năng tiếp cận những năng lực mà một số người gọi là phi tự nhiên. Nhưng hãy cẩn thận, những kẻ tội lỗi rốt cuộc có thể bị tước đoạt món quà thiêng liêng ấy."
 #trait_beatific_player_desc: "#medium See the [GetDecision('advance_beatific_decision').GetName] [decision|E] for details on gaining [trait_level_track_xp|E].#!\n\n$trait_beatific_character_desc$"
 #trait_track_beatific: "Miracles"
 #trait_track_beatific_desc: "#bold Level 1:#! Make $POD_demon_unearthbound_decision$ [decision|E] free. As a [character_interaction|E], allows you to [POD_banish|E] a wraith/demon character to the [Glossary('Dark Kingdom','game_concept_dark_kingdom_desc')]/[UmbraGlossary('abyss')]. Unlocks a special [GetBuilding('sanctified_area_01').GetName] building. \n#bold Level 2:#! Unlocks a [crafting_node|E] that adds [GetModifier('bless_modifier').GetNameWithTooltip] as well as a [modifier|E] based on the [artifact|E]'s type. Gain immunity to murder. Gain immunity to delirium. You can no longer be possessed by $POD_splat_wraith_plural$.\n#bold Level 3:#! Targets will always accept faith conversion demands.\n#bold Level 4:#! As a [character_interaction|E], allows you to resolve every [Fetter|E] of a wraith. As a [character_interaction|E], allows you to kill a supernatural with low piety. You no longer need a hook to [POD_banish|E] a spirit.\n#bold Level 5:#! As a [character_interaction|E], allows you to make a vampire mortal again or achieve Golconda. Can recruit [GetMaA('minion_of_the_divine').GetName] as [men_at_arms|E]. Allows you to spend willpower instead of taking wounds. Allows you to not die by wounds.\n#italic The strongest tool in the hands of the Faithful is the power of true Miracles. Entire religions are born from such displays of True Faith.#!"

 trait_holy_seal: "Ấn Ký Thần Thánh"
 trait_holy_seal_desc: "Các thánh tích và hiện vật của quyền năng thần thánh bị nhét vào vết thương của kẻ khốn khổ này một cách tàn bạo nhưng điêu luyện, ngăn không cho vết thương lành lại."
 
 trait_custom_bloodline: "Huyết Thống Tự Tạo"
 trait_custom_bloodline_character: "[ROOT.Char.GetDynasty.GetBaseNameNoTooltip]"
 trait_custom_bloodline_desc: "Một huyết thống non trẻ của $pod_cainites$. Dù phần lớn Kindred không công nhận họ là ngang hàng, huyết thống này sẵn sàng chứng minh cho kẻ khác thấy rằng họ mới là những kẻ thống trị thực sự của màn đêm."
 trait_custom_bloodline_character_desc: "Một huyết thống non trẻ của $pod_cainites$. Dù phần lớn Kindred không công nhận họ là ngang hàng, [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] sẵn sàng chứng minh cho kẻ khác thấy rằng họ mới là những kẻ thống trị thực sự của màn đêm."
 
 trait_leading_front: "Dẫn Đầu Xông Trận"
 trait_leading_front_desc: "Artemis Orthia đã làm gương cho mọi Ventrue, đôi khi xông thẳng vào kẻ địch lại giải quyết vấn đề tốt hơn là mưu kế và ngoại giao"
 
 trait_hun_tactics: "Chiến Thuật Man Dã"
 trait_hun_tactics_desc: "Matasuntha đã làm gương cho mọi Gangrel, dùng bản năng hoang dã của bạn sẽ giúp bạn chiến thắng"
 
 trait_swift_movement: "Hành Động Thần Tốc"
 trait_swift_movement_desc: "Hannibal đã làm gương cho mọi Brujah, bạn phải hành động thật nhanh nếu muốn chiến thắng"
 
 trait_samiel_follower: "Tín Đồ của Samiel"
 trait_samiel_follower_desc: "Samiel đã làm gương cho mọi Salubri, cái ác phải bị trừng trị, kể cả khi tình thế không có lợi cho bạn, vì cái ác sinh sôi trong trái tim không bị thách thức"
 
 trait_shadow_warrior: "Được Kính Trọng và Khiếp Sợ"
 trait_shadow_warrior_desc: "Jamal đã làm gương cho mọi Banu Haqim, nếu kẻ địch đã sợ hành động của bạn trước cả khi gặp mặt, thì trận chiến đã thắng"

 trait_faithful_warrior: "Chiến Binh Sùng Đạo"
 trait_faithful_warrior_desc: "Tarique đã làm gương cho mọi Nosferatu, chiến đấu vì đức tin là một chính nghĩa xứng đáng"
 
 trait_shadow_reconquista_warrior: "Chiến Tranh Bóng Tối"
 trait_shadow_reconquista_warrior_desc: "Silvester de Ruiz đã làm gương cho mọi Lasombra, đôi khi chiến tranh đòi hỏi mưu mẹo và lừa dối"
 
 trait_caitiff_warrior: "Chiến Binh Caitiff"
 trait_caitiff_warrior_desc: "Caitiff đơn độc trong thế giới tăm tối này, đó là lý do họ học cách tự bảo vệ mình trong các trận chiến"
 
 trait_salubri_caste: "Đẳng Cấp Salubri"
 
 trait_salubri_healer: "Salubri Chữa Lành"
 trait_salubri_healer_desc: "Đẳng Cấp những người chữa lành, chiếm phần lớn trong huyết thống 'bình thường', mục đích của họ là chữa lành và truyền dạy [golconda|E]"
 
 trait_salubri_warrior: "Salubri Chiến Binh"
 trait_salubri_warrior_desc: "Đẳng Cấp các chiến binh, được Samiel sáng lập sau Chiến Tranh Baali. Các chiến binh là những kẻ lang bạt, luôn tìm kiếm cái ác để tiêu diệt bất cứ nơi nào nó có thể nảy sinh. Mỗi thành viên của Đẳng Cấp chiến binh được ban một cái tên thiên thần sau một nghi lễ khai tâm"
 
 trait_salubri_watcher: "Salubri Người Canh Giữ"
 trait_salubri_watcher_desc: "Đẳng Cấp những người canh giữ, được sáng lập trong hành trình của Saulot về phương Đông. Là học giả và kẻ trộm, những người canh giữ đóng vai trò bảo vệ các Salubri khác, chống lại những kẻ phủ nhận quyền tồn tại của họ và ngăn họ đạt được sự cứu chuộc"
 
 trait_teachings: "Giáo Huấn của Chandraputra"
 trait_teachings_desc: "Chandraputra đã làm gương cho mọi Ravnos, làm một vị tướng giỏi hữu ích hơn nhiều so với làm một chiến binh giỏi"
 
 trait_orison_compass: "La Bàn Đạo Đức"
 trait_orison_compass_desc: "Nhân vật này không thể làm ngơ trước tội lỗi, kể cả tội lỗi của chính mình. Họ có một giác quan gần như không sai lệch về mức độ nghiêm trọng khi những người xung quanh phạm tội với Chúa."
 
 trait_orison_innocent: "Kẻ Vô Tội Đích Thực"
 trait_orison_innocent_desc: "Nhân vật này thuần khiết không tì vết, một ngọn hải đăng ánh sáng tinh khôi nhất giữa bóng tối thời đại chúng ta."
 
 trait_orison_noah: "Ân Sủng của Noah"
 trait_orison_noah_desc: "Cá nhân này sở hữu một phẩm chất đặc biệt xoa dịu trái tim và tính khí của mọi loài thú trong tự nhiên."
 
 trait_orison_vigilance: "Mắt Cảnh Giác"
 trait_orison_vigilance_desc: "Nhân vật này cần ngủ ít hơn nhiều so với người bình thường và dễ tỉnh giấc hơn người khác."
 
 trait_orison_penitent: "Kẻ Sám Hối"
 trait_orison_penitent_desc: "Chỉ bằng cách biết rõ vị trí của mình trong kế hoạch của Chúa, một người bình dị thường có thể hiểu về thế giới rộng lớn này nhiều hơn cả những vị vua quyền uy nhất hay những học giả uyên bác nhất."
 
 trait_orison_years: "Ân Phước của Năm Tháng"
 trait_orison_years_desc: "Tâm trí nhân vật này được ban cho sự khôn ngoan vượt xa tuổi tác cùng khả năng nắm bắt khái niệm mới một cách dễ dàng."
 
 trait_orison_hierophant: "Vị Giáo Chủ"
 trait_orison_hierophant_desc: "Nhân vật này là hình mẫu của sự điềm tĩnh và phong thái giữa hiểm nguy, ngay cả khi bước đi trong bóng của tử thần."
 
 trait_orison_sanguine: "Thánh Ca Huyết Sắc"
 trait_orison_sanguine_desc: "Đức tin của nhân vật này chảy trong huyết quản, biến nó thành thứ độc dược chết người đối với mọi thứ ô uế."
 
 trait_orison_talespinner: "Người Kể Chuyện"
 trait_orison_talespinner_desc: "Cá nhân này sở hữu một nhiệt huyết tự nhiên và sự hăng say lây lan trong việc truyền bá lời Chúa."
 
 #trait_oculi_shepherd: "Heavenly Shepherd"
 #trait_oculi_shepherd_desc: "Allows the Eye of God to hide in plain sight as he does Heaven's work and to cloud the minds of those who would hamper his holy mission."
 
 #trait_oculi_sight: "Second Sight"
 #trait_oculi_sight_desc: "The Sight allows the Inquisitor to seek out supernatural creatures regardless of their efforts to foil being observed."
 
 #trait_oculi_liturgy: "Divine Liturgy"
 #trait_oculi_liturgy_desc: "By recitation of scripture the Eye of God may impose his dedication to the cause on another individual."
 
 #trait_oculi_trust: "I Trust in Thee"
 #trait_oculi_trust_desc: "By praising God, the agent may infuse others with love for Him and His laws."
 
 trait_oculi_wine: "Nước Hóa Rượu"
 trait_oculi_wine_desc: "Vị thẩm tra viên có thể biến một vật thể bình thường thành thứ khác, hoặc phục hồi mô đã chết hay đang hấp hối về trạng thái khỏe mạnh."
 
 #trait_acre_catechumen: "Catechumen"
 #trait_acre_catechumen_desc: "Allows the inquisitor to exemplify his early lessons in valour, humility and constancy."
 
 #trait_acre_flesh: "Transfiguration of the Flesh"
 #trait_acre_flesh_desc: "The knight has been invested with the power to alter his physical capabilities by calling upon his unshakeable virtue."
 
 #trait_acre_flight: "Flight of Angels"
 #trait_acre_flight_desc: "Allows the inquisitor to reap the divine whirlwind when in combat with the minions of Adversary."
 
 #trait_acre_resurrection: "Spirit of the Resurrection"
 #trait_acre_resurrection_desc: "Some knights are divinely invested with the power to control the ebb and flow of life force within themselves and others."
 
 trait_acre_auto: "Auto da Fé"
 trait_acre_auto_desc: "Một lý do cốt lõi khiến thuộc hạ của Kẻ Nghịch Thù khiếp sợ các Hiệp Sỹ của Chúa, phước lành này cho phép vị thẩm tra viên dồn hết đức hạnh và sức mạnh vào đòn đánh chắc chắn sẽ quyết định thắng bại của bất kỳ cuộc đấu tay đôi nào."
 
 trait_murnau_knowledge: "Tri Thức Cấm"
 trait_murnau_knowledge_desc: "Gia tộc Von Murnau bị (hay được) ban cho một sự thông thuộc bẩm sinh cùng khả năng cảm nhận mọi hình thức ô uế qua nhiều thế hệ."
 
 #trait_murnau_oblige: "Noblesse Oblige"
 #trait_murnau_oblige_desc: "Nobility that inspires others."
 
 #trait_murnau_wreathed: "Wreathed in Shadows"
 #trait_murnau_wreathed_desc: "Mastery of the dark side of the Murnau's own nature that lets them affect it in others."
 
 #trait_murnau_mirror: "Mirror of Evil"
 #trait_murnau_mirror_desc: "Ability to meet the supernatural opposition on even ground, armed with strength and knowledge."
 
 trait_murnau_arcana: "Áo Nghĩa"
 trait_murnau_arcana_desc: "Khả năng cản trở, chuyển hướng hoặc né tránh hành động của lũ quỷ tha ma bắt. Năng lực này thường phải trả giá bằng linh hồn của vị thẩm tra viên, nhưng nó cho phép phản chiếu quyền năng siêu nhiên ngược lại kẻ sử dụng."
 
 #trait_sisters_gospel: "Gospel"
 #trait_sisters_gospel_desc: "Grants the Sisters great skill at debate, oration and, if necessary, interrogation."
 
 #trait_sisters_lux: "Fiat Lux"
 #trait_sisters_lux_desc: "Echoing the words of the Father, the inquisitor declaims 'Let there be light!' and a soft nimbus of white light appears around her, illuminating supernatural creatures for what they are."
 
 #trait_sisters_chorale: "Chorale"
 #trait_sisters_chorale_desc: "Drawing strength, knowledge or protection from a communal chant."
 
 #trait_sisters_hosanna: "Hosanna"
 #trait_sisters_hosanna_desc: "Inquisitors use this power to capture the spiritual "wavelength" of the Song of Heaven, using its power to further the Glory of God."
 
 trait_sisters_oratorio: "Thánh Ca Đoàn"
 trait_sisters_oratorio_desc: "Cho phép vị Nữ Tu cất giọng ca vang và tràn ngập ánh hào quang rực rỡ của đức tin mình vào người nghe, một trải nghiệm tàn khốc đối với những kẻ nô lệ của tội lỗi."
 
 #trait_red_vigil: "Blessed Vigilance"
 #trait_red_vigil_desc: "This rite provides the subject with energy relieving them of need for sleep or rest."
 
 #trait_red_sunstone: "Sunstone"
 #trait_red_sunstone_desc: "Infuse an ordinary rock with the blessing of the Lord's first creation, the Sun. The brightness of the stone is then commanded by the virtue of its bearer."
 
 #trait_red_march: "Forced March"
 #trait_red_march_desc: "This rite allows for swift travel regardless of fatigue and difficult conditions after sufficient supplication before God."
 
 #trait_red_fortunes: "Fortunes of War"
 #trait_red_fortunes_desc: "Through this hallowed rite, a practitioner can bless a group of armed combatants on their way to fight the foe."
 
 trait_red_forge: "Lò Rèn của Chúa"
 trait_red_forge_desc: "Thánh hóa quá trình rèn vũ khí để tạo ra binh khí được ban phước."
 
 trait_yinyang: "Âm Dương"
 
 trait_yin_imbalanced: "Âm"
 trait_yin_imbalanced_desc: "Bạn là một sinh vật của bóng tối và cái chết."
 
 trait_yinyang_balanced: "Cân Bằng"
 trait_yinyang_balanced_desc: "Bạn hài hòa các thành tố phân tách trong Khí của mình."
 
 trait_yang_imbalanced: "Dương"
 trait_yang_imbalanced_desc: "Bạn hướng về ánh sáng và sự sống."
 
 trait_dharma: "Pháp Môn"
 trait_dharma_player_desc: "#medium #V [ROOT.Char.GetFirstNamePossessiveNoTooltip]#! [Glossary('Pháp Môn','podgloss.dharma')] là [ROOT.Char.GetFaith.GetName].#!\n\n#medium;italic #V Bạn#! nhận [Glossary('Pháp Môn','podgloss.dharma')] [trait_level_track_xp|E] từ các nguồn sau:#!\n[GetPlayer.MakeScope.GetScriptValueDesc('POD_kueijin_dharma_xp_active_loca')]\n\n#medium;italic #V Bạn#! cũng nhận #V thụ động#! [Glossary('Pháp Môn','podgloss.dharma')] [trait_level_track_xp|E] mỗi #V 2#! năm:#!\nKinh nghiệm thụ động: #TOOLTIP:trait_track_dharma_desc_in_game_tt #L;P +[GetPlayer.MakeScope.ScriptValue('POD_kueijin_dharma_xp_passive')|2]#! #L (xem tooltip)#!#!\n#TOOLTIP:trait_track_dharma_desc_insight_passive #L Mọi nguồn kinh nghiệm thụ động tiềm năng (xem tooltip)#!#!"
 trait_track_dharma_desc: "Ngộ Tính là thước đo mức độ bạn tiến gần đến việc thăng cấp [Glossary('Pháp Môn','podgloss.dharma')] của mình. Khi [trait_level_track_xp|E] đạt tới mốc đầu tiên, cấp Pháp Môn của bạn sẽ tăng lên, ngoại trừ Pháp Môn 10."
