 trait_dharma6_desc: "Phần lớn đảm nhận vai trò Chiến Binh (hay Ksatriya nếu là [GetTrait('kueijin').GetName( GetNullCharacter )] theo Ấn Độ giáo) hoặc Quan Lại (hay Brahmin nếu là [GetTrait('kueijin').GetName( GetNullCharacter )] theo Ấn Độ giáo), thường cần 100 năm để đạt tới trạng thái này. Có thể ăn Khí trong không khí xung quanh."
