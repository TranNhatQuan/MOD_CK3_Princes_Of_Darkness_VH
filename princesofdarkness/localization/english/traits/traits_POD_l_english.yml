 DHARMA_PASSIVE_BLACK_WIND_STACKS: "You have [GetPlayer.MakeScope.ScriptValue('demon_arts_black_wind_modifier_stacks')] [GetModifier('demon_arts_black_wind_modifier').GetNameWithTooltip]"
