l_english: 
 # Boilerplate copy for the standard countermeasures.
 scheme_countermeasure_type_all_seeing_eye: "Con Mắt Toàn Tri"
 scheme_countermeasure_type_all_seeing_eye_desc: "#WEAK Quyền năng siêu nhiên tiên tri có thể giúp ích rất nhiều trong việc tự bảo vệ bản thân khỏi sự chú ý không đáng có.#!"

 scheme_countermeasure_type_all_seeing_eye_t1: "$scheme_countermeasure_type_all_seeing_eye$"
 scheme_countermeasure_type_all_seeing_eye_t1_desc: "$scheme_countermeasure_type_all_seeing_eye_desc$"
 scheme_countermeasure_type_all_seeing_eye_t2: "$scheme_countermeasure_type_all_seeing_eye$"
 scheme_countermeasure_type_all_seeing_eye_t2_desc: "$scheme_countermeasure_type_all_seeing_eye_desc$"
 scheme_countermeasure_type_all_seeing_eye_t3: "$scheme_countermeasure_type_all_seeing_eye$"
 scheme_countermeasure_type_all_seeing_eye_t3_desc: "$scheme_countermeasure_type_all_seeing_eye_desc$"
 scheme_countermeasure_type_all_seeing_eye_t4: "$scheme_countermeasure_type_all_seeing_eye$"
 scheme_countermeasure_type_all_seeing_eye_t4_desc: "$scheme_countermeasure_type_all_seeing_eye_desc$"

 countermeasures_unlocks_t1_all_seeing_eye: "Mở khóa [scheme_countermeasure_countermeasure|E] #V $scheme_countermeasure_type_all_seeing_eye$#! #weak (Cấp 1)#!"
 countermeasures_unlocks_t2_all_seeing_eye: "Mở khóa [scheme_countermeasure_countermeasure|E] #V $scheme_countermeasure_type_all_seeing_eye$#! #weak (Cấp 2)#!"
 countermeasures_unlocks_t3_all_seeing_eye: "Mở khóa [scheme_countermeasure_countermeasure|E] #V $scheme_countermeasure_type_all_seeing_eye$#! #weak (Cấp 3)#!"
 countermeasures_unlocks_t4_all_seeing_eye: "Mở khóa [scheme_countermeasure_countermeasure|E] #V $scheme_countermeasure_type_all_seeing_eye$#! #weak (Cấp 4)#!"
 countermeasures.desc.all_seeing_eye: "$EFFECT_LIST_BULLET$[scheme_countermeasure_countermeasure|E] mới: $scheme_countermeasure_type_all_seeing_eye$\n$EFFECT_LIST_BULLET$Giảm [secrecy|E]"

 scheme_countermeasure_type_mental_fortress: "Pháo Đài Tâm Trí"
 scheme_countermeasure_type_mental_fortress_desc: "#WEAK Những tâm trí được phòng thủ vững chắc, với sự bảo vệ mang bản chất siêu nhiên, tạo nên một pháo đài bất khả xâm phạm trước những kẻ mưu mô.#!"

 scheme_countermeasure_type_mental_fortress_t1: "$scheme_countermeasure_type_mental_fortress$"
 scheme_countermeasure_type_mental_fortress_t1_desc: "$scheme_countermeasure_type_mental_fortress_desc$"
 scheme_countermeasure_type_mental_fortress_t2: "$scheme_countermeasure_type_mental_fortress$"
 scheme_countermeasure_type_mental_fortress_t2_desc: "$scheme_countermeasure_type_mental_fortress_desc$"
