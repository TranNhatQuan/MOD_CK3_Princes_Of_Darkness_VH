 scheme_countermeasure_type_mental_fortress_t3_desc: "$scheme_countermeasure_type_mental_fortress_desc$"
 scheme_countermeasure_type_mental_fortress_t4: "$scheme_countermeasure_type_mental_fortress$"
 scheme_countermeasure_type_mental_fortress_t4_desc: "$scheme_countermeasure_type_mental_fortress_desc$"

 countermeasures_unlocks_t1_mental_fortress: "Mở khóa [scheme_countermeasure_countermeasure|E] #V $scheme_countermeasure_type_mental_fortress$#! #weak (Cấp 1)#!"
 countermeasures_unlocks_t2_mental_fortress: "Mở khóa [scheme_countermeasure_countermeasure|E] #V $scheme_countermeasure_type_mental_fortress$#! #weak (Cấp 2)#!"
 countermeasures_unlocks_t3_mental_fortress: "Mở khóa [scheme_countermeasure_countermeasure|E] #V $scheme_countermeasure_type_mental_fortress$#! #weak (Cấp 3)#!"
 countermeasures_unlocks_t4_mental_fortress: "Mở khóa [scheme_countermeasure_countermeasure|E] #V $scheme_countermeasure_type_mental_fortress$#! #weak (Cấp 4)#!"
 countermeasures.desc.mental_fortress: "$EFFECT_LIST_BULLET$[scheme_countermeasure_countermeasure|E] mới: $scheme_countermeasure_type_mental_fortress$\nGiảm [success_chance|E] cho hầu hết [schemes|E]"

 scheme_countermeasure_type_supernatural_high_alert: "Cảnh Giác Cao Độ Siêu Nhiên"
 scheme_countermeasure_type_supernatural_high_alert_desc: "#WEAK Khi mối đe dọa dường như đang đến gần hơn bao giờ hết, triều đình này sử dụng mọi quyền năng sẵn có để ngăn chặn cuộc tấn công sắp tới.#!"

 scheme_countermeasure_type_supernatural_high_alert_t1: "$scheme_countermeasure_type_supernatural_high_alert$"
 scheme_countermeasure_type_supernatural_high_alert_t1_desc: "$scheme_countermeasure_type_supernatural_high_alert_desc$"
