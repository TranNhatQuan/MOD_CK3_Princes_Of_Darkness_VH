 countermeasures.desc.supernatural_high_alert: "$EFFECT_LIST_BULLET$[scheme_countermeasure_countermeasure|E] mới: $scheme_countermeasure_type_supernatural_high_alert$\nGiảm [success_chance|E] cho [GetScheme('murder').GetTypeName], [GetScheme('abduct').GetTypeName] và các [schemes|E] thù địch trực tiếp tương tự"

