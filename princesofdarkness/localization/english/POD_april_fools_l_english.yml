 POD_marauder_mode_goldform: "Được Làm Từ Vàng"

 POD_april_fools.102.t: "Những Ngày Nghịch Lý"
 POD_april_fools.102.desc: "Tất cả những gì ngươi muốn chỉ là một khoảnh khắc yên tĩnh. Ngươi ra ngoài dạo bộ, và rồi nó xuất hiện, dấu hiệu đầu tiên của cơn điên loạn sắp ập đến: một cái cây làm bằng vàng nguyên khối.\n\nKinh ngạc, ngươi đưa tay chạm vào nó. Cái cây bỗng vỡ tung thành một đám mây bươm bướm bay phấp phới, mỗi con đều hét lên \"Chúc mừng! Chúc mừng! Chúc mừng!\" trong lúc bay vòng quanh đầu ngươi như một vầng hào quang khó chịu nhất có thể tưởng tượng được. Khi ngươi xua tay đuổi đám bươm bướm, chúng tản ra rồi lại tụ về thành một cái cây hoàn toàn bình thường.\n\nNgươi vội vã quay về triều đình và thấy nó đang trong cảnh hỗn loạn. Đồ đạc thì đang tan chảy, hoặc lơ lửng, hoặc dính chặt lên trần nhà. Quần áo của ai đó đã biến thành rết. Không khí lấp lánh những sắc cầu vồng phi lý.\n\nNếu đây là một ảo ảnh, ngươi rùng mình khi nghĩ đến việc phải mạnh mẽ đến mức nào mới tạo ra được thứ có quy mô như vậy. Nhưng nếu không phải..."
 POD_april_fools.102.a: "Ta phải bắt đầu từ đâu để tìm ra kẻ chịu trách nhiệm đây?"
 POD_april_fools.102.tt.1: "[skills|E] của ngươi sẽ bị ngẫu nhiên hóa mỗi tháng."
 POD_april_fools.102.tt.2: "[personality_traits|E] của ngươi sẽ bị ngẫu nhiên hóa mỗi năm."
 POD_april_fools.102.tt.3: "Chắc chắn đây chỉ là chuyện tạm thời, ngươi chỉ cần chờ nó qua đi."

# reused
 POD_april_fools.103.desc.intro: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('courtier'))] [courtier.GetFirstName] của ngươi đến gặp ngươi với tin tức về sự hỗn loạn đang diễn ra."

 POD_april_fools.103.desc: "\"Tôi tìm thấy cái này. Chẳng phải là một đứa bé dễ thương sao? Chúng ta phải chăm sóc nó thật tốt và nuôi dạy nó thành một thành viên đúng nghĩa của gia đình này.\"\n\n\"Đứa bé dễ thương\" nói ở đây thực chất là một con rồng."
 POD_april_fools.103.a: "Tuyệt, ta vẫn luôn muốn có một con rồng."

 POD_april_fools.104.desc: "Không phải ngươi cần [courtier.GetHerHim] nói ra, vì rõ ràng chuyện gì đã xảy ra. [courtier.GetSheHe|U] đã hóa vàng. Ngươi cũng vậy. Mọi người trong [ROOT.Char.Custom('GetCourt')|l] này cũng vậy, cùng với toàn bộ đồ đạc và vũ khí của ngươi."
 POD_april_fools.104.a: "Chúng ta có thể trục lợi từ chuyện này, nhưng tiếc là vũ khí thì hỏng hết rồi."

 POD_april_fools.105.desc: "\"Sáng nay tôi đi kiểm tra ngục giam thì phát hiện ra [prisoner.GetName]. Không rõ [prisoner.GetSheHe] làm cách nào vào được trong đó. [prisoner.GetSheHe|U] cũng không biết nốt. Nhưng thôi, của trời cho thì cứ nhận, đúng không?\""
 POD_april_fools.105.a: "Ta nên quyết định phải làm gì với [prisoner.GetHerHim]."

 POD_april_fools.106.desc: "\"Tóc tôi rụng hết rồi.\" Có một nỗi u sầu sâu sắc trong ánh mắt [courtier.GetHerHis], khiến ngươi không khỏi bất ngờ. Ngươi chưa bao giờ biết [courtier.GetFirstNameNoTooltip] lại quan tâm đến vẻ ngoài của [courtier.GetHerHis] đến vậy."
 POD_april_fools.106.a: "Ừ, ta cũng để ý thấy. Tóc ta cũng rụng hết rồi."
 POD_april_fools.106.a.alreadybald: "Ừ-hứ. Chắc là khủng khiếp lắm."

 POD_april_fools.107.desc: "\"Phô mai.\" Từ chối giải thích thêm, [courtier.GetSheHe] đưa cho ngươi miếng phô mai nói trên."
 POD_april_fools.107.a: "Ừm. Cảm ơn?"

 POD_april_fools.108.desc: "\"Vâng, à, tin lớn đây.\" [courtier.GetSheHe|U] cựa quậy lo lắng. \"Ngài có biết về vụ nổ lớn hôm nọ không? Cột lửa xanh vươn lên tận trời, gào thét như một dàn hợp xướng của những linh hồn bị đày đọa ấy?\"\n\nCó, ngươi có thấy. Cũng khó mà bỏ lỡ được. Dù lúc đó ngươi cũng chẳng quan tâm mấy. Với ngần ấy chuyện đang diễn ra, nó cứ như một ngày thứ Ba bình thường khác.\n\n\"Chà, nó để lại ấn tượng khá sâu đậm với đám $POD_splat_hunter_plural$ ở địa phương. Họ đã báo cáo lên tận cấp trên, và giờ Tòa Thánh đang huy động lực lượng để tiêu diệt 'lũ quỷ giữa chúng ta.'\"\n\n\"Họ gọi đó là Tòa Dị Giáo.\""
 POD_april_fools.108.a: "Như thể chúng ta chưa đủ rắc rối vậy."
 POD_april_fools.108.a.hunter: "Ta cho là điều đó có lợi cho chúng ta."
 POD_april_fools.108.a.premature: "LẠI THÊM MỘT VỤ NỮA??"
 POD_april_fools.108.a.premature.hunter: "Lại thêm một vụ nữa à? Tạ ơn Chúa."

 POD_april_fools.109.desc: "\"Ngoài kia loạn hết cả lên rồi. Các nhà dị giáo đang xuất quân, thiêu rụi hết hang ổ khắp nơi. Đà này thì họ sẽ diệt sạch chúng ta mất.\"\n\nNgươi xoa thái dương. \"Vậy nghĩa là cuối cùng chúng ta cũng có thể gác lại hiềm khích để hợp sức chống lại kẻ thù chung sao?\"\n\n\"Cái gì? Không, điên rồ quá. Này, ngài không suy nghĩ như một nhà kinh doanh rồi. Đây là cơ hội vàng để cướp sạch mọi người khác. Sẽ chẳng ai ngờ chúng ta đâm sau lưng họ trong lúc họ đang bận đối phó với chuyện lớn hơn.\""
 POD_april_fools.109.desc.hunter: "\"Ngoài kia loạn hết cả lên rồi. Các nhà dị giáo đang xuất quân, thiêu rụi hết hang ổ khắp nơi. Lũ hút máu đang nóng ruột lắm. Chúng biết mình chẳng còn tồn tại được bao lâu nữa.\"\n\nNgươi thở dài. \"Vậy thì sao? Tòa Thánh đang lo liệu chuyện này. Chúng ta có thể đứng ngoài cuộc này. Không cần liều mạng khi mà đám giáo chủ ba lần được phong thánh hai lần được ban phước của họ sẵn sàng chết ở tuyến đầu.\"\n\n\"Cái gì? Không, điên rồ quá. Này, ngài không suy nghĩ như một nhà kinh doanh rồi. Đây là cơ hội vàng để cướp sạch mọi người khác. Sẽ chẳng ai ngờ chúng ta đâm sau lưng họ trong lúc họ đang bận đối phó với chuyện khác.\""
 POD_april_fools.109.a: "Đó là điều ngu ngốc nhất ta từng nghe."
 POD_april_fools.109.tt: "AI CŨNG CÓ THỂ [raid|E] ngay bây giờ."
 
 POD_april_fools.110.desc: "\"Aboeisrd moieaon kstlbv og. Goob broncpsdz ib? Plib e bib. Zbilbrekwlommbiorbeon aglonmeqwas eorleor ir immnimnim plembaf, nor limnon leqbaf, nor zeblorneqis rirghhb nekbaf. Ya bib?\""
 POD_april_fools.110.a: "Hor hor hor! Sik nempis irliq nempo bib."
 POD_marauder_mode_tongues: "Nói Ngôn Ngữ Của Các Vị Thần"
 POD_marauder_mode_tongues_desc: "Ha blemqas nirtuilzvkkir tiglpvnmbonan giruen bib. Giruen? Og pilnis? Hor hor hor."
 
 POD_april_fools.111.desc: "\"Ta ghét ngươi. Chỉ muốn cho ngươi biết vậy thôi.\""
 POD_april_fools.111.a: "Cái gì cơ?"
 
 POD_april_fools.112.t: "Kẻ Chịu Trách Nhiệm"
 POD_april_fools.112.desc: "Một tiếng vo ve trầm thấp báo hiệu sự xuất hiện của nó. Sàn nhà và trần nhà vỡ vụn thành hàng ngàn mảnh sặc sỡ, rồi tái hợp thành những mạng lưới pha lê xoắn ốc. Ánh sáng trong căn phòng của ngươi bẻ cong theo những góc độ khiến người ta buồn nôn. Thực tại khóc than, và chấp nhận thất bại.\n\nTại tâm điểm của cơn bão này là một hố đen, có hình dáng như một người đàn ông. Ít nhất ngươi nghĩ đó là một người đàn ông. Không có đặc điểm nào có thể nhận ra được. Thực thể này chỉ có thể thấy được qua đường viền của nó và lực hấp dẫn mà nó tác động lên xung quanh, như thể một thứ vừa là cốt lõi thiết yếu cho sự tồn tại của thế giới này, vừa không thể tồn tại bên trong nó.\n\nNgươi đã sống sót đến giờ này là nhờ biết khi nào nên chiến đấu và khi nào nên rút lui. Trận chiến này là một trận ngươi không thể thắng. Tất cả những gì ngươi có thể làm là quan sát, và hy vọng vào điều tốt đẹp nhất."
# ellipsis
 
 POD_april_fools.113.t: "Maraudeur"
 POD_april_fools.113.desc: "Vật đó chào ngươi bằng một âm thanh vang vọng thẳng từ địa ngục.\n\nNghe có vẻ hơi giống, \"Bonjour\".\n\nNgoài điều đó ra, nó có vẻ khá cởi mở với cuộc trò chuyện lịch sự. Nó liên tục xin lỗi vì tất cả rắc rối đã gây ra, và đưa ra cho ngươi một lời giải thích dài dòng đầy thuật ngữ khoa học mà ngươi không tài nào hiểu nổi, về \"các quả cầu\" và \"các dụng cụ\" và \"vùng thực tại của kẻ cướp phá\". Ngươi hiểu lờ mờ rằng nó đang chạy trốn khỏi \"lão già nhăn nheo #italic fils de pute#!\" đó và rằng chuyến viếng thăm nơi này của nó là \"quá sớm\", nhưng ngươi có thể sẽ gặp những kẻ khác giống nó một ngày nào đó, \"khi thời điểm thích hợp\". Sau đó nó mở ra một cánh cổng xoáy và định rời đi.\n\nNgươi gọi với theo thực thể đó, vẫn còn bối rối. \"Ngươi là ai?\"\n\nNó nói, \"Ngươi có thể gọi ta là Jean\"."
 POD_april_fools.113.a: "Ta đoán vậy là xong."

 