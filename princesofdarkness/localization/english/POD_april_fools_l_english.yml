##### APRIL FOOLS 2025

 Wetrius: "Wetrius"
 Wetrius_Prime: "Wetrius Prime"
 Cainetrius: "Cainetrius"

 POD_april_fools.2.t: "Đây Chính Là Đỉnh Cao Của Sự Hoàn Hảo"
 POD_april_fools.2.desc: "Có điều gì đó đã xảy ra với thế giới.\n\nNgươi không thể xác định chính xác đó là gì. Nó vốn dĩ luôn như vậy. Phải không nhỉ?\n\nThôi kệ, chắc cũng chẳng phải chuyện gì quan trọng đâu.\n\nChắc vậy."
 POD_april_fools.2.a: "Hàng xóm của ta lúc nào cũng trông như thế này sao?"
 POD_april_fools.2.tt: "Ngươi có một mục tiêu mới: tìm hiểu tận gốc rễ diễn biến này."

 POD_april_fools.3.t: "Hắn Trở Lại"
 POD_april_fools.3.desc: "Và kìa, một tiếng sấm vang lên. Từ lòng đất của Trái Đất bị Chúa bỏ rơi, kẻ khai sinh ra toàn bộ dòng dõi Wetrius trỗi dậy, đến để báo thù cho các childe của hắn.\n\nKhông còn mục tiêu nào sau chuyện này nữa. Không còn gì để làm nữa.\n\nHãy từ bỏ ngay bây giờ, hoặc tiếp tục sống trong thế giới diệt vong mà ngươi đã tạo ra."
 POD_april_fools.3.a: "Ừ, chết tiệt thật."

 POD_wetrius_objective: "Ngày Tận Thế Wetrius"
 POD_wetrius_objective_desc: "Không ai định ngăn chặn lũ vô lại nhớp nháp này sao?\nPhải có ai đó gửi cho chúng một thông điệp."
 POD_wetrius_objective_tooltip: "Kiểu như, chúng nó có tự bôi dầu em bé lên người mỗi khi hoàng hôn xuống không, hay là sao"
 POD_wetrius_objective_confirm: "Cút đi, lũ khốn nhờn nhợt kia"
 POD_wetrius_objective_is_valid: "Ngươi đã đích thân giết [EmptyScope.ScriptValue('POD_wetrius_kill_requirement')|V0] tên Wetrius #weak (số lượng hiện tại: [GetPlayer.MakeScope.ScriptValue('POD_wetrius_killcount')|0])#!"
 POD_wetrius_objective_is_valid_2: "#V [GetScriptedCharacterByHistoryID('505084').GetFirstName]#! đã chết"
 POD_wetrius_objective_effect: "Chắc chắn sẽ có chuyện tốt xảy ra thôi"

 wetrius_event_troops: "Hiệp Sĩ Chén Thánh"


