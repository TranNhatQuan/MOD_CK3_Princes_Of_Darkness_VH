 PILLAR_OF_OSIRIS_PERK_EFFECT: "Làm cho [decision|E] tĩnh tâm ẩn dật miễn phí và tăng gấp đôi khả năng có kết quả tích cực.\n#F Tạo ra một trung tâm huyền bí giúp việc thiền định đúng cách và giảm độ khó của năng lực siêu nhiên#!"
 PARADOX_PERK_EFFECT: "Là một [character_interaction|E], giải tán một phe cánh ngẫu nhiên đang nhắm vào bạn.\n#F Nói ra một lời khiến người khác tràn ngập niềm hoan lạc và khó lòng gây hại cho bạn hơn.#!"
 BOON_OF_ANUBIS_PERK_EFFECT: "Là một [character_interaction|E], trao cho mục tiêu bổ trợ [GetModifier('boon_of_anubis_perk_modifier').GetNameWithTooltip].\n#F Đảm bảo rằng một người phàm không thể bị Trao truyền và sẽ sống sót qua nỗ lực đó.#!"
 BRING_FORTH_THE_DAWN_PERK_EFFECT: "#F Buộc ma cà rồng phải ngủ như thể đang là ban ngày.#!"
 MUMMIFICATION_RITUAL_PERK_EFFECT: "Là một [character_interaction|E], cho phép khiến mục tiêu rơi vào $pod_torpor$.\n#F Đưa một Bộc huyết hoặc Hậu Duệ Cain vào $pod_torpor$ kéo dài.#!"
