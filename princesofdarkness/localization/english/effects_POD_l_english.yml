 #Grave's Decay Path

 NECROMANCY_ASHES_TO_ASHES_PERK_EFFECT: "Giảm rủi ro [masquerade_exposure_with_icon|E] và cải thiện [character_interaction|E] Che Đậy Masquerade."
 NECROMANCY_ASHES_TO_ASHES_PERK_FLAVOR: "#flavor Trong khi một số Cainite tàn sát bừa bãi và không sợ hậu quả cho hành động của mình, các Cainite khác lại cảm thấy cần phải kín đáo hơn một chút. Dùng năng lực này biến một xác người phàm thành một đống tàn tro không có gì nổi bật, nặng khoảng một phần năm trọng lượng cơ thể ban đầu.#!"
 RIGOR_MORTIS_PERK_FLAVOR: "#flavor Với năng lực này, nhà gọi hồn có thể khiến mục tiêu bất kỳ trở nên cứng đờ và bất động như một xác chết.#!"
