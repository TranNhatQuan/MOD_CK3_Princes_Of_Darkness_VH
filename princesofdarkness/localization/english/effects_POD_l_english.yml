 PATRIS_NOT_PRIMARY_TEXT: "@warning_icon!#X Sophia Patris là con đường chính của các hội dòng thường dân, hãy hoàn tất con đường chính của hội dòng bạn hoặc tìm được Đức Tin Chân Chính để mở khóa nó.#!"
 FILIUS_NOT_PRIMARY_TEXT: "@warning_icon!#X Sedulitas Filius là con đường chính của các hội dòng hiệp sĩ, hãy hoàn tất con đường chính của hội dòng bạn hoặc tìm được Đức Tin Chân Chính để mở khóa nó.#!"
 SPIRITUS_NOT_PRIMARY_TEXT: "@warning_icon!#X Boni Spiritus là con đường chính của các hội dòng tu viện, hãy hoàn tất con đường chính của hội dòng bạn hoặc tìm được Đức Tin Chân Chính để mở khóa nó.#!"
 SHADOW_INQUISITION_ONLY_TEXT: "@warning_icon!#X Holy Arts chỉ được phát triển và sử dụng riêng bởi các đặc vụ của Shadow Inquisition.#!"
 
 DOMINUS_VOBISCUM_PERK_EFFECT: "Là một [character_interaction|E], bạn có thể ban phước cho một nhân vật khác để tăng chỉ số tạm thời.\n#F Hình thức mà một phước lành mang lại có thể khác nhau và kết quả thường bất thường và nhỏ nhặt. Nhưng đôi khi chúng đủ để tạo ra khác biệt.#!"
 INTERCESSION_PERK_EFFECT: "Là một [character_interaction|E], bạn có thể trao mộ đạo cho một nhân vật khác với một cơ hội nhỏ để trao cho họ đặc điểm Đức Tin Chân Chính.\n#F Người Được Thánh Sủng có thể trừng phạt kẻ ác chỉ bằng sự hiện diện của mình, nhưng họ cũng có thể truyền cảm hứng cho những kẻ bị chà đạp về tinh thần để trở nên tốt hơn.#!"
 HOLY_BULWARK_PERK_EFFECT: "Bạn giờ đây miễn nhiễm với mọi loại năng lực tác động tâm trí.\n#F Người Mộ Đạo kiên định trong tâm trí mình. Nàng miễn nhiễm với hiệu ứng của Chimerstry, Dementation, Dominate, Obfuscate, và bất kỳ năng lực siêu nhiên nào khác gây rối loạn hoặc cố thay đổi tâm trí.#!"
 LAY_OF_HANDS_PERK_EFFECT: "Là một [character_interaction|E]. cho phép chữa lành thương tích và các đặc điểm tâm lý tiêu cực.\n#F Đặt tay lên, cầu nguyện hoặc dùng các phương pháp khác lạ hơn đều đem lại kết quả tương tự. Chính Đức Tin thuần túy của kẻ tin thật sự khiến vết thương lành lại như thể chúng chưa từng tồn tại.#!"
 PENANCE_PERK_EFFECT: "Là một [character_interaction|E], bạn có thể nguyền rủa một quái vật, làm giảm chỉ số của chúng.\n#F Sự hiện diện của Người Mộ Đạo khiến quái vật siêu nhiên cảm thấy đau đớn. Đối diện với phần còn lại của điểm yếu đạo đức của chúng khiến chúng bị đốt cháy từ bên trong.#!"
 CONVERSION_PERK_EFFECT: "Là một [decision|E], bạn có thể ngay lập tức cải đạo vương quốc của mình sang tôn giáo của bạn, với một cái giá mộ đạo đắt đỏ.\n#F Trong một biểu hiện chói lòa của ánh sáng nội tâm, Người Mộ Đạo là một ngọn hải đăng sống, đang hít thở của những gì nàng tin là đúng đắn và tốt lành.#!"
 MIRACLE_OF_FAITH_PERK_EFFECT: "Là một [character_interaction|E], cho phép biến một ma cà rồng trở lại phàm nhân hoặc đạt được Golconda.\nMở khóa [crafting_node|E] thêm [GetModifier('bless_modifier').GetNameWithTooltip] cùng với [modifier|E] dựa trên loại [artifact|E].\n#F Người Mộ Đạo ban phước cho một biểu tượng thánh, truyền vào đó một phần đức tin của mình.\nSức mạnh niềm tin sâu sắc của Người Mộ Đạo khiến người khác phải suy xét lại con đường đời của họ.#!"
 MIRACLE_OF_DEVOTION_PERK_EFFECT: "Có thể tuyển mộ [GetMaA('minion_of_the_divine').GetName] làm [men_at_arms|E].\n#F Được truyền cảm hứng khi theo bước kẻ được ban phước, cừu non chiến đấu như sư tử và người chiến đấu như ác quỷ.#!"
 MIRACLE_OF_TRANQUILITY_PERK_EFFECT: "Mở khóa công trình đặc biệt [GetBuilding('sanctified_area_01').GetName].\nLà một [character_interaction|E], cho phép giải quyết mọi [Fetter|E] của một oan hồn.\n#F Ban phước cho một khu vực nhỏ bằng sức mạnh niềm tin của mình, Người Mộ Đạo khiến sinh vật hoặc linh hồn thù địch khó lòng xâm nhập hơn.#!"
 MIRACLE_OF_PROTECTION_PERK_EFFECT: "Là một [character_interaction|E], cho phép [POD_banish|E] một oan hồn/ác quỷ/tiên tộc.\nBạn không còn có thể bị $POD_splat_wraith_plural$ nhập vào.\nCó được miễn nhiễm với cơn mê loạn.\n#F Người Mộ Đạo có khả năng đẩy lùi ma cà rồng, kẻ chết, và các sinh vật khác sống nhờ hoặc trong bóng tối của thế giới bằng sức mạnh của ánh sáng nội tâm. Nàng có thể sử dụng lời cầu nguyện, biểu tượng thánh, hoặc chỉ đơn thuần là sự mãnh liệt trong sự hiện diện của mình để đẩy lùi và xua đuổi chúng.#!"
 SHIELD_OF_FAITH_PERK_EFFECT: "#F Sự hiện diện của những kẻ Mộ Đạo thực sự bảo vệ những ai theo họ, dù là khỏi tổn hại tinh thần hay thể xác.#!"
 
 PRY_OPEN_PERK_EFFECT: "#F Chứng kiến suy nghĩ và khao khát của mục tiêu. Giúp xây dựng một mối liên kết.#!"
 UNWAVERING_VISION_PERK_EFFECT: "Là một [character_interaction|E], cho phép trao [GetModifier( 'POD_ha_disrupted_contacts_modifier' ).GetNameWithTooltip|L] lên các vương quốc địch.\n#F Phát hiện các đầu mối liên lạc của mục tiêu giữa những người phàm, cho phép bạn làm suy yếu ảnh hưởng của họ.#!"
 UNEARTH_PERK_EFFECT: "Nhiều khả năng hơn để [imprison|E] [characters|E] sau một [siege|E] hoặc [raid|E] thành công.\n#F Hé lộ những sự kiện đã xảy ra tại một địa điểm; hữu ích để truy tìm mục tiêu đang chạy trốn.#!"
 LIFTING_THE_VEIL_PERK_EFFECT: "Là một [character_interaction|E], cho phép trao [GetModifier( 'tracked_down_modifier' ).GetNameWithTooltip|L] cho mục tiêu bị giam giữ, cho phép bạn hoàn tất ngay [journey|E] Tìm Sào Huyệt trên lãnh chủ của họ ngay khi họ được thả.\n#F Khiến mọi nỗ lực lừa dối của mục tiêu trở nên vô ích, dẫn đến một cuộc thẩm vấn hiệu quả.#!"
 REVELATION_PERK_EFFECT: "Là một [character_interaction|E], cho phép khiến mục tiêu bị gán [factions|E] Xà Ngục Dị Giáo.\n#F Phơi bày bản chất xấu xa của mục tiêu trước Đàn Chiên và để nó chịu sự phán xét của họ.#!"
 
 SUNDER_PERK_EFFECT: "Là một [character_interaction|E], cho phép trao [GetModifier( 'endo_holyweapon_modifier' ).GetNameWithTooltip|L] cho mục tiêu.\n#F Năng lực này ban cho một vũ khí một nguồn năng lượng riêng, cho phép nó đánh trúng bất cứ thứ gì nó chạm vào bằng sự báo thù thần thánh.#!"
 CENSURE_PERK_EFFECT: "#F Nhờ năng lực này, quan tòa dị giáo có thể khiến một sinh vật rơi vào một sai lầm ngu ngốc bằng cách chế giễu nó dưới danh nghĩa của mọi điều thánh thiện.#!"
 GODS_ARMOUR_PERK_EFFECT: "Nhiều khả năng hơn để hồi phục từ thương tích, và ít khả năng hơn để nhận thương tích trong [journey|E] Tìm Sào Huyệt.\n#F Thiên phú này cải thiện đáng kể khả năng hồi phục từ vết thương trong chiến đấu.#!"
 ROD_AND_STAFF_PERK_EFFECT: "Là một [character_interaction|E], cho phép khiến [knights|E] của bạn không thể chịu thương tích nhưng khiến bạn dễ chịu thương tích hơn trong [combat_phase|E] với vai trò [commander|E].\n#F Vận dụng năng lực này, quan tòa dị giáo trở thành một tường thành thánh thiện chống lại các thế lực của cái ác, ngăn ngừa tổn hại đến với những ai theo sau mình, chỉ khi ông ta còn đứng vững.#!"
 WRATH_OF_GOD_PERK_EFFECT: "Là một [character_interaction|E], cho phép gây thương tích hoặc giết chết nhân vật mục tiêu.\n#F Quan tòa dị giáo triệu hồi công lý của Chúa dưới hình thức trực tiếp và bạo liệt nhất.#!"
 
 TEARS_OF_THE_MARTYR_PERK_EFFECT: "Mở khóa một lựa chọn sự kiện khi một nhân vật quyền lực cố chống lại việc bị bỏ tù.\n#F Ánh mắt sùng đạo của quan tòa dị giáo trở thành một tấm gương soi vào tâm hồn của bất kỳ ai nhìn vào nó, gây ra hối hận và nghi ngờ tê liệt trong những kẻ nô lệ của tội lỗi.#!"
 TOUCH_OF_PEACE_PERK_EFFECT: "Là một [character_interaction|E]. cho phép chữa lành các đặc điểm căng thẳng.\n#F Cái chạm thánh thiện của quan tòa dị giáo có thể chữa lành mọi bệnh tật của tâm hồn.#!"
 AURA_OF_SANCTITY_PERK_EFFECT: "Gây thương tích cho [knights|E] địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho đối thủ của bạn trong [single_combat_duel_plural|E], nếu họ là siêu nhiên.\n#F Thầy pháp thần học tập trung đức tin của mình thành một luồng năng lượng thánh thiện gây tổn hại lên những sinh vật bất khiết mà nàng gặp trong chiến đấu.#!"
 RESTORATION_PERK_EFFECT: "Là một [character_interaction|E]. cho phép chữa lành thương tích và các đặc điểm tâm lý tiêu cực. Nếu bạn đã có thể làm vậy từ một nguồn khác, giảm chi phí thay vào đó.\n#F Quan tòa dị giáo đã đạt được một sự gắn kết đặc biệt với phép màu chữa lành, nàng có thể đặt tay lên những người bạn đồng hành đang đau yếu thường xuyên hơn và với chi phí thấp hơn.#!"
 JUDGEMENT_OF_HEAVEN_PERK_EFFECT: "Là một [character_interaction|E], cho phép [imprison|E] mục tiêu.\n#F Quan tòa dị giáo có thể giam giữ một sinh vật siêu nhiên vào cõi trần, nơi nó không thể thoát khỏi sự phán xét cuối cùng của nó.#!"

 # Abombwe #

 PREDATORS_COMMUNION_PERK_EFFECT: "Ma Cà Rồng là kẻ săn mồi lớn nhất trong lãnh địa của mình và cảm nhận được bất cứ khi nào có một đồng minh hoặc kẻ địch tiềm năng ở gần"
 INVOKING_THE_PREDATOR_PERK_EFFECT: "Nhào nặn bóng tối dễ uốn nắn bên trong và đẩy nó ra ngoài để sao chép các đặc điểm của những loài vật săn mồi."
 TAMING_THE_BEAST_PERK_EFFECT: "$countermeasures_unlocks_t1_supernatural_high_alert$\n#flavor Khai thác Dã Thú để biến sức mạnh của cơn Phẫn Cuồng thành một công cụ, cải thiện sức mạnh thể chất của bạn theo nhiều cách trong khi chấp nhận rủi ro một cơn Phẫn Cuồng toàn diện.#!"
 UNSEEN_HIBERNATION_PERK_EFFECT: "Ma Cà Rồng làm sào huyệt của mình bên trong các cấu tạo tự nhiên, cây cỏ, hoặc đất đá bằng cách tan biến vào bóng tối ẩn giấu dưới bề mặt của chúng."
 WHISTLING_UP_THE_BEAST_PERK_EFFECT: "Sử dụng sự tinh thông của bạn với Dã Thú để lôi kéo Dã Thú của người khác (hoặc của chính mình) ra bề mặt."
 POWER_FROM_DARKNESS_PERK_EFFECT: "Người phàm và sinh vật siêu nhiên đều run rẩy trong sợ hãi khi nghe tiếng gầm của một ma cà rồng có năng lực này."
 PREDATORS_TRANSFORMATION_PERK_EFFECT: "Mang lấy hình dạng của loài vật săn mồi bằng cách sử dụng [character_interaction|E] Biến Hình"
 STALKING_DARKNESS_PERK_EFFECT: "Một ma cà rồng đã tinh thông Abombwe là một kẻ săn mồi trọn vẹn, rình rập kẻ địch của mình xuyên qua bóng tối."
 PREDATORS_MASTERY_PERK_EFFECT: "Sử dụng Dã Thú của bạn để khống chế các loài dã thú khác; bất kể tự nhiên hay siêu nhiên, thú vật hay con người."
 INCARNATE_DARKNESS_PERK_EFFECT: "Mở khóa hình dạng Bóng Tối Hiện Thân.\n#flavor Trở thành một khối bóng tối, quằn quại và xoay chuyển khi nó cố bắt chước những loài săn mồi mà con người chưa từng biết đến.#!"
 
 # Gift #


 
 
 
 UMBRAL_MAP_PERK_EFFECT: ""
 DANCE_OF_ABANDON_PERK_EFFECT: "Là một [character_interaction|E], cho phép khiến mục tiêu từ bỏ một âm mưu hoặc thậm chí một cuộc chiến."
 SHADOW_WALK_PERK_EFFECT: ""
 TRICKSTERS_SKIN_PERK_EFFECT: "Mở khóa một [character_interaction|E] để sao chép hoặc trao đổi diện mạo của ai đó."
 COYOTES_MASK_PERK_EFFECT: "Là một [character_interaction|E], cho phép trao [GetModifier( 'extra_life_1_modifier' ).GetNameWithTooltip|L] cho chính bạn."
 UMBRAL_TARGET_PERK_EFFECT: "Là một [character_interaction|E], cho phép gửi mục tiêu đến những địa điểm Umbra sâu và nguy hiểm nhất."
 COYOTES_HOWL_PERK_EFFECT: "Là một [character_interaction|E], cho phép gây tổn hại cho mọi hiệp sĩ của mục tiêu.\nÁp đặt lên mọi lãnh chủ phía đối phương [GetModifier('coyotes_howl_perk_modifier').GetNameWithTooltip] khi tham gia một [war|E].\n#F Cũng như Coyote là Đấng Sáng Tạo, hắn cũng là Đấng Hủy Diệt. Đến thời điểm của mình, hắn sẽ xóa sạch mọi thứ đang tồn tại, vì đó là bổn phận của hắn. Tiếng Gào của Coyote cho phép Nuwisha triệu tập một phần nhỏ sức mạnh hủy diệt của Coyote và giải phóng năng lượng đó lên một người hoặc một khu vực. Khi được sử dụng, Tiếng Gào của Coyote làm rung chuyển toàn bộ tự nhiên và bẻ cong nó thành một cỗ máy của sự diệt vong. Năng lực này có thể xuất hiện dưới dạng một cơn lốc xoáy hoặc một cơn sóng thần. Nó có thể là một trận động đất hoặc một cơn bão sấm sét. Dù trong trường hợp nào, rất ít thứ có thể chống lại sức mạnh của Tiếng Gào của Coyote. Gift này là một trong những Gift mạnh nhất mà Nuwisha biết đến, và được Coyote truyền dạy cho những ai hắn thấy xứng đáng.#!"
 COYOTES_HOWL_REQUIREMENT: "@warning_icon!#X Bạn cần hoàn thành một nhiệm vụ từ Coyote (đóng quân một nhà thám hiểm tại bất kỳ cõi giới umbra nào để tìm ra manh mối về vị trí và bắt đầu một [umbra_expedition|E] để đến nơi đó rồi nhận nhiệm vụ) để mở khóa thiên phú này.#!"
 
 HATHORS_BLESSING_PERK_EFFECT: "Là một [character_interaction|E], cho phép trao [GetModifier( 'hathors_blessing_perk_modifier' ).GetNameWithTooltip|L] cho mục tiêu."
 MERCY_FOR_THE_MISBEGOTTEN_PERK_EFFECT: "Là một [character_interaction|E], cho phép trao [GetModifier( 'mercy_for_the_misbegotten_perk_modifier' ).GetNameWithTooltip|L] cho mục tiêu, và cũng loại bỏ [GetTrait('eunuch').GetName( GetPlayer )] cùng [GetTrait('infertile').GetName( GetPlayer )] khỏi họ."
 
 BATS_SHRIEK_PERK_EFFECT: "Trao [GetModifier('bats_shriek_perk_modifier').GetNameWithTooltip] [modifier|E] cho [knights|E] địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho đối thủ của bạn trong [single_combat_duel_plural|E]."
 BLINDING_SPITTLE_PERK_EFFECT: "Trao [GetModifier('blinding_spittle_perk_modifier').GetNameWithTooltip] [modifier|E] cho [knights|E] địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho đối thủ của bạn trong [single_combat_duel_plural|E]."
 THOUSAND_WINGS_FORM_PERK_EFFECT: ""
 READING_THE_DARK_HEART_PERK_EFFECT: "Là một [character_interaction|E], cho phép biết mọi bí mật và âm mưu của mục tiêu."
 
 TAINT_EVAPORATION_PERK_EFFECT: "Gây thương tích cho [knights|E] và [commanders|E] địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho đối thủ của bạn trong [single_combat_duel_plural|E], nếu họ đang phụng sự $glossary_wyrm$."
 
 # Meritocracy #
 
 MERITOCRACY_LEGACY_1_PERK_EFFECT: "Mọi Inquisitor mới sẽ có [GetTrait('strong').GetName( GetPlayer )] và [GetTrait('athletic').GetName( GetPlayer )].\n#F Mens sana in corpore sano.#!"
 MERITOCRACY_LEGACY_2_PERK_EFFECT: "Mọi Inquisitor mới sẽ trở thành một Blademaster hoặc Hunter tốt hơn.\n#F Si vis pacem, para bellum.#!"
 MERITOCRACY_LEGACY_3_PERK_EFFECT: "Mọi Inquisitor mới sẽ có chất lượng Học Vấn tăng thêm 1.\n#F Scientia potentia est.#!"
 MERITOCRACY_LEGACY_4_PERK_EFFECT: "Mọi Inquisitor mới sẽ có tỷ lệ xuất hiện hoặc chất lượng cao hơn của các Đặc Điểm Bẩm Sinh tích cực.\n#F Genuflectant omnes in plano.#!"
