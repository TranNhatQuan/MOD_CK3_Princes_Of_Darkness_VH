 #Ventrue legacy #
 
 VENTRUE_LEGACY_1_PERK_EFFECT: "mở khóa một [character_interaction|E] đặc biệt để trao đổi hook với các Ventrue khác.\n#F Camilla đã xây dựng Đế Chế vĩ đại nhất mà thế giới $pod_cainite$ từng biết đến hoặc sẽ từng biết đến. $pod_clan$ Ventrue thực sự bắt đầu từ hắn.#!"
 VENTRUE_LEGACY_2_PERK_EFFECT: "Mở khóa một đặc điểm chỉ huy đặc biệt cho mọi thành viên triều đại có học vấn quân sự.\n#F Nữ Thần Sparta đã xông lên can đảm chống lại nỗi kinh hoàng của Carthage. $pod_clan$ Ventrue sẽ luôn tôn vinh sự hy sinh của bà.#!"
 VENTRUE_LEGACY_3_PERK_EFFECT: "Mở khóa một [character_interaction|E] đặc biệt để thực thi [the_masquerade|E].\n#F Cái chết ngu ngốc của Medon đã dạy cho Ventrue một bài học đáng giá. Đừng đánh giá thấp người phàm.#!"
 VENTRUE_LEGACY_4_PERK_EFFECT: "#F Nhà thám hiểm chẳng bao giờ thực sự thỏa mãn vì thế giới cũng vô tận như nỗi khát khao lang bạt của bà.#!"
 VENTRUE_LEGACY_5_PERK_EFFECT: "Quyết định Tổ Chức Gia Tộc Vì Chiến Tranh cho Đoàn Kết Gia Tộc giờ đây còn trao thêm một bổ trợ khác.\n#F Vị tướng Ba Tư đã thăng hoa thành thần khi nghe thấy âm vang của những kỵ binh giáp sắt.#!"
 
 #Setite legacy #
 
 SETITE_LEGACY_1_PERK_EFFECT: "$SNAKES_LEGACY_PERK_UNLOCK_DESC$\n#F Người con trai đầu, kẻ tận tâm nhất, là một hình mẫu cho mọi Setite.#!"
 SETITE_LEGACY_2_PERK_EFFECT: "Mở khóa [scheme|E] [GetScheme('befriend').GetTypeName].\n#F Không có gì xấu hổ khi ăn trái cấm trong một sự đồng hành tốt đẹp.#!"
 SETITE_LEGACY_3_PERK_EFFECT: "#F Luôn có sự cứu chuộc trong lòng Set, ngay cả với 'Kindred' bướng bỉnh nhất.#!"
 SETITE_LEGACY_4_PERK_EFFECT: "Mở khóa công trình đặc biệt [GetBuilding('founding_temple_01').GetName].\n#F Hãy đắm mình trong vinh quang của Ngài và cầu nguyện, vì Ngài sẽ trở lại để cứu rỗi tất cả chúng ta.#!"
 SETITE_LEGACY_5_PERK_EFFECT: "#F Người con gái đã mất, kẻ bị nguyền rủa, Đại Kẻ Thù... nàng sẽ phải đối mặt với sự báo thù.#!"
 
 #Baali legacy #
 
 BAALI_LEGACY_1_PERK_EFFECT: "#F Và ta nhìn thấy, kìa một con ngựa nhạt màu: và kẻ ngồi trên nó có tên là Chết, và Địa Ngục theo sau hắn.#!"
 BAALI_LEGACY_2_PERK_EFFECT: "#F Và ta thấy khi con chiên mở một trong các dấu ấn, và ta nghe, như tiếng sấm rền, một trong bốn con thú nói, Hãy đến và xem.#!"
 BAALI_LEGACY_3_PERK_EFFECT: "#F Và ta thấy, kìa một con ngựa đen; và kẻ ngồi trên nó cầm một cái cân trong tay.#!"
 BAALI_LEGACY_4_PERK_EFFECT: "#F Và ta thấy, kìa một con ngựa trắng: và kẻ ngồi trên nó cầm một cây cung; và một chiếc vương miện được trao cho hắn; và hắn tiến ra chinh phục và để chinh phục.#!"
 BAALI_LEGACY_5_PERK_EFFECT: "#F Và có một con ngựa khác đi ra, màu đỏ: và quyền năng được trao cho kẻ ngồi trên nó để cướp lấy hòa bình từ mặt đất, và để chúng giết lẫn nhau: và một cây kiếm lớn được trao cho hắn.#!"
 
 #Gangrel legacy #
 
 GANGREL_LEGACY_1_PERK_EFFECT: "#F Đấng Toàn Phụ dõi theo, đầy tự hào, khi những đứa con của mình đối mặt với Ragnarok bằng can đảm và danh dự.#!"
 GANGREL_LEGACY_2_PERK_EFFECT: "Mở khóa một đặc điểm chỉ huy đặc biệt cho mọi thành viên triều đại có học vấn quân sự.\n#F Ta cưỡi cùng hàng triệu người! Ta là Cơn Thịnh Nộ của Chúa! Và ta sẽ nhìn thế giới của các ngươi... bốc cháy.#!"
 GANGREL_LEGACY_3_PERK_EFFECT: "#F Hukros đã tìm ra sự thật về Người Mẹ Bóng Tối từ lâu. Các môn đồ của hắn đã truyền bá nó rộng rãi từ đó đến nay.#!"
 GANGREL_LEGACY_4_PERK_EFFECT: "Mở khóa một [character_interaction|E] đặc biệt lên các Gangrel khác (trừ gia đình gần gũi của bạn) để thực hiện Nghi Thức Địa Vị, mở ra cơ hội để làm sâu sắc thêm mối gắn kết của bạn.\n#F Và hắn đã khóc, vì chẳng còn thế giới nào để chinh phục nữa.#!"
 GANGREL_LEGACY_5_PERK_EFFECT: "#F Con thú bị dồn vào góc bảo vệ đàn của mình, và phản kích với cơn thịnh nộ và một mục đích bất diệt.#!"
 
   #Ravnos legacy #
 
 RAVNOS_LEGACY_1_PERK_EFFECT: "#F Người mẹ hiền của người Rroma bảo vệ dân tộc mình và cho họ mục đích sống.#!"
 RAVNOS_LEGACY_2_PERK_EFFECT: "Mở khóa một đặc điểm chỉ huy đặc biệt cho mọi thành viên triều đại có học vấn quân sự.\n#F Một cuộc chiến vĩnh cửu cần một vị tướng vĩnh cửu. Chandraputra chính là người đó.#!"
 RAVNOS_LEGACY_3_PERK_EFFECT: "Mở khóa [character_interaction|E] đặc biệt để thực hiện một nghi thức nhằm đạt được sự thông tuệ.\n#F Rakshasa của các Rakshasa đã cắt bỏ mắt mình để cuối cùng nhìn thấy.#!"
 RAVNOS_LEGACY_4_PERK_EFFECT: "#F Nếu bạn sống ở Ai Cập, hãy hành xử như một người Ai Cập.#!"
 RAVNOS_LEGACY_5_PERK_EFFECT: "#F Kẻ bị nguyền rủa, con quái vật, con quỷ... nỗi khiếp sợ trong mỗi trái tim không còn đập của người Ravnos.#!"
 
  #Cappadocian legacy #
 
 CAPPADOCIAN_LEGACY_1_PERK_EFFECT: "Mở khóa một [character_interaction|E] đặc biệt để gửi childer của bạn làm cố vấn cho các lãnh chủ khác. Bạn có thể học thêm một ngôn ngữ trước khi đạt đến giới hạn.\n#F Người con trai mộ đạo che giấu nỗi sợ của mình nhưng chuẩn bị cho điều tồi tệ nhất sắp đến.#!"
 CAPPADOCIAN_LEGACY_2_PERK_EFFECT: "Mở khóa một chuỗi sự kiện để thuê một cận vệ Lamia.\n#F Người Mẹ Bóng Tối giấu những bí mật mà chỉ các con gái của bà mới có thể thực sự hiểu được.#!"
 CAPPADOCIAN_LEGACY_3_PERK_EFFECT: "#F Nhánh cai trị Cappadocian bị ruồng bỏ và lãng quên sẽ một ngày nào đó đeo mặt nạ.#!"
 CAPPADOCIAN_LEGACY_4_PERK_EFFECT: "#F Byzantium đã là một thành phố của những giấc mơ từ lâu trước khi Constantine đặt chân đến đó.#!"
 CAPPADOCIAN_LEGACY_5_PERK_EFFECT: "#F Người con trai phản bội biết sự thật, và đoàn kết gia tộc chống lại hắn với một mục đích.#!"
 
  #Brujah legacy #
 
 BRUJAH_LEGACY_1_PERK_EFFECT: "#F Vua Sparta lãnh cảm như mũi giáo lạnh lẽo của mình. Trừ khi có liên quan đến một người Troia đặc biệt.#!"
 BRUJAH_LEGACY_2_PERK_EFFECT: "Mở khóa một đặc điểm chỉ huy đặc biệt cho mọi thành viên triều đại có học vấn quân sự.\n#F Hắn đã gần như cứu được Carthage khỏi diệt vong. Người Brujah tưởng nhớ chiến thắng của hắn, và than khóc cho thất bại của hắn.#!"
 BRUJAH_LEGACY_3_PERK_EFFECT: "Mở khóa một vị trí triều đình mới, Brujah Warmaster, dành cho công tước và cao hơn.\n#F Kẻ ngoài vòng pháp luật cao thượng sẽ đánh bại bạo chủ và vua chúa bằng kiếm, cung và trí tuệ.#!"
 BRUJAH_LEGACY_4_PERK_EFFECT: "#F Để thực sự hiểu được hệ thống hành chính Byzantine, có vẻ như bạn cần một công chúa Nga.#!"
 BRUJAH_LEGACY_5_PERK_EFFECT: "#F Kẻ phản bội đầu tiên đã chiến đấu hết mình cho vùng đất lý tưởng của mình nhưng Carthage đã sụp đổ từ lâu trước khi người La Mã đến.#!"
 
 
  #Tremere legacy #
 
 TREMERE_LEGACY_1_PERK_EFFECT: "Mở khóa [character_interaction|E] nghi thức để tạo ra nhân vật Gargoyle.\n#F Khi bạn chiến đấu vì sự sống còn của mình, sự hy sinh phải được thực hiện. Rất nhiều sự hy sinh.#!"
 TREMERE_LEGACY_2_PERK_EFFECT: "#F Người phụ nữ duy nhất giành được sự tôn trọng của Tremere chính là nền tảng của Kim Tự Tháp.#!"
 TREMERE_LEGACY_3_PERK_EFFECT: "#F Trong Kim Tự Tháp, ai cũng có một mục đích và một vị trí. Bên dưới những kẻ giỏi hơn ngươi.#!"
 TREMERE_LEGACY_4_PERK_EFFECT: "#F Bà yêu những tạo vật của mình và chúng yêu bà đáp lại. Kim Tự Tháp sẽ sớm rung chuyển.#!"
 TREMERE_LEGACY_5_PERK_EFFECT: "Bạn có thể học thêm một ngôn ngữ trước khi đạt đến giới hạn.\n#F Học vấn và sự thông tuệ là những phẩm chất thường bị lãng quên tạo nên một pháp sư Tremere đích thực.#!"
 
  #Toreador legacy #
 
 TOREADOR_LEGACY_1_PERK_EFFECT: "#F Nghệ thuật và sự đồi bại là một đối với một số người.#!"
 TOREADOR_LEGACY_2_PERK_EFFECT: "#F Người phụ nữ Troia sẽ có được sự báo thù của mình, ngay cả nếu thế giới phải bốc cháy trước đó.#!"
 TOREADOR_LEGACY_3_PERK_EFFECT: "Quyết định Xoa Dịu Chư Hầu cho Đoàn Kết Gia Tộc giờ đây còn trao thêm một bổ trợ khác.\n#F Đại thiên thần đã mất trí và thế giới đã mất đi hy vọng cuối cùng. Thời Kỳ Đen Tối sẽ không bao giờ kết thúc.#!"
 TOREADOR_LEGACY_4_PERK_EFFECT: "$PERK_CAN_SIGN_ALLIANCE$\n#F Hãy cẩn thận với người phụ nữ bị khinh miệt, vì cơn thịnh nộ của bà sẽ không bao giờ dừng lại.#!"
 TOREADOR_LEGACY_5_PERK_EFFECT: "Mở khóa một bộ năm công trình "Được Bảo Trợ" đắt đỏ nhưng mạnh mẽ.\n#F Nghệ thuật và cái đẹp không phải là phương tiện, chúng là mục đích đáng để mọi sự hy sinh.#!"
 
 #Salubri legacy #
 
 SALUBRI_LEGACY_1_PERK_EFFECT: "#F Sự báo thù của bà là một cảnh tượng đáng khiếp sợ nhưng không ngọn lửa nào cháy mãi.#!"
 SALUBRI_LEGACY_2_PERK_EFFECT: "Mở khóa một đặc điểm chỉ huy đặc biệt cho mọi thành viên triều đại có học vấn quân sự.\n#F Lưỡi Kiếm của Salubri chưa từng biết đến thất bại, ngay cả trong cái chết.#!"
 SALUBRI_LEGACY_3_PERK_EFFECT: "Mở khóa hệ thống đẳng cấp cho triều đại của bạn.\nCác nhân vật thuộc House Rayzeel, Mokur, Hrorsh và Enosh có nhiều khả năng trở thành Kẻ Chữa Lành.\nCác nhân vật thuộc House Samiel và Twilight có nhiều khả năng trở thành Chiến Binh\nCác nhân vật thuộc House Watcher có nhiều khả năng trở thành Người Canh Giữ.\nHọc vấn cũng đóng một vai trò nhỏ.\n#F Bà sẽ ca hát khi thế giới bốc cháy quanh mình. Và có lẽ điều đó sẽ là đủ.#!"
 SALUBRI_LEGACY_4_PERK_EFFECT: "#F Người khôn ngoan là người chuẩn bị nơi trú ẩn khi chiến tranh đang đến gần.#!"
 SALUBRI_LEGACY_5_PERK_EFFECT: "Giảm 60% chi phí Thánh Chiến.\n#F Kẻ phản bội chưa từng đối mặt với công lý và đã có được tiếng cười cuối cùng. Một chiến thắng cay đắng cho một người đàn ông tan vỡ.#!"
 
 #Lasombra legacy#
 
 LASOMBRA_LEGACY_1_PERK_EFFECT: "#F Người con gái bị ruồng bỏ đang âm mưu báo thù. Chống lại bóng tối, nàng sẽ dùng đến ngọn lửa tối thượng.#!"
 LASOMBRA_LEGACY_2_PERK_EFFECT: "Mở khóa một đặc điểm chỉ huy đặc biệt cho mọi thành viên triều đại có học vấn quân sự.\n#F Cuộc Tái Chiếm Bóng Tối sẽ thành công, nhưng kẻ chiến thắng cuối cùng có thể không phải là kẻ hiển nhiên.#!"
 LASOMBRA_LEGACY_3_PERK_EFFECT: "#F Thật vậy, Đấng Từ Bi Nhất vượt qua cả cái chết.#!"
 LASOMBRA_LEGACY_4_PERK_EFFECT: "#F Mọi người Lasombra đều cảm nhận được tiếng gọi của biển cả, để thực sự trở thành một phần của bóng tối sâu nhất tồn tại ở tận đáy của tất cả.#!"
 LASOMBRA_LEGACY_5_PERK_EFFECT: "#F Constantinople đã có được sự báo thù cay đắng của mình khi Venice bốc cháy cùng nàng.#!"
 
  #Banu Haqim legacy#
 
 BANUHAQIM_LEGACY_1_PERK_EFFECT: "#F Ẩn giấu sau một lớp màn bí mật, người Banu Haqim bị khiếp sợ vượt xa ra ngoài biên giới Trung Đông của họ.#!"
 BANUHAQIM_LEGACY_2_PERK_EFFECT: "Mở khóa một đặc điểm chỉ huy đặc biệt cho mọi thành viên triều đại có học vấn quân sự.\n#F Kẻ Bất Khả Chiến Bại sẽ vươn tới những tầm cao mới. Ngay cả cái chết cũng không thể cướp đi danh dự của hắn.#!"
 BANUHAQIM_LEGACY_3_PERK_EFFECT: "#F Là Người Lớn Tuổi Nhất không có nghĩa gì nhiều nếu không có sự ủng hộ của đồng bối.#!"
 BANUHAQIM_LEGACY_4_PERK_EFFECT: "#F Kẻ phản bội người Carthage vẫn còn lang thang trong màn đêm, một nỗi hổ nhục cho mọi người Banu Haqim chân chính.#!"
 BANUHAQIM_LEGACY_5_PERK_EFFECT: "#F Người Mục Tử Đen sẽ thanh tẩy Trái Đất khỏi những kẻ không đáng. Đây là sự cứu rỗi duy nhất đến với thế giới bị đọa lạc này.#!"
 
  #Malkavian legacy#
 
 MALKAVIAN_LEGACY_1_PERK_EFFECT: "#F Các nhà tiên tri về diệt vong hiếm khi được chào đón, nhưng thường là đúng.#!"
 MALKAVIAN_LEGACY_2_PERK_EFFECT: "Mở khóa một [character_interaction|E] cá nhân đặc biệt để 'mượn tạm' kỹ năng.\n#F Vị Hoàng Tử Malkavian đích thực cuối cùng đã chiến đấu can đảm chống lại nỗi kinh hoàng của Carthage và giành được sự tôn trọng của tất cả.#!"
 MALKAVIAN_LEGACY_3_PERK_EFFECT: "Mở khóa một [character_interaction|E] đặc biệt để giảm khả năng chống âm mưu của một lãnh chủ khác nếu họ có bất kỳ triều thần Malkavian nào.\n#F Ta đang nói dối sao? Ngươi đang nói dối sao? CẢ THẾ GIỚI ĐANG NÓI DỐI SAO?!#!"
 MALKAVIAN_LEGACY_4_PERK_EFFECT: "#F Chỉ là một bữa tối đẹp đẽ, sang trọng, với những cái đầu của triều thần ta.#!"
 MALKAVIAN_LEGACY_5_PERK_EFFECT: "#F Bán linh hồn cho cái ác có tệ không khi ngươi vốn chẳng có linh hồn để mà bán từ đầu?#!"
 
  #Nosferatu legacy#
 
 NOSFERATU_LEGACY_1_PERK_EFFECT: "$PERK_CAN_SIGN_ALLIANCE$\n#F Con quái vật kiêu hãnh đứng vững trước nỗi kinh hoàng của màn đêm, nâng $pod_clan$ của mình lên những tầm cao lớn hơn.#!"
 NOSFERATU_LEGACY_2_PERK_EFFECT: "Mở khóa một đặc điểm chỉ huy đặc biệt cho mọi thành viên triều đại có học vấn quân sự.\n#F Những kẻ cổ xưa của Trung Đông không phải là đối thủ của kỹ năng đã được chứng minh và đức tin bất diệt của Tarique.#!"
 NOSFERATU_LEGACY_3_PERK_EFFECT: "#F Đan Mạch được tạo ra bởi và vì Absalon, và sẽ bị hủy diệt bởi hắn.#!"
 NOSFERATU_LEGACY_4_PERK_EFFECT: "Quyết định Tăng Cường Mạng Lưới Tình Báo cho Đoàn Kết Gia Tộc giờ đây sẽ trao bổ trợ của nó trong thời gian gấp đôi.\n#F Cơn thịnh nộ và sự căm ghét là những cố vấn tồi, nhưng là nhiên liệu tuyệt vời cho Dã Thú.#!"
 NOSFERATU_LEGACY_5_PERK_EFFECT: "#F Bà Nội Nhỏ Bé là niềm hy vọng duy nhất, đáng khiếp sợ, chống lại những nỗi kinh hoàng còn đáng sợ hơn.#!"

