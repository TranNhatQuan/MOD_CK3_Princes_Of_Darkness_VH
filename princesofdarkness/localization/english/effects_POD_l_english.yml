 # Celerity # 
 BLINK_PERK_EFFECT: "Mở khóa [character_interaction|E] để tăng mạnh tốc độ di chuyển của quân đội ngươi. Ở giai đoạn này, nó rất tốn kém.\n#flavor Ngươi giờ di chuyển nhanh đến mức, khi giao chiến với kẻ địch hay chạy trốn trong chớp mắt, một người quan sát không đề phòng gần như thấy ngươi dịch chuyển tức thời, chỉ còn một luồng gió là dấu hiệu ngươi đã đi qua.#!"
 CATS_GRACE_PERK_EFFECT: "#flavor Ngươi có được sự thăng bằng và khéo léo siêu nhiên, có thể đi lại và cả vượt qua những gờ đá và điểm tựa mảnh nhất.#!"
 DRAUGHT_OF_ELEGANCE_PERK_EFFECT: "Với vai trò lựa chọn [character_interaction|E] [Glossary('Draught','game_concept_blood_draught_desc')], ngươi có thể tặng cho ai đó sự nhanh nhẹn siêu nhiên của mình.\n#flavor Máu của ngươi trở nên bão hòa sức mạnh của Celerity, truyền một phần quyền năng của ngươi sang bất kỳ ai uống nó.#!"
 FLEETNESS_PERK_EFFECT: "$countermeasures_unlocks_t2_supernatural_high_alert$ \n #flavor Sự tinh thông Celerity của ngươi giờ cho phép ngươi di chuyển và phản ứng với tốc độ chóng mặt.#!"
 LIGHTNING_STRIKE_PERK_EFFECT: "[character_interaction|E] Chớp Dời không còn khiến ngươi nhận hiệu ứng [GetModifier('POD_drained_modifier').GetNameWithTooltip].\n#flavor Nhanh hơn mắt thường có thể theo kịp, ngươi có thể tấn công bằng tay không hay vũ khí cận chiến với tốc độ khiến đối thủ không thể phòng thủ hay né tránh.#!"
 RAPID_REFLEXES_PERK_EFFECT: "$countermeasures_unlocks_t1_supernatural_high_alert$ \n #flavor Dù thân xác vẫn không thể chống lại quy luật tự nhiên, ma cà rồng có năng lực này nhận thức sự kiện ngay lập tức và có thể phản ứng với sự nhanh nhẹn siêu nhân.#!"
 SPLIT_SECOND_PERK_EFFECT: "[character_interaction|E] Chớp Dời không còn gây căng thẳng cho ngươi.\n#flavor Hành động với tốc độ của nhận thức siêu tốc, những kẻ mai phục ngươi thấy con mồi của mình đã đứng sau lưng họ, và những lời thỉnh cầu được hoàn thành trước khi lời nói kịp thoát khỏi miệng người thỉnh cầu.#!"
 TRAVERSAL_PERK_EFFECT: "$countermeasures_unlocks_t3_supernatural_high_alert$ \n#flavor Với tốc độ mờ ảo, ngươi có thể chạy hoặc trèo trên bất kỳ bề mặt nào, bao gồm chạy lên tường và cả vượt qua môi trường chất lỏng.#!"
 PRECISION_PERK_EFFECT: "#F Bước vào trạng thái xuất thần nơi ngươi có thể vận hành với sự khéo léo tinh vi phi thường.#!"
 TIRELESS_TREAD_PERK_EFFECT: "#F Chạy với tốc độ 50 dặm mỗi giờ trong ít nhất tám giờ liền.#!"
 QUICKNESS_PERK_EFFECT: "Với vai trò [character_interaction|E], cho phép ngươi loại bỏ thời gian hồi của một quyết định.\nVới vai trò [character_interaction|E], cho phép ngươi loại bỏ thời gian hồi của một âm mưu.\n#F Tiêu hao thêm điểm máu để có thêm hành động, với giá phải trả là một cấp sát thương chí mạng không thể hấp thụ cho mỗi hành động#!"
 PHYSICAL_DEFIANCE_PERK_EFFECT: "#F Di chuyển nhanh đến mức thách thức trọng lực và giết chết người phàm ngay lập tức khi ngươi xuyên qua họ.#!"
 TIME_OUT_OF_TIME_PERK_EFFECT: "$countermeasures_unlocks_t4_supernatural_high_alert$ \n Với vai trò [character_interaction|E], cho phép ngươi tăng tiến độ âm mưu.\n#F Phản ứng ngay lập tức với bất cứ điều gì và hành động trước khi ai đó nhận ra ngươi đã làm gì.#!"
 BETWEEN_THE_TICKS_PERK_EFFECT: "Với vai trò [character_interaction|E], cho phép ngươi nhận hiệu ứng [GetModifier('POD_between_the_ticks_modifier').GetNameWithTooltip].\n#F Một ma cà rồng đạt tới cấp độ tinh thông này thực sự nhanh hơn mắt người có thể thấy được. Những ma cà rồng khác — thậm chí cả một số có Auspex — cũng khó nhận ra nàng. Những sinh vật khác dường như gần như tượng bất động, đóng băng trong thời gian khi nàng di chuyển quanh họ.#!"

 # Dominate # 

 COMPEL_PERK: "Mời tới [court|E] Tỷ lệ Chấp thuận: #P +10#!"
 RATIONALIZE_PERK_EFFECT: "Bằng cách dùng âm mưu [GetScheme('PODmesmerize').GetTypeName] lần thứ hai, ngươi có thể nâng cấp [weak_hook|E] của nó thành [perpetual_hook|E].\nBằng cách thuyết phục nạn nhân rằng anh ta hành động theo ý chí của chính mình, ngươi mở khóa một lệnh dominate mới - bắt đầu một âm mưu. Ngươi cũng có thể nhận thêm vàng khi dùng các lệnh dominate."
 CLOUD_MEMORY_PERK: "Cải thiện khả năng kiểm soát Masquerade của ngươi, giảm rủi ro bị phơi bày và tăng cơ hội che đậy nó trong những trường hợp cụ thể."
 MESMERIZE_PERK: "Ngươi mở khóa [scheme|E] [GetScheme('abduct').GetTypeName]. Ngoài ra, ngươi có được khả năng ra lệnh cho người khác theo nhiều cách khác nhau, mở ra âm mưu [GetScheme('PODmesmerize').GetTypeName]."
 THE_FORGETFUL_MIND_PERK: "Ngươi mở khóa một lựa chọn tốt hơn cho [character_interaction|E] che đậy masquerade. Nó cũng cho phép một [character_interaction|E] có thể dẫn đến việc tăng thiện cảm với mục tiêu."
 SUBMERGED_DIRECTIVE_PERK: "Các kiềm chế dominate của ngươi cũng kéo dài hơn, cho phép ngươi ra lệnh vào một ngày sau đó."
 MASS_MANIPULATION_PERK: "Có thể tuyển mộ [GetMaA('maniacs').GetName] làm [men_at_arms|E]."
 DEEP_MEMORIES_PERK: "Ngươi có thể thay đổi đặc điểm tính cách và xu hướng tính dục của ghoul và [POD_herd|E] của mình"  
 CONDITIONING_PERK: "Bằng cách dùng âm mưu [GetScheme('PODmesmerize').GetTypeName] lần thứ ba, ngươi có thể nâng cấp [perpetual_hook|E] của nó thành [strong_hook|E].\n#F Bằng cách khống chế một người nhiều lần và dùng lệnh để giảm ý chí tự do, ma cà rồng cuối cùng có thể biến họ thành một nô bộc lý tưởng.#!"
 WILL_CONQUERS_PERK: "Các lệnh dominate của ngươi trở nên khó chống lại hơn nhiều."
 TERMINAL_DECREE_PERK: "Thêm một lệnh dominate mới: Ép Tự Sát."
 REWRITE_PERSONALITY_PERK: "Ngươi có thể thay đổi tính cách và xu hướng tính dục của những nhân vật ngươi đã dùng [scheme|E] [GetScheme('PODmesmerize').GetTypeName] lên"
 CONCORD_OF_SUBMISSION_PERK: "Thêm lựa chọn dominate: Ngừng Chiến Tranh - buộc mục tiêu phải ngừng thù địch với người dùng phép trong hòa bình trắng."
 MOLD_HUMOURS_PERK: "Mở khóa khả năng thay đổi loại resonance của [POD_herd|E] của ngươi"
 SPEAK_THROUGH_THE_BLOOD_PERK: "Ban ra một lệnh sẽ vọng qua dòng máu của ngươi, ảnh hưởng đến từng và mọi hậu duệ của ngươi và buộc họ phải hành động."
 PASSION_PERK: "Mở khóa khả năng thay đổi cường độ resonance của [POD_herd|E] của ngươi"
 
 # Fortitude # 

 DEFY_BANE_PERK_EFFECT: ""$countermeasures_unlocks_t2_supernatural_high_alert$ \n #flavor Bằng cách chuẩn bị bản thân với một sự tiêu hao quyền năng, ma cà rồng có thể khiến mình tạm thời kháng lửa và ánh nắng cũng như những vết thương nghiêm trọng khác có thể đe dọa họ bằng Tử Vong Vĩnh Viễn. Khi dùng Toughness, ma cà rồng miễn nhiễm với tàn tật trong các trận chiến lớn.#!"
 DRAUGHT_OF_ENDURANCE_PERK_EFFECT: "Với vai trò lựa chọn [character_interaction|E] [Glossary('Draught','game_concept_blood_draught_desc')], ngươi có thể trao sự bền bỉ siêu nhiên của mình cho ai đó.\n#flavor Máu của ngươi trở nên bão hòa sức mạnh của Fortitude, truyền một phần quyền năng của ngươi sang bất kỳ ai uống nó.#!"
 FLESH_OF_MARBLE_PERK_EFFECT: "$countermeasures_unlocks_t3_supernatural_high_alert$ \n#flavor Quyền năng của Huyết khiến làn da ma cà rồng cứng lại, mang một vẻ bóng như đá cẩm thạch nhưng vẫn mềm dẻo, chặn được hầu hết mọi đòn đánh trước khi tạm thời vỡ ra và tái tạo lại.#!"
 FORTIFY_THE_INNER_FACADE_PERK_EFFECT: "$countermeasures_unlocks_t2_mental_fortress$ \n#flavor Thay vì làm cứng thân xác ma cà rồng, năng lực này cho phép người dùng bảo vệ suy nghĩ và cảm xúc của mình khỏi sự dò xét siêu nhiên.#!"
 PROWESS_FROM_PAIN_PERK_EFFECT: "Mở khóa một [character_interaction|E] Fortitude mới.\n#flavor Thương tích và khiếm khuyết giờ chỉ càng tiếp thêm sức mạnh cho ma cà rồng, người trở nên mạnh mẽ và nhanh nhẹn hơn từ mỗi đòn đánh, mỗi vết xé, mỗi vết rách nhận được.#!" #Grants you a [character_interaction|E] to embrace the pain and use it to make yourself stronger.
 RESILIENCE_PERK_EFFECT: "#flavor Được ban cho sức chịu đựng siêu nhiên, ý chí thể chất của người dùng được củng cố.#!"
 TOUGHNESS_PERK_EFFECT: "$countermeasures_unlocks_t1_supernatural_high_alert$ \n #flavor Mọi ma cà rồng có năng lực này thể hiện khả năng bẩm sinh phớt lờ những tổn thương mà lẽ ra sẽ gây khó chịu và cả làm tàn tật những kẻ khác cùng loài. Với perk này, ngươi sẽ có thể hấp thụ vết thương, dùng máu để ngăn bản thân bị thương.#!"
 UNSWAYABLE_MIND_PERK_EFFECT: "$countermeasures_unlocks_t1_mental_fortress$ \n #flavor Người dùng có được năng lực huyền bí để chống lại mọi cố gắng lung lạc họ bằng những thủ đoạn, ép buộc, và mưu mẹo phàm tục.#!"
 BLESSING_OF_VITALITY_PERK_EFFECT: "Truyền thêm sức chịu đựng khác thường của ngươi qua rượu huyết bền bỉ, ban cho mục tiêu ngươi chọn những lợi ích của năng lực toughness trong lúc rượu huyết còn hiệu lực."
 KNIGHTS_BANE_PERK_EFFECT: "Cấp một đòn [single_combat_duel|E] để phá hủy vũ khí của đối thủ bằng chính da thịt trần của ngươi, gây sát thương cho họ trong lúc đó."
 CURSE_THE_LAUREL_PERK_EFFECT: "#flavor Di chuyển một cây cọc ra khỏi tim ngươi, cuối cùng loại bỏ nó hoàn toàn.#!"
 WRATH_OF_THE_MARTYR_PERK_EFFECT: "Cải thiện phần thưởng từ Prowess from Pain bằng cách tăng quyền năng ngươi rút ra từ nỗi đau." 
 ARMOURED_FLESH_PERK_EFFECT: "#flavor Không gì ngoài một đòn đánh chí mạng có thể giết ngươi. Không lượng vết thương nào có thể chấm dứt sinh mạng ngươi, chỉ có sự hủy diệt hoàn toàn hoặc chặt đầu mới làm được.#!"
 RESILIENT_MIND_PERK_EFFECT: "Mở khóa một [character_interaction|E] Fortitude mới.\n#flavor Tâm trí ngươi trút bỏ sự loạn trí và những tật xấu thú tính trong lúc trở nên kháng lại các năng lực làm biến đổi tâm trí.#!"
 
 # Obfuscate # 
 
 CLOAK_OF_SHADOWS_PERK_EFFECT: "$countermeasures_unlocks_t1_obfuscated_court$ \n #flavor Đứng yên hoàn toàn bất động, người dùng hòa lẫn vào môi trường xung quanh. Miễn là họ có nơi ẩn nấp, không gây tiếng động, và không di chuyển, chỉ có phương tiện cơ khí hoặc siêu nhiên mới có thể phát hiện ra họ.#!"
 CLOAK_THE_GATHERING_PERK_EFFECT: "#flavor Ma cà rồng có thể che chở đồng bọn của mình dưới lớp áo choàng của Obfuscate.#!"
 IMPOSTORS_GUISE_PERK_EFFECT: "#flavor Với sự chuẩn bị, ma cà rồng có thể khiến bản thân xuất hiện như một cá nhân cụ thể với bất kỳ vóc dáng và giới tính nào. Người dùng phải nghiên cứu kỹ đối tượng. Nếu không, màn giả trang sẽ thất bại khi gặp bất kỳ ai quen biết hơn mức xã giao với người bị bắt chước.#!"
 MASK_OF_A_THOUSAND_FACES_PERK_EFFECT: "$countermeasures_unlocks_t3_obfuscated_court$ \n Mở khóa [character_interaction|E] để sao chép vẻ ngoài của ai đó.\n#flavor Thay vì biến mất, ma cà rồng dùng năng lực này có thể khiến bản thân xuất hiện như một người lạ không có gì nổi bật: ai đó được cho là có mặt trong khu vực.#!"
 MASK_OF_A_THOUSAND_FACES_PERK_BONUS_VALUE: "[GetPerk('mask_of_a_thousand_faces_perk').GetName(GetPlayer)]"
 SILENCE_OF_DEATH_PERK_EFFECT: "Mở khóa [character_interaction|E] để giảm mạnh phạm vi ngoại giao của một nhân vật có đất phong.\n#flavor Năng lực này khiến người dùng hoàn toàn im lặng, vô hiệu hóa mọi âm thanh do họ tạo ra. Không như Obfuscate nói chung, năng lực này chỉ tác động lên giác quan nghe, nhưng đổi lại, hoạt động bền vững hơn. Một ma cà rồng cần gây ra rất nhiều tiếng động để phá vỡ sự im lặng này.#!"
 UNSEEN_PASSAGE_PERK_EFFECT: "$countermeasures_unlocks_t2_obfuscated_court$ \n Tốc độ Tiến triển [espionage|E]: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\nTăng cơ hội thành công cho [decision|E] Trốn khỏi Ngục giam.\n#flavor Với năng lực này, ma cà rồng giờ có thể di chuyển xung quanh trong lúc vẫn ẩn mình.#!"
 UNSEEN_PASSAGE_PERK_BONUS_VALUE: "[GetPerk('unseen_passage_perk').GetName(GetPlayer)]"
