 COMPEL_SOUL_PERK_FLAVOR: "#flavor Dùng năng lực này, một ma cà rồng có thể bắt một hồn ma phục theo ý mình trong một thời gian ngắn. Năng lực này đòi hỏi sự tự tin tối thượng, vì một lần thất bại về ý chí có thể dẫn đến hậu quả tai hại cho một nhà gọi hồn.#!"
 HAUNTING_PERK_EFFECT: "Giúp việc trói buộc một [GetTrait('wraith').GetName( GetNullCharacter )] qua [character_interaction|E] Trói Buộc Oan Hồn dễ dàng hơn."
 HAUNTING_PERK_FLAVOR: "#flavor Một nhà gọi hồn dùng quyền năng của máu mình để trói buộc một hồn ma vào một vật thể hoặc địa điểm.#!"
 TORMENT_PERK_EFFECT: "Ngươi có thể giam giữ, tra tấn, hành quyết hoặc gây tổn hại thể xác cho các linh hồn trong [single_combat_duel_plural|E]."
 TORMENT_PERK_FLAVOR: "#flavor Khi dùng Torment, một nhà gọi hồn có thể đánh vào thân thể vô hình của một hồn ma như thể chính mình cũng là một hồn ma.#!"

 #Bone Path

