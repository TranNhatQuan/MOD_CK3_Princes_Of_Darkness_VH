  #Gargoyle legacy #
 GARGOYLE_LEGACY_1_PERK_EFFECT: "#F Cung cấp một nơi trú ẩn cho những Gargoyle lang thang gia nhập vương quốc của bạn.#!"
 GARGOYLE_LEGACY_2_PERK_EFFECT: "#F Ta đã có thể giải phóng nhiều hơn nếu chỉ là họ biết mình là nô lệ.#!"
 GARGOYLE_LEGACY_3_PERK_EFFECT: "#F Bay tốt chẳng bao giờ giết được kẻ địch.#!"
 GARGOYLE_LEGACY_4_PERK_EFFECT: "Thành viên triều đại có [learning|E] cao nhận được Blood Sorcery $pod_discipline$ và một [character_interaction|E] nghi thức để tạo ra nhân vật Gargoyle.\n#F Kiến thức là sức mạnh, kiến thức bị đánh cắp vẫn là sức mạnh.#!"
 GARGOYLE_LEGACY_5_PERK_EFFECT: "#F Trên hết mọi thứ, hãy tự trọng.#!"
 
 #Nagaraja legacy #
 
 NAGARAJA_LEGACY_1_PERK_EFFECT: "Ăn thịt đồng loại [prisoners|E] cho một lượng nhỏ [dread_i][dread|E].\nMở khóa [decision|E] [GetDecision('recruit_itarajana_sorcerer_decision').GetName].\n#F Người khác có thể ghê tởm chúng ta vì cách chúng ta ăn, nhưng chúng ta biết sự thật. Nuốt chửng là để cai trị. Nhai là để chinh phục. Ăn vào là để trị vì.#!"
 NAGARAJA_LEGACY_2_PERK_EFFECT: "Mở khóa [decision|E] [GetDecision('convene_silent_conclave_decision').GetName].\n#F Ăn ngấu nghiến thịt của kẻ đã ngã xuống là để mài sắc sự thông tuệ.#!"
 NAGARAJA_LEGACY_3_PERK_EFFECT: "Mở khóa [decision|E] [GetDecision('pilgrimage_to_enoch_decision').GetName].\n#F Shadowlands nuốt chửng những kẻ chưa chuẩn bị. Chỉ chúng ta mới có khả năng vượt qua nó có mục đích trong khi những kẻ khác lần mò trong bóng tối.#!"
 NAGARAJA_LEGACY_4_PERK_EFFECT: "#F Cả kẻ sống và kẻ chết đều sợ chúng ta, vì họ không hiểu chúng ta. Ngoại trừ một điều - cơn khát của chúng ta là vô tận.#!"
 NAGARAJA_LEGACY_5_PERK_EFFECT: "#F Sự sống, sự chết, linh hồn, và thể xác đều là những bữa ăn. Với mỗi thứ bị nuốt chửng, thế giới thối rữa nhanh hơn khi nó chuẩn bị bị nuốt chửng.#!"

