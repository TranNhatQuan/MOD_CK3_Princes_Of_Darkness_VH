 SENSORY_DEPRIVATION_PERK_EFFECT: "Là một [character_interaction|E], cho phép khiến nạn nhân nhận [GetTrait('blind').GetName( GetPlayer )], [GetModifier('sensory_deprivation_deaf_modifier').GetNameWithTooltip]...\n#F Khiến nạn nhân không thể sử dụng bất kỳ giác quan nào của mình, giam họ khỏi thế giới bên ngoài.#!"
 
