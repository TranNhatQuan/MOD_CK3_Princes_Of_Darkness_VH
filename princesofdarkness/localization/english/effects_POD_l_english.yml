 TOREADORS_BANE_PERK_EFFECT: "Thêm hiệu ứng cho melpominee [character_interaction|E], cho phép trao hiệu ứng [GetModifier('POD_toreador_bane_modifier').GetNameWithTooltip] cho mục tiêu.\n#F Làm say đắm người khác bằng một bài ca, như điểm yếu của Toreador#!"
 MADRIGAL_PERK_EFFECT: "Mở khóa [GetScheme('PODsoul_bridge').GetTypeName] [scheme|E].\n#F Phóng chiếu một cảm xúc vào khán giả của ngươi bằng một bài ca#!"
 SIRENS_BECKONING_PERK_EFFECT: "Thêm hiệu ứng cho melpominee [character_interaction|E], cho phép trao một cơn bùng phát căng thẳng ngẫu nhiên cho mục tiêu.\n#F Khiến ai đó phát điên bằng bài ca của ngươi#!"
 MOSH_PIT_PERK_EFFECT: "Thêm hiệu ứng cho melpominee [character_interaction|E], cho phép trao hiệu ứng [GetModifier('murderous_frenzy_modifier').GetNameWithTooltip] cho mục tiêu.\n#F Khơi gợi một mục tiêu vào Cuồng Nộ bằng bài ca của ngươi#!"
 PRIMAL_SCREAM_PERK_EFFECT: "Thêm hiệu ứng cho melpominee [character_interaction|E], cho phép trao hiệu ứng [GetModifier('POD_frenzy_terrified_populace_modifier').GetNameWithTooltip] cho địa điểm của mục tiêu.\n#F Khơi gợi một mục tiêu vào Rötschreck bằng bài ca của ngươi#!"
 BLESSED_AUDIENCE_PERK_EFFECT: "Trao một cơn bùng phát căng thẳng ngẫu nhiên cho [knights|E] và [commanders|E] của địch khi làm [commander|E] trong [combat_phase|E], hoặc cho kẻ địch của ngươi trong [single_combat_duel_plural|E].\n#F Dùng [GetPerk('sirens_beckoning_perk').GetName(GetPlayer)] lên nhiều người cùng lúc#!"
 SHATTERING_CRESCENDO_PERK_EFFECT: "#F Gây hại cho người hoặc vật thể bằng một tiếng thét tần số cao#!"
 PERSISTENT_ECHO_PERK_EFFECT: "Cơ hội thành công của melpominee [character_interaction|E] #P +100%#!.\n#F Treo lửng tiếng nói của ngươi hay các quyền năng Melpominee cho ai đó đến sau#!"
 HAUNTING_MELODY_PERK_EFFECT: "Thêm hiệu ứng cho melpominee [character_interaction|E], cho phép trao hiệu ứng [GetModifier('haunting_melody_perk_modifier').GetNameWithTooltip] cho mục tiêu.\n#F Để lại một điệu nhạc ở một nơi nào đó khiến những ai nghe được nó mắc một chứng rối loạn tâm thần#!"
 CALLING_SONG_PERK_EFFECT: "Như một [character_interaction|E], cho phép ngươi triệu tập tất cả triều thần và khách khứa của mục tiêu về triều đình ngươi.\n#F Cài vào nhiều mục tiêu một bài ca lôi kéo họ đến một địa điểm cụ thể#!"
 
 # Spiritus #
 
 SPEAK_WITH_SPIRITS_PERK_EFFECT: "Mở khóa $seek_aid_of_the_spirits_decision$ [decision|E].\n#F Nói chuyện bằng thần giao cách cảm với các linh hồn xung quanh ngươi#!"
 AID_FROM_SPIRITS_PERK_EFFECT: "$unlock_enhancing_node$ Thêm một [modifier|E] dựa trên loại của [artifact|E]\n#F Khuấy động linh hồn của một vật thể, khiến nó thực hiện chức năng dự định của mình tốt hơn#!"
 SUMMON_SPIRIT_BEASTS_PERK_EFFECT: "Có thể tuyển mộ [GetMaA('jagglings').GetName] làm [men_at_arms|E].\n#F Triệu hồi linh hồn của những con vật đã chết để phục vụ ngươi#!"
 ASPECT_OF_THE_BEAST_PERK_EFFECT: "Mở khóa lựa chọn Biến hình Aspect of the Beast.\n#F Gọi đến một linh hồn để ban cho ngươi khả năng của một con vật#!"
 ENGLING_FURY_PERK_EFFECT: "Thêm hiệu ứng cho săn linh hồn [character_interaction|E], cho phép ngươi nhận uy danh từ đó.\n#F Nhận Ý Chí bằng cách ngốn nuốt một linh hồn động vật#!"
 BEASTLY_HUNGER_PERK_EFFECT: "Thêm hiệu ứng cho săn linh hồn [character_interaction|E], cho phép ngươi nhận lòng mộ đạo từ đó.\n#F Nhận Ý Chí bằng cách ngốn nuốt một linh hồn động vật#!"
 THE_WILD_BEAST_PERK_EFFECT: "Mở khóa lựa chọn Biến hình Wild Beast.\n#F Biến thành một con thú dữ mạnh mẽ#!"
 THE_SPIRIT_BEAST_PERK_EFFECT: "Cho phép ngươi chọn một linh hồn thú.\n#F Hợp nhất với một linh hồn động vật#!"
 
 # Flight #
 FLIGHT_1_PERK_EFFECT: "#F Ngươi có thể lướt bay như một cánh diều lượn.\nNgươi không thể mang theo gì tuy nhiên.#!"
 FLIGHT_2_PERK_EFFECT: "Giảm khả năng xảy ra một số sự kiện tiêu cực khi thị sát lãnh địa của ngươi.\n#F Ngươi có thể chạy lấy đà cất cánh và mang theo 10 kilôgam khi bay.#!"
 FLIGHT_3_PERK_EFFECT: "#F Ngươi có thể cất cánh thẳng đứng nếu không mang vật gì, hoặc có thể chạy lấy đà cất cánh mang theo đến 25 kg.#!"
 FLIGHT_4_PERK_EFFECT: "#F Giờ đây ngươi có thể cất cánh thẳng đứng với đến 25 kg hành lý, nhưng có thể mang theo đến 45 kg khi bay.#!"
 FLIGHTADVANCED_PERK_EFFECT: "#F Giờ đây ngươi có thể mang theo đến 90 kg, đủ để mang đi một người trưởng thành (hoặc ma cà rồng) dễ dàng.\nTốc độ tối đa là 120 kilômét mỗi giờ.#!"
 FLIGHT_6_PERK_EFFECT: "#F Giờ đây ngươi có thể mang theo đến 135 kg, đủ để mang đi một người trưởng thành (hoặc ma cà rồng) dễ dàng.\nTốc độ tối đa là 150 kilômét mỗi giờ.#!"
 FLIGHT_7_PERK_EFFECT: "#F Giờ đây ngươi có thể mang theo đến 180 kg, đủ để mang đi một người trưởng thành (hoặc ma cà rồng) dễ dàng.\nTốc độ tối đa là 180 kilômét mỗi giờ.#!"
 FLIGHT_8_PERK_EFFECT: "#F Giờ đây ngươi có thể mang theo đến 225 kg, đủ để mang đi một người trưởng thành (hoặc ma cà rồng) dễ dàng.\nTốc độ tối đa là 210 kilômét mỗi giờ.#!"
 FLIGHT_9_PERK_EFFECT: "#F Giờ đây ngươi có thể mang theo đến 270 kg, đủ để mang đi một người trưởng thành (hoặc ma cà rồng) dễ dàng.\nTốc độ tối đa là 240 kilômét mỗi giờ.#!"
 FLIGHT_10_PERK_EFFECT: "#F Giờ đây ngươi có thể mang theo đến 315 kg, đủ để mang đi một người trưởng thành (hoặc ma cà rồng) dễ dàng.\nTốc độ tối đa là 270 kilômét mỗi giờ.#!"
 FLIGHT_11_PERK_EFFECT: "#F Giờ đây ngươi có thể mang theo đến 360 kg, đủ để mang đi một người trưởng thành (hoặc ma cà rồng) dễ dàng.\nTốc độ tối đa là 300 kilômét mỗi giờ.#!"

 # Valeren #
 
 OBEAH_PANACEA_PERK_EFFECT: "Cho phép dùng chữa lành bằng máu [character_interaction|E] lên nhân vật khác để chữa sẹo.\n#F Giống như ngươi có thể chữa lành vết thương do mình gây ra bằng cách liếm chúng, chữa lành vết thương do người khác gây ra bằng cách liếm chúng#!"
 SENSE_DEATH_PERK_EFFECT: "#F Phát hiện mức độ khỏe mạnh của một cá nhân hoặc các thông tin khác về máu#!"
 SENSE_CYCLE_PERK_EFFECT: "#F Cảm nhận toàn bộ vòng đời, bản năng biết khi nào một cá nhân hoặc một sự kiện quan trọng đối với tương lai của ngươi#!"
 AUGURING_THE_SICKNESS_PERK_EFFECT: "#F Phát hiện mức độ nghiêm trọng và bản chất của một căn bệnh đang hoành hành một mục tiêu#!"
 GIFT_OF_SLEEP_PERK_EFFECT: "$countermeasures_unlocks_t2_bounties_for_whispers$ \n #F Xóa bỏ cảm giác đau đớn khỏi một mục tiêu hoặc đưa một sinh vật sống vào giấc ngủ#!"
 PEACEFUL_TOUCH_PERK_EFFECT: "$countermeasures_unlocks_t1_mental_fortress$ \n #F Làm dịu một mục tiêu thù địch bằng một cái chạm, khiến việc họ tấn công ngươi khó khăn hơn#!"
 HEALERS_TOUCH_PERK_EFFECT: "Cho phép dùng chữa lành bằng máu [character_interaction|E] lên nhân vật khác để chữa lành thương tích.\n#F Chữa lành thương tích của một người phàm hoặc một ma cà rồng bằng một cái chạm, bao gồm cả các bệnh lây qua máu#!"
 NEUTRAL_GUARD_PERK_EFFECT: "#F Tạo ra một hàng rào cách ngươi 10 feet ngăn người khác tiếp cận#!"
 BURNING_TOUCH_PERK_EFFECT: "#F Khiến nạn nhân cảm thấy nỗi đau đớn suy nhược và có thể gây Rötschreck ở nạn nhân ma cà rồng#!"
 PARIAHS_CARESS_PERK_EFFECT: "Như một [character_interaction|E], cho phép ngươi trao hiệu ứng [GetModifier('pariahs_caress_perk_modifier').GetNameWithTooltip] cho mục tiêu.\n#F Đánh dấu một mục tiêu bằng một cái chạm đầy máu, khiến mọi tương tác xã hội của họ khó khăn hơn#!"
 KING_DAVIDS_BLESSING_PERK_EFFECT: "Như một [character_interaction|E], cho phép ngươi chữa lành đặc điểm căng thẳng của mục tiêu.\n#F Qua bài ca hoặc chơi một nhạc cụ, giúp ai đó quên đi đau đớn thể xác, kéo họ ra khỏi trầm cảm, hoặc trợ giúp một người trị liệu khác trong nghề của họ#!"
 SHEPHERDS_WATCH_PERK_EFFECT: "#F Tạo ra một hàng rào cách ngươi 10 feet ngăn người khác tiếp cận#!"
 ARMOR_OF_CAINES_FURY_PERK_EFFECT: "#F Tạo ra một lớp giáp huyền bí bảo vệ ngươi khỏi tổn hại và giúp ngươi dễ tránh khỏi Cuồng Nộ vì sợ hãi hơn#!"
 WATCHER_PEACEMAKER_PERK_EFFECT: "$countermeasures_unlocks_t2_mental_fortress$ \n #F Lan truyền một hào quang bình yên và tĩnh lặng, như quyền năng cấp 3 phía trên#!"
 UNBURDEN_THE_BESTIAL_SOUL_PERK_EFFECT: "Như một [character_interaction|E], cho phép ngươi trao một hiệu ứng tích cực hoặc chữa lành các đặc điểm tinh thần tiêu cực của mục tiêu.\n#F Kéo linh hồn ai đó ra và cải thiện chỉ số Con Đường của đối tượng, tăng các Đức Tính của đối tượng (Lương Tâm, Can Đảm, và Tự Chủ), giảm các đức tính khác (Tín Niệm và Bản Năng), và chữa các Chứng Rối Loạn Tâm Thần#!"
 ENDING_THE_WATCH_PERK_EFFECT: "Nhận kinh nghiệm lối sống khi giết các nhân vật không siêu nhiên.\n#F Giết không đau đớn một người phàm muốn chết và rút kiến thức hoặc năng lượng từ đó#!"
 VENGEANCE_OF_SAMIEL_PERK_EFFECT: "#F Tung ra một đòn đánh tàn khốc duy nhất không thể tránh được#!"
 SOULS_BREATH_PERK_EFFECT: "Như một [character_interaction|E], cho phép ngươi tiêu thụ sức mạnh của mục tiêu để làm dịu Cơn Đói Khát.\n#F Sống nhờ hơi thở của người phàm thay vì máu, hoặc đánh cắp máu và sức mạnh từ các sinh vật siêu nhiên khác qua hơi thở của họ#!"
 FATHERS_JUDGEMENT_PERK_EFFECT: "#F Làm cho một phần $pod_vitae$ của ma cà rồng trở nên vô hiệu#!"
 REPULSION_PERK_EFFECT: "Giảm khả năng [factions|E] nổi dậy chống lại ngươi.\n#F Khiến người khác theo bản năng tránh xa ngươi, như thể đang nhớ lại điều gì không vui và không có ý muốn theo đuổi nó#!"
 RAYZEELS_SONG_PERK_EFFECT: "Như một [character_interaction|E], cho phép ngươi chữa mọi thương tích, bệnh tật và bệnh siêu nhiên trong triều đình của mục tiêu.\n#F Giúp việc chữa lành cho người khác dễ dàng hơn#!"
 HEAVENS_GATE_PERK_EFFECT: "Việc tạo Bộc huyết giờ đây cũng cho họ đặc điểm [GetTrait('revenant').GetName( GetNullCharacter )].\n#F Hồi sinh một người phàm mới bị giết thành một [GetTrait('revenant').GetName( GetNullCharacter )]#!"
 BLISSFUL_AGONY_PERK_EFFECT: "#F Khiến nạn nhân cảm thấy đau đớn liên tục có thể gây thiệt hại hoặc đẩy họ vào Cuồng Nộ#!"
 SWORD_OF_THE_RIGHTEOUS_PERK_EFFECT: "$unlock_enhancing_node$ [GetModifier('sword_of_the_righteous_modifier').GetNameWithTooltip]\n#F Khiến một thanh kiếm nhuốm máu $pod_vitae$ của ngươi bùng lên lửa thiêng và gây thiệt hại chí mạng#!"
 SONG_OF_THE_BLOODED_PERK_EFFECT: "Trao [GetModifier('song_of_the_blooded_perk_commander_negative_modifier').GetNameWithTooltip] [modifier|E] cho [commanders|E] của địch khi làm [commander|E] trong [combat_phase|E].\nTrao [GetModifier('song_of_the_blooded_perk_knight_negative_modifier').GetNameWithTooltip] [modifier|E] cho [knights|E] của địch khi làm [commander|E] trong [combat_phase|E], hoặc cho kẻ địch của ngươi trong [single_combat_duel_plural|E].\nTrao [GetModifier('song_of_the_blooded_perk_commander_positive_modifier').GetNameWithTooltip] [modifier|E] cho [commanders|E] đồng minh khi làm [commander|E] trong [combat_phase|E].\n Trao [GetModifier('song_of_the_blooded_perk_knight_positive_modifier').GetNameWithTooltip] [modifier|E] cho [knights|E] đồng minh khi làm [commander|E] trong [combat_phase|E] hoặc cho chính ngươi trong [single_combat_duel_plural|E].\n#F Ma cà rồng rơi vào một trạng thái xuất thần chiến đấu, tăng cường dũng mãnh thể chất, quanh mình một vòng hào quang lóa mắt kẻ nhìn và khiến nàng miễn nhiễm với mọi Dị năng ảnh hưởng tâm trí#!"
 SAFE_PASSAGE_PERK_EFFECT: "Ít nguy cơ bị một phe săn lùng dị giáo nhắm đến hơn.\n#F Nhận được lòng hiếu khách và sự giúp đỡ bất kể văn hóa địa phương, và khiến những kẻ săn lùng khó tìm ra ngươi hơn.#!"
 AVERSION_PERK_EFFECT: "Nâng cấp Vuốt Ve Của Kẻ Bị Ruồng Bỏ [character_interaction|E], cho phép ngươi trao hiệu ứng [GetModifier('aversion_perk_modifier').GetNameWithTooltip] cho mục tiêu, cơ hội khiến mục tiêu mất toàn bộ danh vọng.\n#F Tăng cường [GetPerk('pariahs_caress_perk').GetName(GetPlayer)], khiến người khác cực kỳ khó chịu và xa lánh một cá nhân, hoặc trở nên thù địch với họ#!"
 WATCHER_PURIFICATION_PERK_EFFECT: "Như một [character_interaction|E], cho phép ngươi xóa các đặc điểm khét tiếng khỏi mục tiêu.\n#F Đuổi hoặc trừ tà một linh hồn hoặc một con quỷ, và buộc nó phục vụ ngươi#!"
 WATCHER_SOUL_EXCHANGE_PERK_EFFECT: "Như một [character_interaction|E], cho phép ngươi hoán đổi đặc điểm nhân cách của hai mục tiêu.\n#F Hoán đổi linh hồn của hai cá nhân, trao đổi Con Đường, Đức Tính, và Bản Tính của họ#!"
 
 # Quietus #
 
 SORCERER_SILENCE_OF_DEATH_PERK_EFFECT: "#F Như Warrior Power, nhưng tiếng nói của bản thân Sorcerer có thể được nghe thấy#!"
 SCORPIONS_CURSE_PERK_EFFECT: "Trao [GetModifier('scorpions_curse_perk_modifier').GetNameWithTooltip] [modifier|E] cho kẻ địch của ngươi trong [single_combat_duel_plural|E].\n#F Đặt một ấn phù trên một bề mặt cứng để kích hoạt quyền năng Warrior khi bị chạm vào#!"
 SORCERER_DAGONS_CALL_PERK_EFFECT: "Như một [character_interaction|E], cho phép ngươi gây cho mục tiêu một vết thương với mức độ nghiêm trọng tùy theo dũng mãnh của ngươi.\n#F Gây hại từ xa lên tâm trí một người mà ngươi đã chạm vào trong vòng một giờ trước#!"
 SORCERER_BAALS_CARESS_PERK_EFFECT: "Mở khóa $seek_aid_of_the_spirits_decision$ [decision|E].\n#F Cảm nhận các thực thể linh hồn#!"
 TASTE_OF_DEATH_PERK_EFFECT: "#F Phun ra máu có tính ăn mòn làm hại các sinh vật phi vật chất#!"
 WARRIOR_SILENCE_OF_DEATH_PERK_EFFECT: "#F Khiến khu vực quanh ngươi hoàn toàn im lặng#!"
 BLOOD_ESSENCE_PERK_EFFECT: "#P 20%#! cơ hội giết [knights|E] của địch khi họ bị tàn tật hoặc bị thương trong [combat_phase|E] khi làm [commander|E].\n#F Rút cạn máu từ tim của một mục tiêu đã bị mất máu và suy yếu#!"
 WARRIOR_SCORPIONS_TOUCH_PERK_EFFECT: "Khi một cuộc chiến bắt đầu, nhà quán quân dũng mãnh thấp nhất của địch sẽ bị thương.\n#F Tạo ra một chất độc tiếp xúc làm suy nhược nạn nhân nghiêm trọng về thể chất#!"
 WARRIOR_DAGONS_CALL_PERK_EFFECT: "Như một [character_interaction|E], cho phép ngươi gây cho mục tiêu một vết thương với mức độ nghiêm trọng tùy theo dũng mãnh của ngươi.\n#F Gây hại từ xa lên một người mà ngươi đã chạm vào trong vòng một giờ trước#!"
 WARRIOR_BAALS_CARESS_PERK_EFFECT: "Cải thiện Chạm Của Bò Cạp: khi một cuộc chiến bắt đầu, hai nhà quán quân dũng mãnh thấp nhất của địch sẽ bị thương.\n#F Tạo ra một chất độc có thể phết lên vũ khí để làm chúng nguy hiểm hơn#!"
 QUICKEN_THE_MORTALS_BLOOD_PERK_EFFECT: "Khi uống máu, ngươi giảm Cơn Đói Khát như thể ngươi đang uống gấp đôi lượng máu đó.\n#F Nhận gấp đôi máu cho mỗi lượt rút máu#!"
 BLOOD_TEMPERING_PERK_EFFECT: "#F Bảo quản vật phẩm bằng cách truyền máu vào chúng#!"
 TRUTH_OF_BLOOD_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$ \n #F Nếm máu của một mục tiêu để biết liệu họ có nói dối không#!"
 ISHTARS_TOUCH_PERK_EFFECT: "#F Tạo ra một chất độc tiếp xúc khiến mục tiêu say xỉn#!"
 CLEANSED_IN_BLOOD_PERK_EFFECT: "Như một [character_interaction|E], cho phép ngươi loại bỏ khả năng biến hình của mục tiêu.\n#F Tẩy sạch một cá nhân khỏi các ảnh hưởng tinh thần và cảm xúc lên họ, kể cả lời nguyền và các hiệu ứng huyền bí khác#!"
 RIPPLES_OF_THE_HEART_PERK_EFFECT: "#F Nếm cảm xúc và tình cảm từ trong máu#!"
 BLOOD_SWEAT_PERK_EFFECT: "#F Buộc một mục tiêu đổ mồ hôi máu ròng rã và day dứt về những điều tồi tệ họ đã làm#!"
 TASTE_OF_BLISS_PERK_EFFECT: "#F Thở ra một làn khói đỏ vào một mục tiêu rút cạn Ý Chí của họ#!"
 FREE_DAGONS_CALL_EFFECT: "Thêm hiệu ứng cho Lời Gọi Của Dagon [character_interaction|E], giờ đây nó không còn tốn lòng mộ đạo."
 QUIETUS_PURIFICATION_PERK_EFFECT: "Như một [character_interaction|E], cho phép ngươi loại bỏ [battle_modifier|E] của một mục tiêu.\n#F Tẩy sạch một cá nhân khỏi các ảnh hưởng tinh thần và cảm xúc lên họ, kể cả lời nguyền và các hiệu ứng huyền bí khác#!"
 THIN_BLOOD_PERK_EFFECT: "Như một [character_interaction|E], cho phép ngươi khiến một mục tiêu chịu [GetModifier( 'thin_blood_perk_modifier' ).GetNameWithTooltip|L].\n#F Khiến một ma cà rồng không thể chữa lành vết thương bằng $pod_vitae$#!"
 FOUL_BLOOD_PERK_EFFECT: "#F Đầu độc máu của một mục tiêu để chỉ ngươi mới có thể hút máu từ họ#!"
 BLOOD_OF_DESTRUCTION_PERK_EFFECT: "Trao [GetModifier('blood_of_destruction_perk_modifier').GetNameWithTooltip] [modifier|E] cho [knights|E] đồng minh khi làm [commander|E] trong [combat_phase|E] hoặc cho chính ngươi trong [single_combat_duel_plural|E].\n#F Khiến máu trong cơ thể của ai đó trở nên có tính ăn mòn cực mạnh#!"
 CONDEMN_THE_SINS_OF_THE_FATHER_PERK_EFFECT: "Thêm hiệu ứng cho Lời Gọi Của Dagon [character_interaction|E], giờ đây ảnh hưởng đến toàn bộ gia tộc của mục tiêu (thành viên có tuổi ít hơn mục tiêu).\n#F Áp dụng một quyền năng Quietus cấp thấp hơn lên toàn bộ một dòng dõi ma cà rồng#!"
 EROSION_PERK_EFFECT: "Như một [character_interaction|E], cho phép ngươi khiến mục tiêu chịu [GetModifier( 'erosion_perk_modifier' ).GetNameWithTooltip|L].\n#F Giảm mọi thuộc tính thể chất của một mục tiêu xuống không#!"
 
 # Mytherceria #

 FEY_SIGHT_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$ \n #F Cảm nhận yêu tinh biến hình và ánh hào quang tiên tộc#!"
 FOLDEROL_PERK_EFFECT: "$countermeasures_unlocks_t1_mental_fortress$ \n #F Xác định một lời tuyên bố có phải dối trá hay không#!"
 FAE_SIGHT_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$ \n #F Cảm nhận mọi hình thức pháp thuật không liên quan đến u hồn và tử vật#!"
 DARKLING_TRICKERY_PERK_EFFECT: "#F Tạo ra mọi loại hiệu ứng thường gắn liền với tiên tộc#!"
 GOBLINISM_PERK_EFFECT: "#F Có bản năng định hướng dưới lòng đất; triệu hồi yêu tinh giúp bẻ cong và tạo hình đá#!"
 AURA_ABSORPTION_PERK_EFFECT: "Là một [character_interaction|E], cho phép đặt lại cộng hưởng của mục tiêu.\n#F Loại bỏ cộng hưởng khỏi một vật thể#!"
 CHANJELIN_WARD_PERK_EFFECT: "#F Đặt các biểu tượng gây rối loạn và mất phương hướng cho người khác#!"
 RIDDLE_PHANTASTIQUE_PERK_EFFECT: "Trao [GetModifier('riddle_phantastique_perk_modifier').GetNameWithTooltip] [modifier|E] cho [knights|E] địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho đối thủ của bạn trong [single_combat_duel_plural|E].\n#F Nói ra những câu đố khiến người khác chỉ ngồi im suy nghĩ về nó#!"
 STONE_TRAVEL_PERK_EFFECT: "Là một [character_interaction|E], cho phép dịch chuyển quân đội của bạn đến vị trí của mục tiêu, hoặc dịch chuyển đến điểm đến kế tiếp khi đang hành quân, nếu địa hình cho phép.\n#F Ma cà rồng có thể đào hầm dưới lòng đất#!"
 STEAL_THE_MIND_PERK_EFFECT: "Là một [character_interaction|E], cho phép loại bỏ tạm thời thuộc tính của mục tiêu.\n#F Lấy đi tạm thời ký ức và kiến thức của nạn nhân#!"
 EARTH_SWORD_PERK_EFFECT: "#F Khiến các mũi gai bắn ra nhằm vào mục tiêu từ bất kỳ công trình lớn nào#!"
 ABSORB_THE_MIND_PERK_EFFECT: "Là một lựa chọn hành quyết, cho phép nuốt chửng tâm trí mục tiêu để tăng học vấn của bạn.\n#F Vĩnh viễn lấy đi cấp độ Năng lực từ nạn nhân cho riêng mình#!"
 BASILISKS_TOUCH_PERK_EFFECT: "Là một [character_interaction|E], cho phép biến mục tiêu thành đá.\n#F Biến nạn nhân thành đá chỉ bằng một cái chạm#!"
 
 # Daimonion #
 
 SENSE_THE_SIN_PERK_EFFECT: "Là một [character_interaction|E], cố gắng tìm hiểu bí mật của mục tiêu (chọn ngẫu nhiên).\n#flavor Năng lực này cho phép kẻ Baali nhìn sâu vào tâm hồn nạn nhân của mình để lục lọi ra điểm yếu đạo đức lớn nhất của người đó.#!"
 FEAR_THE_VOID_BELOW_PERK_EFFECT: "Là một [character_interaction|E], giảm sự táo bạo của mục tiêu trong 10 năm.\n#flavor Kẻ Baali làm mục tiêu khiếp sợ với cảm giác sắp bị đọa vào Địa Ngục.#!"
 CONFLAGRATION_PERK_EFFECT: "#flavor Kẻ Baali rút ra bản chất hủy diệt của cõi Vượt Ngoài.#!"
 PSYCHOMACHIA_PERK_EFFECT: "Là một [character_interaction|E], triệu hồi cơn ác mộng tồi tệ nhất của mục tiêu vào thực tại, trao cho họ [modifier|E] dựa trên tính cách của họ.\n#flavor Kẻ Baali triệu hồi hồn ma nỗi sợ hãi hoặc chấn thương lớn nhất của nạn nhân.#!"
 CONDEMNATION_PERK_EFFECT: "Là một [character_interaction|E], trao cho mục tiêu [GetModifier('POD_condemnation_modifier').GetNameWithTooltip] trong 5 năm.\n#flavor Kẻ Baali đặt một lời nguyền suy nhược lên mục tiêu.#!"
 LURE_DIABOLIK_PERK_EFFECT: "Là một [decision|E], triệu hồi một kẻ thờ ma quỷ đến [court|E] của bạn.\n#flavor Kẻ Baali chỉ huy kẻ thờ ma quỷ gần đó để phụng sự chúng.#!"
 HELL_BORN_INVESTITURE_PERK_EFFECT: "Là một [character_interaction|E], làm nhuốm bẩn linh hồn bạn bằng cái ác lớn lao để có được [investiture_lifestyle|E] và #V 6#! điểm [perk|E] với một cái giá phải trả.\n#flavor Kẻ Baali chiếm lấy vị trí xứng đáng của mình như một Chúa Địa Ngục.#!"
 BRING_THE_PLAGUE_PERK_EFFECT: "Là một [character_interaction|E], triệu hồi [GetTrait('demonic_plague').GetName(GetPlayer)] tại vị trí của mục tiêu.\n#flavor Kẻ Baali gieo rắc một bệnh dịch chết người ảnh hưởng đến cả Người Phàm và Hậu Duệ Cain.#!"
 THE_RE_EMBRACE_PERK_EFFECT: "Là một [character_interaction|E], Trao truyền lại một tù nhân ma cà rồng vào $pod_clan$ của bạn mà không thay đổi [Glossary('Thế Hệ','game_concept_vampgeneration_desc')] của họ.\n#flavor Khi Tái Trao Truyền được thi triển, Sire nắm lấy cổ họng của kẻ sắp trở thành childe của mình rồi rút máu họ vào bốn cái bát khắc những hình chạm cổ xưa và ma quái. Sire sau đó đổ máu của chính mình vào bốn cái bát khác, đặt vây quanh kẻ được Trao truyền theo thứ tự xen kẽ. Khi kẻ mới được khai nhập nằm trên đất, chảy máu và tiến gần hơn đến tử vong cuối cùng, Sire triệu gọi một mảnh linh hồn của con quỷ mạnh nhất trong huyết mạch, Namtaru, và hợp nhất nó với linh hồn của kẻ được Trao truyền để làm nhuốm bẩn nó và kéo linh hồn họ lại gần hơn với bản chất của một kẻ Baali.#!"
 ADRAMELECHS_WRATH_PERK_EFFECT: "Mở khóa một chiêu thức [single_combat_duel|E].\nGây thương tích cho [knights|E] và [commanders|E] địch khi đóng vai trò [commander|E] trong [combat_phase|E], hoặc cho đối thủ của bạn trong [single_combat_duel_plural|E] nếu họ là $POD_splat_vampire$.\n#flavor Kẻ Baali khiến một Hậu Duệ Cain bốc cháy như thể chính mặt trời đang chiếu rọi lên họ.#!"
 SPEW_WIDE_THE_PIT_PERK_EFFECT: "Khi chết, trao [GetModifier('spew_wide_the_pit_modifier').GetNameWithTooltip] cho mọi [counties|E] trong [duchy|E] mà bạn đã chết vì, trong 100 năm.\n#flavor Kẻ Baali tự hiến tế bản thân để một trong các Elder God có thể bước vào thế giới này.#!"

