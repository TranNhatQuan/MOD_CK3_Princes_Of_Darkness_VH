 EX_NIHILO_PERK_FLAVOR: "#flavor Ex Nihilo cho phép một nhà gọi hồn thực sự bước vào [UmbraGlossaryLocalized('shadowlands','Âm Phủ')]. Khi ở trong [UmbraGlossaryLocalized('shadowlands','Âm Phủ')], nàng xuất hiện như một hồn ma đặc biệt rắn chắc.#!"
