 ASHEN_LADYS_EMBRACE_PERK_FLAVOR: "#flavor Ashen Lady’s Embrace khiến chi thể của mục tiêu già đi, khô quắt lại, và héo tàn như chùm nho bị bỏ quên trên giàn.#!"
 GIFT_OF_MELANCHOLIA_PERK_EFFECT: "Mở khóa khả năng lan truyền một dịch bệnh tại địa điểm của mục tiêu dưới dạng [character_interaction|E]"
 GIFT_OF_MELANCHOLIA_PERK_FLAVOR: "#flavor Năng lực này gây ra một căn bệnh hao mòn dữ dội lên cả người phàm và Cainite.#!"
 NECROMANCY_DUST_TO_DUST_PERK_EFFECT: "Nâng cấp Ashen Lady's Embrace thành Dust to Dust"
 NECROMANCY_DUST_TO_DUST_PERK_FLAVOR: "#flavor Ashes to Ashes tác động lên xác chết, Dust to Dust tác động lên thân xác của ma cà rồng. Triệu hồi Dust to Dust cho phép một nhà gọi hồn biến một ma cà rồng khác thành một đống tàn tro như thể hắn bị mắc kẹt dưới ánh nắng hoặc bị thiêu trên cọc.#!"

 #Corpse in the Monster Path

 MORTUUS_IN_VULTUS_PERK_FLAVOR: "#flavor Một Cainite có thể khiến bản thân xuất hiện như thể nàng là một xác chết lâu năm.#!"
 ALGOR_MORTIS_PERK_FLAVOR: "#flavor Với việc sử dụng Algor Mortis, một ma cà rồng có thể biến bản thân thành một sinh thể lạnh lùng, u sầu, không bị tác động bởi nỗi đau phàm tục hay sự lung lạc cảm xúc.#!"
 INTIMATIONS_OF_MORTALITY_PERK_EFFECT: "Với vai trò [character_interaction|E] ngươi có thể tăng mức dễ bị căng thẳng của một ma cà rồng, đồng thời ngăn họ dùng Blood Surge để tăng chỉ số của mình."
 INTIMATIONS_OF_MORTALITY_PERK_FLAVOR: "#flavor Intimations of Mortality gây ra những mặt khó chịu và phiền toái hơn của kiếp phàm nhân lên một ma cà rồng.#!"
 BENEDICTIO_MORTEM_PERK_FLAVOR: "#flavor Với năng lực này, một nhà gọi hồn hoàn toàn khoác lấy hình dạng của một xác chết và có thể trút bỏ những nhược điểm của thân phận ma cà rồng.#!"
 BENEDICTIO_VITAE_PERK_FLAVOR: "#flavor Với Benedictio Vitae, một Cainite có thể hưởng thụ nhiều mặt tốt đẹp nhất của cuộc sống phàm nhân mà không từ bỏ quyền năng của bản chất ma cà rồng của nàng.#!"

 #Path of Skulls

 CALVARIA_EMISSIUS_PERK_FLAVOR: "#flavor Một trong những bí mật được trân trọng nhất của Clan Cappadocian là khả năng theo dõi qua hốc mắt của kẻ chết.#!"
 CONSILIUM_MORTUUS_PERK_EFFECT: "Tốc độ Tiến triển [espionage|E]: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!"
 CONSILIUM_MORTUUS_PERK_BONUS_VALUE: "[GetPerk('consilium_mortuus_perk').GetName(GetPlayer)]"
 CONSILIUM_MORTUUS_PERK_FLAVOR: "#flavor Bằng cách trò chuyện với đầu lâu bị chặt của mục tiêu đã khuất, hóa ra việc khai thác một sự thật chắc chắn từ đôi môi đã mục rữa là hoàn toàn khả thi.#!"
 AMMORSUS_VICARIUS_PERK_FLAVOR: "#flavor Dùng năng lực này, nhà gọi hồn có thể nắm lấy hàm dưới và xương hàm trên của đầu lâu để dùng như một vũ khí cận chiến kỳ dị, gắn đầu lâu vào đầu một cây giáo để tấn công từ xa, hoặc thậm chí bỏ mặc đầu lâu, để nó hoạt động như một cái bẫy.#!"
 EXEDO_ANIMUS_PERK_EFFECT: "Tốc độ Tiến triển [espionage|E]: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!"
 EXEDO_ANIMUS_PERK_BONUS_VALUE: "[GetPerk('exedo_animus_perk').GetName(GetPlayer)]"
 EXEDO_ANIMUS_PERK_FLAVOR: "#flavor Bằng cách mang theo một đầu lâu — dù là của người phàm hay Cainite — nhà gọi hồn tạo ra một liên kết cảm ứng với chủ nhân trước đây của đầu lâu đó.#!"
 DEGULO_PERK_EFFECT: "Với vai trò [character_interaction|E] lên chính mình, cho phép ngươi tự ban cho mình hiệu ứng [GetModifier('degulo_modifier').GetNameWithTooltip]. Trong khi hiệu ứng này còn hiệu lực, tù nhân bị hành quyết sẽ có đầu lâu bị luộc qua một sự kiện tiếp theo. Sau đó cho phép trao đổi các thuộc tính cơ bản hoặc [Glossary('Disciplines','game_concept_discipline_desc')] với những thuộc tính của người mà ngươi đã lấy được đầu lâu đã luộc bằng năng lực này qua một lượt tương tác nhân vật khác lên chính mình."
 DEGULO_PERK_FLAVOR: "#flavor Degulo là phương pháp mà một nhà gọi hồn tiêu thụ một mảnh linh hồn và giữ nó vĩnh viễn như một phần của chính mình#!"

 #Path of the Twilight Garden

 WHISPERS_OF_THE_SOUL_PERK_FLAVOR: "#flavor Chỉ cần nghe được một lời thì thầm mang chân danh của Dark Mother cũng đủ khiến người phàm hóa điên, và làm trái tim của những Hậu duệ Cain tràn đầy khiếp sợ#!"
 KISS_OF_THE_DARK_MOTHER_PERK_EFFECT: "Chiêu thức Cắn [single_combat_duel|E] trở nên mạnh mẽ hơn."
 KISS_OF_THE_DARK_MOTHER_PERK_FLAVOR: "#flavor Lilin cắn vào lưỡi mình và làm miệng nàng tràn ngập một hỗn hợp hôi thối, chua gắt giữa mật đen và $pod_vitae$. Nụ cắn của nàng trở nên khủng khiếp hơn nữa, và nàng có thể ngốn nuốt sinh mạng từ các con mồi một cách dễ dàng#!"
 DARK_HUMOURS_PERK_FLAVOR: "#flavor Lamiae được biết đến với khả năng thể chất và sự tinh thông cơ thể của mình. Không chỉ có thể thực hiện những kỳ công về sức mạnh thể chất phi thường, họ còn có thể điều khiển sự cân bằng thể dịch trong cơ thể chỉ bằng ý chí thuần túy.#!"
 CAUL_OF_THE_NEVERBORN_PERK_EFFECT: "Mở khóa Tìm Oan hồn [character_interaction|E]"
 CAUL_OF_THE_NEVERBORN_PERK_FLAVOR: "#flavor Khi sử dụng quyền năng này, Lamia củng cố thêm liên kết của mình với trái tim đen tối của Dark Mother. Điều này cho nàng cả sự bền bỉ tăng cường lẫn khả năng nhìn vào [UmbraGlossary('shadowlands')].#!"
 LAMENT_OF_DHAINU_PERK_FLAVOR: "#flavor Lamia rú lên trong thống khổ, và chính mặt đất rung chuyển. Một làn khói mù bóng tối quằn quại trỗi lên từ lòng đất và bủa vây kẻ địch của nàng. Những kẻ bị bóng tối ấy chụp lấy không bị trói buộc về thân thể, nhưng lập tức bị đánh gục bởi nỗi thống khổ tinh thần sâu sắc và trần trụi đến mức họ tìm cách kết liễu đời mình theo cách nhanh nhất có thể.#!"

 #Nightshade Path

 TEND_THE_BODY_GARDEN_PERK_EFFECT: "Giảm nguy cơ [masquerade_exposure_with_icon|E] và cải thiện Che Đậy Màn Che [character_interaction|E]"
 TEND_THE_BODY_GARDEN_PERK_FLAVOR: "#flavor Một tử linh thuật sĩ có quyền năng này có thể làm nhanh hoặc chậm quá trình phân rã, biến một người phàm đã chết thành vật chủ phình trướng cho ruồi nhặng trong tích tắc hoặc vô hiệu hóa sự phân rã của Cái Chết Cuối Cùng.#!"
 WITCHS_FRUIT_PERK_EFFECT: "Mở khóa một [character_interaction|E] cho phép ngươi đầu độc người phàm bằng thứ hoa quả nhiễm tử linh thuật."
 WITCHS_FRUIT_PERK_FLAVOR: "#flavor Mọi loài cây đều dựa vào sự chết để sinh trưởng. Những thứ đang mục rữa làm màu mỡ đất đai, và cây cối, dây leo, cỏ dại hút lấy dư âm hoại tử cùng với dưỡng chất sống. Một tử linh thuật sĩ có thể khơi dậy hào quang tử vong này bằng cách phơi hoa quả của mình trước máu nàng.#!"
 RAISE_THE_GREEN_ONE_PERK_EFFECT: "Mở khóa khả năng triệu hồi một Green One như một [character_interaction|E]."
 RAISE_THE_GREEN_ONE_PERK_FLAVOR: "#flavor Các tử linh thuật sĩ Nightshade có thể triệu hồi một xác chết được cây cỏ trói buộc và tăng cường. Lá cây che phủ da nó và những dây leo bền chắc bổ khuyết cho các gân cốt mục rữa của nó. Cái vỏ sống này ban cho tốc độ và bản năng tự tồn không thấy ở những tử thi hoạt hóa khác.#!"
 WAILS_AND_WHISPERS_PERK_EFFECT: "Mở khóa khả năng khiến một mục tiêu dễ bị tổn hại bởi các âm mưu sát hại như một [character_interaction|E]"
 WAILS_AND_WHISPERS_PERK_FLAVOR: "#flavor Khi hiểu biết của tử linh thuật sĩ ngày càng sâu sắc, nàng khám phá ranh giới chao đảo giữa sự sống và sự chết. Khi nàng thét lên như một hồn báo tang (banshee), nàng có thể dẫn dụ một linh hồn đến hồi kết của nó, làm tăng khả năng gây thương tích chí mạng.#!"
 CTHONIC_WOMB_PERK_EFFECT: "Rút máu một người phàm trong lúc kiếm ăn sẽ triệu hồi họ thành một [GetTrait('wraith').GetName( GetNullCharacter )]"
 CTHONIC_WOMB_PERK_FLAVOR: "#flavor Ở đỉnh cao của Con Đường này, một tử linh thuật sĩ kết hợp sự giết chóc và khả năng sinh sản để sinh ra hồn ma của một người phàm mà nàng đã sát hại.#!"

 #Vitreous Path

 EYES_OF_THE_WRAITH_PERK_FLAVOR: "#flavor Bằng cách khơi gợi quyền năng này, tử linh thuật sĩ có thể nhìn thế giới theo cách mà những Oan hồn Không Yên vẫn nhìn.#!"
 AURA_OF_DECAY_PERK_FLAVOR: "#flavor Quyền năng này thúc đẩy số phận tất nhiên của bất kỳ vật vô tri nào lọt vào hào quang khủng khiếp của tử linh thuật sĩ, cho phép ma cà rồng làm bất kỳ vật thể nào phân rã thành một đống đổ nát.#!"
 SOUL_FEASTING_PERK_EFFECT: "Kích hoạt Yến Tiệc Linh Hồn [character_interaction|E] cho phép ngươi rút cạn một [GetTrait('wraith').GetName( GetNullCharacter )] bị ràng buộc để làm dịu cơn đói của mình."
 SOUL_FEASTING_PERK_FLAVOR: "#flavor Yến Tiệc của Pischacha cho phép một ma cà rồng sống nhờ vào những năng lượng entropy phảng phất khắp các nơi bị ma ám trên thế gian, hoặc ăn trực tiếp [Corpus|E] của một hồn ma.#!"
 CURSE_OF_THE_MAELSTROM_PERK_EFFECT: "Kích hoạt Lời Nguyền Cuồng Lưu [character_interaction|E] cho phép ngươi khủng bố kinh đô của một nhân vật khác."
 CURSE_OF_THE_MAELSTROM_PERK_FLAVOR: "#flavor Tử linh thuật sĩ có thể nguyền rủa xung quanh mình, triệu hồi các Spectre để gây hỗn loạn và tàn phá.#!"
 NIGHTCRY_PERK_FLAVOR: "#flavor Bằng cách dùng Tiếng Thét Đêm, một tử linh thuật sĩ có thể thể hiện sự tinh thông của mình đối với các thế lực entropy. Nàng có thể hướng nó ra xa đồng minh để trợ giúp họ, hoặc có thể dẫn nó trực tiếp vào kẻ địch để cản trở họ#!"

 #Haunting Path

 SONG_OF_THE_DEAD_PERK_EFFECT: "Mở khóa khả năng gây căng thẳng cho kẻ địch như một [character_interaction|E]"
 SONG_OF_THE_DEAD_PERK_FLAVOR: "#flavor Ma cà rồng tụng niệm, đan xen những lời không nghe được vào bài ca và gieo vào người nghe một nỗi say mê bệnh hoạn với sự chết.#!"
 SUMMON_WISP_PERK_FLAVOR: "#flavor Ma cà rồng truyền những giọt máu của mình bằng năng lượng phù du của [UmbraGlossaryLocalized('shadowlands','Âm Phủ')], triệu hồi một quả cầu ánh sáng chập chờn. Đốm lửa ma trơi này có thể dẫn dụ những người phàm không cảnh giác vào cạm bẫy hoặc tạo ra một sự đánh lạc hướng tinh khôn.#!"
 HARROWING_PERK_EFFECT: "Cải thiện Bài Ca Người Chết [character_interaction|E]"
 HARROWING_PERK_FLAVOR: "#flavor Harrowing kéo dài nỗi khiếp sợ do Bài Ca Người Chết gây ra bằng cách ám ảnh nàng trong giấc ngủ, biến những giấc mơ của nàng thành những cảnh tượng ác mộng về cái chết của chính nàng#!"
 PHANTASMS_PERK_FLAVOR: "#flavor Ma cà rồng tạo hình năng lượng của [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] thành những cảnh ảo giác công phu khủng bố người sống.#!"
 SPECTRAL_MENACING_PERK_EFFECT: "Số lượng tối đa $POD_splat_wraith_plural$ bị ràng buộc: #P +3#!."
 SPECTRAL_MENACING_PERK_FLAVOR: "#flavor Ma cà rồng xé rách tấm màn ngăn giữa sự sống và [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] quanh nạn nhân của mình, gọi những hồn ma hiểm độc đến ám ảnh nàng.#!"

 #Cenotaph Path

 TOUCH_OF_DEATH_PERK_EFFECT: "TODO"
 TOUCH_OF_DEATH_PERK_FLAVOR: "#flavor Tử linh thuật sĩ được điều hòa với năng lượng còn sót lại từ lối đi hoặc sự chạm của một hồn ma, cho phép nàng xác định liệu một vật thể, con người, hay khu vực có bị một hồn ma chạm vào hay ảnh hưởng hay không.#!"
 REVEAL_THE_CATENE_PERK_EFFECT: "TODO"
 REVEAL_THE_CATENE_PERK_FLAVOR: "#flavor Tử linh thuật sĩ nhận ra dấu vết tàn tro mà người chết để lại trên các vật thể, cho phép nàng phân biệt giữa những đồ chơi của hồn ma và [Fetters|E].#!"
 TREAD_UPON_THE_GRAVE_PERK_EFFECT: "TODO"
 TREAD_UPON_THE_GRAVE_PERK_FLAVOR: "#flavor Tử linh thuật sĩ cảm nhận được khi mình đến gần thế giới người chết. Một tử linh thuật sĩ có thể dùng giác quan tự nhiên của mình, trong khi một tử linh thuật sĩ khác có thể chiêm bốc, nhưng cả hai đều có thể cảm nhận được nơi [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] tiếp xúc với thế giới người sống.#!"
 DEATH_KNELL_PERK_EFFECT: "TODO"
 DEATH_KNELL_PERK_FLAVOR: "#flavor Tử linh thuật sĩ cảm nhận được khi mình đến gần thế giới người chết. Một tử linh thuật sĩ có thể dùng giác quan tự nhiên của mình, trong khi một tử linh thuật sĩ khác có thể chiêm bốc, nhưng cả hai đều có thể cảm nhận được nơi [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] tiếp xúc với thế giới người sống.#!"
 EPHEMERAL_BINDING_PERK_EFFECT: "TODO"
 EPHEMERAL_BINDING_PERK_FLAVOR: "#flavor Bằng cách truyền năng lượng tàn tro của chính mình vào một vật thể, con người, hay địa điểm, tử linh thuật sĩ có thể tạo ra một [Fetters|E] nhân tạo thay vì phải phụ thuộc vào việc tìm được một cái ngẫu nhiên.#!"

 # Potence # 
 
 BRUTAL_FEED_PERK_EFFECT: "Mở khóa một chiêu thức [single_combat_duel|E].\n#flavor Chỉ trong vài giây, ngươi nuốt trọn những dòng máu cuồn cuộn trong lúc hành hạ nạn nhân của mình. Kết quả hiệu quả nhưng bừa bộn. Giờ đây ngươi có thể dùng cách kiếm ăn mới này ngay trong lúc giao tranh và có thể che giấu thi thể bị xé nát của nạn nhân.#!"
 DRAUGHT_OF_MIGHT_PERK_EFFECT: "Như một lựa chọn [Glossary('Draught','game_concept_blood_draught_desc')] [character_interaction|E], ngươi có thể tặng cho ai đó sức mạnh siêu nhiên của mình.\n#flavor Máu ngươi trở nên bão hòa với sức mạnh của Potence, truyền một phần sức mạnh của ngươi cho bất kỳ ai uống nó.#!"
 EARTHSHOCK_PERK_EFFECT: "#flavor Sức mạnh của ngươi trở thành một thế lực nguyên tố. Ngươi có thể đập nắm tay hoặc chân xuống mặt đất, tạo ra một đợt sóng xung kích đánh ngã đối phương và phá hủy công trình.#!"
 FISTS_OF_CAINE_PERK_EFFECT: "Ngươi có cơ hội tăng thêm để gây thương tích nặng cho [knights|E] của địch trong [combat_phase|E] khi làm [knight|E].\n#flavor Đôi tay không của ngươi có thể gây ra những vết thương nghiêm trọng, chí mạng với cả người phàm và ma cà rồng khác. Chúng có thể chặt đứt chân tay, xuyên thấu, đâm xiên, chặt đầu, và thậm chí xé toạc tim ra khỏi lồng ngực.#!"
 LETHAL_BODY_PERK_EFFECT: "Ngươi có cơ hội tăng thêm để gây thương tích cho [knights|E] của địch trong [combat_phase|E] khi làm [knight|E].\n#flavor Dùng quyền năng này, ngươi có khả năng gây ra thiệt hại khủng khiếp, xé rách da và bẻ gãy xương chỉ bằng tay không.#!"
 PROWESS_PERK_EFFECT: "#flavor Ma cà rồng có Potence nhận được sức mạnh lớn hơn nhiều từ Máu của mình so với những kẻ không có nó.#!"
 SOARING_LEAP_PERK_EFFECT: "#flavor Sở hữu sức mạnh tà ác không chỉ ở tay và nắm đấm, ngươi có thể nhảy cao hơn và xa hơn bất kỳ người phàm nào.#!"
 UNCANNY_GRIP_PERK_EFFECT: "$countermeasures_unlocks_t3_redouble_guards$ \n #flavor Tập trung sức mạnh khác thường của ngươi vào ngón chân và ngón tay, cú nắm của ngươi bám chặt các đầu chi vào hầu như mọi bề mặt, cho phép ngươi trèo lên và thậm chí treo mình không cần điểm tựa từ tường và trần nhà.#!"
 RELENTLESS_PURSUIT_PERK_EFFECT: "#F Hậu duệ Cain thực hiện những bước nhảy phi thường trong không khí.#!"
 CRUSH_PERK_EFFECT: "Trao [GetModifier('crush_perk_knight_modifier').GetNameWithTooltip] [modifier|E] cho [knights|E] của địch khi làm [commander|E] trong [combat_phase|E], hoặc cho kẻ địch của ngươi trong [single_combat_duel_plural|E].\nGây cho mọi lãnh chủ ở phía đối lập [GetModifier('crush_perk_ruler_modifier').GetNameWithTooltip] khi tham gia một [war|E].\n#F Hậu duệ Cain với một cú tấn công thành công vào một vật thể sẽ tự động phá hủy nó.#!"
 FIST_OF_THE_TITANS_PERK_EFFECT: "Như một [character_interaction|E], cho phép ngươi gây thương tích cho mọi hiệp sĩ của mục tiêu.\n#F Hậu duệ Cain tấn công hoặc hất kẻ khác đi bằng năng lực thần giao.#!"
 THE_FORGERS_HAMMER_PERK_EFFECT: "$unlock_enhancing_node$ [GetModifier('artifact_prowess_1_modifier').GetNameWithTooltip]\n#F Hậu duệ Cain tạo ra những vũ khí gây thêm thiệt hại.#!"
 LEND_THE_SUPERNATURAL_VIGOR_PERK_EFFECT: "Như một [character_interaction|E], cho phép ngươi trao dũng mãnh của mình cho mục tiêu.\n#F Hậu duệ Cain trao sức mạnh phi thường của mình cho người khác.#!"
 MIGHT_OF_THE_HEROES_PERK_EFFECT: "#F Hậu duệ Cain thực hiện những kỳ công thể chất mang tầm vóc thần thoại.#!"

 # Presence # 

 AWE_PERK_EFFECT: "Mở khóa [GetScheme('befriend').GetTypeName] [scheme|E].\n#F Bất kỳ ai ở gần ma cà rồng đều thấy sự chú ý của mình bị lôi kéo về phía họ một cách khó hiểu. Những người đang nghe ma cà rồng nói có thể bất ngờ đồng thuận về những vấn đề mà trước đó họ có quan điểm khác nhau.#!"
 DAUNT_PERK_EFFECT: "#F Thay vì thu hút người khác, ma cà rồng dùng Presence để đẩy lùi. Với quyền năng này, người sử dụng trông có vẻ đe dọa và toát ra một hào quang đầy hăm dọa mạnh đến mức khiến hầu hết người phàm tránh sự chú ý của họ và cả ma cà rồng khác cũng phải nghĩ lại trước khi hành động chống lại họ.#!"
 DREAD_GAZE_PERK_EFFECT: "#F Bằng cách lộ ra bản chất ma cà rồng của mình trong khoảnh khắc, người sử dụng gieo vào một mục tiêu duy nhất nỗi khiếp sợ tuyệt đối.#!"
 ENTRANCEMENT_PERK_EFFECT: "Kích hoạt [GetScheme('PODentrance').GetTypeName] [scheme|E].\n#F Ma cà rồng tập trung sự lôi cuốn khác thường của mình vào một người duy nhất, gieo vào họ một nỗi say mê hoặc mê đắm sâu sắc tương tự như yêu say đắm hoặc gặp được thần tượng cả đời.#!"
 LINGERING_KISS_PERK_EFFECT: "Khi ngươi đi săn, ngươi có thể chọn thêm nạn nhân của mình vào [POD_herd|E].\n#F Nụ Cắn của một ma cà rồng gây khoái cảm gần như tuyệt đỉnh cho người phàm, nhưng quyền năng này bỏ xa mọi Nụ Cắn khác. Người phàm bị người sử dụng hút máu trở nên nghiện Nụ Cắn, ám ảnh về nó và thậm chí tìm đến ma cà rồng để được hút máu thêm nhiều lần.#!"
 MAJESTY_PERK_EFFECT: "$countermeasures_unlocks_t4_strengthen_sentries$ \n Ngươi mở khóa một lựa chọn tốt hơn cho che đậy màn che [character_interaction|E].\n#F Ở đỉnh cao của $pod_discipline$ này, ma cà rồng có thể khuếch đại dung mạo của mình lên tầm siêu nhiên. Trải nghiệm Majesty là được ở trong sự hiện diện của thần thánh - hoặc của địa ngục.#!"
 SUMMON_PERK_EFFECT: "Kích hoạt [GetScheme('PODsummon').GetTypeName] [scheme|E].\n#F Ma cà rồng có thể gọi đến bên mình bất kỳ ai, người phàm hay ma cà rồng, mà họ đã từng dùng Awe, Entrancement, hoặc Majesty lên, hoặc người đã từng nếm Máu của họ ít nhất một lần.#!"
 IRONCLAD_COMMAND_PERK_EFFECT: "Cải thiện cơ hội thành công của các quyền năng Presence trước đó"
 COOPERATION_PERK_EFFECT: "$countermeasures_unlocks_t4_bounties_for_whispers$ \n [peace|E] Chấp thuận: #P +[EmptyScope.ScriptValue('cooperation_value')|0]#!"
 PHOBIA_PERK_EFFECT: "Nhận [GetModifier('phobia_5_modifier').GetNameWithTooltip] khi làm [commander|E] trong [combat_phase|E].\nĐộ mạnh của hiệu ứng này dựa trên [dread|E] hiện tại của ngươi."
 MASK_OF_EMPATHY_PERK_EFFECT: "Như một [character_interaction|E], chấm dứt các quan hệ của mục tiêu.\n#F Cắt đứt các liên kết cảm xúc giữa người với người.#!"
 BLOODLUST_PERK_EFFECT: "Cải thiện hiệu ứng từ [GetPerk('phobia_perk').GetName(GetPlayer)] thành [GetModifier('bloodlust_5_modifier').GetNameWithTooltip]."
 PERFECT_WORLD_PERK_EFFECT: "Như một [character_interaction|E], cải thiện kinh đô của ngươi bằng [GetModifier('perfect_world_development_modifier').GetNameWithTooltip] hoặc [GetModifier('perfect_world_war_modifier').GetNameWithTooltip].\n#F Sự tinh thông cảm xúc của ngươi đã phát triển đến mức bao trùm cả một thành phố, buộc mọi công dân của nó phải làm việc để biến nó thành thành phố lý tưởng của ngươi.#!"

 # Kai # 

 INNER_FOCUS_PERK_EFFECT: "Nếu ngươi theo một tín ngưỡng tự chủ, ngươi có thể dùng sức mạnh của máu mình để ngăn chặn cuồng nộ.\n#F Khát khao mãnh liệt của ngươi để giữ vững danh dự của mình là một phần trong máu của ngươi.\nNgươi có thể vận dụng sức mạnh của máu mình để ngăn chặn cuồng nộ mà có thể đã gây ra sự thất tiết.#!"
 FOCUSED_STRIKE_PERK_EFFECT: "#F Tương tự như những cú đánh chính xác của một võ sĩ, ngươi có thể tập trung nội lực của mình vào một đòn đánh mạnh mẽ duy nhất, tung ra với lực đủ mạnh để hất kẻ địch bay đi.#!"
 HONORABLE_ELIXIR_PERK_EFFECT: "#F Máu của ngươi trở thành một chất linh thiêng khiến những ai uống nó phải hành động một cách danh dự nếu không sẽ chịu hậu quả.#!"
 SHIELD_FROM_FIRE_PERK_EFFECT: "Ban cho sự bảo vệ khỏi lửa.\n#F Ngươi có thể tập trung nội lực của mình vào một lá chắn bảo vệ ngươi khỏi những kẻ muốn hại ngươi và thậm chí bảo vệ bản thân khỏi lửa.#!"
 DAIMYOS_LAW_PERK_EFFECT: "Mở khóa [GetScheme('abduct').GetTypeName] [scheme|E] và cho phép ngươi mua tuyên bố lên hiện vật với mức giảm giá 15%.\n#F Ngươi có thể buộc ai đó cảm thấy có nghĩa vụ phải thực hiện một việc cho ngươi.#!"
 KAI_ELDER_1_PERK_EFFECT: "Biến thể [prowess|E] của Máu Dâng Trào cho thêm 5 dũng mãnh.\n#F Khi ngươi tập trung máu mình vào việc chiến đấu, nó gây ra một trạng thái ngây ngất giống như xuất thần trong đó ngươi chiến đấu với sự cuồng nộ và danh dự xứng với một daimyo thực sự.#!"
 KAI_ELDER_2_PERK_EFFECT: "Cho một quyết định để mở khóa một đội quân [men_at_arms|E] mới duy nhất từ những lựa chọn này:\n$BULLET_WITH_TAB$[GetMaA('POD_ronin_hatamoto').GetName]\n$BULLET_WITH_TAB$[GetMaA('POD_ronin').GetName]\n$BULLET_WITH_TAB$[GetMaA('POD_yumihiki').GetName]\n$BULLET_WITH_TAB$[GetMaA('POD_yumihiki_riders').GetName]\n$BULLET_WITH_TAB$[GetMaA('POD_sojutsuka').GetName]\n$BULLET_WITH_TAB$[GetMaA('POD_sojutsuka_riders').GetName]\n#F Sự hiện diện thuần túy của máu ngươi gây ra hiệu ứng tương tự luật của daimyo, nhưng quyền năng này khi tập trung vào một cách tiếp cận chiến đấu cụ thể bắt nguồn từ chính gốc rễ của dị năng này; có tác động khác thường và đáng kể lên người phàm khiến họ áp dụng các phong cách chiến đấu bản địa của vùng đất mà nó bắt nguồn, cũng như đáng chú ý là ban cho họ khả năng siêu nhiên và khiến họ tôn kính ngươi trong chiến đấu.#!"
 KAI_ELDER_3_PERK_EFFECT: "Ban cho khả năng phòng vệ tinh thần mạnh mẽ.\n#F Với sức mạnh ý chí, ngươi có thể chiến đấu một cách dữ dội đến giây phút cuối cùng và với tâm trí tập trung, ngươi có thể dễ dàng gạt bỏ các mưu đồ lừa dối tâm trí.#!"
 KAI_ELDER_4_PERK_EFFECT: "Tự làm mình bị thương và hy sinh một thành viên clan bị giam giữ hoặc một trong các Bộc huyết của ngươi để cố gắng giết mục tiêu của ngươi. Nếu mục tiêu có khả năng phòng vệ, điều này sẽ gây thương tích thay vào đó.\n#F Xé ra từ chính mình một mảnh sức mạnh của ngươi, cùng với sự hy sinh sinh lực của một người có chung dòng máu với ngươi, ngươi có thể tung ra một đòn đánh mạnh mẽ đến kinh ngạc. Đòn đánh này sẽ tìm đến và tiêu diệt mục tiêu của ngươi từ hàng trăm cây số xa.#!"
 KAI_ELDER_5_PERK_EFFECT: "Mở khóa một tương tác nhân vật để phá hoại các chỉ huy của mục tiêu ngươi.\n#F Buông ra một dòng máu cuộn trào dường như vô tận để rình rập và tấn công dữ dội những kẻ ngươi chọn sử dụng quyền năng này lên, những kẻ bị vây hãm sẽ gặp khó khăn lớn trong việc di chuyển và tiếp tế quân đội của họ.#!"
 KAI_ELDER_6_PERK_EFFECT: "Tăng cường tương tác nhân vật Cuồng Phong Đỏ.\n#F Những dòng máu cuộn trào của ngươi giờ đây có thể hợp nhất thành những đòn đánh thực sự có tác động lớn, mô phỏng cả vẻ ngoài đáng sợ và hiệu ứng tàn phá của những cơn sóng thần.#!"

 # Rift #

 THE_JOINING_PERK_EFFECT: "#F Giờ đây ngươi có thể giao tiếp với người khác bằng thần giao cách cảm.#!"
 GLIMPSE_OF_THE_PAIN_PERK_EFFECT: "Như một [character_interaction|E], hạ [advantage|E] và [prowess|E] của mục tiêu ngươi trong một thời gian ngắn.\n#F Chỉ trong một khoảnh khắc, ngươi có thể kéo người khác vào cõi thống khổ của ngươi.#!"
 CROSSING_THE_IRON_BRIDGE_PERK_EFFECT: "Mở khóa một sự kiện [mental_break|E] cấp 3 độc nhất (Với thời gian hồi 6 năm).\n#F Giờ đây ngươi có thể đối diện với những con quỷ nội tâm của mình bằng cách bước vào rift của ngươi. Chỉ những vật phẩm cá nhân mới có thể được mang theo cùng ngươi.\nĐây không phải là một trải nghiệm dễ chịu, nhưng có thể mang lại một khoảnh khắc nghỉ ngơi khỏi những mưu đồ và phản trắc không ngừng mà đời sống ma cà rồng đòi hỏi.#!"
 JOURNEYING_THE_IRON_BRIDGE_PERK_EFFECT: "#F Vật phẩm không còn cần một sự gắn bó cá nhân để bước vào rift của ngươi.#!"
 PASSING_THE_INNER_REALM_PERK_EFFECT: "Như một [character_interaction|E], nhận hoặc mất [GetModifier('passing_the_inner_realm_modifier').GetNameWithTooltip].\n#F Ngươi có thể biến mất hoàn toàn bằng cách bước vào rift của mình và di chuyển đến một địa điểm mới mà ngươi có thể nhìn thấy. Tuy nhiên, dù điều này bỏ qua các trở ngại, nó không diễn ra ngay lập tức, đòi hỏi ngươi phải vượt qua cùng khoảng cách đó trong rift của mình như khi di chuyển đến đó mà không có rift.\nDùng Rift trong giao tranh rất hiệu quả, cho phép ngươi tránh những cú đánh mà hầu hết người khác không thể tránh được, dù để sử dụng nó hiệu quả trong giao tranh đòi hỏi sử dụng thường xuyên, điều này khá căng thẳng cho tâm trí.#!"
 RIFT_COLLECTION_PERK_EFFECT: "Cho phép ngươi mua tuyên bố lên hiện vật với mức giảm giá #V 15%#!.\n#F Giờ đây ngươi có thể gửi các vật vô tri vào rift của mình chỉ bằng một cái chạm, hoặc gọi chúng về theo ý muốn.#!"
 RIFT_TRANSPORT_PERK_EFFECT: "#F Ngươi có thể chạm vào một vật thể để di chuyển nó đến một nơi trong tầm nhìn (Khoảng cách thay đổi tùy theo khả năng Rift của người sử dụng).#!"
 EYES_OF_A_THIEF_PERK_EFFECT: "[planning_speed|E] nhanh hơn 80% cho [infiltration_missions|E] Cướp Hiện Vật.\n#F Tương tự như cả collection và transport, nhưng ngươi không còn cần chạm vào vật thể để gửi chúng vào một rift, ngươi chỉ cần nhìn thấy chúng.#!"
 DOORWAY_TO_HELL_PERK_EFFECT: "Như một [character_interaction|E], dịch chuyển về kinh đô của ngươi khi di chuyển hoặc dẫn quân.\n#F Điều này khác với các cách sử dụng Rift khác vì nó cho phép thiết lập một địa điểm rift vĩnh viễn mà ngươi có thể tạm thời liên kết rift của mình về đó, mà bất kỳ ai cũng có thể bước vào.\nNó tương tự như một dư âm của rift ác mộng của ngươi cho phép di chuyển gần như ngay lập tức, cho phép vô số người khác theo cùng ngươi. Ngươi không thể duy trì nó vô hạn, không thể đi qua cánh cửa để trở về nơi ngươi đã ở trước đó và chỉ một cánh cửa có thể hoạt động vào một thời điểm bất kỳ.\nBất kỳ ai ngoài ngươi sẽ chịu hiệu ứng giống với [GetPerk('glimpse_of_the_pain_perk').GetName(GetPlayer)].#!"
 TOUCH_OF_SIN_PERK_EFFECT: "Mở khóa [GetScheme('abduct').GetTypeName] [scheme|E].\n#F Giờ đây ngươi có thể buộc người khác vào rift bình thường của mình bằng cách tóm lấy họ.#!"
 RIFT_GATEWAY_PERK_EFFECT: "Nâng cấp hiệu ứng từ [GetPerk('passing_the_inner_realm_perk').GetName(GetPlayer)] thành [GetModifier('rift_gateway_modifier').GetNameWithTooltip].\n#F Gateway cho phép ngươi gửi một người qua rift của mình bằng cách chạm vào họ theo cách tương tự [GetPerk('passing_the_inner_realm_perk').GetName(GetPlayer)].\nHãy cẩn trọng với những người dùng Rift ngắm nhìn bầu trời đêm, nhìn chằm chằm vào một đám lửa gầm hoặc mối nguy hiểm khác vì ngươi có thể thấy mình rơi thẳng từ bầu trời đêm hoặc bị thiêu cháy chỉ khoảnh khắc sau đó.#!"
 RIFT_IMPRISON_PERK_EFFECT: "Tù nhân của ngươi hầu như không có cơ hội trốn thoát. Cũng mở khóa một lựa chọn mới khi một nhân vật cố gắng chống lại việc bị giam giữ.\n#F Giờ đây ngươi có thể giữ người trong rift của mình vô hạn, điều gần như không thể trốn thoát, cho dù bằng phương tiện phàm tục hay siêu nhiên.\nChỉ những kẻ may mắn nhất mới có cơ hội trốn thoát nếu họ có thể tìm thấy một cổng nào đó còn hoạt động.#!"


 # Protean #
 
 EARTH_MELD_PERK_EFFECT: "#F Hòa mình thành một với đất, ma cà rồng chìm vào lòng đất. Trừ khi đang trong $pod_torpor$, ma cà rồng sẽ trỗi dậy vào đêm hôm sau.#!"
 EYES_OF_THE_BEAST_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$\nNhư một lựa chọn [shapeshift|E], giờ đây ngươi có thể kích hoạt [GetModifier('POD_shapeshift_form_beasteyes_modifier').GetNameWithTooltip].\n#F Ma cà rồng có thể ý chí một tia sáng đỏ siêu nhiên vào mắt mình, cho họ khả năng nhìn thấy ngay cả trong tối tăm hoàn toàn.#!"
 FERAL_WEAPONS_PERK_EFFECT: "Như một lựa chọn [shapeshift|E], ngươi có thể phát triển móng vuốt mình thành [GetModifier('POD_shapeshift_form_feralweapons_modifier').GetNameWithTooltip].\n#F Ma cà rồng có thể kéo dài vũ khí tự nhiên của mình đến kích thước quái dị.#!"
 METAMORPHOSIS_PERK_EFFECT: "Như một lựa chọn [shapeshift|E], giờ đây ngươi có thể biến hình thành những dạng thú nhỏ hơn.\n#F Khả năng mang hình dạng một con vật của ngươi đã tăng trưởng.#!"
 MIST_FORM_PERK_EFFECT: "Như một lựa chọn [shapeshift|E], giờ đây ngươi có thể biến thành một [GetModifier('POD_shapeshift_form_mist_modifier').GetNameWithTooltip] khó nắm bắt.\n#F Ma cà rồng nhận được quyền năng huyền thoại biến thành một làn sương mù, có thể thấy được bằng mắt nhưng không thể chạm vào ngoại trừ lửa, ánh sáng mặt trời, và sự tấn công siêu nhiên.#!"
 SHAPECHANGE_PERK_EFFECT: "Như một lựa chọn [shapeshift|E], giờ đây ngươi có thể biến hình thành một dạng thú.\n#F Ma cà rồng có thể mang hình dạng một con vật, thường là loài gắn liền với $pod_clan$ của họ hoặc loại con mồi họ thường săn nhất.#!"
 THE_UNFETTERED_HEART_PERK_EFFECT: "#F Đã tinh thông quyền năng của Protean, chính phần bên trong của người sử dụng trở nên dẻo dai, gần như nhớt. Trái tim, nơi ngự trị của $pod_vitae$ và cuộc phi-sinh của ma cà rồng, tách ra và di chuyển tự do, dù chậm chạp, trong lồng ngực.#!"
 WEIGHT_OF_THE_FEATHER_PERK_EFFECT: "#F Ma cà rồng có thể giảm khối lượng và mật độ thực của mình, làm bản thân gần như không có trọng lượng.#!"
 ADAPTABILITY_PERK_EFFECT: "#F Điều chỉnh bản thân để sống sót trong các môi trường khắc nghiệt.#!"
 HOMUNCULUS_PERK_EFFECT: "Như một [character_interaction|E], cho phép ngươi tạo ra một bản sao [GetTrait('mortal').GetName( GetPlayer )] của chính mình.\n#F Tạo ra một phiên bản thu nhỏ của chính mình để làm nô bộc.#!"
 TURNABOUT_PERK_EFFECT: "#F Nhanh chóng đổi vị trí bằng cách di chuyển qua lòng đất.#!"
 MYTHIC_FORM_PERK_EFFECT: "Cho phép biến hình thành nhiều dạng đã mất từ xa xưa.\n#F Biến thành một sinh vật huyền thoại cụ thể.#!"
 ADAPTATION_PERK_EFFECT: "#F Cơ thể ngươi tự động thay đổi để mang lại sự bảo vệ tối đa.#!"
 DRAUGHT_OF_PHOENIX_BLOOD_PERK_EFFECT: "Cho phép hồi sinh nếu ngươi chết vì nguyên nhân phi tự nhiên.\n#F Một số ngày bằng với thế hệ của ma cà rồng sau Cái Chết Cuối Cùng, họ sẽ đầu thai vào một thân xác mới, cao hơn một thế hệ, giữ lại quyền năng này nhưng với một bức tranh không đầy đủ về việc họ từng là ai.#!"
 
 # Obtenebration #
 
 EYES_OF_THE_ABYSS_PERK_EFFECT: "Như một lựa chọn [shapeshift|E], nhận [GetModifier('POD_shapeshift_form_abysseyes_modifier').GetNameWithTooltip].\n#F Mắt của Ma cà rồng chuyển thành màu đen. Họ không chịu mọi hình phạt bóng tối, thậm chí cả những hình phạt do bóng tối siêu nhiên gây ra, và có thể nhìn thấy hồn ma.#!"
 SHADOW_PLAY_PERK_EFFECT: "#F Dù khả năng này không cho phép nhân vật tạo ra những bóng tối không tồn tại sẵn, nó cho phép người sử dụng điều khiển, di chuyển, và tạo sinh khí cho các bóng tối xung quanh. Điều này có thể mang lại hiệu ứng xã hội, chẳng hạn như dùng bóng tối để làm bản thân trông uy nghi hơn, hoặc định hình một môi trường phù hợp với nhu cầu của ngươi, tạo ra các vùng bóng tối để giấu một người hoặc vật thể.#!"
 NOCTURNE_PERK_EFFECT: "Như một [character_interaction|E], chuyển đổi [GetModifier('nocturne_power_modifier').GetNameWithTooltip].\nTrong khi nó đang hoạt động, gây [GetModifier('nocturne_drained_stamina_modifier').GetNameWithTooltip] cho [knights|E] của địch khi làm [commander|E] trong [combat_phase|E], hoặc cho kẻ địch của ngươi trong [single_combat_duel_plural|E].\nĐiều này tốn #N 10#![piety_i] cho mỗi kẻ địch bị ảnh hưởng.\n#F Bằng cách tập trung triệu hồi bóng tối, Lasombra với khả năng này có thể triệu hồi một đám mây bóng tối siêu nhiên quằn quại để nhấn chìm một khu vực và che khuất mọi nguồn ánh sáng. Bóng tối này là một biểu hiện của Abyss làm nghẹt âm thanh và tầm nhìn, và bóp nghẹt sự sống khỏi những kẻ yếu.#!"
 NIGHT_SHADES_PERK_EFFECT: "Có thể tuyển mộ [GetMaA('shades').GetName] làm [men_at_arms|E]"
 ARMS_OF_AHRIMAN_PERK_EFFECT: "#F Với khả năng này, một Lasombra tạo hình bóng tối thành những xúc tu có thể tấn công, kìm giữ, và vật ngã kẻ địch.#!"
 TENEBROUS_AVATAR_PERK_EFFECT: "Như một lựa chọn [shapeshift|E], biến thành [GetModifier('POD_shapeshift_form_shadow_modifier').GetNameWithTooltip].\n#F Sự tinh thông bóng tối của ma cà rồng rộng lớn đến mức họ có thể tự mình hóa thân thành nó. Khi kích hoạt quyền năng này, ma cà rồng biến thành một mảng bóng tối như mực, hình dạng amip.#!"
 THE_DARKNESS_WITHIN_PERK_EFFECT: "Cải thiện hiệu ứng từ [GetPerk('nocturne_perk').GetName(GetPlayer)] thành [GetModifier('darkness_within_drained_stamina_modifier').GetNameWithTooltip].\nNgoài ra, ngươi còn rút #V 1#! $POD_energy_blood$ từ mục tiêu bị ảnh hưởng.\nĐiều này tốn #N 15#![piety_i] cho mỗi kẻ địch bị ảnh hưởng."
 OUBLIETTE_PERK_EFFECT: "Mở khóa [GetScheme('abduct').GetTypeName] [scheme|E]"
 WALK_THE_ABYSS_PERK_EFFECT: "#F Bằng cách đi qua Abyss, khả năng này cho phép một nhân vật bước vào một mảng bóng tối và xuất hiện từ một mảng bóng tối thứ hai trong tầm mắt. Nhân vật cũng có thể dùng khả năng này để mở rộng tầm với vào một bóng tối và nắm lấy thứ gì đó trong tầm với của một bóng tối thứ hai.#!"
 DRAIN_THE_LIFE_PERK_EFFECT: "Như một [character_interaction|E], gây cho kinh đô của mục tiêu ngươi [GetModifier('drain_the_life_power_modifier').GetNameWithTooltip].\n#F Chỉ với một cái vẩy cổ tay, ma cà rồng mở toang thế giới ra với Abyss, tạo ra một hố trống hình cầu đáng sợ trong không khí. Khi nó khép lại, cả bạn và địch đều bị thương và có thể bị hủy diệt. Những kẻ đã chết (hoặc gần chết) bị cuốn vào chốn không có gì. Mọi dấu tích của họ đơn giản là biến mất.#!"
 DARK_WHISPERS_PERK_EFFECT: "#F Với khả năng này, một nhân vật có thể dùng những bóng tối gần đó để phóng chiếu cảm xúc của mình vào.#!"
 GOD_IN_DARKNESS_PERK_EFFECT: "Cải thiện hiệu ứng từ [GetPerk('tenebrous_avatar_perk').GetName(GetPlayer)] thành [GetModifier('POD_shapeshift_form_shadow_god_in_darkness_modifier').GetNameWithTooltip]."
 DARKSIGHT_PERK_EFFECT: "Cải thiện hiệu ứng từ [GetPerk('eyes_of_the_abyss_perk').GetName(GetPlayer)] thành [GetModifier('POD_shapeshift_form_darksight_modifier').GetNameWithTooltip]."
 SHADOWSTEP_PERK_EFFECT: "#F Ma cà rồng biến mất vào bóng tối, lướt qua [UmbraGlossary('pod_realm_labyrinth')] để hiện lại sau khi vượt qua thứ gì đó tồi tệ hơn cả cái chết và đói khát gấp đôi. Họ bước vào một bóng tối đủ lớn để che phủ mình, và hiện lại từ một bóng tối họ có thể thấy.#!"
 SHADOW_TWIN_PERK_EFFECT: "Như một [character_interaction|E], cho phép ngươi tạo ra một bản sao bóng tối của chính mình.\n#F Sự kiểm soát bóng tối của ma cà rồng đã tiến triển đến một mức độ mà họ có thể ban cho nó một mức độ tri giác hạn chế. Bằng cách tạo sinh khí cho bóng của chính mình, $pod_cainite$ thực sự có thể 'giải phóng' bóng đổ bởi ánh sáng. Trong khi quyền năng này đang hoạt động, đối tượng không đổ bóng, vì nó đã rời đi để thực hiện lệnh của ma cà rồng.#!"
 AEGIS_OF_SHADOWS_PERK_EFFECT: "#F Che phủ bản thân trong lớp giáp bóng tối mạnh mẽ.#!"
 DEVOUR_ALL_HOPE_PERK_EFFECT: "Cải thiện hiệu ứng từ [GetPerk('nocturne_perk').GetName(GetPlayer)] thành [GetModifier('devour_all_hope_drained_stamina_modifier').GetNameWithTooltip].\nNgoài ra, giờ đây ngươi rút #V 2#! $POD_energy_blood$ từ mục tiêu bị ảnh hưởng.\nĐiều này tốn #N 25#![piety_i] cho mỗi kẻ địch bị ảnh hưởng."
 AHRIMANS_DEMESNE_PERK_EFFECT: "Cải thiện [GetPerk('drain_the_life_perk').GetName(GetPlayer)] bằng cách cho phép nó nhắm vào toàn bộ một vương quốc."
 
 # Serpentis #
 
 ENCHANTING_GAZE_PERK_EFFECT: "#flavor Quyền năng này khiến ma cà rồng trở thành ngọn lửa dụ thiêu thân theo đúng nghĩa. Họ mang một đặc điểm mê hoặc, lôi cuốn, chẳng hạn như đôi mắt vàng của loài rắn hoặc một ánh bóng xà cừ trên da. Họ có thể làm liệt người khác chỉ bằng một ánh nhìn, và người phàm ở gần họ thấy mình bị lôi cuốn về phía họ.#!"
 SERPENTS_FLESH_PERK_EFFECT: "Như một lựa chọn [shapeshift|E], nhận [GetModifier('POD_shapeshift_form_serpents_flesh_modifier').GetNameWithTooltip].\n#flavor Với quyền năng này, làn da của ma cà rồng trở nên như da thuộc, có vảy, nhớp nháp, và quái dị theo cách khác. Thân thể họ trở nên linh hoạt và dẻo dai, và họ trở nên khó bị thương hơn.#!"
 TYPHONIC_MAW_PERK_EFFECT: "Mở khóa một chiêu thức [single_combat_duel|E].\n#flavor Quai hàm của ma cà rồng trở thành một thứ hung tàn, dẻo dai mà họ có thể điều khiển theo nhiều cách. Hàm của họ vươn dài đến lồng ngực, răng nanh của họ mọc lớn bằng những chiếc dao nhỏ, lưỡi họ chẽ đôi ở đầu và vươn ra dài cả mét, và cổ họng họ giãn rộng để nuốt chửng bất cứ thứ gì họ có thể há miệng ra được.#!"
 MASTER_OF_SNAKES_PERK_EFFECT: "Có thể tuyển mộ [GetMaA('snakes').GetName] làm [men_at_arms|E]."
 SMOOTH_SCALES_PERK_EFFECT: "Cải thiện hiệu ứng từ [GetPerk('serpents_flesh_perk').GetName(GetPlayer)] thành [GetModifier('POD_shapeshift_form_smooth_scales_modifier').GetNameWithTooltip]."
 FORM_OF_THE_SNAKE_PERK_EFFECT: "Như một lựa chọn [shapeshift|E], biến thành [GetModifier('POD_shapeshift_form_snake_modifier').GetNameWithTooltip] hoặc [GetModifier('POD_shapeshift_form_giantserpent_modifier').GetNameWithTooltip]."
 TYPHONIC_AVATAR_PERK_EFFECT: "Như một lựa chọn [shapeshift|E], biến thành [GetModifier('POD_shapeshift_form_typhonic_avatar_modifier').GetNameWithTooltip].\n#flavor Ma cà rồng có thể biến thành một Typhonic Beast, một sinh vật huyền thoại. Nó đứng như một con chó rừng cao lớn với một cái đuôi cứng, chẽ đôi và có gai, với đôi tai nhọn hoắt và một mõm dài. Ngoài ra, họ có thể mang một hình dạng lai người/rắn với một cái đuôi dài, có thể cầm nắm dùng làm chân. Hình dạng này được dùng như một loại 'hình dạng chiến đấu' bên cạnh chức năng tôn giáo.#!"
 SERPENT_EYES_PERK_EFFECT: "$countermeasures_unlocks_t1_mental_fortress$\nNhư một lựa chọn [shapeshift|E], nhận [GetModifier('POD_shapeshift_form_serpenteyes_modifier').GetNameWithTooltip].\n#flavor Ban cho ma cà rồng ánh nhìn thôi miên huyền thoại của loài rắn. Mắt của ma cà rồng trở thành màu vàng với tròng đen lớn, và người phàm ở gần nhân vật thấy mình bị thu hút một cách lạ lùng về phía họ. Một người phàm nhìn vào ánh mắt mê hoặc của ma cà rồng sẽ bị bất động. Cho đến khi nhân vật rời mắt khỏi nạn nhân, người đó bị đông cứng tại chỗ.#!"
 MOTHER_OF_MONSTERS_PERK_EFFECT: "Có thể tuyển mộ [GetMaA('serpentis_monsters').GetName] làm [men_at_arms|E]."
 FORM_OF_THE_STORM_PERK_EFFECT: "Cải thiện hiệu ứng từ [GetPerk('typhonic_avatar_perk').GetName(GetPlayer)] thành [GetModifier('POD_shapeshift_form_form_of_the_storm_modifier').GetNameWithTooltip]."
 ECHIDNAS_VENOM_PERK_EFFECT: "#flavor Ở cấp độ này, nụ cắn của ma cà rồng trở nên có độc như rắn lục sừng.#!"
 THE_HEART_OF_DARKNESS_PERK_EFFECT: "Như một [character_interaction|E], gỡ bỏ tim của chính mình và nhận [GetModifier('heart_of_darkness_modifier').GetNameWithTooltip].\n#flavor Ma cà rồng thực hiện một nghi lễ trong đó họ gỡ bỏ chính trái tim của mình, trở nên ít cảm xúc hơn và miễn nhiễm với $pod_diablerie$ và việc đóng cọc.#!"
 COBRA_FANGS_PERK_EFFECT: "#flavor Răng nanh của ma cà rồng trở nên có độc.#!"
 APOPHIS_PERK_EFFECT: "Cải thiện hiệu ứng từ [GetPerk('typhonic_avatar_perk').GetName(GetPlayer)] thành [GetModifier('POD_shapeshift_form_apophis_modifier').GetNameWithTooltip]."
 HEART_THIEF_PERK_EFFECT: "Giờ đây ngươi có thể đánh cắp tim từ các nhân vật khác như một âm mưu hoặc từ tù nhân như một [character_interaction|E] đơn giản. Nếu ngươi có tim của ai đó, việc giết họ hoặc buộc họ vào miên trạng trở nên dễ dàng."
 TEMPTATION_PERK_EFFECT: "#flavor Ma cà rồng trở nên vô cùng khó cưỡng lại.#!"
 BREATH_OF_THE_BASILISK_PERK_EFFECT: "#flavor Ma cà rồng có thể phun ra khói độc và ăn mòn.#!"
 GODHEAD_PERK_EFFECT: "Như một lựa chọn [shapeshift|E], biến thành [GetModifier('POD_shapeshift_form_godhead_modifier').GetNameWithTooltip].\n#flavor Khả năng đáng sợ này trao cho ma cà rồng danh hiệu của một vị thần. Trong khi hầu hết các Setite thể hiện quyền năng này bằng cách mang đầu của một con thú tương tự các vị thần Ai Cập, mỗi ma cà rồng thể hiện Godhead theo cách khác nhau. Một số mọc cao thêm cả mét. Một số có làn da vàng óng ánh. Bất kể biểu hiện thế nào, nó luôn rõ ràng và luôn gây kinh ngạc.#!"

 # Visceratika #
 
 SKINOFCHAMELEON_PERK_EFFECT: "$countermeasures_unlocks_t1_obfuscated_court$ \n Như một lựa chọn [shapeshift|E], biến đổi da của ngươi để hòa vào môi trường xung quanh, mang lại lợi thế cho âm mưu và khả năng kháng âm mưu."
 SCRYTHEHEARTHSTONE_PERK_EFFECT: "#flavor Biết được vị trí của các cá nhân trong một công trình. #!"
 BONDWITHTHEMOUNTAIN_PERK_EFFECT: "#flavor Hòa mình một phần vào đá. #!"
 ARMOROFTERRA_PERK_EFFECT: "#flavor Làm cứng da của ngươi để hấp thụ thiệt hại dễ dàng hơn nhiều. #!"
 FLOWWITHTHEMOUNTAIN_PERK_EFFECT: "Tăng cơ hội thành công cho Trốn Khỏi Tù [decision|E].\n#flavor Đi xuyên qua đá. #!"
 DARKSTATUE_PERK_EFFECT: "Miễn nhiễm với các phương thức sát hại bằng lửa và ánh sáng mặt trời.\n#flavor Ngươi không bị ảnh hưởng vật lý bởi ánh sáng mặt trời miễn là ngươi không di chuyển.#!"
 ROCKHEART_PERK_EFFECT: "Giờ đây ngươi miễn nhiễm với việc đóng cọc.\n#flavor Nội tạng của ngươi vôi hóa, giảm thiệt hại đâm xuyên và khiến việc đóng cọc gần như bất khả thi.#!"
 CRAWLINGCHAMBER_PERK_EFFECT: "#flavor Ngươi có thể tạo sinh khí, ban một mức tri giác hạn chế, và điều khiển (ở một mức độ nào đó) một khối đá 10 ft³.#!"
  
 # Temporis #
 
 TIME_SENSE_PERK_EFFECT: "#F Có một đồng hồ nội tại hoàn hảo#!"
 INTERNAL_RECURSION_PERK_EFFECT: "Trao [GetModifier('internal_recursion_perk_modifier').GetNameWithTooltip] [modifier|E] cho [knights|E] của địch khi làm [commander|E] trong [combat_phase|E], hoặc cho kẻ địch của ngươi trong [single_combat_duel_plural|E].\n#F Khiến mục tiêu lặp lại một chuỗi hành động liên tục#!"
 RAMBLE_ON_PERK_EFFECT: "Trao [GetModifier('ramble_on_perk_modifier').GetNameWithTooltip] [modifier|E] cho [knights|E] của địch khi làm [commander|E] trong [combat_phase|E], hoặc cho kẻ địch của ngươi trong [single_combat_duel_plural|E].\n#F Khiến mục tiêu vô thức lặp lại một hành động đơn giản#!"
 LAPSE_PERK_EFFECT: "Trao cho [commanders|E] của địch [GetModifier('lapse_perk_modifier').GetNameWithTooltip] [modifier|E] khi làm [commander|E] trong [combat_phase|E].\n#F Khiến mục tiêu di chuyển chậm hơn trong thời gian#!"
 COWALKER_PERK_EFFECT: "#F Dừng thời gian trong một khoảnh khắc để xuất hiện ở hai nơi cùng lúc#!"
 SUBJECTIVE_SUSPENSION_PERK_EFFECT: "Trao cho [commanders|E] của địch [GetModifier('subjective_suspension_perk_modifier').GetNameWithTooltip] [modifier|E] khi làm [commander|E] trong [combat_phase|E].\n#F Tạm thời treo lửng một vật thể bên ngoài thời gian#!"
 CLOTHOS_GIFT_PERK_EFFECT: "#F Tăng tốc dòng thời gian của ngươi để thực hiện nhiều hành động trong một lượt#!"
 FROZEN_OBJECT_PERK_EFFECT: "#F Dừng thời gian đối với một vật vô tri#!"
 TEMPORIS_INSIGHT_PERK_EFFECT: "#F Bước tới trong thời gian để thấy hành động tiếp theo của ngươi sẽ diễn ra thế nào#!"
 KISS_OF_LACHESIS_PERK_EFFECT: "Với một [character_interaction|E], ngươi có thể thay đổi tuổi thể chất của một mục tiêu.\n#F Thay đổi tuổi pháp lý của một mục tiêu#!"
 HALL_OF_HADES_COURT_PERK_EFFECT: "#F Thay đổi dòng chảy thời gian trong một khu vực, khiến giờ trôi qua như phút hoặc phút trôi qua như giờ#!"
 CLIOS_KISS_PERK_EFFECT: "Với một [character_interaction|E], ngươi có thể khiến [title|E] được nhắm đến trở về với người nắm giữ trước đó.\n#F Đưa thứ gì đó hoặc ai đó từ quá khứ vào hiện tại#!"
 TEMPORAL_UNDERSTANDING_PERK_EFFECT: "#F Bước tới trong thời gian để thấy hậu quả lâu dài của hành động ngươi#!"
 SUMMON_HISTORY_PERK_EFFECT: "Được tiếp cận một dư âm ngẫu nhiên của một hiện vật lịch sử mỗi #V 3#! năm.\n#F Đưa một khoảng thời gian cụ thể vào hiện tại#!"
  
 # Dementation #
 
 INCUBUS_PASSION_PERK_EFFECT: "Thêm hiệu ứng cho dementation [character_interaction|E], cho phép gây một hiệu ứng tiêu cực tùy theo cộng hưởng của mục tiêu.\n#F Thổi bùng một trong bốn thể dịch của nạn nhân, khiến họ cảm nhận, khuếch đại, hoặc làm tê liệt cảm xúc của mình#!"
 PASSION_PERK_EFFECT: "Thêm hiệu ứng cho dementation [character_interaction|E], cho phép trao [GetModifier('passion_perk_modifier').GetNameWithTooltip].\n#F Khuếch đại hoặc làm dịu cảm xúc hiện có trong nạn nhân#!"
 THE_HAUNTING_PERK_EFFECT: "Thêm hiệu ứng cho dementation [character_interaction|E], cho phép trao [GetModifier('the_haunting_perk_modifier').GetNameWithTooltip].\n#F Gây ra những cảnh ảo giác điên loạn lên nạn nhân#!"
 EYES_OF_CHAOS_PERK_EFFECT: "#F Có được hiểu biết về bản chất của một thứ gì đó qua những khuôn mẫu dường như ngẫu nhiên#!"
 SILENCE_THE_SANE_MIND_PERK_EFFECT: "Thêm hiệu ứng cho dementation [character_interaction|E], cho phép trao [GetModifier('silence_the_sane_mind_perk_modifier').GetNameWithTooltip].\n#F Ngăn chặn một phần tâm trí của nạn nhân, khiến họ bối rối, giận dữ, đờ đẫn, v.v.#!"
 FIRE_VOICE_PERK_EFFECT: "Thêm hiệu ứng cho dementation [character_interaction|E], cho phép trao [GetModifier('POD_frenzy_terrified_populace_modifier').GetNameWithTooltip].\n#F Khiến cả người phàm và Hậu duệ Cain rơi vào Rötschreck#!"
 TOTAL_INSANITY_PERK_EFFECT: "Thêm hiệu ứng cho dementation [character_interaction|E], cho phép trao một trong năm đặc điểm căng thẳng.\n#F Cho ai đó năm chứng rối loạn tâm thần tạm thời#!"
 STAIN_THE_SOUL_PERK_EFFECT: "Thêm hiệu ứng cho dementation [character_interaction|E], cho phép trao một đặc điểm tinh thần tiêu cực vĩnh viễn.\n#F Gây ra một chứng rối loạn tâm thần vĩnh viễn lên nạn nhân#!"
 CHILDMIND_PERK_EFFECT: "Thêm hiệu ứng cho dementation [character_interaction|E], cho phép hạ cấp đặc điểm thông minh.\n#F Cho ai đó một "cuộc cắt não tâm linh", làm giảm các thuộc tính Tinh thần của họ#!"
 COBBLE_THE_ROAD_PERK_EFFECT: "Thêm hiệu ứng cho dementation [character_interaction|E], cho phép biến đặc điểm nhân cách đức tính của mục tiêu thành đặc điểm đối lập của nó.\n#F Thay đổi các đức tính của ai đó, có thể khiến họ rời xa đạo lý họ đã tiếp nhận#!"
 PRISON_OF_THE_MIND_PERK_EFFECT: "Thêm hiệu ứng cho dementation [character_interaction|E], cho phép trao [GetModifier('prison_of_the_mind').GetNameWithTooltip].\n#F Nhốt tâm trí ai đó trong một trạng thái hoang tưởng và để cơ thể họ đờ đẫn#!"
 LUNATIC_ERUPTION_PERK_EFFECT: "Như một [character_interaction|E], cho phép ngươi khởi động một [GetModifier( 'lunatic_summon_modifier' ).GetNameWithTooltip|L].\n#F Gợi lên một cơn cuồng nộ điên loạn trong mọi sinh vật có tri giác trong phạm vi vài dặm#!"
 TOUCH_OF_THE_SAINTS_PERK_EFFECT: "Như một [character_interaction|E]. cho phép ngươi chữa lành đặc điểm căng thẳng và đặc điểm tinh thần tiêu cực.\n#F Chữa lành cho một cá nhân khỏi các chứng rối loạn tâm thần và bất cứ điều gì ảnh hưởng đến tâm trí họ#!"
 
 # Melpominee #
 
 THE_MISSING_VOICE_PERK_EFFECT: "#F Ném tiếng nói của ngươi đến bất cứ đâu trong tầm nhìn#!"
