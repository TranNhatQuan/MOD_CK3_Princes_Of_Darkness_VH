 # Animalism # 
 
 BOND_FAMULUS_PERK_EFFECT: "Với vai trò [character_interaction|E] ngươi có thể #V $POD_bind_famulus$#!, dùng Huyết Ước trói buộc một con vật và tạo liên kết tâm trí với nó."
 BOND_FAMULUS_PERK_FLAVOR: "#flavor Chỉ có cái chết mới giải thoát một famulus khi đã bị trói buộc. Chỉ cần thường xuyên được nhận Huyết của ma cà rồng, famulus sẽ không già đi#!"
 SENSE_THE_BEAST_PERK_FLAVOR: "$countermeasures_unlocks_t1_supernatural_high_alert$\n#flavor Ma cà rồng có thể cảm nhận [Glossary('Beast','game_concept_beast_desc')] hiện diện trong người phàm, ma cà rồng, và các sinh vật siêu nhiên khác, nhận biết được bản chất, cơn đói, và mức độ thù địch của chúng#!"
 FERAL_WHISPERS_PERK_FLAVOR: "#flavor Ma cà rồng có thể giao tiếp với muông thú của hoang dã và thành thị. Feral Whispers cho phép giao tiếp hai chiều với động vật. Một con mèo có thể không quan tâm đến việc tranh luận về giáo lý nhà thờ nhưng lại vui vẻ bàn về việc thiếu con mồi quanh nhà thờ lớn địa phương.#!"
 ANIMAL_SUCCULENCE_PERK_FLAVOR: "#flavor Ma cà rồng thường thấy máu động vật thiếu dưỡng chất. Nó có vị khó chịu, và hầu như không nuôi dưỡng được huyết quản của kẻ bất tử. Tuy vậy, một số bậc trưởng lão tinh thông Animalism đã phát triển đủ sự tương hợp với máu muông thú để có thể nuôi sống bản thân hiệu quả từ nơi hoang dã.#!"
 QUELL_THE_BEAST_PERK_FLAVOR: "#flavor Bằng cách khóa mắt vào mục tiêu, ma cà rồng khuất phục [Glossary('Beast','game_concept_beast_desc')] nội tâm của mình vào trạng thái ngủ tạm thời. Người phàm bị ảnh hưởng như vậy trở nên thờ ơ, không thể làm gì khác ngoài việc giữ mình sống sót, còn ma cà rồng thì các bản năng dã thú tạm thời lắng xuống, dù tốt hay xấu#!"
 CALL_OF_THE_WILD_PERK_EFFECT: "Mở khóa khả năng tuyển mộ [GetMaA('POD_controlled_animals').GetName] làm [men_at_arms|E]. Chúng sẽ khởi đầu yếu, ngươi chỉ có thể có một trung đoàn loại này và quy mô của chúng không phụ thuộc vào bất kỳ cải tiến nào ngươi có."
 CALL_OF_THE_WILD_PERK_FLAVOR: "#flavor Với năng lực này, [Glossary('Beast','game_concept_beast_desc')] truyền vào giọng nói của ma cà rồng một sự tương hợp sâu sắc với một loài động vật nhất định. Nàng gào, rít, kêu quạ quạ, hoặc bắt chước tiếng kêu của động vật khác. Bất kỳ con vật nào cùng loài trong tầm nghe đều bị gọi tới bên ma cà rồng, và một số sẽ đến, tùy theo năng lực bẩm sinh của ma cà rồng#!"
 SUBSUME_THE_SPIRIT_PERK_FLAVOR: "#flavor Ma cà rồng có thể chuyển hoàn toàn tâm trí mình vào thân xác một con vật. Họ có thể điều khiển con vật và sử dụng tự do các giác quan của nó, kể cả vào ban ngày nếu họ giữ được sự tỉnh táo.#!"
 UNLIVING_HIVE_PERK_FLAVOR: "#flavor Thường thấy nhất ở tộc Nosferatu, năng lực đáng sợ này cho phép người sử dụng mở rộng ảnh hưởng lên động vật tới cả bầy côn trùng như ruồi hay gián.#!"
 DRAWING_OUT_THE_BEAST_PERK_EFFECT: "$countermeasures_unlocks_t2_supernatural_high_alert$"
 DRAWING_OUT_THE_BEAST_PERK_FLAVOR: "#flavor Ma cà rồng có thể phóng [Glossary('Beast','game_concept_beast_desc')] của mình ra ngoài vào lúc phẫn cuồng vì khiếp sợ hoặc giận dữ, truyền nó sang một đối tượng gần đó, dù là người phàm hay ma cà rồng. Người đó lập tức trải qua cơn phẫn cuồng thay vào đó, gây ra một cuộc tàn sát không thương xót hoặc bỏ chạy trong kinh hoàng tùy theo tác nhân kích hoạt#!"
 ANIMAL_DOMINION_PERK_FLAVOR: "Với vai trò [character_interaction|E], cho phép ngươi gọi vật cưng ra chiến trận.\nCó thể tuyển mộ nhiều loại động vật làm [men_at_arms|E].\n#flavor Năng lực mà ma cà rồng nắm giữ trên muông thú giờ đã đủ lớn để chỉ huy cả đàn và bầy như thể chúng là phần mở rộng của cơ thể mình. Chỉ với một cử chỉ, động vật sẵn sàng bỏ mạng hàng chục, thậm chí hàng trăm, để làm hài lòng chủ nhân của chúng#!"
 TONGUE_OF_BEASTS_PERK_FLAVOR: "#flavor Năng lực này mở rộng ân sủng của Whispers to the Wild. Thay vì chỉ có thể nói chuyện với một con vật duy nhất, ma cà rồng có thể nói chuyện với mọi động vật mà không cần thiết lập giao tiếp bằng mắt.#!"
 SEND_THE_EIGHTH_PLAGUE_PERK_EFFECT: "Với vai trò [character_interaction|E], ngươi có thể triệu hồi [GetModifier('weather_magic_plague_modifier').GetNameWithTooltip] lên vương quốc của kẻ địch."
 SEND_THE_EIGHTH_PLAGUE_PERK_FLAVOR: "#flavor Đây là một trong những năng lực tàn phá nhất giữa mọi [Glossary('Disciplines','game_concept_discipline_desc')]. Một Gangrel cổ xưa tên Valentinian đã chứng minh tiềm năng phá hủy khổng lồ của nó không lâu sau Cuộc Thập Tự Chinh Thứ Tư. Tức giận vì các Cainite Ý xâm phạm lãnh địa của mình, hắn đã vận dụng sự tinh thông Animalism và giáng nạn đói xuống cả một thị trấn buôn bán.#!"
 CRIMSON_FURY_PERK_EFFECT: "$countermeasures_unlocks_t3_supernatural_high_alert$\nKhiến sự kiện [unconquered_soul|E] dễ xảy ra hơn đối với những kẻ hành diablerie tìm cách hấp thụ linh hồn ngươi."
 CRIMSON_FURY_PERK_FLAVOR: "#flavor Năng lực này là đề tài của nhiều lời đồn và suy đoán, vì nó gần như không có tác động rõ rệt nào. Khi đạt tới cấp độ tinh thông này, ma cà rồng có thể chọn để [Glossary('Beast','game_concept_beast_desc')] của mình tự do lang thang trong huyết quản. Máu của hắn gây ra phẫn cuồng ở người phàm và ma cà rồng nào nếm phải. Nếu một kẻ hành diablerie thành công hấp thụ linh hồn của ma cà rồng, nàng có thể sẽ gặp kết cục khủng khiếp khi Beast của ma cà rồng ăn nàng từ bên trong#!"
 EYES_OF_THE_FOREST_PERK_FLAVOR: "#flavor Năng lực đầy kinh ngạc này là gốc rễ của nhiều truyện dân gian về những khu rừng u ám và núi non hiểm trở. Muông thú và cả côn trùng trong khu vực đóng vai trò như mắt và tai của ma cà rồng, cho nàng hiểu biết sâu sắc về những gì diễn ra trong đêm tối trên lãnh địa của nàng.#!"
 PLAGUE_OF_BEASTS_PERK_FLAVOR: "#flavor Một Methuselah tinh thông Animalism có thể gây ra những trận dịch quy mô như trong Kinh Thánh. Mở rộng từ Call the Wild, ma cà rồng triệu tập động vật đến với nàng. Tuy nhiên, thay vì gọi bằng tiếng của một loài, [Glossary('Beast','game_concept_beast_desc')] tự nó gào thét vang xa hàng dặm hoặc hàng cây số. Điều này triệu tập mọi động vật tràn tới quanh Cainite, gây ra hỗn loạn tột độ.#!"

 # Auspex # 
 
 CLAIRVOYANCE_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$ \n Tù nhân của ngươi có ít cơ hội trốn thoát khỏi ngục giam hơn.\n#flavor Bằng cách nhắm mắt và bước vào trạng thái xuất thần nhẹ, ma cà rồng trở thành chủ nhân của môi trường xung quanh mình.#!"
 HEIGHTENED_SENSES_PERK_EFFECT: "Tù nhân của ngươi có ít cơ hội trốn thoát khỏi ngục giam hơn.\n#flavor Giác quan của ma cà rồng trở nên nhạy bén đến mức siêu nhiên, cho họ khả năng nhìn trong bóng tối tuyệt đối, nghe được tần số siêu âm và ngửi được nỗi sợ hãi của con mồi đang nép mình.#!"
 PREMONITION_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$ \n Tốc độ Tiến triển [espionage|E]: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!.\nTù nhân của ngươi có ít cơ hội trốn thoát khỏi ngục giam hơn.\n#flavor Ma cà rồng trải nghiệm những tia sáng linh cảm. Chúng có thể mang hình thức của lông gáy dựng lên, cảm hứng bất ngờ, hay cả những linh ảnh sống động. Dù chưa bao giờ quá chính xác, những linh ảnh này có thể đẩy ma cà rồng tránh khỏi hiểm nguy hoặc hé lộ một sự thật trước đó bị bỏ qua.#!"
 PREMONITION_PERK_BONUS_VALUE: "[GetPerk('premonition_perk').GetName(GetPlayer)]"
 SCRY_THE_SOUL_PERK_EFFECT: "Cho phép ngươi thấy được [resonance|E] của các nhân vật khác.\nNgươi có thể chọn loại [resonance|E] mà người phàm bị bắt gặp trong Cuộc Săn ở [journey|E] Thủ Phủ của ngươi sẽ có.\n#flavor Bằng cách tập trung vào một người, ma cà rồng có thể cảm nhận trạng thái tâm lý của người đó như một vầng hào quang màu sắc biến đổi. Hào quang tiết lộ rất ít thông tin chính xác nhưng cung cấp manh mối về nhiều chủ đề, ví như trạng thái cảm xúc, resonance, và các đặc điểm siêu nhiên.#!"
 SENSE_THE_UNSEEN_PERK_EFFECT: "#flavor Giác quan của ma cà rồng trở nên nhạy với những chiều không gian vượt ngoài thế giới thường nhật, cho phép họ cảm nhận được những sự hiện diện mà mắt thường không thấy được.#!"
 SHARE_THE_SENSES_PERK_EFFECT: "Tốc độ Tiến triển [espionage|E]: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!.\n#flavor Bằng cách vươn tâm trí ra, ma cà rồng có thể kết nối vào giác quan của một người phàm hoặc ma cà rồng khác, nhìn, nghe, và cảm nhận như họ.#!"
 SHARE_THE_SENSES_PERK_BONUS_VALUE: "[GetPerk('share_the_senses_perk').GetName(GetPlayer)]"
 SPIRITS_TOUCH_PERK_EFFECT: "Tốc độ Tiến triển [espionage|E]: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!.\n#flavor Bằng cách chạm vào một vật vô tri hoặc mặt đất, ma cà rồng có thể cảm nhận được dư âm cảm xúc. Những ai đã từng cầm vật đó hoặc đi qua con đường này trong quá khứ để lại manh mối cho người đọc tinh tường.#!"
 SPIRITS_TOUCH_PERK_BONUS_VALUE: "[GetPerk('spirits_touch_perk').GetName(GetPlayer)]"
 TELEPATHY_PERK_EFFECT: "$countermeasures_unlocks_t3_all_seeing_eye$ \n Ngươi có thể dùng [character_interaction|E] Thần Giao Cách Cảm để tìm bí mật.\n#flavor Ở những cấp độ cao nhất của Auspex, ma cà rồng giờ có thể đọc được tâm trí theo đúng nghĩa đen, cũng như phóng suy nghĩ của chính mình vào tâm trí người khác.#!"
 PSYCHIC_PROJECTION_EFFECT: "#flavor Huyết Tộc có năng lực này phóng giác quan của nàng ra khỏi lớp vỏ thân xác, bước ra khỏi cơ thể mình như một thực thể tư tưởng thuần túy.#!"
 DISCERN_THE_AURA_PERK_EFFECT: "Với vai trò [character_interaction|E], cho phép ngươi mời một người phàm có [skills|E] theo ý ngươi chọn đến triều đình của mình.\n#F Quét một nhóm người tìm ra kẻ mang một đặc điểm cụ thể trong hào quang của họ.#!"
 THE_MIND_REVEALED_PERK_EFFECT: "Với vai trò [character_interaction|E], cho phép ngươi biết mọi âm mưu của mục tiêu.\n#F Liên tục đọc suy nghĩ của một người để biết họ đang nghĩ gì và sắp làm gì.#!"
 PERSONALITY_METAMORPH_PERK_EFFECT: "Với vai trò [character_interaction|E], cho phép ngươi thay đổi mọi đặc điểm tính cách của mình.\nVới vai trò [character_interaction|E], cho phép ngươi thay đổi xu hướng tính dục của mình.\n#F Khoác lên những nhân cách giả tưởng như của chính mình.#!"
 SUPERNAL_AWARENESS_PERK_EFFECT: "$countermeasures_unlocks_t4_all_seeing_eye$ \nNgươi sẽ nhận được thông báo nếu có ai định giết bạn bè hoặc gia đình ngươi.\nNgươi sẽ nhận được thông báo nếu có ai định quyến rũ người yêu hoặc tình nhân của ngươi.\nTù nhân của ngươi có ít cơ hội trốn thoát hơn.\n#F Cảm nhận sự kiện và hành động ở bất cứ đâu trên thế giới.#!"
 OMNISCIENCE_PERK_EFFECT: "Với vai trò [character_interaction|E], cho phép ngươi biết mọi bí mật của mục tiêu.\n#F Biết được tính cách và thân phận của mọi sinh vật quanh ngươi.#!"
 MASTER_OF_THE_DOM_PERK_EFFECT: "Tự động tạo ra (hoặc nâng cấp) một công trình miễn phí ở mọi tỉnh trong quận Thủ Phủ của ngươi mỗi #V 5#! năm.\n#F Hòa hợp với một vùng đất và biết mọi điều xảy ra trên đó, đồng thời có được quyền năng đối với vùng đất và cư dân của nó.#!"
