 NECROMANCY_POSSESSION_PERK_EFFECT: "Các mục tiêu có linh hồn bị đánh dấu để hồi sinh hoặc bị hành quyết qua [executions|E] $EXECUTION_CONVERT_TO_WRAITH$ sẽ lẩn khuất lại mà không đi tới [UmbraGlossaryLocalized('shadowlands','Âm Phủ')]."
 NECROMANCY_POSSESSION_PERK_FLAVOR: "#flavor Daemonic Possession cho phép một nhà gọi hồn dẫn một linh hồn vào một xác chết vừa mới qua đời.#!"

