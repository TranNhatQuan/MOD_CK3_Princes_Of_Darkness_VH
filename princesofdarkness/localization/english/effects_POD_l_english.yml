 TOUCH_THE_NETHER_PERK_EFFECT: "Cho phép ngươi tương tác với các thực thể trong [umbra|E] khi ngươi ở thế giới vật chất."
 TOUCH_THE_NETHER_PERK_FLAVOR: "#flavor Trong lúc triệu hồi Touch the Nether, một nhà gọi hồn có thể đứng trên cả hai phía của Shroud; nàng hiện thân bằng thể xác ở [UmbraGlossaryLocalized('shadowlands','Âm Phủ')] trong khi vẫn giữ thân xác ở cõi người sống.#!"
