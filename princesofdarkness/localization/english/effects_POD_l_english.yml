 #Inquisitors convictions
 OCULI_TRUST_PERK_TEXT: "Mở khóa [character_interaction|E] Chỉ Dạy Tâm Linh cho phép ngươi truyền dạy các đặc điểm đức hạnh của mình cho các Vị Thẩm Tra Viên khác.\nMở khóa một chiêu thức đấu tay đôi.\n#flavor Bằng cách ca tụng Chúa, đặc vụ có thể truyền cho người khác lòng yêu mến Ngài và luật lệ của Ngài.#!"
 SISTERS_CHORALE_PERK_TEXT: "Mở khóa quyết định nhỏ Thử Thách Đức Tin cho phép ngươi có cơ hội loại bỏ các đặc điểm tội lỗi của mình và thay bằng các đặc điểm mộ đạo tương ứng.\n#flavor Rút sức mạnh, tri thức hoặc sự bảo hộ từ một bài tụng ca cộng đồng.#!"
 RED_MARCH_PERK_EFFECT_TEXT: "#flavor Nghi thức này cho phép di chuyển nhanh chóng bất kể mệt mỏi và điều kiện khắc nghiệt, sau khi đã van cầu đủ trước Chúa.#!"
 OCULI_SHEPHERD_PERK_TEXT: "Mở khóa [deceitful_progress_hostile_schemes_decision|E].\n#flavor Cho phép Con Mắt Của Chúa ẩn mình giữa chốn đông người khi thực hiện Thánh Ý và làm mờ tâm trí những kẻ cản trở sứ mệnh thần thánh của hắn.#!"
 MURNAU_OBLIGE_PERK_TEXT: "Mở khóa [diligent_development_focus_decision|E].\n#flavor Vẫn là một gia tộc quý tộc tận cốt lõi, người Murnau xem người khác như những kẻ mình che chở. Sự thịnh vượng của lãnh địa họ là một nghĩa vụ không kém phần thần thánh so với sự tận tâm của họ với Tòa Dị Giáo.#!"
 ACRE_RESURRECTION_PERK_TEXT: "Có thể tuyển [GetMaA('vampires_hunters').GetName] làm [men_at_arms|E].\nMở khóa một [character_interaction|E] cho phép chữa trị hầu hết các bệnh tật trần tục trên một nhân vật.\n#flavor Một số hiệp sĩ được ban cho thần quyền để kiểm soát sự lên xuống của sinh lực trong bản thân và người khác. Họ thậm chí có thể dùng chính sức mạnh của sự sống để làm bốc hơi bản chất địa ngục của kẻ bị đọa đày.#!"
 RED_FORTUNES_PERK_TEXT: "Có thể tuyển [GetMaA('demons_hunters').GetName] làm [men_at_arms|E].\n#flavor Qua nghi thức thánh thiêng này, một hành giả có thể ban phước cho một nhóm chiến binh có vũ trang trên đường ra trận đối đầu kẻ thù.#!"
 MURNAU_MIRROR_PERK_TEXT: "Có thể tuyển [GetMaA('monsters_hunters').GetName] làm [men_at_arms|E].\nMở khóa một chiêu thức đấu tay đôi.\n#flavor Khả năng đối đầu ngang ngửa với kẻ địch siêu nhiên, được trang bị sức mạnh và tri thức mà lẽ ra không nên có. Người Murnau gọi đó là ơn trên soi sáng, kẻ khác dùng những lời lẽ kém tốt đẹp hơn.#!"
 OCULI_LITURGY_PERK_TEXT: "Tuyển một khách mời giờ tốn 50% vàng ít hơn.\n#flavor Bằng việc đọc kinh văn, Con Mắt Của Chúa có thể áp đặt sự tận tụy của mình lên một cá nhân khác.#!"
 SISTERS_GOSPEL_PERK_TEXT: "Một tù nhân bị tra tấn giờ luôn tiết lộ bí mật của họ nếu có.\n#flavor Ban cho các Chị Em kỹ năng tuyệt vời trong tranh luận, hùng biện và, nếu cần, tra vấn.#!"
 ACRE_CATECHUMEN_PERK_TEXT: "Có thể đấu tập với [knights|E] của chính mình trong [single_combat_fight|E] để nhận [modifiers|E].\nMở khóa một chiêu thức đấu tay đôi.\n#flavor Cho phép vị thẩm tra viên thể hiện những bài học sớm về sự dũng cảm, khiêm nhường và kiên định.#!"
 ACRE_FLESH_PERK_TEXT: "Mở khóa một chiêu thức đấu tay đôi.\n#flavor Hiệp sĩ được ban cho quyền năng thay đổi khả năng thể chất của mình bằng cách viện đến đức hạnh bất khuất của bản thân.#!"
 ACRE_FLIGHT_PERK_TEXT: "Mở khóa một chiêu thức đấu tay đôi.\n#flavor Cho phép vị thẩm tra viên gặt lấy trận cuồng phong thần thánh khi giao chiến với tay sai của Kẻ Nghịch Thù.#!"
 ACRE_AUTO_PERK_TEXT: "Mở khóa một chiêu thức đấu tay đôi.\n#flavor Một lý do cốt yếu khiến tay sai của Kẻ Nghịch Thù khiếp sợ các Hiệp Sĩ Của Chúa, phước lành này cho phép Vị Thẩm Tra Viên tập trung đức hạnh và sức mạnh của mình vào đòn đánh chắc chắn sẽ định đoạt bất kỳ trận đấu tay đôi nào.#!"
 RED_VIGIL_PERK_TEXT: "#flavor Nghi thức này cung cấp cho đối tượng năng lượng giúp họ khỏi cần ngủ hay nghỉ ngơi.#!"
 RED_SUNSTONE_PERK_TEXT: "$countermeasures_unlocks_t1_all_seeing_eye$ \n#flavor Truyền vào một tảng đá bình thường phước lành của tạo vật đầu tiên của Chúa, Mặt Trời. Độ sáng của viên đá sau đó chịu sự điều khiển bởi đức hạnh của người mang nó.#!"
 RED_FORGE_PERK_TEXT: "#flavor Thánh hóa quá trình rèn vũ khí để tạo ra binh khí được ban phước.#!"
 SISTERS_LUX_PERK_TEXT: "$countermeasures_unlocks_t1_supernatural_high_alert$ \n #flavor Vọng lại lời của Đức Chúa Cha, vị thẩm tra viên tuyên xưng 'Hãy có ánh sáng!' và một vòng hào quang trắng dịu dàng hiện ra quanh nàng, soi rõ các sinh vật siêu nhiên đúng như bản chất của chúng.#!"
 SISTERS_HOSANNA_PERK_TEXT: "Mở khóa một chiêu thức đấu tay đôi.\n#flavor Các Vị Thẩm Tra Viên dùng quyền năng này để bắt lấy "tần số" tâm linh của Bài Ca Thiên Đàng, dùng sức mạnh của nó để tôn vinh Chúa.#!"
 SISTERS_ORATORIO_PERK_TEXT: "Mở khóa một chiêu thức đấu tay đôi.\n#flavor Cho phép Chị Em cất cao tiếng hát và tràn ngập người nghe bằng ánh sáng chói lọi của đức tin nàng, một trải nghiệm tàn khốc đối với những kẻ nô lệ cho tội lỗi. #!"
 MURNAU_KNOWLEDGE_PERK_TEXT: "$countermeasures_unlocks_t1_supernatural_high_alert$ \n #flavor Gia tộc Von Murnau đã bị nguyền rủa (hay được ban phước) với một sự thân thuộc bẩm sinh và khả năng cảm nhận mọi hình thức đồi bại qua nhiều thế hệ.#!"
 MURNAU_WREATHED_PERK_TEXT: "#flavor Sự tinh thông mặt tối trong chính bản chất của người Murnau cho phép họ tác động điều đó lên người khác. "Dù bước qua thung lũng bóng chết..." #!"
 MURNAU_ARCANA_PERK_TEXT: "Mở khóa một chiêu thức đấu tay đôi.\n#flavor Khả năng cản trở, né tránh hoặc hóa giải hành động của tay sai địa ngục. Khả năng này thường phải trả giá bằng linh hồn của Vị Thẩm Tra Viên nhưng cho phép phản chiếu quyền năng siêu nhiên lại kẻ dùng nó khi đã tinh thông.#!"
 OCULI_SIGHT_PERK_TEXT: "Vô hiệu hóa một số chiêu thức đấu tay đôi của địch dựa trên obfuscate.\n#flavor Sight cho phép Vị Thẩm Tra Viên tìm ra các sinh vật siêu nhiên dù chúng cố gắng tránh bị phát hiện.#!"
 OCULI_WINE_PERK_TEXT: "#flavor Vị thẩm tra viên có thể lấy một vật thể bình thường và biến nó thành thứ khác hoặc đưa mô chết hay sắp chết trở lại trạng thái khỏe mạnh.#!"



