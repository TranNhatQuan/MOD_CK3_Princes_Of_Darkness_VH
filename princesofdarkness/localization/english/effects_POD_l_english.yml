 # KJ legacy #
 
 FUXI_LEGACY_PERK_EFFECT: "#F Phục Hy, vị đầu tiên trong Tam Hoàng, đã dạy dân mình cách đánh cá và săn bắn, cách chăn nuôi gia súc và tằm, cùng cách xây dựng nhà cửa vững chắc. Phục Hy cũng tạo ra bát quái dùng để chiêm bốc với Kinh Dịch.#!"
 SHENNONG_LEGACY_PERK_EFFECT: "#F Thần Nông, vị thứ hai trong Tam Hoàng, đã chỉ cho dân mình cách cày ruộng và dệt vải, cùng cách dâng lễ vật đúng cách cho các quyền năng của Thiên Đình. Thần Nông cũng là thầy thuốc đầu tiên.#!"
 HUANGTI_LEGACY_PERK_EFFECT: "#F Hoàng Đế là vị thứ ba trong Tam Hoàng. Ông là nhà giả kim đầu tiên và người đóng tàu đầu tiên. Ông cũng phát triển áo giáp và những đội quân sớm nhất, để chế phục các bộ lạc man rợ đe dọa dân mình.#!" 
 
